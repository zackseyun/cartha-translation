source:
  edition: SBLGNT
  text: ἱκανὸν μὲν οὖν χρόνον διέτριψαν παρρησιαζόμενοι ἐπὶ τῷ κυρίῳ τῷ μαρτυροῦντι ⸀τῷ λόγῳ τῆς χάριτος αὐτοῦ, διδόντι σημεῖα καὶ τέρατα γίνεσθαι διὰ τῶν χειρῶν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/003.yaml
  text: So they stayed there a considerable time[a], speaking boldly for the Lord, who was bearing witness to the word of his grace, granting signs and wonders to be done through their hands.
translation:
  language: vi
  text: Vì vậy, họ ở lại đó khá lâu, mạnh dạn nói, nhờ cậy Chúa[a]. Chúa làm chứng cho lời ân điển của Ngài và ban cho các dấu lạ và phép mầu được thực hiện qua tay họ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “mạnh dạn nói trong Chúa.” Cụm từ Hy Lạp có thể nhấn mạnh rằng sự mạnh dạn của họ đặt nền tảng nơi Chúa hoặc được thể hiện trong mối liên hệ với Ngài.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἱκανὸν ... χρόνον
  choice: khá lâu
  rationale: Thành ngữ chỉ một khoảng thời gian đáng kể; “khá lâu” tự nhiên trong tiếng Việt hiện đại mà không cường điệu thời lượng.
- source_word: διέτριψαν
  choice: họ ở lại đó
  rationale: Động từ diễn tả việc lưu lại hoặc trải qua một thời gian tại một nơi; thêm “đó” làm rõ địa điểm đã nêu trong ngữ cảnh.
- source_word: παρρησιαζόμενοι
  choice: mạnh dạn rao giảng
  rationale: Diễn đạt hành động nói công khai, không sợ hãi. Trong bối cảnh truyền giáo, “rao giảng” tự nhiên và rõ hơn “nói”, dù động từ Hy Lạp tự nó nhấn mạnh sự mạnh dạn trong lời nói.
- source_word: ἐπὶ τῷ κυρίῳ
  choice: cho Chúa
  rationale: Giới từ ἐπί với tặng cách ở đây có thể chỉ nền tảng, sự nương cậy hoặc mối liên hệ với Chúa. “Cho Chúa” diễn đạt tự nhiên việc họ rao giảng trong sự phục vụ Ngài; các khả năng khác được giữ trong chú thích.
- source_word: τῷ κυρίῳ
  choice: Chúa
  rationale: Giữ nguyên tước hiệu κύριος, không tự ý thêm tên “Giê-su” dù trong mạch văn sách Công Vụ, danh xưng này rất có thể chỉ Chúa phục sinh.
- source_word: τῷ μαρτυροῦντι
  choice: làm chứng
  rationale: Phân từ hiện tại mô tả sự chứng thực đang diễn ra của Chúa đối với lời được rao giảng.
- source_word: τῷ λόγῳ τῆς χάριτος αὐτοῦ
  choice: cho lời ân điển của Ngài
  rationale: Giữ cấu trúc “lời ân điển” của nguyên văn, có thể chỉ lời nói về ân điển hoặc lời được đặc trưng bởi ân điển của Ngài.
- source_word: διδόντι
  choice: bằng cách cho
  rationale: Diễn tả việc Chúa ban hoặc khiến cho các việc kỳ diệu xảy ra; cấu trúc này cũng làm rõ phương cách Ngài chứng thực lời.
- source_word: σημεῖα καὶ τέρατα
  choice: các dấu lạ và phép mầu
  rationale: Cụm từ Kinh Thánh quen thuộc, giữ cả ý nghĩa chứng thực của σημεῖα và tính gây kinh ngạc của τέρατα.
- source_word: γίνεσθαι
  choice: được thực hiện
  rationale: Cách diễn đạt thụ động phù hợp với việc các dấu lạ và phép mầu xảy ra qua các sứ giả như những công cụ.
- source_word: διὰ τῶν χειρῶν αὐτῶν
  choice: qua tay họ
  rationale: Giữ hình ảnh cụ thể và ý nghĩa phương tiện của thành ngữ Hy Lạp.
theological_decisions:
- issue: Đối tượng được gọi là “Chúa” trong các phân từ theo sau
  choice: Chỉ dịch là “Chúa”, không thêm “Giê-su”.
  alternative: “Chúa Giê-su” hoặc hiểu tổng quát là Đức Chúa Trời.
  rationale: Nguyên văn chỉ có τῷ κυρίῳ. Cách dịch này giữ nguyên mức độ xác định của bản Hy Lạp và không đưa thêm danh xưng không có trong câu.
- issue: Sắc thái của ἐπὶ τῷ κυρίῳ
  choice: “cho Chúa” trong chính văn
  alternative: “trong Chúa” hoặc “nhờ cậy Chúa”
  rationale: Cụm từ có thể nói đến nền tảng, phạm vi hoặc sự nương cậy. Chính văn dùng cách nói tự nhiên trong tiếng Việt, còn chú thích bảo tồn tính đa nghĩa thật sự của nguyên văn.
- issue: Quan hệ giữa việc Chúa làm chứng và các dấu lạ, phép mầu
  choice: Dùng “bằng cách cho” để thể hiện các dấu lạ và phép mầu là phương cách Chúa chứng thực lời.
  alternative: 'Nối hai phân từ song song: “Ngài làm chứng... và ban cho...”'
  rationale: Hai phân từ cùng quy về “Chúa”; cách diễn đạt được chọn phản ánh hợp lý mối quan hệ phương tiện trong ngữ cảnh mà không thay đổi chủ thể hành động.
translation_notes:
  register: Văn phong trang trọng, sáng rõ và tự nhiên đối với độc giả Việt Nam hiện đại. Dùng “Ngài” để quy chiếu về Chúa; giữ các thuật ngữ Kinh Thánh quen thuộc như “ân điển”, “dấu lạ” và “phép mầu”, đồng thời tránh thêm sự xác định thần học không có trong nguyên văn.
