    rationale: Trong ngữ cảnh này, ἐπί với tặng cách có thể chỉ nền tảng hoặc sự nương cậy. “Nhờ cậy Chúa” là cách diễn đạt Việt ngữ tự nhiên, phù hợp với sắc thái này; chú thích giữ phương án “trong Chúa”.
