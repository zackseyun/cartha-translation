  yaml_path: translation/nt/acts/014/007.yaml
  text: And there they were preaching the good news[a].
translation:
  language: vi
  text: Và tại đó, họ rao truyền Tin Mừng.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “Và tại đó, họ loan báo tin mừng.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀκεῖ
  choice: Và tại đó
  rationale: κἀκεῖ kết hợp καί và ἐκεῖ, mang nghĩa “và tại đó” hoặc “tại đó cũng”. Cách dịch này giữ liên từ và phù hợp với mạch kể về việc họ chạy đến các thành trong câu trước.
- source_word: εὐαγγελιζόμενοι
  choice: rao truyền Tin Mừng
  rationale: Phân từ của εὐαγγελίζω chỉ việc loan báo tin mừng, trong ngữ cảnh Công Vụ là sứ điệp Tin Mừng. “Rao truyền” tự nhiên, trang trọng và giữ được sắc thái công bố.
- source_word: εὐαγγελιζόμενοι ἦσαν
  choice: họ tiếp tục rao truyền
  rationale: Kết cấu diễn tiến gồm phân từ hiện tại với động từ ἦσαν ở thì chưa hoàn thành diễn tả hành động đang tiếp diễn trong quá khứ. “Tiếp tục rao truyền” thể hiện khía cạnh kéo dài một cách tự nhiên trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, rõ ràng và trang trọng vừa phải. Viết hoa “Tin Mừng” theo cách dùng phổ biến khi chỉ sứ điệp Kitô giáo; chú thích giữ phương án thuần nghĩa từ vựng “tin lành” mà không thay đổi nội dung.
