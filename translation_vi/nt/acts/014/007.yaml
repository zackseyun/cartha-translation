- from: Và tại đó, họ tiếp tục rao truyền Tin Mừng.[a]
  to: Và tại đó, họ rao truyền Tin Mừng.[a]
  rationale: The revision retains the connective and location of κἀκεῖ and the gospel-proclamation sense of εὐαγγελίζω, while avoiding the additional implication carried by “tiếp tục.” The Vietnamese finite verb is naturally interpreted in the past narrative setting and does not force a stronger aspectual claim than the Greek supports.
