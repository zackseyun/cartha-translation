id: ACT.14.4
reference: Acts 14:4
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐσχίσθη δὲ τὸ πλῆθος τῆς πόλεως, καὶ οἱ μὲν ἦσαν σὺν τοῖς Ἰουδαίοις οἱ δὲ σὺν τοῖς ἀποστόλοις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/004.yaml
  text: But the people of the city were divided[a], and some were with the Jews and some with the apostles.
translation:
  language: vi
  text: 'Nhưng dân trong thành bị chia rẽ[a]: một số đứng về phía người Do Thái, còn số khác đứng về phía các sứ đồ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “đám đông trong thành bị phân đôi.”
    reason: Nêu cách dịch sát cấu trúc và hình ảnh của nguyên ngữ đối với ἐσχίσθη và τὸ πλῆθος τῆς πόλεως.
lexical_decisions:
- source_word: ἐσχίσθη
  choice: bị chia rẽ
  rationale: Động từ thụ động diễn tả cộng đồng bị phân thành các phe; “bị chia rẽ” tự nhiên trong tiếng Việt và giữ được sắc thái của nguyên ngữ.
- source_word: τὸ πλῆθος τῆς πόλεως
  choice: dân trong thành
  rationale: Cụm từ chỉ đông đảo cư dân của thành, không nhất thiết là một đám đông đang tụ tập. “Dân trong thành” ngắn gọn, tự nhiên và phù hợp ngữ cảnh.
- source_word: δὲ
  choice: Nhưng
  rationale: Liên từ đánh dấu sự tương phản nhẹ với diễn biến trước đó; “Nhưng” thể hiện rõ kết quả phân hóa.
- source_word: οἱ μὲν ... οἱ δὲ
  choice: một số ... còn số khác
  rationale: Cấu trúc tương liên phân biệt hai phe đối lập; cách diễn đạt này tự nhiên và rõ nghĩa trong tiếng Việt hiện đại.
- source_word: σὺν
  choice: đứng về phía
  rationale: Dù nghĩa cơ bản là “với”, ngữ cảnh nói đến sự phân phe; “đứng về phía” truyền đạt đúng sự liên kết và ủng hộ hàm ý trong câu.
- source_word: Ἰουδαίοις
  choice: người Do Thái
  rationale: Nguyên ngữ không giới hạn đối tượng vào các lãnh đạo; vì vậy giữ nghĩa rộng là “người Do Thái”.
- source_word: ἀποστόλοις
  choice: các sứ đồ
  rationale: Đây là thuật ngữ quen thuộc và chính xác trong sách Công Vụ; tại đây chỉ Phao-lô và Ba-na-ba, như được xác nhận ở Công Vụ 14:14.
theological_decisions:
- issue: Đối tượng được gọi là “các sứ đồ”
  choice: Giữ danh xưng “các sứ đồ” dành cho Phao-lô và Ba-na-ba trong lời kể.
  alternative: Dịch theo nghĩa khái quát hơn là “các sứ giả”.
  rationale: Lu-ca gọi rõ Ba-na-ba và Phao-lô là “các sứ đồ” ở Công Vụ 14:14. Giữ nguyên danh xưng này phản ánh cách dùng của tác giả mà không áp đặt một định nghĩa thần học hẹp hơn lên câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “đứng về phía” để diễn đạt tự nhiên sự phân phe; dùng “các sứ đồ” theo thuật ngữ Kinh Thánh quen thuộc.
