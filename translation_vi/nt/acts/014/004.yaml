  source_fidelity: 'Bản dịch phản ánh chính xác cấu trúc và ý nghĩa của nguyên văn: τὸ πλῆθος τῆς πόλεως là toàn thể dân chúng trong thành; ἐσχίσθη được diễn đạt tự nhiên là “bị chia rẽ”; và cặp οἱ μὲν ... οἱ δὲ được giữ rõ bằng “một số ... còn số khác”. “Đứng về phía” diễn đạt phù hợp quan hệ liên kết/phân phe của σύν trong ngữ cảnh.'
  naturalness: Câu tiếng Việt hiện đại, rõ ràng và có nhịp văn tự nhiên. Dấu hai chấm sau mệnh đề nói về sự chia rẽ dẫn vào hai phe một cách hiệu quả. “Dân trong thành,” “người Do Thái,” và “các sứ đồ” đều dễ hiểu trong văn phong Kinh Thánh hiện đại.
  terminology: “Người Do Thái” giữ đúng phạm vi rộng của Ἰουδαῖοις, không thu hẹp thành các lãnh đạo. “Các sứ đồ” dịch trực tiếp ἀποστόλοις và phù hợp với cách gọi của Lu-ca trong mạch văn, không thêm diễn giải giáo phái. Chú thích được neo đúng tại mệnh đề có ἐσχίσθη và τὸ πλῆθος τῆς πόλεως.
