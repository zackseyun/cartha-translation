id: ACT.14.22
reference: Acts 14:22
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐπιστηρίζοντες τὰς ψυχὰς τῶν μαθητῶν, παρακαλοῦντες ἐμμένειν τῇ πίστει καὶ ὅτι διὰ πολλῶν θλίψεων δεῖ ἡμᾶς εἰσελθεῖν εἰς τὴν βασιλείαν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/022.yaml
  text: strengthening the souls of the disciples[a], encouraging them to remain in the faith[c][b], and saying that through many afflictions we must enter the kingdom of God.
translation:
  language: vi
  text: 'làm vững lòng các môn đồ, khích lệ họ tiếp tục giữ vững đức tin và nói rằng: “Chúng ta phải trải qua nhiều gian truân để vào vương quốc của Đức Chúa Trời.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιστηρίζοντες
  choice: làm vững lòng
  rationale: Diễn đạt hành động liên tục củng cố các môn đồ; tự nhiên trong tiếng Việt và phù hợp với tân ngữ ψυχὰς mà không hàm ý một thủ tục thiết lập chính thức.
- source_word: τὰς ψυχὰς τῶν μαθητῶν
  choice: lòng các môn đồ
  rationale: Trong ngữ cảnh này, ψυχή chỉ đời sống nội tâm hay chính con người. “Lòng” là cách nói tiếng Việt tự nhiên, tránh gợi một sự phân chia cứng nhắc giữa linh hồn và thân thể.
- source_word: παρακαλοῦντες
  choice: khích lệ
  rationale: Bao hàm lời động viên có tính thúc giục trong bối cảnh kêu gọi kiên trì giữa gian truân.
- source_word: ἐμμένειν τῇ πίστει
  choice: tiếp tục giữ vững đức tin
  rationale: ἐμμένειν diễn tả sự tiếp tục gắn bó và kiên trì; mạo từ τῇ cho phép hiểu πίστις theo nghĩa xác định là đức tin mà họ đã tiếp nhận.
- source_word: διὰ πολλῶν θλίψεων
  choice: trải qua nhiều gian truân
  rationale: θλῖψις nói đến áp lực, hoạn nạn và khốn khó. “Gian truân” trang trọng nhưng vẫn dễ hiểu; cấu trúc “trải qua” thể hiện tự nhiên ý nghĩa của διά.
- source_word: δεῖ ἡμᾶς εἰσελθεῖν
  choice: chúng ta phải ... mới vào được
  rationale: Giữ lực của sự cần thiết trong δεῖ. Cấu trúc tiếng Việt này liên kết tự nhiên việc trải qua gian truân với việc vào vương quốc mà không giải thích thêm cơ chế thần học.
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: vương quốc của Đức Chúa Trời
  rationale: Cách dịch quen thuộc, trang trọng, giữ được cả sắc thái lãnh vực cai trị lẫn quyền trị vì của βασιλεία.
theological_decisions:
- issue: Nghĩa của πίστις có mạo từ
  choice: đức tin
  alternative: lòng tin
  rationale: Mạo từ τῇ nghiêng về một đối tượng xác định, tức đức tin mà cộng đồng môn đồ đã tiếp nhận, nhưng bản dịch không biến từ này thành một thuật ngữ tín điều hậu kỳ.
- issue: Lực của δεῖ
  choice: chúng ta phải trải qua nhiều gian truân mới vào được vương quốc của Đức Chúa Trời
  alternative: chúng ta cần phải qua nhiều gian truân để vào vương quốc của Đức Chúa Trời
  rationale: “Phải” bảo toàn ý nghĩa cần thiết của δεῖ, đồng thời không thêm lời giải thích về tiền định, công đức hay nguyên nhân của đau khổ.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “môn đồ” và “Đức Chúa Trời” theo văn phong Kinh Thánh phổ thông; tránh lối dịch máy móc “làm vững linh hồn”. Lời nói trực tiếp được đặt sau dấu hai chấm để câu rõ ràng.
