  verdict: revise
  source_fidelity: 'Bản dịch nhìn chung phản ánh đúng các phân từ hiện tại «làm vững lòng» và «khích lệ», cùng nội dung về sự cần thiết phải vào vương quốc Đức Chúa Trời qua nhiều hoạn nạn. Tuy nhiên, từ «mới» trong cấu trúc «phải trải qua ... mới vào được» dễ tạo quan hệ điều kiện hoặc trình tự chặt hơn nguyên văn: Hy văn nói việc vào vương quốc là qua/trong nhiều hoạn nạn, không xác định rằng phải hoàn tất một điều kiện rồi mới được vào.'
