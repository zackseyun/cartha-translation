  terminology: «Làm vững lòng», «môn đồ», «đức tin», «gian truân», và «vương quốc của Đức Chúa Trời» đều nhất quán với các thuật ngữ trọng yếu. «Gian truân» diễn đạt thích đáng θλίψεις.
