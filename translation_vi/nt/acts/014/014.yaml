  - severity: low
    issue: Cách diễn đạt chú thích a hơi nặng và mơ hồ
    rationale: “phản đối việc dành cho con người sự tôn kính phạm thượng” có thể khiến quan hệ bổ nghĩa của “phạm thượng” không rõ. “phản đối việc tôn kính con người một cách phạm thượng” rõ hơn, vẫn giữ đúng ý chú thích kiểm chứng tiếng Anh.
