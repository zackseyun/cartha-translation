  text: ἀκούσαντες δὲ οἱ ἀπόστολοι Βαρναβᾶς καὶ Παῦλος, διαρρήξαντες τὰ ἱμάτια ⸀αὐτῶν ⸀ἐξεπήδησαν εἰς τὸν ὄχλον κράζοντες
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/014.yaml
  text: But when the apostles Barnabas and Paul heard, they tore their garments and rushed out into the crowd, crying out,
translation:
  language: vi
  text: Nhưng khi hai sứ đồ Ba-na-ba và Phao-lô nghe vậy, họ xé áo mình[a], lao vào giữa đám đông[b] và kêu lớn,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Xé áo là dấu hiệu quen thuộc bày tỏ đau buồn, kinh hãi, hoặc phản đối việc tôn kính con người một cách phạm thượng.
    reason: cultural_note
  - marker: b
    text: 'Cũng có thể dịch: “nhảy bổ vào giữa đám đông.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσαντες
  choice: khi ... nghe chuyện ấy
  rationale: Phân từ bất định mang ý nghĩa thời gian; “chuyện ấy” làm rõ đối tượng được nghe từ văn cảnh trước mà không thêm cách diễn giải thần học.
- source_word: δὲ
  choice: Nhưng
  rationale: Diễn tả bước chuyển có tính tương phản từ hành động của đám đông sang phản ứng của Ba-na-ba và Phao-lô.
- source_word: οἱ ἀπόστολοι Βαρναβᾶς καὶ Παῦλος
  choice: hai sứ đồ Ba-na-ba và Phao-lô
  rationale: Giữ nguyên việc bản Hy Lạp gọi Ba-na-ba và Phao-lô là các sứ đồ; “hai” diễn đạt tự nhiên cấu trúc danh từ số nhiều kèm hai tên riêng.
- source_word: διαρρήξαντες τὰ ἱμάτια αὐτῶν
  choice: họ xé áo mình
  rationale: Cách nói tiếng Việt tự nhiên, sát hành động biểu thị đau buồn, kinh hãi hoặc phản đối trong bối cảnh văn hóa Do Thái.
- source_word: ἐξεπήδησαν
  choice: lao vào
  rationale: Động từ diễn tả chuyển động đột ngột và mạnh; “lao vào” truyền đạt sự khẩn cấp mà không thêm ý “đi ra” vốn không được nêu riêng trong bản Hy Lạp.
- source_word: εἰς τὸν ὄχλον
  choice: giữa đám đông
  rationale: Diễn đạt chuyển động vào trong đám người bằng tiếng Việt tự nhiên; nghĩa hướng đích của εἰς được kết hợp với “lao vào”.
- source_word: κράζοντες
  choice: lớn tiếng kêu lên
  rationale: Phân từ hiện tại chỉ hành động đồng thời và lời nói lớn, mạnh, tiếp diễn sang câu sau.
theological_decisions:
- issue: Việc gọi Ba-na-ba và Phao-lô là “các sứ đồ”
  choice: Giữ tước gọi “hai sứ đồ Ba-na-ba và Phao-lô” ngay trong câu.
  alternative: Đảo thành “Ba-na-ba và Phao-lô, là các sứ đồ” hoặc hiểu ngầm theo một phạm vi sứ đồ đã được giới hạn trước.
  rationale: Cấu trúc đồng vị Hy Lạp trực tiếp xác định Ba-na-ba và Phao-lô là οἱ ἀπόστολοι trong văn cảnh này; bản dịch không nên giải quyết tranh luận giáo lý về phạm vi chức danh bằng cách thu hẹp nghĩa.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “sứ đồ” theo thuật ngữ Kinh Thánh tiếng Việt quen thuộc; tên riêng theo dạng Ba-na-ba và Phao-lô. Dấu phẩy cuối câu được giữ vì lời kêu lên tiếp tục ở câu kế.
