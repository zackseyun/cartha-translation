  terminology: “Sứ đồ,” “Ba-na-ba,” và “Phao-lô” phù hợp thuật ngữ và quy ước tên riêng Kinh Thánh tiếng Việt. Chú thích a cần chỉnh nhẹ để cụm mô tả sự tôn kính phạm thượng rõ nghĩa hơn trong tiếng Việt, mà không diễn giải thêm đối tượng của sự tôn kính đó.
