id: ACT.14.13
reference: Acts 14:13
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὅ ⸀τε ἱερεὺς τοῦ Διὸς τοῦ ὄντος πρὸ τῆς ⸀πόλεως ταύρους καὶ στέμματα ἐπὶ τοὺς πυλῶνας ἐνέγκας σὺν τοῖς ὄχλοις ἤθελεν θύειν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/013.yaml
  text: And the priest of Zeus[a], whose temple was before the city[b], brought bulls and wreaths to the gates and wanted to offer sacrifice with the crowds.
translation:
  language: vi
  text: Thầy tế lễ của thần Zeus, vị thần có đền thờ ở phía trước thành[a], đem bò đực và vòng hoa[b] đến cổng thành; ông định cùng với đám đông dâng sinh tế.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “Zeus, vị ở trước thành.” Cách gọi này có lẽ ám chỉ đền hoặc điện thờ của Zeus ở phía trước, có thể là bên ngoài, thành.'
    reason: alternative_reading
  - marker: b
    text: Cũng có thể dịch là “tràng hoa”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅ τε
  choice: Thầy tế lễ...
  rationale: Tiểu từ τε tiếp nối mạch kể; tiếng Việt không cần dịch thành một liên từ riêng ở đầu câu.
- source_word: ἱερεὺς τοῦ Διὸς
  choice: thầy tế lễ của thần Zeus
  rationale: Giữ tên Hy Lạp Zeus thay vì dùng tên La Mã Jupiter; thêm “thần” để người đọc Việt nhận rõ đây là tên một vị thần ngoại giáo.
- source_word: τοῦ ὄντος πρὸ τῆς πόλεως
  choice: vị thần có đền thờ ở bên ngoài thành
  rationale: Cụm từ nguyên văn bổ nghĩa cho Zeus nhưng nhiều khả năng ngụ ý nơi thờ tự của thần nằm trước hoặc ngoài thành. Bổ sung “đền thờ” cho câu tiếng Việt rõ nghĩa, đồng thời ghi cách dịch sát hơn trong chú thích.
- source_word: ταύρους
  choice: bò đực
  rationale: Dịch trực tiếp ταῦρος và phù hợp với bối cảnh hiến tế.
- source_word: στέμματα
  choice: vòng hoa
  rationale: Chỉ những vòng hoặc tràng hoa dùng trong nghi lễ; “vòng hoa” tự nhiên và dễ hiểu trong tiếng Việt hiện đại.
- source_word: ἐπὶ τοὺς πυλῶνας
  choice: đến các cổng
  rationale: Giữ dạng số nhiều của πυλῶνας và sắc thái chuyển động đi kèm động từ “đem”.
- source_word: ἐνέγκας
  choice: đem
  rationale: Chuyển phân từ aorist thành động từ nối tự nhiên trong văn kể tiếng Việt.
- source_word: σὺν τοῖς ὄχλοις
  choice: cùng đám đông
  rationale: Tiếng Việt thường dùng danh từ tập hợp số ít “đám đông” dù nguyên văn dùng số nhiều; ý chính là vị tế lễ hành động cùng dân chúng tụ tập.
- source_word: ἤθελεν θύειν
  choice: muốn dâng lễ vật
  rationale: Trong ngữ cảnh thờ cúng, θύω nói đến việc dâng sinh tế. “Dâng lễ vật” diễn đạt mục đích nghi lễ tự nhiên, với bò đực đã nêu là vật hiến tế.
theological_decisions:
- issue: Sở chỉ của τοῦ ὄντος πρὸ τῆς πόλεως
  choice: Hiểu là Zeus có đền thờ ở bên ngoài thành.
  alternative: 'Dịch sát: “thần Zeus, vị ở trước thành.”'
  rationale: Nguyên văn trực tiếp nói về “Zeus ở trước thành,” nhưng trong bối cảnh cổ đại cách gọi này nhiều khả năng xác định vị thần theo nơi đặt đền hoặc điện thờ. Bản chính làm rõ hàm ý địa điểm mà không biến nó thành một khẳng định thần học; chú thích bảo tồn cấu trúc và độ mơ hồ của nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “thầy tế lễ” cho chức vụ tôn giáo ngoại giáo; giữ tên Zeus theo nguyên văn Hy Lạp. Các dấu chú thích [a], [b] đều được đặt ngay trong câu chính.
