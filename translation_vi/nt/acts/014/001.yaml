id: ACT.14.1
reference: Acts 14:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἐγένετο δὲ ἐν Ἰκονίῳ κατὰ τὸ αὐτὸ εἰσελθεῖν αὐτοὺς εἰς τὴν συναγωγὴν τῶν Ἰουδαίων καὶ λαλῆσαι οὕτως ὥστε πιστεῦσαι Ἰουδαίων τε καὶ Ἑλλήνων πολὺ πλῆθος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/001.yaml
  text: In Iconium they entered together into the synagogue of the Jews and spoke in such a way that a great multitude of both Jews and Greeks believed[a].
translation:
  language: vi
  text: Tại I-cô-ni, hai ông cùng vào hội đường của người Do Thái và nói năng đến nỗi rất đông người Do Thái lẫn người Hy Lạp đã tin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “hội đường Do Thái.” Nguyên văn Hy Lạp là “hội đường của người Do Thái.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: không dịch thành một từ riêng
  rationale: Cụm này chủ yếu làm công thức chuyển tiếp trong lời kể; tiếng Việt tự nhiên không cần thêm “bấy giờ” hay “xảy ra rằng” khi câu đã mở bằng địa điểm.
- source_word: ἐν Ἰκονίῳ
  choice: Tại I-cô-ni
  rationale: Diễn đạt địa điểm rõ ràng; địa danh được phiên âm theo cách đọc quen thuộc trong tiếng Việt.
- source_word: κατὰ τὸ αὐτό
  choice: cùng
  rationale: Trong ngữ cảnh, thành ngữ này chỉ hành động chung của Phao-lô và Ba-na-ba; “cùng” tự nhiên và không gây tối nghĩa.
- source_word: εἰσελθεῖν αὐτοὺς
  choice: hai ông ... vào
  rationale: Chuyển động từ nguyên mẫu lệ thuộc cấu trúc ἐγένετο thành động từ hữu hạn tự nhiên trong tiếng Việt; “hai ông” làm rõ đại từ số nhiều theo văn cảnh.
- source_word: εἰς τὴν συναγωγὴν τῶν Ἰουδαίων
  choice: vào hội đường của người Do Thái
  rationale: Giữ rõ cấu trúc sở thuộc của nguyên văn thay vì chỉ nói “hội đường Do Thái”.
- source_word: λαλῆσαι
  choice: giảng dạy
  rationale: Trong bối cảnh hoạt động tại hội đường, động từ chỉ việc nói và công bố sứ điệp; “giảng dạy” tự nhiên hơn “nói” đơn thuần nhưng không xác định thêm nội dung không có trong câu.
- source_word: οὕτως ὥστε
  choice: cách nào đó, đến nỗi
  rationale: Giữ cả sắc thái cách thức và kết quả của tổ hợp Hy Lạp, đồng thời tránh hàm ý rằng bản văn mô tả cụ thể phương pháp nói.
- source_word: πιστεῦσαι
  choice: tin nhận
  rationale: Diễn tả phản ứng đức tin trong ngữ cảnh rao giảng; không thêm một tân ngữ cụ thể mà nguyên văn không nêu.
- source_word: Ἰουδαίων τε καὶ Ἑλλήνων
  choice: người Do Thái lẫn người Hy Lạp
  rationale: “Lẫn” biểu đạt rõ hai nhóm được kết hợp bởi τε καὶ.
- source_word: πολὺ πλῆθος
  choice: rất đông
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt hiện đại, giữ ý về số lượng lớn mà không dùng từ cổ hoặc nặng nề.
theological_decisions:
- issue: Ý nghĩa của πιστεῦσαι trong bối cảnh đáp ứng lời rao giảng
  choice: tin nhận
  alternative: tin; trở nên tin Chúa
  rationale: Nguyên văn chỉ nói họ tin mà không nêu trực tiếp tân ngữ. “Tin nhận” truyền đạt phản ứng đức tin trong văn cảnh nhưng không chỉ định thêm một công thức thần học hay đối tượng không được nói rõ trong câu.
translation_notes:
  register: Văn phong kể chuyện trang trọng vừa phải, rõ ràng và tự nhiên đối với độc giả Việt Nam hiện đại. Dùng “hai ông” để tránh đại từ mơ hồ; giữ nguyên sự liên hệ giữa cách giảng và kết quả tin nhận mà không giải thích theo một lập trường hệ phái.
