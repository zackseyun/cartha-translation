id: ACT.14.23
reference: Acts 14:23
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: χειροτονήσαντες δὲ αὐτοῖς ⸂κατ’ ἐκκλησίαν πρεσβυτέρους⸃ προσευξάμενοι μετὰ νηστειῶν παρέθεντο αὐτοὺς τῷ κυρίῳ εἰς ὃν πεπιστεύκεισαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/023.yaml
  text: And after appointing elders for them in every church[a], and praying with fasting, they entrusted them to the Lord[c][b], in whom they had believed.
translation:
  language: vi
  text: Sau khi lập các trưởng lão cho họ trong từng hội thánh[a], và cầu nguyện cùng kiêng ăn, hai ông phó thác họ[b] cho Chúa, là Đấng mà họ đã tin cậy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “sau khi bầu chọn các trưởng lão cho họ trong từng hội thánh.” Trong một số ngữ cảnh, động từ Hy Lạp có thể mang nghĩa chọn bằng biểu quyết hoặc giơ tay, nhưng ở đây cũng có thể chỉ đơn giản là bổ nhiệm.
    reason: alternative_reading
  - marker: b
    text: “Họ” có thể chỉ toàn thể các tín hữu, hoặc cụ thể hơn là các trưởng lão vừa được lập.
    reason: alternative_reading
lexical_decisions:
- source_word: χειροτονήσαντες
  choice: sau khi lập
  rationale: Động từ chỉ việc chọn và đặt vào trách nhiệm; “lập” tự nhiên trong tiếng Việt và không áp đặt một cơ chế giáo hội cụ thể như bỏ phiếu hay giơ tay.
- source_word: κατ’ ἐκκλησίαν
  choice: trong từng hội thánh
  rationale: κατά với danh từ số ít mang ý phân phối, nghĩa là tại mỗi hội thánh địa phương.
- source_word: πρεσβυτέρους
  choice: các trưởng lão
  rationale: Trong ngữ cảnh hội thánh, từ này chỉ những người lãnh đạo được công nhận, không đơn thuần là người cao tuổi.
- source_word: προσευξάμενοι μετὰ νηστειῶν
  choice: cầu nguyện, kiêng ăn
  rationale: Diễn đạt tự nhiên hai thực hành đi kèm nhau; dạng số nhiều νηστειῶν không cần được thể hiện máy móc trong tiếng Việt.
- source_word: παρέθεντο
  choice: phó thác
  rationale: Thể trung diễn tả việc giao người khác vào sự chăm nom của Chúa; “phó thác” trang trọng, rõ nghĩa và tự nhiên.
- source_word: τῷ κυρίῳ
  choice: cho Chúa
  rationale: Cách dùng sở cách sau παρατίθημι chỉ Đấng mà họ được giao vào sự chăm nom.
- source_word: εἰς ὃν πεπιστεύκεισαν
  choice: là Đấng họ đã tin
  rationale: Giữ ý đức tin hướng đến Chúa và sắc thái hành động đã có trước của thì quá khứ hoàn thành, đồng thời phù hợp cú pháp tiếng Việt.
- source_word: αὐτοῖς ... αὐτοὺς
  choice: cho họ ... họ
  rationale: Giữ đại từ của nguyên văn để không giải quyết dứt khoát đối tượng của αὐτούς; ngữ cảnh có thể hướng đến các tín hữu nói chung hoặc các trưởng lão vừa được lập.
theological_decisions:
- issue: Ý nghĩa của χειροτονήσαντες đối với thể chế hội thánh
  choice: lập các trưởng lão
  alternative: bầu chọn các trưởng lão, có thể bằng cách giơ tay
  rationale: Từ Hy Lạp có thể gắn với việc chọn bằng cách giơ tay trong một số ngữ cảnh, nhưng câu này không nói rõ thủ tục. “Lập” giữ hành động cốt lõi mà không du nhập mô hình hệ phái.
- issue: Đối tượng của αὐτοὺς trong παρέθεντο αὐτοὺς τῷ κυρίῳ
  choice: giữ đại từ “họ” trong chính văn
  alternative: hiểu là toàn thể tín hữu hoặc riêng các trưởng lão mới được lập
  rationale: Ngữ cảnh rộng nghiêng về các tín hữu/hội thánh, nhưng cú pháp cũng cho phép liên hệ với các trưởng lão gần nhất; chú thích bảo tồn sự mơ hồ thật sự.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “hội thánh,” “trưởng lão,” “phó thác” theo nghĩa quen thuộc trong ngữ cảnh Tân Ước; giữ đại từ để bảo tồn sự mơ hồ của nguyên văn.
