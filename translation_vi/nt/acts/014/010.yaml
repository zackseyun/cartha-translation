base_translation:
  language: en
  yaml_path: translation/nt/acts/014/010.yaml
  text: He said in a loud voice[b][a], “Stand upright on your feet.” And he leaped up and began walking.
translation:
  language: vi
  text: 'Ông nói lớn tiếng: “Hãy đứng thẳng trên đôi chân của anh!” Người ấy nhảy bật dậy và bắt đầu bước đi.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Người ấy nhảy bật dậy và cứ thế bước đi.” Động từ cuối ở thì chưa hoàn thành, có thể nhấn mạnh hành động đang tiếp diễn hoặc sự bắt đầu bước đi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μεγάλῃ φωνῇ
  choice: lớn tiếng
  rationale: Cụm chỉ cách thức được diễn đạt tự nhiên trong tiếng Việt hiện đại, giữ được sắc thái công khai và mạnh mẽ của lời nói.
- source_word: Ἀνάστηθι
  choice: Hãy đứng
  rationale: Mệnh lệnh aorist yêu cầu người què đứng dậy; kết hợp với ὀρθός và cụm nói về đôi chân, “hãy đứng” diễn đạt trực tiếp tư thế được truyền phải thực hiện.
- source_word: ἐπὶ τοὺς πόδας σου
  choice: trên đôi chân của anh
  rationale: Cách dịch này giữ hình ảnh cụ thể của nguyên văn và phù hợp với bối cảnh người vốn không sử dụng được đôi chân.
- source_word: ὀρθός
  choice: thẳng
  rationale: Từ này chỉ tư thế ngay thẳng, bổ nghĩa cho mệnh lệnh đứng; “đứng thẳng” là cách nói tự nhiên và rõ nghĩa trong tiếng Việt.
- source_word: ἥλατο
  choice: nhảy bật dậy
  rationale: Động từ diễn tả một cú nhảy đột ngột; “nhảy bật dậy” giữ tính sống động và phản ứng tức thì trong trình thuật.
- source_word: περιεπάτει
  choice: bắt đầu bước đi
  rationale: Thì chưa hoàn thành có thể mang sắc thái khởi diễn hoặc tiếp diễn. Trong chuỗi hành động này, “bắt đầu bước đi” diễn đạt tự nhiên sự khởi đầu của hành động kéo dài, còn cách hiểu tiếp diễn được ghi ở chú thích.
theological_decisions:
- issue: Ngôn ngữ phép lạ và mệnh lệnh về tư thế
  choice: Dịch trực tiếp mệnh lệnh và phản ứng như một sự chữa lành thể chất xảy ra tức thì, không thêm lời diễn giải.
  alternative: Diễn giải thêm ý nghĩa thần học hoặc tác nhân của phép lạ.
  rationale: Bản Hy Lạp thuật lại một mệnh lệnh trực tiếp, tiếp theo là phản ứng tức thì và thấy được; bản dịch giữ nguyên tính cụ thể ấy mà không đưa thêm khẳng định giáo lý.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. “Ông” nối tự nhiên với chủ thể trong văn cảnh; “anh” phù hợp với lời nói trực tiếp dành cho một người trưởng thành. Cấu trúc ngắn và mạnh giữ nhịp sống động của trình thuật.
