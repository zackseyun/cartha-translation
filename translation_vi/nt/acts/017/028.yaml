  source_fidelity: 'Bản dịch bám sát nguyên văn: ἐν αὐτῷ là “trong Ngài”; ba động từ ζῶμεν, κινούμεθα, ἐσμέν được giữ đầy đủ và song song bằng “sống, chuyển động và hiện hữu”; καί τινες... cũng được chuyển tự nhiên là “như một số... cũng đã nói”; γένος được dịch chính xác, không áp đặt ý nghĩa thần học hẹp, là “dòng dõi”.'
