  terminology: “Ngài” phù hợp với quy chiếu về Đức Chúa Trời trong ngữ cảnh. “Hiện hữu” phản ánh tốt ἐσμέν trong chuỗi ba động từ. “Dòng dõi” là lựa chọn trung tính, chính xác cho γένος, tránh đồng nhất trực tiếp với thuật ngữ về tư cách con cái theo nghĩa giáo lý.
