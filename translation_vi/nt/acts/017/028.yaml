id: ACT.17.28
reference: Acts 17:28
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐν αὐτῷ γὰρ ζῶμεν καὶ κινούμεθα καὶ ἐσμέν, ὡς καί τινες τῶν καθ’ ὑμᾶς ποιητῶν εἰρήκασιν· Τοῦ γὰρ καὶ γένος ἐσμέν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/028.yaml
  text: For in him we live and move and exist, as even some of your own poets have said, ‘For we also are his offspring.’
translation:
  language: vi
  text: 'Vì trong Ngài, chúng ta sống, chuyển động và hiện hữu, như một số thi sĩ của chính quý vị cũng đã nói: “Vì chúng ta cũng là dòng dõi của Ngài.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν αὐτῷ
  choice: trong Ngài
  rationale: Giữ hình ảnh và quan hệ diễn đạt bằng giới từ của nguyên văn; “Ngài” phù hợp với đối tượng là Đức Chúa Trời trong ngữ cảnh.
- source_word: κινούμεθα
  choice: chuyển động
  rationale: Chuyển tải nghĩa căn bản là vận động/chuyển động, đồng thời giữ song song với “sống” và “hiện hữu”.
- source_word: ἐσμέν
  choice: hiện hữu
  rationale: Trong chuỗi ba động từ, “hiện hữu” diễn đạt rõ nghĩa tồn tại, tự nhiên hơn việc lặp lại “là” vốn dễ gây cụt nghĩa trong tiếng Việt.
- source_word: τῶν καθ’ ὑμᾶς ποιητῶν
  choice: thi sĩ của chính quý vị
  rationale: Diễn đạt tự nhiên ý chỉ những thi sĩ thuộc về hoặc xuất thân từ chính cộng đồng văn hóa của người nghe.
- source_word: γένος
  choice: dòng dõi
  rationale: Giữ ý về nguồn gốc và quan hệ huyết hệ/giống nòi trong lời thi ca được trích dẫn; không chuyển thành ngôn ngữ thần học chuyên biệt như “con cái”.
theological_decisions:
- issue: Ý nghĩa của “trong Ngài” đối với sự sống và hiện hữu
  choice: Giữ nguyên “trong Ngài” mà không giải thích thêm
  alternative: Nhờ Ngài / bởi quyền năng Ngài
  rationale: Nguyên văn có thể gợi cả sự lệ thuộc lẫn phạm vi hiện hữu; bản dịch không nên thu hẹp hình ảnh vào riêng quan hệ công cụ hay nguyên nhân.
- issue: “Dòng dõi của Ngài” và địa vị làm con
  choice: dòng dõi của Ngài
  alternative: con cái của Ngài
  rationale: “γένος” ở đây nói về giống dòng/nguồn gốc trong lời của thi sĩ ngoại giáo, không tự nó xác quyết đầy đủ một giáo lý chuyên biệt về việc được nhận làm con.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “quý vị” cho số nhiều ὑμᾶς, phù hợp với bài diễn thuyết công khai; giữ nhịp ba vế “sống, chuyển động và hiện hữu” cùng cấu trúc thi ca của câu trích dẫn.
