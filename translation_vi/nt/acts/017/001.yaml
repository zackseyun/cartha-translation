id: ACT.17.1
reference: Acts 17:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Διοδεύσαντες δὲ τὴν Ἀμφίπολιν καὶ ⸀τὴν Ἀπολλωνίαν ἦλθον εἰς Θεσσαλονίκην, ὅπου ⸀ἦν συναγωγὴ τῶν Ἰουδαίων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/001.yaml
  text: After passing through Amphipolis and Apollonia[a], they came to Thessalonica[b], where there was a synagogue of the Jews.
translation:
  language: vi
  text: Sau khi đi qua Am-phi-pô-li và A-pô-lô-ni-a, họ đến Tê-sa-lô-ni-ca, nơi có một hội đường của người Do Thái.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διοδεύσαντες
  choice: Sau khi đi qua
  rationale: Phân từ chủ động bất định quá khứ diễn tả hành động xảy ra trước động từ chính ἦλθον. Cách dịch này tự nhiên trong tiếng Việt và giữ ý họ đi xuyên qua hai thành ấy.
- source_word: δὲ
  choice: không dịch riêng
  rationale: Ở đây δέ chỉ là từ nối nhẹ trong mạch kể chuyện; không cần biểu đạt riêng trong tiếng Việt hiện đại.
- source_word: Ἀμφίπολιν καὶ Ἀπολλωνίαν
  choice: Am-phi-pô-li và A-pô-lô-ni-a
  rationale: Phiên âm các địa danh Hy Lạp theo lối dễ đọc đối với độc giả Việt.
- source_word: ἦλθον εἰς Θεσσαλονίκην
  choice: họ đến Tê-sa-lô-ni-ca
  rationale: ἦλθον là động từ chỉ sự di chuyển, còn εἰς nêu đích đến; “đến” diễn đạt gọn và tự nhiên cả hai yếu tố.
- source_word: ὅπου
  choice: nơi
  rationale: Đại từ trạng ngữ chỉ địa điểm được chuyển thành “nơi” để nối mệnh đề tự nhiên.
- source_word: συναγωγὴ
  choice: một hội đường
  rationale: Danh từ không có mạo từ; “một hội đường” giữ cách hiểu bất định tự nhiên nhất, dù tiếng Hy Lạp không buộc tuyệt đối phải hiểu như vậy.
- source_word: τῶν Ἰουδαίων
  choice: của người Do Thái
  rationale: Cụm sở hữu/liên hệ này chỉ cộng đồng Do Thái gắn với hội đường; cách dịch trực tiếp, rõ nghĩa và phù hợp ngữ cảnh.
theological_decisions:
- issue: Cách dịch Ἰουδαίων trong bối cảnh kể chuyện
  choice: người Do Thái
  alternative: người Giu-đê
  rationale: Ở đây cụm từ chỉ cộng đồng Do Thái có hội đường tại Tê-sa-lô-ni-ca, chứ không nhấn mạnh cư dân vùng Giu-đê. “Người Do Thái” vì thế chính xác hơn trong ngữ cảnh.
- issue: Tính xác định của συναγωγὴ
  choice: một hội đường
  alternative: hội đường
  rationale: Danh từ Hy Lạp không có mạo từ nên bản dịch dùng “một”; tuy nhiên, do tiếng Hy Lạp có thể dùng danh từ không mạo từ theo nhiều chức năng, không nên suy diễn rằng thành phố nhất thiết có nhiều hội đường.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “hội đường” là thuật ngữ Việt ngữ quen thuộc cho συναγωγή; phiên âm địa danh nhất quán, có dấu nối để hỗ trợ phát âm.
source_grounding:
  english_pob_role: consult_only
