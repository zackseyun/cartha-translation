  source_fidelity: 'Bản dịch phản ánh đúng cấu trúc và ý nghĩa của câu Hy Lạp: phân từ Διοδεύσαντες được diễn đạt là hành động có trước (“Sau khi đi qua”); ἦλθον εἰς được dịch tự nhiên là “họ đến”; và ὅπου nối đúng với địa điểm Tê-sa-lô-ni-ca. “Một hội đường” diễn đạt hợp lý danh từ συναγωγή không có mạo từ, mà không khẳng định quá mức về số lượng hội đường.'
