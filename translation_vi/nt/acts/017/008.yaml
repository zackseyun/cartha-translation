lexical_decisions:
- source_word: ἐτάραξαν
  choice: bị kích động
  rationale: Động từ ταράσσω chỉ việc gây xáo động, bất an hoặc kích động. Cách diễn đạt bị động tự nhiên trong tiếng Việt giữ được tác động lên cả đám đông lẫn giới chức mà không hàm ý bạo loạn quá mức.
- source_word: δὲ
  choice: không dịch riêng
  rationale: δέ là liên từ nhẹ để tiếp nối câu chuyện; trong cấu trúc tiếng Việt này, quan hệ tiếp diễn đã rõ và thêm “và” hoặc “nhưng” sẽ kém tự nhiên.
- source_word: ὄχλον
  choice: đám đông
  rationale: Đây là cách tương đương thông dụng, trung tính của ὄχλος, không thêm sắc thái thù địch như “đám mob” hay “đám người quá khích”.
- source_word: πολιτάρχας
  choice: các quan chức thành phố
  rationale: πολιτάρχης là chức danh dân chính địa phương tại Macedonia. “Các quan chức thành phố” dễ hiểu và không giới hạn chức năng của họ vào lĩnh vực xét xử.
- source_word: ἀκούοντας ταῦτα
  choice: Nghe những lời ấy
  rationale: Phân từ hiện tại bổ nghĩa cho cả đám đông và các quan chức; đưa cụm này lên đầu câu diễn đạt tự nhiên quan hệ thời gian. “Những lời ấy” giữ sắc thái số nhiều của ταῦτα trong ngữ cảnh lời cáo buộc vừa được nói ra.
