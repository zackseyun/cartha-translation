review_pass:
  verdict: revise
  source_fidelity: Bản nháp chuyển động từ chủ động ἐτάραξαν (“họ làm xáo động/gây rối”) thành bị động vô tác nhân (“đều bị kích động”), nên làm mất chủ thể gây ra hành động. Phân từ ἀκούοντας bổ nghĩa cho cả đám đông lẫn các quan chức, cần được giữ rõ là phản ứng của họ khi nghe các điều ấy.
  naturalness: “Bị kích động” có thể tự nhiên, nhưng với câu này vừa không nêu tác nhân vừa hơi thiên về trạng thái tâm lý. “Bị họ làm xáo động” diễn đạt tự nhiên, rõ quan hệ tác nhân, và phù hợp phạm vi nghĩa của ταράσσω.
  terminology: “Đám đông” và “các quan chức thành phố” phù hợp. Chú thích nên gọi πολιτάρχας là dạng phiên âm/nguyên văn, thay vì nói “dịch sát hơn,” vì “politarch” là cách giữ nguyên danh hiệu hơn là một bản dịch tiếng Việt sát nghĩa.
  issues:
