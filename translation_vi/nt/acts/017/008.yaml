    rationale: ἐτάραξαν là động từ chủ động số nhiều; bản nháp dùng “đều bị kích động” không cho biết “họ” đã làm xáo động đám đông và các quan chức.
  - severity: low
    issue: Cách mô tả chú thích chưa chính xác
    rationale: “các politarch” là phiên âm/giữ nguyên danh hiệu địa phương, không đơn thuần là “dịch sát hơn.”
