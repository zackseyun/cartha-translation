  to: Nhưng khi những người Do Thái từ Tê-sa-lô-ni-ca hay tin rằng lời Đức Chúa Trời cũng đã được Phao-lô công bố tại Bê-rê[a], họ cũng đến đó, kích động và làm náo loạn đám đông[b].
