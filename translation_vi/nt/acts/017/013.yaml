reference: Acts 17:13
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὡς δὲ ἔγνωσαν οἱ ἀπὸ τῆς Θεσσαλονίκης Ἰουδαῖοι ὅτι καὶ ἐν τῇ Βεροίᾳ κατηγγέλη ὑπὸ τοῦ Παύλου ὁ λόγος τοῦ θεοῦ, ἦλθον κἀκεῖ σαλεύοντες ⸂καὶ ταράσσοντες⸃ τοὺς ὄχλους.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/013.yaml
  text: But when the Jews from Thessalonica learned that the word of God had been proclaimed by Paul in Berea also[a], they came there too[b], stirring up and troubling the crowds.
translation:
  language: vi
  text: Nhưng khi những người Do Thái từ Tê-sa-lô-ni-ca hay tin rằng lời Đức Chúa Trời cũng đã được Phao-lô công bố tại Bê-rê[a], họ cũng đến đó, kích động và làm náo loạn đám đông[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “được Phao-lô công bố tại Bê-rê”; thì aorist trong tiếng Hy Lạp không tự nó đòi hỏi từ “đã” trong tiếng Việt.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “làm đám đông xao động và rối loạn.” Hai động từ có nghĩa gần nhau và cùng làm nổi bật tình trạng náo động trong dân chúng.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ
  choice: Nhưng khi
  rationale: δέ đánh dấu sự chuyển ý có sắc thái tương phản nhẹ với sự tiếp nhận tích cực tại Bê-rê ở phần trước, còn ὡς mang nghĩa thời gian.
- source_word: ἔγνωσαν
  choice: biết rằng
  rationale: Động từ aorist của γινώσκω ở đây chỉ việc nhận được hay biết một thông tin; cách diễn đạt này tự nhiên trong tiếng Việt.
- source_word: οἱ ἀπὸ τῆς Θεσσαλονίκης Ἰουδαῖοι
  choice: những người Do Thái từ Tê-sa-lô-ni-ca
  rationale: Xác định nhóm người theo nơi họ đến, không khái quát thành toàn thể người Do Thái.
- source_word: ὅτι καὶ ἐν τῇ Βεροίᾳ
  choice: rằng ... cũng ... tại Bê-rê
  rationale: καί nhấn mạnh Bê-rê là địa điểm bổ sung, sau Tê-sa-lô-ni-ca, nơi sứ điệp được công bố.
- source_word: κατηγγέλη
  choice: đã được ... công bố
  rationale: Thể bị động của καταγγέλλω nhấn mạnh việc loan báo công khai. “Công bố” rộng hơn “giảng” và giữ được cấu trúc bị động của nguyên văn.
- source_word: ὑπὸ τοῦ Παύλου
  choice: được Phao-lô
  rationale: ὑπό với sở hữu cách chỉ tác nhân trong cấu trúc bị động; trật tự tiếng Việt này tự nhiên và rõ nghĩa.
- source_word: ὁ λόγος τοῦ θεοῦ
  choice: lời Đức Chúa Trời
  rationale: Giữ cách diễn đạt Kinh Thánh quen thuộc và chiều sâu thần học của cụm từ, đồng thời không diễn giải quá mức thành một nội dung cụ thể hơn.
- source_word: ἦλθον κἀκεῖ
  choice: họ cũng đến đó
  rationale: κἀκεῖ có nghĩa “cũng đến đó”; cách đặt “cũng” này tự nhiên và giữ ý họ mở rộng sự chống đối tới Bê-rê.
- source_word: σαλεύοντες
  choice: kích động
  rationale: Trong ngữ cảnh đám đông, σαλεύω nói đến việc làm dân chúng xao động hoặc nổi lên, chứ không phải sự lay chuyển vật lý.
- source_word: καὶ ταράσσοντες
  choice: và gây rối
  rationale: ταράσσω bổ sung sắc thái gây hỗn loạn, bất an; “gây rối” phân biệt được với hành động “kích động” trước đó.
- source_word: τοὺς ὄχλους
  choice: trong đám đông
  rationale: ὄχλοι chỉ quần chúng tụ tập. “Đám đông” trung tính hơn “đám loạn” và phù hợp ngữ cảnh.
theological_decisions:
- issue: Cách dịch ὁ λόγος τοῦ θεοῦ
  choice: lời Đức Chúa Trời
  alternative: sứ điệp của Đức Chúa Trời
  rationale: “Lời Đức Chúa Trời” bảo tồn âm hưởng thần học và cách nói quen thuộc của nguyên văn, nhưng không đồng nhất cụm từ với một khái niệm thần học kỹ thuật vượt quá ngữ cảnh.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng các tên riêng theo lối phiên âm Kinh Thánh quen thuộc; tránh từ ngữ quá cổ hoặc hàm ý rằng mọi người Do Thái đều tham gia sự chống đối.
