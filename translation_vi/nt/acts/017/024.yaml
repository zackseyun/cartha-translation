  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ θεὸς ὁ ποιήσας τὸν κόσμον καὶ πάντα τὰ ἐν αὐτῷ, οὗτος οὐρανοῦ καὶ γῆς ⸂ὑπάρχων κύριος⸃ οὐκ ἐν χειροποιήτοις ναοῖς κατοικεῖ
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/024.yaml
  text: The God who made the world and everything in it[a], being Lord of heaven and earth, does not dwell in temples made by hands.
translation:
  language: vi
  text: Đức Chúa Trời, Đấng đã dựng nên thế giới cùng mọi vật trong đó, là Chúa của trời và đất, không ngự trong những đền thờ do tay người làm nên.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “những đền thờ do bàn tay con người làm ra.” Cụm từ này chỉ các đền thờ được con người xây dựng.
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιήσας
  choice: Đấng đã dựng nên
  rationale: Phân từ bất định quá khứ bổ nghĩa cho Đức Chúa Trời; cách dịch này tự nhiên, trang trọng và diễn đạt hành động tạo dựng đã được thực hiện mà không làm câu tiếng Việt nặng nề.
- source_word: κόσμον
  choice: thế giới
  rationale: Trong ngữ cảnh, từ này chỉ toàn thể thế giới thọ tạo; “thế giới” rõ ràng và phổ thông hơn “vũ trụ”, đồng thời không thu hẹp phạm vi.
- source_word: πάντα τὰ ἐν αὐτῷ
  choice: mọi vật trong đó
  rationale: Giữ sức khái quát của πάντα và làm rõ rằng toàn bộ những gì thuộc thế giới đều do Đức Chúa Trời dựng nên.
- source_word: ὑπάρχων κύριος
  choice: là Chúa
  rationale: ὑπάρχων diễn tả trạng thái hiện hữu. “Là Chúa” tự nhiên trong tiếng Việt và không tự ý biến phân từ thành quan hệ nguyên nhân như “vì là Chúa”.
- source_word: κύριος
  choice: Chúa
  rationale: Trong câu này, từ này nói đến quyền tể trị của Đức Chúa Trời trên trời và đất; “Chúa” giữ sắc thái thần học và trang trọng.
- source_word: οὐρανοῦ καὶ γῆς
  choice: của trời và đất
  rationale: Hai danh từ sở hữu phụ thuộc vào κύριος; “trời và đất” là cặp diễn đạt tự nhiên, quen thuộc và sát với số ít οὐρανοῦ.
- source_word: χειροποιήτοις
  choice: do tay người làm nên
  rationale: Từ này có nghĩa là được làm bởi bàn tay con người. Thêm “người” làm rõ chủ thể hàm ẩn trong thành ngữ Hy Lạp và tạo sự đối lập với Đấng dựng nên mọi vật.
- source_word: ναοῖς
  choice: những đền thờ
  rationale: ναός chỉ nơi thờ tự được xem là chỗ thần linh ngự. “Đền thờ” là cách gọi rõ ràng, thích hợp với bối cảnh các đền thờ tại A-thên.
- source_word: κατοικεῖ
  choice: ngự
  rationale: κατοικέω nghĩa là cư ngụ hay ở. Với chủ thể là Đức Chúa Trời và ngữ cảnh đền thờ, “ngự” vừa tự nhiên, trang trọng, vừa giữ ý niệm cư ngụ.
theological_decisions:
- issue: Sự siêu việt của Đức Chúa Trời đối với việc định vị Ngài trong đền thờ
  choice: Câu dịch trực tiếp khẳng định Đấng Tạo Hóa và Chúa của trời đất không ngự trong những đền thờ do con người làm nên.
  alternative: Có thể diễn ý rằng Đức Chúa Trời không bị giới hạn hoặc giam hãm trong đền thờ.
  rationale: Bản dịch giữ nguyên mệnh đề trực tiếp của tiếng Hy Lạp, không mở rộng “không ngự” thành lời giải thích thần học mạnh hơn như “không bị giới hạn”.
- issue: Giá trị ngữ nghĩa của phân từ ὑπάρχων
  choice: Dịch là “là Chúa”, giữ quan hệ mô tả trạng thái.
  alternative: 'Dịch theo quan hệ nguyên nhân: “vì là Chúa của trời và đất”.'
  rationale: Tiếng Hy Lạp không buộc phải hiểu phân từ theo nghĩa nguyên nhân; lựa chọn trung tính bảo tồn sự mơ hồ cú pháp chính đáng.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. “Đấng đã dựng nên” và “ngự” duy trì sắc thái Kinh Thánh mà vẫn tự nhiên; cấu trúc câu tránh lối dịch quá sát khiến phân từ Hy Lạp trở nên gượng gạo.
