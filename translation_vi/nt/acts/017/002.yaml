  text: κατὰ δὲ τὸ εἰωθὸς τῷ Παύλῳ εἰσῆλθεν πρὸς αὐτοὺς καὶ ἐπὶ σάββατα τρία διελέξατο αὐτοῖς ἀπὸ τῶν γραφῶν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/002.yaml
  text: And according to Paul's custom[a], he went in to them, and on three Sabbaths he reasoned with them from the Scriptures[c][b],
translation:
  language: vi
  text: Theo thói quen của mình, Phao-lô vào gặp họ và vào ba ngày Sa-bát[a], ông biện luận với họ từ Kinh Thánh[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “trong ba ngày Sa-bát.”'
    reason: lexical_alternative
  - marker: b
    text: 'Hay: “thảo luận với họ từ Kinh Thánh” hoặc “đối thoại với họ từ Kinh Thánh.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ δὲ τὸ εἰωθὸς τῷ Παύλῳ
  choice: Theo thói quen của mình, Phao-lô
  rationale: Cụm κατά với phân từ hoàn thành của εἴωθα diễn tả một thói quen đã được xác lập. Cách dịch này tự nhiên trong tiếng Việt và xác định rõ thói quen là của Phao-lô.
- source_word: εἰσῆλθεν πρὸς αὐτοὺς
  choice: đến với họ
  rationale: Trong ngữ cảnh, động từ chỉ việc Phao-lô đi vào nơi họ nhóm họp. Tiếng Việt khó dùng sát chữ kiểu “đi vào với họ”; “đến với họ” giữ hướng quan hệ mà không thêm danh từ “nhà hội” vốn không có trong câu này.
- source_word: ἐπὶ σάββατα τρία
  choice: trong ba ngày Sa-bát
  rationale: ἐπί với đối cách ở đây chỉ khoảng thời gian gồm ba dịp Sa-bát. “Trong ba ngày Sa-bát” giữ được khả năng hiểu là hoạt động diễn ra qua ba ngày ấy; chú thích nêu cách diễn đạt phân bố tự nhiên hơn trong tiếng Việt.
- source_word: διελέξατο
  choice: biện luận với họ
  rationale: διαλέγομαι trong Công Vụ chỉ sự trao đổi có lập luận và sức thuyết phục. “Biện luận” giữ sắc thái lý luận mà không nhất thiết hàm ý cãi vã thù địch.
- source_word: ἀπὸ τῶν γραφῶν
  choice: dựa trên Kinh Thánh
  rationale: ἀπό biểu thị nguồn xuất phát của lập luận; “dựa trên” tự nhiên trong tiếng Việt. Số nhiều γραφῶν theo cách dùng Do Thái–Cơ Đốc chỉ các sách thánh, được quy ước dịch là “Kinh Thánh”.
theological_decisions:
- issue: Đối tượng của đại từ αὐτούς/αὐτοῖς
  choice: giữ đại từ “họ”
  alternative: “vào nhà hội” hoặc “đến với người Do Thái ở đó”
  rationale: Ngữ cảnh trước cho biết đây là nhà hội của người Do Thái, nhưng chính câu này chỉ dùng đại từ. Giữ “họ” tránh đưa thêm sự xác định không có trong câu Hy Lạp.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Phao-lô,” “ngày Sa-bát” và “Kinh Thánh” theo cách gọi quen thuộc trong tiếng Việt; tránh lối dịch quá sát chữ gây gượng gạo.
