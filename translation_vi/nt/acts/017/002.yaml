  - severity: medium
    issue: Chú thích “vào ba ngày Sa-bát liên tiếp” thêm yếu tố “liên tiếp.”
    rationale: ἐπὶ σάββατα τρία nói đến ba dịp/ngày Sa-bát, nhưng không dùng từ nào xác định rõ các dịp ấy là liên tiếp. Không nên biến một suy luận từ trình tự tự sự thành nội dung của chú thích từ vựng.
  - severity: low
    issue: “dựa trên Kinh Thánh” diễn giải quan hệ ἀπό.
    rationale: Cách nói này tự nhiên và không sai về nghĩa tổng quát, nhưng “từ Kinh Thánh” bảo toàn trực tiếp hơn ý nguồn xuất phát của lập luận.
