id: ACT.17.31
reference: Acts 17:31
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸀καθότι ἔστησεν ἡμέραν ἐν ᾗ μέλλει κρίνειν τὴν οἰκουμένην ἐν δικαιοσύνῃ ἐν ἀνδρὶ ᾧ ὥρισεν, πίστιν παρασχὼν πᾶσιν ἀναστήσας αὐτὸν ἐκ νεκρῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/031.yaml
  text: because he has fixed a day on which he is going to judge the inhabited world in righteousness by a man whom he appointed[b][a], having given proof to all by raising him from the dead.
translation:
  language: vi
  text: vì Ngài đã ấn định một ngày, là ngày Ngài sẽ xét xử thế giới có người ở theo lẽ công chính[a] qua một người mà Ngài đã chỉ định. Ngài đã ban bằng chứng[b] cho mọi người bằng cách khiến người ấy sống lại từ cõi chết.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “theo công lý”.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “ban sự bảo đảm cho mọi người”; sát chữ hơn: “ban đức tin cho mọi người”. Trong ngữ cảnh này, ý chính là bằng chứng hoặc sự xác nhận công khai.'
    reason: alternative_reading
lexical_decisions:
- source_word: καθότι
  choice: vì
  rationale: Giữ rõ quan hệ nguyên nhân với lời kêu gọi ăn năn ở câu trước, đồng thời tự nhiên trong tiếng Việt hiện đại.
- source_word: ἔστησεν ἡμέραν
  choice: đã ấn định một ngày
  rationale: Diễn đạt một thời điểm đã được thiết lập chắc chắn, với sắc thái trang trọng phù hợp.
- source_word: ἐν ᾗ μέλλει κρίνειν
  choice: để xét xử
  rationale: Trong mạch câu, cụm này chỉ mục đích và hành động phán xét sẽ diễn ra vào ngày đã định; cách diễn đạt này tự nhiên mà không làm suy yếu tính tương lai.
- source_word: τὴν οἰκουμένην
  choice: thế giới có người ở
  rationale: Phản ánh nghĩa cụ thể của οἰκουμένη là thế giới cư trú, đồng thời giữ phạm vi phổ quát đối với loài người.
- source_word: ἐν δικαιοσύνῃ
  choice: theo lẽ công chính
  rationale: Giữ trường nghĩa của δικαιοσύνη và diễn đạt tự nhiên cách thức hay chuẩn mực của sự xét xử.
- source_word: ἐν ἀνδρὶ ᾧ ὥρισεν
  choice: bởi một người mà Ngài đã chỉ định
  rationale: Giữ giới tính cụ thể của ἀνήρ, dạng không có mạo từ, và nghĩa chỉ định của ὁρίζω.
- source_word: πίστιν παρασχὼν πᾶσιν
  choice: Ngài đã ban bằng chứng cho mọi người
  rationale: Trong thành ngữ này, πίστις mang nghĩa sự bảo đảm hay bằng chứng xác nhận, chứ không chủ yếu là đức tin chủ quan.
- source_word: ἀναστήσας αὐτὸν ἐκ νεκρῶν
  choice: bằng cách khiến người ấy sống lại từ cõi chết
  rationale: Diễn đạt phân từ như phương tiện qua đó Đức Chúa Trời ban bằng chứng, đồng thời giữ đại từ quy chiếu về người đã được chỉ định.
theological_decisions:
- issue: Nghĩa của δικαιοσύνη trong bối cảnh phán xét
  choice: theo lẽ công chính
  alternative: theo công lý
  rationale: “Công chính” giữ thuật ngữ thần học rộng hơn của δικαιοσύνη; “công lý” cũng hợp bối cảnh xét xử nên được ghi ở chú thích.
- issue: Nghĩa của πίστις trong cụm πίστιν παρασχὼν πᾶσιν
  choice: bằng chứng
  alternative: 'sự bảo đảm; theo sát chữ: đức tin'
  rationale: Kết hợp với παρέχω ở đây nói đến sự xác nhận công khai qua việc sống lại. Dịch đơn thuần là “đức tin” dễ khiến độc giả hiểu thành Đức Chúa Trời ban đức tin chủ quan cho tất cả mọi người.
- issue: Cách dịch ἀνδρί
  choice: một người
  alternative: người ấy; người đàn ông
  rationale: Danh từ Hy Lạp chỉ một người nam và không có mạo từ. “Một người” tự nhiên hơn trong tiếng Việt, còn ngữ cảnh xác định người này là Chúa Giê-su mà không cần đưa tên vào câu.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Dùng “Ngài” cho chủ thể là Đức Chúa Trời theo ngữ cảnh trước đó; dùng “người ấy” để tránh lặp và không đưa tên Chúa Giê-su vào khi nguyên văn chỉ dùng đại từ. Tất cả dấu chú thích đều xuất hiện ngay sau cụm từ liên quan.
