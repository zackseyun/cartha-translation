  text: So Paul went out from among them[a].
translation:
  language: vi
  text: Vậy, Phao-lô đi ra khỏi giữa họ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “Như vậy, Phao-lô rời khỏi giữa họ.”'
    reason: Giữ phương án dịch khác cho οὕτως và ἐξῆλθεν, đồng thời bảo toàn hình ảnh không gian của ἐκ μέσου αὐτῶν.
lexical_decisions:
- source_word: οὕτως
  choice: Vậy
  rationale: Ở đây, οὕτως nối kết và khép lại diễn tiến câu chuyện; “Vậy” diễn đạt tự nhiên sắc thái kết luận hoặc tiếp nối mà không làm rõ quá mức quan hệ logic.
- source_word: ὁ Παῦλος
  choice: Phao-lô
  rationale: Dùng dạng tên riêng đã quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
- source_word: ἐξῆλθεν
  choice: rời khỏi
  rationale: Động từ ἐξέρχομαι ở thì aorist chỉ hành động đi ra hoặc rời đi; “rời khỏi” tự nhiên trong tiếng Việt và phù hợp với cụm chỉ việc ra khỏi một nhóm người.
- source_word: ἐκ μέσου αὐτῶν
  choice: khỏi họ
  rationale: Cụm này theo nghĩa đen là “ra khỏi giữa họ”; trong ngữ cảnh, “khỏi họ” diễn đạt gọn, tự nhiên việc Phao-lô rời nhóm người đang tụ họp, còn cách nói sát hình ảnh hơn được giữ trong chú thích.
