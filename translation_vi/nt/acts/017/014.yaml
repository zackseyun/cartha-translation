    rationale: Chú thích a giải thích οἱ ἀδελφοί/các anh em, nên cần được gắn với chính cụm này; vị trí hiện tại dễ khiến người đọc hiểu sai phạm vi chú thích.
  - severity: low
    issue: “Ngay lúc ấy ... lập tức” trùng lặp và “tiễn ... đi” có sắc thái hộ tống.
    rationale: εὐθέως δὲ τότε đánh dấu tiến triển tự sự kèm tính tức thì, không cần hai trạng ngữ gần đồng nghĩa. ἐξαπέστειλαν nói đến việc phái/gửi Phao-lô đi, không khẳng định các anh em hộ tống ông.
