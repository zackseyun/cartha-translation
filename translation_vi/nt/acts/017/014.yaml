  rationale: Sửa vị trí neo chú thích để mỗi chú thích gắn với cụm từ nó giải thích; thay cách diễn đạt trùng lặp và sắc thái hộ tống bằng “Bấy giờ ... lập tức phái ... đi”. “Đến tận biển” giữ được sự mơ hồ hợp lý của nguyên ngữ về việc đến bờ biển hay đi tiếp bằng đường biển.
