  text: εὐθέως δὲ τότε τὸν Παῦλον ἐξαπέστειλαν οἱ ἀδελφοὶ πορεύεσθαι ⸀ἕως ἐπὶ τὴν θάλασσαν· ⸂ὑπέμεινάν τε⸃ ὅ τε Σιλᾶς καὶ ὁ Τιμόθεος ἐκεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/014.yaml
  text: Then the brothers immediately sent Paul away to go as far as the sea[b][a], but both Silas and Timothy remained there.
translation:
  language: vi
  text: Bấy giờ, các anh em[a] lập tức phái Phao-lô đi đến tận biển[b], còn cả Si-la và Ti-mô-thê đều ở lại đó.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “anh chị em”; từ Hy Lạp là “anh em” và có thể dùng để chỉ chung các tín hữu.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “đến biển” hoặc “về phía biển”; cách diễn đạt Hy Lạp có thể chỉ việc đi đến tận vùng duyên hải mà không nói rõ hơn.
    reason: alternative_reading
lexical_decisions:
- source_word: εὐθέως δὲ τότε
  choice: Ngay lúc ấy ... lập tức
  rationale: Diễn đạt cả bước chuyển thời gian của δὲ τότε lẫn tính khẩn trương của εὐθέως bằng tiếng Việt tự nhiên, dù có chủ ý nhấn mạnh thời điểm và sự mau chóng.
- source_word: ἐξαπέστειλαν
  choice: tiễn ... đi
  rationale: Trong ngữ cảnh các tín hữu giúp Phao-lô rời nơi ấy, “tiễn ... đi” tự nhiên hơn “sai đi” và vẫn thể hiện việc đưa ông rời khỏi địa điểm.
- source_word: οἱ ἀδελφοὶ
  choice: các anh em
  rationale: Giữ hình thức giống đực số nhiều của nguyên văn; trong ngữ cảnh, từ này có thể chỉ chung cộng đồng tín hữu, nên ghi chú nêu cách hiểu bao hàm.
- source_word: πορεύεσθαι
  choice: đi
  rationale: Cách diễn đạt đơn giản, tự nhiên cho động từ nguyên mẫu chỉ hành trình sau động từ sai/tiễn đi.
- source_word: ἕως ἐπὶ τὴν θάλασσαν
  choice: đến tận bờ biển
  rationale: “Đến tận” phản ánh ἕως, còn “bờ biển” diễn đạt đích đến trên đất liền rõ và tự nhiên hơn “biển”, nhưng vẫn không khẳng định Phao-lô đã xuống tàu.
- source_word: ὑπέμεινάν
  choice: ở lại
  rationale: Trong ngữ cảnh này, động từ có nghĩa lưu lại tại nơi ấy, không phải chịu đựng.
- source_word: ὅ τε Σιλᾶς καὶ ὁ Τιμόθεος
  choice: Si-la và Ti-mô-thê đều
  rationale: Cấu trúc “đều” chuyển tải sự nhấn mạnh ghép đôi của τε ... καὶ một cách tự nhiên trong tiếng Việt.
- source_word: ἐκεῖ
  choice: đó
  rationale: Từ chỉ nơi chốn thông dụng, quy chiếu về Bê-rê trong văn cảnh.
theological_decisions:
- issue: Cách dịch ἀδελφοί khi chỉ cộng đồng tín hữu
  choice: các anh em
  alternative: anh chị em; các tín hữu
  rationale: Giữ hình thức giống đực của nguyên văn trong chính văn, đồng thời ghi chú rằng từ Hy Lạp có thể được dùng theo nghĩa tập thể, bao gồm các tín hữu nói chung.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng cách phiên âm tên riêng quen thuộc “Phao-lô”, “Si-la”, “Ti-mô-thê”. Các dấu chú thích đều xuất hiện trong chính văn; thứ tự [b][a] đặt ngay sau các cụm từ tương ứng theo bố cục câu.
