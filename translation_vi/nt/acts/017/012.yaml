id: ACT.17.12
reference: Acts 17:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: πολλοὶ μὲν οὖν ἐξ αὐτῶν ἐπίστευσαν, καὶ τῶν Ἑλληνίδων γυναικῶν τῶν εὐσχημόνων καὶ ἀνδρῶν οὐκ ὀλίγοι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/012.yaml
  text: Therefore many of them believed[b][a], and not a few of the prominent Greek women and men.
translation:
  language: vi
  text: Vì vậy, nhiều người trong số họ đã tin; cũng có không ít[b] phụ nữ Hy Lạp có địa vị[a] và nam giới.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “đáng kính” hoặc “thuộc tầng lớp có địa vị cao.”
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn Hy Lạp là “không ít,” một lối nói hàm ý một số lượng đáng kể.
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ μὲν οὖν
  choice: Vì vậy, nhiều người
  rationale: Cụm tiểu từ μὲν οὖν vừa chuyển ý vừa nêu kết quả từ việc tra xét Kinh Thánh ở câu trước. “Vì vậy” diễn đạt tự nhiên quan hệ suy luận này mà không cố dịch riêng từng tiểu từ.
- source_word: ἐξ αὐτῶν
  choice: trong số họ
  rationale: Giữ nghĩa bộ phận của ἐξ và chỉ về nhóm người Bê-rê được nhắc đến ngay trước đó.
- source_word: ἐπίστευσαν
  choice: đã tin
  rationale: Dịch trực tiếp động từ πιστεύω, không thêm đối tượng hay công thức thần học vốn chỉ được hiểu từ văn cảnh.
- source_word: τῶν Ἑλληνίδων γυναικῶν
  choice: phụ nữ Hy Lạp
  rationale: Ἑλληνίδων chỉ căn tính Hy Lạp của các phụ nữ; γυναικῶν ở đây không cần hiểu là “những người vợ” vì câu không nói đến quan hệ hôn nhân.
- source_word: τῶν εὐσχημόνων
  choice: có địa vị
  rationale: Trong văn cảnh này, εὐσχήμων chủ yếu nói đến vị thế xã hội đáng kể hoặc được kính trọng. “Có địa vị” rõ ràng, tự nhiên trong tiếng Việt hiện đại và tránh thu hẹp nghĩa thành phẩm chất đạo đức.
- source_word: οὐκ ὀλίγοι
  choice: không ít
  rationale: Giữ nguyên lối nói giảm phủ định của nguyên văn, hàm ý một số lượng đáng kể, thay vì làm phẳng thành “nhiều”.
- source_word: καὶ ἀνδρῶν
  choice: và nam giới
  rationale: Dịch đơn giản liên từ καὶ và danh từ ἀνδρῶν; cách diễn đạt không tự ý gán tính từ giống cái εὐσχημόνων cho nam giới.
theological_decisions:
- issue: Có nên diễn đạt ἐπίστευσαν bằng ngôn ngữ tín lý Kitô giáo rõ hơn hay không
  choice: đã tin
  alternative: đã tin Đấng Mê-si-a; đã tin sứ điệp
  rationale: Câu này không nêu rõ bổ ngữ của hành động tin; bổ ngữ được hiểu từ văn cảnh. Dịch “đã tin” giữ nguyên mức độ minh thị của nguyên văn và không đưa thêm một công thức tín lý vào câu.
- issue: Phạm vi bổ nghĩa của εὐσχημόνων
  choice: chỉ gắn “có địa vị” với phụ nữ Hy Lạp
  alternative: gắn “có địa vị” với cả phụ nữ và nam giới
  rationale: εὐσχημόνων mang hình thái giống cái số nhiều và trực tiếp bổ nghĩa cho γυναικῶν; vì vậy bản dịch không mở rộng đặc điểm này sang nhóm nam giới.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, dùng cấu trúc câu gọn và dễ hiểu. Dấu chấm phẩy làm rõ rằng nhóm phụ nữ Hy Lạp và nam giới là phần bổ sung cho “nhiều người trong số họ,” đồng thời giữ nhịp chuyển ý của nguyên văn.
