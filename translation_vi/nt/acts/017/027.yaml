id: ACT.17.27
reference: Acts 17:27
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ζητεῖν τὸν ⸀θεὸν εἰ ἄρα γε ψηλαφήσειαν αὐτὸν καὶ εὕροιεν, καί γε οὐ μακρὰν ἀπὸ ἑνὸς ἑκάστου ἡμῶν ὑπάρχοντα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/027.yaml
  text: that they should seek God[a], if perhaps they might grope for him and find him—though indeed he is not far from each one of us.
translation:
  language: vi
  text: để họ tìm kiếm Đức Chúa Trời, may ra có thể dò dẫm tìm Ngài và gặp được Ngài[a]—dù thật ra Ngài không cách xa mỗi một người trong chúng ta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Dò dẫm tìm” dịch một động từ Hy Lạp gợi hình ảnh tìm kiếm bằng cách sờ quanh, như khi khả năng nhận biết bị hạn chế hoặc khi ở trong bóng tối.
    reason: lexical_alternative
lexical_decisions:
- source_word: ζητεῖν
  choice: để họ tìm kiếm
  rationale: Động từ nguyên mẫu phụ thuộc vào mệnh đề trước và mang sắc thái mục đích; cấu trúc “để họ” diễn đạt tự nhiên trong tiếng Việt.
- source_word: τὸν θεόν
  choice: Đức Chúa Trời
  rationale: Danh xưng phổ thông, trang trọng và tự nhiên trong tiếng Việt cho θεός khi chỉ Đức Chúa Trời.
- source_word: εἰ ἄρα γε
  choice: may ra có thể
  rationale: Giữ sắc thái dè dặt, bất định của tổ hợp tiểu từ mà không làm cho việc tìm kiếm trở nên chắc chắn hay vô vọng.
- source_word: ψηλαφήσειαν
  choice: dò dẫm tìm
  rationale: Gợi đúng hình ảnh tìm bằng xúc giác trong điều kiện nhận thức hạn chế; tự nhiên hơn cách dịch sát chữ “sờ tìm”.
- source_word: καὶ εὕροιεν
  choice: và gặp được Ngài
  rationale: “Gặp được” diễn đạt kết quả tìm thấy một hữu thể có ngôi vị; lực khả năng của thức mong mỏi được truyền qua “may ra có thể”.
- source_word: καί γε
  choice: dù thật ra
  rationale: 'Thể hiện sắc thái nhượng bộ và nhấn mạnh: việc con người tìm kiếm còn dò dẫm, nhưng Đức Chúa Trời thực sự ở gần.'
- source_word: οὐ μακρὰν ἀπὸ ἑνὸς ἑκάστου ἡμῶν
  choice: không ở xa mỗi một người trong chúng ta
  rationale: Giữ nguyên sự nhấn mạnh phân phối của ἑνὸς ἑκάστου, đồng thời vẫn rõ nghĩa trong tiếng Việt.
- source_word: ὑπάρχοντα
  choice: Ngài không ở xa
  rationale: Chuyển phân từ thành mệnh đề hữu hạn tự nhiên, khẳng định thực tại về sự gần gũi của Đức Chúa Trời.
theological_decisions:
- issue: Khả năng con người tìm biết Đức Chúa Trời và sự gần gũi của Ngài
  choice: Giữ đồng thời sắc thái dè dặt trong “may ra có thể dò dẫm” và lời khẳng định “dù thật ra Ngài không ở xa”.
  alternative: Làm trơn câu bằng “tìm và gặp Ngài”, giảm nhẹ hình ảnh dò dẫm; hoặc dịch sát hơn là “sờ tìm Ngài”.
  rationale: Bản Hy Lạp đặt giới hạn nhận thức của con người bên cạnh sự gần gũi có thật của Đức Chúa Trời; bản dịch không nên giải tỏa sức căng này theo hướng quá lạc quan hoặc quá bi quan.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. Dùng “Ngài” để quy chiếu Đức Chúa Trời; “mỗi một người” được giữ nhằm phản ánh sự nhấn mạnh của nguyên văn. Dấu gạch ngang làm nổi bật mệnh đề nhượng bộ.
