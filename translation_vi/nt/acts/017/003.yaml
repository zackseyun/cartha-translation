id: ACT.17.3
reference: Acts 17:3
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: διανοίγων καὶ παρατιθέμενος ὅτι τὸν χριστὸν ἔδει παθεῖν καὶ ἀναστῆναι ἐκ νεκρῶν, καὶ ὅτι οὗτός ἐστιν ⸂ὁ χριστός, ὁ⸃ Ἰησοῦς ὃν ἐγὼ καταγγέλλω ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/003.yaml
  text: explaining and demonstrating that the Messiah had to suffer and rise from the dead[a], and that this Jesus, whom I proclaim to you[b], is the Messiah.
translation:
  language: vi
  text: ông giải thích và trình bày bằng chứng rằng Đấng Mê-si[a] phải chịu khổ và sống lại từ cõi chết, và rằng Đức Giê-su này, Đấng tôi rao truyền cho anh em, chính là Đấng Mê-si.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Đấng Mê-si” cũng có thể dịch là “Đấng Ki-tô” ở cả hai chỗ trong câu này. Bản Hy Lạp dùng dạng chủ động “sống lại”; cũng có thể dịch là “được làm cho sống lại từ cõi chết.”
    reason: Ghi nhận cách dịch truyền thống của Χριστός và cách diễn đạt thay thế cho ἀναστῆναι.
lexical_decisions:
- source_word: διανοίγων
  choice: giải thích
  rationale: Phân từ này diễn tả việc Phao-lô mở nghĩa Kinh Thánh, làm cho nội dung trở nên sáng rõ; “giải thích” tự nhiên và đúng ngữ cảnh.
- source_word: παρατιθέμενος
  choice: trình bày bằng chứng
  rationale: Động từ chỉ việc đặt các luận cứ trước người nghe; cách dịch này thể hiện việc lập luận dựa trên Kinh Thánh mà không cường điệu thành chứng minh tuyệt đối.
- source_word: τὸν χριστόν / ὁ χριστός
  choice: Đấng Mê-si
  rationale: Cả hai lần Χριστός đều được dùng như tước hiệu của Đấng được xức dầu mà dân Do Thái mong đợi, không như một phần của tên riêng.
- source_word: ἔδει
  choice: phải
  rationale: Diễn đạt sự tất yếu, trong ngữ cảnh là sự tất yếu theo chương trình của Đức Chúa Trời được bày tỏ trong Kinh Thánh.
- source_word: παθεῖν
  choice: chịu khổ
  rationale: Cách dịch trực tiếp, tự nhiên của πάσχω trong lời khẳng định về sự thương khó của Đấng Mê-si.
- source_word: ἀναστῆναι ἐκ νεκρῶν
  choice: sống lại từ cõi chết
  rationale: Giữ sắc thái chủ động của động từ nguyên mẫu ἀναστῆναι và diễn đạt tự nhiên ý ra khỏi tình trạng thuộc về những người chết.
- source_word: καταγγέλλω
  choice: rao truyền
  rationale: Thể hiện hành động công khai loan báo sứ điệp, phù hợp với ngữ cảnh truyền giảng mà không giới hạn vào hình thức giảng đạo.
- source_word: ὑμῖν
  choice: cho anh em
  rationale: Đại từ số nhiều chỉ những người nghe trong hội đường; “anh em” phù hợp với lối xưng hô cộng đồng và văn phong trang trọng, tự nhiên.
theological_decisions:
- issue: Cách dịch Χριστός khi được dùng hai lần như một tước hiệu
  choice: Đấng Mê-si
  alternative: Đấng Ki-tô
  rationale: “Đấng Mê-si” làm rõ bối cảnh Do Thái và lập luận rằng Đức Giê-su chính là Đấng được xức dầu mà Kinh Thánh nói đến; cách gọi truyền thống được ghi ở chú thích.
- issue: Sắc thái thể của ἀναστῆναι
  choice: sống lại từ cõi chết
  alternative: được làm cho sống lại từ cõi chết
  rationale: Bản Hy Lạp dùng động từ nguyên mẫu chủ động, nên “sống lại” bám sát hình thức câu hơn. Cách dịch này không phủ nhận những chỗ khác nói Đức Chúa Trời làm cho Đức Giê-su sống lại.
- issue: Quan hệ cú pháp của mệnh đề cuối
  choice: 'chuyển thành lời trình bày trực tiếp: “Đức Giê-su mà tôi rao truyền cho anh em chính là Đấng Mê-si”'
  alternative: và rằng Đức Giê-su này, Đấng tôi rao truyền cho anh em, là Đấng Mê-si
  rationale: Cách trình bày trực tiếp giữ nguyên nội dung của mệnh đề ὅτι, đồng thời cho câu tiếng Việt rõ ràng, tự nhiên và tránh cụm “Đức Giê-su này” kém thuận tai.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Giê-su,” “Đấng Mê-si” và “anh em” theo lối gọi quen thuộc trong tiếng Việt Cơ Đốc; cấu trúc lời dẫn trực tiếp giúp mệnh đề cuối sáng rõ. Dấu chú thích [a] xuất hiện trong chính văn.
