source:
  edition: SBLGNT
  text: Οἱ δὲ ἀδελφοὶ εὐθέως ⸀διὰ νυκτὸς ἐξέπεμψαν τόν τε Παῦλον καὶ τὸν Σιλᾶν εἰς Βέροιαν, οἵτινες παραγενόμενοι εἰς τὴν συναγωγὴν ⸂τῶν Ἰουδαίων ἀπῄεσαν⸃·
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/010.yaml
  text: Then the brothers immediately sent both Paul and Silas away by night to Berea[a], and when they arrived[c][b], they went into the synagogue of the Jews.
translation:
  language: vi
  text: Ngay trong đêm, các anh em[a] lập tức tiễn cả Phao-lô lẫn Si-la đi Bê-rê. Khi đến nơi, hai ông vào hội đường của người Do Thái.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Các anh em” cũng có thể được hiểu là “các anh chị em”, tức cộng đồng tín hữu nói chung.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀδελφοὶ
  choice: các anh em
  rationale: Giữ hình thức số nhiều giống đực và cách gọi thân thuộc trong cộng đồng; trong ngữ cảnh, cụm này có thể bao gồm cả cộng đồng tín hữu rộng hơn.
- source_word: εὐθέως διὰ νυκτός
  choice: ngay trong đêm, ... lập tức
  rationale: Diễn đạt cả tính khẩn trương của εὐθέως và thời điểm diễn ra hành động của διὰ νυκτός bằng tiếng Việt tự nhiên.
- source_word: ἐξέπεμψαν
  choice: tiễn ... đi
  rationale: Trong ngữ cảnh các tín hữu giúp Phao-lô và Si-la rời đi khẩn cấp, “tiễn ... đi” tự nhiên hơn “sai đi” mà vẫn giữ ý đưa họ rời khỏi nơi ấy.
- source_word: τόν τε Παῦλον καὶ τὸν Σιλᾶν
  choice: cả Phao-lô lẫn Si-la
  rationale: Thể hiện rõ cấu trúc tương liên τε ... καί.
- source_word: Βέροιαν
  choice: Bê-rê
  rationale: Dùng dạng phiên âm quen thuộc trong truyền thống Kinh Thánh tiếng Việt cho địa danh Βέροια.
- source_word: οἵτινες παραγενόμενοι
  choice: Khi đến nơi, hai ông
  rationale: Hiểu phân từ theo nghĩa thời gian và xác định tự nhiên rằng chủ thể tiếp theo là Phao-lô và Si-la.
- source_word: συναγωγὴν τῶν Ἰουδαίων
  choice: hội đường của người Do Thái
  rationale: Giữ minh bạch cấu trúc sở hữu của nguyên văn; đây là sự nhận diện cộng đồng địa phương, không hàm ý phán xét.
- source_word: ἀπῄεσαν
  choice: vào
  rationale: Kết hợp tự nhiên với εἰς và đích đến là hội đường; quá khứ chưa hoàn thành được diễn đạt bằng lối kể chuyện thông thường trong tiếng Việt.
theological_decisions:
- issue: Phạm vi chỉ người của ἀδελφοὶ
  choice: các anh em
  alternative: các anh chị em; các tín hữu
  rationale: Bản chính giữ hình thức giống đực của tiếng Hy Lạp và sắc thái thân thuộc, đồng thời ghi nhận rằng từ này trong ngữ cảnh cộng đồng có thể chỉ rộng hơn nam giới.
- issue: Cách diễn đạt τῶν Ἰουδαίων
  choice: của người Do Thái
  alternative: hội đường Do Thái
  rationale: Giữ gần cấu trúc Hy Lạp và tránh thêm một cách hiểu thần học; cụm từ chỉ hội đường của cộng đồng Do Thái tại Bê-rê.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đưa “ngay trong đêm” lên đầu câu để nhịp kể tự nhiên, đồng thời giữ “lập tức” nhằm bảo toàn cả hai nét nghĩa thời gian và khẩn cấp. Đại từ “hai ông” làm rõ chủ thể của hành động vào hội đường mà không gây nhập nhằng với các anh em vừa được nhắc đến.
