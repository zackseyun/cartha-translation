  - severity: low
    issue: Chú thích “được nhập chung phần”
    rationale: Cụm từ này không phải lối diễn đạt tự nhiên trong tiếng Việt hiện đại. Chú thích nên nêu phương án sát nghĩa hơn và giải thích ngắn sắc thái “chia phần/gắn mình” của động từ hiếm.
