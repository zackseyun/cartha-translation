- from: Một số người trong họ được thuyết phục và nhập đoàn với Phao-lô và Si-la[a]; cùng với họ còn có đông đảo người Hy Lạp kính sợ Đức Chúa Trời và không ít phụ nữ có địa vị.
  to: Một số người trong số họ đã được thuyết phục và liên kết với Phao-lô và Si-la[a]. Cũng có đông đảo người Hy Lạp kính sợ Đức Chúa Trời và không ít phụ nữ có địa vị.
