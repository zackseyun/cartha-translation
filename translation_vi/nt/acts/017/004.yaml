    issue: “nhập đoàn với” cho προσεκληρώθησαν
    rationale: Cụm này không tự nhiên khi đi với tên hai người và có thể gợi việc gia nhập một đoàn thể. “liên kết với” diễn đạt rõ hơn ý gắn mình với/đứng về phía Phao-lô và Si-la, đồng thời không biến động từ này thành một thuật ngữ kỹ thuật.
  - severity: low
