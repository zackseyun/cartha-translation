id: ACT.17.4
reference: Acts 17:4
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καί τινες ἐξ αὐτῶν ἐπείσθησαν καὶ προσεκληρώθησαν τῷ Παύλῳ καὶ τῷ Σιλᾷ, τῶν τε σεβομένων Ἑλλήνων ⸂πλῆθος πολὺ⸃ γυναικῶν τε τῶν πρώτων οὐκ ὀλίγαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/004.yaml
  text: And some of them were persuaded and joined Paul and Silas[a], along with a large number of the God-fearing Greeks and not a few of the leading women.
translation:
  language: vi
  text: Một số người trong số họ đã được thuyết phục và liên kết với Phao-lô và Si-la[a]. Cũng có đông đảo người Hy Lạp kính sợ Đức Chúa Trời và không ít phụ nữ có địa vị.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc, sát hơn: “được phân vào cùng với Phao-lô và Si-la.” Động từ hiếm này gợi ý việc gắn phần mình với họ.'
    reason: Nêu sắc thái sát nghĩa của προσεκληρώθησαν—được gắn hay phân vào cùng một phần với ai—trong khi bản văn chính dùng cách diễn đạt tự nhiên hơn là “liên kết với.”
lexical_decisions:
- source_word: τινες ἐξ αὐτῶν
  choice: một số người trong họ
  rationale: Diễn đạt tự nhiên cấu trúc chỉ một phần trong toàn thể, quy chiếu về những người nghe trong hội đường ở câu trước.
- source_word: ἐπείσθησαν
  choice: được thuyết phục
  rationale: Giữ đúng sắc thái bị động của πείθω và không thay bằng thuật ngữ đức tin rõ hơn mà nguyên văn không dùng.
- source_word: προσεκληρώθησαν
  choice: nhập đoàn với
  rationale: Động từ hiếm này chỉ việc được gắn kết hay liên kết với một người; cách dịch này diễn đạt sự gia nhập và đồng hành mà không biến nó thành một thuật ngữ giáo phái.
- source_word: τῷ Παύλῳ καὶ τῷ Σιλᾷ
  choice: với Phao-lô và Si-la
  rationale: Giới từ “với” chuyển tải tự nhiên quan hệ liên kết do cách tặng cách trong tiếng Hy Lạp biểu thị.
- source_word: τῶν τε σεβομένων Ἑλλήνων
  choice: người Hy Lạp kính sợ Đức Chúa Trời
  rationale: Trong sách Công Vụ, cụm này thường chỉ những người ngoại bang tôn kính Đức Chúa Trời của Israel và có liên hệ với việc thờ phượng tại hội đường.
- source_word: πλῆθος πολὺ
  choice: đông đảo
  rationale: Cách diễn đạt gọn, tự nhiên trong tiếng Việt cho một số lượng lớn.
- source_word: γυναικῶν τε τῶν πρώτων
  choice: phụ nữ có địa vị
  rationale: πρῶτος ở đây nói đến địa vị xã hội nổi bật, không phải thứ tự thời gian; “có địa vị” rõ nghĩa và tự nhiên.
- source_word: οὐκ ὀλίγαι
  choice: không ít
  rationale: Giữ phép nói giảm có chủ ý của Lu-ca thay vì làm phẳng thành “nhiều”.
- source_word: τε ... τε
  choice: cùng với họ còn có ... và
  rationale: Thể hiện rõ hai nhóm được bổ sung bên cạnh một số người Do Thái đã được thuyết phục, đồng thời tạo câu tiếng Việt trôi chảy.
theological_decisions:
- issue: Có nên dịch ἐπείσθησαν bằng ngôn ngữ nói rõ sự tin đạo hay không
  choice: được thuyết phục
  alternative: tin; tin nhận
  rationale: Bối cảnh nói về sự đáp ứng trước lời rao giảng, nhưng nguyên văn dùng πείθω chứ không dùng πιστεύω. Cách dịch đã chọn giữ sự phân biệt từ vựng và không nói quá điều câu này trực tiếp diễn đạt.
- issue: Mức độ làm rõ căn tính tôn giáo của σεβομένων Ἑλλήνων
  choice: người Hy Lạp kính sợ Đức Chúa Trời
  alternative: người Hy Lạp sùng đạo; người Hy Lạp thờ phượng
  rationale: Cụm từ trong Công Vụ chỉ những người ngoại bang tôn kính Đức Chúa Trời và gắn với sinh hoạt hội đường. Nêu rõ đối tượng của lòng kính sợ giúp độc giả hiện đại hiểu đúng bối cảnh mà không thêm một khẳng định giáo lý.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Được thuyết phục” giữ sát sắc thái bị động; “không ít” bảo tồn lối nói giảm của nguyên văn. Dấu chấm phẩy và cụm “cùng với họ còn có” làm rõ cấu trúc liệt kê các nhóm người mà không thay đổi nội dung.
