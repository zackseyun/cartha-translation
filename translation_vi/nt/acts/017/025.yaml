  to: Ngài cũng không nhận sự phục vụ từ tay con người[a], như thể Ngài cần điều gì, vì chính Ngài ban cho muôn loài sự sống, hơi thở và mọi sự.
  rationale: 'Sửa cách diễn đạt bị động không tự nhiên “được tay người phục vụ” thành “không nhận sự phục vụ từ tay con người”. Sửa này không thay đổi ý nghĩa: Đức Chúa Trời không lệ thuộc vào việc con người phục dịch Ngài; đồng thời vẫn duy trì hình ảnh “tay” của ὑπὸ χειρῶν ἀνθρωπίνων. Chú thích được điều chỉnh tương ứng để nêu các lựa chọn tự nhiên hơn và không thu hẹp θεραπεύεται vào nghĩa “thờ phượng”.'
