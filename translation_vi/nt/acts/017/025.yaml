source:
  edition: SBLGNT
  text: οὐδὲ ὑπὸ χειρῶν ⸀ἀνθρωπίνων θεραπεύεται προσδεόμενός τινος, αὐτὸς διδοὺς πᾶσι ζωὴν καὶ πνοὴν ⸂καὶ τὰ⸃ πάντα·
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/025.yaml
  text: Nor is he served by human hands[a], as though he needed anything, since he himself gives to all life and breath and all things.
translation:
  language: vi
  text: Ngài cũng không nhận sự phục vụ từ tay con người[a], như thể Ngài cần điều gì, vì chính Ngài ban cho muôn loài sự sống, hơi thở và mọi sự.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “được con người thờ phượng” hoặc “được con người hầu hạ”. Động từ Hy Lạp có thể chỉ sự phục vụ hay hầu hạ trong bối cảnh tôn giáo; tại đây, ý chính là Đức Chúa Trời không lệ thuộc vào sự phục dịch của con người.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲ
  choice: cũng không
  rationale: Nối tiếp lời phủ định ở câu trước một cách tự nhiên trong tiếng Việt.
- source_word: ὑπὸ χειρῶν ἀνθρωπίνων
  choice: tay người
  rationale: Giữ hình ảnh cụ thể của nguyên văn và lối diễn đạt Kinh Thánh quen thuộc mà không cổ hóa quá mức.
- source_word: θεραπεύεται
  choice: được ... phục vụ
  rationale: Trong ngữ cảnh có 'tay người' và mệnh đề nói Ngài không thiếu thốn, động từ chỉ việc được hầu hạ hoặc phục dịch, đặc biệt trong bối cảnh tôn giáo, chứ không mang nghĩa chữa lành.
- source_word: προσδεόμενός τινος
  choice: như thể Ngài cần điều gì
  rationale: 'Diễn đạt tự nhiên sức mạnh tu từ của phân từ: Đức Chúa Trời không nhận sự phục vụ theo cách một hữu thể thiếu thốn cần được đáp ứng.'
- source_word: αὐτὸς
  choice: chính Ngài
  rationale: 'Bảo toàn sắc thái nhấn mạnh và sự tương phản: chính Đức Chúa Trời là Đấng ban phát.'
- source_word: διδοὺς
  choice: ban
  rationale: Chuyển phân từ thành động từ hữu hạn để câu tiếng Việt sáng rõ, đồng thời giữ quan hệ giải thích nguyên nhân.
- source_word: πᾶσι
  choice: cho muôn loài
  rationale: Giữ phạm vi phổ quát mà không giới hạn đối tượng vào con người; 'muôn loài' phù hợp sắc thái bao quát về mọi thọ tạo trong ngữ cảnh.
- source_word: ζωὴν
  choice: sự sống
  rationale: Cách dịch chuẩn, chỉ chính sự sống do Đức Chúa Trời ban.
- source_word: πνοὴν
  choice: hơi thở
  rationale: Nghĩa tự nhiên khi đi đôi với 'sự sống', nhấn mạnh sự lệ thuộc của thọ tạo; tránh đọc thành 'thần linh'.
- source_word: καὶ τὰ πάντα
  choice: và mọi sự
  rationale: Giữ sức bao quát của cụm Hy Lạp và văn phong trang trọng, tự nhiên.
theological_decisions:
- issue: θεραπεύεται nên được dịch theo nghĩa thờ phượng hay theo nghĩa rộng hơn là nhận sự phục vụ
  choice: được tay người phục vụ
  alternative: được tay người thờ phượng; được tay người hầu hạ
  rationale: Lập luận nhấn mạnh Đức Chúa Trời không lệ thuộc vào sự phục dịch tôn giáo của con người. 'Phục vụ' bao hàm bối cảnh nghi lễ nhưng không thu hẹp động từ thành riêng hành vi thờ phượng.
- issue: Phạm vi của πᾶσι
  choice: muôn loài
  alternative: mọi người; tất cả
  rationale: Ngữ cảnh mang tính tạo dựng và câu nói về sự sống cùng hơi thở; cách dịch này giữ phạm vi rộng, không quyết định rằng đối tượng chỉ là loài người.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” theo mạch văn chỉ Đức Chúa Trời; giữ hình ảnh “tay người”, sắc thái nhấn mạnh của “chính Ngài”, và tính bao quát của câu.
