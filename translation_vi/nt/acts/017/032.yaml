  source_fidelity: 'Bản dịch truyền đạt đúng cấu trúc và nội dung của câu Hy Lạp: hoàn cảnh “khi nghe,” chủ đề “sự sống lại của người chết,” hai phản ứng đối lập, và lời hẹn sẽ nghe Phao-lô về vấn đề này “một lần nữa.” Cụm καὶ πάλιν được giữ rõ trong văn bản chính. Không cần buộc cách hiểu thần học cụ thể hơn cho ἀνάστασιν νεκρῶν.'
  naturalness: Tiếng Việt hiện đại, mạch lạc và có giọng văn trang trọng vừa phải. “Khi nghe nói về” và “Chúng tôi sẽ nghe ông nói về việc này một lần nữa” đều tự nhiên trong ngữ cảnh lời thuật và đối thoại.
  terminology: “Sự sống lại của người chết” là cách diễn đạt chuẩn, dễ hiểu, và tương ứng tốt với ἀνάστασιν νεκρῶν. “Chế nhạo” phù hợp với ἐχλεύαζον. Đại từ “ông” phù hợp với ngữ cảnh Phao-lô đang được người nghe trực tiếp đáp lời, không tạo thêm nội dung thần học.
