id: ACT.17.32
reference: Acts 17:32
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἀκούσαντες δὲ ἀνάστασιν νεκρῶν οἱ μὲν ἐχλεύαζον οἱ δὲ εἶπαν Ἀκουσόμεθά σου ⸂περὶ τούτου καὶ πάλιν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/032.yaml
  text: When they heard of the resurrection of the dead[a], some mocked, but others said, “We will hear you again about this.”
translation:
  language: vi
  text: 'Khi nghe nói về sự sống lại của người chết, một số người chế nhạo, nhưng những người khác nói: “Chúng tôi sẽ nghe ông nói về việc này một lần nữa.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀκούσαντες
  choice: Khi nghe nói
  rationale: Phân từ bất định nêu hoàn cảnh thời gian của các động từ chính; cách dịch này tự nhiên trong tiếng Việt và cho thấy họ phản ứng khi nghe đến chủ đề ấy.
- source_word: δὲ
  choice: nhưng
  rationale: Trong mạch câu, δὲ góp phần chuyển sang phản ứng tương phản của thính giả; quan hệ tương phản được diễn đạt tự nhiên cùng cấu trúc οἱ μὲν ... οἱ δὲ.
- source_word: ἀνάστασιν νεκρῶν
  choice: sự sống lại của người chết
  rationale: Giữ cách diễn đạt khái quát của tiếng Hy Lạp về sự sống lại liên quan đến những người chết, không thu hẹp thành một trường hợp riêng.
- source_word: οἱ μὲν ... οἱ δὲ
  choice: một số người ... nhưng những người khác
  rationale: Diễn đạt rõ hai nhóm có phản ứng đối lập.
- source_word: ἐχλεύαζον
  choice: chế nhạo
  rationale: Động từ chỉ hành động nhạo báng; thể chưa hoàn thành có thể gợi diễn tiến, nhưng tiếng Việt tự nhiên không cần thêm ý ‘bắt đầu’ vốn không được từ vựng hóa rõ.
- source_word: εἶπαν
  choice: nói
  rationale: Động từ bất định thuật lại lời đáp của nhóm thứ hai; ‘nói’ là cách tương đương trực tiếp và tự nhiên.
- source_word: Ἀκουσόμεθά σου
  choice: Chúng tôi sẽ nghe ông nói
  rationale: ἀκούω đi với đại từ sở hữu cách mang nghĩa nghe hoặc lắng nghe một người; thêm ‘nói’ giúp câu tiếng Việt rõ và tự nhiên mà không thêm nội dung mới.
- source_word: περὶ τούτου καὶ πάλιν
  choice: về việc này một lần nữa
  rationale: Dịch rõ cả chủ đề περὶ τούτου và lực hiển ngôn của καὶ πάλιν, tránh phải chuyển sắc thái này xuống chú thích.
theological_decisions:
- issue: Ý nghĩa của ngôn ngữ về sự sống lại trước một cử tọa ngoại giáo hỗn hợp
  choice: sự sống lại của người chết
  alternative: sự sống lại từ cõi chết
  rationale: Cụm Hy Lạp ἀνάστασιν νεκρῶν tự nhiên nói đến sự sống lại liên quan đến người chết như một phạm trù. Bản dịch không xác định thêm đối tượng hay cơ chế thần học ngoài điều câu văn nêu.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “ông” để thể hiện cách nhóm thính giả nói trực tiếp với Phao-lô; không thêm từ nối mở đầu tương đương ‘bấy giờ’ vì nguyên văn không có từ chỉ thời gian ấy.
