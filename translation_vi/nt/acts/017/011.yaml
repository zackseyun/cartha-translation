revisions:
- from: 'Những người này có tinh thần cao quý hơn những người ở Tê-sa-lô-ni-ca[a]: họ hết sức sốt sắng đón nhận lời Chúa[b] và hằng ngày tra xét Kinh Thánh để xem những điều ấy có đúng như vậy không.'
  to: Những người này có tinh thần cao quý hơn những người ở Tê-sa-lô-ni-ca[a], vì họ đã hết sức sốt sắng đón nhận lời[b], hằng ngày tra xét Kinh Thánh để xem những điều này có đúng như vậy không.
  rationale: Bản sửa giữ cách hiểu εὐγενέστεροι là phẩm chất đáng khen và bảo lưu lựa chọn từ vựng trong chú thích. “Vì họ” làm rõ quan hệ giải thích của οἵτινες. “Lời” dịch λόγος mà không thêm “Chúa,” đồng thời vẫn giữ được lối nói Kinh Thánh và chú thích “sứ điệp” cho phương án diễn đạt rõ nghĩa hơn.
