  naturalness: Câu văn nhìn chung tự nhiên. Thay dấu hai chấm bằng liên từ giải thích “vì” biểu đạt rõ hơn chức năng giải thích của οἵτινες và sát quan hệ cú pháp-ngữ nghĩa của nguyên văn.
  terminology: “Có tinh thần cao quý hơn,” “Tê-sa-lô-ni-ca,” “Kinh Thánh,” và “tra xét” đều phù hợp. Cần đổi “lời Chúa” thành “lời” để không thêm nội dung vào λόγος; chú thích có thể nêu “sứ điệp” như lựa chọn diễn đạt.
