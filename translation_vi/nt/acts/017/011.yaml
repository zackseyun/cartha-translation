id: ACT.17.11
reference: Acts 17:11
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οὗτοι δὲ ἦσαν εὐγενέστεροι τῶν ἐν Θεσσαλονίκῃ, οἵτινες ἐδέξαντο τὸν λόγον μετὰ πάσης προθυμίας, ⸀τὸ καθ’ ἡμέραν ἀνακρίνοντες τὰς γραφὰς εἰ ἔχοι ταῦτα οὕτως.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/011.yaml
  text: These were more noble-minded than those in Thessalonica[a], for they received the word with all eagerness[b], examining the Scriptures daily to see whether these things were so.
translation:
  language: vi
  text: Những người này có tinh thần cao quý hơn những người ở Tê-sa-lô-ni-ca[a], vì họ đã hết sức sốt sắng đón nhận lời[b], hằng ngày tra xét Kinh Thánh để xem những điều này có đúng như vậy không.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “cao quý hơn.” Từ Hy Lạp có thể nói đến một phẩm chất đáng khen hoặc, ít có khả năng hơn trong ngữ cảnh này, địa vị xã hội cao hơn.'
    reason: lexical_alternative
  - marker: b
    text: 'Hay: “đón nhận sứ điệp.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐγενέστεροι
  choice: có tinh thần cao quý hơn
  rationale: 'Tính từ so sánh này có thể chỉ địa vị hoặc xuất thân cao quý, nhưng mệnh đề tiếp theo mô tả thái độ đáng khen của họ: sốt sắng tiếp nhận và tra xét Kinh Thánh. Cách dịch này giữ sắc thái đánh giá mà không mặc nhiên quy về giai cấp xã hội.'
- source_word: οἵτινες
  choice: họ
  rationale: Đại từ quan hệ đưa vào lời giải thích cho nhận định trước. Dấu hai chấm cùng đại từ “họ” diễn đạt quan hệ giải thích tự nhiên trong tiếng Việt.
- source_word: ἐδέξαντο τὸν λόγον
  choice: đón nhận lời Chúa
  rationale: “Đón nhận” diễn tả thái độ tiếp nhận tích cực; “lời Chúa” là cách nói tự nhiên trong mạch Công Vụ, nơi “lời” chỉ sứ điệp được rao giảng, đồng thời duy trì âm hưởng Kinh Thánh.
- source_word: μετὰ πάσης προθυμίας
  choice: hết sức sốt sắng
  rationale: προθυμία chỉ sự sẵn lòng, nhiệt thành hay sốt sắng; πάσης tăng cường mức độ. Cụm từ tiếng Việt này tự nhiên và giữ đủ cường độ.
- source_word: τὸ καθ’ ἡμέραν
  choice: hằng ngày
  rationale: Cụm giới từ có chức năng trạng từ, diễn tả việc làm thường xuyên mỗi ngày.
- source_word: ἀνακρίνοντες
  choice: tra xét
  rationale: Động từ có nghĩa xem xét hoặc điều tra kỹ. “Tra xét” phù hợp với hành động kiểm chứng dựa trên Kinh Thánh mà không quá chuyên môn.
- source_word: τὰς γραφὰς
  choice: Kinh Thánh
  rationale: Trong ngữ cảnh này, số nhiều γραφαί chỉ các sách thánh của người Do Thái; “Kinh Thánh” là cách gọi chuẩn và dễ hiểu trong tiếng Việt.
- source_word: εἰ ἔχοι ταῦτα οὕτως
  choice: để xem những điều ấy có đúng như vậy không
  rationale: Cách diễn đạt này giữ tính chất câu hỏi gián tiếp và mục đích kiểm chứng, không biến câu thành một khẳng định sẵn về kết quả.
theological_decisions:
- issue: Ý nghĩa của εὐγενέστεροι trong ngữ cảnh
  choice: phẩm chất và thái độ đáng khen (“có tinh thần cao quý hơn”)
  alternative: cao quý hơn về xuất thân hoặc địa vị xã hội
  rationale: Chính câu văn giải thích sự cao quý bằng cách họ đón nhận lời và tra xét Kinh Thánh. Tuy vậy, chú thích vẫn bảo lưu khả năng từ này chỉ địa vị hoặc xuất thân.
- issue: Cách dịch λόγος
  choice: “lời Chúa” trong chính văn
  alternative: “sứ điệp” hoặc sát chữ hơn là “lời”
  rationale: Trong ngữ cảnh Công Vụ, danh từ này chỉ sứ điệp được rao giảng. “Lời Chúa” rõ nghĩa, tự nhiên và giữ âm hưởng thần học quen thuộc mà không thêm nội dung giáo phái.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. “Tê-sa-lô-ni-ca” dùng lối phiên âm Kinh Thánh quen thuộc; “tra xét” giữ sắc thái xem xét kỹ. Các chú thích bảo lưu những khả năng từ vựng có thật trong nguyên ngữ.
