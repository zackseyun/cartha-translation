id: ACT.17.34
reference: Acts 17:34
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τινὲς δὲ ἄνδρες κολληθέντες αὐτῷ ἐπίστευσαν, ἐν οἷς καὶ Διονύσιος ὁ Ἀρεοπαγίτης καὶ γυνὴ ὀνόματι Δάμαρις καὶ ἕτεροι σὺν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/034.yaml
  text: But some men joined him and believed[a], among whom were also Dionysius the Areopagite, and a woman named Damaris[b], and others with them.
translation:
  language: vi
  text: Nhưng có một số người nam gắn bó với Phao-lô và tin[a]; trong số họ có cả Đi-ô-ni-si-ô, người A-rê-ô-pa-gút[b], một phụ nữ tên là Đa-ma-ri, và những người khác cùng với họ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Động từ Hy Lạp được dịch là “gắn bó” cũng có thể hiểu là “kết hợp với” hoặc “bám theo”; từ này gợi ý mối liên hệ cá nhân gần gũi với Phao-lô.
    reason: lexical_alternative
  - marker: b
    text: “Người A-rê-ô-pa-gút” là một danh xưng Hy Lạp; có thể chỉ một thành viên của Hội đồng A-rê-ô-pa-gút, hoặc rộng hơn là một người có liên hệ với cơ quan này.
    reason: cultural_note
lexical_decisions:
- source_word: τινὲς δὲ ἄνδρες
  choice: Nhưng một số người nam
  rationale: δὲ diễn tả sự tương phản nhẹ với các phản ứng ở câu trước; ἄνδρες là danh từ số nhiều giống đực, nên bản dịch giữ rõ nghĩa là những người nam.
- source_word: κολληθέντες αὐτῷ
  choice: gắn bó với Phao-lô
  rationale: κολλάομαι chỉ việc gắn mình với hoặc kết giao mật thiết với một người. Nêu tên Phao-lô thay cho đại từ giúp câu tiếng Việt rõ ràng mà không thay đổi sở chỉ.
- source_word: ἐπίστευσαν
  choice: tin
  rationale: Dịch trực tiếp πιστεύω và không thêm một tân ngữ mà nguyên văn không nêu rõ.
- source_word: ἐν οἷς καὶ
  choice: Trong số họ có
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt để giới thiệu những người cụ thể thuộc nhóm vừa được nhắc đến.
- source_word: Διονύσιος
  choice: Đi-ô-ni-si-ô
  rationale: Phiên âm tên riêng Hy Lạp theo cách dễ đọc trong tiếng Việt.
- source_word: ὁ Ἀρεοπαγίτης
  choice: một thành viên của Hội đồng A-rê-ô-pa-gút
  rationale: Trong ngữ cảnh, danh xưng này nhiều khả năng chỉ người thuộc Hội đồng A-rê-ô-pa-gút; chú thích vẫn bảo lưu khả năng rộng hơn là người có liên hệ với cơ quan ấy.
- source_word: γυνὴ ὀνόματι Δάμαρις
  choice: một phụ nữ tên là Đa-ma-ri
  rationale: Cách dịch trực tiếp, tự nhiên, giữ rõ giới tính và tên riêng.
- source_word: ἕτεροι σὺν αὐτοῖς
  choice: những người khác cùng với họ
  rationale: Giữ ý về những người khác ngoài hai nhân vật được nêu tên và mối liên hệ đồng hành với họ.
theological_decisions:
- issue: Ý nghĩa của πιστεύω trong ngữ cảnh
  choice: tin
  alternative: trở thành người tin / tin nhận
  rationale: Nguyên văn xác nhận họ đã tin để đáp lại lời rao giảng, nhưng không nêu tân ngữ hay một công thức tín lý đầy đủ; “tin” bảo tồn sự cô đọng và độ mở của câu.
- issue: Mối quan hệ giữa κολληθέντες và ἐπίστευσαν
  choice: gắn bó với Phao-lô và tin
  alternative: theo Phao-lô và trở thành tín hữu
  rationale: Giữ hai hành động riêng biệt trong nguyên văn, tránh đồng nhất việc gắn bó với Phao-lô với nội dung hay đối tượng của đức tin.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “người nam” để phản ánh chính xác ἄνδρες, đồng thời “phụ nữ” cho γυνή. Các tên Hy Lạp được phiên âm sang tiếng Việt; “Hội đồng” làm rõ tính chất của A-rê-ô-pa-gút trong ngữ cảnh.
