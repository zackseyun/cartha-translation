source:
  edition: SBLGNT
  text: διερχόμενος γὰρ καὶ ἀναθεωρῶν τὰ σεβάσματα ὑμῶν εὗρον καὶ βωμὸν ἐν ᾧ ἐπεγέγραπτο· Ἀγνώστῳ θεῷ. ⸀ὃ οὖν ἀγνοοῦντες εὐσεβεῖτε, ⸀τοῦτο ἐγὼ καταγγέλλω ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/023.yaml
  text: For as I was passing through and observing your objects of worship[a], I even found an altar on which had been inscribed, ‘To an unknown god.’ Therefore[b], what you worship in ignorance—this I proclaim to you.
translation:
  language: vi
  text: 'Vì khi đi qua và quan sát kỹ những vật thờ cúng của quý vị, tôi cũng thấy một bàn thờ, trên đó có khắc: “Kính tặng một vị thần không được biết đến.”[a] Vậy, điều quý vị thờ kính mà không biết, chính điều ấy tôi loan báo cho quý vị.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Kính tặng vị thần không được biết đến.” Tiếng Hy Lạp không có mạo từ ở đây, nên có thể hiểu theo nghĩa bất định; trong một lời đề tặng, cách dịch xác định cũng có thể dùng được.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “Đấng quý vị thờ mà không biết.” Tuy nhiên, tiếng Hy Lạp dùng đại từ quan hệ giống trung; bản dịch chính giữ cách nói “điều” thay vì đổi thành từ chỉ ngôi vị như “Đấng” hay “người”.'
    reason: alternative_reading
lexical_decisions:
- source_word: διερχόμενος
  choice: khi đi qua
  rationale: Chuyển phân từ hiện tại thành mệnh đề thời gian tự nhiên trong tiếng Việt, đồng thời giữ bối cảnh Phao-lô đang đi qua thành phố.
- source_word: ἀναθεωρῶν
  choice: quan sát kỹ
  rationale: Diễn đạt sự xem xét chăm chú, mạnh hơn một cái nhìn thoáng qua.
- source_word: σεβάσματα
  choice: những vật quý vị thờ kính
  rationale: Giữ phạm vi rộng của từ Hy Lạp, chỉ các vật hay đối tượng tôn giáo được sùng kính, mà không thu hẹp thành đền miếu hoặc tượng thần.
- source_word: βωμὸν
  choice: bàn thờ
  rationale: Tương đương thông dụng và chính xác cho một bàn thờ dùng trong nghi lễ.
- source_word: ἐπεγέγραπτο
  choice: có khắc
  rationale: Cách nói tự nhiên trong tiếng Việt về dòng chữ đã được khắc trên bàn thờ; vẫn phản ánh ý bị động và hành động có trước.
- source_word: Ἀγνώστῳ θεῷ
  choice: Kính một vị thần chưa được biết đến
  rationale: Dùng lối diễn đạt thích hợp với lời đề tặng trên bia hay bàn thờ; “một” phản ánh khả năng bất định của danh từ Hy Lạp không có mạo từ.
- source_word: ὃ οὖν
  choice: Vậy, điều … chính điều ấy
  rationale: Giữ liên từ suy luận οὖν và đại từ quan hệ giống trung ὃ, đồng thời tái hiện cấu trúc nhấn mạnh của câu Hy Lạp.
- source_word: ἀγνοοῦντες
  choice: mà không biết
  rationale: Diễn đạt tự nhiên cách thức họ thờ kính và duy trì sự liên hệ tu từ với “chưa được biết đến” trong dòng chữ.
- source_word: εὐσεβεῖτε
  choice: quý vị thờ kính
  rationale: Thể hiện lòng sùng kính mang tính tôn giáo; “thờ kính” vừa rõ nghĩa vừa ít nặng hơn “thờ phượng” trong ngữ cảnh này.
- source_word: καταγγέλλω
  choice: tôi loan báo
  rationale: Diễn đạt hành động công bố công khai và có thẩm quyền trong bài diễn thuyết của Phao-lô.
theological_decisions:
- issue: Sở chỉ của đại từ quan hệ giống trung ὃ
  choice: “điều quý vị thờ kính mà không biết”
  alternative: “Đấng quý vị thờ mà không biết”
  rationale: Bản dịch chính giữ dạng phi nhân xưng của đại từ giống trung trong tiếng Hy Lạp, tránh tự ý đổi thành một từ chỉ ngôi vị và nhờ đó bảo toàn sự căng thẳng trong lập luận của Phao-lô.
- issue: Tính xác định của θεῷ trong dòng chữ
  choice: “một vị thần chưa được biết đến”
  alternative: “vị thần chưa được biết đến”
  rationale: Nguyên văn không có mạo từ, nên cách hiểu bất định là thích hợp; tuy nhiên, cấu trúc Hy Lạp và cách ghi lời đề tặng cũng cho phép cách dịch xác định hoặc ít nhấn mạnh tính bất định.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Quý vị” phù hợp với lời diễn thuyết công khai; “quan sát kỹ,” “có khắc” và “loan báo” tạo sắc thái rõ ràng, trang nghiêm mà không cổ hóa. Các dấu chú thích [a], [b] đều xuất hiện đúng trong bản văn.
