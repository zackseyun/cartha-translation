id: ACT.17.20
reference: Acts 17:20
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ξενίζοντα γάρ τινα εἰσφέρεις εἰς τὰς ἀκοὰς ἡμῶν· βουλόμεθα οὖν γνῶναι ⸂τίνα θέλει⸃ ταῦτα εἶναι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/020.yaml
  text: For you are bringing some strange things to our ears[b][a]. Therefore we want to know what these things mean.
translation:
  language: vi
  text: Vì ông đang đem đến tai chúng tôi một số điều lạ lẫm[a]. Vậy, chúng tôi muốn biết những điều ấy có nghĩa gì[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “những điều xa lạ” hoặc “những điều không quen thuộc.” Từ Hy Lạp có thể chỉ điều bị xem là lạ vì mới mẻ hoặc có nguồn gốc bên ngoài đối với người nghe.
    reason: lexical_alternative
  - marker: b
    text: 'Sát nghĩa: “những điều ấy muốn là gì”; đây là một lối nói có nghĩa “những điều ấy có nghĩa gì” hoặc “chúng có ý nghĩa ra sao.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ξενίζοντα τινα
  choice: một số điều lạ lẫm
  rationale: Cụm này chỉ những điều không quen thuộc, có vẻ mới hoặc xa lạ đối với người nghe. “Một số điều lạ lẫm” giữ được tính bất định của τινα mà không cường điệu thành “đáng kinh ngạc”.
- source_word: εἰσφέρεις εἰς τὰς ἀκοὰς ἡμῶν
  choice: ông đang đem đến tai chúng tôi
  rationale: Cách dịch này giữ hình ảnh cụ thể của động từ “đem vào” và danh từ “tai/sự nghe”, đồng thời vẫn tự nhiên trong tiếng Việt.
- source_word: βουλόμεθα οὖν γνῶναι
  choice: Vậy, chúng tôi muốn biết
  rationale: “Muốn biết” diễn đạt trực tiếp ý chí tìm hiểu; “vậy” thể hiện suy luận do οὖν đánh dấu.
- source_word: τίνα θέλει ταῦτα εἶναι
  choice: những điều ấy có nghĩa gì
  rationale: Đây là một lối nói hỏi về ý nghĩa hoặc tầm quan trọng của những điều đang được trình bày, chứ không chỉ hỏi chúng là vật gì.
- source_word: γάρ
  choice: Vì
  rationale: Từ nối nêu lý do cho lời yêu cầu ở câu trước và được giữ rõ trong bản dịch.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng đại từ “ông” phù hợp với lời người A-thên nói trực tiếp với Phao-lô. Giữ hình ảnh “đem đến tai” của nguyên văn, đồng thời đặt chú thích cho sắc thái của ξενίζω và thành ngữ τίνα θέλει ταῦτα εἶναι.
