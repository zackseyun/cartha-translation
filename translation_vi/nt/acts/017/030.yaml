revisions:
- from: Vậy, sau khi bỏ qua những thời kỳ người ta không biết, giờ đây Đức Chúa Trời truyền cho mọi người ở khắp mọi nơi phải ăn năn[a],
  to: Vậy, sau khi đã bỏ qua những thời kỳ thiếu hiểu biết[a], giờ đây Đức Chúa Trời truyền cho mọi người ở khắp mọi nơi phải ăn năn,
  rationale: Sửa “người ta không biết” thành “thiếu hiểu biết” để phản ánh sát hơn τῆς ἀγνοίας và dùng tiếng Việt tự nhiên hơn. Dời chú thích sang “bỏ qua” để nêu các khả năng từ vựng của ὑπεριδών và làm rõ rằng từ này không hàm ý sự chấp thuận. Giữ “phải ăn năn” vì diễn đạt tự nhiên bổ ngữ nguyên mẫu của mệnh lệnh và giữ nguyên tính phổ quát của câu.
