  text: τοὺς μὲν οὖν χρόνους τῆς ἀγνοίας ὑπεριδὼν ὁ θεὸς τὰ νῦν ⸀παραγγέλλει τοῖς ἀνθρώποις ⸀πάντας πανταχοῦ μετανοεῖν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/030.yaml
  text: Therefore[a], having overlooked the times of ignorance, God now commands all people everywhere to repent[b],
translation:
  language: vi
  text: Vậy, sau khi đã bỏ qua những thời kỳ thiếu hiểu biết[a], giờ đây Đức Chúa Trời truyền cho mọi người ở khắp mọi nơi phải ăn năn,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hoặc “đã làm ngơ” hoặc “đã không xét đến.” Ý ở đây là Đức Chúa Trời đã nhẫn nhịn trong những thời kỳ ấy, không phải Ngài tán thành chúng.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοὺς μὲν οὖν χρόνους τῆς ἀγνοίας
  choice: Vậy, ... những thời kỳ người ta không biết
  rationale: “Vậy” chuyển tiếp lập luận; cách diễn đạt “người ta không biết” tự nhiên hơn “của sự thiếu hiểu biết” trong tiếng Việt mà không thêm rõ đối tượng họ không biết.
- source_word: ὑπεριδὼν
  choice: sau khi bỏ qua
  rationale: Diễn đạt phân từ quá khứ và ý Đức Chúa Trời đã nhẫn nhịn, không thi hành phán xét ngay; không hàm ý Ngài tán thành.
- source_word: τὰ νῦν παραγγέλλει
  choice: giờ đây ... truyền
  rationale: Giữ sự tương phản về thời gian giữa những thời kỳ trước kia và hiện tại, đồng thời bảo toàn sức mạnh mệnh lệnh của παραγγέλλει.
- source_word: τοῖς ἀνθρώποις πάντας πανταχοῦ
  choice: mọi người ở khắp mọi nơi
  rationale: ἄνθρωποι chỉ con người nói chung; πάντας và πανταχοῦ nhấn mạnh phạm vi phổ quát.
- source_word: μετανοεῖν
  choice: phải ăn năn
  rationale: “Ăn năn” là cách dịch Kinh Thánh quen thuộc, bao hàm sự thay đổi tâm trí và quay khỏi đường lối sai; “phải” diễn đạt tự nhiên nội dung của mệnh lệnh gián tiếp.
theological_decisions:
- issue: Ý nghĩa việc Đức Chúa Trời bỏ qua các thời kỳ không biết
  choice: “bỏ qua” theo nghĩa nhẫn nhịn, chưa phán xét ngay
  alternative: coi như không có tội hoặc chấp thuận sự thờ thần tượng
  rationale: Mệnh lệnh ăn năn ở hiện tại cho thấy hành động trước kia không phải là sự tán thành hay miễn trừ trách nhiệm.
- issue: Phạm vi của mệnh lệnh ăn năn
  choice: mọi người ở khắp mọi nơi
  alternative: chỉ nam giới hoặc chỉ các dân ngoại
  rationale: Cấu trúc τοῖς ἀνθρώποις πάντας πανταχοῦ có phạm vi phổ quát và dùng ἄνθρωποι theo nghĩa chung về loài người.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Giữ câu văn cô đọng, sự đối lập giữa quá khứ và hiện tại, cùng sức mạnh của mệnh lệnh thần thượng.
