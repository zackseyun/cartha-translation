id: ACT.17.29
reference: Acts 17:29
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: γένος οὖν ὑπάρχοντες τοῦ θεοῦ οὐκ ὀφείλομεν νομίζειν χρυσῷ ἢ ἀργύρῳ ἢ λίθῳ, χαράγματι τέχνης καὶ ἐνθυμήσεως ἀνθρώπου, τὸ θεῖον εἶναι ὅμοιον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/029.yaml
  text: Therefore[a], since we are God’s offspring, we ought not to think that the Divine Being is like gold or silver or stone[b], an image formed by human skill and imagination.
translation:
  language: vi
  text: Vậy, vì chúng ta là dòng dõi của Đức Chúa Trời, chúng ta không nên cho rằng Đấng Thiêng Liêng[a] giống như vàng, bạc hay đá—một vật chạm khắc[b] do tài nghệ và ý tưởng của con người tạo nên.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “thần tính,” “điều thần linh” hoặc “thần linh.” Từ Hy Lạp τὸ θεῖον có phạm vi nghĩa rộng, chỉ điều thuộc về thần linh; trong lập luận này, nó quy chiếu đến Đức Chúa Trời thật.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “một hình chạm khắc” hoặc “một vật được khắc.”
    reason: lexical_alternative
lexical_decisions:
- source_word: γένος
  choice: dòng dõi
  rationale: Diễn đạt quan hệ nguồn gốc và họ hàng trong ngữ cảnh trích dẫn ở câu trước, không giới hạn vào sắc tộc hay một gia đình cụ thể.
- source_word: οὖν
  choice: Vậy
  rationale: Nêu kết luận suy ra từ lập luận trước đó một cách tự nhiên trong tiếng Việt.
- source_word: ὑπάρχοντες
  choice: vì chúng ta là
  rationale: Phân từ mang ý nghĩa nguyên nhân trong ngữ cảnh; cách dịch này làm rõ cơ sở của kết luận.
- source_word: οὐκ ὀφείλομεν νομίζειν
  choice: chúng ta không nên cho rằng
  rationale: Giữ sắc thái bổn phận và điều không thích đáng, đồng thời dùng lối diễn đạt hiện đại, tự nhiên.
- source_word: χρυσῷ ἢ ἀργύρῳ ἢ λίθῳ
  choice: vàng, bạc hay đá
  rationale: Giữ nguyên ba chất liệu được nêu trong bản Hy Lạp.
- source_word: χαράγματι
  choice: một hình tượng ... tạo nên
  rationale: Chỉ vật được chạm, khắc hoặc chế tác; “hình tượng” phù hợp với ngữ cảnh tượng thần nhưng không buộc vào một kỹ thuật duy nhất.
- source_word: τέχνης
  choice: tài nghệ
  rationale: Bao hàm nghệ thuật, kỹ năng và kỹ thuật chế tác của con người.
- source_word: ἐνθυμήσεως
  choice: óc tưởng tượng
  rationale: Truyền đạt hoạt động suy tưởng, quan niệm hay thiết kế trong tâm trí đứng sau việc tạo hình tượng.
- source_word: ἀνθρώπου
  choice: của con người
  rationale: Giữ nghĩa khái quát về loài người, không khiến người đọc hiểu là riêng một người nam.
- source_word: τὸ θεῖον
  choice: Đấng Thần Linh
  rationale: Giữ sắc thái triết luận rộng của danh từ hóa chỉ điều/đấng thuộc thần linh, nhưng trong lập luận của Phao-lô vẫn quy chiếu đến Đức Chúa Trời thật.
theological_decisions:
- issue: Cách dịch τὸ θεῖον trong một bài giảng độc thần dùng ngôn ngữ triết luận
  choice: Đấng Thần Linh
  alternative: thần tính; bản thể thần linh; Thần Thượng
  rationale: “Đấng Thần Linh” dễ hiểu, có sắc thái hữu thể phù hợp với đối tượng mà Phao-lô đang nói đến, nhưng chú thích vẫn bảo tồn phạm vi nghĩa rộng và phần nào trừu tượng của từ Hy Lạp, tránh áp đặt thuật ngữ tín lý hậu kỳ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Dòng dõi” nối tự nhiên với câu trước; dấu gạch ngang cho thấy cụm “một hình tượng...” giải thích vàng, bạc hay đá khi chúng được con người chế tác thành tượng. Tất cả dấu chú thích đều xuất hiện trong chính văn.
