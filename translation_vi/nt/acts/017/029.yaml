revisions:
- from: Vậy, vì chúng ta là dòng dõi của Đức Chúa Trời, chúng ta không nên cho rằng Đấng Thần Linh[a] giống như vàng, bạc hay đá—một hình tượng do tài nghệ và óc tưởng tượng của con người tạo nên.[b]
  to: Vậy, vì chúng ta là dòng dõi của Đức Chúa Trời, chúng ta không nên cho rằng Đấng Thiêng Liêng[a] giống như vàng, bạc hay đá—một vật chạm khắc[b] do tài nghệ và ý tưởng của con người tạo nên.
  rationale: Sửa cách dịch τὸ θεῖον thành “Đấng Thiêng Liêng” để giữ quy chiếu đến Đức Chúa Trời trong lời lập luận của Phao-lô mà không tạo liên tưởng sai đến danh xưng riêng của Chúa Thánh Linh. Sửa chú thích để nêu các khả năng từ vựng tự nhiên, không áp đặt thuật ngữ tín lý hay triết học hậu kỳ. Làm rõ χαράγματι bằng “một vật chạm khắc” và neo chú thích ngay tại đó.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T09:20:00Z'
