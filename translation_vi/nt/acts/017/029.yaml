  source_fidelity: Bản dịch giữ đúng suy luận của οὖν, quan hệ nguyên nhân của phân từ ὑπάρχοντες, và sắc thái quy phạm của οὐκ ὀφείλομεν. Tuy nhiên, “Đấng Thần Linh” dễ bị hiểu là danh xưng của Chúa Thánh Linh trong tiếng Việt và không phản ánh tự nhiên sắc thái triết luận rộng của τὸ θεῖον. Cụm “một hình tượng ... tạo nên” cũng nên được gắn trực tiếp với χαράγματι, tức một vật/hình được chạm khắc.
  naturalness: “Đấng Thiêng Liêng” tự nhiên và dễ hiểu hơn trong văn phong trang trọng hiện đại, đồng thời tránh liên tưởng không chủ ý đến Chúa Thánh Linh. “Một vật chạm khắc” diễn đạt trực tiếp χαράγματι và vẫn bao quát việc làm tượng từ vàng, bạc hoặc đá.
