  to: Những người mà Gia-sôn đã tiếp đón[a] đều hành động trái với các sắc lệnh[b] của Sê-sa, nói rằng có một vua khác[c], là Giê-su.
  rationale: Sửa cấu trúc mở đầu cho tự nhiên hơn trong tiếng Việt hiện đại và, quan trọng nhất, bỏ tước hiệu “Đức Chúa” vì tước hiệu ấy không xuất hiện trong nguyên văn Hy Lạp của câu này. Các lựa chọn “sắc lệnh,” “Sê-sa,” và “một vua khác” được giữ lại vì phản ánh chính xác sắc thái pháp lý và chính trị của lời cáo buộc.
