  source_fidelity: 'Bản dịch truyền đạt đúng cấu trúc của lời buộc tội: Gia-sôn đã tiếp đón nhóm người này; họ bị tố là hành động trái các sắc lệnh của Sê-sa và nói rằng có một vua khác là Giê-su. Tuy nhiên, bản văn Hy Lạp chỉ có tên Ἰησοῦν (“Giê-su”), không có tước hiệu κύριος (“Chúa”). Vì vậy, “Đức Chúa Jêsus” thêm một tước hiệu không hiện diện trong câu này.'
