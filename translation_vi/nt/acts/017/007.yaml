  terminology: “Sê-sa,” “sắc lệnh,” và “một vua khác” phù hợp với ngữ cảnh La Mã và với các từ Καίσαρος, δογμάτων, βασιλέα ἕτερον. Cần tránh thêm “Đức Chúa” vào tên Giê-su, dù tước hiệu này đúng trong nhiều ngữ cảnh khác, vì nó không có trong nguyên văn câu này. Dùng “Giê-su” là cách viết hiện đại, phổ biến và trung tính về truyền thống.
