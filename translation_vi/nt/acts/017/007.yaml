  text: οὓς ὑποδέδεκται Ἰάσων· καὶ οὗτοι πάντες ἀπέναντι τῶν δογμάτων Καίσαρος πράσσουσι, βασιλέα ⸂ἕτερον λέγοντες⸃ εἶναι Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/007.yaml
  text: These men[a], whom Jason has welcomed, are all acting against Caesar’s decrees[c][b], saying that there is another king—Jesus.
translation:
  language: vi
  text: Những người mà Gia-sôn đã tiếp đón[a] đều hành động trái với các sắc lệnh[b] của Sê-sa, nói rằng có một vua khác[c], là Giê-su.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “đã tiếp nhận” hoặc “đã cho ở nhờ”. Động từ Hy Lạp có thể chỉ việc tiếp nhận khách hoặc cho họ hưởng sự tiếp đãi.
    reason: lexical_alternative
  - marker: b
    text: Hay “các chiếu chỉ” hoặc “các quy định”. Từ Hy Lạp nói đến những quyết định hay mệnh lệnh chính thức.
    reason: lexical_alternative
  - marker: c
    text: Nguyên văn là “một vua khác”, trình bày lời cáo buộc rằng Giê-su là một đối thủ đối với quyền cai trị của Sê-sa.
    reason: alternative_reading
lexical_decisions:
- source_word: ὑποδέδεκται
  choice: đã tiếp đón
  rationale: Động từ ở thì hoàn thành diễn tả việc Gia-sôn đã tiếp nhận họ làm khách, và sự tiếp đãi ấy vẫn là căn cứ của lời cáo buộc. “Đã tiếp đón” tự nhiên, rõ nghĩa và giữ được sắc thái hiếu khách.
- source_word: ἀπέναντι
  choice: trái với
  rationale: Khi đi với sở hữu cách, từ này chỉ sự đối nghịch hoặc trái ngược. “Trái với” phù hợp với ngữ cảnh cáo buộc vi phạm các quy định chính thức.
- source_word: δογμάτων
  choice: các sắc lệnh
  rationale: Trong bối cảnh chính quyền La Mã, từ này nói đến những quyết định hay quy định chính thức. “Sắc lệnh” vừa dễ hiểu vừa giữ sắc thái pháp lý.
- source_word: πράσσουσι
  choice: đều hành động
  rationale: Thì hiện tại mô tả cách hành xử đang tiếp diễn. “Đều hành động” giữ được lực của động từ và kết hợp tự nhiên với πάντες.
- source_word: βασιλέα ἕτερον
  choice: một vua khác
  rationale: βασιλεύς có nghĩa cụ thể là “vua”, còn ἕτερον chỉ một người khác biệt hay một đối thủ khác. Cách dịch này giữ nguyên sức nặng chính trị của lời cáo buộc.
- source_word: λέγοντες
  choice: nói rằng
  rationale: Phân từ này giải thích nội dung hay phương cách họ bị cho là chống lại sắc lệnh. “Nói rằng” trung tính và không thêm thái độ hoài nghi vào bản dịch.
- source_word: εἶναι Ἰησοῦν
  choice: có ... là Đức Chúa Jêsus
  rationale: Cấu trúc nguyên mẫu Hy Lạp được chuyển thành mệnh đề tự nhiên trong tiếng Việt, đồng thời giữ tên Jêsus ở vị trí xác định đầy nhấn mạnh.
- source_word: οὗτοι πάντες
  choice: Những người ấy ... tất cả họ đều
  rationale: Cách diễn đạt này bảo toàn cả tính chỉ định lẫn sự quy kết cho toàn bộ nhóm, dù có phần lặp chủ ý để phản ánh sức nhấn của nguyên văn.
theological_decisions:
- issue: Sức nặng chính trị của lời cáo buộc về Đức Chúa Jêsus là vua
  choice: Dịch thẳng là họ nói có “một vua khác”, tức Đức Chúa Jêsus.
  alternative: Dịch “vua” lỏng hơn thành “người cai trị” hoặc “lãnh tụ” để giảm sắc thái chính trị.
  rationale: Bản văn gắn lời cáo buộc trực tiếp với các sắc lệnh của Sê-sa và dùng từ cụ thể “vua”. Giữ cách nói này bảo toàn sự căng thẳng lịch sử và thần học mà không thu hẹp vương quyền của Đức Chúa Jêsus thành một ý nghĩa chỉ thuộc linh.
translation_notes:
  register: 'Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Giữ cấu trúc cáo buộc công khai và sức nặng chính trị của “vua khác”. Dùng cách viết tên quen thuộc trong văn phong Kinh Thánh Việt ngữ: Gia-sôn, Sê-sa, Đức Chúa Jêsus.'
