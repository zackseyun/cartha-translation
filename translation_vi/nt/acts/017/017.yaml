id: ACT.17.17
reference: Acts 17:17
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: διελέγετο μὲν οὖν ἐν τῇ συναγωγῇ τοῖς Ἰουδαίοις καὶ τοῖς σεβομένοις καὶ ἐν τῇ ἀγορᾷ κατὰ πᾶσαν ἡμέραν πρὸς τοὺς παρατυγχάνοντας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/017.yaml
  text: So he was reasoning in the synagogue with the Jews and those who worshiped God[b][a], and in the marketplace every day with those who happened to be there.
translation:
  language: vi
  text: Vì vậy, ông biện luận trong hội đường với người Do Thái và những người thờ phượng Đức Chúa Trời[a], và ngày nào ông cũng biện luận tại khu chợ[b] với những người tình cờ có mặt ở đó.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “những người kính sợ Đức Chúa Trời”, tức những người ngoài Do Thái có liên hệ với việc thờ phượng của người Do Thái.
    reason: lexical_alternative
  - marker: b
    text: “Khu chợ” thời ấy cũng là quảng trường công cộng, nơi người dân tụ họp và tham gia sinh hoạt xã hội, chứ không chỉ là nơi mua bán.
    reason: cultural_note
lexical_decisions:
- source_word: διελέγετο
  choice: biện luận
  rationale: Thể chưa hoàn thành diễn tả hoạt động diễn ra lặp đi lặp lại; “biện luận” thể hiện cả sự trao đổi đối thoại lẫn việc trình bày lý lẽ, phù hợp với ngữ cảnh Phao-lô ở A-thên.
- source_word: μὲν οὖν
  choice: Vì vậy
  rationale: Cụm tiểu từ nối câu này với diễn biến trước và mang sắc thái tiếp nối hoặc suy ra; “Vì vậy” tự nhiên trong tiếng Việt và giữ được mạch lập luận.
- source_word: συναγωγῇ
  choice: hội đường
  rationale: Trong ngữ cảnh Công Vụ, từ này chỉ cơ sở hội họp và thờ phượng của cộng đồng Do Thái; “hội đường” là cách gọi quen thuộc, rõ nghĩa.
- source_word: τοῖς Ἰουδαίοις
  choice: người Do Thái
  rationale: Ở đây chỉ những người thuộc cộng đồng Do Thái có mặt trong hội đường, không chỉ riêng người đến từ miền Giu-đê.
- source_word: τοῖς σεβομένοις
  choice: những người thờ phượng Đức Chúa Trời
  rationale: Phân từ dùng như danh từ chỉ những người ngoài Do Thái gắn bó với việc thờ phượng của người Do Thái. Bổ sung đối tượng “Đức Chúa Trời” theo cách dùng theo ngữ cảnh trong Công Vụ giúp câu tiếng Việt rõ ràng mà không biến cách gọi này thành một thuật ngữ khó hiểu.
- source_word: ἀγορᾷ
  choice: khu chợ
  rationale: Từ này chỉ không gian công cộng vừa có chức năng buôn bán vừa là nơi sinh hoạt xã hội. “Khu chợ” dễ hiểu trong câu chính, còn chú thích làm rõ chức năng công cộng rộng hơn.
- source_word: κατὰ πᾶσαν ἡμέραν
  choice: ngày nào cũng
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt, nhấn mạnh hoạt động được lặp lại hằng ngày.
- source_word: πρὸς τοὺς παρατυγχάνοντας
  choice: với những người tình cờ có mặt ở đó
  rationale: Cách dịch này giữ nghĩa những người Phao-lô gặp do họ tình cờ hiện diện tại nơi ấy, không thu hẹp thành chỉ những người đi ngang qua.
theological_decisions:
- issue: Đối tượng được hàm ý trong τοῖς σεβομένοις
  choice: những người thờ phượng Đức Chúa Trời
  alternative: những người kính sợ Đức Chúa Trời
  rationale: Nguyên văn chỉ có phân từ “những người thờ phượng/kính sợ” mà không nêu tân ngữ, nhưng ngữ cảnh hội đường và cách dùng trong Công Vụ cho thấy đây là những người ngoài Do Thái hướng về Đức Chúa Trời của Israel. Bản chính diễn đạt rõ nghĩa thông dụng, còn chú thích bảo lưu cách gọi gần với thuật ngữ lịch sử.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. Câu giữ nhịp lặp của thể chưa hoàn thành bằng “ngày nào cũng” và lặp lại “biện luận” để tránh mơ hồ về hoạt động diễn ra ở cả hội đường lẫn khu chợ. Dùng “ông” vì chủ thể Phao-lô đã rõ từ văn cảnh liền trước.
