  text: And after taking security from Jason and the others[a], they released them.
translation:
  language: vi
  text: Sau khi nhận khoản bảo đảm từ Gia-sôn và những người khác[a], họ thả những người ấy ra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “một khoản đủ”. Có lẽ đây là một sự bảo chứng hoặc cam kết pháp lý nhằm bảo đảm họ sẽ không gây rối.
    reason: lexical_alternative
lexical_decisions:
- source_word: λαβόντες
  choice: Sau khi nhận
  rationale: Phân từ bất định quá khứ diễn tả hành động xảy ra trước động từ chính; cách dịch này tự nhiên và giữ đúng trình tự.
- source_word: τὸ ἱκανὸν
  choice: tiền bảo đảm
  rationale: Trong bối cảnh pháp lý, cụm này chỉ một khoản hoặc vật bảo chứng đủ để bảo đảm việc tuân thủ; “tiền bảo đảm” rõ nghĩa trong tiếng Việt mà không đặc định thành chế định pháp lý hiện đại như “tiền tại ngoại”.
- source_word: παρὰ τοῦ Ἰάσονος καὶ τῶν λοιπῶν
  choice: từ Gia-sôn và những người khác
  rationale: παρά với sở hữu cách chỉ nguồn nhận; οἱ λοιποί là những người còn lại trong nhóm có liên quan.
- source_word: ἀπέλυσαν
  choice: họ thả ... ra
  rationale: Động từ mang nghĩa phóng thích trong bối cảnh nhà chức trách đang giữ người; “thả ra” là tự nhiên và rõ ràng.
- source_word: αὐτούς
  choice: các ông
  rationale: Đại từ số nhiều chỉ Gia-sôn cùng những người bị giữ; “các ông” giúp xác định rõ đối tượng và phù hợp ngữ cảnh.
