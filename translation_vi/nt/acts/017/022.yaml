source:
  edition: SBLGNT
  text: Σταθεὶς ⸀δὲ Παῦλος ἐν μέσῳ τοῦ Ἀρείου Πάγου ἔφη· Ἄνδρες Ἀθηναῖοι, κατὰ πάντα ὡς δεισιδαιμονεστέρους ὑμᾶς θεωρῶ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/022.yaml
  text: So Paul[a], standing in the midst of the Areopagus, said, “Men of Athens, I see that in every way you are very religious.”
translation:
  language: vi
  text: 'Bấy giờ, Phao-lô đứng giữa A-rê-ô-pa và nói: “Thưa các ông A-thên, tôi nhận thấy rằng về mọi phương diện, các ông rất sùng đạo.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “quá mê tín” hoặc “sùng đạo hơn.” Từ Hy Lạp có thể được hiểu theo sắc thái tiêu cực hoặc tích cực.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Σταθεὶς
  choice: đứng
  rationale: Phân từ bất định quá khứ dùng để dựng bối cảnh; “đứng” tự nhiên trong tiếng Việt và giữ nguyên tư thế của Phao-lô.
- source_word: δὲ
  choice: Bấy giờ
  rationale: Ở đây δέ đánh dấu một bước chuyển nhẹ trong mạch kể; “Bấy giờ” tự nhiên hơn cách dịch máy móc là “nhưng”.
- source_word: ἐν μέσῳ τοῦ Ἀρείου Πάγου
  choice: giữa A-rê-ô-pa
  rationale: Giữ nghĩa chỉ vị trí “ở giữa” và phiên âm tên riêng, không diễn giải dứt khoát thành “trước hội đồng,” vì cụm từ có thể gợi đến địa điểm hoặc thiết chế mang tên ấy.
- source_word: ἔφη
  choice: nói
  rationale: Động từ giới thiệu lời nói được chuyển sang cách diễn đạt kể chuyện tự nhiên trong tiếng Việt.
- source_word: Ἄνδρες Ἀθηναῖοι
  choice: Thưa các ông A-thên
  rationale: Giữ sắc thái xưng hô trang trọng và yếu tố nam giới của ἄνδρες, đồng thời dùng cách gọi ngắn gọn, dễ hiểu.
- source_word: κατὰ πάντα
  choice: về mọi phương diện
  rationale: Diễn đạt tự nhiên phạm vi bao quát của cụm từ Hy Lạp.
- source_word: θεωρῶ
  choice: tôi nhận thấy
  rationale: Thể hiện ý quan sát rồi nhận định, phù hợp với ngữ cảnh Phao-lô đã xem xét các vật thờ phượng trong thành.
- source_word: δεισιδαιμονεστέρους
  choice: rất sùng đạo
  rationale: Từ Hy Lạp có thể mang sắc thái tích cực, trung tính hoặc tiêu cực, và dạng so sánh ở đây có thể được dùng theo nghĩa tăng cường. “Rất sùng đạo” giữ giọng mở đầu nhã nhặn mà không loại bỏ nghĩa tiêu cực, vốn được nêu trong chú thích.
theological_decisions:
- issue: Sắc thái trong lời Phao-lô mô tả đời sống tôn giáo của người A-thên
  choice: Dùng “rất sùng đạo” trong chính văn
  alternative: “quá mê tín” hoặc “sùng đạo hơn”
  rationale: δεισιδαιμονεστέρους có phạm vi nghĩa linh hoạt. Dịch thẳng thành “mê tín” sẽ quyết định quá sớm rằng lời nói hoàn toàn chê trách, còn “sùng đạo hơn” đòi hỏi một đối tượng so sánh không được nêu rõ. Chính văn giữ giọng ngoại giao có chủ ý, còn chú thích bảo lưu các cách hiểu khác.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Tên riêng được phiên âm theo tiếng Việt. Cách xưng hô “Thưa các ông A-thên” giữ hình thức giống đực của nguyên văn mà vẫn phù hợp với một bài diễn thuyết công khai.
