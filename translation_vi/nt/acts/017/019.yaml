id: ACT.17.19
reference: Acts 17:19
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐπιλαβόμενοί ⸀τε αὐτοῦ ἐπὶ τὸν Ἄρειον Πάγον ἤγαγον, λέγοντες· Δυνάμεθα γνῶναι τίς ἡ καινὴ αὕτη ἡ ὑπὸ σοῦ λαλουμένη διδαχή;
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/019.yaml
  text: So they took hold of him and brought him to the Areopagus, saying, “May we know what this new teaching is that is being spoken by you?”
translation:
  language: vi
  text: 'Vậy, họ nắm lấy ông và đưa ông đến A-rê-ô-pa-gút[a], rồi nói: “Chúng tôi có thể biết giáo huấn mới này mà ông đang trình bày là gì không?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “A-rê-ô-pa-gút” có thể chỉ chính ngọn đồi hoặc hội đồng gắn với nơi ấy; tên gọi truyền thống trong tiếng Anh là “Mars Hill” (Đồi A-rê).
    reason: cultural_note
lexical_decisions:
- source_word: ἐπιλαβόμενοί
  choice: nắm lấy
  rationale: Giữ sắc thái có tiếp xúc và chủ động đưa Phao-lô đi, nhưng không diễn giải quá mức thành bắt giữ chính thức.
- source_word: τε
  choice: Vậy
  rationale: Diễn đạt liên kết nhẹ và sự tiếp diễn của trình thuật một cách tự nhiên trong tiếng Việt.
- source_word: ἐπὶ τὸν Ἄρειον Πάγον
  choice: đến A-rê-ô-pa-gút
  rationale: Phiên âm tên riêng Hy Lạp và để ngỏ việc cụm từ chỉ ngọn đồi hay hội đồng gắn với nơi ấy.
- source_word: ἤγαγον
  choice: đưa đến
  rationale: Diễn đạt tự nhiên hành động dẫn hoặc đưa một người đến địa điểm được nêu.
- source_word: λέγοντες
  choice: rồi nói
  rationale: Chuyển phân từ đồng thời thành cách nối câu tự nhiên trong tiếng Việt mà vẫn giữ diễn tiến của hành động.
- source_word: Δυνάμεθα γνῶναι
  choice: Chúng tôi có thể biết ... không?
  rationale: Vừa phản ánh động từ chỉ khả năng vừa hoạt động tự nhiên như một lời thỉnh cầu lịch sự.
- source_word: καινὴ
  choice: mới
  rationale: Tương đương rộng và tự nhiên nhất, chỉ điều mới mẻ đối với người nghe.
- source_word: ὑπὸ σοῦ λαλουμένη
  choice: mà ông đang nói đến
  rationale: Chuyển cấu trúc bị động Hy Lạp sang tiếng Việt tự nhiên, vẫn xác định Phao-lô là người nói về giáo huấn ấy.
- source_word: διδαχή
  choice: giáo huấn
  rationale: Trang trọng vừa phải, dễ hiểu và ít mang sắc thái hệ phái hơn “giáo lý” hay sắc thái thuần hành động hơn “sự dạy dỗ”.
theological_decisions:
- issue: Sắc thái của việc Phao-lô bị đưa đến A-rê-ô-pa-gút
  choice: Một hành động nắm lấy và đưa đi khá dứt khoát, nhưng không nhất thiết mang tính thù địch
  alternative: Bắt giữ chính thức; hoặc chỉ lịch sự mời đi
  rationale: ἐπιλαμβάνομαι có thể mạnh hơn một lời mời, nhưng văn cảnh trực tiếp nhấn mạnh sự tò mò chứ chưa nói rõ một vụ bắt giữ.
- issue: Ý nghĩa của Ἄρειος Πάγος
  choice: Giữ tên riêng A-rê-ô-pa-gút mà không xác định đó chỉ là ngọn đồi hay hội đồng
  alternative: Đồi A-rê; hoặc Hội đồng A-rê-ô-pa-gút
  rationale: Danh xưng Hy Lạp có thể chỉ địa điểm hoặc hội đồng gắn với địa điểm; bản dịch chính không nên tự ý giải quyết sự nhập nhằng lịch sử này.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Đại từ “ông” phù hợp với lời đối thoại lịch sự. Cấu trúc câu hỏi được làm tự nhiên trong tiếng Việt, đồng thời duy trì tính chất thăm hỏi hơn là đối đầu.
