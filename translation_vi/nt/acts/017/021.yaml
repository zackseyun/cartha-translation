source:
  edition: SBLGNT
  text: Ἀθηναῖοι δὲ πάντες καὶ οἱ ἐπιδημοῦντες ξένοι εἰς οὐδὲν ἕτερον ηὐκαίρουν ἢ λέγειν τι ⸀ἢ ἀκούειν ⸀τι καινότερον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/021.yaml
  text: All the Athenians and the foreigners staying there would spend their time in nothing else than telling or hearing something newer[a].
translation:
  language: vi
  text: Tất cả người A-thên và những người ngoại quốc đang lưu trú tại đó chẳng dành thời giờ cho điều gì khác ngoài việc nói hoặc nghe điều gì mới hơn[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch tự nhiên hơn là “điều gì mới”. Tiếng Hy Lạp dùng dạng so sánh “mới hơn”, có lẽ diễn tả sự ham thích liên tục đối với điều mới lạ gần đây nhất.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀθηναῖοι δὲ πάντες
  choice: Tất cả người A-thên
  rationale: Diễn đạt tự nhiên trong tiếng Việt, giữ phạm vi phổ quát của πάντες; δὲ là liên từ chuyển ý nhẹ nên không cần dịch thành một từ riêng ở đầu câu.
- source_word: οἱ ἐπιδημοῦντες ξένοι
  choice: những người ngoại quốc đang lưu trú tại đó
  rationale: Giữ cả ý người ngoài xứ của ξένοι và sự hiện diện/lưu trú tại địa phương, có thể mang tính tạm thời, của ἐπιδημοῦντες.
- source_word: εἰς οὐδὲν ἕτερον ηὐκαίρουν
  choice: chẳng dành thời giờ làm gì khác
  rationale: Chuyển thành lối nói Việt tự nhiên, đồng thời giữ nghĩa hoạt động thường xuyên trong thì chưa hoàn thành của ηὐκαίρουν.
- source_word: ἢ λέγειν τι ἢ ἀκούειν
  choice: ngoài việc kể hoặc nghe điều gì
  rationale: Giữ cấu trúc song song của hai động từ nguyên mẫu; “kể” phù hợp với việc truyền đạt một tin hay điều mới.
- source_word: καινότερον
  choice: mới hơn
  rationale: Giữ nguyên hình thức so sánh của tiếng Hy Lạp, thay vì âm thầm làm phẳng thành “mới”.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “người A-thên” theo cách gọi địa danh quen thuộc trong văn liệu Kinh Thánh tiếng Việt; giữ nét so sánh hơi khác thường “mới hơn” và giải thích bằng chú thích.
