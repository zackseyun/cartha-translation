source:
  edition: SBLGNT
  text: Ἐν δὲ ταῖς Ἀθήναις ἐκδεχομένου αὐτοὺς τοῦ Παύλου, παρωξύνετο τὸ πνεῦμα αὐτοῦ ἐν αὐτῷ ⸀θεωροῦντος κατείδωλον οὖσαν τὴν πόλιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/016.yaml
  text: While Paul was waiting for them in Athens[b][a], his spirit was provoked within him as he saw that the city was full of idols.
translation:
  language: vi
  text: Trong khi Phao-lô đang chờ họ tại A-thên, lòng ông vô cùng bức xúc[a] khi thấy thành phố đầy tượng thần[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đau buồn” hoặc “xao động”; động từ Hy Lạp diễn tả một sự kích động nội tâm gay gắt.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “thành phố tràn ngập tượng thần.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκδεχομένου
  choice: đang chờ
  rationale: 'Phân từ sở hữu cách diễn tả hoàn cảnh đồng thời và kéo dài: Phao-lô đang chờ các bạn đồng hành của mình.'
- source_word: παρωξύνετο
  choice: bị kích động mạnh
  rationale: Thể chưa hoàn thành trung động/thụ động diễn tả phản ứng nội tâm đang tiếp diễn; cách dịch này giữ được sắc thái xao động gay gắt, không thu hẹp nghĩa thành chỉ đau buồn.
- source_word: τὸ πνεῦμα αὐτοῦ
  choice: tâm thần ông
  rationale: Cụm sở hữu chỉ tâm thần hay con người bên trong của chính Phao-lô; cách dịch trực tiếp này không đồng nhất với Đức Thánh Linh.
- source_word: ἐν αὐτῷ
  choice: trong lòng
  rationale: Diễn đạt tự nhiên trong tiếng Việt vị trí nội tại của sự kích động, đồng thời tránh lối dịch cứng là “trong ông”.
- source_word: θεωροῦντος
  choice: khi thấy
  rationale: Phân từ diễn tả sự quan sát đồng thời với phản ứng của Phao-lô; “khi thấy” ngắn gọn và tự nhiên.
- source_word: κατείδωλον
  choice: đầy những tượng thần
  rationale: Tính từ mô tả thành phố đầy hoặc tràn ngập các tượng được tôn thờ; cách dịch này rõ ràng và ít diễn giải hơn “phó mình cho việc thờ thần tượng”.
- source_word: πόλιν
  choice: thành phố
  rationale: Giữ danh từ của nguyên văn, quy chiếu về A-thên đã được nêu ngay trước đó.
- source_word: δὲ
  choice: không dịch thành một từ riêng
  rationale: Ở đây δέ chủ yếu đánh dấu bước chuyển trong mạch kể; cấu trúc mở đầu “Trong khi” chuyển ý tự nhiên mà không cần thêm “bấy giờ” hay tạo sắc thái tương phản không có trong ngữ cảnh.
theological_decisions:
- issue: Đối tượng quy chiếu của “tâm thần”
  choice: Tâm thần của chính Phao-lô
  alternative: Một sự nhắc ngầm đến tác động của Đức Thánh Linh
  rationale: Cấu trúc sở hữu “tâm thần ông” cùng cụm chỉ nội tại “trong lòng” hướng đến phản ứng bên trong của Phao-lô. Câu này không trực tiếp quy phản ứng ấy cho Đức Thánh Linh, nên bản dịch không thêm nhận định thần học đó.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “tượng thần” thay vì thuật ngữ trừu tượng hơn để phản ánh các vật tượng cụ thể trong thành phố; giữ “tâm thần” nhằm bảo toàn cách nói của nguyên văn nhưng đặt trong câu tiếng Việt tự nhiên.
