  text: οἱ δὲ ⸀καθιστάνοντες τὸν Παῦλον ⸀ἤγαγον ἕως Ἀθηνῶν, καὶ λαβόντες ἐντολὴν πρὸς τὸν Σιλᾶν καὶ ⸀τὸν Τιμόθεον ἵνα ὡς τάχιστα ἔλθωσιν πρὸς αὐτὸν ἐξῄεσαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/015.yaml
  text: Those who were escorting Paul brought him as far as Athens[a], and after receiving instructions for Silas and Timothy to come to him as quickly as possible[b], they departed.
translation:
  language: vi
  text: Những người hộ tống Phao-lô đưa ông đến tận A-thên[a]. Sau khi nhận chỉ thị dành cho Si-la và Ti-mô-thê rằng họ phải đến với ông càng sớm càng tốt[b], họ rời đi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đưa ông đến A-thên.” Cụm từ Hy Lạp có thể được diễn đạt đơn giản như vậy, nhưng “đến tận A-thên” giữ ý họ đi cùng Phao-lô cho tới điểm đích ấy.'
    reason: lexical_alternative
  - marker: b
    text: 'Hay: “nhận mệnh lệnh.” Danh từ Hy Lạp có thể mang nghĩa mạnh hơn là một mệnh lệnh có thẩm quyền, cũng như nghĩa “lời dặn” hoặc “chỉ thị.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθιστάνοντες
  choice: những người hộ tống
  rationale: Trong ngữ cảnh hành trình, phân từ chỉ những người đi cùng để đưa Phao-lô an toàn tới nơi; “hộ tống” diễn đạt tự nhiên cả sự đồng hành lẫn trách nhiệm đưa ông đến đích.
- source_word: ἤγαγον
  choice: đưa ông đến
  rationale: Động từ aorist diễn tả hành động đã hoàn tất là đưa Phao-lô tới A-thên; cách dịch này tự nhiên trong tiếng Việt và hợp với ngữ cảnh hộ tống.
- source_word: ἕως Ἀθηνῶν
  choice: đến tận A-thên
  rationale: ἕως nhấn mạnh giới hạn của hành trình tới điểm đích; “đến tận” giữ sắc thái ấy mà vẫn tự nhiên trong tiếng Việt.
- source_word: λαβόντες ἐντολήν
  choice: sau khi nhận lời dặn
  rationale: Phân từ được hiểu theo quan hệ thời gian. ἐντολή có thể là mệnh lệnh hoặc lời chỉ thị; “lời dặn” phù hợp với việc chuyển lời của Phao-lô mà không loại bỏ hoàn toàn sắc thái yêu cầu.
- source_word: πρὸς τὸν Σιλᾶν καὶ τὸν Τιμόθεον
  choice: dành cho Si-la và Ti-mô-thê
  rationale: πρός đánh dấu những người nhận lời dặn; “dành cho” rõ nghĩa và tự nhiên trong tiếng Việt.
- source_word: ἵνα ὡς τάχιστα ἔλθωσιν πρὸς αὐτόν
  choice: rằng họ phải đến với ông càng sớm càng tốt
  rationale: Mệnh đề ἵνα nêu nội dung lời dặn; “phải” giữ sức nặng chỉ thị, còn “càng sớm càng tốt” diễn đạt chính xác tính khẩn cấp của ὡς τάχιστα. Đại từ “ông” giữ αὐτόν thay vì lặp tên Phao-lô.
- source_word: ἐξῄεσαν
  choice: lên đường trở về
  rationale: Động từ imperfect chỉ việc họ rời đi sau khi nhận lời dặn. “Lên đường trở về” làm rõ hướng đi được ngữ cảnh hàm ý—họ quay lại nơi có Si-la và Ti-mô-thê—trong khi vẫn giữ nhịp kể tự nhiên.
