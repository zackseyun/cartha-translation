source:
  edition: SBLGNT
  text: μὴ εὑρόντες δὲ αὐτοὺς ⸀ἔσυρον Ἰάσονα καί τινας ἀδελφοὺς ἐπὶ τοὺς πολιτάρχας, βοῶντες ὅτι Οἱ τὴν οἰκουμένην ἀναστατώσαντες οὗτοι καὶ ἐνθάδε πάρεισιν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/006.yaml
  text: But when they did not find them[a], they dragged Jason and some brothers before the city authorities, shouting[c][b], “These men who have turned the world upside down have come here also,”
translation:
  language: vi
  text: 'Nhưng khi không tìm thấy họ, họ lôi Gia-sôn và một số anh em[a] đến trước các quan chức thành phố[b] và kêu lớn: “Những kẻ đã làm đảo lộn cả thế giới[c] cũng đã đến đây!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Anh em” ở đây chỉ những người cùng đức tin; tùy cách dùng trong cộng đồng, từ Hy Lạp ở số nhiều có thể bao gồm cả nữ tín hữu.
    reason: lexical_alternative
  - marker: b
    text: Từ Hy Lạp là “politarch,” một chức danh địa phương của các quan chức thành phố tại Ma-xê-đô-ni-a.
    reason: cultural_note
  - marker: c
    text: Cũng có thể dịch là “thế giới có người ở”; cụm từ này thường chỉ thế giới được biết đến thời ấy, nhất là phạm vi Đế quốc La Mã.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ εὑρόντες
  choice: khi không tìm thấy họ
  rationale: Phân từ bất định với μή diễn tả hoàn cảnh xảy ra trước hành động chính; cách dịch này tự nhiên và giữ được quan hệ thời gian mà không diễn giải quá mức.
- source_word: ἔσυρον
  choice: lôi
  rationale: Động từ σύρω hàm ý kéo đi bằng sức mạnh; “lôi” truyền đạt rõ tính cưỡng ép và phù hợp với văn cảnh đám đông bạo động.
- source_word: τινας ἀδελφοὺς
  choice: một số anh em
  rationale: ἀδελφοί ở đây chỉ những người cùng đức tin. “Anh em” vừa sát hình thức Hy Lạp vừa là cách gọi cộng đồng tín hữu quen thuộc trong tiếng Việt; sắc thái có thể bao gồm cả nam lẫn nữ được ghi chú.
- source_word: ἐπὶ τοὺς πολιτάρχας
  choice: đến trước các quan chức thành phố
  rationale: πολιτάρχης là chức danh hành chính địa phương đặc thù của Ma-xê-đô-ni-a. Bản dịch chính nêu chức năng dễ hiểu, còn tên gọi lịch sử được bảo lưu trong chú thích.
- source_word: βοῶντες
  choice: la lớn
  rationale: Từ này chỉ việc kêu to công khai; “la lớn” tự nhiên trong tiếng Việt và giữ được cường độ của lời tố cáo.
- source_word: οἱ τὴν οἰκουμένην ἀναστατώσαντες
  choice: những kẻ đã làm đảo lộn cả thế giới
  rationale: ἀναστατόω diễn tả việc gây xáo trộn hoặc biến động nghiêm trọng. “Làm đảo lộn” giữ được hình ảnh mạnh và giọng cáo buộc; “những kẻ” phù hợp thái độ thù địch của người nói mà không khẳng định lời tố cáo là đúng.
- source_word: οἰκουμένην
  choice: thế giới
  rationale: οἰκουμένη theo nghĩa đen là thế giới có người ở và trong bối cảnh có thể chủ yếu chỉ thế giới dưới phạm vi La Mã. “Thế giới” là cách diễn đạt tự nhiên, còn giới hạn nghĩa được nêu trong chú thích.
- source_word: οὗτοι καὶ ἐνθάδε πάρεισιν
  choice: nay cũng có mặt ở đây
  rationale: πάρειμι có thể nói đến sự hiện diện hoặc việc đã đến nơi. Cách dịch này giữ trọng tâm ở sự hiện diện hiện tại; “cũng” thể hiện καί và “nay” làm rõ sắc thái họ đã lan tới địa điểm này.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. “Đám đông” được dùng làm chủ ngữ tường minh theo ngữ cảnh gần, tránh chuỗi đại từ mơ hồ trong tiếng Việt. Tên Ἰάσων được phiên âm theo lối Kinh Thánh tiếng Việt là “Gia-sôn.” Các từ “lôi,” “la lớn” và “những kẻ” giữ nguyên sắc thái cưỡng ép, ồn ào và thù địch của cảnh tố cáo.
