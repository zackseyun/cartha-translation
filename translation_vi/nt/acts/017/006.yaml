- from: 'Nhưng khi không tìm thấy họ, đám đông lôi Gia-sôn và một số anh em[a] đến trước các quan chức thành phố[b], rồi la lớn: “Những kẻ đã làm đảo lộn cả thế giới[c] nay cũng có mặt ở đây!”'
  to: 'Nhưng khi không tìm thấy họ, họ lôi Gia-sôn và một số anh em[a] đến trước các quan chức thành phố[b] và kêu lớn: “Những kẻ đã làm đảo lộn cả thế giới[c] cũng đã đến đây!”'
  rationale: Bản sửa không thay đổi nghĩa câu, nhưng loại bỏ chủ ngữ được suy diễn khỏi văn cảnh, diễn đạt tự nhiên hơn quan hệ giữa hành động lôi đi và tiếng kêu lớn, và dịch trực tiếp hơn việc những người bị tố cáo “cũng đã đến đây.” Các chú thích được giữ nguyên nội dung và gắn đúng với các thuật ngữ chúng giải thích.
