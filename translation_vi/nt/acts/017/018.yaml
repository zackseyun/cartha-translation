source:
  edition: SBLGNT
  text: τινὲς δὲ καὶ τῶν Ἐπικουρείων ⸀καὶ Στοϊκῶν φιλοσόφων συνέβαλλον αὐτῷ, καί τινες ἔλεγον· Τί ἂν θέλοι ὁ σπερμολόγος οὗτος λέγειν; οἱ δέ· Ξένων δαιμονίων δοκεῖ καταγγελεὺς εἶναι· ὅτι τὸν Ἰησοῦν καὶ τὴν ἀνάστασιν εὐηγγελίζετο.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/018.yaml
  text: Some of the Epicurean and Stoic philosophers also engaged with him[a], and some were saying, “What is this babbler trying to say?” But others said[d][c][b], “He seems to be a proclaimer of foreign deities,” because he was proclaiming the good news about Jesus and the resurrection.
translation:
  language: vi
  text: 'Có một số triết gia thuộc phái Ê-pi-cua và phái Khắc Kỷ cũng trao đổi với ông[a]. Một số nói: “Gã nhặt nhạnh những mẩu ý tưởng này định nói gì đây?”[b] Nhưng những người khác lại nói: “Xem ra ông ta là kẻ rao truyền các thần ngoại quốc.”[c][d] Họ nói thế vì Phao-lô đang rao truyền tin mừng về Đức Giê-su và sự sống lại.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “thảo luận với ông” hoặc “tranh luận với ông”; động từ Hy Lạp có thể chỉ một cuộc trao đổi hay tranh luận tích cực.
    reason: lexical_alternative
  - marker: b
    text: “Gã nhặt nhạnh những mẩu ý tưởng” dịch một từ miệt thị có nghĩa đen liên quan đến kẻ “nhặt hạt”, được dùng về người bị coi là thu gom rồi lặp lại những mẩu ý tưởng vụn vặt.
    reason: cultural_note
  - marker: c
    text: Cũng có thể dịch là “các quỷ ngoại quốc” hoặc “các thần lạ”. Ở đây, theo thế giới quan đa thần của người nói, có lẽ họ muốn nói đến những hữu thể thần linh xa lạ, chứ không nhất thiết là quỷ dữ theo cách hiểu Cơ Đốc giáo về sau.
    reason: alternative_reading
  - marker: d
    text: Một số người cho rằng dân A-thên có thể đã hiểu lầm “sự sống lại” là tên của một vị thần khác, vì Phao-lô rao truyền về Đức Giê-su và sự sống lại.
    reason: alternative_reading
lexical_decisions:
- source_word: συνέβαλλον αὐτῷ
  choice: trao đổi với ông
  rationale: Động từ có thể chỉ việc trò chuyện, thảo luận hoặc tranh luận. “Trao đổi” giữ được phạm vi nghĩa rộng mà không mặc nhiên coi cuộc gặp là đối đầu.
- source_word: σπερμολόγος
  choice: tên nhặt nhạnh lời lẽ
  rationale: Từ miệt thị này vốn gợi hình ảnh kẻ nhặt hạt, rồi được dùng về người thu gom và lặp lại những mẩu ý tưởng vụn vặt. Cách dịch này vừa truyền đạt sắc thái khinh miệt vừa giữ hình ảnh nền của từ Hy Lạp.
- source_word: Τί ἂν θέλοι ... λέγειν
  choice: muốn nói gì vậy?
  rationale: Lối nói với ἄν và thức mong mỏi diễn tả sự phỏng đoán mang sắc thái coi thường; câu tiếng Việt tự nhiên này giữ được sắc thái ấy trong ngữ cảnh.
- source_word: Ξένων δαιμονίων
  choice: các thần ngoại quốc
  rationale: Trong lời của người A-thên theo thế giới quan đa thần, δαιμόνια chỉ các hữu thể thần linh xa lạ, không nhất thiết là các quỷ dữ theo cách hiểu Cơ Đốc giáo về sau.
- source_word: καταγγελεὺς
  choice: kẻ rao truyền
  rationale: Danh từ chỉ người công bố hoặc loan báo công khai; “kẻ rao truyền” phù hợp với giọng cáo buộc của người nói.
- source_word: εὐηγγελίζετο
  choice: đang rao truyền tin mừng
  rationale: Giữ rõ nghĩa chuyên biệt là công bố tin vui, thay vì dùng một từ chung hơn như “giảng”.
- source_word: ἀνάστασιν
  choice: sự sống lại
  rationale: Cụm danh từ chỉ nội dung sứ điệp Phao-lô công bố. Không nhân cách hóa trong chính văn, đồng thời ghi nhận cách hiểu khác ở chú thích.
- source_word: Ἐπικουρείων καὶ Στοϊκῶν φιλοσόφων
  choice: triết gia thuộc phái Ê-pi-cua và phái Khắc Kỷ
  rationale: Cách gọi tự nhiên, rõ ràng trong tiếng Việt hiện đại và bảo toàn tên hai trường phái triết học.
theological_decisions:
- issue: Cách dịch δαιμόνια trong lời nói thuộc bối cảnh đa thần
  choice: các thần ngoại quốc
  alternative: các quỷ ngoại quốc; các thần lạ
  rationale: Dịch là “quỷ” dễ áp đặt phạm trù Cơ Đốc giáo về sau lên lời cáo buộc của người A-thên. “Các thần” phản ánh đúng hơn cách họ có thể nhìn nhận những hữu thể thần linh xa lạ.
- issue: Có nhân cách hóa ἀνάστασις như tên một nữ thần hay không
  choice: sự sống lại
  alternative: Sự Sống Lại như tên riêng của một nữ thần
  rationale: Lời giải thích của Lu-ca trình bày nội dung sứ điệp của Phao-lô, nên chính văn giữ danh từ chung. Khả năng người nghe hiểu lầm đó là một vị thần khác được bảo lưu trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Đức Giê-su” và “Phao-lô” theo lối gọi quen thuộc trong tiếng Việt; “phái Khắc Kỷ” là tên thông dụng của Stoicism. Các dấu chú thích đều được đặt trong chính văn tại nội dung tương ứng.
