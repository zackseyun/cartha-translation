    text: 'Cũng có thể dịch: “ra trước cuộc hội họp công khai” hoặc “ra trước dân chúng.” Từ Hy Lạp δῆμος chỉ cộng đồng công dân nhóm họp công khai, chứ không đơn thuần là một đám đông bất định.'
