  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸂ζηλώσαντες δὲ οἱ Ἰουδαῖοι καὶ προσλαβόμενοι⸃ τῶν ἀγοραίων ⸂ἄνδρας τινὰς⸃ πονηροὺς καὶ ὀχλοποιήσαντες ἐθορύβουν τὴν πόλιν, ⸂καὶ ἐπιστάντες⸃ τῇ οἰκίᾳ Ἰάσονος ἐζήτουν αὐτοὺς ⸀προαγαγεῖν εἰς τὸν δῆμον·
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/005.yaml
  text: But the Jews[a], becoming jealous and taking along some wicked men from the marketplace, formed a mob and were throwing the city into an uproar; and coming to Jason’s house, they were seeking to bring them out to the assembly.
translation:
  language: vi
  text: Nhưng những người Do Thái nổi lòng ghen tức, lôi kéo một số kẻ xấu ở nơi phố chợ, tụ tập thành đám đông và gây náo loạn cả thành. Rồi họ kéo đến nhà Gia-sôn, tìm cách đưa họ ra trước dân chúng đang nhóm họp công khai.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “ra trước cuộc hội họp công khai” hoặc “ra trước dân chúng.” Từ Hy Lạp δῆμος chỉ cộng đồng công dân nhóm họp công khai, chứ không đơn thuần là một đám đông bất định.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ζηλώσαντες
  choice: nổi lòng ghen tức
  rationale: Diễn đạt tự nhiên sắc thái khởi phát của phân từ aorist và cho thấy động cơ dẫn đến các hành động tiếp theo.
- source_word: οἱ Ἰουδαῖοι
  choice: những người Do Thái
  rationale: Giữ nguyên cách gọi của bản Hy Lạp, không tự ý thu hẹp thành các lãnh đạo Do Thái; ngữ cảnh cho thấy đây là một nhóm cụ thể.
- source_word: προσλαβόμενοι
  choice: lôi kéo
  rationale: Trong ngữ cảnh tập hợp người để gây rối, từ này diễn đạt việc thu nạp họ về phía mình mà không hàm ý chắc chắn có thuê mướn.
- source_word: τῶν ἀγοραίων
  choice: ở nơi phố chợ
  rationale: Chỉ những người có mặt hoặc thường lui tới agora, tức khu chợ/quảng trường công cộng; tránh thêm sắc thái 'ăn không ngồi rồi' vốn không được nói rõ.
- source_word: ἄνδρας τινὰς πονηρούς
  choice: một số kẻ xấu
  rationale: Truyền đạt sự đánh giá tiêu cực về phẩm chất của họ bằng cách nói tự nhiên trong tiếng Việt; 'kẻ' trong ngữ cảnh này chỉ những người đàn ông được nêu trong tiếng Hy Lạp.
- source_word: ὀχλοποιήσαντες
  choice: tụ tập thành đám đông
  rationale: Thể hiện hành động tạo thành một đám đông có tính chất gây rối, phù hợp với diễn tiến câu.
- source_word: ἐθορύβουν τὴν πόλιν
  choice: gây náo loạn cả thành
  rationale: Giữ sức mạnh của động từ θορυβέω và sắc thái hành động đang diễn ra của thì imperfect trong lối kể tiếng Việt tự nhiên.
- source_word: ἐπιστάντες τῇ οἰκίᾳ Ἰάσονος
  choice: kéo đến nhà Gia-sôn
  rationale: ἐφίστημι ở đây có nghĩa đến hoặc ập tới; 'kéo đến' hợp với chủ thể là đám đông thù địch nhưng không khẳng định họ đã tấn công ngôi nhà.
- source_word: ἐζήτουν
  choice: tìm cách
  rationale: Thể hiện nỗ lực đang tiếp diễn, đồng thời phù hợp với động từ nguyên mẫu theo sau.
- source_word: αὐτούς
  choice: hai người
  rationale: Ngữ cảnh gần xác định đại từ số nhiều là Phao-lô và Si-la; tiếng Việt dùng 'hai người' rõ và tự nhiên hơn một đại từ không có tiền ngữ trực tiếp trong câu.
- source_word: προαγαγεῖν
  choice: đưa hai người ra
  rationale: Giữ hướng nghĩa đưa từ trong nhà ra ngoài và dẫn ra trình diện trước một tập thể công cộng.
- source_word: εἰς τὸν δῆμον
  choice: ra trước hội đồng dân chúng
  rationale: δῆμος ở đây là cộng đồng công dân nhóm họp công khai, không chỉ là một đám đông bất định; cách dịch này giữ sắc thái công dân và công cộng mà không khẳng định quá mức một thiết chế cụ thể.
theological_decisions:
- issue: Cách dịch οἱ Ἰουδαῖοι trong trình thuật xung đột
  choice: những người Do Thái
  alternative: các lãnh đạo Do Thái; người Giu-đê
  rationale: Bám sát danh xưng của nguyên bản, không thu hẹp thành giới lãnh đạo khi tiếng Hy Lạp không nói như vậy. Mạo từ và ngữ cảnh chỉ một nhóm người Do Thái cụ thể tại Tê-sa-lô-ni-ca, không phải mọi người Do Thái ở mọi nơi.
- issue: Đối tượng của εἰς τὸν δῆμον
  choice: hội đồng dân chúng
  alternative: dân chúng; cuộc hội họp công khai
  rationale: Giữ sắc thái thể chế/công dân của δῆμος, tránh hiểu đây chỉ là đám đông vừa được tụ tập để gây loạn.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng tên riêng theo lối phiên âm Kinh Thánh tiếng Việt quen thuộc. Cấu trúc câu giữ chuỗi hành động và động cơ của nguyên bản nhưng chia nhịp để đọc tự nhiên.
