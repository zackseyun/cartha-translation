revisions:
- from: Nhưng những người Do Thái nổi lòng ghen tức, lôi kéo một số kẻ xấu ở nơi phố chợ, tụ tập thành đám đông và gây náo loạn cả thành. Rồi họ kéo đến nhà Gia-sôn, tìm cách đưa hai người ra trước hội đồng dân chúng.[a]
  to: Nhưng những người Do Thái nổi lòng ghen tức, lôi kéo một số kẻ xấu ở nơi phố chợ, tụ tập thành đám đông và gây náo loạn cả thành. Rồi họ kéo đến nhà Gia-sôn, tìm cách đưa họ ra trước dân chúng đang nhóm họp công khai.[a]
  rationale: Bản sửa giữ các lựa chọn diễn đạt tốt của bản thảo, nhưng phục hồi tính không xác định của αὐτούς bằng «họ» và thay «hội đồng dân chúng» bằng «dân chúng đang nhóm họp công khai» để phản ánh δῆμος mà không áp đặt một cơ cấu hội đồng cụ thể. Chú thích được giữ và điều chỉnh cho phù hợp với bản văn chính.
