revisions:
- from: Ngài đã làm nên mọi dân tộc trong nhân loại từ một người, để họ sống trên khắp mặt đất[a]; Ngài cũng ấn định những thời kỳ đã được định trước và ranh giới nơi cư ngụ của họ[b].
  to: Ngài đã làm nên mọi dân tộc trong nhân loại từ một người, để họ sống trên khắp mặt đất[a], đồng thời ấn định trước các thời kỳ và ranh giới nơi cư ngụ của họ[b].
  rationale: Bản sửa giữ nguyên nghĩa và các điểm quyết định văn bản của bản thảo, nhưng thay cụm từ trùng lặp bằng “ấn định trước các thời kỳ” để phản ánh rõ hơn ὁρίσας προστεταγμένους καιρούς. Đồng thời, “đồng thời” liên kết tự nhiên hành động này với mệnh đề chính mà không biến nó thành một câu độc lập.
