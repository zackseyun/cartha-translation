id: ACT.17.26
reference: Acts 17:26
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐποίησέν τε ἐξ ⸀ἑνὸς πᾶν ἔθνος ἀνθρώπων κατοικεῖν ἐπὶ ⸂παντὸς προσώπου⸃ τῆς γῆς, ὁρίσας προστεταγμένους καιροὺς καὶ τὰς ὁροθεσίας τῆς κατοικίας αὐτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/026.yaml
  text: And he made from one man every nation of mankind to live on the whole face of the earth[a], having determined their appointed times and the boundaries of their dwelling place[b],
translation:
  language: vi
  text: Ngài đã làm nên mọi dân tộc trong nhân loại từ một người, để họ sống trên khắp mặt đất[a], đồng thời ấn định trước các thời kỳ và ranh giới nơi cư ngụ của họ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Một số bản chép tay ghi “từ một dòng máu” thay vì “từ một”. Chính văn theo cách đọc “từ một” của SBLGNT; từ “người” được bổ sung trong tiếng Việt để câu rõ nghĩa.
    reason: textual_variant
  - marker: b
    text: 'Cũng có thể dịch: “những thời kỳ được ấn định cho họ”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐποίησέν
  choice: đã làm nên
  rationale: Diễn đạt nghĩa rộng của ποιέω là làm nên hoặc khiến thành hiện thực, không đặc định hóa thành sự sáng tạo từ hư vô.
- source_word: τε
  choice: cũng
  rationale: Thể hiện chức năng liên kết của τέ với lập luận ngay trước đó bằng một từ nối tự nhiên trong tiếng Việt.
- source_word: ἐξ ἑνὸς
  choice: từ một người
  rationale: Bản Hy Lạp chỉ ghi 'từ một'; danh từ 'người' được bổ sung để câu tiếng Việt trọn nghĩa, phù hợp với ngữ cảnh nói về nguồn gốc chung của nhân loại, nhưng không đưa dị bản 'dòng máu' vào chính văn.
- source_word: πᾶν ἔθνος ἀνθρώπων
  choice: mọi dân tộc trong nhân loại
  rationale: Giữ ý nghĩa từng dân tộc thuộc toàn thể loài người, đồng thời tránh cách diễn đạt cổ hoặc dễ bị hiểu là chỉ nam giới.
- source_word: κατοικεῖν
  choice: để họ sống
  rationale: Diễn đạt tự nhiên động từ 'cư trú, sinh sống' và làm rõ chủ thể số nhiều vốn hàm chứa trong ngữ cảnh.
- source_word: ἐπὶ παντὸς προσώπου τῆς γῆς
  choice: trên khắp mặt đất
  rationale: Giữ hình ảnh 'mặt đất' của thành ngữ Hy Lạp, còn 'khắp' truyền đạt phạm vi toàn thể một cách tự nhiên.
- source_word: ὁρίσας
  choice: ấn định
  rationale: Thể hiện hành động xác lập trước các thời kỳ và giới hạn, không diễn giải thêm phương thức hay mục đích thần học.
- source_word: προστεταγμένους καιροὺς
  choice: những thời kỳ đã được định trước
  rationale: καιροί chỉ những thời kỳ hay giai đoạn có ý nghĩa, còn προστεταγμένους mang sắc thái đã được chỉ định hoặc sắp đặt trước.
- source_word: ὁροθεσίας
  choice: ranh giới
  rationale: Tương đương tự nhiên với ý nghĩa đường biên hoặc giới hạn địa lý.
- source_word: τῆς κατοικίας αὐτῶν
  choice: nơi cư ngụ của họ
  rationale: Bảo toàn ý nghĩa về địa bàn cư trú của các dân tộc bằng lối nói trang trọng nhưng hiện đại.
theological_decisions:
- issue: Có nên nêu rõ danh từ hàm ẩn trong ἐξ ἑνὸς hay không
  choice: từ một người
  alternative: từ một; từ một tổ tiên
  rationale: Cụm Hy Lạp chỉ nói 'từ một', nên vẫn có độ hàm ẩn. Tuy nhiên, tiếng Việt không thể dùng tự nhiên một tính từ số đếm đứng độc lập ở đây. 'Một người' bổ sung tối thiểu theo ngữ cảnh nhân loại, không đồng nhất chính văn với dị bản 'một dòng máu' và không đặc định người ấy là ai.
- issue: Quan hệ giữa sự ấn định của Đức Chúa Trời và các thời kỳ, ranh giới của dân tộc
  choice: Ngài cũng ấn định những thời kỳ đã được định trước và ranh giới nơi cư ngụ của họ
  alternative: Ngài ấn định những thời kỳ dành cho họ và giới hạn nơi họ sinh sống
  rationale: Bản dịch giữ cả hành động chủ động của Đức Chúa Trời lẫn sắc thái đã được chỉ định của phân từ προστεταγμένους, nhưng không giải thích xa hơn về tiền định, lịch sử hay quyền sở hữu lãnh thổ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng “Ngài” theo ngữ cảnh chỉ Đức Chúa Trời; “làm nên”, “ấn định” và “nơi cư ngụ” giữ sắc thái Kinh Thánh mà không quá cổ. Dấu chấm phẩy giúp phân biệt hai hành động chính trong câu dài.
