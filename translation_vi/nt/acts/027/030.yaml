source:
  edition: SBLGNT
  text: τῶν δὲ ναυτῶν ζητούντων φυγεῖν ἐκ τοῦ πλοίου καὶ χαλασάντων τὴν σκάφην εἰς τὴν θάλασσαν προφάσει ὡς ἐκ πρῴρης ⸂ἀγκύρας μελλόντων⸃ ἐκτείνειν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/030.yaml
  text: And when the sailors were seeking to escape from the ship and had lowered the skiff into the sea under the pretense of being about to lay out anchors from the bow[b][a],
translation:
  language: vi
  text: Khi các thủy thủ tìm cách trốn thoát khỏi tàu và đã hạ chiếc thuyền nhỏ[a] xuống biển, giả vờ như sắp thả các neo từ mũi tàu[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “chiếc xuồng.” Từ Hy Lạp chỉ chiếc thuyền nhỏ của tàu.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “từ phía mũi tàu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ναυτῶν
  choice: các thủy thủ
  rationale: Cách gọi tự nhiên, rõ nghĩa trong tiếng Việt hiện đại đối với những người vận hành tàu.
- source_word: ζητούντων φυγεῖν
  choice: tìm cách trốn
  rationale: Diễn đạt ý cố gắng thoát khỏi tàu; “trốn” giữ sắc thái hành động lén lút trong ngữ cảnh.
- source_word: ἐκ τοῦ πλοίου
  choice: khỏi tàu
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt về việc rời bỏ con tàu.
- source_word: χαλασάντων τὴν σκάφην
  choice: đã hạ chiếc thuyền nhỏ
  rationale: χαλάω chỉ việc hạ xuống, còn σκάφη là chiếc thuyền nhỏ đi kèm tàu; tránh từ “xuồng cứu sinh” vì có thể diễn giải quá mức chức năng của nó.
- source_word: εἰς τὴν θάλασσαν
  choice: xuống biển
  rationale: Phối hợp tự nhiên với động từ “hạ” và phản ánh đúng hướng chuyển động vào mặt biển.
- source_word: προφάσει ὡς
  choice: giả vờ như
  rationale: Truyền đạt rõ lý do bề ngoài được dùng để che giấu ý định thật, bằng cách nói tự nhiên và gọn trong tiếng Việt.
- source_word: ἐκ πρῴρης
  choice: từ mũi tàu
  rationale: “Mũi tàu” là thuật ngữ tiếng Việt hiện đại, phổ thông và chính xác cho phần trước của tàu.
- source_word: ἀγκύρας
  choice: các neo
  rationale: Giữ số nhiều của danh từ Hy Lạp.
- source_word: μελλόντων ἐκτείνειν
  choice: sắp thả
  rationale: μέλλω biểu thị ý định hoặc hành động sắp xảy ra; trong ngữ cảnh hàng hải, ἐκτείνω nói đến việc đưa neo ra/thả neo. “Thả” tự nhiên hơn lối dịch sát “kéo dài”.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Câu được để mở bằng dấu phẩy vì trong nguyên văn đây là mệnh đề phụ tiếp nối sang câu sau. Các thuật ngữ hàng hải được chọn theo cách dùng phổ thông; mọi dấu chú thích đều xuất hiện trong chính văn.
