  yaml_path: translation/nt/acts/027/014.yaml
  text: But not long after[b][a], a typhonic wind called Euraquilo rushed down against it.
translation:
  language: vi
  text: Nhưng chẳng bao lâu sau, một trận cuồng phong gọi là Ơ-ra-ky-lôn[a] từ đảo ập xuống.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Một số bản chép ghi “Ơ-rô-kly-đôn” thay cho “Ơ-ra-ky-lôn.”
    reason: textual_variant
  - marker: b
    text: 'Tên này có lẽ chỉ một trận gió đông bắc dữ dội. Cụm từ Hy Lạp có cách hiểu không chắc chắn: có thể diễn tả gió từ đảo ập xuống, hoặc gió ập vào nó (đảo hay con tàu).'
    reason: lexical_alternative
lexical_decisions:
- source_word: μετ’ οὐ πολὺ
  choice: chẳng bao lâu sau
  rationale: Diễn đạt tự nhiên thành ngữ chỉ một thời gian ngắn sau đó, đồng thời giữ sắc thái thời gian của nguyên văn.
- source_word: δὲ
  choice: Nhưng
  rationale: Thể hiện bước chuyển có sắc thái tương phản nhẹ khi tình thế đột ngột trở nên nguy hiểm.
- source_word: ἔβαλεν κατ’ αὐτῆς
  choice: từ đảo ập xuống
  rationale: Với gió làm chủ thể, ἔβαλεν diễn tả sự lao đến dữ dội; κατά với đại từ giống cái trong ngữ cảnh nhiều khả năng chỉ hướng từ đảo Cơ-rết xuống. Cách dịch này tự nhiên trong tiếng Việt, còn khả năng hiểu là gió ập vào đảo được ghi nhận ở chú thích.
- source_word: ἄνεμος τυφωνικὸς
  choice: một trận cuồng phong
  rationale: τυφωνικός mô tả thứ gió xoáy dữ dội như bão. “Cuồng phong” truyền đạt cường độ và tính chất của hiện tượng mà không áp đặt một cấp độ khí tượng hiện đại cụ thể.
- source_word: ὁ καλούμενος
  choice: gọi là
  rationale: Công thức tự nhiên để giới thiệu tên gọi của cơn gió.
- source_word: Εὐρακύλων
  choice: Ơ-ra-ky-lôn
  rationale: Phiên âm tên riêng theo dạng Εὐρακύλων của SBLGNT thay vì dịch nghĩa thành “gió đông bắc”; dạng văn bản khác được nêu trong chú thích.
