  rationale: Giữ nguyên bản văn vì cách dịch chính có thể bảo vệ được và tự nhiên, nhưng sửa chú thích b để không áp đặt một cách giải nghĩa cho cụm κατ’ αὐτῆς. Chú thích mới nêu cả hướng hiểu “từ đảo” và “ập vào nó,” đồng thời làm rõ tiền ngữ có thể được hiểu là đảo hoặc con tàu.
