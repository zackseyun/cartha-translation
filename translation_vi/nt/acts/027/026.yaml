  text: εἰς νῆσον δέ τινα δεῖ ἡμᾶς ἐκπεσεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/026.yaml
  text: But we must run aground on some island[a].
translation:
  language: vi
  text: Nhưng chúng ta phải dạt vào bờ một hòn đảo nào đó.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “mắc cạn tại một hòn đảo nào đó.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: δέ
  choice: Nhưng
  rationale: Diễn tả sự chuyển ý có sắc thái tương phản nhẹ với điều vừa nói, đồng thời tự nhiên trong mạch văn tiếng Việt.
- source_word: δεῖ
  choice: phải
  rationale: Giữ nguyên ý nghĩa về sự cần thiết hoặc tất yếu mà động từ Hy Lạp diễn đạt.
- source_word: ἡμᾶς
  choice: chúng ta
  rationale: Là chủ thể của động từ nguyên mẫu trong cấu trúc Hy Lạp; chuyển thành chủ ngữ tự nhiên trong tiếng Việt.
- source_word: ἐκπεσεῖν
  choice: dạt vào
  rationale: Trong ngữ cảnh hàng hải, động từ có thể chỉ việc tàu bị đẩy hoặc dạt vào bờ. Cách dịch này tự nhiên, giữ sắc thái không hoàn toàn chủ động và phù hợp với εἰς νῆσον.
- source_word: εἰς νῆσον
  choice: vào một hòn đảo
  rationale: εἰς biểu thị hướng đến, còn νῆσον chỉ một hòn đảo; kết hợp với động từ hàng hải, tiếng Việt tự nhiên dùng “dạt vào một hòn đảo”.
- source_word: τινα
  choice: nào đó
  rationale: 'Giữ tính bất định của đại từ: hòn đảo chưa được xác định.'
theological_decisions:
- issue: Sắc thái tất yếu của δεῖ
  choice: phải
  alternative: ắt sẽ
  rationale: “Phải” giữ trực tiếp ý nghĩa cần thiết mà không xác định rõ đó là tất yếu do ý định Đức Chúa Trời, hoàn cảnh hay một nguyên nhân khác; nhờ vậy không giải quyết quá mức điều câu Hy Lạp để ngỏ.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. “Dạt vào” phù hợp ngữ cảnh hàng hải và tránh tạo cảm giác con người chủ động điều khiển tàu; chú thích bảo lưu khả năng dịch theo nghĩa “mắc cạn”.
