  text: ⸀εἴπας δὲ ταῦτα καὶ λαβὼν ἄρτον εὐχαρίστησεν τῷ θεῷ ἐνώπιον πάντων καὶ κλάσας ἤρξατο ἐσθίειν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/035.yaml
  text: And after saying these things and taking bread[a], he gave thanks to God in the presence of all, and after breaking it, he began to eat.
translation:
  language: vi
  text: Sau khi nói những lời ấy, ông cầm lấy bánh, tạ ơn Đức Chúa Trời trước mặt mọi người[a], rồi bẻ bánh và bắt đầu ăn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “trước tất cả mọi người.”'
    reason: Nêu cách diễn đạt khác, tự nhiên và sát nghĩa cho ἐνώπιον πάντων.
lexical_decisions:
- source_word: εἴπας δὲ ταῦτα
  choice: Sau khi nói những lời ấy
  rationale: Diễn đạt tự nhiên hành động xảy ra trước các hành động tiếp theo; δέ là từ nối nhẹ trong mạch kể nên không cần dịch thành một từ riêng trong tiếng Việt.
- source_word: λαβὼν ἄρτον
  choice: ông cầm lấy bánh
  rationale: Giữ cách nói đơn giản của nguyên văn, không xác định đó là cả ổ bánh hay một phần bánh. Đại từ “ông” giúp câu tiếng Việt tự nhiên mà không lặp lại tên Phao-lô từ ngữ cảnh.
- source_word: εὐχαρίστησεν τῷ θεῷ
  choice: tạ ơn Đức Chúa Trời
  rationale: Chuyển tải trực tiếp nghĩa thông dụng của εὐχαριστέω cùng đối tượng được tạ ơn, với văn phong trang trọng và quen thuộc trong tiếng Việt Kinh Thánh.
- source_word: ἐνώπιον πάντων
  choice: trước mặt mọi người
  rationale: Thể hiện rõ hành động diễn ra công khai, ngay trước sự chứng kiến của tất cả những người hiện diện.
- source_word: κλάσας
  choice: rồi bẻ bánh
  rationale: Phân từ aorist chỉ hành động xảy ra trước việc ăn; lặp lại “bánh” tự nhiên và rõ hơn đại từ “nó” trong tiếng Việt.
- source_word: ἤρξατο ἐσθίειν
  choice: bắt đầu ăn
  rationale: Giữ nguyên sắc thái khởi đầu của cấu trúc ἄρχομαι kết hợp với động từ nguyên mẫu.
theological_decisions:
- issue: Khả năng gợi liên tưởng đến Tiệc Thánh trong chuỗi hành động cầm bánh, tạ ơn, bẻ bánh và ăn
  choice: Dịch các hành động theo lối kể chuyện thông thường, không thêm thuật ngữ nghi lễ.
  alternative: Dùng cách diễn đạt mang âm hưởng phụng vụ rõ hơn.
  rationale: Cách diễn đạt có thể gợi nhớ những trình thuật về Tiệc Thánh, nhưng câu này chỉ trực tiếp kể việc Phao-lô ăn trước mọi người trên tàu. Bản dịch giữ nguyên khả năng liên tưởng mà không khẳng định một ý nghĩa bí tích không được nêu rõ.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Cấu trúc câu giữ rõ trình tự hành động nhưng tránh lối dịch phân từ Hy Lạp quá cứng.
