  source_fidelity: Bản dịch phân biệt đúng βραδυπλοοῦντες (đi chậm) với μόλις (khó nhọc lắm mới), và diễn đạt đúng hành trình ở phía khuất gió của Crete. Tuy nhiên, “tiến tới” hơi thiếu tự nhiên khi đứng sau “gió không cho phép”; “tiến thêm” diễn đạt rõ hơn sự bị cản trở trong hành trình mà không thêm một điểm đến không có trong nguyên văn.
