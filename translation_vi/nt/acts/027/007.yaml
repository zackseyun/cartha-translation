  text: ἐν ἱκαναῖς δὲ ἡμέραις βραδυπλοοῦντες καὶ μόλις γενόμενοι κατὰ τὴν Κνίδον, μὴ προσεῶντος ἡμᾶς τοῦ ἀνέμου, ὑπεπλεύσαμεν τὴν Κρήτην κατὰ Σαλμώνην,
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/007.yaml
  text: For many days we were sailing slowly[a], and with difficulty we came opposite Cnidus. Since the wind did not allow us to go farther, we sailed under the lee of Crete[b], off Salmone.
translation:
  language: vi
  text: Sau nhiều ngày đi chậm chạp trên biển, chúng tôi khó nhọc lắm mới đến ngang Cơ-nít. Vì gió không cho phép chúng tôi tiến thêm[a], chúng tôi đi dọc theo phía khuất gió của đảo Cơ-rết[b], ngang San-môn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “gió không cho phép chúng tôi đến gần.” Cụm từ Hy Lạp có thể nói đến việc gió ngăn con tàu tiến tiếp hoặc tiếp cận nơi định đến.'
    reason: lexical_alternative
  - marker: b
    text: 'Theo sát nguyên văn: “đi tàu phía dưới Cơ-rết,” nghĩa là đi bên phía đảo che gió, tức phía khuất gió.'
    reason: cultural_note
lexical_decisions:
- source_word: ἐν ἱκαναῖς δὲ ἡμέραις
  choice: Trong nhiều ngày
  rationale: Diễn đạt tự nhiên khoảng thời gian kéo dài mà cụm ἐν với tặng cách chỉ thời gian biểu thị.
- source_word: βραδυπλοοῦντες
  choice: chúng tôi đi tàu rất chậm
  rationale: Giữ hình ảnh hàng hải và phân biệt ý đi chậm với ý khó nhọc của μόλις ở mệnh đề kế tiếp.
- source_word: μόλις γενόμενοι κατὰ τὴν Κνίδον
  choice: khó nhọc lắm mới đến ngang Cơ-nít
  rationale: μόλις nhấn mạnh sự khó khăn; κατά trong ngữ cảnh hàng hải chỉ vị trí ngang hoặc ngoài khơi một địa điểm.
- source_word: μὴ προσεῶντος ἡμᾶς τοῦ ἀνέμου
  choice: Vì gió không cho phép chúng tôi tiến tới
  rationale: Cấu trúc sở hữu cách tuyệt đối nêu nguyên nhân đổi hướng; προσεάω ở đây nói đến việc gió cản trở tiến trình hoặc sự tiếp cận.
- source_word: ὑπεπλεύσαμεν τὴν Κρήτην
  choice: chúng tôi đi tàu men theo phía khuất gió của đảo Cơ-rết
  rationale: Trong hàng hải, ὑποπλέω chỉ việc đi dọc phía được đảo che gió; cách dịch này rõ nghĩa với độc giả phổ thông.
- source_word: κατὰ Σαλμώνην
  choice: ngang San-môn
  rationale: κατά với địa danh ven biển xác định vị trí con tàu ngang địa điểm ấy, không nhất thiết hàm ý đã ghé vào.
- source_word: Κνίδον / Κρήτην / Σαλμώνην
  choice: Cơ-nít / Cơ-rết / San-môn
  rationale: Phiên âm các địa danh Hy Lạp theo lối dễ đọc và quen thuộc trong văn phong Kinh Thánh tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “đi tàu” thay cho thuật ngữ hàng hải chuyên biệt; “phía khuất gió” vừa chính xác vừa phổ thông. Hai dấu chú thích [a], [b] đều được đặt ngay sau cụm từ liên quan.
