id: ACT.27.3
reference: Acts 27:3
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τῇ τε ἑτέρᾳ κατήχθημεν εἰς Σιδῶνα, φιλανθρώπως τε ὁ Ἰούλιος τῷ Παύλῳ χρησάμενος ἐπέτρεψεν πρὸς τοὺς φίλους ⸀πορευθέντι ἐπιμελείας τυχεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/003.yaml
  text: And on the next day we put in at Sidon[a], and Julius, treating Paul kindly[b], permitted him to go to his friends and receive care.
translation:
  language: vi
  text: Hôm sau, chúng tôi ghé vào cảng Si-đôn. Giu-li-út đối xử nhân hậu với Phao-lô[b] và cho phép ông đến với bạn hữu để được chăm sóc[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “được quan tâm” hoặc “nhận sự trợ giúp”; cụm từ Hy Lạp có thể chỉ chung việc nhận sự giúp đỡ cần thiết từ bạn hữu.
    reason: lexical_alternative
  - marker: b
    text: “Đối xử nhân hậu” cũng có thể dịch là “đối xử có tình người”, nhấn mạnh cách cư xử đầy thiện ý của Giu-li-út đối với một tù nhân.
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ τε ἑτέρᾳ
  choice: Hôm sau
  rationale: Cách diễn đạt thời gian tự nhiên trong văn kể chuyện, chỉ ngày kế tiếp trong hành trình.
- source_word: κατήχθημεν εἰς Σιδῶνα
  choice: chúng tôi ghé vào cảng Si-đôn
  rationale: κατάγω trong ngữ cảnh hàng hải chỉ việc đưa tàu vào bờ hoặc ghé cảng; thêm “cảng” làm rõ nghĩa hàng hải vốn có của động từ.
- source_word: φιλανθρώπως ... χρησάμενος
  choice: đối xử nhân hậu với Phao-lô
  rationale: Cụm từ diễn tả cách Giu-li-út cư xử đầy thiện ý và có tình người đối với một tù nhân; “nhân hậu” vừa trang trọng vừa dễ hiểu.
- source_word: ἐπέτρεψεν
  choice: cho phép
  rationale: Diễn đạt trực tiếp hành động ban phép của viên sĩ quan.
- source_word: πρὸς τοὺς φίλους
  choice: đến với bạn hữu
  rationale: Mạo từ xác định hướng đến những người quen biết của Phao-lô tại Si-đôn; “bạn hữu” giữ sắc thái trang trọng vừa phải.
- source_word: πορευθέντι
  choice: đến
  rationale: Phân từ bất định phụ thuộc vào ἐπέτρεψεν được chuyển thành hành động bổ sung tự nhiên trong tiếng Việt.
- source_word: ἐπιμελείας τυχεῖν
  choice: để được chăm sóc
  rationale: Cụm Hy Lạp có nghĩa rộng là nhận được sự chăm nom, quan tâm hoặc trợ giúp cần thiết; cách dịch này tự nhiên và không giới hạn vào một loại hỗ trợ cụ thể.
theological_decisions: []
