  text: Ἱκανοῦ δὲ χρόνου διαγενομένου καὶ ὄντος ἤδη ἐπισφαλοῦς τοῦ πλοὸς διὰ τὸ καὶ τὴν νηστείαν ἤδη παρεληλυθέναι, παρῄνει ὁ Παῦλος
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/009.yaml
  text: Since considerable time had passed and the voyage was already dangerous[a], because even the Fast had already gone by, Paul was advising them[b],
translation:
  language: vi
  text: 'Vì đã qua một thời gian khá lâu và việc đi biển đã nguy hiểm do ngay cả kỳ kiêng ăn[a] cũng đã qua, Phao-lô khuyên họ rằng:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Kỳ kiêng ăn” rất có thể chỉ ngày kiêng ăn hằng năm của người Do Thái, tức Ngày Chuộc Tội. Việc ngày này đã qua cho thấy đã đến mùa đi biển nguy hiểm.
    reason: cultural_note
lexical_decisions:
- source_word: Ἱκανοῦ ... χρόνου διαγενομένου
  choice: đã khá nhiều thời gian trôi qua
  rationale: Diễn đạt tự nhiên cấu trúc sở hữu cách tuyệt đối, cho biết một khoảng thời gian đáng kể đã trôi qua mà không cường điệu thành một thời gian quá dài.
- source_word: ὄντος ἤδη ἐπισφαλοῦς
  choice: lúc ấy đã trở nên nguy hiểm
  rationale: ἐπισφαλής chỉ tình trạng không an toàn, đầy rủi ro; cách dịch này rõ nghĩa trong ngữ cảnh đi biển và ἤδη được thể hiện bằng “lúc ấy đã”.
- source_word: τοῦ πλοὸς
  choice: việc đi biển
  rationale: πλοῦς ở đây nói đến hoạt động hoặc hành trình đường biển, không phải con tàu; “việc đi biển” tự nhiên và phù hợp với nhận định về mức độ nguy hiểm theo mùa.
- source_word: διὰ τὸ καὶ τὴν νηστείαν ἤδη παρεληλυθέναι
  choice: bởi ngay cả kỳ Kiêng Ăn cũng đã qua
  rationale: Giữ nguyên quan hệ nguyên nhân của διά với động từ nguyên mẫu có mạo từ, sắc thái nhấn mạnh của καί (“ngay cả”) và ý hoàn tất của παρεληλυθέναι.
- source_word: τὴν νηστείαν
  choice: kỳ Kiêng Ăn
  rationale: Danh từ có mạo từ và ở số ít chỉ một kỳ kiêng ăn quen thuộc đối với độc giả Do Thái, rất có thể là lễ kiêng ăn trong Ngày Chuộc Tội. Bản dịch chính giữ cách gọi khái quát của nguyên văn; chú thích cung cấp bối cảnh văn hóa.
- source_word: παρῄνει
  choice: khuyên họ rằng
  rationale: παραινέω có nghĩa là khuyên nhủ hoặc thúc giục. “Khuyên họ rằng” nối tự nhiên với lời nói trực tiếp ở câu kế tiếp mà không làm động từ mạnh hơn mức cần thiết.
