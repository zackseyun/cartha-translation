translation_notes:
  register: Văn phong trần thuật hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “chúng tôi” theo lời kể ngôi thứ nhất số nhiều; “khó nhọc men theo bờ” giữ cả khó khăn của chuyến đi lẫn sắc thái hàng hải. Tên La-sê-a được phiên âm theo âm Hy Lạp.
