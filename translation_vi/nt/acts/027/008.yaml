  text: μόλις τε παραλεγόμενοι αὐτὴν ἤλθομεν εἰς τόπον τινὰ καλούμενον Καλοὺς Λιμένας ᾧ ἐγγὺς ⸂ἦν πόλις⸃ ⸀Λασαία.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/008.yaml
  text: And with difficulty coasting along it[a], we came to a certain place called Fair Havens, near which was a city named Lasea.
translation:
  language: vi
  text: Chúng tôi chật vật đi tàu men theo bờ đảo ấy[a], rồi đến một nơi gọi là Bến Cảng Đẹp; gần nơi ấy có thành La-sê-a.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “chật vật đi tàu dọc theo bờ đảo ấy.” Động từ Hy Lạp ở đây là một thuật ngữ hàng hải, chỉ việc đi tàu men theo đường bờ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μόλις
  choice: khó nhọc
  rationale: Diễn tả việc hành trình chỉ thực hiện được với nhiều khó khăn, đồng thời kết hợp tự nhiên với động từ chỉ việc đi tàu.
- source_word: τε
  choice: và
  rationale: Nối mệnh đề này với diễn tiến trước đó mà không nhấn quá mức sắc thái của tiểu từ.
- source_word: παραλεγόμενοι
  choice: men theo bờ
  rationale: Trong ngữ cảnh hàng hải, từ này chỉ việc di chuyển bằng tàu dọc theo đường bờ; cách dịch này tự nhiên và chính xác trong tiếng Việt.
- source_word: αὐτὴν
  choice: đảo ấy
  rationale: Đại từ giống cái số ít quy chiếu về đảo Cơ-rết trong ngữ cảnh trước. Nêu rõ 'đảo ấy' giúp câu tiếng Việt sáng nghĩa mà không đổi đối tượng quy chiếu.
- source_word: ἤλθομεν
  choice: đến
  rationale: Chuyển tải trực tiếp động từ chỉ chuyển động, phù hợp với đích đến được nêu tiếp theo.
- source_word: εἰς τόπον τινά
  choice: một nơi
  rationale: Giữ tính bất định của τινά; tiếng Việt không cần thêm 'nào đó' trong cấu trúc giới thiệu địa danh này.
- source_word: καλούμενον
  choice: gọi là
  rationale: Cách diễn đạt thông dụng để giới thiệu tên của một địa điểm.
- source_word: Καλοὺς Λιμένας
  choice: Bến Đẹp
  rationale: Dịch nghĩa địa danh Hy Lạp ('các bến/cảng đẹp, tốt') bằng một tên tiếng Việt ngắn gọn, dễ hiểu; hình thức số nhiều trong tên riêng không nhất thiết phải biểu đạt bằng dấu hiệu số nhiều trong tiếng Việt.
- source_word: ᾧ ἐγγὺς ἦν πόλις Λασαία
  choice: gần đó có thành La-sê-a
  rationale: Giữ quan hệ vị trí với địa điểm vừa nêu và phản ánh πόλις không có mạo từ; cấu trúc tồn tại 'có thành' tự nhiên trong tiếng Việt.
