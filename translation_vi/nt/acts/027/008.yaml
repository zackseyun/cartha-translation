  terminology: «Bến Cảng Đẹp» phản ánh Καλοὺς Λιμένας tốt hơn «Bến Đẹp», vì giữ được trường nghĩa cảng/bến đậu của địa danh. «La-sê-a» và «thành» phù hợp với Λασαία và πόλις.
