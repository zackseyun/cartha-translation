  text: And on the third day they threw the ship’s gear overboard with their own hands[a].
translation:
  language: vi
  text: Vào ngày thứ ba, họ đã tự tay ném trang thiết bị của tàu xuống biển.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “Vào ngày thứ ba, chính họ đã ném trang thiết bị của tàu đi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ τρίτῃ
  choice: Đến ngày thứ ba
  rationale: Cách nói thời gian bằng tặng cách với số thứ tự được diễn đạt tự nhiên trong tiếng Việt là “đến ngày thứ ba”, phù hợp với diễn tiến của câu chuyện.
- source_word: αὐτόχειρες
  choice: chính tay họ
  rationale: Giữ sắc thái nhấn mạnh rằng những người trên tàu đích thân thực hiện việc này, thay vì chỉ dùng đại từ phản thân ít mạnh hơn.
- source_word: τὴν σκευὴν τοῦ πλοίου
  choice: thiết bị của tàu
  rationale: Trong ngữ cảnh hàng hải, σκευή chỉ chung trang thiết bị hoặc vật dụng của con tàu. “Thiết bị của tàu” rõ nghĩa, hiện đại và không thu hẹp thành một loại dụng cụ cụ thể.
- source_word: ἔρριψαν
  choice: ném ... xuống biển
  rationale: Động từ có nghĩa là ném/quăng. “Xuống biển” làm rõ hướng hành động vốn hàm chứa trong bối cảnh con tàu gặp bão, đồng thời tự nhiên hơn trong tiếng Việt.
theological_decisions: []
