  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Cụm “chính tay họ” bảo tồn trọng âm của αὐτόχειρες; “thiết bị của tàu” tránh thuật ngữ hàng hải quá chuyên môn.
