- from: Nhưng những người lính định giết các tù nhân, để không ai bơi thoát được.
  to: Nhưng kế hoạch của những người lính là giết các tù nhân, để không ai bơi ra rồi trốn thoát được.
  rationale: Dùng “kế hoạch ... là” để phản ánh βουλὴ ἐγένετο, và “bơi ra rồi trốn thoát” để bảo toàn trình tự của phân từ ἐκκολυμβήσας với động từ διαφύγῃ. Giữ “Nhưng” như một cách khả dĩ để chuyển ý cho δέ, không áp đặt mức đối lập mạnh hơn văn cảnh cho phép.
