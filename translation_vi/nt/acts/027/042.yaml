review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp truyền đạt đúng ý chính: lính muốn giết tù nhân nhằm ngăn họ thoát bằng cách bơi. Tuy nhiên, βουλὴ ἐγένετο nói rõ một “kế hoạch/ý định đã được hình thành”, không chỉ đơn thuần là hành động dự tính; và ἐκκολυμβήσας διαφύγῃ gồm hai nét “bơi ra” rồi “trốn thoát”.'
  naturalness: Câu hiện có dễ hiểu, nhưng “để không ai bơi thoát được” hơi gộp và làm mờ chuỗi hành động trong nguyên văn. “để không ai bơi ra rồi trốn thoát” vẫn tự nhiên trong tiếng Việt hiện đại và minh bạch hơn.
  terminology: “Những người lính” và “các tù nhân” phù hợp ngữ cảnh và đăng ký văn phong. Không có thuật ngữ thần học hoặc tên riêng cần xử lý.
  issues:
