  yaml_path: translation/nt/acts/027/042.yaml
  text: The soldiers’ plan was to kill the prisoners, so that no one might swim away and escape.
translation:
  language: vi
  text: Nhưng kế hoạch của những người lính là giết các tù nhân, để không ai bơi ra rồi trốn thoát được.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βουλὴ ἐγένετο
  choice: định
  rationale: Diễn đạt tự nhiên ý ‘kế hoạch/ý định nảy sinh’ trong ngữ cảnh, với chủ thể là những người lính.
- source_word: τοὺς δεσμώτας
  choice: các tù nhân
  rationale: Chỉ những người đang bị giam giữ; ‘tù nhân’ là cách gọi hiện đại, rõ nghĩa.
- source_word: ἐκκολυμβήσας διαφύγῃ
  choice: bơi thoát được
  rationale: 'Gộp tự nhiên hai động tác liên hệ chặt chẽ: bơi ra khỏi nơi nguy hiểm rồi trốn thoát.'
theological_decisions:
- issue: Sắc thái của μή τις trong mệnh đề mục đích/ngăn ngừa
  choice: để không ai… được
  alternative: e rằng có người… trốn thoát
  rationale: Giữ mục đích ngăn không cho bất cứ tù nhân nào bơi thoát, phù hợp cấu trúc μή τις mà không bổ sung động cơ thần học.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. ‘Nhưng’ phản ánh liên từ δέ, nối ý tương phản/chuyển tiếp với diễn biến trước.
