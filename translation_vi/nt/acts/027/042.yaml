  - severity: low
    issue: “bơi thoát” gộp hai động từ ἐκκολυμβήσας διαφύγῃ.
    rationale: Nguyên văn nêu việc bơi ra trước, rồi thoát/trốn thoát; nên diễn đạt rõ hai bước để giữ sắc thái mà vẫn tự nhiên.
  revised_text: Nhưng kế hoạch của những người lính là giết các tù nhân, để không ai bơi ra rồi trốn thoát được.
