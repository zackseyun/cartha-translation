source:
  edition: SBLGNT
  text: λέγων αὐτοῖς· Ἄνδρες, θεωρῶ ὅτι μετὰ ὕβρεως καὶ πολλῆς ζημίας οὐ μόνον τοῦ φορτίου καὶ τοῦ πλοίου ἀλλὰ καὶ τῶν ψυχῶν ἡμῶν μέλλειν ἔσεσθαι τὸν πλοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/010.yaml
  text: saying to them[a], “Men, I perceive that the voyage is about to be with disaster and great loss, not only of the cargo and the ship[b], but also of our lives.”
translation:
  language: vi
  text: 'nói với họ: “Thưa các ông, tôi nhận thấy chuyến đi này sẽ gặp tai họa và thiệt hại nặng nề[a], không chỉ hàng hóa và con tàu, mà cả mạng sống của chúng ta[b] nữa.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “sẽ chịu tổn hại dữ dội và mất mát lớn.” Cụm từ Hy Lạp có thể nhấn mạnh sự khắc nghiệt đầy bạo lực hoặc những thiệt hại đi kèm chuyến đi.'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “linh hồn của chúng ta”; nhưng trong bối cảnh có nguy cơ đắm tàu và chết người, từ Hy Lạp ở đây có nghĩa là “mạng sống của chúng ta.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγων αὐτοῖς
  choice: nói với họ
  rationale: Giữ lối dẫn nhập bằng phân từ, nối tự nhiên với mạch kể của câu trước mà không thêm ý.
- source_word: Ἄνδρες
  choice: Thưa các ông
  rationale: Diễn đạt lời xưng hô trực tiếp với nhóm nam giới trên tàu; vừa giữ sắc thái giống đực của ἀνήρ, vừa tự nhiên và trang trọng trong tiếng Việt hiện đại.
- source_word: θεωρῶ
  choice: tôi nhận thấy
  rationale: Thể hiện sự nhận định dựa trên quan sát và suy xét, không giới hạn ở hành động nhìn bằng mắt.
- source_word: μετὰ ὕβρεως καὶ πολλῆς ζημίας
  choice: sẽ gặp tai họa và thiệt hại nặng nề
  rationale: Trong bối cảnh hàng hải, ὕβρις chỉ sự dữ dội gây tổn hại hoặc tai họa, không phải thái độ ngạo mạn; ζημία là thiệt hại hay mất mát. Cách diễn đạt này tự nhiên và giữ được mức độ nghiêm trọng.
- source_word: οὐ μόνον τοῦ φορτίου καὶ τοῦ πλοίου ἀλλὰ καὶ
  choice: không chỉ về hàng hóa và con tàu, mà cả
  rationale: Các sở hữu cách nêu những đối tượng chịu thiệt hại. “Hàng hóa” là cách gọi thông dụng của φορτίον trong bối cảnh vận tải đường biển.
- source_word: τῶν ψυχῶν ἡμῶν
  choice: mạng sống của chúng ta
  rationale: ψυχή ở đây chỉ sự sống thể chất đang bị đe dọa bởi đắm tàu và cái chết, chứ không nhấn mạnh phần phi vật chất của con người.
- source_word: μέλλειν ἔσεσθαι
  choice: sẽ gặp
  rationale: Truyền đạt điều được nhận định là sắp xảy đến. Tiếng Việt dùng “sẽ gặp” tự nhiên hơn một cấu trúc mô phỏng từng chữ như “sắp là với”.
- source_word: τὸν πλοῦν
  choice: chuyến đi này
  rationale: πλοῦς là chuyến hành trình bằng đường biển; trong ngữ cảnh hiện tại, “chuyến đi này” rõ nghĩa và tự nhiên.
