  text: Then all of them became encouraged and also took food[a][b].
translation:
  language: vi
  text: Bấy giờ, tất cả đều trở nên phấn chấn và họ cũng lấy thức ăn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Theo sát nguyên văn: “và chính họ cũng lấy thức ăn”; cụm này nhấn mạnh rằng những người khác cũng làm theo gương Phao-lô.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὔθυμοι
  choice: phấn chấn
  rationale: Diễn tả trạng thái tinh thần được nâng lên, lấy lại tinh thần trong hoàn cảnh nguy hiểm; tự nhiên hơn “vui vẻ” và không thu hẹp nghĩa thành sự can đảm.
- source_word: δὲ
  choice: Bấy giờ
  rationale: Ở đây δέ đánh dấu bước phát triển tiếp theo trong câu chuyện hơn là một sự tương phản mạnh.
- source_word: γενόμενοι
  choice: phấn chấn lên
  rationale: Phân từ aorist đi với εὔθυμοι diễn tả việc bước vào một trạng thái mới; “lên” thể hiện sự chuyển biến ấy tự nhiên trong tiếng Việt.
- source_word: πάντες
  choice: tất cả
  rationale: Chỉ toàn thể những người trên tàu một cách gọn và rõ.
- source_word: καὶ αὐτοὶ
  choice: chính họ cũng
  rationale: Giữ cả ý bổ sung của καί và sắc thái nhấn mạnh của αὐτοί, cho thấy những người khác làm theo gương Phao-lô.
- source_word: προσελάβοντο
  choice: dùng
  rationale: Trong kết hợp với τροφῆς, động từ nói đến việc nhận lấy hoặc dùng thức ăn; “dùng thức ăn” là cách diễn đạt trang trọng, tự nhiên và không diễn giải quá mức thành “ăn”.
- source_word: τροφῆς
  choice: thức ăn
  rationale: Chỉ đồ ăn để nuôi sống; “thức ăn” chính xác và phù hợp với văn phong hiện đại.
