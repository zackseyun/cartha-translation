base_translation:
  language: en
  yaml_path: translation/nt/acts/027/039.yaml
  text: When day came[a], they did not recognize the land, but they noticed a certain bay with a beach, into which they planned, if they could, to run the ship ashore.
translation:
  language: vi
  text: 'Khi trời sáng, họ không nhận ra vùng đất ấy, nhưng thấy một vịnh có bãi biển. Họ dự định, nếu có thể, đưa tàu mắc cạn trên bãi trong vịnh ấy[a].


    [a] Hay “đưa tàu lên bãi.” Động từ Hy Lạp chỉ việc đẩy hoặc thúc con tàu lên bờ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “đưa tàu lên bãi.” Động từ Hy Lạp chỉ việc đẩy hoặc thúc con tàu lên bờ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅτε δὲ ἡμέρα ἐγένετο
  choice: Khi trời sáng
  rationale: Diễn đạt tự nhiên sự xuất hiện của ánh sáng ban ngày; δέ chỉ là chuyển tiếp nhẹ trong mạch kể nên không cần thêm một từ nối nặng.
- source_word: τὴν γῆν οὐκ ἐπεγίνωσκον
  choice: họ không nhận ra vùng đất ấy
  rationale: ἐπιγινώσκω mang nghĩa nhận ra hoặc xác định được; “vùng đất ấy” giữ nghĩa rộng của γῆ và phù hợp với việc họ nhìn bờ nhưng không biết đó là nơi nào.
- source_word: κόλπον δέ τινα κατενόουν
  choice: nhưng thấy một vịnh
  rationale: κόλπος trong bối cảnh hàng hải là vịnh hoặc chỗ lõm vào của bờ biển; κατανοέω chỉ việc quan sát và nhận thấy. “Một vịnh” bảo toàn tính bất định của τινα mà vẫn tự nhiên trong tiếng Việt.
- source_word: ἔχοντα αἰγιαλὸν
  choice: có bãi biển
  rationale: αἰγιαλός chỉ bãi hoặc bờ biển. “Bãi biển” cụ thể, phù hợp bối cảnh và không thêm ý rằng bãi đó nhất thiết có cát.
- source_word: εἰς ὃν
  choice: ở đó
  rationale: Trong cấu trúc tiếng Việt, đặt “ở đó” sau hành động dự định diễn đạt tự nhiên đích đến là vịnh vừa nêu, dù không mô phỏng máy móc cấu trúc quan hệ của tiếng Hy Lạp.
- source_word: ἐβουλεύοντο εἰ δύναιντο
  choice: Họ định, nếu có thể
  rationale: βουλεύομαι ở đây nói đến dự tính hoặc chủ ý; εἰ với động từ ở lối khả năng giữ nguyên tính bất định bằng “nếu có thể”.
- source_word: ἐξῶσαι τὸ πλοῖον
  choice: cho tàu lao lên bờ
  rationale: ἐξωθέω gợi việc đẩy hoặc thúc tàu lên bờ. Cách nói này truyền đạt hành động có chủ ý làm tàu mắc vào bờ mà vẫn tự nhiên trong tiếng Việt; chú thích giữ phương án sát hình ảnh bãi biển hơn.
