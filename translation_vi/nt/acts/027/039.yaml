translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Câu Hy Lạp dài được tách thành hai câu tiếng Việt để rõ nghĩa; không thêm thuật ngữ hàng hải khó hiểu. Dấu chú thích được đặt ngay sau cụm từ mà chú thích giải thích.
