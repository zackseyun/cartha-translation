base_translation:
  language: en
  yaml_path: translation/nt/acts/027/038.yaml
  text: And when they had eaten enough[c][b][a], they began to lighten the ship by throwing the wheat into the sea.
translation:
  language: vi
  text: Sau khi đã ăn no[a], họ bắt đầu làm nhẹ[b] con tàu bằng cách ném lúa mì[c] xuống biển.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “sau khi đã ăn đủ” hoặc “sau khi đã được no đủ nhờ thức ăn.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “họ đang làm nhẹ con tàu” hoặc đơn giản là “họ làm nhẹ con tàu”; thì chưa hoàn thành trong tiếng Hy Lạp có thể nhấn mạnh tiến trình hoặc sự khởi đầu của hành động.'
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “ngũ cốc.” Từ Hy Lạp có thể mang nghĩa rộng hơn, nhưng ở đây nhiều khả năng chỉ lúa mì.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κορεσθέντες τροφῆς
  choice: sau khi đã ăn no
  rationale: Cụm phân từ aorist thụ động cùng sở hữu cách chỉ việc được ăn đến mức no đủ. Cách diễn đạt này tự nhiên trong tiếng Việt và giữ được quan hệ thời gian với hành động tiếp theo.
- source_word: δὲ
  choice: không dịch thành một từ nối riêng
  rationale: Ở đây δέ chỉ nhẹ nhàng chuyển tiếp câu chuyện; trong tiếng Việt, quan hệ tiếp nối đã được thể hiện tự nhiên bằng cấu trúc “Sau khi…”, nên thêm “và” hoặc “bấy giờ” sẽ nặng lời.
- source_word: ἐκούφιζον
  choice: họ bắt đầu làm nhẹ
  rationale: Thì chưa hoàn thành có thể nhấn mạnh tiến trình hoặc sự khởi đầu của hành động. “Bắt đầu làm nhẹ” phù hợp mạch kể và vẫn ghi nhận cách hiểu khác trong chú thích.
- source_word: τὸ πλοῖον
  choice: con tàu
  rationale: Trong bối cảnh chuyến hải hành, πλοῖον chỉ chiếc tàu đang chở mọi người và hàng hóa; “con tàu” là cách gọi tự nhiên, rõ nghĩa.
- source_word: ἐκβαλλόμενοι
  choice: bằng cách ném
  rationale: Phân từ hiện tại giải thích phương tiện họ dùng để làm nhẹ tàu. “Bằng cách ném” thể hiện rõ quan hệ phương tiện mà không thêm ý ngoài bản văn.
- source_word: τὸν σῖτον
  choice: lúa mì
  rationale: σῖτος có thể chỉ ngũ cốc nói chung nhưng thường có nghĩa cụ thể là lúa mì; trong bối cảnh chiếc tàu chở ngũ cốc từ Alexandria, “lúa mì” là lựa chọn thích hợp, đồng thời nghĩa rộng hơn được ghi ở chú thích.
- source_word: εἰς τὴν θάλασσαν
  choice: xuống biển
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt cho hướng chuyển động từ trên tàu vào biển, tương ứng trực tiếp với cụm Hy Lạp.
theological_decisions: []
translation_notes:
  register: 'Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Cấu trúc câu giữ rõ trình tự: ăn no, làm nhẹ tàu, rồi nêu cách thực hiện. Không thêm diễn giải thần học hay chi tiết không có trong nguồn.'
