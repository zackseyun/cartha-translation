review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp truyền đạt đúng các ý chính: tình trạng bị bão hành hạ dữ dội, mốc thời gian ngày kế tiếp, và việc quăng hàng hóa để giảm tải. Tuy nhiên, cấu trúc “Vì … nên” biến sở hữu cách độc lập mang tính hoàn cảnh/thời gian thành quan hệ nguyên nhân rõ rệt hơn nguyên văn. “Khi” giữ quan hệ này trung tính hơn. “Bắt đầu” là cách chuyển ngữ có thể chấp nhận theo mạch tự sự và phù hợp với bản audit tiếng Anh.'
