  rationale: Bản sửa giữ trọn nội dung hàng hải và sắc thái dữ dội của nguyên văn, nhưng thay liên hệ nhân quả diễn giải bằng mệnh đề hoàn cảnh trung tính hơn. Cũng điều chỉnh cách dùng từ cho tự nhiên trong tiếng Việt hiện đại và làm chú thích chính xác, gọn rõ hơn.
