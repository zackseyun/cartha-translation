  - severity: low
    issue: “Bị bão đánh dữ dội” chưa phải lối kết hợp tự nhiên nhất.
    rationale: “Bị bão quật dữ dội” diễn đạt tự nhiên hơn sức tàn phá của bão mà vẫn giữ sắc thái bị động của χειμαζομένων.
  - severity: low
