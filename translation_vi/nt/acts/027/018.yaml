  text: As we were being violently storm-tossed[a], on the next day they began to throw the cargo overboard.
translation:
  language: vi
  text: Khi chúng tôi bị bão quật dữ dội, ngày hôm sau họ bắt đầu quăng hàng hóa xuống biển.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn dùng một thuật ngữ hàng hải theo nghĩa “quăng bỏ hàng xuống biển.” Từ “hàng hóa” được hiểu theo ngữ cảnh; việc này nhằm làm tàu nhẹ hơn.
    reason: lexical_alternative
lexical_decisions:
- source_word: σφοδρῶς
  choice: dữ dội
  rationale: Trạng từ nhấn mạnh mức độ nghiêm trọng và sức mạnh của cơn bão; “dữ dội” tự nhiên và rõ nghĩa trong tiếng Việt.
- source_word: χειμαζομένων
  choice: bị bão đánh
  rationale: Giữ sắc thái bị động của phân từ và diễn đạt tự nhiên tình trạng con tàu cùng những người trên tàu đang chịu tác động mạnh của bão.
- source_word: ἡμῶν
  choice: chúng tôi
  rationale: Chuyển kết cấu sở hữu cách độc lập sang mệnh đề phụ tiếng Việt với chủ ngữ ngôi thứ nhất số nhiều.
- source_word: τῇ ἑξῆς
  choice: ngày hôm sau
  rationale: Thành ngữ chỉ thời gian, nghĩa là ngày kế tiếp.
- source_word: ἐκβολὴν
  choice: ném hàng hóa xuống biển
  rationale: Danh từ hàng hải chỉ việc quăng đồ, theo ngữ cảnh là hàng hóa, khỏi tàu để giảm tải; “hàng hóa” là đối tượng được hàm ý chứ không được nêu trực tiếp trong tiếng Hy Lạp.
- source_word: ἐποιοῦντο
  choice: bắt đầu ném
  rationale: Thì chưa hoàn thành diễn tả hành động đang diễn tiến; trong mạch kể, “bắt đầu” làm rõ sự khởi phát của hành động vào ngày hôm sau mà vẫn tự nhiên trong tiếng Việt.
