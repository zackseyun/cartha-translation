id: ACT.27.34
reference: Acts 27:34
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: διὸ παρακαλῶ ὑμᾶς ⸀μεταλαβεῖν τροφῆς, τοῦτο γὰρ πρὸς τῆς ὑμετέρας σωτηρίας ὑπάρχει· οὐδενὸς γὰρ ὑμῶν θρὶξ ⸀ἀπὸ τῆς κεφαλῆς ⸀ἀπολεῖται.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/034.yaml
  text: Therefore I urge you to take some food[a], for this is for your preservation; for not a hair from the head of any of you will perish.
translation:
  language: vi
  text: Vì vậy, tôi khuyên anh em hãy ăn chút gì đó, bởi điều này cần thiết để anh em được sống sót[a]; vì sẽ không một sợi tóc nào trên đầu của bất cứ ai trong anh em bị mất.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “vì điều này có ích cho sự cứu thoát của anh em.” Từ Hy Lạp ở đây có thể mang nghĩa “sự cứu rỗi”, “sự giải cứu” hoặc “sự bảo toàn”; trong ngữ cảnh này, từ ấy nói đến việc sống sót về thể xác.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: Vì vậy
  rationale: Diễn tả kết luận rút ra từ hoàn cảnh và lời khuyên ở phần trước, đồng thời tự nhiên trong tiếng Việt hiện đại.
- source_word: παρακαλῶ
  choice: tôi khuyên
  rationale: Trong ngữ cảnh, Phao-lô tha thiết thúc giục mọi người hành động; “khuyên” truyền đạt lời kêu gọi chân thành mà không quá nặng tính mệnh lệnh.
- source_word: μεταλαβεῖν τροφῆς
  choice: hãy ăn chút gì đó
  rationale: Cụm từ chỉ việc dùng thức ăn để lấy sức. Cách diễn đạt này tự nhiên, rõ ràng và giữ ý có một lượng thức ăn không xác định.
- source_word: τοῦτο γὰρ πρὸς τῆς ὑμετέρας σωτηρίας ὑπάρχει
  choice: bởi điều này cần thiết để anh em được sống sót
  rationale: Trong hiểm nguy trên biển, σωτηρία nói đến việc bảo toàn mạng sống. “Cần thiết để… được sống sót” chuyển tải rõ quan hệ lợi ích/mục đích của cả cụm.
- source_word: σωτηρίας
  choice: được sống sót
  rationale: Ngữ cảnh trực tiếp là sự sống còn về thể xác trong vụ đắm tàu; chú thích vẫn ghi nhận phạm vi nghĩa rộng hơn của từ Hy Lạp.
- source_word: οὐδενὸς γὰρ ὑμῶν
  choice: bất cứ ai trong anh em
  rationale: 'Giữ sắc thái phân phối: lời bảo đảm áp dụng cho từng người trong số họ.'
- source_word: θρὶξ ἀπὸ τῆς κεφαλῆς
  choice: một sợi tóc nào trên đầu
  rationale: Giữ hình ảnh thành ngữ về sự an toàn trọn vẹn và diễn đạt tự nhiên trong tiếng Việt.
- source_word: ἀπολεῖται
  choice: sẽ bị mất
  rationale: Động từ ở đây có nghĩa là bị mất hoặc hư mất; với chủ ngữ “một sợi tóc”, “bị mất” tự nhiên hơn “bị diệt” hay “hư mất”.
theological_decisions:
- issue: Nghĩa của σωτηρία trong ngữ cảnh
  choice: sự sống sót/bảo toàn mạng sống về thể xác
  alternative: sự cứu rỗi
  rationale: Bối cảnh tức thời là lời Phao-lô bảo đảm rằng những người trên tàu sẽ sống qua hiểm họa. Bản dịch chính nêu nghĩa phù hợp ngữ cảnh, còn chú thích bảo lưu nghĩa từ vựng “sự cứu rỗi/giải cứu” để không che khuất độ rộng ngữ nghĩa của nguyên ngữ.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “anh em” làm đại từ số nhiều theo lối diễn đạt Kinh Thánh quen thuộc; câu vẫn giữ lập luận nguyên nhân và lời bảo đảm mạnh mẽ của nguyên bản.
