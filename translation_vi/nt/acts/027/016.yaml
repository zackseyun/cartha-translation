  register: Văn phong tường thuật trang trọng, hiện đại và dễ hiểu. Dùng thuật ngữ hàng hải phổ thông, tránh cách nói quá kỹ thuật; giữ nguyên sắc thái khó khăn của μόλις và không thu hẹp περικρατεῖς γενέσθαι thành hành động buộc chặt đơn thuần.
