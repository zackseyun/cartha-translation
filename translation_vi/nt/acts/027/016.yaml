  yaml_path: translation/nt/acts/027/016.yaml
  text: But after running under the shelter of a small island called Cauda[a], we were barely able to secure the ship’s boat.
translation:
  language: vi
  text: Nhưng khi chạy vào phía khuất gió của một đảo nhỏ tên là Cau-đa,[a] chúng tôi chỉ vừa đủ sức để giữ được chiếc xuồng của tàu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “khi chạy men theo phía khuất gió của một đảo nhỏ tên là Cau-đa.” Nguyên văn dùng thuật ngữ hàng hải chỉ việc đi vào vùng được đảo che gió.'
    reason: lexical_alternative
lexical_decisions:
- source_word: νησίον ... τι
  choice: một đảo nhỏ
  rationale: νησίον là dạng giảm nhẹ, chỉ một đảo nhỏ; cách diễn đạt này tự nhiên và rõ nghĩa trong tiếng Việt hiện đại.
- source_word: δέ
  choice: Nhưng
  rationale: δέ đánh dấu một chuyển tiếp nhẹ, có sắc thái tương phản với hoàn cảnh bão tố trước đó.
- source_word: ὑποδραμόντες
  choice: khi chạy vào phía khuất gió của
  rationale: Trong ngữ cảnh hàng hải, động từ chỉ việc cho tàu chạy về phía được đảo che gió; cách dịch này truyền đạt rõ ý nghĩa chuyên biệt mà vẫn dễ hiểu.
- source_word: καλούμενον Καῦδα
  choice: tên là Cau-đa
  rationale: Diễn đạt tự nhiên mệnh đề phân từ dùng để nêu tên đảo; Cau-đa là dạng phiên âm tiếng Việt của địa danh Καῦδα.
- source_word: ἰσχύσαμεν μόλις
  choice: mới khó nhọc lắm
  rationale: Cụm từ nhấn mạnh rằng việc này chỉ có thể thực hiện được với rất nhiều khó khăn.
- source_word: περικρατεῖς γενέσθαι
  choice: kiểm soát được
  rationale: Cụm từ có nghĩa là làm chủ hoặc nắm được quyền kiểm soát; giữ được sắc thái rộng hơn việc chỉ buộc chặt chiếc xuồng.
- source_word: τῆς σκάφης
  choice: chiếc xuồng của tàu
  rationale: σκάφη chỉ chiếc thuyền nhỏ đi kèm tàu lớn, có lẽ đang được kéo theo; 'chiếc xuồng của tàu' rõ ràng và tự nhiên.
