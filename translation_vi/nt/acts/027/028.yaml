id: ACT.27.28
reference: Acts 27:28
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ βολίσαντες εὗρον ὀργυιὰς εἴκοσι, βραχὺ δὲ διαστήσαντες καὶ πάλιν βολίσαντες εὗρον ὀργυιὰς δεκαπέντε·
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/028.yaml
  text: And after taking soundings[a], they found twenty fathoms; then after going a little farther and taking soundings again, they found fifteen fathoms.
translation:
  language: vi
  text: Họ thả dây dò độ sâu[a] và đo được hai mươi sải; đi thêm một quãng ngắn, họ lại thả dây dò và đo được mười lăm sải.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nói sát nghĩa hơn: “thả chì dò”; người ta đo độ sâu của biển bằng một sợi dây có gắn vật nặng.'
    reason: lexical_alternative
lexical_decisions:
- source_word: βολίσαντες
  choice: thả dây dò độ sâu
  rationale: Động từ chỉ việc đo độ sâu của biển bằng cách thả dây có vật nặng; cách diễn đạt này rõ nghĩa với độc giả hiện đại và giữ được hành động hàng hải cụ thể.
- source_word: εὗρον
  choice: đo được
  rationale: Trong ngữ cảnh dò độ sâu, εὗρον thuật lại kết quả đo; “đo được” tự nhiên và chính xác hơn cách dịch từng chữ “thấy được”.
- source_word: ὀργυιὰς
  choice: sải
  rationale: ὀργυιά là đơn vị đo chiều dài khoảng 1,8 mét, tương đương fathom trong hàng hải; “sải” là từ tương ứng tự nhiên trong tiếng Việt.
- source_word: εἴκοσι
  choice: hai mươi
  rationale: Dịch trực tiếp số từ.
- source_word: βραχὺ διαστήσαντες
  choice: đi thêm một quãng ngắn
  rationale: Cụm từ diễn tả con tàu tiếp tục di chuyển một khoảng ngắn trước lần dò tiếp theo; bản dịch làm rõ chuyển động vốn được ngữ cảnh hàm ý.
- source_word: πάλιν
  choice: lại
  rationale: Diễn đạt tự nhiên sự lặp lại của hành động dò độ sâu.
- source_word: δεκαπέντε
  choice: mười lăm
  rationale: Dịch trực tiếp số từ.
- source_word: καὶ ... δὲ ... καὶ
  choice: Họ...; ... họ lại...
  rationale: Các liên từ chủ yếu nối tiếp diễn biến tường thuật, không mang sắc thái đối lập mạnh; dấu chấm phẩy và “lại” truyền đạt mạch tuần tự tự nhiên trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng thuật ngữ hàng hải rõ nghĩa “dây dò độ sâu”; giữ đơn vị cổ “sải” thay vì quy đổi ngay trong câu để bảo toàn màu sắc lịch sử.
