base_translation:
  language: en
  yaml_path: translation/nt/acts/027/025.yaml
  text: Therefore[a], take courage, men, for I believe God that it will be just as it has been told to me.
translation:
  language: vi
  text: Vì vậy, thưa các ông, hãy vững lòng, vì tôi tin Đức Chúa Trời[a] rằng sự việc sẽ xảy ra đúng như điều đã được nói với tôi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “tôi tin cậy nơi Đức Chúa Trời.” Cấu trúc Hy Lạp có thể nhấn mạnh việc tin cậy Đức Chúa Trời hoặc tin điều Ngài đã phán.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: Vì vậy
  rationale: Giữ rõ quan hệ suy luận với lời bảo đảm và khích lệ ngay trước đó.
- source_word: εὐθυμεῖτε
  choice: hãy vững lòng
  rationale: Diễn đạt tự nhiên lời kêu gọi giữ lòng can đảm và tin tưởng giữa cơn nguy hiểm.
- source_word: ἄνδρες
  choice: thưa các ông
  rationale: Giữ cách xưng hô trực tiếp với nhóm nam giới trên tàu, đồng thời phù hợp với lối nói tiếng Việt trang trọng.
- source_word: πιστεύω τῷ θεῷ
  choice: tôi tin Đức Chúa Trời
  rationale: Giữ cả đối tượng mang tính cá nhân lẫn ý tin điều Đức Chúa Trời đã phán; chú thích nêu sắc thái ‘tin cậy’ có thể có.
- source_word: ὅτι
  choice: rằng
  rationale: Dẫn vào nội dung điều Phao-lô tin, chứ không nêu nguyên nhân.
- source_word: οὕτως ἔσται καθ’ ὃν τρόπον
  choice: mọi việc sẽ diễn ra đúng như
  rationale: Truyền đạt rõ sự tương ứng chính xác giữa điều sắp xảy ra và sứ điệp đã được ban.
- source_word: λελάληταί μοι
  choice: lời đã phán với tôi
  rationale: ‘Phán’ phù hợp với lời đến từ Đức Chúa Trời trong văn cảnh; dạng hoàn thành cho thấy lời đã được phán vẫn có hiệu lực hiện tại.
theological_decisions:
- issue: Cách dịch πιστεύω τῷ θεῷ
  choice: tôi tin Đức Chúa Trời
  alternative: tôi tin cậy nơi Đức Chúa Trời
  rationale: Cấu trúc động từ với tặng cách có thể nhấn mạnh việc tin chính Đức Chúa Trời hoặc tin lời Ngài. Bản văn chính giữ cách diễn đạt ngắn gọn và không thu hẹp sắc thái; chú thích bảo tồn cách hiểu thiên về sự tin cậy.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. “Thưa các ông” giữ giới tính của lời xưng hô Hy Lạp; “hãy vững lòng” phù hợp với hoàn cảnh nguy hiểm trên biển. Dấu chú thích được đặt ngay sau cụm từ có sắc thái cần giải thích.
