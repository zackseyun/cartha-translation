    text: Cũng có thể dịch sát hơn là “rơi ra” hoặc “tuột khỏi tàu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Bấy giờ
  rationale: Đánh dấu hành động kế tiếp trong trình thuật bằng cách diễn đạt tự nhiên, trang trọng vừa phải.
- source_word: ἀπέκοψαν
  choice: cắt đứt
  rationale: Diễn đạt hành động cắt lìa các sợi dây; phù hợp trực tiếp với tân ngữ và ngữ cảnh hàng hải.
- source_word: οἱ στρατιῶται
  choice: quân lính
  rationale: Cách gọi tự nhiên trong tiếng Việt đối với những người lính có mặt trên tàu.
- source_word: τὰ σχοινία τῆς σκάφης
  choice: các dây buộc chiếc xuồng
  rationale: σχοινία là các dây thừng; quan hệ sở hữu trong tiếng Hy Lạp được diễn đạt rõ theo chức năng là những dây giữ chiếc xuồng gắn với tàu.
- source_word: σκάφη
  choice: chiếc xuồng
  rationale: Chỉ phương tiện nhỏ đi kèm con tàu lớn; “xuồng” phân biệt rõ với tàu chính và quen thuộc với độc giả Việt.
- source_word: εἴασαν αὐτὴν
  choice: để nó
  rationale: Giữ cấu trúc cho phép/để cho của ἐάω cùng đại từ chỉ lại chiếc xuồng.
- source_word: ἐκπεσεῖν
  choice: trôi đi
  rationale: Trong ngữ cảnh hàng hải, động từ có thể chỉ việc chiếc xuồng bị tách khỏi tàu rồi trôi ra xa; cách dịch này tự nhiên hơn nghĩa đen “rơi ra” trong tiếng Việt, đồng thời chú thích bảo lưu hình ảnh nghĩa đen.
