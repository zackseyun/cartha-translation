  yaml_path: translation/nt/acts/027/032.yaml
  text: Then the soldiers cut away the ropes of the skiff and let it fall off[a][b].
translation:
  language: vi
  text: Bấy giờ, quân lính cắt đứt các dây buộc chiếc xuồng[a] và để nó trôi đi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “thuyền nhỏ” hoặc “xuồng của tàu”; từ Hy Lạp skaphē chỉ chiếc thuyền nhỏ đi kèm con tàu lớn.
    reason: lexical_alternative
