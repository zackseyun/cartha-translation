base_translation:
  language: en
  yaml_path: translation/nt/acts/027/041.yaml
  text: But falling into a place where two seas met[a], they ran the ship aground; and the bow, having stuck fast, remained immovable, but the stern was being broken up by the force.
translation:
  language: vi
  text: Nhưng khi họ gặp phải một nơi hai biển gặp nhau[a], họ cho tàu mắc cạn. Mũi tàu cắm chặt, không lay chuyển, còn đuôi tàu bị sức mạnh làm vỡ dần.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “một nơi nằm giữa hai biển.” Cụm từ Hy Lạp này hiếm gặp và có thể chỉ một luồng nước, một bãi cạn, hoặc nơi hai vùng nước hay hai dòng nước gặp nhau.'
    reason: lexical_alternative
lexical_decisions:
- source_word: περιπεσόντες
  choice: khi gặp phải
  rationale: Diễn tả việc con tàu bất ngờ rơi vào một hoàn cảnh bất lợi, tự nhiên hơn lối dịch sát chữ “rơi vào” trong tiếng Việt.
- source_word: τόπον διθάλασσον
  choice: một nơi hai biển gặp nhau
  rationale: Giữ hình ảnh hiếm và chưa hoàn toàn xác định của từ διθάλασσος, không thu hẹp nghĩa thành bãi cát hay eo nước.
- source_word: ἐπέκειλαν τὴν ναῦν
  choice: họ làm cho tàu mắc cạn
  rationale: Chuyển đạt thuật ngữ hàng hải ἐπικέλλω, chỉ việc đưa tàu vào chỗ mắc cạn.
- source_word: πρῷρα … ἐρείσασα ἔμεινεν ἀσάλευτος
  choice: Mũi tàu cắm chặt, không lay chuyển
  rationale: Diễn đạt trạng thái mũi tàu ghim chắc và đứng yên sau khi mắc cạn, vừa chính xác vừa tự nhiên.
- source_word: πρύμνα ἐλύετο
  choice: đuôi tàu bị … làm vỡ dần
  rationale: Thể chưa hoàn thành và thể bị động mô tả quá trình phần đuôi tàu liên tục tan vỡ, không phải một biến cố tức thời.
- source_word: ὑπὸ τῆς βίας
  choice: bị sức nước làm
  rationale: βία chỉ sức mạnh hoặc sức dữ dội; “nước” được bổ sung từ bối cảnh hàng hải để câu tiếng Việt rõ nghĩa, nhưng không xác định hẹp hơn là sóng.
