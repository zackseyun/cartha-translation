source:
  edition: SBLGNT
  text: λέγων· Μὴ φοβοῦ, Παῦλε· Καίσαρί σε δεῖ παραστῆναι, καὶ ἰδοὺ κεχάρισταί σοι ὁ θεὸς πάντας τοὺς πλέοντας μετὰ σοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/024.yaml
  text: saying, ‘Do not be afraid, Paul. You must stand before Caesar, and look, God has granted to you all those sailing with you.’
translation:
  language: vi
  text: 'nói: “Phao-lô, đừng sợ! Anh phải ra hầu trước Sê-sa. Kìa, Đức Chúa Trời đã ban cho anh tất cả những người cùng đi tàu với anh.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δεῖ
  choice: phải
  rationale: Diễn đạt sự tất yếu trong chương trình của Đức Chúa Trời mà không giải thích quá mức nguồn gốc hay tính chất của sự tất yếu ấy.
- source_word: παραστῆναι
  choice: ra hầu trước
  rationale: Trong ngữ cảnh phải xuất hiện trước hoàng đế để được xét xử, cách nói này tự nhiên và chính xác hơn nghĩa chung là “đứng trước”.
- source_word: Καίσαρί
  choice: Sê-sa
  rationale: Giữ tước hiệu/tên gọi truyền thống trong Kinh Thánh tiếng Việt cho hoàng đế La Mã.
- source_word: ἰδοὺ
  choice: Kìa
  rationale: Giữ từ gây chú ý của nguyên văn, với sắc thái trang trọng nhưng vẫn dễ hiểu.
- source_word: κεχάρισταί σοι
  choice: đã ban cho anh
  rationale: Thể hoàn thành nhấn mạnh ân huệ đã được Đức Chúa Trời ban và hiện vẫn có hiệu lực; “ban cho” giữ sắc thái ân huệ mà không thêm diễn giải.
- source_word: πάντας τοὺς πλέοντας μετὰ σοῦ
  choice: tất cả những người cùng đi tàu với anh
  rationale: Thể hiện đầy đủ phạm vi “tất cả” và hành động đang cùng Phao-lô đi biển.
theological_decisions:
- issue: Ý nghĩa của việc Đức Chúa Trời “ban” những người đi tàu cho Phao-lô
  choice: Giữ nguyên cách nói “đã ban cho anh”
  alternative: “đã cho tất cả những người đi tàu với anh được sống”
  rationale: Nguyên văn không nói trực tiếp “được sống” trong câu này, dù ngữ cảnh hàm ý họ sẽ được cứu khỏi tai nạn. Giữ lối nói của bản Hy Lạp bảo toàn sắc thái ân huệ và tránh diễn giải ngầm thành nội dung câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh” khi thiên sứ trực tiếp nói với Phao-lô, phù hợp lời nói tự nhiên trong tiếng Việt mà không thêm tước vị. Dấu chấm than sau lời “đừng sợ” truyền tải lực của mệnh lệnh khích lệ.
