    rationale: “Khi đã sang đêm thứ mười bốn” không diễn đạt rõ ràng bằng tiếng Việt rằng đêm thứ mười bốn đã đến (ἐγένετο). Đổi thành “Khi đêm thứ mười bốn đã đến” giữ nguyên nghĩa và tự nhiên hơn.
