base_translation:
  language: en
  yaml_path: translation/nt/acts/027/027.yaml
  text: When the fourteenth night had come[a], as we were being driven along in the Adriatic Sea[b], about midnight the sailors began to suspect that some land was drawing near to them.
translation:
  language: vi
  text: Khi đêm thứ mười bốn đã đến, trong lúc chúng tôi đang bị cuốn đi trên vùng biển A-đri-a[a], vào khoảng nửa đêm, các thủy thủ bắt đầu ngờ rằng một vùng đất nào đó đang đến gần họ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tên gọi cổ “A-đri-a” có thể chỉ một vùng biển rộng hơn ở khu vực trung tâm Địa Trung Hải, chứ không chỉ biển Adriatic ngày nay.
    reason: cultural_note
  - marker: b
    text: 'Theo cách nói tự nhiên hơn: “họ đang đến gần một vùng đất nào đó.” Nguyên văn diễn đạt rằng vùng đất ấy đang đến gần họ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τεσσαρεσκαιδεκάτη νὺξ ἐγένετο
  choice: Khi đã sang đêm thứ mười bốn
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt cho biết đêm thứ mười bốn của hành trình trong bão đã đến, đồng thời giữ quan hệ thời gian của mệnh đề Hy Lạp.
- source_word: διαφερομένων ἡμῶν
  choice: chúng tôi vẫn bị cuốn đi
  rationale: Phân từ hiện tại bị động diễn tả chuyển động đang tiếp diễn và ngoài sự kiểm soát; “vẫn” làm rõ tính liên tục trong bối cảnh con tàu bị bão cuốn.
- source_word: ἐν τῷ Ἀδρίᾳ
  choice: trên biển A-đri-a
  rationale: Giữ tên gọi địa lý cổ, đồng thời dùng “biển” để người đọc hiện đại dễ hiểu; chú thích giải thích phạm vi cổ rộng hơn biển Adriatic ngày nay.
- source_word: κατὰ μέσον τῆς νυκτός
  choice: vào khoảng nửa đêm
  rationale: Giữ sắc thái xấp xỉ của κατά và diễn đạt tự nhiên trong tiếng Việt.
- source_word: ὑπενόουν
  choice: bắt đầu ngờ rằng
  rationale: “Ngờ” giữ tính phỏng đoán chưa chắc chắn; “bắt đầu” phản ánh sắc thái khởi đầu có thể có của thì chưa hoàn thành.
- source_word: οἱ ναῦται
  choice: các thủy thủ
  rationale: Tương đương hiện đại, rõ nghĩa và phù hợp bối cảnh hàng hải.
- source_word: προσάγειν τινὰ αὐτοῖς χώραν
  choice: một vùng đất nào đó đang đến gần họ
  rationale: Giữ góc nhìn và cấu trúc khác thường của câu Hy Lạp, trong đó “một vùng đất nào đó” là chủ thể đang đến gần; “nào đó” bảo toàn tính bất định của τινά.
