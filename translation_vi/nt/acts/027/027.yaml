  to: Khi đêm thứ mười bốn đã đến, trong lúc chúng tôi đang bị cuốn đi trên vùng biển A-đri-a[a], vào khoảng nửa đêm, các thủy thủ bắt đầu ngờ rằng một vùng đất nào đó đang đến gần họ[b].
