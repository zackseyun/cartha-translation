  source_fidelity: 'Bản dịch truyền đạt đúng các thành tố chính của câu Hy Lạp: đêm thứ mười bốn đã đến, nhóm của người kể bị cuốn đi, phạm vi địa lý Adria, thời điểm khoảng nửa đêm, sự phỏng đoán đang manh nha của các thủy thủ, và một vùng đất không xác định. Cấu trúc khác thường với vùng đất là bên “đến gần” cũng được giữ lại hợp lý và được giải thích bằng chú thích.'
  naturalness: Cụm “Khi đã sang đêm thứ mười bốn” chưa tự nhiên trong tiếng Việt hiện đại, vì cách nói này thường gợi việc người nói/chủ thể “sang đêm” hơn là thời điểm đêm ấy đã đến. “Khi đêm thứ mười bốn đã đến” rõ ràng và tự nhiên hơn. “Trên vùng biển A-đri-a” cũng phù hợp hơn với phạm vi địa lý cổ được chú thích.
  terminology: “Các thủy thủ,” “bị cuốn đi,” “vùng biển A-đri-a,” và “một vùng đất nào đó” đều thích hợp. Chú thích a cần tiếp tục phân biệt tên gọi cổ với biển Adriatic theo nghĩa địa lý hiện đại. Chú thích b giải thích đúng sự đảo góc nhìn trong nguyên văn.
  issues:
