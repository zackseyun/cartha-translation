  text: συναρπασθέντος δὲ τοῦ πλοίου καὶ μὴ δυναμένου ἀντοφθαλμεῖν τῷ ἀνέμῳ ἐπιδόντες ἐφερόμεθα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/015.yaml
  text: And when the ship was caught and could not face the wind[a], we gave way and were driven along.
translation:
  language: vi
  text: Con tàu bị cuốn đi và không thể đương đầu với gió, nên chúng tôi đành để mặc cho nó trôi dạt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συναρπασθέντος
  choice: bị cuốn đi
  rationale: Diễn tả con tàu bất ngờ bị một sức mạnh bên ngoài khống chế; trong ngữ cảnh này là gió bão. Cách dịch này tự nhiên trong tiếng Việt và giữ thể bị động.
- source_word: πλοίου
  choice: con tàu
  rationale: Từ tương đương tự nhiên, rõ ràng trong văn cảnh hàng hải.
- source_word: μὴ δυναμένου
  choice: không thể
  rationale: Chuyển cấu trúc phân từ chỉ sự bất lực thành động từ hữu hạn để câu tiếng Việt tự nhiên mà không đổi nghĩa.
- source_word: ἀντοφθαλμεῖν
  choice: đương đầu với
  rationale: Động từ gợi nghĩa đối mặt hoặc chống lại; ở đây nói về việc tàu không thể giữ hướng đối diện với gió. “Đương đầu với gió” vừa dễ hiểu vừa giữ hình ảnh của nguyên văn.
- source_word: ἀνέμῳ
  choice: gió
  rationale: Dịch đúng nghĩa thông thường của danh từ; không thêm mức độ “gió bão” vốn do văn cảnh cung cấp.
- source_word: ἐπιδόντες
  choice: đành để mặc
  rationale: Trong ngữ cảnh hàng hải, từ này diễn tả việc thôi chống cự và phó con tàu cho sức gió. “Đành” làm rõ phản ứng bất đắc dĩ mà không thêm một chủ thể thần học.
- source_word: ἐφερόμεθα
  choice: cho nó trôi dạt
  rationale: Thể bị động chưa hoàn thành diễn tả chuyển động tiếp diễn dưới tác động bên ngoài. Tiếng Việt tự nhiên gộp ý này với “để mặc”, còn “trôi dạt” thể hiện việc tàu bị gió đưa đi mà không kiểm soát được hướng.
- source_word: δέ
  choice: và
  rationale: Liên từ nối tiếp diễn biến; trong tiếng Việt, quan hệ nối tiếp đã được thể hiện tự nhiên trong mạch câu và bằng “và” giữa hai mệnh đề đầu.
