  source_fidelity: 'Bản dịch truyền đạt đúng chuỗi ý của nguyên văn: con tàu bị một lực bên ngoài cuốn đi, không thể đối đầu/hướng vào gió, thủy thủ thôi chống cự, và tàu tiếp tục trôi theo sức gió. “Đành để mặc cho nó trôi dạt” diễn đạt gộp tự nhiên hai động tác ἐπιδόντες và ἐφερόμεθα mà không thêm chi tiết lịch sử hoặc thần học.'
