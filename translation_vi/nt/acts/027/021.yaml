source:
  edition: SBLGNT
  text: Πολλῆς ⸀τε ἀσιτίας ὑπαρχούσης τότε σταθεὶς ὁ Παῦλος ἐν μέσῳ αὐτῶν εἶπεν· Ἔδει μέν, ὦ ἄνδρες, πειθαρχήσαντάς μοι μὴ ἀνάγεσθαι ἀπὸ τῆς Κρήτης κερδῆσαί τε τὴν ὕβριν ταύτην καὶ τὴν ζημίαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/021.yaml
  text: Since they had gone a long time without food, then Paul stood up among them and said, “Men, you should have listened to me and not set sail from Crete, and so have avoided this damage and loss.”
translation:
  language: vi
  text: 'Sau một thời gian dài không ăn uống[a], Phao-lô đứng dậy giữa họ và nói: “Thưa các ông, lẽ ra các ông nên nghe lời tôi[b], không ra khơi từ Cơ-rết, thì đã tránh được tổn hại này và mất mát.”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Sau một thời gian dài kiêng ăn.” Từ Hy Lạp ἀσιτία có thể chỉ tình trạng thiếu thức ăn hoặc việc nhịn ăn; trong bối cảnh cơn bão này, nghĩa lâu ngày không ăn uống có vẻ thích hợp hơn.'
    reason: lexical_alternative
  - marker: b
    text: “Nghe lời tôi” cũng có thể dịch là “vâng lời tôi”; động từ Hy Lạp có thể nói đến việc vâng theo một chỉ dẫn hoặc thẩm quyền, nhưng ở đây chỉ việc nghe theo lời khuyên của Phao-lô.
    reason: lexical_alternative
  - marker: c
    text: Cặp từ “tổn hại này và mất mát” có thể phân biệt sự tổn hại phải chịu với những mất mát vật chất.
    reason: cultural_note
lexical_decisions:
- source_word: Πολλῆς τε ἀσιτίας ὑπαρχούσης
  choice: Sau một thời gian dài không ăn uống
  rationale: Cụm sở hữu cách tuyệt đối nêu hoàn cảnh trước lời nói của Phao-lô. ἀσιτία có thể chỉ thiếu thức ăn hoặc kiêng ăn; trong bối cảnh bão biển, cách hiểu tự nhiên hơn là lâu ngày không ăn uống.
- source_word: σταθεὶς ὁ Παῦλος ἐν μέσῳ αὐτῶν
  choice: Phao-lô đứng giữa họ
  rationale: Diễn đạt tự nhiên hành động Phao-lô đứng lên hoặc đứng vào giữa nhóm để công khai nói với mọi người; tiếng Việt không nhất thiết phải thêm “dậy”.
- source_word: Ἔδει μέν, ὦ ἄνδρες
  choice: Thưa các ông, lẽ ra các ông nên
  rationale: ἔδει diễn tả điều đáng lẽ phải làm trong quá khứ. “Thưa các ông” vừa giữ đối tượng nam giới của ἄνδρες vừa phù hợp lối xưng hô trang trọng hiện đại.
- source_word: πειθαρχήσαντάς μοι
  choice: nghe lời tôi
  rationale: πειθαρχέω có thể mang nghĩa vâng phục hoặc nghe theo. Trong ngữ cảnh lời khuyên hàng hải của Phao-lô, “nghe lời tôi” giữ được sức nặng của việc làm theo lời chỉ dẫn mà không hàm ý quá mức về thẩm quyền chính thức.
- source_word: μὴ ἀνάγεσθαι ἀπὸ τῆς Κρήτης
  choice: không rời đảo Cơ-rết ra khơi
  rationale: ἀνάγω trong ngữ cảnh hàng hải có nghĩa là ra khơi. Cách dịch này nêu rõ cả việc rời Cơ-rết và hành động đi biển.
- source_word: κερδῆσαί τε
  choice: thì đã tránh được
  rationale: κερδαίνω theo nghĩa đen là đạt được hoặc thu lợi, nhưng trong cấu trúc này mang ý không phải gánh chịu hậu quả; “tránh được” là cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: τὴν ὕβριν ταύτην καὶ τὴν ζημίαν
  choice: sự tổn hại và thiệt hại này
  rationale: ὕβρις ở đây có thể chỉ sự hành hạ, tổn hại do hoàn cảnh khắc nghiệt, còn ζημία là mất mát hoặc thiệt hại. Giữ hai danh từ riêng để không xóa bỏ sự phân biệt có thể có trong nguyên văn.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Thưa các ông” thay cho cách gọi cứng “Hỡi những người đàn ông”; dùng “Cơ-rết” theo dạng tên riêng Kinh Thánh quen thuộc. Các dấu chú thích được đặt ngay sau cụm từ liên quan.
