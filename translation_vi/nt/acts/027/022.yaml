  text: καὶ τὰ νῦν παραινῶ ὑμᾶς εὐθυμεῖν, ἀποβολὴ γὰρ ψυχῆς οὐδεμία ἔσται ἐξ ὑμῶν πλὴν τοῦ πλοίου·
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/022.yaml
  text: And now I urge you to take courage[a], for there will be no loss of life among you[b], except for the ship.
translation:
  language: vi
  text: Bây giờ, tôi khuyên anh em hãy vững lòng[a], vì không một ai trong anh em sẽ mất mạng[b]; chỉ con tàu sẽ bị mất.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “hãy can đảm” hoặc “hãy giữ vững tinh thần.”'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn Hy Lạp: “sẽ không có sự mất mát nào về mạng sống”; từ ψυχή ở đây chỉ mạng sống thể chất, không chuyên biệt có nghĩa là linh hồn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ νῦν
  choice: Bây giờ
  rationale: Diễn đạt tự nhiên thành ngữ thời gian, mở đầu lời khuyên hiện tại của Phao-lô.
- source_word: παραινῶ
  choice: tôi khuyên
  rationale: Truyền đạt lời khuyên nhủ tha thiết và có trọng lượng, không quá nặng như một mệnh lệnh.
- source_word: εὐθυμεῖν
  choice: hãy vững lòng
  rationale: Diễn đạt trạng thái giữ tinh thần và lòng can đảm giữa cơn nguy hiểm; tự nhiên, trang trọng vừa phải trong tiếng Việt hiện đại.
- source_word: ἀποβολὴ ψυχῆς
  choice: mất mạng
  rationale: Trong ngữ cảnh này, ψυχή chỉ sự sống thể chất; cụm tiếng Việt diễn đạt rõ việc không ai thiệt mạng mà không đưa vào sự phân biệt linh hồn–thân thể.
- source_word: οὐδεμία ἔσται ἐξ ὑμῶν
  choice: không một ai trong anh em sẽ mất mạng
  rationale: Chuyển cấu trúc danh từ Hy Lạp sang câu tiếng Việt tự nhiên, đồng thời giữ tính phủ định dứt khoát và phạm vi 'trong anh em'.
- source_word: πλὴν τοῦ πλοίου
  choice: chỉ có con tàu bị mất mà thôi
  rationale: 'Làm rõ ngoại lệ: con tàu sẽ bị tổn thất, trái với những người trên tàu; ''mà thôi'' giữ sức nhấn của sự tương phản.'
theological_decisions:
- issue: Ý nghĩa của ψυχή
  choice: mạng/sự sống thể chất
  alternative: linh hồn
  rationale: Ngữ cảnh nói về việc sống sót sau tai nạn trên biển, nên ψυχή ở đây chỉ mạng sống, không chuyên biệt nói đến linh hồn phi vật chất.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh em” theo lối xưng hô với một nhóm người trong diễn ngôn Kinh Thánh; “vững lòng” phù hợp với lời động viên giữa cơn bão. Tất cả dấu chú thích đều xuất hiện trong chính văn.
