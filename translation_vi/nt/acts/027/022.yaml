    issue: Cấu trúc ngoại lệ với “con tàu”
    rationale: 'Nguyên ngữ dùng πλήν để đặt con tàu làm ngoại lệ đối với sự không-mất-mát. Tiếng Việt sẽ tự nhiên và rõ nghĩa hơn nếu diễn đạt kết quả đối lập bằng một mệnh đề riêng: mọi người sống sót, còn tàu bị mất.'
  - severity: low
    issue: Câu chữ chú thích b chưa tự nhiên
    rationale: Cụm “không chuyên biệt chỉ linh hồn” thiếu từ nối và có thể sửa thành “không chuyên biệt có nghĩa là linh hồn” mà không thay đổi nội dung chú thích.
  revised_text: Bây giờ, tôi khuyên anh em hãy vững lòng[a], vì không một ai trong anh em sẽ mất mạng[b]; chỉ con tàu sẽ bị mất.
