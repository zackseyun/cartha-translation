source:
  edition: SBLGNT
  text: εἶπεν ὁ Παῦλος τῷ ἑκατοντάρχῃ καὶ τοῖς στρατιώταις· Ἐὰν μὴ οὗτοι μείνωσιν ἐν τῷ πλοίῳ, ὑμεῖς σωθῆναι οὐ δύνασθε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/031.yaml
  text: Paul said to the centurion and the soldiers[a], “Unless these men remain in the ship, you cannot be saved.”
translation:
  language: vi
  text: 'Phao-lô nói với viên bách phu trưởng và các binh sĩ: “Nếu những người này không ở lại trên tàu, các ông không thể được cứu[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “thoát nạn” hoặc “sống sót.” Động từ Hy Lạp có nghĩa là “được cứu”; trong ngữ cảnh này, nó nói đến việc thoát khỏi nguy hiểm về thể chất.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑκατοντάρχῃ
  choice: viên đội trưởng
  rationale: Chỉ cấp chỉ huy quân đội La Mã thường được gọi là đội trưởng; cách diễn đạt này tự nhiên và quen thuộc trong tiếng Việt Kinh Thánh.
- source_word: οὗτοι
  choice: những người này
  rationale: Đại từ chỉ định nói đến các thủy thủ đang tìm cách rời tàu; bản dịch giữ cách chỉ định của nguyên văn mà vẫn rõ nghĩa trong tiếng Việt.
- source_word: μείνωσιν
  choice: ở lại
  rationale: 'Diễn đạt tự nhiên nghĩa của μένω trong điều kiện này: tiếp tục ở trên tàu, không rời đi.'
- source_word: πλοίῳ
  choice: tàu
  rationale: πλοῖον ở đây là chiếc tàu biển lớn trong hành trình; “tàu” là từ hiện đại, chính xác và tự nhiên.
- source_word: σωθῆναι
  choice: được cứu
  rationale: Giữ động từ rộng nghĩa của nguyên văn; ngữ cảnh cho thấy đây là được cứu khỏi hiểm nguy và sống sót, không nhất thiết mang nghĩa cứu rỗi đời đời.
- source_word: οὐ δύνασθε
  choice: không thể
  rationale: Chuyển trực tiếp và tự nhiên cấu trúc phủ định khả năng trong tiếng Hy Lạp.
theological_decisions:
- issue: σωθῆναι nói đến sự cứu thoát thể chất hay sự cứu rỗi theo nghĩa thần học.
  choice: được cứu
  alternative: thoát nạn; sống sót
  rationale: Ngữ cảnh bão tố và đắm tàu xác định sự cứu này là bảo toàn mạng sống. Tuy nhiên, “được cứu” giữ được độ rộng từ vựng của σῴζω và không thu hẹp nguyên văn quá mức.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “anh em” cho đại từ số nhiều ὑμεῖς vì Phao-lô trực tiếp nói với viên đội trưởng và các binh sĩ; cách xưng hô này tự nhiên, tôn trọng và không làm mất số nhiều.
