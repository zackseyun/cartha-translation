id: ACT.27.20
reference: Acts 27:20
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: μήτε δὲ ἡλίου μήτε ἄστρων ἐπιφαινόντων ἐπὶ πλείονας ἡμέρας, χειμῶνός τε οὐκ ὀλίγου ἐπικειμένου, λοιπὸν περιῃρεῖτο ⸂ἐλπὶς πᾶσα⸃ τοῦ σῴζεσθαι ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/020.yaml
  text: And when neither sun nor stars appeared for many days[a], and no small storm was pressing on us, from then on all hope of our being saved was gradually taken away.
translation:
  language: vi
  text: Suốt nhiều ngày, không thấy mặt trời hay các ngôi sao xuất hiện, trong khi một cơn bão dữ dội cứ đè nặng trên chúng tôi; từ đó trở đi, mọi hy vọng rằng chúng tôi sẽ được cứu dần dần bị tước mất.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “được giải cứu”. Động từ Hy Lạp có thể mang nghĩa “cứu” hoặc “giải cứu”; tại đây nói đến việc thoát khỏi cơn bão và cái chết trên biển.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιφαινόντων
  choice: xuất hiện
  rationale: Diễn tả mặt trời và các ngôi sao hiện ra hoặc trở nên nhìn thấy được; cách dịch này tự nhiên và phù hợp với bối cảnh hàng hải.
- source_word: ἐπὶ πλείονας ἡμέρας
  choice: suốt nhiều ngày
  rationale: Diễn đạt tự nhiên một khoảng thời gian kéo dài qua nhiều ngày.
- source_word: χειμῶνός
  choice: một cơn bão dữ dội
  rationale: Trong bối cảnh trên biển, từ này chỉ thời tiết giông bão; kết hợp với οὐκ ὀλίγου, cách dịch này truyền đạt rõ lối nói giảm nhấn mạnh của nguyên văn.
- source_word: οὐκ ὀλίγου
  choice: dữ dội
  rationale: Nguyên văn là lối nói giảm 'không nhỏ'; tiếng Việt tự nhiên hơn khi diễn đạt trực tiếp mức độ nghiêm trọng, dù không giữ nguyên hình thức tu từ.
- source_word: ἐπικειμένου
  choice: cứ đè nặng trên chúng tôi
  rationale: Thể hiện sức ép dai dẳng của cơn bão đang phủ lên và uy hiếp đoàn người.
- source_word: λοιπὸν
  choice: từ đó
  rationale: Đánh dấu giai đoạn tiếp theo phát sinh từ hoàn cảnh vừa nêu.
- source_word: περιῃρεῖτο
  choice: dần dần tan biến
  rationale: Thì chưa hoàn thành bị động diễn tả một tiến trình liên tục; cách nói này tự nhiên trong tiếng Việt và giữ ý hy vọng bị tước mất từng bước.
- source_word: ἐλπὶς πᾶσα
  choice: mọi hy vọng
  rationale: Giữ sắc thái toàn thể của cụm từ Hy Lạp.
- source_word: τοῦ σῴζεσθαι ἡμᾶς
  choice: chúng tôi được cứu
  rationale: Diễn đạt nội dung của niềm hy vọng và giữ phạm vi nghĩa của σῴζω, trong khi ngữ cảnh cho thấy đây là sự giải cứu khỏi hiểm họa trên biển.
theological_decisions:
- issue: Nghĩa của σῴζεσθαι trong trình thuật hàng hải
  choice: được cứu
  alternative: được giải cứu; thoát nạn
  rationale: Ngữ cảnh nói về sống sót qua bão và đắm tàu, không phải trực tiếp về sự cứu rỗi thuộc linh. 'Được cứu' giữ tính liên tục từ vựng và chú thích làm rõ nghĩa vật lý.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “cứ đè nặng” và “dần dần tan biến” để tái hiện tính kéo dài của hai dạng động từ Hy Lạp; chuyển lối nói giảm “không nhỏ” thành “dữ dội” cho tự nhiên.
