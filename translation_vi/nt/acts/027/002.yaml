    issue: “một chiếc tàu từ A-đra-mít” dễ hàm ý điểm khởi hành
    rationale: πλοίῳ Ἀδραμυττηνῷ là cách nhận diện chiếc tàu bằng tính từ địa danh; câu Hy Lạp không nói tàu vừa xuất phát từ A-đra-mít. “Một chiếc tàu thuộc A-đra-mít” tránh thêm thông tin này.
  - severity: low
    issue: “nhổ neo” cụ thể hóa động tác không được nêu
    rationale: ἀνήχθημεν là thành ngữ hàng hải chỉ việc ra khơi/khởi hành. Không nhất thiết có thông tin về việc nhổ neo.
