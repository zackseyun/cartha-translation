  terminology: Các tên riêng phiên âm và các cách gọi “tỉnh A-si-a,” “người Ma-xê-đô-ni-a,” “quê ở Tê-sa-lô-ni-ca” nhất quán, dễ hiểu. Chú thích về tỉnh A-si-a của La Mã là hữu ích. Khả năng hiểu “các nơi” theo ngữ cảnh là các cảng nên được giữ ở chú thích, không đưa vào thân bài.
  issues:
