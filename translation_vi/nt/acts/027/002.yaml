revisions:
- from: Chúng tôi lên một chiếc tàu từ A-đra-mít, sắp đi đến các nơi dọc theo tỉnh A-si-a[a], rồi nhổ neo ra khơi. Cùng đi với chúng tôi có A-ri-ta-cơ, một người Ma-xê-đô-ni-a quê ở Tê-sa-lô-ni-ca.
  to: Chúng tôi lên một chiếc tàu thuộc A-đra-mít, sắp đi đến các nơi dọc theo tỉnh A-si-a[a], rồi ra khơi. Cùng đi với chúng tôi có A-ri-ta-cơ, một người Ma-xê-đô-ni-a quê ở Tê-sa-lô-ni-ca.
