  text: ἐπιβάντες δὲ πλοίῳ Ἀδραμυττηνῷ ⸀μέλλοντι πλεῖν ⸀εἰς τοὺς κατὰ τὴν Ἀσίαν τόπους ἀνήχθημεν ὄντος σὺν ἡμῖν Ἀριστάρχου Μακεδόνος Θεσσαλονικέως·
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/002.yaml
  text: So we boarded an Adramyttian ship that was about to sail to the places along Asia, and put out to sea, with Aristarchus, a Macedonian from Thessalonica, being with us.
translation:
  language: vi
  text: Chúng tôi lên một chiếc tàu thuộc A-đra-mít, sắp đi đến các nơi dọc theo tỉnh A-si-a[a], rồi ra khơi. Cùng đi với chúng tôi có A-ri-ta-cơ, một người Ma-xê-đô-ni-a quê ở Tê-sa-lô-ni-ca.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tức là tỉnh A-si-a của La Mã ở phía tây Tiểu Á, không phải châu Á ngày nay. Cụm này cũng có thể dịch: “các cảng dọc theo bờ biển tỉnh A-si-a.”'
    reason: Chú thích bối cảnh lịch sử và bảo tồn khả năng hiểu τόπους trong ngữ cảnh hàng hải là các cảng ven biển.
lexical_decisions:
- source_word: ἐπιβάντες
  choice: lên một chiếc tàu
  rationale: Diễn đạt tự nhiên hành động bước lên tàu, đồng thời giữ trình tự trước động từ chính.
- source_word: δὲ
  choice: không dịch thành một liên từ riêng
  rationale: δέ chủ yếu đánh dấu bước tiếp diễn của câu chuyện; mạch kể tiếng Việt đã thể hiện rõ sự tiếp nối mà không cần thêm “vậy” hay “nhưng”.
- source_word: πλοίῳ Ἀδραμυττηνῷ
  choice: một chiếc tàu từ A-đra-mít
  rationale: Tính từ chỉ tàu gắn với hoặc xuất phát từ thành A-đra-mít; cách nói này rõ ràng hơn việc tạo một tính từ địa danh không tự nhiên trong tiếng Việt.
- source_word: μέλλοντι πλεῖν
  choice: sắp đi
  rationale: Giữ sắc thái dự định hoặc hành động sắp xảy ra của μέλλω với động từ nguyên mẫu trong ngữ cảnh hành trình đường biển.
- source_word: εἰς τοὺς κατὰ τὴν Ἀσίαν τόπους
  choice: đến các nơi dọc theo tỉnh A-si-a
  rationale: Giữ từ khái quát τόπους là “các nơi” và sắc thái địa lý của κατά, không tự ý giới hạn thành “các cảng”; thêm “tỉnh” để người đọc hiện đại không nhầm với châu Á.
- source_word: ἀνήχθημεν
  choice: nhổ neo ra khơi
  rationale: Thành ngữ hàng hải tự nhiên trong tiếng Việt, diễn đạt việc rời bến đi biển.
- source_word: ὄντος σὺν ἡμῖν
  choice: Cùng đi với chúng tôi có
  rationale: Chuyển kết cấu sở hữu cách tuyệt đối thành câu tiếng Việt tự nhiên nhưng vẫn giữ đây là hoàn cảnh đi kèm.
- source_word: Ἀριστάρχου Μακεδόνος Θεσσαλονικέως
  choice: A-ri-ta-cơ, một người Ma-xê-đô-ni-a quê ở Tê-sa-lô-ni-ca
  rationale: Giữ cả vùng và thành phố xuất thân của nhân vật bằng cách diễn đạt rõ, tự nhiên, tránh xếp chồng các danh xưng cư dân.
