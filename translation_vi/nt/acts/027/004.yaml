  text: κἀκεῖθεν ἀναχθέντες ὑπεπλεύσαμεν τὴν Κύπρον διὰ τὸ τοὺς ἀνέμους εἶναι ἐναντίους,
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/004.yaml
  text: And from there[a], after putting out to sea, we sailed under the lee of Cyprus, because the winds were against us.
translation:
  language: vi
  text: Và từ đó, chúng tôi ra khơi, rồi đi thuyền men theo phía khuất gió[a] của đảo Síp, vì gió thổi ngược.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đi thuyền dưới sự che chắn của đảo Síp.” Động từ Hy Lạp là thuật ngữ hàng hải, chỉ việc đi ở phía khuất gió của một hòn đảo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀκεῖθεν
  choice: Từ đó
  rationale: Diễn đạt tự nhiên trạng từ chỉ nơi chốn ἐκεῖθεν trong mạch kể tiếp nối; quan hệ nối kết của καί được thể hiện qua dòng văn liên tục mà không cần thêm “và” một cách gượng ép.
- source_word: ἀναχθέντες
  choice: ra khơi
  rationale: Trong ngữ cảnh hàng hải, phân từ aorist của ἀνάγω chỉ việc rời bến để đi biển; tiếng Việt có thể phối hợp tự nhiên với động từ kế tiếp mà vẫn cho thấy hành động mở đầu chuyến đi.
- source_word: ὑπεπλεύσαμεν
  choice: đi men theo phía khuất gió của
  rationale: Động từ hàng hải ὑποπλέω ở đây chỉ việc đi thuyền dọc phía được đảo che gió, không đơn thuần là vị trí “ở dưới”; cách dịch này vừa rõ nghĩa với độc giả phổ thông vừa giữ sắc thái hàng hải.
- source_word: τὴν Κύπρον
  choice: đảo Síp
  rationale: “Síp” là tên gọi tiếng Việt hiện hành của Κύπρος; thêm “đảo” làm rõ địa lý và phù hợp với ý niệm đi ở phía được đảo che gió.
- source_word: διὰ τὸ ... εἶναι
  choice: vì
  rationale: διά đi với động từ nguyên mẫu có mạo từ biểu thị nguyên nhân; “vì” là cách diễn đạt ngắn gọn, tự nhiên.
- source_word: τοὺς ἀνέμους
  choice: gió
  rationale: Tiếng Hy Lạp dùng số nhiều, nhưng tiếng Việt thường dùng danh từ không đánh dấu số trong cách nói về điều kiện gió; dịch “gió” tự nhiên hơn “những cơn gió” ở đây.
- source_word: ἐναντίους
  choice: thổi ngược
  rationale: Tính từ ἐναντίους mô tả gió bất lợi hoặc ngược hướng đi. “Gió thổi ngược” là thành ngữ tiếng Việt tự nhiên và không cần bổ sung đại từ “chúng tôi” vốn không có minh nhiên trong câu Hy Lạp.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại. “Phía khuất gió” truyền đạt chính xác thuật ngữ hàng hải, còn chú thích cung cấp cách diễn đạt sát hình ảnh che chắn hơn. Dấu chú thích [a] được đặt ngay sau cụm từ cần giải thích.
