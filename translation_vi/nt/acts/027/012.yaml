source:
  edition: SBLGNT
  text: ἀνευθέτου δὲ τοῦ λιμένος ὑπάρχοντος πρὸς παραχειμασίαν οἱ πλείονες ἔθεντο βουλὴν ἀναχθῆναι ⸀ἐκεῖθεν, εἴ πως δύναιντο καταντήσαντες εἰς Φοίνικα παραχειμάσαι, λιμένα τῆς Κρήτης βλέποντα κατὰ λίβα καὶ κατὰ χῶρον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/012.yaml
  text: And because the harbor was unsuitable for wintering[a], the majority decided to put out from there[c][b], if somehow they might reach Phoenix and spend the winter there—a harbor of Crete facing southwest and northwest.
translation:
  language: vi
  text: Vì cảng ấy không thích hợp để trú đông, nên đa số quyết định ra khơi từ đó, nếu may ra có thể đến Phê-ni-xê và trú đông tại đó—một cảng của đảo Cơ-rết, hướng về phía tây nam và tây bắc.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cụm từ chỉ hướng ở cuối câu khó xác định chính xác. Theo cách hiểu truyền thống, cảng này “hướng về phía tây nam và tây bắc”; một số người hiểu hướng thứ hai cụ thể hơn là “tây-tây bắc.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνευθέτου
  choice: không thích hợp
  rationale: Diễn tả cảng không phù hợp với mục đích trú qua mùa đông; cách nói này tự nhiên và giữ đúng sắc thái thực tế.
- source_word: λιμένος
  choice: cảng
  rationale: Từ thông dụng, rõ nghĩa trong bối cảnh hàng hải, có thể chỉ nơi tàu neo đậu.
- source_word: πρὸς παραχειμασίαν
  choice: để trú đông
  rationale: Diễn đạt ngắn gọn mục đích ở lại qua mùa đông.
- source_word: οἱ πλείονες
  choice: đa số
  rationale: Chỉ phần đông trong nhóm mà không xác định cụ thể thành phần.
- source_word: ἔθεντο βουλήν
  choice: quyết định
  rationale: Chuyển đạt tự nhiên thành ngữ Hy Lạp mang nghĩa cùng đi đến một quyết định.
- source_word: ἀναχθῆναι ἐκεῖθεν
  choice: rời khỏi đó ra khơi
  rationale: ἀνάγω là thuật ngữ hàng hải chỉ việc nhổ neo hoặc đưa tàu ra biển; bản dịch vừa rõ điểm xuất phát vừa nêu chuyển động ra khơi.
- source_word: εἴ πως δύναιντο
  choice: mong sao có thể
  rationale: Giữ sắc thái hy vọng nhưng không chắc chắn của εἴ πως kết hợp với thức mong ước.
- source_word: καταντήσαντες εἰς Φοίνικα
  choice: đến Phê-ni-xê
  rationale: Diễn đạt tự nhiên việc tới một địa điểm; địa danh được phiên âm theo âm Hy Lạp.
- source_word: παραχειμάσαι
  choice: trú đông
  rationale: Chỉ việc ở lại tại một nơi trong suốt mùa đông, phù hợp ngữ cảnh hàng hải.
- source_word: βλέποντα κατὰ λίβα καὶ κατὰ χῶρον
  choice: hướng về phía tây nam và tây bắc
  rationale: Giữ cách hiểu truyền thống về hướng của cảng, đồng thời chú thích rằng cụm chỉ hướng thứ hai có thể được hiểu cụ thể hơn.
