  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “chiếc xuồng” để nối rõ với câu trước; giữ địa danh Syrtis theo dạng phiên âm quốc tế. Các dấu chú thích [a], [b] đều xuất hiện trong chính văn.
