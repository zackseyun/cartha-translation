  to: Sau khi kéo chiếc xuồng lên, họ dùng dây cáp quấn quanh thân tàu để gia cố nó. Vì sợ bị dạt vào vùng Syrtis[b], họ hạ thiết bị xuống[a], rồi cứ thế bị cuốn đi.
