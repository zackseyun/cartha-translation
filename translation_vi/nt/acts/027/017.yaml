  text: ἣν ἄραντες βοηθείαις ἐχρῶντο ὑποζωννύντες τὸ πλοῖον· φοβούμενοί τε μὴ εἰς τὴν Σύρτιν ἐκπέσωσιν, χαλάσαντες τὸ σκεῦος, οὕτως ἐφέροντο.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/017.yaml
  text: After hoisting it up[a], they used supporting cables to undergird the ship; and fearing that they might run aground on the Syrtis[c][b], they lowered the sea anchor and so were driven along.
translation:
  language: vi
  text: Sau khi kéo chiếc xuồng lên, họ dùng dây cáp quấn quanh thân tàu để gia cố nó. Vì sợ bị dạt vào vùng Syrtis[b], họ hạ thiết bị xuống[a], rồi cứ thế bị cuốn đi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Thiết bị” có thể chỉ bộ buồm, dây cụ hoặc neo biển; từ Hy Lạp không xác định chính xác vật dụng hàng hải nào được hạ xuống.
    reason: lexical_alternative
  - marker: b
    text: Syrtis là vùng bãi cạn và doi cát nguy hiểm nổi tiếng ngoài khơi Bắc Phi.
    reason: cultural_note
lexical_decisions:
- source_word: ἣν ἄραντες
  choice: Sau khi kéo chiếc xuồng lên
  rationale: Đại từ ἣν chỉ chiếc xuồng ở câu trước; nêu rõ danh từ giúp câu tiếng Việt tự nhiên. Phân từ bất định ἄραντες diễn tả hành động xảy ra trước hành động chính.
- source_word: βοηθείαις ἐχρῶντο ὑποζωννύντες τὸ πλοῖον
  choice: họ dùng dây cáp quấn quanh để gia cố con tàu
  rationale: Trong ngữ cảnh hàng hải, βοηθείαις là phương tiện gia cố, còn ὑποζωννύντες chỉ việc buộc hoặc quấn dây quanh phía dưới thân tàu. Cách dịch truyền đạt thao tác rõ ràng mà không dùng thuật ngữ quá chuyên môn.
- source_word: μὴ εἰς τὴν Σύρτιν ἐκπέσωσιν
  choice: bị dạt vào bãi cạn Syrtis
  rationale: ἐκπίπτω trong văn cảnh này diễn tả nguy cơ tàu bị gió đẩy vào vùng nguy hiểm; thêm “bãi cạn” giúp độc giả nhận biết loại địa hình mang tên Syrtis.
- source_word: χαλάσαντες τὸ σκεῦος
  choice: họ hạ thiết bị xuống
  rationale: σκεῦος có nghĩa rộng là đồ dùng, thiết bị hoặc khí cụ; vật dụng hàng hải cụ thể ở đây không chắc chắn. Bản dịch giữ tính khái quát của nguyên văn thay vì xác quyết đó là neo biển.
- source_word: οὕτως ἐφέροντο
  choice: rồi cứ thế bị cuốn trôi
  rationale: Thể bị động chưa hoàn thành diễn tả con tàu tiếp tục bị một lực bên ngoài, trong ngữ cảnh là gió và biển, cuốn đi.
theological_decisions: []
