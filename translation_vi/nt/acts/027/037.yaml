  text: There were 276 persons in the ship in all[a].
translation:
  language: vi
  text: Tổng số người trên tàu là 276.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát hơn: “Chúng tôi, tức tất cả mọi người trên tàu, là 276 người.” Từ Hy Lạp ở đây có nghĩa là “người” hoặc “mạng sống”, không nhất thiết chỉ linh hồn phi vật chất.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤμεθα
  choice: chúng tôi ... là
  rationale: Giữ ngôi thứ nhất số nhiều của động từ Hy Lạp, đồng thời đặt câu theo cách tự nhiên trong tiếng Việt khi nêu tổng số.
- source_word: δὲ
  choice: không dịch thành từ riêng
  rationale: δέ là liên từ chuyển tiếp nhẹ; trong câu tiếng Việt này, mạch kể đã tự nhiên và không cần thêm “bấy giờ” hay “nhưng”.
- source_word: αἱ πᾶσαι ψυχαὶ
  choice: tất cả chúng tôi ... người
  rationale: ψυχαί ở đây chỉ những người có mặt trên tàu, không chuyên biệt nói đến linh hồn phi vật chất; πᾶσαι được thể hiện bằng “tất cả”.
- source_word: ἐν τῷ πλοίῳ
  choice: trên tàu
  rationale: Đây là cách nói tự nhiên trong tiếng Việt về những người ở trên một con tàu.
- source_word: διακόσιαι ἑβδομήκοντα ἕξ
  choice: '276'
  rationale: Giữ chính xác con số và trình bày bằng chữ số để dễ đọc.
theological_decisions:
- issue: Ý nghĩa của ψυχαί
  choice: người
  alternative: linh hồn
  rationale: Trong ngữ cảnh kiểm đếm người trên tàu, từ này mang nghĩa “người”; dịch “linh hồn” có thể gây ra một hàm ý thần học không có trong câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Bản dịch giữ ngôi “chúng tôi” của nguyên bản, dùng “trên tàu” theo cách diễn đạt tự nhiên của tiếng Việt, và tránh hiểu sai ψυχαί theo nghĩa thần học chuyên biệt.
