  source_fidelity: 'Bản dịch truyền đạt đúng các thành tố chính của câu Hy Lạp: γάρ được nối bằng “Vì”; ταύτῃ τῇ νυκτί được nhấn bằng “chính đêm nay”; παρέστη giữ nghĩa hiện diện bên cạnh; và ἄγγελος được hiểu đúng là thiên sứ. Tuy nhiên, cách phối hợp “và cũng là Đấng tôi thờ phượng” làm yếu vị trí của καί, vốn bổ nghĩa trực tiếp cho động từ λατρεύω (“tôi cũng thờ phượng”), đồng thời thêm một liên kết “là” không có trong nguyên văn.'
