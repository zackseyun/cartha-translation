  yaml_path: translation/nt/acts/027/023.yaml
  text: For this very night an angel of the God to whom I belong and whom I also worship stood by me[b][a],
translation:
  language: vi
  text: Vì chính đêm nay, một thiên sứ của Đức Chúa Trời—Đấng mà tôi thuộc về[a] và Đấng tôi cũng thờ phượng[b]—đã đứng bên tôi,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát nghĩa: “tôi là của Ngài.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “Đấng tôi cũng phụng sự”; động từ Hy Lạp có thể chỉ sự phụng sự thiêng liêng hoặc sự thờ phượng dâng lên Đức Chúa Trời.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρέστη
  choice: đã đứng bên tôi
  rationale: Giữ được ý nghĩa không gian của động từ παρίστημι và sự hiện diện bên cạnh Phao-lô, thay vì diễn giải rộng hơn là “hiện ra với tôi”.
- source_word: γάρ
  choice: Vì
  rationale: Nối câu này với lời khẳng định đầy tin tưởng ở ngữ cảnh trước và cho biết căn cứ của lời ấy.
- source_word: ταύτῃ τῇ νυκτί
  choice: chính đêm nay
  rationale: Diễn đạt tự nhiên sắc thái nhấn mạnh và tính tức thời của cụm từ có đại từ chỉ định.
- source_word: τοῦ θεοῦ
  choice: của Đức Chúa Trời
  rationale: Giữ quan hệ sở hữu giữa Đức Chúa Trời và thiên sứ, đồng thời dẫn tự nhiên vào hai mệnh đề quan hệ tiếp theo.
- source_word: οὗ εἰμι
  choice: Đấng mà tôi thuộc về
  rationale: Chuyển tải tự nhiên nghĩa đen “Đấng mà tôi là của Ngài”, giữ ý Phao-lô thuộc về Đức Chúa Trời mà không thêm một khẳng định thần học vượt quá câu Hy Lạp.
- source_word: ᾧ καὶ λατρεύω
  choice: và cũng là Đấng tôi thờ phượng
  rationale: λατρεύω khi hướng về Đức Chúa Trời thường chỉ sự phụng sự mang tính tôn giáo hay thờ phượng; “thờ phượng” truyền đạt rõ sắc thái thiêng liêng, còn cách dịch “phụng sự” được giữ trong chú thích.
- source_word: ἄγγελος
  choice: một thiên sứ
  rationale: Trong bối cảnh được Đức Chúa Trời trấn an, từ này chỉ một sứ giả siêu nhiên, nên “thiên sứ” chính xác hơn “sứ giả”.
theological_decisions:
- issue: Cách dịch οὗ εἰμι
  choice: Đấng mà tôi thuộc về
  alternative: Đấng mà tôi là của Ngài
  rationale: Cách dịch chính tự nhiên trong tiếng Việt hiện đại và bảo toàn ý thuộc về Đức Chúa Trời; chú thích ghi lại hình thức sát chữ của tiếng Hy Lạp.
- issue: Cách dịch λατρεύω
  choice: thờ phượng
  alternative: phụng sự
  rationale: “Thờ phượng” làm rõ tính chất tôn giáo của hành động hướng về Đức Chúa Trời, nhưng “phụng sự” cũng khả dĩ vì động từ Hy Lạp có thể bao hàm sự phục vụ thiêng liêng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dấu gạch ngang giúp người đọc nhận rõ hai mệnh đề bổ nghĩa cho Đức Chúa Trời mà không làm mất cấu trúc của câu Hy Lạp; dấu phẩy cuối câu phản ánh việc câu nói tiếp tục ở câu sau.
