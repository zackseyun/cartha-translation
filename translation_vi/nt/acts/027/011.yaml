source:
  edition: SBLGNT
  text: ὁ δὲ ἑκατοντάρχης τῷ κυβερνήτῃ καὶ τῷ ναυκλήρῳ ⸂μᾶλλον ἐπείθετο⸃ ἢ τοῖς ⸀ὑπὸ Παύλου λεγομένοις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/011.yaml
  text: But the centurion paid more attention to the pilot and the shipowner than to what was being said by Paul[a].
translation:
  language: vi
  text: Nhưng viên đại đội trưởng nghe theo người lái tàu và chủ tàu hơn là nghe những điều Phao-lô nói.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Nhưng viên đại đội trưởng tin lời người lái tàu và chủ tàu hơn những điều Phao-lô nói.”'
    reason: 'Giữ lại sắc thái dịch khác của ἐπείθετο: động từ này có thể nhấn mạnh việc tin hoặc bị thuyết phục, chứ không chỉ việc nghe theo.'
lexical_decisions:
- source_word: ἑκατοντάρχης
  choice: viên đại đội trưởng
  rationale: Thuật ngữ lịch sử quen thuộc trong tiếng Việt dành cho sĩ quan La Mã thường chỉ huy khoảng một trăm quân; vừa chính xác vừa gọn trong mạch kể.
- source_word: κυβερνήτῃ
  choice: người lái tàu
  rationale: Trong ngữ cảnh hàng hải, từ này chỉ người điều khiển hoặc dẫn hướng con tàu. Cách dịch này tự nhiên và phân biệt vai trò ấy với chủ tàu.
- source_word: ναυκλήρῳ
  choice: chủ tàu
  rationale: Từ này thường chỉ người sở hữu hoặc người khai thác chính của con tàu; “chủ tàu” giữ được sự phân biệt có khả năng có chủ ý với κυβερνήτης.
- source_word: μᾶλλον ἐπείθετο
  choice: nghe theo … hơn
  rationale: Cụm từ diễn tả việc viên sĩ quan để mình bị thuyết phục hoặc làm theo lời của những người kia. “Nghe theo” tự nhiên trong tiếng Việt, phù hợp bối cảnh đưa ra quyết định và vẫn giữ sắc thái so sánh của μᾶλλον.
- source_word: τοῖς ὑπὸ Παύλου λεγομένοις
  choice: những điều Phao-lô nói
  rationale: Cụm phân từ có mạo từ nói đến lời khuyên hoặc những lời Phao-lô phát biểu. Cách dịch này rõ ràng, tự nhiên và không thêm nội dung ngoài nguyên văn.
- source_word: δὲ
  choice: Nhưng
  rationale: Liên từ đánh dấu sự tương phản với lời cảnh báo của Phao-lô ở câu trước.
- source_word: ἢ
  choice: hơn là
  rationale: Giữ trực tiếp cấu trúc so sánh đi cùng μᾶλλον.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại. “Viên đại đội trưởng” giữ sắc thái lịch sử; “người lái tàu” và “chủ tàu” là những cách gọi thông dụng, dễ hiểu. Cấu trúc “nghe theo … hơn là nghe …” tái hiện sự đối chiếu của nguyên văn mà không quyết định quá mức giữa các sắc thái nghe theo, tin và bị thuyết phục.
