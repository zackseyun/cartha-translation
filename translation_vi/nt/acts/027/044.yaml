  source_fidelity: 'Bản nháp truyền đạt đúng cục diện: những người còn lại dùng ván hoặc đồ vật từ tàu để vào bờ, và mọi người đều sống sót. Tuy nhiên, “những mảnh từ con tàu” thu hẹp τινων τῶν ἀπὸ τοῦ πλοίου thành các mảnh/vụn tàu, trong khi nguyên văn chỉ nói không xác định về những vật từ tàu. “Bám vào” là một diễn giải hợp ngữ cảnh có thể giữ lại để câu tiếng Việt sáng rõ.'
