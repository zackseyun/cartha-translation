  yaml_path: translation/nt/acts/027/044.yaml
  text: and the rest[a], some on planks and some on pieces from the ship. And so it happened that all were brought safely to land.
translation:
  language: vi
  text: Còn những người khác thì người bám vào ván, người bám vào những vật từ con tàu. Và như thế, tất cả đều vào được bờ an toàn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “tất cả đều được cứu thoát lên bờ” hoặc “tất cả đều thoát nạn và vào bờ an toàn.” Động từ Hy Lạp ở đây nói đến việc được giải cứu về thể chất qua tai nạn đắm tàu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοὺς λοιποὺς
  choice: những người khác
  rationale: Chỉ những người còn lại, ngoài nhóm đã được nhắc đến ở câu trước; cách nói này tự nhiên trong tiếng Việt.
- source_word: οὓς μὲν ... οὓς δὲ
  choice: người ... người ...
  rationale: Diễn đạt tự nhiên cấu trúc tương liên chia những người còn lại thành hai nhóm.
- source_word: ἐπὶ σανίσιν
  choice: bám vào ván
  rationale: σανίς là tấm ván; thêm 'bám vào' làm rõ cách họ dùng ván để nổi trong bối cảnh đắm tàu mà không thay đổi ý nghĩa.
- source_word: ἐπί τινων τῶν ἀπὸ τοῦ πλοίου
  choice: bám vào những mảnh từ con tàu
  rationale: Giữ tính không xác định của τινων, không đoán cụ thể đó là bộ phận hay vật dụng nào.
- source_word: καὶ οὕτως ἐγένετο
  choice: Và như thế
  rationale: Tóm kết cách thức vừa kể và dẫn đến kết quả; tiếng Việt không cần dịch máy móc động từ ἐγένετο.
- source_word: πάντας διασωθῆναι
  choice: tất cả đều vào ... an toàn
  rationale: Trong ngữ cảnh này, διασῴζω nói đến việc sống sót và thoát khỏi tai nạn đắm tàu; cách dịch tránh gợi ý không cần thiết về sự cứu rỗi thuộc linh.
- source_word: ἐπὶ τὴν γῆν
  choice: vào bờ
  rationale: Trong bối cảnh hàng hải, γῆ đối lập với biển và được diễn đạt tự nhiên là 'bờ'.
theological_decisions:
- issue: Sắc thái thần học có thể có của διασωθῆναι
  choice: vào bờ an toàn
  alternative: được cứu lên bờ / thoát nạn và lên bờ an toàn
  rationale: Mạch truyện xác định đây là sự giải cứu thể chất qua tai nạn đắm tàu, không phải một khẳng định trực tiếp về sự cứu rỗi thuộc linh.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Cấu trúc 'người ... người ...' tái hiện tự nhiên phép phân nhóm của nguyên văn; 'bám vào' được bổ sung theo hàm ý ngữ cảnh của giới từ ἐπί trong cảnh những người sống sót dùng vật nổi để vào bờ.
