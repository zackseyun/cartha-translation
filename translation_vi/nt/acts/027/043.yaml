  text: ὁ δὲ ⸀ἑκατοντάρχης βουλόμενος διασῶσαι τὸν Παῦλον ἐκώλυσεν αὐτοὺς τοῦ βουλήματος, ἐκέλευσέν τε τοὺς δυναμένους κολυμβᾶν ἀπορίψαντας πρώτους ἐπὶ τὴν γῆν ἐξιέναι,
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/043.yaml
  text: But the centurion[a], wanting to save Paul, kept them from their plan, and ordered those who were able to swim to jump overboard first and get to land[b],
translation:
  language: vi
  text: Nhưng viên đại đội trưởng muốn cứu Phao-lô nên đã ngăn họ thực hiện ý định ấy[a], rồi ra lệnh cho những người biết bơi nhảy xuống biển trước và lên bờ[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ý định ấy” là ý định của binh lính muốn giết các tù nhân, được nói đến trong câu trước.
    reason: referent_clarification
  - marker: b
    text: 'Sát nghĩa: “sau khi đã quăng mình xuống trước để vào đất liền.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑκατοντάρχης
  choice: viên đại đội trưởng
  rationale: Chỉ một sĩ quan La Mã thường chỉ huy khoảng một trăm quân; cách gọi này rõ nghĩa và quen thuộc trong tiếng Việt hiện đại.
- source_word: βουλόμενος διασῶσαι τὸν Παῦλον
  choice: muốn cứu Phao-lô
  rationale: Diễn đạt tự nhiên ý muốn bảo toàn mạng sống cho Phao-lô mà không nhấn mạnh quá mức mức độ quyết tâm.
- source_word: ἐκώλυσεν αὐτοὺς τοῦ βουλήματος
  choice: đã ngăn họ thực hiện ý định ấy
  rationale: Cấu trúc nói đến việc ngăn họ thi hành điều đã định; “ấy” nối trực tiếp với ý định của binh lính trong câu trước.
- source_word: ἐκέλευσέν τε
  choice: rồi ra lệnh
  rationale: Giữ rõ thẩm quyền quân sự của viên đại đội trưởng và trình tự tiếp theo trong câu chuyện.
- source_word: τοὺς δυναμένους κολυμβᾶν
  choice: những người biết bơi
  rationale: Cách nói tiếng Việt gọn, tự nhiên, xác định nhóm có khả năng bơi.
- source_word: ἀπορίψαντας πρώτους
  choice: nhảy xuống biển trước
  rationale: Chuyển nghĩa đen “ném mình xuống trước” thành hành động tự nhiên trong bối cảnh rời tàu; “trước” giữ thứ tự của πρώτους.
- source_word: ἐπὶ τὴν γῆν ἐξιέναι
  choice: lên bờ
  rationale: Diễn đạt ngắn gọn, đúng hướng chuyển động từ dưới nước lên đất liền trong ngữ cảnh hàng hải.
