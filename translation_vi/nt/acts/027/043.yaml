  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “viên đại đội trưởng” để làm rõ chức vụ quân sự La Mã; giữ dấu phẩy cuối câu vì câu 43 tiếp tục sang câu kế tiếp trong nguyên văn.
