  text: Ὑποπνεύσαντος δὲ νότου δόξαντες τῆς προθέσεως κεκρατηκέναι ἄραντες ἆσσον παρελέγοντο τὴν Κρήτην.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/013.yaml
  text: And when a south wind began to blow gently[a], thinking that they had obtained their purpose, they weighed anchor and sailed along Crete[c][b], close inshore.
translation:
  language: vi
  text: Khi gió nam bắt đầu thổi nhẹ, họ tưởng rằng mình đã đạt được điều mình dự định[a], nên nhổ neo và đi men theo bờ biển Cơ-rết, gần bờ hơn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “cho rằng mình đã thực hiện được ý định của mình.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑποπνεύσαντος
  choice: bắt đầu thổi nhẹ
  rationale: Động từ ὑποπνέω chỉ gió thổi nhẹ; trong mạch kể, cách diễn đạt này cũng truyền tải tự nhiên sắc thái gió vừa nổi lên.
- source_word: νότου
  choice: gió nam
  rationale: νότος ở đây là luồng gió thổi từ phương nam; “gió nam” là cách gọi tự nhiên và chính xác trong tiếng Việt.
- source_word: δόξαντες
  choice: họ tưởng rằng
  rationale: δοκέω diễn tả nhận định chủ quan của các thủy thủ, chưa chắc phù hợp với thực tế; “tưởng rằng” giữ được sắc thái ấy.
- source_word: τῆς προθέσεως κεκρατηκέναι
  choice: đã đạt được điều dự định
  rationale: Cụm này nói rằng họ cho là mình đã nắm được hoặc thực hiện được mục tiêu đã định. Cách dịch giữ ý nghĩa theo ngữ cảnh mà không biến πρόθεσις thành một thuật ngữ thần học.
- source_word: ἄραντες
  choice: nhổ neo
  rationale: αἴρω có nghĩa đen là “nhấc lên”, nhưng trong văn cảnh hàng hải, vật được ngầm hiểu là neo; “nhổ neo” là cách nói tiếng Việt thông dụng.
- source_word: παρελέγοντο
  choice: đi men theo
  rationale: παραλέγομαι là thuật ngữ hàng hải chỉ việc đi dọc theo bờ biển; “đi men theo” rõ nghĩa và tự nhiên.
- source_word: ἆσσον
  choice: sát bờ
  rationale: Trạng từ so sánh này mang nghĩa “gần hơn”; trong ngữ cảnh tàu đi dọc đảo, “sát bờ” truyền đạt hướng đi gần bờ mà bản văn mô tả.
- source_word: τὴν Κρήτην
  choice: đảo Cơ-rết
  rationale: Danh từ chỉ đảo Crete; thêm từ loại “đảo” giúp độc giả Việt nhận rõ địa hình mà không làm thay đổi nội dung.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại. Dùng các cách nói hàng hải phổ thông “nhổ neo” và “đi men theo”, tránh thuật ngữ chuyên môn khó hiểu. “Tưởng rằng” duy trì khoảng cách giữa nhận định của thủy thủ và diễn biến thực tế sắp xảy ra.
