reference: Acts 27:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ὡς δὲ ἐκρίθη τοῦ ἀποπλεῖν ἡμᾶς εἰς τὴν Ἰταλίαν, παρεδίδουν τόν τε Παῦλον καί τινας ἑτέρους δεσμώτας ἑκατοντάρχῃ ὀνόματι Ἰουλίῳ σπείρης Σεβαστῆς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/001.yaml
  text: When it was decided that we should sail for Italy[a], they handed over both Paul and some other prisoners to a centurion named Julius, of the Augustan Cohort.
translation:
  language: vi
  text: Khi quyết định cho chúng tôi đi thuyền đến Ý được đưa ra, người ta giao Phao-lô cùng một số tù nhân khác cho một viên đại đội trưởng tên là Giu-li-ô, thuộc đơn vị Au-gút-ta.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “thuộc đơn vị của hoàng đế”; hoặc hiểu là “thuộc đơn vị Sê-bát-tê.” Từ Hy Lạp Σεβαστῆς liên hệ với tước hiệu Augustus/hoàng đế, nhưng chưa rõ chính xác đây là đơn vị quân đội nào.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκρίθη
  choice: có quyết định
  rationale: Động từ aorist thụ động được dùng theo lối vô nhân xưng, chỉ một quyết định chính thức; cách dịch này giữ sắc thái hành chính và tự nhiên trong tiếng Việt.
- source_word: τοῦ ἀποπλεῖν ἡμᾶς
  choice: rằng chúng tôi sẽ đi thuyền
  rationale: Cụm nguyên mẫu có mạo từ nêu nội dung của quyết định; “đi thuyền” thể hiện rõ việc khởi hành bằng đường biển, còn “chúng tôi” giữ nguyên lời kể ngôi thứ nhất.
- source_word: παρεδίδουν
  choice: người ta giao
  rationale: Chủ thể không được nêu rõ trong tiếng Hy Lạp; “người ta” tránh tự ý xác định tác nhân, còn “giao” diễn đạt việc chuyển giao quyền canh giữ.
- source_word: τόν τε Παῦλον καί τινας ἑτέρους δεσμώτας
  choice: Phao-lô cùng một số tù nhân khác
  rationale: “Cùng” diễn đạt tự nhiên cấu trúc τε…καί, còn “tù nhân” là nghĩa rõ ràng, thông dụng của δεσμώτας.
- source_word: ἑκατοντάρχῃ
  choice: cho một viên đại đội trưởng
  rationale: Danh từ chỉ sĩ quan La Mã chỉ huy khoảng một trăm quân; “đại đội trưởng” dễ hiểu trong tiếng Việt hiện đại hơn từ vay mượn “bách quản,” dù cấp bậc cổ đại không hoàn toàn tương ứng với hệ thống hiện đại.
- source_word: ὀνόματι Ἰουλίῳ
  choice: tên là Giu-li-ô
  rationale: Cách giới thiệu tên người tự nhiên trong tiếng Việt; tên riêng được phiên âm theo âm Hy Lạp/La-tinh quen dùng trong văn phong Kinh Thánh.
- source_word: σπείρης Σεβαστῆς
  choice: thuộc đơn vị Au-gút-ta
  rationale: σπεῖρα chỉ một đơn vị quân đội La Mã, còn Σεβαστή có thể là danh hiệu liên hệ với Augustus/hoàng đế hoặc tên riêng Sebaste; cách dịch giữ tên gọi tương đối trực tiếp và để sự bất định lịch sử trong chú thích.
theological_decisions:
- issue: Ý nghĩa lịch sử của σπείρης Σεβαστῆς
  choice: thuộc đơn vị Au-gút-ta
  alternative: thuộc đơn vị Hoàng gia; thuộc đơn vị Sê-bát-tê
  rationale: Đây không phải vấn đề giáo lý nhưng là một danh xưng quân sự chưa xác định chắc chắn. Giữ dạng danh xưng và nêu các khả năng trong chú thích tránh khẳng định quá mức rằng đây nhất thiết là một đơn vị “Hoàng gia.”
translation_notes:
  register: Văn phong kể chuyện trang trọng, rõ ràng và hiện đại. Dùng “Ý” cho địa danh, “đại đội trưởng” để người đọc phổ thông hiểu chức vụ, đồng thời dùng “đơn vị” thay vì gán chắc một cơ cấu quân sự hiện đại cho σπεῖρα.
