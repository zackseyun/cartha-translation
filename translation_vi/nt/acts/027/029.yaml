  text: φοβούμενοί τε ⸂μή που κατὰ⸃ τραχεῖς τόπους ἐκπέσωμεν ἐκ πρύμνης ῥίψαντες ἀγκύρας τέσσαρας ηὔχοντο ἡμέραν γενέσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/029.yaml
  text: And fearing that we might run aground on rocky places[b][a], they dropped four anchors from the stern and prayed for day to come.
translation:
  language: vi
  text: Vì sợ tàu có thể bị dạt vào những nơi hiểm trở[a], họ thả bốn neo từ đuôi tàu xuống rồi cầu mong trời sáng[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “bị dạt vào những bãi đá lởm chởm” hoặc “mắc cạn ở những nơi gồ ghề.”'
    reason: lexical_alternative
  - marker: b
    text: 'Sát nghĩa: “cầu mong cho ngày đến”; tức là họ mong mỏi ánh sáng ban ngày xuất hiện.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φοβούμενοί
  choice: Vì sợ
  rationale: Diễn tả tự nhiên hoàn cảnh đồng thời là động cơ dẫn đến việc thả neo, giữ quan hệ của phân từ với hành động theo sau.
- source_word: μή που κατὰ τραχεῖς τόπους ἐκπέσωμεν
  choice: tàu có thể bị dạt vào những nơi hiểm trở
  rationale: Trong ngữ cảnh hàng hải, cụm này diễn tả nỗi lo con tàu bị cuốn hoặc dạt vào địa hình nguy hiểm. Cách dịch không giới hạn τραχεῖς τόπους chỉ vào đá ngầm hay bờ đá.
- source_word: ἐκ πρύμνης
  choice: từ đuôi tàu
  rationale: πρύμνα chỉ phần sau của tàu; “đuôi tàu” rõ nghĩa và tự nhiên hơn với độc giả phổ thông hiện đại.
- source_word: ῥίψαντες ἀγκύρας τέσσαρας
  choice: họ thả bốn neo ... xuống
  rationale: Chuyển tải hành động thả neo xảy ra trước hành động chính, bằng cách diễn đạt hàng hải tự nhiên trong tiếng Việt.
- source_word: ηὔχοντο
  choice: cầu mong
  rationale: εὔχομαι có thể mang nghĩa cầu nguyện hoặc mong ước. “Cầu mong” giữ được sắc thái hướng lời cầu xin mà không buộc phải xác định đối tượng không được nêu trong câu.
- source_word: ἡμέραν γενέσθαι
  choice: trời mau sáng
  rationale: Diễn đạt tự nhiên ý mong ngày mới hay ánh sáng ban ngày đến; “mau” chuyển tải sự khắc khoải hàm chứa trong hoàn cảnh và thể chưa hoàn thành của ηὔχοντο.
theological_decisions:
- issue: ηὔχοντο là cầu nguyện hay chỉ mong ước
  choice: cầu mong
  alternative: cầu nguyện; mong mỏi
  rationale: Nguyên ngữ cho phép cả sắc thái cầu nguyện lẫn mong ước. “Cầu mong” bảo toàn độ mở đó, tránh tự ý thêm đối tượng của lời cầu nguyện.
translation_notes:
  register: Văn phong tường thuật hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “đuôi tàu” thay cho thuật ngữ chuyên môn “phía lái”; giữ sự mơ hồ của địa hình nguy hiểm và của động từ ηὔχοντο.
