    issue: Từ “mau” trong “cầu mong trời mau sáng” thêm sắc thái không được diễn đạt minh nhiên trong nguyên ngữ.
    rationale: Ἡμέραν γενέσθαι có nghĩa là “ngày đến/trời sáng.” Hoàn cảnh có thể gợi sự sốt ruột, nhưng bản dịch tối ưu-tương-đương không nên đưa “mau” vào nội dung chính khi từ này không có tương ứng trực tiếp.
