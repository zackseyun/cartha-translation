  text: τό τε πέλαγος τὸ κατὰ τὴν Κιλικίαν καὶ Παμφυλίαν διαπλεύσαντες κατήλθομεν εἰς Μύρα τῆς Λυκίας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/005.yaml
  text: After sailing across the open sea along Cilicia and Pamphylia[b][a], we came down to Myra in Lycia.
translation:
  language: vi
  text: Sau khi đi qua biển khơi ngoài khơi Ki-li-ki-a và Pam-phy-li-a[a], chúng tôi đi xuống đến My-ra, thuộc Ly-ki-a.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “dọc theo Ki-li-ki-a và Pam-phy-li-a”, chỉ một hải trình chạy dọc hoặc ngoài khơi bờ biển của các vùng ấy.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “chúng tôi đến My-ra, thuộc Ly-ki-a”. Động từ Hy Lạp có nghĩa đen là “đi xuống”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πέλαγος
  choice: vùng biển khơi
  rationale: Danh từ này chỉ vùng biển rộng, ngoài khơi, chứ không chỉ biển nói chung; “vùng biển khơi” giữ được sắc thái hàng hải và tự nhiên trong tiếng Việt.
- source_word: τὸ κατὰ τὴν Κιλικίαν καὶ Παμφυλίαν
  choice: dọc theo Ki-li-ki-a và Pam-phy-li-a
  rationale: κατά với đối cách trong cách diễn đạt địa lý này mô tả hải trình chạy dọc hoặc ngoài khơi các vùng ấy. “Dọc theo” diễn đạt rõ hướng tuyến mà không khẳng định đoàn tàu ở sát bờ.
- source_word: διαπλεύσαντες
  choice: Sau khi vượt qua
  rationale: Phân từ bất định chỉ hành động đi biển đã hoàn tất trước động từ chính. Cụm “sau khi vượt qua” thể hiện rõ trình tự và ý vượt biển; ngữ cảnh đã làm rõ đây là hành trình bằng tàu.
- source_word: κατήλθομεν
  choice: chúng tôi đi xuống
  rationale: Giữ hình ảnh định hướng của κατέρχομαι (“đi xuống”), đồng thời ghi nhận trong chú thích rằng trong văn thuật hành trình từ này cũng có thể mang nghĩa thông dụng là đến nơi.
- source_word: Μύρα τῆς Λυκίας
  choice: My-ra thuộc Ly-ki-a
  rationale: Sở hữu cách xác định My-ra là thành phố nằm trong vùng Ly-ki-a. “Thuộc” tự nhiên, ngắn gọn và không biến quan hệ địa lý thành sở hữu.
- source_word: τε
  choice: không dịch thành từ riêng
  rationale: Tiểu từ này nối nhẹ câu với mạch kể trước đó; trong tiếng Việt, lực liên kết được thể hiện tự nhiên qua sự tiếp nối của câu nên không cần thêm một liên từ riêng.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Các địa danh được phiên âm có gạch nối để người đọc phổ thông dễ phát âm. Trật tự câu làm rõ hành động vượt biển xảy ra trước khi đoàn đến My-ra; các chú thích giữ lại những khả năng dịch thực sự của cách nói địa lý và động từ chuyển động.
