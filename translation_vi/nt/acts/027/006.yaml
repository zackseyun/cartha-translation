  text: κἀκεῖ εὑρὼν ὁ ⸀ἑκατοντάρχης πλοῖον Ἀλεξανδρῖνον πλέον εἰς τὴν Ἰταλίαν ἐνεβίβασεν ἡμᾶς εἰς αὐτό.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/006.yaml
  text: There the centurion found an Alexandrian ship sailing for Italy[a], and he put us on board it.
translation:
  language: vi
  text: Tại đó, viên đại đội trưởng tìm được một chiếc tàu từ Alexandria đang đi Ý[a], rồi cho chúng tôi lên tàu ấy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “Và tại đó, viên đại đội trưởng tìm được một chiếc tàu từ Alexandria đang đi Ý, rồi cho chúng tôi lên tàu ấy.”'
    reason: Phản ánh lựa chọn dịch κἀκεῖ là “và tại đó”; bản văn chính lược liên từ theo lối kể chuyện tiếng Việt tự nhiên.
lexical_decisions:
- source_word: κἀκεῖ
  choice: Tại đó
  rationale: Từ này có nghĩa là “và tại đó” hoặc “cũng tại đó”; văn kể chuyện tiếng Việt có thể lược sắc thái liên kết mà không làm mất diễn tiến.
- source_word: εὑρὼν
  choice: tìm được
  rationale: Phân từ bất định xảy ra trước động từ chính; chuyển thành động từ hữu hạn giúp câu tiếng Việt tự nhiên và vẫn giữ đúng trình tự hành động.
- source_word: ἑκατοντάρχης
  choice: viên đại đội trưởng
  rationale: Chỉ sĩ quan La Mã chỉ huy khoảng một trăm quân; cách gọi này rõ nghĩa và quen thuộc trong tiếng Việt hiện đại.
- source_word: πλοῖον Ἀλεξανδρῖνον
  choice: một chiếc tàu từ Alexandria
  rationale: Tính từ có thể chỉ nguồn gốc hoặc nơi đăng ký của tàu; “từ Alexandria” tự nhiên và tránh hàm ý quá cụ thể.
- source_word: πλέον εἰς τὴν Ἰταλίαν
  choice: đang đi đến Ý
  rationale: Phân từ hiện tại cùng cụm chỉ đích đến diễn tả hành trình hoặc hướng đi của tàu; cách dịch này giữ được nghĩa mà không thêm chi tiết ngoài bản nguồn.
- source_word: ἐνεβίβασεν ἡμᾶς εἰς αὐτό
  choice: cho chúng tôi lên tàu
  rationale: Động từ mang nghĩa khiến hoặc đưa người khác lên tàu; “cho chúng tôi lên tàu” rõ ràng, tự nhiên và giữ sắc thái tác động.
