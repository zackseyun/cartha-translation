  register: Văn phong kể chuyện trang trọng vừa phải, tự nhiên và dễ hiểu trong tiếng Việt hiện đại. Dùng “tàu” theo ngữ cảnh hàng hải; giữ địa danh “Alexandria” và tên nước “Ý” theo cách dùng phổ biến.
