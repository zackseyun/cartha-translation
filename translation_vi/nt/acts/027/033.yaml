  text: Ἄχρι δὲ οὗ ⸂ἡμέρα ἤμελλεν⸃ γίνεσθαι παρεκάλει ὁ Παῦλος ἅπαντας μεταλαβεῖν τροφῆς λέγων· Τεσσαρεσκαιδεκάτην σήμερον ἡμέραν προσδοκῶντες ἄσιτοι διατελεῖτε, μηθὲν προσλαβόμενοι·
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/033.yaml
  text: Until the day was about to dawn[a], Paul kept urging them all to take some food, saying, “Today is the fourteenth day that you have continued in suspense without eating, having taken nothing.”
translation:
  language: vi
  text: 'Cho đến khi trời sắp sáng, Phao-lô vẫn cứ khuyên mọi người ăn chút gì đó. Ông nói: “Hôm nay đã là ngày thứ mười bốn, anh em cứ thấp thỏm chờ đợi[a], không ăn gì, chẳng dùng chút thức ăn nào.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hoặc “chờ đợi”; từ Hy Lạp có thể chỉ sự chờ đợi hay trông đợi, còn bối cảnh bão tố có thể hàm ý tâm trạng thấp thỏm.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄχρι δὲ οὗ ἡμέρα ἤμελλεν γίνεσθαι
  choice: Khi trời sắp sáng
  rationale: Cụm từ chỉ thời điểm ban ngày sắp đến. Cách diễn đạt này tự nhiên trong tiếng Việt và giữ ý ánh sáng ban ngày sắp xuất hiện; trong mạch câu, hành động khuyên nhủ kéo dài đến lúc ấy.
- source_word: παρεκάλει
  choice: cứ khuyên
  rationale: Thể chưa hoàn thành diễn tả hành động liên tục hoặc lặp lại; “cứ khuyên” thể hiện lực kéo dài mà vẫn tự nhiên.
- source_word: ἅπαντας
  choice: mọi người
  rationale: Chỉ toàn thể những người có mặt trên tàu và giữ trọn ý bao quát.
- source_word: μεταλαβεῖν τροφῆς
  choice: ăn chút gì
  rationale: Diễn đạt tự nhiên hành động dùng một phần thức ăn để lấy sức, đồng thời phản ánh sắc thái bộ phận của τροφῆς.
- source_word: Τεσσαρεσκαιδεκάτην σήμερον ἡμέραν
  choice: Hôm nay đã là ngày thứ mười bốn
  rationale: Giữ trọng tâm của nguyên văn vào ngày hiện tại là ngày thứ mười bốn; “đã là” diễn tả quãng thời gian kéo dài đến hiện tại.
- source_word: προσδοκῶντες
  choice: thấp thỏm chờ đợi
  rationale: Động từ cơ bản chỉ sự chờ đợi hoặc trông đợi; bối cảnh bão tố hỗ trợ sắc thái lo âu. Chú thích giữ lại cách hiểu trung tính hơn.
- source_word: ἄσιτοι διατελεῖτε
  choice: cứ ... không ăn gì
  rationale: Diễn tả việc tiếp tục ở trong tình trạng không ăn; tránh “kiêng ăn”, vốn dễ gợi một sự thực hành tôn giáo tự nguyện.
- source_word: μηθὲν προσλαβόμενοι
  choice: chẳng dùng chút thức ăn nào
  rationale: Giữ mệnh đề phân từ nhấn mạnh rằng họ không lấy hoặc dùng thức ăn, đồng thời tái hiện mức độ lặp nhấn có trong nguyên văn.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Phao-lô” theo lối phiên âm tên riêng Kinh Thánh quen thuộc. Giữ sự lặp ý giữa “không ăn gì” và “chẳng dùng chút thức ăn nào” vì nguyên văn cũng nhấn mạnh bằng hai cách diễn đạt gần nhau.
