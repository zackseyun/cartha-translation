revisions:
- from: 'Khi trời sắp sáng, Phao-lô cứ khuyên mọi người ăn chút gì. Ông nói: “Hôm nay đã là ngày thứ mười bốn anh em cứ thấp thỏm chờ đợi[a], không ăn gì, chẳng dùng chút thức ăn nào.”'
  to: 'Cho đến khi trời sắp sáng, Phao-lô vẫn cứ khuyên mọi người ăn chút gì đó. Ông nói: “Hôm nay đã là ngày thứ mười bốn, anh em cứ thấp thỏm chờ đợi[a], không ăn gì, chẳng dùng chút thức ăn nào.”'
  rationale: Sửa «Khi» thành «Cho đến khi» để bảo toàn quan hệ thời gian của nguyên văn và dùng «vẫn cứ» để hỗ trợ sắc thái tiếp diễn của thể chưa hoàn thành. Chỉnh dấu câu trong lời nói trực tiếp; không thay đổi nghĩa, thuật ngữ, hay điểm neo chú thích.
