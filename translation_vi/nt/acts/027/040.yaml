source:
  edition: SBLGNT
  text: καὶ τὰς ἀγκύρας περιελόντες εἴων εἰς τὴν θάλασσαν, ἅμα ἀνέντες τὰς ζευκτηρίας τῶν πηδαλίων, καὶ ἐπάραντες τὸν ἀρτέμωνα τῇ πνεούσῃ κατεῖχον εἰς τὸν αἰγιαλόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/040.yaml
  text: And after casting off the anchors[a], they left them in the sea; at the same time loosening the ropes of the rudders, and hoisting the foresail to the wind[b], they made for the beach.
translation:
  language: vi
  text: Sau khi tháo các neo và bỏ chúng lại ngoài biển, họ đồng thời tháo các dây buộc bánh lái[a], giương buồm mũi đón gió[b], rồi cho tàu hướng vào bãi biển.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “các đai” hoặc “các dây/bộ phận giữ bánh lái”; đây là một thuật ngữ hàng hải Hy Lạp hiếm, chỉ vật dùng để cố định cơ cấu lái.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “buồm trên” hoặc “cánh buồm ở phía mũi tàu”; chưa xác định chắc thuật ngữ hàng hải Hy Lạp này chỉ chính xác loại buồm nào.
    reason: lexical_alternative
lexical_decisions:
- source_word: περιελόντες
  choice: cắt bỏ
  rationale: Phân từ bất định quá khứ diễn tả hành động xảy ra trước; trong ngữ cảnh các neo bị bỏ lại dưới biển, cách dịch này diễn đạt tự nhiên việc giải phóng con tàu khỏi neo, dù động từ tự nó có nghĩa rộng hơn là tháo hoặc gỡ bỏ.
- source_word: ἀγκύρας
  choice: các neo
  rationale: Danh từ hàng hải số nhiều, chỉ những chiếc neo của tàu.
- source_word: εἴων εἰς τὴν θάλασσαν
  choice: để chúng lại dưới biển
  rationale: Đại từ ngầm hiểu quy chiếu về các neo; ἐάω ở đây mang nghĩa để lại hoặc bỏ lại.
- source_word: ἅμα ἀνέντες
  choice: đồng thời tháo
  rationale: ἅμα biểu thị hành động đồng thời, còn ἀνίημι chỉ việc nới hoặc thả thứ đang được buộc giữ.
- source_word: ζευκτηρίας τῶν πηδαλίων
  choice: các dây buộc bánh lái
  rationale: ζευκτηρία là thuật ngữ hàng hải hiếm, chỉ vật buộc hoặc bộ phận giữ cơ cấu lái; cách dịch này rõ nghĩa với độc giả hiện đại mà vẫn giữ chú thích về độ bất định.
- source_word: ἐπάραντες
  choice: giương
  rationale: Trong ngữ cảnh đi biển, động từ mang nghĩa nâng hoặc kéo buồm lên; “giương” là cách nói tự nhiên trong tiếng Việt.
- source_word: ἀρτέμωνα
  choice: buồm mũi
  rationale: Thuật ngữ hàng hải có nghĩa chính xác còn được tranh luận; “buồm mũi” diễn đạt hợp lý một cánh buồm phía trước, đồng thời phương án khác được ghi trong chú thích.
- source_word: τῇ πνεούσῃ
  choice: đón gió
  rationale: Phân từ giống cái ở dạng dữ cách hàm ý luồng gió đang thổi; “đón gió” diễn đạt tự nhiên việc đưa buồm ra cho gió tác động.
- source_word: κατεῖχον εἰς τὸν αἰγιαλόν
  choice: hướng vào bãi biển
  rationale: κατέχω ở đây có nghĩa hàng hải là giữ hướng hoặc tiến về một nơi, còn αἰγιαλός chỉ bãi biển hay dải bờ biển.
