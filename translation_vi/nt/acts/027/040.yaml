revisions:
- from: Họ cắt bỏ các neo và để chúng lại dưới biển; đồng thời tháo các dây buộc bánh lái[a], giương buồm mũi đón gió[b], rồi hướng vào bãi biển.
  to: Sau khi tháo các neo và bỏ chúng lại ngoài biển, họ đồng thời tháo các dây buộc bánh lái[a], giương buồm mũi đón gió[b], rồi cho tàu hướng vào bãi biển.
  rationale: Đổi “cắt bỏ” thành “tháo” để không khẳng định phương thức mà nguyên văn không nêu; đổi “dưới biển” thành “ngoài biển” cho tự nhiên; và thêm “cho tàu” ở vế cuối để phản ánh rõ hành động hàng hải. Chú thích a được chỉnh để không chuyển sang “mái chèo lái” như một xác định quá cụ thể.
