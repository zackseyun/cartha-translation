  text: ⸂Πέτρος δὲ⸃ καὶ Ἰωάννης ἀνέβαινον εἰς τὸ ἱερὸν ἐπὶ τὴν ὥραν τῆς προσευχῆς τὴν ἐνάτην,
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/001.yaml
  text: Peter and John were going up to the temple at the hour of prayer[a], the ninth hour.
translation:
  language: vi
  text: Phi-e-rơ và Giăng đang đi lên đền thờ vào giờ cầu nguyện[a], tức giờ thứ chín.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Theo cách tính giờ ngày nay, khoảng ba giờ chiều.
    reason: cultural_note
lexical_decisions:
- source_word: δέ
  choice: không dịch thành một từ riêng
  rationale: Ở đây δέ chỉ là liên từ nhẹ tiếp nối câu chuyện, không biểu thị sự tương phản rõ. Tiếng Việt tự nhiên không cần thêm “bấy giờ” hay “nhưng”.
- source_word: ἀνέβαινον
  choice: đang đi lên
  rationale: Thì chưa hoàn thành diễn tả hành động đang diễn tiến trong quá khứ; “đi lên” cũng giữ hướng chuyển động hàm chứa trong động từ.
- source_word: ἱερόν
  choice: đền thờ
  rationale: ἱερόν chỉ toàn bộ khuôn viên đền thờ, không riêng nơi thánh bên trong; “đền thờ” là cách nói gọn và quen thuộc trong tiếng Việt.
- source_word: ἐπὶ τὴν ὥραν τῆς προσευχῆς
  choice: vào giờ cầu nguyện
  rationale: Cách diễn đạt này vừa tự nhiên vừa giữ ý về thời điểm cầu nguyện đã được ấn định.
- source_word: τὴν ἐνάτην
  choice: tức giờ thứ chín
  rationale: Giữ nguyên hệ thống tính giờ của văn bản nguồn; “tức” cho thấy cụm này xác định giờ cầu nguyện vừa nói đến.
