base_translation:
  language: en
  yaml_path: translation/nt/acts/003/004.yaml
  text: And Peter[a], together with John, fixed his gaze on him and said, “Look at us.”
translation:
  language: vi
  text: 'Phi-e-rơ cùng với Giăng nhìn chăm chú vào người ấy[a] và nói: “Hãy nhìn chúng tôi.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “nhìn kỹ người ấy.” Động từ Hy Lạp diễn tả một cái nhìn tập trung, có chủ ý, chứ không phải chỉ liếc qua.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀτενίσας
  choice: chăm chú nhìn
  rationale: Phân từ bất định quá khứ của ἀτενίζω diễn tả cái nhìn tập trung, có chủ ý; “chăm chú nhìn” tự nhiên trong tiếng Việt và giữ được cường độ của động từ.
- source_word: δὲ
  choice: không dịch thành từ riêng
  rationale: Ở đây δέ chỉ là liên từ nhẹ để tiếp nối câu chuyện. Trật tự câu tiếng Việt đã thể hiện sự tiếp diễn; thêm “nhưng” sẽ tạo sắc thái tương phản quá mạnh, còn “và” ở đầu câu không cần thiết.
- source_word: Πέτρος
  choice: Phi-e-rơ
  rationale: Dùng dạng tên riêng quen thuộc trong truyền thống Kinh Thánh tiếng Việt hiện đại.
- source_word: εἰς αὐτόν
  choice: người ấy
  rationale: Với ἀτενίζω, εἰς đánh dấu đối tượng của cái nhìn tập trung. “Nhìn người ấy” là cách diễn đạt tự nhiên và tránh gán sắc thái xã hội không có trong đại từ Hy Lạp.
- source_word: σὺν τῷ Ἰωάννῃ
  choice: cùng với Giăng
  rationale: σύν với tặng cách biểu thị sự đồng hành; “cùng với Giăng” giữ rõ ý Phi-e-rơ hành động trong sự có mặt và tham dự của Giăng.
- source_word: εἶπεν
  choice: nói
  rationale: Động từ λέγω ở đây là động từ phát ngôn thông thường; “nói” trực tiếp và phù hợp ngữ cảnh.
- source_word: Βλέψον
  choice: Hãy nhìn
  rationale: Mệnh lệnh bất định quá khứ số ít yêu cầu người nghe hướng sự chú ý ngay vào họ. “Hãy nhìn” là mệnh lệnh rõ ràng, tự nhiên.
- source_word: εἰς ἡμᾶς
  choice: chúng tôi
  rationale: Sau động từ nhìn, εἰς chỉ hướng và đối tượng của cái nhìn; tiếng Việt diễn đạt tự nhiên là “nhìn chúng tôi” mà không cần dịch giới từ riêng.
