  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Câu giữ sự phân biệt giữa cái nhìn chăm chú của Phi-e-rơ và Giăng với mệnh lệnh ngắn gọn dành cho người ấy.
