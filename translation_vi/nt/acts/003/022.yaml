language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Μωϋσῆς ⸀μὲν εἶπεν ὅτι Προφήτην ὑμῖν ἀναστήσει κύριος ὁ ⸀θεὸς ἐκ τῶν ἀδελφῶν ὑμῶν ὡς ἐμέ· αὐτοῦ ἀκούσεσθε κατὰ πάντα ὅσα ἂν λαλήσῃ πρὸς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/022.yaml
  text: Moses indeed said[a], ‘The Lord God will raise up for you a prophet from among your brothers, like me[b]. You shall listen to him in everything he says to you.’
translation:
  language: vi
  text: 'Môi-se quả thật đã nói: “Chúa, Đức Chúa Trời[b] sẽ dấy lên cho anh em một nhà tiên tri từ giữa anh em mình[a], giống như tôi. Anh em phải nghe theo người ấy trong mọi điều người ấy nói với anh em.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể hiểu là “từ giữa đồng bào Israel của anh em.” Tiếng Hy Lạp nói “từ giữa các anh em của anh em,” dùng cách gọi thân tộc giống đực theo nghĩa đại diện cho cộng đồng giao ước.
    reason: lexical_alternative
  - marker: b
    text: Ở đây Công Vụ trích Phục Truyền Luật Lệ Ký 18:15 với lời lẽ hơi khác; đáng chú ý, bản Hy Lạp của Công Vụ nói “Chúa, Đức Chúa Trời,” chứ không nói “Chúa, Đức Chúa Trời của anh em.”
    reason: cross_reference
lexical_decisions:
- source_word: Μωϋσῆς
  choice: Môi-se
  rationale: Dùng dạng phiên âm tên riêng quen thuộc trong tiếng Việt.
- source_word: μὲν
  choice: quả thật
  rationale: Giữ sắc thái nhấn mạnh và phát triển lập luận của tiểu từ, đồng thời vẫn tự nhiên trong tiếng Việt hiện đại.
- source_word: εἶπεν ὅτι
  choice: 'đã nói: “…”'
  rationale: Dẫn lời trực tiếp là cách diễn đạt tự nhiên và thể hiện rõ công thức trích dẫn.
- source_word: Προφήτην
  choice: một nhà tiên tri
  rationale: Danh từ không có mạo từ được diễn đạt bất định; không tự ý chuyển thành danh hiệu “Đấng Tiên Tri”.
- source_word: ἀναστήσει
  choice: sẽ dấy lên
  rationale: Giữ hình ảnh của động từ và mối liên hệ với Phục Truyền Luật Lệ Ký 18, nhưng trong ngữ cảnh này không áp đặt nghĩa phục sinh.
- source_word: κύριος ὁ θεὸς
  choice: Chúa là Đức Chúa Trời
  rationale: Diễn đạt tự nhiên hai danh xưng trong tiếng Việt và không thêm đại từ “của anh em,” vốn không có trong bản Hy Lạp của Công Vụ.
- source_word: ἐκ τῶν ἀδελφῶν ὑμῶν
  choice: từ giữa anh em mình
  rationale: Giữ ngôn ngữ thân tộc của bản Hy Lạp; “mình” làm rõ rằng nhà tiên tri xuất thân từ chính cộng đồng giao ước của những người nghe.
- source_word: ὡς ἐμέ
  choice: giống như tôi
  rationale: Giữ nguyên nghĩa so sánh trực tiếp với Môi-se.
- source_word: αὐτοῦ ἀκούσεσθε
  choice: anh em phải nghe theo người ấy
  rationale: Thì tương lai tại đây mang lực mệnh lệnh trong lời giao ước; “nghe theo” bao hàm sự vâng phục chứ không chỉ nghe bằng tai.
- source_word: κατὰ πάντα ὅσα ἂν λαλήσῃ πρὸς ὑμᾶς
  choice: trong mọi điều người ấy nói với anh em
  rationale: Truyền đạt rõ tính toàn diện của cụm từ Hy Lạp bằng tiếng Việt hiện đại.
theological_decisions:
- issue: Lời trích Phục Truyền Luật Lệ Ký 18 và sự nhận diện về Đấng Mê-si-a
  choice: Giữ cách gọi “một nhà tiên tri,” không chèn “Đấng Mê-si-a” hay biến thành danh hiệu “Đấng Tiên Tri.”
  alternative: Diễn giải thành “Đấng Tiên Tri” hoặc nêu rõ Đấng Mê-si-a ngay trong lời trích.
  rationale: Trong ngữ cảnh Công Vụ, Phi-e-rơ áp dụng lời này cho Chúa Giê-xu, nhưng chính câu Hy Lạp vẫn nói “một nhà tiên tri”; bản dịch không nên đưa phần nhận diện theo ngữ cảnh vào bên trong lời trích.
- issue: Phạm vi nghĩa của ἀδελφῶν
  choice: Dịch bằng ngôn ngữ thân tộc “anh em mình.”
  alternative: Dịch diễn giải là “đồng bào Israel” hoặc mở rộng thành “anh chị em.”
  rationale: Danh từ nguồn ở giống đực số nhiều và chỉ những người cùng dân giao ước; chú thích giải thích phạm vi đại diện mà không xóa hình thức thân tộc của nguyên văn.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, dễ hiểu. Dùng “Môi-se,” “nhà tiên tri,” “dấy lên” và “nghe theo” theo lối diễn đạt Kinh Thánh quen thuộc mà không quá cổ; giữ cách xưng hô số nhiều “anh em” phù hợp lời nói với cộng đồng Israel.
