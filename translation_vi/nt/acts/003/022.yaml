  to: 'Môi-se quả thật đã nói: “Chúa, Đức Chúa Trời[b] sẽ dấy lên cho anh em một nhà tiên tri từ giữa anh em mình[a], giống như tôi. Anh em phải nghe theo người ấy trong mọi điều người ấy nói với anh em.”'
