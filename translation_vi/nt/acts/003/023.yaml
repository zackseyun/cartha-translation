id: ACT.3.23
reference: Acts 3:23
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἔσται δὲ πᾶσα ψυχὴ ἥτις ⸀ἂν μὴ ἀκούσῃ τοῦ προφήτου ἐκείνου ἐξολεθρευθήσεται ἐκ τοῦ λαοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/023.yaml
  text: And every person who does not listen to that prophet will be utterly destroyed from among the people[a].
translation:
  language: vi
  text: Và bất cứ ai không nghe theo vị tiên tri ấy sẽ bị tiêu diệt hoàn toàn khỏi dân chúng.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “sẽ bị loại khỏi dân chúng.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶσα ψυχὴ
  choice: bất cứ ai
  rationale: Trong thành ngữ này, ψυχή chỉ một con người, không nhấn mạnh sự phân chia thân xác và linh hồn. “Bất cứ ai” diễn đạt tự nhiên phạm vi bao quát của πᾶσα cùng mệnh đề quan hệ bất định theo sau.
- source_word: ἥτις ἂν μὴ ἀκούσῃ
  choice: không nghe theo
  rationale: ἀκούω ở đây không chỉ là nghe âm thanh mà hàm ý lắng nghe và đáp ứng. “Nghe theo” truyền đạt rõ sắc thái vâng phục trong bối cảnh giao ước mà không giải thích quá mức.
- source_word: τοῦ προφήτου ἐκείνου
  choice: vị tiên tri ấy
  rationale: Cụm từ chỉ vị tiên tri đã được nhắc đến trước đó. Không viết hoa “tiên tri” vì tiếng Hy Lạp không đánh dấu đây là một danh hiệu chính thức, dù đối tượng được nói đến là xác định.
- source_word: ἐξολεθρευθήσεται
  choice: sẽ bị tiêu diệt hoàn toàn
  rationale: Động từ tương lai bị động ἐξολεθρεύω diễn tả sự hủy diệt hoặc loại bỏ triệt để, mạnh hơn cách nói đơn giản “bị diệt”. Bản dịch giữ nguyên mức độ nghiêm trọng ấy.
- source_word: ἐκ τοῦ λαοῦ
  choice: khỏi dân chúng
  rationale: ἐκ diễn tả việc bị loại khỏi cộng đồng dân sự được nói đến. “Khỏi dân chúng” tự nhiên trong tiếng Việt và không thêm đại từ sở hữu vốn không có trong nguyên văn.
theological_decisions:
- issue: Bản chất của sự phán xét được cảnh báo trong lời trích dẫn hoặc ám chỉ Phục Truyền Luật Lệ Ký 18:19
  choice: Diễn đạt sự hủy diệt và loại khỏi dân chúng mà không xác định thời điểm hay hình thức của sự phán xét.
  alternative: Chỉ hiểu là bị khai trừ khỏi cộng đồng giao ước, hoặc chỉ hiểu là sự phán xét chung cuộc.
  rationale: Câu này công bố sự phán xét nghiêm khắc đối với người không nghe theo vị tiên tri, nhưng không tự xác định đầy đủ đó là hình phạt trong lịch sử, sự loại trừ khỏi giao ước hay sự phán xét cánh chung. Bản dịch giữ nguyên sự căng thẳng ấy.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. “Vị tiên tri ấy” giúp chỉ rõ đối tượng đã được nhắc trước; “nghe theo” thể hiện việc nghe có đáp ứng; dấu chú thích [a] được đặt ngay sau câu.
