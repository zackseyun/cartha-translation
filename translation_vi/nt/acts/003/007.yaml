source:
  edition: SBLGNT
  text: καὶ πιάσας αὐτὸν τῆς δεξιᾶς χειρὸς ἤγειρεν ⸀αὐτόν· παραχρῆμα δὲ ἐστερεώθησαν ⸂αἱ βάσεις αὐτοῦ⸃ καὶ τὰ ⸀σφυδρά,
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/007.yaml
  text: And taking him by the right hand[a], he raised him up; and immediately his feet and ankles were strengthened.
translation:
  language: vi
  text: Ông nắm lấy tay phải của người ấy và đỡ người ấy đứng dậy; lập tức bàn chân và mắt cá chân[a] của người ấy trở nên vững chắc.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “xương mắt cá chân.”'
    reason: Giữ lại khả năng hiểu τὰ σφυδρά theo nghĩa cụ thể hơn là các xương mắt cá chân.
lexical_decisions:
- source_word: πιάσας
  choice: nắm lấy
  rationale: Diễn tả hành động tiếp xúc chắc chắn nhưng đầy thiện ý; tự nhiên hơn “chộp lấy” và rõ hơn “cầm” trong ngữ cảnh đỡ người đứng lên.
- source_word: τῆς δεξιᾶς χειρός
  choice: tay phải người ấy
  rationale: Cấu trúc sở hữu sau πιάσας được chuyển sang cách nói tự nhiên trong tiếng Việt; ngữ cảnh cho thấy đây là tay phải của người được chữa lành.
- source_word: ἤγειρεν αὐτόν
  choice: đỡ người ấy đứng dậy
  rationale: Giữ ý hành động nâng người ấy lên, đồng thời diễn đạt tự nhiên trong bối cảnh một người què được nắm tay để đứng dậy; không thêm tác nhân thần linh vào mệnh đề.
- source_word: παραχρῆμα
  choice: lập tức
  rationale: Thể hiện rõ tính tức thời và đột ngột của kết quả.
- source_word: ἐστερεώθησαν
  choice: trở nên vững mạnh
  rationale: Diễn tả kết quả các bộ phận cơ thể được làm cho chắc khỏe mà không chỉ rõ tác nhân vốn không được nêu trong mệnh đề Hy Lạp.
- source_word: αἱ βάσεις αὐτοῦ
  choice: bàn chân của người ấy
  rationale: βάσεις chỉ các phần nâng đỡ cơ thể, trong ngữ cảnh này là bàn chân; “bàn chân” vừa chính xác vừa tự nhiên trong tiếng Việt.
- source_word: τὰ σφυδρά
  choice: mắt cá chân
  rationale: Chỉ vùng hoặc khớp mắt cá chân; cách dịch này tự nhiên và không thu hẹp nghĩa quá mức thành riêng phần xương.
theological_decisions:
- issue: Bản chất của lời mô tả sự chữa lành
  choice: Trình bày trực tiếp việc các bộ phận cơ thể lập tức trở nên vững mạnh, không giải thích cơ chế của phép lạ.
  alternative: Dịch thành “được chữa lành” hoặc nêu rõ Đức Chúa Trời là tác nhân trong chính mệnh đề này.
  rationale: Bản văn mô tả kết quả cụ thể nơi cơ thể nhưng không dùng động từ “chữa lành” và không nêu tác nhân trong mệnh đề; bản dịch giữ nguyên cách trình bày và để văn cảnh bộc lộ ý nghĩa phép lạ.
translation_notes:
  register: Văn phong kể chuyện trang trọng vừa phải, rõ ràng và tự nhiên đối với độc giả Việt Nam hiện đại. Lặp “người ấy” để tránh đại từ mơ hồ khi câu được đọc riêng, đồng thời không thêm tên chủ thể vốn không xuất hiện trong câu Hy Lạp.
