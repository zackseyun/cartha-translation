    issue: «Đấng Khởi Nguồn sự sống» là cách kết hợp từ chưa tự nhiên.
    rationale: «Khởi nguồn» thường vận hành như động từ/cụm động từ hơn là thành tố danh hiệu. «Đấng Khởi Nguyên của sự sống» vừa tự nhiên vừa bảo toàn nét nghĩa originator của ἀρχηγός.
  - severity: medium
    issue: Chú thích a nêu «Chúa của sự sống» là phương án dịch ἀρχηγός.
    rationale: «Chúa» thêm một danh hiệu không được biểu đạt bởi ἀρχηγός và không phản ánh các lựa chọn từ vựng được nguồn/audit trail nêu. Nên thay bằng phương án như «Đấng Tiên Phong của sự sống».
