  text: τὸν δὲ ἀρχηγὸν τῆς ζωῆς ἀπεκτείνατε, ὃν ὁ θεὸς ἤγειρεν ἐκ νεκρῶν, οὗ ἡμεῖς μάρτυρές ἐσμεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/015.yaml
  text: but you killed the Author of life[a], whom God raised from the dead[b], of which we are witnesses.
translation:
  language: vi
  text: Nhưng anh em đã giết Đấng Khởi Nguyên của sự sống[a], là Đấng Đức Chúa Trời đã làm cho sống lại từ cõi chết; chúng tôi là những người làm chứng về điều ấy.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “Đấng Dẫn Đầu của sự sống,” “Đấng Tiên Phong của sự sống,” hoặc “Đấng Sáng Lập sự sống.” Từ Hy Lạp ἀρχηγός có thể mang ý nghĩa khởi nguồn, dẫn đầu hoặc đứng đầu.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể hiểu là “chúng tôi là những người làm chứng về Đấng ấy.” Tiếng Hy Lạp có thể chỉ chính Đấng đã sống lại hoặc sự kiện Ngài sống lại.
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: Nhưng
  rationale: Trong mạch cáo buộc ở câu trước, δέ tạo sự tương phản nhẹ nhưng sắc nét; “Nhưng” tự nhiên trong tiếng Việt và làm nổi bật nghịch lý giữa sự sống và việc giết chết.
- source_word: ἀρχηγὸν
  choice: Đấng Khởi Nguồn
  rationale: ἀρχηγός có thể chỉ người khởi đầu, người sáng lập, người dẫn đầu hoặc nhân vật đứng đầu. “Đấng Khởi Nguồn” truyền đạt rõ nét ý nghĩa nguồn gốc trong cụm này, đồng thời giữ sắc thái tôn kính của một danh hiệu; các nghĩa lãnh đạo được ghi ở chú thích.
- source_word: τῆς ζωῆς
  choice: sự sống
  rationale: Dịch trực tiếp bổ ngữ sở hữu, tạo thành danh hiệu cô đọng “Đấng Khởi Nguồn sự sống”.
- source_word: ἀπεκτείνατε
  choice: anh em đã giết
  rationale: Động từ aorist nêu thẳng hành động đã xảy ra. “Đã giết” rõ ràng, trực tiếp và không thêm sắc thái pháp lý của “sát hại”. Đại từ số nhiều được diễn đạt bằng “anh em”, phù hợp lời Phi-e-rơ nói với đám đông mà không hàm ý giới tính sinh học.
- source_word: ἤγειρεν ἐκ νεκρῶν
  choice: đã khiến sống lại từ cõi chết
  rationale: Diễn đạt tự nhiên lời tuyên bố về sự phục sinh, đồng thời giữ Đức Chúa Trời là chủ thể hành động. “Cõi chết” chuyển tải thành ngữ số nhiều ἐκ νεκρῶν mà không gợi rằng chỉ một thi thể được nói đến.
- source_word: οὗ
  choice: về điều ấy
  rationale: Đại từ quan hệ ở sở hữu cách có thể quy chiếu đến chính Đấng đã sống lại hoặc sự kiện Ngài được khiến sống lại. Bản chính chọn cách hiểu theo sự kiện phục sinh vì phù hợp cú pháp tiếng Việt và mạch rao giảng, đồng thời ghi cách hiểu kia trong chú thích.
- source_word: μάρτυρές ἐσμεν
  choice: chúng tôi là những người làm chứng
  rationale: Giữ cấu trúc danh từ của tiếng Hy Lạp, nhấn mạnh tư cách chứng nhân của các sứ đồ thay vì chỉ chuyển thành động từ “chúng tôi làm chứng”.
theological_decisions:
- issue: Cách dịch danh hiệu Kitô học ἀρχηγὸν τῆς ζωῆς
  choice: Đấng Khởi Nguồn sự sống
  alternative: Đấng Dẫn Đầu sự sống; Đấng Khai Mở sự sống; Chúa của sự sống
  rationale: 'Từ Hy Lạp kết hợp các nét nghĩa khởi nguồn, khai mở và lãnh đạo. Trong văn cảnh, “Đấng Khởi Nguồn sự sống” làm rõ nghịch lý: họ đã giết Đấng gắn với nguồn gốc của sự sống, nhưng không loại bỏ các khả năng từ vựng khác, vốn được nêu trong chú thích.'
- issue: Sở chỉ của οὗ trong mệnh đề về chứng nhân
  choice: Chúng tôi là những người làm chứng về điều ấy
  alternative: Chúng tôi là những người làm chứng về Đấng ấy
  rationale: Ngữ pháp Hy Lạp cho phép lời chứng hướng đến Đấng đã sống lại hoặc đến sự kiện Ngài sống lại. Bản chính chọn sự kiện phục sinh theo trọng tâm gần nhất của lời tuyên bố, nhưng giữ sự mơ hồ thật sự bằng chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và trực tiếp. “Anh em” giữ sắc thái diễn từ công khai quen thuộc trong tiếng Việt Kinh Thánh; “Đấng” đánh dấu danh hiệu tôn kính. Dấu chấm phẩy duy trì một câu duy nhất như tiếng Hy Lạp nhưng giúp người đọc nhận rõ mệnh đề kết luận về các chứng nhân.
