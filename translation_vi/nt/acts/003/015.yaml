revisions:
- from: Nhưng anh em đã giết Đấng Khởi Nguồn sự sống[a], là Đấng Đức Chúa Trời đã khiến sống lại từ cõi chết; chúng tôi là những người làm chứng về điều ấy.[b]
  to: Nhưng anh em đã giết Đấng Khởi Nguyên của sự sống[a], là Đấng Đức Chúa Trời đã làm cho sống lại từ cõi chết; chúng tôi là những người làm chứng về điều ấy.[b]
  rationale: Sửa danh hiệu chính để có tiếng Việt tự nhiên hơn và phản ánh rõ nghĩa khởi nguyên của ἀρχηγός; chỉnh chú thích để chỉ nêu các khả năng thuộc phạm vi nghĩa của từ Hy Lạp. Những yếu tố còn lại được giữ nguyên về nghĩa, gồm cách chọn «về điều ấy» cùng chú thích nhằm bảo toàn khả năng quy chiếu của οὗ.
  reviewer_model: gpt-5.6-terra
