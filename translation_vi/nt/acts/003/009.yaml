translation:
  language: vi
  text: Cả dân chúng đều thấy người ấy bước đi và ca ngợi Đức Chúa Trời.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: đều
  rationale: Liên từ nối câu theo mạch kể; trong tiếng Việt, không nhất thiết dịch thành “và” ở đầu câu. Từ “đều” đồng thời diễn đạt tự nhiên ý tập thể của πᾶς.
- source_word: εἶδεν
  choice: thấy
  rationale: Động từ ở thì aorist thuật lại việc dân chúng nhận thấy người đã được chữa lành; “thấy” là cách diễn đạt trực tiếp và tự nhiên.
- source_word: πᾶς ὁ λαὸς
  choice: cả dân chúng
  rationale: Cụm từ mang nghĩa tập thể, chỉ toàn thể những người hiện diện; “cả dân chúng” tự nhiên hơn “toàn dân” trong bối cảnh cảnh tượng tại đền thờ.
- source_word: αὐτὸν
  choice: anh
  rationale: Đại từ chỉ người đàn ông được chữa lành trong ngữ cảnh trước; “anh” là đại từ ngôi ba tự nhiên, trung tính và trang trọng vừa phải.
- source_word: περιπατοῦντα
  choice: bước đi
  rationale: Phân từ hiện tại mô tả hành động đang diễn ra và nhấn mạnh bằng chứng hữu hình của sự chữa lành; “bước đi” giữ được sắc thái này rõ hơn “đi”.
- source_word: καὶ αἰνοῦντα
  choice: và ca ngợi
  rationale: 'Giữ phép phối hợp giữa hai phân từ đồng thời: anh vừa bước đi vừa ca ngợi. “Ca ngợi” phù hợp với sự tôn vinh trong bối cảnh thờ phượng.'
- source_word: τὸν θεόν
  choice: Đức Chúa Trời
  rationale: Chỉ Đấng được ca ngợi; “Đức Chúa Trời” là danh xưng tiếng Việt trang trọng, dễ hiểu và không thêm nội dung ngoài nguyên văn.
