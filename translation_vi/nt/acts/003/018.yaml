id: ACT.3.18
reference: Acts 3:18
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ δὲ θεὸς ἃ προκατήγγειλεν διὰ στόματος πάντων τῶν ⸀προφητῶν παθεῖν τὸν χριστὸν ⸀αὐτοῦ ἐπλήρωσεν οὕτως.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/018.yaml
  text: But God thus fulfilled what he had announced beforehand through the mouth of all the prophets[b][a], that his Messiah would suffer.
translation:
  language: vi
  text: Nhưng Đức Chúa Trời đã làm ứng nghiệm như vậy điều Ngài đã báo trước qua miệng tất cả các nhà tiên tri[a], rằng Đấng Mê-si của Ngài sẽ chịu khổ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “qua tất cả các nhà tiên tri.” Nguyên văn Hy Lạp sát nghĩa hơn là “qua miệng tất cả các nhà tiên tri.”
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn Hy Lạp là “Đấng Christ của Ngài”; ở đây dịch là “Đấng Mê-si của Ngài” vì Χριστός được dùng như một tước hiệu.
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: Nhưng
  rationale: Nêu sự tương phản với hành động của những người nghe được nói đến ở câu trước.
- source_word: προκατήγγειλεν
  choice: báo trước
  rationale: Diễn đạt cả ý công bố và tính chất xảy ra từ trước bằng tiếng Việt tự nhiên, gọn rõ.
- source_word: διὰ στόματος πάντων τῶν προφητῶν
  choice: qua miệng tất cả các nhà tiên tri
  rationale: Giữ hình ảnh cụ thể của thành ngữ Hy Lạp và không lược bỏ πάντων, dù cách nói này hơi mang sắc thái Kinh Thánh.
- source_word: παθεῖν
  choice: sẽ chịu khổ
  rationale: Diễn đạt nội dung lời tiên báo mà không thêm sắc thái tất yếu như 'phải chịu khổ'.
- source_word: τὸν χριστὸν αὐτοῦ
  choice: Đấng Mê-si của Ngài
  rationale: Χριστός mang chức năng tước hiệu trong văn cảnh; αὐτοῦ chỉ Đấng Mê-si thuộc về hoặc được Đức Chúa Trời chỉ định.
- source_word: ἐπλήρωσεν
  choice: đã làm ứng nghiệm
  rationale: Cách diễn đạt quen thuộc, rõ nghĩa trong văn cảnh lời tiên tri được hoàn thành.
- source_word: οὕτως
  choice: theo cách ấy
  rationale: 'Giữ ý chỉ cách thức: Đức Chúa Trời làm ứng nghiệm lời đã báo trước bằng những sự việc vừa được thuật lại.'
theological_decisions:
- issue: Cách dịch Χριστός
  choice: Đấng Mê-si
  alternative: Đấng Christ
  rationale: Từ này được dùng như một tước hiệu trong bài giảng mang bối cảnh Do Thái; 'Đấng Mê-si' làm rõ chức năng ấy mà không biến nó thành tên riêng.
- issue: Sắc thái của παθεῖν trong lời tiên tri
  choice: sẽ chịu khổ
  alternative: phải chịu khổ
  rationale: Bản dịch nêu nội dung được báo trước nhưng không đưa thêm sắc thái tất yếu vốn không được chính hình thái động từ này biểu thị rõ.
- issue: Quan hệ cú pháp giữa παθεῖν τὸν χριστὸν αὐτοῦ và điều được báo trước
  choice: 'Dùng dấu hai chấm để giới thiệu nội dung: ''Đấng Mê-si của Ngài sẽ chịu khổ'''
  alternative: Dùng mệnh đề với 'rằng'
  rationale: Tiếng Hy Lạp cho phép hiểu cụm nguyên mẫu là nội dung của điều Đức Chúa Trời báo trước. Dấu hai chấm làm quan hệ ấy rõ và tự nhiên trong tiếng Việt mà không thêm ý thần học.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ thành ngữ Kinh Thánh “qua miệng” vì hình ảnh này có mặt rõ trong nguyên văn; chú thích cung cấp cách nói tự nhiên hơn. Viết hoa đại từ “Ngài” theo quy ước tôn kính phổ biến trong tiếng Việt.
