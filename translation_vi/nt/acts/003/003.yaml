  text: ὃς ἰδὼν Πέτρον καὶ Ἰωάννην μέλλοντας εἰσιέναι εἰς τὸ ἱερὸν ἠρώτα ἐλεημοσύνην ⸀λαβεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/003.yaml
  text: When he saw Peter and John about to go into the temple, he began asking to receive alms.
translation:
  language: vi
  text: Khi thấy Phi-e-rơ và Giăng sắp bước vào khuôn viên đền thờ, ông xin họ bố thí.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὃς ἰδὼν
  choice: Khi thấy ... ông
  rationale: Đại từ quan hệ chỉ người què ở câu trước; chuyển thành mệnh đề thời gian giúp câu tiếng Việt tự nhiên mà vẫn giữ quan hệ của phân từ aorist.
- source_word: Πέτρον καὶ Ἰωάννην
  choice: Phi-e-rơ và Giăng
  rationale: Dùng dạng tên riêng quen thuộc trong tiếng Việt.
- source_word: μέλλοντας εἰσιέναι
  choice: sắp bước vào
  rationale: Diễn đạt hành động sắp xảy ra trong bối cảnh trực tiếp; “bước vào” tự nhiên và rõ hơn “đi vào” ở đây.
- source_word: εἰς τὸ ἱερὸν
  choice: vào khuôn viên đền thờ
  rationale: ἱερόν chỉ toàn bộ khu vực hay quần thể đền thờ, không riêng nơi thánh bên trong; đưa nét nghĩa này vào chính văn giúp tránh hiểu lầm.
- source_word: ἠρώτα
  choice: xin
  rationale: Thì chưa hoàn thành có thể gợi hành động đang diễn ra hoặc lặp lại, nhưng tiếng Việt không cần ép thành “bắt đầu xin”; động từ “xin” trong cảnh ăn xin truyền đạt tự nhiên hành động thỉnh cầu.
- source_word: ἐλεημοσύνην λαβεῖν
  choice: xin họ bố thí
  rationale: Cụm Hy Lạp nói về việc xin để nhận một khoản cứu tế. Tiếng Việt tự nhiên dùng “xin [ai] bố thí”, trong đó ý nhận đã hàm chứa, tránh lối dịch cứng “xin để nhận của bố thí”.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Bố thí” phù hợp bối cảnh người què xin tiền cứu tế; “khuôn viên đền thờ” diễn đạt chính xác phạm vi nghĩa của ἱερόν nên không cần chú thích.
