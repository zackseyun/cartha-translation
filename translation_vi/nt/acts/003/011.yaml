id: ACT.3.11
reference: Acts 3:11
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Κρατοῦντος δὲ ⸀αὐτοῦ τὸν Πέτρον καὶ ⸀τὸν Ἰωάννην συνέδραμεν ⸂πᾶς ὁ λαὸς πρὸς αὐτοὺς⸃ ἐπὶ τῇ στοᾷ τῇ καλουμένῃ Σολομῶντος ἔκθαμβοι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/011.yaml
  text: While he was holding on to Peter and John[a], all the people, utterly astonished[b], ran together to them at the portico called Solomon’s.
translation:
  language: vi
  text: Trong khi người ấy vẫn nắm chặt Phi-e-rơ và Giăng[a], toàn thể dân chúng hết sức kinh ngạc, cùng chạy đến chỗ họ tại hành lang có tên là Sa-lô-môn[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “bám chặt lấy Phi-e-rơ và Giăng.” Động từ Hy Lạp có thể nhấn mạnh việc nắm chắc hoặc bám chặt.'
    reason: lexical_alternative
  - marker: b
    text: “Hành lang” ở đây là một lối đi có mái che và hàng cột trong khuôn viên đền thờ, theo truyền thống được gọi là Hành Lang Sa-lô-môn.
    reason: cultural_note
lexical_decisions:
- source_word: Κρατοῦντος δὲ αὐτοῦ
  choice: Trong khi người ấy vẫn nắm chặt
  rationale: Kết cấu sở hữu cách tuyệt đối với phân từ hiện tại diễn tả hành động xảy ra đồng thời. “Vẫn nắm chặt” truyền đạt sắc thái giữ chắc của κρατέω mà không gán thêm động cơ cảm xúc.
- source_word: τὸν Πέτρον καὶ τὸν Ἰωάννην
  choice: Phi-e-rơ và Giăng
  rationale: Dùng dạng tên riêng quen thuộc trong Kinh Thánh tiếng Việt, giúp độc giả hiện đại dễ nhận biết.
- source_word: συνέδραμεν
  choice: cùng chạy đến
  rationale: Diễn đạt cả chuyển động nhanh lẫn ý nhiều người hội tụ về một chỗ trong động từ συντρέχω.
- source_word: πᾶς ὁ λαὸς
  choice: toàn thể dân chúng
  rationale: Phản ánh sát ý bao quát của πᾶς và nghĩa tập thể của λαός trong bối cảnh khuôn viên đền thờ.
- source_word: πρὸς αὐτούς
  choice: đến chỗ họ
  rationale: Diễn đạt tự nhiên hướng chuyển động về phía Phi-e-rơ, Giăng và người được chữa lành.
- source_word: ἐπὶ τῇ στοᾷ
  choice: tại hành lang
  rationale: στοά chỉ một hành lang có mái che và hàng cột; “hành lang” là cách gọi tự nhiên, dễ hiểu trong tiếng Việt, còn chi tiết kiến trúc được làm rõ ở chú thích.
- source_word: τῇ καλουμένῃ Σολομῶντος
  choice: có tên là Sa-lô-môn
  rationale: Giữ ý của καλουμένῃ và tên gọi truyền thống của địa điểm mà không lặp lại danh từ “hành lang”.
- source_word: ἔκθαμβοι
  choice: hết sức kinh ngạc
  rationale: Giữ cường độ mạnh của ἔκθαμβος và chuyển cấu trúc bổ nghĩa của tiếng Hy Lạp thành cách diễn đạt tự nhiên trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong trang trọng vừa phải, hiện đại và dễ hiểu. Câu giữ trình tự chính của nguyên văn nhưng điều chỉnh tự nhiên theo cú pháp tiếng Việt; không giải thích nguyên nhân người được chữa lành nắm lấy hai sứ đồ.
