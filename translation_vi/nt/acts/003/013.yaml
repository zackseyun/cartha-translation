id: ACT.3.13
reference: Acts 3:13
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ θεὸς Ἀβραὰμ καὶ ⸂Ἰσαὰκ καὶ⸃ Ἰακώβ, ὁ θεὸς τῶν πατέρων ἡμῶν, ἐδόξασεν τὸν παῖδα αὐτοῦ Ἰησοῦν, ὃν ὑμεῖς ⸀μὲν παρεδώκατε καὶ ⸀ἠρνήσασθε κατὰ πρόσωπον Πιλάτου, κρίναντος ἐκείνου ἀπολύειν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/013.yaml
  text: The God of Abraham and Isaac and Jacob[a], the God of our fathers, has glorified his servant Jesus, whom you handed over and denied before Pilate, when he had decided to release him.
translation:
  language: vi
  text: Đức Chúa Trời của Áp-ra-ham, I-sác và Gia-cốp, Đức Chúa Trời của các tổ phụ chúng ta, đã làm vinh hiển tôi tớ Ngài là Đức Giê-su[a], Đấng mà anh em đã giao nộp và chối bỏ trước mặt Phi-lát, khi ông đã quyết định trả tự do cho Ngài.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “người con của Ngài là Đức Giê-su.” Từ Hy Lạp παῖς có thể có nghĩa là “người con” hoặc “tôi tớ”; ở đây chọn “tôi tớ” vì câu này có thể gợi đến Người Tôi Tớ trong sách Ê-sai.
    reason: Bảo lưu sự đa nghĩa thực sự của παῖς và giải thích lựa chọn dịch theo liên văn bản.
lexical_decisions:
- source_word: ὁ θεὸς Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακώβ
  choice: Đức Chúa Trời của Áp-ra-ham, I-sác và Gia-cốp
  rationale: Giữ nguyên công thức giao ước gợi lại Xuất Ai Cập 3:6; duy trì liên từ trước tên cuối nhưng dùng dấu phẩy theo lối tiếng Việt tự nhiên.
- source_word: ὁ θεὸς τῶν πατέρων ἡμῶν
  choice: Đức Chúa Trời của các tổ phụ chúng ta
  rationale: “Tổ phụ” vừa chuyển tải ý nghĩa tổ tiên, vừa giữ sắc thái lịch sử giao ước và trang trọng của πατέρων trong ngữ cảnh này.
- source_word: ἐδόξασεν
  choice: đã làm vinh hiển
  rationale: Diễn đạt hành động hoàn tất của động từ aorist và giữ sức nặng thần học của δοξάζω, thay vì làm phẳng thành “tôn trọng” hay “ban danh dự”.
- source_word: τὸν παῖδα αὐτοῦ Ἰησοῦν
  choice: tôi tớ Ngài là Đức Giê-su
  rationale: “Tôi tớ” phù hợp với tiếng vọng có khả năng hướng đến Người Tôi Tớ trong Ê-sai; chú thích vẫn bảo lưu nghĩa “người con” vốn có thể có của παῖς.
- source_word: παρεδώκατε
  choice: anh em đã giao nộp
  rationale: “Giao nộp” diễn đạt việc trao Đức Giê-su vào tay nhà cầm quyền mà không thêm ý “phản bội” vốn không nhất thiết nằm trong động từ ở đây.
- source_word: ἠρνήσασθε
  choice: chối bỏ
  rationale: “Chối bỏ” tự nhiên hơn “phủ nhận” khi nói về việc khước từ một con người, đồng thời giữ sắc thái mạnh của ἀρνέομαι.
- source_word: κατὰ πρόσωπον Πιλάτου
  choice: trước mặt Phi-lát
  rationale: Chuyển tải sát thành ngữ “trước mặt” và làm rõ tính công khai, trực diện của hành động.
- source_word: κρίναντος ἐκείνου ἀπολύειν
  choice: trong khi ông đã quyết định trả tự do cho Ngài
  rationale: “Quyết định” thể hiện κρίναντος trong bối cảnh xét xử; “trả tự do” là cách nói tự nhiên cho ἀπολύειν. “Trong khi” giữ cả quan hệ thời gian lẫn sự tương phản rõ ràng trong ngữ cảnh.
theological_decisions:
- issue: Cách dịch παῖς khi chỉ về Đức Giê-su
  choice: tôi tớ
  alternative: người con
  rationale: Ngữ cảnh Công Vụ và tiếng vọng từ các bài ca về Người Tôi Tớ trong Ê-sai khiến “tôi tớ” có khả năng cao hơn, nhưng từ Hy Lạp tự nó cũng có thể mang nghĩa “người con”; vì vậy nghĩa thay thế được ghi chú thay vì bị loại bỏ.
- issue: Giá trị thời-thể của ἐδόξασεν
  choice: đã làm vinh hiển
  alternative: làm cho được vinh hiển
  rationale: Dấu hiệu “đã” diễn đạt tự nhiên hành động aorist đã xảy ra mà không áp đặt một phân tích thần học chi tiết hơn về cách thức hay thời điểm Đức Chúa Trời làm vinh hiển Đức Giê-su.
- issue: Quan hệ của mệnh đề κρίναντος ἐκείνου ἀπολύειν
  choice: trong khi ông đã quyết định trả tự do cho Ngài
  alternative: khi ông đã quyết định trả tự do cho Ngài
  rationale: Phân từ sở hữu tuyệt đối có thể được hiểu chủ yếu theo thời gian; “trong khi” bảo lưu giá trị ấy nhưng cũng cho thấy sự tương phản ngữ cảnh giữa quyết định của Phi-lát và hành động của người nghe, không biến nó thành một nhượng bộ minh thị mạnh hơn bản văn.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, dùng các tên riêng Kinh Thánh quen thuộc trong tiếng Việt. “Anh em” phù hợp với lời diễn thuyết trực tiếp trước cộng đồng; “tổ phụ” và “tôi tớ” giữ sắc thái giao ước và liên văn bản mà vẫn dễ hiểu.
