  to: Đức Chúa Trời của Áp-ra-ham, I-sác và Gia-cốp, Đức Chúa Trời của các tổ phụ chúng ta, đã làm vinh hiển tôi tớ Ngài là Đức Giê-su[a], Đấng mà anh em đã giao nộp và chối bỏ trước mặt Phi-lát, khi ông đã quyết định trả tự do cho Ngài.
