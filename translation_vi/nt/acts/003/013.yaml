  - severity: low
    issue: “Trong khi ông đã quyết định” biểu thị tương phản rõ hơn mức cần thiết.
    rationale: κρίναντος ἐκείνου ἀπολύειν là phân từ sở hữu tuyệt đối; quan hệ thời gian “khi” là cách dịch trung tính, không loại trừ sự tương phản do ngữ cảnh tự tạo ra.
