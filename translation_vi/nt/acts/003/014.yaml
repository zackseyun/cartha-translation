id: ACT.3.14
reference: Acts 3:14
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὑμεῖς δὲ τὸν ἅγιον καὶ δίκαιον ἠρνήσασθε καὶ ᾐτήσασθε ἄνδρα φονέα χαρισθῆναι ὑμῖν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/014.yaml
  text: But you denied the Holy and Righteous One[a], and asked for a murderer to be granted to you,
translation:
  language: vi
  text: Nhưng anh em đã chối bỏ Đấng Thánh và Công Chính, lại xin cho mình một kẻ giết người[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay theo ngữ cảnh rõ hơn: “xin phóng thích cho mình một kẻ giết người.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς δὲ
  choice: Nhưng anh em
  rationale: δέ nêu sự tương phản với câu trước, còn đại từ ὑμεῖς tạo sắc thái nhấn mạnh trực tiếp. “Nhưng anh em” truyền đạt tự nhiên cả hai nét nghĩa trong tiếng Việt.
- source_word: τὸν ἅγιον καὶ δίκαιον
  choice: Đấng Thánh và Công Chính
  rationale: Mạo từ đi với hai tính từ được dùng như danh từ để chỉ Chúa Giê-su. “Đấng” thể hiện chức năng danh xưng, còn viết hoa giữ sắc thái tôn xưng mà không thêm nội dung ngoài nguyên văn.
- source_word: ἠρνήσασθε
  choice: đã chối bỏ
  rationale: ἀρνέομαι mang nghĩa phủ nhận, không nhận hoặc ruồng bỏ. “Chối bỏ” phù hợp với hành động công khai khước từ Chúa Giê-su trong ngữ cảnh.
- source_word: ᾐτήσασθε
  choice: lại xin
  rationale: αἰτέω có nghĩa là xin hoặc yêu cầu. “Lại xin” tự nhiên trong tiếng Việt và làm rõ sự tương phản tiếp nối do καί liên kết.
- source_word: ἄνδρα φονέα
  choice: một kẻ giết người
  rationale: φονεύς chỉ người phạm tội giết người; ἄνδρα nhấn mạnh đó là một người nam nhưng không cần dịch tách thành “một người đàn ông là kẻ giết người”, vốn nặng nề trong tiếng Việt. “Một kẻ giết người” truyền đạt trọn ý và giữ sự đối lập mạnh với Đấng Thánh và Công Chính.
- source_word: χαρισθῆναι ὑμῖν
  choice: ban cho mình
  rationale: Dạng bị động của χαρίζομαι ở đây có nghĩa ban hoặc chuẩn thuận như một ân huệ. “Ban cho mình” giữ nghĩa rộng của động từ; đại từ phản thân “mình” quy chiếu tự nhiên về “anh em”. Nghĩa cụ thể theo ngữ cảnh là phóng thích được nêu trong chú thích.
theological_decisions:
- issue: Sắc thái Cơ Đốc học của τὸν ἅγιον καὶ δίκαιον
  choice: 'Dịch như một danh xưng của Chúa Giê-su: “Đấng Thánh và Công Chính”'
  alternative: 'Dịch thuần miêu tả: “người thánh khiết và công chính”'
  rationale: Cấu trúc Hy Lạp dùng hai tính từ như danh từ với chung một mạo từ, chỉ cùng một nhân vật. “Đấng” và cách viết hoa thể hiện sắc thái danh xưng mà không tách thành hai danh hiệu hoặc thêm khẳng định thần học ngoài câu.
- issue: Sắc thái pháp lý của χαρισθῆναι
  choice: 'Giữ nghĩa rộng trong chính văn: “ban cho mình”'
  alternative: 'Dịch rõ theo ngữ cảnh: “phóng thích cho mình”'
  rationale: Trong bối cảnh, điều được xin là việc thả người, nhưng bản thân χαρίζομαι rộng hơn, mang ý ban hoặc chuẩn thuận như một ân huệ. Chú thích bảo tồn cách hiểu cụ thể theo ngữ cảnh.
translation_notes:
  register: Văn phong hiện đại, trang trọng và trực tiếp. “Anh em” phù hợp với lời Phi-e-rơ nói với đám đông; “chối bỏ” giữ sức nặng cáo buộc; cấu trúc câu vẫn giữ sự đối lập gay gắt giữa Chúa Giê-su và kẻ giết người.
