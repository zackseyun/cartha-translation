id: ACT.3.6
reference: Acts 3:6
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἶπεν δὲ Πέτρος· Ἀργύριον καὶ χρυσίον οὐχ ὑπάρχει μοι, ὃ δὲ ἔχω τοῦτό σοι δίδωμι· ἐν τῷ ὀνόματι Ἰησοῦ Χριστοῦ τοῦ Ναζωραίου ⸀περιπάτει.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/006.yaml
  text: 'But Peter said[a], “Silver and gold I do not have, but what I do have, this I give to you: in the name of Jesus the Messiah the Nazarene[b], walk.”'
translation:
  language: vi
  text: 'Nhưng Phi-e-rơ nói: “Bạc và vàng tôi không có, nhưng điều tôi có thì tôi cho anh: nhân danh Giê-su, Đấng Mê-si-a[a] người Na-xa-rét[b], hãy bước đi.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “Đấng Christ.” Tiếng Hy Lạp Χριστός là một tước hiệu, nghĩa là “Đấng Mê-si-a.”'
    reason: alternative_reading
  - marker: b
    text: 'Hoặc: “đến từ Na-xa-rét.” Tiếng Hy Lạp dùng Ναζωραῖος, nghĩa sát hơn là “người Na-xa-rét.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀργύριον καὶ χρυσίον
  choice: Bạc và vàng
  rationale: Giữ nguyên cặp kim loại được tiếng Hy Lạp nêu rõ, đồng thời chuyển cấu trúc sở hữu sang tiếng Việt tự nhiên.
- source_word: οὐχ ὑπάρχει μοι
  choice: thì tôi không có
  rationale: Cụm này diễn tả sự sở hữu; cách dịch này tự nhiên và giữ được nét tương phản với mệnh đề tiếp theo.
- source_word: ὃ δὲ ἔχω τοῦτό σοι δίδωμι
  choice: nhưng điều tôi có, tôi trao cho anh
  rationale: Giữ sự nhấn mạnh của ὃ...τοῦτο mà không tạo câu tiếng Việt quá cứng; “anh” phù hợp với người đàn ông đang được Phi-e-rơ trực tiếp nói với.
- source_word: ἐν τῷ ὀνόματι
  choice: nhân danh
  rationale: Đây là cách diễn đạt tiếng Việt tự nhiên, có thể bao hàm hành động dựa trên danh và thẩm quyền của người được nêu.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Chúa Giê-su, Đấng Mê-si-a
  rationale: Χριστός mang nghĩa tước hiệu “Đấng Mê-si-a”; thêm “Chúa” theo quy ước tên gọi tiếng Việt phổ biến và dùng dấu phẩy để làm rõ tước hiệu đồng vị, dù κύριος không hiện diện trong nguyên văn.
- source_word: τοῦ Ναζωραίου
  choice: người Na-xa-rét
  rationale: Diễn đạt Ναζωραῖος theo lối tự nhiên trong tiếng Việt, chỉ người xuất thân từ Na-xa-rét; chú thích bảo lưu cách hiểu mang sắc thái danh xưng “người Na-xa-rét.”
- source_word: περιπάτει
  choice: hãy bước đi
  rationale: Mệnh lệnh hiện tại yêu cầu người què thực sự đi lại; “hãy bước đi” trang trọng, rõ nghĩa và không thêm sắc thái khởi đầu quá mức.
theological_decisions:
- issue: Cách dịch Χριστοῦ trong công thức nhân danh
  choice: Đấng Mê-si-a
  alternative: Đấng Christ
  rationale: Trong lời công bố chữa lành này, Χριστός vẫn có lực của một tước hiệu. “Đấng Mê-si-a” chuyển tải nghĩa của tước hiệu thay vì chỉ phiên âm theo truyền thống.
- issue: Ý nghĩa của ἐν τῷ ὀνόματι
  choice: nhân danh
  alternative: bởi thẩm quyền của
  rationale: “Nhân danh” bảo lưu ngôn ngữ nguyên bản và chiều sâu thần học, không thu hẹp cụm từ chỉ còn ý niệm thẩm quyền.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Duy trì cặp “bạc và vàng,” sự tương phản được nhấn mạnh và mệnh lệnh trực tiếp. Dùng “Đấng Mê-si-a” để dịch tước hiệu Χριστός; “người Na-xa-rét” tự nhiên hơn lối phiên âm danh xưng. Marker [a] xuất hiện đúng trong chính văn.
