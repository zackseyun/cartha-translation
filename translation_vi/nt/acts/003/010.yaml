  to: Họ nhận ra ông chính là người vẫn thường ngồi xin bố thí tại Cổng Đẹp của đền thờ[a], và họ đầy kinh ngạc và sửng sốt về điều đã xảy ra cho ông.
  rationale: Chỉ thay liên từ “nên” bằng “và” để không áp đặt quan hệ nguyên nhân–kết quả mạnh hơn liên từ δέ trong tiếng Hy Lạp; đồng thời điều chỉnh “vô cùng” thành “đầy” để phản ánh trực tiếp hơn ἐπλήσθησαν mà vẫn giữ tiếng Việt tự nhiên. Các yếu tố còn lại trung thành với nguyên văn và phù hợp văn phong hiện đại.
