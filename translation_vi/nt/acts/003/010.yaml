id: ACT.3.10
reference: Acts 3:10
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐπεγίνωσκον ⸀δὲ αὐτὸν ὅτι ⸀οὗτος ἦν ὁ πρὸς τὴν ἐλεημοσύνην καθήμενος ἐπὶ τῇ Ὡραίᾳ Πύλῃ τοῦ ἱεροῦ, καὶ ἐπλήσθησαν θάμβους καὶ ἐκστάσεως ἐπὶ τῷ συμβεβηκότι αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/010.yaml
  text: And they recognized him[a], that this was the man who used to sit for alms at the Beautiful Gate of the temple[b], and they were filled with amazement and astonishment at what had happened to him.
translation:
  language: vi
  text: Họ nhận ra ông chính là người vẫn thường ngồi xin bố thí tại Cổng Đẹp của đền thờ[a], và họ đầy kinh ngạc và sửng sốt về điều đã xảy ra cho ông.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hy Lạp ἱερόν chỉ toàn bộ khuôn viên đền thờ nói chung, không chỉ riêng nơi thánh bên trong (ναός).
    reason: cultural_note
lexical_decisions:
- source_word: ἐπεγίνωσκον
  choice: nhận ra
  rationale: Động từ ở thì chưa hoàn thành diễn tả việc đám đông nhận diện người đã được chữa lành; “nhận ra” tự nhiên trong văn kể chuyện tiếng Việt.
- source_word: οὗτος ἦν
  choice: ông chính là
  rationale: Giữ sắc thái nhấn mạnh, nhận diện người này là chính người ăn xin mà họ từng biết.
- source_word: ὁ πρὸς τὴν ἐλεημοσύνην καθήμενος
  choice: người vẫn thường ngồi xin bố thí
  rationale: Diễn đạt vai trò quen thuộc, kéo dài trong quá khứ của ông; “xin bố thí” rõ nghĩa và tự nhiên hơn cách dịch sát từng chữ.
- source_word: ἐπὶ τῇ Ὡραίᾳ Πύλῃ
  choice: tại Cổng Đẹp
  rationale: Ὡραία được dùng như tên gọi của cổng; viết hoa để thể hiện địa danh.
- source_word: τοῦ ἱεροῦ
  choice: của đền thờ
  rationale: “Đền thờ” là cách gọi thông dụng; chú thích làm rõ rằng ἱερόν chỉ toàn bộ khuôn viên chứ không riêng nơi thánh bên trong.
- source_word: ἐπλήσθησαν θάμβους καὶ ἐκστάσεως
  choice: vô cùng kinh ngạc và sửng sốt
  rationale: Diễn đạt tự nhiên cường độ của cấu trúc “đầy dẫy” hai trạng thái cảm xúc, đồng thời giữ hai từ gần nghĩa của nguyên bản.
- source_word: ἐπὶ τῷ συμβεβηκότι αὐτῷ
  choice: về điều đã xảy ra cho ông
  rationale: Phân từ hoàn thành chỉ sự việc đã xảy ra nhưng kết quả vẫn hiện hữu; “về” nối tự nhiên với phản ứng kinh ngạc và sửng sốt.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ông” cho người đàn ông trưởng thành; “bố thí” giữ đúng bối cảnh xã hội nhưng vẫn quen thuộc trong tiếng Việt. Liên từ δέ được chuyển thành “nên” theo quan hệ diễn ngôn tự nhiên giữa việc nhận diện và phản ứng của đám đông.
