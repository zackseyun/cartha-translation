    issue: Liên từ “nên” thêm sắc thái hệ quả.
    rationale: 'δέ là liên từ nhẹ, nối tiếp diễn biến: họ nhận ra ông, và họ kinh ngạc. Dù quan hệ ngữ cảnh có thể hàm ý, “nên” khẳng định quan hệ nhân quả mạnh hơn bản văn.'
