  source_fidelity: 'Bản nháp truyền đạt đúng các yếu tố chính: trời tiếp nhận Đấng ấy, tính tất yếu, giới hạn cho đến thời điểm phục hồi, lời Đức Chúa Trời phán qua các tiên tri thánh từ thuở xưa. Tuy nhiên, χρόνων là số nhiều, và “muôn vật được phục hồi” dễ chuyển trọng tâm sang các vật thể thay vì phạm vi rộng của πάντων (“mọi sự”).'
