  - severity: medium
    issue: πάντων được dịch là “muôn vật”.
    rationale: “Muôn vật” có thể gợi riêng thế giới vật thể hoặc các hữu thể. “Mọi sự” giữ phạm vi mở của πάντων và không quyết định trước ý nghĩa thần học của sự phục hồi.
  - severity: low
