  to: Trời phải tiếp nhận Đấng ấy cho đến những thời kỳ phục hồi mọi sự, là những điều Đức Chúa Trời đã phán qua miệng các tiên tri thánh của Ngài từ thuở xưa.
  rationale: 'Bản sửa giữ cấu trúc và tính mơ hồ của mệnh đề quan hệ ὧν ἐλάλησεν: “những điều” có thể liên hệ với “mọi sự” như trong nguyên văn, không thêm ý “về” hay một diễn giải giáo phái. Đồng thời sửa số nhiều của χρόνων, dùng “mọi sự” cho πάντων, và cải thiện trật tự câu tiếng Việt.'
