source:
  edition: SBLGNT
  text: ὃν δεῖ οὐρανὸν μὲν δέξασθαι ἄχρι χρόνων ἀποκαταστάσεως πάντων ὧν ἐλάλησεν ὁ θεὸς διὰ ⸀στόματος τῶν ἁγίων ⸂ἀπ’ αἰῶνος αὐτοῦ προφητῶν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/021.yaml
  text: whom heaven must receive until the times of the restoration of all things that God spoke through the mouth of his holy prophets from of old.
translation:
  language: vi
  text: Trời phải tiếp nhận Đấng ấy cho đến những thời kỳ phục hồi mọi sự, là những điều Đức Chúa Trời đã phán qua miệng các tiên tri thánh của Ngài từ thuở xưa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὃν
  choice: Đấng ấy
  rationale: Đại từ quan hệ chỉ về Chúa Giê-su trong ngữ cảnh trước; dùng “Đấng ấy” giúp câu tiếng Việt đứng độc lập mà vẫn giữ sắc thái tôn kính.
- source_word: δεῖ ... δέξασθαι
  choice: phải được ... tiếp nhận
  rationale: Giữ ý về sự tất yếu trong δεῖ và nghĩa tiếp nhận của δέχομαι; cấu trúc bị động tự nhiên hóa vừa phải trong tiếng Việt.
- source_word: οὐρανὸν
  choice: trời
  rationale: Giữ hình thức số ít và cách diễn đạt trực tiếp của nguyên văn; trong câu này “trời” được nhân cách hóa làm chủ thể tiếp nhận.
- source_word: ἄχρι χρόνων
  choice: cho đến thời kỳ
  rationale: χρόνων ở số nhiều có thể chỉ những thời điểm hay thời kỳ; tiếng Việt dùng “thời kỳ” tự nhiên và không buộc phải biểu thị số.
- source_word: ἀποκαταστάσεως πάντων
  choice: muôn vật được phục hồi
  rationale: ἀποκατάστασις mang nghĩa phục hồi hoặc lập lại; “muôn vật” diễn đạt πάντων theo nghĩa bao quát nhưng không tự ý xác định chi tiết phạm vi thần học.
- source_word: διὰ στόματος
  choice: qua miệng
  rationale: Giữ thành ngữ Semit trong nguyên văn, nhấn mạnh Đức Chúa Trời phán qua các tiên tri.
- source_word: ἀπ’ αἰῶνος
  choice: từ thuở xưa
  rationale: Diễn đạt tự nhiên ý nghĩa từ thời xa xưa, không áp đặt nghĩa triết học “từ đời đời” vốn không phù hợp rõ ràng với ngữ cảnh các tiên tri.
theological_decisions:
- issue: Phạm vi của ἀποκαταστάσεως πάντων
  choice: muôn vật được phục hồi
  alternative: sự phục hồi mọi sự
  rationale: Giữ tính bao quát và căng thẳng thần học của cụm Hy Lạp, không giải thích thành sự cứu rỗi phổ quát cũng không thu hẹp vào riêng dân Israel.
- issue: Quan hệ của mệnh đề ὧν ἐλάλησεν
  choice: là điều Đức Chúa Trời đã phán
  alternative: mà Đức Chúa Trời đã phán về
  rationale: ὧν có thể được hiểu liên hệ trực tiếp với πάντων hoặc theo nghĩa “về những điều ấy”. Bản dịch chọn cách liên hệ trực tiếp như lớp tham khảo POB, nhưng dùng “là điều” để câu Việt rõ và không thêm giới từ “về” không hiện diện minh nhiên.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Giữ hình ảnh “trời tiếp nhận” và “qua miệng” của nguyên văn, đồng thời tránh diễn giải giáo phái về bản chất hay phạm vi của sự phục hồi.
