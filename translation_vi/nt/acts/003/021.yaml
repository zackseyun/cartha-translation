    rationale: Nguyên văn đặt οὐρανόν làm chủ thể ngữ nghĩa của động từ δέξασθαι. “Trời phải tiếp nhận Đấng ấy” rõ và tự nhiên hơn, vẫn giữ hình ảnh nhân cách hóa và ý tất yếu.
