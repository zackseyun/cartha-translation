  text: ὁ δὲ ἐπεῖχεν αὐτοῖς προσδοκῶν τι παρ’ αὐτῶν λαβεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/005.yaml
  text: So he fixed his attention on them[a], expecting to receive something from them.
translation:
  language: vi
  text: Anh chăm chú nhìn hai người[a], mong sẽ nhận được điều gì đó từ họ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “để ý đến hai người” hoặc “nhìn hai người không rời mắt.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ
  choice: Anh
  rationale: Đại từ chỉ người què đã được nhắc đến; trong tiếng Việt, không cần dịch δέ thành một liên từ riêng vì diễn tiến câu chuyện đã rõ, và “anh” tự nhiên, phù hợp với nhân vật nam trưởng thành.
- source_word: ἐπεῖχεν
  choice: chăm chú nhìn
  rationale: Trong ngữ cảnh này, động từ diễn tả việc hướng và duy trì sự chú ý vào Phi-e-rơ và Giăng. Cách dịch này tự nhiên trong tiếng Việt và phản ánh sắc thái kéo dài của thì chưa hoàn thành.
- source_word: αὐτοῖς
  choice: hai người
  rationale: Đại từ số nhiều chỉ Phi-e-rơ và Giăng. Nêu “hai người” giúp câu tiếng Việt rõ và tự nhiên mà không thêm danh tính ngoài ngữ cảnh.
- source_word: προσδοκῶν
  choice: mong
  rationale: Phân từ diễn tả sự chờ đợi đầy hy vọng đi kèm với việc chăm chú nhìn; “mong” gọn và tự nhiên trong ngữ cảnh xin bố thí.
- source_word: τι
  choice: điều gì đó
  rationale: Giữ tính không xác định của đối tượng được mong nhận, không diễn giải cụ thể thành tiền hay của bố thí.
- source_word: παρ’ αὐτῶν
  choice: từ họ
  rationale: παρά với sở hữu cách chỉ nguồn; “từ họ” truyền đạt trực tiếp và tự nhiên.
- source_word: λαβεῖν
  choice: sẽ nhận được
  rationale: Động từ nguyên mẫu nêu nội dung điều anh đang mong đợi; “nhận được” phù hợp với bối cảnh được cho hơn “lấy”.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “anh” cho người què để tránh sắc thái xa cách; không diễn giải “điều gì đó” thành tiền nhằm giữ nguyên mức độ không xác định của bản Hy Lạp.
