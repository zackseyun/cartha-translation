source:
  edition: SBLGNT
  text: μετανοήσατε οὖν καὶ ἐπιστρέψατε ⸀πρὸς τὸ ἐξαλειφθῆναι ὑμῶν τὰς ἁμαρτίας,
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/019.yaml
  text: Therefore repent and turn back[a], so that your sins may be wiped away,
translation:
  language: vi
  text: Vậy, anh em hãy ăn năn và quay về, để tội lỗi của anh em được xóa sạch[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “được xóa bỏ.”'
    reason: Biến thể từ vựng, phản ánh nghĩa xóa hoặc bôi đi của ἐξαλείφω.
lexical_decisions:
- source_word: μετανοήσατε
  choice: hãy ăn năn
  rationale: Động từ mệnh lệnh aorist kêu gọi một sự đáp ứng dứt khoát. “Ăn năn” diễn đạt tự nhiên chiều kích đạo đức của việc thay đổi tâm trí và hướng sống, mà không lấn sang ý “quay về” của động từ kế tiếp.
- source_word: οὖν
  choice: vậy
  rationale: Từ này nêu kết luận rút ra từ lập luận trước đó; “vậy” tự nhiên và rõ nghĩa trong tiếng Việt hiện đại.
- source_word: ἐπιστρέψατε
  choice: hãy ... quay về
  rationale: Giữ thể chủ động và ý hướng trở về, với Đức Chúa Trời được hiểu ngầm theo văn cảnh; tránh cách dịch thụ động hoặc mang tính hệ thống hóa như “được cải đạo”.
- source_word: πρὸς τὸ ἐξαλειφθῆναι
  choice: để ... được xóa sạch
  rationale: Cách diễn đạt này tự nhiên trong tiếng Việt và giữ được mối quan hệ mục đích/kết quả của cấu trúc giới từ đi với động từ nguyên mẫu có mạo từ, mà không xác định quá mức cơ chế thần học.
- source_word: ἐξαλειφθῆναι
  choice: được xóa sạch
  rationale: Giữ thể bị động và hình ảnh tội lỗi bị loại bỏ hoàn toàn; “xóa sạch” dễ hiểu, hiện đại và sinh động.
- source_word: ἁμαρτίας
  choice: tội lỗi
  rationale: Cách dịch thông dụng, trực tiếp và đủ rộng cho danh từ số nhiều, không thu hẹp nghĩa chỉ còn những hành vi phạm tội riêng lẻ.
theological_decisions:
- issue: Mối liên hệ giữa ăn năn, quay về và sự xóa tội
  choice: Dịch bằng mệnh đề “để tội lỗi của anh em được xóa sạch”, giữ mối liên hệ mục đích/kết quả mà câu văn nêu ra.
  alternative: Có thể diễn đạt danh từ hóa là “nhằm việc tội lỗi của anh em được xóa sạch”, hoặc dùng lời lẽ mang tính nhân quả rõ hơn.
  rationale: Bản dịch giữ nguyên lời kêu gọi ăn năn và quay về cùng mối liên hệ của nó với sự xóa tội, nhưng không đưa vào câu một trình tự cứu rỗi hay cơ chế giáo lý mà nguyên văn không giải thích.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, phù hợp lời giảng trực tiếp. “Anh em” thể hiện đại từ số nhiều trong ὑμῶν và tự nhiên trong ngữ cảnh diễn từ. Dấu phẩy cuối câu được giữ vì câu này tiếp nối sang câu sau trong văn bản.
