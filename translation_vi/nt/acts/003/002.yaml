  source_fidelity: 'Bản dịch truyền đạt đầy đủ các thành phần chính của câu Hy Lạp: một người cụ thể nhưng không nêu tên; tình trạng què có từ trong lòng mẹ; việc được người khác khiêng và đặt tại cổng theo thói quen hằng ngày; cổng thuộc khuôn viên đền thờ mang tên Đẹp; và mục đích xin bố thí từ người đang đi vào đền thờ. “Khuôn viên đền thờ” phản ánh chính xác ἱερόν là toàn khu vực đền thờ, không riêng nội điện.'
  naturalness: Câu tiếng Việt hiện đại, rõ ràng và có nhịp văn tường thuật tự nhiên. Cụm “ngày ngày được người ta khiêng đến đặt” diễn đạt tốt sắc thái chưa hoàn thành, mang tính lặp lại của ἐβαστάζετο và ἐτίθουν. “Xin bố thí” phù hợp ngữ cảnh lịch sử và vẫn dễ hiểu.
  terminology: “Cổng Đẹp” giữ được tên gọi Ὡραία và chú thích giải thích nghĩa đen của tên. “Bố thí” là từ phù hợp cho ἐλεημοσύνην. Chú thích [a] bảo toàn lựa chọn dịch “từ trong lòng mẹ” và phương án thành ngữ “từ khi sinh ra”; các neo chú thích được đặt đúng cụm liên quan.
