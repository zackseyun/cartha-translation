id: ACT.3.2
reference: Acts 3:2
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καί τις ἀνὴρ χωλὸς ἐκ κοιλίας μητρὸς αὐτοῦ ὑπάρχων ἐβαστάζετο, ὃν ἐτίθουν καθ’ ἡμέραν πρὸς τὴν θύραν τοῦ ἱεροῦ τὴν λεγομένην Ὡραίαν τοῦ αἰτεῖν ἐλεημοσύνην παρὰ τῶν εἰσπορευομένων εἰς τὸ ἱερόν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/002.yaml
  text: And a certain man[a], lame from his mother’s womb, was being carried, whom they would place every day at the gate of the temple called Beautiful, to ask for alms from those entering into the temple[c][b],
translation:
  language: vi
  text: Có một người bị què từ trong lòng mẹ,[a] ngày ngày được người ta khiêng đến đặt bên cổng của khuôn viên đền thờ, gọi là cổng Đẹp,[b] để xin bố thí từ những người đi vào đền thờ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “bị què từ khi sinh ra.”
    reason: lexical_alternative
  - marker: b
    text: Tên cổng trong nguyên ngữ có nghĩa đen là “Đẹp.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τις ἀνὴρ
  choice: một người
  rationale: τις giới thiệu một cá nhân không nêu tên nhưng cụ thể; tiếng Việt tự nhiên không cần thêm “nọ” hay “kia”.
- source_word: χωλὸς ἐκ κοιλίας μητρὸς αὐτοῦ ὑπάρχων
  choice: bị què từ trong lòng mẹ
  rationale: Giữ hình ảnh nguyên ngữ và diễn tả tình trạng có từ khi sinh ra; “bị què” rõ nghĩa trong tiếng Việt hiện đại.
- source_word: ἐβαστάζετο ... ἐτίθουν καθ’ ἡμέραν
  choice: ngày ngày được người ta khiêng đến đặt
  rationale: Hai động từ ở thì chưa hoàn thành mô tả việc diễn ra theo thói quen; cách diễn đạt này gọn và tự nhiên, đồng thời giữ ý người khác khiêng rồi đặt ông ở đó.
- source_word: θύραν τοῦ ἱεροῦ
  choice: cổng của khuôn viên đền thờ
  rationale: θύρα trong bối cảnh kiến trúc là “cổng”; ἱερόν chỉ toàn bộ khuôn viên đền thờ, không riêng nơi thánh bên trong.
- source_word: τὴν λεγομένην Ὡραίαν
  choice: gọi là cổng Đẹp
  rationale: Ὡραία là tên gọi mang nghĩa đen “Đẹp”; thêm “cổng” giúp câu tiếng Việt rõ ràng.
- source_word: τοῦ αἰτεῖν ἐλεημοσύνην
  choice: để xin bố thí
  rationale: Cấu trúc nguyên ngữ chỉ mục đích; “xin bố thí” là cách nói ngắn gọn, đúng với việc xin tiền hoặc quà cứu trợ.
- source_word: παρὰ τῶν εἰσπορευομένων εἰς τὸ ἱερόν
  choice: từ những người đi vào đền thờ
  rationale: Giữ rõ nguồn của của bố thí và hành động những người ấy đang đi vào khuôn viên đền thờ.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “khuôn viên đền thờ” ở lần đầu để thể hiện chính xác ἱερόν; lần sau rút gọn thành “đền thờ” để câu văn tự nhiên. Các dấu chú thích [a], [b] đều được đặt ngay sau cụm từ liên quan.
