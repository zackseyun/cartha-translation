    rationale: Với đối tượng là một thời kỳ/sự kiện, tiếng Việt thường dùng “loan báo về ...”. Giới từ này chỉ làm rõ quan hệ ngữ pháp cần thiết trong tiếng Việt, không thêm nghĩa vào nguyên văn.
  - severity: low
    issue: Chú thích a có lựa chọn diễn đạt hơi gượng.
    rationale: “Những người theo sau theo thứ tự” không tự nhiên. “Những người kế tiếp” hoặc “những người theo sau” diễn đạt đúng καθεξῆς hơn.
