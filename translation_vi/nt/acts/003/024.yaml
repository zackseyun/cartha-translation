source:
  edition: SBLGNT
  text: καὶ πάντες δὲ οἱ προφῆται ἀπὸ Σαμουὴλ καὶ τῶν καθεξῆς ὅσοι ἐλάλησαν καὶ κατήγγειλαν τὰς ἡμέρας ταύτας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/024.yaml
  text: And all the prophets from Samuel and those after him[a], as many as spoke[c][b], also announced these days.
translation:
  language: vi
  text: Và tất cả các nhà tiên tri, từ Sa-mu-ên trở đi—tất cả những ai đã nói—đều đã loan báo về những ngày này[c][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Cũng có thể dịch: “công bố”; theo nghĩa diễn giải hơn: “báo trước”.'
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “thời kỳ này”. Cụm từ chỉ giai đoạn ứng nghiệm hiện tại được nói đến trong bài giảng của Phi-e-rơ.'
    reason: alternative_reading
lexical_decisions:
- source_word: πάντες δὲ οἱ προφῆται
  choice: Và tất cả các nhà tiên tri
  rationale: δέ mang tính nối tiếp nhẹ, không nhất thiết biểu thị tương phản; “Và” giữ mạch diễn từ tự nhiên, còn “tất cả các nhà tiên tri” phản ánh trực tiếp πάντες οἱ προφῆται.
- source_word: ἀπὸ Σαμουὴλ καὶ τῶν καθεξῆς
  choice: từ Sa-mu-ên trở về sau
  rationale: ἀπό nêu điểm khởi đầu, còn καθεξῆς chỉ sự tiếp nối theo thứ tự. Cách diễn đạt này tự nhiên trong tiếng Việt và bao gồm Sa-mu-ên cùng các nhà tiên tri kế tiếp.
- source_word: ὅσοι ἐλάλησαν
  choice: tất cả những ai đã nói
  rationale: ὅσοι có phạm vi bao quát, còn ἐλάλησαν đơn giản là “đã nói”. Cách dịch này giữ sức bao hàm mà không thêm ý “nói tiên tri” vốn không nằm riêng trong động từ.
- source_word: καὶ κατήγγειλαν
  choice: cũng đều loan báo
  rationale: καταγγέλλω có nghĩa công khai loan báo hoặc công bố. “Loan báo” phù hợp văn cảnh tiên tri nhưng không diễn giải quá mức thành “báo trước”; “cũng đều” thể hiện ý phối hợp của καί và phạm vi bao quát của câu.
- source_word: τὰς ἡμέρας ταύτας
  choice: những ngày này
  rationale: Đây là cách dịch trực tiếp, giữ nguyên hình ảnh thời gian của tiếng Hy Lạp và không giải thích thêm bản chất của giai đoạn ứng nghiệm mà Phi-e-rơ đang nói đến.
theological_decisions:
- issue: Các lời tiên tri quy chiếu đến thời điểm ứng nghiệm hiện tại trong bài giảng của Phi-e-rơ
  choice: những ngày này
  alternative: thời kỳ này
  rationale: “Những ngày này” giữ sát cách nói của bản Hy Lạp. Dù cụm từ có thể chỉ thời kỳ ứng nghiệm liên quan đến Đấng Mê-si-a, bản dịch không làm rõ hàm ý cánh chung hơn mức nguyên văn.
- issue: Sắc thái của hành động tiên tri trong κατήγγειλαν
  choice: loan báo
  alternative: báo trước
  rationale: “Báo trước” phù hợp văn cảnh nhưng nhấn mạnh dự báo tương lai hơn nghĩa từ vựng của καταγγέλλω. “Loan báo” giữ được hành động công bố mà không áp đặt một sắc thái thần học hẹp hơn.
translation_notes:
  register: 'Văn phong hiện đại, trang trọng và dễ hiểu. Dấu gạch ngang làm rõ cụm bổ nghĩa “tất cả những ai đã nói” mà vẫn giữ cấu trúc bao quát của câu Hy Lạp. Tên riêng dùng dạng quen thuộc trong Kinh Thánh tiếng Việt: Sa-mu-ên, Phi-e-rơ.'
