  text: Καὶ νῦν, ἀδελφοί, οἶδα ὅτι κατὰ ἄγνοιαν ἐπράξατε, ὥσπερ καὶ οἱ ἄρχοντες ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/017.yaml
  text: And now[a], brothers, I know that you acted in ignorance, just as your rulers also did.
translation:
  language: vi
  text: Và bây giờ, thưa anh em[a], tôi biết anh em đã hành động vì không biết, cũng như các nhà lãnh đạo của anh em cũng đã làm như vậy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể hiểu là “thưa anh chị em”; từ Hy Lạp nói “anh em” nhưng có thể dùng theo nghĩa đại diện để gọi một nhóm gồm cả nam lẫn nữ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ νῦν
  choice: Bây giờ
  rationale: Dùng một chuyển ý tự nhiên trong tiếng Việt, nối lời cáo buộc trước đó với lời kêu gọi tiếp theo; không cần dịch καί bằng “và” một cách máy móc.
- source_word: ἀδελφοί
  choice: thưa anh em
  rationale: Giữ nghĩa trực tiếp của danh từ xưng hô số nhiều, đồng thời dùng “thưa” để lời gọi tự nhiên và trang trọng trong tiếng Việt. Trong ngữ cảnh, cách gọi này có thể đại diện cho cả cộng đồng gồm nam và nữ.
- source_word: οἶδα
  choice: tôi biết
  rationale: Tương đương trực tiếp, tự nhiên với lời khẳng định về sự nhận biết của Phi-e-rơ.
- source_word: κατὰ ἄγνοιαν
  choice: vì không biết
  rationale: Diễn đạt tự nhiên rằng hành động xảy ra trong tình trạng thiếu hiểu biết, nhưng không hàm ý họ hoàn toàn vô tội.
- source_word: ἐπράξατε
  choice: anh em đã hành động
  rationale: Giữ tính khái quát của động từ Hy Lạp và không thêm một tân ngữ vốn không có trong câu.
- source_word: ὥσπερ καὶ
  choice: cũng như ...
  rationale: Thể hiện sự so sánh và ý rằng các nhà lãnh đạo cũng hành động tương tự.
- source_word: οἱ ἄρχοντες ὑμῶν
  choice: các nhà lãnh đạo của anh em
  rationale: Trong bối cảnh Giê-ru-sa-lem, cụm từ chỉ những người nắm quyền lãnh đạo tôn giáo và xã hội; “nhà lãnh đạo” tự nhiên hơn “người cai trị” trong tiếng Việt hiện đại mà vẫn giữ được sắc thái thẩm quyền.
theological_decisions:
- issue: Lời nói về sự thiếu hiểu biết có miễn trừ tội lỗi hay không
  choice: Dịch “đã hành động vì không biết” mà không thêm lời miễn tội hay tăng nặng trách nhiệm.
  alternative: “đã vô tình làm vậy” hoặc “đã làm vì anh em không biết gì”
  rationale: Câu này nhìn nhận sự thiếu hiểu biết là một yếu tố trong hành động của họ, nhưng ngữ cảnh kế tiếp vẫn kêu gọi ăn năn (c. 19). Bản dịch giữ nguyên sự căng thẳng ấy thay vì biến nó thành sự vô tội hoàn toàn.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Đại từ “anh em” được lặp lại để câu rõ ràng trong tiếng Việt; “thưa” tạo sắc thái xưng hô trực tiếp của ἀδελφοί.
