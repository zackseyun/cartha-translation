review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp truyền đạt đúng các thành tố chính: lời chuyển ý hiện tại, lời gọi trực tiếp, sự thiếu hiểu biết, và sự tương đồng với các người lãnh đạo. Tuy nhiên, “Bây giờ” không biểu đạt rõ liên từ Καὶ, và vế so sánh hiện kết thúc ở “các nhà lãnh đạo của anh em” mà không nói rõ họ cũng đã hành động như vậy. Dù động từ có thể được hiểu tỉnh lược, bổ sung nó sẽ phản ánh minh thị ὥσπερ καὶ ... ἐπράξατε mà không thêm nghĩa.'
  naturalness: “Thưa anh em” tự nhiên trong văn phong Kinh Thánh hiện đại, và “vì không biết” là cách diễn đạt rõ, không hàm ý miễn tội. Câu sửa vẫn trang trọng vừa phải, đồng thời làm vế so sánh trọn câu và dễ đọc.
  terminology: “Anh em” giữ đúng nghĩa đen của ἀδελφοί; chú thích nêu khả năng nhóm thính giả hỗn hợp là phù hợp. “Các nhà lãnh đạo” là cách dịch hiện đại có thể chấp nhận cho ἄρχοντες trong ngữ cảnh này. Không cần áp đặt cách hiểu thần học nào về mức độ trách nhiệm.
  issues:
  - severity: low
    issue: Liên từ Καὶ ở đầu câu chưa được phản ánh trong bản dịch chính.
    rationale: “Và bây giờ” bảo lưu rõ hơn chuyển tiếp “Καὶ νῦν”, vẫn tự nhiên trong tiếng Việt.
  - severity: medium
    issue: Vế “cũng như các nhà lãnh đạo của anh em” thiếu vị ngữ biểu thị rõ rằng họ cũng đã hành động trong sự không biết.
    rationale: Nguyên văn có động từ ἐπράξατε cho thính giả và so sánh ὥσπερ καὶ cho các người lãnh đạo. Thêm “cũng đã làm như vậy” làm rõ quan hệ so sánh và yếu tố “cũng”.
