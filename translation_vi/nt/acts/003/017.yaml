  to: Và bây giờ, thưa anh em[a], tôi biết anh em đã hành động vì không biết, cũng như các nhà lãnh đạo của anh em cũng đã làm như vậy.
  rationale: Bản sửa thêm “Và” để phản ánh Καὶ, và hoàn chỉnh vế so sánh bằng “cũng đã làm như vậy”, qua đó diễn đạt rõ rằng các nhà lãnh đạo cũng hành động trong sự thiếu hiểu biết. “Vì không biết” được giữ vì truyền tải κατὰ ἄγνοιαν mà không giải quyết thay văn cảnh vấn đề trách nhiệm. Chú thích giữ nguyên vì phù hợp với ἀδελφοί và không làm thay đổi bản văn chính.
