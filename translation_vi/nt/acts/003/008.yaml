  text: καὶ ἐξαλλόμενος ἔστη καὶ περιεπάτει, καὶ εἰσῆλθεν σὺν αὐτοῖς εἰς τὸ ἱερὸν περιπατῶν καὶ ἁλλόμενος καὶ αἰνῶν τὸν θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/008.yaml
  text: And leaping up, he stood and began to walk, and he entered the temple with them, walking and jumping and praising God.
translation:
  language: vi
  text: Anh nhảy bật dậy, đứng vững và đi lại. Anh cùng họ vào khuôn viên đền thờ, vừa đi vừa nhảy và ca ngợi Đức Chúa Trời.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξαλλόμενος
  choice: nhảy bật dậy
  rationale: Diễn đạt tự nhiên động tác nhảy vọt lên ngay lập tức; phân biệt với ἁλλόμενος ở vế sau.
- source_word: περιεπάτει
  choice: bắt đầu bước đi
  rationale: Thì chưa hoàn thành trong ngữ cảnh khởi đầu một hành động kéo dài; cách dịch này làm rõ việc người vừa được chữa lành bắt đầu đi lại.
- source_word: τὸ ἱερόν
  choice: khuôn viên đền thờ
  rationale: ἱερόν chỉ toàn bộ khu đền thờ, không riêng nơi thánh điện.
- source_word: ἁλλόμενος
  choice: nhảy
  rationale: Tái hiện hành động nhảy vì vui mừng và vì đôi chân đã được phục hồi, bằng từ phổ thông tự nhiên.
- source_word: αἰνῶν τὸν θεόν
  choice: ca ngợi Đức Chúa Trời
  rationale: Giữ nghĩa trực tiếp của động từ αἰνέω và đối tượng τὸν θεόν trong văn phong Kinh Thánh trang trọng, dễ hiểu.
