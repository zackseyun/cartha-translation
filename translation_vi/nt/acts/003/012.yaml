source:
  edition: SBLGNT
  text: ἰδὼν δὲ ⸀ὁ Πέτρος ἀπεκρίνατο πρὸς τὸν λαόν· Ἄνδρες Ἰσραηλῖται, τί θαυμάζετε ἐπὶ τούτῳ, ἢ ἡμῖν τί ἀτενίζετε ὡς ἰδίᾳ δυνάμει ἢ εὐσεβείᾳ πεποιηκόσιν τοῦ περιπατεῖν αὐτόν;
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/012.yaml
  text: But when Peter saw it[a], he answered the people, “Men of Israel, why do you marvel at this[b], or why do you stare at us as though by our own power or godliness we had made him walk?”
translation:
  language: vi
  text: 'Nhưng khi thấy vậy, Phi-e-rơ đáp lời dân chúng: “Thưa người Y-sơ-ra-ên, sao anh em kinh ngạc về việc này? Sao anh em cứ nhìn chằm chằm vào chúng tôi, như thể chính quyền năng riêng hay lòng tin kính của chúng tôi đã làm cho người này đi được?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδὼν δὲ ὁ Πέτρος
  choice: Nhưng khi thấy vậy, Phi-e-rơ
  rationale: Phân từ bất định quá khứ ἰδών được diễn đạt theo thời gian; “vậy” chỉ phản ứng của đám đông trong ngữ cảnh. δέ đánh dấu bước chuyển nhẹ.
- source_word: ἀπεκρίνατο πρὸς τὸν λαόν
  choice: đáp lời dân chúng
  rationale: ἀποκρίνομαι có thể chỉ sự đáp lại một tình huống dù trước đó không có câu hỏi trực tiếp; cách nói này tự nhiên trong tiếng Việt.
- source_word: Ἄνδρες Ἰσραηλῖται
  choice: Thưa những người nam Y-sơ-ra-ên
  rationale: Giữ sắc thái xưng hô trực tiếp và hình thức giống đực của ἄνδρες, đồng thời dùng lời mở đầu lịch sự, tự nhiên trong diễn từ tiếng Việt.
- source_word: τί θαυμάζετε ἐπὶ τούτῳ
  choice: sao anh em kinh ngạc về việc này
  rationale: θαυμάζω diễn tả sự kinh ngạc; “việc này” chỉ sự chữa lành vừa xảy ra.
- source_word: ἢ ἡμῖν τί ἀτενίζετε
  choice: Sao anh em cứ nhìn chằm chằm vào chúng tôi
  rationale: ἀτενίζω hàm ý nhìn chăm chú và kéo dài; “cứ nhìn chằm chằm” chuyển tải rõ lực của động từ.
- source_word: ἰδίᾳ δυνάμει
  choice: nhờ quyền năng ... riêng của mình
  rationale: ἰδίᾳ nhấn mạnh điều thuộc về chính các sứ đồ; cấu trúc tiếng Việt đặt “riêng của mình” sau hai danh từ phối hợp.
- source_word: εὐσεβείᾳ
  choice: lòng tin kính
  rationale: εὐσέβεια nói đến sự sùng kính, lòng mộ đạo hay nếp sống kính Chúa; “lòng tin kính” dễ hiểu và giữ chiều kích tôn giáo.
- source_word: πεποιηκόσιν τοῦ περιπατεῖν αὐτόν
  choice: chúng tôi đã làm cho người này đi được
  rationale: Diễn đạt tự nhiên ý gây nên kết quả trong cấu trúc phân từ hoàn thành kết hợp với động từ nguyên mẫu; “đi được” phù hợp ngữ cảnh người què được chữa lành.
theological_decisions:
- issue: Liệu εὐσεβείᾳ có thể khiến người đọc hiểu phép lạ đến từ công trạng thuộc linh của các sứ đồ
  choice: lòng tin kính
  alternative: lòng mộ đạo; sự sùng kính
  rationale: Bản dịch giữ nghĩa tôn giáo của từ nhưng đồng thời bảo toàn lời phủ nhận của Phi-e-rơ rằng sự chữa lành không bắt nguồn từ phẩm chất thuộc linh riêng của họ; không đưa thêm phạm trù thần học về công trạng.
- issue: Cách chuyển Ἄνδρες Ἰσραηλῖται có giống đực
  choice: những người nam Y-sơ-ra-ên
  alternative: người Y-sơ-ra-ên; đồng bào Y-sơ-ra-ên
  rationale: Giữ rõ hình thức xưng hô giống đực của nguyên văn thay vì trung tính hóa, dù đám đông thực tế có thể gồm cả nữ giới.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và thích hợp với một bài diễn thuyết công khai. Dùng “anh em” làm đại từ xưng hô số nhiều; tên riêng theo dạng quen dùng trong truyền thống Kinh Thánh tiếng Việt.
