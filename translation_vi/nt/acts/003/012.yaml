revisions:
- from: 'Nhưng khi thấy vậy, Phi-e-rơ đáp lời dân chúng: “Thưa những người nam Y-sơ-ra-ên, sao anh em kinh ngạc về việc này? Sao anh em cứ nhìn chằm chằm vào chúng tôi, như thể nhờ quyền năng hay lòng tin kính riêng của mình mà chúng tôi đã làm cho người này đi được?”'
  to: 'Nhưng khi thấy vậy, Phi-e-rơ đáp lời dân chúng: “Thưa người Y-sơ-ra-ên, sao anh em kinh ngạc về việc này? Sao anh em cứ nhìn chằm chằm vào chúng tôi, như thể chính quyền năng riêng hay lòng tin kính của chúng tôi đã làm cho người này đi được?”'
  rationale: Sửa vị trí của «riêng» và thêm «của chúng tôi» để phản ánh chính xác quan hệ ngữ pháp và ý nghĩa phủ nhận của ἰδίᾳ δυνάμει ἢ εὐσεβείᾳ. Điều chỉnh lời xưng hô để tự nhiên trong tiếng Việt hiện đại, đồng thời vẫn giữ cách gọi trực tiếp «người Y-sơ-ra-ên». Không cần chú thích vì không có biến thể hay điểm mơ hồ nào đòi hỏi chú thích trong bản dịch Việt.
