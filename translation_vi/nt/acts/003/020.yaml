id: ACT.3.20
reference: Acts 3:20
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὅπως ἂν ἔλθωσιν καιροὶ ἀναψύξεως ἀπὸ προσώπου τοῦ κυρίου καὶ ἀποστείλῃ τὸν προκεχειρισμένον ὑμῖν χριστὸν Ἰησοῦν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/020.yaml
  text: so that times of refreshing may come from the presence of the Lord[a], and that he may send the Messiah appointed for you, Jesus,
translation:
  language: vi
  text: để những thời kỳ đem lại sự tươi mới có thể đến từ sự hiện diện của Chúa, và để Ngài sai Đấng Mê-si-a đã được chỉ định cho anh chị em[a], tức là Giê-su,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đã được chỉ định đến với anh chị em” hoặc “đã được chỉ định trước cho anh chị em.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπως ἂν
  choice: để
  rationale: Mở đầu mệnh đề chỉ mục đích hoặc kết quả gắn với lời kêu gọi ăn năn ở câu trước; cách dịch này tự nhiên và không nhấn quá mức sắc thái bất định.
- source_word: ἔλθωσιν
  choice: có thể đến
  rationale: Diễn đạt động từ giả định sau ὅπως ἄν, giữ sắc thái khả hữu/phụ thuộc.
- source_word: καιροὶ
  choice: những thời kỳ
  rationale: καιρός chỉ những thời điểm hoặc mùa thích hợp; “những thời kỳ” giữ nghĩa rộng mà không xác định quá mức niên đại cánh chung.
- source_word: ἀναψύξεως
  choice: tươi mới
  rationale: Danh từ có thể chỉ sự làm cho tươi mới, nhẹ nhõm hoặc hồi sinh; “tươi mới” giữ hình ảnh và dễ hiểu trong tiếng Việt hiện đại.
- source_word: ἀπὸ προσώπου τοῦ κυρίου
  choice: từ sự hiện diện của Chúa
  rationale: πρόσωπον theo nghĩa đen là “mặt”, nhưng trong thành ngữ này chỉ sự hiện diện; cách dịch này tự nhiên hơn trong tiếng Việt.
- source_word: ἀποστείλῃ
  choice: Ngài sai
  rationale: Động từ giả định phối hợp với mệnh đề trước; “để Ngài sai” giữ quan hệ cú pháp với lời kêu gọi ở ngữ cảnh trước.
- source_word: προκεχειρισμένον
  choice: đã được chỉ định
  rationale: Phân từ diễn tả sự chỉ định hoặc tuyển chọn có trước; “đã được chỉ định” thể hiện sắc thái hoàn thành mà không diễn giải quá mức.
- source_word: ὑμῖν
  choice: cho anh chị em
  rationale: Dữ cách có thể mang nghĩa “cho” hoặc “đến với”; “cho anh chị em” tự nhiên và giữ ý hướng đến/lợi ích của người nghe.
- source_word: χριστὸν
  choice: Đấng Mê-si-a
  rationale: Ở đây χριστός hoạt động như tước hiệu cứu thế, nên dịch nghĩa thay vì dùng như một phần tên riêng.
- source_word: Ἰησοῦν
  choice: Đức Chúa Jêsus
  rationale: Dùng dạng tên quen thuộc trong văn phong Kinh Thánh tiếng Việt, kèm kính ngữ phù hợp với văn phong trang trọng.
theological_decisions:
- issue: χριστὸν nên được dịch như một tước hiệu hay giữ dạng truyền thống “Đấng Christ”
  choice: Đấng Mê-si-a
  alternative: Đấng Christ
  rationale: Trong ngữ cảnh này, từ này là tước hiệu của Jêsus và nhấn mạnh căn tính Đấng được xức dầu; “Đấng Mê-si-a” chuyển tải nghĩa của tước hiệu trong bối cảnh Do Thái.
- issue: Ý nghĩa của προκεχειρισμένον ὑμῖν
  choice: đã được chỉ định cho anh chị em
  alternative: đã được chỉ định đến với anh chị em; đã được chỉ định trước cho anh chị em
  rationale: Cách dịch chính giữ cả ý chỉ định có trước của phân từ và cách hiểu tự nhiên của dữ cách là “cho”; chú thích bảo lưu các khả năng khác.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” cho số nhiều ὑμῖν; giữ cấu trúc hai mệnh đề “để” và dấu phẩy cuối câu vì đây là phần tiếp nối sang câu kế.
