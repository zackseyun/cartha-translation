  naturalness: “Những thời kỳ tươi mới” có thể được hiểu là các thời kỳ mang tính mới mẻ, thay vì “những thời kỳ của sự tươi mới/sự phục hưng” mà ἀναψύξεως diễn tả. Cách viết “những thời kỳ đem lại sự tươi mới” tự nhiên hơn trong tiếng Việt hiện đại mà vẫn giữ hình ảnh của từ gốc.
