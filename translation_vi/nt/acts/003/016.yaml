  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ⸀ἐπὶ τῇ πίστει τοῦ ὀνόματος αὐτοῦ τοῦτον ὃν θεωρεῖτε καὶ οἴδατε ἐστερέωσεν τὸ ὄνομα αὐτοῦ, καὶ ἡ πίστις ἡ δι’ αὐτοῦ ἔδωκεν αὐτῷ τὴν ὁλοκληρίαν ταύτην ἀπέναντι πάντων ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/016.yaml
  text: And on the basis of faith in his name[a], his name itself has made strong this man whom you see and know[c][b]; and the faith that is through him has given him this wholeness in the presence of all of you.
translation:
  language: vi
  text: Và nhờ đức tin nơi danh Ngài[a], chính danh Ngài[c] đã làm cho người này, người mà anh em thấy và biết, được mạnh khỏe; và đức tin qua Ngài đã ban cho người ấy sự lành lặn hoàn toàn[b] trước mặt tất cả anh em.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “lòng tin cậy nơi danh Ngài.” Từ Hy Lạp pistis có thể mang nghĩa “đức tin,” “lòng tin cậy,” hoặc trong một số ngữ cảnh là “sự thành tín.”
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “tình trạng hoàn toàn lành mạnh” hoặc “sức khỏe trọn vẹn.”
    reason: lexical_alternative
  - marker: c
    text: 'Có thể dịch không dùng từ nhấn mạnh “chính”: “danh Ngài đã làm cho người này được mạnh khỏe.”'
    reason: previous_rendering
lexical_decisions:
- source_word: ἐπὶ τῇ πίστει
  choice: dựa trên đức tin
  rationale: ἐπί với cách dữ liệu ở đây diễn tả nền tảng hoặc cơ sở. “Dựa trên đức tin” giữ được sắc thái ấy rõ hơn cách dịch thuần công cụ “bởi đức tin”.
- source_word: πίστει τοῦ ὀνόματος αὐτοῦ
  choice: đức tin nơi danh Ngài
  rationale: πίστις trong ngữ cảnh này chỉ sự tin cậy hướng đến danh Chúa Giê-xu. “Nơi danh Ngài” tự nhiên trong tiếng Việt và giữ nguyên hình ảnh “danh” thay vì diễn giải thành con người hay quyền năng của Chúa Giê-xu.
- source_word: ἐστερέωσεν
  choice: đã làm cho ... được mạnh mẽ
  rationale: Động từ có nghĩa làm cho vững chắc hoặc mạnh mẽ; cách dịch này phù hợp với sự phục hồi thân thể đang hiện rõ nơi người được chữa lành.
- source_word: θεωρεῖτε καὶ οἴδατε
  choice: anh em thấy và biết
  rationale: Giữ cả việc tận mắt nhìn thấy lẫn sự nhận biết công khai về người này.
- source_word: τὸ ὄνομα αὐτοῦ
  choice: chính danh Ngài
  rationale: Giữ “danh Ngài” làm chủ thể như nguyên văn và dùng “chính” để làm rõ sự lặp lại có tính nhấn mạnh của từ “danh”.
- source_word: ἡ πίστις ἡ δι’ αὐτοῦ
  choice: đức tin qua Ngài
  rationale: Cách diễn đạt cô đọng này bảo tồn độ mở của δι’ αὐτοῦ, không quyết định rằng đây nhất thiết là đức tin do Chúa Giê-xu tạo nên, đức tin đặt nơi Ngài, hay đức tin được trung介 qua Ngài.
- source_word: ὁλοκληρίαν
  choice: sự lành lặn hoàn toàn
  rationale: Danh từ nói đến tình trạng nguyên vẹn, trọn vẹn hoặc khỏe mạnh hoàn toàn; cách dịch này vừa rõ về sự chữa lành thân thể vừa giữ ý niệm đầy đủ, không thiếu hụt.
- source_word: ἀπέναντι πάντων ὑμῶν
  choice: trước mặt tất cả anh em
  rationale: Diễn tả tính công khai và không thể phủ nhận của sự chữa lành một cách tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Đức tin nơi/qua danh Ngài và tác nhân của sự chữa lành
  choice: Quy sự làm cho mạnh mẽ cho danh Chúa Giê-xu, đồng thời giữ đức tin liên hệ với danh ấy và “qua Ngài” mà không xác định đức tin đó thuộc về ai.
  alternative: Xác định đó là đức tin của người được chữa lành, đức tin của các sứ đồ, hoặc đức tin do Chúa Giê-xu tạo nên.
  rationale: Nguyên văn không nêu rõ chủ thể con người của đức tin. Bản dịch giữ nguyên sự căng thẳng và độ mở thần học này.
- issue: Ý nghĩa hoán dụ của “danh”
  choice: Giữ nguyên “danh Ngài” trong chính văn.
  alternative: Diễn giải thành “chính Chúa Giê-xu” hoặc “quyền năng trong danh Ngài”.
  rationale: Trong Công Vụ, “danh” gợi đến chính thân vị và thẩm quyền của Chúa Giê-xu. Giữ cách nói của Lu-ca tránh thu hẹp ý nghĩa vào một lời diễn giải duy nhất.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “anh em” phù hợp với lời Phi-e-rơ nói trực tiếp với đám đông; “Ngài” giữ sắc thái tôn kính. Cấu trúc lặp “danh Ngài” được giữ lại có chủ ý để phản ánh sự nhấn mạnh của nguyên văn.
