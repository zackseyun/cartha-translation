revisions:
- from: Đức Chúa Trời đã dấy Đầy Tớ của Ngài lên[a][b] và sai Người đến với anh em trước hết, để ban phước cho anh em bằng cách khiến từng người trong anh em lìa bỏ những đường lối gian ác của mình.
  to: Đức Chúa Trời đã dấy Đầy Tớ[b] của Ngài lên[a] và sai Người đến với anh em trước hết, để ban phước cho anh em bằng cách quay từng người trong anh em khỏi những điều gian ác của mình.
  rationale: Sửa vị trí các ký hiệu chú thích để mỗi chú thích neo đúng từ Hy Lạp liên quan. Đổi “những đường lối gian ác” thành “những điều gian ác” để bảo tồn nghĩa rộng của πονηρίαι. Đổi “khiến ... lìa bỏ” thành “quay ... khỏi” để phản ánh trực tiếp hơn ý “xoay/chuyển khỏi” của ἀποστρέφειν, vẫn giữ tác động ban phước của Đầy Tớ đối với từng người.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T08:27:59Z'
