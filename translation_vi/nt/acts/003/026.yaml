id: ACT.3.26
reference: Acts 3:26
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὑμῖν πρῶτον ⸂ἀναστήσας ὁ θεὸς⸃ τὸν παῖδα ⸀αὐτοῦ ἀπέστειλεν αὐτὸν εὐλογοῦντα ὑμᾶς ἐν τῷ ἀποστρέφειν ἕκαστον ἀπὸ τῶν πονηριῶν ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/026.yaml
  text: To you first[a], God, having raised up his servant[b], sent him to bless you by turning each of you from your wicked ways.
translation:
  language: vi
  text: Đức Chúa Trời đã dấy Đầy Tớ[b] của Ngài lên[a] và sai Người đến với anh em trước hết, để ban phước cho anh em bằng cách quay từng người trong anh em khỏi những điều gian ác của mình.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Dấy ... lên” cũng có thể có nghĩa là làm cho Đầy Tớ xuất hiện hoặc lập Người lên, chứ không nhất thiết chỉ việc làm Người sống lại từ cõi chết.
    reason: alternative_reading
  - marker: b
    text: Từ Hy Lạp παῖς cũng có thể có nghĩa là “con trẻ”; tuy nhiên, “Đầy Tớ” có lẽ phản ánh nền tảng về Người Tôi Tớ trong sách Ê-sai ở đây.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμῖν πρῶτον
  choice: đến với anh em trước hết
  rationale: Giữ ý ưu tiên dành cho những người Do Thái đang được Phi-e-rơ nói với, đồng thời diễn đạt tự nhiên quan hệ của cụm này với động từ “sai”.
- source_word: ἀναστήσας
  choice: đã dấy ... lên
  rationale: '“Dấy lên” giữ được độ mở của động từ Hy Lạp: có thể gợi việc Đức Chúa Trời làm cho Đầy Tớ xuất hiện/được lập nên, đồng thời cũng có thể được nghe theo nghĩa làm cho sống lại.'
- source_word: τὸν παῖδα αὐτοῦ
  choice: Đầy Tớ của Ngài
  rationale: “Đầy Tớ” phù hợp với nền tảng về Người Tôi Tớ trong Ê-sai và không nhập thêm ý nghĩa “Con” vốn không được từ Hy Lạp này xác định rõ tại đây.
- source_word: ἀπέστειλεν αὐτόν
  choice: sai Người đến
  rationale: Diễn đạt trực tiếp hành động sai phái; “Người” quy chiếu trang trọng đến Đầy Tớ vừa được nhắc tới.
- source_word: εὐλογοῦντα ὑμᾶς
  choice: để ban phước cho anh em
  rationale: Chuyển phân từ sang cấu trúc chỉ mục đích/kết quả tự nhiên trong tiếng Việt.
- source_word: ἐν τῷ ἀποστρέφειν ἕκαστον
  choice: bằng cách khiến từng người trong anh em lìa bỏ
  rationale: “Bằng cách” thể hiện phương tiện của sự ban phước; “từng người” giữ lực phân phối của ἕκαστον, còn “khiến ... lìa bỏ” giữ sắc thái chuyển hướng khỏi điều ác.
- source_word: ἀπὸ τῶν πονηριῶν ὑμῶν
  choice: những đường lối gian ác của mình
  rationale: Cụm này truyền đạt các biểu hiện cụ thể và nếp sống gian ác, tự nhiên hơn cách dịch sát chữ “những sự gian ác”; “của mình” quy về từng người.
theological_decisions:
- issue: Ý nghĩa của ἀναστήσας đối với Chúa Giê-su
  choice: Giữ cách nói “dấy ... lên” mà không xác định dứt khoát là phục sinh hay làm cho xuất hiện/lập nên.
  alternative: “làm cho sống lại” hoặc “làm xuất hiện/lập nên”
  rationale: Nguyên ngữ cho phép người đọc liên hệ với sự phục sinh, nhưng trong bài giảng này cũng có thể vọng lại lời hứa Đức Chúa Trời sẽ dấy lên một nhà tiên tri/đầy tớ. Bản dịch giữ nguyên sức căng thần học ấy.
- issue: Sắc thái Cơ Đốc luận của παῖς
  choice: Dịch là “Đầy Tớ”.
  alternative: “con trẻ” hoặc “Con”
  rationale: “Đầy Tớ” bảo tồn liên hệ có khả năng cao với Người Tôi Tớ trong Ê-sai và tránh đưa vào lời văn một tuyên bố trực tiếp về địa vị làm Con mà từ παῖς trong câu này không tự nó đòi hỏi.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Viết hoa “Đầy Tớ” và đại từ “Người” để chỉ nhân vật được Đức Chúa Trời sai đến, đồng thời tránh dùng “Con” vì nguyên ngữ chưa xác định sắc thái ấy trong câu này.
