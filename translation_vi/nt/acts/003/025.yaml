id: ACT.3.25
reference: Acts 3:25
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὑμεῖς ἐστε ⸀οἱ υἱοὶ τῶν προφητῶν καὶ τῆς διαθήκης ἧς ⸂διέθετο ὁ θεὸς⸃ πρὸς τοὺς πατέρας ⸀ὑμῶν, λέγων πρὸς Ἀβραάμ Καὶ ἐν τῷ σπέρματί σου ⸀ἐνευλογηθήσονται πᾶσαι αἱ πατριαὶ τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/025.yaml
  text: You are the sons of the prophets and of the covenant that God made with your fathers[a], saying to Abraham[b], ‘And in your offspring all the families of the earth will be blessed.’
translation:
  language: vi
  text: 'Anh em là con cái[a] của các nhà tiên tri và của giao ước mà Đức Chúa Trời đã lập với tổ phụ anh em, khi Ngài phán với Áp-ra-ham: “Nhờ dòng dõi[b] con, mọi gia tộc trên đất sẽ được ban phước.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn là “các con trai”, một cách nói về những người thừa hưởng giao ước; ở đây không có nghĩa là con ruột của các nhà tiên tri.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “hạt giống”. Từ Hy Lạp có thể chỉ chung các hậu duệ của Áp-ra-ham, đồng thời cũng có thể mang nghĩa một hậu duệ đại diện trong mạch thần học Kinh Thánh.
    reason: alternative_reading
lexical_decisions:
- source_word: υἱοὶ
  choice: con cái
  rationale: Trong ngữ cảnh giao ước, từ số nhiều giống đực này chỉ những người thừa hưởng và dự phần vào lời hứa, chứ không nói rằng họ là con ruột của các nhà tiên tri. “Con cái” tự nhiên trong tiếng Việt và bao quát cộng đồng được gọi đến.
- source_word: προφητῶν
  choice: của các nhà tiên tri
  rationale: Giữ quan hệ sở hữu của nguyên văn; cả cụm nói đến những người thuộc về di sản lời hứa do các nhà tiên tri truyền lại.
- source_word: διαθήκης
  choice: giao ước
  rationale: “Giao ước” là thuật ngữ phù hợp với bối cảnh Kinh Thánh về lời hứa của Đức Chúa Trời với Áp-ra-ham và các tổ phụ.
- source_word: διέθετο
  choice: đã lập
  rationale: Động từ ở đây mang nghĩa thiết lập một giao ước; “đã lập” vừa chính xác vừa tự nhiên hơn cách diễn đạt dài dòng.
- source_word: πρὸς τοὺς πατέρας ὑμῶν
  choice: với tổ phụ anh em
  rationale: Trong thành ngữ lập giao ước, πρός được diễn đạt tự nhiên là “với”; “tổ phụ” phù hợp với các bậc cha ông của cộng đồng giao ước.
- source_word: λέγων πρὸς Ἀβραάμ
  choice: khi Ngài phán với Áp-ra-ham
  rationale: Chuyển phân từ thành mệnh đề thời gian giúp câu tiếng Việt sáng rõ, đồng thời vẫn cho thấy lời phán với Áp-ra-ham là nội dung của việc lập giao ước.
- source_word: σπέρματί
  choice: dòng dõi
  rationale: “Dòng dõi” có thể mang nghĩa tập thể nhưng không buộc phải là hình thức số nhiều, nhờ đó bảo tồn khả năng quy chiếu tập thể và đại diện của σπέρμα.
- source_word: ἐν
  choice: nhờ
  rationale: Trong lời hứa này, ἐν có thể diễn tả phương tiện hoặc phạm vi qua đó phước lành đến. “Nhờ” tạo câu tiếng Việt tự nhiên mà không xác định dòng dõi chỉ là một cá nhân hay cả tập thể.
- source_word: ἐνευλογηθήσονται
  choice: sẽ được ban phước
  rationale: Diễn đạt trực tiếp thể bị động tương lai và giữ Đức Chúa Trời là tác nhân ngầm của phước lành.
- source_word: πατριαὶ
  choice: gia tộc
  rationale: πατριά chỉ các nhóm gia đình hoặc thị tộc; “gia tộc” giữ sắc thái rộng hơn gia đình hạt nhân.
- source_word: γῆς
  choice: đất
  rationale: Trong cụm “mọi gia tộc trên đất,” từ này mang phạm vi phổ quát và là cách nói tự nhiên, trang trọng trong tiếng Việt.
theological_decisions:
- issue: Ngôn ngữ giống đực mang tính đại diện trong υἱοὶ
  choice: con cái
  alternative: các con trai
  rationale: Tiếng Việt không cần duy trì giống ngữ pháp như tiếng Hy Lạp. “Con cái” chuyển tải đúng ý những người thừa hưởng giao ước, gồm cả cộng đồng được nói đến, còn chú thích ghi nhận nguyên văn là “các con trai.”
- issue: Phạm vi nghĩa của σπέρμα trong lời hứa với Áp-ra-ham
  choice: dòng dõi
  alternative: hạt giống; hậu duệ
  rationale: “Dòng dõi” bảo tồn sự căng giữa nghĩa tập thể là các hậu duệ của Áp-ra-ham và khả năng một nhân vật đại diện, không áp đặt riêng một cách hiểu thần học.
- issue: Quan hệ của phước lành với dòng dõi trong ἐν τῷ σπέρματί σου
  choice: nhờ dòng dõi con
  alternative: trong dòng dõi con
  rationale: “Nhờ” là cách diễn đạt tiếng Việt tự nhiên cho sắc thái phương tiện của ἐν trong lời hứa, nhưng danh từ “dòng dõi” vẫn để ngỏ quy chiếu tập thể hay đại diện.
translation_notes:
  register: Bản dịch dùng tiếng Việt hiện đại, trang trọng và dễ hiểu. “Anh em” phù hợp với lời trực tiếp dành cho đám đông; “Đức Chúa Trời”, “giao ước”, “tổ phụ” và “ban phước” duy trì văn phong Kinh Thánh quen thuộc mà không cổ hóa quá mức. Mọi dấu chú thích đều xuất hiện ngay trong chính văn.
