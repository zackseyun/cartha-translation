  text: καὶ τούτῳ συμφωνοῦσιν οἱ λόγοι τῶν προφητῶν, καθὼς γέγραπται·
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/015.yaml
  text: 'And with this the words of the prophets agree[a], just as it is written:'
translation:
  language: vi
  text: 'Lời các nhà tiên tri cũng phù hợp với điều này, như có chép rằng:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: cũng
  rationale: Trong mạch lập luận, từ này bổ sung lời các nhà tiên tri như bằng chứng xác nhận điều vừa được thuật lại; “cũng” tự nhiên hơn “và” trong tiếng Việt ở đây.
- source_word: τούτῳ
  choice: với điều này
  rationale: Đại từ chỉ định ở cách cho chỉ về sự việc hoặc lời trình bày ngay trước đó. “Điều này” giữ nguyên phạm vi quy chiếu rộng của nguyên văn.
- source_word: συμφωνοῦσιν
  choice: phù hợp
  rationale: Động từ diễn tả sự tương hợp, nhất trí. “Phù hợp với” là cách nói tự nhiên khi đối chiếu lời tiên tri với sự việc vừa nêu.
- source_word: οἱ λόγοι τῶν προφητῶν
  choice: lời các nhà tiên tri
  rationale: “Lời” chỉ những lời tuyên bố của các nhà tiên tri được lưu lại trong Kinh Thánh; cách diễn đạt này vừa trực tiếp vừa tự nhiên.
- source_word: καθὼς γέγραπται
  choice: như có chép rằng
  rationale: Đây là công thức dẫn Kinh Thánh quen thuộc. “Như có chép rằng” giữ được ý đối chiếu và dẫn sang phần trích dẫn tiếp theo.
theological_decisions:
- issue: Đối tượng mà τούτῳ (“điều này”) chỉ đến
  choice: Giữ cách nói khái quát “điều này”, chỉ về nội dung hoặc sự việc vừa được nêu.
  alternative: Nói rõ là việc dân ngoại trở lại, lời của Phi-e-rơ, hoặc chương trình của Đức Chúa Trời.
  rationale: Nguyên văn không xác định hẹp đối tượng quy chiếu; bản dịch không nên tự ý chọn một cách giải thích thần học cụ thể.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Trật tự câu được điều chỉnh tự nhiên theo tiếng Việt nhưng vẫn bảo toàn quan hệ giữa sự việc vừa nêu, lời các nhà tiên tri và công thức dẫn Kinh Thánh.
