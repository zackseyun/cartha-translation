  text: ἀναγνόντες δὲ ἐχάρησαν ἐπὶ τῇ παρακλήσει.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/031.yaml
  text: And when they had read it[a], they rejoiced because of its encouragement.
translation:
  language: vi
  text: Sau khi đọc thư, họ vui mừng vì lời khích lệ trong đó.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “họ vui mừng về lời khích lệ”; từ Hy Lạp cũng có thể mang nghĩa “lời khuyên nhủ” hoặc “sự an ủi”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναγνόντες
  choice: Sau khi đọc thư
  rationale: Phân từ bất định quá khứ diễn tả hành động xảy ra trước động từ chính. Tân ngữ không được nêu trong câu Hy Lạp nhưng theo ngữ cảnh là bức thư ở câu trước; tiếng Việt tự nhiên cần nói rõ là “thư”.
- source_word: δὲ
  choice: không dịch riêng
  rationale: δέ là liên từ chuyển tiếp nhẹ. Quan hệ tiếp nối đã được diễn đạt tự nhiên bằng cấu trúc “Sau khi...”, nên thêm “và” sẽ nặng câu.
- source_word: ἐχάρησαν
  choice: họ vui mừng
  rationale: Động từ χαίρω ở đây mang nghĩa chủ động là vui, mừng; “vui mừng” giữ được sắc thái cảm xúc rõ ràng mà vẫn tự nhiên trong tiếng Việt.
- source_word: ἐπὶ
  choice: vì
  rationale: ἐπί với tặng cách ở đây chỉ nguyên nhân hoặc cơ sở của sự vui mừng; “vì” diễn đạt trực tiếp quan hệ ấy.
- source_word: τῇ παρακλήσει
  choice: lời khích lệ trong đó
  rationale: παράκλησις có thể chỉ sự khích lệ, khuyên nhủ hoặc an ủi. Trong ngữ cảnh bức thư làm các tín hữu được nâng đỡ sau cuộc tranh luận, “lời khích lệ” là lựa chọn bao quát và tự nhiên; “trong đó” nối rõ lời khích lệ với bức thư mà không biến nó thành nghĩa từ vựng của danh từ.
