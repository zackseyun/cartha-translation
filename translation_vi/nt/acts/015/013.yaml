  text: μετὰ δὲ τὸ σιγῆσαι αὐτοὺς ἀπεκρίθη Ἰάκωβος λέγων· Ἄνδρες ἀδελφοί, ἀκούσατέ μου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/013.yaml
  text: And after they became silent[a], James answered, saying, “Brothers[b], listen to me.”
translation:
  language: vi
  text: 'Sau khi họ im lặng[a], Gia-cơ đáp lời: “Thưa anh em[b], xin nghe tôi nói.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “sau khi họ ngừng nói.” Cụm từ Hy Lạp đánh dấu thời điểm những người phát biểu trước đã nói xong.'
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn sát chữ là “những người nam, anh em,” một lối xưng hô trang trọng với hình thức giống đực. Trong ngữ cảnh, lời này hướng đến các anh em trong cuộc họp, dù cuộc họp rộng hơn cũng có những người khác hiện diện.
    reason: cultural_note
lexical_decisions:
- source_word: μετὰ δὲ τὸ σιγῆσαι αὐτοὺς
  choice: Sau khi họ im lặng
  rationale: Cấu trúc μετά với động từ nguyên mẫu có mạo từ chỉ thời điểm tiếp sau; σιγάω ở đây nói đến việc những người phát biểu trước đã ngừng nói. Cách dịch này tự nhiên và giữ rõ trình tự thời gian.
- source_word: ἀπεκρίθη
  choice: lên tiếng
  rationale: Trong diễn tiến hội nghị, động từ mang nghĩa đáp lời hoặc phản hồi. “Lên tiếng” tự nhiên trong tiếng Việt khi một người bắt đầu phát biểu sau lúc những người khác đã nói xong, mà không hàm ý Gia-cơ trả lời một câu hỏi trực tiếp.
- source_word: Ἰάκωβος
  choice: Gia-cơ
  rationale: Dùng dạng tên riêng đã quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
- source_word: λέγων
  choice: dấu hai chấm mở lời trực tiếp
  rationale: Phân từ này giới thiệu lời nói trực tiếp. Tiếng Việt tự nhiên thể hiện chức năng ấy bằng “lên tiếng:” thay vì dịch riêng thành “nói rằng”.
- source_word: Ἄνδρες ἀδελφοί
  choice: Thưa anh em
  rationale: Hai danh từ xưng hô đều ở giống đực; trong lối nói trang trọng, tổ hợp Hy Lạp là cách gọi những người nam cùng cộng đồng. “Thưa anh em” giữ đối tượng nam và sắc thái kính trọng mà không tạo thành cụm từ gượng gạo trong tiếng Việt.
- source_word: ἀκούσατέ μου
  choice: xin nghe tôi nói
  rationale: Mệnh lệnh yêu cầu người nghe chú ý. “Xin nghe tôi nói” truyền đạt lực cầu khiến một cách tự nhiên, phù hợp với lời phát biểu trang trọng trước hội nghị.
theological_decisions:
- issue: Cách chuyển dịch lời xưng hô giống đực Ἄνδρες ἀδελφοί
  choice: Thưa anh em
  alternative: Hỡi các anh em nam giới; Thưa anh chị em
  rationale: Nguyên văn dùng hai danh từ số nhiều giống đực. “Thưa anh em” là cách xưng hô trang trọng, tự nhiên trong tiếng Việt và không biến lời gọi thành một cách diễn đạt bao hàm giới tính mà nguyên văn không nói rõ. Chú thích ghi nhận hình thức sát chữ và bối cảnh của hội chúng rộng hơn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Lên tiếng” cùng dấu hai chấm tránh lặp kiểu “đáp rằng, nói rằng”; “xin nghe tôi nói” giữ sắc thái phát biểu lịch sự nhưng có thẩm quyền.
