id: ACT.15.17
reference: Acts 15:17
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὅπως ἂν ἐκζητήσωσιν οἱ κατάλοιποι τῶν ἀνθρώπων τὸν κύριον, καὶ πάντα τὰ ἔθνη ἐφ’ οὓς ἐπικέκληται τὸ ὄνομά μου ἐπ’ αὐτούς, λέγει ⸀κύριος ποιῶν ⸀ταῦτα
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/017.yaml
  text: so that the remnant of mankind may seek the Lord[a], even all the Gentiles on whom my name has been called, says the Lord[c][b], who does these things
translation:
  language: vi
  text: để số người còn lại trong nhân loại, cùng mọi dân ngoại[a] mà danh ta đã được xưng trên họ[b], tìm kiếm Chúa. Chúa phán[c]—Đấng làm những việc ấy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “mọi dân tộc.” Từ Hy Lạp ἔθνη có thể chỉ các dân tộc hoặc dân ngoại; ở đây “dân ngoại” phù hợp với bối cảnh đang bàn về người không phải Do Thái.'
    reason: alternative_reading
  - marker: b
    text: 'Cũng có thể diễn đạt: “những người được gọi bằng danh ta.” Nguyên văn là “những người mà danh ta đã được xưng trên họ,” một thành ngữ nói đến việc họ thuộc về và mang danh Chúa.'
    reason: lexical_alternative
  - marker: c
    text: Câu này vọng lại A-mốt 9:12 theo dạng văn bản được phản ánh trong Kinh Thánh Hy Lạp, nhấn mạnh các dân ngoại mang danh Chúa.
    reason: cross_reference
lexical_decisions:
- source_word: ὅπως ἂν
  choice: để
  rationale: Diễn đạt tự nhiên ý mục đích hoặc kết quả của liên từ đi với thể giả định.
- source_word: ἐκζητήσωσιν
  choice: tìm kiếm
  rationale: Giữ nghĩa chính của động từ; tiền tố có thể hàm ý tìm kiếm chuyên cần, nhưng nhấn mạnh sắc thái này trong chính văn sẽ dễ thành diễn giải quá mức.
- source_word: οἱ κατάλοιποι τῶν ἀνθρώπων
  choice: số người còn lại trong nhân loại
  rationale: Diễn đạt κατάλοιποι là những người còn lại, đồng thời hiểu ἀνθρώπων theo nghĩa bao quát toàn thể nhân loại, không riêng nam giới.
- source_word: τὸν κύριον
  choice: Chúa
  rationale: Cách gọi tự nhiên, trang trọng trong tiếng Việt đối với κύριος ở công thức trích dẫn Kinh Thánh.
- source_word: πάντα τὰ ἔθνη
  choice: mọi dân ngoại
  rationale: Trong bối cảnh hội nghị Giê-ru-sa-lem, cụm từ chỉ rõ những người không thuộc dân Do Thái; nghĩa rộng hơn là “mọi dân tộc” được giữ trong chú thích.
- source_word: ἐφ’ οὓς ἐπικέκληται τὸ ὄνομά μου ἐπ’ αὐτούς
  choice: mà danh ta đã được xưng trên họ
  rationale: Giữ hình ảnh và cấu trúc thụ động của thành ngữ Hy Lạp, qua đó biểu thị những người được nhận diện là thuộc về Chúa mà không thu hẹp nghĩa vào một cách giải thích riêng.
- source_word: λέγει κύριος
  choice: Chúa phán
  rationale: Công thức ngôn sứ quen thuộc, trang trọng và tự nhiên trong tiếng Việt.
- source_word: ποιῶν ταῦτα
  choice: Đấng làm những việc ấy
  rationale: Cho thấy phân từ hiện tại bổ nghĩa cho Chúa và giữ nguyên sự chủ động của Ngài.
theological_decisions:
- issue: Nghĩa của ἔθνη trong bối cảnh người Do Thái và người không phải Do Thái
  choice: dân ngoại
  alternative: các dân tộc
  rationale: Mạch văn Công vụ 15 tập trung vào việc người không phải Do Thái được tiếp nhận. Tuy nhiên, nghĩa “các dân tộc” trong lời ngôn sứ vẫn chân thực và được nêu ở chú thích.
- issue: Ý nghĩa thành ngữ danh Chúa được xưng trên một dân
  choice: danh ta đã được xưng trên họ
  alternative: những người được gọi bằng danh ta
  rationale: Bản chính giữ lối nói của nguồn Hy Lạp, vốn có thể diễn tả sự thuộc về và được nhận diện bởi danh Chúa, thay vì chọn trước một cách diễn giải thần học hẹp.
- issue: Phạm vi của ἀνθρώπων
  choice: nhân loại
  alternative: loài người
  rationale: Từ này chỉ con người nói chung, không mang ý chỉ riêng nam giới; “nhân loại” vừa chính xác vừa trang trọng trong tiếng Việt hiện đại.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Câu được sắp xếp lại nhẹ để hai nhóm cùng làm chủ thể của “tìm kiếm Chúa,” tránh cấu trúc Hy Lạp gượng gạo trong tiếng Việt; các điểm nhập nhằng quan trọng được giữ bằng chú thích.
