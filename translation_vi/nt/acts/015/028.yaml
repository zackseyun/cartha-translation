    rationale: “Nào khác” có thể nhấn vào một gánh nặng khác loại, trong khi μηδὲν πλέον ... βάρος có nghĩa là không đặt thêm hay không đặt gánh nặng nào lớn hơn, ngoại trừ các điều cần thiết này. “Không đặt thêm gánh nặng nào” diễn đạt trực tiếp hơn trong tiếng Việt.
