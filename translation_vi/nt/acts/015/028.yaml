revisions:
- from: Vì Đức Thánh Linh và chúng tôi đã quyết định không đặt trên anh em gánh nặng nào khác ngoài những điều cần thiết này:[a][b]
  to: Vì Đức Thánh Linh và chúng tôi đã quyết định không đặt thêm gánh nặng nào lên anh em, ngoài những điều cần thiết này:[a][b]
  rationale: Chỉ thay “gánh nặng nào khác” bằng “thêm gánh nặng nào” để phản ánh rõ πλέον, mà vẫn giữ cách dịch tự nhiên của công thức quyết nghị và không diễn giải thêm về thẩm quyền hay bản chất các yêu cầu.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T09:19:07Z'
review_pass:
  verdict: revise
  source_fidelity: Bản dịch truyền đạt đúng công thức quyết nghị phối hợp giữa Đức Thánh Linh và “chúng tôi”, cũng như hình ảnh đặt gánh nặng lên người nhận. Tuy nhiên, “gánh nặng nào khác” không thể hiện rõ sắc thái πλέον (“thêm nữa/xa hơn”), vốn giới hạn việc áp đặt bất cứ gánh nặng bổ sung nào ngoài các điều được nêu.
  naturalness: Câu văn trang trọng, rõ ràng và tự nhiên trong tiếng Việt hiện đại. “Đặt thêm gánh nặng nào lên anh em” vừa mạch lạc vừa sát nghĩa hơn.
  terminology: “Đức Thánh Linh,” “anh em,” “gánh nặng,” và “những điều cần thiết này” phù hợp với văn phong Kinh Thánh tiếng Việt hiện đại. “Đã quyết định” là cách dịch chấp nhận được cho ἔδοξεν trong công thức quyết nghị; chú thích bảo lưu lựa chọn thành ngữ sát hơn.
  issues:
