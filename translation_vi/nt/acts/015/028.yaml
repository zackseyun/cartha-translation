id: ACT.15.28
reference: Acts 15:28
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἔδοξεν γὰρ τῷ ⸂πνεύματι τῷ ἁγίῳ⸃ καὶ ἡμῖν μηδὲν πλέον ἐπιτίθεσθαι ὑμῖν βάρος πλὴν ⸂τούτων τῶν ἐπάναγκες⸃,
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/028.yaml
  text: For it seemed good to the Holy Spirit and to us to place on you no greater burden than these necessary things:[a][b]
translation:
  language: vi
  text: Vì Đức Thánh Linh và chúng tôi đã quyết định không đặt thêm gánh nặng nào lên anh em, ngoài những điều cần thiết này:[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Vì Đức Thánh Linh và chúng tôi thấy là tốt khi không đặt trên anh em…” Cụm từ Hy Lạp cũng được dùng như một công thức nêu quyết định.'
    reason: lexical_alternative
  - marker: b
    text: 'Hoặc: “những điều thiết yếu này” hay “những yêu cầu cần thiết này”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδοξεν
  choice: đã quyết định
  rationale: Động từ vô nhân xưng ở thì aorist trong công thức nghị quyết có thể mang nghĩa “thấy là tốt” hoặc “quyết định”. “Đã quyết định” là cách diễn đạt tự nhiên, trang trọng trong tiếng Việt và phù hợp với bối cảnh hội nghị.
- source_word: τῷ πνεύματι τῷ ἁγίῳ
  choice: Đức Thánh Linh
  rationale: Cách gọi chuẩn trong tiếng Việt hiện đại, diễn tả Đức Thánh Linh như chủ thể có ngôi vị cùng tham dự vào quyết định.
- source_word: καὶ ἡμῖν
  choice: và chúng tôi
  rationale: Giữ nguyên sự phối hợp giữa Đức Thánh Linh và những người đưa ra nghị quyết, không biến câu thành một quyết định thuần túy của con người.
- source_word: μηδὲν πλέον ... βάρος
  choice: không ... gánh nặng nào khác
  rationale: 'Diễn đạt tự nhiên ý so sánh và phủ định: không thêm một gánh nặng nào ngoài các điều sắp nêu.'
- source_word: ἐπιτίθεσθαι ὑμῖν
  choice: đặt trên anh em
  rationale: Giữ hình ảnh đặt một gánh nặng lên người nhận; “anh em” phù hợp với cách xưng hô cộng đồng trong thư.
- source_word: πλὴν
  choice: ngoài
  rationale: Đánh dấu ngoại lệ sau mệnh đề phủ định một cách rõ ràng và tự nhiên trong tiếng Việt.
- source_word: τούτων τῶν ἐπάναγκες
  choice: những điều cần thiết này
  rationale: Bám sát cách chỉ định của tiếng Hy Lạp và hướng tới các quy định được liệt kê ngay sau đó, không giải thích quá mức bản chất của chúng.
theological_decisions:
- issue: Mối liên hệ giữa Đức Thánh Linh và quyết định của hội nghị
  choice: Giữ Đức Thánh Linh và “chúng tôi” như hai thành phần cùng gắn với một quyết định.
  alternative: “Đức Thánh Linh hướng dẫn nên chúng tôi quyết định” hoặc xem câu chỉ là lời tuyên bố đồng thuận của con người.
  rationale: Cấu trúc cách dữ cách phối hợp cả Đức Thánh Linh lẫn “chúng tôi” với ἔδοξεν. Bản dịch bảo toàn sự xác nhận chung mà không giải thích cơ chế hay hạ thấp vai trò có ngôi vị của Đức Thánh Linh.
- issue: Mức độ ràng buộc đối với các tín hữu dân ngoại
  choice: Không đặt thêm gánh nặng nào ngoài các điều cần thiết được nêu.
  alternative: Phủ nhận mọi nghĩa vụ hoặc áp đặt toàn bộ luật Môi-se.
  rationale: Câu Hy Lạp vừa giới hạn gánh nặng vừa duy trì các điều ngoại lệ được gọi là cần thiết; bản dịch không giải quyết căng thẳng này theo một hệ thống thần học về luật pháp.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Đã quyết định” tránh lối dịch sát nhưng gượng “đã thấy là tốt”; chú thích vẫn bảo lưu sắc thái thành ngữ của nguyên văn. Dùng “anh em” theo lối xưng hô cộng đồng, không nhằm xác định giới tính của toàn thể người nhận.
