  terminology: “Phao-lô,” “Pam-phi-ly,” “công việc ấy,” và chú thích từ vựng đều phù hợp với tiếng Việt hiện đại và giữ giọng kể trang trọng. Chú thích nên dùng “bỏ họ” như một khả năng mạnh hơn, không áp đặt sắc thái ấy trong lời chính.
