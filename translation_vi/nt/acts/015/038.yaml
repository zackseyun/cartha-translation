  source_fidelity: 'Bản nháp truyền đạt đúng các ý chính: Phao-lô kiên quyết phản đối việc đem theo người đã rời nhóm từ/tại Pam-phi-ly và đã không tiếp tục đi cùng họ vào công việc. Tuy nhiên, “Phao-lô nhất quyết không nên đem theo” dễ bị hiểu là Phao-lô tự mình là chủ thể của “đem theo”; nguyên văn diễn tả điều ông kiên quyết rằng họ không nên làm. “Rời khỏi họ” cũng phản ánh ἀπ’ αὐτῶν tự nhiên và minh bạch hơn “rời họ”.'
