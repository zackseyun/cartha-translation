  text: Παῦλος δὲ ἠξίου, τὸν ἀποστάντα ἀπ’ αὐτῶν ἀπὸ Παμφυλίας καὶ μὴ συνελθόντα αὐτοῖς εἰς τὸ ἔργον, μὴ ⸀συμπαραλαμβάνειν τοῦτον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/038.yaml
  text: But Paul insisted that they should not take along this man[a], who had withdrawn from them from Pamphylia and had not gone with them to the work.
translation:
  language: vi
  text: Nhưng Phao-lô nhất quyết rằng họ không nên đem theo người này, vì người ấy đã rời khỏi họ tại Pam-phi-ly và đã không đi cùng họ để làm công việc ấy.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đã bỏ họ tại Pam-phi-ly.” Phân từ Hy Lạp có thể mang sắc thái mạnh hơn, nhưng lời chính dùng “đã rời khỏi họ” để tránh diễn giải quá mức.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠξίου
  choice: nhất quyết
  rationale: Dạng chưa hoàn thành của ἀξιόω trong bối cảnh bất đồng diễn tả sự đánh giá kiên quyết của Phao-lô, mạnh hơn một sở thích đơn thuần.
- source_word: ἀποστάντα
  choice: đã rời họ
  rationale: Phân từ của ἀφίσταμαι chỉ việc rời khỏi hay tách khỏi. Cách dịch này giữ lời chính tương đối trung tính, còn sắc thái mạnh hơn được nêu trong chú thích.
- source_word: ἀπ’ αὐτῶν ἀπὸ Παμφυλίας
  choice: đã rời họ tại Pam-phi-ly
  rationale: Hai cụm với ἀπό diễn tả sự tách khỏi Phao-lô và Ba-na-ba, gắn với địa điểm Pam-phi-ly. Tiếng Việt tự nhiên dùng “tại” để chỉ nơi người ấy rời họ, tránh cấu trúc lặp “khỏi… khỏi…” khó hiểu.
- source_word: μὴ συνελθόντα αὐτοῖς
  choice: không cùng họ đi
  rationale: Trong ngữ cảnh hành trình, συνέρχομαι diễn tả việc cùng đi hay tiếp tục đồng hành với họ.
- source_word: εἰς τὸ ἔργον
  choice: làm công việc ấy
  rationale: Giữ nghĩa cụ thể của ἔργον và mạo từ, đồng thời diễn đạt tự nhiên trong tiếng Việt mà không diễn giải thành một thuật ngữ giáo phái như “công tác truyền giáo”.
- source_word: μὴ συμπαραλαμβάνειν τοῦτον
  choice: không nên đem theo người
  rationale: Động từ nguyên mẫu phủ định phụ thuộc vào ἠξίου, nêu điều Phao-lô nhất quyết cho là không nên làm; “đem theo” phản ánh rõ ý đồng hành của συμπαραλαμβάνω.
theological_decisions: []
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng dạng tên riêng “Phao-lô” và “Pam-phi-ly”. Giữ sự căng thẳng trong lời kể nhưng không làm cho hành động của người rời đi mang sắc thái phản bội mạnh hơn điều từ Hy Lạp nhất thiết xác định.
