  to: Nhưng Phao-lô nhất quyết rằng họ không nên đem theo người này, vì người ấy đã rời khỏi họ tại Pam-phi-ly và đã không đi cùng họ để làm công việc ấy.[a]
  rationale: Bản sửa làm rõ rằng sự kiên quyết của Phao-lô nhắm đến việc cả nhóm không đem người này theo, giữ sắc thái chỉ định của τοῦτον bằng “người này”, và cải thiện cách diễn đạt quan hệ “rời khỏi họ”. “Tại Pam-phi-ly” giữ Pam-phi-ly là bối cảnh/xuất phát điểm của việc rời đi, không suy diễn thêm về động cơ.
