  to: Sau khi ở lại một thời gian, họ được các anh chị em[a] tiễn đi trong bình an, đến với những người đã sai phái họ.
  rationale: Bản sửa chỉ loại bỏ ý “trở về” được suy ra từ bối cảnh nhưng không có trong câu Hy Lạp, đồng thời dùng “trong bình an” để biểu đạt minh bạch μετ’ εἰρήνης. Chú thích về ἀδελφῶν được giữ nguyên để nêu hình thức nguyên văn và khả năng nghĩa bao hàm.
