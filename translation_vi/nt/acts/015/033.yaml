  text: ποιήσαντες δὲ χρόνον ἀπελύθησαν μετ’ εἰρήνης ἀπὸ τῶν ἀδελφῶν πρὸς τοὺς ⸂ἀποστείλαντας αὐτούς⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/033.yaml
  text: And after spending some time there[a], they were sent off in peace from the brothers to those who had sent them.
translation:
  language: vi
  text: Sau khi ở lại một thời gian, họ được các anh chị em[a] tiễn đi trong bình an, đến với những người đã sai phái họ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn là “các anh em”; trong ngữ cảnh này, từ ấy có lẽ chỉ toàn thể cộng đồng tín hữu, gồm cả nam lẫn nữ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιήσαντες ... χρόνον
  choice: Sau khi ở lại một thời gian
  rationale: Thành ngữ Hy Lạp có nghĩa là trải qua hoặc lưu lại một khoảng thời gian; cách diễn đạt này tự nhiên trong tiếng Việt và không thêm địa điểm vốn không được nói rõ trong câu.
- source_word: δὲ
  choice: Sau khi
  rationale: δέ là liên từ nhẹ tiếp nối diễn biến; trong cấu trúc tiếng Việt, mối nối tự nhiên đã được thể hiện qua mệnh đề thời gian mở đầu nên không cần dịch riêng là “và” hay “rồi”.
- source_word: ἀπελύθησαν
  choice: được ... tiễn đi
  rationale: Trong bối cảnh các phái viên rời cộng đồng với thiện chí, “tiễn đi” diễn đạt tự nhiên việc cho phép và trân trọng tiễn họ lên đường, tránh sắc thái hành chính của “giải tán” hoặc hàm ý giam giữ của “thả”.
- source_word: μετ’ εἰρήνης
  choice: bình an
  rationale: Cụm này chỉ việc ra đi trong hòa thuận và với lời chúc bình an; “tiễn đi bình an” giữ được sắc thái ấy bằng tiếng Việt tự nhiên.
- source_word: ἀπὸ τῶν ἀδελφῶν
  choice: được các anh chị em[a] tiễn đi
  rationale: ἀδελφῶν có hình thức giống đực số nhiều nhưng trong ngữ cảnh cộng đồng tín hữu thường mang nghĩa bao gồm cả nam lẫn nữ. “Anh chị em” là cách gọi cộng đồng tự nhiên trong tiếng Việt; chú thích ghi rõ hình thức nguyên văn.
- source_word: πρὸς τοὺς ἀποστείλαντας αὐτούς
  choice: để trở về với những người đã sai họ đi
  rationale: πρός chỉ đích đến là những người trước đó đã sai phái họ. “Trở về” được ngữ cảnh và hướng chuyển động về phía bên sai phái hàm ý, còn “đã sai ... đi” thể hiện hành động xảy ra trước.
theological_decisions:
- issue: Phạm vi bao hàm của ἀδελφοί
  choice: các anh chị em
  alternative: các anh em
  rationale: Trong ngữ cảnh này, từ giống đực số nhiều chỉ cộng đồng tín hữu nói chung, không có dấu hiệu giới hạn ở nam giới. Bản dịch chính chuyển tải phạm vi bao hàm tự nhiên trong tiếng Việt, còn chú thích bảo tồn thông tin về hình thức Hy Lạp.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Câu giữ nhịp kể chuyện gọn; “tiễn đi bình an” phản ánh sự chia tay hòa thuận của cộng đồng, còn “sai họ đi” giữ ý sai phái mà không dùng thuật ngữ giáo hội quá chuyên biệt.
