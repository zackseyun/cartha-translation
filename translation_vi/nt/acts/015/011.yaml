source:
  edition: SBLGNT
  text: ἀλλὰ διὰ τῆς χάριτος τοῦ κυρίου Ἰησοῦ πιστεύομεν σωθῆναι καθ’ ὃν τρόπον κἀκεῖνοι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/011.yaml
  text: But through the grace of the Lord Jesus we believe that we will be saved[b][a], just as they also will be.
translation:
  language: vi
  text: Nhưng chúng ta tin rằng chúng ta được cứu nhờ ân điển của Chúa Giê-su, giống như họ cũng được cứu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc sát nghĩa hơn: “Nhưng chúng ta tin được cứu nhờ ân điển của Chúa Giê-su, theo cách mà họ cũng [được cứu].” Động từ “được cứu” được lược ở vế cuối trong tiếng Hy Lạp.'
    reason: Làm rõ cấu trúc nguyên mẫu sau “tin,” ý “cũng” trong κἀκεῖνοι, và động từ được lược trong vế so sánh, mà không ấn định thời tương lai.
lexical_decisions:
- source_word: ἀλλὰ
  choice: Nhưng
  rationale: Giữ rõ sự tương phản mạnh với ách mà tổ phụ và thế hệ hiện tại không thể mang nổi, đồng thời tự nhiên trong tiếng Việt.
- source_word: διὰ τῆς χάριτος
  choice: nhờ ân điển
  rationale: διά với sở hữu cách diễn tả phương tiện; “nhờ” truyền đạt tự nhiên rằng ân điển là phương cách qua đó sự cứu rỗi đến.
- source_word: χάριτος
  choice: ân điển
  rationale: Thuật ngữ quen thuộc, trang trọng và chính xác cho ân huệ cứu độ của Đức Chúa Trời trong ngữ cảnh này.
- source_word: τοῦ κυρίου Ἰησοῦ
  choice: của Chúa Giê-su
  rationale: Cụm sở hữu bổ nghĩa tự nhiên cho “ân điển”, chỉ ân điển thuộc về hoặc do Chúa Giê-su ban.
- source_word: πιστεύομεν
  choice: chúng ta tin
  rationale: Diễn đạt trực tiếp niềm xác tín của người nói và giữ ngôi thứ nhất số nhiều.
- source_word: σωθῆναι
  choice: mình được cứu
  rationale: Động từ nguyên mẫu aorist bị động phụ thuộc πιστεύομεν được chuyển thành mệnh đề tiếng Việt tự nhiên; “mình” quy chiếu về “chúng ta” và không ấn định thái quá thời điểm cứu rỗi.
- source_word: καθ’ ὃν τρόπον
  choice: cũng theo cách như
  rationale: Giữ ý so sánh về phương cách và hướng so sánh của câu Hy Lạp, dù cấu trúc tiếng Việt cần được làm rõ bằng chú thích.
- source_word: κἀκεῖνοι
  choice: họ
  rationale: Chỉ nhóm dân ngoại trong ngữ cảnh; ý καί (“cũng”) được thể hiện trong cả cụm “cũng theo cách như họ” thay vì thêm một từ lặp vụng về.
theological_decisions:
- issue: Hướng so sánh trong lời Phi-e-rơ
  choice: Người Do Thái (“chúng ta”) được cứu theo cùng một cách như người ngoại (“họ”).
  alternative: Họ sẽ được cứu giống như chúng ta.
  rationale: Trật tự Hy Lạp lấy “chúng ta” làm chủ thể của πιστεύομεν σωθῆναι rồi so sánh với “họ”; cách dịch không đảo chiều nhấn mạnh có ý nghĩa trong ngữ cảnh.
- issue: Thời tính của σωθῆναι
  choice: Dùng “được cứu” không thêm dấu hiệu thời tương lai.
  alternative: Sẽ được cứu.
  rationale: Nguyên mẫu aorist không tự thân mã hóa thì tương lai; ngữ cảnh có thể hướng đến sự cứu rỗi được trông đợi, nhưng bản dịch chính không nên quyết định quá mức điều nguồn Hy Lạp để mở.
- issue: Sự cứu rỗi bởi ân điển
  choice: Nói rằng sự cứu rỗi đến nhờ ân điển của Chúa Giê-su, không thêm công thức tín lý khác.
  alternative: Được cứu chỉ bởi ân điển, chỉ qua đức tin.
  rationale: Câu văn nêu ân điển và niềm tin nhưng không chứa các từ tương đương với “chỉ”; không đưa thêm nét riêng của hệ phái.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Ân điển” được giữ vì là thuật ngữ Kinh Thánh phổ biến; “nhờ” tự nhiên hơn “qua” khi diễn tả phương tiện. Dấu chú thích [a] xuất hiện ngay trong chính văn.
