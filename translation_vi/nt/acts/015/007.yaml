  source_fidelity: 'Bản thảo truyền đạt đúng mạch chính của câu: sau cuộc tranh luận, Phi-e-rơ đứng lên nhắc rằng Đức Chúa Trời đã chọn ông để dân ngoại nghe Tin Mừng và tin. Tuy nhiên, “giữa anh em, Đức Chúa Trời đã chọn để...” để động từ “chọn” không có bổ ngữ rõ ràng trong tiếng Việt và tạo cấu trúc khó hiểu. Dù đại từ “tôi” không được viết ra trong tiếng Hy Lạp, nó được hàm ý rất rõ bởi “qua miệng tôi”; thêm nó là cần thiết để tái tạo cú pháp và ý nghĩa trong tiếng Việt.'
