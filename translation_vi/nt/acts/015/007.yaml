  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: πολλῆς δὲ ⸀ζητήσεως γενομένης ἀναστὰς Πέτρος εἶπεν πρὸς αὐτούς· Ἄνδρες ἀδελφοί, ὑμεῖς ἐπίστασθε ὅτι ἀφ’ ἡμερῶν ἀρχαίων ⸂ἐν ὑμῖν ἐξελέξατο ὁ θεὸς⸃ διὰ τοῦ στόματός μου ἀκοῦσαι τὰ ἔθνη τὸν λόγον τοῦ εὐαγγελίου καὶ πιστεῦσαι,
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/007.yaml
  text: And after much debate had taken place[a], Peter stood up and said to them, “Brothers[c][b], you know that from ancient days God chose among you that through my mouth the Gentiles should hear the word of the gospel and believe.”
translation:
  language: vi
  text: 'Sau nhiều cuộc tranh luận, Phi-e-rơ đứng dậy nói với họ: “Thưa anh em[a], anh em biết rằng từ thuở trước[b], Đức Chúa Trời đã chọn tôi trong số anh em để qua miệng tôi, các dân ngoại[c] được nghe lời Tin Mừng và tin.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn là “những người nam, anh em”, một lối xưng hô giống đực số nhiều theo quy ước; những người khác vẫn có thể được đại diện trong lời xưng hô này.
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “từ những ngày đầu” hoặc “từ những ngày xa xưa”.'
    reason: lexical_alternative
  - marker: c
    text: Hay “các dân tộc”; tại đây từ này chỉ những người không phải Do Thái.
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλῆς ... ζητήσεως γενομένης
  choice: Sau một hồi tranh luận nhiều
  rationale: Diễn đạt hoàn cảnh xảy ra trước khi Phi-e-rơ đứng lên; “tranh luận” giữ được sắc thái bàn cãi nghiêm túc mà không nhất thiết hàm ý thù địch.
- source_word: ἀναστὰς
  choice: đứng dậy
  rationale: Cách diễn đạt trực tiếp, tự nhiên cho hành động xảy ra trước lời phát biểu.
- source_word: Ἄνδρες ἀδελφοί
  choice: Thưa anh em
  rationale: Giữ sắc thái thân tộc và hình thức giống đực số nhiều của lời xưng hô, đồng thời phù hợp với tiếng Việt hiện đại.
- source_word: ἐπίστασθε
  choice: anh em biết
  rationale: Diễn đạt trực tiếp tri thức mà những người nghe đã có.
- source_word: ἀφ’ ἡμερῶν ἀρχαίων
  choice: từ những ngày đầu
  rationale: Trong ngữ cảnh, cụm từ chỉ giai đoạn trước đó của việc Tin Mừng đến với dân ngoại; cách dịch này tránh gợi một thời cổ đại quá xa.
- source_word: ἐν ὑμῖν ἐξελέξατο ὁ θεός
  choice: giữa anh em, Đức Chúa Trời đã chọn
  rationale: Giữ trật tự và sự lược bỏ tân ngữ của câu Hy Lạp, thay vì tự ý thêm “tôi” làm tân ngữ của động từ “chọn”.
- source_word: διὰ τοῦ στόματός μου
  choice: qua miệng tôi
  rationale: Bảo tồn hình ảnh cụ thể trong nguyên văn, nhấn mạnh Phi-e-rơ là người phát ngôn được dùng để truyền sứ điệp.
- source_word: τὰ ἔθνη
  choice: các dân ngoại
  rationale: Trong bối cảnh hội nghị tại Giê-ru-sa-lem, từ này chỉ các dân không phải người Do Thái; “các dân ngoại” truyền đạt rõ sự tương phản ấy.
- source_word: τὸν λόγον τοῦ εὐαγγελίου
  choice: lời Tin Mừng
  rationale: Giữ cả ý “lời/sứ điệp” và “Tin Mừng” trong một cách nói trang trọng nhưng dễ hiểu.
- source_word: πιστεῦσαι
  choice: tin
  rationale: 'Giữ sự phối hợp trực tiếp giữa hai động từ nguyên mẫu: nghe và tin.'
theological_decisions:
- issue: Lời xưng hô giống đực Ἄνδρες ἀδελφοί
  choice: Thưa anh em
  alternative: Thưa các ông và anh em; thưa anh chị em
  rationale: Bản dịch chính giữ hình thức giống đực và tình thân tộc của nguyên văn, không tự mở rộng thành “anh chị em”; chú thích nêu rõ tính quy ước của lời xưng hô.
- issue: Tân ngữ không được nói rõ của ἐξελέξατο
  choice: giữa anh em, Đức Chúa Trời đã chọn để...
  alternative: Đức Chúa Trời đã chọn tôi từ giữa anh em để...
  rationale: Nguyên văn không có đại từ “tôi” làm tân ngữ. Cách dịch chính giữ độ mở của cấu trúc, dù theo ngữ cảnh người đọc có thể hiểu sự lựa chọn liên quan đến vai trò của Phi-e-rơ.
- issue: Phạm vi của τὰ ἔθνη
  choice: các dân ngoại
  alternative: các dân tộc
  rationale: Ngữ cảnh tập trung vào những người không phải Do Thái được nghe và tin Tin Mừng; cách dịch này giữ sự phân biệt Do Thái–dân ngoại mà không thêm kết luận giáo phái.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. “Phi-e-rơ”, “Đức Chúa Trời” và “Tin Mừng” dùng dạng quen thuộc trong tiếng Việt Kinh Thánh. Cấu trúc “Đức Chúa Trời đã chọn để...” hơi cô đọng nhằm bảo tồn việc nguyên văn không nói rõ tân ngữ của “chọn”.
