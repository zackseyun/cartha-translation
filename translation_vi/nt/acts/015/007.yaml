- from: 'Sau một hồi tranh luận nhiều, Phi-e-rơ đứng dậy nói với họ: “Thưa anh em[a], anh em biết rằng từ những ngày đầu[b], giữa anh em, Đức Chúa Trời đã chọn để qua miệng tôi, các dân ngoại[c] được nghe lời Tin Mừng và tin.”'
  to: 'Sau nhiều cuộc tranh luận, Phi-e-rơ đứng dậy nói với họ: “Thưa anh em[a], anh em biết rằng từ thuở trước[b], Đức Chúa Trời đã chọn tôi trong số anh em để qua miệng tôi, các dân ngoại[c] được nghe lời Tin Mừng và tin.”'
  rationale: Bản sửa chữa khắc phục hai điểm về ngữ pháp và độ tự nhiên. “Tôi” được thêm sau “đã chọn” vì đây là bổ ngữ được hàm ý bởi cú pháp và ngữ cảnh trực tiếp của nguyên ngữ, chứ không phải một diễn giải giáo phái. “Từ thuở trước” giữ nét hồi tưởng về thời kỳ trước đó của ἀφ’ ἡμερῶν ἀρχαίων, với các phương án gần nghĩa được bảo lưu trong chú thích.
