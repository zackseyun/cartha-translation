translation:
  language: vi
  text: đã được biết từ ngàn xưa[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Một số bản chép tay có cách đọc đầy đủ hơn: “đã được biết từ đời đời” hoặc “Đấng làm cho những việc này được biết từ ngàn xưa.”'
    reason: textual_variant
lexical_decisions:
- source_word: γνωστὰ
  choice: đã được biết
  rationale: Tính từ ở vị ngữ trong mệnh đề không có động từ; cách dịch này diễn đạt tự nhiên trạng thái “được biết” mà không thêm ý “được làm cho biết” vốn không hiển nhiên trong từ Hy Lạp.
- source_word: ἀπ’
  choice: từ
  rationale: Giữ nghĩa thông thường của ἀπό để chỉ mốc khởi đầu về thời gian.
- source_word: αἰῶνος
  choice: ngàn xưa
  rationale: Trong thành ngữ thời gian này, αἰών có thể chỉ thời xa xưa. “Từ ngàn xưa” vừa tự nhiên, trang trọng, vừa tránh nâng nghĩa thành “từ đời đời” trong chính văn.
theological_decisions:
- issue: Phạm vi thời gian của điều được biết trong mệnh đề cô đọng
  choice: Dịch là “đã được biết từ ngàn xưa,” không khai triển thành một khẳng định mạnh hơn về sự biết trước từ đời đời.
  alternative: “đã được biết từ đời đời” hoặc “Đấng làm cho những việc này được biết từ ngàn xưa”
  rationale: 'Bản SBLGNT rất ngắn: γνωστὰ ἀπ’ αἰῶνος. Bản dịch giữ sự cô đọng và không đưa cách đọc dài hơn hay suy luận thần học vào chính văn; dị bản được ghi ở chú thích.'
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, cô đọng và trang trọng. Cụm “từ ngàn xưa” dễ hiểu đối với độc giả phổ thông và phù hợp sắc thái cổ xưa của thành ngữ.
