  text: διὸ ἐγὼ κρίνω μὴ παρενοχλεῖν τοῖς ἀπὸ τῶν ἐθνῶν ἐπιστρέφουσιν ἐπὶ τὸν θεόν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/019.yaml
  text: Therefore I judge that we should not trouble those from among the Gentiles who are turning to God[b][a],
translation:
  language: vi
  text: Vì vậy, tôi xét rằng chúng ta không nên gây khó khăn cho những người xuất thân từ các dân ngoại[a] đang quay về với Đức Chúa Trời.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “những người từ các dân đang quay về với Đức Chúa Trời.” Từ Hy Lạp có nghĩa là “các dân,” nhưng trong ngữ cảnh này chỉ những người không thuộc dân Do Thái.
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “tôi kết luận là không nên gây khó khăn” hoặc “theo sự xét đoán của tôi, không nên gây khó khăn.” Tiếng Hy Lạp không nêu rõ chủ thể của hành động “gây khó khăn.”'
    reason: alternative_reading
lexical_decisions:
- source_word: διὸ
  choice: Vì vậy
  rationale: Diễn tả kết luận rút ra từ lập luận ngay trước đó của Gia-cơ, đồng thời tự nhiên trong tiếng Việt hiện đại.
- source_word: ἐγὼ κρίνω
  choice: tôi xét rằng
  rationale: Giữ rõ đại từ ngôi thứ nhất ἐγώ và sắc thái nhận định có cân nhắc của κρίνω; “xét rằng” trang trọng vừa phải và phù hợp ngữ cảnh nghị luận.
- source_word: μὴ παρενοχλεῖν
  choice: chúng ta không nên gây khó khăn
  rationale: παρενοχλέω chỉ việc làm phiền hoặc gây trở ngại. Cách dịch này diễn đạt tự nhiên nội dung đề nghị của Gia-cơ đối với cả hội nghị, dù chủ thể của động từ nguyên mẫu không được nói rõ trong tiếng Hy Lạp.
- source_word: τοῖς ἀπὸ τῶν ἐθνῶν
  choice: cho những người từ các dân ngoại
  rationale: Giữ tham chiếu đến những người xuất thân từ các dân, thay vì biến cụm từ thành một phạm trù trừu tượng.
- source_word: ἐθνῶν
  choice: các dân ngoại
  rationale: Trong ngữ cảnh Do Thái–Cơ Đốc này, từ ngữ chỉ các dân không thuộc dân Do Thái; “các dân ngoại” vừa rõ nghĩa vừa còn lưu dấu nghĩa đen “các dân”.
- source_word: ἐπιστρέφουσιν
  choice: đang quay về
  rationale: Phân từ hiện tại diễn tả tiến trình đang diễn ra. “Quay về” giữ hình ảnh chuyển hướng của động từ và tránh biến nó thành một thuật ngữ giáo phái.
- source_word: ἐπὶ τὸν θεόν
  choice: với Đức Chúa Trời
  rationale: Kết hợp với “quay về” để diễn đạt hướng quy về Đức Chúa Trời bằng lối nói tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Đây chỉ là ý kiến riêng của Gia-cơ hay là lời đề nghị về hành động chung của hội nghị
  choice: “tôi xét rằng chúng ta không nên gây khó khăn”
  alternative: “tôi xét là không nên gây khó khăn” hoặc “theo sự xét đoán của tôi, không nên gây khó khăn”
  rationale: Bản Hy Lạp nêu rõ chủ thể ngôi thứ nhất số ít của κρίνω, nhưng mệnh đề nguyên mẫu nói đến quyết định thực tiễn của cộng đồng. Bản dịch giữ tiếng nói cá nhân của Gia-cơ và nêu rõ lực đề nghị chung, đồng thời chú thích sự không xác định về chủ thể.
- issue: Sắc thái của ἐπιστρέφουσιν ἐπὶ τὸν θεόν
  choice: “đang quay về với Đức Chúa Trời”
  alternative: “đang hướng về Đức Chúa Trời” hoặc “đang trở lại với Đức Chúa Trời”
  rationale: “Quay về” bảo tồn hình ảnh đổi hướng mà không khẳng định rằng những người này trước kia đã từng thuộc về Đức Chúa Trời theo một nghĩa thần học cụ thể.
translation_notes:
  register: 'Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Trời” làm cách gọi tôn kính, phổ thông trong văn bản Kinh Thánh tiếng Việt; tránh thuật ngữ hệ phái. Thứ tự dấu chú thích đi theo vị trí liên quan trong câu: [a] sau cụm “các dân ngoại,” [b] ở cuối nội dung phán đoán.'
