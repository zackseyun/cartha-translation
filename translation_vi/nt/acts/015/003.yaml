id: ACT.15.3
reference: Acts 15:3
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οἱ μὲν οὖν προπεμφθέντες ὑπὸ τῆς ἐκκλησίας διήρχοντο τήν ⸀τε Φοινίκην καὶ Σαμάρειαν ἐκδιηγούμενοι τὴν ἐπιστροφὴν τῶν ἐθνῶν, καὶ ἐποίουν χαρὰν μεγάλην πᾶσι τοῖς ἀδελφοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/003.yaml
  text: So then[a], having been sent on their way by the church, they passed through both Phoenicia and Samaria, describing in detail the conversion of the Gentiles[b], and they brought great joy to all the brothers.
translation:
  language: vi
  text: Vậy, sau khi được hội thánh tiễn lên đường, họ đi qua cả Phê-ni-xê lẫn Sa-ma-ri, thuật lại tường tận việc các dân ngoại quay về[a], và đem lại niềm vui lớn cho tất cả anh chị em[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “sự cải đạo của các dân ngoại”; nghĩa đen là “sự quay về của các dân ngoại.”
    reason: lexical_alternative
  - marker: b
    text: Từ Hy Lạp ở đây có hình thức “anh em” nhưng trong ngữ cảnh có thể chỉ chung các tín hữu, gồm cả nam lẫn nữ.
    reason: lexical_clarification
lexical_decisions:
- source_word: οἱ μὲν οὖν
  choice: Vậy
  rationale: Diễn đạt tự nhiên sắc thái chuyển tiếp và tiếp nối của μὲν οὖν trong mạch tường thuật, không cố tái tạo máy móc từng tiểu từ.
- source_word: προπεμφθέντες ὑπὸ τῆς ἐκκλησίας
  choice: sau khi được hội thánh tiễn lên đường
  rationale: προπέμπω trong ngữ cảnh hành trình thường hàm ý cộng đồng giúp đỡ hoặc tiễn người đi tiếp; “tiễn lên đường” giữ được sắc thái ấy mà không khẳng định cụ thể rằng có người hộ tống suốt đường.
- source_word: ἐκκλησίας
  choice: hội thánh
  rationale: Trong Công Vụ, từ này chỉ cộng đồng các tín hữu; “hội thánh” là cách gọi quen thuộc, trang trọng và phù hợp ngữ cảnh.
- source_word: διήρχοντο τήν τε Φοινίκην καὶ Σαμάρειαν
  choice: họ đi qua cả Phê-ni-xê lẫn Sa-ma-ri
  rationale: “Đi qua” phản ánh hành trình đang diễn tiến của động từ ở thì chưa hoàn thành; “cả… lẫn…” thể hiện kết cấu tương liên τε…καί. Địa danh được phiên âm theo cách quen thuộc trong tiếng Việt.
- source_word: ἐκδιηγούμενοι
  choice: thuật lại tường tận
  rationale: Động từ ghép nhấn mạnh việc kể lại đầy đủ, chi tiết; cách dịch này vừa sát nghĩa vừa tự nhiên.
- source_word: τὴν ἐπιστροφὴν τῶν ἐθνῶν
  choice: việc các dân ngoại quay về
  rationale: “Quay về” giữ hình ảnh cốt lõi của ἐπιστροφή và trong ngữ cảnh được hiểu là quay về với Đức Chúa Trời, nhưng không thêm đối tượng vốn không được nêu trực tiếp trong câu. “Các dân ngoại” diễn đạt τὰ ἔθνη trong sự phân biệt với người Do Thái ở Công Vụ 15.
- source_word: ἐποίουν χαρὰν μεγάλην
  choice: đem lại niềm vui lớn
  rationale: Diễn đạt tự nhiên thành ngữ ποιέω kết hợp với danh từ, đồng thời giữ rõ ý nghĩa gây nên niềm vui.
- source_word: πᾶσι τοῖς ἀδελφοῖς
  choice: cho tất cả anh chị em
  rationale: Trong ngữ cảnh cộng đồng tín hữu, số nhiều giống đực ἀδελφοῖς có thể bao gồm cả nam lẫn nữ. “Anh chị em” truyền đạt chính xác phạm vi chỉ người trong tiếng Việt hiện đại và vẫn giữ hình ảnh quan hệ gia đình thuộc linh.
theological_decisions:
- issue: Ý nghĩa của ἐπιστροφή đối với các dân ngoại
  choice: việc các dân ngoại quay về
  alternative: sự cải đạo của các dân ngoại
  rationale: “Quay về” bảo tồn ẩn dụ và độ mở của danh từ Hy Lạp, tránh làm câu mang màu sắc thuật ngữ thần học về sau. Ngữ cảnh sứ vụ cho thấy đây là việc quay về với Đức Chúa Trời, nhưng câu này không nêu trực tiếp bổ ngữ ấy.
- issue: Phạm vi của ἀδελφοῖς trong cộng đồng tín hữu
  choice: anh chị em
  alternative: các anh em
  rationale: Danh từ giống đực số nhiều trong tiếng Hy Lạp có thể chỉ toàn thể cộng đồng gồm cả nam và nữ. Tiếng Việt cần nêu cả hai thành tố để người đọc không hiểu sai là chỉ nam giới; chú thích bảo tồn thông tin về hình thức Hy Lạp.
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại. Dùng “hội thánh,” “các dân ngoại” và “anh chị em” là những cách nói dễ hiểu trong tiếng Việt Cơ Đốc đương đại; giữ cấu trúc câu liền mạch và nhịp điệu rõ ràng.
