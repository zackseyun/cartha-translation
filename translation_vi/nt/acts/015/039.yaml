    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο δὲ
  choice: Bấy giờ xảy ra
  rationale: Diễn đạt tự nhiên sự chuyển tiếp và sự xuất hiện của một tình huống mới trong mạch kể chuyện; δέ được thể hiện nhẹ nhàng, không nhấn quá mức ý tương phản.
- source_word: παροξυσμὸς
  choice: một cuộc tranh luận gay gắt
  rationale: Trong ngữ cảnh, từ này chỉ một sự xung đột mãnh liệt giữa hai người; cách dịch giữ mức độ nghiêm trọng mà không quy kết động cơ hay lỗi đạo đức.
- source_word: ὥστε ἀποχωρισθῆναι αὐτοὺς ἀπ’ ἀλλήλων
  choice: đến nỗi hai người chia tay nhau
  rationale: Giữ quan hệ mức độ–kết quả của ὥστε với động từ nguyên mẫu, đồng thời dùng cấu trúc tiếng Việt tự nhiên. 'Hai người' làm rõ đại từ số nhiều từ ngữ cảnh.
- source_word: τόν τε Βαρναβᾶν
  choice: Ba-na-ba
  rationale: τε mở đầu hành động của một bên trong sự phân chia, sẽ được đối ứng ở câu kế tiếp; tiếng Việt không cần thêm một liên từ nặng ở đây.
- source_word: παραλαβόντα τὸν Μᾶρκον
  choice: đem theo Mác
  rationale: Thể hiện rõ nghĩa đưa một người cùng đi của παραλαμβάνω và giữ đúng tên gọi ngắn 'Mác' trong câu Hy Lạp.
- source_word: ἐκπλεῦσαι εἰς Κύπρον
  choice: đi thuyền sang đảo Síp
  rationale: Diễn đạt việc rời đi bằng đường biển đến Κύπρος. Thêm 'đảo' là sự minh thị hóa địa lý tự nhiên trong tiếng Việt, không thay đổi đích đến.
theological_decisions:
- issue: Cách thuật lại xung đột giữa những người cùng phục vụ
  choice: Nói thẳng đây là một cuộc tranh luận gay gắt, không làm nhẹ đi hay phán xét bên nào.
  alternative: một sự xung đột gay gắt; một cơn bất hòa dữ dội
  rationale: Bản văn thuật lại một cuộc đụng độ thật sự và mãnh liệt nhưng không nêu ai đúng hay sai trong chính câu này; bản dịch giữ nguyên sự căng thẳng ấy.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Dùng 'tranh luận gay gắt' để truyền đạt cường độ của παροξυσμός; dấu phẩy cuối câu được giữ vì câu Hy Lạp và lớp tham khảo tiếng Anh tiếp tục sang câu kế.
