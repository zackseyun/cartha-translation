  source_fidelity: 'Bản dịch truyền đạt đúng mạch chính: một sự bất hòa dữ dội dẫn đến việc hai người tách ra; Ba-na-ba đưa Mác đi thuyền đến Síp. Tuy nhiên, “tranh luận” thu hẹp παροξυσμός vào bất đồng bằng lời, trong khi từ này nói rộng hơn về sự xung đột/bất hòa gay gắt. “Chia tay nhau” cũng có sắc thái quan hệ hoặc tình cảm trong tiếng Việt hiện đại, kém chính xác hơn đối với việc họ tách đường trong công tác.'
  naturalness: Câu văn nhìn chung tự nhiên. “Bấy giờ” không sai nhưng có thể bỏ để giữ liên kết nhẹ của δέ. “Đảo Síp” là cách gọi địa lý tự nhiên, nhưng “sang đảo Síp” có thể gợi đối lập bờ bên này/bên kia không có trong nguyên văn; “đến Síp” trực tiếp và trung tính hơn. Dấu phẩy cuối câu phù hợp vì cấu trúc tiếp tục ở câu 40.
  terminology: Nên dùng “một sự bất hòa gay gắt” (hoặc “một cuộc xung đột gay gắt”) cho παροξυσμός. “Sự bất hòa” bao quát tranh cãi và xung đột mà không quy định hình thức hay phân xử lỗi. Tên riêng Ba-na-ba, Mác và Síp nhất quán, dễ nhận diện trong quy ước chính tả hiện hành.
