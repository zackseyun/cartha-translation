id: ACT.15.12
reference: Acts 15:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἐσίγησεν δὲ πᾶν τὸ πλῆθος, καὶ ἤκουον Βαρναβᾶ καὶ Παύλου ἐξηγουμένων ὅσα ἐποίησεν ὁ θεὸς σημεῖα καὶ τέρατα ἐν τοῖς ἔθνεσιν δι’ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/012.yaml
  text: And the whole assembly fell silent[a], and they listened to Barnabas and Paul as they related what signs and wonders God had done among the Gentiles through them.
translation:
  language: vi
  text: Cả hội chúng đều im lặng và lắng nghe Ba-na-ba cùng Phao-lô thuật lại những dấu lạ và phép mầu mà Đức Chúa Trời đã thực hiện giữa các dân ngoại[a] qua họ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “giữa các dân.” Trong bối cảnh hội nghị tại Giê-ru-sa-lem, ἔθνεσιν ở đây chỉ cụ thể các dân ngoại, tức những người không phải Do Thái.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐσίγησεν
  choice: đều im lặng
  rationale: Động từ aorist diễn tả việc toàn thể hội chúng đi vào trạng thái im lặng; trong mạch kể tiếng Việt, “đều im lặng” tự nhiên và vẫn thể hiện sự chuyển biến theo ngữ cảnh.
- source_word: πᾶν τὸ πλῆθος
  choice: cả hội chúng
  rationale: Chỉ toàn thể những người đang nhóm họp trong cuộc nghị luận tại Giê-ru-sa-lem; “hội chúng” phù hợp bối cảnh hơn “đám đông”.
- source_word: ἤκουον
  choice: lắng nghe
  rationale: Thì chưa hoàn thành gợi hành động nghe đang tiếp diễn và có chú ý; “lắng nghe” truyền đạt rõ sắc thái ấy.
- source_word: Βαρναβᾶ καὶ Παύλου
  choice: Ba-na-ba cùng Phao-lô
  rationale: Dùng dạng tên riêng quen thuộc trong truyền thống Kinh Thánh tiếng Việt; “cùng” nối hai người một cách tự nhiên.
- source_word: ἐξηγουμένων
  choice: thuật lại
  rationale: Diễn tả việc kể lại hoặc trình bày một bản tường thuật, không nhất thiết hàm ý giải thích hay diễn giải.
- source_word: ὅσα
  choice: những
  rationale: Trong cấu trúc ὅσα... σημεῖα καὶ τέρατα, “những dấu lạ và phép mầu mà...” là cách diễn đạt tiếng Việt tự nhiên, không mở rộng đối tượng sang các việc khác ngoài cặp danh từ được nêu.
- source_word: ἐποίησεν ὁ θεὸς
  choice: Đức Chúa Trời đã thực hiện
  rationale: Giữ Đức Chúa Trời làm chủ thể hành động; “đã thực hiện” phù hợp với những việc xảy ra trước lời thuật lại.
- source_word: σημεῖα καὶ τέρατα
  choice: dấu lạ và phép mầu
  rationale: Giữ cặp thuật ngữ quen thuộc chỉ các hành động phi thường của Đức Chúa Trời, không thêm từ giải nghĩa như “kỳ diệu”.
- source_word: ἐν τοῖς ἔθνεσιν
  choice: giữa các dân ngoại
  rationale: Trong bối cảnh Công Vụ 15, từ này nói cụ thể đến các dân không phải Do Thái; “các dân ngoại” bảo toàn cả sắc thái số nhiều và ý nghĩa ngữ cảnh.
- source_word: δι’ αὐτῶν
  choice: qua họ
  rationale: 'διά với sở hữu cách chỉ phương tiện: Đức Chúa Trời là tác nhân chính, còn Ba-na-ba và Phao-lô là những người Ngài dùng.'
theological_decisions:
- issue: Chủ thể thần linh trong sứ mạng của các sứ đồ
  choice: Đức Chúa Trời là Đấng thực hiện các dấu lạ và phép mầu qua Ba-na-ba và Phao-lô.
  alternative: Hiểu Ba-na-ba và Phao-lô là những người tự mình thực hiện các dấu lạ và phép mầu theo nghĩa chủ yếu.
  rationale: Cú pháp Hy Lạp đặt ὁ θεὸς làm chủ ngữ của ἐποίησεν, còn δι’ αὐτῶν chỉ phương tiện. Bản dịch giữ nguyên điểm nhấn ấy mà không phủ nhận sự tham dự thật sự của hai người.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc câu bám sát trật tự ý nghĩa của tiếng Hy Lạp nhưng được điều chỉnh cho tự nhiên trong tiếng Việt; giữ rõ tác nhân là Đức Chúa Trời và vai trò phương tiện của Ba-na-ba cùng Phao-lô.
