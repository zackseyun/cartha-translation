base_translation:
  language: en
  yaml_path: translation/nt/acts/015/027.yaml
  text: Therefore we have sent Judas and Silas[b][a], who themselves will report the same things by word of mouth.
translation:
  language: vi
  text: Vì vậy, chúng tôi đã cử Giu-đa và Si-la[a]; chính họ sẽ thuật lại cùng những điều ấy bằng lời nói.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “chúng tôi cử Giu-đa và Si-la.” Thì hoàn thành trong tiếng Hy Lạp nhấn mạnh rằng việc cử đi đã được thực hiện và còn liên quan đến hoàn cảnh hiện tại.'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “qua lời”; nghĩa là truyền đạt bằng lời nói, bên cạnh bức thư.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεστάλκαμεν
  choice: chúng tôi đã phái ... đến
  rationale: Thì hoàn thành diễn tả việc phái đi đã được thực hiện và vẫn liên quan đến hiện tại; cách nói tiếng Việt với “đã” tự nhiên trong văn thư và giữ được trọng tâm ấy.
- source_word: οὖν
  choice: Vì vậy
  rationale: Nêu kết luận phát sinh từ quyết định vừa trình bày của hội đồng.
- source_word: Ἰούδαν καὶ Σιλᾶν
  choice: Giu-đa và Si-la
  rationale: Phiên âm tên riêng theo lối quen dùng trong tiếng Việt.
- source_word: αὐτοὺς
  choice: chính họ
  rationale: 'Giữ sắc thái nhấn mạnh của đại từ: hai sứ giả đích thân xác nhận nội dung thư.'
- source_word: διὰ λόγου
  choice: trực tiếp nói lại
  rationale: Trong ngữ cảnh đối chiếu với thư viết, cụm từ chỉ việc truyền đạt bằng lời nói; “trực tiếp nói” tự nhiên hơn cách dịch sát chữ “qua lời”.
- source_word: ἀπαγγέλλοντας
  choice: sẽ ... nói lại
  rationale: Phân từ hiện tại mô tả việc Giu-đa và Si-la sẽ làm khi được sai đi; dùng động từ hữu hạn ở tương lai giúp câu tiếng Việt rõ và tự nhiên.
- source_word: τὰ αὐτά
  choice: những điều ấy
  rationale: Chỉ cùng những nội dung trong thư của hội đồng, không thu hẹp thành một “thông điệp” duy nhất.
