source:
  edition: SBLGNT
  text: ἐπειδὴ ἠκούσαμεν ὅτι τινὲς ἐξ ἡμῶν ⸀ἐξελθόντες ἐτάραξαν ὑμᾶς λόγοις ἀνασκευάζοντες τὰς ψυχὰς ⸀ὑμῶν οἷς οὐ διεστειλάμεθα,
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/024.yaml
  text: Since we have heard that some went out from us and troubled you with words[a], unsettling your souls, to whom we gave no instructions[b],
translation:
  language: vi
  text: Vì chúng tôi đã nghe rằng một số người từ giữa chúng tôi đi ra đã dùng lời nói gây rối cho anh em, làm rối trí anh em, mà chúng tôi không hề ra chỉ thị cho họ,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπειδὴ ἠκούσαμεν
  choice: Vì chúng tôi nghe rằng
  rationale: Diễn đạt tự nhiên mệnh đề nêu căn cứ của bức thư; thì quá khứ trong tiếng Hy Lạp không cần được đánh dấu cứng nhắc trong tiếng Việt.
- source_word: τινὲς ἐξ ἡμῶν ἐξελθόντες
  choice: có vài người từ chỗ chúng tôi đi ra
  rationale: Giữ cả ý họ xuất phát từ cộng đồng Giê-ru-sa-lem lẫn hành động đi ra, nhưng không hàm ý họ được cộng đồng ấy ủy quyền.
- source_word: ἐτάραξαν ὑμᾶς λόγοις
  choice: đã dùng lời lẽ gây rối cho anh em
  rationale: Chuyển cách dụng cụ của λόγοις thành cấu trúc tiếng Việt tự nhiên, đồng thời giữ ý lời nói gây xáo trộn và khốn khó.
- source_word: ἀνασκευάζοντες τὰς ψυχὰς ὑμῶν
  choice: làm tâm trí anh em hoang mang
  rationale: Trong văn cảnh, ψυχαί chỉ con người nội tâm, còn ἀνασκευάζω mang sắc thái làm đảo lộn hoặc phá vỡ sự ổn định; cách dịch này tự nhiên hơn 'linh hồn' trong tiếng Việt và không giới hạn tác động vào cảm xúc.
- source_word: οἷς οὐ διεστειλάμεθα
  choice: dù chúng tôi không hề chỉ thị cho họ
  rationale: Làm rõ đại từ quan hệ chỉ những người vừa nhắc đến và bảo toàn điểm chính rằng họ không nhận được chỉ thị hay sự ủy nhiệm. 'Dù' biểu thị quan hệ tương phản được ngữ cảnh hàm chứa, không biến câu thành lời kết án mạnh hơn nguyên văn.
theological_decisions:
- issue: Những người gây rối có được các sứ đồ và trưởng lão tại Giê-ru-sa-lem ủy quyền hay không
  choice: dù chúng tôi không hề chỉ thị cho họ
  alternative: là những người chúng tôi không truyền lệnh
  rationale: Nguyên văn phủ nhận việc cộng đồng lãnh đạo đã ra chỉ thị cho họ. Bản dịch giữ rõ sự thiếu ủy quyền nhưng không thêm rằng họ hoàn toàn không thuộc cộng đồng hoặc cố ý phản nghịch.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” để chỉ cộng đồng tín hữu nói chung theo lối xưng hô thư tín; “tâm trí” chuyển tải ψυχή trong văn cảnh này mà không áp đặt sự phân chia kỹ thuật giữa linh hồn, tâm trí và cảm xúc.
