revisions:
- from: 'Có mấy người từ Giu-đê xuống, dạy các anh em[a] rằng: “Nếu anh em không chịu cắt bì theo tục lệ của Môi-se thì không thể được cứu.”'
  to: 'Có vài người từ Giu-đê xuống, đang dạy các anh em[a] rằng: “Nếu anh em không được cắt bì theo tục lệ của Môi-se thì không thể được cứu.”'
  rationale: Sửa «không chịu cắt bì» thành «không được cắt bì» để không thêm sắc thái tự nguyện vào thể bị động Hy Lạp. Thay «dạy» bằng «đang dạy» để phản ánh thì chưa hoàn thành, và điều chỉnh nhẹ cách diễn đạt mở đầu cùng chú thích cho tự nhiên hơn mà không đổi nghĩa.
  reviewer_model: gpt-5.6-terra
