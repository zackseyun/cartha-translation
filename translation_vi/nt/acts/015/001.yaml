id: ACT.15.1
reference: Acts 15:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καί τινες κατελθόντες ἀπὸ τῆς Ἰουδαίας ἐδίδασκον τοὺς ἀδελφοὺς ὅτι Ἐὰν μὴ ⸀περιτμηθῆτε τῷ ἔθει ⸀τῷ Μωϋσέως, οὐ δύνασθε σωθῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/001.yaml
  text: And some men came down from Judea and were teaching the brothers[a], “Unless you are circumcised according to the custom of Moses, you cannot be saved.”
translation:
  language: vi
  text: 'Có vài người từ Giu-đê xuống, đang dạy các anh em[a] rằng: “Nếu anh em không được cắt bì theo tục lệ của Môi-se thì không thể được cứu.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể hiểu là “các anh chị em”; nguyên văn Hy Lạp dùng “anh em” và có lẽ chỉ cộng đồng tín hữu bao gồm cả nam lẫn nữ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καί
  choice: Có
  rationale: Trong mạch kể tiếng Việt, không cần dịch máy móc liên từ Καί; mở đầu bằng “Có mấy người” vừa tự nhiên vừa giữ chức năng nối tiếp của câu.
- source_word: τινες
  choice: mấy người
  rationale: Diễn đạt tự nhiên một nhóm người không xác định nhưng cụ thể; ngữ cảnh và dạng giống đực cho phép hiểu là nam giới mà không cần thêm từ giải thích.
- source_word: κατελθόντες ἀπὸ τῆς Ἰουδαίας
  choice: từ Giu-đê xuống
  rationale: Giữ hình ảnh địa lý “xuống” từ Giu-đê đến An-ti-ốt và chuyển phân từ thành cấu trúc kể chuyện tự nhiên trong tiếng Việt.
- source_word: ἐδίδασκον
  choice: dạy
  rationale: Thì chưa hoàn thành diễn tả hoạt động đang diễn ra hoặc lặp lại; trong ngữ cảnh này, “dạy” tự nhiên, còn quan hệ với động từ chính cho thấy đây là hoạt động họ tiến hành sau khi đến.
- source_word: τοὺς ἀδελφοὺς
  choice: các anh em
  rationale: Giữ cách gọi cộng đồng bằng danh từ giống đực số nhiều của nguyên văn; chú thích nêu khả năng từ này bao gồm cả cộng đồng tín hữu nam và nữ.
- source_word: Ἐὰν μὴ περιτμηθῆτε
  choice: Nếu anh em không chịu cắt bì
  rationale: Giữ cấu trúc điều kiện phủ định và thể bị động của περιτμηθῆτε theo lối nói tiếng Việt tự nhiên; “chịu cắt bì” chỉ việc được thực hiện nghi lễ, không hàm ý miễn cưỡng.
- source_word: τῷ ἔθει τῷ Μωϋσέως
  choice: theo tục lệ của Môi-se
  rationale: ἔθος chỉ tập tục hay lệ đã được thiết lập; “theo” diễn đạt tự nhiên giá trị chuẩn mực của cách dùng cách ba.
- source_word: οὐ δύνασθε σωθῆναι
  choice: không thể được cứu
  rationale: Giữ rõ ý bất khả và thể bị động; trong cuộc tranh luận này, σωθῆναι mang nghĩa cứu rỗi chứ không chỉ thoát khỏi nguy hiểm trước mắt.
theological_decisions:
- issue: Ý nghĩa của σωθῆναι trong cuộc tranh luận dẫn đến hội nghị Giê-ru-sa-lem
  choice: được cứu
  alternative: được giải cứu
  rationale: Ngữ cảnh bàn về việc cắt bì có phải là điều kiện cần thiết để được cứu hay không. “Được cứu” giữ nguyên sức nặng cứu rỗi học mà không xác nhận lời dạy này là đúng.
- issue: Phạm vi chỉ người của ἀδελφοὺς
  choice: các anh em
  alternative: các anh chị em; các tín hữu
  rationale: Nguyên văn dùng danh từ giống đực số nhiều, nhưng trong Công Vụ từ này có thể gọi chung cộng đồng tin Chúa. Bản chính giữ hình thức gần nguyên văn, còn chú thích bảo tồn khả năng bao hàm.
translation_notes:
  register: 'Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng các tên riêng quen thuộc trong Kinh Thánh tiếng Việt: Giu-đê, Môi-se. Dấu hai chấm dẫn trực tiếp lời giảng dạy; đại từ “anh em” trong lời trích phù hợp với đối tượng được gọi là “các anh em”.'
