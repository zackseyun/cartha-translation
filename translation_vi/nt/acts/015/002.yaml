revisions:
- from: Sau khi giữa Phao-lô và Ba-na-ba với họ xảy ra một cuộc bất đồng và tranh luận không nhỏ[a], người ta cử Phao-lô, Ba-na-ba cùng một vài người khác trong số họ đi lên[b] Giê-ru-sa-lem gặp các sứ đồ và trưởng lão để bàn về vấn đề này[c].
  to: Sau khi Phao-lô và Ba-na-ba có một cuộc bất đồng và tranh luận không nhỏ[a] với họ, người ta cử Phao-lô, Ba-na-ba cùng một vài người khác trong số họ đi lên[b] Giê-ru-sa-lem gặp các sứ đồ và các trưởng lão về vấn đề này[c].
  rationale: Bản sửa thay cấu trúc giới từ không tự nhiên bằng cách diễn đạt rõ Phao-lô và Ba-na-ba là một phía trong cuộc tranh luận với “họ,” vẫn giữ quy chiếu của αὐτούς mở theo ngữ cảnh trước đó. Đồng thời, “về vấn đề này” phản ánh trực tiếp περὶ τοῦ ζητήματος τούτου, không diễn giải thêm mục đích của chuyến đi. Chú thích a được chỉnh để giải thích phép nói giảm phủ định áp dụng cho cả cuộc bất đồng lẫn tranh luận.
