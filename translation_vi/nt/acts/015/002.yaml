id: ACT.15.2
reference: Acts 15:2
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: γενομένης ⸀δὲ στάσεως καὶ ζητήσεως οὐκ ὀλίγης τῷ Παύλῳ καὶ τῷ Βαρναβᾷ πρὸς αὐτοὺς ἔταξαν ἀναβαίνειν Παῦλον καὶ Βαρναβᾶν καί τινας ἄλλους ἐξ αὐτῶν πρὸς τοὺς ἀποστόλους καὶ πρεσβυτέρους εἰς Ἰερουσαλὴμ περὶ τοῦ ζητήματος τούτου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/002.yaml
  text: And after no small dissension and debate had arisen between Paul and Barnabas and them[c][b][a], they appointed Paul and Barnabas and some others from among them to go up to the apostles and elders in Jerusalem about this issue.
translation:
  language: vi
  text: Sau khi Phao-lô và Ba-na-ba có một cuộc bất đồng và tranh luận không nhỏ[a] với họ, người ta cử Phao-lô, Ba-na-ba cùng một vài người khác trong số họ đi lên[b] Giê-ru-sa-lem gặp các sứ đồ và các trưởng lão về vấn đề này[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “một cuộc bất đồng và tranh luận đáng kể”. Tiếng Hy Lạp dùng lối nói giảm phủ định, sát nghĩa là “không nhỏ”, để nhấn mạnh mức độ nghiêm trọng của cuộc bất đồng và tranh luận.
    reason: lexical_alternative
  - marker: b
    text: “Đi lên” là cách nói Hy Lạp thường dùng khi nói về hành trình đến Giê-ru-sa-lem.
    reason: cultural_note
  - marker: c
    text: Hay “về việc này” hoặc “về câu hỏi đang được tranh luận này”.
    reason: lexical_alternative
lexical_decisions:
- source_word: γενομένης δὲ
  choice: Sau khi ... xảy ra
  rationale: Diễn đạt tự nhiên kết cấu sở hữu cách tuyệt đối, cho biết hoàn cảnh xảy ra trước hành động chính; liên từ δέ được thể hiện trong mạch nối của câu.
- source_word: στάσεως καὶ ζητήσεως
  choice: một cuộc bất đồng và tranh luận
  rationale: στάσις chỉ sự đối lập gay gắt, còn ζήτησις chỉ việc tranh biện; cặp từ này phân biệt sự xung đột với hoạt động tranh luận bằng lời mà không hàm ý bạo lực.
- source_word: οὐκ ὀλίγης
  choice: không nhỏ
  rationale: Giữ nguyên lối nói giảm phủ định của tiếng Hy Lạp nhằm nhấn mạnh mức độ nghiêm trọng.
- source_word: τῷ Παύλῳ καὶ τῷ Βαρναβᾷ πρὸς αὐτούς
  choice: giữa Phao-lô và Ba-na-ba với họ
  rationale: Thể hiện các bên tham gia tranh luận; “họ” quy chiếu về những người từ Giu-đê trong câu trước, không thêm sắc thái thù địch quá mức.
- source_word: ἔταξαν
  choice: người ta cử
  rationale: Trong ngữ cảnh, động từ nói đến việc cộng đồng chỉ định các đại biểu. Cách dịch này giữ chủ thể không nêu rõ của động từ số nhiều và tránh xác định cơ cấu tổ chức vượt quá bản văn.
- source_word: ἀναβαίνειν
  choice: đi lên
  rationale: Giữ thành ngữ địa lý quen dùng cho hành trình tới Giê-ru-sa-lem.
- source_word: τινας ἄλλους ἐξ αὐτῶν
  choice: một vài người khác trong số họ
  rationale: Cho thấy có thêm các đại biểu được chọn từ chính cộng đồng ấy mà không bổ sung giới tính hay chức vụ không được bản văn nêu.
- source_word: τοὺς ἀποστόλους καὶ πρεσβυτέρους
  choice: các sứ đồ và trưởng lão
  rationale: Dùng các danh xưng quen thuộc, phù hợp vai trò được công nhận trong sách Công Vụ.
- source_word: περὶ τοῦ ζητήματος τούτου
  choice: để bàn về vấn đề này
  rationale: περί nêu nội dung của chuyến đi, còn ζήτημα là vấn đề đang được tranh luận; “để bàn về” diễn đạt rõ mục đích hàm chứa trong văn cảnh.
theological_decisions:
- issue: Các bên trong cuộc bất đồng
  choice: Cuộc bất đồng được trình bày là xảy ra giữa Phao-lô và Ba-na-ba với “họ”, tức những người từ Giu-đê ở câu trước.
  alternative: Phao-lô và Ba-na-ba có cuộc bất đồng và tranh luận không nhỏ với họ.
  rationale: Đây chủ yếu là lựa chọn cú pháp. Bản dịch giữ quy chiếu gần nhất trong trình thuật mà không rút ra kết luận giáo phái hay thần học.
- issue: Sắc thái tổ chức của ἔταξαν
  choice: Dịch là “người ta cử” để thể hiện việc chỉ định các đại biểu trong cộng đồng.
  alternative: họ quyết định; họ sắp xếp
  rationale: Cách dịch phản ánh một phản ứng có tổ chức trước cuộc tranh luận, nhưng không khẳng định một mô hình quản trị hội thánh cụ thể vượt quá điều tiếng Hy Lạp nói.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ lối nói “không nhỏ” cùng thành ngữ “đi lên” để bảo tồn sắc thái tu từ và địa lý của nguyên bản; các chú thích giải thích những cách nói có thể chưa hoàn toàn tự nhiên với độc giả hiện đại.
