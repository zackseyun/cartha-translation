language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Συμεὼν ἐξηγήσατο καθὼς πρῶτον ὁ θεὸς ἐπεσκέψατο λαβεῖν ἐξ ἐθνῶν ⸀λαὸν τῷ ὀνόματι αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/014.yaml
  text: Simeon has recounted how God first visited the Gentiles to take from them a people for his name[a][b][c].
translation:
  language: vi
  text: Si-mê-ôn[a] đã thuật lại thể nào Đức Chúa Trời lần đầu tiên đoái đến các dân ngoại[b] để lấy từ giữa họ một dân cho danh Ngài[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể gọi là “Si-môn”. Tại đây, Gia-cơ dùng dạng tên “Si-mê-ôn”.
    reason: lexical_alternative
  - marker: b
    text: Hay “từ giữa các dân”. Trong ngữ cảnh này, cụm từ chỉ những người không phải Do Thái.
    reason: lexical_alternative
  - marker: c
    text: Tức là một dân thuộc về Đức Chúa Trời và được nhận diện bằng danh Ngài.
    reason: cultural_note
lexical_decisions:
- source_word: Συμεὼν
  choice: Si-mê-ôn
  rationale: Giữ đúng dạng tên riêng Συμεών mà Gia-cơ dùng tại đây, thay vì đồng nhất với dạng quen thuộc hơn là Si-môn.
- source_word: ἐξηγήσατο
  choice: đã thuật lại
  rationale: Động từ chỉ việc kể lại hoặc trình bày một sự việc; cách dịch này tự nhiên trong tiếng Việt và phù hợp với việc Si-mê-ôn vừa báo cáo trước hội chúng.
- source_word: καθὼς
  choice: việc
  rationale: Sau động từ 'thuật lại', từ này dẫn vào nội dung được kể. Cấu trúc 'thuật lại việc...' tự nhiên trong tiếng Việt mà vẫn giữ quan hệ nội dung của nguyên văn.
- source_word: πρῶτον
  choice: ban đầu
  rationale: Chỉ giai đoạn khởi đầu trong hành động của Đức Chúa Trời đối với các dân ngoại, không nhất thiết hàm ý một thứ tự cứng nhắc trong câu tiếng Việt.
- source_word: ἐπεσκέψατο
  choice: đoái đến
  rationale: Diễn đạt sự thăm viếng đầy quan tâm và có chủ đích của Đức Chúa Trời. 'Đoái đến' giữ sắc thái kính trọng và ý niệm ân cần hơn cách hiểu đơn thuần là 'đến thăm'.
- source_word: λαβεῖν
  choice: để chọn
  rationale: Nguyên nghĩa là 'lấy/nhận'; trong ngữ cảnh lấy ra từ giữa các dân một dân thuộc về Đức Chúa Trời, 'chọn' truyền đạt tự nhiên mục đích của hành động mà không thêm ý về công trạng.
- source_word: ἐξ ἐθνῶν
  choice: từ giữa các dân ngoại
  rationale: Trong Công Vụ 15, ἔθνη chỉ những người không phải Do Thái. 'Từ giữa' thể hiện rõ ἐξ, còn 'các dân ngoại' giữ sự đối chiếu Do Thái–dân ngoại của ngữ cảnh.
- source_word: λαὸν
  choice: một dân
  rationale: Giữ ý niệm Kinh Thánh về một cộng đồng được nhận diện là dân của Đức Chúa Trời, không thu hẹp thành một sắc tộc.
- source_word: τῷ ὀνόματι αὐτοῦ
  choice: cho danh Ngài
  rationale: Giữ thành ngữ giao ước giàu ý nghĩa thần học của nguyên văn, thay vì làm phẳng thành 'cho chính mình'.
theological_decisions:
- issue: Nên dịch ἐξ ἐθνῶν là 'các dân ngoại' hay 'các dân'
  choice: các dân ngoại
  alternative: các dân
  rationale: Bối cảnh Công Vụ 15 bàn về việc những người không phải Do Thái được tiếp nhận vào dân Đức Chúa Trời; 'các dân ngoại' làm rõ đối tượng mà không xóa sự đối chiếu trong đoạn văn.
- issue: Có nên diễn giải τῷ ὀνόματι αὐτοῦ thành 'cho chính Ngài' hay không
  choice: cho danh Ngài
  alternative: cho chính Ngài
  rationale: Cách dịch sát giữ nguyên ngôn ngữ giao ước và sự phong phú thần học của cụm từ, đồng thời chú thích giải nghĩa quan hệ sở hữu và nhận diện.
- issue: Sắc thái của λαβεῖν
  choice: chọn
  alternative: lấy
  rationale: '''Chọn'' tự nhiên hơn trong tiếng Việt khi nói Đức Chúa Trời lấy ra một dân từ giữa các dân ngoại; tuy nhiên, đây là sự diễn đạt theo ngữ cảnh của động từ ''lấy'', không nhằm xác quyết một hệ thống thần học riêng.'
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng 'Đức Chúa Trời' và đại từ kính trọng 'Ngài'; giữ thành ngữ 'cho danh Ngài' trong chính văn và giải thích bằng chú thích. Dấu chú thích được đặt ngay sau các cụm từ tương ứng.
