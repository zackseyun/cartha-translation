  terminology: “Phao-lô,” “Ba-na-ba,” “An-ti-ốt,” và “lời của Chúa” đều phù hợp. Dùng “Tin Mừng” cho sắc thái của εὐαγγελιζόμενοι là tự nhiên và rõ nghĩa; không xác định thêm danh tính của “Chúa”.
