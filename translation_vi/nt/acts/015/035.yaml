id: ACT.15.35
reference: Acts 15:35
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Παῦλος δὲ καὶ Βαρναβᾶς διέτριβον ἐν Ἀντιοχείᾳ διδάσκοντες καὶ εὐαγγελιζόμενοι μετὰ καὶ ἑτέρων πολλῶν τὸν λόγον τοῦ κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/035.yaml
  text: But Paul and Barnabas stayed in Antioch[a], teaching and proclaiming the good news of the word of the Lord[c][b], with many others also.
translation:
  language: vi
  text: Còn Phao-lô và Ba-na-ba ở lại An-ti-ốt[a], cùng với nhiều người khác dạy dỗ và loan báo Tin Mừng[c], tức lời của Chúa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “lưu lại một thời gian tại An-ti-ốt.” Động từ Hy Lạp có thể nhấn mạnh việc ở lại đó trong một khoảng thời gian.'
    reason: lexical_alternative
  - marker: b
    text: “Lời của Chúa” là cách nói thường gặp trong sách Công Vụ để chỉ sứ điệp của Chúa; cũng có thể dịch là “sứ điệp của Chúa.”
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể diễn đạt: “rao giảng Tin Mừng.” Động từ Hy Lạp có nghĩa là loan báo hoặc công bố tin mừng.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διέτριβον
  choice: ở lại
  rationale: Thì chưa hoàn thành diễn tả việc tiếp tục lưu lại tại một nơi trong một khoảng thời gian; “ở lại” tự nhiên và giữ được sắc thái kéo dài.
- source_word: διδάσκοντες
  choice: dạy dỗ
  rationale: Diễn đạt hoạt động giảng dạy đang tiếp diễn trong thời gian họ ở An-ti-ốt.
- source_word: εὐαγγελιζόμενοι
  choice: công bố ... như tin mừng
  rationale: Động từ chỉ việc loan báo điều gì như tin mừng. Cách diễn đạt này vừa thể hiện nội hàm “tin mừng”, vừa giữ τὸν λόγον τοῦ κυρίου làm nội dung được công bố.
- source_word: μετὰ καὶ ἑτέρων πολλῶν
  choice: cùng với nhiều người khác
  rationale: Cho thấy Phao-lô và Ba-na-ba không phải là những người duy nhất tham gia việc dạy dỗ và công bố; “cùng với” thể hiện quan hệ đồng hành, còn “khác” giữ ý của ἑτέρων.
- source_word: τὸν λόγον
  choice: lời
  rationale: “Lời” duy trì cách nói quen thuộc trong sách Công Vụ và mối liên hệ văn chương của cụm “lời của Chúa”; “sứ điệp” vẫn là một khả năng theo ngữ cảnh.
- source_word: τοῦ κυρίου
  choice: của Chúa
  rationale: Giữ nguyên tước hiệu κύριος và không xác định rõ hơn đối tượng quy chiếu so với bản Hy Lạp.
theological_decisions:
- issue: Đối tượng được gọi là “Chúa” trong cụm “lời của Chúa”
  choice: Giữ cách gọi trung tính “Chúa”
  alternative: “lời của Chúa Giê-su” hoặc “sứ điệp của Đức Chúa Trời”
  rationale: Trong Công Vụ, “Chúa” thường có thể đặc biệt chỉ Chúa Giê-su, nhưng câu Hy Lạp chỉ dùng tước hiệu κύριος. Bản dịch không thêm sự xác định mà nguyên văn không nêu rõ.
- issue: Quan hệ giữa “tin mừng” và “lời của Chúa”
  choice: “công bố lời của Chúa như tin mừng”
  alternative: “rao truyền tin mừng là lời của Chúa”
  rationale: Cấu trúc Hy Lạp đặt “lời của Chúa” làm đối tượng của cả việc dạy dỗ và loan báo tin mừng. Cách dịch đã chọn giữ “lời của Chúa” làm nội dung, đồng thời thể hiện sắc thái đặc thù của động từ εὐαγγελίζομαι mà không biến hai cụm thành hai nội dung riêng biệt.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. Tên riêng được phiên âm theo lối quen thuộc trong Kinh Thánh tiếng Việt. Câu Hy Lạp dài được tách thành hai câu để tiếng Việt tự nhiên hơn; cụm “cùng với nhiều người khác” được đưa lên đầu câu thứ hai mà không đổi quan hệ ý nghĩa.
