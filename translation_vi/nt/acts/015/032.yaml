  text: Ἰούδας τε καὶ Σιλᾶς, καὶ αὐτοὶ προφῆται ὄντες, διὰ λόγου πολλοῦ παρεκάλεσαν τοὺς ἀδελφοὺς καὶ ἐπεστήριξαν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/032.yaml
  text: Judas and Silas[a], who were themselves prophets, encouraged the brothers at length and strengthened them.
translation:
  language: vi
  text: Giu-đa và Si-la, vốn cũng là những nhà tiên tri, đã dùng nhiều lời khích lệ các anh em[a] và củng cố họ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “các anh chị em”; tiếng Hy Lạp nói “các anh em” và có thể chỉ toàn thể cộng đồng tín hữu.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰούδας τε καὶ Σιλᾶς
  choice: Giu-đa và Si-la
  rationale: Dùng dạng tên riêng quen thuộc trong tiếng Việt và diễn đạt τε καὶ bằng liên từ tự nhiên “và”.
- source_word: καὶ αὐτοὶ προφῆται ὄντες
  choice: chính họ cũng là các nhà tiên tri
  rationale: Giữ sắc thái nhấn mạnh của αὐτοὶ và ý bổ sung của καί, đồng thời chuyển kết cấu phân từ sang câu tiếng Việt tự nhiên.
- source_word: διὰ λόγου πολλοῦ
  choice: dùng nhiều lời
  rationale: Bám sát hình ảnh nguyên ngữ về lời nói phong phú hoặc kéo dài, cho thấy họ đã khích lệ cộng đồng bằng một sự phục vụ bằng lời đáng kể.
- source_word: παρεκάλεσαν
  choice: khích lệ
  rationale: Trong văn cảnh này, động từ mang nghĩa động viên, khuyên nhủ và nâng đỡ; “khích lệ” rõ ràng, hiện đại và không thu hẹp quá mức trường nghĩa.
- source_word: τοὺς ἀδελφοὺς
  choice: các anh em
  rationale: Giữ hình thức nam số nhiều của nguyên ngữ; chú thích nêu rõ từ này có thể chỉ toàn thể cộng đồng tín hữu, gồm cả nữ giới.
- source_word: ἐπεστήριξαν
  choice: làm cho họ vững mạnh
  rationale: Diễn đạt ý củng cố, khiến trở nên vững vàng, đồng thời phân biệt với hành động “khích lệ” đứng trước.
theological_decisions:
- issue: Phạm vi chỉ định của ἀδελφοὺς trong cộng đồng có cả nam và nữ
  choice: các anh em
  alternative: các anh chị em; các tín hữu
  rationale: Nguyên ngữ dùng danh từ nam số nhiều, nhưng trong cách dùng Cơ Đốc giáo ban đầu từ này có thể đại diện cho cả cộng đồng. Bản văn chính giữ hình thức của tiếng Hy Lạp, còn chú thích bảo tồn khả năng bao gồm cả nữ giới.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Các nhà tiên tri” dùng mạo từ loại tự nhiên trong tiếng Việt; “dùng nhiều lời” chủ ý bảo tồn nét diễn đạt của nguyên ngữ thay vì giải thích thành một bài giảng dài.
