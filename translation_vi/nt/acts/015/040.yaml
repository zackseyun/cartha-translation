  text: Παῦλος δὲ ἐπιλεξάμενος Σιλᾶν ἐξῆλθεν παραδοθεὶς τῇ χάριτι τοῦ ⸀κυρίου ὑπὸ τῶν ἀδελφῶν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/040.yaml
  text: But Paul chose Silas and departed[b][a], having been commended by the brothers to the grace of the Lord.
translation:
  language: vi
  text: Sau khi được các anh em[b] phó thác cho ân điển của Chúa,[a] Phao-lô chọn Si-la rồi lên đường.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “được giao phó cho ân điển của Chúa.”'
    reason: lexical_alternative
  - marker: b
    text: “Các anh em” ở đây có thể chỉ cộng đồng tín hữu nói chung, gồm cả phụ nữ.
    reason: cultural_note
lexical_decisions:
- source_word: δὲ
  choice: Nhưng
  rationale: Đánh dấu sự tương phản nhẹ với việc Ba-na-ba ra đi ở câu trước.
- source_word: ἐπιλεξάμενος
  choice: chọn
  rationale: Diễn đạt tự nhiên hành động Phao-lô đích thân chọn Si-la trước khi lên đường.
- source_word: Σιλᾶν
  choice: Si-la
  rationale: Phiên âm tên riêng theo cách dùng Kinh Thánh tiếng Việt quen thuộc.
- source_word: ἐξῆλθεν
  choice: lên đường
  rationale: Trong trình thuật hành trình, động từ mang nghĩa khởi hành; “lên đường” tự nhiên và phù hợp ngữ cảnh.
- source_word: παραδοθεὶς
  choice: sau khi được ... giao phó
  rationale: Giữ hình thái bị động và ý nghĩa cộng đồng giao Phao-lô vào sự chăm sóc đầy ân điển của Chúa, đồng thời không loại bỏ nghĩa đen của παραδίδωμι.
- source_word: τῇ χάριτι
  choice: cho ân điển
  rationale: Giữ danh từ thần học χάρις, thay vì diễn giải thành “sự chăm sóc đầy ân huệ”.
- source_word: τοῦ κυρίου
  choice: của Chúa
  rationale: Giữ nguyên mức độ xác định của κύριος, không tự ý chỉ rõ là Đức Chúa Trời hay Chúa Giê-su.
- source_word: ὑπὸ τῶν ἀδελφῶν
  choice: được các anh em
  rationale: Giữ hình thức giống đực số nhiều của nguyên văn; chú thích cho biết từ này có thể chỉ cộng đồng tín hữu rộng hơn.
theological_decisions:
- issue: Đối tượng được gọi là “Chúa”
  choice: Chúa
  alternative: Chúa Giê-su; Đức Chúa Trời
  rationale: Nguyên văn chỉ dùng tước hiệu κύριος mà không nói rõ hơn, nên bản dịch không giải quyết thay sự không xác định ấy.
- issue: Phạm vi của “các anh em”
  choice: các anh em
  alternative: anh chị em; các tín hữu
  rationale: Bản chính giữ hình thức giống đực của ἀδελφῶν, còn khả năng từ này bao gồm cả cộng đồng tín hữu nam nữ được nêu trong chú thích.
- issue: Sắc thái của việc giao phó
  choice: giao phó cho ân điển của Chúa
  alternative: được giới thiệu với ân điển của Chúa; được phó thác cho ân điển của Chúa
  rationale: “Giao phó” giữ được ý trao vào sự chăm nom mà không biến ân điển thành một lối diễn giải thuần túy; chú thích ghi nhận cách dịch gần nghĩa khác.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “lên đường” cho lối kể hành trình; giữ “ân điển” vì đây là thuật ngữ thần học quen thuộc. Các dấu chú thích đều xuất hiện trong chính văn và được đặt ngay sau mệnh đề liên quan.
