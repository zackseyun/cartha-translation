  rationale: Thay “giao phó” bằng “phó thác” để tiếng Việt tự nhiên hơn trong khi vẫn giữ nguyên phân từ bị động παραδοθείς và dative “cho ân điển của Chúa”. Sắp lại mệnh đề trạng ngữ để quan hệ thời gian được rõ ràng. Các dấu chú thích được neo sát cụm từ liên quan.
