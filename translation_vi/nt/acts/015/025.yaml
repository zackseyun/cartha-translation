id: ACT.15.25
reference: Acts 15:25
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἔδοξεν ἡμῖν γενομένοις ὁμοθυμαδὸν ⸀ἐκλεξαμένοις ἄνδρας πέμψαι πρὸς ὑμᾶς σὺν τοῖς ἀγαπητοῖς ἡμῶν Βαρναβᾷ καὶ Παύλῳ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/025.yaml
  text: it seemed good to us[a], having come to one accord, to choose men and send them to you with our beloved Barnabas and Paul[b],
translation:
  language: vi
  text: Sau khi đã đồng lòng[a], chúng tôi thấy nên chọn những người nam[b] và cử họ đến với anh em, cùng với hai người thân yêu của chúng tôi là Ba-na-ba và Phao-lô,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “sau khi đã nhất trí” hoặc “với một lòng”.'
    reason: lexical_alternative
  - marker: b
    text: Tức là những đại biểu nam; từ Hy Lạp ở đây nói cụ thể đến người nam.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδοξεν ἡμῖν
  choice: chúng tôi thấy nên
  rationale: Giữ sắc thái phán đoán và tán thành chung của công thức nghị sự, không làm mạnh thành một mệnh lệnh hay quyết định tuyệt đối.
- source_word: γενομένοις ὁμοθυμαδόν
  choice: sau khi đã đồng lòng
  rationale: Diễn đạt cả tiến trình hàm trong phân từ γενομένοις lẫn sự nhất trí của ὁμοθυμαδόν bằng tiếng Việt tự nhiên.
- source_word: ἐκλεξαμένοις
  choice: chọn
  rationale: Kết hợp tự nhiên với πέμψαι thành chuỗi hành động “chọn… và cử…”, trong khi vẫn giữ nội dung của phân từ Hy Lạp.
- source_word: ἄνδρας
  choice: vài người nam
  rationale: ἀνήρ ở đây chỉ những người nam trưởng thành; ngữ cảnh câu 27 xác định họ là Giu-đa và Si-la. “Vài” diễn đạt số nhiều không xác định mà không thêm một con số cụ thể.
- source_word: πέμψαι πρὸς ὑμᾶς
  choice: cử họ đến với anh em
  rationale: “Cử” phù hợp với việc sai các đại diện đi; “họ” lấy đối tượng từ cụm ngay trước và “anh em” phù hợp với lời gửi cho cộng đồng tín hữu.
- source_word: σὺν
  choice: cùng với
  rationale: Diễn đạt rõ quan hệ đồng hành bằng tiếng Việt tự nhiên.
- source_word: τοῖς ἀγαπητοῖς ἡμῶν
  choice: yêu quý của chúng tôi
  rationale: Giữ tình cảm thân thiết và sắc thái trang trọng của ἀγαπητοῖς mà không thêm ý nghĩa thần học.
- source_word: Βαρναβᾷ καὶ Παύλῳ
  choice: Ba-na-ba và Phao-lô
  rationale: Dùng dạng phiên âm tên riêng quen thuộc trong tiếng Việt.
theological_decisions:
- issue: Sắc thái nghị sự tập thể trong thư của hội thánh tại Giê-ru-sa-lem
  choice: chúng tôi thấy nên
  alternative: chúng tôi quyết định
  rationale: Cấu trúc với δοκέω diễn đạt sự xét thấy và tán thành chung. “Chúng tôi thấy nên” tránh áp đặt sắc thái quyền lệnh mạnh hơn điều câu Hy Lạp nói.
- issue: Mối quan hệ giữa sự đồng lòng và hành động chọn, cử người
  choice: Sau khi đã đồng lòng, chúng tôi thấy nên chọn… và cử…
  alternative: Chúng tôi nhất trí quyết định…
  rationale: Cách dịch giữ riêng hình ảnh cả nhóm đi đến sự đồng lòng, thay vì hòa tan phân từ γενομένοις vào một động từ “quyết định” mạnh hơn.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Cấu trúc “sau khi đã đồng lòng” bảo toàn tiến trình trong nguyên văn; “thấy nên” duy trì giọng nghị sự. “Người nam” được giữ vì nguyên văn xác định giới tính, dù cách nói này hơi trang trọng hơn khẩu ngữ.
