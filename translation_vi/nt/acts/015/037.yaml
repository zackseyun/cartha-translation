  text: Βαρναβᾶς δὲ ⸀ἐβούλετο συμπαραλαβεῖν ⸀καὶ τὸν Ἰωάννην τὸν καλούμενον Μᾶρκον·
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/037.yaml
  text: But Barnabas wanted to take along also John[a], who was called Mark.
translation:
  language: vi
  text: Nhưng Ba-na-ba muốn đem theo Giăng nữa, người được gọi là Mác.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “Giăng, cũng gọi là Mác.”'
    reason: Giữ cách diễn đạt thay thế tự nhiên cho cụm từ Hy Lạp dùng để xác định tên gọi khác của Giăng.
lexical_decisions:
- source_word: Βαρναβᾶς
  choice: Ba-na-ba
  rationale: Tên riêng được phiên âm theo cách dùng quen thuộc trong Kinh Thánh tiếng Việt.
- source_word: δὲ
  choice: Nhưng
  rationale: Diễn tả sắc thái tương phản nhẹ với đề nghị trước đó của Phao-lô.
- source_word: ἐβούλετο
  choice: muốn
  rationale: Chuyển tải tự nhiên ý muốn hoặc chủ định của Ba-na-ba, không nhấn quá mức vào sự tính toán.
- source_word: συμπαραλαβεῖν
  choice: đem theo
  rationale: Động từ ghép chỉ việc đưa một người cùng đi với đoàn; “đem theo” tự nhiên trong tiếng Việt hiện đại.
- source_word: καὶ
  choice: cả
  rationale: 'Giữ lực bổ sung và nhấn vào đối tượng: Ba-na-ba muốn đem Giăng theo nữa.'
- source_word: Ἰωάννην
  choice: Giăng
  rationale: Dùng dạng tên riêng quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
- source_word: τὸν καλούμενον Μᾶρκον
  choice: người được gọi là Mác
  rationale: Giữ sát cấu trúc phân từ bị động, xác định Giăng bằng tên gọi khác mà không đưa từ “cũng” vào chính mệnh đề này.
- source_word: Μᾶρκον
  choice: Mác
  rationale: Tên riêng được phiên âm theo cách dùng quen thuộc trong Kinh Thánh tiếng Việt.
