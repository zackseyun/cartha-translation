id: ACT.15.8
reference: Acts 15:8
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ὁ καρδιογνώστης θεὸς ἐμαρτύρησεν αὐτοῖς ⸀δοὺς τὸ πνεῦμα τὸ ἅγιον καθὼς καὶ ἡμῖν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/008.yaml
  text: And God[a], who knows the heart, bore witness to them by giving them the Holy Spirit just as he did to us,
translation:
  language: vi
  text: Đức Chúa Trời, Đấng biết lòng người,[a] đã làm chứng cho họ bằng cách ban Đức Thánh Linh cho họ, cũng như Ngài đã ban cho chúng ta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Đức Chúa Trời, Đấng thấu biết mọi tấm lòng.”'
    reason: Nêu cách dịch sát cấu tạo của danh từ ghép καρδιογνώστης, trong đó “lòng” chỉ nội tâm con người.
lexical_decisions:
- source_word: καρδιογνώστης
  choice: Đấng biết lòng người
  rationale: Danh từ ghép hiếm này chỉ đấng biết phần nội tâm của con người. Cách diễn đạt bằng mệnh đề danh xưng vừa tự nhiên trong tiếng Việt vừa giữ nguyên thuộc tính được gán cho Đức Chúa Trời.
- source_word: θεὸς
  choice: Đức Chúa Trời
  rationale: Cách dịch trang trọng, quen thuộc của θεός trong văn cảnh này; καρδιογνώστης được hiểu như một danh xưng đồng vị.
- source_word: ἐμαρτύρησεν
  choice: đã làm chứng
  rationale: Giữ sắc thái chứng nhận hoặc đưa ra bằng chứng trong lập luận của Phi-e-rơ, thay vì diễn giải mạnh hơn thành việc chấp nhận hay tuyên bố họ thuộc một địa vị cụ thể.
- source_word: αὐτοῖς
  choice: cho họ
  rationale: Đại từ số nhiều chỉ những người đang được nói đến trong văn cảnh. Bản dịch không thay đại từ bằng “dân ngoại,” vì danh tính ấy do văn cảnh cung cấp chứ không nằm trong chính từ này.
- source_word: δοὺς
  choice: bằng cách ban
  rationale: Phân từ bất định quá khứ giải thích phương cách Đức Chúa Trời làm chứng; “bằng cách ban” thể hiện rõ quan hệ phương tiện trong tiếng Việt.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: Đức Thánh Linh
  rationale: Danh xưng tiêu chuẩn, trang trọng và phổ biến trong tiếng Việt hiện đại dành cho Chúa Thánh Linh.
- source_word: καθὼς καὶ ἡμῖν
  choice: cũng như Ngài đã ban cho chúng ta
  rationale: Cụm Hy Lạp lược bỏ động từ đã xuất hiện trong phân từ δοὺς. Tiếng Việt bổ sung “Ngài đã ban” để câu rõ nghĩa mà không thêm nội dung mới.
theological_decisions:
- issue: Sự làm chứng của Đức Chúa Trời qua việc ban Đức Thánh Linh cho “họ” như cho “chúng ta”
  choice: Giữ các đại từ “họ” và “chúng ta,” đồng thời trình bày việc ban Đức Thánh Linh là phương cách Đức Chúa Trời làm chứng.
  alternative: Nêu rõ “họ” là dân ngoại hoặc diễn giải việc này thành sự chấp nhận dân ngoại.
  rationale: Bản Hy Lạp chỉ dùng đại từ αὐτοῖς; đối tượng cụ thể được xác định từ văn cảnh. Việc không thêm “dân ngoại” hay một kết luận thần học cụ thể giúp bảo toàn cách lập luận và mức độ minh thị của nguyên văn.
translation_notes:
  register: Văn phong trang trọng, tự nhiên và dễ hiểu trong tiếng Việt hiện đại. Dùng “Đấng biết lòng người” thay cho một danh từ ghép gượng gạo; lặp “cho họ” để làm rõ người nhận Đức Thánh Linh. Đại từ tôn kính “Ngài” được thêm ở vế so sánh nhằm diễn đạt tự nhiên chủ thể được lược trong tiếng Hy Lạp.
