  verdict: revise
  source_fidelity: Bản nháp nhìn chung giữ đúng bốn hạng mục được nêu trong tiếng Hy Lạp và không thu hẹp ἀλισγήματα τῶν εἰδώλων thành đồ cúng. Tuy nhiên, “hãy viết thư dặn” biến infinitive ἐπιστεῖλαι trong lời đề nghị của Gia-cơ thành mệnh lệnh trực tiếp. “Sự gian dâm” trong tiếng Việt hiện đại có thể bị hiểu hẹp hơn πορνεία, vốn ở đây cần được giữ ở phạm vi rộng.
  naturalness: Cấu trúc “nhưng nên viết thư bảo họ kiêng...” phản ánh đúng chức năng đề nghị của nguyên văn và tự nhiên hơn. “Những hành vi vô luân tình dục” rõ nghĩa hơn “sự gian dâm” đối với độc giả hiện đại. “Máu” là từ thông dụng trong tiếng Việt hiện đại; chú thích giải thích rõ ngữ cảnh thực phẩm mà không thêm vào chính văn.
  terminology: Giữ “thần tượng” và “những điều ô uế liên quan đến thần tượng” để bảo toàn tính rộng và sắc thái thờ cúng của cụm Hy Lạp. Dùng “những hành vi vô luân tình dục” cho πορνεία, không quyết định cuộc tranh luận liệu trong văn cảnh này từ ấy ám chỉ đặc biệt các quan hệ bị cấm. Dùng “thịt của con vật bị giết ngạt” cho τοῦ πνικτοῦ, với chú thích nêu nghĩa đen và nền văn hóa.
