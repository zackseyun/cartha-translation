id: ACT.15.20
reference: Acts 15:20
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀλλὰ ἐπιστεῖλαι αὐτοῖς τοῦ ⸀ἀπέχεσθαι τῶν ἀλισγημάτων τῶν εἰδώλων καὶ τῆς πορνείας καὶ ⸀τοῦ πνικτοῦ καὶ τοῦ αἵματος·
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/020.yaml
  text: but to write to them to abstain from the pollutions of idols[a], and from sexual immorality, and from what has been strangled[c][b], and from blood.
translation:
  language: vi
  text: nhưng nên viết thư bảo họ kiêng những điều ô uế liên quan đến thần tượng[a], những hành vi vô luân tình dục[b], thịt của con vật bị giết ngạt[c], và máu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “những sự ô uế do thần tượng gây ra.” Một số bản dịch thu hẹp thành “đồ ăn đã cúng thần tượng,” nhưng từ Hy Lạp ở đây có nghĩa rộng hơn.'
    reason: lexical_alternative
  - marker: b
    text: Từ Hy Lạp có thể chỉ những hành vi vô luân tình dục nói chung; một số người hiểu từ này ở đây cụ thể hơn là những quan hệ hoặc hôn nhân bị cấm.
    reason: alternative_reading
  - marker: c
    text: 'Nguyên văn: “vật bị giết ngạt,” tức thịt của con vật bị giết mà máu không được rút ra đúng cách.'
    reason: cultural_note
lexical_decisions:
- source_word: ἐπιστεῖλαι
  choice: viết thư dặn
  rationale: Động từ này trong bối cảnh hội nghị Giê-ru-sa-lem chỉ việc truyền đạt chỉ thị bằng văn bản. “Viết thư dặn” vừa giữ sắc thái thư tín vừa tự nhiên trong tiếng Việt.
- source_word: ἀπέχεσθαι
  choice: phải kiêng
  rationale: Dạng trung của ἀπέχω có nghĩa tránh hoặc tự giữ mình khỏi điều gì. “Kiêng” rõ ràng, tự nhiên trong ngữ cảnh các điều cấm.
- source_word: ἀλισγημάτων τῶν εἰδώλων
  choice: những điều ô uế liên quan đến thần tượng
  rationale: ἀλίσγημα nói đến sự hoặc vật gây ô uế, nhất là trong phạm vi thờ cúng. Cách dịch này giữ phạm vi rộng hơn “đồ cúng thần tượng” và diễn đạt tự nhiên quan hệ sở thuộc/liên hệ của cụm Hy Lạp.
- source_word: πορνείας
  choice: sự gian dâm
  rationale: “Sự gian dâm” là cách diễn đạt trang trọng, dễ hiểu, có thể bao quát hành vi tình dục trái phép mà không giới hạn vào quan hệ trước hôn nhân; chú thích giữ lại khả năng hiểu cụ thể hơn về những quan hệ bị cấm.
- source_word: τοῦ πνικτοῦ
  choice: thịt của con vật bị siết cổ
  rationale: πνικτός được dùng như danh từ, chỉ con vật bị giết bằng cách siết cổ hoặc không được rút huyết đúng cách. Thêm “thịt của con vật” làm rõ sở chỉ ngầm trong tiếng Hy Lạp mà không thay đổi nội dung.
- source_word: τοῦ αἵματος
  choice: huyết
  rationale: “Huyết” là từ ngắn gọn, trang trọng và quen thuộc trong văn cảnh Kinh Thánh, tương ứng trực tiếp với αἷμα; bản dịch không bổ sung cách diễn giải về việc ăn hay sử dụng huyết.
theological_decisions:
- issue: Phạm vi của điều cấm liên quan đến thần tượng
  choice: những điều ô uế liên quan đến thần tượng
  alternative: đồ ăn đã cúng thần tượng
  rationale: Cụm ἀλισγημάτων τῶν εἰδώλων rộng hơn từ chuyên biệt chỉ đồ cúng thần tượng. Bản dịch không thu hẹp điều cấm vào thức ăn בלבד.
- issue: Ý nghĩa của πορνεία trong sắc lệnh các sứ đồ
  choice: sự gian dâm
  alternative: những quan hệ tình dục bị cấm / những cuộc hôn nhân trái luật
  rationale: Từ Hy Lạp có thể chỉ sự vô luân tình dục nói chung hoặc, theo một cách hiểu trong văn cảnh này, những quan hệ đặc biệt bị cấm. Chính văn giữ nghĩa rộng, còn chú thích nêu khả năng hẹp hơn.
- issue: Tính chất và thời hạn của các điều phải kiêng
  choice: trình bày đơn thuần như các chỉ thị phải kiêng
  alternative: biện pháp tạm thời cho sự thông công giữa người Do Thái và dân ngoại / mệnh lệnh vĩnh viễn cho mọi tín hữu
  rationale: Câu này nêu các điều cấm nhưng không xác định thời hạn hay toàn bộ nền tảng thần học của chúng, nên bản dịch không áp đặt kết luận hệ phái.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “thần tượng” thay vì thuật ngữ cổ hơn; dùng “huyết” để giữ sắc thái Kinh Thánh trong một danh sách nghi lễ–đạo đức. Cấu trúc “viết thư dặn họ phải kiêng” phản ánh tự nhiên quan hệ giữa ἐπιστεῖλαι và τοῦ ἀπέχεσθαι.
