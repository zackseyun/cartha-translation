id: ACT.15.6
reference: Acts 15:6
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Συνήχθησάν ⸀τε οἱ ἀπόστολοι καὶ οἱ πρεσβύτεροι ἰδεῖν περὶ τοῦ λόγου τούτου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/006.yaml
  text: So the apostles and the elders gathered together to consider this matter[a][b].
translation:
  language: vi
  text: Vậy, các sứ đồ và các trưởng lão họp lại để xem xét vấn đề này.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “tập hợp lại” hoặc “cùng nhóm họp.” Động từ Hy Lạp có hình thức thụ động (“được tập hợp”), nhưng trong ngữ cảnh này thường mang nghĩa cả nhóm cùng họp lại.
    reason: lexical_alternative
  - marker: b
    text: 'Nghĩa đen: “để xem về lời này.” Ở đây, “lời” chỉ sự việc hoặc vấn đề đang được bàn luận.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Συνήχθησάν
  choice: họp lại
  rationale: Động từ aorist thụ động của συνάγω có hình thức là “được tập hợp”, nhưng trong ngữ cảnh này diễn tả tự nhiên việc cả nhóm cùng nhóm họp. “Họp lại” vừa rõ nghĩa vừa phù hợp văn phong tiếng Việt hiện đại.
- source_word: τε
  choice: Vậy
  rationale: Tiểu từ τε nối nhẹ câu này với diễn biến trước đó. “Vậy” thể hiện bước chuyển từ cuộc tranh luận sang việc các lãnh đạo nhóm họp, mà không làm liên hệ nhân quả trở nên quá mạnh.
- source_word: οἱ ἀπόστολοι
  choice: các sứ đồ
  rationale: Trong sách Công Vụ, từ này chỉ những người lãnh đạo được nhìn nhận là các sứ đồ; cách dịch quen thuộc “các sứ đồ” chính xác và dễ hiểu.
- source_word: οἱ πρεσβύτεροι
  choice: các trưởng lão
  rationale: Từ này chỉ những người lãnh đạo được nhìn nhận trong cộng đồng, chứ không đơn thuần là những người cao tuổi. “Các trưởng lão” giữ được sắc thái lịch sử mà không áp đặt cơ cấu giáo hội về sau.
- source_word: ἰδεῖν
  choice: để xem xét
  rationale: Dù nghĩa đen là “để thấy”, ở đây động từ diễn tả việc cân nhắc, khảo xét một vấn đề. “Để xem xét” giữ được sắc thái tiến hành thảo luận, không nói trước rằng họ đã quyết định.
- source_word: περὶ τοῦ λόγου τούτου
  choice: vấn đề này
  rationale: Trong ngữ cảnh cuộc tranh luận, λόγος chỉ sự việc hay vấn đề đang được bàn đến. “Vấn đề này” tự nhiên và chính xác hơn cách dịch máy móc là “lời này”.
theological_decisions:
- issue: Sắc thái thể chế của πρεσβύτεροι trong cuộc họp tại Giê-ru-sa-lem
  choice: Dịch là “các trưởng lão” mà không gán vào đó cơ cấu chức vụ của các hệ phái hình thành về sau.
  alternative: Dịch bằng một thuật ngữ chức vụ chuyên biệt như “các giám nhiệm kỳ cựu” hoặc hiểu theo chức vụ trưởng lão của một truyền thống cụ thể.
  rationale: Câu này xác định họ là những người lãnh đạo được nhìn nhận trong hội thánh tại Giê-ru-sa-lem, nhưng không quy định chi tiết một mô hình quản trị giáo hội về sau.
- issue: Mục đích nghị bàn của cuộc họp
  choice: “để xem xét vấn đề này” diễn tả quá trình khảo xét.
  alternative: “để quyết định vấn đề này”, vốn có thể hàm ý kết quả đã được định trước ở thời điểm này trong câu chuyện.
  rationale: ἰδεῖν ở đây nói đến việc đưa vấn đề ra xem xét; bản dịch không nên thêm ý rằng họ đã có sẵn phán quyết.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. “Sứ đồ” và “trưởng lão” là các thuật ngữ Kinh Thánh quen thuộc; câu văn giữ liên kết tường thuật bằng “Vậy” và tránh áp đặt sắc thái giáo phái.
