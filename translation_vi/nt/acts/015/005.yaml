  - severity: low
    issue: “Nhóm Pha-ri-si” có thể chính xác nhưng kém sát sắc thái thuật ngữ hơn “phái Pha-ri-si”.
    rationale: αἵρεσις chỉ một phái, trường phái hay đảng phái được nhận diện; “phái” là từ thông dụng, tự nhiên và cụ thể hơn mà không mang hàm ý dị giáo.
  - severity: low
