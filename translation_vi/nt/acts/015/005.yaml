- from: 'Nhưng có vài người thuộc nhóm Pha-ri-si đã tin đứng dậy[a] và nói: “Cần phải làm phép cắt bì cho họ và truyền cho họ tuân giữ luật pháp Môi-se.”'
  to: 'Nhưng có vài người thuộc phái Pha-ri-si[a], những người đã tin, đứng dậy và nói: “Cần phải cắt bì cho họ và ra lệnh cho họ tuân giữ luật pháp Môi-se.”'
  rationale: Bản sửa đặt chú thích đúng tại “phái Pha-ri-si”, dùng “phái” để phản ánh chính xác hơn αἵρεσις, và đơn giản hóa cách diễn đạt về cắt bì mà không thay đổi ý nghĩa. Cụm “những người đã tin” vẫn giữ lực hoàn thành của πεπιστευκότες và không giải quyết căng thẳng thần học trong bản văn.
