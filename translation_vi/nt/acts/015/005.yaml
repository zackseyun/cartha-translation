id: ACT.15.5
reference: Acts 15:5
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐξανέστησαν δέ τινες τῶν ἀπὸ τῆς αἱρέσεως τῶν Φαρισαίων πεπιστευκότες, λέγοντες ὅτι δεῖ περιτέμνειν αὐτοὺς παραγγέλλειν τε τηρεῖν τὸν νόμον Μωϋσέως.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/005.yaml
  text: But some of those from the party of the Pharisees who had believed stood up[a], saying that it is necessary to circumcise them and to command them to keep the law of Moses.
translation:
  language: vi
  text: 'Nhưng có vài người thuộc phái Pha-ri-si[a], những người đã tin, đứng dậy và nói: “Cần phải cắt bì cho họ và ra lệnh cho họ tuân giữ luật pháp Môi-se.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hy Lạp dùng ở đây chỉ một phái, nhóm hoặc trường phái được công nhận; cũng có thể dịch là “giáo phái Pha-ri-si”, nhưng không nhất thiết mang nghĩa “tà giáo” theo cách dùng chuyên biệt về sau.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξανέστησαν
  choice: đứng dậy
  rationale: Động từ aorist trong bối cảnh hội họp diễn tả việc đứng lên để phát biểu; “đứng dậy” tự nhiên và không thêm sắc thái đối đầu.
- source_word: τινες
  choice: có vài người
  rationale: Đại từ bất định số nhiều; cách dịch này tự nhiên trong tiếng Việt và không thêm giới tính mà nguyên văn không nêu rõ.
- source_word: τῶν ἀπὸ τῆς αἱρέσεως τῶν Φαρισαίων
  choice: thuộc nhóm Pha-ri-si
  rationale: αἵρεσις ở đây chỉ một nhóm hay trường phái được nhận diện trong Do Thái giáo, không nhất thiết mang nghĩa tiêu cực về “tà giáo” trong cách dùng về sau.
- source_word: πεπιστευκότες
  choice: đã tin
  rationale: Phân từ hoàn thành diễn tả hành động tin đã xảy ra và tình trạng còn tiếp diễn; cách dịch bằng động từ giữ nguyên sự căng thẳng của câu thay vì chuyển thành một nhãn gọi.
- source_word: λέγοντες
  choice: và nói
  rationale: Phân từ hiện tại dẫn vào nội dung lời phát biểu; “nói” trung tính, không thêm sắc thái như “khăng khăng” hay “tuyên bố”.
- source_word: δεῖ
  choice: cần phải
  rationale: Giữ lực bắt buộc của động từ vô nhân xưng, đồng thời để nguồn gốc của sự bắt buộc ở trạng thái hàm ẩn như nguyên văn.
- source_word: περιτέμνειν αὐτούς
  choice: làm phép cắt bì cho họ
  rationale: Diễn đạt trực tiếp cấu trúc nguyên văn và dùng cách nói rõ ràng, tự nhiên trong tiếng Việt.
- source_word: παραγγέλλειν
  choice: truyền cho họ
  rationale: Động từ mang thẩm quyền; “truyền” giữ được lực của mệnh lệnh mà vẫn phù hợp văn phong Kinh Thánh trang trọng, dễ hiểu.
- source_word: τε τηρεῖν
  choice: tuân giữ
  rationale: τηρέω trong ngữ cảnh luật pháp có nghĩa giữ và vâng theo; “tuân giữ” vừa chính xác vừa tự nhiên.
- source_word: τὸν νόμον Μωϋσέως
  choice: luật pháp Môi-se
  rationale: Phản ánh trực tiếp kết cấu sở hữu trong tiếng Hy Lạp và dùng cách gọi quen thuộc, rõ nghĩa trong tiếng Việt.
theological_decisions:
- issue: Cách dịch αἵρεσις trong bối cảnh một nhóm thuộc Do Thái giáo
  choice: nhóm
  alternative: giáo phái
  rationale: “Nhóm” xác định sự liên kết với phái Pha-ri-si mà không du nhập sắc thái “tà giáo” về sau. “Giáo phái” có thể hiểu được nhưng dễ mang hàm ý tiêu cực không tất yếu có trong câu.
- issue: Lực của πεπιστευκότες
  choice: đã tin
  alternative: là những tín hữu
  rationale: 'Cách diễn đạt bằng động từ bảo tồn ý nghĩa hoàn thành và sự căng thẳng thần học: những người này thật sự được trình bày là đã tin, nhưng vẫn chủ trương người ngoại phải chịu cắt bì và giữ luật pháp Môi-se.'
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Câu trực tiếp giúp lời phát biểu rõ ràng; thuật ngữ “luật pháp Môi-se” duy trì cách gọi quen thuộc. Dấu chú thích [a] được đặt ngay sau cụm hành động liên quan, theo lớp tham khảo tiếng Anh, dù nội dung chú thích giải thích từ “nhóm” trong cùng mệnh đề.
