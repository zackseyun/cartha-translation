  text: Οἱ μὲν οὖν ἀπολυθέντες ⸀κατῆλθον εἰς Ἀντιόχειαν, καὶ συναγαγόντες τὸ πλῆθος ἐπέδωκαν τὴν ἐπιστολήν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/030.yaml
  text: So[a], after being sent off, they went down to Antioch, and after gathering the multitude[c][b], they delivered the letter.
translation:
  language: vi
  text: Vậy, sau khi được tiễn đi[a], họ xuống An-ti-ốt[b]. Sau khi quy tụ hội chúng[c], họ trao bức thư.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “sau khi được cho về” hoặc “sau khi được cho đi”. Từ Hy Lạp có thể chỉ việc chính thức cho người nào rời đi.
    reason: lexical_alternative
  - marker: b
    text: “Xuống” phản ánh hướng chuyển động trong động từ Hy Lạp, có lẽ vì Giê-ru-sa-lem nằm ở độ cao lớn hơn An-ti-ốt.
    reason: cultural_note
  - marker: c
    text: Cũng có thể dịch là “đám đông”, “hội chúng” hoặc “cộng đoàn”. Cụm từ này chỉ nhóm người được quy tụ tại An-ti-ốt.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπολυθέντες
  choice: sau khi được tiễn đi
  rationale: Phân từ có thể chỉ việc được cho đi hoặc được sai đi một cách chính thức. Trong ngữ cảnh này, “được tiễn đi” tự nhiên và giữ được sắc thái họ rời cuộc họp với sự chấp thuận, nhưng không hàm ý quá rõ việc chính thức sai phái.
- source_word: κατῆλθον
  choice: xuống
  rationale: Giữ sắc thái phương hướng của động từ Hy Lạp, phù hợp với hành trình từ vùng cao Giê-ru-sa-lem đến An-ti-ốt.
- source_word: συναγαγόντες
  choice: triệu tập
  rationale: Diễn tả hành động quy tụ nhóm người trước khi trao thư; cấu trúc “rồi” thể hiện rõ trình tự của phân từ bất định quá khứ.
- source_word: τὸ πλῆθος
  choice: toàn thể cộng đồng
  rationale: Cụm từ chỉ đông đảo những người được quy tụ tại An-ti-ốt. Cách dịch này tự nhiên hơn “đám đông” trong ngữ cảnh hội thánh, đồng thời tránh áp đặt một thuật ngữ cơ cấu quá chuyên biệt.
- source_word: ἐπέδωκαν
  choice: trao
  rationale: “Trao” diễn đạt việc chính thức chuyển bức thư cho cộng đồng mà vẫn tự nhiên trong tiếng Việt hiện đại.
- source_word: ἐπιστολήν
  choice: bức thư
  rationale: Tương đương thông dụng, rõ nghĩa trong tiếng Việt hiện đại, không dùng lối nói giáo hội cổ.
