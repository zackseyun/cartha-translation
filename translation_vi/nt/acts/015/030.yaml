  - severity: low
    issue: “Triệu tập” có sắc thái ra lệnh hoặc triệu tập theo thẩm quyền.
    rationale: συναγαγόντες cơ bản là quy tụ/tập hợp. “Quy tụ” trung tính hơn và sát nghĩa hơn trong ngữ cảnh này.
  revised_text: Vậy, sau khi được tiễn đi[a], họ xuống An-ti-ốt[b]. Sau khi quy tụ hội chúng[c], họ trao bức thư.
