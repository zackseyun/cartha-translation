  register: Văn phong tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “An-ti-ốt” theo lối phiên âm Kinh Thánh quen thuộc. Tách thành hai câu để tránh chuỗi phân từ nặng nề, nhưng vẫn giữ đúng trình tự hành động trong nguyên văn.
