id: ACT.15.16
reference: Acts 15:16
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Μετὰ ταῦτα ἀναστρέψω καὶ ἀνοικοδομήσω τὴν σκηνὴν Δαυὶδ τὴν πεπτωκυῖαν καὶ τὰ ⸀κατεσκαμμένα αὐτῆς ἀνοικοδομήσω καὶ ἀνορθώσω αὐτήν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/016.yaml
  text: After these things I will return[a], and I will rebuild the fallen tent of David; I will rebuild its ruins, and I will restore it[b],
translation:
  language: vi
  text: Sau những điều ấy, ta sẽ trở lại và xây dựng lại lều[a] đã sụp đổ của Đa-vít[b]; ta sẽ xây dựng lại những phần đổ nát của lều ấy và dựng nó lên.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “đền tạm”; từ Hy Lạp có thể chỉ “lều” hoặc “đền tạm”.
    reason: lexical_alternative
  - marker: b
    text: “Lều của Đa-vít” là một hình ảnh tiên tri về sự phục hồi gắn với dòng dõi hoặc vương quốc của Đa-vít.
    reason: cross_reference
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: Sau những điều ấy
  rationale: Giữ sắc thái số nhiều của ταῦτα và sự chuyển tiếp về thời gian, đồng thời vẫn tự nhiên trong tiếng Việt.
- source_word: ἀναστρέψω
  choice: ta sẽ trở lại
  rationale: Trong ngữ cảnh này, động từ diễn tả việc trở lại; ngôi thứ nhất và thì tương lai của lời hứa được giữ nguyên.
- source_word: ἀνοικοδομήσω
  choice: xây dựng lại
  rationale: Diễn đạt trực tiếp ý xây lại của động từ ghép và giữ hình ảnh phục hồi một công trình đã đổ.
- source_word: σκηνὴν Δαυὶδ
  choice: chiếc lều của Đa-vít
  rationale: σκηνή có nghĩa đen là lều hoặc đền tạm. Chọn “chiếc lều” để giữ nguyên ẩn dụ mà không diễn giải thành triều đại hay vương quốc.
- source_word: τὴν πεπτωκυῖαν
  choice: đã sụp đổ
  rationale: Phân từ hoàn thành mô tả tình trạng hiện tại do việc ngã đổ trước đó; “đã sụp đổ” diễn đạt rõ và tự nhiên.
- source_word: τὰ κατεσκαμμένα αὐτῆς
  choice: những phần đổ nát của nó
  rationale: Cụm phân từ trung tính số nhiều chỉ những phần đã bị phá đổ; cách dịch này giữ ý số nhiều và phù hợp với hình ảnh xây dựng lại.
- source_word: ἀνορθώσω αὐτήν
  choice: dựng nó đứng lên
  rationale: Giữ hình ảnh cụ thể của việc làm cho vật đã đổ được đứng thẳng lại, thay vì chỉ dùng từ khái quát “khôi phục”.
theological_decisions:
- issue: Ý nghĩa ẩn dụ của “chiếc lều của Đa-vít”
  choice: Giữ nguyên hình ảnh “chiếc lều của Đa-vít” trong chính văn.
  alternative: Diễn giải thành “nhà Đa-vít”, “dòng dõi Đa-vít” hoặc “vương quốc Đa-vít”.
  rationale: Bản Hy Lạp duy trì ẩn dụ tiên tri. Dù hình ảnh có liên hệ đến sự phục hồi gắn với dòng dõi hoặc vương quyền Đa-vít, việc diễn giải thẳng trong chính văn sẽ thu hẹp sự hàm ý của câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ta” cho lời phán ở ngôi thứ nhất mà không thêm cách viết hoa mang tính diễn giải. Cấu trúc song song “xây dựng lại… xây dựng lại… dựng… đứng lên” giữ nhịp điệu phục hồi của nguyên văn.
