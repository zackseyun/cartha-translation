  to: Sau những điều ấy, ta sẽ trở lại và xây dựng lại lều[a] đã sụp đổ của Đa-vít[b]; ta sẽ xây dựng lại những phần đổ nát của lều ấy và dựng nó lên.
  rationale: Chỉnh sửa duy nhất trong chính văn là thay “dựng nó đứng lên” bằng “dựng nó lên” và làm rõ quy chiếu của cụm “những phần đổ nát”. Những thay đổi này tăng tính tự nhiên của tiếng Việt mà không diễn giải thêm ẩn dụ hay thay đổi nghĩa, trật tự, hoặc lực phục hồi của nguyên văn.
