  text: ἀνθρώποις παραδεδωκόσι τὰς ψυχὰς αὐτῶν ὑπὲρ τοῦ ὀνόματος τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/026.yaml
  text: men who have given up their lives for the name of our Lord Jesus the Messiah[a][b].
translation:
  language: vi
  text: là những người đã liều mạng vì danh Chúa chúng ta là Đức Giê-su, Đấng Mê-si-a.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch sát hơn: “đã phó mạng sống mình”; tiếng Hy Lạp diễn tả việc họ tự đặt mình vào hiểm nguy chết người.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνθρώποις
  choice: những người
  rationale: Chỉ Ba-na-ba và Phao-lô trong ngữ cảnh trước; tiếng Việt không cần dùng một danh từ đánh dấu giới tính để diễn đạt tự nhiên và chính xác.
- source_word: παραδεδωκόσι
  choice: đã liều
  rationale: Phân từ hoàn thành của παραδίδωμι theo nghĩa đen là trao nộp/phó mình; đi với 'mạng sống' ở đây diễn tả việc tự đặt mình vào hiểm nguy chết người, không nhất thiết nói rằng họ đã chết.
- source_word: τὰς ψυχὰς αὐτῶν
  choice: mạng sống mình
  rationale: ψυχή trong ngữ cảnh hiểm nguy mang nghĩa mạng sống, không phải linh hồn theo nghĩa phi vật chất.
- source_word: ὑπὲρ
  choice: vì
  rationale: Với sở hữu cách, ὑπέρ ở đây nêu nguyên do hay mục đích mà họ chấp nhận hiểm nguy; 'vì' gọn và tự nhiên.
- source_word: τοῦ ὀνόματος
  choice: danh
  rationale: Giữ cách nói Kinh Thánh, bao hàm con người, thẩm quyền và vinh dự gắn với danh ấy.
- source_word: τοῦ κυρίου ἡμῶν
  choice: Chúa chúng ta
  rationale: κύριος được dịch bằng tước hiệu quen thuộc 'Chúa', giữ trọng lượng Cơ Đốc học của câu.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Đức Giê-su, Đấng Mê-si-a
  rationale: Giê-su là tên riêng; Χριστός là tước hiệu nghĩa là Đấng Mê-si-a. Dấu phẩy giúp tiếng Việt nhận rõ quan hệ đồng vị.
theological_decisions:
- issue: Cách dịch Χριστοῦ trong cụm κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  choice: Đấng Mê-si-a
  alternative: Đấng Christ / Ki-tô
  rationale: Χριστός vẫn mang nghĩa tước hiệu trong cụm trang trọng này. 'Đấng Mê-si-a' truyền đạt nghĩa của tước hiệu thay vì khiến từ này bị hiểu như một phần của tên riêng.
- issue: Mức độ hy sinh hàm ý trong παραδεδωκόσι τὰς ψυχὰς αὐτῶν
  choice: đã liều mạng sống mình
  alternative: đã phó mạng sống mình
  rationale: Ngữ cảnh nói đến việc tự đặt mạng sống vào hiểm nguy vì danh Chúa, nhưng không nói Ba-na-ba và Phao-lô đã thực sự chết. 'Liều mạng sống' giữ được sức nặng mà không khẳng định quá mức.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cụm này tiếp nối cú pháp của câu 25 nên được mở đầu bằng “là những người”. Dùng “danh Chúa” để giữ âm hưởng và chiều sâu của cách nói Kinh Thánh.
