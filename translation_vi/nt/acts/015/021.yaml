  source_fidelity: 'Bản dịch giữ đúng các thành tố chính của câu Hy Lạp: γάρ được dịch là “Vì”; ἐκ γενεῶν ἀρχαίων là “từ bao thế hệ xa xưa”; κατά πόλιν là “trong mỗi thành”; và κατά πᾶν σάββατον là “vào mỗi ngày Sa-bát”. Cấu trúc “Môi-se ... có những người rao giảng về Môi-se; ông được đọc” bảo toàn phép hoán dụ và đại từ giống đực của nguyên văn. Dấu chấm phẩy không buộc phân từ ἀναγινωσκόμενος vào một quan hệ nhân quả mà bản Hy Lạp không nói minh thị.'
  naturalness: Văn phong hiện đại, trang trọng và dễ hiểu. “Rao giảng về Môi-se” là cách diễn đạt tiếng Việt tự nhiên cho đối tượng nội dung của sự công bố, dù nguyên văn dùng tân ngữ trực tiếp; chú thích đã làm rõ phép hoán dụ. “Ông được đọc” có chủ ý duy trì cách nhân cách hóa của nguyên văn và được hỗ trợ đầy đủ bởi chú thích.
  terminology: “Môi-se,” “hội đường,” và “ngày Sa-bát” phù hợp cách dùng Kinh Thánh tiếng Việt hiện đại. Chú thích giải thích chính xác rằng Môi-se ở đây chỉ các sách hoặc luật gắn với ông, không thay phép hoán dụ bằng một diễn giải trong chính văn.
