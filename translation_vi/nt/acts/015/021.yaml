id: ACT.15.21
reference: Acts 15:21
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Μωϋσῆς γὰρ ἐκ γενεῶν ἀρχαίων κατὰ πόλιν τοὺς κηρύσσοντας αὐτὸν ἔχει ἐν ταῖς συναγωγαῖς κατὰ πᾶν σάββατον ἀναγινωσκόμενος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/021.yaml
  text: For from ancient generations Moses has had those who proclaim him in every city[a], being read in the synagogues every Sabbath.
translation:
  language: vi
  text: Vì từ bao thế hệ xa xưa, trong mỗi thành đều có những người rao giảng về Môi-se[a]; ông được đọc trong các hội đường vào mỗi ngày Sa-bát.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn nói sát nghĩa: “Môi-se… có những người rao giảng về ông… ông được đọc.” Tên “Môi-se” được dùng để chỉ các sách hoặc luật gắn với ông.'
    reason: Giải thích phép hoán dụ trong nguyên văn và cách dùng đại từ chỉ người.
lexical_decisions:
- source_word: Μωϋσῆς
  choice: Môi-se
  rationale: Dùng dạng tên riêng quen thuộc trong tiếng Việt; trong câu này tên Môi-se được dùng theo phép hoán dụ để chỉ các sách hoặc luật gắn với ông.
- source_word: γὰρ
  choice: Vì
  rationale: Giữ chức năng giải thích, nêu lý do cho phán quyết ở câu trước.
- source_word: ἐκ γενεῶν ἀρχαίων
  choice: từ bao thế hệ xa xưa
  rationale: Diễn đạt tự nhiên ý nghĩa thời gian lâu đời, đồng thời giữ hình ảnh nhiều thế hệ của nguyên văn.
- source_word: κατὰ πόλιν
  choice: trong mỗi thành
  rationale: Thể hiện đúng ý phân bố của κατά với danh từ số ít.
- source_word: τοὺς κηρύσσοντας αὐτὸν
  choice: những người rao giảng về Môi-se
  rationale: “Rao giảng” giữ sắc thái công bố của κηρύσσω; thêm “về” là cách nói tự nhiên trong tiếng Việt khi đối tượng là nội dung được công bố, nhưng vẫn bảo toàn phép hoán dụ của nguyên văn.
- source_word: ἔχει
  choice: đều có
  rationale: Thì hiện tại Hy Lạp diễn tả thực trạng bền lâu bắt đầu từ thời xa xưa; kết hợp với cụm thời gian phía trước, tiếng Việt truyền đạt rõ tính liên tục mà không cần thêm một thì hoàn thành.
- source_word: ἐν ταῖς συναγωγαῖς
  choice: trong các hội đường
  rationale: “Hội đường” là cách gọi rõ ràng, quen thuộc cho nơi hội họp và thờ phượng của người Do Thái.
- source_word: κατὰ πᾶν σάββατον
  choice: vào mỗi ngày Sa-bát
  rationale: Giữ ý lặp lại đều đặn vào từng ngày Sa-bát.
- source_word: ἀναγινωσκόμενος
  choice: ông được đọc
  rationale: Giữ kết cấu phân từ bị động và phép nhân cách hóa/hoán dụ “Môi-se được đọc,” không áp đặt quan hệ nhân quả bằng “vì” hoặc “bởi vì”.
theological_decisions:
- issue: Tên Môi-se được dùng theo phép hoán dụ
  choice: Giữ cách nói “Môi-se” và “ông được đọc” trong chính văn.
  alternative: Thay bằng “luật Môi-se” hoặc “các sách của Môi-se.”
  rationale: Nguyên văn nói đích danh “Môi-se” và dùng đại từ quy chiếu về ông. Giữ phép hoán dụ bảo toàn hình thức và độ mở của bản Hy Lạp; chú thích giải thích nghĩa hàm ẩn.
- issue: Quan hệ của phân từ ἀναγινωσκόμενος với mệnh đề chính
  choice: Dùng dấu chấm phẩy và “ông được đọc,” không thêm liên từ nhân quả.
  alternative: Dịch “vì ông được đọc” hoặc “bởi ông được đọc.”
  rationale: Phân từ có thể mang sắc thái giải thích theo ngữ cảnh, nhưng nguyên văn không biểu thị tường minh quan hệ nhân quả. Cách dịch này giữ được sự mơ hồ cú pháp chính đáng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Bao thế hệ xa xưa” tự nhiên hơn lối dịch cứng “các thế hệ cổ xưa”; “hội đường” và “ngày Sa-bát” theo cách dùng Kinh Thánh phổ biến trong tiếng Việt. Dấu chấm phẩy giúp câu rõ nghĩa trong khi vẫn giữ liên hệ chặt giữa hai mệnh đề.
