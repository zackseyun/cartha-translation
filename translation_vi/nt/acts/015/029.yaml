id: ACT.15.29
reference: Acts 15:29
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀπέχεσθαι εἰδωλοθύτων καὶ αἵματος καὶ ⸀πνικτῶν καὶ πορνείας· ἐξ ὧν διατηροῦντες ἑαυτοὺς εὖ πράξετε. ἔρρωσθε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/029.yaml
  text: to abstain from food sacrificed to idols[a], from blood, from what has been strangled, and from sexual immorality. If you keep yourselves from these things, you will do well[d][c][b]. Farewell.
translation:
  language: vi
  text: hãy kiêng thức ăn đã cúng thần tượng[a], huyết, thịt của con vật bị siết cổ[b], và những hành vi tình dục bất chính[c]. Nếu anh em giữ mình khỏi những điều ấy, anh em sẽ làm tốt. Mạnh khỏe nhé![d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “những vật đã cúng tế thần tượng.”'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “những vật bị siết cổ”; cũng có thể dịch: “thịt bị siết cổ.”'
    reason: lexical_alternative
  - marker: c
    text: Từ Hy Lạp được dịch là “những hành vi tình dục bất chính” có thể được hiểu theo nghĩa rộng; tuy nhiên, trong ngữ cảnh này, một số người hiểu cụ thể hơn dựa trên các điều cấm trong sách Lê-vi Ký.
    reason: alternative_reading
  - marker: d
    text: 'Cũng có thể dịch: “Tạm biệt” hoặc “Hãy mạnh khỏe.” Đây là một công thức kết thư thông dụng trong tiếng Hy Lạp.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέχεσθαι
  choice: hãy kiêng
  rationale: 'Diễn đạt tự nhiên nội dung mệnh lệnh được bổ nghĩa bởi động từ nguyên mẫu: tránh và không dự phần vào những điều được liệt kê.'
- source_word: εἰδωλοθύτων
  choice: những thức ăn đã cúng thần tượng
  rationale: Từ này chỉ những vật đã được dâng trong việc thờ thần tượng, thường là thức ăn hoặc thịt; cách dịch này rõ nghĩa trong tiếng Việt hiện đại mà vẫn giữ bối cảnh thờ cúng.
- source_word: αἵματος
  choice: huyết
  rationale: Giữ cách nói ngắn gọn của nguyên văn. “Huyết” phù hợp văn phong Kinh Thánh trang trọng và tại đây được hiểu trong bối cảnh điều cấm ăn uống.
- source_word: πνικτῶν
  choice: thịt của con vật bị siết cổ
  rationale: Tính từ được dùng như danh từ, chỉ con vật bị giết bằng cách siết cổ, khiến máu không được rút hết; thêm “thịt của con vật” giúp câu tự nhiên và rõ trong tiếng Việt.
- source_word: πορνείας
  choice: sự gian dâm
  rationale: Chỉ hành vi tình dục trái luân lý với phạm vi có thể rộng; “sự gian dâm” là cách nói trang trọng, quen thuộc và không thu hẹp từ này vào riêng quan hệ trước hôn nhân.
- source_word: ἐξ ὧν
  choice: khỏi những điều ấy
  rationale: Nêu rõ cụm đại từ quan hệ quy chiếu về toàn bộ danh sách vừa kể.
- source_word: διατηροῦντες ἑαυτούς
  choice: Nếu anh em giữ mình
  rationale: Phân từ có sắc thái điều kiện; cấu trúc “nếu” tự nhiên trong tiếng Việt và giữ đúng ý chủ động canh giữ bản thân khỏi các điều đã nêu.
- source_word: εὖ πράξετε
  choice: thì sẽ làm tốt
  rationale: Giữ sự hàm nghĩa rằng làm theo lời chỉ dẫn là đường lối đúng đắn, đáng khen, mà không diễn giải thành lời hứa thịnh vượng.
- source_word: ἔρρωσθε
  choice: Chúc anh em mạnh khỏe!
  rationale: Đây là công thức kết thư thông dụng, nguyên nghĩa liên quan đến sức khỏe hoặc sức mạnh; cách dịch này vừa tự nhiên trong thư tín tiếng Việt vừa phản ánh sắc thái từ nguyên.
theological_decisions:
- issue: Phạm vi nghĩa của πορνεία trong sắc lệnh của các sứ đồ
  choice: Dịch là “sự gian dâm” theo nghĩa rộng, không giới hạn vào một hành vi tình dục cụ thể.
  alternative: “quan hệ tình dục bất chính” hoặc các cuộc hôn nhân bị cấm theo Lê-vi Ký 18
  rationale: Ngữ cảnh có thể khiến một số người liên hệ từ này với các lệnh cấm trong Lê-vi Ký, nhưng chính câu này không xác định hẹp như vậy; bản dịch chính giữ phạm vi từ vựng rộng và chú thích nêu khả năng giải thích cụ thể hơn.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh em” theo ngữ cảnh cộng đồng nhận thư; giữ cấu trúc liệt kê súc tích của nguyên văn. “Chúc anh em mạnh khỏe” truyền đạt tự nhiên công thức kết thư ἔρρωσθε, còn chú thích bảo lưu cách hiểu “Tạm biệt”.
