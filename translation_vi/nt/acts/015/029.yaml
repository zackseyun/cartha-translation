  verdict: revise
  source_fidelity: Bản dịch truyền đạt đúng bốn điều cần kiêng, mệnh đề điều kiện «nếu giữ mình... sẽ làm tốt», và lời kết thư. Tuy nhiên, chú thích b gọi nguyên văn là «những con vật bị siết cổ», trong khi πνικτῶν là dạng giống trung số nhiều dùng như danh từ («những vật/điều bị siết cổ»), thường được hiểu theo ngữ cảnh là thịt từ thú vật bị siết cổ. Cần sửa để không trình bày phần diễn giải ngữ cảnh như nguyên văn.
  naturalness: Câu liệt kê và giọng văn nhìn chung tự nhiên. «Những hành vi tình dục bất chính» rõ và bao quát hơn «sự gian dâm» trong tiếng Việt hiện đại, vì «gian dâm» có thể bị hiểu hẹp là ngoại tình. «Mạnh khỏe nhé!» là lời kết thư tự nhiên, đồng thời giữ được sắc thái thông thường của ἔρρωσθε.
  terminology: «Huyết» phù hợp văn phong Kinh Thánh trang trọng. «Thức ăn đã cúng thần tượng» giữ đúng nghĩa thông dụng của εἰδωλόθυτα; chú thích bảo lưu nghĩa rộng hơn. Cách dịch về tình dục không áp đặt cách giải thích giới hạn theo Lê-vi Ký 18.
