- from: hãy kiêng những thức ăn đã cúng thần tượng[a], kiêng huyết, thịt của con vật bị siết cổ[b], và sự gian dâm[c]. Nếu anh em giữ mình khỏi những điều ấy thì sẽ làm tốt. Chúc anh em mạnh khỏe![d]
