  text: διήρχετο δὲ τὴν Συρίαν καὶ ⸀τὴν Κιλικίαν ἐπιστηρίζων τὰς ἐκκλησίας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/041.yaml
  text: And he went through Syria and Cilicia, strengthening the churches.
translation:
  language: vi
  text: Ông đi qua miền Sy-ri và Ki-li-ki, củng cố các hội thánh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διήρχετο
  choice: đi khắp
  rationale: Động từ ở thì chưa hoàn thành diễn tả hành trình đang tiếp diễn qua các vùng; “đi khắp” tự nhiên trong tiếng Việt và truyền đạt ý đi qua nhiều nơi trong hai miền.
- source_word: δὲ
  choice: lược dịch
  rationale: δέ là liên từ chuyển tiếp nhẹ. Trong tiếng Việt, mở câu trực tiếp bằng “Ông” tự nhiên hơn; mạch nối với câu trước vẫn rõ mà không cần thêm “và” hay “rồi”.
- source_word: Συρίαν
  choice: Sy-ri
  rationale: Dùng dạng địa danh quen thuộc trong tiếng Việt.
- source_word: Κιλικίαν
  choice: Ki-li-ki
  rationale: Phiên âm địa danh theo cách đọc quen thuộc trong các bản Kinh Thánh tiếng Việt.
- source_word: ἐπιστηρίζων
  choice: làm cho ... được vững mạnh
  rationale: Phân từ chỉ hành động diễn ra đồng thời với hành trình, mang nghĩa củng cố và giúp đứng vững; cách dịch này giữ nghĩa rộng hơn việc chỉ khích lệ về cảm xúc.
- source_word: τὰς ἐκκλησίας
  choice: các hội thánh
  rationale: Trong Công Vụ, từ này chỉ các cộng đồng tín hữu địa phương; “các hội thánh” là cách gọi rõ ràng, trang trọng và quen thuộc trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng và dễ hiểu. Đại từ “ông” nối tự nhiên với chủ thể Phao-lô trong ngữ cảnh trước đó mà không bổ sung tên vốn không có trong câu Hy Lạp.
