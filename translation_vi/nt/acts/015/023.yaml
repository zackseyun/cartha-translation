source:
  edition: SBLGNT
  text: γράψαντες διὰ χειρὸς ⸀αὐτῶν· Οἱ ἀπόστολοι καὶ οἱ ⸀πρεσβύτεροι ἀδελφοὶ τοῖς κατὰ τὴν Ἀντιόχειαν καὶ Συρίαν καὶ Κιλικίαν ἀδελφοῖς τοῖς ἐξ ἐθνῶν χαίρειν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/023.yaml
  text: 'Having written by their hand: “The apostles and the elder brothers[a], to the brothers from among the Gentiles in Antioch and Syria and Cilicia[c][b], greetings.”'
translation:
  language: vi
  text: 'Họ viết thư gửi theo tay họ, nội dung như sau: “Các sứ đồ và các anh em là trưởng lão gửi lời chào đến anh em[c] xuất thân từ các dân ngoại tại An-ti-ốt, Sy-ri và Ki-li-ki.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: c
    text: “Anh em” ở đây có thể được dùng theo nghĩa bao quát các tín hữu, tức toàn thể cộng đồng, kể cả phụ nữ.
    reason: lexical_alternative
lexical_decisions:
- source_word: γράψαντες
  choice: Họ viết thư ... như sau
  rationale: Phân từ bất định quá khứ giới thiệu việc soạn bức thư; tiếng Việt tự nhiên dùng một mệnh đề hữu hạn và “như sau” để dẫn vào nội dung thư.
- source_word: διὰ χειρὸς αὐτῶν
  choice: nhờ hai người ấy chuyển đi
  rationale: Thành ngữ Hy Lạp, sát chữ là “qua tay họ”, ở đây chỉ phương tiện hay người mang thư; cách dịch này truyền đạt tự nhiên vai trò của hai đại biểu mà không khiến người đọc tưởng chính họ là người soạn thư.
- source_word: ἀπόστολοι
  choice: các sứ đồ
  rationale: Thuật ngữ quen thuộc chỉ những người được sai phái và có vai trò lãnh đạo trong hội thánh Giê-ru-sa-lem.
- source_word: πρεσβύτεροι ἀδελφοὶ
  choice: các anh em trưởng lão
  rationale: Giữ quan hệ chặt giữa hai danh từ do tiếng Hy Lạp không có mạo từ thứ hai trước ἀδελφοί; đồng thời tránh mặc nhiên biến “anh em” thành một nhóm thứ ba.
- source_word: ἀδελφοῖς
  choice: anh em
  rationale: Giữ hình thức giống đực số nhiều của nguyên văn; chú thích nêu rõ trong lời gửi thư này từ ấy có thể bao gồm toàn thể cộng đồng tín hữu, kể cả phụ nữ.
- source_word: τοῖς ἐξ ἐθνῶν
  choice: xuất thân từ các dân ngoại
  rationale: Diễn đạt rõ nguồn gốc dân tộc được chỉ bởi ἐξ với sở hữu cách, thay vì làm mờ sắc thái này thành một mô tả chung.
- source_word: χαίρειν
  choice: gửi lời chào
  rationale: Trong phần mở đầu thư, χαίρειν là công thức chào hỏi thông dụng, không phải mệnh lệnh “hãy vui mừng”.
- source_word: κατὰ τὴν Ἀντιόχειαν καὶ Συρίαν καὶ Κιλικίαν
  choice: tại An-ti-ốt, Sy-ri và Ki-li-ki
  rationale: κατά với đối cách ở đây chỉ địa bàn phân bố hay nơi cư trú của người nhận; “tại” là cách diễn đạt tiếng Việt gọn và tự nhiên.
theological_decisions:
- issue: Quan hệ cú pháp trong πρεσβύτεροι ἀδελφοὶ
  choice: các anh em trưởng lão
  alternative: các trưởng lão, là anh em
  rationale: Cách dịch chính phản ánh việc ἀδελφοί không có mạo từ riêng và vì thế gắn chặt với πρεσβύτεροι. Tuy nhiên, cụm từ có thể được hiểu theo lối đồng vị; chú thích giữ lại khả năng ấy mà không thêm một nhóm thứ ba không được đánh dấu rõ trong nguyên văn.
- issue: Phạm vi chỉ người của ἀδελφοῖς trong lời gửi cộng đồng
  choice: anh em
  alternative: anh chị em
  rationale: Bản chính giữ hình thức giống đực của từ Hy Lạp, còn chú thích bảo toàn khả năng từ này được dùng theo nghĩa bao quát toàn thể cộng đồng tín hữu, gồm cả nam lẫn nữ.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Sứ đồ”, “trưởng lão”, “dân ngoại” giữ vốn từ Kinh Thánh quen thuộc; địa danh được phiên âm theo cách dùng tiếng Việt. Cấu trúc lời gửi thư được sắp xếp tự nhiên trong tiếng Việt nhưng vẫn bảo toàn điểm mơ hồ đáng kể quanh cụm πρεσβύτεροι ἀδελφοὶ.
