  naturalness: Văn phong nhìn chung tự nhiên, trang trọng vừa phải. “Các anh em trưởng lão” có thể hiểu được, nhưng “các anh em là trưởng lão” rõ quan hệ đồng vị hơn trong tiếng Việt hiện đại. “Gửi theo tay họ” giữ được thành ngữ nguồn mà vẫn đọc tự nhiên trong khung thư tín.
