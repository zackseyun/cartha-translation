revisions:
- from: 'Họ viết thư và nhờ hai người ấy chuyển đi[a] như sau: “Các sứ đồ và các anh em trưởng lão[b] gửi lời chào đến anh em[c] xuất thân từ các dân ngoại tại An-ti-ốt, Sy-ri và Ki-li-ki.”'
  to: 'Họ viết thư gửi theo tay họ, nội dung như sau: “Các sứ đồ và các anh em là trưởng lão gửi lời chào đến anh em[c] xuất thân từ các dân ngoại tại An-ti-ốt, Sy-ri và Ki-li-ki.”'
  rationale: Đã bỏ chi tiết “hai” không được nêu trong chính câu Hy Lạp, đồng thời giữ sắc thái thành ngữ của διὰ χειρὸς αὐτῶν bằng “gửi theo tay họ”. Cụm πρεσβύτεροι ἀδελφοὶ được diễn đạt rõ và tự nhiên hơn là “các anh em là trưởng lão”, vẫn không biến “anh em” thành một nhóm thứ ba. Chú thích b được chỉnh để trình bày chính xác phương án phân tích thay thế. Mốc chú thích a không được đặt trong bản chính vì cách dịch sửa đổi không cần chú giải trực tiếp để hiểu; bộ chú thích vẫn được giữ theo dữ liệu đã cung cấp.
