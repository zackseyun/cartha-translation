id: ACT.15.22
reference: Acts 15:22
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Τότε ἔδοξε τοῖς ἀποστόλοις καὶ τοῖς πρεσβυτέροις σὺν ὅλῃ τῇ ἐκκλησίᾳ ἐκλεξαμένους ἄνδρας ἐξ αὐτῶν πέμψαι εἰς Ἀντιόχειαν σὺν ⸀τῷ Παύλῳ καὶ Βαρναβᾷ, Ἰούδαν τὸν ⸀καλούμενον Βαρσαββᾶν καὶ Σιλᾶν, ἄνδρας ἡγουμένους ἐν τοῖς ἀδελφοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/022.yaml
  text: 'Then it seemed good to the apostles and the elders, together with the whole church, to choose men from among them and send them to Antioch with Paul and Barnabas: Judas, who was called Barsabbas, and Silas, men who were leading among the brothers.'
translation:
  language: vi
  text: 'Bấy giờ, các sứ đồ và các trưởng lão, cùng với toàn thể hội thánh, thấy nên chọn những người trong số họ và phái đến An-ti-ốt cùng với Phao-lô và Ba-na-ba: Giu-đa, người còn được gọi là Ba-sa-ba, và Si-la, là những người có vai trò lãnh đạo[a] giữa các anh em.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “là những người đứng đầu giữa các anh em.”'
    reason: lexical_alternative
  - marker: b
    text: “Các anh em” ở đây rất có thể chỉ cộng đồng tín hữu nói chung, gồm cả phụ nữ.
    reason: cultural_note
lexical_decisions:
- source_word: ἔδοξε
  choice: thấy nên
  rationale: Diễn đạt tự nhiên một nhận định chung sau khi cân nhắc, không đẩy nghĩa thành một sắc lệnh chính thức.
- source_word: τοῖς ἀποστόλοις καὶ τοῖς πρεσβυτέροις
  choice: các sứ đồ và các trưởng lão
  rationale: Các thuật ngữ quen thuộc, chính xác và dễ hiểu trong văn cảnh hội thánh ban đầu.
- source_word: σὺν ὅλῃ τῇ ἐκκλησίᾳ
  choice: cùng với toàn thể hội thánh
  rationale: Giữ rõ sự tham gia của cả cộng đồng hội thánh mà không áp đặt một mô hình quản trị cụ thể.
- source_word: ἐκλεξαμένους ἄνδρας ἐξ αὐτῶν
  choice: chọn vài người trong số họ
  rationale: Chuyển cấu trúc phân từ Hy Lạp sang tiếng Việt tự nhiên; “vài người” phù hợp với hai đại biểu nam được nêu tên ngay sau đó.
- source_word: πέμψαι εἰς Ἀντιόχειαν
  choice: phái đến An-ti-ốt
  rationale: “Phái” thể hiện việc cử đại biểu đi làm nhiệm vụ và vẫn là cách nói hiện đại.
- source_word: τὸν καλούμενον Βαρσαββᾶν
  choice: cũng gọi là Ba-sa-ba
  rationale: Diễn đạt tự nhiên rằng Giu-đa còn được gọi bằng tên Ba-sa-ba.
- source_word: ἄνδρας ἡγουμένους ἐν τοῖς ἀδελφοῖς
  choice: những người có vai trò lãnh đạo giữa các anh em
  rationale: Giữ sắc thái họ thực thi vai trò lãnh đạo được nhìn nhận, nhưng không biến cụm từ thành tên một chức vụ chính thức.
- source_word: ἀδελφοῖς
  choice: các anh em
  rationale: Giữ hình thức nam tính của nguyên văn; chú thích nêu rõ từ này trong văn cảnh có thể chỉ rộng hơn đến cộng đồng tín hữu.
theological_decisions:
- issue: Mức độ tham gia của toàn thể hội thánh
  choice: Câu dịch đặt toàn thể hội thánh cùng với các sứ đồ và trưởng lão trong việc xét thấy nên chọn và phái các đại biểu.
  alternative: Chỉ các sứ đồ và trưởng lão quyết định, còn hội thánh chỉ hiện diện.
  rationale: Cụm σὺν ὅλῃ τῇ ἐκκλησίᾳ tự nhiên nhất là bao gồm toàn thể hội thánh trong hành động, nhưng bản dịch không suy diễn thành một thể chế quản trị cụ thể.
- issue: Ý nghĩa của ἀδελφοῖς
  choice: Dùng “các anh em” trong chính văn và giải thích nghĩa bao quát trong chú thích.
  alternative: Dịch trực tiếp là “các anh chị em” hoặc “các tín hữu”.
  rationale: Cách dịch giữ hình thức nam tính của tiếng Hy Lạp đồng thời không che khuất khả năng từ này chỉ toàn thể cộng đồng tín hữu, gồm cả phụ nữ.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng vừa phải và dễ đọc. Dùng “hội thánh”, “sứ đồ”, “trưởng lão” theo cách gọi quen thuộc; tên riêng được phiên âm nhất quán. Tách câu dài của Hy Lạp thành hai câu để rõ nghĩa mà vẫn giữ quan hệ cú pháp và nội dung.
