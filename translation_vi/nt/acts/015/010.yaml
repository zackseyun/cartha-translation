revisions:
- from: Vậy bây giờ, tại sao anh em thử Đức Chúa Trời[a] bằng cách đặt một cái ách[b] lên cổ các môn đồ, là ách mà cả tổ phụ chúng ta lẫn chính chúng ta đều không đủ sức mang nổi?
  to: Vậy bây giờ, tại sao anh em thử Đức Chúa Trời[a] bằng cách đặt lên cổ các môn đồ một cái ách[b] mà cả cha ông chúng ta lẫn chính chúng ta đều không đủ sức mang nổi?
  rationale: Bản sửa chỉ điều chỉnh trật tự từ và cách gọi các thế hệ trước để câu tiếng Việt tự nhiên hơn và để mệnh đề quan hệ gắn rõ với “cái ách”. Hình ảnh ẩn dụ, tính chất chất vấn đối với Đức Chúa Trời, và tính mơ hồ có chủ ý về nội dung cụ thể của cái ách đều được giữ nguyên.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T09:19:01Z'
review_pass:
  verdict: revise
  source_fidelity: Bản dịch truyền đạt đúng câu hỏi tu từ của τί πειράζετε τὸν θεόν, quan hệ cách thức của ἐπιθεῖναι, và hình ảnh cái ách đặt trên cổ các môn đồ. Cặp phủ định οὔτε…οὔτε cùng ý khả năng trong ἰσχύσαμεν βαστάσαι cũng được giữ lại. Tuy nhiên, vị trí của cụm quan hệ nên được chỉnh để liên kết trực tiếp, rõ ràng với “cái ách”, như trong nguyên văn.
  naturalness: Ngôn ngữ nhìn chung là tiếng Việt hiện đại, trang trọng. Tuy vậy, “đặt một cái ách lên cổ các môn đồ, là ách mà…” hơi nặng và lặp, vì cụm “là ách mà” không tự nhiên trong văn xuôi hiện đại. Đưa “một cái ách mà…” sau bổ ngữ “lên cổ các môn đồ” làm câu gọn và sáng hơn. “Cha ông chúng ta” tự nhiên hơn “tổ phụ chúng ta” trong ý chỉ các thế hệ trước nói chung.
  terminology: “Đức Chúa Trời”, “môn đồ” và “cái ách” phù hợp với văn phong Kinh Thánh và bảo toàn các thuật ngữ/hình ảnh chủ chốt. Không nên giải thích “cái ách” thành Luật Môi-se hoặc một tập hợp quy định cụ thể trong chính văn. “Thử Đức Chúa Trời” có thể giữ; chú thích “thử thách Đức Chúa Trời” cung cấp phương án diễn đạt rõ hơn.
  issues:
  - severity: low
    issue: Cấu trúc quan hệ “là ách mà” hơi gượng và lặp danh từ.
    rationale: ὃν quy chiếu trực tiếp về ζυγόν. Cấu trúc “một cái ách mà…” sau “lên cổ các môn đồ” vừa giữ quan hệ này vừa tự nhiên hơn trong tiếng Việt.
  - severity: low
    issue: “Tổ phụ” có thể gợi một nhóm nhân vật tổ phụ theo nghĩa hẹp hơn ý tập thể của οἱ πατέρες ἡμῶν.
    rationale: Trong ngữ cảnh này, từ Hy Lạp chỉ cha ông/các thế hệ đi trước của cộng đồng. “Cha ông chúng ta” là cách nói hiện đại, bao quát và không làm thay đổi nghĩa.
