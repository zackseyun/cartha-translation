id: ACT.15.10
reference: Acts 15:10
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: νῦν οὖν τί πειράζετε τὸν θεόν, ἐπιθεῖναι ζυγὸν ἐπὶ τὸν τράχηλον τῶν μαθητῶν ὃν οὔτε οἱ πατέρες ἡμῶν οὔτε ἡμεῖς ἰσχύσαμεν βαστάσαι;
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/010.yaml
  text: Now then[c][b][a], why are you testing God by putting a yoke on the neck of the disciples that neither our fathers nor we have been able to bear?
translation:
  language: vi
  text: Vậy bây giờ, tại sao anh em thử Đức Chúa Trời[a] bằng cách đặt lên cổ các môn đồ một cái ách[b] mà cả cha ông chúng ta lẫn chính chúng ta đều không đủ sức mang nổi?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “thử thách Đức Chúa Trời.”'
    reason: lexical_alternative
  - marker: b
    text: “Cái ách” là hình ảnh chỉ một nghĩa vụ bị áp đặt; trong bối cảnh này, đó là những yêu cầu được đặt lên các môn đồ.
    reason: cultural_note
lexical_decisions:
- source_word: νῦν οὖν
  choice: Vậy bây giờ
  rationale: Diễn đạt tự nhiên cả ý chuyển tiếp của νῦν lẫn ý suy luận của οὖν trong tiếng Việt hiện đại.
- source_word: τί πειράζετε τὸν θεόν
  choice: tại sao anh em thử Đức Chúa Trời
  rationale: τί mang nghĩa “tại sao” trong câu hỏi tu từ; πειράζω với tân ngữ chỉ hành động thử hoặc thử thách. Cách dịch giữ nguyên độ căng của lời chất vấn.
- source_word: ἐπιθεῖναι
  choice: bằng cách đặt
  rationale: Động từ nguyên mẫu giải thích cách thức họ thử Đức Chúa Trời; “bằng cách đặt” thể hiện rõ quan hệ này.
- source_word: ζυγὸν
  choice: một cái ách
  rationale: Giữ nguyên hình ảnh cụ thể về ách thay vì diễn giải thành “nghĩa vụ” hay “gánh nặng”.
- source_word: ἐπὶ τὸν τράχηλον τῶν μαθητῶν
  choice: lên cổ các môn đồ
  rationale: Bản dịch trực tiếp, tự nhiên, giữ được hình ảnh sống động của nguyên văn.
- source_word: οὔτε οἱ πατέρες ἡμῶν οὔτε ἡμεῖς
  choice: cả tổ phụ chúng ta lẫn chính chúng ta đều không
  rationale: Cấu trúc “cả… lẫn… đều không” truyền đạt tự nhiên cặp phủ định οὔτε…οὔτε; “tổ phụ” chỉ các thế hệ cha ông của Israel, còn “chính” nhấn mạnh sự tương phản với thế hệ hiện tại.
- source_word: ἰσχύσαμεν βαστάσαι
  choice: không đủ sức mang nổi
  rationale: Diễn đạt khả năng theo ἰσχύω và giữ sự liên kết tự nhiên giữa “mang” với hình ảnh cái ách.
theological_decisions:
- issue: Ý nghĩa của hình ảnh “cái ách”
  choice: Giữ nguyên phép ẩn dụ về một nghĩa vụ bị đặt lên các môn đồ, không xác định phạm vi của ách ngay trong chính văn.
  alternative: Diễn giải cụ thể là toàn bộ Luật Môi-se, hoặc hẹp hơn là phép cắt bì cùng các đòi hỏi liên quan.
  rationale: Bối cảnh nói đến những yêu cầu đặt trên các tín hữu dân ngoại, nhưng câu này chỉ gọi chúng bằng hình ảnh “cái ách”. Giữ phép ẩn dụ tránh áp đặt một kết luận thần học hẹp hơn lời văn.
- issue: Sắc thái của πειράζετε τὸν θεόν
  choice: “thử Đức Chúa Trời”, kèm chú thích phương án “thử thách Đức Chúa Trời”.
  alternative: Chỉ dịch là “thử thách Đức Chúa Trời”.
  rationale: “Thử” bám sát từ ngữ và giữ tính hàm súc; chú thích làm rõ sắc thái đối đầu của thành ngữ mà không giải quyết quá mức ngay trong chính văn.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh em” vì Phi-e-rơ đang trực tiếp chất vấn những người trong cộng đồng; dùng “Đức Chúa Trời”, “môn đồ” và “tổ phụ” theo văn phong Kinh Thánh quen thuộc. Cấu trúc câu hỏi tu từ và hình ảnh cái ách được bảo tồn.
