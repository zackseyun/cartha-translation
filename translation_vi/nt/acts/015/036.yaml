  terminology: Giữ “Phao-lô”, “Ba-na-ba”, “anh em”, “rao truyền lời Chúa”. “Anh em” bảo toàn cách gọi thân tộc giống đực của ἀδελφοί; chú thích tiếp tục nêu khả năng quy chiếu cộng đồng tín hữu gồm cả nam lẫn nữ. “Chúa” là cách dịch phù hợp cho κυρίου trong ngữ cảnh này.
