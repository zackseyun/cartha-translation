source:
  edition: SBLGNT
  text: Μετὰ δέ τινας ἡμέρας εἶπεν ⸂πρὸς Βαρναβᾶν Παῦλος⸃· Ἐπιστρέψαντες δὴ ἐπισκεψώμεθα τοὺς ⸀ἀδελφοὺς κατὰ ⸂πόλιν πᾶσαν⸃ ἐν αἷς κατηγγείλαμεν τὸν λόγον τοῦ κυρίου, πῶς ἔχουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/036.yaml
  text: After some days[a], Paul said to Barnabas, “Let us return now and visit the brothers in every city where we proclaimed the word of the Lord, and see how they are.”
translation:
  language: vi
  text: 'Vài ngày sau, Phao-lô nói với Ba-na-ba: “Chúng ta hãy trở lại, thăm anh em[a] ở mỗi thành mà chúng ta đã rao truyền lời Chúa, và xem họ ra sao.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể hiểu là “anh chị em”; tiếng Hy Lạp dùng từ “anh em” theo giống đực và có thể dùng từ ấy để đại diện cho toàn thể cộng đồng tín hữu.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δέ τινας ἡμέρας
  choice: Ít lâu sau
  rationale: Diễn đạt tự nhiên khoảng thời gian không xác định sau đó; tránh khiến người đọc hiểu cứng nhắc là chỉ đúng vài ngày.
- source_word: εἶπεν πρὸς Βαρναβᾶν Παῦλος
  choice: Phao-lô nói với Ba-na-ba
  rationale: Phản ánh trực tiếp hành động nói, người nói và người nghe.
- source_word: Ἐπιστρέψαντες δὴ ἐπισκεψώμεθα
  choice: Chúng ta hãy trở lại thăm
  rationale: Kết hợp phân từ với động từ khuyến nghị thành lời đề nghị tự nhiên trong tiếng Việt; “trở lại thăm” giữ cả ý quay lại lẫn quan tâm đến tình trạng của họ.
- source_word: τοὺς ἀδελφοὺς
  choice: anh em
  rationale: Giữ hình ảnh thân tộc và hình thức giống đực của từ Hy Lạp; chú thích nêu khả năng từ này đại diện cho toàn thể tín hữu.
- source_word: κατὰ πόλιν πᾶσαν
  choice: trong từng thành
  rationale: 'Thể hiện sắc thái phân bố của κατά: lần lượt mỗi thành đã được truyền giảng.'
- source_word: ἐν αἷς κατηγγείλαμεν
  choice: mà chúng ta đã rao truyền
  rationale: “Rao truyền” diễn đạt việc công bố công khai và phù hợp văn phong Kinh Thánh hiện đại.
- source_word: τὸν λόγον τοῦ κυρίου
  choice: lời Chúa
  rationale: Cách diễn đạt quen thuộc, trang trọng và sát nghĩa cho sứ điệp thuộc về hoặc nói về Chúa.
- source_word: πῶς ἔχουσιν
  choice: để xem họ ra sao
  rationale: Diễn đạt tự nhiên thành ngữ Hy Lạp hỏi về tình trạng của những người được thăm.
theological_decisions:
- issue: ἀδελφοί có thể chỉ một cộng đồng gồm cả nam và nữ
  choice: anh em
  alternative: anh chị em; các tín hữu
  rationale: Giữ cách gọi thân tộc giống đực của nguyên văn, đồng thời dùng chú thích để bảo toàn khả năng chỉ toàn thể cộng đồng tín hữu.
- issue: Cách dịch κύριος
  choice: Chúa
  alternative: Chủ
  rationale: “Chúa” là cách dịch tự nhiên và nhất quán trong ngữ cảnh Tân Ước, không xác quyết thêm điều mà câu này không nói rõ.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “Ít lâu sau” tự nhiên hơn lối dịch sát chữ “sau vài ngày”; “trong từng thành” giữ sắc thái phân bố của nguyên văn.
