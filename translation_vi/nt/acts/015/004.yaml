id: ACT.15.4
reference: Acts 15:4
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: παραγενόμενοι δὲ εἰς ⸀Ἱεροσόλυμα ⸀παρεδέχθησαν ⸀ἀπὸ τῆς ἐκκλησίας καὶ τῶν ἀποστόλων καὶ τῶν πρεσβυτέρων, ἀνήγγειλάν τε ὅσα ὁ θεὸς ἐποίησεν μετ’ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/004.yaml
  text: When they arrived in Jerusalem[a], they were welcomed by the church and the apostles and the elders, and they reported all that God had done with them.
translation:
  language: vi
  text: Khi họ đến Giê-ru-sa-lem, họ được hội thánh, các sứ đồ và các trưởng lão tiếp đón; rồi họ thuật lại mọi điều Đức Chúa Trời đã làm với họ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể hiểu là “Đức Chúa Trời đã làm qua họ” hoặc “Đức Chúa Trời đã làm giữa họ”. Tiếng Hy Lạp nói “với họ”.
    reason: Giữ sự đa nghĩa của μετ’ αὐτῶν, vốn có thể được hiểu theo sắc thái liên kết, phương tiện hoặc phạm vi tùy ngữ cảnh.
lexical_decisions:
- source_word: παραγενόμενοι δὲ εἰς Ἱεροσόλυμα
  choice: Khi họ đến Giê-ru-sa-lem
  rationale: Phân từ bất định quá khứ nêu hoàn cảnh xảy ra trước các động từ chính; cách diễn đạt với “khi” tự nhiên trong tiếng Việt và vẫn giữ quan hệ thời gian. Sắc thái nối nhẹ của δέ được hòa vào cấu trúc câu.
- source_word: παρεδέχθησαν
  choice: họ được ... tiếp đón
  rationale: Dạng bị động diễn tả việc họ được cộng đồng tại Giê-ru-sa-lem đón nhận; “tiếp đón” tự nhiên và hàm ý hiếu khách mà không thêm ý nghĩa thần học.
- source_word: ἀπὸ τῆς ἐκκλησίας καὶ τῶν ἀποστόλων καὶ τῶν πρεσβυτέρων
  choice: được hội thánh, các sứ đồ và các trưởng lão tiếp đón
  rationale: Trong cấu trúc bị động, ἀπό chỉ tác nhân. “Hội thánh” chỉ cộng đồng tín hữu; “sứ đồ” và “trưởng lão” giữ các danh xưng chức vụ quen thuộc mà không gắn với cơ cấu hệ phái cụ thể.
- source_word: ἀνήγγειλάν τε
  choice: rồi họ thuật lại
  rationale: ἀναγγέλλω ở đây là trình bày, kể lại một bản tường thuật; “thuật lại” phù hợp với ngữ cảnh. “Rồi” thể hiện sự tiếp nối do τε liên kết.
- source_word: ὅσα ὁ θεὸς ἐποίησεν
  choice: mọi điều Đức Chúa Trời đã làm
  rationale: “Mọi điều” truyền đạt đầy đủ ὅσα; “đã làm” giữ nghĩa rộng của ποιέω và biểu thị hành động có trước việc thuật lại.
- source_word: μετ’ αὐτῶν
  choice: với họ
  rationale: μετά với sở hữu cách có nghĩa cơ bản là “với”. Cách dịch sát này giữ nguyên độ mở của câu Hy Lạp, không buộc cụm từ chỉ riêng phương tiện hay địa điểm.
theological_decisions:
- issue: Vai trò của các sứ giả trong công việc Đức Chúa Trời qua cụm μετ’ αὐτῶν
  choice: Đức Chúa Trời đã làm với họ
  alternative: Đức Chúa Trời đã làm qua họ; Đức Chúa Trời đã làm giữa họ
  rationale: Cụm Hy Lạp đặt Đức Chúa Trời làm chủ thể hành động nhưng chỉ nói các sứ giả ở trong sự liên hệ với công việc ấy. Dịch “với họ” bảo tồn sự dè dặt và độ mở thần học, không tự ý xác định họ chỉ là phương tiện hay hoạt động diễn ra giữa họ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng các thuật ngữ Kinh Thánh phổ thông “hội thánh”, “sứ đồ”, “trưởng lão”; giữ phép lặp “họ” để chủ thể rõ ràng. Dấu chấm phẩy phân tách hai hành động chính, còn “rồi” biểu thị trình tự tự nhiên.
