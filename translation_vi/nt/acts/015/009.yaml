- from: Ngài không hề phân biệt giữa chúng ta và họ, nhưng đã thanh tẩy lòng họ bởi đức tin.[a]
  to: 'Ngài không hề phân biệt giữa chúng ta và họ: Ngài đã thanh tẩy lòng họ bằng đức tin.[a]'
  rationale: Thay “nhưng đã” bằng dấu hai chấm để không thêm quan hệ đối nghịch và vẫn cho phép tiếng Việt diễn đạt rõ hành động được nêu bằng phân từ. Đổi “bởi đức tin” thành “bằng đức tin” cho tự nhiên hơn, đồng thời chú thích duy trì phương án “nhờ đức tin.”
