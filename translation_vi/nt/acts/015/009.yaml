base_translation:
  language: en
  yaml_path: translation/nt/acts/015/009.yaml
  text: And he made no distinction between us and them[a], having cleansed their hearts by faith.
translation:
  language: vi
  text: 'Ngài không hề phân biệt giữa chúng ta và họ: Ngài đã thanh tẩy lòng họ bằng đức tin.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “nhờ đức tin.” Dữ cách Hy Lạp ở đây có thể diễn tả phương tiện.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐθὲν διέκρινεν
  choice: không hề phân biệt
  rationale: Cụm này diễn đạt tự nhiên ý Thiên Chúa không tạo ra hay duy trì sự phân biệt giữa hai nhóm; “không hề” giữ được sức nhấn mạnh của οὐθέν.
- source_word: μεταξὺ ἡμῶν τε καὶ αὐτῶν
  choice: giữa chúng ta và họ
  rationale: Cách diễn đạt tiếng Việt trực tiếp và tự nhiên, giữ nguyên sự đối chiếu giữa người Do Thái và dân ngoại trong ngữ cảnh.
- source_word: τῇ πίστει
  choice: bởi đức tin
  rationale: 'Dữ cách có thể chỉ phương tiện: lòng họ được thanh tẩy nhờ đức tin. “Bởi đức tin” trang trọng, gọn và không xác định quá mức cơ chế thần học.'
- source_word: καθαρίσας
  choice: đã thanh tẩy
  rationale: Phân từ bất định chỉ hành động gắn với động từ chính; chuyển thành mệnh đề phối hợp giúp câu tiếng Việt rõ và tự nhiên. “Thanh tẩy” giữ sắc thái thanh sạch tôn giáo của καθαρίζω.
- source_word: τὰς καρδίας αὐτῶν
  choice: lòng họ
  rationale: “Lòng” là cách dịch tự nhiên của καρδία khi nói về con người bên trong, không giới hạn vào cảm xúc.
theological_decisions:
- issue: Quan hệ giữa việc không phân biệt và việc thanh tẩy
  choice: dùng “nhưng đã” để diễn đạt hành động đi kèm làm nền cho lời khẳng định
  alternative: “sau khi đã thanh tẩy” hoặc “vì đã thanh tẩy”
  rationale: Phân từ καθαρίσας không tự nó buộc phải hiểu hoàn toàn theo thời gian hay nguyên nhân. Tránh “vì” và “sau khi” để không giải quyết quá mức quan hệ ngữ nghĩa.
- issue: Ý nghĩa của πίστις
  choice: đức tin
  alternative: sự tin cậy
  rationale: Trong ngữ cảnh này, πίστις phù hợp với nghĩa “đức tin”; bản văn không nêu rõ đối tượng hay cấu trúc sở hữu, nên không thêm nội dung diễn giải.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “Ngài” quy chiếu về Đức Chúa Trời theo ngữ cảnh. Dùng “lòng” thay vì “trái tim” để diễn đạt con người bên trong; giữ “đức tin” như thuật ngữ Kinh Thánh quen thuộc.
