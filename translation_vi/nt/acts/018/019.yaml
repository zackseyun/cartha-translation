  text: ⸀κατήντησαν δὲ εἰς Ἔφεσον, κἀκείνους κατέλιπεν αὐτοῦ, αὐτὸς δὲ εἰσελθὼν εἰς τὴν συναγωγὴν ⸀διελέξατο τοῖς Ἰουδαίοις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/019.yaml
  text: They came to Ephesus[a], and he left them there[c][b]; but he himself entered into the synagogue and reasoned with the Jews.
translation:
  language: vi
  text: Họ đến Ê-phê-sô[a], và ông để họ ở lại đó[b]. Còn chính ông thì vào hội đường và biện luận với người Do Thái[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “tới Ê-phê-sô.”
    reason: lexical_alternative
  - marker: b
    text: Tức là những người cùng đi với ông—Bê-rít-sin và A-qui-la—được nhắc đến trong câu trước.
    reason: cross_reference
  - marker: c
    text: Hay “thảo luận với” hoặc “đối thoại với.” Từ Hy Lạp gợi đến một cuộc trao đổi có lý lẽ.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατήντησαν
  choice: đến
  rationale: Động từ chỉ việc đến hoặc tới một địa điểm; “đến Ê-phê-sô” tự nhiên và giữ đúng diễn tiến tường thuật.
- source_word: δὲ
  choice: và / còn... thì
  rationale: δέ thứ nhất nối tiếp câu chuyện bằng “và”; δέ thứ hai tạo nét tương phản giữa việc những người kia ở lại và hành động riêng của ông, nên dịch “còn chính ông thì”.
- source_word: κἀκείνους
  choice: hai người ấy
  rationale: Đại từ nghĩa là “và những người ấy”, quy chiếu về Bê-rít-sin và A-qui-la trong câu trước. Dùng “hai người ấy” làm rõ số nhiều theo ngữ cảnh gần mà không chèn tên riêng vào câu.
- source_word: κατέλιπεν
  choice: để ... ở lại
  rationale: Diễn đạt tự nhiên ý để người khác lại tại một nơi; kết hợp với αὐτοῦ thành “để hai người ấy ở lại đó”.
- source_word: αὐτοῦ
  choice: đó
  rationale: Ở đây từ này có chức năng trạng từ địa điểm, chỉ tại Ê-phê-sô.
- source_word: αὐτὸς
  choice: chính ông
  rationale: Giữ sắc thái nhấn mạnh và tương phản của đại từ, không tự ý thêm tên Phao-lô.
- source_word: εἰσελθὼν
  choice: vào
  rationale: Phân từ nêu hành động dẫn vào động từ chính; tiếng Việt tự nhiên dùng động từ nối tiếp “vào ... và”.
- source_word: συναγωγήν
  choice: hội đường
  rationale: Trong bối cảnh Do Thái, từ này chỉ nơi hội họp và thờ phượng của cộng đồng Do Thái; “hội đường” là cách gọi Kinh Thánh quen thuộc và trang trọng.
- source_word: διελέξατο
  choice: trao đổi lý lẽ với
  rationale: Động từ chỉ sự bàn luận, đối thoại có lập luận. Cách dịch này giữ tính tương tác và lý luận, không khiến cuộc trao đổi nhất thiết mang tính tranh cãi đối kháng.
- source_word: τοῖς Ἰουδαίοις
  choice: người Do Thái
  rationale: Dịch trực tiếp danh xưng dân tộc–tôn giáo, không thu hẹp thành các nhà lãnh đạo.
theological_decisions: []
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Cấu trúc “Còn chính ông thì” bảo toàn nét tương phản và nhấn mạnh của nguyên văn. “Trao đổi lý lẽ” giữ được tính đối thoại có lập luận mà không làm câu mang sắc thái đối đầu quá mức.
