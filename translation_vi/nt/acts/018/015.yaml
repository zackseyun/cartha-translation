id: ACT.18.15
reference: Acts 18:15
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἰ δὲ ⸀ζητήματά ἐστιν περὶ λόγου καὶ ὀνομάτων καὶ νόμου τοῦ καθ’ ὑμᾶς, ὄψεσθε αὐτοί· ⸀κριτὴς ἐγὼ τούτων οὐ βούλομαι εἶναι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/015.yaml
  text: But if these are questions about a word and names and your own law[a], you yourselves will see to it; I do not want to be a judge of these things.
translation:
  language: vi
  text: Nhưng nếu đó là những vấn đề về một lời[a], các tên gọi và luật pháp của các ông, thì chính các ông hãy tự lo liệu; tôi không muốn làm thẩm phán trong những việc ấy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “một thông điệp”, “giáo lý” hoặc “sự dạy dỗ”. Từ Hy Lạp λόγος có nghĩa rộng và ở đây có thể chỉ nội dung giảng dạy hoặc thuật ngữ đang bị tranh luận.
    reason: lexical_alternative
lexical_decisions:
- source_word: ζητήματά
  choice: những vấn đề tranh luận
  rationale: Danh từ ζήτημα chỉ vấn đề đang được xem xét hoặc tranh cãi. Cách dịch này giữ sắc thái pháp lý của ngữ cảnh mà không hàm ý mức độ thù địch quá mức.
- source_word: περὶ λόγου
  choice: về một lời
  rationale: λόγος có trường nghĩa rộng, có thể chỉ một lời, thông điệp, giáo huấn hoặc thuật ngữ đang bị tranh luận. Bản dịch sát này giữ sự mơ hồ của nguyên văn; chú thích nêu các khả năng theo ngữ cảnh.
- source_word: ὀνομάτων
  choice: các danh xưng
  rationale: ὀνόματα theo nghĩa đen là 'các tên', nhưng trong ngữ cảnh tranh luận có thể bao gồm tên gọi hoặc tước hiệu. 'Các danh xưng' tự nhiên hơn trong tiếng Việt và vẫn để ngỏ đối tượng quy chiếu.
- source_word: νόμου τοῦ καθ’ ὑμᾶς
  choice: luật pháp riêng của các ông
  rationale: Cụm καθ’ ὑμᾶς xác định luật này là luật liên quan đến phía người Do Thái, không thuộc phạm vi luật dân sự La Mã; 'riêng của các ông' thể hiện thái độ tách mình của Ga-li-ôn.
- source_word: ὄψεσθε αὐτοί
  choice: chính các ông hãy tự giải quyết
  rationale: Thể tương lai trung của ὁράω được dùng theo nghĩa thành ngữ 'tự lo liệu, tự giải quyết'; αὐτοί được thể hiện bằng 'chính các ông'. Mệnh lệnh tự nhiên trong tiếng Việt truyền đạt chức năng ngữ dụng của lời nói.
- source_word: κριτὴς
  choice: thẩm phán xét xử
  rationale: κριτής trong bối cảnh pháp đình là người phân xử. 'Thẩm phán xét xử' làm rõ vai trò tư pháp mà Ga-li-ôn từ chối đảm nhận, không chỉ là người đánh giá nói chung.
- source_word: οὐ βούλομαι εἶναι
  choice: Tôi không muốn làm
  rationale: βούλομαι diễn tả ý muốn hoặc sự sẵn lòng. 'Không muốn làm' là cách nói hiện đại, tự nhiên và không cường điệu thành một tuyên bố pháp lý chính thức.
theological_decisions:
- issue: Phạm vi nghĩa của λόγος trong lời bác bỏ của Ga-li-ôn
  choice: Giữ cách diễn đạt rộng là 'một lời' và thêm chú thích.
  alternative: '''một thông điệp'', ''giáo lý'' hoặc ''sự dạy dỗ'''
  rationale: Nguyên văn không xác định chính xác nội dung của λόγος. Việc không thu hẹp thành một giáo lý cụ thể bảo toàn tính mơ hồ và tránh nhập thêm cách hiểu thần học vào lời của Ga-li-ôn.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và phù hợp bối cảnh pháp đình. Đại từ 'các ông' thể hiện lời Ga-li-ôn nói với nhóm nguyên cáo; câu sau dùng 'chính... tự' để giữ sự nhấn mạnh của αὐτοί. Dấu chấm được dùng thay cho dấu chấm phẩy để câu tiếng Việt rõ và tự nhiên.
