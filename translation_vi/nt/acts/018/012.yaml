id: ACT.18.12
reference: Acts 18:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Γαλλίωνος δὲ ⸂ἀνθυπάτου ὄντος⸃ τῆς Ἀχαΐας κατεπέστησαν ⸂ὁμοθυμαδὸν οἱ Ἰουδαῖοι⸃ τῷ Παύλῳ καὶ ἤγαγον αὐτὸν ἐπὶ τὸ βῆμα,
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/012.yaml
  text: But while Gallio was proconsul of Achaia[a], the Jews rose up together against Paul and brought him before the tribunal[b],
translation:
  language: vi
  text: Nhưng khi Ga-li-ôn làm tổng trấn tỉnh A-chai, người Do Thái[a] đồng lòng nổi lên chống lại Phao-lô và đưa ông ra trước tòa xét xử[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “người Do Thái”; ở đây chỉ những người Do Thái tại địa phương đang hành động chống lại Phao-lô, chứ không phải toàn thể người Do Thái ở mọi nơi.'
    reason: cultural_note
  - marker: b
    text: 'Hoặc: “đến bục xét xử.” Từ Hy Lạp chỉ bục hoặc ghế chính thức nơi quan chức ngồi xét xử.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Γαλλίωνος
  choice: Ga-li-ôn
  rationale: Phiên âm tên riêng theo cách đọc rõ ràng, quen thuộc trong tiếng Việt.
- source_word: δὲ
  choice: Nhưng
  rationale: Đánh dấu bước chuyển của câu chuyện, đồng thời gợi sắc thái tương phản nhẹ với diễn biến trước đó.
- source_word: ἀνθυπάτου ὄντος τῆς Ἀχαΐας
  choice: khi ... làm tổng đốc tỉnh A-chai
  rationale: Diễn đạt tự nhiên kết cấu sở hữu cách tuyệt đối chỉ bối cảnh thời gian; “tổng đốc” là cách gọi dễ hiểu cho chức ἀνθύπατος của tỉnh La Mã, còn “tỉnh” làm rõ A-chai là đơn vị hành chính.
- source_word: κατεπέστησαν
  choice: nổi lên chống lại
  rationale: Giữ sắc thái hành động thù nghịch mà không hàm ý chắc chắn có bạo lực thể chất.
- source_word: ὁμοθυμαδὸν
  choice: đồng lòng
  rationale: Thể hiện hành động nhất trí và phối hợp của cả nhóm, tự nhiên hơn cách dịch sát chữ.
- source_word: οἱ Ἰουδαῖοι
  choice: nhóm người Do Thái
  rationale: Giữ căn tính được nguyên văn nêu ra, đồng thời từ “nhóm” giúp tránh ngộ nhận rằng tất cả người Do Thái đều tham gia; chú thích giải thích rõ phạm vi theo ngữ cảnh.
- source_word: τῷ Παύλῳ
  choice: chống lại Phao-lô
  rationale: Cách diễn đạt tiếng Việt tự nhiên cho đối tượng của hành động thù nghịch trong κατεπέστησαν.
- source_word: ἤγαγον αὐτὸν
  choice: đưa ông
  rationale: Phù hợp bối cảnh pháp lý và không thêm sắc thái cưỡng bức mạnh như “lôi đi” mà nguyên văn không nói rõ.
- source_word: ἐπὶ τὸ βῆμα
  choice: ra trước tòa
  rationale: Truyền đạt rõ chức năng xét xử của βῆμα bằng tiếng Việt hiện đại; chú thích bảo lưu hình ảnh chiếc ghế/bục xét xử chính thức.
theological_decisions:
- issue: Phạm vi chỉ định của οἱ Ἰουδαῖοι trong trình thuật xung đột
  choice: nhóm người Do Thái
  alternative: người Do Thái; các lãnh đạo Do Thái
  rationale: Nguyên văn xác định người Do Thái nhưng không nói riêng các lãnh đạo, nên không thu hẹp thành “các lãnh đạo.” Thêm “nhóm” phù hợp với nhóm người địa phương đang hành động trong biến cố này và ngăn việc quy kết cho toàn thể dân Do Thái.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng các dạng phiên âm Ga-li-ôn, A-chai và Phao-lô; câu văn giữ nhịp kể chuyện cùng sắc thái pháp lý của bối cảnh.
