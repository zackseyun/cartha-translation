revisions:
- from: Nhưng khi Ga-li-ôn làm tổng đốc tỉnh A-chai, nhóm người Do Thái[a] đồng lòng nổi lên chống lại Phao-lô và đưa ông ra trước tòa[b].
  to: Nhưng khi Ga-li-ôn làm tổng trấn tỉnh A-chai, người Do Thái[a] đồng lòng nổi lên chống lại Phao-lô và đưa ông ra trước tòa xét xử[b].
  rationale: Sửa chức danh La Mã để sát ἀνθύπατος hơn; bỏ phần thêm vào trong thân câu mà nguyên văn không nêu; và chỉnh chú thích về βῆμα cho tự nhiên, chính xác hơn. Không thay đổi ý nghĩa, sắc thái xung đột, hay sự mơ hồ về thành phần chính xác của những người Do Thái liên quan.
