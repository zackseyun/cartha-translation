  text: But when they asked him to stay for a longer time[a], he did not consent,
translation:
  language: vi
  text: Nhưng khi họ xin ông ở lại lâu hơn, ông không đồng ý[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “ông không chấp thuận” hoặc “ông khước từ.” Động từ Hy Lạp chỉ việc tán thành hay chấp thuận một lời thỉnh cầu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐρωτώντων
  choice: khi họ xin
  rationale: Phân từ hiện tại trong kết cấu sở hữu cách tuyệt đối được diễn đạt tự nhiên bằng mệnh đề thời gian; “xin” thể hiện đây là một lời đề nghị, không chỉ là câu hỏi.
- source_word: δὲ
  choice: Nhưng
  rationale: 'Diễn tả sự chuyển ý có tính tương phản nhẹ: họ muốn Phao-lô ở lại, nhưng ông không chấp thuận.'
- source_word: αὐτῶν
  choice: họ
  rationale: Đại từ chỉ những người tại Ê-phê-sô đang đưa ra lời đề nghị; tiếng Việt cần nêu rõ chủ thể theo ngữ cảnh.
- source_word: ἐπὶ πλείονα χρόνον
  choice: lâu hơn
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt, giữ được ý so sánh về một khoảng thời gian dài hơn.
- source_word: μεῖναι
  choice: ở lại
  rationale: Phù hợp tự nhiên với bối cảnh hành trình và là bổ ngữ cho lời thỉnh cầu.
- source_word: οὐκ ἐπένευσεν
  choice: ông không đồng ý
  rationale: ἐπινεύω có nghĩa chấp thuận một lời đề nghị. “Không đồng ý” tự nhiên, đồng thời không nhấn mạnh sự khước từ mạnh như “từ chối”.
