  text: βουλομένου δὲ αὐτοῦ διελθεῖν εἰς τὴν Ἀχαΐαν προτρεψάμενοι οἱ ἀδελφοὶ ἔγραψαν τοῖς μαθηταῖς ἀποδέξασθαι αὐτόν· ὃς παραγενόμενος συνεβάλετο πολὺ τοῖς πεπιστευκόσιν διὰ τῆς χάριτος·
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/027.yaml
  text: And when he wanted to go across to Achaia[a], the brothers encouraged him and wrote to the disciples to welcome him. When he arrived[b], he greatly helped those who had believed through grace.
translation:
  language: vi
  text: Khi A-pô-lô muốn sang A-chai, các anh em[a] khích lệ ông và viết thư cho các môn đồ, xin họ tiếp đón ông. Khi đến nơi, ông đã giúp ích rất nhiều cho những người đã tin nhờ ân điển.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Các anh em” có thể chỉ cộng đồng tín hữu rộng hơn, gồm cả phụ nữ, dù tiếng Hy Lạp dùng hình thức giống đực.
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “Nhờ ân điển, ông đã giúp ích rất nhiều cho những người đã tin.” Cụm từ Hy Lạp “nhờ ân điển” có thể bổ nghĩa cho sự giúp ích của A-pô-lô thay vì cho việc họ tin.'
    reason: alternative_reading
lexical_decisions:
- source_word: βουλομένου δὲ αὐτοῦ
  choice: Khi A-pô-lô muốn
  rationale: Kết cấu sở hữu cách tuyệt đối nêu hoàn cảnh và ý định tự nguyện của A-pô-lô. Nêu tên riêng để tiếng Việt rõ chủ thể, vì câu đứng riêng không tự nhiên nếu chỉ dùng “ông” ngay từ đầu.
- source_word: διελθεῖν εἰς τὴν Ἀχαΐαν
  choice: sang xứ A-chai
  rationale: “Sang” diễn đạt tự nhiên sắc thái đi qua từ Ê-phê-sô đến vùng A-chai; “xứ” cho biết đây là một vùng địa lý.
- source_word: προτρεψάμενοι
  choice: khích lệ ông
  rationale: Động từ phân từ chỉ sự động viên, thúc đẩy mang tính hỗ trợ; “khích lệ” vừa tự nhiên vừa tránh sắc thái quá mạnh của “thúc giục”.
- source_word: οἱ ἀδελφοὶ
  choice: các anh em
  rationale: Giữ hình thức giống đực số nhiều của nguyên văn và cách gọi quen thuộc trong cộng đồng Cơ Đốc ban đầu, đồng thời chú thích khả năng từ này chỉ cộng đồng rộng hơn.
- source_word: ἔγραψαν τοῖς μαθηταῖς ἀποδέξασθαι αὐτόν
  choice: viết thư cho các môn đồ ở đó, xin họ tiếp đón ông
  rationale: “Viết thư” phù hợp ngữ cảnh thư giới thiệu; thêm “ở đó” làm rõ người nhận tại A-chai mà không thay đổi nội dung. “Xin họ tiếp đón” truyền đạt tự nhiên nội dung của động từ nguyên mẫu.
- source_word: ὃς παραγενόμενος
  choice: Khi đến nơi, ông
  rationale: Diễn đạt trôi chảy quan hệ thời gian của đại từ quan hệ kèm phân từ và tiếp tục lấy A-pô-lô làm chủ thể.
- source_word: συνεβάλετο πολὺ
  choice: đã giúp đỡ rất nhiều
  rationale: Trong văn cảnh, συμβάλλω trung động nói đến sự trợ giúp đáng kể; cách nói này rõ ràng, hiện đại và tự nhiên.
- source_word: τοῖς πεπιστευκόσιν
  choice: những người ... mà tin
  rationale: Chỉ những người đã đi đến đức tin và hiện ở trong tình trạng ấy. Tiếng Việt không cần đánh dấu rõ thì hoàn thành như tiếng Hy Lạp; ngữ cảnh vẫn cho thấy họ đã tin trước khi A-pô-lô đến.
- source_word: διὰ τῆς χάριτος
  choice: nhờ ân điển
  rationale: “Nhờ” diễn đạt phương tiện hoặc căn nguyên; “ân điển” là thuật ngữ trang trọng nhưng quen thuộc, và không thêm “của Đức Chúa Trời” vì nguyên văn không nói rõ.
theological_decisions:
- issue: Phạm vi bổ nghĩa của διὰ τῆς χάριτος
  choice: 'Gắn với τοῖς πεπιστευκόσιν: “những người nhờ ân điển mà tin.”'
  alternative: 'Gắn với συνεβάλετο πολὺ: “nhờ ân điển, ông đã giúp đỡ rất nhiều cho những người tin.”'
  rationale: Vị trí và cú pháp nghiêng về việc cụm từ mô tả những người đã tin nhờ ân điển, nhưng cách gắn với sự trợ giúp của A-pô-lô vẫn khả dĩ. Bản chính chọn cách hiểu tự nhiên hơn và chú thích cách hiểu còn lại để bảo toàn sự mơ hồ thật của nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng các dạng tên quen thuộc “A-pô-lô” và “A-chai”; giữ “môn đồ,” “anh em,” và “ân điển” vì đây là các thuật ngữ Kinh Thánh rõ nghĩa trong tiếng Việt. Các dấu chú thích được đặt ngay sau phần văn bản liên quan.
