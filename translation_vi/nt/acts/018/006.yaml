  source_fidelity: 'Bản dịch phản ánh đúng các thành tố chính của nguyên văn: sự chống đối, lời nói xúc phạm/phạm thượng với đối tượng không được xác định, cử chỉ giũ áo, công thức trách nhiệm về “máu ... trên đầu”, lời tự tuyên bố vô can, và sự chuyển hướng đến dân ngoại. “Buông lời xúc phạm” bảo toàn sự mơ hồ của βλασφημούντων tốt hơn việc thêm “ông” làm tân ngữ. “Máu của các người đổ lại trên đầu các người” là cách chuyển thành ngữ Kinh Thánh tiếng Việt quen thuộc, giữ hình ảnh và ý nghĩa trách nhiệm mà không biến nó thành lời nguyền rõ rệt.'
