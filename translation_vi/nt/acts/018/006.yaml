  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀντιτασσομένων δὲ αὐτῶν καὶ βλασφημούντων ἐκτιναξάμενος τὰ ἱμάτια εἶπεν πρὸς αὐτούς· Τὸ αἷμα ὑμῶν ἐπὶ τὴν κεφαλὴν ὑμῶν· καθαρὸς ἐγώ· ἀπὸ τοῦ νῦν εἰς τὰ ἔθνη πορεύσομαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/006.yaml
  text: But when they opposed and reviled him, he shook out his garments and said to them, “Your blood be on your own heads. I am innocent. From now on I will go to the Gentiles.”
translation:
  language: vi
  text: 'Nhưng khi họ chống đối và buông lời xúc phạm[a], ông giũ áo mình rồi nói với họ: “Máu của các người đổ lại trên đầu các người[b]! Tôi vô can. Từ nay, tôi sẽ đi đến với dân ngoại[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “nói lời phạm thượng.” Động từ Hy Lạp có thể chỉ lời nói phạm thượng hoặc lời lăng mạ, xúc phạm.'
    reason: lexical_alternative
  - marker: b
    text: “Máu của các người đổ lại trên đầu các người” là thành ngữ nói rằng chính họ phải chịu trách nhiệm về hậu quả.
    reason: cultural_note
  - marker: c
    text: “Dân ngoại” chỉ những người không thuộc dân Do Thái; sát nghĩa hơn có thể dịch là “các dân.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀντιτασσομένων
  choice: chống đối
  rationale: Diễn đạt tự nhiên hành động chủ động chống lại Phao-lô và sứ điệp ông rao giảng.
- source_word: βλασφημούντων
  choice: buông lời xúc phạm
  rationale: Giữ được phạm vi nghĩa về lời lẽ lăng mạ hoặc phạm thượng mà không tự ý thêm một tân ngữ không có trong tiếng Hy Lạp; phương án “nói lời phạm thượng” được ghi ở chú thích.
- source_word: ἐκτιναξάμενος τὰ ἱμάτια
  choice: ông giũ áo mình
  rationale: Diễn đạt gọn, tự nhiên cử chỉ tượng trưng phủi bỏ và tách mình khỏi trách nhiệm, đồng thời bám sát hình ảnh trong nguyên văn.
- source_word: Τὸ αἷμα ὑμῶν ἐπὶ τὴν κεφαλὴν ὑμῶν
  choice: Máu của các người đổ lại trên đầu các người
  rationale: Bảo tồn thành ngữ trang trọng về trách nhiệm đối với hậu quả, thay vì diễn giải thẳng và làm mất hình ảnh của nguyên văn.
- source_word: καθαρὸς ἐγώ
  choice: Tôi vô can
  rationale: Trong ngữ cảnh, καθαρός nói đến việc không còn chịu trách nhiệm hay mắc tội; “vô can” tự nhiên và chính xác hơn cách dịch sát “thanh sạch”.
- source_word: ἀπὸ τοῦ νῦν
  choice: Từ nay
  rationale: Cách nói hiện đại, ngắn gọn, đánh dấu bước chuyển dứt khoát.
- source_word: εἰς τὰ ἔθνη
  choice: đến với dân ngoại
  rationale: Trong sự đối chiếu với thính giả Do Thái tại hội đường, cụm này chỉ những người không thuộc dân Do Thái; “đến với” làm rõ hướng hoạt động truyền giáo của πορεύσομαι mà không diễn giải quá mức.
- source_word: πορεύσομαι
  choice: tôi sẽ đi
  rationale: Thể hiện trực tiếp ý định di chuyển và chuyển hướng sứ vụ trong thì tương lai.
theological_decisions:
- issue: Công thức trách nhiệm “Máu của các người đổ lại trên đầu các người”
  choice: Giữ nguyên hình ảnh như một lời tuyên bố rằng họ phải chịu trách nhiệm về hậu quả, còn Phao-lô vô can.
  alternative: Hiểu đây là một lời nguyền rủa mạnh nhằm giáng họa trên họ.
  rationale: Ngữ cảnh và âm hưởng Kinh Thánh về trách nhiệm của người cảnh giới ủng hộ ý nghĩa tuyên bố miễn trách nhiệm sau khi đã làm chứng trung tín; bản dịch không làm nhẹ thành ngữ nhưng cũng không áp đặt sắc thái nguyền rủa mạnh hơn nguyên văn.
- issue: Đối tượng của βλασφημούντων
  choice: Không thêm tân ngữ; dịch “buông lời xúc phạm”.
  alternative: “Xúc phạm ông” hoặc “nói phạm đến Đức Chúa Trời”.
  rationale: Nguyên văn không nêu rõ đối tượng. Cách dịch giữ sự mơ hồ thật sự, có thể bao hàm lời lăng mạ chống Phao-lô, sứ điệp của ông, hoặc lời phạm thượng.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “các người” trong lời quở trách để truyền tải sắc thái đối đầu mà không quá khẩu ngữ; giữ thành ngữ về máu và đầu nhằm bảo tồn sức nặng tư pháp của câu nói.
