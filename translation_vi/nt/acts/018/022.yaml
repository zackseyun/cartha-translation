id: ACT.18.22
reference: Acts 18:22
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ κατελθὼν εἰς Καισάρειαν, ἀναβὰς καὶ ἀσπασάμενος τὴν ἐκκλησίαν, κατέβη εἰς Ἀντιόχειαν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/022.yaml
  text: And after going down to Caesarea[a], he went up and greeted the church, then went down to Antioch.
translation:
  language: vi
  text: Sau khi đi xuống Sê-sa-rê, ông đi lên, chào thăm hội thánh[a], rồi đi xuống An-ti-ốt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nhiều khả năng đây là hội thánh tại Giê-ru-sa-lem; nhiều bản dịch nêu rõ Giê-ru-sa-lem ở chỗ này, nhưng nguyên văn Hy Lạp không nhắc đến địa danh ấy.
    reason: alternative_reading
lexical_decisions:
- source_word: κατελθὼν
  choice: sau khi đi xuống
  rationale: Diễn đạt phân từ bất định chỉ hành động xảy ra trước, đồng thời giữ hướng chuyển động trong lối kể hành trình của Lu-ca.
- source_word: Καισάρειαν
  choice: Sê-sa-rê
  rationale: Dùng dạng phiên âm quen thuộc trong tiếng Việt; theo ngữ cảnh đây là Sê-sa-rê ven biển.
- source_word: ἀναβὰς
  choice: ông đi lên
  rationale: Giữ nguyên ý chỉ hướng mà không thêm đích đến là Giê-ru-sa-lem, vì bản Hy Lạp không nêu địa danh ấy.
- source_word: ἀσπασάμενος
  choice: chào thăm
  rationale: Trong ngữ cảnh một chuyến ghé thăm cộng đồng, “chào thăm” truyền đạt tự nhiên hành động chào hỏi mà không chuyển thành ý nghĩa rộng hơn như “viếng thăm”.
- source_word: τὴν ἐκκλησίαν
  choice: hội thánh
  rationale: Cách gọi thông dụng và phù hợp ngữ cảnh trong tiếng Việt dành cho cộng đồng tín hữu trong sách Công Vụ.
- source_word: κατέβη
  choice: đi xuống
  rationale: Giữ sắc thái phương hướng và địa hình của động từ Hy Lạp, tương ứng với lối thuật hành trình của Lu-ca.
- source_word: Ἀντιόχειαν
  choice: An-ti-ốt
  rationale: Dùng dạng phiên âm tiếng Việt quen thuộc; ngữ cảnh xác định đây là An-ti-ốt thuộc Sy-ri.
theological_decisions:
- issue: Có nên xác định đích đến hàm ý của cụm “đi lên” là Giê-ru-sa-lem hay không
  choice: Không nêu đích đến trong chính văn
  alternative: Dịch rõ là “ông đi lên Giê-ru-sa-lem”
  rationale: Trình tự từ Sê-sa-rê đi lên, chào hội thánh, rồi đi xuống An-ti-ốt rất có thể hàm ý Giê-ru-sa-lem. Tuy nhiên, nguyên văn Hy Lạp không nêu Giê-ru-sa-lem, nên bản dịch giữ sự hàm ẩn và giải thích trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ các động từ chỉ hướng “đi xuống/đi lên” để phản ánh cách kể địa hình của nguyên văn; dấu phẩy làm rõ chuỗi hành động. Dấu chú thích [a] đặt sau “hội thánh”, là điểm mà địa điểm hàm ý cần được giải thích.
source_grounding:
  english_pob_role: consult_only
