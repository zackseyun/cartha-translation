source:
  edition: SBLGNT
  text: λέγοντες ὅτι Παρὰ τὸν νόμον ⸂ἀναπείθει οὗτος⸃ τοὺς ἀνθρώπους σέβεσθαι τὸν θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/013.yaml
  text: saying[b][a], “This man is persuading people to worship God contrary to the law.”
translation:
  language: vi
  text: 'Họ nói: “Người này đang thuyết phục người ta thờ phượng Đức Chúa Trời trái với luật[a][b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “chống lại luật” hoặc “vi phạm luật”.
    reason: lexical_alternative
  - marker: b
    text: Những người tố cáo rất có thể muốn nói đến luật Do Thái, dù tiếng Hy Lạp chỉ nói “luật”.
    reason: cultural_note
lexical_decisions:
- source_word: λέγοντες ὅτι
  choice: 'họ nói: “…”'
  rationale: Phân từ hiện tại giới thiệu nội dung lời tố cáo; tiếng Việt tự nhiên dùng mệnh đề dẫn trực tiếp, còn ὅτι được thể hiện bằng dấu câu.
- source_word: Παρὰ τὸν νόμον
  choice: trái với luật
  rationale: παρά với đối cách diễn tả sự trái nghịch hoặc vi phạm. Cách dịch này giữ sắc thái pháp lý mà không xác định thêm luật nào.
- source_word: ἀναπείθει
  choice: đang thuyết phục
  rationale: Diễn đạt hành động đang diễn ra trong lời tố cáo và giữ nghĩa tác động, lôi kéo bằng thuyết phục; không thêm sắc thái tiêu cực mạnh như “dụ dỗ” hay “lừa dối”.
- source_word: οὗτος
  choice: Người này
  rationale: Giữ lực chỉ định có phần nhấn mạnh trong lời tố cáo mà không dùng cách gọi miệt thị.
- source_word: τοὺς ἀνθρώπους
  choice: người ta
  rationale: Danh từ số nhiều ở đây chỉ con người nói chung, không riêng nam giới; “người ta” tự nhiên trong cấu trúc tiếng Việt này.
- source_word: σέβεσθαι τὸν θεόν
  choice: thờ phượng Đức Chúa Trời
  rationale: Trong ngữ cảnh tôn giáo, σέβομαι chỉ sự tôn kính được thể hiện qua việc thờ phượng; cách dịch này rõ ràng và trang trọng.
- source_word: τὸν νόμον
  choice: luật
  rationale: Bản Hy Lạp chỉ nói “luật”, không ghi rõ “luật Do Thái” hay “luật của chúng tôi”; dùng từ khái quát để bảo toàn mức độ xác định của nguyên văn.
theological_decisions:
- issue: Đối tượng được gọi là “luật” trong lời tố cáo
  choice: Giữ cách nói khái quát “luật” trong chính văn.
  alternative: luật Do Thái; luật của chúng tôi; Luật Pháp Môi-se
  rationale: Theo ngữ cảnh, những người tố cáo rất có thể muốn nói đến luật Do Thái, nhưng nguyên văn chỉ có τὸν νόμον. Không đưa sự giải thích theo ngữ cảnh vào chính văn giúp bảo toàn tính hàm ẩn của câu.
- issue: Phạm vi của ἀνθρώπους
  choice: người ta
  alternative: những người đàn ông; mọi người
  rationale: Từ này mang nghĩa chỉ con người nói chung trong câu, chứ không giới hạn theo giới tính; “người ta” truyền đạt đúng phạm vi mà không cường điệu thành “mọi người”.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Đức Chúa Trời” được dùng làm cách gọi tôn kính dành cho θεός; “luật” được giữ ở dạng khái quát để tránh giải nghĩa quá mức thành Luật Pháp Môi-se hoặc luật La Mã.
