id: ACT.18.5
reference: Acts 18:5
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ὡς δὲ κατῆλθον ἀπὸ τῆς Μακεδονίας ὅ τε Σιλᾶς καὶ ὁ Τιμόθεος, συνείχετο τῷ ⸀λόγῳ ὁ Παῦλος, διαμαρτυρόμενος τοῖς Ἰουδαίοις ⸀εἶναι τὸν χριστὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/005.yaml
  text: But when Silas and Timothy came down from Macedonia[a], Paul was occupied with the word[b], solemnly testifying to the Jews that Jesus is the Messiah.
translation:
  language: vi
  text: Nhưng khi Si-la và Ti-mô-thê từ Ma-xê-đô-ni-a xuống, Phao-lô chuyên tâm vào lời[a], long trọng làm chứng với người Do Thái rằng Giê-su là Đấng Mê-si-a[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “được lời thôi thúc” hoặc “miệt mài với sứ điệp.” Động từ Hy Lạp có thể diễn tả việc bị thôi thúc, bị cuốn vào hoặc chuyên tâm làm một việc.'
    reason: lexical_alternative
  - marker: b
    text: Tiếng Hy Lạp là “Christos,” nghĩa là “đấng được xức dầu.” Ở đây từ này là một tước hiệu, nên được dịch là “Đấng Mê-si-a.”
    reason: alternative_reading
lexical_decisions:
- source_word: Ὡς δὲ
  choice: Nhưng khi
  rationale: Diễn đạt cả chức năng chuyển ý của δέ và ý nghĩa thời gian của ὡς bằng lối nói tự nhiên trong tiếng Việt.
- source_word: κατῆλθον ἀπὸ τῆς Μακεδονίας
  choice: từ Ma-xê-đô-ni-a xuống
  rationale: Giữ hình ảnh chuyển động ‘đi xuống’ của κατέρχομαι, phù hợp với lối tường thuật hành trình của Lu-ca.
- source_word: ὅ τε Σιλᾶς καὶ ὁ Τιμόθεος
  choice: Si-la và Ti-mô-thê
  rationale: Nêu rõ hai người cùng đến mà không thêm từ ngữ nặng nề; cấu trúc tiếng Việt tự nhiên vẫn truyền đạt chủ thể kép.
- source_word: συνείχετο
  choice: chuyên tâm
  rationale: Diễn đạt việc Phao-lô bị cuốn vào và dành trọn tâm sức cho hoạt động này, nhưng không quyết đoán quá mức rằng ông bị một sức mạnh bên ngoài cưỡng thúc.
- source_word: τῷ λόγῳ
  choice: vào lời
  rationale: Giữ từ ‘lời’ tương ứng trực tiếp với λόγος và phản ánh cách Lu-ca dùng từ này để chỉ lời rao truyền; chú thích nêu những cách hiểu khả dĩ của cả cụm.
- source_word: διαμαρτυρόμενος
  choice: long trọng làm chứng
  rationale: Giữ cả ý làm chứng và sắc thái nhấn mạnh, nghiêm túc của διαμαρτύρομαι.
- source_word: τοῖς Ἰουδαίοις
  choice: với người Do Thái
  rationale: Trong ngữ cảnh này, từ chỉ cộng đồng Do Thái theo nghĩa dân tộc–tôn giáo, không chỉ riêng cư dân Giu-đê.
- source_word: εἶναι τὸν χριστὸν Ἰησοῦν
  choice: rằng Giê-su là Đấng Mê-si-a
  rationale: Cấu trúc vị ngữ xác nhận Giê-su chính là vị Mê-si-a được mong đợi; trật tự tiếng Việt này rõ ràng và tự nhiên.
theological_decisions:
- issue: Χριστός được hiểu là tước hiệu hay như một phần của tên gọi
  choice: Đấng Mê-si-a
  alternative: Đấng Ki-tô
  rationale: Trong lời công bố cho người Do Thái, Χριστός có mạo từ và làm vị ngữ, nên chức năng tước hiệu Mê-si-a nổi bật. Cách dịch này giữ rõ nội dung về vị được xức dầu mà không biến tước hiệu thành tên riêng.
- issue: Sắc thái của συνείχετο τῷ λόγῳ
  choice: chuyên tâm vào lời
  alternative: được lời thôi thúc; miệt mài với sứ điệp
  rationale: Ngữ pháp có thể gợi ý Phao-lô bị lời thúc bách hoặc hoàn toàn bị cuốn vào việc rao truyền. Bản chính dùng cách diễn đạt trung tính hơn và chú thích bảo lưu các sắc thái khả dĩ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng các dạng tên quen thuộc trong Kinh Thánh tiếng Việt; giữ ‘lời’ để phản ánh thuật ngữ của nguyên bản, đồng thời dùng chú thích nhằm tránh che khuất tính đa nghĩa của cụm Hy Lạp.
