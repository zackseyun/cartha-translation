base_translation:
  language: en
  yaml_path: translation/nt/acts/018/004.yaml
  text: And he was reasoning in the synagogue every Sabbath and persuading Jews and Greeks[a][b][c].
translation:
  language: vi
  text: Mỗi ngày Sa-bát, ông đều biện luận[a] trong hội đường và thuyết phục[b] người Do Thái lẫn người Hy Lạp[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “thảo luận” hoặc “tranh luận.” Động từ Hy Lạp có thể chỉ sự đối thoại bằng lý lẽ hoặc sự tranh biện.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “cố thuyết phục.” Dạng động từ Hy Lạp có thể nhấn mạnh nỗ lực đang tiếp diễn, chứ không nhất thiết nói rằng ông đã thuyết phục được họ.
    reason: lexical_alternative
  - marker: c
    text: Trong bối cảnh hội đường, từ này có thể chỉ những người Hy Lạp có liên hệ với hội đường; một số người hiểu theo nghĩa rộng hơn là “dân ngoại.”
    reason: alternative_reading
lexical_decisions:
- source_word: διελέγετο
  choice: biện luận
  rationale: Động từ ở thì chưa hoàn thành diễn tả hoạt động lặp lại hoặc kéo dài; “biện luận” truyền đạt việc trao đổi bằng lý lẽ, đồng thời vẫn có thể bao hàm thảo luận hay tranh luận.
- source_word: δὲ
  choice: không dịch riêng
  rationale: δέ là từ nối nhẹ để tiếp diễn câu chuyện; trật tự và nhịp câu tiếng Việt đã thể hiện sự tiếp nối tự nhiên mà không cần thêm “và” hay “bấy giờ”.
- source_word: ἐν τῇ συναγωγῇ
  choice: trong hội đường
  rationale: Cách dịch trực tiếp ý nghĩa chỉ nơi chốn của ἐν với cách dữ.
- source_word: κατὰ πᾶν σάββατον
  choice: mỗi ngày Sa-bát
  rationale: Diễn đạt tự nhiên ý nghĩa phân phối “vào mỗi Sa-bát” và phù hợp với hành động có tính lặp lại.
- source_word: ἔπειθέν
  choice: thuyết phục
  rationale: Động từ ở thì chưa hoàn thành mô tả nỗ lực hoặc hoạt động đang tiếp diễn; bản văn không tự nó khẳng định mọi người nghe đều đã bị thuyết phục thành công.
- source_word: τε
  choice: và… lẫn
  rationale: Trong tiếng Việt, cấu trúc “và… lẫn…” nối hành động với hai nhóm đối tượng một cách tự nhiên.
- source_word: Ἰουδαίους
  choice: người Do Thái
  rationale: Chỉ nhóm dân tộc-tôn giáo Do Thái trong ngữ cảnh sách Công Vụ, không chỉ riêng cư dân Giu-đê.
- source_word: Ἕλληνας
  choice: người Hy Lạp
  rationale: Giữ nguyên danh xưng cụ thể của nguyên văn, không khái quát hóa thành “dân ngoại” hoặc thêm đặc điểm “kính sợ Đức Chúa Trời” mà câu này không nói rõ.
theological_decisions:
- issue: Danh tính của Ἕλληνας trong bối cảnh hội đường
  choice: người Hy Lạp
  alternative: dân ngoại; những người Hy Lạp kính sợ Đức Chúa Trời
  rationale: Nguyên văn chỉ gọi họ là người Hy Lạp. Bối cảnh có thể cho thấy họ liên hệ với hội đường, nhưng không đủ căn cứ để đưa một phân loại tôn giáo cụ thể vào chính văn.
- issue: Kết quả của hành động ἔπειθέν
  choice: thuyết phục, kèm chú thích về sắc thái đang tiếp diễn
  alternative: cố thuyết phục; đã thuyết phục được
  rationale: Thì chưa hoàn thành nhấn mạnh hoạt động kéo dài hoặc lặp lại nhưng không nhất thiết xác định kết quả. Chính văn tự nhiên được giữ gọn, còn chú thích bảo tồn độ mở này.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ông” theo mạch kể để chỉ Phao-lô; “hội đường” và “ngày Sa-bát” là các thuật ngữ Kinh Thánh quen thuộc. Câu tiếng Việt đưa cụm thời gian lên đầu để diễn đạt tự nhiên tính lặp lại của hai động từ ở thì chưa hoàn thành.
