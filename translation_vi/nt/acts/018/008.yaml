id: ACT.18.8
reference: Acts 18:8
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Κρίσπος δὲ ὁ ἀρχισυνάγωγος ἐπίστευσεν τῷ κυρίῳ σὺν ὅλῳ τῷ οἴκῳ αὐτοῦ, καὶ πολλοὶ τῶν Κορινθίων ἀκούοντες ἐπίστευον καὶ ἐβαπτίζοντο.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/008.yaml
  text: But Crispus[a], the synagogue ruler, believed in the Lord together with his whole household, and many of the Corinthians, hearing, were believing and were being baptized.
translation:
  language: vi
  text: Nhưng Cơ-rít-pu, người đứng đầu hội đường, đã tin Chúa cùng với cả nhà mình. Nhiều người Cô-rinh-tô, khi nghe, tin và chịu báp-têm.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Các động từ “tin” và “chịu báp-têm” trong tiếng Hy Lạp ở thì chưa hoàn thành, diễn tả sự đáp ứng như một diễn tiến đang tiếp tục hoặc lặp lại. Cũng có thể dịch: “Nhiều người Cô-rinh-tô, khi nghe, đã tin và chịu báp-têm.”'
    reason: Giải thích sắc thái của ἐπίστευον và ἐβαπτίζοντο mà không đưa vào bản văn chính ý tuần tự không có trong nguyên ngữ.
lexical_decisions:
- source_word: Κρίσπος
  choice: Cơ-rít-pu
  rationale: Phiên âm tên riêng Hy Lạp theo lối viết dễ đọc và quen thuộc trong tiếng Việt.
- source_word: ἀρχισυνάγωγος
  choice: người đứng đầu hội đường
  rationale: Diễn đạt tự nhiên vai trò lãnh đạo chính của hội đường mà không xác định quá mức các chi tiết hành chính.
- source_word: ἐπίστευσεν τῷ κυρίῳ
  choice: đã tin Chúa
  rationale: Diễn đạt trực tiếp động từ ở thì aorist cùng bổ ngữ cách dữ; tiếng Việt 'tin Chúa' tự nhiên và vẫn giữ tước hiệu 'Chúa' như nguyên văn, không tự ý thêm 'Giê-su'.
- source_word: σὺν ὅλῳ τῷ οἴκῳ αὐτοῦ
  choice: cùng với cả nhà mình
  rationale: '''Cả nhà'' là cách nói tiếng Việt tự nhiên về toàn thể gia đình hoặc gia hộ, không khiến người đọc hiểu nhầm là căn nhà vật chất.'
- source_word: πολλοὶ τῶν Κορινθίων
  choice: nhiều người Cô-rinh-tô
  rationale: 'Chuyển ngữ tự nhiên cấu trúc sở thuộc mang nghĩa bộ phận: nhiều người trong dân thành Cô-rinh-tô.'
- source_word: ἀκούοντες
  choice: khi nghe
  rationale: Thể hiện phân từ hiện tại chỉ hành động đồng thời, đồng thời giữ nguyên việc nguyên văn không nêu rõ đối tượng được nghe.
- source_word: ἐπίστευον καὶ ἐβαπτίζοντο
  choice: cũng lần lượt tin và chịu báp-têm
  rationale: '''Lần lượt'' giúp biểu đạt diễn tiến hoặc sự đáp ứng lặp lại của nhiều người trong các động từ chưa hoàn thành; ''chịu báp-têm'' là cách nói tự nhiên trong tiếng Việt và giữ ý tiếp nhận hành động ở thể bị động.'
theological_decisions:
- issue: Phạm vi đức tin của 'cả nhà mình'
  choice: Giữ nguyên cách mô tả mang tính gia hộ, không giải thích mỗi thành viên đã tin theo cùng một cách như thế nào.
  alternative: Khẳng định rõ từng thành viên đều tự mình tin, hoặc hiểu câu chỉ nói về gia hộ như một đơn vị tập thể.
  rationale: Nguyên văn nói Cơ-rít-pu tin cùng với cả nhà nhưng không trình bày cơ chế tham dự của từng người; bản dịch không nên áp đặt kết luận hệ phái về đức tin hay phép báp-têm của gia đình.
- issue: Đối tượng của tước hiệu κύριος
  choice: Dịch là 'Chúa' mà không mở rộng thành 'Chúa Giê-su'.
  alternative: Chúa Giê-su
  rationale: Ngữ cảnh sách Công Vụ cho thấy tước hiệu này chỉ về Chúa Giê-su, nhưng chính câu Hy Lạp chỉ dùng κύριος; bản dịch giữ hình thức của nguyên văn.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Dùng 'hội đường' cho συναγωγή, 'cả nhà' cho gia hộ, và 'chịu báp-têm' để tránh cách bị động nặng nề trong tiếng Việt. Dấu chú thích được đặt sau mệnh đề mà chú thích trực tiếp giải thích.
