    rationale: ἀνήχθη trong ngữ cảnh này nghĩa là ra khơi/nhổ neo. “Ra khơi từ Ê-phê-sô” vừa tự nhiên vừa sát nghĩa hàng hải hơn, không nhấn thêm động tác bước xuống thuyền.
