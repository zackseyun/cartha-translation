    rationale: “Đức Chúa Trời muốn vậy” không tương ứng tự nhiên với τοῦ θεοῦ θέλοντος / “God willing.” Cần thay bằng một công thức tiếng Việt thành ngữ hơn, vẫn giữ rõ ý muốn của Đức Chúa Trời.
  - severity: low
