  text: ⸂ἀλλὰ ἀποταξάμενος καὶ⸃ ⸀εἰπών· ⸀Πάλιν ἀνακάμψω πρὸς ὑμᾶς τοῦ θεοῦ θέλοντος ἀνήχθη ἀπὸ τῆς Ἐφέσου,
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/021.yaml
  text: but after taking leave and saying[a], “I will return to you again[b], if God wills,” he set sail from Ephesus.
translation:
  language: vi
  text: 'Nhưng sau khi từ biệt và nói[a]: “Tôi sẽ trở lại với anh em, nếu Đức Chúa Trời muốn,”[b] ông ra khơi từ Ê-phê-sô.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Một số thủ bản không có các lời “và nói: ‘Tôi sẽ trở lại với anh em, nếu Đức Chúa Trời muốn.’”'
    reason: textual_variant
  - marker: b
    text: 'Cũng có thể dịch: “Đức Chúa Trời muốn thì.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Nhưng
  rationale: Đánh dấu sự tương phản với lời đề nghị trước đó rằng Phao-lô ở lại lâu hơn.
- source_word: ἀποταξάμενος
  choice: sau khi từ biệt
  rationale: Diễn đạt tự nhiên phân từ trung gian bất định chỉ việc chào từ biệt trước khi ra đi.
- source_word: καὶ εἰπών
  choice: và nói
  rationale: Giữ trình tự phân từ của nguyên văn, đồng thời phù hợp với cú pháp tiếng Việt.
- source_word: Πάλιν ἀνακάμψω πρὸς ὑμᾶς
  choice: Tôi sẽ trở lại với anh em
  rationale: Diễn đạt ý quay lại nơi những người nghe; trong tiếng Việt, “trở lại” đã bao hàm nghĩa πάλιν nên không cần thêm “một lần nữa”.
- source_word: τοῦ θεοῦ θέλοντος
  choice: nếu Đức Chúa Trời muốn
  rationale: Giữ rõ tính điều kiện của kết cấu sở hữu cách độc lập và danh xưng θεός, không đổi thành “Chúa”.
- source_word: ἀνήχθη
  choice: ông xuống thuyền rời
  rationale: Trong văn cảnh hành trình đường biển, động từ mang nghĩa khởi hành bằng thuyền; cách nói này tự nhiên trong tiếng Việt và kết nối rõ với điểm xuất phát.
- source_word: ἀπὸ τῆς Ἐφέσου
  choice: rời Ê-phê-sô
  rationale: Diễn đạt rõ nơi xuất phát; dùng dạng phiên âm Kinh Thánh quen thuộc trong tiếng Việt.
theological_decisions:
- issue: Sự lệ thuộc của kế hoạch hành trình vào ý muốn của Đức Chúa Trời
  choice: nếu Đức Chúa Trời muốn
  alternative: Đức Chúa Trời cho phép / nếu Chúa muốn
  rationale: Nguyên văn nói rõ θεός và trình bày kế hoạch như tùy thuộc vào ý muốn của Đức Chúa Trời; bản dịch không thay danh xưng hay giải thích thêm bản chất của ý muốn ấy.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “anh em” cho đại từ số nhiều ὑμᾶς trong lời trực tiếp; dùng “ông” cho nhân vật được ngữ cảnh xác định là Phao-lô. Hai dấu chú thích đều xuất hiện trong chính văn.
