  rationale: Chỉnh chú thích b để diễn đạt tự nhiên công thức “God willing” trong tiếng Việt mà không đổi chủ thể θεός hay ý điều kiện. Chỉnh động từ hàng hải thành “ra khơi từ” để phản ánh sát và trôi chảy nghĩa ἀνήχθη ἀπὸ τῆς Ἐφέσου. Giữ nguyên mốc chú thích và nội dung biến thể theo hồ sơ kiểm chứng tiếng Anh.
