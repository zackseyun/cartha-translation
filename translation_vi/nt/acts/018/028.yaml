id: ACT.18.28
reference: Acts 18:28
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εὐτόνως γὰρ τοῖς Ἰουδαίοις διακατηλέγχετο δημοσίᾳ ἐπιδεικνὺς διὰ τῶν γραφῶν εἶναι τὸν χριστὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/028.yaml
  text: For he powerfully refuted the Jews in public[b][a], demonstrating through the Scriptures that Jesus is the Messiah.
translation:
  language: vi
  text: Vì ông mạnh mẽ biện bác với người Do Thái cách công khai, dùng Kinh Thánh để chứng minh rằng Giê-su là Đấng Mê-si[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Đấng Mê-si chính là Giê-su.” Cấu trúc nguyên ngữ cho phép trình bày theo cả hai trật tự.'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “Đấng Christos”, nghĩa là “Đấng được xức dầu”; ở đây được dịch là “Đấng Mê-si” vì từ này được dùng như một tước hiệu.'
    reason: alternative_reading
lexical_decisions:
- source_word: εὐτόνως
  choice: mạnh mẽ
  rationale: Diễn đạt cường độ và sức thuyết phục của việc biện bác, đồng thời tự nhiên trong tiếng Việt hiện đại.
- source_word: διακατηλέγχετο
  choice: bác lại
  rationale: Động từ chỉ việc biện bác kỹ lưỡng và chứng minh phía đối diện sai. “Bác lại” tự nhiên hơn “bác bỏ những người” trong tiếng Việt; thể chưa hoàn thành được để ngữ cảnh thuật chuyện chuyển tải.
- source_word: τοῖς Ἰουδαίοις
  choice: những người Do Thái
  rationale: Giữ cách gọi nhóm người trong nguyên văn mà không tự ý giới hạn họ thành một nhóm đối thủ cụ thể hơn.
- source_word: δημοσίᾳ
  choice: trước công chúng
  rationale: Nêu rõ việc biện bác diễn ra công khai.
- source_word: ἐπιδεικνὺς
  choice: chứng minh
  rationale: Thể hiện tính lập luận và bằng chứng của hành động, đồng thời nối tự nhiên với phương tiện là Kinh Thánh.
- source_word: διὰ τῶν γραφῶν
  choice: dùng Kinh Thánh
  rationale: διά với sở hữu cách chỉ phương tiện; cách dịch này rõ ràng và tự nhiên trong tiếng Việt.
- source_word: τὸν χριστόν
  choice: Đấng Mê-si
  rationale: Χριστός ở đây là tước hiệu chỉ Đấng được xức dầu đã được hứa, không phải phần tên riêng.
- source_word: Ἰησοῦν
  choice: Chúa Giê-su
  rationale: Dùng dạng tên gọi quen thuộc, trang trọng trong tiếng Việt Cơ Đốc; “Chúa” là kính xưng tự nhiên trong văn phong Kinh Thánh tiếng Việt.
- source_word: εἶναι τὸν χριστὸν Ἰησοῦν
  choice: rằng Chúa Giê-su là Đấng Mê-si
  rationale: Trật tự này tự nhiên trong tiếng Việt, nhưng cấu trúc nguyên ngữ cũng có thể được hiểu và trình bày theo chiều nhận diện “Đấng Mê-si chính là Chúa Giê-su”; sự linh hoạt ấy được giữ trong chú thích.
theological_decisions:
- issue: Cách dịch Χριστός
  choice: Đấng Mê-si
  alternative: Đấng Ki-tô
  rationale: Trong câu này từ ngữ hoạt động như một tước hiệu gắn với lập luận từ Kinh Thánh Do Thái; “Đấng Mê-si” làm rõ chức năng ấy mà không biến nó thành tên riêng.
- issue: Quan hệ vị ngữ trong εἶναι τὸν χριστὸν Ἰησοῦν
  choice: Chúa Giê-su là Đấng Mê-si
  alternative: Đấng Mê-si chính là Chúa Giê-su
  rationale: Cả hai cách đều có thể biểu đạt mệnh đề nguyên ngữ. Bản chính chọn trật tự tự nhiên hơn trong tiếng Việt và ghi nhận cách còn lại trong chú thích để không xóa bỏ độ linh hoạt cú pháp.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu giữ liên từ “Vì” để phản ánh γάρ và mối liên hệ giải thích với câu trước. “Bác lại” tránh lối nói thiếu tự nhiên “bác bỏ những người”, còn “dùng Kinh Thánh để chứng minh” diễn đạt rõ quan hệ phương tiện của phân từ.
