  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu Hy Lạp dài được tách thành ba câu tiếng Việt để lời kể tự nhiên mà vẫn giữ đủ các đặc điểm mô tả A-bô-lô. Chú thích bảo toàn tính đa nghĩa thực sự của λόγιος.
