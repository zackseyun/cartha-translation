base_translation:
  language: en
  yaml_path: translation/nt/acts/018/024.yaml
  text: A certain Jew named Apollos[a], an Alexandrian by birth, an eloquent man, arrived in Ephesus, being mighty in the Scriptures.
translation:
  language: vi
  text: Có một người Do Thái tên là A-bô-lô, quê ở Alexandria, đến Ê-phê-sô. Ông là người có tài hùng biện[a] và rất thông thạo Kinh Thánh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “người uyên bác”; từ Hy Lạp λόγιος có thể chỉ tài hùng biện hoặc học thức.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰουδαῖος δέ τις
  choice: Có một người Do Thái
  rationale: τις giới thiệu một nhân vật mới với sắc thái bất định; “có một” diễn đạt tự nhiên trong tiếng Việt. δέ đánh dấu chuyển tiếp nhẹ trong lời kể và không cần dịch bằng một từ nối riêng. Ἰουδαῖος ở đây chỉ căn tính dân tộc-tôn giáo, nên dịch là “người Do Thái”.
- source_word: Ἀπολλῶς ὀνόματι
  choice: tên là A-bô-lô
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt để giới thiệu tên một người; phiên âm giữ hình thức tên quen thuộc trong văn phong Kinh Thánh tiếng Việt.
- source_word: Ἀλεξανδρεὺς τῷ γένει
  choice: quê ở Alexandria
  rationale: Cụm từ nói đến nguồn gốc hoặc nơi xuất thân. “Quê ở” tự nhiên, tránh hàm ý hiện đại dễ gây hiểu lầm của “chủng tộc”, đồng thời giữ địa danh ở dạng quốc tế dễ nhận biết.
- source_word: ἀνὴρ λόγιος
  choice: Ông là người có tài hùng biện
  rationale: ἀνήρ chỉ A-bô-lô là một người nam; đại từ “ông” phù hợp và tự nhiên. λόγιος có thể chỉ tài ăn nói hoặc học thức; bản chính chọn nghĩa “có tài hùng biện”, còn nghĩa kia được ghi ở chú thích.
- source_word: κατήντησεν εἰς Ἔφεσον
  choice: Ông đến Ê-phê-sô
  rationale: καταντάω ở đây nói đến việc tới một địa điểm. “Đến Ê-phê-sô” ngắn gọn và tự nhiên.
- source_word: δυνατὸς ὢν ἐν ταῖς γραφαῖς
  choice: và rất thông thạo Kinh Thánh
  rationale: δυνατός diễn tả năng lực nổi bật; trong kết cấu với “Kinh Thánh”, “rất thông thạo” truyền đạt rõ ý rằng ông có kiến thức và khả năng sử dụng Kinh Thánh. γραφαί trong bối cảnh Do Thái chỉ các sách thánh nên viết “Kinh Thánh”.
