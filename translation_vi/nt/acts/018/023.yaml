    rationale: Nên dùng “Phry-gi” thay cho “Phư-ry-gi”, vì đây là dạng quen thuộc và nhất quán hơn trong tiếng Việt Kinh Thánh hiện đại. Đây là chỉnh sửa hình thức, không thay đổi nghĩa.
  - severity: low
    issue: Dấu chú thích trong bản tiếng Anh audit được neo sau “there”, nhưng nội dung chú thích lại giải thích καθεξῆς.
    rationale: Bản tiếng Việt đã đặt neo đúng sau “lần lượt”. Cần lưu ý sự không khớp này trong audit tiếng Anh, nhưng không cần chuyển neo tiếng Việt.
  revised_text: Sau khi ở lại đó một thời gian, ông lên đường, lần lượt[a] đi qua miền Ga-la-ti và Phry-gi, làm vững mạnh tất cả các môn đồ.
