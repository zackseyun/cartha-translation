reference: Acts 18:23
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ποιήσας χρόνον τινὰ ἐξῆλθεν, διερχόμενος καθεξῆς τὴν Γαλατικὴν χώραν καὶ Φρυγίαν, ⸀στηρίζων πάντας τοὺς μαθητάς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/023.yaml
  text: And after spending some time there[a], he departed and traveled from place to place through the Galatian region and Phrygia, strengthening all the disciples.
translation:
  language: vi
  text: Sau khi ở lại đó một thời gian, ông lên đường, lần lượt[a] đi qua miền Ga-la-ti và Phry-gi, làm vững mạnh tất cả các môn đồ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “theo thứ tự” hoặc “nối tiếp nhau.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιήσας χρόνον τινά
  choice: sau khi ở lại đó một thời gian
  rationale: Thành ngữ ποιέω + χρόνον có nghĩa là ở hoặc trải qua một khoảng thời gian. “Đó” được bổ sung theo văn cảnh, chỉ địa điểm vừa được nhắc đến, giúp câu tiếng Việt tự nhiên mà không làm thay đổi ý.
- source_word: ἐξῆλθεν
  choice: ông lên đường
  rationale: Trong văn thuật hành trình, động từ này diễn tả việc rời nơi đang ở để bắt đầu chuyến đi. “Lên đường” tự nhiên trong tiếng Việt và phù hợp với diễn tiến câu chuyện.
- source_word: διερχόμενος
  choice: đi qua
  rationale: Phân từ này mô tả hành động di chuyển xuyên qua các vùng; “đi qua” vừa sát nghĩa vừa tự nhiên.
- source_word: καθεξῆς
  choice: lần lượt
  rationale: Từ này chỉ sự tiến hành nối tiếp theo trình tự. “Lần lượt” giữ được ý tuần tự mà không xác định một lộ trình chi tiết hơn điều nguyên văn nói.
- source_word: τὴν Γαλατικὴν χώραν
  choice: miền Ga-la-ti
  rationale: χώρα chỉ miền, vùng hoặc lãnh thổ. “Miền Ga-la-ti” giữ sắc thái địa lý rộng, không buộc người đọc hiểu đây chỉ là tên kỹ thuật của một tỉnh La Mã.
- source_word: καὶ Φρυγίαν
  choice: và Phư-ry-gi
  rationale: Tên địa danh được phiên âm theo lối quen dùng trong tiếng Việt; trong cấu trúc câu, ý “miền/vùng” cũng được hiểu là áp dụng cho Phư-ry-gi.
- source_word: στηρίζων
  choice: làm vững mạnh
  rationale: στηρίζω có nghĩa làm cho vững vàng, củng cố hoặc thêm sức. “Làm vững mạnh” giữ được hành động hỗ trợ liên tục mà không thu hẹp nó vào riêng sự khích lệ hay sự xác lập giáo lý.
- source_word: πάντας τοὺς μαθητάς
  choice: tất cả các môn đồ
  rationale: “Môn đồ” là cách gọi rõ ràng, quen thuộc dành cho những người theo Chúa Giê-su trong sách Công Vụ; “tất cả” thể hiện đầy đủ πάντας.
theological_decisions: []
translation_notes:
  register: Bản dịch dùng tiếng Việt hiện đại, trang trọng và dễ hiểu. Đại từ “ông” tiếp nối chủ thể Phao-lô từ văn cảnh; địa danh được phiên âm là “Ga-la-ti” và “Phư-ry-gi.” Dấu chú thích được đặt ngay sau “lần lượt,” là từ tương ứng với καθεξῆς.
