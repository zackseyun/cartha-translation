- from: 'Ban đêm, Chúa phán với Phao-lô qua một khải tượng[a]: “Đừng sợ, nhưng hãy tiếp tục nói và đừng im lặng,”'
  to: 'Vào một đêm, Chúa phán với Phao-lô qua một khải tượng[a]: “Đừng sợ, nhưng hãy tiếp tục nói và đừng im lặng,”'
  rationale: Chỉ thay «Ban đêm» bằng «Vào một đêm» để phản ánh tự nhiên và chính xác hơn thời điểm của hành động trong câu thuật sự. Các lựa chọn còn lại được giữ nguyên vì bảo toàn phương tiện của khải tượng, lực mệnh lệnh, và tước hiệu «Chúa».
