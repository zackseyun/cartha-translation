  text: εἶπεν δὲ ὁ κύριος ⸂ἐν νυκτὶ δι’ ὁράματος⸃ τῷ Παύλῳ· Μὴ φοβοῦ, ἀλλὰ λάλει καὶ μὴ σιωπήσῃς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/009.yaml
  text: And the Lord said to Paul in the night through a vision[a], “Do not be afraid, but keep speaking and do not be silent,”
translation:
  language: vi
  text: 'Vào một đêm, Chúa phán với Phao-lô qua một khải tượng[a]: “Đừng sợ, nhưng hãy tiếp tục nói và đừng im lặng,”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “trong một khải tượng.” Cụm từ Hy Lạp sát nghĩa là “qua một khải tượng.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ κύριος
  choice: Chúa
  rationale: Giữ nguyên tước hiệu trong tiếng Hy Lạp; trong văn mạch Công Vụ, từ này tự nhiên chỉ về Chúa phục sinh, nhưng không thêm tên Giê-su khi nguyên văn không nêu.
- source_word: ἐν νυκτὶ
  choice: Ban đêm
  rationale: Diễn đạt thời gian tự nhiên trong tiếng Việt hiện đại, tương ứng với nghĩa “trong/giữa đêm” của cụm Hy Lạp.
- source_word: δι’ ὁράματος
  choice: qua một khải tượng
  rationale: διά với sở hữu cách biểu thị phương tiện; “qua” bảo toàn sắc thái ấy, còn “khải tượng” phù hợp với một sự mặc khải được thấy.
- source_word: Μὴ φοβοῦ
  choice: Đừng sợ
  rationale: Mệnh lệnh phủ định được diễn đạt ngắn gọn, tự nhiên và đúng lực trong tiếng Việt.
- source_word: ἀλλὰ λάλει
  choice: nhưng hãy tiếp tục nói
  rationale: “Tiếp tục nói” thể hiện thể chưa hoàn thành của mệnh lệnh hiện tại λάλει, nhấn mạnh hành động đang tiếp diễn.
- source_word: καὶ μὴ σιωπήσῃς
  choice: và đừng im lặng
  rationale: Cách nói tự nhiên, giữ nguyên vế cấm song song với mệnh lệnh tiếp tục nói.
theological_decisions:
- issue: Đối tượng được gọi là ὁ κύριος
  choice: Chúa
  alternative: Chúa Giê-su
  rationale: Nguyên văn chỉ ghi ὁ κύριος. Dù trong Công Vụ tước hiệu này thường chỉ Chúa Giê-su, bản dịch không thêm sự định danh mà câu này không nói rõ, nhờ đó giữ nguyên sức nặng thần học và mức độ tường minh của nguyên văn.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “Phao-lô” theo lối phiên âm Kinh Thánh quen thuộc; dấu hai chấm dẫn lời trực tiếp. “Khải tượng” phân biệt với giấc mơ và giữ sắc thái mặc khải của ὅραμα.
