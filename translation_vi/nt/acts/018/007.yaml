source:
  edition: SBLGNT
  text: καὶ μεταβὰς ἐκεῖθεν ⸀εἰσῆλθεν εἰς οἰκίαν τινὸς ὀνόματι ⸀Τιτίου Ἰούστου σεβομένου τὸν θεόν, οὗ ἡ οἰκία ἦν συνομοροῦσα τῇ συναγωγῇ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/007.yaml
  text: And after leaving there[a], he entered the house of a man named Titius Justus, who worshiped God[b], whose house was next to the synagogue.
translation:
  language: vi
  text: Rời nơi đó, ông vào nhà một người tên là Ti-ti-u Giúc-tu, người thờ phượng Đức Chúa Trời[a]. Nhà ông liền kề với hội đường[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “người kính sợ Đức Chúa Trời” hoặc “người tôn kính Đức Chúa Trời.” Cụm tiếng Hy Lạp mô tả sự sùng kính đối với Đức Chúa Trời; trong bối cảnh này, có thể gợi một người không phải Do Thái gắn bó với sự thờ phượng Đức Chúa Trời của Israel.'
    reason: lexical_alternative
  - marker: b
    text: Hay “tiếp giáp với” hoặc “chung ranh giới với hội đường.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μεταβὰς ἐκεῖθεν
  choice: Rời nơi đó
  rationale: 'Diễn đạt tự nhiên trình tự của phân từ bất định μεταβὰς cùng trạng từ ἐκεῖθεν: ông rời địa điểm vừa được nhắc đến rồi mới vào nhà.'
- source_word: εἰσῆλθεν εἰς οἰκίαν τινὸς
  choice: ông vào nhà một người
  rationale: Giữ rõ hành động đi vào và sắc thái bất định của τινός, đồng thời dùng trật tự từ tự nhiên trong tiếng Việt.
- source_word: ὀνόματι Τιτίου Ἰούστου
  choice: tên là Ti-ti-u Giúc-tu
  rationale: Dùng cách giới thiệu tên tự nhiên và dạng phiên âm quen thuộc, dễ đọc trong tiếng Việt.
- source_word: σεβομένου τὸν θεόν
  choice: người thờ phượng Đức Chúa Trời
  rationale: σέβομαι mô tả lòng sùng kính và việc thờ phượng Đức Chúa Trời; cách dịch này rõ nghĩa mà không biến cụm từ thành một nhãn phân loại xã hội-tôn giáo quá chuyên biệt.
- source_word: συνομοροῦσα
  choice: liền kề với
  rationale: Từ này chỉ hai nơi tiếp giáp hoặc chung ranh giới; “liền kề với” vừa chính xác vừa trang trọng, tự nhiên.
- source_word: τῇ συναγωγῇ
  choice: hội đường
  rationale: Cách gọi ngắn gọn, thông dụng cho nơi hội họp và thờ phượng của người Do Thái trong bối cảnh này.
theological_decisions:
- issue: Ý nghĩa của σεβόμενος τὸν θεόν khi mô tả Ti-ti-u Giúc-tu
  choice: người thờ phượng Đức Chúa Trời
  alternative: người kính sợ Đức Chúa Trời; người tôn kính Đức Chúa Trời
  rationale: Nguyên văn cho thấy ông là người ngoại bang sùng kính Đức Chúa Trời của Israel, nhưng không buộc phải hiểu đây là một danh xưng kỹ thuật. Bản dịch chính giữ cách mô tả rộng và trung tính; chú thích bảo tồn các sắc thái khả dĩ.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Câu dài của tiếng Hy Lạp được tách thành hai câu tiếng Việt để tránh chuỗi mệnh đề quan hệ nặng nề, nhưng vẫn giữ rõ nhà của Ti-ti-u Giúc-tu là nhà liền kề hội đường.
