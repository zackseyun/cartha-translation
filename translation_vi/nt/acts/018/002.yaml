id: ACT.18.2
reference: Acts 18:2
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ εὑρών τινα Ἰουδαῖον ὀνόματι Ἀκύλαν, Ποντικὸν τῷ γένει, προσφάτως ἐληλυθότα ἀπὸ τῆς Ἰταλίας καὶ Πρίσκιλλαν γυναῖκα αὐτοῦ διὰ τὸ ⸀διατεταχέναι Κλαύδιον χωρίζεσθαι πάντας τοὺς Ἰουδαίους ⸀ἀπὸ τῆς Ῥώμης, προσῆλθεν αὐτοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/002.yaml
  text: And he found a Jew named Aquila[a], a native of Pontus, who had recently come from Italy with Priscilla his wife because Claudius had ordered all the Jews to leave Rome; and he went to them.
translation:
  language: vi
  text: Ông gặp một người Do Thái tên là A-qui-la, quê ở vùng Pôn-tơ, mới cùng vợ là Pơ-rít-xin từ I-ta-li-a đến, vì Cơ-lau-đi-út đã ra lệnh cho tất cả người Do Thái phải rời khỏi Rô-ma[a]. Ông đến với họ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “bị trục xuất khỏi Rô-ma.” Nguyên văn Hy Lạp nói theo nghĩa đen về việc bị tách khỏi Rô-ma.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὑρών
  choice: gặp
  rationale: Phân từ bất định quá khứ dẫn vào hành động tiếp theo của Phao-lô; “gặp” tự nhiên trong lời kể tiếng Việt và không hàm ý ông đang tìm kiếm họ.
- source_word: τινα Ἰουδαῖον
  choice: một người Do Thái
  rationale: Diễn đạt trực tiếp căn tính dân tộc–tôn giáo của cá nhân được giới thiệu.
- source_word: ὀνόματι Ἀκύλαν
  choice: tên là A-qui-la
  rationale: Thành ngữ giới thiệu tên người, được chuyển sang cách nói tiếng Việt tự nhiên.
- source_word: Ποντικὸν τῷ γένει
  choice: quê ở xứ Pông
  rationale: Cụm từ chỉ nguồn gốc địa lý; “quê ở” rõ ràng, tự nhiên và không nhất thiết khẳng định nơi sinh theo nghĩa hẹp.
- source_word: προσφάτως ἐληλυθότα ἀπὸ τῆς Ἰταλίας
  choice: mới từ I-ta-li-a đến
  rationale: Giữ ý hành động đến vừa xảy ra trước đó và vẫn liên quan đến hoàn cảnh hiện tại.
- source_word: καὶ Πρίσκιλλαν γυναῖκα αὐτοῦ
  choice: cùng vợ là Pơ-rít-xin
  rationale: Καί nối Pơ-rít-xin vào việc từ I-ta-li-a đến; “cùng vợ” thể hiện quan hệ đồng hành một cách gọn và tự nhiên.
- source_word: διὰ τὸ διατεταχέναι Κλαύδιον
  choice: vì Cơ-lau-đi-út đã ra lệnh
  rationale: Διά với động từ nguyên mẫu có mạo từ chỉ nguyên nhân; διατάσσω trong bối cảnh này là một mệnh lệnh chính thức.
- source_word: χωρίζεσθαι πάντας τοὺς Ἰουδαίους ἀπὸ τῆς Ῥώμης
  choice: tất cả người Do Thái phải rời khỏi Rô-ma
  rationale: Giữ ý cốt lõi là bị tách khỏi Rô-ma theo lệnh hoàng đế; “phải rời khỏi” tự nhiên hơn trong tiếng Việt và tránh khẳng định quá mức phương thức trục xuất.
- source_word: προσῆλθεν αὐτοῖς
  choice: Ông đến gặp họ
  rationale: Động từ chỉ việc Phao-lô đi đến chỗ họ; thêm “gặp” tạo câu tiếng Việt tự nhiên mà vẫn giữ chuyển động hướng đến họ.
theological_decisions:
- issue: Cách dịch Ἰουδαῖον / Ἰουδαίους
  choice: người Do Thái
  alternative: người Giu-đê
  rationale: Trong ngữ cảnh sắc lệnh tại Rô-ma, từ này chỉ cộng đồng Do Thái theo căn tính dân tộc–tôn giáo, không chỉ người xuất thân từ miền Giu-đê.
- issue: Mức độ cưỡng chế trong χωρίζεσθαι ἀπὸ τῆς Ῥώμης
  choice: phải rời khỏi Rô-ma
  alternative: bị trục xuất khỏi Rô-ma
  rationale: Nguyên văn nói theo nghĩa đen về việc bị tách khỏi Rô-ma. Bối cảnh mệnh lệnh cho thấy sự bắt buộc, nhưng “bị trục xuất” diễn giải mạnh và cụ thể hơn chính động từ Hy Lạp, nên được giữ ở chú thích.
translation_notes:
  register: 'Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Dùng dạng phiên âm tiếng Việt có gạch nối cho tên riêng: A-qui-la, Pơ-rít-xin, I-ta-li-a, Cơ-lau-đi-út, Rô-ma; “xứ Pông” giúp người đọc nhận ra đây là địa danh cổ. Đại từ “ông” trong câu cuối quy chiếu về Phao-lô theo ngữ cảnh trước đó.'
