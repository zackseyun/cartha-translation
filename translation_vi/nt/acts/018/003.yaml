  verdict: revise
  source_fidelity: Bản dịch giữ được quan hệ nguyên nhân của διὰ τὸ ὁμότεχνον εἶναι, ý ở cùng họ của ἔμενεν παρ’ αὐτοῖς, và việc lao động của ἠργάζετο. Tuy nhiên, “may lều” thu hẹp hành động làm/sản xuất lều vào việc khâu may, trong khi σκηνοποιοί chỉ người làm lều; mệnh đề cuối cũng nên phản ánh trực tiếp rằng đó là nghề của họ.
  naturalness: “Vì cùng nghề với họ” tự nhiên, gọn, và xác định rõ Phao-lô là người cùng nghề. “Người làm lều theo nghề” là cách nói hiện đại, rõ nghĩa hơn “nghề của họ là may lều.”
  terminology: Dùng “người làm lều” cho σκηνοποιοί, không áp đặt vật liệu hay công đoạn sản xuất. Chú thích giữ khả năng nghĩa rộng liên quan đến nghề da, nhưng không trình bày như nghĩa chắc chắn.
  issues:
