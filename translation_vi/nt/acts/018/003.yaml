    issue: “May lều” thu hẹp nghĩa của σκηνοποιοί.
    rationale: Từ Hy Lạp chỉ người làm/sản xuất lều, không riêng người khâu lều. “Người làm lều” bảo toàn phạm vi nghĩa tốt hơn.
  - severity: low
    issue: Chú thích hiện dùng cụm “cùng làm nghề thuộc da,” dễ khiến người đọc liên hệ sai với cụm “cùng làm một nghề” được đánh dấu.
    rationale: Chú thích nhằm nêu khả năng từ σκηνοποιοί có thể chỉ nghề da hoặc nghề liên quan, không phải nói rằng cụm ὁμότεχνον có nghĩa “cùng làm nghề thuộc da.”
