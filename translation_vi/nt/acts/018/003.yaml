source:
  edition: SBLGNT
  text: καὶ διὰ τὸ ὁμότεχνον εἶναι ἔμενεν παρ’ αὐτοῖς καὶ ⸀ἠργάζετο, ἦσαν γὰρ σκηνοποιοὶ ⸂τῇ τέχνῃ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/003.yaml
  text: And because he was of the same trade[a], he stayed with them and worked, for they were tentmakers by trade.
translation:
  language: vi
  text: Vì cùng nghề với họ[a], Phao-lô ở lại với họ và làm việc, vì họ là người làm lều theo nghề.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể hiểu là “người làm nghề thuộc da”; thuật ngữ Hy Lạp này có thể chỉ người làm lều hoặc người làm việc với da trong một nghề liên quan.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τὸ ὁμότεχνον εἶναι
  choice: Vì cùng làm một nghề
  rationale: Cấu trúc διά với động từ nguyên mẫu có mạo từ diễn tả nguyên nhân; ὁμότεχνος chỉ việc có chung nghề hoặc nghề thủ công. Cách dịch này tự nhiên trong tiếng Việt và chưa nói trước nghề cụ thể.
- source_word: ἔμενεν παρ’ αὐτοῖς
  choice: ở lại với họ
  rationale: μένω trong văn cảnh này chỉ việc Phao-lô lưu lại và sống cùng A-qui-la và Bê-rít-sin; “ở lại với họ” rõ ràng và tự nhiên.
- source_word: ἠργάζετο
  choice: làm việc
  rationale: ἐργάζομαι ở đây nói đến việc lao động trong nghề thủ công. “Làm việc” chuyển tải nghĩa trực tiếp mà không cường điệu sắc thái.
- source_word: σκηνοποιοὶ
  choice: may lều
  rationale: σκηνοποιός theo nghĩa truyền thống và có khả năng cao nhất là người làm lều. Trong tiếng Việt, “may lều” diễn đạt tự nhiên hoạt động nghề nghiệp này; khả năng chỉ rộng hơn đến nghề làm đồ da được giữ trong chú thích.
- source_word: τῇ τέχνῃ
  choice: nghề của họ là
  rationale: τέχνη chỉ nghề thủ công hoặc nghề nghiệp. Cách diễn đạt này làm rõ rằng làm lều là nghề thường xuyên của họ, không phải một công việc nhất thời.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “cùng làm một nghề” để giữ quan hệ nguyên nhân; dùng “may lều” thay vì danh từ nghề nghiệp nặng nề hơn, đồng thời bảo tồn độ rộng từ vựng qua chú thích.
