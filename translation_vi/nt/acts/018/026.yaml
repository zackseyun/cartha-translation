  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οὗτός τε ἤρξατο παρρησιάζεσθαι ἐν τῇ συναγωγῇ· ἀκούσαντες δὲ αὐτοῦ ⸂Πρίσκιλλα καὶ Ἀκύλας⸃ προσελάβοντο αὐτὸν καὶ ἀκριβέστερον αὐτῷ ἐξέθεντο τὴν ⸂ὁδὸν τοῦ θεοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/026.yaml
  text: And he began to speak boldly in the synagogue. But when Priscilla and Aquila heard him[a], they took him aside and explained the way of God to him more accurately.
translation:
  language: vi
  text: Ông bắt đầu mạnh dạn lên tiếng trong hội đường. Khi Priscilla và Aquila nghe ông, họ đưa ông ra riêng[a] và giải thích cho ông đường lối của Đức Chúa Trời một cách chính xác hơn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “họ đón ông đến với mình,” “họ đưa ông đi cùng,” hoặc “họ đón tiếp ông.” Động từ Hy Lạp có thể mang nghĩa tiếp nhận một người hoặc đưa người ấy đến với mình.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτός τε
  choice: Ông
  rationale: Đại từ chỉ Apollos trong văn cảnh trước; tiếng Việt tự nhiên dùng “ông”, còn lực nối nhẹ của τέ không cần biểu thị riêng vì mạch kể đã rõ.
- source_word: ἤρξατο παρρησιάζεσθαι
  choice: bắt đầu mạnh dạn giảng luận
  rationale: Giữ ý khởi đầu và lời nói công khai, tự tin. “Giảng luận” phù hợp với hoạt động trong hội đường mà không thu hẹp nội dung thành một bài giảng chính thức.
- source_word: ἐν τῇ συναγωγῇ
  choice: trong hội đường
  rationale: “Hội đường” là cách gọi tiếng Việt quen thuộc cho nơi nhóm họp của người Do Thái.
- source_word: ἀκούσαντες δὲ αὐτοῦ
  choice: Khi Priscilla và Aquila nghe ông
  rationale: Phân từ được hiểu theo thời gian; δέ chỉ bước chuyển nhẹ trong câu chuyện nên tiếng Việt không nhất thiết phải thêm “nhưng”.
- source_word: Πρίσκιλλα καὶ Ἀκύλας
  choice: Priscilla và Aquila
  rationale: Phiên dạng tên riêng quen thuộc, đồng thời giữ đúng thứ tự của bản Hy Lạp.
- source_word: προσελάβοντο αὐτὸν
  choice: họ đưa ông về với mình
  rationale: Cách dịch giữ nét nghĩa tiếp nhận hoặc đưa đến với mình của động từ, phù hợp với việc chỉ dẫn riêng sau đó mà không quả quyết quá mức rằng họ chỉ kéo ông sang một bên.
- source_word: ἀκριβέστερον
  choice: một cách chính xác hơn
  rationale: 'Giữ rõ sắc thái so sánh của trạng từ: lời giải thích đem lại mức độ chính xác cao hơn.'
- source_word: ἐξέθεντο
  choice: giải thích
  rationale: Động từ thể trung ở đây có nghĩa trình bày hoặc giải thích; “giải thích” rõ ràng và tự nhiên trong tiếng Việt hiện đại.
- source_word: τὴν ὁδὸν τοῦ θεοῦ
  choice: con đường của Đức Chúa Trời
  rationale: Giữ nguyên hình ảnh và kết cấu sở hữu của nguyên văn, không diễn giải quá mức thành một hệ thống giáo lý cụ thể.
- source_word: αὐτῷ
  choice: cho ông
  rationale: Biểu thị tự nhiên đối tượng tiếp nhận lời giải thích trong tiếng Việt.
theological_decisions:
- issue: Hành động của Priscilla và Aquila đối với Apollos
  choice: đưa ông về với mình để chỉ dẫn thêm
  alternative: đưa ông ra riêng; đón tiếp ông; đưa ông đi cùng
  rationale: προσελάβοντο có thể mang nghĩa tiếp nhận, đưa theo hoặc kéo riêng ra. “Đưa ông về với mình” giữ được tính thân thiện và bối cảnh chỉ dẫn riêng, trong khi chú thích bảo lưu các khả năng từ vựng khác.
- issue: Ý nghĩa của “con đường của Đức Chúa Trời”
  choice: giữ nguyên cách diễn đạt rộng của bản văn
  alternative: sứ điệp cứu rỗi của Đức Chúa Trời; nếp sống đạo đức theo ý Đức Chúa Trời; toàn bộ đức tin Cơ Đốc
  rationale: Trong văn cảnh, cụm từ có thể chỉ sứ điệp hoặc đường lối Cơ Đốc mà Apollos cần hiểu chính xác hơn, nhưng câu không định nghĩa phạm vi; bản dịch không áp đặt một cách giải thích hẹp.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “ông” cho Apollos để kể chuyện tự nhiên; “Đức Chúa Trời” và “hội đường” theo cách dùng Kinh Thánh tiếng Việt phổ biến. Chú thích được đặt ngay sau mệnh đề có từ ngữ đa nghĩa.
