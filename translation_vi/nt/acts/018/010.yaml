id: ACT.18.10
reference: Acts 18:10
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: διότι ἐγώ εἰμι μετὰ σοῦ καὶ οὐδεὶς ἐπιθήσεταί σοι τοῦ κακῶσαί σε, διότι λαός ἐστί μοι πολὺς ἐν τῇ πόλει ταύτῃ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/010.yaml
  text: because I am with you[a], and no one will attack you to harm you[b], because I have many people in this city.
translation:
  language: vi
  text: vì chính Ta ở cùng con, và sẽ không ai tấn công con để làm hại con[a], vì Ta có nhiều người trong thành này[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “sẽ không ai ra tay chống lại con để làm hại con.”'
    reason: lexical_alternative
  - marker: b
    text: “Ta có nhiều người trong thành này” có lẽ nói đến nhiều người tại Cô-rinh-tô thuộc về Chúa, kể cả những người rồi sẽ tin.
    reason: cross_reference
lexical_decisions:
- source_word: διότι
  choice: vì
  rationale: Giữ rõ quan hệ nguyên nhân; từ này xuất hiện hai lần, lần đầu nêu lý do cho mệnh lệnh ở câu trước và lần sau nêu lý do cho lời bảo đảm.
- source_word: ἐγώ εἰμι μετὰ σοῦ
  choice: chính Ta ở cùng con
  rationale: “Chính Ta” thể hiện sự nhấn mạnh của đại từ ἐγώ; “ở cùng con” chuyển tải trực tiếp lời bảo đảm về sự hiện diện. Đại từ Ta–con phù hợp với ngữ cảnh Chúa phán trực tiếp với Phao-lô.
- source_word: οὐδεὶς
  choice: không ai
  rationale: Cách diễn đạt tự nhiên và trực tiếp cho chủ thể phủ định.
- source_word: ἐπιθήσεταί σοι
  choice: sẽ tấn công con
  rationale: Trong ngữ cảnh này, động từ với tân ngữ gián tiếp chỉ hành động thù địch nhắm vào Phao-lô. “Tấn công” rõ nghĩa và tự nhiên, không giới hạn hành động vào việc chạm tay theo nghĩa đen.
- source_word: τοῦ κακῶσαί σε
  choice: để làm hại con
  rationale: Giữ chức năng chỉ mục đích hoặc kết quả của cấu trúc động từ nguyên mẫu có mạo từ, đồng thời bao quát tổn hại thể chất và các dạng ngược đãi khác.
- source_word: λαός
  choice: người
  rationale: Trong cụm “nhiều người”, từ này diễn tả một tập thể những người thuộc về Đấng đang phán mà không buộc tiếng Việt phải dùng danh từ số ít “một dân” thiếu tự nhiên trong cấu trúc này.
- source_word: ἐστί μοι
  choice: Ta có
  rationale: Cấu trúc εἰμί với tặng cách μοι diễn tả sự sở hữu; “Ta có” là cách chuyển tự nhiên và chính xác trong tiếng Việt.
- source_word: πολὺς
  choice: nhiều
  rationale: Giữ trực tiếp ý nghĩa số lượng của tính từ bổ nghĩa cho λαός.
- source_word: ἐν τῇ πόλει ταύτῃ
  choice: trong thành này
  rationale: “Thành” là cách gọi tự nhiên, trang trọng vừa phải cho một đô thị như Cô-rinh-tô; “này” giữ nguyên ý của đại từ chỉ định.
theological_decisions:
- issue: Ý nghĩa của “nhiều người” trong thành
  choice: Giữ nguyên lời khẳng định “Ta có nhiều người trong thành này”, cho phép hiểu đó là những người tại Cô-rinh-tô thuộc về Chúa, kể cả những người rồi sẽ tin.
  alternative: Có thể hiểu rộng hơn là trong thành đã có nhiều người có thiện cảm với Phao-lô hoặc sẵn sàng ủng hộ ông.
  rationale: Ngôn ngữ về một “dân” thuộc về Chúa trong bối cảnh Kinh Thánh thường hàm ý sự thuộc về Ngài, và lời này làm nền cho việc Phao-lô tiếp tục rao giảng. Tuy nhiên, bản văn không giải thích thời điểm hay cách thức họ trở thành dân Ngài, nên bản dịch chính không thu hẹp câu theo một hệ thống thần học riêng.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Ta–con” vì đây là lời Chúa trực tiếp phán với Phao-lô; viết hoa “Ta” để nhận diện người phán theo ngữ cảnh, không nhằm thêm một khẳng định thần học ngoài bản văn. Hai dấu chú thích được đặt ngay sau các cụm mà chúng giải thích.
