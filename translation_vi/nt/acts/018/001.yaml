id: ACT.18.1
reference: Acts 18:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸀Μετὰ ταῦτα ⸀χωρισθεὶς ἐκ τῶν Ἀθηνῶν ἦλθεν εἰς Κόρινθον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/001.yaml
  text: After this[a], he left Athens and went to Corinth.
translation:
  language: vi
  text: Sau đó[a], ông rời A-thên và đi đến Cô-rinh-tô.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát hơn: “Sau những việc ấy, sau khi rời khỏi A-thên, ông đến Cô-rinh-tô.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: Sau đó
  rationale: Cụm từ chuyển tiếp theo thời gian trong lời kể; “Sau đó” tự nhiên trong tiếng Việt hiện đại và vẫn giữ rõ trình tự sự việc.
- source_word: χωρισθεὶς
  choice: ông rời
  rationale: Phân từ thụ động bất định của χωρίζω ở đây được dùng theo nghĩa rời khỏi một nơi. “Ông rời” diễn đạt tự nhiên, không ép cấu trúc thụ động xa lạ trong tiếng Việt.
- source_word: ἐκ τῶν Ἀθηνῶν
  choice: A-thên
  rationale: ἐκ biểu thị điểm xuất phát; kết hợp với “rời”, tiếng Việt tự nhiên dùng địa danh làm bổ ngữ trực tiếp, nên ý “từ A-thên” vẫn được bảo toàn.
- source_word: ἦλθεν
  choice: đi đến
  rationale: Dù động từ có thể được dịch là “đến”, trong mạch kể về việc di chuyển từ A-thên tới một thành khác, “đi đến” làm rõ hướng di chuyển và tự nhiên trong tiếng Việt.
- source_word: εἰς Κόρινθον
  choice: đến Cô-rinh-tô
  rationale: εἰς chỉ sự chuyển động tới một địa điểm; “đến Cô-rinh-tô” là cách diễn đạt thông dụng cho hành trình giữa các thành.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện trang trọng vừa phải, rõ ràng và tự nhiên đối với độc giả tiếng Việt hiện đại. Đại từ “ông” giữ chủ thể ngôi thứ ba vốn được hàm ẩn trong động từ Hy Lạp và dựa vào ngữ cảnh liền trước.
