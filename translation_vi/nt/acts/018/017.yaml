reference: Acts 18:17
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐπιλαβόμενοι δὲ ⸀πάντες Σωσθένην τὸν ἀρχισυνάγωγον ἔτυπτον ἔμπροσθεν τοῦ βήματος· καὶ οὐδὲν τούτων τῷ Γαλλίωνι ⸀ἔμελεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/017.yaml
  text: Then they all seized Sosthenes[a], the synagogue ruler, and beat him in front of the tribunal. But Gallio paid no attention to these things.
translation:
  language: vi
  text: Bấy giờ, tất cả họ bắt lấy Sốt-then[a], người lãnh đạo hội đường, và đánh ông trước tòa án. Nhưng Ga-li-ôn chẳng bận tâm đến những việc ấy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Một số thủ bản ghi “tất cả người Hy Lạp” thay vì chỉ nói “tất cả họ”. Bản văn có chứng cứ sớm hơn ngắn hơn và không xác định nhóm người này là ai.
    reason: textual_variant
lexical_decisions:
- source_word: ἐπιλαβόμενοι
  choice: túm lấy
  rationale: Diễn tả hành động mạnh tay khống chế một người và tự nhiên dẫn sang việc hành hung; sát nghĩa 'nắm lấy, bắt lấy' trong ngữ cảnh thù địch.
- source_word: πάντες
  choice: tất cả họ đều
  rationale: Giữ sức khái quát của πάντες nhưng không tự ý xác định họ là người Hy Lạp hay người Do Thái.
- source_word: ἀρχισυνάγωγον
  choice: người quản lý hội đường
  rationale: Chỉ người giữ vai trò lãnh đạo, điều hành hội đường; cách nói này rõ nghĩa đối với độc giả hiện đại mà không phóng đại thành một chức danh tôn giáo khác.
- source_word: ἔτυπτον
  choice: đánh
  rationale: Thì chưa hoàn thành có thể gợi hành động đang tiếp diễn hoặc lặp lại; trong tiếng Việt, 'rồi đánh ông' tự nhiên và không nhất thiết giới hạn hành động ở một cú đánh.
- source_word: ἔμπροσθεν τοῦ βήματος
  choice: ngay trước tòa án
  rationale: βῆμα trong bối cảnh này là nơi xét xử hoặc bục xét xử của quan; 'tòa án' truyền đạt rõ khung cảnh pháp lý, còn 'ngay trước' giữ sắc thái vị trí trực diện.
- source_word: οὐδὲν τούτων ... ἔμελεν
  choice: chẳng bận tâm gì đến những việc ấy
  rationale: Chuyển tự nhiên thành ngữ Hy Lạp chỉ việc những điều ấy không phải là mối quan tâm của Ga-li-ôn, đồng thời giữ sắc thái thờ ơ.
- source_word: δέ
  choice: Bấy giờ
  rationale: Đánh dấu bước chuyển trong mạch kể theo lối văn trang trọng, tự nhiên.
- source_word: καί
  choice: Nhưng
  rationale: Làm rõ sự tương phản theo ngữ cảnh giữa cảnh hành hung trước tòa và thái độ không can thiệp của Ga-li-ôn.
theological_decisions:
- issue: Danh tính của πάντες ('tất cả')
  choice: Để chủ thể không được xác định là 'tất cả họ đều'.
  alternative: Xác định họ là 'tất cả người Hy Lạp' hoặc 'tất cả người Do Thái'.
  rationale: Bản văn SBLGNT chỉ có πάντες, không nêu danh tính của nhóm. Bản dịch giữ nguyên sự mơ hồ chân thực ấy; chú thích ghi nhận dị bản dài hơn.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Phiên âm tên riêng theo lối quen dùng trong Kinh Thánh tiếng Việt. Câu văn giữ sự mơ hồ của chủ thể πάντες và sắc thái thờ ơ của Ga-li-ôn.
