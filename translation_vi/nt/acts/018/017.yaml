    issue: «người quản lý hội đường» thu hẹp nghĩa của ἀρχισυνάγωγος.
    rationale: Từ Hy Lạp chỉ người đứng đầu/lãnh đạo hội đường, không chỉ người thực hiện công việc quản trị.
  - severity: low
    issue: «túm lấy» hơi khẩu ngữ.
    rationale: Dù đúng ý hành động mạnh tay, «bắt lấy» phù hợp hơn với văn phong trang trọng, hiện đại của bản dịch.
