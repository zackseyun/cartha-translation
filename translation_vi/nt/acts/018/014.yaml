source:
  edition: SBLGNT
  text: μέλλοντος δὲ τοῦ Παύλου ἀνοίγειν τὸ στόμα εἶπεν ὁ Γαλλίων πρὸς τοὺς Ἰουδαίους· Εἰ ⸀μὲν ἦν ἀδίκημά τι ἢ ῥᾳδιούργημα πονηρόν, ὦ Ἰουδαῖοι, κατὰ λόγον ἂν ἀνεσχόμην ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/014.yaml
  text: But as Paul was about to open his mouth[a], Gallio said to the Jews, “If it were some wrongdoing or a serious crime, O Jews[c][b], I would reasonably put up with you.
translation:
  language: vi
  text: 'Nhưng khi Phao-lô sắp mở miệng nói[a], Ga-li-ôn nói với những người Do Thái: “Hỡi những người Do Thái, nếu đây là một hành vi sai trái hay một tội ác xấu xa[b], thì tôi có lý do chính đáng để chịu nghe các ông[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn là “sắp mở miệng”, một thành ngữ có nghĩa là sắp bắt đầu nói.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “một hành vi phạm pháp độc ác” hoặc “một tội ác hiểm độc”. Cụm từ Hy Lạp kết hợp một từ chỉ hành vi phạm pháp với một tính từ nghĩa là “xấu” hoặc “độc ác”.
    reason: lexical_alternative
  - marker: c
    text: Hay “thì tôi có lý do chính đáng để chịu đựng các ông”. Trong bối cảnh này, lời ấy có nghĩa là Ga-li-ôn sẽ có lý do chính đáng để kiên nhẫn nghe vụ kiện của họ.
    reason: lexical_alternative
lexical_decisions:
- source_word: μέλλοντος ... τοῦ Παύλου ἀνοίγειν τὸ στόμα
  choice: khi Phao-lô sắp mở miệng nói
  rationale: Cấu trúc sở hữu cách tuyệt đối với μέλλω và động từ nguyên mẫu diễn tả hành động sắp xảy ra. “Mở miệng nói” vừa giữ hình ảnh của thành ngữ Hy Lạp vừa tự nhiên trong tiếng Việt.
- source_word: δὲ
  choice: Nhưng
  rationale: 'Liên từ đánh dấu bước chuyển có sắc thái tương phản nhẹ: Phao-lô sắp lên tiếng thì Ga-li-ôn nói trước.'
- source_word: Γαλλίων
  choice: Ga-li-ôn
  rationale: Phiên âm tên riêng theo cách đọc gần với dạng Hy Lạp và quy ước tên Kinh Thánh tiếng Việt.
- source_word: πρὸς τοὺς Ἰουδαίους
  choice: nói với những người Do Thái
  rationale: πρός trong ngữ cảnh động từ nói chỉ đối tượng được nói với; không thêm ý diễn giải “những người tố cáo” vốn không có trực tiếp trong câu.
- source_word: Εἰ μὲν ἦν
  choice: nếu đây là
  rationale: Diễn đạt tự nhiên tiền đề điều kiện; μέν không cần dịch riêng nhưng góp phần chuẩn bị cho vế đối lập tiếp theo trong mạch văn.
- source_word: ἀδίκημά τι
  choice: một hành vi sai trái
  rationale: ἀδίκημα chỉ một việc làm sai hoặc hành vi vi phạm trong khung cảnh pháp lý, nhưng không xác định cụ thể loại vi phạm.
- source_word: ῥᾳδιούργημα πονηρόν
  choice: một tội ác xấu xa
  rationale: Cụm từ kết hợp danh từ chỉ hành vi phạm pháp với tính từ mang nghĩa xấu ác. Cách dịch giữ cả sắc thái pháp lý lẫn sự đánh giá đạo đức mà không giảm thành chỉ mức độ “nghiêm trọng”.
- source_word: ὦ Ἰουδαῖοι
  choice: Hỡi những người Do Thái
  rationale: “Hỡi” thể hiện tiểu từ xưng hô ὦ và giọng điệu trang trọng, trực tiếp; “những người Do Thái” tự nhiên hơn “hỡi người Do Thái” trong tiếng Việt hiện đại.
- source_word: κατὰ λόγον
  choice: có lý do
  rationale: Thành ngữ mang nghĩa “có lý”, “hợp lý” hoặc “có lý do chính đáng”; kết hợp tự nhiên với mệnh đề điều kiện và động từ theo sau.
- source_word: ἀνεσχόμην ὑμῶν
  choice: nhẫn nại nghe các ông
  rationale: ἀνέχομαι có nghĩa chịu đựng hoặc nhẫn nại với ai. Trong bối cảnh xét xử, điều Ga-li-ôn chịu nghe là lời khiếu kiện của họ; “nhẫn nại nghe” làm rõ hàm ý ngữ cảnh nhưng vẫn giữ giọng hơi thiếu thiện cảm.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu giữ sắc thái pháp lý cùng giọng thiếu kiên nhẫn của Ga-li-ôn. Đại từ “tôi–các ông” phù hợp lời một quan chức nói với một nhóm người; tên riêng được phiên âm theo lối quen thuộc trong Kinh Thánh tiếng Việt.
