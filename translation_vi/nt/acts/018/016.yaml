  text: καὶ ἀπήλασεν αὐτοὺς ἀπὸ τοῦ βήματος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/016.yaml
  text: And he drove them away from the judgment seat[a].
translation:
  language: vi
  text: Rồi ông đuổi họ khỏi tòa án[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “khỏi bục xét xử”; từ Hy Lạp βῆμα chỉ bục hoặc ghế chính thức nơi quan chức ngồi xét xử, và cũng có thể chỉ tòa xét xử.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Rồi
  rationale: Trong mạch kể chuyện, καί nối hành động này với lời tuyên bố ngay trước đó của Ga-li-ô; “Rồi” tự nhiên trong tiếng Việt và không thêm quan hệ nhân quả mạnh.
- source_word: ἀπήλασεν
  choice: đuổi
  rationale: Động từ ἀπελαύνω diễn tả việc dùng thẩm quyền buộc người ta rời đi; “đuổi” giữ được sắc thái mạnh hơn “cho lui” hay “giải tán” mà vẫn tự nhiên.
- source_word: αὐτοὺς
  choice: họ
  rationale: Đại từ chỉ những người đang đứng trước Ga-li-ô, được xác định bởi văn cảnh; “họ” tránh diễn giải quá mức danh tính của nhóm này.
- source_word: ἀπὸ τοῦ βήματος
  choice: khỏi tòa án
  rationale: Trong bối cảnh pháp lý, βῆμα là bục hoặc ghế xét xử và theo nghĩa hoán dụ là nơi viên quan xử án. “Khỏi tòa án” diễn đạt tự nhiên việc họ bị buộc rời khỏi nơi xét xử, còn chú thích bảo lưu nghĩa cụ thể của từ Hy Lạp.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện ngắn gọn, trang trọng vừa phải và dễ hiểu trong tiếng Việt hiện đại. Cấu trúc giữ nguyên chủ thể là Ga-li-ô qua đại từ “ông” và bảo lưu sắc thái cưỡng chế của hành động.
