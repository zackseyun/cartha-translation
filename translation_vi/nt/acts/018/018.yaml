id: ACT.18.18
reference: Acts 18:18
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ὁ δὲ Παῦλος ἔτι προσμείνας ἡμέρας ἱκανὰς τοῖς ἀδελφοῖς ἀποταξάμενος ἐξέπλει εἰς τὴν Συρίαν, καὶ σὺν αὐτῷ Πρίσκιλλα καὶ Ἀκύλας, κειράμενος ⸂ἐν Κεγχρεαῖς τὴν κεφαλήν⸃, εἶχεν γὰρ εὐχήν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/018.yaml
  text: After Paul had remained many more days[a], he said farewell to the brothers and sailed away for Syria, and with him were Priscilla and Aquila. In Cenchreae he had his head shaved[e][d][c][b], for he had a vow.
translation:
  language: vi
  text: Sau khi ở lại thêm khá nhiều ngày, Phao-lô từ biệt các anh chị em[a] rồi xuống thuyền đi Sy-ri; cùng đi với ông có Bê-rít-sin và A-qui-la. Tại Ken-cơ-rê, ông cắt tóc[b], vì ông đang giữ một lời khấn[c][d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn là “các anh em”; trong ngữ cảnh này, từ ấy có thể chỉ chung cộng đồng tín hữu, gồm cả nam lẫn nữ.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “cạo đầu”. Động từ Hy Lạp có thể chỉ việc cắt hoặc xén tóc, không nhất thiết là cạo sạch.
    reason: lexical_alternative
  - marker: c
    text: Nguyên văn chỉ nói “một lời khấn”, không xác định đó là lời khấn Na-xi-rê.
    reason: cultural_note
  - marker: d
    text: Một số người hiểu người cắt tóc và giữ lời khấn là A-qui-la, nhưng ngữ pháp Hy Lạp tự nhiên nhất quy chiếu về Phao-lô.
    reason: alternative_reading
lexical_decisions:
- source_word: προσμείνας ἡμέρας ἱκανὰς
  choice: ở lại thêm khá nhiều ngày
  rationale: Diễn đạt cả ý tiếp tục của ἔτι và khoảng thời gian đáng kể của ἡμέρας ἱκανὰς, đồng thời giữ quan hệ hành động có trước động từ chính.
- source_word: τοῖς ἀδελφοῖς
  choice: các anh chị em
  rationale: Trong ngữ cảnh cộng đồng tín hữu, ἀδελφοί có thể chỉ chung cả nam lẫn nữ; cách dịch này tự nhiên và truyền đạt nghĩa quy chiếu của từ.
- source_word: ἀποταξάμενος
  choice: từ biệt
  rationale: Động từ ở thể trung gian mang nghĩa cáo biệt hoặc từ giã; “từ biệt” ngắn gọn, trang trọng và tự nhiên.
- source_word: ἐξέπλει εἰς τὴν Συρίαν
  choice: xuống thuyền đi Sy-ri
  rationale: ἐκπλέω chỉ việc rời đi bằng đường biển; cách diễn đạt này tự nhiên trong tiếng Việt và nêu rõ phương thức cùng đích đến.
- source_word: σὺν αὐτῷ Πρίσκιλλα καὶ Ἀκύλας
  choice: cùng đi với ông có Bê-rít-sin và A-qui-la
  rationale: Giữ cụm đồng hành như một mệnh đề trong dòng kể, không biến hai người thành chủ thể của hành động cắt tóc.
- source_word: κειράμενος ... τὴν κεφαλήν
  choice: ông cắt tóc
  rationale: κείρω có thể chỉ cắt, xén hoặc cạo tóc. “Cắt tóc” giữ được phạm vi nghĩa rộng hơn, tránh khẳng định không cần thiết rằng đầu được cạo sạch.
- source_word: ἐν Κεγχρεαῖς
  choice: Tại Ken-cơ-rê
  rationale: Dùng “tại” cho địa điểm và phiên âm địa danh theo âm Hy Lạp.
- source_word: εἶχεν γὰρ εὐχήν
  choice: vì ông đang giữ một lời khấn
  rationale: Diễn đạt trạng thái liên tục do εἶχεν và danh từ εὐχή, tự nhiên hơn lối dịch sát chữ “có một lời khấn” mà không tự thêm việc đã hoàn tất nghi thức nào.
theological_decisions:
- issue: Chủ thể của κειράμενος (“cắt tóc”)
  choice: Quy về Phao-lô trong chính văn
  alternative: Một số cách giải thích quy hành động này về A-qui-la
  rationale: Phân từ giống đực số ít tự nhiên nhất quy chiếu về Phao-lô, chủ thể ngữ pháp chi phối của câu. Tuy vậy, cách hiểu về A-qui-la được ghi chú vì đã hiện diện trong lịch sử giải thích.
- issue: Bản chất của εὐχή
  choice: Dịch chung là “một lời khấn”
  alternative: Lời khấn Na-xi-rê
  rationale: Nguyên văn không gọi đích danh đây là lời khấn Na-xi-rê, nên không đưa sự xác định ấy vào chính văn.
- issue: Mức độ cắt tóc trong κείρω
  choice: cắt tóc
  alternative: cạo đầu
  rationale: Động từ có phạm vi nghĩa là cắt hoặc xén tóc và không nhất thiết nói rõ cạo sạch; chính văn giữ cách diễn đạt ít chuyên biệt hơn.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Dùng tên riêng phiên âm quen thuộc trong tiếng Việt; giữ nhịp câu liền mạch nhưng tách thành hai câu để làm rõ chủ thể. Các ghi chú bảo toàn những điểm có khả năng dịch hoặc giải thích khác nhau.
