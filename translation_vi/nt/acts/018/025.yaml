  source_fidelity: 'Bản dịch phản ánh đúng các yếu tố chính: sự chỉ dạy đã nhận trước đó (phân từ hoàn thành bị động), «con đường của Chúa», hai hoạt động nói và dạy, tính chính xác, và giới hạn nơi phép báp-têm của Giăng. Tuy nhiên, «dù chỉ biết» diễn giải rõ quan hệ nhượng bộ mà phân từ ἐπιστάμενος không đánh dấu minh nhiên; nên giữ trung tính là «chỉ biết».'
