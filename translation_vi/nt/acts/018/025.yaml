  - severity: low
    issue: «Dù chỉ biết» thêm sắc thái nhượng bộ.
    rationale: Phân từ ἐπιστάμενος có thể được hiểu theo ngữ cảnh là nhượng bộ, nhưng bản thân hình thức không buộc phải thêm «dù». «Chỉ biết» bảo lưu quan hệ cú pháp và diễn giải mở hơn.
