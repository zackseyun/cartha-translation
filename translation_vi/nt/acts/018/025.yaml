id: ACT.18.25
reference: Acts 18:25
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οὗτος ἦν κατηχημένος τὴν ὁδὸν τοῦ κυρίου, καὶ ζέων τῷ πνεύματι ἐλάλει καὶ ἐδίδασκεν ἀκριβῶς τὰ περὶ τοῦ ⸀Ἰησοῦ, ἐπιστάμενος μόνον τὸ βάπτισμα Ἰωάννου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/025.yaml
  text: This man had been instructed in the way of the Lord[a], and being fervent in spirit, he was speaking and teaching accurately the things concerning Jesus, knowing only the baptism of John.
translation:
  language: vi
  text: Người này đã được dạy về con đường của Chúa và, với tinh thần đầy nhiệt thành[a], ông nói và dạy cách chính xác những điều liên quan đến Đức Giê-su, chỉ biết phép báp-têm của Giăng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đầy nhiệt thành trong Đức Thánh Linh”, nếu hiểu đây là Đức Thánh Linh chứ không phải tinh thần của chính A-bô-lô.'
    reason: alternative_reading
lexical_decisions:
- source_word: κατηχημένος
  choice: đã được dạy
  rationale: Phân từ hoàn thành bị động diễn tả việc đã tiếp nhận sự chỉ dạy và kết quả vẫn còn; cách dịch này tự nhiên, không đưa vào sắc thái thuật ngữ giáo hội về sau.
- source_word: τὴν ὁδὸν τοῦ κυρίου
  choice: con đường của Chúa
  rationale: Giữ hình ảnh và thành ngữ Kitô giáo sơ khai về “con đường”, đồng thời dịch κύριος là “Chúa”.
- source_word: ζέων τῷ πνεύματι
  choice: với tinh thần nhiệt thành
  rationale: Diễn đạt tự nhiên sức nóng và lòng sốt sắng của ζέων; “tinh thần” trong chính văn nghiêng về nội tâm của A-bô-lô nhưng không che khuất khả năng πνεῦμα chỉ Đức Thánh Linh, được nêu ở chú thích.
- source_word: ἐλάλει καὶ ἐδίδασκεν
  choice: ông nói và dạy
  rationale: Hai động từ thời chưa hoàn thành chỉ hoạt động đang diễn ra hoặc thường xuyên; tiếng Việt không cần thêm dấu hiệu thể để câu được tự nhiên.
- source_word: ἀκριβῶς
  choice: chính xác
  rationale: Nêu đúng ý về tính chuẩn xác trong nội dung giảng dạy, đồng thời giữ được sự căng thẳng với giới hạn kiến thức được nói đến sau đó.
- source_word: τὰ περὶ τοῦ Ἰησοῦ
  choice: những điều liên quan đến Đức Giê-su
  rationale: Giữ phạm vi rộng của cụm từ Hy Lạp mà không thu hẹp nội dung ông giảng dạy.
- source_word: ἐπιστάμενος μόνον τὸ βάπτισμα Ἰωάννου
  choice: dù chỉ biết phép báp-têm của Giăng
  rationale: “Chỉ biết” phản ánh μόνον; “dù” diễn đạt quan hệ nhượng bộ tự nhiên trong ngữ cảnh giữa sự giảng dạy chính xác và giới hạn hiểu biết của ông.
theological_decisions:
- issue: Ý nghĩa của τῷ πνεύματι trong ζέων τῷ πνεύματι
  choice: tinh thần của A-bô-lô / lòng nhiệt thành bên trong
  alternative: Đức Thánh Linh
  rationale: Ngữ pháp Hy Lạp cho phép hiểu là tinh thần con người hoặc Đức Thánh Linh. Chính văn dùng “tinh thần” như cách hiểu thành ngữ tự nhiên, còn chú thích bảo lưu cách hiểu quy chiếu đến Đức Thánh Linh.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Giê-su” và “Giăng” theo lối gọi tên phổ biến trong tiếng Việt; giữ “phép báp-têm” để phân biệt rõ nghi thức được nhắc đến. Dấu chú thích [a] được đặt ngay sau cụm từ có điểm mơ hồ.
