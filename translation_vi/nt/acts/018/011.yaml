base_translation:
  language: en
  yaml_path: translation/nt/acts/018/011.yaml
  text: So he stayed there a year and six months, teaching the word of God among them.
translation:
  language: vi
  text: Ông ở lại đó một năm sáu tháng, giảng dạy lời Đức Chúa Trời giữa họ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκάθισεν
  choice: ở lại đó
  rationale: Động từ theo nghĩa đen có thể là “ngồi”, nhưng trong ngữ cảnh tường thuật này mang nghĩa thành ngữ là lưu lại một nơi trong một khoảng thời gian. “Ở lại đó” tự nhiên và chính xác trong tiếng Việt.
- source_word: δὲ
  choice: Vì vậy
  rationale: δέ là liên từ chuyển ý nhẹ. Trong mạch văn sau lời khích lệ của Chúa ở câu trước, “Vì vậy” diễn đạt hợp lý quan hệ dẫn đến hành động mà không tạo nét tương phản không có trong nguyên văn.
- source_word: ἐνιαυτὸν καὶ μῆνας ἓξ
  choice: một năm sáu tháng
  rationale: Cụm đối cách chỉ khoảng thời gian. Cách nói “một năm sáu tháng” tự nhiên trong tiếng Việt và truyền đạt đầy đủ thời lượng.
- source_word: διδάσκων
  choice: giảng dạy
  rationale: Phân từ hiện tại chỉ hoạt động diễn ra liên tục trong thời gian ông ở lại. “Giảng dạy” giữ được sắc thái tiếp diễn và phù hợp với nội dung là lời của Đức Chúa Trời.
- source_word: ἐν αὐτοῖς
  choice: giữa họ
  rationale: 'ἐν với đại từ số nhiều ở đây có nghĩa định vị/xã hội: hoạt động ngay trong cộng đồng ấy. “Giữa họ” sát nghĩa và tự nhiên.'
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: lời của Đức Chúa Trời
  rationale: λόγος trong sách Công Vụ thường chỉ sứ điệp được công bố từ Đức Chúa Trời. “Lời của Đức Chúa Trời” giữ cách diễn đạt Kinh Thánh quen thuộc và sức nặng thần học của cụm từ.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “ông” để nối với nhân vật Phao-lô trong mạch truyện; không thêm tên riêng vốn không xuất hiện trong câu Hy Lạp. Không cần chú thích vì các lựa chọn không tạo ra dị bản hay sự mơ hồ đáng kể cần đưa vào bản văn.
