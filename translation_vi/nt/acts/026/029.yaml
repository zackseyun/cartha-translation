  source_fidelity: 'Bản dịch chuyển đạt đúng cấu trúc lời đáp của Phao-lô: lời cầu nguyện hướng về Đức Chúa Trời, cặp thành ngữ còn tranh luận ἐν ὀλίγῳ καὶ ἐν μεγάλῳ được dịch theo phương án thời gian và được chú thích, phạm vi “không chỉ... mà... tất cả những người đang nghe tôi hôm nay,” ước nguyện họ trở nên như ông, và ngoại lệ là xiềng xích. Việc gọi người nghe trực tiếp là “vua” phù hợp ngữ cảnh A-gríp-ba mà không làm thay đổi nghĩa.'
