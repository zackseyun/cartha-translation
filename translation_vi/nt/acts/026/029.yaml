id: ACT.26.29
reference: Acts 26:29
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ δὲ ⸀Παῦλος· Εὐξαίμην ἂν τῷ θεῷ καὶ ἐν ὀλίγῳ καὶ ἐν ⸀μεγάλῳ οὐ μόνον σὲ ἀλλὰ καὶ πάντας τοὺς ἀκούοντάς μου σήμερον γενέσθαι τοιούτους ὁποῖος καὶ ἐγώ εἰμι παρεκτὸς τῶν δεσμῶν τούτων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/029.yaml
  text: But Paul said[a], “I would pray to God that whether in a short time or in a long time, not only you but also all who hear me today might become such as I am—except for these chains.”
translation:
  language: vi
  text: 'Nhưng Phao-lô nói[a]: “Tôi cầu xin Đức Chúa Trời rằng, dù trong thời gian ngắn hay dài, không chỉ riêng vua mà tất cả những người đang nghe tôi hôm nay cũng đều trở nên giống như tôi—ngoại trừ những xiềng xích này.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch phần tiếp theo là “dù gần như hay hoàn toàn”; cách diễn đạt Hy Lạp này khó xác định và có thể nói về mức độ, công sức hoặc thời gian/phạm vi.
    reason: alternative_reading
lexical_decisions:
- source_word: Εὐξαίμην ἂν τῷ θεῷ
  choice: Tôi cầu xin Đức Chúa Trời
  rationale: Thể mong ước đi với ἄν diễn tả một nguyện vọng mang tính cầu xin; τῷ θεῷ chỉ Đấng lời cầu xin hướng đến. Cách dịch này tự nhiên trong tiếng Việt và giữ rõ ý cầu nguyện với Đức Chúa Trời.
- source_word: ἐν ὀλίγῳ καὶ ἐν μεγάλῳ
  choice: dù trong thời gian ngắn hay dài
  rationale: Cụm đối xứng này khó xác định dứt khoát, có thể liên quan đến thời gian, mức độ hoặc công sức. Bản chính chọn cách hiểu về thời gian, phù hợp mạch đối thoại và vẫn giữ chú thích về các khả năng khác.
- source_word: οὐ μόνον σὲ ἀλλὰ καὶ πάντας τοὺς ἀκούοντάς μου σήμερον
  choice: không chỉ riêng vua mà tất cả những người đang nghe tôi hôm nay cũng đều
  rationale: Giữ cấu trúc nhấn mạnh “không chỉ... mà còn”; đại từ ngôi hai số ít được diễn đạt là “vua” theo phép xưng hô tự nhiên và kính trọng trong ngữ cảnh Phao-lô nói với vua A-gríp-ba.
- source_word: γενέσθαι τοιούτους ὁποῖος καὶ ἐγώ εἰμι
  choice: trở nên giống như tôi
  rationale: Diễn đạt tự nhiên kết quả mà Phao-lô mong muốn, không thêm nội dung để xác định cụ thể ông muốn người nghe giống mình ở phương diện nào.
- source_word: παρεκτὸς τῶν δεσμῶν τούτων
  choice: ngoại trừ những xiềng xích này
  rationale: παρεκτός nêu ngoại lệ; δεσμοί trong bối cảnh tù đày được chuyển là “xiềng xích”, vừa cụ thể vừa giữ được nét sinh động của lời Phao-lô.
theological_decisions:
- issue: Cách hiểu ἐν ὀλίγῳ καὶ ἐν μεγάλῳ trong mối liên hệ với lời A-gríp-ba ở câu trước
  choice: dù trong thời gian ngắn hay dài
  alternative: dù gần như hay hoàn toàn; dù ít hay nhiều; dù tốn ít hay nhiều công sức
  rationale: Cụm Hy Lạp thực sự đa nghĩa và không nên bị giải quyết theo một truyền thống diễn giải riêng. Bản chính dùng cách hiểu hợp lý về thời gian, còn chú thích công khai những khả năng đáng kể khác.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “vua” thay cho đại từ trần “ông/ngài” để phản ánh tự nhiên quan hệ xưng hô với A-gríp-ba trong tiếng Việt; dấu gạch ngang giữ sức nặng của lời ngoại trừ cuối câu.
