  text: Ὅθεν, βασιλεῦ Ἀγρίππα, οὐκ ἐγενόμην ἀπειθὴς τῇ οὐρανίῳ ὀπτασίᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/019.yaml
  text: Therefore[a], King Agrippa, I was not disobedient to the heavenly vision,
translation:
  language: vi
  text: Vì vậy, thưa vua A-gríp-pa, tôi đã không bất tuân theo khải tượng từ trời[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “khải tượng thuộc trời.”'
    reason: οὐρανίῳ có thể diễn tả nguồn gốc (“từ trời”) hoặc tính chất (“thuộc trời”).
lexical_decisions:
- source_word: Ὅθεν
  choice: Vì vậy
  rationale: Diễn tả kết luận rút ra từ lời kể trước đó về cuộc gặp gỡ và sự ủy thác dành cho Phao-lô, đồng thời tự nhiên trong tiếng Việt hiện đại.
- source_word: βασιλεῦ Ἀγρίππα
  choice: thưa vua A-gríp-pa
  rationale: Giữ cách xưng hô trực tiếp và tước vị, với từ “thưa” thể hiện sắc thái kính trọng của hô cách trong tiếng Việt tự nhiên.
- source_word: οὐκ ἐγενόμην ἀπειθὴς
  choice: tôi đã không bất tuân
  rationale: Trong cấu trúc này, γίνομαι kết hợp với tính từ diễn tả trạng thái hay cách hành xử. “Đã không bất tuân” giữ sắc thái phủ định của việc từ chối vâng theo sự ủy thác.
- source_word: τῇ οὐρανίῳ ὀπτασίᾳ
  choice: khải tượng từ trời
  rationale: “Khải tượng” diễn đạt một cảnh tượng siêu nhiên được cho thấy; “từ trời” giữ rõ khả năng οὐρανίῳ chỉ nguồn gốc, thay vì buộc người đọc hiểu đây chỉ là phẩm tính “thuộc trời”.
theological_decisions:
- issue: Bản chất trải nghiệm của Phao-lô trên đường Đa-mách
  choice: khải tượng
  alternative: sự hiện thấy
  rationale: ὀπτασία trực tiếp chỉ một cảnh tượng hay sự hiện thấy siêu nhiên. “Khải tượng” giữ phạm trù của chính câu văn mà không phát triển thành một cách giải thích thần học chi tiết hơn.
- issue: Ý nghĩa của οὐρανίῳ
  choice: từ trời
  alternative: thuộc trời
  rationale: Tính từ có thể nói đến nguồn gốc hoặc tính chất. Bản dịch chính dùng “từ trời” vì tự nhiên và rõ nghĩa trong tiếng Việt, nhưng không phủ nhận sắc thái “thuộc trời”.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Dùng “thưa vua A-gríp-pa” để thể hiện lời trực tiếp kính trọng; giữ dấu phẩy cuối câu vì câu tiếp tục sang câu kế tiếp.
