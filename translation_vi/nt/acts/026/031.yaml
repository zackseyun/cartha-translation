  text: καὶ ἀναχωρήσαντες ἐλάλουν πρὸς ἀλλήλους λέγοντες ὅτι Οὐδὲν θανάτου ⸂ἢ δεσμῶν ἄξιον⸃ ⸀τι πράσσει ὁ ἄνθρωπος οὗτος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/031.yaml
  text: And after they withdrew[a], they were speaking to one another, saying, “This man is doing nothing worthy of death or imprisonment.”
translation:
  language: vi
  text: 'Sau khi lui ra, họ bàn luận với nhau: “Người này không làm điều gì đáng chịu án tử hình hoặc bị giam giữ[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hoặc “xiềng xích” hay “gông xiềng.” Từ Hy Lạp δεσμῶν theo nghĩa đen là những thứ trói buộc; trong bối cảnh pháp lý, từ này có thể chỉ việc giam giữ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναχωρήσαντες
  choice: sau khi lui ra
  rationale: Phân từ bất định diễn tả việc họ rời khỏi nơi xét xử trước khi trao đổi với nhau; “lui ra” tự nhiên và phù hợp với bối cảnh.
- source_word: ἐλάλουν πρὸς ἀλλήλους λέγοντες
  choice: họ nói với nhau
  rationale: Thì chưa hoàn thành gợi cuộc trao đổi đang diễn ra. Tiếng Việt không cần giữ cả hai động từ “nói... rằng” để truyền đạt tự nhiên cùng ý nghĩa.
- source_word: Οὐδὲν ... ἄξιον
  choice: không làm điều gì đáng
  rationale: Giữ cấu trúc phủ định toàn thể và ý nghĩa rằng không hành vi nào của Phao-lô xứng với các hình phạt được nêu.
- source_word: θανάτου ἢ δεσμῶν
  choice: phải chết hoặc bị giam cầm
  rationale: Trong bối cảnh pháp lý, θανάτου chỉ án chết, còn δεσμῶν theo nghĩa đen là xiềng xích nhưng dùng hoán dụ cho cảnh giam giữ. Cách dịch này truyền đạt rõ hai hình phạt.
- source_word: τι πράσσει
  choice: làm điều gì
  rationale: Giữ nghĩa rộng của πράσσει và tránh thêm sắc thái “phạm tội” vốn không được phát biểu trực tiếp.
- source_word: ὁ ἄνθρωπος οὗτος
  choice: người này
  rationale: Cách gọi tự nhiên trong tiếng Việt, chỉ trực tiếp Phao-lô mà không cần thêm danh xưng.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Giữ lời nhận định pháp lý rõ ràng, không thêm diễn giải thần học. Không dùng chú thích vì “bị giam cầm” truyền đạt thích hợp nghĩa ngữ cảnh của δεσμῶν; bản văn chính không cần đánh dấu biến thể nếu không kèm chú thích.
