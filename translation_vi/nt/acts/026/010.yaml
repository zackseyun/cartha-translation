revisions:
- from: 'Và đó chính là điều tôi đã làm tại Giê-ru-sa-lem: tôi không những đã giam nhiều thánh đồ[a] vào các nhà tù, sau khi nhận thẩm quyền từ các thượng tế, mà khi họ bị xử tử, tôi còn bỏ phiếu chống lại họ[b].'
  to: 'Điều đó tôi cũng đã làm tại Giê-ru-sa-lem: được các thượng tế trao quyền, tôi không những giam nhiều thánh đồ vào các nhà tù, mà còn bỏ phiếu chống lại họ khi họ bị giết.[a]'
  rationale: Sửa “Và đó chính là điều tôi đã làm” thành “Điều đó tôi cũng đã làm” để phản ánh tự nhiên cả đại từ hồi chỉ ὃ lẫn καί mà không thêm nhấn mạnh không cần thiết. Thay cụm “sau khi nhận thẩm quyền” bằng “được các thượng tế trao quyền” để diễn đạt chức năng căn cứ/hoàn cảnh của λαβών. Thay “bị xử tử” bằng “bị giết” để không suy diễn hình thức pháp lý. Hợp nhất hai chú thích vào một neo đặt ở cuối câu, vì chú thích vừa giải thích ἅγιοι vừa giải thích ψῆφος; nội dung và ý nghĩa không thay đổi.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T10:22:52Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp truyền đạt đúng các ý chính: Phao-lô giam giữ nhiều tín hữu tại Giê-ru-sa-lem, làm việc ấy với thẩm quyền từ các thượng tế, và bỏ phiếu chống lại họ khi họ bị giết. Tuy nhiên, “sau khi nhận” làm phân từ λαβών thành một trình tự thời gian cụ thể hơn nguyên văn; “bị xử tử” cũng dễ hàm ý một thủ tục hành quyết pháp lý mà ἀναιρουμένων không xác định.'
  naturalness: Cấu trúc “không những ... mà ... còn” tự nhiên và giữ được tương quan τε ... τε. Bản sửa đặt cụm nêu căn cứ thẩm quyền ở đầu câu, đồng thời dùng cách diễn đạt tiếng Việt gọn, trang trọng và hiện đại.
  terminology: “Thánh đồ” có thể dùng để dịch ἅγιοι và chú thích đã ngăn cách thuật ngữ này với ý niệm phong thánh về sau. “Các thượng tế” và “bỏ phiếu chống lại họ” phù hợp. “Bị giết” giữ tính không xác định của động từ Hy Lạp tốt hơn “bị xử tử”.
  issues:
  - severity: medium
    issue: “sau khi nhận thẩm quyền” xác định hóa quan hệ thời gian của λαβών.
    rationale: Phân từ aorist λαβών nêu hoàn cảnh/cơ sở thẩm quyền cho hành động; nó không nhất thiết nhấn mạnh rằng việc nhận quyền đã hoàn tất theo trình tự thời gian được diễn đạt bằng “sau khi”.
  - severity: medium
    issue: “bị xử tử” có thể gợi một hành quyết pháp lý chính thức.
    rationale: ἀναιρουμένων diễn tả việc họ bị giết hay bị đưa đến chỗ chết, nhưng câu không xác định thủ tục hay bản chất pháp lý của cái chết.
