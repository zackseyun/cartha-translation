id: ACT.26.10
reference: Acts 26:10
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὃ καὶ ἐποίησα ἐν Ἱεροσολύμοις, καὶ πολλούς ⸀τε τῶν ἁγίων ἐγὼ ⸀ἐν φυλακαῖς κατέκλεισα τὴν παρὰ τῶν ἀρχιερέων ἐξουσίαν λαβών, ἀναιρουμένων τε αὐτῶν κατήνεγκα ψῆφον,
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/010.yaml
  text: 'And this is what I did in Jerusalem: I not only locked up many of the saints in prisons[a], having received authority from the chief priests, but also, when they were being put to death[b], I cast my vote against them.'
translation:
  language: vi
  text: 'Điều đó tôi cũng đã làm tại Giê-ru-sa-lem: được các thượng tế trao quyền, tôi không những giam nhiều thánh đồ vào các nhà tù, mà còn bỏ phiếu chống lại họ khi họ bị giết.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Thánh đồ” ở đây chỉ dân thánh của Đức Chúa Trời, tức những người tin Chúa Giê-su. Nguyên văn Hy Lạp về việc Phao-lô “bỏ phiếu” (ψῆφος) chống lại họ; cụm này cũng có thể được hiểu rộng là ông tán thành việc giết họ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃ καὶ ἐποίησα
  choice: Và đó chính là điều tôi đã làm
  rationale: Diễn đạt tự nhiên mệnh đề hồi chỉ về hành động bức hại đã nêu trước đó; “chính” thể hiện sắc thái καί trong ngữ cảnh.
- source_word: ἐν Ἱεροσολύμοις
  choice: tại Giê-ru-sa-lem
  rationale: Cách gọi địa danh quen thuộc và phù hợp văn phong tiếng Việt hiện đại.
- source_word: πολλούς τε τῶν ἁγίων
  choice: nhiều thánh đồ
  rationale: ἅγιοι chỉ những người thuộc cộng đồng tin Chúa Giê-su, không phải một tầng lớp đặc biệt được phong thánh.
- source_word: ἐν φυλακαῖς κατέκλεισα
  choice: giam ... vào các nhà tù
  rationale: Giữ được ý nhốt, giam giữ của κατακλείω và số nhiều của φυλακαῖς.
- source_word: τὴν παρὰ τῶν ἀρχιερέων ἐξουσίαν λαβών
  choice: sau khi nhận thẩm quyền từ các thượng tế
  rationale: Thể hiện phân từ chỉ hoàn cảnh/căn cứ cho hành động và dịch trực tiếp ἐξουσία là “thẩm quyền”.
- source_word: ἀναιρουμένων τε αὐτῶν
  choice: khi họ bị xử tử
  rationale: Diễn đạt tự nhiên phân từ bị động mang ý thời gian; “xử tử” truyền đạt việc bị đưa đến cái chết trong bối cảnh kết án mà không mô tả thêm phương thức.
- source_word: κατήνεγκα ψῆφον
  choice: tôi còn bỏ phiếu chống lại họ
  rationale: Giữ hình ảnh và nghĩa trực tiếp của ψῆφος là lá phiếu; “chống lại họ” được hàm ý rõ trong bối cảnh thù nghịch.
theological_decisions:
- issue: Ý nghĩa của ἅγιοι trong Công Vụ
  choice: thánh đồ
  alternative: những người thánh; dân thánh của Đức Chúa Trời
  rationale: Thuật ngữ chỉ các tín hữu nói chung, không phải một nhóm ưu tuyển hoặc những người được phong thánh về sau.
- issue: Sức nặng của κατήνεγκα ψῆφον
  choice: bỏ phiếu chống lại họ
  alternative: tán thành việc giết họ
  rationale: Giữ nghĩa cụ thể tự nhiên nhất của thành ngữ Hy Lạp mà không suy đoán về cơ cấu pháp lý hay tư cách chính thức của Phao-lô.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ cấu trúc tương liên τε ... τε bằng “không những ... mà ... còn”, đồng thời bảo toàn sự phân biệt giữa hành động giam giữ, thẩm quyền của các thượng tế và việc Phao-lô bỏ phiếu chống lại các tín hữu.
