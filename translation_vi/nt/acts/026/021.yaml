  text: ἕνεκα τούτων ⸂με Ἰουδαῖοι⸃ ⸀συλλαβόμενοι ἐν τῷ ἱερῷ ἐπειρῶντο διαχειρίσασθαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/021.yaml
  text: Because of these things the Jews seized me in the temple and were trying to kill me[a][b].
translation:
  language: vi
  text: Vì những điều ấy, người Do Thái đã bắt tôi trong khuôn viên đền thờ[b] và tìm cách giết tôi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cụm “người Do Thái” ở đây chỉ nhóm người liên hệ trong sự việc được thuật lại, không phải toàn thể dân Do Thái.
    reason: contextual_clarification
  - marker: b
    text: Từ Hy Lạp chỉ toàn bộ khu đền thờ, không riêng nơi thánh bên trong.
    reason: cultural_note
lexical_decisions:
- source_word: ἕνεκα τούτων
  choice: Vì những điều ấy
  rationale: Cụm ἕνεκα với sở hữu cách chỉ nguyên nhân hoặc lý do và quy chiếu ngược về những điều Phao-lô vừa thuật lại.
- source_word: με
  choice: tôi
  rationale: Đại từ đối cách ngôi thứ nhất số ít, làm bổ ngữ trực tiếp của συλλαβόμενοι.
- source_word: Ἰουδαῖοι
  choice: người Do Thái
  rationale: Cách gọi trực tiếp nhóm người Do Thái tham gia biến cố; ngữ cảnh giới hạn đối tượng, không quy kết toàn thể dân Do Thái.
- source_word: συλλαβόμενοι
  choice: đã bắt
  rationale: Phân từ chỉ hành động túm lấy hoặc bắt giữ; “đã bắt” tự nhiên trong tiếng Việt và phù hợp với bối cảnh thù địch.
- source_word: ἐν τῷ ἱερῷ
  choice: trong khuôn viên đền thờ
  rationale: ἱερόν chỉ toàn bộ khu đền thờ, không riêng nơi thánh bên trong; “khuôn viên đền thờ” diễn đạt rõ sự phân biệt này.
- source_word: ἐπειρῶντο
  choice: tìm cách
  rationale: Thì chưa hoàn thành diễn tả nỗ lực đang diễn ra trong quá khứ; “tìm cách” giữ được sắc thái cố thực hiện nhưng chưa thành.
- source_word: διαχειρίσασθαι
  choice: giết
  rationale: Trong ngữ cảnh này, động từ có nghĩa giết hoặc thủ tiêu bằng bạo lực; “giết” rõ ràng mà không thêm sắc thái pháp lý.
theological_decisions:
- issue: Phạm vi quy chiếu của “người Do Thái” trong ngữ cảnh dễ gây hiểu lầm
  choice: Giữ cách gọi “người Do Thái”, hiểu theo ngữ cảnh là những người đã bắt Phao-lô.
  alternative: “một số người Do Thái” hoặc “những người Do Thái ấy”
  rationale: Bản Hy Lạp gọi nhóm người liên quan đến biến cố nhưng không nói “một số”; vì vậy không thêm từ hạn định vào chính văn. Chú thích làm rõ rằng câu này không quy kết toàn thể dân Do Thái.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “khuôn viên đền thờ” để chuyển tải chính xác phạm vi của ἱερόν. Các dấu chú thích đều xuất hiện trong chính văn.
