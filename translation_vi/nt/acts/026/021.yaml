  terminology: “Người Do Thái” giữ đúng tham chiếu lịch sử của Ἰουδαῖοι mà không thêm “một số” vào chính văn. Chú thích nên tránh cụm “biến cố ấy” mơ hồ; cần xác định đây là nhóm liên hệ trong sự việc được kể, không phải một nhận định về toàn thể dân Do Thái.
