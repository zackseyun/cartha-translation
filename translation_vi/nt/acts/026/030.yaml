  text: ⸀Ἀνέστη ⸀τε ὁ βασιλεὺς καὶ ὁ ἡγεμὼν ἥ τε Βερνίκη καὶ οἱ συγκαθήμενοι αὐτοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/030.yaml
  text: Then the king rose[a], and the governor and Bernice and those seated with them,
translation:
  language: vi
  text: Bấy giờ, vua, tổng đốc, Bê-rê-nít[a] và những người ngồi cùng với họ đều đứng dậy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Bê-rê-nít: cũng có thể phiên âm là “Bê-rê-ni-xê.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀνέστη
  choice: đứng dậy
  rationale: Động từ aorist của ἀνίστημι ở đây chỉ hành động đứng lên khỏi chỗ ngồi; “đứng dậy” tự nhiên và chính xác trong tiếng Việt.
- source_word: τε
  choice: Bấy giờ ... cùng với
  rationale: Các tiểu từ τε liên kết hành động này với diễn tiến trước đó và phối hợp các nhân vật. Tiếng Việt diễn đạt tự nhiên bằng “Bấy giờ” và cấu trúc “cùng với” thay vì tái hiện máy móc từng tiểu từ.
- source_word: ὁ βασιλεὺς
  choice: vua
  rationale: Giữ nguyên tước hiệu βασιλεύς mà bản Hy Lạp dùng, không thay bằng tên riêng A-gríp-pa.
- source_word: ὁ ἡγεμὼν
  choice: tổng đốc
  rationale: Trong bối cảnh sách Công Vụ, ἡγεμών chỉ quan đứng đầu hành chính cấp tỉnh của La Mã; “tổng đốc” là cách gọi rõ nghĩa và quen thuộc.
- source_word: Βερνίκη
  choice: Bê-rê-nít
  rationale: Phiên âm tên Hy Lạp Βερνίκη theo cách dễ đọc đối với độc giả Việt; dạng “Bê-rê-ni-xê” sát từng âm Hy Lạp hơn và được ghi ở chú thích.
- source_word: οἱ συγκαθήμενοι αὐτοῖς
  choice: những người ngồi với họ
  rationale: Giữ hình ảnh cụ thể của phân từ συγκαθήμενοι là những người cùng ngồi, không suy diễn họ thành khách mời hay quan chức.
- source_word: καὶ
  choice: cùng với ... và
  rationale: Diễn đạt quan hệ phối hợp cộng thêm giữa các nhân vật và nhóm người bằng cấu trúc tiếng Việt tự nhiên.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu giữ cấu trúc liệt kê của nguyên văn nhưng dùng “cùng với” để tránh chuỗi liên từ nặng nề trong tiếng Việt. Dấu phẩy cuối câu Hy Lạp cho thấy câu tiếp tục sang câu 31; bản dịch vẫn kết thúc bằng dấu chấm vì đơn vị được yêu cầu là một câu riêng.
