    rationale: στῆθι ἐπὶ τοὺς πόδας σου yêu cầu đứng trên chân mình; “vững” có thể thêm ý về sự vững vàng/kiên định không được biểu đạt trực tiếp trong câu Hy Lạp.
  - severity: low
    issue: Cú pháp “những điều con đã thấy Ta”
    rationale: Dù bám sát cấu trúc cô đọng, cụm này không tự nhiên trong tiếng Việt. Thêm “hiện ra” làm rõ quan hệ thấy–sự hiện ra, trong khi chú thích vẫn nêu dạng sát chữ và tính khó của cú pháp.
