id: ACT.26.16
reference: Acts 26:16
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀλλὰ ἀνάστηθι καὶ στῆθι ἐπὶ τοὺς πόδας σου· εἰς τοῦτο γὰρ ὤφθην σοι, προχειρίσασθαί σε ὑπηρέτην καὶ μάρτυρα ὧν τε εἶδές ⸀με ὧν τε ὀφθήσομαί σοι,
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/016.yaml
  text: 'But rise and stand on your feet[a], for I have appeared to you for this purpose: to appoint you as a servant and witness both of the things in which you have seen me and of the things in which I will appear to you,'
translation:
  language: vi
  text: 'Nhưng hãy đứng dậy, đứng trên đôi chân mình, vì Ta hiện ra với con nhằm mục đích này: lập con làm người phục vụ và nhân chứng về cả những điều con đã thấy Ta hiện ra lẫn những điều Ta sẽ hiện ra cho con thấy.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát hơn: “về cả những điều con đã thấy Ta và những điều Ta sẽ hiện ra với con.” Cấu trúc Hy Lạp cô đọng và có phần khó.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνάστηθι
  choice: hãy đứng dậy
  rationale: Mệnh lệnh aorist đòi hỏi hành động tức thời; cách nói này tự nhiên và rõ ràng trong tiếng Việt hiện đại.
- source_word: στῆθι ἐπὶ τοὺς πόδας σου
  choice: đứng vững trên đôi chân mình
  rationale: Giữ hình ảnh cụ thể của mệnh lệnh trong cảnh kêu gọi, đồng thời tránh lặp nguyên xi 'đứng dậy và đứng trên chân' vốn thiếu tự nhiên trong tiếng Việt.
- source_word: εἰς τοῦτο γὰρ
  choice: vì Ta hiện ra với con nhằm mục đích này
  rationale: Diễn đạt rõ ý chỉ mục đích của lần hiện ra.
- source_word: ὤφθην σοι
  choice: Ta hiện ra với con
  rationale: Dạng bị động có nghĩa nội động trong công thức về sự hiện ra; bản dịch giữ ngôn ngữ mặc khải mà không xác định phương thức.
- source_word: προχειρίσασθαί σε
  choice: lập con làm
  rationale: Diễn tả việc chính thức chỉ định và giao phó một vai trò, mạnh hơn ý đơn thuần lựa chọn.
- source_word: ὑπηρέτην
  choice: người phục vụ
  rationale: Chỉ một người phục vụ hoặc tác nhân ở địa vị phụ thuộc; tránh sắc thái chức danh giáo hội của 'mục sư' hay 'thừa tác viên'.
- source_word: μάρτυρα
  choice: nhân chứng
  rationale: Thuật ngữ tiếng Việt chuẩn cho người làm chứng về điều mình thấy và được mặc khải.
- source_word: ὧν τε εἶδές με
  choice: về cả những điều con đã thấy Ta
  rationale: Phản ánh με trong SBLGNT và giữ cấu trúc cô đọng, dù quan hệ chính xác của đại từ ὧν với động từ vẫn có phần khó.
- source_word: ὧν τε ὀφθήσομαί σοι
  choice: lẫn những điều Ta sẽ hiện ra cho con thấy
  rationale: Giữ động từ ở trường nghĩa 'hiện ra' và nối các lần hiện ra trong tương lai với sứ mạng làm chứng; thêm 'cho ... thấy' để câu tiếng Việt dễ hiểu.
theological_decisions:
- issue: Bản chất ngôn ngữ mặc khải trong ὤφθην / ὀφθήσομαί
  choice: Dịch cả hai bằng ngôn ngữ 'hiện ra'.
  alternative: Ta được con nhìn thấy / Ta sẽ được con nhìn thấy; hoặc Ta đã/sẽ bày tỏ chính mình.
  rationale: Cách dịch này giữ tính khách quan của việc Chúa Giê-su phục sinh hiện ra và sai phái Phao-lô, nhưng không suy diễn về hình thức của sự hiện ra.
- issue: Quan hệ cú pháp của hai mệnh đề ὧν
  choice: Dịch tự nhiên là làm chứng về những điều gắn với việc đã và sẽ thấy Chúa hiện ra, đồng thời ghi chú cấu trúc sát chữ.
  alternative: về những điều trong đó con đã thấy Ta và trong đó Ta sẽ hiện ra với con
  rationale: Nguyên văn Hy Lạp cô đọng và hơi khó; không nên âm thầm tuyên bố một cách phân tích cú pháp duy nhất là chắc chắn.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. Dùng “Ta/con” trong lời Chúa Giê-su nói trực tiếp với Phao-lô, phù hợp quan hệ ngữ cảnh; tránh thuật ngữ mang dấu ấn riêng của một hệ phái.
