  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐγὼ δὲ εἶπα· Τίς εἶ, κύριε; ὁ δὲ ⸀κύριος εἶπεν· Ἐγώ εἰμι Ἰησοῦς ὃν σὺ διώκεις·
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/015.yaml
  text: And I said[a], ‘Who are you, Lord?’ And the Lord said, ‘I am Jesus, whom you are persecuting.’
translation:
  language: vi
  text: 'Tôi thưa: “Thưa Chúa, Ngài là ai?”[a] Chúa phán: “Ta là Jêsus, Đấng mà ngươi đang bắt bớ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Thưa ngài, ngài là ai?” Từ Hy Lạp κύριε có thể là một lối xưng hô kính trọng; tuy nhiên, ở đây “Chúa” được ưu tiên vì người nói xuất hiện từ trời và ngay sau đó tự nhận là Jêsus.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγὼ δὲ εἶπα
  choice: Tôi thưa
  rationale: δέ là từ nối nhẹ, không cần dịch thành một quan hệ tương phản rõ. “Thưa” tự nhiên trong lời đáp kính trọng và đại từ “tôi” thể hiện ἐγώ mà không thêm nhấn mạnh.
- source_word: Τίς εἶ, κύριε;
  choice: Lạy Chúa, Ngài là ai?
  rationale: Cách đặt câu này tự nhiên và trang trọng trong tiếng Việt. κύριε được dịch là “Chúa” vì người đang nói xuất hiện từ trời và ngay sau đó tự xưng là Jêsus; đại từ kính ngữ “Ngài” phù hợp với cách xưng hô ấy.
- source_word: ὁ δὲ κύριος εἶπεν
  choice: Chúa phán
  rationale: κύριος chỉ nhân vật đã được xác định nên tiếng Việt không cần mạo từ tương ứng. “Phán” phù hợp với lời của Chúa trong văn phong Kinh Thánh trang trọng; δέ là từ nối nhẹ và có thể được thể hiện tự nhiên bằng việc chuyển sang mệnh đề kế tiếp mà không cần thêm liên từ.
- source_word: Ἐγώ εἰμι Ἰησοῦς
  choice: Ta là Jêsus
  rationale: Đây là lời tự nhận trực tiếp. “Ta” giữ sắc thái uy quyền của người nói trong ngữ cảnh này nhưng không thêm từ nhấn mạnh ngoài nguyên văn.
- source_word: ὃν σὺ διώκεις
  choice: Đấng ngươi đang bắt bớ
  rationale: ὃν là đại từ quan hệ chỉ Jêsus; “Đấng” là cách diễn đạt trang trọng, tự nhiên khi chỉ về Ngài. διώκεις mang nghĩa thù nghịch là “bắt bớ,” và “đang” thể hiện hành động đang tiếp diễn. “Ngươi” giữ sự chuyển đổi đại từ rõ ràng trong lời Chúa nói với Sau-lơ.
theological_decisions:
- issue: Cách dịch κύριε trong lời Sau-lơ và κύριος trong lời dẫn
  choice: Chúa
  alternative: ngài/ông (lối xưng hô kính trọng)
  rationale: Riêng hô cách κύριε có thể là lời xưng hô kính trọng, nhưng trong cuộc hiện ra từ trời này, người nói lập tức tự nhận là Jêsus, còn lời dẫn gọi Ngài là κύριος. “Chúa” bảo toàn sức nặng thần học của ngữ cảnh mà không vượt quá điều bản văn nói; khả năng từ vựng khác được ghi ở chú thích.
- issue: Quan hệ giữa việc bắt bớ các tín hữu và bắt bớ Jêsus
  choice: Giữ nguyên lời trực tiếp “Đấng ngươi đang bắt bớ”
  alternative: Diễn giải rằng Sau-lơ bắt bớ những người theo Jêsus
  rationale: Bản văn trực tiếp đồng nhất đối tượng bị bắt bớ với Jêsus. Không diễn giải thay để bảo toàn sự căng thẳng thần học và ý nghĩa liên đới vốn có trong câu.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng và dễ hiểu. Dùng “thưa/phán,” “Ta/ngươi” để phân biệt rõ vai giao tiếp và giữ phẩm cách của lời thuật Kinh Thánh; dùng cách viết tên “Jêsus” theo quy ước của dự án.
