id: ACT.26.14
reference: Acts 26:14
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: πάντων ⸀τε καταπεσόντων ἡμῶν εἰς τὴν γῆν ἤκουσα φωνὴν ⸀λέγουσαν πρός ⸀με τῇ Ἑβραΐδι διαλέκτῳ· Σαοὺλ Σαούλ, τί με διώκεις; σκληρόν σοι πρὸς κέντρα λακτίζειν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/014.yaml
  text: And when we had all fallen to the ground[a], I heard a voice saying to me in the Hebrew language, ‘Saul, Saul[b], why are you persecuting me? It is hard for you to kick against the goads.’
translation:
  language: vi
  text: 'Khi tất cả chúng tôi đã ngã xuống đất, tôi nghe một giọng nói bằng tiếng Hê-bơ-rơ[a] nói với tôi: “Sau-lơ, Sau-lơ, sao ngươi bắt bớ ta? Thật khó cho ngươi khi đá lại những gậy nhọn thúc súc vật.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể hiểu là “bằng tiếng A-ram”; nguyên văn Hy Lạp nói sát nghĩa là “bằng ngôn ngữ/phương ngữ Hê-bơ-rơ”.
    reason: alternative_reading
  - marker: b
    text: 'Đây là một câu tục ngữ: con vật đá lại gậy nhọn dùng để thúc nó sẽ chỉ tự làm mình đau; chống cự người đang nói cũng chỉ gây hại cho chính mình.'
    reason: cultural_note
lexical_decisions:
- source_word: πάντων τε καταπεσόντων ἡμῶν εἰς τὴν γῆν
  choice: Khi tất cả chúng tôi đều ngã xuống đất
  rationale: Chuyển kết cấu sở hữu cách tuyệt đối thành mệnh đề thời gian tự nhiên trong tiếng Việt, đồng thời giữ πάντων là “tất cả” và hành động ngã xảy ra trước khi Phao-lô nghe tiếng nói.
- source_word: ἤκουσα φωνὴν λέγουσαν πρός με
  choice: tôi nghe một tiếng nói với mình
  rationale: φωνή trong ngữ cảnh có lời phát ngôn là “tiếng nói”; “với mình” diễn đạt tự nhiên đối tượng được nói trực tiếp và tránh lặp “tôi” nặng nề.
- source_word: τῇ Ἑβραΐδι διαλέκτῳ
  choice: bằng tiếng Hê-bơ-rơ
  rationale: Theo sát cách gọi Ἑβραΐς của nguyên văn Hy Lạp; khả năng cụm từ chỉ tiếng A-ram được giữ trong chú thích thay vì đưa vào chính văn.
- source_word: Σαοὺλ Σαούλ
  choice: Sau-lơ, Sau-lơ
  rationale: Dùng dạng phiên âm quen thuộc trong tiếng Việt và giữ nguyên sự lặp lại có tính nhấn mạnh.
- source_word: τί με διώκεις;
  choice: sao ngươi bắt bớ ta?
  rationale: “Bắt bớ” truyền đạt đúng hành động truy đuổi, áp bức mang tính thù địch; “sao” tự nhiên trong lời chất vấn trực tiếp.
- source_word: σκληρόν σοι πρὸς κέντρα λακτίζειν
  choice: Thật khó cho ngươi khi đá lại những gậy nhọn thúc súc vật
  rationale: 'Giữ hình ảnh cụ thể và cấu trúc của câu tục ngữ: κέντρα là các dụng cụ nhọn dùng để thúc súc vật, còn λακτίζειν là đá lại. Không diễn giải ý nghĩa ẩn dụ ngay trong chính văn.'
theological_decisions:
- issue: Ý nghĩa của τῇ Ἑβραΐδι διαλέκτῳ
  choice: bằng tiếng Hê-bơ-rơ
  alternative: bằng tiếng A-ram
  rationale: Chính văn phản ánh trực tiếp từ ngữ Hy Lạp, vốn gọi ngôn ngữ ấy là “Hê-bơ-rơ”; cách hiểu lịch sử-ngôn ngữ rằng đây có thể là tiếng A-ram được nêu trong chú thích để không giải quyết thay sự mơ hồ của nguồn.
- issue: Quan hệ giữa người nói và Sau-lơ trong đại từ xưng hô
  choice: ngươi / ta
  alternative: anh / tôi
  rationale: “Ngươi / ta” phù hợp lời phán trang trọng và tương quan quyền uy trong ngữ cảnh, nhưng không thêm một tước hiệu hay diễn giải thần học không có trong câu Hy Lạp.
translation_notes:
  register: Văn phong hiện đại, rõ ràng và trang trọng. “Gậy nhọn thúc súc vật” giải nghĩa vật dụng cổ ngay trong cụm danh từ mà vẫn giữ nguyên hình ảnh tục ngữ; đại từ “ngươi / ta” duy trì sắc thái uy nghiêm của lời trực tiếp.
