  - severity: medium
    issue: “Trong một góc khuất” không phản ánh chính xác nhất thành ngữ ἐν γωνίᾳ.
    rationale: Trong tiếng Việt hiện đại, “góc khuất” thường chỉ chỗ khó nhìn hoặc điểm mù. Nguyên ngữ là hình ảnh về điều không làm cách bí mật hay âm thầm; “ở một nơi kín đáo” truyền đạt chức năng thành ngữ chính xác hơn, còn chú thích bảo lưu hình ảnh gốc.
  - severity: low
    issue: Vị trí neo chú thích [a] nên gắn trực tiếp với cách nói “mạnh dạn thưa”.
    rationale: Chú thích a giải thích παρρησιαζόμενος, không phải toàn bộ mệnh đề.
