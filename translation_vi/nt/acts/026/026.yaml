id: ACT.26.26
reference: Acts 26:26
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐπίσταται γὰρ περὶ τούτων ὁ βασιλεύς, πρὸς ὃν ⸀καὶ παρρησιαζόμενος λαλῶ· λανθάνειν γὰρ ⸀αὐτὸν τούτων οὐ πείθομαι ⸀οὐθέν, οὐ γάρ ⸀ἐστιν ἐν γωνίᾳ πεπραγμένον τοῦτο.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/026.yaml
  text: For the king knows about these things[a], and I speak boldly to him. For I am persuaded that none of these things has escaped his notice[c][b], because this has not been done in a corner.
translation:
  language: vi
  text: Vì vua biết những việc này, nên tôi mạnh dạn thưa với vua.[a] Tôi tin chắc rằng không điều nào trong những việc ấy lọt khỏi tầm hiểu biết của vua,[b] vì việc này không hề diễn ra ở một nơi kín đáo.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “tôi thẳng thắn nói với vua” hoặc “tôi tự do nói với vua.” Từ Hy Lạp diễn tả lời nói thẳng thắn, công khai và đầy tự tin.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “không điều nào trong những việc ấy bị giấu khỏi vua” hoặc “không điều nào trong những việc ấy không được vua biết đến.”'
    reason: lexical_alternative
  - marker: c
    text: “Không diễn ra ở một nơi kín đáo” dịch một cách nói hình ảnh, nghĩa là sự việc không xảy ra bí mật, âm thầm hay ít người biết đến.
    reason: cultural_note
lexical_decisions:
- source_word: ἐπίσταται
  choice: biết rõ
  rationale: Diễn đạt sự biết và quen thuộc với các sự việc; “biết rõ” tự nhiên trong tiếng Việt và phù hợp với lời quả quyết của Phao-lô.
- source_word: περὶ τούτων
  choice: những việc này
  rationale: Chỉ các sự việc đang được bàn đến, không thu hẹp phạm vi hơn nguyên văn.
- source_word: παρρησιαζόμενος λαλῶ
  choice: tôi mạnh dạn thưa
  rationale: “Mạnh dạn” giữ sắc thái nói thẳng thắn, công khai và đầy tự tin; “thưa” phù hợp với việc Phao-lô nói trực tiếp với vua mà vẫn giữ vẻ trang trọng.
- source_word: λανθάνειν ... αὐτὸν
  choice: lọt khỏi sự chú ý của vua
  rationale: Thành ngữ tự nhiên diễn đạt ý một điều không được người ấy nhận biết hoặc để ý.
- source_word: οὐ πείθομαι οὐθέν
  choice: Tôi tin chắc rằng không điều nào
  rationale: πείθομαι diễn tả sự xác tín; cách chuyển cấu trúc phủ định kép sang tiếng Việt giữ đúng nội dung mà vẫn rõ ràng.
- source_word: πεπραγμένον
  choice: diễn ra
  rationale: Trong ngữ cảnh nói về một chuỗi sự kiện, “diễn ra” tự nhiên hơn “được làm” mà vẫn thể hiện điều đã xảy ra.
- source_word: ἐν γωνίᾳ
  choice: trong một góc khuất
  rationale: Giữ hình ảnh “trong góc” đồng thời giúp độc giả Việt hiểu sắc thái kín đáo, bí mật hoặc ít người biết.
- source_word: τοῦτο
  choice: việc này
  rationale: Giữ phạm vi quy chiếu rộng và chưa xác định cụ thể như nguyên văn.
theological_decisions:
- issue: Phạm vi của “việc này” và tính công khai của các sự kiện
  choice: Giữ cách diễn đạt trung tính “việc này”, nhấn mạnh rằng sự việc không xảy ra kín đáo nhưng không xác định cụ thể phạm vi.
  alternative: Hiểu hẹp là cái chết và sự sống lại của Chúa Giê-su, hoặc hiểu rộng là toàn bộ phong trào Cơ Đốc và vụ án của Phao-lô.
  rationale: τοῦτο có thể chỉ chung các sự kiện đang được đề cập, nhưng câu này không xác định chính xác; bản dịch không nên tự ý thu hẹp hay mở rộng.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “vua” nhất quán để phản ánh ὁ βασιλεύς và “thưa với vua” nhằm thể hiện lời nói trực tiếp, kính trọng. Giữ hình ảnh thành ngữ “góc khuất” và giải thích bằng chú thích.
