id: ACT.26.13
reference: Acts 26:13
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἡμέρας μέσης κατὰ τὴν ὁδὸν εἶδον, βασιλεῦ, οὐρανόθεν ὑπὲρ τὴν λαμπρότητα τοῦ ἡλίου περιλάμψαν με φῶς καὶ τοὺς σὺν ἐμοὶ πορευομένους·
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/013.yaml
  text: At midday[a], along the road, I saw, O king, a light from heaven, brighter than the sun, shining around me and those traveling with me.
translation:
  language: vi
  text: Vào giữa trưa, dọc đường, thưa vua, tôi thấy một luồng sáng từ trời, rực hơn ánh mặt trời, chiếu bao quanh tôi và những người cùng đi với tôi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡμέρας μέσης
  choice: Vào giữa trưa
  rationale: Cấu trúc sở hữu cách chỉ thời điểm giữa ngày; cách diễn đạt này tự nhiên và giữ rõ tính xác định về thời gian.
- source_word: κατὰ τὴν ὁδὸν
  choice: dọc đường
  rationale: Chỉ bối cảnh trên hành trình; “dọc đường” gọn, tự nhiên và giữ hình ảnh cụ thể của con đường.
- source_word: εἶδον
  choice: tôi thấy
  rationale: Động từ tri giác ở thì aorist được chuyển thẳng, không thêm sắc thái ngoài nguyên văn.
- source_word: βασιλεῦ
  choice: thưa vua
  rationale: Giữ lời xưng hô trực tiếp và kính trọng với vua Ạc-ríp-pa, đồng thời tự nhiên trong tiếng Việt hiện đại.
- source_word: οὐρανόθεν
  choice: từ trời
  rationale: Diễn tả nguồn gốc từ thiên giới, phù hợp văn cảnh mặc khải trong Công Vụ mà không diễn giải thêm.
- source_word: ὑπὲρ τὴν λαμπρότητα τοῦ ἡλίου
  choice: rực hơn ánh mặt trời
  rationale: ὑπέρ với đối cách biểu thị sự vượt trội; “rực hơn ánh mặt trời” vừa tự nhiên vừa giữ danh từ λαμπρότης qua từ “ánh”.
- source_word: φῶς
  choice: một luồng sáng
  rationale: Danh từ không có mạo từ giới thiệu hiện tượng ánh sáng; “luồng sáng” là cách nói tự nhiên trong tiếng Việt và không hàm ý một nguồn sáng vật thể.
- source_word: περιλάμψαν
  choice: chiếu bao quanh
  rationale: Giữ ý ánh sáng tỏa chiếu vòng quanh Phao-lô và những người đồng hành.
- source_word: τοὺς σὺν ἐμοὶ πορευομένους
  choice: những người cùng đi với tôi
  rationale: Chuyển sát nghĩa phân từ hiện tại và σύν, không thêm chi tiết ngoài bản Hy Lạp.
theological_decisions:
- issue: Cách dịch οὐρανόθεν trong văn cảnh khải tượng
  choice: từ trời
  alternative: từ bầu trời
  rationale: “Từ trời” giữ được ý nghĩa thiên giới thường thấy trong Lu-ca–Công Vụ, nhưng không diễn giải bản chất của biến cố xa hơn nguyên văn.
- issue: Mức độ vượt trội của ánh sáng so với mặt trời
  choice: rực hơn ánh mặt trời
  alternative: vượt quá độ sáng của mặt trời
  rationale: Bản dịch chính truyền đạt rõ phép so sánh vượt trội của ὑπέρ và vẫn phản ánh λαμπρότης, đồng thời tránh lối diễn đạt nặng nề.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đảo “thưa vua” vào giữa câu để giữ lời gọi trực tiếp của nguyên văn mà không dùng lối cổ “hỡi vua”. Không đặt chú thích vì bản dịch chính đã thể hiện trực tiếp ý ánh sáng vượt hơn ánh mặt trời.
