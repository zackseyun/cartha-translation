    rationale: τὰ πολλά γράμματα nói đến nhiều chữ nghĩa, nhiều học hành/nghiên cứu; trong câu này đó là lời Phê-tu quy kết việc học nhiều đã khiến Phao-lô điên. “Uyên bác” dễ chuyển thành sự công nhận phẩm chất đáng ca ngợi, vì vậy “Học nhiều” giữ được cả tính tự nhiên lẫn giọng buộc tội.
  - severity: low
    issue: Chú thích hiện có nêu “việc học quá nhiều” và “nhiều sách vở” nhưng chưa phản ánh trực tiếp lựa chọn sửa.
    rationale: Khi bản văn chính dùng “Học nhiều,” chú thích nên trình bày lựa chọn “nhiều chữ nghĩa” và khả năng “nhiều sách vở,” để bảo lưu phạm vi nghĩa của γράμματα mà không diễn giải quá mức.
