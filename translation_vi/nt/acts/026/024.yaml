base_translation:
  language: en
  yaml_path: translation/nt/acts/026/024.yaml
  text: As he was saying these things in his defense[a], Festus said with a loud voice, “You are out of your mind, Paul! Your great learning is driving you into madness.”
translation:
  language: vi
  text: 'Khi Phao-lô đang nói những điều ấy để biện hộ, Phê-tu lớn tiếng nói: “Phao-lô, ông mất trí rồi! Học nhiều[a] đang khiến ông hóa điên.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “Nhiều chữ nghĩa”; cũng có thể hiểu là “nhiều sách vở.”'
    reason: γράμματα có thể chỉ chữ nghĩa, sách vở hoặc sự học; “học nhiều” phù hợp ngữ cảnh, còn chú thích bảo lưu các cách hiểu gần nghĩa khác.
lexical_decisions:
- source_word: ἀπολογουμένου
  choice: đang nói những điều ấy để biện hộ
  rationale: Phân từ thuộc cách trong cấu trúc độc lập diễn tả hành động xảy ra đồng thời; “biện hộ” giữ được sắc thái pháp lý và lời tự bào chữa của Phao-lô.
- source_word: μεγάλῃ τῇ φωνῇ
  choice: lớn tiếng
  rationale: Cụm tặng cách chỉ cách thức; “lớn tiếng” tự nhiên trong tiếng Việt và thể hiện rõ việc Phê-tu chen ngang bằng giọng mạnh.
- source_word: φησιν
  choice: nói
  rationale: Dù tiếng Hy Lạp dùng hiện tại lịch sử, tiếng Việt kể chuyện tự nhiên không cần đánh dấu thì, nên “nói” phù hợp với mạch thuật sự.
- source_word: Μαίνῃ
  choice: ông mất trí rồi
  rationale: μαίνομαι chỉ tình trạng điên hoặc mất trí. Cách diễn đạt này mạnh, rõ và tự nhiên trong tiếng Việt hiện đại mà không mang sắc thái chẩn đoán y khoa quá mức.
- source_word: τὰ πολλά ... γράμματα
  choice: học vấn uyên bác
  rationale: γράμματα có thể chỉ chữ nghĩa, sách vở hoặc học vấn. Trong ngữ cảnh Phê-tu phản ứng trước lập luận của Phao-lô, “học vấn uyên bác” truyền đạt nghĩa thành ngữ phù hợp, đồng thời chú thích bảo lưu khả năng hiểu gần nghĩa đen hơn.
- source_word: εἰς μανίαν περιτρέπει
  choice: đang khiến ông hóa điên
  rationale: Cách dịch này giữ cả ý gây nên của περιτρέπει lẫn hướng chuyển vào trạng thái được diễn tả bởi εἰς μανίαν.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “ông” thể hiện lời nói trực tiếp giữa các nhân vật mà không thêm sắc thái tôn kính quá mức. Giữ sự lặp ý giữa “mất trí” và “hóa điên” như trong nguyên văn.
