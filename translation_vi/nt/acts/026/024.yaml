  to: 'Khi Phao-lô đang nói những điều ấy để biện hộ, Phê-tu lớn tiếng nói: “Phao-lô, ông mất trí rồi! Học nhiều[a] đang khiến ông hóa điên.”'
  rationale: Sửa “học vấn uyên bác” thành “Học nhiều” để tránh thêm sắc thái tán thưởng và phản ánh sát hơn lời quy kết của Phê-tu rằng việc học nhiều đã đưa Phao-lô đến tình trạng điên loạn. Các yếu tố khác của bản dịch đã trung thành với nguyên văn và tự nhiên trong tiếng Việt hiện đại.
