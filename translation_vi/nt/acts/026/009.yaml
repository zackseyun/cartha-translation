  naturalness: Câu sửa vẫn tự nhiên, trang trọng và rõ nghĩa trong tiếng Việt hiện đại. «Chính tôi đã từng nghĩ rằng mình phải» diễn đạt tốt tính tự thú và quan điểm quá khứ.
  terminology: Giữ «danh» để bảo toàn thành ngữ Kinh Thánh của ὄνομα, không diễn giải thành uy quyền hay chính nghĩa. «Giê-su người Na-xa-rét» phản ánh danh xưng Ναζωραῖος mà không thêm tước hiệu.
