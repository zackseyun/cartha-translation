source:
  edition: SBLGNT
  text: Ἐγὼ μὲν οὖν ἔδοξα ἐμαυτῷ πρὸς τὸ ὄνομα Ἰησοῦ τοῦ Ναζωραίου δεῖν πολλὰ ἐναντία πρᾶξαι·
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/009.yaml
  text: So I myself indeed thought that I ought to do many things in opposition to the name of Jesus the Nazarene[a].
translation:
  language: vi
  text: Vậy, chính tôi đã từng nghĩ rằng mình phải làm nhiều điều chống lại danh Giê-su người Na-xa-rét.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐγὼ
  choice: chính tôi
  rationale: Đại từ được nêu rõ để nhấn mạnh lời tự thú mang tính cá nhân của Phao-lô; “chính tôi” diễn đạt tự nhiên sắc thái ấy trong tiếng Việt.
- source_word: μὲν οὖν
  choice: Vậy
  rationale: Trong ngữ cảnh, tổ hợp tiểu từ nối tiếp lập luận và chuyển sang kinh nghiệm trước kia của Phao-lô. “Vậy” giữ mạch liên kết mà không khiến câu tiếng Việt nặng nề; sắc thái nhấn nhẹ của μέν được hỗ trợ bởi “chính tôi”.
- source_word: ἔδοξα ἐμαυτῷ
  choice: đã từng nghĩ rằng mình
  rationale: Thành ngữ nói đến sự đánh giá trong chính suy nghĩ của chủ thể. “Đã từng nghĩ rằng mình” vừa tự nhiên vừa làm rõ đây là quan niệm trước kia của Phao-lô.
- source_word: δεῖν
  choice: phải
  rationale: Diễn tả điều Phao-lô khi ấy cho là cần thiết hoặc có bổn phận phải làm, chứ không khẳng định đó là sự cần thiết khách quan.
- source_word: πολλὰ ἐναντία πρᾶξαι
  choice: làm nhiều điều chống lại
  rationale: Giữ cả ý về nhiều hành động và tính đối nghịch của chúng, bằng cách diễn đạt rõ ràng, thông dụng trong tiếng Việt hiện đại.
- source_word: πρὸς τὸ ὄνομα
  choice: chống lại danh
  rationale: πρός kết hợp với ἐναντία mang nghĩa đối nghịch. Giữ “danh” để bảo tồn thành ngữ Kinh Thánh, không thu hẹp thành chỉ “thẩm quyền” hay “sự nghiệp”.
- source_word: Ἰησοῦ τοῦ Ναζωραίου
  choice: Chúa Giê-su người Na-xa-rét
  rationale: “Người Na-xa-rét” là cách gọi tự nhiên trong tiếng Việt, bảo tồn danh xưng gắn với nguồn gốc và căn tính của Đức Giê-su. “Chúa” phù hợp lối xưng gọi Kinh Thánh trang trọng trong tiếng Việt, dù từ tương ứng không đứng riêng trong cụm Hy Lạp này.
theological_decisions:
- issue: Ý nghĩa của “danh” trong mối liên hệ với Chúa Giê-su
  choice: Giữ thành ngữ “danh Chúa Giê-su”
  alternative: thẩm quyền của Chúa Giê-su; chính nghĩa của Chúa Giê-su
  rationale: ὄνομα có thể đại diện cho chính con người, uy quyền và sự tuyên xưng công khai về Chúa Giê-su. Giữ “danh” bảo toàn trường nghĩa và không buộc câu vào một cách giải thích duy nhất.
- issue: Tính chủ quan của sự cần thiết được diễn tả bởi δεῖν
  choice: Đặt “phải” dưới động từ “đã từng nghĩ”
  alternative: Tôi buộc phải; đó là điều cần thiết
  rationale: Cấu trúc cho biết đây là điều Phao-lô từng tự cho là mình phải làm, không phải lời xác nhận thần học rằng những hành động chống nghịch ấy thật sự cần thiết.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc “chính tôi đã từng nghĩ rằng mình phải” giữ trọng tâm tự thú và quan điểm trước kia của Phao-lô; “danh” bảo tồn thành ngữ Kinh Thánh.
