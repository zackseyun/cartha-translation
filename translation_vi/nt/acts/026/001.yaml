  rationale: Bản sửa loại bỏ danh hiệu không có trong nguồn, điều chỉnh cử chỉ cho sát nghĩa ἐκτείνας τὴν χεῖρα, và dùng đại từ hiện đại, trung tính hơn. Cấu trúc hai mệnh đề cùng dấu hai chấm vẫn chuẩn bị cho lời biện hộ tiếp theo và bảo toàn sắc thái pháp lý của nguyên văn.
