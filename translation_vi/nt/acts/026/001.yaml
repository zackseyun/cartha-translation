  text: Ἀγρίππας δὲ πρὸς τὸν Παῦλον ἔφη· Ἐπιτρέπεταί σοι ⸀ὑπὲρ σεαυτοῦ λέγειν. τότε ὁ Παῦλος ⸂ἐκτείνας τὴν χεῖρα ἀπελογεῖτο⸃·
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/001.yaml
  text: 'Then Agrippa said to Paul[b][a], “You are permitted to speak on your own behalf.” Then Paul stretched out his hand and made his defense:'
translation:
  language: vi
  text: 'Bấy giờ A-gríp-pa nói với Phao-lô: “Ông được phép tự biện hộ.” Rồi Phao-lô đưa tay ra và biện hộ:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀγρίππας
  choice: vua A-gríp-pa
  rationale: Dùng cách phiên âm tên riêng quen thuộc trong tiếng Việt; thêm “vua” theo ngữ cảnh trực tiếp để người đọc nhận rõ vai trò của A-gríp-pa.
- source_word: δὲ
  choice: Bấy giờ
  rationale: Đánh dấu bước chuyển tiếp trong mạch kể một cách tự nhiên, trang trọng.
- source_word: πρὸς τὸν Παῦλον ἔφη
  choice: nói với Phao-lô
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt đối với cấu trúc chỉ người được nói với.
- source_word: Ἐπιτρέπεταί σοι
  choice: Ngươi được phép
  rationale: Giữ sắc thái được ban quyền và giọng nói trang trọng của bối cảnh xét xử.
- source_word: ὑπὲρ σεαυτοῦ λέγειν
  choice: tự biện hộ cho mình
  rationale: Trong bối cảnh pháp lý, cụm từ nói đến việc lên tiếng vì chính mình; “tự biện hộ” truyền đạt rõ ý mà không thêm nội dung vào lời biện hộ.
- source_word: τότε
  choice: liền
  rationale: Thể hiện trình tự tức thời được τότε đánh dấu, đồng thời tránh lặp “bấy giờ” trong cùng câu.
- source_word: ἐκτείνας τὴν χεῖρα
  choice: giơ tay lên
  rationale: Diễn đạt tự nhiên cử chỉ đưa tay ra khi bắt đầu nói, không xác định thêm kiểu cử chỉ.
- source_word: ἀπελογεῖτο
  choice: biện hộ rằng
  rationale: Động từ mang nghĩa trình bày lời biện hộ, đặc biệt trong bối cảnh pháp lý; dấu hai chấm sau câu dẫn mở vào nội dung tiếp theo.
theological_decisions:
- issue: Sắc thái pháp lý của ὑπὲρ σεαυτοῦ λέγειν và ἀπελογεῖτο
  choice: Dịch bằng “tự biện hộ cho mình” và “biện hộ”
  alternative: “nói về chính mình” và “trình bày”
  rationale: Ngữ cảnh phiên xét xử hỗ trợ sắc thái biện hộ pháp lý, nhưng bản dịch không gọi đây là một phiên tòa chính thức hay hàm ý Phao-lô có tội.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “ngươi” phản ánh lời của một vị vua ban phép cho người ở địa vị thấp hơn trong bối cảnh cổ đại; tên riêng được phiên âm theo lối Việt hóa quen thuộc.
