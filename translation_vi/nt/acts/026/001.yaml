review_pass:
  verdict: revise
  source_fidelity: Cần bỏ “vua”, vì danh hiệu này không có trong câu Hy Lạp, dù đúng theo bối cảnh rộng hơn. “Giơ tay lên” thường gợi cử chỉ nâng tay, trong khi ἐκτείνας τὴν χεῖρα là đưa/duỗi tay ra. Bản sửa giữ sắc thái tự biện hộ pháp lý của ὑπὲρ σεαυτοῦ λέγειν và ἀπελογεῖτο.
  naturalness: “Ngươi” mang sắc thái cổ và dễ tạo khoảng cách xã hội quá mức đối với tiếng Việt chuẩn hiện đại. “Ông” vẫn lịch sự, tự nhiên trong lời nói công khai có tính pháp lý. “Rồi” phân biệt τότε với liên từ mở đầu câu và tạo mạch kể rõ ràng.
  terminology: Giữ các tên Việt hóa A-gríp-pa và Phao-lô như bản thảo. “Tự biện hộ” phù hợp cả hai cụm pháp lý trong câu mà không thêm chi tiết về thủ tục xét xử.
  issues:
  - severity: medium
