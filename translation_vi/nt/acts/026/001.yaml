    rationale: Ἀγρίππας trong câu chỉ nêu tên riêng; danh hiệu không xuất hiện trong văn bản nguồn. Thông tin đúng theo ngữ cảnh không nên được đưa vào bản dịch câu khi không cần thiết.
  - severity: medium
    issue: “Giơ tay lên” không sát cử chỉ được mô tả.
    rationale: ἐκτείνας τὴν χεῖρα có nghĩa là đưa hoặc duỗi tay ra; “lên” thêm hướng chuyển động không được nêu.
  - severity: low
    issue: Đại từ “ngươi” không phù hợp tối ưu với tiếng Việt chuẩn hiện đại.
    rationale: Từ này có sắc thái cổ rõ và có thể bị hiểu là khinh miệt. “Ông” truyền đạt lời cấp phép trang trọng mà không áp đặt sắc thái không có trong nguyên văn.
