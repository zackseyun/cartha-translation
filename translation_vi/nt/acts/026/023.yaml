id: ACT.26.23
reference: Acts 26:23
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἰ παθητὸς ὁ χριστός, εἰ πρῶτος ἐξ ἀναστάσεως νεκρῶν φῶς μέλλει καταγγέλλειν τῷ ⸀τε λαῷ καὶ τοῖς ἔθνεσιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/023.yaml
  text: that the Messiah would suffer[a], and that, as the first to rise from the dead[d][c][b], he would proclaim light both to the people and to the Gentiles.
translation:
  language: vi
  text: rằng Đấng Mê-si phải chịu khổ[a], và rằng, là người đầu tiên sống lại từ cõi chết, Ngài sẽ công bố ánh sáng cho cả dân chúng[b] lẫn các dân ngoại[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “Đấng Ki-tô.” Danh hiệu Hy Lạp Χριστός chỉ Đấng được xức dầu; ở đây dịch là “Đấng Mê-si” vì câu nằm trong bối cảnh lời tiên tri.
    reason: alternative_reading
  - marker: b
    text: “Dân chúng” ở đây nhiều khả năng chỉ dân Do Thái, đối lập với “các dân ngoại.”
    reason: lexical_alternative
  - marker: c
    text: Cũng có thể dịch là “các dân tộc”; trong ngữ cảnh này, cụm từ chỉ những dân không thuộc dân Do Thái.
    reason: lexical_alternative
lexical_decisions:
- source_word: παθητὸς
  choice: phải chịu khổ
  rationale: Tính từ này diễn tả Đấng Mê-si là Đấng chịu đau khổ hoặc phải chịu đau khổ trong lời tiên tri. Cách diễn đạt bằng động từ tự nhiên trong tiếng Việt và giữ được sắc thái định liệu mà không dùng thuật ngữ triết học khó hiểu.
- source_word: ὁ χριστός
  choice: Đấng Mê-si
  rationale: Trong ngữ cảnh Phao-lô tóm lược lời Môi-se và các nhà tiên tri về Đấng được xức dầu, Χριστός mang chức năng danh hiệu rõ rệt.
- source_word: πρῶτος ἐξ ἀναστάσεως νεκρῶν
  choice: là người đầu tiên sống lại từ cõi chết
  rationale: Giữ rõ ý về thứ tự ưu tiên của πρῶτος, đồng thời diễn đạt cụm Hy Lạp cô đọng bằng tiếng Việt tự nhiên. Bản dịch không tự bổ sung cách giải thích thần học về tính chất sự sống lại ấy.
- source_word: φῶς
  choice: ánh sáng
  rationale: Giữ nguyên hình ảnh Kinh Thánh rộng, có thể bao hàm sự mặc khải, cứu rỗi và hy vọng, thay vì thu hẹp bằng một lời giải nghĩa.
- source_word: μέλλει καταγγέλλειν
  choice: sẽ công bố
  rationale: Trong lời tường thuật gián tiếp này, μέλλω với động từ nguyên mẫu chỉ điều sẽ xảy ra hoặc đã được định trước; “sẽ công bố” tự nhiên và không gợi sai về tính tức thời.
- source_word: τῷ τε λαῷ
  choice: cho cả dân này
  rationale: λαός ở đây nhiều khả năng chỉ dân Do Thái, đối lập với các dân ngoại. “Dân này” giữ cách gọi không nêu đích danh nhưng giúp câu tiếng Việt thể hiện một cộng đồng xác định trong ngữ cảnh.
- source_word: τοῖς ἔθνεσιν
  choice: các dân ngoại
  rationale: Trong thế đối chiếu với λαός, cụm từ chỉ những dân không thuộc dân Do Thái; “các dân ngoại” truyền đạt rõ sự đối chiếu dân tộc-tôn giáo.
- source_word: τε ... καὶ
  choice: cả ... lẫn
  rationale: Cấu trúc tương liên tiếng Việt này thể hiện tự nhiên hai nhóm cùng nhận lời công bố.
theological_decisions:
- issue: Ý nghĩa việc Đấng Mê-si là người đầu tiên sống lại từ cõi chết
  choice: Giữ lời khẳng định về địa vị thứ nhất trong sự sống lại mà không giải nghĩa thêm trong chính văn.
  alternative: Người đầu tiên sống lại để không bao giờ chết nữa; trái đầu mùa của sự sống lại sau cùng.
  rationale: Câu Hy Lạp khẳng định πρῶτος nhưng không trình bày đầy đủ sắc thái thần học nhằm phân biệt với những trường hợp trước đó được làm cho sống lại. Việc giữ cách nói của nguồn bảo tồn sự cô đọng và căng thẳng thần học chân thực.
- issue: Phạm vi của “dân này”
  choice: Để đối chiếu với “các dân ngoại” cho thấy nhiều khả năng đây là dân Do Thái.
  alternative: Dân Do Thái; dân Y-sơ-ra-ên.
  rationale: Nguồn dùng λαός chứ không trực tiếp dùng tên Y-sơ-ra-ên. Chính văn giữ mức độ hàm ẩn ấy, còn chú thích làm rõ sở chỉ có khả năng nhất.
- issue: Quan hệ cú pháp giữa sự chịu khổ, sự sống lại và việc công bố ánh sáng
  choice: 'Trình bày hai mệnh đề song song: Đấng Mê-si phải chịu khổ, và với tư cách người đầu tiên sống lại, Ngài sẽ công bố ánh sáng.'
  alternative: Hiểu εἰ πρῶτος như một mệnh đề độc lập rằng Ngài phải là người đầu tiên nhờ sự sống lại từ cõi chết mà công bố ánh sáng.
  rationale: Cú pháp Hy Lạp cô đọng và cho phép cảm nhận sự gắn kết chặt giữa πρῶτος, sự sống lại và καταγγέλλειν. Bản dịch chọn cách đọc tự nhiên nhất nhưng không thêm nội dung vượt quá nguồn.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Dùng “Đấng Mê-si” như một danh hiệu trong bối cảnh tiên tri; “Ngài” làm đại từ kính trọng nhưng không viết hoa các đại từ khác. Cấu trúc “rằng ... và rằng ...” bảo tồn hai vế εἰ ... εἰ của bản Hy Lạp, còn “cả ... lẫn ...” thể hiện τε ... καὶ.
