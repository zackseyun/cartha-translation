  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: προγινώσκοντές με ἄνωθεν, ἐὰν θέλωσι μαρτυρεῖν, ὅτι κατὰ τὴν ἀκριβεστάτην αἵρεσιν τῆς ἡμετέρας θρησκείας ἔζησα Φαρισαῖος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/005.yaml
  text: They have known me from the beginning[a], if they are willing to testify[b], that I lived as a Pharisee according to the strictest sect of our religion.
translation:
  language: vi
  text: Họ đã biết tôi từ ban đầu[a]—nếu họ sẵn lòng làm chứng—rằng tôi đã sống như một người Pha-ri-si, theo phái[b] nghiêm ngặt nhất của tôn giáo chúng ta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “từ thuở đầu” hoặc “từ lâu”.'
    reason: lexical_alternative
  - marker: b
    text: Từ Hy Lạp αἵρεσις ở đây có nghĩa là “phái” hoặc “nhóm”, không phải “tà giáo” theo nghĩa kỹ thuật xuất hiện về sau.
    reason: lexical_alternative
lexical_decisions:
- source_word: προγινώσκοντές με
  choice: Họ đã biết tôi
  rationale: Diễn tả việc những người Do Thái đã biết Phao-lô từ trước; cách dịch này tự nhiên trong tiếng Việt và không ép tiền tố προ- thành ý nghĩa thần học 'biết trước'.
- source_word: ἄνωθεν
  choice: từ ban đầu
  rationale: Trong ngữ cảnh này, từ này chỉ thời điểm khởi đầu hay từ trước kia, không có nghĩa không gian 'từ trên'.
- source_word: ἐὰν θέλωσι μαρτυρεῖν
  choice: có thể làm chứng, nếu họ sẵn lòng
  rationale: Giữ sắc thái điều kiện về sự sẵn lòng của θέλωσι và sắc thái pháp lý của μαρτυρεῖν; 'có thể làm chứng' nối tự nhiên với việc họ đã biết Phao-lô.
- source_word: ἀκριβεστάτην
  choice: nghiêm ngặt nhất
  rationale: Dạng so sánh tuyệt đối mô tả mức độ nghiêm cẩn của phái Pha-ri-si; 'nghiêm ngặt nhất' rõ ràng và tự nhiên.
- source_word: αἵρεσιν
  choice: phái
  rationale: Ở đây chỉ một nhóm hay trường phái được nhận diện trong Do Thái giáo, không mang nghĩa kỹ thuật về 'tà giáo' xuất hiện về sau.
- source_word: τῆς ἡμετέρας θρησκείας
  choice: trong tôn giáo của chúng ta
  rationale: Diễn đạt mối quan hệ của phái Pha-ri-si với tôn giáo chung của người Do Thái và giữ đại từ bao gồm 'của chúng ta'.
- source_word: ἔζησα Φαρισαῖος
  choice: tôi đã sống như một người Pha-ri-si
  rationale: Diễn đạt tự nhiên căn tính và nếp sống trước đây của Phao-lô mà động từ aorist tóm lược.
theological_decisions:
- issue: Ý nghĩa của αἵρεσις trong bối cảnh Do Thái giáo
  choice: phái
  alternative: tà giáo; giáo phái
  rationale: Câu này nói đến người Pha-ri-si như một nhóm trong Do Thái giáo. 'Tà giáo' áp đặt sắc thái kết án thần học không có trong ngữ cảnh; 'giáo phái' trong tiếng Việt hiện đại dễ mang sắc thái tiêu cực ngoài ý của bản văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Pha-ri-si” theo cách phiên âm quen thuộc; giữ bối cảnh pháp lý qua “làm chứng” và tránh sắc thái miệt thị khi dịch αἵρεσις.
