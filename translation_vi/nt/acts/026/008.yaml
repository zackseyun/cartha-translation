  text: τί ἄπιστον κρίνεται παρ’ ὑμῖν εἰ ὁ θεὸς νεκροὺς ἐγείρει;
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/008.yaml
  text: Why is it judged unbelievable by you if God raises the dead?
translation:
  language: vi
  text: Tại sao quý vị lại cho rằng việc Đức Chúa Trời khiến người chết sống lại là điều không thể tin được?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τί ... κρίνεται παρ’ ὑμῖν
  choice: Tại sao quý vị lại cho rằng
  rationale: Diễn đạt tự nhiên cấu trúc hỏi có nghĩa đen là “tại sao điều ấy bị quý vị xét là”; παρ’ ὑμῖν ở đây chỉ người đưa ra nhận định, nên dịch là “quý vị ... cho rằng” thay vì “giữa quý vị”.
- source_word: ἄπιστον
  choice: điều không thể tin được
  rationale: Giữ nghĩa “khó tin/không đáng tin” trong ngữ cảnh đánh giá việc người chết sống lại; cách này tự nhiên và không biến từ ngữ thành lời kết án sự vô tín.
- source_word: εἰ ὁ θεὸς νεκροὺς ἐγείρει
  choice: việc Đức Chúa Trời khiến người chết sống lại
  rationale: Trong câu hỏi tu từ, εἰ giới thiệu nội dung bị cho là không thể tin; ἐγείρει được diễn đạt bằng cụm từ Việt ngữ quen thuộc, đồng thời giữ thì hiện tại khái quát.
theological_decisions:
- issue: Sắc thái của εἰ trong câu hỏi tu từ
  choice: 'dịch như nội dung/sự việc: “việc Đức Chúa Trời...”'
  alternative: “nếu Đức Chúa Trời khiến người chết sống lại”
  rationale: Ở đây Phao-lô không bày tỏ nghi ngờ về năng quyền của Đức Chúa Trời nhưng chất vấn phán đoán của người nghe; danh hóa mệnh đề giúp tiếng Việt truyền đạt đúng trọng tâm mà không giải quyết thêm vấn đề thần học.
- issue: Phạm vi của νεκρούς
  choice: “người chết” không có mạo từ xác định
  alternative: “những người chết” hoặc “kẻ chết”
  rationale: Giữ tính khái quát của nguyên văn, không giới hạn vào riêng Chúa Giê-su hay một nhóm người cụ thể.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “quý vị” cho đại từ số nhiều ὑμῖν trong lời biện hộ trước vua và cử tọa; tránh “các ngươi” vì quá cổ và gay gắt.
