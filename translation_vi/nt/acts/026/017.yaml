translation:
  language: vi
  text: giải cứu con khỏi dân chúng và khỏi dân ngoại,[a] là những người Ta sai con đến.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “giải cứu con khỏi dân Do Thái và khỏi dân ngoại.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξαιρούμενός
  choice: giải cứu
  rationale: Phân từ hiện tại trung động diễn tả hành động Chúa Giê-xu giải thoát Phao-lô khỏi những người thù nghịch. “Giải cứu” tự nhiên và giữ rõ sắc thái cứu khỏi nguy hiểm hơn cách dịch sát chữ “đưa ra khỏi”.
- source_word: τοῦ λαοῦ
  choice: dân này
  rationale: Trong thế đối lập với “các dân ngoại”, cụm từ chỉ dân Do Thái. “Dân này” phù hợp với ngữ cảnh lời Phao-lô đang nói trước người nghe Do Thái, đồng thời không đưa cách giải nghĩa “dân Do Thái” thẳng vào chính văn.
- source_word: τῶν ἐθνῶν
  choice: các dân ngoại
  rationale: Trong thế đối lập Do Thái–ngoại bang ở Công Vụ, ἔθνη chỉ những người không thuộc dân Do Thái; “các dân ngoại” truyền đạt đúng nghĩa theo ngữ cảnh và quen thuộc trong tiếng Việt.
- source_word: εἰς οὓς
  choice: là những người ... đến
  rationale: Sau động từ sai phái, εἰς οὓς tự nhiên được diễn đạt trong tiếng Việt bằng mệnh đề quan hệ “những người ... đến”, với đối tượng được đặt sau động từ.
- source_word: ἀποστέλλω
  choice: Ta sai con
  rationale: Thì hiện tại trong bối cảnh trao sứ mạng được diễn đạt tự nhiên bằng “Ta sai con”, vừa trực tiếp vừa trang trọng; đại từ “Ta/con” phù hợp lời Chúa Giê-xu nói với Phao-lô.
theological_decisions:
- issue: Đối tượng của “dân” trong thế đối lập với “các dân ngoại”
  choice: Giữ cách nói “dân này” trong chính văn, với đối tượng theo ngữ cảnh là dân Do Thái.
  alternative: “dân Do Thái” hoặc “dân Y-sơ-ra-ên”
  rationale: Thế đối lập cho thấy rõ đây là dân Do Thái, nhưng nguyên văn chỉ nói “dân”. Bản chính giữ lối diễn đạt của nguồn và chú thích nêu cách hiểu rõ hơn, tránh diễn giải quá mức.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Cấu trúc được điều chỉnh nhẹ cho tự nhiên, nhưng vẫn giữ sự phân biệt giữa “dân này” và “các dân ngoại”, cũng như sắc thái sai phái trực tiếp.
