    issue: “dân này” thêm yếu tố chỉ định không có trong nguyên văn
    rationale: τοῦ λαοῦ có mạo từ xác định nhưng không có đại từ chỉ định tương đương “này.” Trong tiếng Việt, “dân này” có thể tạo sắc thái nhấn mạnh, xa cách, hoặc quy chiếu đặc biệt không được đánh dấu trong tiếng Hy Lạp.
  - severity: low
    issue: Cách đặt “là những người Ta sai con đến” hơi gượng
    rationale: Dù hiểu được, thêm “đến” sau động từ sai phái cho cách diễn đạt tự nhiên hơn và phản ánh rõ εἰς οὓς trong kết cấu tiếng Việt.
  revised_text: giải cứu con khỏi dân chúng và khỏi dân ngoại,[a] là những người Ta sai con đến.
