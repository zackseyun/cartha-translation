    issue: «Trong khi làm những việc ấy» diễn giải Ἐν οἷς như hành động đang thực hiện.
    rationale: Cụm Hy Lạp có chức năng hồi chỉ “trong những sự việc/bối cảnh ấy”; cách dịch cũ dễ nói rằng Phao-lô đang trực tiếp làm các việc trước đó cùng lúc với chuyến đi.
  - severity: medium
    issue: Câu được đóng lại như một mệnh đề độc lập.
    rationale: πορευόμενος là phân từ và mệnh đề chính «tôi đã thấy» chỉ xuất hiện ở câu 13. Bản dịch nên giữ cấu trúc mở để phản ánh liên kết cú pháp giữa hai câu.
  - severity: low
    issue: «của các thượng tế» không nêu rõ quan hệ nguồn cấp.
    rationale: Sở hữu cách τῆς τῶν ἀρχιερέων bổ nghĩa cho thẩm quyền và ủy nhiệm; tiếng Việt tự nhiên nhất là «từ các thượng tế».
