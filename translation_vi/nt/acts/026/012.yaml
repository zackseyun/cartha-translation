  yaml_path: translation/nt/acts/026/012.yaml
  text: In this connection[a], as I was traveling to Damascus with authority and a commission from the chief priests,
translation:
  language: vi
  text: Trong bối cảnh ấy,[a] khi tôi đang trên đường đến Đa-mách với thẩm quyền và sự ủy nhiệm từ các thượng tế,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát hơn: “Trong những việc ấy”; cụm này chỉ về các hành động và ý định Phao-lô vừa kể.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν οἷς
  choice: Trong khi làm những việc ấy
  rationale: Cụm này liên kết hồi chỉ với các hành động và ý định bắt bớ vừa được Phao-lô kể ở trước. Cách dịch giữ hình ảnh 'những việc ấy' của nguyên văn nhưng diễn đạt tự nhiên trong tiếng Việt.
- source_word: πορευόμενος εἰς τὴν Δαμασκὸν
  choice: tôi đi đến Đa-mách
  rationale: Phân từ hiện tại chỉ hành động đang diễn ra trong bối cảnh kể chuyện; tiếng Việt có thể diễn đạt tự nhiên bằng mệnh đề với 'tôi đi đến'.
- source_word: μετ’ ἐξουσίας
  choice: với thẩm quyền
  rationale: ἐξουσία ở đây là quyền hạn được trao, không đơn thuần là sức mạnh; 'thẩm quyền' làm rõ tính chính thức của quyền ấy.
- source_word: ἐπιτροπῆς
  choice: sự ủy nhiệm
  rationale: Danh từ này chỉ nhiệm vụ hoặc quyền hành được chính thức giao phó. 'Sự ủy nhiệm' vừa tự nhiên vừa phân biệt với 'thẩm quyền' đi trước.
- source_word: τῆς τῶν ἀρχιερέων
  choice: của các thượng tế
  rationale: Sở hữu cách cho biết nguồn trao thẩm quyền và sự ủy nhiệm. 'Của' diễn đạt gọn và không thêm ý ngoài nguyên văn.
- source_word: ἀρχιερέων
  choice: các thượng tế
  rationale: Số nhiều chỉ giới lãnh đạo thuộc hàng tư tế tối cao, không nhất thiết là nhiều người đồng thời giữ chức thượng tế duy nhất; 'các thượng tế' là thuật ngữ Kinh Thánh quen thuộc và chính xác.
