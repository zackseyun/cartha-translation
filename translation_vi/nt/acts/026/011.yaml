source:
  edition: SBLGNT
  text: καὶ κατὰ πάσας τὰς συναγωγὰς πολλάκις τιμωρῶν αὐτοὺς ἠνάγκαζον βλασφημεῖν, περισσῶς τε ἐμμαινόμενος αὐτοῖς ἐδίωκον ἕως καὶ εἰς τὰς ἔξω πόλεις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/011.yaml
  text: And in all the synagogues[a], punishing them many times, I tried to force them to blaspheme; and being exceedingly enraged against them, I kept persecuting them even to the foreign cities.
translation:
  language: vi
  text: Khắp các hội đường, nhiều lần khi trừng phạt họ, tôi đã cố ép họ nói lời phạm thượng. Căm giận họ đến cực độ, tôi còn bắt bớ họ cho đến cả các thành bên ngoài.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay dịch sát hơn: “các thành ở bên ngoài”; cụm từ này có lẽ chỉ những thành nằm ngoài Giu-đê.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ πάσας τὰς συναγωγάς
  choice: trong khắp các hội đường
  rationale: κατά với đối cách mang ý phân bố theo nhiều địa điểm; cách dịch này diễn đạt hành động lặp lại tại các hội đường một cách tự nhiên.
- source_word: πολλάκις τιμωρῶν αὐτούς
  choice: nhiều lần tôi trừng phạt họ
  rationale: πολλάκις nhấn mạnh sự lặp lại, còn phân từ τιμωρῶν nêu hoàn cảnh hoặc phương cách đi cùng động từ chính.
- source_word: ἠνάγκαζον
  choice: cố ép
  rationale: Thì chưa hoàn thành mô tả hành động cưỡng ép được tiến hành nhiều lần; “cố ép” giữ được sắc thái nỗ lực mà không khẳng định mọi lần đều thành công.
- source_word: βλασφημεῖν
  choice: nói lời phạm thượng
  rationale: Giữ nghĩa trực tiếp của động từ và không thêm đối tượng của lời phạm thượng, vì bản Hy Lạp không nêu rõ.
- source_word: περισσῶς τε ἐμμαινόμενος αὐτοῖς
  choice: tôi căm giận họ đến cực độ
  rationale: ἐμμαινόμενος diễn tả thái độ thù nghịch cuồng nộ, còn περισσῶς tăng cường mức độ; cách nói này rõ ràng trong tiếng Việt hiện đại mà không gợi bệnh tâm thần.
- source_word: ἐδίωκον
  choice: cứ tiếp tục bắt bớ
  rationale: Thì chưa hoàn thành diễn tả hành động kéo dài hoặc lặp lại; trong ngữ cảnh Công Vụ, διώκω chỉ sự truy bức các tín hữu.
- source_word: ἕως καὶ εἰς τὰς ἔξω πόλεις
  choice: thậm chí đến tận các thành ở bên ngoài
  rationale: Giữ nghĩa tương đối sát của ἔξω là “ở ngoài/bên ngoài” và tránh quyết định dứt khoát rằng đó là các thành ngoại quốc; chú thích giải thích phạm vi có thể có.
theological_decisions:
- issue: Đối tượng của βλασφημεῖν
  choice: nói lời phạm thượng, không chỉ rõ đối tượng
  alternative: nói phạm đến Chúa Giê-su; nguyền rủa niềm tin Cơ Đốc
  rationale: Ngữ cảnh có thể hàm ý lời phạm thượng chống Chúa Giê-su hoặc lời tuyên xưng Cơ Đốc, nhưng nguyên văn để trống đối tượng nên bản dịch cũng giữ nguyên sự không xác định ấy.
- issue: Phạm vi của τὰς ἔξω πόλεις
  choice: các thành ở bên ngoài
  alternative: các thành ngoại quốc; các thành ngoài xứ
  rationale: Cụm Hy Lạp không nói rõ ranh giới địa lý nào; bản chính giữ sự mơ hồ, còn chú thích nêu cách hiểu có khả năng là ngoài Giu-đê.
translation_notes:
  register: Văn phong trang trọng, tự nhiên và dễ hiểu trong tiếng Việt hiện đại. Dùng “hội đường,” “phạm thượng,” và “bắt bớ” là các thuật ngữ Kinh Thánh quen thuộc nhưng vẫn thông dụng. Dấu chú thích [a] được đặt ngay sau cụm từ mà chú thích giải nghĩa.
