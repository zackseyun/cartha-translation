translation_notes:
  register: Bản dịch dùng tiếng Việt hiện đại, trang trọng và dễ hiểu. Cấu trúc “là cách sống mà… tôi đã sống” có chủ ý làm rõ quan hệ của phân từ γενομένην với βίωσιν, đồng thời giữ cả hai mốc thời gian “từ thời niên thiếu” và “ngay từ đầu.” Dấu phẩy cuối câu được giữ vì câu nói tiếp tục sang câu kế tiếp.
