  text: Τὴν μὲν οὖν βίωσίν μου ⸀τὴν ἐκ νεότητος τὴν ἀπ’ ἀρχῆς γενομένην ἐν τῷ ἔθνει μου ἔν ⸀τε Ἱεροσολύμοις ἴσασι ⸀πάντες Ἰουδαῖοι,
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/004.yaml
  text: So then[a], all the Jews know my manner of life from my youth, which from the beginning took place among my own nation and also in Jerusalem,
translation:
  language: vi
  text: Vậy, mọi người Do Thái đều biết cách sống[a] của tôi từ thời niên thiếu, cách sống vốn ngay từ đầu đã diễn ra giữa dân tộc tôi và tại Giê-ru-sa-lem,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “cuộc đời” hoặc “nếp sống.” Từ Hy Lạp nói đến cách Phao-lô sống, chứ không chỉ nói đến sự tồn tại của ông.
    reason: lexical_alternative
lexical_decisions:
- source_word: βίωσιν
  choice: cách sống
  rationale: Danh từ này chỉ nếp sống hay cách một người sống, chứ không đơn thuần là sự tồn tại hoặc sự sống sinh học. “Cách sống” tự nhiên, rõ nghĩa trong tiếng Việt hiện đại.
- source_word: ἐκ νεότητος
  choice: từ thời niên thiếu
  rationale: Cụm từ nêu mốc khởi đầu của quãng đời đang được nói đến; cách dịch này giữ sắc thái cá nhân và trang trọng vừa phải.
- source_word: ἀπ’ ἀρχῆς
  choice: ngay từ đầu
  rationale: “Ngay” diễn đạt tự nhiên sắc thái nhấn mạnh của cụm từ trong mạch câu.
- source_word: γενομένην
  choice: đã sống
  rationale: Phân từ bổ nghĩa cho βίωσιν và mô tả cách sống ấy diễn ra trong một môi trường nhất định. Lặp lại động từ “sống” giúp câu tiếng Việt tự nhiên hơn so với “đã xảy ra” mà không làm thay đổi ý.
- source_word: ἐν τῷ ἔθνει μου
  choice: giữa dân tộc mình
  rationale: ἔθνος ở đây chỉ cộng đồng dân tộc của Phao-lô, không phải một quốc gia theo nghĩa chính trị hiện đại. “Mình” quy chiếu tự nhiên về chủ thể “tôi” trong mệnh đề phụ.
- source_word: ἔν τε Ἱεροσολύμοις
  choice: và tại Giê-ru-sa-lem
  rationale: τε phối hợp địa điểm này với cụm đứng trước; “và tại” truyền đạt quan hệ bổ sung mà không nhấn mạnh quá mức.
- source_word: ἴσασι
  choice: đều biết
  rationale: Dạng hoàn thành của οἶδα mang nghĩa trạng thái hiện tại là “biết”; “đều” kết hợp tự nhiên với chủ ngữ “tất cả”.
- source_word: πάντες Ἰουδαῖοι
  choice: tất cả người Do Thái
  rationale: Cách dịch trực tiếp, rõ ràng, giữ nguyên phạm vi khái quát trong lời biện hộ của Phao-lô.
- source_word: μὲν οὖν
  choice: Vậy
  rationale: Từ nối này đánh dấu sự chuyển tiếp và tiếp tục lập luận; “Vậy” ngắn gọn, tự nhiên và không diễn giải quá mức.
