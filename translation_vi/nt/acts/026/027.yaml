  source_fidelity: 'Bản dịch truyền đạt đúng cấu trúc và nội dung của tiếng Hy Lạp: lời xưng hô hô cách với vua A-gríp-pa, câu hỏi về việc tin các nhà tiên tri, rồi lời khẳng định của Phao-lô rằng ông biết nhà vua tin. “Tin các nhà tiên tri” giữ được đối tượng số nhiều trực tiếp của πιστεύω với tặng cách, đồng thời trong tiếng Việt có thể bao hàm việc tin lời chứng của họ.'
