  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: πιστεύεις, βασιλεῦ Ἀγρίππα, τοῖς προφήταις; οἶδα ὅτι πιστεύεις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/027.yaml
  text: King Agrippa, do you believe the prophets? I know that you do believe.
translation:
  language: vi
  text: Thưa vua A-gríp-pa, vua có tin các nhà tiên tri không?[a] Tôi biết vua tin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “chấp nhận lời các nhà tiên tri” hoặc “tin cậy các nhà tiên tri.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: πιστεύεις
  choice: có tin
  rationale: Động từ hiện tại chủ động, ngôi thứ hai số ít, được diễn đạt tự nhiên như một câu hỏi trực tiếp; “tin” ở đây nói đến việc công nhận lời chứng của các nhà tiên tri.
- source_word: βασιλεῦ Ἀγρίππα
  choice: Thưa vua A-gríp-pa
  rationale: Giữ chức tước ở hô cách và phiên âm tên riêng theo cách dễ đọc trong tiếng Việt; “thưa” tạo lời xưng hô kính trọng, tự nhiên.
- source_word: τοῖς προφήταις
  choice: các nhà tiên tri
  rationale: Dạng tặng cách làm bổ ngữ cho πιστεύω, chỉ những người cùng lời chứng của họ được tin; cách dịch trực tiếp này không thu hẹp ý thành riêng các sách hay thông điệp.
- source_word: οἶδα
  choice: Tôi biết
  rationale: Động từ có hình thái hoàn thành nhưng mang nghĩa hiện tại; “tôi biết” giữ nguyên sức khẳng định thẳng thắn.
- source_word: ὅτι πιστεύεις
  choice: vua tin
  rationale: Diễn đạt nội dung điều Phao-lô biết. Tiếng Việt không cần thêm từ tương đương với trợ động từ nhấn mạnh của tiếng Anh; sự lặp lại “tin” cùng cấu trúc hỏi–đáp đã giữ được nét quả quyết.
theological_decisions:
- issue: Bản chất của việc “tin các nhà tiên tri”
  choice: Giữ cách nói “tin các nhà tiên tri”, bao gồm việc công nhận lời chứng của họ.
  alternative: “chấp nhận lời các nhà tiên tri” hoặc “tin cậy các nhà tiên tri”
  rationale: πιστεύω với tặng cách ở đây tự nhiên chỉ việc tin hoặc chấp nhận lời chứng của các nhà tiên tri. Cách dịch không mở rộng thành sự vâng phục hay một tuyên bố giáo lý đầy đủ hơn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “thưa vua” và lặp lại “vua” để giữ cách xưng hô kính trọng, tránh đại từ có thể tạo sắc thái không phù hợp.
