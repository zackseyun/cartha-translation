  terminology: “Ăn năn,” “Đức Chúa Trời,” “các dân ngoại,” và “những việc xứng hợp với sự ăn năn” là các lựa chọn phù hợp ngữ cảnh. “Xứng hợp” giữ được ý πράξεις/ἔργα là những việc làm phù hợp với sự ăn năn, không diễn giải thành công trạng.
