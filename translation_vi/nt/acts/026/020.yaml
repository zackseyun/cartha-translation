id: ACT.26.20
reference: Acts 26:20
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀλλὰ τοῖς ἐν Δαμασκῷ πρῶτόν ⸀τε καὶ Ἱεροσολύμοις, ⸀πᾶσάν τε τὴν χώραν τῆς Ἰουδαίας, καὶ τοῖς ἔθνεσιν ⸀ἀπήγγελλον μετανοεῖν καὶ ἐπιστρέφειν ἐπὶ τὸν θεόν, ἄξια τῆς μετανοίας ἔργα πράσσοντας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/020.yaml
  text: but first to those in Damascus[a], then also in Jerusalem, and throughout all the region of Judea, and to the Gentiles, I proclaimed that they should repent and turn to God[b], doing works worthy of repentance.
translation:
  language: vi
  text: Nhưng trước hết, tôi đã công bố cho những người ở Đa-mách, rồi cho những người ở Giê-ru-sa-lem, khắp cả miền Giu-đê, và cho các dân ngoại[a] rằng họ phải ăn năn, quay về với Đức Chúa Trời và làm những việc xứng hợp với sự ăn năn.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “các dân”; trong văn cảnh này, từ Hy Lạp chỉ những dân không thuộc dân Do Thái.
    reason: lexical_alternative
  - marker: b
    text: Hay “những việc xứng đáng với sự ăn năn.” Cụm từ nói đến những hành động phù hợp với sự ăn năn.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Nhưng
  rationale: Diễn tả sự tương phản với lời khẳng định ở câu trước một cách tự nhiên trong tiếng Việt.
- source_word: τοῖς ἐν Δαμασκῷ
  choice: cho những người ở Đa-mách
  rationale: Giữ rõ đối tượng tiếp nhận lời công bố được diễn đạt bằng cách ở số nhiều.
- source_word: πρῶτόν τε καὶ Ἱεροσολύμοις
  choice: trước hết ... rồi tại Giê-ru-sa-lem
  rationale: 'Diễn đạt tự nhiên trình tự địa lý: bắt đầu ở Đa-mách, sau đó đến Giê-ru-sa-lem.'
- source_word: πᾶσάν τε τὴν χώραν τῆς Ἰουδαίας
  choice: khắp cả miền Giu-đê
  rationale: χώρα chỉ một vùng địa lý rộng; “miền” tự nhiên và không giới hạn vào vùng nông thôn.
- source_word: τοῖς ἔθνεσιν
  choice: cho các dân ngoại
  rationale: Trong văn cảnh đối chiếu với Giê-ru-sa-lem và Giu-đê, từ này chỉ các dân không thuộc dân Do Thái.
- source_word: ἀπήγγελλον
  choice: tôi đã công bố
  rationale: Phù hợp với hoạt động truyền giảng công khai của Phao-lô và giữ sắc thái thông báo long trọng.
- source_word: μετανοεῖν
  choice: ăn năn
  rationale: Đây là cách diễn đạt tiếng Việt quen thuộc, hàm ý sự đổi hướng nội tâm và đạo đức trước Đức Chúa Trời, chứ không chỉ đổi ý.
- source_word: ἐπιστρέφειν ἐπὶ τὸν θεόν
  choice: quay về với Đức Chúa Trời
  rationale: Diễn đạt hướng chuyển về phía Đức Chúa Trời; “quay về với” tự nhiên trong tiếng Việt và không nhất thiết khẳng định mọi đối tượng trước đó đã thuộc về Ngài.
- source_word: ἄξια τῆς μετανοίας ἔργα
  choice: những việc xứng hợp với sự ăn năn
  rationale: “Xứng hợp” truyền đạt ý ἄξια là phù hợp, tương xứng; không mặc nhiên biến các việc làm thành cơ sở công trạng.
- source_word: πράσσοντας
  choice: làm
  rationale: Diễn tả hành động thực tế đi kèm với việc ăn năn và quay về với Đức Chúa Trời bằng lối nói tự nhiên.
theological_decisions:
- issue: Mối quan hệ giữa ăn năn, quay về với Đức Chúa Trời và việc làm
  choice: Giữ các việc làm như hành động xứng hợp đi kèm với sự ăn năn.
  alternative: Hiểu việc làm là chính nội dung của sự ăn năn hoặc là cơ sở công trạng để được chấp nhận.
  rationale: Cú pháp nêu “ăn năn” và “quay về với Đức Chúa Trời” như điều được công bố, rồi dùng phân từ πράσσοντας mô tả hành động đi kèm. Bản dịch không giải quyết vượt quá điều câu văn khẳng định.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Dùng “Đức Chúa Trời” theo lối gọi phổ biến trong bản dịch Kinh Thánh Tin Lành tiếng Việt; tên địa danh được phiên âm quen thuộc. Các liên từ được sắp xếp lại nhẹ để câu dài vẫn tự nhiên trong tiếng Việt.
