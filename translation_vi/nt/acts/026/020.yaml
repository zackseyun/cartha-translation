  source_fidelity: 'Bản dịch nhìn chung truyền đạt đúng các thành tố chính: sự đối lập của ἀλλά, các địa điểm/nhóm người nhận lời công bố, lời kêu gọi ăn năn và hướng về Đức Chúa Trời, cùng các việc làm phù hợp với sự ăn năn. Tuy nhiên, cụm “rồi tại Giê-ru-sa-lem” chuyển từ đối tượng gián tiếp số nhiều trong nguyên văn sang một trạng ngữ địa điểm, làm yếu đi tính song song với “cho những người ở Đa-mách” và “cho các dân ngoại.”'
