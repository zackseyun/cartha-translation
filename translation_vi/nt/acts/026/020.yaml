- from: Nhưng trước hết, tôi đã công bố cho những người ở Đa-mách, rồi tại Giê-ru-sa-lem, khắp cả miền Giu-đê, và cho các dân ngoại[a] rằng họ phải ăn năn, quay về với Đức Chúa Trời và làm những việc xứng hợp với sự ăn năn[b].
  to: Nhưng trước hết, tôi đã công bố cho những người ở Đa-mách, rồi cho những người ở Giê-ru-sa-lem, khắp cả miền Giu-đê, và cho các dân ngoại[a] rằng họ phải ăn năn, quay về với Đức Chúa Trời và làm những việc xứng hợp với sự ăn năn.[b]
