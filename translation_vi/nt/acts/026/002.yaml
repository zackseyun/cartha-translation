  text: Περὶ πάντων ὧν ἐγκαλοῦμαι ὑπὸ Ἰουδαίων, βασιλεῦ Ἀγρίππα, ἥγημαι ἐμαυτὸν μακάριον ἐπὶ σοῦ μέλλων ⸂σήμερον ἀπολογεῖσθαι⸃,
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/002.yaml
  text: Concerning all the things of which I am accused by the Jews[a], King Agrippa, I consider myself fortunate that I am about to make my defense before you today,
translation:
  language: vi
  text: “Thưa vua A-gríp-pa, về mọi điều mà người Do Thái cáo buộc tôi, tôi tự thấy mình thật may mắn vì hôm nay sắp được tự biện hộ trước mặt vua,”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Περὶ πάντων ὧν
  choice: về mọi điều
  rationale: περί với sở hữu cách nêu chủ đề; cách dịch này gọn, tự nhiên và vẫn bao quát toàn bộ các cáo buộc.
- source_word: ἐγκαλοῦμαι
  choice: cáo buộc tôi
  rationale: Động từ mang sắc thái pháp lý về việc bị tố cáo; dạng chủ động với tác nhân theo sau tự nhiên hơn trong tiếng Việt mà vẫn giữ nghĩa bị động của câu Hy Lạp.
- source_word: ὑπὸ Ἰουδαίων
  choice: người Do Thái
  rationale: ὑπό chỉ tác nhân. Trong ngữ cảnh, cụm này nói đến những người Do Thái đang cáo buộc Phao-lô, không hàm ý quy kết cho toàn thể dân tộc.
- source_word: βασιλεῦ Ἀγρίππα
  choice: Thưa vua A-gríp-pa
  rationale: Giữ lời xưng hô trực tiếp ở hô cách và thể hiện phép kính trọng tự nhiên trong tiếng Việt hiện đại.
- source_word: ἥγημαι ἐμαυτὸν μακάριον
  choice: tôi tự thấy mình thật may mắn
  rationale: ἡγέομαι cùng đại từ phản thân có nghĩa xem hoặc coi chính mình là; μακάριον ở bối cảnh pháp đình chủ yếu diễn tả hoàn cảnh thuận lợi, đáng mừng.
- source_word: ἐπὶ σοῦ
  choice: trước mặt vua
  rationale: Cụm từ chỉ việc trình diện và nói trước một người trong bối cảnh xét xử; lặp tước hiệu phù hợp lối xưng hô kính trọng tiếng Việt.
- source_word: μέλλων σήμερον ἀπολογεῖσθαι
  choice: vì hôm nay được biện hộ
  rationale: μέλλων cho biết hành động sắp diễn ra, còn ἀπολογεῖσθαι là trình bày lời tự biện trong bối cảnh pháp lý. Cấu trúc tiếng Việt nêu rõ lý do Phao-lô thấy mình may mắn.
theological_decisions:
- issue: Sắc thái của μακάριον
  choice: may mắn
  alternative: có phước
  rationale: Trong lời mở đầu biện hộ trước vua A-gríp-pa, từ này mô tả lợi thế hoặc đặc ân được trình bày vụ việc trước người am hiểu, chứ không nhất thiết khẳng định một phước lành thần học.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, phù hợp lời mở đầu tại một phiên điều trần. Dùng “Thưa vua” và “trước mặt vua” để giữ phép xưng hô kính trọng; tránh lối cổ như “tâu vua”. Câu kết bằng dấu phẩy vì nguyên văn tiếp nối sang câu sau.
