  text: μάλιστα γνώστην ὄντα σε πάντων τῶν κατὰ Ἰουδαίους ⸀ἐθῶν τε καὶ ζητημάτων· διὸ ⸀δέομαι μακροθύμως ἀκοῦσαί μου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/003.yaml
  text: especially because you are knowledgeable about all the customs and disputes among the Jews[b][a]. Therefore I beg you to listen to me patiently.
translation:
  language: vi
  text: nhất là vì vua am hiểu mọi phong tục và vấn đề tranh luận của người Do Thái. Vì vậy, tôi khẩn khoản xin vua kiên nhẫn nghe tôi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μάλιστα
  choice: nhất là vì
  rationale: Diễn đạt tự nhiên sức nhấn mạnh và quan hệ lý do của cụm phân từ theo sau trong mạch câu.
- source_word: γνώστην ὄντα σε
  choice: vì vua am hiểu
  rationale: Giữ ý A-gríp-pa có sự hiểu biết sâu rộng mà không cường điệu thành một chức danh chuyên môn; đại từ xưng hô phù hợp ngữ cảnh Phao-lô thưa với vua.
- source_word: πάντων τῶν κατὰ Ἰουδαίους ἐθῶν τε καὶ ζητημάτων
  choice: mọi phong tục và vấn đề tranh luận của người Do Thái
  rationale: κατὰ Ἰουδαίους chỉ phạm vi liên quan đến người Do Thái; ζητήματα trong bối cảnh pháp lý chỉ những vấn đề đang được bàn cãi, nên 'vấn đề tranh luận' giữ được cả nghĩa 'vấn đề' lẫn sắc thái tranh chấp.
- source_word: διὸ
  choice: Vì vậy
  rationale: Nêu rõ kết luận phát sinh từ sự am hiểu của A-gríp-pa.
- source_word: δέομαι
  choice: tôi khẩn khoản xin
  rationale: Thể hiện lời thỉnh cầu tha thiết, mạnh hơn 'xin' đơn thuần nhưng tự nhiên và trang trọng trong tiếng Việt hiện đại.
- source_word: μακροθύμως ἀκοῦσαί μου
  choice: kiên nhẫn nghe tôi trình bày
  rationale: '''Kiên nhẫn'' chuyển đúng trạng từ μακροθύμως; ''nghe tôi trình bày'' là cách nói tự nhiên trong bối cảnh biện hộ và không thêm ý rằng người nghe phải đồng tình.'
theological_decisions: []
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu; dùng cặp xưng hô 'tôi—vua' phù hợp lời Phao-lô nói trực tiếp với vua A-gríp-pa. Câu duy trì sự gắn kết với phần mở đầu từ câu trước, đúng tính chất một mảnh câu trong nguyên văn.
