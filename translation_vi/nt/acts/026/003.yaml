  terminology: “Phong tục,” “vấn đề tranh luận,” “khẩn khoản xin,” và “kiên nhẫn” truyền đạt phù hợp các thuật ngữ Hy Lạp. Không có thuật ngữ thần học hoặc tên riêng cần điều chỉnh trong câu này.
