  source_fidelity: 'Bản nháp truyền đạt đúng cấu trúc chính: sự trợ giúp đến từ Đức Chúa Trời, lời làm chứng cho mọi địa vị, và nội dung không vượt ngoài điều các nhà tiên tri cùng Môi-se đã nói sẽ xảy ra. Tuy nhiên, “đứng vững” thêm sắc thái kiên định/bền chí không được nêu rõ trong ἕστηκα; trong ngữ cảnh lời biện hộ, “vẫn đứng đây” giữ được trạng thái hiện diện tiếp diễn mà không diễn giải thêm.'
