  terminology: “Đức Chúa Trời,” “làm chứng,” “các nhà tiên tri,” và “Môi-se” nhất quán với văn phong Cơ Đốc Việt ngữ. Cặp “người thấp kém lẫn người cao trọng” cùng chú thích giữ ý thành ngữ về mọi địa vị xã hội.
