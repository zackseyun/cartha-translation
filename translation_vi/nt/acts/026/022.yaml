id: ACT.26.22
reference: Acts 26:22
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐπικουρίας οὖν τυχὼν τῆς ⸀ἀπὸ τοῦ θεοῦ ἄχρι τῆς ἡμέρας ταύτης ἕστηκα μαρτυρόμενος μικρῷ τε καὶ μεγάλῳ, οὐδὲν ἐκτὸς λέγων ὧν τε οἱ προφῆται ἐλάλησαν μελλόντων γίνεσθαι καὶ Μωϋσῆς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/022.yaml
  text: Therefore[a], having received the help that is from God, I stand to this day, testifying to both small and great, saying nothing except what both the prophets and Moses said was going to happen[c][b],
translation:
  language: vi
  text: 'Vì thế, nhờ sự trợ giúp từ Đức Chúa Trời mà tôi đã nhận được, cho đến ngày nay tôi vẫn đứng đây, làm chứng cho cả người thấp kém lẫn người cao trọng[a]. Tôi không nói điều gì ngoài những điều các nhà tiên tri và Môi-se đã nói sẽ xảy ra[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Người thấp kém” và “người cao trọng” là cách nói chỉ người thuộc mọi địa vị xã hội.
    reason: cultural_note
  - marker: b
    text: 'Cũng có thể dịch: “không nói điều gì vượt ngoài những điều các nhà tiên tri và Môi-se đã nói sẽ xảy ra.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπικουρίας ... τυχὼν τῆς ἀπὸ τοῦ θεοῦ
  choice: nhờ nhận được sự trợ giúp từ Đức Chúa Trời
  rationale: Diễn đạt tự nhiên quan hệ phân từ và nêu rõ Đức Chúa Trời là nguồn trợ giúp; “sự trợ giúp” phù hợp sắc thái của ἐπικουρία.
- source_word: ἄχρι τῆς ἡμέρας ταύτης ἕστηκα
  choice: tôi vẫn đứng vững cho đến ngày nay
  rationale: “Vẫn đứng vững” thể hiện trạng thái hiện tại kéo dài do thì hoàn thành ἕστηκα và phù hợp hoàn cảnh Phao-lô được Đức Chúa Trời nâng đỡ.
- source_word: μαρτυρόμενος
  choice: làm chứng
  rationale: Giữ sắc thái nhân chứng và lời chứng, đồng thời là cách nói tự nhiên trong tiếng Việt hiện đại.
- source_word: μικρῷ τε καὶ μεγάλῳ
  choice: cho cả người thấp kém lẫn người cao trọng
  rationale: Truyền đạt thành ngữ chỉ mọi tầng lớp xã hội mà vẫn giữ kết cấu đối xứng của nguyên văn.
- source_word: οὐδὲν ἐκτὸς λέγων ὧν
  choice: Tôi không nói điều gì ngoài những điều
  rationale: Giữ lực phủ định mạnh và ý rằng nội dung lời chứng không vượt ra ngoài điều Kinh Thánh đã báo trước.
- source_word: οἱ προφῆται ... καὶ Μωϋσῆς
  choice: các nhà tiên tri và Môi-se
  rationale: Giữ nguyên thứ tự Hy Lạp và không thêm cách giải thích về mối quan hệ giữa hai thành phần.
- source_word: μελλόντων γίνεσθαι
  choice: đã nói là sẽ xảy ra
  rationale: Biểu đạt tính tương lai xét từ thời điểm các nhà tiên tri và Môi-se nói, không áp đặt sắc thái cận kề.
theological_decisions:
- issue: Mức độ liên tục giữa lời chứng của Phao-lô và Kinh Thánh Israel
  choice: “không nói điều gì ngoài những điều”
  alternative: “không nói điều gì trái với những điều”
  rationale: ἐκτός diễn tả điều ở ngoài hoặc vượt quá phạm vi, nên bản dịch giữ lời khẳng định mạnh rằng nội dung Phao-lô rao giảng nằm trong những điều các nhà tiên tri và Môi-se đã nói, thay vì chỉ nói rằng lời ông không mâu thuẫn với họ.
- issue: Ý nghĩa của ἕστηκα trong bối cảnh Đức Chúa Trời trợ giúp
  choice: “vẫn đứng vững”
  alternative: “vẫn đứng đây”
  rationale: Cả nghĩa hiện diện và được duy trì đều có thể được cảm nhận trong ngữ cảnh. “Đứng vững” thể hiện trạng thái tiếp diễn nhưng không giải thích cụ thể cách Đức Chúa Trời trợ giúp.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Trời” và “Môi-se” theo lối gọi quen thuộc trong tiếng Việt Cơ Đốc. Dấu hai chấm cuối câu phản ánh rằng câu Hy Lạp tiếp tục sang câu 23.
