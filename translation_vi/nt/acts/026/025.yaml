  source_fidelity: Bản dịch truyền đạt đúng thế đối lập của δὲ, lời phủ nhận μαίνομαι, kính ngữ κράτιστε dành cho Phê-tu, và khẳng định rằng Phao-lô nói những lời mang đặc tính chân thật và σωφροσύνη. “Không mất trí” và “sáng suốt” giữ được sự đối lập trọng tâm của nguyên văn mà không thêm diễn giải giáo phái.
