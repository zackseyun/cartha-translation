id: ACT.26.25
reference: Acts 26:25
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ δὲ ⸀Παῦλος· Οὐ μαίνομαι, φησίν, κράτιστε Φῆστε, ἀλλὰ ἀληθείας καὶ σωφροσύνης ῥήματα ἀποφθέγγομαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/025.yaml
  text: But Paul said[a], “I am not out of my mind, most excellent Festus[c][b], but I am speaking words of truth and sound judgment.”
translation:
  language: vi
  text: 'Nhưng Phao-lô đáp: “Thưa ngài Phê-tu đáng kính,[a] tôi không mất trí; trái lại, tôi đang nói những lời chân thật và sáng suốt.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Đáng kính” là kính ngữ trang trọng dùng để thưa với một quan chức cấp cao.
    reason: cultural_note
  - marker: b
    text: 'Cũng có thể dịch: “những lời của sự thật và sự tỉnh táo” hoặc “những lời chân thật và hợp lý.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Nhưng
  rationale: Thể hiện sự tương phản trực tiếp giữa lời đáp của Phao-lô và lời cáo buộc của Phê-tu ở câu trước.
- source_word: μαίνομαι
  choice: không mất trí
  rationale: Diễn đạt tự nhiên trong tiếng Việt hiện đại ý nghĩa ‘điên, mất trí’, đồng thời phù hợp với lời Phê-tu vừa nói.
- source_word: φησίν
  choice: đáp
  rationale: Dịch hiện tại lịch sử bằng lối kể quá khứ tự nhiên; ‘đáp’ làm rõ đây là lời phản hồi trực tiếp.
- source_word: κράτιστε
  choice: ngài ... đáng kính
  rationale: Diễn đạt kính ngữ trang trọng dành cho một quan chức cấp cao mà không tạo cảm giác cổ hoặc tối nghĩa.
- source_word: ἀληθείας
  choice: chân thật
  rationale: Chuyển cấu trúc sở hữu cách ‘những lời của sự thật’ thành tính từ tự nhiên trong tiếng Việt, vẫn giữ ý rằng lời nói mang tính chân thật.
- source_word: σωφροσύνης
  choice: sáng suốt
  rationale: Bao quát ý tỉnh táo, có lý trí và tự chủ; đồng thời tạo thế đối lập rõ ràng với cáo buộc mất trí.
- source_word: ῥήματα
  choice: những lời
  rationale: Giữ danh từ số nhiều cụ thể của nguyên văn.
- source_word: ἀποφθέγγομαι
  choice: tôi đang nói
  rationale: Giữ khía cạnh đang diễn ra và ý phát biểu rõ ràng, nhưng không cường điệu sắc thái tu từ.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cách xưng hô “thưa ngài” phù hợp với bối cảnh Phao-lô nói trước một tổng đốc La Mã; tên riêng được phiên âm theo lối quen dùng trong tiếng Việt.
