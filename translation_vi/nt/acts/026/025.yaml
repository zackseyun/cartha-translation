  terminology: Tên riêng “Phao-lô” và “Phê-tu” theo cách phiên âm Việt ngữ quen dùng. “Đáng kính” là cách chuyển đạt phù hợp của kính ngữ κράτιστε trong ngữ cảnh một quan chức La Mã. Chú thích a giải thích đúng chức năng văn hóa; chú thích b nêu các khả năng từ vựng hợp lý cho σωφροσύνης mà không áp đặt một nghĩa duy nhất.
