source:
  edition: SBLGNT
  text: Ἀγρίππας δὲ τῷ Φήστῳ ἔφη· Ἀπολελύσθαι ἐδύνατο ὁ ἄνθρωπος οὗτος εἰ μὴ ἐπεκέκλητο Καίσαρα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/032.yaml
  text: Then Agrippa said to Festus[a], “This man could have been released if he had not appealed to Caesar.”
translation:
  language: vi
  text: 'Bấy giờ, A-gríp-pa nói với Phê-tu: “Người này đã có thể được trả tự do nếu ông ấy không kháng cáo lên Sê-sa.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: Bấy giờ
  rationale: Đánh dấu bước chuyển trong diễn tiến câu chuyện và dẫn vào lời kết luận của A-gríp-pa; cách diễn đạt này tự nhiên trong tiếng Việt mà vẫn giữ lực liên kết.
- source_word: ἔφη
  choice: nói
  rationale: Dạng chưa hoàn thành của φημί ở đây là công thức dẫn lời trong văn thuật chuyện; “nói” là cách dịch tự nhiên, không nhấn quá mức sắc thái thể.
- source_word: Ἀπολελύσθαι
  choice: được thả
  rationale: Động từ ἀπολύω trong bối cảnh pháp lý chỉ việc phóng thích. “Được thả” rõ ràng và không thu hẹp nghĩa thành một phán quyết tuyên vô tội.
- source_word: ἐδύνατο
  choice: đã có thể
  rationale: Diễn đạt một khả năng trong quá khứ đã không thành hiện thực, phù hợp với điều kiện phản thực theo sau.
- source_word: ὁ ἄνθρωπος οὗτος
  choice: Người này
  rationale: Giữ nguyên lực chỉ định của οὗτος và chỉ một người cụ thể là Phao-lô; tiếng Việt không cần thêm từ chỉ giới tính trong cụm này.
- source_word: εἰ μὴ
  choice: nếu ... không
  rationale: 'Thể hiện rõ điều kiện phản thực: việc kháng cáo đã xảy ra và cản trở khả năng phóng thích.'
- source_word: ἐπεκέκλητο
  choice: kháng cáo lên
  rationale: Trong bối cảnh pháp luật La Mã, ἐπικαλέω Καίσαρα nói đến việc yêu cầu hoàng đế xét xử; “kháng cáo lên” truyền đạt chính xác ý nghĩa pháp lý và đích hướng tới.
- source_word: Καίσαρα
  choice: Sê-sa
  rationale: Giữ danh hiệu lịch sử và công thức pháp lý của nguyên văn thay vì diễn giải thành “hoàng đế”.
theological_decisions:
- issue: Mức độ chắc chắn của khả năng được phóng thích
  choice: đã có thể được thả
  alternative: có lẽ đã được trả tự do
  rationale: Cấu trúc Ἀπολελύσθαι ἐδύνατο diễn tả khả năng không thành do điều kiện phản thực, nhưng không nhất thiết khẳng định một phán quyết tha bổng chính thức; bản dịch giữ nguyên sự phân biệt này.
translation_notes:
  register: 'Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng các dạng tên quen thuộc trong truyền thống Kinh Thánh tiếng Việt: A-gríp-pa, Phê-tu, Sê-sa. Đại từ “ông ấy” tránh lặp “người này” và phù hợp khi nói về Phao-lô.'
