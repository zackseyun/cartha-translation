id: ACT.26.18
reference: Acts 26:18
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀνοῖξαι ὀφθαλμοὺς αὐτῶν, τοῦ ⸀ἐπιστρέψαι ἀπὸ σκότους εἰς φῶς καὶ τῆς ἐξουσίας τοῦ Σατανᾶ ἐπὶ τὸν θεόν, τοῦ λαβεῖν αὐτοὺς ἄφεσιν ἁμαρτιῶν καὶ κλῆρον ἐν τοῖς ἡγιασμένοις πίστει τῇ εἰς ἐμέ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/018.yaml
  text: to open their eyes[a], so that they may turn from darkness to light and from the authority of Satan to God[b], that they may receive forgiveness of sins and an inheritance among those who have been sanctified by faith in me.
translation:
  language: vi
  text: để mở mắt họ, hầu cho họ quay khỏi bóng tối đến ánh sáng, và từ quyền hành của Sa-tan[a] đến với Đức Chúa Trời, để họ nhận được sự tha tội và được hưởng phần cơ nghiệp cùng với những người đã được thánh hóa[b] bởi đức tin nơi Ta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “quyền lực của Sa-tan” hoặc “ách thống trị của Sa-tan”. Từ Hy Lạp có thể chỉ thẩm quyền, quyền lực cai trị hoặc phạm vi thống trị.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “những người đã được làm nên thánh”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνοῖξαι ὀφθαλμοὺς αὐτῶν
  choice: mở mắt họ
  rationale: Giữ nguyên hình ảnh cụ thể về đôi mắt được mở, đồng thời để ngữ cảnh truyền đạt ý nghĩa thuộc linh mà không diễn giải quá mức thành “mở trí” hay “làm cho hiểu biết”.
- source_word: τοῦ ἐπιστρέψαι
  choice: hầu cho họ quay
  rationale: Diễn đạt mục đích của động từ nguyên mẫu có mạo từ và giữ sắc thái chủ động, hướng chuyển đổi của ἐπιστρέφω, không áp đặt cách hiểu bị động như “được cải đạo”.
- source_word: ἀπὸ σκότους εἰς φῶς
  choice: từ bóng tối sang ánh sáng
  rationale: Giữ nguyên cặp hình ảnh đối lập trong nguyên văn bằng cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: τῆς ἐξουσίας τοῦ Σατανᾶ
  choice: quyền cai trị của Sa-tan
  rationale: ἐξουσία có thể chỉ thẩm quyền, quyền lực cai trị hoặc phạm vi thống trị. “Quyền cai trị” vừa rõ nghĩa trong tiếng Việt vừa bảo toàn khía cạnh thống trị của từ.
- source_word: ἐπὶ τὸν θεόν
  choice: về với Đức Chúa Trời
  rationale: Trong cấu trúc chỉ sự chuyển hướng, “về với” diễn đạt tự nhiên việc rời quyền cai trị của Sa-tan và hướng đến Đức Chúa Trời.
- source_word: τοῦ λαβεῖν
  choice: để họ nhận được
  rationale: Phản ánh mệnh đề mục đích thứ hai và giữ ý nghĩa tiếp nhận điều được ban.
- source_word: ἄφεσιν ἁμαρτιῶν
  choice: sự tha tội
  rationale: Cách nói rõ ràng, quen thuộc và đương đại cho ý nghĩa tha thứ các tội lỗi.
- source_word: κλῆρον
  choice: phần cơ nghiệp
  rationale: “Phần” giữ ý về phần được phân định, còn “cơ nghiệp” truyền đạt sắc thái giao ước và cánh chung trong ngữ cảnh cứu rỗi.
- source_word: ἐν τοῖς ἡγιασμένοις
  choice: giữa những người đã được thánh hóa
  rationale: 'Giữ lực của phân từ hoàn thành bị động: một hành động đã xảy ra với tình trạng còn tiếp diễn; “giữa” thể hiện việc có phần trong cộng đồng ấy.'
- source_word: πίστει τῇ εἰς ἐμέ
  choice: bởi đức tin nơi Ta
  rationale: “Bởi” thể hiện chức năng phương tiện của cách dữ cách; “nơi Ta” xác định chính Đức Chúa Giê-xu là đối tượng của đức tin.
theological_decisions:
- issue: Cách hiểu πίστει τῇ εἰς ἐμέ
  choice: bởi đức tin nơi Ta
  alternative: nhờ lòng tin cậy nơi Ta
  rationale: Cấu trúc εἰς ἐμέ xác định đối tượng của đức tin, không phải cấu trúc sở hữu cách πίστις Χριστοῦ đang được tranh luận. “Đức tin” giữ thuật ngữ thần học quen thuộc mà không loại bỏ sắc thái tin cậy.
- issue: Trạng thái của τοῖς ἡγιασμένοις
  choice: những người đã được thánh hóa
  alternative: những người đã được làm nên thánh
  rationale: Bản dịch chính giữ cả thể bị động lẫn khía cạnh hoàn thành của nguyên văn, nhưng không xác định vượt quá câu này về tiến trình hay thời điểm thánh hóa.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, giữ các hình ảnh “mở mắt”, “bóng tối” và “ánh sáng”. Dùng “Ta” trong lời trực tiếp của Đức Chúa Giê-xu để người đọc không nhầm đại từ này với Phao-lô, đồng thời phù hợp văn phong Kinh Thánh tiếng Việt. Các dấu chú thích được đặt ngay sau đúng cụm từ mà chú thích giải thích.
