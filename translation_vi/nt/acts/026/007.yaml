source:
  edition: SBLGNT
  text: εἰς ἣν τὸ δωδεκάφυλον ἡμῶν ἐν ἐκτενείᾳ νύκτα καὶ ἡμέραν λατρεῦον ἐλπίζει καταντῆσαι· περὶ ἧς ἐλπίδος ἐγκαλοῦμαι ⸂ὑπὸ Ἰουδαίων, βασιλεῦ⸃·
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/007.yaml
  text: to which our twelve tribes hope to attain[a], as they earnestly serve God night and day. It is concerning this hope that I am accused by the Jews[c][b], O king.
translation:
  language: vi
  text: mà dân ta, gồm mười hai chi phái, hy vọng đạt tới[a], khi họ cách sốt sắng phụng sự Đức Chúa Trời[b] đêm ngày. Chính vì niềm hy vọng ấy mà tôi bị những người Do Thái tố cáo[c], thưa vua.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn dùng một danh từ tập hợp số ít, chỉ dân Israel như một dân gồm mười hai chi phái.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch “thờ phượng”. Động từ Hy Lạp có thể chỉ sự phụng sự tôn giáo hoặc sự thờ phượng dành cho Đức Chúa Trời.
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “tôi bị người Do Thái tố cáo.” Trong bối cảnh pháp lý, cụm từ này nói đến những người tố cáo Phao-lô, không phải toàn thể người Do Thái.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς ἣν
  choice: mà… đạt tới
  rationale: Giữ sắc thái hướng đến mục tiêu của εἰς và liên kết đại từ quan hệ với lời hứa ở câu trước.
- source_word: τὸ δωδεκάφυλον ἡμῶν
  choice: mười hai chi phái của dân ta
  rationale: Diễn đạt danh từ tập hợp số ít chỉ toàn thể dân Israel gồm mười hai chi phái, đồng thời tự nhiên trong tiếng Việt.
- source_word: ἐν ἐκτενείᾳ
  choice: hết lòng
  rationale: Truyền đạt sự nhiệt thành và bền bỉ trong việc phụng sự bằng lối nói hiện đại, dễ hiểu.
- source_word: νύκτα καὶ ἡμέραν
  choice: đêm ngày
  rationale: Giữ thứ tự của nguyên văn và ý nghĩa hành động liên tục.
- source_word: λατρεῦον
  choice: phụng sự Đức Chúa Trời
  rationale: Động từ chỉ sự phục vụ mang tính tôn giáo dành cho Đức Chúa Trời; bổ sung tân ngữ ngầm để câu tiếng Việt rõ nghĩa.
- source_word: ἐλπίζει καταντῆσαι
  choice: hy vọng đạt tới
  rationale: Thể hiện việc mong đạt đến mục tiêu là lời hứa đã nêu ở câu trước.
- source_word: περὶ ἧς ἐλπίδος
  choice: chính vì niềm hy vọng ấy
  rationale: Trong bối cảnh pháp lý, περί có thể nêu vấn đề bị cáo buộc hoặc nguyên do của việc cáo buộc; cách dịch này tự nhiên và phù hợp mạch lập luận.
- source_word: ἐγκαλοῦμαι
  choice: tôi bị… tố cáo
  rationale: Giữ thể bị động và sắc thái pháp lý của động từ.
- source_word: ὑπὸ Ἰουδαίων
  choice: bị những người Do Thái tố cáo
  rationale: Diễn đạt tự nhiên trong tiếng Việt và không hàm ý mọi người Do Thái đều là bên cáo buộc.
- source_word: βασιλεῦ
  choice: thưa vua
  rationale: Chuyển lời hô cách thành cách xưng hô kính trọng, tự nhiên trong tiếng Việt hiện đại.
theological_decisions:
- issue: Tân ngữ ngầm của λατρεῦον
  choice: phụng sự Đức Chúa Trời
  alternative: phụng sự; thờ phượng
  rationale: Nguyên văn không nêu tân ngữ, nhưng ngữ cảnh về sự tận hiến tôn giáo của Israel cho thấy Đức Chúa Trời là đối tượng tự nhiên; việc nêu rõ giúp tiếng Việt sáng nghĩa mà không thêm một khẳng định thần học mới.
- issue: Nội dung của niềm hy vọng
  choice: Giữ cách quy chiếu về lời hứa ở câu trước, không nói rõ là sự sống lại trong câu này
  alternative: Nêu trực tiếp sự sống lại; hiểu như niềm hy vọng nói chung
  rationale: Ngữ cảnh rộng hơn gắn niềm hy vọng với lời hứa của Đức Chúa Trời và chủ đề sống lại, nhưng chính câu này không nhắc lại nội dung ấy; bản dịch giữ liên kết mà không giải quyết thay cho nguyên văn.
- issue: Phạm vi của ὑπὸ Ἰουδαίων
  choice: những người Do Thái
  alternative: người Do Thái; dân Do Thái
  rationale: Cụm từ chỉ những người đang tố cáo Phao-lô trong bối cảnh pháp lý, không phải một lời quy kết phổ quát cho toàn thể dân Do Thái.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. “Hết lòng phụng sự” giữ sắc thái tận tâm trong hoạt động thờ phượng; “thưa vua” chuyển hô cách Hy Lạp sang lời thưa kính trọng tự nhiên. Các dấu chú thích đều xuất hiện trong chính văn.
