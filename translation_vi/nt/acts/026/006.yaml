  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ νῦν ἐπ’ ἐλπίδι τῆς ⸀εἰς τοὺς πατέρας ⸀ἡμῶν ἐπαγγελίας γενομένης ὑπὸ τοῦ θεοῦ ἕστηκα κρινόμενος,
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/006.yaml
  text: And now I stand on trial because of the hope of the promise made by God to our fathers,[a]
translation:
  language: vi
  text: Và giờ đây, tôi đứng chịu xét xử vì niềm hy vọng về lời hứa mà Đức Chúa Trời đã ban cho các tổ phụ chúng ta.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “tổ tiên chúng ta.” Tiếng Hy Lạp là “các cha của chúng ta,” chỉ các tổ tiên nam của Israel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ νῦν
  choice: Và giờ đây
  rationale: Giữ chức năng chuyển tiếp, nối hoàn cảnh xét xử hiện tại của Phao-lô với phần trình bày trước đó.
- source_word: ἐπ’ ἐλπίδι
  choice: vì hy vọng
  rationale: ἐπί với cách dữ cách ở đây nêu căn cứ hoặc nguyên nhân của việc Phao-lô bị xét xử; “vì hy vọng” diễn đạt tự nhiên quan hệ ấy.
- source_word: ἐπαγγελίας
  choice: lời hứa
  rationale: Danh từ chỉ lời hứa, ở đây là lời hứa của Đức Chúa Trời; “lời hứa” là cách dịch rõ ràng và quen thuộc.
- source_word: τῆς εἰς τοὺς πατέρας ἡμῶν ἐπαγγελίας
  choice: lời hứa ... cho các tổ phụ chúng ta
  rationale: Cụm εἰς τοὺς πατέρας ἡμῶν cho biết những người tiếp nhận lời hứa. “Cho các tổ phụ chúng ta” vừa tự nhiên trong tiếng Việt vừa giữ sắc thái lịch sử giao ước.
- source_word: γενομένης ὑπὸ τοῦ θεοῦ
  choice: mà Đức Chúa Trời đã ban
  rationale: Phân từ γενομένης cùng ὑπό + sở hữu cách cho biết lời hứa đến từ Đức Chúa Trời. “Đã ban” diễn đạt tự nhiên hành động lập hoặc trao lời hứa mà không làm mất tác nhân thần linh.
- source_word: πατέρας ἡμῶν
  choice: các tổ phụ chúng ta
  rationale: Nguyên văn dùng danh từ giống đực số nhiều và trong bối cảnh Do Thái chỉ các bậc tiền nhân gắn với lịch sử lời hứa của Israel. “Các tổ phụ” bảo toàn sắc thái này; “tổ tiên” được ghi nhận ở chú thích như một cách dịch rộng hơn.
- source_word: ἕστηκα
  choice: tôi đứng đây
  rationale: Thể hoàn thành có nghĩa trạng thái hiện tại, “tôi đứng”; thêm “đây” giúp câu tiếng Việt tự nhiên trong bối cảnh pháp đình.
- source_word: κρινόμενος
  choice: chịu xét xử
  rationale: Phân từ mô tả tình trạng pháp lý hiện tại của Phao-lô. “Chịu xét xử” giữ rõ ý tư pháp và kết hợp tự nhiên với “đứng đây”.
theological_decisions:
- issue: Danh tính của “các tổ phụ chúng ta”
  choice: Các tổ phụ của Israel, là những bậc tiền nhân gắn với lịch sử giao ước
  alternative: Tổ tiên của dân Do Thái nói chung
  rationale: Trong lời biện hộ trước vua Ạc-ríp-ba, cụm từ gợi đến lịch sử giao ước của Israel và những người xưa đã nhận lời hứa của Đức Chúa Trời. Bản dịch giữ “các tổ phụ” trong chính văn nhưng không xác định hẹp hơn mức nguyên văn.
- issue: Quan hệ giữa “hy vọng” và “lời hứa”
  choice: hy vọng vào lời hứa
  alternative: niềm hy vọng về lời hứa
  rationale: Sở hữu cách ἐπαγγελίας gắn niềm hy vọng với lời hứa của Đức Chúa Trời. “Hy vọng vào lời hứa” diễn đạt tự nhiên đối tượng hoặc nền tảng của hy vọng mà không giải thích nội dung cụ thể của lời hứa.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Đứng đây chịu xét xử” giữ hình ảnh đứng trước tòa của nguyên văn nhưng vẫn tự nhiên trong tiếng Việt; “các tổ phụ” duy trì sắc thái Kinh Thánh và giao ước, còn chú thích cung cấp cách nói phổ thông hơn.
