id: ACT.2.46
reference: Acts 2:46
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καθ’ ἡμέραν τε προσκαρτεροῦντες ὁμοθυμαδὸν ἐν τῷ ἱερῷ, κλῶντές τε κατ’ οἶκον ἄρτον, μετελάμβανον τροφῆς ἐν ἀγαλλιάσει καὶ ἀφελότητι καρδίας,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/046.yaml
  text: And day by day[a], continuing together with one purpose in the temple courts, and breaking bread from house to house, they were sharing meals with gladness and simplicity of heart[d][c][b],
translation:
  language: vi
  text: Ngày ngày, họ đồng lòng kiên trì hiện diện trong khuôn viên đền thờ[a], bẻ bánh tại từng nhà[b], và cùng dùng bữa[c] với niềm hân hoan và tấm lòng đơn sơ[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hy Lạp chỉ toàn bộ khu đền thờ, kể cả các sân, chứ không riêng nơi thánh bên trong.
    reason: cultural_note
  - marker: b
    text: “Bẻ bánh” có thể chỉ việc cùng dùng bữa thông thường; một số người cũng hiểu cụm từ này bao gồm Bữa Ăn của Chúa.
    reason: alternative_reading
  - marker: c
    text: 'Dịch sát: “cùng dùng thức ăn.”'
    reason: lexical_alternative
  - marker: d
    text: Cũng có thể hiểu là “tấm lòng chân thành” hoặc “tấm lòng rộng rãi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καθ’ ἡμέραν
  choice: ngày ngày
  rationale: 'Diễn đạt tự nhiên ý phân phối và lặp lại của κατά với đối cách: việc này diễn ra mỗi ngày.'
- source_word: προσκαρτεροῦντες
  choice: kiên trì nhóm lại
  rationale: Phân từ hiện tại diễn tả sự chuyên cần liên tục. Trong ngữ cảnh cộng đồng cùng hiện diện tại đền thờ, “kiên trì nhóm lại” rõ nghĩa trong tiếng Việt mà không thêm sắc thái nghi lễ.
- source_word: ὁμοθυμαδόν
  choice: đồng lòng
  rationale: Từ này diễn tả sự hiệp nhất trong tâm ý và mục đích; “đồng lòng” vừa gọn, tự nhiên, vừa giữ được cả chiều kích cộng đồng lẫn ý hướng.
- source_word: ἐν τῷ ἱερῷ
  choice: trong khuôn viên đền thờ
  rationale: ἱερόν chỉ toàn bộ khu đền thờ chứ không riêng nơi thánh bên trong; “khuôn viên đền thờ” làm rõ sự phân biệt này.
- source_word: κλῶντές ... ἄρτον
  choice: bẻ bánh
  rationale: Giữ nguyên thành ngữ của Lu-ca–Công Vụ, vốn có thể chỉ việc dùng bữa chung và cũng có thể gợi đến Bữa Ăn của Chúa, không thu hẹp nghĩa ngay trong chính văn.
- source_word: κατ’ οἶκον
  choice: tại từng nhà
  rationale: 'Truyền đạt sắc thái phân phối của κατά: hoạt động diễn ra tại nhiều nhà khác nhau, đồng thời tự nhiên hơn cách nói sát chữ “từ nhà này sang nhà khác”.'
- source_word: μετελάμβανον τροφῆς
  choice: cùng dùng bữa
  rationale: Động từ ở thì chưa hoàn thành diễn tả hành động lặp lại hoặc tiếp diễn; “cùng dùng bữa” thể hiện việc tham dự vào thức ăn trong bối cảnh sinh hoạt cộng đồng.
- source_word: ἐν ἀγαλλιάσει
  choice: với niềm hân hoan
  rationale: ἀγαλλίασις chỉ niềm vui mạnh mẽ, phấn khởi; “hân hoan” trang trọng vừa phải và dễ hiểu trong tiếng Việt hiện đại.
- source_word: ἀφελότητι καρδίας
  choice: với ... tấm lòng đơn sơ
  rationale: Cụm từ chỉ sự không kiểu cách, một lòng và cởi mở. “Tấm lòng đơn sơ” bám gần tiếng Hy Lạp và không thu hẹp nghĩa chỉ còn sự chân thành hay rộng rãi.
theological_decisions:
- issue: “Bẻ bánh” có phải là một chỉ dẫn minh nhiên đến Bữa Ăn của Chúa hay không
  choice: Giữ thành ngữ rộng nghĩa “bẻ bánh” trong phần mô tả các bữa ăn chung.
  alternative: Dịch rõ là việc dùng bữa thông thường, hoặc xác định đây là Bữa Ăn của Chúa.
  rationale: Trong Lu-ca–Công Vụ, cụm từ có thể nói đến bữa ăn thông thường nhưng cũng có khả năng mang âm hưởng về Bữa Ăn của Chúa. Việc τροφή (“thức ăn”) xuất hiện ngay sau đó ủng hộ bối cảnh dùng bữa chung, song không đủ để loại bỏ hoàn toàn âm hưởng nghi lễ. Bản dịch và chú thích giữ nguyên sự căng nghĩa này.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng vừa phải và dễ đọc. Câu giữ nhịp liệt kê của nguyên văn; dùng “đồng lòng,” “bẻ bánh” và “tấm lòng đơn sơ” để bảo toàn các nét nghĩa thần học và từ vựng chưa thể thu hẹp chắc chắn.
