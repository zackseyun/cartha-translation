- from: 'Phi-e-rơ nói với họ: “Hãy ăn năn, và mỗi người trong anh em hãy chịu báp-têm nhân danh Chúa Giê-su, Đấng Mê-si-a, để được tha tội[a]; rồi anh em sẽ nhận được ân tứ là Đức Thánh Linh.”'
  to: 'Phi-e-rơ nói với họ: “Hãy ăn năn, và mỗi người trong anh em hãy chịu báp-têm nhân danh Giê-su, Đấng Mê-si-a, để tội lỗi anh em được tha[a], và anh em sẽ nhận được ân tứ của Đức Thánh Linh.”'
  rationale: Bản sửa loại bỏ danh xưng không có trong văn bản nguồn, tránh thêm sắc thái tuần tự, phục hồi sở hữu “anh em” trong “tội lỗi anh em”, và không áp đặt một cách hiểu duy nhất về “ân tứ của Đức Thánh Linh”. Chú thích vẫn neo đúng tại cụm chỉ sự tha tội và bảo toàn bất đồng diễn giải.
