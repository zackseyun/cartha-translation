    rationale: Nguyên văn chỉ có “Giê-su Christ/Mê-si-a”, không có danh xưng κύριος. Việc thêm “Chúa” vượt quá văn bản nguồn, dù phù hợp với cách dùng truyền thống trong một số bản dịch.
  - severity: medium
