source:
  edition: SBLGNT
  text: Πέτρος δὲ ⸂πρὸς αὐτούς· Μετανοήσατε⸃, καὶ βαπτισθήτω ἕκαστος ὑμῶν ⸀ἐπὶ τῷ ὀνόματι Ἰησοῦ Χριστοῦ εἰς ἄφεσιν ⸀τῶν ἁμαρτιῶν ⸀ὑμῶν, καὶ λήμψεσθε τὴν δωρεὰν τοῦ ἁγίου πνεύματος·
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/038.yaml
  text: And Peter said to them[a], “Repent, and let each of you be baptized in the name of Jesus the Messiah for the forgiveness of your sins[b], and you will receive the gift of the Holy Spirit.”
translation:
  language: vi
  text: 'Phi-e-rơ nói với họ: “Hãy ăn năn, và mỗi người trong anh em hãy chịu báp-têm nhân danh Giê-su, Đấng Mê-si-a, để tội lỗi anh em được tha[a], và anh em sẽ nhận được ân tứ của Đức Thánh Linh.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cụm từ “để tội lỗi anh em được tha” dịch trực tiếp εἰς ἄφεσιν τῶν ἁμαρτιῶν ὑμῶν. Các nhà giải nghĩa hiểu khác nhau về mối liên hệ giữa báp-têm và sự tha tội tại đây; bản dịch không giải quyết cuộc tranh luận ấy ngoài lời văn của câu.
    reason: theological_ambiguity
lexical_decisions:
- source_word: Μετανοήσατε
  choice: Hãy ăn năn
  rationale: Mệnh lệnh số nhiều kêu gọi một sự thay đổi dứt khoát trong tâm trí, thái độ và hướng sống; “ăn năn” là cách diễn đạt ngắn gọn, quen thuộc và giữ được sức nặng đạo đức của từ Hy Lạp.
- source_word: βαπτισθήτω ἕκαστος ὑμῶν
  choice: mỗi người trong anh em hãy chịu báp-têm
  rationale: Giữ sắc thái phân phối của ἕκαστος và lực mệnh lệnh của động từ thụ động số ít, đồng thời diễn đạt tự nhiên trong tiếng Việt.
- source_word: ἐπὶ τῷ ὀνόματι
  choice: nhân danh
  rationale: Là thành ngữ tiếng Việt tự nhiên trong ngữ cảnh này và không xác định quá mức sắc thái có thể là thẩm quyền, nền tảng hay sự tuyên xưng.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Chúa Giê-su, Đấng Mê-si-a
  rationale: Χριστός vẫn mang chức năng tước hiệu trong lời công bố mang tính Mê-si-a của Phi-e-rơ. “Đấng Mê-si-a” giữ nghĩa của tước hiệu; “Chúa” giúp danh xưng trọn vẹn và tự nhiên trong tiếng Việt, dù không phải là một từ riêng biệt trong cụm Hy Lạp.
- source_word: εἰς ἄφεσιν τῶν ἁμαρτιῶν ὑμῶν
  choice: để được tha tội
  rationale: Diễn đạt tự nhiên hướng đích/kết quả của εἰς và ý nghĩa tha thứ của ἄφεσις, nhưng không thêm lời giải thích về cơ chế hay trình tự thần học.
- source_word: λήμψεσθε
  choice: anh em sẽ nhận được
  rationale: Phản ánh trực tiếp lời hứa ở thì tương lai.
- source_word: τὴν δωρεὰν τοῦ ἁγίου πνεύματος
  choice: ân tứ là Đức Thánh Linh
  rationale: Cách hiểu sở hữu đồng vị—Đức Thánh Linh chính là ân tứ được ban—phù hợp cú pháp và tự nhiên trong tiếng Việt; tránh cách hiểu rằng đây chỉ là một ân tứ do Thánh Linh ban.
theological_decisions:
- issue: Mối liên hệ giữa báp-têm và sự tha tội trong εἰς ἄφεσιν τῶν ἁμαρτιῶν ὑμῶν
  choice: Dịch “để được tha tội” và thêm chú thích rằng bản dịch không quyết định cơ chế thần học.
  alternative: “vì tội lỗi anh em đã được tha”; “nhằm hướng đến sự tha tội”
  rationale: εἰς thường biểu thị hướng đích hoặc kết quả. Câu dịch giữ mối liên hệ do nguyên văn nêu ra nhưng không thêm cách giải thích mang tính hệ phái về hiệu lực bí tích, tính biểu tượng hay thứ tự cứu rỗi.
- issue: Cách dịch Χριστοῦ
  choice: Đấng Mê-si-a
  alternative: Đấng Christ; Cơ Đốc
  rationale: Trong bối cảnh Công Vụ 2, tước hiệu Mê-si-a vẫn nổi bật; cách dịch theo nghĩa giúp độc giả hiện đại nhận ra nội dung của tước hiệu.
- issue: Ý nghĩa của δωρεὰν τοῦ ἁγίου πνεύματος
  choice: ân tứ là Đức Thánh Linh
  alternative: ân tứ của Đức Thánh Linh
  rationale: Cách dịch chính làm rõ rằng Đức Thánh Linh là điều được ban, nhưng vẫn không triển khai thêm một học thuyết về các ân tứ thuộc linh.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” để chỉ tập thể người nghe, “báp-têm” vì đây là thuật ngữ quen thuộc và tránh thu hẹp phương thức nghi lễ. Dấu phẩy đặt quanh “Đấng Mê-si-a” làm rõ đây là tước hiệu của Chúa Giê-su.
