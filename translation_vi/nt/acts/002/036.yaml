id: ACT.2.36
reference: Acts 2:36
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀσφαλῶς οὖν γινωσκέτω πᾶς οἶκος Ἰσραὴλ ὅτι καὶ κύριον ⸂αὐτὸν καὶ χριστὸν⸃ ⸂ἐποίησεν ὁ θεός⸃, τοῦτον τὸν Ἰησοῦν ὃν ὑμεῖς ἐσταυρώσατε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/036.yaml
  text: Therefore let all the house of Israel know for certain that God has made him both Lord and Messiah—this Jesus whom you crucified[a][b].
translation:
  language: vi
  text: Vậy, toàn thể nhà Y-sơ-ra-ên hãy biết chắc rằng Đức Chúa Trời đã lập chính Đức Giê-su này—Đấng mà anh em đã đóng đinh trên thập tự giá—làm cả Chúa lẫn Đấng Mê-si-a[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “Đấng Ki-tô”. Từ Hy Lạp Χριστός (Christos) là một tước hiệu, ở đây được dịch là “Đấng Mê-si-a” để giữ rõ ý nghĩa của tước hiệu ấy trong lời Phi-e-rơ nói với nhà Y-sơ-ra-ên.
    reason: alternative_reading
  - marker: b
    text: Cụm “đã lập ... làm cả Chúa lẫn Đấng Mê-si-a” có thể được hiểu trong ngữ cảnh Đức Chúa Trời đã tôn cao Đức Giê-su, như bài giảng trước đó đã trình bày (xem câu 33).
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσφαλῶς
  choice: biết chắc
  rationale: Trạng từ nhấn mạnh tính chắc chắn; kết hợp tự nhiên với γινωσκέτω trong tiếng Việt.
- source_word: οὖν
  choice: Vậy
  rationale: Thể hiện kết luận được rút ra từ lập luận trước đó về sự sống lại và tôn cao của Đức Giê-su.
- source_word: γινωσκέτω
  choice: hãy biết
  rationale: Giữ lực mệnh lệnh ngôi thứ ba hướng đến toàn thể cộng đồng, đồng thời tự nhiên trong tiếng Việt hiện đại.
- source_word: πᾶς οἶκος Ἰσραήλ
  choice: toàn thể nhà Y-sơ-ra-ên
  rationale: Giữ thành ngữ Kinh Thánh về dân giao ước xét như một cộng đồng, thay vì giản lược thành “toàn dân Y-sơ-ra-ên”.
- source_word: κύριον
  choice: Chúa
  rationale: Diễn đạt thẩm quyền cao cả trong bối cảnh Đức Giê-su được tôn cao và giữ liên hệ với trích dẫn ngay trước đó.
- source_word: Χριστόν
  choice: Đấng Mê-si-a
  rationale: Trong lời nói với nhà Y-sơ-ra-ên, từ này rõ ràng mang nghĩa tước hiệu; “Đấng Mê-si-a” làm sáng tỏ nghĩa ấy.
- source_word: ἐποίησεν
  choice: đã lập ... làm
  rationale: Động từ có nghĩa rộng là “làm/khiến”; cách diễn đạt này tự nhiên trong tiếng Việt và trong ngữ cảnh truyền đạt hành động thiết lập hay đặt vào địa vị, mà không xóa bỏ sắc thái của nguyên văn.
- source_word: καὶ κύριον αὐτὸν καὶ χριστὸν
  choice: làm cả Chúa lẫn Đấng Mê-si-a
  rationale: Cấu trúc “cả ... lẫn ...” phản ánh hai vế tương ứng καὶ ... καὶ và giữ sự nhấn mạnh trên cả hai tước hiệu.
- source_word: τοῦτον τὸν Ἰησοῦν
  choice: chính Đức Giê-su này
  rationale: “Chính ... này” giữ lực nhấn mạnh và chỉ định của đại từ τοῦτον đi với danh riêng.
- source_word: ὃν ὑμεῖς ἐσταυρώσατε
  choice: Đấng mà anh em đã đóng đinh trên thập tự giá
  rationale: Diễn đạt trực tiếp hành động đóng đinh và giữ đại từ “anh em” được nêu rõ, qua đó bảo toàn giọng quy trách nhiệm của Phi-e-rơ.
theological_decisions:
- issue: Ý nghĩa của mệnh đề Đức Chúa Trời “đã lập” Đức Giê-su làm Chúa và Đấng Mê-si-a
  choice: Giữ ngôn ngữ thiết lập trong bản dịch và chú thích rằng ngữ cảnh nói đến sự tôn cao, công khai đặt Đức Giê-su vào địa vị ấy.
  alternative: Dịch sát hình thức hơn là “đã làm cho Ngài thành”, hoặc giải nghĩa ngay trong câu là “đã bổ nhiệm”.
  rationale: “Đã làm cho ... thành” trong tiếng Việt dễ bị hiểu là một biến đổi về bản tính, còn “bổ nhiệm” thu hẹp quá mức nghĩa rộng của ἐποίησεν. “Đã lập ... làm” giữ được hành động quyết định của Đức Chúa Trời và sắc thái chức vị trong ngữ cảnh, trong khi chú thích không buộc câu này phải giải quyết mọi vấn đề bản thể học.
- issue: Cách dịch Χριστός
  choice: Đấng Mê-si-a
  alternative: Đấng Ki-tô
  rationale: Bối cảnh lời Phi-e-rơ nói với “nhà Y-sơ-ra-ên” làm nổi bật nghĩa tước hiệu của Χριστός. Chú thích vẫn cung cấp cách gọi truyền thống “Đấng Ki-tô”.
translation_notes:
  register: Văn phong trang trọng, rõ ràng và hiện đại. Giữ thành ngữ Kinh Thánh “nhà Y-sơ-ra-ên”; dùng “anh em” cho số nhiều ὑμεῖς; dấu gạch ngang làm nổi bật mệnh đề quy trách nhiệm mà vẫn duy trì dòng chính của lời tuyên bố.
