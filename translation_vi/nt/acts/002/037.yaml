id: ACT.2.37
reference: Acts 2:37
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἀκούσαντες δὲ κατενύγησαν ⸂τὴν καρδίαν⸃, εἶπόν τε πρὸς τὸν Πέτρον καὶ τοὺς λοιποὺς ἀποστόλους· Τί ⸀ποιήσωμεν, ἄνδρες ἀδελφοί;
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/037.yaml
  text: When they heard this[a], they were pierced to the heart, and they said to Peter and the rest of the apostles, “What should we do[b], brothers?”
translation:
  language: vi
  text: 'Khi nghe những lời ấy, họ bị đâm thấu lòng[a] và nói với Phi-e-rơ cùng các sứ đồ còn lại: “Chúng tôi phải làm gì, thưa anh em[b]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đau nhói trong lòng.” Cách nói Hy Lạp diễn tả sự day dứt hoặc đau đớn sâu sắc trong nội tâm.'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “những người nam, anh em.” Đây là lối xưng hô quy ước, có thể mang nghĩa “anh em” hoặc, tùy văn cảnh, bao gồm cả anh chị em.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀκούσαντες δὲ
  choice: Khi nghe những lời ấy
  rationale: Phân từ bất định quá khứ diễn tả phản ứng xảy ra sau khi nghe bài giảng vừa nêu; “những lời ấy” được bổ sung tự nhiên từ văn cảnh. δέ chỉ sự tiếp nối trong lời kể nên không cần dịch bằng một từ nối riêng.
- source_word: κατενύγησαν τὴν καρδίαν
  choice: họ bị đâm thấu lòng
  rationale: Giữ hình ảnh mạnh của động từ Hy Lạp về việc bị tác động sâu sắc, đau nhói trong nội tâm; “lòng” là cách diễn đạt tự nhiên cho καρδία trong ngữ cảnh này.
- source_word: εἶπόν τε
  choice: và nói
  rationale: τε liên kết chặt hành động này với phản ứng trước đó; “nói” dịch trực tiếp λέγω mà không đổi thành động từ giải thích như “hỏi”.
- source_word: πρὸς τὸν Πέτρον καὶ τοὺς λοιποὺς ἀποστόλους
  choice: với Phi-e-rơ cùng các sứ đồ còn lại
  rationale: λοιπούς chỉ những người còn lại, phân biệt Phi-e-rơ với các sứ đồ khác đang được nói đến.
- source_word: Τί ποιήσωμεν
  choice: Chúng tôi phải làm gì
  rationale: Thể giả định có tính cân nhắc hỏi về việc cần làm; “phải làm gì” là cách nói tiếng Việt hiện đại, tự nhiên và truyền đạt được sự khẩn thiết mà không thêm nội dung.
- source_word: ἄνδρες ἀδελφοί
  choice: thưa anh em
  rationale: Đây là lối xưng hô quy ước, trang trọng. “Thưa anh em” tự nhiên trong tiếng Việt và giữ danh từ thân tộc, còn sắc thái giống đực cùng khả năng dùng rộng hơn được nêu trong chú thích.
theological_decisions:
- issue: Sắc thái của sự tác động trong lòng
  choice: bị đâm thấu lòng
  alternative: đau nhói trong lòng; vô cùng đau đớn trong lòng
  rationale: Bản dịch chính giữ phép ẩn dụ sắc bén của nguyên văn mà không quyết định cụ thể đây chỉ là ăn năn, mặc cảm tội lỗi hay đau buồn; chú thích giải thích phạm vi ý nghĩa.
- issue: Lối xưng hô có giống ngữ pháp
  choice: anh em
  alternative: những người anh em; anh chị em
  rationale: Cụm Hy Lạp mang hình thức giống đực. Bản chính không mở rộng thành “anh chị em”, nhưng chú thích bảo lưu khả năng đây là lối xưng hô quy ước có thể hướng đến một nhóm rộng hơn tùy văn cảnh.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Trật tự lời gọi “thưa anh em” được đặt cuối câu hỏi cho tự nhiên trong tiếng Việt, đồng thời vẫn giữ nguyên chức năng xưng hô. Dùng “Phi-e-rơ” và “sứ đồ” theo lối gọi Kinh Thánh quen thuộc.
