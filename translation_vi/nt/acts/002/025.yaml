  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Δαυὶδ γὰρ λέγει εἰς αὐτόν· Προορώμην τὸν κύριον ἐνώπιόν μου διὰ παντός, ὅτι ἐκ δεξιῶν μού ἐστιν ἵνα μὴ σαλευθῶ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/025.yaml
  text: For David says concerning him, ‘I kept seeing the Lord before me continually, because he is at my right hand, so that I may not be shaken.’
translation:
  language: vi
  text: 'Vì Đa-vít nói về Người rằng: “Tôi luôn thấy[a] Chúa[b] ở trước mặt tôi, vì Ngài ở bên phải tôi, để tôi không bị lay chuyển.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Động từ Hy Lạp này cũng có thể mang nghĩa “thấy trước”. Tuy nhiên, các cụm từ chung quanh ở đây nghiêng về ý luôn nhìn thấy hoặc giữ Chúa ở trước mặt mình.
    reason: lexical_alternative
  - marker: b
    text: Phi-e-rơ đang trích Thi Thiên 16:8. Trong bản Hê-bơ-rơ của Thi Thiên, danh xưng tương ứng là danh riêng của Đức Chúa Trời, thường được dịch là “ĐỨC CHÚA”.
    reason: cross_reference
lexical_decisions:
- source_word: λέγει εἰς αὐτόν
  choice: nói về Người
  rationale: Trong công thức dẫn nhập lời trích này, εἰς αὐτόν có nghĩa là nói về hoặc liên quan đến một người, chứ không phải trực tiếp nói với người ấy. Viết hoa “Người” theo quy ước tiếng Việt để chỉ đấng mà Phi-e-rơ đang nói đến, nhưng không đưa danh xưng giải nghĩa vào câu.
- source_word: Προορώμην
  choice: Tôi luôn thấy
  rationale: Thể chưa hoàn thành cùng với διὰ παντός diễn tả hành động liên tục hoặc thường xuyên. “Luôn thấy” tự nhiên trong tiếng Việt và giữ hình ảnh nhìn thấy Chúa trước mặt; nghĩa từ nguyên “thấy trước” được ghi ở chú thích.
- source_word: κύριον
  choice: Chúa
  rationale: Đây là cách tương đương tự nhiên, trang trọng của κύριος trong tiếng Việt. Bản văn chính không đổi thành một danh xưng cụ thể hơn, nhằm giữ nguyên độ mở thần học của lời trích.
- source_word: ἐνώπιόν μου
  choice: ở trước mặt tôi
  rationale: Giữ được hình ảnh không gian–tương quan của nguyên văn và là cách nói tự nhiên trong tiếng Việt.
- source_word: διὰ παντός
  choice: luôn
  rationale: Diễn đạt ý liên tục, thường xuyên một cách gọn và tự nhiên, đồng thời bổ nghĩa rõ cho động từ “thấy”.
- source_word: ἐκ δεξιῶν μού
  choice: ở bên phải tôi
  rationale: Diễn đạt đúng vị trí ở phía bên phải, hàm ý sự hiện diện nâng đỡ mà không đưa hàm ý ấy trực tiếp vào bản dịch.
- source_word: ἵνα μὴ σαλευθῶ
  choice: để tôi không bị lay chuyển
  rationale: “Để” giữ quan hệ mục đích/kết quả của ἵνα; “bị lay chuyển” bảo toàn thể bị động và ẩn dụ về việc mất sự vững vàng.
theological_decisions:
- issue: Đối tượng của “Chúa” trong lời trích Thi Thiên khi được Phi-e-rơ sử dụng
  choice: Giữ “Chúa” trong bản văn, không xác định thêm
  alternative: “ĐỨC CHÚA” hoặc “Đấng Mê-si-a”
  rationale: Phi-e-rơ áp dụng Thi Thiên 16 theo hướng Đấng Christ, còn bản Hy Lạp được trích ở đây chỉ có κύριον. Giữ “Chúa” tránh thay lời trích bằng một sự đồng nhất mang tính diễn giải.
- issue: Sắc thái của Προορώμην
  choice: “Tôi luôn thấy”
  alternative: “Tôi thấy trước”
  rationale: Bối cảnh với “ở trước mặt tôi” và “luôn” nghiêng về việc liên tục nhìn hoặc đặt Chúa trước mặt mình hơn là sự thấy trước mang tính tiên tri; tuy nhiên, khả năng từ vựng kia vẫn được bảo lưu trong chú thích.
translation_notes:
  register: 'Văn phong hiện đại, trang trọng và dễ hiểu. Câu trích giữ nhịp thơ vừa phải nhưng tránh lối diễn đạt cổ. Hai dấu chú thích được đặt sau toàn bộ câu trích: [a] giải thích lựa chọn từ vựng ở đầu câu, [b] cung cấp xuất xứ và dữ kiện về danh xưng “Chúa”.'
