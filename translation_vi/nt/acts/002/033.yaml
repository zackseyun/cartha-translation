id: ACT.2.33
reference: Acts 2:33
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τῇ δεξιᾷ οὖν τοῦ θεοῦ ὑψωθεὶς τήν τε ἐπαγγελίαν τοῦ ⸂πνεύματος τοῦ ἁγίου⸃ λαβὼν παρὰ τοῦ πατρὸς ἐξέχεεν τοῦτο ⸀ὃ ⸀ὑμεῖς βλέπετε καὶ ἀκούετε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/033.yaml
  text: Therefore[a], having been exalted to the right hand of God, and having received from the Father the promise of the Holy Spirit[b], he has poured out this that you yourselves are seeing and hearing.
translation:
  language: vi
  text: Vậy, sau khi được tôn cao lên bên hữu Đức Chúa Trời[a] và nhận từ Đức Chúa Cha điều đã hứa là Đức Thánh Linh[b], Ngài đã tuôn đổ điều này—điều chính anh em đang thấy và nghe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “được tôn cao bởi tay hữu Đức Chúa Trời.” Cách cho trong tiếng Hy Lạp có thể chỉ vị trí (“lên bên hữu”) hoặc phương tiện (“bởi tay hữu,” hàm ý quyền năng).'
    reason: alternative_reading
  - marker: b
    text: 'Cũng có thể dịch: “lời hứa về Đức Thánh Linh.” Tiếng Hy Lạp có thể chỉ chính Đức Thánh Linh là điều đã được hứa, hoặc lời hứa liên quan đến Đức Thánh Linh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ δεξιᾷ τοῦ θεοῦ
  choice: lên bên hữu Đức Chúa Trời
  rationale: Hiểu cách cho ở đây theo nghĩa vị trí, phù hợp với chủ đề Đấng Mê-si được tôn cao và ngự bên hữu trong mạch văn; nghĩa phương tiện vẫn được ghi ở chú thích.
- source_word: οὖν
  choice: Vậy
  rationale: Diễn tả kết luận suy ra từ lập luận ngay trước đó một cách tự nhiên trong tiếng Việt.
- source_word: ὑψωθεὶς
  choice: sau khi được tôn cao
  rationale: Phân từ aorist bị động chỉ hành động tôn cao đã xảy ra trước động từ chính; cách dịch này giữ cả trình tự lẫn sắc thái được Đức Chúa Trời tôn lên.
- source_word: τὴν ἐπαγγελίαν τοῦ πνεύματος τοῦ ἁγίου
  choice: điều đã hứa là Đức Thánh Linh
  rationale: Cách diễn đạt tự nhiên cho thấy Đức Thánh Linh là điều được hứa và được nhận, đồng thời chú thích bảo lưu khả năng hiểu là lời hứa liên quan đến Đức Thánh Linh.
- source_word: λαβὼν παρὰ τοῦ πατρὸς
  choice: nhận từ Đức Chúa Cha
  rationale: Giữ Đức Chúa Cha là nguồn ban và thể hiện hành động có trước việc tuôn đổ.
- source_word: ἐξέχεεν
  choice: đã tuôn đổ
  rationale: Diễn tả hành động đã hoàn tất nhưng có kết quả đang hiện rõ trước mắt người nghe.
- source_word: τοῦτο ὃ ὑμεῖς βλέπετε καὶ ἀκούετε
  choice: điều này mà chính anh em đang thấy và nghe
  rationale: Giữ đại từ chỉ định không diễn giải quá mức, bảo toàn sự nhấn mạnh của ὑμεῖς bằng “chính anh em,” và phản ánh hành động tri giác đang diễn ra.
theological_decisions:
- issue: τῇ δεξιᾷ τοῦ θεοῦ chỉ vị trí hay phương tiện
  choice: được tôn cao lên bên hữu Đức Chúa Trời
  alternative: được quyền năng Đức Chúa Trời tôn cao
  rationale: Nghĩa vị trí phù hợp nhất với ngôn ngữ đăng quang và lời trích Thi Thiên 110 trong câu kế tiếp; tuy nhiên, cách cho Hy Lạp cũng có thể mang nghĩa phương tiện nên được bảo lưu trong chú thích.
- issue: τὴν ἐπαγγελίαν τοῦ πνεύματος τοῦ ἁγίου là Đức Thánh Linh được hứa hay lời hứa về Đức Thánh Linh
  choice: điều đã hứa là Đức Thánh Linh
  alternative: lời hứa về Đức Thánh Linh
  rationale: Mệnh đề tiếp theo nói Chúa Giê-su tuôn đổ “điều này,” nên cách hiểu Đức Thánh Linh là điều được hứa và nhận có sức nặng trong văn cảnh. Cấu trúc sở hữu cách vẫn cho phép cách hiểu lời hứa liên quan đến Đức Thánh Linh, vì vậy giữ trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Trời,” “Đức Chúa Cha,” “Đức Thánh Linh” theo cách gọi Kinh Thánh quen thuộc; “Ngài” chỉ Chúa Giê-su, còn “anh em” phù hợp với lời Phi-e-rơ nói trực tiếp với đám đông.
