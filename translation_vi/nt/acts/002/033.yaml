  to: Vậy, sau khi được tôn cao lên bên hữu Đức Chúa Trời[a] và nhận từ Đức Chúa Cha điều đã hứa là Đức Thánh Linh[b], Ngài đã tuôn đổ điều này—điều chính anh em đang thấy và nghe.
