  source_fidelity: 'Bản dịch phản ánh đúng cấu trúc chính: οὖν là suy luận (“Vậy”), hai phân từ aorist chỉ những việc có trước hành động tuôn đổ, và đại từ nhấn mạnh ὑμεῖς được chuyển bằng “chính anh em.” Cách hiểu “điều đã hứa là Đức Thánh Linh” là khả dĩ trong văn mạch và chú thích đã bảo lưu cách hiểu khác của sở hữu cách. Tuy nhiên, cách nối “điều này mà chính anh em...” không tự nhiên và làm mối liên hệ của ὃ với τοῦτο kém rõ.'
  naturalness: 'Cần thay mệnh đề quan hệ bằng lối đồng vị tự nhiên hơn trong tiếng Việt: “điều này—điều chính anh em đang thấy và nghe.” Cũng nên làm chú thích a thành ngữ và sát với nghĩa phương tiện hơn.'
  terminology: Các thuật ngữ “Đức Chúa Trời,” “Đức Chúa Cha,” “Đức Thánh Linh,” “bên hữu,” và “tuôn đổ” nhất quán với văn phong Kinh Thánh Việt ngữ hiện đại. Không cần thay đổi thuật ngữ thần học.
