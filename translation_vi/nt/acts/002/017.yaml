revisions:
- from: '“Trong những ngày cuối cùng, Đức Chúa Trời phán,

    điều này sẽ xảy ra:

    Ta sẽ tuôn đổ từ Thần Khí của Ta trên mọi xác thịt[a];

    các con trai của các ngươi và các con gái của các ngươi sẽ nói tiên tri;

    các thanh niên của các ngươi sẽ thấy khải tượng,

    và các cụ ông của các ngươi sẽ chiêm bao.”'
  to: '“Trong những ngày cuối cùng,” Đức Chúa Trời phán,

    “Ta sẽ tuôn đổ từ Thần Khí của Ta trên mọi xác thịt[a];

    các con trai của các ngươi và các con gái của các ngươi sẽ nói tiên tri;

    các thanh niên của các ngươi sẽ thấy khải tượng,

    và những người nam cao tuổi của các ngươi sẽ mơ những giấc mơ.”'
  rationale: Bản sửa loại bỏ phần thêm không có trong nguồn, giữ trật tự và nhịp của lời tiên tri, đồng thời điều chỉnh cách gọi nhóm πρεσβύτεροι để phản ánh chính xác hơn sự đối lập với “các thanh niên.” Không thay đổi ý nghĩa hay mở rộng diễn giải thần học.
  reviewer_model: gpt-5.6-terra
