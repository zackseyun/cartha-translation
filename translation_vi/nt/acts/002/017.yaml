id: ACT.2.17
reference: Acts 2:17
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ ἔσται ἐν ταῖς ἐσχάταις ἡμέραις, λέγει ὁ θεός, ἐκχεῶ ἀπὸ τοῦ πνεύματός μου ἐπὶ πᾶσαν σάρκα, καὶ προφητεύσουσιν οἱ υἱοὶ ὑμῶν καὶ αἱ θυγατέρες ὑμῶν, καὶ οἱ νεανίσκοι ὑμῶν ὁράσεις ὄψονται, καὶ οἱ πρεσβύτεροι ὑμῶν ⸀ἐνυπνίοις ἐνυπνιασθήσονται·
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/017.yaml
  text: And it will be in the last days[a], says God, that I will pour out from my Spirit on all flesh, and your sons and your daughters will prophesy, and your young men will see visions[b], and your old men will dream dreams.
translation:
  language: vi
  text: '“Trong những ngày cuối cùng,” Đức Chúa Trời phán,

    “Ta sẽ tuôn đổ từ Thần Khí của Ta trên mọi xác thịt[a];

    các con trai của các ngươi và các con gái của các ngươi sẽ nói tiên tri;

    các thanh niên của các ngươi sẽ thấy khải tượng,

    và những người nam cao tuổi của các ngươi sẽ mơ những giấc mơ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “trên mọi người” hoặc “trên toàn thể nhân loại.” Nguyên văn là “trên mọi xác thịt,” một thành ngữ tiên tri chỉ loài người.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ταῖς ἐσχάταις ἡμέραις
  choice: trong những ngày cuối cùng
  rationale: Diễn đạt tự nhiên trong tiếng Việt hiện đại, đồng thời giữ nguyên ý nghĩa thời kỳ cánh chung của cụm từ Hy Lạp mà không xác định thêm phạm vi thời gian.
- source_word: λέγει ὁ θεός
  choice: Đức Chúa Trời phán
  rationale: Giữ công thức trích dẫn ở thì hiện tại và dùng động từ trang trọng, tự nhiên khi Đức Chúa Trời trực tiếp tuyên phán.
- source_word: ἐκχεῶ
  choice: Ta sẽ tuôn đổ
  rationale: Giữ hình ảnh cụ thể của hành động đổ ra; “tuôn đổ” tự nhiên và trang trọng trong ngữ cảnh lời tiên tri.
- source_word: ἀπὸ τοῦ πνεύματός μου
  choice: từ Thần Khí của Ta
  rationale: Giữ giới từ ἀπό, nghĩa là “từ”, thay vì làm cho câu chỉ còn mang nghĩa đơn giản là đổ chính Thần Khí; “Thần Khí” viết hoa vì ngữ cảnh chỉ Thần Khí của Đức Chúa Trời.
- source_word: ἐπὶ πᾶσαν σάρκα
  choice: trên mọi xác thịt
  rationale: Giữ hình ảnh và thành ngữ tiên tri của nguyên văn, cũng như mối liên hệ với sách Giô-ên; chú thích nêu nghĩa rộng là mọi người.
- source_word: προφητεύσουσιν
  choice: sẽ nói tiên tri
  rationale: Thuật ngữ trực tiếp, quen thuộc và không làm suy giảm sắc thái tiên tri của động từ.
- source_word: οἱ υἱοὶ ὑμῶν καὶ αἱ θυγατέρες ὑμῶν
  choice: các con trai của các ngươi và các con gái của các ngươi
  rationale: Giữ sự lặp lại đại từ sở hữu và cặp giới tính được nêu rõ trong nguyên văn, nhấn mạnh sự tham dự rộng rãi.
- source_word: οἱ νεανίσκοι ὑμῶν
  choice: các thanh niên của các ngươi
  rationale: Diễn đạt tự nhiên và giữ giống đực của danh từ Hy Lạp trong sự đối xứng với nhóm nam giới cao tuổi.
- source_word: ὁράσεις ὄψονται
  choice: sẽ thấy khải tượng
  rationale: Chuyển đạt tự nhiên cấu trúc đồng nguyên trong tiếng Hy Lạp và giữ thuật ngữ chỉ sự hiện thấy mang tính mặc khải.
- source_word: οἱ πρεσβύτεροι ὑμῶν
  choice: các cụ ông của các ngươi
  rationale: Bối cảnh đối chiếu nhóm tuổi với “các thanh niên”, nên “cụ ông” giữ cả tuổi tác lẫn giới tính mà không gợi đến một chức vụ như “trưởng lão”.
- source_word: ἐνυπνίοις ἐνυπνιασθήσονται
  choice: sẽ chiêm bao
  rationale: Cách nói tiếng Việt tự nhiên cho cấu trúc đồng nguyên “mơ những giấc mơ”, đồng thời giữ sự song hành với việc thấy khải tượng.
theological_decisions:
- issue: Phạm vi và sắc thái thành ngữ của “mọi xác thịt”
  choice: Giữ “mọi xác thịt” trong chính văn và chú thích rằng thành ngữ này có nghĩa là mọi người.
  alternative: mọi người; toàn thể nhân loại
  rationale: Cách dịch này bảo tồn hình ảnh lời tiên tri và bề rộng của lời hứa, không thu hẹp việc ban Thần Khí vào một nhóm người, đồng thời giúp độc giả hiện đại hiểu thành ngữ.
- issue: πνεῦμα trong lời Đức Chúa Trời hứa tuôn đổ
  choice: Thần Khí của Ta
  alternative: thần khí của Ta; linh của Ta
  rationale: Ngữ cảnh chỉ Thần Khí thuộc về Đức Chúa Trời. Viết hoa làm rõ đối tượng thần linh nhưng không thêm một định nghĩa giáo phái vào câu.
- issue: Sắc thái của ἀπό trong cụm “từ Thần Khí của Ta”
  choice: Giữ giới từ “từ” trong chính văn.
  alternative: Ta sẽ tuôn đổ Thần Khí của Ta
  rationale: Nguyên văn dùng ἀπό, nên bản dịch giữ cách diễn đạt nguồn xuất phát và tránh âm thầm thay nó bằng một cấu trúc không có giới từ, dù cách nói này hơi khác lối diễn đạt thông thường trong tiếng Việt.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, trình bày theo nhịp thơ của lời tiên tri được trích dẫn. Dùng “Đức Chúa Trời phán”, “Thần Khí”, “khải tượng” và “chiêm bao” để giữ sắc thái Kinh Thánh mà vẫn dễ hiểu. Đại từ “Ta/các ngươi” phản ánh lời phán trực tiếp và số nhiều của nguyên văn.
