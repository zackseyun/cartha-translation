revisions:
- from: Bấy giờ, mọi người đều kinh sợ[a], và nhiều việc kỳ diệu cùng dấu lạ liên tục được thực hiện qua các sứ đồ.
  to: Mọi người đều kinh sợ[a], và nhiều việc kỳ diệu cùng dấu lạ đang diễn ra qua các sứ đồ.
  rationale: Bản sửa giữ "kinh sợ," cặp "việc kỳ diệu ... dấu lạ," và vai trò trung gian của các sứ đồ. Lược "Bấy giờ" để không biến liên từ δέ thành một chỉ dấu thời gian mạnh, và thay "liên tục được thực hiện" bằng "đang diễn ra" để phản ánh thì vị hoàn mà không thêm ý không ngừng.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T08:27:46Z'
review_pass:
  verdict: revise
  source_fidelity: Bản dịch phân biệt được τέρατα ("việc kỳ diệu") và σημεῖα ("dấu lạ"), đồng thời dịch διὰ τῶν ἀποστόλων là "qua các sứ đồ" cách phù hợp. Tuy nhiên, "liên tục" khẳng định tính không gián đoạn mạnh hơn thì vị hoàn ἐγίνετο, vốn chỉ tình trạng/diễn tiến hay các sự việc xảy ra lặp lại trong quá khứ. "Bấy giờ" cũng thiên về mốc thời gian hơn chức năng nối tiếp nhẹ của δέ.
  naturalness: '"Mọi người đều kinh sợ" là cách nói hiện đại, tự nhiên và trang trọng. "Nhiều việc kỳ diệu cùng dấu lạ được thực hiện qua các sứ đồ" có thể hiểu rõ, nhưng "đang diễn ra qua các sứ đồ" phản ánh trực tiếp hơn động từ γίνομαι trong ngữ cảnh mà không áp đặt sắc thái "liên tục".'
  terminology: '"Sứ đồ" là thuật ngữ Kinh Thánh chuẩn. "Việc kỳ diệu" và "dấu lạ" bảo toàn cặp thuật ngữ mà không đồng nhất cả hai thành "phép lạ". "Kinh sợ" giữ sự căng thẳng ngữ nghĩa của φόβος; chú thích nêu phương án "lòng kính sợ" cách thích đáng.'
  issues:
  - severity: medium
    issue: Từ "liên tục" thêm mức độ diễn tiến không gián đoạn.
    rationale: Vị hoàn ἐγίνετο cho thấy hành động/sự việc đang diễn ra hoặc lặp lại trong khung quá khứ, nhưng không tự nó xác quyết là liên tục, không ngừng.
  - severity: low
    issue: '"Bấy giờ" diễn giải δέ như một mốc thời gian rõ nét.'
    rationale: δέ chủ yếu nối tiếp diễn ngôn ở đây; lược đi vẫn cho mạch tiếng Việt tự nhiên và tránh thêm sắc thái thời điểm.
