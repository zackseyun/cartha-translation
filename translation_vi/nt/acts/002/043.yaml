  text: ⸀Ἐγίνετο δὲ πάσῃ ψυχῇ φόβος, πολλά ⸀τε τέρατα καὶ σημεῖα διὰ τῶν ἀποστόλων ἐγίνετο.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/043.yaml
  text: And fear came upon every soul[a], and many wonders and signs were being done through the apostles.
translation:
  language: vi
  text: Mọi người đều kinh sợ[a], và nhiều việc kỳ diệu cùng dấu lạ đang diễn ra qua các sứ đồ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “mọi người đều đầy lòng kính sợ.” Tiếng Hy Lạp sát nghĩa là “sự sợ hãi đến trên mỗi linh hồn.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγίνετο δὲ πάσῃ ψυχῇ φόβος
  choice: Bấy giờ, mọi người đều kinh sợ
  rationale: Diễn đạt tự nhiên cấu trúc Hy Lạp theo nghĩa nỗi sợ nảy sinh và bao trùm từng người. “Bấy giờ” nối tiếp mạch kể mà không tạo ý tương phản mạnh; “kinh sợ” giữ được sức nặng của φόβος, đồng thời vẫn có thể gợi sắc thái kính phục.
- source_word: πάσῃ ψυχῇ
  choice: mọi người
  rationale: Nghĩa đen là “mỗi linh hồn”, nhưng trong ngữ cảnh đây là thành ngữ chỉ từng người; “mọi người” rõ ràng và tự nhiên trong tiếng Việt hiện đại.
- source_word: πολλά τε τέρατα καὶ σημεῖα
  choice: nhiều việc kỳ diệu cùng dấu lạ
  rationale: 'Giữ hai nét nghĩa phân biệt: τέρατα nhấn mạnh tính gây kinh ngạc, còn σημεῖα nhấn mạnh chức năng làm dấu chỉ. “Cùng” nối cặp từ một cách trang trọng, tự nhiên.'
- source_word: διὰ τῶν ἀποστόλων
  choice: qua các sứ đồ
  rationale: διά với sở hữu cách biểu thị phương tiện hoặc tác nhân trung gian; “qua” giữ hàm ý các sứ đồ là người được dùng để thực hiện, không nhất thiết là tác nhân tối hậu.
- source_word: ἐγίνετο
  choice: liên tục được thực hiện
  rationale: Thì vị hoàn biểu thị hoạt động đang tiếp diễn hoặc lặp lại. Cách dịch bị động tự nhiên trong ngữ cảnh và phù hợp với cụm “qua các sứ đồ”.
theological_decisions:
- issue: Sắc thái của φόβος trước hoạt động của Đức Chúa Trời
  choice: kinh sợ
  alternative: kinh ngạc; lòng kính sợ
  rationale: “Kinh sợ” bảo toàn sức mạnh từ vựng và sự căng thẳng giữa sợ hãi với kính phục, thay vì giải thích hẳn theo một hướng.
- issue: Tác nhân thực hiện các việc kỳ diệu và dấu lạ
  choice: được thực hiện qua các sứ đồ
  alternative: do các sứ đồ thực hiện
  rationale: Cấu trúc này giữ các sứ đồ ở vai trò tác nhân trung gian theo διά với sở hữu cách, đồng thời không thêm rõ một tác nhân tối hậu mà câu Hy Lạp chỉ hàm ý.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “sứ đồ” theo cách gọi Kinh Thánh quen thuộc; tránh dịch sát “mỗi linh hồn” trong chính văn vì không tự nhiên trong tiếng Việt, nhưng bảo lưu trong chú thích.
