  text: ἐξίσταντο δὲ πάντες καὶ ⸀διηπόρουν, ἄλλος πρὸς ἄλλον λέγοντες· Τί ⸀θέλει τοῦτο εἶναι;
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/012.yaml
  text: And they all were amazed and perplexed[a], saying to one another, “What does this mean?”
translation:
  language: vi
  text: 'Tất cả đều kinh ngạc và bối rối, nói với nhau: “Điều này có nghĩa là gì?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn có cách nói sát chữ: “Điều này muốn là gì?” Đây là một thành ngữ có nghĩa: “Điều này có nghĩa là gì?” hoặc “Điều này có ý nghĩa gì?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξίσταντο
  choice: đều kinh ngạc
  rationale: Động từ ở thì chưa hoàn thành diễn tả trạng thái sửng sốt đang tiếp diễn; “kinh ngạc” tự nhiên, trang trọng và không gây liên tưởng sai như cách dịch quá sát từ nguyên.
- source_word: δὲ
  choice: không dịch thành từ riêng
  rationale: Ở đây δέ là liên từ nhẹ nối tiếp mạch kể chuyện; trong tiếng Việt, không cần biểu đạt bằng một từ riêng vẫn giữ được dòng văn tự nhiên.
- source_word: πάντες
  choice: Tất cả
  rationale: Giữ rõ sắc thái bao quát của πάντες, chỉ toàn thể những người đang phản ứng trong văn cảnh.
- source_word: διηπόρουν
  choice: bối rối
  rationale: Diễn tả tình trạng hoang mang, không biết phải hiểu sự việc ra sao; thì chưa hoàn thành cho thấy trạng thái này đang tiếp diễn.
- source_word: ἄλλος πρὸς ἄλλον
  choice: với nhau
  rationale: Đây là cách diễn đạt tương hỗ tự nhiên trong tiếng Việt hiện đại.
- source_word: λέγοντες
  choice: nói
  rationale: Giữ cách trình bày trung tính của phân từ, dẫn vào nội dung lời họ nói.
- source_word: Τί θέλει τοῦτο εἶναι;
  choice: Điều này có nghĩa là gì?
  rationale: Cụm τί θέλει + động từ nguyên mẫu là thành ngữ hỏi về ý nghĩa hay tầm quan trọng của một sự việc; cách dịch này truyền đạt đúng nghĩa trong tiếng Việt tự nhiên.
