  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐξίσταντο ⸀δὲ καὶ ἐθαύμαζον ⸀λέγοντες· ⸀Οὐχ ἰδοὺ ⸀πάντες οὗτοί εἰσιν οἱ λαλοῦντες Γαλιλαῖοι;
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/007.yaml
  text: And they were astonished and amazed[a], saying, “Look, are not all these who are speaking Galileans?”
translation:
  language: vi
  text: 'Họ sửng sốt và kinh ngạc, nói rằng: “Kìa, chẳng phải tất cả những người đang nói đây đều là người Ga-li-lê sao?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξίσταντο
  choice: sửng sốt
  rationale: Diễn đạt trạng thái hết sức ngạc nhiên của động từ ở thì chưa hoàn thành, tự nhiên trong tiếng Việt hiện đại mà vẫn giữ được cường độ.
- source_word: δὲ
  choice: và
  rationale: Ở đây là liên từ nhẹ tiếp nối mạch kể; “và” phù hợp tự nhiên trong tiếng Việt.
- source_word: καὶ
  choice: và
  rationale: 'Nối hai phản ứng tích lũy: sửng sốt và kinh ngạc.'
- source_word: ἐθαύμαζον
  choice: kinh ngạc
  rationale: Giữ ý ngạc nhiên, thán phục trước điều chứng kiến, đồng thời phân biệt vừa đủ với ἐξίσταντο.
- source_word: λέγοντες
  choice: nói rằng
  rationale: Dẫn trực tiếp nội dung lời nói một cách rõ ràng và tự nhiên.
- source_word: Οὐχ
  choice: chẳng phải ... sao?
  rationale: Câu hỏi phủ định trong nguyên ngữ chờ đợi câu trả lời khẳng định; cấu trúc này bảo toàn sắc thái ấy trong tiếng Việt.
- source_word: ἰδοὺ
  choice: Kìa
  rationale: Tiểu từ thu hút sự chú ý; “Kìa” trang trọng vừa phải, tự nhiên và giữ sắc thái chỉ trỏ của nguyên ngữ.
- source_word: πάντες οὗτοί
  choice: tất cả những người ... đây
  rationale: Chỉ toàn bộ nhóm đang được quan sát mà không thêm giới tính vốn không được nói rõ trong cụm từ Hy Lạp.
- source_word: οἱ λαλοῦντες
  choice: những người đang nói
  rationale: Giữ tính chất danh từ hóa và hành động đang tiếp diễn của phân từ hiện tại.
- source_word: Γαλιλαῖοι
  choice: người Ga-li-lê
  rationale: Danh xưng vùng miền trực tiếp, không thêm suy luận về học vấn, địa vị hay giọng nói.
theological_decisions:
- issue: Hàm ý xã hội hoặc vùng miền của “người Ga-li-lê”
  choice: Giữ nguyên danh xưng vùng miền, không giải thích thêm.
  alternative: “những người Ga-li-lê ít học” hoặc một cách diễn đạt nhấn mạnh xuất thân miền bắc
  rationale: Câu này bày tỏ sự ngạc nhiên về căn tính Ga-li-lê của những người nói, nhưng không nói rõ nguyên nhân; thêm địa vị, học vấn hay giọng nói sẽ vượt quá văn bản.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. Dùng “Kìa” thay cho lối cổ hơn như “Này, hãy xem”; tên vùng được viết “Ga-li-lê” theo dạng quen thuộc trong tiếng Việt. Không cần chú thích vì lựa chọn này không tạo ra khác biệt đáng kể cần trình bày ở cấp câu.
