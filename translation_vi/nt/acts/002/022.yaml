id: ACT.2.22
reference: Acts 2:22
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἄνδρες Ἰσραηλῖται, ἀκούσατε τοὺς λόγους τούτους. Ἰησοῦν τὸν Ναζωραῖον, ἄνδρα ⸂ἀποδεδειγμένον ἀπὸ τοῦ θεοῦ⸃ εἰς ὑμᾶς δυνάμεσι καὶ τέρασι καὶ σημείοις οἷς ἐποίησεν δι’ αὐτοῦ ὁ θεὸς ἐν μέσῳ ὑμῶν, ⸀καθὼς αὐτοὶ οἴδατε,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/022.yaml
  text: 'Men of Israel[a], hear these words: Jesus the Nazarene, a man attested to you by God with miracles and wonders and signs that God did through him in your midst[b], just as you yourselves know—'
translation:
  language: vi
  text: 'Thưa các ông Ít-ra-en, hãy nghe những lời này: Giê-su, người Na-xa-rét,[a] là một người đã được Đức Chúa Trời chứng thực trước các ông bằng những việc quyền năng, những điều kỳ diệu và những dấu lạ[b] mà Đức Chúa Trời đã làm qua Ngài ở giữa các ông, như chính các ông đã biết—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Giê-su ở Na-xa-rét” hoặc “Giê-su người Na-xô-rê.” Danh xưng Hy Lạp Ναζωραῖος có thể được chuyển theo địa danh hoặc được giữ dưới dạng “người Na-xô-rê.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “các phép lạ, những điều kỳ diệu và những dấu lạ.” Từ Hy Lạp δυνάμεσι sát nghĩa là “quyền năng” hoặc “những việc quyền năng”; trong ngữ cảnh này cũng có thể diễn đạt là “các phép lạ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄνδρες Ἰσραηλῖται
  choice: Thưa anh em Ít-ra-en
  rationale: Cách xưng hô này tự nhiên trong tiếng Việt, vẫn giữ sắc thái trực tiếp và yếu tố nam giới của ἄνδρες, đồng thời nêu rõ căn tính Ít-ra-en của người nghe.
- source_word: ἀκούσατε τοὺς λόγους τούτους
  choice: hãy nghe những lời này
  rationale: Giữ mệnh lệnh kêu gọi chú ý của ἀκούσατε và nghĩa trực tiếp của λόγους, không diễn giải thành “sứ điệp”.
- source_word: Ἰησοῦν τὸν Ναζωραῖον
  choice: Giê-su người Na-xa-rét
  rationale: Diễn đạt tự nhiên danh xưng gắn với quê quán/căn tính của Giê-su; chú thích bảo lưu khả năng hiểu theo dạng danh hiệu “người Na-xô-rê”.
- source_word: ἄνδρα
  choice: một người
  rationale: Giữ lời khẳng định rõ ràng về nhân tính của Giê-su; trong tiếng Việt, “một người” tự nhiên hơn “một người nam” ở cấu trúc này.
- source_word: ἀποδεδειγμένον ἀπὸ τοῦ θεοῦ
  choice: đã được Đức Chúa Trời chứng thực
  rationale: “Chứng thực” truyền đạt ý được công khai cho thấy là xác thật; thể bị động giữ Đức Chúa Trời là tác nhân của sự chứng thực.
- source_word: εἰς ὑμᾶς
  choice: trước anh em
  rationale: Trong ngữ cảnh công khai chứng thực cho nhóm người nghe, “trước anh em” tự nhiên và phân biệt với ἐν μέσῳ ὑμῶν ở phần sau.
- source_word: δυνάμεσι καὶ τέρασι καὶ σημείοις
  choice: những việc quyền năng, những điều kỳ diệu và những dấu lạ
  rationale: Giữ ba thành tố riêng biệt của công thức Hy Lạp; “việc quyền năng” bảo lưu sắc thái sức mạnh nơi δυνάμεσι, còn “điều kỳ diệu” và “dấu lạ” diễn đạt tự nhiên hai danh từ kế tiếp.
- source_word: οἷς ἐποίησεν δι’ αὐτοῦ ὁ θεὸς
  choice: mà Đức Chúa Trời đã làm qua người
  rationale: Giữ đúng Đức Chúa Trời là chủ thể hành động và Giê-su là trung gian được diễn tả bằng δι’ αὐτοῦ. Đại từ “người” tránh tự ý thêm tước hiệu không có trong câu Hy Lạp.
- source_word: ἐν μέσῳ ὑμῶν
  choice: ở giữa anh em
  rationale: Dịch sát thành ngữ chỉ những việc diễn ra ngay trong cộng đồng người nghe.
- source_word: καθὼς αὐτοὶ οἴδατε
  choice: như chính anh em đã biết
  rationale: Từ “chính” giữ sự nhấn mạnh của αὐτοὶ.
theological_decisions:
- issue: Cách diễn đạt ἄνδρα về nhân tính của Giê-su
  choice: Giữ “một người” trong chính văn
  alternative: Lược bỏ danh từ hoặc đổi thành cách nói mơ hồ hơn
  rationale: Bản Hy Lạp minh nhiên gọi Giê-su là ἄνδρα. Giữ nguyên ý này bảo tồn lời khẳng định của Phi-e-rơ về nhân tính thật của Giê-su mà không suy diễn phủ nhận thần tính.
- issue: Tác nhân trong mệnh đề nói về các việc quyền năng
  choice: 'Để Đức Chúa Trời làm chủ thể: “mà Đức Chúa Trời đã làm qua người”'
  alternative: Đổi Giê-su thành chủ thể trực tiếp của các việc ấy
  rationale: ὁ θεὸς là chủ thể ngữ pháp, còn δι’ αὐτοῦ chỉ vai trò trung gian của Giê-su. Bản dịch giữ nguyên sự căng thẳng thần học của câu thay vì điều hòa nó theo một hệ thống giáo lý.
- issue: Đại từ chỉ Giê-su trong δι’ αὐτοῦ
  choice: “qua người”
  alternative: “qua Ngài”
  rationale: Tiếng Hy Lạp dùng đại từ ngôi ba bình thường và câu đang nhấn mạnh “một người”; dùng “người” giữ giọng văn trang trọng vừa phải mà không thêm mức tôn xưng không được mã hóa trong nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ nghe khi đọc công khai. “Thưa anh em” thể hiện lời gọi trực tiếp; “hãy nghe” giữ lực mệnh lệnh. Câu kết bằng dấu gạch ngang vì cấu trúc cú pháp tiếp tục sang câu kế tiếp.
