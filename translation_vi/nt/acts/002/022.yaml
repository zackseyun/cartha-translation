  terminology: 'Giữ “Đức Chúa Trời”, “chứng thực”, “những việc quyền năng, những điều kỳ diệu và những dấu lạ”. Chú thích a được bổ sung phương án “Giê-su ở Na-xa-rét”, vốn là một cách dịch tự nhiên khác của Ναζωραῖος, đồng thời vẫn bảo lưu “người Na-xô-rê”. Chú thích b được diễn đạt chính xác hơn: δυνάμεις sát nghĩa là “quyền năng”/“những việc quyền năng”, còn “phép lạ” là cách diễn đạt theo ngữ cảnh.'
