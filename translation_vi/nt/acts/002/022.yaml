  verdict: revise
  source_fidelity: 'Bản dịch bảo tồn tốt cấu trúc và các thành phần chính của câu: mệnh lệnh kêu gọi lắng nghe, danh xưng Ναζωραῖος, việc Đức Chúa Trời chứng thực Giê-su, bộ ba δυνάμεσι/τέρασι/σημείοις, Đức Chúa Trời là chủ thể hành động qua Giê-su, và sự nhấn mạnh trong “chính ... đã biết”. Tuy nhiên, “anh em” không phản ánh trực tiếp cách gọi nam giới Ἄνδρες và thêm sắc thái huynh đệ không có trong từ ngữ nguồn. “Các ông Ít-ra-en” giữ được lời xưng hô công khai, trang trọng và giới tính ngữ pháp của tiếng Hy Lạp.'
