id: ACT.2.26
reference: Acts 2:26
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: διὰ τοῦτο ηὐφράνθη ⸂ἡ καρδία μου⸃ καὶ ἠγαλλιάσατο ἡ γλῶσσά μου, ἔτι δὲ καὶ ἡ σάρξ μου κατασκηνώσει ἐπ’ ἐλπίδι·
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/026.yaml
  text: Because of this my heart was glad[a], and my tongue rejoiced; moreover, even my flesh will dwell in hope.
translation:
  language: vi
  text: Vì thế, lòng tôi vui mừng, lưỡi tôi hân hoan; hơn nữa, ngay cả thân xác tôi cũng sẽ ở trong niềm hy vọng.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “thân xác tôi sẽ yên nghỉ trong niềm hy vọng.”'
    reason: Nêu cách hiểu mang tính diễn giải của κατασκηνώσει là “yên nghỉ”, trong khi bản chính giữ hình ảnh ở/cư ngụ của động từ.
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Vì thế
  rationale: Diễn đạt quan hệ nguyên nhân/cơ sở một cách tự nhiên trong tiếng Việt, đồng thời phù hợp với mạch trích dẫn thi ca.
- source_word: ηὐφράνθη ἡ καρδία μου
  choice: lòng tôi vui mừng
  rationale: “Lòng” giữ được thành ngữ Kinh Thánh về con người bên trong; “vui mừng” diễn đạt tự nhiên trạng thái của động từ bị động dùng theo nghĩa nội động.
- source_word: ἠγαλλιάσατο ἡ γλῶσσά μου
  choice: lưỡi tôi hân hoan
  rationale: Giữ nguyên hình ảnh “lưỡi” của tiếng Hy Lạp thay vì diễn giải thành “miệng”; “hân hoan” truyền đạt sắc thái vui mừng mạnh và giọng thơ trang trọng.
- source_word: ἔτι δὲ καὶ
  choice: hơn nữa, ngay cả ... cũng
  rationale: Thể hiện cả sự nối tiếp lẫn nét nhấn mạnh của cụm từ Hy Lạp.
- source_word: ἡ σάρξ μου
  choice: thân xác tôi
  rationale: Chỉ phương diện thể chất của con người trong ngữ cảnh sự chết và niềm hy vọng. “Thân xác” tự nhiên hơn “xác thịt” trong tiếng Việt và tránh gợi nhầm nghĩa đạo đức tiêu cực.
- source_word: κατασκηνώσει
  choice: sẽ cư ngụ
  rationale: Giữ hình ảnh cư trú hoặc dựng chỗ ở của động từ, thay vì thu hẹp ngay thành “yên nghỉ”.
- source_word: ἐπ’ ἐλπίδι
  choice: trong niềm hy vọng
  rationale: Diễn đạt tự nhiên phạm vi hoặc nền tảng của sự cư ngụ, không thêm mức độ chắc chắn vốn không được nói rõ trong từ ngữ.
theological_decisions:
- issue: Cách dịch σάρξ trong lời trích dẫn có bối cảnh phục sinh
  choice: thân xác tôi
  alternative: xác thịt tôi; thân thể tôi
  rationale: Ở đây σάρξ mang nghĩa thể chất, không phải “bản tính tội lỗi”. “Thân xác” giữ ý nghĩa nhân học mà không đưa sắc thái đạo đức tiêu cực vào câu.
- issue: Sắc thái của κατασκηνώσει ἐπ’ ἐλπίδι
  choice: sẽ cư ngụ trong niềm hy vọng
  alternative: sẽ yên nghỉ trong niềm hy vọng
  rationale: Bản chính giữ hình ảnh cư ngụ của tiếng Hy Lạp và để hàm ý về sự chết cùng sự phục sinh được sáng tỏ qua văn cảnh. Cách dịch “yên nghỉ” được ghi ở chú thích vì tự nhiên và có truyền thống, nhưng mang tính diễn giải hơn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và có nhịp thơ. Dùng “lòng”, “lưỡi” và “cư ngụ” để bảo tồn hình ảnh của nguyên văn, nhưng dùng “thân xác” thay cho “xác thịt” nhằm tránh hàm ý tiêu cực không có trong ngữ cảnh.
