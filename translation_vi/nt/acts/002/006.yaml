  source_fidelity: 'Bản dịch truyền đạt đầy đủ các thành tố chính của câu Hy Lạp: hoàn cảnh thời gian do sở hữu cách tuyệt đối, đám đông tụ họp, sự bối rối của họ, quan hệ nguyên nhân, và kinh nghiệm phân phối của từng người khi nghe những người kia nói bằng phương ngữ riêng. “Tiếng ấy vang lên” diễn đạt tự nhiên hiện tượng âm thanh mà không áp đặt bản chất cụ thể của φωνή. “Đều nghe” chấp nhận được trong tiếng Việt cho thì chưa hoàn thành trong ngữ cảnh này.'
