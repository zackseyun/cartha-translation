id: ACT.2.6
reference: Acts 2:6
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: γενομένης δὲ τῆς φωνῆς ταύτης συνῆλθε τὸ πλῆθος καὶ συνεχύθη, ὅτι ⸀ἤκουον εἷς ἕκαστος τῇ ἰδίᾳ διαλέκτῳ λαλούντων αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/006.yaml
  text: And when this sound occurred[a], the crowd came together and was bewildered[b], because each one was hearing them speaking in his own dialect.
translation:
  language: vi
  text: Khi tiếng ấy vang lên, đám đông tụ họp lại và bối rối, vì mỗi người đều nghe họ nói bằng phương ngữ của chính mình.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “bằng ngôn ngữ của chính mình.” Từ Hy Lạp có thể chỉ ngôn ngữ nói chung, dù “phương ngữ” phản ánh sát hơn cách dùng từ của Lu-ca.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γενομένης ... τῆς φωνῆς ταύτης
  choice: Khi tiếng ấy vang lên
  rationale: Cấu trúc sở hữu cách tuyệt đối diễn tả hoàn cảnh thời gian. φωνή ở đây chỉ hiện tượng nghe được; “tiếng” giữ được độ rộng nghĩa, còn “vang lên” là cách diễn đạt tự nhiên trong tiếng Việt mà không xác định quá mức đó là tiếng nói hay tiếng động.
- source_word: δέ
  choice: không dịch riêng
  rationale: δέ là từ nối nhẹ trong mạch kể chuyện; quan hệ tiếp nối đã được thể hiện tự nhiên bằng câu mở đầu “Khi...” nên không cần thêm “và/bấy giờ”.
- source_word: συνῆλθε τὸ πλῆθος
  choice: đám đông tụ họp lại
  rationale: συνέρχομαι diễn tả nhiều người đến với nhau tại một nơi; “tụ họp lại” tự nhiên và sát nghĩa, còn πλῆθος được chuyển là “đám đông” theo văn phong hiện đại.
- source_word: συνεχύθη
  choice: bối rối
  rationale: Động từ bị động có thể diễn tả trạng thái hoang mang, rối trí hoặc bị xáo trộn. “Bối rối” phù hợp với phản ứng của đám đông mà không cường điệu thành hỗn loạn.
- source_word: ὅτι
  choice: vì
  rationale: Giới thiệu nguyên nhân khiến đám đông bối rối.
- source_word: ἤκουον
  choice: đều nghe
  rationale: Thì chưa hoàn thành cho thấy việc nghe đang tiếp diễn; tiếng Việt không bắt buộc đánh dấu thể bằng một cấu trúc riêng, và “đều nghe” vừa tự nhiên vừa kết hợp với ý phân phối của εἷς ἕκαστος.
- source_word: εἷς ἕκαστος
  choice: mỗi người đều
  rationale: Giữ lực phân phối nhấn mạnh rằng từng cá nhân trong đám đông đều có trải nghiệm này.
- source_word: τῇ ἰδίᾳ διαλέκτῳ
  choice: bằng phương ngữ của chính mình
  rationale: διάλεκτος có thể chỉ ngôn ngữ hoặc phương ngữ, thường nhấn mạnh tiếng nói bản địa hay khu vực. “Phương ngữ” phản ánh sát lựa chọn từ vựng của Lu-ca; “của chính mình” giữ sắc thái của ἰδίᾳ và tự nhiên, trung tính về giới trong tiếng Việt.
- source_word: λαλούντων αὐτῶν
  choice: họ nói
  rationale: Đại từ chỉ những người đang nói đã xuất hiện trong văn cảnh. “Họ nói” gọn, tự nhiên và không thu hẹp chủ thể thành một nhóm cụ thể hơn điều câu Hy Lạp nêu.
theological_decisions:
- issue: Chủ thể của λαλούντων αὐτῶν
  choice: họ nói
  alternative: các sứ đồ nói
  rationale: Bản dịch giữ đại từ của nguyên văn và không xác định hẹp hơn rằng chỉ các sứ đồ là người nói.
- issue: Phạm vi nghĩa của διάλεκτος
  choice: phương ngữ
  alternative: ngôn ngữ
  rationale: “Phương ngữ” bám sát cách dùng của Lu-ca và giữ khả năng nhấn mạnh tiếng nói bản địa, trong khi chú thích thừa nhận từ Hy Lạp cũng có thể được hiểu rộng hơn là “ngôn ngữ”.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Câu giữ trật tự diễn tiến của nguyên văn, đồng thời dùng cách nói tự nhiên trong tiếng Việt. Đại từ “mỗi người... của chính mình” tránh vấn đề giống ngữ pháp mà vẫn bảo toàn cấu trúc phân phối.
