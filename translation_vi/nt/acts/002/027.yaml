  source_fidelity: Bản dịch giữ đúng cấu trúc phủ định song song, tương lai của hai động từ, và nghĩa cho phép của δώσεις ... ἰδεῖν. Tuy nhiên, “âm phủ” trong tiếng Việt hiện đại thường gợi một nơi trừng phạt sau chết hơn là ᾅδης, vốn ở đây chỉ cõi người chết; nên dùng “cõi Hades” trong thân bài và chú thích các cách diễn đạt khác để bảo toàn thuật ngữ Hy Lạp lẫn tránh đồng nhất với hỏa ngục.
  naturalness: Câu văn nhìn chung tự nhiên và trang trọng. “Thấy sự hư nát” là lối nói Kinh Thánh Việt ngữ quen thuộc, tự nhiên hơn đôi chút so với “thấy sự phân hủy,” trong khi chú thích có thể giải rõ đây là sự phân hủy thân thể.
  terminology: “Linh hồn,” “Đấng Thánh,” và cách xưng “Ngài—con” phù hợp lời trích Thi Thiên trong ngữ cảnh. Viết hoa “Đấng Thánh” phản ánh sự áp dụng của Công Vụ 2 mà không loại trừ nghĩa từ vựng “người trung tín,” vốn được giữ ở chú thích.
