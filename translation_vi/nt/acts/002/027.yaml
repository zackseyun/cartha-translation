    rationale: Cả hai đều truyền đạt διαφθοράν trong nghĩa mục rữa thân thể. “Sự hư nát” là cách nói Việt ngữ Kinh Thánh thông dụng; chú thích làm rõ nghĩa vật lý để không bị hiểu theo nghĩa luân lý.
