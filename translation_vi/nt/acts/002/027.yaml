id: ACT.2.27
reference: Acts 2:27
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὅτι οὐκ ἐγκαταλείψεις τὴν ψυχήν μου εἰς ⸀ᾅδην, οὐδὲ δώσεις τὸν ὅσιόν σου ἰδεῖν διαφθοράν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/027.yaml
  text: because you will not abandon my soul to Hades[c][b][a], nor will you let your Holy One see decay.
translation:
  language: vi
  text: vì Ngài sẽ không bỏ linh hồn con trong cõi Hades[a], cũng không để Đấng Thánh của Ngài[b] thấy sự hư nát[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “cõi âm phủ” hoặc “cõi người chết.” Tiếng Hy Lạp là “Hades”; bản Hê-bơ-rơ của lời Thi Thiên được trích ở đây dùng “Sheol.”'
    reason: alternative_reading
  - marker: b
    text: 'Cũng có thể dịch: “người trung tín của Ngài.”'
    reason: lexical_alternative
  - marker: c
    text: Tức là sự mục rữa hay phân hủy của thân thể; cách dịch truyền thống thường là “sự hư nát.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγκαταλείψεις
  choice: sẽ không bỏ
  rationale: Động từ tương lai mang nghĩa bỏ mặc một người trong một tình trạng hay nơi chốn; “không bỏ” tự nhiên, rõ ràng và giữ được lực của nguyên văn.
- source_word: τὴν ψυχήν μου
  choice: linh hồn con
  rationale: ψυχή có thể chỉ “sự sống,” “bản thân” hoặc “linh hồn.” Trong lời trích Thi Thiên, “linh hồn con” giữ hình thức và sức nặng nhân học của câu mà không buộc nó thành một phát biểu kỹ thuật về trạng thái trung gian.
- source_word: εἰς ᾅδην
  choice: trong âm phủ
  rationale: ᾅδης chỉ cõi người chết, không nên đồng nhất với hỏa ngục. Với động từ “bỏ,” tiếng Việt tự nhiên dùng “bỏ… trong âm phủ”; chú thích giữ lại tên gọi Hades và nền Hê-bơ-rơ là Sheol.
- source_word: δώσεις ... ἰδεῖν
  choice: để ... thấy
  rationale: Dù δώσεις có nghĩa đen là “ban/cho,” kết hợp với động từ nguyên mẫu ở đây diễn đạt sự cho phép; “để… thấy” là thành ngữ Việt tự nhiên.
- source_word: τὸν ὅσιόν σου
  choice: Đấng Thánh của Ngài
  rationale: ὅσιος có thể mang nghĩa thánh khiết, trung tín hoặc tận hiến đối với Đức Chúa Trời. Cách dịch này giữ sắc thái Cơ Đốc luận trong ngữ cảnh Công Vụ 2 mà không xóa nghĩa “người trung tín.”
- source_word: διαφθοράν
  choice: sự phân hủy
  rationale: Trong ngữ cảnh phục sinh, từ này nói đến sự mục rữa, phân hủy của thân thể. “Sự phân hủy” rõ hơn “sự hư nát,” vốn có thể bị hiểu theo nghĩa luân lý.
theological_decisions:
- issue: Cách dịch ᾅδης trong lời trích liên quan đến sự phục sinh
  choice: âm phủ
  alternative: Hades; Sheol; cõi người chết; mồ mả
  rationale: “Âm phủ” ở đây được dùng theo nghĩa cõi người chết, không phải hỏa ngục. Chú thích nêu rõ thuật ngữ Hy Lạp và nền Hê-bơ-rơ để tránh nhập các liên tưởng giáo lý về hình phạt đời đời.
- issue: Nhận diện Cơ Đốc luận của τὸν ὅσιόν σου
  choice: Đấng Thánh của Ngài
  alternative: người trung tín của Ngài; người tận hiến của Ngài
  rationale: Ngữ cảnh Công Vụ 2 áp dụng lời Thi Thiên cho Chúa Giê-su. Viết hoa và dùng “Đấng Thánh” bảo toàn lực quy chiếu ấy, trong khi chú thích vẫn lưu giữ khả năng từ vựng “người trung tín.”
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, dùng cặp xưng hô “Ngài—con” phù hợp lời cầu nguyện được trích dẫn. Giữ cấu trúc song song của nguyên văn. “Âm phủ” được chú giải để tránh bị hiểu là hỏa ngục.
