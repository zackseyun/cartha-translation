  text: ἕτεροι δὲ ⸀διαχλευάζοντες ἔλεγον ὅτι Γλεύκους μεμεστωμένοι εἰσίν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/013.yaml
  text: But others[a], mocking, were saying, “They are filled with sweet wine.”
translation:
  language: vi
  text: 'Nhưng những người khác lại chế giễu và nói: “Họ đầy rượu ngọt rồi.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “rượu mới.” Từ Hy Lạp γλεῦκος chỉ rượu nho tươi có vị ngọt; “rượu mới” là cách dịch truyền thống nhưng kém cụ thể hơn trong tiếng Việt hiện nay.'
    reason: Nêu phương án dịch truyền thống của γλεῦκος mà không lặp lại cách diễn đạt đã có trong chính văn.
lexical_decisions:
- source_word: ἕτεροι
  choice: những người khác
  rationale: Tính từ được dùng như danh từ, chỉ một nhóm khác trong đám đông; cách dịch này tự nhiên và rõ nghĩa.
- source_word: δὲ
  choice: Nhưng... lại
  rationale: Liên từ đánh dấu sự tương phản với phản ứng kinh ngạc và thắc mắc ở câu trước; cấu trúc này diễn đạt tự nhiên sắc thái đối lập trong tiếng Việt.
- source_word: διαχλευάζοντες
  choice: chế giễu
  rationale: Phân từ diễn tả thái độ nhạo báng, khinh miệt; “chế giễu” trang trọng vừa phải và dễ hiểu.
- source_word: ἔλεγον
  choice: nói
  rationale: Thì chưa hoàn thành có thể gợi hành động đang diễn ra hoặc lặp lại; trong ngữ cảnh này, “nói” là cách kể tự nhiên, còn sắc thái kéo dài không cần biểu đạt cứng nhắc.
- source_word: ὅτι
  choice: lời nói trực tiếp
  rationale: ὅτι giới thiệu nội dung lời nói; dùng dấu ngoặc kép phù hợp với lối kể tự nhiên trong tiếng Việt.
- source_word: Γλεύκους
  choice: rượu ngọt
  rationale: γλεῦκος chỉ loại rượu nho tươi có vị ngọt; “rượu ngọt” chính xác hơn “rượu mới” đối với độc giả hiện đại, đồng thời giữ chú thích về cách dịch truyền thống.
- source_word: μεμεστωμένοι εἰσίν
  choice: say... rồi
  rationale: Cụm phân từ hoàn thành cùng động từ εἰμί diễn tả tình trạng do uống đầy rượu. Trong lời chế nhạo, “say rượu... rồi” là tiếng Việt tự nhiên và truyền đạt đúng lời cáo buộc, dù không mô phỏng sát hình ảnh “đầy” của nguyên ngữ.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, rõ ràng và trang nghiêm vừa phải. Lời buộc tội được diễn đạt bằng thành ngữ tiếng Việt tự nhiên “say rượu... rồi”; chú thích bảo tồn cách diễn đạt sát chữ và phương án “rượu mới”.
