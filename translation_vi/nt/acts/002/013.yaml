revisions:
- from: 'Nhưng những người khác lại chế giễu và nói: “Họ say rượu ngọt rồi.”[a]'
  to: 'Nhưng những người khác lại chế giễu và nói: “Họ đầy rượu ngọt rồi.”[a]'
  rationale: Thay “say rượu” bằng “đầy rượu” để bảo toàn cách diễn đạt của μεμεστωμένοι εἰσίν, tránh diễn giải mạnh hơn nguyên ngữ, đồng thời vẫn giữ lời nhạo báng tự nhiên. Chú thích được rút gọn để tập trung vào lựa chọn từ vựng γλεῦκος.
