- from: Vì lời hứa ấy dành cho anh em, cho con cái anh em và cho tất cả những người ở xa[a]—tức là tất cả những người mà Chúa, Đức Chúa Trời của chúng ta, kêu gọi.[b]
  to: Vì lời hứa ấy dành cho anh em, cho con cái anh em và cho tất cả những người ở xa[a]—tức là cho tất cả những người mà Chúa là Đức Chúa Trời chúng ta kêu gọi.[b]
  rationale: Chỉ điều chỉnh cách diễn đạt cụm đồng vị “Chúa là Đức Chúa Trời chúng ta” và làm rõ cấu trúc tiếp nhận bằng cách lặp lại “cho.” Bản sửa vẫn giữ độ mở của “những người ở xa,” lực bao quát nhưng không xác định của ὅσους ἄν, và không diễn giải cơ chế của sự kêu gọi.
