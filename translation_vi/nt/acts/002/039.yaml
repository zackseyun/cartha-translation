language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὑμῖν γάρ ἐστιν ἡ ἐπαγγελία καὶ τοῖς τέκνοις ὑμῶν καὶ πᾶσι τοῖς εἰς μακρὰν ὅσους ἂν προσκαλέσηται κύριος ὁ θεὸς ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/039.yaml
  text: For the promise is for you and for your children and for all who are far off[b][a], as many as the Lord our God calls.
translation:
  language: vi
  text: Vì lời hứa ấy dành cho anh em, cho con cái anh em và cho tất cả những người ở xa[a]—tức là cho tất cả những người mà Chúa là Đức Chúa Trời chúng ta kêu gọi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “tất cả những người ở nơi xa.” Cụm từ này có thể chỉ những người ở xa về địa lý, những người xa cách về phương diện giao ước, hoặc cả hai.'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “bao nhiêu người mà Chúa là Đức Chúa Trời chúng ta kêu gọi.” Cách diễn đạt Hy Lạp nói đến một nhóm không xác định nhưng bao quát, mà phạm vi được xác định bởi sự kêu gọi của Đức Chúa Trời.'
    reason: alternative_reading
lexical_decisions:
- source_word: γάρ
  choice: Vì
  rationale: Giữ quan hệ giải thích giữa câu này với lời kêu gọi và lời hứa trong câu trước.
- source_word: ἐπαγγελία
  choice: lời hứa ấy
  rationale: Danh từ chỉ chính lời hứa; thêm “ấy” để liên kết tự nhiên với lời hứa vừa được nhắc đến trong ngữ cảnh, mà không đổi thành “ân tứ đã hứa”.
- source_word: ὑμῖν
  choice: anh em
  rationale: Cách xưng hô số nhiều tự nhiên, trang trọng và phù hợp khi Phi-e-rơ nói với đám đông.
- source_word: τέκνοις
  choice: con cái
  rationale: Giữ nghĩa gia đình thông thường của τέκνον, không giới hạn độ tuổi và cũng không diễn giải quá mức thành toàn bộ hậu duệ.
- source_word: πᾶσι τοῖς εἰς μακράν
  choice: tất cả những người ở xa
  rationale: Giữ nguyên độ rộng và tính mơ hồ của cụm từ, có thể nói đến khoảng cách địa lý, tình trạng xa cách trong giao ước, hoặc cả hai.
- source_word: ὅσους ἂν προσκαλέσηται
  choice: tất cả những người mà ... kêu gọi
  rationale: Diễn đạt tự nhiên cấu trúc chỉ một nhóm không xác định nhưng bao quát; không thêm “đến với Ngài,” vì ý ấy không được nói tường minh trong câu Hy Lạp.
- source_word: κύριος ὁ θεὸς ἡμῶν
  choice: Chúa, Đức Chúa Trời của chúng ta
  rationale: Giữ cả tước hiệu κύριος và cụm đồng vị ὁ θεὸς ἡμῶν, đồng thời thể hiện rõ chủ thể của hành động kêu gọi.
theological_decisions:
- issue: Phạm vi của “những người ở xa”
  choice: 'Giữ cách nói rộng: “tất cả những người ở xa.”'
  alternative: Chỉ người Do Thái tản cư; chỉ dân ngoại; hoặc cả những người xa về địa lý lẫn xa cách về phương diện giao ước.
  rationale: Bản văn không buộc phải giới hạn cụm từ vào riêng một nhóm, nên bản dịch bảo tồn sự mở rộng và tính đa nghĩa thật sự.
- issue: Ý nghĩa thần học của hành động “kêu gọi”
  choice: Dịch sát là “Chúa, Đức Chúa Trời của chúng ta, kêu gọi,” không giải thích cơ chế của sự kêu gọi.
  alternative: Sự kêu gọi hữu hiệu theo một hệ thống thần học cụ thể; hoặc lời mời gọi chung dành cho mọi người.
  rationale: Câu Hy Lạp khẳng định lời hứa liên quan đến những người Đức Chúa Trời kêu gọi, nhưng không định nghĩa tại đây cách thức hay hiệu lực của sự kêu gọi.
- issue: Quan hệ của mệnh đề ὅσους ἂν προσκαλέσηται với nhóm người được nêu trước
  choice: Dùng “tức là” để cho thấy mệnh đề sau xác định phạm vi những người nhận lời hứa.
  alternative: Chỉ dùng dấu phẩy, có thể khiến quan hệ cú pháp kém rõ trong tiếng Việt.
  rationale: “Tức là” truyền đạt chức năng giải thích/xác định phạm vi của ὅσους mà không biến câu thành một tuyên bố thần học vượt quá bản văn.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “anh em” cho đại từ số nhiều hướng đến người nghe; “lời hứa ấy” tạo liên kết ngữ cảnh; giữ “ở xa” và “kêu gọi” không diễn giải theo một lập trường hệ phái.
