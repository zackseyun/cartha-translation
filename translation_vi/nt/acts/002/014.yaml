  to: 'Nhưng Phi-e-rơ đứng cùng với mười một người, cất cao giọng và tuyên bố với họ: “Hỡi những người Giu-đê và tất cả những người đang cư ngụ tại Giê-ru-sa-lem, hãy biết rõ điều này và lắng tai nghe lời tôi.”'
