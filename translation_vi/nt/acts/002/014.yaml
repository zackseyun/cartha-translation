language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Σταθεὶς δὲ ⸀ὁ Πέτρος σὺν τοῖς ἕνδεκα ἐπῆρεν τὴν φωνὴν αὐτοῦ καὶ ἀπεφθέγξατο αὐτοῖς· Ἄνδρες Ἰουδαῖοι καὶ οἱ κατοικοῦντες Ἰερουσαλὴμ ⸀πάντες, τοῦτο ὑμῖν γνωστὸν ἔστω καὶ ἐνωτίσασθε τὰ ῥήματά μου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/014.yaml
  text: 'But Peter[a], standing with the eleven, raised his voice and declared to them: “Men of Judea and all who dwell in Jerusalem, let this be known to you[b], and give ear to my words.”'
translation:
  language: vi
  text: 'Nhưng Phi-e-rơ đứng cùng với mười một người, cất cao giọng và tuyên bố với họ: “Hỡi những người Giu-đê và tất cả những người đang cư ngụ tại Giê-ru-sa-lem, hãy biết rõ điều này và lắng tai nghe lời tôi.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Σταθεὶς
  choice: đứng lên
  rationale: Phân từ bất định của ἵστημι dựng bối cảnh và có thể gợi hành động Phi-e-rơ bước ra, đứng vào vị trí để phát biểu; “đứng lên” tự nhiên trong tiếng Việt mà không diễn giải quá mức.
- source_word: δὲ
  choice: Nhưng
  rationale: Đánh dấu bước chuyển có tính tương phản với lời chế giễu ở câu trước.
- source_word: σὺν τοῖς ἕνδεκα
  choice: cùng với mười một sứ đồ
  rationale: σύν với tặng cách chỉ sự đồng hành. Thêm “sứ đồ” để danh từ hóa con số một cách rõ nghĩa trong tiếng Việt; ngữ cảnh xác định đây là mười một sứ đồ còn lại.
- source_word: ἐπῆρεν τὴν φωνὴν αὐτοῦ
  choice: cất cao giọng
  rationale: Thành ngữ chỉ việc nói lớn tiếng trước công chúng; cách diễn đạt này trang trọng, tự nhiên và sát hình ảnh nguyên văn.
- source_word: ἀπεφθέγξατο
  choice: tuyên bố với họ
  rationale: Động từ chỉ lời phát biểu công khai, rõ ràng và có trọng lượng. “Tuyên bố” giữ sắc thái mạnh mà không tự ý khẳng định lời nói được soi dẫn.
- source_word: Ἄνδρες Ἰουδαῖοι
  choice: Hỡi những người Giu-đê
  rationale: Giữ lời hô gọi trang trọng và căn tính Giu-đê/Do Thái của người nghe. Trong tiếng Việt, “người Giu-đê” không đánh dấu giới tính hình thái như ἄνδρες, nhưng tự nhiên hơn “những người nam Giu-đê” trong diễn từ công khai.
- source_word: οἱ κατοικοῦντες Ἰερουσαλὴμ πάντες
  choice: tất cả những người đang cư ngụ tại Giê-ru-sa-lem
  rationale: Giữ πάντες và ý nghĩa cư trú hiện tại của phân từ κατοικοῦντες; “cư ngụ” phù hợp văn phong trang trọng.
- source_word: τοῦτο ὑμῖν γνωστὸν ἔστω
  choice: xin quý vị biết rõ điều này
  rationale: Diễn đạt mệnh lệnh trang trọng của ἔστω γνωστόν bằng tiếng Việt tự nhiên. “Quý vị” làm rõ đại từ số nhiều và phù hợp lời nói trước đám đông.
- source_word: ἐνωτίσασθε
  choice: lắng tai nghe
  rationale: Động từ mệnh lệnh nhấn mạnh việc nghe chăm chú; “lắng tai nghe” giữ hình ảnh liên quan đến tai và tự nhiên trong tiếng Việt.
- source_word: τὰ ῥήματά μου
  choice: lời tôi
  rationale: Chuyển trực tiếp ῥήματα là những lời được nói, không mở rộng thành “sứ điệp”.
theological_decisions:
- issue: Tính đặc chỉ giới của Ἄνδρες
  choice: Hỡi những người Giu-đê
  alternative: Hỡi những người nam Giu-đê
  rationale: ἄνδρες là danh từ giống đực và trong ngữ cảnh có thể trực tiếp gọi nam giới. Tuy nhiên, tiếng Việt hiện đại không có một lối gọi tương đương vừa tự nhiên vừa trang trọng; thêm “nam” dễ nghe như một sự phân loại hành chính. Bản dịch giữ danh xưng dân tộc và lực hô gọi, không mở rộng thành “đồng bào” hay khẳng định toàn bộ dân chúng.
- issue: Mức độ hàm ý lời được soi dẫn trong ἀπεφθέγξατο
  choice: tuyên bố với họ
  alternative: nói với họ
  rationale: “Tuyên bố” bảo toàn sắc thái phát biểu công khai, mạnh mẽ của động từ nhưng không đưa khái niệm soi dẫn vào chính câu này.
- issue: Danh tính của “mười một”
  choice: mười một sứ đồ
  alternative: mười một người
  rationale: Ngữ cảnh gần xác định nhóm này là mười một sứ đồ đứng cùng Phi-e-rơ. Việc nêu danh xưng giúp câu tiếng Việt rõ ràng, nhưng không hàm ý Phi-e-rơ ở ngoài nhóm sứ đồ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và phù hợp một bài diễn thuyết công khai. Dùng “quý vị” để thể hiện ngôi thứ hai số nhiều một cách kính trọng; giữ các địa danh theo dạng phiên âm Kinh Thánh Việt ngữ quen thuộc.
