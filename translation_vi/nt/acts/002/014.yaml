    rationale: Phân từ aorist của ἵστημι đặt bối cảnh là Phi-e-rơ đứng (hoặc đã đứng) để phát biểu. “Đứng lên” thêm rõ nét chuyển động trỗi dậy không được nguyên văn xác định.
  - severity: low
    issue: “mười một sứ đồ” thêm danh xưng không có trong câu
    rationale: Ngữ cảnh đúng là nhóm Mười Một, nhưng τοῖς ἕνδεκα tự nó chỉ nói “mười một [người].” Bản dịch tối ưu-tương-đương nên không đưa “sứ đồ” vào văn bản chính.
  - severity: low
    issue: “xin quý vị biết rõ” giảm lực mệnh lệnh và thêm sắc thái lịch sự hiện đại
    rationale: γνωστὸν ἔστω là lời kêu gọi/công bố trang trọng. “Hãy biết rõ điều này” vừa tự nhiên vừa trực tiếp hơn.
