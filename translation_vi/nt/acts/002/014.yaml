  source_fidelity: 'Cần sửa hai chỗ để sát nguyên văn hơn: Σταθείς là “đứng/đã đứng,” không nhất thiết là hành động “đứng lên”; và σὺν τοῖς ἕνδεκα chỉ nói “cùng với mười một người,” không nêu danh xưng “sứ đồ” ngay trong câu.'
  naturalness: Bản văn nhìn chung tự nhiên và trang trọng. “Hãy biết rõ điều này” phù hợp lực mệnh lệnh công bố của γνωστὸν ἔστω hơn “xin quý vị biết rõ điều này”; đồng thời tránh sự pha trộn xưng hô giữa “hỡi” và “quý vị.”
  terminology: Giữ “Phi-e-rơ,” “Giu-đê,” và “Giê-ru-sa-lem” nhất quán với phong cách phiên âm Kinh Thánh của bản thảo. “Hỡi những người Giu-đê” là cách chuyển tự nhiên dù tiếng Việt không đánh dấu giống đực như ἄνδρες.
  issues:
