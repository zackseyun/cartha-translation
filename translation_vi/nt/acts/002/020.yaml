  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ ἥλιος μεταστραφήσεται εἰς σκότος καὶ ἡ σελήνη εἰς αἷμα πρὶν ⸀ἢ ⸀ἐλθεῖν ἡμέραν κυρίου τὴν μεγάλην καὶ ἐπιφανῆ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/020.yaml
  text: The sun will be turned into darkness[a], and the moon into blood, before the great and glorious day of the Lord comes.
translation:
  language: vi
  text: Mặt trời sẽ biến thành bóng tối, mặt trăng thành máu, trước khi ngày lớn lao và hiển hách của Chúa đến.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μεταστραφήσεται
  choice: sẽ biến thành
  rationale: Thể tương lai bị động diễn tả sự chuyển đổi; tiếng Việt tự nhiên thường dùng cấu trúc “biến thành” mà không cần nêu tác nhân, vẫn giữ hình ảnh biến đổi.
- source_word: εἰς σκότος
  choice: thành bóng tối
  rationale: εἰς với đối cách chỉ trạng thái kết quả; “thành bóng tối” diễn đạt rõ sự chuyển đổi.
- source_word: εἰς αἷμα
  choice: thành máu
  rationale: Giữ nguyên hình ảnh tiên tri mạnh và trực tiếp của nguyên văn, không diễn giải thành “đỏ như máu”.
- source_word: πρὶν ἢ ἐλθεῖν
  choice: trước khi ... đến
  rationale: Cấu trúc chỉ thời gian được chuyển sang cách nói tự nhiên trong tiếng Việt, nêu rằng biến cố này xảy ra trước ngày được nhắc đến.
- source_word: ἡμέραν κυρίου
  choice: ngày ... của Chúa
  rationale: Giữ thành ngữ tiên tri quen thuộc về ngày Đức Chúa Trời can thiệp hoặc phán xét, đồng thời tránh cách diễn đạt có thể bị hiểu là một ngày trong tuần.
- source_word: μεγάλην
  choice: lớn lao
  rationale: Diễn đạt μέγας bằng từ ngữ trang trọng, tự nhiên, phù hợp văn cảnh tiên tri.
- source_word: ἐπιφανῆ
  choice: hiển hiện
  rationale: Từ Hy Lạp nhấn mạnh điều hiện ra rõ ràng, nổi bật hoặc huy hoàng. “Hiển hiện” giữ nét nghĩa cốt lõi về sự tỏ hiện mà không tự động đồng nhất nó với “vinh hiển”.
theological_decisions:
- issue: Cách dịch ἡμέραν κυρίου trong lời trích dẫn tiên tri Giô-ên thuộc bài giảng của Phi-e-rơ
  choice: ngày ... của Chúa
  alternative: ngày của Đức Chúa Trời; ngày Chúa nhật
  rationale: “Ngày của Chúa” bảo tồn thành ngữ tiên tri và sự liên hệ với Cựu Ước, nhưng không áp đặt cách xác định danh xưng κύριος vượt quá nguyên văn Hy Lạp hay khiến cụm từ bị hiểu là Chúa nhật.
- issue: Sắc thái của ἐπιφανῆ trong văn cảnh cánh chung
  choice: hiển hiện
  alternative: vinh hiển; nổi bật; huy hoàng
  rationale: ἐπιφανής có thể chỉ điều rõ ràng, đáng chú ý hoặc lộng lẫy. Bản dịch chọn nét nghĩa về sự tỏ hiện và ghi chú các khả năng khác để bảo tồn độ rộng ngữ nghĩa.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Phép lược “mặt trăng thành máu” theo sát cấu trúc song song của nguyên văn. Dùng “Chúa” cho κύριος và giữ hình ảnh “máu” theo nghĩa đen của lời tiên tri.
