- from: Mặt trời sẽ biến thành bóng tối, mặt trăng thành máu, trước khi ngày lớn lao và hiển hiện[a] của Chúa đến.
  to: Mặt trời sẽ biến thành bóng tối, mặt trăng thành máu, trước khi ngày lớn lao và hiển hách của Chúa đến.
  rationale: Chỉ thay “hiển hiện” bằng “hiển hách” để câu tiếng Việt tự nhiên hơn và để ἐπιφανής vẫn được hiểu theo nét nghĩa ‘lừng lẫy, nổi bật.’ Chú thích giữ lại phạm vi nghĩa gồm cả sắc thái ‘rõ rệt/hiển lộ’ lẫn ‘vinh hiển/huy hoàng.’
