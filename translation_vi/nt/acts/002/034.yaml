id: ACT.2.34
reference: Acts 2:34
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οὐ γὰρ Δαυὶδ ἀνέβη εἰς τοὺς οὐρανούς, λέγει δὲ αὐτός· Εἶπεν ⸀ὁ κύριος τῷ κυρίῳ μου· Κάθου ἐκ δεξιῶν μου,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/034.yaml
  text: For David did not ascend into the heavens[a], but he himself says, ‘The Lord said to my Lord, “Sit at my right hand,”’
translation:
  language: vi
  text: 'Vì Đa-vít không lên các tầng trời[a], nhưng chính ông nói: “Chúa phán với Chúa tôi: ‘Hãy ngồi bên phải Ta,’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Thi Thiên 110:1. Trong bản tiếng Hê-bơ-rơ, từ “Chúa” thứ nhất tương ứng với danh Đức Chúa Trời YHWH; đối chiếu cách dịch: “ĐỨC CHÚA phán với Chúa tôi.”'
    reason: Nêu nền tảng Hê-bơ-rơ của lời trích mà không thay đổi việc chính văn dịch cả hai lần κύριος trong tiếng Hy Lạp là “Chúa”.
lexical_decisions:
- source_word: ἀνέβη
  choice: lên
  rationale: Động từ ἀναβαίνω ở thì aorist chỉ việc đi lên trời. Trong tiếng Việt, “lên” tự nhiên và rõ nghĩa trong kết hợp “lên các tầng trời”, đồng thời không thêm sắc thái ngoài nguyên văn.
- source_word: τοὺς οὐρανούς
  choice: các tầng trời
  rationale: Danh từ Hy Lạp ở số nhiều. “Các tầng trời” giữ được hình thức số nhiều và âm hưởng Kinh Thánh, thay vì giản lược thành “trời”.
- source_word: λέγει δὲ αὐτός
  choice: nhưng chính ông nói
  rationale: “Nhưng” thể hiện sự tương phản nhẹ của δέ; “chính ông” giữ sắc thái nhấn mạnh của αὐτός. Thì hiện tại “nói” được giữ khi dẫn lời Kinh Thánh.
- source_word: ὁ κύριος
  choice: Chúa
  rationale: Cả hai lần κύριος trong bản Hy Lạp đều được dịch nhất quán là “Chúa”. Nền tảng danh YHWH của lần thứ nhất trong Thi Thiên 110:1 được nêu ở chú thích.
- source_word: τῷ κυρίῳ μου
  choice: với Chúa của tôi
  rationale: Giữ cách xưng “Chúa” và quan hệ sở hữu “của tôi”, phù hợp với lập luận của Phi-e-rơ hơn lựa chọn “chủ của tôi”, vốn có thể làm giảm sắc thái tôn cao trong ngữ cảnh.
- source_word: Κάθου
  choice: Hãy ngồi
  rationale: Cách diễn đạt mệnh lệnh trực tiếp, tự nhiên trong tiếng Việt và giữ đúng hình ảnh đăng quang, tôn vị.
- source_word: ἐκ δεξιῶν μου
  choice: bên phải Ta
  rationale: Đây là thành ngữ chỉ vị trí danh dự và thẩm quyền. “Bên phải Ta” truyền đạt tự nhiên hơn cách dịch sát giới từ là “từ bên phải Ta”.
theological_decisions:
- issue: Cách dịch hai lần κύριος trong lời trích Thi Thiên 110:1
  choice: 'Cả hai đều dịch là “Chúa” trong chính văn: “Chúa phán với Chúa của tôi.”'
  alternative: “ĐỨC CHÚA phán với Chúa của tôi”, phản ánh danh YHWH trong bản Hê-bơ-rơ ở lần thứ nhất.
  rationale: Bản nguồn Hy Lạp dùng κύριος ở cả hai vị trí, nên chính văn ưu tiên thể hiện bản Hy Lạp và không tự phân biệt bằng kiểu chữ. Nền tảng Hê-bơ-rơ của lần thứ nhất được bảo tồn trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ số nhiều “các tầng trời”, cấu trúc nhấn mạnh “chính ông”, cùng sự lặp lại có chủ ý của “Chúa” để phản ánh nguyên văn và duy trì sức căng thần học của lời trích.
