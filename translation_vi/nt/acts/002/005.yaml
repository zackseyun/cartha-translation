  text: Ἦσαν δὲ ⸀ἐν Ἰερουσαλὴμ κατοικοῦντες Ἰουδαῖοι, ἄνδρες εὐλαβεῖς ἀπὸ παντὸς ἔθνους τῶν ὑπὸ τὸν οὐρανόν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/005.yaml
  text: There were Jews living in Jerusalem[b][a], devout men from every nation under heaven.
translation:
  language: vi
  text: Tại Giê-ru-sa-lem có những người Do Thái[a] đang cư ngụ; họ là những người nam sùng kính, đến từ mọi dân tộc dưới trời[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “những người Giu-đê”; tại đây, văn cảnh nghiêng về nghĩa dân tộc–tôn giáo rộng hơn vì họ được nói là đến từ mọi dân tộc dưới trời.
    reason: alternative_reading
  - marker: b
    text: “Dưới trời” là một thành ngữ Kinh Thánh, có nghĩa là khắp thế giới.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἦσαν δὲ
  choice: Bấy giờ ... có
  rationale: δέ là liên từ nhẹ để tiếp nối trình thuật, không nhất thiết biểu thị tương phản. “Bấy giờ” tạo dòng kể tự nhiên trong tiếng Việt mà không hàm ý một từ chỉ thời gian riêng biệt trong nguyên văn.
- source_word: ἐν Ἰερουσαλὴμ κατοικοῦντες
  choice: tại Giê-ru-sa-lem ... đang cư ngụ
  rationale: κατοικοῦντες chỉ việc sinh sống hoặc cư trú tại một nơi; “đang cư ngụ” giữ được sắc thái kéo dài và tránh gợi ý chỉ tạm trú.
- source_word: Ἰουδαῖοι
  choice: những người Do Thái
  rationale: Trong ngữ cảnh này, việc họ đến từ mọi dân tộc dưới trời nghiêng về nghĩa dân tộc–tôn giáo rộng hơn, thay vì chỉ những người thuộc miền Giu-đê.
- source_word: ἄνδρες εὐλαβεῖς
  choice: những người nam sùng kính
  rationale: ἄνδρες mang nghĩa nam giới cụ thể, còn εὐλαβεῖς nói đến lòng kính sợ và đời sống mộ đạo. Cách dịch này giữ sự chính xác về giới và diễn đạt phẩm chất tôn giáo rõ ràng.
- source_word: ἀπὸ παντὸς ἔθνους
  choice: đến từ mọi dân tộc
  rationale: ἔθνος ở đây chỉ các dân tộc trong thế giới theo nghĩa địa lý–sắc tộc; “mọi dân tộc” tự nhiên và phù hợp với văn cảnh.
- source_word: τῶν ὑπὸ τὸν οὐρανόν
  choice: dưới trời
  rationale: Giữ thành ngữ Kinh Thánh, vốn có nghĩa là khắp thế giới.
theological_decisions:
- issue: Nghĩa của Ἰουδαῖοι
  choice: những người Do Thái
  alternative: những người Giu-đê
  rationale: Cụm “đến từ mọi dân tộc dưới trời” cho thấy đây là những người Do Thái thuộc cộng đồng tản cư, chứ không đơn thuần là dân cư miền Giu-đê.
- issue: Cách thể hiện giới của ἄνδρες
  choice: những người nam
  alternative: những người
  rationale: Danh từ Hy Lạp ở đây chỉ nam giới, không phải từ chỉ người nói chung; vì vậy bản dịch không trung hòa giới.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu được sắp xếp theo trật tự tự nhiên của tiếng Việt, đồng thời giữ riêng nét nghĩa nam giới của ἄνδρες và thành ngữ “dưới trời”.
