language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οἱ μὲν ⸀οὖν ἀποδεξάμενοι τὸν λόγον αὐτοῦ ἐβαπτίσθησαν, καὶ προσετέθησαν ⸀ἐν τῇ ἡμέρᾳ ἐκείνῃ ψυχαὶ ὡσεὶ τρισχίλιαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/041.yaml
  text: So those who received his word were baptized[a], and about three thousand souls were added on that day.
translation:
  language: vi
  text: Vậy, những người đã tiếp nhận lời của ông đều được báp-têm; và trong ngày ấy, khoảng ba ngàn người[a] được thêm vào.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nghĩa đen là “linh hồn”. Từ Hy Lạp này thường được dùng để chỉ hoặc đếm con người.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποδεξάμενοι
  choice: tiếp nhận
  rationale: Diễn tả việc đón nhận sứ điệp với thái độ tích cực, đồng thời tự nhiên trong tiếng Việt và ít diễn giải hơn “chấp nhận”.
- source_word: λόγον
  choice: lời
  rationale: Giữ sát danh từ Hy Lạp và cách dùng quen thuộc trong văn mạch Công Vụ; ở đây chỉ lời rao giảng của Phi-e-rơ.
- source_word: ἐβαπτίσθησαν
  choice: chịu phép báp-têm
  rationale: Chuyển tải thể bị động và sự kiện đã xảy ra mà không thêm quan niệm hệ phái về cách thức hay hiệu lực của phép báp-têm.
- source_word: προσετέθησαν
  choice: có thêm
  rationale: Là cách diễn đạt tự nhiên trong tiếng Việt về việc số người được gia nhập cộng đồng tăng lên; không bổ sung đối tượng như “vào Hội Thánh” vì nguyên văn không nêu rõ trong câu này.
- source_word: ψυχαὶ
  choice: linh hồn
  rationale: Giữ hình thức từ vựng của nguyên văn; chú thích làm rõ rằng trong lối đếm người này, từ ấy có nghĩa thông dụng là những con người, không nhất thiết đưa ra một khẳng định chuyên biệt về cấu tạo con người.
- source_word: ὡσεὶ τρισχίλιαι
  choice: khoảng ba ngàn
  rationale: “Khoảng” thể hiện chính xác ý ước lượng của ὡσεί và tự nhiên trong tiếng Việt hiện đại.
- source_word: οἱ μὲν οὖν
  choice: Vậy, những người
  rationale: “Vậy” nối kết phản ứng của người nghe với lời kêu gọi ngay trước đó, vừa thể hiện suy luận vừa tiếp tục mạch kể.
- source_word: ἐν τῇ ἡμέρᾳ ἐκείνῃ
  choice: trong ngày ấy
  rationale: Cách diễn đạt trang trọng, rõ nghĩa và gần cấu trúc thời gian của nguyên văn.
theological_decisions:
- issue: Có nên nêu rõ những người ấy được thêm vào đâu hoặc vào cộng đồng nào
  choice: Giữ hàm ẩn bằng “có thêm”
  alternative: “được thêm vào với họ” hoặc “được thêm vào Hội Thánh”
  rationale: Ngữ cảnh cho thấy họ gia nhập cộng đồng tín hữu, nhưng câu Hy Lạp không nói rõ bổ ngữ. Bản dịch không thêm một xác định giáo hội học vượt quá câu văn.
- issue: Sắc thái nhân học của ψυχαί
  choice: Dùng “linh hồn” trong chính văn và giải thích nghĩa “người” trong chú thích
  alternative: Dịch thẳng là “người” hoặc “những người”
  rationale: Cách này bảo lưu từ ngữ cụ thể của nguyên văn, đồng thời chú thích ngăn người đọc hiểu đây nhất thiết là một tuyên bố kỹ thuật về phần phi vật chất của con người.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “phép báp-têm” theo lối gọi quen thuộc trong văn bản Kinh Thánh; dấu chấm phẩy giúp phân biệt hai sự kiện liên tiếp. Đại từ “ông” quy chiếu về Phi-e-rơ trong văn mạch mà không thêm tên vào nguyên văn.
