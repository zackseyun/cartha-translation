  revision_rationale: 'Bản sửa bảo toàn trình tự và các yếu tố trọng tâm của câu Hy Lạp: phản ứng tích cực đối với lời của Phi-e-rơ, phép báp-têm, việc được thêm vào trong ngày ấy, và con số ước lượng. “Người” phản ánh cách dùng thành ngữ của ψυχαί trong ngữ cảnh đếm người; chú thích bảo lưu nghĩa đen. Cụm “được thêm vào” giữ thể bị động nhưng không xác định đối tượng hàm ẩn.'
