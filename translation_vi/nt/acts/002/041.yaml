  to: Vậy, những người đã tiếp nhận lời của ông đều được báp-têm; và trong ngày ấy, khoảng ba ngàn người[a] được thêm vào.
  rationale: 'Bản sửa bảo toàn trình tự và các yếu tố trọng tâm của câu Hy Lạp: phản ứng tích cực đối với lời của Phi-e-rơ, phép báp-têm, việc được thêm vào trong ngày ấy, và con số ước lượng. “Người” phản ánh cách dùng thành ngữ của ψυχαί trong ngữ cảnh đếm người; chú thích bảo lưu nghĩa đen. Cụm “được thêm vào” giữ thể bị động nhưng không xác định đối tượng hàm ẩn.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T08:27:45Z'
review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng diễn tiến cơ bản, nhưng “có thêm khoảng ba ngàn linh hồn” không biểu đạt rõ động từ bị động προσετέθησαν (“được thêm vào”) và “linh hồn” trong tiếng Việt hiện đại dễ bị hiểu như một thuật ngữ nhân học, trong khi ψυχαί ở đây là cách đếm số người. Chuyển chính văn sang “người” là sát nghĩa ngữ cảnh hơn; chú thích vẫn bảo lưu cách dùng từ nguyên văn.
  naturalness: “Có thêm” có thể dùng khi nói về số lượng, nhưng kém trực tiếp hơn cấu trúc có chủ thể “khoảng ba ngàn người được thêm vào”. “Được báp-têm” là cách diễn đạt hiện đại, tự nhiên và giữ thể bị động. “Lời của ông” rõ quan hệ sở hữu hơn “lời ông”.
  terminology: Giữ “báp-têm” một cách nhất quán. Dùng “người” trong chính văn tránh gán cho ψυχαί một nghĩa kỹ thuật về “linh hồn”; chú thích nêu nghĩa đen và chức năng thành ngữ của từ Hy Lạp. Không nêu đối tượng mà họ được thêm vào, vì câu không nói rõ.
  issues:
  - severity: medium
    issue: “có thêm” làm mờ sắc thái bị động của προσετέθησαν.
    rationale: Nguyên văn nói các ψυχαί “được thêm vào”; cách sửa giữ được sự kiện gia nhập/được thêm mà không bổ sung họ được thêm vào cộng đồng nào.
  - severity: medium
    issue: “linh hồn” ở chính văn dễ gây hiểu sai ψυχαί như một khẳng định nhân học kỹ thuật.
    rationale: Trong văn cảnh đếm số lượng, ψυχαί là lối nói chỉ con người. “Người” là tương đương tự nhiên và chính xác hơn trong tiếng Việt hiện đại; nghĩa đen được giữ trong chú thích.
  - severity: low
    issue: “lời ông” ít rõ hơn “lời của ông”.
    rationale: Thêm “của” làm sáng quan hệ thuộc cách của αὐτοῦ mà vẫn tự nhiên và không thêm nội dung.
  revised_text: Vậy, những người đã tiếp nhận lời của ông đều được báp-têm; và trong ngày ấy, khoảng ba ngàn người[a] được thêm vào.
  revised_footnotes:
