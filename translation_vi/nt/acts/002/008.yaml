  text: καὶ πῶς ἡμεῖς ἀκούομεν ἕκαστος τῇ ἰδίᾳ διαλέκτῳ ἡμῶν ἐν ᾗ ἐγεννήθημεν;
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/008.yaml
  text: And how is it that each of us hears in our own native language?[a]
translation:
  language: vi
  text: Thế thì làm sao mỗi người chúng ta lại nghe bằng chính tiếng mẹ đẻ của mình?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “bằng phương ngữ riêng của chúng ta, theo nơi chúng ta sinh ra.”'
    reason: 'Giữ khả năng dịch διάλεκτος là “phương ngữ” và diễn đạt ý mệnh đề ἐν ᾗ ἐγεννήθημεν: phương ngữ gắn với nơi sinh của người nghe, không đồng nhất phương ngữ với một địa điểm.'
lexical_decisions:
- source_word: πῶς
  choice: Thế sao
  rationale: Diễn tả tự nhiên câu hỏi đầy kinh ngạc trong tiếng Việt, thay vì chỉ dùng từ hỏi trung tính “sao”.
- source_word: ἡμεῖς ... ἕκαστος
  choice: mỗi người trong chúng ta
  rationale: Giữ sắc thái phân phối của ἕκαστος và sự nhấn mạnh bao gồm của ἡμεῖς bằng cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: ἀκούομεν
  choice: đều nghe họ nói
  rationale: “Nghe” phản ánh trực tiếp động từ Hy Lạp; thêm “họ nói” theo ngữ cảnh để câu tiếng Việt tự nhiên và làm rõ điều được nghe, nhưng không thay đổi nội dung căn bản.
- source_word: τῇ ἰδίᾳ διαλέκτῳ ἡμῶν
  choice: bằng tiếng mẹ đẻ của mình
  rationale: διάλεκτος có thể chỉ ngôn ngữ hoặc phương ngữ; kết hợp với mệnh đề nói về nơi sinh, “tiếng mẹ đẻ” truyền đạt tự nhiên ý ngôn ngữ riêng gắn với nguồn gốc của từng người.
- source_word: ἐν ᾗ ἐγεννήθημεν
  choice: mẹ đẻ
  rationale: Cô đọng ý của mệnh đề “trong đó chúng ta được sinh ra” thành cách nói thông dụng hiện đại, đồng thời chú thích giữ lại cách dịch sát cấu trúc.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Thế sao” chuyển tải sự kinh ngạc; “tiếng mẹ đẻ” là cách nói tự nhiên. Đại từ “mình” quy chiếu phân phối về từng người trong “mỗi người trong chúng ta”.
