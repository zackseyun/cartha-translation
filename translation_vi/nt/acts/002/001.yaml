  text: Καὶ ἐν τῷ συμπληροῦσθαι τὴν ἡμέραν τῆς πεντηκοστῆς ἦσαν ⸂πάντες ὁμοῦ⸃ ἐπὶ τὸ αὐτό,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/001.yaml
  text: And when the day of Pentecost had fully come[a], they were all together in one place.
translation:
  language: vi
  text: Khi ngày lễ Ngũ Tuần đã đến[a], mọi người đều ở cùng nhau tại một chỗ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “Khi ngày lễ Ngũ Tuần đang đến hồi hoàn tất.”'
    reason: Cụm ἐν τῷ συμπληροῦσθαι dùng động từ nguyên mẫu hiện tại thụ động, có thể nhấn mạnh tiến trình ngày lễ đang đi đến sự hoàn tất, thay vì chỉ kết quả là ngày lễ đã đến.
lexical_decisions:
- source_word: συμπληροῦσθαι
  choice: đang đến lúc trọn vẹn
  rationale: Cấu trúc ἐν τῷ với động từ nguyên mẫu hiện tại thụ động diễn tả thời điểm trong tiến trình được hoàn tất. Cách dịch này giữ sắc thái tiến trình của nguyên văn mà vẫn tương đối tự nhiên trong tiếng Việt.
- source_word: πεντηκοστῆς
  choice: lễ Ngũ Tuần
  rationale: Πεντηκοστή là tên Hy Lạp quen dùng cho lễ Do Thái diễn ra vào ngày thứ năm mươi; “lễ Ngũ Tuần” là tên gọi đã định hình và dễ hiểu trong tiếng Việt.
- source_word: πάντες
  choice: tất cả họ
  rationale: Từ này chỉ toàn bộ nhóm người đã được nhắc đến trong ngữ cảnh trước. Thêm “họ” làm chủ thể rõ ràng trong tiếng Việt nhưng không xác định nhóm ấy hẹp hơn nguyên văn.
- source_word: ὁμοῦ
  choice: cùng nhau
  rationale: Giữ ý những người ấy ở chung, cùng hiện diện với nhau.
- source_word: ἐπὶ τὸ αὐτό
  choice: tại một nơi
  rationale: Thành ngữ có thể chỉ việc ở cùng một chỗ hoặc tụ họp với nhau. Vì ὁμοῦ đã được dịch là “cùng nhau,” cách này giữ sắc thái địa điểm và tránh lặp ý hoàn toàn.
theological_decisions:
- issue: Danh tính của chủ thể được ngầm hiểu trong ἦσαν
  choice: tất cả họ đều ở cùng nhau tại một nơi
  alternative: tất cả đều ở cùng nhau tại một nơi
  rationale: Nguyên văn không lặp lại danh từ làm chủ thể mà dựa vào ngữ cảnh trước. Đại từ “họ” giúp câu tiếng Việt rõ và tự nhiên, đồng thời không áp đặt một cách xác định thần học về phạm vi của nhóm người.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cụm “đang đến lúc trọn vẹn” có chủ ý giữ sắc thái tiến trình trong nguyên văn; chú thích cung cấp cách diễn đạt thiên về kết quả. Dấu chú thích [a] đã được đặt ngay sau cụm từ liên quan.
