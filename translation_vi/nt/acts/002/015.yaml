  text: οὐ γὰρ ὡς ὑμεῖς ὑπολαμβάνετε οὗτοι μεθύουσιν, ἔστιν γὰρ ὥρα τρίτη τῆς ἡμέρας,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/015.yaml
  text: For these are not drunk[a], as you suppose, for it is the third hour of the day.
translation:
  language: vi
  text: Vì những người này không say như anh em tưởng, vì bây giờ là giờ thứ ba trong ngày.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tức là khoảng chín giờ sáng theo cách tính giờ của người Do Thái.
    reason: cultural_note
lexical_decisions:
- source_word: οὐ γὰρ
  choice: Vì ... không
  rationale: γάρ nối câu này với lời cáo buộc ở câu trước bằng ý giải thích; “Vì” giữ được mạch lập luận, còn οὐ phủ định việc họ say.
- source_word: ὡς ὑμεῖς ὑπολαμβάνετε
  choice: như anh em tưởng đâu
  rationale: ὑπολαμβάνω ở đây có nghĩa là tưởng, cho rằng. “Anh em” diễn đạt đại từ số nhiều ὑμεῖς tự nhiên trong lời nói trực tiếp; “đâu” làm rõ sự bác bỏ mà không đổi nội dung.
- source_word: οὗτοι
  choice: những người này
  rationale: Đại từ chỉ định nói đến nhóm người đang bị cáo buộc. Tiếng Việt cần danh từ chỉ người để câu rõ và tự nhiên.
- source_word: μεθύουσιν
  choice: say
  rationale: Động từ hiện tại mô tả tình trạng bị cáo buộc là đang say; “say” là cách diễn đạt thông dụng và chính xác.
- source_word: ἔστιν γὰρ ὥρα τρίτη τῆς ἡμέρας
  choice: bởi bây giờ mới là giờ thứ ba trong ngày
  rationale: γάρ thứ hai nêu lý do bác bỏ lời cáo buộc. “Mới” diễn đạt tự nhiên hàm ý thời điểm còn sớm trong lập luận, còn “giờ thứ ba trong ngày” giữ cách tính giờ của nguyên văn.
- source_word: ὥρα τρίτη
  choice: giờ thứ ba
  rationale: Giữ cách gọi giờ theo nguyên văn trong chính văn; giờ hiện đại tương ứng được giải thích trong chú thích.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “anh em” cho đại từ số nhiều trong lời Phi-e-rơ nói với đám đông; giữ cách nói “giờ thứ ba” để bảo tồn bối cảnh văn hóa của nguyên văn.
