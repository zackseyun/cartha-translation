  text: But this is what was spoken through the prophet Joel:[a]
translation:
  language: vi
  text: Nhưng đây là điều đã được phán qua nhà tiên tri Giô-ên:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “bởi nhà tiên tri Giô-ên.” Từ Hy Lạp có thể diễn tả tác nhân, nhưng “qua” làm nổi bật hơn vai trò của Giô-ên như người trung gian truyền đạt lời tiên tri.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Nhưng
  rationale: Liên từ tương phản, sửa lại cách hiểu sai của đám đông trong ngữ cảnh trước; “Nhưng” là từ nối tự nhiên và rõ ràng trong tiếng Việt.
- source_word: τοῦτό
  choice: đây
  rationale: Đại từ chỉ định giống trung, chỉ hiện tượng đang diễn ra; “đây” tự nhiên hơn “điều này” khi đứng trong cấu trúc đồng nhất với mệnh đề theo sau.
- source_word: ἐστιν
  choice: là
  rationale: Giữ nghĩa hệ từ thông thường, không diễn giải thành “có nghĩa là” hay “ứng nghiệm” vốn vượt quá điều câu Hy Lạp nói trực tiếp.
- source_word: τὸ εἰρημένον
  choice: điều đã được phán
  rationale: Mạo từ cùng phân từ hoàn thành bị động được dùng như danh từ. Cách dịch này giữ thể bị động và sắc thái lời tiên tri trang trọng; “đã” diễn đạt hành động nói có trước mà không cường điệu hóa trạng thái kết quả.
- source_word: διὰ
  choice: qua
  rationale: Với sở hữu cách và một người làm trung gian, διά có thể chỉ tác nhân hoặc phương tiện. “Qua” bảo tồn rõ vai trò trung gian tiên tri của Giô-ên.
- source_word: τοῦ προφήτου
  choice: nhà tiên tri
  rationale: Cách gọi tự nhiên, phổ thông và trang trọng trong tiếng Việt, làm bổ ngữ cho “qua”.
- source_word: Ἰωήλ
  choice: Giô-ên
  rationale: Dùng dạng tên riêng Kinh Thánh quen thuộc trong tiếng Việt, có gạch nối theo quy ước phiên âm phổ biến.
theological_decisions:
- issue: Vai trò trung gian tiên tri trong διὰ τοῦ προφήτου Ἰωήλ
  choice: qua nhà tiên tri Giô-ên
  alternative: bởi nhà tiên tri Giô-ên
  rationale: “Qua” bảo tồn khuôn mẫu Thiên Chúa truyền lời qua một tiên tri mà không biến Giô-ên thành nguồn tối hậu của sứ điệp. Đồng thời, cách dịch không áp đặt một học thuyết chi tiết về cơ chế linh hứng mà câu này không nêu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Được phán” phù hợp với ngữ cảnh lời tiên tri hơn “được nói”, còn “qua” giữ được sự mơ hồ có giới hạn giữa tác nhân và phương tiện trong nguyên ngữ.
