  text: καί γε ἐπὶ τοὺς δούλους μου καὶ ἐπὶ τὰς δούλας μου ἐν ταῖς ἡμέραις ἐκείναις ἐκχεῶ ἀπὸ τοῦ πνεύματός μου, καὶ προφητεύσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/018.yaml
  text: Even on my male servants and my female servants in those days I will pour out from my Spirit[b][a], and they will prophesy.
translation:
  language: vi
  text: Ngay cả trên các nô lệ nam và các nô lệ nữ của Ta, trong những ngày ấy, Ta sẽ tuôn đổ Thần Khí của Ta xuống, và họ sẽ nói tiên tri.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc dịch sát hơn: “Ta sẽ tuôn đổ từ Thần Khí của Ta.” Tiếng Hy Lạp dùng giới từ có nghĩa là “từ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: καί γε
  choice: Ngay cả
  rationale: Diễn đạt tự nhiên sắc thái nhấn mạnh và mở rộng đầy bất ngờ của tổ hợp tiểu từ.
- source_word: ἐπὶ τοὺς δούλους μου καὶ ἐπὶ τὰς δούλας μου
  choice: trên các nô lệ nam và nô lệ nữ của Ta
  rationale: “Nô lệ” giữ rõ địa vị xã hội thấp được nhấn mạnh trong ngữ cảnh; “nam” và “nữ” phản ánh sự phân biệt giới tính minh nhiên trong tiếng Hy Lạp.
- source_word: ἐν ταῖς ἡμέραις ἐκείναις
  choice: trong những ngày ấy
  rationale: Cách diễn đạt tự nhiên, sát nghĩa và giữ đại từ chỉ định.
- source_word: ἐκχεῶ
  choice: Ta sẽ đổ ra
  rationale: Giữ nguyên hình ảnh tuôn đổ dồi dào của động từ Hy Lạp ở thì tương lai.
- source_word: ἀπὸ τοῦ πνεύματός μου
  choice: từ Thần Khí của Ta
  rationale: Giữ rõ giới từ ἀπό, nghĩa đen là “từ”, đồng thời dùng “Thần Khí” để chỉ Thần của Đức Chúa Trời trong văn phong trang trọng.
- source_word: προφητεύσουσιν
  choice: họ sẽ nói tiên tri
  rationale: Cách diễn đạt quen thuộc, rõ nghĩa cho hành động phát ngôn mang tính tiên tri.
theological_decisions:
- issue: Cách dịch δοῦλος/δούλη trong ngữ cảnh nhấn mạnh địa vị xã hội
  choice: nô lệ nam / nô lệ nữ
  alternative: đầy tớ nam / đầy tớ nữ
  rationale: “Nô lệ” bảo toàn sức nặng xã hội của từ ngữ và ý nghĩa rằng Thần Khí được ban cả cho những người có địa vị thấp, đồng thời không xóa sự phân biệt nam–nữ trong nguyên văn.
- issue: Cách dịch ἀπὸ τοῦ πνεύματός μου
  choice: từ Thần Khí của Ta
  alternative: Thần Khí của Ta / một phần Thần Khí của Ta
  rationale: Giữ giới từ “từ” mà không suy diễn rằng Thần Khí bị phân chia thành các phần hoặc xác quyết thêm một cách hiểu thần học ngoài văn bản.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “Ta” phù hợp với lời trực tiếp của Đức Chúa Trời. Cấu trúc được điều chỉnh nhẹ theo cú pháp tiếng Việt nhưng vẫn giữ thứ tự nhấn mạnh chính của nguyên văn.
