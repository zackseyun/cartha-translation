base_translation:
  language: en
  yaml_path: translation/nt/acts/002/021.yaml
  text: And it shall be that everyone who calls on the name of the Lord will be saved[a].
translation:
  language: vi
  text: 'Và sẽ xảy ra: tất cả những ai kêu cầu danh Chúa sẽ được cứu[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “bất cứ ai kêu cầu danh Chúa.” Câu này nhắc lại Giô-ên 2:32, nơi “Chúa” chỉ YHWH; trong Công Vụ, Phi-e-rơ dùng lời ấy trong bài công bố về Chúa Giê-su.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἔσται
  choice: rồi ... sẽ
  rationale: Động từ tương lai εἰμί nằm trong công thức dẫn nhập của lời tiên tri. Cách diễn đạt này giữ ý hướng về điều sẽ xảy ra nhưng tự nhiên hơn trong tiếng Việt hiện đại.
- source_word: πᾶς ὃς ἐὰν
  choice: tất cả những ai
  rationale: Cấu trúc này diễn tả điều kiện phổ quát, không xác định; cách dịch giữ trọn phạm vi bao quát và vẫn thuận tai trong tiếng Việt.
- source_word: ἐπικαλέσηται
  choice: kêu cầu
  rationale: Trong thành ngữ Kinh Thánh đi với “danh”, động từ mang nghĩa khẩn cầu, nương cậy và cầu khấn; “kêu cầu” vừa quen thuộc vừa giữ được sắc thái thờ phượng.
- source_word: τὸ ὄνομα
  choice: danh
  rationale: “Danh” giữ lối diễn đạt trang trọng của Kinh Thánh và hàm ý về chính thân vị, thẩm quyền cùng bản tính của Đấng được kêu cầu, thay vì chỉ một tên gọi.
- source_word: κυρίου
  choice: Chúa
  rationale: Dịch κύριος là “Chúa” mà không xác định thêm đối tượng quy chiếu, qua đó giữ nguyên cách diễn đạt và độ mở thần học của bản Hy Lạp.
- source_word: σωθήσεται
  choice: sẽ được cứu
  rationale: Thể tương lai bị động của σῴζω được thể hiện rõ, đồng thời giữ cả sắc thái giải cứu và cứu rỗi trong văn cảnh.
theological_decisions:
- issue: Đối tượng được gọi là “Chúa” trong lời trích dẫn Giô-ên khi được dùng trong Công Vụ
  choice: Giữ nguyên “Chúa” trong chính văn, không xác định rõ đối tượng quy chiếu.
  alternative: Hiểu là YHWH trong văn cảnh nguyên thủy của Giô-ên, hoặc hiểu là Chúa Giê-su trong cách Phi-e-rơ vận dụng lời trích dẫn giữa bài công bố về Ngài.
  rationale: Bản Hy Lạp chỉ nói κύριος. Trong Giô-ên, danh xưng này chỉ YHWH; còn trong Công Vụ, Phi-e-rơ đặt lời trích dẫn vào bài công bố tập trung vào Chúa Giê-su. Không thêm lời giải nghĩa vào chính văn sẽ bảo toàn cả câu chữ lẫn sức căng thần học.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại và dễ hiểu. “Kêu cầu danh Chúa” được giữ như một thành ngữ Kinh Thánh tự nhiên trong tiếng Việt; cấu trúc câu tránh lối cổ quá mức.
