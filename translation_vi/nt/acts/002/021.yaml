  source_fidelity: Bản nháp chuyển đạt đúng phạm vi phổ quát của πᾶς ὃς ἐὰν, thành ngữ ἐπικαλέσηται τὸ ὄνομα κυρίου là “kêu cầu danh Chúa”, và thể bị động tương lai σωθήσεται là “sẽ được cứu”. Tuy nhiên, “rồi” không có đối ứng rõ trong καὶ ἔσται và làm yếu công thức tương lai mở đầu của lời trích dẫn.
  naturalness: “Kêu cầu danh Chúa” và “sẽ được cứu” là tự nhiên trong văn phong Kinh Thánh tiếng Việt hiện đại. Thay “Và rồi” bằng “Và sẽ xảy ra:” vừa tự nhiên vừa sát công thức nguồn hơn.
  terminology: “Chúa”, “danh Chúa”, và “được cứu” là các thuật ngữ phù hợp. Chính văn không xác định thêm quy chiếu của “Chúa”, nhờ đó bảo toàn sự mở của câu trích Giô-ên trong lập luận của Công Vụ. Chú thích nêu bối cảnh YHWH và việc Phi-e-rơ sử dụng lời trích dẫn mà không áp đặt một cách giải quyết thần học.
