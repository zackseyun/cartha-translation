id: ACT.2.42
reference: Acts 2:42
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἦσαν δὲ προσκαρτεροῦντες τῇ διδαχῇ τῶν ἀποστόλων καὶ τῇ ⸀κοινωνίᾳ, τῇ κλάσει τοῦ ἄρτου καὶ ταῖς προσευχαῖς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/042.yaml
  text: And they were devoting themselves to the apostles' teaching and the fellowship[c][b][a], to the breaking of bread and the prayers.
translation:
  language: vi
  text: Họ chuyên tâm vào lời dạy của các sứ đồ, sự thông công[a], việc bẻ bánh[b] và các lời cầu nguyện[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “sự chia sẻ”, “sự cùng dự phần” hoặc “sự hiệp thông”.
    reason: lexical_alternative
  - marker: b
    text: “Việc bẻ bánh” có thể chỉ các bữa ăn chung nói chung, dù nhiều người hiểu rằng ở đây cũng bao gồm Tiệc Thánh.
    reason: alternative_reading
  - marker: c
    text: Hoặc “các lời cầu nguyện theo khuôn thức”; mạo từ có thể gợi đến những lời cầu nguyện, dịp hoặc hình thức cầu nguyện đã được thừa nhận.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦσαν δὲ προσκαρτεροῦντες
  choice: Họ chuyên tâm giữ vững
  rationale: Kết cấu vị quá khứ tiếp diễn diễn tả một nếp sống liên tục trong quá khứ; “chuyên tâm giữ vững” truyền đạt cả sự bền bỉ lẫn tận tâm.
- source_word: τῇ διδαχῇ τῶν ἀποστόλων
  choice: lời dạy của các sứ đồ
  rationale: “Lời dạy” tự nhiên và dễ hiểu hơn “giáo lý” trong ngữ cảnh này; sở hữu cách cho thấy đây là điều các sứ đồ giảng dạy.
- source_word: τῇ κοινωνίᾳ
  choice: sự thông công
  rationale: Cụm từ chỉ sự cùng dự phần và đời sống chung của cộng đồng; “thông công” giữ được bề rộng của nghĩa mà không giới hạn vào việc chia sẻ của cải hay một nghi thức.
- source_word: τῇ κλάσει τοῦ ἄρτου
  choice: việc bẻ bánh
  rationale: Giữ nguyên cách diễn đạt cụ thể của Lu-ca—Công Vụ, tránh xác định quá mức rằng đây chỉ là bữa ăn chung hoặc riêng Tiệc Thánh.
- source_word: ταῖς προσευχαῖς
  choice: các giờ cầu nguyện
  rationale: Mạo từ cùng danh từ số nhiều có thể gợi đến những dịp cầu nguyện đã được thừa nhận; cách dịch này chuyển tải sắc thái ấy, đồng thời chú thích bảo lưu khả năng hiểu là những lời cầu nguyện theo khuôn thức.
theological_decisions:
- issue: κλάσει τοῦ ἄρτου có nên được dịch rõ là Tiệc Thánh hay không
  choice: việc bẻ bánh
  alternative: Tiệc Thánh; bữa ăn chung có bao gồm Tiệc Thánh
  rationale: Ngữ thức có thể nói đến bữa ăn chung và trong bối cảnh Cơ Đốc có thể bao gồm bữa ăn tưởng niệm Chúa Giê-su, nhưng bản văn không xác định dứt khoát một nghĩa nghi lễ chuyên biệt.
- issue: κοινωνία có nên được giới hạn vào việc chia sẻ tài sản hoặc sự hiệp thông bí tích hay không
  choice: sự thông công
  alternative: sự chia sẻ; sự cùng dự phần; sự hiệp thông
  rationale: Từ Hy Lạp có nghĩa rộng, bao gồm đời sống chung và sự cùng dự phần; bản dịch chính không thu hẹp nghĩa vào một biểu hiện vật chất hay nghi lễ.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “sứ đồ” như thuật ngữ Kinh Thánh quen thuộc; giữ các cụm “thông công” và “bẻ bánh” để bảo toàn bề rộng thần học và tính mơ hồ thật sự của nguyên văn.
