revisions:
- from: Họ chuyên tâm giữ vững lời dạy của các sứ đồ, sự thông công[a], việc bẻ bánh[b] và các giờ cầu nguyện[c].
  to: Họ chuyên tâm vào lời dạy của các sứ đồ, sự thông công[a], việc bẻ bánh[b] và các lời cầu nguyện[c].
  rationale: Sửa động từ để diễn đạt tự nhiên và sát hơn ý kiên trì chuyên tâm của kết cấu ἦσαν ... προσκαρτεροῦντες, không thêm ý “giữ vững”. Sửa “các giờ cầu nguyện” thành “các lời cầu nguyện” để không thu hẹp danh từ προσευχαῖς; sắc thái về các hình thức hay dịp cầu nguyện được giữ ở chú thích. Các thuật ngữ còn lại được bảo lưu vì phản ánh nguyên văn và duy trì tính mơ hồ cần thiết.
  reviewer_model: gpt-5.6-terra
