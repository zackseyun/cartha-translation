source:
  edition: SBLGNT
  text: καὶ ἐγένετο ἄφνω ἐκ τοῦ οὐρανοῦ ἦχος ὥσπερ φερομένης πνοῆς βιαίας καὶ ἐπλήρωσεν ὅλον τὸν οἶκον οὗ ἦσαν καθήμενοι,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/002.yaml
  text: And suddenly there came from heaven a sound like that of a violent rushing wind[a], and it filled the whole house where they were sitting.
translation:
  language: vi
  text: Bỗng nhiên, có một âm thanh từ trời vọng xuống, như tiếng một luồng gió mạnh đang thổi, và âm thanh ấy tràn ngập cả ngôi nhà nơi họ đang ngồi[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: «một âm thanh như tiếng một luồng khí mạnh đang chuyển động». Tiếng Hy Lạp ví âm thanh này với luồng khí mạnh đang chuyển động; câu này không nói rõ rằng thật sự có gió hiện diện.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: vang đến
  rationale: Trong kết cấu kể chuyện với ἦχος, cách diễn đạt này tự nhiên trong tiếng Việt, vừa cho biết âm thanh xuất hiện vừa phối hợp với nguồn phát «từ trời».
- source_word: ἄφνω
  choice: bỗng nhiên
  rationale: Diễn đạt rõ tính bất ngờ, đột ngột bằng văn phong hiện đại và trang trọng.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: từ trời
  rationale: Giữ khả năng chỉ nguồn thuộc thiên giới trong văn mạch Lu-ca–Công Vụ, thay vì thu hẹp thành bầu trời khí quyển.
- source_word: ἦχος
  choice: một âm thanh
  rationale: Từ trung tính và bao quát, không thêm sắc thái khó chịu như «tiếng ồn» hoặc cường độ cụ thể như «tiếng gầm».
- source_word: ὥσπερ
  choice: như tiếng
  rationale: Đánh dấu rõ đây là phép so sánh, không khẳng định một cơn gió thật sự hiện diện.
- source_word: φερομένης
  choice: đang cuồn cuộn thổi
  rationale: Diễn đạt tự nhiên chuyển động mạnh của luồng khí; «cuồn cuộn» gợi chuyển động dồn dập nhưng không biến phép so sánh thành lời khẳng định có gió thật.
- source_word: πνοῆς
  choice: gió
  rationale: Trong sự kết hợp với βιαίας và phép so sánh về âm thanh, «gió» phù hợp hơn «hơi thở».
- source_word: βιαίας
  choice: mạnh
  rationale: Truyền đạt sức mạnh và tính mãnh liệt của βίαιος bằng cách nói tự nhiên; tránh «dữ dội» nếu từ này khiến người đọc hiểu quá mức về sự tàn phá.
- source_word: ἐπλήρωσεν
  choice: tràn ngập
  rationale: Diễn tả âm thanh lan khắp không gian ngôi nhà, đồng thời giữ âm thanh làm chủ thể của động từ.
- source_word: ὅλον τὸν οἶκον
  choice: cả ngôi nhà
  rationale: Giữ trọn ý toàn thể của ὅλον bằng lối nói tiếng Việt thông dụng.
- source_word: οὗ ἦσαν καθήμενοι
  choice: nơi họ đang ngồi
  rationale: Chuyển đạt tự nhiên mệnh đề quan hệ và trạng thái tiếp diễn trong bối cảnh kể chuyện.
theological_decisions:
- issue: Bản chất của hiện tượng được ví với gió
  choice: 'Giữ phép so sánh: một âm thanh như tiếng gió mạnh đang cuồn cuộn thổi.'
  alternative: Một cơn gió mạnh thật sự tràn ngập ngôi nhà.
  rationale: ὥσπερ đánh dấu phép so sánh. Bản dịch không đồng nhất âm thanh với một cơn gió thật, nhờ đó giữ sự dè dặt và căng thẳng vốn có của nguyên văn.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, sáng rõ và trang trọng vừa phải. Cấu trúc «từ trời vang đến» nhấn nguồn của âm thanh; việc lặp «âm thanh ấy» làm rõ chủ thể của «tràn ngập» và tránh khiến người đọc tưởng chính gió tràn vào nhà.
