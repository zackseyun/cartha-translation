    rationale: Tiếng Việt thường nói âm thanh «vọng xuống từ trời» hoặc «từ trời vọng xuống». Cách sửa vẫn giữ nguồn thiên thượng của ἐκ τοῦ οὐρανοῦ và không thêm ý nghĩa thần học.
  - severity: low
    issue: «Cuồn cuộn thổi» mang sắc thái hình ảnh tăng cường; chú thích dùng «đang được đẩy đi» thiếu tự nhiên.
    rationale: φερομένης chủ yếu chỉ sự được mang/chuyển động. «Đang thổi» trong câu chính và «đang chuyển động» trong chú thích vừa tự nhiên vừa không diễn giải quá mức.
