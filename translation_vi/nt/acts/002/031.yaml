- from: 'Vì thấy trước điều ấy, ông đã nói về sự sống lại của Đấng Mê-si: Ngài không bị bỏ lại trong âm phủ,[a][b] và thân xác Ngài cũng không thấy sự mục nát.[c]'
  to: 'Thấy trước điều ấy, ông đã nói về sự sống lại của Đấng Mê-si: Ngài không bị bỏ lại trong âm phủ,[a][b] và thân xác Ngài cũng không thấy sự mục nát.[c]'
  rationale: Chỉ bỏ “Vì” để không áp đặt một quan hệ nhân quả rõ rệt hơn so với phân từ προϊδών trong nguyên văn. Các lựa chọn còn lại trung thành với bản văn Hy Lạp, phù hợp với vết kiểm tra tiếng Anh, và chú thích vẫn được giữ nguyên với các điểm neo hợp lệ.
  reviewer_model: gpt-5.6-terra
