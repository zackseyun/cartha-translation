id: ACT.2.31
reference: Acts 2:31
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: προϊδὼν ἐλάλησεν περὶ τῆς ἀναστάσεως τοῦ χριστοῦ ὅτι ⸂οὔτε ἐγκατελείφθη⸃ εἰς ⸀ᾅδην ⸀οὔτε ἡ σὰρξ αὐτοῦ εἶδεν διαφθοράν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/031.yaml
  text: 'Foreseeing this[a], he spoke about the resurrection of the Messiah: that he was neither abandoned to Hades[d][c][b], nor did his flesh see decay.'
translation:
  language: vi
  text: 'Thấy trước điều ấy, ông đã nói về sự sống lại của Đấng Mê-si: Ngài không bị bỏ lại trong âm phủ,[a][b] và thân xác Ngài cũng không thấy sự mục nát.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “không bị phó cho âm phủ.” Giới từ Hy Lạp có thể được diễn đạt theo hướng “vào/cho” hoặc theo vị trí “trong”; ý chính là Ngài không bị bỏ lại nơi cõi chết.'
    reason: lexical_alternative
  - marker: b
    text: “Âm phủ” ở đây chỉ cõi người chết, không nhất thiết là nơi trừng phạt cuối cùng.
    reason: cultural_note
  - marker: c
    text: 'Cũng có thể dịch: “không trải qua sự phân hủy.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: προϊδὼν
  choice: Vì thấy trước điều ấy
  rationale: Phân từ bất định chỉ việc nhận biết trước điều sắp xảy ra; thêm “điều ấy” theo văn cảnh để câu tiếng Việt tự nhiên.
- source_word: ἐλάλησεν περὶ τῆς ἀναστάσεως
  choice: ông đã nói về sự sống lại
  rationale: Giữ nghĩa trực tiếp của λαλέω và περί với sở hữu cách, đồng thời dùng cách diễn đạt tự nhiên trong tiếng Việt hiện đại.
- source_word: τοῦ χριστοῦ
  choice: của Đấng Mê-si
  rationale: Trong lập luận dựa trên Kinh Thánh của Phi-e-rơ, Χριστός nổi bật với tư cách tước hiệu của Đấng được xức dầu, không đơn thuần như tên riêng.
- source_word: οὔτε ἐγκατελείφθη
  choice: Ngài không bị bỏ lại
  rationale: ἐγκαταλείπω ở thể bị động có nghĩa là bị bỏ lại hoặc bị ruồng bỏ; “bị bỏ lại” phù hợp nhất với nơi chốn được nêu tiếp theo.
- source_word: εἰς ᾅδην
  choice: trong âm phủ
  rationale: ᾅδης chỉ cõi người chết. Với động từ bị động “bỏ lại”, tiếng Việt tự nhiên dùng “trong”; cách này không đồng nhất thuật ngữ với nơi trừng phạt cuối cùng.
- source_word: ἡ σὰρξ αὐτοῦ
  choice: thân xác Ngài
  rationale: σάρξ ở đây chỉ thân thể vật chất. “Thân xác” rõ nghĩa và trang trọng hơn cách dịch máy móc là “thịt”, đồng thời vẫn giữ trọng tâm thân thể.
- source_word: εἶδεν διαφθοράν
  choice: không thấy sự mục nát
  rationale: Giữ thành ngữ Hy Lạp “thấy sự mục nát”; διαφθορά trong ngữ cảnh này chỉ sự phân hủy của thân xác.
theological_decisions:
- issue: Cách dịch Χριστός
  choice: Đấng Mê-si
  alternative: Đấng Christ
  rationale: Ngữ cảnh là lời giải nghĩa lời tiên tri về Đấng được xức dầu, nên giữ rõ chức năng tước hiệu.
- issue: Cách dịch ᾅδης
  choice: âm phủ
  alternative: cõi người chết
  rationale: “Âm phủ” là thuật ngữ ngắn gọn, quen thuộc để chỉ cõi người chết; chú thích ngăn việc hiểu thành nơi trừng phạt cuối cùng.
- issue: Cách dịch σάρξ
  choice: thân xác
  alternative: xác thịt
  rationale: Ở đây từ này nói về thân thể thật chịu khả năng phân hủy, không nói về bản tính tội lỗi; “thân xác” tránh hàm ý đạo đức không có trong ngữ cảnh.
- issue: Quan hệ của εἰς với ἐγκατελείφθη
  choice: bị bỏ lại trong âm phủ
  alternative: bị phó cho âm phủ
  rationale: Giới từ εἰς có thể gợi hướng “vào/cho”, nhưng trong lời trích dẫn này ý chính là Ngài không bị để lại trong cõi chết; bản dịch giữ ý ấy mà không ép một sắc thái không chắc chắn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ông” cho Đa-vít theo chủ thể từ văn cảnh, “Ngài” cho Đấng Mê-si; giữ cấu trúc song hành phủ định nhưng diễn đạt tự nhiên trong tiếng Việt.
