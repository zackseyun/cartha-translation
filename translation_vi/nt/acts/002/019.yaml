- from: 'Ta sẽ ban những điều kỳ diệu trên trời cao và những dấu lạ dưới đất: máu, lửa và luồng khói.[a]'
  to: 'Ta sẽ ban những điềm lạ trên trời cao và những dấu lạ dưới đất: máu, lửa và hơi khói.[a]'
  rationale: Đổi “luồng khói” thành “hơi khói” để phản ánh trực tiếp ἀτμίδα καπνοῦ, đồng thời thay “những điều kỳ diệu” bằng “những điềm lạ” để truyền đạt chính xác hơn τέρατα trong cặp cố định với σημεῖα. Giữ nguyên cấu trúc trời–đất, chuỗi hình ảnh, ngôi lời phán và dấu hai chấm.
