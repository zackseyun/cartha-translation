  text: καὶ δώσω τέρατα ἐν τῷ οὐρανῷ ἄνω καὶ σημεῖα ἐπὶ τῆς γῆς κάτω, αἷμα καὶ πῦρ καὶ ἀτμίδα καπνοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/019.yaml
  text: 'And I will give wonders in the heaven above and signs on the earth below: blood and fire and a cloud of smoke.'
translation:
  language: vi
  text: 'Ta sẽ ban những điềm lạ trên trời cao và những dấu lạ dưới đất: máu, lửa và hơi khói.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “luồng khói.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: δώσω
  choice: Ta sẽ ban
  rationale: Giữ nghĩa trực tiếp của δίδωμι và lời phán ngôi thứ nhất của Đức Chúa Trời; “ban” tự nhiên, trang trọng hơn “cho” trong văn cảnh tiên tri.
- source_word: τέρατα
  choice: những điều kỳ diệu
  rationale: Diễn tả các hiện tượng phi thường gây kinh ngạc, không thu hẹp vào phép chữa lành hay một loại phép lạ cụ thể.
- source_word: ἐν τῷ οὐρανῷ ἄνω
  choice: trên trời cao
  rationale: Giữ sự đối xứng không gian với “dưới đất” và sắc thái vũ trụ của lời tiên tri; tiếng Việt không cần lặp cả giới từ lẫn trạng từ theo cấu trúc Hy Lạp.
- source_word: σημεῖα
  choice: những dấu lạ
  rationale: “Dấu lạ” vừa chỉ hiện tượng có ý nghĩa báo hiệu vừa phù hợp với cặp từ quen thuộc τέρατα καὶ σημεῖα.
- source_word: ἐπὶ τῆς γῆς κάτω
  choice: dưới đất
  rationale: γῆ ở đây đối lập với trời và có nghĩa là đất/thế gian bên dưới; cách nói ngắn gọn, tự nhiên trong tiếng Việt.
- source_word: αἷμα
  choice: máu
  rationale: Dịch trực tiếp, giữ hình ảnh cụ thể và mạnh của lời tiên tri.
- source_word: πῦρ
  choice: lửa
  rationale: Dịch trực tiếp, giữ nguyên hình ảnh nguyên tố trong chuỗi dấu hiệu.
- source_word: ἀτμίδα καπνοῦ
  choice: luồng khói
  rationale: ἀτμίς chỉ hơi, làn hoặc luồng bốc lên; “luồng khói” tự nhiên trong tiếng Việt và vẫn giữ hình ảnh chuyển động của khói. Nghĩa sát chữ hơn được nêu ở chú thích.
theological_decisions:
- issue: Cách dịch cặp vị trí vũ trụ trong lời trích dẫn sách Giô-ên
  choice: trên trời cao ... dưới đất
  alternative: trên bầu trời ... dưới mặt đất
  rationale: Cách chọn này giữ phạm vi vũ trụ và thế đối xứng trời–đất của lời tiên tri, không thu hẹp hình ảnh thành hiện tượng khí tượng đơn thuần.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ta” để thể hiện lời phán trực tiếp của Đức Chúa Trời trong ngữ cảnh trích dẫn tiên tri; dấu hai chấm làm rõ rằng máu, lửa và luồng khói là các dấu lạ vừa nêu.
