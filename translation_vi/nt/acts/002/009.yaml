id: ACT.2.9
reference: Acts 2:9
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Πάρθοι καὶ Μῆδοι καὶ Ἐλαμῖται, καὶ οἱ κατοικοῦντες τὴν Μεσοποταμίαν, Ἰουδαίαν τε καὶ Καππαδοκίαν, Πόντον καὶ τὴν Ἀσίαν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/009.yaml
  text: Parthians and Medes and Elamites[a], and those living in Mesopotamia, Judea and Cappadocia, Pontus and Asia[b],
translation:
  language: vi
  text: Người Pác-thia, người Mê-đi, người Ê-lam, cùng những người cư ngụ tại Mê-sô-pô-ta-mi, Giu-đê và Cáp-pa-đô-xi[b], Pôn-tơ và A-si-a[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tức là tỉnh A-si-a của đế quốc La Mã ở phía tây Tiểu Á, không phải châu Á ngày nay.
    reason: cultural_note
  - marker: b
    text: Cụm τε καί được dịch là “và”; cụm này cũng có thể mang sắc thái liên kết hoặc bổ sung nhẹ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάρθοι
  choice: người Pác-thia
  rationale: Phiên âm tên dân tộc Parthia sang tiếng Việt và thêm “người” để thể hiện rõ danh từ chỉ cộng đồng.
- source_word: Μῆδοι
  choice: người Mê-đi
  rationale: Dùng dạng phiên âm quen thuộc của tên dân tộc Media, giữ cấu trúc liệt kê các dân tộc.
- source_word: Ἐλαμῖται
  choice: người Ê-lam
  rationale: Dùng tên Ê-lam quen thuộc trong tiếng Việt để chỉ người thuộc vùng/dân Ê-lam.
- source_word: οἱ κατοικοῦντες
  choice: những người cư ngụ tại
  rationale: Diễn đạt tự nhiên phân từ hiện tại có mạo từ, chỉ những người đang sinh sống tại các địa phương được kể ra.
- source_word: τὴν Μεσοποταμίαν
  choice: Mê-sô-pô-ta-mi
  rationale: Phiên âm địa danh Mesopotamia theo lối đọc tiếng Việt.
- source_word: Ἰουδαίαν
  choice: Giu-đê
  rationale: Giữ nghĩa địa lý của tên vùng Judea, không diễn giải thành một tên gọi sắc tộc hay tôn giáo.
- source_word: τε καὶ
  choice: và
  rationale: Trong chuỗi địa danh, “và” là cách nối tự nhiên nhất; sắc thái liên kết hoặc bổ sung nhẹ của τε καί được ghi nhận trong chú thích thay vì tạo một cấu trúc tiếng Việt gượng ép.
- source_word: Καππαδοκίαν
  choice: Cáp-pa-đô-xi
  rationale: Phiên âm địa danh Cappadocia theo tiếng Việt.
- source_word: Πόντον
  choice: Pôn-tơ
  rationale: Phiên âm tên vùng Pontus theo tiếng Việt.
- source_word: τὴν Ἀσίαν
  choice: A-si-a
  rationale: Giữ tên riêng của tỉnh Asia thời La Mã; chú thích làm rõ đây không phải toàn bộ châu Á hiện đại.
theological_decisions: []
translation_notes:
  register: 'Văn phong trang trọng nhưng hiện đại, dùng “cư ngụ” để diễn đạt κατοικοῦντες một cách rõ ràng và tự nhiên. Các tên dân tộc và địa danh được phiên âm nhất quán, dễ đọc đối với độc giả tiếng Việt. Vị trí ký hiệu chú thích được đặt theo đúng nội dung: [b] tại cụm có τε καί và [a] sau A-si-a.'
