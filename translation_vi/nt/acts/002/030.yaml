id: ACT.2.30
reference: Acts 2:30
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: προφήτης οὖν ὑπάρχων, καὶ εἰδὼς ὅτι ὅρκῳ ὤμοσεν αὐτῷ ὁ θεὸς ἐκ καρποῦ τῆς ὀσφύος ⸀αὐτοῦ καθίσαι ἐπὶ ⸂τὸν θρόνον⸃ αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/030.yaml
  text: Therefore[a], being a prophet and knowing that God had sworn to him with an oath to seat one from the fruit of his loins on his throne,
translation:
  language: vi
  text: Vậy, vì là một nhà tiên tri và biết rằng Đức Chúa Trời đã long trọng thề với ông là sẽ lập một người thuộc dòng dõi ông[a] ngồi trên ngai của ông,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “từ hoa trái của thắt lưng ông,” một thành ngữ chỉ người thuộc dòng dõi ông.'
    reason: Giữ lại hình ảnh cụ thể và ý nghĩa huyết thống của thành ngữ Hy Lạp trong chú thích, trong khi bản văn chính dùng lối nói tự nhiên.
lexical_decisions:
- source_word: προφήτης
  choice: nhà tiên tri
  rationale: Cách dịch chuẩn, tự nhiên trong tiếng Việt cho người nói bởi sự mặc khải của Đức Chúa Trời.
- source_word: οὖν
  choice: Vậy
  rationale: Giữ quan hệ suy luận với lập luận ngay trước đó, đồng thời tự nhiên hơn trong văn mạch tiếng Việt.
- source_word: ὑπάρχων, καὶ εἰδὼς
  choice: vì là ... và biết rằng
  rationale: Diễn đạt tự nhiên hai phân từ nêu hoàn cảnh và cơ sở cho điều Đa-vít nói, không biến chúng thành hai hành động chính độc lập.
- source_word: ὅρκῳ ὤμοσεν
  choice: đã long trọng thề
  rationale: Chuyển sức nhấn của cấu trúc danh từ cùng động từ chỉ lời thề sang tiếng Việt tự nhiên, tránh cách lặp máy móc 'thề bằng một lời thề'.
- source_word: ἐκ καρποῦ τῆς ὀσφύος αὐτοῦ
  choice: một người thuộc dòng dõi ông
  rationale: Truyền đạt thành ngữ chỉ hậu duệ thể lý bằng tiếng Việt hiện đại; hình ảnh nguyên văn được giữ trong chú thích.
- source_word: καθίσαι
  choice: đặt ... ngồi
  rationale: Giữ sắc thái tác động khiến người ấy ngồi hoặc được lập trên ngai, với Đức Chúa Trời là chủ thể.
- source_word: ἐπὶ τὸν θρόνον αὐτοῦ
  choice: trên ngai của ông
  rationale: Giữ ngôn ngữ vương quyền và đại từ của nguyên văn; trong ngữ cảnh, 'ông' chỉ Đa-vít.
theological_decisions:
- issue: Lời hứa vương quyền dành cho dòng dõi Đa-vít
  choice: Giữ cách nói 'một người thuộc dòng dõi ông' và 'ngai của ông'.
  alternative: Dịch diễn giải là 'Đấng Mê-si sẽ ngồi trên ngai Đa-vít'.
  rationale: Câu này nêu lời thề theo ngôn ngữ về dòng dõi và ngai; phần văn mạch sẽ xác định sự ứng nghiệm nơi Chúa Giê-xu, nên không đưa danh xưng thần học vốn không xuất hiện trong chính câu này vào bản dịch.
- issue: Chủ thể của đại từ sở hữu cuối câu
  choice: Giữ 'ngai của ông', theo cách hiểu tự nhiên là ngai của Đa-vít.
  alternative: Diễn đạt tường minh 'ngai Đa-vít'.
  rationale: Cách dịch giữ sát đại từ αὐτοῦ và không cần bổ sung tên riêng, trong khi mạch văn vẫn làm rõ sở chỉ.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng 'Đức Chúa Trời' theo văn phong Kinh Thánh phổ thông; tránh lối dịch quá sát gây gượng như 'thề bằng một lời thề' và tránh đưa trực tiếp danh xưng 'Đấng Mê-si' vào câu.
