source:
  edition: SBLGNT
  text: καὶ τὰ κτήματα καὶ τὰς ὑπάρξεις ἐπίπρασκον καὶ διεμέριζον αὐτὰ πᾶσιν καθότι ἄν τις χρείαν εἶχεν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/045.yaml
  text: And they were selling their property and possessions and distributing them to all[a], as anyone had need.
translation:
  language: vi
  text: Họ cứ bán tài sản và của cải của mình, rồi phân phát cho mọi người[a], tùy theo nhu cầu của mỗi người.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “ruộng đất và tài sản.” Hai từ Hy Lạp có lẽ phân biệt các loại của cải sở hữu: κτήματα thường chỉ tài sản sở hữu, nhất là đất đai hoặc bất động sản, còn ὑπάρξεις chỉ của cải hay tài sản nói chung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κτήματα
  choice: đất đai
  rationale: Danh từ này thường chỉ tài sản đã sở hữu, nhất là đất đai hoặc bất động sản; cách dịch này giúp phân biệt với ὑπάρξεις.
- source_word: ὑπάρξεις
  choice: của cải mình có
  rationale: Từ này chỉ những vật thuộc quyền sở hữu hay tài sản nói chung. Cách diễn đạt tự nhiên này bao quát các tài sản khác với đất đai.
- source_word: ἐπίπρασκον
  choice: cứ bán
  rationale: Thì chưa hoàn thành diễn tả hành động diễn ra liên tục hoặc lặp lại trong quá khứ, chứ không nhất thiết là một lần bán hết.
- source_word: διεμέριζον
  choice: phân chia
  rationale: Trong ngữ cảnh, động từ chỉ việc phân phối những gì đã bán hoặc thu được cho cộng đồng; không xác định chi tiết cơ chế phân phối.
- source_word: αὐτά
  choice: lược trong câu tiếng Việt
  rationale: Đại từ có thể quy chiếu đến đất đai, của cải hoặc ngầm chỉ những gì thu được từ việc bán. Tiếng Việt tự nhiên có thể lược đại từ sau “phân chia” mà không buộc phải giải quyết điểm mơ hồ này.
- source_word: πᾶσιν
  choice: cho mọi người
  rationale: Giữ nghĩa rộng của bổ ngữ chỉ người nhận trong phạm vi cộng đồng được nói đến.
- source_word: καθότι ἄν τις χρείαν εἶχεν
  choice: tùy theo nhu cầu của mỗi người
  rationale: Diễn đạt tự nhiên nguyên tắc phân phối theo nhu cầu riêng của bất cứ ai, đồng thời giữ sắc thái bất định của ἄν τις.
theological_decisions:
- issue: Bản chất của việc các tín hữu chia sẻ tài sản
  choice: Mô tả việc bán và phân chia diễn ra liên tục hoặc lặp lại, theo nhu cầu.
  alternative: Hiểu câu này là tuyên bố mọi tín hữu đã bãi bỏ hoàn toàn quyền sở hữu riêng hoặc đặt ra một quy định phổ quát cho mọi Cơ Đốc nhân.
  rationale: Các động từ ở thì chưa hoàn thành cho thấy một tập quán đang diễn ra; bản văn không nói rõ toàn bộ sở hữu riêng đã chấm dứt, cũng không trực tiếp biến tập quán này thành mệnh lệnh phổ quát.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. “Cứ bán” giữ sắc thái tiếp diễn/lặp lại; “của cải mình có” tự nhiên hơn một danh từ trừu tượng và vẫn phân biệt với “đất đai.”
