  terminology: Dùng “tài sản” cho κτήματα và “của cải” cho ὑπάρξεις tránh xác định κτήματα chỉ là đất đai, đồng thời giữ sự phân biệt tương đối giữa hai từ. Không thêm hàm ý rằng quyền sở hữu tư bị bãi bỏ hay rằng đây là quy định phổ quát.
