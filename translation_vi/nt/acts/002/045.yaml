  verdict: revise
  source_fidelity: 'Bản nháp giữ được sắc thái tiếp diễn/lặp lại của hai động từ chưa hoàn thành qua “cứ bán” và diễn đạt đúng nguyên tắc phân phát theo nhu cầu. Tuy nhiên, dịch κτήματα là “đất đai” trong bản văn chính thu hẹp từ này quá mức: từ Hy Lạp thường có thể chỉ đất đai hay các hạng mục tài sản sở hữu, nhưng không bắt buộc chỉ riêng đất. Đại từ αὐτά được lược tự nhiên trong tiếng Việt mà vẫn không áp đặt đó là tài sản gốc hay tiền thu được.'
