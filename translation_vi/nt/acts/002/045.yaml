  to: Họ cứ bán tài sản và của cải của mình, rồi phân phát cho mọi người[a], tùy theo nhu cầu của mỗi người.
  rationale: Bản sửa giữ thì chưa hoàn thành bằng “cứ bán,” giữ tính mở của αὐτά bằng cách không nói rõ là tài sản hay tiền bán được, và dùng các từ bao quát hơn cho κτήματα. Câu vẫn chỉ mô tả việc bán và phân phát theo nhu cầu, không suy diễn một mô hình sở hữu bắt buộc.
