  text: until I make your enemies a footstool for your feet[a][b].
translation:
  language: vi
  text: cho đến khi Ta đặt các kẻ thù của ngươi làm bệ kê chân cho ngươi.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay, sát nghĩa hơn: “cho đến khi Ta đặt các kẻ thù của ngươi làm bệ kê chân của ngươi.”'
    reason: lexical_alternative
  - marker: b
    text: Dòng này nhắc lại Thi Thiên 110:1, một bản văn về sự đăng quang mang tính vương quyền và Mê-si.
    reason: cross_reference
lexical_decisions:
- source_word: ἕως ἂν
  choice: cho đến khi
  rationale: Diễn đạt tự nhiên mốc thời gian tương lai mà hành động trong lời trích dẫn hướng tới.
- source_word: θῶ
  choice: Ta đặt ... làm
  rationale: Động từ τίθημι có nghĩa cơ bản là “đặt”; đi với bổ ngữ vị ngữ ὑποπόδιον, cấu trúc “đặt ... làm” vừa sát nguyên văn vừa tự nhiên trong tiếng Việt.
- source_word: τοὺς ἐχθρούς σου
  choice: các kẻ thù của Con
  rationale: Giữ nguyên nghĩa đối nghịch mang tính cá nhân và vương quyền; “Con” phù hợp với lời Đức Chúa Trời phán cùng Đấng được xưng là Chúa trong ngữ cảnh trích dẫn.
- source_word: ὑποπόδιον
  choice: bệ chân
  rationale: Từ chỉ vật kê chân; “bệ chân” giữ hình ảnh cụ thể về việc khuất phục trong thi thiên vương quyền.
- source_word: τῶν ποδῶν σου
  choice: cho Con
  rationale: Trong cụm cố định “bệ chân,” cách nói “làm bệ chân cho Con” tự nhiên trong tiếng Việt và hàm ý dùng cho chân của người được nói đến mà không cần lặp từ “chân” vụng về.
theological_decisions:
- issue: Hình ảnh vương quyền và khuất phục trong lời trích Thi Thiên 110:1
  choice: Giữ hình ảnh cụ thể “đặt các kẻ thù ... làm bệ chân”
  alternative: cho đến khi Ta hoàn toàn khuất phục các kẻ thù của Con dưới chân Con
  rationale: Nguyên văn duy trì ẩn dụ đăng quang/vương quyền thay vì giải nghĩa thành sự thất bại hoàn toàn. Giữ ẩn dụ bảo toàn mối liên hệ liên văn bản và sức nặng Đấng Mê-si mà không đưa phần diễn giải vào chính văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ta/Con” trong lời trích dẫn để thể hiện quan hệ xưng hô trang trọng theo ngữ cảnh, nhưng không giải quyết thêm căn tính của các nhân vật ngay trong câu này.
