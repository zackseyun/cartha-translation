  rationale: Sửa đại từ “Con” thành “ngươi” để không xác định thêm quan hệ giữa các nhân vật vượt quá điều câu trích dẫn Hy Lạp nói. Dùng “bệ kê chân” để giữ hình ảnh cụ thể của “footstool”; chú thích a nêu phương án sở hữu sát cấu trúc Hy Lạp hơn, còn chính văn dùng cách diễn đạt Việt ngữ tự nhiên.
