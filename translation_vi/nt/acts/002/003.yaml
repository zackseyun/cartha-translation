source:
  edition: SBLGNT
  text: καὶ ὤφθησαν αὐτοῖς διαμεριζόμεναι γλῶσσαι ὡσεὶ πυρός, ⸂καὶ ἐκάθισεν⸃ ἐφ’ ἕνα ἕκαστον αὐτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/003.yaml
  text: And tongues like fire appeared to them, being divided, and it came to rest on each one of them[a].
translation:
  language: vi
  text: Có những lưỡi như lửa hiện ra cho họ, phân chia ra, và có một lưỡi đậu trên mỗi người trong số họ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “những lưỡi phân chia ra, tựa như lửa” hoặc “những lưỡi, như thể bằng lửa.” Nguyên văn Hy Lạp nhấn mạnh cả hiện tượng nhìn thấy được lẫn việc các lưỡi được phân ra giữa mọi người. Động từ “đậu” ở số ít; “có một lưỡi đậu trên mỗi người” là cách diễn đạt tiếng Việt theo ý phân phối, dù nguyên văn không lặp lại danh từ “một lưỡi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὤφθησαν αὐτοῖς
  choice: hiện ra cho họ
  rationale: Diễn đạt tự nhiên giá trị thụ động mang nghĩa nội động của ὤφθησαν và giữ rõ những người được thấy hiện tượng ấy.
- source_word: διαμεριζόμεναι
  choice: phân chia ra
  rationale: Giữ sắc thái phân từ hiện tại trung động/thụ động và sự mơ hồ giữa tiến trình phân chia với kết quả được phân phát.
- source_word: γλῶσσαι
  choice: những lưỡi
  rationale: Giữ nguyên hình ảnh 'lưỡi', đồng thời duy trì mối liên hệ từ vựng với chủ đề nói các thứ tiếng ở câu kế tiếp; dịch thành 'ngọn lửa' sẽ thu hẹp hình ảnh.
- source_word: ὡσεὶ πυρός
  choice: như lửa
  rationale: Giữ rõ đây là phép so sánh, không khẳng định hiện tượng ấy chính là lửa.
- source_word: ἐκάθισεν
  choice: một lưỡi đậu
  rationale: Động từ Hy Lạp ở số ít. Tiếng Việt cần nêu chủ thể để câu tự nhiên; 'một lưỡi' được bổ sung theo ý phân phối của vế sau mà không đổi hiện tượng thành chủ thể số nhiều.
- source_word: ἐφ’ ἕνα ἕκαστον αὐτῶν
  choice: trên mỗi người trong số họ
  rationale: Bảo toàn sức nhấn mạnh phân phối đến từng cá nhân.
theological_decisions:
- issue: Bản chất của dấu hiệu trong ngày Lễ Ngũ Tuần
  choice: những lưỡi như lửa
  alternative: những ngọn lửa; những thứ tiếng bằng lửa
  rationale: γλῶσσαι cùng ὡσεὶ vừa giữ hình ảnh hữu hình vừa gợi mối liên hệ với lời nói, nhưng không đồng nhất dấu hiệu với lửa thật hay chỉ giải thích nó là ngôn ngữ.
- issue: Số ít của ἐκάθισεν sau danh từ số nhiều
  choice: giữ ý số ít bằng 'một lưỡi đậu trên mỗi người'
  alternative: chúng đậu trên mỗi người; hiện tượng ấy đậu trên mỗi người
  rationale: Không âm thầm đổi động từ số ít thành số nhiều; cách diễn đạt phân phối này phù hợp với 'mỗi người' nhưng được ghi chú vì tiếng Hy Lạp không lặp lại danh từ 'một lưỡi'.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “đậu” cho hình ảnh một vật hiện ra rồi dừng lại trên người; tránh “ngự” vì có thể đưa thêm sắc thái thần học không có trong động từ. Dấu chú thích [a] xuất hiện trong chính văn.
