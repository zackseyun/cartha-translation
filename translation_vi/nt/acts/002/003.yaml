  rationale: Chỉnh rất nhẹ để tránh thêm sắc thái tuần tự của “rồi” và làm rõ trong chú thích rằng “một lưỡi” là cách xử lý số ít của động từ Hy Lạp trong bối cảnh phân phối, chứ không phải từ được nêu lặp lại trong nguyên văn. Hình ảnh, tính so sánh và tính mơ hồ có kiểm soát của câu được giữ nguyên.
