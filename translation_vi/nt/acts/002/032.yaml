source:
  edition: SBLGNT
  text: τοῦτον τὸν Ἰησοῦν ἀνέστησεν ὁ θεός, οὗ πάντες ἡμεῖς ἐσμεν μάρτυρες.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/032.yaml
  text: God raised up this Jesus[a], of whom we all are witnesses.
translation:
  language: vi
  text: Đức Chúa Trời đã làm cho Đức Giê-su này sống lại[a]; tất cả chúng tôi đều là nhân chứng về Ngài.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Đức Chúa Trời đã khiến Đức Giê-su này trỗi dậy.” Động từ Hy Lạp ở đây chỉ sự sống lại từ cõi chết.'
    reason: Ghi nhận cách diễn đạt sát hình thức hơn của ἀνέστησεν, đồng thời làm rõ nghĩa phục sinh trong ngữ cảnh.
lexical_decisions:
- source_word: τοῦτον τὸν Ἰησοῦν
  choice: Đức Giê-su này
  rationale: Giữ sắc thái chỉ định và nhấn mạnh của τοῦτον, hướng về chính Đức Giê-su vừa được nhắc đến; cách nói này tự nhiên và trang trọng trong tiếng Việt.
- source_word: ἀνέστησεν
  choice: đã làm cho ... sống lại
  rationale: Trong ngữ cảnh này, động từ chỉ việc Đức Chúa Trời khiến Đức Giê-su từ cõi chết sống lại. Cách dịch làm rõ nghĩa phục sinh và giữ cấu trúc tác động với Đức Chúa Trời là chủ thể.
- source_word: ὁ θεός
  choice: Đức Chúa Trời
  rationale: Giữ nguyên chủ thể được nêu rõ trong tiếng Hy Lạp, dùng cách gọi phổ thông và trang trọng trong tiếng Việt Cơ Đốc.
- source_word: οὗ
  choice: về điều ấy
  rationale: Đại từ quan hệ sở hữu liên kết với μάρτυρες. Trong tiếng Việt, “về điều ấy” tự nhiên hơn “về người ấy” trong ngữ cảnh các sứ đồ làm chứng cho sự kiện Đức Giê-su sống lại, đồng thời vẫn thừa nhận khả năng quy chiếu ngữ pháp đến chính Đức Giê-su qua chú thích.
- source_word: πάντες ἡμεῖς
  choice: tất cả chúng tôi
  rationale: Bảo toàn sự nhấn mạnh của πάντες cùng đại từ ἡμεῖς và phân biệt nhóm người nói với thính giả.
- source_word: ἐσμεν μάρτυρες
  choice: đều là nhân chứng
  rationale: Giữ cấu trúc danh từ của nguyên văn thay vì chuyển thành động từ “làm chứng”; “đều” phối hợp tự nhiên với “tất cả chúng tôi” và nhấn mạnh toàn thể nhóm.
theological_decisions:
- issue: Cách diễn đạt sự phục sinh
  choice: Đức Chúa Trời đã làm cho Đức Giê-su này sống lại
  alternative: Đức Chúa Trời đã khiến Đức Giê-su này trỗi dậy
  rationale: Bản dịch trực tiếp quy hành động phục sinh cho Đức Chúa Trời như nguyên văn, nhưng không thêm diễn giải giáo lý. “Sống lại” truyền đạt rõ nghĩa phục sinh của ἀνέστησεν trong văn cảnh.
- issue: Đối tượng hoặc nội dung của lời chứng
  choice: nhân chứng về điều ấy
  alternative: nhân chứng của Ngài
  rationale: οὗ có thể được hiểu theo hình thức là quy về Đức Giê-su, nhưng trong văn cảnh lời chứng tập trung vào việc Ngài sống lại. Bản chính dùng cách nói tự nhiên “về điều ấy” và chú thích bảo tồn khả năng dịch sát đại từ quan hệ là “về Ngài”.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. “Chính” thể hiện lực nhấn của cụm chỉ định và trật tự câu Hy Lạp; “Đức Giê-su này” giữ sắc thái quy chiếu mà không trở nên khẩu ngữ. Dấu chấm phẩy giúp thể hiện hai mệnh đề liên kết chặt chẽ.
