revisions:
- from: “Thưa các ông, thưa anh em[a], tôi có thể mạnh dạn nói với anh em về tổ phụ Đa-vít rằng ông đã chết và được chôn cất, và phần mộ của ông vẫn còn giữa chúng ta cho đến ngày nay.”
  to: “Thưa các ông và anh em[a], tôi được phép mạnh dạn nói với anh em về tổ phụ Đa-vít rằng ông đã chết và được chôn cất, và phần mộ của ông vẫn còn giữa chúng ta cho đến ngày nay.”
  rationale: Sửa “có thể” thành “được phép” để phản ánh trung thực hơn ἐξὸν εἰπεῖν. Điều chỉnh nhẹ lời hô gọi cho tự nhiên trong tiếng Việt, đồng thời duy trì cả hai danh từ hô cách giống đực của nguyên văn. Rút gọn chú thích để tránh thêm chi tiết bối cảnh không nằm ngay trong câu.
