source:
  edition: SBLGNT
  text: Ἄνδρες ἀδελφοί, ἐξὸν εἰπεῖν μετὰ παρρησίας πρὸς ὑμᾶς περὶ τοῦ πατριάρχου Δαυίδ, ὅτι καὶ ἐτελεύτησεν καὶ ἐτάφη, καὶ τὸ μνῆμα αὐτοῦ ἔστιν ἐν ἡμῖν ἄχρι τῆς ἡμέρας ταύτης·
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/029.yaml
  text: Men[a], brothers, I may speak to you with boldness about the patriarch David, that he both died and was buried, and his tomb is among us to this day.
translation:
  language: vi
  text: “Thưa các ông và anh em[a], tôi được phép mạnh dạn nói với anh em về tổ phụ Đa-vít rằng ông đã chết và được chôn cất, và phần mộ của ông vẫn còn giữa chúng ta cho đến ngày nay.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch gọn là “Thưa anh em”. Tiếng Hy Lạp theo nghĩa đen có hai lời xưng hô giống đực: “các ông, anh em”; đây là một lối chào gọi trang trọng.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄνδρες ἀδελφοί
  choice: Thưa các ông, thưa anh em
  rationale: Giữ lại hai danh từ xưng hô giống đực trong tiếng Hy Lạp, đồng thời dùng lối thưa gửi trang trọng, dễ hiểu trong tiếng Việt hiện đại. Cách dịch này không tự ý mở rộng thành “anh chị em”.
- source_word: ἐξὸν εἰπεῖν
  choice: tôi có thể ... nói
  rationale: Trong ngữ cảnh, thành ngữ này nói đến sự được phép hoặc có đủ tự do để nói, chứ không đơn thuần là năng lực. “Có thể” kết hợp với “mạnh dạn” truyền đạt tự nhiên ý ấy.
- source_word: μετὰ παρρησίας
  choice: mạnh dạn
  rationale: Diễn tả lời nói công khai, thẳng thắn và đầy tự tin; “mạnh dạn” giữ được sức nặng tu từ mà vẫn tự nhiên.
- source_word: περὶ τοῦ πατριάρχου Δαυίδ
  choice: về tổ phụ Đa-vít
  rationale: “Tổ phụ” là cách gọi trang trọng, quen thuộc cho πατριάρχης, chỉ một vị tổ tiên tiêu biểu của dân tộc; không thêm từ “chúng ta” vì nguyên văn không có.
- source_word: καὶ ἐτελεύτησεν καὶ ἐτάφη
  choice: ông đã chết và được chôn cất
  rationale: Truyền đạt đầy đủ hai sự kiện được liên kết nhấn mạnh trong nguyên văn. Tiếng Việt không cần thêm cấu trúc tương ứng cứng nhắc với “cả ... lẫn”.
- source_word: τὸ μνῆμα αὐτοῦ
  choice: phần mộ của ông
  rationale: μνῆμα chỉ nơi an táng hoặc mộ; “phần mộ” phù hợp với một địa điểm an táng được biết đến và mang sắc thái trang trọng.
- source_word: ἔστιν ἐν ἡμῖν
  choice: vẫn còn giữa chúng ta
  rationale: “Giữa chúng ta” giữ ý địa điểm hiện diện trong cộng đồng của người nói và người nghe; “vẫn còn” làm rõ sự tồn tại tiếp diễn đến thời điểm phát biểu.
- source_word: ἄχρι τῆς ἡμέρας ταύτης
  choice: cho đến ngày nay
  rationale: Là cách diễn đạt tự nhiên cho thành ngữ thời gian, nhấn mạnh ngôi mộ vẫn hiện hữu vào ngày Phi-e-rơ đang nói.
theological_decisions:
- issue: Cách dịch lời xưng hô mở đầu theo đúng giới tính ngữ pháp
  choice: Thưa các ông, thưa anh em
  alternative: Thưa anh em
  rationale: Nguyên văn dùng hai danh từ xưng hô giống đực, ἄνδρες và ἀδελφοί. Bản dịch chính giữ cả hai thay vì trung hòa hoặc mở rộng thành “anh chị em”; chú thích nêu cách dịch gọn hơn và giải thích hình thức Hy Lạp.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, phù hợp một bài diễn thuyết công khai. Dùng “ông” cho Đa-vít để tránh lặp tên và giữ sự kính trọng. Dấu ngoặc kép trình bày lời nói trực tiếp; dấu chú thích [a] xuất hiện ngay sau cụm từ liên quan.
