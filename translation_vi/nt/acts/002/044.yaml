  source_fidelity: Bản dịch diễn đạt đúng nhóm “tất cả những người tin,” tình trạng “ở cùng nhau,” và tính chất dùng chung của ἅπαντα κοινά. Tuy nhiên, “xem mọi sự là của chung” nghiêng về thái độ/nhận định hơn là mệnh đề εἶχον ἅπαντα κοινά, vốn nói trực tiếp rằng họ có mọi sự làm của chung. Thay bằng “có mọi sự làm của chung” sát nghĩa hơn mà vẫn tự nhiên.
  naturalness: “Tất cả những người tin đều ở cùng nhau” là tiếng Việt hiện đại, rõ ràng. Cụm “có mọi sự làm của chung” là cách nói trang trọng vừa phải, quen thuộc trong ngữ cảnh văn bản Kinh Thánh và diễn đạt trực tiếp quan hệ sở hữu/chia sẻ.
  terminology: “Những người tin” là cách gọi trung tính, phù hợp với οἱ πιστεύοντες. “Của chung” chuyển đạt κοινά mà không áp đặt một mô hình kinh tế hay diễn giải giáo phái. Chú thích giữ đúng vị trí và bảo tồn khả năng hiểu thành ngữ ἐπὶ τὸ αὐτό theo nghĩa địa điểm.
