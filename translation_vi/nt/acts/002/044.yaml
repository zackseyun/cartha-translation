  yaml_path: translation/nt/acts/002/044.yaml
  text: And all the believers were together and had all things in common,[a]
translation:
  language: vi
  text: Tất cả những người tin đều ở cùng nhau[a] và có mọi sự làm của chung.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đều ở cùng một nơi.” Cụm từ Hy Lạp có thể chỉ việc cùng nhau tụ họp.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντες
  choice: Tất cả
  rationale: Giữ sắc thái bao quát, bổ nghĩa cho nhóm được gọi là những người tin.
- source_word: δὲ
  choice: không dịch thành một từ riêng
  rationale: Trong mạch kể tiếng Việt, liên từ này chỉ sự tiếp nối nhẹ; không cần thêm “nhưng”, vốn sẽ tạo sắc thái tương phản quá mạnh. Quan hệ nối tiếp được thể hiện tự nhiên qua câu văn.
- source_word: οἱ πιστεύοντες
  choice: những người tin
  rationale: Phân từ hiện tại dùng như danh từ chỉ cộng đồng có đức tin; cách diễn đạt này tự nhiên và vẫn gần cấu trúc Hy Lạp.
- source_word: ἦσαν ἐπὶ τὸ αὐτό
  choice: đều ở cùng nhau
  rationale: Thành ngữ có thể nói đến việc cùng tụ họp hoặc ở cùng một nơi. Bản dịch chính giữ ý hiệp lại mà không xác định địa điểm quá mức; phương án mang nghĩa địa điểm được ghi ở chú thích.
- source_word: εἶχον
  choice: xem ... là
  rationale: Trong cụm “εἶχον ἅπαντα κοινά”, cách dịch “xem mọi sự là của chung” diễn đạt tự nhiên tình trạng sở hữu và sử dụng chung, đồng thời giữ tính mô tả của động từ chưa hoàn thành.
- source_word: ἅπαντα κοινά
  choice: mọi sự là của chung
  rationale: Phản ánh phạm vi bao quát của ἅπαντα và ý nghĩa chung/shared của κοινά mà không biến câu thành một mệnh lệnh kinh tế.
theological_decisions:
- issue: Bản chất đời sống chia sẻ của cộng đồng
  choice: Dịch theo lối mô tả rằng những người tin xem mọi sự là của chung.
  alternative: Hiểu câu này như quy định một hệ thống kinh tế bắt buộc cho mọi cộng đồng Cơ Đốc.
  rationale: Câu Hy Lạp thuật lại thực hành của cộng đồng, không đưa ra mệnh lệnh hay quy tắc phổ quát. Bản dịch không thêm kết luận giáo lý hoặc chính trị ngoài văn bản.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. “Những người tin” tránh thuật ngữ giáo phái; “của chung” là thành ngữ tự nhiên, súc tích. Dấu chú thích [a] được đặt ngay sau cụm từ có phương án dịch khác.
