  text: this man[a], delivered up according to the determined plan and foreknowledge of God[b], you killed by nailing him to a cross through the hands of lawless men.
translation:
  language: vi
  text: Người này đã bị trao nộp theo kế hoạch đã định và sự biết trước của Đức Chúa Trời; anh em đã nhờ tay những kẻ vô luật pháp đóng đinh Người vào thập tự giá mà giết Người.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦτον
  choice: Người này
  rationale: Đại từ chỉ định ở đối cách chỉ về Đức Giê-su; “Người này” giữ được sắc thái chỉ định và phù hợp với lời nói trang trọng của Phi-e-rơ.
- source_word: τῇ ὡρισμένῃ βουλῇ
  choice: theo kế hoạch đã định
  rationale: Diễn đạt cơ sở hoặc chuẩn mực của việc trao nộp; ὡρισμένῃ mang nghĩa đã được ấn định, còn βουλή là ý định hay kế hoạch.
- source_word: καὶ προγνώσει
  choice: và sự biết trước
  rationale: Giữ nghĩa trực tiếp của πρόγνωσις và không giải thích quá mức mối liên hệ giữa sự biết trước với kế hoạch của Đức Chúa Trời.
- source_word: τοῦ θεοῦ
  choice: của Đức Chúa Trời
  rationale: Sở hữu cách bổ nghĩa cho cả “kế hoạch đã định” lẫn “sự biết trước”.
- source_word: ἔκδοτον
  choice: đã bị trao nộp
  rationale: Diễn đạt tình trạng bị giao vào tay người khác mà không xác định thêm tác nhân ngoài điều câu Hy Lạp nói rõ.
- source_word: διὰ χειρὸς ἀνόμων
  choice: dùng tay những kẻ không tuân luật pháp
  rationale: διά với sở hữu cách chỉ tác nhân trung gian; “tay” giữ hình ảnh số ít của tiếng Hy Lạp, còn ἀνόμων được diễn đạt theo nghĩa không ở dưới hoặc không tuân luật pháp, thay vì chỉ nói chung là gian ác.
- source_word: προσπήξαντες
  choice: đóng đinh người vào thập tự giá
  rationale: Phân từ chỉ hành động đóng hoặc gắn bằng đinh; bối cảnh hành hình cho phép nêu rõ thập tự giá.
- source_word: ἀνείλατε
  choice: giết đi
  rationale: Giữ lời cáo buộc trực tiếp và mạnh của Phi-e-rơ đối với người nghe.
theological_decisions:
- issue: Mối quan hệ giữa quyền định liệu của Đức Chúa Trời và trách nhiệm của con người
  choice: Giữ cả kế hoạch đã định cùng sự biết trước của Đức Chúa Trời và lời cáo buộc trực tiếp rằng người nghe đã giết Đức Giê-su.
  alternative: Làm nhẹ sự định liệu của Đức Chúa Trời, hoặc quy toàn bộ hành động cho những kẻ không tuân luật pháp để giảm trách nhiệm của người nghe.
  rationale: 'Câu Hy Lạp đặt hai khẳng định cạnh nhau mà không giải thích cách dung hòa: việc trao nộp phù hợp với kế hoạch và sự biết trước của Đức Chúa Trời, nhưng người nghe vẫn chịu trách nhiệm qua hành động của các tác nhân trung gian.'
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và trực tiếp. Dùng “anh em” cho đại từ số nhiều trong diễn từ công khai; dùng “Đức Chúa Trời” theo văn phong Kinh Thánh phổ thông. Dấu chấm phẩy giúp giữ hai vế thần học song song mà không làm mờ trách nhiệm của người nghe.
