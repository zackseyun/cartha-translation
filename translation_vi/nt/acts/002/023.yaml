revisions:
- from: Người này đã bị trao nộp theo kế hoạch đã định và sự biết trước của Đức Chúa Trời; còn anh em đã dùng tay những kẻ không tuân luật pháp mà đóng đinh người vào thập tự giá và giết đi.[a]
  to: Người này đã bị trao nộp theo kế hoạch đã định và sự biết trước của Đức Chúa Trời; anh em đã nhờ tay những kẻ vô luật pháp đóng đinh Người vào thập tự giá mà giết Người.
  rationale: Sửa cách diễn đạt tác nhân trung gian và động từ chỉ việc giết để câu văn tự nhiên, trang trọng hơn, đồng thời giữ nguyên cả sự định liệu của Đức Chúa Trời lẫn trách nhiệm của người nghe. Không thêm diễn giải thần học và không cần chú thích cho một lựa chọn cú pháp thông thường trong tiếng Việt.
