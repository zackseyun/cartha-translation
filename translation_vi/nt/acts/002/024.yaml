    rationale: Trong tiếng Việt, “tháo gỡ” thường đi với khó khăn, vướng mắc, nút thắt hoặc ràng buộc; đi trực tiếp với “những cơn đau” nghe gượng. “Giải thoát ... khỏi” diễn đạt rõ rằng Đức Chúa Trời đã giải phóng Người ấy khỏi các đau đớn/quyền lực của sự chết, mà không thêm một diễn giải giáo lý.
