id: ACT.2.24
reference: Acts 2:24
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὃν ὁ θεὸς ἀνέστησεν λύσας τὰς ὠδῖνας τοῦ θανάτου, καθότι οὐκ ἦν δυνατὸν κρατεῖσθαι αὐτὸν ὑπ’ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/024.yaml
  text: whom God raised up[a], having loosed the pains of death[b], because it was not possible for him to be held by it.
translation:
  language: vi
  text: Đức Chúa Trời đã làm cho Người ấy sống lại, giải thoát Người ấy khỏi những cơn đau của sự chết[a], vì Người ấy không thể bị sự chết cầm giữ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hy Lạp được dịch là “những cơn đau” cũng có thể có nghĩa là “những cơn đau sinh nở” hoặc “những cơn quặn đau”.
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn viết sát là “bị nó cầm giữ”; đại từ “nó” tự nhiên nhất chỉ về sự chết.
    reason: alternative_reading
lexical_decisions:
- source_word: ὃν
  choice: Người ấy
  rationale: Đại từ quan hệ chỉ về Chúa Giê-su trong câu trước. Tiếng Việt không cần giữ nguyên cấu trúc quan hệ của tiếng Hy Lạp; “Người ấy” duy trì mối liên kết mà vẫn tự nhiên.
- source_word: ἀνέστησεν
  choice: đã làm cho ... sống lại
  rationale: Diễn đạt rõ hành động Đức Chúa Trời khiến Chúa Giê-su sống lại từ cõi chết, đồng thời giữ Đức Chúa Trời làm chủ thể hành động.
- source_word: λύσας
  choice: tháo gỡ
  rationale: Giữ hình ảnh cụ thể của λύω, nghĩa là tháo, cởi hoặc giải phóng, mà không diễn giải mạnh hơn thành “phá tan” hay làm mất hẳn ẩn dụ.
- source_word: τὰς ὠδῖνας τοῦ θανάτου
  choice: những cơn đau của sự chết
  rationale: ὠδίν có thể chỉ cơn đau dữ dội, đặc biệt là cơn đau sinh nở. Cách dịch chính giữ nghĩa rộng “cơn đau”, còn sắc thái đau sinh nở được ghi nhận trong chú thích.
- source_word: καθότι
  choice: vì
  rationale: Giới thiệu lý do cho hành động của Đức Chúa Trời bằng liên từ tự nhiên, rõ ràng trong tiếng Việt hiện đại.
- source_word: οὐκ ἦν δυνατὸν
  choice: không thể
  rationale: Truyền đạt trực tiếp cấu trúc chỉ sự bất khả của nguyên văn mà không thêm lời giải thích thần học.
- source_word: κρατεῖσθαι
  choice: bị ... cầm giữ
  rationale: Giữ thể bị động và ý niệm bị nắm giữ dưới quyền lực của một thế lực.
- source_word: ὑπ’ αὐτοῦ
  choice: bị sự chết
  rationale: Đại từ Hy Lạp tự nhiên nhất quy chiếu về θάνατος, “sự chết”. Lặp lại danh từ trong tiếng Việt giúp câu rõ nghĩa hơn cách dịch máy móc “bởi nó”.
theological_decisions:
- issue: Đối tượng quy chiếu của ὑπ’ αὐτοῦ
  choice: 'Đại từ quy chiếu về sự chết: “bị sự chết cầm giữ”'
  alternative: Dịch sát hình thức là “bị nó cầm giữ”; về ngữ pháp cũng có thể đặt câu hỏi liệu đại từ giống đực có chỉ một chủ thể giống đực khác hay không.
  rationale: 'θάνατος là danh từ giống đực trong tiếng Hy Lạp và là tiền ngữ gần nhất, phù hợp nhất với ý nghĩa của mệnh đề: sự chết không thể tiếp tục cầm giữ Người ấy. Chú thích vẫn cho biết dạng đại từ của nguyên văn.'
- issue: Nghĩa của ὠδῖνας
  choice: “những cơn đau” trong chính văn
  alternative: “những cơn đau sinh nở” hoặc “những cơn quặn đau”
  rationale: Từ Hy Lạp thường gợi cơn đau sinh nở nhưng cũng có thể chỉ những cơn đau dữ dội. Chính văn giữ cách diễn đạt rộng và dễ hiểu; chú thích bảo tồn sắc thái từ vựng cùng hình ảnh tiềm ẩn.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, với câu cú rõ ràng cho độc giả phổ thông. “Tháo gỡ” bảo tồn hình ảnh của động từ Hy Lạp dù sự kết hợp với “những cơn đau” có tính ẩn dụ. Viết hoa “Người ấy” để chỉ nhất quán về Chúa Giê-su mà không thêm một tước hiệu không có trong nguyên văn.
