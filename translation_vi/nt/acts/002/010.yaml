source:
  edition: SBLGNT
  text: Φρυγίαν τε καὶ Παμφυλίαν, Αἴγυπτον καὶ τὰ μέρη τῆς Λιβύης τῆς κατὰ Κυρήνην, καὶ οἱ ἐπιδημοῦντες Ῥωμαῖοι,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/010.yaml
  text: Phrygia and Pamphylia[a], Egypt and the parts of Libya toward Cyrene, and the visiting Romans[b],
translation:
  language: vi
  text: Phrygia và Pamphylia, Ai Cập và các vùng của Libya về phía Cyrene[a], cùng những người Rôma đang tạm trú[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “các vùng của Libya quanh Cyrene.”'
    reason: lexical_alternative
  - marker: b
    text: 'Hay: “những người Rôma đang lưu trú tạm thời” hoặc “khách Rôma.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Φρυγίαν
  choice: xứ Phrygia
  rationale: Dùng địa danh quen thuộc theo dạng chuyển tự, thêm “xứ” để người đọc Việt nhận rõ đây là một vùng.
- source_word: τε καὶ
  choice: và
  rationale: Liên kết các địa danh trong danh sách; “và” tự nhiên hơn cấu trúc nhấn mạnh “cả... lẫn...” trong văn cảnh này.
- source_word: Παμφυλίαν
  choice: Pamphylia
  rationale: Chuyển tự tên vùng theo cách dùng Kinh Thánh tiếng Việt thông dụng.
- source_word: Αἴγυπτον
  choice: Ai Cập
  rationale: Dùng tên quốc gia chuẩn trong tiếng Việt.
- source_word: τὰ μέρη
  choice: các vùng
  rationale: Diễn đạt nghĩa ‘những phần/vùng’ bằng cách nói tự nhiên trong tiếng Việt mà vẫn giữ số nhiều.
- source_word: τῆς Λιβύης
  choice: của Libya
  rationale: Giữ quan hệ sở thuộc trực tiếp với “các vùng”.
- source_word: τῆς κατὰ Κυρήνην
  choice: hướng về Cyrene
  rationale: Giữ sắc thái địa lý tương đối của κατά mà không xác định quá mức là ‘quanh’ hay ‘gần’.
- source_word: οἱ ἐπιδημοῦντες
  choice: những người ... đang tạm trú tại đây
  rationale: Động từ phân từ chỉ những người hiện diện và lưu lại tạm thời tại nơi đang nói đến, không hàm ý cư trú lâu dài.
- source_word: Ῥωμαῖοι
  choice: người từ Rôma
  rationale: Trong cấu trúc với ἐπιδημοῦντες, cách dịch này làm rõ nơi xuất thân của những người đang tạm trú và tự nhiên hơn “những người Rôma tạm trú” trong tiếng Việt.
