translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và phù hợp với một danh sách địa lý. Giữ dấu phẩy cuối câu vì câu 10 tiếp nối danh sách của các câu lân cận. Các địa danh được thể hiện bằng dạng quen thuộc trong tiếng Việt hoặc chuyển tự rõ ràng.
