revisions:
- from: xứ Phrygia và Pamphylia, Ai Cập và các vùng của Libya hướng về Cyrene[a], cùng những người từ Rôma đang tạm trú tại đây[b],
  to: Phrygia và Pamphylia, Ai Cập và các vùng của Libya về phía Cyrene[a], cùng những người Rôma đang tạm trú[b],
  rationale: Sửa cách gọi người Rôma để không thêm nghĩa “từ thành Rôma”; điều chỉnh cụm định vị Cyrene cho tự nhiên; và bỏ “xứ” để giữ danh sách địa danh gọn, nhất quán. Dấu phẩy cuối được giữ vì câu vẫn tiếp nối danh sách ở ngữ cảnh rộng hơn.
