- from: Tất cả đều được đầy dẫy Đức Thánh Linh và bắt đầu nói bằng những tiếng khác[a], theo như Thánh Linh ban cho họ nói ra.
  to: Tất cả đều được đầy dẫy Đức Thánh Linh và bắt đầu nói các thứ tiếng khác[a], tùy theo Đức Thánh Linh ban cho họ nói.
  rationale: Điều chỉnh cách diễn đạt để câu tiếng Việt hiện đại tự nhiên hơn, đồng thời làm rõ rằng γλῶσσαι là các thứ tiếng được nói mà không chuyển bản văn chính sang cách hiểu dứt khoát “ngôn ngữ.” Chú thích tiếp tục nêu lựa chọn từ vựng và căn cứ từ ngữ cảnh Công Vụ 2:6–11. Không có thay đổi nào đối với ý nghĩa của câu.
