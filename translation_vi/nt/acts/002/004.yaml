reference: Acts 2:4
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἐπλήσθησαν ⸀πάντες πνεύματος ἁγίου, καὶ ἤρξαντο λαλεῖν ἑτέραις γλώσσαις καθὼς τὸ πνεῦμα ἐδίδου ⸂ἀποφθέγγεσθαι αὐτοῖς⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/004.yaml
  text: And they were all filled with the Holy Spirit and began to speak in other tongues[a], as the Spirit was giving them utterance.
translation:
  language: vi
  text: Tất cả đều được đầy dẫy Đức Thánh Linh và bắt đầu nói các thứ tiếng khác[a], tùy theo Đức Thánh Linh ban cho họ nói.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “những ngôn ngữ khác.” Từ Hy Lạp có thể mang nghĩa “tiếng” hoặc “ngôn ngữ”; phần tiếp theo cho biết người nghe nhận ra đó là những ngôn ngữ của mình.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπλήσθησαν
  choice: được đầy dẫy
  rationale: Động từ aorist bị động của πίμπλημι diễn tả việc cả nhóm được Đức Thánh Linh làm cho đầy tràn; “được đầy dẫy” vừa tự nhiên trong văn phong Kinh Thánh tiếng Việt, vừa giữ sắc thái bị động.
- source_word: πάντες
  choice: tất cả
  rationale: Diễn đạt trọn vẹn tính toàn thể của nhóm người hiện diện mà không thêm một chủ thể không có trong câu Hy Lạp.
- source_word: πνεύματος ἁγίου
  choice: Đức Thánh Linh
  rationale: Trong ngữ cảnh Công Vụ 2, cụm từ này chỉ Thánh Linh của Đức Chúa Trời, là tác nhân ban khả năng nói ở cuối câu; danh xưng tiếng Việt này thể hiện rõ quy chiếu ấy.
- source_word: ἤρξαντο λαλεῖν
  choice: bắt đầu nói
  rationale: Giữ nguyên ý khởi đầu của ἤρξαντο kết hợp với động từ nguyên mẫu λαλεῖν, đồng thời là cách nói tự nhiên trong tiếng Việt hiện đại.
- source_word: ἑτέραις γλώσσαις
  choice: bằng những tiếng khác
  rationale: “Tiếng” có thể chỉ lời nói hoặc ngôn ngữ, nhờ đó giữ phần nào độ mở nghĩa của γλώσσαις; “khác” phản ánh ἑτέραις. Chú thích nêu rõ cách hiểu “ngôn ngữ khác” được ngữ cảnh sau hỗ trợ.
- source_word: καθὼς
  choice: theo như
  rationale: Diễn tả cách thức hoặc mức độ việc họ nói tùy theo điều Thánh Linh ban, sát hơn một quan hệ chỉ thời gian.
- source_word: ἐδίδου
  choice: ban cho
  rationale: Động từ imperfect cho thấy sự ban phát diễn ra trong tiến trình họ nói. Tiếng Việt không bắt buộc đánh dấu thể tiếp diễn bằng một trợ từ; ngữ cảnh của mệnh đề vẫn truyền đạt sự ban khả năng đang diễn ra.
- source_word: ἀποφθέγγεσθαι
  choice: nói ra
  rationale: Động từ chỉ việc cất tiếng phát biểu rõ ràng hoặc công khai. “Nói ra” tự nhiên, không thu hẹp nghĩa thành riêng lời tiên tri hay một loại phát ngôn chuyên biệt.
- source_word: αὐτοῖς
  choice: cho họ
  rationale: Thể hiện tự nhiên vai trò gián tiếp của đại từ số nhiều trong cấu trúc tiếng Việt “ban cho họ”.
theological_decisions:
- issue: πνεύματος ἁγίου chỉ một tác nhân thần linh cụ thể hay một trạng thái tinh thần thánh khiết
  choice: Đức Thánh Linh
  alternative: thánh linh
  rationale: Mạch văn Công Vụ 2 trình bày Thánh Linh đã được hứa và đang chủ động ban cho họ khả năng nói. Cách viết danh xưng này truyền đạt quy chiếu cụ thể mà không thêm một định nghĩa thần học ngoài câu.
- issue: γλώσσαις nên được hiểu trực tiếp là “tiếng lạ” hay “ngôn ngữ”
  choice: những tiếng khác
  alternative: những ngôn ngữ khác
  rationale: Từ Hy Lạp có thể chỉ lưỡi, tiếng nói hoặc ngôn ngữ. Bản văn chính dùng “tiếng” để tránh giải quyết quá sớm độ mở của từ, còn chú thích cho biết ngữ cảnh 2:6–11 cho thấy người nghe nhận ra các ngôn ngữ của họ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Được đầy dẫy” giữ sắc thái Kinh Thánh quen thuộc nhưng vẫn rõ nghĩa; “bằng những tiếng khác” duy trì độ mở từ vựng của nguyên văn, với chú thích giải thích căn cứ từ mạch văn.
