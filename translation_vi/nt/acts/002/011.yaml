reference: Acts 2:11
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἰουδαῖοί τε καὶ προσήλυτοι, Κρῆτες καὶ Ἄραβες, ἀκούομεν λαλούντων αὐτῶν ταῖς ἡμετέραις γλώσσαις τὰ μεγαλεῖα τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/011.yaml
  text: both Jews and proselytes[a], Cretans and Arabs—we hear them speaking in our own languages the mighty works of God.
translation:
  language: vi
  text: cả người Do Thái lẫn người cải đạo theo Do Thái giáo, người Cơ-rết và người Ả Rập—chúng ta nghe họ dùng chính ngôn ngữ của chúng ta[a] để nói về những việc quyền năng của Đức Chúa Trời.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “tiếng”; theo nghĩa đen, từ Hy Lạp là “lưỡi”. Trong ngữ cảnh này, từ ấy chỉ những ngôn ngữ con người có thể nhận biết.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰουδαῖοί
  choice: người Do Thái
  rationale: Trong danh sách các dân tộc và cộng đồng tại Lễ Ngũ Tuần, từ này chỉ người Do Thái theo nghĩa dân tộc–tôn giáo, không chỉ riêng cư dân Giu-đê.
- source_word: τε καὶ
  choice: cả ... lẫn
  rationale: Cấu trúc tương liên này thể hiện tự nhiên sự ghép đôi giữa người Do Thái và người cải đạo theo Do Thái giáo.
- source_word: προσήλυτοι
  choice: người cải đạo theo Do Thái giáo
  rationale: Chỉ những người ngoại dân đã gia nhập hoặc cải đạo theo Do Thái giáo; cách diễn đạt này rõ nghĩa hơn từ vay mượn chuyên môn đối với độc giả phổ thông.
- source_word: Κρῆτες
  choice: người Cơ-rết
  rationale: Tên gọi thông dụng bằng tiếng Việt cho cư dân đảo Crete.
- source_word: Ἄραβες
  choice: người Ả Rập
  rationale: Cách gọi hiện đại, tự nhiên bằng tiếng Việt cho người Arab.
- source_word: ἀκούομεν
  choice: chúng ta nghe
  rationale: Giữ thì hiện tại và sắc thái trải nghiệm trực tiếp của động từ.
- source_word: λαλούντων αὐτῶν
  choice: họ nói
  rationale: Diễn đạt tự nhiên cấu trúc phân từ sau động từ “nghe” mà không thêm ý tuyên bố hay rao giảng vốn không nằm trong động từ.
- source_word: ταῖς ἡμετέραις γλώσσαις
  choice: bằng chính ngôn ngữ của chúng ta
  rationale: “Ngôn ngữ” phù hợp với bối cảnh đám đông đa quốc gia nhận biết tiếng mình; “chính” giữ sắc thái nhấn mạnh của ἡμετέραις.
- source_word: τὰ μεγαλεῖα
  choice: những việc quyền năng
  rationale: Chuyển tải những việc lớn lao, phi thường do Đức Chúa Trời thực hiện mà không mở rộng quá mức thành một mệnh đề giải thích.
- source_word: τοῦ θεοῦ
  choice: của Đức Chúa Trời
  rationale: Cách gọi trang trọng, quen thuộc trong tiếng Việt và giữ quan hệ sở hữu/tác nhân của nguyên văn.
theological_decisions:
- issue: Ý nghĩa của γλώσσαις trong bối cảnh Lễ Ngũ Tuần
  choice: các ngôn ngữ con người có thể nhận biết
  alternative: các tiếng lạ hoặc lời nói xuất thần không phải ngôn ngữ con người
  rationale: Ngữ cảnh gần nhấn mạnh rằng đám đông đến từ nhiều nơi nghe được bằng ngôn ngữ riêng của họ. Bản dịch chính phản ánh nghĩa nổi bật trong trình thuật, còn chú thích giữ lại khả năng dịch sát hình thức là “lưỡi/tiếng” mà không đưa tranh luận thần học về sau vào câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “người cải đạo theo Do Thái giáo” thay cho thuật ngữ vay mượn ít quen thuộc; giữ dấu gạch ngang để thể hiện sự chuyển từ danh sách sang lời nhận xét của đám đông. Dấu chú thích được đặt ngay sau cụm từ liên quan đến γλώσσαις.
