base_translation:
  language: en
  yaml_path: translation/nt/acts/002/028.yaml
  text: You made known to me the paths of life[b][a]; you will fill me with gladness with your presence.
translation:
  language: vi
  text: Ngài đã cho tôi biết những nẻo đường sự sống[a]; Ngài sẽ làm tôi tràn đầy niềm vui trong sự hiện diện của Ngài.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “những con đường của sự sống” hoặc “những con đường dẫn đến sự sống.”'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “với mặt Ngài”; đây là một thành ngữ chỉ sự hiện diện của Ngài.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγνώρισάς μοι
  choice: Ngài đã cho con biết
  rationale: Diễn đạt tự nhiên động từ aorist chủ động cùng tân ngữ gián tiếp μοι, đồng thời giữ ý nghĩa khiến cho biết của γνωρίζω.
- source_word: ὁδοὺς ζωῆς
  choice: những con đường dẫn đến sự sống
  rationale: Giữ hình ảnh cụ thể và số nhiều của ὁδούς; cụm “dẫn đến sự sống” diễn đạt tự nhiên quan hệ sở hữu cách mà không biến nó thành nghĩa “lối sống”.
- source_word: πληρώσεις με εὐφροσύνης
  choice: Ngài sẽ làm con tràn đầy niềm vui
  rationale: Giữ nghĩa tương lai và ý được làm đầy bởi niềm vui; cách nói này tự nhiên hơn cấu trúc sát chữ “làm đầy con bằng niềm vui” trong tiếng Việt.
- source_word: μετὰ τοῦ προσώπου σου
  choice: trước mặt Ngài
  rationale: Thành ngữ sát chữ là “với mặt Ngài”; “trước mặt Ngài” vừa giữ hình ảnh khuôn mặt vừa truyền đạt ý ở trong sự hiện diện của Ngài.
theological_decisions:
- issue: Thành ngữ về sự hiện diện của Đức Chúa Trời trong lời trích dẫn Thi Thiên
  choice: trước mặt Ngài
  alternative: trong sự hiện diện của Ngài
  rationale: Lựa chọn này giữ được hình ảnh προσώπου (“mặt”) và ý nghĩa hiện diện trực tiếp, không giải thích thêm hay thu hẹp hàm ý thần học của câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “Ngài/con” phù hợp lời một người thưa với Đức Chúa Trời trong trích dẫn Thi Thiên; dấu chấm phẩy giữ sự song hành của hai mệnh đề.
