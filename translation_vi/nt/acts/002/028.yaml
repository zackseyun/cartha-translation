revisions:
- from: Ngài đã cho con biết những con đường dẫn đến sự sống[a]; Ngài sẽ làm con tràn đầy niềm vui trước mặt Ngài.[b]
  to: Ngài đã cho tôi biết những nẻo đường sự sống[a]; Ngài sẽ làm tôi tràn đầy niềm vui trong sự hiện diện của Ngài.[b]
  rationale: Bản sửa giữ sát hơn đại từ ngôi thứ nhất trung tính, bảo toàn tính hàm súc của sở hữu cách trong “những nẻo đường sự sống,” và chuyển thành ngữ “với mặt Ngài” sang cách nói Việt tự nhiên chỉ sự hiện diện. Các chú thích tiếp tục ghi nhận lựa chọn từ vựng và nghĩa sát chữ.
  reviewer_model: gpt-5.6-terra
