source:
  edition: SBLGNT
  text: αἰνοῦντες τὸν θεὸν καὶ ἔχοντες χάριν πρὸς ὅλον τὸν λαόν. ὁ δὲ κύριος προσετίθει τοὺς σῳζομένους καθ’ ἡμέραν ⸂ἐπὶ τὸ αὐτό⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/047.yaml
  text: praising God and having favor with all the people[a]. And the Lord was adding day by day those who were being saved to them.
translation:
  language: vi
  text: Họ ca ngợi Đức Chúa Trời và được toàn dân quý mến. Chúa cứ mỗi ngày thêm những người đang được cứu vào cộng đồng[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cụm từ Hy Lạp cũng có thể được hiểu là “cùng nhau” hoặc “tại cùng một nơi”.
    reason: alternative_reading
lexical_decisions:
- source_word: αἰνοῦντες τὸν θεόν
  choice: ca ngợi Đức Chúa Trời
  rationale: Phân từ hiện tại diễn tả hoạt động liên tục của cộng đồng; “ca ngợi” tự nhiên, trang trọng và giữ được sắc thái ấy.
- source_word: ἔχοντες χάριν πρὸς ὅλον τὸν λαόν
  choice: được toàn dân quý mến
  rationale: Thành ngữ nói đến việc nhận được thiện cảm từ dân chúng, không phải họ bày tỏ ân huệ với dân chúng. Cách dịch này tự nhiên trong tiếng Việt và giữ hướng quan hệ của cụm từ.
- source_word: ὁ δὲ κύριος
  choice: Chúa
  rationale: κύριος được dịch theo cách xưng gọi quen thuộc trong ngữ cảnh Tân Ước; δέ được thể hiện bằng nhịp chuyển sang câu mới thay vì thêm một liên từ gượng ép.
- source_word: προσετίθει
  choice: thêm vào cộng đồng
  rationale: Thì chưa hoàn thành diễn tả hành động lặp lại hoặc tiếp diễn; kết hợp với “mỗi ngày” truyền đạt rõ sắc thái Chúa liên tục thêm người vào cộng đồng.
- source_word: τοὺς σῳζομένους
  choice: những người đang được cứu
  rationale: Giữ cả thể bị động lẫn sắc thái tiến triển của phân từ hiện tại, không biến thành một nhãn trạng thái hoàn tất.
- source_word: καθ’ ἡμέραν
  choice: mỗi ngày
  rationale: Cách nói tiếng Việt tự nhiên, giữ nghĩa phân bố qua từng ngày.
- source_word: ἐπὶ τὸ αὐτό
  choice: vào cộng đồng
  rationale: Trong mạch văn với προσετίθει, cụm này nhiều khả năng chỉ việc được thêm vào nhóm đang tụ họp. “Cộng đồng” diễn đạt hàm ý theo văn cảnh mà không thêm đại từ không có tiền ngữ rõ trong câu; các nghĩa khả dĩ khác được giữ trong chú thích.
theological_decisions:
- issue: Sắc thái tiến triển và thể bị động của τοὺς σῳζομένους
  choice: những người đang được cứu
  alternative: những người được cứu; những người đã được cứu
  rationale: Bản dịch giữ cách nhìn hành động cứu rỗi đang diễn ra và chủ thể tiếp nhận hành động, nhưng không dùng câu này để phân xử các hệ thống thần học về trình tự cứu rỗi.
- issue: Ý nghĩa của ἐπὶ τὸ αὐτό
  choice: vào cộng đồng
  alternative: cùng nhau; tại cùng một nơi
  rationale: Cách chọn phù hợp nhất với động từ “thêm” và văn cảnh cộng đồng tín hữu, song cụm Hy Lạp thực sự có thể mang nghĩa “cùng nhau” hoặc “tại cùng một nơi”; vì vậy không loại bỏ các khả năng ấy mà ghi rõ trong chú thích.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “Đức Chúa Trời” cho θεός và “Chúa” cho κύριος. Dấu chú thích được đặt ngay sau mệnh đề chứa cách hiểu có tranh luận.
