  source_fidelity: 'Bản dịch truyền đạt đúng các mệnh đề chính: cộng đồng ca ngợi Đức Chúa Trời, được dân chúng quý mến, và Chúa liên tục thêm những người đang được cứu. “Những người đang được cứu” giữ tốt phân từ hiện tại bị động τοὺς σῳζομένους. Tuy nhiên, chú thích về ἐπὶ τὸ αὐτό hiện được neo sau “được cứu”, trong khi cụm Hy Lạp được chú thích lại được diễn đạt bằng “vào cộng đồng”; cần chuyển neo chú thích đến chính chỗ này. “Cứ mỗi ngày” cũng biểu đạt rõ hơn sắc thái chưa hoàn thành của προσετίθει cùng καθ’ ἡμέραν.'
