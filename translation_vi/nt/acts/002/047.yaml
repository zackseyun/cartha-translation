  terminology: “Đức Chúa Trời” cho θεός và “Chúa” cho κύριος nhất quán với đăng ký Cơ Đốc giáo tiếng Việt. “Cộng đồng” là cách làm rõ theo văn cảnh cho cách hiểu ἐπὶ τὸ αὐτό là được thêm vào nhóm; chú thích cần giữ các khả năng khác mà không khẳng định chúng là nghĩa duy nhất.
