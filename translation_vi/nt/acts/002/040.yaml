  text: ἑτέροις τε λόγοις πλείοσιν διεμαρτύρατο, καὶ παρεκάλει ⸀αὐτοὺς λέγων· Σώθητε ἀπὸ τῆς γενεᾶς τῆς σκολιᾶς ταύτης.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/040.yaml
  text: And with many other words he solemnly testified and kept urging them[a], saying, “Be saved from this crooked generation.”
translation:
  language: vi
  text: 'Ông còn dùng nhiều lời khác để làm chứng cách long trọng và không ngừng khuyên giục họ rằng: “Hãy được cứu khỏi thế hệ cong vẹo này.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Hãy tự cứu mình khỏi thế hệ cong vẹo này.” Động từ Hy Lạp ở thể thụ động (“hãy được cứu”), nhưng trong văn cảnh, mệnh lệnh này cũng kêu gọi người nghe đáp ứng.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἑτέροις τε λόγοις πλείοσιν
  choice: còn dùng nhiều lời khác
  rationale: Diễn đạt tự nhiên trong tiếng Việt, đồng thời giữ cả ý “khác” của ἑτέροις và số lượng nhiều của πλείοσιν.
- source_word: διεμαρτύρατο
  choice: long trọng làm chứng
  rationale: Giữ sắc thái làm chứng hoặc xác nhận một cách nghiêm túc, mạnh mẽ của διαμαρτύρομαι, thay vì thu hẹp nghĩa thành chỉ “cảnh báo”.
- source_word: παρεκάλει
  choice: không ngừng khuyên giục
  rationale: Thể chưa hoàn thành diễn tả hành động tiếp diễn hoặc lặp lại; “khuyên giục” truyền đạt sức thúc giục của παρακαλέω trong văn cảnh.
- source_word: αὐτοὺς
  choice: họ
  rationale: Đại từ chỉ những người đang nghe Phi-e-rơ; cách chuyển ngữ trực tiếp và tự nhiên.
- source_word: Σώθητε
  choice: Hãy được cứu
  rationale: Giữ thể mệnh lệnh thụ động của động từ σῴζω và lời kêu gọi người nghe đáp ứng, nhưng không biến câu thành lời khẳng định rằng họ tự cứu mình.
- source_word: ἀπὸ
  choice: khỏi
  rationale: “Khỏi” diễn đạt tự nhiên ý phân cách hoặc thoát ra khỏi trong cấu trúc tiếng Việt.
- source_word: γενεᾶς
  choice: thế hệ
  rationale: Giữ nghĩa thông thường của γενεά là thế hệ hoặc lớp người đương thời, đồng thời bảo tồn âm hưởng Kinh Thánh.
- source_word: σκολιᾶς
  choice: quanh quẹo
  rationale: Giữ hình ảnh ẩn dụ về điều cong, không ngay thẳng của σκολιός và truyền đạt sắc thái đạo đức bằng tiếng Việt hiện đại.
theological_decisions:
- issue: Thể và tác nhân trong Σώθητε
  choice: Hãy được cứu
  alternative: Hãy tự cứu mình
  rationale: Bản Hy Lạp dùng mệnh lệnh thụ động. Bản dịch giữ dạng này để không nhấn mạnh quá mức khả năng con người tự giải cứu mình, trong khi mệnh lệnh vẫn là một lời kêu gọi thật sự đòi hỏi người nghe đáp ứng.
translation_notes:
  register: Văn phong trang trọng nhưng dễ hiểu. “Long trọng làm chứng” giữ sắc thái chứng nhận mạnh mẽ; “không ngừng khuyên giục” thể hiện hành động tiếp diễn. “Quanh quẹo” bảo tồn hình ảnh gốc thay vì giải nghĩa thành một thuật ngữ giáo lý.
