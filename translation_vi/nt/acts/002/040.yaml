revisions:
- from: 'Ông còn dùng nhiều lời khác để long trọng làm chứng và không ngừng khuyên giục họ rằng: “Hãy được cứu khỏi thế hệ quanh quẹo này.”[a]'
  to: 'Ông còn dùng nhiều lời khác để làm chứng cách long trọng và không ngừng khuyên giục họ rằng: “Hãy được cứu khỏi thế hệ cong vẹo này.”[a]'
  rationale: Chỉnh sửa chỉ nhằm cải thiện cách diễn đạt tiếng Việt và thay «quanh quẹo» bằng «cong vẹo» để phản ánh sát hơn hình ảnh và sắc thái nghĩa bóng của σκολιᾶς. Dạng mệnh lệnh thụ động của Σώθητε và chú thích về cách dịch chủ động thay thế vẫn được giữ nguyên.
  reviewer_model: gpt-5.6-terra
