base_translation:
  language: en
  yaml_path: translation/nt/acts/009/023.yaml
  text: When many days had passed[c][b][a], the Jews conspired to kill him.
translation:
  language: vi
  text: Khi nhiều ngày đã trôi qua[b], những người Do Thái[a] cùng nhau mưu giết[c] Sau-lơ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hy Lạp: “những người Do Thái”; trong ngữ cảnh, cụm từ này chỉ một nhóm đang chống đối Sau-lơ, chứ không nói về mọi người Do Thái không trừ một ai.'
    reason: cultural_note
  - marker: b
    text: 'Cũng có thể dịch: “đã được trọn” hoặc “đã hoàn tất.”'
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “cùng nhau lập mưu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὡς δὲ
  choice: Khi
  rationale: Mở ra một chuyển tiếp thời gian; “Khi” tự nhiên trong tiếng Việt và không diễn đạt quá mức sắc thái nhẹ của δέ.
- source_word: ἐπληροῦντο
  choice: đã trôi qua
  rationale: Với chủ ngữ chỉ thời gian là “ngày”, động từ ở đây diễn tả một khoảng thời gian dần được hoàn tất; “đã trôi qua” là cách nói tự nhiên trong tiếng Việt.
- source_word: ἡμέραι ἱκαναί
  choice: nhiều ngày
  rationale: ἱκαναί trong ngữ cảnh này chỉ một khoảng thời gian đáng kể, nên “nhiều ngày” vừa rõ ràng vừa sát nghĩa.
- source_word: συνεβουλεύσαντο
  choice: cùng nhau mưu tính
  rationale: Động từ diễn tả sự bàn bạc chung với ý định thù nghịch; “cùng nhau mưu tính” giữ được cả yếu tố tập thể lẫn âm mưu gây hại.
- source_word: οἱ Ἰουδαῖοι
  choice: những người Do Thái
  rationale: Giữ nguyên cách gọi khái quát của bản Hy Lạp, không tự ý thu hẹp thành “các lãnh đạo Do Thái”; chú thích làm rõ phạm vi theo ngữ cảnh.
- source_word: ἀνελεῖν
  choice: giết
  rationale: Diễn đạt trực tiếp hành động lấy mạng sống, không thêm sắc thái pháp lý hay đạo đức ngoài động từ nguồn.
- source_word: αὐτόν
  choice: Sau-lơ
  rationale: Đại từ chỉ Sau-lơ trong ngữ cảnh. Dùng tên riêng giúp câu tiếng Việt rõ nghĩa và tự nhiên, không thay đổi đối tượng quy chiếu.
theological_decisions:
- issue: Cách dịch οἱ Ἰουδαῖοι trong trình thuật có tính thù nghịch
  choice: những người Do Thái
  alternative: những người Giu-đê; các lãnh đạo Do Thái
  rationale: Giữ cách diễn đạt của nguyên bản thay vì tự ý giới hạn đối tượng thành giới lãnh đạo. Chú thích xác nhận rằng trong ngữ cảnh đây là nhóm chống đối Sau-lơ, không phải mọi người Do Thái không trừ một ai.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Sau-lơ” thay cho đại từ để tránh mơ hồ trong câu đứng riêng; các dấu chú thích đều được đặt ngay sau cụm từ tương ứng.
