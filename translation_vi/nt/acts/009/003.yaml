  text: ἐν δὲ τῷ πορεύεσθαι ἐγένετο αὐτὸν ἐγγίζειν τῇ Δαμασκῷ, ⸂ἐξαίφνης τε αὐτὸν περιήστραψεν⸃ φῶς ⸀ἐκ τοῦ οὐρανοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/003.yaml
  text: As he was traveling[a], it happened that he was drawing near to Damascus, and suddenly a light from heaven flashed around him.
translation:
  language: vi
  text: Khi ông đang đi đường và đến gần Đa-mách, thình lình có một luồng sáng từ trời[a] lóe lên quanh ông.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “từ bầu trời”. Từ Hy Lạp οὐρανός có thể mang nghĩa “trời” hoặc “bầu trời”; trong văn cảnh này, “trời” có lẽ nhấn mạnh nguồn gốc thần linh của ánh sáng.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν δὲ τῷ πορεύεσθαι
  choice: Khi ông đang đi đường
  rationale: Cấu trúc ἐν với động từ nguyên mẫu có mạo từ diễn tả hành động đang diễn ra đồng thời. “Khi ông đang đi đường” tự nhiên trong tiếng Việt và không diễn giải quá mức sắc thái chuyển tiếp nhẹ của δέ.
- source_word: ἐγένετο αὐτὸν ἐγγίζειν τῇ Δαμασκῷ
  choice: và đến gần Đa-mách
  rationale: Cách diễn đạt gọn, tự nhiên này chuyển cấu trúc ἐγένετο kèm đối cách và động từ nguyên mẫu sang tiếng Việt. “Đến gần” giữ đúng ý về sự tiếp cận thành phố, không hàm ý ông đã vào trong thành.
- source_word: ἐξαίφνης τε
  choice: thình lình
  rationale: “Thình lình” diễn tả rõ sự xảy đến bất ngờ; quan hệ nối tiếp do τε biểu thị đã được thể hiện tự nhiên qua cấu trúc toàn câu.
- source_word: περιήστραψεν
  choice: lóe lên bao quanh ông
  rationale: Cụm này giữ cả tính đột ngột của ánh sáng lẫn ý ánh sáng chiếu vòng quanh nhân vật.
- source_word: φῶς
  choice: một luồng sáng
  rationale: “Một luồng sáng” là cách nói tự nhiên trong tiếng Việt cho một ánh sáng xuất hiện như một hiện tượng cụ thể, đồng thời không thêm mô tả về bản chất hay cường độ.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: từ trời
  rationale: “Từ trời” vừa tự nhiên vừa bảo toàn sức nặng về nguồn gốc thiên thượng trong bối cảnh mặc khải; từ Hy Lạp cũng có thể chỉ bầu trời nên phương án đó được ghi ở chú thích.
theological_decisions:
- issue: Nghĩa của οὐρανός trong bối cảnh mặc khải
  choice: từ trời
  alternative: từ bầu trời
  rationale: Bối cảnh cuộc gặp gỡ mang tính thần hiện khiến “trời” phù hợp hơn, nhưng chú thích vẫn bảo lưu khả năng từ ngữ chỉ bầu trời mà không áp đặt cách giải thích thần học vào chính câu văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đa-mách” theo dạng tên quen thuộc trong tiếng Việt. Đặt dấu chú thích ngay sau “trời”, là từ mà chú thích giải nghĩa.
