revisions:
- from: Khi ông đang đi đường và đến gần Đa-mách, thình lình một luồng sáng từ trời[a] lóe lên bao quanh ông.
  to: Khi ông đang đi đường và đến gần Đa-mách, thình lình có một luồng sáng từ trời[a] lóe lên quanh ông.
  rationale: Bản sửa giữ nguyên nghĩa của câu, đồng thời dùng “thình lình có” để biểu thị rõ hơn sự việc đột ngột được giới thiệu bởi ἐγένετο và ἐξαίφνης. Chú thích được giữ nguyên vì đúng vị trí neo và trình bày công bằng phương án từ vựng thay thế.
