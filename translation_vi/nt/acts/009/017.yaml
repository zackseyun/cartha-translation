  - severity: low
    issue: '"được đầy dẫy Đức Thánh Linh"'
    rationale: Cách nói này có tính truyền thống nhưng "được đầy Đức Thánh Linh" hiện đại, gọn và sát với cách diễn đạt bị động "được đầy [bởi]" của tiếng Hy Lạp hơn.
