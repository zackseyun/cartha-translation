id: ACT.9.17
reference: Acts 9:17
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀπῆλθεν δὲ Ἁνανίας καὶ εἰσῆλθεν εἰς τὴν οἰκίαν, καὶ ἐπιθεὶς ἐπ’ αὐτὸν τὰς χεῖρας εἶπεν· Σαοὺλ ἀδελφέ, ὁ κύριος ἀπέσταλκέν με, ⸀Ἰησοῦς ὁ ὀφθείς σοι ἐν τῇ ὁδῷ ᾗ ἤρχου, ὅπως ἀναβλέψῃς καὶ πλησθῇς πνεύματος ἁγίου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/017.yaml
  text: So Ananias went and entered the house, and laying his hands on him he said, “Brother Saul, the Lord has sent me—Jesus, the one who appeared to you on the road by which you were coming—so that you may regain your sight and be filled with the Holy Spirit.”
translation:
  language: vi
  text: 'Vậy A-na-nia đi vào nhà. Ông đặt tay trên Sau-lơ rồi nói: “Anh Sau-lơ, Chúa—Đức Giê-su, Đấng đã hiện ra với anh trên con đường anh đang đi[a]—đã sai tôi đến để anh được sáng mắt lại[b] và được đầy Đức Thánh Linh.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “trên đường anh đi.”'
    reason: lexical_alternative
  - marker: b
    text: 'Hoặc: “nhìn thấy lại.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπῆλθεν δὲ
  choice: Vậy ... đi
  rationale: δέ đánh dấu bước tiến của câu chuyện và trong ngữ cảnh này có sắc thái tiếp nối hệ quả; “Vậy” diễn đạt tự nhiên, còn ἀπῆλθεν được chuyển đơn giản là “đi”.
- source_word: εἰσῆλθεν εἰς τὴν οἰκίαν
  choice: vào trong nhà
  rationale: Cách nói tự nhiên trong tiếng Việt, giữ rõ hành động đi vào căn nhà đã được nhắc đến trong ngữ cảnh.
- source_word: ἐπιθεὶς ἐπ’ αὐτὸν τὰς χεῖρας
  choice: đặt tay trên Sau-lơ
  rationale: Giữ hành động thể chất và lối diễn đạt quen thuộc của Kinh Thánh; dùng tên riêng thay đại từ để tránh mơ hồ trong tiếng Việt.
- source_word: Σαοὺλ ἀδελφέ
  choice: Anh Sau-lơ
  rationale: “Anh” là cách xưng hô tự nhiên, trang trọng vừa phải, diễn đạt sự gần gũi và nhìn nhận Sau-lơ như người anh em mà không buộc phải thêm danh từ “người anh em” thiếu tự nhiên.
- source_word: ὁ κύριος ἀπέσταλκέν με
  choice: Chúa đã sai tôi đến
  rationale: “Đã sai” thể hiện hành động đã xảy ra với hiệu lực hiện tại; thêm “đến” là bổ sung theo ngữ cảnh đích đến, giúp câu tiếng Việt trọn nghĩa và tự nhiên.
- source_word: Ἰησοῦς ὁ ὀφθείς σοι
  choice: chính là Đức Giê-su, Đấng đã hiện ra với anh
  rationale: Giữ cấu trúc đồng vị trong bản Hy Lạp, trong đó “Đức Giê-su” xác định “Chúa”; “chính là” làm quan hệ này rõ và tự nhiên mà không đổi trật tự thần học của câu.
- source_word: ἐν τῇ ὁδῷ ᾗ ἤρχου
  choice: trên con đường anh đang đi
  rationale: ὁδός là con đường theo nghĩa đen; thì chưa hoàn thành của ἤρχου được phản ánh bằng “đang đi”, giữ sắc thái hành động đang diễn tiến mà không ép hướng chuyển động thành “đến”.
- source_word: ὅπως
  choice: để
  rationale: Diễn đạt mục đích ngắn gọn và tự nhiên trong tiếng Việt.
- source_word: ἀναβλέψῃς
  choice: anh được sáng mắt lại
  rationale: Trong bối cảnh chữa lành, động từ nói đến việc phục hồi thị lực; “sáng mắt lại” là cách nói tự nhiên và rõ nghĩa.
- source_word: πλησθῇς πνεύματος ἁγίου
  choice: được đầy dẫy Đức Thánh Linh
  rationale: Dạng bị động được giữ bằng “được”; “đầy dẫy” diễn đạt sự tràn đầy, còn “Đức Thánh Linh” là danh xưng trang trọng, dễ hiểu trong tiếng Việt.
theological_decisions:
- issue: Quan hệ giữa “Chúa” và “Đức Giê-su” trong cấu trúc ὁ κύριος ... Ἰησοῦς ὁ ὀφθείς σοι
  choice: 'Giữ “Đức Giê-su” làm thành phần đồng vị xác định “Chúa”: “Chúa đã sai tôi đến—chính là Đức Giê-su...”'
  alternative: Sắp lại thành “Chúa là Đức Giê-su, Đấng... đã sai tôi đến” hoặc “Chúa Giê-su... đã sai tôi đến”
  rationale: Trật tự Hy Lạp tạo một sự ngắt để nêu tên Đấng sai là Đức Giê-su. Bản dịch giữ sự căng và cấu trúc đồng vị ấy thay vì âm thầm làm phẳng thành danh xưng ghép “Chúa Giê-su”.
- issue: πνεύματος ἁγίου không có mạo từ Hy Lạp
  choice: Đức Thánh Linh
  alternative: thánh linh
  rationale: Trong văn mạch Công Vụ, cụm từ chỉ Thánh Linh của Đức Chúa Trời; việc không có mạo từ không đòi hỏi nghĩa bất định. Danh xưng tiếng Việt có “Đức” phù hợp văn phong trang trọng và chỉ ngôi vị, nhưng không thêm nội dung giáo phái.
- issue: Sắc thái của ἀδελφέ khi A-na-nia gọi Sau-lơ
  choice: Anh Sau-lơ
  alternative: Anh em Sau-lơ; người anh em Sau-lơ
  rationale: Cách xưng “Anh” giữ sự tiếp nhận và thân tình của lời gọi, đồng thời tự nhiên trong tiếng Việt. Văn bản không buộc phải quyết định sắc thái chỉ là đồng bào dân tộc hay hoàn toàn là tư cách thành viên cộng đồng Cơ Đốc, nên bản dịch không giải thích quá mức.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Giữ cấu trúc đồng vị có dấu gạch ngang để phản ánh cú pháp Hy Lạp và sự nhấn mạnh rằng Đức Giê-su chính là “Chúa” vừa được nói đến. Tên riêng được phiên âm theo cách quen dùng trong Kinh Thánh tiếng Việt.
