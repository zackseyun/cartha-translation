id: ACT.9.33
reference: Acts 9:33
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εὗρεν δὲ ἐκεῖ ἄνθρωπόν τινα ⸂ὀνόματι Αἰνέαν⸃ ἐξ ἐτῶν ὀκτὼ κατακείμενον ἐπὶ ⸀κραβάττου, ὃς ἦν παραλελυμένος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/033.yaml
  text: And there he found a certain man named Aeneas[a], bedridden for eight years, who was paralyzed.
translation:
  language: vi
  text: Tại đó, ông gặp một người tên là Ê-nê, đã nằm trên một tấm đệm[a] suốt tám năm; người ấy bị bại liệt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “một chiếc giường nhỏ” hay “một tấm phản.”'
    reason: Từ κράβαττος có thể chỉ một loại giường, phản hoặc đệm đơn sơ; tiếng Việt không có một từ duy nhất bao quát chính xác mọi sắc thái.
lexical_decisions:
- source_word: εὗρεν δὲ ἐκεῖ
  choice: Tại đó, ông gặp
  rationale: Diễn đạt tự nhiên mạch kể tiếp diễn của δέ, địa điểm ἐκεῖ và việc Phi-e-rơ gặp người này; “gặp” phù hợp văn cảnh hơn cách dịch máy móc “tìm thấy”.
- source_word: ἄνθρωπόν τινα
  choice: một người
  rationale: τις giới thiệu một nhân vật cụ thể nhưng trước đó chưa được nhắc đến; tiếng Việt hiện đại không cần thêm “nọ” hay “nào đó”.
- source_word: ὀνόματι Αἰνέαν
  choice: tên là Ê-nê
  rationale: Cấu trúc ὀνόματι với tên riêng được chuyển sang thành ngữ tiếng Việt tự nhiên; Αἰνέας được phiên âm là “Ê-nê”.
- source_word: ἐξ ἐτῶν ὀκτὼ
  choice: suốt tám năm
  rationale: Cụm này chỉ khoảng thời gian kéo dài; “suốt” làm rõ tính liên tục mà không thêm ý ngoài nguyên văn.
- source_word: κατακείμενον ἐπὶ κραβάττου
  choice: đã nằm trên một tấm đệm
  rationale: 'Giữ hình ảnh cụ thể của nguyên văn: người ấy nằm trên một loại đệm hoặc giường đơn sơ, thay vì khái quát hóa hoàn toàn thành “nằm liệt giường”.'
- source_word: ὃς ἦν παραλελυμένος
  choice: vì bị bại liệt
  rationale: Nguyên văn mô tả tình trạng bại liệt của người ấy. Trong tiếng Việt, nối bằng “vì” diễn đạt tự nhiên quan hệ hiển nhiên giữa tình trạng này và việc nằm lâu trên đệm, không hàm ý nguyên nhân bệnh lý xa hơn.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện trang trọng vừa phải, rõ ràng với độc giả hiện đại. Câu giữ hình ảnh cụ thể của tấm đệm và tránh thuật ngữ y khoa quá chuyên môn.
