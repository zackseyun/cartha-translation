revisions:
- from: Tại đó, ông gặp một người tên là Ê-nê[a], đã nằm trên một tấm đệm suốt tám năm vì bị bại liệt.
  to: Tại đó, ông gặp một người tên là Ê-nê, đã nằm trên một tấm đệm[a] suốt tám năm; người ấy bị bại liệt.
  rationale: Sửa “vì” thành một mệnh đề mô tả độc lập để bảo toàn quan hệ cú pháp của nguyên văn, đồng thời dời mốc chú thích đến “tấm đệm”, từ tương ứng với κράβαττος. Không thay đổi ý nghĩa của câu.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T09:17:12Z'
review_pass:
  verdict: revise
  source_fidelity: 'Cần sửa liên từ “vì”. Mệnh đề ὃς ἦν παραλελυμένος đơn thuần bổ sung tình trạng của Ê-nê (“người ấy bị bại liệt”), không nêu đây là nguyên nhân của việc nằm trên đệm. Bản sửa giữ đủ các yếu tố: gặp tại đó, một người, tên Ê-nê, nằm trên κράβαττος suốt tám năm, và bị bại liệt.'
  naturalness: “Tại đó, ông gặp...” tự nhiên trong văn kể chuyện. Dùng dấu chấm phẩy rồi “người ấy bị bại liệt” giúp tiếng Việt sáng rõ, tránh quan hệ nhân quả không có trong nguyên văn.
  terminology: “Bại liệt” là cách gọi rõ ràng và phù hợp với παραλελυμένος. “Tấm đệm” là một cách dịch an toàn cho κράβαττος; chú thích được chuyển đến đúng từ mà nó giải thích và nêu các khả năng gần nghĩa.
  issues:
  - severity: medium
    issue: “vì bị bại liệt” thêm quan hệ nguyên nhân.
    rationale: ὃς ἦν παραλελυμένος là mệnh đề quan hệ mô tả, không phải mệnh đề chỉ nguyên nhân. Dù sự liên hệ thực tế có thể dễ hiểu, “vì” khiến bản dịch khẳng định quan hệ cú pháp/nhân quả mà tiếng Hy Lạp không nêu.
  - severity: low
    issue: Ký hiệu chú thích hiện đặt sau tên Ê-nê thay vì sau từ dịch κράβαττος.
    rationale: Chú thích giải thích κράβαττος, tức “tấm đệm”, nên cần đặt mốc tại từ này để neo chú thích chính xác.
  revised_text: Tại đó, ông gặp một người tên là Ê-nê, đã nằm trên một tấm đệm[a] suốt tám năm; người ấy bị bại liệt.
