source:
  edition: SBLGNT
  text: καὶ εἶδεν ⸂ἄνδρα ἐν ὁράματι Ἁνανίαν ὀνόματι⸃ εἰσελθόντα καὶ ἐπιθέντα αὐτῷ ⸀χεῖρας ὅπως ἀναβλέψῃ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/012.yaml
  text: and he has seen in a vision a man named Ananias coming in and laying his hands on him so that he might regain his sight[a][b].
translation:
  language: vi
  text: và ông đã thấy trong một khải tượng một người đàn ông tên là A-na-nia đi vào và đặt tay trên ông, để ông có thể nhìn thấy lại.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “được sáng mắt lại.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶδεν
  choice: đã thấy
  rationale: Động từ ở thì aorist chỉ việc Sau-lơ đã thấy trong khải tượng; tiếng Việt tự nhiên dùng “đã thấy” mà không cần áp đặt sắc thái hiện tại hoàn thành của tiếng Anh.
- source_word: ἐν ὁράματι
  choice: trong một khải tượng
  rationale: Diễn đạt trực tiếp phương cách hoặc phạm vi trong đó Sau-lơ thấy sự việc.
- source_word: ἄνδρα ... Ἁνανίαν ὀνόματι
  choice: một người tên là A-na-nia
  rationale: Cách nói tự nhiên trong tiếng Việt hiện đại, giữ rõ người được nói đến là một người nam mang tên A-na-nia.
- source_word: εἰσελθόντα
  choice: bước vào
  rationale: Phân từ mô tả hành động A-na-nia đi vào trong nội dung khải tượng; “bước vào” tự nhiên và không nhấn quá mức thứ tự thời gian.
- source_word: ἐπιθέντα αὐτῷ χεῖρας
  choice: đặt tay trên người ấy
  rationale: Giữ hành động đặt tay trong nguyên văn mà không thêm ý nghĩa bí tích, phong chức hoặc phương thức chữa lành.
- source_word: ὅπως
  choice: để
  rationale: Giới thiệu mục đích một cách gọn và tự nhiên trong tiếng Việt.
- source_word: ἀναβλέψῃ
  choice: được sáng mắt lại
  rationale: Trong bối cảnh Sau-lơ bị mù, động từ có nghĩa phục hồi thị lực hoặc nhìn thấy lại; cách dịch này rõ nghĩa và quen thuộc trong văn phong Kinh Thánh tiếng Việt.
theological_decisions:
- issue: Ý nghĩa thần học của hành động đặt tay
  choice: đặt tay trên người ấy
  alternative: đặt hai tay lên người ấy
  rationale: Nguyên văn nêu hành động thể lý nhưng không xác định tại đây đó là nghi thức bí tích, phong chức hay một kỹ thuật chữa lành; bản dịch giữ nguyên độ mở thần học.
- issue: Tác nhân hàm ẩn trong việc phục hồi thị lực
  choice: được sáng mắt lại
  alternative: có thể nhìn thấy lại
  rationale: Thể diễn đạt tiếng Việt tự nhiên cho sự phục hồi thị lực nhưng không chỉ rõ A-na-nia tự mình chữa lành hay xác định cơ chế thần học của việc chữa lành.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “người ấy” cho đại từ αὐτός nhằm tránh lặp tên trong một câu trích lời đang tiếp diễn, đồng thời hạn chế sự mơ hồ hơn đại từ “ông”. Tên riêng được phiên âm theo lối quen thuộc A-na-nia.
