    issue: “được sáng mắt lại” không giữ sát thể chủ động của ἀναβλέψῃ.
    rationale: Động từ là chủ động, nghĩa là người ấy có thể thấy/nhìn thấy lại. Cách diễn đạt bị động không sai ý trong ngữ cảnh, nhưng làm mờ chủ thể ngữ pháp của mệnh đề mục đích.
  - severity: low
    issue: Lặp lại “người ấy” gây mơ hồ tham chiếu.
    rationale: Trong cùng câu, “người ấy” vừa chỉ người thấy khải tượng vừa xuất hiện sau tên A-na-nia; dùng “ông” cho Sau-lơ sau khi tên A-na-nia được xác định giúp người đọc theo dõi hành động dễ hơn.
  revised_text: và ông đã thấy trong một khải tượng một người đàn ông tên là A-na-nia đi vào và đặt tay trên ông, để ông có thể nhìn thấy lại.[a]
