  text: Ἐγένετο δὲ Πέτρον διερχόμενον διὰ πάντων κατελθεῖν καὶ πρὸς τοὺς ἁγίους τοὺς κατοικοῦντας Λύδδα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/032.yaml
  text: As Peter was passing through all of them, he also went down to the saints living in Lydda.
translation:
  language: vi
  text: Trong khi Phi-e-rơ đang đi qua khắp nơi, ông cũng xuống gặp các thánh đồ sống tại Lít-đa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: Khi ấy
  rationale: Diễn đạt tự nhiên công thức chuyển cảnh trong lời kể; δέ nối sang diễn biến mới mà không nhất thiết mang nghĩa đối lập.
- source_word: διερχόμενον διὰ πάντων
  choice: đi khắp các vùng
  rationale: Đại từ πάντων không nêu rõ danh từ quy chiếu. Trong ngữ cảnh hành trình, cách dịch này giữ ý Phi-e-rơ đi qua khắp nơi mà không hiểu thành đi xuyên qua mọi người.
- source_word: κατελθεῖν καὶ πρὸς
  choice: cũng xuống thăm
  rationale: κατελθεῖν giữ hướng 'xuống'; πρὸς chỉ việc đến với nhóm người, và 'thăm' tạo câu tiếng Việt tự nhiên trong ngữ cảnh mục vụ.
- source_word: τοὺς ἁγίους
  choice: các thánh đồ
  rationale: Thuật ngữ Tân Ước chỉ cộng đồng những người thuộc về Đức Chúa Trời; 'thánh đồ' trang trọng, quen thuộc và không hàm ý họ đã được phong thánh.
- source_word: Λύδδα
  choice: Lít-đa
  rationale: Phiên âm địa danh Hy Lạp Λύδδα theo lối đọc tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Ý nghĩa của τοὺς ἁγίους
  choice: các thánh đồ
  alternative: những người thánh / các tín hữu
  rationale: Giữ cách gọi cộng đồng Cơ Đốc nhân của bản văn, không thu hẹp nghĩa vào một cơ chế phong thánh hoặc chỉ diễn giải thành tư cách tín hữu.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng và dễ hiểu. Câu được tái cấu trúc cho tự nhiên trong tiếng Việt nhưng vẫn giữ chuyển cảnh, phạm vi hành trình và động từ chỉ hướng 'xuống'.
