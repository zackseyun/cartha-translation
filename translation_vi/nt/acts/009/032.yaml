- from: Khi ấy, Phi-e-rơ đi khắp các vùng và cũng xuống thăm các thánh đồ sống tại Lít-đa.
  to: Trong khi Phi-e-rơ đang đi qua khắp nơi, ông cũng xuống gặp các thánh đồ sống tại Lít-đa.
  rationale: Điều chỉnh để phản ánh rõ phân từ hiện tại διερχόμενον và tránh thêm sắc thái không cần thiết của “thăm”. “Khắp nơi” duy trì tính không xác định của πάντων trong khi vẫn tự nhiên trong tiếng Việt; không cần chú thích vì văn mạch cho thấy đây là các địa điểm/khu vực ông đi qua.
