id: ACT.9.21
reference: Acts 9:21
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐξίσταντο δὲ πάντες οἱ ἀκούοντες καὶ ἔλεγον· Οὐχ οὗτός ἐστιν ὁ πορθήσας ⸀ἐν Ἰερουσαλὴμ τοὺς ἐπικαλουμένους τὸ ὄνομα τοῦτο, καὶ ὧδε εἰς τοῦτο ἐληλύθει ἵνα δεδεμένους αὐτοὺς ἀγάγῃ ἐπὶ τοὺς ἀρχιερεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/021.yaml
  text: And all who heard him were amazed and were saying[a], “Isn’t this the man who devastated in Jerusalem those who call on this name? And had he not come here for this purpose[b], that he might bring them bound to the chief priests?”
translation:
  language: vi
  text: 'Tất cả những người nghe ông đều kinh ngạc và nói: “Chẳng phải người này chính là kẻ đã tàn hại tại Giê-ru-sa-lem những người kêu cầu danh này[a] sao? Chẳng phải ông ta đã đến đây chính vì mục đích ấy—để đem họ đang bị trói đến các thượng tế[b] sao?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Danh này” chỉ danh Giê-su; “kêu cầu danh” là cách nói Kinh Thánh về việc cầu khẩn và tuyên xưng danh ấy.
    reason: lexical_alternative
  - marker: b
    text: “Các thượng tế” chỉ giới lãnh đạo tư tế, chứ không có nghĩa là cùng lúc có nhiều người giữ chức thượng tế tối cao.
    reason: historical_clarification
lexical_decisions:
- source_word: ἐξίσταντο
  choice: đều kinh ngạc
  rationale: Diễn đạt trạng thái sửng sốt kéo dài của những người nghe bằng tiếng Việt tự nhiên, trang trọng.
- source_word: πορθήσας
  choice: đã tàn phá
  rationale: Giữ sắc thái mạnh của động từ, vốn mô tả việc gây tổn hại dữ dội, mạnh hơn từ chung chung “bắt bớ”.
- source_word: τοὺς ἐπικαλουμένους τὸ ὄνομα τοῦτο
  choice: những người kêu cầu danh này
  rationale: Giữ thành ngữ Kinh Thánh về việc cầu khẩn và công khai gắn bó với danh được nói đến, không giải nghĩa quá mức trong chính văn.
- source_word: εἰς τοῦτο
  choice: chính vì mục đích ấy
  rationale: Chuyển đạt rõ ý mục đích của thành ngữ Hy Lạp và giữ lực nhấn mạnh trong câu hỏi.
- source_word: ἐληλύθει
  choice: đã đến
  rationale: Trong tiếng Việt, “đã đến” tự nhiên diễn đạt hành động đến trước thời điểm những người nghe đang bàn luận.
- source_word: δεδεμένους αὐτοὺς ἀγάγῃ
  choice: trói họ lại và giải
  rationale: Diễn đạt trạng thái bị trói cùng hành động áp giải người bị bắt đến nhà chức trách.
- source_word: ἐπὶ τοὺς ἀρχιερεῖς
  choice: đến các thượng tế
  rationale: Giữ hướng chuyển giao họ cho giới chức tư tế; “các thượng tế” phù hợp với số nhiều và bối cảnh lịch sử.
theological_decisions:
- issue: Có nên mở rộng “danh này” thành “danh Chúa Giê-su” trong chính văn hay không
  choice: Giữ “danh này”
  alternative: danh Chúa Giê-su
  rationale: Nguyên văn để đối tượng quy chiếu ở dạng hàm ẩn; ngữ cảnh cho thấy đó là danh Chúa Giê-su. Giữ nguyên cách nói bảo tồn sức gợi và tính tu từ.
- issue: Mức độ mạnh của πορθήσας khi mô tả hành động trước đây của Sau-lơ
  choice: tàn phá
  alternative: bắt bớ
  rationale: “Tàn phá” phản ánh động từ mạnh trong nguyên văn và tránh làm nhẹ mức độ bạo lực được mô tả.
- issue: Hình thức của mệnh đề thứ hai
  choice: Giữ dưới dạng câu hỏi tu từ
  alternative: dịch như một lời khẳng định rằng ông ta đã đến vì mục đích ấy
  rationale: Từ phủ định Οὐχ ở đầu lời nói chi phối tự nhiên cả chuỗi câu hỏi, và dấu hỏi của văn bản Hy Lạp khép lại toàn bộ phát ngôn; cách dịch này giữ sự liên kết tu từ mà không loại bỏ nét căng thẳng cú pháp.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “ông ta” trong lời của đám đông để phản ánh khoảng cách và sự kinh ngạc của họ; dùng “giải đến” cho sắc thái áp giải người bị trói tới nhà chức trách.
