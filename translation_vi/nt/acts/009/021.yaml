revisions:
- from: 'Tất cả những người nghe đều kinh ngạc và nói: “Chẳng phải người này chính là kẻ đã tàn phá tại Giê-ru-sa-lem những người kêu cầu danh này[a] sao? Chẳng phải ông ta đã đến đây chính vì mục đích ấy—để trói họ lại và giải đến các thượng tế[b] sao?”'
  to: 'Tất cả những người nghe ông đều kinh ngạc và nói: “Chẳng phải người này chính là kẻ đã tàn hại tại Giê-ru-sa-lem những người kêu cầu danh này[a] sao? Chẳng phải ông ta đã đến đây chính vì mục đích ấy—để đem họ đang bị trói đến các thượng tế[b] sao?”'
  rationale: Bản sửa thay đổi tối thiểu để phản ánh chính xác giá trị trạng thái của δεδεμένους và dùng cách kết hợp từ tự nhiên hơn trong tiếng Việt. Các neo chú thích vẫn gắn đúng với “danh này” và “các thượng tế”; không thêm tên Giê-su vào chính văn hoặc áp đặt diễn giải giáo phái.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T09:18:37Z'
review_pass:
  verdict: revise
  source_fidelity: Cần chỉnh cụm “trói họ lại và giải” vì δεδεμένους là phân từ hoàn thành bị động, mô tả những người đã ở trong tình trạng bị trói khi bị đem đi, không nhất thiết nhấn mạnh hai hành động tuần tự là trói rồi áp giải. Bản sửa giữ câu hỏi tu từ, lực mạnh của πορθήσας, “danh này,” và số nhiều “các thượng tế.”
  naturalness: “Tất cả những người nghe ông đều” và “đem họ đang bị trói đến” là tiếng Việt tiêu chuẩn, tự nhiên, đồng thời rõ quan hệ cú pháp hơn “trói họ lại và giải đến.” “Tàn hại” hợp với đối tượng là con người hơn “tàn phá những người.”
  terminology: Giữ “kêu cầu danh này” như một thành ngữ Kinh Thánh; chú thích chỉ rõ quy chiếu là danh Giê-su mà không mở rộng chính văn. Giữ “các thượng tế” cho ἀρχιερεῖς, tức giới chức tư tế cấp cao, không phải nhiều đương kim thượng tế tối cao.
  issues:
  - severity: medium
    issue: “trói họ lại và giải đến” chuyển δεδεμένους thành một hành động chủ động, tuần tự.
    rationale: δεδεμένους là “những người đang/đã bị trói”; cần diễn đạt tình trạng bị trói của họ khi được đem đến các thượng tế.
  - severity: low
    issue: “tàn phá ... những người” kém tự nhiên trong tiếng Việt.
    rationale: Động từ πορθήσας rất mạnh, nhưng nói về con người thì “tàn hại” tự nhiên hơn mà vẫn không làm nhẹ bạo lực.
