source:
  edition: SBLGNT
  text: Ἐν Ἰόππῃ δέ τις ἦν μαθήτρια ὀνόματι Ταβιθά, ἣ διερμηνευομένη λέγεται Δορκάς· αὕτη ἦν πλήρης ⸂ἔργων ἀγαθῶν⸃ καὶ ἐλεημοσυνῶν ὧν ἐποίει.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/036.yaml
  text: In Joppa there was a disciple named Tabitha[a], which translated is called Dorcas. She was full of good works and acts of mercy that she was doing.
translation:
  language: vi
  text: Tại Giốp-bê có một môn đồ nữ tên là Ta-bi-tha[a]; tên này, dịch ra, là Đô-ca. Bà đầy dẫy việc lành và những việc giúp đỡ người nghèo mà bà vẫn thường làm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Đô-ca là tên Hy Lạp tương ứng với Ta-bi-tha; tên này có nghĩa là “linh dương cái.”
    reason: Giải thích mối liên hệ giữa hai tên và bảo tồn nghĩa từ nguyên mà không thay tên riêng trong chính văn.
lexical_decisions:
- source_word: μαθήτρια
  choice: nữ môn đồ
  rationale: Danh từ Hy Lạp ở giống cái và chỉ rõ đây là một phụ nữ làm môn đồ; tiếng Việt cần thêm “nữ” để truyền đạt nét nghĩa này một cách tự nhiên.
- source_word: Ἐν Ἰόππῃ
  choice: Tại Giốp-bê
  rationale: Cách diễn đạt địa điểm tự nhiên trong tiếng Việt; địa danh được phiên âm theo lối quen thuộc.
- source_word: ὀνόματι Ταβιθά
  choice: tên là Ta-bi-tha
  rationale: Diễn đạt tự nhiên thành ngữ chỉ tên gọi và phiên âm tên riêng.
- source_word: ἣ διερμηνευομένη λέγεται Δορκάς
  choice: dịch sang tiếng Hy Lạp là Đô-ca
  rationale: Nêu rõ Đô-ca là tên tương ứng trong tiếng Hy Lạp, thay vì chỉ là lời giải nghĩa; ngôn ngữ đích được làm rõ theo ngữ cảnh.
- source_word: πλήρης ἔργων ἀγαθῶν
  choice: làm rất nhiều việc lành
  rationale: Truyền đạt thành ngữ “đầy dẫy những việc lành” bằng tiếng Việt hiện đại, tự nhiên, nhấn mạnh sự dồi dào trong hành động.
- source_word: ἐλεημοσυνῶν ὧν ἐποίει
  choice: thường xuyên giúp đỡ người nghèo
  rationale: ἐλεημοσύνη chỉ việc bố thí hay trợ giúp người túng thiếu, còn thì vị imperfect ἐποίει cho thấy hành động có tính thường xuyên.
- source_word: δέ
  choice: không dịch thành một từ riêng
  rationale: δέ đánh dấu bước phát triển nhẹ trong mạch kể; tiếng Việt không cần thêm từ nối ở đầu câu trong trường hợp này.
theological_decisions:
- issue: Nét giống cái của μαθήτρια
  choice: nữ môn đồ
  alternative: môn đồ
  rationale: Khác với tiếng Anh, “môn đồ” trong tiếng Việt không tự cho biết giới tính; thêm “nữ” bảo tồn thông tin ngữ pháp đáng chú ý của nguyên văn mà không hàm ý địa vị riêng.
- issue: Phạm vi nghĩa của ἐλεημοσυνῶν
  choice: giúp đỡ người nghèo
  alternative: làm việc nhân ái; bố thí
  rationale: Cách dịch này giữ trọng tâm là sự trợ giúp thiết thực dành cho người thiếu thốn, tránh giới hạn vào tiền bạc nhưng cũng không làm nghĩa trở nên quá chung.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “bà” để quy chiếu lịch sự đến một phụ nữ trưởng thành. Cụm “thường xuyên” thể hiện sắc thái tiếp diễn hoặc thói quen của thì imperfect.
