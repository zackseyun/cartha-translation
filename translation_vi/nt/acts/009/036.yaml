revisions:
- from: Tại Giốp-bê có một nữ môn đồ tên là Ta-bi-tha[a], dịch sang tiếng Hy Lạp là Đô-ca. Bà làm rất nhiều việc lành và thường xuyên giúp đỡ người nghèo.
  to: Tại Giốp-bê có một môn đồ nữ tên là Ta-bi-tha[a]; tên này, dịch ra, là Đô-ca. Bà đầy dẫy việc lành và những việc giúp đỡ người nghèo mà bà vẫn thường làm.
