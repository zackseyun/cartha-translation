id: ACT.9.35
reference: Acts 9:35
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ εἶδαν αὐτὸν πάντες οἱ κατοικοῦντες Λύδδα καὶ τὸν ⸀Σαρῶνα, οἵτινες ἐπέστρεψαν ἐπὶ τὸν κύριον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/035.yaml
  text: And all those living in Lydda and Sharon saw him[b][a], and they turned to the Lord.
translation:
  language: vi
  text: Tất cả những người sống tại Ly-đa và vùng Sa-rôn[a] đều thấy ông, và họ quay về với Chúa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Sa-rôn” hoặc “đồng bằng Sa-rôn.”'
    reason: lexical_alternative
  - marker: b
    text: “Quay về với Chúa” cũng có thể dịch là “hướng về Chúa” hoặc “trở lại với Chúa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶδαν
  choice: thấy
  rationale: Động từ ὁράω ở đây diễn tả việc cư dân nhìn thấy Ê-nê sau khi ông được chữa lành; “thấy” là cách dịch trực tiếp và tự nhiên.
- source_word: πάντες οἱ κατοικοῦντες
  choice: tất cả những người sống tại
  rationale: Phân từ có mạo từ κατοικοῦντες được dùng như danh từ, chỉ toàn thể những người đang cư ngụ tại các địa danh được nêu.
- source_word: Λύδδα
  choice: Ly-đa
  rationale: Phiên âm địa danh Hy Lạp theo cách đọc rõ ràng, quen thuộc trong tiếng Việt.
- source_word: τὸν Σαρῶνα
  choice: vùng Sa-rôn
  rationale: Σαρών chỉ khu vực hoặc đồng bằng Sa-rôn. Thêm “vùng” giúp câu tiếng Việt tự nhiên mà không giới hạn nghĩa cụ thể thành “đồng bằng” trong chính văn.
- source_word: οἵτινες
  choice: và họ
  rationale: Đại từ quan hệ này nối những người vừa được nhắc đến với hành động tiếp theo. Cấu trúc “và họ” thể hiện diễn tiến kể chuyện tự nhiên trong tiếng Việt.
- source_word: ἐπέστρεψαν ἐπὶ τὸν κύριον
  choice: quay về với Chúa
  rationale: Cách dịch này giữ hình ảnh “quay về/hướng về” của ἐπιστρέφω và sắc thái đáp ứng bằng đức tin, nhưng không dùng thuật ngữ thần học hẹp hơn như “cải đạo”.
- source_word: κύριον
  choice: Chúa
  rationale: Giữ nguyên tước hiệu κύριος. Ngữ cảnh cho thấy tước hiệu này rất có thể chỉ Chúa Giê-su phục sinh, nhưng nguyên văn không thêm tên Giê-su.
- source_word: αὐτόν
  choice: ông
  rationale: Đại từ này chỉ Ê-nê trong ngữ cảnh trước; “ông” là đại từ tiếng Việt tự nhiên và tôn trọng, không cần lặp lại tên.
theological_decisions:
- issue: Đối tượng được gọi là “Chúa”
  choice: Chỉ dịch là “Chúa”, không thêm “Giê-su” vào chính văn.
  alternative: Chúa Giê-su
  rationale: Ngữ cảnh Công Vụ 9 hướng mạnh đến Chúa Giê-su, nhưng nguyên văn chỉ có τὸν κύριον. Giữ tước hiệu đơn thuần bảo toàn cách diễn đạt của nguồn.
- issue: Sắc thái của ἐπέστρεψαν
  choice: quay về với Chúa
  alternative: hướng về Chúa; trở lại với Chúa; cải đạo theo Chúa
  rationale: Động từ có thể diễn tả sự quay hướng, trở lại, hoặc trong ngữ cảnh này là sự đáp ứng bằng sự ăn năn và đức tin. Bản dịch không nên mặc nhiên khẳng định họ từng thuộc về Chúa trước đó hoặc áp đặt thuật ngữ thần học hệ thống.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “vùng Sa-rôn” để địa danh tự nhiên trong tiếng Việt; dùng “quay về với Chúa” nhằm giữ hình ảnh và độ mở nghĩa của nguyên văn.
