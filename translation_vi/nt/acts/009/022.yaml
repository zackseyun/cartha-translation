  text: Σαῦλος δὲ μᾶλλον ἐνεδυναμοῦτο καὶ ⸀συνέχυννεν ⸀τοὺς Ἰουδαίους τοὺς κατοικοῦντας ἐν Δαμασκῷ, συμβιβάζων ὅτι οὗτός ἐστιν ὁ χριστός.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/022.yaml
  text: But Saul kept gaining strength all the more and was confounding the Jews living in Damascus[a], proving that this one is the Messiah.
translation:
  language: vi
  text: Nhưng Sau-lơ ngày càng mạnh mẽ hơn và làm cho những người Do Thái sống tại Đa-mách bối rối qua việc chứng minh rằng người này là Đấng Mê-si-a.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “Đấng Christ.” Tước hiệu Hy Lạp Χριστός có nghĩa là “Đấng được xức dầu”; ở đây dịch là “Đấng Mê-si-a” để giữ rõ bối cảnh niềm trông đợi của người Do Thái.
    reason: alternative_reading
lexical_decisions:
- source_word: μᾶλλον ἐνεδυναμοῦτο
  choice: càng được thêm sức
  rationale: Diễn đạt tiến trình tiếp diễn của động từ ở thì chưa hoàn thành và giữ dạng trung động/bị động, không xác định tường minh nguồn ban sức.
- source_word: συνέχυννεν
  choice: làm cho ... phải bối rối
  rationale: Giữ sắc thái mạnh là khiến đối phương rối trí, không biết đáp lại thế nào trong bối cảnh tranh luận.
- source_word: τοὺς Ἰουδαίους τοὺς κατοικοῦντας ἐν Δαμασκῷ
  choice: những người Do Thái sống tại Đa-mách
  rationale: Xác định rõ đây là cộng đồng người Do Thái tại địa phương, tránh khái quát hóa.
- source_word: συμβιβάζων
  choice: khi chứng minh
  rationale: Trong ngữ cảnh lập luận, từ này chỉ việc kết nối các dữ kiện để đi đến và xác lập một kết luận.
- source_word: οὗτός ἐστιν ὁ χριστός
  choice: Đức Chúa Jêsus chính là Đấng Mê-si-a
  rationale: Đại từ chỉ định οὗτός quy chiếu về Jêsus trong ngữ cảnh trước; từ “chính” giữ lực nhấn mạnh, còn Χριστός được dịch theo nghĩa tước hiệu Do Thái.
theological_decisions:
- issue: Cách dịch tước hiệu ὁ χριστός
  choice: Đấng Mê-si-a
  alternative: Đấng Christ
  rationale: Có mạo từ và vị trí vị ngữ cho thấy đây là tước hiệu chỉ Đấng được xức dầu mà dân Do Thái trông đợi, chứ không được dùng như một phần tên riêng.
- issue: Chủ thể được chỉ bởi οὗτός
  choice: nêu rõ “Đức Chúa Jêsus”
  alternative: “vị này” hoặc “người này”
  rationale: Tiếng Hy Lạp giữ đại từ chỉ định với đối tượng đã rõ từ văn cảnh; tiếng Việt tự nhiên hơn khi nêu lại đối tượng, đồng thời “chính” bảo toàn nét nhấn mạnh mà không thêm một khẳng định thần học ngoài câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Sau-lơ,” “Đa-mách,” “Đức Chúa Jêsus” và “Đấng Mê-si-a” theo lối gọi quen thuộc trong tiếng Việt Cơ Đốc; câu giữ sự tiếp diễn và sức tăng tiến của nguyên văn.
