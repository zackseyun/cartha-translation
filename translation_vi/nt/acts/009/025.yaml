  text: λαβόντες δὲ ⸂οἱ μαθηταὶ αὐτοῦ⸃ νυκτὸς ⸂διὰ τοῦ τείχους καθῆκαν αὐτὸν⸃ χαλάσαντες ἐν σπυρίδι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/025.yaml
  text: But his disciples took him by night and lowered him through the wall in a large basket[a][b].
translation:
  language: vi
  text: Nhưng ban đêm, các môn đồ của ông đưa ông đi và thòng ông xuống qua tường thành trong một chiếc giỏ lớn[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể hiểu là “qua một lỗ hổng trên tường thành.” Nguyên văn Hy Lạp nói sát nghĩa là “qua tường”, có lẽ chỉ một ô cửa hoặc khoảng mở trên tường thành.
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn Hy Lạp dùng hai cách nói về việc hạ xuống, tạo lối diễn đạt sống động nhấn mạnh cách ông trốn thoát.
    reason: lexical_alternative
lexical_decisions:
- source_word: λαβόντες
  choice: đưa ông đi
  rationale: Phân từ này mở đầu hành động các môn đồ tiếp nhận và đưa Sau-lơ đi để trốn thoát; cách dịch này tự nhiên trong ngữ cảnh và không thêm ý cưỡng ép.
- source_word: δὲ
  choice: Nhưng
  rationale: δέ đánh dấu bước chuyển có sắc thái tương phản với âm mưu giết Sau-lơ ở câu trước.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: các môn đồ của ông
  rationale: Giữ rõ đại từ sở hữu αὐτοῦ và dùng thuật ngữ quen thuộc cho μαθηταί.
- source_word: νυκτός
  choice: ban đêm
  rationale: Diễn đạt tự nhiên sở hữu cách chỉ thời gian trong tiếng Việt.
- source_word: διὰ τοῦ τείχους
  choice: qua tường thành
  rationale: Giữ sát διά với sở hữu cách là sự di chuyển xuyên qua; 'tường thành' làm rõ loại tường theo bối cảnh nhưng không đưa 'cửa sổ' hay 'lỗ hổng' vào chính văn.
- source_word: καθῆκαν αὐτόν
  choice: dòng ông xuống
  rationale: καθίημι ở đây chỉ việc hạ một người từ trên cao xuống; 'dòng xuống' phù hợp với việc dùng giỏ và dây.
- source_word: χαλάσαντες
  choice: dòng
  rationale: Phân từ χαλάσαντες mô tả cách thức thực hiện việc hạ xuống. Tiếng Hy Lạp dùng hai cách nói gần nghĩa; tiếng Việt gộp trong chính văn để tránh câu vụng, đồng thời ghi chú sắc thái này.
- source_word: ἐν σπυρίδι
  choice: trong một chiếc giỏ lớn
  rationale: σπυρίς là loại giỏ đủ lớn để chứa một người; thêm 'lớn' truyền đạt sắc thái từ vựng và yêu cầu thực tế của bối cảnh.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng tự nhiên, dễ hiểu trong tiếng Việt hiện đại. Dùng “dòng ... xuống” để gợi rõ việc hạ bằng giỏ, giữ “các môn đồ của ông” theo bản văn Hy Lạp, và đặt cả hai dấu chú thích ngay trong chính văn.
