  rationale: Chỉ sửa lỗi chính tả/từ ngữ “dòng” thành “thòng”, một động từ tiếng Việt đúng nghĩa trong ngữ cảnh hạ người bằng giỏ. Các lựa chọn còn lại và hai chú thích đều có thể giữ nguyên vì phản ánh trung thành văn bản nguồn mà không thêm chi tiết vào chính văn.
