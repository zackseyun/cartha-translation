base_translation:
  language: en
  yaml_path: translation/nt/acts/009/016.yaml
  text: For I will show him how much he must suffer for my name[a].
translation:
  language: vi
  text: Vì chính Ta sẽ cho người ấy biết người ấy phải chịu khổ biết bao vì danh Ta.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “vì cớ danh Ta” hoặc “vì lợi ích của danh Ta.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγὼ
  choice: chính Ta
  rationale: Đại từ ngôi thứ nhất được nêu tường minh để nhấn mạnh chủ thể; “chính Ta” thể hiện sắc thái nhấn mạnh tự nhiên trong tiếng Việt. Viết hoa “Ta” theo lời Chúa Giê-su trong ngữ cảnh.
- source_word: γὰρ
  choice: Vì
  rationale: Giữ chức năng giải thích hoặc nêu căn cứ của câu này đối với lời ngay trước đó.
- source_word: ὑποδείξω
  choice: sẽ cho ... biết
  rationale: ὑποδείκνυμι có nghĩa cho thấy, chỉ ra, làm cho biết; cách diễn đạt này tự nhiên trong tiếng Việt và vẫn giữ tính trực tiếp của động từ.
- source_word: αὐτῷ
  choice: người ấy
  rationale: Chỉ Sau-lơ trong ngữ cảnh; “người ấy” trang trọng và tự nhiên hơn việc lặp tên.
- source_word: ὅσα
  choice: biết bao
  rationale: Trong cấu trúc với δεῖ và động từ nguyên mẫu, từ này diễn tả mức độ hoặc lượng những điều phải chịu; “chịu khổ biết bao” là cách nói tự nhiên, không biến câu thành một danh sách cụ thể.
- source_word: δεῖ
  choice: phải
  rationale: Diễn đạt sự cần thiết với đầy đủ sức nặng, nhưng không tự ý xác định đó là tiền định, bổ nhiệm hay chỉ sự tất yếu.
- source_word: ὑπὲρ
  choice: vì
  rationale: Ở đây có thể chỉ nguyên do, lợi ích hoặc ‘vì cớ’; “vì” ngắn gọn, tự nhiên và giữ được độ rộng nghĩa, còn các sắc thái khác được nêu trong chú thích.
- source_word: τοῦ ὀνόματός μου
  choice: danh Ta
  rationale: Giữ hình ảnh ‘danh’, vốn có thể đại diện cho chính con người, thẩm quyền và sự công khai xưng nhận Chúa Giê-su.
- source_word: παθεῖν
  choice: chịu khổ
  rationale: Cách dịch thông dụng, rõ ràng của πάσχω trong ngữ cảnh nói đến đau khổ mà một người phải trải qua.
theological_decisions:
- issue: Bản chất của sự cần thiết trong δεῖ
  choice: phải
  alternative: đã được định phải; đã được chỉ định để
  rationale: Nguyên văn khẳng định sự cần thiết nhưng không trực tiếp định rõ trong từ ngữ rằng đó là sự tất yếu lô-gích, sự an bài quan phòng hay một sắc lệnh tiền định. “Phải” giữ nguyên sức căng thần học mà không thêm một sắc thái quyết định luận mạnh hơn câu Hy Lạp.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Trật tự “chịu khổ biết bao” được chọn vì tự nhiên hơn “bao nhiêu điều phải chịu khổ”. Đại từ “Ta” phù hợp với lời trực tiếp của Chúa Giê-su và nhất quán với sắc thái trang nghiêm; dấu chú thích [a] đã được đặt trong chính văn.
