id: ACT.9.42
reference: Acts 9:42
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: γνωστὸν δὲ ἐγένετο καθ’ ὅλης ⸀τῆς Ἰόππης, καὶ ⸂ἐπίστευσαν πολλοὶ⸃ ἐπὶ τὸν κύριον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/042.yaml
  text: And it became known throughout all Joppa, and many believed in the Lord.
translation:
  language: vi
  text: Việc ấy được biết đến khắp thành Giốp-bê, và nhiều người tin nơi Chúa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γνωστὸν ... ἐγένετο
  choice: Việc ấy được biết đến
  rationale: Cấu trúc vô nhân xưng diễn tả việc sự kiện vừa kể trở nên được biết đến, không xác định tác nhân loan truyền.
- source_word: δὲ
  choice: và
  rationale: Ở đây δέ là liên từ nhẹ, tiếp nối mạch tường thuật; “và” tự nhiên và không tạo sắc thái tương phản quá mức.
- source_word: καθ’ ὅλης τῆς Ἰόππης
  choice: khắp thành Giốp-bê
  rationale: κατά với sở hữu cách diễn tả sự lan rộng khắp địa bàn; ὅλης nhấn mạnh toàn thể nơi ấy. Thêm “thành” làm rõ đây là địa danh đô thị trong tiếng Việt.
- source_word: Ἰόππης
  choice: Giốp-bê
  rationale: Dùng dạng phiên âm Kinh Thánh quen thuộc trong tiếng Việt cho địa danh Joppa.
- source_word: ἐπίστευσαν πολλοὶ
  choice: nhiều người tin
  rationale: Tính từ được dùng như danh từ πολλοί được diễn đạt tự nhiên là “nhiều người”; động từ aorist ἐπίστευσαν chỉ sự kiện họ tin.
- source_word: ἐπὶ τὸν κύριον
  choice: nơi Chúa
  rationale: Sau πιστεύω, ἐπί với đối cách chỉ đối tượng mà người ta đặt lòng tin. “Tin nơi Chúa” vừa tự nhiên trong văn phong Kinh Thánh tiếng Việt vừa giữ sắc thái tín thác vào một ngôi vị.
- source_word: κύριον
  choice: Chúa
  rationale: “Chúa” giữ được cả ý nghĩa tôn xưng lẫn sức nặng thần học của κύριος trong sách Công Vụ.
theological_decisions:
- issue: Cách dịch πιστεύω + ἐπὶ τὸν κύριον
  choice: tin nơi Chúa
  alternative: tin Chúa; tin vào Chúa
  rationale: “Tin nơi Chúa” diễn tả Chúa là đối tượng của lòng tin và giữ sắc thái tín thác, nhưng không bổ sung một công thức giáo lý hẹp hơn điều bản văn nói.
- issue: Cách dịch κύριος
  choice: Chúa
  alternative: chủ; thầy
  rationale: “Chúa” bảo toàn ý nghĩa tôn xưng và hàm ý Cơ Đốc học trong ngữ cảnh Công Vụ; “chủ” hoặc “thầy” sẽ làm nhẹ sắc thái ấy.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu giữ nhịp kể súc tích của nguyên văn; “Việc ấy” nối rõ với phép lạ vừa được thuật lại mà không xác định thêm nội dung hay tác nhân.
