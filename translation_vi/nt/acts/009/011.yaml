source:
  edition: SBLGNT
  text: ὁ δὲ κύριος πρὸς αὐτόν· ⸀Ἀναστὰς πορεύθητι ἐπὶ τὴν ῥύμην τὴν καλουμένην Εὐθεῖαν καὶ ζήτησον ἐν οἰκίᾳ Ἰούδα Σαῦλον ὀνόματι Ταρσέα, ἰδοὺ γὰρ προσεύχεται,
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/011.yaml
  text: And the Lord said to him[a], “Get up and go to the street called Straight, and in the house of Judas look for a man named Saul, from Tarsus, for behold, he is praying.”
translation:
  language: vi
  text: 'Chúa phán với ông: “Hãy đứng dậy, đi đến con phố gọi là Thẳng, rồi tại nhà Giu-đa, hãy tìm một người tên là Sau-lơ, quê ở Tạt-sơ[a], vì kìa, người ấy đang cầu nguyện.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Sau-lơ người Tạt-sơ.” Từ Hy Lạp Ταρσέα xác định Sau-lơ theo quê quán Tạt-sơ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριος
  choice: Chúa
  rationale: Cách dịch chuẩn, trang trọng và tự nhiên cho tước hiệu κύριος; không thêm rõ danh tính của Đấng đang phán ngoài điều câu Hy Lạp nêu trực tiếp.
- source_word: Ἀναστὰς πορεύθητι
  choice: Hãy đứng dậy, đi
  rationale: Phân từ bất định Ἀναστὰς đi cùng mệnh lệnh πορεύθητι diễn tả việc đứng dậy để bắt đầu hành động; cách diễn đạt này tự nhiên trong tiếng Việt hiện đại.
- source_word: ῥύμην τὴν καλουμένην Εὐθεῖαν
  choice: con phố gọi là Phố Thẳng
  rationale: ῥύμη chỉ một đường phố trong thành; Εὐθεῖαν được hiểu như tên riêng của phố và được viết hoa để người đọc nhận ra đó là địa danh.
- source_word: ἐν οἰκίᾳ Ἰούδα
  choice: tại nhà Giu-đa
  rationale: Diễn đạt địa điểm một cách tự nhiên trong tiếng Việt, không nhất thiết hàm ý phải ở bên trong nhà ngay khi bắt đầu tìm hỏi.
- source_word: ζήτησον
  choice: hãy tìm
  rationale: Giữ sắc thái tìm kiếm hoặc hỏi tìm của ζητέω, không dịch thành 'hãy gặp' hay 'hãy tìm thấy', vốn sẽ nói quá kết quả.
- source_word: Σαῦλον ὀνόματι Ταρσέα
  choice: một người tên là Sau-lơ, quê ở Tạt-sơ
  rationale: ὀνόματι giới thiệu tên Sau-lơ, còn tính từ Ταρσέα xác định nguồn gốc từ Tạt-sơ; 'quê ở' truyền đạt quan hệ địa lý tự nhiên.
- source_word: ἰδοὺ γὰρ
  choice: vì kìa
  rationale: ‘Vì’ giữ chức năng nêu lý do của γάρ, còn ‘kìa’ giữ tác dụng thu hút sự chú ý của ἰδού, dù lối nói này có sắc thái trang trọng.
- source_word: προσεύχεται
  choice: người ấy đang cầu nguyện
  rationale: Thì hiện tại trong ngữ cảnh nhấn mạnh hoạt động đang diễn ra; 'người ấy' giúp quy chiếu rõ về Sau-lơ trong tiếng Việt.
theological_decisions:
- issue: Đối tượng quy chiếu của κύριος
  choice: Chúa
  alternative: Chúa Giê-su
  rationale: Ngữ cảnh gần cho biết Đấng phán là Chúa Giê-su phục sinh, nhưng chính câu này chỉ dùng κύριος; bản dịch không thêm danh xưng không có trong mệnh đề.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng ‘ông’ cho A-na-nia theo mạch kể, ‘Phố Thẳng’ như tên riêng, và giữ ‘kìa’ để bảo toàn tín hiệu diễn ngôn ἰδού.
