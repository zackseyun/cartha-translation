id: ACT.9.2
reference: Acts 9:2
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ᾐτήσατο παρ’ αὐτοῦ ἐπιστολὰς εἰς Δαμασκὸν πρὸς τὰς συναγωγάς, ὅπως ἐάν τινας εὕρῃ τῆς ὁδοῦ ὄντας, ἄνδρας τε καὶ γυναῖκας, δεδεμένους ἀγάγῃ εἰς Ἰερουσαλήμ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/002.yaml
  text: and asked him for letters to the synagogues in Damascus[a], so that if he found any belonging to the Way, both men and women, he might bring them bound to Jerusalem.
translation:
  language: vi
  text: và xin ông cấp các thư gửi đến các hội đường tại Đa-mách, để nếu tìm thấy bất cứ ai thuộc về Con Đường[a], dù là nam hay nữ, thì ông có thể trói họ rồi giải về Giê-ru-sa-lem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “thuộc về Đạo” hoặc “những người theo Con Đường”. Tiếng Hy Lạp dùng một danh xưng ban đầu của phong trào Cơ Đốc.'
    reason: Nêu lựa chọn từ vựng cho τῆς ὁδοῦ và giải thích đây là danh xưng lịch sử.
lexical_decisions:
- source_word: ᾐτήσατο παρ’ αὐτοῦ ἐπιστολὰς
  choice: xin ông cấp thư
  rationale: Động từ αἰτέω với παρά + sở hữu cách diễn tả việc xin một người cung cấp điều gì. “Xin ông cấp thư” tự nhiên trong tiếng Việt và làm rõ quan hệ giữa người xin với người cấp, nhưng không thêm nội dung ủy quyền vào danh từ “thư”.
- source_word: εἰς Δαμασκὸν πρὸς τὰς συναγωγάς
  choice: gửi đến các hội đường tại Đa-mách
  rationale: Hai cụm giới từ chỉ các thư được gửi đến những hội đường nằm tại Đa-mách. Cách diễn đạt này rõ nghĩa và tự nhiên trong tiếng Việt.
- source_word: ὅπως ἐάν τινας εὕρῃ
  choice: để nếu tìm thấy bất cứ ai
  rationale: “Để” giữ ý mục đích của ὅπως, còn “nếu” giữ tính điều kiện của ἐάν với động từ giả định. “Bất cứ ai” phù hợp với τινας trong ngữ cảnh điều kiện.
- source_word: τῆς ὁδοῦ ὄντας
  choice: thuộc về Đạo
  rationale: Cách dịch này giữ quan hệ sở thuộc của sở hữu cách và bảo tồn “Đạo” như danh xưng lịch sử ban đầu của phong trào Cơ Đốc, thay vì diễn giải thành “tín đồ” hay “người theo”.
- source_word: ἄνδρας τε καὶ γυναῖκας
  choice: dù là nam hay nữ
  rationale: Giữ nguyên việc bản Hy Lạp nêu rõ cả nam lẫn nữ, đồng thời liên kết tự nhiên với “bất cứ ai” trong câu tiếng Việt.
- source_word: δεδεμένους ἀγάγῃ
  choice: trói họ và giải về
  rationale: δεδεμένους mô tả họ ở trong tình trạng bị trói khi được đưa đi. “Giải về” diễn đạt tự nhiên việc áp giải người bị bắt đến một địa điểm, còn “trói” không thêm phương tiện cụ thể như xiềng hay xích.
- source_word: εἰς Ἰερουσαλήμ
  choice: về Giê-ru-sa-lem
  rationale: “Về” tự nhiên theo hướng quy chiếu của câu chuyện và truyền đạt đích đến là Giê-ru-sa-lem.
theological_decisions:
- issue: Cách dịch τῆς ὁδοῦ
  choice: Đạo
  alternative: con đường; những người theo Đạo
  rationale: Viết hoa “Đạo” cho thấy đây là danh xưng của phong trào Cơ Đốc ban đầu, nhưng không triển khai thành một cách diễn giải thần học cụ thể. Chú thích nêu các khả năng dịch để giữ sắc thái của nguyên văn.
- issue: Việc nêu rõ ἄνδρας τε καὶ γυναῖκας
  choice: dù là nam hay nữ
  alternative: cả đàn ông lẫn đàn bà
  rationale: Bản dịch bảo tồn sự nhấn mạnh rằng ý định bắt giữ bao gồm cả hai giới, nhưng dùng cách nói trang trọng, tự nhiên trong tiếng Việt hiện đại.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng các địa danh quen thuộc “Đa-mách” và “Giê-ru-sa-lem”; dùng “hội đường” cho συναγωγή. Đại từ “ông” theo mạch câu trước chỉ Sau-lơ; câu vẫn giữ cấu trúc mục đích và điều kiện của nguyên văn.
