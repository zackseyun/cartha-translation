revisions:
- from: 'Nhưng Phi-e-rơ cho mọi người ra ngoài, rồi quỳ xuống cầu nguyện. Sau đó, ông quay về phía thi thể và nói: “Ta-bi-tha, hãy đứng dậy[a].” Bà mở mắt; khi thấy Phi-e-rơ, bà ngồi dậy.'
  to: 'Nhưng Phi-e-rơ bảo mọi người ra ngoài, rồi quỳ xuống cầu nguyện. Sau đó, ông quay về phía thi thể và nói: “Ta-bi-tha, hãy đứng dậy[a].” Bà mở mắt; khi thấy Phi-e-rơ, bà ngồi dậy.'
  rationale: Chỉ thay “cho mọi người ra ngoài” bằng “bảo mọi người ra ngoài” để làm rõ tác động chủ động của Phi-e-rơ theo nguyên văn. Các phần khác giữ nguyên vì vừa sát nghĩa vừa tự nhiên trong tiếng Việt hiện đại.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T09:16:32Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch theo sát trình tự và nội dung Hy Lạp: Phi-e-rơ loại mọi người ra ngoài, quỳ cầu nguyện, quay về phía thi thể, truyền cho Ta-bi-tha đứng dậy; bà mở mắt, thấy ông và ngồi dậy. Tuy nhiên, “cho mọi người ra ngoài” có thể hiểu là cho phép họ đi ra, chưa diễn đạt rõ hành động chủ động khiến tất cả rời khỏi nơi ấy của ἐκβαλών ... ἔξω πάντας.'
  naturalness: Văn phong nhìn chung tự nhiên, trang nghiêm và phù hợp tiếng Việt hiện đại. “Bảo mọi người ra ngoài” rõ nghĩa hơn trong ngữ cảnh mà vẫn không thêm sắc thái cưỡng bức mạnh như “đuổi”. “Quỳ xuống cầu nguyện”, “quay về phía thi thể”, và “ngồi dậy” đều tự nhiên.
  terminology: Tên “Phi-e-rơ” và “Ta-bi-tha” nhất quán với lối phiên âm của bản thảo. “Thi thể” phản ánh σῶμα phù hợp trong ngữ cảnh. “Hãy đứng dậy” là cách dịch tự nhiên, không áp đặt một cách hiểu thần học ngoài nguyên văn; chú thích nêu lựa chọn “hãy trỗi dậy” là hữu ích.
  issues:
  - severity: medium
    issue: “cho mọi người ra ngoài” chưa xác định rõ chủ thể thực hiện việc đưa mọi người ra ngoài.
    rationale: ἐκβαλών ... ἔξω πάντας nói Phi-e-rơ chủ động đưa/cho tất cả ra ngoài. Trong tiếng Việt, “cho mọi người ra ngoài” có thể được hiểu là cho phép họ ra ngoài. “Bảo mọi người ra ngoài” diễn đạt rõ hành động phù hợp ngữ cảnh, không cường điệu thành xua đuổi.
