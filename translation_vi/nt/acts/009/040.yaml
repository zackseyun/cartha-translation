id: ACT.9.40
reference: Acts 9:40
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐκβαλὼν δὲ ἔξω πάντας ὁ Πέτρος ⸀καὶ θεὶς τὰ γόνατα προσηύξατο, καὶ ἐπιστρέψας πρὸς τὸ σῶμα εἶπεν· Ταβιθά, ἀνάστηθι. ἡ δὲ ἤνοιξεν τοὺς ὀφθαλμοὺς αὐτῆς, καὶ ἰδοῦσα τὸν Πέτρον ἀνεκάθισεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/040.yaml
  text: But Peter put them all outside[a], knelt down and prayed, and turning toward the body said, “Tabitha, arise.” Then she opened her eyes, and when she saw Peter, she sat up.
translation:
  language: vi
  text: 'Nhưng Phi-e-rơ bảo mọi người ra ngoài, rồi quỳ xuống cầu nguyện. Sau đó, ông quay về phía thi thể và nói: “Ta-bi-tha, hãy đứng dậy[a].” Bà mở mắt; khi thấy Phi-e-rơ, bà ngồi dậy.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “hãy trỗi dậy.”
    reason: Động từ mệnh lệnh Hy Lạp có thể được dịch là “đứng dậy” hoặc “trỗi dậy”; cả hai cách đều phù hợp với bối cảnh Ta-bi-tha được phục hồi sự sống.
lexical_decisions:
- source_word: ἐκβαλὼν ... ἔξω πάντας
  choice: cho mọi người ra ngoài
  rationale: Diễn đạt rõ việc Phi-e-rơ đưa tất cả những người hiện diện ra khỏi phòng, nhưng không hàm ý cưỡng bức quá mức như “đuổi hết ra ngoài” có thể gợi ra.
- source_word: θεὶς τὰ γόνατα
  choice: quỳ xuống
  rationale: Đây là thành ngữ chỉ tư thế quỳ, đặc biệt tự nhiên trong bối cảnh cầu nguyện.
- source_word: προσηύξατο
  choice: cầu nguyện
  rationale: Cách dịch trực tiếp và thông dụng của προσεύχομαι trong tiếng Việt.
- source_word: ἐπιστρέψας πρὸς τὸ σῶμα
  choice: quay về phía thi thể
  rationale: Giữ lại chuyển động và hướng nhìn cụ thể; “thi thể” phù hợp với tình trạng của Ta-bi-tha tại thời điểm này mà không thêm sắc thái thô lạnh.
- source_word: Ταβιθά
  choice: Ta-bi-tha
  rationale: Phiên âm tên riêng theo cách dễ đọc trong tiếng Việt.
- source_word: ἀνάστηθι
  choice: hãy đứng dậy
  rationale: Mệnh lệnh này có thể mang nghĩa đứng dậy hoặc trỗi dậy. “Hãy đứng dậy” tự nhiên, trang trọng vừa phải và phù hợp với việc bà đang nằm bất động.
- source_word: ἤνοιξεν τοὺς ὀφθαλμοὺς αὐτῆς
  choice: Bà mở mắt
  rationale: Diễn đạt trực tiếp, tự nhiên, giữ đúng chủ thể và hành động của nguyên văn.
- source_word: ἰδοῦσα τὸν Πέτρον
  choice: khi thấy Phi-e-rơ
  rationale: Chuyển phân từ thành mệnh đề thời gian để câu tiếng Việt sáng rõ mà vẫn giữ trình tự hành động.
- source_word: ἀνεκάθισεν
  choice: bà ngồi dậy
  rationale: Động từ chỉ việc ngồi bật hoặc ngồi lên từ tư thế nằm; “ngồi dậy” là cách nói tự nhiên và chính xác trong tiếng Việt.
- source_word: δὲ
  choice: Nhưng / không dịch riêng ở mệnh đề sau
  rationale: Lần đầu đánh dấu sự chuyển tiếp có đối chiếu với cảnh trước nên dùng “Nhưng”; lần sau chỉ tiếp nối diễn biến và được thể hiện tự nhiên bằng cấu trúc câu tiếng Việt.
theological_decisions:
- issue: Sắc thái của mệnh lệnh ἀνάστηθι trong bối cảnh phục hồi sự sống
  choice: hãy đứng dậy
  alternative: hãy trỗi dậy
  rationale: “Hãy đứng dậy” giữ được nghĩa trực tiếp và tự nhiên, đồng thời không loại bỏ sự vang vọng về việc sống lại trong bối cảnh. “Hãy trỗi dậy” trang trọng hơn nhưng kém thông dụng và có thể làm sắc thái thần học nổi bật hơn mức nguyên văn bắt buộc.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm nhưng dễ hiểu. Dùng “Phi-e-rơ” và “Ta-bi-tha” theo lối phiên âm quen thuộc; “thi thể” giữ đúng tình trạng trong câu chuyện, còn các hành động được trình bày tuần tự, gọn và tự nhiên.
