id: ACT.9.27
reference: Acts 9:27
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Βαρναβᾶς δὲ ἐπιλαβόμενος αὐτὸν ἤγαγεν πρὸς τοὺς ἀποστόλους, καὶ διηγήσατο αὐτοῖς πῶς ἐν τῇ ὁδῷ εἶδεν τὸν κύριον καὶ ὅτι ἐλάλησεν αὐτῷ καὶ πῶς ἐν Δαμασκῷ ἐπαρρησιάσατο ἐν τῷ ὀνόματι ⸀τοῦ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/027.yaml
  text: But Barnabas took hold of him and brought him to the apostles, and told them how on the road he had seen the Lord, and that he had spoken to him, and how in Damascus he had spoken boldly in the name of Jesus.
translation:
  language: vi
  text: Nhưng Ba-na-ba nắm lấy Sau-lơ, dẫn ông đến với các sứ đồ và thuật lại cho họ việc Sau-lơ đã thấy Chúa trên đường đi, Chúa đã nói với ông, và việc tại Đa-mách ông đã mạnh dạn nói nhân danh Đức Giê-su.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιλαβόμενος αὐτὸν
  choice: đón lấy Sau-lơ
  rationale: Động từ có nghĩa là nắm lấy hoặc tiếp nhận và đưa đi. Trong ngữ cảnh Ba-na-ba đứng ra giúp Sau-lơ giữa lúc các môn đồ e sợ ông, “đón lấy” diễn đạt tự nhiên sắc thái hỗ trợ mà không gợi hành động cưỡng ép.
- source_word: ἤγαγεν πρὸς τοὺς ἀποστόλους
  choice: dẫn ông đến với các sứ đồ
  rationale: ἄγω có thể là dẫn hoặc đưa đến; “dẫn ... đến với” vừa tự nhiên vừa thể hiện Ba-na-ba đưa Sau-lơ ra mắt các sứ đồ.
- source_word: διηγήσατο
  choice: thuật lại cho họ
  rationale: Động từ chỉ việc kể lại hoặc trình bày một sự việc; “thuật lại” giữ được sắc thái kể có nội dung cụ thể.
- source_word: πῶς ἐν τῇ ὁδῷ
  choice: việc ... trên đường đi
  rationale: ὁδός ở đây là con đường trong hành trình đến Đa-mách, không phải tên gọi phong trào “Đạo”; cách diễn đạt này rõ nghĩa trong tiếng Việt.
- source_word: εἶδεν τὸν κύριον
  choice: Sau-lơ đã thấy Chúa
  rationale: Nêu lại tên Sau-lơ để tránh mơ hồ đại từ trong chuỗi lời kể. “Chúa” giữ danh hiệu κύριος và phù hợp với ngữ cảnh cuộc gặp Đức Giê-su phục sinh.
- source_word: ὅτι ἐλάλησεν αὐτῷ
  choice: Chúa đã phán với ông
  rationale: Chủ ngữ ngầm là Chúa ở mệnh đề trước. “Phán” là cách diễn đạt trang trọng, tự nhiên khi Chúa nói với một người, đồng thời làm rõ chủ thể mà tiếng Hy Lạp xác định qua ngữ cảnh.
- source_word: ἐπαρρησιάσατο
  choice: ông đã mạnh dạn nói
  rationale: παρρησιάζομαι nhấn mạnh việc nói cách tự do, công khai và can đảm. “Mạnh dạn nói” giữ nghĩa từ vựng mà không thu hẹp thành riêng hành động giảng đạo.
- source_word: ἐν τῷ ὀνόματι τοῦ Ἰησοῦ
  choice: nhân danh Đức Giê-su
  rationale: “Nhân danh” là thành ngữ Kinh Thánh tự nhiên trong tiếng Việt, bảo toàn ý niệm nói trong mối liên hệ với danh và thẩm quyền của Đức Giê-su.
theological_decisions:
- issue: Đối tượng được gọi là κύριος trong kinh nghiệm trên đường của Sau-lơ
  choice: “Chúa” chỉ Đức Giê-su
  alternative: Hiểu “Chúa” như một cách chỉ Đức Chúa Trời nói chung
  rationale: Mạch văn trực tiếp của Công Vụ 9 xác định Đấng hiện ra với Sau-lơ là Đức Giê-su phục sinh; cuối câu cũng nhắc đến danh Đức Giê-su. Bản dịch vẫn giữ danh hiệu “Chúa” thay vì thay bằng tên riêng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ba-na-ba,” “Sau-lơ,” “Đa-mách,” “Đức Giê-su” theo lối phiên âm quen thuộc; dùng “sứ đồ” để giữ thuật ngữ chức vụ. Việc lặp “Sau-lơ” và “Chúa” thay cho một số đại từ nhằm loại bỏ sự mơ hồ không có trong cấu trúc Hy Lạp, nhưng không thêm diễn giải thần học.
