- from: Nhưng Ba-na-ba đón lấy Sau-lơ, dẫn ông đến với các sứ đồ và thuật lại cho họ việc Sau-lơ đã thấy Chúa trên đường đi, Chúa đã phán với ông, và việc tại Đa-mách ông đã mạnh dạn nói nhân danh Đức Giê-su.
