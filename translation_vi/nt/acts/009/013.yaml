source:
  edition: SBLGNT
  text: ἀπεκρίθη δὲ Ἁνανίας· Κύριε, ⸀ἤκουσα ἀπὸ πολλῶν περὶ τοῦ ἀνδρὸς τούτου, ὅσα κακὰ ⸂τοῖς ἁγίοις σου ἐποίησεν⸃ ἐν Ἰερουσαλήμ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/013.yaml
  text: But Ananias answered[a], “Lord, I have heard from many about this man, how much evil he has done to your saints in Jerusalem.”
translation:
  language: vi
  text: 'Nhưng A-na-nia thưa: “Lạy Chúa, tôi đã nghe nhiều người nói về người này, rằng người ấy đã làm biết bao điều ác đối với các thánh của Ngài tại Giê-ru-sa-lem.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη δὲ Ἁνανίας
  choice: Nhưng A-na-nia thưa
  rationale: δέ tạo nét chuyển ý nhẹ trước sự do dự của A-na-nia; “thưa” tự nhiên trong lời đáp kính trọng với Chúa và vẫn truyền đạt lực của ἀπεκρίθη.
- source_word: Κύριε
  choice: Lạy Chúa
  rationale: Đây là lời xưng hô trực tiếp với Chúa Giê-su trong khải tượng; “Lạy Chúa” vừa tự nhiên trong tiếng Việt vừa giữ được sức nặng thần học của κύριος.
- source_word: ἤκουσα ἀπὸ πολλῶν
  choice: con đã nghe nhiều người nói
  rationale: “Con” phù hợp với lời thưa kính trọng; thêm “người nói” làm rõ cấu trúc nguồn tin vốn được hàm ý trong tiếng Hy Lạp mà không xác định họ là ai.
- source_word: περὶ τοῦ ἀνδρὸς τούτου
  choice: về người này
  rationale: Giữ nguyên ý của περί với sở hữu cách và sắc thái chỉ định của τούτου, bằng cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: ὅσα κακὰ
  choice: biết bao điều ác
  rationale: Diễn đạt cả mức độ lớn của ὅσα và tính chất đạo đức của κακά, đồng thời tự nhiên hơn lối dịch máy móc “bao nhiêu điều ác”.
- source_word: τοῖς ἁγίοις σου
  choice: đối với các thánh của Ngài
  rationale: “Các thánh” giữ thuật ngữ Tân Ước chỉ những người thuộc về Chúa; “của Ngài” bảo toàn đại từ sở hữu σου.
- source_word: ἐποίησεν
  choice: hắn đã làm
  rationale: “Làm” phản ánh nghĩa rộng của ποιέω; “hắn” phù hợp với thái độ lo ngại và xa cách của A-na-nia trong ngữ cảnh, nhưng không thêm lời kết án ngoài mệnh đề nói về việc ác.
- source_word: ἐν Ἰερουσαλήμ
  choice: tại Giê-ru-sa-lem
  rationale: Cách diễn đạt địa điểm trang trọng, tự nhiên và trực tiếp.
theological_decisions:
- issue: Ý nghĩa và đối tượng của Κύριε
  choice: Lời trực tiếp gọi Chúa Giê-su là “Chúa”
  alternative: “Thưa chủ” hoặc một lối xưng hô chỉ mang tính kính trọng
  rationale: Trong văn cảnh gần, A-na-nia đang đáp lại Chúa Giê-su phục sinh trong một khải tượng. “Lạy Chúa” bảo toàn cả sự kính trọng lẫn sức nặng thần học mà không nói quá điều trình thuật xác nhận.
- issue: Cách gọi τοῖς ἁγίοις σου
  choice: các thánh của Ngài
  alternative: những người thánh của Ngài; dân Ngài
  rationale: “Các thánh” giữ nguyên hình ảnh và thuật ngữ của bản văn, không thu hẹp hay diễn giải căn tính của nhóm người này.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. Dùng “con/Ngài” trong lời A-na-nia thưa với Chúa; giữ “các thánh” như thuật ngữ Kinh Thánh quen thuộc. Không cần chú thích vì bản dịch chính trực tiếp truyền đạt các nét nghĩa quan trọng của câu.
