  to: 'Nhưng A-na-nia thưa: “Lạy Chúa, tôi đã nghe nhiều người nói về người này, rằng người ấy đã làm biết bao điều ác đối với các thánh của Ngài tại Giê-ru-sa-lem.”'
  rationale: Sửa “hắn” thành “người ấy” để bảo toàn sắc thái chỉ định trung tính của nguyên văn, không thêm sự khinh miệt. Sửa “con” thành “tôi” để tránh áp đặt một quan hệ xưng hô không được mã hóa trong tiếng Hy Lạp. Các thuật ngữ và cấu trúc còn lại được giữ vì trung thành với bản văn và tự nhiên trong tiếng Việt hiện đại.
