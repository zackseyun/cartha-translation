source:
  edition: SBLGNT
  text: ἐγνώσθη δὲ τῷ Σαύλῳ ἡ ἐπιβουλὴ αὐτῶν. ⸂παρετηροῦντο δὲ καὶ⸃ τὰς πύλας ἡμέρας τε καὶ νυκτὸς ὅπως αὐτὸν ἀνέλωσιν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/024.yaml
  text: But their plot became known to Saul[a]. They were also watching the gates day and night so that they might kill him.
translation:
  language: vi
  text: Nhưng Sau-lơ biết được âm mưu của họ. Họ cũng canh chừng các cổng[a] cả ngày lẫn đêm để giết ông.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “các cổng thành.” Bản Hy Lạp chỉ ghi “các cổng”; bối cảnh cho thấy đây là các cổng thành Đa-mách.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγνώσθη
  choice: biết được
  rationale: Động từ aorist bị động cho biết âm mưu đã đến chỗ Sau-lơ hay biết. Cách nói “Sau-lơ biết được” tự nhiên trong tiếng Việt, không xác định ai đã báo tin.
- source_word: ἐπιβουλή
  choice: âm mưu
  rationale: Danh từ chỉ một kế hoạch thù địch nhằm hại người; “âm mưu” phù hợp với ý định giết Sau-lơ được nêu ngay sau đó.
- source_word: παρετηροῦντο
  choice: canh chừng
  rationale: Thì chưa hoàn thành diễn tả hành động theo dõi liên tục. “Canh chừng” tự nhiên trong bối cảnh họ theo dõi các cổng để bắt và giết Sau-lơ, nhưng không thêm ý rằng họ chính thức bảo vệ cổng.
- source_word: πύλας
  choice: các cổng
  rationale: Giữ nguyên danh từ số nhiều của bản Hy Lạp; theo bối cảnh, đây là các cổng thành Đa-mách.
- source_word: ἡμέρας τε καὶ νυκτός
  choice: cả ngày lẫn đêm
  rationale: Diễn đạt tự nhiên ý theo dõi liên tục vào ban ngày và ban đêm.
- source_word: ὅπως
  choice: để
  rationale: Giữ rõ sắc thái mục đích bằng một liên từ tự nhiên trong tiếng Việt hiện đại.
- source_word: ἀνέλωσιν
  choice: giết
  rationale: Trong ngữ cảnh này, ἀναιρέω mang nghĩa trực tiếp là giết hoặc trừ khử; “giết” rõ ràng và không uyển ngữ.
- source_word: δὲ
  choice: Nhưng
  rationale: 'Thể hiện sự chuyển ý có tính tương phản: họ âm mưu giết Sau-lơ, nhưng ông biết được âm mưu ấy.'
- source_word: καὶ
  choice: cũng
  rationale: Nêu thêm hành động canh chừng các cổng bên cạnh việc lập âm mưu.
theological_decisions: []
translation_notes:
  register: Văn phong tiếng Việt hiện đại, rõ ràng và trang trọng vừa phải. Dùng “Sau-lơ” theo lối phiên âm tên Kinh Thánh quen thuộc; đại từ “ông” giúp câu tự nhiên mà vẫn tôn trọng nhân vật.
