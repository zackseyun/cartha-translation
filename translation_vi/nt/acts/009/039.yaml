id: ACT.9.39
reference: Acts 9:39
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀναστὰς δὲ Πέτρος συνῆλθεν αὐτοῖς· ὃν παραγενόμενον ἀνήγαγον εἰς τὸ ὑπερῷον, καὶ παρέστησαν αὐτῷ πᾶσαι αἱ χῆραι κλαίουσαι καὶ ἐπιδεικνύμεναι χιτῶνας καὶ ἱμάτια ὅσα ἐποίει μετ’ αὐτῶν οὖσα ἡ Δορκάς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/039.yaml
  text: So Peter got up and went with them[a]. When he arrived, they took him up to the upper room, and all the widows stood beside him[c][b], weeping and showing the tunics and garments that Dorcas made while she was with them.
translation:
  language: vi
  text: Vì vậy, Phi-e-rơ đứng dậy và đi cùng họ. Khi ông đến nơi, họ đưa ông lên căn phòng trên lầu. Tất cả các bà góa đứng bên ông[a], vừa khóc vừa cho ông xem những áo mặc trong và áo khoác ngoài[b] mà Đô-ca[c] vẫn thường may khi còn ở với họ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đứng trước mặt ông.” Cụm từ Hy Lạp có thể mang sắc thái trang trọng hơn, nhưng ngữ cảnh cho thấy các bà góa tụ họp quanh Phi-e-rơ trong lúc đau buồn.'
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn dùng hai từ chỉ y phục khác nhau, có lẽ lần lượt nói đến áo mặc bên trong và áo khoác bên ngoài.
    reason: cultural_note
  - marker: c
    text: Đô-ca là tên Hy Lạp của bà; trong Công Vụ 9:36, bà cũng được gọi là Ta-bi-tha.
    reason: cross_reference
lexical_decisions:
- source_word: ἀναστὰς
  choice: đứng dậy
  rationale: Diễn đạt tự nhiên hành động Phi-e-rơ đáp lời và lên đường, đồng thời giữ nghĩa chuyển động của động từ.
- source_word: συνῆλθεν αὐτοῖς
  choice: đi cùng họ
  rationale: Trong ngữ cảnh, cụm từ có nghĩa Phi-e-rơ đi theo các sứ giả; cách dịch này tự nhiên và rõ ràng.
- source_word: παραγενόμενον
  choice: khi ông đến nơi
  rationale: Phân từ chỉ thời điểm xảy ra trước hành động họ đưa ông lên lầu.
- source_word: ἀνήγαγον
  choice: họ đưa ông lên
  rationale: Giữ rõ hướng chuyển động lên căn phòng ở tầng trên mà không xác định quá mức cách dẫn đi.
- source_word: ὑπερῷον
  choice: căn phòng trên lầu
  rationale: Cách nói hiện đại, dễ hiểu về một căn phòng ở tầng trên.
- source_word: παρέστησαν αὐτῷ
  choice: đứng bên ông
  rationale: Giữ hình ảnh các bà góa hiện diện sát bên Phi-e-rơ; chú thích nêu khả năng trang trọng hơn là đứng trước mặt ông.
- source_word: πᾶσαι αἱ χῆραι
  choice: tất cả các bà góa
  rationale: Truyền đạt trực tiếp cả danh từ chỉ người góa chồng lẫn ý nhấn mạnh toàn thể nhóm.
- source_word: κλαίουσαι
  choice: vừa khóc
  rationale: Thể hiện hành động đang tiếp diễn đồng thời với việc cho xem quần áo.
- source_word: ἐπιδεικνύμεναι
  choice: cho ông xem
  rationale: Diễn đạt tự nhiên hành động đưa quần áo ra để Phi-e-rơ nhìn thấy.
- source_word: χιτῶνας καὶ ἱμάτια
  choice: những áo dài mặc trong và áo khoác ngoài
  rationale: 'Phân biệt hai loại y phục cổ: χιτών thường là áo mặc sát người, còn ἱμάτιον thường là áo ngoài; thêm chú thích để tránh coi đây là các loại áo hiện đại hoàn toàn tương ứng.'
- source_word: ὅσα ἐποίει
  choice: mà ... đã may
  rationale: Động từ ποιέω trong ngữ cảnh quần áo được diễn đạt tự nhiên là 'may'; thì chưa hoàn thành gợi hoạt động trong thời gian bà còn sống với họ nhưng không nhất thiết phải thêm sắc thái tập quán vào chính văn.
- source_word: μετ’ αὐτῶν οὖσα
  choice: khi còn ở với họ
  rationale: Giữ ý Đô-ca đã làm những y phục ấy trong thời gian bà còn hiện diện và sinh hoạt giữa cộng đồng.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Tên riêng được phiên âm theo cách quen thuộc trong Kinh Thánh tiếng Việt. Các phân từ đồng thời được chuyển thành cấu trúc “vừa... vừa...” để câu tự nhiên; các chú thích giữ lại khả năng từ vựng và bối cảnh văn hóa mà chính văn không nên diễn giải quá mức.
