revisions:
- from: Vì vậy, Phi-e-rơ đứng dậy và đi cùng họ. Khi ông đến nơi, họ đưa ông lên căn phòng trên lầu. Tất cả các bà góa đứng bên ông[a], vừa khóc vừa cho ông xem những áo dài mặc trong và áo khoác ngoài[b] mà Đô-ca[c] đã may khi còn ở với họ.
  to: Vì vậy, Phi-e-rơ đứng dậy và đi cùng họ. Khi ông đến nơi, họ đưa ông lên căn phòng trên lầu. Tất cả các bà góa đứng bên ông[a], vừa khóc vừa cho ông xem những áo mặc trong và áo khoác ngoài[b] mà Đô-ca[c] vẫn thường may khi còn ở với họ.
  rationale: Sửa một cách gọi y phục có thể tạo liên tưởng sai trong tiếng Việt hiện đại và điều chỉnh động từ để phản ánh an toàn sắc thái hành động thường xuyên của thì chưa hoàn thành. Các mốc chú thích được giữ đúng chỗ và toàn bộ nội dung còn lại không thay đổi nghĩa.
