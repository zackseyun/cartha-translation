- from: 'Vì Ly-đa ở gần Giốp-bê, các môn đồ nghe tin Phi-e-rơ đang ở đó, nên sai hai người đến gặp ông và khẩn khoản: “Xin ông đừng chậm trễ[a] đến với chúng tôi.”'
  to: 'Vì Ly-đa ở gần Giốp-bê, các môn đồ nghe tin Phi-e-rơ đang ở đó nên sai hai người đến gặp ông, khẩn khoản nói: “Xin ông đừng chậm trễ[a] đến với chúng tôi.”'
  rationale: Chỉ điều chỉnh cách dẫn lời để tiếng Việt hoàn chỉnh và tự nhiên hơn. Bỏ dấu phẩy trước “nên” cũng phù hợp với cấu trúc điều kiện-nguyên nhân “Vì … nên …” trong tiếng Việt. Nghĩa, mức độ khẩn thiết, và vị trí neo chú thích được giữ nguyên.
