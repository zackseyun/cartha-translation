  text: ἐγγὺς δὲ οὔσης Λύδδας τῇ Ἰόππῃ οἱ μαθηταὶ ἀκούσαντες ὅτι Πέτρος ἐστὶν ἐν αὐτῇ ἀπέστειλαν ⸂δύο ἄνδρας⸃ πρὸς αὐτὸν παρακαλοῦντες· Μὴ ⸀ὀκνήσῃς διελθεῖν ἕως ⸀ἡμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/038.yaml
  text: Since Lydda was near Joppa[a], the disciples, hearing that Peter was there, sent two men to him, urging, “Do not delay to come to us.”
translation:
  language: vi
  text: 'Vì Ly-đa ở gần Giốp-bê, các môn đồ nghe tin Phi-e-rơ đang ở đó nên sai hai người đến gặp ông, khẩn khoản nói: “Xin ông đừng chậm trễ[a] đến với chúng tôi.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Xin ông đừng chần chừ đến với chúng tôi.” Động từ Hy Lạp có thể nói đến sự chần chừ, ngần ngại hoặc chậm trễ; bản văn chính chọn nghĩa phù hợp nhất với lời yêu cầu cấp bách này.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγγὺς δὲ οὔσης Λύδδας τῇ Ἰόππῃ
  choice: Vì Ly-đa ở gần Giốp-bê
  rationale: Cấu trúc sở hữu cách tuyệt đối nêu hoàn cảnh làm nền và trong ngữ cảnh cũng hàm ý nguyên nhân cho hành động của các môn đồ. “Vì” diễn đạt tự nhiên mối liên hệ ấy mà không thêm một từ chỉ thời gian không có trong nguyên văn.
- source_word: Λύδδας / Ἰόππῃ / Πέτρος
  choice: Ly-đa / Giốp-bê / Phi-e-rơ
  rationale: Dùng các dạng phiên âm Hy Lạp quen thuộc trong truyền thống Kinh Thánh tiếng Việt, rõ ràng đối với độc giả phổ thông.
- source_word: οἱ μαθηταὶ
  choice: các môn đồ
  rationale: “Môn đồ” là cách dịch chính xác và quen thuộc của μαθηταί trong Công Vụ, chỉ những người thuộc cộng đồng tin Chúa.
- source_word: ἀκούσαντες ὅτι Πέτρος ἐστὶν ἐν αὐτῇ
  choice: nghe tin Phi-e-rơ đang ở đó
  rationale: “Nghe tin” tự nhiên trong tiếng Việt và diễn đạt việc họ biết Phi-e-rơ đang ở Ly-đa; “ở đó” chuyển đại từ chỉ địa điểm mà không lặp tên thành.
- source_word: ἀπέστειλαν δύο ἄνδρας πρὸς αὐτόν
  choice: sai hai người đến gặp ông
  rationale: Giữ rõ số người và mục đích họ được cử đến Phi-e-rơ; “sai” phù hợp với hành động phái người đi trong văn cảnh kể chuyện.
- source_word: παρακαλοῦντες
  choice: khẩn khoản
  rationale: Diễn đạt lời yêu cầu tha thiết, cấp bách mà không đẩy mức độ cảm xúc lên thành van xin tuyệt vọng.
- source_word: Μὴ ὀκνήσῃς
  choice: Xin ông đừng chậm trễ
  rationale: ὀκνέω có thể chỉ sự chần chừ, ngần ngại hoặc trì hoãn. Trong lời mời đi ngay này, “đừng chậm trễ” là cách nói tự nhiên và phù hợp tính cấp bách.
- source_word: διελθεῖν ἕως ἡμῶν
  choice: đến với chúng tôi
  rationale: Cụm từ chỉ việc Phi-e-rơ đi từ Ly-đa đến chỗ những người nói ở Giốp-bê. Cách dịch theo điểm nhìn của người sai phái là tự nhiên trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Cấu trúc “Vì… nên…” làm rõ quan hệ hoàn cảnh-nguyên nhân vốn hàm chứa trong câu Hy Lạp; lời trực tiếp dùng “xin ông” để thể hiện yêu cầu tha thiết và phép lịch sự tự nhiên trong tiếng Việt.
