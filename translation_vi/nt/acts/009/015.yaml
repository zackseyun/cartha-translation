id: ACT.9.15
reference: Acts 9:15
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἶπεν δὲ πρὸς αὐτὸν ὁ κύριος· Πορεύου, ὅτι σκεῦος ἐκλογῆς ⸂ἐστίν μοι⸃ οὗτος τοῦ βαστάσαι τὸ ὄνομά μου ἐνώπιον ⸀ἐθνῶν ⸀τε καὶ βασιλέων υἱῶν τε Ἰσραήλ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/015.yaml
  text: But the Lord said to him[a], “Go[b], because this man is a chosen instrument of mine to carry my name before the Gentiles and kings and the sons of Israel,”
translation:
  language: vi
  text: 'Nhưng Chúa phán với ông: “Hãy đi, vì người này là khí cụ Ta đã chọn để mang danh Ta trước các dân ngoại[a], các vua và các con trai Israel[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “các dân tộc”.
    reason: lexical_alternative
  - marker: b
    text: “Các con trai Israel” là cách nói truyền thống trong Kinh Thánh để chỉ dân Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριος
  choice: Chúa
  rationale: Cách dịch danh xưng quen thuộc và trang trọng; trong văn cảnh này chỉ Chúa Giê-su phục sinh đang phán với thẩm quyền.
- source_word: Πορεύου
  choice: Hãy đi
  rationale: Mệnh lệnh tự nhiên, trực tiếp trong tiếng Việt, giữ đúng lực của động từ Hy Lạp.
- source_word: σκεῦος ἐκλογῆς ἐστίν μοι
  choice: là khí cụ Ta đã chọn
  rationale: “Khí cụ” truyền đạt nghĩa ẩn dụ của σκεῦος là phương tiện được dùng cho một mục đích; “Ta đã chọn” diễn đạt tự nhiên ἐκλογῆς và quan hệ sở hữu trong μοι mà không áp đặt một hệ thống thần học về sự tuyển chọn.
- source_word: τοῦ βαστάσαι
  choice: để mang
  rationale: Diễn đạt mục đích của động từ nguyên mẫu có mạo từ; “mang” giữ được hình ảnh của βαστάζω.
- source_word: τὸ ὄνομά μου
  choice: danh Ta
  rationale: Giữ nguyên hình ảnh Kinh Thánh về “danh”, bao hàm sự đại diện, thẩm quyền và việc công khai làm chứng.
- source_word: ἐνώπιον
  choice: đến trước
  rationale: Cách diễn đạt gọn, tự nhiên cho việc đưa danh Chúa ra trước các nhóm người được liệt kê.
- source_word: ἐθνῶν
  choice: các dân ngoại
  rationale: Trong thế đối chiếu với Israel, từ này chỉ các dân không thuộc Do Thái; nghĩa sát chữ “các dân tộc” được giữ trong chú thích.
- source_word: βασιλέων
  choice: các vua
  rationale: Dịch trực tiếp, chính xác và dễ hiểu, không khái quát hóa thành “những người cai trị”.
- source_word: υἱῶν Ἰσραήλ
  choice: các con trai Israel
  rationale: Giữ hình thức thân tộc giống đực của nguyên văn và sắc thái diễn đạt truyền thống trong Kinh Thánh; chú thích làm rõ đây là tên gọi tập thể dành cho dân Israel.
- source_word: τε ... καὶ ... τε
  choice: …, … và …
  rationale: Ba nhóm được phối hợp tự nhiên bằng phép liệt kê tiếng Việt mà không gượng ép mô phỏng từng tiểu từ Hy Lạp.
theological_decisions:
- issue: Nguy cơ diễn giải quá mức ἐκλογῆς theo một hệ thống giáo lý về sự tuyển chọn
  choice: “khí cụ Ta đã chọn”
  alternative: “khí cụ của sự tuyển chọn” hoặc “khí cụ được tuyển định của Ta”
  rationale: Câu này khẳng định rõ Chúa chọn người ấy cho sứ mạng, nhưng không tự nó giải quyết các tranh luận thần học rộng hơn về sự tuyển chọn. Cách dịch được chọn giữ nguyên khẳng định của bản văn mà không thu hẹp nó theo một lập trường hệ phái.
- issue: Phạm vi của ἐθνῶν
  choice: “các dân ngoại” trong chính văn
  alternative: “các dân tộc”
  rationale: Văn cảnh đối chiếu nhóm này với các con trai Israel nên nghĩa “dân ngoại” là tự nhiên nhất, trong khi chú thích bảo lưu khả năng dịch sát chữ là “các dân tộc”.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Đại từ “Ta” phù hợp với lời trực tiếp của Chúa trong văn phong Kinh Thánh. Cấu trúc câu giữ nhịp liệt kê của nguyên văn; các dấu chú thích [a], [b] được đặt ngay sau những cụm từ tương ứng.
