  text: And here he has authority from the chief priests to bind all who call on your name[a].
translation:
  language: vi
  text: Và ở đây, người ấy có thẩm quyền do các thượng tế ban để trói tất cả những người kêu cầu danh Ngài.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “khẩn cầu danh Ngài.” Cụm từ Hy Lạp này là một thành ngữ Kinh Thánh quen thuộc, chỉ việc kêu cầu hoặc khẩn cầu một ai đó, thường trong lời cầu nguyện.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὧδε
  choice: tại đây
  rationale: Trạng từ chỉ nơi chốn; trong ngữ cảnh, A-na-nia nói đến thẩm quyền của Sau-lơ tại Đa-mách.
- source_word: ἔχει ἐξουσίαν παρὰ τῶν ἀρχιερέων
  choice: đã được các thượng tế trao thẩm quyền
  rationale: Diễn đạt tự nhiên trong tiếng Việt ý về thẩm quyền chính thức có nguồn từ giới lãnh đạo tư tế; παρά với sở hữu cách chỉ nguồn gốc.
- source_word: δῆσαι
  choice: để trói
  rationale: Giữ hình ảnh cụ thể của động từ Hy Lạp, đồng thời trong ngữ cảnh hàm ý bắt giữ.
- source_word: πάντας τοὺς ἐπικαλουμένους
  choice: tất cả những người kêu cầu
  rationale: Phân từ có mạo từ được dùng như danh từ. “Kêu cầu” bảo tồn thành ngữ Kinh Thánh về việc khẩn cầu hoặc cầu nguyện với một người.
- source_word: τὸ ὄνομά σου
  choice: danh Ngài
  rationale: Giữ nguyên hình thức thành ngữ của nguyên văn; “danh” có thể đại diện cho chính thân vị và thẩm quyền của Đấng được kêu cầu.
theological_decisions:
- issue: Ý nghĩa của cụm từ ἐπικαλουμένους τὸ ὄνομά σου khi nói với Chúa Giê-su
  choice: kêu cầu danh Ngài
  alternative: cầu nguyện với Ngài; khẩn cầu danh Ngài
  rationale: Cách dịch giữ sức nặng của hành vi khẩn cầu và lòng sùng kính hướng đến Chúa Giê-su, nhưng không thu hẹp thành chỉ việc nhận mình thuộc về Ngài hay mở rộng thành một diễn giải tín lý.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” vì lời này được thưa trực tiếp với Chúa Giê-su; dùng “thượng tế” theo cách gọi quen thuộc đối với giới lãnh đạo tư tế tại Giê-ru-sa-lem.
