source:
  edition: SBLGNT
  text: ἐλάλει τε καὶ συνεζήτει πρὸς τοὺς Ἑλληνιστάς· οἱ δὲ ἐπεχείρουν ⸂ἀνελεῖν αὐτόν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/029.yaml
  text: And he was speaking and debating with the Hellenists[a], but they were attempting to kill him.
translation:
  language: vi
  text: Ông nói chuyện và tranh luận với những người Do Thái nói tiếng Hy Lạp[a], nhưng họ tìm cách giết ông.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “những người Hy Lạp hóa.” Trong Công Vụ, thuật ngữ này thường chỉ những người Do Thái nói tiếng Hy Lạp.'
    reason: Giữ phương án dịch gần hình thức cho Ἑλληνισταί và nêu cách hiểu theo ngữ cảnh Công Vụ mà không biến diễn giải bối cảnh thành một khẳng định từ vựng tuyệt đối.
lexical_decisions:
- source_word: ἐλάλει
  choice: vẫn nói chuyện
  rationale: Thì vị hoàn biểu thị hoạt động đang tiếp diễn hoặc lặp lại; “vẫn nói chuyện” diễn đạt tự nhiên sắc thái kéo dài trong mạch kể.
- source_word: τε καὶ
  choice: và
  rationale: Liên kết hai hoạt động song song; “và” là cách diễn đạt tự nhiên, không làm câu nặng nề.
- source_word: συνεζήτει
  choice: tranh luận
  rationale: Động từ chỉ sự trao đổi mang tính tranh biện, không chỉ là trò chuyện trung tính; “tranh luận” phù hợp với ngữ cảnh đối đầu.
- source_word: πρὸς τοὺς Ἑλληνιστάς
  choice: với những người Do Thái nói tiếng Hy Lạp
  rationale: πρός với động từ tranh luận chỉ đối tượng tương tác; trong Công Vụ, Ἑλληνισταί hợp lý nhất là nhóm người Do Thái dùng tiếng Hy Lạp.
- source_word: οἱ δὲ
  choice: nhưng họ
  rationale: δέ đánh dấu sự tương phản giữa việc ông tranh luận và phản ứng thù địch của nhóm người kia.
- source_word: ἐπεχείρουν
  choice: tìm cách
  rationale: Thì vị hoàn gợi nỗ lực đang diễn ra; “tìm cách” vừa tự nhiên vừa thể hiện ý định được thực hiện nhưng chưa thành.
- source_word: ἀνελεῖν αὐτόν
  choice: giết ông
  rationale: Trong ngữ cảnh này, ἀναιρέω có nghĩa trực tiếp là giết hoặc làm cho chết; “giết ông” rõ ràng và hiện đại.
theological_decisions:
- issue: Danh tính của Ἑλληνιστάς
  choice: những người Do Thái nói tiếng Hy Lạp
  alternative: những người Hy Lạp hóa; người Hy Lạp
  rationale: Cách dùng trong Công Vụ, đặc biệt Công Vụ 6:1, chỉ một nhóm Do Thái khác biệt về ngôn ngữ và văn hóa, chứ không nhất thiết là dân ngoại. Bản dịch trực tiếp giúp độc giả hiện đại hiểu ngay mà không đồng nhất họ với người Hy Lạp nói chung.
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại. Dùng “ông” theo mạch quy chiếu đến Sau-lơ; “vẫn” hỗ trợ sắc thái tiếp diễn của các động từ vị hoàn. Thuật ngữ Ἑλληνισταί được diễn nghĩa trong chính văn để người đọc phổ thông hiểu ngay, đồng thời giữ phương án gần hình thức hơn trong chú thích.
