    rationale: Cụm “tức là” khẳng định trực tiếp nghĩa đầy đủ của thuật ngữ. Dù cách hiểu nhóm Do Thái nói tiếng Hy Lạp là rất phù hợp với cách dùng trong Công Vụ, chú thích nên giữ đây là cách hiểu thường gặp và vẫn bảo lưu tên gọi gần hình thức.
