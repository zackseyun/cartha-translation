  text: καὶ εὐθέως ἐν ταῖς συναγωγαῖς ἐκήρυσσεν τὸν ⸀Ἰησοῦν ὅτι οὗτός ἐστιν ὁ υἱὸς τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/020.yaml
  text: And immediately in the synagogues he began proclaiming Jesus[b][a], that he is the Son of God.
translation:
  language: vi
  text: Lập tức, ông rao giảng trong các hội đường rằng Đức Giê-su chính là Con Đức Chúa Trời[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Con của Đức Chúa Trời.” Động từ Hy Lạp có nghĩa là rao truyền hoặc loan báo công khai; cũng có thể diễn đạt: “ông công bố Đức Giê-su.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθέως
  choice: Ngay lập tức
  rationale: Diễn đạt rõ tính tức thời và sức đẩy của câu chuyện, đồng thời giữ văn phong trang trọng, tự nhiên.
- source_word: ἐν ταῖς συναγωγαῖς
  choice: trong các hội đường
  rationale: Giữ nghĩa địa điểm của ἐν và số nhiều của danh từ, cho thấy hoạt động diễn ra tại nhiều hội đường.
- source_word: ἐκήρυσσεν
  choice: bắt đầu công bố
  rationale: “Công bố” thể hiện hành động loan báo công khai của κηρύσσω. “Bắt đầu” diễn đạt tự nhiên sắc thái khởi đầu trong ngữ cảnh, dù thể chưa hoàn thành cũng có thể được hiểu là hành động đang tiếp diễn.
- source_word: τὸν Ἰησοῦν
  choice: về Đức Giê-su
  rationale: Tiếng Việt thường cần “về” sau “công bố” khi đối tượng là nội dung được rao truyền; cách này tự nhiên hơn “công bố Đức Giê-su” mà không làm đổi trọng tâm hướng về Đức Giê-su.
- source_word: ὅτι
  choice: rằng
  rationale: Dẫn vào nội dung lời công bố một cách trực tiếp và tự nhiên.
- source_word: οὗτός
  choice: chính Ngài
  rationale: “Chính” giữ lực nhấn mạnh, xác định của đại từ chỉ định; “Ngài” chỉ lại Đức Giê-su một cách rõ ràng và phù hợp với văn phong Kinh Thánh trang trọng.
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: Con Đức Chúa Trời
  rationale: Giữ nguyên tước hiệu Kitô học và quan hệ sở thuộc của cụm Hy Lạp, không diễn giải thêm.
theological_decisions:
- issue: Tước hiệu Kitô học trong lời công bố của Sau-lơ
  choice: Con Đức Chúa Trời
  alternative: Con của Đức Chúa Trời
  rationale: “Con Đức Chúa Trời” là cách diễn đạt gọn, trang trọng và trực tiếp cho ὁ υἱὸς τοῦ θεοῦ, bảo toàn lời khẳng định Kitô học mà không mở rộng ý nghĩa.
- issue: Lực xác định của οὗτός
  choice: chính Ngài
  alternative: Ngài
  rationale: Thêm “chính” bảo toàn sắc thái nhấn mạnh rằng Đức Giê-su vừa được nêu chính là Con Đức Chúa Trời, nhưng không biến câu thành một diễn giải thần học rộng hơn.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “hội đường” cho συναγωγή và “Đức Giê-su” theo văn phong Kinh Thánh phổ thông. Cấu trúc được điều chỉnh vừa đủ để tự nhiên trong tiếng Việt, đồng thời giữ số nhiều, tính tức thời, hành động công bố công khai và lực nhấn mạnh của οὗτός.
