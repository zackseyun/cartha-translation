revisions:
- from: Ngay lập tức, trong các hội đường, ông bắt đầu công bố về Đức Giê-su[a] rằng chính Ngài là Con Đức Chúa Trời[b].
  to: Lập tức, ông rao giảng trong các hội đường rằng Đức Giê-su chính là Con Đức Chúa Trời[a].
  rationale: 'Bỏ "bắt đầu" để không áp đặt một cách hiểu riêng về thể chưa hoàn thành. Tái cấu trúc câu theo cú pháp Việt ngữ tự nhiên, đồng thời giữ nguyên ý nghĩa: Sau-lơ lập tức rao giảng tại nhiều hội đường rằng Đức Giê-su, chính Đấng được nêu đến, là Con Đức Chúa Trời. Gộp chú thích vào một neo tại tước hiệu để tránh neo riêng cho một từ không còn xuất hiện như đối tượng trực tiếp trong cấu trúc câu Việt.'
