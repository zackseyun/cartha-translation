source:
  edition: SBLGNT
  text: δοὺς δὲ αὐτῇ χεῖρα ἀνέστησεν αὐτήν, φωνήσας δὲ τοὺς ἁγίους καὶ τὰς χήρας παρέστησεν αὐτὴν ζῶσαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/041.yaml
  text: And giving her his hand[a], he raised her up; then he called the saints and the widows and presented her alive.
translation:
  language: vi
  text: Ông đưa tay cho bà rồi đỡ bà đứng dậy[a]. Rồi ông gọi các thánh và các góa phụ đến, đưa bà còn sống ra trước mặt họ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “làm cho bà trỗi dậy” hay “giúp bà đứng lên.” Động từ Hy Lạp có thể chỉ việc khiến một người trỗi dậy hoặc đứng lên, và trong bối cảnh này cũng gợi âm hưởng phục sinh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δοὺς ... χεῖρα
  choice: đưa tay cho bà
  rationale: Diễn đạt tự nhiên hành động Phi-e-rơ chìa tay ra để giúp Ta-bi-tha đứng lên, đồng thời theo sát cấu trúc Hy Lạp hơn cách nói có thể hàm ý nắm tay.
- source_word: ἀνέστησεν
  choice: đỡ bà đứng dậy
  rationale: Động từ có thể chỉ việc khiến một người đứng lên hoặc trỗi dậy. Trong mạch văn, Ta-bi-tha đã sống lại ở câu trước, nên cách dịch này diễn tả hành động trực tiếp mà vẫn giữ chú thích về âm hưởng phục sinh.
- source_word: φωνήσας
  choice: gọi ... đến
  rationale: Phân từ bất định quá khứ chỉ hành động gọi họ đến trước khi Phi-e-rơ trình diện bà; thêm “đến” làm rõ ý triệu tập một cách tự nhiên trong tiếng Việt.
- source_word: τοὺς ἁγίους
  choice: các thánh đồ
  rationale: Đây là danh xưng Tân Ước dành cho dân thánh của Đức Chúa Trời. “Các thánh đồ” vừa trực tiếp vừa quen thuộc, tránh diễn giải thành “các tín hữu”.
- source_word: τὰς χήρας
  choice: các góa phụ
  rationale: Giữ nguyên nhóm được nêu riêng vì họ có vai trò nổi bật trong mạch truyện ngay trước đó.
- source_word: παρέστησεν
  choice: trình diện bà trước mặt họ
  rationale: παρίστημι ở đây có nghĩa đưa hoặc đặt một người ra trước mặt những người khác. Cách diễn đạt này làm rõ đối tượng tiếp nhận được hàm ý trong câu Hy Lạp.
- source_word: ζῶσαν
  choice: khi bà đang sống
  rationale: Phân từ mang chức năng vị ngữ, cho biết tình trạng sống của bà khi được đưa ra trước mọi người; bản dịch nhấn mạnh rõ sự tương phản với cái chết trước đó.
theological_decisions:
- issue: Sắc thái phục sinh của ἀνέστησεν trong bối cảnh tường thuật
  choice: đỡ bà đứng dậy, kèm chú thích về nghĩa “làm cho bà trỗi dậy”
  alternative: làm cho bà trỗi dậy / khiến bà đứng lên
  rationale: Câu trước đã thuật lại việc bà mở mắt và ngồi dậy; tại đây động từ mô tả Phi-e-rơ dùng tay giúp bà đứng lên, nhưng cũng có thể vang âm ngôn ngữ phục sinh. Bản chính ưu tiên hành động trước mắt, còn chú thích bảo tồn chiều kích từ vựng và thần học mà không đồng nhất hành động của Phi-e-rơ với quyền làm người chết sống lại.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ông/bà” theo lối kể chuyện tự nhiên; giữ thuật ngữ “thánh đồ” để phản ánh trực tiếp οἱ ἅγιοι. Dấu chú thích [a] được đặt ngay sau cụm từ liên quan.
