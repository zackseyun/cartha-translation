  to: Ông đưa tay cho bà rồi đỡ bà đứng dậy[a]. Rồi ông gọi các thánh và các góa phụ đến, đưa bà còn sống ra trước mặt họ.
  rationale: Bản sửa chuyển ký hiệu chú thích đến đúng động từ ἀνέστησεν, thay cách diễn đạt ít tự nhiên bằng cấu trúc tiếng Việt rõ ràng hơn cho παρέστησεν αὐτὴν ζῶσαν, và dùng “các thánh” như cách dịch trực tiếp, trung tính của τοὺς ἁγίους. Nghĩa và sắc thái phục sinh có thể có của ἀνέστησεν được giữ trong chú thích mà không áp đặt diễn giải giáo phái.
