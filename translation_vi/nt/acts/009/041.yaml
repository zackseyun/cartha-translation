  source_fidelity: 'Bản dịch nhìn chung phản ánh đúng trình tự và các thành tố chính của câu Hy Lạp: Phi-e-rơ đưa tay, làm bà đứng dậy, gọi các thánh và các góa phụ, rồi đưa bà ra trước họ trong tình trạng còn sống. Tuy nhiên, chú thích về ἀνέστησεν đang được neo vào “bà”, là từ không tương ứng với động từ được chú thích.'
