  terminology: “Các thánh” là cách dịch trực tiếp, trung tính và phù hợp với τοὺς ἁγίους trong ngữ cảnh này. “Các thánh đồ” quen thuộc trong một số truyền thống, nhưng có sắc thái thuật ngữ giáo hội hơn và kém trung tính đối với bản tiếng Việt chuẩn hiện đại.
