revisions:
- from: Khi đến Giê-ru-sa-lem, ông tìm cách hòa nhập với các môn đồ[a], nhưng tất cả đều sợ ông vì không tin rằng ông là một môn đồ.
  to: Khi đến Giê-ru-sa-lem, ông tìm cách gắn bó với các môn đồ[a], nhưng tất cả họ đều sợ ông, vì không tin ông là môn đồ.
  rationale: Thay “hòa nhập với” bằng “gắn bó với” để phản ánh sát hơn κολλᾶσθαι mà không áp đặt khái niệm tư cách thành viên chính thức hay sự hội nhập đã hoàn tất. Thêm “họ” để làm rõ quy chiếu của “tất cả,” và bỏ “một” trước “môn đồ” cho tự nhiên trong tiếng Việt. Quan hệ nguyên nhân của μὴ πιστεύοντες vẫn được giữ bằng “vì không tin.”
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T09:17:15Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch phản ánh đúng trình tự và ý chính của câu Hy Lạp: Sau khi đến Giê-ru-sa-lem, ông liên tục cố gắng liên kết với các môn đồ; họ đều sợ ông vì không tin ông là môn đồ. Tuy nhiên, “hòa nhập” dễ gợi tiến trình thích nghi/được hội nhập vào một tập thể hơn là hành động προσπάθεια κολλᾶσθαι, tức cố gắng gắn bó hay kết hợp với họ.'
  naturalness: Câu văn nhìn chung tự nhiên. “Tất cả đều sợ ông” rõ nghĩa, nhưng thêm “họ” giúp quy chiếu trực tiếp về các môn đồ và làm câu mạch lạc hơn. “Tìm cách gắn bó với” vừa tự nhiên trong tiếng Việt hiện đại vừa sát ngữ cảnh hơn “hòa nhập với.”
  terminology: “Giê-ru-sa-lem” và “môn đồ” nhất quán với văn phong Kinh Thánh tiếng Việt. “Môn đồ” ở cuối câu nên không cần mạo từ “một”; tiếng Việt tự nhiên hơn khi nói “ông là môn đồ.” Chú thích nên nêu phương án từ vựng gần nghĩa mà không lặp lại gần như nguyên văn cách dịch chính.
  issues:
  - severity: medium
    issue: “hòa nhập với” diễn giải κολλᾶσθαι quá xa.
    rationale: κολλᾶσθαι có nghĩa gắn mình vào, kết hợp/gắn bó với. Trong bối cảnh này, “hòa nhập” có thể hàm ý một tiến trình hội nhập đã được cộng đồng tiếp nhận, trong khi động từ nhấn mạnh nỗ lực của ông nhằm liên kết với các môn đồ.
  - severity: low
