id: ACT.9.26
reference: Acts 9:26
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Παραγενόμενος δὲ ⸀εἰς Ἰερουσαλὴμ ⸀ἐπείραζεν κολλᾶσθαι τοῖς μαθηταῖς· καὶ πάντες ἐφοβοῦντο αὐτόν, μὴ πιστεύοντες ὅτι ἐστὶν μαθητής.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/026.yaml
  text: And when he came to Jerusalem[a], he was trying to join the disciples, but they were all afraid of him, not believing that he was a disciple.
translation:
  language: vi
  text: Khi đến Giê-ru-sa-lem, ông tìm cách gắn bó với các môn đồ[a], nhưng tất cả họ đều sợ ông, vì không tin ông là môn đồ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “kết hợp chặt chẽ với các môn đồ.”'
    reason: κολλᾶσθαι có thể chỉ việc gắn mình vào hoặc kết hợp mật thiết với một nhóm; phương án này giữ sắc thái gần với nghĩa từ vựng hơn.
lexical_decisions:
- source_word: Παραγενόμενος
  choice: Khi đến
  rationale: Phân từ bất định quá khứ nêu hoàn cảnh xảy ra trước hành động chính; cách dịch này tự nhiên trong tiếng Việt và giữ rõ quan hệ thời gian.
- source_word: δὲ
  choice: lược dịch trong mạch kể
  rationale: δέ là từ nối nhẹ để tiếp diễn câu chuyện. Tiếng Việt không cần một liên từ riêng ở đây; mở đầu bằng “Khi” tạo mạch kể tự nhiên mà không thêm sắc thái tương phản.
- source_word: εἰς Ἰερουσαλήμ
  choice: đến Giê-ru-sa-lem
  rationale: εἰς chỉ hướng đến một thành phố; “đến” là cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: ἐπείραζεν
  choice: tìm cách
  rationale: Thì chưa hoàn thành diễn tả nỗ lực đang tiếp diễn. “Tìm cách” truyền đạt ý cố gắng mà không mang nghĩa thử thách hay cám dỗ.
- source_word: κολλᾶσθαι
  choice: hòa nhập với
  rationale: Động từ có nghĩa căn bản là gắn vào hoặc kết hợp với. Trong bối cảnh xã hội này, “hòa nhập với” diễn tả nỗ lực được đón nhận và giao kết với nhóm môn đồ, nhưng không áp đặt khái niệm thành viên chính thức.
- source_word: τοῖς μαθηταῖς
  choice: các môn đồ
  rationale: Chỉ nhóm môn đồ đã được biết đến tại Giê-ru-sa-lem; “các môn đồ” là cách gọi rõ ràng và quen thuộc.
- source_word: καὶ πάντες ἐφοβοῦντο αὐτόν
  choice: nhưng tất cả đều sợ ông
  rationale: καί dẫn sang diễn biến đối nghịch với nỗ lực của Sau-lơ, nên “nhưng” diễn đạt quan hệ trong văn cảnh tự nhiên. Thì chưa hoàn thành được chuyển bằng trạng thái “đều sợ”.
- source_word: μὴ πιστεύοντες
  choice: vì không tin
  rationale: Phân từ hiện tại phủ định nêu nguyên nhân khiến họ sợ; “vì” làm rõ quan hệ này trong tiếng Việt mà không thay đổi nội dung.
- source_word: ὅτι ἐστὶν μαθητής
  choice: rằng ông là một môn đồ
  rationale: Tiếng Việt không cần lùi thì trong lời gián tiếp; “là” giữ tự nhiên giá trị hiện tại của ἐστίν.
- source_word: μαθητής
  choice: môn đồ
  rationale: “Môn đồ” là thuật ngữ Việt ngữ quen thuộc, chỉ người học và đi theo, đồng thời giữ sự nhất quán trong sách Công Vụ.
theological_decisions:
- issue: Bản chất mối liên hệ Sau-lơ tìm kiếm với các tín hữu tại Giê-ru-sa-lem
  choice: hòa nhập với các môn đồ
  alternative: gắn mình với các môn đồ
  rationale: Bản văn mô tả nỗ lực của Sau-lơ nhằm được chấp nhận và giao kết với cộng đồng môn đồ, chứ không xác định một nghi thức hay tư cách thành viên giáo hội theo nghĩa thể chế về sau. Cách dịch giữ sắc thái xã hội và cộng đồng mà không giải quyết quá mức bản chất của sự liên kết ấy.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Đại từ “ông” phù hợp khi thuật lại về Sau-lơ. Dấu chú thích [a] được đặt ngay sau cụm từ mà chú thích giải thích.
