id: ACT.9.30
reference: Acts 9:30
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐπιγνόντες δὲ οἱ ἀδελφοὶ κατήγαγον αὐτὸν εἰς Καισάρειαν καὶ ἐξαπέστειλαν αὐτὸν εἰς Ταρσόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/030.yaml
  text: When the brothers learned this[a], they brought him down to Caesarea and sent him off to Tarsus.
translation:
  language: vi
  text: Khi các anh em biết chuyện ấy[a], họ đưa ông xuống Sê-sa-rê rồi tiễn ông đi Tạt-sơ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “các anh chị em”. Tiếng Hy Lạp nói “các anh em”, nhưng trong ngữ cảnh này, từ ấy có thể chỉ cộng đồng tín hữu nói chung.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιγνόντες
  choice: biết chuyện ấy
  rationale: Phân từ bất định quá khứ nêu hoàn cảnh dẫn đến các hành động chính. Tân ngữ được hiểu ngầm từ câu trước, nên thêm “chuyện ấy” để câu tiếng Việt tự nhiên và rõ nghĩa.
- source_word: οἱ ἀδελφοὶ
  choice: các anh em
  rationale: Giữ hình thức giống đực số nhiều của tiếng Hy Lạp bằng cách diễn đạt tự nhiên trong tiếng Việt; chú thích nêu khả năng từ này chỉ cộng đồng tín hữu nói chung.
- source_word: κατήγαγον
  choice: đưa ông xuống
  rationale: Giữ sắc thái phương hướng của κατάγω, ở đây là đi xuống Sê-sa-rê, thành phố ven biển.
- source_word: Καισάρειαν
  choice: Sê-sa-rê
  rationale: Dùng dạng phiên âm quen thuộc trong Kinh Thánh tiếng Việt cho địa danh Caesarea.
- source_word: ἐξαπέστειλαν
  choice: tiễn ông đi
  rationale: Diễn đạt tự nhiên ý sai đi khỏi nơi ấy hoặc cho lên đường; “tiễn” cũng phù hợp với việc các tín hữu giúp ông tiếp tục hành trình, nhưng không thêm phương tiện di chuyển vốn không được bản văn nêu.
- source_word: Ταρσόν
  choice: Tạt-sơ
  rationale: Dùng dạng phiên âm tiếng Việt rõ ràng cho địa danh Tarsus.
theological_decisions:
- issue: Phạm vi quy chiếu của ἀδελφοί trong một cộng đồng có thể gồm cả nam lẫn nữ
  choice: các anh em
  alternative: các anh chị em; các tín hữu
  rationale: Bản văn chính giữ dạng giống đực số nhiều của nguyên ngữ, còn chú thích bảo tồn khả năng từ này được dùng rộng hơn để chỉ cộng đồng những người tin.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. “Khi… biết chuyện ấy” liên kết tự nhiên với mối đe dọa trong câu trước; “đưa… xuống” giữ phương hướng địa lý, còn “tiễn… đi” tránh lối dịch cứng.
source_grounding:
  english_pob_role: consult_only
