  source_fidelity: 'Bản dịch theo sát cấu trúc và ý nghĩa của câu Hy Lạp: phân từ ἐπιγνόντες được diễn đạt tự nhiên là “Khi ... biết chuyện ấy”; κατήγαγον giữ được sắc thái hướng xuống trong “đưa ông xuống”; và ἐξαπέστειλαν được chuyển đạt phù hợp bằng “tiễn ông đi”. Tân ngữ ngầm của “biết” được cung cấp bằng “chuyện ấy” mà không thêm nội dung mới.'
