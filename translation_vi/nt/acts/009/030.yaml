  terminology: “Các anh em” phản ánh trực tiếp οἱ ἀδελφοὶ, đồng thời chú thích nêu đúng khả năng cách dùng rộng hơn để chỉ cộng đồng tín hữu. “Sê-sa-rê” và “Tạt-sơ” là các dạng phiên âm Kinh Thánh Việt ngữ thông dụng. Không có vấn đề thần học hoặc thuật ngữ cần sửa.
