  source_fidelity: 'Bản dịch chuyển tải đúng các ý chính: Sau-lơ đứng dậy từ mặt đất, không thấy gì dù mắt mở, và được dẫn vào Đa-mách. Tuy nhiên, cụm “dù mắt ông mở” chưa tự nhiên trong tiếng Việt hiện đại; cần diễn đạt rõ tình trạng mắt đang mở mà vẫn không thấy.'
  naturalness: “Mắt ông mở” thiếu tự nhiên vì tiếng Việt thường cần nêu trạng thái bằng “mắt ông đang mở” hoặc một cấu trúc tương đương. “Họ cầm tay dẫn ông” tự nhiên hơn “họ nắm tay dẫn ông” và vẫn giữ hình ảnh cụ thể của χειραγωγοῦντες.
  terminology: Tên riêng “Sau-lơ” và “Đa-mách” phù hợp lối phiên âm Kinh Thánh Việt ngữ quen dùng. Không có thuật ngữ thần học đặc biệt trong câu này.
