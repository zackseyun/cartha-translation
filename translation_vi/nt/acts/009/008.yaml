  - severity: low
    issue: Cụm “họ nắm tay dẫn ông” hơi gượng.
    rationale: “Cầm tay dẫn ông” là cách nói tự nhiên hơn trong tiếng Việt, đồng thời vẫn phản ánh nghĩa dẫn bằng tay của χειραγωγοῦντες.
  revised_text: Nhưng Sau-lơ đứng dậy khỏi mặt đất; dù mắt ông đang mở, ông vẫn không thấy gì. Vì thế, họ cầm tay dẫn ông vào Đa-mách.
