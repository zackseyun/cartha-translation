source:
  edition: SBLGNT
  text: ἠγέρθη δὲ ⸀Σαῦλος ἀπὸ τῆς γῆς, ἀνεῳγμένων ⸀δὲ τῶν ὀφθαλμῶν αὐτοῦ ⸀οὐδὲν ἔβλεπεν· χειραγωγοῦντες δὲ αὐτὸν εἰσήγαγον εἰς Δαμασκόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/008.yaml
  text: But Saul got up from the ground[a], and though his eyes were open, he saw nothing. So they led him by the hand and brought him into Damascus.
translation:
  language: vi
  text: Nhưng Sau-lơ đứng dậy khỏi mặt đất; dù mắt ông đang mở, ông vẫn không thấy gì. Vì thế, họ cầm tay dẫn ông vào Đa-mách.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἠγέρθη
  choice: đứng dậy
  rationale: 'Động từ aorist thụ động của ἐγείρω ở đây được dùng theo nghĩa nội động trong mạch kể chuyện: Sau-lơ đứng lên sau khi ngã xuống đất.'
- source_word: ἀπὸ τῆς γῆς
  choice: khỏi mặt đất
  rationale: Trong cảnh này, γῆ chỉ bề mặt đất nơi Sau-lơ đã ngã xuống, không phải trái đất hay một vùng đất.
- source_word: ἀνεῳγμένων ... τῶν ὀφθαλμῶν αὐτοῦ
  choice: dù mắt ông mở
  rationale: Kết cấu sở hữu cách tuyệt đối diễn tả hoàn cảnh đi kèm; ngữ cảnh làm nổi bật sự tương phản đầy nghịch lý giữa mắt đang mở và việc không thấy gì.
- source_word: οὐδὲν ἔβλεπεν
  choice: ông vẫn không thấy gì
  rationale: Cách diễn đạt tự nhiên, giữ nguyên ý hoàn toàn không nhìn thấy; từ “vẫn” làm rõ sự tương phản do ngữ cảnh hàm chứa mà không thêm nội dung mới.
- source_word: χειραγωγοῦντες
  choice: nắm tay dẫn ông
  rationale: χειραγωγέω chỉ việc dẫn một người bằng tay, đặc biệt khi người ấy cần được hướng dẫn; cụm này giữ hình ảnh cụ thể của nguyên văn.
- source_word: εἰσήγαγον εἰς Δαμασκόν
  choice: dẫn ông vào Đa-mách
  rationale: εἰσάγω diễn tả đưa hoặc dẫn vào một nơi; trong tiếng Việt, “dẫn ... vào” kết hợp tự nhiên với hành động nắm tay ở mệnh đề trước.
- source_word: δὲ
  choice: Nhưng / Vì thế
  rationale: Ba lần δέ đánh dấu bước chuyển và tương phản nhẹ trong trình thuật. Không cần chuyển dịch máy móc từng lần; “Nhưng” mở đầu sự chuyển cảnh, còn “Vì thế” diễn đạt hành động tiếp theo phát sinh từ tình trạng mù của Sau-lơ.
- source_word: Σαῦλος
  choice: Sau-lơ
  rationale: Phiên âm tên riêng theo lối quen thuộc và dễ đọc trong tiếng Việt.
- source_word: Δαμασκόν
  choice: Đa-mách
  rationale: Phiên âm địa danh theo lối Kinh Thánh tiếng Việt quen thuộc.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Bản dịch giữ sự tương phản của nguyên văn giữa mắt mở và không thấy, đồng thời bảo toàn hình ảnh cụ thể về việc Sau-lơ được nắm tay dẫn đi.
