source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτῷ ὁ Πέτρος· Αἰνέα, ἰᾶταί σε Ἰησοῦς ⸀Χριστός· ἀνάστηθι καὶ στρῶσον σεαυτῷ· καὶ εὐθέως ἀνέστη.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/034.yaml
  text: And Peter said to him[a], “Aeneas, Jesus the Messiah heals you[b]. Get up and make your bed.” And immediately he got up.
translation:
  language: vi
  text: 'Phi-e-rơ nói với ông: “Ê-nê, Giê-su, Đấng Mê-si, chữa lành cho ông. Hãy đứng dậy và tự dọn chỗ nằm.” Ngay lập tức, ông đứng dậy.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰᾶταί
  choice: chữa lành cho ông
  rationale: Thì hiện tại của ἰάομαι trong lời tuyên bố trực tiếp mang lực thực hiện; cách dịch này giữ nguyên hiện tại mà không ép nghĩa thành đang diễn tiến hay đã hoàn tất.
- source_word: Χριστός
  choice: Đấng Mê-si
  rationale: Ở đây Χριστός hoạt động như tước hiệu của Chúa Giê-su; “Đấng Mê-si” truyền đạt nghĩa tước hiệu tự nhiên trong tiếng Việt.
- source_word: ἀνάστηθι
  choice: Hãy đứng dậy
  rationale: Mệnh lệnh aorist của ἀνίστημι, phù hợp với lời truyền cho người đang nằm liệt đứng dậy.
- source_word: στρῶσον σεαυτῷ
  choice: tự dọn chỗ nằm của mình
  rationale: στρώννυμι chỉ việc trải hoặc sửa soạn chỗ nằm, còn σεαυτῷ nhấn mạnh chính Ê-nê nay có thể tự làm việc đó. “Chỗ nằm” tránh mặc định đó là giường theo kiểu hiện đại.
- source_word: εὐθέως
  choice: ngay lập tức
  rationale: Diễn đạt trực tiếp hành động xảy ra tức khắc.
- source_word: ἀνέστη
  choice: ông đứng dậy
  rationale: Lặp lại tự nhiên động từ trong mệnh lệnh và thuật lại kết quả tức thì.
- source_word: Αἰνέα
  choice: Ê-nê
  rationale: Phiên âm tên riêng theo cách gọi quen thuộc, dễ đọc trong tiếng Việt.
theological_decisions:
- issue: Cách dịch Χριστός trong lời tuyên bố chữa lành
  choice: Chúa Giê-su, Đấng Mê-si
  alternative: Chúa Giê-su Christ
  rationale: Giữ rõ Χριστός là tước hiệu mang nghĩa “Đấng Mê-si”, chứ không mặc nhiên biến thành phần tên riêng; dấu phẩy làm câu tiếng Việt tự nhiên và minh thị quan hệ đồng vị.
- issue: Chủ thể thực hiện sự chữa lành
  choice: Chúa Giê-su, Đấng Mê-si, chữa lành cho ông
  alternative: Ông được Chúa Giê-su, Đấng Mê-si, chữa lành
  rationale: Giữ Chúa Giê-su làm chủ ngữ ngữ pháp như bản Hy Lạp, nhấn mạnh Ngài là tác nhân chữa lành mà không thêm giải thích thần học.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ông” cho đại từ số ít trong lời nói và lời kể; “tự dọn chỗ nằm của mình” bảo toàn sắc thái phản thân của σεαυτῷ mà không dùng lối nói cổ.
