  verdict: revise
  source_fidelity: 'Bản nháp truyền đạt đúng ý Sau-lơ tiếp tục ở cùng nhóm môn đồ tại Giê-ru-sa-lem, đi lại công khai giữa họ, và nói cách mạnh dạn nhân danh Chúa. Tuy nhiên, «rao giảng» cụ thể hóa động từ παρρησιαζόμενος quá mức: động từ này trước hết nói đến việc phát ngôn công khai/can đảm, không tự nó xác định hoạt động ấy là rao giảng.'
  naturalness: Câu văn tự nhiên, trang trọng và phù hợp tiếng Việt hiện đại. «Đi lại giữa họ» là cách diễn đạt thông suốt cho cặp thành ngữ «đi vào và đi ra» trong ngữ cảnh sự giao tiếp, qua lại thường xuyên.
  terminology: «Sau-lơ», «Giê-ru-sa-lem», «nhân danh», và «Chúa» đều thích hợp. Giữ «Chúa» bảo toàn tước hiệu κύριος, không thay bằng tên riêng. Thay «rao giảng» bằng «nói» để không thêm nội dung vào động từ Hy Lạp.
