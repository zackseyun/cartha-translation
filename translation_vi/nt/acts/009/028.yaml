    rationale: παρρησιαζόμενος chỉ việc nói/phát ngôn cách mạnh dạn, công khai và thẳng thắn. Dù bối cảnh Công Vụ có thể bao hàm công bố sứ điệp, nguyên văn câu này không dùng một động từ riêng nghĩa là «rao giảng»; «nói» giữ được độ rộng nghĩa của nguồn.
