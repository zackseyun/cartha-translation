  text: καὶ ἦν μετ’ αὐτῶν εἰσπορευόμενος ⸂καὶ ἐκπορευόμενος⸃ εἰς ⸀Ἰερουσαλήμ, παρρησιαζόμενος ἐν τῷ ὀνόματι τοῦ ⸀κυρίου,
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/028.yaml
  text: And he was with them in Jerusalem, going in and going out, speaking boldly in the name of the Lord.
translation:
  language: vi
  text: Sau-lơ ở cùng các môn đồ tại Giê-ru-sa-lem, đi lại giữa họ và mạnh dạn nói nhân danh Chúa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἦν μετ’ αὐτῶν
  choice: ở cùng các môn đồ
  rationale: Diễn tả sự gắn bó liên tục của Sau-lơ với nhóm đã được nhắc đến trong ngữ cảnh. Bổ sung “các môn đồ” để đại từ số nhiều được tự nhiên và rõ nghĩa trong câu độc lập, không hàm ý mạnh hơn rằng ông cư trú tại đó.
- source_word: εἰσπορευόμενος καὶ ἐκπορευόμενος
  choice: đi lại giữa họ
  rationale: Cặp phân từ là một thành ngữ chỉ việc tự do qua lại và sinh hoạt thường xuyên trong cộng đồng. “Đi lại giữa họ” tự nhiên trong tiếng Việt hơn lối dịch sát “đi vào và đi ra” mà vẫn giữ ý chuyển động lặp lại và sự giao kết công khai.
- source_word: εἰς Ἰερουσαλήμ
  choice: tại Giê-ru-sa-lem
  rationale: Trong cấu trúc này, εἰς có chức năng gần như chỉ phạm vi nơi chốn; “tại” tránh gây ấn tượng rằng Sau-lơ cứ nhiều lần đi vào thành.
- source_word: παρρησιαζόμενος
  choice: mạnh dạn rao giảng
  rationale: Động từ chỉ việc nói công khai, thẳng thắn và không sợ hãi. Trong mạch sách Công Vụ, nội dung là sự công bố sứ điệp, nên “rao giảng” tự nhiên hơn “nói” mà vẫn giữ sắc thái can đảm nhờ “mạnh dạn”.
- source_word: ἐν τῷ ὀνόματι
  choice: nhân danh
  rationale: Cách nói trang trọng, tự nhiên trong tiếng Việt, bảo lưu các sắc thái hành động theo thẩm quyền, đại diện và xưng nhận, thay vì thu hẹp vào riêng một ý.
- source_word: τοῦ κυρίου
  choice: Chúa
  rationale: Giữ nguyên tước hiệu κύριος; ngữ cảnh quy chiếu đến Chúa Giê-su nhưng bản dịch không thay tước hiệu bằng tên riêng.
theological_decisions:
- issue: Đối tượng được gọi là “Chúa”
  choice: Giữ tước hiệu “Chúa” trong chính văn
  alternative: Dịch rõ thành “Chúa Giê-su” hoặc “Giê-su”
  rationale: Nguyên văn có κυρίου chứ không có Ἰησοῦ. Giữ tước hiệu bảo toàn cách diễn đạt và chiều kích thần học của Lu-ca–Công Vụ, đồng thời không giải quyết thay người đọc điều mà ngữ cảnh đã cho thấy.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Sau-lơ” và “Giê-ru-sa-lem” theo dạng tên riêng Kinh Thánh quen thuộc trong tiếng Việt. Không cần chú thích vì không có điểm dị bản hay sự mơ hồ nào cần giải thích ngoài chính văn.
