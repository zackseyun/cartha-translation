revisions:
- from: Sau-lơ ở cùng các môn đồ tại Giê-ru-sa-lem, đi lại giữa họ và mạnh dạn rao giảng nhân danh Chúa.
  to: Sau-lơ ở cùng các môn đồ tại Giê-ru-sa-lem, đi lại giữa họ và mạnh dạn nói nhân danh Chúa.
  rationale: Chỉ thay «rao giảng» bằng «nói» để bảo toàn nghĩa rộng của παρρησιαζόμενος. Những lựa chọn còn lại giữ được ý nghĩa liên tục của «ở cùng», sắc thái qua lại thường xuyên của cặp «đi vào và đi ra», phạm vi tại Giê-ru-sa-lem, và thành ngữ «nhân danh Chúa».
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T09:17:13Z'
