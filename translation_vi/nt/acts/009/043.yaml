translation_notes:
  register: Văn phong kể chuyện trang trọng vừa phải, hiện đại và dễ hiểu. Nêu rõ Phi-e-rơ theo chủ ngữ hàm ẩn từ ngữ cảnh trước; giữ tên riêng theo lối phiên âm tiếng Việt phổ biến. Dấu chú thích [a] được đặt ngay sau tên Si-môn, nơi phát sinh phương án dịch.
