  yaml_path: translation/nt/acts/009/043.yaml
  text: And he stayed in Joppa for many days with a certain Simon[a], a tanner.
translation:
  language: vi
  text: Phi-e-rơ ở lại Giốp-bê nhiều ngày, với một người tên là Si-môn[a], làm nghề thuộc da.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “tại nhà một người tên là Si-môn.” Giới từ Hy Lạp có thể chỉ việc lưu trú với một người hoặc tại nhà người ấy.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ... μεῖναι
  choice: Phi-e-rơ ở lại
  rationale: Cấu trúc ἐγένετο với động từ nguyên mẫu là một lối diễn đạt tự nhiên trong tiếng Hy Lạp; tiếng Việt truyền đạt gọn và rõ bằng động từ chính “ở lại”. Chủ ngữ Phi-e-rơ được nêu lại từ ngữ cảnh để câu đứng riêng vẫn sáng nghĩa.
- source_word: δὲ
  choice: không dịch riêng
  rationale: δέ là liên từ nhẹ tiếp nối mạch kể. Trong tiếng Việt, sự tiếp nối đã tự nhiên qua trật tự câu, nên thêm “và” hoặc “rồi” là không cần thiết.
- source_word: ἡμέρας ἱκανὰς
  choice: nhiều ngày
  rationale: ἱκανός đi với đơn vị thời gian chỉ một khoảng thời gian đáng kể; “nhiều ngày” vừa chính xác vừa tự nhiên.
- source_word: ἐν Ἰόππῃ
  choice: ở lại Gióp-bê
  rationale: ἐν xác định địa điểm lưu lại. “Gióp-bê” là dạng phiên âm quen dùng trong tiếng Việt của địa danh Ἰόππη.
- source_word: παρά τινι Σίμωνι
  choice: tại nhà một người tên là Si-môn
  rationale: παρά với cách dữ cách trong ngữ cảnh lưu trú có thể chỉ ở với một người hoặc tại nhà người ấy. Cách dịch này diễn đạt tự nhiên sắc thái chỗ trọ, còn τινι được thể hiện bằng “một người tên là” mà không hàm ý khinh suất.
- source_word: βυρσεῖ
  choice: làm nghề thuộc da
  rationale: βυρσεύς chỉ người xử lý da thú để làm da thuộc. “Làm nghề thuộc da” chính xác và dễ hiểu hơn danh từ nghề nghiệp ít thông dụng “thợ thuộc da” trong câu này.
