  to: Phi-e-rơ ở lại Giốp-bê nhiều ngày, với một người tên là Si-môn[a], làm nghề thuộc da.
  rationale: Đổi “tại nhà” thành “với” để không áp đặt một sắc thái duy nhất cho παρά + dữ cách, đồng thời giữ phương án “tại nhà” trong chú thích. Chuẩn hóa địa danh thành “Giốp-bê”. Các thành phần khác của bản nháp đều trung thành với nguyên ngữ và tự nhiên trong tiếng Việt hiện đại.
