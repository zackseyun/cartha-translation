base_translation:
  language: en
  yaml_path: translation/nt/acts/009/005.yaml
  text: And he said[a], “Who are you, Lord?” And he said, “I am Jesus, whom you are persecuting.”
translation:
  language: vi
  text: 'Ông hỏi: “Lạy Chúa[a], Ngài là ai?” Người ấy đáp: “Ta là Giê-su, người mà ngươi đang bắt bớ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “thưa ngài”. Từ Hy Lạp κύριε có thể là cách xưng hô kính trọng; ở đây dịch là “Lạy Chúa” theo cách dịch thông thường của κύριος và trong bối cảnh mặc khải của câu chuyện.'
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπεν δέ
  choice: Ông hỏi
  rationale: Trong ngữ cảnh, động từ “nói” dẫn vào một câu hỏi trực tiếp; tiếng Việt tự nhiên dùng “hỏi”. Đại từ “ông” chỉ Sau-lơ, còn δέ là liên từ nhẹ nên không cần dịch riêng.
- source_word: Τίς εἶ
  choice: Ngài là ai?
  rationale: Cách hỏi tự nhiên trong tiếng Việt; đại từ kính trọng phù hợp với κύριε và việc Sau-lơ đang thưa với tiếng phán từ trời.
- source_word: κύριε
  choice: Lạy Chúa
  rationale: Giữ cách dịch mặc định của κύριος là “Chúa” và sắc thái xưng hô trang trọng trong bối cảnh mặc khải; chú thích bảo lưu khả năng hiểu là lời thưa kính trọng “thưa ngài”.
- source_word: ὁ δέ
  choice: Đấng ấy đáp
  rationale: Mạo từ dùng như đại từ chỉ người đang phán; “Đấng ấy” vừa rõ chủ thể vừa hợp văn cảnh trang trọng. “Đáp” diễn đạt tự nhiên lời trả lời.
- source_word: Ἐγώ εἰμι Ἰησοῦς
  choice: Ta là Giê-su
  rationale: Giữ cấu trúc tự giới thiệu trực tiếp và sự nhấn mạnh của ἐγώ; “Ta” phù hợp lời của Chúa Giê-su phán với Sau-lơ mà không thêm nội dung thần học ngoài câu.
- source_word: ὃν σὺ διώκεις
  choice: Đấng mà ngươi đang bắt bớ
  rationale: Đại từ quan hệ quy chiếu trực tiếp về Giê-su. “đang bắt bớ” thể hiện hành động thù nghịch đang tiếp diễn của διώκεις; “ngươi” giữ sắc thái trực tiếp, trang trọng của lời phán.
theological_decisions:
- issue: Cách dịch κύριε trước khi Sau-lơ biết người đang phán là ai
  choice: Lạy Chúa
  alternative: thưa ngài
  rationale: κύριε có thể chỉ là cách thưa gửi kính trọng, nhưng bối cảnh tiếng phán từ trời và sự mặc khải ngay sau đó hỗ trợ “Lạy Chúa”. Chú thích giữ nguyên sự mơ hồ thực sự ở thời điểm Sau-lơ đặt câu hỏi.
- issue: Mối liên hệ giữa việc bắt bớ các môn đồ và bắt bớ chính Chúa Giê-su
  choice: 'Giữ nguyên lời đồng nhất trực tiếp: “Ta là Giê-su, Đấng mà ngươi đang bắt bớ”'
  alternative: Diễn giải rằng Sau-lơ bắt bớ những người theo Chúa Giê-su
  rationale: Bản Hy Lạp nói trực tiếp rằng Giê-su là đối tượng bị bắt bớ; không nên giải thích thay cho bản văn hay làm giảm sức căng thần học của lời tuyên bố.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” trong câu hỏi kính trọng, “Ta/ngươi” trong lời phán để giữ sắc thái uy nghiêm của cảnh mặc khải. Không dịch máy móc các liên từ nhẹ của văn kể Hy Lạp khi tiếng Việt không cần.
