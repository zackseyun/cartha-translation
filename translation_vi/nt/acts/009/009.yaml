  text: καὶ ἦν ἡμέρας τρεῖς μὴ βλέπων, καὶ οὐκ ἔφαγεν οὐδὲ ἔπιεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/009.yaml
  text: And for three days he was without sight[a], and he neither ate nor drank.
translation:
  language: vi
  text: Suốt ba ngày, ông không nhìn thấy[a], cũng không ăn không uống.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát hơn: “không thấy.” Cụm từ này cho biết Sau-lơ không thể nhìn được.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν ἡμέρας τρεῖς
  choice: Suốt ba ngày, ông
  rationale: Cụm đối cách ἡμέρας τρεῖς diễn tả khoảng thời gian; “suốt ba ngày” là cách nói tự nhiên trong tiếng Việt. Động từ ἦν được thể hiện qua trạng thái kéo dài trong toàn câu, không thêm ý “ở lại” vốn không có trực tiếp trong nguyên văn.
- source_word: μὴ βλέπων
  choice: không nhìn thấy
  rationale: Phân từ βλέπων với phủ định μὴ có nghĩa sát là “không nhìn thấy”. Cách dịch này tự nhiên, đồng thời không chuyển thành tính từ mạnh hơn là “mù”, dù ngữ cảnh cho thấy Sau-lơ không có khả năng nhìn.
- source_word: οὐκ ἔφαγεν οὐδὲ ἔπιεν
  choice: cũng không ăn không uống
  rationale: οὐδέ nối hai động từ phủ định. Cấu trúc “không ăn không uống” là thành ngữ tiếng Việt tự nhiên, diễn đạt rõ rằng cả việc ăn lẫn uống đều không xảy ra; “cũng” giữ liên kết với tình trạng không nhìn thấy ở vế trước.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ông” theo mạch tường thuật về Sau-lơ; tránh dùng “mù” trong chính văn để giữ sát cấu trúc phân từ của nguyên ngữ.
