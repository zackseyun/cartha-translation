  yaml_path: translation/nt/acts/009/018.yaml
  text: And immediately something like scales fell from his eyes[a], and he regained his sight; then he got up and was baptized,
translation:
  language: vi
  text: Ngay lập tức, có cái gì như vảy rơi khỏi mắt ông[a], và ông lại nhìn thấy được. Rồi ông đứng dậy và chịu phép báp-têm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch đơn giản là: “như vảy rơi khỏi mắt ông.” Tiếng Hy Lạp dùng phép so sánh, mô tả sự việc trông như thế nào chứ không khẳng định đó là vảy thật.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθέως
  choice: ngay lập tức
  rationale: Diễn đạt rõ tính tức thời của sự việc bằng tiếng Việt hiện đại, tự nhiên.
- source_word: ἀπέπεσαν
  choice: rơi khỏi
  rationale: Giữ nghĩa một vật rơi ra và lìa khỏi vị trí trước đó; kết hợp tự nhiên với “mắt ông”.
- source_word: αὐτοῦ ἀπὸ τῶν ὀφθαλμῶν
  choice: khỏi mắt ông
  rationale: Cách diễn đạt gọn và tự nhiên cho chuyển động tách khỏi đôi mắt.
- source_word: ὡς λεπίδες
  choice: có vật gì giống như vảy
  rationale: ὡς biểu thị sự so sánh chứ không xác định đó là vảy thật; “có vật gì” bảo toàn sắc thái về hình dạng hoặc vẻ bề ngoài.
- source_word: ἀνέβλεψεν
  choice: ông lại nhìn thấy được
  rationale: Trong bối cảnh được chữa khỏi mù, động từ chỉ sự phục hồi thị lực, không chỉ hành động ngước nhìn.
- source_word: τε καὶ
  choice: và ... rồi
  rationale: Liên kết các hành động kế tiếp nhau bằng nhịp kể chuyện tự nhiên trong tiếng Việt.
- source_word: ἀναστάς
  choice: ông đứng dậy
  rationale: Diễn đạt tự nhiên hành động đứng lên trước khi chịu phép báp-têm.
- source_word: ἐβαπτίσθη
  choice: chịu phép báp-têm
  rationale: Giữ thuật ngữ tôn giáo quen thuộc và thể bị động của động từ, không áp đặt một phương thức cử hành cụ thể.
theological_decisions:
- issue: Cách dịch βαπτίζω sao cho trung thành nhưng không thiên về hệ phái
  choice: chịu phép báp-têm
  alternative: được dìm mình
  rationale: Câu này chỉ thuật lại việc báp-têm mà không nêu rõ phương thức. Cách dịch đã chọn không đưa một quan điểm hệ phái về nghi thức vào bản văn.
translation_notes:
  register: Văn phong kể chuyện hiện đại, sáng rõ và trang trọng vừa phải. “Ông” phù hợp với nhân vật nam trưởng thành trong mạch truyện; “báp-têm” duy trì thuật ngữ quen thuộc mà không xác định phương thức.
