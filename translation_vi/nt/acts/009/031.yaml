id: ACT.9.31
reference: Acts 9:31
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸂Ἡ μὲν οὖν ἐκκλησία καθ’ ὅλης τῆς Ἰουδαίας καὶ Γαλιλαίας καὶ Σαμαρείας εἶχεν εἰρήνην οἰκοδομουμένη, καὶ πορευομένη τῷ φόβῳ τοῦ κυρίου καὶ τῇ παρακλήσει τοῦ ἁγίου πνεύματος ἐπληθύνετο⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/031.yaml
  text: So then the church throughout all Judea and Galilee and Samaria had peace and was being built up[a]; and walking in the fear of the Lord and in the encouragement of the Holy Spirit[b], it was multiplying.
translation:
  language: vi
  text: Vậy, Hội Thánh[a] khắp miền Giu-đê, Ga-li-lê và Sa-ma-ri có sự bình an và được gây dựng; sống trong sự kính sợ Chúa và trong sự khích lệ của Đức Thánh Linh[b], Hội Thánh ngày càng gia tăng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Một số thủ bản chép “các hội thánh” thay vì “Hội Thánh”.
    reason: textual_variant
  - marker: b
    text: Cũng có thể dịch là “sự an ủi” hoặc “sự khuyên bảo” của Đức Thánh Linh.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκκλησία
  choice: Hội Thánh
  rationale: Bản SBLGNT dùng danh từ số ít, chỉ chung một Hội Thánh hiện diện khắp ba miền; các động từ và phân từ liên hệ cũng ở số ít.
- source_word: καθ’ ὅλης τῆς Ἰουδαίας καὶ Γαλιλαίας καὶ Σαμαρείας
  choice: khắp miền Giu-đê, Ga-li-lê và Sa-ma-ri
  rationale: κατά với sở hữu cách mang nghĩa phân bố theo địa vực; “khắp miền” truyền đạt tự nhiên cả καθ’ và ὅλης trong tiếng Việt.
- source_word: εἶχεν εἰρήνην
  choice: được bình an
  rationale: Diễn đạt trạng thái yên ổn của Hội Thánh một cách tự nhiên, bao gồm sự lắng dịu của bách hại mà không giới hạn nghĩa vào việc nghỉ ngơi.
- source_word: οἰκοδομουμένη
  choice: được gây dựng
  rationale: Giữ hình ảnh xây dựng của động từ, đồng thời phản ánh thể bị động và tiến trình đang tiếp diễn.
- source_word: πορευομένη
  choice: sống
  rationale: Trong ngữ cảnh này, từ chỉ cách ăn ở hay nếp sống; “sống” tự nhiên hơn lối dịch sát “bước đi” mà vẫn truyền đạt đúng ý.
- source_word: τῷ φόβῳ τοῦ κυρίου
  choice: trong sự kính sợ Chúa
  rationale: Giữ cách diễn đạt giàu ý nghĩa Kinh Thánh, chỉ lòng tôn kính và vâng phục chứ không nhất thiết là nỗi kinh hãi.
- source_word: τῇ παρακλήσει τοῦ ἁγίου πνεύματος
  choice: trong sự khích lệ của Đức Thánh Linh
  rationale: παράκλησις có thể chỉ sự khích lệ, an ủi hoặc khuyên bảo; “khích lệ” phù hợp nhất với bối cảnh Hội Thánh được gây dựng và gia tăng.
- source_word: ἐπληθύνετο
  choice: ngày càng gia tăng
  rationale: Truyền đạt tiến trình gia tăng liên tục được biểu thị bởi thì chưa hoàn thành, đồng thời tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Số của ἐκκλησία và phạm vi quy chiếu
  choice: Hội Thánh ở số ít, được hiểu theo nghĩa tập thể trên cả ba miền
  alternative: Các hội thánh, theo dị bản số nhiều
  rationale: Theo bản văn SBLGNT được cung cấp, danh từ cùng các từ liên hệ đều ở số ít. Dị bản số nhiều được ghi chú để bảo tồn chứng cứ bản văn.
- issue: Ý nghĩa của “sự kính sợ Chúa”
  choice: lòng kính sợ bao hàm sự tôn kính và vâng phục
  alternative: nỗi kinh hãi trước Chúa hoặc lòng mộ đạo nói chung
  rationale: Giữ nguyên thành ngữ Kinh Thánh để không thu hẹp chiều sâu thần học vào một cách diễn giải duy nhất.
- issue: Ý nghĩa của παράκλησις liên hệ với Đức Thánh Linh
  choice: sự khích lệ
  alternative: sự an ủi hoặc sự khuyên bảo
  rationale: Từ Hy Lạp có phổ nghĩa rộng. “Khích lệ” hợp với mạch văn về bình an, gây dựng và gia tăng, còn các khả năng khác được nêu trong chú thích.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Hội Thánh” và “Đức Thánh Linh” theo cách gọi Kinh Thánh quen thuộc; tránh cấu trúc quá sát tiếng Hy Lạp khi gây gượng, nhưng giữ các hình ảnh và sự mơ hồ có ý nghĩa.
