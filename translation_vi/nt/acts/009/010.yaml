id: ACT.9.10
reference: Acts 9:10
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἦν δέ τις μαθητὴς ἐν Δαμασκῷ ὀνόματι Ἁνανίας, καὶ εἶπεν πρὸς αὐτὸν ⸂ἐν ὁράματι ὁ κύριος⸃· Ἁνανία. ὁ δὲ εἶπεν· Ἰδοὺ ἐγώ, κύριε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/010.yaml
  text: There was a disciple in Damascus named Ananias, and the Lord said to him in a vision, “Ananias.” And he said, “Here I am, Lord.”
translation:
  language: vi
  text: 'Tại Đa-mách có một môn đồ tên là A-na-nia. Chúa phán với ông trong một khải tượng: “A-na-nia!” Ông thưa: “Lạy Chúa, con đây.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἦν δέ
  choice: Tại Đa-mách có
  rationale: Dùng cấu trúc tồn tại tự nhiên trong tiếng Việt để mở cảnh và giới thiệu nhân vật mới; không thêm một từ chỉ thời gian tương đương với “bấy giờ” vì nguyên văn không có từ chỉ thời gian rõ ràng.
- source_word: τις μαθητὴς
  choice: một môn đồ
  rationale: τις mang tính bất định khi giới thiệu nhân vật; “một” truyền đạt tự nhiên mà không cần cách nói nặng nề như “một môn đồ nọ”.
- source_word: ἐν Δαμασκῷ
  choice: tại Đa-mách
  rationale: Diễn đạt địa điểm rõ ràng và tự nhiên; tên địa danh dùng dạng phiên âm quen thuộc trong Kinh Thánh tiếng Việt.
- source_word: ὀνόματι Ἁνανίας
  choice: tên là A-na-nia
  rationale: Dịch thành ngữ chỉ tên gọi bằng cấu trúc tiếng Việt thông dụng.
- source_word: εἶπεν πρὸς αὐτόν
  choice: phán với ông
  rationale: λέγω là “nói”, nhưng khi chủ thể là Chúa, “phán” là cách diễn đạt tiếng Việt trang trọng, tự nhiên và không làm thay đổi nội dung lời nói.
- source_word: ἐν ὁράματι
  choice: trong một khải tượng
  rationale: Chỉ phương thức hoặc hoàn cảnh Chúa nói với A-na-nia; “khải tượng” là cách gọi rõ ràng cho một thị kiến được ban từ Đức Chúa Trời.
- source_word: ὁ κύριος
  choice: Chúa
  rationale: Giữ tước hiệu κύριος và quy chiếu tự nhiên đến Chúa Giê-su phục sinh trong mạch văn Công vụ 9.
- source_word: Ἁνανία
  choice: A-na-nia
  rationale: Tên riêng ở hô cách, dùng dạng phiên âm quen thuộc trong tiếng Việt.
- source_word: Ἰδοὺ ἐγώ
  choice: con đây
  rationale: Đây là lời đáp quy ước biểu thị sự hiện diện và sẵn sàng. “Con đây” tự nhiên trong quan hệ người thưa với Chúa, thay vì dịch máy móc ἰδού là “kìa”.
- source_word: κύριε
  choice: Lạy Chúa
  rationale: Hô cách κύριε được thể hiện bằng “Lạy Chúa”, cách xưng hô trực tiếp, tôn kính và tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Đối tượng được gọi là ὁ κύριος / κύριε trong khải tượng
  choice: Cả hai đều được dịch là “Chúa”, chỉ Chúa Giê-su phục sinh
  alternative: Hiểu như một cách gọi thần linh chung chung hoặc dịch κύριε là “thưa ngài”
  rationale: Mạch văn Công vụ 9 cho thấy chính Chúa hiện ra, sai A-na-nia đến với Sau-lơ và nói về người được Ngài chọn. Bản dịch giữ tước hiệu “Chúa” mà không thêm tên “Giê-su” vào câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Tách câu Hy Lạp dài thành hai câu tiếng Việt để lời kể tự nhiên hơn. Dùng “ông” cho A-na-nia trong lời kể và “con” trong lời thưa với Chúa; không thêm chú thích vì câu này không có dị nghĩa cần thiết cho độc giả phổ thông.
