  source_fidelity: 'Bản dịch chuyển đạt đúng trình tự của nguyên văn: trong thời gian ấy Ta-bi-tha lâm bệnh rồi chết; sau đó có người tắm rửa bà và đặt bà trong một phòng ở tầng trên. Việc không dịch riêng công thức tự sự ἐγένετο δὲ vẫn tự nhiên trong tiếng Việt và không làm mất nội dung thiết yếu. “Thi thể bà” là sự làm rõ phù hợp trực tiếp với ngữ cảnh sau khi qua đời, không thêm chi tiết thực chất.'
