  text: ἐγένετο δὲ ἐν ταῖς ἡμέραις ἐκείναις ἀσθενήσασαν αὐτὴν ἀποθανεῖν· λούσαντες δὲ ⸂ἔθηκαν αὐτὴν⸃ ἐν ὑπερῴῳ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/037.yaml
  text: In those days it happened that she became sick and died. After washing her[a], they laid her in an upstairs room.
translation:
  language: vi
  text: Trong những ngày ấy, bà lâm bệnh rồi qua đời. Sau khi tắm rửa thi thể bà, người ta đặt bà trong một căn phòng trên lầu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγένετο δὲ ἐν ταῖς ἡμέραις ἐκείναις
  choice: Trong những ngày ấy
  rationale: Cụm dẫn nhập sự kiện được diễn đạt tự nhiên trong tiếng Việt; không cần dịch máy móc ἐγένετο là “xảy ra” hay δὲ bằng một từ nối riêng.
- source_word: ἀσθενήσασαν αὐτὴν ἀποθανεῖν
  choice: bà lâm bệnh rồi qua đời
  rationale: Kết cấu đối cách–nguyên mẫu sau ἐγένετο được chuyển thành mệnh đề hữu hạn tự nhiên; “rồi” thể hiện trình tự bệnh trước, chết sau.
- source_word: λούσαντες
  choice: sau khi tắm rửa thi thể bà
  rationale: Phân từ aorist chỉ hành động xảy ra trước động từ chính. Thêm “thi thể” làm rõ đối tượng được tắm rửa sau khi bà đã qua đời, phù hợp ngữ cảnh mà không thay đổi ý nghĩa.
- source_word: ἔθηκαν αὐτὴν
  choice: người ta đặt bà
  rationale: Chủ thể số nhiều không được nêu đích danh nên “người ta” là cách diễn đạt tự nhiên; “đặt” giữ nghĩa khái quát của τίθημι.
- source_word: ἐν ὑπερῴῳ
  choice: trong một căn phòng trên lầu
  rationale: ὑπερῷον chỉ một phòng ở tầng trên; cách dịch này hiện đại, rõ nghĩa và không gợi rằng đó là một căn phòng nổi tiếng hay đã được xác định trước.
theological_decisions:
- issue: Cách hiểu địa điểm ὑπερῴῳ
  choice: trong một căn phòng trên lầu
  alternative: trong phòng cao / trong căn phòng trên lầu ấy
  rationale: Danh từ Hy Lạp không có mạo từ và chỉ một gian phòng thuộc tầng trên; bản dịch tránh biến địa điểm này thành một “phòng cao” đặc thù trong truyền thống.
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại. Dùng “bà” để quy chiếu Ta-bi-tha theo ngữ cảnh trước đó; “qua đời” tự nhiên và trang nhã. Không cần chú thích vì “căn phòng trên lầu” truyền đạt trực tiếp nghĩa của ὑπερῷον.
