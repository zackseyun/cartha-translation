  terminology: “Thành” phù hợp với τὴν πόλιν trong ngữ cảnh. “Ngươi” có sắc thái Kinh Thánh/lời phán trực tiếp và có thể giữ nhất quán trong phân đoạn; “phải” bảo toàn lực tất yếu của δεῖ mà không diễn giải thần học.
