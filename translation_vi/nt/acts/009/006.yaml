  text: ἀλλὰ ἀνάστηθι καὶ εἴσελθε εἰς τὴν πόλιν, καὶ λαληθήσεταί σοι ⸂ὅ τί⸃ σε δεῖ ποιεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/006.yaml
  text: But get up and enter the city[a], and you will be told what you must do.
translation:
  language: vi
  text: Nhưng hãy đứng dậy, vào thành; rồi ngươi sẽ được cho biết điều ngươi phải làm.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀλλὰ
  choice: Nhưng
  rationale: Liên từ đối lập đánh dấu sự chuyển hướng sang mệnh lệnh; “Nhưng” ngắn gọn và tự nhiên.
- source_word: ἀνάστηθι
  choice: hãy đứng dậy
  rationale: Mệnh lệnh chỉ việc Sau-lơ đứng lên sau khi ngã xuống đất; cách diễn đạt hiện đại, rõ ràng.
- source_word: εἴσελθε εἰς τὴν πόλιν
  choice: vào thành
  rationale: Diễn đạt tự nhiên động từ chuyển động cùng giới từ chỉ hướng; “thành” phù hợp văn cảnh một đô thị đã được xác định.
- source_word: λαληθήσεταί σοι
  choice: người ta sẽ cho ngươi biết
  rationale: Truyền đạt tự nhiên thể bị động không nêu tác nhân của tiếng Hy Lạp, không xác định thêm ai sẽ nói.
- source_word: ὅ τί
  choice: gì
  rationale: Giới thiệu nội dung sẽ được cho biết; kết hợp tự nhiên với cấu trúc tiếng Việt “phải làm gì”.
- source_word: σε δεῖ ποιεῖν
  choice: ngươi phải làm
  rationale: “Phải” giữ được sức nặng của sự cần thiết hoặc nghĩa vụ trong δεῖ mà không giải thích quá mức nguồn gốc của sự cần thiết ấy.
theological_decisions:
- issue: Sức nặng của δεῖ trong bối cảnh sự chỉ dẫn thuộc thiên thượng
  choice: phải
  alternative: cần làm
  rationale: “Phải” bảo toàn ý nghĩa mạnh về sự cần thiết hoặc nghĩa vụ, đồng thời không xác định vượt quá bản văn rằng sự cần thiết ấy vận hành theo cách nào.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “ngươi” để phù hợp lời phán trực tiếp có sắc thái uy quyền; giữ sự không xác định tác nhân trong thể bị động Hy Lạp bằng cấu trúc “người ta sẽ cho ngươi biết”.
