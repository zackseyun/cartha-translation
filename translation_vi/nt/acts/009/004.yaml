  to: 'Ông ngã xuống đất và nghe một tiếng nói với ông rằng: “Sau-lơ, Sau-lơ, tại sao ngươi bắt bớ ta?”'
  rationale: Bản sửa làm rõ cấu trúc “một tiếng nói ... với ông” của φωνὴν λέγουσαν αὐτῷ, dùng cách hỏi hiện đại tự nhiên, và không viết hoa đại từ ngôi một để tránh xác định người nói trước khi bản văn tự xác định ở câu kế tiếp. Không thêm hoặc bớt nội dung nào.
