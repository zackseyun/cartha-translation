  text: καὶ πεσὼν ἐπὶ τὴν γῆν ἤκουσεν φωνὴν λέγουσαν αὐτῷ Σαοὺλ Σαούλ, τί με διώκεις;
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/004.yaml
  text: And falling to the ground, he heard a voice saying to him, “Saul, Saul, why are you persecuting me?”
translation:
  language: vi
  text: 'Ông ngã xuống đất và nghe một tiếng nói với ông rằng: “Sau-lơ, Sau-lơ, tại sao ngươi bắt bớ ta?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πεσὼν ἐπὶ τὴν γῆν
  choice: ngã xuống đất
  rationale: Diễn đạt tự nhiên chuyển động ngã xuống mặt đất; phân từ bất định được nối với động từ chính bằng “và” theo lối kể chuyện tiếng Việt, không ấn định quá mức sắc thái thời gian.
- source_word: ἤκουσεν φωνὴν
  choice: nghe một tiếng
  rationale: φωνή ở đây chỉ tiếng có lời nói rõ ràng. “Một tiếng” là cách diễn đạt tự nhiên trong tiếng Việt và phần trích dẫn ngay sau cho thấy đó là tiếng nói.
- source_word: λέγουσαν αὐτῷ
  choice: nói với mình
  rationale: Giữ quan hệ hướng đến Sau-lơ của αὐτῷ; “mình” quy chiếu tự nhiên về chủ ngữ “ông” trong câu kể.
- source_word: Σαοὺλ Σαούλ
  choice: Sau-lơ, Sau-lơ
  rationale: Phiên âm tên riêng theo cách dùng Kinh Thánh tiếng Việt quen thuộc và giữ nguyên sự lặp lại đầy nhấn mạnh.
- source_word: τί
  choice: sao
  rationale: Trong cấu trúc này τί mang nghĩa hỏi lý do. “Sao” tự nhiên, trực tiếp và trang trọng vừa đủ trong lời gọi.
- source_word: με
  choice: Ta
  rationale: Giữ nguyên đại từ trực tiếp ngôi thứ nhất, không diễn giải thành “dân Ta” hay “những người theo Ta”. Viết hoa theo quy ước tiếng Việt khi lời nói được nhận diện trong văn mạch là của Chúa.
- source_word: διώκεις
  choice: bắt bớ
  rationale: Diễn đạt hành động thù nghịch đang tiếp diễn đối với các tín hữu trong văn cảnh Công Vụ; “bắt bớ” chính xác và quen thuộc hơn nghĩa rộng “đuổi theo”.
theological_decisions:
- issue: Người phán đồng nhất chính mình với những người Sau-lơ đang bắt bớ
  choice: Giữ lời trực tiếp “Ta” mà không thêm lời giải thích.
  alternative: Diễn giải thành “dân Ta” hoặc “những người theo Ta”.
  rationale: Bản Hy Lạp dùng με, “Ta/tôi”, tạo nên sức nặng thần học của sự đồng nhất này. Bản dịch cần bảo toàn cách nói trực tiếp và sự căng thẳng của câu mà không giải nghĩa ngay trong chính văn.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang nghiêm và dễ hiểu. Dùng “ông” cho Sau-lơ trong lời trần thuật và “ngươi—Ta” trong lời phán để thể hiện quan hệ xưng hô trang trọng trong bối cảnh thần hiện, không thêm danh tính người nói vốn chỉ được nêu ở câu kế tiếp.
