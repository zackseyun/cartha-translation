source:
  edition: SBLGNT
  text: Ὁ δὲ Σαῦλος ἔτι ἐμπνέων ἀπειλῆς καὶ φόνου εἰς τοὺς μαθητὰς τοῦ κυρίου, προσελθὼν τῷ ἀρχιερεῖ
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/001.yaml
  text: But Saul[a], still breathing threats and murder against the disciples of the Lord, came to the high priest
translation:
  language: vi
  text: Còn Sau-lơ vẫn hằm hằm đe dọa giết hại các môn đồ của Chúa; ông đến gặp vị thượng tế.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: Nhưng
  rationale: Đánh dấu sự chuyển trở lại câu chuyện về Sau-lơ với sắc thái tương phản nhẹ so với cảnh trước.
- source_word: ἔτι
  choice: vẫn
  rationale: Diễn đạt tình trạng thù nghịch đang tiếp diễn của Sau-lơ.
- source_word: ἐμπνέων
  choice: hằm hằm … và nung nấu
  rationale: Chuyển hình ảnh sống động về việc ‘thở’ ra sự đe dọa và giết chóc sang một cách nói tự nhiên trong tiếng Việt, cho thấy lòng ông đầy sự hung hăng mà không làm câu văn tối nghĩa.
- source_word: ἀπειλῆς
  choice: đe dọa
  rationale: Diễn đạt trực tiếp hành vi và thái độ đe dọa; dạng động từ tự nhiên hơn danh từ trong cấu trúc tiếng Việt này.
- source_word: φόνου
  choice: ý định giết chóc
  rationale: φόνος chỉ sự giết người hoặc giết chóc. Thêm ‘ý định’ để tránh hàm ý rằng Sau-lơ đang thực sự giết các môn đồ ngay tại thời điểm này, trong khi vẫn giữ sức nặng bạo lực của từ gốc.
- source_word: εἰς τοὺς μαθητὰς
  choice: các môn đồ
  rationale: Trong câu tiếng Việt, các môn đồ là đối tượng trực tiếp của sự đe dọa và ý định giết chóc, nên không cần dịch εἰς bằng một giới từ riêng.
- source_word: μαθητὰς
  choice: môn đồ
  rationale: Thuật ngữ quen thuộc và chính xác trong văn cảnh Công Vụ để chỉ những người theo Chúa.
- source_word: τοῦ κυρίου
  choice: của Chúa
  rationale: Giữ nghĩa sở thuộc và cách gọi κύριος tự nhiên, trang trọng trong tiếng Việt; ở đây chỉ Chúa Giê-su.
- source_word: προσελθὼν τῷ ἀρχιερεῖ
  choice: ông đến gặp thầy tế lễ thượng phẩm
  rationale: Diễn đạt tự nhiên hành động Sau-lơ tiến đến vị thượng tế; ‘đến gặp’ phù hợp với hành động xin thư được nêu tiếp ở câu sau.
theological_decisions:
- issue: Cách dịch κύριος trong τοῦ κυρίου
  choice: Chúa
  alternative: Chủ
  rationale: Trong văn cảnh Công Vụ, danh xưng này chỉ Chúa Giê-su. ‘Chúa’ là cách dịch chuẩn, tự nhiên và không làm suy giảm ý nghĩa tôn kính của κύριος.
- issue: φόνος là hành động đã xảy ra hay ý hướng bạo lực
  choice: nung nấu ý định giết chóc
  alternative: sự giết chóc
  rationale: Ngữ cảnh mô tả thái độ và mục tiêu thù nghịch đang thúc đẩy Sau-lơ trước khi ông xin thư bắt các môn đồ. Cách dịch này tránh khẳng định quá mức rằng ông đang trực tiếp giết người tại chính thời điểm ấy, nhưng vẫn giữ nguyên mức độ nghiêm trọng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cụm ‘hằm hằm đe dọa và nung nấu ý định giết chóc’ tái hiện sức mạnh của hình ảnh Hy Lạp theo lối nói tự nhiên trong tiếng Việt; dấu chấm phẩy giữ câu này gắn với hành động đi gặp thầy tế lễ thượng phẩm.
