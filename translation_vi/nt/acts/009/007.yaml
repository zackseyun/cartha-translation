  text: οἱ δὲ ἄνδρες οἱ συνοδεύοντες αὐτῷ εἱστήκεισαν ἐνεοί, ἀκούοντες μὲν τῆς φωνῆς μηδένα δὲ θεωροῦντες.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/007.yaml
  text: The men traveling with him stood speechless[a], hearing the voice but seeing no one.
translation:
  language: vi
  text: Những người đàn ông cùng đi với ông đứng lặng, không nói nên lời; họ nghe tiếng nói[a] nhưng không thấy ai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “âm thanh”. Từ Hy Lạp này có thể mang nghĩa “tiếng nói” hoặc “âm thanh”; xin so sánh Công Vụ 22:9.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ ἄνδρες
  choice: Những người
  rationale: Danh ngữ chỉ những người đàn ông cùng đi với Sau-lơ; trong tiếng Việt, “những người” tự nhiên và không cần thêm từ nối cho δέ vốn chỉ chuyển ý nhẹ.
- source_word: οἱ συνοδεύοντες αὐτῷ
  choice: cùng đi với ông
  rationale: συνοδεύω chỉ việc đồng hành trong một chuyến đi; cách diễn đạt này ngắn gọn, tự nhiên và giữ rõ quan hệ đồng hành.
- source_word: εἱστήκεισαν
  choice: đứng lặng
  rationale: Dạng quá khứ hoàn thành của ἵστημι có giá trị trạng thái, mô tả họ đang đứng tại chỗ; “đứng lặng” kết hợp tự nhiên với tình trạng không nói được ở từ kế tiếp.
- source_word: ἐνεοί
  choice: không nói nên lời
  rationale: ἐνεός diễn tả tình trạng không thể nói, thường do kinh ngạc hoặc choáng váng; “không nói nên lời” truyền đạt đúng trạng thái mà không thêm nguyên nhân không được nói rõ.
- source_word: ἀκούοντες μὲν τῆς φωνῆς
  choice: họ nghe tiếng nói
  rationale: φωνή có thể chỉ “tiếng nói” hoặc rộng hơn là “âm thanh”. “Tiếng nói” là nghĩa trực tiếp, tự nhiên trong ngữ cảnh một người đang phán, còn khả năng “âm thanh” được giữ trong chú thích thay vì dùng để âm thầm hóa giải sự căng thẳng với Công Vụ 22:9.
- source_word: μηδένα δὲ θεωροῦντες
  choice: nhưng không thấy ai
  rationale: θεωρέω ở đây chỉ việc nhìn thấy; μηδένα phủ định một người, nên “không thấy ai” là cách dịch rõ và tự nhiên.
theological_decisions:
- issue: Sự căng thẳng biểu kiến giữa Công Vụ 9:7 và 22:9 về điều những người đi cùng Sau-lơ đã nghe
  choice: Dịch φωνή là “tiếng nói” trong chính văn và ghi nhận “âm thanh” trong chú thích
  alternative: Dịch φωνή là “âm thanh” để phân biệt việc nghe một âm thanh với việc nghe hoặc hiểu lời nói
  rationale: Bản Hy Lạp cho phép cả hai nghĩa, nhưng không nói rõ những người đồng hành chỉ nghe âm thanh mà không hiểu lời. Dùng “tiếng nói” giữ nghĩa thông thường trong ngữ cảnh và không tự ý giải quyết sự căng thẳng giữa hai trình thuật; chú thích bảo tồn khả năng từ vựng còn lại.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. Cụm “đứng lặng, không nói nên lời” diễn đạt tự nhiên trạng thái đứng bất động và câm lặng; dấu chấm phẩy giúp câu rõ nhịp mà không thêm quan hệ ý nghĩa ngoài nguyên văn.
