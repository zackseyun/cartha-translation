  text: καὶ λαβὼν τροφὴν ⸀ἐνίσχυσεν. Ἐγένετο ⸀δὲ μετὰ τῶν ἐν Δαμασκῷ μαθητῶν ἡμέρας τινὰς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/019.yaml
  text: And after taking food[a], he regained his strength. And he was with the disciples in Damascus for some days[c][b],
translation:
  language: vi
  text: Sau khi ăn[a], ông lấy lại sức. Rồi ông ở với các môn đồ tại Đa-mách một số ngày[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “sau khi dùng thức ăn.”'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn Hy Lạp: “một số ngày”, chỉ một khoảng thời gian không xác định.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λαβὼν τροφὴν
  choice: sau khi ăn
  rationale: Cụm phân từ aorist chỉ hành động nhận và dùng thức ăn xảy ra trước việc hồi sức; “sau khi ăn” tự nhiên trong tiếng Việt và truyền đạt đúng trình tự.
- source_word: ἐνίσχυσεν
  choice: ông lấy lại sức
  rationale: Trong bối cảnh Sau-lơ đã suy yếu vì ba ngày không ăn uống, động từ diễn tả việc ông hồi phục sức lực; cách dịch này rõ nghĩa và tự nhiên.
- source_word: Ἐγένετο δὲ
  choice: rồi ông ở
  rationale: Cụm này hoạt động như một chuyển tiếp trong lời kể hơn là nhấn mạnh ý “đã xảy ra”; “rồi” nối mạch kể tự nhiên.
- source_word: μετὰ τῶν ἐν Δαμασκῷ μαθητῶν
  choice: với các môn đồ tại Đa-mách
  rationale: μετά với sở hữu cách diễn tả sự đồng hành; cụm ἐν Δαμασκῷ xác định nơi các môn đồ đang ở.
- source_word: ἡμέρας τινάς
  choice: một số ngày
  rationale: Đối cách chỉ khoảng thời gian kéo dài không xác định; “một số ngày” không áp đặt con số cụ thể hoặc nhất thiết hàm ý rất ngắn.
theological_decisions: []
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “môn đồ” để duy trì thuật ngữ quen thuộc trong văn mạch Công vụ; dùng địa danh “Đa-mách”. Đại từ “ông” phù hợp với nhân vật Sau-lơ trong lời kể.
