  text: ἐν ᾧ καιρῷ ἐγεννήθη Μωϋσῆς, καὶ ἦν ἀστεῖος τῷ θεῷ· ὃς ἀνετράφη μῆνας τρεῖς ἐν τῷ οἴκῳ τοῦ πατρός·
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/020.yaml
  text: At that time Moses was born[a], and he was beautiful to God. He was brought up for three months in his father's house.
translation:
  language: vi
  text: Vào thời ấy, Môi-se được sinh ra và đẹp trước mặt Đức Chúa Trời.[a] Ông được nuôi dưỡng ba tháng trong nhà cha mình.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đẹp trong mắt Đức Chúa Trời.” Tính từ Hy Lạp cũng có thể mang nghĩa “khôi ngô” hoặc “tốt đẹp,” nhưng nguyên văn nhắc rõ đến Đức Chúa Trời.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ᾧ καιρῷ
  choice: Vào thời ấy
  rationale: Cách diễn đạt thời gian tự nhiên trong tiếng Việt, giữ nguyên sự quy chiếu đến giai đoạn vừa được nói tới.
- source_word: ἐγεννήθη
  choice: được sinh ra
  rationale: Thể bị động aorist của γεννάω trong ngữ cảnh sinh nở; cách dịch này vừa sát nghĩa vừa trang trọng, tự nhiên.
- source_word: Μωϋσῆς
  choice: Môi-se
  rationale: Dùng dạng tên riêng Kinh Thánh quen thuộc trong tiếng Việt.
- source_word: ἀστεῖος
  choice: đẹp
  rationale: Giữ nghĩa từ vựng trực tiếp về vẻ đẹp hoặc sự tốt đẹp, không diễn giải quá mức thành 'đặc biệt' hay 'đầy triển vọng'.
- source_word: τῷ θεῷ
  choice: trước mặt Đức Chúa Trời
  rationale: 'Thể hiện cách hiểu sở dữ liệu về sự đánh giá: Môi-se đẹp trong cái nhìn của Đức Chúa Trời, đồng thời giữ rõ sự quy chiếu đến Ngài.'
- source_word: ἀνετράφη
  choice: được nuôi dưỡng
  rationale: Diễn đạt rõ việc đứa trẻ được chăm nuôi trong gia đình; tự nhiên và trang trọng hơn lối dịch máy móc.
- source_word: μῆνας τρεῖς
  choice: ba tháng
  rationale: Tiếng Việt diễn đạt khoảng thời gian tự nhiên mà không cần thêm giới từ tương đương với 'for'.
- source_word: ἐν τῷ οἴκῳ τοῦ πατρός
  choice: trong nhà cha mình
  rationale: Giữ cả ý nghĩa không gian và gia đình của οἶκος; đại từ 'mình' quy chiếu tự nhiên về Môi-se.
theological_decisions:
- issue: Ý nghĩa của ἀστεῖος τῷ θεῷ
  choice: đẹp trước mặt Đức Chúa Trời
  alternative: đẹp đối với Đức Chúa Trời; đẹp trong mắt Đức Chúa Trời; là một đứa trẻ khôi ngô
  rationale: Bản dịch bảo toàn sự nhắc đến Đức Chúa Trời vốn hiện diện rõ trong tiếng Hy Lạp và diễn đạt chiều kích đánh giá, nhưng không nâng câu này thành một khẳng định thần học mạnh hơn nguyên văn.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Trời” để chỉ θεός và “Môi-se” theo dạng tên quen thuộc. Câu được tách theo mạch tự nhiên của tiếng Việt nhưng vẫn giữ quan hệ giữa các mệnh đề trong nguyên văn.
