id: ACT.7.42
reference: Acts 7:42
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἔστρεψεν δὲ ὁ θεὸς καὶ παρέδωκεν αὐτοὺς λατρεύειν τῇ στρατιᾷ τοῦ οὐρανοῦ, καθὼς γέγραπται ἐν βίβλῳ τῶν προφητῶν· Μὴ σφάγια καὶ θυσίας προσηνέγκατέ μοι ἔτη τεσσεράκοντα ἐν τῇ ἐρήμῳ, οἶκος Ἰσραήλ;
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/042.yaml
  text: 'But God turned away and gave them over to serve the host of heaven[a], just as it is written in the book of the prophets: ‘Did you offer to me slain offerings and sacrifices for forty years in the wilderness[d][c][b], O house of Israel?’'
translation:
  language: vi
  text: 'Nhưng Đức Chúa Trời đã quay đi và phó mặc họ phụng thờ đạo binh trên trời[a], như đã chép trong sách các nhà tiên tri[b]: “Hỡi nhà Israel, có phải suốt bốn mươi năm trong hoang mạc, các ngươi đã dâng cho Ta những con vật bị giết làm lễ cùng các tế lễ không?”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Phụng thờ” cũng có thể dịch là “thờ phượng”. “Đạo binh trên trời” là thành ngữ Kinh Thánh chỉ các thiên thể, và rộng hơn là những quyền lực trên trời gắn với chúng trong việc thờ thần tượng.
    reason: lexical_and_cultural_note
  - marker: b
    text: 'Cũng có thể dịch: “trong cuộn sách các nhà tiên tri”.'
    reason: lexical_alternative
  - marker: c
    text: Trích A-mốt 5:25.
    reason: cross_reference
lexical_decisions:
- source_word: ἔστρεψεν
  choice: đã quay đi
  rationale: Giữ hình ảnh Đức Chúa Trời quay khỏi dân trong bối cảnh phán xét; cách diễn đạt này tự nhiên và không thêm đối tượng hay hình ảnh không có trong tiếng Hy Lạp.
- source_word: παρέδωκεν αὐτούς
  choice: phó mặc họ
  rationale: Diễn đạt hành động trao họ cho hậu quả của sự phản nghịch như một sự phán xét, nhưng không hàm ý Đức Chúa Trời là tác giả của việc thờ thần tượng.
- source_word: λατρεύειν
  choice: phụng thờ
  rationale: Bao hàm cả sắc thái phục vụ mang tính tôn giáo và thờ phượng, nhờ đó giữ được phạm vi nghĩa của động từ Hy Lạp.
- source_word: τῇ στρατιᾷ τοῦ οὐρανοῦ
  choice: đạo binh trên trời
  rationale: Giữ nguyên thành ngữ Kinh Thánh và không thu hẹp đối tượng chỉ còn các ngôi sao hay thiên sứ; chú thích giải thích phạm vi chỉ các thiên thể và những quyền lực gắn với chúng trong việc thờ thần tượng.
- source_word: ἐν βίβλῳ τῶν προφητῶν
  choice: trong sách các nhà tiên tri
  rationale: Cách nói rõ ràng, tự nhiên trong tiếng Việt, chỉ tuyển tập lời các nhà tiên tri; 'cuộn sách' là khả năng lịch sử được nêu trong chú thích.
- source_word: Μὴ ... προσηνέγκατέ μοι
  choice: có phải ... các ngươi đã dâng cho Ta ... không?
  rationale: Giữ hình thức câu hỏi tu từ vốn hướng đến câu trả lời phủ định, đồng thời đặt 'cho Ta' rõ ràng như trong nguyên văn.
- source_word: σφάγια καὶ θυσίας
  choice: những con vật bị giết làm lễ cùng các tế lễ
  rationale: Phân biệt sắc thái của σφάγια là vật bị giết để dâng lễ với θυσίας là các tế lễ nói chung, bằng ngôn ngữ dễ hiểu.
- source_word: ἔτη τεσσεράκοντα ἐν τῇ ἐρήμῳ
  choice: suốt bốn mươi năm trong hoang mạc
  rationale: '''Suốt'' thể hiện khoảng thời gian liên tục; ''hoang mạc'' gợi đúng bối cảnh hành trình của Israel mà không nhất thiết chỉ một vùng toàn cát.'
theological_decisions:
- issue: Hành động của Đức Chúa Trời trong sự phán xét
  choice: “đã quay đi và phó mặc họ” diễn tả sự từ bỏ mang tính xét đoán sau sự phản nghịch
  alternative: Đức Chúa Trời chỉ thụ động cho phép, hoặc chủ động khiến họ phạm tội thờ thần tượng
  rationale: Hai động từ nối tiếp nhau cho thấy hành động phán xét thật sự của Đức Chúa Trời, nhưng bản dịch tránh nói rằng Ngài tạo ra lòng thờ thần tượng nơi họ.
- issue: Đối tượng của cụm “đạo binh trên trời”
  choice: Giữ thành ngữ rộng, có thể chỉ các thiên thể và những quyền lực trên trời được tôn thờ
  alternative: Chỉ riêng các ngôi sao, hoặc chỉ riêng các thiên sứ
  rationale: Ngữ cảnh thờ thần tượng thiên thể không cho phép xác định quá hẹp; giữ thành ngữ bảo toàn độ rộng của nguyên văn.
- issue: Ý nghĩa câu hỏi trích từ A-mốt 5:25
  choice: Giữ dưới dạng câu hỏi tu từ hướng đến câu trả lời phủ định
  alternative: Đổi thành lời khẳng định rằng Israel hoàn toàn không dâng bất cứ tế lễ nào
  rationale: Nguyên văn dùng μή để đặt câu hỏi chờ câu trả lời phủ định; hình thức câu hỏi bảo toàn sức căng của lời quở trách mà không giải thích thay cho bản văn.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, dùng “Đức Chúa Trời”, “phụng thờ”, “tế lễ” theo ngữ vực Kinh Thánh quen thuộc; cấu trúc câu được sắp xếp tự nhiên cho người đọc tiếng Việt. Đại từ “Ta/các ngươi” được giữ trong lời tiên tri để thể hiện giọng phán trang nghiêm.
