  terminology: “Đức Chúa Trời”, “phụng thờ”, “đạo binh trên trời”, “tế lễ”, và “hoang mạc” nhất quán với ngữ vực Kinh Thánh. Chú thích giải thích đầy đủ lựa chọn “phụng thờ” và thành ngữ “đạo binh trên trời” mà không thu hẹp nghĩa nguyên ngữ.
