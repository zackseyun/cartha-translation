  source_fidelity: Bản dịch truyền đạt chính xác chuỗi hành động phán xét trong ἔστρεψεν ... παρέδωκεν, ý nghĩa thờ phượng/phục dịch tôn giáo của λατρεύειν, và giữ được độ rộng của thành ngữ τῇ στρατιᾷ τοῦ οὐρανοῦ. Câu hỏi tu từ với μή được bảo toàn, cũng như các yếu tố thời gian, địa điểm và lời xưng hô với nhà Israel.
