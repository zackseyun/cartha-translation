    issue: “sát hại” được dùng làm vế song hành với “những kẻ phản nộp”
    rationale: φονεῖς là danh từ chỉ người (“những kẻ giết người/sát nhân”), còn “sát hại” trong tiếng Việt là động từ. Cấu trúc hiện tại không tự nhiên và làm mờ đối ứng danh từ vị ngữ trong nguyên ngữ.
  - severity: low
    issue: “phản nộp” là từ ghép ít thông dụng trong chính văn
    rationale: Dù cố gắng diễn đạt ý trao nộp, từ này kém tự nhiên trong tiếng Việt hiện đại. “Kẻ phản bội” là tương đương trực tiếp, rõ ràng của προδόται; việc trao nộp không cần được giải thích thêm trong câu.
