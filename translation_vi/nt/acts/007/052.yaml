id: ACT.7.52
reference: Acts 7:52
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τίνα τῶν προφητῶν οὐκ ἐδίωξαν οἱ πατέρες ὑμῶν; καὶ ἀπέκτειναν τοὺς προκαταγγείλαντας περὶ τῆς ἐλεύσεως τοῦ δικαίου οὗ νῦν ὑμεῖς προδόται καὶ φονεῖς ⸀ἐγένεσθε,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/052.yaml
  text: Which of the prophets did your fathers not persecute? And they killed those who announced beforehand the coming of the Righteous One[a], of whom you have now become betrayers and murderers[c][b],
translation:
  language: vi
  text: Có nhà tiên tri nào mà tổ phụ các ông không bắt bớ? Họ đã giết những người báo trước về sự đến của Đấng Công Chính[a], mà giờ đây các ông đã trở thành những kẻ phản bội và sát nhân[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Đấng Công Bình” hoặc “Người Công Chính.”'
    reason: lexical_alternative
  - marker: b
    text: 'Hoặc: “những kẻ phản nộp và giết người.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: τίνα τῶν προφητῶν
  choice: Có nhà tiên tri nào
  rationale: Diễn đạt tự nhiên cấu trúc bộ phận và giữ nguyên sức mạnh của câu hỏi tu từ, hàm ý rằng không một nhà tiên tri nào thoát khỏi sự bắt bớ.
- source_word: ἐδίωξαν
  choice: bắt bớ
  rationale: Trong ngữ cảnh này, động từ chỉ sự truy đuổi và áp bức thù địch đối với các nhà tiên tri; “bắt bớ” là cách nói Kinh Thánh quen thuộc nhưng vẫn dễ hiểu trong tiếng Việt hiện đại.
- source_word: οἱ πατέρες ὑμῶν
  choice: tổ phụ các ông
  rationale: “Tổ phụ” vừa giữ được hình ảnh “cha ông” trong nguyên ngữ vừa chỉ rõ các thế hệ tổ tiên, phù hợp với giọng cáo buộc của Ê-tiên.
- source_word: ἀπέκτειναν
  choice: giết
  rationale: Cách dịch trực tiếp, rõ ràng và không cổ hóa.
- source_word: τοὺς προκαταγγείλαντας
  choice: những người đã báo trước
  rationale: Giữ cả ý công bố và yếu tố thời gian của tiền tố προ-, đồng thời tự nhiên trong tiếng Việt.
- source_word: περὶ τῆς ἐλεύσεως
  choice: về sự đến của
  rationale: Phản ánh giới từ περὶ và danh từ ἔλευσις mà không diễn giải thêm bản chất của sự đến.
- source_word: τοῦ δικαίου
  choice: Đấng Công Chính
  rationale: Danh từ hóa tính từ có mạo từ, chỉ một nhân vật xác định; cách viết hoa biểu thị chức danh quy chiếu đến Chúa Giê-su mà không thêm nội dung ngoài bản văn.
- source_word: οὗ
  choice: chính Đấng ấy
  rationale: Chuyển cấu trúc đại từ quan hệ sở hữu của tiếng Hy Lạp sang một liên kết tự nhiên trong tiếng Việt, làm rõ rằng lời cáo buộc tiếp theo liên quan đến Đấng Công Chính.
- source_word: νῦν
  choice: giờ đây
  rationale: Giữ sự tương phản thời gian giữa hành động của tổ phụ và trách nhiệm hiện tại của người nghe.
- source_word: προδόται
  choice: những kẻ phản nộp
  rationale: “Phản nộp” giữ ý phản bội bằng cách trao nộp một người, tránh sắc thái chủ yếu về phản quốc của “kẻ phản bội”; vì đây là cách nói ít thông dụng hơn nên có chú thích.
- source_word: φονεῖς
  choice: sát hại
  rationale: Trong cấu trúc “những kẻ phản nộp và sát hại”, động từ danh hóa tự nhiên hơn “những kẻ giết người” và vẫn truyền đạt hành vi giết người có tội.
- source_word: ἐγένεσθε
  choice: đã trở thành
  rationale: Giữ sắc thái chuyển thành một tình trạng, với kết quả còn liên hệ đến hiện tại nhờ “giờ đây”.
theological_decisions:
- issue: Cách dịch τοῦ δικαίου như một danh xưng quy về Chúa Giê-su
  choice: Đấng Công Chính
  alternative: Người Công Chính; Đấng Công Bình
  rationale: Ngữ cảnh bài diễn từ xác định đây là nhân vật mà các nhà tiên tri báo trước và người nghe đã phản nộp, tức Chúa Giê-su. “Đấng Công Chính” giữ sắc thái danh xưng mà không thêm một danh hiệu giáo phái.
- issue: Quan hệ giữa người nghe và cái chết của Đấng Công Chính
  choice: các ông đã trở thành những kẻ phản nộp và sát hại
  alternative: các ông đã phản bội và giết Ngài
  rationale: Giữ hai danh từ vị ngữ προδόται và φονεῖς cùng lời cáo buộc trực tiếp của bản văn, nhưng không giải thích cơ chế hay mức độ tham gia của người nghe.
translation_notes:
  register: Văn phong hiện đại, trang trọng và trực diện, phù hợp với lời cáo buộc mạnh mẽ trong bài diễn từ. Dùng “các ông” để truyền đạt số nhiều ὑμεῖς và sắc thái đối chất; dùng “tổ phụ” thay vì “cha” để tránh hiểu là cha ruột. Mọi dấu chú thích đều xuất hiện trong chính văn.
