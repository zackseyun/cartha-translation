revisions:
- from: Có nhà tiên tri nào mà tổ phụ các ông không bắt bớ? Họ còn giết những người đã báo trước về sự đến của Đấng Công Chính[a]; chính Đấng ấy, giờ đây các ông đã trở thành những kẻ phản nộp[b] và sát hại.
  to: Có nhà tiên tri nào mà tổ phụ các ông không bắt bớ? Họ đã giết những người báo trước về sự đến của Đấng Công Chính[a], mà giờ đây các ông đã trở thành những kẻ phản bội và sát nhân[b].
  rationale: Sửa vế cuối để giữ hai danh từ chỉ người trong tiếng Hy Lạp và dùng tiếng Việt hiện đại, tự nhiên. Đổi “Họ còn giết” thành “Họ đã giết” để không thêm sắc thái nhấn mạnh “còn/even” vốn không được καὶ bắt buộc. Liên kết “mà” diễn đạt tự nhiên đại từ quan hệ οὗ, vẫn quy chiếu rõ về Đấng Công Chính.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T08:29:03Z'
review_pass:
  verdict: revise
  source_fidelity: Bản dịch giữ đúng câu hỏi tu từ, hành động bắt bớ/giết, việc các tiên tri loan báo trước sự đến của Đấng Công Chính, và lời cáo buộc hiện tại. Tuy nhiên, cụm “chính Đấng ấy, giờ đây các ông đã trở thành những kẻ phản nộp và sát hại” dùng “sát hại” như một danh từ chỉ người không tự nhiên và không phản ánh rõ hai danh từ vị ngữ số nhiều προδόται καὶ φονεῖς.
  naturalness: “Tổ phụ các ông” và “bắt bớ” phù hợp văn phong Kinh Thánh hiện đại. Cần đổi “những kẻ phản nộp và sát hại” thành các danh từ chỉ người song hành, tự nhiên hơn trong tiếng Việt.
  terminology: “Đấng Công Chính” là cách dịch thích hợp cho τοῦ δικαίου như một danh xưng. “Kẻ phản nộp” có thể hiểu được nhưng ít thông dụng; “kẻ phản bội” là cách nói hiện đại, rõ nghĩa hơn và vẫn giữ προδόται. “Những kẻ sát nhân” phản ánh φονεῖς chính xác hơn “sát hại”.
  issues:
