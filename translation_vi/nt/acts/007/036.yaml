id: ACT.7.36
reference: Acts 7:36
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οὗτος ἐξήγαγεν αὐτοὺς ποιήσας τέρατα καὶ σημεῖα ἐν ⸀γῇ Αἰγύπτῳ καὶ ἐν Ἐρυθρᾷ Θαλάσσῃ καὶ ἐν τῇ ἐρήμῳ ἔτη τεσσεράκοντα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/036.yaml
  text: This man led them out[a], performing wonders and signs in the land of Egypt and at the Red Sea and in the wilderness for forty years.
translation:
  language: vi
  text: Chính người này đã dẫn họ ra, làm những việc kỳ diệu và dấu lạ tại đất Ai Cập, tại Biển Đỏ[a] và trong hoang mạc suốt bốn mươi năm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “Biển Sậy”. Bản Hy Lạp ghi “Biển Đỏ” (Ἐρυθρὰ Θάλασσα), là tên gọi thông dụng trong Tân Ước và bản Bảy Mươi dùng để chỉ nơi dân Y-sơ-ra-ên vượt biển.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτος
  choice: Chính người này
  rationale: Đại từ chỉ định mang tính nhấn mạnh, quy chiếu về Môi-se. Cách dịch này giữ được sức nhấn trong diễn từ của Ê-tiên mà không làm phẳng thành “ông ấy”.
- source_word: ἐξήγαγεν αὐτούς
  choice: đã dẫn họ ra
  rationale: Diễn đạt tự nhiên ý dẫn hoặc đưa ra khỏi một nơi, đồng thời giữ Môi-se là tác nhân con người trong biến cố xuất hành.
- source_word: ποιήσας
  choice: làm
  rationale: Phân từ bất định mô tả hành động gắn với việc dẫn dân ra. Cấu trúc nối bằng dấu phẩy tự nhiên trong tiếng Việt và không ấn định quá mức quan hệ thời gian.
- source_word: τέρατα καὶ σημεῖα
  choice: những việc kỳ diệu và dấu lạ
  rationale: 'Giữ hai thành tố phân biệt: các việc gây kinh ngạc và các dấu hiệu có ý nghĩa chứng thực; cách nói rõ ràng, trang trọng và quen thuộc trong văn phong Kinh Thánh tiếng Việt.'
- source_word: ἐν γῇ Αἰγύπτῳ
  choice: tại đất Ai Cập
  rationale: Phản ánh danh từ γῇ và duy trì cấu trúc địa lý gồm Ai Cập, Biển Đỏ và hoang mạc.
- source_word: ἐν Ἐρυθρᾷ Θαλάσσῃ
  choice: tại Biển Đỏ
  rationale: Ἐρυθρὰ Θάλασσα theo nghĩa trực tiếp là “Biển Đỏ”. Giới từ “tại” diễn đạt địa điểm của các sự kiện một cách tự nhiên mà không buộc phải hiểu các phép lạ đều xảy ra ở bên trong lòng biển.
- source_word: ἐν τῇ ἐρήμῳ
  choice: trong hoang mạc
  rationale: “Hoang mạc” chỉ vùng hoang vu nơi dân Y-sơ-ra-ên lang thang, không nhất thiết chỉ là sa mạc cát.
- source_word: ἔτη τεσσεράκοντα
  choice: suốt bốn mươi năm
  rationale: “Suốt” diễn đạt tự nhiên khoảng thời gian kéo dài được nêu trong tiếng Hy Lạp.
theological_decisions:
- issue: Sự quy chiếu của đại từ chỉ định và vai trò của Môi-se trong cuộc xuất hành
  choice: Giữ sắc thái nhấn mạnh “Chính người này” và trình bày Môi-se là tác nhân con người dẫn dân ra.
  alternative: Dịch đơn giản là “Ông đã dẫn họ ra”, làm giảm sắc thái nhấn mạnh; hoặc diễn đạt theo cách khiến Môi-se có vẻ hành động độc lập với Đức Chúa Trời.
  rationale: οὗτος nhấn mạnh chính Môi-se mà trước đó dân chúng từng khước từ. Câu văn thuật lại vai trò của ông mà không xác quyết rằng quyền năng làm dấu lạ bắt nguồn độc lập nơi ông.
- issue: Địa điểm tại Biển Đỏ
  choice: Dùng “tại Biển Đỏ” để giữ khả năng bao quát các dấu lạ diễn ra ở vùng biển và trong cuộc vượt biển.
  alternative: “Trong Biển Đỏ”, bám sát giới từ ἐν hơn nhưng có thể thu hẹp ý theo cách thiếu tự nhiên trong tiếng Việt.
  rationale: ἐν có thể chỉ địa điểm nói chung. “Tại” giữ ý địa lý mà không giải quyết quá mức chính xác vị trí của từng dấu lạ.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. “Chính người này” giữ sức nhấn tu từ của diễn từ; các cụm địa lý được trình bày song song. Dấu chú thích [a] được đặt ngay sau “Biển Đỏ”, là từ ngữ mà chú thích giải thích.
