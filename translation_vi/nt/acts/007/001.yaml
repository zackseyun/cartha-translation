  source_fidelity: 'Bản dịch phản ánh đúng cấu trúc và ý nghĩa của câu Hy Lạp: ὁ ἀρχιερεύς được dịch là “thầy tế lễ thượng phẩm”; ταῦτα vẫn ở số nhiều qua “những điều ấy”; và thành ngữ οὕτως ἔχει được diễn đạt đúng là một câu hỏi xác minh: “có đúng như vậy không?” “Hỏi” là cách chuyển ngữ tiếng Việt tự nhiên cho động từ “nói” khi lời trực tiếp là câu hỏi, không thêm nội dung diễn giải.'
  naturalness: '“Bấy giờ, thầy tế lễ thượng phẩm hỏi: ‘Những điều ấy có đúng như vậy không?’” là tiếng Việt hiện đại, trang trọng và phù hợp văn cảnh xét hỏi. Cách nói này rõ ràng mà không thay thế đại từ khái quát của nguyên văn bằng cách diễn giải “các lời cáo buộc” trong bản văn chính.'
