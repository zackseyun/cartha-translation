  text: Εἶπεν δὲ ὁ ἀρχιερεύς· ⸀Εἰ ταῦτα οὕτως ἔχει;
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/001.yaml
  text: Then the high priest said[a], “Are these things so?”
translation:
  language: vi
  text: 'Bấy giờ, thầy tế lễ thượng phẩm hỏi[a]: “Những điều ấy có đúng như vậy không?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch sát hơn: “nói”; hoặc dịch cả câu hỏi là: “Điều này có đúng không?” hay rõ nghĩa hơn: “Những lời cáo buộc này có đúng không?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἶπεν
  choice: hỏi
  rationale: Động từ λέγω theo nghĩa đen là “nói”, nhưng ở đây trực tiếp dẫn vào một câu hỏi. Tiếng Việt tự nhiên dùng “hỏi”, diễn đạt đúng chức năng của lời nói mà không làm thay đổi nội dung.
- source_word: δὲ
  choice: Bấy giờ
  rationale: δέ đánh dấu bước chuyển tiếp trong diễn tiến trình thuật; “Bấy giờ” trang trọng, tự nhiên và nối câu này với các lời cáo buộc ngay trước đó.
- source_word: ὁ ἀρχιερεύς
  choice: thầy tế lễ thượng phẩm
  rationale: Đây là cách gọi quen thuộc, phân biệt vị đứng đầu hàng tư tế với các thầy tế lễ cả nói chung.
- source_word: Εἰ
  choice: có ... không
  rationale: εἰ mở đầu câu hỏi trực tiếp có/không; cấu trúc “có ... không?” là tương đương tự nhiên trong tiếng Việt.
- source_word: ταῦτα
  choice: những điều ấy
  rationale: Giữ số nhiều và tính khái quát của đại từ chỉ định, quy chiếu về các lời cáo buộc trước đó mà không diễn giải thẳng thành “những lời cáo buộc”.
- source_word: οὕτως ἔχει
  choice: đúng như vậy
  rationale: Thành ngữ mang nghĩa “là như thế, đúng với thực trạng”; “đúng như vậy” phù hợp với câu hỏi thẩm vấn và giữ được ý xác minh.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “hỏi” thay cho cách dịch máy móc “nói” vì tiếng Việt thường xác định loại hành động lời nói khi dẫn câu hỏi; chú thích bảo lưu cách dịch sát. Cụm “những điều ấy” giữ sự khái quát và độ mơ hồ của ταῦτα.
