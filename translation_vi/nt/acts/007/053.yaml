  source_fidelity: Bản dịch nhận đúng đối tượng trực tiếp, thì quá khứ và ngôi thứ hai số nhiều của ἐλάβετε, cũng như lời trách cứ ở mệnh đề cuối. Tuy nhiên, “qua sự sắp đặt” dễ biến εἰς διαταγὰς ἀγγέλων thành một cơ chế trung gian đã xác định. “Theo sự sắp đặt của các thiên sứ” phản ánh tốt hơn tính khó và sắc thái có thể là sự chỉ định/sắp đặt, đồng thời chú thích vẫn nêu rõ phương án “qua trung gian”.
  naturalness: “Chính các ông là những người” hơi nặng và không tự nhiên trong văn xuôi hiện đại. “Các ông là những người” vẫn giữ lối xưng hô trực tiếp và sức quy kết của lời Ê-tiên. Thêm “luật ấy” sau “tuân giữ” giúp câu hoàn chỉnh, rõ ràng mà không thêm nghĩa.
  terminology: “Luật pháp” và “các thiên sứ” phù hợp với văn phong Kinh Thánh tiếng Việt hiện đại. Không cần viết hoa “luật pháp”, vì bản văn Hy Lạp không đánh dấu quy ước viết hoa. Cụm khó về các thiên sứ được giữ không quá quyết đoán và được giải thích bằng chú thích.
