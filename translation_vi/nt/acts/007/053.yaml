  text: you who received the law as delivered by angels[a], and did not keep it.
translation:
  language: vi
  text: Các ông là những người đã nhận luật pháp theo sự sắp đặt của các thiên sứ[a], nhưng lại không tuân giữ luật ấy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “qua trung gian của các thiên sứ” hoặc “theo chỉ thị của các thiên sứ.” Cụm từ Hy Lạp này khó hiểu, nhưng nói đến vai trò của các thiên sứ trong việc ban luật pháp.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἵτινες
  choice: chính các ông là những người
  rationale: Đại từ quan hệ mang sắc thái định tính và, cùng với các động từ ngôi thứ hai số nhiều, trực tiếp quy trách nhiệm cho những người đang nghe Ê-tiên. Cách dịch này giữ được sức nhấn mạnh và giọng cáo buộc.
- source_word: ἐλάβετε
  choice: đã nhận
  rationale: Động từ aorist chủ động, ngôi thứ hai số nhiều của λαμβάνω. “Đã nhận” tự nhiên trong ngữ cảnh nhận luật pháp và không hàm ý họ tự nguyện chấp nhận hơn mức bản văn nói.
- source_word: τὸν νόμον
  choice: luật pháp
  rationale: Ở đây νόμος chỉ luật pháp Môi-se. “Luật pháp” là cách diễn đạt quen thuộc, trang trọng và dễ hiểu trong tiếng Việt; không viết hoa để tránh thêm một quy ước diễn giải không có trong tiếng Hy Lạp.
- source_word: εἰς διαταγὰς ἀγγέλων
  choice: qua sự sắp đặt của các thiên sứ
  rationale: Cụm Hy Lạp khó và có thể chỉ sự sắp đặt, mệnh lệnh hoặc vai trò trung gian của các thiên sứ khi luật pháp được ban. Cách dịch này tương đối sát cấu trúc nguồn, tự nhiên trong tiếng Việt, đồng thời không xác định quá mức cơ chế trung gian.
- source_word: ἀγγέλων
  choice: các thiên sứ
  rationale: Trong ngữ cảnh này, từ này chỉ các hữu thể trên trời có liên hệ với việc ban luật pháp, chứ không phải các sứ giả loài người.
- source_word: οὐκ ἐφυλάξατε
  choice: nhưng lại không tuân giữ
  rationale: φυλάσσω có thể mang nghĩa giữ, canh giữ hoặc tuân thủ. Với luật pháp, “tuân giữ” diễn đạt tự nhiên ý thực hành và vâng theo; “nhưng lại” thể hiện rõ sự tương phản do καί tạo ra trong lời cáo buộc.
theological_decisions:
- issue: Ý nghĩa của cụm εἰς διαταγὰς ἀγγέλων về vai trò của các thiên sứ
  choice: Luật pháp được nhận qua sự sắp đặt có liên quan đến các thiên sứ.
  alternative: Luật pháp được ban qua trung gian của các thiên sứ; hoặc được nhận theo chỉ thị của các thiên sứ.
  rationale: Bản văn rõ ràng gợi đến sự tham dự hoặc trung gian của các thiên sứ trong việc ban luật pháp, nhưng sắc thái chính xác của διαταγαί và quan hệ do εἰς biểu đạt vẫn khó xác định. Bản dịch chính giữ lại sự mơ hồ có thật thay vì mô tả cụ thể cơ chế ấy.
translation_notes:
  register: Văn phong hiện đại, trang trọng và trực tiếp. “Các ông” phù hợp với lời Ê-tiên trực tiếp chất vấn hội đồng và giữ sắc thái ngôi thứ hai số nhiều, nhưng không dùng từ ngữ miệt thị. Dấu [a] được đặt ngay sau cụm từ cần chú giải.
