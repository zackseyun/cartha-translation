revisions:
- from: 'Ông nói: “Kìa, tôi thấy các tầng trời mở ra[a], và Con Người đang đứng bên phải Đức Chúa Trời[b].”'
  to: 'Ông nói: “Kìa, tôi thấy các tầng trời đã được mở ra[a], và Con Người[b] đang đứng bên phải Đức Chúa Trời.”'
  rationale: Sửa «mở ra» thành «đã được mở ra» để biểu đạt rõ hơn phân từ hoàn thành bị động của nguyên văn. Chuyển dấu [b] đến ngay sau «Con Người» để chú thích được neo đúng vào danh hiệu mà nó giải thích. Không thay đổi ý nghĩa, tư thế «đứng», hay hình ảnh vị trí bên phải Đức Chúa Trời.
