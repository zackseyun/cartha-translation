source:
  edition: SBLGNT
  text: καὶ εἶπεν· Ἰδοὺ θεωρῶ τοὺς οὐρανοὺς ⸀διηνοιγμένους καὶ τὸν υἱὸν τοῦ ἀνθρώπου ἐκ δεξιῶν ἑστῶτα τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/056.yaml
  text: And he said[a], “Look, I see the heavens opened[b], and the Son of Man standing at the right hand of God.”
translation:
  language: vi
  text: 'Ông nói: “Kìa, tôi thấy các tầng trời đã được mở ra[a], và Con Người[b] đang đứng bên phải Đức Chúa Trời.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “các tầng trời mở ra.” Tiếng Hy Lạp dùng phân từ hoàn thành bị động, nhấn mạnh rằng trong khải tượng của Ê-tiên, các tầng trời đã được mở và đang ở trong trạng thái mở.'
    reason: lexical_alternative
  - marker: b
    text: “Con Người” là một danh hiệu Mê-si-a quen thuộc, gợi lại Đa-ni-ên 7:13.
    reason: cross_reference
lexical_decisions:
- source_word: Ἰδοὺ
  choice: Kìa
  rationale: Thán từ gọi sự chú ý này giữ được tính trực tiếp và khẩn thiết trong lời ông Ê-tiên, đồng thời tự nhiên hơn các cách diễn đạt cổ trong tiếng Việt hiện đại.
- source_word: θεωρῶ
  choice: tôi thấy
  rationale: Diễn đạt tự nhiên thì hiện tại và sự tri nhận đang diễn ra trong khải tượng, không thêm sắc thái giải thích.
- source_word: τοὺς οὐρανοὺς
  choice: các tầng trời
  rationale: Giữ dạng số nhiều của tiếng Hy Lạp và sắc thái thần học, tránh thu hẹp thành bầu trời vật chất.
- source_word: διηνοιγμένους
  choice: mở ra
  rationale: Truyền đạt trạng thái đã được mở do phân từ hoàn thành bị động; cách nói tiếng Việt gọn và tự nhiên, còn chú thích nêu rõ sắc thái ngữ pháp.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: Con Người
  rationale: Giữ danh hiệu quen thuộc và mối liên hệ với Đa-ni-ên 7:13, không diễn giải thành một danh xưng thuần nhân học.
- source_word: ἐκ δεξιῶν
  choice: bên phải
  rationale: Cách nói tự nhiên trong tiếng Việt cho vị trí danh dự và uy quyền, vẫn bảo toàn hình ảnh của nguyên văn.
- source_word: ἑστῶτα
  choice: đang đứng
  rationale: Giữ rõ tư thế đứng được nguyên văn nhấn mạnh và không đồng hóa với những đoạn nói Đấng Christ ngồi.
- source_word: τοῦ θεοῦ
  choice: Đức Chúa Trời
  rationale: Danh xưng trang trọng, quen thuộc trong văn phong Kinh Thánh tiếng Việt và không đòi hỏi diễn giải thêm.
theological_decisions:
- issue: Danh hiệu Kitô học υἱὸς τοῦ ἀνθρώπου
  choice: Con Người
  alternative: Đấng Thuộc Về Loài Người
  rationale: “Con Người” vừa sát cấu trúc Hy Lạp vừa bảo tồn danh hiệu Mê-si-a và âm vang Đa-ni-ên 7:13; phương án thay thế mang tính diễn giải và làm yếu sự nhận diện danh hiệu.
- issue: Tư thế của Chúa Giê-su được tôn cao
  choice: đang đứng bên phải Đức Chúa Trời
  alternative: đang ngồi bên phải Đức Chúa Trời
  rationale: Nguyên văn nói rõ Ngài đứng. Bản dịch giữ nguyên nét riêng và sức căng thần học này, không hòa đồng với các bản văn thường mô tả Ngài ngồi.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “Kìa” để giữ sức mạnh của lời cảm thán; “các tầng trời” để phản ánh số nhiều; và “đang đứng” để làm rõ tư thế hiện tại mà không giải thích động cơ của tư thế ấy. Các dấu chú thích [a], [b] đều xuất hiện trong câu chính.
