id: ACT.7.34
reference: Acts 7:34
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἰδὼν εἶδον τὴν κάκωσιν τοῦ λαοῦ μου τοῦ ἐν Αἰγύπτῳ, καὶ τοῦ στεναγμοῦ ⸀αὐτοῦ ἤκουσα, καὶ κατέβην ἐξελέσθαι αὐτούς· καὶ νῦν δεῦρο ⸀ἀποστείλω σε εἰς Αἴγυπτον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/034.yaml
  text: I have surely seen the mistreatment of my people in Egypt[a], and I have heard their groaning, and I have come down to deliver them. And now come[b], I will send you to Egypt.
translation:
  language: vi
  text: “Ta quả thật đã thấy dân Ta ở Ai Cập bị ngược đãi[a], đã nghe tiếng rên xiết của họ, và đã xuống để giải cứu họ[b]. Bây giờ, hãy đến, Ta sẽ sai ngươi đến Ai Cập.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “cảnh khốn khổ” hoặc “cảnh áp bức”.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “giải thoát họ”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν εἶδον
  choice: Ta quả thật đã thấy
  rationale: Cấu trúc phân từ đi với động từ hữu hạn tạo sắc thái nhấn mạnh theo lối Sê-mít. “Quả thật đã thấy” giữ được sự nhấn mạnh mà vẫn tự nhiên trong tiếng Việt hiện đại.
- source_word: κάκωσιν
  choice: cảnh ... bị ngược đãi
  rationale: Danh từ này chỉ sự đối xử tàn tệ hoặc tình cảnh bị áp bức. Cách diễn đạt này rõ nghĩa, tự nhiên và không thu hẹp ý nghĩa chỉ còn một dạng áp bức cụ thể.
- source_word: λαοῦ μου τοῦ ἐν Αἰγύπτῳ
  choice: dân ta ... tại Ai Cập
  rationale: Giữ trực tiếp quan hệ sở hữu trong “dân ta” và diễn đạt cụm xác định địa điểm bằng tiếng Việt tự nhiên.
- source_word: τοῦ στεναγμοῦ αὐτοῦ
  choice: tiếng rên xiết của họ
  rationale: Đại từ Hy Lạp ở số ít quy chiếu về “dân” như một tập thể; tiếng Việt tự nhiên dùng “họ”. “Rên xiết” diễn tả tiếng than đau đớn và giữ liên hệ với trình thuật Xuất Hành.
- source_word: κατέβην
  choice: đã xuống
  rationale: Giữ nguyên hình ảnh nhân hình về việc Đức Chúa Trời đi xuống để can thiệp, không diễn giải hoặc làm nhẹ đi ngôn ngữ của bản văn.
- source_word: ἐξελέσθαι
  choice: để giải cứu
  rationale: Động từ trung thái ἐξαιρέω trong ngữ cảnh này có nghĩa cứu ra khỏi nguy nan hoặc quyền lực áp bức. “Giải cứu” rõ ràng, hiện đại và truyền đạt hành động can thiệp tích cực.
- source_word: δεῦρο
  choice: hãy đến
  rationale: Tiểu từ có chức năng mệnh lệnh, gọi Môi-se tiến đến và nhận sứ mạng. “Hãy đến” ngắn gọn, trang trọng và tự nhiên.
- source_word: ἀποστείλω σε εἰς Αἴγυπτον
  choice: ta sẽ sai con sang Ai Cập
  rationale: Thì tương lai diễn tả lời ủy nhiệm trực tiếp. “Sai ... sang” là cách nói tự nhiên khi cử một người đến một quốc gia; “ta/con” phù hợp lời phán trực tiếp của Đức Chúa Trời với Môi-se trong văn phong Kinh Thánh tiếng Việt.
theological_decisions:
- issue: Ngôn ngữ nhân hình về việc Đức Chúa Trời đi xuống
  choice: đã xuống
  alternative: đã ngự xuống; đã đến để can thiệp
  rationale: “Đã xuống” phản ánh trực tiếp κατέβην và bảo toàn sức căng thần học trong cách bản văn mô tả hành động của Đức Chúa Trời, thay vì giải thích hình ảnh thành một kết luận thần học.
- issue: Ý nghĩa của ἐξελέσθαι
  choice: giải cứu họ
  alternative: giải thoát họ
  rationale: Cả hai đều có thể diễn đạt việc cứu dân khỏi cảnh áp bức. “Giải cứu” nhấn mạnh hành động cứu khỏi nguy nan mà không thêm một hệ thống thần học chuyên biệt.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “ta/con” thể hiện lời phán trực tiếp của Đức Chúa Trời với Môi-se mà không dùng lối diễn đạt quá cổ. Các vế lặp “đã thấy… đã nghe… đã xuống” giữ nhịp điệu và tiến trình hành động của nguyên văn.
