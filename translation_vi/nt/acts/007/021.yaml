source:
  edition: SBLGNT
  text: ⸂ἐκτεθέντος δὲ αὐτοῦ ἀνείλατο αὐτὸν⸃ ἡ θυγάτηρ Φαραὼ καὶ ἀνεθρέψατο αὐτὸν ἑαυτῇ εἰς υἱόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/021.yaml
  text: But when he had been exposed[b][a], Pharaoh’s daughter took him up and raised him as her own son.
translation:
  language: vi
  text: Nhưng khi ông bị bỏ ra ngoài[a], con gái Pha-ra-ôn đã đón nhận ông[b] và nuôi ông làm con mình[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “bị đặt ra ngoài” hoặc “bị phơi bỏ.”'
    reason: lexical_alternative
  - marker: b
    text: 'Hay: “nhặt ông lên.” Động từ Hy Lạp có thể chỉ việc tiếp nhận một trẻ bị phơi bỏ.'
    reason: lexical_alternative
  - marker: c
    text: 'Sát nghĩa: “nuôi ông cho chính mình để làm con trai.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκτεθέντος
  choice: bị đem bỏ bên ngoài
  rationale: Phân từ bất định thụ động của ἐκτίθημι mô tả một trẻ sơ sinh bị đặt hoặc bỏ ra ngoài. Cách dịch này giữ được bối cảnh phơi bỏ trẻ mà không khẳng định quá mức động cơ là vĩnh viễn ruồng bỏ.
- source_word: δὲ
  choice: Nhưng
  rationale: 'δέ đánh dấu sự chuyển ý có tính tương phản: Môi-se bị đem bỏ, nhưng sau đó được con gái Pha-ra-ôn cứu nhận.'
- source_word: ἀνείλατο
  choice: đón lấy ông
  rationale: Trong ngữ cảnh trẻ bị phơi bỏ, động từ trung thái này chỉ việc nhấc hoặc nhận đứa trẻ lên. “Đón lấy” tự nhiên trong tiếng Việt và không nhập ý “nhận làm con nuôi,” vốn được diễn đạt ở phần sau.
- source_word: ἡ θυγάτηρ Φαραὼ
  choice: con gái Pha-ra-ôn
  rationale: Cách diễn đạt tự nhiên, rõ ràng trong tiếng Việt, giữ nguyên quan hệ sở thuộc của nguyên văn.
- source_word: ἀνεθρέψατο
  choice: nuôi
  rationale: ἀνατρέφω chỉ việc nuôi nấng, dưỡng dục một đứa trẻ. “Nuôi” ngắn gọn, tự nhiên và phù hợp với văn cảnh.
- source_word: ἑαυτῇ εἰς υἱόν
  choice: làm con mình
  rationale: Cụm này diễn tả việc bà nuôi Môi-se cho chính mình trong địa vị người con. “Làm con mình” truyền đạt tự nhiên cả quan hệ với bà lẫn vai trò làm con, mà không cần dùng thuật ngữ pháp lý hiện đại.
theological_decisions:
- issue: Cụm ἑαυτῇ εἰς υἱόν có hàm ý nhận làm con nhưng không dùng một động từ pháp lý riêng.
  choice: nuôi ông làm con mình
  alternative: nhận ông làm con nuôi
  rationale: Bản dịch được chọn giữ riêng hành động đón lấy và quá trình nuôi dưỡng, đồng thời tránh áp đặt khái niệm pháp lý hiện đại về việc nhận con nuôi lên nguyên văn.
translation_notes:
  register: 'Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Đại từ “ông” phù hợp với cách kể hồi tưởng về Môi-se khi nói đến thời thơ ấu. “Pha-ra-ôn” theo lối phiên âm Kinh Thánh quen thuộc. Câu giữ trình tự của nguyên văn: bị đem bỏ, được đón lấy, rồi được nuôi làm con.'
