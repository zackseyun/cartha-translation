  text: καὶ ἐπαιδεύθη ⸀Μωϋσῆς πάσῃ σοφίᾳ Αἰγυπτίων, ἦν δὲ δυνατὸς ἐν λόγοις καὶ ἔργοις ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/022.yaml
  text: And Moses was educated in all the wisdom of the Egyptians, and he was mighty in his words and deeds.
translation:
  language: vi
  text: Môi-se được đào tạo về tất cả sự khôn ngoan của người Ai Cập, và ông mạnh mẽ trong lời nói và việc làm.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “mạnh mẽ trong lời nói và hành động.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπαιδεύθη
  choice: đã được giáo dục
  rationale: Thể bị động diễn tả việc Môi-se được đào tạo và chỉ dạy; cách dịch này tự nhiên trong tiếng Việt hiện đại và phù hợp với bối cảnh học vấn Ai Cập.
- source_word: πάσῃ σοφίᾳ Αἰγυπτίων
  choice: trong mọi sự khôn ngoan của người Ai Cập
  rationale: Giữ phạm vi rộng của πάσῃ, đồng thời thể hiện sở hữu hoặc nguồn gốc qua cụm “của người Ai Cập”.
- source_word: δυνατὸς
  choice: có quyền năng
  rationale: Diễn đạt sức mạnh và khả năng hữu hiệu của δυνατός, trang trọng nhưng vẫn dễ hiểu; không làm yếu nghĩa thành chỉ “có khả năng”.
- source_word: ἐν λόγοις καὶ ἔργοις
  choice: trong lời nói cũng như việc làm
  rationale: Giữ cấu trúc cân xứng giữa λόγοις và ἔργοις bằng một cặp từ tự nhiên trong tiếng Việt.
- source_word: αὐτοῦ
  choice: ông (hàm ý sở hữu trong ngữ cảnh)
  rationale: Đại từ quy chiếu về Môi-se. Tiếng Việt không cần lặp “của ông” sau cả hai danh từ; chủ ngữ “ông” làm rõ lời nói và việc làm là của Môi-se.
theological_decisions:
- issue: Phạm vi năng lực của Môi-se trong λόγοις
  choice: Dịch là “có quyền năng trong lời nói cũng như việc làm”, theo phát biểu riêng của Ê-tiên.
  alternative: Giảm nhẹ thành “có khả năng ăn nói và hành động”, hoặc giải thích đây chỉ là danh tiếng hay ảnh hưởng của Môi-se.
  rationale: Bản dịch không hòa giải câu này với Xuất Hành 4:10, nơi Môi-se nói mình không giỏi ăn nói. Cần giữ nguyên sự căng thẳng của văn bản thay vì giải quyết bằng diễn giải.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. “Mọi sự khôn ngoan” giữ sắc thái toàn diện của nguyên văn; “lời nói cũng như việc làm” tạo nhịp cân xứng và không cổ hóa.
