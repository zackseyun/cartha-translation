revisions:
- from: “Nhưng Ta sẽ xét xử dân tộc mà họ phải làm tôi[a],” Đức Chúa Trời phán, “rồi sau đó họ sẽ ra khỏi đó và thờ phượng Ta tại nơi này.”[b]
