language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ τὸ ἔθνος ᾧ ⸀ἐὰν ⸀δουλεύσουσιν κρινῶ ἐγώ, ⸂ὁ θεὸς εἶπεν⸃, καὶ μετὰ ταῦτα ἐξελεύσονται καὶ λατρεύσουσίν μοι ἐν τῷ τόπῳ τούτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/007.yaml
  text: And I will judge the nation that they will serve[a], God said[b], and after these things they will come out and worship me in this place.
translation:
  language: vi
  text: “Và Ta sẽ xét xử dân tộc mà họ sẽ phục dịch[a],” Đức Chúa Trời phán, “sau đó họ sẽ ra đi và thờ phượng Ta[b] tại nơi này.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “dân tộc mà họ sẽ phục vụ” hoặc “dân tộc mà họ sẽ làm nô lệ cho.” Động từ Hy Lạp có nghĩa là phục vụ, nhưng trong ngữ cảnh này nói đến cảnh dân Y-sơ-ra-ên bị làm nô lệ tại Ai Cập.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “phụng sự Ta”; động từ Hy Lạp chỉ sự phục vụ mang tính tôn giáo dành cho Đức Chúa Trời.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔθνος
  choice: dân tộc
  rationale: Chỉ thực thể dân tộc-chính trị bắt dòng dõi Áp-ra-ham làm tôi, tức Ai Cập trong ngữ cảnh; “dân tộc” tự nhiên và sát nghĩa.
- source_word: ᾧ ἐὰν δουλεύσουσιν
  choice: mà họ phải làm tôi
  rationale: δουλεύω diễn tả việc phục dịch trong thân phận nô lệ. “Phải làm tôi” vừa giữ dạng động từ vừa làm rõ tính cưỡng bức trong bối cảnh.
- source_word: κρινῶ
  choice: Ta sẽ xét xử
  rationale: Giữ sắc thái tư pháp của κρίνω và hàm ý Đức Chúa Trời thi hành phán xét, không thu hẹp thành một hình thức trừng phạt cụ thể.
- source_word: ὁ θεὸς εἶπεν
  choice: Đức Chúa Trời phán
  rationale: “Phán” là cách diễn đạt trang trọng, tự nhiên khi giới thiệu lời trực tiếp của Đức Chúa Trời.
- source_word: μετὰ ταῦτα
  choice: rồi sau đó
  rationale: Diễn đạt tự nhiên trình tự thời gian mà cụm Hy Lạp chỉ ra.
- source_word: ἐξελεύσονται
  choice: họ sẽ ra khỏi đó
  rationale: Chỉ cuộc ra đi khỏi dân tộc đang bắt họ làm tôi; thêm “đó” làm đích quy chiếu rõ ràng trong tiếng Việt mà không đổi ý.
- source_word: λατρεύσουσίν μοι
  choice: thờ phượng Ta
  rationale: λατρεύω khi hướng về Đức Chúa Trời chỉ sự phụng sự mang tính tôn giáo; “thờ phượng” truyền đạt rõ nghĩa ấy trong tiếng Việt hiện đại.
- source_word: ἐν τῷ τόπῳ τούτῳ
  choice: tại nơi này
  rationale: Cách dịch trực tiếp, tự nhiên của cụm chỉ địa điểm, đồng thời giữ nguyên tính quy chiếu của “nơi này” trong bài giảng.
theological_decisions:
- issue: Nghĩa của δουλεύω trong bối cảnh nô lệ
  choice: phải làm tôi
  alternative: phục vụ; làm nô lệ cho
  rationale: Ngữ cảnh nói đến cảnh nô dịch tại Ai Cập. “Phải làm tôi” bảo toàn hình thức động từ và sắc thái phục dịch cưỡng bức, nhưng không biến câu thành thể bị động.
- issue: Nghĩa của λατρεύω đối với Đức Chúa Trời
  choice: thờ phượng Ta
  alternative: phụng sự Ta
  rationale: Động từ chỉ sự phục vụ tôn giáo dành cho Đức Chúa Trời. “Thờ phượng” rõ nghĩa với độc giả hiện đại, còn phương án “phụng sự” được ghi nhận để bảo tồn sắc thái phục vụ thiêng liêng.
- issue: Điểm quy chiếu của “nơi này”
  choice: giữ nguyên “tại nơi này”
  alternative: diễn giải thành núi này hoặc miền đất này
  rationale: Câu trích dẫn và bối cảnh diễn từ tạo nên độ căng về địa điểm. Không nên âm thầm xác định τόπος là một địa danh cụ thể trong chính văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “Ta” phù hợp với lời Đức Chúa Trời trong lời trích dẫn. Dùng “làm tôi” để diễn đạt cảnh nô dịch mà không quá cổ; giữ “nơi này” nhằm bảo toàn điểm quy chiếu và sự căng thẳng của nguyên văn.
