  terminology: Giữ “dân tộc” cho ἔθνος, “xét xử” cho κρινῶ, và “thờ phượng” cho λατρεύω. Chú thích giữ phương án “phụng sự” để phản ánh khía cạnh phục vụ tôn giáo của λατρεύω mà không áp đặt diễn giải giáo phái.
