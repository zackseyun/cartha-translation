  verdict: revise
  source_fidelity: 'Cần sửa hai điểm để sát nguyên văn hơn: καὶ mở câu là liên từ nối tiếp, không phải đối lập rõ rệt như “Nhưng”; và thì tương lai δουλεύσουσιν không tự nó nêu tình thái bắt buộc như “phải”. “Phục dịch” giữ được động từ ‘serve’ cùng sắc thái lệ thuộc trong ngữ cảnh, còn chú thích nêu rõ nghĩa nô dịch. Cụm “ra khỏi đó” là diễn giải hợp ngữ cảnh nhưng không cần thiết; “ra đi” bảo toàn sự ngắn gọn của ἐξελεύσονται.'
