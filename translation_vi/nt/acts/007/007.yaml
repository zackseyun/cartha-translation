  rationale: Bản sửa thay liên từ đối lập không có căn cứ bằng “Và”, loại bỏ tình thái “phải” không được đánh dấu trong thì tương lai Hy Lạp, và tránh thêm yếu tố chỉ nơi chốn trong “ra khỏi đó”. Các lựa chọn còn lại giữ sát nghĩa, tự nhiên trong tiếng Việt hiện đại, và bảo toàn tính không xác định của “tại nơi này”.
