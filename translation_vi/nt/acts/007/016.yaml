id: ACT.7.16
reference: Acts 7:16
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ μετετέθησαν εἰς Συχὲμ καὶ ἐτέθησαν ἐν τῷ μνήματι ⸀ᾧ ὠνήσατο Ἀβραὰμ τιμῆς ἀργυρίου παρὰ τῶν υἱῶν Ἑμμὼρ ⸀ἐν Συχέμ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/016.yaml
  text: and they were carried over to Shechem and laid in the tomb that Abraham had bought for a price of silver from the sons of Hamor in Shechem[a].
translation:
  language: vi
  text: Rồi họ được đưa đến Si-chem và được đặt trong ngôi mộ mà Áp-ra-ham đã mua với một giá bằng bạc từ các con trai của Hê-mô ở Si-chem.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cách diễn đạt của Ê-tiên kết hợp những chi tiết mà độc giả có thể đối chiếu với Sáng Thế Ký 23, nơi Áp-ra-ham mua một nơi chôn cất từ Ép-rôn tại Mặc-pê-la, và Sáng Thế Ký 33:19, nơi Gia-cốp mua một mảnh đất gần Si-chem từ các con trai của Hê-mô.
    reason: cross_reference
lexical_decisions:
- source_word: μετετέθησαν
  choice: hài cốt của họ được đưa đến
  rationale: Động từ bị động chỉ việc di chuyển người đã chết; thêm “hài cốt” theo ngữ cảnh mai táng để câu tiếng Việt tự nhiên và tránh gợi ý rằng họ còn sống khi được đưa đi.
- source_word: Συχὲμ / Συχέμ
  choice: Si-chem
  rationale: Dùng dạng phiên âm quen thuộc trong Kinh Thánh tiếng Việt cho địa danh Shechem.
- source_word: ἐτέθησαν
  choice: đặt
  rationale: Trong ngữ cảnh mai táng, “đặt trong ngôi mộ” vừa sát nghĩa vừa trang trọng, tự nhiên.
- source_word: μνήματι
  choice: ngôi mộ
  rationale: Danh từ chỉ nơi chôn cất; “ngôi mộ” phù hợp với ngữ cảnh và ngôn ngữ phổ thông.
- source_word: ᾧ
  choice: mà
  rationale: Đại từ quan hệ bổ nghĩa cho “ngôi mộ”; “mà” là cách nối tự nhiên trong tiếng Việt.
- source_word: ὠνήσατο
  choice: đã mua
  rationale: Diễn đạt hành động mua xảy ra trước việc an táng mà không cần áp đặt cách hiểu ngoài văn bản.
- source_word: τιμῆς ἀργυρίου
  choice: bằng một khoản bạc
  rationale: Giữ ý giá mua được trả bằng bạc, đồng thời diễn đạt tự nhiên hơn lối dịch quá sát “giá của bạc”.
- source_word: παρὰ τῶν υἱῶν Ἑμμὼρ
  choice: từ các con trai của Hê-mô
  rationale: παρά với sở hữu cách biểu thị nguồn giao dịch; cách dịch giữ nguyên quan hệ được nêu trong tiếng Hy Lạp.
- source_word: ἐν Συχέμ
  choice: ở Si-chem
  rationale: 'Giữ vị trí cuối câu và sự mơ hồ của cụm giới từ: có thể gắn với Hê-mô hoặc với địa điểm giao dịch, thay vì ép câu theo một cách giải thích.'
theological_decisions:
- issue: Sự căng thẳng lịch sử với các trình thuật mua nơi chôn cất trong Sáng Thế Ký
  choice: 'Giữ nguyên lời của Ê-tiên theo văn bản Hy Lạp: Áp-ra-ham mua ngôi mộ từ các con trai của Hê-mô ở Si-chem.'
  alternative: Điều chỉnh cho phù hợp với việc Gia-cốp mua đất trong Sáng Thế Ký 33:19, hoặc với việc Áp-ra-ham mua nơi chôn cất tại Mặc-pê-la trong Sáng Thế Ký 23.
  rationale: Bản dịch phải trình bày văn bản Hy Lạp như hiện có, không âm thầm dung hòa với các trình thuật liên quan. Chú thích giúp độc giả nhận biết các đoạn có thể đối chiếu mà không giải quyết thay sự căng thẳng của văn bản.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Câu tiếp nối mạch văn nên mở đầu bằng “rồi”; dùng “hài cốt” để làm rõ đối tượng được di chuyển trong ngữ cảnh sau khi qua đời. Tên riêng được phiên âm theo dạng quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
