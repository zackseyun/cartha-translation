  source_fidelity: 'Bản dịch giữ đúng các yếu tố chính của câu Hy Lạp: việc các nhân vật được chuyển đến Si-chem, được đặt trong mộ, và ngôi mộ được nói là do Áp-ra-ham mua từ các con trai Hê-mô. Tuy nhiên, việc thêm “hài cốt” cụ thể hóa đối tượng được chuyển đi hơn nguyên văn: μετετέθησαν có chủ ngữ là những người vừa được nhắc đến trong mạch văn, chứ không nêu rõ là “hài cốt”.'
