base_translation:
  language: en
  yaml_path: translation/nt/acts/007/060.yaml
  text: Then[a], kneeling down, he cried out with a loud voice, “Lord, do not hold this sin against them.” And after saying this[b], he fell asleep.
translation:
  language: vi
  text: 'Rồi ông quỳ xuống, lớn tiếng kêu lên: “Lạy Chúa, xin đừng quy tội này cho họ.” Nói xong lời ấy, ông ngủ yên[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ngủ yên” là cách nói quen thuộc để chỉ cái chết; cũng có thể dịch là “qua đời.”
    reason: lexical_alternative
lexical_decisions:
- source_word: θεὶς δὲ τὰ γόνατα
  choice: Rồi ông quỳ xuống
  rationale: Thành ngữ Hy Lạp theo nghĩa đen là “đặt đầu gối,” tức quỳ xuống. “Rồi” diễn đạt δέ như một bước tiếp diễn trong mạch kể.
- source_word: ἔκραξεν φωνῇ μεγάλῃ
  choice: và kêu lớn tiếng
  rationale: Giữ rõ cả động từ chỉ tiếng kêu mạnh và cụm từ nhấn mạnh âm lượng, đồng thời dùng cách nói tự nhiên trong tiếng Việt.
- source_word: Κύριε
  choice: Lạy Chúa
  rationale: “Lạy” phù hợp với lời cầu khẩn trực tiếp; “Chúa” bảo toàn tước hiệu κύριος và sự tôn kính, trong ngữ cảnh lời này hướng đến Đức Chúa Jêsus.
- source_word: μὴ στήσῃς αὐτοῖς ταύτην τὴν ἁμαρτίαν
  choice: xin đừng quy tội này cho họ
  rationale: “Quy tội” truyền đạt sắc thái đặt hoặc tính tội vào phần của một người; “tội này” giữ nguyên đại từ chỉ định ταύτην.
- source_word: καὶ τοῦτο εἰπὼν
  choice: Nói xong lời ấy
  rationale: Diễn đạt tự nhiên quan hệ thời gian của phân từ Hy Lạp và vẫn liên kết trực tiếp với lời cầu nguyện vừa nói.
- source_word: ἐκοιμήθη
  choice: ông an giấc
  rationale: Giữ hình ảnh giấc ngủ dùng như cách nói về cái chết, thay vì diễn giải thẳng thành “ông chết”; “an giấc” trang trọng và dễ hiểu trong tiếng Việt hiện đại.
theological_decisions:
- issue: Cách dịch ẩn dụ về cái chết ἐκοιμήθη
  choice: ông an giấc
  alternative: ông qua đời
  rationale: Bản Hy Lạp chủ ý dùng hình ảnh ngủ cho cái chết của Ê-tiên. Giữ ẩn dụ phản ánh đúng sắc thái của câu mà không phát triển thêm một giáo lý ngoài văn bản.
- issue: Cách xưng hô Κύριε trong lời cầu nguyện của Ê-tiên
  choice: Lạy Chúa
  alternative: Lạy Chủ
  rationale: Ngữ cảnh câu trước cho thấy lời này hướng đến Đức Chúa Jêsus. “Chúa” giữ tước hiệu mang sắc thái Cơ Đốc học của κύριος mà không thêm lời giải thích giáo lý vào chính văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và tự nhiên. Câu cầu nguyện dùng “xin” để thể hiện lời khẩn cầu; ẩn dụ “an giấc” được giữ lại và giải thích bằng chú thích.
