  rationale: Chỉnh nhẹ cách diễn đạt để câu văn tự nhiên hơn trong tiếng Việt hiện đại, đồng thời giữ nguyên hành động, giọng điệu cầu khẩn, sắc thái pháp lý của “quy tội,” và ẩn dụ giấc ngủ trong nguyên ngữ.
