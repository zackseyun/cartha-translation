  text: ἔφυγεν δὲ Μωϋσῆς ἐν τῷ λόγῳ τούτῳ, καὶ ἐγένετο πάροικος ἐν γῇ Μαδιάμ, οὗ ἐγέννησεν υἱοὺς δύο.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/029.yaml
  text: So Moses fled at this word[a], and became a sojourner in the land of Midian[b], where he fathered two sons.
translation:
  language: vi
  text: Do lời nói ấy, Môi-se bỏ trốn và trở thành người ngoại kiều[a] trong đất Ma-đi-an; tại đó, ông có hai con trai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “người cư trú trên đất khách” hoặc “khách ngụ cư”. Từ Hy Lạp chỉ người sống tại một miền đất không phải quê hương mình.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφυγεν
  choice: bỏ trốn
  rationale: Diễn đạt hành động chạy khỏi nơi nguy hiểm hoặc bị đe dọa, tự nhiên trong tiếng Việt và giữ được sắc thái mạnh của φεύγω.
- source_word: δὲ
  choice: và
  rationale: Trong mạch kể chuyện, δέ nối sự việc này với lời tố giác và nỗi sợ được nhắc đến trước đó; tiếng Việt không nhất thiết phải dịch thành một từ mang nghĩa đối lập.
- source_word: ἐν τῷ λόγῳ τούτῳ
  choice: Vì lời ấy
  rationale: Cụm ἐν với λόγος trong ngữ cảnh này chỉ lời nói vừa được thốt ra như nguyên cớ trực tiếp khiến Môi-se bỏ trốn. Cách dịch này tự nhiên và súc tích.
- source_word: ἐγένετο πάροικος
  choice: trở thành người ngoại kiều
  rationale: πάροικος chỉ người cư trú tại một miền đất không phải quê hương mình. “Người ngoại kiều” giữ được cả ý cư trú lẫn thân phận người ngoài, không mặc nhiên thêm ý lưu đày.
- source_word: ἐν γῇ Μαδιάμ
  choice: trong đất Ma-đi-an
  rationale: Giữ danh từ γῇ và dùng lối diễn đạt địa lý trang trọng nhưng dễ hiểu trong tiếng Việt.
- source_word: οὗ
  choice: tại đó
  rationale: Đại từ trạng ngữ này quy chiếu về đất Ma-đi-an và nêu địa điểm xảy ra sự việc kế tiếp.
- source_word: ἐγέννησεν
  choice: ông sinh được
  rationale: Với chủ thể nam, γεννάω cho biết Môi-se có con. “Sinh được” là cách nói tiếng Việt tự nhiên hơn “sinh ra” khi nói về người cha, đồng thời tránh sắc thái cổ của “sinh hạ”.
- source_word: υἱοὺς δύο
  choice: hai con trai
  rationale: Chuyển tải trực tiếp và tự nhiên nghĩa của cụm Hy Lạp.
theological_decisions:
- issue: Tính chất thân phận của Môi-se tại Ma-đi-an
  choice: người ngoại kiều
  alternative: người lưu vong / khách ngụ cư
  rationale: Nguyên ngữ nhấn mạnh việc cư trú trên đất không phải quê hương, nhưng không tự nó xác định đây là tình trạng lưu đày chính thức hay chỉ tạm trú; vì vậy tránh thu hẹp nghĩa theo một cách giải thích.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng và dễ hiểu. Dùng “Môi-se” và “Ma-đi-an” theo lối phiên âm quen thuộc; giữ hình ảnh “đất Ma-đi-an” của nguyên văn. Cấu trúc câu làm rõ quan hệ nguyên nhân mà ngữ cảnh và cụm Hy Lạp cho phép.
