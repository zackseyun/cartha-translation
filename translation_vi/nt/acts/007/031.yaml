  to: Khi Môi-se thấy cảnh tượng ấy, ông kinh ngạc. Khi ông đến gần để quan sát kỹ, có tiếng Chúa phán:[a]
  rationale: Bản sửa nêu rõ chủ thể Môi-se theo nguyên văn và làm gọn cách dẫn lời để sát cấu trúc sự kiện của «ἐγένετο φωνὴ κυρίου» mà vẫn tự nhiên trong tiếng Việt. Không thay đổi nghĩa, không thêm diễn giải thần học, và giữ chú thích tại đúng điểm của cụm «có tiếng Chúa phán».
