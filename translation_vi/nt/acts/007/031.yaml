source:
  edition: SBLGNT
  text: ὁ δὲ Μωϋσῆς ἰδὼν ⸀ἐθαύμασεν τὸ ὅραμα. προσερχομένου δὲ αὐτοῦ κατανοῆσαι ἐγένετο φωνὴ ⸀κυρίου·
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/031.yaml
  text: 'When Moses saw it[a], he marveled at the sight. And as he came near to look closely[c][b], a voice of the Lord came:'
translation:
  language: vi
  text: Khi Môi-se thấy cảnh tượng ấy, ông kinh ngạc. Khi ông đến gần để quan sát kỹ, có tiếng Chúa phán:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “Bấy giờ có tiếng Chúa phán.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν
  choice: khi thấy
  rationale: Phân từ bất định của ὁράω diễn tả hành động xảy ra trước động từ chính; cấu trúc “khi thấy” tự nhiên trong tiếng Việt và giữ quan hệ thời gian.
- source_word: ἐθαύμασεν
  choice: kinh ngạc
  rationale: Diễn đạt sự sửng sốt, thán phục trước hiện tượng lạ bằng từ ngữ hiện đại, trang trọng vừa phải.
- source_word: τὸ ὅραμα
  choice: cảnh tượng ấy
  rationale: ὅραμα có thể chỉ điều được nhìn thấy hoặc khải tượng. Trong ngữ cảnh Môi-se đang nhìn hiện tượng bụi gai, “cảnh tượng” tự nhiên mà không hàm ý đây chỉ là trải nghiệm nội tâm.
- source_word: προσερχομένου
  choice: lúc ông đến gần
  rationale: Giữ giá trị thời gian của kết cấu sở hữu cách tuyệt đối và chuyển động tiến lại gần.
- source_word: κατανοῆσαι
  choice: để quan sát kỹ
  rationale: Thể hiện hành động chú ý xem xét cẩn thận, phù hợp trọng tâm thị giác của ngữ cảnh.
- source_word: ἐγένετο φωνὴ
  choice: có tiếng ... phán rằng
  rationale: ἐγένετο φωνὴ giới thiệu sự xuất hiện của tiếng nói. Vì câu kế tiếp sẽ nêu lời được nói, “phán rằng” là cách dẫn lời tự nhiên trong văn thuật chuyện Kinh Thánh tiếng Việt.
- source_word: κυρίου
  choice: Chúa
  rationale: Dịch κύριος theo danh xưng “Chúa”, không chuyển thành dạng biểu thị trực tiếp danh YHWH.
theological_decisions:
- issue: Cách dịch κύριος trong bối cảnh Chúa hiện ra
  choice: Chúa
  alternative: ĐỨC CHÚA
  rationale: Bản Hy Lạp dùng κύριος chứ không ghi Danh Thánh bằng tiếng Hê-bơ-rơ. “Chúa” phản ánh trực tiếp từ Hy Lạp, còn “ĐỨC CHÚA” sẽ làm rõ một cách diễn giải dựa trên liên hệ với Xuất Hành 3.
- issue: Chủ thể của tiếng nói
  choice: tiếng của Chúa
  alternative: tiếng Chúa
  rationale: Giữ quan hệ sở hữu của φωνὴ κυρίου mà không diễn giải thêm về bản thể hay cách thức Chúa hiện diện.
translation_notes:
  register: Văn phong thuật chuyện hiện đại, trang trọng và dễ hiểu. Dùng “Môi-se” theo lối phiên âm quen thuộc. Dấu hai chấm sau “rằng” chuẩn bị cho lời trực tiếp ở câu kế tiếp; chú thích được đặt ngay tại cuối câu.
