id: ACT.7.23
reference: Acts 7:23
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ὡς δὲ ἐπληροῦτο αὐτῷ τεσσερακονταετὴς χρόνος, ἀνέβη ἐπὶ τὴν καρδίαν αὐτοῦ ἐπισκέψασθαι τοὺς ἀδελφοὺς αὐτοῦ τοὺς υἱοὺς Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/023.yaml
  text: When he was approaching forty years of age[a], it came into his heart to visit his brothers[c][b], the sons of Israel.
translation:
  language: vi
  text: Khi ông sắp tròn bốn mươi tuổi[a], trong lòng ông nảy ra ý định[b] đi thăm[c] anh em mình, tức là con cái Y-sơ-ra-ên[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “khi khoảng thời gian bốn mươi năm của ông sắp mãn.”'
    reason: Câu Hy Lạp diễn tả khoảng thời gian bốn mươi năm đang được hoàn tất, chứ không dùng cách nói đơn giản “ông đã bốn mươi tuổi”.
  - marker: b
    text: 'Nghĩa đen gần hơn: “điều ấy dấy lên trong lòng ông”; đây là thành ngữ chỉ một ý muốn hoặc quyết tâm nội tâm.'
    reason: Bảo lưu hình ảnh của thành ngữ Hy Lạp và nêu cách hiểu tự nhiên trong tiếng Việt.
  - marker: c
    text: “Đi thăm” cũng có thể mang sắc thái đến xem tình cảnh hoặc chăm nom.
    reason: Động từ Hy Lạp ἐπισκέπτομαι có trường nghĩa rộng hơn một cuộc thăm viếng xã giao.
  - marker: d
    text: “Anh em” ở đây là những người cùng dân tộc với Môi-se; “con cái Y-sơ-ra-ên” cũng có thể diễn đạt là “dân Y-sơ-ra-ên” hoặc “người Y-sơ-ra-ên.”
    reason: Làm rõ quan hệ giữa cụm thân tộc và cụm đồng vị chỉ cộng đồng dân tộc.
lexical_decisions:
- source_word: Ὡς δὲ
  choice: Khi
  rationale: Mở đầu một mệnh đề thời gian và chuyển tiếp câu chuyện. “Khi” diễn đạt tự nhiên giá trị thời gian; quan hệ nối tiếp đã rõ trong văn cảnh nên không cần thêm một từ như “bấy giờ”.
- source_word: ἐπληροῦτο αὐτῷ τεσσερακονταετὴς χρόνος
  choice: ông sắp tròn bốn mươi tuổi
  rationale: Cụm Hy Lạp nói một khoảng bốn mươi năm đang được hoàn tất đối với ông. “Sắp tròn bốn mươi tuổi” vừa tự nhiên trong tiếng Việt vừa giữ sắc thái tiến đến mốc tuổi, thay vì biến câu thành một lời xác định đơn giản rằng ông đã đúng bốn mươi tuổi.
- source_word: ἀνέβη ἐπὶ τὴν καρδίαν αὐτοῦ
  choice: trong lòng ông nảy ra ý định
  rationale: Giữ hình ảnh về một ý định phát sinh trong lòng, đồng thời diễn đạt thành ngữ nguồn bằng tiếng Việt hiện đại dễ hiểu; không giản lược hoàn toàn thành “ông quyết định”.
- source_word: ἐπισκέψασθαι
  choice: đi thăm
  rationale: Động từ có thể bao hàm việc đến xem xét tình cảnh hoặc quan tâm chăm nom. Trong câu này, “đi thăm” là cách diễn đạt ngắn gọn và tự nhiên, còn chú thích bảo lưu sắc thái rộng hơn.
- source_word: τοὺς ἀδελφοὺς αὐτοῦ
  choice: anh em mình
  rationale: Giữ danh xưng thân tộc ở số nhiều và để cụm đồng vị theo sau xác định đây là những người cùng dân tộc với Môi-se. “Mình” quy chiếu tự nhiên về chủ ngữ trong tiếng Việt.
- source_word: τοὺς υἱοὺς Ἰσραήλ
  choice: con cái Y-sơ-ra-ên
  rationale: “Con cái Y-sơ-ra-ên” bảo lưu thành ngữ Kinh Thánh chỉ cộng đồng hậu duệ của Y-sơ-ra-ên mà không khiến độc giả hiện đại hiểu sai là chỉ nói đến nam giới.
theological_decisions:
- issue: Cách gọi thân tộc và cộng đồng dân giao ước
  choice: anh em mình, tức là con cái Y-sơ-ra-ên
  alternative: đồng bào Y-sơ-ra-ên của mình
  rationale: Bản dịch giữ cả ngôn ngữ thân tộc “anh em” lẫn cụm đồng vị “con cái Y-sơ-ra-ên”, nhờ đó bảo tồn sắc thái nguồn và làm rõ nhóm người được nói đến. “Con cái” thể hiện danh xưng tập thể, không áp đặt ý rằng chỉ nam giới mới thuộc nhóm này.
- issue: Mức độ quyết tâm trong thành ngữ về lòng
  choice: trong lòng ông nảy ra ý định
  alternative: ông quyết định
  rationale: Nguồn mô tả một ý định dấy lên trong lòng nhưng không dùng trực tiếp một động từ thuần túy có nghĩa “quyết định”. Cách chọn giữ được hình ảnh và không xác định quá mức tâm lý hay mức độ cam kết của Môi-se.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ đọc. Câu giữ thành ngữ về “lòng” cùng ngôn ngữ thân tộc của nguyên văn, nhưng dùng trật tự từ tự nhiên trong tiếng Việt. Danh xưng “Y-sơ-ra-ên” theo lối phiên âm Kinh Thánh tiếng Việt quen thuộc.
