id: ACT.7.38
reference: Acts 7:38
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οὗτός ἐστιν ὁ γενόμενος ἐν τῇ ἐκκλησίᾳ ἐν τῇ ἐρήμῳ μετὰ τοῦ ἀγγέλου τοῦ λαλοῦντος αὐτῷ ἐν τῷ ὄρει Σινᾶ καὶ τῶν πατέρων ἡμῶν, ὃς ἐδέξατο ⸀λόγια ζῶντα δοῦναι ⸀ἡμῖν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/038.yaml
  text: This is the one who was in the assembly in the wilderness with the angel who was speaking to him on Mount Sinai[a], and with our fathers[c][b]; he received living oracles to give to us.
translation:
  language: vi
  text: Chính người này đã ở giữa hội chúng[a] trong hoang mạc, cùng với thiên sứ đang nói với ông trên núi Si-nai và với các tổ phụ của chúng ta[c]. Ông đã nhận những lời phán sống động[b] để trao cho chúng ta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch là “cộng đồng”; theo cách dịch truyền thống: “Hội Thánh trong hoang mạc.”'
    reason: alternative_reading
  - marker: b
    text: Cũng có thể dịch là “những lời sống động” hoặc “những lời phán ban sự sống.”
    reason: lexical_alternative
  - marker: c
    text: “Các tổ phụ của chúng ta” chỉ các bậc tiền nhân của dân Y-sơ-ra-ên; cũng có thể dịch khái quát hơn là “tổ tiên của chúng ta.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκκλησίᾳ
  choice: hội chúng
  rationale: “Hội chúng” diễn đạt một cộng đồng đang tụ họp, phù hợp với dân Y-sơ-ra-ên trong hoang mạc, đồng thời tránh đưa hàm ý định chế về “Hội Thánh” thời sau vào câu này.
- source_word: ἐρήμῳ
  choice: hoang mạc
  rationale: “Hoang mạc” là cách nói tự nhiên, trang trọng và phù hợp với bối cảnh dân Y-sơ-ra-ên lưu lạc sau cuộc Xuất Hành.
- source_word: ἀγγέλου
  choice: thiên sứ
  rationale: Trong bối cảnh núi Si-nai và mạch văn Công Vụ 7, từ này chỉ một hữu thể thiên giới chứ không phải sứ giả loài người.
- source_word: λαλοῦντος
  choice: đang nói với
  rationale: Cách dịch này giữ sắc thái tiếp diễn của phân từ hiện tại mà không dùng “phán”, vốn có thể khiến người đọc hiểu thiên sứ là nguồn ban lời mặc khải.
- source_word: ὄρει Σινᾶ
  choice: núi Si-nai
  rationale: Đây là cách gọi địa danh quen thuộc và tự nhiên trong tiếng Việt.
- source_word: πατέρων ἡμῶν
  choice: các tổ phụ của chúng ta
  rationale: “Các tổ phụ” giữ sắc thái nam giới cụ thể của từ Hy Lạp và chỉ các bậc tiền nhân của dân Y-sơ-ra-ên; “của chúng ta” bảo toàn việc Ê-tiên đồng nhất mình và người nghe với lịch sử giao ước ấy.
- source_word: ἐδέξατο
  choice: đã nhận
  rationale: Diễn đạt trực tiếp vai trò của Môi-se là người tiếp nhận mặc khải từ Đức Chúa Trời.
- source_word: λόγια
  choice: những lời phán
  rationale: λόγια ở đây chỉ những lời có nguồn gốc thần thượng. “Những lời phán” dễ hiểu hơn “sấm ngôn” trong tiếng Việt hiện đại nhưng vẫn giữ sắc thái mặc khải.
- source_word: ζῶντα
  choice: sống động
  rationale: Giữ hình ảnh lời phán là “sống” mà không thu hẹp ý nghĩa thành cách giải thích “ban sự sống”.
- source_word: δοῦναι
  choice: để trao
  rationale: Diễn đạt mục đích Môi-se nhận các lời phán nhằm chuyển trao cho dân; “trao” tự nhiên hơn “cho” trong ngữ cảnh tiếp nhận và truyền đạt mặc khải.
- source_word: ἡμῖν
  choice: cho chúng ta
  rationale: Giữ nguyên đại từ ngôi thứ nhất số nhiều và sự liên đới của người nói với dân Y-sơ-ra-ên.
- source_word: ὁ γενόμενος
  choice: đã ở giữa
  rationale: Diễn đạt tự nhiên việc người ấy hiện diện giữa hội chúng trong bối cảnh được nhắc đến, thay vì dịch sát cứng là “đã trở nên”.
theological_decisions:
- issue: Có nên dịch ἐκκλησίᾳ là “Hội Thánh” khi nói về Y-sơ-ra-ên trong hoang mạc hay không
  choice: hội chúng
  alternative: Hội Thánh; cộng đồng
  rationale: Câu này nói về dân Y-sơ-ra-ên tụ họp trong hoang mạc. “Hội chúng” bảo toàn nghĩa cơ bản của từ mà không áp đặt kết luận giáo hội học về quan hệ giữa Y-sơ-ra-ên và Hội Thánh.
- issue: Có nên diễn giải λόγια ζῶντα thành “những lời ban sự sống” hay không
  choice: những lời phán sống động
  alternative: những lời sống động; những lời phán ban sự sống
  rationale: Cụm Hy Lạp cô đọng và có sức gợi thần học. Bản dịch chính giữ đặc tính “sống” của những lời phán mà không quyết định thay người đọc rằng ý nghĩa duy nhất là chúng ban sự sống.
translation_notes:
  register: Bản dịch dùng tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. “Hội chúng” và “những lời phán sống động” giữ được sắc thái Kinh Thánh mà không quá cổ; tên địa danh dùng dạng quen thuộc “Si-nai”. Các dấu chú thích [a], [b], [c] đều xuất hiện trong chính văn.
