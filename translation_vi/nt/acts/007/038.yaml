  terminology: 'Thuật ngữ được dùng nhất quán và thận trọng: “hội chúng” cho ἐκκλησία, “thiên sứ” cho ἄγγελος, “các tổ phụ” cho πατέρες, và “những lời phán” cho λόγια. Chú thích về “Hội Thánh trong hoang mạc”, “lời sống động/lời phán ban sự sống”, và “tổ tiên” nêu các khả năng thay thế mà không áp đặt cách hiểu giáo phái.'
