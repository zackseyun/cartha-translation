  text: Khi nghe những điều ấy, họ vô cùng phẫn nộ[a] và nghiến răng với ông.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “lòng họ như bị cắt (hay cưa) xuyên.” Động từ Hy Lạp theo nghĩa đen gợi hình ảnh bị cắt xuyên, diễn tả sự kích động dữ dội trong lòng; trong ngữ cảnh này, đó là sự phẫn nộ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀκούοντες δὲ ταῦτα
  choice: Khi nghe những lời ấy
  rationale: Phân từ Ἀκούοντες nêu hoàn cảnh thời gian của các động từ chính; δέ đánh dấu diễn tiến nhẹ và không cần dịch riêng trong tiếng Việt; ταῦτα chỉ những điều Ê-tiên vừa nói, được diễn đạt tự nhiên là “những lời ấy”.
- source_word: διεπρίοντο ταῖς καρδίαις αὐτῶν
  choice: họ giận điên lên trong lòng
  rationale: Động từ διεπρίοντο theo nghĩa đen gợi hình ảnh bị cắt hoặc cưa xuyên qua, nhưng trong ngữ cảnh này diễn tả sự kích động dữ dội, cụ thể là cơn giận. Cách dịch này truyền đạt rõ cảm xúc trong tiếng Việt hiện đại; chú thích giữ lại hình ảnh nguyên ngữ.
- source_word: ἔβρυχον τοὺς ὀδόντας ἐπ’ αὐτόν
  choice: nghiến răng căm tức ông
  rationale: ἔβρυχον τοὺς ὀδόντας là hành động nghiến răng vì giận dữ; ἐπ’ αὐτόν hướng sự thù địch về phía Ê-tiên. “Căm tức ông” làm rõ hướng và sắc thái thù địch một cách tự nhiên.
