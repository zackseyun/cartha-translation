review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng hành động ném đá đang tiếp diễn, lời khẩn nguyện trực tiếp với Chúa Giê-su, và lời xin Ngài tiếp nhận πνεῦμά μου. Tuy nhiên, “cầu khẩn rằng” không diễn đạt rõ hai phân từ phối hợp ἐπικαλούμενον καὶ λέγοντα và không tự nhiên trong tiếng Việt.
  naturalness: “Họ đang ném đá” là cách diễn đạt trực tiếp, tự nhiên hơn “Họ cứ ném đá” trong ngữ cảnh hành hình đang diễn ra. “Kêu cầu và nói” vừa tự nhiên vừa giữ được cấu trúc của nguyên ngữ. Cách xưng “con” trong lời cầu nguyện vẫn trang trọng và phù hợp văn phong Kinh Thánh Việt ngữ.
  terminology: Giữ “Lạy Chúa Giê-su” cho Κύριε Ἰησοῦ và “xin tiếp nhận linh hồn con” là lối diễn đạt Kinh Thánh Việt ngữ quen thuộc, trang trọng trong ngữ cảnh hấp hối. Dù πνεῦμα về mặt từ vựng là “thần/linh”, “linh hồn” ở đây diễn đạt tự nhiên sự phó thác bản thân lúc chết mà không buộc một hệ thống nhân học chi tiết.
  issues:
  - severity: medium
    issue: Cụm “cầu khẩn rằng” gộp và làm mờ hai phân từ ἐπικαλούμενον καὶ λέγοντα.
    rationale: Nguyên ngữ nói Ê-tiên “kêu cầu và nói”. Trong tiếng Việt, “cầu khẩn rằng” không phải là kết hợp tự nhiên; thêm “và nói” bảo toàn cấu trúc và làm lời dẫn trực tiếp rõ ràng.
  - severity: low
    issue: “Họ cứ ném đá” hơi khẩu ngữ và có thể nhấn vào sự lặp lại hơn là hành động đang diễn tiến.
    rationale: Thì chưa hoàn thành ἐλιθοβόλουν được diễn đạt trung tính và sát hơn bằng “Họ đang ném đá”.
  - severity: low
    issue: Chú thích dùng “khấn xin” như một cách giải thích thay thế nhưng chưa nêu trực tiếp sắc thái “kêu cầu/invoke” của ἐπικαλέομαι.
    rationale: Nên diễn đạt chú thích rõ rằng phân từ này có thể chỉ hành động kêu cầu một đấng được hướng đến trong lời nguyện, không chỉ là kêu lớn tiếng.
