revisions:
- from: Họ cứ ném đá Ê-tiên trong khi ông cầu khẩn rằng:[a] “Lạy Chúa Giê-su, xin tiếp nhận linh hồn con.”
  to: Họ đang ném đá Ê-tiên, trong khi ông kêu cầu và nói:[a] “Lạy Chúa Giê-su, xin tiếp nhận linh hồn con.”
  rationale: Bản sửa giữ sắc thái tiếp diễn của động từ chính, biểu đạt riêng cả hai phân từ Hy Lạp, và dùng một lời dẫn tự nhiên trong tiếng Việt. Chú thích được chỉnh để phản ánh sát hơn khả năng “kêu cầu/cầu nguyện với” của ἐπικαλούμενον mà không thêm đối tượng vào bản văn chính.
