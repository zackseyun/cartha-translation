  text: καὶ ἐλιθοβόλουν τὸν Στέφανον ἐπικαλούμενον καὶ λέγοντα· Κύριε Ἰησοῦ, δέξαι τὸ πνεῦμά μου·
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/059.yaml
  text: And they were stoning Stephen as he called out and said[a], “Lord Jesus, receive my spirit.”
translation:
  language: vi
  text: Họ đang ném đá Ê-tiên, trong khi ông kêu cầu và nói:[a] “Lạy Chúa Giê-su, xin tiếp nhận linh hồn con.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “trong khi ông kêu cầu Ngài và nói.” Phân từ Hy Lạp có thể diễn tả việc kêu cầu hoặc cầu nguyện với một đấng được hướng đến.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλιθοβόλουν
  choice: Họ cứ ném đá
  rationale: Thì chưa hoàn thành diễn tả hành động đang tiếp diễn; “cứ ném đá” truyền đạt sắc thái kéo dài một cách tự nhiên trong tiếng Việt.
- source_word: τὸν Στέφανον
  choice: Ê-tiên
  rationale: Dùng dạng tên riêng quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
- source_word: ἐπικαλούμενον
  choice: trong khi ông cầu khẩn
  rationale: Phân từ bổ nghĩa cho Ê-tiên và trong ngữ cảnh này chỉ lời khẩn cầu trực tiếp hướng đến Chúa Giê-su; “cầu khẩn” giữ rõ sắc thái khẩn nguyện mà không thêm tân ngữ không có mặt trong bản Hy Lạp.
- source_word: καὶ λέγοντα
  choice: rằng
  rationale: Hai phân từ phối hợp được diễn đạt gọn, tự nhiên bằng “cầu khẩn rằng”, tránh cách lặp nặng nề “cầu khẩn và nói” trong tiếng Việt.
- source_word: Κύριε Ἰησοῦ
  choice: Lạy Chúa Giê-su
  rationale: “Lạy” là từ xưng hô trang trọng, tự nhiên trong lời cầu nguyện; “Chúa” bảo toàn ý nghĩa của κύριος và lời trực tiếp thưa với Giê-su.
- source_word: δέξαι
  choice: xin tiếp nhận
  rationale: Mệnh lệnh cầu khiến trong lời khẩn nguyện được diễn đạt bằng “xin”; “tiếp nhận” giữ sắc thái trang trọng và phó thác của δέχομαι.
- source_word: τὸ πνεῦμά μου
  choice: linh hồn con
  rationale: Trong ngữ cảnh cận tử, πνεῦμα chỉ phần linh thiêng/sự sống của Ê-tiên được phó thác. “Linh hồn con” là cách nói tự nhiên khi trực tiếp thưa với Chúa trong tiếng Việt, dù từ Hy Lạp sát chữ là “thần linh/tâm linh của tôi”.
theological_decisions:
- issue: Lời của Ê-tiên có nên được thể hiện rõ là lời cầu khẩn hướng đến Chúa Giê-su phục sinh hay không
  choice: Dịch ἐπικαλούμενον là “cầu khẩn” và giữ lời xưng hô trực tiếp “Lạy Chúa Giê-su”
  alternative: “kêu lên và nói” hoặc “kêu cầu Ngài rằng”
  rationale: Bản Hy Lạp trực tiếp trình bày Ê-tiên thưa với Giê-su. “Cầu khẩn” giữ được sắc thái khẩn nguyện của ἐπικαλέομαι mà không chèn thêm một tân ngữ ngầm hay làm mờ đối tượng của lời nói.
- issue: Cách dịch πνεῦμα trong lời phó thác lúc chết
  choice: “linh hồn con”
  alternative: “thần linh con” hoặc “hơi sống của con”
  rationale: Ngữ cảnh nói đến sự phó thác bản thân khi chết. “Linh hồn” là cách diễn đạt dễ hiểu và trang nghiêm trong tiếng Việt, nhưng không nhằm xác quyết một hệ thống nhân học chi tiết vượt quá câu văn.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. Dùng “ông” cho Ê-tiên trong lời kể, nhưng dùng “con” khi ông trực tiếp thưa với Chúa, phù hợp lối xưng hô cầu nguyện tự nhiên trong tiếng Việt. Dấu [a] được đặt ngay sau mệnh đề mà chú thích giải thích.
