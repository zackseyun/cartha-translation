source:
  edition: SBLGNT
  text: εἶπεν δὲ αὐτῷ ὁ κύριος· Λῦσον τὸ ὑπόδημα τῶν ποδῶν σου, ὁ γὰρ τόπος ⸀ἐφ’ ᾧ ἕστηκας γῆ ἁγία ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/033.yaml
  text: Then the Lord said to him[a], ‘Take off the sandals from your feet, for the place on which you are standing is holy ground.’
translation:
  language: vi
  text: 'Bấy giờ Chúa phán với ông: “Hãy cởi dép khỏi chân con, vì nơi con đang đứng là đất thánh.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κύριος
  choice: Chúa
  rationale: Giữ cách dịch thông dụng và trang trọng cho tước hiệu κύριος; không dùng cách trình bày riêng dành cho danh Đức Chúa Trời vì bản Hy Lạp tại đây chỉ có κύριος.
- source_word: Λῦσον
  choice: cởi
  rationale: Động từ có nghĩa gốc là “tháo, cởi,” và trong ngữ cảnh giày dép, “cởi” là cách diễn đạt tự nhiên, rõ nghĩa trong tiếng Việt hiện đại.
- source_word: τὸ ὑπόδημα τῶν ποδῶν σου
  choice: dép khỏi chân
  rationale: ὑπόδημα ở số ít, còn ποδῶν ở số nhiều. Danh từ “dép” trong tiếng Việt không bắt buộc biểu thị số nên vừa tự nhiên vừa không áp đặt số nhiều trái với hình thức Hy Lạp; chú thích ghi lại cấu trúc sát chữ.
- source_word: ὁ γὰρ τόπος ἐφ’ ᾧ ἕστηκας
  choice: vì nơi con đang đứng
  rationale: “Vì” thể hiện quan hệ giải thích của γάρ; “nơi…đang đứng” truyền đạt tự nhiên giới từ ἐπί và trạng thái hiện tại của thể hoàn thành ἕστηκας.
- source_word: γῆ ἁγία
  choice: đất thánh
  rationale: Trong khung cảnh tại chỗ, γῆ chỉ mặt đất; “đất thánh” là cách diễn đạt ngắn gọn, trang trọng và quen thuộc, giữ cấu trúc vị ngữ của nguyên văn.
theological_decisions:
- issue: Cách dịch κύριος trong lời trích dẫn về sự hiện ra của Đức Chúa Trời
  choice: Chúa
  alternative: ĐỨC CHÚA
  rationale: Nguyên văn Tân Ước dùng κύριος chứ không trực tiếp ghi Danh Thánh tiếng Hê-bơ-rơ. “Chúa” giữ sự tôn kính và ưu tiên chứng cứ Hy Lạp mà không đưa quy ước trình bày Cựu Ước vào câu này.
- issue: Đại từ trong lời Chúa nói với Môi-se
  choice: con
  alternative: ngươi
  rationale: Tiếng Hy Lạp chỉ đánh dấu ngôi thứ hai số ít, không quy định sắc thái xã hội. “Con” là cách xưng gọi tự nhiên, trang trọng trong tiếng Việt hiện đại khi Chúa phán với một người, còn “ngươi” dễ tạo sắc thái cổ hoặc gay gắt không có trong nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. “Bấy giờ” nối lời phán với diễn tiến câu chuyện; dấu ngoặc kép thể hiện lời nói trực tiếp. Cách dùng “dép” không đánh dấu số trong chính văn giữ được sự tự nhiên của tiếng Việt, còn chú thích bảo lưu chi tiết số ít/số nhiều của tiếng Hy Lạp.
