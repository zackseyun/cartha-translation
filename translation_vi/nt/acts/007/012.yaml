  source_fidelity: Bản dịch phản ánh đúng cấu trúc thời gian của ἀκούσας, nội dung lời gián tiếp, hành động sai phái, và ý nghĩa “lần thứ nhất” của πρῶτον. “Lương thực” là lựa chọn an toàn cho σιτία, vốn có thể chỉ ngũ cốc hoặc lương thực nói rộng hơn trong ngữ cảnh này.
  naturalness: “Bên Ai Cập có” không tự nhiên trong văn viết tiếng Việt hiện đại. Cụm “nghe tin ở Ai Cập có lương thực” rõ ràng, tự nhiên, và vẫn giữ nguyên nội dung của nguyên văn. Thêm “các” trước “tổ phụ chúng ta” giúp tân ngữ số nhiều rõ hơn.
  terminology: “Gia-cốp,” “Ai Cập,” và “các tổ phụ chúng ta” phù hợp văn phong Kinh Thánh trang trọng. “Các tổ phụ” giữ được quy chiếu nam tính và gia tộc của τοὺς πατέρας ἡμῶν mà không diễn giải thành “các tộc trưởng.” Chú thích từ vựng cân bằng hợp lý giữa nghĩa rộng “lương thực” và nghĩa cụ thể theo bối cảnh là “ngũ cốc.”
