  text: ἀκούσας δὲ Ἰακὼβ ὄντα ⸂σιτία εἰς Αἴγυπτον⸃ ἐξαπέστειλεν τοὺς πατέρας ἡμῶν πρῶτον·
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/012.yaml
  text: But when Jacob heard that there was grain in Egypt[a], he sent out our fathers the first time.
translation:
  language: vi
  text: Nhưng khi Gia-cốp nghe tin ở Ai Cập có lương thực[a], ông sai các tổ phụ chúng ta đi lần thứ nhất.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “ngũ cốc”. Từ Hy Lạp σιτία có thể chỉ lương thực nói chung, dù trong bối cảnh này có lẽ ngũ cốc được nhắm đến.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσας
  choice: khi ... nghe
  rationale: Phân từ bất định được hiểu theo thời gian; cách diễn đạt này tự nhiên trong tiếng Việt và giữ được trình tự sự việc.
- source_word: δὲ
  choice: Nhưng
  rationale: Đánh dấu sự chuyển ý nhẹ trong lời thuật của Ê-tiên; “Nhưng” duy trì mạch diễn ngôn mà không làm sự tương phản trở nên quá mạnh.
- source_word: ὄντα ⸂σιτία εἰς Αἴγυπτον⸃
  choice: rằng bên Ai Cập có lương thực
  rationale: Cấu trúc đối cách kèm phân từ sau ἀκούω được chuyển thành lời gián tiếp tự nhiên. “Bên Ai Cập” diễn đạt đích xác địa điểm trong tiếng Việt.
- source_word: σιτία
  choice: lương thực
  rationale: Từ này có thể chỉ ngũ cốc hoặc vật thực nói chung. “Lương thực” tự nhiên, phù hợp bối cảnh nạn đói và vẫn giữ được phạm vi nghĩa rộng của từ Hy Lạp; chú thích nêu cách hiểu cụ thể hơn là “ngũ cốc”.
- source_word: ἐξαπέστειλεν
  choice: sai ... đi
  rationale: Diễn đạt tự nhiên hành động phái người lên đường, đồng thời phản ánh sắc thái của động từ ghép ἐξαποστέλλω.
- source_word: τοὺς πατέρας ἡμῶν
  choice: tổ phụ chúng ta
  rationale: Giữ ngôn ngữ nam tính và tính gia tộc của nguyên văn, vì ở đây chỉ các nam tổ tiên cụ thể của Israel; tránh từ diễn giải hơn như “các tộc trưởng”.
- source_word: πρῶτον
  choice: lần thứ nhất
  rationale: Nêu rõ đây là chuyến đi đầu trong nhiều chuyến, chuẩn bị cho lần thứ hai được nhắc đến sau đó.
theological_decisions:
- issue: Cách dịch τοὺς πατέρας ἡμῶν
  choice: tổ phụ chúng ta
  alternative: tổ tiên chúng ta; các tộc trưởng
  rationale: “Tổ phụ” giữ đúng hình thức nam tính và sắc thái gia tộc của nguyên văn, vì trong ngữ cảnh này từ ấy nói đến các con trai của Gia-cốp, tức những nam tổ tiên của Israel, chứ không nói chung về mọi tổ tiên.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Gia-cốp,” “Ai Cập” và “tổ phụ” theo cách gọi Kinh Thánh quen thuộc; cấu trúc câu được giữ gọn và tự nhiên.
