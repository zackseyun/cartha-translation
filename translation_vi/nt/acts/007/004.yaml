id: ACT.7.4
reference: Acts 7:4
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τότε ἐξελθὼν ἐκ γῆς Χαλδαίων κατῴκησεν ἐν Χαρράν. κἀκεῖθεν μετὰ τὸ ἀποθανεῖν τὸν πατέρα αὐτοῦ μετῴκισεν αὐτὸν εἰς τὴν γῆν ταύτην εἰς ἣν ὑμεῖς νῦν κατοικεῖτε,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/004.yaml
  text: Then, after he had gone out from the land of the Chaldeans, he settled in Haran. And from there, after his father died, God moved him into this land in which you now live,
translation:
  language: vi
  text: Bấy giờ, sau khi ra khỏi xứ của người Canh-đê, ông đến định cư tại Ha-ran. Từ đó, sau khi cha ông qua đời, Đức Chúa Trời đã đưa ông đến xứ này, là nơi hiện nay anh em đang sinh sống.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Trong tiếng Hy Lạp, chủ ngữ của động từ “đưa ông đến” không được nói rõ, nhưng ngữ cảnh cho thấy đó là Đức Chúa Trời. Ê-tiên nói cuộc chuyển đi này xảy ra sau khi cha Áp-ra-ham qua đời; xin đối chiếu Sáng Thế Ký 11:32; 12:4 về trình tự thời gian có liên quan.
    reason: lexical_alternative; cross_reference
lexical_decisions:
- source_word: τότε
  choice: Bấy giờ
  rationale: Dấu nối thời gian dẫn vào sự kiện kế tiếp; cách diễn đạt trang trọng, tự nhiên trong lời thuật.
- source_word: ἐξελθὼν ἐκ γῆς Χαλδαίων
  choice: sau khi ra khỏi xứ của người Canh-đê
  rationale: Phân từ bất định diễn tả hành động xảy ra trước động từ chính; giữ đầy đủ γῆς Χαλδαίων thay vì rút gọn thành tên vùng.
- source_word: κατῴκησεν ἐν Χαρράν
  choice: ông đến định cư tại Ha-ran
  rationale: κατοικέω ở đây nói đến việc lập nơi cư trú; “đến định cư” tự nhiên và cụ thể hơn chỉ nói “sống”.
- source_word: κἀκεῖθεν
  choice: Từ đó
  rationale: Truyền đạt hướng chuyển đi từ địa điểm vừa nêu; quan hệ nối tiếp đã rõ trong tiếng Việt nên không cần thêm “và”.
- source_word: μετὰ τὸ ἀποθανεῖν τὸν πατέρα αὐτοῦ
  choice: sau khi cha ông qua đời
  rationale: Kết cấu μετά với động từ nguyên mẫu có mạo từ diễn tả thời điểm sau một biến cố; dịch thành mệnh đề hữu hạn tự nhiên.
- source_word: μετῴκισεν αὐτὸν
  choice: Đức Chúa Trời đã đưa ông đến
  rationale: μετοικίζω là khiến một người chuyển nơi cư trú. Chủ ngữ không được nêu trực tiếp trong câu Hy Lạp, nhưng ngữ cảnh xác định Đức Chúa Trời là tác nhân; “đưa ... đến” là tiếng Việt tự nhiên.
- source_word: εἰς τὴν γῆν ταύτην εἰς ἣν ὑμεῖς νῦν κατοικεῖτε
  choice: đến xứ này, là nơi hiện nay anh em đang sinh sống
  rationale: Giữ ý chuyển đến một vùng đất và diễn đạt mệnh đề quan hệ bằng tiếng Việt tự nhiên; “anh em” phù hợp với số nhiều ὑμεῖς trong lời trực tiếp trước cử tọa.
theological_decisions:
- issue: Chủ ngữ không được nói rõ của μετῴκισεν
  choice: Nêu rõ “Đức Chúa Trời” trong bản văn và ghi chú rằng tiếng Hy Lạp không nói rõ chủ ngữ.
  alternative: Dịch sát hình thức là “ông ấy đưa ông đến”, nhưng tiếng Việt sẽ mơ hồ và dễ bị hiểu sai là Áp-ra-ham tự đưa chính mình.
  rationale: Mạch văn từ câu 3 cho thấy Đức Chúa Trời là tác nhân, nhưng chú thích vẫn bảo tồn đặc điểm ngữ pháp và mức độ hàm ẩn của nguyên bản.
- issue: Trình tự thời gian liên quan đến cái chết của cha Áp-ra-ham
  choice: 'Dịch đúng trình tự trong Công Vụ: sau khi cha ông qua đời.'
  alternative: Điều chỉnh câu chữ nhằm dung hòa trình tự với Sáng Thế Ký 11:32; 12:4.
  rationale: Không âm thầm giải quyết căng thẳng giữa các bản văn; ghi chú hướng độc giả đến các đoạn liên quan để đối chiếu.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “Canh-đê” và “Ha-ran” theo lối phiên âm Kinh Thánh quen thuộc; tránh từ cổ “cư ngụ”. Dấu chú thích [a] bao quát cả chủ ngữ hàm ẩn và vấn đề trình tự thời gian.
