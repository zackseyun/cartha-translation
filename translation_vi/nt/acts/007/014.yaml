  verdict: approve
  source_fidelity: 'Bản dịch giữ đúng các thành tố chính của tiếng Hy Lạp: tiến trình tự sự (δὲ), hành động sai phái rồi cho mời (ἀποστείλας ... μετεκαλέσατο), Gia-cốp là cha của Giô-sép, toàn thể họ hàng, và tổng số bảy mươi lăm người. Cách nói “sai người mời” diễn đạt tự nhiên ý sai phái ngầm hiểu trong phân từ ἀποστείλας mà không xác định thêm người được sai. Con số “bảy mươi lăm” được giữ nguyên, không điều hòa với các truyền thống Cựu Ước khác.'
  naturalness: Câu văn hiện đại, rõ ràng và có sắc thái trang trọng phù hợp văn mạch diễn từ của Công Vụ. Trật tự “cha mình là Gia-cốp” tự nhiên trong tiếng Việt; “tất cả là bảy mươi lăm người” truyền đạt chính xác thành ngữ đếm người ἐν ψυχαῖς.
  terminology: Tên riêng “Giô-sép” và “Gia-cốp” nhất quán với cách dùng Việt ngữ Kinh Thánh quen thuộc. “Họ hàng” là cách dịch hiện đại, đủ rộng cho συγγένεια. Chú thích được đặt đúng sau “họ hàng” và giải thích trung tính, chính xác sự khác biệt số liệu với bản Hê-bơ-rơ của Sáng Thế 46:27 và Xuất Ai Cập 1:5.
