source:
  edition: SBLGNT
  text: ἀποστείλας δὲ Ἰωσὴφ μετεκαλέσατο ⸂Ἰακὼβ τὸν πατέρα αὐτοῦ⸃ καὶ πᾶσαν τὴν συγγένειαν ἐν ψυχαῖς ἑβδομήκοντα πέντε,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/014.yaml
  text: Then Joseph sent and summoned Jacob his father and all his relatives[a], seventy-five persons in all.
translation:
  language: vi
  text: Bấy giờ, Giô-sép sai người mời cha mình là Gia-cốp cùng toàn thể họ hàng[a], tất cả là bảy mươi lăm người.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Một số phân đoạn Cựu Ước ghi tổng số là “bảy mươi” (chẳng hạn bản Hê-bơ-rơ của Sáng Thế 46:27 và Xuất Ai Cập 1:5); tại đây, Công Vụ ghi “bảy mươi lăm.”
    reason: cross_reference
lexical_decisions:
- source_word: δὲ
  choice: Bấy giờ
  rationale: Đánh dấu bước tiếp theo trong mạch kể chuyện; cách diễn đạt này tự nhiên và trang trọng trong tiếng Việt hiện đại.
- source_word: ἀποστείλας
  choice: sai người
  rationale: Phân từ bất định diễn tả hành động xảy ra trước hoặc gắn liền với động từ chính. Hy Lạp không nêu rõ đối tượng được sai đi; “sai người” diễn đạt tự nhiên phương tiện ngầm hiểu mà không thêm một nhân vật cụ thể.
- source_word: μετεκαλέσατο
  choice: mời
  rationale: Động từ trung cách mang nghĩa cho gọi hoặc sai người mời ai đến. Trong quan hệ giữa Giô-sép với cha và họ hàng, “mời” tự nhiên hơn “triệu tập” nhưng vẫn giữ ý gọi họ đến.
- source_word: Ἰακὼβ τὸν πατέρα αὐτοῦ
  choice: cha mình là Gia-cốp
  rationale: Chuyển cấu trúc đồng vị sang trật tự tự nhiên của tiếng Việt, đồng thời làm rõ Gia-cốp là cha của Giô-sép.
- source_word: πᾶσαν τὴν συγγένειαν
  choice: cùng toàn thể họ hàng
  rationale: συγγένεια chỉ toàn bộ nhóm thân tộc; “họ hàng” rõ nghĩa và hiện đại hơn những từ cổ như “thân tộc” trong văn cảnh này.
- source_word: ἐν ψυχαῖς
  choice: tất cả là ... người
  rationale: Cụm này theo nghĩa đen là “về số người/sinh mạng” và được dùng để đếm người. Bản dịch tránh “linh hồn,” vì hàm ý thần học ấy không phải trọng tâm của thành ngữ ở đây.
- source_word: ἑβδομήκοντα πέντε
  choice: bảy mươi lăm
  rationale: Dịch trực tiếp con số trong bản văn Hy Lạp.
theological_decisions:
- issue: Tổng số người thuộc gia đình Gia-cốp so với các truyền thống văn bản trong Cựu Ước
  choice: bảy mươi lăm người
  alternative: bảy mươi người
  rationale: Bản văn Hy Lạp của Công Vụ ghi rõ “bảy mươi lăm.” Bản dịch giữ nguyên con số này và chú thích sự khác biệt với một số bản văn Cựu Ước, thay vì âm thầm điều hòa chúng.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng các dạng tên quen thuộc “Giô-sép” và “Gia-cốp.” Cấu trúc câu ưu tiên sự tự nhiên mà vẫn giữ trình tự hành động và sự căng thẳng văn bản về con số.
