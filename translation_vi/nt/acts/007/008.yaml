  yaml_path: translation/nt/acts/007/008.yaml
  text: And he gave him the covenant of circumcision. And so he fathered Isaac and circumcised him on the eighth day, and Isaac fathered Jacob, and Jacob the twelve patriarchs.
translation:
  language: vi
  text: Đức Chúa Trời ban cho ông giao ước về phép cắt bì; và như vậy, Áp-ra-ham là cha của Y-sác và làm phép cắt bì cho Y-sác vào ngày thứ tám; Y-sác là cha của Gia-cốp, và Gia-cốp là cha của mười hai tổ phụ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διαθήκην περιτομῆς
  choice: giao ước về phép cắt bì
  rationale: “Giao ước” là thuật ngữ tự nhiên và chính xác trong bối cảnh lịch sử Kinh Thánh. Cụm “về phép cắt bì” giữ quan hệ định nghĩa/đặc trưng của sở hữu cách, chỉ giao ước được đánh dấu bằng phép cắt bì trong Sáng Thế Ký 17.
- source_word: οὕτως
  choice: Sau đó
  rationale: Trong mạch kể chuyện, từ này nối việc ban giao ước với sự ra đời và cắt bì của Y-sác. “Sau đó” diễn đạt tự nhiên lực liên kết theo trình tự mà không hàm ý thêm một quan hệ nhân quả cứng.
- source_word: ἐγέννησεν
  choice: sinh
  rationale: Với chủ thể nam trong gia phả, “sinh” là cách nói tiếng Việt gọn, quen thuộc và có thể chỉ việc sinh ra con/nối dòng; ngữ cảnh xác định quan hệ cha-con.
- source_word: περιέτεμεν
  choice: làm phép cắt bì cho
  rationale: Đây là cách diễn đạt chuẩn, rõ ràng trong tiếng Việt cho hành động cắt bì được thực hiện trên một người khác.
- source_word: τῇ ἡμέρᾳ τῇ ὀγδόῃ
  choice: vào ngày thứ tám
  rationale: Giữ nguyên cách chỉ thời gian của tiếng Hy Lạp, không thêm “sau khi sinh” dù điều đó được ngữ cảnh ngầm hiểu.
- source_word: πατριάρχας
  choice: tổ phụ
  rationale: “Tổ phụ” là thuật ngữ Kinh Thánh đã quen thuộc, trang trọng nhưng dễ hiểu, chỉ các vị đứng đầu nguồn gốc của mười hai chi phái Ít-ra-ên.
- source_word: Ἰσαάκ / Ἰακώβ
  choice: Y-sác / Gia-cốp
  rationale: Dùng dạng tên riêng Kinh Thánh quen thuộc trong tiếng Việt hiện đại.
theological_decisions:
- issue: Tính xác định của giao ước với Áp-ra-ham
  choice: “giao ước về phép cắt bì”
  alternative: “một giao ước về phép cắt bì” hoặc “giao ước được đánh dấu bằng phép cắt bì”
  rationale: Tiếng Hy Lạp không có mạo từ nhưng nói đến giao ước cụ thể đã được nhận diện trong lịch sử, tức sự kiện ở Sáng Thế Ký 17. Tiếng Việt không cần thêm từ “một”; cách dịch này giữ tính xác định theo ngữ cảnh mà không khai triển thần học quá văn bản.
- issue: Chủ thể ngầm của các động từ gia phả
  choice: Nêu rõ “Áp-ra-ham” ở mệnh đề “sinh Y-sác”
  alternative: Giữ đại từ “ông” như tiếng Hy Lạp
  rationale: Trong tiếng Hy Lạp, αὐτῷ và chủ thể của ἐγέννησεν cùng chỉ Áp-ra-ham. Nêu lại tên trong tiếng Việt tránh khả năng người đọc hiểu nhầm chủ thể là Đức Chúa Trời, nhưng không thêm nhân vật hay nội dung mới.
- issue: Quan hệ giữa việc ban giao ước và phần tiếp theo
  choice: Dịch οὕτως là “Sau đó”
  alternative: “Như vậy” hoặc “và thế là”
  rationale: “Sau đó” giữ mạch tường thuật rõ ràng và tránh quyết định rằng việc sinh Y-sác là kết quả trực tiếp của giao ước cắt bì; sức liên kết rộng của οὕτως vẫn được thể hiện.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ đọc. Câu giữ nhịp liệt kê gia phả của nguyên văn; dùng các tên Áp-ra-ham, Y-sác và Gia-cốp theo truyền thống tiếng Việt phổ biến. Không cần chú thích vì không có biến thể hay độ mơ hồ nào buộc phải giải thích ngoài văn bản.
