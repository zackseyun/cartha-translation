  text: ἀλλ’ οὐχ ὁ ὕψιστος ἐν ⸀χειροποιήτοις κατοικεῖ· καθὼς ὁ προφήτης λέγει·
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/048.yaml
  text: 'But the Most High does not dwell in things made by hands[a], just as the prophet says:'
translation:
  language: vi
  text: 'Nhưng Đấng Tối Cao không ngự trong những thứ do tay người làm ra,[a] đúng như nhà tiên tri nói:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “trong những đền thờ do tay người làm ra.” Tiếng Hy Lạp có nghĩa rộng hơn là “trong những thứ do tay người làm ra,” dù đền thờ là điều đang được nói đến trực tiếp trong ngữ cảnh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: Nhưng
  rationale: Diễn tả sự tương phản mạnh với câu trước, nơi Sa-lô-môn xây một ngôi nhà.
- source_word: ὁ ὕψιστος
  choice: Đấng Tối Cao
  rationale: Giữ nguyên sắc thái danh hiệu chỉ về Đức Chúa Trời mà không thêm từ “Đức Chúa Trời”, vốn không có trong tiếng Hy Lạp.
- source_word: ἐν χειροποιήτοις
  choice: trong những thứ do tay người làm ra
  rationale: Giữ nghĩa rộng và dạng số nhiều của χειροποιήτοις, đồng thời vẫn phù hợp với ngữ cảnh trực tiếp nói về đền thờ.
- source_word: κατοικεῖ
  choice: ngự
  rationale: Trong ngữ cảnh nói về sự hiện diện và nơi cư ngụ của Đức Chúa Trời, “ngự” là cách diễn đạt tự nhiên, trang trọng và dễ hiểu.
- source_word: καθὼς
  choice: đúng như
  rationale: Nêu rõ lời tiên tri sắp được trích dẫn xác nhận điều vừa nói.
- source_word: ὁ προφήτης λέγει
  choice: lời nhà tiên tri nói
  rationale: Giữ nguyên việc bản văn chỉ gọi là “nhà tiên tri”, không tự ý thêm tên Ê-sai; cách diễn đạt này tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Có nên giới hạn χειροποιήτοις thành “đền thờ do tay người làm ra” trong chính văn hay không
  choice: 'Giữ cách nói rộng: “những thứ do tay người làm ra”'
  alternative: “những đền thờ do tay người làm ra” hoặc “những nơi thánh do tay người làm ra”
  rationale: Ngữ cảnh trực tiếp là đền thờ, nhưng từ Hy Lạp có nghĩa rộng hơn và gợi đến sự đối lập với mọi vật hay công trình do con người chế tạo. Cách dịch rộng bảo tồn lực tu từ và sự căng thẳng thần học của câu.
- issue: Có nên mở rộng ὁ ὕψιστος thành “Đức Chúa Trời Tối Cao” hay không
  choice: Dịch là “Đấng Tối Cao”
  alternative: “Đức Chúa Trời Tối Cao”
  rationale: Danh hiệu này rõ ràng chỉ về Đức Chúa Trời, nhưng nguyên văn không có θεός; vì vậy không thêm danh từ vào chính văn.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. “Ngự” giữ sắc thái thích hợp khi nói về sự hiện diện của Đức Chúa Trời; cấu trúc câu vẫn mở sang lời trích dẫn ở câu tiếp theo.
