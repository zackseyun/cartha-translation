  source_fidelity: Bản dịch chuyển đạt đúng tương phản của ἀλλά, danh hiệu ὁ ὕψιστος, phủ định hiện tại của κατοικεῖ, phạm vi rộng của ἐν χειροποιήτοις, và công thức dẫn lời tiên tri. “Ngự” là tương đương phù hợp với κατοικεῖ trong ngữ cảnh về sự hiện diện của Đức Chúa Trời. Chú thích nêu đúng rằng cách hiểu “đền thờ” hẹp hơn từ Hy Lạp nhưng phù hợp ngữ cảnh.
  naturalness: Câu nhìn chung tự nhiên, trang trọng và thích hợp cho tiếng Việt hiện đại. Tuy nhiên, “đúng như lời nhà tiên tri nói” khiến “lời” dường như là chủ thể của động từ “nói”. Đặt trực tiếp “nhà tiên tri” làm chủ ngữ sẽ tự nhiên và sát cú pháp Hy Lạp hơn.
