id: ACT.7.37
reference: Acts 7:37
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οὗτός ἐστιν ὁ Μωϋσῆς ὁ ⸀εἴπας τοῖς υἱοῖς Ἰσραήλ· Προφήτην ὑμῖν ἀναστήσει ⸂ὁ θεὸς⸃ ἐκ τῶν ἀδελφῶν ὑμῶν ὡς ἐμέ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/037.yaml
  text: This is the Moses who said to the sons of Israel[a], ‘God will raise up for you a prophet from among your brothers[c][b], like me.’
translation:
  language: vi
  text: 'Đây chính là Môi-se, người đã nói với các con trai Israel[a]: “Đức Chúa Trời sẽ dấy lên cho anh em một nhà tiên tri[b] từ giữa anh em của anh em[c], giống như tôi.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch tự nhiên hơn là “con cái Israel” hoặc “người Israel”; tiếng Hy Lạp dùng từ có nghĩa cụ thể là “các con trai”.
    reason: lexical_alternative
  - marker: b
    text: Trong mạch văn sách Công Vụ, lời hứa này được áp dụng cho Chúa Giê-su; tuy nhiên, tiếng Hy Lạp tại đây nói “một nhà tiên tri”, không dùng mạo từ để viết thành danh hiệu “Đấng Tiên Tri”.
    reason: alternative_reading
  - marker: c
    text: “Anh em của anh em” ở đây chỉ những người cùng dân Israel, tức đồng bào của người nghe; tiếng Hy Lạp dùng danh từ giống đực số nhiều.
    reason: cultural_note
lexical_decisions:
- source_word: οὗτός ἐστιν ὁ Μωϋσῆς
  choice: Đây chính là Môi-se
  rationale: 'Cách diễn đạt này tự nhiên trong tiếng Việt, đồng thời giữ được sức nhấn mạnh và tính nhận diện của cấu trúc Hy Lạp: chính Môi-se này, người đang được nói đến.'
- source_word: ὁ εἴπας
  choice: người đã nói
  rationale: Phân từ aorist có chức năng định ngữ được chuyển thành mệnh đề quan hệ tự nhiên trong tiếng Việt.
- source_word: τοῖς υἱοῖς Ἰσραήλ
  choice: với các con trai Israel
  rationale: Giữ nghĩa từ vựng cụ thể của υἱοί là “các con trai”, đồng thời bảo tồn âm hưởng của cách gọi Israel trong lời trích Cựu Ước; chú thích nêu cách dịch tự nhiên rộng hơn.
- source_word: Προφήτην
  choice: một nhà tiên tri
  rationale: Danh từ không có mạo từ trong câu trích dẫn được dịch theo nghĩa không xác định, không tự ý biến thành danh hiệu “Đấng Tiên Tri”.
- source_word: ἀναστήσει
  choice: sẽ dấy lên
  rationale: “Dấy lên” diễn đạt việc Đức Chúa Trời làm xuất hiện và đưa một nhà tiên tri ra thi hành sứ mạng, đồng thời giữ hình ảnh động từ của nguyên văn.
- source_word: ὁ θεὸς
  choice: Đức Chúa Trời
  rationale: Chủ thể xác định của hành động; đây là cách gọi trang trọng và quen thuộc trong văn phong Kinh Thánh tiếng Việt.
- source_word: ἐκ τῶν ἀδελφῶν ὑμῶν
  choice: từ giữa những người anh em của anh em
  rationale: Giữ cả ý nguồn gốc từ bên trong nhóm của ἐκ và từ thân tộc giống đực số nhiều ἀδελφοί; chú thích làm rõ ở đây chỉ những người Israel đồng bào.
- source_word: ὡς ἐμέ
  choice: giống như tôi
  rationale: Chuyển trực tiếp ý so sánh với Môi-se mà không bổ sung thành phần không có trong câu Hy Lạp.
theological_decisions:
- issue: Ý nghĩa về Đấng Mê-si của lời trích Phục Truyền Luật Lệ Ký 18:15
  choice: Dịch “một nhà tiên tri” bằng chữ thường và không biến cụm từ thành một danh hiệu trong chính văn.
  alternative: “Đấng Tiên Tri” hoặc “nhà tiên tri ấy”
  rationale: Trong mạch sách Công Vụ, lời này có ý nghĩa quy về Chúa Giê-su, nhưng Προφήτην ở đây không có mạo từ. Bản dịch giữ nguyên cách diễn đạt của câu trích dẫn, không áp đặt kết luận thần học vào hình thức ngữ pháp.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc “Đây chính là Môi-se” giữ sức nhấn mạnh của nguyên văn; lời trích dùng cách xưng hô “anh em” tự nhiên trong tiếng Việt. Chính văn ưu tiên độ trong suốt với nguyên ngữ, còn các cách diễn đạt trôi chảy hơn và ý nghĩa văn hóa-thần học được nêu trong chú thích.
