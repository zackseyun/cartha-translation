revisions:
- from: Các ngươi đã mang theo lều của Mô-lóc và ngôi sao của thần Rê-phan[a], tức những hình tượng[c] mà các ngươi đã làm ra để thờ lạy chúng. Vì thế, ta sẽ đày các ngươi sang bên kia Ba-by-lôn.[b]
  to: Các ngươi đã mang theo lều của Mô-lóc và ngôi sao của thần Rê-phan[a], tức những hình tượng[c] mà các ngươi đã làm ra để thờ lạy chúng; và ta sẽ đày các ngươi đến bên kia Ba-by-lôn.[b]
  rationale: Chỉ bỏ “Vì thế,” vì từ này bổ sung một quan hệ hệ quả rõ rệt hơn liên từ καί của bản Hy Lạp. Điều chỉnh nhẹ “sang” thành “đến” giúp cụm chỉ đích đến của động từ “đày” tự nhiên hơn. Các chú thích giữ nguyên nội dung và mỏ neo, chỉ cập nhật cụm trích dẫn ở chú thích b cho khớp văn bản sửa.
