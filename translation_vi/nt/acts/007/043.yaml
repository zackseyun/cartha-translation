id: ACT.7.43
reference: Acts 7:43
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἀνελάβετε τὴν σκηνὴν τοῦ Μολὸχ καὶ τὸ ἄστρον τοῦ ⸀θεοῦ ⸀Ῥαιφάν, τοὺς τύπους οὓς ἐποιήσατε προσκυνεῖν αὐτοῖς. καὶ μετοικιῶ ὑμᾶς ἐπέκεινα Βαβυλῶνος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/043.yaml
  text: And you took up the tent of Moloch and the star of the god Rephan[a], the images that you made to worship them[c][b], and I will deport you beyond Babylon.
translation:
  language: vi
  text: Các ngươi đã mang theo lều của Mô-lóc và ngôi sao của thần Rê-phan[a], tức những hình tượng[c] mà các ngươi đã làm ra để thờ lạy chúng; và ta sẽ đày các ngươi đến bên kia Ba-by-lôn.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Một số bản dịch, theo bản Hê-bơ-rơ của A-mốt 5:26, ghi “thần Rê-phan của các ngươi” thay vì “thần Rê-phan”. Bản Hy Lạp của Công Vụ tại đây ghi “thần Rê-phan”.
    reason: alternative_reading
  - marker: b
    text: Công Vụ tại đây ghi “đến bên kia Ba-by-lôn”. Trong A-mốt 5:27, đoạn được trích dẫn thường được dịch là “sang bên kia Đa-mách”.
    reason: cross_reference
  - marker: c
    text: Cũng có thể dịch là “những hình dạng” hoặc “những vật tượng trưng”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνελάβετε
  choice: đã mang theo
  rationale: Diễn đạt hành động mang/vác các vật thờ cúng lưu động, tự nhiên trong tiếng Việt mà không giải thích quá mức.
- source_word: σκηνὴν
  choice: lều
  rationale: Giữ nghĩa trực tiếp của σκηνή và tránh từ “đền tạm”, vốn dễ khiến người đọc liên tưởng đến nơi thờ phượng Đức Chúa Trời.
- source_word: Μολὸχ
  choice: Mô-lóc
  rationale: Phiên âm tên riêng Hy Lạp theo cách dễ đọc trong tiếng Việt.
- source_word: ἄστρον
  choice: ngôi sao
  rationale: Giữ nghĩa từ vựng trực tiếp; không tự ý chuyển thành “biểu tượng ngôi sao” dù văn cảnh liên quan đến sự thờ thần tượng.
- source_word: τοῦ θεοῦ Ῥαιφάν
  choice: của thần Rê-phan
  rationale: Phản ánh trực tiếp cấu trúc Hy Lạp “của vị thần Rê-phan”; tiếng Việt không cần mạo từ tương ứng.
- source_word: Ῥαιφάν
  choice: Rê-phan
  rationale: Phiên âm tên riêng theo dạng Hy Lạp trong Công Vụ.
- source_word: τύπους
  choice: hình tượng
  rationale: Trong văn cảnh thờ thần tượng, “hình tượng” truyền đạt rõ các hình thể hay vật biểu trưng do con người chế tạo, đồng thời các khả năng “hình dạng” và “vật tượng trưng” được ghi chú.
- source_word: ἐποιήσατε
  choice: các ngươi đã làm ra
  rationale: Giữ lời cáo buộc trực tiếp rằng chính họ đã chế tạo những vật ấy.
- source_word: προσκυνεῖν αὐτοῖς
  choice: để thờ lạy chúng
  rationale: “Thờ lạy” vừa giữ sắc thái cúi lạy vừa diễn đạt rõ hành vi tôn giáo; “chúng” chỉ các đối tượng thờ cúng vừa nêu.
- source_word: μετοικιῶ
  choice: ta sẽ đày
  rationale: Diễn đạt ngắn gọn hành động cưỡng bức đưa đi lưu đày, với Đức Chúa Trời là chủ thể phát ngôn.
- source_word: ἐπέκεινα Βαβυλῶνος
  choice: sang bên kia Ba-by-lôn
  rationale: Giữ nghĩa không gian “bên kia/vượt quá” và theo đúng địa danh Ba-by-lôn trong bản Hy Lạp của Công Vụ.
theological_decisions:
- issue: Đích đến của cuộc lưu đày trong lời trích dẫn của Ê-tiên khác với A-mốt 5:27
  choice: sang bên kia Ba-by-lôn
  alternative: sang bên kia Đa-mách
  rationale: Bản Hy Lạp Công Vụ ghi rõ Ba-by-lôn; bản dịch không hòa giải khác biệt này với A-mốt nhưng nêu sự khác biệt trong chú thích.
- issue: Cách gọi Rê-phan trong Công Vụ khác với nguồn Hê-bơ-rơ của A-mốt 5:26
  choice: thần Rê-phan
  alternative: thần Rê-phan của các ngươi
  rationale: Công Vụ đọc τοῦ θεοῦ Ῥαιφάν, “của thần Rê-phan”; không thêm đại từ sở hữu từ nguồn Hê-bơ-rơ, nhưng bảo tồn dị biệt trong chú thích.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Dùng “các ngươi/ta” để giữ sắc thái lời phán xét trực tiếp trong lời trích dẫn. Cấu trúc được chia thành hai câu để tiếng Việt sáng rõ; “Vì thế” làm hiện rõ quan hệ hậu quả vốn được nối bằng καί trong mạch lời tiên tri.
