  source_fidelity: 'Bản dịch phản ánh đúng các thành tố chính của tiếng Hy Lạp: việc mang lều Mô-lóc, ngôi sao của thần Rê-phan, các hình tượng do họ làm để thờ lạy, và việc bị đày vượt quá Ba-by-lôn. Tuy nhiên, “Vì thế” thêm rõ quan hệ hệ quả không được diễn đạt bởi καί trong câu Hy Lạp; nên giữ liên từ đơn giản để không tăng mức liên kết diễn giải.'
