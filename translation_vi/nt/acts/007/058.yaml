review_pass:
  verdict: revise
  source_fidelity: Cần điều chỉnh “lôi ông ra” vì ἐκβαλόντες chủ yếu là “đuổi/tống ra, đẩy ra ngoài,” diễn tả sự trục xuất cưỡng bức nhưng không nhất thiết là kéo lê. “Đuổi ông ra khỏi thành” phản ánh sát hơn động từ Hy Lạp và vẫn bảo toàn quan hệ trước-sau với hành động ném đá. “Cứ ném đá ông” diễn đạt phù hợp sắc thái chưa hoàn thành của ἐλιθοβόλουν. “Các nhân chứng” đúng nghĩa pháp lý của οἱ μάρτυρες; “áo ngoài,” “dưới chân,” “một thanh niên,” và “tên là Sau-lơ” đều phù hợp ngữ cảnh và từ vựng nguồn.
  naturalness: Bản văn nhìn chung tự nhiên, hiện đại và trang nghiêm. Thay “lôi” bằng “đuổi” khiến câu đầu tự nhiên hơn mà không gợi hành vi kéo bằng tay, vốn không được văn bản xác định. Cụm “để áo ngoài của mình dưới chân” là cách nói rõ ràng và tự nhiên.
  terminology: “Nhân chứng” tránh đúng cách nghĩa hậu kỳ “người tử đạo.” “Áo ngoài” là lựa chọn tốt cho ἱμάτια; chú thích giữ các khả năng rộng hơn là “áo” hay “áo choàng.” Tên “Sau-lơ” nhất quán với cách phiên âm Việt ngữ thông dụng.
  issues:
  - severity: medium
    issue: “lôi ông ra” có sắc thái kéo lê cụ thể hơn nguồn Hy Lạp.
    rationale: ἐκβάλλω có nghĩa cơ bản là đuổi, tống, hoặc đẩy ra; ngữ cảnh xác nhận tính cưỡng bức, nhưng không nói rõ cách thức là lôi/kéo. “Đuổi ông ra” bảo toàn độ khái quát của nguồn.
  revised_text: Sau khi đuổi ông ra khỏi thành, họ cứ ném đá ông. Các nhân chứng để áo ngoài của mình[a] dưới chân một thanh niên tên là Sau-lơ.
