  text: καὶ ἐκβαλόντες ἔξω τῆς πόλεως ἐλιθοβόλουν. καὶ οἱ μάρτυρες ἀπέθεντο τὰ ἱμάτια ⸀αὐτῶν παρὰ τοὺς πόδας νεανίου καλουμένου Σαύλου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/058.yaml
  text: And after they had driven him out of the city[a], they were stoning him. And the witnesses laid their outer garments at the feet of a young man called Saul.
translation:
  language: vi
  text: Sau khi đuổi ông ra khỏi thành, họ cứ ném đá ông. Các nhân chứng để áo ngoài của mình[a] dưới chân một thanh niên tên là Sau-lơ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “áo” hoặc “áo choàng”; từ Hy Lạp chỉ chung trang phục mặc bên ngoài.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκβαλόντες
  choice: sau khi lôi ông ra
  rationale: Phân từ bất định quá khứ diễn tả hành động xảy ra trước động từ chính; “lôi… ra” truyền đạt rõ tính cưỡng ép mà vẫn tự nhiên trong tiếng Việt.
- source_word: ἔξω τῆς πόλεως
  choice: khỏi thành
  rationale: Diễn tả chuyển động từ bên trong ra bên ngoài và kết hợp tự nhiên với “lôi… ra”.
- source_word: ἐλιθοβόλουν
  choice: họ cứ ném đá ông
  rationale: Thể chưa hoàn thành diễn tả hành động đang tiếp diễn; “cứ ném đá” thể hiện rõ tính kéo dài hơn dạng quá khứ đơn.
- source_word: οἱ μάρτυρες
  choice: các nhân chứng
  rationale: Trong bối cảnh xử án, từ này chỉ những người làm chứng, không mang nghĩa phát triển về sau là “người tử đạo”.
- source_word: ἀπέθεντο τὰ ἱμάτια αὐτῶν
  choice: để áo ngoài của mình
  rationale: Động từ và tân ngữ diễn tả việc họ cởi hoặc đặt áo ngoài sang một bên; “để… dưới chân” là cách diễn đạt gọn, tự nhiên trong tiếng Việt, còn chú thích bảo lưu sắc thái từ vựng của ἱμάτια.
- source_word: παρὰ τοὺς πόδας
  choice: dưới chân
  rationale: Cách nói tự nhiên trong tiếng Việt về việc đặt vật ở gần chân ai đó, hàm ý giao cho người ấy trông giữ.
- source_word: νεανίου
  choice: một thanh niên
  rationale: Chỉ một người nam còn trẻ; “thanh niên” trang trọng, hiện đại và phù hợp ngữ cảnh.
- source_word: καλουμένου Σαύλου
  choice: tên là Sau-lơ
  rationale: Truyền đạt tự nhiên ý nghĩa “được gọi là/mang tên” và dùng dạng phiên âm quen thuộc trong tiếng Việt.
theological_decisions:
- issue: Ý nghĩa của μάρτυρες trong bối cảnh hành quyết
  choice: các nhân chứng
  alternative: các vị tử đạo
  rationale: Ngữ cảnh pháp lý nói đến những người làm chứng tham gia vụ ném đá; dịch là “tử đạo” sẽ đưa nghĩa giáo hội phát triển về sau vào câu này.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. “Cứ ném đá” bảo lưu tiến trình kéo dài của động từ Hy Lạp; “lôi… ra khỏi thành” thể hiện hành động cưỡng ép. Dấu chú thích [a] được đặt ngay sau cụm từ mà chú thích giải thích.
