  text: ⸂καὶ κατέβη⸃ Ἰακὼβ εἰς Αἴγυπτον. καὶ ἐτελεύτησεν αὐτὸς καὶ οἱ πατέρες ἡμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/015.yaml
  text: And Jacob went down into Egypt[a], and he died, he and our fathers.
translation:
  language: vi
  text: Gia-cốp xuống Ai Cập. Ông và các tổ phụ chúng ta[a] đều qua đời.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “tổ tiên của chúng ta”. Tiếng Hy Lạp dùng từ nghĩa đen là “các cha của chúng ta”, chỉ các bậc cha ông trong lịch sử Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατέβη (καταβαίνω)
  choice: xuống
  rationale: Giữ sắc thái chỉ hướng “đi xuống” trong nguyên văn và cách nói địa lý quen thuộc về hành trình đến Ai Cập.
- source_word: Ἰακώβ
  choice: Gia-cốp
  rationale: Dùng dạng tên riêng đã quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
- source_word: εἰς Αἴγυπτον
  choice: Ai Cập
  rationale: Trong tiếng Việt, động từ “xuống” kết hợp trực tiếp với địa danh đã diễn đạt tự nhiên ý chuyển động đến/vào nơi ấy, không cần thêm giới từ.
- source_word: ἐτελεύτησεν (τελευτάω)
  choice: qua đời
  rationale: Diễn đạt tự nhiên, trang trọng và rõ nghĩa trong tiếng Việt hiện đại; không làm thay đổi nghĩa căn bản là chết.
- source_word: αὐτός
  choice: ông
  rationale: Đại từ được giữ lại để xác định Gia-cốp là người qua đời trước khi câu nói thêm các tổ phụ.
- source_word: οἱ πατέρες ἡμῶν
  choice: các tổ phụ của chúng ta
  rationale: “Tổ phụ” giữ được sắc thái nam giới và ý nghĩa lịch sử-gia tộc của πατέρες, chỉ các bậc cha ông của Israel, thay vì làm thành một từ chỉ tổ tiên hoàn toàn trung tính.
theological_decisions:
- issue: Cách dịch πατέρες trong lời thuật về lịch sử Israel
  choice: các tổ phụ của chúng ta
  alternative: tổ tiên của chúng ta
  rationale: Bản dịch giữ hình ảnh phụ hệ và sự đồng nhất của Ê-tiên với các bậc tiền nhân của Israel, nhưng chú thích nêu phương án tự nhiên hơn trong tiếng Việt để không che khuất phạm vi nghĩa.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Chia thành hai câu theo dấu câu của SBLGNT; thêm “Rồi” và “cũng vậy” để diễn đạt tự nhiên quan hệ nối tiếp và tránh lặp động từ, trong khi vẫn giữ rõ rằng cả Gia-cốp lẫn các tổ phụ đều qua đời.
