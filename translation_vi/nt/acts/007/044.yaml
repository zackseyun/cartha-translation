id: ACT.7.44
reference: Acts 7:44
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἡ σκηνὴ τοῦ μαρτυρίου ἦν τοῖς πατράσιν ἡμῶν ἐν τῇ ἐρήμῳ, καθὼς διετάξατο ὁ λαλῶν τῷ Μωϋσῇ ποιῆσαι αὐτὴν κατὰ τὸν τύπον ὃν ἑωράκει,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/044.yaml
  text: The tent of testimony was with our fathers in the wilderness[a], just as the one speaking to Moses directed him to make it according to the pattern that he had seen[c][b],
translation:
  language: vi
  text: Lều Chứng Cớ[a] ở với các tổ phụ chúng ta[b] trong hoang mạc, đúng như Đấng phán với Môi-se[c] đã truyền cho ông làm lều ấy theo mẫu mà ông đã thấy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Đền Tạm Chứng Cớ.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “tổ tiên chúng ta.” Tiếng Hy Lạp nói sát là “các cha của chúng ta.”'
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “Đấng đã phán với Môi-se”; hoặc diễn ý là “Đức Chúa Trời/Chúa phán với Môi-se.” Tiếng Hy Lạp không nêu rõ danh tính của Đấng phán.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἡ σκηνὴ τοῦ μαρτυρίου
  choice: Lều Chứng Cớ
  rationale: Dịch sát hình ảnh một nơi thờ phượng có thể di chuyển và giữ nguyên cấu trúc sở hữu “của chứng cớ/chứng ngôn”. “Lều” tự nhiên, minh bạch hơn thuật ngữ truyền thống “đền tạm”; “Chứng Cớ” phù hợp với cách dùng Kinh Thánh về chứng cớ Đức Chúa Trời ban.
- source_word: τοῖς πατράσιν ἡμῶν
  choice: ở cùng các tổ phụ chúng ta
  rationale: “Các tổ phụ chúng ta” giữ sắc thái lịch sử và hình thức giống đực của πατέρες, chỉ những người đi trước trong dân Israel; “ở cùng” chuyển tải tự nhiên cách dùng tặng cách trong câu.
- source_word: ἐν τῇ ἐρήμῳ
  choice: trong hoang mạc
  rationale: “Hoang mạc” là cách diễn đạt hiện đại, trang trọng và phù hợp với bối cảnh địa lý Kinh Thánh.
- source_word: καθὼς διετάξατο
  choice: đúng như ... đã truyền
  rationale: “Đúng như” biểu thị sự tương ứng chính xác; “đã truyền” thể hiện thẩm quyền của chỉ thị mà không thêm nội dung ngoài nguyên văn.
- source_word: ὁ λαλῶν τῷ Μωϋσῇ
  choice: Đấng phán với Môi-se
  rationale: Giữ cách gọi gián tiếp của phân từ danh hóa, không tự ý thêm danh xưng “Đức Chúa Trời” hay “Chúa”. “Phán” phù hợp với văn cảnh lời truyền có thẩm quyền, còn “Đấng” tạo giọng văn tôn kính và tự nhiên.
- source_word: ποιῆσαι αὐτὴν
  choice: làm lều ấy
  rationale: Lặp lại “lều” thay cho đại từ để câu tiếng Việt rõ nghĩa, đồng thời giữ động từ phổ thông “làm” của nguyên văn.
- source_word: κατὰ τὸν τύπον
  choice: theo mẫu
  rationale: “Mẫu” diễn đạt tự nhiên ý về khuôn mẫu hay mô hình đã được cho thấy.
- source_word: ὃν ἑωράκει
  choice: ông đã thấy
  rationale: Thì quá khứ hoàn thành theo ngữ cảnh được thể hiện bằng “đã thấy”, chỉ việc Môi-se thấy mẫu trước khi làm lều.
theological_decisions:
- issue: Danh tính của ὁ λαλῶν τῷ Μωϋσῇ
  choice: Giữ gián tiếp là “Đấng phán với Môi-se”.
  alternative: “Đức Chúa Trời phán với Môi-se” hoặc “Chúa phán với Môi-se”.
  rationale: Nguyên văn không nêu danh tính của Đấng phán bằng một danh xưng cụ thể. Bản dịch vì thế không thêm “Đức Chúa Trời” hay “Chúa”, dù văn cảnh cho phép người đọc hiểu như vậy.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. Câu giữ hình ảnh cụ thể “lều”, dùng “các tổ phụ” để bảo toàn sắc thái lịch sử, và tránh nêu đích danh Đấng phán khi nguyên văn để ngầm hiểu.
