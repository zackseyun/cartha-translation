id: ACT.7.5
reference: Acts 7:5
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ οὐκ ἔδωκεν αὐτῷ κληρονομίαν ἐν αὐτῇ οὐδὲ βῆμα ποδός, καὶ ἐπηγγείλατο δοῦναι αὐτῷ εἰς κατάσχεσιν αὐτὴν καὶ τῷ σπέρματι αὐτοῦ μετ’ αὐτόν, οὐκ ὄντος αὐτῷ τέκνου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/005.yaml
  text: And he gave him no inheritance in it[a], not even a foot's length, but promised to give it to him as a possession, and to his offspring after him[b], though he had no child.
translation:
  language: vi
  text: Ngài không ban cho ông một phần cơ nghiệp nào trong xứ ấy, dù chỉ một tấc đất[a], nhưng hứa ban xứ ấy làm sản nghiệp cho ông và cho dòng dõi ông sau này[b], mặc dù lúc đó ông chưa có con.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn Hy Lạp có nghĩa đen là “không đến một chỗ đặt chân”; đây là một thành ngữ chỉ phần đất nhỏ nhất có thể có.
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “khi ông chưa có con.” Kết cấu Hy Lạp có thể mang nghĩa thời gian, dù ngữ cảnh thiên về sắc thái nhượng bộ: “mặc dù lúc đó ông chưa có con.”'
    reason: alternative_reading
lexical_decisions:
- source_word: κληρονομίαν
  choice: một phần cơ nghiệp
  rationale: Giữ sắc thái pháp lý và giao ước của phần đất được nhận làm gia nghiệp; cách diễn đạt có “một phần” cũng tự nhiên với câu phủ định tiếng Việt.
- source_word: οὐδὲ βῆμα ποδός
  choice: dù chỉ một tấc đất
  rationale: Chuyển thành ngữ chỉ phần đất nhỏ nhất sang một thành ngữ tiếng Việt tự nhiên, đồng thời giữ hình ảnh về diện tích đất.
- source_word: ἐπηγγείλατο
  choice: hứa
  rationale: Diễn đạt trực tiếp và tự nhiên lời cam kết của Đức Chúa Trời.
- source_word: εἰς κατάσχεσιν
  choice: làm sản nghiệp
  rationale: Thể hiện đất ấy sẽ thuộc quyền sở hữu lâu dài của Áp-ra-ham, đồng thời phù hợp ngữ cảnh lời hứa về đất.
- source_word: σπέρματι
  choice: dòng dõi
  rationale: Giữ nghĩa tập thể của danh từ số ít và ngôn ngữ quen thuộc của lời hứa dành cho Áp-ra-ham.
- source_word: μετ’ αὐτόν
  choice: sau này
  rationale: Trong kết cấu “dòng dõi ông sau này”, cụm này diễn đạt tự nhiên sự kế tục sau Áp-ra-ham.
- source_word: οὐκ ὄντος αὐτῷ τέκνου
  choice: mặc dù lúc đó ông chưa có con
  rationale: Giữ sắc thái nhượng bộ nổi bật trong ngữ cảnh, còn “lúc đó” bảo toàn giá trị hoàn cảnh/thời gian của kết cấu phân từ.
- source_word: τέκνου
  choice: con
  rationale: Không thu hẹp nghĩa thành “con trai”; chỉ tình trạng Áp-ra-ham chưa có người con nào.
theological_decisions:
- issue: Sắc thái của việc Áp-ra-ham chưa có con khi nhận lời hứa
  choice: mặc dù lúc đó ông chưa có con
  alternative: khi ông chưa có con
  rationale: Kết cấu sở hữu cách tuyệt đối có thể được hiểu theo thời gian, nhưng mạch lập luận nhấn mạnh sự tương phản giữa lời hứa về dòng dõi và tình trạng chưa có con. Bản dịch giữ cả yếu tố thời gian lẫn sắc thái nhượng bộ mà không giải quyết thêm căng thẳng thần học.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “Ngài” chỉ Đức Chúa Trời theo ngữ cảnh; “ông” chỉ Áp-ra-ham. “Cơ nghiệp”, “sản nghiệp” và “dòng dõi” giữ âm hưởng giao ước nhưng vẫn quen thuộc trong tiếng Việt Kinh Thánh.
