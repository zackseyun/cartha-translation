id: ACT.7.45
reference: Acts 7:45
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἣν καὶ εἰσήγαγον διαδεξάμενοι οἱ πατέρες ἡμῶν μετὰ Ἰησοῦ ἐν τῇ κατασχέσει τῶν ἐθνῶν ὧν ἐξῶσεν ὁ θεὸς ἀπὸ προσώπου τῶν πατέρων ἡμῶν ἕως τῶν ἡμερῶν Δαυίδ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/045.yaml
  text: which our fathers in turn brought in with Joshua at the dispossession of the nations that God drove out from before our fathers[b][a], until the days of David.
translation:
  language: vi
  text: Lều ấy, sau khi tiếp nhận theo sự kế tục, tổ phụ chúng ta cũng đã đem vào cùng với Giô-suê[a], khi họ chiếm lấy đất của các dân tộc[b] mà Đức Chúa Trời đã đuổi khỏi trước mặt tổ phụ chúng ta; lều ấy ở đó cho đến thời Đa-vít.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tên Hy Lạp Ἰησοῦ có thể chỉ Giê-su hoặc Giô-suê. Trong bối cảnh này, tên ấy chỉ Giô-suê, con trai Nun.
    reason: alternative_reading
  - marker: b
    text: 'Cũng có thể hiểu: «vào lúc các dân tộc bị truất khỏi phần đất của mình.» Cụm Hy Lạp ἐν τῇ κατασχέσει τῶν ἐθνῶν cô đọng và có thể nhấn mạnh việc chiếm hữu hoặc việc các dân bị truất hữu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἣν
  choice: Lều ấy
  rationale: Đại từ quan hệ giống cái số ít chỉ ngược về lều chứng ước ở câu trước; nêu lại “lều” giúp câu tiếng Việt đứng độc lập và rõ nghĩa.
- source_word: εἰσήγαγον
  choice: đem vào
  rationale: Diễn đạt nghĩa của εἰσάγω là mang hoặc đưa vào, với lều làm tân ngữ.
- source_word: διαδεξάμενοι
  choice: là những người tiếp nhận nó từ thế hệ trước
  rationale: Giữ cả ý tiếp nhận và kế tục qua các thế hệ, thay vì chỉ diễn đạt mơ hồ là “lần lượt”.
- source_word: οἱ πατέρες ἡμῶν
  choice: tổ phụ chúng ta
  rationale: Giữ sắc thái lịch sử giao ước và sự lặp lại trong bài diễn từ, đồng thời tự nhiên trong văn phong Kinh Thánh tiếng Việt.
- source_word: μετὰ Ἰησοῦ
  choice: cùng với Giô-suê
  rationale: Tên Hy Lạp Ἰησοῦς có thể tương ứng với Giê-su hoặc Giô-suê; bối cảnh vào đất sau thời Môi-se xác định người được nói đến là Giô-suê con Nun.
- source_word: ἐν τῇ κατασχέσει τῶν ἐθνῶν
  choice: khi họ chiếm đất của các dân
  rationale: κατάσχεσις mang nghĩa chiếm hữu hoặc tiếp quản. Cách dịch này hiểu sở hữu cách “các dân” theo nghĩa vùng đất thuộc về họ; đây là cách đọc phù hợp với bối cảnh nhưng cấu trúc Hy Lạp vẫn cô đọng.
- source_word: ὧν ἐξῶσεν ὁ θεὸς
  choice: mà Đức Chúa Trời đã đuổi
  rationale: ἐξωθέω diễn tả việc đẩy hoặc đuổi ra; đại từ quan hệ chỉ về các dân.
- source_word: ἀπὸ προσώπου τῶν πατέρων ἡμῶν
  choice: khỏi trước mặt tổ phụ chúng ta
  rationale: Giữ thành ngữ chịu ảnh hưởng Sê-mít về việc loại khỏi sự hiện diện của họ, nhưng vẫn dễ hiểu trong tiếng Việt.
- source_word: ἕως τῶν ἡμερῶν Δαυίδ
  choice: cho đến thời Đa-vít
  rationale: Diễn đạt tự nhiên mốc thời gian và nối với câu kế tiếp; việc lặp “Lều ấy còn ở đó” làm rõ đối tượng tồn tại đến thời Đa-vít.
theological_decisions:
- issue: Đối tượng của Ἰησοῦ
  choice: Giô-suê
  alternative: Giê-su
  rationale: Dù hình thức tên trong tiếng Hy Lạp giống nhau, bối cảnh lịch sử về việc dân Israel vào đất hứa sau Môi-se chỉ rõ Giô-suê con Nun.
- issue: Sức nghĩa của διαδεξάμενοι
  choice: Tổ phụ tiếp nhận lều từ thế hệ trước rồi đem vào
  alternative: Tổ phụ lần lượt đem lều vào
  rationale: Cách chọn giữ rõ ý tiếp nhận theo sự kế tục giữa các thế hệ, không biến phân từ thành một trạng từ thuần túy.
- issue: Quan hệ trong ἐν τῇ κατασχέσει τῶν ἐθνῶν
  choice: Khi tổ phụ chiếm đất của các dân
  alternative: Khi các dân bị tước quyền chiếm hữu
  rationale: κατάσχεσις thường chỉ việc chiếm hữu hoặc sở hữu; sở hữu cách τῶν ἐθνῶν có thể được hiểu là đất thuộc về các dân. Cách dịch chính phù hợp mạch chinh phục đất, còn khả năng nhấn mạnh việc các dân bị truất hữu được ghi nhận trong chú thích.
- issue: Phạm vi của “cho đến thời Đa-vít”
  choice: Lều tồn tại hoặc ở trong đất cho đến thời Đa-vít
  alternative: Đức Chúa Trời đuổi các dân cho đến thời Đa-vít
  rationale: Vị trí cú pháp có thể gây căng thẳng nhất định, nhưng mạch văn chuyển sang Đa-vít ở câu 46 khiến việc gắn mốc thời gian với lều là hợp lý hơn; câu tiếng Việt làm rõ cách hiểu này.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “tổ phụ” để duy trì sắc thái lịch sử trong bài diễn từ; tránh lối diễn đạt quá cổ. Tách câu cuối để làm rõ mốc “cho đến thời Đa-vít” và giữ mạch đọc tự nhiên.
