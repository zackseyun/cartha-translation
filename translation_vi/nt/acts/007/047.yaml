  text: Σολομῶν δὲ οἰκοδόμησεν αὐτῷ οἶκον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/047.yaml
  text: But Solomon built a house for him[a].
translation:
  language: vi
  text: Nhưng Sa-lô-môn đã xây cho Ngài một ngôi nhà[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “một đền thờ”; tiếng Hy Lạp là “một ngôi nhà”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Σολομῶν
  choice: Sa-lô-môn
  rationale: Dùng dạng tên riêng quen thuộc trong tiếng Việt hiện đại cho Solomon.
- source_word: δὲ
  choice: Nhưng
  rationale: Diễn đạt sắc thái chuyển ý và tương phản nhẹ trong mạch lập luận, đồng thời nối tự nhiên với lời tường thuật trước đó.
- source_word: οἰκοδόμησεν
  choice: đã xây
  rationale: Động từ ở đây chỉ hành động cụ thể là xây dựng một công trình; “đã xây” tự nhiên và trực tiếp trong tiếng Việt.
- source_word: αὐτῷ
  choice: cho Ngài
  rationale: Đại từ tặng cách quy chiếu về Đức Chúa Trời; “xây cho Ngài” thể hiện công trình được dựng nên để dành cho và tôn kính Ngài. Viết hoa “Ngài” giúp làm rõ đối tượng quy chiếu trong tiếng Việt.
- source_word: οἶκον
  choice: một ngôi nhà
  rationale: Giữ nghĩa từ vựng trực tiếp là “nhà”, thay vì diễn giải ngay thành “đền thờ”, qua đó bảo tồn cách nói và sức căng thần học của nguyên văn.
theological_decisions:
- issue: Nên dịch οἶκον là “nhà” hay diễn giải là “đền thờ”
  choice: một ngôi nhà
  alternative: một đền thờ
  rationale: Nguyên văn dùng οἶκος, từ thông thường chỉ “nhà”, chứ không dùng từ chuyên biệt hơn cho đền thờ. Giữ “ngôi nhà” bảo tồn cách diễn đạt của Ê-tiên và sự căng thẳng với lời khẳng định kế tiếp rằng Đấng Chí Cao không ngự trong những nơi do tay người làm nên. “Đền thờ” là cách hiểu đúng theo ngữ cảnh nên được nêu trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Sa-lô-môn” theo dạng tên quen thuộc trong truyền thống Kinh Thánh tiếng Việt; dùng “Ngài” để chỉ Đức Chúa Trời. Cấu trúc ngắn gọn bám sát nguyên văn và giữ dấu chú thích [a] trong chính văn.
