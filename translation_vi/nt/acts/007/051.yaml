id: ACT.7.51
reference: Acts 7:51
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Σκληροτράχηλοι καὶ ἀπερίτμητοι ⸀καρδίαις καὶ τοῖς ὠσίν, ὑμεῖς ἀεὶ τῷ πνεύματι τῷ ἁγίῳ ἀντιπίπτετε, ὡς οἱ πατέρες ὑμῶν καὶ ὑμεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/051.yaml
  text: You stiff-necked people[a], uncircumcised in hearts and ears, you always resist the Holy Spirit; as your fathers did, so do you.
translation:
  language: vi
  text: “Hỡi những kẻ cứng cổ, có lòng và tai không được cắt bì! Các ông luôn chống lại Thánh Linh; tổ phụ[a] các ông thế nào, các ông cũng thế ấy.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc “tổ tiên”. Tiếng Hy Lạp: “các cha của các ông”.'
    reason: Nêu cách dịch trung tính tự nhiên hơn về các thế hệ trước, đồng thời cho biết hình thức giống đực của nguyên văn.
lexical_decisions:
- source_word: Σκληροτράχηλοι
  choice: những người cứng cổ
  rationale: Giữ hình ảnh mạnh và âm hưởng Kinh Thánh của thành ngữ Hy Lạp, thay vì diễn giải phẳng thành “ngoan cố”.
- source_word: ἀπερίτμητοι
  choice: không chịu cắt bì
  rationale: Giữ nguyên ẩn dụ giao ước và lời tố cáo mang âm hưởng các sách tiên tri; “không chịu” cũng diễn đạt tự nhiên tình trạng không được cắt bì trong cấu trúc tiếng Việt.
- source_word: καρδίαις καὶ τοῖς ὠσίν
  choice: nơi lòng và tai
  rationale: Diễn đạt hai danh từ ở cách dữ cách chỉ phương diện/phạm vi, đồng thời giữ cả hình ảnh về nội tâm và khả năng lắng nghe.
- source_word: ἀεὶ
  choice: luôn
  rationale: Diễn đạt trực tiếp một khuôn mẫu chống đối dai dẳng.
- source_word: τῷ πνεύματι τῷ ἁγίῳ
  choice: Thánh Linh
  rationale: Cách dịch trực tiếp, trang trọng và hiện đại; viết hoa vì trong ngữ cảnh Công Vụ, cụm từ xác định này chỉ về Thánh Linh của Đức Chúa Trời như một chủ thể có ngôi vị.
- source_word: ἀντιπίπτετε
  choice: chống lại
  rationale: Thể hiện sự đối kháng chủ động mà không diễn giải quá mức.
- source_word: οἱ πατέρες ὑμῶν
  choice: tổ phụ các ông
  rationale: Giữ sắc thái nam tính và quan hệ thế hệ của từ Hy Lạp πατέρες, đồng thời tự nhiên hơn “các cha của các ông” trong tiếng Việt ở ngữ cảnh nói về các thế hệ trước.
- source_word: ὡς ... καὶ ὑμεῖς
  choice: thế nào, các ông cũng thế ấy
  rationale: Hoàn chỉnh phép so sánh hàm ẩn trong nguyên văn bằng một cấu trúc tiếng Việt tự nhiên mà không thêm nội dung mới.
theological_decisions:
- issue: Tham chiếu của “Thánh Linh”
  choice: Thánh Linh có ngôi vị
  alternative: “linh thánh” như ảnh hưởng hay tâm thế thiêng liêng nói chung
  rationale: Trong Công Vụ, cụm danh từ có mạo từ này thông thường chỉ Thánh Linh như chủ thể thần linh có ngôi vị; cách viết hoa phản ánh ngữ cảnh mà không thêm danh xưng không có trong tiếng Hy Lạp.
- issue: Hình ảnh sỉ trách thuộc giao ước
  choice: Giữ ẩn dụ “không chịu cắt bì nơi lòng và tai”
  alternative: Diễn giải thành “lòng khép kín và tai điếc” hoặc “ngoan cố, không chịu nghe”
  rationale: Lời nói cố ý vọng lại ngôn ngữ giao ước và lời các nhà tiên tri; giữ ẩn dụ bảo toàn mối liên hệ thần học với Kinh Thánh Israel.
- issue: Danh từ chỉ các thế hệ trước có giống đực
  choice: tổ phụ
  alternative: tổ tiên
  rationale: πατέρες mang nghĩa đen là “các cha” và ở đây chỉ các thế hệ cha ông; “tổ phụ” vừa bảo toàn sắc thái ấy vừa trang trọng, tự nhiên trong tiếng Việt.
translation_notes:
  register: Văn phong trang trọng, trực diện và gay gắt phù hợp với lời quở trách công khai của Ê-tiên. Đại từ “các ông” hướng đến hội đồng gồm nam giới trong ngữ cảnh, tránh sắc thái miệt thị của “các ngươi”. Dấu chấm than sau mệnh đề đầu giữ lực tu từ của lời xưng hô và cáo buộc.
