revisions:
- from: “Hỡi những người cứng cổ, không chịu cắt bì nơi lòng và tai! Các ông luôn chống lại Thánh Linh; tổ phụ[a] các ông thế nào, các ông cũng thế ấy.”
  to: “Hỡi những kẻ cứng cổ, có lòng và tai không được cắt bì! Các ông luôn chống lại Thánh Linh; tổ phụ[a] các ông thế nào, các ông cũng thế ấy.”
  rationale: Chỉ thay “những người” bằng “những kẻ” để giữ giọng quở trách trực diện hơn, và thay “không chịu cắt bì nơi lòng và tai” bằng “có lòng và tai không được cắt bì.” Bản sửa bảo toàn ẩn dụ giao ước, phạm vi áp dụng cho cả lòng lẫn tai, và tình trạng do tính từ Hy Lạp biểu đạt, mà không thêm ý từ chối chủ ý.
  reviewer_model: gpt-5.6-terra
