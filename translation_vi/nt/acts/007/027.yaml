    text: 'Cũng có thể dịch: “gạt ông sang một bên.” Động từ Hy Lạp có thể nhấn mạnh hành động đẩy mạnh hoặc thái độ xua đuổi, khước từ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀδικῶν
  choice: đang làm điều bất công với
  rationale: Phân từ hiện tại diễn tả hành động đang tiếp diễn và giữ rõ ý nghĩa bất công của ἀδικέω, không thu hẹp thành một kiểu gây hại cụ thể.
- source_word: πλησίον
  choice: người lân cận
  rationale: Giữ nghĩa trực tiếp là người ở gần hay người đồng loại; trong ngữ cảnh đây là một người Y-sơ-ra-ên đồng bào, nhưng bản dịch không diễn giải quá mức.
- source_word: ἀπώσατο
  choice: xô ông ra
  rationale: Diễn đạt hành động đẩy ra mang tính mạnh bạo hoặc gạt bỏ; đại từ “ông” chỉ Môi-se theo ngữ cảnh.
- source_word: κατέστησεν
  choice: lập
  rationale: Tự nhiên trong cấu trúc tiếng Việt “lập ai làm...” và truyền đạt nghĩa đặt vào một địa vị có thẩm quyền.
- source_word: ἄρχοντα
  choice: người cai trị
  rationale: Phản ánh trực tiếp vai trò có quyền lãnh đạo, cai quản, không hạ nhẹ thành “người lãnh đạo” chung chung.
- source_word: δικαστὴν
  choice: thẩm phán
  rationale: Tương đương trực tiếp với vai trò xét xử và kết hợp tự nhiên với “người cai trị”.
- source_word: ἐφ’ ἡμῶν
  choice: trên chúng tôi
  rationale: Giữ sắc thái thẩm quyền đối với một nhóm trong ἐπί với sở hữu cách, đồng thời bảo toàn giọng thách thức của người nói.
