  source_fidelity: 'Bản dịch truyền đạt đúng mạch câu và các thuật ngữ chính: người làm điều bất công, người lân cận, lập làm người cai trị và thẩm phán. Tuy nhiên, “xô ông ra” không tự nhiên và chưa diễn đạt rõ hành động ἀπώσατο là đẩy/gạt Môi-se ra hoặc xua ông đi; “đẩy ông ra” sát và rõ hơn. “Trên chúng tôi” là bản dịch quá chữ của ἐφ’ ἡμῶν; trong tiếng Việt, “trên chúng tôi” không tự nhiên cho thẩm quyền, nên cần “cai trị chúng tôi và xét xử chúng tôi” hoặc “làm người cai trị và thẩm phán của chúng tôi.”'
  naturalness: Câu hiện tại nhìn chung trang trọng, nhưng “xô ông ra” và “thẩm phán trên chúng tôi” gượng trong tiếng Việt hiện đại. Cấu trúc “làm người cai trị và thẩm phán của chúng tôi” tự nhiên, đồng thời vẫn giữ hai chức năng song hành của nguyên ngữ.
