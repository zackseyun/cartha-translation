  yaml_path: translation/nt/acts/007/027.yaml
  text: But the man who was wronging his neighbor pushed him away[a], saying, ‘Who appointed you ruler and judge over us?’
translation:
  language: vi
  text: 'Nhưng người đang làm điều bất công với người lân cận đã đẩy ông ra[a] và nói: “Ai đã lập ông làm người cai trị và thẩm phán của chúng tôi?”'
