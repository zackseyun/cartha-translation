reference: Acts 7:2
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ δὲ ἔφη· Ἄνδρες ἀδελφοὶ καὶ πατέρες, ἀκούσατε· Ὁ θεὸς τῆς δόξης ὤφθη τῷ πατρὶ ἡμῶν Ἀβραὰμ ὄντι ἐν τῇ Μεσοποταμίᾳ πρὶν ἢ κατοικῆσαι αὐτὸν ἐν Χαρράν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/002.yaml
  text: 'And he said[a], “Brothers and fathers, listen: the God of glory appeared to our father Abraham when he was in Mesopotamia[b], before he lived in Haran.”'
translation:
  language: vi
  text: 'Ông nói: “Thưa anh em và các bậc cha ông[a], xin hãy nghe! Đức Chúa Trời của vinh quang đã hiện ra với tổ phụ chúng ta là Áp-ra-ham khi ông còn ở miền Mê-sô-pô-ta-mi, trước khi ông cư ngụ tại Cha-ran[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát chữ: “Hỡi những người nam, anh em và các cha.” Đây là công thức xưng hô trang trọng và rõ ràng hướng đến nam giới.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “trước khi ông định cư tại Cha-ran.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ ἔφη
  choice: Ông nói
  rationale: δέ chỉ nối tiếp nhẹ trong lời thuật; tiếng Việt không cần dịch máy móc là “và” hay “nhưng”. “Ông nói” tự nhiên và giữ đúng chức năng dẫn lời.
- source_word: Ἄνδρες ἀδελφοὶ καὶ πατέρες
  choice: Thưa anh em và các bậc cha ông
  rationale: Đây là lời xưng hô trang trọng, hướng đến nam giới. “Thưa” thể hiện sắc thái kính trọng; “anh em” và “các bậc cha ông” giữ quan hệ cộng đồng và thứ bậc tuổi tác mà không tách ἄνδρες thành một tiếng gọi gượng gạo.
- source_word: ἀκούσατε
  choice: xin hãy nghe
  rationale: Mệnh lệnh kêu gọi chú ý; thêm “xin” phù hợp với lời thưa trang trọng nhưng không làm yếu lực cầu khiến.
- source_word: Ὁ θεὸς τῆς δόξης
  choice: Đức Chúa Trời vinh hiển
  rationale: Cách nói tự nhiên, trang nghiêm trong tiếng Việt, diễn đạt θεὸς τῆς δόξης mà không buộc cấu trúc sở hữu vốn dễ gượng thành “Đức Chúa Trời của vinh quang”.
- source_word: ὤφθη
  choice: đã hiện ra với
  rationale: Trong ngữ cảnh thần hiện, thể bị động của ὁράω mang nghĩa “hiện ra”; cách dịch này sát nghĩa hơn lối diễn giải “tự bày tỏ”.
- source_word: τῷ πατρὶ ἡμῶν Ἀβραὰμ
  choice: với tổ phụ chúng ta là Áp-ra-ham
  rationale: “Tổ phụ” diễn đạt tự nhiên vị trí Abraham như người cha chung của cộng đồng; “là” làm rõ đồng vị ngữ trong tiếng Việt.
- source_word: ὄντι ἐν τῇ Μεσοποταμίᾳ
  choice: khi ông còn ở miền Mê-sô-pô-ta-mi
  rationale: Phân từ có giá trị hoàn cảnh thời gian. “Khi ông còn ở” rõ ràng và tự nhiên; “miền” phù hợp với tên một vùng địa lý.
- source_word: πρὶν ἢ κατοικῆσαι αὐτὸν ἐν Χαρράν
  choice: trước khi ông cư ngụ tại Cha-ran
  rationale: κατοικέω có thể chỉ sống hoặc định cư. “Cư ngụ” giữ được độ mở ấy, không khẳng định quá mức tính thường trú.
theological_decisions:
- issue: Cách dịch lời xưng hô nam tính và trang trọng
  choice: Thưa anh em và các bậc cha ông
  alternative: Hỡi những người nam, anh em và các bậc cha ông
  rationale: Bản dịch giữ các danh xưng nam tính và quan hệ thế hệ, nhưng không tách ἄνδρες thành một thành phần vụng về; sắc thái trang trọng được thể hiện bằng “Thưa”.
- issue: Cách dịch danh hiệu θεὸς τῆς δόξης
  choice: Đức Chúa Trời vinh hiển
  alternative: Đức Chúa Trời của vinh quang
  rationale: Cách chọn tự nhiên trong tiếng Việt và vẫn giữ ý niệm vinh hiển gắn với Đức Chúa Trời. Phương án cấu trúc sở hữu sát hình thức Hy Lạp hơn nhưng kém tự nhiên và có thể gây hiểu nhầm rằng vinh quang là một thực thể tách biệt.
- issue: Quan hệ cộng đồng trong τῷ πατρὶ ἡμῶν Ἀβραὰμ
  choice: tổ phụ chúng ta là Áp-ra-ham
  alternative: cha chúng ta là Áp-ra-ham
  rationale: “Tổ phụ” thể hiện Abraham là vị tổ tiên chung trong lịch sử giao ước, đồng thời giữ đại từ “chúng ta” qua đó Ê-tiên tự nhận mình thuộc cùng cộng đồng với người nghe.
translation_notes:
  register: 'Văn phong hiện đại, trang nghiêm và dễ nghe trong lời phát biểu công khai. Dùng các dạng tên quen thuộc trong truyền thống Kinh Thánh tiếng Việt: Áp-ra-ham, Mê-sô-pô-ta-mi, Cha-ran. Các dấu chú thích [a], [b] đều được đặt ngay trong chính văn.'
