source:
  edition: SBLGNT
  text: ἄχρι οὗ ἀνέστη βασιλεὺς ἕτερος ⸂ἐπ’ Αἴγυπτον⸃, ὃς οὐκ ᾔδει τὸν Ἰωσήφ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/018.yaml
  text: until another king arose over Egypt[b][a], who did not know Joseph.
translation:
  language: vi
  text: cho đến khi một vua khác lên cai trị Ai Cập[a], là người không biết Giô-sép[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “trỗi dậy trên Ai Cập”; cũng có thể dịch: “lên nắm quyền tại Ai Cập.”'
    reason: lexical_alternative
  - marker: b
    text: “Không biết Giô-sép” cũng có thể hàm ý “không công nhận” hoặc “không coi trọng Giô-sép.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄχρι οὗ
  choice: cho đến khi
  rationale: 'Diễn đạt tự nhiên giới hạn thời gian: tình trạng trước đó kéo dài tới lúc một vua khác xuất hiện.'
- source_word: ἀνέστη
  choice: lên cai trị
  rationale: Động từ có nghĩa đen là “đứng dậy/trỗi dậy”, nhưng trong ngữ cảnh một vị vua xuất hiện và nắm quyền; “lên cai trị” truyền đạt thành ngữ chính trị mà vẫn giữ chú thích về hình ảnh nguyên văn.
- source_word: βασιλεὺς ἕτερος
  choice: một vua khác
  rationale: “Vua” là tương đương trực tiếp của βασιλεύς; “khác” phân biệt vị vua này với vị trước mà không nhấn quá mức sắc thái khác biệt.
- source_word: ἐπ’ Αἴγυπτον
  choice: cai trị Ai Cập
  rationale: ἐπί với đối cách trong cụm này chỉ phạm vi quyền cai trị; cách diễn đạt này tự nhiên hơn “trên Ai Cập” trong tiếng Việt.
- source_word: οὐκ ᾔδει
  choice: không biết
  rationale: Giữ nghĩa trực tiếp và sự mơ hồ của οἶδα; trong ngữ cảnh, cụm này cũng có thể hàm ý không công nhận hoặc không coi trọng.
- source_word: τὸν Ἰωσήφ
  choice: Giô-sép
  rationale: Dùng dạng tên riêng Kinh Thánh quen thuộc trong tiếng Việt.
theological_decisions:
- issue: Sắc thái của việc vua mới “không biết” Giô-sép
  choice: Giữ cách nói “không biết” trong chính văn
  alternative: “không công nhận” hoặc “không coi trọng” Giô-sép
  rationale: Nguyên văn có thể chỉ sự thiếu hiểu biết hoặc hàm ý không thừa nhận địa vị và công lao của Giô-sép; không nên quyết định thay cho văn bản.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. “Lên cai trị Ai Cập” tránh lối dịch cứng “trỗi dậy trên Ai Cập”; “không biết” bảo toàn sự mơ hồ có chủ ý của nguyên văn.
