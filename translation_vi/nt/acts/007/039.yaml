source:
  edition: SBLGNT
  text: ᾧ οὐκ ἠθέλησαν ὑπήκοοι γενέσθαι οἱ πατέρες ἡμῶν, ἀλλὰ ἀπώσαντο καὶ ἐστράφησαν ⸂ἐν ταῖς καρδίαις⸃ αὐτῶν εἰς Αἴγυπτον,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/039.yaml
  text: Our fathers were unwilling to become obedient to him[a], but rejected him and turned back in their hearts to Egypt[b],
translation:
  language: vi
  text: Cha ông chúng ta không chịu vâng lời ông, nhưng gạt bỏ ông[a] và trong lòng, họ quay về Ai Cập[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “đẩy ông sang một bên”. Động từ Hy Lạp có thể gợi theo nghĩa đen là đẩy Môi-se sang một bên.
    reason: lexical_alternative
  - marker: b
    text: Nghĩa là, dù vẫn đang ở trong hoang mạc, trong lòng họ lại khao khát trở về Ai Cập.
    reason: cultural_note
lexical_decisions:
- source_word: ᾧ
  choice: ông
  rationale: Đại từ quan hệ ở cách tặng chỉ về Môi-se trong câu trước; tiếng Việt diễn đạt tự nhiên quan hệ này trong cụm “vâng lời ông”.
- source_word: οὐκ ἠθέλησαν
  choice: không chịu
  rationale: Cụm phủ định với θέλω diễn tả sự không sẵn lòng, mang sắc thái cố ý khước từ; “không chịu” tự nhiên và mạnh hơn “không muốn” trong ngữ cảnh.
- source_word: ὑπήκοοι γενέσθαι
  choice: vâng lời
  rationale: Nghĩa đen là “trở nên vâng phục”. “Vâng lời” truyền đạt rõ ý phục tùng trong tiếng Việt hiện đại mà không làm câu nặng nề.
- source_word: οἱ πατέρες ἡμῶν
  choice: cha ông chúng ta
  rationale: Chỉ các bậc tiền nhân của dân Israel. “Cha ông chúng ta” vừa gần với hình ảnh của nguyên văn vừa tự nhiên trong tiếng Việt.
- source_word: ἀπώσαντο
  choice: gạt bỏ ông
  rationale: Động từ diễn tả việc đẩy sang một bên và khước từ Môi-se. “Gạt bỏ” giữ được cả hình ảnh cụ thể lẫn ý nghĩa quan hệ.
- source_word: ἐστράφησαν
  choice: quay về
  rationale: Trong ngữ cảnh, động từ chỉ sự đổi hướng trở lại phía Ai Cập; “quay về” diễn đạt sự đảo ngược ấy.
- source_word: ἐν ταῖς καρδίαις αὐτῶν
  choice: trong lòng
  rationale: καρδία chỉ nội tâm, gồm ước muốn và ý hướng. “Trong lòng” giữ nguyên thành ngữ Kinh Thánh và tạo sự tương phản với nơi họ đang ở về thể lý.
- source_word: εἰς Αἴγυπτον
  choice: về Ai Cập
  rationale: εἰς diễn tả hướng đến Ai Cập. Đi với “quay”, từ “về” truyền đạt tự nhiên ý muốn trở lại nơi họ đã rời đi.
theological_decisions:
- issue: Bản chất của việc quay về Ai Cập
  choice: “trong lòng quay về Ai Cập” — một sự đổi hướng nội tâm về ước muốn và lòng quyến luyến
  alternative: “hướng lòng về Ai Cập” hoặc “trong lòng trở lại Ai Cập”
  rationale: Cụm “trong lòng” cho thấy sự quay về thuộc nội tâm, trong khi họ vẫn ở ngoài Ai Cập. Bản dịch giữ nguyên sức căng giữa vị trí thể lý và ước muốn bên trong, không giới hạn câu vào một cách giải thích thuần nghĩa bóng.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. “Cha ông chúng ta” duy trì sắc thái diễn từ cộng đồng của Ê-tiên; “không chịu vâng lời” diễn đạt rõ sự cố ý khước từ. Dấu phẩy cuối câu được giữ vì câu 39 tiếp nối sang câu sau.
