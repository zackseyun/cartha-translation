id: ACT.7.19
reference: Acts 7:19
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οὗτος κατασοφισάμενος τὸ γένος ἡμῶν ἐκάκωσεν τοὺς ⸀πατέρας τοῦ ποιεῖν ⸂τὰ βρέφη ἔκθετα⸃ αὐτῶν εἰς τὸ μὴ ζῳογονεῖσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/019.yaml
  text: This man[a], having dealt shrewdly with our people, mistreated our fathers[c][b], causing their infants to be exposed so that they would not be kept alive.
translation:
  language: vi
  text: Vua ấy[a] đã dùng mưu kế xảo quyệt đối xử với dân chúng ta, ngược đãi tổ tiên chúng ta, khiến họ phải bỏ rơi các con sơ sinh của mình[b] để chúng không được giữ cho sống.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “Người này”; tức vị vua vừa được nhắc đến ở câu trước.'
    reason: referent_clarification
  - marker: b
    text: “Bỏ rơi” ở đây chỉ việc phơi bỏ trẻ sơ sinh, tức bỏ các em ở nơi không được chăm sóc để chết.
    reason: cultural_note
lexical_decisions:
- source_word: οὗτος
  choice: Vua ấy
  rationale: Đại từ chỉ định quy chiếu về vị vua vừa được nhắc đến ở câu trước; thêm “vua” giúp tiếng Việt tự nhiên mà vẫn giữ lực chỉ định.
- source_word: κατασοφισάμενος
  choice: đã dùng mưu xảo quyệt đối phó với
  rationale: Diễn đạt hành động dùng sự khôn khéo theo nghĩa tiêu cực, có tính mưu mô, nhằm chống lại dân Israel.
- source_word: τὸ γένος ἡμῶν
  choice: dân tộc chúng ta
  rationale: Trong ngữ cảnh, γένος chỉ cộng đồng dân Israel; “dân tộc” rõ nghĩa và tránh sắc thái sinh học hiện đại của “chủng tộc”.
- source_word: ἐκάκωσεν
  choice: ngược đãi
  rationale: Thể hiện việc gây hại và đối xử tàn tệ, phù hợp với bối cảnh mà không thu hẹp nghĩa chỉ còn áp bức chính trị.
- source_word: τοὺς πατέρας
  choice: tổ tiên chúng ta
  rationale: Trong lời Ê-tiên, cụm từ chỉ các thế hệ người Israel đi trước; tiếng Việt tự nhiên cần nêu quan hệ sở hữu vốn được hiểu từ ngữ cảnh Hy Lạp.
- source_word: τοῦ ποιεῖν τὰ βρέφη ἔκθετα αὐτῶν
  choice: khiến họ phải đem bỏ các con sơ sinh của mình
  rationale: Giữ quan hệ phương tiện hoặc kết quả của động từ nguyên mẫu có mạo từ. “Khiến... phải” truyền đạt sức ép trong bối cảnh mà không khẳng định quá mức rằng động từ Hy Lạp tự nó có nghĩa là cưỡng ép; “đem bỏ” diễn đạt tập tục phơi bỏ trẻ sơ sinh bằng tiếng Việt dễ hiểu.
- source_word: εἰς τὸ μὴ ζῳογονεῖσθαι
  choice: để chúng không được sống
  rationale: Giữ sắc thái mục đích hoặc kết quả và thể bị động của ζῳογονεῖσθαι; cách nói ngắn gọn, tự nhiên, không làm mất ý không cho trẻ được bảo toàn mạng sống.
theological_decisions:
- issue: Chủ thể thực hiện việc đem bỏ trẻ sơ sinh
  choice: khiến họ phải đem bỏ các con sơ sinh của mình
  alternative: khiến các con sơ sinh của họ bị bỏ đi
  rationale: Cú pháp gắn αὐτῶν với “các trẻ sơ sinh” và có thể được hiểu là các tổ phụ bị khiến phải phơi bỏ con mình. Bản dịch giữ cách hiểu cú pháp trực tiếp nhưng không thêm chi tiết ngoài văn bản về phương thức thi hành.
- issue: Quan hệ mục đích hay kết quả trong εἰς τὸ μή
  choice: để chúng không được sống
  alternative: đến nỗi chúng không sống được
  rationale: Cấu trúc có thể mang sắc thái mục đích hoặc kết quả. “Để” phù hợp với chủ ý sát hại trong bối cảnh Xuất Hành nhưng vẫn không giải thích thêm tác nhân thần học hay động cơ ngoài câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “tổ tiên” thay cho lối nói ít tự nhiên “các cha”; dùng “con sơ sinh” để diễn đạt chính xác βρέφη. Các dấu chú thích [a], [b] đều xuất hiện trong chính văn.
