revisions:
- from: Vua ấy[a] đã dùng mưu xảo quyệt đối phó với dân tộc chúng ta và ngược đãi tổ tiên chúng ta, khiến họ phải đem bỏ các con sơ sinh của mình[b], để chúng không được sống.
  to: Vua ấy[a] đã dùng mưu kế xảo quyệt đối xử với dân chúng ta, ngược đãi tổ tiên chúng ta, khiến họ phải bỏ rơi các con sơ sinh của mình[b] để chúng không được giữ cho sống.
  rationale: Chỉnh nhẹ để câu văn tự nhiên hơn và phản ánh rõ hơn sắc thái ‘được giữ cho sống’ của nguyên ngữ. Giữ “khiến họ phải” vì trong cấu trúc câu, việc bắt các tổ tiên làm cho trẻ thành ‘trẻ bị phơi bỏ’ là phương diện của sự ngược đãi; không thêm chi tiết về phương thức thực hiện.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T08:28:54Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch nắm đúng các thành tố chính: vị vua được quy chiếu, sự đối xử đầy mưu mô với dân Israel, việc ngược đãi tổ tiên, việc bỏ trẻ sơ sinh, và mục đích không để các em được sống. Tuy nhiên, “đem bỏ” không nói rõ bằng “bỏ rơi” trong khi chú thích nên nêu cụ thể tập tục phơi bỏ; và “để chúng không được sống” hơi giảm sắc thái bị động ‘không được giữ cho sống’ của ζῳογονεῖσθαι.'
  naturalness: “Dùng mưu xảo quyệt đối phó với” hơi gượng trong tiếng Việt hiện đại. “Dùng mưu kế xảo quyệt đối xử với” tự nhiên hơn và vẫn giữ rõ ý hành động xảo quyệt nhắm vào dân chúng.
  terminology: “Vua ấy,” “dân chúng ta,” “ngược đãi,” và “tổ tiên chúng ta” phù hợp ngữ cảnh và văn phong. “Bỏ rơi” là cách diễn đạt hiện đại, còn chú thích bảo toàn nghĩa lịch sử chuyên biệt của ἔκθετα.
  issues:
  - severity: low
    issue: Cụm “dùng mưu xảo quyệt đối phó với” chưa tự nhiên.
    rationale: “Mưu xảo quyệt” thiếu danh từ trung tâm rõ ràng; thêm “mưu kế” và dùng “đối xử với” tạo câu tiếng Việt mượt hơn mà không đổi nghĩa κατασοφισάμενος.
  - severity: low
    issue: “Đem bỏ” và “không được sống” có thể chưa phản ánh đủ nét nghĩa cụ thể của hai cụm Hy Lạp cuối câu.
    rationale: ἔκθετα chỉ việc bỏ/phơi trẻ sơ sinh; ζῳογονεῖσθαι là được giữ cho sống. Bản sửa dùng cách nói tự nhiên trong chính văn và giải thích rõ việc phơi bỏ trong chú thích.
