  naturalness: Câu văn nhìn chung tự nhiên, trang trọng và phù hợp tiếng Việt hiện đại. “Mọi hoạn nạn” gọn và sát ngữ cảnh hơn “mọi cảnh khốn khổ”. “Gia thất của Pha-ra-ôn” tránh cách nói sở hữu thiếu tự nhiên là “gia đình vua”, đồng thời giữ được sắc thái rộng của οἶκος.
  terminology: “Giải cứu”, “ân huệ”, “sự khôn ngoan”, “trước mặt”, “lập ... làm người cai quản” đều phù hợp. “Ân huệ” được chú thích theo nghĩa sự ưu ái/thiện cảm trong mắt Pha-ra-ôn, nên không buộc một nghĩa thần học chuyên biệt. Giữ “Pha-ra-ôn, vua Ai Cập” là đúng và rõ.
