id: ACT.7.10
reference: Acts 7:10
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἐξείλατο αὐτὸν ἐκ πασῶν τῶν θλίψεων αὐτοῦ, καὶ ἔδωκεν αὐτῷ χάριν καὶ σοφίαν ἐναντίον Φαραὼ βασιλέως Αἰγύπτου, καὶ κατέστησεν αὐτὸν ἡγούμενον ἐπ’ Αἴγυπτον ⸀καὶ ὅλον τὸν οἶκον αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/010.yaml
  text: and rescued him from all his afflictions[a], and gave him favor and wisdom before Pharaoh king of Egypt[c][b], and appointed him ruler over Egypt and over all his household.
translation:
  language: vi
  text: và giải cứu ông khỏi mọi hoạn nạn[a], ban cho ông ân huệ[b] và sự khôn ngoan trước mặt Pha-ra-ôn, vua Ai Cập, rồi lập ông làm người cai quản Ai Cập và toàn bộ gia thất của Pha-ra-ôn[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “khỏi mọi cảnh khốn khổ của ông.”'
    reason: lexical_alternative
  - marker: b
    text: “Ân huệ” ở đây chỉ sự ưu ái hoặc thiện cảm Giô-sép nhận được trước mặt Pha-ra-ôn; cũng có thể dịch là “ơn”.
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “lập ông làm người đứng đầu Ai Cập và toàn bộ gia thất của Pha-ra-ôn.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξείλατο
  choice: giải cứu
  rationale: Động từ ở đây chỉ việc cứu Giô-sép khỏi nguy hiểm và khốn cảnh; “giải cứu” tự nhiên và giữ rõ hành động cứu thoát.
- source_word: θλίψεων
  choice: mọi cảnh khốn khổ
  rationale: θλῖψις bao quát những áp lực, gian truân và đau khổ Giô-sép đã chịu; cách diễn đạt này trang trọng nhưng dễ hiểu.
- source_word: χάριν
  choice: ân huệ
  rationale: Trong ngữ cảnh này, χάρις nói đến sự quý mến hay thiện cảm mà Giô-sép nhận được trước mặt Pha-ra-ôn, chứ không nhất thiết mang nghĩa thần học chuyên biệt.
- source_word: σοφίαν
  choice: sự khôn ngoan
  rationale: Diễn đạt trực tiếp σοφία, bao gồm sự sáng suốt thực tiễn được Pha-ra-ôn nhìn nhận.
- source_word: ἐναντίον
  choice: trước mặt
  rationale: Cụm từ chỉ vị thế trong sự hiện diện và dưới cái nhìn của Pha-ra-ôn; “trước mặt” vừa sát nghĩa vừa tự nhiên.
- source_word: κατέστησεν
  choice: lập
  rationale: καθίστημι ở đây chỉ việc đặt một người vào chức vụ hoặc địa vị có thẩm quyền.
- source_word: ἡγούμενον
  choice: người cai quản
  rationale: Từ này chỉ người thực thi quyền lãnh đạo hoặc quản trị; “người cai quản” phù hợp với phạm vi quyền hành được nêu tiếp theo mà không áp đặt một chức danh hành chính quá cụ thể.
- source_word: ἐπ’ Αἴγυπτον
  choice: cai quản Ai Cập
  rationale: ἐπί với đối cách trong cấu trúc bổ nhiệm diễn tả quyền cai trị trên một lãnh thổ.
- source_word: ὅλον τὸν οἶκον αὐτοῦ
  choice: toàn thể gia đình vua
  rationale: οἶκος tại đây chỉ hoàng gia cùng cơ cấu gia thất của Pha-ra-ôn, không chỉ một tòa nhà; thêm “vua” làm rõ đại từ αὐτοῦ theo ngữ cảnh tiếng Việt.
theological_decisions:
- issue: Chủ thể ngầm của các động từ trong câu
  choice: Không thêm danh từ “Đức Chúa Trời”; duy trì chủ thể ngầm qua chuỗi động từ tiếng Việt.
  alternative: Thêm “Đức Chúa Trời” làm chủ ngữ để câu đứng riêng được rõ hơn.
  rationale: Các động từ số ít tiếp nối Công Vụ 7:9, nơi Đức Chúa Trời là chủ thể theo ngữ cảnh. Không thêm tên gọi vốn không có trong câu Hy Lạp giúp bảo toàn lối diễn đạt và mức độ hàm ẩn của nguyên bản.
- issue: Đối tượng sở hữu trong ὅλον τὸν οἶκον αὐτοῦ
  choice: Hiểu αὐτοῦ là chỉ Pha-ra-ôn và dịch “toàn thể gia đình vua”.
  alternative: Dịch sát hình thức là “toàn thể nhà của ông ấy”.
  rationale: Ngữ cảnh câu chuyện Giô-sép và cấu trúc bổ nhiệm cho thấy phạm vi thứ hai là hoàng gia/gia thất của Pha-ra-ôn; tiếng Việt cần làm rõ sở hữu để tránh bị hiểu nhầm là gia đình của Giô-sép hoặc của Ai Cập.
translation_notes:
  register: Bản dịch dùng tiếng Việt hiện đại, trang trọng và dễ hiểu. “Pha-ra-ôn” theo cách phiên âm Kinh Thánh quen thuộc; “vua Ai Cập” giữ nguyên phần giải thích của nguyên văn. Dấu phẩy và liên từ được sắp xếp để chuỗi hành động tự nhiên trong tiếng Việt, đồng thời không bổ sung chủ ngữ mà bản Hy Lạp chỉ hàm ý.
