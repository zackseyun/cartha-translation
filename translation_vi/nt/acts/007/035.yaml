id: ACT.7.35
reference: Acts 7:35
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Τοῦτον τὸν Μωϋσῆν, ὃν ἠρνήσαντο εἰπόντες· Τίς σε κατέστησεν ἄρχοντα καὶ δικαστήν, τοῦτον ὁ θεὸς ⸀καὶ ἄρχοντα καὶ λυτρωτὴν ⸂ἀπέσταλκεν σὺν⸃ χειρὶ ἀγγέλου τοῦ ὀφθέντος αὐτῷ ἐν τῇ βάτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/035.yaml
  text: This Moses[a], whom they rejected, saying, ‘Who appointed you a ruler and a judge?’—this man God sent as both ruler and redeemer by the hand of the angel who appeared to him in the bush.
translation:
  language: vi
  text: 'Chính Môi-se này, người mà họ đã khước từ, khi nói: “Ai đã lập ông làm người cai trị và quan xét?”—Đức Chúa Trời đã sai chính người ấy làm cả người cai trị lẫn đấng giải cứu[a], nhờ thiên sứ đã hiện ra với ông trong bụi gai.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “đấng cứu chuộc” hoặc “đấng giải phóng.” Từ Hy Lạp này chỉ người đem lại sự giải thoát hay tự do.
    reason: Nêu các khả năng dịch thực sự của λυτρωτής và bảo toàn sắc thái giải thoát/cứu chuộc mà một từ tiếng Việt đơn lẻ khó diễn đạt trọn vẹn.
lexical_decisions:
- source_word: ἠρνήσαντο
  choice: khước từ
  rationale: Trong ngữ cảnh này, động từ diễn tả việc dân chúng không công nhận và bác bỏ thẩm quyền của Môi-se; “khước từ” tự nhiên và mạnh hơn cách hiểu đơn thuần là phủ nhận bằng lời.
- source_word: κατέστησεν
  choice: lập
  rationale: Động từ nói đến việc đặt một người vào địa vị có thẩm quyền. “Lập” vừa gọn, vừa phù hợp với câu hỏi về chức vụ cai trị và xét xử.
- source_word: ἄρχοντα
  choice: người cai trị
  rationale: 'Cách dịch này giữ được ý về người thực thi thẩm quyền và làm nổi bật sự lặp lại đầy dụng ý: người họ không chấp nhận cai trị lại được Đức Chúa Trời sai làm người cai trị.'
- source_word: δικαστήν
  choice: quan xét
  rationale: “Quan xét” diễn đạt trực tiếp vai trò phân xử, đồng thời giữ sắc thái trang trọng, quen thuộc trong văn phong Kinh Thánh tiếng Việt.
- source_word: λυτρωτὴν
  choice: đấng giải cứu
  rationale: Từ này chỉ người đem lại sự giải thoát hoặc tự do. “Đấng giải cứu” rõ nghĩa đối với độc giả hiện đại, còn chú thích giữ lại các sắc thái “cứu chuộc” và “giải phóng.”
- source_word: ἀπέσταλκεν
  choice: đã sai
  rationale: Thì hoàn thành Hy Lạp nói đến một hành động đã được thực hiện và vẫn có ý nghĩa, nhưng “đã sai” là cách kể tự nhiên trong tiếng Việt mà không làm mất trọng tâm.
- source_word: σὺν χειρὶ
  choice: qua tay
  rationale: Cụm từ mang sắc thái thành ngữ Semit, diễn tả phương tiện hoặc sự trung gian. “Qua tay” giữ hình ảnh nguyên ngữ mà vẫn tương đối tự nhiên trong tiếng Việt.
- source_word: ἀγγέλου
  choice: thiên sứ
  rationale: Trong lời thuật lại sự kiện bụi gai, từ này chỉ hữu thể thiên giới đã hiện ra với Môi-se; “thiên sứ” là cách gọi tiêu chuẩn và thích hợp với ngữ cảnh.
- source_word: τοῦ ὀφθέντος αὐτῷ ἐν τῇ βάτῳ
  choice: đã hiện ra với ông trong bụi gai
  rationale: Phân từ tuy có hình thức bị động nhưng mang nghĩa thành ngữ là “hiện ra.” Bản dịch không thêm “cháy” vì chi tiết ấy không được nêu trực tiếp trong câu này.
- source_word: Τοῦτον ... τοῦτον
  choice: Chính Môi-se này ... chính người ấy
  rationale: Lặp lại “chính” để bảo toàn sự nhấn mạnh tu từ của hai đại từ chỉ định, đồng thời tạo câu tiếng Việt tự nhiên.
- source_word: καὶ ἄρχοντα καὶ λυτρωτὴν
  choice: làm cả người cai trị lẫn đấng giải cứu
  rationale: Cấu trúc “cả ... lẫn ...” thể hiện rõ hai vai trò được nhấn mạnh bởi hai liên từ καί.
theological_decisions:
- issue: Cách dịch λυτρωτής khi Môi-se được trình bày như tác nhân do Đức Chúa Trời sai đến trong lịch sử cứu rỗi
  choice: đấng giải cứu
  alternative: đấng cứu chuộc; đấng giải phóng
  rationale: “Đấng giải cứu” bảo toàn ý về một người đem lại sự thoát khỏi áp bức mà không tự động gán toàn bộ nội hàm thần học chuyên biệt của danh xưng “Đấng Cứu Chuộc” cho Môi-se. Chú thích vẫn nêu rõ sắc thái cứu chuộc và giải phóng vốn có của từ Hy Lạp, để không làm phẳng chiều sâu cứu rỗi của câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Trời,” “thiên sứ” và “quan xét” theo lối Kinh Thánh tiếng Việt phổ thông; giữ cấu trúc nhấn mạnh “Chính Môi-se này ... chính người ấy” và thành ngữ “qua tay” để phản ánh sát tu từ của nguyên bản.
