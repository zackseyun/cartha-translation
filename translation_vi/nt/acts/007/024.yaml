  text: καὶ ἰδών τινα ἀδικούμενον ἠμύνατο καὶ ἐποίησεν ἐκδίκησιν τῷ καταπονουμένῳ πατάξας τὸν Αἰγύπτιον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/024.yaml
  text: And when he saw someone being wronged[b][a], he defended him and brought justice for the one being oppressed by striking down the Egyptian.
translation:
  language: vi
  text: Khi thấy một người bị đối xử bất công, ông bênh vực người ấy và đòi lại công lý cho người đang bị áp bức bằng cách đánh người Ai Cập.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “báo thù cho người đang bị áp bức.” Cụm Hy Lạp ἐποίησεν ἐκδίκησιν có thể mang nghĩa báo thù, báo trả hoặc đòi lại công lý.'
    reason: lexical_alternative
  - marker: b
    text: Động từ Hy Lạp có nghĩa cơ bản là “đánh”; trong văn cảnh, cú đánh này đã khiến người Ai Cập chết.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδών
  choice: Khi thấy
  rationale: Phân từ bất định quá khứ được diễn đạt theo quan hệ thời gian, tự nhiên trong tiếng Việt và nêu hoàn cảnh dẫn đến hành động chính.
- source_word: τινα ἀδικούμενον
  choice: một người bị đối xử bất công
  rationale: Giữ tính bất định của τινα và sắc thái chịu sự bất công của ἀδικέω, không bổ sung giới tính dù văn cảnh cho biết đó là một người nam.
- source_word: ἠμύνατο
  choice: ông bênh vực người ấy
  rationale: Diễn đạt hành động can thiệp để bảo vệ nạn nhân; đại từ “ông” phù hợp với Môi-se trong văn cảnh.
- source_word: ἐποίησεν ἐκδίκησιν
  choice: đòi lại công lý
  rationale: Thành ngữ có thể chỉ báo thù, trả thù hoặc thực thi sự minh oan/công lý. Cách dịch này giữ sắc thái hành động nhằm bênh vực nạn nhân mà không mặc nhiên biến câu thành lời tán thành việc tư thù.
- source_word: τῷ καταπονουμένῳ
  choice: cho người đang bị áp bức
  rationale: Thể hiện tình trạng bị hành hạ, áp chế đang diễn ra và giữ sắc thái lợi ích của cách ba.
- source_word: πατάξας τὸν Αἰγύπτιον
  choice: bằng cách đánh người Ai Cập
  rationale: πατάσσω về mặt từ vựng là “đánh”; văn cảnh cho thấy hậu quả gây chết người, nhưng bản văn câu này không dùng trực tiếp động từ “giết”.
theological_decisions:
- issue: Sắc thái của ἐποίησεν ἐκδίκησιν trong hành động của Môi-se
  choice: đòi lại công lý
  alternative: báo thù cho; thực hiện sự báo trả cho
  rationale: Giữ được độ căng giữa công lý/minh oan và báo trả vốn có trong ἐκδίκησις, đồng thời tránh áp đặt rằng câu chuyện đang xác nhận một giáo lý về quyền tư thù.
- issue: Hậu quả của πατάξας
  choice: đánh
  alternative: đánh chết; hạ sát
  rationale: Dịch theo nghĩa trực tiếp của động từ trong câu, còn hậu quả gây chết người được ghi nhận trong chú thích dựa trên văn cảnh Xuất Ê-díp-tô Ký 2.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Câu giữ nhịp kể chuyện tự nhiên; dùng “bị đối xử bất công” và “đang bị áp bức” để phân biệt hai phân từ gần nghĩa trong nguyên văn. Các dấu chú thích đều có mặt trong chính văn.
