  text: μὴ ἀνελεῖν με σὺ θέλεις ὃν τρόπον ἀνεῖλες ⸀ἐχθὲς τὸν Αἰγύπτιον;
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/028.yaml
  text: Do you want to kill me the way you killed the Egyptian yesterday?
translation:
  language: vi
  text: Chẳng lẽ anh muốn giết tôi như đã giết người Ai Cập hôm qua sao?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὴ ... θέλεις
  choice: muốn ... sao?
  rationale: Câu hỏi với μὴ thường chờ đợi câu trả lời phủ định; tiếng Việt diễn đạt tự nhiên bằng câu hỏi kết thúc với “sao?” mà không cần thêm lời giải thích.
- source_word: ἀνελεῖν / ἀνεῖλες
  choice: giết / đã giết
  rationale: Trong ngữ cảnh này, ἀναιρέω mang nghĩa trực tiếp là giết; dạng tương lai nguyên mẫu đi với θέλεις được diễn đạt là “muốn giết”, còn aorist là hành động đã xảy ra.
- source_word: ὃν τρόπον
  choice: như
  rationale: 'Diễn đạt ngắn gọn và tự nhiên ý so sánh về cách thức: “theo cách mà/giống như”.'
- source_word: ἐχθὲς
  choice: hôm qua
  rationale: Tương đương trực tiếp trong tiếng Việt hiện đại.
- source_word: τὸν Αἰγύπτιον
  choice: người Ai Cập
  rationale: Danh từ chỉ một người Ai Cập đã được xác định trong ngữ cảnh trước.
theological_decisions: []
translation_notes:
  register: Lời thoại trực tiếp, tự nhiên và có sắc thái chất vấn. Đại từ “anh—tôi” phù hợp với cuộc đối thoại giữa hai người nam đồng bào nhưng không xác định quan hệ thân sơ; không thêm chú thích vì câu Hy Lạp không có dị bản hay mơ hồ đáng kể cần ghi nhận.
