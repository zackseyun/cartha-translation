  source_fidelity: 'Bản dịch chuyển tải đúng các thành tố của nguyên văn: “được ơn” cho εὗρεν χάριν, “trước mặt Đức Chúa Trời” cho ἐνώπιον τοῦ θεοῦ, “cầu xin tìm” cho ᾐτήσατο εὑρεῖν, và “một nơi ngự cho Đức Chúa Trời của Gia-cốp” cho σκήνωμα τῷ θεῷ Ἰακώβ. Cách dịch không đồng nhất hóa σκήνωμα với đền thờ hoặc đền tạm trong phần chính, nên giữ được độ khái quát của từ Hy Lạp và mạch chuyển sang câu 47.'
  naturalness: Câu văn tự nhiên trong văn phong Kinh Thánh tiếng Việt hiện đại, trang trọng vừa phải. “Được ơn trước mặt” và “nơi ngự” là các cách nói quen thuộc, dễ hiểu trong ngữ cảnh này. Việc mở đầu bằng chữ thường “người” phù hợp vì đây là mệnh đề quan hệ tiếp nối từ câu trước.
  terminology: “Đức Chúa Trời,” “Gia-cốp,” và “nơi ngự” nhất quán với đăng ký Kinh Thánh tiếng Việt. “Nơi ngự” truyền đạt thích hợp một nơi cư ngụ dành cho Đức Chúa Trời mà không áp đặt cách hiểu công trình cụ thể. Chú thích dùng “đền tạm” như một khả năng từ vựng, được neo đúng tại σκήνωμα và không thay đổi nghĩa của bản văn chính.
