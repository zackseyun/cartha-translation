source:
  edition: SBLGNT
  text: ὃς εὗρεν χάριν ἐνώπιον τοῦ θεοῦ καὶ ᾐτήσατο εὑρεῖν σκήνωμα τῷ ⸀θεῷ Ἰακώβ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/046.yaml
  text: who found favor before God and asked to find a dwelling place for the God of Jacob[a].
translation:
  language: vi
  text: người đã được ơn trước mặt Đức Chúa Trời và cầu xin tìm một nơi ngự cho Đức Chúa Trời của Gia-cốp.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “một đền tạm cho Đức Chúa Trời của Gia-cốp.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὗρεν χάριν
  choice: được ơn
  rationale: Thành ngữ này chỉ việc nhận được ân huệ hay sự đoái thương; “được ơn” tự nhiên trong tiếng Việt và giữ sắc thái quan hệ, thay vì biến χάρις thành một khái niệm trừu tượng.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: trước mặt Đức Chúa Trời
  rationale: Cụm từ diễn tả ở trước hoặc trong cái nhìn của Đức Chúa Trời; cách nói này vừa sát nguyên văn vừa quen thuộc trong văn phong Kinh Thánh tiếng Việt.
- source_word: ᾐτήσατο
  choice: cầu xin
  rationale: Động từ ở đây nói đến việc đưa ra một lời thỉnh cầu. “Cầu xin” phù hợp với đối tượng là Đức Chúa Trời mà không làm câu quá trang trọng.
- source_word: εὑρεῖν
  choice: tìm
  rationale: Giữ nghĩa trực tiếp của động từ “tìm”. Dù văn cảnh có thể hàm ý tìm được hay chuẩn bị, bản dịch không tự ý giải nghĩa rộng hơn.
- source_word: σκήνωμα
  choice: một nơi ngự
  rationale: Danh từ có nghĩa rộng là chỗ ở hoặc nơi cư ngụ. “Nơi ngự” tự nhiên khi nói về Đức Chúa Trời và không sớm giới hạn công trình ấy thành đền tạm hay đền thờ.
- source_word: τῷ θεῷ Ἰακώβ
  choice: cho Đức Chúa Trời của Gia-cốp
  rationale: Dữ cách được diễn đạt tự nhiên bằng “cho”, còn sở hữu cách Ἰακώβ được giữ bằng cụm từ quen thuộc “Đức Chúa Trời của Gia-cốp”.
theological_decisions:
- issue: Tính chất của công trình Đa-vít xin tìm cho Đức Chúa Trời
  choice: một nơi ngự cho Đức Chúa Trời của Gia-cốp
  alternative: một đền tạm cho Đức Chúa Trời của Gia-cốp
  rationale: 'σκήνωμα rộng hơn thuật ngữ chuyên biệt chỉ đền thờ. Cách dịch chính giữ sự chuyển tiếp trong lời kể: Đa-vít mong muốn một nơi cho Đức Chúa Trời, rồi Sa-lô-môn xây nhà ở câu kế tiếp, thay vì xác định công trình quá sớm.'
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Đức Chúa Trời” theo cách gọi quen thuộc trong văn mạch Kinh Thánh; giữ cấu trúc câu như một mệnh đề nối tiếp câu trước.
