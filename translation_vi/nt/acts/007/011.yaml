id: ACT.7.11
reference: Acts 7:11
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἦλθεν δὲ λιμὸς ἐφ’ ὅλην τὴν ⸀Αἴγυπτον καὶ Χανάαν καὶ θλῖψις μεγάλη, καὶ οὐχ ηὕρισκον χορτάσματα οἱ πατέρες ἡμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/011.yaml
  text: A famine came over all Egypt and Canaan[a], and great distress, and our fathers could not find food.
translation:
  language: vi
  text: Một nạn đói đã xảy đến khắp Ai Cập và Ca-na-an, cùng với một cảnh khốn khó lớn, và tổ phụ chúng ta không tìm được lương thực.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἦλθεν δὲ
  choice: Bấy giờ, ... xảy ra
  rationale: δὲ đánh dấu bước phát triển trong lời kể, còn ἦλθεν được dùng theo lối diễn đạt sự kiện. “Bấy giờ” nối mạch tự nhiên và “xảy ra” phù hợp với nạn đói, không thêm ý tương phản mạnh.
- source_word: λιμὸς
  choice: một nạn đói
  rationale: Chỉ tình trạng thiếu lương thực trên diện rộng; “nạn đói” là cách diễn đạt rõ ràng và thông dụng.
- source_word: ἐφ’ ὅλην τὴν Αἴγυπτον καὶ Χανάαν
  choice: khắp Ai Cập và Ca-na-an
  rationale: ἐπί với đối cách diễn tả phạm vi lan rộng trên toàn vùng; “khắp” chuyển đạt tự nhiên phạm vi địa lý ấy.
- source_word: θλῖψις μεγάλη
  choice: cảnh khốn cùng lớn
  rationale: Diễn tả tình trạng gian nan, thiếu thốn nghiêm trọng đi kèm nạn đói, không gán nghĩa cánh chung cho θλῖψις.
- source_word: οὐχ ηὕρισκον
  choice: không tìm được
  rationale: Thì chưa hoàn thành diễn tả tình trạng kéo dài; tiếng Việt “không tìm được” truyền đạt tự nhiên sự bất lực thực tế trong thời kỳ khủng hoảng.
- source_word: χορτάσματα
  choice: lương thực
  rationale: Chỉ thức ăn hoặc nguồn cung cấp thức ăn. “Lương thực” hợp với bối cảnh nạn đói và không thu hẹp nghĩa thành một loại ngũ cốc cụ thể.
- source_word: οἱ πατέρες ἡμῶν
  choice: tổ phụ chúng ta
  rationale: Giữ sắc thái nam tính và quy chiếu lịch sử đến các bậc cha ông của Israel; “tổ phụ” trang trọng, tự nhiên trong văn cảnh Kinh Thánh.
theological_decisions:
- issue: Ngôn ngữ chỉ tổ tiên có giới tính
  choice: tổ phụ chúng ta
  alternative: tổ tiên chúng ta
  rationale: Bản Hy Lạp dùng danh từ giống đực πατέρες và trong văn cảnh chỉ các bậc cha ông của Israel. “Tổ phụ” bảo toàn nét nghĩa này mà không áp đặt thêm lập trường giáo phái.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Giữ cấu trúc hai tai họa liên kết—nạn đói và cảnh khốn cùng—đồng thời dùng dấu chấm phẩy để câu rõ ràng. Không đặt chú thích vì bản dịch chính “tổ phụ” đã chuyển đạt trực tiếp πατέρες; dữ liệu tiếng Anh đặt dấu [a] sau “Canaan” nhưng nội dung chú thích lại nói về “our fathers”, nên không sao chép vị trí đánh dấu không tương ứng ấy.
