  source_fidelity: Bản nháp giữ đúng cấu trúc câu hỏi tu từ khẳng định của οὐχί, động từ quá khứ “đã làm nên,” hình ảnh cụ thể “tay Ta,” và phạm vi “tất cả.” Tuy nhiên, “chính tay Ta” thêm sắc thái nhấn mạnh không có trong nguyên ngữ; “tay Ta” chuyển đạt sát và tự nhiên hơn. “Những điều này” phản ánh gần hơn sắc thái chỉ định của ταῦτα trong lời trích dẫn.
