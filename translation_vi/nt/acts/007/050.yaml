  terminology: “Ta” thích hợp trong lời Đức Chúa Trời tự phán theo văn phong Kinh Thánh trang trọng. Giữ “tay Ta” bảo toàn ngôn ngữ nhân hình và liên hệ với Ê-sai 66:2, không diễn giải thành quyền năng hay hành động trực tiếp của Đức Chúa Trời.
