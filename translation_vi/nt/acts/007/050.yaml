  yaml_path: translation/nt/acts/007/050.yaml
  text: Did not my hand make all these things?[a][b]
translation:
  language: vi
  text: Chẳng phải tay Ta đã làm nên tất cả những điều này sao?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc dịch linh hoạt hơn: “Chẳng phải Ta đã làm nên tất cả những điều này sao?”'
    reason: lexical_alternative
  - marker: b
    text: Câu này vọng lại Ê-sai 66:2.
    reason: cross_reference
lexical_decisions:
- source_word: οὐχὶ
  choice: Chẳng phải ... sao?
  rationale: οὐχί mở đầu câu hỏi tu từ mong đợi câu trả lời khẳng định; cấu trúc “Chẳng phải ... sao?” truyền đạt tự nhiên và trang trọng lực tu từ ấy trong tiếng Việt.
- source_word: ἡ χείρ μου
  choice: chính tay Ta
  rationale: χείρ có nghĩa đen là “tay”; thêm “chính” giúp diễn đạt tự nhiên ý tác nhân trực tiếp mà vẫn giữ nguyên hình ảnh nhân hình trong lời trích dẫn Ê-sai 66:2. “Ta” phù hợp với lời Đức Chúa Trời tự phán trong văn cảnh.
- source_word: ἐποίησεν
  choice: đã làm nên
  rationale: ποιέω ở đây chỉ hành động làm ra, đem vào hiện hữu. “Làm nên” phù hợp văn cảnh sáng tạo và tự nhiên hơn “làm” đứng riêng trong câu này.
- source_word: ταῦτα πάντα
  choice: tất cả những điều ấy
  rationale: Cách dịch này giữ cả phạm vi bao quát của πάντα và sắc thái chỉ định của ταῦτα; “điều” đủ rộng để chỉ mọi vật vừa được nhắc đến.
theological_decisions:
- issue: Ngôn ngữ nhân hình nói về Đức Chúa Trời
  choice: Giữ hình ảnh “chính tay Ta” để diễn tả tác động sáng tạo của Đức Chúa Trời
  alternative: Dịch linh hoạt là “Chẳng phải chính Ta đã làm nên tất cả những điều ấy sao?” hoặc diễn giải là “quyền năng Ta”
  rationale: Bản Hy Lạp giữ danh từ cụ thể “tay” trong lời vọng lại Ê-sai 66:2. Giữ hình ảnh này bảo toàn tính liên văn bản và sức tu từ, không biến nó thành một khẳng định thần học trừu tượng.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Cấu trúc câu hỏi tu từ rõ ràng; giữ hình ảnh Kinh Thánh “tay Ta” và dùng “làm nên” để diễn đạt hành động sáng tạo một cách tự nhiên.
