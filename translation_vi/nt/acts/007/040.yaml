  text: εἰπόντες τῷ Ἀαρών· Ποίησον ἡμῖν θεοὺς οἳ προπορεύσονται ἡμῶν· ὁ γὰρ Μωϋσῆς οὗτος, ὃς ἐξήγαγεν ἡμᾶς ἐκ γῆς Αἰγύπτου, οὐκ οἴδαμεν τί ⸀ἐγένετο αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/040.yaml
  text: saying to Aaron[a], ‘Make gods for us who will go before us, for this Moses[b], who led us out from the land of Egypt—we do not know what has happened to him.’
translation:
  language: vi
  text: 'nói với A-rôn: “Hãy làm cho chúng tôi các thần sẽ đi trước chúng tôi. Vì Môi-se này, người đã dẫn chúng tôi ra khỏi đất Ai Cập, chúng tôi không biết ông ấy đã gặp chuyện gì.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰπόντες τῷ Ἀαρών
  choice: nói với A-rôn
  rationale: Phân từ bất định nối với mạch thuật chuyện trước đó; cách dịch này tự nhiên trong tiếng Việt và dẫn trực tiếp vào lời trích.
- source_word: Ποίησον ἡμῖν
  choice: Hãy làm cho chúng tôi
  rationale: Giữ rõ mệnh lệnh và thành phần chỉ người hưởng lợi trong nguyên văn.
- source_word: θεοὺς
  choice: những vị thần
  rationale: Đây là số nhiều của θεός, nghĩa đen là các thần; không đổi thành “tượng thần” hay “thần tượng”, vì như vậy sẽ diễn giải vật được làm thay cho cách gọi trong lời của dân chúng.
- source_word: οἳ προπορεύσονται ἡμῶν
  choice: sẽ đi trước chúng tôi
  rationale: Diễn đạt trực tiếp ý đi ở phía trước, không thêm sắc thái “lãnh đạo” vốn không được nói rõ trong động từ.
- source_word: ὁ γὰρ Μωϋσῆς οὗτος
  choice: Vì còn Môi-se này
  rationale: “Vì” thể hiện γάρ; “còn ... này” nêu Môi-se làm chủ đề và giữ phần nào sắc thái xa cách của đại từ chỉ định mà vẫn tự nhiên trong tiếng Việt.
- source_word: ἐξήγαγεν ἡμᾶς ἐκ γῆς Αἰγύπτου
  choice: đã dẫn chúng tôi ra khỏi đất Ai Cập
  rationale: Giữ động tác dẫn ra và danh từ γῆς (“đất”) hiện diện trong nguyên văn.
- source_word: οὐκ οἴδαμεν τί ἐγένετο αὐτῷ
  choice: chúng tôi không biết ông ấy đã gặp chuyện gì
  rationale: Cách nói tiếng Việt hiện đại, tự nhiên cho cấu trúc hỏi điều gì đã xảy đến với một người, đồng thời giữ nguyên sự không biết của dân chúng.
theological_decisions:
- issue: Cách dịch θεοὺς trong bối cảnh thờ hình tượng
  choice: những vị thần
  alternative: các thần tượng / những tượng thần
  rationale: Nguyên văn thuật lại chính lời yêu cầu của dân chúng bằng θεοὺς chứ không dùng một danh từ riêng có nghĩa là “thần tượng”. Dịch “những vị thần” giữ cách gọi và sự căng thẳng thần học của câu chuyện, không thay lời họ bằng nhãn giải thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng các tên riêng quen thuộc “A-rôn”, “Môi-se”, “Ai Cập”. Đại từ “ông ấy” phù hợp với lời nói trực tiếp của dân chúng và tránh lối diễn đạt cổ.
