- from: 'nói với A-rôn: “Hãy làm cho chúng tôi những vị thần sẽ đi trước chúng tôi. Vì còn Môi-se này, người đã dẫn chúng tôi ra khỏi đất Ai Cập, chúng tôi không biết ông ấy đã gặp chuyện gì.”'
  to: 'nói với A-rôn: “Hãy làm cho chúng tôi các thần sẽ đi trước chúng tôi. Vì Môi-se này, người đã dẫn chúng tôi ra khỏi đất Ai Cập, chúng tôi không biết ông ấy đã gặp chuyện gì.”'
