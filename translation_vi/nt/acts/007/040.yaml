  - severity: low
    issue: “Những vị thần” có sắc thái tôn kính không được nguyên văn đòi hỏi.
    rationale: θεοὺς đơn giản là “các thần/gods” trong lời tự xưng của dân. “Các thần” là cách dùng hiện đại, trực tiếp và ít thêm sắc thái hơn.
