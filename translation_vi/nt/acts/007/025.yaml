source:
  edition: SBLGNT
  text: ἐνόμιζεν δὲ συνιέναι τοὺς ⸀ἀδελφοὺς ὅτι ὁ θεὸς διὰ χειρὸς αὐτοῦ δίδωσιν ⸂σωτηρίαν αὐτοῖς⸃, οἱ δὲ οὐ συνῆκαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/025.yaml
  text: He supposed that his brothers understood that God was giving them deliverance through his hand[b][a], but they did not understand.
translation:
  language: vi
  text: Ông tưởng rằng những anh em đồng bào của mình hiểu rằng Đức Chúa Trời đang qua tay ông ban sự giải cứu cho họ[a], nhưng họ không hiểu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “sự cứu rỗi”. Từ Hy Lạp có thể chỉ sự cứu thoát, giải cứu hoặc cứu rỗi; trong ngữ cảnh này, trọng tâm trực tiếp là việc Đức Chúa Trời giải cứu dân Y-sơ-ra-ên qua Môi-se.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνόμιζεν
  choice: tưởng rằng
  rationale: Diễn đạt tự nhiên một nhận định mà diễn biến sau cho thấy là không đúng; thì chưa hoàn thành đặt nhận định ấy trong bối cảnh câu chuyện.
- source_word: συνιέναι / συνῆκαν
  choice: hiểu / không hiểu
  rationale: Lặp cùng một động từ để giữ rõ sự tương phản và phép lặp của nguyên văn.
- source_word: ἀδελφοὺς
  choice: anh em đồng bào
  rationale: Vừa giữ ngôn ngữ thân tộc giống đực số nhiều, vừa làm rõ ở đây chỉ những người Y-sơ-ra-ên cùng dân tộc với Môi-se.
- source_word: διὰ χειρὸς αὐτοῦ
  choice: dùng tay ông
  rationale: Giữ hình ảnh 'tay' trong tiếng Hy Lạp đồng thời diễn đạt tự nhiên ý Đức Chúa Trời hành động qua Môi-se như tác nhân.
- source_word: δίδωσιν
  choice: đang ... ban
  rationale: Thì hiện tại trong lời gián tiếp mô tả hành động của Đức Chúa Trời mà Môi-se cho rằng đang diễn ra lúc ấy.
- source_word: σωτηρίαν
  choice: sự giải cứu
  rationale: Trong ngữ cảnh Môi-se và dân Y-sơ-ra-ên tại Ai Cập, từ này chủ yếu chỉ việc giải thoát khỏi áp bức, nhưng vẫn mang sắc thái cứu độ rộng hơn.
- source_word: αὐτοῖς
  choice: cho họ
  rationale: Thể hiện rõ những người Y-sơ-ra-ên là đối tượng tiếp nhận sự giải cứu.
theological_decisions:
- issue: Ý nghĩa của σωτηρία trong bối cảnh Môi-se
  choice: sự giải cứu
  alternative: sự cứu rỗi
  rationale: “Sự giải cứu” phù hợp nhất với hành động cứu dân Y-sơ-ra-ên khỏi cảnh áp bức trong ngữ cảnh trực tiếp, mà không phủ nhận chiều kích cứu độ rộng hơn của từ này.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. “Anh em đồng bào” làm rõ quan hệ dân tộc mà vẫn bảo tồn hình ảnh thân tộc của nguyên văn; không thêm từ nối thời gian vì nguyên văn không có từ tương ứng.
