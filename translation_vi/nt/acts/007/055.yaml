id: ACT.7.55
reference: Acts 7:55
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὑπάρχων δὲ πλήρης πνεύματος ἁγίου ἀτενίσας εἰς τὸν οὐρανὸν εἶδεν δόξαν θεοῦ καὶ Ἰησοῦν ἑστῶτα ἐκ δεξιῶν τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/055.yaml
  text: But being full of the Holy Spirit[a], he gazed into heaven and saw the glory of God, and Jesus standing at the right hand of God[b],
translation:
  language: vi
  text: Nhưng ông, đầy dẫy Đức Thánh Linh, chăm chú nhìn lên trời[a], thấy vinh quang của Đức Chúa Trời và Giê-su đang đứng bên phải Đức Chúa Trời[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “nhìn đăm đăm lên trời.”'
    reason: lexical_alternative
  - marker: b
    text: Cụm từ “bên phải Đức Chúa Trời” là một thành ngữ Kinh Thánh chỉ địa vị danh dự và thẩm quyền cao nhất.
    reason: cross_reference
lexical_decisions:
- source_word: ὑπάρχων
  choice: ông, đầy dẫy
  rationale: Phân từ hiện tại diễn tả trạng thái đang tiếp diễn của Ê-tiên khi sự việc xảy ra. Tiếng Việt không cần dịch riêng bằng “đang ở trong trạng thái”; cấu trúc này vừa tự nhiên vừa giữ được ý nghĩa hoàn cảnh.
- source_word: πλήρης πνεύματος ἁγίου
  choice: đầy dẫy Đức Thánh Linh
  rationale: Đây là cách diễn đạt quen thuộc trong văn phong Kinh Thánh tiếng Việt về việc một người được Thánh Linh chi phối và ban năng lực; “Đức Thánh Linh” thể hiện sự quy chiếu đến ngôi vị thần linh chứ không phải một phẩm chất trừu tượng.
- source_word: ἀτενίσας
  choice: chăm chú nhìn
  rationale: Phân từ aorist diễn tả cái nhìn tập trung, mãnh liệt. “Chăm chú nhìn” rõ nghĩa và tự nhiên hơn những cách nói quá cổ hoặc quá văn chương.
- source_word: εἰς τὸν οὐρανόν
  choice: lên trời
  rationale: Trong bối cảnh khải tượng, οὐρανός chỉ cõi trời chứ không chỉ bầu trời hữu hình. “Nhìn lên trời” là cách nói tự nhiên trong tiếng Việt và không làm mất chiều kích siêu nhiên.
- source_word: εἶδεν
  choice: thấy
  rationale: Dịch trực tiếp động từ chính bằng từ thông dụng, sáng rõ trong tiếng Việt hiện đại.
- source_word: δόξαν θεοῦ
  choice: vinh quang của Đức Chúa Trời
  rationale: Giữ nguyên danh ngữ chỉ sự hiển hiện uy nghi của Đức Chúa Trời, không diễn giải thêm bản chất của khải tượng.
- source_word: Ἰησοῦν
  choice: Giê-su
  rationale: Dùng dạng phiên âm hiện đại, phổ biến và dễ đọc của tên riêng Ἰησοῦς, không thêm tước hiệu không có trong câu Hy Lạp.
- source_word: ἑστῶτα
  choice: đang đứng
  rationale: Phân từ hoàn thành mô tả Giê-su trong tư thế đứng tại thời điểm Ê-tiên nhìn thấy. “Đang đứng” giữ hình ảnh sống động và tự nhiên trong tiếng Việt.
- source_word: ἐκ δεξιῶν τοῦ θεοῦ
  choice: bên phải Đức Chúa Trời
  rationale: ἐκ δεξιῶν là thành ngữ chỉ vị trí bên phải. Cách dịch này giữ nguyên hình ảnh Kinh Thánh về danh dự và thẩm quyền mà không chuyển thành một lời giải nghĩa ngay trong câu.
- source_word: δέ
  choice: Nhưng
  rationale: δέ tạo sự tương phản nhẹ giữa Ê-tiên và đám đông thù nghịch trong văn cảnh trước đó; “Nhưng” làm rõ mối tương phản ấy.
theological_decisions:
- issue: Cách hiểu πνεύματος ἁγίου như sự quy chiếu đến ngôi vị thần linh
  choice: Đức Thánh Linh
  alternative: thánh linh
  rationale: Cách dùng trong Lu-ca–Công Vụ và văn cảnh trực tiếp cho thấy cụm từ nói đến Thánh Linh của Đức Chúa Trời, không chỉ một tâm tính thánh thiện hay sức mạnh phi ngôi vị.
- issue: Khải tượng về Giê-su ở bên phải Đức Chúa Trời
  choice: Giê-su đang đứng bên phải Đức Chúa Trời
  alternative: Giê-su đứng từ phía bên phải Đức Chúa Trời
  rationale: Cách dịch giữ sự phân biệt giữa Đức Chúa Trời và Giê-su trong câu, đồng thời bảo tồn nguyên vẹn hình ảnh tôn cao. Không diễn giải tư thế “đứng” theo một ý nghĩa thần học cụ thể mà bản văn không nói rõ.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, câu gọn và dễ hiểu. Dùng “Đức Chúa Trời” và “Đức Thánh Linh” theo lối gọi quen thuộc trong Kinh Thánh tiếng Việt; tên “Giê-su” được phiên âm theo chính tả hiện đại. Dấu phẩy giúp người đọc nhận ra cụm phân từ chỉ hoàn cảnh trước hành động chính.
