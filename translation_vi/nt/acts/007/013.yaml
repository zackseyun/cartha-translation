  text: καὶ ἐν τῷ δευτέρῳ ⸀ἀνεγνωρίσθη Ἰωσὴφ τοῖς ἀδελφοῖς αὐτοῦ, καὶ φανερὸν ἐγένετο τῷ Φαραὼ τὸ ⸀γένος Ἰωσήφ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/013.yaml
  text: And on the second visit Joseph was recognized by his brothers[b][a], and Joseph’s family became known to Pharaoh.
translation:
  language: vi
  text: Vào lần thứ hai, Giô-sép được các anh em mình nhận ra[a], và gia tộc của Giô-sép được Pha-ra-ôn biết đến[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Giô-sép tỏ mình cho các anh em.” Động từ Hy Lạp ở thể bị động, theo sát mặt chữ là “được nhận ra” hoặc “được biết đến”; trong bối cảnh, Giô-sép đã tiết lộ danh tính của mình cho họ.'
    reason: lexical_alternative
  - marker: b
    text: Hay “họ hàng” hoặc “dòng dõi của Giô-sép.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῷ δευτέρῳ
  choice: Đến lần thứ hai
  rationale: Cụm tính từ có mạo từ chỉ lần hoặc dịp thứ hai. Cách dịch này tự nhiên trong tiếng Việt và không cần thêm danh từ “chuyến đi” vốn không có trực tiếp trong tiếng Hy Lạp.
- source_word: ἀνεγνωρίσθη
  choice: được các anh em mình nhận ra
  rationale: Giữ hình thái bị động của động từ Hy Lạp và sự mơ hồ giữa việc được nhận ra với việc bày tỏ danh tính, trong khi bối cảnh Sáng Thế Ký cho thấy Giô-sép đã tỏ mình cho các anh em.
- source_word: ἀδελφοῖς αὐτοῦ
  choice: các anh em mình
  rationale: Chỉ những người anh em nam của Giô-sép trong câu chuyện; “mình” liên kết tự nhiên với chủ ngữ Giô-sép.
- source_word: φανερὸν ἐγένετο
  choice: được ... biết đến
  rationale: Diễn đạt tự nhiên ý trở nên rõ hoặc được biết đến đối với một người.
- source_word: γένος Ἰωσήφ
  choice: gia tộc của Giô-sép
  rationale: γένος ở đây nói đến nhóm thân tộc hoặc dòng họ của Giô-sép. “Gia tộc” chính xác hơn “gia đình” nếu từ này bị hiểu quá hẹp là hộ gia đình trực hệ.
- source_word: τῷ Φαραώ
  choice: được Pha-ra-ôn biết đến
  rationale: Chuyển quan hệ tặng cách thành cấu trúc tiếng Việt tự nhiên, trong đó Pha-ra-ôn là người biết đến gia tộc Giô-sép.
theological_decisions: []
