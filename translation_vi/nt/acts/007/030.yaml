id: ACT.7.30
reference: Acts 7:30
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ πληρωθέντων ἐτῶν τεσσεράκοντα ὤφθη αὐτῷ ἐν τῇ ἐρήμῳ τοῦ ὄρους Σινᾶ ⸀ἄγγελος ἐν φλογὶ πυρὸς βάτου·
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/030.yaml
  text: And after forty years had passed[a], an angel appeared to him in the wilderness of Mount Sinai[c][b], in a flame of fire from a bush.
translation:
  language: vi
  text: Sau khi bốn mươi năm đã trôi qua[a], một thiên sứ[c] hiện ra với ông trong hoang mạc ở núi Si-na, trong ngọn lửa bốc lên từ một bụi cây[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “khi bốn mươi năm đã mãn.”'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn có cấu trúc cô đọng, sát chữ là: “trong một ngọn lửa của lửa, của một bụi cây”; tức là ngọn lửa gắn với một bụi cây. Hình ảnh này gợi lại Xuất Ai Cập 3:2.'
    reason: cross_reference
  - marker: c
    text: Một số người liên hệ nhân vật này với “thiên sứ của Đức Giê-hô-va” trong Xuất Ai Cập 3:2, nhưng tại đây sách Công Vụ chỉ nói “một thiên sứ.”
    reason: alternative_reading
lexical_decisions:
- source_word: πληρωθέντων ἐτῶν τεσσεράκοντα
  choice: sau khi bốn mươi năm đã trôi qua
  rationale: Kết cấu sở hữu cách tuyệt đối diễn tả thời gian. Cách dịch này tự nhiên trong tiếng Việt và truyền đạt ý khoảng thời gian bốn mươi năm đã hoàn tất; cách sát chữ hơn được giữ trong chú thích.
- source_word: ὤφθη αὐτῷ
  choice: hiện ra với ông
  rationale: Dạng thụ động của ὁράω thường được dùng theo nghĩa nội động trong trình thuật về sự hiện ra; “hiện ra với ông” tự nhiên hơn “được ông nhìn thấy” và αὐτῷ chỉ Môi-se theo văn cảnh.
- source_word: ἐν τῇ ἐρήμῳ τοῦ ὄρους Σινᾶ
  choice: trong hoang mạc gần núi Si-na
  rationale: ἔρημος là vùng hoang vắng. Sở hữu cách τοῦ ὄρους Σινᾶ ở đây xác định khu vực hoang mạc gắn với núi Si-na; “gần núi” diễn đạt quan hệ địa lý tự nhiên mà không ngụ ý hoang mạc thuộc quyền sở hữu của núi.
- source_word: ἄγγελος
  choice: một thiên sứ
  rationale: Trong bối cảnh thần hiện này, từ ngữ chỉ một sứ giả thuộc thiên giới. Mạo từ bất định không có trong tiếng Việt, nhưng “một” phản ánh việc tiếng Hy Lạp không xác định nhân vật là “thiên sứ của Chúa” tại câu này.
- source_word: ἐν φλογὶ πυρὸς βάτου
  choice: giữa ngọn lửa từ một bụi cây
  rationale: Cụm Hy Lạp cô đọng, sát chữ là “trong ngọn lửa của lửa của một bụi cây.” Bản dịch truyền đạt rằng sự hiện ra xảy ra trong ngọn lửa gắn với bụi cây, phù hợp bối cảnh Xuất Ai Cập 3:2 mà không làm câu tiếng Việt nặng nề.
theological_decisions:
- issue: Danh tính của nhân vật hiện ra trong bối cảnh thần hiện
  choice: một thiên sứ
  alternative: thiên sứ của Chúa
  rationale: Công Vụ 7:30 chỉ có ἄγγελος, không có cụm “của Chúa.” Vì vậy, bản văn chính không nhập cách gọi đầy đủ hơn từ Xuất Ai Cập 3:2 hay quyết định bản chất thần học của nhân vật.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “hoang mạc” theo văn phong Kinh Thánh quen thuộc; phiên âm địa danh là “Si-na.” Các chú thích giữ lại sắc thái sát chữ và sự dè dặt thần học của nguyên văn.
