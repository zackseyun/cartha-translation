revisions:
- from: Sau khi bốn mươi năm đã trôi qua[a], một thiên sứ hiện ra với ông trong hoang mạc gần núi Si-na, giữa ngọn lửa từ một bụi cây[b].[c]
  to: Sau khi bốn mươi năm đã trôi qua[a], một thiên sứ[c] hiện ra với ông trong hoang mạc ở núi Si-na, trong ngọn lửa bốc lên từ một bụi cây[b].
  rationale: Bản sửa giữ nguyên ý nghĩa và sắc thái không xác định về nhân vật thiên giới, nhưng chỉnh quan hệ địa lý theo nguyên văn, dùng giới từ tự nhiên và sát nghĩa hơn cho sự hiện ra trong ngọn lửa, đồng thời đặt lại neo chú thích [c] đúng từ mà chú thích giải thích. Chú thích [b] được làm rõ để không bỏ mất πυρός mà vẫn tránh lối dịch quá gượng trong bản văn chính.
