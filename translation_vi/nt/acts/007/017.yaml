source:
  edition: SBLGNT
  text: Καθὼς δὲ ἤγγιζεν ὁ χρόνος τῆς ἐπαγγελίας ἧς ⸀ὡμολόγησεν ὁ θεὸς τῷ Ἀβραάμ, ηὔξησεν ὁ λαὸς καὶ ἐπληθύνθη ἐν Αἰγύπτῳ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/017.yaml
  text: But as the time of the promise that God had made to Abraham was drawing near[a], the people increased and multiplied in Egypt,
translation:
  language: vi
  text: Nhưng khi thời gian của lời hứa mà Đức Chúa Trời đã hứa[a] với Áp-ra-ham đang đến gần, dân chúng tăng lên và sinh sôi nảy nở ở Ai Cập.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đã cam kết” hoặc “đã tuyên hứa.” Động từ Hy Lạp ở đây có thể chỉ một cam kết được tuyên bố; “đã hứa” phù hợp với cách diễn đạt tự nhiên trong cụm “lời hứa mà ... đã hứa.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καθὼς δὲ
  choice: Nhưng khi
  rationale: Καθώς mở đầu một mệnh đề thời gian, còn δέ đánh dấu sự chuyển ý nhẹ. “Nhưng khi” diễn đạt tự nhiên mạch chuyển tiếp trong ngữ cảnh.
- source_word: ἤγγιζεν ὁ χρόνος
  choice: thời điểm ... đến gần
  rationale: Thì vị hoàn của ἤγγιζεν diễn tả tiến trình đang đến gần. “Thời điểm” chỉ thời gian liên quan đến việc thực hiện lời hứa mà không hàm ý rõ hơn nguyên văn rằng đó là một thời điểm đã được ấn định.
- source_word: τῆς ἐπαγγελίας
  choice: lời hứa
  rationale: ἐπαγγελία ở đây trực tiếp chỉ lời hứa của Đức Chúa Trời.
- source_word: ἧς ὡμολόγησεν ὁ θεὸς τῷ Ἀβραάμ
  choice: mà Đức Chúa Trời đã cam kết với Áp-ra-ham
  rationale: Trong cấu trúc này, ὁμολογέω nói đến một cam kết được tuyên bố. “Cam kết” giữ được sắc thái ấy, tránh lặp “lời hứa mà ... đã hứa” và không thêm sắc thái thề nguyền vốn không được động từ này nêu rõ.
- source_word: ηὔξησεν ὁ λαὸς
  choice: dân ấy gia tăng
  rationale: λαός chỉ cộng đồng dân Y-sơ-ra-ên đang được nhắc đến; “dân ấy” giữ liên hệ ngữ cảnh. “Gia tăng” bảo toàn sự phân biệt với động từ tiếp theo.
- source_word: καὶ ἐπληθύνθη
  choice: và sinh sôi nảy nở
  rationale: Cụm tiếng Việt tự nhiên diễn tả sự gia tăng đông đảo của một dân tộc và phản ánh sắc thái nhân lên của πληθύνω.
- source_word: ἐν Αἰγύπτῳ
  choice: tại Ai Cập
  rationale: Cụm chỉ địa điểm đơn giản; “tại” phù hợp với văn phong trang trọng, hiện đại.
theological_decisions:
- issue: Cách dịch ὡμολόγησεν liên quan đến lời hứa của Đức Chúa Trời cho Áp-ra-ham
  choice: đã cam kết
  alternative: đã hứa; đã tuyên hứa; đã thề
  rationale: “Đã cam kết” truyền đạt một cam kết được công bố trong ngữ cảnh lời hứa, nhưng không nâng nghĩa thành lời thề. Cách dịch này giữ trọng tâm ở lời hứa của Đức Chúa Trời mà không thêm một khẳng định thần học riêng về sự thề nguyền.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Trời,” “Áp-ra-ham,” “Ai Cập” theo lối gọi tên quen thuộc trong Kinh Thánh tiếng Việt; giữ nhịp câu kể lịch sử và sự song hành giữa hai động từ chỉ sự tăng trưởng.
