  terminology: “Con bê,” “tế lễ,” và “thần tượng” đều phù hợp. “Thần tượng” giữ được sắc thái phê phán của εἴδωλον tốt hơn cách nói trung tính như “hình ảnh.” Các chú thích được đặt đúng sau đơn vị từ ngữ liên quan và không làm thay đổi nghĩa chính văn.
