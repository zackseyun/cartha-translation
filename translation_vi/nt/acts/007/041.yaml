  source_fidelity: 'Bản dịch truyền đạt đầy đủ các thành tố của câu Hy Lạp: mốc thời gian, việc làm con bê, dâng tế lễ cho thần tượng, và niềm vui gắn với sản phẩm do tay họ làm ra. “Thần tượng đó” diễn đạt tự nhiên mạo từ xác định trong τῷ εἰδώλῳ và liên kết đúng với con bê vừa nói đến. “Hân hoan” biểu đạt phù hợp εὐφραίνοντο; tiếng Việt không cần đánh dấu riêng thì vị hoàn trong trường hợp này.'
