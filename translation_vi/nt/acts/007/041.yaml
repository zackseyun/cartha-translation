id: ACT.7.41
reference: Acts 7:41
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἐμοσχοποίησαν ἐν ταῖς ἡμέραις ἐκείναις καὶ ἀνήγαγον θυσίαν τῷ εἰδώλῳ, καὶ εὐφραίνοντο ἐν τοῖς ἔργοις τῶν χειρῶν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/041.yaml
  text: And in those days they made a calf and offered a sacrifice to the idol[b][a], and they were rejoicing in the works of their hands.
translation:
  language: vi
  text: Trong những ngày ấy, họ làm một con bê[a], dâng tế lễ cho thần tượng đó, rồi hân hoan về những gì chính tay mình làm ra.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “tạo hình một con bê.”'
    reason: lexical_alternative
  - marker: b
    text: 'Dịch sát: “hân hoan về những công việc của tay mình.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμοσχοποίησαν
  choice: họ làm một con bê
  rationale: Động từ có nghĩa là làm hoặc tạo hình một con bê. Cách dịch này ngắn gọn, tự nhiên; danh từ “thần tượng” ngay sau đó cho thấy rõ con bê là vật thờ lạy.
- source_word: ἐν ταῖς ἡμέραις ἐκείναις
  choice: trong những ngày ấy
  rationale: Giữ sát thành ngữ chỉ thời gian của tiếng Hy Lạp và phù hợp với văn phong Kinh Thánh tiếng Việt hiện đại.
- source_word: ἀνήγαγον θυσίαν
  choice: dâng tế lễ
  rationale: Trong ngữ cảnh thờ phượng, cụm từ chỉ hành động dâng một lễ hiến tế; “dâng tế lễ” vừa rõ nghĩa vừa trang trọng.
- source_word: τῷ εἰδώλῳ
  choice: cho thần tượng đó
  rationale: Mạo từ xác định hướng về con bê vừa được nhắc đến. “Thần tượng” giữ nguyên sắc thái phê phán việc thờ hình tượng của εἴδωλον.
- source_word: εὐφραίνοντο
  choice: hân hoan
  rationale: Diễn đạt niềm vui hoặc sự ăn mừng; trong mạch câu, từ này tự nhiên hơn lối dịch nặng về hình thái, dù thì vị hoàn của tiếng Hy Lạp vẫn gợi hoạt động đang diễn ra.
- source_word: ἐν τοῖς ἔργοις τῶν χειρῶν αὐτῶν
  choice: về những gì chính tay mình làm ra
  rationale: Truyền đạt tự nhiên thành ngữ Hy Lạp, đồng thời giữ hình ảnh bàn tay con người và sức nặng châm biếm của lời lên án việc thờ sản phẩm do mình tạo ra.
theological_decisions:
- issue: Ngôn ngữ về sự thờ thần tượng và sức nặng tu từ
  choice: Dùng “thần tượng” và giữ ý “những gì chính tay mình làm ra”.
  alternative: Dùng “hình tượng” và “các công việc của tay họ”.
  rationale: Lời của Ê-tiên lên án việc dân Y-sơ-ra-ên thờ vật do chính họ chế tạo. “Thần tượng” thể hiện rõ tính chất thờ sai đối tượng, còn hình ảnh “chính tay mình làm ra” bảo toàn nét châm biếm và âm hưởng phê phán thần tượng trong Kinh Thánh mà không thêm một kết luận giáo phái.
translation_notes:
  register: Văn phong tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. “Dâng tế lễ” phù hợp ngữ cảnh nghi lễ; “chính tay mình làm ra” giữ sức nặng tu từ mà vẫn tự nhiên đối với độc giả phổ thông.
