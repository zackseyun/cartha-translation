source:
  edition: SBLGNT
  text: καὶ εἶπεν πρὸς αὐτόν· Ἔξελθε ἐκ τῆς γῆς σου καὶ ⸀ἐκ τῆς συγγενείας σου, καὶ δεῦρο εἰς ⸀τὴν γῆν ἣν ἄν σοι δείξω.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/003.yaml
  text: And he said to him[a], ‘Go out from your land and from your kindred, and come into the land that I will show you.’
translation:
  language: vi
  text: 'Ngài phán với ông: “Hãy ra khỏi xứ sở của ngươi và rời xa họ hàng[a] của ngươi, rồi đến miền đất Ta sẽ chỉ cho ngươi.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “thân tộc” hoặc “gia tộc”. Từ Hy Lạp συγγένεια chỉ nhóm người có quan hệ họ hàng hay thân tộc.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν πρὸς αὐτόν
  choice: Ngài phán với ông
  rationale: Giữ đại từ chỉ người đã được xác định trong ngữ cảnh, thay vì đưa tên Áp-ra-ham vào câu; “phán” phù hợp với lời Đức Chúa Trời trong văn phong trang trọng.
- source_word: Ἔξελθε ἐκ τῆς γῆς σου
  choice: Hãy ra khỏi xứ sở của ngươi
  rationale: “Ra khỏi” thể hiện rõ hướng chuyển động của ἐξέρχομαι cùng ἐκ; “xứ sở” diễn đạt lãnh thổ quê quán mà không nhất thiết hàm ý một quốc gia theo nghĩa hiện đại.
- source_word: ἐκ τῆς συγγενείας σου
  choice: rời xa họ hàng của ngươi
  rationale: Tiếng Việt cần diễn đạt tự nhiên việc lìa khỏi một nhóm người; “họ hàng” chỉ tập thể những người có quan hệ thân tộc và không thu hẹp nghĩa thành gia đình hạt nhân.
- source_word: δεῦρο εἰς τὴν γῆν
  choice: rồi đến miền đất
  rationale: “Đến” giữ sắc thái hướng về điểm được chỉ định của δεῦρο; “miền đất” tự nhiên trong tiếng Việt và vẫn bảo toàn ý nghĩa lãnh thổ của γῆ.
- source_word: ἣν ἄν σοι δείξω
  choice: Ta sẽ chỉ cho ngươi
  rationale: Mệnh đề với ἄν và động từ giả định hướng về tương lai; “sẽ chỉ” truyền đạt tự nhiên một nơi chưa được xác định nhưng sẽ được Đức Chúa Trời cho biết.
theological_decisions:
- issue: Đại từ trong lời Đức Chúa Trời nói trực tiếp với Áp-ra-ham
  choice: Ta… ngươi
  alternative: Ta… con
  rationale: “Ta… ngươi” giữ giọng phán truyền trang trọng và tránh đưa thêm sắc thái quan hệ cha-con vốn không được hình thái đại từ Hy Lạp xác định trong câu này.
translation_notes:
  register: Bản dịch dùng tiếng Việt hiện đại, trang trọng. Cấu trúc được điều chỉnh nhẹ thành “rời xa họ hàng” để tự nhiên hơn, đồng thời vẫn giữ hai thành phần phải lìa bỏ và hướng chuyển động đến miền đất Đức Chúa Trời sẽ chỉ.
