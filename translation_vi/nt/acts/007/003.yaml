  source_fidelity: 'Bản dịch chuyển tải đầy đủ các thành tố của câu Hy Lạp: lời phán hướng đến một người được xác định từ ngữ cảnh, mệnh lệnh rời khỏi xứ sở và nhóm thân tộc, và mệnh lệnh đến miền đất mà Đức Chúa Trời sẽ chỉ. “Ta sẽ chỉ cho ngươi” diễn đạt đúng chiều hướng tương lai của ἣν ἄν σοι δείξω.'
  naturalness: Văn câu tự nhiên, trang trọng và dễ đọc trong tiếng Việt hiện đại. “Rời xa họ hàng” là cách diễn đạt idiomatic cho việc lìa khỏi một nhóm người; “rồi đến” nối hai mệnh lệnh rõ ràng.
  terminology: “Xứ sở” và “miền đất” giữ được nghĩa lãnh thổ rộng của γῆ mà không áp đặt khái niệm quốc gia hiện đại. “Họ hàng” biểu đạt phù hợp συγγένεια; chú thích nêu các khả năng “thân tộc” và “gia tộc” hữu ích, không làm hẹp nghĩa văn bản.
