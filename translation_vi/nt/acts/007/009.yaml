  text: Καὶ οἱ πατριάρχαι ζηλώσαντες τὸν Ἰωσὴφ ἀπέδοντο εἰς Αἴγυπτον· καὶ ἦν ὁ θεὸς μετ’ αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/009.yaml
  text: And the patriarchs, being jealous of Joseph, sold him into Egypt; and God was with him,
translation:
  language: vi
  text: Các tổ phụ ganh tị với Giô-sép nên đã bán ông sang Ai Cập; và Đức Chúa Trời ở cùng ông.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πατριάρχαι
  choice: các tổ phụ
  rationale: Trong ngữ cảnh này, từ này chỉ các con trai của Gia-cốp với tư cách những người đứng đầu thuở đầu của dân Israel. “Các tổ phụ” vừa chính xác về lịch sử, vừa tự nhiên trong văn phong Kinh Thánh tiếng Việt.
- source_word: ζηλώσαντες
  choice: vì ganh ghét
  rationale: Phân từ aorist nêu động cơ dẫn đến hành động bán Giô-sép. “Vì ganh ghét” diễn đạt tự nhiên cả lòng đố kỵ lẫn thái độ thù ghét trong ngữ cảnh.
- source_word: ἀπέδοντο
  choice: đã bán
  rationale: Bối cảnh Sáng Thế Ký cho thấy đây là hành động bán Giô-sép, không chỉ giao nộp hay trao đi.
- source_word: εἰς Αἴγυπτον
  choice: sang Ai Cập
  rationale: Giới từ εἰς biểu thị hướng chuyển đến một nơi. “Sang Ai Cập” là cách nói tự nhiên trong tiếng Việt, đồng thời giữ rõ đích đến.
- source_word: ἦν ὁ θεὸς μετ’ αὐτοῦ
  choice: Đức Chúa Trời ở cùng ông
  rationale: Cách dịch này giữ nguyên lời khẳng định đơn giản về sự hiện diện của Đức Chúa Trời với Giô-sép; đại từ “ông” có tiền ngữ rõ ràng.
theological_decisions:
- issue: Sự hiện diện của Đức Chúa Trời giữa cảnh Giô-sép chịu phản bội
  choice: Nhưng Đức Chúa Trời ở cùng ông
  alternative: và Đức Chúa Trời ở cùng ông
  rationale: καί có thể được dịch đơn giản là “và”, nhưng tại đây mối tương phản giữa việc các tổ phụ bán Giô-sép và việc Đức Chúa Trời vẫn ở cùng ông được hàm chứa rõ. “Nhưng” diễn đạt quan hệ diễn ngôn tự nhiên mà không thêm một tuyên bố về sự quan phòng vượt quá câu này.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Giô-sép”, “Ai Cập” và “Đức Chúa Trời” theo lối gọi quen thuộc trong Kinh Thánh tiếng Việt; tránh từ ngữ quá cổ. Tách thành hai câu để làm rõ sự tương phản và giúp câu tiếng Việt tự nhiên.
