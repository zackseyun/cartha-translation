    rationale: Nguyên văn chỉ dùng καί (“và”). Dù hoàn cảnh tạo một sự tương phản ngầm, “nhưng” biến sắc thái diễn ngôn hàm ý thành liên từ đối lập được phát biểu rõ. “Và” bảo toàn cách liên kết của bản văn.
  - severity: low
    issue: Cụm “vì ganh ghét Giô-sép” chưa tự nhiên bằng cách dùng với giới từ.
    rationale: ζηλώσαντες τὸν Ἰωσήφ diễn tả sự ganh tị/đố kỵ đối với Giô-sép. Trong tiếng Việt hiện đại, “ganh tị với Giô-sép” tự nhiên và minh bạch hơn.
  revised_text: Các tổ phụ ganh tị với Giô-sép nên đã bán ông sang Ai Cập; và Đức Chúa Trời ở cùng ông.
