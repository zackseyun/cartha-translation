revisions:
- from: Các tổ phụ vì ganh ghét Giô-sép nên đã bán ông sang Ai Cập. Nhưng Đức Chúa Trời ở cùng ông.
  to: Các tổ phụ ganh tị với Giô-sép nên đã bán ông sang Ai Cập; và Đức Chúa Trời ở cùng ông.
  rationale: Thay “Nhưng” bằng “và” để không tăng cường quan hệ đối lập vượt quá καί trong nguyên văn. Điều chỉnh cách diễn đạt lòng ganh tị cho tự nhiên hơn, đồng thời giữ quan hệ động cơ-hành động do phân từ ζηλώσαντες biểu thị. Không cần chú thích vì không có biến thể văn bản hay hàm ý không thể chuyển tải trong câu chính.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T08:28:45Z'
