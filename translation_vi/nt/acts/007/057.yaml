  text: κράξαντες δὲ φωνῇ μεγάλῃ συνέσχον τὰ ὦτα αὐτῶν, καὶ ὥρμησαν ὁμοθυμαδὸν ἐπ’ αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/057.yaml
  text: But crying out with a loud voice[a], they covered their ears and rushed together at him,
translation:
  language: vi
  text: Nhưng họ kêu lớn, bịt tai lại, rồi đồng lòng[a] xông vào ông.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “cùng nhau.” Từ Hy Lạp ὁμοθυμαδόν nhấn mạnh rằng họ hành động trong sự thống nhất.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κράξαντες
  choice: họ kêu lớn
  rationale: Phân từ bất định quá khứ diễn tả tiếng kêu hoặc tiếng la lớn đi liền với các hành động tiếp theo; “kêu lớn” tự nhiên và không quy định quá mức sắc thái cảm xúc.
- source_word: δὲ
  choice: Nhưng
  rationale: Liên từ đánh dấu bước chuyển tương phản từ khải tượng của Ê-tiên sang phản ứng thù nghịch của đám đông.
- source_word: φωνῇ μεγάλῃ
  choice: lớn
  rationale: Cụm từ có nghĩa đen là “bằng một giọng lớn”; trong tiếng Việt, “kêu lớn” diễn đạt tự nhiên cùng nội dung.
- source_word: συνέσχον τὰ ὦτα αὐτῶν
  choice: bịt tai lại
  rationale: Thành ngữ chỉ hành động khép hoặc che tai để không nghe; “bịt tai lại” rõ ràng và tự nhiên trong tiếng Việt hiện đại.
- source_word: ὥρμησαν
  choice: xông vào
  rationale: Động từ diễn tả chuyển động đột ngột và mạnh về phía một người; “xông vào” truyền đạt hướng chuyển động mang tính thù nghịch mà không thêm chi tiết ngoài văn bản.
- source_word: ὁμοθυμαδὸν
  choice: đồng lòng
  rationale: Trạng từ nhấn mạnh hành động thống nhất và chung ý hướng của cả nhóm; “đồng lòng” giữ được sắc thái này, còn “cùng nhau” là cách diễn đạt trung tính hơn.
- source_word: ἐπ’ αὐτόν
  choice: vào ông
  rationale: Sau động từ chỉ sự lao tới, ἐπί với đối cách biểu thị chuyển động hướng thẳng đến một người; “xông vào ông” là cách nói tự nhiên trong ngữ cảnh.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Cấu trúc liên tiếp “kêu lớn, bịt tai lại, rồi… xông vào” giữ nhịp dồn dập của câu Hy Lạp; dấu chú thích được đặt ngay sau từ tương ứng với ὁμοθυμαδόν.
