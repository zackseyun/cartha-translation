source:
  edition: SBLGNT
  text: τῇ τε ἐπιούσῃ ἡμέρᾳ ὤφθη αὐτοῖς μαχομένοις καὶ ⸀συνήλλασσεν αὐτοὺς εἰς εἰρήνην εἰπών· Ἄνδρες, ἀδελφοί ⸀ἐστε· ἱνατί ἀδικεῖτε ἀλλήλους;
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/026.yaml
  text: And on the following day he appeared to them as they were fighting and was trying to reconcile them to peace[a], saying, ‘Men, you are brothers[b]; why are you wronging one another?’
translation:
  language: vi
  text: 'Ngày hôm sau, Môi-se xuất hiện trước mặt họ khi họ đang đánh nhau và cố gắng giảng hòa cho họ, nói: “Này các anh, các anh là anh em với nhau; tại sao lại đối xử bất công với nhau?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τῇ τε ἐπιούσῃ ἡμέρᾳ
  choice: Ngày hôm sau
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt, giữ rõ trình tự thời gian của cụm chỉ ngày kế tiếp.
- source_word: ὤφθη
  choice: xuất hiện trước mặt họ
  rationale: Dạng bị động của ὁράω ở đây có nghĩa nội động từ là “xuất hiện”; thêm “trước mặt họ” diễn đạt tự nhiên đối tượng ở cách dữ cách.
- source_word: αὐτοῖς μαχομένοις
  choice: khi họ đang đánh nhau
  rationale: Phân từ hiện tại diễn tả hành động đang tiếp diễn vào lúc Môi-se xuất hiện.
- source_word: συνήλλασσεν αὐτοὺς εἰς εἰρήνην
  choice: cố gắng hòa giải họ
  rationale: Thì chưa hoàn thành trong ngữ cảnh có thể mang sắc thái cố thực hiện nhưng chưa thành; “hòa giải họ” tự nhiên trong tiếng Việt và chuyển tải việc đưa hai bên đến hòa bình.
- source_word: Ἄνδρες
  choice: Này các anh
  rationale: Lời gọi trực tiếp dành cho hai người nam; “các anh” tự nhiên, trang trọng vừa phải, còn “này” đánh dấu hô cách.
- source_word: ἀδελφοί ἐστε
  choice: các anh là anh em với nhau
  rationale: Giữ lời kêu gọi dựa trên quan hệ đồng bào/anh em; “với nhau” làm rõ quan hệ tương hỗ trong tiếng Việt.
- source_word: ἱνατί ἀδικεῖτε ἀλλήλους
  choice: sao lại làm điều sai trái với nhau?
  rationale: ἀδικέω chỉ việc đối xử sai trái hay gây bất công; “sao lại” tự nhiên trong lời trách hỏi và ἀλλήλους được giữ bằng “với nhau”.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang nghiêm nhưng dễ hiểu. Dùng “Môi-se” để làm rõ chủ thể vốn được xác định từ ngữ cảnh, tránh đại từ “ông” có thể mơ hồ trong câu đứng riêng. Không thêm chú thích vì sắc thái cố gắng của thì chưa hoàn thành đã được thể hiện trực tiếp và không có dị bản hay vấn đề thần học cần ghi chú.
