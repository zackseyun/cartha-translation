id: ACT.7.49
reference: Acts 7:49
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ὁ οὐρανός μοι θρόνος, ⸂ἡ δὲ⸃ γῆ ὑποπόδιον τῶν ποδῶν μου· ποῖον οἶκον οἰκοδομήσετέ μοι, λέγει κύριος, ἢ τίς τόπος τῆς καταπαύσεώς μου;
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/049.yaml
  text: Heaven is my throne[a], and the earth is the footstool for my feet. What kind of house will you build for me, says the Lord, or what is the place of my rest?
translation:
  language: vi
  text: '“Trời là ngai của Ta,

    còn đất là bệ chân Ta.

    Các ngươi sẽ xây cho Ta một ngôi nhà như thế nào,” Chúa phán,

    “hay đâu là nơi Ta nghỉ ngơi?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐρανός
  choice: trời
  rationale: Trong thế đối lập vũ trụ với đất, từ này chỉ cõi trời chứ không chỉ bầu trời nhìn thấy; “trời” là cách diễn đạt tự nhiên và trang trọng trong tiếng Việt.
- source_word: θρόνος
  choice: ngai
  rationale: Giữ nguyên hình ảnh vương quyền của nguyên văn; “ngai” tự nhiên hơn “ngai vàng” vì nguyên văn không nói đến vàng.
- source_word: γῆ
  choice: đất
  rationale: Ở đây từ này có phạm vi vũ trụ, đối ứng với trời, không mang nghĩa một xứ hay vùng đất.
- source_word: ὑποπόδιον τῶν ποδῶν μου
  choice: bệ chân Ta
  rationale: “Bệ chân” là thành ngữ tiếng Việt tự nhiên, giữ hình ảnh của nguyên văn mà không lặp từ “chân” một cách gượng gạo.
- source_word: ποῖον
  choice: như thế nào
  rationale: Diễn đạt câu hỏi về tính chất hay loại của ngôi nhà, thay vì chỉ hỏi ngôi nhà nào.
- source_word: οἶκον
  choice: một ngôi nhà
  rationale: Giữ nghĩa trực tiếp là “nhà”, không giải nghĩa thành “đền thờ”; văn cảnh tự cho thấy hàm ý liên quan đến đền thờ.
- source_word: οἰκοδομήσετέ
  choice: các ngươi sẽ xây
  rationale: Phản ánh trực tiếp thì tương lai trong câu hỏi tu từ và đại từ số nhiều ngôi thứ hai.
- source_word: κύριος
  choice: Chúa
  rationale: Đây là danh xưng của Đức Chúa Trời trong công thức dẫn lời; “Chúa” vừa tự nhiên vừa phù hợp với κύριος trong bản Hy Lạp Tân Ước.
- source_word: τόπος
  choice: nơi
  rationale: Tương đương ngắn gọn, tự nhiên với nghĩa địa điểm.
- source_word: καταπαύσεώς μου
  choice: Ta nghỉ ngơi
  rationale: Cấu trúc “nơi Ta nghỉ ngơi” tự nhiên trong tiếng Việt, bảo toàn ý về sự nghỉ ngơi của Đức Chúa Trời mà không giải thích thêm.
theological_decisions:
- issue: Cách dịch κύριος trong lời trích dẫn Ê-sai, nơi Đức Chúa Trời của Israel là Đấng phán
  choice: Chúa
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Nguồn Tân Ước dùng κύριος, vì vậy dịch trực tiếp là “Chúa” thay vì thay bằng danh riêng hoặc kiểu chữ vốn không hiện diện trong bản Hy Lạp.
- issue: οἶκος có nên được giải nghĩa trực tiếp là đền thờ hay không
  choice: ngôi nhà
  alternative: đền thờ
  rationale: Nguyên văn nói “nhà”; giữ cách nói này bảo toàn hình thức và sức căng của câu trích dẫn, để văn cảnh xác định mối liên hệ với đền thờ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ta/các ngươi” để thể hiện lời phán uy nghiêm và giữ rõ đại từ số nhiều. Giữ cấu trúc thơ song song và hai câu hỏi tu từ của nguyên văn; không thêm chú thích vì bản dịch không cần một phương án từ vựng thiết yếu để làm rõ.
