  terminology: “Chúa” phản ánh κύριος cách phù hợp; “ngai,” “bệ chân,” “ngôi nhà,” và “nơi Ta nghỉ ngơi” đều giữ được hình ảnh và không áp đặt cách giải nghĩa “đền thờ”. Không cần chú thích.
