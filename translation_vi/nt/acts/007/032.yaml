id: ACT.7.32
reference: Acts 7:32
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἐγὼ ὁ θεὸς τῶν πατέρων σου, ὁ θεὸς Ἀβραὰμ ⸀καὶ Ἰσαὰκ ⸁καὶ Ἰακώβ. ἔντρομος δὲ γενόμενος Μωϋσῆς οὐκ ἐτόλμα κατανοῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/032.yaml
  text: I am the God of your fathers[a], the God of Abraham and Isaac and Jacob[b]. Then Moses became terrified and did not dare to look closely.
translation:
  language: vi
  text: “Ta là Đức Chúa Trời của tổ phụ con, Đức Chúa Trời của Áp-ra-ham, Y-sác và Gia-cốp.” Bấy giờ, Môi-se run sợ và không dám nhìn kỹ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “xem xét” hoặc “quan sát kỹ.” Động từ Hy Lạp có thể chỉ việc nhìn chăm chú hoặc suy xét cẩn thận.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγὼ ὁ θεὸς
  choice: Ta là Đức Chúa Trời
  rationale: Đại từ Ἐγώ có tính nhấn mạnh, còn động từ nối được hiểu ngầm trong câu định danh. “Ta là” diễn đạt tự nhiên lời Đức Chúa Trời tự xưng; “Đức Chúa Trời” là cách gọi trang trọng, quen thuộc trong tiếng Việt.
- source_word: τῶν πατέρων σου
  choice: của tổ phụ con
  rationale: πατέρων theo nghĩa đen là “các cha”, nhưng trong ngữ cảnh này chỉ các bậc tiền tổ của Môi-se. “Tổ phụ” vừa tự nhiên vừa giữ sắc thái lịch sử giao ước; σου là số ít nên dịch là “con”.
- source_word: ὁ θεὸς Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακώβ
  choice: Đức Chúa Trời của Áp-ra-ham, Y-sác và Gia-cốp
  rationale: Giữ nguyên cấu trúc đồng vị xác định Đức Chúa Trời qua ba tổ phụ. Tiếng Việt tự nhiên không cần lặp liên từ trước từng tên.
- source_word: ἔντρομος δὲ γενόμενος
  choice: Môi-se run sợ
  rationale: ἔντρομος diễn tả trạng thái sợ hãi đến mức run rẩy, còn γενόμενος chỉ việc bước vào trạng thái ấy. “Run sợ” gọn, tự nhiên và giữ cả sắc thái cảm xúc lẫn biểu hiện thể chất.
- source_word: οὐκ ἐτόλμα
  choice: không dám
  rationale: Diễn đạt trực tiếp ý không đủ can đảm để thực hiện hành động; thì chưa hoàn thành không cần biểu thị riêng trong tiếng Việt.
- source_word: κατανοῆσαι
  choice: nhìn kỹ
  rationale: Trong bối cảnh vật có thể nhìn thấy, động từ chỉ sự quan sát chăm chú. “Nhìn kỹ” rõ ràng, phổ thông, đồng thời giữ khả năng hiểu là xem xét cẩn thận.
theological_decisions:
- issue: Lời tự xưng của Đức Chúa Trời trong câu trích từ Xuất Hành
  choice: Ta là Đức Chúa Trời của tổ phụ con
  alternative: Ta, Đức Chúa Trời của tổ phụ con
  rationale: Bản Hy Lạp không ghi động từ nối nhưng câu định danh đòi hỏi hiểu ngầm. Thêm “là” tạo câu tiếng Việt hoàn chỉnh mà không đưa thêm một khẳng định thần học ngoài nguyên văn.
- issue: Quan hệ giữa Đức Chúa Trời và ba tổ phụ
  choice: Đức Chúa Trời của Áp-ra-ham, Y-sác và Gia-cốp
  alternative: Đức Chúa Trời của Áp-ra-ham và Y-sác và Gia-cốp
  rationale: Cách liệt kê bằng dấu phẩy là tiếng Việt tự nhiên và vẫn xác định cùng một Đức Chúa Trời trong mối liên hệ với cả ba người, không làm thay đổi nội dung.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ta—con” phù hợp lời Đức Chúa Trời phán trực tiếp với Môi-se; dùng các dạng tên Kinh Thánh quen thuộc trong tiếng Việt. Dấu [a] được đặt ngay sau cụm từ mà chú thích giải nghĩa.
