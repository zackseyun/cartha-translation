id: ACT.7.6
reference: Acts 7:6
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐλάλησεν ⸀δὲ οὕτως ὁ θεὸς ὅτι ἔσται τὸ σπέρμα αὐτοῦ πάροικον ἐν γῇ ἀλλοτρίᾳ, καὶ δουλώσουσιν αὐτὸ καὶ κακώσουσιν ἔτη τετρακόσια·
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/006.yaml
  text: 'But God spoke in this way: that his offspring would be a foreign resident in a strange land[a], and they would enslave it and mistreat it for four hundred years.'
translation:
  language: vi
  text: 'Nhưng Đức Chúa Trời đã phán thế này: “Dòng dõi[a] của ông sẽ sống như ngoại kiều tại một vùng đất không thuộc về mình; người ta sẽ bắt họ làm nô lệ và ngược đãi họ suốt bốn trăm năm.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hy Lạp dùng danh từ và đại từ số ít theo nghĩa tập thể: “dòng dõi … nó”.'
    reason: Giải thích rằng “dòng dõi” và đối tượng được nói đến có hình thức số ít trong tiếng Hy Lạp, dù bản dịch dùng “họ” cho tự nhiên trong tiếng Việt.
lexical_decisions:
- source_word: ἐλάλησεν δὲ οὕτως ὁ θεὸς
  choice: Nhưng Đức Chúa Trời đã phán thế này
  rationale: Giữ sắc thái chuyển ý nhẹ của δέ, diễn đạt rõ οὕτως và dùng “phán” phù hợp với lời Đức Chúa Trời trong văn phong Kinh Thánh trang trọng nhưng hiện đại.
- source_word: τὸ σπέρμα αὐτοῦ
  choice: Dòng dõi của ông
  rationale: σπέρμα chỉ tập thể hậu duệ của Áp-ra-ham. “Dòng dõi” vừa tự nhiên trong tiếng Việt vừa giữ được hình thức danh từ tập thể.
- source_word: πάροικον ἐν γῇ ἀλλοτρίᾳ
  choice: sẽ sống như ngoại kiều tại một vùng đất không thuộc về mình
  rationale: πάροικος nói đến người cư trú tại nơi không phải quê hương hay đất của mình; ἀλλοτρία nhấn mạnh đất thuộc về người khác. Cách dịch này truyền đạt cả tư cách cư trú lẫn tình trạng không thuộc về xứ ấy.
- source_word: δουλώσουσιν αὐτὸ
  choice: người ta sẽ bắt họ làm nô lệ
  rationale: Chủ thể số nhiều không được nêu rõ được diễn đạt tự nhiên bằng “người ta”; δουλόω được dịch rõ là “bắt làm nô lệ”. “Họ” quy chiếu tự nhiên đến tập thể “dòng dõi” trong tiếng Việt.
- source_word: κακώσουσιν
  choice: ngược đãi họ
  rationale: “Ngược đãi” diễn đạt việc gây khổ sở và đối xử tàn tệ mà không thu hẹp nghĩa quá mức.
- source_word: ἔτη τετρακόσια
  choice: suốt bốn trăm năm
  rationale: “Suốt” diễn đạt tự nhiên khoảng thời gian kéo dài được biểu thị bằng đối cách chỉ thời lượng trong tiếng Hy Lạp.
theological_decisions:
- issue: Số ít tập thể trong cụm σπέρμα ... αὐτό
  choice: Dịch “dòng dõi ... họ” và chú thích cấu trúc số ít của nguyên văn
  alternative: Dịch máy móc “dòng dõi ... nó” để giữ hoàn toàn hình thức số ít
  rationale: “Dòng dõi” giữ ý nghĩa tập thể của σπέρμα, còn “họ” là đại từ tự nhiên khi nói về những người thuộc tập thể ấy trong tiếng Việt. Chú thích bảo tồn đặc điểm ngữ pháp đáng lưu ý của nguyên văn mà không làm câu chính trở nên gượng gạo.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng và dễ hiểu. “Ngoại kiều” giữ ý người cư trú ngoài quê hương; cụm “một vùng đất không thuộc về mình” làm rõ sắc thái của ἀλλοτρίᾳ. Dấu ngoặc kép đánh dấu nội dung lời Đức Chúa Trời được Ê-tiên thuật lại.
