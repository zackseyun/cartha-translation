  to: 'Nhưng Đức Chúa Trời đã phán thế này: “Dòng dõi[a] của ông sẽ sống như ngoại kiều tại một vùng đất không thuộc về mình; người ta sẽ bắt họ làm nô lệ và ngược đãi họ suốt bốn trăm năm.”'
