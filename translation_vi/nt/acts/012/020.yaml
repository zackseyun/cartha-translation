id: ACT.12.20
reference: Acts 12:20
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἦν ⸀δὲ θυμομαχῶν Τυρίοις καὶ Σιδωνίοις· ὁμοθυμαδὸν δὲ παρῆσαν πρὸς αὐτόν, καὶ πείσαντες Βλάστον τὸν ἐπὶ τοῦ κοιτῶνος τοῦ βασιλέως ᾐτοῦντο εἰρήνην διὰ τὸ τρέφεσθαι αὐτῶν τὴν χώραν ἀπὸ τῆς βασιλικῆς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/020.yaml
  text: He was very angry with the Tyrians and Sidonians[a]. But they came to him with one accord, and after persuading Blastus, the king’s chamberlain, they were asking for peace[d][c][b], because their country was fed from the king’s domain.
translation:
  language: vi
  text: Vua Hê-rốt rất giận dân thành Ty-rơ và Si-đôn.[a] Nhưng họ đồng lòng đến gặp vua. Sau khi thuyết phục Bơ-lát-tút, viên quan phụ trách phòng riêng của vua,[b] họ cầu hòa, vì xứ họ nhận nguồn lương thực từ lãnh thổ của vua.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “thù địch với dân thành Ty-rơ và Si-đôn.” Từ Hy Lạp diễn tả sự giận dữ hoặc thù địch mãnh liệt.'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “người phụ trách phòng ngủ của vua,” có lẽ là một quan trong triều được ra vào khu vực riêng của vua.'
    reason: cultural_note
  - marker: c
    text: 'Hay: “vì vùng đất của họ được cung cấp lương thực từ lãnh thổ của vua.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: θυμομαχῶν
  choice: rất giận
  rationale: Diễn đạt tự nhiên trạng thái giận dữ hoặc thù địch mãnh liệt; chú thích giữ lại sắc thái 'thù địch' như một khả năng dịch.
- source_word: Τυρίοις καὶ Σιδωνίοις
  choice: dân thành Ty-rơ và Si-đôn
  rationale: Các hình thức chỉ cư dân của hai thành; cách diễn đạt này rõ ràng và tự nhiên hơn việc tạo danh xưng dân tộc ít quen thuộc trong tiếng Việt.
- source_word: ὁμοθυμαδόν
  choice: đồng lòng
  rationale: Thể hiện sự thống nhất về ý định, không chỉ đơn thuần là cùng đi với nhau.
- source_word: παρῆσαν πρὸς αὐτόν
  choice: đến gặp vua
  rationale: Diễn đạt tự nhiên việc họ đến trình diện hoặc tiếp cận Hê-rốt; dùng 'vua' để tránh đại từ mơ hồ trong tiếng Việt.
- source_word: πείσαντες
  choice: sau khi thuyết phục
  rationale: Phản ánh hành động xảy ra trước lời cầu hòa theo phân từ bất định quá khứ.
- source_word: Βλάστον
  choice: Bơ-lát-tút
  rationale: Phiên âm tên riêng Hy Lạp Βλάστος theo lối dễ đọc trong tiếng Việt.
- source_word: τὸν ἐπὶ τοῦ κοιτῶνος τοῦ βασιλέως
  choice: viên quan phụ trách phòng riêng của vua
  rationale: Giữ hình ảnh căn phòng riêng của vua và cho thấy đây là một chức quan trong triều có quyền tiếp cận nhà vua, tránh từ cổ hoặc chức danh quá chuyên biệt.
- source_word: ᾐτοῦντο εἰρήνην
  choice: họ cầu hòa
  rationale: Cụm từ ngoại giao ngắn gọn, tự nhiên; thì chưa hoàn thành có thể chỉ lời thỉnh cầu đang được tiến hành, nhưng tiếng Việt không cần đánh dấu hình thái ấy.
- source_word: διὰ τὸ τρέφεσθαι αὐτῶν τὴν χώραν
  choice: vì xứ họ nhận nguồn lương thực
  rationale: Nêu rõ quan hệ nguyên nhân và ý nghĩa được nuôi sống hoặc cung cấp thực phẩm, tránh nhân hóa vụng về rằng cả xứ 'được nuôi'.
- source_word: ἀπὸ τῆς βασιλικῆς
  choice: từ lãnh thổ của vua
  rationale: Tính từ được dùng như danh từ chỉ phần đất thuộc nhà vua; 'lãnh thổ' truyền đạt rõ quan hệ kinh tế và tránh lặp từ 'xứ'.
theological_decisions: []
translation_notes:
  register: 'Văn phong hiện đại, trang trọng và dễ hiểu. Câu đầu nêu rõ chủ thể là vua Hê-rốt từ ngữ cảnh thay vì dùng đại từ dễ mơ hồ. Trật tự câu được điều chỉnh vừa phải cho tiếng Việt nhưng vẫn bảo toàn diễn tiến: sự giận dữ, đoàn người đồng lòng đến, thuyết phục quan Bơ-lát-tút, rồi cầu hòa vì lệ thuộc nguồn lương thực.'
