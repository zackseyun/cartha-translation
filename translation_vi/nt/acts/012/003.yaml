id: ACT.12.3
reference: Acts 12:3
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸂ἰδὼν δὲ⸃ ὅτι ἀρεστόν ἐστιν τοῖς Ἰουδαίοις προσέθετο συλλαβεῖν καὶ Πέτρον (ἦσαν ⸀δὲ ἡμέραι τῶν ἀζύμων),
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/003.yaml
  text: And when he saw that it was pleasing to the Jews[a], he proceeded to arrest Peter also[b]. (Now these were the days of Unleavened Bread.)
translation:
  language: vi
  text: Khi thấy việc ấy làm người Do Thái[a] hài lòng, vua lại cho bắt cả Phi-e-rơ. (Bấy giờ đang trong những ngày Lễ Bánh Không Men[b].)
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “người Giu-đê”, hoặc theo nghĩa hẹp trong ngữ cảnh là “các nhà lãnh đạo Do Thái”. Tuy nhiên, tiếng Hy Lạp ở đây chỉ nói “người Do Thái”.
    reason: lexical_alternative
  - marker: b
    text: Tức là kỳ lễ tiếp sau Lễ Vượt Qua, trong đó người ta ăn bánh không men.
    reason: cultural_note
lexical_decisions:
- source_word: ἰδὼν δὲ
  choice: Khi thấy
  rationale: 'Phân từ bất định quá khứ mang ý nghĩa hoàn cảnh-thời gian: Hê-rốt nhận thấy phản ứng của người Do Thái rồi mới hành động tiếp. Tiếng Việt không cần dịch riêng δέ ở đây.'
- source_word: ἀρεστόν ἐστιν
  choice: việc ấy làm ... hài lòng
  rationale: Diễn đạt tự nhiên cấu trúc vô nhân xưng chỉ điều được ưa thích hay chấp thuận; “việc ấy” quy chiếu về hành động trước đó.
- source_word: τοῖς Ἰουδαίοις
  choice: người Do Thái
  rationale: Giữ nghĩa từ vựng trực tiếp, vì bản Hy Lạp không minh nhiên giới hạn đối tượng thành giới lãnh đạo hay cư dân Giu-đê.
- source_word: προσέθετο συλλαβεῖν
  choice: lại cho bắt
  rationale: προστίθημι đi với động từ nguyên mẫu có nghĩa tiếp tục hay làm thêm một việc; “lại” giữ ý bổ sung, còn “cho bắt” tự nhiên trong ngữ cảnh nhà vua ra lệnh bắt giữ.
- source_word: καὶ Πέτρον
  choice: cả Phi-e-rơ
  rationale: 'καί có sức bổ sung: Phi-e-rơ cũng trở thành mục tiêu sau Gia-cơ.'
- source_word: ἦσαν δὲ ἡμέραι τῶν ἀζύμων
  choice: Bấy giờ đang trong những ngày Lễ Bánh Không Men
  rationale: Giữ cách gọi cụ thể của kỳ lễ và chức năng xác định thời gian của câu chen, không đồng nhất tên gọi này với Lễ Vượt Qua.
theological_decisions:
- issue: Phạm vi chỉ định của Ἰουδαίοις
  choice: người Do Thái
  alternative: người Giu-đê; các nhà lãnh đạo Do Thái
  rationale: Nguyên văn dùng danh từ rộng và không tự giới hạn phạm vi. Chú thích bảo tồn các khả năng ngữ cảnh mà không đưa cách thu hẹp diễn giải vào chính văn.
- issue: Tên kỳ lễ τῶν ἀζύμων
  choice: Lễ Bánh Không Men
  alternative: Lễ Vượt Qua
  rationale: Nguyên văn gọi đích danh những ngày Bánh Không Men. Giữ tên này tránh hòa lẫn hai cách gọi có liên hệ chặt chẽ nhưng không hoàn toàn đồng nhất.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “vua” để làm rõ chủ thể Hê-rốt từ ngữ cảnh liền trước, không lặp tên; giữ tên lễ truyền thống “Lễ Bánh Không Men”. Mọi ký hiệu chú thích đều xuất hiện trong chính văn.
