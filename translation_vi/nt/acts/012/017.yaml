id: ACT.12.17
reference: Acts 12:17
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: κατασείσας δὲ αὐτοῖς τῇ χειρὶ σιγᾶν διηγήσατο αὐτοῖς πῶς ὁ κύριος αὐτὸν ἐξήγαγεν ἐκ τῆς φυλακῆς, εἶπέν ⸀τε· Ἀπαγγείλατε Ἰακώβῳ καὶ τοῖς ἀδελφοῖς ταῦτα. καὶ ἐξελθὼν ἐπορεύθη εἰς ἕτερον τόπον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/017.yaml
  text: But motioning to them with his hand to be silent[a], he explained to them how the Lord had brought him out of the prison. And he said, “Report these things to James and to the brothers.” Then he departed and went to another place.
translation:
  language: vi
  text: 'Nhưng ông ra hiệu bằng tay bảo họ im lặng, rồi kể cho họ nghe cách Chúa đã đưa ông ra khỏi nhà tù. Ông nói: “Hãy báo những việc này cho Gia-cơ và các anh em[a].” Rồi ông rời đi, đến một nơi khác.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể hiểu là “các anh chị em”; tiếng Hy Lạp viết “các anh em,” nhưng tùy ngữ cảnh, cụm từ này có thể chỉ cộng đồng tín hữu rộng hơn.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατασείσας ... τῇ χειρὶ σιγᾶν
  choice: giơ tay ra hiệu cho họ im lặng
  rationale: Diễn đạt tự nhiên động tác dùng tay ra hiệu nhằm khiến đám đông giữ im lặng, không xác định quá mức hình thức chính xác của cử chỉ.
- source_word: διηγήσατο
  choice: kể lại
  rationale: Động từ chỉ việc thuật lại một sự việc theo trình tự; “kể lại” tự nhiên trong tiếng Việt và phù hợp với việc Phi-e-rơ thuật chuyện được giải cứu.
- source_word: πῶς
  choice: như thế nào
  rationale: Giữ cách thức mà mệnh đề Hy Lạp diễn đạt nội dung lời kể, thay vì chuyển thành một mệnh đề chỉ sự kiện đơn thuần.
- source_word: ὁ κύριος
  choice: Chúa
  rationale: Cách gọi trang trọng và quen thuộc trong tiếng Việt, đồng thời không tự ý xác định danh xưng này chỉ về Chúa Giê-su hay về Đức Chúa Trời nói chung.
- source_word: ἐξήγαγεν ἐκ τῆς φυλακῆς
  choice: đã đưa ông ra khỏi nhà tù
  rationale: “Đưa ... ra khỏi” truyền đạt rõ hành động giải thoát khỏi nơi giam giữ; “nhà tù” phù hợp với văn phong tường thuật trang trọng.
- source_word: Ἀπαγγείλατε
  choice: Hãy báo
  rationale: Thể hiện mệnh lệnh chuyển giao một tin quan trọng, ngắn gọn và tự nhiên.
- source_word: Ἰακώβῳ
  choice: Gia-cơ
  rationale: Dùng dạng tên Kinh Thánh quen thuộc trong tiếng Việt cho Ἰάκωβος/Ἰακώβ.
- source_word: τοῖς ἀδελφοῖς
  choice: các anh em
  rationale: Giữ hình thức số nhiều giống đực của tiếng Hy Lạp; chú thích nêu khả năng từ này bao gồm cộng đồng tín hữu rộng hơn.
- source_word: ἐξελθὼν ἐπορεύθη
  choice: ông rời đi và đến
  rationale: Truyền đạt cả việc rời địa điểm hiện tại lẫn di chuyển tới nơi khác mà tránh lối lặp gượng gạo trong tiếng Việt.
- source_word: εἰς ἕτερον τόπον
  choice: một nơi khác
  rationale: Giữ tính bất định và không thêm suy đoán về địa điểm.
theological_decisions:
- issue: Đối tượng được danh xưng κύριος chỉ đến
  choice: Dịch là “Chúa” và không xác định thêm.
  alternative: Hiểu cụ thể là Chúa Giê-su, hoặc hiểu rộng hơn là Đức Chúa Trời.
  rationale: Bản văn chỉ dùng κύριος mà không nói rõ hơn. Cách dịch “Chúa” bảo toàn sự không xác định và sức căng thần học của nguyên văn.
- issue: Phạm vi của τοῖς ἀδελφοῖς
  choice: Dịch trong chính văn là “các anh em,” kèm chú thích về nghĩa có thể bao gồm cộng đồng tín hữu.
  alternative: Dịch thẳng là “các anh chị em” hoặc “các tín hữu.”
  rationale: Hình thức Hy Lạp là số nhiều giống đực, nhưng tùy ngữ cảnh có thể được dùng theo nghĩa cộng đồng rộng hơn; chính văn và chú thích cùng bảo toàn cả hình thức lẫn khả năng ngữ nghĩa.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng vừa phải và dễ hiểu. Dùng đại từ “ông” theo mạch kể về Phi-e-rơ; giữ câu mệnh lệnh trực tiếp và địa điểm không xác định như nguyên văn.
