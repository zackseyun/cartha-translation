id: ACT.12.5
reference: Acts 12:5
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ μὲν οὖν Πέτρος ἐτηρεῖτο ἐν τῇ φυλακῇ· προσευχὴ δὲ ἦν ⸀ἐκτενῶς γινομένη ὑπὸ τῆς ἐκκλησίας πρὸς τὸν θεὸν ⸀περὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/005.yaml
  text: So Peter was being kept in the prison[a], but earnest prayer was being made to God by the church for him.
translation:
  language: vi
  text: Vậy, Phi-e-rơ bị giam trong tù, còn Hội Thánh thì đang tha thiết[a] cầu nguyện cùng Đức Chúa Trời cho ông.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “kiên trì”; trạng từ Hy Lạp có thể nhấn mạnh cường độ hoặc sự bền bỉ của lời cầu nguyện.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐτηρεῖτο
  choice: bị giam giữ
  rationale: Thể chưa hoàn thành bị động diễn tả tình trạng giam giữ đang tiếp diễn. Cách dịch này giữ thể bị động và tự nhiên trong ngữ cảnh nhà tù, nhưng không nói cụ thể hơn bản Hy Lạp về cách canh giữ.
- source_word: φυλακῇ
  choice: trong tù
  rationale: Chỉ nơi Phi-e-rơ bị giam; cách nói ngắn gọn, tự nhiên trong tiếng Việt hiện đại.
- source_word: προσευχὴ ... ἦν ... γινομένη
  choice: vẫn ... cầu nguyện
  rationale: Kết cấu περιφραστική với ἦν và phân từ diễn tả hành động đang tiếp diễn. Từ “vẫn” làm rõ sự cầu nguyện liên tục trong thế tương phản với việc Phi-e-rơ bị giam.
- source_word: ἐκτενῶς
  choice: tha thiết
  rationale: Diễn đạt cường độ và sự chuyên tâm của lời cầu nguyện bằng ngôn ngữ tự nhiên, trang trọng; khả năng nhấn mạnh sự bền bỉ được ghi ở chú thích.
- source_word: ὑπὸ τῆς ἐκκλησίας
  choice: Hội Thánh
  rationale: Trong ngữ cảnh này, ἐκκλησία là cộng đồng những người tin Chúa đang cầu nguyện, không nhất thiết hàm ý một cơ cấu giáo phái về sau.
- source_word: πρὸς τὸν θεὸν
  choice: cầu nguyện Đức Chúa Trời
  rationale: πρός chỉ đối tượng và hướng của lời cầu nguyện. Tiếng Việt tự nhiên không cần thêm giới từ trước “Đức Chúa Trời” với động từ “cầu nguyện”.
- source_word: περὶ αὐτοῦ
  choice: cho ông
  rationale: Trong lời cầu thay, περί với sở hữu cách tự nhiên nhất là “cho ông”, tức vì lợi ích của Phi-e-rơ.
- source_word: μὲν οὖν ... δὲ
  choice: Vậy ... nhưng ...
  rationale: Giữ cả bước chuyển tiếp của câu chuyện lẫn sự tương phản giữa cảnh Phi-e-rơ bị giam và Hội Thánh cầu nguyện.
theological_decisions:
- issue: Cách dịch ἐκκλησία
  choice: Hội Thánh
  alternative: cộng đồng tín hữu; hội chúng
  rationale: “Hội Thánh” là cách gọi quen thuộc và phù hợp cho cộng đồng Cơ Đốc đang cầu nguyện trong sách Công Vụ, mà không buộc câu văn theo một mô hình tổ chức giáo phái cụ thể.
- issue: Sắc thái của ἐκτενῶς
  choice: tha thiết
  alternative: kiên trì; sốt sắng
  rationale: Từ Hy Lạp có thể nhấn mạnh cường độ hoặc sự bền bỉ. Bản chính dùng “tha thiết” vì tự nhiên và giữ được cường độ; chú thích bảo lưu sắc thái kiên trì.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Phi-e-rơ” và “Đức Chúa Trời” theo lối gọi Kinh Thánh Việt ngữ quen thuộc; “vẫn” giúp thể hiện hành động cầu nguyện đang tiếp diễn.
