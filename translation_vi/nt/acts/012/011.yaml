  source_fidelity: 'Bản dịch truyền đạt đúng các thành tố chính của nguyên văn: Phi-e-rơ trở lại nhận thức đầy đủ, lời xác nhận nhấn mạnh «bây giờ... thật sự biết», Chúa sai thiên sứ, sự giải cứu khỏi quyền lực của Hê-rốt, và khỏi toàn bộ điều dân Do Thái mong đợi. «Định thần lại» là một cách diễn đạt tự nhiên, không áp đặt rằng ông đã ngủ hay mất trí; «khỏi tay Hê-rốt» giữ được thành ngữ quyền lực/kiểm soát.'
