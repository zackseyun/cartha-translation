id: ACT.12.11
reference: Acts 12:11
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ὁ Πέτρος ⸂ἐν ἑαυτῷ γενόμενος⸃ εἶπεν· Νῦν οἶδα ἀληθῶς ὅτι ἐξαπέστειλεν ⸀ὁ κύριος τὸν ἄγγελον αὐτοῦ καὶ ἐξείλατό με ἐκ χειρὸς Ἡρῴδου καὶ πάσης τῆς προσδοκίας τοῦ λαοῦ τῶν Ἰουδαίων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/011.yaml
  text: And Peter[a], coming to himself, said[c][b], “Now I truly know that the Lord sent his angel and rescued me from Herod’s hand and from all the expectation of the people of the Jews.”
translation:
  language: vi
  text: 'Bấy giờ, Phi-e-rơ định thần lại[a] và nói: “Bây giờ tôi thật sự biết rằng Chúa đã sai thiên sứ của Ngài đến giải cứu tôi khỏi tay Hê-rốt[b] và khỏi mọi điều dân Do Thái mong đợi[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “trở lại tỉnh táo” hoặc “hoàn hồn lại.”'
    reason: lexical_alternative
  - marker: b
    text: “Khỏi tay Hê-rốt” nghĩa là khỏi quyền lực hoặc sự kiểm soát của Hê-rốt.
    reason: cultural_note
  - marker: c
    text: 'Hay: “khỏi tất cả những gì dân Do Thái đang mong đợi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἑαυτῷ γενόμενος
  choice: định thần lại
  rationale: Diễn đạt tự nhiên việc Phi-e-rơ trở lại trạng thái hoàn toàn tỉnh táo sau trải nghiệm tưởng như một khải tượng, đồng thời không hàm ý trước đó ông mất lý trí.
- source_word: ἀληθῶς
  choice: thật sự
  rationale: Truyền đạt sự xác tín mạnh mẽ của Phi-e-rơ bằng tiếng Việt hiện đại, tự nhiên.
- source_word: ἐξαπέστειλεν
  choice: đã sai ... đến
  rationale: Diễn tả rõ hành động Chúa phái thiên sứ đến mà không dùng cách nói cứng nhắc.
- source_word: κύριος
  choice: Chúa
  rationale: Giữ nguyên mức độ xác định của κύριος, không tự ý xác quyết danh xưng này ở đây chỉ Đức Chúa Trời hay Chúa Giê-su phục sinh.
- source_word: ἄγγελον
  choice: thiên sứ
  rationale: Ngữ cảnh kể chuyện cho thấy đây là một hữu thể từ trời, không chỉ là sứ giả loài người.
- source_word: ἐξείλατό με
  choice: giải cứu tôi
  rationale: Diễn đạt rõ sự giải thoát khỏi nguy hiểm nhờ sự can thiệp của Chúa.
- source_word: ἐκ χειρὸς Ἡρῴδου
  choice: khỏi tay Hê-rốt
  rationale: Giữ hình ảnh 'tay' của nguyên ngữ; trong tiếng Việt, cụm này tự nhiên và có thể chỉ quyền lực hoặc sự kiểm soát.
- source_word: πάσης τῆς προσδοκίας
  choice: khỏi mọi điều ... mong đợi
  rationale: Chuyển danh từ trừu tượng sang cấu trúc tự nhiên trong tiếng Việt, chỉ toàn bộ kết cục mà dân chúng trông chờ sẽ xảy đến với Phi-e-rơ.
- source_word: τοῦ λαοῦ τῶν Ἰουδαίων
  choice: dân Do Thái
  rationale: Cách gọi tự nhiên, chính xác trong tiếng Việt, tránh lối dịch máy móc 'dân của những người Do Thái'.
theological_decisions:
- issue: Đối tượng mà κύριος chỉ đến
  choice: Chúa
  alternative: Đức Chúa Trời; Chúa Giê-su phục sinh
  rationale: Nguyên văn không nói rõ hơn. Dịch là 'Chúa' bảo toàn sự mơ hồ và sức căng thần học của câu thay vì tự ý phân định.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Phi-e-rơ,” “Hê-rốt,” “thiên sứ” theo lối gọi Kinh Thánh quen thuộc; giữ thành ngữ “khỏi tay” vì vừa sát hình ảnh Hy Lạp vừa tự nhiên trong tiếng Việt.
