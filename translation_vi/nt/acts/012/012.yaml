source:
  edition: SBLGNT
  text: Συνιδών τε ἦλθεν ἐπὶ τὴν οἰκίαν ⸀τῆς Μαρίας τῆς μητρὸς Ἰωάννου τοῦ ἐπικαλουμένου Μάρκου, οὗ ἦσαν ἱκανοὶ συνηθροισμένοι καὶ προσευχόμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/012.yaml
  text: And when he realized this[a], he went to the house of Mary, the mother of John who was called Mark, where many had gathered together and were praying.
translation:
  language: vi
  text: Sau khi hiểu rõ sự việc, ông đi đến nhà bà Ma-ri, mẹ của Giăng, người được gọi là Mác. Tại đó, có nhiều người đã tụ họp và đang cầu nguyện.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Συνιδών
  choice: Sau khi hiểu rõ sự việc
  rationale: Phân từ bất định của συνοράω diễn tả việc Phi-e-rơ nhận thức đầy đủ tình cảnh vừa xảy ra; cách dịch này tự nhiên trong tiếng Việt và lấy đối tượng từ ngữ cảnh.
- source_word: τε
  choice: không dịch thành một từ riêng
  rationale: Đây là liên từ nhẹ nối tiếp mạch kể; quan hệ nối tiếp đã được diễn đạt tự nhiên bằng cấu trúc mở đầu “Sau khi...”.
- source_word: ἦλθεν ἐπὶ τὴν οἰκίαν
  choice: ông đi đến nhà
  rationale: Diễn tả chuyển động hướng tới một địa điểm; “đi đến” phù hợp với điểm nhìn trần thuật.
- source_word: τῆς Μαρίας
  choice: bà Ma-ri
  rationale: Phiên âm tên riêng theo cách dùng Kinh Thánh tiếng Việt quen thuộc; “bà” giúp diễn đạt tự nhiên và trang trọng.
- source_word: τῆς μητρὸς Ἰωάννου
  choice: mẹ của Giăng
  rationale: Giữ rõ quan hệ sở thuộc nhằm xác định Ma-ri nào đang được nói đến.
- source_word: τοῦ ἐπικαλουμένου Μάρκου
  choice: người được gọi là Mác
  rationale: Giữ sát nghĩa phân từ bị động, xác định Giăng bằng một tên khác mà không thêm ý “cũng” vốn không được từ Hy Lạp này bắt buộc.
- source_word: οὗ
  choice: Tại đó
  rationale: Đại từ chỉ nơi chốn quy chiếu về nhà Ma-ri; tách câu giúp tiếng Việt rõ và tự nhiên.
- source_word: ἱκανοὶ
  choice: nhiều người
  rationale: Số nhiều của ἱκανός ở đây chỉ một số lượng đáng kể; “nhiều người” là cách diễn đạt phổ thông, chính xác.
- source_word: συνηθροισμένοι
  choice: đang tụ họp
  rationale: Cấu trúc với ἦσαν và phân từ hoàn thành diễn tả trạng thái họ đã quy tụ và đang ở cùng nhau; “đang tụ họp” ưu tiên trạng thái hiện hữu trong tiếng Việt tự nhiên.
- source_word: καὶ προσευχόμενοι
  choice: và cầu nguyện
  rationale: Diễn tả hoạt động đang tiếp diễn đồng thời với việc họ tụ họp.
theological_decisions: []
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng các dạng tên quen thuộc Ma-ri, Giăng và Mác; đại từ “ông” nối tiếp nhân vật Phi-e-rơ từ ngữ cảnh. Không thêm chú thích vì phương án “người được gọi là Mác” trực tiếp bảo toàn sắc thái của nguyên văn, còn chú thích tiếng Anh được cung cấp dường như không khớp với vị trí dấu chú thích trong câu.
