  source_fidelity: Bản dịch chuyển đạt đúng mệnh đề thời gian Γενομένης δὲ ἡμέρας là “Khi trời sáng”; τάραχος οὐκ ὀλίγος được bảo toàn bằng phép nói giảm “một phen náo động không nhỏ”; và τί ἄρα ὁ Πέτρος ἐγένετο được diễn đạt đúng thành câu hỏi gián tiếp về điều đã xảy ra với Phi-e-rơ. “Trong đám quân lính” phản ánh đầy đủ ἐν τοῖς στρατιώταις, không thu hẹp nghĩa thành lính canh.
