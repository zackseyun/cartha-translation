  terminology: “Quân lính” giữ nghĩa rộng của στρατιώταις; “Phi-e-rơ” nhất quán với lối phiên âm tên riêng Kinh Thánh tiếng Việt. Không có thuật ngữ thần học hoặc tên riêng nào cần điều chỉnh.
