source:
  edition: SBLGNT
  text: Γενομένης δὲ ἡμέρας ἦν τάραχος οὐκ ὀλίγος ἐν τοῖς στρατιώταις, τί ἄρα ὁ Πέτρος ἐγένετο.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/018.yaml
  text: When day came[a], there was no small disturbance among the soldiers over what had become of Peter.
translation:
  language: vi
  text: Khi trời sáng, trong đám quân lính xảy ra một phen náo động không nhỏ về chuyện Phi-e-rơ đã ra sao.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Γενομένης δὲ ἡμέρας
  choice: Khi trời sáng
  rationale: Diễn đạt tự nhiên cấu trúc sở hữu cách tuyệt đối mang ý nghĩa thời gian; δέ đánh dấu bước chuyển trong câu chuyện nhưng không cần thêm một từ nối riêng trong tiếng Việt.
- source_word: τάραχος οὐκ ὀλίγος
  choice: một phen náo động không nhỏ
  rationale: Giữ lối nói giảm bằng phủ định οὐκ ὀλίγος, đồng thời dùng cách diễn đạt tự nhiên để chỉ một vụ náo động đáng kể.
- source_word: ἐν τοῖς στρατιώταις
  choice: trong đám quân lính
  rationale: Giữ nghĩa rộng của στρατιώταις là quân lính và thể hiện ἐν là phạm vi nơi sự náo động xảy ra, không thu hẹp thành 'lính canh' dù ngữ cảnh cho thấy họ đang làm nhiệm vụ canh giữ.
- source_word: τί ἄρα ὁ Πέτρος ἐγένετο
  choice: về chuyện Phi-e-rơ đã ra sao
  rationale: Chuyển thành câu hỏi gián tiếp tự nhiên trong tiếng Việt, giữ sắc thái bối rối, suy đoán của ἄρα và nghĩa thành ngữ của ἐγένετο khi nói về một người.
- source_word: ὁ Πέτρος
  choice: Phi-e-rơ
  rationale: Dùng dạng phiên âm tên riêng quen thuộc trong văn phong Kinh Thánh tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cụm 'không nhỏ' chủ ý giữ phép nói giảm của nguyên văn; 'một phen náo động' tránh lối danh từ hóa nặng nề nhưng vẫn bảo toàn hình ảnh về một sự xôn xao đáng kể trong quân lính.
