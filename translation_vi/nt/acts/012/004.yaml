id: ACT.12.4
reference: Acts 12:4
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὃν καὶ πιάσας ἔθετο εἰς φυλακήν, παραδοὺς τέσσαρσιν τετραδίοις στρατιωτῶν φυλάσσειν αὐτόν, βουλόμενος μετὰ τὸ πάσχα ἀναγαγεῖν αὐτὸν τῷ λαῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/004.yaml
  text: After arresting him[a], he put him in prison, handing him over to four squads of soldiers to guard him[b], intending to bring him out to the people after the Passover.
translation:
  language: vi
  text: Sau khi bắt ông, vua Hê-rốt giam ông vào tù và giao ông cho bốn toán lính canh giữ ông[a], định sau lễ Vượt Qua sẽ đưa ông ra trước dân chúng.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “bốn nhóm, mỗi nhóm bốn lính,” tức tổng cộng mười sáu lính.'
    reason: lexical_alternative
  - marker: b
    text: Hy Lạp πάσχα nghĩa là “lễ Vượt Qua”; một số bản dịch theo truyền thống cũ dịch là “lễ Phục Sinh.”
    reason: alternative_reading
lexical_decisions:
- source_word: πιάσας
  choice: sau khi bắt ông
  rationale: Phân từ bất định diễn tả hành động xảy ra trước động từ chính; cách dịch này tự nhiên và giữ nghĩa bắt giữ.
- source_word: ἔθετο εἰς φυλακήν
  choice: giam ông vào tù
  rationale: Diễn đạt thành ngữ về việc bỏ tù bằng tiếng Việt hiện đại, gọn và đúng văn cảnh.
- source_word: παραδοὺς
  choice: giao cho
  rationale: Giữ ý chuyển người bị bắt sang sự quản thúc của binh lính.
- source_word: τέσσαρσιν τετραδίοις στρατιωτῶν
  choice: bốn toán lính
  rationale: τετράδιον là một nhóm bốn người; câu nói đến bốn nhóm như vậy. Bản văn chính dùng cách gọi tự nhiên, còn quân số chính xác được nêu trong chú thích.
- source_word: φυλάσσειν αὐτόν
  choice: canh giữ
  rationale: Thể hiện rõ mục đích của việc giao ông cho các toán lính.
- source_word: βουλόμενος
  choice: định
  rationale: Diễn tả chủ ý đã có của Hê-rốt mà không thêm sắc thái cảm xúc.
- source_word: μετὰ τὸ πάσχα
  choice: sau lễ Vượt Qua
  rationale: πάσχα chỉ lễ Vượt Qua của người Do Thái; đây là cách dịch trực tiếp và quen thuộc trong tiếng Việt.
- source_word: ἀναγαγεῖν αὐτὸν τῷ λαῷ
  choice: đưa ông ra trước dân chúng
  rationale: Truyền đạt việc đưa Phi-e-rơ ra công khai cho dân chúng, nhưng không xác quyết thêm rằng đây là một phiên tòa chính thức.
- source_word: λαῷ
  choice: dân chúng
  rationale: Phù hợp với ý một tập thể dân chúng trong bối cảnh công khai.
theological_decisions:
- issue: Cách dịch πάσχα
  choice: lễ Vượt Qua
  alternative: lễ Phục Sinh
  rationale: Nghĩa trực tiếp của πάσχα trong bối cảnh này là lễ Vượt Qua của người Do Thái. Cách dịch “lễ Phục Sinh” thuộc một truyền thống dịch thuật về sau và không phản ánh nghĩa từ vựng rõ nhất tại đây.
- issue: Tính chất của việc đưa Phi-e-rơ ra cho dân chúng
  choice: đưa ông ra trước dân chúng
  alternative: đưa ông ra xét xử trước dân chúng
  rationale: Nguyên văn không nói rõ về một phiên xét xử; bản dịch tránh bổ sung một thủ tục pháp lý không được nêu.
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại. Chủ ngữ “vua Hê-rốt” được nêu lại theo ngữ cảnh để câu đứng riêng vẫn rõ nghĩa; “ông” chỉ Phi-e-rơ. Các dấu chú thích [a], [b] đều xuất hiện trong bản văn chính.
