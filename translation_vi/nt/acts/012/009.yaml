  source_fidelity: 'Bản dịch truyền đạt đúng chuỗi hành động và nhận thức trong nguyên văn: Phi-e-rơ ra ngoài, theo thiên sứ, không nhận ra điều thiên sứ đang làm là sự việc có thật, nhưng tưởng mình đang thấy một khải tượng. “Qua thiên sứ” bảo lưu được sắc thái διά + sở hữu cách (tác nhân/trung gian) mà không diễn giải thêm.'
