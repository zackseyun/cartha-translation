id: ACT.12.9
reference: Acts 12:9
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἐξελθὼν ⸀ἠκολούθει, καὶ οὐκ ᾔδει ὅτι ἀληθές ἐστιν τὸ γινόμενον διὰ τοῦ ἀγγέλου, ἐδόκει δὲ ὅραμα βλέπειν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/009.yaml
  text: And he went out and followed[a], and he did not know that what was happening through the angel was real, but thought he was seeing a vision.
translation:
  language: vi
  text: Phi-e-rơ đi ra và theo thiên sứ. Ông không biết điều đang xảy ra qua thiên sứ là có thật, mà cứ tưởng mình đang thấy một khải tượng.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξελθὼν
  choice: đi ra
  rationale: Phân từ bất định diễn tả hành động đi trước động từ chính; chuyển thành động từ hữu hạn phối hợp giúp câu tiếng Việt tự nhiên mà vẫn giữ đúng trình tự.
- source_word: ἠκολούθει
  choice: theo thiên sứ
  rationale: Thì chưa hoàn thành diễn tả hành động đang tiếp diễn. Trong tiếng Việt, “theo” tự nhiên; bổ sung đối tượng hàm ẩn từ ngữ cảnh để câu rõ nghĩa.
- source_word: οὐκ ᾔδει
  choice: không biết
  rationale: Cách diễn đạt trực tiếp, thông dụng cho trạng thái không nhận biết thực chất của sự việc.
- source_word: ἀληθές
  choice: có thật
  rationale: Trong thế đối lập với khải tượng, cụm này diễn đạt tính hiện thực của biến cố tự nhiên hơn “chân thật”.
- source_word: τὸ γινόμενον
  choice: điều đang xảy ra
  rationale: Giữ sắc thái tiến diễn của phân từ hiện tại có mạo từ và dùng lối nói hiện đại, dễ hiểu.
- source_word: διὰ τοῦ ἀγγέλου
  choice: qua thiên sứ
  rationale: Giữ sắc thái trung gian hoặc tác nhân của διά với sở hữu cách, không xác quyết quá mức về tính độc lập của tác nhân.
- source_word: ἐδόκει
  choice: cứ tưởng
  rationale: Diễn đạt tự nhiên nhận định sai đang kéo dài của Phi-e-rơ; “cứ” phù hợp sắc thái chưa hoàn thành.
- source_word: ὅραμα
  choice: một khải tượng
  rationale: “Khải tượng” là thuật ngữ tiếng Việt trang trọng nhưng quen thuộc cho một cảnh tượng được thấy trong trải nghiệm siêu nhiên.
- source_word: βλέπειν
  choice: mình đang thấy
  rationale: Kết hợp với ἐδόκει để diễn tả điều Phi-e-rơ cho rằng chính mình đang trải nghiệm; “đang” làm rõ sắc thái diễn tiến.
theological_decisions:
- issue: Bản chất hành động của thiên sứ
  choice: qua thiên sứ
  alternative: do thiên sứ
  rationale: “Qua thiên sứ” bảo toàn khả năng chỉ tác nhân trung gian của διά với sở hữu cách, không đưa thêm kết luận thần học về quyền năng độc lập của thiên sứ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Phi-e-rơ” và “thiên sứ” theo lối gọi Kinh Thánh phổ biến; “khải tượng” phân biệt trải nghiệm thị kiến với sự việc có thật. Không cần chú thích vì phương án “qua thiên sứ” trực tiếp bảo toàn sắc thái của nguyên văn.
