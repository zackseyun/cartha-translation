  terminology: “Phi-e-rơ,” “thiên sứ,” và “khải tượng” đều nhất quán với văn phong Kinh Thánh tiếng Việt trang trọng, đồng thời vẫn dễ hiểu. “Có thật” phù hợp với sự đối lập giữa thực tại và khải tượng.
