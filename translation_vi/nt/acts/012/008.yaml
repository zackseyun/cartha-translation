id: ACT.12.8
reference: Acts 12:8
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἶπεν ⸀δὲ ὁ ἄγγελος πρὸς αὐτόν· ⸀Ζῶσαι καὶ ὑπόδησαι τὰ σανδάλιά σου· ἐποίησεν δὲ οὕτως. καὶ λέγει αὐτῷ· Περιβαλοῦ τὸ ἱμάτιόν σου καὶ ἀκολούθει μοι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/008.yaml
  text: And the angel said to him[a], “Tie on your belt and put on your sandals.” And he did so. And he says to him[c][b], “Put on your cloak and follow me.”
translation:
  language: vi
  text: 'Thiên sứ nói với ông: “Hãy thắt đai[a] và mang dép vào.” Ông làm theo. Rồi thiên sứ nói[b] với ông: “Hãy khoác áo choàng[c] và đi theo ta.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Hãy thắt lưng cho gọn.” Mệnh lệnh Hy Lạp nói đến việc thắt đai để sẵn sàng lên đường.'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn Hy Lạp dùng thì hiện tại: “nói”; đây là hiện tại lịch sử, làm lời kể thêm sống động.'
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “Hãy choàng áo ngoài quanh người.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄγγελος
  choice: thiên sứ
  rationale: Trong mạch truyện Công Vụ 12, nhân vật này là một hữu thể từ trời xuất hiện trong nhà tù; “thiên sứ” tự nhiên và chính xác hơn nghĩa khái quát “sứ giả”.
- source_word: Ζῶσαι
  choice: hãy thắt đai
  rationale: Mệnh lệnh trung cách của ζώννυμι chỉ việc thắt đai quanh người để chuẩn bị hành động. “Thắt đai” cụ thể, gọn và dễ hiểu trong tiếng Việt hiện đại.
- source_word: ὑπόδησαι τὰ σανδάλιά σου
  choice: mang dép vào
  rationale: Cụm từ chỉ hành động xỏ hoặc mang dép. “Mang dép vào” là cách diễn đạt tự nhiên trong tiếng Việt và giữ rõ đối tượng σανδάλια.
- source_word: ἐποίησεν δὲ οὕτως
  choice: ông làm theo
  rationale: οὕτως tóm lược việc Phi-e-rơ thực hiện các mệnh lệnh vừa nhận. “Làm theo” tự nhiên hơn lối dịch sát chữ “làm như vậy” trong ngữ cảnh này.
- source_word: λέγει
  choice: nói
  rationale: Động từ hiện tại là hiện tại lịch sử, tạo nét sống động trong lời kể. Tiếng Việt không biến đổi thì động từ, nên “nói” vừa tự nhiên vừa không xóa đặc điểm ấy; chú thích nêu rõ hình thái Hy Lạp.
- source_word: Περιβαλοῦ τὸ ἱμάτιόν σου
  choice: hãy khoác áo choàng
  rationale: ἱμάτιον ở đây là áo ngoài hay áo choàng, còn περιβάλλω diễn tả việc choàng hoặc khoác nó quanh người. “Khoác áo choàng” ngắn gọn, tự nhiên và giữ được cả loại trang phục lẫn động tác.
- source_word: ἀκολούθει μοι
  choice: đi theo ta
  rationale: ἀκολουθέω có nghĩa thông thường là đi theo. Thêm “đi” làm rõ đây là mệnh lệnh di chuyển thực tế mà vẫn giữ mô-típ “theo” trong Tân Ước; “ta” phù hợp lời của thiên sứ với Phi-e-rơ mà không mang sắc thái thô.
theological_decisions: []
translation_notes:
  register: Bản dịch dùng tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Đại từ “ông” giữ sự tôn trọng đối với Phi-e-rơ; “ta” trong lời thiên sứ thể hiện quan hệ mệnh lệnh trong ngữ cảnh mà không thêm hàm ý thần học. Nhịp câu ngắn được giữ để phản ánh tính khẩn cấp của cảnh giải cứu.
