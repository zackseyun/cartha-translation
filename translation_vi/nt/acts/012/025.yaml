id: ACT.12.25
reference: Acts 12:25
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Βαρναβᾶς δὲ καὶ Σαῦλος ὑπέστρεψαν, ⸀εἰς Ἰερουσαλὴμ πληρώσαντες τὴν διακονίαν, ⸀συμπαραλαβόντες Ἰωάννην τὸν ἐπικληθέντα Μᾶρκον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/025.yaml
  text: But Barnabas and Saul returned to Jerusalem after completing the ministry, taking along John, who was called Mark.
translation:
  language: vi
  text: Còn Ba-na-ba và Sau-lơ, sau khi hoàn tất công việc phục vụ, đã trở về Giê-ru-sa-lem[a] và đem theo Giăng, người được gọi là Mác.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Một số bản chép tay đọc: “từ Giê-ru-sa-lem” thay vì “về Giê-ru-sa-lem.”'
    reason: textual_variant
lexical_decisions:
- source_word: ὑπέστρεψαν
  choice: đã trở về
  rationale: Động từ ὑποστρέφω ở thì aorist mang nghĩa trở lại hoặc trở về; cách dịch này tự nhiên và giữ rõ hành động đã xảy ra.
- source_word: εἰς Ἰερουσαλήμ
  choice: về Giê-ru-sa-lem
  rationale: Giới từ εἰς thông thường chỉ hướng đến một nơi. Trong tiếng Việt, “trở về Giê-ru-sa-lem” diễn đạt tự nhiên ý “trở lại đến Giê-ru-sa-lem” của bản SBLGNT được cung cấp.
- source_word: πληρώσαντες τὴν διακονίαν
  choice: sau khi hoàn tất công việc phục vụ
  rationale: Phân từ πληρώσαντες chỉ hành động hoàn thành trước hành động chính; διακονία có nghĩa rộng là sự phục vụ hay công tác phục vụ. Cách dịch này không thu hẹp thành riêng việc cứu trợ, dù văn cảnh có liên quan đến hoạt động ấy.
- source_word: συμπαραλαβόντες
  choice: đem theo
  rationale: Từ này diễn tả việc đưa một người cùng đi với mình; “đem theo” ngắn gọn và tự nhiên trong tiếng Việt.
- source_word: ἐπικληθέντα Μᾶρκον
  choice: người được gọi là Mác
  rationale: Dạng bị động của ἐπικαλέω ở đây cho biết tên gọi. Bản dịch không tự thêm ý “cũng” vốn không được nêu tường minh trong tiếng Hy Lạp.
theological_decisions:
- issue: Dị bản về hướng di chuyển liên quan đến Giê-ru-sa-lem
  choice: về Giê-ru-sa-lem
  alternative: từ Giê-ru-sa-lem trở về
  rationale: Bản SBLGNT được cung cấp đọc εἰς Ἰερουσαλήμ, nghĩa là “đến/về Giê-ru-sa-lem”, nên phần chính dịch trực tiếp theo bản văn ấy. Dị bản ἐξ Ἰερουσαλήμ, nghĩa là “từ Giê-ru-sa-lem”, làm thay đổi hướng di chuyển và được ghi ở chú thích thay vì bị âm thầm hòa giải theo văn cảnh.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. Dùng “công việc phục vụ” để giữ nghĩa rộng của διακονία và tránh biến từ này thành một chức danh giáo hội. Tên riêng được phiên âm theo lối quen thuộc trong các bản Kinh Thánh tiếng Việt.
