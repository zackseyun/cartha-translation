    issue: “cửa ngoài” không nêu rõ cửa thuộc cổng/lối vào.
    rationale: θύραν τοῦ πυλῶνος gồm cả “cửa” và “cổng/gateway”; “cửa cổng” bảo toàn rõ hơn bối cảnh kiến trúc.
  - severity: medium
    issue: “nghe xem ai gọi” thêm ý “ai gọi”.
    rationale: ὑπακοῦσαι trong ngữ cảnh này là đến đáp/nghe tiếng gõ cửa, không nói có ai gọi hay cô đi xác định người gọi.
  - severity: low
    issue: Tên riêng “Rô-đơ” không phản ánh sát nguyên ngữ.
    rationale: Ῥόδη có nguyên âm cuối eta; “Rô-đê” là cách chuyển tự Việt ngữ sát hơn.
  revised_text: Khi ông gõ cửa cổng, một cô hầu gái tên là Rô-đê ra nghe.[a]
