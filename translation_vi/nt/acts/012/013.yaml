  source_fidelity: Bản thảo diễn đạt đúng mạch chính, nhưng “cửa ngoài” làm mờ cụm θύραν τοῦ πυλῶνος, là cánh cửa thuộc cổng/lối cổng. “Nghe xem ai gọi” thêm chi tiết “ai gọi” không có trong nguyên văn; ngữ cảnh là tiếng gõ cửa. “Ra nghe” diễn đạt tự nhiên hơn hành động đến đáp lại tiếng gõ, mà không khẳng định cô đã mở cửa.
  naturalness: “Khi ông gõ cửa cổng, một cô hầu gái tên là Rô-đê ra nghe” là lối kể tự nhiên, hiện đại và trang trọng vừa phải. “Cô hầu gái” rõ nghĩa hơn “tớ gái” trong tiếng Việt hiện nay.
  terminology: Rô-đê phản ánh trực tiếp tên Hy Lạp Ῥόδη (Rhode), tránh hình thức Rô-đơ chịu ảnh hưởng cách đọc tiếng Anh. Chú thích giữ khả năng nghĩa “nữ nô lệ” của παιδίσκη mà không áp đặt địa vị pháp lý trong bản văn chính.
  issues:
