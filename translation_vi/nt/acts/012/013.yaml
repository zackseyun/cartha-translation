  text: κρούσαντος δὲ ⸀αὐτοῦ τὴν θύραν τοῦ πυλῶνος προσῆλθε παιδίσκη ὑπακοῦσαι ὀνόματι Ῥόδη,
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/013.yaml
  text: When he knocked at the door of the gateway[a], a servant girl named Rhoda came to answer.
translation:
  language: vi
  text: Khi ông gõ cửa cổng, một cô hầu gái tên là Rô-đê ra nghe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “một nữ nô lệ”. Từ Hy Lạp παιδίσκη có thể chỉ một cô hầu gái trẻ hoặc một nữ nô lệ; ở đây dịch là “cô hầu gái” vì câu chuyện nhấn mạnh vai trò của cô trong gia đình hơn là địa vị pháp lý.
    reason: lexical_alternative
lexical_decisions:
- source_word: κρούσαντος δὲ αὐτοῦ
  choice: Khi ông gõ
  rationale: Phân từ bất định quá khứ cùng δέ chuyển sang hành động kế tiếp; “Khi ông gõ” diễn đạt tự nhiên quan hệ thời gian trong mạch kể.
- source_word: τὴν θύραν τοῦ πυλῶνος
  choice: cửa ngoài
  rationale: Cụm từ chỉ cánh cửa thuộc lối vào hoặc cổng của ngôi nhà. “Cửa ngoài” tự nhiên trong tiếng Việt và phù hợp bối cảnh, dù không biểu đạt tách biệt cả hai danh từ Hy Lạp.
- source_word: προσῆλθε
  choice: đến
  rationale: προσέρχομαι có nghĩa là đến hoặc tiến lại gần; “đến” phù hợp văn cảnh trong nhà.
- source_word: παιδίσκη
  choice: tớ gái
  rationale: παιδίσκη có thể chỉ nữ đầy tớ trẻ hoặc nữ nô lệ. “Tớ gái” ngắn gọn, dễ hiểu và giữ sắc thái địa vị phục dịch; khả năng chỉ nữ nô lệ được ghi ở chú thích.
- source_word: ὑπακοῦσαι
  choice: nghe xem ai gọi
  rationale: Trong tình huống có người gõ cửa, ὑπακούω mang nghĩa đến nghe và đáp lời. Cách dịch này tự nhiên trong tiếng Việt, không hàm ý cô đã mở cửa.
- source_word: ὀνόματι Ῥόδη
  choice: tên là Rô-đơ
  rationale: ὀνόματι giới thiệu tên riêng. “Rô-đơ” phiên âm tên Hy Lạp Ῥόδη theo cách dễ đọc trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “ông” để tiếp nối nhân vật nam đã nêu trong văn cảnh; “nghe xem ai gọi” là thành ngữ tình huống, diễn tả việc đáp lại tiếng gõ mà không ngụ ý mở cửa.
