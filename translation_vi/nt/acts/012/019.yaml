  text: Ἡρῴδης δὲ ἐπιζητήσας αὐτὸν καὶ μὴ εὑρὼν ἀνακρίνας τοὺς φύλακας ἐκέλευσεν ἀπαχθῆναι, καὶ κατελθὼν ἀπὸ τῆς Ἰουδαίας ⸀εἰς Καισάρειαν διέτριβεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/019.yaml
  text: But Herod[a], after searching for him and not finding him, examined the guards and ordered them to be led away to execution. Then he went down from Judea to Caesarea and stayed there.
translation:
  language: vi
  text: Nhưng sau khi cho tìm Phi-e-rơ mà không thấy, Hê-rốt tra hỏi những lính canh rồi ra lệnh giải họ đi hành quyết.[a] Sau đó, ông rời Giu-đê, đi xuống Sê-sa-rê và ở lại đó.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “ra lệnh cho họ bị dẫn đi.” Trong bối cảnh này, rất có thể họ bị dẫn đi để xử tử.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιζητήσας αὐτὸν καὶ μὴ εὑρὼν
  choice: cho tìm Phi-e-rơ mà không thấy
  rationale: Hai phân từ bất định diễn tả các hành động xảy ra trước việc tra hỏi. Đại từ αὐτόν được diễn đạt bằng tên Phi-e-rơ để câu tiếng Việt rõ và tự nhiên.
- source_word: ἀνακρίνας
  choice: tra hỏi
  rationale: Động từ mang sắc thái điều tra hoặc thẩm vấn chính thức; “tra hỏi” phù hợp với việc Hê-rốt điều tra những lính canh.
- source_word: τοὺς φύλακας
  choice: những lính canh
  rationale: Chỉ những người lính được giao nhiệm vụ canh giữ Phi-e-rơ; cách gọi này rõ nghĩa trong tiếng Việt hiện đại.
- source_word: ἐκέλευσεν ἀπαχθῆναι
  choice: ra lệnh dẫn họ đi xử tử
  rationale: Nghĩa sát là ra lệnh cho họ bị dẫn đi; trong ngữ cảnh pháp lý này, cụm từ rất có thể hàm ý dẫn đi hành quyết. Bản dịch nêu rõ ý theo ngữ cảnh nhưng giữ nghĩa sát trong chú thích.
- source_word: κατελθὼν ἀπὸ τῆς Ἰουδαίας εἰς Καισάρειαν
  choice: từ Giu-đê xuống Sê-sa-rê
  rationale: Giữ hình ảnh địa lý “xuống” khi đi từ miền nội địa Giu-đê đến thành phố ven biển Sê-sa-rê.
- source_word: διέτριβεν
  choice: ở lại đó
  rationale: Thì chưa hoàn thành biểu thị việc lưu lại trong một khoảng thời gian; “ở lại đó” tự nhiên và giữ được tính kéo dài.
theological_decisions:
- issue: Có nên nói rõ hình phạt hàm ý trong ἀπαχθῆναι hay chỉ dịch sát là “bị dẫn đi”
  choice: ra lệnh dẫn họ đi xử tử
  alternative: ra lệnh dẫn họ đi
  rationale: Bản Hy Lạp không dùng trực tiếp một động từ nghĩa là giết, nên vẫn có độ hàm ẩn. Tuy nhiên, trong bối cảnh những lính canh để tù nhân trốn thoát bị nhà vua xét hỏi, việc bị dẫn đi rất có thể là để hành quyết. Chú thích bảo toàn cách diễn đạt sát nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng các địa danh quen thuộc “Giu-đê” và “Sê-sa-rê”; thêm “vua” ở mệnh đề sau để tránh đại từ mơ hồ và nhắc lại vai trò của Hê-rốt.
