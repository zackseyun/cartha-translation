revisions:
- from: Nhưng Hê-rốt cho tìm Phi-e-rơ mà không thấy, nên tra hỏi những lính canh rồi ra lệnh dẫn họ đi xử tử.[a] Sau đó, vua từ Giu-đê xuống Sê-sa-rê và ở lại đó.
  to: Nhưng sau khi cho tìm Phi-e-rơ mà không thấy, Hê-rốt tra hỏi những lính canh rồi ra lệnh giải họ đi hành quyết.[a] Sau đó, ông rời Giu-đê, đi xuống Sê-sa-rê và ở lại đó.
  rationale: Bản sửa giữ trật tự và sắc thái của các phân từ Hy Lạp mà không thêm quan hệ nhân quả. Câu về hành trình nay diễn đạt đầy đủ động từ “đi xuống”, và đại từ “ông” quy chiếu rõ Hê-rốt mà không thêm danh xưng. “Giải họ đi hành quyết” chuyển tải hàm ý ngữ cảnh của ἀπαχθῆναι; chú thích giữ nghĩa sát và thể bị động của nguyên văn.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T09:18:12Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch phản ánh đúng trình tự chính: Hê-rốt tìm Phi-e-rơ không được, thẩm vấn lính canh, ra lệnh liên quan đến việc họ bị dẫn đi, rồi từ Giu-đê xuống Sê-sa-rê và lưu lại. Tuy nhiên, từ “nên” tạo quan hệ nguyên nhân–kết quả không được biểu thị rõ bởi hai phân từ phối hợp trong tiếng Hy Lạp. Cụm “vua từ Giu-đê xuống” cũng thiếu động từ di chuyển rõ ràng. Cách làm rõ việc hành quyết là hợp lý trong ngữ cảnh, miễn là chú thích giữ cách diễn đạt nguyên văn.'
  naturalness: Cần thay “mà không thấy, nên tra hỏi” bằng cấu trúc tuần tự tự nhiên hơn, như “sau khi ... mà không thấy, ông tra hỏi”. “Sau đó, vua từ Giu-đê xuống Sê-sa-rê” nên viết lại thành một câu có động từ đầy đủ. “Ra lệnh giải họ đi hành quyết” là lối nói tự nhiên và trang trọng trong ngữ cảnh pháp lý–lịch sử.
  terminology: '“Hê-rốt”, “Phi-e-rơ”, “Giu-đê”, “Sê-sa-rê” và “lính canh” phù hợp với tiếng Việt hiện đại và nhất quán. Không cần thêm danh xưng “vua”, vì danh xưng này không có trong câu Hy Lạp, dù phù hợp về lịch sử. Chú thích nên phản ánh thể bị động của ἀπαχθῆναι: “ra lệnh cho họ bị dẫn đi.”'
  issues:
  - severity: medium
    issue: “nên” thêm quan hệ nhân quả
    rationale: ἐπιζητήσας ... καὶ μὴ εὑρών là hai phân từ mô tả các hành động có trước việc thẩm vấn; văn bản không nêu rõ rằng việc không tìm thấy là quan hệ nhân quả được đánh dấu bằng “nên”.
  - severity: low
    issue: Mệnh đề di chuyển thiếu động từ rõ ràng
    rationale: “Sau đó, vua từ Giu-đê xuống Sê-sa-rê” chưa diễn đạt trọn vẹn động từ κατελθών. Cần nêu rõ “đi xuống” hoặc “rời ... đi xuống”.
  - severity: low
    issue: Chú thích nguyên văn chưa bảo toàn rõ thể bị động
    rationale: ἀπαχθῆναι nghĩa đen là “bị dẫn đi/được giải đi”. “Ra lệnh dẫn họ đi” dễ khiến tiếng Việt hiểu chủ thể ngầm trực tiếp dẫn họ đi; “ra lệnh cho họ bị dẫn đi” sát cấu trúc hơn.
