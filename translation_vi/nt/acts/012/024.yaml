  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ὁ δὲ λόγος τοῦ ⸀θεοῦ ηὔξανεν καὶ ἐπληθύνετο.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/024.yaml
  text: But the word of God continued to grow and multiply[a].
translation:
  language: vi
  text: Nhưng lời Đức Chúa Trời cứ tăng trưởng và lan rộng[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “sứ điệp của Đức Chúa Trời cứ tăng trưởng và lan rộng.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: λόγος
  choice: lời
  rationale: Giữ cách diễn đạt quen thuộc trong Lu-ca là “lời Đức Chúa Trời”, đồng thời bao hàm lời được công bố và sứ điệp đến từ Đức Chúa Trời; “sứ điệp” là một cách dịch rõ nghĩa hơn nhưng hẹp hơn.
- source_word: τοῦ θεοῦ
  choice: Đức Chúa Trời
  rationale: Cụm sở hữu được diễn đạt tự nhiên trong tiếng Việt là “lời Đức Chúa Trời”, chỉ lời thuộc về hoặc đến từ Ngài.
- source_word: ηὔξανεν
  choice: cứ tăng trưởng
  rationale: Thể chưa hoàn thành diễn tả tiến trình đang tiếp diễn; “cứ” thể hiện sắc thái liên tục ấy, còn “tăng trưởng” giữ hình ảnh phát triển của nguyên văn.
- source_word: ἐπληθύνετο
  choice: lan rộng
  rationale: Trong ngữ cảnh nói về lời được truyền bá ngày càng rộng, “lan rộng” là cách diễn đạt tự nhiên và phân biệt với động từ “tăng trưởng” đứng trước; nguyên văn có nghĩa đen gần với “gia tăng/nhân lên”.
- source_word: δὲ
  choice: Nhưng
  rationale: 'Đánh dấu sự tương phản trong mạch kể: Hê-rốt bị diệt, nhưng lời Đức Chúa Trời vẫn tiếp tục phát triển.'
theological_decisions:
- issue: Nên dịch λόγος τοῦ θεοῦ theo lối truyền thống là “lời Đức Chúa Trời” hay theo nghĩa tường minh là “sứ điệp của Đức Chúa Trời”
  choice: lời Đức Chúa Trời
  alternative: sứ điệp của Đức Chúa Trời
  rationale: “Lời Đức Chúa Trời” bảo tồn cách nói lặp lại trong sách Công Vụ và không giới hạn λόγος chỉ vào nội dung của một thông điệp; chú thích ghi nhận cách hiểu tường minh theo ngữ cảnh công bố.
- issue: Hình ảnh “lời” tăng trưởng và gia tăng nên được giữ theo nghĩa đen hay diễn đạt theo sự truyền bá
  choice: tăng trưởng và lan rộng
  alternative: lớn lên và gia tăng
  rationale: Cách chọn giữ hai chuyển động song song của nguyên văn nhưng diễn đạt tự nhiên rằng lời được truyền bá và gây ảnh hưởng ngày càng rộng, không chuyển chủ thể thành số tín hữu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Cứ” diễn tả tiến trình liên tục của hai động từ ở thể chưa hoàn thành; “lan rộng” tránh cách nói thiếu tự nhiên “nhân lên” khi chủ thể là “lời”, nhưng vẫn giữ ý sự gia tăng và phổ biến.
