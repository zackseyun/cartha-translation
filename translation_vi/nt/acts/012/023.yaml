  terminology: “Thiên sứ,” “Chúa,” và “Đức Chúa Trời” được dùng nhất quán và phù hợp với register bản dịch. “Dâng vinh quang cho Đức Chúa Trời” chuyển tải đúng ý quy sự tôn vinh về cho Đức Chúa Trời.
