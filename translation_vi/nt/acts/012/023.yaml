  source_fidelity: Bản dịch truyền đạt đúng hành động phán xét, nguyên nhân (không dành vinh quang cho Đức Chúa Trời) và cái chết. Tuy nhiên, “giòi” là nghĩa hẹp hơn σκώληξ/σκωληκόβρωτος, vốn chỉ việc bị sâu bọ/worms ăn; nên dùng cách gọi rộng hơn. Cách nối “Rồi” có thể gợi một trình tự thời gian xác định hơn mức phân từ γενόμενος đòi hỏi.
