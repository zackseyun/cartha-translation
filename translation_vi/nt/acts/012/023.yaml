- from: Ngay lập tức, một thiên sứ của Chúa đánh ông, vì ông đã không dâng vinh quang cho Đức Chúa Trời[a]. Rồi ông bị giòi ăn[b] và chết[c].
  to: Ngay lập tức, một thiên sứ của Chúa đánh ông, vì ông không dâng vinh quang cho Đức Chúa Trời[a]; ông bị sâu bọ ăn[b] và chết[c].
  rationale: Đổi “giòi” thành “sâu bọ” để không thu hẹp nghĩa của σκωληκόβρωτος; bỏ “Rồi” để không áp đặt trình tự thời gian cụ thể hơn nguyên bản; và chuẩn hóa chú thích c. Các yếu tố còn lại của bản dịch được giữ nguyên về nghĩa.
