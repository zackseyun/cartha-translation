id: ACT.12.23
reference: Acts 12:23
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: παραχρῆμα δὲ ἐπάταξεν αὐτὸν ἄγγελος κυρίου ἀνθ’ ὧν οὐκ ἔδωκεν ⸀τὴν δόξαν τῷ θεῷ, καὶ γενόμενος σκωληκόβρωτος ἐξέψυξεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/023.yaml
  text: Immediately an angel of the Lord struck him[a], because he did not give the glory to God, and becoming worm-eaten[c][b], he died.
translation:
  language: vi
  text: Ngay lập tức, một thiên sứ của Chúa đánh ông, vì ông không dâng vinh quang cho Đức Chúa Trời[a]; ông bị sâu bọ ăn[b] và chết[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “không quy vinh quang về cho Đức Chúa Trời.”'
    reason: lexical_alternative
  - marker: b
    text: 'Hay: “bị giòi ăn.”'
    reason: lexical_alternative
  - marker: c
    text: 'Hay: “tắt thở.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: παραχρῆμα
  choice: Ngay lập tức
  rationale: Diễn đạt hành động xảy ra không chậm trễ và giữ được tính đột ngột của sự phán xét.
- source_word: ἐπάταξεν
  choice: đánh
  rationale: Giữ nghĩa cơ bản là đánh hoặc giáng vào, không thêm ý 'đánh chết' vì cái chết được nêu riêng ở cuối câu.
- source_word: ἄγγελος κυρίου
  choice: một thiên sứ của Chúa
  rationale: Danh từ ἄγγελος không có mạo từ; cách dịch bất định phù hợp ngữ cảnh và không đồng nhất nhân vật này với một thiên sứ cụ thể.
- source_word: ἀνθ’ ὧν
  choice: vì
  rationale: Thành ngữ nêu nguyên nhân của sự phán xét; 'vì' rõ ràng và tự nhiên trong tiếng Việt.
- source_word: ἔδωκεν τὴν δόξαν τῷ θεῷ
  choice: dâng vinh quang cho Đức Chúa Trời
  rationale: Diễn đạt việc quy sự tôn vinh đáng thuộc về Đức Chúa Trời cho Ngài; 'dâng vinh quang' tự nhiên và trang trọng trong tiếng Việt.
- source_word: γενόμενος σκωληκόβρωτος
  choice: Rồi ông bị giòi ăn
  rationale: Truyền đạt hình ảnh rõ nét của tính từ 'bị sâu/giòi ăn' cùng diễn tiến của phân từ, nhưng không áp đặt một trình tự y khoa quá chi tiết.
- source_word: ἐξέψυξεν
  choice: chết
  rationale: '''Chết'' là cách diễn đạt trực tiếp, tự nhiên cho động từ chỉ việc trút hơi thở cuối cùng; phương án sát hình ảnh hơn được ghi ở chú thích.'
theological_decisions:
- issue: Bản chất và diễn tiến của sự phán xét
  choice: Câu văn trình bày cái chết của Hê-rốt là sự phán xét từ Đức Chúa Trời, được thực hiện qua một thiên sứ, vì ông không dâng vinh quang cho Đức Chúa Trời.
  alternative: Hiểu đây chỉ là một cái chết tự nhiên được mô tả bằng ngôn ngữ tôn giáo, hoặc cho rằng ông chết ngay đúng khoảnh khắc thiên sứ đánh.
  rationale: Bản văn minh nhiên quy hành động đánh cho một thiên sứ của Chúa và nêu nguyên nhân. Tuy nhiên, cấu trúc phân từ theo sau bởi động từ 'chết' không cho phép xác định chi tiết y khoa hay khoảng thời gian chính xác, nên bản dịch giữ nguyên độ mở ấy.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “thiên sứ” cho ἄγγελος, “Đức Chúa Trời” cho θεός và “Chúa” cho κύριος. Các vế được tách thành hai câu để lời văn tự nhiên, trong khi vẫn giữ quan hệ nguyên nhân và diễn tiến của nguyên bản.
