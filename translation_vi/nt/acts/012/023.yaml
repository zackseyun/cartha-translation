  - severity: low
    issue: “Rồi” dễ diễn giải quá rõ quan hệ thời gian của phân từ γενόμενος.
    rationale: Phân từ cho biết tình trạng “trở nên/bị sâu bọ ăn” trong diễn tiến dẫn tới cái chết, nhưng không cần ấn định một mốc “rồi” riêng biệt.
  - severity: low
