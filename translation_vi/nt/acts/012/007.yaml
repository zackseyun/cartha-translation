  naturalness: Văn phong tự nhiên, trang trọng vừa phải. “Xiềng xích rơi khỏi hai tay ông” tự nhiên và phản ánh rõ số nhiều của αἱ ἁλύσεις hơn “Xiềng liền tuột khỏi hai tay ông.”
  terminology: “Thiên sứ,” “Chúa,” và “Phi-e-rơ” phù hợp với cách dùng Kinh Thánh tiếng Việt hiện đại. “Phòng giam” là lựa chọn hợp ngữ cảnh cho οἴκημα, với chú thích bảo lưu nghĩa rộng hơn.
  issues:
