id: ACT.12.7
reference: Acts 12:7
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ ἄγγελος κυρίου ἐπέστη, καὶ φῶς ἔλαμψεν ἐν τῷ οἰκήματι· πατάξας δὲ τὴν πλευρὰν τοῦ Πέτρου ἤγειρεν αὐτὸν λέγων· Ἀνάστα ἐν τάχει· καὶ ἐξέπεσαν αὐτοῦ αἱ ἁλύσεις ἐκ τῶν χειρῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/007.yaml
  text: And behold[a], an angel of the Lord stood near, and a light shone in the cell. Striking Peter on the side, he woke him, saying[b], “Get up quickly.” And his chains fell off from his hands.
translation:
  language: vi
  text: 'Kìa, một thiên sứ của Chúa đứng bên[a], và ánh sáng chiếu sáng trong phòng giam[b]. Thiên sứ đánh vào sườn Phi-e-rơ, đánh thức ông và nói: “Hãy mau đứng dậy!” Xiềng xích rơi khỏi hai tay ông.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “bỗng xuất hiện” hoặc “đến đứng bên”. Động từ Hy Lạp có thể nhấn mạnh sự hiện diện bất ngờ cũng như việc đứng gần.'
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn dùng một từ chung hơn, có thể là “phòng” hoặc “gian”; “phòng giam” phù hợp với bối cảnh nhà tù.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: Kìa
  rationale: Giữ sức gợi chú ý và nét kể chuyện sống động của từ chỉ diễn ngôn, bằng một cách diễn đạt trang trọng nhưng vẫn dễ hiểu trong tiếng Việt hiện đại.
- source_word: ἄγγελος κυρίου
  choice: một thiên sứ của Chúa
  rationale: Diễn đạt tự nhiên cấu trúc sở hữu/nguồn sai phái, đồng thời giữ cách gọi κύριος là “Chúa”.
- source_word: ἐπέστη
  choice: thình lình đứng bên
  rationale: Kết hợp cả ý hiện diện bất ngờ lẫn vị trí ở gần, không buộc động từ chỉ mang nghĩa “xuất hiện” hay chỉ “đứng bên”.
- source_word: φῶς ἔλαμψεν
  choice: ánh sáng chiếu rực
  rationale: Phản ánh động từ λάμπω là chiếu sáng/tỏa sáng và làm rõ tính nổi bật của ánh sáng trong cảnh tối của nhà tù.
- source_word: ἐν τῷ οἰκήματι
  choice: trong phòng giam
  rationale: οἴκημα tự nó có nghĩa rộng là phòng hoặc gian nhà, nhưng ngữ cảnh nhà tù cho phép cách dịch cụ thể, tự nhiên là “phòng giam”; chú thích bảo lưu nghĩa rộng hơn.
- source_word: πατάξας ... τὴν πλευρὰν
  choice: đánh vào sườn
  rationale: Giữ lực tương đối mạnh của πατάσσω, không làm nhẹ thành “khẽ chạm” hay “lay”, và dịch πλευρά bằng từ tự nhiên chỉ phần bên thân thể.
- source_word: ἤγειρεν αὐτόν
  choice: đánh thức ông
  rationale: Trong ngữ cảnh Phi-e-rơ đang ngủ, nghĩa phù hợp của ἐγείρω là làm thức dậy, thay vì nghĩa rộng “nâng dậy”.
- source_word: Ἀνάστα ἐν τάχει
  choice: Hãy mau đứng dậy!
  rationale: Mệnh lệnh tự nhiên, rõ ràng trong tiếng Việt hiện đại, giữ được sắc thái khẩn cấp của ἐν τάχει.
- source_word: ἐξέπεσαν ... αἱ ἁλύσεις
  choice: Xiềng liền tuột khỏi
  rationale: “Tuột khỏi” thể hiện việc xiềng tự rơi ra bất ngờ; “liền” chuyển tải nhịp kết quả tức thời của câu chuyện mà không giải thích cơ chế.
- source_word: ἐκ τῶν χειρῶν
  choice: khỏi hai tay ông
  rationale: Giữ danh từ χείρ là “tay” thay vì diễn giải thành “cổ tay”; số nhiều trong nguyên văn được thể hiện bằng “hai tay” cho tự nhiên.
theological_decisions:
- issue: Cách dịch κύριος trong ἄγγελος κυρίου
  choice: Chúa
  alternative: chủ
  rationale: “Chúa” là cách gọi chuẩn và tự nhiên trong ngữ cảnh Tân Ước, bảo lưu ý về Đấng mà thiên sứ thuộc về hoặc được sai phái bởi Ngài, không thêm định danh thần học ngoài văn bản.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và giàu tính kể chuyện. “Kìa” giữ nét sống động của Lu-ca; “Phi-e-rơ” theo dạng phiên âm quen thuộc trong tiếng Việt. Hai chú thích bảo lưu độ rộng nghĩa của ἐπέστη và οἴκημα.
