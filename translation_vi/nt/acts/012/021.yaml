  text: τακτῇ δὲ ἡμέρᾳ ὁ Ἡρῴδης ἐνδυσάμενος ἐσθῆτα βασιλικὴν ⸀καὶ καθίσας ἐπὶ τοῦ βήματος ἐδημηγόρει πρὸς αὐτούς·
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/021.yaml
  text: On an appointed day[a], Herod, having put on royal clothing and having sat down on the tribunal[b], was delivering a public address to them.
translation:
  language: vi
  text: Vào ngày đã định, Hê-rốt mặc y phục vương giả[a], ngồi trên bục[b] và đang diễn thuyết trước họ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “triều phục” hoặc “áo bào vương giả”; từ Hy Lạp có thể chỉ chung trang phục lộng lẫy.
    reason: lexical_alternative
  - marker: b
    text: Từ Hy Lạp có thể chỉ một bục cao hoặc chỗ ngồi chính thức, kể cả “tòa xét xử”.
    reason: lexical_alternative
lexical_decisions:
- source_word: τακτῇ δὲ ἡμέρᾳ
  choice: Đến ngày đã định
  rationale: τακτός chỉ một ngày đã được ấn định. “Đến” tạo sự chuyển tiếp tự nhiên trong lời kể và diễn đạt nhẹ sắc thái nối tiếp của δέ mà không thêm một từ chỉ thời gian không có trong nguyên văn.
- source_word: ἐνδυσάμενος
  choice: mặc
  rationale: Phân từ trung cách bất định mô tả việc Hê-rốt mặc trang phục trước khi ngồi xuống. Tiếng Việt tự nhiên dùng động từ hữu hạn theo chuỗi hành động thay vì cố giữ cấu trúc phân từ.
- source_word: ἐσθῆτα βασιλικὴν
  choice: y phục hoàng gia
  rationale: ἐσθής có nghĩa rộng là quần áo hoặc trang phục; cách dịch này giữ sắc thái vương giả mà không giới hạn thành một kiểu áo choàng cụ thể.
- source_word: καθίσας
  choice: ngồi
  rationale: Phân từ bất định đánh dấu hành động kế tiếp. “Ngồi” gọn, tự nhiên và giữ đúng trình tự hành động.
- source_word: ἐπὶ τοῦ βήματος
  choice: trên lễ đài
  rationale: βῆμα có thể chỉ bục cao, chỗ ngồi chính thức hoặc tòa xét xử. Trong bối cảnh nhà vua công khai diễn thuyết, “lễ đài” là cách diễn đạt tự nhiên, còn sắc thái tư pháp được bảo lưu trong chú thích.
- source_word: ἐδημηγόρει
  choice: đọc diễn văn
  rationale: δημηγορέω chỉ việc phát biểu công khai trước một cử tọa. “Đọc diễn văn” diễn đạt tự nhiên tính chất chính thức và công khai; văn cảnh của cả câu vẫn cho thấy hành động đang diễn ra.
- source_word: πρὸς αὐτούς
  choice: trước họ
  rationale: πρός với đối cách hướng lời nói về phía cử tọa. “Trước họ” phù hợp với một bài diễn văn công khai và không xác định thêm họ là ai.
theological_decisions: []
