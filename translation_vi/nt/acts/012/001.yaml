revisions:
- from: Khoảng thời gian ấy, vua Hê-rốt ra tay bắt một số người thuộc hội thánh để ngược đãi họ.[a][b][c]
  to: Vào khoảng thời gian ấy,[a] vua Hê-rốt ra tay[b] ngược đãi[c] một số người thuộc hội thánh.
  rationale: Sửa “ra tay bắt” thành “ra tay ngược đãi” để không thêm nghĩa bắt giữ không được nguyên văn xác định, đồng thời vẫn giữ diễn đạt thành ngữ tự nhiên. Sửa cụm mở đầu thành “Vào khoảng thời gian ấy” để biểu đạt đúng trạng ngữ thời gian gần đúng. Di chuyển các ký hiệu chú thích đến sau các cụm tương ứng. Không cần chú thích thêm về lịch sử hoặc thần học.
