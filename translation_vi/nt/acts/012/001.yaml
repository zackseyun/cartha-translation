review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng bối cảnh chung và dịch κακῶσαί là “ngược đãi” phù hợp. Tuy nhiên, “ra tay bắt” thêm nghĩa bắt giữ/áp giải mà thành ngữ ἐπέβαλεν ... τὰς χεῖρας không tự nó xác định; trong câu này, hành động thù địch được để ngỏ và được infinitive κακῶσαι xác định là nhằm làm hại/ngược đãi. Cần bỏ nét nghĩa quá cụ thể “bắt”. “Vào khoảng thời gian ấy” cũng phản ánh tự nhiên và chính xác hơn giá trị thời gian gần đúng của κατά hơn “Khoảng thời gian ấy”.
  naturalness: “Vào khoảng thời gian ấy, vua Hê-rốt ra tay ngược đãi một số người thuộc hội thánh” là tiếng Việt hiện đại, trang trọng và trôi chảy. Việc gắn các ký hiệu chú thích ngay sau cụm từ liên quan giúp người đọc nhận biết rõ phạm vi từng chú thích.
  terminology: “vua Hê-rốt” là tự nhiên cho Ἡρῴδης ὁ βασιλεύς; “hội thánh” là một cách dịch nhất quán, quen dùng và phù hợp ngữ cảnh cho ἐκκλησία. “Ngược đãi” chuyển tải κακῶσαι mà không áp đặt nghĩa chuyên biệt “bách hại”.
  issues:
  - severity: medium
    issue: “ra tay bắt” thu hẹp ἐπέβαλεν ... τὰς χεῖρας thành hành động bắt giữ.
    rationale: Thành ngữ Hy Lạp chỉ việc đưa tay chống lại/ra tay với ý thù địch; bản thân nó không khẳng định một cuộc bắt giữ. Infinitive κακῶσαι nêu mục đích là làm hại hoặc ngược đãi. Cần dùng cách diễn đạt không thêm chi tiết này.
  - severity: low
    issue: “Khoảng thời gian ấy” có thể được hiểu là một quãng thời gian, thay vì một mốc thời điểm gần đúng.
    rationale: “Vào khoảng thời gian ấy” biểu đạt rõ chức năng trạng ngữ thời gian của Κατ’ ἐκεῖνον ... τὸν καιρόν.
  - severity: low
    issue: Các dấu chú thích hiện đều đặt cuối câu, không xác định rõ cụm từ được chú thích.
    rationale: Đặt [a] sau cụm thời gian, [b] sau “ra tay”, và [c] sau “ngược đãi” phản ánh đúng các mục chú thích từ vựng.
