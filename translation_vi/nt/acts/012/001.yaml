  text: Κατ’ ἐκεῖνον δὲ τὸν καιρὸν ἐπέβαλεν Ἡρῴδης ὁ βασιλεὺς τὰς χεῖρας κακῶσαί τινας τῶν ἀπὸ τῆς ἐκκλησίας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/001.yaml
  text: About that time Herod the king laid hands on some from the church to mistreat them[a][b][c].
translation:
  language: vi
  text: Vào khoảng thời gian ấy,[a] vua Hê-rốt ra tay[b] ngược đãi[c] một số người thuộc hội thánh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Vào thời gian ấy” hoặc “Vào khoảng thời gian ấy.”'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “đặt tay trên.” Trong ngữ cảnh này, thành ngữ ấy chỉ hành động thù địch nhằm vào một số người thuộc hội thánh.'
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “để làm hại họ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Κατ’ ἐκεῖνον δὲ τὸν καιρόν
  choice: Khoảng thời gian ấy
  rationale: κατά với cụm thời gian ở đối cách mang nghĩa gần đúng là “khoảng/vào khoảng”; δέ chỉ nhẹ nhàng chuyển mạch kể chuyện và không cần dịch thành một từ nối riêng trong tiếng Việt.
- source_word: ἐπέβαλεν ... τὰς χεῖρας
  choice: ra tay bắt
  rationale: Thành ngữ này chỉ hành động thù địch nhắm vào người khác. “Ra tay bắt” tự nhiên trong tiếng Việt, giữ sắc thái hành động cưỡng chế mà không thu hẹp toàn bộ ý nghĩa chỉ còn một thủ tục pháp lý.
- source_word: Ἡρῴδης ὁ βασιλεύς
  choice: vua Hê-rốt
  rationale: Đây là trật tự tự nhiên, trang trọng trong tiếng Việt cho tên riêng kèm tước hiệu.
- source_word: κακῶσαί
  choice: để ngược đãi họ
  rationale: Động từ nói đến việc gây hại hoặc đối xử tàn tệ. “Ngược đãi” diễn đạt hành động thù địch đối với con người mà không mặc nhiên biến nó thành thuật ngữ chuyên biệt “bách hại”.
- source_word: τινας τῶν ἀπὸ τῆς ἐκκλησίας
  choice: một số người thuộc hội thánh
  rationale: Cụm từ chỉ một số người thuộc cộng đồng tín hữu; cách diễn đạt này rõ ràng và tự nhiên hơn lối dịch sát “từ hội thánh” trong tiếng Việt.
theological_decisions:
- issue: Cách dịch ἐκκλησία
  choice: hội thánh
  alternative: hội chúng; cộng đoàn
  rationale: Trong Công Vụ, từ này thường chỉ cộng đồng các tín hữu. “Hội thánh” là cách gọi quen thuộc trong tiếng Việt, còn “hội chúng” hoặc “cộng đoàn” cũng khả dĩ nhưng kém nhất quán với thuật ngữ Kinh Thánh phổ biến.
translation_notes:
  register: 'Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Bản dịch ưu tiên tương đương tối ưu: giữ ý nghĩa thành ngữ Hy Lạp bằng lối diễn đạt tự nhiên, đồng thời chú thích nghĩa sát chữ và các phương án có cơ sở.'
