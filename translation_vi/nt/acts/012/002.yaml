review_pass:
  verdict: revise
  source_fidelity: Cần sửa “anh của Giăng”, vì ἀδελφός chỉ xác định quan hệ anh/em trai mà không cho biết thứ tự tuổi. Bản văn không cho phép khẳng định Gia-cơ là anh của Giăng. “Rồi vua ...” phù hợp với chủ ngữ đã được nêu trong ngữ cảnh trước đó; “bằng gươm” diễn đạt đúng cách dụng cụ của μαχαίρῃ.
  naturalness: Câu sửa vẫn giữ văn phong kể chuyện hiện đại, trang trọng và tự nhiên. “Người anh em của Giăng” tránh áp đặt thứ tự tuổi; trong ngữ cảnh này nó được hiểu là anh/em trai, không phải nghĩa chung chung là đồng đạo.
  terminology: “Gia-cơ” và “Giăng” nhất quán với dạng tên Kinh Thánh Việt ngữ quen dùng. “Giết” phản ánh ἀνεῖλεν mà không tự thêm sắc thái thủ tục pháp lý của “xử tử”.
  issues:
  - severity: medium
    issue: “anh của Giăng” xác định thứ tự tuổi không có trong nguyên ngữ.
    rationale: Cụm τὸν ἀδελφὸν Ἰωάννου nghĩa là “người anh/em trai của Giăng” hoặc “anh em của Giăng”; bản văn không nói Gia-cơ lớn tuổi hơn Giăng. Cần giữ sự không xác định này.
  - severity: low
    issue: Chú thích nêu “giết chết” như một phương án dịch thay thế.
    rationale: “Giết chết” không bổ sung một lựa chọn ngữ nghĩa đáng kể so với “giết”. Chú thích nên nêu phương án có khác biệt thực sự là “xử tử”, đồng thời lưu ý đây là sắc thái có thể có theo bối cảnh chứ không được phát biểu rõ trong câu.
