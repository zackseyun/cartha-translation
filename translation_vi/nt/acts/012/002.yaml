base_translation:
  language: en
  yaml_path: translation/nt/acts/012/002.yaml
  text: And he killed James[a], the brother of John, with the sword.
translation:
  language: vi
  text: Rồi vua dùng gươm giết Gia-cơ[a], người anh em của Giăng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “xử tử”. Động từ Hy Lạp có nghĩa là “giết”; bối cảnh rộng hơn có thể cho thấy đây là một cuộc hành quyết chính thức.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνεῖλεν
  choice: giết
  rationale: Động từ ἀναιρέω ở đây nói đến việc gây ra cái chết. “Giết” là cách diễn đạt rõ ràng, tự nhiên và không tự ý nhấn mạnh thủ tục pháp lý như “xử tử”.
- source_word: δὲ
  choice: Rồi
  rationale: δέ nối tiếp và đẩy câu chuyện tiến lên; “Rồi” thể hiện diễn tiến tự sự mà không tạo sắc thái tương phản mạnh.
- source_word: Ἰάκωβον
  choice: Gia-cơ
  rationale: Dùng dạng tên riêng đã quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
- source_word: τὸν ἀδελφὸν Ἰωάννου
  choice: anh của Giăng
  rationale: Cụm đồng vị xác định Gia-cơ nào đang được nói đến. Tiếng Hy Lạp chỉ nói “người anh/em trai”; theo nhận dạng quen thuộc của hai nhân vật, “anh của Giăng” là cách diễn đạt tiếng Việt tự nhiên.
- source_word: μαχαίρῃ
  choice: dùng gươm
  rationale: μάχαιρα chỉ gươm hoặc đoản kiếm; cách sở dụng ở đây nêu phương tiện gây chết. “Dùng gươm” tự nhiên và giữ hình ảnh cụ thể của nguyên văn.
theological_decisions:
- issue: Tính chất hành động của vua Hê-rốt
  choice: Diễn đạt là hành động giết người, không xác định trong chính văn rằng đây là một cuộc xử tử theo thủ tục pháp lý.
  alternative: “xử tử Gia-cơ” để làm nổi bật việc giết người do nhà cầm quyền thực hiện.
  rationale: ἀνεῖλεν cho biết Gia-cơ bị giết và μαχαίρῃ cho biết phương tiện. Bối cảnh cho thấy đây là cuộc bách hại do chính quyền tiến hành, nhưng câu này không buộc phải dùng thuật ngữ pháp lý cụ thể hơn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Chủ ngữ “vua” được duy trì theo ngữ cảnh câu trước; “Rồi” nối mạch kể chuyện. Tên riêng dùng dạng quen thuộc trong Kinh Thánh tiếng Việt.
