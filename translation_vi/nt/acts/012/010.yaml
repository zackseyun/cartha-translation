id: ACT.12.10
reference: Acts 12:10
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: διελθόντες δὲ πρώτην φυλακὴν καὶ δευτέραν ἦλθαν ἐπὶ τὴν πύλην τὴν σιδηρᾶν τὴν φέρουσαν εἰς τὴν πόλιν, ἥτις αὐτομάτη ἠνοίγη αὐτοῖς, καὶ ἐξελθόντες προῆλθον ῥύμην μίαν, καὶ εὐθέως ἀπέστη ὁ ἄγγελος ἀπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/010.yaml
  text: After they had passed the first guard and the second[a], they came to the iron gate leading into the city, which opened to them by itself; and after they went out, they went along one street[b], and immediately the angel departed from him.
translation:
  language: vi
  text: Sau khi đi qua trạm gác thứ nhất và thứ hai, họ đến cổng sắt dẫn vào thành; cổng ấy tự mở ra cho họ[a]. Khi đã ra ngoài, họ đi tiếp một con phố[b], rồi lập tức thiên sứ rời khỏi ông.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “cổng tự nó mở ra cho họ.”'
    reason: lexical_alternative
  - marker: b
    text: Cụm “một con phố” có lẽ có nghĩa là họ đi được quãng đường của một phố trước khi thiên sứ rời khỏi ông.
    reason: cultural_note
lexical_decisions:
- source_word: διελθόντες
  choice: Sau khi đi qua
  rationale: Phân từ bất định chỉ hành động xảy ra trước động từ chính; cách dịch này thể hiện rõ trình tự và tự nhiên trong tiếng Việt.
- source_word: φυλακὴν
  choice: trạm gác
  rationale: Trong ngữ cảnh vượt qua các lớp canh giữ, từ này chỉ các vị trí hoặc toán lính canh nối tiếp nhau; “trạm gác” rõ nghĩa hơn “sự canh giữ”.
- source_word: πύλην τὴν σιδηρᾶν
  choice: cổng sắt
  rationale: Giữ nguyên ý về vật liệu của cổng bằng cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: τὴν φέρουσαν εἰς τὴν πόλιν
  choice: dẫn vào thành
  rationale: Phân từ mô tả cổng cho phép đi vào khu thành; “thành” phù hợp với bối cảnh đô thị cổ và văn phong Kinh Thánh hiện đại.
- source_word: αὐτομάτη
  choice: tự mở ra
  rationale: Diễn đạt cánh cổng mở mà không có tác động của con người, đồng thời tránh sắc thái máy móc hiện đại của “tự động”.
- source_word: ἐξελθόντες
  choice: Họ đi ra
  rationale: Thể hiện hành động kế tiếp đã hoàn tất, giữ mạch kể rõ ràng.
- source_word: προῆλθον ῥύμην μίαν
  choice: đi tiếp qua một con phố
  rationale: προῆλθον chỉ việc tiến đi, còn ῥύμην μίαν có thể biểu thị quãng đường tương ứng với một phố; bản dịch giữ hình ảnh cụ thể mà không xác định quá mức.
- source_word: εὐθέως ἀπέστη
  choice: thì lập tức ... rời khỏi
  rationale: Giữ sắc thái chuyển biến tức thời và sự tách khỏi Phi-e-rơ trong lời kể.
- source_word: ὁ ἄγγελος
  choice: thiên sứ
  rationale: Cách gọi trang trọng, quen thuộc và không hàm ý giới tính vượt quá điều văn bản nêu.
theological_decisions:
- issue: Bản chất việc cổng mở
  choice: cổng tự mở ra cho họ
  alternative: cổng tự nó mở ra cho họ
  rationale: Nguyên văn thuật lại hiện tượng cổng mở không do con người tác động nhưng không giải thích cơ chế; cách dịch giữ tính kỳ diệu mà không đưa vào ý niệm thiết bị tự động.
- issue: Ý nghĩa của φυλακή
  choice: trạm gác thứ nhất và thứ hai
  alternative: lính canh thứ nhất và thứ hai
  rationale: Bối cảnh cho thấy hai lớp hoặc vị trí canh giữ mà Phi-e-rơ và thiên sứ đi qua. “Trạm gác” diễn đạt hợp lý các chốt an ninh nối tiếp mà không biến chúng thành hai nhà tù.
- issue: Chủ thể được thiên sứ rời khỏi
  choice: ông
  alternative: Phi-e-rơ
  rationale: Nguyên văn dùng đại từ αὐτοῦ. Giữ đại từ tôn trọng hình thức nguồn và mạch văn trước đó, trong khi ngữ cảnh xác định người ấy là Phi-e-rơ.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “trạm gác” để làm rõ các lớp canh giữ, “thành” cho bối cảnh đô thị cổ, và “thiên sứ” theo cách dùng Kinh Thánh phổ thông. Dấu chấm phẩy giữ sự liên kết của chuỗi hành động trong nguyên văn mà không tạo câu quá nặng.
