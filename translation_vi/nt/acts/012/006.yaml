id: ACT.12.6
reference: Acts 12:6
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ὅτε δὲ ἤμελλεν ⸂προαγαγεῖν αὐτὸν⸃ ὁ Ἡρῴδης, τῇ νυκτὶ ἐκείνῃ ἦν ὁ Πέτρος κοιμώμενος μεταξὺ δύο στρατιωτῶν δεδεμένος ἁλύσεσιν δυσίν, φύλακές τε πρὸ τῆς θύρας ἐτήρουν τὴν φυλακήν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/006.yaml
  text: When Herod was about to bring him out[a], on that very night Peter was sleeping between two soldiers, bound with two chains[b], and guards before the door were keeping watch over the prison.
translation:
  language: vi
  text: Khi Hê-rốt sắp đưa ông ra[a], chính đêm ấy, Phi-e-rơ đang ngủ giữa hai người lính, bị trói bằng hai sợi xích; còn lính canh trước cửa đang canh giữ nhà tù.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đưa ông ra trình diện.” Động từ Hy Lạp có thể chỉ việc dẫn một người ra để xuất hiện trước công chúng hoặc để chịu xét xử.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤμελλεν
  choice: sắp
  rationale: Diễn tả hành động sắp xảy ra, giữ được tính cận kề của μέλλω trong mạch kể.
- source_word: προαγαγεῖν αὐτόν
  choice: đưa ông ra
  rationale: Diễn đạt tự nhiên việc đưa Phi-e-rơ ra khỏi nơi giam để xuất hiện trước công chúng hoặc bị xét xử, đồng thời không xác định quá mức mục đích.
- source_word: τῇ νυκτὶ ἐκείνῃ
  choice: chính đêm ấy
  rationale: Giữ sắc thái xác định và nhấn mạnh của đại từ chỉ định ἐκείνῃ.
- source_word: κοιμώμενος
  choice: đang ngủ
  rationale: Thể hiện hành động đang tiếp diễn của phân từ hiện tại.
- source_word: μεταξὺ δύο στρατιωτῶν
  choice: giữa hai người lính
  rationale: Tương đương không gian rõ ràng, tự nhiên trong tiếng Việt hiện đại.
- source_word: δεδεμένος ἁλύσεσιν δυσίν
  choice: bị trói bằng hai sợi xích
  rationale: Giữ trạng thái bị trói của phân từ hoàn thành bị động và phương tiện được nêu bằng cụm ở cách dữ cách.
- source_word: φύλακες πρὸ τῆς θύρας
  choice: lính canh trước cửa
  rationale: Phản ánh đúng nhân sự canh gác và vị trí ở phía trước cửa.
- source_word: ἐτήρουν τὴν φυλακήν
  choice: đang canh giữ nhà tù
  rationale: τηρέω mang nghĩa canh giữ; φυλακή trong ngữ cảnh này chỉ nơi giam giữ. Cách dịch chấp nhận sự lặp từ tự nhiên trong tiếng Việt để giữ rõ nghĩa.
