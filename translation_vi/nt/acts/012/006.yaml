translation_notes:
  register: 'Văn phong kể chuyện trang trọng nhưng tự nhiên, dễ hiểu với độc giả Việt Nam hiện đại. Dùng các tên quen thuộc “Hê-rốt” và “Phi-e-rơ”. Dấu chấm phẩy làm rõ hai cảnh đồng thời: Phi-e-rơ ngủ trong tình trạng bị xiềng và lính đang canh nhà tù.'
