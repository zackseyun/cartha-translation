  text: οἱ δὲ πρὸς αὐτὴν εἶπαν· Μαίνῃ. ἡ δὲ διϊσχυρίζετο οὕτως ἔχειν. οἱ δὲ ἔλεγον· Ὁ ἄγγελός ⸂ἐστιν αὐτοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/015.yaml
  text: But they said to her[a], “You are out of your mind.” But she kept insisting that it was so. And they kept saying, “It is his angel.”
translation:
  language: vi
  text: 'Nhưng họ bảo cô: “Cô mất trí rồi!” Cô vẫn một mực khẳng định là đúng như vậy. Còn họ cứ nói: “Đó là thiên sứ của ông ấy.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể hiểu là “thiên sứ bảo hộ của ông ấy”, “thiên sứ đại diện cho ông ấy”, hoặc, theo một số cách giải thích, “linh hồn hoặc bóng ma của ông ấy”. Tiếng Hy Lạp chỉ nói “thiên sứ của ông ấy”.
    reason: alternative_reading
lexical_decisions:
- source_word: Μαίνῃ
  choice: Cô mất trí rồi!
  rationale: Động từ μαίνομαι ở ngôi thứ hai số ít diễn tả lời quy kết rằng Rô-đa đang nói điều điên rồ. “Mất trí rồi” tự nhiên trong tiếng Việt hiện đại, giữ được sức nặng của câu mà không mang sắc thái chẩn đoán y khoa.
- source_word: διϊσχυρίζετο
  choice: vẫn một mực khẳng định
  rationale: Thì chưa hoàn thành cùng sắc thái nhấn mạnh của động từ cho thấy cô tiếp tục quả quyết bất chấp sự phản đối.
- source_word: οὕτως ἔχειν
  choice: đúng là như vậy
  rationale: Cụm thành ngữ có nghĩa sự việc đúng như cô nói; cách dịch này ngắn gọn và tự nhiên.
- source_word: ἔλεγον
  choice: cứ nói
  rationale: Thì chưa hoàn thành gợi hành động nói tiếp diễn hoặc lặp lại; “cứ nói” thể hiện rõ sắc thái ấy.
- source_word: ἄγγελός
  choice: thiên sứ
  rationale: Trong ngữ cảnh này, từ này nhiều khả năng chỉ một hữu thể siêu nhiên gắn với Phi-e-rơ, thay vì một sứ giả loài người. “Thiên sứ” là cách gọi rõ ràng, trang trọng và quen thuộc.
- source_word: αὐτοῦ
  choice: của ông ấy
  rationale: Đại từ sở hữu quy chiếu về Phi-e-rơ; “của ông ấy” giữ nguyên quan hệ sở hữu mà không diễn giải thêm.
theological_decisions:
- issue: Ý nghĩa của cụm “thiên sứ của ông ấy”
  choice: Giữ nguyên là “thiên sứ của ông ấy”.
  alternative: Thiên sứ bảo hộ của ông ấy; thiên sứ đại diện cho ông ấy; hoặc linh/hồn của ông ấy.
  rationale: Bản Hy Lạp chỉ nói ὁ ἄγγελος αὐτοῦ và không giải thích niềm tin nằm sau lời này. Không nên đưa một cách hiểu thần học cụ thể vào chính văn; các khả năng được nêu trong chú thích để bảo toàn tính mơ hồ.
translation_notes:
  register: Văn phong hiện đại, dễ hiểu nhưng trang trọng. “Cô” phù hợp với cách nhóm người nói trực tiếp với Rô-đa; “một mực” và “cứ nói” tái hiện diễn tiến kéo dài của hai động từ ở thì chưa hoàn thành. Dấu chú thích [a] được đặt ngay sau cụm từ cần giải thích.
