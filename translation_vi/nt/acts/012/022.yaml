  text: ὁ δὲ δῆμος ἐπεφώνει· ⸂Θεοῦ φωνὴ⸃ καὶ οὐκ ἀνθρώπου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/022.yaml
  text: And the crowd kept shouting[a], “The voice of a god, and not of a man!”
translation:
  language: vi
  text: 'Dân chúng liên tục hô vang[a]: “Đó là tiếng của một vị thần, chứ không phải của một người!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch lời tung hô là: “Đó là tiếng của Đức Chúa Trời, chứ không phải của một người!” Tiếng Hy Lạp cho phép hiểu như vậy, nhưng trong bối cảnh này, nghĩa “của một vị thần” có khả năng hơn vì đám đông ngoại giáo đang tôn Hê-rốt lên hàng thần linh.'
    reason: alternative_reading
lexical_decisions:
- source_word: δῆμος
  choice: dân chúng
  rationale: Chỉ đám đông dân chúng đang tụ họp, không phải một cơ quan chính trị chính thức; cách nói này tự nhiên và trang trọng trong tiếng Việt hiện đại.
- source_word: ἐπεφώνει
  choice: cứ hô lớn
  rationale: Thì chưa hoàn thành diễn tả hành động đang tiếp diễn hoặc lặp lại; “cứ hô lớn” giữ được sắc thái ấy.
- source_word: Θεοῦ
  choice: của một vị thần
  rationale: Trong bối cảnh đám đông ngoại giáo tung hô Hê-rốt và với danh từ không có mạo từ, cụm từ này hợp lý nhất khi chỉ một vị thần nói chung, nhưng cách hiểu “của Đức Chúa Trời” vẫn được giữ trong chú thích.
- source_word: φωνὴ
  choice: tiếng
  rationale: “Tiếng” là cách diễn đạt tự nhiên cho giọng nói được nghe ở đây và giữ cấu trúc danh từ của câu tung hô.
- source_word: ἀνθρώπου
  choice: của một người
  rationale: Giữ sự đối chiếu trực tiếp ở số ít giữa một vị thần và một con người.
theological_decisions:
- issue: Nên hiểu Θεοῦ là “của Đức Chúa Trời” hay “của một vị thần”
  choice: của một vị thần
  alternative: của Đức Chúa Trời
  rationale: Bối cảnh là đám đông ngoại giáo đang tôn Hê-rốt lên hàng thần linh, và θεοῦ không có mạo từ. Bản dịch chính phản ánh bối cảnh đó, còn chú thích bảo tồn cách hiểu khác mà ngữ pháp Hy Lạp cho phép.
translation_notes:
  register: Tiếng Việt hiện đại, rõ ràng và trang trọng vừa phải. “Dân chúng cứ hô lớn” truyền đạt hành động tung hô liên tục; “một vị thần” phù hợp với bối cảnh ngoại giáo mà không xóa bỏ cách hiểu thay thế.
