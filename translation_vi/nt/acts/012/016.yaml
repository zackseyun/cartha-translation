  yaml_path: translation/nt/acts/012/016.yaml
  text: But Peter kept on knocking[a], and when they opened the door[b], they saw him and were astonished.
translation:
  language: vi
  text: Nhưng Phi-e-rơ vẫn tiếp tục gõ cửa[a]. Khi họ mở cửa[b], họ thấy ông và kinh ngạc.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “cứ gõ cửa” hoặc “kiên trì gõ cửa.”'
    reason: lexical_alternative
  - marker: b
    text: 'Sát nghĩa: “Sau khi mở, họ thấy ông và kinh ngạc.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέμενεν
  choice: vẫn tiếp tục
  rationale: Động từ ở thì chưa hoàn thành diễn tả hành động kéo dài hoặc lặp lại; “vẫn tiếp tục” vừa thể hiện tính liên tục vừa phù hợp với sự tương phản trong mạch kể.
- source_word: κρούων
  choice: gõ cửa
  rationale: Trong ngữ cảnh này, κρούω chỉ hành động gõ để người bên trong mở cửa. “Cửa” được bổ sung từ ngữ cảnh để câu tiếng Việt tự nhiên và rõ nghĩa.
- source_word: ἀνοίξαντες
  choice: Khi họ mở ra
  rationale: Phân từ aorist được diễn đạt bằng mệnh đề thời gian, cho thấy việc mở xảy ra trước khi họ nhìn thấy Phi-e-rơ; giữ tân ngữ ngầm như nguyên văn.
- source_word: εἶδαν αὐτόν
  choice: thấy ông
  rationale: Cách dịch trực tiếp, tự nhiên của động từ ὁράω trong văn kể chuyện; “ông” quy chiếu về Phi-e-rơ.
- source_word: ἐξέστησαν
  choice: vô cùng kinh ngạc
  rationale: Động từ diễn tả sự sửng sốt mạnh. “Vô cùng kinh ngạc” truyền đạt cường độ mà vẫn trang trọng, dễ hiểu.
- source_word: δὲ
  choice: Nhưng
  rationale: δέ đầu câu tạo nét tương phản với cảnh những người bên trong trước đó không tin Phi-e-rơ đang ở ngoài. δέ thứ hai được thể hiện tự nhiên qua sự chuyển sang mệnh đề thời gian.
- source_word: Πέτρος
  choice: Phi-e-rơ
  rationale: Dùng dạng tên riêng quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
theological_decisions: []
