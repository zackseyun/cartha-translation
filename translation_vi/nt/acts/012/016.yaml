  verdict: revise
  source_fidelity: 'Bản nháp truyền đạt đúng diễn tiến chính: Phi-e-rơ kiên trì gõ, những người bên trong mở cửa, nhận ra ông và kinh ngạc. Tuy nhiên, cấu trúc “Khi họ mở ra, thấy ông thì...” làm mờ chủ ngữ của hai động từ sau và nối mệnh đề chưa tự nhiên. Bổ sung “cửa” là an toàn trong ngữ cảnh và làm rõ hành động được ngầm hiểu trong nguyên ngữ.'
  naturalness: “Khi họ mở cửa, họ thấy ông và kinh ngạc” là câu kể hiện đại, rõ chủ ngữ và mạch lạc hơn. Bỏ “vô cùng” tránh thêm một mức độ nhấn mạnh từ vựng không được nêu riêng trong bản Hy Lạp, trong khi “kinh ngạc” vẫn diễn đạt đầy đủ ἐξέστησαν.
  terminology: “Phi-e-rơ” phù hợp với cách gọi quen thuộc trong tiếng Việt Kinh Thánh. Không có thuật ngữ thần học đặc thù trong câu này.
  issues:
