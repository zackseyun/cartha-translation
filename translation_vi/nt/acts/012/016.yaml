    issue: 'Mệnh đề chính trong bản nháp thiếu chủ ngữ rõ ràng và có cấu trúc nối câu gượng: “Khi họ mở ra, thấy ông thì vô cùng kinh ngạc.”'
    rationale: Nguyên ngữ có cùng một chủ ngữ số nhiều cho “mở”, “thấy” và “kinh ngạc”. Lặp lại “họ” trong tiếng Việt giúp bảo toàn quan hệ cú pháp và tránh cách đọc lửng.
  - severity: low
    issue: “Vô cùng” là mức độ tăng cường không cần thiết.
    rationale: ἐξέστησαν diễn tả sự kinh ngạc mạnh, nhưng “kinh ngạc” trong văn cảnh đã chuyển tải nghĩa này mà không thêm một trạng từ cường điệu.
