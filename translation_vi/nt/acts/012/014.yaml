id: ACT.12.14
reference: Acts 12:14
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἐπιγνοῦσα τὴν φωνὴν τοῦ Πέτρου ἀπὸ τῆς χαρᾶς οὐκ ἤνοιξεν τὸν πυλῶνα, εἰσδραμοῦσα δὲ ἀπήγγειλεν ἑστάναι τὸν Πέτρον πρὸ τοῦ πυλῶνος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/014.yaml
  text: And when she recognized Peter’s voice[a], because of her joy she did not open the gate[b], but ran in and reported that Peter was standing at the gate.
translation:
  language: vi
  text: Khi nhận ra tiếng của Phi-e-rơ, cô mừng quá nên không mở cổng[a], mà chạy vào báo rằng Phi-e-rơ đang đứng trước cổng[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Cổng” (πυλών) cũng có thể hiểu là lối cổng hoặc cửa ngoài dẫn từ đường phố vào khuôn viên nhà.
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “báo Phi-e-rơ đang đứng trước cổng.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιγνοῦσα
  choice: nhận ra
  rationale: Phân từ bất định của ἐπιγινώσκω diễn tả việc cô nhận ra tiếng Phi-e-rơ khi nghe; “nhận ra” tự nhiên và chính xác trong tiếng Việt.
- source_word: τὴν φωνὴν τοῦ Πέτρου
  choice: tiếng của Phi-e-rơ
  rationale: φωνή trong ngữ cảnh này là tiếng nói được nhận biết; “tiếng của Phi-e-rơ” tự nhiên hơn “giọng nói của Phi-e-rơ” mà vẫn rõ nghĩa.
- source_word: ἀπὸ τῆς χαρᾶς
  choice: mừng quá nên
  rationale: 'Cụm giới từ chỉ nguyên nhân. Cách diễn đạt này tự nhiên, sinh động và giữ quan hệ nhân quả: vì quá vui nên cô không mở cổng.'
- source_word: οὐκ ἤνοιξεν
  choice: không mở
  rationale: ἀνοίγω có nghĩa là “mở”; nguyên văn không cho cơ sở để cụ thể hóa thành “mở khóa”.
- source_word: τὸν πυλῶνα / τοῦ πυλῶνος
  choice: cổng
  rationale: πυλών chỉ cổng hoặc lối vào phía ngoài từ đường phố vào khuôn viên nhà; “cổng” ngắn gọn và phù hợp bối cảnh nhà ở.
- source_word: εἰσδραμοῦσα
  choice: chạy vào
  rationale: Phân từ diễn tả chuyển động nhanh vào bên trong; “chạy vào” giữ được nhịp kể sống động.
- source_word: ἀπήγγειλεν
  choice: báo
  rationale: ἀπαγγέλλω mang nghĩa báo tin hoặc thuật lại; “báo” tự nhiên trong văn kể hiện đại.
- source_word: ἑστάναι
  choice: đang đứng
  rationale: Động từ nguyên mẫu hoàn thành của ἵστημι có nghĩa trạng thái; “đang đứng” thể hiện trạng thái tiếp diễn lúc cô báo tin.
- source_word: πρὸ τοῦ πυλῶνος
  choice: trước cổng
  rationale: πρό với sở hữu cách có nghĩa “ở trước/phía trước”; “trước cổng” giữ sát hình ảnh không gian của nguyên văn.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Cấu trúc “mừng quá nên” truyền đạt tự nhiên nguyên nhân trong ἀπὸ τῆς χαρᾶς; tên riêng dùng dạng Phi-e-rơ quen thuộc trong tiếng Việt.
