  terminology: “Phi-e-rơ” là dạng tên riêng quen dùng trong văn phong Kinh Thánh tiếng Việt. “Cổng” phù hợp với πυλών trong bối cảnh lối vào ngoài của một nhà; chú thích a nêu lựa chọn từ vựng một cách hữu ích. Không có thuật ngữ thần học cần hiệu chỉnh.
