  source_fidelity: 'Bản dịch truyền đạt đầy đủ và đúng các yếu tố của nguyên văn: cô nhận ra tiếng Phi-e-rơ; vì quá vui nên không mở cổng; cô chạy vào báo rằng Phi-e-rơ đang đứng trước cổng. “Đang đứng” diễn đạt phù hợp giá trị trạng thái của ἑστάναι, và “trước cổng” giữ được πρὸ τοῦ πυλῶνος.'
