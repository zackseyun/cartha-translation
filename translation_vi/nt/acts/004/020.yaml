  text: For we are not able not to speak about what we have seen and heard[a].
translation:
  language: vi
  text: Vì chúng tôi không thể không nói về những điều chúng tôi đã thấy và đã nghe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cách dịch tự nhiên hơn: “Vì chúng tôi không thể im lặng về những điều chúng tôi đã thấy và đã nghe.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ δυνάμεθα
  choice: chúng tôi không thể
  rationale: Diễn đạt trực tiếp sự bất khả, đồng thời kết hợp với μή λαλεῖν để giữ cấu trúc nhấn mạnh “không thể không nói” của tiếng Hy Lạp.
- source_word: γὰρ
  choice: Vì
  rationale: Giữ chức năng giải thích nguyên do cho lời tuyên bố ở câu trước; “Vì” tự nhiên và trang trọng trong tiếng Việt.
- source_word: ἡμεῖς
  choice: chúng tôi
  rationale: Đại từ được nêu rõ trong nguyên văn và có sắc thái nhấn mạnh nhẹ; “chúng tôi” phù hợp khi các sứ đồ nói với giới lãnh đạo.
- source_word: ἃ
  choice: những điều
  rationale: Phản ánh đại từ quan hệ trung tính số nhiều, chỉ nội dung mà họ đã trực tiếp chứng kiến và nghe.
- source_word: εἴδαμεν καὶ ἠκούσαμεν
  choice: mình đã thấy và đã nghe
  rationale: Hai động từ aorist được dịch bằng “đã” để thể hiện những sự việc họ trực tiếp chứng kiến trong quá khứ; lặp “đã” giúp hai hành vi song song rõ ràng.
- source_word: μὴ λαλεῖν
  choice: không nói
  rationale: Sau οὐ δυνάμεθα, cụm này tạo nghĩa “không thể không nói”, giữ nguyên sức nặng của cấu trúc phủ định thay vì diễn giải thành chỉ một quyết tâm.
- source_word: λαλεῖν
  choice: nói về
  rationale: Trong ngữ cảnh, động từ chỉ việc nói về những điều họ đã thấy và nghe; “nói về” làm rõ quan hệ với nội dung theo cách tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Lời chứng của các sứ đồ được trình bày như sự không thể im tiếng hay chỉ là quyết tâm không im tiếng.
  choice: Giữ ý họ “không thể không nói”.
  alternative: Dịch diễn ý là “chúng tôi nhất định phải nói” hoặc “chúng tôi không chịu ngừng nói”.
  rationale: οὐ δυνάμεθα ... μὴ λαλεῖν trực tiếp diễn tả việc không thể kiềm lại không nói. Bản dịch giữ sự căng thẳng giữa tính bất khả và trách nhiệm làm chứng, không giảm thành ý chí hoặc sự bất tuân đơn thuần.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc “không thể không nói” hơi nhấn mạnh nhưng vẫn tự nhiên trong tiếng Việt, đồng thời bảo toàn cấu trúc và ý nghĩa của nguyên văn. Đại từ phản thân “mình” tránh lặp “chúng tôi” mà không làm thay đổi chủ thể.
