  source_fidelity: 'Bản nháp truyền đạt đúng các yếu tố chính của câu Hy Lạp: sự đối lập δέ, nhóm những người đã nghe λόγος, hành động tin, con số được diễn tả là xấp xỉ, và τῶν ἀνδρῶν được giữ là nhóm nam giới. Tuy nhiên, cụm “nhiều người trong số những người” lặp từ và kém tự nhiên; chuyển trạng ngữ phân thuộc lên đầu câu giữ rõ quan hệ partitive mà tự nhiên hơn. Thêm “đã” với “tin” phản ánh rõ hơn hành động quá khứ của ἐπίστευσαν.'
