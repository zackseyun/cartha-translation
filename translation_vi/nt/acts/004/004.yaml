id: ACT.4.4
reference: Acts 4:4
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: πολλοὶ δὲ τῶν ἀκουσάντων τὸν λόγον ἐπίστευσαν, καὶ ἐγενήθη ⸀ὁ ἀριθμὸς τῶν ἀνδρῶν ⸀ὡς χιλιάδες πέντε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/004.yaml
  text: But many of those who had heard the message believed[b][a], and the number of the men became about five thousand.
translation:
  language: vi
  text: Nhưng trong số những người đã nghe sứ điệp[a], nhiều người đã tin, và số đàn ông lên đến khoảng năm ngàn[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “lời”. Ở đây, λόγος chỉ lời công bố hay sứ điệp của các sứ đồ.
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn là “số đàn ông”, có lẽ chỉ số nam giới được đếm chứ không nhất thiết là toàn bộ đám đông gồm cả nam lẫn nữ.
    reason: cultural_note
lexical_decisions:
- source_word: πολλοὶ δὲ
  choice: Nhưng nhiều người
  rationale: “Nhưng” thể hiện sự tương phản với việc bắt giữ và chống đối ở phần trước; “nhiều người” giữ nguyên sắc thái số lượng không xác định của πολλοί.
- source_word: τῶν ἀκουσάντων τὸν λόγον
  choice: trong số những người đã nghe sứ điệp
  rationale: Cấu trúc phân thuộc được giữ bằng “trong số”; phân từ aorist được diễn đạt như hành động xảy ra trước. Trong ngữ cảnh này, λόγος chỉ lời công bố của các sứ đồ, nên “sứ điệp” rõ nghĩa trong tiếng Việt hiện đại.
- source_word: ἐπίστευσαν
  choice: tin
  rationale: Cách dịch trực tiếp, tự nhiên, giữ sự đơn giản của động từ Hy Lạp và không thêm đối tượng hay công thức thần học mà nguyên văn không nêu.
- source_word: ἐγενήθη ὁ ἀριθμὸς
  choice: số ... lên đến
  rationale: Diễn đạt tự nhiên trong tiếng Việt về con số đạt tới một mức, đồng thời bảo toàn ý về trạng thái kết quả của γίνομαι.
- source_word: τῶν ἀνδρῶν
  choice: đàn ông
  rationale: ἀνήρ ở đây thường chỉ người nam, không phải từ chung cho mọi người; bản dịch giữ nét nghĩa giới tính thay vì trung tính hóa.
- source_word: ὡς χιλιάδες πέντε
  choice: khoảng năm ngàn
  rationale: ὡς đứng trước con số biểu thị sự ước lượng; “khoảng” là cách diễn đạt tự nhiên và chính xác.
theological_decisions:
- issue: Phạm vi của con số trong τῶν ἀνδρῶν
  choice: Dịch rõ là “số đàn ông”
  alternative: “số người” hoặc “số tín hữu”
  rationale: Nguyên văn dùng ἀνδρῶν, thường chỉ nam giới. Cách dịch này không kết luận rằng phụ nữ không thuộc cộng đồng tin Chúa, mà chỉ phản ánh cách câu này mô tả nhóm được đếm.
- issue: Đối tượng của hành động tin trong ἐπίστευσαν
  choice: Giữ đơn giản là “tin”
  alternative: “tin sứ điệp” hoặc “đặt đức tin nơi Chúa”
  rationale: Nguyên văn không nêu bổ ngữ trực tiếp; giữ cách diễn đạt không bổ sung giúp bảo toàn độ mở và tránh giải quyết thay cho văn bản.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “sứ điệp” để truyền đạt nghĩa theo ngữ cảnh, đồng thời ghi chú phương án sát hình thức là “lời”. Giữ “đàn ông” để phản ánh chính xác danh từ chỉ giới tính trong nguyên văn.
