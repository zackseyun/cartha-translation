source:
  edition: SBLGNT
  text: παρέστησαν οἱ βασιλεῖς τῆς γῆς καὶ οἱ ἄρχοντες συνήχθησαν ἐπὶ τὸ αὐτὸ κατὰ τοῦ κυρίου καὶ κατὰ τοῦ χριστοῦ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/026.yaml
  text: The kings of the earth took their stand[a], and the rulers were gathered together against the Lord and against his Messiah.
translation:
  language: vi
  text: 'Các vua trên đất đã đứng lên,


    các nhà cầm quyền đã cùng nhau tụ họp


    chống lại Chúa


    và chống lại Đấng Mê-si của Ngài.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “Đấng Christ”. Tiếng Hy Lạp là χριστός (Christos), nghĩa là “Đấng được xức dầu”; ở đây là “Đấng được xức dầu của Ngài”.
    reason: Nêu cách dịch thay thế và làm rõ ý nghĩa danh hiệu χριστός trong lời trích Thi Thiên 2.
lexical_decisions:
- source_word: παρέστησαν
  choice: đứng lên
  rationale: Diễn đạt hành động chủ ý đứng về phía đối nghịch trong lời trích Thi Thiên 2:2, thay vì chỉ mô tả tư thế đứng.
- source_word: βασιλεῖς τῆς γῆς
  choice: các vua trên đất
  rationale: Giữ danh xưng chính trị cụ thể và phạm vi rộng của γῆ trong ngữ cảnh Thi Thiên 2.
- source_word: οἱ ἄρχοντες
  choice: các nhà cầm quyền
  rationale: Tự nhiên trong tiếng Việt hiện đại và vẫn phân biệt với “các vua” ở vế song song.
- source_word: συνήχθησαν ἐπὶ τὸ αὐτό
  choice: cùng nhau tụ họp
  rationale: Truyền đạt việc quy tụ chung một phía, đồng lòng chống đối; câu tiếng Việt tự nhiên mà không thêm tác nhân cho thể bị động Hy Lạp.
- source_word: κατὰ
  choice: chống lại
  rationale: Thể hiện rõ ý thù nghịch trong cả hai lần xuất hiện.
- source_word: κυρίου
  choice: Chúa
  rationale: Giữ danh xưng mang trọng lượng Kinh Thánh, ở đây chỉ Đức Chúa Trời trong lời trích Thi Thiên.
- source_word: χριστοῦ αὐτοῦ
  choice: Đấng Mê-si của Ngài
  rationale: Trong lời trích Thi Thiên 2, χριστός có chức năng danh hiệu và mang nghĩa “Đấng được xức dầu”; “Đấng Mê-si” giữ rõ bối cảnh đó.
theological_decisions:
- issue: Cách dịch Χριστός trong lời trích Thi Thiên 2
  choice: Đấng Mê-si
  alternative: Đấng Christ; Đấng được xức dầu
  rationale: Danh hiệu này chỉ vị được Chúa xức dầu trong Thi Thiên 2. “Đấng Mê-si” bảo tồn khung Cựu Ước, còn chú thích nêu các cách gọi/dịch quen thuộc khác mà không đồng nhất từ này thành tên riêng.
- issue: Sở chỉ của αὐτοῦ
  choice: của Ngài, quy chiếu về Chúa
  alternative: của Chúa
  rationale: Theo cấu trúc Hy Lạp, đại từ sở hữu tự nhiên quy chiếu về “Chúa”; giữ đại từ giúp phản ánh sát quan hệ trong nguyên văn.
translation_notes:
  register: Văn phong trang trọng, hiện đại, dễ đọc; xuống dòng để làm rõ cấu trúc thi ca của lời trích. “Đứng lên” và “cùng nhau tụ họp” giữ sắc thái phối hợp chống đối mà không diễn giải quá mức.
