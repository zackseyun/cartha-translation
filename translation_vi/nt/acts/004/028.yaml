  text: to do whatever your hand and your purpose had predestined to happen[a].
translation:
  language: vi
  text: để làm mọi điều mà bàn tay Ngài và ý định Ngài đã định trước sẽ xảy ra[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đã ấn định trước” hoặc “đã quyết định từ trước.” Động từ Hy Lạp chỉ sự xác định có từ trước.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιῆσαι
  choice: để làm
  rationale: Động từ nguyên mẫu aorist diễn tả mục đích hoặc kết quả trong mạch câu trước; “để làm” trực tiếp, tự nhiên và không thêm sắc thái ngoài văn bản.
- source_word: ὅσα
  choice: mọi điều mà
  rationale: Đại từ quan hệ trung tính số nhiều có phạm vi bao quát; “mọi điều mà” truyền đạt đầy đủ ý nghĩa ấy trong tiếng Việt tự nhiên.
- source_word: χείρ
  choice: bàn tay
  rationale: Giữ hình ảnh cụ thể của nguyên văn, nơi “bàn tay” biểu thị quyền năng hoặc tác động của Đức Chúa Trời, thay vì thay thẳng bằng cách diễn giải “quyền năng”.
- source_word: βουλή
  choice: ý định
  rationale: Từ này chỉ sự cân nhắc và chủ ý; “ý định” rõ ràng trong tiếng Việt hiện đại, đồng thời không thu hẹp nghĩa thành một hệ thống thần học cụ thể.
- source_word: προώρισεν
  choice: đã định trước
  rationale: Diễn đạt trực tiếp hành động xác định từ trước và giữ nguyên sức nặng của động từ Hy Lạp mà không dùng thuật ngữ giáo phái đặc thù.
- source_word: γενέσθαι
  choice: phải xảy ra
  rationale: Trong ngữ cảnh này, γίνομαι nói về các biến cố diễn ra. “Phải xảy ra” kết hợp tự nhiên với “đã định trước” và thể hiện rằng điều được định trước chính là việc các biến cố ấy xảy đến.
theological_decisions:
- issue: Cách dịch προώρισεν trong ngữ cảnh liên quan đến quyền tể trị của Đức Chúa Trời và trách nhiệm của con người
  choice: đã định trước
  alternative: đã ấn định trước; đã quyết định từ trước
  rationale: Nguyên văn khẳng định sự xác định có từ trước của Đức Chúa Trời đối với các biến cố quanh sự thương khó của Chúa Giê-su, nhưng không giải quyết toàn bộ quan hệ giữa quyền tể trị thần linh và trách nhiệm con người. Bản dịch giữ lời khẳng định mạnh ấy mà không áp đặt một hệ thống thần học rộng hơn.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. “Bàn tay Ngài” được giữ như một hình ảnh Kinh Thánh chỉ quyền năng hoặc sự hành động; “Ngài” phù hợp lối xưng hô tôn kính với Đức Chúa Trời. Cấu trúc vẫn giữ sự căng thẳng thần học của nguyên văn, không giải thích vượt quá câu.
