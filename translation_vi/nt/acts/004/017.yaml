source:
  edition: SBLGNT
  text: ἀλλ’ ἵνα μὴ ἐπὶ πλεῖον διανεμηθῇ εἰς τὸν λαόν, ⸀ἀπειλησώμεθα αὐτοῖς μηκέτι λαλεῖν ἐπὶ τῷ ὀνόματι τούτῳ μηδενὶ ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/017.yaml
  text: But so that it may not spread any further among the people, let us warn them not to speak any longer to anyone in this name.
translation:
  language: vi
  text: 'Nhưng để việc ấy không lan rộng hơn nữa trong dân chúng, chúng ta hãy đe dọa họ: từ nay không được nói với bất cứ ai nhân danh này.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “cảnh cáo họ thật nghiêm khắc”; động từ Hy Lạp có nghĩa trực tiếp là “đe dọa” và hàm ý sự uy hiếp của nhà chức trách.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διανεμηθῇ
  choice: lan rộng
  rationale: Động từ mang ý lan truyền hoặc phổ biến; trong ngữ cảnh, “lan rộng” diễn đạt tự nhiên việc tin tức và lời giảng tiếp tục phổ biến trong dân chúng.
- source_word: ἐπὶ πλεῖον
  choice: hơn nữa
  rationale: Giữ lực so sánh của thành ngữ, chỉ sự lan truyền vượt quá mức hiện tại.
- source_word: λαός
  choice: dân chúng
  rationale: Chỉ công chúng nói chung trong bối cảnh này; “dân chúng” rõ nghĩa và tự nhiên trong tiếng Việt hiện đại.
- source_word: ἀπειλησώμεθα
  choice: chúng ta hãy đe dọa họ
  rationale: Động từ có nghĩa trực tiếp là đe dọa, phù hợp với tính cưỡng chế của hành động từ giới cầm quyền; không làm nhẹ thành một lời cảnh báo thông thường.
- source_word: μηκέτι λαλεῖν
  choice: từ nay không được nói
  rationale: 'Diễn đạt cả sự cấm đoán lẫn ý thời gian của μηκέτι: không tiếp tục nói kể từ thời điểm này.'
- source_word: ἐπὶ τῷ ὀνόματι τούτῳ
  choice: nhân danh này
  rationale: Giữ cách nói gắn lời phát biểu với danh, thẩm quyền hoặc tư cách đại diện; đại từ “này” cũng bảo tồn lối nói tránh của hội đồng.
- source_word: μηδενὶ ἀνθρώπων
  choice: với bất cứ ai
  rationale: Dịch tự nhiên đối tượng tiếp nhận lời nói trong cấu trúc phủ định, với nghĩa chỉ bất kỳ người nào.
theological_decisions:
- issue: Sắc thái cưỡng chế của ἀπειλησώμεθα
  choice: Dịch “đe dọa” trong chính văn.
  alternative: cảnh cáo nghiêm khắc
  rationale: Ngữ cảnh pháp lý và động từ Hy Lạp đều biểu thị sự hăm dọa của nhà chức trách. “Cảnh cáo” có thể làm nhẹ sức ép, nên chọn “đe dọa”; chú thích nêu phương án tiếng Việt tự nhiên khác.
- issue: Ý nghĩa của ἐπὶ τῷ ὀνόματι τούτῳ
  choice: Giữ “nhân danh này” mà không giải thích thêm danh ấy là ai.
  alternative: dựa vào danh này; nói về danh này
  rationale: Cụm Hy Lạp có thể gợi sự liên hệ, nền tảng hoặc thẩm quyền của danh. Cách dịch truyền thống nhưng vẫn hiện hành “nhân danh” bảo tồn chiều kích thẩm quyền mà không xác quyết quá mức một cách hiểu duy nhất.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “dân chúng” cho công chúng nói chung; giữ lối nói “danh này” của hội đồng và chọn “đe dọa” để phản ánh chính xác sắc thái cưỡng chế của nguyên văn.
