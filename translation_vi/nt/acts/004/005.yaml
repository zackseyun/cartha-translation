  text: Ἐγένετο δὲ ἐπὶ τὴν αὔριον συναχθῆναι αὐτῶν τοὺς ἄρχοντας καὶ ⸀τοὺς πρεσβυτέρους καὶ ⸁τοὺς γραμματεῖς ⸀ἐν Ἰερουσαλήμ
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/005.yaml
  text: And it happened that on the next day their rulers and elders and scribes were gathered together in Jerusalem,[a]
translation:
  language: vi
  text: Hôm sau, các nhà lãnh đạo, các trưởng lão và các kinh sư của họ đã được tập hợp tại Giê-ru-sa-lem.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đã họp lại” hoặc “đã tụ họp.” Động từ Hy Lạp có hình thức bị động: “đã được tập hợp.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: Hôm sau
  rationale: Công thức trần thuật này chuyển câu chuyện sang biến cố kế tiếp; trong tiếng Việt, không cần dịch máy móc là “và đã xảy ra rằng” khi mệnh đề thời gian và động từ chính đã thể hiện tự nhiên chức năng ấy.
- source_word: ἐπὶ τὴν αὔριον
  choice: Hôm sau
  rationale: Cách diễn đạt tự nhiên, gọn và chính xác cho ý “vào ngày kế tiếp”.
- source_word: συναχθῆναι
  choice: được triệu tập
  rationale: Giữ sắc thái bị động của động từ và phù hợp với bối cảnh một hội đồng lãnh đạo được tập hợp; chú thích bảo lưu các cách hiểu ít nhấn mạnh tác nhân hơn.
- source_word: αὐτῶν
  choice: của họ
  rationale: Giữ đại từ quan hệ trong nguyên văn mà không xác định quá mức tiền ngữ vốn chỉ được hiểu từ ngữ cảnh.
- source_word: τοὺς ἄρχοντας
  choice: các nhà lãnh đạo
  rationale: Chỉ những người có thẩm quyền cai quản; “nhà lãnh đạo” tự nhiên hơn “người cai trị” trong bối cảnh hội đồng này.
- source_word: τοὺς πρεσβυτέρους
  choice: các trưởng lão
  rationale: Trong ngữ cảnh thể chế, từ này chỉ những vị lãnh đạo được công nhận trong cộng đồng, không chỉ những người cao tuổi.
- source_word: τοὺς γραμματεῖς
  choice: các kinh sư
  rationale: Thuật ngữ tiếng Việt quen thuộc chỉ tầng lớp chuyên thông thạo, sao chép và giải thích Kinh Luật; sát vai trò của γραμματεῖς trong bối cảnh Do Thái.
- source_word: ἐν Ἰερουσαλήμ
  choice: tại Giê-ru-sa-lem
  rationale: Diễn đạt địa điểm hội họp một cách tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Tiền ngữ của αὐτῶν trong cụm từ chỉ các nhà chức trách
  choice: Giữ là “của họ” mà không giải thích thêm.
  alternative: Lược bỏ đại từ, hoặc diễn giải cụ thể thành “các nhà lãnh đạo Do Thái”.
  rationale: Nguyên văn có đại từ sở hữu nhưng không nêu rõ tiền ngữ ngay trong câu; bản dịch giữ quan hệ này và không thu hẹp cách hiểu.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “kinh sư” và “trưởng lão” là các thuật ngữ bối cảnh Kinh Thánh đã quen thuộc; tránh cấu trúc mở đầu dịch sát chữ nhưng thiếu tự nhiên như “Và đã xảy ra rằng”.
