  naturalness: Câu văn nhìn chung tự nhiên, trang trọng và phù hợp tiếng Việt hiện đại. “Đã được tập hợp” là cách bị động trung tính, tự nhiên đủ trong văn mạch tường thuật và tránh thêm sắc thái ‘triệu tập’.
  terminology: “Trưởng lão,” “kinh sư,” và “Giê-ru-sa-lem” phù hợp với ngữ cảnh và thông lệ thuật ngữ Kinh Thánh. “Các nhà lãnh đạo” là cách dịch chấp nhận được, bao quát của ἄρχοντες. Cụm “của họ” được giữ để không xác định quá mức tiền ngữ của αὐτῶν.
  issues:
