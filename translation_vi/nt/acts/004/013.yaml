id: ACT.4.13
reference: Acts 4:13
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Θεωροῦντες δὲ τὴν τοῦ Πέτρου παρρησίαν καὶ Ἰωάννου καὶ καταλαβόμενοι ὅτι ἄνθρωποι ἀγράμματοί εἰσιν καὶ ἰδιῶται, ἐθαύμαζον, ἐπεγίνωσκόν τε αὐτοὺς ὅτι σὺν τῷ Ἰησοῦ ἦσαν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/013.yaml
  text: As they observed the boldness of Peter and John[a], and realized that they were uneducated and ordinary men, they were astonished, and they recognized that they had been with Jesus.
translation:
  language: vi
  text: Khi thấy Phi-e-rơ và Giăng dạn dĩ, và nhận ra hai ông là những người không được học hành chính quy, chỉ thuộc hàng dân thường[a], họ kinh ngạc; họ cũng nhận biết rằng hai ông từng ở với Chúa Giê-su.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “không chữ nghĩa và là người thường.” Các từ Hy Lạp mô tả những người không được đào tạo học thuật chính quy và không có địa vị chuyên môn hay chính thức.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Θεωροῦντες
  choice: Khi thấy
  rationale: Diễn đạt tự nhiên hành động quan sát dẫn đến phản ứng của các lãnh đạo; ngữ cảnh cho thấy đây không chỉ là một cái nhìn thoáng qua.
- source_word: παρρησίαν
  choice: dạn dĩ
  rationale: Trong Công vụ, từ này thường chỉ sự can đảm và công khai, thẳng thắn khi nói; “dạn dĩ” truyền đạt tốt nét nghĩa ấy.
- source_word: καταλαβόμενοι
  choice: nhận ra
  rationale: Diễn tả việc họ đi đến chỗ hiểu được địa vị và trình độ của Phi-e-rơ và Giăng.
- source_word: ἀγράμματοί
  choice: không được học hành chính quy
  rationale: Từ này trong bối cảnh không nhất thiết có nghĩa là mù chữ, nhưng chủ yếu nói đến việc không được đào tạo chính quy về học thuật hoặc kinh sách.
- source_word: ἰδιῶται
  choice: chỉ thuộc hàng dân thường
  rationale: Giữ sự tương phản với giới chuyên môn và có địa vị chính thức, nhưng tránh sắc thái miệt thị như “ngu dốt”.
- source_word: ἐθαύμαζον
  choice: rất kinh ngạc
  rationale: Truyền đạt phản ứng ngạc nhiên mạnh và kéo dài được biểu thị bằng thì chưa hoàn thành.
- source_word: ἐπεγίνωσκόν
  choice: nhận biết
  rationale: Diễn tả sự nhận diện hoặc ý thức rõ về mối liên hệ trước đây của hai ông với Chúa Giê-su.
- source_word: σὺν τῷ Ἰησοῦ ἦσαν
  choice: từng ở với Chúa Giê-su
  rationale: “Từng ở với” diễn đạt tự nhiên mối liên hệ có trước mà các lãnh đạo nhận ra từ hoàn cảnh hiện tại.
theological_decisions:
- issue: Cách mô tả địa vị học vấn và xã hội của Phi-e-rơ cùng Giăng
  choice: “không được học hành chính quy, chỉ thuộc hàng dân thường”
  alternative: “không chữ nghĩa và là người thường”
  rationale: Bản dịch chính tránh khiến độc giả hiểu rằng hai ông hoàn toàn thất học hoặc thiếu thông minh, đồng thời vẫn giữ sự tương phản giữa họ với những người được đào tạo và giữ địa vị chuyên môn trong giới lãnh đạo tôn giáo.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “hai ông” để chỉ rõ Phi-e-rơ và Giăng, tránh sự nhập nhằng đại từ trong tiếng Việt; không thêm từ nối mang nghĩa “bấy giờ” vì nguyên văn không có trạng từ thời gian tương ứng.
