source:
  edition: SBLGNT
  text: ⸀Ἰωσὴφ δὲ ὁ ἐπικληθεὶς Βαρναβᾶς ἀπὸ τῶν ἀποστόλων, ὅ ἐστιν μεθερμηνευόμενον υἱὸς παρακλήσεως, Λευίτης, Κύπριος τῷ γένει,
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/036.yaml
  text: Joseph[a], who was called Barnabas by the apostles—which translated means son of encouragement—a Levite, a native of Cyprus,
translation:
  language: vi
  text: Còn Giô-sép, người được các sứ đồ gọi là Ba-na-ba—dịch ra có nghĩa là “con của sự khích lệ”[a]—là một người Lê-vi, quê ở Síp,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “con của sự khuyên nhủ” hoặc “con của sự an ủi.” Từ Hy Lạp có thể mang nghĩa khích lệ, khuyên nhủ hoặc an ủi.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰωσὴφ
  choice: Giô-sép
  rationale: Dùng dạng tên riêng quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
- source_word: δὲ
  choice: Còn
  rationale: Thể hiện sự chuyển ý nhẹ sang một nhân vật tiêu biểu mới, không biến liên từ thành dấu chỉ thời gian hay nhấn mạnh sự tương phản.
- source_word: ἐπικληθεὶς Βαρναβᾶς ἀπὸ τῶν ἀποστόλων
  choice: được các sứ đồ gọi là Ba-na-ba
  rationale: Diễn đạt tự nhiên thể bị động và cho thấy các sứ đồ là nguồn của tên gọi này; không thêm ý “cũng” vốn không được biểu đạt rõ trong nguyên văn.
- source_word: ὅ ἐστιν μεθερμηνευόμενον
  choice: dịch ra có nghĩa là
  rationale: Giữ chức năng giải nghĩa tên gọi của mệnh đề Hy Lạp bằng cách diễn đạt rõ ràng, tự nhiên.
- source_word: υἱὸς παρακλήσεως
  choice: con của sự khích lệ
  rationale: Giữ hình ảnh Semit “con của” và chọn nghĩa rộng, dễ hiểu của παράκλησις; các sắc thái khác được nêu trong chú thích.
- source_word: Λευίτης
  choice: một người Lê-vi
  rationale: Chỉ căn tính chi phái-tôn giáo một cách rõ ràng trong tiếng Việt hiện đại.
- source_word: Κύπριος τῷ γένει
  choice: quê ở đảo Síp
  rationale: Diễn đạt tự nhiên ý nguồn gốc/xuất thân của cụm τῷ γένει, đồng thời giúp độc giả nhận biết Síp là một hòn đảo.
theological_decisions:
- issue: Nghĩa của παρακλήσεως trong lời giải thích tên Ba-na-ba
  choice: sự khích lệ
  alternative: sự khuyên nhủ; sự an ủi
  rationale: Từ này có thể chỉ việc khích lệ, thúc giục/khuyên nhủ hoặc an ủi. Câu văn không buộc phải thu hẹp vào một sắc thái duy nhất, nên bản chính dùng nghĩa rộng và chú thích bảo lưu các khả năng khác.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu này tiếp tục sang câu kế tiếp nên giữ dấu phẩy ở cuối. Dạng “các sứ đồ” và các tên riêng Giô-sép, Ba-na-ba, Síp phù hợp cách dùng Kinh Thánh tiếng Việt quen thuộc.
