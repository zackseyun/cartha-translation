  text: καὶ ἐπέβαλον αὐτοῖς τὰς χεῖρας καὶ ἔθεντο εἰς τήρησιν εἰς τὴν αὔριον, ἦν γὰρ ἑσπέρα ἤδη.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/003.yaml
  text: And they laid hands on them and put them in custody until the next day[b][a], for it was already evening.
translation:
  language: vi
  text: Họ bắt Phi-e-rơ và Giăng[a], rồi giam giữ hai ông cho đến ngày hôm sau[b], vì lúc ấy đã là buổi tối.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “đặt tay trên họ”; trong ngữ cảnh này, thành ngữ ấy có nghĩa là bắt giữ họ.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “đặt hai ông dưới sự canh giữ” hoặc “tạm giam hai ông.” Tiếng Hy Lạp không nói rõ họ bị giữ tại cơ sở nào.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέβαλον αὐτοῖς τὰς χεῖρας
  choice: bắt Phi-e-rơ và Giăng
  rationale: Thành ngữ Hy Lạp có nghĩa đen là “đặt tay trên họ”, nhưng trong bối cảnh thù nghịch và pháp lý ở đây, nó chỉ hành động bắt giữ. Dùng tên Phi-e-rơ và Giăng làm rõ đối tượng theo ngữ cảnh gần, còn chú thích giữ lại hình ảnh nguyên văn.
- source_word: ἔθεντο εἰς τήρησιν
  choice: giam giữ hai ông
  rationale: τήρησις nói đến việc canh giữ hoặc tạm giam mà không xác định cơ sở giam giữ; “giam giữ” tự nhiên trong tiếng Việt và không diễn giải quá mức thành nhà tù.
- source_word: εἰς τὴν αὔριον
  choice: cho đến ngày hôm sau
  rationale: Diễn đạt đúng giới hạn thời gian của cụm Hy Lạp và phù hợp với lối kể chuyện.
- source_word: ἦν γὰρ ἑσπέρα ἤδη
  choice: vì lúc ấy trời đã tối
  rationale: Diễn đạt tự nhiên ý rằng lúc đó đã vào buổi tối, là lý do việc xử lý bị hoãn đến hôm sau.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Bản dịch ưu tiên nghĩa của thành ngữ Hy Lạp trong câu chính, đồng thời bảo tồn hình ảnh nguyên văn ở chú thích; tránh xác định nơi giam giữ khi bản nguồn không nêu rõ.
