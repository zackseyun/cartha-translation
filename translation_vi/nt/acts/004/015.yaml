source:
  edition: SBLGNT
  text: κελεύσαντες δὲ αὐτοὺς ἔξω τοῦ συνεδρίου ἀπελθεῖν συνέβαλλον πρὸς ἀλλήλους
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/015.yaml
  text: But after ordering them to go outside the council[a], they began conferring with one another[b],
translation:
  language: vi
  text: Nhưng sau khi truyền cho họ ra ngoài Hội đồng[a], họ bàn bạc với nhau[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “ra khỏi Công nghị”. Từ Hy Lạp συνέδριον có thể chỉ hội đồng lãnh đạo Do Thái hoặc phiên họp của hội đồng ấy.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “họ trao đổi với nhau” hoặc “họ nghị bàn với nhau”.
    reason: lexical_alternative
lexical_decisions:
- source_word: κελεύσαντες
  choice: sau khi truyền
  rationale: Phân từ bất định quá khứ diễn tả hành động xảy ra trước động từ chính; “truyền” thể hiện thẩm quyền trong bối cảnh này mà không cường điệu sắc thái.
- source_word: δὲ
  choice: Nhưng
  rationale: 'Đánh dấu bước chuyển có sắc thái tương phản nhẹ: từ cuộc đối chất công khai sang việc nghị bàn riêng.'
- source_word: αὐτοὺς
  choice: họ
  rationale: Đại từ chỉ Phi-e-rơ và Giăng; ngữ cảnh đã xác định rõ đối tượng.
- source_word: ἔξω τοῦ συνεδρίου
  choice: ra ngoài Hội đồng
  rationale: Diễn đạt việc rời khỏi nơi hiện diện hoặc phiên họp của cơ quan lãnh đạo; “Hội đồng” tự nhiên và dễ hiểu trong tiếng Việt, đồng thời giữ được khả năng chỉ cơ quan hoặc phiên họp.
- source_word: ἀπελθεῖν
  choice: ra
  rationale: Kết hợp tự nhiên với “ra ngoài” để diễn đạt việc rời khỏi phiên họp mà không lặp ý.
- source_word: συνέβαλλον
  choice: họ bàn bạc
  rationale: Trong ngữ cảnh này, động từ chỉ việc cùng trao đổi, nghị bàn; thì chưa hoàn thành gợi hành động đang diễn tiến, và “bàn bạc” thể hiện điều đó tự nhiên trong tiếng Việt.
- source_word: πρὸς ἀλλήλους
  choice: với nhau
  rationale: Cụm tương hỗ tự nhiên, cho biết các thành viên trao đổi qua lại.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Hội đồng” được viết hoa vì tại đây chỉ cơ quan lãnh đạo Do Thái cụ thể; “bàn bạc với nhau” giữ sắc thái nghị luận chung mà không xác định quá mức tính chính thức của cuộc trao đổi.
