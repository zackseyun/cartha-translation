  text: εἰ ἡμεῖς σήμερον ἀνακρινόμεθα ἐπὶ εὐεργεσίᾳ ἀνθρώπου ἀσθενοῦς, ἐν τίνι οὗτος ⸀σέσωσται,
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/009.yaml
  text: If we are being examined today concerning a good deed done to a sick man[b][a], by what means this man has been healed—
translation:
  language: vi
  text: Nếu hôm nay chúng tôi bị thẩm vấn về một việc tốt đối với một người đau yếu, tức là nhờ đâu người này được chữa lành[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “được cứu” hoặc “được lành”; động từ Hy Lạp có thể chỉ sự giải cứu, cứu rỗi hoặc chữa lành. Trong ngữ cảnh trực tiếp ở đây, sự chữa lành thể chất là nghĩa nổi bật.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνακρινόμεθα
  choice: bị thẩm vấn
  rationale: Động từ chỉ sự tra hỏi hoặc xem xét trong bối cảnh pháp lý. “Bị thẩm vấn” tự nhiên trong tiếng Việt và giữ được sắc thái chính thức mà không nhất thiết khẳng định đây là một phiên xét xử.
- source_word: ἐπὶ εὐεργεσίᾳ
  choice: về việc lành đã làm
  rationale: Cụm từ nêu căn cứ hoặc đề tài của cuộc thẩm vấn; εὐεργεσία là một hành động mang lại lợi ích. Cách dịch này giữ nét mỉa mai của việc họ bị chất vấn vì làm điều tốt.
- source_word: ἀνθρώπου ἀσθενοῦς
  choice: cho một người đau yếu
  rationale: ἀσθενής trong ngữ cảnh nói đến tình trạng suy yếu thể chất của người vốn què. “Đau yếu” đủ rộng, không quy tình trạng ấy thành một loại bệnh cụ thể.
- source_word: ἐν τίνι
  choice: nhờ đâu
  rationale: Cụm nghi vấn có thể hỏi về phương tiện hoặc tác nhân. “Nhờ đâu” giữ độ mở của tiếng Hy Lạp, để câu kế tiếp xác định Chúa Giê-su là Đấng qua đó việc chữa lành xảy ra.
- source_word: σέσωσται
  choice: được chữa lành
  rationale: Dạng hoàn thành của σῴζω ở đây chủ yếu chỉ việc người què đã được phục hồi thể chất. Chú thích giữ lại phạm vi nghĩa rộng hơn như “được cứu” và “được làm cho lành mạnh”.
theological_decisions:
- issue: Cách dịch σέσωσται trong ngữ cảnh chữa lành
  choice: được chữa lành
  alternative: được cứu; được làm cho lành mạnh
  rationale: Ngữ cảnh trực tiếp nói về sự phục hồi thể chất của người vốn què, nên nghĩa chữa lành là chính. Tuy vậy, σῴζω cũng có thể mang nghĩa cứu, vì thế chú thích bảo tồn sự giao thoa thần học ấy thay vì xóa bỏ.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Dùng “chúng tôi” phù hợp lời biện giải công khai; cấu trúc “tức là” làm rõ rằng câu hỏi “nhờ đâu” giải thích nội dung của cuộc thẩm vấn. Dấu gạch ngang cuối câu giữ câu nói tiếp nối sang câu 10.
