source:
  edition: SBLGNT
  text: ὁ δὲ Πέτρος καὶ Ἰωάννης ἀποκριθέντες ⸂εἶπον πρὸς αὐτούς⸃· Εἰ δίκαιόν ἐστιν ἐνώπιον τοῦ θεοῦ ὑμῶν ἀκούειν μᾶλλον ἢ τοῦ θεοῦ, κρίνατε,
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/019.yaml
  text: But Peter and John answered and said to them[a], “If it is right in the sight of God to listen to you rather than to God, judge for yourselves.”
translation:
  language: vi
  text: 'Nhưng Phi-e-rơ và Giăng đáp lời họ: “Trước mặt Đức Chúa Trời, nghe theo các ông hơn là nghe theo Đức Chúa Trời có phải lẽ không, chính các ông hãy xét xem.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch theo nghĩa giải thích rõ hơn: “vâng lời các ông hơn là vâng lời Đức Chúa Trời.” Động từ Hy Lạp có nghĩa đen là “nghe”, nhưng trong ngữ cảnh này mang ý nghe theo thẩm quyền.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ Πέτρος καὶ Ἰωάννης
  choice: Nhưng Phi-e-rơ và Giăng
  rationale: δέ đánh dấu sự tương phản với mệnh lệnh vừa được ban ra; “nhưng” diễn đạt tự nhiên bước ngoặt này.
- source_word: ἀποκριθέντες εἶπον πρὸς αὐτούς
  choice: đáp lời họ
  rationale: Cụm phân từ cộng động từ hữu hạn là lối diễn đạt Hy Lạp chịu ảnh hưởng Semit. Tiếng Việt không cần lặp “đáp và nói”; “đáp lời họ” giữ trọn chức năng mà tự nhiên.
- source_word: δίκαιόν
  choice: phải lẽ
  rationale: Trong ngữ cảnh này, từ chỉ điều đúng đắn, chính đáng trước sự phán xét của Đức Chúa Trời; “phải lẽ” tự nhiên trong câu hỏi trực tiếp và giữ sắc thái luân lý.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: trước mặt Đức Chúa Trời
  rationale: Giữ hình ảnh nguyên ngữ và hàm ý điều được đánh giá trong sự hiện diện, dưới sự phán xét của Đức Chúa Trời.
- source_word: ἀκούειν
  choice: nghe theo
  rationale: ἀκούω theo nghĩa đen là nghe, nhưng ở đây chỉ việc lưu tâm và làm theo thẩm quyền. “Nghe theo” vừa giữ hình ảnh nghe vừa truyền đạt hàm ý vâng lời, không mạnh hóa thành một động từ thuần túy nghĩa là “vâng phục”.
- source_word: μᾶλλον ἢ
  choice: hơn là
  rationale: Diễn đạt tự nhiên cấu trúc so sánh đối lập giữa hai đối tượng được nghe theo.
- source_word: κρίνατε
  choice: Xin chính các ông xét xem
  rationale: Mệnh lệnh trực tiếp thách thức người nghe tự đưa ra phán đoán. “chính các ông” làm rõ lực diễn ngôn hàm ẩn; “xin” giúp câu thách thức trang trọng, tự nhiên mà không xóa lực mệnh lệnh.
theological_decisions:
- issue: Có nên dịch ἀκούειν theo lối giải nghĩa hoàn toàn là “vâng lời” trong sự đối lập giữa nhà cầm quyền loài người và Đức Chúa Trời hay không
  choice: Dùng “nghe theo” trong chính văn
  alternative: vâng lời các ông hơn là vâng lời Đức Chúa Trời
  rationale: Ngữ cảnh rõ ràng liên quan đến sự tuân lệnh, nhưng nguyên ngữ dùng động từ “nghe”. “Nghe theo” truyền đạt hàm ý phục tùng thẩm quyền mà vẫn bảo tồn hình ảnh và độ mở từ vựng của bản Hy Lạp.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng tên quen thuộc “Phi-e-rơ”, “Giăng” và danh xưng “Đức Chúa Trời”. Cấu trúc câu được sắp xếp tự nhiên cho lời nói trực tiếp, đồng thời giữ sự tương phản và lời thách thức trong nguyên ngữ.
