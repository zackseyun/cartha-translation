id: ACT.4.30
reference: Acts 4:30
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐν τῷ τὴν χεῖρά ⸀σου ἐκτείνειν σε εἰς ἴασιν καὶ σημεῖα καὶ τέρατα γίνεσθαι διὰ τοῦ ὀνόματος τοῦ ἁγίου παιδός σου Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/030.yaml
  text: while you stretch out your hand for healing[a], and signs and wonders are done through the name of your holy servant Jesus.
translation:
  language: vi
  text: trong khi Ngài giơ tay ra để chữa lành, và các dấu lạ cùng phép mầu xảy ra qua danh của Đầy Tớ thánh của Ngài[a] là Đức Chúa Jêsus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “người con thánh của Ngài là Đức Chúa Jêsus.” Từ Hy Lạp pais có thể có nghĩa là “con trẻ” hoặc “đầy tớ”; ở đây chọn “Đầy Tớ” vì sách Công Vụ gợi lại ngôn ngữ về Đầy Tớ trong sách Ê-sai.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν τῷ ... ἐκτείνειν
  choice: trong khi ... giơ ... ra
  rationale: Kết cấu ἐν τῷ với động từ nguyên mẫu diễn tả hoàn cảnh đồng thời; “trong khi” tự nhiên trong tiếng Việt và giữ được mối liên hệ với lời cầu nguyện ở câu trước.
- source_word: τὴν χεῖρά σου
  choice: tay Ngài
  rationale: Giữ hình ảnh Kinh Thánh về bàn tay Đức Chúa Trời hành động, nhưng dùng “tay” tự nhiên hơn “bàn tay” trong kết cấu “giơ tay ra”.
- source_word: εἰς ἴασιν
  choice: để chữa lành
  rationale: Diễn đạt tự nhiên ý mục đích của εἰς và danh từ ἴασις mà không thêm đối tượng không có trong nguyên văn.
- source_word: σημεῖα καὶ τέρατα
  choice: các dấu lạ cùng phép mầu
  rationale: Giữ cặp thuật ngữ quen thuộc của Công Vụ; “dấu lạ” nhấn mạnh ý nghĩa chỉ dấu, còn “phép mầu” diễn tả những việc gây kinh ngạc.
- source_word: γίνεσθαι
  choice: khiến ... xảy ra
  rationale: Động từ nguyên mẫu này song song với ἐκτείνειν và cùng phụ thuộc vào chủ thể “Ngài”; cách diễn đạt chủ động trong tiếng Việt làm rõ cú pháp Hy Lạp mà không thay đổi tác nhân.
- source_word: διὰ τοῦ ὀνόματος
  choice: qua danh
  rationale: Giữ nghĩa phương tiện/tác nhân của διά với sở hữu cách và khái niệm Kinh Thánh về quyền năng gắn với danh Chúa, không diễn giải quá mức thành “thẩm quyền”.
- source_word: τοῦ ἁγίου παιδός σου Ἰησοῦ
  choice: của Đầy Tớ thánh của Ngài là Đức Chúa Jêsus
  rationale: παῖς có thể là “con trẻ” hoặc “đầy tớ”; văn cảnh Công Vụ 3–4 vọng lại hình tượng Đầy Tớ trong Ê-sai nên chọn “Đầy Tớ,” đồng thời chú thích nghĩa thay thế. Viết hoa như một tước hiệu trong ngữ cảnh này.
theological_decisions:
- issue: Cách dịch παῖς khi nói về Đức Chúa Jêsus
  choice: Đầy Tớ
  alternative: Con thánh
  rationale: Cả hai nghĩa đều có cơ sở từ vựng, nhưng sự lặp lại của παῖς trong Công Vụ 3:13, 3:26 và 4:27, 30 cùng âm hưởng Ê-sai 52–53 nghiêng về “Đầy Tớ.” Chú thích giữ lại sự mơ hồ có thật của từ Hy Lạp.
- issue: Quan hệ tác nhân trong γίνεσθαι
  choice: Ngài khiến các dấu lạ cùng phép mầu xảy ra
  alternative: các dấu lạ cùng phép mầu xảy ra
  rationale: Hai động từ nguyên mẫu ἐκτείνειν và γίνεσθαι đều nằm trong kết cấu tiếp nối lời cầu xin hướng về Đức Chúa Trời. Tiếng Việt chủ động nêu rõ mối liên hệ cú pháp ấy, nhưng không xác định thêm cách thức ngoài cụm “qua danh”.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng đại từ tôn kính “Ngài” cho Đức Chúa Trời; giữ các thành ngữ Kinh Thánh “giơ tay ra,” “dấu lạ cùng phép mầu,” và “qua danh.” Dấu chú thích [a] được đặt ngay sau cụm từ có phương án dịch thay thế.
