language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ ⸂τοῦ πατρὸς ἡμῶν⸃ διὰ ⸂πνεύματος ἁγίου⸃ στόματος Δαυὶδ παιδός σου εἰπών· Ἱνατί ἐφρύαξαν ἔθνη καὶ λαοὶ ἐμελέτησαν κενά;
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/025.yaml
  text: 'who[a], through the Holy Spirit, by the mouth of David your servant, said: ‘Why did the nations rage[b], and the peoples devise vain things?’'
translation:
  language: vi
  text: 'là Đấng, qua Đức Thánh Linh, đã dùng miệng Đa-vít, tôi tớ Ngài, là tổ phụ chúng con[a], mà phán:


    “Vì sao các dân nổi cơn thịnh nộ[b],

    và các dân tộc mưu tính những điều hư không?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Một số thủ bản không có “là tổ phụ chúng con”. Khi đó, phần dẫn nhập có thể dịch: “là Đấng, qua Đức Thánh Linh, đã dùng miệng Đa-vít, tôi tớ Ngài, mà phán.”'
    reason: textual_variant
  - marker: b
    text: Cũng có thể dịch là “gầm thét”. Động từ Hy Lạp diễn tả sự náo động dữ dội và chống nghịch.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ⸂τοῦ πατρὸς ἡμῶν⸃
  choice: là Đấng
  rationale: Dùng cụm nối trở lại với Đức Chúa Trời ở câu 24, đồng thời không đưa phần dị bản khó xác định “tổ phụ chúng con” vào chính văn; dị bản được bảo lưu trong chú thích.
- source_word: διὰ πνεύματος ἁγίου
  choice: qua Đức Thánh Linh
  rationale: Giữ ý phương tiện hoặc tác nhân của διά với sở hữu cách và nhắc rõ Đức Thánh Linh.
- source_word: στόματος Δαυὶδ
  choice: đã dùng miệng Đa-vít ... mà phán
  rationale: Bảo tồn hình ảnh Kinh Thánh về lời Đức Chúa Trời được truyền qua miệng người phát ngôn, nhưng diễn đạt tự nhiên trong tiếng Việt.
- source_word: παιδός σου
  choice: tôi tớ Ngài
  rationale: Trong ngữ cảnh nói về Đa-vít phục vụ Đức Chúa Trời, “tôi tớ” phù hợp hơn nghĩa “con trẻ” của παῖς.
- source_word: Ἱνατί
  choice: Vì sao
  rationale: Cách hỏi trang trọng, tự nhiên, phù hợp với lời trích Thi Thiên.
- source_word: ἐφρύαξαν
  choice: nổi loạn
  rationale: Truyền đạt trạng thái sôi sục, ngạo nghễ và chống nghịch của động từ trong ngữ cảnh; chú thích giữ nghĩa gần hình ảnh “gầm thét”.
- source_word: ἔθνη
  choice: các dân
  rationale: Chỉ rộng đến các dân ngoại quốc trong lời Thi Thiên, không thu hẹp thành một phạm trù tôn giáo-xã hội.
- source_word: λαοὶ
  choice: các dân tộc
  rationale: Giữ số nhiều và phép song song thi ca với ἔθνη.
- source_word: ἐμελέτησαν
  choice: mưu tính
  rationale: Trong ngữ cảnh thù nghịch, động từ mang nghĩa suy tính hoặc hoạch định âm mưu; “mưu tính” vẫn giữ sắc thái suy nghĩ có chủ ý.
- source_word: κενά
  choice: những điều hư không
  rationale: Giữ sắc thái trống rỗng, vô ích của κενά và âm hưởng trang trọng của lời trích Thi Thiên.
theological_decisions:
- issue: Dạng văn bản của công thức dẫn nhập lời trích
  choice: Không đưa “tổ phụ chúng con” vào chính văn; dùng “là Đấng” để nối với Đức Chúa Trời ở câu trước.
  alternative: 'Đọc theo một số thủ bản: “qua Đức Thánh Linh, đã dùng miệng tổ phụ chúng con là Đa-vít, tôi tớ Ngài, mà phán.”'
  rationale: Cụm τοῦ πατρὸς ἡμῶν có chứng cứ thủ bản không đồng nhất và vị trí cú pháp khó; chú thích bảo tồn dị bản mà không áp đặt nó lên chính văn.
- issue: Sắc thái của ἐμελέτησαν trong lời Thi Thiên
  choice: mưu tính
  alternative: suy tưởng về
  rationale: Ngữ cảnh chống nghịch ủng hộ nghĩa lập mưu, nhưng cách dịch “mưu tính” vẫn không tách hẳn khỏi ý suy nghĩ, nghiền ngẫm vốn có của động từ.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ đọc; giữ cấu trúc thi ca của lời trích, thuật ngữ “Đức Thánh Linh” quen thuộc, cùng hình ảnh “dùng miệng ... mà phán” để phản ánh thành ngữ Kinh Thánh.
