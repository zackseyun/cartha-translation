  text: τόν ⸀τε ἄνθρωπον βλέποντες σὺν αὐτοῖς ἑστῶτα τὸν τεθεραπευμένον οὐδὲν εἶχον ἀντειπεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/014.yaml
  text: And seeing the man who had been healed standing with them[a], they had nothing to say in reply.
translation:
  language: vi
  text: Và khi thấy người đã được chữa lành đứng cùng với hai ông, họ không có gì để phản bác.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “họ không thể nói gì để phản đối” hoặc “họ không có gì để đáp lại.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: τε
  choice: Nhưng
  rationale: Tiểu từ τε liên kết câu này với diễn tiến trước đó; trong ngữ cảnh, “Nhưng” diễn đạt tự nhiên sự tương phản giữa bằng chứng họ đang thấy và việc họ không thể phản bác.
- source_word: ἄνθρωπον
  choice: người
  rationale: Chỉ người đàn ông cụ thể đã được chữa lành trong văn cảnh; tiếng Việt dùng “người” tự nhiên mà không làm mất quy chiếu.
- source_word: βλέποντες
  choice: khi thấy
  rationale: Phân từ hiện tại diễn tả hành động đồng thời với động từ chính; mệnh đề thời gian “khi thấy” rõ và tự nhiên trong tiếng Việt.
- source_word: σὺν αὐτοῖς
  choice: cùng với hai ông
  rationale: σύν với tặng cách diễn tả sự đồng hành. “Hai ông” làm rõ αὐτοῖς chỉ Phi-e-rơ và Giăng theo văn cảnh mà không thêm một nhân vật mới.
- source_word: ἑστῶτα
  choice: đứng
  rationale: Phân từ hoàn thành của ἵστημι mô tả trạng thái đang đứng; “đứng” là cách diễn đạt gọn và tự nhiên.
- source_word: τεθεραπευμένον
  choice: đã được chữa lành
  rationale: Phân từ hoàn thành bị động xác định người này qua việc chữa lành đã hoàn tất với kết quả còn hiện hữu; cách dịch giữ cả tính bị động lẫn sắc thái kết quả.
- source_word: οὐδὲν
  choice: không có gì
  rationale: Diễn tả sự hoàn toàn không có điều gì để nói chống lại.
- source_word: εἶχον ἀντειπεῖν
  choice: không có gì để phản bác
  rationale: Cấu trúc ἔχω + động từ nguyên mẫu cùng ἀντειπεῖν diễn tả không có lời hoặc cơ sở để nói ngược lại; “phản bác” giữ sắc thái đối kháng và tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Đối tượng của sự phản bác không được nêu rõ
  choice: 'Giữ cấu trúc không nêu đối tượng: “không có gì để phản bác”'
  alternative: “không thể nói gì chống lại việc ấy” hoặc “không có gì để đáp lại”
  rationale: Bản Hy Lạp không nói rõ họ phản bác người, lời chứng hay sự việc chữa lành; bản dịch không nên tự ý xác định.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “chữa lành” phù hợp bối cảnh phép lạ; “phản bác” giữ lực đối kháng của ἀντειπεῖν. Dấu chú thích [a] được đặt ngay sau mệnh đề liên quan.
