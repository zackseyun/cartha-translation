  verdict: revise
  source_fidelity: 'Cần sửa liên từ đầu câu: τε là tiểu từ nối kết (“và/cũng”), không tự nó biểu thị tương phản như “Nhưng”. Các thành phần còn lại chuyển tải đúng người đã được chữa lành đang đứng với Phi-e-rơ và Giăng, cùng việc những người lãnh đạo không thể đưa ra lời phản bác.'
  naturalness: Câu sửa vẫn tự nhiên trong tiếng Việt hiện đại, với văn phong trang trọng vừa phải. “Không có gì để phản bác” diễn đạt gọn ý không có lời lẽ hay cơ sở để nói ngược lại, mà không buộc phải nêu đối tượng của sự phản bác.
  terminology: “Được chữa lành” giữ được thể bị động hoàn thành của τεθεραπευμένον và phù hợp ngữ cảnh phép lạ. “Hai ông” được văn cảnh trước đó xác định là Phi-e-rơ và Giăng. Chú thích được điều chỉnh để các cách dịch thay thế không thêm một đối tượng xác định (“việc ấy”) vốn không được nêu trong tiếng Hy Lạp.
  issues:
