  - severity: low
    issue: Cách thay thế trong chú thích “chống lại việc ấy” xác định đối tượng không được nêu rõ.
    rationale: ἀντειπεῖν không có bổ ngữ trực tiếp trong câu. Nên giữ cách diễn đạt không xác định đối tượng để bảo toàn tính mở của nguyên văn.
  revised_text: Và khi thấy người đã được chữa lành đứng cùng với hai ông, họ không có gì để phản bác.[a]
