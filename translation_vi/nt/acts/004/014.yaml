revisions:
- from: Nhưng khi thấy người đã được chữa lành đứng cùng với hai ông, họ không có gì để phản bác.[a]
  to: Và khi thấy người đã được chữa lành đứng cùng với hai ông, họ không có gì để phản bác.[a]
  rationale: Đổi “Nhưng” thành “Và” để phản ánh đúng lực nối kết của τε. Điều chỉnh chú thích nhằm giữ sự mơ hồ của đối tượng bị phản đối/phản bác trong nguyên văn, đồng thời duy trì các phương án diễn đạt tự nhiên.
