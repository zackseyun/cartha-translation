id: ACT.4.2
reference: Acts 4:2
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: διαπονούμενοι διὰ τὸ διδάσκειν αὐτοὺς τὸν λαὸν καὶ καταγγέλλειν ἐν τῷ Ἰησοῦ τὴν ἀνάστασιν ⸂τὴν ἐκ⸃ νεκρῶν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/002.yaml
  text: being greatly disturbed because they were teaching the people and proclaiming in Jesus the resurrection from the dead,[a]
translation:
  language: vi
  text: họ rất bực tức vì hai ông dạy dỗ dân chúng và công bố sự sống lại từ cõi chết nơi Giê-su.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “công bố rằng, trong trường hợp Giê-su, có sự sống lại từ cõi chết.” Cụm Hy Lạp “nơi Giê-su” có thể đặc biệt chỉ sự sống lại được biểu lộ qua chính việc Ngài sống lại.'
    reason: alternative_reading
lexical_decisions:
- source_word: διαπονούμενοι
  choice: rất bực tức
  rationale: Diễn tả sự khó chịu, bực bội mạnh của giới lãnh đạo; tự nhiên trong tiếng Việt và không làm nhẹ sắc thái như “khó chịu”.
- source_word: διὰ τὸ διδάσκειν αὐτοὺς
  choice: vì hai ông dạy dỗ
  rationale: διά với động từ nguyên mẫu có mạo từ chỉ nguyên nhân. “Hai ông” nối tự nhiên với Phi-e-rơ và Giăng trong ngữ cảnh trước mà không thêm chức danh.
- source_word: τὸν λαὸν
  choice: dân chúng
  rationale: Chỉ dân chúng như một tập thể, không chỉ một đám đông tình cờ.
- source_word: καταγγέλλειν
  choice: công bố
  rationale: Giữ ý nghĩa loan báo công khai, trang trọng, đồng thời phù hợp với văn phong tiếng Việt hiện đại.
- source_word: ἐν τῷ Ἰησοῦ
  choice: trong Đức Chúa Jêsus
  rationale: 'Dịch trực tiếp ἐν để giữ độ mở: sự sống lại được biểu lộ, đặt trọng tâm hoặc được xác chứng nơi Đức Chúa Jêsus, thay vì quyết định hẳn là “nhờ” hay chỉ “trường hợp của” Ngài.'
- source_word: τὴν ἀνάστασιν τὴν ἐκ νεκρῶν
  choice: sự sống lại từ cõi chết
  rationale: Cách nói rõ ràng, trang trọng và quen thuộc, diễn đạt việc sống lại từ giữa những người chết mà không quá nặng tính sát chữ.
theological_decisions:
- issue: Ý nghĩa của ἐν τῷ Ἰησοῦ đối với lời công bố về sự sống lại
  choice: trong Đức Chúa Jêsus
  alternative: qua Đức Chúa Jêsus; nơi trường hợp Đức Chúa Jêsus
  rationale: Giới từ ἐν cho phép nhiều sắc thái gần nhau. Bản văn chính giữ cách diễn đạt trực tiếp để không thu hẹp ý nghĩa; chú thích nêu rõ khả năng nhấn mạnh sự sống lại được chứng tỏ qua chính việc Đức Chúa Jêsus sống lại.
- issue: Phạm vi của “sự sống lại từ cõi chết”
  choice: Giữ cách diễn đạt có thể bao gồm cả sự sống lại của Đức Chúa Jêsus lẫn sự sống lại nói chung được xác chứng nơi Ngài
  alternative: Chỉ sự sống lại của riêng Đức Chúa Jêsus; hoặc chỉ giáo lý về sự sống lại cuối cùng
  rationale: Câu Hy Lạp có thể gợi cả biến cố Đức Chúa Jêsus sống lại và niềm hy vọng sống lại rộng hơn dựa trên Ngài; bản dịch không giới hạn điều câu văn chưa giới hạn.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “rất bực tức” để giữ cường độ cảm xúc; cấu trúc câu nối tiếp câu 1 theo dạng phân từ của nguyên văn. Danh xưng “Đức Chúa Jêsus” phù hợp văn phong Kinh Thánh trang trọng.
