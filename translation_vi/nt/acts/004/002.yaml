review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng nguyên nhân và nội dung chung, nhưng thêm danh xưng “Đức Chúa” không có trong nguyên văn, và cấu trúc “công bố rằng trong ... có” tái phân tích quan hệ của ἐν τῷ Ἰησοῦ với “sự sống lại”. Cách “nơi Giê-su” gắn trực tiếp cụm giới từ với lời công bố về sự sống lại, đồng thời vẫn để ngỏ các sắc thái của ἐν.
  naturalness: “Rất bực tức” và “dạy dỗ dân chúng” tự nhiên trong văn phong trang trọng hiện đại. “Sự sống lại từ cõi chết nơi Giê-su” là cách diễn đạt tiếng Việt tự nhiên hơn “rằng trong ... có sự sống lại”, mà không biến ἐν thành “qua/nhờ”.
  terminology: Dùng “Giê-su” theo chính tả tiếng Việt hiện đại. Không thêm tước hiệu thần học vào tên riêng khi câu Hy Lạp chỉ có Ἰησοῦ. “Sự sống lại từ cõi chết” giữ được ἀνάστασις ἐκ νεκρῶν.
  issues:
  - severity: medium
    issue: Thêm “Đức Chúa” vào tên Giê-su
    rationale: Nguyên văn chỉ viết ἐν τῷ Ἰησοῦ, không có κύριος hay một tước hiệu tương đương. Việc thêm danh xưng làm bản dịch vượt quá văn bản nguồn.
  - severity: medium
    issue: “công bố rằng trong ... có sự sống lại” làm thay đổi cách liên kết cú pháp
    rationale: Nguyên văn phối hợp “dạy” và “công bố”, với ἐν τῷ Ἰησοῦ đi cùng nội dung “sự sống lại từ cõi chết”. Bản sửa giữ cụm này là nội dung trực tiếp được công bố và bảo toàn tính mơ hồ của ἐν.
  - severity: low
    issue: Chú thích dùng “qua trường hợp” như thể là cách dịch thay thế trực tiếp
    rationale: Đây là lời giải thích một khả năng ngữ nghĩa, không phải tương đương trực tiếp, tự nhiên của cụm Hy Lạp. Cần diễn đạt là “trong trường hợp” và nêu rõ tính khả dĩ.
