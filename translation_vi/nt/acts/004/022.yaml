id: ACT.4.22
reference: Acts 4:22
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐτῶν γὰρ ἦν πλειόνων τεσσεράκοντα ὁ ἄνθρωπος ἐφ’ ὃν ⸀γεγόνει τὸ σημεῖον τοῦτο τῆς ἰάσεως.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/022.yaml
  text: For the man on whom this sign of healing had happened was more than forty years old[a].
translation:
  language: vi
  text: Vì dấu lạ chữa lành này đã xảy đến với người ấy, một người đã hơn bốn mươi tuổi[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “dấu lạ này về sự chữa lành.”'
    reason: Cụm τὸ σημεῖον τοῦτο τῆς ἰάσεως có thể được diễn đạt bằng kết cấu danh từ khác, trong đó «này» bổ nghĩa trực tiếp cho «dấu lạ».
lexical_decisions:
- source_word: ἐτῶν ... πλειόνων τεσσεράκοντα
  choice: đã hơn bốn mươi tuổi
  rationale: Cách nói tự nhiên trong tiếng Việt để diễn đạt thành ngữ Hy Lạp chỉ tuổi tác, đồng thời giữ rõ ý người ấy trên bốn mươi tuổi.
- source_word: γὰρ
  choice: Vì
  rationale: Nối câu này với lời giải thích ở câu trước, đúng chức năng giải thích của γάρ.
- source_word: ὁ ἄνθρωπος
  choice: người
  rationale: Chỉ người đàn ông đã được nhắc đến trong ngữ cảnh; tiếng Việt không cần lặp từ chỉ giới tính vì nhân vật đã được xác định rõ.
- source_word: ἐφ’ ὃν ... γεγόνει
  choice: đã trải qua
  rationale: Diễn đạt tự nhiên việc dấu lạ đã xảy đến với người ấy, đồng thời tránh thêm một tác nhân không được nêu trực tiếp trong động từ γίνομαι.
- source_word: τὸ σημεῖον τοῦτο
  choice: dấu lạ ... này
  rationale: Giữ sắc thái của σημεῖον là một sự kiện có ý nghĩa chứng thực, thay vì thu hẹp thành một hiện tượng kỳ diệu đơn thuần.
- source_word: τῆς ἰάσεως
  choice: chữa lành
  rationale: Diễn đạt ngắn gọn và tự nhiên bản chất chữa lành của dấu lạ; đây là cách dùng quen thuộc, trang trọng trong tiếng Việt hiện đại.
theological_decisions:
- issue: Cách dịch σημεῖον trong bối cảnh phép lạ
  choice: dấu lạ
  alternative: phép lạ
  rationale: “Dấu lạ” bảo toàn ý nghĩa chứng thực và mặc khải của σημεῖον trong Công Vụ, trong khi “phép lạ” chủ yếu nhấn mạnh tính phi thường.
- issue: Tác nhân được hàm ý trong γεγόνει
  choice: đã trải qua
  alternative: đã được thực hiện trên người ấy
  rationale: Bản Hy Lạp tập trung vào sự kiện đã xảy đến với người đàn ông chứ không nêu trực tiếp tác nhân; cách dịch này không tự ý làm rõ điều câu văn để ngỏ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cụm “trải qua dấu lạ chữa lành” giữ trọng tâm vào sự kiện xảy đến với người ấy, dù hơi cô đọng để bảo toàn cấu trúc và sắc thái của nguyên文.
