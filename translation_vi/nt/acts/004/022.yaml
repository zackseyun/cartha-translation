  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng tuổi tác (hơn bốn mươi) và giữ được ý dấu lạ chữa lành đã xảy đến với người đàn ông, không thêm tác nhân. Tuy nhiên, «người đã trải qua dấu lạ» không phản ánh tự nhiên và chính xác nhất quan hệ ἐφ’ ὃν ... γεγόνει, vốn đặt dấu lạ như sự việc xảy đến trên/với người ấy.
  naturalness: «Trải qua dấu lạ chữa lành» là kết hợp từ không tự nhiên trong tiếng Việt hiện đại; «trải qua» thường đi với biến cố, thời gian, thử thách hơn là một «dấu lạ». Đảo cấu trúc để dấu lạ làm chủ ngữ tạo câu rõ ràng, trang trọng và tự nhiên hơn.
  terminology: Giữ «dấu lạ» cho σημεῖον và «chữa lành» cho ἴασις là phù hợp. «Người ấy» bảo toàn tính xác định của ὁ ἄνθρωπος trong ngữ cảnh mà không cần thêm giới tính không cần thiết.
