  rationale: Bản sửa chuyển «dấu lạ chữa lành này» thành chủ thể của sự việc «đã xảy đến với người ấy», tương ứng sát với ἐφ’ ὃν γεγόνει mà không chuyển sang bị động hay quy tác nhân. Cụm «một người đã hơn bốn mươi tuổi» giữ đúng ý thành ngữ chỉ tuổi tác và đọc tự nhiên trong tiếng Việt.
