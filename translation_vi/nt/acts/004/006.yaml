  - severity: low
    issue: Vị trí ký hiệu chú thích
    rationale: Ký hiệu [a] hiện đứng sau dấu chấm. Nên đặt ngay sau “gia tộc thượng tế”, trước dấu chấm, để neo chính xác vào cụm ἐκ γένους ἀρχιερατικοῦ.
