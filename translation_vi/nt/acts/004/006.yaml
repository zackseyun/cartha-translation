id: ACT.4.6
reference: Acts 4:6
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: (καὶ ⸂Ἅννας ὁ ἀρχιερεὺς καὶ Καϊάφας καὶ Ἰωάννης καὶ Ἀλέξανδρος⸃ καὶ ὅσοι ἦσαν ἐκ γένους ἀρχιερατικοῦ),
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/006.yaml
  text: and Annas the high priest[a], and Caiaphas, and John, and Alexander, and all who were of the high-priestly family,
translation:
  language: vi
  text: và thượng tế An-na, Cai-pha, Giăng, A-léc-xan-đơ, và tất cả những người thuộc gia tộc thượng tế[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “thuộc dòng dõi thượng tế” hoặc “xuất thân từ gia tộc thượng tế.”
    reason: Nêu các cách diễn đạt hợp nghĩa của ἐκ γένους ἀρχιερατικοῦ, vì γένος có thể nhấn mạnh gia tộc, dòng dõi hoặc nguồn gốc.
lexical_decisions:
- source_word: Ἅννας
  choice: An-na
  rationale: Dùng dạng phiên âm quen thuộc trong tiếng Việt cho tên riêng Hy Lạp Ἅννας.
- source_word: ὁ ἀρχιερεὺς
  choice: thượng tế
  rationale: Danh từ số ít chỉ chức vị thượng tế và đứng đồng vị với An-na. Giữ nguyên danh hiệu mà bản Hy Lạp gán cho ông, không điều chỉnh theo vấn đề lịch sử về người đương nhiệm.
- source_word: Καϊάφας
  choice: Cai-pha
  rationale: Dùng dạng phiên âm Kinh Thánh quen thuộc và dễ nhận biết trong tiếng Việt.
- source_word: Ἰωάννης
  choice: Giăng
  rationale: Dùng dạng tên truyền thống, phổ biến trong các bản Kinh Thánh tiếng Việt; không chuyển thành dạng Hê-bơ-rơ suy đoán.
- source_word: Ἀλέξανδρος
  choice: A-léc-xan-đơ
  rationale: Phiên âm tên riêng Hy Lạp theo cách tự nhiên, dễ đọc trong tiếng Việt hiện đại.
- source_word: ὅσοι
  choice: tất cả những người
  rationale: Diễn đạt tự nhiên giá trị bao quát của đại từ quan hệ số nhiều.
- source_word: ἦσαν
  choice: thuộc
  rationale: Trong kết cấu ἦσαν ἐκ γένους, tiếng Việt tự nhiên diễn đạt quan hệ thành viên hay xuất thân bằng “thuộc”; ý quá khứ được ngữ cảnh tường thuật cung cấp.
- source_word: ἐκ γένους ἀρχιερατικοῦ
  choice: thuộc gia tộc thượng tế
  rationale: γένος có thể chỉ gia tộc, dòng dõi hay nhóm thân tộc; ἀρχιερατικός nói đến thượng tế hoặc chức thượng tế. “Gia tộc thượng tế” giữ được ý về quan hệ huyết tộc mà không biến mọi người thành người đang giữ chức.
theological_decisions:
- issue: Gọi An-na là “thượng tế” dù Cai-pha là người đương nhiệm vào thời điểm lịch sử này
  choice: 'Giữ trực tiếp danh hiệu của bản Hy Lạp: “thượng tế An-na”'
  alternative: “An-na, nguyên thượng tế” hoặc “An-na, một thủ lĩnh tế lễ”
  rationale: Bản Hy Lạp gọi An-na là ὁ ἀρχιερεύς. Bản dịch không nên âm thầm giải quyết căng thẳng lịch sử bằng cách thêm “nguyên” hay đổi chức danh.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại. Câu được giữ như một phần tiếp nối của danh sách ở câu trước bằng “cùng với”. Tên riêng dùng các dạng tiếng Việt quen thuộc; dấu chú thích [a] xuất hiện ngay sau cụm từ liên quan.
