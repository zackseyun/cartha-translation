  source_fidelity: 'Bản dịch chuyển tải đúng các ý chính: lời cầu nguyện, nơi nhóm họp bị rung chuyển, mọi người được đầy Đức Thánh Linh, và việc nói lời Đức Chúa Trời cách dạn dĩ. Tuy nhiên, “đang nhóm họp” dễ gợi tiến trình cuộc họp đang diễn ra hơn là trạng thái “đã tụ họp” của kết cấu ἦσαν συνηγμένοι. Vị trí ký hiệu chú thích b cũng cần gắn trực tiếp với cụm được chú giải.'
