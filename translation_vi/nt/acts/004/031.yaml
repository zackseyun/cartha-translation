id: ACT.4.31
reference: Acts 4:31
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ δεηθέντων αὐτῶν ἐσαλεύθη ὁ τόπος ἐν ᾧ ἦσαν συνηγμένοι, καὶ ἐπλήσθησαν ἅπαντες ⸂τοῦ ἁγίου πνεύματος⸃, καὶ ἐλάλουν τὸν λόγον τοῦ θεοῦ μετὰ παρρησίας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/031.yaml
  text: And when they had prayed[a], the place in which they were gathered was shaken[b], and they were all filled with the Holy Spirit and were speaking the word of God with boldness.
translation:
  language: vi
  text: Sau khi họ cầu nguyện, nơi họ đang tụ họp[a] rung chuyển. Tất cả đều được đầy dẫy Đức Thánh Linh và cứ nói lời Đức Chúa Trời một cách dạn dĩ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “nơi họ đã tụ họp.” Tiếng Hy Lạp mô tả họ đang ở trong trạng thái đã được tập hợp lại.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “một cách tự tin” hoặc “một cách thẳng thắn.” Từ Hy Lạp chỉ lời nói công khai, không sợ hãi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δεηθέντων αὐτῶν
  choice: Sau khi họ cầu nguyện
  rationale: Cụm phân từ bất định trong kết cấu sở hữu tuyệt đối nêu hoàn cảnh thời gian. “Sau khi họ cầu nguyện” tự nhiên trong tiếng Việt và giữ đúng trình tự của câu.
- source_word: ἐσαλεύθη
  choice: rung chuyển
  rationale: Động từ bị động diễn tả nơi ấy thực sự bị lay động; “rung chuyển” rõ nghĩa và giữ được sức mạnh vật lý của động từ Hy Lạp.
- source_word: ἐν ᾧ ἦσαν συνηγμένοι
  choice: nơi họ đang nhóm họp
  rationale: Kết cấu ἦσαν cùng phân từ hoàn thành nhấn mạnh họ ở trong trạng thái đã tụ họp. “Đang nhóm họp” diễn đạt tự nhiên bối cảnh cộng đồng đang hiện diện cùng nhau, còn chú thích ghi nhận cách dịch sát trạng thái hơn.
- source_word: ἐπλήσθησαν ἅπαντες τοῦ ἁγίου πνεύματος
  choice: Tất cả đều được đầy dẫy Đức Thánh Linh
  rationale: Giữ thể bị động, sự bao quát của ἅπαντες và thành ngữ quen thuộc của Lu-ca về việc được đầy dẫy Đức Thánh Linh.
- source_word: ἐλάλουν
  choice: cứ nói
  rationale: Thì chưa hoàn thành diễn tả hành động đang tiếp diễn. “Cứ nói” bảo toàn sắc thái kéo dài mà không thêm ý “bắt đầu”.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: lời Đức Chúa Trời
  rationale: Cách diễn đạt tự nhiên, trang trọng trong tiếng Việt và giữ thành ngữ của Lu-ca chỉ sứ điệp đến từ Đức Chúa Trời.
- source_word: μετὰ παρρησίας
  choice: một cách dạn dĩ
  rationale: παρρησία trong ngữ cảnh Công Vụ nói đến lời nói công khai, thẳng thắn và không sợ hãi; “dạn dĩ” truyền đạt trọng tâm ấy.
theological_decisions:
- issue: Ngôn ngữ về sự đầy dẫy Đức Thánh Linh
  choice: được đầy dẫy Đức Thánh Linh
  alternative: được Đức Thánh Linh làm cho đầy dẫy
  rationale: Cách chọn giữ thành ngữ về nội dung được ban đầy và thể bị động của nguyên văn, nhưng không xác định thêm cơ chế hay biến sự kiện này thành một mô hình kinh nghiệm giáo phái cụ thể.
- issue: Thể của ἐλάλουν
  choice: cứ nói
  alternative: đã nói
  rationale: Cách dịch giữ tính tiếp diễn của thì chưa hoàn thành, nhấn mạnh việc làm chứng kéo dài sau lời cầu nguyện và sự đầy dẫy Đức Thánh Linh.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “nhóm họp” cho bối cảnh cộng đồng, “đầy dẫy Đức Thánh Linh” để giữ thành ngữ Kinh Thánh quen thuộc, và “cứ nói” để thể hiện hành động tiếp diễn.
