  text: τότε Πέτρος πλησθεὶς πνεύματος ἁγίου εἶπεν πρὸς αὐτούς· Ἄρχοντες τοῦ λαοῦ καὶ ⸀πρεσβύτεροι,
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/008.yaml
  text: Then Peter, filled with the Holy Spirit, said to them, “Rulers of the people and elders,”
translation:
  language: vi
  text: 'Bấy giờ, Phi-e-rơ được đầy dẫy Đức Thánh Linh, nói với họ: “Các nhà cầm quyền của dân và các trưởng lão,”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τότε
  choice: Bấy giờ
  rationale: Dấu chỉ thời gian nối tiếp diễn biến trước; “Bấy giờ” tự nhiên trong văn kể chuyện trang trọng và giữ được ý “lúc ấy/rồi”.
- source_word: Πέτρος
  choice: Phi-e-rơ
  rationale: Dùng dạng tên riêng quen thuộc trong truyền thống Kinh Thánh tiếng Việt, tương ứng với Πέτρος.
- source_word: πλησθεὶς
  choice: được đầy dẫy
  rationale: Phân từ aorist bị động của πίμπλημι; “được đầy dẫy” giữ rõ sắc thái bị động mà vẫn tự nhiên trong ngữ cảnh Kinh Thánh tiếng Việt.
- source_word: πνεύματος ἁγίου
  choice: Đức Thánh Linh
  rationale: Cụm sở hữu sau πλησθεὶς chỉ điều làm đầy Phi-e-rơ; “Đức Thánh Linh” là cách gọi trang trọng, phổ thông trong tiếng Việt hiện đại.
- source_word: εἶπεν πρὸς αὐτούς
  choice: nói với họ
  rationale: Chuyển trực tiếp công thức dẫn lời, rõ ràng và tự nhiên.
- source_word: Ἄρχοντες
  choice: các nhà lãnh đạo
  rationale: Trong ngữ cảnh xét xử, từ này chỉ những người có thẩm quyền cai quản; “các nhà lãnh đạo” tự nhiên hơn “những người cai trị” nhưng vẫn giữ ý chức trách.
- source_word: τοῦ λαοῦ
  choice: của dân
  rationale: Giữ kết cấu sở hữu và nghĩa tập thể của λαός, ở đây là dân Israel trong bối cảnh tôn giáo-xã hội.
- source_word: πρεσβύτεροι
  choice: các trưởng lão
  rationale: Chỉ những người giữ địa vị được công nhận trong cơ cấu lãnh đạo, không đơn thuần là người cao tuổi.
theological_decisions:
- issue: Cách dịch πνεύματος ἁγίου
  choice: Đức Thánh Linh
  alternative: thánh linh
  rationale: Trong Công Vụ, cụm từ này nói đến Thánh Linh của Đức Chúa Trời đang ban năng lực để làm chứng và phát ngôn. Cách viết hoa và kính ngữ nhận diện đối tượng được nói đến mà không thêm một diễn giải giáo phái.
- issue: Tác thể và trạng thái trong πλησθεὶς πνεύματος ἁγίου
  choice: được đầy dẫy Đức Thánh Linh
  alternative: đầy dẫy Đức Thánh Linh
  rationale: Giữ sắc thái bị động của phân từ Hy Lạp, cho thấy Phi-e-rơ tiếp nhận sự đầy dẫy chứ không tự tạo ra trạng thái ấy, nhưng không xác định thêm cơ chế thần học.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Thưa” để thể hiện chức năng hô cách trong lời phát biểu công khai; dấu phẩy cuối câu phản ánh rằng lời nói còn tiếp tục sang câu kế tiếp.
