    rationale: τῶν πιπρασκομένων là “những thứ được bán,” với quy chiếu trực tiếp về ruộng đất hoặc nhà cửa vừa nêu. “Tài sản” không sai trong ngữ cảnh, nhưng “chúng” bám sát quy chiếu văn bản hơn.
