  text: οὐδὲ γὰρ ἐνδεής τις ⸀ἦν ἐν αὐτοῖς· ὅσοι γὰρ κτήτορες χωρίων ἢ οἰκιῶν ὑπῆρχον, πωλοῦντες ἔφερον τὰς τιμὰς τῶν πιπρασκομένων
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/034.yaml
  text: For there was not even any needy person among them[a], for as many as were owners of fields or houses were selling them and bringing the proceeds of what was sold.
translation:
  language: vi
  text: Vì trong số họ không có một ai túng thiếu; bởi tất cả những người có ruộng đất hoặc nhà cửa đều bán chúng và đem số tiền thu được[a] từ những thứ đã bán,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “giá của những thứ được bán.” Theo nghĩa sát, tiếng Hy Lạp nói “các giá”; trong ngữ cảnh, cụm này chỉ số tiền thu về từ việc bán.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲ γὰρ
  choice: Vì ... không có một ai
  rationale: “Vì” giữ chức năng giải thích của γάρ, còn “không có một ai” diễn đạt tự nhiên sức nhấn mạnh phủ định của οὐδέ trong tiếng Việt.
- source_word: ἐνδεής
  choice: túng thiếu
  rationale: Chỉ tình trạng thiếu thốn, cần được trợ giúp trong bối cảnh cộng đồng, nhưng không thu hẹp thành một nhãn phân loại xã hội.
- source_word: τις ἦν ἐν αὐτοῖς
  choice: trong số họ không có một ai
  rationale: Dùng cấu trúc hiện hữu tự nhiên trong tiếng Việt và giữ rõ phạm vi “ở giữa/trong số họ”.
- source_word: ὅσοι
  choice: tất cả những người
  rationale: 'Diễn đạt phạm vi phân phối: mọi người thuộc nhóm được mô tả, chứ không khẳng định rằng mọi tín hữu đều sở hữu bất động sản.'
- source_word: κτήτορες χωρίων ἢ οἰκιῶν
  choice: có ruộng đất hoặc nhà cửa
  rationale: “Có” là cách nói tự nhiên cho người sở hữu; χωρίων được dịch rộng là “ruộng đất” để chỉ các phần đất, còn οἰκιῶν là “nhà cửa”.
- source_word: πωλοῦντες ἔφερον
  choice: đều bán đi và đem
  rationale: Diễn đạt mạch hành động lặp lại của phân từ hiện tại cùng động từ ở thì vị hoàn, tránh cấu trúc phân từ gượng trong tiếng Việt.
- source_word: τὰς τιμὰς τῶν πιπρασκομένων
  choice: số tiền thu được từ những tài sản đã bán
  rationale: τιμαί theo nghĩa đen là “giá/giá tiền”, nhưng trong ngữ cảnh chỉ số tiền thu về từ việc bán; “tài sản” quy chiếu tự nhiên về ruộng đất hoặc nhà cửa.
theological_decisions:
- issue: Phạm vi của việc bán tài sản
  choice: “tất cả những người có ruộng đất hoặc nhà cửa đều bán đi” giữ nguyên cách diễn đạt khái quát của câu
  alternative: Diễn giải thành việc bán toàn bộ tài sản của mọi tín hữu hoặc chỉ bán khi có nhu cầu
  rationale: Bản dịch không bổ sung mức độ, thời điểm hay động cơ mà văn bản Hy Lạp không nói rõ, nhờ đó tránh biến mô tả cộng đồng thành một quy định tài sản cụ thể.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dấu phẩy cuối câu được giữ vì câu Hy Lạp tiếp tục sang Công Vụ 4:35; bản dịch không thêm chú thích vì cách dịch “số tiền thu được” đã truyền đạt tự nhiên ý nghĩa ngữ cảnh của τὰς τιμάς.
