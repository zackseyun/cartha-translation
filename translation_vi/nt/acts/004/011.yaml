  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οὗτός ἐστιν ὁ λίθος ὁ ἐξουθενηθεὶς ὑφ’ ὑμῶν τῶν ⸀οἰκοδόμων, ὁ γενόμενος εἰς κεφαλὴν γωνίας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/011.yaml
  text: This is the stone that was rejected by you[a], the builders, which has become the cornerstone.
translation:
  language: vi
  text: Người này chính là hòn đá đã bị các ông, là những thợ xây, khinh bỏ, đã trở thành đá đầu góc.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể hiểu là “đá đỉnh góc”; theo sát chữ: “đầu của góc.”'
    reason: Cụm κεφαλὴ γωνίας không xác định hoàn toàn rõ viên đá là đá góc nền hay đá ở đỉnh góc, nên chú thích bảo tồn phương án khác.
lexical_decisions:
- source_word: οὗτός
  choice: Người này chính là
  rationale: Đại từ chỉ định nhấn mạnh, trực tiếp quy chiếu về Chúa Giê-su trong ngữ cảnh; “chính” giữ được sắc thái nhấn mạnh mà vẫn tự nhiên trong tiếng Việt.
- source_word: λίθος
  choice: hòn đá
  rationale: Giữ nguyên hình ảnh xây dựng và liên hệ với Thi Thiên 118:22; “hòn đá” tự nhiên hơn “tảng đá” trong ngữ cảnh một viên đá được thợ xây xem xét.
- source_word: ἐξουθενηθεὶς
  choice: khinh bỏ
  rationale: Diễn đạt cả thái độ coi thường lẫn hành động loại bỏ, phù hợp với nghĩa của động từ và ẩn dụ về những thợ xây.
- source_word: ὑφ’ ὑμῶν
  choice: bị các ông
  rationale: Giữ lời quy trách nhiệm trực tiếp ở ngôi thứ hai số nhiều; “các ông” phù hợp với việc Phi-e-rơ đang nói với các nhà lãnh đạo.
- source_word: τῶν οἰκοδόμων
  choice: là những thợ xây
  rationale: Giữ phép đồng vị và hình ảnh ẩn dụ của câu trích dẫn, đồng thời dùng cách gọi thông dụng trong tiếng Việt.
- source_word: ὁ γενόμενος
  choice: nhưng đã trở thành
  rationale: “Đã trở thành” diễn đạt sự thay đổi đã xảy ra; “nhưng” làm rõ sự tương phản vốn có giữa việc bị khinh bỏ và được đặt vào vị trí danh dự, dù liên từ này không được biểu thị riêng trong tiếng Hy Lạp.
- source_word: κεφαλὴν γωνίας
  choice: đá góc nhà
  rationale: Đây là cách diễn đạt tự nhiên, quen thuộc cho viên đá chủ chốt ở góc công trình, đồng thời tránh xác quyết quá mức về vị trí kiến trúc chính xác.
theological_decisions:
- issue: Hình ảnh kiến trúc trong câu trích Thi Thiên 118:22
  choice: đá góc nhà
  alternative: 'đá đỉnh góc; sát nghĩa: đầu của góc'
  rationale: Cụm Hy Lạp có thể chỉ viên đá chủ chốt ở góc nền hoặc viên đá trên đỉnh góc. Bản chính dùng cách diễn đạt rõ ràng, quen thuộc nhưng ghi chú vẫn bảo tồn sự không chắc chắn về chi tiết kiến trúc, không đưa thêm kết luận giáo lý.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Các ông” giữ tính trực diện của lời Phi-e-rơ; “khinh bỏ” vừa thể hiện sự coi thường vừa phù hợp với ẩn dụ xây dựng. Dấu chú thích được đặt ngay sau cụm từ có phương án dịch khác.
