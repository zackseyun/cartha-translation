  rationale: Bản sửa bỏ liên từ đối lập được thêm vào, làm rõ cụm đồng vị “là những thợ xây” bằng dấu phẩy, và thay “đá góc nhà” bằng “đá đầu góc” để phản ánh sát hơn thành ngữ Hy Lạp cũng như bảo tồn sự bất định kiến trúc. Không thay đổi ý nghĩa hay thêm diễn giải thần học.
