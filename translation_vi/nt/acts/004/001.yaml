id: ACT.4.1
reference: Acts 4:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Λαλούντων δὲ αὐτῶν πρὸς τὸν λαὸν ἐπέστησαν αὐτοῖς οἱ ⸀ἱερεῖς καὶ ὁ στρατηγὸς τοῦ ἱεροῦ καὶ οἱ Σαδδουκαῖοι,
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/001.yaml
  text: While they were speaking to the people[a], the priests and the captain of the temple and the Sadducees came upon them[b],
translation:
  language: vi
  text: Trong khi họ đang nói với dân chúng, các thầy tế lễ, viên chỉ huy Đền Thờ[b] và những người Sa-đu-sê đến chỗ họ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đến gần họ” hoặc “tiến đến chỗ họ.” Động từ Hy Lạp có thể diễn tả việc bất ngờ xuất hiện hoặc đến gần; văn cảnh cho thấy đây là sự xen vào của những người có thẩm quyền.'
    reason: lexical_alternative
  - marker: b
    text: “Viên chỉ huy Đền Thờ” là viên chức chịu trách nhiệm giữ trật tự và an ninh trong khuôn viên Đền Thờ.
    reason: cultural_note
lexical_decisions:
- source_word: Λαλούντων δὲ αὐτῶν
  choice: Trong khi họ đang nói
  rationale: Cấu trúc sở hữu cách tuyệt đối diễn tả hoàn cảnh đồng thời, được chuyển thành mệnh đề thời gian tự nhiên trong tiếng Việt. δέ đánh dấu diễn tiến câu chuyện nhưng không cần dịch thành một từ riêng ở đây.
- source_word: πρὸς τὸν λαὸν
  choice: với dân chúng
  rationale: λαός ở đây chỉ những người tụ họp trong khuôn viên Đền Thờ; “dân chúng” tự nhiên và không diễn giải quá mức thành “đám đông”.
- source_word: ἐπέστησαν αὐτοῖς
  choice: kéo đến chỗ họ
  rationale: Động từ có thể chỉ việc đến gần hoặc bất ngờ xuất hiện. “Kéo đến chỗ họ” diễn đạt sự xuất hiện để xen vào sự việc mà chưa thêm sắc thái đối đầu rõ hơn nguyên văn.
- source_word: οἱ ἱερεῖς
  choice: các thầy tế lễ
  rationale: Nguyên văn là ἱερεῖς, không phải ἀρχιερεῖς; vì vậy không dịch là “các thầy tế lễ cả” hay “các trưởng tế”.
- source_word: ὁ στρατηγὸς τοῦ ἱεροῦ
  choice: viên chỉ huy Đền Thờ
  rationale: στρατηγός chỉ một viên chức chỉ huy. Cách dịch này vừa gọn vừa thể hiện chức trách, không chèn “đội lính canh” vốn không được nói rõ trong cụm từ Hy Lạp.
- source_word: οἱ Σαδδουκαῖοι
  choice: những người Sa-đu-sê
  rationale: Dùng tên gọi đã được phiên âm quen thuộc trong tiếng Việt cho nhóm tôn giáo này.
theological_decisions:
- issue: Sắc thái đối nghịch trong việc các viên chức xuất hiện
  choice: Dịch ἐπέστησαν tương đối trung tính là “kéo đến chỗ họ”.
  alternative: “đến đối chất với họ” hoặc “tiến đến gần họ”
  rationale: Văn cảnh tiếp theo cho thấy sự chống đối, nhưng riêng động từ trong câu này chủ yếu thuật lại việc các nhà chức trách đến nơi. Cách dịch tương đối trung tính giữ được diễn tiến và sự căng thẳng của trình thuật mà không cường điệu tính thù địch.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Viết hoa “Đền Thờ” để chỉ Đền Thờ tại Giê-ru-sa-lem. Các chú thích được đặt ngay sau từ hoặc cụm từ mà chúng giải thích; thứ tự [b] rồi [a] trong câu là do [b] chú giải chức danh xuất hiện trước, còn [a] chú giải động từ ở cuối câu.
