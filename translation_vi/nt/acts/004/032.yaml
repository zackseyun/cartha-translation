source:
  edition: SBLGNT
  text: Τοῦ δὲ πλήθους τῶν πιστευσάντων ἦν ⸀καρδία καὶ ⸀ψυχὴ μία, καὶ οὐδὲ εἷς τι τῶν ὑπαρχόντων ⸀αὐτῷ ἔλεγεν ἴδιον εἶναι, ἀλλ’ ἦν αὐτοῖς ⸀πάντα κοινά.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/032.yaml
  text: The multitude of those who had believed were of one heart and soul[a], and not even one of them said that anything belonging to him was his own[b], but all things were held in common among them.
translation:
  language: vi
  text: Cả đoàn người đã tin đều một lòng một tâm[a], không một ai nói rằng bất cứ thứ gì mình có là của riêng mình[b], nhưng mọi thứ đều là của chung.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đồng lòng đồng tâm.”'
    reason: lexical_alternative
  - marker: b
    text: “Mình” ở đây nói về từng người một, tương ứng với dạng số ít mang nghĩa phân phối trong tiếng Hy Lạp.
    reason: lexical_alternative
lexical_decisions:
- source_word: πλήθους
  choice: cả đoàn người
  rationale: Diễn đạt một cộng đồng đông người cách tự nhiên trong tiếng Việt, không làm yếu sắc thái tập thể của πλῆθος.
- source_word: τῶν πιστευσάντων
  choice: đã tin
  rationale: Giữ sắc thái hành động đã xảy ra của phân từ bất định, đồng thời tránh cách diễn đạt nặng nề.
- source_word: καρδία καὶ ψυχὴ μία
  choice: một lòng một tâm
  rationale: Giữ cả hai yếu tố καρδία và ψυχή bằng một thành ngữ Việt trang trọng, tự nhiên, chỉ sự hiệp nhất sâu xa trong nội tâm và ý hướng.
- source_word: οὐδὲ εἷς
  choice: không một ai
  rationale: Bảo toàn tính nhấn mạnh của οὐδὲ εἷς.
- source_word: τι τῶν ὑπαρχόντων αὐτῷ
  choice: bất cứ thứ gì mình có
  rationale: Chuyển tải những gì thuộc về từng người; đại từ “mình” thể hiện số ít phân phối của αὐτῷ một cách tự nhiên và trung tính trong tiếng Việt.
- source_word: ἔλεγεν ἴδιον εἶναι
  choice: nói rằng ... là của riêng mình
  rationale: Theo sát cấu trúc Hy Lạp và giữ sắc thái sở hữu riêng của ἴδιον mà không diễn giải thành một hệ thống kinh tế.
- source_word: πάντα κοινά
  choice: mọi thứ đều là của chung giữa họ
  rationale: Giữ cấu trúc vị ngữ và ý nghĩa tài sản được xem là chung trong cộng đồng; không tăng nghĩa thành quyền sở hữu tập thể theo nghĩa pháp lý.
theological_decisions:
- issue: Việc dùng tài sản chung trong hội thánh tại Giê-ru-sa-lem
  choice: Trình bày như lời mô tả rằng họ không xem tài sản là của riêng mình và mọi thứ là của chung giữa họ.
  alternative: “Họ cùng sở hữu mọi thứ” hoặc một cách dịch làm nhẹ ý nghĩa chia sẻ tài sản.
  rationale: Bản dịch giữ nguyên sức căng của câu Hy Lạp nhưng không biến lời mô tả này thành sự tán thành một hệ thống kinh tế, chính trị hay giáo phái về sau.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “cả đoàn người” thay cho từ Hán-Việt nặng hơn; “một lòng một tâm” bảo toàn hai danh từ của nguyên văn. Không thêm từ chỉ thời gian như “bấy giờ”, vì nguyên văn chỉ có liên từ δέ.
