    issue: Cụm “là của chung giữa họ” chưa tự nhiên.
    rationale: Trong tiếng Việt, “của chung” vốn đã diễn đạt tính chung/shared. Thêm “giữa họ” gây gượng và không cần thiết để chuyển tải πάντα κοινά.
  revised_text: Cả đoàn người đã tin đều một lòng một tâm[a], không một ai nói rằng bất cứ thứ gì mình có là của riêng mình[b], nhưng mọi thứ đều là của chung.
