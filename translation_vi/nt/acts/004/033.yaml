source:
  edition: SBLGNT
  text: καὶ ⸂δυνάμει μεγάλῃ⸃ ἀπεδίδουν τὸ μαρτύριον οἱ ἀπόστολοι ⸂τῆς ἀναστάσεως τοῦ κυρίου Ἰησοῦ⸃, χάρις τε μεγάλη ἦν ἐπὶ πάντας αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/033.yaml
  text: And with great power the apostles were giving their testimony about the resurrection of the Lord Jesus[a], and great favor was upon them all.
translation:
  language: vi
  text: Với quyền năng lớn, các sứ đồ tiếp tục làm chứng về sự sống lại của Chúa Giê-su, và ân huệ lớn ở trên tất cả họ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “ân điển lớn ở trên tất cả họ.” Từ Hy Lạp χάρις có thể có nghĩa là “ân điển” hoặc “ân huệ”; cách nói này có thể bao hàm cả sự hiện diện đầy ân điển của Đức Chúa Trời lẫn sự ưu ái dành cho các tín hữu.
    reason: lexical_alternative
lexical_decisions:
- source_word: δυνάμει μεγάλῃ
  choice: dùng quyền năng lớn
  rationale: Cách dịch này thể hiện cách thức hoặc phương tiện của việc làm chứng, đồng thời giữ sắc thái quyền năng thường thấy của δύναμις trong Lu-ca–Công Vụ mà không giới hạn vào phép lạ.
- source_word: ἀπεδίδουν
  choice: tiếp tục làm chứng
  rationale: Thì vị hoàn biểu thị hành động đang tiếp diễn hoặc lặp lại; trong kết hợp với μαρτύριον, động từ mang nghĩa đưa ra lời chứng.
- source_word: τὸ μαρτύριον
  choice: làm chứng
  rationale: Diễn đạt thành ngữ tự nhiên trong tiếng Việt, không cần thêm đại từ sở hữu vốn không có trực tiếp trong nguyên văn.
- source_word: τῆς ἀναστάσεως
  choice: về sự sống lại
  rationale: Sở hữu cách nêu nội dung của lời chứng; “về” rõ ràng và tự nhiên trong tiếng Việt hiện đại.
- source_word: τοῦ κυρίου Ἰησοῦ
  choice: của Chúa Giê-su
  rationale: Giữ κύριος là “Chúa” và liên kết sự sống lại với chính Chúa Giê-su.
- source_word: χάρις μεγάλη
  choice: ân huệ lớn
  rationale: “Ân huệ” có thể bao hàm cả ân điển từ Đức Chúa Trời lẫn sự quý mến hoặc thiện cảm, nhờ đó không ấn định nguồn mà câu Hy Lạp không nêu rõ.
- source_word: ἐπὶ πάντας αὐτούς
  choice: ở trên tất cả họ
  rationale: Giữ hình ảnh điều gì đó ở trên hoặc bao phủ toàn thể cộng đồng, cũng như sự nhấn mạnh của πάντας.
theological_decisions:
- issue: Ý nghĩa và nguồn của χάρις
  choice: “ân huệ” với nguồn không xác định
  alternative: “ân điển” theo nghĩa thần học rõ hơn, hoặc “sự quý mến” từ dân chúng
  rationale: Nguyên văn không nói rõ χάρις đến từ Đức Chúa Trời hay từ con người và có thể cố ý bao hàm cả hai; “ân huệ” cùng chú thích giữ lại độ mở này.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Tiếp tục” truyền đạt tính tiếp diễn của thì vị hoàn; “ân huệ” được dùng để bảo toàn sự mơ hồ có ý nghĩa của χάρις.
