- from: Các sứ đồ dùng quyền năng lớn mà tiếp tục làm chứng về sự sống lại của Chúa Giê-su, và ân huệ lớn ở trên tất cả họ.[a]
  to: Với quyền năng lớn, các sứ đồ tiếp tục làm chứng về sự sống lại của Chúa Giê-su, và ân huệ lớn ở trên tất cả họ.[a]
  rationale: Chỉ sửa cách diễn đạt của δυνάμει μεγάλῃ để phù hợp ngữ pháp và văn phong tiếng Việt. Giữ “tiếp tục” để phản ánh tính tiếp diễn của vị hoàn, “làm chứng về” cho nội dung của μαρτύριον, và “ân huệ” cùng chú thích để không quyết định trước nguồn hay sắc thái chính xác của χάρις.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T08:28:15Z'
