  source_fidelity: 'Bản dịch truyền đạt đúng các thành phần chính của câu: quyền năng lớn, lời chứng liên tục của các sứ đồ về sự sống lại của Chúa Giê-su, và χάρις lớn trên toàn thể cộng đồng. Tuy nhiên, cấu trúc “dùng quyền năng lớn mà” không diễn đạt tự nhiên chức năng cách/phương tiện của δυνάμει μεγάλῃ.'
