id: ACT.4.24
reference: Acts 4:24
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οἱ δὲ ἀκούσαντες ὁμοθυμαδὸν ἦραν φωνὴν πρὸς τὸν θεὸν καὶ εἶπαν· Δέσποτα, ⸀σὺ ὁ ποιήσας τὸν οὐρανὸν καὶ τὴν γῆν καὶ τὴν θάλασσαν καὶ πάντα τὰ ἐν αὐτοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/024.yaml
  text: When they heard this[a], they lifted their voices together to God and said, “Master, you are the one who made heaven and earth and sea[b], and everything in them,”
translation:
  language: vi
  text: 'Nghe vậy, họ đồng lòng[a] cất tiếng thưa với Đức Chúa Trời rằng: “Lạy Chủ Tể[b], chính Ngài là Đấng đã dựng nên trời, đất, biển và mọi vật trong đó,”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “cùng một lòng” hoặc “nhất trí”.'
    reason: lexical_alternative
  - marker: b
    text: 'Tiếng Hy Lạp: Δέσποτα, một danh xưng nhấn mạnh thẩm quyền tuyệt đối; khác với κύριος (“Chúa”). Cũng có thể dịch: “Lạy Chúa Tể”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσαντες
  choice: Nghe vậy
  rationale: Phân từ bất định quá khứ mang ý nghĩa thời gian. “Vậy” bổ sung đối tượng được nghe từ ngữ cảnh trước đó, giúp câu tự nhiên trong tiếng Việt mà không thay đổi nội dung.
- source_word: ὁμοθυμαδόν
  choice: đồng lòng
  rationale: Diễn tả sự hiệp nhất trong tâm ý và hành động chung; tự nhiên và trang trọng hơn cách dịch thuần túy là “cùng nhau”.
- source_word: ἦραν φωνήν
  choice: cất tiếng
  rationale: Giữ hình ảnh của thành ngữ Hy Lạp theo lối nói tự nhiên trong tiếng Việt. Danh từ số ít φωνή phù hợp với hành động tập thể trong sự đồng lòng.
- source_word: πρὸς τὸν θεόν
  choice: thưa với Đức Chúa Trời
  rationale: Trong ngữ cảnh cầu nguyện, πρός chỉ lời nói hướng đến Đức Chúa Trời. “Thưa với” vừa tự nhiên vừa thể hiện thái độ kính cẩn.
- source_word: Δέσποτα
  choice: Chủ Tể
  rationale: Danh xưng này nhấn mạnh quyền sở hữu và thẩm quyền tuyệt đối, đồng thời giữ được sự phân biệt với κύριος, thường được dịch là “Chúa”.
- source_word: σὺ ὁ ποιήσας
  choice: chính Ngài là Đấng đã dựng nên
  rationale: “Chính Ngài” thể hiện sắc thái nhấn mạnh của σὺ; “là Đấng đã dựng nên” chuyển tải tự nhiên cấu trúc đại từ cộng với phân từ có mạo từ.
- source_word: τὸν οὐρανὸν καὶ τὴν γῆν καὶ τὴν θάλασσαν
  choice: trời, đất, biển
  rationale: Giữ công thức sáng tạo quen thuộc và ba phạm vi ở số ít trong nguyên văn; dấu phẩy tạo nhịp liệt kê tự nhiên trong tiếng Việt.
- source_word: πάντα τὰ ἐν αὐτοῖς
  choice: mọi vật trong đó
  rationale: Cách diễn đạt gọn, tự nhiên và bao quát tất cả những gì thuộc ba phạm vi vừa nêu.
theological_decisions:
- issue: Cách dịch Δέσποτα khi dùng làm danh xưng của Đức Chúa Trời
  choice: Chủ Tể
  alternative: Chúa Tể; Chúa; Đấng Tể Trị
  rationale: “Chủ Tể” giữ trọng tâm về quyền sở hữu và thẩm quyền tuyệt đối, không đồng nhất từ này với κύριος (“Chúa”) và cũng không thêm một danh xưng không có trong nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Thưa với” phù hợp với lời cầu nguyện kính cẩn; “cất tiếng” bảo tồn hình ảnh của nguyên văn mà không gượng ép. Các dấu chú thích được đặt ngay sau những từ thực sự liên quan, thay vì theo vị trí không tương ứng trong lớp tham khảo tiếng Anh.
