id: ACT.4.29
reference: Acts 4:29
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ τὰ νῦν, κύριε, ἔπιδε ἐπὶ τὰς ἀπειλὰς αὐτῶν καὶ δὸς τοῖς δούλοις σου μετὰ παρρησίας πάσης λαλεῖν τὸν λόγον σου,
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/029.yaml
  text: And now[a], Lord, look upon their threats and grant your servants to speak your word with all boldness,
translation:
  language: vi
  text: Giờ đây, lạy Chúa, xin nhìn đến những lời đe dọa của họ và xin ban cho các tôi tớ[a] của Ngài được nói lời Ngài cách hết sức dạn dĩ,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “các nô lệ của Ngài” hoặc “những người thuộc quyền Ngài”. Từ Hy Lạp doulos chỉ người thuộc về và ở dưới quyền một chủ; ở đây dùng “tôi tớ” vì ngữ cảnh cầu nguyện nhấn mạnh tư thế khiêm nhường phục vụ Đức Chúa Trời.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ τὰ νῦν
  choice: Giờ đây
  rationale: Cụm có mạo từ với νῦν tạo thành thành ngữ chuyển ý, nghĩa là “bây giờ” hoặc “trong tình thế hiện nay”. “Giờ đây” tự nhiên trong lời cầu nguyện và nối phần trình bày trước đó với lời khẩn xin hiện tại.
- source_word: κύριε
  choice: lạy Chúa
  rationale: κύριε là hô cách trực tiếp hướng về Đức Chúa Trời. Tiểu từ “lạy” thể hiện rõ lối xưng hô cầu nguyện trong tiếng Việt mà không thêm nội dung thần học.
- source_word: ἔπιδε ἐπὶ
  choice: xin nhìn đến
  rationale: Động từ mệnh lệnh aorist yêu cầu Chúa hướng sự chú ý đến các lời đe dọa. “Nhìn đến” giữ hình ảnh cụ thể của nguyên văn và có sắc thái khẩn cầu tự nhiên.
- source_word: τὰς ἀπειλὰς αὐτῶν
  choice: những lời đe dọa của họ
  rationale: ἀπειλή ở số nhiều chỉ các lời hoặc hành vi đe dọa; cách dịch này rõ nghĩa trong tiếng Việt hiện đại.
- source_word: δὸς
  choice: cho
  rationale: Nghĩa căn bản là “ban/cho”. Trong cấu trúc “cho… nói”, tiếng Việt diễn đạt tự nhiên lời xin được ban khả năng hay cơ hội hành động.
- source_word: τοῖς δούλοις σου
  choice: các tôi tớ Chúa
  rationale: δοῦλος có thể chỉ nô lệ, người thuộc quyền chủ, hoặc tôi tớ. Trong lời cầu nguyện này, “tôi tớ” diễn đạt sự thuộc về và vâng phục Đức Chúa Trời, đồng thời tự nhiên và trang trọng trong tiếng Việt; chú thích giữ lại nghĩa mạnh hơn của từ Hy Lạp.
- source_word: μετὰ παρρησίας πάσης
  choice: với tất cả sự dạn dĩ
  rationale: παρρησία chỉ sự nói năng công khai, tự do và không sợ hãi; πάσης nhấn mạnh mức độ trọn vẹn. Cách dịch này giữ được cả nội dung lẫn cường độ của cụm từ.
- source_word: λαλεῖν
  choice: nói
  rationale: Động từ nguyên mẫu phụ thuộc vào δὸς, nêu điều họ xin được làm. “Nói” giữ nghĩa trực tiếp, không tăng cường thành “rao giảng” hay “công bố”.
- source_word: τὸν λόγον σου
  choice: lời Ngài
  rationale: Trong Công Vụ, λόγος thường chỉ sứ điệp của Đức Chúa Trời được truyền ra. “Lời Ngài” giữ thành ngữ Kinh Thánh và không thu hẹp nghĩa thành một cách diễn giải cụ thể.
theological_decisions:
- issue: Cách dịch δοῦλος khi nói về mối quan hệ với Đức Chúa Trời
  choice: các tôi tớ Chúa
  alternative: các nô lệ của Chúa; những người thuộc quyền Chúa
  rationale: Ngữ cảnh cầu nguyện nhấn mạnh tư thế khiêm nhường, thuộc về và phục vụ Đức Chúa Trời. “Tôi tớ” phù hợp với ngữ vực này, còn chú thích cho biết δοῦλος cũng có thể diễn tả địa vị nô lệ hoặc người hoàn toàn thuộc quyền một chủ, tránh làm mất sức nặng của từ.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. “Lạy Chúa” giữ giọng cầu nguyện; “nhìn đến” bảo toàn hình ảnh của nguyên văn mà không dùng lối nói quá cổ. Dấu phẩy cuối câu được giữ vì câu Hy Lạp tiếp tục sang câu kế tiếp.
