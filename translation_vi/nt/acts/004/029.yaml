  terminology: “Lạy Chúa,” “tôi tớ,” và “lời Ngài” phù hợp với ngữ cảnh và ngữ vực Kinh Thánh tiếng Việt. Dùng “của Ngài” thay cho “Chúa” trong cụm sở hữu làm rõ rằng các tôi tớ thuộc về Đấng đang được trực tiếp cầu nguyện, không thay đổi ý nghĩa.
