id: ACT.4.27
reference: Acts 4:27
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: συνήχθησαν γὰρ ἐπ’ ἀληθείας ⸂ἐν τῇ πόλει ταύτῃ⸃ ἐπὶ τὸν ἅγιον παῖδά σου Ἰησοῦν, ὃν ἔχρισας, Ἡρῴδης τε καὶ Πόντιος Πιλᾶτος σὺν ἔθνεσιν καὶ λαοῖς Ἰσραήλ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/027.yaml
  text: For truly in this city Herod and Pontius Pilate[a], together with the Gentiles and the peoples of Israel, were gathered against your holy servant Jesus, whom you anointed[b],
translation:
  language: vi
  text: Vì thật vậy, trong thành này, Hê-rốt và Bôn-xơ Phi-lát, cùng với các dân ngoại và các dân[a] Y-sơ-ra-ên, đã tụ họp chống lại Giê-xu, đầy tớ thánh của Ngài[b], là Đấng Ngài đã xức dầu,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn là “các dân” Y-sơ-ra-ên; có thể diễn đạt tự nhiên hơn là “dân Y-sơ-ra-ên.”
    reason: lexical_alternative
  - marker: b
    text: Từ Hy Lạp παῖς có thể có nghĩa là “đầy tớ” hoặc “con”. Ở đây chọn “đầy tớ” vì câu này có lẽ vọng lại ngôn ngữ về Người Tôi Tớ trong sách Ê-sai.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνήχθησαν
  choice: đã tụ họp
  rationale: Diễn đạt động từ aorist thụ động theo lối tự nhiên trong tiếng Việt; hình thức này giữ được ý một cuộc liên kết đã thực sự hình thành mà không xác định tác nhân khiến họ tụ họp.
- source_word: γὰρ
  choice: Vì
  rationale: Nối lời cầu nguyện này với phần trích dẫn và lời giải thích ở câu trước.
- source_word: ἐπ’ ἀληθείας
  choice: thật vậy
  rationale: Cụm trạng từ nhấn mạnh tính xác thực; “thật vậy” vừa tự nhiên vừa giữ chức năng xác nhận trong văn mạch.
- source_word: ἐν τῇ πόλει ταύτῃ
  choice: trong thành này
  rationale: Giữ nguyên cách chỉ địa điểm của bản Hy Lạp, không đưa tên Giê-ru-sa-lem vào phần chính dù văn mạch cho thấy đó là thành được nói đến.
- source_word: ἐπὶ τὸν
  choice: chống lại
  rationale: Với động từ chỉ việc tụ họp, giới từ ἐπί kèm đối cách mang nghĩa thù nghịch, hướng sự chống đối vào Chúa Giê-xu.
- source_word: ἅγιον
  choice: thánh
  rationale: Giữ cả ý thuộc riêng về Đức Chúa Trời và phẩm tính thánh khiết.
- source_word: παῖδά σου
  choice: đầy tớ thánh của Ngài
  rationale: παῖς có thể là “đầy tớ” hoặc “con trẻ”; “đầy tớ” phù hợp hơn với âm hưởng về Người Tôi Tớ trong Ê-sai và cách dùng lặp lại trong Công Vụ.
- source_word: Ἰησοῦν
  choice: Chúa Giê-xu
  rationale: Dùng danh xưng quen thuộc và trang trọng trong tiếng Việt Cơ Đốc; từ “Chúa” ở đây là cách xưng gọi kính trọng trong tiếng Việt, còn trọng tâm từ vựng của nguyên văn là tên Giê-xu.
- source_word: ὃν ἔχρισας
  choice: là Đấng Ngài đã xức dầu
  rationale: Giữ nghĩa trực tiếp của χρίω và âm hưởng Đấng Mê-si-a, nhưng không thay động từ bằng danh hiệu “Đấng Christ”.
- source_word: Ἡρῴδης τε καὶ Πόντιος Πιλᾶτος
  choice: Hê-rốt và Pôn-ti-ô Phi-lát
  rationale: Phiên âm các tên riêng theo cách dùng Kinh Thánh tiếng Việt quen thuộc và thể hiện tự nhiên cấu trúc liên kết τε καὶ.
- source_word: ἔθνεσιν
  choice: các dân ngoại
  rationale: Trong thế đối chiếu với Y-sơ-ra-ên, từ này chỉ những dân không thuộc Y-sơ-ra-ên; “các dân ngoại” rõ nghĩa và vẫn giữ số nhiều.
- source_word: λαοῖς Ἰσραήλ
  choice: các dân Y-sơ-ra-ên
  rationale: Giữ số nhiều bất thường của λαοῖς thay vì âm thầm chuẩn hóa thành số ít.
theological_decisions:
- issue: Cách dịch παῖς khi nói về Chúa Giê-xu
  choice: đầy tớ
  alternative: con trẻ; Con
  rationale: Văn mạch lời cầu nguyện vọng lại ngôn ngữ về Người Tôi Tớ trong Ê-sai. “Đầy tớ” bảo tồn liên hệ ấy; “Con” sẽ giải thích quá mức vì παῖς tại đây không trực tiếp mang thuật ngữ thần học về tư cách Con.
- issue: Cách dịch ἔθνεσιν trong thế đối chiếu với Y-sơ-ra-ên
  choice: các dân ngoại
  alternative: các dân tộc
  rationale: Sự phối hợp với “các dân Y-sơ-ra-ên” cho thấy sự phân biệt dân tộc-tôn giáo; “các dân ngoại” truyền đạt rõ sự tương phản mà không phủ nhận nghĩa cơ bản là các dân tộc.
- issue: Số nhiều của λαοῖς Ἰσραήλ
  choice: các dân Y-sơ-ra-ên
  alternative: dân Y-sơ-ra-ên
  rationale: Nguyên văn dùng số nhiều “các dân”; giữ số nhiều bảo tồn nét diễn đạt của lời trích dẫn/cầu nguyện dù tiếng Việt số ít tự nhiên hơn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Giữ trật tự các nhóm người gần với nguyên văn, giữ số nhiều của “các dân Y-sơ-ra-ên,” và dùng dấu phẩy cuối câu vì câu Hy Lạp tiếp tục sang câu kế tiếp. Các tên riêng theo lối phiên âm quen thuộc trong Kinh Thánh tiếng Việt.
