revisions:
- from: Sau khi gọi họ vào, họ ra lệnh cho hai người tuyệt đối không được lên tiếng[a] hay giảng dạy nhân danh Chúa Giê-su.
  to: 'Sau khi gọi họ vào, họ ra lệnh: “Tuyệt đối không được nói năng hay giảng dạy nhân danh Giê-su.”'
  rationale: Bản sửa loại bỏ số lượng và danh xưng không có trong tiếng Hy Lạp, đồng thời dùng “nói năng” cho φθέγγεσθαι và giữ nguyên lệnh cấm toàn diện đối với việc nói và giảng dạy nhân danh Giê-su. Dấu chân chú thích vẫn neo sau “nói năng” để đánh dấu phương án từ vựng tương ứng.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T08:28:06Z'
review_pass:
  verdict: revise
  source_fidelity: Bản nháp phản ánh đúng trình tự “sau khi gọi vào” và lực mệnh lệnh của παρήγγειλαν, đồng thời diễn đạt tốt tính nhấn mạnh của τὸ καθόλου. Tuy nhiên, “hai người” bổ sung một con số không có trong câu Hy Lạp, và danh xưng “Chúa” không xuất hiện trong Ἰησοῦ; cả hai nên tránh để giữ sát nguồn.
  naturalness: Cấu trúc “họ ra lệnh cho hai người ...” dễ hiểu nhưng “họ” cho cả chủ thể lẫn đối tượng kém gọn. Chuyển mệnh lệnh sang lời dẫn trực tiếp giúp tiếng Việt tự nhiên, rõ quan hệ cú pháp và vẫn giữ nguyên ý nghĩa.
  terminology: Giữ “nhân danh” cho ἐπὶ τῷ ὀνόματι, là cách dùng Kinh Thánh Việt ngữ tự nhiên. Dùng “Giê-su” thay vì “Chúa Giê-su” vì bản nguồn chỉ nêu tên riêng trong câu này.
  issues:
  - severity: medium
    issue: “hai người” không có trong câu nguồn.
    rationale: αὐτούς chỉ là đại từ số nhiều (“họ”), không xác định số lượng. Dù ngữ cảnh trước đó nói đến Phi-e-rơ và Giăng, bản dịch của câu không nên thêm con số vào thân văn.
  - severity: medium
    issue: “Chúa” được thêm trước “Giê-su.”
    rationale: Bản SBLGNT có τοῦ Ἰησοῦ, không có κύριος. Danh xưng này cần được loại khỏi thân văn để không bổ sung nội dung ngoài câu nguồn.
  revised_text: 'Sau khi gọi họ vào, họ ra lệnh: “Tuyệt đối không được nói năng hay giảng dạy nhân danh Giê-su.”'
  revised_footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “không được nói bất cứ điều gì hay giảng dạy nhân danh Giê-su.”'
    reason: lexical_alternative
