source:
  edition: SBLGNT
  text: καὶ καλέσαντες αὐτοὺς παρήγγειλαν ⸀τὸ καθόλου μὴ φθέγγεσθαι μηδὲ διδάσκειν ἐπὶ τῷ ὀνόματι τοῦ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/018.yaml
  text: And after calling them in[a], they ordered them not to speak at all nor teach in the name of Jesus.
translation:
  language: vi
  text: 'Sau khi gọi họ vào, họ ra lệnh: “Tuyệt đối không được nói năng hay giảng dạy nhân danh Giê-su.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καλέσαντες
  choice: sau khi gọi họ vào
  rationale: Phân từ bất định quá khứ diễn tả hành động xảy ra trước động từ chính; “gọi họ vào” tự nhiên trong bối cảnh phiên họp và không tăng sắc thái pháp lý quá mức.
- source_word: παρήγγειλαν
  choice: ra lệnh
  rationale: Động từ chỉ một chỉ thị có thẩm quyền; “ra lệnh” truyền đạt rõ sức nặng của mệnh lệnh.
- source_word: τὸ καθόλου
  choice: tuyệt đối không
  rationale: Cụm này nhấn mạnh tính toàn diện của lệnh cấm; cách diễn đạt này tự nhiên và mạnh trong tiếng Việt hiện đại.
- source_word: μὴ φθέγγεσθαι
  choice: không được lên tiếng
  rationale: φθέγγομαι có nghĩa nói hoặc phát ngôn. “Không được lên tiếng” giữ được sắc thái cấm mọi hành vi phát ngôn trong phạm vi được nêu, đồng thời phù hợp với từ nhấn mạnh καθόλου.
- source_word: μηδὲ διδάσκειν
  choice: hay giảng dạy
  rationale: μηδέ nối hoạt động bị cấm thứ hai với hoạt động thứ nhất; “hay” là cách phối hợp tự nhiên sau một mệnh đề phủ định trong tiếng Việt.
- source_word: ἐπὶ τῷ ὀνόματι τοῦ Ἰησοῦ
  choice: nhân danh Chúa Giê-su
  rationale: Trong ngữ cảnh Công Vụ, cụm này diễn tả việc nói hoặc hành động gắn với danh và thẩm quyền của Chúa Giê-su. “Nhân danh” là cách nói rõ ràng, quen thuộc và không loại bỏ sắc thái nền tảng hay thẩm quyền.
- source_word: Ἰησοῦ
  choice: Chúa Giê-su
  rationale: Dùng dạng tên riêng tiếng Việt thông dụng; danh xưng “Chúa” phù hợp với văn phong Kinh Thánh tiếng Việt và cách nhắc đến Giê-su trong ngữ cảnh Cơ Đốc.
theological_decisions:
- issue: Phạm vi của lệnh cấm liên quan đến việc làm chứng về Chúa Giê-su
  choice: Một lệnh cấm toàn diện đối với cả việc lên tiếng lẫn giảng dạy nhân danh Chúa Giê-su
  alternative: Chỉ cấm công khai rao giảng, chứ không cấm mọi lời nói liên quan
  rationale: Sự kết hợp giữa τὸ καθόλου, μὴ φθέγγεσθαι và μηδὲ διδάσκειν tạo nên một lệnh cấm mạnh, bao gồm cả phát ngôn và giảng dạy. Bản dịch giữ nguyên độ rộng ấy mà không tự ý thu hẹp thành một hình thức công bố cụ thể.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Ra lệnh,” “tuyệt đối không được” giữ sức nặng của lời cấm; “lên tiếng” tránh cách diễn đạt cứng nhưng vẫn phản ánh φθέγγεσθαι. Đại từ “họ” được giữ theo nguyên văn, còn “hai người” làm rõ đối tượng theo ngữ cảnh gần.
