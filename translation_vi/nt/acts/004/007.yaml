  - severity: low
    issue: Dấu chú thích a đang neo vào “hội đồng” nhưng nội dung chú thích giải thích ἐπυνθάνοντο.
    rationale: Cần chuyển neo chú thích sang động từ “bắt đầu hỏi” để liên kết hình thức và nội dung được minh bạch.
  - severity: low
