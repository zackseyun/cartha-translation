revisions:
- from: 'Họ cho hai ông đứng giữa hội đồng[a] rồi hỏi: “Các ông đã làm việc này nhờ quyền năng nào hay nhân danh ai?”'
  to: 'Sau khi cho hai ông đứng ở giữa, họ bắt đầu hỏi[a]: “Các ông đã làm điều này nhờ quyền năng nào hay nhân danh ai?”'
  rationale: Bản sửa bỏ phần bổ sung “hội đồng” để phản ánh trực tiếp ἐν τῷ μέσῳ, dùng “Sau khi” để biểu đạt quan hệ trước sau của στήσαντες, và dùng “bắt đầu hỏi” như một cách an toàn cho khả năng sắc thái khởi đầu của ἐπυνθάνοντο. Chú thích được đặt đúng tại động từ và nêu các khả năng của thì chưa hoàn thành. Các thuật ngữ trọng yếu và tính không xác định của τοῦτο được giữ nguyên.
