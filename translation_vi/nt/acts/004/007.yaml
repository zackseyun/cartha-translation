source:
  edition: SBLGNT
  text: καὶ στήσαντες αὐτοὺς ἐν ⸀τῷ μέσῳ ἐπυνθάνοντο· Ἐν ποίᾳ δυνάμει ἢ ἐν ποίῳ ὀνόματι ἐποιήσατε τοῦτο ὑμεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/007.yaml
  text: And after setting them in the midst[a], they began asking, “By what power or in what name did you do this?”
translation:
  language: vi
  text: 'Sau khi cho hai ông đứng ở giữa, họ bắt đầu hỏi[a]: “Các ông đã làm điều này nhờ quyền năng nào hay nhân danh ai?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “họ đang hỏi” hoặc “họ hỏi/tra hỏi”. Thì chưa hoàn thành trong tiếng Hy Lạp có thể nhấn mạnh việc hỏi đang tiếp diễn, thay vì sự khởi đầu của việc hỏi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: στήσαντες
  choice: cho hai ông đứng
  rationale: Phân từ bất định quá khứ diễn tả hành động xảy ra trước việc chất vấn. Cách dịch này tự nhiên trong tiếng Việt và làm rõ αὐτούς chỉ Phi-e-rơ cùng Giăng theo văn cảnh.
- source_word: ἐν τῷ μέσῳ
  choice: giữa hội đồng
  rationale: Nghĩa đen là “ở giữa”; thêm “hội đồng” theo văn cảnh trực tiếp để người đọc hiểu đây là vị trí giữa những người đang nhóm họp, không phải một địa điểm mơ hồ.
- source_word: ἐπυνθάνοντο
  choice: rồi hỏi
  rationale: Thì chưa hoàn thành có thể chỉ hành động đang diễn tiến hoặc khởi đầu. “Rồi hỏi” giữ trình tự kể chuyện tự nhiên mà không buộc phải xác định sắc thái khởi đầu; chú thích nêu khả năng diễn tiến.
- source_word: Ἐν ποίᾳ δυνάμει
  choice: nhờ quyền năng nào
  rationale: ἐν có sắc thái phương tiện trong câu này; “nhờ” là cách diễn đạt tự nhiên. “Quyền năng” giữ nghĩa của δύναμις và không đồng nhất nó với ἐξουσία, “thẩm quyền”.
- source_word: ἢ ἐν ποίῳ ὀνόματι
  choice: hay nhân danh ai
  rationale: Thành ngữ tiếng Việt “nhân danh” truyền đạt tự nhiên ý hành động trong danh của một người, bao gồm sự đại diện hoặc thẩm quyền. Dạng nghi vấn giống trung ποίῳ đi với ὀνόματι, nhưng theo ngữ dụng câu hỏi nhắm đến người mang danh ấy.
- source_word: ἐποιήσατε τοῦτο
  choice: đã làm việc này
  rationale: Dịch động từ bất định quá khứ bằng “đã làm”; “việc này” giữ cách quy chiếu rộng của τοῦτο đến sự chữa lành hoặc dấu lạ mà không giải thích thêm trong chính văn.
- source_word: ὑμεῖς
  choice: các ông
  rationale: Đại từ được nêu rõ trong tiếng Hy Lạp mang sắc thái nhấn mạnh. “Các ông” vừa phù hợp với lời chất vấn hai người nam vừa thể hiện chủ thể trực tiếp mà không cần thêm “chính” một cách nặng nề.
theological_decisions:
- issue: Nên dịch δύναμις là “quyền năng” hay diễn giải thành “thẩm quyền”
  choice: quyền năng
  alternative: thẩm quyền
  rationale: δύναμις thường chỉ sức mạnh hoặc quyền năng, còn cụm “nhân danh ai” đã hàm ý sự đại diện và thẩm quyền. Giữ “quyền năng” bảo tồn sự phân biệt trong câu hỏi.
- issue: Cụm ἐν ποίῳ ὀνόματι nên giữ hình thức “trong danh nào” hay dùng thành ngữ tiếng Việt
  choice: nhân danh ai
  alternative: trong danh nào
  rationale: “Nhân danh ai” là thành ngữ tiếng Việt hiện đại tương ứng với hành động ἐν ὀνόματι và không làm mất hàm ý về nguồn thẩm quyền. “Trong danh nào” sát hình thức nhưng không tự nhiên và khó hiểu.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. “Hội đồng” được dùng để làm rõ khung cảnh xét hỏi; “nhờ quyền năng nào hay nhân danh ai” giữ sự phân biệt giữa năng lực tác động và danh nghĩa đại diện.
