    rationale: «Ngoài Ngài ra» và «trong bất cứ ai khác» cùng thực hiện ý loại trừ của ἐν ἄλλῳ οὐδενί. Việc giữ cả hai trong cấu trúc hiện tại tạo câu tiếng Việt nặng, dù không làm sai nghĩa.
  - severity: low
    issue: «được ban giữa loài người» gượng trong tiếng Việt
    rationale: Cách này có cơ sở ở ἐν ἀνθρώποις, nhưng khi nói về một «danh», tiếng Việt hiện đại thường dùng «được ban cho loài người». Một chú thích giữ phương án «giữa loài người» để phản ánh sắc thái giới từ của nguyên ngữ.
  revised_text: Ngoài Ngài ra, không có sự cứu rỗi nơi ai khác, vì dưới trời không có danh nào khác được ban cho loài người[a] mà nhờ danh ấy chúng ta phải được cứu.
