id: ACT.4.12
reference: Acts 4:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ οὐκ ἔστιν ἐν ἄλλῳ οὐδενὶ ἡ σωτηρία, ⸀οὐδὲ γὰρ ὄνομά ἐστιν ἕτερον ⸂ὑπὸ τὸν οὐρανὸν⸃ τὸ δεδομένον ἐν ἀνθρώποις ἐν ᾧ δεῖ σωθῆναι ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/012.yaml
  text: And there is salvation in no one else[a], for there is no other name under heaven given among men by which we must be saved.
translation:
  language: vi
  text: Ngoài Ngài ra, không có sự cứu rỗi nơi ai khác, vì dưới trời không có danh nào khác được ban cho loài người[a] mà nhờ danh ấy chúng ta phải được cứu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: được ban giữa loài người.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σωτηρία
  choice: sự cứu rỗi
  rationale: Cách dịch này giữ được cả ý giải cứu lẫn sức nặng thần học trong lời công bố về vai trò cứu độ duy nhất của Chúa Giê-su.
- source_word: ἐν ἄλλῳ οὐδενί
  choice: Ngoài Ngài ra, không ... trong bất cứ ai khác
  rationale: Cấu trúc tiếng Việt tự nhiên này bảo toàn tính quy chiếu về một ngôi vị và sự loại trừ tuyệt đối của nguyên văn.
- source_word: ὄνομα
  choice: danh
  rationale: Giữ hình ảnh 'danh', vốn có thể bao hàm ngôi vị, thẩm quyền và căn tính được bày tỏ, thay vì diễn giải hẹp thành 'người' hay 'thẩm quyền'.
- source_word: ὑπὸ τὸν οὐρανόν
  choice: dưới trời
  rationale: Bảo toàn thành ngữ Kinh Thánh chỉ phạm vi toàn thế giới, đồng thời giữ giọng văn trang trọng.
- source_word: δεδομένον ἐν ἀνθρώποις
  choice: được ban giữa loài người
  rationale: ἐν ἀνθρώποις nói đến phạm vi nhân loại; 'giữa loài người' vừa bao hàm mọi người vừa gần với cấu trúc Hy Lạp hơn 'ban cho loài người'.
- source_word: ἐν ᾧ
  choice: nhờ danh ấy
  rationale: Diễn đạt phương tiện trong tiếng Việt một cách rõ ràng, đồng thời nêu lại tiền từ 'danh' để tránh đại từ quan hệ tối nghĩa.
- source_word: δεῖ
  choice: phải
  rationale: Giữ nguyên sức mạnh của ý niệm cần thiết trong δεῖ mà không thêm lời giải thích giáo lý.
- source_word: σωθῆναι
  choice: được cứu
  rationale: Thể bị động được bảo toàn và liên kết tự nhiên với 'sự cứu rỗi' ở đầu câu.
theological_decisions:
- issue: Tính duy nhất và loại trừ của sự cứu rỗi nơi Chúa Giê-su
  choice: 'Giữ lời khẳng định không hạn định: ''Ngoài Ngài ra, không có sự cứu rỗi trong bất cứ ai khác.'''
  alternative: Diễn đạt nhẹ hơn là 'không có con đường cứu rỗi nào khác'.
  rationale: Nguyên văn nói trực tiếp rằng sự cứu rỗi không ở trong bất cứ ai khác và lập luận rằng không có danh nào khác; bản dịch không làm nhẹ tuyên bố ấy hoặc thêm hệ thống giáo lý bên ngoài câu.
- issue: Phạm vi của ἀνθρώποις
  choice: loài người
  alternative: người ta; nhân loại
  rationale: Danh từ Hy Lạp ở đây mang nghĩa khái quát, bao gồm nhân loại nói chung. 'Loài người' truyền đạt rõ phạm vi bao quát trong tiếng Việt hiện đại.
- issue: Tiền từ ngầm chỉ Chúa Giê-su trong ἐν ἄλλῳ οὐδενί
  choice: Dùng 'Ngài' theo ngữ cảnh ngay trước đó, rồi giữ 'bất cứ ai khác'.
  alternative: Không có sự cứu rỗi trong một ai khác.
  rationale: Câu Hy Lạp dựa vào ngữ cảnh để chỉ Chúa Giê-su; 'Ngài' giúp câu tiếng Việt đứng vững và trang trọng nhưng không thêm một nhận định vượt quá tiền từ rõ ràng trong văn mạch.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng 'danh' để giữ sắc thái Kinh Thánh; 'nhờ danh ấy' làm rõ quan hệ phương tiện. Không cần chú thích vì 'loài người' đã chuyển tải trực tiếp nghĩa bao hàm của ἀνθρώποις.
