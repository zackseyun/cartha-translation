revisions:
- from: Ngoài Ngài ra, không có sự cứu rỗi trong bất cứ ai khác, vì dưới trời không có danh nào khác được ban giữa loài người để nhờ danh ấy chúng ta phải được cứu.
  to: Ngoài Ngài ra, không có sự cứu rỗi nơi ai khác, vì dưới trời không có danh nào khác được ban cho loài người[a] mà nhờ danh ấy chúng ta phải được cứu.
  rationale: Bản sửa loại bỏ sự lặp ý ở mệnh đề đầu nhưng vẫn giữ tiền từ ngữ cảnh «Ngài» và tính loại trừ tuyệt đối. «Nơi ai khác» là lối diễn đạt trang trọng, tự nhiên cho sự cứu rỗi «ở trong» một ngôi vị. Mệnh đề cuối giữ «danh» làm tiền từ và «phải» cho δεῖ. Chú thích bảo lưu khả năng dịch ἐν ἀνθρώποις theo nghĩa «giữa loài người».
