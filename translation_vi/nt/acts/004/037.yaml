id: ACT.4.37
reference: Acts 4:37
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὑπάρχοντος αὐτῷ ἀγροῦ πωλήσας ἤνεγκεν τὸ χρῆμα καὶ ἔθηκεν ⸀παρὰ τοὺς πόδας τῶν ἀποστόλων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/037.yaml
  text: Since he owned a field[b][a], he sold it and brought the money and laid it at the apostles’ feet.
translation:
  language: vi
  text: Ông có một mảnh đất[a]; ông đã bán nó, đem số tiền[b] đến và đặt dưới chân các sứ đồ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “một thửa ruộng.” Tiếng Hy Lạp dùng một kết cấu nêu hoàn cảnh nền: “ông có một mảnh đất.”'
    reason: lexical_alternative
  - marker: b
    text: 'Hay: “số tiền thu được.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπάρχοντος αὐτῷ ἀγροῦ
  choice: Ông có một thửa ruộng
  rationale: Cụm sở hữu trong kết cấu sinh cách độc lập nêu hoàn cảnh nền. Cách dịch này tự nhiên trong tiếng Việt và không nhấn mạnh quyền sở hữu hơn mức nguyên văn.
- source_word: ἀγροῦ
  choice: một thửa ruộng
  rationale: ἀγρός chỉ một cánh đồng hoặc phần đất; “thửa ruộng” vừa cụ thể, vừa thông dụng, nhưng chú thích giữ phương án rộng hơn là “mảnh đất”.
- source_word: πωλήσας
  choice: nên đã bán đi
  rationale: Phân từ bất định chỉ hành động xảy ra trước các động từ chính. “Đã bán đi” diễn đạt rõ trình tự; “nên” nối hoàn cảnh nền với hành động mà không buộc phải hiểu quan hệ nguyên nhân mạnh.
- source_word: ἤνεγκεν
  choice: đem ... đến
  rationale: φέρω trong ngữ cảnh này có nghĩa mang hoặc đem vật đến một nơi; cách diễn đạt này tự nhiên trong tiếng Việt.
- source_word: τὸ χρῆμα
  choice: số tiền
  rationale: χρῆμα ở đây là tiền nhận được từ việc bán ruộng. “Số tiền” trực tiếp và ít diễn giải hơn “tiền bán ruộng” hay “số tiền thu được”.
- source_word: ἔθηκεν
  choice: đặt
  rationale: τίθημι có nghĩa đặt, để. “Đặt” phù hợp với hình ảnh cụ thể trong câu và giữ sắc thái trang trọng vừa phải.
- source_word: παρὰ τοὺς πόδας τῶν ἀποστόλων
  choice: dưới chân các sứ đồ
  rationale: Giữ nguyên hình ảnh cụ thể của tiếng Hy Lạp về việc đặt tiền tại chân các sứ đồ, thay vì chỉ diễn ý là trao cho họ.
theological_decisions:
- issue: Có nên giữ hình ảnh vật lý về việc trình số tiền dưới quyền quản lý của các sứ đồ hay không
  choice: Giữ cách nói cụ thể “đặt dưới chân các sứ đồ.”
  alternative: Diễn ý là “trao cho các sứ đồ.”
  rationale: Nguyên văn kể một hành động cụ thể đồng thời có thể hàm ý giao số tiền cho các sứ đồ quản lý. Giữ hình ảnh bảo toàn cả hai phương diện mà không thêm kết luận giáo hội học.
- issue: Sắc thái của kết cấu sinh cách độc lập
  choice: 'Dịch là hoàn cảnh nền: “Ông có một thửa ruộng, nên...”'
  alternative: “Vì ông sở hữu một thửa ruộng...” hoặc “Sau khi bán một thửa ruộng mình có...”
  rationale: Kết cấu Hy Lạp có thể chỉ nêu hoàn cảnh chứ không nhất thiết khẳng định quan hệ nguyên nhân mạnh. Bản dịch tránh biến việc có ruộng thành một lý do thần học cho hành động bán.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “sứ đồ” theo cách gọi quen thuộc trong văn bản Kinh Thánh tiếng Việt; giữ hình ảnh “dưới chân” của nguyên văn. Các dấu chú thích [a], [b] đều xuất hiện ngay trong chính văn.
