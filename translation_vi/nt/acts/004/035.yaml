review_pass:
  verdict: revise
  source_fidelity: Cần sửa “dưới chân,” vì παρά τοὺς πόδας nghĩa cơ bản là “bên/cạnh chân, tại chân” và trong ngữ cảnh thành ngữ được diễn đạt tự nhiên hơn là “trước chân,” không phải “ở phía dưới chân.” Câu “tùy theo nhu cầu của họ” cũng nên đổi thành “tùy theo nhu cầu của mỗi người” để phản ánh rõ nét phân phối cá biệt của ἑκάστῳ và τις. Cấu trúc “người ta phân phát” giữ hợp lý thể bị động không nêu tác nhân của διεδίδετο.
  naturalness: Bản sửa dùng lối văn Kinh Thánh Việt ngữ hiện đại, rõ ràng và tự nhiên. Việc thêm chủ ngữ “họ” ở mệnh đề đầu chỉ làm rõ chủ ngữ đã được văn cảnh câu trước cung cấp; “người ta” trong mệnh đề sau vẫn tránh gán việc phân phát cho các sứ đồ.
  terminology: Giữ “các sứ đồ,” là thuật ngữ Kinh Thánh chuẩn và quen thuộc. “Trước chân các sứ đồ” vừa bảo tồn hình ảnh cụ thể vừa tránh hàm ý không chính xác rằng tiền được đặt ở phía dưới chân họ. Chú thích không nên diễn giải hình ảnh này thành khẳng định trực tiếp về “sự quản lý” của các sứ đồ.
  issues:
  - severity: medium
    issue: “dưới chân các sứ đồ” không phản ánh chính xác giới từ παρά.
    rationale: παρὰ τοὺς πόδας diễn tả vị trí “tại/bên chân”; trong tiếng Việt, “trước chân” diễn đạt thành ngữ tự nhiên hơn. “Dưới chân” chuyển sang một quan hệ không gian khác.
  - severity: low
    issue: “tùy theo nhu cầu của họ” làm mờ nét cá biệt của mệnh đề Hy Lạp.
    rationale: ἑκάστῳ và τις nhấn mạnh việc phân phát cho từng người tùy nhu cầu người ấy; “của mỗi người” bảo toàn nét này rõ hơn.
  - severity: low
    issue: Chú thích a nêu “bên/dưới chân” và suy diễn “dưới sự quản lý.”
    rationale: “Dưới chân” không phải là lựa chọn từ vựng chính xác cho παρά; ý quản lý có thể được gợi bởi bối cảnh nhưng không được phát biểu trực tiếp trong cụm từ Hy Lạp.
