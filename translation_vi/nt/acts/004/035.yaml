  text: and they were laying them at the apostles’ feet[b][a], and it was being distributed to each one according as anyone had need.
translation:
  language: vi
  text: và họ đặt chúng trước chân các sứ đồ[a][b]; rồi người ta phân phát cho mỗi người tùy theo nhu cầu của mỗi người.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “tại chân các sứ đồ.” Nguyên văn nói “bên/tại chân các sứ đồ,” giữ hình ảnh cụ thể của việc đặt số tiền trước các sứ đồ.'
    reason: lexical_alternative
  - marker: b
    text: 'Đối tượng của “đặt” và “phân phát” được hiểu từ câu trước: số tiền thu được từ những tài sản đã bán.'
    reason: cross_reference
lexical_decisions:
- source_word: ἐτίθουν
  choice: đặt
  rationale: Thì chưa hoàn thành diễn tả hành động lặp lại trong mạch tường thuật; tiếng Việt không cần thêm dấu hiệu thể khi ngữ cảnh đã làm rõ.
- source_word: παρὰ τοὺς πόδας τῶν ἀποστόλων
  choice: dưới chân các sứ đồ
  rationale: Giữ hình ảnh cụ thể của nguyên văn về việc đặt tài sản dưới sự quản lý của các sứ đồ; đây cũng là cách nói tự nhiên trong tiếng Việt.
- source_word: διεδίδετο
  choice: người ta phân phát
  rationale: Chuyển thể bị động không nêu tác nhân của tiếng Hy Lạp sang cấu trúc vô nhân xưng tự nhiên trong tiếng Việt, mà không xác định ai là người phân phát.
- source_word: ἑκάστῳ
  choice: cho mỗi người
  rationale: Giữ rõ ý phân phối riêng cho từng người.
- source_word: καθότι ἄν τις χρείαν εἶχεν
  choice: tùy theo nhu cầu của họ
  rationale: Diễn đạt tự nhiên quan hệ tương ứng giữa mức phân phát và nhu cầu, đồng thời giữ phạm vi khái quát của τις.
theological_decisions:
- issue: Có nên nói rõ vật được đặt và phân phát hay không
  choice: Dùng đại từ “chúng” ở mệnh đề đầu và lược đối tượng ở mệnh đề sau, để văn cảnh câu trước xác định đó là số tiền thu được từ việc bán tài sản.
  alternative: Nói rõ “số tiền” hoặc “tiền bán được” trong cả hai mệnh đề.
  rationale: Nguyên văn để đối tượng hàm ẩn và dựa vào câu trước; cách dịch này tránh thêm mức độ xác định không có trong câu, nhưng vẫn tự nhiên trong tiếng Việt.
- issue: Tác nhân của việc phân phát
  choice: Dùng “người ta phân phát”, không xác định tác nhân.
  alternative: Dịch “các sứ đồ phân phát”.
  rationale: Động từ Hy Lạp ở thể bị động và không trực tiếp nêu người phân phát; không nên suy diễn tác nhân dù văn cảnh có thể gợi đến các sứ đồ.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “sứ đồ” theo thuật ngữ Kinh Thánh quen thuộc; giữ hình ảnh “dưới chân” và tránh chỉ rõ tác nhân khi nguyên văn không nêu.
