revisions:
- from: Sau khi được thả[a], họ trở về với những người của mình và thuật lại mọi điều các thầy tế lễ cả và các trưởng lão đã nói với họ.
  to: Sau khi được thả, họ đến với những người của mình[a] và thuật lại mọi điều mà các thượng tế và các trưởng lão đã nói với họ.
  rationale: Thay “trở về với” bằng “đến với” để không thêm ý quay lại vào động từ ἦλθον. Chuyển chú thích đến “những người của mình” để phản ánh đúng sự mơ hồ có chủ ý của τοὺς ἰδίους. Dùng “các thượng tế” để biểu thị rõ tập thể lãnh đạo tư tế mà số nhiều ἀρχιερεῖς chỉ đến.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T08:28:09Z'
review_pass:
  verdict: revise
  source_fidelity: Bản dịch truyền đạt đúng trình tự của phân từ Ἀπολυθέντες, hành động đến với nhóm riêng, nội dung báo lại đầy đủ (ὅσα), và đối tượng là các thượng tế cùng các trưởng lão. Tuy nhiên, “trở về” thêm rõ nét ý ‘quay lại’ không được nêu trực tiếp trong ἦλθον, dù phù hợp với bối cảnh. Nên dùng “đến với” để bám sát nguyên văn hơn. Cần đặt chú thích tại cụm tương ứng τοὺς ἰδίους, là điểm có lựa chọn dịch đáng kể trong nguồn và audit trail.
  naturalness: Câu sửa vẫn tự nhiên, hiện đại và trang trọng. “Đến với những người của mình” hơi sát chữ nhưng rõ nghĩa trong ngữ cảnh; chú thích giải thích rằng cụm này có thể chỉ những người cùng nhóm/bạn đồng hành.
  terminology: '“Các thượng tế” diễn đạt chính xác số nhiều οἱ ἀρχιερεῖς: các nhân vật thuộc hàng lãnh đạo tư tế, không phải nhiều người cùng giữ một chức thượng tế duy nhất. “Các trưởng lão” thích hợp cho πρεσβύτεροι trong bối cảnh lãnh đạo Do Thái. Không có vấn đề thần học cần điều chỉnh.'
  issues:
