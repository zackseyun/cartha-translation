id: ACT.4.23
reference: Acts 4:23
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἀπολυθέντες δὲ ἦλθον πρὸς τοὺς ἰδίους καὶ ἀπήγγειλαν ὅσα πρὸς αὐτοὺς οἱ ἀρχιερεῖς καὶ οἱ πρεσβύτεροι εἶπαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/023.yaml
  text: After they were released[a], they went to their own people and reported all that the chief priests and the elders had said to them.
translation:
  language: vi
  text: Sau khi được thả, họ đến với những người của mình[a] và thuật lại mọi điều mà các thượng tế và các trưởng lão đã nói với họ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “những người cùng nhóm với họ”; sát nghĩa: “những người của họ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπολυθέντες
  choice: Sau khi được thả
  rationale: Phân từ bất định thụ động diễn tả hành động xảy ra trước động từ chính; “được thả” tự nhiên và phù hợp với bối cảnh họ vừa bị nhà chức trách giam giữ.
- source_word: δὲ
  choice: không dịch riêng
  rationale: δέ là liên từ chuyển tiếp nhẹ; trong tiếng Việt, quan hệ nối tiếp đã được diễn đạt tự nhiên bằng mệnh đề “Sau khi được thả,” nên không cần thêm “thì” hay “và”.
- source_word: ἦλθον πρὸς
  choice: trở về với
  rationale: Trong ngữ cảnh, Phi-e-rơ và Giăng rời nhà chức trách để về lại cộng đồng của mình. “Trở về với” diễn đạt tự nhiên hướng chuyển động mà không làm thay đổi nội dung.
- source_word: τοὺς ἰδίους
  choice: những người của mình
  rationale: Cụm danh từ hóa có nghĩa đen là “những người thuộc về mình,” chỉ những người cùng nhóm hay cộng đồng; cách dịch này giữ được độ mở của nguyên văn.
- source_word: ἀπήγγειλαν
  choice: thuật lại
  rationale: Động từ chỉ việc báo lại hoặc truyền đạt thông tin. “Thuật lại” phù hợp với việc kể đầy đủ những gì nhà chức trách đã nói.
- source_word: ὅσα
  choice: mọi điều
  rationale: 'Giữ ý bao quát của đại từ quan hệ số nhiều: toàn bộ nội dung đã được nói.'
- source_word: πρὸς αὐτοὺς
  choice: với họ
  rationale: Với động từ λέγω, πρός + đối cách chỉ người được nói với. “Với họ” là cách diễn đạt tự nhiên trong tiếng Việt, không tự ý thêm sắc thái “chống lại.”
- source_word: οἱ ἀρχιερεῖς
  choice: các thầy tế lễ cả
  rationale: Chỉ giới lãnh đạo tư tế, không hàm ý có nhiều người đồng thời giữ chức thượng tế duy nhất. Đây là thuật ngữ Kinh Thánh quen thuộc và chính xác theo bối cảnh.
- source_word: οἱ πρεσβύτεροι
  choice: các trưởng lão
  rationale: Trong bối cảnh hội đồng Do Thái, từ này chỉ các vị lãnh đạo được công nhận chứ không chỉ những người cao tuổi.
- source_word: εἶπαν
  choice: đã nói
  rationale: “Đã” biểu thị tự nhiên rằng lời nói của các lãnh đạo xảy ra trước khi Phi-e-rơ và Giăng thuật lại.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ đại từ “họ” theo nguyên văn, để ngữ cảnh xác định đó là Phi-e-rơ và Giăng. Cụm “những người của mình” không xác định quá mức đó là gia đình, bạn đồng hành hay toàn thể cộng đồng tín hữu.
