  to: 'Tất cả quý vị và toàn thể dân Y-sơ-ra-ên hãy biết rằng: chính nhờ danh[b] Đức Giê-su, Đấng Mê-si-a, người Na-xa-rét[a]—Đấng mà quý vị đã đóng đinh trên thập tự giá, Đấng mà Đức Chúa Trời đã khiến sống lại từ cõi chết—mà người này hiện đứng trước mặt quý vị, khỏe mạnh[c].'
  rationale: Sửa cấu trúc câu để “nhờ danh” làm phương tiện rõ ràng cho việc người được chữa lành đứng khỏe mạnh trước hội đồng. Bỏ “nhưng” vì không được phát biểu trong nguyên văn. Chọn “khỏe mạnh” thay cho “hoàn toàn lành mạnh” để giữ nghĩa thể chất mà không tăng sắc thái. Vì tiếng Việt không cần lặp lại cùng một phương tiện như cấu trúc Hy Lạp, phần lặp/quy chiếu mơ hồ của ἐν τούτῳ được bảo lưu trong chú thích b.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T08:28:23Z'
