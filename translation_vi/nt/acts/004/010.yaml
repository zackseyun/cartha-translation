id: ACT.4.10
reference: Acts 4:10
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: γνωστὸν ἔστω πᾶσιν ὑμῖν καὶ παντὶ τῷ λαῷ Ἰσραὴλ ὅτι ἐν τῷ ὀνόματι Ἰησοῦ Χριστοῦ τοῦ Ναζωραίου, ὃν ὑμεῖς ἐσταυρώσατε, ὃν ὁ θεὸς ἤγειρεν ἐκ νεκρῶν, ἐν τούτῳ οὗτος παρέστηκεν ἐνώπιον ὑμῶν ὑγιής.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/010.yaml
  text: let it be known to all of you and to all the people of Israel that in the name of Jesus the Messiah the Nazarene[a], whom you crucified[c][b], whom God raised from the dead—by this name this man stands before you healthy.
translation:
  language: vi
  text: 'Tất cả quý vị và toàn thể dân Y-sơ-ra-ên hãy biết rằng: chính nhờ danh[b] Đức Giê-su, Đấng Mê-si-a, người Na-xa-rét[a]—Đấng mà quý vị đã đóng đinh trên thập tự giá, Đấng mà Đức Chúa Trời đã khiến sống lại từ cõi chết—mà người này hiện đứng trước mặt quý vị, khỏe mạnh[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Đức Giê-su Christ người Na-xa-rét” hoặc “Đức Giê-su, Đấng Mê-si-a quê Na-xa-rét.” Từ Hy Lạp Χριστός là chức danh “Đấng Mê-si-a”, nhưng cũng có thể được dùng gần như một phần của tên gọi.'
    reason: alternative_reading
  - marker: b
    text: 'Cụm từ Hy Lạp ở cuối câu, được diễn đạt bằng “nhờ danh” trong bản dịch này, cũng có thể chỉ trực tiếp Đức Giê-su: “nhờ Ngài.” Cụm này có thể quy chiếu đến chính Đức Giê-su hoặc cụ thể hơn đến danh Ngài vừa được nhắc đến.'
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “được lành” hoặc “nguyên vẹn.” Từ Hy Lạp ὑγιής chỉ tình trạng khỏe mạnh, nguyên vẹn, hoặc được phục hồi về thể chất.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γνωστὸν ἔστω
  choice: hãy biết rằng
  rationale: Diễn đạt tự nhiên một mệnh lệnh công bố công khai, giữ được lực mệnh lệnh của cấu trúc Hy Lạp.
- source_word: πᾶσιν ὑμῖν καὶ παντὶ τῷ λαῷ Ἰσραήλ
  choice: tất cả quý vị và toàn dân Y-sơ-ra-ên
  rationale: 'Giữ hai nhóm người nghe: những người đang hiện diện và toàn dân Y-sơ-ra-ên; “quý vị” phù hợp với lời phát biểu trang trọng trước hội đồng.'
- source_word: ἐν τῷ ὀνόματι
  choice: trong danh
  rationale: Giữ sát thành ngữ Hy Lạp, đồng thời trong ngữ cảnh vẫn hàm ý quyền năng và tác nhân khiến sự chữa lành xảy ra.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Đức Giê-su, Đấng Mê-si-a
  rationale: Dịch Χριστός theo chức danh thay vì xem như họ riêng, làm rõ ý nghĩa Đấng được xức dầu trong lời công bố trước dân Y-sơ-ra-ên.
- source_word: τοῦ Ναζωραίου
  choice: người Na-xa-rét
  rationale: Phản ánh trực tiếp danh xưng Ναζωραῖος; cách nói này tự nhiên và phân biệt với lối dịch địa danh “quê Na-xa-rét”.
- source_word: ὃν ὑμεῖς ἐσταυρώσατε
  choice: Đấng mà quý vị đã đóng đinh trên thập tự giá
  rationale: Giữ lời cáo buộc trực tiếp và hành động đã xảy ra; bổ sung “trên thập tự giá” để động từ tiếng Việt rõ nghĩa.
- source_word: ὃν ὁ θεὸς ἤγειρεν ἐκ νεκρῶν
  choice: nhưng Đức Chúa Trời đã khiến sống lại từ cõi chết
  rationale: Giữ rõ tác nhân là Đức Chúa Trời và nội dung phục sinh; “nhưng” diễn đạt sự đối lập tu từ giữa hành động của người nghe và hành động của Đức Chúa Trời.
- source_word: ἐν τούτῳ
  choice: chính nhờ Ngài
  rationale: Hiểu đại từ chỉ định theo nghĩa công cụ, quy chiếu về Đức Giê-su vừa được nêu; ghi nhận khả năng quy chiếu cụ thể hơn đến “danh này” trong chú thích.
- source_word: οὗτος παρέστηκεν ἐνώπιον ὑμῶν
  choice: người này đang đứng trước mặt quý vị
  rationale: “Người này” làm rõ người được chữa lành; “đang đứng” thể hiện tình trạng hiện tại do thì hoàn thành Hy Lạp.
- source_word: ὑγιής
  choice: hoàn toàn lành mạnh
  rationale: Diễn tả tình trạng thể chất đã được phục hồi, với “hoàn toàn” truyền đạt sắc thái nguyên vẹn mà không mở rộng sang nghĩa cứu rỗi.
theological_decisions:
- issue: Dịch Χριστοῦ như chức danh hay dạng tên riêng
  choice: Đấng Mê-si-a
  alternative: Đấng Christ
  rationale: Trong lời công bố trước các nhà lãnh đạo Y-sơ-ra-ên, chức danh mang nội dung cứu thế rõ rệt; cách dịch này giữ ý nghĩa của Χριστός thay vì biến nó thành một thành tố tên riêng.
- issue: Quan hệ đối lập giữa việc đóng đinh và sự phục sinh
  choice: quý vị đã đóng đinh... nhưng Đức Chúa Trời đã khiến sống lại
  alternative: quý vị đã đóng đinh... Đức Chúa Trời đã khiến sống lại
  rationale: Từ “nhưng” không có hình thức tương ứng tường minh trong Hy Lạp, song diễn đạt tự nhiên sự đối lập mạnh vốn có giữa hai mệnh đề quan hệ mà không thêm một khẳng định thần học mới.
- issue: Phạm vi quy chiếu của ἐν τούτῳ
  choice: chính nhờ Ngài
  alternative: chính nhờ danh này
  rationale: Đại từ có thể chỉ chính Đức Giê-su theo nghĩa công cụ, nhưng cũng có thể nhắc cụ thể đến “danh” vừa nói; bản chính chọn quy chiếu nhân vị và bảo lưu cách kia trong chú thích.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, thích hợp với lời tuyên bố trước hội đồng. Dùng “quý vị” để vừa lịch sự vừa giữ lời quy trách nhiệm trực tiếp; dùng “Đức Giê-su”, “Đức Chúa Trời” theo lối gọi kính trọng phổ biến trong tiếng Việt Cơ Đốc. Dấu gạch ngang làm rõ hai mệnh đề mô tả Đức Giê-su mà không che khuất mệnh đề chính.
