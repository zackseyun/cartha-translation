  source_fidelity: 'Bản nháp giữ đúng các yếu tố chính: hai nhóm người nghe, danh/tước hiệu của Đức Giê-su, việc đóng đinh, Đức Chúa Trời khiến sống lại từ cõi chết, và tình trạng khỏe mạnh của người được chữa lành. Tuy nhiên, “nhưng” không có trong hai mệnh đề quan hệ Hy Lạp và không cần thiết để dịch câu. Cấu trúc “Chính trong danh ... chính nhờ Ngài mà” cũng làm cụm đầu bị treo trong tiếng Việt. Bản sửa dùng một cấu trúc công cụ tự nhiên, đồng thời chú thích cách hiểu thay thế của ἐν τούτῳ.'
