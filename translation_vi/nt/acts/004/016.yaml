language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: λέγοντες· Τί ⸀ποιήσωμεν τοῖς ἀνθρώποις τούτοις; ὅτι μὲν γὰρ γνωστὸν σημεῖον γέγονεν δι’ αὐτῶν πᾶσιν τοῖς κατοικοῦσιν Ἰερουσαλὴμ φανερόν, καὶ οὐ δυνάμεθα ⸀ἀρνεῖσθαι·
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/016.yaml
  text: saying[a], “What should we do with these men? For indeed, a notable sign has happened through them, evident to all who live in Jerusalem, and we cannot deny it.”
translation:
  language: vi
  text: 'họ nói: “Chúng ta phải làm gì với những người này? Vì quả thật, qua họ đã xảy ra một dấu lạ[a], điều mà mọi người ở Giê-ru-sa-lem đều biết rõ, và chúng ta không thể phủ nhận.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “một dấu lạ đáng chú ý.” Từ Hy Lạp γνωστόν có thể mang nghĩa “được biết, nổi tiếng”; trong ngữ cảnh này, nó nói đến một dấu lạ đã được công chúng biết rõ.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντες
  choice: họ nói
  rationale: Phân từ hiện tại nối với ngữ cảnh trước và dẫn vào lời bàn luận của hội đồng; cách diễn đạt này tự nhiên trong văn kể chuyện tiếng Việt.
- source_word: Τί ποιήσωμεν
  choice: Chúng ta phải làm gì
  rationale: Diễn đạt câu hỏi cân nhắc của thức giả định aorist bằng lối nói tự nhiên trong tiếng Việt hiện đại.
- source_word: τοῖς ἀνθρώποις τούτοις
  choice: với những người này
  rationale: Giữ đúng thành ngữ ‘làm gì với’; ngữ cảnh xác định những người được nói đến là Phi-e-rơ và Giăng.
- source_word: ὅτι μὲν γὰρ
  choice: Vì quả thật
  rationale: Bảo toàn cả chức năng giải thích của γάρ lẫn sắc thái nhấn mạnh của μέν.
- source_word: γνωστὸν σημεῖον
  choice: một dấu lạ mà ai cũng biết
  rationale: γνωστός ở đây chỉ điều đã được công chúng biết đến; ‘dấu lạ’ giữ sắc thái thần học của σημεῖον mà không thu hẹp thành ‘phép lạ’.
- source_word: γέγονεν
  choice: đã xảy ra
  rationale: Diễn đạt một biến cố đã hoàn tất và có kết quả hiện còn rõ ràng, phù hợp với thì hoàn thành Hy Lạp.
- source_word: δι’ αὐτῶν
  choice: qua họ
  rationale: Giữ ý phương tiện hoặc tác nhân trung gian của διά với sở hữu cách, không gán cho các sứ đồ quyền năng độc lập.
- source_word: πᾶσιν τοῖς κατοικοῦσιν Ἰερουσαλὴμ φανερόν
  choice: điều ấy hiển nhiên đối với tất cả cư dân Giê-ru-sa-lem
  rationale: Thể hiện tính công khai, rõ ràng của dấu lạ trước toàn thể những người cư trú tại thành.
- source_word: οὐ δυνάμεθα ἀρνεῖσθαι
  choice: chúng ta không thể phủ nhận
  rationale: Cách nói gọn, tự nhiên, giữ nguyên sức mạnh của lời thừa nhận bất đắc dĩ; đối tượng được hiểu từ mệnh đề trước.
theological_decisions:
- issue: Ý nghĩa của σημεῖον trong bối cảnh phép chữa lành công khai
  choice: dấu lạ
  alternative: phép lạ
  rationale: ‘Dấu lạ’ duy trì ý nghĩa một việc kỳ diệu mang tính chỉ dấu trong văn phong Lu-ca, thay vì chỉ nhấn mạnh bản chất siêu nhiên của biến cố.
- issue: Sắc thái của γνωστόν
  choice: mà ai cũng biết
  alternative: đáng chú ý
  rationale: Ngữ cảnh nhấn mạnh sự nhìn nhận công khai tại Giê-ru-sa-lem; chú thích vẫn bảo lưu khả năng hiểu từ này theo sắc thái ‘nổi tiếng/đáng chú ý’.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Giê-ru-sa-lem” theo dạng tên riêng Kinh Thánh quen thuộc; giữ cấu trúc lời bàn luận và sắc thái thừa nhận bất đắc dĩ của các nhà lãnh đạo.
