    rationale: «một dấu lạ mà ai cũng biết; điều ấy hiển nhiên đối với tất cả cư dân Giê-ru-sa-lem» diễn đạt hai lần gần cùng một ý và «ai cũng» không còn được giới hạn rõ theo πᾶσιν τοῖς κατοικοῦσιν Ἰερουσαλήμ. Gộp ý công khai vào «mọi người ở Giê-ru-sa-lem đều biết rõ» phản ánh câu nguồn rõ và tự nhiên hơn.
