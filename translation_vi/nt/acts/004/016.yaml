  source_fidelity: Bản nháp truyền đạt đúng câu hỏi cân nhắc, tính công khai của dấu lạ, tác nhân trung gian «qua họ», và lời thừa nhận không thể phủ nhận. Tuy nhiên, cách tách «một dấu lạ mà ai cũng biết» khỏi «điều ấy hiển nhiên đối với tất cả cư dân...» vừa lặp ý vừa làm «ai cũng biết» có phạm vi rộng không cần thiết, trong khi tiếng Hy Lạp quy tính hiển nhiên cho những người cư ngụ tại Giê-ru-sa-lem.
  naturalness: Câu sửa đặt phạm vi «mọi người ở Giê-ru-sa-lem» trực tiếp vào mệnh đề công khai của dấu lạ, tự nhiên hơn trong tiếng Việt hiện đại và tránh chuỗi hai mệnh đề gần đồng nghĩa.
  terminology: Giữ «dấu lạ» cho σημεῖον, «Giê-ru-sa-lem» cho Ἰερουσαλήμ, và «qua họ» cho δι’ αὐτῶν. Chú thích được neo vào «dấu lạ» để giải thích sắc thái γνωστόν mà không khẳng định quá mức nghĩa «đáng chú ý».
  issues:
