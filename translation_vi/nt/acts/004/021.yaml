source:
  edition: SBLGNT
  text: οἱ δὲ προσαπειλησάμενοι ἀπέλυσαν αὐτούς, μηδὲν εὑρίσκοντες τὸ πῶς ⸀κολάσωνται αὐτούς, διὰ τὸν λαόν, ὅτι πάντες ἐδόξαζον τὸν θεὸν ἐπὶ τῷ γεγονότι·
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/021.yaml
  text: So after further threatening them[a], they released them, finding no way to punish them because of the people, since everyone was glorifying God for what had happened.
translation:
  language: vi
  text: Sau khi lại đe dọa hai người ấy, họ thả hai người ấy ra; vì dân chúng, họ không tìm được cách nào để trừng phạt họ. Bởi mọi người đều tôn vinh Đức Chúa Trời vì việc đã xảy ra.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσαπειλησάμενοι
  choice: sau khi đe dọa họ thêm
  rationale: Diễn đạt sắc thái bổ sung hoặc gia tăng của tiền tố προσ-, nối tiếp những lời đe dọa đã có, đồng thời vẫn tự nhiên trong tiếng Việt.
- source_word: ἀπέλυσαν
  choice: họ thả hai người ra
  rationale: Trong bối cảnh bị nhà chức trách tạm giữ, ἀπολύω có nghĩa là phóng thích hoặc cho đi. “Thả ... ra” là cách nói hiện đại, rõ ràng; “hai người” làm sáng tỏ đối tượng số nhiều từ văn cảnh.
- source_word: μηδὲν εὑρίσκοντες τὸ πῶς κολάσωνται αὐτούς
  choice: không tìm được cách nào để trừng phạt họ
  rationale: Cụm τὸ πῶς với động từ giả định chỉ phương cách có thể tiến hành việc trừng phạt; bản dịch giữ rõ ý nhà chức trách không tìm ra cách thực hiện.
- source_word: διὰ τὸν λαόν
  choice: vì dân chúng
  rationale: διά với đối cách mang nghĩa nguyên nhân. λαός ở đây chỉ dân chúng nói chung, không chỉ một đám đông nhất thời.
- source_word: πάντες
  choice: mọi người
  rationale: Giữ nghĩa bao quát của πάντες và phù hợp tự nhiên với văn cảnh.
- source_word: ἐδόξαζον τὸν θεόν
  choice: đều tôn vinh Đức Chúa Trời
  rationale: “Tôn vinh” bảo toàn ngôn ngữ quy vinh quang cho Đức Chúa Trời của δοξάζω. Từ “đều” kết hợp với “mọi người” và ngữ cảnh diễn tả hành động đang diễn ra.
- source_word: ἐπὶ τῷ γεγονότι
  choice: về việc đã xảy ra
  rationale: Diễn đạt sự việc đã hoàn tất nhưng còn tác động trong hiện tại; “về” giữ được quan hệ sự việc ấy là căn cứ khiến dân chúng tôn vinh Đức Chúa Trời.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Đức Chúa Trời” theo lối gọi phổ biến trong bản dịch Kinh Thánh tiếng Việt; giữ cấu trúc nhân quả của nguyên văn nhưng điều chỉnh trật tự câu để tiếng Việt tự nhiên.
