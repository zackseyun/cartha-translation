  source_fidelity: 'Bản dịch phản ánh đúng cấu trúc đối chiếu và các yếu tố chính của nguyên văn: ὅτι được diễn đạt hợp mạch bằng “Vì”; thì quá khứ chủ động của việc Giăng làm báp-têm, tương lai bị động “anh em sẽ được báp-têm,” sự đối lập nước/Đức Thánh Linh, và thời điểm gần “không còn bao nhiêu ngày nữa” đều được giữ. Không thêm tác nhân cho thể bị động.'
  naturalness: Câu văn rõ ràng, trang trọng vừa phải và tự nhiên trong tiếng Việt Cơ Đốc hiện đại. “Giăng,” “anh em,” “làm phép báp-têm,” và “Đức Thánh Linh” nhất quán với văn phong Kinh Thánh Việt ngữ quen thuộc. Cụm “không còn bao nhiêu ngày nữa” diễn đạt tự nhiên ý “không nhiều ngày nữa.”
  terminology: “Báp-têm” giữ thuật ngữ tôn giáo truyền thống mà không áp đặt cách thức dìm; “bằng nước” phù hợp nghĩa phương tiện của ὕδατι. “Trong Đức Thánh Linh” phản ánh ἐν mà không quyết định dứt khoát nghĩa phạm vi hay phương tiện. Chú thích nêu đúng phương án “bằng Đức Thánh Linh” và lý do ngữ pháp.
