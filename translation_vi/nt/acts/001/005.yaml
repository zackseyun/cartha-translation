id: ACT.1.5
reference: Acts 1:5
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὅτι Ἰωάννης μὲν ἐβάπτισεν ὕδατι, ὑμεῖς δὲ ⸂ἐν πνεύματι βαπτισθήσεσθε⸃ ἁγίῳ οὐ μετὰ πολλὰς ταύτας ἡμέρας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/005.yaml
  text: For John baptized with water[a], but you will be baptized in the Holy Spirit not many days from now.
translation:
  language: vi
  text: Vì Giăng đã làm phép báp-têm bằng nước, còn anh em sẽ được báp-têm trong Đức Thánh Linh[a], không còn bao nhiêu ngày nữa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “bằng Đức Thánh Linh.” Giới từ Hy Lạp ở đây có thể được hiểu là “trong” hoặc “bằng.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: Vì
  rationale: Trong mạch văn, từ này nêu lý do hoặc lời giải thích cho lời hứa ở câu trước; “Vì” nối ý tự nhiên mà vẫn giữ quan hệ giải thích của nguyên văn.
- source_word: ἐβάπτισεν
  choice: đã làm phép báp-têm
  rationale: Giữ thuật ngữ tôn giáo quen thuộc và không quy định cách thức thực hiện như cách dịch “dìm xuống” có thể hàm ý.
- source_word: ὕδατι
  choice: bằng nước
  rationale: Cách dịch này diễn đạt tự nhiên nghĩa phương tiện của cách dữ cách Hy Lạp trong tiếng Việt.
- source_word: ἐν πνεύματι ἁγίῳ
  choice: trong Đức Thánh Linh
  rationale: “Trong” phản ánh khá trực tiếp giới từ ἐν và giữ mở khả năng hiểu là phạm vi; phương án chỉ phương tiện “bằng Đức Thánh Linh” được ghi ở chú thích.
- source_word: βαπτισθήσεσθε
  choice: anh em sẽ được báp-têm
  rationale: Giữ nguyên thì tương lai và thể bị động, đồng thời không nêu rõ tác nhân vì nguyên văn cũng để tác nhân hàm ẩn.
- source_word: οὐ μετὰ πολλὰς ταύτας ἡμέρας
  choice: không còn bao nhiêu ngày nữa
  rationale: Diễn đạt tự nhiên mốc thời gian sắp tới, đồng thời vẫn giữ rõ đơn vị “ngày” và ý rằng việc ấy sẽ sớm xảy ra.
theological_decisions:
- issue: Cách dịch ἐν πνεύματι ἁγίῳ trong công thức báp-têm nhạy cảm về thần học
  choice: trong Đức Thánh Linh
  alternative: bằng Đức Thánh Linh
  rationale: Giới từ ἐν có thể chỉ phạm vi hoặc phương tiện. Bản chính dùng “trong” để phản ánh hình thức Hy Lạp và không quyết định thay người đọc; cách hiểu theo phương tiện được bảo tồn trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. Dùng “Giăng” và “Đức Thánh Linh” theo lối gọi quen thuộc trong tiếng Việt Cơ Đốc; dùng “anh em” cho đại từ số nhiều chỉ các môn đồ. Cấu trúc đối chiếu “Giăng… còn anh em…” giữ sự cân xứng của nguyên văn.
