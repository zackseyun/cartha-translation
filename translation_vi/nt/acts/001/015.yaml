source:
  edition: SBLGNT
  text: Καὶ ἐν ταῖς ἡμέραις ταύταις ἀναστὰς Πέτρος ἐν μέσῳ τῶν ⸀ἀδελφῶν εἶπεν (ἦν τε ὄχλος ὀνομάτων ἐπὶ τὸ αὐτὸ ⸀ὡς ἑκατὸν εἴκοσι)·
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/015.yaml
  text: And in those days Peter stood up in the midst of the brothers and said (the number of names together was about one hundred twenty),[a]
translation:
  language: vi
  text: Trong những ngày ấy, Phi-e-rơ đứng dậy giữa các anh em và nói (và số người cùng tụ họp vào khoảng một trăm hai mươi người):[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể hiểu là “các anh chị em”; tiếng Hy Lạp dùng từ “anh em”, nhưng trong cộng đồng đang tụ họp này, từ ấy có thể bao gồm mọi người đồng đạo, kể cả phụ nữ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστὰς
  choice: đứng dậy
  rationale: Phân từ bất định quá khứ của ἀνίστημι dẫn vào hành động của Phi-e-rơ trước khi nói; “đứng dậy” tự nhiên và giữ được hành động cụ thể.
- source_word: ἐν μέσῳ
  choice: giữa
  rationale: Diễn tả vị trí của Phi-e-rơ ở trong cộng đồng đang tụ họp; “giữa” ngắn gọn, tự nhiên và giữ sắc thái không gian.
- source_word: ἀδελφῶν
  choice: các anh em
  rationale: Giữ hình thức giống đực số nhiều của nguyên văn. Trong ngữ cảnh, từ này có thể chỉ toàn thể các tín hữu, kể cả phụ nữ; điều đó được nêu ở chú thích.
- source_word: ὄχλος ὀνομάτων
  choice: số người
  rationale: Cụm từ theo nghĩa đen là “đám đông các tên”, một lối nói chỉ số người hiện diện. Tiếng Việt không dùng “số tên” theo nghĩa này, nên “số người” truyền đạt thành ngữ Hy Lạp rõ ràng và tự nhiên.
- source_word: ἐπὶ τὸ αὐτό
  choice: tụ họp
  rationale: Thành ngữ diễn tả việc ở cùng nhau hoặc tập hợp lại; “tụ họp” phù hợp với khung cảnh cộng đồng và tránh cách nói gượng “ở cùng một chỗ”.
- source_word: ὡς ἑκατὸν εἴκοσι
  choice: vào khoảng một trăm hai mươi
  rationale: ὡς đứng trước con số biểu thị sự ước lượng; “vào khoảng” là cách diễn đạt tự nhiên, trang trọng vừa phải trong tiếng Việt.
theological_decisions:
- issue: Phạm vi giới tính của ἀδελφῶν trong cộng đồng tụ họp
  choice: Dịch “các anh em” trong chính văn và chú thích rằng từ này có thể bao gồm cả các nữ tín hữu.
  alternative: “các anh chị em” hoặc “các tín hữu”
  rationale: Cách dịch chính văn giữ dấu hiệu giống đực của từ Hy Lạp, còn chú thích bảo tồn khả năng quy chiếu bao gồm mọi người đồng đạo mà không áp đặt cách hiểu ấy vào nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Phi-e-rơ” theo lối phiên âm Kinh Thánh quen thuộc. Cụm chen trong ngoặc được giữ để phản ánh cấu trúc nguyên văn; τε được thể hiện qua quan hệ bổ sung tự nhiên của mệnh đề chen, không thêm một từ nối gây nặng câu.
