translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Câu giữ mạch kết quả của nguyên văn. Không chú thích riêng cho διάλεκτος vì bản dịch chọn nghĩa rộng “ngôn ngữ”; nếu cần thể hiện trực tiếp tính đa nghĩa, có thể chú thích phương án “phương ngữ” trong ấn bản nghiên cứu.
