revisions:
- from: Việc ấy đã được tất cả những người sống tại Giê-ru-sa-lem biết đến, đến nỗi thửa ruộng ấy được gọi theo ngôn ngữ của họ là Ha-ken-đa-ma[a], nghĩa là Ruộng Máu.
  to: Việc ấy đã được tất cả những người sống tại Giê-ru-sa-lem biết đến, đến nỗi thửa ruộng ấy được gọi bằng chính ngôn ngữ của họ[b] là Ha-kên-đa-mách[a], nghĩa là Ruộng Máu.
  rationale: Bản sửa chỉ điều chỉnh phiên âm tên riêng để phù hợp với Ἁκελδαμάχ và sửa giới từ/cách diễn đạt cho sát cụm “bằng chính ngôn ngữ của họ.” Chú thích về phương án “phương ngữ” được thêm để ghi nhận tính mở của διάλεκτος. Ý nghĩa của câu không thay đổi.
