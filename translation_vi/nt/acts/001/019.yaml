source:
  edition: SBLGNT
  text: καὶ γνωστὸν ἐγένετο πᾶσι τοῖς κατοικοῦσιν Ἰερουσαλήμ, ὥστε κληθῆναι τὸ χωρίον ἐκεῖνο τῇ ⸀ἰδίᾳ διαλέκτῳ αὐτῶν Ἁκελδαμάχ, τοῦτ’ ἔστιν Χωρίον Αἵματος.—
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/019.yaml
  text: And it became known to all those living in Jerusalem[a], so that in their own language that field was called Akeldamach, that is[b], Field of Blood.
translation:
  language: vi
  text: Việc ấy đã được tất cả những người sống tại Giê-ru-sa-lem biết đến, đến nỗi thửa ruộng ấy được gọi bằng chính ngôn ngữ của họ[b] là Ha-kên-đa-mách[a], nghĩa là Ruộng Máu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dạng Hy Lạp tại đây là Ἁκελδαμάχ (Hakeldamach), có phụ âm χ ở cuối. Tên này cũng thường được viết là “Ha-kên-đa-ma” trong các bản dịch.
    reason: alternative_reading
  - marker: b
    text: Hoặc “bằng chính phương ngữ của họ.” Từ Hy Lạp διάλεκτος có thể chỉ một ngôn ngữ hoặc một phương ngữ.
    reason: lexical_alternative
lexical_decisions:
- source_word: γνωστὸν ἐγένετο
  choice: đã được ... biết đến
  rationale: Diễn đạt tự nhiên cấu trúc vô nhân xưng, cho thấy sự việc trở nên phổ biến mà không thêm ý rằng nó chỉ là điều hiển nhiên.
- source_word: πᾶσι τοῖς κατοικοῦσιν Ἰερουσαλήμ
  choice: tất cả những người sống tại Giê-ru-sa-lem
  rationale: Giữ đầy đủ sắc thái chỉ những người cư trú tại thành, đồng thời dùng cách nói hiện đại, dễ hiểu.
- source_word: ὥστε
  choice: đến nỗi
  rationale: Thể hiện quan hệ kết quả trong ngữ cảnh chính xác hơn một từ nối mang nghĩa suy luận như “vì vậy”.
- source_word: κληθῆναι
  choice: được gọi
  rationale: Giữ thể bị động của động từ Hy Lạp và phù hợp tự nhiên với việc gọi tên một địa điểm.
- source_word: τὸ χωρίον ἐκεῖνο
  choice: thửa ruộng ấy
  rationale: χωρίον có thể chỉ một mảnh đất hay cánh đồng; “thửa ruộng” vừa cụ thể vừa duy trì liên hệ với lời giải nghĩa “Ruộng Máu”.
- source_word: τῇ ἰδίᾳ διαλέκτῳ αὐτῶν
  choice: theo ngôn ngữ của họ
  rationale: διάλεκτος có thể chỉ ngôn ngữ hoặc phương ngữ. “Ngôn ngữ” là cách diễn đạt rộng và tự nhiên, không áp đặt một phân biệt kỹ thuật; “của họ” bảo toàn ἰδίᾳ αὐτῶν.
- source_word: Ἁκελδαμάχ
  choice: Ha-ken-đa-ma
  rationale: Phiên âm tên riêng theo cách đọc quen thuộc, dễ đọc trong tiếng Việt; chú thích ghi nhận dạng Hy Lạp kết thúc bằng phụ âm χ.
- source_word: τοῦτ’ ἔστιν
  choice: nghĩa là
  rationale: Công thức này đưa vào lời giải nghĩa của địa danh; “nghĩa là” ngắn gọn và tự nhiên trong tiếng Việt.
- source_word: Χωρίον Αἵματος
  choice: Ruộng Máu
  rationale: Giữ lời giải nghĩa địa danh được chính bản văn Hy Lạp cung cấp và duy trì sự tương ứng với χωρίον.
