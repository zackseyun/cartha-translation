review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch truyền đạt đúng diễn tiến chính: sự việc trở nên được biết đến rộng rãi tại Giê-ru-sa-lem, với kết quả là thửa ruộng được gọi bằng ngôn ngữ của cư dân ấy. Tuy nhiên, tên riêng trong câu hiện là “Ha-ken-đa-ma,” trong khi chú thích xác nhận dạng Hy Lạp Ἁκελδαμάχ có phụ âm cuối χ; bản văn nên phản ánh nhất quán dạng được chọn.'
  naturalness: Câu nhìn chung tự nhiên và giữ được văn phong trang trọng vừa phải. “Bằng chính ngôn ngữ của họ” sát và tự nhiên hơn “theo ngôn ngữ của họ,” vì nguyên văn dùng cách thức/ngôn ngữ mà tên ấy được gọi.
  terminology: “Thửa ruộng” và “Ruộng Máu” phản ánh nhất quán χωρίον. Dùng “Ha-kên-đa-mách” bảo toàn gần hơn dạng Ἁκελδαμάχ, gồm âm đầu Ha- và phụ âm cuối -ch/χ; chú thích có thể ghi nhận dạng quen thuộc không có phụ âm cuối. Thêm chú thích cho “ngôn ngữ” giúp bảo tồn khả năng nghĩa “phương ngữ” của διάλεκτος mà không buộc bản dịch chính phải dùng thuật ngữ kỹ thuật.
  issues:
  - severity: medium
    issue: Tên riêng trong bản văn không nhất quán với dạng Hy Lạp được nêu trong chú thích.
    rationale: Bản văn dùng “Ha-ken-đa-ma,” nhưng Ἁκελδαμάχ kết thúc bằng χ, và chú thích cũng nêu phụ âm này. Sửa thành “Ha-kên-đa-mách” phản ánh nhất quán hơn tên trong SBLGNT.
  - severity: low
    issue: “theo ngôn ngữ của họ” chưa diễn đạt sát nhất cụm τῇ ἰδίᾳ διαλέκτῳ αὐτῶν.
    rationale: “Bằng chính ngôn ngữ của họ” diễn tả tự nhiên hơn cách tên địa danh được gọi, đồng thời làm rõ nét nhấn của ἰδίᾳ (“chính/của riêng họ”).
