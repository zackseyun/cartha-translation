revisions:
- from: Tất cả những người ấy đều đồng lòng chuyên tâm cầu nguyện[a], cùng với các phụ nữ[b], Ma-ri, mẹ của Đức Giê-su, và các anh em của Ngài[c].
  to: Tất cả những người ấy đều một lòng kiên trì cầu nguyện[a], cùng với các phụ nữ[b], Ma-ri, mẹ của Đức Giê-su, và các anh em của Ngài[c].
  rationale: Sửa “đồng lòng chuyên tâm” thành “một lòng kiên trì” để phản ánh rõ hơn tính hiệp nhất (ὁμοθυμαδόν) và sự chuyên cần liên tục (ἦσαν προσκαρτεροῦντες), đồng thời giữ câu tiếng Việt tự nhiên. Chú thích b được chỉnh để phương án thay thế thực sự phản ánh việc nguyên ngữ không dùng mạo từ. Các yếu tố còn lại, kể cả cách dịch “anh em” và chú thích về khả năng nghĩa rộng của adelphoi, được giữ nguyên.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T08:33:17Z'
review_pass:
  verdict: revise
  source_fidelity: Bản dịch truyền đạt đúng các thành phần chính của câu, gồm toàn thể nhóm, sự đồng lòng, việc cầu nguyện, các phụ nữ, Ma-ri mẹ Đức Giê-su, và các anh em của Ngài. Tuy nhiên, “đồng lòng chuyên tâm cầu nguyện” chưa biểu đạt đủ rõ sắc thái hành động đang tiếp diễn và kiên trì của cấu trúc vị hoàn thành tiếp diễn ἦσαν προσκαρτεροῦντες. “Một lòng kiên trì cầu nguyện” thể hiện tốt hơn cả tính bền bỉ lẫn sự hiệp nhất.
  naturalness: Câu sửa vẫn giữ văn phong hiện đại, trang trọng và nhịp liệt kê tự nhiên trong tiếng Việt. “Một lòng kiên trì cầu nguyện” rõ nghĩa hơn “đồng lòng chuyên tâm cầu nguyện” mà không nặng nề.
  terminology: “Ma-ri,” “Đức Giê-su,” và “các anh em của Ngài” phù hợp cách dùng Kinh Thánh tiếng Việt. “Anh em” giữ nguyên độ mở của ἀδελφοί và chú thích không áp đặt cách hiểu về quan hệ gia đình.
  issues:
  - severity: medium
