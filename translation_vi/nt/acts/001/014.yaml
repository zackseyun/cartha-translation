id: ACT.1.14
reference: Acts 1:14
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οὗτοι πάντες ἦσαν προσκαρτεροῦντες ὁμοθυμαδὸν τῇ ⸀προσευχῇ σὺν γυναιξὶν καὶ ⸀Μαριὰμ τῇ μητρὶ τοῦ Ἰησοῦ καὶ ⸀σὺν τοῖς ἀδελφοῖς αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/014.yaml
  text: All of these were continually devoting themselves with one accord to prayer[a], together with the women, and Mary the mother of Jesus[c][b], and with his brothers.
translation:
  language: vi
  text: Tất cả những người ấy đều một lòng kiên trì cầu nguyện[a], cùng với các phụ nữ[b], Ma-ri, mẹ của Đức Giê-su, và các anh em của Ngài[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “đồng lòng” hoặc “hiệp một lòng”; từ Hy Lạp nhấn mạnh sự thống nhất về ý hướng và mục đích, chứ không chỉ việc tụ họp cùng một nơi.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch “cùng với phụ nữ.” Tiếng Hy Lạp không có mạo từ, nhưng cụm từ này có lẽ chỉ một nhóm phụ nữ đã được biết đến và gắn bó với các môn đồ.
    reason: lexical_alternative
  - marker: c
    text: “Anh em” dịch từ adelphoi trong tiếng Hy Lạp. Một số người hiểu từ này theo nghĩa rộng hơn là những người thân hoặc bà con gần; tại đây, bản văn không nói rõ hơn.
    reason: alternative_reading
lexical_decisions:
- source_word: οὗτοι πάντες
  choice: Tất cả những người ấy
  rationale: Giữ cả sắc thái chỉ định của οὗτοι và ý bao quát của πάντες, đồng thời tự nhiên trong tiếng Việt.
- source_word: ἦσαν προσκαρτεροῦντες
  choice: đều ... chuyên tâm
  rationale: Diễn đạt hành động kéo dài của cấu trúc vị hoàn thành tiếp diễn và ý kiên trì, tận tụy của προσκαρτερέω mà không làm câu tiếng Việt nặng nề.
- source_word: ὁμοθυμαδόν
  choice: đồng lòng
  rationale: Thể hiện sự hiệp nhất về ý hướng và mục đích, không chỉ việc có mặt cùng nhau.
- source_word: τῇ προσευχῇ
  choice: cầu nguyện
  rationale: Với προσκαρτερέω, danh từ ở cách dữ cách chỉ điều họ chuyên tâm thực hiện; tiếng Việt tự nhiên dùng động từ “cầu nguyện”.
- source_word: σὺν γυναιξίν
  choice: cùng với các phụ nữ
  rationale: “Các phụ nữ” tự nhiên hơn “những phụ nữ” trong ngữ cảnh một nhóm đã được biết đến, dù nguyên văn không có mạo từ.
- source_word: Μαριὰμ τῇ μητρὶ τοῦ Ἰησοῦ
  choice: Ma-ri, mẹ của Đức Giê-su
  rationale: Dùng dạng tên quen thuộc trong tiếng Việt và giữ nguyên cấu trúc đồng vị xác định Ma-ri.
- source_word: σὺν τοῖς ἀδελφοῖς αὐτοῦ
  choice: và các anh em của Ngài
  rationale: “Anh em” là cách dịch thông dụng và trang trọng của ἀδελφοί, đồng thời không tự quyết định chính xác quan hệ huyết thống; “Ngài” quy chiếu về Đức Giê-su.
theological_decisions:
- issue: Quan hệ của οἱ ἀδελφοί với Đức Giê-su
  choice: Dịch là “các anh em của Ngài” và không xác định thêm loại quan hệ gia đình.
  alternative: “Các anh em họ hàng của Ngài” hoặc “những người bà con của Ngài.”
  rationale: ἀδελφοί thường có nghĩa là anh em trai, nhưng trong cách dùng rộng hơn có thể chỉ người thân hoặc bà con. Bản dịch giữ cách gọi của nguyên văn và để chú thích bảo tồn vấn đề chưa được câu này xác định.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu giữ nhịp liệt kê của nguyên văn; “đồng lòng chuyên tâm” truyền đạt cả sự hiệp nhất lẫn tính kiên trì. Các dấu chú thích [a], [b], [c] đều được đặt ngay sau cụm từ liên quan.
