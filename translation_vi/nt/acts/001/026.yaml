  source_fidelity: 'Bản nháp phản ánh đúng diễn tiến chính: việc dùng thăm, kết quả thuộc về Ma-thia, và việc ông được kể cùng nhóm mười một sứ đồ. Tuy nhiên, «thăm trúng Ma-thia» lược mất hình ảnh và chủ ngữ số ít rõ ràng của ὁ κλῆρος («lá thăm»), đồng thời có sắc thái khẩu ngữ hơn văn mạch tường thuật.'
  naturalness: «Bắt thăm» là cách nói hiện đại, tự nhiên. Câu sẽ rõ ràng và trang trọng hơn với «lá thăm rơi vào Ma-thia» và «được kể cùng mười một sứ đồ».
  terminology: «Sứ đồ» và «Ma-thia» phù hợp với cách dùng Kinh Thánh tiếng Việt. «Được kể cùng» chuyển tải sát συγκατεψηφίσθη μετὰ mà không hàm ý thêm về cơ chế bổ nhiệm.
  issues:
  - severity: low
    issue: «thăm trúng Ma-thia» thiếu danh từ «lá» và hơi khẩu ngữ.
    rationale: Nguyên văn chuyển từ số nhiều κλήρους sang số ít ὁ κλῆρος. «Lá thăm rơi vào Ma-thia» diễn đạt rõ kết quả của lá thăm và giữ được hình ảnh của tiếng Hy Lạp.
  - severity: low
    issue: «được kể vào số mười một sứ đồ» có thể được hiểu là nhóm chỉ có mười một người.
    rationale: Dù có thể chấp nhận, «được kể cùng mười một sứ đồ» bám sát μετά («cùng với») hơn và diễn đạt tự nhiên việc Ma-thia được tính vào nhóm đang được gọi là mười một.
