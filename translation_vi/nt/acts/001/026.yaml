  to: Họ bắt thăm cho hai người ấy[a], và lá thăm rơi vào Ma-thia; ông được kể cùng mười một sứ đồ.[b]
  rationale: Bản sửa giữ «bắt thăm» để diễn tả thành ngữ ἔδωκαν κλήρους αὐτοῖς trong ngữ cảnh lựa chọn, nhưng phục hồi cách nêu rõ «lá thăm» ở mệnh đề sau, tương ứng với ὁ κλῆρος. «Được kể cùng» phản ánh sát ý được tính chung với nhóm mà không áp đặt một cách hiểu thần học hay thể chế vượt quá nguyên văn.
