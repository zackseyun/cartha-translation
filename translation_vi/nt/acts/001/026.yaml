  text: καὶ ἔδωκαν κλήρους ⸀αὐτοῖς, καὶ ἔπεσεν ὁ κλῆρος ἐπὶ Μαθθίαν, καὶ συγκατεψηφίσθη μετὰ τῶν ἕνδεκα ἀποστόλων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/026.yaml
  text: And they cast lots for them[a], and the lot fell to Matthias[b], and he was counted with the eleven apostles.
translation:
  language: vi
  text: Họ bắt thăm cho hai người ấy[a], và lá thăm rơi vào Ma-thia; ông được kể cùng mười một sứ đồ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Theo nghĩa đen: “họ trao các lá thăm cho họ.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “ông được tính chung với mười một sứ đồ” hoặc “ông được thêm vào mười một sứ đồ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδωκαν κλήρους αὐτοῖς
  choice: họ bắt thăm cho hai người
  rationale: Cụm từ theo nghĩa đen là “họ trao các lá thăm cho họ”, nhưng trong ngữ cảnh chỉ việc dùng thăm để chọn giữa hai ứng viên. “Bắt thăm” là cách diễn đạt tự nhiên trong tiếng Việt; “cho hai người” làm rõ đại từ số nhiều dựa trên ngữ cảnh gần.
- source_word: κλήρους / ὁ κλῆρος
  choice: thăm / thăm
  rationale: Trong trình thuật này, κλῆρος chỉ vật hoặc phương thức dùng để lựa chọn, không phải phần chia hay cơ nghiệp.
- source_word: ἔπεσεν ὁ κλῆρος ἐπὶ Μαθθίαν
  choice: thăm trúng Ma-thia
  rationale: Đây là thành ngữ tiếng Việt tự nhiên diễn tả kết quả bắt thăm, tương ứng với hình ảnh “lá thăm rơi vào Ma-thia” trong tiếng Hy Lạp.
- source_word: Μαθθίαν
  choice: Ma-thia
  rationale: Phiên âm tên riêng theo lối quen thuộc, rõ ràng đối với độc giả tiếng Việt.
- source_word: συγκατεψηφίσθη
  choice: được kể vào số
  rationale: Động từ chỉ việc được tính hoặc được kể chung với một nhóm. Cách dịch này gần nghĩa nguồn và không hàm ý mạnh hơn rằng một nghi thức hay cơ chế bổ nhiệm cụ thể đã diễn ra.
- source_word: μετὰ τῶν ἕνδεκα ἀποστόλων
  choice: mười một sứ đồ
  rationale: Kết hợp với “được kể vào số”, cụm này diễn đạt tự nhiên ý Ma-thia được tính chung với mười một sứ đồ đang có.
theological_decisions:
- issue: Mức độ hàm ý về sự bổ nhiệm trong συγκατεψηφίσθη
  choice: được kể vào số mười một sứ đồ
  alternative: được thêm vào mười một sứ đồ; được ghi tên cùng mười một sứ đồ
  rationale: Bản dịch chỉ thuật lại việc Ma-thia được công nhận là thuộc nhóm ấy sau kết quả bắt thăm, không thêm một khẳng định giáo hội học hay bí tích nào vượt quá câu Hy Lạp.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “bắt thăm” theo cách nói phổ thông; giữ lối bị động “được kể” để phản ánh hình thức của động từ Hy Lạp. Các dấu chú thích [a], [b] đều xuất hiện trong chính văn.
