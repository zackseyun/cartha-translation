source:
  edition: SBLGNT
  text: Τότε ὑπέστρεψαν εἰς Ἰερουσαλὴμ ἀπὸ ὄρους τοῦ καλουμένου Ἐλαιῶνος, ὅ ἐστιν ἐγγὺς Ἰερουσαλὴμ σαββάτου ἔχον ὁδόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/012.yaml
  text: Then they returned to Jerusalem from the mount called Olivet[a], which is near Jerusalem[b], a Sabbath day’s journey away.
translation:
  language: vi
  text: Bấy giờ, họ từ Núi có tên là Ô-liu trở về Giê-ru-sa-lem. Núi ấy ở gần Giê-ru-sa-lem, cách một quãng đường ngày Sa-bát.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Quãng đường ngày Sa-bát” là cự ly theo tập tục mà người Do Thái được phép đi trong ngày Sa-bát.
    reason: cultural_note
lexical_decisions:
- source_word: Τότε
  choice: Bấy giờ
  rationale: Diễn đạt tự nhiên từ nối thời gian mở đầu sự việc kế tiếp trong trình thuật.
- source_word: ὑπέστρεψαν εἰς Ἰερουσαλὴμ
  choice: họ ... trở về Giê-ru-sa-lem
  rationale: Giữ rõ ý trở lại một nơi đã rời đi; trật tự tiếng Việt được điều chỉnh cho tự nhiên.
- source_word: ἀπὸ ὄρους τοῦ καλουμένου Ἐλαιῶνος
  choice: từ ngọn núi gọi là núi Ô-liu
  rationale: ὄρος là núi/ngọn núi, còn Ἐλαιῶνος gắn với ô-liu và tại đây là tên địa điểm; cách dịch vừa minh bạch vừa giữ dáng thức tên riêng quen thuộc.
- source_word: ὅ ἐστιν ἐγγὺς Ἰερουσαλὴμ
  choice: Núi ấy ở gần Giê-ru-sa-lem
  rationale: Chuyển đại từ quan hệ thành câu mới để tiếng Việt sáng rõ mà không thay đổi quan hệ quy chiếu.
- source_word: σαββάτου ἔχον ὁδόν
  choice: cách một quãng đường được phép đi trong ngày Sa-bát
  rationale: Diễn đạt thành ngữ khoảng cách theo tập tục Do Thái bằng tiếng Việt dễ hiểu, đồng thời giữ nguyên khung quy chiếu ngày Sa-bát.
theological_decisions:
- issue: Thành ngữ Do Thái σαββάτου ἔχον ὁδόν
  choice: một quãng đường được phép đi trong ngày Sa-bát
  alternative: một quãng đường ngày Sa-bát
  rationale: Đây chủ yếu là thành ngữ văn hóa chỉ một cự ly theo thông lệ ngày Sa-bát. Bản dịch làm rõ hàm ý về cự ly được phép đi nhưng không ấn định con số mà nguyên văn không nêu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “núi Ô-liu” thay cho một dạng phiên âm riêng ít minh bạch; giữ “Sa-bát” là thuật ngữ quen thuộc. Tách mệnh đề quan hệ thành câu thứ hai để tránh câu tiếng Việt nặng nề.
