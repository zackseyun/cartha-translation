review_pass:
  verdict: revise
  source_fidelity: Bản dịch truyền đạt đúng trình tự, sự trở về Giê-ru-sa-lem, địa điểm Núi Ô-liu và sự gần gũi với Giê-ru-sa-lem. Tuy nhiên, cụm “được phép đi” đưa lời giải thích về quy định/tập tục vào thân văn; σαββάτου ἔχον ὁδόν trước hết nêu thành ngữ chỉ cự ly “một quãng đường ngày Sa-bát.”
