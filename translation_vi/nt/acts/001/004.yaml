review_pass:
  verdict: revise
  source_fidelity: Bản nháp phản ánh đúng mệnh lệnh không rời Giê-ru-sa-lem và chờ đợi lời hứa. Tuy nhiên, “điều Cha đã hứa” giải thích trước quan hệ sở hữu trong τὴν ἐπαγγελίαν τοῦ πατρός, vốn được giữ sát hơn bằng “lời hứa của Cha”. Ngoài ra, việc chỉ đặt ngoặc kép quanh mệnh đề cuối tạo một mẩu lời nói trực tiếp không tự nhiên, trong khi các đại từ “các con/Ta” không nhất quán với lối thuật lại “họ/Ngài”.
  naturalness: “Khi Ngài đang ở cùng họ” tự nhiên và giữ tính khái quát của συναλιζόμενος. Cần đặt toàn bộ nội dung mệnh lệnh trong lời nói trực tiếp để “các con/Ta” có quy chiếu rõ ràng và câu văn tiếng Việt mạch lạc.
  terminology: Giữ “Giê-ru-sa-lem”, “Cha”, “Ngài”, “Ta”, và “các con” trong ngữ cảnh lời Chúa Giê-su phán. “Lời hứa của Cha” vừa trang trọng, tự nhiên, vừa không thu hẹp nghĩa thành một điều cụ thể mà Cha đã hứa.
  issues:
  - severity: medium
    issue: Ngoặc kép chỉ bao quanh mệnh đề quan hệ cuối câu.
    rationale: Cách này biến “là điều các con đã nghe từ Ta” thành một đoạn trích rời, gây lẫn lộn giữa lối tường thuật và lời nói trực tiếp. Nên đặt toàn bộ nội dung mệnh lệnh trong ngoặc kép, hoặc đổi nhất quán sang đại từ gián tiếp.
  - severity: low
    issue: “điều Cha đã hứa” thu hẹp cách diễn đạt của τὴν ἐπαγγελίαν τοῦ πατρός.
    rationale: Dù phù hợp ngữ cảnh, cách này chọn rõ nghĩa chủ thể của genitive. “Lời hứa của Cha” giữ cấu trúc và độ mở của nguyên ngữ tốt hơn.
