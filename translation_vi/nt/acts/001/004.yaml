revisions:
- from: Khi đang ở cùng họ[a], Ngài truyền cho họ không được rời khỏi Giê-ru-sa-lem, nhưng phải chờ đợi điều Cha đã hứa, “là điều các con đã nghe từ Ta.”
  to: 'Khi Ngài đang ở cùng họ[a], Ngài truyền cho họ: “Đừng rời khỏi Giê-ru-sa-lem, nhưng hãy chờ đợi lời hứa của Cha, là lời hứa các con đã nghe từ Ta.”'
  rationale: Bản sửa giữ cách dịch khái quát của συναλιζόμενος và bảo tồn các khả năng từ vựng trong chú thích. Toàn bộ nội dung sau động từ “truyền” được trình bày như lời phán trực tiếp, nhờ đó phản ánh tự nhiên ngôi thứ hai số nhiều ἠκούσατε và đại từ ngôi thứ nhất μου. “Lời hứa của Cha” thay cho “điều Cha đã hứa” để không diễn giải quá mức quan hệ sở hữu trong nguyên ngữ.
