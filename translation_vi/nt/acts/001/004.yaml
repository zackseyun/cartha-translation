  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ συναλιζόμενος παρήγγειλεν αὐτοῖς ἀπὸ Ἱεροσολύμων μὴ χωρίζεσθαι, ἀλλὰ περιμένειν τὴν ἐπαγγελίαν τοῦ πατρὸς ἣν ἠκούσατέ μου·
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/004.yaml
  text: And while staying with them[a], he ordered them not to depart from Jerusalem, but to wait for the promise of the Father, which you heard from me.
translation:
  language: vi
  text: 'Khi Ngài đang ở cùng họ[a], Ngài truyền cho họ: “Đừng rời khỏi Giê-ru-sa-lem, nhưng hãy chờ đợi lời hứa của Cha, là lời hứa các con đã nghe từ Ta.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “khi đang nhóm họp với họ”; một số người hiểu cụm từ này là “khi đang dùng bữa với họ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: συναλιζόμενος
  choice: khi đang ở cùng họ
  rationale: Phân từ này khó xác định chính xác về mặt từ vựng. Cách dịch khái quát này diễn đạt rõ việc Chúa Giê-su ở cùng các sứ đồ mà không quyết đoán rằng Ngài đang nhóm họp hay dùng bữa với họ; các khả năng ấy được ghi ở chú thích.
- source_word: παρήγγειλεν
  choice: truyền
  rationale: Động từ diễn tả một chỉ thị có thẩm quyền. “Truyền” tự nhiên, trang trọng và giữ được sức mạnh của nguyên ngữ.
- source_word: ἀπὸ Ἱεροσολύμων μὴ χωρίζεσθαι
  choice: không được rời khỏi Giê-ru-sa-lem
  rationale: Cụm này chỉ việc không rời thành; cách diễn đạt tiếng Việt trực tiếp và tự nhiên.
- source_word: περιμένειν
  choice: phải chờ đợi
  rationale: Diễn đạt rõ sự chờ đón điều đã được hứa; “phải” cân xứng với mệnh lệnh đối lập ở vế trước.
- source_word: τὴν ἐπαγγελίαν τοῦ πατρὸς
  choice: điều Cha đã hứa
  rationale: Cách dịch tự nhiên trong tiếng Việt và hiểu τοῦ πατρός theo nghĩa chủ thể, tức điều Cha hứa. Không thêm “ân tứ,” vì danh từ Hy Lạp chỉ nói đến lời hoặc điều được hứa.
- source_word: ἣν ἠκούσατέ μου
  choice: là điều các con đã nghe từ Ta
  rationale: Giữ quan hệ với điều đã hứa và dịch đại từ sở thuộc sau ἀκούω bằng “từ Ta,” không nói rõ hơn nội dung chưa được nêu ngay trong câu.
theological_decisions:
- issue: Ý nghĩa của συναλιζόμενος đối với hoạt động của Chúa Giê-su sau khi sống lại
  choice: Dịch khái quát là “khi đang ở cùng họ.”
  alternative: “khi đang nhóm họp với họ” hoặc “khi đang dùng bữa với họ”
  rationale: Nguyên ngữ có khó khăn từ vựng và từng được hiểu theo nhiều cách. Bản chính không quyết đoán chi tiết đang tranh luận, còn chú thích bảo tồn các cách hiểu cụ thể hơn.
- issue: Quan hệ sở hữu trong τὴν ἐπαγγελίαν τοῦ πατρὸς
  choice: “điều Cha đã hứa”
  alternative: “lời hứa của Cha”
  rationale: Ngữ cảnh cho thấy đây là điều Cha đã hứa, nhưng không thêm cách giải thích rằng đó cụ thể là “ân tứ,” nhờ vậy không vượt quá câu văn.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “Ngài/Ta/các con” để lời tường thuật và lời trực tiếp có sắc thái tôn kính, tự nhiên. Dấu ngoặc kép làm rõ phần lời Chúa Giê-su nhắc lại mà không thay đổi nội dung cú pháp.
