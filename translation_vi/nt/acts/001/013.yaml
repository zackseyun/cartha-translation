review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch truyền đạt đúng trình tự: họ vào, rồi đi lên căn phòng ở tầng trên, là nơi họ đang lưu lại. Danh sách các tên và các định danh chính nhìn chung sát bản Hy Lạp. Cách hiểu “con Gia-cơ” cho Ἰούδας Ἰακώβου được giữ kèm chú thích nêu rõ quan hệ này không được Hy Lạp ngữ xác định.'
  naturalness: Câu hiện có hai câu tách rời (“Những người ấy gồm có”), trong khi danh sách trong nguyên văn là phần đồng vị giải thích trực tiếp cho “họ”. Gộp danh sách sau dấu hai chấm làm câu tiếng Việt mạch lạc hơn và phản ánh cấu trúc nguồn tốt hơn. “Khi họ vào trong” cũng rõ chủ ngữ hơn “Khi vào trong”.
  terminology: Các tên riêng và “Si-môn người Nhiệt Thành” phù hợp với lối phiên âm/thuật ngữ Kinh Thánh tiếng Việt đang dùng trong bản thảo. Chú thích nên tránh lối viết tắt “anh/em” trong văn xuôi; “anh hoặc em” diễn đạt rõ sự bất định về thứ bậc giữa anh em.
  issues:
  - severity: low
    issue: Danh sách các sứ đồ bị tách thành câu độc lập bằng “Những người ấy gồm có”.
    rationale: Nguyên văn nối danh sách trực tiếp với nhóm “họ” đang ở trong căn phòng. Đặt dấu hai chấm ngay sau mệnh đề quan hệ giữ liên kết này và tự nhiên hơn.
  - severity: low
    issue: Chú thích dùng “anh/em”.
    rationale: Dấu gạch chéo là lối rút gọn, không phải văn phong chú thích trang trọng, hiện đại. “Anh hoặc em” vẫn giữ nguyên điều bản Hy Lạp không xác định.
