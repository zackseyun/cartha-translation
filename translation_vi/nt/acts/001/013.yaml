id: ACT.1.13
reference: Acts 1:13
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ὅτε εἰσῆλθον, ⸂εἰς τὸ ὑπερῷον ἀνέβησαν⸃ οὗ ἦσαν καταμένοντες, ὅ τε Πέτρος καὶ ⸂Ἰωάννης καὶ Ἰάκωβος⸃ καὶ Ἀνδρέας, Φίλιππος καὶ Θωμᾶς, Βαρθολομαῖος καὶ Μαθθαῖος, Ἰάκωβος Ἁλφαίου καὶ Σίμων ὁ ζηλωτὴς καὶ Ἰούδας Ἰακώβου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/013.yaml
  text: 'And when they had entered[a], they went up to the upstairs room where they were staying: Peter, John, James, and Andrew; Philip and Thomas; Bartholomew and Matthew; James the son of Alphaeus, and Simon the Zealot, and Judas the son of James.'
translation:
  language: vi
  text: 'Khi họ vào trong, họ đi lên căn phòng trên lầu, nơi họ đang ở: Phi-e-rơ, Giăng, Gia-cơ và Anh-rê; Phi-líp và Thô-ma; Ba-thê-lê-my và Ma-thi-ơ; Gia-cơ con An-phê; Si-môn người Nhiệt Thành; và Giu-đa con Gia-cơ[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “Giu-đa, anh hoặc em của Gia-cơ.” Tiếng Hy Lạp chỉ ghi “Giu-đa của Gia-cơ”, nên không nói rõ quan hệ chính xác.
    reason: Giữ lại sự mơ hồ thật sự của sở hữu cách Hy Lạp trong Ἰούδας Ἰακώβου.
lexical_decisions:
- source_word: εἰσῆλθον
  choice: vào trong
  rationale: Động từ aorist trong mệnh đề thời gian chỉ hành động xảy ra trước việc đi lên phòng. Tiếng Việt tự nhiên dùng “khi vào trong” mà không cần đánh dấu thì quá khứ hoàn thành; đồng thời không thêm địa điểm vốn không được nêu ngay trong câu.
- source_word: εἰς τὸ ὑπερῷον ἀνέβησαν
  choice: đi lên căn phòng trên lầu
  rationale: Cách dịch này giữ cả chuyển động đi lên của ἀνέβησαν lẫn ý nghĩa không gian của ὑπερῷον, bằng lối nói rõ ràng và tự nhiên trong tiếng Việt hiện đại.
- source_word: ὑπερῷον
  choice: căn phòng trên lầu
  rationale: Diễn đạt nghĩa kiến trúc thông thường của một căn phòng ở tầng trên, tránh gán cho cụm từ một ý nghĩa hội thánh hoặc nghi lễ không có trong bản văn.
- source_word: οὗ ἦσαν καταμένοντες
  choice: nơi họ đang ở
  rationale: “Đang ở” chuyển tải tính tiếp diễn của ἦσαν καταμένοντες và tự nhiên hơn những cách diễn đạt sát chữ như “đang lưu lại” trong ngữ cảnh này.
- source_word: ὅ τε Πέτρος καὶ Ἰωάννης καὶ Ἰάκωβος καὶ Ἀνδρέας, Φίλιππος καὶ Θωμᾶς, Βαρθολομαῖος καὶ Μαθθαῖος
  choice: 'Những người ấy gồm có: Phi-e-rơ, Giăng, Gia-cơ và Anh-rê; Phi-líp và Thô-ma; Ba-thê-lê-my và Ma-thi-ơ'
  rationale: Cụm mở đầu giới thiệu danh sách những người đang ở đó. Dấu hai chấm và dấu chấm phẩy giúp danh sách rõ ràng, còn liên từ được dùng theo nhịp tự nhiên của tiếng Việt thay vì sao chép mọi καί.
- source_word: Ἰάκωβος Ἁλφαίου
  choice: Gia-cơ con An-phê
  rationale: Sở hữu cách ở đây tự nhiên nhất là quan hệ phụ tử, dùng để phân biệt người mang tên Gia-cơ; tiếng Việt không cần thêm từ “của”.
- source_word: Σίμων ὁ ζηλωτὴς
  choice: Si-môn người Nhiệt Thành
  rationale: ζηλωτής là biệt hiệu nhận diện Si-môn. “Người Nhiệt Thành” vừa dễ hiểu trong tiếng Việt vừa không khẳng định quá mức rằng đây nhất thiết là tên chính thức của một đảng phái.
- source_word: Ἰούδας Ἰακώβου
  choice: Giu-đa con Gia-cơ
  rationale: Trong danh sách các sứ đồ, sở hữu cách này nhiều khả năng là cách gọi theo tên cha. Tuy nhiên, tiếng Hy Lạp chỉ nói “Giu-đa của Gia-cơ”, nên khả năng chỉ quan hệ anh em được giữ trong chú thích.
theological_decisions:
- issue: Quan hệ được hàm ý trong Ἰούδας Ἰακώβου
  choice: Giu-đa con Gia-cơ
  alternative: Giu-đa anh/em của Gia-cơ
  rationale: Ngữ cảnh danh sách những người nam được nhận diện theo tên cha khiến nghĩa “con Gia-cơ” có khả năng cao hơn. Dù vậy, bản Hy Lạp không nêu rõ “con” hay “anh/em”, nên không loại bỏ cách hiểu kia mà ghi lại trong chú thích.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Tên riêng được phiên âm theo lối quen thuộc trong Kinh Thánh tiếng Việt. Cấu trúc danh sách được làm sáng rõ bằng dấu câu và liên từ tự nhiên, không áp đặt lối đa liên từ của tiếng Hy Lạp.
