revisions:
- from: 'Khi vào trong, họ đi lên căn phòng trên lầu, nơi họ đang ở. Những người ấy gồm có: Phi-e-rơ, Giăng, Gia-cơ và Anh-rê; Phi-líp và Thô-ma; Ba-thê-lê-my và Ma-thi-ơ; Gia-cơ con An-phê; Si-môn người Nhiệt Thành; và Giu-đa con Gia-cơ[a].'
