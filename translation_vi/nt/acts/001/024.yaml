source:
  edition: SBLGNT
  text: καὶ προσευξάμενοι εἶπαν Σὺ κύριε καρδιογνῶστα πάντων, ἀνάδειξον ὃν ἐξελέξω, ἐκ τούτων τῶν δύο ἕνα,
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/024.yaml
  text: And after praying[a], they said, “You, Lord, knower of the hearts of all[b], show which one of these two you have chosen,”
translation:
  language: vi
  text: 'Rồi, sau khi cầu nguyện, họ nói: “Lạy Chúa, chính Ngài là Đấng thấu biết lòng mọi người; xin cho biết[a] Ngài đã chọn người nào trong hai người này.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “xin chỉ ra”, “xin chỉ định” hoặc “xin công bố”; động từ Hy Lạp có thể chỉ việc làm cho biết hoặc công khai chỉ định.
    reason: lexical_alternative
  - marker: b
    text: Danh xưng “Chúa” ở đây có thể được hiểu là nói với Đức Chúa Trời nói chung hoặc riêng với Chúa Giê-su; câu Hy Lạp không xác định rõ đối tượng.
    reason: alternative_reading
lexical_decisions:
- source_word: προσευξάμενοι
  choice: Sau khi cầu nguyện
  rationale: Phân từ bất định thì đứng trước động từ chính, tự nhiên diễn tả hành động xảy ra trước; cách dịch này vừa rõ trình tự vừa tự nhiên trong tiếng Việt hiện đại.
- source_word: Σὺ κύριε
  choice: Lạy Chúa, chính Ngài
  rationale: “Lạy Chúa” là lối xưng hô trang trọng, tự nhiên trong lời cầu nguyện; “chính Ngài” giữ sắc thái nhấn mạnh của đại từ Σὺ.
- source_word: καρδιογνῶστα πάντων
  choice: Đấng biết lòng mọi người
  rationale: Diễn đạt tự nhiên danh từ ghép chỉ Đấng biết lòng, đồng thời giữ πάντων là “mọi người” mà không làm câu quá nặng.
- source_word: ἀνάδειξον
  choice: xin chỉ ra
  rationale: Trong ngữ cảnh này, động từ xin Chúa làm cho biết người đã được chọn; “chỉ ra” không áp đặt nghĩa bổ nhiệm, dù động từ cũng có thể mang sắc thái chỉ định hay công bố.
- source_word: ὃν ἐξελέξω
  choice: người nào ... là người Ngài đã chọn
  rationale: Giữ ý sự lựa chọn của Chúa đã có trước và hiện đang cần được tỏ rõ; cấu trúc tiếng Việt làm rõ quan hệ với hai ứng viên.
- source_word: ἐκ τούτων τῶν δύο ἕνα
  choice: người nào trong hai người này
  rationale: Diễn đạt tự nhiên việc chọn một người từ hai người, không thêm thông tin ngoài nguyên văn.
theological_decisions:
- issue: Đối tượng được gọi là “Chúa” trong lời cầu nguyện
  choice: Giữ cách xưng hô “Lạy Chúa” mà không xác định đó là Đức Chúa Trời nói chung hay riêng Chúa Giê-su.
  alternative: Hiểu lời này hướng đến Đức Chúa Trời nói chung, hoặc cụ thể hướng đến Chúa Giê-su phục sinh.
  rationale: Bản Hy Lạp chỉ ghi κύριε và không nêu rõ đối tượng; bản dịch cần bảo tồn sự mở này thay vì giải quyết thay cho người đọc.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “Ngài” để duy trì lối xưng hô kính trọng trong lời cầu nguyện; giữ nguyên sự không xác định về đối tượng của danh xưng “Chúa”.
