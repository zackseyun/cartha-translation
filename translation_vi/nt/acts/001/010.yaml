id: ACT.1.10
reference: Acts 1:10
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ὡς ἀτενίζοντες ἦσαν εἰς τὸν οὐρανὸν πορευομένου αὐτοῦ, καὶ ἰδοὺ ἄνδρες δύο παρειστήκεισαν αὐτοῖς ἐν ⸂ἐσθήσεσι λευκαῖς⸃,
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/010.yaml
  text: And as they were gazing intently into heaven while he was going[a], behold, two men stood by them in white clothing[b],
translation:
  language: vi
  text: Trong lúc Ngài đang đi, họ chăm chú nhìn lên trời; thì kìa, hai người đàn ông mặc y phục trắng đứng bên cạnh họ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “áo quần trắng” hoặc “áo choàng trắng.” Từ Hy Lạp chỉ y phục nói chung.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀτενίζοντες
  choice: chăm chú nhìn
  rationale: Diễn đạt cái nhìn tập trung, kéo dài, chứ không chỉ là một thoáng nhìn; tự nhiên trong tiếng Việt hiện đại.
- source_word: οὐρανόν
  choice: trời
  rationale: “Trời” trong tiếng Việt giữ được khả năng chỉ cả bầu trời lẫn thiên giới, nhờ đó bảo toàn sự đa nghĩa của οὐρανός trong bối cảnh thăng thiên.
- source_word: πορευομένου αὐτοῦ
  choice: trong lúc Ngài đi
  rationale: Giữ quan hệ đồng thời của kết cấu sở hữu cách tuyệt đối và không thêm ý “biến mất” hay “thăng lên” vốn không nằm trong chính cụm từ này.
- source_word: ἰδοὺ
  choice: thì kìa
  rationale: Giữ chức năng thu hút sự chú ý và sắc thái nổi bật của lời kể, đồng thời vẫn tự nhiên, trang trọng trong tiếng Việt.
- source_word: ἄνδρες δύο
  choice: hai người
  rationale: Trong tiếng Việt, “hai người” là cách tự nhiên để nói về hai người nam khi ngữ cảnh đã mô tả họ; không chuyển thành “hai thiên sứ,” vì câu Hy Lạp chỉ gọi họ là ἄνδρες.
- source_word: παρειστήκεισαν
  choice: đứng bên cạnh họ
  rationale: Phản ánh sự hiện diện trong tư thế đứng ở bên các môn đồ mà không diễn giải quá mức thành “hiện ra.”
- source_word: ἐσθήσεσι λευκαῖς
  choice: mặc y phục trắng
  rationale: ἐσθής chỉ y phục nói chung; “y phục” trang trọng nhưng vẫn dễ hiểu, không thu hẹp nghĩa thành áo choàng.
theological_decisions:
- issue: Nghĩa của οὐρανός trong bối cảnh Chúa thăng thiên
  choice: trời
  alternative: bầu trời; thiên đàng
  rationale: “Trời” vừa tự nhiên vừa giữ được sự căng nghĩa giữa không gian nhìn thấy phía trên và thiên giới, thay vì buộc người đọc chọn một nghĩa mà từ Hy Lạp không tự nó phân định hoàn toàn.
- issue: Danh tính của hai người
  choice: hai người
  alternative: hai thiên sứ; hai người đàn ông
  rationale: Không đưa danh tính thiên sứ vào câu khi nguyên văn chỉ nói ἄνδρες δύο. “Hai người” là lối diễn đạt tiếng Việt tự nhiên và không phủ nhận họ là nam giới trong ngữ cảnh.
- issue: Cách gọi Chúa Giê-su bằng đại từ
  choice: Ngài
  alternative: ông ấy; người
  rationale: “Ngài” phù hợp văn phong Kinh Thánh trang trọng và đối tượng quy chiếu là Chúa Giê-su, nhưng không thêm danh xưng thần học vào nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “chăm chú nhìn” để giữ sắc thái kéo dài; dùng “trời” nhằm bảo toàn sự đa nghĩa của nguyên ngữ. Cấu trúc câu được điều chỉnh theo trật tự tiếng Việt, với “thì kìa” làm điểm chuyển thu hút sự chú ý.
