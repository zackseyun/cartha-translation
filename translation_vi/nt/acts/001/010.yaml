  source_fidelity: Bản dịch truyền đạt đúng hành động nhìn chăm chú, hướng nhìn lên trời, chuyển động đồng thời của Ngài, dấu hiệu thu hút chú ý, việc hai người đứng cạnh họ, và y phục trắng. Tuy nhiên, ἄνδρες hai người nam được làm mờ thành “hai người”; tiếng Việt có thể nói rõ “hai người đàn ông” mà vẫn tự nhiên và không suy diễn họ là thiên sứ.
