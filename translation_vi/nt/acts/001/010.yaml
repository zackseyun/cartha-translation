revisions:
- from: Khi họ còn đang chăm chú nhìn lên trời trong lúc Ngài đi, thì kìa, có hai người mặc y phục trắng[a] đứng bên cạnh họ.
  to: Trong lúc Ngài đang đi, họ chăm chú nhìn lên trời; thì kìa, hai người đàn ông mặc y phục trắng đứng bên cạnh họ.[a]
  rationale: Bản sửa nêu rõ “hai người đàn ông” theo ἄνδρες, không gán danh tính thiên sứ. Cú pháp được làm gọn để diễn đạt tự nhiên quan hệ đồng thời giữa việc Ngài đi và việc họ nhìn chăm chú. Các lựa chọn “trời,” “thì kìa,” “y phục trắng,” và chú thích về ἐσθήσεις được giữ nguyên vì phù hợp nguyên ngữ và tiếng Việt hiện đại.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T08:27:15Z'
