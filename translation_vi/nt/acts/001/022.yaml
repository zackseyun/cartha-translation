    issue: Thiếu từ ‘một’ trước ‘nhân chứng’.
    rationale: μὰρτυρα là danh từ số ít làm bổ ngữ cho γενέσθαι. Dù ‘một người ... trở thành nhân chứng’ có thể hiểu đúng theo ngữ cảnh, ‘trở thành một nhân chứng’ rõ và sát cấu trúc nguồn hơn.
  - severity: low
    issue: Vị trí của ‘cùng với chúng ta’ hơi dễ gây lưỡng nghĩa.
    rationale: Đặt cụm này sau ‘một nhân chứng’ làm rõ người được chọn gia nhập nhóm chứng nhân hiện hữu, phù hợp σὺν ἡμῖν.
  - severity: medium
    issue: Cước chú a diễn giải quá mức và không phải lựa chọn tương đương trực tiếp.
    rationale: ‘Từ khi Giăng làm phép báp-têm’ diễn đạt một thời điểm/hoạt động của Giăng, trong khi nguyên văn nói ‘từ phép báp-têm của Giăng’. Bỏ cước chú tránh áp đặt một cách phân tích cụ thể của sở hữu cách.
