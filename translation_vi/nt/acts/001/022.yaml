  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀρξάμενος ἀπὸ τοῦ βαπτίσματος Ἰωάννου ἕως τῆς ἡμέρας ἧς ἀνελήμφθη ἀφ’ ἡμῶν, μάρτυρα τῆς ἀναστάσεως αὐτοῦ ⸂σὺν ἡμῖν γενέσθαι⸃ ἕνα τούτων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/022.yaml
  text: beginning from the baptism of John until the day when he was taken up from us[b][a], one of these must become a witness with us of his resurrection.
translation:
  language: vi
  text: bắt đầu từ phép báp-têm của Giăng cho đến ngày Ngài được cất lên khỏi chúng ta, một người trong số những người này phải trở thành một nhân chứng cùng với chúng ta về sự sống lại của Ngài.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀρξάμενος ἀπὸ τοῦ βαπτίσματος Ἰωάννου
  choice: bắt đầu từ phép báp-têm của Giăng
  rationale: Giữ lực của phân từ và điểm khởi đầu của khoảng thời gian. Cách diễn đạt này cũng bảo lưu cấu trúc sở hữu trong tiếng Hy Lạp mà không giải thích quá mức Giăng là người thực hiện hay phép báp-têm gắn với chức vụ của ông.
- source_word: ἕως τῆς ἡμέρας ἧς
  choice: cho đến ngày
  rationale: Diễn đạt tự nhiên giới hạn cuối của khoảng thời gian; mệnh đề theo sau làm rõ đó là ngày nào.
- source_word: ἀνελήμφθη ἀφ’ ἡμῶν
  choice: Ngài được cất lên khỏi chúng ta
  rationale: Giữ thể bị động và sắc thái hướng lên của động từ, đồng thời không diễn giải thêm thành 'lên trời' vì cụm ấy không có trong câu này.
- source_word: μάρτυρα τῆς ἀναστάσεως αὐτοῦ
  choice: nhân chứng về sự sống lại của Ngài
  rationale: '''Nhân chứng về'' là cách nói tự nhiên trong tiếng Việt và phản ánh quan hệ sở hữu trong tiếng Hy Lạp mà không biến cụm này thành một mệnh đề hành động.'
- source_word: σὺν ἡμῖν γενέσθαι
  choice: phải cùng với chúng ta trở thành
  rationale: Diễn đạt việc người được chọn gia nhập nhóm chứng nhân hiện có. Từ 'phải' chuyển tải lực chi phối của δεῖ ở câu 21, vốn tiếp tục điều khiển cú pháp câu này.
- source_word: ἕνα τούτων
  choice: một người trong số những người này
  rationale: Giữ đại từ chỉ định của nguyên văn và không thêm 'những người nam', dù đối tượng đã rõ từ câu trước.
theological_decisions:
- issue: Bổ sung ý bắt buộc từ câu trước
  choice: Dùng 'phải'
  alternative: Chỉ dịch 'trở thành'
  rationale: Câu 22 phụ thuộc về cú pháp vào δεῖ ('cần phải') trong câu 21. Thêm 'phải' hoàn chỉnh câu tiếng Việt mà không đưa vào ý nghĩa mới.
- issue: Cách diễn đạt sự thăng thiên
  choice: Ngài được cất lên
  alternative: Ngài lên trời
  rationale: Lựa chọn này giữ thể bị động và hướng chuyển động của ἀνελήμφθη, nhưng không thêm địa điểm 'trời' vốn không được nêu trực tiếp trong câu.
- issue: Quan hệ giữa người được chọn và các sứ đồ
  choice: cùng với chúng ta trở thành nhân chứng
  alternative: trở thành một nhân chứng của chúng ta
  rationale: σὺν ἡμῖν nói người ấy cùng chia sẻ vai trò chứng nhân với nhóm hiện có, không phải làm chứng thuộc về hay dưới quyền họ.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Dùng 'Ngài' để chỉ Chúa Giê-su theo ngữ cảnh liền trước; dùng 'phép báp-têm' vì đây là thuật ngữ quen thuộc và tránh đồng nhất thuật ngữ nguồn với một phương thức nghi lễ cụ thể.
