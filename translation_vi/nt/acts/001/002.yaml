  yaml_path: translation/nt/acts/001/002.yaml
  text: until the day when[a], after giving commands through the Holy Spirit to the apostles whom he had chosen, he was taken up.
translation:
  language: vi
  text: cho đến ngày Ngài được cất lên, sau khi Ngài đã nhờ Đức Thánh Linh truyền lệnh cho các sứ đồ mà Ngài đã chọn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “sau khi Ngài đã bởi Đức Thánh Linh truyền lệnh cho các sứ đồ mà Ngài đã chọn.” Cụm từ Hy Lạp có thể diễn tả phương tiện hoặc tác nhân; “nhờ” và “bởi” đều có thể dùng.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄχρι ἧς ἡμέρας
  choice: cho đến ngày
  rationale: Diễn đạt tự nhiên mốc kết thúc về thời gian trong tiếng Việt và gắn trực tiếp với sự kiện Ngài được cất lên.
- source_word: ἐντειλάμενος
  choice: sau khi ... truyền lệnh
  rationale: Phân từ bất định quá khứ chỉ hành động xảy ra trước động từ chính; “truyền lệnh” giữ được sắc thái mạnh hơn “chỉ dạy”.
- source_word: τοῖς ἀποστόλοις
  choice: cho các sứ đồ
  rationale: “Sứ đồ” là thuật ngữ tiếng Việt quen thuộc và chính xác cho nhóm người được Chúa Giê-su chọn trong Lu-ca–Công Vụ.
- source_word: διὰ πνεύματος ἁγίου
  choice: qua Đức Thánh Linh
  rationale: διά với sở hữu cách có thể biểu thị phương tiện hoặc trung gian; “qua” giữ được độ mở ấy mà không thêm ý ngoài bản văn.
- source_word: οὓς ἐξελέξατο
  choice: mà Ngài đã chọn
  rationale: Diễn tả việc chọn các sứ đồ có trước sự kiện được cất lên; không cố thể hiện sắc thái trung động vốn không tự nhiên trong tiếng Việt.
- source_word: ἀνελήμφθη
  choice: Ngài được cất lên
  rationale: Phản ánh thể bị động và nghĩa trực tiếp của động từ, không thêm “lên trời,” điều không được nói rõ trong câu này.
theological_decisions:
- issue: Mối liên hệ giữa mệnh lệnh của Chúa Giê-su và Đức Thánh Linh
  choice: Chúa Giê-su truyền lệnh cho các sứ đồ qua Đức Thánh Linh trước khi Ngài được cất lên.
  alternative: Chúa Giê-su truyền lệnh bởi Đức Thánh Linh.
  rationale: Cú pháp gắn διὰ πνεύματος ἁγίου tự nhiên nhất với ἐντειλάμενος. Bản dịch “qua” bảo tồn khả năng chỉ phương tiện hoặc trung gian mà không giải quyết quá mức sắc thái thần học.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Dùng đại từ “Ngài” vì chủ thể là Chúa Giê-su, nhưng không thêm danh xưng hay địa điểm không có trong câu Hy Lạp.
