    issue: “những kẻ bắt” có sắc thái miệt thị thêm vào.
    rationale: Tham từ τοῖς συλλαβοῦσιν chỉ những người đã bắt/khống chế Giê-su; tuy văn mạch đánh giá hành động này, bản thân cụm từ không có từ ngữ miệt thị tương ứng với “kẻ”.
  - severity: low
    issue: Chính tả “Jêsus” kém phù hợp với chuẩn Việt ngữ hiện đại.
    rationale: “Giê-su” là dạng hiện đại, thông dụng rộng rãi; thay đổi này không ảnh hưởng danh xưng “Đức Chúa” hay ý nghĩa văn bản.
