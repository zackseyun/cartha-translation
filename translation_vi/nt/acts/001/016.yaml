id: ACT.1.16
reference: Acts 1:16
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἄνδρες ἀδελφοί, ἔδει πληρωθῆναι τὴν ⸀γραφὴν ἣν προεῖπε τὸ πνεῦμα τὸ ἅγιον διὰ στόματος Δαυὶδ περὶ Ἰούδα τοῦ γενομένου ὁδηγοῦ τοῖς συλλαβοῦσιν ⸀Ἰησοῦν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/016.yaml
  text: Men[a], brothers, it was necessary for the Scripture to be fulfilled, which the Holy Spirit spoke beforehand through the mouth of David concerning Judas, who became a guide to those who arrested Jesus[c][b],
translation:
  language: vi
  text: “Thưa anh em, lời Kinh Thánh phải được ứng nghiệm, là lời Đức Thánh Linh đã phán trước[a] qua miệng Đa-vít về Giu-đa, người đã trở thành người dẫn đường cho những người bắt Đức Chúa Giê-su.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đã nói trước” hoặc “đã báo trước.” Cụm “qua miệng Đa-vít” diễn tả rằng Đức Thánh Linh phán qua Đa-vít như phương tiện con người.'
    reason: lexical_alternative_and_cultural_note
lexical_decisions:
- source_word: Ἄνδρες ἀδελφοί
  choice: Thưa anh em
  rationale: Đây là lời xưng hô trực tiếp với nhóm người hiện diện. Tiếng Việt tự nhiên không lặp riêng yếu tố ἄνδρες ('những người nam') như tiếng Hy Lạp; 'thưa anh em' giữ được sắc thái trang trọng và đối tượng nam giới trong văn cảnh.
- source_word: ἔδει
  choice: phải
  rationale: Diễn đạt sự cần thiết được hàm ý bởi ἔδει mà không giải thích thêm cơ chế thần học của sự cần thiết ấy.
- source_word: πληρωθῆναι τὴν γραφὴν
  choice: lời Kinh Thánh ... phải được ứng nghiệm
  rationale: '''Ứng nghiệm'' là cách diễn đạt tự nhiên trong tiếng Việt đối với việc lời Kinh Thánh đạt đến sự thực hiện; thể bị động của nguyên văn được bảo toàn.'
- source_word: προεῖπε
  choice: đã phán trước
  rationale: Giữ ý 'nói trước' của động từ và phù hợp với Đức Thánh Linh là chủ thể phát ngôn, nhưng không thu hẹp nghĩa thành một thuật ngữ kỹ thuật về tiên tri.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: Đức Thánh Linh
  rationale: Cách gọi trang trọng, quen thuộc và tự nhiên trong tiếng Việt hiện đại đối với Holy Spirit.
- source_word: διὰ στόματος Δαυὶδ
  choice: qua miệng Đa-vít
  rationale: 'Giữ hình ảnh cụ thể và quan hệ trung gian trong nguyên văn: Đức Thánh Linh là Đấng phán, còn Đa-vít là tác nhân con người.'
- source_word: τοῦ γενομένου ὁδηγοῦ
  choice: kẻ đã trở thành người dẫn đường
  rationale: Phản ánh sát γενομένου ('đã trở thành') và không thêm tính xác định mà danh từ Hy Lạp không biểu thị.
- source_word: τοῖς συλλαβοῦσιν Ἰησοῦν
  choice: cho những kẻ bắt Đức Chúa Jêsus
  rationale: '''Bắt'' truyền đạt rõ hành động bắt giữ trong văn cảnh; ''những kẻ'' phù hợp sắc thái tiêu cực của nhóm thực hiện hành động.'
theological_decisions:
- issue: Tính tất yếu của sự ứng nghiệm Kinh Thánh
  choice: Dịch ἔδει là 'phải' nhưng không nêu nguyên nhân hay cơ chế của sự tất yếu.
  alternative: Phải xảy ra vì đã được tiền định; hoặc chỉ là điều thích hợp.
  rationale: Nguyên văn khẳng định sự cần thiết nhưng không giải thích đầy đủ mối quan hệ giữa ý định của Đức Chúa Trời, sự báo trước và trách nhiệm của Giu-đa.
- issue: Tác nhân trong sự mặc khải
  choice: Đức Thánh Linh 'phán trước qua miệng Đa-vít'.
  alternative: Đa-vít nói bởi Đức Thánh Linh; hoặc Đức Thánh Linh soi dẫn Đa-vít viết.
  rationale: Cấu trúc Hy Lạp trực tiếp đặt Đức Thánh Linh làm chủ thể phát ngôn và Đa-vít làm phương tiện con người, nên bản dịch giữ nguyên cả hai phương diện.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, thích hợp với một bài phát biểu trước cộng đồng. Dùng dấu gạch ngang để làm rõ mệnh đề bổ nghĩa dài về Giu-đa. Danh xưng và tên riêng theo lối Tin Lành Việt ngữ quen thuộc; không thêm diễn giải giáo phái.
