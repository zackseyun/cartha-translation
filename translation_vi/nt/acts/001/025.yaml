revisions:
- from: để nhận lấy vị trí trong chức vụ phục vụ và sứ đồ này, là điều Giu-đa đã lìa bỏ[a] để đi đến nơi riêng của mình.[b]
  to: để đảm nhận vị trí trong công tác phục vụ này và trong chức sứ đồ, mà Giu-đa đã rời khỏi[a] để đi đến nơi của riêng mình.[b]
  rationale: 'Sửa cụm danh từ trung tâm để diễn đạt rõ hai khía cạnh được nguyên văn liên kết: công tác phục vụ và chức sứ đồ. Giữ “vị trí” cho τόπον thứ nhất và “nơi của riêng mình” cho τόπον thứ hai, theo sự khác biệt tự nhiên giữa nghĩa ẩn dụ và nghĩa không được xác định của tiếng Việt. Chú thích cuối câu tiếp tục bảo toàn sự mơ hồ có chủ ý của τὸν τόπον τὸν ἴδιον.'
  reviewer_model: gpt-5.6-terra
