language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: λαβεῖν τὸν ⸀τόπον τῆς διακονίας ταύτης καὶ ἀποστολῆς, ⸀ἀφ’ ἧς παρέβη Ἰούδας πορευθῆναι εἰς τὸν τόπον τὸν ἴδιον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/025.yaml
  text: to take the place of this ministry and apostleship[b][a], from which Judas turned aside to go to his own place.
translation:
  language: vi
  text: để đảm nhận vị trí trong công tác phục vụ này và trong chức sứ đồ, mà Giu-đa đã rời khỏi[a] để đi đến nơi của riêng mình.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đi chệch khỏi” hoặc “từ bỏ.” Động từ Hy Lạp có thể chỉ việc đi lệch hướng hoặc rời khỏi công tác phục vụ và chức sứ đồ.'
    reason: lexical_alternative
  - marker: b
    text: “Nơi của riêng mình” có thể đơn giản chỉ nơi thuộc về Giu-đa, hoặc hàm ý rõ hơn về nơi phán xét thích hợp với ông.
    reason: alternative_reading
lexical_decisions:
- source_word: λαβεῖν
  choice: nhận lấy
  rationale: Diễn tả việc người được chọn tiếp nhận vai trò đang bỏ trống; đồng thời giữ nghĩa cơ bản của λαμβάνω.
- source_word: τὸν τόπον
  choice: vị trí
  rationale: Ở đây τόπος được dùng theo nghĩa ẩn dụ về vị trí hay vai trò. Tiếng Việt cần dùng “vị trí” để tránh hiểu lầm là một địa điểm vật lý, trong khi danh từ “nơi” ở cuối câu vẫn bảo toàn nét tương phản trong nguyên văn ở mức tự nhiên.
- source_word: τῆς διακονίας ταύτης
  choice: trong chức vụ phục vụ ... này
  rationale: διακονία chỉ sự phục vụ được giao phó. Cụm “chức vụ phục vụ” vừa truyền đạt tính chất chính thức trong ngữ cảnh, vừa giữ ý nghĩa phục vụ của từ Hy Lạp.
- source_word: ἀποστολῆς
  choice: sứ đồ
  rationale: Trong cụm phối hợp với διακονία, từ này nói đến chức phận hay sứ vụ làm sứ đồ. Cách nói “chức vụ phục vụ và sứ đồ” ngắn gọn, dễ hiểu và không diễn giải thành một sứ mạng chung chung.
- source_word: ἀφ’ ἧς
  choice: là điều ... đã lìa bỏ
  rationale: Đại từ quan hệ quy chiếu về chức vụ phục vụ và vai trò sứ đồ vừa nêu. “Là điều” giúp câu tiếng Việt tự nhiên mà vẫn giữ quan hệ ấy.
- source_word: παρέβη
  choice: lìa bỏ
  rationale: Trong ngữ cảnh, động từ diễn tả việc Giu-đa rời khỏi hoặc đi chệch khỏi chức vụ được giao; “lìa bỏ” không áp đặt một thuật ngữ giáo lý mạnh hơn nguyên văn.
- source_word: πορευθῆναι
  choice: để đi
  rationale: Giữ cách diễn đạt đơn giản của động từ πορεύομαι và mối liên hệ cú pháp với hành động lìa bỏ.
- source_word: εἰς τὸν τόπον τὸν ἴδιον
  choice: đến nơi riêng của mình
  rationale: Bảo toàn cách nói ngắn gọn, hàm ý nhưng không xác định rõ của nguyên văn, không tự ý đồng nhất nơi ấy với mồ mả hay nơi phán xét.
theological_decisions:
- issue: Ý nghĩa của “nơi riêng của mình” đối với số phận Giu-đa
  choice: Giữ cách diễn đạt mơ hồ “nơi riêng của mình” trong chính văn.
  alternative: Có thể hiểu là nơi Giu-đa thuộc về, nơi chết/mồ mả, hoặc nơi phán xét thích hợp với ông.
  rationale: Cụm Hy Lạp không nói rõ đích đến. Giữ nguyên sự mơ hồ tránh đưa vào bản dịch một kết luận giáo lý mạnh hơn câu văn.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Giu-đa” theo lối phiên âm Kinh Thánh quen thuộc. Giữ nguyên sự hàm ý của mệnh đề cuối, không giải nghĩa quá mức.
