source:
  edition: SBLGNT
  text: δεῖ οὖν τῶν συνελθόντων ἡμῖν ἀνδρῶν ἐν παντὶ χρόνῳ ⸀ᾧ εἰσῆλθεν καὶ ἐξῆλθεν ἐφ’ ἡμᾶς ὁ κύριος Ἰησοῦς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/021.yaml
  text: Therefore[a], it is necessary that one of the men who accompanied us during all the time in which the Lord Jesus went in and out among us[b],
translation:
  language: vi
  text: Vì vậy, cần phải có một người trong số những người nam đã cùng đi với chúng ta suốt cả thời gian mà Chúa Giê-su ra vào giữa chúng ta[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ra vào giữa chúng ta” là một thành ngữ chỉ đời sống và hoạt động thường xuyên của Chúa Giê-su trong cộng đồng các môn đồ.
    reason: cultural_note
lexical_decisions:
- source_word: δεῖ
  choice: cần phải chọn
  rationale: Động từ vô nhân xưng diễn tả sự cần thiết. Vì câu Hy Lạp tiếp tục sang câu 22, tiếng Việt cần làm rõ bổ ngữ hàm ẩn; “chọn” được suy ra từ việc lập một người làm chứng ở câu kế tiếp.
- source_word: οὖν
  choice: Vì vậy
  rationale: Biểu thị kết luận được rút ra từ lời trình bày ngay trước đó.
- source_word: τῶν συνελθόντων ἡμῖν ἀνδρῶν
  choice: trong số những người nam đã cùng đi với chúng ta
  rationale: Giữ nghĩa giống đực cụ thể của ἀνήρ, đồng thời diễn đạt tự nhiên sự đồng hành lâu dài mà phân từ συνέρχομαι chỉ đến trong ngữ cảnh.
- source_word: ἐν παντὶ χρόνῳ ᾧ
  choice: suốt thời gian
  rationale: Chỉ toàn bộ khoảng thời gian Chúa Giê-su hiện diện và hoạt động với các môn đồ.
- source_word: εἰσῆλθεν καὶ ἐξῆλθεν ἐφ’ ἡμᾶς
  choice: ra vào giữa chúng ta
  rationale: Giữ hình ảnh thành ngữ của nguyên văn, nói về đời sống và hoạt động thường xuyên của Chúa Giê-su giữa cộng đồng môn đồ.
- source_word: ὁ κύριος Ἰησοῦς
  choice: Chúa Giê-su
  rationale: “Chúa” là cách dịch tự nhiên và có trọng lượng thần học của κύριος khi dùng làm tước hiệu cho Giê-su.
theological_decisions:
- issue: Tước hiệu κύριος dành cho Giê-su
  choice: Chúa Giê-su
  alternative: Thầy Giê-su
  rationale: “Chúa” bảo toàn cả sắc thái tôn kính lẫn trọng lượng Cơ Đốc học của tước hiệu trong sách Công Vụ.
- issue: Giới tính của ἀνδρῶν
  choice: những người nam
  alternative: những người
  rationale: Danh từ ἀνήρ chỉ rõ nam giới; bản dịch không trung tính hóa chi tiết này.
- issue: Bổ sung động từ “chọn”
  choice: cần phải chọn một người
  alternative: cần phải có một người
  rationale: Cú pháp Hy Lạp chưa hoàn tất cho đến câu 22. “Chọn” giúp câu tiếng Việt rõ ràng nhưng dựa trên hành động được nêu trong ngữ cảnh kế tiếp, không nhằm giải quyết một điểm thần học tranh luận.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu được giữ mở bằng dấu phẩy vì ý và cấu trúc tiếp tục sang Công Vụ 1:22.
