language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ταῦτα εἰπὼν βλεπόντων αὐτῶν ἐπήρθη καὶ νεφέλη ὑπέλαβεν αὐτὸν ἀπὸ τῶν ὀφθαλμῶν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/009.yaml
  text: And after he said these things[a], as they were watching, he was lifted up[c][b], and a cloud took him out of their sight.
translation:
  language: vi
  text: Sau khi nói những điều ấy, khi họ đang nhìn, Ngài được nâng lên[a], và một đám mây[b][c] đón lấy Ngài, khiến họ không còn thấy Ngài nữa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Ngài được cất lên.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “một đám mây mang Ngài đi” hoặc “một đám mây đưa Ngài ra khỏi tầm mắt họ.”'
    reason: lexical_alternative
  - marker: c
    text: Trong một số cảnh tượng khác của Kinh Thánh, mây gắn với sự hiện diện của Đức Chúa Trời; tuy nhiên, câu này không nói rõ rằng đám mây ở đây mang ý nghĩa ấy.
    reason: cross_reference
lexical_decisions:
- source_word: καὶ
  choice: Sau khi... và
  rationale: Liên từ nối sự kiện này với lời nói ngay trước đó. Trong tiếng Việt, kết cấu “Sau khi... và” diễn đạt tự nhiên trình tự của câu mà không thêm ý nghĩa ngoài bản Hy Lạp.
- source_word: ταῦτα εἰπὼν
  choice: Sau khi nói những điều ấy
  rationale: Phân từ bất định quá khứ chỉ hành động xảy ra trước động từ chính; “những điều ấy” giữ số nhiều của ταῦτα và quy chiếu về lời Đức Chúa Giê-xu vừa phán.
- source_word: βλεπόντων αὐτῶν
  choice: trong lúc họ đang nhìn
  rationale: Kết cấu sở hữu cách tuyệt đối diễn tả hoàn cảnh đồng thời; cách dịch này giữ rõ việc các môn đồ trực tiếp chứng kiến sự việc.
- source_word: ἐπήρθη
  choice: Ngài được nâng lên
  rationale: Thể bị động của ἐπαίρω diễn tả chuyển động lên trên mà không nêu tác nhân. “Được nâng lên” vừa sát nghĩa vừa không xác định thêm ai thực hiện hành động.
- source_word: νεφέλη
  choice: một đám mây
  rationale: Danh từ số ít không có mạo từ; “một đám mây” là cách dịch trực tiếp, không đưa ý nghĩa thần hiện vào chính văn.
- source_word: ὑπέλαβεν αὐτὸν
  choice: đón lấy Ngài
  rationale: ὑπολαμβάνω ở đây có thể mang nghĩa tiếp nhận hoặc mang đi. “Đón lấy Ngài” giữ hình ảnh đám mây tiếp nhận Ngài mà không giản lược động từ thành chỉ việc che khuất.
- source_word: ἀπὸ τῶν ὀφθαλμῶν αὐτῶν
  choice: khiến Ngài khuất khỏi tầm mắt họ
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt cho ý Ngài không còn ở trong phạm vi nhìn thấy của họ; “khiến” làm rõ quan hệ với hành động của đám mây trong câu.
theological_decisions:
- issue: Có nên dùng một công thức thăng thiên mang tính truyền thống rõ hơn cho ἐπήρθη hay không
  choice: Ngài được nâng lên
  alternative: Ngài được cất lên
  rationale: “Được nâng lên” giữ chuyển động hữu hình và thể bị động của tiếng Hy Lạp, đồng thời không đưa một công thức thần học về sự thăng thiên vào câu nhiều hơn điều bản văn trực tiếp nói.
- issue: Có nên diễn đạt νεφέλη như một dấu hiệu minh nhiên về sự hiện diện của Đức Chúa Trời hay không
  choice: một đám mây
  alternative: đám mây của sự hiện diện Đức Chúa Trời
  rationale: Trong nhiều phân đoạn Kinh Thánh, mây có thể gợi đến sự hiện diện của Đức Chúa Trời, nhưng câu này không giải thích biểu tượng ấy và danh từ không có mạo từ. Chính văn vì thế giữ cách nói giản dị; âm hưởng khả dĩ được nêu ở chú thích.
- issue: Cách hiểu hành động của đám mây trong ὑπέλαβεν
  choice: đón lấy Ngài
  alternative: đưa Ngài ra khỏi tầm mắt họ
  rationale: Động từ có thể nhấn mạnh việc tiếp nhận hoặc mang đi. Bản dịch chính giữ sắc thái “tiếp nhận”, còn chú thích bảo lưu cách hiểu nhấn mạnh kết quả Ngài không còn được nhìn thấy.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” để quy chiếu Đức Chúa Giê-xu theo lối tôn kính quen thuộc trong tiếng Việt; tránh thuật ngữ giáo phái và không giải thích biểu tượng đám mây ngay trong chính văn.
