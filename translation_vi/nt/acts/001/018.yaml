  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Οὗτος μὲν οὖν ἐκτήσατο χωρίον ἐκ μισθοῦ τῆς ἀδικίας, καὶ πρηνὴς γενόμενος ἐλάκησεν μέσος, καὶ ἐξεχύθη πάντα τὰ σπλάγχνα αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/018.yaml
  text: So this man acquired a field with the wages of unrighteousness[a], and falling headlong he burst open in the middle[c][b], and all his intestines spilled out.
translation:
  language: vi
  text: Vậy, người này đã có được một thửa ruộng bằng tiền công của sự bất chính[a]; rồi khi ngã chúi đầu xuống[b], ông ta vỡ toác ở giữa thân[c], và toàn bộ nội tạng của ông ta trào ra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “bằng phần thưởng của việc làm gian ác.” Cụm Hy Lạp nói sát chữ là “từ tiền công của sự bất chính.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch sát hơn: “trở nên nằm sấp” hoặc “ngã úp mặt xuống.” Cụm từ có lẽ mô tả một cú ngã chúi đầu.'
    reason: lexical_alternative
  - marker: c
    text: 'Sát chữ: “vỡ toác ở giữa.” Cụm này không xác định rõ vị trí giải phẫu hơn nữa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὗτος μὲν οὖν
  choice: Vậy, người này
  rationale: Οὗτος chỉ lại Giu-đa, còn μέν οὖν nối tiếp và chuyển câu chuyện. “Vậy, người này” giữ được đại từ chỉ định và sắc thái liên kết trong tiếng Việt tự nhiên.
- source_word: ἐκτήσατο
  choice: đã có được
  rationale: κτάομαι nói đến việc đạt được hoặc sở hữu, không nhất thiết xác định rằng chính người ấy trực tiếp mua. “Đã có được” giữ phạm vi nghĩa rộng và không tự giải quyết căng thẳng với Ma-thi-ơ 27:5–8.
- source_word: χωρίον
  choice: một thửa ruộng
  rationale: χωρίον chỉ một thửa đất hoặc cánh đồng. “Một thửa ruộng” cụ thể, tự nhiên và phù hợp với ngữ cảnh.
- source_word: ἐκ μισθοῦ τῆς ἀδικίας
  choice: bằng tiền công của sự bất chính
  rationale: μισθός là tiền công, thù lao hoặc phần thưởng; ἀδικία là sự bất chính hay việc làm sai trái. Cách dịch này giữ hình ảnh đạo đức mạnh của nguyên văn, đồng thời diễn đạt công cụ/nguồn tiền tự nhiên trong tiếng Việt.
- source_word: πρηνὴς γενόμενος
  choice: khi ngã chúi đầu xuống
  rationale: πρηνής diễn tả tư thế sấp hoặc chúi đầu. Trong mạch sự việc, “ngã chúi đầu xuống” truyền đạt cách hiểu có khả năng nhất mà vẫn chú thích khả năng sát chữ.
- source_word: ἐλάκησεν μέσος
  choice: ông ta vỡ bụng
  rationale: λακάω có nghĩa nứt hoặc vỡ toác; μέσος chỉ phần giữa thân thể. “Vỡ bụng” là cách diễn đạt rõ ràng, tự nhiên trong tiếng Việt; chú thích bảo lưu hình thức sát chữ “vỡ toác ở giữa”.
- source_word: ἐξεχύθη
  choice: đều đổ ra ngoài
  rationale: Động từ bị động ἐκχέω diễn tả việc các bộ phận bên trong bị đổ hoặc tràn ra. “Đổ ra ngoài” rõ nghĩa và phù hợp với cảnh thuật lại.
- source_word: πάντα τὰ σπλάγχνα αὐτοῦ
  choice: tất cả ruột gan
  rationale: σπλάγχνα chỉ nội tạng hoặc lòng ruột. “Ruột gan” là cách gọi thông dụng, cụ thể và trang trọng vừa đủ trong tiếng Việt hiện đại.
theological_decisions:
- issue: Mối liên hệ của Giu-đa với việc có được thửa ruộng
  choice: Dịch ἐκτήσατο là “đã có được”, không phải “đã mua”.
  alternative: “Đã mua” thửa ruộng, hàm ý Giu-đa trực tiếp thực hiện việc mua bán.
  rationale: Nguyên văn xác nhận sự thủ đắc nhưng không buộc phải hiểu là Giu-đa đích thân mua. Cách dịch rộng hơn bảo lưu căng thẳng với Ma-thi-ơ 27:5–8 thay vì âm thầm dung hòa.
translation_notes:
  register: Văn phong kể chuyện trang nghiêm nhưng hiện đại, dễ hiểu. Dùng “đã có được” để không thu hẹp cơ chế sở hữu; dùng “ruột gan” thay cho thuật ngữ y khoa hoặc từ cổ. Các dấu chú thích [a], [b], [c] đều được đặt ngay sau cụm từ liên quan.
