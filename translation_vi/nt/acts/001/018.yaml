  to: Vậy, người này đã có được một thửa ruộng bằng tiền công của sự bất chính[a]; rồi khi ngã chúi đầu xuống[b], ông ta vỡ toác ở giữa thân[c], và toàn bộ nội tạng của ông ta trào ra.
