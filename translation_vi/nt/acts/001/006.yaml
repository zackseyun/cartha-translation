id: ACT.1.6
reference: Acts 1:6
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Οἱ μὲν οὖν συνελθόντες ⸀ἠρώτων αὐτὸν λέγοντες· Κύριε, εἰ ἐν τῷ χρόνῳ τούτῳ ἀποκαθιστάνεις τὴν βασιλείαν τῷ Ἰσραήλ;
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/006.yaml
  text: So when they had come together[a], they asked him, saying, “Lord, is it at this time that you are restoring the kingdom to Israel?”
translation:
  language: vi
  text: 'Vậy, khi họ tụ họp lại, họ hỏi Ngài: “Lạy Chúa, có phải lúc này Ngài sẽ khôi phục vương quốc cho Israel[a] không?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “trả lại vương quốc cho Israel.” Dữ cách Hy Lạp có thể chỉ điều được thực hiện vì lợi ích của Israel hoặc chỉ Israel là bên được nhận lại vương quốc.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἱ μὲν οὖν συνελθόντες
  choice: Vậy, khi họ tụ họp lại
  rationale: Phân từ συνελθόντες diễn tả hoàn cảnh thời gian; μὲν οὖν nối tiếp mạch kể. “Vậy, khi…” vừa tự nhiên trong tiếng Việt vừa giữ được bước chuyển của câu chuyện.
- source_word: ἠρώτων αὐτὸν λέγοντες
  choice: họ hỏi Ngài
  rationale: Dịch tự nhiên hành động hỏi và nội dung trực tiếp của λέγοντες mà không cần giữ từ đệm “rằng”; đại từ kính trọng phù hợp với lời hướng đến Chúa Giê-su.
- source_word: Κύριε
  choice: Lạy Chúa
  rationale: “Lạy Chúa” là cách xưng hô trực tiếp trang trọng, tự nhiên, giữ được cả sắc thái kính trọng lẫn trọng lượng của tước hiệu κύριος.
- source_word: εἰ ἐν τῷ χρόνῳ τούτῳ
  choice: có phải lúc này ... không
  rationale: εἰ mở đầu câu hỏi có/không, còn ἐν τῷ χρόνῳ τούτῳ chỉ thời điểm hoặc thời kỳ hiện tại. Cấu trúc “có phải… không?” là tiếng Việt tự nhiên.
- source_word: ἀποκαθιστάνεις
  choice: Ngài sẽ khôi phục
  rationale: Động từ chỉ việc đưa trở lại tình trạng trước kia. Trong câu hỏi về thời điểm của một hành động được mong đợi, “sẽ khôi phục” tự nhiên hơn dạng hiện tại tiếp diễn trong tiếng Việt mà vẫn giữ ý nghĩa nguyên văn.
- source_word: τὴν βασιλείαν
  choice: vương quốc
  rationale: Trong ngữ cảnh “cho Israel”, βασιλεία gợi một thực tại vương quyền/vương quốc; “vương quốc” giữ được kỳ vọng cụ thể của các môn đồ mà không quyết định đó chỉ là chính trị hay chỉ là thuộc linh.
- source_word: τῷ Ἰσραήλ
  choice: cho Israel
  rationale: Dữ cách Hy Lạp có thể biểu thị lợi ích (“cho Israel”) hoặc đích của sự phục hồi (“trả lại cho Israel”). Bản chính dùng cách nói tự nhiên “cho Israel” và ghi chú phương án gần với cấu trúc đích hơn.
theological_decisions:
- issue: Bản chất kỳ vọng của các môn đồ về vương quốc của Israel
  choice: Giữ nguyên câu hỏi về việc khôi phục “vương quốc cho Israel”, không giải thích đó là thuần túy chính trị hay thuần túy thuộc linh.
  alternative: “khôi phục vương quốc của Israel” hoặc “khôi phục quyền cai trị cho Israel”
  rationale: Câu này thuật lại câu hỏi của các môn đồ chứ chưa xác nhận hay bác bỏ mọi giả định trong câu hỏi. Cách dịch cần giữ nguyên sức căng lịch sử và thần học.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Lạy Chúa” trong lời gọi trực tiếp và “Ngài” để biểu thị sự kính trọng. Dấu [a] được đặt ngay sau cụm từ mà chú thích giải thích.
