    rationale: μάρτυρες là danh từ vị ngữ và μου bổ nghĩa trực tiếp cho danh từ này. “Sẽ là những nhân chứng của tôi” bảo toàn cả hai yếu tố, vẫn tự nhiên trong tiếng Việt.
