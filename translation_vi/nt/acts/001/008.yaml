revisions:
- from: Nhưng khi Đức Thánh Linh ngự xuống trên anh em, anh em sẽ nhận được quyền năng và sẽ làm chứng về tôi tại Giê-ru-sa-lem, khắp miền Giu-đê và Sa-ma-ri, cho đến tận cùng trái đất.[a]
