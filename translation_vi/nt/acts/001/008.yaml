id: ACT.1.8
reference: Acts 1:8
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀλλὰ λήμψεσθε δύναμιν ἐπελθόντος τοῦ ἁγίου πνεύματος ἐφ’ ὑμᾶς, καὶ ἔσεσθέ ⸀μου μάρτυρες ἔν τε Ἰερουσαλὴμ καὶ ἐν πάσῃ τῇ Ἰουδαίᾳ καὶ Σαμαρείᾳ καὶ ἕως ἐσχάτου τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/008.yaml
  text: But you will receive power when the Holy Spirit has come upon you[a], and you will be my witnesses in Jerusalem, and in all Judea and Samaria, and to the end of the earth.
translation:
  language: vi
  text: Nhưng anh em sẽ nhận được quyền năng khi Đức Thánh Linh giáng trên anh em; và anh em sẽ là những nhân chứng của tôi tại Giê-ru-sa-lem, trong khắp xứ Giu-đê và Sa-ma-ri, cho đến tận cùng trái đất.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “cho đến những nơi tận cùng của trái đất.” Cụm từ Hy Lạp ở dạng số ít nhưng được dùng như một thành ngữ chỉ nơi xa xôi nhất trên trái đất.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Nhưng
  rationale: Đánh dấu sự tương phản với câu 7 một cách tự nhiên và trực tiếp trong tiếng Việt.
- source_word: λήμψεσθε δύναμιν
  choice: anh em sẽ nhận được quyền năng
  rationale: λαμβάνω ở đây mang nghĩa nhận điều được ban; δύναμις chỉ năng lực hữu hiệu do Thánh Linh ban, nên “quyền năng” phù hợp hơn “sức mạnh” thuần thể chất.
- source_word: ἐπελθόντος τοῦ ἁγίου πνεύματος ἐφ’ ὑμᾶς
  choice: khi Đức Thánh Linh ngự xuống trên anh em
  rationale: Chuyển cấu trúc sở hữu cách tuyệt đối thành mệnh đề thời gian tự nhiên; “ngự xuống trên” diễn đạt chuyển động ἐπί và giữ sắc thái trang trọng dành cho Đấng thần linh.
- source_word: ἔσεσθέ μου μάρτυρες
  choice: anh em sẽ làm chứng về tôi
  rationale: Trong tiếng Việt, “làm chứng về tôi” tự nhiên hơn “là những nhân chứng của tôi” khi nói đến sứ mạng rao truyền lời chứng, đồng thời vẫn giữ đối tượng của lời chứng là Chúa Giê-su.
- source_word: ἔν τε Ἰερουσαλὴμ καὶ ἐν πάσῃ τῇ Ἰουδαίᾳ καὶ Σαμαρείᾳ
  choice: tại Giê-ru-sa-lem, khắp miền Giu-đê và Sa-ma-ri
  rationale: “Tại” phù hợp với thành phố, còn “khắp miền” thể hiện phạm vi của πάσῃ đối với các vùng; giới từ không cần lặp lại trước Sa-ma-ri trong tiếng Việt.
- source_word: ἕως ἐσχάτου τῆς γῆς
  choice: cho đến tận cùng trái đất
  rationale: Giữ dạng số ít của nguyên văn và diễn đạt thành ngữ chỉ nơi xa xôi nhất trên thế giới bằng một cụm từ quen thuộc, trang trọng.
theological_decisions:
- issue: πνεῦμα là Đấng thần linh có ngôi vị
  choice: Đức Thánh Linh
  alternative: Thánh Thần
  rationale: “Đức Thánh Linh” là cách gọi hiện đại, trang trọng và phổ biến trong tiếng Việt; bản dịch không thêm diễn giải tín lý ngoài chính danh xưng của văn bản.
- issue: Quan hệ của μου với μάρτυρες
  choice: làm chứng về tôi
  alternative: là những nhân chứng của tôi
  rationale: Cách chọn nhấn mạnh nội dung lời chứng quy hướng về Chúa Giê-su mà không giới hạn lời chứng vào một công thức giáo hội học cụ thể; phương án danh từ vẫn có thể phản ánh sát cấu trúc Hy Lạp hơn.
- issue: Phạm vi của sứ mạng làm chứng
  choice: các địa danh thực, mở rộng đến tận cùng trái đất
  alternative: một địa lý hoàn toàn mang tính biểu tượng
  rationale: Văn bản nêu các địa danh cụ thể và một chân trời toàn cầu; bản dịch giữ nguyên tiến trình địa lý mà không áp đặt thêm một mô hình truyền giáo riêng.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh em” cho đại từ số nhiều ὑμᾶς, phản ánh lời Chúa Giê-su nói với nhóm môn đồ. Phiên âm địa danh theo lối quen thuộc trong các bản Kinh Thánh tiếng Việt. Dấu chú thích [a] được đặt ngay sau cụm từ liên quan.
