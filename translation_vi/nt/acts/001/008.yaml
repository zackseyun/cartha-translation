  source_fidelity: 'Bản nháp chuyển đảo trật tự chính của mệnh đề: nguyên văn trước hết hứa “anh em sẽ nhận được quyền năng,” rồi nêu thời điểm Thánh Linh đến trên họ. “Ngự xuống” thêm rõ nét chuyển động đi xuống không được nêu trực tiếp bởi ἐπελθόντος ... ἐφ’ ὑμᾶς. “Sẽ làm chứng về tôi” truyền đạt hoạt động liên quan đến Chúa Giê-su, nhưng chuyển cấu trúc “anh em sẽ là những nhân chứng của tôi” thành một diễn giải động từ và làm mờ quan hệ μου với μάρτυρες.'
  naturalness: Bản sửa giữ văn phong hiện đại, trang trọng và tự nhiên. “Giáng trên anh em” là cách dùng Kinh Thánh Việt ngữ gọn, diễn đạt sự kiện Thánh Linh đến trên họ mà không thêm ý về địa điểm hay phương hướng ngoài ngữ cảnh.
  terminology: Giữ “Đức Thánh Linh,” “quyền năng,” và các địa danh phiên âm quen thuộc. “Những nhân chứng của tôi” phản ánh trực tiếp μάρτυρες và μου; không nên dùng nghĩa hậu kỳ “người tử đạo.”
