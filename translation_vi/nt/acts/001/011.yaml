  to: 'Họ cũng nói: “Hỡi những người Ga-li-lê, sao các ông cứ đứng nhìn lên trời? Đức Giê-su này[a], Đấng đã được cất lên trời khỏi các ông, cũng sẽ đến theo cách các ông đã thấy Ngài lên trời.”'
