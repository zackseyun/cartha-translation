id: ACT.1.11
reference: Acts 1:11
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οἳ καὶ εἶπαν· Ἄνδρες Γαλιλαῖοι, τί ἑστήκατε ⸀βλέποντες εἰς τὸν οὐρανόν; οὗτος ὁ Ἰησοῦς ὁ ἀναλημφθεὶς ἀφ’ ὑμῶν εἰς τὸν οὐρανὸν οὕτως ἐλεύσεται ὃν τρόπον ἐθεάσασθε αὐτὸν πορευόμενον εἰς τὸν οὐρανόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/011.yaml
  text: They also said[a], “Men of Galilee, why do you stand looking into heaven? This Jesus, who was taken up from you into heaven, will come in the same way that you saw him going into heaven.”
translation:
  language: vi
  text: 'Họ cũng nói: “Hỡi những người Ga-li-lê, sao các ông cứ đứng nhìn lên trời? Đức Giê-su này[a], Đấng đã được cất lên trời khỏi các ông, cũng sẽ đến theo cách các ông đã thấy Ngài lên trời.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc theo lối dịch truyền thống: “cũng chính Đức Giê-su này.” Tiếng Hy Lạp nói rõ “Đức Giê-su này”; ý “cùng một Đấng” là phần diễn giải thêm nhằm nhấn mạnh căn tính của Ngài.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄνδρες Γαλιλαῖοι
  choice: Hỡi những người Ga-li-lê
  rationale: Cách xưng hô trực tiếp này giữ sắc thái hô cách và ý chỉ những người nam trong ngữ cảnh, đồng thời tự nhiên hơn trong tiếng Việt hiện đại so với cách dịch sát cứng “những người nam Ga-li-lê”.
- source_word: τί ἑστήκατε βλέποντες
  choice: sao các ông cứ đứng nhìn
  rationale: ἑστήκατε diễn tả trạng thái đang đứng, còn βλέποντες là hành động đi kèm. Từ “cứ” truyền đạt tự nhiên sắc thái câu hỏi về việc họ tiếp tục đứng nhìn mà không làm mạnh động từ thành “chăm chú nhìn”.
- source_word: εἰς τὸν οὐρανόν
  choice: lên trời
  rationale: Trong bối cảnh thăng thiên, οὐρανός phù hợp nhất với “trời” theo nghĩa thiên giới; “lên” thể hiện hướng chuyển động do εἰς và văn cảnh xác định.
- source_word: οὗτος ὁ Ἰησοῦς
  choice: Đức Giê-su này
  rationale: Giữ trực tiếp đại từ chỉ định οὗτος và không tự thêm từ tương đương với “chính/same”. Danh xưng “Đức Giê-su” phù hợp với văn phong Kinh Thánh trang trọng, dễ hiểu trong tiếng Việt.
- source_word: ὁ ἀναλημφθεὶς ἀφ’ ὑμῶν
  choice: Đấng đã được cất lên trời khỏi các ông
  rationale: Thể bị động được giữ bằng “đã được cất lên”; “khỏi các ông” thể hiện sự lìa khỏi sự hiện diện của các môn đồ. Bổ sung “trời” ngay trong cụm này phản ánh εἰς τὸν οὐρανόν đi sau trong nguyên văn.
- source_word: οὕτως ἐλεύσεται ὃν τρόπον
  choice: cũng sẽ trở lại theo cách
  rationale: οὕτως cùng ὃν τρόπον diễn tả sự tương ứng về cách thức. “Trở lại” là cách nói tự nhiên trong tiếng Việt ở lời hứa này; từ “cũng” làm rõ sự tương ứng mà không xác định thêm mọi chi tiết của cách Ngài đến.
- source_word: ἐθεάσασθε αὐτὸν πορευόμενον
  choice: các ông đã thấy Ngài lên
  rationale: “Đã thấy” truyền đạt rõ hành vi chứng kiến; “Ngài lên” diễn tả πορευόμενον theo hướng đã được cụm εἰς τὸν οὐρανόν xác định, tránh cách nói nặng nề “đi vào trời”.
theological_decisions:
- issue: Nghĩa của οὐρανός trong bối cảnh thăng thiên và trở lại
  choice: trời
  alternative: bầu trời
  rationale: οὐρανός có thể chỉ bầu trời hữu hình hoặc thiên giới. Văn cảnh Chúa Giê-su được cất lên và lời hứa Ngài sẽ đến ủng hộ “trời”, nhưng bản dịch không giải thích thêm bản chất hay vị trí của trời.
- issue: Cách dịch οὗτος ὁ Ἰησοῦς
  choice: Đức Giê-su này
  alternative: chính Đức Giê-su này
  rationale: Nguyên văn nhấn mạnh bằng đại từ chỉ định “này” nhưng không có một từ riêng mang nghĩa “chính” hay “cùng một”. Bản chính giữ hình thức sát nguồn; cách truyền thống được nêu trong chú thích.
- issue: Phạm vi của sự tương ứng trong οὕτως ... ὃν τρόπον
  choice: theo cách các ông đã thấy Ngài lên trời
  alternative: y như các ông đã thấy Ngài lên trời
  rationale: Bản dịch giữ sự tương ứng về cách thức nhưng không dùng “y như”, vốn có thể bị hiểu là khẳng định sự đồng nhất ở mọi chi tiết mà câu không diễn giải.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng “các ông” vì lời gọi Ἄνδρες Γαλιλαῖοι hướng đến những người nam Ga-li-lê trong cảnh này; dùng “Ngài” để quy chiếu kính trọng đến Đức Giê-su. Giữ cấu trúc câu hỏi và lời hứa, đồng thời tránh thuật ngữ giáo phái.
