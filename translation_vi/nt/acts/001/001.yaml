  naturalness: Bản sửa dùng tiếng Việt hiện đại, trang trọng và mạch lạc. “Thưa Thê-ô-phi-lơ” diễn đạt lời gọi trực tiếp mà không thêm danh xưng “ông.”
  terminology: Dùng “Giê-su” theo dạng chính tả Việt hiện đại và không thêm tước hiệu thần học ngoài nguyên văn. Chú thích được chỉnh để các lựa chọn thay thế khớp với phạm vi từ vựng của λόγος.
  issues:
  - severity: medium
    issue: “Đức Chúa Jêsus” thêm tước hiệu không hiện diện trong nguyên văn.
    rationale: Bản Hy Lạp chỉ có ὁ Ἰησοῦς. Mạo từ ὁ không tương đương với “Đức Chúa”; thêm tước hiệu làm thay đổi mức độ minh thị của văn bản.
  - severity: low
    issue: “Sách thứ nhất” thu hẹp λόγος, còn chú thích dùng “tác phẩm thứ nhất” không khớp sát các lựa chọn đã nêu trong hồ sơ tiếng Anh.
    rationale: λόγος trong ngữ cảnh là bản tường thuật/tác phẩm viết; “bản tường thuật thứ nhất” phù hợp hơn với “first account.” Chú thích nên nêu “bản tường thuật trước” hoặc “sách thứ nhất.”
  - severity: low
    issue: “Thưa ông” thêm cách xưng hô giới tính và danh xưng ngoài dấu hiệu hô cách của ὦ.
    rationale: Có thể diễn đạt hô cách tự nhiên bằng “Thưa Thê-ô-phi-lơ” mà không thêm “ông.”
