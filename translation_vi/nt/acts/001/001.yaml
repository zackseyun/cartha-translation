  text: Τὸν μὲν πρῶτον λόγον ἐποιησάμην περὶ πάντων, ὦ Θεόφιλε, ὧν ἤρξατο ⸀ὁ Ἰησοῦς ποιεῖν τε καὶ διδάσκειν
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/001.yaml
  text: In the first account[a], O Theophilus, I wrote about all that Jesus began both to do and to teach,
translation:
  language: vi
  text: Trong bản tường thuật thứ nhất[a], thưa Thê-ô-phi-lơ, tôi đã viết về mọi điều Giê-su bắt đầu làm và dạy,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “bản tường thuật trước” hay “sách thứ nhất.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τὸν μὲν πρῶτον λόγον
  choice: Trong sách thứ nhất
  rationale: Trong ngữ cảnh này, λόγος chỉ một tác phẩm viết, tức sách Tin Lành Lu-ca. “Sách thứ nhất” tự nhiên trong tiếng Việt, giữ được ý thứ tự của πρῶτον và mở ra sự tiếp nối trong Công Vụ.
- source_word: ἐποιησάμην
  choice: tôi đã viết
  rationale: Khi đi với λόγος, động từ này mang nghĩa thành ngữ là soạn hoặc viết một tác phẩm; “đã viết” rõ ràng và tự nhiên.
- source_word: περὶ πάντων ... ὧν
  choice: về mọi điều ...
  rationale: Cách diễn đạt này tái hiện gọn và tự nhiên cấu trúc “về tất cả những điều mà,” không buộc πάντων phải mang nghĩa bao quát tuyệt đối ngoài phạm vi trình thuật.
- source_word: ὦ Θεόφιλε
  choice: thưa ông Thê-ô-phi-lơ
  rationale: “Thưa ông” thể hiện lời xưng hô trực tiếp, trang trọng của ὦ trong tiếng Việt hiện đại mà không thêm sắc thái thân mật không có trong nguyên văn.
- source_word: ἤρξατο
  choice: bắt đầu
  rationale: Giữ nguyên ý nghĩa trực tiếp của động từ, đồng thời không giải thích thêm hàm ý rằng công việc của Đức Chúa Jêsus tiếp tục trong Công Vụ.
- source_word: ὁ Ἰησοῦς
  choice: Đức Chúa Jêsus
  rationale: Dùng hình thức tên gọi quen thuộc và trang trọng trong truyền thống Kinh Thánh tiếng Việt.
- source_word: ποιεῖν τε καὶ διδάσκειν
  choice: làm và dạy
  rationale: Giữ hai hoạt động song song là hành động và giảng dạy. Trong tiếng Việt, liên từ “và” đã diễn đạt tự nhiên cấu trúc τε καί mà không cần thêm “vừa... vừa,” vốn có thể gây nặng câu.
theological_decisions:
- issue: Hàm ý của ἤρξατο (“bắt đầu”) về sự tiếp tục công việc của Đức Chúa Jêsus trong sách Công Vụ
  choice: Giữ “bắt đầu” trong chính văn mà không giải thích hàm ý.
  alternative: Lược bỏ ý “bắt đầu” thành “mọi điều Đức Chúa Jêsus đã làm và dạy,” hoặc diễn giải rằng Ngài tiếp tục làm qua các sứ đồ.
  rationale: Nguyên văn nêu rõ “bắt đầu.” Cách dịch này bảo toàn khả năng hàm ý về sự tiếp diễn nhưng không biến hàm ý ấy thành lời khẳng định minh nhiên.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “thưa ông” cho lời gọi trực tiếp; tên riêng được phiên âm theo lối quen thuộc trong Kinh Thánh tiếng Việt. Dấu phẩy cuối câu được giữ vì câu tiếp tục sang câu 2.
