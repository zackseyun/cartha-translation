base_translation:
  language: en
  yaml_path: translation/nt/acts/001/017.yaml
  text: For he was numbered among us and received a share in this ministry[a].
translation:
  language: vi
  text: Vì người đã được kể vào số chúng tôi và đã nhận một phần trong chức vụ này[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “đã nhận phần được phân định trong chức vụ này.” Từ Hy Lạp κλῆρος có thể chỉ “thăm/lô” hoặc, theo nghĩa mở rộng, “phần được phân định.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Vì
  rationale: Trong ngữ cảnh, từ này dẫn vào lời giải thích của Phi-e-rơ; “Vì” truyền đạt rõ sắc thái nguyên nhân.
- source_word: κατηριθμημένος ἦν
  choice: đã được kể vào số
  rationale: Cách dịch này giữ sắc thái bị động và ý nghĩa Giu-đa thực sự được tính là thành viên trong nhóm.
- source_word: ἐν ἡμῖν
  choice: chúng tôi
  rationale: Kết hợp với “vào số” tạo thành cách nói tự nhiên “được kể vào số chúng tôi”, diễn đạt sự thuộc về nhóm chứ không chỉ ở gần họ.
- source_word: ἔλαχεν
  choice: đã nhận
  rationale: Động từ có thể chỉ việc nhận được do bắt thăm hoặc được phân cho; “đã nhận” tự nhiên trong tiếng Việt, còn sắc thái phân phần được giữ qua “một phần” và chú thích.
- source_word: τὸν κλῆρον
  choice: một phần
  rationale: κλῆρος có thể là “lá thăm” hoặc phần được phân. Trong ngữ cảnh này, “một phần” diễn đạt tự nhiên sự dự phần vào chức vụ mà không khẳng định rằng việc bắt thăm đã diễn ra tại đây.
- source_word: τῆς διακονίας ταύτης
  choice: trong chức vụ này
  rationale: διακονία ở đây chỉ sự phục vụ mang tính sứ đồ. “Chức vụ” phù hợp với ngữ cảnh và kết hợp tự nhiên với “một phần trong”.
theological_decisions:
- issue: Mối liên hệ của Giu-đa với chức vụ sứ đồ
  choice: Câu dịch khẳng định Giu-đa đã được kể vào nhóm và thực sự có phần trong chức vụ ấy.
  alternative: Có thể diễn đạt yếu hơn như thể Giu-đa chỉ liên hệ hoặc đồng hành với nhóm.
  rationale: Nguyên văn xác nhận cả tư cách được tính trong nhóm lẫn sự dự phần vào chức vụ, nhưng không đưa ra kết luận về sự chuẩn nhận hay bền đỗ của ông; bản dịch giữ nguyên sức căng thần học đó.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. “Được kể vào số chúng tôi” giữ sắc thái chính thức của việc thuộc về nhóm; “chức vụ” phù hợp với ngữ cảnh sứ đồ.
