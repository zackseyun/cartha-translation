  text: καὶ ἔστησαν δύο, Ἰωσὴφ τὸν καλούμενον Βαρσαββᾶν, ὃς ἐπεκλήθη Ἰοῦστος, καὶ Μαθθίαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/023.yaml
  text: 'And they put forward two: Joseph called Barsabbas[a], who was also called Justus, and Matthias.'
translation:
  language: vi
  text: 'Họ đưa ra hai người: Giô-sép gọi là Ba-sa-ba[a], tức Giút-tu, và Ma-thia.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đặt hai người ra” hoặc “trình hai người ra”. Động từ Hy Lạp có thể chỉ việc đặt người trước một nhóm; ở đây có lẽ nói đến việc đề cử họ làm ứng viên.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔστησαν
  choice: đưa ra
  rationale: Trong bối cảnh chọn người, động từ chỉ việc đặt hoặc giới thiệu hai người trước cộng đồng như các ứng viên; “đưa ra” tự nhiên và không hàm ý họ đã được chính thức bổ nhiệm.
- source_word: δύο
  choice: hai người
  rationale: Số từ chỉ hai người được đề cử; thêm “người” là cần thiết để câu tiếng Việt rõ và tự nhiên.
- source_word: καλούμενον
  choice: gọi là
  rationale: Giới thiệu một tên gọi khác của Giô-sép, sát nghĩa và tự nhiên trong tiếng Việt.
- source_word: Βαρσαββᾶν
  choice: Ba-sa-ba
  rationale: Phiên âm tên riêng theo cách đọc quen thuộc trong tiếng Việt.
- source_word: ἐπεκλήθη
  choice: cũng được gọi là
  rationale: Dạng bị động giới thiệu thêm một tên khác; “cũng” làm rõ quan hệ với mệnh đề tên gọi đứng trước mà không thêm nội dung mới.
- source_word: Ἰοῦστος
  choice: Giút-tu
  rationale: Phiên âm tên riêng theo âm dạng Hy Lạp/La-tinh quen dùng.
- source_word: Μαθθίαν
  choice: Ma-thia
  rationale: Phiên âm tên riêng theo cách đọc quen thuộc trong tiếng Việt.
- source_word: καὶ ... καὶ
  choice: Họ ... và
  rationale: Liên từ đầu câu nối tiếp mạch kể; tiếng Việt tự nhiên có thể thể hiện sự tiếp nối bằng cách mở đầu trực tiếp với chủ ngữ, còn liên từ thứ hai nối hai người được đưa ra.
