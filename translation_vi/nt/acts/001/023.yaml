    rationale: 'Ý một nhóm tiếp nhận có thể suy ra từ ngữ cảnh, nhưng chú thích từ vựng nên giữ trung tính: “đặt/trình hai người ra trước nhóm” hoặc đơn giản “đặt/trình hai người ra.”'
