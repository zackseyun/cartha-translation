  source_fidelity: 'Bản dịch truyền đạt đúng ý chính của καὶ ἔστησαν δύο: cộng đồng đưa/trình hai người ra làm ứng viên. Hai tên gọi của Giô-sép và tên Ma-thia đều được giữ. Tuy nhiên, ἐπεκλήθη chỉ giới thiệu tên gọi thêm; cách dịch bị động “cũng được gọi là” không sai nhưng kém tự nhiên trong cấu trúc liệt kê tên riêng tiếng Việt.'
  naturalness: Câu hiện tại hiểu được, nhưng “Giô-sép, gọi là Ba-sa-ba[a], cũng được gọi là Giút-tu” hơi nặng và lặp cấu trúc bị động. Dùng “tức” cho tên hiệu thứ hai tự nhiên, gọn, và vẫn giữ quan hệ giữa hai tên gọi.
  terminology: Các dạng tên phiên âm Giô-sép, Ba-sa-ba, Giút-tu và Ma-thia nhất quán với lối phiên âm Việt ngữ thường dùng. “đưa ra” phù hợp ngữ cảnh tuyển chọn và không hàm ý đã bổ nhiệm.
