source:
  edition: SBLGNT
  text: γέγραπται γὰρ ἐν βίβλῳ ψαλμῶν· Γενηθήτω ἡ ἔπαυλις αὐτοῦ ἔρημος καὶ μὴ ἔστω ὁ κατοικῶν ἐν αὐτῇ, καί· Τὴν ἐπισκοπὴν αὐτοῦ ⸀λαβέτω ἕτερος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/020.yaml
  text: For it is written in the book of Psalms[a], ‘Let his dwelling place become desolate, and let there be no one dwelling in it,’ and[c][b], ‘Let another take his office.’
translation:
  language: vi
  text: 'Vì trong sách Thi Thiên có chép rằng: “Nguyện nơi ở của người ấy trở nên hoang vắng, và không có ai cư ngụ tại đó,”[a] và: “Nguyện một người khác nhận lấy nhiệm vụ giám sát của người ấy.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Nơi ở” cũng có thể dịch là “chỗ cư trú” hoặc “khu cư ngụ”; “không có ai cư ngụ tại đó” cũng có thể dịch là “không có người nào ở tại đó.”
    reason: lexical_alternative
  - marker: b
    text: “Nhiệm vụ giám sát” dịch từ ἐπισκοπή, cũng có thể dịch là “chức vụ” hoặc “quyền giám sát.” Cách dịch “chức giám mục” có thể gợi đến một chức danh kỹ thuật về sau mà ngữ cảnh này không nhất thiết hàm ý.
    reason: alternative_reading
lexical_decisions:
- source_word: γέγραπται γὰρ ἐν βίβλῳ ψαλμῶν
  choice: Vì trong sách Thi Thiên có chép rằng
  rationale: Dùng công thức trích dẫn Kinh Thánh tự nhiên trong tiếng Việt, đồng thời giữ liên từ giải thích γάρ và xác định nguồn trích dẫn.
- source_word: ἔπαυλις
  choice: nơi ở
  rationale: Diễn đạt rộng và tự nhiên cho một nơi cư trú, không thu hẹp nghĩa thành nhà, trại hay cơ nghiệp.
- source_word: Γενηθήτω ... ἔρημος
  choice: Nguyện ... trở nên hoang vắng
  rationale: “Nguyện” truyền đạt sắc thái mệnh lệnh cầu khiến trong lời trích dẫn; “hoang vắng” ở đây chỉ tình trạng bị bỏ không, không người cư trú.
- source_word: μὴ ἔστω ὁ κατοικῶν ἐν αὐτῇ
  choice: không một ai cư ngụ tại đó
  rationale: Chuyển cấu trúc phủ định với phân từ danh hóa sang tiếng Việt tự nhiên mà vẫn giữ ý không có người cư trú.
- source_word: ἐπισκοπή
  choice: chức vụ giám sát
  rationale: Giữ nét nghĩa về trách nhiệm hoặc vai trò trông coi nhưng tránh thuật ngữ giáo phẩm về sau như “chức giám mục”.
- source_word: λαβέτω ἕτερος
  choice: Nguyện một người khác nhận lấy
  rationale: Giữ sắc thái cầu khiến của mệnh lệnh aorist và ý một người khác tiếp nhận vai trò ấy.
theological_decisions:
- issue: Cách dịch ἐπισκοπή trong ngữ cảnh thay thế Giu-đa
  choice: chức vụ giám sát
  alternative: chức vụ; quyền giám sát; chức giám mục
  rationale: “Chức vụ giám sát” bảo tồn ý về một trách nhiệm trông coi được giao cho người khác, nhưng không áp đặt cơ cấu giáo phẩm kỹ thuật của thời kỳ sau. “Chức vụ” tự nhiên hơn nhưng làm mờ nét nghĩa giám sát; “chức giám mục” dễ đưa một định chế về sau vào câu.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Hai mệnh đề trích dẫn dùng “Nguyện” để giữ sắc thái cầu khiến của nguyên văn. Tránh thuật ngữ hệ phái và không đồng nhất ἐπισκοπή với một chức danh giáo hội phát triển về sau.
