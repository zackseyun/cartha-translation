  to: 'Vì trong sách Thi Thiên có chép rằng: “Nguyện nơi ở của người ấy trở nên hoang vắng, và không có ai cư ngụ tại đó,”[a] và: “Nguyện một người khác nhận lấy nhiệm vụ giám sát của người ấy.”[b]'
