id: ACT.1.3
reference: Acts 1:3
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οἷς καὶ παρέστησεν ἑαυτὸν ζῶντα μετὰ τὸ παθεῖν αὐτὸν ἐν πολλοῖς τεκμηρίοις, δι’ ἡμερῶν τεσσεράκοντα ὀπτανόμενος αὐτοῖς καὶ λέγων τὰ περὶ τῆς βασιλείας τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/003.yaml
  text: To them he also presented himself alive after he had suffered[a], by many proofs[b], appearing to them over forty days and speaking about the kingdom of God.
translation:
  language: vi
  text: Sau khi chịu khổ, Ngài cũng tỏ cho họ thấy mình đang sống bằng nhiều bằng chứng xác thực[a]. Trong khoảng bốn mươi ngày[b], Ngài hiện ra với họ và nói về vương quốc Đức Chúa Trời.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “bằng nhiều chứng cứ chắc chắn.” Từ Hy Lạp chỉ bằng chứng tạo nên sự xác tín.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “suốt bốn mươi ngày” hoặc “trong bốn mươi ngày.” Cụm từ nói đến các lần hiện ra diễn ra trong khoảng thời gian ấy.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἷς
  choice: cho họ
  rationale: Đại từ quan hệ số nhiều ở cách tặng, chỉ lại các sứ đồ trong câu trước. “Cho họ” bám sát tiếng Hy Lạp mà không thêm từ “những người nam,” vốn không được nói rõ tại đây.
- source_word: παρέστησεν ἑαυτὸν ζῶντα
  choice: tỏ cho họ thấy mình đang sống
  rationale: Diễn đạt tự nhiên hành động tự bày tỏ, với ζῶντα làm bổ ngữ chỉ tình trạng sống của Chúa Giê-xu sau khi chịu khổ.
- source_word: μετὰ τὸ παθεῖν αὐτὸν
  choice: sau khi chịu khổ
  rationale: Cấu trúc μετά với động từ nguyên mẫu có mạo từ biểu thị thời gian; cách dịch giữ hành động chịu khổ xảy ra trước các lần hiện ra.
- source_word: ἐν πολλοῖς τεκμηρίοις
  choice: bằng nhiều bằng chứng xác thực
  rationale: τεκμήριον chỉ bằng chứng có sức xác lập sự chắc chắn; “xác thực” truyền đạt sắc thái ấy mà không dùng từ tuyệt đối hơn như “không thể bác bỏ.”
- source_word: δι’ ἡμερῶν τεσσεράκοντα
  choice: trong khoảng bốn mươi ngày
  rationale: διά với sở hữu cách diễn tả một khoảng thời gian mà các lần hiện ra diễn ra xuyên suốt, không nhất thiết là sự hiện diện liên tục.
- source_word: ὀπτανόμενος αὐτοῖς
  choice: Ngài hiện ra với họ
  rationale: ὀπτάνομαι trong bối cảnh phục sinh mang nghĩa “hiện ra”; chủ ngữ được nhắc lại để câu tiếng Việt rõ ràng sau khi tách câu.
- source_word: λέγων τὰ περὶ τῆς βασιλείας τοῦ θεοῦ
  choice: nói về vương quốc Đức Chúa Trời
  rationale: τὰ περὶ mang nghĩa “những điều liên quan đến”; “nói về” là cách diễn đạt tiếng Việt tự nhiên. “Vương quốc Đức Chúa Trời” bảo lưu hình ảnh βασιλεία về quyền trị vì và vương quốc.
theological_decisions:
- issue: Ngôn ngữ phục sinh và sức nặng của bằng chứng
  choice: Nói rõ Chúa Giê-xu tỏ cho các sứ đồ thấy mình đang sống sau khi chịu khổ, bằng nhiều bằng chứng xác thực.
  alternative: Ngài tỏ mình sống với nhiều bằng chứng không thể sai lầm.
  rationale: Bản dịch khẳng định sự sống sau khi chịu khổ và tính chứng cứ của các lần hiện ra đúng như câu Hy Lạp, nhưng không cường điệu τεκμήριον bằng một tính từ tuyệt đối.
- issue: Phạm vi thời gian của các lần hiện ra
  choice: “Trong khoảng bốn mươi ngày” chỉ các lần hiện ra phân bố trong giai đoạn ấy.
  alternative: “Suốt bốn mươi ngày,” có thể bị hiểu là sự hiện diện liên tục.
  rationale: Cách dịch giữ ý nghĩa thời gian của διὰ với sở hữu cách mà không quyết định quá mức tần suất hoặc tính liên tục.
- issue: Đối tượng của οἷς
  choice: Dùng “họ,” với tiền ngữ cảnh là các sứ đồ.
  alternative: Dùng “những người ấy” hoặc thêm “các sứ đồ.”
  rationale: Tiếng Hy Lạp dùng đại từ quan hệ và không lặp lại danh từ; “họ” giữ đúng mức độ minh thị của nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” cho Chúa Giê-xu và “Đức Chúa Trời” theo lối gọi quen thuộc trong tiếng Việt Cơ Đốc. Tách nguyên câu Hy Lạp thành hai câu tiếng Việt để tránh chuỗi phân từ nặng nề, nhưng vẫn giữ nguyên quan hệ thời gian, bằng chứng và nội dung giảng dạy.
