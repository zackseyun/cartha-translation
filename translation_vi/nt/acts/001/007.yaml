  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἶπεν ⸀δὲ πρὸς αὐτούς· Οὐχ ὑμῶν ἐστιν γνῶναι χρόνους ἢ καιροὺς οὓς ὁ πατὴρ ἔθετο ἐν τῇ ἰδίᾳ ἐξουσίᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/007.yaml
  text: But he said to them[b][a], “It is not for you to know times or seasons that the Father has set by his own authority.”
translation:
  language: vi
  text: 'Nhưng Ngài nói với họ: “Anh em không có quyền biết các thời kỳ hay thời điểm[a] mà Cha đã ấn định theo thẩm quyền riêng của Ngài.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch là “các khoảng thời gian hay những thời điểm đã định.” Tiếng Hy Lạp dùng hai từ gần nghĩa: χρόνοι thường nhấn mạnh các khoảng thời gian, còn καιροί có thể chỉ những thời điểm thích hợp hoặc được ấn định.'
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “trong thẩm quyền riêng của Ngài.” Cụm từ Hy Lạp theo sát từng chữ là “trong thẩm quyền riêng,” nói đến quyền định đoạt mà Cha dành cho chính Ngài.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Nhưng
  rationale: Đánh dấu sự chuyển ý có sắc thái tương phản nhẹ từ câu hỏi của các môn đồ sang lời điều chỉnh của Chúa Giê-xu.
- source_word: Οὐχ ὑμῶν ἐστιν γνῶναι
  choice: Các con không có quyền biết
  rationale: Diễn đạt tự nhiên thành ngữ Hy Lạp rằng sự hiểu biết này không thuộc phạm vi hay đặc quyền của người nghe; tránh biến câu thành một lời cấm đơn thuần.
- source_word: χρόνους
  choice: các thời kỳ
  rationale: Chỉ những khoảng thời gian có độ dài hoặc tiến trình, đồng thời tạo sự phân biệt vừa phải với καιρούς.
- source_word: καιρούς
  choice: thời điểm
  rationale: Chỉ những thời điểm thích hợp, quyết định hoặc được ấn định; cách dịch không áp đặt một hệ thống kỹ thuật cứng nhắc lên cặp từ.
- source_word: ὁ πατὴρ
  choice: Cha
  rationale: Giữ đúng danh xưng trong nguyên văn, không thêm đại từ sở hữu “của Ta”; viết hoa để thể hiện đây là danh xưng chỉ Đức Chúa Trời.
- source_word: ἔθετο
  choice: đã ấn định
  rationale: Thể hiện nghĩa đặt ra, thiết lập hoặc chỉ định của τίθημι trong ngữ cảnh nói về các thời kỳ và thời điểm.
- source_word: ἐν τῇ ἰδίᾳ ἐξουσίᾳ
  choice: theo thẩm quyền riêng của Ngài
  rationale: Truyền đạt tự nhiên rằng việc ấn định thuộc đặc quyền của Cha, đồng thời giữ sắc thái “riêng” của ἰδίᾳ và nghĩa thẩm quyền/quyền định đoạt của ἐξουσία.
theological_decisions:
- issue: Cách thể hiện cặp χρόνους / καιρούς
  choice: các thời kỳ hay thời điểm
  alternative: các khoảng thời gian hay những thời điểm đã định
  rationale: Giữ hai khái niệm thời gian có liên hệ nhưng khác nhau mà không xác lập một sự phân biệt thần học quá cứng nhắc hoặc suy đoán vượt quá nguyên văn.
- issue: Phạm vi hiểu biết của các môn đồ
  choice: không có quyền biết
  alternative: việc biết ... không thuộc về các con
  rationale: Giữ sức nặng của thành ngữ Hy Lạp về điều không thuộc phần hay đặc quyền của họ, thay vì diễn giải thành sự bất lực nhận thức hoặc một lệnh cấm tuyệt đối.
- issue: Thẩm quyền của Cha
  choice: theo thẩm quyền riêng của Ngài
  alternative: trong thẩm quyền riêng của Ngài
  rationale: Nêu rõ quyền định đoạt của Cha mà không nhập thêm một công thức tín lý ngoài câu; cách dịch chính tự nhiên trong tiếng Việt, còn cách sát cấu trúc ἐν được ghi ở chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Ngài” dùng cho Chúa Giê-xu và cho Cha theo quy ước tôn kính phổ biến; “các con” phản ánh lời Chúa Giê-xu nói trực tiếp với các môn đồ, nhưng không thêm danh xưng không có trong nguyên văn. Câu giữ sự căng thẳng giữa điều các môn đồ không có đặc quyền biết và quyền định đoạt riêng của Cha.
