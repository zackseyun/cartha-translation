revisions:
- from: 'Nhưng Ngài nói với họ: “Các con không có quyền biết các thời kỳ hay thời điểm[a] mà Cha đã ấn định theo thẩm quyền riêng của Ngài.[b]”'
  to: 'Nhưng Ngài nói với họ: “Anh em không có quyền biết các thời kỳ hay thời điểm[a] mà Cha đã ấn định theo thẩm quyền riêng của Ngài.[b]”'
  rationale: Chỉ điều chỉnh đại từ xưng hô từ “các con” thành “anh em.” Sửa đổi này loại bỏ sắc thái cha-con không được biểu thị trong tiếng Hy Lạp, trong khi vẫn giữ lời nói trực tiếp số nhiều với các môn đồ, cùng toàn bộ nghĩa và hệ thống chú thích của bản dịch.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T08:27:15Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch giữ đúng cấu trúc và ý chính của nguyên văn: lời đáp chuyển ý nhẹ, sự biết không thuộc phạm vi của người nghe, cặp χρόνοι/καιροί, và thẩm quyền riêng của Cha. Tuy nhiên, “các con” thêm một quan hệ xưng hô cha-con không có trong câu Hy Lạp; đại từ số nhiều trung tính hơn sẽ trung thành hơn với nguyên văn.'
  naturalness: “Các thời kỳ hay thời điểm” và “đã ấn định theo thẩm quyền riêng của Ngài” đều sáng rõ, trang trọng, và tự nhiên trong tiếng Việt hiện đại. Thay “các con” bằng “anh em” tránh sắc thái gia trưởng không cần thiết, đồng thời vẫn phù hợp văn phong Kinh Thánh Việt ngữ hiện đại.
  terminology: “Cha,” “thời kỳ,” “thời điểm,” “ấn định,” và “thẩm quyền riêng” chuyển tải tốt các thuật ngữ trọng yếu. Chú thích phân biệt χρόνοι với καιροί cách thận trọng, không gán cho chúng một hệ thống kỹ thuật cứng nhắc.
  issues:
