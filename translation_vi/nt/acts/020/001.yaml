id: ACT.20.1
reference: Acts 20:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Μετὰ δὲ τὸ παύσασθαι τὸν θόρυβον ⸀μεταπεμψάμενος ὁ Παῦλος τοὺς μαθητὰς καὶ ⸀παρακαλέσας, ἀσπασάμενος ἐξῆλθεν ⸀πορεύεσθαι ⸀εἰς Μακεδονίαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/001.yaml
  text: After the uproar had ceased[a], Paul sent for the disciples, and after encouraging them and saying farewell, he departed to go to Macedonia.
translation:
  language: vi
  text: Sau khi cuộc náo loạn lắng xuống, Phao-lô cho gọi các môn đồ đến. Ông khích lệ họ, chào từ biệt[a], rồi lên đường đi Ma-xê-đô-ni-a.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “chào họ”; từ Hy Lạp có thể chỉ việc chào hỏi hoặc, trong bối cảnh ra đi, chào từ biệt.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ τὸ παύσασθαι τὸν θόρυβον
  choice: Sau khi cuộc náo loạn lắng xuống
  rationale: Cấu trúc μετά với động từ nguyên mẫu có mạo từ diễn tả thời điểm sau khi biến cố trước chấm dứt; “cuộc náo loạn” thể hiện đúng sắc thái của θόρυβος trong bối cảnh cuộc bạo động tại Ê-phê-sô.
- source_word: μεταπεμψάμενος
  choice: cho gọi ... đến
  rationale: Dạng trung động diễn tả việc sai người gọi các môn đồ đến với Phao-lô; cách nói này tự nhiên và rõ nghĩa trong tiếng Việt.
- source_word: τοὺς μαθητὰς
  choice: các môn đồ
  rationale: Giữ thuật ngữ quen dùng của sách Công Vụ để chỉ những người theo Chúa Giê-su, thay vì mở rộng thành “các tín hữu”.
- source_word: παρακαλέσας
  choice: khích lệ họ
  rationale: παρακαλέω có thể bao hàm khuyên nhủ, an ủi và nâng đỡ; “khích lệ” giữ được sắc thái rộng trong bối cảnh sau biến động và trước lúc chia tay.
- source_word: ἀσπασάμενος
  choice: chào từ biệt
  rationale: Động từ thường có nghĩa “chào hỏi”, nhưng trong bối cảnh ra đi có thể chỉ việc chào để từ biệt. Bản dịch thể hiện lực ngữ cảnh nhưng ghi chú phương án sát nghĩa từ vựng.
- source_word: ἐξῆλθεν πορεύεσθαι εἰς Μακεδονίαν
  choice: rồi lên đường đi Ma-xê-đô-ni-a
  rationale: Kết hợp động từ ra đi với động từ nguyên mẫu chỉ mục đích thành một cách diễn đạt hành trình tự nhiên trong tiếng Việt, đồng thời giữ rõ điểm đến.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Phao-lô”, “môn đồ” và “Ma-xê-đô-ni-a” theo lối phiên âm Kinh Thánh tiếng Việt quen thuộc; chia câu để diễn đạt tự nhiên mà vẫn giữ trình tự các hành động trong nguyên văn.
