  text: ὡς οὐδὲν ὑπεστειλάμην τῶν συμφερόντων τοῦ μὴ ἀναγγεῖλαι ὑμῖν καὶ διδάξαι ὑμᾶς δημοσίᾳ καὶ κατ’ οἴκους,
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/020.yaml
  text: how I did not shrink back from declaring to you anything that was profitable and teaching you publicly and from house to house,[a]
translation:
  language: vi
  text: thế nào tôi đã không hề né tránh việc công bố cho anh em bất cứ điều gì có ích và dạy dỗ anh em trước công chúng cũng như từ nhà này sang nhà khác.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “tôi đã không giữ lại bất cứ điều gì có ích.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς
  choice: thể nào
  rationale: Nối với lời hồi tưởng ở văn cảnh trước và giới thiệu cách Phao-lô đã thi hành chức vụ.
- source_word: οὐδὲν ὑπεστειλάμην
  choice: tôi đã không ngần ngại
  rationale: Động từ trung thái có thể chỉ việc chùn bước hoặc tự giữ mình lại. “Không ngần ngại” diễn đạt tự nhiên việc Phao-lô không né tránh hành động, còn sắc thái “không giữ lại” được ghi ở chú thích.
- source_word: τῶν συμφερόντων
  choice: bất cứ điều gì có ích
  rationale: Giữ nghĩa rộng là điều hữu ích hoặc có lợi, không thu hẹp minh nhiên thành lợi ích thuộc linh dù văn cảnh mang tính mục vụ.
- source_word: ἀναγγεῖλαι
  choice: công bố
  rationale: Diễn đạt hành động báo cho biết hoặc tuyên bố trong bối cảnh chức vụ, đồng thời phân biệt với việc dạy dỗ theo sau.
- source_word: διδάξαι
  choice: dạy dỗ
  rationale: Cách diễn đạt thông dụng, trang trọng vừa phải của διδάσκω; được phối hợp với “công bố” dưới cùng động từ chi phối.
- source_word: δημοσίᾳ
  choice: giữa công chúng
  rationale: Chỉ hoạt động diễn ra công khai, trước công chúng.
- source_word: κατ’ οἴκους
  choice: từ nhà này sang nhà khác
  rationale: Bảo tồn sắc thái phân phối của κατά với danh từ số nhiều, nhấn mạnh việc phục vụ tại từng nhà.
theological_decisions:
- issue: Phạm vi nghĩa của τῶν συμφερόντων
  choice: bất cứ điều gì có ích
  alternative: mọi điều có ích về mặt thuộc linh
  rationale: Văn cảnh cho thấy lợi ích mục vụ và thuộc linh, nhưng nguyên văn dùng một từ rộng hơn; bản dịch không đưa phần diễn giải thần học hẹp hơn vào chính văn.
- issue: Quan hệ giữa “công bố” và “dạy dỗ”
  choice: một hành động không chùn bước chi phối cả hai hoạt động
  alternative: coi việc không giữ lại chỉ trực tiếp gắn với “công bố”
  rationale: Hai động từ nguyên mẫu ἀναγγεῖλαι và διδάξαι cùng trình bày điều Phao-lô đã không né tránh làm; câu tiếng Việt phối hợp chúng song song mà không thêm một động từ chi phối thứ hai.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh em” theo lời Phao-lô nói với các trưởng lão Ê-phê-sô; dùng “từ nhà này sang nhà khác” để giữ sắc thái phân phối của nguyên văn.
