- from: thể nào tôi đã không ngần ngại công bố cho anh em bất cứ điều gì có ích, và dạy dỗ anh em giữa công chúng cũng như từ nhà này sang nhà khác.[a]
  to: thế nào tôi đã không hề né tránh việc công bố cho anh em bất cứ điều gì có ích và dạy dỗ anh em trước công chúng cũng như từ nhà này sang nhà khác.[a]
  rationale: Thay “thể nào” bằng “thế nào” cho tiếng Việt hiện đại tự nhiên hơn; thay “không ngần ngại” bằng “không hề né tránh” để phản ánh tốt hơn sắc thái của ὑποστέλλω trung thái. Giữ cấu trúc một động từ chi phối cả “công bố” và “dạy dỗ,” đồng thời đổi “giữa công chúng” thành “trước công chúng.” Chú thích được rút gọn để nêu lựa chọn từ vựng hợp lệ mà không thêm ý đối lập hoặc làm lệch phạm vi cú pháp.
