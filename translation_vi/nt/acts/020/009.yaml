  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸀καθεζόμενος δέ τις νεανίας ὀνόματι Εὔτυχος ἐπὶ τῆς θυρίδος, καταφερόμενος ὕπνῳ βαθεῖ διαλεγομένου τοῦ Παύλου ἐπὶ πλεῖον, κατενεχθεὶς ἀπὸ τοῦ ὕπνου ἔπεσεν ἀπὸ τοῦ τριστέγου κάτω καὶ ἤρθη νεκρός.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/009.yaml
  text: And a certain young man named Eutychus[a], sitting in the window, was sinking into a deep sleep while Paul was speaking at length; and being overcome by sleep, he fell down from the third story and was picked up dead.
translation:
  language: vi
  text: Có một thanh niên tên là Ê-ty-cơ đang ngồi nơi cửa sổ. Trong khi Phao-lô nói chuyện lâu, anh dần chìm vào giấc ngủ say. Khi bị cơn buồn ngủ lấn át, anh ngã từ tầng ba xuống và được nhấc lên trong tình trạng đã chết.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “được đem đi trong tình trạng đã chết.” Động từ Hy Lạp có thể mang nghĩa “nhấc lên” hoặc “đem đi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθεζόμενος δέ τις νεανίας
  choice: Có một thanh niên... đang ngồi
  rationale: Diễn đạt tự nhiên phần dẫn nhập và phân từ hiện tại chỉ tư thế đang tiếp diễn; τις được thể hiện bằng “một” mà không dùng lối cổ “một người nọ”.
- source_word: ὀνόματι Εὔτυχος
  choice: tên là Ê-ty-cơ
  rationale: Cách nói tiếng Việt tự nhiên cho cấu trúc ὀνόματι với tên riêng; tên được phiên âm theo âm Hy Lạp.
- source_word: ἐπὶ τῆς θυρίδος
  choice: bên ô cửa sổ
  rationale: θυρίς là cửa sổ hoặc ô cửa; “bên ô cửa sổ” cho thấy vị trí nguy hiểm mà không thêm chi tiết “bậu cửa” vốn không được nêu rõ.
- source_word: καταφερόμενος ὕπνῳ βαθεῖ
  choice: dần chìm vào giấc ngủ say
  rationale: Giữ sắc thái tiến triển của phân từ hiện tại và hình ảnh bị giấc ngủ kéo xuống.
- source_word: διαλεγομένου τοῦ Παύλου ἐπὶ πλεῖον
  choice: Trong khi Phao-lô nói chuyện khá lâu
  rationale: διαλέγομαι trong ngữ cảnh này chỉ việc nói hoặc trình bày; ἐπὶ πλεῖον diễn tả việc kéo dài. “Nói chuyện khá lâu” tự nhiên và không nhất thiết hàm ý tranh luận.
- source_word: κατενεχθεὶς ἀπὸ τοῦ ὕπνου
  choice: Khi bị cơn buồn ngủ lấn át
  rationale: Phân từ aorist thụ động đánh dấu lúc cơn buồn ngủ hoàn toàn chế ngự anh, tiếp nối tiến trình vừa mô tả.
- source_word: ἔπεσεν ἀπὸ τοῦ τριστέγου κάτω
  choice: anh ngã từ tầng ba xuống
  rationale: Truyền đạt rõ τρίστεγον là tầng ba và κάτω là hướng rơi xuống, không tự ý thêm “xuống đất”.
- source_word: ἤρθη νεκρός
  choice: được đỡ lên trong tình trạng đã chết
  rationale: αἴρω thụ động có thể là nhấc hoặc đưa lên; cách dịch này phù hợp cảnh người ta nhấc anh lên sau cú ngã, còn νεκρός được giữ theo nghĩa trực tiếp là đã chết.
theological_decisions:
- issue: Có nên làm nhẹ nghĩa νεκρός thành “tưởng như đã chết” hay “dường như đã chết” hay không
  choice: đã chết
  alternative: tưởng như đã chết; dường như đã chết
  rationale: Bản Hy Lạp khẳng định νεκρός trực tiếp, không có dấu hiệu chỉ sự phỏng đoán. Bản dịch giữ nguyên sức nặng của lời thuật và không giải quyết trước mối căng thẳng với diễn biến tiếp theo.
- issue: Phạm vi nghĩa của ἤρθη
  choice: được đỡ lên
  alternative: được nhấc lên; được đưa đi
  rationale: Động từ có thể chỉ việc nhấc lên hoặc đưa đi. Ngữ cảnh ngay sau cú ngã ủng hộ việc người ta đỡ hoặc nhấc anh lên, nhưng chú thích giữ lại khả năng dịch rộng hơn.
translation_notes:
  register: 'Văn phong hiện đại, trang trọng và dễ hiểu. Câu Hy Lạp dài được tách thành ba câu để tiếng Việt sáng rõ nhưng vẫn giữ trình tự: vị trí của Ê-ty-cơ, quá trình ngủ thiếp đi, rồi cú ngã và tình trạng đã chết. Dùng “ô cửa sổ” để gợi một cửa mở trong kiến trúc cổ mà không thêm mô tả ngoài bản nguồn.'
