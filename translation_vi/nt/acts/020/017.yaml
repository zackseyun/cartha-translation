  text: Ἀπὸ δὲ τῆς Μιλήτου πέμψας εἰς Ἔφεσον μετεκαλέσατο τοὺς πρεσβυτέρους τῆς ἐκκλησίας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/017.yaml
  text: From Miletus he sent to Ephesus and called for the elders of the church[a].
translation:
  language: vi
  text: Từ Mi-lê, ông sai người đến Ê-phê-sô, mời các trưởng lão của hội thánh đến[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “sai người mời các trưởng lão của hội thánh đến.” Tiếng Hy Lạp kết hợp ý “sai đến Ê-phê-sô” với “gọi đến”, cho thấy ông phái người hoặc gửi lời yêu cầu họ đến gặp mình.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπὸ δὲ τῆς Μιλήτου
  choice: Từ Mi-lê
  rationale: ἀπό với sở hữu cách chỉ nơi xuất phát; δέ là liên từ nhẹ, không cần dịch thành một từ riêng trong câu tiếng Việt này.
- source_word: πέμψας εἰς Ἔφεσον
  choice: ông sai người đến Ê-phê-sô
  rationale: Phân từ bất định quá khứ diễn tả hành động xảy ra trước hoặc dẫn đến động từ chính. Thêm “người” theo hàm ý của ngữ cảnh để câu tiếng Việt tự nhiên, không xác định đó là một hay nhiều sứ giả.
- source_word: μετεκαλέσατο
  choice: mời ... đến
  rationale: Động từ trung cách mang nghĩa gọi hoặc sai người mời ai đến với mình. “Mời ... đến” tự nhiên và tránh sắc thái cưỡng chế quá mạnh của “triệu tập”.
- source_word: τοὺς πρεσβυτέρους
  choice: các trưởng lão
  rationale: Trong ngữ cảnh hội thánh thời các sứ đồ, từ này chỉ những người lãnh đạo được nhìn nhận, chứ không đơn thuần là những người cao tuổi.
- source_word: τῆς ἐκκλησίας
  choice: của hội thánh
  rationale: ἐκκλησία ở đây chỉ cộng đồng Cơ Đốc tại Ê-phê-sô; “hội thánh” là cách gọi tự nhiên, quen thuộc và không áp đặt cơ cấu giáo phái.
theological_decisions:
- issue: Ý nghĩa của πρεσβυτέρους trong bối cảnh hội thánh
  choice: những người lãnh đạo hội thánh được gọi là “các trưởng lão”
  alternative: những người cao tuổi trong cộng đồng; hoặc phiên âm chức danh “presbyter”
  rationale: Ngữ cảnh kể việc Phao-lô gọi những người lãnh đạo được nhìn nhận tại Ê-phê-sô. “Trưởng lão” giữ được ý nghĩa chức vụ trong bản văn mà không áp đặt mô hình quản trị hội thánh về sau.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng địa danh Việt hóa quen thuộc “Mi-lê”, “Ê-phê-sô”; đại từ “ông” nối tự nhiên với chủ thể Phao-lô trong ngữ cảnh. Cấu trúc câu làm rõ hành động sai người nhưng không xác định số người đưa tin.
