lexical_decisions:
- source_word: ἱκανὸς δὲ κλαυθμὸς ἐγένετο πάντων
  choice: Tất cả đều khóc rất nhiều
  rationale: Diễn đạt tự nhiên trong tiếng Việt, đồng thời giữ được ý mọi người đều khóc và mức độ đau buồn sâu sắc của ἱκανός.
- source_word: ἐπιπεσόντες ἐπὶ τὸν τράχηλον τοῦ Παύλου
  choice: ôm choàng lấy cổ Phao-lô
  rationale: Thành ngữ Hy Lạp mô tả hành động ôm thắm thiết; cách dịch này tự nhiên và vẫn giữ hình ảnh cụ thể về cổ của Phao-lô.
- source_word: κατεφίλουν αὐτόν
  choice: hôn ông mãi
  rationale: Thì chưa hoàn thành diễn tả hành động kéo dài hoặc lặp lại; “hôn ông mãi” truyền đạt sắc thái ấy một cách gọn và tự nhiên.
