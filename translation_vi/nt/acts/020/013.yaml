  text: Ἡμεῖς δὲ ⸀προελθόντες ⸀ἐπὶ τὸ πλοῖον ἀνήχθημεν ἐπὶ τὴν Ἆσσον, ἐκεῖθεν μέλλοντες ἀναλαμβάνειν τὸν Παῦλον, οὕτως γὰρ ⸂διατεταγμένος ἦν⸃ μέλλων αὐτὸς πεζεύειν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/013.yaml
  text: But we[a], having gone ahead to the ship, set sail for Assos, intending to take Paul on board from there, for so he had arranged[b], since he himself intended to go by land.
translation:
  language: vi
  text: Còn chúng tôi đi trước, lên tàu rồi nhổ neo đi A-sốt, để từ đó đón Phao-lô lên tàu. Ông đã sắp xếp như vậy,[a] vì chính ông định đi đường bộ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “việc ấy đã được sắp xếp như vậy.” Cụm từ Hy Lạp ở thể bị động, dù theo ngữ cảnh rất có thể nói đến sự sắp xếp hoặc chỉ dẫn trước đó của Phao-lô.'
    reason: alternative_reading
  - marker: b
    text: 'Cũng có thể dịch: “vì chính ông định đi bộ.” Động từ Hy Lạp πεζεύειν nói đến việc đi trên bộ, tương phản với chuyến đi bằng tàu của cả đoàn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προελθόντες
  choice: đi trước
  rationale: Phân từ bất định chỉ hành động xảy ra trước động từ chính, đồng thời cho thấy đoàn của người kể đi trước Phao-lô.
- source_word: ἐπὶ τὸ πλοῖον
  choice: đến tàu
  rationale: Với ý chuyển động, cụm từ có thể mang nghĩa đến hoặc lên tàu; cách dịch này tự nhiên trong tiếng Việt, còn việc lên tàu đã rõ qua động từ nhổ neo tiếp theo.
- source_word: ἀνήχθημεν
  choice: nhổ neo đi
  rationale: Trong ngữ cảnh hàng hải, ἀνάγω có nghĩa ra khơi hoặc khởi hành bằng tàu; “nhổ neo đi” là cách diễn đạt tự nhiên và rõ nghĩa.
- source_word: ἐπὶ τὴν Ἆσσον
  choice: đi A-sốt
  rationale: Chỉ đích đến của chuyến tàu. “A-sốt” là dạng phiên âm tiếng Việt dễ đọc của Ἆσσος.
- source_word: μέλλοντες ἀναλαμβάνειν
  choice: dự định đón ... lên tàu
  rationale: μέλλω diễn tả ý định, còn ἀναλαμβάνω trong hành trình này là tiếp nhận một người lên tàu.
- source_word: ἐκεῖθεν
  choice: tại đó
  rationale: Trong ngữ cảnh, đoàn sẽ đón Phao-lô từ địa điểm A-sốt; tiếng Việt tự nhiên dùng “tại đó”, dù hình thức Hy Lạp có sắc thái “từ đó”.
- source_word: διατεταγμένος ἦν
  choice: ông đã sắp xếp như vậy
  rationale: Cấu trúc ngoại vi hoàn thành quá khứ ở thể bị động. Theo mạch văn, Phao-lô là người liên quan trực tiếp đến sự sắp xếp; cách dịch chủ động tự nhiên hơn, còn khả năng bị động được giữ trong chú thích.
- source_word: μέλλων αὐτὸς πεζεύειν
  choice: vì chính ông định đi đường bộ
  rationale: πεζεύω đối lập việc đi trên bộ với chuyến đi bằng tàu; αὐτός mang tính nhấn mạnh nên dịch là “chính ông”. Quan hệ của phân từ với mệnh đề trước có tính giải thích/nguyên nhân.
- source_word: δὲ
  choice: Còn
  rationale: δέ đánh dấu sự chuyển ý và đối chiếu nhẹ giữa đoàn của người kể với Phao-lô; “Còn” thể hiện rõ sự tương phản ấy mà không quá mạnh.
