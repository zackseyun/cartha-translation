    rationale: ἐπὶ τὸ πλοῖον với chuyển động có nghĩa ‘lên tàu/ra tàu’; trong tiếng Việt, “lên tàu” rõ và tự nhiên hơn, không thay đổi nghĩa.
  - severity: low
    issue: “tại đó” làm yếu nghĩa ‘từ đó’
    rationale: ἐκεῖθεν có giá trị xuất phát. “để từ đó đón Phao-lô lên tàu” diễn đạt rõ rằng A-sốt là nơi đoàn đón ông.
