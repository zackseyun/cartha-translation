translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Còn” để giữ đối chiếu nhẹ; “nhổ neo đi” làm rõ ngữ cảnh hàng hải; các chú thích bảo tồn sắc thái bị động của διατεταγμένος ἦν và độ rộng nghĩa của πεζεύειν.
