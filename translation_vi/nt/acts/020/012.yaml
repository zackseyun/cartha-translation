  yaml_path: translation/nt/acts/020/012.yaml
  text: And they took the boy away alive[a], and were not a little comforted.
translation:
  language: vi
  text: Họ đưa cậu trai còn sống đi, và được an ủi rất nhiều[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “không ở mức vừa phải,” một lối nói giảm nhằm nhấn mạnh rằng họ được an ủi rất nhiều.'
    reason: Giải thích thành ngữ οὐ μετρίως chính xác hơn và giữ sắc thái nhấn mạnh của nguyên văn.
lexical_decisions:
- source_word: ἤγαγον
  choice: đưa ... đi
  rationale: Động từ ἄγω có thể mang nghĩa dẫn, đưa hoặc đem. Trong mạch văn này, “đưa ... đi” diễn đạt tự nhiên việc họ rời khỏi nơi ấy cùng Ê-ty-cơ mà không xác định thêm một đích đến vốn không có trong nguyên văn.
- source_word: παῖδα
  choice: cậu trai
  rationale: παῖς có thể chỉ đứa trẻ, cậu trai hoặc đầy tớ. Ở đây từ này chỉ Ê-ty-cơ, người trước đó được gọi là νεανίας (“thanh niên”); “cậu trai” giữ sắc thái tuổi trẻ mà không hàm ý thân phận đầy tớ.
- source_word: ζῶντα
  choice: còn sống
  rationale: Phân từ này mô tả tình trạng của cậu trai khi được đưa đi. “Còn sống” là cách diễn đạt rõ ràng, tự nhiên trong bối cảnh cậu vừa rơi xuống và được thấy là sống.
- source_word: παρεκλήθησαν
  choice: được an ủi
  rationale: παρακαλέω có thể mang nghĩa khích lệ, an ủi hoặc nâng đỡ. Sau nỗi kinh hoàng về cái chết tưởng chừng đã xảy ra, “được an ủi” phù hợp với sự nhẹ nhõm và nâng đỡ của những người chứng kiến.
- source_word: οὐ μετρίως
  choice: rất nhiều
  rationale: Cụm phủ định này là lối nói giảm theo nghĩa đen “không vừa phải,” nhưng có nghĩa nhấn mạnh là “rất nhiều.” Bản dịch dùng thành ngữ tiếng Việt tự nhiên và ghi nghĩa sát chữ trong chú thích.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc câu bám sát thứ tự của nguyên văn nhưng dùng “rất nhiều” thay cho cách dịch sát chữ khó tự nhiên trong tiếng Việt.
