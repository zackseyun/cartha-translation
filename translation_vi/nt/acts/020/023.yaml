source:
  edition: SBLGNT
  text: πλὴν ὅτι τὸ πνεῦμα τὸ ἅγιον κατὰ πόλιν διαμαρτύρεταί ⸀μοι λέγον ὅτι δεσμὰ ⸂καὶ θλίψεις με⸃ μένουσιν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/023.yaml
  text: except that the Holy Spirit testifies to me in city after city[c][b][a], saying that chains and afflictions await me.
translation:
  language: vi
  text: Chỉ có điều, Đức Thánh Linh làm chứng với tôi từ thành này sang thành khác[a], nói rằng xiềng xích[b] và hoạn nạn đang chờ đợi tôi.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “ở thành này rồi thành khác” hoặc “trong mỗi thành.” Thành ngữ Hy Lạp có ý phân phối, nói đến lời chứng được lặp lại tại các thành nối tiếp nhau.'
    reason: lexical_alternative
  - marker: b
    text: “Xiềng xích” giữ hình ảnh cụ thể trong tiếng Hy Lạp; cũng có thể dịch là “sự trói buộc.”
    reason: lexical_alternative
  - marker: c
    text: Một số thủ bản có khác biệt nhỏ về vị trí hoặc sự hiện diện của từ “tôi” trong cụm nói về hoạn nạn, nhưng ý chung vẫn là xiềng xích và hoạn nạn đang chờ đợi Phao-lô.
    reason: textual_variant
lexical_decisions:
- source_word: πλὴν ὅτι
  choice: chỉ có điều
  rationale: Diễn tả sự ngoại trừ hoặc giới hạn đối với lời ở câu trước, đồng thời tự nhiên trong tiếng Việt hiện đại.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: Đức Thánh Linh
  rationale: Cách gọi trang trọng, thông dụng trong tiếng Việt Cơ Đốc, chỉ Thánh Linh với tư cách chủ thể hành động.
- source_word: κατὰ πόλιν
  choice: hết thành này đến thành khác
  rationale: Giữ sắc thái phân phối và lặp lại theo từng địa điểm, không khẳng định quá mức rằng tuyệt đối mọi thành đều được nói đến.
- source_word: διαμαρτύρεταί μοι
  choice: làm chứng với tôi
  rationale: Giữ ý làm chứng hoặc xác nhận cách nghiêm túc; tránh diễn giải hẹp thành chỉ cảnh báo.
- source_word: λέγον
  choice: nói rằng
  rationale: Dẫn trực tiếp nội dung lời chứng của Đức Thánh Linh một cách rõ ràng và tự nhiên.
- source_word: δεσμὰ
  choice: xiềng xích
  rationale: Giữ hình ảnh cụ thể của sự trói buộc thay vì chuyển ngay sang nghĩa khái quát là tù đày.
- source_word: θλίψεις
  choice: hoạn nạn
  rationale: Diễn đạt sức ép, khổ đau và gian truân với mức độ nghiêm trọng phù hợp ngữ cảnh.
- source_word: με
  choice: tôi
  rationale: Đại từ chỉ Phao-lô là người mà xiềng xích và hoạn nạn đang chờ đợi.
- source_word: μένουσιν
  choice: đang chờ đợi
  rationale: Diễn đạt tự nhiên điều đang dành sẵn ở phía trước cho Phao-lô.
theological_decisions:
- issue: Tư cách hành động của Đức Thánh Linh
  choice: Trình bày Đức Thánh Linh là chủ thể làm chứng và nói
  alternative: Hiểu như một ảnh hưởng tâm linh phi ngôi vị
  rationale: Ngữ pháp của câu quy hành động làm chứng và nói cho Đức Thánh Linh; bản dịch giữ nguyên cách trình bày ấy mà không mở rộng thêm ngoài câu.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Cấu trúc nối tiếp câu trước được giữ bằng “chỉ có điều”; ngôn ngữ tránh lối cổ không cần thiết và bảo tồn hình ảnh “xiềng xích” cùng sắc thái lặp lại của κατὰ πόλιν.
