language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καταβὰς δὲ ὁ Παῦλος ἐπέπεσεν αὐτῷ καὶ συμπεριλαβὼν εἶπεν· Μὴ θορυβεῖσθε, ἡ γὰρ ψυχὴ αὐτοῦ ἐν αὐτῷ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/010.yaml
  text: But Paul went down and fell upon him[a], and embracing him said, “Do not be alarmed[b], for his life is in him.”
translation:
  language: vi
  text: 'Nhưng Phao-lô đi xuống, ngả mình xuống trên người ấy[a], rồi ôm lấy người ấy và nói: “Đừng hoảng hốt, vì sự sống của người ấy ở trong người ấy[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Theo sát nghĩa: “ngã trên người ấy.” Cụm từ này mô tả Phao-lô ngả hoặc áp mình trên người ấy và có thể gợi lại những trình thuật về các nhà tiên tri trong Cựu Ước làm như vậy với người chết.'
    reason: lexical_alternative
  - marker: b
    text: Hoặc “linh hồn của người ấy”. Từ Hy Lạp psychē có thể nghĩa là “sự sống”, “bản thân”, hoặc “linh hồn”; trong ngữ cảnh đang xét người ấy chết hay sống, “sự sống” phù hợp hơn.
    reason: lexical_alternative
lexical_decisions:
- source_word: καταβὰς
  choice: đi xuống
  rationale: Giữ rõ hướng chuyển động từ phòng trên xuống, đồng thời diễn đạt tự nhiên trong tiếng Việt.
- source_word: δὲ
  choice: Nhưng
  rationale: Thể hiện bước chuyển nhẹ có sắc thái tương phản giữa việc cậu thanh niên ngã xuống và hành động đáp ứng của Phao-lô.
- source_word: ἐπέπεσεν αὐτῷ
  choice: phủ mình trên cậu
  rationale: Diễn tả hành động áp thân mình trên người cậu, tự nhiên hơn cách dịch máy móc “ngã trên cậu”, đồng thời giữ được khả năng gợi lại các trình thuật phục hồi sự sống trong Cựu Ước.
- source_word: συμπεριλαβὼν
  choice: ôm lấy cậu
  rationale: Truyền đạt động tác vòng tay ôm trọn, vừa rõ ràng vừa tự nhiên trong tiếng Việt hiện đại.
- source_word: Μὴ θορυβεῖσθε
  choice: Đừng hoảng hốt
  rationale: Trong bối cảnh đám đông xao động sau cú ngã, cách nói này diễn đạt được sự bấn loạn và náo động mà động từ có thể chỉ đến.
- source_word: ἡ γὰρ ψυχὴ αὐτοῦ
  choice: vì sự sống của cậu
  rationale: ψυχή có thể chỉ sự sống, bản thân hay linh hồn; ở đây vấn đề trước mắt là cậu còn sống hay đã chết, nên “sự sống” phù hợp nhất và không áp đặt một quan niệm nhân học chuyên biệt.
- source_word: ἐν αὐτῷ ἐστιν
  choice: vẫn ở trong cậu
  rationale: Giữ hình thức phát biểu của tiếng Hy Lạp thay vì diễn giải thành “cậu còn sống” hay “sự sống đã trở lại”; từ “vẫn” giúp câu tiếng Việt tự nhiên nhưng không xác quyết rõ sự sống chưa từng mất hay vừa được phục hồi.
theological_decisions:
- issue: Ý nghĩa của ψυχή trong bối cảnh sống/chết
  choice: Dịch là “sự sống”.
  alternative: “linh hồn”
  rationale: Ngữ cảnh tập trung vào tình trạng thể chất của cậu thanh niên sau cú ngã. “Sự sống” phản ánh đúng phạm vi nghĩa của ψυχή tại đây và tránh biến câu này thành một tuyên bố giáo lý về linh hồn.
- issue: Lời Phao-lô có nghĩa cậu chưa từng chết hay đã được phục hồi sự sống
  choice: 'Giữ câu chính ở dạng tương đối trung tính: “sự sống của cậu vẫn ở trong cậu”.'
  alternative: Các cách diễn giải như “cậu vẫn còn sống” hoặc “sự sống đã trở lại với cậu”.
  rationale: Tiếng Hy Lạp khẳng định sự sống ở trong cậu nhưng không nói rõ cậu chưa thực sự chết hay đã được phục hồi. Chú thích nêu cả hai khả năng mà không giải quyết thay cho bản văn.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. Dùng “cậu” cho người thanh niên được nhắc đến trong ngữ cảnh, tránh đại từ quá suồng sã. Cấu trúc câu giữ chuỗi hành động của nguyên văn nhưng được nối tự nhiên bằng “rồi”.
