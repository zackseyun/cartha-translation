  to: 'Nhưng Phao-lô đi xuống, ngả mình xuống trên người ấy[a], rồi ôm lấy người ấy và nói: “Đừng hoảng hốt, vì sự sống của người ấy ở trong người ấy[b].”'
  rationale: Bỏ “vẫn” để không thêm một khẳng định thời tính mà nguyên văn không có, và thay động từ mô tả cử chỉ của Phao-lô bằng cách diễn đạt rõ hơn trong tiếng Việt. Thêm chú thích được neo tại “sự sống” để phản ánh trực tiếp phạm vi nghĩa của ψυχή, đồng thời giữ chú thích riêng về hai cách hiểu khả dĩ của lời Phao-lô.
