id: ACT.20.35
reference: Acts 20:35
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: πάντα ὑπέδειξα ὑμῖν ὅτι οὕτως κοπιῶντας δεῖ ἀντιλαμβάνεσθαι τῶν ἀσθενούντων, μνημονεύειν τε τῶν λόγων τοῦ κυρίου Ἰησοῦ ὅτι αὐτὸς εἶπεν Μακάριόν ἐστιν μᾶλλον διδόναι ἢ λαμβάνειν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/035.yaml
  text: In everything I showed you that by laboring in this way it is necessary to help the weak[a], and to remember the words of the Lord Jesus, that he himself said, ‘It is more blessed to give than to receive.’
translation:
  language: vi
  text: 'Trong mọi việc, tôi đã chỉ cho anh em thấy rằng phải chịu khó làm việc như thế để giúp đỡ những người yếu đuối[a], và phải nhớ những lời của Chúa Giê-su, rằng chính Ngài đã nói: ‘Ban cho thì có phước hơn nhận lãnh.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “nâng đỡ những người yếu đuối.” Động từ Hy Lạp có thể hàm ý sự trợ giúp bền bỉ, chứ không chỉ giúp trong chốc lát.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα
  choice: Trong mọi sự
  rationale: Hiểu theo nghĩa trạng từ đi với ὑπέδειξα, diễn tả tính bao quát trong sự chỉ dạy và nêu gương của Phao-lô.
- source_word: ὑπέδειξα
  choice: tôi đã chỉ cho anh em thấy
  rationale: Diễn đạt tự nhiên ý ‘chỉ ra, chứng minh bằng gương thực tế’, không buộc phải thêm rõ ‘nêu gương’.
- source_word: οὕτως κοπιῶντας
  choice: chịu khó làm việc như thế
  rationale: Giữ ý lao nhọc, làm việc vất vả của κοπιάω và sự quy chiếu về cách Phao-lô đã làm của οὕτως.
- source_word: δεῖ
  choice: phải
  rationale: Truyền đạt trực tiếp sức nặng của sự cần thiết và bổn phận.
- source_word: ἀντιλαμβάνεσθαι
  choice: giúp đỡ
  rationale: Trong ngữ cảnh, động từ chỉ việc trợ giúp hoặc nâng đỡ; ‘giúp đỡ’ rõ ràng và tự nhiên, còn sắc thái hỗ trợ bền bỉ được ghi ở chú thích.
- source_word: τῶν ἀσθενούντων
  choice: những người yếu đuối
  rationale: Giữ phạm vi rộng của từ Hy Lạp, không giới hạn vào bệnh tật, nghèo khó hay yếu đức tin.
- source_word: μνημονεύειν τε
  choice: và phải nhớ
  rationale: Giữ sự phối hợp với bổn phận trước đó; lặp ‘phải’ giúp câu tiếng Việt rõ và tự nhiên.
- source_word: τῶν λόγων τοῦ κυρίου Ἰησοῦ
  choice: lời của Chúa Giê-su
  rationale: ‘Lời’ có thể chỉ lời nói hoặc lời dạy được ghi nhớ; danh hiệu κύριος được dịch là ‘Chúa’.
- source_word: αὐτὸς εἶπεν
  choice: chính Ngài đã phán
  rationale: ‘Chính’ giữ tính nhấn mạnh của αὐτός; ‘phán’ phù hợp với văn phong Kinh Thánh trang trọng khi dẫn lời Chúa Giê-su.
- source_word: Μακάριόν ἐστιν μᾶλλον διδόναι ἢ λαμβάνειν
  choice: Ban cho thì có phước hơn nhận lãnh
  rationale: Cấu trúc Việt ngữ gọn, dễ nhớ, giữ phép so sánh ‘có phước hơn’ và sự đối lập giữa cho với nhận.
theological_decisions:
- issue: Phạm vi nghĩa của ‘những người yếu đuối’
  choice: Giữ cách gọi rộng là ‘những người yếu đuối’.
  alternative: người nghèo; người đau yếu; người yếu đức tin
  rationale: ἀσθενούντων không tự nó xác định loại yếu đuối nào. Ngữ cảnh lao động và ban cho hướng đến người dễ bị tổn thương, nhưng không đủ để thu hẹp nghĩa.
- issue: Quan hệ giữa lao động và giúp đỡ
  choice: Dịch ‘chịu khó làm việc như thế để giúp đỡ’.
  alternative: ‘khi lao nhọc như thế, phải nâng đỡ’
  rationale: Cách dịch chính làm rõ mục đích thực tiễn trong ngữ cảnh mà không biến lao động thành điều kiện để được phước.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng ‘anh em’ theo ngữ cảnh Phao-lô nói với các trưởng lão; dùng ‘Ngài’ cho Chúa Giê-su. Câu trích dẫn giữ nhịp ngắn, có tính châm ngôn.
