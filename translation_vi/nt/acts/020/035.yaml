revisions:
- from: 'Trong mọi sự, tôi đã chỉ cho anh em thấy rằng phải chịu khó làm việc như thế để giúp đỡ những người yếu đuối[a], và phải nhớ lời của Chúa Giê-su, vì chính Ngài đã phán: ‘Ban cho thì có phước hơn nhận lãnh.’'
  to: 'Trong mọi việc, tôi đã chỉ cho anh em thấy rằng phải chịu khó làm việc như thế để giúp đỡ những người yếu đuối[a], và phải nhớ những lời của Chúa Giê-su, rằng chính Ngài đã nói: ‘Ban cho thì có phước hơn nhận lãnh.’'
  rationale: Sửa nhẹ để phản ánh số nhiều của λόγων và chức năng nội dung của ὅτι, đồng thời làm câu văn tự nhiên hơn. Không thay đổi phạm vi mở của “những người yếu đuối”, tính bắt buộc của δεῖ, hay ý nghĩa câu trích dẫn.
  reviewer_model: gpt-5.6-terra
