language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ποιήσας τε μῆνας τρεῖς· γενομένης ⸂ἐπιβουλῆς αὐτῷ⸃ ὑπὸ τῶν Ἰουδαίων μέλλοντι ἀνάγεσθαι εἰς τὴν Συρίαν ἐγένετο ⸀γνώμης τοῦ ὑποστρέφειν διὰ Μακεδονίας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/003.yaml
  text: After spending three months there[a], when a plot was made against him by the Jews as he was about to sail for Syria[d][c][b], he decided to return through Macedonia.
translation:
  language: vi
  text: Sau khi ở đó ba tháng, khi ông sắp khởi hành bằng đường biển đến Sy-ri, người Do Thái đã lập một âm mưu chống lại ông; vì thế, ông quyết định trở về qua Ma-xê-đô-ni-a.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ποιήσας τε μῆνας τρεῖς
  choice: Sau khi ở đó ba tháng
  rationale: Động từ ποιέω đi với khoảng thời gian mang nghĩa trải qua hoặc lưu lại trong thời gian ấy. “Ở đó” được bổ sung tự nhiên theo ngữ cảnh Hy Lạp ở câu trước.
- source_word: γενομένης ἐπιβουλῆς αὐτῷ
  choice: lúc ... lập mưu hại ông
  rationale: Kết cấu sở hữu cách tuyệt đối diễn tả hoàn cảnh xảy ra đồng thời; ἐπιβουλή chỉ một âm mưu thù địch. Cách diễn đạt chủ động tự nhiên trong tiếng Việt và tác nhân được nêu ngay sau đó.
- source_word: ὑπὸ τῶν Ἰουδαίων
  choice: người Do Thái
  rationale: Giữ cách gọi rõ ràng của nguyên bản; chú thích giới hạn cách hiểu theo văn cảnh để tránh quy chụp toàn thể dân Do Thái.
- source_word: μέλλοντι ἀνάγεσθαι
  choice: trong khi ông sắp đi đường biển
  rationale: μέλλω diễn tả hành động sắp xảy ra, còn ἀνάγω ở thể trung trong văn cảnh hành trình có nghĩa rời bến hoặc đi bằng đường biển.
- source_word: εἰς τὴν Συρίαν
  choice: đến Sy-ri
  rationale: εἰς biểu thị đích đến; “đến” là cách nói tự nhiên với hành trình đường biển trong tiếng Việt.
- source_word: ἐγένετο γνώμης
  choice: ông quyết định
  rationale: Thành ngữ này diễn tả việc đi đến một chủ ý hoặc quyết định; bản dịch ngắn gọn và tự nhiên.
- source_word: τοῦ ὑποστρέφειν
  choice: trở về
  rationale: Động từ nguyên mẫu có mạo từ nêu nội dung quyết định; ὑποστρέφω mang nghĩa quay lại hoặc trở về.
- source_word: διὰ Μακεδονίας
  choice: qua Ma-xê-đô-ni-a
  rationale: διά với sở hữu cách chỉ tuyến đường đi qua một nơi.
theological_decisions:
- issue: Phạm vi chỉ định của cụm “người Do Thái” trong trình thuật xung đột
  choice: Giữ “người Do Thái” trong chính văn và chú thích rằng trong văn cảnh đây là nhóm lập mưu chống Phao-lô.
  alternative: một số người Do Thái; những người Do Thái chống đối
  rationale: Nguyên bản dùng mạo từ số nhiều τῶν Ἰουδαίων, nên không nên âm thầm thêm “một số” hoặc “chống đối” vào chính văn. Tuy nhiên, chú thích giúp độc giả không hiểu thành lời quy kết mọi người Do Thái.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Dùng các địa danh quen thuộc “Sy-ri” và “Ma-xê-đô-ni-a”; giữ sát trình tự ý của câu Hy Lạp nhưng điều chỉnh cấu trúc cho tự nhiên trong tiếng Việt.
