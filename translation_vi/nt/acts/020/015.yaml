source:
  edition: SBLGNT
  text: κἀκεῖθεν ἀποπλεύσαντες τῇ ἐπιούσῃ κατηντήσαμεν ⸀ἄντικρυς Χίου, τῇ δὲ ἑτέρᾳ παρεβάλομεν εἰς ⸀Σάμον, τῇ ⸀δὲ ἐχομένῃ ἤλθομεν εἰς Μίλητον·
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/015.yaml
  text: And from there[a], after setting sail, on the next day we came opposite Chios; on the following day we touched at Samos[b]; and on the day after that we came to Miletus.
translation:
  language: vi
  text: Từ đó, chúng tôi ra khơi; ngày hôm sau, chúng tôi đến phía đối diện đảo Chi-ô[a]. Ngày kế tiếp, chúng tôi ghé Sa-mô[b]; rồi ngày hôm sau nữa, chúng tôi đến Mi-lê.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “ngoài khơi đảo Chi-ô” hoặc “ngang với đảo Chi-ô.” Từ Hy Lạp chỉ vị trí đối diện hòn đảo, không nhất thiết có nghĩa là tàu đã cập đảo.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “chúng tôi đưa tàu vào Sa-mô.” Động từ Hy Lạp là một thuật ngữ hàng hải, chỉ việc đưa tàu vào sát bờ hoặc ghé lại.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀκεῖθεν
  choice: Từ đó
  rationale: Cụm từ là dạng rút gọn của καί + ἐκεῖθεν. Trong tiếng Việt, mạch nối tiếp đã được thể hiện tự nhiên bằng việc mở đầu câu “Từ đó” và liên từ ở mệnh đề kế tiếp, tránh cách diễn đạt nặng nề.
- source_word: ἀποπλεύσαντες
  choice: xuống thuyền ra khơi
  rationale: Phân từ bất định quá khứ chỉ hành động ra khơi xảy ra trước khi đoàn đến vị trí kế tiếp; cách dịch này tự nhiên và giữ rõ sắc thái hàng hải.
- source_word: τῇ ἐπιούσῃ
  choice: ngày hôm sau
  rationale: Diễn đạt tự nhiên trong tiếng Việt cho ngữ thời gian chỉ ngày kế tiếp.
- source_word: κατηντήσαμεν
  choice: đến
  rationale: Trong trình thuật hành trình, động từ mang nghĩa đến hoặc đạt tới một địa điểm; “đến” ngắn gọn và phù hợp với bổ ngữ chỉ vị trí tiếp theo.
- source_word: ἄντικρυς Χίου
  choice: vùng biển đối diện đảo Chi-ô
  rationale: ἄντικρυς chỉ vị trí đối diện hoặc ngoài khơi ngang với đảo, không nhất thiết nói rằng tàu cập đảo. Thêm “vùng biển” làm rõ ý hàng hải mà không khẳng định việc đổ bộ.
- source_word: τῇ δὲ ἑτέρᾳ
  choice: Ngày kế tiếp
  rationale: Thể hiện chặng thời gian kế tiếp trong chuỗi hành trình bằng cách nói hiện đại, tự nhiên.
- source_word: παρεβάλομεν εἰς Σάμον
  choice: chúng tôi ghé vào đảo Sa-mô
  rationale: Trong văn cảnh hàng hải, παραβάλλω chỉ việc đưa tàu vào sát bờ hoặc ghé lại; “ghé vào” giữ được ý một điểm dừng mà không nói quá rõ thời gian lưu lại.
- source_word: τῇ δὲ ἐχομένῃ
  choice: rồi ngày sau nữa
  rationale: Cụm này chỉ ngày liền sau trong chuỗi đã nêu; cách dịch phân biệt rõ với hai mốc ngày trước.
- source_word: ἤλθομεν εἰς Μίλητον
  choice: chúng tôi đến Mi-lê
  rationale: Dịch trực tiếp động từ chuyển động cùng đích đến, phù hợp văn phong tường thuật hành trình.
- source_word: Χίου / Σάμον / Μίλητον
  choice: Chi-ô / Sa-mô / Mi-lê
  rationale: Phiên âm địa danh Hy Lạp theo lối viết dễ đọc, quen thuộc trong tiếng Việt, đồng thời xác định Chi-ô và Sa-mô là các đảo theo địa lý của câu.
