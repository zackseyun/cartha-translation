translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Nhịp câu giữ rõ ba chặng theo ngày. Các thuật ngữ hàng hải được diễn đạt tự nhiên; chú thích bảo toàn sắc thái không chắc chắn về việc có cập đảo Chi-ô hay không.
