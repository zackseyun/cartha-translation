id: ACT.20.32
reference: Acts 20:32
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ τὰ νῦν παρατίθεμαι ⸀ὑμᾶς τῷ ⸀θεῷ καὶ τῷ λόγῳ τῆς χάριτος αὐτοῦ, τῷ δυναμένῳ ⸀οἰκοδομῆσαι καὶ δοῦναι ⸀τὴν κληρονομίαν ἐν τοῖς ἡγιασμένοις πᾶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/032.yaml
  text: And now I entrust you to God and to the word of his grace[a], which is able to build up and to give the inheritance among all those who have been sanctified.
translation:
  language: vi
  text: Và giờ đây, tôi phó thác anh em cho Đức Chúa Trời và cho lời ân điển của Ngài[a], là lời có khả năng gây dựng và ban cơ nghiệp giữa tất cả những người đã được thánh hóa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hoặc có thể hiểu cụm “có khả năng gây dựng và ban cơ nghiệp” chủ yếu chỉ về Đức Chúa Trời, thay vì “lời ân điển của Ngài.”
    reason: alternative_reading
lexical_decisions:
- source_word: παρατίθεμαι
  choice: tôi phó thác
  rationale: Động từ ở thể trung diễn tả việc đặt những người nghe dưới sự chăm sóc của Đức Chúa Trời; “phó thác” tự nhiên, trang trọng và giữ đúng ý nghĩa ấy.
- source_word: τῷ θεῷ
  choice: cho Đức Chúa Trời
  rationale: Dative chỉ Đấng mà Phao-lô phó thác những người nghe cho.
- source_word: τῷ λόγῳ τῆς χάριτος αὐτοῦ
  choice: cho lời ân điển của Ngài
  rationale: Giữ cấu trúc sở hữu của tiếng Hy Lạp và chiều sâu thần học của λόγος; trong ngữ cảnh, “lời” có thể chỉ lời được rao truyền.
- source_word: τῷ δυναμένῳ
  choice: là lời có khả năng
  rationale: Cách diễn đạt chính liên hệ phân từ với danh từ gần nhất là “lời ân điển”; sự nhập nhằng ngữ pháp thật sự được bảo tồn bằng chú thích về khả năng quy chiếu đến Đức Chúa Trời.
- source_word: οἰκοδομῆσαι
  choice: gây dựng
  rationale: Giữ hình ảnh ẩn dụ quen thuộc về sự trưởng thành và củng cố thuộc linh; không thêm túc từ vốn không được nêu rõ trong câu Hy Lạp.
- source_word: δοῦναι τὴν κληρονομίαν
  choice: ban cơ nghiệp
  rationale: “Ban” phù hợp với hành động ân huệ của Đức Chúa Trời, còn “cơ nghiệp” giữ âm hưởng Kinh Thánh của κληρονομία.
- source_word: ἐν τοῖς ἡγιασμένοις πᾶσιν
  choice: giữa tất cả những người đã được thánh hóa
  rationale: Dịch phân từ hoàn thành bị động theo lối động từ để giữ ý một hành động đã xảy ra với kết quả còn tiếp diễn; “giữa” phản ánh tự nhiên sắc thái tập thể của ἐν.
theological_decisions:
- issue: Đối tượng quy chiếu của τῷ δυναμένῳ
  choice: 'Trong chính văn, cụm từ quy chiếu đến “lời ân điển của Ngài”: “là lời có khả năng.”'
  alternative: 'Cụm từ có thể quy chiếu chủ yếu đến Đức Chúa Trời: “là Đấng có khả năng.”'
  rationale: Cú pháp cho phép cả hai cách hiểu. “Lời” là danh từ đứng gần nhất và Kinh Thánh có thể nói lời được rao truyền hành động cách hữu hiệu; tuy nhiên, Đức Chúa Trời cũng có thể là chủ thể ban cơ nghiệp. Chú thích bảo tồn sự nhập nhằng thay vì giải quyết dứt khoát.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “anh em” theo ngữ cảnh Phao-lô nói với các trưởng lão; “Đức Chúa Trời,” “ân điển,” “cơ nghiệp” và “thánh hóa” giữ thuật ngữ Kinh Thánh phổ thông mà không thêm nét riêng của hệ phái.
