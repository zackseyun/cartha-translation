  source_fidelity: Bản nháp truyền đạt đúng quyết định đã được đưa ra trước đó, hành trình bằng đường biển qua Ê-phê-sô, mục tiêu tránh bị mất thời gian tại tỉnh A-si-a, sự vội vã liên tục, điều kiện “nếu có thể,” và đích đến Giê-ru-sa-lem vào lễ Ngũ Tuần. Tuy nhiên, “lưu lại lâu” thêm nét “lâu” không được nêu rõ trong χρονοτριβῆσαι; động từ này ở đây nói khái quát về việc tốn/mất thời gian hay bị chậm trễ. “Mong có thể” cũng làm yếu quan hệ cú pháp với ἔσπευδεν và thêm sắc thái mong muốn không cần thiết.
