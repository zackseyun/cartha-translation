id: ACT.20.16
reference: Acts 20:16
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸀κεκρίκει γὰρ ὁ Παῦλος παραπλεῦσαι τὴν Ἔφεσον, ὅπως μὴ γένηται αὐτῷ χρονοτριβῆσαι ἐν τῇ Ἀσίᾳ, ἔσπευδεν γὰρ εἰ δυνατὸν ⸀εἴη αὐτῷ τὴν ἡμέραν τῆς πεντηκοστῆς γενέσθαι εἰς Ἱεροσόλυμα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/016.yaml
  text: For Paul had decided to sail past Ephesus[a], so that he might not have to spend time in Asia; for he was hurrying to be in Jerusalem, if possible[b], on the day of Pentecost.
translation:
  language: vi
  text: Vì Phao-lô đã quyết định đi thuyền qua Ê-phê-sô[a], để khỏi mất thời giờ ở tỉnh A-si-a; vì ông đang vội để, nếu có thể, có mặt ở Giê-ru-sa-lem vào ngày lễ Ngũ Tuần[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn có thể dịch sát là “đi thuyền ngang qua Ê-phê-sô”; ý là không dừng lại tại đó.
    reason: translation_clarification
  - marker: b
    text: 'Cũng có thể dịch: “đến Giê-ru-sa-lem vào ngày lễ Ngũ Tuần.” Cách diễn đạt Hy Lạp có thể nhấn mạnh việc có mặt tại đó vào ngày ấy hoặc việc đến nơi chính ngày ấy.'
    reason: alternative_reading
lexical_decisions:
- source_word: κεκρίκει
  choice: đã quyết định
  rationale: Thể quá khứ hoàn thành chỉ một quyết định đã được xác lập trước chặng hành trình đang thuật lại.
- source_word: παραπλεῦσαι τὴν Ἔφεσον
  choice: đi thuyền qua Ê-phê-sô mà không ghé vào
  rationale: Động từ chỉ việc đi ngang qua bằng đường biển; thêm “mà không ghé vào” làm rõ ý định tránh dừng tại Ê-phê-sô mà vẫn giữ hình ảnh hàng hải.
- source_word: ὅπως μὴ γένηται αὐτῷ χρονοτριβῆσαι
  choice: để khỏi phải lưu lại lâu
  rationale: Diễn đạt tự nhiên cấu trúc Hy Lạp nói về việc tránh mất hoặc tốn thời gian tại một nơi; “lưu lại lâu” phù hợp bối cảnh hành trình.
- source_word: ἐν τῇ Ἀσίᾳ
  choice: trong tỉnh A-si-a
  rationale: Ἀσία tại đây là tỉnh A-si-a của La Mã ở phía tây Tiểu Á, không phải châu Á hiện đại; đưa “tỉnh” vào chính văn giúp tránh hiểu lầm.
- source_word: ἔσπευδεν
  choice: đang vội
  rationale: Thì chưa hoàn thành diễn tả sự khẩn trương đang tiếp diễn trong hành trình.
- source_word: εἰ δυνατὸν εἴη αὐτῷ
  choice: mong có thể
  rationale: Giữ sắc thái dự liệu có điều kiện, đồng thời nối tự nhiên với động từ chỉ sự vội vã.
- source_word: τὴν ἡμέραν τῆς πεντηκοστῆς
  choice: vào ngày lễ Ngũ Tuần
  rationale: Dùng tên lễ quen thuộc trong tiếng Việt và thể hiện trực tiếp mốc thời gian được nhắm tới.
- source_word: γενέσθαι εἰς Ἱεροσόλυμα
  choice: ở Giê-ru-sa-lem
  rationale: Cụm từ có thể nhấn mạnh kết quả là hiện diện tại Giê-ru-sa-lem vào ngày ấy, dù cũng có thể được hiểu là đến nơi vào chính ngày ấy.
- source_word: Ἱεροσόλυμα
  choice: Giê-ru-sa-lem
  rationale: Dạng phiên âm Kinh Thánh quen thuộc trong tiếng Việt.
- source_word: πεντηκοστῆς
  choice: lễ Ngũ Tuần
  rationale: Tên gọi chuẩn, dễ nhận biết của kỳ lễ Do Thái này trong tiếng Việt.
theological_decisions:
- issue: Mốc thời gian của γενέσθαι εἰς Ἱεροσόλυμα
  choice: ở Giê-ru-sa-lem vào ngày lễ Ngũ Tuần
  alternative: đến Giê-ru-sa-lem vào ngày lễ Ngũ Tuần
  rationale: Cú pháp Hy Lạp có thể nhấn mạnh việc hiện diện tại đó vào ngày lễ hoặc việc đến nơi chính ngày ấy; chính văn chọn cách diễn đạt kết quả hiện diện và chú thích bảo lưu cách hiểu kia.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng các địa danh phiên âm quen thuộc; nêu rõ “tỉnh A-si-a” để độc giả không nhầm với châu Á ngày nay. Hai dấu chú thích [a], [b] đều xuất hiện trong chính văn.
