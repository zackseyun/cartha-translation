  yaml_path: translation/nt/acts/020/036.yaml
  text: And after saying these things, he knelt down with them all and prayed.
translation:
  language: vi
  text: Sau khi nói những điều ấy, ông quỳ xuống cùng với tất cả mọi người và cầu nguyện.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: Sau khi
  rationale: Liên từ Καὶ nối tiếp trình thuật; trong tiếng Việt, quan hệ nối tiếp được diễn đạt tự nhiên cùng với phân từ chỉ hành động xảy ra trước là “Sau khi”, không cần thêm “Và” ở đầu câu.
- source_word: ταῦτα εἰπὼν
  choice: nói những lời ấy
  rationale: Phân từ bất định quá khứ εἰπών chỉ hành động xảy ra trước động từ chính; “Sau khi nói những lời ấy” vừa tự nhiên vừa giữ đúng trình tự hành động.
- source_word: θεὶς τὰ γόνατα αὐτοῦ
  choice: ông quỳ xuống
  rationale: Cụm từ theo nghĩa đen là “đặt đầu gối mình”, một thành ngữ chỉ việc quỳ xuống. Cách dịch này rõ nghĩa mà không hàm ý ông ngã sụp xuống.
- source_word: σὺν πᾶσιν αὐτοῖς
  choice: cùng với tất cả họ
  rationale: σύν với cách ba biểu thị sự cùng tham gia; πᾶσιν nhấn mạnh toàn thể nhóm người hiện diện.
- source_word: προσηύξατο
  choice: cầu nguyện
  rationale: Đây là động từ thông dụng chỉ hành động cầu nguyện; tiếng Việt không cần thể hiện riêng hình thái trung động của động từ Hy Lạp.
