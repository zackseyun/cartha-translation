  text: ὡς δὲ παρεγένοντο πρὸς αὐτὸν εἶπεν αὐτοῖς· Ὑμεῖς ἐπίστασθε ἀπὸ πρώτης ἡμέρας ἀφ’ ἧς ἐπέβην εἰς τὴν Ἀσίαν πῶς μεθ’ ὑμῶν τὸν πάντα χρόνον ἐγενόμην,
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/018.yaml
  text: When they came to him[a], he said to them[b], “You yourselves know how I lived among you the whole time from the first day that I set foot in Asia,”
translation:
  language: vi
  text: 'Khi họ đến gặp ông, ông nói với họ: “Chính anh em biết từ ngày đầu tiên tôi đặt chân vào A-si-a[a], tôi đã sống giữa anh em suốt toàn bộ thời gian đó như thế nào[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A-si-a ở đây là tỉnh A-si-a thuộc đế quốc La Mã, nằm ở phía tây Tiểu Á, không phải châu Á ngày nay.
    reason: cultural_note
  - marker: b
    text: 'Cũng có thể dịch: “tôi đã ở với anh em suốt toàn bộ thời gian đó như thế nào.” Cách diễn đạt Hy Lạp có thể nhấn mạnh cách Phao-lô sống hoặc việc ông luôn hiện diện giữa họ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεγένοντο πρὸς αὐτόν
  choice: họ đến gặp ông
  rationale: Diễn đạt tự nhiên chuyển động đến chỗ Phao-lô và sắc thái gặp mặt của πρὸς αὐτόν.
- source_word: Ὑμεῖς ἐπίστασθε
  choice: Chính anh em biết
  rationale: “Chính” giữ sự nhấn mạnh của đại từ Ὑμεῖς được nêu tường minh; “biết” truyền đạt nhận thức trực tiếp, quen thuộc.
- source_word: ἀπὸ πρώτης ἡμέρας ἀφ’ ἧς ἐπέβην
  choice: từ ngày đầu tiên tôi đặt chân đến
  rationale: Giữ mốc khởi đầu và hình ảnh sinh động của ἐπέβην, đồng thời phù hợp cách nói tiếng Việt hiện đại.
- source_word: εἰς τὴν Ἀσίαν
  choice: đến A-si-a
  rationale: Giữ nguyên địa danh trong bản văn; chú thích làm rõ đây là tỉnh thuộc La Mã chứ không phải toàn châu Á hiện đại.
- source_word: μεθ’ ὑμῶν τὸν πάντα χρόνον ἐγενόμην
  choice: tôi đã sống giữa anh em suốt thời gian ấy như thế nào
  rationale: “Sống giữa anh em” diễn đạt tự nhiên cách sống trong cộng đồng, còn “suốt thời gian ấy” giữ ý kéo dài liên tục; chú thích bảo lưu khả năng hiểu là sự hiện diện liên tục.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh em” để xưng hô với nhóm trưởng lão và “ông” trong lời dẫn để tránh tự ý nêu tên không có trong câu Hy Lạp. Cấu trúc câu được điều chỉnh nhẹ theo tiếng Việt, nhưng vẫn giữ mốc thời gian, sự nhấn mạnh và tính mơ hồ của mệnh đề cuối.
