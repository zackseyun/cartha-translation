  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸀προσέχετε ἑαυτοῖς καὶ παντὶ τῷ ποιμνίῳ, ἐν ᾧ ὑμᾶς τὸ πνεῦμα τὸ ἅγιον ἔθετο ἐπισκόπους, ποιμαίνειν τὴν ἐκκλησίαν τοῦ ⸀θεοῦ, ἣν περιεποιήσατο διὰ τοῦ ⸂αἵματος τοῦ ἰδίου⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/028.yaml
  text: Pay careful attention to yourselves and to all the flock[a], in which the Holy Spirit has appointed you overseers, to shepherd the church of God[c][b], which he obtained through the blood of his own.
translation:
  language: vi
  text: Hãy chú ý đến chính mình và toàn thể bầy chiên, trong bầy ấy Đức Thánh Linh đã lập anh em làm những người giám sát, để chăn dắt hội thánh của Đức Chúa Trời[a], hội thánh Ngài đã thu nhận làm của riêng nhờ huyết của chính Con Ngài.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Một số thủ bản chép “hội thánh của Chúa” thay cho “hội thánh của Đức Chúa Trời.”
    reason: textual_variant
  - marker: b
    text: 'Cũng có thể dịch: “hội thánh Ngài đã thu nhận làm của riêng bằng chính huyết Ngài.” Sát chữ, phần cuối là “nhờ huyết của Đấng thuộc riêng về Ngài”; nhiều người hiểu là Con Ngài.'
    reason: alternative_reading
lexical_decisions:
- source_word: προσέχετε ἑαυτοῖς
  choice: Hãy cẩn thận giữ mình
  rationale: Mệnh lệnh hiện tại diễn tả sự chú tâm, cảnh giác liên tục; “giữ mình” tự nhiên trong tiếng Việt và giữ được sắc thái phản thân.
- source_word: παντὶ τῷ ποιμνίῳ
  choice: toàn thể bầy chiên
  rationale: Giữ nguyên hình ảnh mục vụ của ποίμνιον và diễn đạt παντί tự nhiên.
- source_word: ἐν ᾧ
  choice: là bầy mà
  rationale: Diễn đạt tự nhiên mối liên hệ với danh từ tập hợp “bầy chiên”, đồng thời cho thấy những người giám sát được đặt ngay trong bầy ấy.
- source_word: ἔθετο
  choice: đã lập
  rationale: Trong ngữ cảnh này, τίθημι chỉ việc đặt hoặc bổ nhiệm vào một trách nhiệm.
- source_word: ἐπισκόπους
  choice: những người giám sát
  rationale: Chuyển tải chức năng trông nom mà không áp đặt cơ cấu giáo hội phát triển về sau.
- source_word: ποιμαίνειν
  choice: để chăn dắt
  rationale: Giữ hình ảnh người chăn và bầy chiên, đồng thời diễn đạt mục đích của việc bổ nhiệm.
- source_word: ἐκκλησίαν
  choice: hội thánh
  rationale: Cách gọi đã được xác lập và dễ hiểu đối với cộng đồng tín hữu trong ngữ cảnh Cơ Đốc.
- source_word: τοῦ θεοῦ
  choice: của Đức Chúa Trời
  rationale: Theo bản văn SBLGNT; dị bản “của Chúa” được ghi ở chú thích.
- source_word: περιεποιήσατο
  choice: đã giành lấy
  rationale: Diễn đạt hành động thu nhận làm sở hữu cho mình của thể trung, nhưng không giới hạn nghĩa vào một giao dịch thương mại.
- source_word: διὰ τοῦ αἵματος
  choice: nhờ huyết
  rationale: διά với sở hữu cách chỉ phương tiện; “nhờ huyết” tự nhiên và giữ sức nặng hy sinh–cứu chuộc.
- source_word: τοῦ ἰδίου
  choice: của chính Con Ngài
  rationale: ἴδιος có thể được dùng như danh từ, nghĩa là “Đấng thuộc riêng về Ngài,” thường được hiểu là Con Ngài. Bổ sung “Con” giúp câu tiếng Việt hoàn chỉnh; cách hiểu truyền thống khác được bảo lưu trong chú thích.
theological_decisions:
- issue: Ý nghĩa và sở chỉ của τοῦ αἵματος τοῦ ἰδίου
  choice: “nhờ huyết của chính Con Ngài” trong chính văn
  alternative: '“bằng chính huyết Ngài”; sát chữ hơn: “nhờ huyết của Đấng thuộc riêng về Ngài”'
  rationale: Cụm Hy Lạp cô đọng và có thể hiểu ἰδίου theo lối danh từ hóa, chỉ “Đấng thuộc riêng về Ngài,” tức Con. Chính văn ưu tiên tiếng Việt tự nhiên mà không xóa cách hiểu truyền thống; chú thích nêu rõ khả năng dịch khác.
- issue: Dị bản τοῦ θεοῦ / τοῦ κυρίου
  choice: “hội thánh của Đức Chúa Trời”
  alternative: “hội thánh của Chúa”
  rationale: Theo bản văn SBLGNT được cung cấp, đồng thời bảo lưu dị bản đáng chú ý trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ nhất quán hình ảnh “bầy chiên—chăn dắt”; dùng “người giám sát” thay vì một chức danh giáo phẩm có thể gợi cơ cấu về sau.
