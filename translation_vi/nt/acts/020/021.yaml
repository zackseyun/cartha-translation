id: ACT.20.21
reference: Acts 20:21
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: διαμαρτυρόμενος Ἰουδαίοις τε καὶ Ἕλλησιν τὴν ⸀εἰς θεὸν μετάνοιαν καὶ ⸀πίστιν εἰς τὸν κύριον ἡμῶν ⸀Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/021.yaml
  text: solemnly testifying to both Jews and Greeks about repentance toward God and faith in our Lord Jesus[a].
translation:
  language: vi
  text: trịnh trọng làm chứng cho cả người Do Thái lẫn người Hy Lạp về sự ăn năn hướng về Đức Chúa Trời và đức tin nơi Chúa Giê-su, Chúa chúng ta[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “lòng tin cậy nơi Chúa Giê-su, Chúa chúng ta.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: διαμαρτυρόμενος
  choice: trịnh trọng làm chứng
  rationale: Phân từ này diễn tả việc làm chứng một cách mạnh mẽ, nghiêm túc; cách dịch giữ được cả ý làm chứng lẫn sắc thái trang trọng.
- source_word: Ἰουδαίοις τε καὶ Ἕλλησιν
  choice: cho cả người Do Thái lẫn người Hy Lạp
  rationale: Giữ nguyên cặp đối ứng của Lu-ca và không khái quát Ἕλληνες thành toàn bộ 'dân ngoại'.
- source_word: μετάνοιαν
  choice: sự ăn năn
  rationale: Đây là cách diễn đạt tự nhiên, quen thuộc trong tiếng Việt, bao hàm sự đổi hướng về đạo đức và tâm linh chứ không chỉ là thay đổi ý nghĩ.
- source_word: εἰς θεόν
  choice: hướng về Đức Chúa Trời
  rationale: Giới từ εἰς chỉ phương hướng hay đối tượng mà sự ăn năn hướng đến.
- source_word: πίστιν
  choice: đức tin
  rationale: Trong cấu trúc có đối tượng rõ ràng là Đức Chúa Jêsus, 'đức tin' là cách dịch sát và tự nhiên; 'lòng tin cậy' được giữ ở chú thích như một khả năng từ vựng.
- source_word: εἰς τὸν κύριον ἡμῶν Ἰησοῦν
  choice: nơi Chúa chúng ta là Đức Chúa Jêsus
  rationale: Diễn đạt tự nhiên đối tượng của đức tin, đồng thời giữ κύριος là tước hiệu 'Chúa' và làm rõ quan hệ đồng vị trong tiếng Việt.
theological_decisions:
- issue: Cách dịch πίστις trong cụm có Đức Chúa Jêsus làm đối tượng
  choice: đức tin nơi Chúa chúng ta là Đức Chúa Jêsus
  alternative: lòng tin cậy nơi Chúa chúng ta là Đức Chúa Jêsus
  rationale: Câu Hy Lạp trình bày Đức Chúa Jêsus là đối tượng của πίστις, không thuộc tranh luận về cấu trúc sở hữu cách pistis Christou. Bản chính dùng 'đức tin', còn chú thích giữ sắc thái quan hệ của 'tin cậy'.
- issue: Mối liên hệ giữa sự ăn năn và đức tin
  choice: giữ hai cụm song song nối bằng 'và'
  alternative: diễn giải sự ăn năn và đức tin như một tiến trình duy nhất
  rationale: Bản dịch không áp đặt một trật tự cứu rỗi hay đồng nhất hai khái niệm, mà giữ nguyên cấu trúc song song và sức căng thần học của nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng 'trịnh trọng làm chứng' để giữ sức nặng của động từ; dùng 'ăn năn' và 'đức tin' là các thuật ngữ phổ thông trong tiếng Việt Cơ Đốc. Cấu trúc 'Chúa chúng ta là Đức Chúa Jêsus' tránh cách ghép danh xưng thiếu tự nhiên và làm rõ rằng 'Chúa chúng ta' chỉ về Đức Chúa Jêsus.
