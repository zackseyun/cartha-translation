    issue: “Đức Chúa Jêsus” không phản ánh chính xác danh xưng trong nguyên văn và dùng chính tả tên riêng không phải chuẩn hiện đại phổ biến.
    rationale: SBLGNT ghi “τὸν κύριον ἡμῶν Ἰησοῦν” (“Chúa chúng ta, Giê-su”), không có θεός để biện minh cho việc thêm “Đức Chúa” vào tên. “Giê-su” phù hợp tiếng Việt hiện đại chuẩn hơn “Jêsus.”
