id: ACT.20.25
reference: Acts 20:25
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ νῦν ἰδοὺ ἐγὼ οἶδα ὅτι οὐκέτι ὄψεσθε τὸ πρόσωπόν μου ὑμεῖς πάντες ἐν οἷς διῆλθον κηρύσσων τὴν ⸀βασιλείαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/025.yaml
  text: And now, look, I know that none of you among whom I went about proclaiming the kingdom will see my face again.
translation:
  language: vi
  text: Và giờ đây, này, tôi biết rằng tất cả anh em, những người mà tôi đã đi lại giữa anh em để rao giảng vương quốc, sẽ không còn thấy mặt tôi nữa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: này
  rationale: Giữ chức năng thu hút sự chú ý của lời nói trực tiếp, đồng thời tự nhiên và trang trọng trong tiếng Việt.
- source_word: διῆλθον
  choice: đã đi khắp nơi
  rationale: Diễn đạt ý Phao-lô đi lại giữa cộng đồng những người nghe, thay vì chỉ đơn giản là đi ngang qua.
- source_word: κηρύσσων
  choice: rao giảng
  rationale: Phản ánh hành động công bố công khai, có thẩm quyền, và là cách dùng quen thuộc trong văn cảnh Tân Ước.
- source_word: τὴν βασιλείαν
  choice: vương quốc
  rationale: Giữ nguyên danh từ xác định nhưng không tự ý thêm 'của Đức Chúa Trời', vì cụm ấy không có trong bản văn SBLGNT của câu này.
- source_word: οὐκέτι ὄψεσθε τὸ πρόσωπόν μου
  choice: sẽ không còn thấy mặt tôi nữa
  rationale: Giữ thành ngữ Semitic-Hy Lạp và ý nghĩa chia lìa vĩnh viễn theo cách tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Đối tượng của việc rao giảng được gọi ngắn gọn là 'vương quốc'
  choice: Không bổ sung 'của Đức Chúa Trời'
  alternative: vương quốc của Đức Chúa Trời
  rationale: Bản văn Hy Lạp được cung cấp chỉ có τὴν βασιλείαν. Dù cụm đầy đủ có thể được hiểu theo ngữ cảnh, bản dịch không nên giải quyết bằng cách thêm từ không hiện diện.
- issue: Phạm vi của lời 'sẽ không còn thấy mặt tôi nữa'
  choice: Đặt 'tất cả anh em' làm chủ thể rõ ràng của mệnh đề
  alternative: không một ai trong anh em ... sẽ còn thấy mặt tôi
  rationale: Cả hai đều phù hợp về nghĩa; lựa chọn này bám sát ὑμεῖς πάντες và tránh biến cấu trúc phủ định thành một khẳng định phân phối mạnh hơn mức cần thiết.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng 'anh em' để phản ánh đại từ số nhiều trong lời Phao-lô nói với các trưởng lão; dùng 'này' thay cho lối cổ hơn 'kìa' hoặc 'hãy xem'.
