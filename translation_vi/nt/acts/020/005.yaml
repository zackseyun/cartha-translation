  register: Văn phong kể chuyện hiện đại, rõ ràng và trang trọng vừa phải. Bản dịch ưu tiên tương đương tối ưu, đồng thời chú thích cách diễn đạt sát hình thức hơn của phân từ và động từ μένω.
