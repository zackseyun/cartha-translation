  yaml_path: translation/nt/acts/020/005.yaml
  text: These men went on ahead and were waiting for us in Troas[a].
translation:
  language: vi
  text: Những người này đã đi trước và đang chờ chúng tôi tại Trô-ách.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát hơn: “Những người này, sau khi đi trước, vẫn ở tại Trô-ách để chờ chúng tôi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτοι
  choice: Những người này
  rationale: Đại từ chỉ định giống đực số nhiều, quy chiếu đến những người đồng hành vừa được nêu tên; cách dịch này làm rõ đối tượng một cách tự nhiên trong tiếng Việt.
- source_word: δὲ
  choice: —
  rationale: δέ là liên từ chuyển tiếp nhẹ; không cần biểu đạt riêng trong tiếng Việt vì mạch kể đã tự nhiên và thêm “còn/nhưng” có thể khiến quan hệ ý nghĩa mạnh hơn nguyên văn.
- source_word: προσελθόντες
  choice: đã đi trước
  rationale: Trong ngữ cảnh hành trình, phân từ này chỉ việc họ đi trước đoàn của người kể; “đã đi trước” tự nhiên và phù hợp với việc họ chờ tại Trô-ách.
- source_word: ἔμενον
  choice: đang chờ
  rationale: Động từ μένω về cơ bản có nghĩa là ở lại/tiếp tục ở, nhưng khi đi với tân ngữ chỉ người trong ngữ cảnh này, nó diễn đạt việc chờ họ đến; “đang” giữ sắc thái tiếp diễn của thì chưa hoàn thành.
- source_word: ἡμᾶς
  choice: chúng tôi
  rationale: Đại từ ngôi thứ nhất số nhiều ở đối cách; “chúng tôi” phù hợp vì lời kể phân biệt nhóm người kể với những người đang được nói đến.
- source_word: ἐν Τρῳάδι
  choice: tại Trô-ách
  rationale: Cụm chỉ địa điểm; “tại” là cách diễn đạt tự nhiên, trang trọng vừa phải, và Trô-ách là dạng tên riêng quen dùng trong tiếng Việt.
theological_decisions: []
