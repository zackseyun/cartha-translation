id: ACT.20.19
reference: Acts 20:19
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: δουλεύων τῷ κυρίῳ μετὰ πάσης ταπεινοφροσύνης ⸀καὶ δακρύων καὶ πειρασμῶν τῶν συμβάντων μοι ἐν ταῖς ἐπιβουλαῖς τῶν Ἰουδαίων·
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/019.yaml
  text: serving the Lord with all humility and with tears and trials that happened to me through the plots of the Jews[a][b].
translation:
  language: vi
  text: phục vụ Chúa với tất cả sự khiêm nhường, với nước mắt và những thử thách[a] xảy đến cho tôi do những âm mưu của người Do Thái[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “những sự thử luyện” hoặc “những cám dỗ”; ở đây, theo ngữ cảnh, từ này chỉ những thử thách từ bên ngoài do sự chống đối gây ra.
    reason: lexical_alternative
  - marker: b
    text: Tức là những đối thủ Do Thái cụ thể đã âm mưu chống Phao-lô, chứ không phải toàn thể người Do Thái.
    reason: cultural_note
lexical_decisions:
- source_word: δουλεύων
  choice: phục vụ
  rationale: Phân từ hiện tại diễn tả cách Phao-lô liên tục thi hành chức vụ. “Phục vụ” tự nhiên trong tiếng Việt và giữ ý tận tụy phụng sự mà không nhấn quá mức địa vị nô lệ.
- source_word: τῷ κυρίῳ
  choice: Chúa
  rationale: Giữ nguyên tước hiệu κύριος; trong ngữ cảnh Công Vụ, từ này tự nhiên chỉ Chúa Giê-su nhưng bản dịch không diễn giải thêm.
- source_word: μετὰ πάσης ταπεινοφροσύνης
  choice: với tất cả lòng khiêm nhường
  rationale: Giữ sức nhấn mạnh của πάσης và diễn đạt tự nhiên cách thức phục vụ.
- source_word: δακρύων
  choice: nước mắt
  rationale: Dịch cụ thể danh từ số nhiều, giữ nét sống động về cảm xúc trong lời Phao-lô.
- source_word: πειρασμῶν
  choice: những thử thách
  rationale: Trong ngữ cảnh các âm mưu chống đối, từ này chỉ nghịch cảnh hay sự thử luyện từ bên ngoài hơn là sự cám dỗ phạm tội.
- source_word: τῶν συμβάντων μοι
  choice: xảy đến cho tôi
  rationale: Diễn đạt rõ ràng, tự nhiên rằng những thử thách ấy đã xảy ra với Phao-lô.
- source_word: ἐν ταῖς ἐπιβουλαῖς
  choice: do những âm mưu
  rationale: ἐν ở đây có thể chỉ hoàn cảnh hoặc phương tiện; “do” truyền đạt tự nhiên mối liên hệ nguyên nhân giữa âm mưu và thử thách, dù sắc thái Hy Lạp không hoàn toàn giới hạn ở nguyên nhân.
- source_word: τῶν Ἰουδαίων
  choice: của người Do Thái
  rationale: Giữ danh xưng trực tiếp trong tiếng Hy Lạp, không tự ý thu hẹp thành giới lãnh đạo; chú thích làm rõ đây là những đối thủ cụ thể chứ không phải toàn thể người Do Thái.
theological_decisions:
- issue: Nguy cơ hiểu câu này như lời quy kết chống toàn thể người Do Thái
  choice: Giữ “người Do Thái” trong chính văn và làm rõ phạm vi theo ngữ cảnh bằng chú thích.
  alternative: các lãnh đạo Do Thái; người Giu-đê
  rationale: τῶν Ἰουδαίων trực tiếp có nghĩa là “của người Do Thái”; tuy nhiên, ngữ cảnh chỉ nhóm đối thủ cụ thể âm mưu chống Phao-lô, không đưa ra nhận định về mọi người Do Thái.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Lặp “với” trước “nước mắt” để phối hợp rõ ba hoàn cảnh đi kèm việc phục vụ. Dùng “Chúa” theo lối xưng hô Kinh Thánh quen thuộc nhưng không diễn giải vượt quá nguyên văn.
