  text: οὐ γὰρ ὑπεστειλάμην τοῦ μὴ ἀναγγεῖλαι ⸂πᾶσαν τὴν βουλὴν τοῦ θεοῦ ὑμῖν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/027.yaml
  text: For I did not shrink back from declaring to you the whole counsel of God[a].
translation:
  language: vi
  text: Vì tôi đã không chùn bước trong việc công bố cho anh em toàn bộ ý định của Đức Chúa Trời.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “toàn bộ mục đích của Đức Chúa Trời”, “toàn bộ kế hoạch của Đức Chúa Trời” hoặc “toàn bộ ý muốn của Đức Chúa Trời”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: Vì
  rationale: Giữ chức năng liên kết giải thích của γάρ với câu trước.
- source_word: οὐ ὑπεστειλάμην
  choice: tôi đã không thoái lui
  rationale: Giữ hình ảnh rút lui, chùn bước của thể trung động ὑποστέλλω và phù hợp với ngữ cảnh gần ở Công Vụ 20:20.
- source_word: τοῦ μὴ ἀναγγεῖλαι
  choice: mà không công bố
  rationale: 'Diễn đạt bổ ngữ của ὑποστέλλω: Phao-lô không thoái lui theo cách dẫn đến việc không công bố; cấu trúc này cũng tránh hàm ý ông chỉ đơn thuần không do dự.'
- source_word: πᾶσαν
  choice: toàn bộ
  rationale: Với danh từ số ít βουλήν, từ này nhấn mạnh tính đầy đủ, không bỏ sót.
- source_word: τὴν βουλὴν τοῦ θεοῦ
  choice: ý định của Đức Chúa Trời
  rationale: “Ý định” tự nhiên trong tiếng Việt và đủ rộng để βουλή bao hàm ý chỉ, mục đích hay kế hoạch mà không thu hẹp thành một sắc thái giáo lý riêng.
- source_word: ὑμῖν
  choice: cho anh em
  rationale: Diễn đạt túc từ gián tiếp của ἀναγγέλλω và giữ lời trực tiếp nói với các trưởng lão Ê-phê-sô.
theological_decisions:
- issue: Ý nghĩa của βουλὴ τοῦ θεοῦ
  choice: toàn bộ ý định của Đức Chúa Trời
  alternative: toàn bộ mục đích / kế hoạch / ý muốn của Đức Chúa Trời
  rationale: βουλή có thể chỉ ý định, mục đích, kế hoạch hoặc ý muốn. Bản chính dùng “ý định” để giữ phạm vi tương đối rộng; chú thích bảo tồn các khả năng khác thay vì đồng nhất cụm từ với một quan niệm giáo phái về sắc lệnh hay ý muốn đạo đức.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Anh em” phù hợp với lời Phao-lô nói trực tiếp với một nhóm người; “Đức Chúa Trời” theo cách gọi Tin Lành quen thuộc nhưng không đưa thêm nét giải nghĩa hệ phái. Cấu trúc “không thoái lui mà không…” hơi trang trọng nhưng bảo tồn quan hệ phủ định của nguyên văn.
