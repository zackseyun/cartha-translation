source:
  edition: SBLGNT
  text: ἀναβὰς δὲ καὶ κλάσας ⸀τὸν ἄρτον καὶ γευσάμενος ἐφ’ ἱκανόν τε ὁμιλήσας ἄχρι αὐγῆς, οὕτως ἐξῆλθεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/011.yaml
  text: Then he went upstairs[a], broke the bread, and ate; and after talking for a long time, until dawn[b], he departed.
translation:
  language: vi
  text: Rồi ông lên lầu, bẻ bánh[a] và ăn[b]; sau khi trò chuyện hồi lâu cho đến rạng đông, ông ra đi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cụm từ “bẻ bánh” có thể chỉ việc cùng dùng bữa; một số người hiểu rằng ở đây cũng bao gồm Tiệc Thánh.
    reason: alternative_reading
  - marker: b
    text: 'Hoặc: “nếm” hoặc “dùng thức ăn.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναβὰς
  choice: đi lên
  rationale: Phân từ bất định quá khứ của ἀναβαίνω diễn tả chuyển động đi lên; trong mạch truyện, Phao-lô trở lại căn phòng trên lầu. “Đi lên” tự nhiên và không thêm từ “trở lại,” vốn chỉ được suy ra từ ngữ cảnh.
- source_word: κλάσας τὸν ἄρτον
  choice: bẻ bánh
  rationale: Cách nói tiếng Việt tự nhiên, giữ hành động cụ thể mà không quyết định đây chỉ là một bữa ăn chung hay có bao gồm Tiệc Thánh.
- source_word: γευσάμενος
  choice: ăn
  rationale: Trong ngữ cảnh dùng bữa, γεύομαι có thể chỉ việc ăn hoặc dùng thức ăn, chứ không nhất thiết chỉ nếm một chút.
- source_word: ἐφ’ ἱκανόν
  choice: hồi lâu
  rationale: Thành ngữ chỉ một khoảng thời gian đáng kể; “hồi lâu” trang trọng vừa phải và tự nhiên trong văn kể chuyện.
- source_word: ὁμιλήσας
  choice: trò chuyện
  rationale: ὁμιλέω ở đây gợi việc nói chuyện hoặc trao đổi kéo dài, phù hợp hơn một động từ có sắc thái diễn thuyết đơn phương.
- source_word: ἄχρι αὐγῆς
  choice: cho đến rạng đông
  rationale: αὐγή chỉ lúc bình minh hoặc rạng ngày; “rạng đông” rõ nghĩa và tự nhiên.
- source_word: οὕτως ἐξῆλθεν
  choice: ông rời đi
  rationale: ἐξέρχομαι diễn tả việc ra đi; οὕτως nối sự ra đi với chuỗi hành động vừa kể. Trong tiếng Việt, trình tự câu đã truyền đạt quan hệ ấy mà không cần dịch cứng là “như vậy.”
theological_decisions:
- issue: κλάσας τὸν ἄρτον có phải là một chỉ dẫn minh nhiên đến Tiệc Thánh hay không
  choice: Dịch trung tính là “bẻ bánh.”
  alternative: Có thể hiểu là dùng bữa chung; một số người hiểu là có bao gồm Tiệc Thánh.
  rationale: Cụm từ có thể mang liên tưởng đến Tiệc Thánh trong sách Công Vụ, nhưng chính câu này không buộc phải hiểu theo nghĩa nghi lễ. Bản dịch giữ nguyên độ mở thần học của văn bản.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “ông” để tiếp nối nhân vật Phao-lô trong văn kể chuyện; giữ câu gọn và nhịp kể tự nhiên.
