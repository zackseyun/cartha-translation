    rationale: Bản dịch chọn “ăn” cho γευσάμενος, trong khi dữ liệu kiểm tra tiếng Anh ghi nhận các khả năng “nếm” và “dùng thức ăn.” Thêm chú thích [b] bảo đảm các khả năng từ vựng này được minh bạch và được neo đúng chỗ.
  revised_text: Rồi ông lên lầu, bẻ bánh[a] và ăn[b]; sau khi trò chuyện hồi lâu cho đến rạng đông, ông ra đi.
