base_translation:
  language: en
  yaml_path: translation/nt/acts/020/034.yaml
  text: You yourselves know that these hands served my needs and the needs of those who were with me[a].
translation:
  language: vi
  text: Chính anh em biết rằng đôi tay này đã đáp ứng các nhu cầu của tôi và của những người ở cùng tôi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đôi tay này đã lo liệu cho nhu cầu của tôi và của những người ở cùng tôi.” Động từ Hy Lạp có thể nhấn mạnh sự phục vụ thiết thực dẫn đến việc chu cấp vật chất.'
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτοὶ
  choice: Chính anh em
  rationale: Đại từ được nêu rõ bên cạnh động từ tạo sắc thái nhấn mạnh; “Chính anh em” tự nhiên trong tiếng Việt và giữ được ý “anh em tự mình biết”.
- source_word: γινώσκετε
  choice: biết
  rationale: Động từ hiện tại chỉ sự hiểu biết trực tiếp của người nghe về cách Phao-lô đã sống và làm việc.
- source_word: ταῖς χρείαις μου
  choice: những nhu cầu của tôi
  rationale: χρεία chỉ các nhu cầu thiết thực hoặc những thứ cần thiết; cách dịch này rõ ràng và không giới hạn quá mức vào một loại nhu cầu cụ thể.
- source_word: τοῖς οὖσι μετ’ ἐμοῦ
  choice: những người ở cùng tôi
  rationale: Giữ sát cấu trúc phân từ có mạo từ, không diễn giải thêm họ là cộng sự hay bạn đồng hành.
- source_word: ὑπηρέτησαν
  choice: đã phục vụ
  rationale: Động từ diễn tả việc phục vụ hay trợ giúp. Với chủ ngữ “đôi tay này”, cách nói giữ hình ảnh sinh động của nguyên văn; chú thích nêu rõ nghĩa cung ứng vật chất có thể được nhấn mạnh trong ngữ cảnh.
- source_word: αἱ χεῖρες αὗται
  choice: đôi tay này
  rationale: Giữ nguyên hình ảnh chỉ định và sắc thái nhấn mạnh về lao động bằng chính tay Phao-lô, không thêm đại từ sở hữu vốn không xuất hiện trực tiếp trong tiếng Hy Lạp.
