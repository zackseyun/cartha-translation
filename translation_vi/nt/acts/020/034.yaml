translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Chính anh em” giữ sắc thái nhấn mạnh; “đôi tay này” bảo tồn hình ảnh Phao-lô hướng sự chú ý đến lao động thủ công của mình. Cụm “những nhu cầu của tôi và của những người...” lặp “của” để làm rõ rằng hành động phục vụ liên quan đến nhu cầu của cả hai nhóm.
