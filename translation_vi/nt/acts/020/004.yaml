  text: συνείπετο δὲ ⸀αὐτῷ Σώπατρος ⸀Πύρρου Βεροιαῖος, Θεσσαλονικέων δὲ Ἀρίσταρχος καὶ Σεκοῦνδος, καὶ Γάϊος Δερβαῖος καὶ Τιμόθεος, Ἀσιανοὶ δὲ Τυχικὸς καὶ Τρόφιμος·
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/004.yaml
  text: And Sopater son of Pyrrhus[a], a Berean, accompanied him; and Aristarchus and Secundus from Thessalonica; and Gaius of Derbe, and Timothy[b]; and Tychicus and Trophimus from Asia.
translation:
  language: vi
  text: Cùng đi với ông có Sô-pa-tơ, con trai Py-rút, người Bê-rê; A-ri-tạc và Sê-cun-đút, đều là người Tê-sa-lô-ni-ca; Gai-út, người Đẹt-bơ, và Ti-mô-thê; cùng Ty-chi-cơ và Trô-phi-mơ, đều là người thuộc tỉnh A-si[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tức tỉnh A-si của Đế quốc La Mã, không phải toàn bộ châu Á ngày nay.
    reason: cultural_note
lexical_decisions:
- source_word: συνείπετο ... αὐτῷ
  choice: cùng đi với ông
  rationale: Diễn đạt tự nhiên hành động đồng hành trong chuyến đi; đại từ chỉ Phao-lô theo văn mạch.
- source_word: Σώπατρος Πύρρου Βεροιαῖος
  choice: Sô-pa-tơ, con trai Py-rút, người Bê-rê
  rationale: Giữ cách hiểu tự nhiên của sở hữu cách Πύρρου là phụ danh và Βεροιαῖος là nguồn gốc địa lý.
- source_word: Θεσσαλονικέων δὲ Ἀρίσταρχος καὶ Σεκοῦνδος
  choice: A-ri-tạc và Sê-cun-đút, người Tê-sa-lô-ni-ca
  rationale: Sở hữu cách số nhiều phân nhóm hai người theo cộng đồng hoặc quê quán; tiếng Việt dùng 'người Tê-sa-lô-ni-ca' gọn và tự nhiên.
- source_word: Γάϊος Δερβαῖος
  choice: Gai-út, người Đẹt-bơ
  rationale: Δερβαῖος là tính từ chỉ nguồn gốc địa lý, được diễn đạt tự nhiên bằng 'người Đẹt-bơ'.
- source_word: Ἀσιανοὶ δὲ Τυχικὸς καὶ Τρόφιμος
  choice: Ty-chi-cơ và Trô-phi-mơ, người thuộc tỉnh A-si
  rationale: Ἀσιανοί tại đây chỉ người thuộc tỉnh A-si của La Mã, không phải người châu Á theo nghĩa hiện đại.
- source_word: δέ ... δέ ... δέ
  choice: dấu chấm phẩy và 'cùng'
  rationale: Các tiểu từ nối tiếp dùng để thêm từng nhóm vào danh sách; cấu trúc liệt kê tiếng Việt bảo toàn chức năng mà không dịch máy móc từng δέ.
