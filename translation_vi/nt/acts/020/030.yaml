source:
  edition: SBLGNT
  text: καὶ ἐξ ὑμῶν αὐτῶν ἀναστήσονται ἄνδρες λαλοῦντες διεστραμμένα τοῦ ἀποσπᾶν τοὺς μαθητὰς ὀπίσω ⸀ἑαυτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/030.yaml
  text: and from among your own selves men will arise[a], speaking twisted things, to draw away the disciples after themselves.
translation:
  language: vi
  text: Ngay trong anh em sẽ có những người đàn ông nổi lên, nói những điều sai lệch[a] để lôi kéo các môn đồ theo mình.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “những điều xuyên tạc” hoặc “những điều bị bóp méo.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξ ὑμῶν αὐτῶν
  choice: chính từ giữa anh em
  rationale: “Chính” thể hiện sắc thái nhấn mạnh của αὐτῶν, cho thấy mối nguy sẽ xuất hiện ngay từ bên trong cộng đồng mà Phao-lô đang nói với.
- source_word: ἀναστήσονται
  choice: sẽ ... nổi lên
  rationale: Diễn đạt tự nhiên ý nghĩa thành ngữ rằng những người ấy sẽ xuất hiện trong tương lai, đồng thời giữ nguyên sắc thái tiên báo.
- source_word: ἄνδρες
  choice: những người đàn ông
  rationale: ἀνήρ chỉ rõ người nam; cách dịch này giữ chính xác giới tính của từ Hy Lạp thay vì trung tính hóa.
- source_word: λαλοῦντες
  choice: nói
  rationale: Diễn đạt trực tiếp hoạt động bằng lời của những người này, tự nhiên trong tiếng Việt hiện đại.
- source_word: διεστραμμένα
  choice: những điều lệch lạc
  rationale: Phân từ hoàn thành bị động số nhiều trung tính được dùng như danh từ, chỉ những điều đã bị bẻ lệch khỏi điều ngay thẳng hay chân thật. “Lệch lạc” giữ phạm vi nghĩa rộng, không giới hạn vào một loại sai lầm cụ thể.
- source_word: τοῦ ἀποσπᾶν
  choice: nhằm lôi kéo
  rationale: Giữ ý chỉ mục đích của cấu trúc τοῦ với động từ nguyên mẫu và hình ảnh tách người ta khỏi chỗ họ đang thuộc về.
- source_word: τοὺς μαθητὰς
  choice: các môn đồ
  rationale: Đây là thuật ngữ quen thuộc trong sách Công Vụ để chỉ những người theo Chúa Giê-xu.
- source_word: ὀπίσω ἑαυτῶν
  choice: đi theo họ
  rationale: Diễn đạt tự nhiên thành ngữ chỉ việc đi theo và dành lòng trung thành cho chính những người ấy.
theological_decisions:
- issue: Bản chất lời nói của các giáo sư giả
  choice: nói những điều lệch lạc
  alternative: nói những điều xuyên tạc; nói những điều sai trái
  rationale: Nguyên văn cảnh báo về sự sai lệch nhưng không xác định một tà thuyết cụ thể; bản dịch giữ nguyên phạm vi rộng và sự căng thẳng ấy.
- issue: Cách thể hiện giới tính của ἄνδρες
  choice: những người đàn ông
  alternative: những người
  rationale: Danh từ Hy Lạp mang nghĩa nam giới cụ thể, nên bản dịch không trung tính hóa.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Chính từ giữa anh em” giữ sự nhấn mạnh về mối nguy từ nội bộ; “lôi kéo ... đi theo họ” thể hiện rõ mục đích tạo phe nhóm quanh chính những người nói sai lệch.
