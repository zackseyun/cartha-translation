  to: Ngay trong anh em sẽ có những người đàn ông nổi lên, nói những điều sai lệch[a] để lôi kéo các môn đồ theo mình.
  rationale: 'Bản sửa giữ nguyên ý nghĩa và độ mơ hồ của nguyên văn: những người nam xuất thân từ nội bộ sẽ xuất hiện, nói các điều bị sai lệch, với mục đích kéo các môn đồ về theo chính họ. Chỉnh sửa chủ yếu nhằm tăng tính tự nhiên, đồng thời dùng lựa chọn từ vựng rộng nghĩa cho διεστραμμένα.'
