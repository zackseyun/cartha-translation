  source_fidelity: 'Bản nháp truyền đạt đúng các thành tố chính: nguồn nguy hiểm từ trong nhóm người được nói đến, chủ thể là nam giới, lời nói bị sai lệch, mục đích lôi kéo các môn đồ theo chính họ. Tuy nhiên, “Chính từ giữa anh em cũng sẽ có” hơi nặng và không diễn đạt gọn lực của ἀναστήσονται; “ngay trong anh em ... sẽ có ... nổi lên” tự nhiên hơn mà vẫn giữ nhấn mạnh nội bộ. “Những điều sai lệch” phản ánh διεστραμμένα sát và tự nhiên hơn “những điều lệch lạc.”'
