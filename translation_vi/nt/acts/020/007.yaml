source:
  edition: SBLGNT
  text: Ἐν δὲ τῇ μιᾷ τῶν σαββάτων συνηγμένων ⸀ἡμῶν κλάσαι ἄρτον ὁ Παῦλος διελέγετο αὐτοῖς, μέλλων ἐξιέναι τῇ ἐπαύριον, παρέτεινέν τε τὸν λόγον μέχρι μεσονυκτίου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/007.yaml
  text: On the first day of the week[a], when we had gathered to break bread, Paul was speaking to them, intending to depart the next day[b], and he prolonged the message until midnight.
translation:
  language: vi
  text: Vào ngày đầu tuần, khi chúng tôi đã nhóm lại để bẻ bánh[a], Phao-lô trò chuyện với họ. Vì hôm sau ông sắp ra đi[b], ông kéo dài cuộc nói chuyện cho đến nửa đêm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cụm “bẻ bánh” có thể chỉ việc dùng bữa chung và cũng có thể mang hàm ý về Tiệc Thánh.
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “Phao-lô trò chuyện với họ, ông sắp ra đi vào ngày hôm sau, và ông kéo dài cuộc nói chuyện cho đến nửa đêm.”'
    reason: syntactic_alternative
lexical_decisions:
- source_word: Ἐν δὲ τῇ μιᾷ τῶν σαββάτων
  choice: Vào ngày thứ nhất trong tuần
  rationale: Cụm này là thành ngữ Hy Lạp Koinē chỉ ngày đầu tuần; cách dịch sát chữ kiểu “một trong các ngày Sa-bát” sẽ gây hiểu lầm. δέ là từ nối nhẹ, không nhất thiết phải biểu đạt riêng trong tiếng Việt.
- source_word: συνηγμένων ἡμῶν
  choice: khi chúng tôi đã nhóm lại
  rationale: Kết cấu sở hữu cách tuyệt đối nêu hoàn cảnh cho hành động chính và giữ nguyên ngôi thứ nhất số nhiều của lời thuật.
- source_word: κλάσαι ἄρτον
  choice: để bẻ bánh
  rationale: Động từ nguyên mẫu diễn tả mục đích. “Bẻ bánh” giữ lại thành ngữ của nguyên văn, không thu hẹp ý nghĩa thành riêng một bữa ăn thông thường hay nghi thức Tiệc Thánh.
- source_word: διελέγετο αὐτοῖς
  choice: trò chuyện với họ
  rationale: Thì chưa hoàn thành chỉ hành động đang tiếp diễn; διαλέγομαι có sắc thái trao đổi, đối thoại, nên “trò chuyện với” tự nhiên và sát hơn cách diễn đạt hoàn toàn độc thoại.
- source_word: μέλλων ἐξιέναι τῇ ἐπαύριον
  choice: Vì định ra đi vào ngày hôm sau
  rationale: μέλλω với động từ nguyên mẫu diễn tả việc sắp xảy ra hoặc dự định gần kề; phân từ có thể được hiểu theo sắc thái hoàn cảnh hay nguyên nhân. “Ra đi” phù hợp với bối cảnh hành trình.
- source_word: παρέτεινέν τε τὸν λόγον
  choice: ông kéo dài lời giảng
  rationale: παρατείνω có nghĩa kéo dài; λόγος ở đây là lời nói hay bài trình bày của Phao-lô. “Lời giảng” rõ nghĩa trong ngữ cảnh hội họp nhưng không nhất thiết phủ nhận sắc thái trao đổi của động từ trước đó.
- source_word: μέχρι μεσονυκτίου
  choice: cho đến nửa đêm
  rationale: Diễn đạt tự nhiên giới hạn thời gian được nêu trong nguyên văn.
theological_decisions:
- issue: Ý nghĩa của “bẻ bánh” trong buổi nhóm họp Cơ Đốc giáo ban đầu
  choice: Giữ nguyên thành ngữ “bẻ bánh”.
  alternative: “dùng bữa chung” hoặc “cử hành Tiệc Thánh”
  rationale: Trong Công Vụ, cụm này có thể chỉ việc dùng bữa chung và cũng có thể mang hàm ý về Tiệc Thánh. Bản dịch không giải quyết dứt khoát một sắc thái mà nguyên văn để ngỏ.
- issue: Quan hệ của mệnh đề μέλλων ἐξιέναι với việc Phao-lô nói và kéo dài lời
  choice: 'Diễn đạt theo sắc thái nguyên nhân: “Vì định ra đi vào ngày hôm sau”.'
  alternative: 'Diễn đạt thuần hoàn cảnh: “ông định ra đi vào ngày hôm sau”'
  rationale: Phân từ Hy Lạp cho phép hiểu là hoàn cảnh kèm theo hoặc lý do khiến Phao-lô kéo dài lời nói. Chú thích bảo lưu khả năng còn lại.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “nhóm lại” theo ngữ cảnh hội họp cộng đồng; “trò chuyện với họ” bảo tồn sắc thái tương tác của διαλέγομαι. Tách thành hai câu để câu tiếng Việt sáng rõ mà vẫn giữ mạch ý của nguyên văn.
