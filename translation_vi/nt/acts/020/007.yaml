revisions:
- from: Vào ngày thứ nhất trong tuần, khi chúng tôi đã nhóm lại để bẻ bánh[a], Phao-lô trò chuyện với họ. Vì định ra đi vào ngày hôm sau, ông kéo dài lời giảng cho đến nửa đêm.[b]
  to: Vào ngày đầu tuần, khi chúng tôi đã nhóm lại để bẻ bánh[a], Phao-lô trò chuyện với họ. Vì hôm sau ông sắp ra đi[b], ông kéo dài cuộc nói chuyện cho đến nửa đêm.
  rationale: Bản sửa dùng cách nói tiếng Việt hiện đại hơn, phản ánh rõ hơn sắc thái sắp xảy ra của μέλλων, và tránh hiểu τὸν λόγον như một bài giảng đơn thoại. Câu vẫn giữ quan hệ nguyên nhân có thể có trong phân từ μέλλων; chú thích bảo lưu cách hiểu mệnh đề này chỉ nêu hoàn cảnh, không phải nguyên nhân.
