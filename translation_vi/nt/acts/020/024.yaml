id: ACT.20.24
reference: Acts 20:24
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀλλ’ οὐδενὸς ⸀λόγου ⸀ποιοῦμαι τὴν ⸀ψυχὴν τιμίαν ἐμαυτῷ ὡς ⸀τελειῶσαι τὸν δρόμον ⸀μου καὶ τὴν διακονίαν ἣν ἔλαβον παρὰ τοῦ κυρίου Ἰησοῦ, διαμαρτύρασθαι τὸ εὐαγγέλιον τῆς χάριτος τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/024.yaml
  text: 'But I do not count my life as of any value to myself[c][b][a], if only I may finish my course and the ministry that I received from the Lord Jesus: to testify to the gospel of the grace of God.'
translation:
  language: vi
  text: Nhưng tôi chẳng xem mạng sống mình là điều quý giá đối với bản thân[a], miễn là tôi hoàn thành chặng đường[b] và chức vụ mà tôi đã nhận từ Chúa Giê-su, là làm chứng[c] về Tin Mừng của ân điển Đức Chúa Trời.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “tôi chẳng xem linh hồn mình là điều quý giá đối với bản thân.” Ở đây, “mạng sống” phù hợp với ngữ cảnh Phao-lô sẵn sàng đối diện cái chết để hoàn thành sứ mạng.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “cuộc đua.” Từ Hy Lạp δρόμος chỉ chặng đường hoặc cuộc đua phải hoàn tất.'
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “làm chứng cách long trọng” hoặc “làm chứng cách nghiêm trang.” Động từ Hy Lạp có thể mang sắc thái làm chứng cách nghiêm túc, mạnh mẽ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδενὸς λόγου ποιοῦμαι ... τιμίαν ἐμαυτῷ
  choice: tôi không coi ... là quý đối với chính mình
  rationale: Diễn đạt tự nhiên thành ngữ đánh giá của tiếng Hy Lạp, đồng thời giữ ý τιμίαν là “quý, có giá trị” và ἐμαυτῷ là “đối với chính mình.”
- source_word: ψυχήν
  choice: mạng sống
  rationale: Trong ngữ cảnh Phao-lô sẵn sàng đối diện đau khổ và cái chết để hoàn thành sứ mạng; “mạng sống” phù hợp hơn “linh hồn” và không áp đặt sự đối lập thân xác–linh hồn.
- source_word: ὡς τελειῶσαι
  choice: miễn sao tôi hoàn tất
  rationale: Cấu trúc cô đọng nêu mối quan tâm chi phối của Phao-lô. “Miễn sao” giữ sắc thái mục tiêu tối thượng mà không thu hẹp thành một mệnh đề mục đích thuần túy.
- source_word: δρόμον
  choice: chặng đường
  rationale: Giữ hình ảnh về lộ trình phải đi đến cùng và tự nhiên trong tiếng Việt; sắc thái cuộc đua vẫn là một khả năng từ vựng nên được ghi chú.
- source_word: διακονίαν
  choice: chức vụ
  rationale: Trong ngữ cảnh này, từ chỉ công việc phục vụ được Chúa Giê-su giao phó; “chức vụ” là cách diễn đạt quen thuộc, trang trọng và rõ nghĩa.
- source_word: παρὰ τοῦ κυρίου Ἰησοῦ
  choice: từ Chúa Giê-su
  rationale: παρά với sở hữu cách chỉ nguồn gốc; bản dịch bảo toàn danh hiệu κύριος bằng “Chúa.”
- source_word: διαμαρτύρασθαι
  choice: làm chứng
  rationale: Diễn đạt hành động xác nhận và công bố cách nghiêm túc. “Làm chứng” tự nhiên trong tiếng Việt, còn sắc thái long trọng được nêu ở chú thích.
- source_word: εὐαγγέλιον
  choice: Tin Mừng
  rationale: Cách gọi hiện đại, phổ thông và có trọng lượng thần học cho sứ điệp Cơ Đốc; viết hoa như tên gọi của sứ điệp được công bố.
- source_word: τῆς χάριτος τοῦ θεοῦ
  choice: của ân điển Đức Chúa Trời
  rationale: 'Giữ chuỗi sở hữu cách và sự mơ hồ chân thực: Tin Mừng có thể được đặc trưng bởi ân điển hoặc nói về ân điển của Đức Chúa Trời.'
theological_decisions:
- issue: Nghĩa của ψυχή trong lời Phao-lô nói về bản thân
  choice: mạng sống
  alternative: linh hồn
  rationale: Ngữ cảnh tập trung vào việc Phao-lô sẵn sàng chịu khổ và chết để hoàn thành sứ mạng, chứ không nhấn mạnh một thực thể phi vật chất tách khỏi thân xác.
- issue: Lực nghĩa của ὡς τελειῶσαι
  choice: miễn sao tôi hoàn tất
  alternative: để tôi hoàn tất; hầu cho tôi hoàn tất
  rationale: Cách dịch này thể hiện mục tiêu chi phối của Phao-lô và giữ độ căng của cấu trúc Hy Lạp thay vì xác định nó chỉ là một mệnh đề mục đích.
- issue: Quan hệ sở hữu cách trong τὸ εὐαγγέλιον τῆς χάριτος τοῦ θεοῦ
  choice: Tin Mừng của ân điển Đức Chúa Trời
  alternative: Tin Mừng về ân điển của Đức Chúa Trời
  rationale: Cách dịch hình thức hơn bảo tồn khả năng Tin Mừng vừa nói về ân điển vừa mang đặc tính của ân điển, không ép sở hữu cách vào một quan hệ duy nhất.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “mạng sống,” “chặng đường,” và “miễn sao” để truyền đạt rõ ý trong ngữ cảnh; giữ cấu trúc “Tin Mừng của ân điển Đức Chúa Trời” nhằm bảo tồn độ mở của sở hữu cách Hy Lạp.
