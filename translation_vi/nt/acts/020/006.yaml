revisions:
- from: Còn chúng tôi xuống thuyền rời Phi-líp sau những ngày lễ Bánh Không Men, và trong vòng năm ngày[a] thì đến Trô-a, gặp những người kia. Tại đó, chúng tôi ở lại bảy ngày.
  to: Còn chúng tôi rời Phi-líp bằng thuyền sau những ngày Lễ Bánh Không Men, và trong vòng năm ngày[a] đến với họ tại Trô-a. Chúng tôi ở đó bảy ngày.
  rationale: Sửa cách diễn đạt về việc đi thuyền và đến với nhóm người tại Trô-a để bám sát cấu trúc nguyên ngữ hơn và vẫn tự nhiên. Thay chú thích vì phương án “sau năm ngày” không truyền đạt đúng giá trị thời lượng của cụm Hy Lạp. Các chi tiết khác được giữ nguyên về nghĩa.
