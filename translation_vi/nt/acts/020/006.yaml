  text: ἡμεῖς δὲ ἐξεπλεύσαμεν μετὰ τὰς ἡμέρας τῶν ἀζύμων ἀπὸ Φιλίππων, καὶ ἤλθομεν πρὸς αὐτοὺς εἰς τὴν Τρῳάδα ἄχρι ἡμερῶν πέντε, ⸀οὗ διετρίψαμεν ἡμέρας ἑπτά.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/006.yaml
  text: But we sailed away from Philippi after the days of Unleavened Bread[a], and came to them at Troas within five days, where we stayed seven days.
translation:
  language: vi
  text: Còn chúng tôi rời Phi-líp bằng thuyền sau những ngày Lễ Bánh Không Men, và trong vòng năm ngày[a] đến với họ tại Trô-a. Chúng tôi ở đó bảy ngày.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “trong năm ngày.” Cách diễn đạt Hy Lạp chỉ thời lượng của hành trình cho đến khi họ tới nơi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξεπλεύσαμεν
  choice: xuống thuyền rời
  rationale: Động từ ἐκπλέω chỉ việc khởi hành bằng đường biển; cách diễn đạt này tự nhiên trong tiếng Việt và nêu rõ phương tiện cùng sự rời nơi xuất phát.
- source_word: μετὰ τὰς ἡμέρας τῶν ἀζύμων
  choice: sau những ngày lễ Bánh Không Men
  rationale: Cụm Hy Lạp nói sát là “sau những ngày bánh không men”; thêm “lễ” giúp độc giả nhận ra đây là kỳ lễ Do Thái mà không làm mất ý chỉ một khoảng nhiều ngày.
- source_word: ἀπὸ Φιλίππων
  choice: rời Phi-líp
  rationale: ἀπό nêu điểm xuất phát; “rời Phi-líp” kết hợp tự nhiên với động từ chỉ chuyến đi bằng thuyền.
- source_word: ἤλθομεν πρὸς αὐτοὺς
  choice: đến ... gặp những người kia
  rationale: πρὸς αὐτούς diễn tả sự đi đến chỗ những người đã được nhắc trong ngữ cảnh. “Gặp” thể hiện tự nhiên việc đến chỗ họ nhưng không thêm ý nghĩa thần học.
- source_word: εἰς τὴν Τρῳάδα
  choice: đến Trô-a
  rationale: εἰς đánh dấu đích đến; “đến Trô-a” là cách diễn đạt tiếng Việt trực tiếp và tự nhiên.
- source_word: ἄχρι ἡμερῶν πέντε
  choice: trong vòng năm ngày
  rationale: ἄχρι với khoảng thời gian đánh dấu giới hạn kéo dài cho tới lúc đến nơi. “Trong vòng năm ngày” truyền đạt giới hạn ấy, còn chú thích giữ cách hiểu “sau năm ngày” có thể gặp.
- source_word: οὗ
  choice: tại đó
  rationale: Trạng từ quan hệ οὗ quy chiếu về Trô-a; “tại đó” nối câu tự nhiên trong tiếng Việt.
- source_word: διετρίψαμεν ἡμέρας ἑπτά
  choice: chúng tôi ở lại bảy ngày
  rationale: διατρίβω trong văn cảnh hành trình có nghĩa lưu lại một nơi trong một khoảng thời gian; “ở lại” là cách nói hiện đại, rõ nghĩa.
