  text: ὡς δὲ ⸀συνέβαλλεν ἡμῖν εἰς τὴν Ἆσσον, ἀναλαβόντες αὐτὸν ἤλθομεν εἰς Μιτυλήνην,
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/014.yaml
  text: And when he met us at Assos[a], we took him on board and came to Mitylene.
translation:
  language: vi
  text: Khi ông gặp chúng tôi tại A-sốt[a], chúng tôi đón ông lên tàu rồi đến Mi-ti-lê-ne.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “hội với chúng tôi tại A-sốt” hoặc “đến gặp chúng tôi tại A-sốt.” Động từ Hy Lạp có thể chỉ việc gặp hoặc hội lại; ở đây, ý là Phao-lô gặp lại đoàn tại đó.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνέβαλλεν
  choice: gặp
  rationale: Trong mạch kể hành trình, động từ này tự nhiên nhất chỉ việc Phao-lô gặp lại đoàn tại A-sốt. Cách dịch giữ được nghĩa gặp nhau mà không suy diễn rằng câu này nói đến việc đã sắp xếp cuộc gặp.
- source_word: ἡμῖν
  choice: chúng tôi
  rationale: Đại từ số nhiều ở cách tặng chỉ đoàn người đang đi bằng tàu; tiếng Việt diễn đạt tự nhiên là bổ ngữ của động từ “gặp”.
- source_word: εἰς τὴν Ἆσσον
  choice: tại A-sốt
  rationale: Dù εἰς thường chỉ hướng đến, đi với ý gặp nhau thì “tại A-sốt” diễn đạt tự nhiên địa điểm cuộc gặp.
- source_word: ἀναλαβόντες
  choice: đón ông lên tàu
  rationale: Trong bối cảnh hàng hải, phân từ này nói đến việc tiếp nhận Phao-lô lên tàu. “Đón ông lên tàu” rõ nghĩa và tự nhiên trong tiếng Việt.
- source_word: αὐτόν
  choice: ông
  rationale: Đại từ chỉ Phao-lô trong văn cảnh trước; “ông” là cách quy chiếu trang trọng, tự nhiên.
- source_word: ἤλθομεν
  choice: đi đến
  rationale: Động từ aorist chỉ chuyển động đến địa điểm kế tiếp; “đi đến” phù hợp điểm nhìn của lời kể hành trình tiếng Việt.
- source_word: εἰς Μιτυλήνην
  choice: đến Mi-ti-lê-ne
  rationale: Diễn đạt hướng đến địa danh một cách tự nhiên; địa danh được phiên âm để độc giả Việt dễ đọc.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “đón ông lên tàu” để làm rõ bối cảnh hàng hải vốn hàm ẩn trong nguyên văn; giữ chú thích nhằm bảo tồn phạm vi nghĩa của συνέβαλλεν.
