translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Đại từ “ông” duy trì cách kể chuyện tự nhiên về Phao-lô. Câu đầu giữ hình ảnh “thấy mặt” của nguyên văn; câu sau dùng “tiễn… ra tận tàu” để chuyển tải tự nhiên hành động đưa tiễn kéo dài của thì chưa hoàn thành.
