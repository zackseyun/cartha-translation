translation:
  language: vi
  text: 'Họ đau buồn nhất vì lời ông đã nói[a]: họ sẽ không còn thấy mặt ông nữa[b]. Rồi họ tiễn ông đến tàu[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “vì điều ông đã nói.” Sát nguyên văn: “vì lời mà ông đã nói.”'
    reason: lexical_alternative
  - marker: b
    text: 'Sát nguyên văn: “sẽ không còn thấy mặt ông”; đây là cách nói thân tình về việc không được gặp lại ông nữa.'
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “hộ tống ông đến tàu” hoặc “đi cùng để tiễn ông đến tàu.” Động từ Hy Lạp có thể chỉ việc cùng đi với một người để trân trọng tiễn họ lên đường.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀδυνώμενοι
  choice: đau buồn
  rationale: Diễn tả nỗi đau buồn sâu sắc trong cuộc chia tay, tự nhiên trong tiếng Việt mà không cường điệu sắc thái của từ Hy Lạp.
- source_word: μάλιστα
  choice: nhất
  rationale: Nêu điều khiến họ đau buồn hơn cả; kết hợp tự nhiên thành “đau buồn nhất vì”.
- source_word: ἐπὶ τῷ λόγῳ ᾧ εἰρήκει
  choice: vì lời ông đã nói
  rationale: Giữ danh từ λόγος là “lời” và thể quá khứ hoàn thành của εἰρήκει bằng “đã nói”, đồng thời diễn đạt quan hệ nguyên nhân tự nhiên trong tiếng Việt.
- source_word: οὐκέτι μέλλουσιν
  choice: sẽ không còn… nữa
  rationale: Diễn đạt viễn cảnh tương lai tính từ thời điểm lời nói; “không còn… nữa” giữ đúng οὐκέτι, còn “sẽ” chuyển tải μέλλουσιν mà không tạo câu gượng.
- source_word: τὸ πρόσωπον αὐτοῦ θεωρεῖν
  choice: thấy mặt ông
  rationale: Giữ hình ảnh cụ thể “mặt ông” của nguyên văn, một cách nói giàu tính cá nhân về việc gặp lại ông.
- source_word: προέπεμπον
  choice: tiễn ông ra tận
  rationale: Trong bối cảnh chia tay, động từ chỉ việc cùng đi để đưa tiễn; “tiễn… ra tận” tự nhiên và thể hiện sự đồng hành kính trọng.
- source_word: εἰς τὸ πλοῖον
  choice: ra tận tàu
  rationale: “Tàu” phù hợp bối cảnh hải hành; giới từ εἰς cùng động từ chỉ hướng đến nơi con tàu đậu.
