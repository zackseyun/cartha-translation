  to: 'Họ đau buồn nhất vì lời ông đã nói[a]: họ sẽ không còn thấy mặt ông nữa[b]. Rồi họ tiễn ông đến tàu[c].'
  rationale: Chỉnh dấu phẩy và “rằng” thành dấu hai chấm để mệnh đề nội dung của lời nói tự nhiên, minh bạch trong tiếng Việt. Đổi “tiễn ông ra tận tàu” thành “tiễn ông đến tàu” để giữ sát nghĩa hướng đến tàu của nguyên văn mà tránh thêm sắc thái nhấn mạnh. Không thay đổi nghĩa của phân đoạn hay các chú thích.
