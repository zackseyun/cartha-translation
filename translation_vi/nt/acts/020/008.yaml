  source_fidelity: Bản dịch chuyển tải đầy đủ mệnh đề chính ἦσαν ... λαμπάδες ἱκαναὶ bằng “có nhiều đèn”, địa điểm ἐν τῷ ὑπερῴῳ bằng “trong căn phòng trên lầu”, và mệnh đề quan hệ οὗ ἦμεν συνηγμένοι bằng “nơi chúng tôi đang tụ họp”. “Đang tụ họp” diễn đạt tự nhiên tình trạng nhóm “chúng tôi” đang hiện diện/quy tụ tại đó; không tạo thêm đối lập từ δέ.
