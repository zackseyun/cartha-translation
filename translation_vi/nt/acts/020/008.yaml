  text: ἦσαν δὲ λαμπάδες ἱκαναὶ ἐν τῷ ὑπερῴῳ οὗ ἦμεν συνηγμένοι·
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/008.yaml
  text: There were many lamps in the upper room where we were gathered[a].
translation:
  language: vi
  text: Trong căn phòng trên lầu, nơi chúng tôi đang tụ họp, có nhiều đèn[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “đuốc”. Từ Hy Lạp này có thể chỉ các loại đèn cầm tay nói chung, nhưng trong bối cảnh ở trong phòng, “đèn” có khả năng hơn.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: không dịch riêng
  rationale: δέ là từ nối nhẹ mang chức năng chuyển cảnh; trong tiếng Việt, trật tự câu miêu tả đã tạo dòng kể tự nhiên, nên thêm “bấy giờ” hoặc “nhưng” sẽ dễ hàm ý thời gian hay tương phản quá mức.
- source_word: λαμπάδες
  choice: đèn
  rationale: λαμπάς có thể chỉ đèn hoặc đuốc; trong bối cảnh căn phòng trên lầu, “đèn” là cách hiểu có khả năng hơn và tự nhiên trong tiếng Việt.
- source_word: ἱκαναὶ
  choice: nhiều
  rationale: Ở đây ἱκανός nói về số lượng đáng kể; “nhiều” diễn đạt gọn và đúng nghĩa hơn “đủ”.
- source_word: ἐν τῷ ὑπερῴῳ
  choice: trong căn phòng trên lầu
  rationale: ὑπερῷον là phòng nằm ở phần trên của ngôi nhà; cách dịch này rõ nghĩa, hiện đại và tránh sắc thái cổ của “phòng cao”.
- source_word: οὗ
  choice: nơi
  rationale: Đại từ trạng ngữ quan hệ chỉ địa điểm được diễn đạt tự nhiên bằng “nơi”.
- source_word: ἦμεν συνηγμένοι
  choice: chúng tôi đang tụ họp
  rationale: Kết cấu gồm động từ ở thì chưa hoàn thành và phân từ hoàn thành bị động mô tả nhóm người trong trạng thái đã quy tụ và đang ở cùng nhau; “đang tụ họp” truyền đạt tự nhiên trạng thái ấy mà không nặng nề.
theological_decisions: []
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng vừa phải và dễ hiểu. Đưa cụm chỉ nơi chốn lên đầu giúp câu kể tự nhiên, đồng thời giữ đầy đủ quan hệ giữa căn phòng và nơi nhóm người tụ họp.
