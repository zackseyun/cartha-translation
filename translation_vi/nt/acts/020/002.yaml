  terminology: “Khích lệ” giữ được sắc thái rộng của παρακαλέω, không áp đặt nghĩa hẹp là an ủi hay răn dạy. Chú thích cần tránh cụm “hết lời khuyên bảo,” vốn không tự nhiên và có thể gợi nghĩa đã nói cạn lời; thay bằng “khuyên bảo họ nhiều.”
