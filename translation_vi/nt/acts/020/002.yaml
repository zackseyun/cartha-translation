  text: διελθὼν δὲ τὰ μέρη ἐκεῖνα καὶ παρακαλέσας αὐτοὺς λόγῳ πολλῷ ἦλθεν εἰς τὴν Ἑλλάδα
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/002.yaml
  text: After passing through those regions and encouraging them with many words[a], he came into Greece.
translation:
  language: vi
  text: Sau khi đi qua các vùng ấy và khích lệ họ bằng nhiều lời[a], ông đến Hy Lạp.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “khích lệ họ rất lâu” hoặc “khuyên bảo họ nhiều”; nguyên văn Hy Lạp là “bằng nhiều lời”.
    reason: lexical_alternative
lexical_decisions:
- source_word: διελθὼν
  choice: Sau khi đi qua
  rationale: Phân từ bất định diễn tả hành động xảy ra trước động từ chính; cách dịch này giữ đúng trình tự và tự nhiên trong tiếng Việt.
- source_word: τὰ μέρη ἐκεῖνα
  choice: những miền ấy
  rationale: μέρη chỉ các vùng hay miền địa lý; “những miền ấy” là cách diễn đạt trang trọng, dễ hiểu.
- source_word: παρακαλέσας
  choice: khích lệ
  rationale: παρακαλέω có thể mang nghĩa khích lệ, khuyên bảo hoặc an ủi. Trong bối cảnh Phao-lô củng cố các tín hữu, “khích lệ” giữ được nghĩa mục vụ rộng mà không thu hẹp thành quở trách.
- source_word: αὐτοὺς
  choice: họ
  rationale: Đại từ này chỉ các tín hữu trong những miền vừa được nhắc đến.
- source_word: λόγῳ πολλῷ
  choice: dùng nhiều lời
  rationale: Cụm từ theo sát nghĩa đen là “bằng nhiều lời/lời nói nhiều”; cách dịch này bảo toàn hình thức từ vựng và để chú thích nêu các sắc thái tự nhiên hơn.
- source_word: ἦλθεν εἰς τὴν Ἑλλάδα
  choice: ông đến Hy Lạp
  rationale: Diễn đạt tự nhiên chuyển động tới Hy Lạp trong tiếng Việt; chủ ngữ “ông” nối tiếp nhân vật Phao-lô từ ngữ cảnh.
- source_word: δὲ
  choice: Sau khi
  rationale: δέ là liên từ chuyển tiếp nhẹ; sắc thái nối tiếp được hòa vào cấu trúc thời gian “Sau khi…”, tránh câu văn gượng.
theological_decisions: []
