  source_fidelity: Bản dịch truyền đạt đúng trình tự của phân từ διελθών (“Sau khi đi qua”), đối tượng địa lý τὰ μέρη ἐκεῖνα, hành động khích lệ/khuyên nhủ, và điểm đến là Hy Lạp. Tuy nhiên, đặt “bằng nhiều lời” sát với “khích lệ họ” phản ánh trực tiếp hơn cấu trúc παρακαλέσας αὐτοὺς λόγῳ πολλῷ.
