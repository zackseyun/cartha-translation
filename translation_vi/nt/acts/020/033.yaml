  text: ἀργυρίου ἢ χρυσίου ἢ ἱματισμοῦ οὐδενὸς ἐπεθύμησα·
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/033.yaml
  text: I coveted no one's silver or gold or clothing[a].
translation:
  language: vi
  text: Tôi không tham muốn bạc, vàng hay quần áo của bất cứ ai.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Tôi không mong muốn bạc, vàng hay quần áo của bất cứ ai.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀργυρίου
  choice: bạc
  rationale: Giữ nghĩa cụ thể của danh từ chỉ bạc, song song với vàng và quần áo là những tài sản có giá trị.
- source_word: χρυσίου
  choice: vàng
  rationale: Cách dịch trực tiếp và tự nhiên, giữ cấu trúc liệt kê các tài sản quý.
- source_word: ἱματισμοῦ
  choice: quần áo
  rationale: Cách nói hiện đại, thông dụng cho y phục, tự nhiên hơn những từ trang trọng hoặc cổ.
- source_word: οὐδενὸς
  choice: của bất cứ ai
  rationale: Thể hiện rõ quan hệ sở hữu do dạng sở hữu cách trong tiếng Hy Lạp, đồng thời kết hợp tự nhiên với câu phủ định tiếng Việt.
- source_word: ἐπεθύμησα
  choice: tham muốn
  rationale: Diễn đạt ham muốn sai trái đối với tài sản của người khác, giữ sắc thái đạo đức trong lời Phao-lô biện hộ về sự liêm chính của mình mà không quá cổ.
- source_word: ἢ ... ἢ ... ἢ
  choice: bạc, vàng hay quần áo
  rationale: Trong câu phủ định tiếng Việt, dấu phẩy kết hợp với “hay” tạo một chuỗi liệt kê tự nhiên mà vẫn giữ quan hệ lựa chọn của các liên từ Hy Lạp.
theological_decisions:
- issue: Sắc thái đạo đức của ἐπιθυμέω đối với tài sản vật chất
  choice: Dịch là “tham muốn” để chỉ ham muốn không đúng đối với tài sản của người khác.
  alternative: “mong muốn” hoặc “ham muốn” bạc, vàng hay quần áo của bất cứ ai
  rationale: Ngữ cảnh là lời Phao-lô khẳng định sự liêm chính và không tham lợi. “Tham muốn” giữ sắc thái đạo đức có khả năng hiện diện trong động từ, nhưng chú thích vẫn bảo tồn cách hiểu trung tính hơn về mặt từ vựng.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng vừa phải và dễ hiểu. Đại từ “Tôi” phù hợp với lời phát biểu trực tiếp của Phao-lô; “quần áo” tự nhiên hơn “y phục”, còn “tham muốn” vừa rõ nghĩa vừa giữ sắc thái đạo đức của ngữ cảnh.
