  to: Vì vậy, hãy luôn tỉnh thức, nhớ rằng suốt ba năm, đêm ngày, tôi không ngừng khuyên bảo[a] từng người trong nước mắt.
  rationale: Chỉnh «lấy nước mắt mà khuyên bảo» thành «khuyên bảo từng người trong nước mắt» để diễn đạt tự nhiên và sát hơn quan hệ «với/trong nước mắt» của μετὰ δακρύων. Chú thích được chỉnh cho nhất quán ngữ pháp và để các phương án từ vựng không lặp nội dung câu chính.
