review_pass:
  verdict: revise
  source_fidelity: Bản dịch truyền đạt đúng mạch suy luận của διό, mệnh lệnh liên tục γρηγορεῖτε, thời lượng ba năm, tính liên tục «đêm ngày», sự chăm sóc từng cá nhân và sắc thái đầy nước mắt. Tuy nhiên, «lấy nước mắt mà» có thể gợi ý nước mắt là phương tiện được dùng để khuyên bảo, thay vì sự đồng hành/tâm trạng được μετὰ δακρύων diễn tả.
  naturalness: «Hãy luôn tỉnh thức» và phần còn lại nhìn chung tự nhiên, trang trọng vừa phải. «Trong nước mắt» là cách nói Việt ngữ tự nhiên hơn và gắn rõ nước mắt với hoạt động khuyên bảo.
  terminology: «Khuyên bảo» là lựa chọn có thể chấp nhận cho νουθετῶν, giữ được nét hướng dẫn có tính sửa bảo mà không thu hẹp thành chỉ «cảnh cáo». Chú thích nên nêu các tương đương ở dạng động từ/cụm động từ nhất quán và không lặp lại thành phần «từng người» vốn đã có trong câu chính.
