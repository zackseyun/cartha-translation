source:
  edition: SBLGNT
  text: διὸ γρηγορεῖτε, μνημονεύοντες ὅτι τριετίαν νύκτα καὶ ἡμέραν οὐκ ἐπαυσάμην μετὰ δακρύων νουθετῶν ἕνα ἕκαστον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/031.yaml
  text: Therefore stay alert[a], remembering that for three years, night and day, I did not stop admonishing each one with tears.
translation:
  language: vi
  text: Vì vậy, hãy luôn tỉnh thức, nhớ rằng suốt ba năm, đêm ngày, tôi không ngừng khuyên bảo[a] từng người trong nước mắt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “cảnh báo” hoặc “răn bảo”. Động từ Hy Lạp có thể nhấn mạnh lời cảnh báo nhằm sửa sai cũng như sự chỉ dạy.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: Vì vậy
  rationale: Giữ rõ quan hệ suy luận từ lời cảnh báo ngay trước đó, đồng thời tự nhiên trong tiếng Việt hiện đại.
- source_word: γρηγορεῖτε
  choice: hãy luôn tỉnh thức
  rationale: Mệnh lệnh hiện tại diễn tả sự cảnh giác liên tục; “luôn” làm rõ sắc thái kéo dài mà không biến hình ảnh thành thức giấc theo nghĩa đen.
- source_word: μνημονεύοντες
  choice: nhớ rằng
  rationale: Chuyển phân từ hiện tại thành cách nối tự nhiên trong tiếng Việt, vẫn gắn việc tỉnh thức với việc nhớ lại gương phục vụ của Phao-lô.
- source_word: τριετίαν
  choice: suốt ba năm
  rationale: Diễn đạt tự nhiên đối cách chỉ khoảng thời gian và nhấn mạnh tính liên tục trong toàn bộ thời kỳ.
- source_word: νύκτα καὶ ἡμέραν
  choice: đêm ngày
  rationale: Giữ thứ tự của nguyên văn và diễn tả hoạt động bền bỉ, liên tục bằng thành ngữ tiếng Việt tự nhiên.
- source_word: οὐκ ἐπαυσάμην
  choice: tôi không ngừng
  rationale: Truyền đạt trực tiếp ý Phao-lô không hề ngơi việc này trong khoảng thời gian được nhắc đến.
- source_word: μετὰ δακρύων
  choice: lấy nước mắt mà
  rationale: Giữ hình ảnh nước mắt đi cùng sự phục vụ, đồng thời kết nối tự nhiên với động từ trong tiếng Việt trang trọng, dễ hiểu.
- source_word: νουθετῶν
  choice: khuyên bảo
  rationale: Bao quát sự chỉ dạy có tính sửa bảo và cảnh tỉnh; tránh thu hẹp nghĩa chỉ còn cảnh báo hoặc chỉ truyền đạt kiến thức.
- source_word: ἕνα ἕκαστον
  choice: từng người
  rationale: Giữ sức nhấn phân phối của cụm Hy Lạp, làm nổi bật sự quan tâm đến từng cá nhân mà không thêm “trong anh em” vốn không được nói trực tiếp.
theological_decisions:
- issue: Sắc thái mục vụ của νουθετῶν
  choice: khuyên bảo
  alternative: cảnh cáo; răn bảo; chỉ dạy
  rationale: “Khuyên bảo” giữ được tính cá nhân và mục vụ trong lời nói của Phao-lô, còn chú thích bảo tồn rõ sắc thái sửa sai/cảnh báo vốn có thể nổi bật trong động từ Hy Lạp.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Hãy luôn tỉnh thức” truyền đạt mệnh lệnh cảnh giác liên tục; “lấy nước mắt mà khuyên bảo” bảo tồn sức nặng tình cảm và mục vụ của câu.
