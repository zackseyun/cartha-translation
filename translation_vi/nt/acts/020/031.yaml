  - severity: low
    issue: Diễn đạt chú thích từ vựng chưa nhất quán
    rationale: «Cảnh tỉnh» là danh/cụm từ không song hành trực tiếp với động từ «khuyên bảo», còn «răn bảo từng người» lặp phần bổ ngữ của câu chính. Nên dùng các lựa chọn động từ độc lập như «cảnh báo» hoặc «răn bảo».
