  text: καὶ νῦν ἰδοὺ ⸂δεδεμένος ἐγὼ⸃ τῷ πνεύματι πορεύομαι εἰς Ἰερουσαλήμ, τὰ ἐν αὐτῇ συναντήσοντά ⸀μοι μὴ εἰδώς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/022.yaml
  text: And now, behold, bound in the Spirit, I am going to Jerusalem, not knowing what will happen to me there,
translation:
  language: vi
  text: Và bây giờ, kìa, tôi bị ràng buộc trong Thánh Linh[a] mà đi Giê-ru-sa-lem, không biết điều gì sẽ xảy đến với mình ở đó.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “bị ràng buộc trong tinh thần”; cụm từ Hy Lạp có thể chỉ tinh thần của chính Phao-lô hoặc Thánh Linh. Cũng có thể hiểu là “được Thánh Linh thôi thúc.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδοὺ
  choice: này
  rationale: Giữ chức năng nhấn mạnh và báo hiệu sự chuyển ý trang trọng của tiểu từ, đồng thời tự nhiên hơn trong tiếng Việt hiện đại so với cách dịch quá cổ.
- source_word: δεδεμένος
  choice: bị ràng buộc
  rationale: Giữ hình ảnh trực tiếp của phân từ hoàn thành thụ động từ δέω, không thu hẹp nghĩa thành chỉ 'được thúc giục' hay 'bị thôi thúc'.
- source_word: τῷ πνεύματι
  choice: trong Thánh Linh
  rationale: Theo ngữ cảnh sách Công Vụ, Thánh Linh có khả năng là đối tượng được nói đến; giới từ 'trong' giữ tương đối sát cấu trúc Hy Lạp và tránh diễn giải quá mạnh thành tác nhân với 'bởi/do'. Tính mơ hồ thật sự được ghi nhận trong chú thích.
- source_word: πορεύομαι
  choice: tôi đang đi đến
  rationale: Diễn đạt tự nhiên hành động đang diễn tiến hoặc sắp được thực hiện của động từ hiện tại chỉ sự di chuyển.
- source_word: τὰ ἐν αὐτῇ συναντήσοντά μοι
  choice: điều gì sẽ xảy đến với mình tại đó
  rationale: Chuyển thành tiếng Việt tự nhiên ý đen 'những điều ở đó sẽ gặp tôi', đồng thời giữ sắc thái những biến cố đang chờ đợi Phao-lô tại Giê-ru-sa-lem.
- source_word: μὴ εἰδώς
  choice: mà không biết
  rationale: Thể hiện rõ quan hệ của phân từ với hành động đi đến Giê-ru-sa-lem và phù hợp cú pháp tiếng Việt.
- source_word: Ἰερουσαλήμ
  choice: Giê-ru-sa-lem
  rationale: Dùng dạng phiên âm Kinh Thánh quen thuộc trong tiếng Việt.
theological_decisions:
- issue: Đối tượng được chỉ đến bởi τῷ πνεύματι
  choice: Hiểu nhiều khả năng là Thánh Linh, dịch 'trong Thánh Linh'
  alternative: Có thể hiểu là tâm linh của chính Phao-lô; cũng có thể nhấn mạnh tác nhân và dịch 'do Thánh Linh ràng buộc' hoặc diễn ý 'được Thánh Linh thôi thúc'.
  rationale: Cách dùng trong Công Vụ và câu kế tiếp nghiêng về sự hướng dẫn của Thánh Linh, nhưng cấu trúc cách dữ liệu không buộc phải chọn duy nhất cách hiểu ấy. Bản dịch chính giữ lối diễn đạt gần nguyên văn, còn chú thích bảo tồn cách hiểu khác.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Từ “này” giữ sắc thái nhấn mạnh của lời phát biểu; “bị ràng buộc” bảo tồn hình ảnh mạnh của nguyên văn. Dấu chú thích [a] được đặt ngay sau cụm từ có tính mơ hồ.
