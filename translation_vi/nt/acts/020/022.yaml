- from: Và giờ đây, này, bị ràng buộc trong Thánh Linh[a], tôi đang đi đến Giê-ru-sa-lem mà không biết điều gì sẽ xảy đến với mình tại đó.
  to: Và bây giờ, kìa, tôi bị ràng buộc trong Thánh Linh[a] mà đi Giê-ru-sa-lem, không biết điều gì sẽ xảy đến với mình ở đó.
  rationale: Chỉnh nhẹ để bản văn Việt tự nhiên hơn, đồng thời duy trì sát nghĩa hình ảnh “bị ràng buộc” và sự mơ hồ ngữ pháp về τῷ πνεύματι. Chú thích được làm rõ về lựa chọn hiểu là tinh thần của Phao-lô, không áp đặt cách giải thích đó lên bản văn chính.
  reviewer_model: gpt-5.6-terra
