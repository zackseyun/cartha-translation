revisions:
- from: Vì vậy, hôm nay tôi long trọng làm chứng với anh em rằng tôi vô can về huyết của mọi người[a][b].
  to: Vì vậy, hôm nay tôi long trọng làm chứng với anh em rằng tôi không mang tội về huyết của mọi người[a][b].
  rationale: Chỉ sửa một kết hợp từ chưa tự nhiên. Bản sửa bảo tồn cấu trúc, hình ảnh “huyết,” tính trang trọng, và hàm ý tội lỗi/trách nhiệm của nguyên văn, không biến câu thành lời giải nghĩa về cái chết thể xác hay áp đặt một cách hiểu giáo phái.
