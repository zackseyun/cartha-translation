  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸀διότι μαρτύρομαι ὑμῖν ἐν τῇ σήμερον ἡμέρᾳ ὅτι καθαρός ⸀εἰμι ἀπὸ τοῦ αἵματος πάντων,
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/026.yaml
  text: Therefore I testify to you on this day that I am innocent of the blood of all[a][b].
translation:
  language: vi
  text: Vì vậy, hôm nay tôi long trọng làm chứng với anh em rằng tôi không mang tội về huyết của mọi người[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch sát là “sạch khỏi huyết của mọi người”; thành ngữ Hy Lạp nói đến việc không mang tội hoặc trách nhiệm liên quan đến số phận của người khác.
    reason: lexical_alternative
  - marker: b
    text: Cách nói này có lẽ gợi lại hình ảnh người canh gác trong sách Ê-xê-chi-ên và trách nhiệm về huyết (xem Ê-xê-chi-ên 3:18–19; 33:6–9).
    reason: cross_reference
lexical_decisions:
- source_word: διότι
  choice: Vì vậy
  rationale: Trong mạch văn, từ này nêu kết luận từ lời Phao-lô vừa nói; “Vì vậy” tự nhiên và giữ rõ quan hệ suy luận.
- source_word: μαρτύρομαι
  choice: tôi long trọng làm chứng
  rationale: Động từ ở đây diễn tả lời chứng mang tính cá nhân và trang nghiêm; thêm “long trọng” giúp chuyển tải sắc thái mạnh mà vẫn tự nhiên trong tiếng Việt.
- source_word: ὑμῖν
  choice: với anh em
  rationale: Đại từ số nhiều chỉ những người đang nghe Phao-lô. “Anh em” phù hợp với lối xưng hô trong cộng đồng tín hữu và ngữ cảnh ông nói với các trưởng lão.
- source_word: ἐν τῇ σήμερον ἡμέρᾳ
  choice: hôm nay
  rationale: Diễn đạt tự nhiên trong tiếng Việt hiện đại, đồng thời vẫn giữ thời điểm trang trọng của lời tuyên bố.
- source_word: ὅτι
  choice: rằng
  rationale: Dẫn vào nội dung lời chứng một cách tự nhiên và chính xác.
- source_word: καθαρός
  choice: vô can
  rationale: Trong thành ngữ đi với “huyết”, từ này nói đến việc không mang tội hoặc trách nhiệm. “Vô can” giữ sắc thái pháp lý–đạo đức rõ hơn cách dịch thuần chữ là “sạch”.
- source_word: εἰμι
  choice: tôi ...
  rationale: Ý nghĩa của động từ nối được thể hiện tự nhiên trong cấu trúc tiếng Việt “tôi vô can” mà không cần một từ tương đương riêng cho “là”.
- source_word: ἀπὸ τοῦ αἵματος
  choice: về huyết
  rationale: Giữ hình ảnh “huyết” của nguyên văn và âm hưởng Kinh Thánh, trong khi “vô can về” diễn đạt sự không chịu tội hay trách nhiệm.
- source_word: πάντων
  choice: của mọi người
  rationale: Giữ phạm vi rộng của dạng số nhiều, không thu hẹp thành một nhóm cụ thể.
theological_decisions:
- issue: Ý nghĩa của “vô can về huyết của mọi người”
  choice: Giữ thành ngữ về việc không mang tội hay trách nhiệm đối với số phận của người khác, vì Phao-lô đã chu toàn bổn phận cảnh báo và giảng dạy.
  alternative: Chỉ nói đến việc không trực tiếp can dự vào cái chết thể xác của bất cứ ai.
  rationale: Ngữ cảnh kế tiếp nói đến việc Phao-lô không tránh né công bố toàn bộ ý định của Đức Chúa Trời; hình ảnh này cũng gợi lại trách nhiệm của người canh gác trong Ê-xê-chi-ên. Bản dịch giữ hình ảnh “huyết” thay vì giải nghĩa hoàn toàn trong câu chính.
translation_notes:
  register: Tiếng Việt hiện đại, trang nghiêm và dễ hiểu. Cụm “long trọng làm chứng” giữ sức nặng của lời tuyên bố; “vô can về huyết” vừa bảo tồn hình ảnh Kinh Thánh vừa cho thấy ý niệm không mắc tội hay trách nhiệm.
