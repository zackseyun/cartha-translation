id: ACT.20.29
reference: Acts 20:29
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐγὼ ⸀οἶδα ὅτι εἰσελεύσονται μετὰ τὴν ἄφιξίν μου λύκοι βαρεῖς εἰς ὑμᾶς μὴ φειδόμενοι τοῦ ποιμνίου,
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/029.yaml
  text: I know that after my departure fierce wolves will come in among you[b][a], not sparing the flock.
translation:
  language: vi
  text: Tôi biết rằng sau khi tôi ra đi[a], những con sói hung dữ[b] sẽ vào giữa anh em và không dung tha bầy chiên.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát chữ: “sau khi tôi đến/việc tôi đến”; trong ngữ cảnh, ý là “sau khi tôi ra đi.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “những con sói tàn bạo.” Tính từ Hy Lạp có thể diễn tả sự khắc nghiệt, áp bức hoặc hung bạo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἶδα
  choice: Tôi biết
  rationale: Diễn đạt sự biết chắc chắn của Phao-lô một cách trực tiếp, tự nhiên, không hạ nhẹ thành ý kiến hay phỏng đoán.
- source_word: εἰσελεύσονται
  choice: sẽ vào
  rationale: Giữ ý chuyển động đi vào cộng đồng; kết hợp với “giữa anh em” để diễn đạt tự nhiên trong tiếng Việt.
- source_word: μετὰ τὴν ἄφιξίν μου
  choice: sau khi tôi ra đi
  rationale: Danh từ ἄφιξις thường chỉ việc đến, nhưng mạch văn nói về điều xảy ra khi Phao-lô không còn ở với họ; “ra đi” chuyển tải ý theo ngữ cảnh, đồng thời chú thích bảo lưu nghĩa sát chữ.
- source_word: λύκοι βαρεῖς
  choice: những con sói hung dữ
  rationale: Giữ nguyên hình ảnh ẩn dụ “sói”; βαρεῖς ở đây biểu thị mức độ khắc nghiệt, nguy hiểm, nên “hung dữ” rõ ràng và tự nhiên hơn cách dịch sát chữ “nặng”.
- source_word: εἰς ὑμᾶς
  choice: giữa anh em
  rationale: Trong hình ảnh sói đi vào đàn, cụm này chỉ sự xâm nhập vào giữa cộng đồng; “giữa anh em” truyền đạt đúng quan hệ ấy.
- source_word: μὴ φειδόμενοι
  choice: không dung tha
  rationale: Diễn đạt ngắn gọn thái độ tàn nhẫn, không chừa hay nương tay đối với bầy chiên.
- source_word: τοῦ ποιμνίου
  choice: bầy chiên
  rationale: Giữ hình ảnh mục tử nhất quán với “sói” và cách dùng ẩn dụ về cộng đồng tín hữu.
theological_decisions:
- issue: Ý nghĩa ẩn dụ của “sói”
  choice: Giữ nguyên “những con sói hung dữ” trong chính văn.
  alternative: Diễn giải thành “những kẻ dạy dỗ sai lạc”, “những kẻ phá hoại” hoặc “những kẻ áp bức”.
  rationale: Câu Hy Lạp dùng ẩn dụ nhưng chưa xác định cụ thể những con sói là ai; giữ hình ảnh bảo toàn sức cảnh báo và tránh thu hẹp nghĩa.
- issue: Nghĩa của ἄφιξις trong ngữ cảnh
  choice: Dịch “sau khi tôi ra đi”.
  alternative: Dịch sát nghĩa từ vựng thông thường là “sau khi tôi đến”.
  rationale: Ngữ cảnh là lời cảnh báo về điều sẽ xảy ra khi Phao-lô rời họ. Bản dịch theo ngữ cảnh giúp câu dễ hiểu, còn chú thích nêu rõ khó khăn từ vựng để không che giấu sự căng thẳng của nguyên văn.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh em” cho đại từ số nhiều chỉ cộng đồng được Phao-lô ngỏ lời; giữ nhất quán hình ảnh “sói” và “bầy chiên”.
