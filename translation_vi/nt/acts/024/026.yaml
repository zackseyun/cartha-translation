  terminology: Tên riêng “Phê-lích”, “Phao-lô” và từ ngữ “tiền” phù hợp. Giữ “tiền” trong chính văn là thận trọng về mặt từ vựng; chú thích nêu khả năng “tiền hối lộ” phản ánh hàm ý ngữ cảnh mà không áp đặt vào bản văn nguồn.
