  source_fidelity: 'Bản dịch truyền đạt đúng quan hệ thời gian (ἅμα καί), hy vọng đang diễn ra của Phê-lích, tiền từ Phao-lô, hệ quả dẫn đến việc cho gọi thường xuyên hơn, và sự trò chuyện. Tuy nhiên, cụm “Phao-lô sẽ đưa tiền cho mình” tạo mơ hồ quy chiếu đáng kể trong tiếng Việt: “mình” có thể được hiểu là quy về chủ ngữ gần nhất, Phao-lô, trái với αὐτῷ (“cho Phê-lích”).'
