language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἅμα καὶ ἐλπίζων ὅτι χρήματα δοθήσεται αὐτῷ ὑπὸ τοῦ ⸀Παύλου· διὸ καὶ πυκνότερον αὐτὸν μεταπεμπόμενος ὡμίλει αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/026.yaml
  text: At the same time he was hoping that money would be given to him by Paul[a]; therefore he also sent for him more often and talked with him.
translation:
  language: vi
  text: Đồng thời, Phê-lích cũng hy vọng rằng Phao-lô sẽ đưa tiền cho ông[a]. Vì thế, ông cho gọi Phao-lô đến thường xuyên hơn và trò chuyện với ông.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay, nói cụ thể hơn theo ngữ cảnh: “hy vọng nhận tiền hối lộ từ Phao-lô.” Tiếng Hy Lạp chỉ nói là “tiền.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἅμα καὶ
  choice: Đồng thời, Phê-lích cũng
  rationale: Cụm từ diễn tả sự đồng thời với diễn biến trước đó. Nêu lại Phê-lích giúp câu tiếng Việt rõ chủ thể; “cũng” phản ánh καί một cách tự nhiên.
- source_word: ἐλπίζων
  choice: hy vọng
  rationale: Phân từ hiện tại diễn tả sự mong đợi kéo dài của Phê-lích, đồng thời với việc ông nhiều lần cho gọi Phao-lô.
- source_word: χρήματα
  choice: tiền
  rationale: Danh từ Hy Lạp nói đơn giản là “tiền”. Ngữ cảnh ngụ ý tiền hối lộ, nhưng bản văn không dùng một từ chuyên biệt mang nghĩa ấy.
- source_word: δοθήσεται αὐτῷ ὑπὸ τοῦ Παύλου
  choice: Phao-lô sẽ đưa tiền cho mình
  rationale: Tiếng Việt tự nhiên ưu tiên câu chủ động, trong khi vẫn giữ rõ Phao-lô là người Phê-lích mong sẽ trao tiền và Phê-lích là người nhận.
- source_word: διὸ καὶ
  choice: Vì thế
  rationale: “Vì thế” giữ quan hệ nguyên nhân–kết quả giữa hy vọng nhận tiền và việc Phê-lích gọi Phao-lô đến thường xuyên hơn; sắc thái bổ sung của καί đã được thể hiện tự nhiên trong mạch văn.
- source_word: πυκνότερον
  choice: thường xuyên hơn
  rationale: Giữ đúng dạng so sánh của trạng từ, chỉ tần suất gia tăng.
- source_word: μεταπεμπόμενος
  choice: cho gọi Phao-lô đến
  rationale: Động từ trung thái có nghĩa sai người đi gọi hoặc triệu người nào đến. “Cho gọi ... đến” phù hợp địa vị của Phê-lích và hoàn cảnh Phao-lô đang bị giam.
- source_word: ὡμίλει αὐτῷ
  choice: trò chuyện với ông
  rationale: ὁμιλέω chỉ sự trao đổi, chuyện trò, không phải một bài diễn thuyết trang trọng. Đại từ “ông” duy trì giọng văn tôn trọng.
theological_decisions:
- issue: Có nên nói rõ động cơ tham nhũng của Phê-lích bằng từ “hối lộ” trong chính văn hay không
  choice: Giữ “tiền” trong chính văn và để ngữ cảnh cho thấy hàm ý tiền hối lộ
  alternative: Phê-lích hy vọng Phao-lô sẽ hối lộ mình / hy vọng nhận tiền hối lộ từ Phao-lô
  rationale: Bối cảnh cho thấy rõ động cơ vụ lợi, nhưng χρήματα chỉ có nghĩa là “tiền”. Cách dịch này không làm nhẹ động cơ của Phê-lích mà vẫn tránh nói cụ thể hơn bản văn nguồn.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “cho gọi ... đến” để phản ánh bối cảnh hành chính–giam giữ; dùng “trò chuyện” để giữ sắc thái đối thoại lặp lại. Tên riêng được phiên âm theo lối quen thuộc trong Kinh Thánh tiếng Việt.
