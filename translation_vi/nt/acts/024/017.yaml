  text: δι’ ἐτῶν δὲ πλειόνων ⸂ἐλεημοσύνας ποιήσων εἰς τὸ ἔθνος μου παρεγενόμην⸃ καὶ προσφοράς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/017.yaml
  text: After several years I came to bring alms to my nation[a], and offerings.
translation:
  language: vi
  text: Sau nhiều năm, tôi đến để đem quà từ thiện[a] cho dân tộc mình và dâng các lễ vật.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “của bố thí”; từ Hy Lạp chỉ những món quà từ thiện dành cho người thiếu thốn.
    reason: lexical_alternative
lexical_decisions:
- source_word: δι’ ἐτῶν δὲ πλειόνων
  choice: Sau nhiều năm
  rationale: Cụm διά với sở hữu cách diễn tả một khoảng thời gian đã trôi qua; πλειόνων trong văn cảnh mang nghĩa “nhiều/một số năm”. δέ chỉ nối ý nhẹ nên không cần dịch thành một từ tương phản rõ nét.
- source_word: ἐλεημοσύνας
  choice: quà cứu trợ
  rationale: Danh từ này chỉ việc bố thí hay những món quà từ thiện dành cho người thiếu thốn. “Quà cứu trợ” rõ nghĩa và tự nhiên trong tiếng Việt hiện đại.
- source_word: ποιήσων
  choice: để mang
  rationale: Dạng phân từ chỉ mục đích. Khi đi với ἐλεημοσύνας, ποιέω tạo thành cách nói về việc thực hiện sự bố thí; trong bối cảnh Phao-lô đến Giê-ru-sa-lem, “mang quà cứu trợ” diễn đạt tự nhiên hành động ấy.
- source_word: εἰς τὸ ἔθνος μου
  choice: cho dân tộc mình
  rationale: ἔθνος ở đây nói đến dân tộc Do Thái, dân của chính Phao-lô. “Dân tộc mình” giữ được sắc thái tập thể của từ Hy Lạp.
- source_word: παρεγενόμην
  choice: tôi đến
  rationale: παραγίνομαι ở đây chỉ việc đi đến hoặc có mặt tại một nơi; “tôi đến” ngắn gọn và không thêm ý “trở về” vốn không được nói rõ trong động từ.
- source_word: προσφοράς
  choice: dâng các lễ vật
  rationale: προσφοράς chỉ các lễ vật, thường trong bối cảnh thờ phượng. Thêm động từ “dâng” để câu tiếng Việt tự nhiên, nhưng không xác định loại lễ vật khi nguyên văn không nói rõ.
theological_decisions:
- issue: Bản chất hoạt động từ thiện của Phao-lô tại Giê-ru-sa-lem
  choice: Dịch ἐλεημοσύνας là “quà cứu trợ”.
  alternative: “của bố thí” hoặc “quà từ thiện”
  rationale: Lựa chọn này nêu rõ đây là sự giúp đỡ vật chất dành cho người thiếu thốn mà không biến nó thành một thuật ngữ giáo phái hay xác định quá mức đối tượng nhận.
- issue: Tính chất của προσφοράς
  choice: Giữ cách gọi rộng là “các lễ vật”.
  alternative: “các tế lễ” hoặc “lễ vật dâng lên Đức Chúa Trời”
  rationale: Nguyên văn không xác định loại lễ vật; cách dịch rộng bảo toàn sự hàm hồ và để bối cảnh đền thờ cung cấp ý nghĩa.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Câu giữ cấu trúc tự thuật của Phao-lô, tránh từ cổ và tránh giải thích quá mức ngay trong chính văn.
