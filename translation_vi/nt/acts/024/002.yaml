- from: 'Khi Phao-lô được gọi vào, Tẹt-tu-lu bắt đầu cáo buộc ông rằng: “Nhờ ngài, chúng tôi được hưởng nền thái bình lâu dài, và nhờ sự lo liệu trước của ngài, nhiều cải cách đang được thực hiện cho dân tộc này[a].”'
  to: 'Khi Phao-lô được gọi vào, Tẹt-tu-lu bắt đầu cáo buộc ông, nói rằng: “Vì nhờ ngài, chúng tôi đang được hưởng sự bình an lớn lao[a], và nhờ sự tiên liệu của ngài, các cải cách đang được thực hiện cho dân tộc này[b],”'
  rationale: Sửa các chỗ thêm nghĩa (“lâu dài,” và sự nhấn mạnh số lượng trong “nhiều cải cách”), đồng thời dùng từ ngữ hiện đại, tự nhiên hơn cho πρόνοια. Tách chú thích để mỗi neo gắn rõ với cụm từ được chú giải. Dấu phẩy cuối câu được giữ vì câu nói tiếp tục sang câu kế tiếp.
