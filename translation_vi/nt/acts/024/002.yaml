source:
  edition: SBLGNT
  text: κληθέντος δὲ αὐτοῦ ἤρξατο κατηγορεῖν ὁ Τέρτυλλος λέγων· Πολλῆς εἰρήνης τυγχάνοντες διὰ σοῦ καὶ ⸀διορθωμάτων γινομένων τῷ ἔθνει τούτῳ διὰ τῆς σῆς προνοίας
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/002.yaml
  text: 'And when he had been summoned[a], Tertullus began to accuse him, saying: “Since through you we are enjoying much peace[b], and reforms are being brought to this nation through your foresight,”'
translation:
  language: vi
  text: 'Khi Phao-lô được gọi vào, Tẹt-tu-lu bắt đầu cáo buộc ông, nói rằng: “Vì nhờ ngài, chúng tôi đang được hưởng sự bình an lớn lao[a], và nhờ sự tiên liệu của ngài, các cải cách đang được thực hiện cho dân tộc này[b],”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “chúng tôi được hưởng nhiều sự bình an.” Cụm này là lời tâng bốc về sự yên ổn mà người nói quy cho tổng đốc.'
    reason: lexical_alternative
  - marker: b
    text: “Các cải cách” cũng có thể dịch là “những sự cải thiện” hoặc “những biện pháp sửa đổi.” “Sự tiên liệu” cũng có thể dịch là “sự dự liệu” hoặc “sự khôn ngoan thận trọng”; từ Hy Lạp ở đây nói về sự dự liệu hay điều hành của một nhà cầm quyền, không nhất thiết là sự quan phòng theo nghĩa thần học.
    reason: lexical_alternative
lexical_decisions:
- source_word: κληθέντος δὲ αὐτοῦ
  choice: Khi Phao-lô được gọi vào
  rationale: Đây là kết cấu sở hữu cách tuyệt đối nêu hoàn cảnh trước hành động chính. Nêu rõ Phao-lô để tránh đại từ mơ hồ trong tiếng Việt; “được gọi vào” tự nhiên trong bối cảnh xét xử.
- source_word: ἤρξατο κατηγορεῖν
  choice: bắt đầu cáo buộc
  rationale: Giữ đúng sắc thái khởi đầu của ἤρξατο và ý nghĩa pháp lý trực tiếp của κατηγορεῖν.
- source_word: ὁ Τέρτυλλος
  choice: Tẹt-tu-lu
  rationale: Phiên âm tên riêng theo cách đọc dễ tiếp cận đối với độc giả tiếng Việt.
- source_word: Πολλῆς εἰρήνης τυγχάνοντες διὰ σοῦ
  choice: Nhờ ngài, chúng tôi được hưởng nền thái bình lâu dài
  rationale: “Nhờ ngài” diễn đạt tác nhân/phương tiện của διά với sở hữu cách. Trong lời tâng bốc chính trị này, πολλῆς nói đến mức độ lớn; “nền thái bình lâu dài” truyền đạt tự nhiên sắc thái ấy trong tiếng Việt.
- source_word: διορθωμάτων γινομένων τῷ ἔθνει τούτῳ
  choice: nhiều cải cách đang được thực hiện cho dân tộc này
  rationale: διόρθωμα chỉ biện pháp sửa đổi hoặc cải thiện; “cải cách” phù hợp bối cảnh hành chính. Cách diễn đạt giữ quá trình đang diễn ra của γινομένων và lợi ích hướng đến dân tộc.
- source_word: διὰ τῆς σῆς προνοίας
  choice: nhờ sự lo liệu trước của ngài
  rationale: πρόνοια ở đây chỉ sự dự liệu và quản trị có tính toán của một nhà cầm quyền. “Sự lo liệu trước” tránh hàm ý thần học dễ phát sinh từ “sự quan phòng”.
theological_decisions:
- issue: Cách dịch πρόνοια trong ngữ cảnh hành chính, không phải thần học
  choice: sự lo liệu trước
  alternative: sự quan phòng; sự tiên liệu; sự khôn ngoan thận trọng
  rationale: Người nói đang tâng bốc khả năng dự liệu và điều hành của tổng đốc Phê-lích, không khẳng định sự quan phòng của Đức Chúa Trời. Cách chọn giữ ý dự liệu mà không đưa thêm nội hàm thần học.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu; giữ giọng tâng bốc mang tính pháp đình của Tẹt-tu-lu. Dùng “ngài” cho lời thưa với tổng đốc. Dấu chân chú [a] được đặt ngay sau mệnh đề chứa cả hai từ ngữ cần chú giải.
