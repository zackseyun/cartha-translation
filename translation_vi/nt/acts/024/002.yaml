    rationale: Cụm này khá gượng trong tiếng Việt hiện đại. “Sự tiên liệu” tự nhiên hơn và vẫn biểu đạt πρόνοια là khả năng dự liệu/điều hành của người cầm quyền, không hàm ý quan phòng thần học.
