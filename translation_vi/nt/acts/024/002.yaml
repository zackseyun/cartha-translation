    rationale: Πολλῆς diễn tả mức độ (“nhiều/lớn lao”), không diễn tả thời lượng. “Lâu dài” là ý thêm.
  - severity: low
    issue: “nhiều cải cách”
    rationale: διορθωμάτων là số nhiều, nhưng không có từ nào tương ứng trực tiếp với “nhiều”; “các cải cách” phản ánh số nhiều mà không tăng cường số lượng.
