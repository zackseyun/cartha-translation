base_translation:
  language: en
  yaml_path: translation/nt/acts/024/013.yaml
  text: Nor can they prove to you the things of which they are now accusing me[a].
translation:
  language: vi
  text: Họ cũng không thể chứng minh trước ngài những điều họ đang cáo buộc tôi[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “trình ra trước ngài” hoặc “xác lập trước ngài”; động từ Hy Lạp có thể mang nghĩa trình ra hoặc xác lập một điều, ở đây là chứng thực một lời cáo buộc pháp lý.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲ
  choice: cũng không
  rationale: Nối tiếp lời biện hộ ở câu trước bằng một phủ định bổ sung; cách diễn đạt này tự nhiên trong tiếng Việt.
- source_word: παραστῆσαι
  choice: chứng minh
  rationale: Trong bối cảnh pháp lý, động từ mang nghĩa đưa ra hoặc xác lập bằng chứng để chứng thực lời cáo buộc; “chứng minh” truyền đạt rõ sức nặng pháp đình, còn nghĩa rộng hơn được giữ trong chú thích.
- source_word: δύνανταί
  choice: có thể
  rationale: Diễn đạt trực tiếp khả năng, phù hợp với cách dùng hiện đại.
- source_word: σοι
  choice: trước ngài
  rationale: Đại từ chỉ Phê-lích, người đang xét xử; “trước ngài” tự nhiên trong bối cảnh trình bày chứng cứ trước nhà chức trách.
- source_word: περὶ ὧν
  choice: những điều
  rationale: Chỉ các sự việc mà đối phương dùng để cáo buộc Phao-lô, không thu hẹp quá mức thành một danh mục tội danh cụ thể.
- source_word: νυνὶ
  choice: đang
  rationale: Kết hợp với động từ để thể hiện lời cáo buộc hiện đang được đưa ra trong phiên xét xử.
- source_word: κατηγοροῦσίν μου
  choice: họ đang cáo buộc tôi
  rationale: Giữ rõ sắc thái pháp lý của κατηγορέω và đối tượng ngôi thứ nhất của lời cáo buộc.
