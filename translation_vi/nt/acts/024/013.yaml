  register: Văn phong hiện đại, trang trọng và dễ hiểu; dùng “ngài” phù hợp khi Phao-lô thưa với tổng đốc Phê-lích. Cấu trúc câu giữ tính cô đọng của nguyên văn và không thêm nội dung ngoài văn bản.
