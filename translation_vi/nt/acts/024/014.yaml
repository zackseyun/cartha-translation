id: ACT.24.14
reference: Acts 24:14
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁμολογῶ δὲ τοῦτό σοι ὅτι κατὰ τὴν ὁδὸν ἣν λέγουσιν αἵρεσιν οὕτως λατρεύω τῷ πατρῴῳ θεῷ, πιστεύων πᾶσι τοῖς κατὰ τὸν νόμον καὶ ⸂τοῖς ἐν⸃ τοῖς προφήταις γεγραμμένοις,
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/014.yaml
  text: But I confess this to you[a], that according to the Way, which they call a sect, so I worship the God of our fathers, believing everything written in the Law and in the Prophets[b],
translation:
  language: vi
  text: 'Nhưng tôi thừa nhận với ngài điều này: tôi thờ phượng Đức Chúa Trời của tổ tiên chúng ta theo Đạo mà họ gọi là một giáo phái[a], và tin mọi điều được chép trong Luật Pháp và trong các sách Tiên Tri[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hy Lạp cũng có thể dịch là “một phe phái”; ở đây không nhất thiết mang nghĩa “tà giáo” về sau.
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “trong Luật Pháp và trong các Tiên Tri”, cách gọi hai phần của Kinh Thánh Israel.'
    reason: cultural_context
lexical_decisions:
- source_word: ὁμολογῶ
  choice: tôi thừa nhận
  rationale: Trong bối cảnh biện hộ trước Phê-lít, động từ diễn tả sự công khai xác nhận, không nhất thiết là nhận tội; “thừa nhận” giữ được sắc thái pháp lý tự nhiên trong tiếng Việt.
- source_word: κατὰ τὴν ὁδόν
  choice: theo Đạo
  rationale: ὁδός là danh xưng lịch sử của phong trào môn đồ Chúa Giê-su trong Công Vụ; viết hoa “Đạo” vừa tự nhiên vừa bảo tồn chức năng danh xưng.
- source_word: αἵρεσιν
  choice: một giáo phái
  rationale: Ở đây từ này chỉ một nhóm hay phái bị đối phương gán nhãn, chưa mang nghĩa kỹ thuật về “tà giáo” như về sau.
- source_word: οὕτως λατρεύω
  choice: tôi thờ phượng ... theo Đạo
  rationale: οὕτως liên kết cách Phao-lô thờ phượng với “Đạo” vừa nêu. Cấu trúc tiếng Việt đưa “theo Đạo” lên trước bổ ngữ để thể hiện mối liên hệ này mà tránh cách dịch máy móc “như thế”.
- source_word: τῷ πατρῴῳ θεῷ
  choice: Đức Chúa Trời của tổ tiên chúng ta
  rationale: πατρῷος có nghĩa “thuộc về tổ tiên/được truyền lại từ tổ tiên”; thêm “chúng ta” làm rõ sự liên tục chung với đức tin của dân Israel trong lời Phao-lô nói với viên tổng đốc.
- source_word: πιστεύων
  choice: và tin
  rationale: Phân từ hiện tại bổ sung đặc điểm gắn liền với sự thờ phượng của Phao-lô; nối bằng “và” tạo câu tiếng Việt tự nhiên mà không tách rời hai ý.
- source_word: πᾶσι τοῖς ... γεγραμμένοις
  choice: mọi điều được chép
  rationale: Diễn đạt đầy đủ tính toàn thể của πᾶσι và trạng thái thành văn của phân từ hoàn thành γεγραμμένοις.
- source_word: κατὰ τὸν νόμον καὶ τοῖς ἐν τοῖς προφήταις
  choice: trong Luật Pháp và trong các sách Tiên Tri
  rationale: Hai cụm chỉ các phần Kinh Thánh Do Thái. “Các sách Tiên Tri” giúp độc giả hiện đại hiểu đây là khối sách, không chỉ là lời nói của các cá nhân.
theological_decisions:
- issue: Mối quan hệ giữa Đạo và đức tin Israel
  choice: Phao-lô thờ phượng Đức Chúa Trời của tổ tiên Israel theo Đạo và tin toàn bộ Luật Pháp cùng các sách Tiên Tri.
  alternative: Trình bày Đạo như một tôn giáo tách biệt và đối lập với Do Thái giáo.
  rationale: 'Câu Hy Lạp nhấn mạnh sự liên tục: chính theo “Đạo” bị gọi là một phái mà Phao-lô thờ phượng Đức Chúa Trời của tổ tiên và tin Kinh Thánh Israel.'
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Dùng “ngài” phù hợp với lời Phao-lô thưa trước tổng đốc; viết hoa “Đạo”, “Luật Pháp” và “Tiên Tri” để biểu thị các danh xưng và khối Kinh Thánh trong ngữ cảnh.
