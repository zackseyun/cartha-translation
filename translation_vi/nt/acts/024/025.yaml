id: ACT.24.25
reference: Acts 24:25
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: διαλεγομένου δὲ αὐτοῦ περὶ δικαιοσύνης καὶ ἐγκρατείας καὶ τοῦ κρίματος τοῦ ⸀μέλλοντος ἔμφοβος γενόμενος ὁ Φῆλιξ ἀπεκρίθη· Τὸ νῦν ἔχον πορεύου, καιρὸν δὲ μεταλαβὼν μετακαλέσομαί σε·
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/025.yaml
  text: But as he was discussing righteousness and self-control and the coming judgment, Felix became afraid and answered, “For now, go away. When I get an opportunity, I will summon you.”
translation:
  language: vi
  text: 'Nhưng khi Phao-lô trình bày về sự công chính, sự tự chủ và cuộc phán xét sắp đến, Phê-lích trở nên sợ hãi và đáp: “Bây giờ anh hãy đi. Khi có dịp, tôi sẽ cho gọi anh.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διαλεγομένου
  choice: trình bày
  rationale: Trong ngữ cảnh Phao-lô nói và lý luận trước Phê-lích, từ này chỉ việc diễn giải, bàn luận có lý lẽ; “trình bày” tự nhiên và không hàm ý một cuộc đối thoại cân bằng.
- source_word: δικαιοσύνης
  choice: sự công chính
  rationale: Giữ phạm vi đạo đức và thần học của δικαιοσύνη, thay vì thu hẹp thành sự công bằng xã hội hoặc hành vi ngay thẳng.
- source_word: ἐγκρατείας
  choice: sự tự chủ
  rationale: Diễn đạt đức tính chế ngự ham muốn và hành vi bằng thuật ngữ tiếng Việt hiện đại, rõ nghĩa.
- source_word: τοῦ κρίματος τοῦ μέλλοντος
  choice: cuộc phán xét sắp đến
  rationale: Μέλλοντος bổ nghĩa cho κρίματος, nói đến sự phán xét trong tương lai; “sắp đến” giữ sắc thái hướng tới biến cố đang đến.
- source_word: ἔμφοβος γενόμενος
  choice: trở nên sợ hãi
  rationale: Phản ánh cả sự chuyển biến được diễn tả bởi γενόμενος và mức độ sợ hãi của ἔμφοβος.
- source_word: Τὸ νῦν ἔχον
  choice: Bây giờ
  rationale: Thành ngữ có nghĩa “trong lúc này/hiện giờ”; cách nói ngắn gọn phù hợp lời thoại tiếng Việt.
- source_word: καιρὸν μεταλαβών
  choice: Khi có dịp
  rationale: Diễn đạt tự nhiên ý tìm được hoặc có được một thời điểm thuận tiện, không khẳng định Phê-lích chắc chắn sẽ dành thời gian.
- source_word: μετακαλέσομαί σε
  choice: tôi sẽ cho gọi anh
  rationale: Tiền tố μετα- trong ngữ cảnh này mang ý triệu gọi lại; “cho gọi” phù hợp vị thế của quan tổng đốc đối với Phao-lô.
theological_decisions:
- issue: Phạm vi ý nghĩa của δικαιοσύνη
  choice: sự công chính
  alternative: lẽ công chính / sự ngay thẳng
  rationale: “Sự công chính” giữ được chiều kích đạo đức và thần học của từ mà không buộc câu vào một cách giải thích giáo phái cụ thể.
- issue: Tính chất của cuộc phán xét tương lai
  choice: cuộc phán xét sắp đến
  alternative: sự phán xét mai sau
  rationale: Bản dịch giữ nguyên lời khẳng định về sự phán xét đang đến nhưng không thêm chủ thể, thời điểm hay cơ chế mà câu Hy Lạp không nêu.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng tên quen thuộc “Phao-lô” và “Phê-lích”; lời Phê-lích dùng đại từ “tôi—anh” phù hợp quan hệ quyền lực trong bối cảnh mà không quá cổ.
source_grounding:
  english_pob_role: consult_only
