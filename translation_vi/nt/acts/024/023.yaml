  register: Văn phong kể chuyện trang trọng nhưng hiện đại. Câu giữ sự tương phản giữa việc bị giam giữ và được hưởng chế độ nới lỏng; tránh xác định quá mức danh tính của τῶν ἰδίων αὐτοῦ.
