source:
  edition: SBLGNT
  text: ⸀διαταξάμενος τῷ ἑκατοντάρχῃ τηρεῖσθαι ⸀αὐτὸν ἔχειν τε ἄνεσιν καὶ μηδένα κωλύειν τῶν ἰδίων αὐτοῦ ⸀ὑπηρετεῖν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/023.yaml
  text: And he ordered the centurion to keep him in custody[a], yet to let him have some freedom[b], and to prevent none of his own people from attending to his needs.
translation:
  language: vi
  text: Rồi ông ra lệnh cho viên đại đội trưởng giam giữ Phao-lô, nhưng cho ông được tự do phần nào[a], và không ngăn cản bất cứ ai trong số những người của ông[b] giúp đỡ ông.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “được nới lỏng” hoặc “được dễ chịu hơn.” Từ Hy Lạp có thể chỉ sự nhẹ nhõm, dễ chịu, hoặc một mức tự do khỏi sự giam giữ nghiêm ngặt.'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “những người của ông.” Cụm này có lẽ chỉ các bạn hữu, cộng sự hoặc người ủng hộ của Phao-lô, những người được phép giúp đỡ ông.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διαταξάμενος
  choice: ông ra lệnh
  rationale: Chuyển phân từ bất định quá khứ thành động từ chính để câu kể tự nhiên trong tiếng Việt, đồng thời giữ rõ sắc thái mệnh lệnh.
- source_word: τῷ ἑκατοντάρχῃ
  choice: cho viên đại đội trưởng
  rationale: Chỉ viên sĩ quan La Mã chỉ huy khoảng một trăm quân; “đại đội trưởng” là cách gọi dễ hiểu và phù hợp ngữ cảnh quân sự cổ.
- source_word: τηρεῖσθαι αὐτόν
  choice: giam giữ Phao-lô
  rationale: Trong ngữ cảnh pháp lý, τηρέω nói đến việc giữ dưới sự canh giữ. Nêu tên Phao-lô giúp tiếng Việt rõ chủ thể mà không thay đổi nghĩa.
- source_word: ἔχειν τε ἄνεσιν
  choice: nhưng cho ông được đôi phần tự do
  rationale: ἄνεσις có thể là sự nới lỏng, dễ chịu hoặc tự do khỏi sự hạn chế. “Đôi phần tự do” diễn đạt chế độ giam giữ được nới lỏng chứ không phải phóng thích hoàn toàn.
- source_word: μηδένα κωλύειν
  choice: không được ngăn cản bất cứ người ... nào
  rationale: Giữ trọn lực phủ định phổ quát của μηδένα và sắc thái cấm ngăn trở của κωλύειν.
- source_word: τῶν ἰδίων αὐτοῦ
  choice: người thân cận nào của ông
  rationale: Cụm Hy Lạp theo nghĩa đen là “những người thuộc về ông”, không xác định họ là thân nhân, bạn bè hay cộng sự. “Người thân cận” giữ phạm vi tương đối rộng.
- source_word: ὑπηρετεῖν αὐτῷ
  choice: phục vụ ông
  rationale: Giữ nghĩa rộng là phục vụ hoặc giúp đỡ, không thu hẹp thành một loại nhu cầu cụ thể và không mang sắc thái chức vụ giáo hội.
