id: ACT.24.24
reference: Acts 24:24
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Μετὰ δὲ ἡμέρας τινὰς παραγενόμενος ὁ Φῆλιξ σὺν Δρουσίλλῃ τῇ ⸀ἰδίᾳ γυναικὶ οὔσῃ Ἰουδαίᾳ μετεπέμψατο τὸν Παῦλον καὶ ἤκουσεν αὐτοῦ περὶ τῆς εἰς Χριστὸν ⸀Ἰησοῦν πίστεως.
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/024.yaml
  text: After some days[a], Felix came with Drusilla, his own wife, who was Jewish[b], and sent for Paul and heard him concerning faith in Messiah Jesus.
translation:
  language: vi
  text: Vài ngày sau, Phê-lít đến với Đơ-ru-si-la, vợ ông, là người Do Thái. Ông cho gọi Phao-lô và nghe ông nói về đức tin nơi Đấng Mê-si-a Giê-su.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “đức tin nơi Đấng Christ Giê-su”; “đức tin” ở đây cũng có thể diễn đạt là “lòng tin cậy.”
    reason: Nêu cách gọi truyền thống cho Χριστός và sắc thái từ vựng gần nghĩa của πίστις.
lexical_decisions:
- source_word: Μετὰ δὲ ἡμέρας τινὰς
  choice: Vài ngày sau
  rationale: Diễn đạt tự nhiên thành ngữ thời gian với μετά + đối cách; δέ chỉ nối tiếp nhẹ trong mạch kể nên không cần dịch thành một từ riêng.
- source_word: παραγενόμενος
  choice: đến
  rationale: Phân từ chỉ việc Phê-lít đến hoặc có mặt; “đến” ngắn gọn và tự nhiên trong văn kể.
- source_word: σὺν Δρουσίλλῃ τῇ ἰδίᾳ γυναικὶ
  choice: đến cùng Đơ-ru-si-la, vợ ông
  rationale: σύν chỉ sự đi cùng. Trong tiếng Việt, “vợ ông” đã biểu đạt tự nhiên quan hệ sở hữu; thêm “chính” sẽ gây nhấn mạnh gượng gạo.
- source_word: οὔσῃ Ἰουδαίᾳ
  choice: là người Do Thái
  rationale: Mệnh đề phân từ bổ nghĩa cho Đơ-ru-si-la, nêu căn tính Do Thái bằng cách nói hiện đại, trung tính.
- source_word: μετεπέμψατο
  choice: cho gọi ... đến
  rationale: Phản ánh nghĩa sai người đi gọi hoặc triệu đến, đồng thời tự nhiên trong tiếng Việt.
- source_word: ἤκουσεν αὐτοῦ περὶ
  choice: nghe ông nói về
  rationale: ἀκούω với sở hữu cách có thể là nghe hoặc lắng nghe người ấy; thêm “nói” làm rõ cấu trúc tiếng Việt mà không thêm nội dung chủ đề.
- source_word: πίστεως
  choice: đức tin
  rationale: Trong cấu trúc với εἰς, πίστις chỉ lòng tin hướng về một đối tượng; “đức tin” là cách diễn đạt quen thuộc và trang trọng.
- source_word: εἰς Χριστὸν Ἰησοῦν
  choice: nơi Đấng Mê-si-a là Đức Chúa Jêsus
  rationale: εἰς diễn tả đức tin hướng đến; Χριστός được dịch theo nghĩa tước hiệu “Đấng Mê-si-a,” còn cấu trúc “là ... Jêsus” diễn đạt rõ quan hệ tước hiệu–tên riêng trong tiếng Việt.
theological_decisions:
- issue: Cách dịch Χριστός
  choice: Đấng Mê-si-a
  alternative: Đấng Christ
  rationale: Ở đây Χριστός vẫn mang chức năng tước hiệu. “Đấng Mê-si-a” chuyển tải nghĩa tước hiệu thay vì chỉ phiên âm; cách truyền thống “Đấng Christ” được ghi ở chú thích.
- issue: Ý nghĩa τῆς εἰς Χριστὸν Ἰησοῦν πίστεως
  choice: đức tin nơi Đấng Mê-si-a là Đức Chúa Jêsus
  alternative: lòng tin cậy nơi Đấng Mê-si-a là Đức Chúa Jêsus
  rationale: πίστις + εἰς + đối cách tự nhiên nhất là đức tin hướng về Đức Chúa Jêsus, không phải sự thành tín của Ngài. Sắc thái “tin cậy” vẫn là một khả năng từ vựng gần nghĩa.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. Giữ tên riêng theo lối viết Kinh Thánh Việt ngữ quen thuộc; dùng câu tách nhẹ để tránh chuỗi mệnh đề dài và làm rõ chủ thể của hành động cho gọi.
