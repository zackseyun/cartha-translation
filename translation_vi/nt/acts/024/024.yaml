  to: Vài ngày sau, Phê-lít đến với Đơ-ru-si-la, vợ ông, là người Do Thái. Ông cho gọi Phao-lô và nghe ông nói về đức tin nơi Đấng Mê-si-a Giê-su.[a]
  rationale: Bản sửa loại bỏ tước hiệu “Đức Chúa” không hiện diện trong nguyên văn, giữ Χριστός là tước hiệu được dịch là “Đấng Mê-si-a,” và điều chỉnh vài cách diễn đạt cho tiếng Việt hiện đại mà vẫn bảo toàn nghĩa. Chú thích được giữ tại cụm mà nó giải thích.
