  terminology: Nên giữ Χριστός là “Đấng Mê-si-a” theo chính sách dịch tước hiệu, và dùng tên riêng “Giê-su” mà không thêm “Đức Chúa”. “đức tin nơi” diễn đạt thích hợp πίστεως εἰς.
  issues:
