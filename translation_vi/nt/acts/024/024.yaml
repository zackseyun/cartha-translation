    issue: Thêm tước hiệu “Đức Chúa” trong “Đức Chúa Jêsus”.
    rationale: Nguyên văn SBLGNT chỉ viết Χριστὸν Ἰησοῦν (“Đấng Mê-si-a Giê-su”), không có κύριος. Việc thêm “Đức Chúa” vượt quá văn bản nguồn.
  - severity: low
    issue: “đến cùng” có sắc thái cổ trong văn phong mục tiêu hiện đại.
    rationale: σὺν được dịch tự nhiên là “đến với”; thay đổi này không làm mất nghĩa đồng hành.
  - severity: low
    issue: “cho gọi Phao-lô đến” thêm hướng chuyển động không cần thiết.
    rationale: μετεπέμψατο nghĩa là “cho gọi/sai gọi”; “cho gọi Phao-lô” phản ánh sát và tự nhiên hơn.
  revised_text: Vài ngày sau, Phê-lít đến với Đơ-ru-si-la, vợ ông, là người Do Thái. Ông cho gọi Phao-lô và nghe ông nói về đức tin nơi Đấng Mê-si-a Giê-su.[a]
