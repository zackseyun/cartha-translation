translation:
  language: vi
  text: Hoặc chính những người này hãy nói xem họ đã tìm thấy hành vi sai trái nào nơi tôi khi tôi đứng trước Hội đồng[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “trước Thượng Hội đồng Do Thái.” Từ Hy Lạp συνέδριον chỉ hội đồng lãnh đạo Do Thái.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἢ
  choice: Hoặc
  rationale: Mở ra một phương án thách thức khác trong lời biện hộ của Phao-lô, giữ sát lực nối của tiếng Hy Lạp.
- source_word: αὐτοὶ οὗτοι
  choice: chính những người này
  rationale: Diễn đạt cả ý chỉ định lẫn sắc thái nhấn mạnh một cách tự nhiên trong tiếng Việt.
- source_word: εἰπάτωσαν
  choice: hãy nói
  rationale: Thể mệnh lệnh ngôi thứ ba trong văn cảnh pháp lý; cách diễn đạt trực tiếp và tự nhiên.
- source_word: τί εὗρον ἀδίκημα
  choice: họ đã tìm thấy tôi có hành vi sai trái nào
  rationale: ἀδίκημα chỉ một việc làm sai trái hay hành vi vi phạm; cách dịch này giữ phạm vi nghĩa rộng hơn 'tội phạm' và phù hợp văn cảnh xét xử.
- source_word: στάντος μου
  choice: khi tôi đứng
  rationale: Diễn đạt giá trị thời gian của phân từ bất định trong kết cấu sở hữu cách.
- source_word: ἐπὶ τοῦ συνεδρίου
  choice: trước Hội đồng
  rationale: Chỉ việc Phao-lô trình diện trước hội đồng lãnh đạo Do Thái; 'Hội đồng' dễ hiểu trong chính văn, còn tên chuyên biệt được nêu ở chú thích.
