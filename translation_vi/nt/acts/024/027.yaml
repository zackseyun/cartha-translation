  to: Sau khi đã trọn hai năm, Pô-xi-ô Phê-tu lên kế nhiệm Phê-lích. Vì muốn lấy lòng người Do Thái[a], Phê-lích đã để Phao-lô lại, vẫn bị trói buộc.
  rationale: Bản sửa thay dạng tên riêng sai lệch bằng “Pô-xi-ô,” điều chỉnh cách diễn đạt thời gian và tình trạng của Phao-lô cho tự nhiên hơn, đồng thời giữ nguyên quan hệ nguyên nhân và tính mơ hồ ngữ nghĩa của χάριτα καταθέσθαι trong chú thích.
