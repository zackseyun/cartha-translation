  text: Διετίας δὲ πληρωθείσης ἔλαβεν διάδοχον ὁ Φῆλιξ Πόρκιον Φῆστον· θέλων τε ⸀χάριτα καταθέσθαι τοῖς Ἰουδαίοις ὁ Φῆλιξ κατέλιπε τὸν Παῦλον δεδεμένον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/027.yaml
  text: But when two years had been completed[a], Felix was succeeded by Porcius Festus; and because Felix wanted to lay up favor with the Jews, he left Paul bound.
translation:
  language: vi
  text: Sau khi đã trọn hai năm, Pô-xi-ô Phê-tu lên kế nhiệm Phê-lích. Vì muốn lấy lòng người Do Thái[a], Phê-lích đã để Phao-lô lại, vẫn bị trói buộc.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “làm một ân huệ cho người Do Thái.” Cụm từ Hy Lạp có thể chỉ việc ban cho họ một ân huệ hoặc tìm cách giành được thiện cảm của họ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Διετίας ... πληρωθείσης
  choice: khi hai năm đã mãn
  rationale: Cấu trúc sở hữu cách tuyệt đối nêu hoàn cảnh thời gian; “đã mãn” giữ ý một thời hạn hai năm đã hoàn tất và tự nhiên trong tiếng Việt.
- source_word: ἔλαβεν διάδοχον
  choice: lên kế nhiệm
  rationale: Thành ngữ Hy Lạp theo nghĩa đen là Phê-lích “nhận một người kế nhiệm”; diễn đạt theo chủ động với người kế nhiệm làm chủ ngữ tự nhiên và rõ nghĩa hơn trong tiếng Việt.
- source_word: Πόρκιον Φῆστον
  choice: Bốt-xi-út Phê-tu
  rationale: Phiên âm tên riêng theo cách đọc quen thuộc và dễ nhận biết trong tiếng Việt.
- source_word: θέλων
  choice: Vì muốn
  rationale: Phân từ chỉ động cơ của hành động chính, nên dịch bằng quan hệ nguyên nhân để ý nghĩa được sáng rõ.
- source_word: χάριτα καταθέσθαι
  choice: lấy lòng
  rationale: Cụm từ có thể chỉ việc tìm kiếm thiện cảm hoặc làm một ân huệ. “Lấy lòng” diễn đạt tự nhiên ý tìm cách gây thiện cảm; nghĩa còn lại được giữ trong chú thích.
- source_word: τοῖς Ἰουδαίοις
  choice: người Do Thái
  rationale: Đối tượng mà Phê-lích muốn gây thiện cảm được diễn đạt tự nhiên sau động từ “lấy lòng”.
- source_word: κατέλιπε
  choice: để ... lại
  rationale: Diễn tả việc Phê-lích rời chức nhưng vẫn để Phao-lô trong tình trạng hiện có, không hàm thêm sắc thái bỏ rơi.
- source_word: δεδεμένον
  choice: trong cảnh bị trói
  rationale: Giữ sát trạng thái tiếp diễn của phân từ hoàn thành bị động, đồng thời không cụ thể hóa quá mức thành loại xiềng xích nào hay thay bằng khái niệm rộng hơn là tù giam.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu được tách làm hai để tránh cấu trúc quá nặng; tên riêng được phiên âm nhất quán. Chú thích giữ lại tính đa nghĩa thực sự của χάριτα καταθέσθαι.
