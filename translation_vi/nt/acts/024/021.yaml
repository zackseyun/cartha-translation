language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἢ περὶ μιᾶς ταύτης φωνῆς ἧς ἐκέκραξα ⸂ἐν αὐτοῖς ἑστὼς⸃ ὅτι Περὶ ἀναστάσεως νεκρῶν ἐγὼ κρίνομαι σήμερον ⸀ἐφ’ ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/021.yaml
  text: 'or about this one statement that I shouted while standing among them: ‘It is concerning the resurrection of the dead that I am being judged before you today.’[a][b]'
translation:
  language: vi
  text: 'hay về một lời này mà tôi đã kêu lớn khi đứng giữa họ: “Về sự sống lại của người chết mà hôm nay tôi đang bị xét xử trước mặt quý vị.”[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “tiếng nói này” hoặc “lời kêu này”; từ Hy Lạp có thể chỉ chính lời được thốt ra hoặc tiếng nói, tiếng kêu dùng để thốt lời ấy.
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “sự sống lại từ giữa những người chết.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνῆς
  choice: lời
  rationale: Trong cấu trúc với περὶ và mệnh đề nêu nội dung theo sau, từ này chỉ lời được thốt ra; “lời” tự nhiên trong tiếng Việt và vẫn có thể gợi sắc thái tiếng nói.
- source_word: ἐκέκραξα
  choice: tôi đã lớn tiếng nói
  rationale: κράζω diễn tả việc cất tiếng mạnh và công khai; cách dịch này giữ được cường độ mà không mang sắc thái giận dữ quá mức như “la hét”.
- source_word: ἐν αὐτοῖς ἑστὼς
  choice: khi đứng giữa họ
  rationale: Giữ cả ý hoàn cảnh của phân từ ἑστώς lẫn vị trí ở giữa nhóm người được nói đến.
- source_word: ἀναστάσεως νεκρῶν
  choice: sự sống lại của người chết
  rationale: Giữ sát cấu trúc sở hữu cách và phạm vi khái quát của cụm Hy Lạp, không tự ý thu hẹp vào riêng sự sống lại của Chúa Giê-su.
- source_word: κρίνομαι
  choice: tôi bị xét xử
  rationale: Thể hiện hiện tại bị động trong bối cảnh pháp đình bằng cách nói tự nhiên, rõ nghĩa trong tiếng Việt.
- source_word: ἐφ’ ὑμῶν
  choice: trước mặt quý vị
  rationale: Trong ngữ cảnh tư pháp, cụm này diễn tả việc ra trước nhà chức trách để được xét xử; cách dịch tránh khẳng định quá mức rằng chính mọi người nghe đều là tác nhân xét xử.
- source_word: ἢ
  choice: hay
  rationale: Nối với lời biện hộ ở câu trước và giữ nguyên tính mở của liên từ, không thêm ý “ngoại trừ” vào chính văn.
- source_word: μιᾶς ταύτης
  choice: duy nhất này
  rationale: Truyền đạt sự nhấn mạnh vào một lời cụ thể, duy nhất.
- source_word: σήμερον
  choice: hôm nay
  rationale: Cách diễn đạt thời gian tự nhiên và chính xác trong tiếng Việt hiện đại.
theological_decisions:
- issue: Bản chất của vấn đề gây tranh chấp
  choice: Giữ cách nói khái quát “sự sống lại của người chết”.
  alternative: Hiểu và dịch cụ thể là sự sống lại của Chúa Giê-su.
  rationale: περὶ ἀναστάσεως νεκρῶν có phạm vi khái quát. Dù sách Công Vụ liên hệ niềm hy vọng này với sự sống lại của Chúa Giê-su, câu này không nói rõ như vậy, nên không thu hẹp ý trong chính văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Quý vị” phù hợp khi Phao-lô kính cẩn nói trước một nhóm người trong bối cảnh xét xử; “lớn tiếng nói” giữ sức mạnh của động từ mà không tạo sắc thái thô hoặc giận dữ.
