  text: παρ’ οὗ δυνήσῃ αὐτὸς ἀνακρίνας περὶ πάντων τούτων ἐπιγνῶναι ὧν ἡμεῖς κατηγοροῦμεν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/008.yaml
  text: From him[a], by examining him yourself[b], you will be able to learn about all these things of which we accuse him.
translation:
  language: vi
  text: Chính ngài, sau khi thẩm vấn ông ấy, sẽ có thể biết rõ từ ông ấy về mọi điều mà chúng tôi tố cáo ông ấy.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Chính ngài, sau khi thẩm vấn ông ấy, sẽ có thể xác minh từ ông ấy về mọi điều mà chúng tôi tố cáo ông ấy.”'
    reason: lexical_alternative
  - marker: b
    text: Một số thủ bản có thêm lời ở câu 7 nói rằng viên chỉ huy Ly-si-a đã dùng sức mạnh đem Phao-lô đi và ra lệnh cho những người tố cáo ông đến trước Phê-lích; bản SBLGNT không có phần này.
    reason: textual_variant
lexical_decisions:
- source_word: παρ’ οὗ
  choice: từ người ấy
  rationale: παρά với sở hữu cách chỉ nguồn thông tin. Cách dịch này giữ đúng nghĩa rằng Phê-lích có thể trực tiếp nhận biết sự việc từ chính Phao-lô.
- source_word: δυνήσῃ
  choice: có thể
  rationale: Động từ ở thì tương lai nói đến khả năng của người được thưa chuyện; tiếng Việt tự nhiên thường không cần thêm từ chỉ tương lai khi ngữ cảnh đã rõ.
- source_word: αὐτὸς
  choice: chính ngài
  rationale: Đại từ mang tính nhấn mạnh, cho thấy đích thân Phê-lích có thể tiến hành việc thẩm vấn.
- source_word: ἀνακρίνας
  choice: thẩm vấn
  rationale: Trong bối cảnh pháp lý, ἀνακρίνω chỉ việc xét hỏi hoặc thẩm tra. “Thẩm vấn” vừa tự nhiên vừa giữ sắc thái tư pháp.
- source_word: περὶ πάντων τούτων
  choice: mọi điều
  rationale: Diễn đạt tự nhiên ý “về tất cả những điều này”; đối tượng của việc biết rõ được gắn trực tiếp với mệnh đề tố cáo.
- source_word: ἐπιγνῶναι
  choice: biết rõ
  rationale: ἐπιγινώσκω ở đây có nghĩa đi đến chỗ nhận biết hoặc xác minh. “Biết rõ” giữ được sắc thái nhận biết chắc chắn mà không quá chuyên môn.
- source_word: ὧν ἡμεῖς κατηγοροῦμεν αὐτοῦ
  choice: mà chúng tôi đang tố cáo người ấy
  rationale: κατηγορέω với sở hữu cách mang nghĩa tố cáo một người về các điều đã nêu. Cấu trúc này rõ ràng và tự nhiên trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ngài” phù hợp lời biện hộ trước quan tổng đốc; dùng “người ấy” để tránh lặp tên nhưng vẫn phân biệt rõ người bị tố cáo.
