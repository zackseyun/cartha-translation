  text: as you are able to ascertain[a], that it has been no more than twelve days since I went up to Jerusalem to worship,
translation:
  language: vi
  text: Ngài có thể xác minh rằng, kể từ khi tôi lên Giê-ru-sa-lem để thờ phượng, đến nay chưa quá mười hai ngày.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δυναμένου σου ἐπιγνῶναι
  choice: Ngài có thể xác minh
  rationale: Cụm sở hữu cách tuyệt đối với δύναμαι và động từ nguyên mẫu nói đến khả năng của Phê-lích trong việc kiểm chứng sự việc; “xác minh” phù hợp với bối cảnh pháp lý.
- source_word: οὐ πλείους εἰσίν μοι ἡμέραι δώδεκα
  choice: tính đến nay chưa quá mười hai ngày
  rationale: Diễn đạt tự nhiên ý khoảng thời gian đã trôi qua, đồng thời giữ giới hạn “không quá mười hai ngày” của nguyên văn.
- source_word: ἀφ’ ἧς
  choice: kể từ khi
  rationale: Đánh dấu thời điểm bắt đầu của khoảng thời gian.
- source_word: ἀνέβην
  choice: tôi lên
  rationale: Giữ cách nói quy ước “lên Giê-ru-sa-lem” trong Kinh Thánh.
- source_word: προσκυνήσων
  choice: để thờ phượng
  rationale: Phân từ tương lai diễn tả mục đích; không thêm đối tượng “Đức Chúa Trời” vì nguyên văn để hàm ẩn.
- source_word: εἰς Ἰερουσαλήμ
  choice: Giê-ru-sa-lem
  rationale: Tên địa danh được chuyển tự theo cách quen thuộc trong tiếng Việt; hướng đích đã được thể hiện tự nhiên trong cụm “lên Giê-ru-sa-lem”.
