id: ACT.24.16
reference: Acts 24:16
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐν τούτῳ ⸀καὶ αὐτὸς ἀσκῶ ἀπρόσκοπον συνείδησιν ⸀ἔχειν πρὸς τὸν θεὸν καὶ τοὺς ἀνθρώπους διὰ παντός.
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/016.yaml
  text: In view of this[a], I myself also strive always to have a blameless conscience before God and men.
translation:
  language: vi
  text: Vì vậy, chính tôi cũng luôn cố gắng giữ một lương tâm không chỗ trách được trước Đức Chúa Trời và mọi người.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: Vì vậy
  rationale: Cụm từ nối kết câu này với niềm hy vọng được nêu ở câu trước và mang sắc thái suy luận; “Vì vậy” tự nhiên, rõ nghĩa trong tiếng Việt.
- source_word: καὶ αὐτὸς
  choice: chính tôi cũng
  rationale: “cũng” bảo toàn ý bổ sung của καί, còn “chính tôi” thể hiện sắc thái nhấn mạnh của αὐτός.
- source_word: ἀσκῶ
  choice: cố gắng
  rationale: Động từ diễn tả việc chuyên tâm, rèn luyện hoặc nỗ lực bền bỉ; “cố gắng” là cách nói hiện đại, tự nhiên trong ngữ cảnh đạo đức.
- source_word: ἀπρόσκοπον
  choice: không vấp phạm
  rationale: Tính từ có thể chỉ tình trạng không gây vấp ngã, không phạm lỗi hay không gây cớ xúc phạm. “Không vấp phạm” giữ được hình ảnh và sắc thái luân lý mà không khẳng định sự vô tội tuyệt đối.
- source_word: συνείδησιν
  choice: lương tâm
  rationale: Đây là từ tương đương thông dụng và chính xác cho ý thức đạo đức bên trong.
- source_word: ἔχειν
  choice: giữ
  rationale: Dịch theo nghĩa duy trì trong cấu trúc chỉ mục tiêu của sự cố gắng; “giữ lương tâm” tự nhiên hơn “có lương tâm” trong tiếng Việt ở ngữ cảnh này.
- source_word: πρὸς τὸν θεὸν καὶ τοὺς ἀνθρώπους
  choice: trước Đức Chúa Trời và mọi người
  rationale: πρός diễn tả mối tương quan hoặc trách nhiệm đối với Đức Chúa Trời và con người. ἀνθρώπους ở đây mang nghĩa khái quát, nên “mọi người” truyền đạt đúng phạm vi trong tiếng Việt hiện đại.
- source_word: διὰ παντός
  choice: luôn
  rationale: Cụm từ chỉ tính liên tục hoặc mọi lúc; “luôn” ngắn gọn và tự nhiên.
theological_decisions:
- issue: Phạm vi của ἀνθρώπους
  choice: mọi người
  alternative: người ta; con người
  rationale: Danh từ số nhiều này được dùng theo nghĩa đại diện cho loài người nói chung, không chỉ nam giới. Tiếng Việt không cần giữ hình thức giống đực để bảo toàn nghĩa nguồn.
- issue: Ý nghĩa của ἀπρόσκοπον khi bổ nghĩa cho lương tâm
  choice: không vấp phạm
  alternative: không có gì đáng trách; trong sạch
  rationale: “Không vấp phạm” giữ sắc thái rộng của từ Hy Lạp—không phạm lỗi hoặc không gây cớ vấp ngã—và tránh biến lời này thành một tuyên bố mạnh hơn về sự hoàn toàn vô tội hay thuần khiết nội tâm.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Trật tự “chính tôi cũng” giữ cả sắc thái nhấn mạnh lẫn bổ sung của nguyên văn; câu không cần chú thích vì các lựa chọn đều có thể biểu đạt rõ ngay trong chính văn.
