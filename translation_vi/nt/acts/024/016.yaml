    rationale: ἀπρόσκοπον bổ nghĩa cho συνείδησιν và trong câu này chỉ một lương tâm không bị trách cứ, không gây cớ xúc phạm. “Không chỗ trách được” diễn đạt sát chức năng này hơn trong tiếng Việt.
  revised_text: Vì vậy, chính tôi cũng luôn cố gắng giữ một lương tâm không chỗ trách được trước Đức Chúa Trời và mọi người.
