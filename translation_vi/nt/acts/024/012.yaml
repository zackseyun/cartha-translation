translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc phủ định được diễn đạt lại tự nhiên trong tiếng Việt, với “dù... hay...” bao quát hai địa điểm sau. Không thêm sắc thái bạo lực mạnh hơn nguyên văn.
