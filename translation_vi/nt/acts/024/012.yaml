  text: καὶ οὔτε ἐν τῷ ἱερῷ εὗρόν με πρός τινα διαλεγόμενον ἢ ⸀ἐπίστασιν ποιοῦντα ὄχλου οὔτε ἐν ταῖς συναγωγαῖς οὔτε κατὰ τὴν πόλιν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/012.yaml
  text: And they found me neither in the temple arguing with anyone nor stirring up a crowd[b][a], neither in the synagogues nor throughout the city.
translation:
  language: vi
  text: Họ không thấy tôi trong đền thờ đang tranh luận với ai hoặc lôi kéo đám đông tụ tập; cũng không thấy tôi làm những việc ấy trong các hội đường hay khắp thành[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “gây nên một cuộc tụ tập của đám đông” hoặc “gây náo động trong đám đông.” Cụm từ Hy Lạp nói đến việc gây nên một cuộc tụ tập hoặc náo động công cộng, nhưng không nhất thiết hàm ý một cuộc bạo loạn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἱερῷ
  choice: đền thờ
  rationale: Trong sách Công Vụ, ἱερόν thường chỉ toàn bộ khuôn viên đền thờ, không riêng nơi thánh bên trong; “đền thờ” là cách nói tự nhiên và đủ rộng trong tiếng Việt.
- source_word: εὗρόν με
  choice: họ ... thấy tôi
  rationale: Trong bối cảnh biện hộ pháp lý, cụm này nói về điều các bên cáo buộc không bắt gặp hoặc chứng kiến Phao-lô làm; “thấy tôi” tự nhiên hơn “tìm thấy tôi” trong tiếng Việt ở đây.
- source_word: πρός τινα διαλεγόμενον
  choice: tranh luận với bất cứ ai
  rationale: διαλέγομαι có thể chỉ thảo luận, lý luận hoặc tranh luận. Bối cảnh Phao-lô phủ nhận hành vi gây rối khiến “tranh luận” phù hợp, đồng thời vẫn cần chú thích để giữ độ rộng nghĩa.
- source_word: ἐπίστασιν ποιοῦντα ὄχλου
  choice: kích động đám đông
  rationale: Cụm Hy Lạp chỉ việc làm cho đám đông tụ tập hoặc náo động; “kích động đám đông” diễn đạt rõ cáo buộc gây rối nhưng không nâng mức độ thành bạo loạn.
- source_word: συναγωγαῖς
  choice: các hội đường
  rationale: Cách dịch tiêu chuẩn và dễ hiểu của συναγωγή trong bối cảnh Do Thái.
- source_word: κατὰ τὴν πόλιν
  choice: ở bất cứ đâu trong thành
  rationale: κατά với đối cách diễn tả phạm vi phân bố khắp thành; cách dịch này tự nhiên, đồng thời làm rõ rằng họ không thấy Phao-lô làm những việc ấy tại bất kỳ nơi nào trong thành.
