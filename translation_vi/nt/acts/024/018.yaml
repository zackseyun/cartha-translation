  yaml_path: translation/nt/acts/024/018.yaml
  text: In these things they found me purified in the temple[a], not with a crowd nor with an uproar[b],
translation:
  language: vi
  text: Trong những việc ấy[a], họ bắt gặp tôi trong đền thờ, sau khi tôi đã được thanh tẩy[b], không có đám đông cũng không có sự náo loạn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Trong khi ấy” hoặc “Trong những điều ấy.” Cụm Hy Lạp ἐν αἷς theo sát mặt chữ là “trong những điều/việc ấy.”'
    reason: lexical_alternative
  - marker: b
    text: “Thanh tẩy” ở đây nói đến việc thanh tẩy theo nghi lễ.
    reason: cultural_note
lexical_decisions:
- source_word: ἐν αἷς
  choice: Trong khi làm những việc ấy
  rationale: Đại từ quan hệ số nhiều giống cái chỉ lại những việc Phao-lô vừa kể. Cách dịch này diễn đạt tự nhiên ý thời gian/hoàn cảnh, đồng thời giữ mối liên hệ với câu trước.
- source_word: εὗρόν με
  choice: họ thấy tôi
  rationale: Trong ngữ cảnh này, εὑρίσκω nói đến việc những người kia bắt gặp Phao-lô trong đền thờ; “thấy tôi” tự nhiên hơn “tìm thấy tôi” trong tiếng Việt mà vẫn giữ đúng nghĩa.
- source_word: ἡγνισμένον
  choice: đã được thanh tẩy
  rationale: Phân từ hoàn thành bị động diễn tả Phao-lô đang ở trong tình trạng đã hoàn tất việc thanh tẩy. Cách dịch bị động giữ được hình thái và không đưa ý nghĩa nghi lễ vào chính văn một cách quá tường minh.
- source_word: ἐν τῷ ἱερῷ
  choice: trong đền thờ
  rationale: ἱερόν chỉ khuôn viên đền thờ nói chung, không nhất thiết là nơi thánh bên trong. “Đền thờ” là cách gọi quen thuộc và đủ rộng trong tiếng Việt.
- source_word: οὐ μετὰ ὄχλου
  choice: Tôi không ở cùng một đám đông
  rationale: Cách diễn đạt tự nhiên hóa cấu trúc “không cùng với đám đông” và giữ luận điểm biện hộ rằng Phao-lô không tụ tập quần chúng.
- source_word: οὐδὲ μετὰ θορύβου
  choice: cũng không gây náo loạn
  rationale: θόρυβος chỉ sự ồn ào, hỗn loạn hoặc náo động công cộng. Trong lời biện hộ pháp lý, “gây náo loạn” truyền đạt rõ ý mà không cường điệu thành bạo loạn.
theological_decisions:
- issue: Tính chất của sự thanh tẩy
  choice: Giữ “đã được thanh tẩy” trong chính văn và giải thích tính nghi lễ ở chú thích
  alternative: “đã làm lễ thanh tẩy” hoặc “đã được thanh tẩy theo nghi lễ”
  rationale: Nguyên ngữ hàm ý sự thanh tẩy theo nghi lễ trong bối cảnh đền thờ, nhưng không dùng một trạng từ tương đương với “theo nghi lễ.” Cách chọn này bảo toàn sắc thái nguyên văn mà vẫn giúp độc giả hiểu qua chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu Hy Lạp tiếp nối sang câu sau bằng dấu phẩy, nhưng bản dịch tách thành câu hoàn chỉnh để tiếng Việt tự nhiên hơn; nội dung vẫn giữ chức năng của lời biện hộ. Các thuật ngữ “thanh tẩy,” “đền thờ” và “náo loạn” giữ sắc thái nghi lễ, địa điểm và pháp lý của ngữ cảnh.
