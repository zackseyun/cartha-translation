revisions:
- from: Trong khi làm những việc ấy[a], họ thấy tôi đã được thanh tẩy[b] trong đền thờ. Tôi không ở cùng một đám đông, cũng không gây náo loạn.
  to: Trong những việc ấy[a], họ bắt gặp tôi trong đền thờ, sau khi tôi đã được thanh tẩy[b], không có đám đông cũng không có sự náo loạn.
  rationale: Bỏ “làm” để không bổ sung một hành động vào cụm ἐν αἷς. Thay “gây náo loạn” bằng “có sự náo loạn” để giữ ý phủ định của các cụm μετὰ (“cùng với/trong bối cảnh có”), không chuyển thành lời phủ định về hành vi chủ động. “Sau khi tôi đã được thanh tẩy” làm rõ trạng thái hoàn tất của phân từ hoàn thành bị động mà vẫn tự nhiên.
  reviewer_model: gpt-5.6-terra
