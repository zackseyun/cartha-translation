base_translation:
  language: en
  yaml_path: translation/nt/acts/024/004.yaml
  text: But[a], so that I may not delay you any further[b], I beg you to hear us briefly, in your graciousness.
translation:
  language: vi
  text: Nhưng để khỏi chiếm thêm thời giờ của ngài[a], tôi kính xin ngài, với lòng khoan dung của ngài[b], nghe chúng tôi trình bày vắn tắt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “làm phiền ngài lâu hơn” hoặc “giữ ngài lại lâu hơn.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “với lòng nhân hậu của ngài” hoặc “theo sự độ lượng của ngài.” Từ Hy Lạp có thể chỉ sự công minh mềm mỏng, nhân hậu hay khoan dung khi phán xét.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα δὲ μὴ
  choice: Nhưng để khỏi
  rationale: Giữ chuyển ý đối lập nhẹ của δέ và ý chỉ mục đích phủ định của ἵνα μή, đồng thời diễn đạt tự nhiên trong tiếng Việt hiện đại.
- source_word: ἐπὶ πλεῖόν σε ἐγκόπτω
  choice: chiếm thêm thời giờ của ngài
  rationale: Trong bối cảnh phiên điều trần, cụm này nói đến việc làm vị tổng đốc phải dành thêm thời gian, hơn là cản trở theo nghĩa vật lý. Cách dịch này tự nhiên và giữ được ý ‘lâu hơn/thêm nữa’ của ἐπὶ πλεῖόν.
- source_word: παρακαλῶ
  choice: tôi kính xin
  rationale: Thể hiện lời thỉnh cầu lễ độ và cung kính trong diễn ngôn pháp đình, không làm sắc thái mạnh quá thành van nài.
- source_word: ἀκοῦσαί σε ἡμῶν
  choice: ngài ... nghe chúng tôi trình bày
  rationale: Giữ nghĩa trực tiếp ‘nghe chúng tôi’, còn ‘trình bày’ làm rõ ngữ cảnh phát biểu trước tòa mà không thêm nội dung đáng kể.
- source_word: συντόμως
  choice: vắn tắt
  rationale: Diễn đạt tự nhiên ý nói ngắn gọn hoặc chỉ trong ít lời.
- source_word: τῇ σῇ ἐπιεικείᾳ
  choice: lấy lòng khoan dung
  rationale: ἐπιείκεια có thể chỉ sự công minh mềm mỏng, nhân hậu hoặc khoan dung trong xét xử. ‘Lòng khoan dung’ giữ được sức nặng pháp lý và giọng cầu khẩn cung kính.
