  source_fidelity: 'Bản dịch chuyển tải đúng cấu trúc và ý chính: δέ là chuyển ý nhẹ (“Nhưng”), ἵνα μὴ là mục đích phủ định, ἐπὶ πλεῖον ... ἐγκόπτω là không chiếm/detain thêm thời giờ, παρακαλῶ là lời thỉnh cầu cung kính, và συντόμως là trình bày ngắn gọn. “Lòng khoan dung” là một lựa chọn phù hợp cho ἐπιεικείᾳ trong bối cảnh pháp đình, đồng thời không thu hẹp các sắc thái công minh, mềm mỏng và độ lượng; các sắc thái này được giữ trong chú thích.'
