revisions:
- from: Nhưng có mấy người Do Thái từ tỉnh A-si-a[a]; chính họ mới phải có mặt trước ngài và tố cáo tôi[b], nếu họ có điều gì chống lại tôi.
  to: Nhưng có một số người Do Thái từ tỉnh A-si-a, là những người lẽ ra phải có mặt trước ngài và tố cáo tôi[b], nếu họ có điều gì chống lại tôi.
  rationale: Sửa «mấy» thành «một số» cho văn phong hiện đại chuẩn; thay «chính họ mới phải» bằng «là những người lẽ ra phải» để bám sát quan hệ cú pháp của οὓς và thể hiện nghĩa vụ quá khứ chưa được thực hiện của ἔδει. Giữ «nếu họ có điều gì chống lại tôi» để bảo toàn tính khái quát và điều kiện của εἴ τι ἔχοιεν πρὸς ἐμέ. Chú thích a được giữ nguyên nhưng không có điểm neo trong bản thảo vì «tỉnh A-si-a» đã làm rõ trực tiếp; để duy trì bộ chú thích đã cung cấp, cần đặt neo [a] sau «A-si-a».
