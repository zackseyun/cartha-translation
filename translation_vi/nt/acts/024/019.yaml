  yaml_path: translation/nt/acts/024/019.yaml
  text: But there are some Jews from Asia who ought to have been present before you and to accuse me[b][a], if they had anything against me.
translation:
  language: vi
  text: Nhưng có một số người Do Thái từ tỉnh A-si-a, là những người lẽ ra phải có mặt trước ngài và tố cáo tôi[b], nếu họ có điều gì chống lại tôi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Hay “đưa ra cáo buộc chống lại tôi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τινὲς δὲ
  choice: Nhưng có mấy
  rationale: “Nhưng” thể hiện sự tương phản trong ngữ cảnh; “mấy” chỉ một số người không xác định và tự nhiên trong tiếng Việt.
- source_word: ἀπὸ τῆς Ἀσίας
  choice: từ tỉnh A-si-a
  rationale: Nêu rõ đây là tỉnh A-si-a thuộc La Mã, tránh khiến độc giả hiểu là châu Á ngày nay; chú thích bổ sung bối cảnh địa lý.
- source_word: Ἰουδαῖοι
  choice: người Do Thái
  rationale: Cách gọi thông dụng, chính xác và trung tính trong tiếng Việt hiện đại.
- source_word: οὓς ἔδει ἐπὶ σοῦ παρεῖναι
  choice: chính họ mới phải có mặt trước ngài
  rationale: “Chính họ mới” làm rõ đại từ quan hệ mang nghĩa đối chiếu; “phải” giữ ý nghĩa vụ hay sự cần thiết chưa được thực hiện của ἔδει, còn “trước ngài” phù hợp bối cảnh xét xử.
- source_word: κατηγορεῖν
  choice: tố cáo tôi
  rationale: Giữ nghĩa pháp lý của động từ là đưa ra lời buộc tội; chú thích bảo lưu cách diễn đạt pháp lý cụ thể hơn.
- source_word: εἴ τι ἔχοιεν πρὸς ἐμέ
  choice: nếu họ có điều gì chống lại tôi
  rationale: Giữ cách nói rộng và sắc thái điều kiện tiềm năng của nguyên văn, không thu hẹp “điều gì” thành một cáo buộc pháp lý cụ thể.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và phù hợp lời biện hộ trước quan chức. Dùng “ngài” để diễn đạt lời thưa với tổng đốc; giữ sắc thái nghĩa vụ chưa được thực hiện và điều kiện không xác quyết của câu Hy Lạp.
