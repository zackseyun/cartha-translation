source:
  edition: SBLGNT
  text: Μετὰ δὲ πέντε ἡμέρας κατέβη ὁ ἀρχιερεὺς Ἁνανίας μετὰ ⸂πρεσβυτέρων τινῶν⸃ καὶ ῥήτορος Τερτύλλου τινός, οἵτινες ἐνεφάνισαν τῷ ἡγεμόνι κατὰ τοῦ Παύλου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/001.yaml
  text: After five days[a], the high priest Ananias came down with some elders and a certain orator named Tertullus, and they brought charges against Paul before the governor.
translation:
  language: vi
  text: Năm ngày sau, thượng tế A-na-nia cùng một số trưởng lão và một người biện hộ tên là Tẹt-tu-lô đi xuống. Họ trình những cáo buộc chống lại Phao-lô trước tổng đốc.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Người biện hộ” cũng có thể dịch là “nhà hùng biện”; từ Hy Lạp có thể chỉ một diễn giả trước công chúng hoặc một người đại diện trình bày trong vụ kiện.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ πέντε ἡμέρας
  choice: Năm ngày sau
  rationale: Diễn đạt tự nhiên khoảng thời gian đã trôi qua; không dịch δέ thành một từ nối nặng nề vì mạch kể tiếng Việt đã rõ.
- source_word: κατέβη
  choice: đi xuống
  rationale: Giữ hướng địa lý từ Giê-ru-sa-lem xuống Sê-sa-rê; ngôi kể không đòi hỏi dùng “đến xuống”.
- source_word: ὁ ἀρχιερεὺς Ἁνανίας
  choice: thượng tế A-na-nia
  rationale: “Thượng tế” chỉ đúng chức vụ đứng đầu hàng tư tế Do Thái; tên riêng được phiên âm theo lối quen dùng trong Kinh Thánh tiếng Việt.
- source_word: μετὰ πρεσβυτέρων τινῶν
  choice: cùng một số trưởng lão
  rationale: τινῶν mang nghĩa bất định; “một số” tự nhiên và không ngụ ý toàn thể các trưởng lão.
- source_word: ῥήτορος Τερτύλλου τινός
  choice: một nhà hùng biện tên là Tẹt-tu-lô
  rationale: ῥήτωρ có thể chỉ người diễn thuyết hoặc người đại diện biện hộ trong bối cảnh pháp lý; bản văn chính giữ nghĩa rộng, còn chú thích nêu phương án pháp lý.
- source_word: ἐνεφάνισαν τῷ ἡγεμόνι κατὰ τοῦ Παύλου
  choice: đến trình với tổng đốc những cáo buộc chống lại Phao-lô
  rationale: Trong ngữ cảnh tố tụng, ἐμφανίζω chỉ việc chính thức trình báo hoặc đưa lời cáo buộc; cách dịch này giữ rõ người tiếp nhận và đối tượng bị tố cáo.
