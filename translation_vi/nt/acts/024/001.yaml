  register: Văn phong kể chuyện trang trọng nhưng hiện đại. Tên riêng được phiên âm để độc giả phổ thông dễ đọc. Tách thành hai câu nhằm tránh chuỗi thành phần quá dài mà vẫn giữ nguyên quan hệ và trình tự của câu Hy Lạp.
