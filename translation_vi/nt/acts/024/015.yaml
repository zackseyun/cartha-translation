  yaml_path: translation/nt/acts/024/015.yaml
  text: having hope in God—which these men themselves also accept—that there is going to be a resurrection of both the righteous and the unrighteous[a].
translation:
  language: vi
  text: tôi có niềm hy vọng nơi Đức Chúa Trời — niềm hy vọng mà chính những người này cũng đón đợi[a] — rằng sẽ có sự sống lại của cả người công chính lẫn người bất chính.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “mà chính họ cũng chấp nhận” hoặc “mà chính họ cũng có niềm hy vọng ấy.” Động từ Hy Lạp có thể mang nghĩa chấp nhận hoặc trông đợi; ở đây, Phao-lô nhấn mạnh niềm hy vọng chung giữa ông và những người ấy.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλπίδα ἔχων εἰς τὸν θεόν
  choice: tôi có niềm hy vọng nơi Đức Chúa Trời
  rationale: Giữ danh từ ἐλπίς và hướng của niềm hy vọng về Đức Chúa Trời, đồng thời thêm đại từ chủ ngữ theo ngữ cảnh để câu tiếng Việt tự nhiên.
- source_word: ἣν καὶ αὐτοὶ οὗτοι προσδέχονται
  choice: niềm hy vọng mà chính những người này cũng đón đợi
  rationale: Lặp lại “niềm hy vọng” để quan hệ của đại từ ἣν rõ ràng trong tiếng Việt; “chính những người này cũng” giữ sắc thái nhấn mạnh của καὶ αὐτοὶ οὗτοι. “Đón đợi” bảo lưu nghĩa mong chờ của προσδέχομαι mà không loại trừ sắc thái chấp nhận.
- source_word: ἀνάστασιν
  choice: sự sống lại
  rationale: Cách diễn đạt quen thuộc, rõ ràng trong tiếng Việt cho việc người chết sống lại.
- source_word: μέλλειν ἔσεσθαι
  choice: sẽ có
  rationale: Truyền đạt ý tương lai của kết cấu mà không áp đặt sắc thái “sắp xảy ra” quá gần về thời gian.
- source_word: δικαίων τε καὶ ἀδίκων
  choice: của cả người công chính lẫn người bất chính
  rationale: Giữ trọn cấu trúc bao gồm cả hai nhóm của τε καὶ và sự đối lập luân lý trong nguyên văn.
theological_decisions:
- issue: Phạm vi và bản chất của sự sống lại trong lời Phao-lô
  choice: sự sống lại của cả người công chính lẫn người bất chính
  alternative: một sự sống lại chung không nêu rõ hai nhóm về phương diện luân lý
  rationale: Nguyên văn nêu đích danh cả người công chính và người bất chính. Bản dịch giữ phạm vi ấy nhưng không thêm hệ thống giáo lý về thời điểm, thứ tự hay cách thức phán xét.
- issue: Sắc thái của προσδέχονται
  choice: đón đợi
  alternative: chấp nhận / tin nhận
  rationale: Động từ có thể chỉ sự chờ mong hoặc sự tiếp nhận. “Đón đợi” phù hợp với đối tượng là niềm hy vọng và giữ sắc thái mong chờ; chú thích bảo lưu khả năng hiểu là họ cũng chấp nhận hoặc cùng có niềm hy vọng này.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dấu gạch ngang làm rõ phần chen giải thích về niềm hy vọng; “người công chính” và “người bất chính” giữ tính cân xứng và sắc thái thần học của nguyên văn.
