  yaml_path: translation/nt/acts/024/006.yaml
  text: He even tried to defile the temple[a], and we seized him,
translation:
  language: vi
  text: Người này thậm chí đã tìm cách làm ô uế đền thờ[a], và chúng tôi đã bắt giữ người ấy,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Một số thủ bản thêm một đoạn dài hơn tại đây, trong đó nói rằng họ muốn xét xử Phao-lô theo luật của họ và viên chỉ huy Ly-sia đã đem ông ra khỏi tay họ.
    reason: textual_variant
lexical_decisions:
- source_word: ὃς
  choice: Người này
  rationale: Đại từ quan hệ chỉ về Phao-lô. Trong mạch cáo buộc bằng tiếng Việt, “Người này” nối ý tự nhiên và vẫn giữ giọng điệu tố cáo.
- source_word: καὶ
  choice: thậm chí còn
  rationale: Trong ngữ cảnh này, καὶ nhấn mạnh mức độ nghiêm trọng của lời cáo buộc; “thậm chí còn” diễn đạt tự nhiên sắc thái ấy.
- source_word: τὸ ἱερὸν
  choice: đền thờ
  rationale: ἱερόν chỉ toàn bộ khuôn viên đền thờ, không riêng nơi thánh bên trong. “Đền thờ” là cách gọi quen thuộc, rõ ràng trong tiếng Việt.
- source_word: ἐπείρασεν
  choice: tìm cách
  rationale: Động từ ở đây có nghĩa là cố gắng hoặc toan làm điều gì. “Tìm cách” tự nhiên, đồng thời không hàm ý hành động đã thành công.
- source_word: βεβηλῶσαι
  choice: làm ô uế
  rationale: βεβηλόω nói đến việc xúc phạm tính thánh hoặc gây ô uế về nghi lễ. “Làm ô uế” dễ hiểu và phù hợp với lời cáo buộc liên quan đến sự thanh sạch của đền thờ.
- source_word: ὃν
  choice: hắn
  rationale: Đại từ chỉ Phao-lô là đối tượng bị bắt. “Hắn” phù hợp với giọng điệu thù nghịch của bên cáo buộc, dù bản thân đại từ Hy Lạp không mã hóa sắc thái khinh miệt.
- source_word: ἐκρατήσαμεν
  choice: chúng tôi đã bắt giữ
  rationale: κρατέω ở đây có nghĩa là nắm lấy, khống chế hoặc bắt giữ. “Bắt giữ” vừa tự nhiên vừa giữ được sắc thái cưỡng chế, không nhất thiết biến hành động ấy thành một vụ bắt giữ hợp pháp theo thủ tục.
theological_decisions:
- issue: Dạng văn bản của Công Vụ 24:6 so với dị bản dài hơn thuộc truyền thống Byzantine
  choice: Chỉ dịch mệnh đề trong SBLGNT, kết thúc bằng “nên chúng tôi đã bắt giữ hắn,”
  alternative: Một số thủ bản thêm nội dung rằng họ muốn xét xử Phao-lô theo luật của họ, nhưng viên chỉ huy Ly-si-a đã dùng sức mạnh giành ông khỏi tay họ; cách diễn đạt khác nhau tùy truyền thống thủ bản.
  rationale: Bản dịch theo đúng văn bản Hy Lạp SBLGNT được cung cấp, không đưa phần mở rộng của các thủ bản khác vào chính văn. Dị bản dài vẫn được ghi chú để độc giả biết về truyền thống văn bản ấy.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu giữ dấu phẩy cuối vì lời cáo buộc tiếp tục sang câu kế tiếp. “Làm ô uế” bảo toàn sắc thái thanh sạch nghi lễ; “hắn” phản ánh giọng cáo buộc của người nói chứ không phải lời đánh giá của người dịch.
