- from: Người này thậm chí còn tìm cách làm ô uế đền thờ[a], nên chúng tôi đã bắt giữ hắn,
  to: Người này thậm chí đã tìm cách làm ô uế đền thờ[a], và chúng tôi đã bắt giữ người ấy,
  rationale: Sửa liên từ “nên” thành “và” để bảo toàn chức năng nối tiếp của καὶ, và thay “hắn” bằng “người ấy” để không thêm sắc thái khinh miệt không có trong nguyên ngữ. Chú thích dị bản được giữ, với cách diễn đạt trung tính và sát nội dung tóm tắt của vệt kiểm toán tiếng Anh.
