  text: But[a] Lysias the commander came and took him out of our hands with great force,
translation:
  language: vi
  text: Nhưng viên chỉ huy Ly-si-a đến, bằng vũ lực mạnh mẽ đưa ông ấy ra khỏi tay chúng tôi,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Câu này—cùng với phần cuối câu 6 và phần đầu câu 8—không có trong các thủ bản Hy Lạp sớm nhất, gồm Papyrus 74 (thế kỷ III), Codex Sinaiticus và Codex Vaticanus (thế kỷ IV), cũng như trong các bản dịch Coptic cổ. Câu này được lưu giữ trong truyền thống đa số Byzantine, truyền thống La-tinh và các thủ bản Hy Lạp muộn hơn. Có thể đây là một phần mở rộng biên tập từ sớm, thuật lại trong phiên xử trước mặt Phê-lít việc viên chỉ huy La Mã đã can thiệp.
    reason: textual_critical
lexical_decisions:
- source_word: παρελθὼν (παρέρχομαι)
  choice: đến
  rationale: Phân từ bất định chỉ việc Ly-si-a xuất hiện tại hiện trường; chuyển thành động từ hữu hạn để câu kể tự nhiên trong tiếng Việt.
- source_word: χιλίαρχος
  choice: viên chỉ huy
  rationale: Từ này theo nghĩa đen chỉ người chỉ huy một nghìn quân và trong bối cảnh La Mã là một sĩ quan cấp cao. “Viên chỉ huy” dễ hiểu mà không gán một cấp bậc hiện đại không hoàn toàn tương ứng.
- source_word: μετὰ πολλῆς βίας
  choice: dùng vũ lực mạnh mẽ
  rationale: Diễn đạt mức độ cưỡng chế thể chất đáng kể, đồng thời không mặc nhiên quy kết hành động là bạo ác.
- source_word: ἀπήγαγεν (ἀπάγω)
  choice: đưa ông ấy ra khỏi
  rationale: Động từ có nghĩa dẫn hoặc đưa đi; kết hợp với “ra khỏi tay chúng tôi” để giữ hình ảnh và quan điểm trong lời tố cáo của bên nguyên.
- source_word: ἐκ τῶν χειρῶν ἡμῶν
  choice: ra khỏi tay chúng tôi
  rationale: Giữ thành ngữ cụ thể của nguyên văn, cho thấy Phao-lô bị lấy khỏi quyền kiểm soát của những người đang phát biểu.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng dễ hiểu. Dùng “viên chỉ huy” thay vì thuật ngữ chuyên môn “quan thiên phu”; phiên âm tên riêng là “Ly-si-a”. Đại từ “ông ấy” tránh gây lẫn với chủ ngữ Ly-si-a và phù hợp với lời tố cáo đang nói về Phao-lô.
