id: ACT.24.5
reference: Acts 24:5
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εὑρόντες γὰρ τὸν ἄνδρα τοῦτον λοιμὸν καὶ κινοῦντα ⸀στάσεις πᾶσι τοῖς Ἰουδαίοις τοῖς κατὰ τὴν οἰκουμένην πρωτοστάτην τε τῆς τῶν Ναζωραίων αἱρέσεως,
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/005.yaml
  text: For we have found this man to be a plague, stirring up riots among all the Jews throughout the inhabited world, and also a ringleader of the sect of the Nazarenes,
translation:
  language: vi
  text: Vì chúng tôi nhận thấy người này là một mối họa, gây ra những cuộc nổi loạn giữa mọi người Do Thái khắp thế giới, và còn là kẻ cầm đầu phái Na-xa-rét.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λοιμός
  choice: một mối họa
  rationale: Từ này theo nghĩa đen chỉ bệnh dịch, nhưng ở đây được dùng như lời tố cáo mang tính ẩn dụ về một người gây nguy hại; “mối họa” tự nhiên và giữ được sắc thái miệt thị.
- source_word: κινοῦντα στάσεις
  choice: kích động những cuộc nổi loạn
  rationale: στάσεις ở số nhiều có thể chỉ các vụ rối loạn, xung đột hoặc nổi loạn. Trong bối cảnh một lời buộc tội trước quan tổng đốc, “những cuộc nổi loạn” truyền đạt rõ mức độ nghiêm trọng mà bên nguyên cáo muốn gán cho Phao-lô.
- source_word: οἰκουμένη
  choice: thiên hạ
  rationale: Trong ngữ cảnh này, từ chỉ thế giới có người ở theo nhận thức đương thời; “khắp thiên hạ” là cách nói tiếng Việt tự nhiên, không nhất thiết khẳng định mọi nơi trên toàn cầu theo nghĩa hiện đại.
- source_word: πρωτοστάτην
  choice: kẻ cầm đầu
  rationale: Diễn đạt vai trò lãnh đạo hàng đầu, đồng thời giữ giọng điệu buộc tội của diễn giả.
- source_word: αἵρεσις
  choice: phái
  rationale: Từ này có thể chỉ một phe hoặc nhóm tôn giáo, chưa nhất thiết mang nghĩa thần học tiêu cực của “tà giáo”; “phái” giữ được tính mô tả và giọng cáo buộc trong ngữ cảnh.
theological_decisions:
- issue: Cách gọi cộng đồng các môn đồ là τῶν Ναζωραίων αἱρέσεως
  choice: phái người Na-xa-rét
  alternative: giáo phái Na-xa-rét
  rationale: Chọn cách dịch không mặc nhiên phán quyết cộng đồng này là tà giáo, vì đây là nhãn gọi trong lời buộc tội của Tẹt-tu-lô chứ không phải nhận định thần học của người kể chuyện.
translation_notes:
  register: Văn phong trang trọng, dễ hiểu và phù hợp với lời tố cáo tại tòa. Các từ “mối họa”, “kẻ cầm đầu” giữ sắc thái gay gắt của bên nguyên cáo mà không thêm phán xét của bản dịch.
