    issue: Thiếu sự biểu đạt rõ ràng của πᾶσι
    rationale: Cụm “giữa người Do Thái” không phản ánh rõ “mọi/tất cả người Do Thái” trong πᾶσι τοῖς Ἰουδαίοις.
  - severity: low
    issue: Cụm “giữa người Do Thái trên khắp thiên hạ” hơi gượng
    rationale: Đặt “khắp thiên hạ” sau “người Do Thái” làm quan hệ giữa phạm vi địa lý và nhóm người kém mạch lạc trong tiếng Việt hiện đại.
