revisions:
- from: Vì chúng tôi nhận thấy người này là một mối họa, kích động những cuộc nổi loạn giữa người Do Thái trên khắp thiên hạ, và còn là kẻ cầm đầu phái người Na-xa-rét.
  to: Vì chúng tôi nhận thấy người này là một mối họa, gây ra những cuộc nổi loạn giữa mọi người Do Thái khắp thế giới, và còn là kẻ cầm đầu phái Na-xa-rét.
  rationale: Chỉnh nhẹ để biểu đạt rõ lượng từ πᾶσι và làm trật tự từ tự nhiên hơn. “Khắp thế giới” là cách diễn đạt hiện đại, vẫn có thể hiểu οἰκουμένη theo chân trời địa lý đương thời chứ không áp đặt nghĩa khoa học hiện đại. Bỏ “người” trước “Na-xa-rét” để tên phái gọn và tự nhiên hơn, không thay đổi nghĩa số nhiều của τῶν Ναζωραίων.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T10:22:24Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch phản ánh đúng các yếu tố chính: λοιμός là ẩn dụ miệt thị (“mối họa”); κινοῦντα στάσεις là hành vi khuấy động các vụ rối loạn/nổi loạn; οἰκουμένη là thế giới có người ở theo cách hiểu đương thời; và πρωτοστάτην ... αἱρέσεως là người cầm đầu một phái/nhóm Na-xa-rét. Tuy nhiên, “giữa người Do Thái” thiếu lượng từ πᾶσι (“tất cả/mọi”) và cách kết hợp này chưa tự nhiên.'
  naturalness: Câu có giọng điệu tố cáo thích hợp. “Gây ra những cuộc nổi loạn giữa mọi người Do Thái khắp thế giới” tự nhiên hơn “kích động những cuộc nổi loạn giữa người Do Thái trên khắp thiên hạ,” đồng thời biểu đạt rõ hơn phạm vi của nguyên ngữ.
  terminology: Giữ “mối họa”, “kẻ cầm đầu”, và “phái Na-xa-rét”. “Phái” là lựa chọn trung tính, phù hợp vì αἵρεσις ở đây là nhãn gọi trong lời cáo buộc, không buộc phải mang nghĩa “tà giáo”.
  issues:
