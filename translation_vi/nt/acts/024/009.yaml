  text: And the Jews also joined in the charge[a], asserting that these things were so.
translation:
  language: vi
  text: Người Do Thái cũng hiệp sức tố cáo, quả quyết rằng những điều ấy đúng như vậy.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνεπέθεντο
  choice: hùa vào tố cáo
  rationale: Động từ συνεπιτίθεμαι diễn tả việc cùng tham gia chống lại một người. Trong bối cảnh xét xử, cụm này thể hiện việc những người Do Thái nhập cuộc, ủng hộ lời tố cáo của Tẹt-tu-lu, đồng thời giữ được sắc thái đối địch của động từ.
- source_word: δὲ καὶ
  choice: cũng
  rationale: δέ là từ nối nhẹ tiếp diễn câu chuyện, còn καί thêm nhóm người Do Thái vào hành động đang diễn ra. Trong tiếng Việt, “cũng” diễn đạt tự nhiên cả sự tiếp nối lẫn việc họ cùng tham gia.
- source_word: οἱ Ἰουδαῖοι
  choice: Người Do Thái
  rationale: Trong ngữ cảnh này, cụm từ chỉ nhóm người Do Thái hiện diện và tham gia vào vụ kiện, không nhất thiết nhấn mạnh nguồn gốc địa lý.
- source_word: φάσκοντες
  choice: quả quyết
  rationale: Phân từ này giới thiệu điều họ khẳng định để hậu thuẫn lời tố cáo. “Quả quyết” phù hợp với ngữ cảnh pháp lý và không mặc nhiên phán định lời họ là đúng hay sai.
- source_word: ταῦτα
  choice: những điều ấy
  rationale: Cách dịch này giữ phạm vi khái quát của đại từ chỉ định, quy chiếu về toàn bộ những lời cáo buộc vừa nêu mà không thu hẹp thành một cáo trạng cụ thể.
- source_word: οὕτως ἔχειν
  choice: đúng như vậy
  rationale: Đây là thành ngữ mang nghĩa “sự việc là như thế.” “Đúng như vậy” tự nhiên trong tiếng Việt và diễn đạt nội dung họ quả quyết, chứ không phải lời người kể xác nhận.
