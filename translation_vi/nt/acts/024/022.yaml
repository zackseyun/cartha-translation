revisions:
- from: 'Nhưng Phê-lích, vốn hiểu khá tường tận về Đạo ấy[b], đã hoãn việc của họ lại[a] và nói: “Khi viên chỉ huy Ly-si-a xuống đây, ta sẽ phân xử vụ việc của các ngươi[c].”'
  to: 'Nhưng Phê-lích, vì hiểu biết tường tận hơn về Đạo[b], đã tạm hoãn việc xét xử họ[a] và nói: “Khi viên chỉ huy Ly-si-a xuống, tôi sẽ quyết định vụ việc của các ông[c].”'
  rationale: Bản sửa loại bỏ yếu tố chỉ định không có trong nguyên ngữ, phục hồi sắc thái so sánh của ἀκριβέστερον, và thay cụm từ pháp lý gượng bằng cách diễn đạt Việt hiện đại, rõ nghĩa. Các chú thích vẫn neo đúng cụm từ được giải thích và bảo tồn những phương án dịch hợp lệ.
  reviewer_model: gpt-5.6-terra
