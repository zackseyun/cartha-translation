  text: ⸂Ἀνεβάλετο δὲ αὐτοὺς ὁ Φῆλιξ⸃, ἀκριβέστερον εἰδὼς τὰ περὶ τῆς ὁδοῦ, ⸀εἴπας· Ὅταν Λυσίας ὁ χιλίαρχος καταβῇ διαγνώσομαι τὰ καθ’ ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/022.yaml
  text: But Felix, having a more accurate knowledge about the Way, put them off, saying, “When Lysias the commander comes down, I will decide your case.”
translation:
  language: vi
  text: 'Nhưng Phê-lích, vì hiểu biết tường tận hơn về Đạo[b], đã tạm hoãn việc xét xử họ[a] và nói: “Khi viên chỉ huy Ly-si-a xuống, tôi sẽ quyết định vụ việc của các ông[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đã tạm hoãn phiên xử”; động từ Hy Lạp có thể chỉ việc trì hoãn hoặc tạm ngưng thủ tục xét xử.'
    reason: lexical_alternative
  - marker: b
    text: “Đạo” là một danh xưng thời ban đầu dành cho phong trào Cơ Đốc.
    reason: cultural_note
  - marker: c
    text: 'Hay: “tôi sẽ quyết định những việc liên quan đến các ông.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀνεβάλετο ... αὐτοὺς
  choice: đã hoãn việc của họ lại
  rationale: Động từ ở ngữ cảnh pháp lý mang nghĩa trì hoãn hoặc tạm hoãn, còn đại từ số nhiều chỉ những người đang tranh tụng. Cách diễn đạt này tự nhiên trong tiếng Việt mà không biến đại từ thành danh từ ‘phiên xử’ một cách quá dứt khoát.
- source_word: ἀκριβέστερον εἰδὼς
  choice: vốn hiểu khá tường tận
  rationale: Giữ sắc thái so sánh của ἀκριβέστερον theo nghĩa Phê-lích hiểu rõ hơn hoặc tương đối chính xác; ‘vốn’ diễn đạt tự nhiên quan hệ giải thích của phân từ.
- source_word: τὰ περὶ τῆς ὁδοῦ
  choice: về Đạo ấy
  rationale: ‘Đạo’ là cách gọi ngắn gọn, trang trọng và dễ hiểu cho phong trào Cơ Đốc thời ban đầu; ‘ấy’ giúp nhận ra đây là một danh xưng đã được biết đến mà không diễn giải quá mức.
- source_word: Ὅταν ... καταβῇ
  choice: Khi ... xuống đây
  rationale: Ὅταν với thể giả định chỉ một biến cố tương lai được chờ đợi. ‘Xuống đây’ giữ hình ảnh địa lý của καταβῇ và tự nhiên hơn ‘đi xuống’ trong lời nói tại nơi đến.
- source_word: χιλίαρχος
  choice: viên chỉ huy
  rationale: Chỉ một sĩ quan quân đội La Mã cấp cao. ‘Viên chỉ huy’ rõ ràng với độc giả hiện đại mà không dùng thuật ngữ vay mượn khó hiểu.
- source_word: διαγνώσομαι τὰ καθ’ ὑμᾶς
  choice: ta sẽ phân xử vụ việc của các ngươi
  rationale: διαγνώσομαι có nghĩa quyết định sau khi xem xét trong bối cảnh pháp lý; ‘phân xử’ truyền đạt sắc thái tư pháp. ‘Vụ việc của các ngươi’ gần với thành ngữ Hy Lạp hơn ‘vụ án của ngươi’ và giữ đối tượng số nhiều.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ ‘ta/các ngươi’ phản ánh lời của một quan tổng đốc với các bên trước tòa; tên riêng được phiên âm theo lối quen thuộc trong Kinh Thánh tiếng Việt. Các dấu chú thích đều được đặt ngay sau cụm từ liên quan.
