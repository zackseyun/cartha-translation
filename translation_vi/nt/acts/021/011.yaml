id: ACT.21.11
reference: Acts 21:11
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἐλθὼν πρὸς ἡμᾶς καὶ ἄρας τὴν ζώνην τοῦ Παύλου δήσας ⸀ἑαυτοῦ τοὺς πόδας καὶ τὰς χεῖρας εἶπεν· Τάδε λέγει τὸ πνεῦμα τὸ ἅγιον Τὸν ἄνδρα οὗ ἐστιν ἡ ζώνη αὕτη, οὕτως δήσουσιν ἐν Ἰερουσαλὴμ οἱ Ἰουδαῖοι καὶ παραδώσουσιν εἰς χεῖρας ἐθνῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/011.yaml
  text: 'And coming to us[a], and taking Paul’s belt, he bound his own feet and hands and said[b], “Thus says the Holy Spirit: ‘In this way the Jews in Jerusalem will bind the man to whom this belt belongs and will hand him over into the hands of the Gentiles.’”'
translation:
  language: vi
  text: 'Ông đến chỗ chúng tôi, lấy thắt lưng của Phao-lô, trói chân tay mình rồi nói: “Đức Thánh Linh phán thế này:[a] ‘Người Do Thái tại Giê-ru-sa-lem sẽ trói người có chiếc thắt lưng này như thế và nộp người ấy vào tay dân ngoại.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Đây là điều Đức Thánh Linh phán.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ζώνην
  choice: thắt lưng
  rationale: Cách gọi tự nhiên, hiện đại cho dải dùng quanh eo; phù hợp với vật được dùng trong hành động biểu tượng.
- source_word: δήσας ἑαυτοῦ τοὺς πόδας καὶ τὰς χεῖρας
  choice: trói chân tay mình
  rationale: 'Giữ rõ nghĩa phản thân của ἑαυτοῦ: A-ga-bút tự trói chính mình; “trói” cũng liên kết với động từ tương lai δήσουσιν ở phần sau.'
- source_word: Τάδε λέγει
  choice: phán thế này
  rationale: Giữ sắc thái trang trọng của công thức tiên tri, đồng thời tự nhiên trong tiếng Việt hiện đại.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: Đức Thánh Linh
  rationale: Danh xưng phổ biến, trang trọng trong tiếng Việt Cơ Đốc, chỉ Thánh Linh trong văn bản.
- source_word: Τὸν ἄνδρα
  choice: người
  rationale: Ngữ cảnh đã xác định một người nam là chủ chiếc thắt lưng; tiếng Việt không cần thêm từ chỉ giới tính để diễn đạt tự nhiên.
- source_word: οὗ ἐστιν ἡ ζώνη αὕτη
  choice: người có chiếc thắt lưng này
  rationale: Diễn đạt tự nhiên quan hệ sở hữu mà không thêm ý ngoài nguyên văn.
- source_word: οὕτως
  choice: như thế
  rationale: Liên kết trực tiếp lời tiên báo với cách trói vừa được A-ga-bút làm mẫu.
- source_word: οἱ Ἰουδαῖοι
  choice: người Do Thái
  rationale: Giữ phạm vi khái quát của nguyên văn, không tự ý thu hẹp thành giới lãnh đạo Do Thái.
- source_word: παραδώσουσιν
  choice: sẽ nộp
  rationale: Diễn tả tự nhiên việc chuyển giao một người vào quyền kiểm soát của phía khác.
- source_word: εἰς χεῖρας ἐθνῶν
  choice: vào tay dân ngoại
  rationale: Giữ thành ngữ “vào tay” về việc rơi vào quyền lực của người khác; ἐθνῶν tại đây chỉ những người không thuộc dân Do Thái.
theological_decisions:
- issue: Công thức tiên tri được trình bày như lời trực tiếp của Thánh Linh
  choice: Đức Thánh Linh phán thế này
  alternative: Đây là điều Đức Thánh Linh phán
  rationale: Cách chọn giữ công thức tiên tri trang trọng của Τάδε λέγει mà không thêm diễn giải thần học.
- issue: Sở chỉ của đại từ phản thân ἑαυτοῦ
  choice: A-ga-bút trói chân tay mình
  alternative: A-ga-bút trói chân tay Phao-lô
  rationale: Đại từ phản thân tự nhiên quy chiếu về chủ thể của phân từ, vì vậy hành động là một dấu hiệu tiên tri do A-ga-bút thực hiện trên chính mình.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ nhịp kể súc tích, công thức tiên tri trang nghiêm và sự tương ứng giữa hành động biểu tượng với lời tiên báo. Không thêm tên A-ga-bút trong câu vì ngữ cảnh trước đã xác định chủ thể.
