  rationale: Sửa hai chỗ diễn giải quá mức để phản ánh trực tiếp hơn cụm sở hữu cách tuyệt đối μὴ πειθομένου và động từ ἡσυχάσαμεν, đồng thời giữ giọng văn tự nhiên, trang trọng và sắc thái thuận phục của γινέσθω.
