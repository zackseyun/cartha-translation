source:
  edition: SBLGNT
  text: μὴ πειθομένου δὲ αὐτοῦ ἡσυχάσαμεν εἰπόντες· ⸂Τοῦ κυρίου τὸ θέλημα⸃ ⸀γινέσθω.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/014.yaml
  text: And since he would not be persuaded[a], we became quiet, saying, “The Lord’s will be done.”
translation:
  language: vi
  text: 'Vì ông không chịu để chúng tôi thuyết phục, chúng tôi im lặng[a] và nói: “Xin ý Chúa được thực hiện.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hoặc “chúng tôi trở nên yên lặng”; trong ngữ cảnh, họ không tiếp tục thúc ép ông.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ πειθομένου δὲ αὐτοῦ
  choice: Nhưng vì ông không chịu nghe lời khuyên
  rationale: 'Cụm sở hữu cách tuyệt đối nêu hoàn cảnh/nguyên nhân: Phao-lô không để những người khác thuyết phục. “Không chịu nghe lời khuyên” diễn đạt tự nhiên sắc thái không thuận theo sự khuyên can, nhưng không hàm ý rằng ông không nghe thấy lời họ.'
- source_word: ἡσυχάσαμεν
  choice: chúng tôi thôi không nài nữa
  rationale: Trong ngữ cảnh, động từ chỉ việc họ ngừng khuyên can và giữ yên; cách dịch này làm rõ điều họ ngừng làm mà không thêm một hành động mới.
- source_word: εἰπόντες
  choice: và nói
  rationale: Liên kết tự nhiên phân từ bất định với động từ chính trong tiếng Việt.
- source_word: Τοῦ κυρίου
  choice: của Chúa
  rationale: Giữ cách gọi κύριος là “Chúa” và không xác định rõ hơn đối tượng quy chiếu so với nguyên văn.
- source_word: τὸ θέλημα
  choice: ý muốn
  rationale: “Ý muốn” là cách diễn đạt tự nhiên, trang trọng cho θέλημα, chỉ điều Chúa muốn hoặc định liệu.
- source_word: γινέσθω
  choice: xin ... được thực hiện
  rationale: 'Mệnh lệnh cách ngôi ba diễn tả sự thuận phục: mong ý muốn của Chúa được thành tựu; “xin” chuyển tải tự nhiên lực ngữ dụng này trong tiếng Việt.'
theological_decisions:
- issue: Cách dịch κύριος
  choice: Chúa
  alternative: Chủ
  rationale: “Chúa” là cách gọi tự nhiên trong ngữ cảnh Tân Ước và giữ nguyên mức độ xác định của tiếng Hy Lạp, không tự ý thêm “Giê-su”.
- issue: Sắc thái của γινέσθω
  choice: Xin ý muốn của Chúa được thực hiện
  alternative: Ý Chúa được nên
  rationale: Bản dịch giữ thái độ thuận phục ý muốn của Chúa, nhưng không giải thích thêm ý muốn ấy là định mệnh, mệnh lệnh hay sự cho phép.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ông” để quy chiếu Phao-lô theo mạch kể; “thôi không nài nữa” tự nhiên hơn lối dịch sát chữ “trở nên yên lặng” trong tiếng Việt và phù hợp ngữ cảnh họ ngừng khuyên can.
