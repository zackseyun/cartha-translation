  text: Μετὰ δὲ τὰς ἡμέρας ταύτας ἐπισκευασάμενοι ἀνεβαίνομεν εἰς ⸀Ἱεροσόλυμα·
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/015.yaml
  text: After these days[a], having packed up, we went up to Jerusalem.
translation:
  language: vi
  text: Sau những ngày ấy, chúng tôi chuẩn bị hành trang[a] rồi đi lên Giê-ru-sa-lem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “chuẩn bị” hoặc “sẵn sàng lên đường.” Từ Hy Lạp có thể chỉ chung việc chuẩn bị cho chuyến đi, chứ không chỉ việc thu xếp hành lý.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ τὰς ἡμέρας ταύτας
  choice: Sau những ngày ấy
  rationale: μετά với đối cách chỉ trình tự thời gian. Cách dịch này giữ liên hệ với khoảng thời gian vừa được kể mà không thêm ý rằng khoảng thời gian ấy đã hoàn toàn trôi qua.
- source_word: ἐπισκευασάμενοι
  choice: chuẩn bị hành trang
  rationale: Phân từ này chỉ việc chuẩn bị hoặc trang bị cho chuyến đi; trong ngữ cảnh du hành, cụm từ tự nhiên này có thể bao gồm việc thu xếp đồ đạc nhưng không giới hạn nghĩa vào việc đóng gói.
- source_word: ἀνεβαίνομεν
  choice: đi lên
  rationale: Động từ ở thì vị hoàn thuật lại hành trình trong quá khứ. “Đi lên” giữ nguyên hướng chuyển động và cách nói thông dụng về việc đến Giê-ru-sa-lem.
- source_word: εἰς Ἱεροσόλυμα
  choice: Giê-ru-sa-lem
  rationale: εἰς diễn tả chuyển động hướng đến thành; trong tiếng Việt, “đi lên Giê-ru-sa-lem” tự nhiên hơn việc thêm một giới từ riêng trước địa danh.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Chuẩn bị hành trang” vừa phù hợp ngữ cảnh lên đường vừa bảo toàn độ rộng nghĩa của động từ Hy Lạp; chú thích nêu các khả năng khái quát hơn.
