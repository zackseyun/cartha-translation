  text: καὶ εὑρόντες πλοῖον διαπερῶν εἰς Φοινίκην ἐπιβάντες ἀνήχθημεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/002.yaml
  text: And after finding a ship crossing over to Phoenicia[a], we went aboard and set sail.
translation:
  language: vi
  text: Sau khi tìm được một chiếc tàu đang vượt biển sang Phê-ni-xi[a], chúng tôi lên tàu và ra khơi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “một chiếc tàu đi Phê-ni-xi.” Nguyên văn Hy Lạp mô tả chiếc tàu là “đang vượt sang Phê-ni-xi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὑρόντες
  choice: sau khi tìm được
  rationale: Phân từ bất định chỉ hành động xảy ra trước hành động chính; cách dịch này diễn đạt rõ trình tự và tự nhiên trong tiếng Việt.
- source_word: πλοῖον
  choice: một chiếc tàu
  rationale: Chỉ phương tiện đường biển; “tàu” phù hợp với hành trình trên Địa Trung Hải và tự nhiên hơn “thuyền” trong ngữ cảnh này.
- source_word: διαπερῶν
  choice: đang vượt biển sang
  rationale: Phân từ hiện tại bổ nghĩa cho “tàu”, mô tả hành trình vượt qua vùng biển đến Phê-ni-xi; thêm “biển” làm rõ ý hàm chứa trong ngữ cảnh hàng hải mà không biến thành cách nói thuần túy về điểm đến.
- source_word: εἰς Φοινίκην
  choice: sang Phê-ni-xi
  rationale: εἰς biểu thị đích đến; “sang” kết hợp tự nhiên với ý vượt biển.
- source_word: ἐπιβάντες
  choice: chúng tôi lên tàu
  rationale: Trong ngữ cảnh hàng hải, động từ có nghĩa là bước lên hoặc lên một con tàu; chuyển thành mệnh đề hữu hạn giúp câu tiếng Việt rõ và trôi chảy.
- source_word: ἀνήχθημεν
  choice: ra khơi
  rationale: Trong cách dùng hàng hải, ἀνάγω mang nghĩa rời bờ để đi biển; “ra khơi” là cách diễn đạt hiện đại, tự nhiên và chính xác.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện trang trọng vừa phải, hiện đại và dễ hiểu. Giữ hình ảnh hành trình trong διαπερῶν thay vì chỉ diễn giải là tàu có điểm đến tại Phê-ni-xi; tên địa danh được phiên âm theo lối quen thuộc trong tiếng Việt.
