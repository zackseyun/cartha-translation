  - severity: low
    issue: Ghi chú b trình bày sự mơ hồ cú pháp nhưng bản văn chính lại dùng “tức là” để giải quyết quá mạnh mối liên hệ ấy
    rationale: Nên dùng “cho đến khi” trong bản văn chính, nhờ đó vừa sát nguyên ngữ vừa tự giữ được tính mở về mệnh đề mà giới hạn thời gian gắn với.
