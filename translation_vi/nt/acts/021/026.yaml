id: ACT.21.26
reference: Acts 21:26
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τότε ὁ Παῦλος παραλαβὼν τοὺς ἄνδρας τῇ ἐχομένῃ ἡμέρᾳ σὺν αὐτοῖς ἁγνισθεὶς εἰσῄει εἰς τὸ ἱερόν, διαγγέλλων τὴν ἐκπλήρωσιν τῶν ἡμερῶν τοῦ ἁγνισμοῦ ἕως οὗ προσηνέχθη ὑπὲρ ἑνὸς ἑκάστου αὐτῶν ἡ προσφορά.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/026.yaml
  text: Then Paul took the men[a], and on the next day, having purified himself with them, he entered the temple, giving notice of the completion of the days of purification[b], until the offering was presented for each one of them.
translation:
  language: vi
  text: Bấy giờ, Phao-lô dẫn những người ấy theo. Ngày hôm sau, sau khi cùng họ làm lễ thanh tẩy, ông vào khu đền thờ[a] và thông báo về việc hoàn tất những ngày thanh tẩy, cho đến khi lễ vật được dâng cho từng người trong số họ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hy Lạp dùng từ chỉ toàn bộ khu đền thờ, không riêng nơi thánh bên trong.
    reason: lexical_clarification
  - marker: b
    text: Cụm “cho đến khi” có thể được hiểu là giới hạn thời gian của việc Phao-lô vào khu đền thờ hoặc của việc ông thông báo; lễ vật được dâng cho từng người.
    reason: source_ambiguity
lexical_decisions:
- source_word: παραλαβὼν τοὺς ἄνδρας
  choice: dẫn những người ấy theo
  rationale: Diễn đạt tự nhiên hành động Phao-lô đưa những người đã được nhắc đến đi cùng mình, không thêm mục đích ngoài văn bản.
- source_word: τῇ ἐχομένῃ ἡμέρᾳ
  choice: ngày hôm sau
  rationale: Thành ngữ thời gian chỉ ngày kế tiếp ngay sau đó.
- source_word: σὺν αὐτοῖς ἁγνισθεὶς
  choice: sau khi cùng họ làm lễ thanh tẩy
  rationale: Nêu rõ tính nghi lễ của hành động; cách diễn đạt không buộc phải giải quyết hình thái này theo nghĩa hoàn toàn phản thân hay hoàn toàn bị động.
- source_word: εἰσῄει
  choice: ông vào
  rationale: Thì chưa hoàn thành có thể gợi một hành động đang diễn ra hoặc lặp lại, nhưng tiếng Việt tự nhiên không bắt buộc đánh dấu sắc thái ấy; ngữ cảnh kể chuyện được truyền đạt rõ bằng động từ đơn.
- source_word: τὸ ἱερόν
  choice: khuôn viên đền thờ
  rationale: ἱερόν chỉ toàn bộ khu đền thờ, không riêng nơi thánh bên trong; bản dịch chính làm rõ sự phân biệt từ vựng này.
- source_word: διαγγέλλων
  choice: thông báo
  rationale: Phù hợp với việc chính thức báo cho giới hữu trách về thời hạn nghi lễ.
- source_word: τὴν ἐκπλήρωσιν τῶν ἡμερῶν τοῦ ἁγνισμοῦ
  choice: khi nào những ngày thanh tẩy sẽ kết thúc
  rationale: Chuyển cụm danh từ trang trọng của tiếng Hy Lạp thành câu tiếng Việt rõ và tự nhiên, trong bối cảnh việc hoàn tất còn hướng đến một thời điểm sau đó.
- source_word: ἕως οὗ
  choice: tức là lúc
  rationale: Trong cấu trúc câu khó và có phần mơ hồ này, cụm từ nối mốc hoàn tất thời kỳ thanh tẩy với lúc lễ vật được dâng; cách dịch giữ mối liên hệ thời gian mà tránh câu tiếng Việt tối nghĩa.
- source_word: προσηνέχθη
  choice: được dâng
  rationale: Động từ bị động προσφέρω trong ngữ cảnh thờ phượng thường chỉ việc dâng lễ vật.
- source_word: ὑπὲρ ἑνὸς ἑκάστου αὐτῶν
  choice: cho từng người trong số họ
  rationale: Giữ cả ý lợi ích hoặc đại diện của ὑπέρ và sự nhấn mạnh phân phối của ἑνὸς ἑκάστου.
- source_word: ἡ προσφορά
  choice: lễ vật
  rationale: Từ ngữ khái quát, đúng với προσφορά và không thu hẹp thành một loại sinh tế cụ thể.
theological_decisions:
- issue: Ý nghĩa thần học của việc Phao-lô tham gia nghi thức thanh tẩy
  choice: Tường thuật trực tiếp việc ông tham gia nghi thức Do Thái, không thêm lời đánh giá thần học.
  alternative: Diễn đạt như thể câu này xác nhận hoặc bác bỏ hiệu lực tiếp tục của nghi lễ đền thờ đối với tín hữu.
  rationale: Câu này chỉ kể lại sự việc, không tự giải quyết các tranh luận rộng hơn về Luật pháp, giao ước hay thực hành của các sứ đồ.
- issue: Mối liên hệ cú pháp của ἕως οὗ với việc hoàn tất thời kỳ thanh tẩy và dâng lễ vật
  choice: Diễn đạt lễ vật được dâng như mốc kết thúc được thông báo, đồng thời ghi chú khả năng hiểu khác.
  alternative: Hiểu rằng Phao-lô tiếp tục vào đền thờ hoặc tiếp tục thông báo cho đến khi lễ vật được dâng.
  rationale: Cú pháp Hy Lạp cho phép hơn một cách gắn kết; bản dịch chính cần dễ hiểu nhưng không nên che khuất sự mơ hồ thật sự.
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại. Dùng “làm lễ thanh tẩy” để người đọc phổ thông nhận ra đây là nghi thức, “khuôn viên đền thờ” để phản ánh chính xác ἱερόν, và “lễ vật được dâng” theo ngôn ngữ thờ phượng tự nhiên trong tiếng Việt.
