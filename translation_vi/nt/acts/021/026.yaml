revisions:
- from: Bấy giờ, Phao-lô dẫn những người ấy theo. Ngày hôm sau, sau khi cùng họ làm lễ thanh tẩy, ông vào khuôn viên đền thờ[a] và thông báo khi nào những ngày thanh tẩy sẽ kết thúc, tức là lúc lễ vật được dâng cho từng người trong số họ[b].
  to: Bấy giờ, Phao-lô dẫn những người ấy theo. Ngày hôm sau, sau khi cùng họ làm lễ thanh tẩy, ông vào khu đền thờ[a] và thông báo về việc hoàn tất những ngày thanh tẩy, cho đến khi lễ vật được dâng cho từng người trong số họ[b].
  rationale: Thay “tức là lúc” bằng “cho đến khi” để dịch trực tiếp ἕως οὗ, bảo toàn quan hệ thời gian và sự mơ hồ cú pháp của nguyên văn. Điều chỉnh “thông báo khi nào ... sẽ kết thúc” thành “thông báo về việc hoàn tất ...” để bám sát cụm danh từ τὴν ἐκπλήρωσιν τῶν ἡμερῶν τοῦ ἁγνισμοῦ mà vẫn tự nhiên trong tiếng Việt.
