source:
  edition: SBLGNT
  text: τοῦτο οὖν ποίησον ὅ σοι λέγομεν· εἰσὶν ἡμῖν ἄνδρες τέσσαρες εὐχὴν ἔχοντες ⸀ἀφ’ ἑαυτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/023.yaml
  text: 'Therefore do what we tell you: we have four men who are under a vow of their own[a][b].'
translation:
  language: vi
  text: 'Vậy, hãy làm điều chúng tôi nói với anh: trong chúng tôi có bốn người nam đang giữ một lời khấn trên chính mình[a][b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đã khấn nguyện.” Tiếng Hy Lạp nói sát nghĩa là “đang có một lời khấn.”'
    reason: lexical_alternative
  - marker: b
    text: Văn cảnh rộng hơn có thể gợi đến một lời khấn kiểu Na-xi-rê, nhưng chính câu này chỉ nói “một lời khấn.”
    reason: cultural_note
lexical_decisions:
- source_word: τοῦτο οὖν
  choice: Vậy
  rationale: οὖν đánh dấu sự suy luận từ lời vừa nói; “Vậy” chuyển ý tự nhiên, còn τοῦτο được thể hiện trong mệnh lệnh theo sau.
- source_word: ποίησον ὅ σοι λέγομεν
  choice: hãy làm điều chúng tôi nói với anh
  rationale: Giữ trực tiếp mệnh lệnh aorist ποίησον và diễn đạt mệnh đề quan hệ ὅ σοι λέγομεν bằng tiếng Việt tự nhiên.
- source_word: εἰσὶν ἡμῖν
  choice: trong chúng tôi có
  rationale: Cấu trúc hiện hữu với tặng cách có thể hàm ý thuộc về nhóm; cách dịch này tự nhiên và tránh sắc thái sở hữu người của “chúng tôi có”.
- source_word: ἄνδρες τέσσαρες
  choice: bốn người
  rationale: Trong ngữ cảnh, ἄνδρες chỉ bốn người nam; tiếng Việt thường dùng “người” tự nhiên hơn khi giới tính không cần nhấn mạnh riêng.
- source_word: εὐχὴν ἔχοντες
  choice: đang mang một lời khấn
  rationale: Phản ánh nghĩa đen “có/mang một lời khấn” và tình trạng ràng buộc đang tiếp diễn, không khẳng định thêm loại lời khấn.
- source_word: ἀφ’ ἑαυτῶν
  choice: của chính mình
  rationale: Giữ ý lời khấn thuộc về chính những người ấy, đồng thời tránh cách nói cứng “ở trên chính mình”.
theological_decisions:
- issue: Bản chất của lời khấn
  choice: Dịch chung là “một lời khấn”
  alternative: “lời khấn Na-xi-rê”
  rationale: Dù văn cảnh rộng hơn có thể gợi đến một lời khấn kiểu Na-xi-rê, câu này chỉ dùng εὐχήν; vì vậy không nên xác định cụ thể hơn nguyên văn.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “anh” phù hợp lời nói trực tiếp với Phao-lô; giữ cách gọi lời khấn ở mức khái quát như nguyên văn.
