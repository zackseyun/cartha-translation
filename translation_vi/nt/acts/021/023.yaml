  to: 'Vậy, hãy làm điều chúng tôi nói với anh: trong chúng tôi có bốn người nam đang giữ một lời khấn trên chính mình[a][b].'
  rationale: Sửa cách diễn đạt lời khấn để tiếng Việt tự nhiên hơn và để phản ánh rõ hơn ἀφ’ ἑαυτῶν là lời khấn ở trên chính những người này. Thêm “nam” để giữ nghĩa của ἄνδρες. Không xác định lời khấn là Na-xi-rê trong bản văn chính.
