  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Phao-lô” và “Hê-bơ-rơ” theo lối phiên âm quen thuộc; giữ sự mơ hồ thực sự giữa tiếng Hê-bơ-rơ và tiếng A-ram bằng chú thích.
