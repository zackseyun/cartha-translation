source:
  edition: SBLGNT
  text: ἐπιτρέψαντος δὲ αὐτοῦ ὁ Παῦλος ἑστὼς ἐπὶ τῶν ἀναβαθμῶν κατέσεισε τῇ χειρὶ τῷ λαῷ, πολλῆς δὲ σιγῆς γενομένης ⸀προσεφώνησεν τῇ Ἑβραΐδι διαλέκτῳ λέγων
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/040.yaml
  text: 'And when he had given permission[a], Paul, standing on the steps, motioned with his hand to the people. And when a great silence had come, he addressed them in the Hebrew language, saying:'
translation:
  language: vi
  text: 'Khi viên chỉ huy cho phép, Phao-lô đứng trên các bậc thang, đưa tay ra hiệu cho dân chúng. Khi mọi người đã hoàn toàn im lặng, ông nói với họ bằng tiếng Hê-bơ-rơ[a] rằng:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể là “bằng tiếng A-ram.” Nguyên văn Hy Lạp là “bằng ngôn ngữ/phương ngữ Hê-bơ-rơ”; trong bối cảnh này, cụm từ ấy có thể chỉ ngôn ngữ Semit địa phương thường được gọi là tiếng A-ram.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιτρέψαντος δὲ αὐτοῦ
  choice: Khi viên chỉ huy cho phép
  rationale: Cụm sở hữu cách tuyệt đối chỉ về viên chỉ huy trong văn cảnh trước. Nêu rõ chủ thể giúp tiếng Việt tự nhiên mà không thêm ý ngoài văn cảnh.
- source_word: ἑστὼς ἐπὶ τῶν ἀναβαθμῶν
  choice: đứng trên các bậc thang
  rationale: Phân từ hoàn thành mô tả tư thế và vị trí của Phao-lô; ἀναβαθμοί là các bậc/cầu thang dẫn lên đồn.
- source_word: κατέσεισε τῇ χειρὶ τῷ λαῷ
  choice: đưa tay ra hiệu cho dân chúng
  rationale: Diễn đạt tự nhiên hành động dùng tay ra hiệu với những người đang tụ họp, có thể nhằm khiến họ yên lặng để nghe.
- source_word: τῷ λαῷ
  choice: dân chúng
  rationale: Giữ nghĩa cơ bản của λαός là dân/chúng dân, đồng thời phù hợp với đám đông trong bối cảnh.
- source_word: πολλῆς δὲ σιγῆς γενομένης
  choice: Khi mọi người đã hoàn toàn im lặng
  rationale: Chuyển đạt tự nhiên trong tiếng Việt ý về một sự im lặng sâu rộng vừa hình thành, thay vì dịch máy móc là 'một sự im lặng lớn'.
- source_word: προσεφώνησεν
  choice: ông nói với họ
  rationale: Động từ chỉ việc công khai ngỏ lời với người nghe; cách diễn đạt này sáng rõ, tự nhiên và không cường điệu sắc thái.
- source_word: τῇ Ἑβραΐδι διαλέκτῳ
  choice: bằng tiếng Hê-bơ-rơ[a]
  rationale: Giữ nguyên cách gọi của bản Hy Lạp là 'ngôn ngữ/phương ngữ Hê-bơ-rơ', đồng thời ghi chú khả năng từ này chỉ tiếng A-ram trong bối cảnh.
- source_word: λέγων
  choice: 'rằng:'
  rationale: Phân từ dẫn vào lời nói trực tiếp tiếp theo; 'rằng:' là cách nối tự nhiên trong tiếng Việt.
theological_decisions: []
