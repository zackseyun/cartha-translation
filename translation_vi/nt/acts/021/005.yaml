source:
  edition: SBLGNT
  text: ὅτε δὲ ἐγένετο ⸂ἐξαρτίσαι ἡμᾶς⸃ τὰς ἡμέρας, ἐξελθόντες ἐπορευόμεθα προπεμπόντων ἡμᾶς πάντων σὺν γυναιξὶ καὶ τέκνοις ἕως ἔξω τῆς πόλεως, καὶ θέντες τὰ γόνατα ἐπὶ τὸν αἰγιαλὸν ⸀προσευξάμενοι
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/005.yaml
  text: When it came time for us to complete those days[a], we departed and went on our way, while they all, with wives and children, were accompanying us as far as outside the city. And after kneeling down on the beach[b], we prayed.
translation:
  language: vi
  text: Khi chúng tôi đã hoàn tất những ngày ấy[a], chúng tôi lên đường tiếp tục hành trình. Mọi người cùng vợ con họ tiễn chúng tôi ra tận ngoài thành. Trên bờ biển[b], chúng tôi quỳ xuống cầu nguyện.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “Khi đến lúc chúng tôi hoàn tất những ngày ấy.”'
    reason: lexical_alternative
  - marker: b
    text: 'Hoặc: “trên bãi biển” hay “trên bờ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ἐξαρτίσαι ἡμᾶς τὰς ἡμέρας
  choice: khi chúng tôi đã ở hết những ngày ấy
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt, truyền đạt việc khoảng thời gian lưu lại đã mãn mà vẫn giữ quy chiếu cụ thể của “những ngày ấy”.
- source_word: ἐξελθόντες ἐπορευόμεθα
  choice: chúng tôi lên đường tiếp tục hành trình
  rationale: Giữ cả ý rời đi và tiếp tục cuộc hành trình, đồng thời tránh lối diễn đạt trùng lặp, nặng nề trong tiếng Việt.
- source_word: προπεμπόντων ἡμᾶς πάντων
  choice: tất cả họ ... tiễn chúng tôi
  rationale: προπέμπω trong bối cảnh này chỉ việc cùng đi với người sắp khởi hành như một hành động tiễn đưa; “tiễn” là cách nói tự nhiên và chính xác trong tiếng Việt.
- source_word: σὺν γυναιξὶ καὶ τέκνοις
  choice: cùng với vợ và con cái
  rationale: Với πάντων ở giống đực số nhiều và bối cảnh các gia đình cùng tiễn đưa, γυναιξίν hợp lý nhất là “vợ” hơn là “phụ nữ” nói chung.
- source_word: ἕως ἔξω τῆς πόλεως
  choice: ra tận ngoài thành
  rationale: “Ra tận” bảo toàn sắc thái giới hạn của ἕως và hướng chuyển động đến một điểm bên ngoài thành phố.
- source_word: θέντες τὰ γόνατα
  choice: quỳ xuống
  rationale: Đây là thành ngữ Hy Lạp chỉ hành động quỳ; bản dịch tiếng Việt dùng cách nói tương đương tự nhiên.
- source_word: ἐπὶ τὸν αἰγιαλόν
  choice: tại bờ biển
  rationale: αἰγιαλός có thể chỉ bãi biển, bờ biển hoặc bờ nước; “bờ biển” trang trọng, tự nhiên và phù hợp địa cảnh.
- source_word: προσευξάμενοι
  choice: chúng tôi ... cầu nguyện
  rationale: Phân từ số nhiều tiếp nối hành động quỳ; chuyển thành động từ hữu hạn giúp câu tiếng Việt sáng rõ mà không thay đổi trình tự sự việc.
