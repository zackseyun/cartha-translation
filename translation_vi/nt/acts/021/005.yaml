revisions:
- from: Khi chúng tôi đã ở hết những ngày ấy[a], chúng tôi lên đường tiếp tục hành trình. Tất cả họ, cùng với vợ và con cái, tiễn chúng tôi ra tận ngoài thành. Tại bờ biển[b], chúng tôi quỳ xuống cầu nguyện.
  to: Khi chúng tôi đã hoàn tất những ngày ấy[a], chúng tôi lên đường tiếp tục hành trình. Mọi người cùng vợ con họ tiễn chúng tôi ra tận ngoài thành. Trên bờ biển[b], chúng tôi quỳ xuống cầu nguyện.
  rationale: Bản sửa thay “ở hết” bằng “hoàn tất” để phản ánh trực tiếp ἐξαρτίζω mà không thêm ý; chỉnh cụm chỉ những người tiễn đưa cho tự nhiên; và sửa chú thích b để các phương án thực sự khác với bản văn chính. Các mốc chú thích [a] và [b] vẫn gắn đúng với các cụm được chú giải.
