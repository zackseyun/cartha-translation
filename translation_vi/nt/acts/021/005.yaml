translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “thành” phù hợp văn thể Kinh Thánh mà vẫn thông dụng; “tiễn ... ra tận ngoài thành” diễn tả tự nhiên việc cả cộng đồng cùng đi tiễn.
