id: ACT.21.29
reference: Acts 21:29
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἦσαν γὰρ ⸀προεωρακότες Τρόφιμον τὸν Ἐφέσιον ἐν τῇ πόλει σὺν αὐτῷ, ὃν ἐνόμιζον ὅτι εἰς τὸ ἱερὸν εἰσήγαγεν ὁ Παῦλος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/029.yaml
  text: For they had previously seen Trophimus the Ephesian in the city with him[a], and they supposed that Paul had brought him into the temple.
translation:
  language: vi
  text: Vì trước đó họ đã thấy Trô-phi-mô, người Ê-phê-sô, ở trong thành cùng với Phao-lô, nên họ cho rằng Phao-lô đã đưa ông ấy vào khuôn viên đền thờ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hy Lạp ở đây chỉ toàn thể khu vực hoặc khuôn viên đền thờ, không nhất thiết chỉ nơi thánh bên trong.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦσαν ... προεωρακότες
  choice: trước đó họ đã thấy
  rationale: Kết cấu ngoại vi diễn tả hành động xảy ra trước sự việc đang thuật lại; cách dịch này tự nhiên trong tiếng Việt và giữ rõ quan hệ thời gian.
- source_word: Τρόφιμον τὸν Ἐφέσιον
  choice: Trô-phi-mô, người Ê-phê-sô
  rationale: Tính từ dùng đồng vị xác định quê quán của Trô-phi-mô; “người Ê-phê-sô” là cách nói tự nhiên, rõ nghĩa trong tiếng Việt.
- source_word: ἐν τῇ πόλει
  choice: ở trong thành
  rationale: πόλις chỉ thành Giê-ru-sa-lem, phân biệt với khu đền thờ; “trong thành” phù hợp văn cảnh cổ đại và văn phong Kinh Thánh hiện đại.
- source_word: σὺν αὐτῷ
  choice: cùng với Phao-lô
  rationale: Dùng tên riêng thay cho đại từ để tránh sự mơ hồ trong tiếng Việt; theo văn cảnh, αὐτῷ quy chiếu đến Phao-lô.
- source_word: ἐνόμιζον
  choice: họ cho rằng
  rationale: νομίζω ở đây diễn tả sự suy đoán hay kết luận dựa trên điều họ đã thấy, chứ không phải tri thức chắc chắn; “cho rằng” giữ được sắc thái này mà không quá nặng như “khẳng định”.
- source_word: εἰς τὸ ἱερὸν
  choice: vào khuôn viên đền thờ
  rationale: ἱερόν chỉ toàn thể khu vực hay quần thể đền thờ, không nhất thiết là chính điện hoặc nơi thánh bên trong; cách dịch này đưa độ chính xác lịch sử vào câu chính.
- source_word: εἰσήγαγεν
  choice: đã đưa ông ấy vào
  rationale: Aorist chỉ hành động mà họ cho là Phao-lô đã thực hiện; “đưa ... vào” diễn đạt tự nhiên ý dẫn hoặc đem một người vào một khu vực.
theological_decisions:
- issue: Phạm vi nghĩa của ἱερόν trong lời cáo buộc đối với Phao-lô
  choice: khuôn viên đền thờ
  alternative: đền thờ; các sân đền thờ
  rationale: ἱερόν rộng hơn ναός và trong văn cảnh này lời cáo buộc liên quan đến việc đưa một người ngoại quốc vào khu vực thánh bị giới hạn. “Khuôn viên đền thờ” bảo toàn độ chính xác mà không xác định quá mức rằng ông đã vào một sân cụ thể nào.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng các dạng tên quen thuộc trong truyền thống Kinh Thánh tiếng Việt. Liên từ “Vì ... nên ...” làm rõ chức năng giải thích của γάρ và quan hệ giữa điều họ từng thấy với kết luận sai lầm của họ; không thêm phán đoán thần học ngoài văn bản.
