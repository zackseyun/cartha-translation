  terminology: Tên riêng và thuật ngữ được dùng nhất quán. “Người Ê-phê-sô” diễn đạt đúng danh xưng Ἐφέσιον; “khuôn viên đền thờ” cùng chú thích bảo toàn sự phân biệt từ vựng giữa ἱερόν và một nội điện/nơi thánh cụ thể.
