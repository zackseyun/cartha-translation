source:
  edition: SBLGNT
  text: Μέλλων τε εἰσάγεσθαι εἰς τὴν παρεμβολὴν ὁ Παῦλος λέγει τῷ χιλιάρχῳ· Εἰ ἔξεστίν μοι εἰπεῖν ⸀τι πρὸς σέ; ὁ δὲ ἔφη· Ἑλληνιστὶ γινώσκεις;
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/037.yaml
  text: As Paul was about to be brought into the barracks[a], he said to the tribune, “Is it permitted for me to say something to you?” And he said[c][b], “Do you know Greek?”
translation:
  language: vi
  text: 'Khi Phao-lô sắp bị đưa vào doanh trại[a], ông nói với viên chỉ huy[b]: “Tôi có được phép nói với ngài đôi lời không?” Viên chỉ huy hỏi: “Anh biết tiếng Hy Lạp sao?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Doanh trại” chỉ khu đóng quân của quân đội La Mã, có lẽ nằm trong khu pháo đài.
    reason: cultural_note
  - marker: b
    text: Tiếng Hy Lạp dùng một chức danh quân sự La Mã, thường được gọi là “tribune”; cũng có thể dịch là “viên chỉ huy”.
    reason: cultural_note
lexical_decisions:
- source_word: Μέλλων τε εἰσάγεσθαι
  choice: Khi Phao-lô sắp bị đưa vào
  rationale: Diễn đạt tự nhiên cấu trúc phân từ chỉ thời gian, đồng thời giữ ý sắp xảy ra của μέλλω và thể bị động của εἰσάγεσθαι.
- source_word: παρεμβολή
  choice: doanh trại
  rationale: Trong bối cảnh quân đội La Mã tại Giê-ru-sa-lem, từ này chỉ khu đóng quân, có lẽ nằm trong khu pháo đài; “doanh trại” là cách gọi rõ và tự nhiên trong tiếng Việt.
- source_word: χιλίαρχος
  choice: viên chỉ huy
  rationale: Từ Hy Lạp chỉ một sĩ quan La Mã cấp cao, theo nghĩa đen gắn với quyền chỉ huy khoảng một nghìn quân. “Viên chỉ huy” dễ hiểu hơn một chức danh La Mã ít quen thuộc, còn mức độ cụ thể được giải thích trong chú thích.
- source_word: Εἰ ἔξεστίν μοι εἰπεῖν τι πρὸς σέ
  choice: Tôi có được phép nói với ngài đôi lời không?
  rationale: Giữ sắc thái xin phép lịch sự của ἔξεστιν và chuyển cấu trúc điều kiện dùng như câu hỏi sang lối hỏi tự nhiên trong tiếng Việt. “Đôi lời” diễn đạt τι theo ngữ cảnh mà không thêm nội dung cụ thể.
- source_word: Ἑλληνιστί γινώσκεις
  choice: Anh biết tiếng Hy Lạp sao?
  rationale: Giữ nghĩa cơ bản “biết” của γινώσκω trong ngữ cảnh ngôn ngữ. Tiểu từ “sao” truyền đạt sắc thái ngạc nhiên hàm chứa trong câu hỏi theo mạch văn, nhưng không biến thành một khẳng định.
theological_decisions: []
translation_notes:
  register: 'Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Đại từ được phân biệt theo địa vị và tình huống: Phao-lô tự xưng “tôi”, gọi sĩ quan là “ngài”; viên chỉ huy gọi Phao-lô là “anh”. Câu thoại đầu được Việt hóa thành lời xin phép tự nhiên, còn câu hỏi cuối giữ sắc thái ngạc nhiên.'
