language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἀσπασάμενος αὐτοὺς ἐξηγεῖτο καθ’ ἓν ἕκαστον ὧν ἐποίησεν ὁ θεὸς ἐν τοῖς ἔθνεσιν διὰ τῆς διακονίας αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/019.yaml
  text: And after greeting them[b][a], he began to relate one by one the things that God had done among the Gentiles through his ministry.
translation:
  language: vi
  text: Sau khi chào thăm họ, ông thuật lại từng việc một[a] mà Đức Chúa Trời đã làm giữa các dân ngoại[b] qua chức vụ của ông.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “thuật lại chi tiết.” Cụm từ Hy Lạp nhấn mạnh một bản tường thuật lần lượt theo từng việc.'
    reason: lexical_alternative
  - marker: b
    text: Hay “giữa các dân.” Trong ngữ cảnh này, cụm từ chỉ các dân ngoại, tức những người không phải người Do Thái.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπασάμενος
  choice: Sau khi chào thăm
  rationale: Phân từ bất định thì đứng trước động từ chính, diễn tả hành động xảy ra trước; cách dịch này tự nhiên trong tiếng Việt và giữ rõ trình tự.
- source_word: ἐξηγεῖτο
  choice: ông thuật lại
  rationale: Động từ ở thì chưa hoàn thành gợi một bản tường thuật đang diễn tiến; “thuật lại” truyền đạt ý kể hoặc trình bày đầy đủ mà không thêm sắc thái không có trong nguyên văn.
- source_word: καθ’ ἓν ἕκαστον
  choice: từng việc một
  rationale: Thành ngữ nhấn mạnh việc kể lần lượt theo từng mục; cách nói này tự nhiên và rõ nghĩa trong tiếng Việt hiện đại.
- source_word: ὧν ἐποίησεν ὁ θεὸς
  choice: những việc mà Đức Chúa Trời đã làm
  rationale: Giữ Đức Chúa Trời làm chủ thể hành động và chỉ đến những việc cụ thể đã xảy ra.
- source_word: ἐν τοῖς ἔθνεσιν
  choice: giữa các dân ngoại
  rationale: Trong ngữ cảnh này, ἔθνη chỉ những dân không thuộc dân Do Thái, chứ không chủ yếu nói về các quốc gia theo nghĩa địa chính trị.
- source_word: διὰ τῆς διακονίας αὐτοῦ
  choice: qua chức vụ của ông
  rationale: διά với sở hữu cách biểu thị phương tiện; διακονία ở đây nói đến công việc phục vụ của Phao-lô. “Chức vụ” là cách diễn đạt quen thuộc, trang trọng và không biến công việc ấy thành một chức danh riêng.
theological_decisions:
- issue: Chủ thể hành động trong bản báo cáo truyền giáo của Phao-lô
  choice: Đức Chúa Trời là Đấng hành động, còn chức vụ của Phao-lô là phương tiện Ngài dùng.
  alternative: Phao-lô kể lại những thành tựu do chính mình thực hiện giữa các dân ngoại.
  rationale: Cụm ἐποίησεν ὁ θεὸς nêu rõ Đức Chúa Trời là chủ thể, còn διὰ τῆς διακονίας αὐτοῦ diễn tả chức vụ của Phao-lô như phương tiện. Bản dịch giữ nguyên cả quyền chủ động của Đức Chúa Trời lẫn vai trò phục vụ của con người.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ông” để chỉ Phao-lô theo mạch văn; “chào thăm” tự nhiên hơn lối dịch sát chữ “sau khi đã chào.” Các dấu chú thích [a], [b] đều được đặt ngay sau cụm từ liên quan trong câu chính.
