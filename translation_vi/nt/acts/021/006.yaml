id: ACT.21.6
reference: Acts 21:6
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸂ἀπησπασάμεθα ἀλλήλους, καὶ⸃ ⸀ἐνέβημεν εἰς τὸ πλοῖον, ἐκεῖνοι δὲ ὑπέστρεψαν εἰς τὰ ἴδια.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/006.yaml
  text: After we had said farewell to one another[a], we boarded the ship[b], and they returned to their own homes.
translation:
  language: vi
  text: Sau khi từ biệt nhau[a], chúng tôi lên tàu, còn họ trở về nhà mình.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “chào nhau rồi chia tay.” Cụm từ Hy Lạp có thể chỉ việc chào hỏi hoặc từ biệt; bối cảnh lên đường nghiêng về nghĩa từ biệt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπησπασάμεθα ἀλλήλους
  choice: từ biệt nhau
  rationale: Trong bối cảnh ra đi, động từ ở dạng trung cùng đại từ tương hỗ diễn tả việc đôi bên chào từ biệt. Cách dịch này tự nhiên, gọn và vẫn giữ tính tương hỗ của nguyên văn.
- source_word: ἐνέβημεν
  choice: chúng tôi lên
  rationale: Động từ chỉ hành động bước vào hoặc lên một phương tiện; đi với πλοῖον, “lên tàu” là cách nói tự nhiên trong tiếng Việt.
- source_word: πλοῖον
  choice: tàu
  rationale: Từ này có thể chỉ thuyền hoặc tàu; trong trình thuật hành trình đường biển của Công Vụ, “tàu” phù hợp và tự nhiên.
- source_word: ὑπέστρεψαν
  choice: họ trở về
  rationale: Diễn đạt trực tiếp chuyển động quay lại, đồng thời phù hợp với đích đến là nơi ở của họ.
- source_word: εἰς τὰ ἴδια
  choice: về nhà mình
  rationale: Cụm trung tính số nhiều theo nghĩa đen là “những gì/nơi thuộc về mình”, nhưng ở đây là thành ngữ chỉ nơi riêng hay nhà của họ. “Về nhà mình” rõ nghĩa và tự nhiên mà không thêm chi tiết không có trong văn bản.
theological_decisions: []
translation_notes:
  register: Văn phong trần thuật hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “còn họ” để thể hiện sự tương phản của δέ giữa hai nhóm đi theo hai hướng khác nhau.
