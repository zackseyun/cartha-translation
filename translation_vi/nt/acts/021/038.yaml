  text: οὐκ ἄρα σὺ εἶ ὁ Αἰγύπτιος ὁ πρὸ τούτων τῶν ἡμερῶν ἀναστατώσας καὶ ἐξαγαγὼν εἰς τὴν ἔρημον τοὺς τετρακισχιλίους ἄνδρας τῶν σικαρίων;
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/038.yaml
  text: Then you are not the Egyptian who some days ago stirred up a revolt and led the four thousand men of the assassins out into the wilderness?[a]
translation:
  language: vi
  text: Vậy chẳng phải ông là người Ai Cập, trước đây ít lâu đã kích động một cuộc nổi loạn và dẫn bốn nghìn người sát thủ[a] vào vùng hoang vắng sao?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc dịch: “bốn nghìn người dùng dao găm.” Tiếng Hy Lạp dùng “Sicarii”, tên gọi những người nổi tiếng với các vụ ám sát bằng dao găm giấu kín.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἄρα
  choice: Vậy chẳng phải ... sao?
  rationale: 'Diễn đạt tự nhiên một câu hỏi suy luận: viên chỉ huy rút ra kết luận từ việc Phao-lô nói tiếng Hy Lạp, đồng thời chờ lời xác nhận.'
- source_word: ὁ Αἰγύπτιος
  choice: người Ai Cập
  rationale: Mạo từ xác định cho thấy đây là một nhân vật đã được biết đến; trong tiếng Việt, danh ngữ này tự nhiên mà vẫn giữ tính xác định theo ngữ cảnh.
- source_word: πρὸ τούτων τῶν ἡμερῶν
  choice: trước đây ít lâu
  rationale: Thành ngữ chỉ một thời điểm không lâu trước hiện tại, không xác định chính xác số ngày.
- source_word: ἀναστατώσας
  choice: kích động một cuộc nổi loạn
  rationale: Trong bối cảnh chính trị, động từ nói đến việc gây biến loạn hay nổi dậy, chứ không chỉ làm xáo trộn chung chung.
- source_word: ἐξαγαγὼν
  choice: dẫn ... vào
  rationale: Động từ mang nghĩa dẫn ra khỏi một nơi; kết hợp với đích đến εἰς τὴν ἔρημον, tiếng Việt tự nhiên dùng “dẫn ... vào hoang mạc”.
- source_word: εἰς τὴν ἔρημον
  choice: vào hoang mạc
  rationale: ἔρημος là vùng hoang vắng, không nhất thiết là sa mạc cát; “hoang mạc” giữ được sắc thái địa lý rộng.
- source_word: τοὺς τετρακισχιλίους ἄνδρας
  choice: bốn ngàn tên
  rationale: Chỉ nhóm bốn ngàn người xác định đi theo nhân vật này; “tên” phù hợp với cách người nói nhìn một nhóm sát thủ, nhưng không thêm ý nghĩa ngoài ngữ cảnh.
- source_word: τῶν σικαρίων
  choice: sát thủ
  rationale: σικάριοι chỉ những kẻ nổi tiếng dùng dao găm giấu kín để ám sát; “sát thủ” truyền đạt rõ chức năng cho độc giả hiện đại, còn tên gọi lịch sử và nghĩa sát chữ được ghi ở chú thích.
