  text: For the crowd of the people was following[a], shouting, “Take him away!”
translation:
  language: vi
  text: 'Vì đám đông dân chúng cứ đi theo sau và hô lớn: “Đem hắn đi!”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “Tống hắn đi!”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠκολούθει
  choice: vẫn đi theo
  rationale: Thì chưa hoàn thành diễn tả hành động đang tiếp diễn trong quá khứ; “vẫn đi theo” tự nhiên trong tiếng Việt và cho thấy đoàn dân tiếp tục bám theo.
- source_word: γὰρ
  choice: Vì
  rationale: Giữ quan hệ giải thích với diễn biến ngay trước đó.
- source_word: τὸ πλῆθος τοῦ λαοῦ
  choice: đoàn dân đông
  rationale: Diễn đạt tự nhiên ý một số đông trong dân chúng, đồng thời tránh sắc thái miệt thị không có sẵn trong nguyên văn.
- source_word: κράζοντες
  choice: la lớn
  rationale: Diễn tả tiếng hô mạnh, công khai đi kèm hành động đi theo.
- source_word: Αἶρε αὐτόν
  choice: Khử hắn đi!
  rationale: Trong ngữ cảnh thù nghịch, mệnh lệnh αἶρε mang nghĩa loại bỏ người ấy và có thể hàm ý giết chết; cách nói này giữ sức nặng của lời hô trong tiếng Việt hiện đại.
