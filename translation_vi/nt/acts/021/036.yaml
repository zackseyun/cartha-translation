  verdict: revise
  source_fidelity: Bản nháp giữ được liên từ giải thích γάρ và sắc thái tiếp diễn của ἠκολούθει. Tuy nhiên, “Khử hắn đi!” thường hàm ý thủ tiêu/giết, mạnh hơn mệnh lệnh αἶρε trong câu này, vốn trước hết là lời đòi đem Paul đi/loại đi. Cần tránh xác quyết hàm ý giết chết không được nêu rõ trong bản văn.
  naturalness: “Đoàn dân đông” hiểu được nhưng không tự nhiên bằng “đám đông dân chúng”; “cứ đi theo sau” và “hô lớn” tạo văn kể chuyện hiện đại, rõ ràng và phù hợp với hành động đồng thời của phân từ κράζοντες.
  terminology: “Đám đông dân chúng” phản ánh trung tính τὸ πλῆθος τοῦ λαοῦ, không gán trước sắc thái “đám đông hỗn loạn”. “Đem hắn đi!” chuyển đạt tự nhiên mệnh lệnh αἶρε αὐτόν; chú thích nêu cách diễn đạt thành ngữ mạnh hơn mà không biến nó thành lời xác định giết người.
  issues:
  - severity: medium
    issue: “Khử hắn đi!” vượt quá nghĩa trực tiếp của Αἶρε αὐτόν.
    rationale: Trong tiếng Việt hiện đại, “khử” thường chỉ việc tiêu diệt hoặc giết. Dù lời hô trong ngữ cảnh thù nghịch có thể hướng đến việc loại Paul khỏi hiện diện của họ, động từ Hy Lạp không tự nó khẳng định hành động giết chết tại đây.
  - severity: low
    issue: “Đoàn dân đông” hơi gượng trong tiếng Việt hiện đại.
    rationale: “Đám đông dân chúng” là cách gọi tự nhiên hơn cho một tập thể đông người, đồng thời vẫn giữ tính trung lập của nguyên văn.
