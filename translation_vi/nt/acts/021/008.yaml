language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τῇ δὲ ἐπαύριον ἐξελθόντες ⸀ἤλθομεν εἰς Καισάρειαν, καὶ εἰσελθόντες εἰς τὸν οἶκον Φιλίππου τοῦ εὐαγγελιστοῦ ὄντος ἐκ τῶν ἑπτὰ ἐμείναμεν παρ’ αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/008.yaml
  text: On the next day we departed and came to Caesarea[a], and entering the house of Philip the evangelist, who was one of the seven, we stayed with him.
translation:
  language: vi
  text: Ngày hôm sau, chúng tôi rời đi và đến Sê-sa-rê. Chúng tôi vào nhà Phi-líp, người rao giảng Tin Mừng và là một trong bảy người[a], rồi ở lại với ông.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tức là một trong bảy người trước đó đã được chọn để đảm trách công việc phục vụ tại Giê-ru-sa-lem (xem Công Vụ 6:3–6).
    reason: cross_reference
lexical_decisions:
- source_word: τῇ δὲ ἐπαύριον
  choice: Ngày hôm sau
  rationale: Cụm thời gian này được chuyển thành cách nói tự nhiên trong tiếng Việt, giữ rõ trình tự của câu chuyện; δέ chỉ nhẹ nhàng nối tiếp diễn biến nên không cần dịch thành một liên từ riêng.
- source_word: ἐξελθόντες
  choice: rời đi
  rationale: Phân từ diễn tả việc rời địa điểm trước đó để tiếp tục hành trình. “Rời đi” rõ nghĩa và tự nhiên hơn cách dịch sát hình thức như “đi ra”.
- source_word: ἤλθομεν εἰς Καισάρειαν
  choice: đến Sê-sa-rê
  rationale: Động từ cùng giới từ chỉ việc đi đến một đích; “đến” giữ được ý chuyển động và đến nơi mà không gộp quá mức thành “tới nơi” hay “đã đến nơi”.
- source_word: Καισάρειαν
  choice: Sê-sa-rê
  rationale: Dùng dạng phiên âm quen thuộc trong tiếng Việt cho địa danh Caesarea; không tự ý thêm “ven biển” vì nguyên văn không có.
- source_word: εἰσελθόντες εἰς τὸν οἶκον
  choice: vào nhà
  rationale: Diễn đạt trực tiếp hành động bước vào nhà, giữ trình tự trước hành động ở lại mà vẫn tự nhiên trong văn kể tiếng Việt.
- source_word: Φιλίππου
  choice: Phi-líp
  rationale: Dùng dạng phiên âm tên riêng quen thuộc và dễ đọc trong tiếng Việt.
- source_word: τοῦ εὐαγγελιστοῦ
  choice: người truyền bá Tin Mừng
  rationale: εὐαγγελιστής chỉ người công bố tin mừng. Cách diễn đạt này rõ với độc giả phổ thông và không áp đặt một chức danh giáo hội về sau.
- source_word: ὄντος ἐκ τῶν ἑπτὰ
  choice: là một trong bảy người
  rationale: Giữ nguyên cách nhận diện lịch sử của Phi-líp, có liên hệ đến nhóm bảy người trong Công Vụ 6 nhưng không biến cụm từ thành tên một chức vụ kỹ thuật.
- source_word: ἐμείναμεν παρ’ αὐτῷ
  choice: ở lại với ông
  rationale: Trong bối cảnh tiếp đón khách đường xa, μένω với παρά chỉ việc lưu lại nơi người ấy. “Ở lại với ông” là cách nói tự nhiên và giữ đại từ kính trọng phù hợp.
theological_decisions:
- issue: Việc Phi-líp được gọi là “một trong bảy người”
  choice: Giữ cách gọi lịch sử “là một trong bảy người” và chú thích liên hệ Công Vụ 6.
  alternative: Viết hoa thành “một trong Nhóm Bảy Người” hoặc gọi họ là một chức vụ giáo hội cụ thể.
  rationale: Nguyên văn gợi lại bảy người đã được chọn trước đó, nhưng không nêu một danh xưng chức vụ kỹ thuật. Bản dịch không nhập vào câu các kết luận về cơ cấu giáo hội.
- issue: Ý nghĩa của εὐαγγελιστής
  choice: Dịch mô tả là “người truyền bá Tin Mừng”.
  alternative: Dùng danh xưng “nhà truyền giảng Tin Mừng” hoặc một chức danh giáo hội chuyên biệt.
  rationale: Cách chọn này giữ chức năng công bố Tin Mừng của Phi-líp mà không quyết định liệu từ này tại đây có chỉ một chức vụ được thể chế hóa hay không.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Câu Hy Lạp dài được tách thành hai câu tiếng Việt để tránh chuỗi phân từ nặng nề nhưng vẫn giữ đúng thứ tự các hành động. Dấu chú thích được đặt ngay sau “bảy người”, là nội dung mà chú thích giải thích.
