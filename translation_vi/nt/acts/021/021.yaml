id: ACT.21.21
reference: Acts 21:21
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: κατηχήθησαν δὲ περὶ σοῦ ὅτι ἀποστασίαν διδάσκεις ἀπὸ Μωϋσέως τοὺς κατὰ τὰ ἔθνη πάντας Ἰουδαίους, λέγων μὴ περιτέμνειν αὐτοὺς τὰ τέκνα μηδὲ τοῖς ἔθεσιν περιπατεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/021.yaml
  text: But they have been informed about you that you are teaching all the Jews among the Gentiles to forsake Moses[c][b][a], telling them not to circumcise their children nor to walk according to the customs.
translation:
  language: vi
  text: Nhưng họ đã được thông báo về anh rằng anh dạy tất cả người Do Thái ở giữa các dân ngoại từ bỏ Môi-se,[a][b] bảo họ đừng cắt bì cho con cái mình, cũng đừng sống theo các tập tục.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “rằng anh dạy sự từ bỏ Môi-se.” Từ Hy Lạp ἀποστασία chỉ sự từ bỏ hoặc bội phản.'
    reason: lexical_alternative
  - marker: b
    text: Ở đây, “Môi-se” đại diện cho luật pháp Môi-se và các thực hành truyền thống của người Do Thái.
    reason: cultural_note
  - marker: c
    text: 'Hoặc: “cũng đừng bước đi theo các tập tục.” “Bước đi” là hình ảnh chỉ cách sống hoặc cách cư xử.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατηχήθησαν
  choice: đã được nghe nói
  rationale: Động từ bị động ở đây chỉ việc người ta được truyền đạt bằng lời những thông tin về Phao-lô; cách dịch này tự nhiên và không hàm ý lời báo cáo là đúng.
- source_word: ἀποστασίαν ... ἀπὸ Μωϋσέως
  choice: lìa bỏ Môi-se
  rationale: ἀποστασία diễn tả sự lìa bỏ hay phản bội. Chuyển danh từ Hy Lạp thành cụm động từ tiếng Việt giúp câu tự nhiên mà vẫn giữ nguyên sức nặng của lời cáo buộc.
- source_word: τοὺς κατὰ τὰ ἔθνη πάντας Ἰουδαίους
  choice: tất cả người Do Thái sống giữa các dân ngoại
  rationale: Cụm từ nói đến những người Do Thái cư ngụ giữa các dân; thêm “sống” làm rõ quan hệ này trong tiếng Việt mà không thay đổi nội dung.
- source_word: λέγων
  choice: bảo họ
  rationale: Phân từ này trình bày nội dung hoặc cách thức của lời dạy bị cáo buộc và quy chiếu tự nhiên đến những người Do Thái vừa được nhắc tới.
- source_word: μὴ περιτέμνειν αὐτοὺς τὰ τέκνα
  choice: không được làm phép cắt bì cho con cái mình
  rationale: Giữ từ rộng τέκνα là “con cái” thay vì thu hẹp thành “con trai”; “mình” chuyển tải quan hệ sở hữu được hiểu từ αὐτούς.
- source_word: μηδὲ τοῖς ἔθεσιν περιπατεῖν
  choice: cũng không được sống theo các tập tục
  rationale: περιπατεῖν theo nghĩa bóng là sống hay cư xử. “Sống theo” tự nhiên hơn trong tiếng Việt hiện đại, còn “các tập tục” giữ ý về những thực hành Do Thái được truyền lại.
theological_decisions:
- issue: Tính chất của lời cáo buộc Phao-lô về Môi-se
  choice: Dịch như một thông tin người khác truyền lại rằng Phao-lô dạy người Do Thái “lìa bỏ Môi-se,” không xác nhận lời cáo buộc là đúng.
  alternative: “dạy sự bội đạo khỏi Môi-se” hoặc “dạy từ bỏ luật pháp Môi-se”
  rationale: Câu này thuật lại điều người ta nghe nói về Phao-lô, chứ không đưa ra kết luận thần học của người kể chuyện. Giữ “Môi-se” cũng bảo toàn phép hoán dụ của nguyên văn và tránh diễn giải quá mức.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh” theo lời các trưởng lão nói trực tiếp với Phao-lô; giữ “Môi-se” trong chính văn để phản ánh phép hoán dụ của nguyên ngữ. Các ký hiệu chú thích xuất hiện theo thứ tự [a], [b], [c].
