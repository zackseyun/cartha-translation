  naturalness: “Từ bỏ Môi-se” tự nhiên hơn “lìa bỏ Môi-se” trong tiếng Việt chuẩn hiện đại. Cấu trúc “bảo họ đừng...” diễn đạt tự nhiên nội dung của phân từ λέγων và các động từ nguyên mẫu phủ định.
