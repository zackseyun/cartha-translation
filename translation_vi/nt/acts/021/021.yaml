revisions:
- from: Nhưng họ đã được nghe nói về anh rằng anh dạy tất cả người Do Thái sống giữa các dân ngoại lìa bỏ Môi-se,[a][b] bảo họ không được làm phép cắt bì cho con cái mình, cũng không được sống theo các tập tục.[c]
  to: Nhưng họ đã được thông báo về anh rằng anh dạy tất cả người Do Thái ở giữa các dân ngoại từ bỏ Môi-se,[a][b] bảo họ đừng cắt bì cho con cái mình, cũng đừng sống theo các tập tục.[c]
  rationale: Đổi “đã được nghe nói” thành “đã được thông báo” để phản ánh chính xác hơn κατηχήθησαν mà vẫn không xác nhận nội dung báo cáo. Đổi sang “từ bỏ” và “bảo họ đừng...” cho tiếng Việt tự nhiên hơn, không thay đổi tính chất cáo buộc hay mở rộng phép hoán dụ “Môi-se.” Các chú thích giữ đúng thứ tự neo [a], [b], [c] và giải thích các lựa chọn từ vựng cần thiết.
