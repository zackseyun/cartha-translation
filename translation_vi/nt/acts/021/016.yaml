  text: συνῆλθον δὲ καὶ τῶν μαθητῶν ἀπὸ Καισαρείας σὺν ἡμῖν, ἄγοντες παρ’ ᾧ ξενισθῶμεν Μνάσωνί τινι Κυπρίῳ, ἀρχαίῳ μαθητῇ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/016.yaml
  text: And some of the disciples from Caesarea also went with us, bringing us to Mnason, a certain Cypriot, an early disciple, with whom we were to stay.
translation:
  language: vi
  text: Cũng có vài môn đồ từ Sê-sa-rê đi cùng chúng tôi. Họ dẫn chúng tôi đến với một người tên là Mna-sôn, quê ở Síp, là một môn đồ lâu năm[b], để chúng tôi ở trọ nhà ông.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “dẫn chúng tôi đến với ông Mna-sôn… để chúng tôi ở trọ” hoặc “đưa chúng tôi đến nhà ông Mna-sôn.” Phân từ và động từ chỉ việc tiếp đón khách trong tiếng Hy Lạp có thể được hiểu theo những cách hơi khác nhau nhưng gần nghĩa.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “một môn đồ từ thuở ban đầu.” Cụm từ này có thể chỉ rằng Mna-sôn đã làm môn đồ từ lâu, có lẽ từ những ngày đầu của phong trào.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συνῆλθον δὲ καὶ τῶν μαθητῶν ἀπὸ Καισαρείας σὺν ἡμῖν
  choice: Cũng có vài môn đồ từ Sê-sa-rê đi cùng chúng tôi
  rationale: Diễn đạt tự nhiên ý bộ phận của τῶν μαθητῶν và ý đồng hành của συνῆλθον ... σὺν ἡμῖν trong bối cảnh hành trình.
- source_word: ἄγοντες
  choice: Họ đưa chúng tôi đến
  rationale: Phân từ chỉ việc các môn đồ dẫn hoặc đưa đoàn đến nơi sẽ lưu trú; tách thành câu mới giúp tiếng Việt sáng rõ.
- source_word: Μνάσωνί τινι Κυπρίῳ
  choice: ông Mna-sôn, một người quê ở đảo Síp
  rationale: τινι giới thiệu một người chưa được nhắc đến; cách nói này tự nhiên hơn việc dịch sát là “một Mna-sôn nào đó”. Κυπρίῳ chỉ quê quán hoặc nguồn gốc từ Síp.
- source_word: ἀρχαίῳ μαθητῇ
  choice: môn đồ từ thuở ban đầu
  rationale: Giữ sắc thái thời gian của ἀρχαίῳ nhưng không khẳng định Mna-sôn thuộc chính nhóm môn đồ đầu tiên.
- source_word: παρ’ ᾧ ξενισθῶμεν
  choice: để chúng tôi ở trọ nhà ông
  rationale: ξενίζω trong ngữ cảnh này nói đến việc tiếp đón và cho khách lưu trú; mệnh đề chỉ mục đích hoặc dự định được diễn đạt tự nhiên bằng “để”.
theological_decisions:
- issue: Ý nghĩa của ἀρχαίῳ μαθητῇ
  choice: môn đồ từ thuở ban đầu
  alternative: một môn đồ lâu năm
  rationale: Cụm từ có thể nhấn mạnh việc ông theo Chúa từ giai đoạn đầu hoặc đã làm môn đồ lâu năm. Bản dịch chính giữ liên hệ với thời kỳ ban đầu, còn chú thích bảo tồn cách hiểu kia mà không xác quyết quá mức.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “môn đồ” theo cách gọi quen thuộc trong Tân Ước; “ở trọ nhà ông” truyền đạt rõ bối cảnh hiếu khách. Địa danh và tên riêng được phiên âm theo lối quen dùng trong Kinh Thánh tiếng Việt.
