  to: Còn về những người ngoại đã tin, chúng tôi đã gửi lời cho họ, sau khi quyết định rằng họ phải kiêng thức ăn đã cúng tế thần tượng, huyết, thịt thú vật bị siết cổ, và sự vô luân về tình dục.
