language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: περὶ δὲ τῶν πεπιστευκότων ἐθνῶν ἡμεῖς ⸀ἀπεστείλαμεν ⸀κρίναντες φυλάσσεσθαι αὐτοὺς τό τε εἰδωλόθυτον ⸀καὶ αἷμα καὶ πνικτὸν καὶ πορνείαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/025.yaml
  text: But concerning the Gentiles who have believed[a], we sent word, having decided that they should keep themselves from what is sacrificed to idols, and from blood, and from what is strangled[c][b], and from sexual immorality.
translation:
  language: vi
  text: Còn về những người ngoại đã tin, chúng tôi đã gửi lời cho họ, sau khi quyết định rằng họ phải kiêng thức ăn đã cúng tế thần tượng, huyết, thịt thú vật bị siết cổ, và sự vô luân về tình dục.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: περὶ δὲ τῶν πεπιστευκότων ἐθνῶν
  choice: Còn về những người ngoại đã tin
  rationale: “Còn về” chuyển tự nhiên sự chuyển đề nhẹ của περὶ δὲ; “những người ngoại đã tin” diễn đạt ἐθνῶν theo ngữ cảnh và giữ sắc thái hoàn thành của phân từ hoàn thành πεπιστευκότων.
- source_word: ἡμεῖς ἀπεστείλαμεν
  choice: chúng tôi đã gửi lời cho họ
  rationale: Động từ ἀπεστείλαμεν không nêu rõ tân ngữ; “gửi lời” giữ được sự hàm ẩn ấy, còn “cho họ” làm câu tiếng Việt tự nhiên và chỉ đối tượng đã nêu.
- source_word: κρίναντες
  choice: sau khi quyết định
  rationale: Diễn đạt rõ hành động quyết định xảy ra trước hành động gửi, đồng thời giữ sắc thái nghị quyết chính thức mà không dùng từ quá pháp lý.
- source_word: φυλάσσεσθαι αὐτοὺς
  choice: rằng họ phải kiêng
  rationale: Trong ngữ cảnh danh sách điều cấm, “kiêng” là cách nói tiếng Việt tự nhiên cho việc tự giữ mình khỏi những điều được nêu.
- source_word: τό τε εἰδωλόθυτον
  choice: những gì đã cúng cho thần tượng
  rationale: Giữ phạm vi tương đối rộng của εἰδωλόθυτον và mối liên hệ trực tiếp với lễ cúng thần tượng, không tự ý thu hẹp thành một loại thịt cụ thể.
- source_word: αἷμα
  choice: huyết
  rationale: “Huyết” là từ trang trọng, quen thuộc trong văn cảnh Kinh Thánh, và phản ánh trực tiếp danh từ Hy Lạp mà không diễn giải thêm là việc ăn hay uống.
- source_word: πνικτόν
  choice: thịt thú vật bị siết cổ
  rationale: Làm rõ danh từ hóa πνικτόν chỉ thức ăn từ con vật chết do bị siết/ngạt, trong khi vẫn giữ nguyên nội dung của điều cấm.
- source_word: πορνείαν
  choice: sự gian dâm
  rationale: “Sự gian dâm” là cách diễn đạt trang trọng và dễ hiểu về hành vi tình dục trái phép, không giới hạn từ này vào riêng quan hệ trước hôn nhân.
theological_decisions:
- issue: Bản chất và thời hạn áp dụng của các điều cấm trong sắc lệnh các sứ đồ
  choice: Trình bày thẳng bốn điều cấm mà không giải thích thời hạn hay nền tảng thần học của chúng.
  alternative: Hiểu các điều về thức ăn chỉ là nhượng bộ tạm thời vì sự thông công bàn ăn, hoặc xem toàn bộ là luật đạo đức phổ quát có hiệu lực vĩnh viễn.
  rationale: Câu này chỉ nhắc lại nội dung quyết định trước đó, không tự giải thích đầy đủ lý do hay thời hạn áp dụng; bản dịch vì thế không giải quyết thay sự căng thẳng thần học của nguyên văn.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ đọc. Dùng “người ngoại” theo thuật ngữ Kinh Thánh quen thuộc; dùng “gửi lời” thay vì thêm “thư” vì tân ngữ của ἀπεστείλαμεν không được nêu trong câu Hy Lạp.
