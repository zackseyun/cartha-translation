source:
  edition: SBLGNT
  text: ⸀ἀναφάναντες δὲ τὴν Κύπρον καὶ καταλιπόντες αὐτὴν εὐώνυμον ἐπλέομεν εἰς Συρίαν, καὶ ⸀κατήλθομεν εἰς Τύρον, ἐκεῖσε γὰρ ⸂τὸ πλοῖον ἦν⸃ ἀποφορτιζόμενον τὸν γόμον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/003.yaml
  text: After sighting Cyprus and leaving it on our left[a], we sailed on to Syria and came down to Tyre[d][c][b], for there the ship was unloading its cargo.
translation:
  language: vi
  text: Sau khi trông thấy đảo Síp và để đảo ấy ở bên trái, chúng tôi tiếp tục đi thuyền đến Sy-ri, rồi đến Ty-rơ,[a] vì tại đó tàu đang dỡ hàng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “đi xuống Ty-rơ.” Động từ Hy Lạp theo nghĩa đen là “đi xuống”; cũng có thể hiểu là “đến Ty-rơ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναφάναντες
  choice: khi đảo Síp hiện ra trước mắt
  rationale: Phân từ aorist chỉ việc đảo Síp lọt vào tầm nhìn trước khi đoàn tiếp tục hành trình; cách diễn đạt này giữ được sắc thái hàng hải tự nhiên.
- source_word: καταλιπόντες αὐτὴν εὐώνυμον
  choice: để đảo ấy ở bên trái
  rationale: εὐώνυμον nghĩa là ở phía trái; câu mô tả đảo Síp nằm bên trái tàu khi tàu đi qua, không cần dùng thuật ngữ hàng hải chuyên môn.
- source_word: ἐπλέομεν εἰς Συρίαν
  choice: tiếp tục đi thuyền đến Sy-ri
  rationale: Thì vị hoàn diễn tả hành trình đang tiếp diễn; “tiếp tục đi thuyền” truyền đạt rõ tiến trình ấy bằng tiếng Việt tự nhiên.
- source_word: κατήλθομεν εἰς Τύρον
  choice: cập bến tại Ty-rơ
  rationale: κατέρχομαι theo nghĩa đen là “đi xuống,” nhưng trong ngữ cảnh chuyến hải hành có thể chỉ việc đến nơi; “cập bến” diễn đạt tự nhiên việc tàu đến Ty-rơ.
- source_word: ἀποφορτιζόμενον τὸν γόμον
  choice: tàu phải dỡ hàng
  rationale: Cấu trúc trung động/bị động có thể được hiểu là tàu đang dỡ hàng hoặc được dỡ hàng; tiếng Việt thường nói tàu dỡ hàng. “Phải” phản ánh rằng việc dỡ hàng tại Ty-rơ là lý do tàu đến đó, nhưng không hàm ý sự bắt buộc ngoài ngữ cảnh.
