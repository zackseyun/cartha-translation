    rationale: κατήλθομεν εἰς Τύρον nghĩa là “đi/đến xuống Ty-rơ”; từ này không khẳng định hành động cập vào bến cảng.
  - severity: medium
    issue: “tàu phải dỡ hàng” thêm ý bắt buộc và không phản ánh rõ thể tiếp diễn.
    rationale: Cấu trúc ἦν ἀποφορτιζόμενον diễn tả tàu đang dỡ/đang được dỡ hàng. Mệnh đề γάρ nêu lý do họ đến đó, không nói tàu bị bắt buộc phải dỡ hàng.
