  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng địa danh phiên âm quen thuộc “Síp,” “Sy-ri,” “Ty-rơ”; tránh thuật ngữ hàng hải chuyên môn như “mạn trái.”
