id: ACT.21.13
reference: Acts 21:13
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸂τότε ἀπεκρίθη⸃ ὁ Παῦλος· Τί ποιεῖτε κλαίοντες καὶ συνθρύπτοντές μου τὴν καρδίαν; ἐγὼ γὰρ οὐ μόνον δεθῆναι ἀλλὰ καὶ ἀποθανεῖν εἰς Ἰερουσαλὴμ ἑτοίμως ἔχω ὑπὲρ τοῦ ὀνόματος τοῦ κυρίου Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/013.yaml
  text: Then Paul answered[a], “What are you doing[b], weeping and breaking my heart? For I am ready not only to be bound but even to die in Jerusalem for the name of the Lord Jesus.”
translation:
  language: vi
  text: 'Bấy giờ, Phao-lô đáp: “Mọi người làm gì vậy, khóc và làm tan nát lòng tôi?[a] Vì tôi sẵn sàng không những chịu trói mà còn chịu chết tại Giê-ru-sa-lem vì danh Chúa Giê-su.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “nghiền nát lòng tôi.” Động từ Hy Lạp mạnh hơn việc chỉ làm buồn lòng, gợi hình ảnh nội tâm bị đập vỡ hoặc nghiền nát.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “vì cớ danh Chúa Giê-su.” Trong cách nói Kinh Thánh, “danh” có thể chỉ chính Chúa Giê-su, thẩm quyền của Ngài và sứ mạng gắn với Ngài.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε ἀπεκρίθη ὁ Παῦλος
  choice: Bấy giờ, Phao-lô đáp
  rationale: Giữ trình tự trần thuật và động từ đáp lời tự nhiên trong tiếng Việt; biến thể văn bản được SBLGNT đánh dấu không làm thay đổi nội dung căn bản của câu.
- source_word: Τί ποιεῖτε
  choice: Anh chị em làm gì vậy
  rationale: Chuyển trực tiếp câu hỏi phản đối đầy cảm xúc, không diễn giải thành câu hỏi nguyên nhân mạnh hơn như “Tại sao anh chị em lại làm thế?”
- source_word: κλαίοντες
  choice: cứ khóc
  rationale: Diễn đạt hành động đang tiếp diễn và sắc thái cảm xúc của phân từ bằng tiếng Việt tự nhiên.
- source_word: συνθρύπτοντές μου τὴν καρδίαν
  choice: làm tan nát lòng tôi
  rationale: Giữ hình ảnh mạnh của động từ συνθρύπτω, vốn chỉ sự đập vỡ hoặc nghiền nát; “tan nát lòng” vừa tự nhiên vừa trang trọng trong tiếng Việt.
- source_word: δεθῆναι
  choice: chịu trói
  rationale: Giữ nghĩa bị động và hình ảnh cụ thể của δέω, không mở rộng thành “bị cầm tù”.
- source_word: ἀποθανεῖν
  choice: chịu chết
  rationale: “Chịu chết” cân xứng với “chịu trói” và diễn đạt sự sẵn lòng đón nhận cái chết, không hàm ý tự tìm đến cái chết.
- source_word: εἰς Ἰερουσαλήμ
  choice: tại Giê-ru-sa-lem
  rationale: Trong ngữ cảnh điều Phao-lô sẵn sàng chịu sẽ xảy ra ở đó, “tại” là cách diễn đạt địa điểm tự nhiên trong tiếng Việt.
- source_word: ἑτοίμως ἔχω
  choice: tôi sẵn sàng
  rationale: Chuyển đúng thành ngữ Hy Lạp chỉ trạng thái đã chuẩn bị và sẵn lòng.
- source_word: ὑπὲρ τοῦ ὀνόματος
  choice: vì danh
  rationale: Giữ thành ngữ Kinh Thánh “danh” thay vì thu hẹp thành một lời diễn giải như “vì chính Chúa Giê-su”.
- source_word: τοῦ κυρίου Ἰησοῦ
  choice: Chúa Giê-su
  rationale: Dùng danh xưng Cơ Đốc học quen thuộc, trang trọng và tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Cách dịch κύριος khi nói về Đức Giê-su
  choice: Chúa Giê-su
  alternative: Thầy Giê-su
  rationale: κύριος ở đây là danh xưng có trọng lượng Cơ Đốc học; “Chúa” giữ được ý nghĩa ấy, còn “Thầy” làm yếu hoặc thu hẹp danh xưng.
- issue: Giữ thành ngữ “danh”
  choice: vì danh Chúa Giê-su
  alternative: vì Chúa Giê-su / vì cớ danh Chúa Giê-su
  rationale: Bản dịch chính giữ “danh” vì từ này có thể bao hàm chính thân vị, thẩm quyền và chính nghĩa gắn với Chúa Giê-su, không ép câu vào một nét nghĩa duy nhất.
translation_notes:
  register: Văn phong hiện đại, trang trọng và giàu cảm xúc nhưng dễ hiểu. “Anh chị em” diễn đạt số nhiều của lời Phao-lô nói với cả nhóm mà không giả định họ chỉ gồm nam giới. Dùng “Giê-ru-sa-lem” theo dạng phiên âm quen thuộc; giữ cấu trúc “không những... mà còn...” để phản ánh οὐ μόνον... ἀλλὰ καί.
