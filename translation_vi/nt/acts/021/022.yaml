  text: τί οὖν ἐστιν; πάντως ⸀ἀκούσονται ὅτι ἐλήλυθας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/022.yaml
  text: What then is to be done? They will certainly hear that you have come[a].
translation:
  language: vi
  text: Vậy phải làm gì đây? Chắc chắn họ sẽ nghe tin rằng anh đã đến[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay, sát nghĩa hơn: “Vậy điều đó là gì?” Thành ngữ Hy Lạp hỏi nên làm gì trước tình hình này.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τί οὖν ἐστιν;
  choice: Vậy phải làm gì đây?
  rationale: Nghĩa đen là “Vậy điều gì đang xảy ra/điều đó là gì?”, nhưng trong ngữ cảnh, thành ngữ Hy Lạp nêu câu hỏi thực tiễn về cách xử trí trước tình hình hiện tại. Cách dịch này tự nhiên trong tiếng Việt và giữ được sức đẩy của lập luận.
- source_word: πάντως
  choice: Chắc chắn
  rationale: Trạng từ này nhấn mạnh tính chắc chắn của sự việc sắp xảy ra; “chắc chắn” phù hợp với ý dự báo trong ngữ cảnh.
- source_word: ἀκούσονται
  choice: họ sẽ nghe tin
  rationale: Động từ tương lai trung cách ở đây mang nghĩa chủ động. “Nghe tin” là cách diễn đạt tự nhiên trong tiếng Việt khi nội dung theo sau là tin về việc một người đã đến; chủ ngữ số nhiều được hiểu từ ngữ cảnh.
- source_word: ὅτι
  choice: rằng
  rationale: Liên từ giới thiệu nội dung họ sẽ nghe, chứ không biểu thị nguyên nhân.
- source_word: ἐλήλυθας
  choice: anh đã đến
  rationale: Thì hoàn thành của ἔρχομαι chỉ việc đến đã xảy ra và kết quả vẫn còn—Phao-lô hiện đang có mặt. “Đã đến” truyền đạt tự nhiên nét nghĩa này; đại từ “anh” phù hợp với lời các trưởng lão nói trực tiếp với Phao-lô.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Phải làm gì đây?” diễn đạt tự nhiên câu hỏi cân nhắc cách xử trí; “nghe tin rằng” tránh lối nói cứng, đồng thời vẫn giữ rõ nội dung của mệnh đề ὅτι.
