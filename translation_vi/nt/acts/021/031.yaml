  text: ζητούντων ⸀τε αὐτὸν ἀποκτεῖναι ἀνέβη φάσις τῷ χιλιάρχῳ τῆς σπείρης ὅτι ὅλη ⸀συγχύννεται Ἰερουσαλήμ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/031.yaml
  text: And as they were seeking to kill him[b][a], a report went up to the commander of the cohort that all Jerusalem was in an uproar.
translation:
  language: vi
  text: Trong khi họ đang tìm cách giết Phao-lô, tin báo được đưa lên cho viên chỉ huy đơn vị quân đội[a] rằng cả thành Giê-ru-sa-lem đang náo loạn.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Viên chỉ huy đơn vị quân đội” là một sĩ quan La Mã cấp tribune, chỉ huy một cohort, tức một đơn vị quân đội, đóng tại đó.
    reason: cultural_note
  - marker: b
    text: 'Cũng có thể dịch: “đang hỗn loạn” hoặc “đang rối loạn.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ζητούντων τε αὐτὸν ἀποκτεῖναι
  choice: Trong khi họ đang tìm cách giết Phao-lô
  rationale: Kết cấu sở hữu cách tuyệt đối với phân từ hiện tại diễn tả hành động đang tiếp diễn đồng thời với mệnh đề chính. Tiếng Việt cần nêu tên Phao-lô thay cho đại từ để câu đứng riêng được rõ nghĩa, không làm thay đổi đối tượng trong ngữ cảnh.
- source_word: ἀνέβη φάσις
  choice: tin báo truyền lên
  rationale: Giữ hình ảnh chuyển động hướng lên trong ἀνέβη, phù hợp với việc tin được đưa lên nơi viên chỉ huy đóng quân, đồng thời tự nhiên trong tiếng Việt.
- source_word: τῷ χιλιάρχῳ
  choice: viên chỉ huy
  rationale: χιλίαρχος chỉ một sĩ quan quân đội La Mã, tương đương quân đoàn trưởng cấp tribune; 'viên chỉ huy' rõ ràng và dễ hiểu hơn một thuật ngữ phiên âm chuyên biệt.
- source_word: τῆς σπείρης
  choice: đơn vị quân đội
  rationale: σπεῖρα là một cohort của quân đội La Mã. Cách dịch khái quát này dễ hiểu trong văn bản chính; chú thích cung cấp thông tin lịch sử cụ thể hơn.
- source_word: ὅτι ὅλη συγχύννεται Ἰερουσαλήμ
  choice: rằng cả thành Giê-ru-sa-lem đang náo loạn
  rationale: Giữ phép hoán dụ 'cả Giê-ru-sa-lem' nhưng thêm 'thành' cho tự nhiên trong tiếng Việt. Thì hiện tại và sắc thái bị xáo trộn của συγχύννεται được diễn đạt bằng 'đang náo loạn'.
theological_decisions: []
translation_notes:
  register: Văn phong trần thuật hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Phao-lô” để làm rõ đại từ khi câu được đọc độc lập; các thuật ngữ quân sự chuyên biệt được giải thích trong chú thích. Mọi dấu chú thích đều có mặt trong văn bản chính.
