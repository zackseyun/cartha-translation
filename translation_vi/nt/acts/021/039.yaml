source:
  edition: SBLGNT
  text: εἶπεν δὲ ὁ Παῦλος· Ἐγὼ ἄνθρωπος μέν εἰμι Ἰουδαῖος, Ταρσεὺς τῆς Κιλικίας, οὐκ ἀσήμου πόλεως πολίτης· δέομαι δέ σου, ἐπίτρεψόν μοι λαλῆσαι πρὸς τὸν λαόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/039.yaml
  text: But Paul said[a], “I am indeed a Jewish man, a citizen of Tarsus in Cilicia, of no insignificant city. And I beg you, permit me to speak to the people.”
translation:
  language: vi
  text: 'Nhưng Phao-lô nói: “Tôi là người Do Thái, người Tạt-sơ thuộc xứ Ki-li-ki, là công dân của một thành không hề tầm thường. Tôi xin ông cho phép tôi nói với dân chúng.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄνθρωπος ... Ἰουδαῖος
  choice: người Do Thái
  rationale: Cách nói tự nhiên trong tiếng Việt, diễn đạt căn tính dân tộc–tôn giáo của Phao-lô; không cần dịch riêng ἄνθρωπος thành “người đàn ông” vì sẽ nặng và không tự nhiên.
- source_word: Ταρσεὺς τῆς Κιλικίας
  choice: quê ở Tạt-sơ thuộc Ki-li-ki
  rationale: Diễn đạt tự nhiên mối liên hệ của Phao-lô với Tạt-sơ và vị trí của thành này trong Ki-li-ki, trong khi để πολίτης ở vị trí kế tiếp như bản Hy Lạp.
- source_word: οὐκ ἀσήμου πόλεως
  choice: của một thành không phải là vô danh
  rationale: Giữ lối nói giảm bằng phủ định của nguyên văn, thay vì diễn giải thẳng thành “một thành nổi tiếng” hay “quan trọng”.
- source_word: πολίτης
  choice: công dân
  rationale: Giữ ý nghĩa về tư cách công dân của thành, thay vì chỉ nói ông là cư dân hay người đến từ đó.
- source_word: δέομαι δέ σου
  choice: Tôi xin ông
  rationale: Thể hiện lời thỉnh cầu tha thiết nhưng vẫn tự nhiên và kính trọng trong tiếng Việt hiện đại.
- source_word: ἐπίτρεψόν μοι λαλῆσαι
  choice: cho phép tôi nói
  rationale: Phù hợp với lời xin phép một viên chỉ huy quân sự và giữ sắc thái trang trọng vừa phải.
- source_word: πρὸς τὸν λαόν
  choice: với dân chúng
  rationale: λαός ở đây chỉ tập thể dân đang hiện diện; “dân chúng” tự nhiên hơn “nhân dân” trong ngữ cảnh phát biểu trước đám đông.
- source_word: μέν
  choice: không biểu đạt bằng một từ riêng
  rationale: Hạt từ này tạo sắc thái nhấn mạnh/đối chiếu, nhưng thêm “quả thật” hoặc “đúng là” ở đây sẽ kém tự nhiên trong tiếng Việt; cấu trúc tự giới thiệu đã chuyển tải đủ trọng tâm.
theological_decisions:
- issue: Ý nghĩa của Ἰουδαῖος trong lời tự giới thiệu
  choice: người Do Thái
  alternative: người Giu-đê
  rationale: Phao-lô nêu căn tính dân tộc–tôn giáo của mình, rồi nói riêng quê quán là Tạt-sơ thuộc Ki-li-ki; dịch “người Giu-đê” dễ khiến người đọc hiểu nhầm đây là nguồn gốc địa lý.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Giữ tên riêng theo dạng phiên âm quen thuộc trong truyền thống Kinh Thánh tiếng Việt. Câu “không phải là vô danh” chủ ý bảo tồn lối nói giảm của nguyên văn Hy Lạp.
