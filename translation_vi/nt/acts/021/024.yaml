reference: Acts 21:24
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τούτους παραλαβὼν ἁγνίσθητι σὺν αὐτοῖς καὶ δαπάνησον ἐπ’ αὐτοῖς ἵνα ⸀ξυρήσονται τὴν κεφαλήν, καὶ ⸀γνώσονται πάντες ὅτι ὧν κατήχηνται περὶ σοῦ οὐδέν ἐστιν, ἀλλὰ στοιχεῖς καὶ αὐτὸς ⸂φυλάσσων τὸν νόμον⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/024.yaml
  text: Take these men[a], purify yourself along with them, and pay their expenses so that they may shave their heads. Then everyone will know that there is nothing to the things they have been told about you[b], but that you yourself also are living in observance of the law.
translation:
  language: vi
  text: Hãy đưa những người này theo, làm lễ thanh tẩy cùng với họ, và chi trả các khoản phí cho họ để họ cạo đầu. Như vậy, mọi người sẽ biết rằng những điều họ đã nghe về anh[a] đều không có căn cứ, nhưng chính anh cũng sống đúng khuôn phép và tuân giữ Luật Pháp[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “những điều họ đã được chỉ dạy về anh.” Động từ Hy Lạp có thể mang nghĩa “chỉ dạy” hoặc nói chung là “thông báo.” Trong ngữ cảnh này, từ ấy nói đến những tin đang lưu truyền về Phao-lô.'
    reason: lexical_alternative
  - marker: b
    text: “Sống đúng khuôn phép” dịch sát hình ảnh “bước đi đúng hàng lối,” nghĩa là sống phù hợp với việc tuân giữ Luật Pháp.
    reason: lexical_alternative
lexical_decisions:
- source_word: τούτους παραλαβὼν
  choice: Hãy đưa những người này theo
  rationale: Phân từ παραλαβών mang lực mệnh lệnh theo ngữ cảnh. “Những người này” chỉ bốn người ở câu trước; “đưa ... theo” diễn đạt tự nhiên ý tiếp nhận họ để cùng thực hiện việc được đề nghị.
- source_word: ἁγνίσθητι σὺν αὐτοῖς
  choice: cùng thanh tẩy với họ
  rationale: ἁγνίζω ở đây nói đến việc thanh tẩy theo nghi lễ; cách dịch giữ rõ ý cùng tham gia với họ mà không giải thích quá mức.
- source_word: δαπάνησον ἐπ’ αὐτοῖς
  choice: trả chi phí cho họ
  rationale: Cụm từ có nghĩa gánh các khoản phí thay cho họ, trong ngữ cảnh là các chi phí liên quan đến lời khấn.
- source_word: ἵνα ξυρήσονται τὴν κεφαλήν
  choice: để họ cạo đầu
  rationale: ἵνα với động từ tương lai diễn tả mục đích hoặc kết quả dự kiến. Danh từ số ít “đầu” mang nghĩa phân phối; tiếng Việt tự nhiên dùng “họ cạo đầu”.
- source_word: γνώσονται πάντες
  choice: mọi người sẽ biết
  rationale: Diễn đạt trực tiếp động từ tương lai; “Như vậy” làm rõ quan hệ kết quả trong mạch câu.
- source_word: ὧν κατήχηνται περὶ σοῦ
  choice: những điều họ đã nghe về anh
  rationale: κατηχέω có thể là dạy bảo hoặc thông báo. Trong ngữ cảnh các tin đang lưu truyền về Phao-lô, “đã nghe” tự nhiên và vẫn để ngỏ sắc thái thông tin hay chỉ dẫn; chú thích nêu phương án gần sát hơn.
- source_word: οὐδέν ἐστιν
  choice: đều không có căn cứ
  rationale: Thành ngữ phủ nhận giá trị thực chất của những điều được thuật lại. “Không có căn cứ” truyền đạt rõ nghĩa trong tiếng Việt hiện đại.
- source_word: ἀλλὰ στοιχεῖς καὶ αὐτὸς φυλάσσων τὸν νόμον
  choice: nhưng chính anh cũng sống đúng khuôn phép và tuân giữ Luật Pháp
  rationale: στοιχέω gợi hình ảnh bước đi đúng hàng lối, tức sống phù hợp với một chuẩn mực; φυλάσσω bổ sung ý tuân giữ. Bản dịch giữ cả hai động từ thay vì gộp chúng, đồng thời bảo tồn sự nhấn mạnh của καὶ αὐτός.
- source_word: νόμον
  choice: Luật Pháp
  rationale: Trong ngữ cảnh, νόμος chỉ Luật Pháp của người Do Thái. Viết hoa giúp nhận diện quy chiếu quen thuộc mà không thêm từ “Môi-se” vốn không có trong nguyên văn.
theological_decisions:
- issue: Mối quan hệ của Phao-lô với Luật Pháp trong lời khẳng định thuộc câu chuyện
  choice: “chính anh cũng sống đúng khuôn phép và tuân giữ Luật Pháp”
  alternative: “chính anh cũng sống theo Luật Pháp”
  rationale: Cách dịch trình bày điều mọi người sẽ nhận biết qua hành động của Phao-lô trong sự kiện này, không biến câu thành một kết luận hệ thống về toàn bộ thần học của ông. Việc giữ cả στοιχεῖς và φυλάσσων cũng bảo tồn sắc thái của lời khẳng định mà không làm dịu căng thẳng thần học.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Đại từ “anh” phù hợp với lời các trưởng lão nói trực tiếp với Phao-lô trong ngữ cảnh. “Thanh tẩy” giữ sắc thái nghi lễ; “Luật Pháp” là cách gọi rõ và quen thuộc trong văn cảnh Kinh Thánh.
