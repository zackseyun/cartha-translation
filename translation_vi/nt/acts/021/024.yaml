  source_fidelity: 'Bản dịch truyền đạt đúng mạch mệnh lệnh: tiếp nhận bốn người, cùng tham gia thanh tẩy nghi lễ, đài thọ chi phí để họ cạo đầu, và kết quả là mọi người nhận ra các tin về Phao-lô là không có căn cứ. Tuy nhiên, “cùng thanh tẩy với họ” chưa diễn đạt rõ phản thân của ἁγνίσθητι; cần nói rõ Phao-lô cũng làm lễ thanh tẩy cùng họ.'
  naturalness: Văn phong nhìn chung tự nhiên, trang trọng vừa phải. “Hãy làm lễ thanh tẩy cùng với họ” rõ nghĩa và tự nhiên hơn “cùng thanh tẩy với họ.” “Chi trả các khoản phí cho họ” cũng rõ hơn “trả chi phí cho họ,” vốn có thể bị hiểu là trả tiền trực tiếp cho họ.
  terminology: “Làm lễ thanh tẩy” bảo toàn sắc thái nghi lễ của ἁγνίζω. “Sống đúng khuôn phép và tuân giữ Luật Pháp” giữ được cả στοιχεῖς và φυλάσσων, cũng như không áp đặt một kết luận thần học vượt quá lời thuật của câu. Cách gọi “Luật Pháp” phù hợp với văn cảnh Do Thái và cách dùng Kinh Thánh tiếng Việt.
