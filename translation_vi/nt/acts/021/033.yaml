  to: Bấy giờ, viên chỉ huy tiến lại[a], bắt lấy Phao-lô và ra lệnh trói ông bằng hai dây xích[b], rồi hỏi xem ông là ai và đã làm gì.
  rationale: Đổi “tra hỏi” thành “hỏi xem” để không tăng sắc thái so với ἐπυνθάνετο và để câu hỏi gián tiếp tự nhiên hơn. Đổi “sợi xích” thành “dây xích” vì đây là cách dùng tiếng Việt thông dụng; đồng thời cập nhật chú thích neo theo đúng cụm từ trong chính văn. Các thành tố nghĩa khác được giữ nguyên.
