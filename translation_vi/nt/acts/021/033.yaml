source:
  edition: SBLGNT
  text: ⸂τότε ἐγγίσας⸃ ὁ χιλίαρχος ἐπελάβετο αὐτοῦ καὶ ἐκέλευσε δεθῆναι ἁλύσεσι δυσί, καὶ ἐπυνθάνετο ⸀τίς εἴη καὶ τί ἐστιν πεποιηκώς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/033.yaml
  text: Then the commander came up[a], seized him, and ordered him to be bound with two chains[b], and was asking who he was and what he had done.
translation:
  language: vi
  text: Bấy giờ, viên chỉ huy tiến lại[a], bắt lấy Phao-lô và ra lệnh trói ông bằng hai dây xích[b], rồi hỏi xem ông là ai và đã làm gì.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “viên thiên phu trưởng.” Từ Hy Lạp χιλίαρχος chỉ một sĩ quan quân đội La Mã, theo nghĩa đen là “người chỉ huy một ngàn quân.”
    reason: lexical_alternative
  - marker: b
    text: Cụm từ “hai dây xích” có thể gợi lại lời tiên báo trong Công Vụ 21:11 rằng Phao-lô sẽ bị trói tại Giê-ru-sa-lem.
    reason: cross_reference
lexical_decisions:
- source_word: χιλίαρχος
  choice: viên chỉ huy
  rationale: Chỉ một sĩ quan quân đội La Mã chỉ huy cấp cohort; cách dịch này rõ ràng, tự nhiên và giữ được thẩm quyền quân sự mà không dùng thuật ngữ quá chuyên biệt.
- source_word: ἐγγίσας
  choice: tiến lại
  rationale: Phân từ bất định diễn tả việc đến gần trước hành động chính; “tiến lại” phù hợp với chuyển động trong bối cảnh.
- source_word: ἐπελάβετο αὐτοῦ
  choice: bắt lấy Phao-lô
  rationale: Động từ diễn tả việc dùng tay khống chế trong bối cảnh bắt giữ. Dùng tên Phao-lô để tránh đại từ mơ hồ trong tiếng Việt.
- source_word: ἐκέλευσε δεθῆναι
  choice: ra lệnh ... trói ông
  rationale: Diễn đạt tự nhiên mệnh lệnh có thẩm quyền và vẫn thể hiện Phao-lô là người bị trói.
- source_word: ἁλύσεσι δυσί
  choice: dùng hai sợi xích
  rationale: ἅλυσις là dây xích dùng trong việc giam giữ; “hai sợi xích” là cách dịch trực tiếp và dễ hiểu.
- source_word: ἐπυνθάνετο
  choice: rồi tra hỏi
  rationale: Thì chưa hoàn thành cho thấy việc hỏi đang diễn ra; “tra hỏi” phù hợp với cuộc thẩm vấn của sĩ quan trong cảnh hỗn loạn.
- source_word: τίς εἴη
  choice: ông là ai
  rationale: Chuyển câu hỏi gián tiếp sang cách nói tự nhiên trong tiếng Việt, không làm tăng sắc thái bất định.
- source_word: τί ἐστιν πεποιηκώς
  choice: đã làm gì
  rationale: Cấu trúc hoàn thành chỉ hành động đã thực hiện và còn liên quan đến hiện tại; “đã làm gì” truyền đạt tự nhiên ý nghĩa ấy.
theological_decisions: []
translation_notes:
  register: Văn phong tường thuật hiện đại, trang trọng và dễ hiểu. Giữ nhịp hành động liên tục của câu Hy Lạp; dùng “viên chỉ huy” trong chính văn thay vì chức danh La Mã chuyên biệt, và giải thích ở chú thích.
