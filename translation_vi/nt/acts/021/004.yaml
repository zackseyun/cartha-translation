id: ACT.21.4
reference: Acts 21:4
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸂ἀνευρόντες δὲ τοὺς⸃ μαθητὰς ἐπεμείναμεν αὐτοῦ ἡμέρας ἑπτά, οἵτινες τῷ Παύλῳ ἔλεγον διὰ τοῦ πνεύματος μὴ ⸀ἐπιβαίνειν εἰς ⸀Ἱεροσόλυμα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/004.yaml
  text: After finding the disciples[a], we stayed there seven days. They kept telling Paul through the Spirit not to go up to Jerusalem.
translation:
  language: vi
  text: Sau khi tìm được các môn đồ, chúng tôi ở lại đó bảy ngày. Qua Thánh Linh, họ cứ bảo Phao-lô đừng đi lên Giê-ru-sa-lem.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cụm từ này cũng có thể được hiểu là Thánh Linh đã bày tỏ những đau khổ sắp xảy đến với Phao-lô, rồi từ đó các môn đồ kết luận rằng ông không nên tiếp tục đi Giê-ru-sa-lem.
    reason: Giữ lại sự mơ hồ và sức căng thần học của cụm διὰ τοῦ πνεύματος trong mạch văn Công Vụ.
lexical_decisions:
- source_word: ἀνευρόντες
  choice: Sau khi tìm được
  rationale: Phân từ bất định chỉ hành động xảy ra trước động từ chính; cách dịch này tự nhiên và giữ đúng trình tự.
- source_word: τοὺς μαθητάς
  choice: các môn đồ
  rationale: Giữ thuật ngữ quen thuộc trong sách Công Vụ, chỉ những người theo Chúa; mạo từ Hy Lạp không nhất thiết phải biểu đạt bằng một từ xác định riêng trong tiếng Việt.
- source_word: ἐπεμείναμεν αὐτοῦ
  choice: chúng tôi ở lại đó
  rationale: ἐπιμένω mang nghĩa ở lại, còn αὐτοῦ ở đây là trạng từ chỉ nơi chốn, nghĩa là “đó”.
- source_word: ἡμέρας ἑπτά
  choice: bảy ngày
  rationale: Đối cách chỉ khoảng thời gian; tiếng Việt diễn đạt tự nhiên mà không cần thêm giới từ.
- source_word: οἵτινες ... ἔλεγον
  choice: họ cứ bảo
  rationale: “Họ” quy chiếu về các môn đồ; thể chưa hoàn thành của ἔλεγον gợi hành động lặp lại hoặc kéo dài, được thể hiện bằng “cứ bảo”.
- source_word: διὰ τοῦ πνεύματος
  choice: Qua Thánh Linh
  rationale: διά với sở hữu cách diễn tả phương tiện hoặc tác nhân. Trong ngữ cảnh Công Vụ, πνεῦμα chỉ Thánh Linh; thêm “Thánh” làm rõ sở chỉ tự nhiên trong tiếng Việt mà không giải quyết thay cho độc giả bản chất của lời ngăn cản.
- source_word: μὴ ἐπιβαίνειν εἰς Ἱεροσόλυμα
  choice: đừng đi lên Giê-ru-sa-lem
  rationale: Cấu trúc với động từ nói được chuyển tự nhiên thành lời ngăn bảo gián tiếp. “Đi lên” vừa phản ánh động từ chuyển động vừa phù hợp lối nói truyền thống về hành trình đến Giê-ru-sa-lem.
theological_decisions:
- issue: Mối quan hệ giữa cụm διὰ τοῦ πνεύματος và việc Phao-lô đi Giê-ru-sa-lem
  choice: Qua Thánh Linh, họ cứ bảo Phao-lô đừng đi lên Giê-ru-sa-lem.
  alternative: Thánh Linh mặc khải về hoạn nạn sắp đến, còn chính các môn đồ suy ra rằng Phao-lô không nên đi.
  rationale: Bản văn trực tiếp gắn lời họ nói với Thánh Linh nhưng không giải thích cơ chế của lời ấy. Bản dịch chính giữ nguyên sức căng với Công Vụ 19:21 và 20:22–23, còn chú thích nêu cách hiểu khả dĩ mà không áp đặt.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “môn đồ”, “Thánh Linh”, “Phao-lô” và “Giê-ru-sa-lem” theo lối thuật ngữ Kinh Thánh quen thuộc; “cứ bảo” truyền đạt sắc thái lặp lại mà vẫn tự nhiên.
