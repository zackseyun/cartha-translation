reference: Acts 21:20
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οἱ δὲ ἀκούσαντες ἐδόξαζον τὸν ⸀θεόν, ⸂εἶπόν τε⸃ αὐτῷ· Θεωρεῖς, ἀδελφέ, πόσαι μυριάδες εἰσὶν ⸂ἐν τοῖς Ἰουδαίοις⸃ τῶν πεπιστευκότων, καὶ πάντες ζηλωταὶ τοῦ νόμου ὑπάρχουσιν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/020.yaml
  text: When they heard this[a], they glorified God, and they said to him, “You see, brother, how many myriads there are among the Jews who have believed[b], and they are all zealous for the law.”
translation:
  language: vi
  text: 'Khi nghe vậy, họ tôn vinh Đức Chúa Trời và nói với ông: “Thưa anh, anh thấy đấy, có biết bao nhiêu vạn[a] người Do Thái[b] đã tin, và tất cả đều nhiệt thành vì luật pháp.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Vạn” có thể chỉ từng đơn vị mười ngàn; từ Hy Lạp cũng có thể được dùng rộng hơn để chỉ một số lượng rất lớn.
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “người Giu-đê,” nếu hiểu theo địa lý thay vì theo căn tính dân tộc-tôn giáo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσαντες
  choice: Khi nghe vậy
  rationale: Phân từ bất định diễn tả thời gian; “vậy” bổ sung tự nhiên điều được nghe từ lời tường trình trước đó.
- source_word: ἐδόξαζον τὸν θεόν
  choice: họ tôn vinh Đức Chúa Trời
  rationale: Giữ sắc thái dâng vinh quang và sự tôn kính lên Đức Chúa Trời, thay vì làm nhẹ thành chỉ “khen ngợi”.
- source_word: εἶπόν τε αὐτῷ
  choice: rồi nói với ông
  rationale: τέ nối diễn tiến kế tiếp trong lời thuật; “rồi” tự nhiên trong tiếng Việt và αὐτῷ được thể hiện bằng “với ông”.
- source_word: Θεωρεῖς, ἀδελφέ
  choice: Thưa anh em, anh thấy đó
  rationale: “Anh em” là cách xưng hô Cơ Đốc giáo trang trọng và tự nhiên với một người nam cụ thể; “anh thấy đó” thể hiện lời hướng sự chú ý vào thực trạng rõ ràng.
- source_word: πόσαι μυριάδες
  choice: biết bao vạn người
  rationale: μυριάς vốn chỉ đơn vị một vạn nhưng cũng có thể diễn tả một số lượng rất lớn. “Biết bao vạn người” giữ hình ảnh số đếm của nguyên văn mà vẫn tự nhiên hơn từ vay mượn.
- source_word: ἐν τοῖς Ἰουδαίοις
  choice: trong số người Do Thái
  rationale: Ngữ cảnh nhấn mạnh căn tính dân tộc-tôn giáo của những người tin, không nhất thiết chỉ nơi cư trú tại Giu-đê.
- source_word: τῶν πεπιστευκότων
  choice: người đã tin
  rationale: Thì hoàn thành nêu những người đã đi đến đức tin và vẫn ở trong tình trạng ấy; tiếng Việt diễn đạt gọn bằng “đã tin”.
- source_word: πάντες ζηλωταὶ τοῦ νόμου ὑπάρχουσιν
  choice: tất cả đều sốt sắng đối với luật pháp
  rationale: “Sốt sắng” truyền đạt lòng nhiệt thành mạnh mẽ; “đối với luật pháp” giữ quan hệ của sở hữu cách mà không thêm một cách giải thích giáo phái.
theological_decisions:
- issue: Phạm vi nghĩa của ἐν τοῖς Ἰουδαίοις
  choice: trong số người Do Thái
  alternative: trong số người Giu-đê
  rationale: Mạch văn nói đến những tín hữu vẫn nhiệt thành với luật pháp Môi-se, nên nghĩa dân tộc-tôn giáo phù hợp hơn nghĩa địa lý; nghĩa địa lý vẫn được ghi nhận trong chú thích.
- issue: Giá trị số lượng của μυριάδες
  choice: biết bao vạn người
  alternative: biết bao nhiêu ngàn người / hàng vạn người
  rationale: Cách dịch chính giữ đơn vị “vạn” gần với từ Hy Lạp nhưng không khẳng định đây là con số thống kê chính xác; chú thích bảo tồn nghĩa rộng là một số lượng rất lớn.
- issue: Luật pháp được nhắc đến
  choice: luật pháp
  alternative: Luật Môi-se / Torah
  rationale: Ngữ cảnh làm rõ sở chỉ mà không cần đưa lời giải thích vào chính văn hoặc dùng thuật ngữ phiên âm; cách dịch này không phán xét sự sốt sắng ấy.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Trời” theo lối gọi phổ biến trong truyền thống Kinh Thánh tiếng Việt; “thưa anh em” thể hiện lời gọi trực tiếp, kính trọng nhưng thân tình. Các dấu chú thích được đặt ngay sau cụm từ liên quan.
