  source_fidelity: Bản dịch phản ánh đúng trình tự hành trình, ý ra khơi (ἀναχθῆναι), hải trình trực tiếp (εὐθυδρομήσαντες), và các chặng Cô/Kos, Rô-đơ/Rhodes, Pa-ta-ra/Patara. Tuy nhiên, tên Κῶ nên được phiên là “Cốt” trong cách dùng Kinh Thánh tiếng Việt hiện đại và để phân biệt rõ với từ thông dụng “cô”.
