  text: Ὡς δὲ ἐγένετο ἀναχθῆναι ἡμᾶς ἀποσπασθέντας ἀπ’ αὐτῶν, εὐθυδρομήσαντες ἤλθομεν εἰς τὴν ⸀Κῶ, τῇ δὲ ἑξῆς εἰς τὴν Ῥόδον, κἀκεῖθεν εἰς Πάταρα·
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/001.yaml
  text: After we had torn ourselves away from them and put out to sea[a], we ran a straight course and came to Cos, and on the next day to Rhodes, and from there to Patara.
translation:
  language: vi
  text: Sau khi dứt ra khỏi họ và ra khơi, chúng tôi đi thẳng đến Cốt; hôm sau đến Rô-đơ, rồi từ đó đến Pa-ta-ra.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὡς δὲ ἐγένετο
  choice: Sau khi
  rationale: Cụm thành ngữ này chuyển sang sự việc kế tiếp trong trình thuật; “Sau khi” tự nhiên trong tiếng Việt và phù hợp với quan hệ thời gian của các động từ theo sau.
- source_word: ἀναχθῆναι
  choice: ra khơi
  rationale: Trong ngữ cảnh hàng hải, động từ này chỉ việc rời bờ để bắt đầu chuyến đi biển; “ra khơi” ngắn gọn, tự nhiên.
- source_word: ἀποσπασθέντας ἀπ’ αὐτῶν
  choice: dứt ra khỏi họ
  rationale: Động từ ἀποσπάω có sắc thái mạnh hơn một lời từ biệt hay rời đi bình thường, gợi sự chia lìa khó khăn; “dứt ra khỏi” giữ được lực cảm xúc ấy mà vẫn tự nhiên.
- source_word: εὐθυδρομήσαντες
  choice: đi thẳng
  rationale: Động từ hàng hải này có nghĩa là chạy theo một hải trình thẳng; trong ngữ cảnh đã nêu “ra khơi”, “đi thẳng” vừa sáng rõ vừa tránh cách diễn đạt gượng.
- source_word: ἤλθομεν εἰς
  choice: đến
  rationale: Cách diễn đạt ngắn gọn, tự nhiên cho hành trình tới một địa điểm.
- source_word: Κῶ
  choice: Cô
  rationale: Phiên âm địa danh Hy Lạp Κῶς theo cách đọc và chính tả tiếng Việt, đồng thời phân biệt bằng dấu câu trong mạch liệt kê.
- source_word: τῇ δὲ ἑξῆς
  choice: hôm sau
  rationale: Diễn đạt tự nhiên, chính xác ý “vào ngày kế tiếp” trong tiếng Việt hiện đại.
- source_word: Ῥόδον
  choice: Rô-đơ
  rationale: Phiên âm địa danh Hy Lạp Ῥόδος theo âm gần nguồn và quy ước trình bày tên riêng tiếng Việt.
- source_word: κἀκεῖθεν
  choice: rồi từ đó
  rationale: Giữ cả ý nối tiếp của καί và ý xuất phát từ địa điểm vừa nêu của ἐκεῖθεν.
- source_word: Πάταρα
  choice: Pa-ta-ra
  rationale: Phiên âm trực tiếp địa danh Hy Lạp Πάταρα, dễ đọc đối với độc giả tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong tường thuật hiện đại, trang trọng vừa phải và dễ hiểu. Câu giữ nhịp hành trình súc tích của nguyên văn; dấu chấm phẩy giúp tách chặng đầu khỏi các điểm đến kế tiếp. Không thêm chú thích vì khác biệt Cos/Kos trong bản tham khảo tiếng Anh là vấn đề phiên tự tiếng Anh, không phải một dị bản hay mơ hồ cần chuyển sang bản tiếng Việt.
