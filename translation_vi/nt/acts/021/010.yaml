    issue: «thêm nhiều ngày» không phải cách diễn đạt tối ưu cho ἡμέρας πλείους.
    rationale: Cụm Hy Lạp chỉ việc lưu lại thêm một số ngày; «thêm vài ngày» vừa tự nhiên trong tiếng Việt vừa tránh hàm ý thời lượng «nhiều» quá mạnh.
