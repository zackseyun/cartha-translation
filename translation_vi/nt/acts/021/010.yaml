  text: ἐπιμενόντων ⸀δὲ ἡμέρας πλείους κατῆλθέν τις ἀπὸ τῆς Ἰουδαίας προφήτης ὀνόματι Ἅγαβος,
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/010.yaml
  text: While we were staying there for several days, a prophet named Agabus came down from Judea.
translation:
  language: vi
  text: Khi chúng tôi còn ở lại đó thêm vài ngày, một nhà tiên tri tên là A-ga-bút đi xuống từ Giu-đê.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιμενόντων
  choice: khi chúng tôi còn ở lại đó
  rationale: Phân từ hiện tại sở hữu cách số nhiều nằm trong kết cấu sở hữu cách tuyệt đối, mang ý nghĩa thời gian. Chủ thể được ngữ cảnh xác định là người kể chuyện cùng Phao-lô và các bạn đồng hành; “còn ở lại đó” diễn đạt sự tiếp tục lưu lại tại địa điểm vừa nhắc đến.
- source_word: δὲ
  choice: được thể hiện trong mạch câu bằng “khi”
  rationale: δέ đánh dấu một bước chuyển nhẹ trong diễn tiến. Trong tiếng Việt, ý chuyển tiếp này có thể được hòa tự nhiên vào mệnh đề thời gian mà không cần dịch thành một từ riêng như “và” hay “bấy giờ”.
- source_word: ἡμέρας πλείους
  choice: thêm nhiều ngày
  rationale: Cụm đối cách chỉ khoảng thời gian. πλείους về hình thức có nghĩa “nhiều hơn/thêm”, nên “thêm nhiều ngày” vừa giữ được sắc thái bổ sung vừa tự nhiên trong tiếng Việt; không nhất thiết hàm ý một con số lớn.
- source_word: κατῆλθέν
  choice: đi xuống
  rationale: Động từ κατέρχομαι mang ý chuyển động xuống. “Đi xuống” giữ hình ảnh phương hướng từ Giu-đê đến vùng duyên hải và phù hợp với điểm nhìn kể chuyện tiếng Việt.
- source_word: τις
  choice: một
  rationale: Đại từ bất định giới thiệu một nhân vật mới; trong tiếng Việt, “một nhà tiên tri” tự nhiên hơn “một người nào đó, là nhà tiên tri” mà vẫn giữ tính bất định.
- source_word: ἀπὸ τῆς Ἰουδαίας
  choice: từ Giu-đê
  rationale: Cách dịch trực tiếp, tự nhiên của cụm chỉ xuất xứ; “Giu-đê” là địa danh quen dùng trong tiếng Việt.
- source_word: προφήτης
  choice: một nhà tiên tri
  rationale: Cách gọi thông dụng và chính xác cho vai trò được văn bản nêu rõ, không cần diễn giải thêm.
- source_word: ὀνόματι Ἅγαβος
  choice: tên là A-ga-bút
  rationale: ὀνόματι là lối nói có nghĩa “tên là/được gọi là”. “Tên là A-ga-bút” là cách diễn đạt tự nhiên; tên riêng được phiên âm để người đọc phổ thông dễ đọc.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Giữ ngôi “chúng tôi” theo chủ thể ngầm được xác định từ ngữ cảnh, giữ hình ảnh phương hướng “đi xuống”, đồng thời dùng “thêm nhiều ngày” để bảo lưu sắc thái so sánh/bổ sung của πλείους.
