- from: Khi chúng tôi còn ở lại đó thêm nhiều ngày, một nhà tiên tri tên là A-ga-bút từ Giu-đê đi xuống.
  to: Khi chúng tôi còn ở lại đó thêm vài ngày, một nhà tiên tri tên là A-ga-bút đi xuống từ Giu-đê.
  rationale: Đổi «thêm nhiều ngày» thành «thêm vài ngày» để phản ánh tự nhiên hơn ý thời lượng của ἡμέρας πλείους. Giữ «đi xuống» cho κατῆλθεν và chuyển «từ Giu-đê» đến gần động từ để cấu trúc câu rõ hơn, không thay đổi nghĩa.
