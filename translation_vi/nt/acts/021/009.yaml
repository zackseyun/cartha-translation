    rationale: Phân từ προφητεύουσαι bổ nghĩa cho «các con gái»; tiếng Việt hiện đại diễn đạt gọn và tự nhiên hơn bằng «đều nói tiên tri», vẫn giữ ý đây là hoạt động/đặc điểm của tất cả bốn người.
  - severity: low
    issue: «bốn người con gái» có thể rút thành «bốn con gái».
    rationale: Trong câu sở hữu gia đình, «bốn con gái» tự nhiên hơn mà không làm mất nghĩa hay sự trang trọng.
