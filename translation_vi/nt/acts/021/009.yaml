  text: τούτῳ δὲ ἦσαν θυγατέρες ⸂τέσσαρες παρθένοι⸃ προφητεύουσαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/009.yaml
  text: He had four unmarried daughters who were prophesying.
translation:
  language: vi
  text: Ông có bốn con gái đồng trinh, đều nói tiên tri.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τούτῳ
  choice: Ông
  rationale: Đại từ chỉ định ở cách dữ cách quy chiếu về Phi-líp trong văn cảnh ngay trước đó; tiếng Việt tự nhiên dùng đại từ nhân xưng làm chủ ngữ.
- source_word: δὲ
  choice: —
  rationale: Đây là liên từ chuyển tiếp nhẹ; mạch câu tiếng Việt đã thể hiện sự tiếp nối nên không cần dịch riêng.
- source_word: ἦσαν
  choice: có
  rationale: Cấu trúc tồn tại với dữ cách τούτῳ diễn đạt sự sở hữu; tiếng Việt tự nhiên dùng “ông có”.
- source_word: θυγατέρες
  choice: người con gái
  rationale: Diễn đạt chính xác quan hệ gia đình và kết hợp tự nhiên với số từ trong tiếng Việt.
- source_word: τέσσαρες
  choice: bốn
  rationale: Số từ trực tiếp xác định số lượng các con gái.
- source_word: παρθένοι
  choice: đồng trinh
  rationale: Phản ánh trực tiếp nghĩa của παρθένοι, tức những phụ nữ chưa quan hệ tình dục, đồng thời không tự ý giản lược nghĩa ấy thành tình trạng chưa kết hôn.
- source_word: προφητεύουσαι
  choice: là những người nói tiên tri
  rationale: Phân từ hiện tại giống cái số nhiều bổ nghĩa cho các con gái, mô tả hoạt động hoặc đặc điểm đang tiếp diễn của họ.
theological_decisions:
- issue: Cách dịch παρθένοι trong câu nói về những phụ nữ nói tiên tri
  choice: đồng trinh
  alternative: chưa chồng
  rationale: Bản dịch giữ nội dung cụ thể của từ Hy Lạp mà không suy diễn mối liên hệ thần học giữa tình trạng đồng trinh và hoạt động nói tiên tri. “Chưa chồng” tự nhiên hơn nhưng chỉ nêu tình trạng hôn nhân và có thể làm hẹp hoặc đổi sắc thái nghĩa.
- issue: Tính chất của hoạt động προφητεύουσαι
  choice: là những người nói tiên tri
  alternative: đang nói tiên tri
  rationale: Phân từ không nhất thiết mô tả việc họ đang nói tiên tri đúng vào lúc đoàn của Phao-lô đến; cách dịch được chọn giữ được ý hoạt động hoặc vai trò đặc trưng mà không áp đặt thời điểm cụ thể.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Nói tiên tri” là cách diễn đạt Kinh Thánh quen thuộc nhưng vẫn minh bạch; câu tránh suy diễn về chức vụ, tần suất hoặc thẩm quyền của các con gái Phi-líp.
