- from: Ông có bốn người con gái đồng trinh, là những người nói tiên tri.
  to: Ông có bốn con gái đồng trinh, đều nói tiên tri.
  rationale: Chỉnh sửa chỉ nhằm cải thiện tính tự nhiên và độ gọn của tiếng Việt. «Đồng trinh» được giữ để phản ánh trực tiếp παρθένοι; «đều nói tiên tri» giữ ý phân từ số nhiều bổ nghĩa cho cả bốn người con gái, không áp đặt thời điểm cụ thể cho hoạt động nói tiên tri.
