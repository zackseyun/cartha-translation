- from: 'họ la lớn: “Hỡi những người Y-sơ-ra-ên, hãy giúp đỡ! Đây là kẻ đi khắp nơi dạy mọi người chống lại dân tộc, luật pháp và nơi này. Hơn nữa, hắn còn đưa cả người Hy Lạp vào khuôn viên đền thờ[a] và làm ô uế nơi thánh này.”'
  to: 'họ la lớn: “Hỡi những người Y-sơ-ra-ên, hãy giúp đỡ! Đây là kẻ đi khắp nơi dạy mọi người chống lại dân, luật pháp và nơi này. Hơn nữa, người ấy còn đưa cả người Hy Lạp vào khuôn viên đền thờ[a] và làm ô uế nơi thánh này.”'
  rationale: Chỉnh sửa tối thiểu để không tăng sắc thái khinh miệt vượt nguyên văn và để dùng “dân” sát hơn với ὁ λαός. Các lựa chọn còn lại được giữ nguyên vì trung thành với tiếng Hy Lạp, tự nhiên trong tiếng Việt hiện đại, và chú thích đã neo đúng tại ἱερόν.
