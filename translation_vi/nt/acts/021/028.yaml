id: ACT.21.28
reference: Acts 21:28
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: κράζοντες· Ἄνδρες Ἰσραηλῖται, βοηθεῖτε· οὗτός ἐστιν ὁ ἄνθρωπος ὁ κατὰ τοῦ λαοῦ καὶ τοῦ νόμου καὶ τοῦ τόπου τούτου πάντας ⸀πανταχῇ διδάσκων, ἔτι τε καὶ Ἕλληνας εἰσήγαγεν εἰς τὸ ἱερὸν καὶ κεκοίνωκεν τὸν ἅγιον τόπον τοῦτον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/028.yaml
  text: shouting[a], “Men of Israel, help! This is the man who teaches everyone everywhere against the people and the law and this place. And besides that, he has even brought Greeks into the temple and has defiled this holy place.”
translation:
  language: vi
  text: 'họ la lớn: “Hỡi những người Y-sơ-ra-ên, hãy giúp đỡ! Đây là kẻ đi khắp nơi dạy mọi người chống lại dân, luật pháp và nơi này. Hơn nữa, người ấy còn đưa cả người Hy Lạp vào khuôn viên đền thờ[a] và làm ô uế nơi thánh này.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hy Lạp ἱερόν chỉ toàn bộ khu đền thờ hoặc các sân đền thờ, chứ không riêng nơi thánh bên trong.
    reason: Làm rõ phạm vi nghĩa của thuật ngữ chỉ đền thờ và bối cảnh lịch sử của lời cáo buộc.
lexical_decisions:
- source_word: κράζοντες
  choice: họ la lớn
  rationale: Phân từ hiện tại diễn tả cách họ công khai và khẩn thiết đưa ra lời cáo buộc; cách diễn đạt này tự nhiên trong tiếng Việt.
- source_word: Ἄνδρες Ἰσραηλῖται
  choice: Hỡi những người Y-sơ-ra-ên
  rationale: Giữ lời xưng hô trực tiếp với những người nam Y-sơ-ra-ên trong ngữ cảnh, đồng thời tránh cách dịch cứng và cổ như “các nam nhân”.
- source_word: βοηθεῖτε
  choice: hãy giúp đỡ!
  rationale: Giữ mệnh lệnh ngắn gọn; không tự ý thêm tân ngữ “chúng tôi” vốn không có trong tiếng Hy Lạp.
- source_word: οὗτός ἐστιν ὁ ἄνθρωπος
  choice: Đây là kẻ
  rationale: Truyền đạt sắc thái chỉ mặt và cáo buộc; “kẻ” tự nhiên hơn “người đàn ông” trong lời tố cáo này.
- source_word: ὁ κατὰ τοῦ λαοῦ καὶ τοῦ νόμου καὶ τοῦ τόπου τούτου
  choice: chống lại dân tộc, luật pháp và nơi này
  rationale: κατά với sở hữu cách chỉ sự chống đối. “Dân tộc” trong ngữ cảnh là dân Y-sơ-ra-ên; để chữ thường “luật pháp” nhằm không thêm quy ước viết hoa không có trong nguyên văn, dù ngữ cảnh nhiều khả năng chỉ Luật Môi-se.
- source_word: πάντας πανταχῇ διδάσκων
  choice: đi khắp nơi dạy mọi người
  rationale: Giữ cả hai ý bao quát của πάντας và πανταχῇ bằng một trật tự tự nhiên trong tiếng Việt.
- source_word: ἔτι τε καὶ
  choice: Hơn nữa ... còn ... cả
  rationale: Thể hiện lực cộng dồn và gia tăng của lời buộc tội.
- source_word: Ἕλληνας
  choice: người Hy Lạp
  rationale: Dịch theo nghĩa từ vựng cụ thể, không khái quát hóa thành “dân ngoại”.
- source_word: εἰσήγαγεν εἰς τὸ ἱερὸν
  choice: đưa ... vào khuôn viên đền thờ
  rationale: ἱερόν chỉ toàn bộ khu đền thờ hoặc các sân đền thờ, không riêng nơi thánh bên trong; đưa nét nghĩa này vào chính văn để rõ về lịch sử và không gian.
- source_word: κεκοίνωκεν
  choice: làm ô uế
  rationale: Trong ngữ cảnh nghi lễ, κοινόω có nghĩa làm cho ô uế hoặc phàm tục; “làm ô uế” rõ ràng và tự nhiên.
- source_word: τὸν ἅγιον τόπον τοῦτον
  choice: nơi thánh này
  rationale: Giữ tính chất thánh và đại từ chỉ định nhấn mạnh của nguyên văn.
theological_decisions:
- issue: Đối tượng của τοῦ νόμου
  choice: luật pháp
  alternative: Luật Pháp hoặc luật Môi-se
  rationale: Ngữ cảnh cho thấy Luật Môi-se, nhưng chính văn giữ cách gọi khái quát của nguyên bản và không dùng viết hoa để áp đặt quy ước diễn giải; độc giả vẫn có thể nhận ra đối tượng từ bối cảnh Do Thái và đền thờ.
- issue: Phạm vi nghĩa của ἱερόν
  choice: khuôn viên đền thờ
  alternative: đền thờ
  rationale: Cách chọn này phân biệt ἱερόν, toàn khu đền thờ, với ναός, nơi thánh bên trong, và làm rõ bản chất của lời cáo buộc mà không giải quyết thay câu chuyện xem lời cáo buộc có đúng hay không.
- issue: Tư cách của phát ngôn
  choice: giữ nguyên như lời cáo buộc trực tiếp
  alternative: thêm từ ngữ cho biết cáo buộc là sai
  rationale: Câu này thuật lại lời của đám đông; bản dịch không xác nhận cũng không bác bỏ lời tố cáo ngay trong câu, nhờ đó giữ nguyên căng thẳng tường thuật.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Lời tố cáo có sắc thái gấp gáp, đối đầu qua “la lớn”, “kẻ” và “hắn”, nhưng tránh tiếng lóng. Dùng “Y-sơ-ra-ên” theo dạng tên riêng Kinh Thánh quen thuộc; dùng “khuôn viên đền thờ” để chuyển tải chính xác ἱερόν.
