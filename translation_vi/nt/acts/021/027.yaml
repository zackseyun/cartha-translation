  source_fidelity: 'Bản dịch phản ánh đúng trình tự và các thành tố chính của câu Hy Lạp: giai đoạn bảy ngày gần hoàn tất, những người Do Thái từ tỉnh A-si-a nhìn thấy Phao-lô trong khu đền thờ, làm cả đám đông náo động, rồi có hành động cưỡng bức với ông. Tuy nhiên, “bắt giữ” có thể gợi một hành vi bắt giữ theo thẩm quyền hoặc một tình trạng giam giữ, trong khi ἐπέβαλον ἐπ’ αὐτὸν τὰς χεῖρας trực tiếp nói việc họ dùng tay chộp/bắt lấy ông. “Bắt lấy” giữ được tính cưỡng bức mà không thêm sắc thái pháp lý.'
