  text: Ὡς δὲ ἔμελλον αἱ ἑπτὰ ἡμέραι συντελεῖσθαι, οἱ ἀπὸ τῆς Ἀσίας Ἰουδαῖοι θεασάμενοι αὐτὸν ἐν τῷ ἱερῷ συνέχεον πάντα τὸν ὄχλον καὶ ἐπέβαλον ⸂ἐπ’ αὐτὸν τὰς χεῖρας⸃,
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/027.yaml
  text: As the seven days were about to be completed[a], the Jews from Asia, seeing him in the temple, stirred up the whole crowd and laid hands on him[c][b],
translation:
  language: vi
  text: Khi bảy ngày sắp kết thúc, những người Do Thái từ tỉnh A-si-a thấy Phao-lô trong khuôn viên đền thờ[a] thì kích động cả đám đông[b] và bắt lấy ông[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hy Lạp ở đây chỉ toàn bộ khu đền thờ, không riêng nơi thánh bên trong.
    reason: cultural_note
  - marker: b
    text: 'Cũng có thể dịch: “làm cho cả đám đông rối loạn.” Động từ Hy Lạp có thể nhấn mạnh việc kích động hoặc gây hỗn loạn.'
    reason: lexical_alternative
  - marker: c
    text: 'Nguyên văn: “đặt tay trên ông”, một thành ngữ chỉ việc dùng sức chộp lấy hoặc khống chế một người; cũng có thể dịch: “túm lấy ông.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὡς δὲ ἔμελλον αἱ ἑπτὰ ἡμέραι συντελεῖσθαι
  choice: Khi bảy ngày sắp kết thúc
  rationale: Diễn đạt tự nhiên quan hệ thời gian, đồng thời giữ sắc thái sắp xảy ra của ἔμελλον và ý hoàn tất của συντελεῖσθαι.
- source_word: οἱ ἀπὸ τῆς Ἀσίας Ἰουδαῖοι
  choice: những người Do Thái từ tỉnh A-si-a
  rationale: Ἀσία ở đây là tỉnh A-si-a của La Mã, không phải toàn bộ châu Á theo cách hiểu hiện đại; thêm “tỉnh” giúp tránh hiểu lầm địa lý.
- source_word: θεασάμενοι αὐτὸν
  choice: thấy Phao-lô
  rationale: Dùng tên riêng thay cho đại từ để câu tiếng Việt rõ chủ thể tham chiếu mà không làm thay đổi nội dung; phân từ được chuyển thành động từ trong mệnh đề thời gian tự nhiên.
- source_word: ἐν τῷ ἱερῷ
  choice: trong khuôn viên đền thờ
  rationale: ἱερόν chỉ toàn bộ khu đền thờ, không riêng nơi thánh bên trong; “khuôn viên đền thờ” vừa chính xác vừa dễ hiểu.
- source_word: συνέχεον πάντα τὸν ὄχλον
  choice: kích động cả đám đông
  rationale: συγχέω trong bối cảnh này có thể nhấn mạnh việc kích động hoặc làm đám đông rối loạn; bản chính chọn cách diễn đạt phù hợp diễn tiến của vụ náo động và ghi nhận nghĩa kia trong chú thích.
- source_word: ἐπέβαλον ἐπ’ αὐτὸν τὰς χεῖρας
  choice: bắt giữ ông
  rationale: Thành ngữ Hy Lạp nói đến việc dùng tay khống chế hoặc chộp lấy một người. “Bắt giữ” truyền đạt rõ hành động cưỡng bức trong tiếng Việt hiện đại, còn nghĩa sát hình ảnh được nêu ở chú thích.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu giữ nhịp kể chuyện nhanh của nguyên văn. “A-si-a” được xác định là một tỉnh để tránh liên tưởng đến châu Á hiện đại; “khuôn viên đền thờ” làm rõ phạm vi của ἱερόν.
