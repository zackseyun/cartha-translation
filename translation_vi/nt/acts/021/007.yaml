reference: Acts 21:7
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἡμεῖς δὲ τὸν πλοῦν διανύσαντες ἀπὸ Τύρου κατηντήσαμεν εἰς Πτολεμαΐδα, καὶ ἀσπασάμενοι τοὺς ἀδελφοὺς ἐμείναμεν ἡμέραν μίαν παρ’ αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/007.yaml
  text: We[a], having finished the voyage from Tyre, arrived at Ptolemais, and after greeting the brothers, we stayed with them one day.
translation:
  language: vi
  text: Sau khi hoàn tất chuyến đi biển từ Ty-rơ, chúng tôi đến Pto-lê-mai. Chúng tôi chào thăm các anh em[a] rồi ở lại với họ một ngày.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể hiểu là “các anh chị em”; tiếng Hy Lạp viết “các anh em”, một dạng số nhiều giống đực có thể dùng rộng hơn để chỉ những người cùng đức tin.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἡμεῖς δὲ
  choice: chúng tôi
  rationale: Đại từ được nêu rõ để đánh dấu chủ thể kể chuyện; δέ có chức năng chuyển tiếp nhẹ, được thể hiện tự nhiên qua mạch văn thay vì thêm một liên từ dễ gây cảm giác đối lập.
- source_word: τὸν πλοῦν διανύσαντες
  choice: sau khi hoàn tất chuyến đi biển
  rationale: διανύω diễn tả việc hoàn thành một hành trình, còn πλοῦς chỉ chuyến đi bằng đường biển; cấu trúc “sau khi” truyền đạt rõ thứ tự hành động của phân từ bất định quá khứ.
- source_word: ἀπὸ Τύρου
  choice: từ Ty-rơ
  rationale: ἀπό trực tiếp chỉ nơi xuất phát.
- source_word: κατηντήσαμεν εἰς Πτολεμαΐδα
  choice: đến Pto-lê-mai
  rationale: καταντάω trong bối cảnh hành trình có nghĩa là đến hoặc tới một điểm đích; εἰς đánh dấu nơi đến.
- source_word: ἀσπασάμενοι
  choice: chào thăm
  rationale: ἀσπάζομαι chỉ hành động chào hỏi thân tình; “chào thăm” tự nhiên trong ngữ cảnh gặp cộng đồng tín hữu và không hàm ý rằng họ là bên tiếp đón.
- source_word: τοὺς ἀδελφοὺς
  choice: các anh em
  rationale: ἀδελφοί là danh từ giống đực số nhiều, trong cộng đồng Cơ Đốc có thể chỉ các tín hữu nói chung. Bản chính giữ hình thức giống đực của nguyên văn, còn phạm vi có thể bao gồm cả phụ nữ được nêu trong chú thích.
- source_word: ἐμείναμεν ἡμέραν μίαν παρ’ αὐτοῖς
  choice: ở lại với họ một ngày
  rationale: μένω là “ở lại”; ἡμέραν μίαν là đối cách chỉ khoảng thời gian; παρά với tặng cách diễn tả việc ở cùng những người ấy.
theological_decisions:
- issue: Phạm vi của ἀδελφοὺς trong cộng đồng tín hữu
  choice: các anh em
  alternative: các anh chị em; các tín hữu
  rationale: Nguyên văn dùng danh từ giống đực số nhiều nhưng cách dùng Cơ Đốc giáo ban đầu có thể bao gồm toàn thể các tín hữu, cả nam lẫn nữ. Bản dịch giữ dạng ngữ pháp của tiếng Hy Lạp và ghi rõ khả năng bao quát trong chú thích, không âm thầm thu hẹp hay mở rộng nghĩa.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ đọc. Tên địa danh được phiên âm quen thuộc sang tiếng Việt. Câu Hy Lạp dài được tách thành hai câu để diễn đạt tự nhiên, trong khi vẫn giữ nguyên thứ tự các sự kiện.
