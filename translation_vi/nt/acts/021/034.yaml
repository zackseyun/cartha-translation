  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἄλλοι δὲ ἄλλο τι ⸀ἐπεφώνουν ἐν τῷ ὄχλῳ· μὴ ⸂δυναμένου δὲ αὐτοῦ⸃ γνῶναι τὸ ἀσφαλὲς διὰ τὸν θόρυβον ἐκέλευσεν ἄγεσθαι αὐτὸν εἰς τὴν παρεμβολήν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/034.yaml
  text: But some in the crowd were shouting one thing[a], and others another. Since he was not able to learn the facts because of the uproar[b], he ordered him to be brought into the barracks.
translation:
  language: vi
  text: Nhưng trong đám đông, người thì la lên điều này, người lại la lên điều khác. Vì cảnh náo loạn, ông không thể biết chắc sự việc[a], nên ra lệnh đưa người ấy vào đồn lính[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “biết sự thật của sự việc” hoặc “biết điều gì là chắc chắn.”
    reason: lexical_alternative
  - marker: b
    text: “Đồn lính” nói đến khu đóng quân của quân đội La Mã, có lẽ nằm trong tổ hợp pháo đài nối liền với khu vực đền thờ.
    reason: cultural_note
lexical_decisions:
- source_word: ἄλλοι δὲ ἄλλο τι ἐπεφώνουν ἐν τῷ ὄχλῳ
  choice: nhưng trong đám đông, người thì la lên điều này, người lại la lên điều khác
  rationale: Cấu trúc “người thì… người lại…” diễn đạt tự nhiên thế đối ứng phân phối của ἄλλοι…ἄλλο τι; “la lên” thể hiện tiếng hô lớn đang tiếp diễn giữa đám đông mà không cường điệu ὄχλος thành “đám bạo loạn”.
- source_word: μὴ δυναμένου δὲ αὐτοῦ γνῶναι τὸ ἀσφαλές
  choice: ông không thể biết chắc sự việc
  rationale: Diễn đạt phân từ tuyệt đối sở hữu cách theo quan hệ nguyên nhân trong ngữ cảnh. “Biết chắc sự việc” giữ ý τὸ ἀσφαλές là điều đáng tin, chắc chắn hoặc sự thật xác định được, thay vì chỉ nói đến tri thức trừu tượng.
- source_word: διὰ τὸν θόρυβον
  choice: vì cảnh náo loạn
  rationale: θόρυβος chỉ sự ồn ào hỗn loạn của đám đông, mạnh hơn tiếng động thông thường; “cảnh náo loạn” vừa rõ nghĩa vừa trang trọng tự nhiên.
- source_word: ἐκέλευσεν ἄγεσθαι αὐτὸν
  choice: nên ra lệnh đưa người ấy
  rationale: “Ra lệnh đưa” phản ánh mệnh lệnh dứt khoát và động từ nguyên mẫu bị động mà không tự ý nêu người thi hành. “Người ấy” tránh lặp đại từ “ông” gây nhầm với viên chỉ huy.
- source_word: εἰς τὴν παρεμβολήν
  choice: vào đồn lính
  rationale: Trong bối cảnh này, παρεμβολή là khu đóng quân của lính La Mã thuộc tổ hợp pháo đài cạnh khuôn viên đền thờ. “Đồn lính” rõ và tự nhiên hơn “trại”, vốn có thể gợi nơi đóng quân tạm thời.
theological_decisions: []
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Câu đầu dùng kết cấu đối ứng khẩu ngữ chuẩn để tái hiện những tiếng la trái ngược; câu sau giữ mạch nguyên nhân–kết quả và tránh giải quyết quá mức sắc thái của τὸ ἀσφαλές.
