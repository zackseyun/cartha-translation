id: ACT.21.17
reference: Acts 21:17
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Γενομένων δὲ ἡμῶν εἰς Ἱεροσόλυμα ἀσμένως ⸀ἀπεδέξαντο ἡμᾶς οἱ ἀδελφοί.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/017.yaml
  text: When we arrived in Jerusalem[a], the brothers welcomed us gladly.
translation:
  language: vi
  text: Khi chúng tôi đến Giê-ru-sa-lem, các anh em[a] vui mừng tiếp đón chúng tôi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể hiểu là “các anh chị em”; tiếng Hy Lạp viết “các anh em”, nhưng từ này cũng có thể chỉ rộng hơn đến những người cùng đức tin.
    reason: lexical_alternative
lexical_decisions:
- source_word: Γενομένων δὲ ἡμῶν εἰς Ἱεροσόλυμα
  choice: Khi chúng tôi đến Giê-ru-sa-lem
  rationale: Cấu trúc sở hữu cách tuyệt đối với γίνομαι nêu hoàn cảnh thời gian và, cùng εἰς, diễn tả việc đến nơi; cách dịch này tự nhiên trong tiếng Việt và giữ rõ ý thời gian lẫn đích đến.
- source_word: ἀσμένως
  choice: vui mừng
  rationale: Trạng từ này diễn tả sự vui thích, sốt sắng khi tiếp nhận ai; “vui mừng” truyền đạt trực tiếp sắc thái ấy mà không thêm ý quá mức.
- source_word: ἀπεδέξαντο
  choice: tiếp đón
  rationale: Trong ngữ cảnh này, ἀποδέχομαι chỉ việc đón nhận người khác với thái độ hiếu khách; “tiếp đón” tự nhiên và chính xác hơn “tiếp nhận” trong tiếng Việt hiện đại.
- source_word: οἱ ἀδελφοί
  choice: các anh em
  rationale: Giữ hình thức giống đực số nhiều của nguyên văn và cách gọi quen thuộc giữa các tín hữu; chú thích nêu khả năng từ này chỉ rộng hơn đến cộng đồng tín hữu, gồm cả nam lẫn nữ.
theological_decisions:
- issue: Cách dịch có đánh dấu giới tính của οἱ ἀδελφοί đối với cộng đồng Cơ Đốc tại Giê-ru-sa-lem
  choice: các anh em
  alternative: các anh chị em; các tín hữu
  rationale: Nguyên văn dùng danh từ giống đực số nhiều ἀδελφοί. Bản chính giữ hình thức ấy thay vì xóa sắc thái giới tính, đồng thời chú thích bảo tồn khả năng từ này được dùng rộng để chỉ các tín hữu, có thể gồm cả phụ nữ.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Giê-ru-sa-lem” theo lối phiên âm Kinh Thánh quen thuộc; “tiếp đón” phù hợp với ngữ cảnh hiếu khách.
