translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng và dễ hiểu. Dùng “đổ xô tụ tập lại” để thể hiện sự hội tụ đột ngột của dân chúng; dùng “khuôn viên đền thờ” nhằm chuyển tải chính xác phạm vi của ἱερόν mà không buộc độc giả phải dựa hoàn toàn vào chú thích.
