  text: ἐκινήθη τε ἡ πόλις ὅλη καὶ ἐγένετο συνδρομὴ τοῦ λαοῦ, καὶ ἐπιλαβόμενοι τοῦ Παύλου εἷλκον αὐτὸν ἔξω τοῦ ἱεροῦ, καὶ εὐθέως ἐκλείσθησαν αἱ θύραι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/030.yaml
  text: And the whole city was stirred up[a], and a crowd of the people formed; and after seizing Paul, they dragged him outside the temple[c][b], and immediately the doors were shut.
translation:
  language: vi
  text: Cả thành đều náo động, dân chúng đổ xô đến; họ bắt lấy Phao-lô, lôi ông ra khỏi khuôn viên đền thờ[a], rồi lập tức các cửa đều đóng lại[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hy Lạp ở đây chỉ toàn bộ khuôn viên hay các sân của đền thờ, không chỉ riêng nơi thánh bên trong.
    reason: cultural_note
  - marker: b
    text: 'Cũng có thể dịch: “các cổng đều đóng lại,” vì trong bối cảnh đền thờ, từ này có thể chỉ những cửa hoặc cổng ra vào.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκινήθη τε ἡ πόλις ὅλη
  choice: Cả thành đều náo động
  rationale: Động từ bị động ἐκινήθη trong ngữ cảnh này diễn tả sự xáo động lan khắp thành, không chỉ chuyển động theo nghĩa đen. “Náo động” tự nhiên, rõ nghĩa và giữ được sắc thái bất ổn tập thể.
- source_word: ἐγένετο συνδρομὴ τοῦ λαοῦ
  choice: dân chúng đổ xô tụ tập lại
  rationale: συνδρομή chỉ việc nhiều người cùng chạy hoặc dồn đến một chỗ. Cách dịch này giữ nét hội tụ đột ngột và mạnh hơn cách nói tĩnh là “một đám đông hình thành”.
- source_word: ἐπιλαβόμενοι τοῦ Παύλου
  choice: họ bắt lấy Phao-lô
  rationale: Phân từ ἐπιλαβόμενοι diễn tả việc dùng sức nắm giữ Phao-lô; “bắt lấy” vừa tự nhiên vừa thể hiện tính cưỡng bức.
- source_word: εἷλκον αὐτὸν
  choice: lôi ông
  rationale: εἷλκον là thể chưa hoàn thành, gợi hành động kéo lôi đang diễn ra. Tiếng Việt không cần đánh dấu riêng thể này; “lôi” truyền đạt rõ hành động cưỡng bức và tiến trình trong mạch kể.
- source_word: ἔξω τοῦ ἱεροῦ
  choice: ra khỏi khuôn viên đền thờ
  rationale: ἱερόν ở đây chỉ toàn bộ khu đền thờ, không riêng nơi thánh bên trong. “Khuôn viên đền thờ” diễn đạt trực tiếp sự phân biệt này trong chính văn.
- source_word: εὐθέως
  choice: lập tức
  rationale: Diễn đạt tự nhiên ý xảy ra ngay của trạng từ εὐθέως.
- source_word: ἐκλείσθησαν αἱ θύραι
  choice: các cửa đều đóng lại
  rationale: Giữ dạng bị động của động từ và số nhiều của θύραι. Trong bối cảnh khu đền thờ, danh từ này cũng có thể chỉ các cổng, nên ghi nhận phương án ấy trong chú thích.
