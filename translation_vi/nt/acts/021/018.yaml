  source_fidelity: 'Bản dịch truyền đạt chính xác cấu trúc và ý nghĩa của câu Hy Lạp: mốc thời gian τῇ δὲ ἐπιούσῃ là “Ngày hôm sau”; Phao-lô đi cùng nhóm “chúng tôi” đến với Gia-cơ; và toàn thể các trưởng lão hiện diện. “Đến gặp Gia-cơ” là cách diễn đạt tiếng Việt tự nhiên cho εἰσῄει ... πρὸς Ἰάκωβον trong bối cảnh một cuộc viếng thăm, không thêm chi tiết đáng kể. “Có mặt” là một lựa chọn hợp lý cho παρεγένοντο và chú thích đã giữ lại khả năng nhấn mạnh việc đến/nơi đến.'
