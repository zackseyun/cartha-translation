source:
  edition: SBLGNT
  text: τῇ δὲ ἐπιούσῃ εἰσῄει ὁ Παῦλος σὺν ἡμῖν πρὸς Ἰάκωβον, πάντες τε παρεγένοντο οἱ πρεσβύτεροι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/018.yaml
  text: On the next day[a], Paul went in with us to James[b], and all the elders were present.
translation:
  language: vi
  text: Ngày hôm sau, Phao-lô cùng chúng tôi đến gặp Gia-cơ, và tất cả các trưởng lão đều có mặt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “và tất cả các trưởng lão đều đến” hoặc “đều tới nơi.” Động từ Hy Lạp có thể nhấn mạnh việc họ đến hoặc việc họ hiện diện.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ δὲ ἐπιούσῃ
  choice: Ngày hôm sau
  rationale: Cụm phân từ ở cách dữ liệu là một thành ngữ chỉ ngày kế tiếp; cách dịch này tự nhiên, rõ ràng trong tiếng Việt hiện đại.
- source_word: εἰσῄει ... πρὸς Ἰάκωβον
  choice: đến gặp Gia-cơ
  rationale: Động từ chỉ sự đi vào, kết hợp với πρός và tên người, diễn tả việc Phao-lô đi đến chỗ Gia-cơ. “Đến gặp” truyền đạt tự nhiên hướng chuyển động và bối cảnh cuộc gặp mà không xác định địa điểm cụ thể.
- source_word: σὺν ἡμῖν
  choice: cùng chúng tôi
  rationale: Diễn đạt trực tiếp ý đồng hành của σύν với cách dữ liệu.
- source_word: πάντες τε
  choice: và tất cả ... đều
  rationale: “Và” thể hiện lực nối nhẹ của τέ, còn kết cấu “tất cả ... đều” là cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: παρεγένοντο
  choice: có mặt
  rationale: παραγίνομαι có thể nhấn mạnh việc đến hoặc tình trạng hiện diện; trong ngữ cảnh cuộc gặp, “có mặt” trôi chảy và phù hợp, đồng thời ghi chú bảo tồn nghĩa thay thế.
- source_word: οἱ πρεσβύτεροι
  choice: các trưởng lão
  rationale: Thuật ngữ chỉ những người lãnh đạo được nhìn nhận trong hội thánh; “trưởng lão” giữ nghĩa từ vựng và không áp đặt cơ cấu giáo phái về sau.
theological_decisions:
- issue: Danh tính và vai trò của Ἰάκωβον
  choice: Chỉ dịch tên riêng là “Gia-cơ”, không thêm chức danh hoặc quan hệ gia đình.
  alternative: “Gia-cơ, em của Chúa” hoặc “Gia-cơ, người lãnh đạo hội thánh Giê-ru-sa-lem”.
  rationale: Câu này chỉ nêu tên Gia-cơ. Việc thêm thông tin nhận diện tuy có thể phù hợp với văn mạch rộng hơn nhưng không được phát biểu trong câu.
- issue: Ý nghĩa hội thánh của οἱ πρεσβύτεροι
  choice: “các trưởng lão”
  alternative: “các lãnh đạo hội thánh” hoặc “các giám chức”.
  rationale: “Trưởng lão” bảo tồn danh xưng trong nguyên văn mà không đồng nhất nhóm này với một mô hình quản trị giáo hội riêng biệt.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng các dạng tên quen thuộc trong truyền thống Kinh Thánh tiếng Việt. Dấu chú thích [a] đặt ngay sau mệnh đề liên quan.
