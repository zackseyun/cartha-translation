  terminology: “Gia-cơ” phù hợp với cách phiên âm Kinh Thánh Việt ngữ thông dụng. “Các trưởng lão” giữ được nghĩa của οἱ πρεσβύτεροι mà không áp đặt một mô hình giáo hội hoặc cách hiểu giáo phái. Không có mở rộng nhận dạng nào đối với Gia-cơ.
