id: ACT.21.12
reference: Acts 21:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὡς δὲ ἠκούσαμεν ταῦτα, παρεκαλοῦμεν ἡμεῖς τε καὶ οἱ ἐντόπιοι τοῦ μὴ ἀναβαίνειν αὐτὸν εἰς Ἰερουσαλήμ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/012.yaml
  text: When we heard these things[a], we and the local people urged him not to go up to Jerusalem.
translation:
  language: vi
  text: Khi nghe những điều ấy[a], chúng tôi cùng với dân địa phương khẩn khoản xin ông đừng đi lên Giê-ru-sa-lem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “chúng tôi cùng với dân địa phương nài xin ông đừng đi lên Giê-ru-sa-lem.” Động từ Hy Lạp có thể mang sắc thái van nài tha thiết.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ ἠκούσαμεν ταῦτα
  choice: Khi nghe những điều ấy
  rationale: Diễn đạt tự nhiên mệnh đề thời gian, giữ số nhiều của ταῦτα để chỉ nội dung lời tiên báo vừa được nói.
- source_word: παρεκαλοῦμεν
  choice: khẩn khoản xin
  rationale: Trong ngữ cảnh này, παρακαλέω chỉ lời yêu cầu tha thiết. Cách dịch này cũng phù hợp với thể chưa hoàn thành, gợi hành động nài xin đang tiếp diễn, mà không cần thêm từ chỉ sự lặp lại.
- source_word: ἡμεῖς τε καὶ οἱ ἐντόπιοι
  choice: chúng tôi cùng với dân địa phương
  rationale: Phân biệt rõ đoàn của người kể chuyện với những người cư trú tại nơi ấy, đồng thời dùng lối nói hiện đại và trang trọng vừa phải.
- source_word: τοῦ μὴ ἀναβαίνειν αὐτὸν
  choice: xin ông đừng đi lên
  rationale: Diễn đạt nội dung lời khẩn khoản bằng cấu trúc tiếng Việt tự nhiên; đại từ 'ông' chỉ Phao-lô và phù hợp văn phong tường thuật trang trọng.
- source_word: εἰς Ἰερουσαλήμ
  choice: Giê-ru-sa-lem
  rationale: Giữ địa danh quen dùng trong tiếng Việt; kết hợp với 'đi lên' để bảo toàn thành ngữ chỉ hướng trong nguyên văn.
theological_decisions:
- issue: Thành ngữ chỉ hướng khi đi đến Giê-ru-sa-lem
  choice: đi lên Giê-ru-sa-lem
  alternative: đi đến Giê-ru-sa-lem
  rationale: ἀναβαίνειν có nghĩa đen là 'đi lên' và là cách nói thông thường về hành trình đến Giê-ru-sa-lem. Giữ yếu tố này phản ánh nguyên văn mà không thêm một khẳng định thần học.
- issue: Mức độ tha thiết của παρακαλέω
  choice: khẩn khoản xin
  alternative: khuyên
  rationale: Bối cảnh lời tiên báo về việc Phao-lô sẽ bị trói cho thấy đây là lời nài xin tha thiết hơn một lời khuyên thông thường; tuy vậy, chú thích vẫn nêu khả năng diễn đạt mạnh hơn.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, rõ ràng và trang trọng vừa phải. Câu giữ thành ngữ 'đi lên Giê-ru-sa-lem' và sắc thái khẩn thiết của lời yêu cầu; dấu chú thích [a] được đặt ngay sau phần nội dung mà nhóm người vừa nghe.
