  text: ὅτε δὲ ἐγένετο ἐπὶ τοὺς ἀναβαθμούς, συνέβη βαστάζεσθαι αὐτὸν ὑπὸ τῶν στρατιωτῶν διὰ τὴν βίαν τοῦ ὄχλου,
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/035.yaml
  text: When he came to the steps[a], it happened that he was being carried by the soldiers because of the violence of the crowd[b],
translation:
  language: vi
  text: Khi ông tới cầu thang[a], quân lính phải khiêng ông đi[b] vì bạo lực của đám đông.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Cầu thang” có lẽ là cầu thang dẫn lên đồn lính La Mã (xem Công Vụ 21:34, 37).
    reason: cross_reference
  - marker: b
    text: 'Cũng có thể dịch: “ông được quân lính khiêng đi.” Cấu trúc Hy Lạp dùng động từ bị động; trong ngữ cảnh này, cách diễn đạt cũng có thể nhấn mạnh rằng bạo lực của đám đông khiến quân lính buộc phải khiêng ông.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε δὲ
  choice: Khi
  rationale: ὅτε mở đầu mệnh đề thời gian; δέ chỉ nối nhẹ trong mạch kể nên không cần dịch thành một từ đối lập riêng trong tiếng Việt.
- source_word: ἐγένετο ἐπὶ τοὺς ἀναβαθμούς
  choice: ông đến chỗ các bậc thang
  rationale: γίνομαι với ἐπί và đối cách ở đây diễn tả việc đến một địa điểm. Cách dịch này tự nhiên và giữ rõ vị trí nơi sự việc tiếp theo xảy ra.
- source_word: ἀναβαθμούς
  choice: các bậc thang
  rationale: Danh từ này chỉ những bậc hoặc cầu thang đi lên; “các bậc thang” phù hợp với bối cảnh lối lên đồn lính.
- source_word: συνέβη βαστάζεσθαι
  choice: phải khiêng ông đi
  rationale: συνέβη giới thiệu tình huống phát sinh, còn động từ nguyên mẫu bị động hiện tại βαστάζεσθαι diễn tả việc ông được khiêng. Trong tiếng Việt, “phải khiêng ông đi” diễn đạt tự nhiên hệ quả thực tế do sự hung bạo của đám đông gây ra; chú thích giữ lại cách hiểu sát hình thức bị động hơn.
- source_word: ὑπὸ τῶν στρατιωτῶν
  choice: quân lính
  rationale: Cụm này nêu tác nhân của thể bị động; chuyển thành chủ ngữ trong tiếng Việt giúp câu tự nhiên mà không đổi tác nhân hành động.
- source_word: διὰ τὴν βίαν τοῦ ὄχλου
  choice: vì sự hung bạo của đám đông
  rationale: διά với đối cách nêu nguyên nhân. βία có nghĩa là sức mạnh cưỡng bức hoặc bạo lực; “sự hung bạo” diễn tả hành vi tấn công của đám đông mà không cần dùng từ “đám hỗn loạn” cho ὄχλος.
