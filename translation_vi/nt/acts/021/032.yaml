  text: ὃς ἐξαυτῆς παραλαβὼν στρατιώτας καὶ ἑκατοντάρχας κατέδραμεν ἐπ’ αὐτούς, οἱ δὲ ἰδόντες τὸν χιλίαρχον καὶ τοὺς στρατιώτας ἐπαύσαντο τύπτοντες τὸν Παῦλον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/032.yaml
  text: He immediately took soldiers and centurions and ran down to them[a], and when they saw the tribune and the soldiers, they stopped beating Paul.
translation:
  language: vi
  text: Ông lập tức dẫn theo binh lính và các viên đội trưởng, chạy xuống chỗ đám đông. Khi đám đông thấy viên chỉ huy[a] và binh lính, họ ngừng đánh Phao-lô.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “viên chỉ huy quân sự”; từ Hy Lạp χιλίαρχος chỉ một sĩ quan La Mã chỉ huy một cohort (đơn vị quân La Mã).
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξαυτῆς
  choice: lập tức
  rationale: Diễn tả hành động xảy ra ngay, đồng thời giữ được nhịp khẩn cấp của câu.
- source_word: παραλαβὼν
  choice: dẫn theo
  rationale: Phân từ nói đến việc viên chỉ huy đưa binh lính và các đội trưởng đi cùng mình; “dẫn theo” tự nhiên và rõ nghĩa trong tiếng Việt.
- source_word: στρατιώτας
  choice: binh lính
  rationale: Chỉ những quân nhân nói chung và phù hợp với bối cảnh quân đội La Mã.
- source_word: ἑκατοντάρχας
  choice: các viên đội trưởng
  rationale: Chức danh La Mã chỉ sĩ quan chỉ huy khoảng một trăm quân; cách gọi này dễ hiểu hơn lối phiên âm chuyên môn.
- source_word: κατέδραμεν ἐπ’ αὐτούς
  choice: chạy xuống chỗ họ
  rationale: Giữ cả sắc thái di chuyển nhanh và hướng đi xuống từ khu đồn lũy, nhưng không thêm ý tấn công vốn không nhất thiết có trong ngữ cảnh.
- source_word: χιλίαρχον
  choice: viên chỉ huy
  rationale: Trong ngữ cảnh, từ này chỉ sĩ quan La Mã chỉ huy một đơn vị cấp cohort; “viên chỉ huy” rõ ràng với độc giả phổ thông, còn chi tiết lịch sử được nêu trong chú thích.
- source_word: ἐπαύσαντο
  choice: liền ngừng
  rationale: Diễn tả việc đám đông chấm dứt hành động khi thấy quân đội; “liền” làm rõ sự chuyển biến tức thời được ngữ cảnh hàm ý.
- source_word: τύπτοντες
  choice: đánh
  rationale: Phân từ hiện tại diễn tả hành động ra đòn đang tiếp diễn; trong cấu trúc “ngừng đánh”, tiếng Việt tự nhiên vẫn truyền đạt được tính liên tục và bạo lực.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu được tách làm hai để tránh kết cấu phân từ nặng nề trong tiếng Việt, nhưng vẫn giữ trình tự hành động và tính khẩn cấp của nguyên văn. Đại từ “ông” nối với chủ thể đã được nêu ở câu trước.
