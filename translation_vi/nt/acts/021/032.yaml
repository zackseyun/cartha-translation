  to: Ông lập tức dẫn theo binh lính và các viên đội trưởng, chạy xuống chỗ đám đông. Khi đám đông thấy viên chỉ huy[a] và binh lính, họ ngừng đánh Phao-lô.
  rationale: Bản sửa chỉ làm rõ đối tượng được quy chiếu là đám đông, loại bỏ một từ thêm sắc thái không cần thiết, và làm chú thích lịch sử dễ hiểu hơn. Các lựa chọn từ vựng và trật tự hành động còn lại được giữ nguyên.
