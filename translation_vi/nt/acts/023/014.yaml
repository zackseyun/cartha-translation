reference: Acts 23:14
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οἵτινες προσελθόντες τοῖς ἀρχιερεῦσιν καὶ τοῖς πρεσβυτέροις εἶπαν· Ἀναθέματι ἀνεθεματίσαμεν ἑαυτοὺς μηδενὸς γεύσασθαι ἕως οὗ ἀποκτείνωμεν τὸν Παῦλον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/014.yaml
  text: These men came to the chief priests and the elders and said[a], “We have bound ourselves under a curse to taste nothing until we kill Paul.”
translation:
  language: vi
  text: 'Những người ấy đến gặp các thượng tế và các trưởng lão, nói rằng: “Chúng tôi đã tự đặt mình dưới lời nguyền[a], thề không nếm gì cả cho đến khi giết được Phao-lô.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn dùng một công thức nhấn mạnh, có nghĩa là họ thề và tự chuốc lấy lời nguyền nếu không giữ lời.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἵτινες
  choice: Những người ấy
  rationale: Đại từ quan hệ có sắc thái định tính quy chiếu về những kẻ âm mưu ở câu trước; cách diễn đạt này làm rõ đối tượng và tự nhiên trong tiếng Việt.
- source_word: προσελθόντες
  choice: đến gặp
  rationale: Phân từ bất định quá khứ diễn tả hành động xảy ra trước động từ chính “nói”; “đến gặp” phù hợp ngữ cảnh họ tiếp cận các nhà lãnh đạo.
- source_word: τοῖς ἀρχιερεῦσιν καὶ τοῖς πρεσβυτέροις
  choice: các thượng tế và các trưởng lão
  rationale: Đây là các danh xưng chỉ giới lãnh đạo tôn giáo và cộng đồng Do Thái, không chỉ người cao tuổi.
- source_word: Ἀναθέματι ἀνεθεματίσαμεν ἑαυτοὺς
  choice: chúng tôi đã tự đặt mình dưới lời nguyền
  rationale: Kết cấu danh từ đồng gốc với động từ nhấn mạnh một lời thề tự chuốc lấy sự nguyền rủa nếu vi phạm; cách dịch giữ được mức độ nghiêm trọng mà không dùng thuật ngữ giáo hội hậu kỳ.
- source_word: μηδενὸς γεύσασθαι
  choice: không nếm gì cả
  rationale: Giữ nghĩa trực tiếp của γεύομαι và sắc thái nhấn mạnh của μηδενός; trong ngữ cảnh, câu này nói đến việc kiêng ăn.
- source_word: ἕως οὗ ἀποκτείνωμεν
  choice: cho đến khi giết được
  rationale: Mệnh đề với động từ giả định bất định quá khứ chỉ biến cố được dự định làm giới hạn cho lời thề; “giết được” diễn đạt tự nhiên mục tiêu chưa hoàn tất.
- source_word: τὸν Παῦλον
  choice: Phao-lô
  rationale: Dùng dạng tên riêng quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
theological_decisions:
- issue: Cách dịch công thức thề Ἀναθέματι ἀνεθεματίσαμεν ἑαυτοὺς
  choice: đã tự đặt mình dưới lời nguyền
  alternative: đã tự buộc mình bằng một lời thề độc
  rationale: Nguyên văn diễn tả một lời thề tự nguyền rủa, chứ không phải “anathema” theo nghĩa thuật ngữ giáo hội về sau. Bản dịch chính giữ hình ảnh lời nguyền và để chú thích giải thích bản chất tự nguyền của lời thề.
translation_notes:
  register: Văn phong tường thuật hiện đại, trang trọng và dễ hiểu. “Thượng tế”, “trưởng lão” và “Phao-lô” theo cách dùng Kinh Thánh tiếng Việt quen thuộc; lời thoại giữ sự quyết liệt của lời thề trong nguyên văn.
