revisions:
- from: 'Ông gọi hai viên đại đội trưởng đến và nói: “Hãy chuẩn bị hai trăm bộ binh để đi đến tận Sê-sa-rê, cùng với bảy mươi kỵ binh và hai trăm lính cầm giáo[a], khởi hành từ giờ thứ ba ban đêm[b].”'
  to: 'Ông gọi hai viên đội trưởng đến và nói: “Hãy chuẩn bị hai trăm binh lính để đi đến tận Sê-sa-rê, cùng bảy mươi kỵ binh và hai trăm lính cầm giáo[a], vào giờ thứ ba của đêm[b].”'
  rationale: 'Sửa các chỗ diễn đạt vượt quá mức độ xác định của nguyên văn: thay “bộ binh” bằng “binh lính”, thay cấp bậc hiện đại hóa “đại đội trưởng” bằng “đội trưởng”, và bỏ động từ thêm “khởi hành”. Giữ nguyên tên địa danh, các số lượng, thứ tự các đơn vị, tính bất định của δεξιολάβους trong chú thích, và các neo chú thích đúng vị trí.'
