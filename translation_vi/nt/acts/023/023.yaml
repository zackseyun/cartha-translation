source:
  edition: SBLGNT
  text: Καὶ προσκαλεσάμενός ⸂τινας δύο⸃ τῶν ἑκατονταρχῶν εἶπεν· Ἑτοιμάσατε στρατιώτας διακοσίους ὅπως πορευθῶσιν ἕως Καισαρείας, καὶ ἱππεῖς ἑβδομήκοντα καὶ δεξιολάβους διακοσίους, ἀπὸ τρίτης ὥρας τῆς νυκτός,
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/023.yaml
  text: And calling two of the centurions to him[a], he said, “Prepare two hundred soldiers to go as far as Caesarea, and seventy horsemen and two hundred spearmen[b], at the third hour of the night.”
translation:
  language: vi
  text: 'Ông gọi hai viên đội trưởng đến và nói: “Hãy chuẩn bị hai trăm binh lính để đi đến tận Sê-sa-rê, cùng bảy mươi kỵ binh và hai trăm lính cầm giáo[a], vào giờ thứ ba của đêm[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “lính hộ vệ bên phải”; nghĩa chính xác của từ hiếm được dịch là “lính cầm giáo” chưa chắc chắn.
    reason: lexical_alternative
  - marker: b
    text: Tức khoảng giờ thứ ba kể từ khi đêm bắt đầu, xấp xỉ 9 giờ tối theo cách tính giờ của người Do Thái.
    reason: cultural_note
lexical_decisions:
- source_word: προσκαλεσάμενός
  choice: gọi ... đến
  rationale: Diễn đạt tự nhiên hành động triệu hai người đến trước mặt ông, đồng thời giữ quan hệ với động từ chính ‘nói’.
- source_word: τινας δύο τῶν ἑκατονταρχῶν
  choice: hai viên đại đội trưởng
  rationale: τινας δύο trong ngữ cảnh này tự nhiên nhất là ‘hai’; ἑκατοντάρχης chỉ sĩ quan La Mã chỉ huy khoảng một trăm quân. ‘Đại đội trưởng’ là cách gọi dễ hiểu trong tiếng Việt hiện đại.
- source_word: Ἑτοιμάσατε
  choice: Hãy chuẩn bị
  rationale: Mệnh lệnh trực tiếp, trang trọng và tự nhiên trong ngữ cảnh quân sự.
- source_word: στρατιώτας διακοσίους
  choice: hai trăm bộ binh
  rationale: Trong danh sách phân biệt với kỵ binh và một loại quân khác, ‘bộ binh’ truyền đạt rõ đây là lính đi bộ.
- source_word: ὅπως πορευθῶσιν
  choice: để đi
  rationale: Giữ ý mục đích của ὅπως với động từ giả định mà không làm câu tiếng Việt nặng nề.
- source_word: ἕως Καισαρείας
  choice: đến tận Sê-sa-rê
  rationale: ‘Đến tận’ bảo lưu sắc thái giới hạn hành trình ‘cho đến Sê-sa-rê’ của ἕως.
- source_word: ἱππεῖς ἑβδομήκοντα
  choice: bảy mươi kỵ binh
  rationale: Thuật ngữ quân sự ngắn gọn, hiện đại và chính xác cho lực lượng cưỡi ngựa.
- source_word: δεξιολάβους διακοσίους
  choice: hai trăm lính cầm giáo
  rationale: δεξιολάβος là từ hiếm và nghĩa chính xác còn bất định. ‘Lính cầm giáo’ phù hợp bối cảnh quân sự, nhưng sự bất định được nêu trong chú thích.
- source_word: ἀπὸ τρίτης ὥρας τῆς νυκτός
  choice: khởi hành từ giờ thứ ba ban đêm
  rationale: ἀπό mang nghĩa ‘từ’, chỉ thời điểm bắt đầu. Thêm ‘khởi hành’ làm rõ quan hệ cú pháp trong tiếng Việt mà vẫn giữ cách tính giờ cổ.
