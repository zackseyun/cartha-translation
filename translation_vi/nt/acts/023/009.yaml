id: ACT.23.9
reference: Acts 23:9
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐγένετο δὲ κραυγὴ μεγάλη, καὶ ἀναστάντες ⸂τινὲς τῶν γραμματέων⸃ τοῦ μέρους τῶν Φαρισαίων διεμάχοντο λέγοντες· Οὐδὲν κακὸν εὑρίσκομεν ἐν τῷ ἀνθρώπῳ τούτῳ· εἰ δὲ πνεῦμα ἐλάλησεν αὐτῷ ἢ ⸀ἄγγελος—
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/009.yaml
  text: Then a great outcry arose[a], and some of the scribes of the party of the Pharisees stood up and contended, saying, “We find nothing wrong in this man[b]. But if a spirit or an angel has spoken to him—”
translation:
  language: vi
  text: 'Bấy giờ, một tiếng hò hét lớn nổi lên, và một số thầy thông giáo thuộc phe Pha-ri-si đứng dậy, tranh luận quyết liệt rằng: “Chúng tôi không thấy người này có điều gì sai trái. Nhưng nếu một thần linh hoặc một thiên sứ đã nói với ông ấy thì—”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Câu nói kết thúc đột ngột như trong bản Hy Lạp.
    reason: abrupt_ending
lexical_decisions:
- source_word: κραυγὴ μεγάλη
  choice: một tiếng la ó lớn
  rationale: Diễn đạt tự nhiên một tiếng kêu la tập thể hoặc sự náo động lớn, đồng thời giữ cấu trúc danh từ và tính từ của Hy Lạp.
- source_word: ἀναστάντες
  choice: đứng dậy
  rationale: Giữ nghĩa hành động cụ thể, có lẽ chỉ việc đứng lên để phát biểu giữa hội đồng.
- source_word: τινὲς τῶν γραμματέων
  choice: một số kinh luật gia
  rationale: Trong bối cảnh lãnh đạo Do Thái, γραμματεῖς là những người thông thạo và giải thích Kinh Luật; “kinh luật gia” rõ nghĩa hơn cho độc giả Việt hiện đại.
- source_word: τοῦ μέρους τῶν Φαρισαίων
  choice: thuộc phe Pha-ri-si
  rationale: μέρος ở đây chỉ một phe hoặc nhóm trong hội đồng; cách dịch này rõ ràng và tự nhiên.
- source_word: διεμάχοντο
  choice: tranh luận quyết liệt
  rationale: Truyền đạt tính kéo dài và gay gắt của động từ ở thì chưa hoàn thành.
- source_word: Οὐδὲν κακὸν εὑρίσκομεν
  choice: Chúng tôi không thấy ... có điều gì sai trái
  rationale: Phù hợp ngữ cảnh xem xét lỗi hoặc hành vi đáng trách mà không làm κακόν nặng thành “điều ác”.
- source_word: ἐν τῷ ἀνθρώπῳ τούτῳ
  choice: người này có
  rationale: Chuyển cấu trúc Hy Lạp sang cách nói tiếng Việt tự nhiên, vẫn chỉ rõ Phao-lô.
- source_word: εἰ δὲ
  choice: Nhưng nếu
  rationale: Giữ sát liên từ và điều kiện của nguyên văn, đồng thời hỗ trợ việc bảo tồn câu nói bỏ lửng.
- source_word: πνεῦμα
  choice: một thần linh
  rationale: Trong thế đối sánh với “thiên sứ”, từ này nhiều khả năng chỉ một hữu thể linh giới nói chung; mạo từ bất định tránh đồng nhất chắc chắn với Đức Thánh Linh.
- source_word: ἐλάλησεν αὐτῷ
  choice: đã nói với ông ấy
  rationale: Thể hiện một hành động có thể đã xảy ra; “ông ấy” là đại từ tự nhiên chỉ Phao-lô trong lời nói trực tiếp.
- source_word: ἄγγελος
  choice: một thiên sứ
  rationale: Ngữ cảnh siêu nhiên cho thấy đây là thiên sứ, không phải sứ giả loài người.
theological_decisions:
- issue: Ý nghĩa của πνεῦμα khi đặt cạnh ἄγγελος
  choice: một thần linh, tức một hữu thể linh giới nói chung
  alternative: Đức Thánh Linh
  rationale: Cặp “thần linh hoặc thiên sứ” phản ánh các phạm trù hữu thể linh giới và không buộc phải xác định πνεῦμα là Đức Thánh Linh; cách dịch giữ nguyên sự không xác định của lời nói.
- issue: Mệnh đề cuối bị bỏ lửng
  choice: Giữ câu chưa hoàn tất bằng dấu gạch ngang dài
  alternative: 'Hoàn chỉnh thành câu hỏi: “Nếu một thần linh hoặc một thiên sứ đã nói với ông ấy thì sao?”'
  rationale: Bản Hy Lạp kết thúc đột ngột sau “thiên sứ”; không thêm phần kết luận giúp bảo tồn hình thức và sức căng của nguyên văn.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “kinh luật gia” để làm rõ chức năng của γραμματεῖς trong bối cảnh Do Thái; dùng “Pha-ri-si” và “thiên sứ” theo lối thuật ngữ Kinh Thánh quen thuộc. Dấu [a] được đặt ngay sau câu trích dẫn bỏ lửng.
