  text: ἦσαν δὲ πλείους τεσσεράκοντα οἱ ταύτην τὴν συνωμοσίαν ⸀ποιησάμενοι·
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/013.yaml
  text: There were more than forty who had formed this conspiracy[a].
translation:
  language: vi
  text: Có hơn bốn mươi người đã lập âm mưu này.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πλείους τεσσεράκοντα
  choice: hơn bốn mươi người
  rationale: Cụm so sánh đi với số từ có nghĩa là “hơn bốn mươi.” Tiếng Việt cần danh từ chỉ người để câu tự nhiên; “người” được xác định rõ từ mạo từ kèm phân từ chỉ nhóm người ở phần sau.
- source_word: συνωμοσίαν
  choice: âm mưu
  rationale: Danh từ này chỉ một sự cấu kết hoặc kế hoạch bí mật. “Âm mưu” là cách diễn đạt tự nhiên, chính xác trong tiếng Việt và không thêm chi tiết về lời thề từ ngữ cảnh trước.
- source_word: ποιησάμενοι
  choice: đã lập
  rationale: Phân từ aorist trung gian của ποιέω kết hợp với συνωμοσίαν mang nghĩa đã tạo nên hoặc thiết lập âm mưu; “đã lập âm mưu” là kết hợp từ tự nhiên trong tiếng Việt.
- source_word: ἦσαν δὲ
  choice: Có
  rationale: Dạng tồn tại được chuyển tự nhiên bằng “Có.” Liên từ δέ chỉ nối ý nhẹ và không nhất thiết phải dịch thành một từ riêng trong tiếng Việt.
- source_word: οἱ ταύτην τὴν συνωμοσίαν ποιησάμενοι
  choice: người đã lập âm mưu này
  rationale: Mạo từ đi với phân từ tạo thành cụm danh hóa, chỉ những người đã thực hiện hành động. Mệnh đề quan hệ tiếng Việt truyền đạt rõ và tự nhiên chức năng ấy.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Không giữ chú thích tiếng Anh “Or ‘over forty’” vì hai cách diễn đạt tiếng Anh đều tương ứng tự nhiên với cùng một cách dịch tiếng Việt là “hơn bốn mươi”; chú thích đó không biểu thị một khác biệt thực sự trong tiếng Việt.
