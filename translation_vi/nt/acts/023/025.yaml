translation:
  language: vi
  text: Ông viết một bức thư với nội dung như sau:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc dịch sát hơn: “Ông viết một bức thư có dạng như thế này.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: γράψας
  choice: Ông viết
  rationale: Phân từ bất định quá khứ của γράφω chỉ hành động soạn thư của vị chỉ huy trong câu trước. Dùng động từ hữu hạn giúp lời kể tiếng Việt tự nhiên mà không làm thay đổi chủ thể hay diễn tiến.
- source_word: ἐπιστολὴν
  choice: một bức thư
  rationale: ἐπιστολή là một văn bản liên lạc; “bức thư” rõ ràng và tự nhiên trong tiếng Việt hiện đại.
- source_word: ἔχουσαν
  choice: có
  rationale: Phân từ hiện tại bổ nghĩa cho ἐπιστολήν. “Có” giữ khá sát cấu trúc nguồn và kết hợp tự nhiên với “hình thức như sau”.
- source_word: τύπον
  choice: hình thức
  rationale: τύπος ở đây có thể chỉ hình thức, khuôn mẫu hoặc cách diễn đạt của bức thư. “Hình thức” giữ được độ rộng nghĩa, không thu hẹp thành riêng nội dung hay nguyên văn.
- source_word: τοῦτον
  choice: như sau
  rationale: Đại từ chỉ định này hướng tới phần thư được trích dẫn ngay sau đó. Trong tiếng Việt, “như sau” thể hiện chức năng dẫn nhập ấy một cách tự nhiên.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Bản chính dùng “như sau” để dẫn vào nội dung thư tự nhiên trong tiếng Việt; chú thích giữ phương án gần với đại từ chỉ định của nguyên văn hơn.
