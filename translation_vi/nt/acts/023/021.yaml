reference: Acts 23:21
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: σὺ οὖν μὴ πεισθῇς αὐτοῖς, ἐνεδρεύουσιν γὰρ αὐτὸν ἐξ αὐτῶν ἄνδρες πλείους τεσσεράκοντα, οἵτινες ἀνεθεμάτισαν ἑαυτοὺς μήτε φαγεῖν μήτε πιεῖν ἕως οὗ ἀνέλωσιν αὐτόν, καὶ νῦν ⸂εἰσιν ἕτοιμοι⸃ προσδεχόμενοι τὴν ἀπὸ σοῦ ἐπαγγελίαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/021.yaml
  text: So do not be persuaded by them, for more than forty men from among them are lying in ambush for him, who have bound themselves under a curse neither to eat nor to drink until they have killed him. And now they are ready, waiting for the promise from you.
translation:
  language: vi
  text: Vậy, xin ngài đừng nghe theo họ, vì có hơn bốn mươi người trong số họ đang mai phục ông ấy. Họ đã tự ràng buộc mình bằng lời nguyền[a] rằng sẽ không ăn cũng không uống cho đến khi giết ông ấy. Bây giờ họ đã sẵn sàng, đang chờ lời hứa của ngài[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đã tự ràng buộc mình bằng một lời thề”; cách nói Hy Lạp bao hàm ý họ tự chuốc lấy lời nguyền nếu không thực hiện lời thề.'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “lời hứa từ ngài”. Trong ngữ cảnh, điều này có thể chỉ sự đồng ý hoặc cho phép của ngài.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πεισθῇς
  choice: nghe theo
  rationale: Trong lời cảnh báo này, động từ thụ động mang nghĩa để mình bị thuyết phục hoặc chiều theo đề nghị; “đừng nghe theo họ” là cách nói tự nhiên trong tiếng Việt và giữ đúng lực ngữ cảnh.
- source_word: ἐνεδρεύουσιν
  choice: đang mai phục
  rationale: Giữ hình ảnh cụ thể của việc bí mật nằm chờ để tấn công, thay vì diễn giải rộng thành “âm mưu”.
- source_word: ἐξ αὐτῶν
  choice: trong số họ
  rationale: Cho biết hơn bốn mươi người thuộc nhóm vừa được nhắc đến.
- source_word: ἄνδρες πλείους τεσσεράκοντα
  choice: hơn bốn mươi người
  rationale: Cách diễn đạt tự nhiên, chính xác về số lượng trong tiếng Việt.
- source_word: ἀνεθεμάτισαν ἑαυτοὺς
  choice: đã tự đặt mình dưới lời nguyền
  rationale: Giữ yếu tố tự ràng buộc bằng lời nguyền, tức tự chuốc lấy sự nguyền rủa nếu không thực hiện điều đã thề.
- source_word: μήτε φαγεῖν μήτε πιεῖν
  choice: không ăn không uống
  rationale: Cấu trúc sóng đôi tự nhiên trong tiếng Việt, giữ trọn nội dung lời thề.
- source_word: ἕως οὗ ἀνέλωσιν αὐτόν
  choice: cho đến khi giết được ông ấy
  rationale: ἀναιρέω trong ngữ cảnh này chỉ hành vi giết; “giết được” thể hiện mục tiêu phải hoàn thành trước khi lời kiêng ăn uống chấm dứt.
- source_word: εἰσιν ἕτοιμοι
  choice: họ đã sẵn sàng
  rationale: Diễn đạt trực tiếp trạng thái sẵn sàng hiện tại; “đã” trong tiếng Việt nhấn mạnh rằng sự chuẩn bị nay đã hoàn tất.
- source_word: προσδεχόμενοι
  choice: đang chờ
  rationale: Thể hiện sự chờ đợi có kỳ vọng đối với phản hồi của viên chỉ huy.
- source_word: τὴν ἀπὸ σοῦ ἐπαγγελίαν
  choice: ngài chấp thuận
  rationale: Nghĩa từ vựng sát là “lời hứa từ ngài”, nhưng trong ngữ cảnh đây là sự đồng ý hoặc xác nhận sẽ làm theo yêu cầu; cách dịch này tự nhiên và làm rõ ý quy chiếu mà không thêm nội dung.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải. Dùng “ngài” để người cháu của Phao-lô kính cẩn thưa với viên chỉ huy, và “ông ấy” để chỉ Phao-lô. Câu dài Hy Lạp được tách thành ba câu tiếng Việt nhằm tăng độ rõ ràng mà vẫn giữ quan hệ lập luận và trình tự thông tin.
