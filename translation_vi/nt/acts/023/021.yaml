revisions:
- from: Vậy, xin ngài đừng nghe theo họ, vì có hơn bốn mươi người trong số họ đang mai phục ông ấy. Họ đã tự đặt mình dưới lời nguyền[a], thề không ăn không uống cho đến khi giết được ông ấy. Giờ đây họ đã sẵn sàng, đang chờ ngài chấp thuận[b].
  to: Vậy, xin ngài đừng nghe theo họ, vì có hơn bốn mươi người trong số họ đang mai phục ông ấy. Họ đã tự ràng buộc mình bằng lời nguyền[a] rằng sẽ không ăn cũng không uống cho đến khi giết ông ấy. Bây giờ họ đã sẵn sàng, đang chờ lời hứa của ngài[b].
  rationale: Sửa để bảo toàn cách diễn đạt “lời hứa” của nguyên văn thay vì đưa diễn giải “chấp thuận” vào thân bài. Đồng thời chỉnh cách diễn đạt lời nguyền và bỏ “được” sau “giết” để sát nghĩa và tự nhiên hơn.
