id: ACT.23.5
reference: Acts 23:5
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἔφη τε ὁ Παῦλος· Οὐκ ᾔδειν, ἀδελφοί, ὅτι ἐστὶν ἀρχιερεύς· γέγραπται γὰρ ⸀ὅτι Ἄρχοντα τοῦ λαοῦ σου οὐκ ἐρεῖς κακῶς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/005.yaml
  text: And Paul said, “I did not know, brothers, that he is the high priest; for it is written, ‘You shall not speak evil of a ruler of your people.’”
translation:
  language: vi
  text: 'Phao-lô nói: “Thưa anh em, tôi không biết ông ấy là thầy tế lễ thượng phẩm; vì có lời chép: ‘Ngươi không được nói xấu người lãnh đạo dân mình.’”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Ngươi không được phỉ báng người lãnh đạo dân mình.”'
    reason: Nêu sắc thái mạnh hơn có thể có của κακῶς mà không thu hẹp nghĩa trong chính văn.
lexical_decisions:
- source_word: ἔφη τε ὁ Παῦλος
  choice: Phao-lô nói
  rationale: τέ nối nhẹ với mạch kể; tiếng Việt không cần dịch thành một liên từ riêng ở đây, còn ἔφη được diễn đạt tự nhiên bằng “nói” để dẫn lời trực tiếp.
- source_word: Οὐκ ᾔδειν
  choice: tôi không biết
  rationale: Diễn đạt trực tiếp ý không biết/không nhận biết, đồng thời không quyết định nguyên nhân vì sao Phao-lô không biết.
- source_word: ἀδελφοί
  choice: thưa anh em
  rationale: Giữ dạng xưng hô giống đực số nhiều trong bối cảnh Phao-lô nói với hội đồng; thêm “thưa” để lời gọi tự nhiên và trang trọng trong tiếng Việt.
- source_word: ὅτι ἐστὶν ἀρχιερεύς
  choice: ông ấy là thầy tế lễ thượng phẩm
  rationale: Giữ thì hiện tại của ἐστίν bằng “là”; “ông ấy” phù hợp với ngữ cảnh quy chiếu đến người vừa được nói tới, còn “thầy tế lễ thượng phẩm” là cách gọi chức vụ rõ ràng, quen thuộc.
- source_word: γέγραπται γὰρ
  choice: vì có lời chép
  rationale: Công thức trích dẫn Kinh Thánh được chuyển sang lối Việt trang trọng, quen thuộc, bảo toàn ý văn bản đã được chép và có thẩm quyền.
- source_word: Ἄρχοντα τοῦ λαοῦ σου
  choice: người lãnh đạo dân mình
  rationale: ἄρχων chỉ người cai trị hoặc lãnh đạo; “người lãnh đạo” dễ hiểu và không thu hẹp vào một chức danh cụ thể. Đại từ phản thân “mình” diễn đạt tự nhiên quan hệ với “dân của ngươi” trong câu mệnh lệnh.
- source_word: οὐκ ἐρεῖς κακῶς
  choice: Ngươi không được nói xấu
  rationale: Thì tương lai mang chức năng cấm lệnh; “không được” thể hiện lực mệnh lệnh. “Nói xấu” bảo toàn nghĩa rộng của κακῶς và dễ hiểu trong tiếng Việt hiện đại.
theological_decisions:
- issue: Ý nghĩa việc Phao-lô nói mình không biết
  choice: Giữ nguyên “tôi không biết” mà không giải thích thêm
  alternative: Diễn giải là không nhận ra, không biết người ấy giữ chức vụ, hoặc nói mỉa
  rationale: Nguyên văn không nêu lý do hay sắc thái chủ ý; bản dịch không nên giải quyết một căng thẳng diễn giải mà câu Hy Lạp để ngỏ.
- issue: Thì của ἐστὶν trong lời Phao-lô
  choice: ông ấy là thầy tế lễ thượng phẩm
  alternative: ông ấy là người từng làm thầy tế lễ thượng phẩm
  rationale: Giữ giá trị hiện tại của ἐστίν và tránh đưa vào bản dịch một nhận định lịch sử-thần học không có trong câu.
- issue: Cách trình bày lời trích Kinh Thánh
  choice: 'vì có lời chép: “Ngươi không được nói xấu người lãnh đạo dân mình.”'
  alternative: vì Kinh Thánh nói hoặc “Ngươi không được phỉ báng…”
  rationale: “Có lời chép” bảo toàn công thức viện dẫn; động từ chính được giữ đủ rộng, còn sắc thái mạnh hơn được nêu ở chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Thưa anh em” phù hợp lời phát biểu trước hội đồng; “ngươi” được giữ trong lời trích luật pháp để biểu thị ngôi số ít và sắc thái Kinh Thánh, trong khi phần lời kể dùng cách diễn đạt tự nhiên hiện nay.
