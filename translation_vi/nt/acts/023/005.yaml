  terminology: “Thầy tế lễ thượng phẩm” là thuật ngữ Kinh Thánh tiếng Việt đã được nhận biết rộng rãi cho ἀρχιερεύς. “Người lãnh đạo” giữ phạm vi của ἄρχων mà không áp đặt một chức danh chính trị cụ thể. Chú thích “phỉ báng” nêu được một cách dịch mạnh hơn cho κακῶς mà không thay thế cách diễn đạt rộng, dễ hiểu của chính văn.
