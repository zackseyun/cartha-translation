base_translation:
  language: en
  yaml_path: translation/nt/acts/023/035.yaml
  text: “I will hear your case,” he said[b][a], “when your accusers also arrive.” And he ordered that he be kept under guard in Herod’s praetorium.
translation:
  language: vi
  text: 'Ông nói: “Ta sẽ xét vụ của ngươi[a] khi những người tố cáo ngươi cũng đến.” Rồi ông ra lệnh canh giữ Phao-lô trong dinh Hê-rốt.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Ta sẽ nghe ngươi trình bày đầy đủ.” Động từ Hy Lạp có thể chỉ việc nghe một người nói hết; trong bối cảnh này, đó là việc chính thức xét vụ kiện.'
    reason: lexical_alternative
  - marker: b
    text: “Dinh Hê-rốt” chỉ dinh thự hoặc trụ sở chính thức của tổng đốc La Mã; tại đây có lẽ là cung điện của Hê-rốt ở Sê-sa-rê, lúc ấy được tổng đốc sử dụng.
    reason: cultural_note
lexical_decisions:
- source_word: Διακούσομαί σου
  choice: Ta sẽ xét vụ của ngươi
  rationale: Động từ διακούω có thể mang nghĩa nghe hết, nghe kỹ; trong ngữ cảnh pháp lý, “xét vụ của ngươi” diễn đạt tự nhiên việc viên tổng đốc sẽ chính thức nghe và xem xét vụ kiện, đồng thời không buộc phải thêm “đầy đủ” vào chính văn.
- source_word: ὅταν καὶ οἱ κατήγοροί σου παραγένωνται
  choice: khi những người tố cáo ngươi cũng đến
  rationale: ὅταν với động từ giả định chỉ một tình huống tương lai; καί được giữ bằng “cũng”, còn κατήγοροί là những người đưa lời buộc tội trong bối cảnh pháp lý.
- source_word: κελεύσας
  choice: Rồi ông truyền
  rationale: Phân từ bất định quá khứ được chuyển thành động từ hữu hạn để câu kể tự nhiên, thể hiện hành động tiếp theo của Phê-lít.
- source_word: ἐν τῷ πραιτωρίῳ τοῦ Ἡρῴδου
  choice: trong dinh tổng đốc của Hê-rốt
  rationale: πραιτώριον ở đây là dinh thự hoặc trụ sở chính thức của tổng đốc La Mã, thuộc quần thể cung điện do Hê-rốt xây tại Sê-sa-rê. Cách dịch chức năng dễ hiểu hơn việc phiên âm thuật ngữ.
- source_word: φυλάσσεσθαι αὐτόν
  choice: giữ Phao-lô dưới sự canh giữ
  rationale: Thể bị động chỉ việc bị lưu giữ có lính canh, chưa nhất thiết là hình phạt tù. Dùng tên Phao-lô để xác định rõ đại từ trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại. Đại từ “ta/ngươi” phản ánh lời của quan chức cấp cao nói với người đang bị tạm giữ. Thuật ngữ pháp lý được diễn đạt rõ ràng cho độc giả phổ thông; tên Phao-lô được nêu thay đại từ để tránh mơ hồ.
