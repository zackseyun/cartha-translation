revisions:
- from: 'Ông nói: “Ta sẽ xét vụ của ngươi[a] khi những người tố cáo ngươi cũng đến.” Rồi ông truyền giữ Phao-lô dưới sự canh giữ trong dinh tổng đốc của Hê-rốt.[b]'
  to: 'Ông nói: “Ta sẽ xét vụ của ngươi[a] khi những người tố cáo ngươi cũng đến.” Rồi ông ra lệnh canh giữ Phao-lô trong dinh Hê-rốt.[b]'
  rationale: Sửa cách diễn đạt mệnh lệnh canh giữ để tiếng Việt tự nhiên và không lặp nghĩa. Đổi “dinh tổng đốc của Hê-rốt” thành “dinh Hê-rốt” để phản ánh trực tiếp bổ ngữ sở hữu trong nguyên ngữ và để chú thích giải thích chức năng praetorium trong bối cảnh lịch sử.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T10:22:10Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch truyền đạt đúng trình tự và ý pháp lý của câu: viên tổng đốc sẽ xét/nghe vụ việc sau khi những người tố cáo đến, rồi ra lệnh canh giữ Phao-lô. “Xét vụ của ngươi” là cách diễn đạt phù hợp cho Διακούσομαί σου trong văn cảnh xét xử, dù sắc thái “nghe cho hết” được giữ ở chú thích. Tuy nhiên, “dinh tổng đốc của Hê-rốt” dễ gây hiểu là dinh thuộc về một tổng đốc tên Hê-rốt, trong khi nguyên ngữ nói đến πραιτώριον τοῦ Ἡρῴδου, tức dinh/cung Hê-rốt đang được dùng làm trụ sở tổng đốc.'
  naturalness: Cụm “truyền giữ Phao-lô dưới sự canh giữ” vừa không tự nhiên vừa lặp nghĩa giữa “giữ” và “canh giữ”. “Ra lệnh canh giữ Phao-lô” rõ ràng, tự nhiên, và vẫn diễn đạt đúng mệnh lệnh về việc giam giữ có lính canh.
  terminology: Giữ “xét vụ của ngươi,” “những người tố cáo,” và tên Hê-rốt/Sê-sa-rê nhất quán. Dùng “dinh Hê-rốt” trong chính văn tránh sự nhập nhằng lịch sử; chú thích giải thích đây là trụ sở hoặc dinh thự chính thức của tổng đốc La Mã, có lẽ là cung điện Hê-rốt tại Sê-sa-rê.
  issues:
  - severity: medium
    issue: Cụm “truyền giữ Phao-lô dưới sự canh giữ” lặp nghĩa và gượng tiếng Việt.
    rationale: φυλάσσεσθαι chỉ việc bị canh giữ/lưu giữ. “Ra lệnh canh giữ Phao-lô” chuyển cấu trúc bị động Hy Lạp sang tiếng Việt tự nhiên mà không thêm ý phạt tù.
  - severity: low
    issue: “Dinh tổng đốc của Hê-rốt” có thể gây nhập nhằng về quan hệ sở hữu/chức danh.
    rationale: τοῦ Ἡρῴδου xác định dinh này là của Hê-rốt; πραιτώριον mô tả chức năng hành chính hiện thời. “Dinh Hê-rốt” trong chính văn, cùng chú thích văn hóa, thể hiện rõ hơn mà không áp đặt chi tiết ngoài câu.
