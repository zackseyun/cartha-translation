source:
  edition: SBLGNT
  text: οἵτινες εἰσελθόντες εἰς τὴν Καισάρειαν καὶ ἀναδόντες τὴν ἐπιστολὴν τῷ ἡγεμόνι παρέστησαν καὶ τὸν Παῦλον αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/033.yaml
  text: When they entered Caesarea and delivered the letter to the governor[b][a], they also presented Paul to him.
translation:
  language: vi
  text: Khi vào Sê-sa-rê, họ trao thư cho tổng đốc và đưa Phao-lô ra trước mặt ông.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἵτινες
  choice: họ
  rationale: Đại từ này quy chiếu về nhóm quân hộ tống ở câu trước; tiếng Việt dùng “họ” tự nhiên và rõ nghĩa.
- source_word: εἰσελθόντες εἰς τὴν Καισάρειαν
  choice: khi vào thành Sê-sa-rê
  rationale: Phân từ bất định diễn tả hành động xảy ra trước các động từ chính; cấu trúc “khi vào” truyền đạt quan hệ thời gian tự nhiên.
- source_word: ἀναδόντες τὴν ἐπιστολήν
  choice: trao thư
  rationale: Trong bối cảnh chuyển công văn cho một viên chức, “trao thư” vừa trang trọng vừa không thêm ý ngoài nguyên văn.
- source_word: τῷ ἡγεμόνι
  choice: cho tổng đốc
  rationale: “Tổng đốc” là cách gọi quen thuộc trong tiếng Việt dành cho viên chức La Mã cai quản tỉnh ở đây.
- source_word: παρέστησαν καὶ τὸν Παῦλον αὐτῷ
  choice: rồi cũng trình Phao-lô trước mặt ông
  rationale: “Trình ... trước mặt” phù hợp bối cảnh chính thức và pháp lý; “cũng” thể hiện giá trị bổ sung của καί, còn “ông” quy chiếu về tổng đốc.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ nhịp kể cô đọng của nguyên văn; thêm “thành” trước địa danh để câu tiếng Việt tự nhiên, và dùng “rồi cũng” để làm rõ trình tự cùng quan hệ bổ sung giữa hai hành động.
