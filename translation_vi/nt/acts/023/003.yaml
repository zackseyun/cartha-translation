  - severity: low
    issue: “Ra lệnh đánh tôi” có thể không biểu đạt rõ thể bị động của τύπτεσθαι.
    rationale: Cụm này có thể được hiểu theo cách rút gọn là ra lệnh để ai đó đánh Phao-lô, nhưng “ra lệnh phải đánh tôi” làm rõ rằng Phao-lô là người bị đánh mà không thêm chi tiết về người thi hành.
  - severity: low
