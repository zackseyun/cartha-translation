  to: 'Bấy giờ, Phao-lô nói với ông ấy: “Đức Chúa Trời sắp đánh ông[a], hỡi bức tường quét vôi! Ông ngồi xét xử tôi theo luật pháp, thế mà lại vi phạm luật pháp khi ra lệnh phải đánh tôi sao?”'
