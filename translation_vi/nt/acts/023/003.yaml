  text: τότε ὁ Παῦλος πρὸς αὐτὸν εἶπεν· Τύπτειν σε μέλλει ὁ θεός, τοῖχε κεκονιαμένε· καὶ σὺ κάθῃ κρίνων με κατὰ τὸν νόμον, καὶ παρανομῶν κελεύεις με τύπτεσθαι;
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/003.yaml
  text: Then Paul said to him[a], “God is about to strike you, you whitewashed wall! And do you sit judging me according to the law, and yet in violation of the law command me to be struck?”
translation:
  language: vi
  text: 'Bấy giờ, Phao-lô nói với ông ấy: “Đức Chúa Trời sắp đánh ông[a], hỡi bức tường quét vôi! Ông ngồi xét xử tôi theo luật pháp, thế mà lại vi phạm luật pháp khi ra lệnh phải đánh tôi sao?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Đức Chúa Trời sẽ đánh ông.” Nguyên văn Hy Lạp nói sát nghĩa là “Đức Chúa Trời sắp đánh ông”, có thể nhấn mạnh rằng việc ấy gần xảy ra.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τύπτειν σε μέλλει ὁ θεός
  choice: Đức Chúa Trời sắp đánh ông
  rationale: Cấu trúc μέλλει với động từ nguyên mẫu diễn tả hành động sắp xảy đến; “sắp đánh” giữ được sắc thái cận kề và tự nhiên trong tiếng Việt.
- source_word: τοῖχε κεκονιαμένε
  choice: hỡi bức tường quét vôi
  rationale: Giữ nguyên hình ảnh ẩn dụ gay gắt của nguyên văn; “quét vôi” gợi vẻ ngoài sạch đẹp che phủ thực trạng bên trong.
- source_word: κάθῃ
  choice: ông ngồi đó
  rationale: Giữ động từ cụ thể “ngồi” và thêm “đó” để lời chất vấn có sức nặng tự nhiên trong tiếng Việt.
- source_word: κρίνων με κατὰ τὸν νόμον
  choice: xét xử tôi theo luật pháp
  rationale: “Theo luật pháp” diễn đạt việc lấy luật làm chuẩn mực xét xử, đồng thời duy trì văn phong pháp lý.
- source_word: παρανομῶν
  choice: vi phạm luật pháp
  rationale: Diễn đạt hành động trái luật và giữ sự tương phản trực tiếp với “theo luật pháp” ở vế trước.
- source_word: κελεύεις με τύπτεσθαι
  choice: ra lệnh đánh tôi
  rationale: Cách nói tự nhiên trong tiếng Việt, vẫn truyền đạt rõ Phao-lô là người phải chịu đánh theo mệnh lệnh.
- source_word: τότε ὁ Παῦλος πρὸς αὐτὸν εἶπεν
  choice: Bấy giờ, Phao-lô nói với ông ấy
  rationale: Bám sát lời dẫn chuyện, không thêm ý giải thích ngoài nguyên văn.
theological_decisions:
- issue: Tính chất của lời “Đức Chúa Trời sắp đánh ông”
  choice: Trình bày như một lời tuyên bố về hành động sắp xảy đến của Đức Chúa Trời
  alternative: 'Diễn đạt như lời cầu rủa hoặc ước nguyện: “Nguyện Đức Chúa Trời đánh ông”'
  rationale: μέλλει + động từ nguyên mẫu tự nhiên nhất là một lời khẳng định về điều sắp xảy ra, không phải thể cầu chúc. Bản dịch không phán xét thêm về tính đúng sai trong phản ứng của Phao-lô.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Đại từ “ông” phù hợp với lời đối đáp trực diện; câu hỏi cuối giữ sắc thái trách cứ mạnh và sự đối lập pháp lý trong nguyên văn.
