  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Γνοὺς δὲ ὁ Παῦλος ὅτι τὸ ἓν μέρος ἐστὶν Σαδδουκαίων τὸ δὲ ἕτερον Φαρισαίων ⸀ἔκραζεν ἐν τῷ συνεδρίῳ· Ἄνδρες ἀδελφοί, ἐγὼ Φαρισαῖός εἰμι, υἱὸς ⸀Φαρισαίων· περὶ ἐλπίδος καὶ ἀναστάσεως νεκρῶν ⸀ἐγὼ κρίνομαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/006.yaml
  text: But Paul[a], knowing that one part were Sadducees and the other Pharisees, cried out in the council, “Men, brothers, I am a Pharisee, a son of Pharisees[c][b]. It is concerning the hope and resurrection of the dead that I am being judged.”
translation:
  language: vi
  text: 'Nhưng Phao-lô, biết rằng một phần là người Sa-đu-sê, còn phần kia là người Pha-ri-si, lớn tiếng nói trong Hội đồng[a]: “Thưa các anh em, tôi là người Pha-ri-si, con của những người Pha-ri-si[b]. Tôi đang bị xét xử về niềm hy vọng và sự sống lại của người chết[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “trong Tòa Công luận”. Từ Hy Lạp có thể chỉ cụ thể hội đồng lãnh đạo tối cao của người Do Thái, thường gọi là Sanhedrin.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể hiểu là “con của cha mẹ thuộc phái Pha-ri-si” hoặc “thuộc dòng dõi người Pha-ri-si”.
    reason: alternative_reading
  - marker: c
    text: 'Cũng có thể dịch: “Tôi đang bị xét xử về niềm hy vọng về sự sống lại của người chết.”'
    reason: alternative_reading
lexical_decisions:
- source_word: Γνοὺς δὲ ὁ Παῦλος
  choice: Nhưng khi biết
  rationale: Diễn đạt tự nhiên phân từ bất định quá khứ chỉ hoàn cảnh dẫn đến hành động của Phao-lô; δέ được thể hiện bằng “nhưng” để nối với mạch đối lập.
- source_word: τὸ ἓν μέρος ... τὸ δὲ ἕτερον
  choice: một phần ... còn phần kia
  rationale: Giữ hình ảnh phân chia trong nguyên văn mà vẫn tự nhiên trong tiếng Việt.
- source_word: Σαδδουκαίων / Φαρισαίων
  choice: người Sa-đu-sê / người Pha-ri-si
  rationale: Dùng cách phiên âm quen thuộc trong tiếng Việt cho tên hai phái Do Thái.
- source_word: ἔκραζεν
  choice: lớn tiếng
  rationale: Truyền đạt lời nói công khai với âm lượng mạnh, nhưng tránh sắc thái quá khẩu ngữ của “la hét”.
- source_word: ἐν τῷ συνεδρίῳ
  choice: giữa Hội đồng
  rationale: συνέδριον trong ngữ cảnh chỉ hội đồng lãnh đạo Do Thái; “giữa” diễn tả việc phát biểu ngay trong phiên họp. Tên gọi cụ thể được nêu ở chú thích.
- source_word: Ἄνδρες ἀδελφοί
  choice: Thưa anh em
  rationale: Lời xưng hô kính trọng, tự nhiên trong tiếng Việt; “anh em” chuyển tải lời gọi những người nam cùng dân tộc mà không tạo cấu trúc gượng ép.
- source_word: Φαρισαῖός εἰμι
  choice: tôi là người Pha-ri-si
  rationale: Giữ nguyên lời tự nhận ở thì hiện tại.
- source_word: υἱὸς Φαρισαίων
  choice: con của những người Pha-ri-si
  rationale: Giữ số nhiều và ẩn dụ gia hệ của tiếng Hy Lạp, không quyết định đó là cha mẹ hay dòng dõi rộng hơn.
- source_word: περὶ ἐλπίδος καὶ ἀναστάσεως νεκρῶν
  choice: vì niềm hy vọng và sự sống lại của người chết
  rationale: Giữ phép nối bằng καί giữa “niềm hy vọng” và “sự sống lại,” đồng thời dùng cấu trúc tiếng Việt rõ nghĩa trong bối cảnh xét xử.
- source_word: κρίνομαι
  choice: tôi đang bị xét xử
  rationale: Thể hiện thể bị động và tình trạng tư pháp đang diễn ra của Phao-lô; tự nhiên hơn cách dịch sát chữ “đang bị phán xét”.
theological_decisions:
- issue: Ý nghĩa của υἱὸς Φαρισαίων
  choice: con của những người Pha-ri-si
  alternative: con của cha mẹ thuộc phái Pha-ri-si; thuộc dòng dõi người Pha-ri-si
  rationale: Nguyên văn số nhiều có thể chỉ cha mẹ, tổ tiên, hoặc căn tính truyền đời; bản dịch chính giữ thành ngữ gia hệ và chú thích bảo tồn các khả năng.
- issue: Mối liên hệ giữa “niềm hy vọng” và “sự sống lại”
  choice: niềm hy vọng và sự sống lại của người chết
  alternative: niềm hy vọng về sự sống lại của người chết
  rationale: Tiếng Hy Lạp nối ἐλπίδος và ἀναστάσεως bằng καί. Cách dịch chính bảo tồn cấu trúc phối hợp, còn chú thích nêu khả năng hiểu đó là một niềm hy vọng có nội dung là sự sống lại.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Hội đồng” trong chính văn để minh bạch, kèm thuật ngữ lịch sử ở chú thích; lời xưng hô “Thưa anh em” phù hợp phép lịch sự tiếng Việt. Các điểm mơ hồ về gia hệ Pha-ri-si và quan hệ giữa niềm hy vọng với sự sống lại được giữ lại thay vì giải quyết theo một lập trường thần học.
