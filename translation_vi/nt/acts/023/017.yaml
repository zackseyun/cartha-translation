  text: προσκαλεσάμενος δὲ ὁ Παῦλος ἕνα τῶν ἑκατονταρχῶν ἔφη· Τὸν νεανίαν τοῦτον ⸀ἄπαγε πρὸς τὸν χιλίαρχον, ἔχει γὰρ ⸂ἀπαγγεῖλαί τι⸃ αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/017.yaml
  text: So Paul called one of the centurions and said[a], “Take this young man to the commander, for he has something to report to him.”
translation:
  language: vi
  text: 'Phao-lô gọi một viên đội trưởng đến và nói: “Hãy đưa người thanh niên này đến gặp viên chỉ huy, vì anh ấy có điều muốn báo cho ông.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: gọi ... đến
  rationale: Diễn đạt tự nhiên hành động gọi một người đến với mình, đồng thời phản ánh sắc thái của động từ trung cách προσκαλέομαι.
- source_word: δὲ
  choice: không dịch riêng
  rationale: δέ chủ yếu đánh dấu bước tiếp theo trong mạch kể; tiếng Việt chuyển ý tự nhiên mà không cần thêm một liên từ dễ làm câu nặng nề.
- source_word: ἕνα τῶν ἑκατονταρχῶν
  choice: một viên đội trưởng
  rationale: ἑκατοντάρχης là sĩ quan La Mã chỉ huy khoảng một trăm quân; “viên đội trưởng” vừa dễ hiểu vừa giữ sắc thái quân sự lịch sử.
- source_word: ἔφη
  choice: nói
  rationale: Cách dịch trực tiếp, tự nhiên của động từ dẫn lời φημί.
- source_word: νεανίαν
  choice: người thanh niên
  rationale: Phản ánh νεανίας là một nam giới trẻ tuổi, với văn phong trang trọng nhưng hiện đại.
- source_word: ἄπαγε
  choice: Hãy đưa
  rationale: Mệnh lệnh của ἀπάγω trong ngữ cảnh này yêu cầu dẫn người thanh niên đến chỗ một người khác; “đưa” là cách nói tự nhiên trong tiếng Việt.
- source_word: πρὸς τὸν χιλίαρχον
  choice: đến gặp viên chỉ huy
  rationale: χιλίαρχος chỉ viên sĩ quan chỉ huy, trong bối cảnh La Mã là một quân đoàn trưởng; “viên chỉ huy” dễ hiểu hơn thuật ngữ kỹ thuật, còn “đến gặp” diễn đạt tự nhiên hướng đến một người.
- source_word: ἔχει γὰρ ἀπαγγεῖλαί τι αὐτῷ
  choice: vì anh ấy có điều muốn báo cho ông
  rationale: Cấu trúc ἔχει + động từ nguyên mẫu cho biết có điều cần làm hoặc nói; ἀπαγγέλλω ở đây mang nghĩa trình báo hoặc truyền đạt thông tin. Đại từ “anh ấy” và “ông” làm rõ hai đối tượng theo cách tự nhiên mà không thêm nội dung.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Giữ chức danh quân sự ở mức phổ thông; không dùng thuật ngữ Hán-Việt quá chuyên biệt. Không cần chú thích vì “báo” chuyển tải phù hợp phạm vi nghĩa của ἀπαγγέλλω trong ngữ cảnh.
