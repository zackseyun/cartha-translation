source:
  edition: SBLGNT
  text: ἐπιλαβόμενος δὲ τῆς χειρὸς αὐτοῦ ὁ χιλίαρχος καὶ ἀναχωρήσας κατ’ ἰδίαν ἐπυνθάνετο· Τί ἐστιν ὃ ἔχεις ἀπαγγεῖλαί μοι;
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/019.yaml
  text: So the commander took him by the hand and[a], drawing aside in private, began asking[b], “What is it that you have to report to me?”
translation:
  language: vi
  text: 'Viên chỉ huy nắm lấy tay cậu, rồi đưa cậu ra một chỗ riêng và hỏi: “Cậu có việc gì cần báo cho tôi?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιλαβόμενος ... τῆς χειρὸς αὐτοῦ
  choice: nắm lấy tay cậu
  rationale: Cụm động từ với sở hữu cách diễn tả hành động nắm hoặc cầm lấy tay người thanh niên. “Nắm lấy tay cậu” tự nhiên trong tiếng Việt, giữ được hành động cụ thể mà không hàm ý dùng sức quá mức.
- source_word: δὲ
  choice: rồi
  rationale: Ở đây δέ chủ yếu nối tiếp diễn biến câu chuyện. “Rồi” thể hiện trình tự tự nhiên trong tiếng Việt mà không tạo sắc thái đối lập không có trong nguyên văn.
- source_word: ὁ χιλίαρχος
  choice: viên chỉ huy
  rationale: χιλίαρχος là một sĩ quan chỉ huy quân đội La Mã. “Viên chỉ huy” rõ nghĩa, tự nhiên và phù hợp bối cảnh hơn lối phiên âm hoặc một chức danh cổ ít quen thuộc.
- source_word: ἀναχωρήσας κατ’ ἰδίαν
  choice: đưa cậu ra một chỗ riêng
  rationale: ἀναχωρέω diễn tả việc rời ra hoặc lui ra, còn κατ’ ἰδίαν chỉ sự riêng tư. Dù nguyên văn không lặp lại tân ngữ, ngữ cảnh cho thấy viên chỉ huy đưa cậu thanh niên ra khỏi những người khác; cách dịch này diễn đạt tự nhiên điều được hàm ý.
- source_word: ἐπυνθάνετο
  choice: hỏi
  rationale: Thì chưa hoàn thành có thể gợi sắc thái bắt đầu hoặc đang hỏi, nhưng trong tiếng Việt, “hỏi” sau chuỗi hành động kể chuyện truyền đạt tự nhiên mà không cần thêm “bắt đầu”, vốn dễ nặng lời.
- source_word: Τί ἐστιν ὃ ἔχεις ἀπαγγεῖλαί μοι
  choice: Cậu có việc gì cần báo cho tôi?
  rationale: Cách hỏi này chuyển tự nhiên cấu trúc “Điều gì là điều cậu có để báo cho tôi?” của tiếng Hy Lạp. “Báo” giữ sắc thái chuyển đạt thông tin trong bối cảnh quân sự, còn “cần” thể hiện quan hệ của ἔχεις với động từ nguyên mẫu mà không biến nó thành mệnh lệnh bắt buộc.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Đại từ “cậu” phù hợp với người được nhắc đến ở ngữ cảnh gần là một thanh niên, đồng thời lời của viên chỉ huy vẫn không mang sắc thái khinh miệt. Không cần chú thích vì các khác biệt khả dĩ chủ yếu là lựa chọn diễn đạt, không làm thay đổi đáng kể ý nghĩa.
