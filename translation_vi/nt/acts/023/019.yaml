  source_fidelity: 'Bản dịch truyền đạt đúng các yếu tố chính của câu Hy Lạp: viên chỉ huy nắm tay người thanh niên, tách ra chỗ riêng, rồi hỏi người ấy có điều gì để báo. “Rồi” diễn đạt hợp lý chức năng tiếp diễn tự sự của δέ; “cần báo cho tôi” phản ánh tự nhiên cấu trúc ἔχεις + động từ nguyên mẫu và sắc thái ἀπαγγεῖλαι là báo cáo/trình báo.'
  naturalness: Câu văn tự nhiên, rõ ràng và đúng văn phong kể chuyện hiện đại. “Cậu” phù hợp với người thanh niên trong ngữ cảnh trước đó, còn cách xưng “tôi” của viên chỉ huy giữ mức trang trọng vừa phải. “Đưa cậu ra một chỗ riêng” diễn đạt mạch lạc ý hàm ẩn rằng hai người tách khỏi đám đông để nói riêng.
  terminology: “Viên chỉ huy” là cách gọi hiện đại, dễ hiểu và phù hợp cho χιλίαρχος trong ngữ cảnh quân sự La Mã. “Báo” phù hợp với ἀπαγγέλλω hơn cách nói quá thông tục. Không có thuật ngữ thần học hay tên riêng cần điều chỉnh.
