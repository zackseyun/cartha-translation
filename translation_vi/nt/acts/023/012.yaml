id: ACT.23.12
reference: Acts 23:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Γενομένης δὲ ἡμέρας ποιήσαντες ⸂συστροφὴν οἱ Ἰουδαῖοι⸃ ἀνεθεμάτισαν ἑαυτοὺς λέγοντες μήτε φαγεῖν μήτε πιεῖν ἕως οὗ ἀποκτείνωσιν τὸν Παῦλον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/012.yaml
  text: When day came[a], the Jews formed a conspiracy and bound themselves under a curse[b], saying that they would neither eat nor drink until they had killed Paul.
translation:
  language: vi
  text: Khi trời sáng, những người Do Thái[a] lập mưu với nhau và tự đặt mình dưới lời nguyền[b], thề rằng sẽ không ăn cũng không uống cho đến khi giết được Phao-lô.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Trong câu này, “những người Do Thái” chỉ một nhóm người Do Thái cụ thể tham gia âm mưu, không phải toàn thể dân Do Thái.
    reason: cultural_note
  - marker: b
    text: 'Cũng có thể dịch: “tự buộc mình bằng một lời nguyền.” Đây là lời thề trong đó họ tự chuốc lấy sự phán xét nếu không thực hiện điều đã thề.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Γενομένης δὲ ἡμέρας
  choice: Khi trời sáng
  rationale: Cụm sở hữu cách tuyệt đối đánh dấu sự chuyển tiếp về thời gian; cách dịch này tự nhiên trong tiếng Việt và giữ đúng ý khi ngày bắt đầu.
- source_word: ποιήσαντες συστροφὴν
  choice: lập mưu với nhau
  rationale: Trong ngữ cảnh này, cụm từ chỉ sự liên kết có tổ chức nhằm thực hiện âm mưu giết người; cách diễn đạt này tự nhiên hơn 'lập một âm mưu' và không gợi ý một đám đông náo loạn.
- source_word: οἱ Ἰουδαῖοι
  choice: những người Do Thái
  rationale: Giữ nguyên cách gọi của bản Hy Lạp, đồng thời chú thích rằng trong văn cảnh, cụm này chỉ một nhóm người cụ thể chứ không phải toàn thể dân Do Thái.
- source_word: ἀνεθεμάτισαν ἑαυτοὺς
  choice: tự đặt mình dưới lời nguyền
  rationale: Diễn đạt hành động tự nhận lấy sự phán xét nếu không hoàn thành lời thề, giữ được cả sắc thái lời nguyền và sự tự ràng buộc.
- source_word: λέγοντες μήτε φαγεῖν μήτε πιεῖν
  choice: thề rằng sẽ không ăn cũng không uống
  rationale: Động từ phân từ giới thiệu nội dung của sự cam kết; 'thề rằng' làm rõ chức năng trong ngữ cảnh, còn cặp phủ định giữ nguyên hai hành động ăn và uống.
- source_word: ἕως οὗ ἀποκτείνωσιν τὸν Παῦλον
  choice: cho đến khi giết được Phao-lô
  rationale: '''Giết được'' diễn đạt tự nhiên mục tiêu phải hoàn tất trước khi lời thề chấm dứt, không hàm ý rằng âm mưu cuối cùng đã thành công.'
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “lập mưu với nhau” để truyền đạt tính chất đồng lõa có tổ chức; dùng “tự đặt mình dưới lời nguyền” nhằm giữ sắc thái tự nguyền rủa của nguyên ngữ. Tất cả dấu chú thích đều xuất hiện ngay trong chính văn.
