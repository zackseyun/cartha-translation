  terminology: Giữ “Phao-lô,” “Phê-lích,” và “tổng đốc,” là những cách gọi chuẩn, trang trọng và phù hợp bối cảnh hành chính La Mã. “Các con vật để cưỡi” giữ đúng tính không xác định về loài của κτήνη.
