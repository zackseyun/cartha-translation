  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “chuẩn bị sẵn” cho sắc thái thực tiễn của mệnh lệnh, “hộ tống ... an toàn” cho bối cảnh quân sự, đồng thời tránh xác định κτήνη là ngựa.
