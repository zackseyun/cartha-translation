  yaml_path: translation/nt/acts/023/024.yaml
  text: and provide mounts[a], so that they may put Paul on them and bring him safely to Felix the governor[b],
translation:
  language: vi
  text: Cũng hãy chuẩn bị sẵn các con vật để cưỡi[a], để họ đặt Phao-lô lên lưng chúng và đưa ông an toàn đến gặp tổng đốc Phê-lích.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “các súc vật để cưỡi hoặc chở”; từ Hy Lạp không nói rõ đó là loài vật nào.
    reason: lexical_alternative
lexical_decisions:
- source_word: κτήνη
  choice: các con vật để cưỡi
  rationale: κτήνη chỉ chung súc vật dùng để cưỡi hoặc chở, không xác định là ngựa; cách dịch này nêu rõ công dụng mà không thêm loài vật.
- source_word: τε
  choice: cũng
  rationale: τε nối mệnh lệnh này với các chỉ thị trước; “cũng” diễn đạt tự nhiên ý bổ sung trong tiếng Việt.
- source_word: παραστῆσαι
  choice: chuẩn bị sẵn
  rationale: Trong ngữ cảnh mệnh lệnh, động từ nguyên mẫu nói đến việc làm cho các con vật có mặt và sẵn sàng sử dụng.
- source_word: ἵνα
  choice: để
  rationale: ἵνα giới thiệu mục đích; “để” là cách diễn đạt gọn và tự nhiên trong tiếng Việt.
- source_word: ἐπιβιβάσαντες
  choice: đưa Phao-lô lên
  rationale: Phân từ chỉ việc giúp hoặc đặt Phao-lô lên các con vật; ghép với động từ chính bằng cấu trúc nối tiếp tự nhiên, vẫn bảo toàn trình tự hành động.
- source_word: διασώσωσι
  choice: hộ tống ông an toàn
  rationale: διασώσωσι nhấn mạnh việc đưa người đi qua nguy hiểm và đến nơi an toàn; “hộ tống ... an toàn” phù hợp với bối cảnh quân lính áp giải bảo vệ.
- source_word: πρὸς
  choice: đến với
  rationale: πρός với người làm đích đến diễn tả chuyển động hướng đến người ấy; “đến với” giữ được Phê-lích là người tiếp nhận.
- source_word: ἡγεμόνα
  choice: tổng đốc
  rationale: Trong bối cảnh hành chính La Mã tại Giu-đê, ἡγεμών chỉ viên chức cai trị tỉnh; “tổng đốc” là thuật ngữ tiếng Việt quen thuộc và rõ nghĩa.
theological_decisions: []
