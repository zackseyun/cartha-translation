  verdict: revise
  source_fidelity: 'Bản nháp phản ánh đúng các điểm chính: κτήνη không bị đồng nhất với ngựa, ἵνα giữ ý mục đích, và διασώσωσι diễn tả việc đưa Phao-lô đến nơi bình an. Tuy nhiên, “đưa Phao-lô lên” thiếu bổ ngữ chỉ nơi/đối tượng mà ông được đưa lên, trong khi phân từ ἐπιβιβάσαντες quy chiếu rõ về các κτήνη vừa nêu.'
