base_translation:
  language: en
  yaml_path: translation/nt/acts/023/029.yaml
  text: I found that he was being accused concerning questions of their law[b][a], but charged with nothing deserving death or imprisonment.
translation:
  language: vi
  text: Tôi nhận thấy ông ấy bị tố cáo về các vấn đề thuộc luật pháp của họ[a], nhưng không có cáo buộc nào đáng bị xử tử hoặc bị giam cầm[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “về những vấn đề đang tranh cãi liên quan đến luật pháp của họ.”'
    reason: lexical_alternative
  - marker: b
    text: 'Theo nghĩa đen: “đáng chết hoặc chịu xiềng xích.”'
    reason: lexical_clarification
lexical_decisions:
- source_word: εὗρον
  choice: Tôi nhận thấy
  rationale: Diễn đạt kết luận của viên chỉ huy sau khi xem xét vụ việc; tự nhiên hơn “tôi tìm thấy” trong văn cảnh pháp lý.
- source_word: ἐγκαλούμενον
  choice: bị tố cáo
  rationale: Giữ sắc thái bị động của phân từ và không hàm ý rằng người ấy đã bị kết tội.
- source_word: περὶ ζητημάτων
  choice: về những vấn đề
  rationale: ζητήματα có thể chỉ các câu hỏi đang được bàn cãi hoặc những vấn đề tranh chấp; bản dịch chính giữ cách nói trung tính, còn chú thích nêu sắc thái tranh luận.
- source_word: τοῦ νόμου αὐτῶν
  choice: trong luật pháp của họ
  rationale: Nêu lĩnh vực mà các vấn đề thuộc về và giữ góc nhìn của viên chức La Mã qua đại từ “của họ”.
- source_word: μηδὲν ... ἄξιον θανάτου ἢ δεσμῶν
  choice: không ... điều gì đáng phải chết hay chịu xiềng xích
  rationale: Giữ cấu trúc pháp lý về điều đáng chịu và bảo tồn hình ảnh cụ thể của δεσμά, đồng thời tiếng Việt vẫn rõ nghĩa.
- source_word: ἔχοντα ἔγκλημα
  choice: bị cáo buộc điều gì
  rationale: Diễn đạt tự nhiên ý có một cáo buộc chống lại người ấy mà không biến cáo buộc thành sự có tội đã được xác lập.
