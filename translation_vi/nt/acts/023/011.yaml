id: ACT.23.11
reference: Acts 23:11
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Τῇ δὲ ἐπιούσῃ νυκτὶ ἐπιστὰς αὐτῷ ὁ κύριος εἶπεν· ⸀Θάρσει, ὡς γὰρ διεμαρτύρω τὰ περὶ ἐμοῦ εἰς Ἰερουσαλὴμ οὕτω σε δεῖ καὶ εἰς Ῥώμην μαρτυρῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/011.yaml
  text: But on the following night[a], the Lord stood by him and said, “Take courage, for just as you have testified about me in Jerusalem[b], so you must also testify in Rome.”
translation:
  language: vi
  text: 'Nhưng vào đêm hôm sau, Chúa đứng bên ông và phán: “Hãy vững lòng[a]! Vì bạn đã làm chứng[b] về Ta tại Giê-ru-sa-lem thế nào, thì bạn cũng phải làm chứng tại Rô-ma thể ấy.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “Hãy can đảm.”
    reason: lexical_alternative
  - marker: b
    text: Động từ ở đây cũng có thể mang nghĩa “long trọng làm chứng”; hai động từ chỉ việc Phao-lô đã làm và sẽ làm đều thuộc cùng nhóm từ “làm chứng” trong tiếng Hy Lạp.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τῇ δὲ ἐπιούσῃ νυκτί
  choice: Nhưng vào đêm hôm sau
  rationale: “Đêm hôm sau” diễn đạt tự nhiên thời điểm kế tiếp; “nhưng” giữ lực nối chuyển nhẹ của δέ trong diễn tiến câu chuyện.
- source_word: ἐπιστὰς αὐτῷ
  choice: đứng bên ông
  rationale: Giữ hình ảnh Chúa hiện diện sát bên Phao-lô để nâng đỡ, không diễn giải rộng thành “hiện ra với ông”.
- source_word: ὁ κύριος
  choice: Chúa
  rationale: Cách gọi tự nhiên trong tiếng Việt cho κύριος ở ngữ cảnh này; không thêm “Giê-xu” vì nguyên văn không nêu tên.
- source_word: Θάρσει
  choice: Hãy vững lòng
  rationale: Diễn đạt mệnh lệnh khích lệ một cách tự nhiên, trang trọng và dễ hiểu; “Hãy can đảm” cũng là một khả năng.
- source_word: διεμαρτύρω … μαρτυρῆσαι
  choice: đã làm chứng … phải làm chứng
  rationale: Dùng cùng cụm từ “làm chứng” để giữ mối liên hệ từ vựng giữa hai động từ Hy Lạp, đồng thời diễn đạt hành động đã xảy ra và nhiệm vụ sắp tới.
- source_word: τὰ περὶ ἐμοῦ
  choice: về Ta
  rationale: Diễn đạt gọn và tự nhiên nội dung lời chứng liên quan đến Chúa; viết hoa đại từ theo quy ước văn phong tôn kính.
- source_word: εἰς Ἰερουσαλὴμ … εἰς Ῥώμην
  choice: tại Giê-ru-sa-lem … tại Rô-ma
  rationale: Trong ngữ cảnh với tên thành phố, εἰς chỉ nơi diễn ra hoặc sẽ diễn ra việc làm chứng; “tại” là cách nói tiếng Việt tự nhiên.
- source_word: ὡς … οὕτω
  choice: thế nào … thể ấy
  rationale: Giữ rõ phép đối chiếu giữa lời chứng tại Giê-ru-sa-lem và lời chứng tại Rô-ma.
- source_word: σε δεῖ
  choice: con cũng phải
  rationale: “Phải” truyền đạt sự cần thiết do ý định của Đức Chúa Trời mà không giải thích quá mức thành định mệnh hay tiền định.
theological_decisions:
- issue: Danh tính của ὁ κύριος
  choice: Dịch là “Chúa”, để ngữ cảnh cho thấy đây là Chúa phục sinh đang nói về lời chứng “về Ta”.
  alternative: Dịch rõ thành “Chúa Giê-xu”.
  rationale: Nguyên văn chỉ viết “Chúa”. Không thêm tên “Giê-xu” giúp giữ đúng mức độ tường minh của bản Hy Lạp, trong khi lời nói và văn mạch vẫn chỉ rõ đối tượng.
- issue: Sắc thái của δεῖ
  choice: Dịch là “phải”, biểu thị sự cần thiết.
  alternative: “được định phải” hoặc “nhất định sẽ”.
  rationale: Cách dịch này giữ ý về sự cần thiết trong chương trình của Đức Chúa Trời nhưng không áp đặt một cơ chế thần học mà câu không nói rõ.
- issue: Đại từ trong lời Chúa phán với Phao-lô
  choice: Dùng “con” cho ngôi thứ hai và “Ta” cho người nói.
  alternative: “anh/tôi” hoặc “ngươi/ta”.
  rationale: “Con/Ta” là cách xưng hô hiện đại, trang trọng và dễ hiểu trong lời phán của Chúa với một người thuộc về Ngài; tránh sắc thái cổ của “ngươi” và sắc thái quá ngang hàng của “anh/tôi”.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Câu giữ cấu trúc đối chiếu của nguyên văn và lặp lại “làm chứng” có chủ ý. Tên riêng được phiên âm theo lối quen dùng trong Kinh Thánh tiếng Việt.
