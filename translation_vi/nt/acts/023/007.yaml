  text: τοῦτο δὲ αὐτοῦ ⸀λαλοῦντος ἐγένετο στάσις τῶν Φαρισαίων ⸂καὶ Σαδδουκαίων⸃, καὶ ἐσχίσθη τὸ πλῆθος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/007.yaml
  text: And as he was saying this[a], a dispute arose between the Pharisees and Sadducees[b], and the assembly was divided.
translation:
  language: vi
  text: Trong khi ông đang nói điều ấy, một cuộc tranh luận nổi lên giữa những người Pha-ri-si và những người Sa-đu-sê, và cả hội đồng bị chia rẽ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦτο δὲ αὐτοῦ λαλοῦντος
  choice: Trong khi ông đang nói điều ấy
  rationale: Kết cấu sở hữu cách tuyệt đối với phân từ hiện tại diễn tả hành động đang diễn ra đồng thời; cách dịch này tự nhiên trong tiếng Việt và giữ rõ sắc thái ấy.
- source_word: ἐγένετο
  choice: nổi lên
  rationale: Đi với στάσις, động từ chỉ việc cuộc xung đột bắt đầu phát sinh; “nổi lên” phù hợp với văn kể chuyện hiện đại.
- source_word: στάσις
  choice: một cuộc tranh luận
  rationale: Trong ngữ cảnh, từ này chỉ sự bất đồng hoặc xung đột giữa hai phe; “tranh luận” dễ hiểu và không cường điệu mức độ thành bạo loạn.
- source_word: τῶν Φαρισαίων καὶ Σαδδουκαίων
  choice: giữa những người Pha-ri-si và những người Sa-đu-sê
  rationale: Dùng “giữa” để diễn đạt tự nhiên quan hệ đối lập giữa hai nhóm mà kết cấu sở hữu cách Hy Lạp biểu thị.
- source_word: ἐσχίσθη
  choice: bị chia rẽ
  rationale: Dạng bị động của σχίζω mang hình ảnh bị tách ra; trong ngữ cảnh xã hội, “bị chia rẽ” vừa sát nghĩa vừa tự nhiên.
- source_word: τὸ πλῆθος
  choice: cả hội chúng
  rationale: Chỉ toàn thể nhóm người đang tụ họp trong phiên họp, không đơn thuần là một đám đông ngẫu nhiên; “hội chúng” giữ sắc thái tập thể có tổ chức, còn “cả” thể hiện tính toàn thể của danh từ số ít tập hợp.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Giữ tên hai nhóm theo dạng phiên âm quen thuộc trong Kinh Thánh tiếng Việt; không thêm cách giải thích thần học ngoài nguyên văn.
