id: ACT.23.28
reference: Acts 23:28
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: βουλόμενός ⸀τε ⸀ἐπιγνῶναι τὴν αἰτίαν δι’ ἣν ἐνεκάλουν αὐτῷ, ⸀κατήγαγον εἰς τὸ συνέδριον αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/028.yaml
  text: And wanting to know the charge for which they were accusing him[a], I brought him down to their council.
translation:
  language: vi
  text: Vì muốn biết rõ lý do họ tố cáo ông, tôi đã đưa ông xuống trước hội đồng của họ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “Tòa Công Luận của họ.” Từ Hy Lạp συνέδριον chỉ một hội đồng; trong ngữ cảnh này, rất có thể đó là hội đồng lãnh đạo Do Thái tại Giê-ru-sa-lem.
    reason: lexical_alternative
lexical_decisions:
- source_word: βουλόμενός τε ἐπιγνῶναι
  choice: Vì muốn biết rõ
  rationale: Diễn đạt tự nhiên động cơ của viên chỉ huy; “biết rõ” phản ánh sắc thái nhận biết đầy đủ hoặc chính xác của ἐπιγινώσκω mà không cường điệu.
- source_word: τὴν αἰτίαν δι’ ἣν ἐνεκάλουν αὐτῷ
  choice: lý do họ tố cáo ông
  rationale: Trong ngữ cảnh pháp lý, αἰτία là căn cứ hay lý do buộc tội; cách dịch này giữ quan hệ của δι’ ἣν và sắc thái đang tố cáo của động từ ở thì chưa hoàn thành.
- source_word: κατήγαγον
  choice: tôi đã đưa ông xuống
  rationale: Giữ chi tiết chuyển động xuống trong động từ Hy Lạp và xác định tự nhiên chủ thể ngôi thứ nhất trong văn thư.
- source_word: εἰς τὸ συνέδριον αὐτῶν
  choice: trước hội đồng của họ
  rationale: “Trước hội đồng” là cách nói tiếng Việt tự nhiên khi một người được đưa ra để trình diện; “hội đồng” không thu hẹp συνέδριον thành một tên riêng dù ngữ cảnh có thể chỉ Tòa Công Luận.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và phù hợp với lời tường trình chính thức. Đại từ “ông” dành cho Phao-lô giữ sự tôn trọng và tự nhiên trong tiếng Việt.
