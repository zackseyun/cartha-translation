source:
  edition: SBLGNT
  text: ἀτενίσας δὲ ⸂ὁ Παῦλος τῷ συνεδρίῳ⸃ εἶπεν· Ἄνδρες ἀδελφοί, ἐγὼ πάσῃ συνειδήσει ἀγαθῇ πεπολίτευμαι τῷ θεῷ ἄχρι ταύτης τῆς ἡμέρας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/001.yaml
  text: And Paul[a], looking intently at the council, said, “Brothers, I have lived before God with an entirely good conscience up to this day.”
translation:
  language: vi
  text: 'Phao-lô chăm chú nhìn hội đồng và nói: “Thưa anh em, tôi đã sống trước mặt Đức Chúa Trời với một lương tâm tốt lành trong mọi sự cho đến ngày hôm nay.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀτενίσας
  choice: chăm chú nhìn
  rationale: Diễn đạt ánh nhìn tập trung và kéo dài, đồng thời tự nhiên trong tiếng Việt hiện đại.
- source_word: δὲ
  choice: không dịch thành một liên từ riêng
  rationale: Đây là từ nối nhẹ để tiếp diễn câu chuyện; trong tiếng Việt, lược bỏ giúp câu tự nhiên mà không làm mất quan hệ diễn ngôn.
- source_word: τῷ συνεδρίῳ
  choice: hội đồng
  rationale: Dịch danh từ chung chỉ hội đồng lãnh đạo Do Thái trong ngữ cảnh, thay vì phiên âm mang tính chuyên biệt.
- source_word: Ἄνδρες ἀδελφοί
  choice: Thưa anh em
  rationale: Lối xưng hô kính trọng, tự nhiên, giữ được việc Phao-lô gọi những người nam trong hội đồng là anh em.
- source_word: πάσῃ συνειδήσει ἀγαθῇ
  choice: với một lương tâm hoàn toàn trong sáng
  rationale: Giữ sức nhấn mạnh toàn diện của πάσῃ và diễn đạt phẩm chất ἀγαθῇ theo cách tự nhiên, không hàm ý vô tội tuyệt đối.
- source_word: πεπολίτευμαι
  choice: tôi vẫn sống
  rationale: Thể hoàn thành nhìn lại cách sống kéo dài đến hiện tại; cách dịch này giữ nghĩa rộng về cách hành xử mà không áp đặt sắc thái công dân vào chính văn.
- source_word: τῷ θεῷ
  choice: trước mặt Đức Chúa Trời
  rationale: Diễn đạt đời sống được tiến hành trong mối tương quan với và dưới sự nhìn xem của Đức Chúa Trời, phù hợp với ngữ cảnh nói về lương tâm.
- source_word: ἄχρι ταύτης τῆς ἡμέρας
  choice: cho đến ngày hôm nay
  rationale: Giữ rõ sự liên tục từ quá khứ tới thời điểm phát biểu.
theological_decisions:
- issue: Ý nghĩa lời tự thuật của Phao-lô qua πεπολίτευμαι
  choice: Một lời khẳng định chung về cách ông đã sống trước mặt Đức Chúa Trời với lương tâm trong sáng.
  alternative: “Tôi đã cư xử như một công dân trước mặt Đức Chúa Trời,” nhấn mạnh sắc thái công dân của động từ.
  rationale: Động từ có thể gợi sắc thái công dân, nhưng trong ngữ cảnh trọng tâm là cách sống và lương tâm trước Đức Chúa Trời. Bản dịch không biến lời này thành khẳng định về địa vị công dân hoặc sự hoàn hảo vô tội.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại và dễ hiểu. Dùng “Thưa anh em” cho lời gọi trực tiếp kính trọng; “hội đồng” giữ cách gọi phổ thông; trật tự thời gian được đưa lên đầu mệnh đề phát biểu để câu tiếng Việt trôi chảy.
