- from: 'Phao-lô chăm chú nhìn hội đồng và nói: “Thưa anh em, cho đến ngày hôm nay, tôi vẫn sống trước mặt Đức Chúa Trời với một lương tâm hoàn toàn trong sáng.”'
  to: 'Phao-lô chăm chú nhìn hội đồng và nói: “Thưa anh em, tôi đã sống trước mặt Đức Chúa Trời với một lương tâm tốt lành trong mọi sự cho đến ngày hôm nay.”'
  rationale: Sửa tối thiểu để giữ sát hơn nghĩa ‘lương tâm tốt lành’ và lực bao quát của πάσῃ, đồng thời diễn đạt thể hoàn thành của πεπολίτευμαι. Không thêm sắc thái giáo phái hoặc khẳng định vô tội tuyệt đối.
