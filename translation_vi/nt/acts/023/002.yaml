base_translation:
  language: en
  yaml_path: translation/nt/acts/023/002.yaml
  text: But the high priest Ananias ordered those standing by him to strike him on the mouth[a].
translation:
  language: vi
  text: Nhưng thượng tế A-na-nia ra lệnh cho những người đứng bên ông đánh vào miệng Phao-lô.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “tát vào miệng Phao-lô.” Động từ Hy Lạp có thể chỉ hành động đánh nói chung; “tát” là một cách hiểu hợp lý nhưng cụ thể hơn nguyên văn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Nhưng
  rationale: Diễn đạt liên từ chuyển tiếp có sắc thái đối lập nhẹ, làm nổi bật phản ứng đột ngột trước lời Phao-lô vừa nói.
- source_word: ὁ ἀρχιερεὺς
  choice: thầy thượng tế
  rationale: Cách gọi tự nhiên và quen thuộc trong tiếng Việt đối với chức vụ thượng tế tối cao trong bối cảnh này.
- source_word: Ἁνανίας
  choice: A-na-nia
  rationale: Phiên âm tên riêng theo cách viết Kinh Thánh quen thuộc trong tiếng Việt.
- source_word: ἐπέταξεν
  choice: ra lệnh
  rationale: Giữ rõ sắc thái mệnh lệnh có thẩm quyền, đồng thời tự nhiên trong tiếng Việt hiện đại.
- source_word: τοῖς παρεστῶσιν αὐτῷ
  choice: cho những người đứng bên ông
  rationale: Giữ nghĩa không gian của phân từ παρίστημι; đại từ 'ông' chỉ A-na-nia theo mạch cú pháp.
- source_word: τύπτειν
  choice: đánh
  rationale: Động từ Hy Lạp chỉ hành động đánh nói chung; 'đánh' tự nhiên và không xác định quá mức cách thức như 'tát'.
- source_word: αὐτοῦ τὸ στόμα
  choice: đánh vào miệng Phao-lô
  rationale: Nguyên văn dùng đại từ có thể gây nhập nhằng trong tiếng Việt vì câu có nhiều nhân vật nam; nêu tên Phao-lô làm rõ người bị đánh mà không thay đổi nội dung.
