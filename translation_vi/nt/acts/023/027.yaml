  - severity: low
    issue: Cách gọi thay thế trong chú thích chưa tự nhiên
    rationale: “Những người Giu-đê” không phải cách gọi địa lý thông dụng trong tiếng Việt hiện đại. “Những người xứ Giu-đê” làm rõ nghĩa địa lý của từ Hy Lạp mà vẫn giữ sự mơ hồ từ vựng.
