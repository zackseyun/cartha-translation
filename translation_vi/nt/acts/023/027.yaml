revisions:
- from: Người này bị những người Do Thái[a] bắt giữ và sắp bị họ giết; tôi cùng quân lính đến giải cứu ông ấy, sau khi biết ông ấy là người La Mã.
  to: Người này bị những người Do Thái[a] bắt giữ và sắp bị họ giết, nhưng tôi đem quân đến giải cứu ông ấy, sau khi biết ông ấy là người La Mã.
  rationale: Chỉnh cách diễn đạt cho tự nhiên hơn và làm rõ phương án địa lý trong chú thích. Liên từ “nhưng” thích hợp để biểu đạt sự đối lập ngữ cảnh giữa nguy cơ bị giết và việc can thiệp giải cứu, dù không thêm chi tiết nào vào nội dung câu. Quan hệ “sau khi biết” được giữ nguyên để phản ánh lời tự thuật của viên chỉ huy, không giải quyết căng thẳng với trình tự tường thuật trước đó.
