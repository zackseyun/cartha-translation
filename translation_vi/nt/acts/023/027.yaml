id: ACT.23.27
reference: Acts 23:27
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τὸν ἄνδρα τοῦτον συλλημφθέντα ὑπὸ τῶν Ἰουδαίων καὶ μέλλοντα ἀναιρεῖσθαι ὑπ’ αὐτῶν ἐπιστὰς σὺν τῷ στρατεύματι ⸀ἐξειλάμην, μαθὼν ὅτι Ῥωμαῖός ἐστιν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/027.yaml
  text: This man was seized by the Jews and was about to be killed by them[a], and I came with the troops and rescued him, having learned that he is a Roman.
translation:
  language: vi
  text: Người này bị những người Do Thái[a] bắt giữ và sắp bị họ giết, nhưng tôi đem quân đến giải cứu ông ấy, sau khi biết ông ấy là người La Mã.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “những người xứ Giu-đê.” Từ Hy Lạp này có thể chỉ người Do Thái theo nghĩa dân tộc–tôn giáo hoặc người thuộc xứ Giu-đê theo nghĩa địa lý; ở đây, từ này rất có thể chỉ đám đông hoặc những người Do Thái chống đối Phao-lô tại Giê-ru-sa-lem.
    reason: lexical_alternative
lexical_decisions:
- source_word: συλλημφθέντα
  choice: bị… bắt giữ
  rationale: Diễn đạt hành động cưỡng ép bắt lấy người, nhưng không mặc nhiên coi đây là một vụ bắt giữ hợp pháp.
- source_word: Ἰουδαίων
  choice: những người Do Thái
  rationale: Trong ngữ cảnh này, từ này chỉ nhóm người Do Thái tại Giê-ru-sa-lem chống đối Phao-lô; cách hiểu theo địa lý là “những người Giu-đê” được giữ trong chú thích.
- source_word: μέλλοντα ἀναιρεῖσθαι
  choice: sắp bị họ giết
  rationale: Thể hiện rõ tính cận kề của μέλλω và nghĩa “giết” của ἀναιρέω trong ngữ cảnh.
- source_word: ἐπιστὰς
  choice: đến
  rationale: Trong mạch câu, động từ mô tả việc viên chỉ huy xuất hiện và can thiệp; sắc thái can thiệp đã được thể hiện qua hành động giải cứu.
- source_word: σὺν τῷ στρατεύματι
  choice: cùng quân lính
  rationale: Chỉ một lực lượng quân sự mà không xác định quá mức quy mô hay đơn vị.
- source_word: ἐξειλάμην
  choice: giải cứu ông ấy
  rationale: Diễn đạt việc cứu Phao-lô khỏi nguy cơ bị giết; “ông ấy” là đại từ tự nhiên và trang trọng trong tiếng Việt.
- source_word: μαθὼν
  choice: sau khi biết
  rationale: Giữ quan hệ thời gian mà phân từ bất định quá khứ biểu thị trong lời kể của viên chỉ huy, không điều chỉnh theo trình tự được thuật lại ở phần trước.
- source_word: Ῥωμαῖός ἐστιν
  choice: ông ấy là người La Mã
  rationale: Bám sát cách diễn đạt của nguyên văn; trong bối cảnh pháp lý, cụm này hàm ý địa vị công dân La Mã mà không cần thêm từ giải nghĩa vào chính văn.
theological_decisions:
- issue: Cách trình bày mang tính biện hộ trong bức thư của viên chỉ huy
  choice: Dịch thẳng lời tự thuật rằng ông ta giải cứu Phao-lô sau khi biết Phao-lô là người La Mã.
  alternative: Điều chỉnh trình tự hoặc diễn giải để hòa hợp rõ ràng với lời thuật ở Công Vụ 21–22.
  rationale: Câu này thuật lại chính lời của Cơ-lo-đi-ô Ly-si-a, trong đó ông trình bày hành động của mình theo hướng có lợi. Bản dịch giữ nguyên sự căng thẳng với phần tường thuật trước đó thay vì âm thầm giải quyết nó.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dấu chấm phẩy làm rõ hai vế chính liên tiếp mà không thêm sắc thái đối lập; cách diễn đạt vẫn giữ nguyên lời tự trình bày có chọn lọc của viên chỉ huy.
