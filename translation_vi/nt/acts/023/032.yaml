  text: τῇ δὲ ἐπαύριον ἐάσαντες τοὺς ἱππεῖς ⸀ἀπέρχεσθαι σὺν αὐτῷ ὑπέστρεψαν εἰς τὴν παρεμβολήν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/032.yaml
  text: But on the next day[a], after letting the horsemen go on with him, they returned to the barracks.
translation:
  language: vi
  text: Nhưng hôm sau, họ để những kỵ binh tiếp tục đi cùng ông, rồi trở về đồn binh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “doanh trại.” Từ Hy Lạp có thể chỉ trại quân hoặc khu đóng quân; ở đây có lẽ nói đến đồn binh hay pháo đài của quân La Mã tại Giê-ru-sa-lem.
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ δὲ ἐπαύριον
  choice: Nhưng hôm sau
  rationale: Cụm từ này có nghĩa là “vào ngày hôm sau”; δέ được diễn đạt bằng “nhưng” như một chuyển ý nhẹ trong mạch kể chuyện.
- source_word: ἐάσαντες
  choice: họ để
  rationale: Phân từ bất định quá khứ của ἐάω mang nghĩa cho phép hoặc để cho; cách diễn đạt này tự nhiên và cho thấy hành động ấy xảy ra trước khi họ trở về.
- source_word: τοὺς ἱππεῖς
  choice: những kỵ binh
  rationale: ἱππεῖς chỉ quân lính cưỡi ngựa; “kỵ binh” là thuật ngữ tiếng Việt rõ ràng, gọn và phù hợp với bối cảnh quân sự.
- source_word: ἀπέρχεσθαι σὺν αὐτῷ
  choice: tiếp tục đi cùng ông
  rationale: Trong bối cảnh đoàn hộ tống, cụm từ nói đến việc kỵ binh tiếp tục hành trình cùng Phao-lô, trong khi những người còn lại quay về. Đại từ “ông” giữ cách quy chiếu của nguyên bản mà không lặp tên không cần thiết.
- source_word: ὑπέστρεψαν
  choice: rồi trở về
  rationale: ὑποστρέφω có nghĩa là trở về hoặc quay lại; “rồi” làm rõ trình tự kể chuyện một cách tự nhiên.
- source_word: εἰς τὴν παρεμβολήν
  choice: về đồn binh
  rationale: παρεμβολή có thể chỉ doanh trại hoặc nơi trú đóng của quân đội; trong bối cảnh này, từ ấy nhiều khả năng nói đến khu đồn trú của quân La Mã tại Giê-ru-sa-lem.
theological_decisions: []
translation_notes:
  register: 'Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Cấu trúc câu giữ rõ hai hành động tương phản: kỵ binh tiếp tục hộ tống, còn nhóm kia trở về. Dấu chú thích được đặt ngay sau “đồn binh,” là từ mà chú thích giải thích.'
