  text: Οἱ μὲν οὖν στρατιῶται κατὰ τὸ διατεταγμένον αὐτοῖς ἀναλαβόντες τὸν Παῦλον ἤγαγον ⸀διὰ νυκτὸς εἰς τὴν Ἀντιπατρίδα·
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/031.yaml
  text: So the soldiers[a], according to what had been ordered them[b], took Paul and brought him by night to Antipatris.
translation:
  language: vi
  text: Vậy, theo lệnh đã được truyền cho họ, các binh lính đem Phao-lô đi trong đêm đến An-ti-pa-tri.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οἱ μὲν οὖν στρατιῶται
  choice: Vậy, ... các binh lính
  rationale: οὖν tiếp nối và đẩy mạch thuật chuyện tiến lên; μέν báo trước sự tương ứng với câu kế tiếp nhưng không cần dịch riêng trong tiếng Việt.
- source_word: κατὰ τὸ διατεταγμένον αὐτοῖς
  choice: theo lệnh đã truyền cho mình
  rationale: Cụm phân từ hoàn thành bị động có mạo từ chỉ điều đã được ra lệnh cho họ; cách dịch này giữ sắc thái mệnh lệnh có trước và tự nhiên trong tiếng Việt.
- source_word: ἀναλαβόντες
  choice: nhận Phao-lô
  rationale: 'Phân từ bất định chỉ hành động đi trước động từ chính: binh lính tiếp nhận Phao-lô để đưa đi. “Nhận” không thêm ý áp giải vốn không nằm rõ trong chính động từ.'
- source_word: ἤγαγον
  choice: đưa ông ... đến
  rationale: ἄγω có thể là dẫn, đưa hoặc đem; với một địa điểm đích được nêu rõ, “đưa ... đến” diễn đạt tự nhiên việc chuyển Phao-lô dưới sự canh giữ.
- source_word: διὰ νυκτός
  choice: trong đêm
  rationale: Cụm διά với sở hữu cách chỉ thời gian diễn ra vào ban đêm; “trong đêm” giữ nguyên thời điểm mà không nhất thiết hàm ý chuyến đi kéo dài suốt cả đêm.
- source_word: Ἀντιπατρίδα
  choice: An-ti-pa-tri
  rationale: Phiên âm địa danh Hy Lạp sang dạng dễ đọc theo âm tiết trong tiếng Việt.
