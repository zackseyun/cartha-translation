  text: Claudius Lysias[a], to the most excellent governor Felix, greetings.
translation:
  language: vi
  text: Cơ-lau-đi-ô Ly-si-a kính gửi ngài tổng đốc Phê-lích rất đáng kính.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κλαύδιος Λυσίας
  choice: Cơ-lau-đi-ô Ly-si-a
  rationale: Phiên âm tên riêng Hy Lạp theo cách dễ đọc đối với độc giả Việt, đồng thời giữ đủ hai thành tố của tên.
- source_word: τῷ κρατίστῳ
  choice: ngài ... đáng kính
  rationale: Diễn đạt kính ngữ ở thể tối cao trong lối xưng hô hành chính trang trọng; cách này tự nhiên trong tiếng Việt mà không biến từ ấy thành một chức danh kỹ thuật.
- source_word: ἡγεμόνι
  choice: tổng đốc
  rationale: Trong bối cảnh viên chức La Mã cai quản Giu-đê, “tổng đốc” truyền đạt rõ vai trò quản trị cấp tỉnh mà không ấn định quá mức một chức danh La Mã cụ thể.
- source_word: Φήλικι
  choice: Phê-lích
  rationale: Phiên âm tên riêng theo cách đọc quen thuộc và dễ nhận biết trong tiếng Việt.
- source_word: χαίρειν
  choice: Kính chào ngài
  rationale: Trong phần mở đầu thư, từ này là công thức chào hỏi chứ không phải mệnh lệnh “hãy vui mừng”; thêm sắc thái kính trọng phù hợp với người nhận là quan chức cấp cao.
