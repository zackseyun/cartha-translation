  to: Nhưng khi tôi được báo rằng sẽ có âm mưu hại người ấy, tôi lập tức đưa người ấy đến ngài, đồng thời ra lệnh cho những người tố cáo người ấy trình bày lời buộc tội đối với người ấy trước ngài.a
