source:
  edition: SBLGNT
  text: μηνυθείσης δέ μοι ἐπιβουλῆς εἰς τὸν ⸀ἄνδρα ἔσεσθαι ⸀ἐξαυτῆς ἔπεμψα πρὸς σέ, παραγγείλας καὶ τοῖς κατηγόροις ⸀λέγειν πρὸς αὐτὸν ἐπὶ ⸀σοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/030.yaml
  text: And when I was informed that there would be a plot against the man[a], I sent him to you at once, also ordering his accusers to state their case before you.
translation:
  language: vi
  text: Nhưng khi tôi được báo rằng sẽ có âm mưu hại người ấy, tôi lập tức đưa người ấy đến ngài, đồng thời ra lệnh cho những người tố cáo người ấy trình bày lời buộc tội đối với người ấy trước ngài.a
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μηνυθείσης
  choice: khi được báo
  rationale: Phân từ bất định thụ động ở kết cấu sở hữu cách tuyệt đối được chuyển thành mệnh đề thời gian tự nhiên trong tiếng Việt, đồng thời giữ sắc thái thụ động.
- source_word: ἐπιβουλῆς
  choice: âm mưu hại
  rationale: ἐπιβουλή chỉ một kế hoạch thù địch; thêm “hại” làm rõ hướng thù địch mà không thu hẹp thành một cuộc phục kích cụ thể.
- source_word: εἰς τὸν ἄνδρα
  choice: hại người này
  rationale: εἰς diễn tả hướng thù địch; “người này” giữ danh từ ἀνήρ và chỉ rõ người đang được nói đến là Phao-lô.
- source_word: ἔσεσθαι
  choice: sẽ có
  rationale: Động từ nguyên mẫu tương lai của εἰμί diễn tả nội dung được báo về một âm mưu sắp xảy ra.
- source_word: ἐξαυτῆς
  choice: lập tức
  rationale: Trạng từ này nhấn mạnh hành động được thực hiện ngay, phù hợp văn phong công vụ.
- source_word: ἔπεμψα πρὸς σέ
  choice: tôi ... giải ông ấy đến ngài
  rationale: Người được sai đi là một tù nhân dưới sự áp giải; “giải ... đến” diễn đạt tự nhiên bối cảnh quân sự-pháp lý, còn tân ngữ được bổ sung rõ từ ngữ cảnh.
- source_word: παραγγείλας
  choice: đồng thời truyền
  rationale: Phân từ bất định chỉ hành động đi kèm; “đồng thời” thể hiện liên kết này và καί, còn “truyền” giữ sắc thái mệnh lệnh chính thức.
- source_word: κατηγόροις
  choice: những người tố cáo ông ấy
  rationale: Cách diễn đạt xác định rõ đây là những người buộc tội Phao-lô và phù hợp ngữ cảnh tố tụng.
- source_word: λέγειν πρὸς αὐτὸν
  choice: trình bày vụ việc chống lại ông ấy
  rationale: Cụm từ theo nghĩa đen là “nói với/chống lại người ấy”; trong bối cảnh pháp đình, bản dịch diễn đạt việc trình bày lời buộc tội nhưng vẫn giữ hướng đối kháng của πρὸς.
- source_word: ἐπὶ σοῦ
  choice: trước ngài
  rationale: Cụm giới từ mang sắc thái pháp lý, chỉ việc trình bày trước nhà chức trách là Phê-lít.
theological_decisions: []
