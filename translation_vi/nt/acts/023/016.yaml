  text: Ἀκούσας δὲ ὁ υἱὸς τῆς ἀδελφῆς Παύλου ⸂τὴν ἐνέδραν⸃ παραγενόμενος καὶ εἰσελθὼν εἰς τὴν παρεμβολὴν ἀπήγγειλεν τῷ Παύλῳ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/016.yaml
  text: But when Paul’s sister’s son heard of the ambush[c][b][a], he came and entered the barracks and reported it to Paul.
translation:
  language: vi
  text: Nhưng khi con trai của chị hoặc em gái Phao-lô[a] nghe được tin về cuộc phục kích[b], người ấy đến, đi vào đồn lính[c] và báo cho Phao-lô.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “cháu trai của Phao-lô”; nguyên văn là “con trai của chị hoặc em gái Phao-lô.”
    reason: lexical_alternative
  - marker: b
    text: Hay “âm mưu” hoặc “kế hoạch ám hại.” Từ Hy Lạp nói cụ thể hơn đến việc mai phục, nằm chờ để tấn công.
    reason: lexical_alternative
  - marker: c
    text: Hay “doanh trại.” Trong bối cảnh này, từ ngữ có lẽ chỉ đồn lính La Mã.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀκούσας
  choice: khi ... nghe biết
  rationale: Phân từ bất định quá khứ diễn tả hành động xảy ra trước hành động chính; cách dịch này tự nhiên trong tiếng Việt và cho thấy người cháu biết được tin về cuộc phục kích.
- source_word: δὲ
  choice: Nhưng
  rationale: 'Đánh dấu bước chuyển trần thuật có sắc thái tương phản nhẹ: âm mưu vừa được lập thì nay bị phát hiện.'
- source_word: ὁ υἱὸς τῆς ἀδελφῆς Παύλου
  choice: con trai của chị hoặc em gái Phao-lô
  rationale: Giữ nguyên quan hệ gia đình được tiếng Hy Lạp nêu rõ; tiếng Hy Lạp không xác định người ấy là con của chị hay em gái Phao-lô.
- source_word: τὴν ἐνέδραν
  choice: cuộc phục kích
  rationale: ἐνέδρα chỉ cụ thể việc mai phục hoặc nằm chờ để tấn công, sát nghĩa hơn các từ khái quát như “âm mưu”.
- source_word: παραγενόμενος
  choice: anh đến
  rationale: Diễn tả việc đến nơi trước khi đi vào đồn; dùng “anh” để chỉ người cháu đã trưởng thành đủ để tự mình hành động, nhưng không thêm thông tin về tuổi.
- source_word: εἰσελθὼν εἰς τὴν παρεμβολὴν
  choice: vào trong đồn lính
  rationale: παρεμβολή có thể là doanh trại hoặc đồn lính; trong bối cảnh Phao-lô bị quân La Mã giam giữ tại Giê-ru-sa-lem, “đồn lính” là cách gọi tự nhiên và phù hợp.
- source_word: ἀπήγγειλεν
  choice: báo
  rationale: ἀπαγγέλλω diễn tả việc thuật lại hoặc chuyển tin; “báo cho” ngắn gọn, tự nhiên và phù hợp với hành động thông tin cho Phao-lô.
- source_word: τῷ Παύλῳ
  choice: cho Phao-lô
  rationale: Chuyển trực tiếp túc từ gián tiếp ở cách tặng sang cấu trúc tiếng Việt “báo cho”.
