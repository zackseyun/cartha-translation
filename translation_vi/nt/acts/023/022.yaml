source:
  edition: SBLGNT
  text: ὁ μὲν οὖν χιλίαρχος ἀπέλυσε τὸν ⸀νεανίσκον παραγγείλας μηδενὶ ἐκλαλῆσαι ὅτι ταῦτα ἐνεφάνισας πρὸς ⸀ἐμέ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/022.yaml
  text: So the commander dismissed the young man[a], instructing him, “Tell no one that you have reported these things to me.”
translation:
  language: vi
  text: 'Vậy, viên chỉ huy cho người thanh niên ra về và dặn: “Đừng nói với ai rằng đã báo[a] cho tôi những điều này.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “đã cho tôi biết” hoặc “đã trình báo với tôi.”'
    reason: Ghi nhận các cách dịch tự nhiên khác của ἐνεφάνισας, nghĩa là làm cho biết hoặc trình báo với người có thẩm quyền.
lexical_decisions:
- source_word: χιλίαρχος
  choice: viên chỉ huy
  rationale: Chỉ một sĩ quan La Mã chỉ huy một đơn vị cấp quân đoàn bộ; “viên chỉ huy” rõ ràng, tự nhiên và giữ được thẩm quyền của chức vụ mà không dùng thuật ngữ quân sự quá chuyên biệt.
- source_word: ἀπέλυσε
  choice: cho ... ra về
  rationale: Trong ngữ cảnh, viên chỉ huy kết thúc cuộc gặp và cho người thanh niên đi; cách dịch này tự nhiên và tránh hàm ý người ấy vừa được thả khỏi nơi giam giữ.
- source_word: νεανίσκον
  choice: người thanh niên
  rationale: Từ này chỉ một người nam còn trẻ; cách dịch trang trọng vừa phải, tự nhiên và không xác định tuổi quá hẹp.
- source_word: παραγγείλας
  choice: dặn
  rationale: Phân từ diễn tả việc đưa ra một chỉ thị có thẩm quyền. “Dặn” phù hợp lời nói trực tiếp trong tiếng Việt mà không làm giọng điệu gay gắt quá mức.
- source_word: μηδενὶ ἐκλαλῆσαι
  choice: Đừng nói với ai
  rationale: Diễn đạt tự nhiên lệnh cấm tiết lộ thông tin cho bất cứ người nào.
- source_word: ἐνεφάνισας
  choice: đã báo
  rationale: Động từ có nghĩa làm cho biết hoặc trình báo, đặc biệt với người có thẩm quyền; “đã báo” gọn và phù hợp ngữ cảnh.
- source_word: ταῦτα
  choice: những điều này
  rationale: Giữ hình thức số nhiều của đại từ chỉ định và quy chiếu đến các thông tin vừa được trình bày.
- source_word: πρὸς ἐμέ
  choice: cho tôi
  rationale: πρός với đối cách sau động từ thông báo diễn tả hướng đến người tiếp nhận; “cho tôi” là cách nói tự nhiên trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong tiếng Việt hiện đại, rõ ràng và trang nghiêm vừa phải. Dùng “cậu” trong lời viên chỉ huy nói với một người nam trẻ tuổi để phản ánh quan hệ tuổi tác và thẩm quyền, nhưng không hạ thấp người nghe.
