  text: ἀναγνοὺς ⸀δὲ καὶ ἐπερωτήσας ἐκ ποίας ⸀ἐπαρχείας ἐστὶν καὶ πυθόμενος ὅτι ἀπὸ Κιλικίας,
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/034.yaml
  text: After reading it and asking what province he was from[a], and learning that he was from Cilicia,
translation:
  language: vi
  text: Sau khi đọc thư và hỏi Phao-lô thuộc tỉnh nào, ông biết rằng Phao-lô đến từ Ki-li-ki-a,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναγνοὺς
  choice: Sau khi đọc thư
  rationale: Phân từ bất định quá khứ chỉ hành động xảy ra trước; thêm “thư” theo văn cảnh để câu tiếng Việt rõ và tự nhiên.
- source_word: δὲ καὶ
  choice: —
  rationale: Các liên từ nhẹ được thể hiện qua mạch nối tự nhiên của câu, không cần dịch thành từ riêng.
- source_word: ἐπερωτήσας
  choice: ông hỏi
  rationale: Diễn đạt tự nhiên hành động hỏi trực tiếp của quan tổng đốc.
- source_word: ἐκ ποίας ἐπαρχείας ἐστὶν
  choice: Phao-lô thuộc tỉnh nào
  rationale: ἐπαρχία là đơn vị hành chính của La Mã; “thuộc tỉnh nào” phù hợp với việc xác định thẩm quyền tài phán. Tên Phao-lô được nêu lại theo văn cảnh để tránh đại từ mơ hồ.
- source_word: πυθόμενος
  choice: khi biết
  rationale: Thể hiện việc nhận được thông tin sau khi hỏi, đồng thời giữ trình tự của các phân từ Hy Lạp.
- source_word: ὅτι ἀπὸ Κιλικίας
  choice: ông ấy đến từ Ki-li-ki-a
  rationale: ἀπό với địa danh chỉ nguồn gốc; “đến từ” là cách nói tự nhiên, không hàm ý nhất thiết là nơi sinh.
- source_word: Κιλικίας
  choice: Ki-li-ki-a
  rationale: Phiên âm địa danh Cilicia theo cách đọc quen thuộc trong tiếng Việt.
