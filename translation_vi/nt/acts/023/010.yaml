source:
  edition: SBLGNT
  text: πολλῆς δὲ ⸀γινομένης στάσεως ⸀φοβηθεὶς ὁ χιλίαρχος μὴ διασπασθῇ ὁ Παῦλος ὑπ’ αὐτῶν ἐκέλευσεν τὸ στράτευμα ⸀καταβὰν ἁρπάσαι αὐτὸν ἐκ μέσου αὐτῶν, ἄγειν ⸀τε εἰς τὴν παρεμβολήν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/010.yaml
  text: And when a great dispute arose[a], the commander, fearing that Paul might be torn apart by them, ordered the troops to go down, seize him from among them[c][b], and bring him into the barracks.
translation:
  language: vi
  text: Khi xảy ra một cuộc xung đột lớn[a], viên chỉ huy sợ rằng Phao-lô có thể bị họ xé xác[b], nên ra lệnh cho quân lính xuống, giằng ông ra khỏi giữa họ và đưa vào doanh trại[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Xung đột” cũng có thể dịch là “tranh chấp”, “bất hòa” hoặc “náo loạn”; từ Hy Lạp στάσις chỉ sự đối đầu gay gắt và trong một số bối cảnh có thể chỉ cuộc nổi loạn.
    reason: lexical_alternative
  - marker: b
    text: Hay “xé ra từng mảnh”; từ Hy Lạp διασπάω diễn tả sống động việc dùng sức kéo xé ra.
    reason: lexical_alternative
  - marker: c
    text: “Doanh trại” dịch từ παρεμβολή, nghĩa sát hơn là “trại quân”; tại đây từ này chỉ khu đóng quân của quân đội La Mã ở Giê-ru-sa-lem.
    reason: cultural_note
lexical_decisions:
- source_word: πολλῆς δὲ γινομένης στάσεως
  choice: Khi cuộc xung đột trở nên dữ dội
  rationale: Cấu trúc sở hữu cách tuyệt đối được diễn đạt thành mệnh đề chỉ hoàn cảnh. στάσις ở đây là sự đối đầu gay gắt trong hội đồng; “xung đột” giữ được mức độ nghiêm trọng mà không mặc nhiên biến sự việc thành một cuộc nổi loạn, còn “trở nên dữ dội” truyền đạt cả γινομένης và πολλῆς một cách tự nhiên.
- source_word: φοβηθεὶς ὁ χιλίαρχος
  choice: viên chỉ huy sợ rằng
  rationale: χιλίαρχος chỉ viên sĩ quan La Mã chỉ huy một đơn vị lớn; “viên chỉ huy” rõ nghĩa với độc giả hiện đại. Phân từ φοβηθεὶς nêu động cơ của mệnh lệnh tiếp theo.
- source_word: μὴ διασπασθῇ ὁ Παῦλος ὑπ’ αὐτῶν
  choice: Phao-lô sẽ bị họ xé xác
  rationale: διασπάω là động từ mạnh, gợi cảnh bị kéo xé bằng bạo lực. Trong tiếng Việt, “sợ rằng ... sẽ” tự nhiên biểu đạt kết quả mà viên chỉ huy lo có thể xảy ra, chứ không khẳng định nó đã xảy ra.
- source_word: ἐκέλευσεν τὸ στράτευμα καταβὰν
  choice: ra lệnh cho quân lính xuống
  rationale: στράτευμα là lực lượng binh sĩ dưới quyền; “quân lính” tự nhiên hơn một danh từ tập hợp mang tính kỹ thuật. καταβὰν giữ hướng di chuyển xuống từ khu đồn lũy đến nơi hội đồng họp.
- source_word: ἁρπάσαι αὐτὸν ἐκ μέσου αὐτῶν
  choice: giằng ông ra khỏi đám đông
  rationale: ἁρπάζω diễn tả việc nhanh chóng dùng sức lôi người ra. “Giằng ... ra” giữ sắc thái cưỡng lực; “đám đông” diễn đạt tự nhiên nhóm người đang vây quanh Phao-lô trong ngữ cảnh.
- source_word: ἄγειν τε εἰς τὴν παρεμβολήν
  choice: và đưa vào doanh trại
  rationale: ἄγω với đích đến được dịch tự nhiên là “đưa vào”. παρεμβολή theo nghĩa gốc có thể là trại quân, nhưng tại đây chỉ khu đóng quân của lính La Mã trong đồn Antonia; “doanh trại” vừa dễ hiểu vừa hợp bối cảnh đô thị.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu giữ nhịp kể chuyện nhanh cùng mức độ bạo lực rõ nét của nguyên văn; dùng “viên chỉ huy”, “quân lính” và “doanh trại” thay cho các thuật ngữ La Mã chuyên biệt khó hiểu.
