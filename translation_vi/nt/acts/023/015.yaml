id: ACT.23.15
reference: Acts 23:15
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: νῦν οὖν ὑμεῖς ἐμφανίσατε τῷ χιλιάρχῳ σὺν τῷ συνεδρίῳ ⸀ὅπως ⸂καταγάγῃ αὐτὸν εἰς⸃ ὑμᾶς ὡς μέλλοντας διαγινώσκειν ἀκριβέστερον τὰ περὶ αὐτοῦ· ἡμεῖς δὲ πρὸ τοῦ ἐγγίσαι αὐτὸν ἕτοιμοί ἐσμεν τοῦ ἀνελεῖν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/015.yaml
  text: Now therefore[a], you, together with the council, make it known to the commander so that he may bring him down to you, as though you were about to examine more carefully the things concerning him[c][b]. But we are ready to kill him before he comes near.
translation:
  language: vi
  text: Vậy bây giờ, các ông cùng với Hội đồng hãy báo cho viên chỉ huy biết để ông ấy đưa người ấy xuống chỗ các ông[a], làm như các ông sắp xem xét kỹ hơn những việc liên quan đến người ấy[b]. Còn chúng tôi đã sẵn sàng giết người ấy trước khi người ấy đến gần[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “đưa người ấy đến trước mặt các ông.” Động từ Hy Lạp có nghĩa đen bao gồm ý đưa xuống.
    reason: lexical_alternative
  - marker: b
    text: Hay “làm như các ông định điều tra vụ việc của người ấy kỹ hơn.” Cách diễn đạt hàm ý đây là cái cớ để tiếp tục việc xem xét theo thủ tục tư pháp.
    reason: lexical_alternative
  - marker: c
    text: Hay “trước khi người ấy đến nơi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμφανίσατε
  choice: hãy báo ... biết
  rationale: Mệnh lệnh truyền đạt một việc cho nhà chức trách; cách nói này tự nhiên trong tiếng Việt và không thu hẹp nội dung thành một lời thỉnh cầu.
- source_word: χιλιάρχῳ
  choice: viên chỉ huy
  rationale: Chỉ sĩ quan La Mã chỉ huy một đơn vị quân; cách dịch phổ thông này rõ nghĩa hơn thuật ngữ chuyên môn.
- source_word: σὺν τῷ συνεδρίῳ
  choice: cùng với Hội đồng
  rationale: Giữ ý liên kết của σύν và dịch tên cơ quan Do Thái bằng một danh xưng dễ hiểu, không dùng thuật ngữ vay mượn.
- source_word: καταγάγῃ αὐτὸν εἰς ὑμᾶς
  choice: đưa người ấy xuống chỗ các ông
  rationale: Giữ sắc thái chuyển động xuống của κατάγω, đồng thời diễn đạt đích đến tự nhiên trong tiếng Việt.
- source_word: ὡς μέλλοντας
  choice: làm như các ông sắp
  rationale: Diễn đạt ý định được trình bày như thật nhưng thực chất là giả vờ, không giải thích quá mức ngay trong câu.
- source_word: διαγινώσκειν ἀκριβέστερον
  choice: xem xét kỹ hơn
  rationale: Phù hợp bối cảnh điều tra hay xét xử và giữ ý so sánh về mức độ chính xác, cẩn trọng hơn.
- source_word: τὰ περὶ αὐτοῦ
  choice: những việc liên quan đến người ấy
  rationale: Giữ cấu trúc rộng và tương đối sát nguyên văn, không thu hẹp hẳn thành 'vụ án của người ấy'.
- source_word: πρὸ τοῦ ἐγγίσαι αὐτὸν
  choice: trước khi người ấy đến gần
  rationale: Giữ trực tiếp sắc thái không gian của ἐγγίζω thay vì mặc nhiên hiểu là đến nơi.
- source_word: τοῦ ἀνελεῖν αὐτόν
  choice: giết người ấy
  rationale: Truyền đạt thẳng nghĩa của ἀναιρέω trong ngữ cảnh này mà không thêm đánh giá đạo đức như 'ám sát' hay 'sát hại'.
