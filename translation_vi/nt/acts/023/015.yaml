translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “các ông” phù hợp lời nói trực tiếp với nhóm lãnh đạo nam trong bối cảnh, còn “người ấy” tránh sự mơ hồ của đại từ “ông ta” khi trong câu cũng có viên chỉ huy.
