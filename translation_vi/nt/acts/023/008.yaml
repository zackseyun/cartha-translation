  source_fidelity: Bản dịch truyền đạt đúng mệnh đề giải thích γὰρ, sự phủ nhận của người Sa-đu-sê đối với sự sống lại, thiên sứ và thần linh, cùng sự đối lập với người Pha-ri-si. “Cả hai” giữ đúng τὰ ἀμφότερα mà không tự ý đổi thành “cả ba.” Cấu trúc “cũng không có thiên sứ hay thần linh” diễn đạt tự nhiên ý phủ định tương liên μήτε ... μήτε trong tiếng Việt.
  naturalness: 'Văn câu hiện đại, rõ nghĩa và có đăng đối tự nhiên: “Vì …; còn …”. “Sự sống lại,” “thiên sứ,” và “thần linh” phù hợp văn phong Kinh Thánh tiếng Việt đương đại. Dấu chấm phẩy trước “còn” giúp làm rõ thế đối lập.'
  terminology: Tên các nhóm “Sa-đu-sê” và “Pha-ri-si” được phiên âm nhất quán. “Thừa nhận” phù hợp với ὁμολογοῦσιν trong ngữ cảnh xác nhận một điều là đúng. “Thần linh” là lựa chọn thận trọng cho πνεῦμα, không áp đặt đồng nhất với Đức Thánh Linh.
