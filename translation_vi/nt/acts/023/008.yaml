id: ACT.23.8
reference: Acts 23:8
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Σαδδουκαῖοι ⸀μὲν γὰρ λέγουσιν μὴ εἶναι ἀνάστασιν ⸀μήτε ἄγγελον μήτε πνεῦμα, Φαρισαῖοι δὲ ὁμολογοῦσιν τὰ ἀμφότερα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/008.yaml
  text: For the Sadducees say there is no resurrection[a], nor angel nor spirit, but the Pharisees acknowledge both.
translation:
  language: vi
  text: Vì người Sa-đu-sê nói rằng không có sự sống lại, cũng không có thiên sứ hay thần linh; còn người Pha-ri-si thì thừa nhận cả hai.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc hiểu là: “người Pha-ri-si thừa nhận cả ba”—tức là sự sống lại, thiên sứ và thần linh. Tiếng Hy Lạp viết “cả hai”, trực tiếp nhất chỉ “thiên sứ” và “thần linh”, nhưng một số người hiểu cụm này theo nghĩa rộng hơn dựa vào ngữ cảnh.'
    reason: Bảo lưu cách hiểu khác về phạm vi của τὰ ἀμφότερα.
lexical_decisions:
- source_word: Σαδδουκαῖοι
  choice: người Sa-đu-sê
  rationale: Phiên âm tên phái Do Thái theo cách quen thuộc trong tiếng Việt.
- source_word: μὲν γὰρ
  choice: Vì
  rationale: Diễn đạt tự nhiên chức năng giải thích của liên từ và tiểu từ trong ngữ cảnh.
- source_word: λέγουσιν
  choice: nói rằng
  rationale: Động từ hiện tại nêu quan điểm điển hình của người Sa-đu-sê.
- source_word: μὴ εἶναι ἀνάστασιν
  choice: không có sự sống lại
  rationale: Cách diễn đạt rõ ràng, tự nhiên về việc họ phủ nhận thực tại phục sinh.
- source_word: μήτε ἄγγελον μήτε πνεῦμα
  choice: cũng không có thiên sứ hay thần linh
  rationale: Giữ cấu trúc phủ định tương liên và hai danh từ số ít; “thần linh” giúp πνεῦμα ở đây được hiểu là một hữu thể thuộc linh mà không đồng nhất với Đức Thánh Linh.
- source_word: Φαρισαῖοι
  choice: người Pha-ri-si
  rationale: Phiên âm tên phái Do Thái theo cách quen thuộc trong tiếng Việt.
- source_word: ὁμολογοῦσιν
  choice: thừa nhận
  rationale: Trong ngữ cảnh, động từ có nghĩa là công nhận hoặc xác nhận là đúng, không mang nghĩa xưng tội.
- source_word: τὰ ἀμφότερα
  choice: cả hai
  rationale: Dịch trực tiếp ἀμφότερα và giữ nguyên điểm có thể gây căng thẳng vì câu trước nêu ba điều.
theological_decisions:
- issue: Phạm vi của “cả hai” trong lời xác nhận của người Pha-ri-si
  choice: Giữ nguyên “cả hai” trong chính văn, tự nhiên nhất là chỉ thiên sứ và thần linh.
  alternative: 'Hiểu theo nghĩa rộng là người Pha-ri-si thừa nhận cả ba điều: sự sống lại, thiên sứ và thần linh.'
  rationale: Bản Hy Lạp dùng τὰ ἀμφότερα, nghĩa đen là “cả hai”, và cặp gần nhất là “thiên sứ” với “thần linh”. Tuy nhiên, ngữ cảnh cũng bao gồm sự sống lại, nên chú thích bảo lưu cách hiểu rộng hơn thay vì âm thầm giải quyết điểm căng thẳng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “sự sống lại” là thuật ngữ Kinh Thánh quen thuộc; dùng “thần linh” cho πνεῦμα để tránh khiến độc giả mặc nhiên hiểu đây là Đức Thánh Linh. Dấu chú thích [a] xuất hiện ngay sau mệnh đề liên quan.
