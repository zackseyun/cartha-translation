  text: ὁ μὲν οὖν παραλαβὼν αὐτὸν ἤγαγεν πρὸς τὸν χιλίαρχον καὶ φησίν· Ὁ δέσμιος Παῦλος προσκαλεσάμενός με ἠρώτησεν τοῦτον τὸν ⸀νεανίαν ἀγαγεῖν πρὸς σέ, ἔχοντά τι λαλῆσαί σοι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/018.yaml
  text: So he took him and brought him to the commander and said[a], “The prisoner Paul called me to him and asked me to bring this young man to you[b], because he has something to say to you.”
translation:
  language: vi
  text: 'Vậy, viên sĩ quan dẫn người thanh niên ấy đến gặp viên chỉ huy[a] và nói: “Tù nhân Phao-lô đã gọi tôi đến chỗ mình và xin tôi đưa người thanh niên này đến gặp ngài, vì anh ấy có điều muốn nói với ngài.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tiếng Hy Lạp χιλίαρχος, một chức vụ chỉ huy trong quân đội La Mã; theo nghĩa đen là “người chỉ huy một nghìn quân.”
    reason: cultural_note
lexical_decisions:
- source_word: παραλαβὼν αὐτὸν ἤγαγεν
  choice: đưa người thanh niên ấy đến gặp
  rationale: Hai động từ diễn tả việc viên sĩ quan tiếp nhận rồi dẫn người thanh niên đến viên chỉ huy. Gộp tự nhiên thành “đưa ... đến gặp” trong tiếng Việt mà vẫn giữ đầy đủ chuyển động và đích đến.
- source_word: χιλίαρχον
  choice: viên chỉ huy
  rationale: Chỉ một sĩ quan quân đội La Mã, theo nghĩa đen là người chỉ huy một nghìn quân. “Viên chỉ huy” rõ nghĩa và tự nhiên hơn thuật ngữ vay mượn chuyên môn.
- source_word: φησίν
  choice: nói
  rationale: Đây là hiện tại lịch sử trong lời kể Hy Lạp; tiếng Việt kể chuyện tự nhiên có thể dùng “nói” mà không cần đánh dấu thì.
- source_word: Ὁ δέσμιος Παῦλος
  choice: Tù nhân Phao-lô
  rationale: δέσμιος chỉ người đang bị giam giữ hoặc xiềng xích; “tù nhân” chính xác và dễ hiểu trong bối cảnh.
- source_word: προσκαλεσάμενός με
  choice: đã gọi tôi đến
  rationale: Thể trung gian diễn tả Phao-lô gọi viên sĩ quan lại chỗ mình; “gọi tôi đến” thể hiện hướng chuyển động tự nhiên.
- source_word: ἠρώτησεν
  choice: xin tôi
  rationale: Trong ngữ cảnh này, ἐρωτάω mang nghĩa đưa ra lời yêu cầu chứ không phải hỏi một câu; “xin” phù hợp với cấu trúc tiếng Việt.
- source_word: νεανίαν
  choice: người thanh niên
  rationale: νεανίας chỉ một nam giới trẻ tuổi; cách dịch này trang trọng vừa phải và phổ thông.
- source_word: ἔχοντά τι λαλῆσαί σοι
  choice: vì anh ấy có điều muốn thưa với ngài
  rationale: Cụm phân từ bổ nghĩa cho người thanh niên và giải thích lý do đưa anh đến. “Thưa với ngài” phản ánh cách xưng hô kính trọng của cấp dưới với chỉ huy mà không thêm nội dung.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải. Đại từ “tôi—ngài” thể hiện quan hệ quân nhân cấp dưới nói với người chỉ huy. Dùng “anh ấy” cho người thanh niên để tránh lặp nhưng vẫn rõ chủ thể. Dấu chú thích [a] được đặt sau câu có từ “viên chỉ huy” và áp dụng cho thuật ngữ chức vụ trong câu.
