- from: 'Vậy, viên sĩ quan đưa người thanh niên ấy đến gặp viên chỉ huy và nói: “Tù nhân Phao-lô đã gọi tôi đến và xin tôi đưa người thanh niên này đến gặp ngài, vì anh ấy có điều muốn thưa với ngài.”[a]'
  to: 'Vậy, viên sĩ quan dẫn người thanh niên ấy đến gặp viên chỉ huy[a] và nói: “Tù nhân Phao-lô đã gọi tôi đến chỗ mình và xin tôi đưa người thanh niên này đến gặp ngài, vì anh ấy có điều muốn nói với ngài.”'
