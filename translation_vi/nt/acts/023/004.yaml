  text: οἱ δὲ παρεστῶτες εἶπαν· Τὸν ἀρχιερέα τοῦ θεοῦ λοιδορεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/004.yaml
  text: Those standing nearby said[a], “Are you insulting God’s high priest?”
translation:
  language: vi
  text: 'Những người đứng gần đó nói: “Anh lăng mạ[a] vị thượng tế của Đức Chúa Trời sao?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “thóa mạ.”'
    reason: Từ λοιδορεῖς có thể chỉ việc sỉ nhục, thóa mạ hoặc nói lời xúc phạm; “thóa mạ” giữ sắc thái mạnh hơn của sự lăng mạ bằng lời.
lexical_decisions:
- source_word: οἱ δὲ παρεστῶτες
  choice: Những người đứng gần đó
  rationale: Phân từ có mạo từ được dùng như danh từ, chỉ những người đang đứng bên cạnh Phao-lô. Cách diễn đạt này tự nhiên và giữ được sắc thái không gian của παρίστημι.
- source_word: εἶπαν
  choice: nói
  rationale: Động từ aorist kể lại một hành động trong diễn tiến câu chuyện; tiếng Việt dùng “nói” tự nhiên, không cần đánh dấu thì quá khứ.
- source_word: ἀρχιερέα
  choice: thầy tế lễ thượng phẩm
  rationale: Trong ngữ cảnh này, ἀρχιερεύς chỉ người giữ chức vụ tư tế cao nhất của người Do Thái; đây là thuật ngữ Kinh Thánh rõ nghĩa và quen thuộc trong tiếng Việt.
- source_word: τοῦ θεοῦ
  choice: của Đức Chúa Trời
  rationale: Giữ trực tiếp quan hệ sở thuộc/liên hệ của cấu trúc sở hữu cách Hy Lạp mà không hàm ý thêm rằng Đức Chúa Trời tán thành tư cách đạo đức của người đang giữ chức vụ.
- source_word: λοιδορεῖς
  choice: lăng mạ
  rationale: λοιδορέω chỉ lời nói xúc phạm, sỉ nhục hoặc thóa mạ. “Lăng mạ” trang trọng nhưng vẫn dễ hiểu, đồng thời diễn đạt mạnh hơn từ chung chung “xúc phạm”.
theological_decisions:
- issue: Ý nghĩa của τοῦ θεοῦ khi nói về thầy tế lễ thượng phẩm
  choice: “thầy tế lễ thượng phẩm của Đức Chúa Trời” được giữ như cách xác định chức vụ trong mối liên hệ với Đức Chúa Trời.
  alternative: Có thể diễn đạt “thầy tế lễ thượng phẩm thuộc về Đức Chúa Trời”, nhưng dễ khiến quan hệ sở thuộc bị nhấn mạnh quá mức.
  rationale: Bản dịch không biến danh xưng chức vụ thành lời xác nhận rằng Đức Chúa Trời tán thành hành vi hay phẩm cách của cá nhân đang giữ chức.
- issue: Sắc thái của câu hỏi
  choice: Dùng cấu trúc “Anh lại ... sao?” như một câu hỏi quở trách.
  alternative: “Anh lăng mạ ... ư?”
  rationale: Câu Hy Lạp có hình thức nghi vấn nhưng mang lực trách cứ. “Lại ... sao?” truyền đạt tự nhiên lực ấy trong tiếng Việt mà không biến thành một lời khẳng định.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng và dễ hiểu. Đại từ “anh” phù hợp với lời chất vấn trực tiếp trong bối cảnh xét xử; “Đức Chúa Trời” và “thầy tế lễ thượng phẩm” giữ văn phong Kinh Thánh quen thuộc. Dấu chú thích [a] được đặt ngay sau câu trích dẫn.
