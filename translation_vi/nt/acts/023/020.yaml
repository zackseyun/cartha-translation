reference: Acts 23:20
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἶπεν δὲ ὅτι Οἱ Ἰουδαῖοι συνέθεντο τοῦ ἐρωτῆσαί σε ὅπως αὔριον ⸂τὸν Παῦλον καταγάγῃς εἰς τὸ συνέδριον⸃ ὡς ⸀μέλλον τι ἀκριβέστερον πυνθάνεσθαι περὶ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/020.yaml
  text: He said[a], “The Jews have agreed to ask you to bring Paul down to the Sanhedrin tomorrow[b], as though they were going to inquire more accurately about him.”
translation:
  language: vi
  text: 'Anh ấy nói: “Người Do Thái đã thỏa thuận sẽ xin ngài đưa Phao-lô xuống Hội đồng Công luận[a] vào ngày mai, như thể họ định tìm hiểu kỹ hơn một điều gì đó về ông ấy.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “Tòa Công luận” hoặc “Sanhedrin”; từ Hy Lạp cũng có nghĩa chung là “hội đồng”, nhưng ở đây chỉ hội đồng lãnh đạo Do Thái tại Giê-ru-sa-lem.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνέθεντο
  choice: đã thỏa thuận với nhau
  rationale: Diễn đạt tự nhiên sắc thái cùng đi đến một thỏa thuận hoặc kế hoạch, không tự thêm ý ‘âm mưu’ vốn do văn cảnh cho thấy.
- source_word: τοῦ ἐρωτῆσαί σε
  choice: để xin ngài
  rationale: Động từ ἐρωτάω trong ngữ cảnh này mang nghĩa đưa ra lời yêu cầu; cấu trúc nguyên mẫu có mạo từ nêu nội dung hoặc mục đích của sự thỏa thuận.
- source_word: καταγάγῃς
  choice: đưa Phao-lô xuống
  rationale: Giữ hướng chuyển động ‘xuống’ của tiền tố κατά-, phù hợp với việc đi từ đồn đến nơi hội đồng họp.
- source_word: συνέδριον
  choice: Hội đồng Công luận
  rationale: Chỉ cơ quan lãnh đạo Do Thái tại Giê-ru-sa-lem; cách gọi này rõ nghĩa trong tiếng Việt, còn chú thích nêu tên vay mượn ‘Tòa Công luận/Sanhedrin’ và nghĩa rộng ‘hội đồng’.
- source_word: ὡς
  choice: làm như
  rationale: Thể hiện mục đích bề ngoài hoặc cớ được viện ra, mà không giải thích quá mức.
- source_word: μέλλον τι ἀκριβέστερον πυνθάνεσθαι
  choice: họ sắp tra hỏi kỹ hơn
  rationale: ‘Sắp’ phản ánh μέλλον; ‘tra hỏi’ diễn đạt việc tìm hiểu bằng cách hỏi của πυνθάνομαι; ‘kỹ hơn’ giữ cấp so sánh của ἀκριβέστερον. Đại từ bất định τι không nhất thiết phải dịch tách biệt trong tiếng Việt vì nội dung cần làm rõ đã được diễn đạt tự nhiên qua ‘về ông ấy’.
- source_word: περὶ αὐτοῦ
  choice: về ông ấy
  rationale: Cách diễn đạt trực tiếp, tự nhiên, quy chiếu đến Phao-lô.
- source_word: Οἱ Ἰουδαῖοι
  choice: Người Do Thái
  rationale: Giữ phạm vi biểu đạt của nguyên văn. Trong văn cảnh, cụm từ chỉ nhóm người Do Thái đang tham gia kế hoạch chống Phao-lô, không phải toàn thể dân Do Thái.
theological_decisions:
- issue: Phạm vi chỉ định của ‘Người Do Thái’ trong trình thuật thù nghịch
  choice: Giữ cách dịch trực tiếp ‘Người Do Thái’
  alternative: các lãnh đạo Do Thái; người Giu-đê
  rationale: Nguyên văn không trực tiếp giới hạn thành ‘các lãnh đạo’. Văn cảnh xác định đây là nhóm cụ thể liên quan đến kế hoạch chống Phao-lô, nên không được hiểu là lời quy kết cho toàn thể dân Do Thái.
- issue: Sắc thái giả vờ của ὡς
  choice: làm như
  alternative: với lý do là; giả vờ rằng
  rationale: ‘Làm như’ giữ được sự căng thẳng giữa mục đích được trình bày và ý đồ thực sự, nhưng không biến hàm ý văn cảnh thành một lời khẳng định mạnh hơn nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng ‘ngài’ vì người cháu của Phao-lô đang thưa với viên chỉ huy; dùng ‘ông ấy’ để chỉ Phao-lô. Câu giữ cấu trúc lời báo cáo và sắc thái mục đích giả tạo của nguyên văn.
