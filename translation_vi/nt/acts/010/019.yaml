source:
  edition: SBLGNT
  text: τοῦ δὲ Πέτρου διενθυμουμένου περὶ τοῦ ὁράματος εἶπεν ⸂αὐτῷ τὸ πνεῦμα⸃· Ἰδοὺ ⸀ἄνδρες ⸀ζητοῦντές σε·
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/019.yaml
  text: While Peter was still pondering the vision, the Spirit said to him, “Look, men are seeking you.”
translation:
  language: vi
  text: 'Trong khi Phi-e-rơ đang suy ngẫm về khải tượng ấy, Thánh Linh phán với ông: “Kìa, có mấy người đàn ông đang tìm ông.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “đang kiếm ông.”
    reason: ζητέω có thể được diễn đạt là “tìm” hoặc “kiếm” một người trong ngữ cảnh này.
lexical_decisions:
- source_word: διενθυμουμένου
  choice: đang suy ngẫm
  rationale: Diễn tả sự suy xét nội tâm đang tiếp diễn; cách nói tự nhiên và trang trọng, không cần thêm “vẫn” vì sắc thái tiếp diễn đã được thể hiện bằng “đang”.
- source_word: περὶ τοῦ ὁράματος
  choice: về khải tượng ấy
  rationale: Giữ rõ giới từ περὶ (“về”) và dùng “ấy” để chỉ khải tượng vừa được thuật lại trong văn cảnh.
- source_word: τὸ πνεῦμα
  choice: Thánh Linh
  rationale: Trong văn cảnh Công Vụ 10, danh từ có mạo từ chỉ chính Thánh Linh đang hướng dẫn Phi-e-rơ. Tiếng Việt cần một danh xưng xác định; lựa chọn này làm rõ đối tượng mà không thay đổi vai trò thần học trong trình thuật.
- source_word: εἶπεν αὐτῷ
  choice: phán với ông
  rationale: “Phán” là cách diễn đạt trang trọng, tự nhiên khi chủ thể thần linh trực tiếp nói; “với ông” thể hiện đại từ gián tiếp αὐτῷ.
- source_word: Ἰδοὺ
  choice: Kìa
  rationale: Là từ thu hút sự chú ý, gần với chức năng diễn ngôn của ἰδού và tự nhiên hơn “hãy xem” trong lời nói tiếng Việt.
- source_word: ἄνδρες
  choice: mấy người
  rationale: Dạng số nhiều bất định trong ngữ cảnh chỉ một nhóm người đang hiện diện; tiếng Việt tự nhiên dùng “có mấy người”. Giới tính nam đã rõ từ văn cảnh gần, nhưng câu này không cần gượng ép thành “mấy người đàn ông”.
- source_word: ζητοῦντές σε
  choice: đang tìm ông
  rationale: ζητέω ở đây có nghĩa thông dụng là tìm một người; “đang tìm ông” vừa chính xác vừa tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Đối tượng của τὸ πνεῦμα
  choice: Thánh Linh
  alternative: Linh; Thần Khí
  rationale: Toàn bộ văn cảnh Công Vụ 10 trình bày Đấng đang nói là Thánh Linh hướng dẫn sứ mạng đến với dân ngoại. Bản dịch dùng danh xưng quen thuộc trong tiếng Việt, không coi đây chỉ là một sự thôi thúc tinh thần không xác định.
- issue: Cách thể hiện giới tính của ἄνδρες
  choice: mấy người
  alternative: mấy người đàn ông
  rationale: ἀνήρ xác định các nhân vật là nam giới, nhưng trong tiếng Việt, “mấy người” là cách chỉ nhóm nam đã được xác định tự nhiên hơn trong lời trực tiếp. Không có hàm ý biến danh từ này thành một từ chỉ người bao quát mọi giới.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Kìa” để giữ lực thu hút chú ý của Ἰδού; “Phi-e-rơ” theo lối phiên âm Kinh Thánh tiếng Việt quen thuộc. Đại từ “ông” phù hợp với người trưởng thành được nhắc đến trong lời nói trực tiếp.
