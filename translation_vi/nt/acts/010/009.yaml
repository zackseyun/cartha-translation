id: ACT.10.9
reference: Acts 10:9
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Τῇ δὲ ἐπαύριον ὁδοιπορούντων ἐκείνων καὶ τῇ πόλει ἐγγιζόντων ἀνέβη Πέτρος ἐπὶ τὸ δῶμα προσεύξασθαι περὶ ὥραν ἕκτην.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/009.yaml
  text: On the next day[a], while those men were traveling and drawing near to the city, Peter went up on the housetop to pray, about the sixth hour.
translation:
  language: vi
  text: Ngày hôm sau, khi những người ấy đang đi đường và đến gần thành, Phi-e-rơ lên sân thượng để cầu nguyện, vào khoảng giờ thứ sáu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tức là khoảng giữa trưa theo cách tính giờ ban ngày của người Do Thái.
    reason: cultural_note
lexical_decisions:
- source_word: Τῇ δὲ ἐπαύριον
  choice: Ngày hôm sau
  rationale: Diễn đạt tự nhiên cụm từ chỉ thời gian “vào ngày hôm sau”; không thêm một từ nối nặng nghĩa cho δέ, vì mạch kể tiếng Việt đã đủ rõ.
- source_word: ὁδοιπορούντων ἐκείνων
  choice: khi những người ấy đang đi đường
  rationale: Giữ quan hệ đồng thời của kết cấu sở hữu cách tuyệt đối và tính xác định của ἐκείνων, chỉ những người được nhắc đến trước đó.
- source_word: τῇ πόλει ἐγγιζόντων
  choice: và đến gần thành
  rationale: Phản ánh trực tiếp ý nghĩa của ἐγγίζω và dùng “thành” theo văn phong kể chuyện trang trọng, dễ hiểu.
- source_word: ἀνέβη
  choice: lên
  rationale: Động từ kể chuyện đơn giản, diễn tả chuyển động lên phần mái bằng của ngôi nhà.
- source_word: ἐπὶ τὸ δῶμα
  choice: sân thượng
  rationale: Trong bối cảnh kiến trúc vùng này, δῶμα là phần mái bằng có thể đi lại và sử dụng; “sân thượng” truyền đạt công năng ấy tự nhiên hơn “nóc nhà”.
- source_word: προσεύξασθαι
  choice: để cầu nguyện
  rationale: Giữ rõ ý nghĩa mục đích của động từ nguyên mẫu sau ἀνέβη.
- source_word: περὶ ὥραν ἕκτην
  choice: vào khoảng giờ thứ sáu
  rationale: Giữ cách tính giờ theo văn hóa nguồn và sắc thái xấp xỉ của περί; chú thích giải thích tương đương thời gian hiện đại.
theological_decisions: []
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dấu chú thích được đặt sau “giờ thứ sáu”, là cụm từ mà chú thích giải nghĩa; vị trí này sửa sự lệch marker trong lớp tham khảo tiếng Anh.
