id: ACT.10.3
reference: Acts 10:3
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἶδεν ἐν ὁράματι φανερῶς ὡσεὶ ⸀περὶ ὥραν ἐνάτην τῆς ἡμέρας ἄγγελον τοῦ θεοῦ εἰσελθόντα πρὸς αὐτὸν καὶ εἰπόντα αὐτῷ· Κορνήλιε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/003.yaml
  text: He saw clearly in a vision[a], about the ninth hour of the day, an angel of God coming in to him and saying to him[b], “Cornelius.”
translation:
  language: vi
  text: 'Trong một khải tượng, ông thấy rõ[a], vào khoảng giờ thứ chín trong ngày[b], một thiên sứ của Đức Chúa Trời bước vào chỗ ông và nói với ông: “Cọt-nây!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “ông thấy một cách tỏ tường.”'
    reason: lexical_alternative
  - marker: b
    text: Tức khoảng ba giờ chiều theo cách tính giờ hiện nay.
    reason: cultural_note
lexical_decisions:
- source_word: εἶδεν ἐν ὁράματι φανερῶς
  choice: Trong một khải tượng, ông thấy rõ
  rationale: Giữ động từ tri giác cụ thể “thấy”, diễn đạt ἐν ὁράματι tự nhiên bằng “trong một khải tượng”, và bảo toàn sắc thái φανερῶς rằng điều ông thấy là rõ ràng, tỏ tường.
- source_word: ὡσεὶ περὶ ὥραν ἐνάτην τῆς ἡμέρας
  choice: vào khoảng giờ thứ chín trong ngày
  rationale: Giữ cách tính giờ của văn bản nguồn; “vào khoảng” phản ánh lực xấp xỉ của ὡσεὶ và περὶ. Chú thích cung cấp giờ tương đương theo cách tính hiện đại.
- source_word: ἄγγελον τοῦ θεοῦ
  choice: một thiên sứ của Đức Chúa Trời
  rationale: Trong bối cảnh khải tượng, ἄγγελος chỉ một sứ giả thiên giới. “Thiên sứ” là cách gọi trang trọng, quen thuộc và không thêm diễn giải ngoài văn bản.
- source_word: εἰσελθόντα πρὸς αὐτὸν
  choice: bước vào chỗ ông
  rationale: Diễn đạt chuyển động đi vào của εἰσελθόντα, đồng thời dùng lối nói tự nhiên trong tiếng Việt để chỉ thiên sứ tiến vào nơi Cọt-nây đang ở.
- source_word: καὶ εἰπόντα αὐτῷ
  choice: và nói với ông
  rationale: Tiếng Việt tự nhiên dùng chuỗi động từ hữu hạn để chuyển hai phân từ phối hợp của tiếng Hy Lạp mà vẫn giữ đúng trình tự hành động.
- source_word: Κορνήλιε
  choice: Cọt-nây
  rationale: Dùng dạng tên riêng Việt hóa quen thuộc; dấu chấm than truyền đạt lời gọi trực tiếp của dạng hô cách.
theological_decisions:
- issue: Bản chất của ἄγγελος trong ngữ cảnh
  choice: một thiên sứ, tức sứ giả thiên giới
  alternative: một sứ giả loài người
  rationale: Khung cảnh được xác định là một khải tượng và nhân vật được gọi là “của Đức Chúa Trời”, nên nghĩa thiên giới là nghĩa tự nhiên trong ngữ cảnh; bản dịch không thêm mô tả về bản thể hay chức vụ.
- issue: Phạm vi bổ nghĩa của φανερῶς
  choice: 'bổ nghĩa cho việc Cọt-nây thấy: “ông thấy rõ”'
  alternative: mô tả khải tượng là rõ ràng, tỏ tường
  rationale: Vị trí và chức năng trạng từ cho phép hiểu là cách ông thấy; hai cách hiểu gần nhau về nghĩa, nên chú thích giữ lại khả năng diễn đạt thay thế mà không biến nó thành một khác biệt thần học.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ cách tính “giờ thứ chín” để minh bạch với văn bản nguồn, kèm chú thích quy đổi. Tránh lối “đến với ông” có thể làm mờ động từ chỉ sự đi vào; “bước vào chỗ ông” vừa giữ chuyển động vừa tự nhiên trong tiếng Việt.
