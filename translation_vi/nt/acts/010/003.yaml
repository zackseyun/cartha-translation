  source_fidelity: 'Bản dịch chuyển đạt đầy đủ các thành tố chính của câu Hy Lạp: Cọt-nây thấy rõ trong một khải tượng; thời điểm được nói xấp xỉ theo “giờ thứ chín”; một thiên sứ của Đức Chúa Trời đi vào nơi ông đang ở và gọi tên ông. “Vào khoảng” phản ánh thích đáng cả ὡσεὶ lẫn περὶ, và chú thích quy đổi sang khoảng 3 giờ chiều là chính xác theo cách tính giờ cổ thông thường.'
  naturalness: Câu văn tự nhiên, trang trọng và phù hợp tiếng Việt hiện đại. Trật tự “Trong một khải tượng, ông thấy rõ” rõ nghĩa; “bước vào chỗ ông” diễn đạt được chuyển động đi vào của εἰσελθόντα mà không thêm chi tiết không có trong bản văn. Lời gọi trực tiếp “Cọt-nây!” là tự nhiên.
  terminology: “Khải tượng,” “thiên sứ,” và “Đức Chúa Trời” nhất quán với văn phong Kinh Thánh tiếng Việt trang trọng. Dạng tên “Cọt-nây” là cách Việt hóa quen dùng. Không có diễn giải giáo phái được thêm vào; “thiên sứ” phù hợp rõ ràng với ngữ cảnh khải tượng và cụm “của Đức Chúa Trời.”
