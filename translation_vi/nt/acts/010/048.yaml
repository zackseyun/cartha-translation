id: ACT.10.48
reference: Acts 10:48
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: προσέταξεν ⸀δὲ αὐτοὺς ⸂ἐν τῷ ὀνόματι Ἰησοῦ Χριστοῦ βαπτισθῆναι⸃. τότε ἠρώτησαν αὐτὸν ἐπιμεῖναι ἡμέρας τινάς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/048.yaml
  text: So he ordered them to be baptized in the name of Jesus the Messiah[a]. Then they asked him to remain for some days.
translation:
  language: vi
  text: Vì vậy, ông truyền cho họ chịu phép báp-têm nhân danh Giê-su, Đấng Mê-si-a[a]. Sau đó, họ xin ông ở lại vài ngày.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay theo cách gọi truyền thống hơn: “Giê-su Christ.”'
    reason: alternative_reading
lexical_decisions:
- source_word: προσέταξεν
  choice: truyền
  rationale: Động từ diễn tả một chỉ thị có thẩm quyền; “truyền” tự nhiên trong văn thuật chuyện và giữ được sức nặng của nguyên văn.
- source_word: δὲ
  choice: Vì vậy
  rationale: Ở đây δέ nối tiếp diễn biến và có sắc thái hệ quả từ sự việc trước đó, không biểu thị tương phản mạnh.
- source_word: ἐν τῷ ὀνόματι
  choice: nhân danh
  rationale: Cách nói quen thuộc này giữ được các sắc thái về thẩm quyền, sự quy thuộc và việc cầu khẩn danh mà không thu hẹp nghĩa.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Chúa Giê-su, Đấng Mê-si-a
  rationale: Χριστός mang nghĩa tước hiệu “Đấng Mê-si-a”; thêm “Chúa” theo cách gọi tự nhiên, trang trọng trong tiếng Việt, còn dấu phẩy làm rõ quan hệ đồng vị.
- source_word: βαπτισθῆναι
  choice: chịu phép báp-têm
  rationale: Giữ thể bị động của động từ và dùng thuật ngữ Kinh Thánh phổ biến, không ấn định riêng một phương thức thực hiện.
- source_word: τότε
  choice: Sau đó
  rationale: Đánh dấu sự kiện kế tiếp trong trình tự kể chuyện một cách tự nhiên.
- source_word: ἠρώτησαν
  choice: xin
  rationale: Trong ngữ cảnh này, động từ có nghĩa đưa ra lời thỉnh cầu; “xin” tự nhiên hơn “hỏi” trong tiếng Việt.
- source_word: ἐπιμεῖναι
  choice: ở lại
  rationale: Diễn đạt rõ việc tiếp tục lưu lại tại nơi ấy trong một khoảng thời gian.
- source_word: ἡμέρας τινάς
  choice: vài ngày
  rationale: Giữ khoảng thời gian không xác định; “vài ngày” là cách nói tự nhiên trong tiếng Việt hiện đại.
theological_decisions:
- issue: Cách dịch Χριστοῦ trong công thức báp-têm
  choice: Đấng Mê-si-a
  alternative: Đấng Christ
  rationale: Ở đây Χριστός có chức năng tước hiệu và mang nghĩa “Đấng Mê-si-a”; bản dịch chính chuyển nghĩa tước hiệu, đồng thời ghi cách gọi truyền thống trong chú thích.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Câu văn giữ nhịp thuật chuyện của Lu-ca; “truyền”, “nhân danh” và “chịu phép báp-têm” duy trì sắc thái Kinh Thánh quen thuộc mà không thiên về một truyền thống hệ phái cụ thể.
