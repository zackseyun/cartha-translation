id: ACT.10.39
reference: Acts 10:39
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ⸀ἡμεῖς μάρτυρες πάντων ὧν ἐποίησεν ἔν τε τῇ χώρᾳ τῶν Ἰουδαίων ⸀καὶ Ἰερουσαλήμ· ὃν καὶ ἀνεῖλαν κρεμάσαντες ἐπὶ ξύλου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/039.yaml
  text: And we are witnesses of all that he did both in the land of the Jews and in Jerusalem[a]. They also put him to death by hanging him on a tree.
translation:
  language: vi
  text: Chúng tôi là nhân chứng về mọi việc Ngài đã làm trong miền đất của người Do Thái và tại Giê-ru-sa-lem. Họ cũng đã giết Ngài bằng cách treo Ngài trên cây.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “trên gỗ”; theo nghĩa giải thích là “trên thập tự giá”. Tiếng Hy Lạp dùng từ có nghĩa là “cây” hoặc “gỗ”, có lẽ gợi lại Phục Truyền Luật Lệ Ký 21:23.
    reason: lexical_alternative
lexical_decisions:
- source_word: μάρτυρες
  choice: nhân chứng
  rationale: Cách dịch tự nhiên và chuẩn xác trong ngữ cảnh lời chứng tận mắt của các sứ đồ.
- source_word: πάντων ὧν ἐποίησεν
  choice: về mọi việc Ngài đã làm
  rationale: Giữ được ý bao quát của πάντων và diễn đạt tự nhiên bằng tiếng Việt.
- source_word: ἔν τε τῇ χώρᾳ τῶν Ἰουδαίων
  choice: trong khắp miền đất của người Do Thái
  rationale: χώρα chỉ miền đất, vùng hoặc lãnh thổ; cách dịch này không đồng nhất quá hẹp với tên tỉnh Giu-đê và cụm 'khắp miền đất' phù hợp với ý phạm vi hoạt động.
- source_word: Ἰουδαίων
  choice: người Do Thái
  rationale: Giữ nghĩa dân tộc-tôn giáo thông dụng, đồng thời không loại trừ sắc thái địa lý trong ngữ cảnh.
- source_word: καὶ Ἰερουσαλήμ
  choice: và tại Giê-ru-sa-lem
  rationale: Lặp lại quan hệ từ theo lối diễn đạt tự nhiên của tiếng Việt.
- source_word: ἀνεῖλαν
  choice: đã giết Ngài
  rationale: Diễn đạt trực tiếp nghĩa 'giết, trừ khử' của động từ, không thêm sắc thái xét xử mà nguyên văn không nói rõ.
- source_word: κρεμάσαντες
  choice: bằng cách treo Ngài
  rationale: Hiểu phân từ như phương cách gắn với động từ chính, phù hợp cú pháp và tự nhiên trong tiếng Việt.
- source_word: ἐπὶ ξύλου
  choice: trên cây gỗ
  rationale: Bảo lưu từ ξύλον, vốn có thể chỉ cây hoặc gỗ, cùng khả năng gợi lại Phục Truyền Luật Lệ Ký 21:23, thay vì giải nghĩa thẳng thành 'thập tự giá'.
theological_decisions:
- issue: Cách dịch ξύλου trong ngữ cảnh đóng đinh
  choice: trên cây gỗ
  alternative: trên thập tự giá; trên gỗ
  rationale: Nguyên văn dùng ξύλον chứ không dùng σταυρός. 'Cây gỗ' giữ được hình ảnh và âm vang có thể có từ Phục Truyền Luật Lệ Ký 21:23 mà không giải quyết thay người đọc mối liên hệ thần học.
- issue: Chủ thể của ἀνεῖλαν
  choice: Họ cũng đã giết Ngài
  alternative: Người ta cũng đã giết Ngài
  rationale: Động từ ngôi thứ ba số nhiều có chủ thể hàm ẩn. Dùng 'họ' bảo lưu cách quy chiếu của nguyên văn mà không xác định thêm một nhóm cụ thể.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng 'Ngài' để chỉ Chúa Giê-su theo tập quán tiếng Việt trang trọng; tên địa danh viết theo dạng quen thuộc 'Giê-ru-sa-lem'. Dấu chú thích [a] được đặt ngay sau cụm từ cần giải thích.
