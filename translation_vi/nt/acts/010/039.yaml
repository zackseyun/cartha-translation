revisions:
- from: Chúng tôi là nhân chứng về mọi việc Ngài đã làm trong khắp miền đất của người Do Thái và tại Giê-ru-sa-lem. Họ cũng đã giết Ngài bằng cách treo Ngài trên cây gỗ.[a]
  to: Chúng tôi là nhân chứng về mọi việc Ngài đã làm trong miền đất của người Do Thái và tại Giê-ru-sa-lem. Họ cũng đã giết Ngài bằng cách treo Ngài trên cây.[a]
  rationale: Bỏ “khắp” để không thêm ý bao quát địa lý ngoài χώρα, và đổi “cây gỗ” thành “cây” để phản ánh trực tiếp ξύλον mà vẫn giữ sự mơ hồ từ vựng qua chú thích. Các phần còn lại trung thành với cú pháp, chủ thể hàm ẩn và giọng văn của nguyên văn.
