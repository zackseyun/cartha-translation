  text: Ἀνὴρ δέ ⸀τις ἐν Καισαρείᾳ ὀνόματι Κορνήλιος, ἑκατοντάρχης ἐκ σπείρης τῆς καλουμένης Ἰταλικῆς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/001.yaml
  text: There was a man in Caesarea named Cornelius[a], a centurion from the cohort called the Italian Cohort[b],
translation:
  language: vi
  text: Tại Sê-sa-rê có một người tên là Cọt-nây[a], một viên bách phu trưởng thuộc một đội quân mang tên Đội I-ta-li-a[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “một người kia ở Sê-sa-rê.” Tiếng Hy Lạp dùng một cách nói bất định để giới thiệu một nhân vật mới.'
    reason: lexical_alternative
  - marker: b
    text: Từ Hy Lạp σπεῖρα chỉ một cohort, tức một đơn vị quân đội La Mã. Tên “Đội I-ta-li-a” có lẽ nói đến một đơn vị có liên hệ với I-ta-li-a hoặc gồm những binh sĩ người I-ta-li-a.
    reason: cultural_note
lexical_decisions:
- source_word: Ἀνὴρ δέ τις
  choice: có một người
  rationale: Cách giới thiệu tự nhiên trong tiếng Việt đối với một nhân vật mới; τις giữ tính bất định, còn δέ chỉ chuyển nhẹ sang cảnh mới nên không cần dịch thành một từ nối riêng.
- source_word: ἐν Καισαρείᾳ
  choice: Tại Sê-sa-rê
  rationale: Diễn đạt địa điểm tự nhiên; dùng dạng phiên âm Kinh Thánh quen thuộc trong tiếng Việt.
- source_word: ὀνόματι Κορνήλιος
  choice: tên là Cọt-nây
  rationale: ὀνόματι với tên riêng được chuyển thành cấu trúc tiếng Việt thông dụng “tên là”; tên riêng được phiên âm theo cách quen thuộc.
- source_word: ἑκατοντάρχης
  choice: một viên đại đội trưởng
  rationale: Chỉ sĩ quan La Mã thường gọi là centurion; “đại đội trưởng” dễ hiểu và gần đúng chức năng lịch sử hơn cách dịch sát chữ “trưởng một trăm người”.
- source_word: ἐκ σπείρης
  choice: thuộc đơn vị
  rationale: ἐκ diễn tả sự trực thuộc; σπεῖρα là một đơn vị quân đội La Mã. Dùng “đơn vị” ở đây để câu tự nhiên, còn chú thích giải thích thuật ngữ lịch sử.
- source_word: τῆς καλουμένης Ἰταλικῆς
  choice: được gọi là Đội quân I-ta-li-a
  rationale: Giữ ý của καλουμένης và biểu thị đây là tên gọi của đơn vị; “I-ta-li-a” không quyết định quá mức đơn vị này gồm toàn người Ý hay chỉ có liên hệ với Ý.
