translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Câu giữ cấu trúc giới thiệu nhân vật của lời kể, không thêm từ nối thời gian. Các thuật ngữ quân sự được diễn đạt rõ trong chính văn và bổ sung bối cảnh lịch sử ở chú thích.
