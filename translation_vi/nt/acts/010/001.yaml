revisions:
- from: Tại Sê-sa-rê có một người tên là Cọt-nây[a], một viên đại đội trưởng thuộc đơn vị được gọi là Đội quân I-ta-li-a[b].
  to: Tại Sê-sa-rê có một người tên là Cọt-nây[a], một viên bách phu trưởng thuộc một đội quân mang tên Đội I-ta-li-a[b].
  rationale: Sửa danh xưng sĩ quan để tránh đồng nhất chức vụ La Mã với cấp chỉ huy hiện đại, và làm rõ trong chú thích thuật ngữ σπεῖρα/cơ cấu cohort. Các yếu tố còn lại của bản dịch, kể cả tính bất định và tên gọi đơn vị “I-ta-li-a,” được giữ nguyên về nghĩa.
  reviewer_model: gpt-5.6-terra
