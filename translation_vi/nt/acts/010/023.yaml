source:
  edition: SBLGNT
  text: εἰσκαλεσάμενος οὖν αὐτοὺς ἐξένισεν. Τῇ δὲ ἐπαύριον ⸀ἀναστὰς ἐξῆλθεν σὺν αὐτοῖς, καί τινες τῶν ἀδελφῶν τῶν ἀπὸ Ἰόππης συνῆλθον αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/023.yaml
  text: So he invited them in and gave them lodging[a]. The next day he got up and went out with them[b], and some of the brothers from Joppa went with him.
translation:
  language: vi
  text: Vậy, Phi-e-rơ mời họ vào và cho họ ở lại[a]. Hôm sau, ông đứng dậy và ra đi cùng họ. Một số anh em từ Giốp-bê cũng đi cùng ông[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “tiếp đãi họ” hoặc “cho họ trọ”; từ Hy Lạp ở đây nói đến việc bày tỏ lòng hiếu khách bằng cách cung cấp chỗ ở.'
    reason: lexical_alternative
  - marker: b
    text: “Anh em” dịch danh từ giống đực số nhiều ἀδελφῶν. Trong cách dùng của các tín hữu thời đầu, từ này đôi khi có thể chỉ các tín hữu nói chung, tức là “anh chị em”.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσκαλεσάμενος
  choice: mời họ vào
  rationale: Diễn đạt tự nhiên hành động Phi-e-rơ gọi những người ấy vào nơi mình đang ở, đồng thời giữ sắc thái tiếp đón.
- source_word: οὖν
  choice: Vậy
  rationale: Nối hành động này với cuộc trao đổi ngay trước đó như một kết quả trong mạch kể chuyện.
- source_word: ἐξένισεν
  choice: cho họ ở lại
  rationale: Trong ngữ cảnh, động từ chỉ việc tiếp đãi bằng cách cung cấp chỗ ở; cách dịch này cụ thể và tự nhiên trong tiếng Việt.
- source_word: Τῇ δὲ ἐπαύριον
  choice: Hôm sau
  rationale: Cách diễn đạt thời gian gọn, rõ và tự nhiên trong văn kể chuyện hiện đại.
- source_word: ἀναστὰς
  choice: đứng dậy
  rationale: Giữ nghĩa cụ thể của phân từ mà không đồng nhất nó với hành động lên đường được diễn tả tiếp theo.
- source_word: ἐξῆλθεν σὺν αὐτοῖς
  choice: đi cùng họ
  rationale: Trong ngữ cảnh khởi hành, cụm này diễn tả tự nhiên việc Phi-e-rơ ra đi cùng các sứ giả; tránh lối dịch cứng là “đi ra với họ”.
- source_word: τινες τῶν ἀδελφῶν
  choice: một số anh em
  rationale: “Một số” thể hiện đại từ bất định; “anh em” giữ hình thức giống đực số nhiều và cách gọi quen thuộc giữa các tín hữu.
- source_word: τῶν ἀπὸ Ἰόππης
  choice: từ Giốp-bê
  rationale: Xác định nơi xuất thân của nhóm anh em bằng cấu trúc tiếng Việt ngắn gọn.
- source_word: συνῆλθον αὐτῷ
  choice: cũng đi cùng ông
  rationale: Trong hành trình này, động từ mang nghĩa tháp tùng; “cũng” làm rõ rằng ngoài các sứ giả còn có một số tín hữu đi với Phi-e-rơ.
theological_decisions:
- issue: Phạm vi chỉ người của ἀδελφῶν trong cộng đồng tín hữu
  choice: anh em
  alternative: anh chị em; các tín hữu
  rationale: Bản văn dùng danh từ giống đực số nhiều. “Anh em” bảo toàn hình thức ấy trong câu chính, trong khi chú thích ghi nhận rằng cách dùng của các tín hữu thời đầu đôi khi có thể chỉ cộng đồng rộng hơn.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Phi-e-rơ” và “Giốp-bê” theo lối phiên âm tên riêng quen thuộc trong Kinh Thánh tiếng Việt. Cấu trúc câu giữ nhịp kể chuyện sáng rõ; đại từ “ông” tránh lặp tên nhưng vẫn xác định Phi-e-rơ là chủ thể.
