  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ ὁ Κορνήλιος ἔφη· Ἀπὸ τετάρτης ἡμέρας μέχρι ταύτης τῆς ὥρας ⸀ἤμην τὴν ⸀ἐνάτην προσευχόμενος ἐν τῷ οἴκῳ μου, καὶ ἰδοὺ ἀνὴρ ἔστη ἐνώπιόν μου ἐν ἐσθῆτι λαμπρᾷ
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/030.yaml
  text: And Cornelius said, “Four days ago, up to this hour, I was praying at the ninth hour in my house, and behold, a man stood before me in bright clothing.”
translation:
  language: vi
  text: 'Cọt-nây nói: “Cách đây bốn ngày, đúng vào giờ này, tôi đang cầu nguyện tại nhà mình, vào giờ thứ chín[a]. Kìa, một người đàn ông mặc y phục sáng chói đứng trước mặt tôi.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tức là khoảng ba giờ chiều.
    reason: cultural_note
lexical_decisions:
- source_word: ἔφη
  choice: nói
  rationale: Động từ aorist dẫn lời trong văn kể chuyện được diễn đạt tự nhiên bằng “nói”.
- source_word: Ἀπὸ τετάρτης ἡμέρας μέχρι ταύτης τῆς ὥρας
  choice: Bốn ngày trước, cũng vào giờ này
  rationale: Cách diễn đạt này chuyển tải khoảng thời gian bốn ngày và mối liên hệ với chính giờ hiện tại, đồng thời tự nhiên trong tiếng Việt.
- source_word: ἤμην ... προσευχόμενος
  choice: tôi đang cầu nguyện
  rationale: Cấu trúc imperfect diễn tả hành động đang tiếp diễn trong quá khứ; “đang cầu nguyện” giữ rõ sắc thái ấy.
- source_word: τὴν ἐνάτην
  choice: vào giờ thứ chín
  rationale: Giữ cách tính giờ của bối cảnh nguồn; giờ hiện đại tương ứng được giải thích trong chú thích.
- source_word: ἐν τῷ οἴκῳ μου
  choice: trong nhà mình
  rationale: Diễn đạt trực tiếp địa điểm ở bên trong ngôi nhà của người nói; “mình” quy chiếu tự nhiên về chủ ngữ “tôi” trong tiếng Việt.
- source_word: ἰδοὺ
  choice: Kìa
  rationale: Giữ chức năng gây chú ý và làm cho lời thuật trở nên sống động mà không thêm ý “bỗng nhiên” vốn không được nói rõ.
- source_word: ἀνὴρ
  choice: một người
  rationale: Trong ngữ cảnh hiện ra dưới hình dạng con người, “một người” là cách nói tự nhiên; tiếng Việt không bắt buộc đánh dấu giới tính như danh từ Hy Lạp ἀνήρ.
- source_word: ἔστη ἐνώπιόν μου
  choice: đứng trước mặt tôi
  rationale: Giữ hình ảnh nhân vật đứng ở vị trí ngay trước người nói.
- source_word: ἐν ἐσθῆτι λαμπρᾷ
  choice: mặc áo sáng chói
  rationale: “Áo” diễn đạt tự nhiên ἐσθής trong văn cảnh, còn “sáng chói” giữ sức gợi thị giác của λαμπρός.
theological_decisions:
- issue: Cách dịch τὴν ἐνάτην
  choice: vào giờ thứ chín
  alternative: vào khoảng ba giờ chiều
  rationale: Giữ cách chỉ giờ của văn hóa nguồn trong chính văn, còn quy đổi sang giờ hiện đại trong chú thích để người đọc dễ hiểu.
- issue: Thân phận của ἀνὴρ
  choice: một người
  alternative: một thiên sứ
  rationale: Câu này mô tả diện mạo mà Cọt-nây trông thấy chứ không trực tiếp dùng từ “thiên sứ”; không đưa sự nhận diện theo ngữ cảnh vào chính văn.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Giữ thành ngữ thời gian của bối cảnh cổ cùng tiếng gọi chú ý “Kìa”; dùng dấu câu để lời thuật tiếng Việt trôi chảy.
