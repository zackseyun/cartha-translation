id: ACT.10.34
reference: Acts 10:34
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἀνοίξας δὲ Πέτρος τὸ στόμα εἶπεν· Ἐπ’ ἀληθείας καταλαμβάνομαι ὅτι οὐκ ἔστιν προσωπολήμπτης ὁ θεός,
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/034.yaml
  text: Then Peter opened his mouth and said[b][a], “Truly I understand that God is not one who shows partiality,”
translation:
  language: vi
  text: 'Bấy giờ, Phi-e-rơ mở miệng nói: “Quả thật, tôi nhận ra rằng Đức Chúa Trời không thiên vị ai.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát hơn: “Đức Chúa Trời không phải là Đấng vị nể người ta,” một thành ngữ có nghĩa là Ngài không thiên vị hay ưu ái người này hơn người khác.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀνοίξας ... τὸ στόμα
  choice: mở miệng nói
  rationale: Giữ hình ảnh và sắc thái trang trọng của thành ngữ Hy Lạp, đồng thời vẫn tự nhiên trong tiếng Việt hiện đại.
- source_word: δὲ
  choice: Bấy giờ
  rationale: Diễn đạt bước chuyển tiếp trong mạch kể chuyện, tự nhiên hơn việc dịch máy móc bằng “và”.
- source_word: Ἐπ’ ἀληθείας
  choice: Quả thật
  rationale: Thể hiện lời xác nhận chân thành, mạnh mẽ và phù hợp với văn phong trang trọng.
- source_word: καταλαμβάνομαι
  choice: tôi nhận ra
  rationale: Trong ngữ cảnh, động từ diễn tả sự lĩnh hội hay đi đến chỗ nhận biết; “nhận ra” gợi đúng sự nhận thức vừa trở nên rõ ràng mà không thêm từ “nay” vốn không có trực tiếp trong nguyên văn.
- source_word: προσωπολήμπτης
  choice: không thiên vị ai
  rationale: Danh từ chỉ người xét theo bề ngoài hoặc đối xử thiên lệch. Cách diễn đạt này rõ nghĩa, tự nhiên và giữ trọng tâm là Đức Chúa Trời không ưu ái người này hơn người khác.
- source_word: ὁ θεός
  choice: Đức Chúa Trời
  rationale: Danh xưng tiếng Việt trang trọng, quen thuộc để dịch θεός trong văn bản Kinh Thánh.
theological_decisions:
- issue: Diễn đạt lời khẳng định về sự không thiên vị của Đức Chúa Trời mà không áp đặt hệ thống thần học về sau
  choice: Đức Chúa Trời không thiên vị ai
  alternative: Đức Chúa Trời không phải là Đấng vị nể người ta
  rationale: Bản dịch nêu rõ đặc tính không thiên vị của Đức Chúa Trời trong ngữ cảnh tiếp nhận người thuộc mọi dân tộc, nhưng không mở rộng hoặc thu hẹp mệnh đề theo một lập trường giáo phái.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Giữ thành ngữ “mở miệng nói” để bảo toàn sức nặng tu từ của nguyên văn; dùng “không thiên vị ai” để truyền đạt thành ngữ Hy Lạp một cách tự nhiên.
