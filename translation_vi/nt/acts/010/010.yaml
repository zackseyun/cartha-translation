source:
  edition: SBLGNT
  text: ἐγένετο δὲ πρόσπεινος καὶ ἤθελεν γεύσασθαι· παρασκευαζόντων δὲ ⸀αὐτῶν ⸀ἐγένετο ἐπ’ αὐτὸν ἔκστασις,
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/010.yaml
  text: He became very hungry and wanted to eat[a]; but while they were preparing it[b], a trance came over him.
translation:
  language: vi
  text: Ông trở nên rất đói và muốn ăn[a]. Nhưng trong khi họ đang chuẩn bị thức ăn, ông rơi vào trạng thái xuất thần[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “muốn nếm chút gì”; động từ Hy Lạp có nghĩa đen là “nếm”, nhưng tại đây chỉ việc ăn.
    reason: lexical_alternative
  - marker: b
    text: Từ Hy Lạp chỉ một trạng thái ý thức khác thường; tại đây trạng thái ấy gắn với việc nhận khải tượng.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ... πρόσπεινος
  choice: trở nên rất đói
  rationale: Diễn đạt sự chuyển sang trạng thái đói, đồng thời giữ sắc thái nhấn mạnh của πρόσπεινος mạnh hơn từ “đói” đơn thuần.
- source_word: ἤθελεν γεύσασθαι
  choice: muốn ăn
  rationale: Dù γεύομαι có nghĩa đen là “nếm”, trong ngữ cảnh này động từ chỉ việc ăn; cách dịch này tự nhiên và rõ nghĩa trong tiếng Việt hiện đại.
- source_word: παρασκευαζόντων ... αὐτῶν
  choice: trong khi người ta đang chuẩn bị thức ăn
  rationale: Kết cấu sở hữu cách tuyệt đối diễn tả hành động đang diễn ra đồng thời. “Người ta” giữ chủ thể số nhiều không xác định; “thức ăn” làm rõ tân ngữ được ngữ cảnh hàm ý.
- source_word: ἐγένετο ἐπ’ αὐτὸν
  choice: ông rơi vào
  rationale: Diễn đạt tự nhiên sự khởi phát của một trạng thái tác động đến Phi-e-rơ.
- source_word: ἔκστασις
  choice: trạng thái xuất thần
  rationale: Trong mạch văn Công Vụ, từ này chỉ một trạng thái ý thức khác thường gắn với khải tượng, không chỉ là kinh ngạc. “Xuất thần” là cách nói trang trọng, dễ hiểu trong tiếng Việt.
theological_decisions:
- issue: Bản chất trạng thái của Phi-e-rơ được gọi là ἔκστασις
  choice: trạng thái xuất thần
  alternative: cơn ngây ngất; trạng thái mê đi; sự kinh ngạc
  rationale: Ngữ cảnh ngay sau đó thuật lại một khải tượng, nên cách dịch phải chỉ một trạng thái tiếp nhận mặc khải khác thường, nhưng không xác định cơ chế tâm lý hay du nhập thuật ngữ huyền nhiệm về sau.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng và dễ hiểu. Dùng “ông” để nhắc lại Phi-e-rơ theo ngữ cảnh. Tránh “ngây ngất” vì trong tiếng Việt hiện đại dễ gợi cảm xúc sung sướng hơn là trạng thái tiếp nhận khải tượng.
