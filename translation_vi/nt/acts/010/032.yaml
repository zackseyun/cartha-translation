  text: πέμψον οὖν εἰς Ἰόππην καὶ μετακάλεσαι Σίμωνα ὃς ἐπικαλεῖται Πέτρος· οὗτος ξενίζεται ἐν οἰκίᾳ Σίμωνος βυρσέως παρὰ ⸀θάλασσαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/032.yaml
  text: Therefore send to Joppa and summon Simon[a], who is called Peter. He is lodging in the house of Simon, a tanner[b], by the sea.
translation:
  language: vi
  text: Vậy, hãy sai người đến Giốp-bê và mời Si-môn, người được gọi là Phi-e-rơ,[a] đến. Ông ấy đang trọ[b] tại nhà của Si-môn, một người thợ thuộc da, bên biển.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “hãy cho gọi Si-môn, người được gọi là Phi-e-rơ”; động từ Hy Lạp có nghĩa là cho gọi một người đến với mình.'
    reason: lexical_alternative
  - marker: b
    text: “Đang trọ” cho biết Phi-e-rơ đang được tiếp đón tại đó với tư cách là khách.
    reason: lexical_clarification
lexical_decisions:
- source_word: πέμψον οὖν εἰς Ἰόππην
  choice: Vậy, hãy sai người đến Giốp-bê
  rationale: Mệnh lệnh số ít πέμψον được diễn đạt tự nhiên trong tiếng Việt bằng “hãy sai người”; οὖν giữ quan hệ suy luận/tiếp nối bằng “Vậy”; εἰς chỉ hướng đến địa danh.
- source_word: μετακάλεσαι
  choice: mời ... đến
  rationale: Động từ trung cách mang nghĩa cho gọi một người đến với mình. “Mời ... đến” tự nhiên, giữ đích hướng về người nói mà không tạo sắc thái quyền lực quá mạnh như “triệu đến”.
- source_word: Σίμωνα ὃς ἐπικαλεῖται Πέτρος
  choice: Si-môn, người được gọi là Phi-e-rơ
  rationale: Giữ rõ tên Si-môn và tên gọi Phi-e-rơ, đồng thời phản ánh dạng bị động ἐπικαλεῖται mà không thêm ý “cũng” vốn không được nói trực tiếp.
- source_word: οὗτος ξενίζεται
  choice: Ông ấy đang trọ
  rationale: ξενίζεται cho biết Phi-e-rơ được tiếp đón như khách. “Đang trọ” vừa tự nhiên vừa gợi đúng tình trạng lưu trú tại nhà người khác.
- source_word: ἐν οἰκίᾳ Σίμωνος βυρσέως
  choice: tại nhà của Si-môn, một người thợ thuộc da
  rationale: Giữ danh từ “nhà” và nêu nghề nghiệp βυρσεύς rõ ràng. “Thợ thuộc da” là cách gọi hiện đại, chính xác cho người xử lý da thú.
- source_word: παρὰ θάλασσαν
  choice: gần biển
  rationale: παρά với đối cách ở đây chỉ vị trí sát/bên cạnh biển. “Gần biển” tự nhiên trong tiếng Việt và không hàm ý ở ngay trên bờ.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng cách phiên âm địa danh và tên riêng quen thuộc trong truyền thống Kinh Thánh tiếng Việt; tránh từ cổ “triệu” và diễn đạt nghề βυρσεύς bằng “người thợ thuộc da”.
