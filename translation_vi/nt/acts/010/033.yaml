  to: Vì vậy, tôi lập tức[a] sai người đi mời ông; ông đã làm phải khi đến. Nay, tất cả chúng tôi đều có mặt trước Đức Chúa Trời để nghe mọi điều Chúa[b] đã truyền cho ông.
  rationale: Chỉnh nhẹ lời khen để loại bỏ sự tăng cường không có trong nguồn và để câu tiếng Việt phản ánh trực tiếp hơn cấu trúc “ông đã làm phải khi đến”. Thay “Giờ đây” bằng “Nay” nhằm giữ chuyển tiếp diễn ngôn ngắn gọn, trang trọng tự nhiên. Các yếu tố khác, kể cả sự mơ hồ của “Chúa”, được giữ nguyên.
