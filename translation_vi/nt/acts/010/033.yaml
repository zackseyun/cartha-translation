  terminology: “Đức Chúa Trời” cho τοῦ θεοῦ và “Chúa” cho τοῦ κυρίου nhất quán với bản nháp. Giữ “Chúa” trong chính văn là cần thiết, vì văn bản Hy Lạp không nêu rõ danh xưng này là ai; chú thích nêu khả năng mà không áp đặt cách hiểu.
