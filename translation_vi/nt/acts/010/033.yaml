id: ACT.10.33
reference: Acts 10:33
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐξαυτῆς οὖν ἔπεμψα πρὸς σέ, σύ τε καλῶς ἐποίησας παραγενόμενος. νῦν οὖν πάντες ἡμεῖς ἐνώπιον τοῦ θεοῦ πάρεσμεν ἀκοῦσαι πάντα τὰ προστεταγμένα σοι ὑπὸ τοῦ ⸀κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/033.yaml
  text: So I sent for you at once[a], and you did well to come. Now then[b], we are all here before God to hear everything that has been commanded to you by the Lord.
translation:
  language: vi
  text: Vì vậy, tôi lập tức[a] sai người đi mời ông; ông đã làm phải khi đến. Nay, tất cả chúng tôi đều có mặt trước Đức Chúa Trời để nghe mọi điều Chúa[b] đã truyền cho ông.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “ngay tức khắc” hoặc “không chậm trễ”.
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn Hy Lạp là “Chúa”. Trong ngữ cảnh, danh xưng này có lẽ chỉ Chúa Giê-su, nhưng một số người hiểu theo nghĩa tổng quát là Đức Chúa Trời.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐξαυτῆς
  choice: lập tức
  rationale: Cụm trạng từ này diễn tả hành động được thực hiện ngay, không trì hoãn. “Lập tức” tự nhiên trong tiếng Việt hiện đại và giữ được tính khẩn trương.
- source_word: οὖν
  choice: Vì vậy
  rationale: Ở đầu câu, từ này nối hành động sai người của Cọt-nây với lời chỉ dẫn ông vừa nhận được và biểu thị kết quả hợp lý.
- source_word: ἔπεμψα πρὸς σέ
  choice: tôi đã … sai người đi mời ông
  rationale: Nghĩa đen là “tôi đã sai [người] đến với ông”; trong ngữ cảnh, Cọt-nây đã phái các sứ giả đến mời Phi-e-rơ. Cách dịch này diễn đạt rõ thành ngữ mà không thêm nội dung đáng kể.
- source_word: σύ τε
  choice: và ông
  rationale: Giữ mối liên kết giữa việc Cọt-nây sai người và việc Phi-e-rơ đáp lời đến.
- source_word: καλῶς ἐποίησας
  choice: là điều rất tốt
  rationale: Đây là lời nhìn nhận và tán thành hành động của Phi-e-rơ. Cách diễn đạt này tự nhiên hơn “ông đã làm tốt” trong ngữ cảnh tiếng Việt.
- source_word: παραγενόμενος
  choice: đến đây
  rationale: Phân từ chỉ việc Phi-e-rơ đã đến và hiện diện tại nhà Cọt-nây; “đây” làm rõ điểm đến vốn đã hiển nhiên trong ngữ cảnh.
- source_word: νῦν οὖν
  choice: Giờ đây
  rationale: Cụm từ chuyển lời nói sang hoàn cảnh hiện tại và mục đích của cuộc tụ họp. “Giờ đây” trang trọng vừa phải và tự nhiên.
- source_word: πάντες ἡμεῖς
  choice: tất cả chúng tôi đều
  rationale: Giữ sự nhấn mạnh vào toàn thể những người đang tụ họp.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: trước Đức Chúa Trời
  rationale: Diễn tả việc họ ý thức mình đang ở trong sự hiện diện của Đức Chúa Trời, đồng thời giữ cách nói ngắn gọn và trang nghiêm của nguyên văn.
- source_word: πάρεσμεν
  choice: có mặt
  rationale: Động từ có nghĩa là hiện diện; “có mặt” là cách nói tự nhiên, chính xác trong tiếng Việt.
- source_word: ἀκοῦσαι
  choice: để nghe
  rationale: Động từ nguyên mẫu chỉ mục đích của việc mọi người tụ họp.
- source_word: πάντα τὰ προστεταγμένα σοι
  choice: mọi điều … đã truyền cho ông
  rationale: Giữ cả ý toàn thể (“mọi điều”) lẫn thẩm quyền của mệnh lệnh (“đã truyền”), và thể hiện đúng người nhận mệnh lệnh là Phi-e-rơ.
theological_decisions:
- issue: Đối tượng được gọi là τοῦ κυρίου (“Chúa”)
  choice: Giữ nguyên là “Chúa”, không ghi rõ là Chúa Giê-su trong chính văn.
  alternative: Dịch là “Đức Chúa Trời”, hoặc diễn giải thành “Chúa Giê-su”.
  rationale: Nguyên văn chỉ dùng danh xưng “Chúa”. Trong bối cảnh Công Vụ 10, danh xưng này có lẽ chỉ Chúa Giê-su, nhưng cũng có người hiểu là Đức Chúa Trời, nhất là vì câu vừa nhắc đến việc hiện diện trước Đức Chúa Trời. Giữ “Chúa” bảo toàn sự hàm súc và không giải quyết thay điều nguyên văn để ngỏ.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang nghiêm nhưng dễ hiểu. Đại từ “tôi/ông” phù hợp với lời Cọt-nây nói cùng Phi-e-rơ. Câu văn ưu tiên trật tự tự nhiên của tiếng Việt, đồng thời giữ sự nhấn mạnh vào toàn thể cộng đồng đang hiện diện trước Đức Chúa Trời.
