  terminology: “Giốp-bê” là cách phiên âm địa danh nhất quán và phù hợp. “Ông” quy chiếu Cọt-nây theo văn mạch gần, tự nhiên; “sai họ đi” truyền đạt đúng ý cử/phái người của ἀπέστειλεν mà không gán sắc thái thần học đặc biệt.
