  source_fidelity: Bản dịch phản ánh đúng trình tự thời gian của phân từ bất định ἐξηγησάμενος (“Sau khi ...”), tính bao quát của ἅπαντα (“mọi việc”), đối tượng gián tiếp αὐτοῖς (“cho họ”), và hành động chính ἀπέστειλεν (“ông sai họ đi”) hướng đến Giốp-bê. “Kể lại” là một cách dịch hợp lệ trong ngữ cảnh Cọt-nây thuật lại đầy đủ sự việc cho các người được sai đi, không thêm chi tiết ngoài nguyên văn.
