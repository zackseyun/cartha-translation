  text: καὶ ἐξηγησάμενος ⸂ἅπαντα αὐτοῖς⸃ ἀπέστειλεν αὐτοὺς εἰς τὴν Ἰόππην.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/008.yaml
  text: And after explaining everything to them, he sent them to Joppa.
translation:
  language: vi
  text: Sau khi kể lại mọi việc cho họ, ông sai họ đi đến Giốp-bê.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξηγησάμενος
  choice: sau khi kể lại
  rationale: Phân từ bất định trung cách diễn tả hành động xảy ra trước động từ chính. “Kể lại” tự nhiên trong tiếng Việt và truyền đạt ý trình bày đầy đủ sự việc; “giải thích” có thể nhấn quá mức vào việc làm sáng tỏ ý nghĩa.
- source_word: ἅπαντα
  choice: mọi việc
  rationale: Dạng trung tính số nhiều có nghĩa bao quát là “tất cả”; trong ngữ cảnh thuật lại một biến cố, “mọi việc” tự nhiên hơn “mọi thứ” và vẫn giữ tính toàn diện.
- source_word: αὐτοῖς
  choice: cho họ
  rationale: Đại từ dữ cách là bổ ngữ gián tiếp của ἐξηγησάμενος; “cho họ” là cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: ἀπέστειλεν
  choice: ông sai họ đi
  rationale: ἀποστέλλω nghĩa là sai hoặc phái đi. Trong ngữ cảnh Cọt-nây giao nhiệm vụ cho các thuộc hạ, “sai họ đi” rõ ràng, tự nhiên và giữ được ý chủ động cử người.
- source_word: εἰς τὴν Ἰόππην
  choice: đến Giốp-bê
  rationale: εἰς với địa danh chỉ đích đến. “Đến Giốp-bê” diễn đạt tự nhiên sự chuyển động hướng tới thành ấy.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “ông” để quy chiếu Cọt-nây theo ngữ cảnh trước; địa danh Ἰόππη được phiên âm quen thuộc là “Giốp-bê”.
