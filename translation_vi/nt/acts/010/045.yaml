  text: καὶ ἐξέστησαν οἱ ἐκ περιτομῆς πιστοὶ ⸀ὅσοι συνῆλθαν τῷ Πέτρῳ, ὅτι καὶ ἐπὶ τὰ ἔθνη ἡ δωρεὰ τοῦ ⸂ἁγίου πνεύματος⸃ ἐκκέχυται·
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/045.yaml
  text: And the believers from the circumcision who had come with Peter were astonished[c][b][a], because the gift of the Holy Spirit had been poured out even on the Gentiles.
translation:
  language: vi
  text: Các tín hữu thuộc giới chịu cắt bì[a] đi cùng Phi-e-rơ đều kinh ngạc, vì ân ban của Đức Thánh Linh đã được tuôn đổ[c] ngay cả trên các dân ngoại[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “những tín hữu đã chịu cắt bì.” Sát nghĩa: “những tín hữu thuộc giới cắt bì.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “cũng trên các dân ngoại.” Từ Hy Lạp có thể diễn tả sự bổ sung, nhưng ở đây có lẽ nhấn mạnh điều gây bất ngờ: “ngay cả trên các dân ngoại.”'
    reason: lexical_alternative
  - marker: c
    text: Động từ Hy Lạp ở thể hoàn thành, nhấn mạnh một hành động đã hoàn tất và kết quả của hành động ấy vẫn còn.
    reason: aspectual_clarification
lexical_decisions:
- source_word: ἐξέστησαν
  choice: đều kinh ngạc
  rationale: Động từ diễn tả sự sửng sốt mạnh; “kinh ngạc” tự nhiên trong tiếng Việt hiện đại, còn “đều” phù hợp với toàn thể nhóm được mệnh đề ὅσοι xác định.
- source_word: οἱ ἐκ περιτομῆς πιστοὶ
  choice: những tín hữu thuộc giới chịu cắt bì
  rationale: Cách dịch giữ sắc thái nhận diện theo nhóm của cụm Hy Lạp, tức các tín hữu Do Thái, mà không giản lược thành một mô tả thuần túy về thân thể.
- source_word: ὅσοι συνῆλθαν τῷ Πέτρῳ
  choice: đã cùng đến với Phi-e-rơ
  rationale: Diễn đạt tự nhiên ý đồng hành trong συνέρχομαι với tặng cách, đồng thời cho thấy đây là những người đã đi cùng Phi-e-rơ đến nơi ấy.
- source_word: καὶ ἐπὶ τὰ ἔθνη
  choice: ngay cả trên các dân ngoại
  rationale: Trong bối cảnh Công Vụ 10, τὰ ἔθνη chỉ người ngoài dân Do Thái; “ngay cả” truyền đạt sắc thái bổ sung kèm sự bất ngờ của καὶ.
- source_word: ἡ δωρεὰ
  choice: ân ban
  rationale: “Ân ban” diễn tả một điều được ban cho nhưng không, có sắc thái trang trọng mà vẫn quen thuộc; không thêm cách giải thích rằng Đức Thánh Linh là Đấng ban hay chính là điều được ban.
- source_word: τοῦ ἁγίου πνεύματος
  choice: của Đức Thánh Linh
  rationale: Đây là cách gọi hiện đại, trang trọng và phổ thông trong tiếng Việt, đồng thời giữ nguyên cấu trúc sở hữu của nguyên văn.
- source_word: ἐκκέχυται
  choice: đã được tuôn đổ
  rationale: Thể hoàn thành bị động nói đến hành động đã hoàn tất với kết quả còn hiện hữu; “đã được tuôn đổ” phù hợp mạch kể tiếng Việt và giữ hình ảnh của động từ.
theological_decisions:
- issue: Phạm vi nghĩa của τὰ ἔθνη trong bối cảnh lịch sử cứu chuộc
  choice: các dân ngoại
  alternative: các dân tộc
  rationale: Trong Công Vụ 10, sự tương phản trực tiếp là giữa các tín hữu Do Thái và những người không thuộc dân Do Thái; “các dân ngoại” xác định đúng đối tượng mà không biến câu thành lời nói chung về các quốc gia.
- issue: Sắc thái của καὶ trước ἐπὶ τὰ ἔθνη
  choice: ngay cả trên các dân ngoại
  alternative: cũng trên các dân ngoại
  rationale: “Ngay cả” phù hợp với phản ứng kinh ngạc trong câu, nhưng chú thích vẫn bảo lưu khả năng hiểu καὶ theo nghĩa bổ sung đơn thuần.
- issue: Thể hoàn thành của ἐκκέχυται
  choice: đã được tuôn đổ
  alternative: được tuôn đổ và vẫn còn hiệu lực
  rationale: Bản dịch chính tránh diễn giải dài dòng nhưng chú thích nêu rõ hành động đã hoàn tất và kết quả đang tiếp diễn.
- issue: Quan hệ sở hữu trong τοῦ ἁγίου πνεύματος
  choice: ân ban của Đức Thánh Linh
  alternative: ân ban là Đức Thánh Linh
  rationale: Giữ cấu trúc sở hữu của tiếng Hy Lạp nhằm không âm thầm quyết định Đức Thánh Linh là nguồn ban hay chính là ân ban trong cấu trúc ngữ pháp này.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Phi-e-rơ,” “Đức Thánh Linh,” “dân ngoại” theo lối gọi phổ thông trong Kinh Thánh tiếng Việt; tránh thuật ngữ giáo phái và không giải quyết quá mức các điểm còn có thể hiểu theo nhiều cách trong nguyên văn.
