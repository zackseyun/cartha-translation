  source_fidelity: 'Bản nháp truyền đạt đúng cấu trúc chính: tiếng nói lặp lại lần thứ hai, hành động Đức Chúa Trời làm thanh sạch, và mệnh lệnh phủ định. Tuy nhiên, “con” bổ sung quan hệ xưng hô cha–con không có trong nguyên văn; σὺ chỉ là đại từ ngôi hai được nhấn mạnh. “Ô uế” trong câu chính cũng làm mờ sự phân biệt từ vựng giữa κοινόω (‘làm/coi là phàm tục, thông tục’) và ἀκάθαρτος (‘ô uế, không thanh sạch’).'
