  terminology: Giữ “Đức Chúa Trời” và “thanh sạch” là nhất quán, trang trọng, và phù hợp trường nghĩa nghi lễ. Dùng “phàm tục” ở câu chính để phản ánh κοινόω; các cách diễn đạt “ô uế” và “không thanh sạch” nên để trong chú thích như những cách chuyển nghĩa theo ngữ cảnh.
