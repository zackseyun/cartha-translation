  text: καὶ φωνὴ πάλιν ἐκ δευτέρου πρὸς αὐτόν· Ἃ ὁ θεὸς ἐκαθάρισεν σὺ μὴ κοίνου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/015.yaml
  text: 'And a voice came to him again a second time: “What God has made clean[a], you must not call common.”'
translation:
  language: vi
  text: 'Lại có tiếng phán với ông lần thứ hai: “Những gì Đức Chúa Trời đã làm cho thanh sạch[a], ông đừng coi là phàm tục.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “ông đừng gọi là thông tục,” “đừng coi là ô uế,” hoặc “đừng coi là không thanh sạch.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνὴ
  choice: có tiếng phán
  rationale: Trong văn cảnh khải tượng, cách diễn đạt này tự nhiên trong tiếng Việt và cho thấy đây là lời từ trời mà không tự ý xác định danh tính người phán.
- source_word: πάλιν ἐκ δευτέρου
  choice: lại ... lần thứ hai
  rationale: Giữ cả hai yếu tố có phần trùng lặp và nhấn mạnh của nguyên văn Hy Lạp, đồng thời vẫn tự nhiên trong tiếng Việt.
- source_word: πρὸς αὐτόν
  choice: với ông
  rationale: Cách nói tự nhiên để chỉ lời được nói trực tiếp với Phi-e-rơ; đại từ kính trọng vừa phải, phù hợp văn phong tường thuật.
- source_word: Ἃ
  choice: Những gì
  rationale: Diễn đạt tự nhiên đại từ quan hệ trung tính số nhiều mang nghĩa khái quát, không giới hạn đối tượng vào một vật riêng lẻ.
- source_word: ὁ θεὸς
  choice: Đức Chúa Trời
  rationale: Danh xưng phổ thông, trang trọng trong tiếng Việt Kinh Thánh, chỉ Đức Chúa Trời duy nhất.
- source_word: ἐκαθάρισεν
  choice: đã làm cho thanh sạch
  rationale: Thể hiện hành động quyết định của Đức Chúa Trời và giữ trường nghĩa thanh sạch theo nghi lễ; dễ hiểu hơn một từ chuyên biệt.
- source_word: σὺ μὴ κοίνου
  choice: con đừng coi là ô uế
  rationale: Đại từ σὺ tạo sự đối chiếu với hành động của Đức Chúa Trời. 'Coi là' diễn tả sự đánh giá hay đối xử của Phi-e-rơ; 'ô uế' chuyển tải nghĩa trong bối cảnh luật thanh sạch tự nhiên hơn 'thông thường' trong tiếng Việt.
theological_decisions:
- issue: Cách dịch ngôn ngữ thanh sạch trong khải tượng của Phi-e-rơ
  choice: Dùng “ô uế” trong câu chính, kèm chú thích về nghĩa sát chữ “phàm tục/không thánh sạch”.
  alternative: “con đừng gọi là phàm tục” hoặc “đừng coi là không thanh sạch”
  rationale: κοινόω đối lập với καθαρίζω nhưng trong ngữ cảnh thanh sạch có nghĩa xem hay xử sự với điều gì như bị ô nhiễm, không thích hợp về nghi lễ. Tiếng Việt “phàm tục” dễ bị hiểu đơn thuần là thế tục hoặc tầm thường, nên “ô uế” truyền đạt chức năng ngữ cảnh rõ hơn; chú thích bảo tồn sắc thái từ vựng và sự phân biệt với ἀκάθαρτος.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “tiếng phán” thay vì chỉ “một tiếng” để câu tự nhiên trong văn cảnh khải tượng; dùng cặp xưng hô hàm ẩn từ lời phán với “con” nhằm thể hiện lời nói trực tiếp từ trời mà không bổ sung danh tính người phán.
