source:
  edition: SBLGNT
  text: Ἰησοῦν τὸν ἀπὸ Ναζαρέθ, ὡς ἔχρισεν αὐτὸν ὁ θεὸς πνεύματι ἁγίῳ καὶ δυνάμει, ὃς διῆλθεν εὐεργετῶν καὶ ἰώμενος πάντας τοὺς καταδυναστευομένους ὑπὸ τοῦ διαβόλου, ὅτι ὁ θεὸς ἦν μετ’ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/038.yaml
  text: 'Jesus of Nazareth: how God anointed him with the Holy Spirit and with power[a]; he went about doing good and healing all who were oppressed by the devil[c][b], because God was with him.'
translation:
  language: vi
  text: 'Đức Giê-su, người Na-xa-rét[a]: Đức Chúa Trời đã xức dầu cho Ngài bằng Đức Thánh Linh và quyền năng; Ngài đi khắp nơi làm việc thiện và chữa lành tất cả những người bị Ác Quỷ áp bức, vì Đức Chúa Trời ở cùng Ngài.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “Đức Giê-su đến từ Na-xa-rét.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰησοῦν τὸν ἀπὸ Ναζαρέθ
  choice: Đức Giê-su người Na-xa-rét
  rationale: Cụm từ xác định Đức Giê-su theo nơi xuất thân. Cách diễn đạt này tự nhiên trong tiếng Việt và giữ được mối liên hệ trực tiếp với Na-xa-rét; chú thích bảo lưu cách dịch sát giới từ ἀπό hơn.
- source_word: ὡς
  choice: thể nào
  rationale: Trong cấu trúc tường thuật cô đọng này, ὡς dẫn vào nội dung giải thích về Đức Giê-su. “Thể nào” truyền đạt sắc thái “how” mà không biến câu thành một so sánh.
- source_word: ἔχρισεν
  choice: xức dầu
  rationale: Giữ nguyên hình ảnh của χρίω cùng âm hưởng về Đấng Mê-si-a và sự ban năng lực bởi Thánh Linh, nhưng không thêm lời giải nghĩa giáo lý vào câu.
- source_word: πνεύματι ἁγίῳ καὶ δυνάμει
  choice: bằng Đức Thánh Linh và quyền năng
  rationale: Giới từ “bằng” diễn đạt công cụ/phương tiện của cách dative. “Đức Thánh Linh” chỉ Đấng thiêng liêng có ngôi vị, còn “quyền năng” được giữ riêng như trong nguyên văn.
- source_word: διῆλθεν εὐεργετῶν
  choice: đi khắp nơi làm việc thiện
  rationale: διῆλθεν mô tả hoạt động lưu động của Đức Giê-su, còn εὐεργετῶν chỉ việc đem điều tốt lành cho người khác. Cụm tiếng Việt rõ ràng, tự nhiên và không thu hẹp phạm vi hành động.
- source_word: ἰώμενος πάντας τοὺς καταδυναστευομένους
  choice: chữa lành tất cả những người bị ... áp bức
  rationale: “Chữa lành” diễn đạt trực tiếp ἰώμενος; “bị áp bức” giữ ý bị đặt dưới sự thống trị hà khắc của καταδυναστεύω.
- source_word: ὑπὸ τοῦ διαβόλου
  choice: bị ma quỷ áp bức
  rationale: διάβολος ở đây chỉ hữu thể ác có ngôi vị; “ma quỷ” là cách gọi thông dụng, rõ nghĩa trong tiếng Việt hiện đại.
- source_word: ὅτι ὁ θεὸς ἦν μετ’ αὐτοῦ
  choice: vì Đức Chúa Trời ở cùng Ngài
  rationale: “Vì” thể hiện quan hệ nguyên nhân hoặc cơ sở do ὅτι nêu ra, đồng thời giữ nguyên lời khẳng định về sự hiện diện của Đức Chúa Trời với Đức Giê-su.
theological_decisions:
- issue: Ý nghĩa việc Đức Giê-su được xức dầu
  choice: Giữ cách nói “xức dầu” mà không diễn giải thành một công thức tín lý.
  alternative: “lập làm Đấng Mê-si-a” hoặc chỉ “ban quyền năng”
  rationale: Nguyên văn nói Đức Chúa Trời xức dầu cho Đức Giê-su bằng Đức Thánh Linh và quyền năng. “Xức dầu” bảo tồn âm hưởng Kinh Thánh và thần học mà không thêm điều câu này không nói rõ.
- issue: Quy chiếu của πνεύματι ἁγίῳ
  choice: Dịch là “Đức Thánh Linh”, chỉ Đấng thiêng liêng có ngôi vị.
  alternative: “một linh thánh” hoặc một năng lực tinh thần phi ngôi vị
  rationale: Trong sách Công Vụ, cụm này thường chỉ Đức Thánh Linh; hơn nữa, câu phân biệt Đức Thánh Linh với “quyền năng”, nên không đồng nhất hai khái niệm.
- issue: Mệnh đề nguyên nhân ὅτι ὁ θεὸς ἦν μετ’ αὐτοῦ
  choice: 'Giữ rõ quan hệ nguyên nhân: “vì Đức Chúa Trời ở cùng Ngài”.'
  alternative: Chỉ diễn đạt sự đồng hành mà làm mờ quan hệ nguyên nhân, hoặc suy diễn câu này thành một định nghĩa trọn vẹn về bản tính của Đức Giê-su.
  rationale: Câu nêu sự hiện diện của Đức Chúa Trời với Đức Giê-su làm cơ sở cho chức vụ đầy việc thiện và chữa lành của Ngài, nhưng không nhằm giải quyết toàn bộ vấn đề Kitô học.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “Đức Giê-su”, “Đức Chúa Trời”, “Đức Thánh Linh” và đại từ “Ngài” theo lối diễn đạt Kinh Thánh phổ thông. Dấu hai chấm và dấu chấm phẩy giúp thể hiện cấu trúc Hy Lạp cô đọng mà không tạo một câu tiếng Việt tối nghĩa.
