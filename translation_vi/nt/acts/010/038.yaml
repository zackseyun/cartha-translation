revisions:
- from: 'Đức Giê-su người Na-xa-rét[a]: thể nào Đức Chúa Trời đã xức dầu cho Ngài bằng Đức Thánh Linh và quyền năng; Ngài đi khắp nơi làm việc thiện và chữa lành tất cả những người bị ma quỷ áp bức, vì Đức Chúa Trời ở cùng Ngài.'
  to: 'Đức Giê-su, người Na-xa-rét[a]: Đức Chúa Trời đã xức dầu cho Ngài bằng Đức Thánh Linh và quyền năng; Ngài đi khắp nơi làm việc thiện và chữa lành tất cả những người bị Ác Quỷ áp bức, vì Đức Chúa Trời ở cùng Ngài.'
  rationale: Bản sửa dùng dấu phẩy để đánh dấu cụm đồng vị “người Na-xa-rét”, đồng thời bỏ “thể nào” vốn gượng trong câu tiếng Việt độc lập. Dấu hai chấm vẫn trình bày phần giải thích mà ὡς dẫn vào. “Ác Quỷ” thay cho “ma quỷ” để phản ánh τοῦ διαβόλου là danh từ số ít xác định. Không thêm diễn giải thần học nào ngoài nguyên văn.
