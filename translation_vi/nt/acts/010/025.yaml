  text: ὡς δὲ ἐγένετο τοῦ εἰσελθεῖν τὸν Πέτρον, συναντήσας αὐτῷ ὁ Κορνήλιος πεσὼν ἐπὶ τοὺς πόδας προσεκύνησεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/025.yaml
  text: And when Peter entered[a], Cornelius met him and fell at his feet and paid him homage.
translation:
  language: vi
  text: Khi Phi-e-rơ bước vào, Cọt-nây gặp ông, sấp mình xuống dưới chân ông và tỏ lòng tôn kính ông.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “thờ lạy ông.” Động từ Hy Lạp có thể chỉ sự thờ lạy hoặc hành vi phủ phục bày tỏ lòng tôn kính, tùy ngữ cảnh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ ἐγένετο τοῦ εἰσελθεῖν τὸν Πέτρον
  choice: Khi Phi-e-rơ bước vào
  rationale: Thành ngữ Hy Lạp mở ra hoàn cảnh thời gian của câu chuyện. “Khi ... bước vào” tự nhiên trong tiếng Việt, giữ được ý thời gian mà không sao chép cấu trúc nguyên ngữ một cách nặng nề.
- source_word: συναντήσας αὐτῷ
  choice: Cọt-nây ra đón ông
  rationale: Phân từ diễn tả việc Cọt-nây gặp Phi-e-rơ khi ông đi vào; “ra đón” phù hợp với bối cảnh chủ nhà tiếp người vừa đến và tự nhiên hơn cách dịch đơn thuần “gặp ông”.
- source_word: πεσὼν ἐπὶ τοὺς πόδας
  choice: sấp mình dưới chân ông
  rationale: Cách diễn đạt này giữ cả tư thế hạ mình lẫn vị trí dưới chân Phi-e-rơ, đồng thời trang trọng và dễ hiểu trong tiếng Việt hiện đại.
- source_word: προσεκύνησεν
  choice: bày tỏ lòng tôn kính
  rationale: Động từ có thể chỉ sự thờ lạy hoặc hành vi phủ phục tỏ lòng tôn kính tùy ngữ cảnh. Lựa chọn này giữ sắc thái tôn kính rất cao nhưng không mặc nhiên xác định đó là sự thờ phượng; nghĩa mạnh hơn được nêu trong chú thích.
theological_decisions:
- issue: Cách dịch προσκυνέω khi đối tượng là Phi-e-rơ
  choice: bày tỏ lòng tôn kính
  alternative: thờ lạy ông; phủ phục trước ông
  rationale: Nguyên ngữ có phạm vi nghĩa từ phủ phục tôn kính đến thờ lạy. Vì câu kế tiếp cho biết Phi-e-rơ từ chối hành động ấy với lý do chính ông cũng là con người, bản dịch cần giữ mức độ nghiêm trọng của cử chỉ mà không quyết định thay cho văn bản rằng Cọt-nây có chủ ý dành sự thờ phượng thần linh cho Phi-e-rơ.
translation_notes:
  register: Văn phong kể chuyện trang trọng, sáng rõ và tự nhiên đối với độc giả Việt Nam hiện đại. Dùng “sấp mình dưới chân” để diễn tả cụ thể cử chỉ, còn “bày tỏ lòng tôn kính” giữ sự mơ hồ có thật của προσκυνέω. Tên riêng được phiên âm theo lối quen dùng trong tiếng Việt.
