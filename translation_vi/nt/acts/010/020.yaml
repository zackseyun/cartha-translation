  source_fidelity: 'Bản dịch truyền đạt đúng chuỗi mệnh lệnh và lý do trong nguyên văn: «đứng dậy», «đi xuống», «đi cùng họ», «không chút do dự», và lời nhấn mạnh «chính Ta». Tuy nhiên, «đã sai họ đến» thêm hướng chuyển động/đích đến không được nêu trong câu Hy Lạp (ἀπέσταλκα αὐτούς, “đã sai họ”). Dù phù hợp với ngữ cảnh, chi tiết này không cần thiết và nên bỏ để giữ sát nguồn.'
