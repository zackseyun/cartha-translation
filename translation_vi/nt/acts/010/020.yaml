source:
  edition: SBLGNT
  text: ἀλλὰ ἀναστὰς κατάβηθι καὶ πορεύου σὺν αὐτοῖς μηδὲν διακρινόμενος, ⸀ὅτι ἐγὼ ἀπέσταλκα αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/020.yaml
  text: But get up[a], go down, and go with them, doubting nothing, because I have sent them.
translation:
  language: vi
  text: Nhưng hãy đứng dậy, đi xuống và đi cùng họ, không chút do dự,[a] vì chính Ta đã sai họ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “không phân biệt gì”. Phân từ Hy Lạp có thể mang nghĩa không nghi ngờ, do dự, hoặc không phân biệt; nghĩa thứ hai có thể gợi lại chủ đề về người Do Thái và dân ngoại trong chương này.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλὰ
  choice: Nhưng
  rationale: Diễn tả sự tương phản với trạng thái bối rối trước đó của Phi-e-rơ và chuyển sang mệnh lệnh hành động.
- source_word: ἀναστὰς
  choice: hãy đứng dậy
  rationale: Phân từ bất định mang chức năng mệnh lệnh trong chuỗi hành động; cách diễn đạt này tự nhiên và rõ ràng trong tiếng Việt hiện đại.
- source_word: κατάβηθι
  choice: đi xuống
  rationale: Giữ đúng hướng chuyển động từ nơi Phi-e-rơ đang ở trên sân thượng xuống bên dưới.
- source_word: πορεύου σὺν αὐτοῖς
  choice: đi cùng họ
  rationale: Diễn đạt gọn và tự nhiên ý lên đường với những người đang chờ ông.
- source_word: μηδὲν διακρινόμενος
  choice: không chút do dự
  rationale: Trong ngữ cảnh trực tiếp, động từ có thể chỉ sự nghi ngờ hoặc chần chừ; cách dịch này truyền đạt mệnh lệnh đừng ngần ngại mà vẫn dành chỗ cho nghĩa khác trong chú thích.
- source_word: ὅτι
  choice: vì
  rationale: Giới thiệu nguyên nhân Phi-e-rơ phải vâng theo chỉ dẫn.
- source_word: ἐγὼ
  choice: chính Ta
  rationale: Đại từ được nêu rõ trong tiếng Hy Lạp để nhấn mạnh chủ thể; “chính” chuyển tải sắc thái nhấn mạnh ấy, còn “Ta” phù hợp với lời phán của Thánh Linh trong ngữ cảnh.
- source_word: ἀπέσταλκα αὐτούς
  choice: đã sai họ đến
  rationale: 'Thì hoàn thành nói đến hành động đã hoàn tất nhưng còn kết quả hiện tại: những người ấy đang có mặt vì được sai đến. “Đến” làm rõ đích đến vốn hiển nhiên trong ngữ cảnh tiếng Việt.'
theological_decisions:
- issue: Ý nghĩa của μηδὲν διακρινόμενος trong mối liên hệ với việc tiếp nhận dân ngoại
  choice: Dịch trong chính văn là “không chút do dự”, nhấn mạnh rằng Phi-e-rơ không được chần chừ khi đi với họ.
  alternative: “không phân biệt gì”
  rationale: Ngữ cảnh gần nói đến sự bối rối của Phi-e-rơ và mệnh lệnh của Thánh Linh, nên nghĩa “không do dự” phù hợp nhất. Tuy nhiên, toàn chương cũng triển khai chủ đề không phân biệt người Do Thái với dân ngoại; chú thích giữ lại khả năng này thay vì giải quyết dứt khoát sự đa nghĩa.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Các mệnh lệnh được diễn đạt trực tiếp; dấu phẩy giữ nhịp chuỗi hành động. Đại từ “Ta” viết hoa vì người đang phán là Thánh Linh theo ngữ cảnh, không nhằm thêm một danh xưng thần học ngoài nguyên văn.
