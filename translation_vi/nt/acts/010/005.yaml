revisions:
- from: Bây giờ, hãy sai mấy người đến Giốp-bê và mời một người tên là Si-môn, cũng gọi là Phi-e-rơ[a], đến.
  to: Bây giờ, hãy sai mấy người đến Giốp-bê, rồi cho mời một người tên là Si-môn, người cũng được gọi là Phi-e-rơ[a], đến.
  rationale: Bản sửa làm rõ rằng Phi-e-rơ là tên gọi của Si-môn và dùng “cho mời” để biểu đạt chính xác hơn hành động sai người đi gọi ông đến. Các yếu tố còn lại, gồm số nhiều của ἄνδρας, địa danh và trật tự hai mệnh lệnh, được պահպան giữ.
