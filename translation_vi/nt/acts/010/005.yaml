review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng mệnh lệnh sai người đến Giốp-bê và gọi Si-môn. Tuy nhiên, “cũng gọi là Phi-e-rơ” có thể được hiểu là Si-môn cũng gọi một người khác là Phi-e-rơ, thay vì chính Si-môn được gọi là Phi-e-rơ. Cấu trúc quan hệ rõ ràng hơn sẽ phản ánh ὃς ἐπικαλεῖται Πέτρος chính xác hơn.
  naturalness: '“Bây giờ, hãy sai mấy người đến Giốp-bê” tự nhiên trong tiếng Việt hiện đại. Dùng “cho mời” phù hợp hơn với μετάπεμψαι: người nghe sai người đi để mời/gọi người ấy đến, chứ không trực tiếp thực hiện lời mời.'
  terminology: Giốp-bê, Si-môn và Phi-e-rơ nhất quán với dạng phiên âm Kinh Thánh Việt ngữ quen dùng. Không có thuật ngữ thần học cần điều chỉnh.
  issues:
  - severity: medium
    issue: Cụm “cũng gọi là Phi-e-rơ” mơ hồ về chủ thể được gọi.
    rationale: Mệnh đề Hy Lạp ὃς ἐπικαλεῖται Πέτρος bổ nghĩa cho Si-môn và có nghĩa “người được gọi là Phi-e-rơ.” Thêm “người cũng được gọi là” làm rõ quan hệ này mà không thêm nghĩa.
  - severity: low
    issue: “mời ... đến” chưa phản ánh trọn cách thức sai người đi gọi trong μετάπεμψαι.
    rationale: “Cho mời” tự nhiên trong tiếng Việt và giữ được sắc thái “sai người đi gọi/mời đến” của động từ trung cách.
  revised_text: Bây giờ, hãy sai mấy người đến Giốp-bê, rồi cho mời một người tên là Si-môn, người cũng được gọi là Phi-e-rơ[a], đến.
