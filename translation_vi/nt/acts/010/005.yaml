  text: καὶ νῦν πέμψον ⸂ἄνδρας εἰς Ἰόππην⸃ καὶ μετάπεμψαι Σίμωνά ⸂τινα ὃς ἐπικαλεῖται Πέτρος⸃·
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/005.yaml
  text: And now send men to Joppa and summon a certain Simon who is called Peter[a].
translation:
  language: vi
  text: Bây giờ, hãy sai mấy người đến Giốp-bê, rồi cho mời một người tên là Si-môn, người cũng được gọi là Phi-e-rơ[a], đến.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “hãy cho gọi một người tên là Si-môn, người được gọi là Phi-e-rơ.”'
    reason: Nêu cách diễn đạt thay thế sát cấu trúc của μετάπεμψαι và ὃς ἐπικαλεῖται Πέτρος.
lexical_decisions:
- source_word: καὶ νῦν
  choice: Bây giờ
  rationale: Diễn đạt tự nhiên chức năng chuyển tiếp và thời gian trong tiếng Việt; không cần dịch καί thành “và” một cách máy móc ở đầu câu.
- source_word: πέμψον ἄνδρας
  choice: hãy sai mấy người
  rationale: Giữ mệnh lệnh trực tiếp và nghĩa số nhiều của ἄνδρας; “mấy người” tự nhiên hơn “những người đàn ông” trong ngữ cảnh sai người đi làm việc, mà không thêm ý họ là sứ giả.
- source_word: εἰς Ἰόππην
  choice: đến Giốp-bê
  rationale: Cách diễn đạt phương hướng tự nhiên trong tiếng Việt; dùng dạng địa danh quen thuộc trong văn phong Kinh Thánh tiếng Việt.
- source_word: μετάπεμψαι
  choice: mời ... đến
  rationale: Động từ trung cách mang nghĩa sai người đi gọi hoặc cho mời ai đến; “mời ... đến” truyền đạt yêu cầu hiện diện mà không hàm ý cưỡng ép như “triệu tập”.
- source_word: Σίμωνά τινα
  choice: một người tên là Si-môn
  rationale: τινα giới thiệu một người cụ thể nhưng chưa được xác định đối với người nghe; cách nói này tự nhiên hơn lối sát chữ “một Si-môn nào đó”.
- source_word: ὃς ἐπικαλεῖται Πέτρος
  choice: cũng gọi là Phi-e-rơ
  rationale: Diễn đạt tên gọi khác của Si-môn bằng tiếng Việt tự nhiên, đồng thời giữ nghĩa của ἐπικαλεῖται mà không biến Phi-e-rơ thành họ theo nghĩa hiện đại.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Câu được sắp xếp lại nhẹ để tiếng Việt tự nhiên; “đến” ở cuối làm rõ nội dung của hành động cho mời. Dùng “Giốp-bê,” “Si-môn” và “Phi-e-rơ” theo dạng phiên âm Kinh Thánh quen thuộc.
