id: ACT.10.4
reference: Acts 10:4
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ δὲ ἀτενίσας αὐτῷ καὶ ἔμφοβος γενόμενος εἶπεν· Τί ἐστιν, κύριε; εἶπεν δὲ αὐτῷ· Αἱ προσευχαί σου καὶ αἱ ἐλεημοσύναι σου ἀνέβησαν εἰς μνημόσυνον ⸀ἔμπροσθεν τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/004.yaml
  text: But he stared at him[a], and becoming afraid, said, “What is it, Lord?” And he said to him, “Your prayers and your acts of mercy have gone up as a memorial before God.”
translation:
  language: vi
  text: 'Ông chăm chú nhìn vị ấy và hoảng sợ, thưa: “Thưa ngài, có việc gì vậy?” Vị ấy nói với ông: “Những lời cầu nguyện và những việc bố thí[a] của ông đã dâng lên trước mặt Đức Chúa Trời như một sự tưởng niệm.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “những việc làm vì lòng thương xót.” Từ Hy Lạp đặc biệt nói đến việc dùng của cải giúp đỡ người túng thiếu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀτενίσας
  choice: chăm chú nhìn
  rationale: Diễn đạt ánh nhìn cố định, đầy chú ý mà không dùng cách nói quá mạnh hoặc thiếu tự nhiên trong tiếng Việt.
- source_word: ἔμφοβος γενόμενος
  choice: hoảng sợ
  rationale: Thể hiện việc Cọt-nây rơi vào trạng thái sợ hãi; cách nói gọn và tự nhiên trong lời kể hiện đại.
- source_word: Τί ἐστιν
  choice: có việc gì vậy?
  rationale: Câu hỏi trực tiếp về điều vị hiện ra muốn nói hoặc muốn làm, tự nhiên hơn lối dịch sát chữ “đó là gì?” trong ngữ cảnh này.
- source_word: κύριε
  choice: thưa ngài
  rationale: Trong ngữ cảnh, đây là lời xưng hô kính trọng với một sứ giả thiên thượng; “ngài” giữ sắc thái tôn kính mà không biến lời này thành một lời tuyên xưng rõ ràng rằng vị ấy là Chúa.
- source_word: προσευχαί
  choice: những lời cầu nguyện
  rationale: Cách dịch chuẩn, rõ nghĩa và phù hợp với số nhiều của nguyên văn.
- source_word: ἐλεημοσύναι
  choice: việc bố thí
  rationale: Từ Hy Lạp đặc biệt chỉ việc giúp đỡ người túng thiếu bằng của cải; “bố thí” chính xác và quen thuộc trong tiếng Việt, dù có thể cần chú thích để làm rõ sắc thái thương xót.
- source_word: ἀνέβησαν
  choice: đã dâng lên
  rationale: Giữ hình ảnh chuyển động hướng lên và âm hưởng thờ phượng, đồng thời tự nhiên hơn “đã đi lên” khi nói về lời cầu nguyện và việc thiện.
- source_word: εἰς μνημόσυνον
  choice: như một lễ tưởng niệm
  rationale: Giữ danh từ và âm hưởng lễ nghi của cụm từ, thay vì diễn giải hoàn toàn thành “khiến Đức Chúa Trời nhớ đến”.
- source_word: ἔμπροσθεν τοῦ θεοῦ
  choice: trước mặt Đức Chúa Trời
  rationale: Diễn đạt trực tiếp ý ở trong sự hiện diện hoặc trước ánh nhìn của Đức Chúa Trời.
theological_decisions:
- issue: Sắc thái của κύριε khi Cọt-nây thưa với nhân vật thiên thượng
  choice: Dịch là “thưa ngài”, một lời xưng hô kính trọng.
  alternative: “Lạy Chúa” hoặc “thưa Chúa”
  rationale: κύριε có thể mang nghĩa “Chúa” hoặc là lời thưa gửi kính trọng. Trong mạch truyện này, người được thưa là sứ giả thiên thượng, nên “thưa ngài” bảo toàn chức năng xưng hô mà không ngầm xác định vị ấy là Đức Chúa hay Chúa Giê-su.
- issue: Ý nghĩa của εἰς μνημόσυνον trước Đức Chúa Trời
  choice: Giữ hình ảnh “như một lễ tưởng niệm”.
  alternative: “để Đức Chúa Trời nhớ đến ông”
  rationale: Cách dịch được chọn bảo toàn âm hưởng lễ nghi và không giải quyết thay cho độc giả mối liên hệ giữa sự tưởng niệm, lời cầu nguyện và việc bố thí.
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại. Đại từ “ông” dành cho Cọt-nây và “vị ấy/ngài” dành cho sứ giả giữ sự tôn kính, đồng thời tránh thêm danh xưng không có trong chính câu Hy Lạp.
