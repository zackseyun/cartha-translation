  text: ὁ δὲ Πέτρος ⸂ἤγειρεν αὐτὸν⸃ λέγων· Ἀνάστηθι· καὶ ἐγὼ αὐτὸς ἄνθρωπός εἰμι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/026.yaml
  text: But Peter raised him up[a], saying, “Stand up[c][b]; I too am a man.”
translation:
  language: vi
  text: 'Nhưng Phi-e-rơ đỡ ông dậy[a] và nói: “Hãy đứng lên[b]; tôi cũng là một người.”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “nâng ông dậy” hoặc “làm cho ông đứng dậy.”'
    reason: lexical_alternative
  - marker: b
    text: 'Hay: “Hãy đứng dậy” hoặc “Đứng dậy.”'
    reason: lexical_alternative
  - marker: c
    text: 'Hay: “Chính tôi cũng là một người.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤγειρεν αὐτὸν
  choice: đỡ ông đứng dậy
  rationale: Trong bối cảnh Cọt-nây đang phủ phục dưới chân Phi-e-rơ, cụm này chỉ việc Phi-e-rơ làm cho ông đứng lên. “Đỡ ông đứng dậy” tự nhiên trong tiếng Việt và không xác định quá mức cách thức.
- source_word: Ἀνάστηθι
  choice: Hãy đứng lên
  rationale: Mệnh lệnh trực tiếp yêu cầu Cọt-nây đứng dậy; cách diễn đạt này rõ ràng, tự nhiên và phù hợp với tư thế được nói đến ở câu trước.
- source_word: καὶ ἐγὼ αὐτὸς
  choice: chính tôi cũng
  rationale: 'Giữ được cả sắc thái nhấn mạnh của αὐτός và ý bao gồm của καί: bản thân Phi-e-rơ cũng thuộc cùng thân phận con người.'
- source_word: ἄνθρωπός εἰμι
  choice: là người mà
  rationale: “Là người” diễn đạt trực tiếp ἄνθρωπος và tránh thêm ý “chỉ là” vốn không có trong nguyên văn; tiểu từ “mà” làm lời nói tự nhiên và nhấn mạnh lý do Phi-e-rơ yêu cầu ông đứng lên.
- source_word: δὲ
  choice: Nhưng
  rationale: Đánh dấu sự tương phản nhẹ giữa việc Cọt-nây phủ phục ở câu trước và phản ứng sửa lại của Phi-e-rơ.
theological_decisions:
- issue: Phản ứng của Phi-e-rơ trước việc Cọt-nây phủ phục
  choice: Diễn đạt lời Phi-e-rơ như sự từ chối được đối xử theo cách nâng ông vượt quá thân phận con người, với lý do ông cũng là người.
  alternative: Có thể hiểu hẹp hơn như một lời bày tỏ khiêm nhường, không nhất thiết hàm ý một lập luận thần học rộng hơn.
  rationale: Bản dịch giữ nguyên lý do rõ ràng trong câu—Phi-e-rơ cũng là người—nhưng không thêm các thuật ngữ hay kết luận giáo lý mà nguyên văn không phát biểu.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Phi-e-rơ” theo lối phiên âm tên riêng quen dùng trong Kinh Thánh tiếng Việt; “ông” giữ phép xưng hô tôn trọng. Các dấu chú thích đều được đặt trong chính văn ngay sau cụm liên quan.
