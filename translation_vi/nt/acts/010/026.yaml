revisions:
- from: 'Nhưng Phi-e-rơ đỡ ông đứng dậy[a] và nói: “Hãy đứng lên[b]; chính tôi cũng là người mà.”[c]'
  to: 'Nhưng Phi-e-rơ đỡ ông dậy[a] và nói: “Hãy đứng lên[b]; tôi cũng là một người.”[c]'
  rationale: Sửa «đỡ ông đứng dậy» thành «đỡ ông dậy» để tránh xác định quá mức cách Phi-e-rơ nâng Cọt-nây lên, nhưng vẫn biểu đạt hành động thể chất trong ngữ cảnh. Điều chỉnh lời nói của Phi-e-rơ thành «tôi cũng là một người» để giữ sắc thái nhấn mạnh bao gồm của καὶ ἐγὼ αὐτός mà không thêm tiểu từ «mà». Cập nhật các chú thích để chúng là những lựa chọn từ vựng tự nhiên, tương đương và phù hợp với các điểm neo a–c.
