review_pass:
  verdict: revise
  source_fidelity: Bản nháp giữ đúng quan hệ nguyên nhân của ὅτι và liên từ καί, nhưng dịch κοινόν là “ô uế” làm lu mờ sự phân biệt với ἀκάθαρτον. Trong ngữ cảnh luật về thức ăn, κοινόν trước hết là “phàm tục/thông tục” theo nghĩa nghi lễ, còn ἀκάθαρτον là “ô uế/không thanh sạch.”
  naturalness: “Lạy Chúa, không bao giờ!” có thể hiểu được, nhưng trật tự “Không đời nào, lạy Chúa” phản ánh trực tiếp hơn nhịp câu Hy Lạp và tự nhiên trong lời khước từ dứt khoát. “Bất cứ thứ gì” tự nhiên hơn “bất cứ vật gì.”
  terminology: Sửa cặp thuật ngữ thành “phàm tục và ô uế” để không đồng nhất κοινόν với ἀκάθαρτον. Chú thích ngắn giải thích “phàm tục” theo nghĩa tình trạng nghi lễ, không phải đánh giá đạo đức thông thường.
  issues:
  - severity: medium
    issue: κοινόν bị dịch là “ô uế”
    rationale: “Ô uế” tương ứng sát hơn với ἀκάθαρτον. Cách dịch hiện tại khiến hai thuật ngữ nguồn bị trùng nghĩa và không phản ánh được đối lập/khác biệt từ vựng mà câu Hy Lạp vẫn duy trì qua καί.
  - severity: low
    issue: “vật gì” và trật tự lời đáp chưa tối ưu
    rationale: “Thứ gì” là cách nói hiện đại, tự nhiên hơn cho πᾶν; đưa lời phủ định lên đầu cũng phản ánh Μηδαμῶς, κύριε rõ hơn.
