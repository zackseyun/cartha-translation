source:
  edition: SBLGNT
  text: ὁ δὲ Πέτρος εἶπεν· Μηδαμῶς, κύριε, ὅτι οὐδέποτε ἔφαγον πᾶν κοινὸν ⸀καὶ ἀκάθαρτον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/014.yaml
  text: But Peter said, “By no means, Lord, because I have never eaten anything common and unclean.”
translation:
  language: vi
  text: 'Nhưng Phi-e-rơ nói: “Không đời nào, lạy Chúa, vì con chưa từng ăn bất cứ thứ gì phàm tục[a] và ô uế.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Phàm tục” ở đây chỉ điều bị xem là không thích hợp về mặt nghi lễ, phân biệt với “ô uế.”
    reason: Làm rõ nghĩa nghi lễ của κοινόν và bảo toàn sự phân biệt với ἀκάθαρτον mà không áp đặt diễn giải rộng hơn.
lexical_decisions:
- source_word: Μηδαμῶς
  choice: không bao giờ
  rationale: Diễn đạt tự nhiên lời khước từ mạnh mẽ, dứt khoát của Phi-e-rơ.
- source_word: κύριε
  choice: Lạy Chúa
  rationale: Dạng xưng hô trực tiếp, trang trọng; không xác định thêm danh tính của Đấng được thưa chuyện ngoài điều văn bản nêu.
- source_word: ὅτι
  choice: Vì
  rationale: 'Giữ quan hệ nguyên nhân: Phi-e-rơ giải thích lý do ông khước từ.'
- source_word: κοινὸν
  choice: ô uế
  rationale: Trong bối cảnh quy định thức ăn, từ này chỉ điều bị xem là phàm tục hoặc không tinh sạch về nghi lễ; “ô uế” là cách nói quen thuộc, dễ hiểu trong tiếng Việt.
- source_word: ἀκάθαρτον
  choice: không thanh sạch
  rationale: Phân biệt với κοινόν và giữ phép nối καὶ (“và”), thay vì gộp hai thuật ngữ thành một.
theological_decisions:
- issue: Quan hệ giữa κοινόν và ἀκάθαρτον
  choice: “ô uế và không thanh sạch”
  alternative: “phàm tục hoặc không tinh sạch”
  rationale: Giữ liên từ καί theo bản SBLGNT là “và”, đồng thời bảo tồn hai thuật ngữ gần nghĩa mà không âm thầm đổi thành “hoặc”.
- issue: Cách hiểu κύριε
  choice: “Lạy Chúa”
  alternative: “thưa ngài”
  rationale: Ngữ cảnh khải tượng và cách dùng trong Công Vụ phù hợp với lời xưng hô “Chúa”, nhưng bản dịch không chú giải thêm người nói đang nhận diện tiếng phán theo nghĩa nào.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ đọc. Dùng “thưa” và đại từ “con” để thể hiện lời đáp trực tiếp với Chúa; giữ sự nhấn mạnh của lời từ chối và cấu trúc giải thích nguyên nhân.
