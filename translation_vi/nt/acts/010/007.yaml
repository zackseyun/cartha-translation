  to: Khi thiên sứ đang nói với ông đã đi khỏi, ông gọi hai người phục vụ trong nhà[a] và một binh sĩ mộ đạo trong số những người vẫn hầu cận ông.
  rationale: 'Chỉnh các cách diễn đạt có thể gây lệch sắc thái: “mộ đạo” cho εὐσεβής và “vẫn hầu cận” cho προσκαρτερούντων. Chú thích được sửa để phân biệt “thuộc nhà” với thành viên gia đình, đồng thời vẫn bảo lưu khả năng địa vị nô lệ mà không áp đặt vào bản văn chính.'
