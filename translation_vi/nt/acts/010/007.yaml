  text: ὡς δὲ ἀπῆλθεν ὁ ἄγγελος ὁ λαλῶν ⸀αὐτῷ, φωνήσας δύο τῶν ⸀οἰκετῶν καὶ στρατιώτην εὐσεβῆ τῶν προσκαρτερούντων αὐτῷ
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/007.yaml
  text: When the angel who was speaking to him had gone away[a], he called two of his household servants and a devout soldier from among those attending him.
translation:
  language: vi
  text: Khi thiên sứ đang nói với ông đã đi khỏi, ông gọi hai người phục vụ trong nhà[a] và một binh sĩ mộ đạo trong số những người vẫn hầu cận ông.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “hai đầy tớ trong nhà” hoặc “hai nô lệ trong nhà.” Từ Hy Lạp οἰκέται chỉ những người thuộc nhà và làm công việc phục dịch; từ này có thể bao hàm địa vị nô lệ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ ἀπῆλθεν
  choice: Khi ... đã đi khỏi
  rationale: Diễn tả hành động của thiên sứ hoàn tất trước việc Cọt-nây gọi người; cách nói tự nhiên trong tiếng Việt mà không nhấn quá mức sắc thái của δέ.
- source_word: ὁ ἄγγελος ὁ λαλῶν αὐτῷ
  choice: thiên sứ đang nói với ông
  rationale: Trong ngữ cảnh khải tượng ở Công Vụ 10, ἄγγελος chỉ một sứ giả thiên giới; phân từ hiện tại λαλῶν được giữ bằng 'đang nói'.
- source_word: φωνήσας
  choice: ông gọi
  rationale: Phân từ bất định quá khứ nêu hành động mở đầu cho lời kể tiếp theo; chuyển thành động từ hữu hạn giúp câu tiếng Việt rõ và tự nhiên.
- source_word: δύο τῶν οἰκετῶν
  choice: hai người phục vụ trong nhà
  rationale: οἰκέτης chỉ người ở địa vị phục dịch trong gia đình, có thể là đầy tớ hoặc nô lệ; cách dịch chính giữ bối cảnh gia đình và tránh xác định quá mức địa vị pháp lý.
- source_word: στρατιώτην εὐσεβῆ
  choice: một binh sĩ sùng kính
  rationale: εὐσεβής nói đến lòng kính ngưỡng và mộ đạo; 'sùng kính' giữ nghĩa này mà không tự thêm đối tượng vào tính từ.
- source_word: τῶν προσκαρτερούντων αὐτῷ
  choice: trong số những người thường túc trực bên ông
  rationale: Giữ cấu trúc bộ phận của sở hữu cách số nhiều và sắc thái chuyên cần, thường xuyên của προσκαρτερέω trong việc hầu cận Cọt-nây.
theological_decisions:
- issue: Bản chất của ἄγγελος trong ngữ cảnh
  choice: thiên sứ
  alternative: sứ giả
  rationale: Ngữ cảnh trực tiếp mô tả một hữu thể thiên giới hiện đến với Cọt-nây trong khải tượng, nên 'thiên sứ' là nghĩa được ngữ cảnh đòi hỏi.
- issue: Sắc thái của εὐσεβής
  choice: sùng kính
  alternative: kính sợ Đức Chúa Trời
  rationale: Tính từ tự nó diễn tả lòng mộ đạo nhưng không nêu rõ đối tượng; bản dịch không thêm cụm 'Đức Chúa Trời' dù ngữ cảnh rộng hơn có thể gợi điều đó.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng 'túc trực bên ông' để diễn đạt sự hầu cận thường xuyên; giữ đại từ 'ông' theo mạch văn nói về Cọt-nây. Dấu chú thích [a] xuất hiện ngay sau cụm từ liên quan.
