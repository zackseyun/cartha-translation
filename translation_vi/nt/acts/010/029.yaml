  text: διὸ καὶ ἀναντιρρήτως ἦλθον μεταπεμφθείς πυνθάνομαι οὖν τίνι λόγῳ μετεπέμψασθέ με.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/029.yaml
  text: Therefore I came without objection when I was sent for[a]. So I ask[b], for what reason did you send for me?
translation:
  language: vi
  text: 'Vì vậy, khi được gọi đến, tôi đã đến mà không phản đối.[a] Vậy tôi xin hỏi: Vì lý do gì quý vị cho gọi tôi đến?[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “không chút do dự.” Từ Hy Lạp sát nghĩa hơn là “không phản đối” hoặc “không tranh cãi.”
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “tại sao quý vị cho gọi tôi đến?” Nguyên văn là “vì lý do gì quý vị cho gọi tôi đến?”
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ καὶ
  choice: Vì vậy
  rationale: Diễn đạt kết luận rút ra từ lời giải thích ngay trước đó; sắc thái nhấn nhẹ của καὶ được hòa vào mạch câu thay vì dịch riêng một cách gượng ép.
- source_word: ἀναντιρρήτως
  choice: mà không phản đối
  rationale: Giữ nghĩa sát của trạng từ Hy Lạp là không nói chống lại, không tranh cãi hay kháng cự; tự nhiên trong tiếng Việt hiện đại.
- source_word: ἦλθον
  choice: tôi đã đến
  rationale: Diễn đạt trực tiếp động từ chỉ việc đến, đồng thời dùng “đã” để thể hiện hành động đã xảy ra.
- source_word: μεταπεμφθείς
  choice: khi được gọi đến
  rationale: Thể hiện phân từ thụ động với nghĩa được sai người gọi hoặc triệu đến, đồng thời tránh cách diễn đạt nặng nề.
- source_word: πυνθάνομαι οὖν
  choice: Vậy tôi xin hỏi
  rationale: “Vậy” giữ chức năng chuyển ý/kết luận của οὖν; “xin hỏi” là cách nói tự nhiên, lịch sự trong ngữ cảnh Phi-e-rơ nói với cả nhóm người.
- source_word: τίνι λόγῳ
  choice: Vì lý do gì
  rationale: Giữ cách diễn đạt đầy đủ của nguyên văn, thay vì rút gọn thành “tại sao”.
- source_word: μετεπέμψασθέ με
  choice: quý vị cho gọi tôi đến
  rationale: Động từ có nghĩa sai người gọi hoặc triệu ai đến. “Cho gọi tôi đến” tự nhiên trong tiếng Việt và giữ liên hệ từ vựng với “được gọi đến” ở vế trước; “quý vị” thể hiện ngôi thứ hai số nhiều.
theological_decisions: []
translation_notes:
  register: Văn phong trang trọng vừa phải, rõ ràng và tự nhiên đối với độc giả Việt Nam hiện đại. Dùng “quý vị” vì người nghe là một nhóm người và để giữ phép lịch sự phù hợp với lời hỏi trực tiếp.
