  source_fidelity: 'Bản dịch chuyển tải đúng các thành tố chính của câu: Phi-e-rơ đang lưu trú với một người tên Si-môn, người làm nghề thuộc da, và nhà của Si-môn ở gần biển. Tuy nhiên, “Người” viết hoa dễ tạo sắc thái tôn kính không do văn bản Hy Lạp đánh dấu và đại từ “ông ấy” ở mệnh đề sau có thể thoáng gây mơ hồ quy chiếu.'
