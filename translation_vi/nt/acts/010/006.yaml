  yaml_path: translation/nt/acts/010/006.yaml
  text: He is lodging with a certain Simon[a], a tanner, whose house is by the sea.
translation:
  language: vi
  text: Ông ấy đang trọ tại nhà một người tên là Si-môn, làm nghề thuộc da; nhà người này ở gần biển.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Một số bản chép thêm: “Người này sẽ nói cho ngươi biết ngươi phải làm gì.”'
    reason: textual_variant
lexical_decisions:
- source_word: οὗτος
  choice: Người
  rationale: Đại từ chỉ định này quy chiếu về Phi-e-rơ trong ngữ cảnh. Tiếng Việt tự nhiên có thể dùng “Người” để nối với lời thiên sứ đang nói về ông mà không cần lặp tên.
- source_word: ξενίζεται
  choice: đang trọ tại nhà
  rationale: Dạng hiện tại trung động/bị động của ξενίζω diễn tả việc được tiếp làm khách hoặc đang lưu trú với ai đó. “Đang trọ tại nhà” vừa tự nhiên vừa giữ được sắc thái được chủ nhà tiếp đón.
- source_word: παρά τινι
  choice: tại nhà một người tên là
  rationale: παρά với tặng cách biểu thị sự lưu trú bên một người, còn τις mang tính bất định. Cách dịch này tự nhiên trong tiếng Việt và không xác định nhân vật quá mức.
- source_word: Σίμωνι
  choice: Si-môn
  rationale: Phiên âm tên riêng theo lối quen dùng trong tiếng Việt.
- source_word: βυρσεῖ
  choice: làm nghề thuộc da
  rationale: βυρσεύς chỉ người xử lý da thú thành da thuộc. Cụm từ này chính xác và dễ hiểu hơn danh từ nghề nghiệp ít thông dụng “thợ thuộc da” trong câu này.
- source_word: ᾧ ἐστιν οἰκία
  choice: nhà ông ấy ở
  rationale: Cấu trúc đại từ quan hệ cộng với ἐστιν οἰκία cho biết căn nhà thuộc về Si-môn. “Nhà ông ấy ở” là cách diễn đạt gọn và tự nhiên.
- source_word: παρὰ θάλασσαν
  choice: gần biển
  rationale: παρά với đối cách ở đây diễn tả vị trí sát hoặc gần biển. “Gần biển” tự nhiên và không khẳng định căn nhà nằm ngay mép nước.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “làm nghề thuộc da” để tránh thuật ngữ nghề nghiệp xa lạ; giữ địa điểm “gần biển” ngắn gọn. Chú thích ghi nhận phần văn bản dài hơn có trong một số thủ bản nhưng không thuộc văn bản chính SBLGNT.
