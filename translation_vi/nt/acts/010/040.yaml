base_translation:
  language: en
  yaml_path: translation/nt/acts/010/040.yaml
  text: God raised this one on the third day and granted him to become visible[b][a],
translation:
  language: vi
  text: Chính người ấy[a], Đức Chúa Trời đã làm cho sống lại vào ngày thứ ba và cho người ấy được tỏ hiện[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “người này” hoặc đơn giản là “người ấy”; đại từ chỉ định trong tiếng Hy Lạp được đặt ở vị trí nhấn mạnh.'
    reason: lexical_alternative
  - marker: b
    text: 'Dịch sát: “cho người ấy trở nên thấy được”; cũng có thể dịch là “làm cho người ấy hiện ra.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτον
  choice: chính người ấy
  rationale: Đại từ chỉ định được đưa lên đầu câu để nhấn mạnh chính Đức Giê-su, là người vừa được nhắc đến. “Chính người ấy” vừa giữ được sắc thái nhấn mạnh vừa tự nhiên hơn cách dịch máy móc “người này” trong tiếng Việt.
- source_word: ὁ θεὸς
  choice: Đức Chúa Trời
  rationale: Chủ ngữ xác định của động từ; đây là cách gọi trang trọng, quen thuộc trong tiếng Việt hiện đại.
- source_word: ἤγειρεν
  choice: đã làm cho sống lại
  rationale: Trong ngữ cảnh phục sinh, ἐγείρω chỉ hành động Đức Chúa Trời làm cho Đức Giê-su sống lại. Cách dịch này rõ nghĩa và không thêm chi tiết ngoài nguyên văn.
- source_word: τῇ τρίτῃ ἡμέρᾳ
  choice: vào ngày thứ ba
  rationale: Giữ nguyên cách diễn đạt thời gian của nguyên văn, không xác định thêm phương thức tính ngày.
- source_word: ἔδωκεν
  choice: cho
  rationale: Giữ nghĩa cơ bản của δίδωμι trong kết cấu với động từ nguyên mẫu, đồng thời tạo câu tiếng Việt tự nhiên và tránh khẳng định quá mức sắc thái cưỡng khiến.
- source_word: αὐτὸν
  choice: người ấy
  rationale: Đại từ chỉ Đức Giê-su; lặp lại “người ấy” giúp câu rõ chủ thể mà không du nhập lối viết hoa đại từ vốn không có trong nguyên văn.
- source_word: ἐμφανῆ
  choice: hiện ra
  rationale: Trong kết cấu ἐμφανῆ γενέσθαι, từ này diễn tả việc trở nên có thể được nhận thấy hoặc được tỏ hiện. “Hiện ra” là cách nói tự nhiên trong ngữ cảnh các lần Đức Giê-su xuất hiện sau khi sống lại.
- source_word: γενέσθαι
  choice: hiện ra
  rationale: Nghĩa “trở nên/đi đến chỗ là” được kết hợp tự nhiên với ἐμφανῆ thành “hiện ra”; chú thích giữ lại cách diễn đạt sát chữ hơn.
theological_decisions:
- issue: Cách diễn đạt sự phục sinh
  choice: Đức Chúa Trời đã làm cho [chính người ấy] sống lại vào ngày thứ ba
  alternative: Đức Chúa Trời đã khiến người ấy trỗi dậy vào ngày thứ ba
  rationale: Bản dịch nêu trực tiếp hành động của Đức Chúa Trời và giữ sự nhấn mạnh vào chính Đức Giê-su, không bổ sung một cách giải thích thần học vượt quá câu văn.
- issue: Việc Đức Giê-su được tỏ hiện sau khi sống lại
  choice: cho người ấy hiện ra
  alternative: làm cho người ấy được tỏ hiện
  rationale: Cách dịch phân biệt việc sống lại với việc sau đó được hiện ra, đồng thời giữ được độ mở giữa sắc thái cho phép/ban cho và làm cho trong kết cấu Hy Lạp.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “chính người ấy” để bảo toàn điểm nhấn của đại từ chỉ định; không viết hoa đại từ chỉ Đức Giê-su vì nguyên văn không mã hóa sự tôn kính bằng hình thức ấy. “Cho người ấy hiện ra” ưu tiên tính tự nhiên nhưng chú thích vẫn ghi cách dịch sát chữ.
