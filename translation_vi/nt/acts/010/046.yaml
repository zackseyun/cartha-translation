base_translation:
  language: en
  yaml_path: translation/nt/acts/010/046.yaml
  text: 'For they were hearing them speaking in tongues and magnifying God[a]. Then Peter answered:'
translation:
  language: vi
  text: 'Vì họ đang nghe những người ấy nói bằng các thứ tiếng[a] và tôn cao Đức Chúa Trời. Bấy giờ, Phi-e-rơ đáp:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “nói tiếng lạ.” Từ Hy Lạp có thể chỉ ngôn ngữ; cụm từ này không xác định cụ thể bản chất của lời nói.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤκουον
  choice: đang nghe
  rationale: Thì vị hoàn diễn tả hành động đang tiếp diễn; cách dịch này giữ được sắc thái kéo dài mà vẫn tự nhiên trong tiếng Việt.
- source_word: γὰρ
  choice: Vì
  rationale: Liên từ nêu căn cứ giải thích cho lời ngay trước đó.
- source_word: αὐτῶν
  choice: những người ấy
  rationale: Giữ quy chiếu đại từ đến nhóm người vừa được nhắc tới mà không đưa thêm cách gọi mang tính diễn giải.
- source_word: λαλούντων
  choice: nói
  rationale: Động tính từ hiện tại phối hợp với μεγαλυνόντων, chỉ hành động diễn ra đồng thời với việc nghe.
- source_word: γλώσσαις
  choice: bằng các thứ tiếng
  rationale: γλῶσσα có thể chỉ cái lưỡi hoặc ngôn ngữ; trong kết cấu này, 'các thứ tiếng' là tiếng Việt tự nhiên, đồng thời chú thích giữ lại cách hiểu 'các tiếng lạ' quen thuộc trong ngữ cảnh thần học.
- source_word: μεγαλυνόντων
  choice: tôn cao
  rationale: Diễn đạt ý làm cho sự vĩ đại của Đức Chúa Trời được tuyên xưng; sát nghĩa hơn 'ca ngợi' mà vẫn tự nhiên, trang trọng.
- source_word: τὸν θεόν
  choice: Đức Chúa Trời
  rationale: Cách gọi trang trọng và phổ thông trong văn phong Kinh Thánh tiếng Việt.
- source_word: τότε
  choice: Bấy giờ
  rationale: Đánh dấu diễn tiến kế tiếp trong câu chuyện bằng lối văn trang trọng, tự nhiên.
- source_word: ἀπεκρίθη
  choice: lên tiếng
  rationale: Động từ có nghĩa 'đáp lại'; vì không có câu hỏi trực tiếp đứng trước, 'lên tiếng' tự nhiên trong tiếng Việt mà vẫn diễn tả phản ứng của Phi-e-rơ.
- source_word: Πέτρος
  choice: Phi-e-rơ
  rationale: Dạng tên riêng đã quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
theological_decisions:
- issue: Ý nghĩa của γλώσσαις trong ngữ cảnh lời nói do Thánh Linh ban
  choice: bằng các thứ tiếng
  alternative: bằng các tiếng lạ
  rationale: Từ Hy Lạp có thể nói đến ngôn ngữ hoặc hiện tượng thường được gọi là 'nói tiếng lạ'. Bản chính dùng cách diễn đạt rộng và tự nhiên, còn chú thích bảo tồn phương án kia để không quyết định thay cho độc giả về bản chất của lời nói.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng 'tôn cao' để giữ hình ảnh của μεγαλύνω; dùng 'lên tiếng' thay cho cách dịch máy móc 'đáp' khi không có câu hỏi trực tiếp. Dấu hai chấm cuối câu được giữ vì lời của Phi-e-rơ tiếp tục ở câu sau.
