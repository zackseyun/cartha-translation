- from: 'Vì họ đang nghe những người ấy nói bằng các thứ tiếng[a] và tôn cao Đức Chúa Trời. Bấy giờ, Phi-e-rơ lên tiếng:'
  to: 'Vì họ đang nghe những người ấy nói bằng các thứ tiếng[a] và tôn cao Đức Chúa Trời. Bấy giờ, Phi-e-rơ đáp:'
