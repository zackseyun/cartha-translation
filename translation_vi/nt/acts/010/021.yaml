  terminology: “Phi-e-rơ” là cách phiên âm quen thuộc; “các ông” phù hợp với τοὺς ἄνδρας trong ngữ cảnh nhóm người nam. Không có thuật ngữ thần học hoặc cách diễn đạt mang định hướng giáo phái.
