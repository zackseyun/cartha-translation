source:
  edition: SBLGNT
  text: καταβὰς δὲ Πέτρος πρὸς τοὺς ἄνδρας εἶπεν· Ἰδοὺ ἐγώ εἰμι ὃν ζητεῖτε· τίς ἡ αἰτία δι’ ἣν πάρεστε;
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/021.yaml
  text: So Peter went down to the men and said[a], “Look, I am the one you are looking for. Why are you here?”
translation:
  language: vi
  text: 'Vậy, Phi-e-rơ đi xuống gặp những người ấy và nói: “Này, tôi chính là người các ông đang tìm. Vì lý do gì các ông có mặt ở đây?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καταβὰς
  choice: đi xuống
  rationale: Giữ rõ hướng chuyển động từ nơi cao xuống chỗ những người khách đang đứng, đồng thời diễn đạt tự nhiên trong tiếng Việt.
- source_word: δὲ
  choice: Vậy
  rationale: Ở đây δέ đánh dấu bước tiếp theo của câu chuyện hơn là sự tương phản mạnh; “Vậy” nối tự nhiên với mạch văn trước.
- source_word: πρὸς τοὺς ἄνδρας
  choice: gặp những người ấy
  rationale: πρός với đối cách chỉ sự di chuyển đến chỗ họ. “Gặp những người ấy” tự nhiên trong tiếng Việt và chuẩn bị cho lời đối thoại ngay sau đó.
- source_word: Ἰδοὺ
  choice: Này
  rationale: “Này” là từ thu hút sự chú ý tự nhiên, trang trọng vừa phải, tương ứng với chức năng diễn ngôn của ἰδού.
- source_word: ἐγώ εἰμι ὃν ζητεῖτε
  choice: tôi chính là người các ông đang tìm
  rationale: “Chính là” làm rõ sắc thái tự nhận diện của ἐγώ εἰμι, còn “đang tìm” diễn đạt tự nhiên hành động hiện tại của ζητεῖτε.
- source_word: τίς ἡ αἰτία δι’ ἣν πάρεστε
  choice: Vì lý do gì các ông có mặt ở đây?
  rationale: Giữ danh từ αἰτία là “lý do” và sắc thái trạng thái hiện diện của πάρεστε, thay vì diễn giải thành “đến đây”.
