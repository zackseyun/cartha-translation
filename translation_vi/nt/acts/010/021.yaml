  source_fidelity: 'Bản dịch phản ánh đúng các thành tố chính của câu Hy Lạp: καταβὰς là “đi xuống”; πρὸς τοὺς ἄνδρας được diễn đạt tự nhiên là “gặp những người ấy”; lời tự nhận diện “tôi chính là người các ông đang tìm” chuyển tải đầy đủ ἐγώ εἰμι ὃν ζητεῖτε; và câu hỏi cuối vẫn giữ rõ “lý do” (αἰτία) cùng ý họ đang hiện diện tại đó (πάρεστε).'
