id: ACT.10.42
reference: Acts 10:42
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ παρήγγειλεν ἡμῖν κηρύξαι τῷ λαῷ καὶ διαμαρτύρασθαι ὅτι ⸀οὗτός ἐστιν ὁ ὡρισμένος ὑπὸ τοῦ θεοῦ κριτὴς ζώντων καὶ νεκρῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/042.yaml
  text: And he commanded us to proclaim to the people and to testify solemnly that this is the one appointed by God as judge of the living and the dead[a].
translation:
  language: vi
  text: Ngài truyền cho chúng tôi rao giảng cho dân chúng và long trọng làm chứng rằng chính Ngài là Đấng được Đức Chúa Trời chỉ định làm Đấng phán xét người sống và người chết.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Đấng được Đức Chúa Trời ấn định làm Thẩm Phán của người sống và người chết.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρήγγειλεν
  choice: truyền
  rationale: Diễn đạt một mệnh lệnh có thẩm quyền, tự nhiên và trang trọng trong tiếng Việt.
- source_word: κηρύξαι
  choice: rao giảng
  rationale: Giữ ý công bố công khai của κηρύσσω; trong ngữ cảnh Công Vụ, “rao giảng” tự nhiên hơn nhưng không giới hạn vào một bài giảng theo nghĩa hiện đại.
- source_word: τῷ λαῷ
  choice: cho dân chúng
  rationale: Không thêm “Y-sơ-ra-ên,” vì danh xưng ấy không có ngay trong câu, đồng thời giữ đối tượng tập thể do mạo từ xác định.
- source_word: διαμαρτύρασθαι
  choice: long trọng làm chứng
  rationale: Giữ cả sắc thái làm chứng lẫn tính nghiêm túc, tha thiết của động từ.
- source_word: οὗτός
  choice: chính Ngài
  rationale: Đại từ chỉ định nhấn mạnh quy chiếu về Chúa Giê-su trong văn cảnh; “chính Ngài” tự nhiên hơn cách dịch máy móc “người này” và vẫn giữ sự nhấn mạnh.
- source_word: ὁ ὡρισμένος
  choice: Đấng được ... chỉ định
  rationale: Phân từ hoàn thành bị động nói đến người đã được xác định hoặc bổ nhiệm và hiện mang địa vị ấy; “chỉ định” rõ nghĩa, hiện đại và ít mang hàm ý giáo phái hơn “tấn phong.”
- source_word: ὑπὸ τοῦ θεοῦ
  choice: được Đức Chúa Trời
  rationale: Giữ rõ tác nhân của cấu trúc bị động; dùng danh xưng trang trọng, quen thuộc trong văn phong Kinh Thánh tiếng Việt.
- source_word: κριτὴς
  choice: Đấng phán xét
  rationale: Diễn đạt vai trò xét xử tối hậu bằng cách nói tự nhiên, trang trọng; “Đấng” phù hợp với quy chiếu về Chúa Giê-su.
- source_word: ζώντων καὶ νεκρῶν
  choice: người sống và người chết
  rationale: Giữ nguyên cặp đối xứng và phạm vi phổ quát, trang trọng của nguyên văn.
theological_decisions:
- issue: Quyền phán xét do Đức Chúa Trời chỉ định cho Chúa Giê-su
  choice: chính Ngài là Đấng được Đức Chúa Trời chỉ định làm Đấng phán xét người sống và người chết
  alternative: chính Ngài là Đấng được Đức Chúa Trời ấn định làm Thẩm Phán của người sống và người chết
  rationale: Bản dịch giữ nguyên lời khẳng định rằng Đức Chúa Trời đã chỉ định Chúa Giê-su làm Đấng phán xét mọi người, không triển khai câu này thành một công thức thần học về sau.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “Ngài” theo quy chiếu rõ ràng từ văn cảnh về Chúa Giê-su; dùng “dân chúng” thay vì tự ý xác định là Y-sơ-ra-ên. Dấu chú thích [a] được đặt ngay sau mệnh đề liên quan.
