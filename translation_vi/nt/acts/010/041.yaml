  source_fidelity: Bản dịch giữ đúng cấu trúc tương phản của οὐ ... ἀλλὰ, giới hạn đối tượng là các nhân chứng đã được Đức Chúa Trời chọn từ trước, và làm rõ ἡμῖν là cụm đồng vị với “những nhân chứng.” “Đã ăn uống với Ngài” truyền đạt đầy đủ συνεφάγομεν καὶ συνεπίομεν αὐτῷ; “sau khi Ngài sống lại từ cõi chết” phản ánh tự nhiên ἀναστῆναι αὐτὸν ἐκ νεκρῶν.
  naturalness: Tiếng Việt hiện đại, trang trọng và mạch lạc. Cấu trúc “—tức là cho chúng tôi” giúp người đọc nhận ra quan hệ giải thích/đồng vị mà không làm câu nặng nề.
  terminology: “Nhân chứng,” “Đức Chúa Trời,” “Ngài,” và “sống lại từ cõi chết” nhất quán với văn phong Kinh Thánh Việt ngữ hiện đại. Chú thích a nêu phương án từ vựng hợp lý; chú thích b phân biệt cách dịch chính với cách diễn đạt bị động thấy ở những ngữ cảnh khác mà không biến phương án này thành nội dung chính của câu.
