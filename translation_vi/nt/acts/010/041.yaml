id: ACT.10.41
reference: Acts 10:41
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οὐ παντὶ τῷ λαῷ ἀλλὰ μάρτυσι τοῖς προκεχειροτονημένοις ὑπὸ τοῦ θεοῦ, ἡμῖν, οἵτινες συνεφάγομεν καὶ συνεπίομεν αὐτῷ μετὰ τὸ ἀναστῆναι αὐτὸν ἐκ νεκρῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/041.yaml
  text: not to all the people[a], but to witnesses who had been chosen beforehand by God—to us[b], who ate and drank with him after he rose from the dead.
translation:
  language: vi
  text: không phải cho toàn dân, nhưng cho những nhân chứng đã được Đức Chúa Trời chọn trước[a]—tức là cho chúng tôi, những người đã ăn uống với Ngài sau khi Ngài sống lại từ cõi chết[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đã được Đức Chúa Trời chỉ định từ trước.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “sau khi Ngài được làm cho sống lại từ cõi chết.” Tiếng Hy Lạp ở đây được dịch tự nhiên là “sau khi Ngài sống lại từ cõi chết,” dù cách diễn đạt bị động xuất hiện ở những chỗ khác trong Tân Ước.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὐ παντὶ τῷ λαῷ
  choice: không phải cho toàn dân
  rationale: Giữ nguyên phạm vi phủ định và sự tương phản với nhóm nhân chứng giới hạn; không thêm động từ vốn chỉ được hiểu từ ngữ cảnh.
- source_word: μάρτυσι
  choice: những nhân chứng
  rationale: Diễn đạt rõ những người làm chứng về điều họ đã tận mắt chứng kiến, phù hợp cách dùng phổ biến trong Công Vụ.
- source_word: τοῖς προκεχειροτονημένοις ὑπὸ τοῦ θεοῦ
  choice: đã được Đức Chúa Trời chọn trước
  rationale: Thể hoàn thành bị động diễn tả sự lựa chọn đã xảy ra từ trước và vẫn có hiệu lực; đồng thời giữ rõ Đức Chúa Trời là tác nhân.
- source_word: ἡμῖν
  choice: tức là cho chúng tôi
  rationale: 'Làm rõ quan hệ đồng vị: “chúng tôi” chính là các nhân chứng vừa được nhắc đến.'
- source_word: οἵτινες συνεφάγομεν καὶ συνεπίομεν αὐτῷ
  choice: những người đã ăn uống với Ngài
  rationale: Giữ hình ảnh cụ thể về việc cùng ăn và cùng uống, nhấn mạnh sự giao tiếp thực sự với Chúa Giê-su sau khi Ngài sống lại.
- source_word: μετὰ τὸ ἀναστῆναι αὐτὸν ἐκ νεκρῶν
  choice: sau khi Ngài sống lại từ cõi chết
  rationale: Kết cấu với μετά mang nghĩa thời gian “sau khi”; ἀναστῆναι ở đây tự nhiên được hiểu theo nghĩa nội động từ “sống lại”.
theological_decisions:
- issue: Cách diễn đạt sự phục sinh trong ἀναστῆναι αὐτὸν ἐκ νεκρῶν
  choice: sau khi Ngài sống lại từ cõi chết
  alternative: sau khi Ngài được làm cho sống lại từ cõi chết
  rationale: Cách dịch chủ động phản ánh tự nhiên hình thức Hy Lạp trong câu này mà không phủ nhận tác động của Đức Chúa Trời được nói rõ ở những nơi khác. Cách bị động vẫn là một khả năng diễn đạt thần học và được ghi ở chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dấu gạch ngang cùng cụm “tức là” làm rõ quan hệ đồng vị của ἡμῖν. “Ăn uống với Ngài” tự nhiên trong tiếng Việt và vẫn giữ được tính cụ thể của hai động từ Hy Lạp.
