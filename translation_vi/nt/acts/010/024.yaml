source:
  edition: SBLGNT
  text: ⸂τῇ δὲ⸃ ἐπαύριον ⸀εἰσῆλθεν εἰς τὴν Καισάρειαν. ὁ δὲ Κορνήλιος ἦν προσδοκῶν αὐτοὺς συγκαλεσάμενος τοὺς συγγενεῖς αὐτοῦ καὶ τοὺς ἀναγκαίους φίλους.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/024.yaml
  text: On the next day he entered Caesarea[a]. Now Cornelius was expecting them and had called together his relatives and close friends.
translation:
  language: vi
  text: Ngày hôm sau, ông vào thành Sê-sa-rê[a]. Còn Cọt-nây đang chờ họ và đã gọi bà con cùng những người bạn thân của mình đến.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Trong tiếng Hy Lạp, động từ “vào” ở số ít, nhưng đại từ “họ” ở phần sau lại ở số nhiều. Cách diễn đạt này có lẽ tập trung vào Phi-e-rơ là nhân vật chính, đồng thời kể cả những người đi cùng ông mà Cọt-nây đang chờ.
    reason: Sự chuyển đổi từ số ít sang số nhiều trong nguyên văn cần được giữ lại và giải thích, thay vì âm thầm đồng nhất chủ thể.
lexical_decisions:
- source_word: τῇ δὲ ἐπαύριον
  choice: Ngày hôm sau
  rationale: Diễn đạt tự nhiên trình tự thời gian; δέ chỉ chuyển tiếp nhẹ nên không cần dịch riêng.
- source_word: εἰσῆλθεν εἰς τὴν Καισάρειαν
  choice: ông vào thành Sê-sa-rê
  rationale: Giữ động từ số ít của bản Hy Lạp, quy chiếu đến Phi-e-rơ như nhân vật chính; thêm “thành” để địa danh tự nhiên, rõ nghĩa trong tiếng Việt.
- source_word: ὁ δὲ Κορνήλιος
  choice: Còn Cọt-nây
  rationale: “Còn” thể hiện sự chuyển điểm nhìn nhẹ của δέ mà không tạo ý đối lập mạnh.
- source_word: ἦν προσδοκῶν αὐτούς
  choice: đang chờ họ
  rationale: Cấu trúc vị ngữ phân từ với thì chưa hoàn thành diễn tả trạng thái chờ đợi đang tiếp diễn; giữ đại từ số nhiều αὐτούς.
- source_word: συγκαλεσάμενος
  choice: đã mời ... tụ họp lại
  rationale: Truyền đạt hành động quy tụ đã diễn ra trước lúc chờ đợi; “mời” phù hợp với việc gọi người thân và bạn bè đến, còn “tụ họp lại” bảo toàn yếu tố cùng nhau của σύν.
- source_word: τοὺς συγγενεῖς αὐτοῦ
  choice: bà con ... của mình
  rationale: “Bà con” là cách nói hiện đại, tự nhiên cho những người có quan hệ họ hàng; “của mình” quy chiếu rõ về Cọt-nây.
- source_word: τοὺς ἀναγκαίους φίλους
  choice: những người bạn thân thiết
  rationale: Trong cụm này, ἀναγκαίους chỉ quan hệ gần gũi, thân cận, không mang nghĩa đen là “cần thiết”.
theological_decisions: []
translation_notes:
  register: 'Văn phong kể chuyện trang trọng nhưng thông dụng. Giữ sự chuyển đổi số ít “ông” sang số nhiều “họ” theo nguyên văn và đánh dấu chú thích. Dùng dạng tên quen thuộc trong truyền thống Kinh Thánh tiếng Việt: Sê-sa-rê và Cọt-nây.'
