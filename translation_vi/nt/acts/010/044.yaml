id: ACT.10.44
reference: Acts 10:44
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἔτι λαλοῦντος τοῦ Πέτρου τὰ ῥήματα ταῦτα ἐπέπεσε τὸ πνεῦμα τὸ ἅγιον ἐπὶ πάντας τοὺς ἀκούοντας τὸν λόγον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/044.yaml
  text: While Peter was still speaking these words[a], the Holy Spirit fell upon all those hearing the word.
translation:
  language: vi
  text: Trong khi Phi-e-rơ còn đang nói những lời ấy, Đức Thánh Linh giáng trên tất cả những người đang nghe sứ điệp[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “lời”.
    reason: λόγος trong ngữ cảnh lời rao giảng có thể dịch sát là “lời”; “sứ điệp” làm rõ rằng đây là nội dung được Phi-e-rơ công bố, đồng thời tránh nghĩa thành ngữ của “nghe lời” trong tiếng Việt.
lexical_decisions:
- source_word: Ἔτι λαλοῦντος τοῦ Πέτρου
  choice: Khi Phi-e-rơ vẫn còn đang nói
  rationale: Cấu trúc sở hữu cách tuyệt đối với phân từ hiện tại diễn tả hành động đang tiếp diễn đồng thời với động từ chính; cách dịch này tự nhiên trong tiếng Việt và giữ rõ tính đồng thời.
- source_word: τὰ ῥήματα ταῦτα
  choice: những lời ấy
  rationale: ῥήματα trong ngữ cảnh chỉ những điều vừa được Phi-e-rơ nói; “những lời ấy” vừa sát nghĩa vừa tự nhiên hơn “các phát ngôn này”.
- source_word: ἐπέπεσε
  choice: giáng trên
  rationale: ἐπιπίπτω có hình ảnh mạnh là “rơi/ập xuống trên”. Khi chủ thể là Đức Thánh Linh, “giáng trên” giữ được sức gợi của động từ mà vẫn trang trọng, tự nhiên trong tiếng Việt Kinh Thánh hiện đại.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: Đức Thánh Linh
  rationale: Đây là cách gọi chuẩn, trang trọng và quen thuộc trong tiếng Việt hiện đại dành cho Holy Spirit.
- source_word: ἐπὶ πάντας τοὺς ἀκούοντας
  choice: trên tất cả những người đang nghe
  rationale: Giữ phạm vi bao quát của πάντας và sắc thái hành động đang diễn ra của phân từ hiện tại ἀκούοντας.
- source_word: τὸν λόγον
  choice: lời
  rationale: “Lời” giữ sự tương ứng gần với λόγος và bảo toàn độ mở giữa lời đang được công bố với sứ điệp được nghe; ngữ cảnh cho thấy đây không phải chỉ một từ đơn lẻ.
theological_decisions:
- issue: Cách diễn đạt hành động của Đức Thánh Linh trong ἐπέπεσε
  choice: Đức Thánh Linh giáng trên
  alternative: Đức Thánh Linh đến trên
  rationale: “Giáng trên” bảo tồn hình ảnh cụ thể và sức mạnh trần thuật của động từ Hy Lạp mà không giải thích sự kiện theo một hệ phái hay học thuyết riêng.
- issue: Cách dịch λόγος trong bối cảnh rao giảng
  choice: lời
  alternative: sứ điệp
  rationale: “Lời” gần hình thức nguồn hơn và duy trì hàm ý thần học cũng như tính quy chiếu đến nội dung Phi-e-rơ công bố; chú thích cung cấp cách hiểu rõ nghĩa hơn là “sứ điệp”.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “vẫn còn đang” để làm nổi bật hành động chưa kết thúc; “giáng trên” giữ sắc thái sinh động của nguyên ngữ. Dấu chú thích [a] được đặt ngay sau “lời”, là điểm có lựa chọn từ vựng liên quan trực tiếp nhất.
