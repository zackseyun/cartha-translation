  - severity: low
    issue: “vẫn còn đang nói” thừa nét tiếp diễn.
    rationale: “Còn đang nói” đã truyền đạt đầy đủ ἔτι cùng phân từ hiện tại, và tự nhiên hơn trong văn xuôi hiện đại.
