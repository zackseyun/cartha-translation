  to: Trong khi Phi-e-rơ còn đang nói những lời ấy, Đức Thánh Linh giáng trên tất cả những người đang nghe sứ điệp[a].
  rationale: Bản sửa giữ nguyên ý nghĩa và sức gợi của nguyên ngữ, nhưng thay “nghe lời” bằng “nghe sứ điệp” để loại bỏ một mơ hồ thành ngữ đáng kể trong tiếng Việt. “Trong khi ... còn đang nói” diễn đạt tự nhiên hơn tính đồng thời và tiếp diễn của câu Hy Lạp. Chú thích được neo lại đúng sau từ có phương án dịch và chỉ nêu lựa chọn từ vựng thực sự liên quan.
  reviewer_model: gpt-5.6-terra
