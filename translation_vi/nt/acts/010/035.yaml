  source_fidelity: Bản dịch truyền đạt đúng cấu trúc đối lập của ἀλλά, phạm vi không phân biệt của ἐν παντὶ ἔθνει, lòng kính sợ Đức Chúa Trời, hành động công chính, và sự được Ngài chấp nhận. Tuy nhiên, “người nào ... thì” phản ánh rõ và tự nhiên hơn cấu trúc phân từ danh từ hóa số ít của nguyên văn so với “bất cứ ai ... đều.”
  naturalness: “Người nào kính sợ Ngài và làm điều công chính thì được Ngài chấp nhận” là tiếng Việt tiêu chuẩn, gọn và tự nhiên hơn “bất cứ ai ... thực hành ... đều.” Cách này cũng tránh sự kết hợp hơi nặng giữa “bất cứ ai” và “đều.”
