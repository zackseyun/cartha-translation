id: ACT.10.35
reference: Acts 10:35
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀλλ’ ἐν παντὶ ἔθνει ὁ φοβούμενος αὐτὸν καὶ ἐργαζόμενος δικαιοσύνην δεκτὸς αὐτῷ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/035.yaml
  text: but in every nation the one who fears him and does what is righteous is acceptable to him[a][b][c].
translation:
  language: vi
  text: Nhưng trong mọi dân tộc, người nào kính sợ Ngài và làm điều công chính thì được Ngài chấp nhận.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “và thực hành sự công chính” hoặc “và sống công chính.”'
    reason: lexical_alternative
  - marker: b
    text: Từ Hy Lạp δικαιοσύνη thường có nghĩa là “sự công chính”; trong một số ngữ cảnh cũng có thể dịch là “công lý.”
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “là người được Ngài vui nhận.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλ’
  choice: nhưng
  rationale: Diễn tả sự tương phản với lời ngay trước đó rằng Đức Chúa Trời không thiên vị; “nhưng” tự nhiên và sát nghĩa trong tiếng Việt.
- source_word: ἐν παντὶ ἔθνει
  choice: trong mọi dân tộc
  rationale: Giữ ý phân bố của παντί và nghĩa thông dụng của ἔθνος, không giới hạn vào quốc gia theo nghĩa chính trị hiện đại.
- source_word: ὁ φοβούμενος αὐτὸν
  choice: bất cứ ai kính sợ Ngài
  rationale: Diễn đạt tự nhiên phân từ có mạo từ dùng như danh từ; “kính sợ” giữ được sắc thái vừa tôn kính vừa kính úy đối với Đức Chúa Trời.
- source_word: καὶ ἐργαζόμενος δικαιοσύνην
  choice: và thực hành điều công chính
  rationale: ἐργάζομαι chỉ hành động tích cực, còn δικαιοσύνην nói đến điều công chính; cách diễn đạt này trang trọng nhưng vẫn dễ hiểu trong tiếng Việt hiện đại.
- source_word: δικαιοσύνην
  choice: điều công chính
  rationale: Giữ trường nghĩa đạo đức của δικαιοσύνη mà không thu hẹp thành nghĩa pháp lý hay chỉ riêng công bằng xã hội.
- source_word: δεκτὸς αὐτῷ ἐστιν
  choice: đều được Ngài chấp nhận
  rationale: Truyền đạt tự nhiên ý được đón nhận thuận lợi của δεκτός. Dạng này khả dĩ trong tiếng Việt, dù nguyên văn Hy Lạp có cấu trúc tính từ vị ngữ, sát hơn với “được Ngài xem là đáng chấp nhận” hoặc “là người được Ngài vui nhận”.
theological_decisions:
- issue: Câu này có dạy rằng con người nhờ việc làm mà đạt được sự cứu rỗi hay mô tả người được Đức Chúa Trời đón nhận không phân biệt dân tộc
  choice: Giữ nguyên lời khẳng định rằng trong mọi dân tộc, người kính sợ Đức Chúa Trời và thực hành điều công chính được Ngài chấp nhận, không thêm lời giải thích giáo lý.
  alternative: Diễn giải theo công trạng (“nhờ việc làm mà giành được sự chấp nhận”) hoặc theo dấu hiệu của đức tin cứu rỗi (“chứng tỏ mình có đức tin cứu rỗi”).
  rationale: Nguyên văn liên hệ sự chấp nhận của Đức Chúa Trời với việc kính sợ Ngài và thực hành sự công chính trong bối cảnh Ngài không thiên vị. Bản dịch không nên tự giải quyết căng thẳng thần học rộng hơn mà câu này không giải thích.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” để chỉ Đức Chúa Trời theo ngữ cảnh. “Bất cứ ai” làm rõ lực khái quát của phân từ số ít; “thực hành điều công chính” giữ sắc thái hành động liên tục mà không diễn giải theo một hệ phái.
