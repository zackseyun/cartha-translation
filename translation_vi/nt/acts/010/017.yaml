id: ACT.10.17
reference: Acts 10:17
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ὡς δὲ ἐν ἑαυτῷ διηπόρει ὁ Πέτρος τί ἂν εἴη τὸ ὅραμα ὃ εἶδεν, ⸀ἰδοὺ οἱ ἄνδρες οἱ ἀπεσταλμένοι ⸀ὑπὸ τοῦ Κορνηλίου διερωτήσαντες τὴν οἰκίαν ⸀τοῦ Σίμωνος ἐπέστησαν ἐπὶ τὸν πυλῶνα,
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/017.yaml
  text: While Peter was inwardly perplexed as to what the vision that he had seen might mean[a], behold, the men who had been sent by Cornelius, having asked directions to Simon’s house[b], stood at the gate.
translation:
  language: vi
  text: Trong khi Phi-e-rơ đang bối rối trong lòng, tự hỏi khải tượng mình đã thấy có ý nghĩa gì[a], thì kìa, những người được Cọt-nây sai đi, sau khi hỏi đường đến nhà Si-môn, đã đứng trước cổng[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “khải tượng mình đã thấy là gì.” Tiếng Hy Lạp có thể được dịch sát hơn như vậy, nhưng trong ngữ cảnh, cụm từ này có lẽ nói đến ý nghĩa của khải tượng.'
    reason: lexical_alternative
  - marker: b
    text: 'Hay: “tại lối cổng.” Từ Hy Lạp có thể chỉ cổng hoặc khu vực lối vào của một ngôi nhà.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὡς δὲ
  choice: Trong khi ... thì
  rationale: Diễn đạt tự nhiên bối cảnh đồng thời và sự chuyển tiếp nhẹ trong câu chuyện, không thêm một từ chỉ thời gian như “bấy giờ” vốn không có rõ trong nguyên văn.
- source_word: ἐν ἑαυτῷ διηπόρει
  choice: vẫn đang bối rối trong lòng, tự hỏi
  rationale: “Bối rối trong lòng” giữ sắc thái nội tâm; “vẫn đang” phản ánh hành động kéo dài của thì chưa hoàn thành, còn “tự hỏi” nối tự nhiên với mệnh đề gián tiếp theo sau.
- source_word: τί ἂν εἴη
  choice: có ý nghĩa gì
  rationale: Trong ngữ cảnh, Phi-e-rơ đang cố hiểu ý nghĩa của khải tượng. Chú thích giữ lại cách dịch sát chữ “là gì” vì tiếng Hy Lạp có thể được hiểu theo cách ấy.
- source_word: τὸ ὅραμα ὃ εἶδεν
  choice: khải tượng mình đã thấy
  rationale: “Khải tượng” là cách gọi trang trọng nhưng quen thuộc cho một cảnh tượng được mặc khải; cấu trúc này tự nhiên trong tiếng Việt và giữ đúng trình tự quá khứ.
- source_word: ἰδοὺ
  choice: kìa
  rationale: Giữ dấu hiệu diễn ngôn tạo sự chú ý và tính sinh động của câu chuyện.
- source_word: οἱ ἄνδρες οἱ ἀπεσταλμένοι ὑπὸ τοῦ Κορνηλίου
  choice: những người được Cọt-nây sai đi
  rationale: Giữ ý bị động và xác định nhóm người nam trong ngữ cảnh; tiếng Việt không cần lặp đại từ quan hệ.
- source_word: διερωτήσαντες τὴν οἰκίαν τοῦ Σίμωνος
  choice: sau khi hỏi đường đến nhà Si-môn
  rationale: Phân từ bất định chỉ hành động xảy ra trước động từ chính; trong ngữ cảnh, họ đã hỏi để tìm nhà Si-môn, nên “hỏi đường đến” rõ và tự nhiên.
- source_word: ἐπέστησαν ἐπὶ τὸν πυλῶνα
  choice: đã đứng trước cổng
  rationale: Giữ hình ảnh họ đến và đứng tại lối vào; “trước cổng” tự nhiên trong tiếng Việt, trong khi chú thích nêu phạm vi nghĩa rộng hơn của πυλών.
theological_decisions:
- issue: Phi-e-rơ suy xét bản chất hay ý nghĩa của khải tượng
  choice: có ý nghĩa gì
  alternative: là gì
  rationale: Ngữ cảnh nghiêng về việc tìm hiểu ý nghĩa hay tầm quan trọng của khải tượng, nhưng nguyên văn τί ἂν εἴη vẫn cho phép cách dịch sát hơn; sự mơ hồ được bảo tồn trong chú thích.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Phi-e-rơ,” “Cọt-nây,” và “Si-môn” theo lối phiên âm tên riêng quen thuộc trong bản văn Kinh Thánh tiếng Việt; giữ “kìa” để bảo tồn sắc thái kể chuyện sinh động của ἰδοὺ.
