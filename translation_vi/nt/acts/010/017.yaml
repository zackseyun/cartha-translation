  to: Trong khi Phi-e-rơ đang bối rối trong lòng, tự hỏi khải tượng mình đã thấy có ý nghĩa gì[a], thì kìa, những người được Cọt-nây sai đi, sau khi hỏi đường đến nhà Si-môn, đã đứng trước cổng[b].
