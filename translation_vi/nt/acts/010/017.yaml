  source_fidelity: Bản dịch chuyển đạt đúng mạch thời gian, sự bối rối nội tâm của Phi-e-rơ, đối tượng ông suy xét, dấu hiệu kể chuyện “kìa,” việc những người này được Cọt-nây sai đi, hành động hỏi đường xảy ra trước, và việc họ đứng tại cổng. Tuy nhiên, “vẫn đang” thêm sắc thái tiếp diễn kiểu “vẫn/còn” mạnh hơn điều thì chưa hoàn thành Hy Lạp tự nó đòi hỏi; “đang” đã đủ diễn tả tính đang diễn tiến.
  naturalness: Câu văn tự nhiên, trang trọng vừa phải và dễ hiểu trong tiếng Việt hiện đại. Việc bỏ “vẫn” làm câu gọn hơn mà vẫn giữ đúng sắc thái của διηπόρει.
  terminology: “Khải tượng,” “Phi-e-rơ,” “Cọt-nây,” và “Si-môn” nhất quán với quy ước tên riêng và văn phong Kinh Thánh Việt ngữ của bản thảo. Chú thích a bảo lưu hợp lý khả năng dịch sát τί ἂν εἴη là “là gì”; chú thích b được neo đúng tại “cổng.”
  issues:
  - severity: low
    issue: Từ “vẫn” trong “vẫn đang bối rối” có thể thêm sắc thái “còn tiếp diễn” không được phát biểu riêng trong nguyên văn.
    rationale: διηπόρει ở thì chưa hoàn thành biểu thị trạng thái bối rối đang diễn ra; “đang bối rối” truyền đạt đủ ý này, còn “vẫn” thường hàm ý sự tiếp tục đối lập với một mốc hay kỳ vọng trước đó.
