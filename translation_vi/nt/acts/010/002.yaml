  terminology: “Đức Chúa Trời,” “kính sợ,” “bố thí,” và “dân chúng” nhất quán với văn phong Kinh Thánh tiếng Việt hiện đại. Chú thích a bảo lưu đúng khả năng cụm từ này là một mô tả quen thuộc về người ngoại bang thờ phượng Đức Chúa Trời của Ít-ra-ên, mà không biến nó thành một nhãn kỹ thuật trong chính văn.
  issues:
