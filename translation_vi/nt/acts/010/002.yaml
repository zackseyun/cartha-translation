id: ACT.10.2
reference: Acts 10:2
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εὐσεβὴς καὶ φοβούμενος τὸν θεὸν σὺν παντὶ τῷ οἴκῳ αὐτοῦ, ⸀ποιῶν ἐλεημοσύνας πολλὰς τῷ λαῷ καὶ δεόμενος τοῦ θεοῦ διὰ παντός,
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/002.yaml
  text: devout and fearing God with all his household[a], doing many acts of charity for the people and praying to God continually[b],
translation:
  language: vi
  text: là người sùng kính và kính sợ Đức Chúa Trời, cùng với toàn thể gia quyến mình,[a] làm nhiều việc từ thiện cho dân chúng[b] và luôn cầu nguyện với Đức Chúa Trời.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cụm từ “kính sợ Đức Chúa Trời” cũng có thể được hiểu như một cách gọi quen thuộc dành cho một người ngoại bang thờ phượng Đức Chúa Trời của Ít-ra-ên.
    reason: lexical_alternative
  - marker: b
    text: Hay “bố thí nhiều.” Từ Hy Lạp này thường chỉ cụ thể những món quà từ thiện dành cho người thiếu thốn.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐσεβὴς
  choice: người sùng kính
  rationale: Diễn tả lòng tôn kính được thể hiện trong đời sống tôn giáo; cách nói này trang trọng, tự nhiên và không hàm ý một truyền thống hệ phái riêng.
- source_word: φοβούμενος τὸν θεὸν
  choice: kính sợ Đức Chúa Trời
  rationale: Giữ hình thức động từ và thành ngữ Kinh Thánh, bao hàm cả lòng kính trọng lẫn sự kính sợ đối với Đức Chúa Trời.
- source_word: σὺν παντὶ τῷ οἴκῳ αὐτοῦ
  choice: cùng với cả gia đình mình
  rationale: οἶκος ở đây chỉ đơn vị gia đình hay gia quyến, không phải căn nhà vật chất; 'gia đình' là cách nói tự nhiên, dễ hiểu trong tiếng Việt hiện đại.
- source_word: ποιῶν ἐλεημοσύνας πολλὰς
  choice: làm nhiều việc từ thiện
  rationale: Truyền đạt rõ hành động giúp đỡ, đặc biệt là bố thí cho người thiếu thốn, đồng thời giữ sắc thái số nhiều và mức độ dồi dào.
- source_word: τῷ λαῷ
  choice: cho dân chúng
  rationale: Dịch cách gián tiếp chỉ những người thụ hưởng. Trong ngữ cảnh Công Vụ, 'dân chúng' có thể chỉ dân Do Thái mà không buộc bản dịch chính phải giải thích quá mức.
- source_word: δεόμενος τοῦ θεοῦ
  choice: cầu nguyện với Đức Chúa Trời
  rationale: δέομαι có thể là cầu xin hoặc khẩn nài; trong mô tả đời sống đạo của Cọt-nây, 'cầu nguyện' là rõ ràng và tự nhiên.
- source_word: διὰ παντός
  choice: luôn
  rationale: Diễn tả sự đều đặn, liên tục trong nếp sống mà không nhất thiết khẳng định hành động không gián đoạn từng giây phút.
theological_decisions:
- issue: Cách dịch thuật ngữ mô tả Cọt-nây là người kính sợ Đức Chúa Trời
  choice: kính sợ Đức Chúa Trời
  alternative: người kính sợ Đức Chúa Trời; tôn kính Đức Chúa Trời
  rationale: Cách dịch giữ cấu trúc bằng động từ của tiếng Hy Lạp và thành ngữ Kinh Thánh, đồng thời không loại bỏ khả năng cụm từ này còn là một mô tả quen thuộc dành cho người ngoại bang thờ phượng Đức Chúa Trời của Ít-ra-ên.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Câu giữ chuỗi đặc điểm mô tả của nguyên văn nhưng dùng cấu trúc tự nhiên. 'Đức Chúa Trời' được dùng nhất quán cho θεός; không thêm thuật ngữ kỹ thuật về địa vị tôn giáo của Cọt-nây vào chính văn.
