  text: ὑμεῖς οἴδατε τὸ γενόμενον ῥῆμα καθ’ ὅλης τῆς Ἰουδαίας, ⸀ἀρξάμενος ἀπὸ τῆς Γαλιλαίας μετὰ τὸ βάπτισμα ὃ ἐκήρυξεν Ἰωάννης,
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/037.yaml
  text: You yourselves know the thing that happened throughout all Judea[a], beginning from Galilee after the baptism that John proclaimed[b],
translation:
  language: vi
  text: Chính anh em biết điều đã xảy ra khắp cả miền Giu-đê[a], bắt đầu từ Ga-li-lê sau phép báp-têm mà Giăng đã công bố[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “lời/sứ điệp đã lan truyền khắp cả miền Giu-đê.” Từ Hy Lạp ῥῆμα có thể mang nghĩa “lời,” “sứ điệp” hoặc “sự việc.”'
    reason: lexical_alternative
  - marker: b
    text: Trong tiếng Hy Lạp, từ được dịch là “bắt đầu” có quan hệ cú pháp không thật rõ, nhưng vẫn xác định Ga-li-lê là điểm khởi đầu của sự việc này.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς
  choice: chính anh em
  rationale: Đại từ được nêu rõ để nhấn mạnh chủ thể; “chính anh em” chuyển tải sắc thái ấy một cách tự nhiên.
- source_word: οἴδατε
  choice: biết
  rationale: Dù có hình thái hoàn thành, động từ này thường mang nghĩa hiện tại; “biết” là cách diễn đạt trực tiếp.
- source_word: τὸ γενόμενον ῥῆμα
  choice: điều đã xảy ra
  rationale: ῥῆμα có thể chỉ lời, sứ điệp hoặc sự việc; kết hợp với γενόμενον, cụm này tự nhiên chỉ sự việc đã diễn ra, đồng thời chú thích bảo lưu khả năng hiểu là lời/sứ điệp.
- source_word: καθ’ ὅλης τῆς Ἰουδαίας
  choice: khắp cả miền Giu-đê
  rationale: κατά với sở hữu cách diễn tả phạm vi trải rộng; “khắp cả miền” giữ được sức nhấn mạnh của ὅλης.
- source_word: ἀρξάμενος ἀπὸ τῆς Γαλιλαίας
  choice: bắt đầu từ Ga-li-lê
  rationale: Giữ ý về điểm khởi đầu của ἀπό mà không cố giải quyết dứt khoát cấu trúc lỏng của phân từ.
- source_word: μετὰ τὸ βάπτισμα
  choice: sau phép báp-têm
  rationale: μετά với đối cách mang nghĩa thời gian; “sau phép báp-têm” rõ ràng và quen thuộc.
- source_word: ὃ ἐκήρυξεν Ἰωάννης
  choice: mà Giăng đã công bố
  rationale: κηρύσσω chỉ việc công bố như một sứ giả; “công bố” giữ sắc thái loan báo và không thu hẹp thành hoạt động giảng trong hội chúng.
theological_decisions:
- issue: Nghĩa của ῥῆμα trong lời tóm lược của Phi-e-rơ
  choice: “điều đã xảy ra,” bao quát các sự việc công khai liên quan đến Chúa Giê-su
  alternative: “lời” hoặc “sứ điệp đã lan truyền”
  rationale: Ngữ cảnh nói đến điều người nghe đã biết trên khắp Giu-đê và xác định điểm khởi đầu tại Ga-li-lê. Bản dịch chính ưu tiên nghĩa sự việc nhưng chú thích giữ lại nghĩa lời/sứ điệp vốn có của từ Hy Lạp.
- issue: Từ mà ἀρξάμενος bổ nghĩa
  choice: Dịch bằng cụm “bắt đầu từ Ga-li-lê,” nối lỏng với “điều đã xảy ra”
  alternative: Hiểu trạng ngữ với ý ngầm “việc ấy bắt đầu,” hoặc liên hệ phân từ với một chủ thể giống đực
  rationale: Phân từ giống đực không hòa hợp trực tiếp với ῥῆμα giống trung, khiến cú pháp khó xác định, nhưng điểm khởi đầu tại Ga-li-lê vẫn rõ. Bản dịch không thêm một chủ thể ngoài nguyên văn.
translation_notes:
  register: 'Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng các tên quen thuộc trong truyền thống Kinh Thánh tiếng Việt: Giu-đê, Ga-li-lê, Giăng; giữ “phép báp-têm” vì đây là thuật ngữ phổ biến và không diễn giải thêm phương thức. Dấu phẩy cuối câu được giữ vì câu 37 tiếp nối sang câu 38.'
