  text: καὶ φωνήσαντες ⸀ἐπυνθάνοντο εἰ Σίμων ὁ ἐπικαλούμενος Πέτρος ἐνθάδε ξενίζεται.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/018.yaml
  text: And they called out and asked whether Simon[a], who is called Peter, was staying here.
translation:
  language: vi
  text: Họ gọi lớn và hỏi xem Si-môn, người được gọi là Phi-e-rơ, có đang trọ ở đây không.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “đang lưu lại ở đây” hoặc “đang được tiếp đón ở đây.” Động từ Hy Lạp hàm ý ở tại nhà người khác với tư cách khách.
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνήσαντες
  choice: gọi lớn
  rationale: Diễn tả hành động cất tiếng gọi người ở trong nhà trước khi hỏi, tự nhiên hơn lối dịch sát hình thức “sau khi gọi”.
- source_word: ἐπυνθάνοντο
  choice: hỏi xem
  rationale: Động từ ở thì chưa hoàn thành chỉ việc dò hỏi; “hỏi xem” tự nhiên trong câu hỏi gián tiếp và không nhấn quá mức sắc thái kéo dài.
- source_word: εἰ
  choice: có… không
  rationale: Đây là từ dẫn vào câu hỏi gián tiếp; cấu trúc “xem… có… không” là cách diễn đạt chuẩn, tự nhiên trong tiếng Việt.
- source_word: Σίμων ὁ ἐπικαλούμενος Πέτρος
  choice: Si-môn, người được gọi là Phi-e-rơ
  rationale: Giữ cả hai tên và sắc thái bị động của phân từ ἐπικαλούμενος, đồng thời diễn đạt rõ ràng bằng mệnh đề quan hệ.
- source_word: ἐνθάδε
  choice: ở đây
  rationale: Chuyển tải trực tiếp và tự nhiên trạng từ chỉ nơi chốn.
- source_word: ξενίζεται
  choice: đang trọ
  rationale: “Trọ” diễn tả việc ở tại nhà người khác với tư cách khách; “đang” giúp phản ánh khía cạnh hiện tại của động từ trong nội dung câu hỏi.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Dùng các dạng tên quen thuộc “Si-môn” và “Phi-e-rơ”; giữ cấu trúc câu hỏi gián tiếp tự nhiên trong tiếng Việt. Dấu chú thích được đặt ngay sau mệnh đề có động từ cần giải thích.
