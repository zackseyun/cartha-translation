  terminology: “nhờ danh Người” bảo toàn thành ngữ διὰ τοῦ ὀνόματος αὐτοῦ mà không diễn giải thần học. “Người” phù hợp với lối tôn kính đã chọn. “Sự tha thứ tội lỗi” diễn đạt ἄφεσιν ἁμαρτιῶν rõ hơn “sự tha tội.”
  issues:
  - severity: medium
    issue: Chú thích a nêu phương án “làm chứng cho Người” và giải thích là “lời chứng dành cho, xác nhận Người.”
    rationale: 'Cách diễn đạt này trong tiếng Việt dễ được hiểu là lời chứng ủng hộ hay biện hộ cho Người, trong khi ở đây τούτῳ đi với μαρτυροῦσιν chủ yếu nêu đối tượng/nội dung lời chứng: các tiên tri làm chứng về hoặc liên quan đến Người. Chú thích nên tránh mở rộng sắc thái theo hướng biện hộ.'
  - severity: low
    issue: “sự tha tội”
    rationale: Không sai, nhưng “sự tha thứ tội lỗi” là lối nói hiện đại, minh bạch và thông dụng hơn cho ἄφεσιν ἁμαρτιῶν.
