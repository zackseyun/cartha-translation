id: ACT.10.43
reference: Acts 10:43
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τούτῳ πάντες οἱ προφῆται μαρτυροῦσιν, ἄφεσιν ἁμαρτιῶν λαβεῖν διὰ τοῦ ὀνόματος αὐτοῦ πάντα τὸν πιστεύοντα εἰς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/043.yaml
  text: All the prophets testify about him that everyone who believes in him receives forgiveness of sins through his name[a].
translation:
  language: vi
  text: Tất cả các nhà tiên tri đều làm chứng về Người[a] rằng bất cứ ai tin vào Người thì nhờ danh Người mà nhận được sự tha thứ tội lỗi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “làm chứng liên quan đến Người.”'
    reason: τούτῳ là dạng tặng cách đi với μαρτυροῦσιν; trong ngữ cảnh này, cụm từ chỉ Người là đối tượng/nội dung lời chứng.
lexical_decisions:
- source_word: τούτῳ
  choice: về Người
  rationale: Dạng tặng cách đi với μαρτυροῦσιν có thể chỉ đối tượng mà lời chứng nói đến. “Về Người” tự nhiên trong tiếng Việt và theo ngữ cảnh chỉ Đức Giê-su.
- source_word: πάντες οἱ προφῆται
  choice: Tất cả các nhà tiên tri
  rationale: Chuyển tải trực tiếp phạm vi phổ quát của cụm từ, đồng thời chỉ những người làm chứng trong truyền thống tiên tri.
- source_word: μαρτυροῦσιν
  choice: làm chứng
  rationale: Giữ được sắc thái chứng nhận, xác thực của động từ và là cách diễn đạt quen thuộc, trang trọng vừa phải trong tiếng Việt.
- source_word: ἄφεσιν ἁμαρτιῶν
  choice: sự tha tội
  rationale: Cách nói tự nhiên, rõ ràng, diễn đạt việc tội lỗi được tha mà không thêm một mô hình thần học ngoài nguyên văn.
- source_word: λαβεῖν
  choice: nhận được
  rationale: Động từ nguyên mẫu nêu nội dung lời chứng của các nhà tiên tri; chuyển thành vị ngữ hữu hạn giúp câu tiếng Việt tự nhiên mà vẫn giữ ý tiếp nhận sự tha tội.
- source_word: διὰ τοῦ ὀνόματος αὐτοῦ
  choice: nhờ danh Người
  rationale: “Nhờ” diễn đạt phương tiện hoặc sự trung gian của διά với sở hữu cách; “danh Người” giữ nguyên thành ngữ Kinh Thánh, không diễn giải thêm thành “thẩm quyền”.
- source_word: πάντα τὸν πιστεύοντα
  choice: bất cứ ai tin
  rationale: Cụm phân từ giống đực số ít mang nghĩa khái quát và phân phối; “bất cứ ai” vừa tự nhiên vừa không giới hạn theo giới tính.
- source_word: εἰς αὐτόν
  choice: tin vào Người
  rationale: Với πιστεύω, εἰς diễn tả lòng tin hướng đến một người. “Tin vào Người” rõ hơn “tin Người”, vốn có thể chỉ đơn thuần tin lời người ấy nói.
theological_decisions:
- issue: Phạm vi và điều kiện nhận sự tha tội
  choice: Bất cứ ai tin vào Đức Giê-su đều nhận được sự tha tội nhờ danh Người.
  alternative: Có thể diễn giải bằng những công thức giáo lý chi tiết hơn về cơ chế cứu rỗi.
  rationale: Bản dịch giữ đúng mối liên hệ mà câu văn nêu giữa Đức Giê-su, đức tin và sự tha tội, không thêm lập trường hệ phái.
- issue: Phân từ giống đực dùng theo nghĩa khái quát
  choice: bất cứ ai tin
  alternative: mọi người nam tin
  rationale: Giống đực số ít ở đây có chức năng đại diện và không giới hạn đối tượng ở nam giới.
- issue: Ý nghĩa của “danh”
  choice: Giữ thành ngữ “nhờ danh Người”.
  alternative: nhờ thẩm quyền của Người
  rationale: “Danh” bao hàm con người và thẩm quyền của Đức Giê-su, nhưng nguyên văn không tách riêng hoặc giải thích ý niệm ấy; giữ thành ngữ bảo toàn chiều sâu và độ mở của câu.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Người” làm đại từ tôn kính chỉ Đức Giê-su; tránh thuật ngữ cổ như “sự miễn xá” hoặc lối diễn giải giáo phái.
