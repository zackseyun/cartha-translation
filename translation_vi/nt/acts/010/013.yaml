  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἐγένετο φωνὴ πρὸς αὐτόν· Ἀναστάς, Πέτρε, θῦσον καὶ φάγε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/013.yaml
  text: 'And a voice came to him: “Get up[a], Peter; kill and eat.”'
translation:
  language: vi
  text: 'Rồi có tiếng phán với ông: “Phi-e-rơ, hãy đứng dậy, làm thịt[a] và ăn đi.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “dâng làm sinh tế.” Động từ Hy Lạp ở đây có thể chỉ việc hiến tế, nhưng trong ngữ cảnh khải tượng này, nhiều khả năng nó nói đến việc làm thịt một con vật để ăn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: có
  rationale: Khi đi với φωνή, động từ này giới thiệu sự xuất hiện của một tiếng nói. Cách diễn đạt “có tiếng” tự nhiên trong tiếng Việt và vẫn giữ tính sự kiện của câu.
- source_word: φωνὴ
  choice: tiếng phán
  rationale: Trong khải tượng này, φωνή là lời nói có nội dung chứ không chỉ là một âm thanh. “Tiếng phán” diễn đạt rõ một tiếng nói truyền lệnh mà không xác định thêm danh tính người nói.
- source_word: πρὸς αὐτόν
  choice: với ông
  rationale: Với ngữ cảnh phát ngôn, πρός cộng đối cách chỉ người được nói với. “Với ông” là cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: Ἀναστάς
  choice: hãy đứng dậy
  rationale: Phân từ bất định quá khứ ở đây có chức năng mệnh lệnh và mở đầu chuỗi hành động. “Hãy đứng dậy” rõ nghĩa, trang trọng vừa phải và tự nhiên.
- source_word: Πέτρε
  choice: Phi-e-rơ
  rationale: Đây là hô cách của tên riêng Πέτρος; dùng dạng phiên âm quen thuộc “Phi-e-rơ”.
- source_word: θῦσον
  choice: làm thịt
  rationale: Trong ngữ cảnh khải tượng về các loài vật và mệnh lệnh ăn, động từ chỉ việc giết con vật để làm thức ăn. “Làm thịt” tự nhiên hơn “giết” khi nói đến chuẩn bị con vật để ăn; nghĩa “dâng làm sinh tế” được giữ trong chú thích.
- source_word: φάγε
  choice: ăn đi
  rationale: Đây là mệnh lệnh trực tiếp. Tiểu từ “đi” giúp câu mệnh lệnh tự nhiên trong tiếng Việt mà không thay đổi nội dung.
- source_word: καὶ
  choice: Rồi; và
  rationale: Liên từ đầu câu tiếp nối diễn tiến nên dịch là “Rồi”; liên từ nối hai mệnh lệnh được giữ là “và”.
theological_decisions:
- issue: Có nên dịch θῦσον bằng từ ngữ mang nghĩa hiến tế hay không
  choice: Dùng “làm thịt” trong chính văn
  alternative: “dâng làm sinh tế” hoặc “hiến tế”
  rationale: Ngữ cảnh trực tiếp nói đến các loài vật và việc ăn, không mô tả một nghi thức thờ phượng. Tuy nhiên, θύω thực sự có thể mang nghĩa hiến tế, nên khả năng này được giữ trong chú thích thay vì bị loại bỏ.
translation_notes:
  register: Văn phong hiện đại, sáng rõ và trang nghiêm vừa phải. “Tiếng phán” phù hợp với bối cảnh mặc khải nhưng không tự ý nêu danh tính người phát ngôn; “làm thịt” là cách nói phổ thông về việc giết con vật để dùng làm thức ăn.
