- from: Việc ấy xảy ra ba lần, rồi ngay lập tức vật chứa ấy được đưa lên trời.[a]
  to: Việc ấy xảy ra ba lần, rồi ngay lập tức vật ấy được đưa lên trời.[a]
  rationale: Đổi “vật chứa ấy” thành “vật ấy” để không thu hẹp nghĩa của σκεῦος. Chú thích được điều chỉnh để phân biệt nghĩa rộng của từ Hy Lạp với hình ảnh “tấm vải” được cung cấp bởi ngữ cảnh gần, trong khi vẫn giữ nguyên ý nghĩa, thể bị động và nhịp kể của câu.
