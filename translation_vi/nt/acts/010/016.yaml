  text: τοῦτο δὲ ἐγένετο ἐπὶ τρίς, καὶ ⸀εὐθὺς ἀνελήμφθη τὸ σκεῦος εἰς τὸν οὐρανόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/016.yaml
  text: This happened three times[b][a], and immediately the vessel was taken up into heaven.
translation:
  language: vi
  text: Việc ấy xảy ra ba lần, rồi ngay lập tức vật ấy được đưa lên trời.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “tấm vải ấy được đưa lên trời”. Từ Hy Lạp có nghĩa rộng là “vật” hoặc “vật dụng”; ngữ cảnh trước đó mô tả vật này như một tấm vải lớn.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο δὲ ἐγένετο
  choice: Việc ấy xảy ra
  rationale: τοῦτο hồi chỉ toàn bộ diễn biến vừa kể; “việc ấy xảy ra” tự nhiên trong tiếng Việt và diễn đạt δέ như một liên từ chuyển nhẹ trong mạch câu.
- source_word: ἐπὶ τρίς
  choice: ba lần
  rationale: Cách nói tự nhiên, rõ ràng để chỉ sự việc được lặp lại ba lần.
- source_word: καὶ εὐθὺς
  choice: rồi ngay lập tức
  rationale: “Rồi” nối tiếp diễn biến, còn “ngay lập tức” giữ sắc thái khẩn cấp của εὐθύς.
- source_word: ἀνελήμφθη
  choice: được đưa lên
  rationale: Giữ thể bị động và hướng chuyển động đi lên của động từ ἀναλαμβάνω.
- source_word: τὸ σκεῦος
  choice: vật chứa ấy
  rationale: σκεῦος là từ rộng, có thể chỉ đồ vật hay vật chứa; lựa chọn này tránh đặc tả thành “tấm vải” dù ngữ cảnh trước mô tả nó giống một tấm vải lớn.
- source_word: εἰς τὸν οὐρανόν
  choice: lên trời
  rationale: Trong tiếng Việt, “được đưa lên trời” diễn đạt tự nhiên hướng đi của εἰς và vẫn cho phép οὐρανός được hiểu là trời hoặc thiên giới theo ngữ cảnh.
theological_decisions:
- issue: Nghĩa của οὐρανός trong khải tượng của Phi-e-rơ
  choice: trời
  alternative: bầu trời; thiên đàng
  rationale: “Trời” là cách dịch tự nhiên và có độ mở trong tiếng Việt, vừa có thể chỉ không gian phía trên vừa có thể chỉ cõi trời; nhờ đó không giải quyết quá mức sự đa nghĩa của từ Hy Lạp.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “vật chứa” để bám sát độ rộng của σκεῦος; đặt chú thích ngay sau câu vì chú thích giải thích cả danh từ “vật chứa” lẫn cách gọi theo ngữ cảnh.
