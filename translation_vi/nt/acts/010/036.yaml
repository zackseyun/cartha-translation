revisions:
- from: Đó là lời Ngài đã gửi đến con dân Israel[a], rao truyền tin mừng về sự bình an qua Chúa Giê-su, Đấng Mê-si—chính Ngài là Chúa của tất cả.[b]
  to: Lời mà Ngài đã gửi cho con cái Israel[a], rao truyền tin mừng về sự bình an qua Giê-su, Đấng Mê-si—Đấng ấy là Chúa của tất cả.[b]
  rationale: Bản sửa bỏ yếu tố chỉ định không có trong nguyên văn, không chuyển sớm danh hiệu «Chúa» vốn chỉ có ở mệnh đề cuối, và điều chỉnh chú thích về υἱοί cho chính xác. Câu vẫn giữ tính tiếp nối của nguyên văn, sắc thái công bố tin mừng, tước hiệu «Đấng Mê-si», và phạm vi không xác định cụ thể của πάντων.
  reviewer_model: gpt-5.6-terra
