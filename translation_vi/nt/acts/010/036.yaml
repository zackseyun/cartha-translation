id: ACT.10.36
reference: Acts 10:36
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τὸν λόγον ⸀ὃν ἀπέστειλεν τοῖς υἱοῖς Ἰσραὴλ εὐαγγελιζόμενος εἰρήνην διὰ Ἰησοῦ Χριστοῦ· οὗτός ἐστιν πάντων κύριος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/036.yaml
  text: the message that he sent to the sons of Israel[c][b][a], proclaiming peace through Jesus the Messiah—he is Lord of all.
translation:
  language: vi
  text: Lời mà Ngài đã gửi cho con cái Israel[a], rao truyền tin mừng về sự bình an qua Giê-su, Đấng Mê-si—Đấng ấy là Chúa của tất cả.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “dân Israel.” Cụm Hy Lạp theo nghĩa đen là “các con trai Israel,” một cách gọi quy ước chỉ dân Israel.
    reason: Làm rõ nghĩa đen của υἱοῖς và cách hiểu thành ngữ của cụm từ.
  - marker: b
    text: 'Cũng có thể dịch: “Chính Ngài là Chúa của tất cả.” Đại từ chỉ định trong tiếng Hy Lạp nhấn mạnh Giê-su, Đấng Mê-si.'
    reason: Ghi nhận lực nhấn mạnh của οὗτός và một cách dịch sát hơn.
lexical_decisions:
- source_word: τὸν λόγον
  choice: lời
  rationale: Trong ngữ cảnh này, λόγος chỉ sứ điệp được Đức Chúa Trời gửi đến Israel. “Lời” vừa trực tiếp, trang trọng, vừa tự nhiên trong văn phong Kinh Thánh tiếng Việt; chú thích nêu cách dịch diễn ý “sứ điệp”.
- source_word: ὃν ἀπέστειλεν
  choice: Ngài đã gửi
  rationale: Giữ mệnh đề quan hệ và hành động “gửi”; chủ thể được hiểu từ văn cảnh là Đức Chúa Trời. Viết hoa “Ngài” theo quy ước tôn kính thông dụng.
- source_word: τοῖς υἱοῖς Ἰσραήλ
  choice: đến con dân Israel
  rationale: Cụm Hy Lạp theo nghĩa đen là “các con trai/con cái Israel”, nhưng là cách gọi quy ước chỉ dân Israel. “Con dân Israel” tự nhiên, trang trọng và không khiến độc giả hiện đại hiểu lầm rằng chỉ nói đến nam giới.
- source_word: εὐαγγελιζόμενος
  choice: rao truyền tin mừng
  rationale: Động từ mang nghĩa công bố tin mừng, nên dịch rõ sắc thái “tin mừng” thay vì chỉ dùng “rao truyền”.
- source_word: εἰρήνην
  choice: về sự bình an
  rationale: Giữ tương đương trực tiếp của εἰρήνη, bao hàm hòa giải và an lành mà không diễn giải quá mức.
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: qua Chúa Giê-su, Đấng Mê-si
  rationale: διά với sở hữu cách chỉ phương tiện/trung gian. Χριστός tại đây mang chức năng tước hiệu nên dịch là “Đấng Mê-si”; thêm “Chúa” trước tên Giê-su là cách xưng hô tự nhiên trong tiếng Việt, đồng thời mệnh đề sau xác nhận Ngài là Chúa.
- source_word: οὗτός
  choice: chính Ngài
  rationale: Đại từ chỉ định có lực nhấn mạnh. “Chính Ngài” tự nhiên hơn “Đấng này” trong tiếng Việt mà vẫn giữ trọng âm hướng về Chúa Giê-su.
- source_word: πάντων κύριος
  choice: Chúa của tất cả
  rationale: Giữ sát sở hữu cách πάντων và tuyên bố về quyền tể trị phổ quát; “tất cả” bảo tồn phạm vi rộng vốn có, dù đối tượng có thể được hiểu là mọi người hoặc muôn vật.
theological_decisions:
- issue: Cách dịch Χριστοῦ trong Ἰησοῦ Χριστοῦ
  choice: Đấng Mê-si
  alternative: Đấng Christ
  rationale: Χριστός là tước hiệu tương ứng với Đấng được xức dầu, nên dịch nghĩa bằng “Đấng Mê-si” thay vì chỉ phiên âm, đồng thời không thêm nội dung giáo phái.
- issue: Cách dịch κύριος trong πάντων κύριος
  choice: Chúa
  alternative: Chủ
  rationale: “Chúa” giữ được cả ý quyền tể trị lẫn sức nặng thần học của lời tuyên xưng về Chúa Giê-su; “chủ” dễ bị hiểu theo quan hệ xã hội thông thường.
- issue: Lực nhấn mạnh của οὗτός ἐστιν πάντων κύριος
  choice: chính Ngài là Chúa của tất cả
  alternative: Ngài là Chúa của tất cả
  rationale: Thêm “chính” để bảo tồn sắc thái nhấn mạnh của đại từ chỉ định οὗτός mà vẫn tự nhiên trong tiếng Việt.
- issue: Phạm vi của πάντων
  choice: tất cả
  alternative: mọi người; muôn vật
  rationale: Giữ sự khái quát và phần nào mơ hồ của πάντων, không tự ý giới hạn vào con người hay mở rộng minh nhiên thành toàn thể tạo vật.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng “rao truyền tin mừng” để biểu đạt đầy đủ εὐαγγελιζόμενος; giữ “bình an,” “Đấng Mê-si” và “Chúa” là các thuật ngữ thần học quen thuộc. Dấu gạch ngang làm nổi bật lời tuyên xưng kết thúc câu.
