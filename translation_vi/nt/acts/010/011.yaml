  to: Ông thấy trời mở ra[a], và một vật gì đó[b], giống như một tấm vải lớn, đang hạ xuống, được thả xuống mặt đất bằng bốn góc của nó[c].
  rationale: 'Chỉ điều chỉnh cách diễn đạt để tiếng Việt tự nhiên hơn: thay “buông” bằng “thả,” và “đất” bằng “mặt đất.” Dấu phẩy đặt quanh cụm “giống như một tấm vải lớn” làm rõ đây là phép so sánh về vật đang đi xuống, đồng thời không thay đổi tính bất định của σκεῦός τι hay cấu trúc hình ảnh của nguyên văn.'
