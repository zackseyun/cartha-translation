source:
  edition: SBLGNT
  text: καὶ θεωρεῖ τὸν οὐρανὸν ἀνεῳγμένον καὶ ⸀καταβαῖνον σκεῦός τι ὡς ὀθόνην μεγάλην τέσσαρσιν ⸀ἀρχαῖς καθιέμενον ἐπὶ τῆς γῆς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/011.yaml
  text: and he sees heaven opened[a], and something like a large sheet descending, being lowered by its four corners to the earth[c][b],
translation:
  language: vi
  text: Ông thấy trời mở ra[a], và một vật gì đó[b], giống như một tấm vải lớn, đang hạ xuống, được thả xuống mặt đất bằng bốn góc của nó[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “bầu trời mở ra.” Từ Hy Lạp οὐρανός có thể chỉ bầu trời hoặc cõi trời.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “một vật nào đó” hoặc “một vật chứa nào đó.” Cụm từ Hy Lạp σκεῦός τι cố ý không xác định rõ vật ấy là gì.'
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “bằng bốn đầu mút của nó.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: θεωρεῖ
  choice: ông thấy
  rationale: Thì hiện tại lịch sử tạo nét sống động cho lời kể. “Thấy” là cách diễn đạt tự nhiên, trực tiếp trong tiếng Việt hiện đại.
- source_word: οὐρανὸν ἀνεῳγμένον
  choice: trời mở ra
  rationale: “Trời” vừa tự nhiên vừa có thể chỉ bầu trời hoặc cõi trời; trong khải tượng này, cách dịch ấy giữ được chiều kích mặc khải mà không giải nghĩa quá mức.
- source_word: καταβαῖνον
  choice: đang hạ xuống
  rationale: Diễn đạt phân từ hiện tại chỉ chuyển động đi xuống và giữ tính đang diễn ra của khải tượng.
- source_word: σκεῦός τι
  choice: một vật gì đó
  rationale: σκεῦος có nghĩa rộng, còn τι làm cho đối tượng không xác định. Cách dịch này tránh xác định quá sớm đó là vật chứa hay dụng cụ.
- source_word: ὡς ὀθόνην μεγάλην
  choice: giống như một tấm vải lớn
  rationale: Giữ phép so sánh ὡς và diễn đạt hình dáng một cách rõ ràng, không xác định thêm chất liệu của tấm vải.
- source_word: τέσσαρσιν ἀρχαῖς
  choice: bằng bốn góc của nó
  rationale: ἀρχή ở đây chỉ các đầu mút; với vật giống tấm vải, “bốn góc” là cách nói tự nhiên nhất. “Của nó” được thêm để làm rõ quan hệ sở hữu.
- source_word: καθιέμενον
  choice: được buông xuống
  rationale: Giữ sắc thái bị động của phân từ và phân biệt nhẹ với chuyển động “đang hạ xuống” ở mệnh đề trước.
- source_word: ἐπὶ τῆς γῆς
  choice: xuống đất
  rationale: Trong ngữ cảnh chuyển động từ trên xuống, ἐπί diễn tả hướng đến mặt đất. “Xuống đất” tự nhiên trong tiếng Việt và không làm thay đổi phạm vi của hình ảnh.
theological_decisions:
- issue: Cách dịch οὐρανός trong bối cảnh khải tượng
  choice: trời
  alternative: bầu trời
  rationale: “Trời” phù hợp với bối cảnh mặc khải và vẫn giữ được độ rộng nghĩa của οὐρανός, thay vì buộc người đọc chỉ hiểu theo nghĩa khí quyển hoặc dùng “thiên đàng,” một từ có thể cụ thể hóa thần học quá mức.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Câu giữ hai nét chuyển động của hai phân từ Hy Lạp bằng “đang hạ xuống” và “được buông xuống,” đồng thời dùng “trời” để bảo toàn phần nào sự nhập nhằng giữa bầu trời và cõi trời.
