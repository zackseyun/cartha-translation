- from: “Chẳng lẽ có ai có thể ngăn nước, không cho những người này chịu phép báp-têm[a] sao? Họ đã nhận Đức Thánh Linh cũng như chúng ta.”
  to: “Chẳng lẽ có ai có thể giữ lại nước để không cho những người này được báp-têm[a] sao? Vì họ đã nhận Đức Thánh Linh cũng như chúng ta.”
  rationale: Bản sửa giữ hình ảnh “nước” và ý ngăn cản của nguyên văn, nhưng dùng “giữ lại nước” để diễn đạt rõ và tự nhiên hơn ý không được từ chối nước báp-têm. “Vì” làm rõ quan hệ lập luận vốn được ngữ cảnh và mệnh đề quan hệ Hy Lạp cho thấy, không thêm một kết luận thần học ngoài câu văn.
