id: ACT.10.47
reference: Acts 10:47
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Μήτι τὸ ὕδωρ ⸂δύναται κωλῦσαί⸃ τις τοῦ μὴ βαπτισθῆναι τούτους οἵτινες τὸ πνεῦμα τὸ ἅγιον ἔλαβον ⸀ὡς καὶ ἡμεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/047.yaml
  text: Surely no one can withhold the water so that these people should not be baptized[b][a], can they? For they have received the Holy Spirit just as we have.
translation:
  language: vi
  text: “Chẳng lẽ có ai có thể giữ lại nước để không cho những người này được báp-têm[a] sao? Vì họ đã nhận Đức Thánh Linh cũng như chúng ta.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “ngăn không cho những người này được báp-têm.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μήτι
  choice: Chẳng lẽ ... sao?
  rationale: Cấu trúc nghi vấn tu từ tự nhiên trong tiếng Việt, cho thấy câu hỏi dự kiến câu trả lời phủ định.
- source_word: τὸ ὕδωρ
  choice: nước
  rationale: Trong ngữ cảnh, nước được xác định là nước dùng để làm phép báp-têm; tiếng Việt không có mạo từ nên không cần thêm từ tương đương với mạo từ Hy Lạp.
- source_word: δύναται κωλῦσαί τις
  choice: có ai có thể ngăn
  rationale: Giữ cả ý khả năng và hành động cản trở/ngăn cấm, đồng thời phù hợp với câu hỏi tu từ.
- source_word: τοῦ μὴ βαπτισθῆναι τούτους
  choice: không cho những người này chịu phép báp-têm
  rationale: 'Diễn đạt rõ cấu trúc ngăn cản một hành động ở thể bị động: không cho họ được làm phép báp-têm.'
- source_word: τούτους
  choice: những người này
  rationale: Cách gọi tự nhiên, không giới hạn nhóm người vào nam giới nếu ngữ cảnh không đòi hỏi.
- source_word: οἵτινες
  choice: Họ
  rationale: Tách thành câu giải thích để tiếng Việt sáng rõ; quan hệ từ mang sắc thái nêu căn cứ được thể hiện qua sự nối tiếp lập luận.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: Đức Thánh Linh
  rationale: Thuật ngữ Cơ Đốc quen thuộc, trang trọng và tự nhiên trong tiếng Việt hiện đại.
- source_word: ἔλαβον
  choice: đã nhận
  rationale: Thể hiện một biến cố đã hoàn tất trước lời đề nghị làm phép báp-têm, phù hợp với thì aorist trong mạch kể.
- source_word: ὡς καὶ ἡμεῖς
  choice: cũng như chúng ta
  rationale: Giữ nguyên phép so sánh giữa kinh nghiệm của nhóm người này và của người nói cùng các tín hữu Do Thái.
theological_decisions:
- issue: Quan hệ giữa việc nhận Đức Thánh Linh và phép báp-têm bằng nước
  choice: Nêu rõ những người này đã nhận Đức Thánh Linh, và sự kiện ấy là căn cứ để không ngăn họ chịu phép báp-têm bằng nước.
  alternative: Diễn đạt mơ hồ về thứ tự giữa việc nhận Đức Thánh Linh và chịu phép báp-têm.
  rationale: Lập luận và trình tự trong câu Hy Lạp cho thấy việc nhận Đức Thánh Linh đã xảy ra trước phép báp-têm trong trường hợp này; bản dịch giữ nguyên dữ kiện tự sự mà không suy diễn thành một hệ thống giáo phái.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “phép báp-têm” để chỉ βαπτισθῆναι và giữ hình ảnh “ngăn nước” của nguyên văn, dù đây là cách nói hơi khác thường trong tiếng Việt.
