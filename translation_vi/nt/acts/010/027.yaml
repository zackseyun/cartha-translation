  rationale: Sửa cấu trúc mở đầu để diễn tả rõ hành động trò chuyện đang diễn ra khi Phi-e-rơ đi vào; thay “đang tụ họp tại đó” bằng “đã tụ họp” để phản ánh phân từ hoàn thành và tránh thêm chi tiết không có trong nguyên ngữ. Chú thích được đặt ngay sau “thấy”, là từ mà chú thích giải thích.
