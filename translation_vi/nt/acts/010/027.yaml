  text: καὶ συνομιλῶν αὐτῷ εἰσῆλθεν, καὶ εὑρίσκει συνεληλυθότας πολλούς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/027.yaml
  text: And talking with him[a], he entered and found many gathered together.
translation:
  language: vi
  text: Trong khi trò chuyện với ông ấy, Phi-e-rơ bước vào và thấy[a] nhiều người đã tụ họp.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Trong tiếng Hy Lạp, động từ “thấy” dùng thì hiện tại lịch sử, làm lời kể thêm sống động.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνομιλῶν
  choice: Vừa trò chuyện
  rationale: Phân từ hiện tại diễn tả hành động đang diễn ra đồng thời với việc Phi-e-rơ bước vào; cách nói này tự nhiên trong tiếng Việt và giữ được sắc thái trò chuyện qua lại.
- source_word: αὐτῷ
  choice: với ông ấy
  rationale: Tặng cách đi với συνομιλέω chỉ người cùng trò chuyện; “với ông ấy” giữ đúng tính tương hỗ của cuộc trò chuyện.
- source_word: εἰσῆλθεν
  choice: Phi-e-rơ bước vào
  rationale: Động từ aorist đánh dấu diễn tiến tiếp theo. Bổ sung chủ thể Phi-e-rơ từ ngữ cảnh để câu tiếng Việt rõ và tự nhiên; “bước vào” phù hợp với việc đi vào nhà.
- source_word: εὑρίσκει
  choice: thấy
  rationale: Động từ ở hiện tại lịch sử tạo sắc thái kể chuyện sống động; trong tiếng Việt, “thấy” nối sau “bước vào” tự nhiên mà không cần đánh dấu thì quá khứ.
- source_word: συνεληλυθότας
  choice: đang tụ họp tại đó
  rationale: Phân từ hoàn thành diễn tả nhiều người đã đến với nhau và hiện ở trong trạng thái tụ họp. “Đang tụ họp tại đó” diễn đạt tự nhiên trạng thái mà Phi-e-rơ bắt gặp, dù sắc thái hoàn tất được giải thích thêm trong chú thích.
- source_word: πολλούς
  choice: nhiều người
  rationale: Tính từ được dùng như danh từ, chỉ nhiều người; tiếng Việt cần nêu rõ danh từ “người”.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Phi-e-rơ” để làm rõ chủ thể vốn được hàm ý trong động từ Hy Lạp. Giữ chú thích nhằm nêu sắc thái của phân từ hoàn thành và hiện tại lịch sử.
