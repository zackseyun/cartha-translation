    rationale: Phân từ hiện tại συνομιλῶν bổ nghĩa cho hành động chính εἰσῆλθεν, nên “Trong khi trò chuyện” biểu đạt quan hệ thời gian chính xác và ít mơ hồ hơn.
  - severity: medium
    issue: “đang tụ họp tại đó” chưa phản ánh đầy đủ sắc thái hoàn thành của συνεληλυθότας và thêm “tại đó” ngoài nguyên ngữ.
    rationale: συνεληλυθότας chỉ những người đã quy tụ/đã tụ họp khi Phi-e-rơ gặp họ. “Đã tụ họp” giữ được trạng thái kết quả; không cần bổ sung địa điểm.
