id: ACT.10.22
reference: Acts 10:22
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οἱ δὲ εἶπαν· Κορνήλιος ἑκατοντάρχης, ἀνὴρ δίκαιος καὶ φοβούμενος τὸν θεὸν μαρτυρούμενός τε ὑπὸ ὅλου τοῦ ἔθνους τῶν Ἰουδαίων, ἐχρηματίσθη ὑπὸ ἀγγέλου ἁγίου μεταπέμψασθαί σε εἰς τὸν οἶκον αὐτοῦ καὶ ἀκοῦσαι ῥήματα παρὰ σοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/022.yaml
  text: They said[a], “Cornelius, a centurion, a righteous man and one who fears God, and who is well spoken of by the whole nation of the Jews[e][d][c][b], was divinely instructed by a holy angel to summon you to his house and to hear words from you.”
translation:
  language: vi
  text: 'Họ đáp: “Cọt-nây, một viên đại đội trưởng, là người công chính, kính sợ Đức Chúa Trời và được toàn thể dân Do Thái kính trọng, đã được một thiên sứ thánh chỉ bảo mời ông về nhà mình, để Cọt-nây nghe những lời từ ông.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἑκατοντάρχης
  choice: viên đại đội trưởng
  rationale: Chỉ sĩ quan La Mã thường chỉ huy khoảng một trăm quân; cách gọi này rõ nghĩa với độc giả Việt hiện đại hơn là phiên âm chức danh.
- source_word: ἀνὴρ δίκαιος
  choice: là người công chính
  rationale: Giữ sắc thái đạo đức–tôn giáo của δίκαιος mà không suy diễn địa vị cứu rỗi của Cọt-nây.
- source_word: φοβούμενος τὸν θεόν
  choice: kính sợ Đức Chúa Trời
  rationale: Giữ thành ngữ Kinh Thánh và lực của phân từ, mô tả lòng tôn kính đối với Đức Chúa Trời.
- source_word: μαρτυρούμενος
  choice: được ... kính trọng
  rationale: Diễn đạt tự nhiên việc người ấy nhận được lời chứng tốt và có danh tiếng tốt trong cộng đồng.
- source_word: ὑπὸ ὅλου τοῦ ἔθνους τῶν Ἰουδαίων
  choice: được toàn thể dân Do Thái
  rationale: ἔθνος ở đây chỉ cộng đồng dân tộc, không nhất thiết là một quốc gia chính trị hiện đại.
- source_word: ἐχρηματίσθη
  choice: đã được ... truyền bảo
  rationale: Trong ngữ cảnh, động từ chỉ sự chỉ dẫn hay truyền đạt có nguồn gốc thần linh; tác nhân là thiên sứ thánh được nêu rõ.
- source_word: ἀγγέλου ἁγίου
  choice: một thiên sứ thánh
  rationale: Thể hiện cả danh từ ἄγγελος lẫn tính từ ἅγιος, không lược bỏ đặc tính 'thánh'.
- source_word: μεταπέμψασθαί σε εἰς τὸν οἶκον αὐτοῦ
  choice: phải mời ông đến nhà
  rationale: μεταπέμπομαι có nghĩa sai người đi mời hoặc triệu đến; 'mời ông đến nhà' tự nhiên trong lời thuật và bảo toàn đích đến.
- source_word: ἀκοῦσαι ῥήματα παρὰ σοῦ
  choice: để nghe những lời ông nói
  rationale: Giữ khá sát nghĩa 'nghe những lời từ ông' nhưng diễn đạt tự nhiên bằng tiếng Việt, không xác định quá mức đó là bài giảng hay một thông điệp chính thức.
theological_decisions:
- issue: Mô tả lòng đạo của Cọt-nây mà không nhập thêm phạm trù giáo lý về địa vị cứu rỗi
  choice: người công chính và kính sợ Đức Chúa Trời
  alternative: người đạo đức; người công chính và mộ đạo
  rationale: Cách dịch giữ nguyên lời đánh giá đạo đức–tôn giáo trong câu, nhưng không kết luận thêm về địa vị giao ước hay sự cứu rỗi của ông.
- issue: Nguồn của sự truyền bảo
  choice: đã được một thiên sứ thánh truyền bảo
  alternative: đã nhận được sứ điệp thần linh qua một thiên sứ thánh
  rationale: Bảo toàn ý về sự truyền đạt từ cõi thần linh trong ἐχρηματίσθη, đồng thời không làm mờ tác nhân được câu văn xác định là thiên sứ thánh.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng đại từ 'ông' phù hợp với lời những sứ giả nói trực tiếp với Phi-e-rơ. Tên riêng 'Cọt-nây' theo lối phiên âm Việt; câu tránh thuật ngữ giáo phái và không giải quyết quá mức các hàm ý thần học.
