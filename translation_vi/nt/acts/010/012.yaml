  source_fidelity: Bản nháp giữ đúng cấu trúc ba nhóm sinh vật và ý vị trí của ἐν ᾧ. Tuy nhiên, “đủ mọi loài” có thể gợi ý rằng vật ấy có một tập hợp ‘đầy đủ các loài’, thay vì diễn tả trực tiếp phạm vi bao quát của πάντα; cách đặt “mọi loài” trước từng nhóm làm phạm vi rõ hơn. “Bò sát” là một cách dịch khả dĩ cho ἑρπετά, nhưng “các loài vật bò sát” ít mang sắc thái phân loại động vật học hẹp hơn và vẫn tự nhiên.
