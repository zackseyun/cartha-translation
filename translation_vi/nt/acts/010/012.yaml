lexical_decisions:
- source_word: ἐν ᾧ
  choice: Trong đó
  rationale: Đại từ quan hệ chỉ về vật giống tấm vải trong khải tượng; “trong đó” tự nhiên và giữ nguyên ý chỉ vị trí.
- source_word: ὑπῆρχεν
  choice: có
  rationale: Dạng chưa hoàn thành diễn tả sự hiện diện bên trong vật ấy; “có” là cách diễn đạt tự nhiên trong tiếng Việt và không thêm ý mạnh hơn như “chứa đựng”.
- source_word: πάντα
  choice: đủ mọi loài
  rationale: Trong ngữ cảnh liệt kê các nhóm động vật, cách này truyền đạt phạm vi bao quát bằng tiếng Việt tự nhiên mà không hàm ý từng cá thể đều hiện diện.
- source_word: τὰ τετράποδα
  choice: loài thú bốn chân
  rationale: Diễn đạt rõ các động vật có bốn chân bằng ngôn ngữ phổ thông; “thú” ở đây được hiểu rộng theo cách phân loại động vật trong văn cảnh.
- source_word: ἑρπετὰ τῆς γῆς
  choice: loài bò sát trên đất
  rationale: “Bò sát” là cách gọi hiện đại, dễ hiểu cho ἑρπετά; “trên đất” giữ quan hệ với τῆς γῆς mà tự nhiên hơn “của đất” trong tiếng Việt.
- source_word: πετεινὰ τοῦ οὐρανοῦ
  choice: chim trời
  rationale: Thành ngữ tiếng Việt tự nhiên, trang trọng vừa phải, chỉ các loài chim bay trên bầu trời.
- source_word: καὶ ... καὶ
  choice: dấu phẩy ... và
  rationale: Tiếng Việt tự nhiên thường nối ba thành phần bằng dấu phẩy rồi dùng “và” trước thành phần cuối; vẫn bảo toàn quan hệ phối hợp của câu Hy Lạp.
