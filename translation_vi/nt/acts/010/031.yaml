id: ACT.10.31
reference: Acts 10:31
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ φησί· Κορνήλιε, εἰσηκούσθη σου ἡ προσευχὴ καὶ αἱ ἐλεημοσύναι σου ἐμνήσθησαν ἐνώπιον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/031.yaml
  text: And he said[a], ‘Cornelius, your prayer has been heard, and your alms have been remembered before God.’
translation:
  language: vi
  text: 'Người ấy nói: “Cọt-nây, lời cầu nguyện của ông đã được nghe, và các việc bố thí[a] của ông đã được nhớ đến trước mặt Đức Chúa Trời.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “những việc từ thiện” hoặc “những món quà giúp người nghèo.” Từ Hy Lạp chỉ những việc làm hoặc sự ban cho xuất phát từ lòng thương xót dành cho người thiếu thốn.
    reason: lexical_alternative
lexical_decisions:
- source_word: φησί
  choice: Người ấy nói
  rationale: Dịch thì hiện tại lịch sử của tiếng Hy Lạp bằng thì quá khứ theo lối kể chuyện tự nhiên trong tiếng Việt; đại từ được diễn đạt rõ là “người ấy” theo ngữ cảnh.
- source_word: Κορνήλιε
  choice: Cọt-nây
  rationale: Dùng dạng phiên âm tên riêng quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
- source_word: εἰσηκούσθη
  choice: đã được nhậm
  rationale: Diễn đạt tự nhiên việc lời cầu nguyện được Đức Chúa Trời nghe và tiếp nhận, đồng thời giữ thể bị động của nguyên văn.
- source_word: ἡ προσευχὴ
  choice: lời cầu nguyện
  rationale: Giữ số ít và dùng cách nói thông dụng, trang trọng trong tiếng Việt.
- source_word: αἱ ἐλεημοσύναι
  choice: những việc bố thí
  rationale: Chỉ những việc hoặc sự ban cho vì lòng thương xót dành cho người thiếu thốn; “việc bố thí” cụ thể và sát nghĩa hơn một khái niệm từ thiện chung chung.
- source_word: ἐμνήσθησαν
  choice: đã được nhớ đến
  rationale: Giữ hình ảnh thần học về sự ghi nhớ và thể bị động, không diễn giải thành một học thuyết về công trạng.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: trước mặt Đức Chúa Trời
  rationale: Cách diễn đạt tự nhiên và trang trọng, bảo tồn ý nghĩa ở trong sự hiện diện và sự đoái xem của Đức Chúa Trời.
theological_decisions:
- issue: Ý nghĩa của những việc ἐλεημοσύναι do Cọt-nây làm
  choice: những việc bố thí
  alternative: những việc từ thiện; những món quà từ thiện; những việc thương xót
  rationale: Bản dịch nêu rõ hành động giúp đỡ người thiếu thốn nhưng không suy diễn rằng những hành động ấy tạo nên công trạng cứu rỗi.
- issue: Ngôn ngữ về sự ghi nhớ của Đức Chúa Trời
  choice: đã được nhớ đến trước mặt Đức Chúa Trời
  alternative: Đức Chúa Trời đã để ý; Đức Chúa Trời đã ghi nhận
  rationale: Giữ nguyên hình ảnh “được nhớ đến” có chiều sâu Kinh Thánh và tránh làm phẳng ý nghĩa thành việc đơn thuần chú ý hay ghi nhận.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ cấu trúc lời thiên sứ được thuật lại, ngôn ngữ bị động và hình ảnh “được nhớ đến trước mặt Đức Chúa Trời”; chú thích giải thích sắc thái cụ thể của “bố thí” mà không áp đặt kết luận giáo lý.
