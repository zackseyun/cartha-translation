    issue: Trật tự cú pháp của mệnh đề đầu hơi nặng và có thể mơ hồ về phạm vi của “một người Do Thái.”
    rationale: Nguyên ngữ nói rằng điều ấy là không được phép “đối với một người Do Thái” (ἀνδρὶ Ἰουδαίῳ). Đưa cụm này lên đầu câu làm quan hệ cú pháp rõ ràng và tự nhiên hơn trong tiếng Việt.
