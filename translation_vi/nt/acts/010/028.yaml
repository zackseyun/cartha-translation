language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἔφη τε πρὸς αὐτούς· Ὑμεῖς ἐπίστασθε ὡς ἀθέμιτόν ἐστιν ἀνδρὶ Ἰουδαίῳ κολλᾶσθαι ἢ προσέρχεσθαι ἀλλοφύλῳ· κἀμοὶ ὁ θεὸς ἔδειξεν μηδένα κοινὸν ἢ ἀκάθαρτον λέγειν ἄνθρωπον·
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/028.yaml
  text: And he said to them[a], “You yourselves know how unlawful it is for a Jewish man to associate with or visit a foreigner[b]; but God has shown me to call no person common or unclean.”
translation:
  language: vi
  text: 'Ông nói với họ: “Chính anh em biết rằng đối với một người Do Thái, giao thiệp hay đến thăm một người thuộc dân khác[a] là điều không được phép. Nhưng Đức Chúa Trời đã chỉ cho tôi rằng không được gọi bất cứ người nào là phàm tục[b] hay ô uế.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “một người dân ngoại”; ἀλλόφυλος theo nghĩa đen là người thuộc một dân khác.
    reason: lexical_alternative
  - marker: b
    text: “Phàm tục” dịch từ κοινός, một thuật ngữ khác với “ô uế” (ἀκάθαρτος); cặp từ này thuộc ngôn ngữ về thanh sạch nghi lễ của người Do Thái.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφη τε πρὸς αὐτούς
  choice: Ông nói với họ
  rationale: Dùng lời dẫn truyện tự nhiên; τέ chỉ liên kết nhẹ với mạch văn nên không cần nhấn mạnh trình tự.
- source_word: Ὑμεῖς ἐπίστασθε
  choice: Chính anh em biết
  rationale: “Chính” thể hiện sự nhấn mạnh của đại từ ὑμεῖς mà vẫn tự nhiên trong tiếng Việt.
- source_word: ὡς ἀθέμιτόν ἐστιν
  choice: là điều không được phép
  rationale: Diễn đạt điều bị cấm hoặc không được chấp nhận theo quy định và tập tục, nhưng không khẳng định quá mức rằng đây nhất thiết là một điều khoản rõ ràng trong Luật Môi-se.
- source_word: ἀνδρὶ Ἰουδαίῳ
  choice: một người Do Thái
  rationale: Giữ hình thức số ít đại diện; trong tiếng Việt, “người Do Thái” tự nhiên và phù hợp với ngữ cảnh.
- source_word: κολλᾶσθαι
  choice: giao thiệp
  rationale: Chuyển tải ý gắn bó hoặc qua lại về mặt xã hội, phù hợp với ngữ cảnh ranh giới cộng đồng.
- source_word: ἢ προσέρχεσθαι
  choice: hay đến thăm
  rationale: Trong ngữ cảnh Phi-e-rơ đến nhà Cọt-nây, cụm này nói đến việc đi đến hoặc vào thăm một người ngoài dân Do Thái.
- source_word: ἀλλοφύλῳ
  choice: một người thuộc dân khác
  rationale: Bám sát nghĩa ‘người thuộc một dân khác’ mà không mặc nhiên thay bằng thuật ngữ diễn giải “dân ngoại”.
- source_word: κἀμοὶ ὁ θεὸς ἔδειξεν
  choice: Nhưng Đức Chúa Trời đã chỉ cho tôi
  rationale: “Nhưng” làm rõ sự tương phản giữa quan niệm vừa nêu và điều Đức Chúa Trời mặc khải cho Phi-e-rơ; thì quá khứ phù hợp với động từ aorist.
- source_word: μηδένα ... ἄνθρωπον
  choice: bất cứ người nào
  rationale: Thể hiện phạm vi phủ định bao quát mọi con người, không giới hạn theo giới tính.
- source_word: κοινὸν
  choice: phàm tục
  rationale: Giữ sắc thái thuộc phạm trù thanh sạch nghi lễ và phân biệt từ này với ἀκάθαρτον; chú thích làm rõ nghĩa chuyên biệt.
- source_word: ἢ ἀκάθαρτον
  choice: hay ô uế
  rationale: “Ô uế” là cách diễn đạt quen thuộc cho tình trạng không thanh sạch, đồng thời giữ nguyên cặp thuật ngữ riêng biệt trong tiếng Hy Lạp.
theological_decisions:
- issue: Mối quan hệ giữa ranh giới giao tiếp của người Do Thái và sự mặc khải của Đức Chúa Trời
  choice: 'Trình bày việc giao thiệp hoặc thăm người thuộc dân khác là điều ‘không được phép’, rồi giữ nguyên sự sửa đổi do Đức Chúa Trời bày tỏ: không được gọi bất cứ người nào là phàm tục hay ô uế.'
  alternative: Làm nhẹ ἀθέμιτον thành điều chỉ ‘không thích hợp’, hoặc diễn giải kết luận theo cách xóa bỏ hai phạm trù thanh sạch riêng biệt.
  rationale: Bản dịch không hạ câu đầu xuống thành phép lịch sự xã hội, cũng không quy nó rõ ràng cho một điều luật cụ thể khi nguyên văn không nói như vậy. Câu sau phải giữ trọng tâm của Phi-e-rơ trên con người và bảo toàn sự căng thẳng trong ngôn ngữ thanh sạch.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “giao thiệp” và “đến thăm” để diễn đạt tự nhiên hành vi xã hội; giữ “phàm tục” và “ô uế” như hai phạm trù riêng, có chú thích hỗ trợ người đọc.
