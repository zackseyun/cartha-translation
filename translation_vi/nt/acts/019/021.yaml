id: ACT.19.21
reference: Acts 19:21
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ὡς δὲ ἐπληρώθη ταῦτα, ἔθετο ὁ Παῦλος ἐν τῷ πνεύματι διελθὼν τὴν Μακεδονίαν καὶ Ἀχαΐαν πορεύεσθαι εἰς ⸀Ἱεροσόλυμα, εἰπὼν ὅτι Μετὰ τὸ γενέσθαι με ἐκεῖ δεῖ με καὶ Ῥώμην ἰδεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/021.yaml
  text: After these things were completed[a], Paul resolved in the Spirit to go to Jerusalem after passing through Macedonia and Achaia, saying, “After I have been there[b], I must also see Rome.”
translation:
  language: vi
  text: 'Sau khi những việc ấy hoàn tất, Phao-lô quyết định trong Thánh Linh[a] sẽ đi qua Ma-xê-đô-ni-a và A-chai rồi đến Giê-ru-sa-lem. Ông nói: “Sau khi tôi đến Giê-ru-sa-lem, tôi cũng phải thấy Rô-ma.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hoặc “trong tâm trí mình.” Cụm từ Hy Lạp có thể chỉ quyết tâm nội tâm của Phao-lô hoặc sự hướng dẫn của Thánh Linh.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπληρώθη
  choice: hoàn tất
  rationale: Động từ bị động ở đây diễn tả các sự việc trước đó đã đi đến chỗ hoàn thành, không nhất thiết mang nghĩa ứng nghiệm lời tiên tri.
- source_word: ἔθετο
  choice: quyết định
  rationale: Dạng trung của τίθημι trong thành ngữ này chỉ việc tự mình xác lập một ý định; “quyết định” tự nhiên và rõ nghĩa trong tiếng Việt hiện đại.
- source_word: ἐν τῷ πνεύματι
  choice: trong Thánh Linh
  rationale: Cụm Hy Lạp không có từ sở hữu nên có thể chỉ sự hướng dẫn của Thánh Linh hoặc quyết tâm trong tâm linh của chính Phao-lô. Bản chính chọn cách hiểu thứ nhất theo nét thường gặp trong Lu-ca–Công Vụ, đồng thời giữ cách hiểu kia ở chú thích.
- source_word: διελθὼν
  choice: đi qua
  rationale: Phân từ bất định quá khứ diễn tả hành trình qua Ma-xê-đô-ni-a và A-chai trước khi đến Giê-ru-sa-lem; cấu trúc “đi qua… rồi đến…” truyền đạt trình tự tự nhiên trong tiếng Việt.
- source_word: πορεύεσθαι
  choice: đi… đến
  rationale: Đây là động từ di chuyển có nghĩa rộng; cách diễn đạt này tự nhiên và đủ chính xác.
- source_word: Ἱεροσόλυμα
  choice: Giê-ru-sa-lem
  rationale: Tên địa danh theo dạng phiên âm quen dùng trong Kinh Thánh tiếng Việt.
- source_word: Μετὰ τὸ γενέσθαι με ἐκεῖ
  choice: Sau khi đến đó
  rationale: Cấu trúc động từ nguyên mẫu có mạo từ diễn tả việc Phao-lô hiện diện tại đó trước bước kế tiếp; “đến đó” tự nhiên hơn cách dịch sát “ở đó” trong ngữ cảnh hành trình.
- source_word: δεῖ
  choice: tôi cũng phải
  rationale: δεῖ diễn tả sự cần thiết mạnh, và trong Lu-ca–Công Vụ thường có thể hàm ý mục đích do Đức Chúa Trời định; “phải” giữ được sức nặng mà không giải thích quá mức.
- source_word: ἰδεῖν
  choice: thấy
  rationale: Giữ nghĩa trực tiếp của động từ Hy Lạp; trong ngữ cảnh hành trình, từ này tự nhiên hàm ý đến thăm Rô-ma.
theological_decisions:
- issue: Đối tượng quy chiếu của ἐν τῷ πνεύματι
  choice: trong Thánh Linh
  alternative: trong tâm linh mình
  rationale: 'Nguyên văn không có từ sở hữu và cho phép cả hai cách hiểu: Phao-lô được Thánh Linh hướng dẫn, hoặc ông quyết chí trong nội tâm. Bản chính chọn “Thánh Linh” vì cách Lu-ca thường liên hệ các quyết định truyền giáo với Thánh Linh, nhưng chú thích bảo tồn sự mơ hồ thực sự.'
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng cấu trúc “đi qua… rồi đến…” để thể hiện rõ thứ tự dự định trong nguyên văn và tránh tách động từ quyết định khỏi nội dung của quyết định. Không giữ chú thích [b] của lớp tiếng Anh vì nội dung chú thích ấy là một trật tự diễn đạt trước đây, không phải dị bản hay nét mơ hồ cần thiết của nguyên văn.
