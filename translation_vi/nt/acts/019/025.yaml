  - severity: low
    issue: “chúng ta có được sự sung túc” cho ἡ εὐπορία ἡμῖν ἐστιν
    rationale: Cách hiện tại của động từ εἰμί xác nhận sự sung túc hiện có, với ἐκ chỉ nguồn gốc. “Sự sung túc của chúng ta là nhờ nghề này” giữ rõ hơn quan hệ ấy mà không thêm sắc thái quá trình đạt được.
