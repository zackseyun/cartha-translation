  text: οὓς συναθροίσας καὶ τοὺς περὶ τὰ τοιαῦτα ἐργάτας εἶπεν· Ἄνδρες, ἐπίστασθε ὅτι ἐκ ταύτης τῆς ἐργασίας ἡ εὐπορία ⸀ἡμῖν ἐστιν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/025.yaml
  text: After gathering them together[a], along with the workmen occupied with such things, he said, “Men, you know that from this business we have our prosperity.
translation:
  language: vi
  text: 'Ông tập hợp họ cùng với những người thợ làm những việc như thế, rồi nói: “Các ông biết rằng sự sung túc của chúng ta là nhờ nghề này.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “sự giàu có của chúng ta là nhờ nghề này.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: συναθροίσας
  choice: tập hợp ... rồi
  rationale: Phân từ bất định quá khứ diễn tả hành động xảy ra trước động từ chính; cách diễn đạt này tự nhiên trong tiếng Việt và giữ rõ trình tự hành động.
- source_word: τοὺς περὶ τὰ τοιαῦτα ἐργάτας
  choice: những người thợ làm các việc tương tự
  rationale: Giữ nghĩa rộng của ἐργάτας là người lao động/thợ và không thu hẹp quá mức vào một nghề thủ công cụ thể, dù ngữ cảnh nói đến việc chế tác đền miếu nhỏ.
- source_word: Ἄνδρες
  choice: Các ông
  rationale: Lời xưng hô trực tiếp với nhóm nam giới; “các ông” tự nhiên, trang trọng vừa phải và chính xác về giới tính trong tiếng Việt hiện đại.
- source_word: ἐπίστασθε
  choice: biết
  rationale: Diễn đạt trực tiếp sự hiểu biết mà người nghe đã có.
- source_word: ἐκ ταύτης τῆς ἐργασίας
  choice: nhờ nghề này
  rationale: Trong ngữ cảnh hoạt động kiếm lợi, ἐργασία mang nghĩa nghề nghiệp hoặc việc kinh doanh; “nghề này” tự nhiên và gắn với nhóm thợ vừa được nhắc đến.
- source_word: ἡ εὐπορία ἡμῖν ἐστιν
  choice: chúng ta có được sự sung túc
  rationale: εὐπορία chỉ sự dư dả, thịnh vượng về vật chất. Cách dịch này bảo toàn ý nguồn sinh kế đem lại tình trạng sung túc, không giới hạn nghĩa thành tiền công đơn thuần.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, rõ ràng và trang trọng vừa phải. Đại từ “ông” ở đầu câu dựa vào chủ thể Đê-mê-triu trong câu trước; lời gọi “các ông” phản ánh chính xác Ἄνδρες. Dấu chú thích [a] được đặt sau mệnh đề liên quan.
