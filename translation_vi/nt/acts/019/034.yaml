id: ACT.19.34
reference: Acts 19:34
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐπιγνόντες δὲ ὅτι Ἰουδαῖός ἐστιν φωνὴ ἐγένετο μία ἐκ πάντων ⸀ὡς ἐπὶ ὥρας δύο κραζόντων· Μεγάλη ἡ Ἄρτεμις Ἐφεσίων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/034.yaml
  text: But when they recognized that he was a Jew[a], one voice arose from them all, crying out for about two hours, “Great is Artemis of the Ephesians!”
translation:
  language: vi
  text: 'Nhưng khi nhận ra ông là người Do Thái[a], tất cả đồng thanh hô lớn suốt khoảng hai giờ: “Vĩ đại thay nữ thần Artemis của người Ê-phê-sô!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “người Giu-đê.” Từ Hy Lạp này có thể chỉ người Do Thái hoặc người đến từ miền Giu-đê; ở đây, nghĩa dân tộc-tôn giáo rộng hơn có vẻ phù hợp hơn.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιγνόντες
  choice: khi nhận ra
  rationale: Phân từ bất định diễn tả sự việc xảy ra trước phản ứng của đám đông; “khi nhận ra” vừa tự nhiên vừa giữ được quan hệ thời gian.
- source_word: δὲ
  choice: Nhưng
  rationale: Đánh dấu bước ngoặt tương phản với việc A-léc-xan-đơ định lên tiếng trong câu trước.
- source_word: Ἰουδαῖός
  choice: người Do Thái
  rationale: Trong bối cảnh kiều dân tại Ê-phê-sô, từ này nhiều khả năng chỉ căn tính dân tộc-tôn giáo hơn là đơn thuần chỉ người đến từ miền Giu-đê.
- source_word: φωνὴ ἐγένετο μία ἐκ πάντων
  choice: tất cả đồng thanh
  rationale: Diễn đạt tự nhiên thành ngữ Hy Lạp về một tiếng nói duy nhất phát ra từ toàn thể đám đông, đồng thời giữ trọng tâm về sự đồng loạt.
- source_word: ὡς ἐπὶ ὥρας δύο
  choice: suốt khoảng hai giờ
  rationale: “Khoảng” thể hiện tính ước lượng của ὡς, còn “suốt” cho thấy tiếng hô kéo dài liên tục.
- source_word: κραζόντων
  choice: hô lớn
  rationale: Phân từ hiện tại mô tả tiếng hô đang tiếp diễn trong cảnh náo động công cộng.
- source_word: Μεγάλη ἡ Ἄρτεμις Ἐφεσίων
  choice: Vĩ đại thay nữ thần Artemis của người Ê-phê-sô!
  rationale: “Vĩ đại thay” giữ sắc thái tung hô và vị trí nhấn mạnh của Μεγάλη; “của người Ê-phê-sô” phản ánh trực tiếp sở thuộc cách số nhiều Ἐφεσίων. Thêm danh từ loại “nữ thần” giúp độc giả Việt nhận diện Artemis mà không thay thế tên riêng gốc.
theological_decisions:
- issue: Cách dịch Ἰουδαῖος
  choice: người Do Thái
  alternative: người Giu-đê
  rationale: Phản ứng của đám đông tại Ê-phê-sô nhắm đến căn tính dân tộc-tôn giáo của A-léc-xan-đơ; cách hiểu địa lý hẹp hơn vẫn được ghi nhận trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “đồng thanh hô lớn” thay cho lối dịch sát hình ảnh “một tiếng nói phát ra từ tất cả” để câu tiếng Việt tự nhiên; giữ tên Artemis theo dạng quốc tế gần với nguyên ngữ và thêm “nữ thần” để làm rõ đối tượng được tung hô.
