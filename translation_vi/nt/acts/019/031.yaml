  text: τινὲς δὲ καὶ τῶν Ἀσιαρχῶν, ὄντες αὐτῷ φίλοι, πέμψαντες πρὸς αὐτὸν παρεκάλουν μὴ δοῦναι ἑαυτὸν εἰς τὸ θέατρον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/031.yaml
  text: And even some of the Asiarchs[a], being his friends[c][b], sent word to him and urged him not to venture into the theater.
translation:
  language: vi
  text: Thậm chí, một số quan chức của tỉnh A-si-a[a], vốn là bạn của ông, cũng sai người đến khẩn khoản xin ông đừng liều mình đi vào nhà hát.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Quan chức của tỉnh A-si-a” dịch danh hiệu Hy Lạp Asiarchēs, chỉ những nhân vật nổi bật có vai trò lãnh đạo và gắn với đời sống công cộng, tôn giáo của tỉnh A-si-a thuộc La Mã.
    reason: cultural_note
lexical_decisions:
- source_word: τινὲς δὲ καὶ
  choice: Thậm chí, một số ... cũng
  rationale: Diễn đạt tự nhiên cả tính bất định của τινὲς lẫn sắc thái bổ sung, có phần đáng ngạc nhiên, của δὲ καὶ trong mạch kể.
- source_word: τῶν Ἀσιαρχῶν
  choice: quan chức đứng đầu tỉnh A-si-a
  rationale: Ἀσιάρχης là một danh hiệu kỹ thuật dành cho những nhân vật lãnh đạo nổi bật gắn với tỉnh A-si-a thuộc La Mã. Cách dịch theo chức năng giúp độc giả hiện đại hiểu ngay mà không khẳng định quá mức về chức năng chính xác của họ.
- source_word: ὄντες αὐτῷ φίλοι
  choice: vốn là bạn của ông
  rationale: Giữ quan hệ bạn hữu được φίλοι diễn tả và thể hiện chức năng cung cấp bối cảnh của phân từ ὄντες.
- source_word: πέμψαντες πρὸς αὐτὸν
  choice: sai người đến
  rationale: Động từ πέμπω không nêu rõ tân ngữ được sai đi; trong ngữ cảnh, cách nói này tự nhiên và không buộc phải thêm danh từ “lời nhắn” vốn không có trong bản Hy Lạp.
- source_word: παρεκάλουν
  choice: khẩn khoản
  rationale: Thể hiện lời yêu cầu tha thiết của παρακαλέω; dạng chưa hoàn thành cho thấy hành động đang diễn ra, nhưng tiếng Việt không cần đánh dấu riêng bằng một trợ từ thời-thể.
- source_word: μὴ δοῦναι ἑαυτὸν εἰς τὸ θέατρον
  choice: đừng liều mình đi vào nhà hát
  rationale: Thành ngữ theo nghĩa đen là không “trao/phó chính mình vào” nhà hát, tức không tự đặt mình vào tình thế nguy hiểm ở đó. “Liều mình đi vào” truyền đạt tự nhiên sắc thái tự nguyện bước vào nguy hiểm mà vẫn giữ hướng chuyển động của εἰς.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. “Nhà hát” ở đây là công trình công cộng lớn dùng cho các buổi trình diễn và hội họp, không chỉ là rạp hát theo nghĩa hiện đại.
