  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Câu giữ sự lặp tên A-léc-xan-đê của nguyên văn để làm rõ chủ thể, đồng thời phân biệt “đám đông” với “hội chúng” nhằm bảo toàn khác biệt giữa ὄχλος và δῆμος.
