base_translation:
  language: en
  yaml_path: translation/nt/acts/019/033.yaml
  text: And from the crowd they brought forward Alexander[a], since the Jews had pushed him forward; and Alexander, motioning with his hand[b], wanted to make a defense to the assembly.
translation:
  language: vi
  text: Từ trong đám đông, người ta đưa A-léc-xan-đê ra phía trước[a], vì những người Do Thái đã đẩy ông ra; A-léc-xan-đê đưa tay ra hiệu và muốn trình bày lời biện hộ trước dân chúng[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Người ta đưa A-léc-xan-đê ra phía trước... sau khi những người Do Thái đưa ông ra phía trước.” Tiếng Hy Lạp dùng hai động từ có nghĩa gần nhau để nói việc công khai đưa ông ra trước mọi người.'
    reason: lexical_alternative
  - marker: b
    text: Hay “trước công chúng.” Từ Hy Lạp ở đây mang sắc thái dân sự, công cộng và khác với từ “đám đông” ở đầu câu.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνεβίβασαν
  choice: đưa ... từ trong đám đông ra phía trước
  rationale: Trong ngữ cảnh này, động từ chỉ việc đưa A-léc-xan-đê ra trình diện công khai từ giữa đám đông, chứ không phải dạy bảo hay suy luận.
- source_word: προβαλόντων αὐτὸν τῶν Ἰουδαίων
  choice: vì những người Do Thái đã đẩy ông ra
  rationale: Cụm phân từ sở hữu cách giải thích việc A-léc-xan-đê được đưa ra phía trước; “đẩy ông ra” diễn đạt sức thúc đẩy trong tình huống mà không nhất thiết hàm ý bạo lực.
- source_word: κατασείσας τὴν χεῖρα
  choice: giơ tay ra hiệu
  rationale: Cách nói chỉ một cử chỉ bằng tay nhằm thu hút sự chú ý; bản dịch không thêm ý “xin im lặng,” dù đó có thể là mục đích.
- source_word: ἤθελεν ἀπολογεῖσθαι
  choice: muốn trình bày lời biện hộ
  rationale: Giữ sắc thái ý muốn hay ý định, chứ không nói rằng ông đã thực sự phát biểu; “lời biện hộ” phù hợp với sắc thái biện giải công khai.
- source_word: τῷ δήμῳ
  choice: trước hội chúng
  rationale: δῆμος ở đây mang sắc thái công cộng, dân sự của dân chúng đang tụ họp; “hội chúng” phân biệt với đám đông nói chung ở đầu câu.
- source_word: ὄχλου
  choice: đám đông
  rationale: Cách diễn đạt tự nhiên cho khối người tụ tập nói chung và giúp phân biệt với δῆμος ở cuối câu.
- source_word: Ἀλέξανδρον / Ἀλέξανδρος
  choice: A-léc-xan-đê
  rationale: Phiên âm tên riêng Hy Lạp theo lối viết rõ âm và quen dùng trong tiếng Việt.
theological_decisions: []
