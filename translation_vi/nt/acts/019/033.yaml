revisions:
- from: Người ta đưa A-léc-xan-đê từ trong đám đông ra phía trước[a], vì những người Do Thái đã đẩy ông ra; A-léc-xan-đê giơ tay ra hiệu và muốn trình bày lời biện hộ trước hội chúng[b].
  to: Từ trong đám đông, người ta đưa A-léc-xan-đê ra phía trước[a], vì những người Do Thái đã đẩy ông ra; A-léc-xan-đê đưa tay ra hiệu và muốn trình bày lời biện hộ trước dân chúng[b].
  rationale: Bản sửa thay thuật ngữ có thể mang sắc thái hội thánh bằng cách diễn đạt đúng hơn ý nghĩa dân sự-công cộng của δήμῳ, đồng thời làm cử chỉ bằng tay tự nhiên hơn. Cụm “đã đẩy ông ra” được giữ trong bản chính để phản ánh lực thúc đẩy của προβαλόντων mà không khẳng định bạo lực; chú thích nêu lựa chọn trung tính hơn là “đưa ông ra phía trước.”
