- from: Như vậy, lời Chúa cứ lan rộng đầy quyền năng và thắng thế.[a]
  to: Như vậy, lời Chúa cứ lan rộng và thắng thế một cách mạnh mẽ.[a]
  rationale: Đổi “đầy quyền năng” thành “một cách mạnh mẽ” để phản ánh rõ hơn giá trị trạng ngữ và phạm vi trên cả “lan rộng” lẫn “thắng thế” của κατὰ κράτος, mà không thay đổi ý nghĩa của câu. Chú thích được điều chỉnh để nêu các phương án từ vựng thực sự thay thế cho bản dịch đã chọn.
