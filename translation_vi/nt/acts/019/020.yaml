  text: οὕτως κατὰ κράτος ⸂τοῦ κυρίου ὁ λόγος⸃ ηὔξανεν καὶ ἴσχυεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/020.yaml
  text: So the word of the Lord was growing mightily and prevailing[a].
translation:
  language: vi
  text: Như vậy, lời Chúa cứ lan rộng và thắng thế một cách mạnh mẽ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cụm từ Hy Lạp κατὰ κράτος cũng có thể dịch là “với quyền năng” hoặc “đầy sức mạnh.”
    reason: Nêu lựa chọn từ vựng khác cho thành ngữ trạng ngữ κατὰ κράτος.
lexical_decisions:
- source_word: οὕτως
  choice: Như vậy
  rationale: Diễn tả kết quả của các sự việc vừa được thuật lại, đồng thời tự nhiên và trang trọng trong tiếng Việt hiện đại.
- source_word: κατὰ κράτος
  choice: đầy quyền năng
  rationale: Cụm thành ngữ diễn tả sức mạnh hay tác động mạnh mẽ. Cách dịch này giữ sắc thái của danh từ κράτος và có thể được hiểu là bổ nghĩa cho cả sự lan rộng lẫn sự thắng thế.
- source_word: τοῦ κυρίου
  choice: của Chúa
  rationale: Giữ nguyên tước hiệu κύριος mà không thêm tên “Giê-su”, vì nguyên văn chỉ nói “Chúa” dù văn cảnh hướng đến Chúa Giê-su.
- source_word: ὁ λόγος
  choice: lời
  rationale: Chỉ sứ điệp được rao giảng và duy trì cách diễn đạt quen thuộc, lặp lại nhiều lần trong Công Vụ.
- source_word: ηὔξανεν
  choice: cứ lan rộng
  rationale: Thì chưa hoàn thành diễn tả tiến trình liên tục; trong văn cảnh nói về sứ điệp, “lan rộng” tự nhiên hơn cách dịch sát chữ “lớn lên”.
- source_word: ἴσχυεν
  choice: thắng thế
  rationale: Diễn tả việc có sức mạnh và đạt ưu thế; khi đi cùng sự lan rộng của lời Chúa, “thắng thế” truyền đạt tác động hữu hiệu mà không làm mất sắc thái mạnh mẽ của động từ.
theological_decisions:
- issue: Đối tượng được gọi là “Chúa” trong τοῦ κυρίου
  choice: Chỉ dịch là “Chúa” trong chính văn.
  alternative: “Chúa Giê-su”
  rationale: Văn cảnh Công Vụ hướng đến Chúa Giê-su, nhưng nguyên văn không nêu tên. Bản dịch giữ cách gọi của tiếng Hy Lạp thay vì giải quyết điều nguyên văn để hàm ẩn.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. “Lời Chúa” là cách nói tự nhiên và quen thuộc; “cứ lan rộng” thể hiện tiến trình đang tiếp diễn, còn “đầy quyền năng và thắng thế” giữ cả sức mạnh lẫn hiệu quả của lời.
