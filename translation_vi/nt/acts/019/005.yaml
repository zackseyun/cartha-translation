  yaml_path: translation/nt/acts/019/005.yaml
  text: And when they heard this[a], they were baptized in the name of the Lord Jesus.
translation:
  language: vi
  text: Khi nghe vậy, họ được báp-têm nhân danh Chúa Giê-su.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc dịch sát hơn: “vào danh Chúa Giê-su.”'
    reason: “Nhân danh” là cách diễn đạt tự nhiên và quen thuộc trong tiếng Việt cho công thức báp-têm; chú thích bảo lưu sắc thái của εἰς τὸ ὄνομα, nghĩa sát là “vào danh.”
lexical_decisions:
- source_word: ἀκούσαντες
  choice: Khi nghe vậy
  rationale: Phân từ bất định quá khứ mang chức năng thời gian. “Vậy” diễn đạt tự nhiên trong tiếng Việt đối tượng được hiểu ngầm từ lời Phao-lô ngay trước đó mà không thêm nội dung mới.
- source_word: δὲ
  choice: không dịch riêng
  rationale: δέ là từ nối nhẹ trong diễn tiến câu chuyện; tiếng Việt không cần một liên từ riêng ở đây, và “Khi” đã tạo sự nối kết tự nhiên với câu trước.
- source_word: ἐβαπτίσθησαν
  choice: họ chịu phép báp-têm
  rationale: Giữ ý nghĩa bị động của động từ, đồng thời dùng cách nói trang trọng và quen thuộc trong tiếng Việt hiện đại.
- source_word: εἰς τὸ ὄνομα
  choice: vào danh
  rationale: “Vào” giữ lực hướng đích và sắc thái gắn kết/đồng nhất của εἰς, thay vì tự động đồng hóa với công thức quen thuộc “nhân danh”. Vì cách nói này khác lạ trong tiếng Việt, cách dịch truyền thống được ghi ở chú thích.
- source_word: τοῦ κυρίου
  choice: Chúa
  rationale: Trong ngữ cảnh Kitô học này, κύριος là tước hiệu của Đức Giê-su; “Chúa” là cách dịch chuẩn, trang trọng và tự nhiên.
- source_word: Ἰησοῦ
  choice: Giê-su
  rationale: Dùng dạng tên riêng đã được chuẩn hóa và phổ biến trong tiếng Việt.
theological_decisions:
- issue: Cách diễn đạt công thức báp-têm
  choice: vào danh Chúa Giê-su
  alternative: nhân danh Chúa Giê-su
  rationale: Bản Hy Lạp dùng εἰς τὸ ὄνομα, theo sát là “vào danh”, có thể gợi sự bước vào mối liên hệ hoặc sự thuộc về. Cách dịch này bảo tồn lực của giới từ và không âm thầm biến câu thành một công thức hành lễ. Cách truyền thống, tự nhiên hơn trong tiếng Việt, được giữ trong chú thích.
translation_notes:
  register: Văn phong ngắn gọn, trang trọng và dễ hiểu. “Chịu phép báp-têm” giữ thể bị động; “vào danh” cố ý hơi khác lạ để phản ánh cấu trúc Hy Lạp, với cách nói quen thuộc hơn trong chú thích.
