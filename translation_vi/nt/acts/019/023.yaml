  yaml_path: translation/nt/acts/019/023.yaml
  text: At that time there arose no small disturbance concerning the Way[a].
translation:
  language: vi
  text: Vào thời ấy, đã xảy ra một cuộc náo động không nhỏ về Đạo[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “con đường”. Ở đây, từ này chỉ phong trào của những người theo Chúa Giê-su và là một danh xưng xuất hiện nhiều lần trong sách Công Vụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο
  choice: nổi lên
  rationale: Động từ ở đây giới thiệu sự xuất hiện của một biến cố; “nổi lên” tự nhiên trong tiếng Việt và giữ được sắc thái biến cố hơn cách diễn đạt tĩnh “có”.
- source_word: δὲ
  choice: không dịch thành từ riêng
  rationale: δέ là liên từ chuyển tiếp nhẹ. Trong câu tiếng Việt này, mạch kể đã được thể hiện tự nhiên bằng cụm thời gian mở đầu; thêm “bấy giờ” hoặc “nhưng” dễ tạo sắc thái thời gian hay tương phản quá mức.
- source_word: κατὰ τὸν καιρὸν ἐκεῖνον
  choice: Vào thời gian ấy
  rationale: Chuyển đạt trực tiếp ý nghĩa thời gian “vào/trong thời gian ấy” bằng cách nói tự nhiên, trang trọng vừa phải.
- source_word: τάραχος
  choice: một cuộc náo động
  rationale: τάραχος chỉ sự rối loạn, xáo động. “Cuộc náo động” phù hợp với diễn biến đám đông mà không xác định quá sớm đó là một cuộc bạo loạn theo nghĩa pháp lý.
- source_word: οὐκ ὀλίγος
  choice: không nhỏ
  rationale: Giữ nguyên lối nói giảm phủ định của Lu-ca thay vì làm phẳng thành “lớn” hay “đáng kể”.
- source_word: περὶ
  choice: liên quan đến
  rationale: Thể hiện rõ Đạo là vấn đề hoặc nguyên do xoay quanh cuộc náo động, đồng thời vẫn giữ phạm vi nghĩa rộng của giới từ.
- source_word: τῆς ὁδοῦ
  choice: Đạo
  rationale: Trong Công Vụ, cụm này nhiều lần là danh xưng chỉ phong trào theo Chúa Giê-su. “Đạo” là cách gọi ngắn gọn, tự nhiên trong tiếng Việt và giữ được nét nghĩa về con đường/lối sống, nhưng cần chú thích để tránh bị hiểu thuần túy là một tôn giáo theo cách gọi hiện đại.
theological_decisions:
- issue: τῆς ὁδοῦ là danh xưng của phong trào Cơ Đốc
  choice: Đạo
  alternative: con đường
  rationale: Ngữ cảnh Công Vụ cho thấy đây là một danh xưng quen dùng cho cộng đồng và lối sống của những người theo Chúa Giê-su. Viết hoa “Đạo” giúp người đọc nhận ra chức năng danh xưng mà không bổ sung nội dung giáo phái; chú thích bảo tồn khả năng dịch sát chữ là “con đường”.
translation_notes:
  register: Tiếng Việt hiện đại, rõ ràng và trang trọng vừa phải. Giữ lối nói “không nhỏ” của nguyên tác và tránh gọi biến cố ngay là “bạo loạn”. Đại từ chỉ thời gian “ấy” liên kết tự nhiên với văn cảnh trước.
