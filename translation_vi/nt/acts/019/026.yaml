language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ θεωρεῖτε καὶ ἀκούετε ὅτι οὐ μόνον Ἐφέσου ἀλλὰ σχεδὸν πάσης τῆς Ἀσίας ὁ Παῦλος οὗτος πείσας μετέστησεν ἱκανὸν ὄχλον, λέγων ὅτι οὐκ εἰσὶν θεοὶ οἱ διὰ χειρῶν γινόμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/026.yaml
  text: And you see and hear that not only in Ephesus but in almost all of Asia[a], this Paul has persuaded and turned away a considerable crowd[b], saying that gods made by hands are not gods.
translation:
  language: vi
  text: Anh em thấy và nghe rằng không chỉ tại Ê-phê-sô mà hầu như khắp A-si-a[a], tên Phao-lô này đã thuyết phục và khiến một đám đông đáng kể đổi hướng bằng cách nói rằng những thần do tay người làm ra[b] không phải là thần.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A-si-a ở đây là tỉnh A-si-a của La Mã ở miền tây Tiểu Á, không phải toàn bộ châu Á ngày nay.
    reason: historical_geography
  - marker: b
    text: Cụm Hy Lạp có nghĩa là “được làm ra qua tay”; đây là cách nói về các tượng thần do con người chế tác.
    reason: cultural_note
lexical_decisions:
- source_word: θεωρεῖτε καὶ ἀκούετε
  choice: anh em thấy và nghe
  rationale: Giữ nguyên lời kêu gọi kép hướng đến bằng chứng công khai trước mắt và tai người nghe; “anh em” phù hợp với lời Demetrius nói cùng một nhóm người.
- source_word: οὐ μόνον Ἐφέσου ἀλλὰ σχεδὸν πάσης τῆς Ἀσίας
  choice: không chỉ tại Ê-phê-sô, mà gần như khắp cả A-si-a
  rationale: Diễn đạt tự nhiên ý địa điểm hàm chứa trong cấu trúc sở hữu cách; “gần như khắp cả” thể hiện phạm vi rộng nhưng không tuyệt đối của σχεδόν.
- source_word: ὁ Παῦλος οὗτος
  choice: tên Phao-lô này
  rationale: Truyền đạt sắc thái coi thường của đại từ chỉ định trong lời cáo buộc, nhưng không thêm lời miệt thị quá mạnh.
- source_word: πείσας μετέστησεν
  choice: đã thuyết phục và khiến ... quay lưng
  rationale: Thể hiện việc Phao-lô dùng sự thuyết phục để khiến nhiều người rời bỏ lập trường hay thực hành trước đó, đồng thời không tự ý nêu rõ đối tượng họ quay lưng lại.
- source_word: ἱκανὸν ὄχλον
  choice: một đám đông đáng kể
  rationale: ἱκανός ở đây nói đến số người đủ lớn để gây ảnh hưởng; cách dịch này giữ sắc thái ấy mà không phóng đại.
- source_word: οἱ διὰ χειρῶν γινόμενοι
  choice: những thần do tay người làm ra
  rationale: Giữ hình ảnh “do tay làm ra” của nguyên văn, đồng thời thêm “người” để thành ngữ rõ nghĩa và tự nhiên trong tiếng Việt.
- source_word: οὐκ εἰσὶν θεοὶ
  choice: không phải là thần
  rationale: Giữ lời phủ nhận trực tiếp địa vị thần linh của các thần tượng được chế tác, không thêm từ diễn giải như “thật sự”.
theological_decisions:
- issue: Cách diễn đạt lời phủ nhận các thần tượng do con người chế tác
  choice: những thần do tay người làm ra không phải là thần
  alternative: những vật do tay người làm ra không phải là các thần
  rationale: Cấu trúc Hy Lạp gọi đối tượng ấy là “những thần được làm ra bằng tay” rồi phủ nhận rằng chúng là thần. Bản dịch giữ nghịch lý có chủ ý và sức công kích của câu nói, thay vì làm phẳng thành một phát biểu chung về mọi vật do con người làm.
- issue: Đối tượng mà đám đông quay lưng lại
  choice: không nêu rõ đối tượng
  alternative: khiến một đám đông đáng kể quay lưng lại với việc thờ thần tượng
  rationale: Nguyên văn chỉ nói Phao-lô khiến đám đông chuyển hướng, còn đối tượng được suy ra từ ngữ cảnh. Không bổ sung “việc thờ thần tượng” giúp bảo toàn mức độ hàm ý của câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Tên Phao-lô này” giữ giọng khinh miệt nhẹ trong lời Demetrius; “quay lưng” diễn đạt tự nhiên sự đổi hướng nhưng vẫn để ngỏ điều bị từ bỏ. Dấu chú thích được đặt ngay sau các cụm từ tương ứng.
