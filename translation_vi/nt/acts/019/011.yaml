  text: Δυνάμεις τε οὐ τὰς τυχούσας ⸂ὁ θεὸς ἐποίει⸃ διὰ τῶν χειρῶν Παύλου,
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/011.yaml
  text: And God was doing extraordinary miracles through the hands of Paul,[a]
translation:
  language: vi
  text: Đức Chúa Trời đã thực hiện những phép lạ phi thường qua tay Phao-lô.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát nghĩa: “những việc quyền năng không phải loại thông thường.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Δυνάμεις
  choice: những phép lạ
  rationale: Danh từ số nhiều ở đây chỉ những việc quyền năng được thực hiện, nên “những phép lạ” truyền đạt rõ nghĩa sự kiện trong tiếng Việt hiện đại.
- source_word: τε
  choice: (không dịch riêng)
  rationale: Tiểu từ này nối câu với mạch kể trước; trong tiếng Việt, sự liên kết đã tự nhiên theo văn cảnh nên không cần thêm một liên từ cứng nhắc.
- source_word: οὐ τὰς τυχούσας
  choice: phi thường
  rationale: Cụm thành ngữ có nghĩa đen là “không thuộc loại bình thường”; “phi thường” giữ được sắc thái nhấn mạnh mà vẫn tự nhiên khi bổ nghĩa cho “phép lạ”.
- source_word: ὁ θεὸς
  choice: Đức Chúa Trời
  rationale: Chủ ngữ được nêu rõ là Đức Chúa Trời, qua đó bảo toàn tác nhân thần linh của hành động.
- source_word: ἐποίει
  choice: làm
  rationale: Động từ chỉ việc thực hiện; thể chưa hoàn thành gợi hành động diễn tiến hoặc lặp lại trong quá khứ, điều mà ngữ cảnh tường thuật tiếng Việt có thể chuyển tải tự nhiên bằng động từ không đánh dấu thì.
- source_word: διὰ τῶν χειρῶν Παύλου
  choice: dùng tay Phao-lô
  rationale: Cách diễn đạt giữ hình ảnh cụ thể “tay” và biểu thị Phao-lô là phương tiện Đức Chúa Trời sử dụng, thay vì là nguồn độc lập của quyền năng.
- source_word: Παύλου
  choice: Phao-lô
  rationale: Dùng dạng tên riêng quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
theological_decisions:
- issue: Tác nhân thực hiện phép lạ
  choice: Đức Chúa Trời là Đấng làm phép lạ, dùng tay Phao-lô làm phương tiện.
  alternative: Phao-lô tự mình làm các phép lạ.
  rationale: Trong tiếng Hy Lạp, ὁ θεὸς là chủ ngữ của ἐποίει, còn διὰ τῶν χειρῶν Παύλου biểu thị phương tiện trung gian. Bản dịch duy trì sự phân biệt này.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại và dễ hiểu. “Dùng tay Phao-lô” bảo toàn hình ảnh của nguyên văn; “phi thường” chuyển tải tự nhiên thành ngữ phủ định trong tiếng Hy Lạp.
