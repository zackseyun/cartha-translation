revisions:
- from: Đức Chúa Trời dùng tay Phao-lô làm những phép lạ phi thường.[a]
  to: Đức Chúa Trời đã thực hiện những phép lạ phi thường qua tay Phao-lô.[a]
  rationale: Bản sửa thêm dấu hiệu quá khứ phù hợp với động từ ἐποίει và thay cấu trúc phương tiện bằng “qua tay Phao-lô” để vừa tự nhiên trong tiếng Việt vừa duy trì rõ Đức Chúa Trời là tác nhân thực hiện. Không có thay đổi ý nghĩa hay giải quyết thần học vượt quá ngữ pháp nguyên văn.
