  text: There were about twelve men in all.
translation:
  language: vi
  text: Tổng cộng có khoảng mười hai người nam.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἦσαν
  choice: có
  rationale: Trong ngữ cảnh nêu số người hiện diện, cách diễn đạt tồn tại bằng “có” là tự nhiên trong tiếng Việt và truyền đạt đúng ý của động từ.
- source_word: δὲ
  choice: —
  rationale: Đây là liên từ nhẹ; trong câu tiếng Việt hiện đại không cần dịch riêng vì không biểu thị sự tương phản rõ rệt.
- source_word: οἱ πάντες
  choice: tổng cộng
  rationale: Cụm này chỉ toàn bộ nhóm và có chức năng tổng kết số lượng; “tổng cộng” vừa tự nhiên vừa giữ đúng sắc thái ấy.
- source_word: ἄνδρες
  choice: người nam
  rationale: ἀνήρ ở đây chỉ nam giới, không phải con người nói chung; “người nam” giữ chính xác nét nghĩa giới tính trong lối văn hiện đại.
- source_word: ὡσεὶ
  choice: khoảng
  rationale: Từ này đánh dấu số lượng ước chừng; “khoảng” là cách diễn đạt tự nhiên và rõ ràng.
- source_word: δώδεκα
  choice: mười hai
  rationale: Dịch trực tiếp số từ.
theological_decisions: []
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, ngắn gọn và trang trọng vừa phải. Trật tự “Tổng cộng có khoảng...” diễn đạt tự nhiên phép tổng kết số lượng, đồng thời không làm mất tính ước chừng của nguyên văn.
