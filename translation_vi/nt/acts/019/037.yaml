source:
  edition: SBLGNT
  text: ἠγάγετε γὰρ τοὺς ἄνδρας τούτους οὔτε ἱεροσύλους οὔτε βλασφημοῦντας τὴν θεὸν ⸀ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/037.yaml
  text: For you have brought these men here who are neither temple robbers nor blasphemers of our goddess[a].
translation:
  language: vi
  text: Vì các ông đã đưa những người này đến đây, trong khi họ không phải là những kẻ cướp bóc đền thờ cũng không xúc phạm nữ thần của chúng ta.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tiếng Hy Lạp dùng danh từ có nghĩa là “thần”; mạo từ giống cái cho thấy ở đây là “nữ thần.” Trong ngữ cảnh, đó là Artemis.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠγάγετε
  choice: đã giải ... đến đây
  rationale: Động từ aorist ἄγω chỉ hành động đưa những người này ra trước cuộc hội họp; “giải ... đến đây” tự nhiên trong bối cảnh họ bị đám đông lôi đến và nhấn mạnh hành động đã hoàn tất.
- source_word: γὰρ
  choice: Vì
  rationale: Giữ chức năng giải thích, nêu lý do cho lời kêu gọi của viên thư ký thành phố.
- source_word: τοὺς ἄνδρας τούτους
  choice: những người này
  rationale: Trong tiếng Việt, “những người này” vừa tự nhiên vừa giữ được sắc thái chỉ trực tiếp của τούτους; không cần thêm từ chỉ giới tính vì ngữ cảnh đã rõ.
- source_word: οὔτε ... οὔτε
  choice: dù ... không ... cũng không
  rationale: Diễn đạt tự nhiên trong tiếng Việt hai lời phủ định song song, đồng thời phù hợp với cấu trúc câu nêu sự thật làm căn cứ.
- source_word: ἱεροσύλους
  choice: cướp đền thờ
  rationale: Từ này chỉ hành vi cướp bóc tài sản thiêng hoặc phạm thánh đối với đền thờ; cách dịch cụ thể “cướp đền thờ” phù hợp nhất với ngữ cảnh pháp lý.
- source_word: βλασφημοῦντας
  choice: xúc phạm
  rationale: Phân từ chỉ việc nói lời lăng mạ hoặc phạm thượng đối với một thần linh. “Xúc phạm” là cách nói hiện đại, rõ nghĩa khi có tân ngữ đi kèm.
- source_word: τὴν θεὸν ἡμῶν
  choice: nữ thần của chúng ta
  rationale: Danh từ θεός ở đây quy chiếu rõ ràng đến Artemis; “nữ thần” chuyển tải đúng đối tượng trong tiếng Việt, còn “của chúng ta” giữ đại từ sở hữu ἡμῶν.
theological_decisions:
- issue: Cách dịch θεὸν ἡμῶν khi đối tượng là Artemis
  choice: nữ thần của chúng ta
  alternative: thần của chúng ta
  rationale: Người nói là viên chức Ê-phê-sô đang nhắc đến Artemis. Dùng “nữ thần” làm rõ đối tượng nữ theo ngữ cảnh mà không hàm ý tán thành việc thờ thần ngoại giáo; chú thích bảo lưu hình thức sát chữ của tiếng Hy Lạp.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và phù hợp lời biện luận công khai. “Các người” phản ánh lời viên chức nói trực tiếp với đám đông; “giải ... đến đây” gợi đúng bối cảnh những người này bị đưa ra trước hội chúng.
