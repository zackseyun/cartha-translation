    rationale: “Giải” trong tiếng Việt thường gợi việc áp giải người bị bắt hoặc bị canh giữ. ἄγω chỉ việc đem/dẫn đến và không tự xác định sắc thái cưỡng bức này.
  - severity: low
    issue: “dù họ không ... cũng không”
    rationale: “Dù” tạo sắc thái nhượng bộ rõ hơn điều nguyên văn cần nói. Câu nêu lý do dựa trên việc những người ấy không phạm hai điều bị cáo buộc; “trong khi” giữ liên hệ này tự nhiên hơn.
  - severity: low
    issue: Chú thích về “thần” chưa phản ánh tín hiệu giống cái trong tiếng Hy Lạp
    rationale: τὴν là mạo từ giống cái, hỗ trợ cách dịch “nữ thần” ngay trong hình thức ngữ pháp, ngoài sự xác định từ ngữ cảnh Artemis.
