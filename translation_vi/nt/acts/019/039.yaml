base_translation:
  language: en
  yaml_path: translation/nt/acts/019/039.yaml
  text: But if you seek anything further[a], it will be settled in the lawful assembly.
translation:
  language: vi
  text: Còn nếu quý vị còn yêu cầu điều gì khác, thì vấn đề ấy sẽ được giải quyết trong một cuộc họp theo luật định[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “trong cuộc họp hợp pháp” hoặc “trong cuộc họp thường kỳ.” Từ Hy Lạp chỉ một cuộc tập hợp công dân được thành lập hợp pháp, không phải hội thánh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: περαιτέρω
  choice: thêm
  rationale: Trạng từ chỉ điều bổ sung hoặc vượt ra ngoài vấn đề đang bàn; “thêm” tự nhiên trong tiếng Việt và giữ được ý so sánh.
- source_word: ἐπιζητεῖτε
  choice: muốn tìm hiểu
  rationale: Động từ có thể mang nghĩa tìm kiếm, theo đuổi hoặc hỏi về. Trong bối cảnh hành chính-dân sự, “muốn tìm hiểu” diễn đạt tự nhiên việc nêu thêm một vấn đề mà không gán sắc thái đòi hỏi quá mạnh.
- source_word: ἐννόμῳ
  choice: hợp pháp
  rationale: Tính từ chỉ điều phù hợp với luật pháp; “hợp pháp” nêu rõ hội nghị được triệu tập và tiến hành theo thủ tục luật định.
- source_word: ἐκκλησίᾳ
  choice: hội nghị
  rationale: Ở đây từ này chỉ cuộc tập hợp dân sự chính thức tại Ê-phê-sô, không phải hội thánh Cơ Đốc. “Hội nghị” tránh sắc thái giáo hội và phù hợp với bối cảnh công quyền.
- source_word: ἐπιλυθήσεται
  choice: sẽ được giải quyết
  rationale: Thể tương lai bị động nói rằng vấn đề sẽ được phân xử hoặc tháo gỡ theo đúng thủ tục; cách dịch này tự nhiên và không thu hẹp nghĩa thành một phán quyết tư pháp.
- source_word: τι
  choice: điều gì
  rationale: Đại từ bất định trong mệnh đề điều kiện; “điều gì” kết hợp tự nhiên với “muốn tìm hiểu” và giữ tính mở của vấn đề bổ sung.
theological_decisions:
- issue: Cách dịch ἐκκλησία trong bối cảnh dân sự, không phải Cơ Đốc giáo
  choice: hội nghị
  alternative: hội thánh; cuộc họp; hội đồng
  rationale: Ngữ cảnh nói đến một cuộc tập hợp dân sự được thành lập hợp pháp tại Ê-phê-sô. Dịch là “hội thánh” sẽ gây hiểu lầm về bản chất giáo hội; “hội nghị” truyền đạt chức năng tụ họp chính thức mà không biến từ này thành thuật ngữ tòa án.
translation_notes:
  register: Văn phong trang trọng, rõ ràng và hiện đại. “Anh em” phù hợp với lời viên thư ký thành phố nói trực tiếp với đám đông; “hội nghị hợp pháp” giữ bối cảnh hành chính-dân sự và tránh hàm ý giáo hội.
