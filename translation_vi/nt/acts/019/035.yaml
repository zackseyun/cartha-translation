source:
  edition: SBLGNT
  text: καταστείλας δὲ ⸂ὁ γραμματεὺς τὸν ὄχλον⸃ φησίν· Ἄνδρες Ἐφέσιοι, τίς γάρ ἐστιν ⸀ἀνθρώπων ὃς οὐ γινώσκει τὴν Ἐφεσίων πόλιν νεωκόρον οὖσαν τῆς ⸀μεγάλης Ἀρτέμιδος καὶ τοῦ διοπετοῦς;
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/035.yaml
  text: But after the city clerk had quieted the crowd, he said, “Men of Ephesus, for what man is there who does not know that the city of the Ephesians is temple-keeper of the great Artemis and of the image fallen from heaven?”
translation:
  language: vi
  text: 'Viên thư ký thành phố làm cho đám đông yên lặng rồi nói: “Hỡi người Ê-phê-sô, ai mà không biết thành Ê-phê-sô là thành được giao trông coi việc thờ phụng[a] nữ thần Ác-tê-mi vĩ đại và vật từ trời rơi xuống[b]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “thành trông coi đền thờ.” Từ Hy Lạp chỉ một thành được công nhận là người trông coi hoặc bảo trợ một đền thờ hay việc thờ cúng.'
    reason: lexical_alternative
  - marker: b
    text: 'Hoặc: “vật từ trên trời rơi xuống.” Từ Hy Lạp chỉ một vật được cho là đã rơi từ trời; trong ngữ cảnh này, rất có thể là tượng thờ gắn với Ác-tê-mi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καταστείλας
  choice: trấn an
  rationale: Diễn tả việc viên chức làm đám đông đang náo động lắng xuống trước khi phát biểu; cấu trúc “... rồi nói” thể hiện tự nhiên trình tự của phân từ aorist và động từ chính.
- source_word: ὁ γραμματεὺς
  choice: viên thư ký thành phố
  rationale: Trong bối cảnh hành chính Ê-phê-sô, từ này chỉ một viên chức đô thị, không phải thầy thông giáo; “viên thư ký thành phố” rõ nghĩa đối với độc giả hiện đại.
- source_word: Ἄνδρες Ἐφέσιοι
  choice: Thưa những người Ê-phê-sô
  rationale: Giữ sắc thái xưng hô trang trọng với dân thành; tiếng Việt không cần gượng ép dùng từ chỉ riêng nam giới, dù danh từ Hy Lạp mang hình thức giống đực.
- source_word: τίς γάρ ἐστιν ἀνθρώπων ὃς οὐ γινώσκει
  choice: ai mà không biết
  rationale: Chuyển đúng sức mạnh của câu hỏi tu từ sang cách nói tự nhiên, hiện đại trong tiếng Việt.
- source_word: τὴν Ἐφεσίων πόλιν
  choice: thành của người Ê-phê-sô
  rationale: Phản ánh trực tiếp kết cấu sở hữu trong tiếng Hy Lạp, đồng thời phù hợp với văn phong trang trọng.
- source_word: νεωκόρον
  choice: thành bảo hộ đền thờ
  rationale: Thuật ngữ nói về một thành được nhìn nhận là nơi trông coi, bảo hộ một đền thờ hay việc thờ cúng; thêm “thành” để cho thấy tính chất danh hiệu thuộc về đô thị.
- source_word: τῆς μεγάλης Ἀρτέμιδος
  choice: của nữ thần Ác-tê-mi vĩ đại
  rationale: Tên riêng được phiên âm dễ đọc trong tiếng Việt; “nữ thần” giúp độc giả nhận ra nhân vật ngoại giáo được nhắc đến, còn “vĩ đại” giữ danh xưng trong lời nói của viên chức.
- source_word: τοῦ διοπετοῦς
  choice: pho tượng từ trời rơi xuống
  rationale: Từ Hy Lạp chỉ vật được cho là rơi từ trời; ngữ cảnh rất có thể nói đến tượng thờ. Bản dịch làm rõ sở chỉ có khả năng nhất nhưng ghi chú vẫn bảo lưu nghĩa rộng hơn.
theological_decisions:
- issue: Lời khẳng định ngoại giáo về Ác-tê-mi và vật διοπετές
  choice: 'Trình bày thẳng lời tuyên bố của viên chức: “nữ thần Ác-tê-mi vĩ đại” và “pho tượng từ trời rơi xuống.”'
  alternative: “nữ thần Ác-tê-mi lớn” và “vật từ trời rơi xuống”
  rationale: Đây là lời được thuật lại, không phải lời người kể xác nhận tín ngưỡng ấy là thật. Cách dịch giữ nguyên quan điểm của người phát ngôn mà không thêm lời tán thành hay bác bỏ.
- issue: Sở chỉ của διοπετές
  choice: pho tượng
  alternative: vật
  rationale: Trong bối cảnh thờ Ác-tê-mi, sở chỉ rất có thể là tượng thờ, nhưng bản thân từ Hy Lạp không nêu rõ “tượng”; vì vậy chú thích bảo lưu sự mơ hồ từ vựng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “viên thư ký thành phố” để phân biệt chức vụ dân sự với thầy thông giáo; câu hỏi tu từ được diễn đạt tự nhiên bằng “ai mà không biết.” Các dấu chú thích [a], [b] đều xuất hiện ngay trong câu chính.
