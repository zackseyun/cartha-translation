  - severity: medium
    issue: “Năm mươi ngàn đồng bạc” có thể hàm ý một loại tiền xu xác định
    rationale: Cụm ἀργυρίου μυριάδας πέντε chỉ số lượng bạc/trị giá bằng bạc; bản văn không nêu mệnh giá. Dùng “năm mươi ngàn đơn vị bạc” trong câu chính phù hợp với chú thích và giữ sự không xác định của nguyên ngữ.
