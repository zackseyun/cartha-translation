  to: Nhiều người từng thực hành ma thuật mang sách của mình đến, tập hợp lại rồi đốt trước mặt mọi người; họ tính tổng giá trị của các sách ấy và thấy là năm mươi ngàn đơn vị bạc.[a]
  rationale: Bản sửa chỉ làm câu văn tự nhiên hơn và loại bỏ hàm ý rằng nguyên ngữ xác định một loại tiền xu. Các yếu tố nghĩa chính, gồm tính công khai của việc đốt sách, ý nghĩa “ma thuật,” và giá trị năm vạn bạc, đều được giữ nguyên.
