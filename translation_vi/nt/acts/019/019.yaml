  source_fidelity: 'Bản dịch truyền đạt đúng các ý chính: một số đông người từng thực hành ma thuật công khai gom sách lại, đốt chúng, rồi tính giá trị là năm mươi ngàn đơn vị bạc. Tuy nhiên, “đem sách của mình đến gom lại” chưa diễn đạt trôi chảy quan hệ của συνενέγκαντες với τὰς βίβλους. “Đồng bạc” trong câu chính có thể gợi một mệnh giá tiền xu cụ thể, trong khi ἀργυρίου không xác định mệnh giá.'
