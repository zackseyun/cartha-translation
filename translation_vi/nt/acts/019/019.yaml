  text: ἱκανοὶ δὲ τῶν τὰ περίεργα πραξάντων συνενέγκαντες τὰς βίβλους κατέκαιον ἐνώπιον πάντων· καὶ συνεψήφισαν τὰς τιμὰς αὐτῶν καὶ εὗρον ἀργυρίου μυριάδας πέντε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/019.yaml
  text: And many of those who had practiced magic arts brought their books together and were burning them in front of everyone[b][a]; and they totaled up their value and found it to be fifty thousand pieces of silver.
translation:
  language: vi
  text: Nhiều người từng thực hành ma thuật mang sách của mình đến, tập hợp lại rồi đốt trước mặt mọi người; họ tính tổng giá trị của các sách ấy và thấy là năm mươi ngàn đơn vị bạc.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn là “năm vạn bạc,” tức năm mươi ngàn đơn vị bạc; bản văn không cho biết chính xác loại đồng tiền nào.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἱκανοὶ
  choice: Nhiều người
  rationale: Trong ngữ cảnh này, từ này chỉ một số lượng người đáng kể; “nhiều người” tự nhiên và rõ nghĩa trong tiếng Việt.
- source_word: τὰ περίεργα πραξάντων
  choice: từng thực hành ma thuật
  rationale: Thành ngữ Hy Lạp chỉ các hoạt động pháp thuật trong bối cảnh Ê-phê-sô, chứ không đơn thuần là những việc lạ hoặc gây tò mò.
- source_word: συνενέγκαντες τὰς βίβλους
  choice: đem sách của mình đến gom lại
  rationale: Cách dịch diễn đạt cụ thể việc mang các sách tới và tập hợp chúng tại một nơi; “của mình” được bổ sung theo ngữ cảnh.
- source_word: κατέκαιον
  choice: đốt
  rationale: Thì chưa hoàn thành có thể gợi hành động đang diễn ra, nhưng tiếng Việt tự nhiên dùng “đốt” trong chuỗi thuật sự mà không phủ nhận sắc thái tiến triển.
- source_word: ἐνώπιον πάντων
  choice: trước mặt mọi người
  rationale: Giữ rõ tính công khai của hành động bằng một cách nói hiện đại, tự nhiên.
- source_word: συνεψήφισαν τὰς τιμὰς αὐτῶν
  choice: cộng giá trị các sách ấy
  rationale: Động từ chỉ việc tính tổng, còn τιμή tại đây là giá trị bằng tiền.
- source_word: ἀργυρίου μυριάδας πέντε
  choice: năm mươi ngàn đồng bạc
  rationale: Nghĩa đen là “năm vạn bạc,” tức năm mươi ngàn đơn vị bạc; “đồng bạc” dễ hiểu nhưng không xác định một loại tiền cụ thể.
theological_decisions:
- issue: Ý nghĩa của τὰ περίεργα trong bối cảnh Ê-phê-sô
  choice: ma thuật
  alternative: những việc huyền bí; các tà thuật
  rationale: Ngữ cảnh gần nói đến trừ quỷ, ác linh và các sách liên quan đến pháp thuật. “Ma thuật” truyền đạt đúng thực hành lịch sử-tôn giáo được nói đến mà không thêm một hệ thống giáo lý riêng.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Bản dịch giữ nhịp thuật sự tự nhiên của tiếng Việt, đồng thời chú thích sự không xác định của đơn vị tiền tệ.
