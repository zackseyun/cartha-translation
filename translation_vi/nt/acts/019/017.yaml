id: ACT.19.17
reference: Acts 19:17
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τοῦτο δὲ ἐγένετο γνωστὸν πᾶσιν Ἰουδαίοις τε καὶ Ἕλλησιν τοῖς κατοικοῦσιν τὴν Ἔφεσον, καὶ ⸀ἐπέπεσεν φόβος ἐπὶ πάντας αὐτούς, καὶ ἐμεγαλύνετο τὸ ὄνομα τοῦ κυρίου Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/017.yaml
  text: And this became known to all the Jews and Greeks living in Ephesus[a], and fear fell upon them all[b], and the name of the Lord Jesus was being magnified.
translation:
  language: vi
  text: Việc ấy được mọi người Do Thái và Hy Lạp sống tại Ê-phê-sô biết đến. Tất cả họ đều kinh sợ[a], và danh Chúa Giê-su được tôn cao[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát nghĩa: “nỗi sợ ập xuống trên tất cả họ”; cũng có thể dịch: “tất cả họ đều khiếp sợ.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “được đề cao” hoặc “được hết sức tôn kính.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο
  choice: việc ấy
  rationale: Đại từ chỉ định số ít quy chiếu về sự việc vừa được kể; “việc ấy” tự nhiên và rõ nghĩa trong tiếng Việt.
- source_word: ἐγένετο γνωστὸν
  choice: được ... biết đến
  rationale: Diễn đạt tự nhiên ý sự việc trở nên được biết rộng rãi, đồng thời không hàm ý một tác nhân cụ thể chủ động loan báo.
- source_word: πᾶσιν Ἰουδαίοις τε καὶ Ἕλλησιν τοῖς κατοικοῦσιν τὴν Ἔφεσον
  choice: mọi người Do Thái và Hy Lạp sống tại Ê-phê-sô
  rationale: Giữ cả hai nhóm được nêu và cho cụm “sống tại Ê-phê-sô” bổ nghĩa tự nhiên cho cả hai.
- source_word: ἐπέπεσεν φόβος ἐπὶ πάντας αὐτούς
  choice: Tất cả họ đều kinh sợ
  rationale: Chuyển thành cách nói tự nhiên trong tiếng Việt, vẫn giữ phạm vi toàn thể và sức nặng của φόβος; chú thích bảo lưu hình ảnh sát chữ.
- source_word: φόβος
  choice: kinh sợ
  rationale: “Kinh sợ” có thể bao hàm cả nỗi sợ lẫn sự kính phục trước quyền năng, phù hợp ngữ cảnh mà không thu hẹp thành “kinh hoàng” hay chỉ “kính nể”.
- source_word: ἐμεγαλύνετο
  choice: ngày càng được tôn cao
  rationale: Thể chưa hoàn thành diễn tả tiến trình tiếp diễn; “được tôn cao” truyền đạt việc công khai đề cao, tôn kính, còn chú thích nêu phương án sát hình ảnh hơn.
- source_word: τὸ ὄνομα
  choice: danh
  rationale: “Danh” giữ nguyên mô-típ Kinh Thánh về tên tuổi, uy quyền và sự tôn kính, thay vì thu hẹp thành “danh tiếng”.
- source_word: τοῦ κυρίου Ἰησοῦ
  choice: Chúa Giê-su
  rationale: Dịch κύριος bằng tước hiệu “Chúa” và giữ quan hệ sở hữu trong cụm tự nhiên “danh Chúa Giê-su”.
theological_decisions:
- issue: Cách dịch κύριος khi nói về Giê-su
  choice: Chúa
  alternative: Chủ
  rationale: Trong ngữ cảnh này κύριος là tước hiệu Kitô học; “Chúa” là cách dịch chuẩn, trang trọng và không diễn giải thêm.
- issue: Dịch τὸ ὄνομα theo nghĩa đen hay diễn ý
  choice: danh Chúa Giê-su
  alternative: danh tiếng của Chúa Giê-su
  rationale: Giữ “danh” bảo tồn chiều kích Kinh Thánh về con người, thẩm quyền và vinh dự của Giê-su, không giới hạn ý nghĩa vào tiếng tăm.
- issue: Sắc thái của ἐμεγαλύνετο
  choice: ngày càng được tôn cao
  alternative: được làm cho lớn lên; được hết sức tôn kính
  rationale: Cách chọn phản ánh diễn tiến ở thì chưa hoàn thành và sự tôn vinh công khai, nhưng không xác định tác nhân hay áp đặt một sắc thái thần học hẹp.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Ê-phê-sô” theo lối phiên âm tên riêng Kinh Thánh quen dùng; “danh” được giữ vì giá trị văn chương và thần học. Cấu trúc câu được điều chỉnh nhẹ để tiếng Việt tự nhiên, trong khi các chú thích bảo lưu hình ảnh và sắc thái từ vựng của nguyên văn.
