  text: ἀναντιρρήτων οὖν ὄντων τούτων δέον ἐστὶν ὑμᾶς κατεσταλμένους ὑπάρχειν καὶ μηδὲν προπετὲς πράσσειν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/036.yaml
  text: Therefore[a], since these things are undeniable[c][b], it is necessary for you to remain calm and to do nothing rash.
translation:
  language: vi
  text: Vậy, vì những điều này không thể bị chối cãi[a], quý vị cần phải giữ bình tĩnh[b] và không làm điều gì hấp tấp[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “không thể bác bỏ” hoặc “không thể tranh cãi”.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “im lặng” hoặc “giữ mình điềm tĩnh”.'
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “không làm điều gì liều lĩnh” hoặc “không làm điều gì vội vàng”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναντιρρήτων
  choice: không thể chối cãi
  rationale: Tính từ này chỉ điều không thể bị bác bỏ hay tranh cãi. Cách dịch này tự nhiên trong tiếng Việt hiện đại và giữ nguyên sức nặng của lời viên thư ký thành phố.
- source_word: οὖν
  choice: Vậy
  rationale: Liên từ đánh dấu kết luận rút ra từ lập luận trước đó; “Vậy” diễn đạt tự nhiên mối liên hệ suy luận trong lời nói trực tiếp.
- source_word: ὄντων τούτων
  choice: vì những điều này
  rationale: Kết cấu sở hữu cách tuyệt đối nêu cơ sở cho lời khuyên. “Vì những điều này” chuyển tải sắc thái nguyên nhân một cách gọn và tự nhiên.
- source_word: δέον ἐστίν
  choice: cần phải
  rationale: Cụm vô nhân xưng diễn tả sự cần thiết hoặc bổn phận; “cần phải” vừa rõ nghĩa vừa phù hợp tiếng Việt hiện đại.
- source_word: κατεσταλμένους ὑπάρχειν
  choice: giữ bình tĩnh
  rationale: Phân từ hoàn thành kết hợp với ὑπάρχειν diễn tả trạng thái đã được trấn tĩnh và cần được duy trì. “Giữ bình tĩnh” phù hợp với bối cảnh đám đông đang náo động.
- source_word: μηδὲν προπετὲς πράσσειν
  choice: không làm điều gì hấp tấp
  rationale: προπετής nói đến hành động vội vàng, thiếu suy xét. “Hấp tấp” giữ trọng tâm ở tính bốc đồng mà không thêm sắc thái quá mạnh.
