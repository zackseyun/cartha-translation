translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “anh em” cho đại từ số nhiều trong lời viên thư ký trực tiếp nói với đám đông; không hàm ý riêng về quan hệ tôn giáo. Các dấu chú thích đều đặt ngay sau cụm từ liên quan.
