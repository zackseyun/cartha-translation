  text: ὥστε καὶ ἐπὶ τοὺς ἀσθενοῦντας ⸀ἀποφέρεσθαι ἀπὸ τοῦ χρωτὸς αὐτοῦ σουδάρια ἢ σιμικίνθια καὶ ἀπαλλάσσεσθαι ἀπ’ αὐτῶν τὰς νόσους, τά τε πνεύματα τὰ πονηρὰ ⸀ἐκπορεύεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/012.yaml
  text: so that even handkerchiefs or work aprons were carried away from his body to the sick[a], and the diseases left them[b], and the evil spirits went out.
translation:
  language: vi
  text: đến nỗi ngay cả khăn tay hoặc tạp dề lao động từ thân thể ông[a] cũng được mang đến cho những người đau yếu; bệnh tật lìa khỏi họ, và các tà linh cũng ra khỏi họ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nghĩa đen: “từ da ông.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: đến nỗi
  rationale: Diễn tả kết quả của các phép lạ phi thường được nêu ở câu trước, tự nhiên trong tiếng Việt.
- source_word: ἐπὶ τοὺς ἀσθενοῦντας
  choice: đến cho những người đau yếu
  rationale: Chuyển tải đích đến của các vật được mang đi và ý nghĩa của phân từ chỉ những người đang đau yếu.
- source_word: ἀποφέρεσθαι ἀπὸ τοῦ χρωτὸς αὐτοῦ
  choice: mang ... đã chạm vào da ông
  rationale: Diễn đạt tự nhiên hướng chuyển động từ thân thể Phao-lô đến người bệnh, đồng thời giữ nghĩa cụ thể của χρώς là da/bề mặt thân thể.
- source_word: σουδάρια
  choice: khăn tay
  rationale: Chỉ những mảnh vải dùng để lau mặt hoặc mồ hôi; “khăn tay” là cách gọi ngắn gọn, dễ hiểu.
- source_word: σιμικίνθια
  choice: tạp dề lao động
  rationale: Chỉ loại tạp dề hoặc y phục dùng khi làm việc; thành tố “lao động” giúp phân biệt với tạp dề thông thường.
- source_word: ἀπαλλάσσεσθαι ἀπ’ αὐτῶν τὰς νόσους
  choice: bệnh tật lìa khỏi họ
  rationale: Giữ hình ảnh các bệnh rời khỏi người bệnh và không thêm đại từ sở hữu vốn không có trong tiếng Hy Lạp.
- source_word: τά τε πνεύματα τὰ πονηρὰ ἐκπορεύεσθαι
  choice: các tà linh cũng ra khỏi họ
  rationale: “Tà linh” là cách nói quen thuộc, trang trọng cho các thần linh ác; bổ sung “khỏi họ” theo ngữ cảnh để câu tiếng Việt rõ nghĩa.
theological_decisions:
- issue: Bản chất của việc chữa bệnh và trừ tà qua những mảnh vải từ Phao-lô
  choice: Thuật lại trực tiếp sự kiện siêu nhiên như văn bản kể, không giải thích cơ chế.
  alternative: Diễn giải theo hướng tôn kính thánh tích hoặc giảm nhẹ sự kiện thành biểu tượng.
  rationale: Lu-ca trình bày đây là kết quả của những phép lạ phi thường; bản dịch không nên nhập vào các quan niệm giáo phái về thánh tích hay hợp lý hóa lời kể.
translation_notes:
  register: 'Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc được điều chỉnh tự nhiên cho tiếng Việt nhưng vẫn giữ chuỗi kết quả: vật dụng được mang đến, bệnh tật lìa khỏi người bệnh, và tà linh ra khỏi họ.'
