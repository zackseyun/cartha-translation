  source_fidelity: Bản nháp giữ đúng chuỗi kết quả của ὥστε và truyền đạt đúng việc bệnh tật cùng các tà linh rời khỏi người bệnh. Tuy nhiên, cụm “đã chạm vào da ông” biến giới từ ἀπό (“từ”) thành một mệnh đề quan hệ nói rõ đồ vật “đã chạm”, thêm một khẳng định không được phát biểu theo cách đó trong bản Hy Lạp. Nên dịch là đồ vật được mang “từ thân thể ông,” và chú thích nghĩa đen của χρώς là “da.”
  naturalness: “Từ thân thể ông ... được mang đến cho những người đau yếu” tự nhiên và rõ hơn “đã chạm vào da ông,” đồng thời vẫn giữ văn phong kể chuyện trang trọng, hiện đại. “Tà linh” phù hợp với cách dùng Kinh Thánh tiếng Việt hiện đại.
  terminology: Giữ “khăn tay,” “tạp dề lao động,” “bệnh tật,” và “tà linh” là những tương đương phù hợp. “Thân thể” là cách diễn đạt tự nhiên trong văn cảnh cho χρώς; chú thích bảo toàn sắc thái nghĩa đen là bề mặt thân thể/da.
