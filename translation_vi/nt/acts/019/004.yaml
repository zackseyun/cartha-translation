- from: 'Phao-lô nói: “Giăng đã làm phép báp-têm[a] về sự ăn năn, và bảo dân chúng tin vào Đấng đến sau ông, tức là tin vào Đức Chúa Jêsus.”'
  to: 'Phao-lô nói: “Giăng đã làm phép báp-têm[a] về sự ăn năn, bảo dân chúng tin vào Đấng đến sau ông, tức là vào Giê-su.”'
  rationale: 'Bản chỉnh giữ nguyên ý nghĩa và quan hệ cú pháp của câu: Giăng làm phép báp-têm về sự ăn năn, đồng thời bảo dân chúng tin vào Đấng đến sau mình. Cụm “tức là vào Giê-su” tiếp tục động từ “tin” được hiểu từ mệnh đề trước, sát với εἰς τὸν Ἰησοῦν. Tước hiệu không có trong nguyên văn được loại bỏ, và tên riêng được hiện đại hóa.'
  reviewer_model: gpt-5.6-terra
