  text: εἶπεν δὲ Παῦλος· ⸀Ἰωάννης ἐβάπτισεν βάπτισμα μετανοίας, τῷ λαῷ λέγων εἰς τὸν ἐρχόμενον μετ’ αὐτὸν ἵνα πιστεύσωσιν, τοῦτ’ ἔστιν εἰς ⸀τὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/004.yaml
  text: And Paul said[a], “John baptized with a baptism of repentance, telling the people to believe in the one coming after him—that is, in Jesus.”
translation:
  language: vi
  text: 'Phao-lô nói: “Giăng đã làm phép báp-têm[a] về sự ăn năn, bảo dân chúng tin vào Đấng đến sau ông, tức là vào Giê-su.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát nghĩa: “Giăng đã báp-têm một phép báp-têm về sự ăn năn.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐβάπτισεν βάπτισμα μετανοίας
  choice: đã làm phép báp-têm về sự ăn năn
  rationale: Diễn đạt tự nhiên trong tiếng Việt mà vẫn giữ rõ đặc tính của phép báp-têm là gắn với sự ăn năn. Chú thích bảo lưu cấu trúc đồng căn trang trọng hơn của nguyên văn.
- source_word: τῷ λαῷ
  choice: dân chúng
  rationale: Chỉ tập thể người nghe nói chung; không thêm nghĩa cụ thể là dân Y-sơ-ra-ên khi câu Hy Lạp không nói rõ.
- source_word: λέγων
  choice: và bảo
  rationale: Phân từ diễn tả lời Giăng nói trong khi thi hành phép báp-têm; cách nối này tự nhiên và vẫn phân biệt hành động làm phép báp-têm với lời kêu gọi tin.
- source_word: εἰς τὸν ἐρχόμενον μετ’ αὐτὸν
  choice: tin vào Đấng đến sau ông
  rationale: Với πιστεύω, εἰς chỉ đối tượng của đức tin; ἐρχόμενον và μετ’ αὐτόν diễn tả người đến tiếp sau Giăng.
- source_word: ἵνα πιστεύσωσιν
  choice: bảo dân chúng tin
  rationale: Sau động từ nói, ἵνα có thể nêu nội dung hay mục đích của lời nói; cách dịch này gọn, tự nhiên và không ép phải chọn riêng một sắc thái.
- source_word: τοῦτ’ ἔστιν
  choice: tức là
  rationale: Công thức giải thích trực tiếp, xác định Đấng đến sau Giăng là Đức Chúa Jêsus.
- source_word: εἰς τὸν Ἰησοῦν
  choice: tin vào Đức Chúa Jêsus
  rationale: Động từ 'tin' được hiểu tiếp từ mệnh đề trước. Không thêm tước hiệu 'Đấng Christ' vì nguyên văn chỉ có tên Ἰησοῦν.
theological_decisions:
- issue: Mối liên hệ giữa phép báp-têm của Giăng và đức tin nơi Đức Chúa Jêsus
  choice: Phép báp-têm của Giăng được mô tả là gắn với sự ăn năn, đồng thời Giăng kêu gọi dân chúng tin vào Đấng đến sau mình, tức Đức Chúa Jêsus.
  alternative: Hiểu rằng chính phép báp-têm của Giăng tạo ra đức tin Cơ Đốc, hoặc để Đấng đến sau Giăng không được xác định.
  rationale: Cú pháp phân biệt việc Giăng làm phép báp-têm với lời ông nói, còn cụm giải thích cuối câu xác định rõ Đấng đến sau là Đức Chúa Jêsus. Bản dịch không thêm một cơ chế thần học mà câu này không khẳng định.
translation_notes:
  register: 'Văn phong hiện đại, trang trọng và dễ hiểu. Dùng cách viết tên quen thuộc trong truyền thống Kinh Thánh tiếng Việt: Phao-lô, Giăng, Đức Chúa Jêsus; giữ thuật ngữ “phép báp-têm” để nhận diện khái niệm tôn giáo mà không diễn giải thêm.'
