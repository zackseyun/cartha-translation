  terminology: Dùng “A-tê-mi” là dạng phiên âm Việt ngữ thông dụng và dễ nhận diện hơn “Ác-tê-mi.” “Đền thờ bằng bạc” giữ nghĩa cơ bản của ναούς; chú thích bảo lưu khả năng đây là các vật phẩm hoặc mô hình thu nhỏ, không khẳng định hình thức chính xác.
  issues:
