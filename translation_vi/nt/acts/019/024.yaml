  - severity: low
    issue: “những đền thờ nhỏ” đưa yếu tố “nhỏ” vào bản văn.
    rationale: Bối cảnh khiến vật phẩm thu nhỏ là khả năng mạnh, nhưng ναούς tự nó không nêu kích thước. Chi tiết này nên thuộc chú thích để không vượt quá điều văn bản xác định.
  - severity: low
    issue: Dạng tên “Ác-tê-mi” không phải dạng phiên âm Việt ngữ thông dụng nhất.
    rationale: “A-tê-mi” là dạng hiện hành, tự nhiên hơn trong tiếng Việt đối với Artemis.
