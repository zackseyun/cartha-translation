source:
  edition: SBLGNT
  text: Δημήτριος γάρ τις ὀνόματι, ἀργυροκόπος, ποιῶν ναοὺς ἀργυροῦς Ἀρτέμιδος παρείχετο τοῖς τεχνίταις ⸂οὐκ ὀλίγην ἐργασίαν⸃,
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/024.yaml
  text: For a certain man named Demetrius[a], a silversmith who made silver shrines of Artemis[b], was providing the craftsmen with no small business.
translation:
  language: vi
  text: Vì có một người tên là Đê-mê-triu, một thợ bạc chuyên làm những đền thờ bằng bạc của A-tê-mi[a], đem lại cho các thợ thủ công không ít việc làm ăn[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cụm từ Hy Lạp cũng có thể dịch là “những điện thờ bằng bạc của A-tê-mi” hoặc “những mô hình bằng bạc của đền thờ A-tê-mi”. Từ naous (“đền thờ/nơi thánh”) trong bối cảnh này có lẽ chỉ những vật phẩm nhỏ được chế tác liên quan đến việc thờ A-tê-mi.
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn Hy Lạp là “không ít công việc/việc làm ăn”, một lối nói giảm, hàm ý hoạt động kinh doanh hoặc lợi tức đáng kể.
    reason: lexical_alternative
lexical_decisions:
- source_word: γάρ
  choice: Vì
  rationale: Giữ chức năng giải thích và cung cấp bối cảnh cho diễn biến ngay trước đó.
- source_word: Δημήτριος τις ὀνόματι
  choice: có một người tên là Đê-mê-triu
  rationale: Diễn đạt tự nhiên cách giới thiệu một nhân vật cụ thể nhưng trước đó chưa được nhắc đến; tên riêng được phiên âm từ tiếng Hy Lạp.
- source_word: ἀργυροκόπος
  choice: làm nghề thợ bạc
  rationale: Chỉ người thợ chuyên chế tác đồ bằng bạc; cách nói này rõ nghĩa và tự nhiên trong tiếng Việt hiện đại.
- source_word: ποιῶν ναοὺς ἀργυροῦς Ἀρτέμιδος
  choice: chuyên chế tác những đền thờ nhỏ bằng bạc của nữ thần Ác-tê-mi
  rationale: ναός vốn chỉ đền hay nơi thánh; trong bối cảnh buôn bán, nhiều khả năng là các vật phẩm thu nhỏ gắn với việc thờ Ác-tê-mi. Thêm “nhỏ” để truyền đạt quy mô hàm ẩn của đồ thủ công nhưng ghi chú vẫn bảo lưu các khả năng về hình thức chính xác.
- source_word: παρείχετο
  choice: đã đem lại
  rationale: Truyền đạt hành động thường xuyên hoặc kéo dài trong quá khứ của thể chưa hoàn thành, đồng thời hợp tự nhiên với bổ ngữ kinh tế.
- source_word: τοῖς τεχνίταις
  choice: cho các thợ thủ công
  rationale: Chỉ những lao động có tay nghề trong ngành chế tác này.
- source_word: οὐκ ὀλίγην ἐργασίαν
  choice: một nguồn lợi không nhỏ
  rationale: Giữ lối nói giảm bằng phủ định của nguyên văn; ἐργασία trong ngữ cảnh có thể bao hàm công việc, hoạt động kinh doanh hoặc lợi tức.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng dễ hiểu. Dùng “Đê-mê-triu” và “Ác-tê-mi” theo lối phiên âm quen thuộc trong tiếng Việt; giữ liên từ “Vì” và lối nói giảm “không nhỏ” để phản ánh cấu trúc cùng sắc thái của nguyên văn.
