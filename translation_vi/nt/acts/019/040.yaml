id: ACT.19.40
reference: Acts 19:40
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ γὰρ κινδυνεύομεν ἐγκαλεῖσθαι στάσεως περὶ τῆς σήμερον μηδενὸς αἰτίου ὑπάρχοντος περὶ οὗ οὐ δυνησόμεθα ⸀ἀποδοῦναι λόγον ⸀περὶ τῆς συστροφῆς ταύτης. καὶ ταῦτα εἰπὼν ἀπέλυσεν τὴν ἐκκλησίαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/040.yaml
  text: For indeed we are in danger of being charged with rioting over what happened today[a], since there is no cause for it, and we will not be able to give an account for this commotion. And after saying these things[c][b], he dismissed the assembly.
translation:
  language: vi
  text: “Thật vậy, chúng ta có nguy cơ bị buộc tội bạo loạn[a] vì sự việc hôm nay, bởi không có căn cứ nào cho việc này, và chúng ta sẽ không thể giải trình về cuộc tụ tập náo loạn này[b].” Nói xong những lời ấy, ông giải tán hội chúng[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “phản loạn” hoặc “nổi dậy”; từ Hy Lạp có thể chỉ một cuộc nổi dậy dân sự nghiêm trọng, nhưng trong ngữ cảnh trực tiếp này, “bạo loạn” phù hợp hơn với vụ náo động công cộng.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “vụ náo động” hoặc “đám đông hỗn loạn”; từ Hy Lạp chỉ cuộc tụ tập gây náo loạn này và khác với từ trang trọng hơn được dịch là “hội chúng” ở cuối câu.
    reason: lexical_alternative
  - marker: c
    text: Từ được dịch là “hội chúng” cũng là từ Hy Lạp thường được dùng ở những chỗ khác để chỉ “Hội Thánh”; tại đây, từ ấy chỉ hội chúng dân sự tại Ê-phê-sô.
    reason: cross_reference
lexical_decisions:
- source_word: κινδυνεύομεν
  choice: chúng ta có nguy cơ
  rationale: Diễn đạt tự nhiên trạng thái nguy hiểm đang hiện hữu của động từ chỉ định hiện tại.
- source_word: ἐγκαλεῖσθαι
  choice: bị cáo buộc
  rationale: Giữ sắc thái pháp lý của động từ trong lời cảnh báo về trách nhiệm trước nhà chức trách.
- source_word: στάσεως
  choice: là gây bạo loạn
  rationale: Phản ánh một vụ rối loạn dân sự nghiêm trọng trong bối cảnh công cộng, nhưng không mặc nhiên nâng mức nghĩa thành khởi nghĩa chính trị.
- source_word: περὶ τῆς σήμερον
  choice: vì sự việc hôm nay
  rationale: Chuyển ngữ thành ngữ, làm rõ rằng lời cảnh báo liên quan đến biến cố xảy ra trong ngày hôm ấy.
- source_word: μηδενὸς αἰτίου ὑπάρχοντος
  choice: bởi không có lý do chính đáng nào cho việc này
  rationale: Thể hiện kết cấu tuyệt đối sở hữu cách và sắc thái không có căn cứ có thể biện minh.
- source_word: ἀποδοῦναι λόγον
  choice: giải trình
  rationale: Từ ngữ Việt tự nhiên trong bối cảnh phải đưa ra lời giải thích hoặc chịu trách nhiệm trước thẩm quyền.
- source_word: συστροφῆς
  choice: vụ tụ tập náo loạn
  rationale: Giữ cả ý đám người tụ lại và tính hỗn loạn, đồng thời phân biệt với ἐκκλησία ở cuối câu.
- source_word: ἐκκλησίαν
  choice: hội chúng
  rationale: Giữ ý một tập thể được triệu tập; trong ngữ cảnh này đó là hội chúng dân sự tại Ê-phê-sô, không phải Hội Thánh.
- source_word: ἀπέλυσεν
  choice: giải tán
  rationale: Cách nói tự nhiên khi một người có thẩm quyền chấm dứt và cho một cuộc hội họp ra về.
- source_word: καὶ γὰρ
  choice: Thật vậy
  rationale: Truyền đạt sức nhấn mạnh và tác dụng nêu thêm lý do trong mạch lời nói tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Lời viên thư ký thành phố mang sắc thái pháp lý qua các cụm “bị cáo buộc”, “lý do chính đáng” và “giải trình”. Dùng “vụ tụ tập náo loạn” cho συστροφή và “hội chúng” cho ἐκκλησία để bảo toàn sự phân biệt từ vựng trong nguyên bản.
