id: ACT.19.9
reference: Acts 19:9
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὡς δέ τινες ἐσκληρύνοντο καὶ ἠπείθουν κακολογοῦντες τὴν ὁδὸν ἐνώπιον τοῦ πλήθους, ἀποστὰς ἀπ’ αὐτῶν ἀφώρισεν τοὺς μαθητάς, καθ’ ἡμέραν διαλεγόμενος ἐν τῇ σχολῇ ⸀Τυράννου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/009.yaml
  text: But when some became hardened and disobedient[a], speaking evil of the Way before the crowd, he withdrew from them and set apart the disciples[c][b], reasoning daily in the lecture hall of Tyrannus.
translation:
  language: vi
  text: Nhưng khi một số người cứ cứng lòng và không chịu vâng phục[a], lại phỉ báng Đạo[b] trước đám đông, ông rời khỏi họ, tách các môn đồ ra và hằng ngày biện luận tại giảng đường[c] của Ty-ra-nu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “không tin” hoặc “không chịu nghe theo.”
    reason: lexical_alternative
  - marker: b
    text: “Đạo” là một danh xưng thời kỳ đầu dành cho phong trào theo Chúa Giê-su trong sách Công Vụ.
    reason: cultural_note
  - marker: c
    text: Cũng có thể dịch là “trường học.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσκληρύνοντο
  choice: cứ cứng lòng
  rationale: Thể chưa hoàn thành diễn tả tình trạng kháng cự tiếp diễn; “cứ cứng lòng” tự nhiên trong tiếng Việt và không quyết định rõ tác nhân làm lòng họ cứng lại.
- source_word: ἠπείθουν
  choice: không chịu vâng phục
  rationale: ἀπειθέω có thể mang nghĩa không tin, không chịu được thuyết phục hoặc không vâng phục. Cách dịch này giữ sắc thái ý chí và đạo đức của sự kháng cự, còn các khả năng khác được ghi ở chú thích.
- source_word: κακολογοῦντες
  choice: nói xấu
  rationale: Diễn đạt lời nói công khai mang tính thù nghịch mà không thu hẹp nghĩa thành vu khống theo nghĩa pháp lý.
- source_word: τὴν ὁδὸν
  choice: Đạo
  rationale: Trong sách Công Vụ, cụm từ này được dùng như một tên gọi của phong trào theo Chúa Giê-su. “Đạo” là cách gọi ngắn gọn, tự nhiên trong tiếng Việt và giữ được tính danh xưng.
- source_word: ἐνώπιον τοῦ πλήθους
  choice: trước đám đông
  rationale: Truyền đạt rõ bối cảnh phản đối công khai bằng lối nói tự nhiên hiện nay.
- source_word: ἀποστὰς ἀπ’ αὐτῶν
  choice: ông lìa họ
  rationale: Diễn tả hành động dứt khoát của Phao-lô rời khỏi nhóm chống đối, đồng thời giữ lối kể cô đọng của nguyên văn.
- source_word: ἀφώρισεν τοὺς μαθητάς
  choice: tách các môn đồ ra
  rationale: Thể hiện việc Phao-lô chủ động phân tách các môn đồ khỏi nhóm chống đối mà không thêm mục đích không được nêu trong câu.
- source_word: καθ’ ἡμέραν
  choice: hằng ngày
  rationale: Diễn tả hoạt động đều đặn mỗi ngày một cách gọn và tự nhiên.
- source_word: διαλεγόμενος
  choice: biện luận
  rationale: Trong Công Vụ, động từ thường chỉ việc trình bày và trao đổi lý lẽ nhằm thuyết phục; “biện luận” giữ được sắc thái lý luận mà không nhất thiết hàm ý tranh cãi gay gắt.
- source_word: σχολῇ
  choice: giảng đường
  rationale: Trong bối cảnh này, σχολή có thể là trường học hoặc phòng dùng để giảng dạy. “Giảng đường” giúp độc giả hiện đại hình dung một địa điểm thuyết giảng mà không đồng nhất nó với một trường học hiện đại.
- source_word: Τυράννου
  choice: Ty-ra-nu
  rationale: Phiên âm tên riêng Hy Lạp sang dạng dễ đọc đối với người Việt.
theological_decisions:
- issue: Cách hiểu τὴν ὁδὸν như một danh xưng
  choice: Viết “Đạo” hoa, chỉ phong trào theo Chúa Giê-su
  alternative: “con đường” hoặc “đường lối” theo nghĩa thông thường
  rationale: Trong Công Vụ, biểu thức này hoạt động như một danh xưng đã được nhận biết dành cho cộng đồng và phong trào theo Chúa Giê-su; viết hoa giúp thể hiện chức năng ấy mà không thêm nội dung giáo phái.
- issue: Sắc thái của ἠπείθουν
  choice: không chịu vâng phục
  alternative: không tin hoặc không chịu nghe theo
  rationale: Từ Hy Lạp chứa cả chiều kích không tin và không vâng phục. Bản dịch chính giữ sắc thái ý chí-đạo đức, còn chú thích bảo tồn các khả năng từ vựng khác.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. Câu giữ nhịp kể liền mạch của nguyên văn; “cứ cứng lòng” thể hiện tiến trình tiếp diễn, còn “lìa họ” và “tách các môn đồ ra” thể hiện bước chuyển dứt khoát. Các thuật ngữ “môn đồ,” “Đạo” và “biện luận” được giữ vì quen thuộc trong văn cảnh Kinh Thánh Việt ngữ mà vẫn rõ nghĩa.
