  source_fidelity: 'Bản dịch theo sát cấu trúc và nội dung Hy Lạp: sự cứng lòng/kháng cự kéo dài, việc công khai chống đối Đạo, Phao-lô rời nhóm ấy, tách các môn đồ, rồi hằng ngày diễn giảng tại σχολή của Ty-ra-nu. Tuy nhiên, “nói xấu” thường chỉ lời chê bai hoặc nói không tốt và có thể nhẹ hơn κακολογοῦντες, vốn chỉ lời lẽ công kích, phỉ báng công khai.'
