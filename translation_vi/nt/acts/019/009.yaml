  terminology: “Đạo” viết hoa thích hợp với τὴν ὁδὸν như danh xưng trong Công Vụ. “Môn đồ,” “biện luận,” và tên Ty-ra-nu đều có thể chấp nhận trong văn phong Kinh Thánh Việt ngữ hiện đại. Chú thích về ἠπείθουν và σχολή giữ được các khả năng từ vựng chính.
