  source_fidelity: 'Bản dịch phản ánh đúng cấu trúc và ý chính của câu Hy Lạp: ý định của Phao-lô (βουλομένου), hành động đi vào giữa một nhóm công cộng (εἰσελθεῖν εἰς τὸν δῆμον), và sự ngăn cản kéo dài/kiên quyết của các môn đồ (οὐκ εἴων). “Đám đông đang tụ họp” là một cách hiểu hợp lý trong ngữ cảnh, trong khi chú thích bảo lưu nghĩa khả dĩ là một hội đồng/cộng đồng công dân tập hợp.'
