  text: ⸂Παύλου δὲ⸃ βουλομένου εἰσελθεῖν εἰς τὸν δῆμον οὐκ εἴων αὐτὸν οἱ μαθηταί·
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/030.yaml
  text: But when Paul wanted to go in among the assembly[a], the disciples would not let him.
translation:
  language: vi
  text: Nhưng khi Phao-lô muốn đi vào giữa đám đông đang tụ họp[a], các môn đồ không cho ông vào.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “đi vào cuộc hội họp” hoặc “đi vào giữa dân chúng.” Từ Hy Lạp δῆμος có thể chỉ dân chúng đang tụ tập hoặc đoàn thể công dân nhóm họp trong bối cảnh đô thị này.
    reason: lexical_alternative
lexical_decisions:
- source_word: Παύλου
  choice: Phao-lô
  rationale: Dùng dạng phiên âm quen thuộc trong tiếng Việt cho tên riêng Παῦλος.
- source_word: δὲ
  choice: Nhưng
  rationale: Diễn đạt sắc thái chuyển ý có phần tương phản của δέ trong mạch kể.
- source_word: βουλομένου
  choice: khi ... muốn
  rationale: Thể hiện tự nhiên kết cấu sở hữu cách tuyệt đối và ý định của Phao-lô.
- source_word: εἰσελθεῖν εἰς τὸν δῆμον
  choice: đi vào giữa đám đông đang tụ họp
  rationale: εἰσελθεῖν chỉ hành động đi vào; δῆμος ở bối cảnh nhà hát Ê-phê-sô có thể chỉ dân chúng tụ tập hoặc một cuộc hội họp công cộng. Cách dịch này tự nhiên và giữ được nét nghĩa tập thể mà không khẳng định đây là hội nghị hợp pháp.
- source_word: οὐκ εἴων
  choice: không cho ... vào
  rationale: Diễn đạt sự ngăn cản hoặc không cho phép đang diễn ra của động từ ở thì chưa hoàn thành.
- source_word: οἱ μαθηταί
  choice: các môn đồ
  rationale: Giữ nghĩa người học và người đi theo của μαθηταί, không thêm quan hệ sở hữu không có trong nguyên văn.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. “Đám đông đang tụ họp” giữ sự nhập nhằng của δῆμος giữa đám dân chúng và cuộc hội họp công cộng; chú thích nêu các khả năng khác.
