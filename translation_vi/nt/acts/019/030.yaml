  terminology: “Phao-lô” và “các môn đồ” là các cách dùng quen thuộc, phù hợp với tiếng Việt Kinh Thánh. Chú thích xử lý thận trọng thuật ngữ δῆμος, không áp đặt rằng đây chắc chắn là một hội nghị chính thức hay chỉ là một đám đông vô tổ chức.
