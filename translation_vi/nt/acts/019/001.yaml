id: ACT.19.1
reference: Acts 19:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἐγένετο δὲ ἐν τῷ τὸν Ἀπολλῶ εἶναι ἐν Κορίνθῳ Παῦλον διελθόντα τὰ ἀνωτερικὰ μέρη ⸀ἐλθεῖν εἰς Ἔφεσον καὶ ⸀εὑρεῖν τινας μαθητάς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/001.yaml
  text: It happened that while Apollos was in Corinth[a], Paul passed through the inland regions and came to Ephesus and found some disciples[b],
translation:
  language: vi
  text: Trong khi A-pô-lô ở Cô-rinh-tô, Phao-lô đi qua các vùng nội địa[a], đến Ê-phê-sô và gặp một số môn đồ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “các vùng phía trên” hoặc “các vùng cao”; cụm từ này có lẽ chỉ tuyến đường nội địa qua vùng cao, thay vì đường ven biển.
    reason: lexical_alternative
  - marker: b
    text: Ở đây nguyên văn không nói rõ họ là môn đồ của ai; các câu tiếp theo cho biết họ có liên hệ với phép báp-têm của Giăng.
    reason: cross_reference
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: Trong khi...
  rationale: Công thức chuyển tiếp tường thuật được diễn đạt tự nhiên qua cấu trúc thời gian của câu tiếng Việt; không thêm “bấy giờ” vì nguyên văn không có từ chỉ thời gian tương ứng và cách dịch sát “việc xảy ra là” thiếu tự nhiên.
- source_word: ἐν τῷ τὸν Ἀπολλῶ εἶναι ἐν Κορίνθῳ
  choice: Trong khi A-pô-lô ở Cô-rinh-tô
  rationale: Cấu trúc ἐν τῷ với động từ nguyên mẫu biểu thị hai sự việc đồng thời; “trong khi” chuyển tải rõ và tự nhiên.
- source_word: διελθόντα τὰ ἀνωτερικὰ μέρη
  choice: đi qua các vùng nội địa
  rationale: Phân từ διελθόντα chỉ hành trình xuyên qua trước khi đến Ê-phê-sô. ἀνωτερικά có nghĩa đen là “phía trên/cao hơn”, nhưng trong địa lý ở đây nhiều khả năng chỉ tuyến nội địa hoặc vùng cao, đối lập với tuyến ven biển.
- source_word: ἐλθεῖν εἰς Ἔφεσον
  choice: đến Ê-phê-sô
  rationale: Diễn đạt trực tiếp chuyển động hướng tới thành phố, phù hợp cú pháp và văn phong tiếng Việt.
- source_word: καὶ εὑρεῖν
  choice: và gặp
  rationale: εὑρίσκω có thể là “tìm thấy” hoặc “gặp”; trong ngữ cảnh gặp người tại một nơi, “gặp” tự nhiên mà không hàm ý Phao-lô chủ ý tìm kiếm họ.
- source_word: τινας μαθητάς
  choice: một số môn đồ
  rationale: τινας mang nghĩa bất định “một số”; μαθητάς được giữ là “môn đồ”, không tự ý xác định họ là môn đồ của Chúa Giê-su hay của Giăng.
theological_decisions:
- issue: Danh tính của τινας μαθητάς
  choice: một số môn đồ
  alternative: một số môn đồ của Giăng; một số môn đồ của Chúa Giê-su
  rationale: Câu Hy Lạp không nói rõ họ là môn đồ của ai. Các câu tiếp theo cho biết họ liên hệ với phép báp-têm của Giăng, nhưng bản dịch câu này không nên giải quyết trước sự mơ hồ mà Lu-ca chủ ý để lại.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng cách phiên âm tên riêng quen thuộc trong truyền thống Kinh Thánh tiếng Việt; giữ câu văn gọn và mạch lạc.
