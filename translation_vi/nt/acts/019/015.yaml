  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀποκριθὲν δὲ τὸ πνεῦμα τὸ πονηρὸν εἶπεν ⸀αὐτοῖς· ⸀Τὸν Ἰησοῦν γινώσκω καὶ τὸν Παῦλον ἐπίσταμαι, ὑμεῖς δὲ τίνες ἐστέ;
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/015.yaml
  text: But the evil spirit answered them[a], “Jesus I know, and Paul I recognize—but who are you?”
translation:
  language: vi
  text: 'Nhưng ác linh đáp lại họ: “Giê-su thì ta biết, Phao-lô thì ta cũng biết đến[a]; còn các ngươi là ai?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Giê-su thì ta biết, còn Phao-lô thì ta nhận ra.” Tiếng Hy Lạp dùng hai động từ khác nhau: γινώσκω (“biết”) và ἐπίσταμαι (“biết, biết đến, nhận biết”), có thể hàm ý một khác biệt về sắc thái.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθὲν ... εἶπεν αὐτοῖς
  choice: đáp lại họ
  rationale: Cấu trúc phân từ đi với động từ hữu hạn là một cách dẫn lời mang nghĩa đáp lại. Gộp thành “đáp lại họ” vừa tự nhiên trong tiếng Việt vừa giữ rõ đối tượng được nói đến.
- source_word: δὲ
  choice: Nhưng
  rationale: Liên từ đánh dấu bước chuyển có sắc thái tương phản giữa hành động của những người trừ quỷ và lời đáp của ác linh.
- source_word: τὸ πνεῦμα τὸ πονηρόν
  choice: ác linh
  rationale: Cụm từ chỉ một thực thể thuộc linh có tính ác. “Ác linh” là cách nói ngắn gọn, rõ nghĩa và quen thuộc trong tiếng Việt hiện đại.
- source_word: Τὸν Ἰησοῦν γινώσκω
  choice: Giê-su thì ta biết
  rationale: Đưa “Giê-su” lên đầu và dùng “thì” để phản ánh vị trí nhấn mạnh của tân ngữ trong tiếng Hy Lạp; “biết” là nghĩa trực tiếp, tự nhiên của γινώσκω ở đây.
- source_word: τὸν Παῦλον ἐπίσταμαι
  choice: Phao-lô thì ta cũng biết đến
  rationale: “Biết đến” giữ sự khác biệt với động từ γινώσκω trước đó mà không khẳng định quá mức về mức độ hay bản chất sự hiểu biết của ác linh.
- source_word: ὑμεῖς δὲ τίνες ἐστέ
  choice: còn các ngươi là ai?
  rationale: “Còn” thể hiện sự đối lập, “các ngươi” làm rõ đại từ số nhiều và duy trì giọng trực diện, thách thức của câu hỏi.
theological_decisions:
- issue: Sự phân biệt giữa γινώσκω và ἐπίσταμαι trong lời của ác linh
  choice: Dùng hai cách diễn đạt “biết” và “biết đến”
  alternative: Dịch cả hai động từ là “biết”, hoặc dịch ἐπίσταμαι là “nhận ra”
  rationale: Nguyên văn cố ý dùng hai động từ khác nhau. “Biết đến” bảo tồn một khác biệt sắc thái có thể có, nhưng không biến nó thành một tuyên bố giáo lý về hai cấp độ hiểu biết của ác linh.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “ta—các ngươi” phù hợp với lời đối đầu của ác linh và làm rõ rằng “you” trong nguyên văn là số nhiều. Cấu trúc “X thì...” giữ sự nhấn mạnh của trật tự từ Hy Lạp mà vẫn tự nhiên trong tiếng Việt.
