  text: εἶπέν ⸀τε· Εἰς τί οὖν ἐβαπτίσθητε; οἱ δὲ εἶπαν· Εἰς τὸ Ἰωάννου βάπτισμα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/003.yaml
  text: And he said[a], “Into what then were you baptized?” And they said, “Into John's baptism.”
translation:
  language: vi
  text: 'Ông nói: “Vậy, anh em đã chịu phép báp-têm vào điều gì?” Họ đáp: “Vào phép báp-têm của Giăng.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπέν τε
  choice: Ông nói
  rationale: λέγω mang nghĩa trực tiếp là “nói”; τε nối nhẹ câu này với mạch đối thoại trước đó. Tiếng Việt không cần dịch riêng liên từ ấy vì quan hệ nối tiếp đã rõ trong văn cảnh.
- source_word: Εἰς τί
  choice: vào điều gì
  rationale: Giữ nghĩa cơ bản của εἰς là “vào” và sự đối xứng với εἰς trong câu trả lời; thêm “điều” để câu hỏi tự nhiên, rõ nghĩa trong tiếng Việt.
- source_word: οὖν
  choice: Vậy
  rationale: οὖν đánh dấu bước suy luận từ lời đáp trước; “vậy” là cách diễn đạt tự nhiên trong hội thoại tiếng Việt.
- source_word: ἐβαπτίσθητε
  choice: anh em đã chịu phép báp-têm
  rationale: Thể bị động aorist được thể hiện bằng “đã chịu”; “anh em” diễn đạt ngôi thứ hai số nhiều. “Phép báp-têm” là thuật ngữ quen thuộc, trực tiếp chỉ nghi thức trong văn cảnh.
- source_word: Εἰς τὸ Ἰωάννου βάπτισμα
  choice: Vào phép báp-têm của Giăng
  rationale: 'Lặp lại “vào” để bảo toàn cấu trúc song song của nguyên văn: “vào điều gì?” / “vào phép báp-têm của Giăng.” Sở hữu cách Ἰωάννου được dịch tự nhiên là “của Giăng.”'
- source_word: βάπτισμα
  choice: phép báp-têm
  rationale: Đây là cách gọi đã định hình và dễ hiểu đối với nghi thức được gắn với Giăng, tránh diễn giải thành một nghi lễ thanh tẩy nói chung.
theological_decisions:
- issue: Có giữ giới từ εἰς lặp lại trong câu hỏi và câu trả lời hay không
  choice: Dịch cả hai lần là “vào”
  alternative: 'Dịch theo lối thuần thành ngữ: “Anh em đã chịu phép báp-têm nào?” / “Phép báp-têm của Giăng.”'
  rationale: Giữ “vào” phản ánh sát nguyên văn và duy trì thế đối xứng tu từ mà không áp đặt một cách giải thích giáo phái về ý nghĩa của phép báp-têm.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Giăng” theo cách phiên âm Kinh Thánh quen thuộc trong tiếng Việt. Không thêm đại từ chỉ rõ người nói là Phao-lô vì câu riêng lẻ của nguyên văn chỉ dùng động từ ngôi thứ ba; “ông” giữ liên kết với chủ thể trong văn cảnh.
