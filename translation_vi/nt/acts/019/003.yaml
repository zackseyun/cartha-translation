  source_fidelity: 'Bản dịch phản ánh đúng các yếu tố chính của SBLGNT: εἶπέν τε là “Ông nói” trong mạch văn; οὖν là “Vậy”; thể bị động aorist ἐβαπτίσθητε là “đã chịu phép báp-têm”; và đặc biệt giữ được sự lặp lại, song song của εἰς: “vào điều gì?” / “Vào phép báp-têm của Giăng.” Không có thêm bớt ý nghĩa hay áp đặt cách hiểu thần học.'
