id: ACT.19.27
reference: Acts 19:27
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οὐ μόνον δὲ τοῦτο κινδυνεύει ἡμῖν τὸ μέρος εἰς ἀπελεγμὸν ἐλθεῖν, ἀλλὰ καὶ τὸ τῆς μεγάλης θεᾶς ⸂Ἀρτέμιδος ἱερὸν⸃ εἰς οὐθὲν λογισθῆναι, μέλλειν ⸀τε καὶ καθαιρεῖσθαι ⸂τῆς μεγαλειότητος⸃ αὐτῆς, ἣν ὅλη ἡ Ἀσία καὶ ἡ οἰκουμένη σέβεται.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/027.yaml
  text: And not only is this trade of ours in danger of coming into disrepute, but also the temple of the great goddess Artemis may be counted as nothing, and even her majesty—whom all Asia and the world worships—may be brought down.
translation:
  language: vi
  text: Không những nghề của chúng ta có nguy cơ bị mang tiếng, mà đền thờ nữ thần vĩ đại Artemis cũng có thể bị coi chẳng ra gì; hơn nữa, sự cao trọng của bà—vị mà cả tỉnh A-si-a và toàn thế giới[a] đều thờ phụng—cũng sắp bị hạ xuống[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “toàn thế giới có người ở”; từ Hy Lạp thường chỉ thế giới dân cư được biết đến, đặc biệt là thế giới rộng lớn dưới ảnh hưởng La Mã.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể hiểu là “vẻ huy hoàng của bà bị hạ xuống” hoặc “bà bị tước mất sự cao trọng.” Cách diễn đạt Hy Lạp nói đến uy thế, sự cao trọng hay vẻ huy hoàng của Artemis bị suy giảm.
    reason: lexical_alternative
lexical_decisions:
- source_word: κινδυνεύει
  choice: có nguy cơ
  rationale: Diễn đạt tự nhiên ý đang đứng trước một mối nguy, đồng thời chi phối các hậu quả được nêu tiếp theo.
- source_word: τὸ μέρος
  choice: nghề của chúng ta
  rationale: Trong ngữ cảnh, từ này chỉ phần việc hay ngành nghề của nhóm thợ thủ công, không phải một “phần” trừu tượng.
- source_word: εἰς ἀπελεγμὸν ἐλθεῖν
  choice: bị mang tiếng
  rationale: Cụm từ nói đến việc rơi vào tình trạng bị chê trách hoặc mất thanh danh; cách nói này tự nhiên trong tiếng Việt và phù hợp bối cảnh nghề nghiệp.
- source_word: ἱερὸν
  choice: đền thờ
  rationale: Chỉ khu thánh điện nổi tiếng của Artemis tại Ê-phê-sô; “đền thờ” rõ ràng và thông dụng.
- source_word: εἰς οὐθὲν λογισθῆναι
  choice: bị coi chẳng ra gì
  rationale: Giữ sắc thái mạnh của việc bị xem là không đáng kể, không có giá trị hay địa vị.
- source_word: μέλλειν τε καὶ καθαιρεῖσθαι
  choice: cũng sắp bị hạ xuống
  rationale: μέλλειν mang ý việc sắp xảy ra, còn καθαιρεῖσθαι chỉ sự bị kéo xuống hoặc tước khỏi địa vị cao; cách dịch giữ cấu trúc cô đọng và sắc thái cảnh báo.
- source_word: τῆς μεγαλειότητος αὐτῆς
  choice: uy danh của bà
  rationale: Trong lời Đê-mê-triu, cụm này nói đến sự cao trọng, vẻ huy hoàng và địa vị được tôn kính của Artemis; “uy danh” phù hợp với điều có thể bị hạ thấp.
- source_word: ὅλη ἡ Ἀσία
  choice: cả tỉnh Asia
  rationale: Ở đây Ἀσία chỉ tỉnh Asia thuộc La Mã, không phải toàn châu Á; thêm “tỉnh” giúp người đọc hiện đại hiểu đúng địa danh lịch sử.
- source_word: ἡ οἰκουμένη
  choice: toàn thế giới
  rationale: Chỉ thế giới có người ở, thường là thế giới rộng lớn được biết đến trong phạm vi La Mã; bản dịch chính dùng cách nói tự nhiên và chú thích giữ nghĩa hẹp hơn.
- source_word: σέβεται
  choice: thờ phụng
  rationale: Động từ diễn tả sự tôn kính mang tính tôn giáo đối với Artemis, nên “thờ phụng” phù hợp hơn một từ chỉ kính trọng thông thường.
theological_decisions:
- issue: Cách trình bày ngôn ngữ tôn giáo ngoại giáo trong lời Đê-mê-triu
  choice: nữ thần vĩ đại Artemis ... đấng mà ... đều thờ phụng
  alternative: cái gọi là nữ thần vĩ đại Artemis ... mà ... đều tôn kính
  rationale: Câu này thuật lại trực tiếp quan điểm của Đê-mê-triu. Bản dịch không thêm lời phủ định hay khoảng cách thần học vốn không có trong tiếng Hy Lạp, nhưng ngữ cảnh vẫn cho thấy đây là lời của nhân vật.
- issue: Quan hệ cú pháp của τῆς μεγαλειότητος với καθαιρεῖσθαι
  choice: uy danh của bà ... bị hạ xuống
  alternative: bà bị tước mất vẻ huy hoàng
  rationale: Cấu trúc Hy Lạp khó và có thể được hiểu theo hơn một cách. Cách chọn giữ hình ảnh “hạ xuống” và gắn sự suy giảm với uy danh/sự cao trọng, không diễn giải quá mức thành sự tiêu diệt chính nữ thần.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Giữ tên Artemis theo dạng quốc tế gần với nguyên ngữ; “tỉnh Asia” phân biệt tỉnh La Mã cổ với châu Á hiện đại. Đại từ “bà” phản ánh lời nói về một nữ thần ngoại giáo mà không hàm ý người dịch tán đồng lời xưng tụng.
