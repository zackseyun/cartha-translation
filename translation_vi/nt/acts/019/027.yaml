revisions:
- from: Không những nghề của chúng ta có nguy cơ bị mang tiếng, mà đền thờ nữ thần vĩ đại Artemis cũng có thể bị coi chẳng ra gì; hơn nữa, uy danh của bà—đấng mà cả tỉnh Asia và toàn thế giới[a] đều thờ phụng—cũng sắp bị hạ xuống[b].
  to: Không những nghề của chúng ta có nguy cơ bị mang tiếng, mà đền thờ nữ thần vĩ đại Artemis cũng có thể bị coi chẳng ra gì; hơn nữa, sự cao trọng của bà—vị mà cả tỉnh A-si-a và toàn thế giới[a] đều thờ phụng—cũng sắp bị hạ xuống[b].
  rationale: Sửa chính tả địa danh thành “A-si-a” để đạt tiếng Việt hiện đại nhất quán và làm rõ tỉnh La Mã. Thay “uy danh” bằng “sự cao trọng” để phản ánh rộng hơn μεγαλειότης và kết hợp tự nhiên với “bị hạ xuống.” Điều chỉnh đại từ quan hệ thành “vị mà” nhằm không thêm sắc thái tôn xưng vượt nguyên văn. Các chú thích được giữ nguyên neo a/b và cập nhật chú thích b cho khớp bản dịch.
