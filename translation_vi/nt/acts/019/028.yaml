  text: Ἀκούσαντες δὲ καὶ γενόμενοι πλήρεις θυμοῦ ἔκραζον λέγοντες· Μεγάλη ἡ Ἄρτεμις Ἐφεσίων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/028.yaml
  text: When they heard this and became full of wrath[a], they were crying out, saying, “Great is Artemis of the Ephesians!”
translation:
  language: vi
  text: 'Khi nghe điều ấy, họ trở nên đầy thịnh nộ[a] và liên tục hô lớn: “Vĩ đại thay Artemis của người Ê-phê-sô!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đầy giận dữ”, “đầy cuồng nộ”, hoặc “trở nên hết sức giận dữ”. Cụm từ Hy Lạp theo nghĩa sát là “trở nên đầy θυμός”, chỉ cơn giận dữ dội.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀκούσαντες
  choice: Khi nghe vậy
  rationale: Phân từ bất định quá khứ nêu hoàn cảnh xảy ra trước hành động chính; “vậy” diễn đạt tự nhiên đối tượng được hàm ý từ văn cảnh.
- source_word: δὲ
  choice: và
  rationale: δέ ở đây là liên từ chuyển tiếp nhẹ, nối phản ứng của đám đông với điều họ vừa nghe, không nhất thiết mang ý tương phản.
- source_word: γενόμενοι πλήρεις θυμοῦ
  choice: đầy cơn thịnh nộ
  rationale: Giữ hình ảnh “trở nên đầy” của nguyên ngữ ở mức tự nhiên trong tiếng Việt, đồng thời truyền đạt cường độ mạnh của θυμός.
- source_word: ἔκραζον
  choice: họ liên tục la lớn
  rationale: Thì chưa hoàn thành diễn tả tiếng hô đang tiếp diễn hoặc lặp lại; “liên tục la lớn” làm rõ sắc thái kéo dài ấy.
- source_word: λέγοντες
  choice: dấu hai chấm trước lời hô
  rationale: Trong tiếng Việt, nội dung của hành động la lớn được dẫn trực tiếp tự nhiên bằng dấu hai chấm, không cần thêm từ “rằng” hay “nói rằng”.
- source_word: Μεγάλη ἡ Ἄρτεμις Ἐφεσίων
  choice: Nữ thần Artemis của người Ê-phê-sô thật vĩ đại!
  rationale: Diễn đạt tự nhiên một câu tung hô, giữ quan hệ sở thuộc/liên hệ giữa Artemis và người Ê-phê-sô; thêm danh từ loại “Nữ thần” để độc giả Việt nhận biết tên riêng và vai trò của Artemis.
theological_decisions:
- issue: Trình bày lời tung hô một nữ thần ngoại giáo mà không biến nó thành lời xác nhận của người dịch
  choice: 'Đặt nguyên lời tung hô trong ngoặc kép như lời của đám đông: “Nữ thần Artemis của người Ê-phê-sô thật vĩ đại!”'
  alternative: “Artemis của người Ê-phê-sô thật vĩ đại!”
  rationale: Bản dịch giữ nguyên nội dung lời hô được thuật lại, không làm nhẹ tính thờ thần tượng và cũng không thêm lời phê phán thần học vào câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Thịnh nộ” truyền đạt cường độ mạnh của θυμός; “liên tục la lớn” thể hiện sắc thái tiếp diễn của động từ ở thì chưa hoàn thành. Tên Artemis được giữ theo dạng chuyển tự quốc tế, còn Ê-phê-sô theo cách phiên âm Kinh Thánh quen thuộc trong tiếng Việt.
