revisions:
- from: 'Khi nghe vậy và đầy cơn thịnh nộ[a], họ liên tục la lớn: “Nữ thần Artemis của người Ê-phê-sô thật vĩ đại!”'
  to: 'Khi nghe điều ấy, họ trở nên đầy thịnh nộ[a] và liên tục hô lớn: “Vĩ đại thay Artemis của người Ê-phê-sô!”'
  rationale: Bản sửa phục hồi sắc thái biến đổi trạng thái của γενόμενοι, giữ sắc thái kéo dài/lặp lại của ἔκραζον, và loại bỏ danh từ “Nữ thần” vốn không hiện diện trong nguyên văn. Câu tung hô được diễn đạt theo lối tự nhiên nhưng vẫn trang trọng, nhấn mạnh như trật tự từ Hy Lạp.
  reviewer_model: gpt-5.6-terra
