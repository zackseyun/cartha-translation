id: ACT.19.16
reference: Acts 19:16
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ⸀ἐφαλόμενος ⸂ὁ ἄνθρωπος ἐπ’ αὐτοὺς⸃ ἐν ᾧ ἦν τὸ πνεῦμα τὸ πονηρὸν ⸂κατακυριεύσας ἀμφοτέρων⸃ ἴσχυσεν κατ’ αὐτῶν, ὥστε γυμνοὺς καὶ τετραυματισμένους ἐκφυγεῖν ἐκ τοῦ οἴκου ἐκείνου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/016.yaml
  text: And the man in whom the evil spirit was leaped on them[a], and after overpowering both of them, prevailed against them[c][b], so that they fled out of that house naked and wounded.
translation:
  language: vi
  text: Người có tà linh ở trong mình liền nhảy xổ vào họ[a], chế ngự cả hai người[b] và thắng thế trước họ, đến nỗi họ trần truồng và bị thương chạy thoát khỏi căn nhà ấy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “lao vào họ” hoặc “vồ lấy họ.”'
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn Hy Lạp là “cả hai người.” Dù ngữ cảnh rộng hơn nhắc đến nhiều hơn hai con trai của Sê-va, câu này nói rõ “cả hai”, nên bản dịch giữ nguyên cách nói ấy.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐφαλόμενος
  choice: nhảy xổ vào
  rationale: Diễn tả một cú lao nhảy bất ngờ và dữ dội; cách nói tự nhiên trong tiếng Việt mà vẫn giữ hình ảnh sống động của động từ Hy Lạp.
- source_word: ὁ ἄνθρωπος
  choice: người
  rationale: Chỉ người đàn ông đã được nói đến trong ngữ cảnh; tiếng Việt không cần lặp từ chỉ giới tính khi nghĩa đã rõ.
- source_word: ἐν ᾧ ἦν τὸ πνεῦμα τὸ πονηρόν
  choice: có tà linh ở trong
  rationale: Giữ ý tà linh ở trong người ấy mà không đưa vào thuật ngữ kỹ thuật mạnh hơn nguyên văn.
- source_word: τὸ πνεῦμα τὸ πονηρόν
  choice: tà linh
  rationale: Cách diễn đạt rõ ràng, quen thuộc và trang trọng trong tiếng Việt cho một linh ác.
- source_word: κατακυριεύσας
  choice: chế ngự
  rationale: Truyền đạt việc giành quyền áp đảo và khống chế bằng sức mạnh, đồng thời phân biệt với động từ ἴσχυσεν theo sau.
- source_word: ἀμφοτέρων
  choice: cả hai người
  rationale: Giữ nguyên chi tiết chỉ hai người trong bản Hy Lạp, không làm phẳng sự căng thẳng với ngữ cảnh rộng hơn.
- source_word: ἴσχυσεν κατ’ αὐτῶν
  choice: thắng thế trên họ
  rationale: Thể hiện việc mạnh hơn và chiếm ưu thế đối với họ, không nhập nghĩa hoàn toàn vào 'chế ngự' ở vế trước.
- source_word: γυμνούς
  choice: trần truồng
  rationale: Phản ánh trực tiếp tình trạng không mặc quần áo mà nguyên văn nêu.
- source_word: τετραυματισμένους
  choice: bị thương
  rationale: Diễn đạt tình trạng đã chịu thương tích và vẫn mang thương tích khi bỏ chạy.
- source_word: ἐκφυγεῖν
  choice: chạy thoát
  rationale: Kết hợp ý bỏ chạy và thoát khỏi nơi ấy trong cấu trúc kết quả.
- source_word: ἐκ τοῦ οἴκου ἐκείνου
  choice: khỏi căn nhà ấy
  rationale: Diễn đạt tự nhiên sự rời khỏi chính căn nhà đã được nhắc đến.
theological_decisions:
- issue: Cách diễn đạt việc tà linh ở trong người
  choice: người có tà linh ở trong
  alternative: người bị tà linh ám
  rationale: Bản dịch giữ gần cấu trúc mô tả của nguyên văn, tránh áp đặt một thuật ngữ thần học kỹ thuật hơn.
- issue: Phạm vi của ἀμφοτέρων so với nhóm người trong ngữ cảnh
  choice: cả hai người
  alternative: tất cả họ
  rationale: Nguyên văn ghi rõ 'cả hai'; bản dịch bảo toàn chi tiết ấy và để ngỏ cách giải thích mối quan hệ của nó với nhóm đông hơn được nhắc trong ngữ cảnh.
translation_notes:
  register: Văn phong kể chuyện hiện đại, rõ ràng và trang trọng. Dùng “nhảy xổ vào” để giữ sức mạnh hình ảnh của hành động; “chạy thoát” tự nhiên hơn cách dịch sát chữ nhưng vụng về. Đại từ “hắn” giúp tránh lẫn chủ thể trong câu mà không mang thêm nội dung thần học.
