  to: Vậy, nếu Đê-mê-triu và những người thợ cùng ông ta có vụ kiện chống lại ai, thì các phiên tòa đang được mở, và có các tổng đốc[a]; họ hãy kiện nhau.
  rationale: Chỉ thay cụm diễn đạt khiếm tự nhiên “có điều gì khiếu kiện ai” bằng “có vụ kiện chống lại ai,” để phản ánh rõ thành ngữ pháp lý ἔχουσιν πρός τινα λόγον mà không thu hẹp tính bất định của τινα. Giữ nguyên các lựa chọn khác, gồm số nhiều “các tổng đốc” và chú thích giải thích nó.
