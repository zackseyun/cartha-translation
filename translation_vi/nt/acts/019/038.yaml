source:
  edition: SBLGNT
  text: εἰ μὲν οὖν Δημήτριος καὶ οἱ σὺν αὐτῷ τεχνῖται ἔχουσιν πρός τινα λόγον, ἀγοραῖοι ἄγονται καὶ ἀνθύπατοί εἰσιν, ἐγκαλείτωσαν ἀλλήλοις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/038.yaml
  text: If[a], then, Demetrius and the craftsmen with him have a complaint against anyone, court sessions are being held and there are proconsuls[b]; let them bring charges against one another.
translation:
  language: vi
  text: Vậy, nếu Đê-mê-triu và những người thợ cùng ông ta có vụ kiện chống lại ai, thì các phiên tòa đang được mở, và có các tổng đốc[a]; họ hãy kiện nhau.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “có các tổng đốc hiện diện/sẵn để xử.” Số nhiều trong tiếng Hy Lạp có thể nói khái quát về chức vụ hoặc cơ quan hành chính của tỉnh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ μὲν οὖν
  choice: Vậy, nếu
  rationale: Diễn đạt tự nhiên sắc thái suy luận và chuyển ý của οὖν; μέν được thể hiện nhẹ qua cấu trúc điều kiện, không gượng ép dịch riêng.
- source_word: Δημήτριος
  choice: Đê-mê-triu
  rationale: Phiên âm tên riêng theo lối quen thuộc trong tiếng Việt.
- source_word: οἱ σὺν αὐτῷ τεχνῖται
  choice: những người thợ cùng ông ta
  rationale: τεχνῖται chỉ những người thợ có tay nghề; cách dịch này tự nhiên và giữ nguyên quan hệ khái quát của σὺν αὐτῷ, không thêm ý rằng họ nhất thiết là đồng nghiệp.
- source_word: ἔχουσιν πρός τινα λόγον
  choice: có điều gì khiếu kiện ai
  rationale: Thành ngữ mang nghĩa pháp lý là có một vụ việc hay lời khiếu kiện chống lại người nào đó; cách diễn đạt này giữ được tính khái quát của τινα.
- source_word: ἀγοραῖοι ἄγονται
  choice: các phiên tòa đang được mở
  rationale: Cụm từ nói đến những phiên xét xử được triệu tập chính thức; giữ sắc thái bị động và phù hợp ngữ cảnh pháp lý.
- source_word: ἀνθύπατοί εἰσιν
  choice: có các tổng đốc
  rationale: ἀνθύπατοι là các quan chức La Mã đứng đầu tỉnh thuộc nguyên lão viện, thường được gọi là tổng đốc; giữ số nhiều của nguyên văn.
- source_word: ἐγκαλείτωσαν ἀλλήλοις
  choice: họ hãy kiện cáo nhau
  rationale: Động từ có nghĩa pháp lý là đưa lời buộc tội hoặc khởi kiện; đại từ tương hỗ được giữ bằng “nhau”, cho thấy các bên phải giải quyết qua thủ tục hợp pháp.
