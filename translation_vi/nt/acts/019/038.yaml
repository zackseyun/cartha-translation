  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng thuật ngữ pháp lý phổ thông “khiếu kiện”, “phiên tòa”, “kiện cáo”; giữ số nhiều bất thường nhưng có chủ ý của ἀνθύπατοι và giải thích bằng chú thích.
