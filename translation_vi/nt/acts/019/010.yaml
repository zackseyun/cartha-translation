id: ACT.19.10
reference: Acts 19:10
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τοῦτο δὲ ἐγένετο ἐπὶ ἔτη δύο, ὥστε πάντας τοὺς κατοικοῦντας τὴν Ἀσίαν ἀκοῦσαι τὸν λόγον τοῦ ⸀κυρίου, Ἰουδαίους τε καὶ Ἕλληνας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/010.yaml
  text: This continued for two years[a], so that all who lived in Asia heard the word of the Lord, both Jews and Greeks.
translation:
  language: vi
  text: Việc ấy tiếp diễn suốt hai năm, đến nỗi mọi người đang sống tại tỉnh A-si[a] đã nghe lời Chúa, cả người Do Thái lẫn người Hy Lạp.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A-si ở đây là tỉnh A-si của La Mã ở miền tây Tiểu Á, không phải châu Á theo nghĩa hiện đại.
    reason: cultural_note
lexical_decisions:
- source_word: τοῦτο δὲ ἐγένετο
  choice: Việc ấy tiếp diễn
  rationale: Cụm từ chỉ điều đã nói ở câu trước, tức việc Phao-lô giảng dạy hằng ngày; động từ ἐγένετο tự nó có thể là “xảy ra”, nhưng kết hợp với khoảng thời gian hai năm thì “tiếp diễn” diễn đạt tự nhiên ý hoạt động kéo dài.
- source_word: ἐπὶ ἔτη δύο
  choice: suốt hai năm
  rationale: ἐπί với đối cách chỉ khoảng thời gian; “suốt hai năm” diễn đạt rõ thời lượng trong tiếng Việt hiện đại.
- source_word: ὥστε
  choice: đến nỗi
  rationale: Giữ lực chỉ kết quả của ὥστε, nối kết việc giảng dạy kéo dài với kết quả là cư dân trong tỉnh được nghe.
- source_word: πάντας τοὺς κατοικοῦντας τὴν Ἀσίαν
  choice: tất cả những người sống trong tỉnh A-si
  rationale: Giữ phạm vi phổ quát của πάντας và nghĩa cư trú của κατοικοῦντας. Thêm danh từ loại “tỉnh” để người đọc Việt Nam không hiểu nhầm Ἀσία là toàn châu Á hiện đại; chú thích cung cấp bối cảnh chính xác hơn.
- source_word: ἀκοῦσαι
  choice: đều được nghe
  rationale: Động từ có nghĩa trực tiếp là “nghe”. Cách nói “được nghe” tự nhiên trong ngữ cảnh một thông điệp được truyền bá rộng rãi, không khẳng định rằng từng người trực tiếp nghe Phao-lô.
- source_word: τὸν λόγον
  choice: lời
  rationale: Giữ thuật ngữ lặp lại của Lu-ca dành cho sứ điệp được công bố, đồng thời tránh diễn giải hẹp hơn bằng cách thêm “Tin Lành”.
- source_word: τοῦ κυρίου
  choice: Chúa
  rationale: κύριος trong cụm sở hữu được dịch theo cách dùng Kinh Thánh quen thuộc và trang trọng là “Chúa”; cụm đầy đủ là “lời Chúa”.
- source_word: Ἰουδαίους τε καὶ Ἕλληνας
  choice: cả người Do Thái lẫn người Hy Lạp
  rationale: Diễn đạt tự nhiên cấu trúc liên kết τε καὶ và giữ nguyên hai nhóm được bản Hy Lạp nêu rõ.
theological_decisions:
- issue: Phạm vi địa lý của Ἀσία
  choice: Tỉnh A-si thuộc La Mã ở phía tây Tiểu Á
  alternative: Châu Á theo nghĩa lục địa hiện đại
  rationale: Trong bối cảnh Công Vụ, Ἀσία là tên một tỉnh của La Mã. Bản dịch dùng “tỉnh A-si” và chú thích để ngăn cách hiểu sai theo địa lý hiện đại.
- issue: Phạm vi của “tất cả”
  choice: Giữ nguyên cách nói phổ quát của bản văn
  alternative: Diễn giải là “rất nhiều người” hoặc “mọi tầng lớp cư dân”
  rationale: πάντας có nghĩa là “tất cả”; bản dịch không giảm nhẹ hay giải thích mức độ phổ quát mà Lu-ca chủ ý diễn đạt.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “A-si” để chỉ địa danh cổ, tránh đồng nhất với “châu Á”; câu giữ nhịp kể chuyện và quan hệ kết quả của nguyên văn.
