    issue: “đều được nghe” diễn đạt ἀκοῦσαι theo thể bị động.
    rationale: ἀκοῦσαι là bất định từ chủ động, với “mọi người đang sống tại A-si” là chủ thể ngữ nghĩa của hành động nghe. “Đã nghe” giữ trực tiếp hơn ý kết quả của nguyên văn, không hàm ý thêm về việc họ được trao cơ hội nghe.
