revisions:
- from: Việc ấy tiếp diễn suốt hai năm, đến nỗi tất cả những người sống trong tỉnh A-si[a] đều được nghe lời Chúa, cả người Do Thái lẫn người Hy Lạp.
  to: Việc ấy tiếp diễn suốt hai năm, đến nỗi mọi người đang sống tại tỉnh A-si[a] đã nghe lời Chúa, cả người Do Thái lẫn người Hy Lạp.
  rationale: Sửa “đều được nghe” thành “đã nghe” để phản ánh trực tiếp động từ chủ động ἀκοῦσαι. Điều chỉnh nhẹ cụm chỉ cư dân để câu tiếng Việt gọn và tự nhiên hơn, không thay đổi phạm vi phổ quát của πάντας. Chú thích được giữ lại, chỉ chuẩn hóa giới từ cho tự nhiên.
  reviewer_model: gpt-5.6-terra
