  - severity: medium
    issue: “truyền lệnh cho các ngươi” chưa phản ánh đầy đủ ὁρκίζω
    rationale: Động từ này là lời buộc/trấn áp long trọng, với Jêsus là Đấng được viện dẫn. “Lấy danh ... mà buộc các ngươi” giữ chức năng công thức tốt hơn mà không biến nó thành một mệnh lệnh thông thường.
