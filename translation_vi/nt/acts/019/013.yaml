language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐπεχείρησαν δέ τινες ⸀καὶ τῶν περιερχομένων Ἰουδαίων ἐξορκιστῶν ὀνομάζειν ἐπὶ τοὺς ἔχοντας τὰ πνεύματα τὰ πονηρὰ τὸ ὄνομα τοῦ κυρίου Ἰησοῦ λέγοντες· ⸀Ὁρκίζω ὑμᾶς τὸν Ἰησοῦν ⸀ὃν Παῦλος κηρύσσει.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/013.yaml
  text: But some also of the itinerant Jewish exorcists attempted to invoke the name of the Lord Jesus over those who had evil spirits[a], saying, “I adjure you by Jesus[d][c][b], whom Paul proclaims.”
translation:
  language: vi
  text: 'Nhưng một số người Do Thái trừ quỷ đi đây đó cũng thử gọi danh Chúa Jêsus trên những người có tà linh[a]. Họ nói: “Ta lấy danh Jêsus, Đấng mà Phao-lô rao giảng, mà buộc các ngươi[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “những người có các linh ác”; cũng có thể dịch: “những người bị tà linh ám.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch sát hơn: “Ta buộc các ngươi thề bởi Jêsus, Đấng mà Phao-lô rao giảng.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεχείρησαν
  choice: thử
  rationale: Diễn đạt hành động họ toan làm mà không hàm ý đã thành công; tự nhiên và sát nghĩa trong tiếng Việt hiện đại.
- source_word: τινες καὶ τῶν περιερχομένων Ἰουδαίων ἐξορκιστῶν
  choice: một số người Do Thái đi đây đó làm nghề trừ quỷ cũng
  rationale: Giữ τινες là “một số”, καὶ là “cũng”, περιερχομένων là đi từ nơi này sang nơi khác, và ἐξορκιστῶν là những người thực hành việc trừ quỷ. Cách diễn đạt này rõ hơn từ Hán-Việt chuyên môn “thầy trừ tà” và không gợi rằng họ nhất thiết thuộc một chức vụ chính thức.
- source_word: ὀνομάζειν ἐπὶ ... τὸ ὄνομα
  choice: dùng danh ... trên
  rationale: Trong ngữ cảnh trừ quỷ, cụm từ chỉ việc đem danh ấy ra để khấn gọi hoặc sử dụng trong một công thức trên người có tà linh. “Dùng danh” tự nhiên trong tiếng Việt và tránh biến hành động của họ thành lời cầu nguyện chính đáng.
- source_word: τοὺς ἔχοντας τὰ πνεύματα τὰ πονηρά
  choice: những người có tà linh
  rationale: Bám sát nghĩa đen “những người có các linh ác”, không làm rõ quá mức thành “bị quỷ ám”. “Tà linh” là cách gọi tự nhiên, trang trọng cho πνεύματα πονηρά.
- source_word: τὸ ὄνομα τοῦ κυρίου Ἰησοῦ
  choice: danh Chúa Jêsus
  rationale: “Danh” giữ sắc thái tôn giáo và thẩm quyền của ὄνομα; κύριος được dịch là “Chúa”, bảo toàn tước hiệu Cơ Đốc học của cụm từ.
- source_word: Ὁρκίζω ὑμᾶς τὸν Ἰησοῦν
  choice: Ta nhân danh Jêsus ... truyền lệnh cho các ngươi
  rationale: ὁρκίζω là lời buộc hoặc truyền khiến long trọng dựa vào một danh có thẩm quyền. Cấu trúc tiếng Việt này truyền đạt chức năng của lời trừ quỷ, đồng thời chú thích nghĩa sát hơn là “buộc các ngươi thề bởi Jêsus”.
- source_word: ὃν Παῦλος κηρύσσει
  choice: Đấng mà Phao-lô rao giảng
  rationale: κηρύσσει chỉ việc công bố công khai; “rao giảng” là tự nhiên trong văn cảnh Công Vụ. “Đấng” phù hợp với đại từ chỉ Jêsus và giữ văn phong trang trọng.
theological_decisions:
- issue: Cách dịch κύριος trong τοῦ κυρίου Ἰησοῦ
  choice: Chúa
  alternative: Chủ
  rationale: “Chúa Jêsus” vừa là cách diễn đạt tự nhiên trong tiếng Việt Kinh Thánh vừa bảo toàn sức nặng tôn kính và thần học của κύριος trong Công Vụ.
- issue: Có diễn giải τοὺς ἔχοντας τὰ πνεύματα τὰ πονηρά là bị quỷ ám hay không
  choice: những người có tà linh
  alternative: những người bị tà linh ám
  rationale: Bản Hy Lạp nói theo nghĩa đen là “những người có tà linh”. Bản dịch giữ mức độ xác định của nguyên văn, không thêm mô tả mạnh hơn về tình trạng bị chiếm hữu.
- issue: Sắc thái của ὁρκίζω trong công thức trừ quỷ
  choice: nhân danh Jêsus ... truyền lệnh
  alternative: buộc các ngươi thề bởi Jêsus
  rationale: Trong ngữ cảnh này, động từ diễn tả một lời buộc truyền long trọng hướng đến các tà linh. Cách dịch chính truyền đạt chức năng ấy bằng tiếng Việt dễ hiểu; chú thích giữ cấu trúc lời thề sát chữ và sự căng thẳng của nguyên văn.
translation_notes:
  register: Tiếng Việt hiện đại, rõ ràng và trang trọng vừa phải. Dùng “Chúa Jêsus”, “Phao-lô”, “tà linh” và “rao giảng” theo văn phong Kinh Thánh quen thuộc; lời trực tiếp dùng “Ta/các ngươi” để phản ánh số nhiều ὑμᾶς và giọng truyền lệnh trong nghi thức trừ quỷ.
