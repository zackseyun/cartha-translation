- from: 'Nhưng một số người Do Thái đi đây đó làm nghề trừ quỷ cũng thử dùng danh Chúa Jêsus trên những người có tà linh[a]. Họ nói: “Ta nhân danh Jêsus, Đấng mà Phao-lô rao giảng, truyền lệnh cho các ngươi[b].”'
