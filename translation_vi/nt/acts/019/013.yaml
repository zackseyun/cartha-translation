  verdict: revise
  source_fidelity: 'Bản nháp giữ đúng các thành tố chính của câu: nhóm người trừ quỷ Do Thái lưu động, hành động chỉ là một sự thử/toan làm, việc dùng danh Chúa Jêsus trên người có tà linh, và công thức nhắc đến Jêsus mà Phao-lô rao giảng. Tuy nhiên, “làm nghề” thêm chi tiết rằng đây là nghề nghiệp của họ, điều nguyên văn không khẳng định. Trong lời nói trực tiếp, “truyền lệnh” làm yếu sắc thái ὁρκίζω là lời buộc/trấn áp long trọng nhân danh một người; cần giữ rõ hơn sắc thái này.'
  naturalness: “Người Do Thái đi đây đó làm nghề trừ quỷ” hơi nặng và không cần thiết. “Những người Do Thái trừ quỷ đi đây đó” tự nhiên hơn. “Gọi danh ... trên” là cách diễn đạt có phần sát cấu trúc Kinh Thánh nhưng vẫn hiểu được trong văn mạch; lời trực tiếp được chỉnh thành một công thức tiếng Việt tự nhiên hơn.
  terminology: Giữ “Chúa Jêsus”, “Phao-lô”, “tà linh” và “rao giảng” là nhất quán với văn phong Kinh Thánh Việt ngữ. “Tà linh” phù hợp với πνεύματα πονηρά mà không diễn giải thành “bị quỷ ám”.
