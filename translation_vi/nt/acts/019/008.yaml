id: ACT.19.8
reference: Acts 19:8
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Εἰσελθὼν δὲ εἰς τὴν συναγωγὴν ἐπαρρησιάζετο ἐπὶ μῆνας τρεῖς διαλεγόμενος καὶ ⸀πείθων περὶ τῆς βασιλείας τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/008.yaml
  text: And entering the synagogue[a], he spoke boldly for three months[b], reasoning and persuading them about the kingdom of God.
translation:
  language: vi
  text: Rồi ông vào hội đường và mạnh dạn nói năng suốt ba tháng, biện luận và thuyết phục họ[a] về vương quốc của Đức Chúa Trời.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể hiểu: “cố thuyết phục họ.”'
    reason: Bảo lưu khả năng hiểu πείθων là hoạt động nhằm thuyết phục, không nhất thiết khẳng định kết quả.
lexical_decisions:
- source_word: Εἰσελθὼν δὲ
  choice: Rồi ông vào
  rationale: Phân từ aorist nêu hành động mở đầu trước động từ chính; cách diễn đạt này tự nhiên trong tiếng Việt và δέ nhẹ nhàng tiếp nối câu chuyện.
- source_word: τὴν συναγωγήν
  choice: hội đường
  rationale: Chỉ hội đường Do Thái; đây là thuật ngữ tiếng Việt quen thuộc và chính xác trong bối cảnh Tân Ước.
- source_word: ἐπαρρησιάζετο
  choice: mạnh dạn giảng luận
  rationale: Động từ ở thì chưa hoàn thành diễn tả việc nói năng công khai, không e sợ và kéo dài; cụm 'suốt ba tháng' làm rõ tính liên tục.
- source_word: ἐπὶ μῆνας τρεῖς
  choice: suốt ba tháng
  rationale: ἐπί với đối cách biểu thị khoảng thời gian; 'suốt' truyền đạt tự nhiên tính kéo dài.
- source_word: διαλεγόμενος
  choice: biện luận
  rationale: Diễn tả việc trình bày, trao đổi và lập luận; 'biện luận' giữ được sắc thái lý lẽ mà không nhất thiết hàm ý tranh cãi gay gắt.
- source_word: πείθων
  choice: thuyết phục họ
  rationale: Diễn tả hoạt động thuyết phục; tân ngữ không được nêu trong tiếng Hy Lạp nhưng rõ ràng là những người nghe trong hội đường, và tiếng Việt tự nhiên cần nêu tân ngữ ở đây.
- source_word: περὶ τῆς βασιλείας τοῦ θεοῦ
  choice: về vương quốc của Đức Chúa Trời
  rationale: περί với sở hữu cách có nghĩa là 'về'; 'vương quốc của Đức Chúa Trời' giữ thuật ngữ thần học quen thuộc và không thu hẹp βασιλεία chỉ còn ý niệm cai trị.
theological_decisions:
- issue: Tân ngữ của πείθων được hàm ẩn trong nguyên văn
  choice: thuyết phục họ
  alternative: thuyết phục người nghe; tìm cách thuyết phục họ
  rationale: Ngữ cảnh xác định 'họ' là những người nghe trong hội đường. Việc thêm đại từ chỉ làm rõ cú pháp tiếng Việt, không thêm một nhóm đối tượng mới.
- issue: 'Sắc thái của πείθων: kết quả hay nỗ lực thuyết phục'
  choice: thuyết phục họ
  alternative: cố thuyết phục họ
  rationale: Dạng hiện tại mô tả hoạt động thuyết phục nhưng tự nó không xác quyết mọi người đều bị thuyết phục, cũng không bắt buộc phải thêm ý 'cố'. Chú thích bảo lưu cách hiểu thiên về nỗ lực.
- issue: βασιλεία τοῦ θεοῦ
  choice: vương quốc của Đức Chúa Trời
  alternative: sự trị vì của Đức Chúa Trời
  rationale: βασιλεία có thể nhấn mạnh cả vương quốc lẫn quyền trị vì. Bản chính dùng cách dịch quen thuộc, rộng nghĩa, không áp đặt một cách giải thích thần học hẹp.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng 'ông' cho chủ thể được xác định từ ngữ cảnh; 'giảng luận' và 'biện luận' thể hiện việc nói công khai kèm trao đổi bằng lý lẽ. Dấu chú thích [a] đã được đặt trong chính văn.
