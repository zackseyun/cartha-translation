id: ACT.19.2
reference: Acts 19:2
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἶπέν ⸀τε πρὸς αὐτούς· Εἰ πνεῦμα ἅγιον ἐλάβετε πιστεύσαντες; οἱ ⸀δὲ πρὸς αὐτόν· Ἀλλ’ οὐδ’ εἰ πνεῦμα ἅγιον ἔστιν ἠκούσαμεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/002.yaml
  text: And he said to them[a], “Did you receive the Holy Spirit when you believed?” And they said to him, “No[b], we have not even heard that there is a Holy Spirit.”
translation:
  language: vi
  text: 'Ông nói với họ: “Khi tin, anh em có nhận được Đức Thánh Linh không?”[a] Họ đáp: “Không, chúng tôi thậm chí chưa từng nghe rằng có Đức Thánh Linh.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Sau khi tin, anh em có nhận được Đức Thánh Linh không?” Phân từ Hy Lạp có thể được hiểu với sắc thái thời gian hơi khác nhau.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “chúng tôi thậm chí chưa từng nghe liệu có Đức Thánh Linh”; hoặc theo lối giải thích: “chúng tôi thậm chí chưa từng nghe rằng Đức Thánh Linh đã được ban.”'
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπέν τε πρὸς αὐτούς
  choice: Ông hỏi họ
  rationale: Động từ λέγω có nghĩa cơ bản là “nói”, nhưng vì lời tiếp theo là một câu hỏi trực tiếp, “hỏi” tự nhiên và rõ nghĩa trong tiếng Việt. Tiểu từ τε nối nhẹ với mạch kể trước đó, không nhất thiết phải biểu đạt riêng bằng một liên từ.
- source_word: Εἰ πνεῦμα ἅγιον ἐλάβετε πιστεύσαντες
  choice: Khi tin, anh em có nhận được Đức Thánh Linh không?
  rationale: Phân từ bất định quá khứ πιστεύσαντες có quan hệ thời gian với ἐλάβετε nhưng không tự nó ấn định tuyệt đối là đồng thời hay kế tiếp. “Khi tin” giữ được độ linh hoạt này và tránh áp đặt kết luận giáo lý.
- source_word: πνεῦμα ἅγιον
  choice: Đức Thánh Linh
  rationale: Trong ngữ cảnh này, cụm từ chỉ Thánh Linh của Đức Chúa Trời. “Đức Thánh Linh” là cách gọi trang trọng, tự nhiên và phổ biến trong tiếng Việt.
- source_word: οἱ δὲ πρὸς αὐτόν
  choice: Họ đáp
  rationale: Động từ được lược trong tiếng Hy Lạp và được hiểu theo ngữ cảnh. “Họ đáp” diễn đạt tự nhiên lời hồi đáp; δέ chỉ sự chuyển tiếp nhẹ nên không cần dịch thành “nhưng”.
- source_word: Ἀλλ’ οὐδ’
  choice: Không, ... thậm chí chưa từng
  rationale: Tổ hợp này nhấn mạnh lời phủ định. Cấu trúc tiếng Việt với “Không” rồi “thậm chí chưa từng” chuyển tải tự nhiên sức nhấn ấy.
- source_word: οὐδ’ εἰ πνεῦμα ἅγιον ἔστιν ἠκούσαμεν
  choice: chúng tôi thậm chí chưa từng nghe rằng có Đức Thánh Linh
  rationale: οὐδὲ εἰ có thể được hiểu là “thậm chí rằng” hoặc “thậm chí liệu.” Bản chính theo nghĩa trực tiếp, không thêm ý “đã được ban xuống,” vốn không được nói rõ trong câu Hy Lạp.
theological_decisions:
- issue: Quan hệ thời gian giữa việc tin và việc nhận Đức Thánh Linh
  choice: “Khi tin”
  alternative: “Sau khi tin” hoặc “vừa tin thì”
  rationale: Cách dịch này giữ quan hệ thời gian do phân từ Hy Lạp biểu đạt nhưng không quyết định một trật tự giáo lý chi tiết mà chính văn không xác định rõ.
- issue: Ý nghĩa việc các môn đồ chưa nghe về Đức Thánh Linh
  choice: “chưa từng nghe rằng có Đức Thánh Linh”
  alternative: “chưa từng nghe liệu có Đức Thánh Linh” hoặc, theo lối giải thích, “chưa từng nghe rằng Đức Thánh Linh đã được ban xuống”
  rationale: Cách dịch chính bám sát lời Hy Lạp ngắn gọn; chú thích bảo tồn các khả năng khác mà không đưa phần diễn giải vào chính văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “ông” nối với nhân vật Phao-lô trong văn cảnh, còn “anh em” thể hiện lời xưng hô trực tiếp với một nhóm người mà không quá cổ kính. Các chú thích giữ lại sự mơ hồ về thời điểm nhận Đức Thánh Linh và nội dung chính xác của điều họ chưa nghe.
