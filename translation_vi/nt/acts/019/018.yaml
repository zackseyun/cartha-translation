revisions:
- from: Có nhiều người đã tin đến, xưng nhận và công khai những việc họ đã làm.[a]
  to: Nhiều người trong số những người đã tin cũng đến, xưng nhận và công bố những việc họ đã làm.[a]
  rationale: Bản sửa thay “công khai” bằng động từ “công bố” để phản ánh trực tiếp ἀναγγέλλοντες và làm câu tiếng Việt hoàn chỉnh. Cấu trúc “trong số những người đã tin” biểu đạt rõ τῶν πεπιστευκότων, còn “cũng” chuyển tải nhẹ chức năng tiếp nối của τε. Không thêm đối tượng cho hành động xưng nhận, và không thu hẹp πράξεις thành tội lỗi hoặc thực hành ma thuật.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T09:20:18Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp phản ánh đúng các thành tố chính: πολλοί, phân từ hoàn thành πεπιστευκότων là “đã tin,” và τὰς πράξεις αὐτῶν được giữ theo nghĩa rộng là những việc họ đã làm. Tuy nhiên, “công khai” chỉ là trạng từ/tính từ và không thể tự đảm nhiệm động từ cho ἀναγγέλλοντες; vì vậy cụm hiện tại thiếu một động từ tương ứng với hành động “loan báo/trình bày.”'
  naturalness: “Có nhiều người đã tin đến” không tự nhiên và dễ khiến “đã tin đến” bị đọc như một cụm động từ không rõ quan hệ. “Nhiều người trong số những người đã tin cũng đến” làm rõ cấu trúc genitive partitive và nối mạch tự nhiên. “Công bố những việc...” cung cấp vị ngữ song song, rõ nghĩa với “xưng nhận.”
  terminology: “Xưng nhận” phù hợp với ἐξομολογούμενοι mà không tự thêm “tội lỗi.” “Công bố” phản ánh ἀναγγέλλοντες là làm cho biết/loan báo; “những việc họ đã làm” vẫn không thu hẹp πράξεις vào tội lỗi hay ma thuật. Chú thích duy trì các khả năng từ vựng hợp lệ và nêu ngữ cảnh mà không biến nó thành nghĩa bắt buộc.
  issues:
  - severity: medium
    issue: “công khai” không có động từ chính tương ứng với ἀναγγέλλοντες.
    rationale: Trong câu “xưng nhận và công khai những việc họ đã làm,” “công khai” không tự nhiên làm vị ngữ ngoại động từ. Cần một động từ như “công bố,” “trình bày,” hoặc “cho biết” để chuyển đạt hành động ἀναγγέλλοντες.
  - severity: low
    issue: “Có nhiều người đã tin đến” mơ hồ và gượng trong tiếng Việt.
    rationale: Nguyên văn nói “nhiều người trong số những người đã tin” đang/đã đến. Việc đặt “đã tin” ngay trước “đến” làm mờ quan hệ bộ phận và không diễn đạt trôi chảy.
  revised_text: Nhiều người trong số những người đã tin cũng đến, xưng nhận và công bố những việc họ đã làm.[a]
