id: ACT.19.18
reference: Acts 19:18
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: πολλοί τε τῶν πεπιστευκότων ἤρχοντο ἐξομολογούμενοι καὶ ἀναγγέλλοντες τὰς πράξεις αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/018.yaml
  text: And many of those who had believed were coming[a], confessing and disclosing their practices.
translation:
  language: vi
  text: Nhiều người trong số những người đã tin cũng đến, xưng nhận và công bố những việc họ đã làm.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “những việc họ thực hành” hoặc “các hành vi của họ.”'
    reason: πρᾶξις có thể nhấn mạnh việc làm, hành vi hoặc cách thực hành; ngữ cảnh liên hệ đến các hoạt động ma thuật nhưng bản thân từ này không chỉ giới hạn ở nghĩa đó.
lexical_decisions:
- source_word: πολλοί τε
  choice: Có nhiều người
  rationale: Diễn đạt tự nhiên số lượng πολλοί; liên từ τε nối tiếp mạch kể được thể hiện qua cấu trúc câu tiếng Việt mà không cần dịch thành một từ riêng.
- source_word: τῶν πεπιστευκότων
  choice: người đã tin
  rationale: Phân từ hoàn thành chỉ những người trước đó đã tin và hiện vẫn ở trong trạng thái ấy; cách dịch này tránh biến cụm từ thành một danh xưng giáo hội mang tính kỹ thuật.
- source_word: ἤρχοντο
  choice: đến
  rationale: Động từ ở thì chưa hoàn thành mô tả hành động đang diễn ra hoặc lặp lại. Tiếng Việt tự nhiên có thể dùng “đến” trong mạch tường thuật; không thêm “liên tục” để tránh xác định quá mức sắc thái lặp lại.
- source_word: ἐξομολογούμενοι
  choice: xưng nhận
  rationale: Giữ nghĩa thừa nhận hoặc thú nhận, đồng thời không tự ý bổ sung đối tượng như “tội lỗi” khi nguyên văn không nêu rõ.
- source_word: ἀναγγέλλοντες
  choice: công khai
  rationale: Trong ngữ cảnh này, động từ mang ý nghĩa trình bày, cho biết hay đưa ra ánh sáng. “Công khai” phối hợp tự nhiên với “những việc họ đã làm” và tránh lặp nghĩa hoàn toàn với “xưng nhận”.
- source_word: τὰς πράξεις αὐτῶν
  choice: những việc họ đã làm
  rationale: πρᾶξις có thể chỉ hành vi, việc làm hoặc cách thực hành. Cách dịch này giữ nghĩa rộng của từ, không thu hẹp rõ rệt thành “tội lỗi” hay chỉ riêng các thực hành ma thuật.
theological_decisions:
- issue: Nên diễn đạt πεπιστευκότων như danh xưng cố định “các tín hữu” hay như một hành động đã xảy ra với kết quả còn tiếp diễn.
  choice: người đã tin
  alternative: các tín hữu
  rationale: Phân từ hoàn thành nhấn mạnh việc họ đã tin trước đó và tình trạng ấy vẫn có liên hệ ở hiện tại; “người đã tin” bảo tồn sắc thái này mà không áp đặt một danh xưng giáo hội kỹ thuật.
- issue: τὰς πράξεις αὐτῶν có chỉ riêng tội lỗi hoặc các thực hành ma thuật hay không.
  choice: những việc họ đã làm
  alternative: những việc họ thực hành; những tội lỗi của họ
  rationale: Ngữ cảnh gợi đến hoạt động ma thuật, nhưng danh từ Hy Lạp rộng hơn và không trực tiếp nói “tội lỗi.” Bản dịch chính giữ phạm vi rộng, còn chú thích nêu khả năng dịch khác.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Xưng nhận” giữ sắc thái tôn giáo vừa phải nhưng không thêm đối tượng không có trong nguyên văn; “công khai những việc họ đã làm” diễn đạt tự nhiên hành động đưa các việc trước đây ra ánh sáng.
