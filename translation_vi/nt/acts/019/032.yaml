    issue: “Vì thế” có thể nhấn quá mức quan hệ nhân quả của οὖν.
    rationale: Trong cách dùng tự sự với μὲν οὖν, liên từ này có thể chỉ sự chuyển tiếp (“bấy giờ/lúc ấy”), không nhất thiết nêu một hệ quả trực tiếp.
  - severity: low
    issue: “Cuộc hội họp đang hỗn loạn” chưa thật tự nhiên.
    rationale: “Cuộc tập họp lộn xộn” diễn đạt tự nhiên hơn trạng thái rối loạn của đám người đã tụ lại, mà không thay đổi nghĩa.
