source:
  edition: SBLGNT
  text: ἄλλοι μὲν οὖν ἄλλο τι ἔκραζον, ἦν γὰρ ἡ ἐκκλησία συγκεχυμένη, καὶ οἱ πλείους οὐκ ᾔδεισαν τίνος ἕνεκα συνεληλύθεισαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/032.yaml
  text: So then some were shouting one thing and some another[a], for the assembly was in confusion, and most of them did not know why they had come together.
translation:
  language: vi
  text: Bấy giờ, người thì la hét điều này, người khác thì la hét điều khác, vì cuộc tập họp[a] lộn xộn, và phần đông không biết vì sao họ đã tụ tập lại.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “cuộc tụ họp” hoặc “đám đông”. Từ Hy Lạp ἐκκλησία ở đây chỉ một sự tập hợp dân sự, không phải Hội Thánh.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλοι μὲν οὖν ἄλλο τι ἔκραζον
  choice: Vì thế, người thì la hét điều này, người thì la hét điều khác
  rationale: Cấu trúc ἄλλοι ... ἄλλο τι diễn tả sự đối lập phân bố giữa những nhóm người khác nhau; thể chưa hoàn thành của ἔκραζον cho thấy tiếng la hét đang tiếp diễn. “Vì thế” chuyển tải οὖν tự nhiên trong mạch kể.
- source_word: ἐκκλησία
  choice: cuộc hội họp
  rationale: Trong bối cảnh náo loạn dân sự này, từ này chỉ đám người tụ họp hoặc hội chúng công dân, không phải Hội Thánh. “Cuộc hội họp” giữ nghĩa trung tính và phù hợp ngữ cảnh.
- source_word: συγκεχυμένη
  choice: đang hỗn loạn
  rationale: Phân từ hoàn thành diễn tả tình trạng rối loạn đã hình thành và đang tồn tại; cách dịch này tự nhiên trong tiếng Việt và làm rõ trạng thái của cuộc hội họp.
- source_word: οἱ πλείους
  choice: phần đông
  rationale: Dạng so sánh được dùng như danh từ với nghĩa đa số những người có mặt; “phần đông” là cách diễn đạt gọn và trang trọng vừa phải.
- source_word: τίνος ἕνεκα
  choice: vì sao
  rationale: Thành ngữ có nghĩa “vì lý do gì”; “vì sao” là tương đương tự nhiên, súc tích.
- source_word: συνεληλύθεισαν
  choice: họ đã tụ tập lại
  rationale: Thì quá khứ hoàn thành cho biết việc tụ tập xảy ra trước thời điểm được thuật lại; “đã tụ tập lại” giữ được quan hệ thời gian ấy và ý nghĩa của συνέρχομαι.
theological_decisions:
- issue: Ý nghĩa của ἐκκλησία trong câu này
  choice: Hiểu là cuộc hội họp dân sự
  alternative: Hội Thánh
  rationale: Ngữ cảnh nói về đám đông náo loạn tại Ê-phê-sô, nên từ này không mang nghĩa cộng đồng tín hữu Cơ Đốc trong câu này.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, rõ ràng và trang trọng vừa phải. Cấu trúc “người thì… người thì…” tái hiện nhịp đối lập và cảnh ồn ào; tránh từ ngữ mang hàm ý giáo hội đối với ἐκκλησία.
