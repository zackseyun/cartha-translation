source:
  edition: SBLGNT
  text: καὶ ἐπιθέντος αὐτοῖς τοῦ ⸀Παύλου χεῖρας ἦλθε τὸ πνεῦμα τὸ ἅγιον ἐπ’ αὐτούς, ἐλάλουν τε γλώσσαις καὶ ἐπροφήτευον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/006.yaml
  text: And when Paul laid his hands on them[a], the Holy Spirit came upon them, and they began speaking in tongues and prophesying.
translation:
  language: vi
  text: Khi Phao-lô đặt tay trên họ, Đức Thánh Linh đến trên họ; họ nói các thứ tiếng[a] và nói tiên tri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “các ngôn ngữ” hoặc “các tiếng lạ”. Từ Hy Lạp có thể mang các nghĩa này; chính văn giữ lại sự rộng nghĩa đó.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιθέντος αὐτοῖς τοῦ Παύλου χεῖρας
  choice: Khi Phao-lô đặt tay trên họ
  rationale: Phân từ bất định trong kết cấu sở hữu tuyệt đối được diễn đạt tự nhiên bằng mệnh đề thời gian; “đặt tay trên” giữ nguyên thành ngữ của nguyên văn.
- source_word: ἦλθε ... ἐπ’ αὐτούς
  choice: ngự xuống trên họ
  rationale: Diễn đạt sự Đức Thánh Linh đến trên họ theo cách trang trọng, tự nhiên trong tiếng Việt, đồng thời giữ hướng nghĩa của ἐπί mà không giải thích thêm cơ chế thần học.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: Đức Thánh Linh
  rationale: Cách gọi thông dụng, trang trọng và rõ nghĩa trong tiếng Việt hiện đại.
- source_word: ἐλάλουν
  choice: họ nói
  rationale: Động từ chưa hoàn thành mô tả hành động đang diễn ra; trong câu kể tiếng Việt, “họ nói” tự nhiên hơn và không thêm ý khởi đầu vốn không được biểu thị rõ bằng từ vựng.
- source_word: γλώσσαις
  choice: các thứ tiếng
  rationale: Cụm từ này giữ được khả năng hiểu là các ngôn ngữ hoặc hiện tượng nói tiếng lạ; chú thích nêu rõ tính đa nghĩa thay vì quyết định tranh luận.
- source_word: ἐπροφήτευον
  choice: nói tiên tri
  rationale: Cách diễn đạt trực tiếp, quen thuộc của hành vi phát ngôn mang tính tiên tri, đồng thời phù hợp với thể chưa hoàn thành của động từ.
- source_word: τε ... καί
  choice: và
  rationale: Liên kết chặt chẽ hai hoạt động bằng phép phối hợp tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Bản chất của γλώσσαις trong Công Vụ 19:6
  choice: Dùng “các thứ tiếng” trong chính văn và chú thích khả năng dịch “các ngôn ngữ” hoặc “các tiếng lạ”.
  alternative: Dịch dứt khoát là “các ngôn ngữ” hoặc “tiếng lạ”.
  rationale: Nguyên ngữ γλώσσαις không tự nó giải quyết đây là ngôn ngữ loài người hay lời nói xuất thần; bản dịch cần bảo toàn sự rộng nghĩa và không áp đặt lập trường hệ phái.
- issue: Sự Đức Thánh Linh đến trên họ
  choice: “Đức Thánh Linh ngự xuống trên họ”
  alternative: “Đức Thánh Linh đến trên họ”
  rationale: Cách dịch thuật lại biến cố theo hướng nghĩa của ἦλθε ... ἐπ’ αὐτούς nhưng không suy diễn về trình tự cứu rỗi, quan hệ nhân quả bí tích hay một mô hình tín lý về việc tiếp nhận Thánh Linh.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “Đức Thánh Linh” theo văn phong Kinh Thánh quen thuộc; dấu chấm phẩy làm rõ hai vế biến cố mà vẫn giữ mạch liên tục.
