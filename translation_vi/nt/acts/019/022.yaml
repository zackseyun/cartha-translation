id: ACT.19.22
reference: Acts 19:22
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀποστείλας δὲ εἰς τὴν Μακεδονίαν δύο τῶν διακονούντων αὐτῷ, Τιμόθεον καὶ Ἔραστον, αὐτὸς ἐπέσχεν χρόνον εἰς τὴν Ἀσίαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/022.yaml
  text: So after sending into Macedonia two of those who were ministering to him—Timothy and Erastus—he himself stayed for a time in Asia[a].
translation:
  language: vi
  text: Sau khi sai hai người trong số những người phục vụ ông, là Ti-mô-thê và Ê-ra-tút, đến Ma-xê-đô-ni-a, chính ông còn ở lại A-si-a[a] một thời gian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tức là tỉnh A-si-a của đế quốc La Mã, nằm ở phía tây Tiểu Á, chứ không phải châu Á ngày nay.
    reason: cultural_note
lexical_decisions:
- source_word: ἀποστείλας
  choice: Sau khi sai
  rationale: Phân từ bất định thường diễn tả hành động xảy ra trước động từ chính; cách dịch này làm rõ trình tự và tự nhiên trong tiếng Việt.
- source_word: δὲ
  choice: không dịch thành một từ riêng
  rationale: δέ là liên từ chuyển tiếp nhẹ. Trong tiếng Việt, mạch kể được nối tự nhiên bằng cấu trúc “Sau khi...”, nên thêm “vậy” hoặc “nhưng” sẽ dễ tạo sắc thái quá mạnh.
- source_word: εἰς τὴν Μακεδονίαν
  choice: đến Ma-xê-đô-ni-a
  rationale: εἰς chỉ hướng đến một vùng; “đến” là cách diễn đạt tự nhiên và chính xác trong tiếng Việt.
- source_word: δύο τῶν διακονούντων αὐτῷ
  choice: hai người trong số những người phục vụ mình
  rationale: Giữ cấu trúc chỉ bộ phận và ý nghĩa phục vụ của διακονέω, không biến họ thành người giữ một chức vụ giáo hội cụ thể.
- source_word: Τιμόθεον καὶ Ἔραστον
  choice: Ti-mô-thê và Ê-ra-tút
  rationale: Dùng dạng phiên âm tên riêng quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
- source_word: αὐτὸς
  choice: chính ông
  rationale: Bảo tồn sắc thái nhấn mạnh và sự tương phản giữa Phao-lô với hai người được ông sai đi.
- source_word: ἐπέσχεν χρόνον
  choice: còn ở lại ... một thời gian
  rationale: Diễn đạt tự nhiên thành ngữ Hy Lạp mang nghĩa lưu lại trong một khoảng thời gian; “còn” giúp thể hiện sự tương phản trong ngữ cảnh.
- source_word: εἰς τὴν Ἀσίαν
  choice: ở lại miền A-si-a
  rationale: Với động từ chỉ việc lưu lại, εἰς có nghĩa theo vị trí. “Miền A-si-a” giữ tên gọi cổ trong chính văn, còn chú thích làm rõ đây là tỉnh thuộc La Mã.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Câu giữ sự nhấn mạnh của αὐτός bằng “chính ông”, đồng thời tránh dùng thuật ngữ chức vụ cho διακονέω. Đại từ “mình” quy chiếu tự nhiên về Phao-lô; tên ông không được thêm vào chính văn vì nguyên bản chỉ dùng đại từ.
