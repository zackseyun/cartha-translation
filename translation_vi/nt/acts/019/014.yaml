  to: Có bảy người con trai của một thầy tế lễ trưởng Do Thái tên là Sê-va đang làm điều này.[a]
  rationale: Chỉ thay “làm việc ấy” bằng “đang làm điều này” để giữ rõ hơn hồi chỉ của τοῦτο và khía cạnh tiếp diễn của phân từ hiện tại. Các lựa chọn về tên riêng, căn tính Do Thái, chức vị tư tế và chú thích thay thế đều được giữ nguyên.
