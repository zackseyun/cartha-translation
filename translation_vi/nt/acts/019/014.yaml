  text: ἦσαν δέ ⸀τινος Σκευᾶ Ἰουδαίου ἀρχιερέως ἑπτὰ ⸀υἱοὶ τοῦτο ποιοῦντες.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/014.yaml
  text: There were seven sons of a Jewish chief priest named Sceva doing this[a].
translation:
  language: vi
  text: Có bảy người con trai của một thầy tế lễ trưởng Do Thái tên là Sê-va đang làm điều này.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “thầy tế lễ thượng phẩm”. Từ Hy Lạp có thể chỉ thầy tế lễ thượng phẩm hoặc, theo nghĩa rộng hơn, một thầy tế lễ trưởng hay người thuộc hàng tư tế cấp cao.
    reason: alternative_reading
lexical_decisions:
- source_word: ἦσαν δέ
  choice: Có
  rationale: Diễn đạt tự nhiên cấu trúc tồn tại ở thì chưa hoàn thành; không thêm từ chỉ thời gian vốn không có trong nguyên văn. Liên từ δέ được để ngữ cảnh đảm nhiệm vì tiếng Việt không cần biểu thị rõ ở đây.
- source_word: τινος Σκευᾶ
  choice: của một ... tên là Sê-va
  rationale: Giữ tính bất định của τινος bằng “một” và giới thiệu tên riêng theo cách nói tự nhiên trong tiếng Việt.
- source_word: Ἰουδαίου
  choice: người Do Thái
  rationale: Trong ngữ cảnh này, từ này chỉ căn tính dân tộc-tôn giáo hơn là chỉ riêng nguồn gốc địa lý Giu-đê.
- source_word: ἀρχιερέως
  choice: thầy tế lễ trưởng
  rationale: Phản ánh nghĩa rộng của thuật ngữ là một tư tế cấp cao mà không khẳng định Sê-va giữ chức thầy tế lễ thượng phẩm duy nhất tại Giê-ru-sa-lem.
- source_word: ἑπτὰ υἱοὶ
  choice: bảy người con trai
  rationale: Chuyển trực tiếp số từ và danh từ thân tộc sang trật tự tự nhiên của tiếng Việt.
- source_word: τοῦτο ποιοῦντες
  choice: làm việc ấy
  rationale: Đại từ chỉ định số ít quy chiếu về hành động vừa được nói đến; cách dịch này gọn, tự nhiên và giữ liên kết với ngữ cảnh trước.
theological_decisions:
- issue: Nghĩa của ἀρχιερεύς khi nói về Sê-va
  choice: thầy tế lễ trưởng
  alternative: thầy tế lễ thượng phẩm
  rationale: Từ Hy Lạp có thể chỉ thầy tế lễ thượng phẩm hoặc, theo nghĩa rộng hơn, một người thuộc hàng tư tế cấp cao. Vì Sê-va không được biết đến như vị thượng tế duy nhất tại Giê-ru-sa-lem, bản dịch chính tránh đưa ra một khẳng định lịch sử quá mức nhưng vẫn giữ phương án kia trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Sê-va” theo lối phiên âm tên riêng quen thuộc trong các bản Kinh Thánh tiếng Việt; giữ câu ngắn và mối liên hệ hồi chỉ với câu trước.
