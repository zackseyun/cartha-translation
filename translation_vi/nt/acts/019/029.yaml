  text: καὶ ἐπλήσθη ἡ ⸀πόλις τῆς συγχύσεως, ὥρμησάν τε ὁμοθυμαδὸν εἰς τὸ θέατρον συναρπάσαντες Γάϊον καὶ Ἀρίσταρχον Μακεδόνας, συνεκδήμους Παύλου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/029.yaml
  text: And the city was filled with confusion[a], and they rushed together into the theater, dragging along Gaius and Aristarchus, Macedonians who were Paul’s traveling companions.
translation:
  language: vi
  text: Cả thành tràn ngập hỗn loạn, và họ đồng loạt xông vào nhà hát, lôi theo[a] Gai-út và A-ri-tạc, là hai người Ma-xê-đô-ni-a, bạn đồng hành của Phao-lô.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch “bắt lấy Gai-út và A-ri-tạc” hoặc “túm lấy Gai-út và A-ri-tạc.” Phân từ Hy Lạp nhấn mạnh việc bắt người bằng vũ lực; “lôi theo” làm nổi bật việc đám đông đưa họ vào nhà hát.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπλήσθη ἡ πόλις τῆς συγχύσεως
  choice: Cả thành đầy hỗn loạn
  rationale: Diễn đạt tự nhiên cấu trúc thụ động cùng sở hữu cách chỉ nội dung; không thêm tác nhân, đồng thời giữ trọng tâm vào tình trạng rối loạn lan khắp thành.
- source_word: ὥρμησαν
  choice: xông vào
  rationale: Động từ chỉ sự chuyển động đột ngột, mạnh mẽ; “xông vào” phù hợp cảnh đám đông ào đến nhà hát.
- source_word: ὁμοθυμαδόν
  choice: đồng loạt
  rationale: Nhấn mạnh hành động tập thể cùng lúc trong bối cảnh bạo loạn, không hàm ý sự hiệp nhất tích cực.
- source_word: θέατρον
  choice: nhà hát
  rationale: Cách gọi phổ thông cho θέατρον; tránh dùng “đấu trường” hoặc “nhà hát vòng tròn,” vốn cụ thể hơn nguyên văn.
- source_word: συναρπάσαντες
  choice: lôi theo
  rationale: Giữ cả sắc thái cưỡng ép lẫn chuyển động cùng đám đông vào nhà hát; chú thích nêu các khả năng dịch gần nghĩa.
- source_word: Γάϊον καὶ Ἀρίσταρχον
  choice: Gai-út và A-ri-tạc
  rationale: Phiên âm tên riêng theo lối quen thuộc, dễ đọc trong tiếng Việt Kinh Thánh.
- source_word: Μακεδόνας
  choice: hai người Ma-xê-đô-ni-a
  rationale: Danh từ số nhiều chỉ nguồn gốc địa lý; thêm “hai người” để câu tiếng Việt rõ và tự nhiên mà không thêm nội dung.
- source_word: συνεκδήμους Παύλου
  choice: cùng đi đường với Phao-lô
  rationale: Diễn đạt trực tiếp những người đồng hành với Phao-lô khi đi xa, giữ quan hệ trong nguyên văn mà không thêm vai trò chức vụ.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Cả thành đầy hỗn loạn” cô đọng nhưng vẫn giữ hình ảnh nguyên văn; “đồng loạt xông vào” tái hiện nhịp gấp và sức mạnh của đám đông. Dấu chú thích [a] được đặt ngay sau câu có từ ngữ cần giải thích.
