  rationale: Chỉnh nhẹ để nêu rõ A-na-nia đứng bên người kể và dùng “thấy lại” nhằm tránh sắc thái nghĩa bóng có thể có của “sáng mắt lại”. Bản sửa vẫn bảo toàn sự nhấn mạnh thời điểm của αὐτῇ τῇ ὥρᾳ, lời xưng hô ἀδελφέ, và hướng nhìn εἰς αὐτόν.
