base_translation:
  language: en
  yaml_path: translation/nt/acts/022/013.yaml
  text: He came to me[a], and standing by me said to me, ‘Brother Saul, receive your sight.’ And in that very hour I received my sight and looked at him.
translation:
  language: vi
  text: 'Ông đến với tôi, đứng bên tôi và nói với tôi: “Anh Sau-lơ, hãy thấy lại.” Ngay chính giờ ấy, tôi thấy lại và nhìn ông.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλθὼν πρὸς ἐμέ
  choice: Ông đến chỗ tôi
  rationale: Diễn đạt tự nhiên động tác đi đến gần người kể, phù hợp với phân từ bất định quá khứ và πρός cộng đối cách.
- source_word: ἐπιστάς
  choice: đứng bên cạnh
  rationale: Giữ ý A-na-nia đến đứng gần Sau-lơ mà không làm câu tiếng Việt nặng nề.
- source_word: Σαοὺλ ἀδελφέ
  choice: Anh Sau-lơ
  rationale: ἀδελφέ là lời xưng hô thân thuộc chỉ tình anh em hoặc sự hiệp thông; “Anh Sau-lơ” tự nhiên trong tiếng Việt và không biến từ này thành một tước hiệu.
- source_word: ἀνάβλεψον / ἀνέβλεψα
  choice: hãy sáng mắt lại / tôi sáng mắt lại
  rationale: Trong bối cảnh Sau-lơ bị mù rồi được chữa lành, ἀναβλέπω nói đến việc phục hồi thị lực. “Sáng mắt lại” vừa rõ nghĩa vừa giữ cùng một cách diễn đạt ở hai lần xuất hiện.
- source_word: αὐτῇ τῇ ὥρᾳ
  choice: Ngay chính giờ ấy
  rationale: Giữ sự nhấn mạnh vào đúng thời điểm ấy, thay vì giản lược hoàn toàn thành “ngay lập tức”.
- source_word: εἰς αὐτόν
  choice: nhìn ông
  rationale: Thể hiện hướng nhìn về phía A-na-nia sau khi thị lực được phục hồi.
- source_word: κἀγώ
  choice: tôi
  rationale: Chủ ngữ được nêu rõ trong tiếng Việt; liên hệ tiếp nối đã được thể hiện tự nhiên qua cụm chỉ thời gian đầu câu.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “ông” để kể về A-na-nia, nhưng dùng “Anh Sau-lơ” trong lời gọi trực tiếp nhằm giữ sắc thái ἀδελφέ. Không thêm chú thích vì nghĩa phục hồi thị lực đã rõ từ ngữ cảnh và được thể hiện trực tiếp trong bản dịch.
