  - severity: low
    issue: “Sáng mắt lại” có khả năng gợi nghĩa bóng trong tiếng Việt hiện đại.
    rationale: Dù ngữ cảnh chữa lành làm nghĩa literal rõ, “thấy lại” trực tiếp hơn cho việc phục hồi thị lực mà ἀναβλέπω diễn tả tại đây.
