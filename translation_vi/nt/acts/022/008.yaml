  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐγὼ δὲ ἀπεκρίθην· Τίς εἶ, κύριε; εἶπέν τε πρὸς ⸀ἐμέ· Ἐγώ εἰμι Ἰησοῦς ὁ Ναζωραῖος ὃν σὺ διώκεις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/008.yaml
  text: And I answered[a], ‘Who are you, Lord?’ And he said to me, ‘I am Jesus the Nazarene[b], whom you are persecuting.’
translation:
  language: vi
  text: 'Tôi đáp: “Lạy Chúa, Ngài là ai?”[a] Ngài nói với tôi: “Ta là Giê-su, người Na-xa-rét,[b] người mà ngươi đang bắt bớ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “Thưa ngài, ngài là ai?” Từ Hy Lạp κύριε có thể là lời xưng hô kính trọng, cũng có thể là tước hiệu “Chúa”.'
    reason: alternative_reading
  - marker: b
    text: 'Hoặc: “Giê-su quê Na-xa-rét” hoặc “Giê-su người Na-xa-rê”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθην
  choice: Tôi thưa
  rationale: Trong lời trực tiếp với một nhân vật được xưng là κύριε, “thưa” diễn đạt tự nhiên cả ý đáp lời lẫn sắc thái kính trọng.
- source_word: Τίς εἶ, κύριε
  choice: Lạy Chúa, ngài là ai?
  rationale: Đảo trật tự để câu hỏi tự nhiên trong tiếng Việt; “Lạy Chúa” giữ cách dịch truyền thống của κύριε, còn “ngài” duy trì sắc thái kính trọng.
- source_word: εἶπέν τε πρὸς ἐμέ
  choice: Ngài phán với tôi
  rationale: τε mang lực nối tiếp; tiếng Việt không nhất thiết phải thêm “và”. “Phán” phù hợp với lời của Chúa trong văn phong Kinh Thánh trang trọng nhưng vẫn dễ hiểu.
- source_word: Ἐγώ εἰμι Ἰησοῦς
  choice: Ta là Giê-su
  rationale: Dịch trực tiếp lời tự nhận diện; “Ta” phù hợp với lời của Chúa và tương ứng tự nhiên với đại từ “ngươi” ở vế sau.
- source_word: ὁ Ναζωραῖος
  choice: người Na-xa-rét
  rationale: Diễn đạt tự nhiên trong tiếng Việt một danh xưng chỉ nguồn gốc/liên hệ địa danh, đồng thời giữ khả năng hiểu là “người thuộc Na-xa-rét”.
- source_word: ὃν σὺ διώκεις
  choice: Đấng mà ngươi đang bắt bớ
  rationale: “Bắt bớ” diễn đạt đúng nghĩa bách hại thù địch của διώκω; “đang” phản ánh hành động hiện tại đang tiếp diễn. “Đấng” là đại từ quan hệ tôn kính, quy chiếu về Giê-su.
theological_decisions:
- issue: Cách dịch κύριε trong lời Sau-lơ thưa
  choice: Lạy Chúa
  alternative: Thưa ngài
  rationale: κύριε có thể là tước hiệu “Chúa” hoặc lời xưng hô kính trọng “ngài”. Giữ “Lạy Chúa” trong chính văn theo cách dùng thần học và mạch truyện, nhưng ghi chú phương án kia để không xóa bỏ sự mơ hồ về mức độ nhận biết của Sau-lơ lúc ấy.
- issue: Quan hệ của danh xưng ὁ Ναζωραῖος với Na-xa-rét
  choice: người Na-xa-rét
  alternative: Đấng Na-xa-rét; Giê-su quê Na-xa-rét
  rationale: Danh xưng Hy Lạp có thể được chuyển theo dạng biệt hiệu hoặc diễn đạt quan hệ với địa danh. “Người Na-xa-rét” vừa gần cấu trúc nguồn vừa rõ nghĩa với độc giả hiện đại.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng và dễ hiểu. Dùng “thưa/phán”, “Ta/ngươi” để thể hiện quan hệ trong lời thoại Kinh Thánh mà không quá cổ; các chú thích bảo tồn sự mơ hồ thực sự của κύριε và phạm vi nghĩa của Ναζωραῖος.
