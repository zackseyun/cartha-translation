  text: Ἐγένετο δέ μοι πορευομένῳ καὶ ἐγγίζοντι τῇ Δαμασκῷ περὶ μεσημβρίαν ἐξαίφνης ἐκ τοῦ οὐρανοῦ περιαστράψαι φῶς ἱκανὸν περὶ ἐμέ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/006.yaml
  text: It happened that as I was traveling and drawing near to Damascus[a], about noon, suddenly a bright light from heaven flashed around me,
translation:
  language: vi
  text: Khi tôi đang đi đường, đến gần Đa-mách, vào khoảng giữa trưa, thình lình có một ánh sáng mạnh[a] từ trời chiếu rọi chung quanh tôi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “một ánh sáng lớn.” Từ Hy Lạp có thể nhấn mạnh độ lớn hoặc cường độ của ánh sáng.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δέ μοι πορευομένῳ
  choice: Khi tôi đang đi đường
  rationale: Diễn đạt tự nhiên cấu trúc sự việc xảy đến cho người kể trong lúc đang đi; thể hiện rõ ngôi thứ nhất và tính tiếp diễn của phân từ mà không dùng lối dịch gượng “chuyện xảy ra cho tôi”.
- source_word: καὶ ἐγγίζοντι τῇ Δαμασκῷ
  choice: và đến gần Đa-mách
  rationale: Giữ trình tự hai hành động đang diễn ra và nghĩa tiến đến gần địa điểm của ἐγγίζω với tặng cách.
- source_word: περὶ μεσημβρίαν
  choice: vào khoảng giữa trưa
  rationale: “Khoảng” thể hiện tính xấp xỉ của περί; “giữa trưa” là cách nói hiện đại, rõ ràng.
- source_word: ἐξαίφνης
  choice: thình lình
  rationale: Diễn tả đúng tính đột ngột của biến cố, đồng thời phù hợp văn phong kể chuyện trang trọng.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: từ trời
  rationale: Giữ sắc thái nguồn đến từ cõi trời trong ngữ cảnh khải thị, thay vì thu hẹp thành hiện tượng từ bầu trời khí tượng.
- source_word: περιαστράψαι
  choice: chiếu rực chung quanh
  rationale: Thể hiện cả độ lóe sáng và hướng bao quanh do động từ ghép περι- biểu đạt.
- source_word: φῶς ἱκανὸν
  choice: một luồng sáng chói lòa
  rationale: Diễn đạt tự nhiên cường độ đáng kể của ánh sáng trong tiếng Việt; chú thích giữ lại khả năng hiểu ἱκανόν theo độ lớn hoặc độ mạnh.
- source_word: περὶ ἐμέ
  choice: chung quanh tôi
  rationale: Chuyển tải trực tiếp quan hệ không gian bao quanh người kể.
theological_decisions:
- issue: Ý nghĩa của οὐρανός trong ἐκ τοῦ οὐρανοῦ
  choice: từ trời
  alternative: từ bầu trời
  rationale: Ngữ cảnh cuộc hiện thấy và cách dùng trong sách Công Vụ ưu tiên sắc thái cõi trời/nguồn siêu việt, nhưng bản dịch không thêm lời khẳng định thần học vượt quá cụm từ Hy Lạp.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng vừa phải và phù hợp lời chứng thuật miệng. Câu được tổ chức tự nhiên theo mệnh đề thời gian; “thình lình” duy trì nhịp kể đột ngột. Dấu chú thích [a] được đặt ngay sau cụm từ mà chú thích giải nghĩa.
