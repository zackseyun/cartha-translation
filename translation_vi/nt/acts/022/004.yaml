id: ACT.22.4
reference: Acts 22:4
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὃς ταύτην τὴν ὁδὸν ἐδίωξα ἄχρι θανάτου, δεσμεύων καὶ παραδιδοὺς εἰς φυλακὰς ἄνδρας τε καὶ γυναῖκας,
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/004.yaml
  text: I persecuted this Way to the death[a], binding and delivering both men and women into prisons[b],
translation:
  language: vi
  text: Tôi đã bắt bớ Đạo này[a] cho đến chết[b], trói và giao nộp cả đàn ông lẫn phụ nữ vào các nhà tù.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn là “con đường/lối này”; trong sách Công Vụ, cụm từ này thường là tên gọi dành cho phong trào Cơ Đốc.
    reason: lexical_alternative
  - marker: b
    text: 'Hoặc: “đến chết.” Cụm từ diễn tả mức độ tận cùng của sự bắt bớ, nhưng không nói rõ Phao-lô trực tiếp giết ai hoặc mọi người bị bắt đều chết.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ταύτην τὴν ὁδὸν
  choice: Đạo này
  rationale: ὁδός có nghĩa đen là “đường/lối”, nhưng trong sách Công Vụ thường được dùng như một tên gọi cho phong trào và niềm tin Cơ Đốc. “Đạo” là cách diễn đạt tự nhiên, trang trọng trong tiếng Việt và vẫn giữ được sắc thái một lối sống, niềm tin được nhận diện rõ.
- source_word: ἐδίωξα
  choice: tôi đã bắt bớ
  rationale: Trong ngữ cảnh này, διώκω chỉ việc truy đuổi và đàn áp vì niềm tin; “bắt bớ” diễn đạt đúng nghĩa thù địch ấy.
- source_word: ἄχρι θανάτου
  choice: cho đến chết
  rationale: Cụm từ diễn tả mức độ tận cùng và chết chóc của cuộc bắt bớ, nhưng không xác định rõ mọi nạn nhân đều bị giết hay chính Phao-lô trực tiếp giết họ. Cách dịch ngắn gọn này giữ nguyên độ căng và tính hàm hồ của câu Hy Lạp.
- source_word: δεσμεύων
  choice: trói
  rationale: Phân từ này chỉ hành động trói buộc theo nghĩa cụ thể; “trói” giữ được hình ảnh mạnh của nguyên văn thay vì khái quát thành “bắt giữ”.
- source_word: παραδιδοὺς
  choice: giao nộp
  rationale: παραδίδωμι ở đây là giao người vào sự quản thúc. “Giao nộp” thể hiện sắc thái trao cho nhà chức trách mà không thêm chủ thể không có trong nguyên văn.
- source_word: εἰς φυλακὰς
  choice: vào các nhà tù
  rationale: Cách dịch này thể hiện hướng chuyển động của εἰς và giữ dạng số nhiều của φυλακάς.
- source_word: ἄνδρας τε καὶ γυναῖκας
  choice: cả đàn ông lẫn phụ nữ
  rationale: Cấu trúc Hy Lạp nhấn mạnh cuộc bắt bớ bao gồm cả hai giới; cách diễn đạt này tự nhiên và giữ được sức nhấn ấy.
theological_decisions:
- issue: Nên hiểu ἡ ὁδός là danh từ thông thường hay tên gọi gần như danh xưng của phong trào Cơ Đốc
  choice: Dịch là “Đạo” và viết hoa
  alternative: “con đường này”, “lối này”, hoặc “phong trào này”
  rationale: Trong Công Vụ, ἡ ὁδός nhiều lần chỉ cộng đồng và niềm tin theo Chúa Giê-su. “Đạo” viết hoa báo hiệu nghĩa chỉ định này mà không đưa vào một tên giáo phái về sau.
- issue: Phạm vi ý nghĩa của ἄχρι θανάτου
  choice: Giữ cách nói cô đọng “cho đến chết”
  alternative: “đến mức gây chết chóc” hoặc “đến mức giết chết họ”
  rationale: Nguyên văn nhấn mạnh mức độ chí tử của sự bắt bớ nhưng không nói rõ Phao-lô tự tay giết người hay tất cả người bị bắt đều chết. Bản dịch không nên giải quyết điều nguyên văn để ngỏ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Đạo” là từ quen thuộc trong tiếng Việt tôn giáo; “trói” giữ hình ảnh cụ thể của nguyên văn, còn “giao nộp” thể hiện sắc thái bị chuyển giao cho cơ quan giam giữ. Các dấu chú thích được đặt ngay sau đúng cụm từ mà mỗi chú thích giải thích.
