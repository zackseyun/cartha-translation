  text: ὡς δὲ ⸀προέτειναν αὐτὸν τοῖς ἱμᾶσιν εἶπεν πρὸς τὸν ἑστῶτα ἑκατόνταρχον ὁ Παῦλος· Εἰ ἄνθρωπον Ῥωμαῖον καὶ ἀκατάκριτον ἔξεστιν ὑμῖν μαστίζειν;
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/025.yaml
  text: But when they had stretched him out with the straps[a], Paul said to the centurion standing there, “Is it lawful for you to flog a Roman citizen who is uncondemned?”
translation:
  language: vi
  text: 'Nhưng khi họ căng ông ra bằng những dây da, Phao-lô nói với viên đội trưởng đang đứng đó: “Các ông có được phép đánh roi một công dân Rô-ma khi người ấy chưa bị kết án không?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προέτειναν ... τοῖς ἱμᾶσιν
  choice: đã căng ông ra bằng những dây da
  rationale: Diễn tả việc Phao-lô bị kéo căng và giữ bằng dây da để chuẩn bị chịu đánh đòn; cách dịch này giữ cả hành động lẫn phương tiện được nêu trong tiếng Hy Lạp.
- source_word: ἑστῶτα
  choice: đang đứng đó
  rationale: Phân từ mô tả viên đội trưởng đứng tại chỗ hoặc ở gần; cách diễn đạt này tự nhiên và giữ được khung cảnh.
- source_word: ἑκατόνταρχον
  choice: viên đội trưởng
  rationale: Đây là chức vụ quân sự Rô-ma chỉ sĩ quan chỉ huy một đơn vị theo truyền thống gọi là một trăm quân; “viên đội trưởng” là cách gọi quen thuộc, rõ nghĩa trong tiếng Việt Kinh Thánh.
- source_word: ἄνθρωπον Ῥωμαῖον
  choice: một công dân Rô-ma
  rationale: Nghĩa đen là “một người Rô-ma”, nhưng trong câu hỏi pháp lý này, cụm từ nhấn mạnh địa vị công dân Rô-ma được luật pháp bảo hộ. “Công dân Rô-ma” truyền đạt chính xác hàm ý pháp lý và tự nhiên hơn trong tiếng Việt.
- source_word: ἀκατάκριτον
  choice: chưa bị kết án
  rationale: Từ này chỉ người chưa bị tòa án tuyên có tội. Cách dịch này rõ ràng, tự nhiên và giữ trọng tâm pháp lý.
- source_word: ἔξεστιν
  choice: có được phép
  rationale: Động từ hỏi điều có hợp pháp hoặc được luật cho phép hay không; kết cấu “có được phép ... không?” phù hợp lời nói tự nhiên và vẫn giữ sắc thái pháp lý trong ngữ cảnh.
- source_word: μαστίζειν
  choice: đánh đòn
  rationale: Chỉ hình phạt quất roi nghiêm khắc. “Đánh đòn” là cách diễn đạt rõ ràng, trang trọng vừa phải và phù hợp ngữ cảnh tư pháp.
theological_decisions:
- issue: 'ἄνθρωπον Ῥωμαῖον: cách diễn đạt địa vị Rô-ma'
  choice: một công dân Rô-ma
  alternative: một người Rô-ma
  rationale: Ngữ cảnh là lời viện dẫn quyền được luật Rô-ma bảo hộ, nên “công dân Rô-ma” làm sáng tỏ ý pháp lý vốn có mà không thêm một lập trường thần học hay hệ phái.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Câu hỏi giữ giọng trực diện của Phao-lô và sắc thái pháp lý, không dùng từ cổ hoặc thuật ngữ quá chuyên môn.
