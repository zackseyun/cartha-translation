id: ACT.22.24
reference: Acts 22:24
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐκέλευσεν ⸂ὁ χιλίαρχος εἰσάγεσθαι αὐτὸν⸃ εἰς τὴν παρεμβολήν, ⸀εἴπας μάστιξιν ἀνετάζεσθαι αὐτὸν ἵνα ἐπιγνῷ δι’ ἣν αἰτίαν οὕτως ἐπεφώνουν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/024.yaml
  text: The tribune ordered him to be brought into the barracks[a], saying that he should be examined by scourging[b], so that he might find out for what reason they were shouting against him like this.
translation:
  language: vi
  text: Viên chỉ huy ra lệnh đưa Phao-lô vào đồn lính[a] và truyền tra hỏi ông bằng roi[b], để tìm hiểu vì lý do gì dân chúng lại gào thét chống ông như vậy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “trại quân” hoặc “pháo đài”. Ở đây từ Hy Lạp chỉ khu đóng quân của quân đội La Mã tại Giê-ru-sa-lem.
    reason: cultural_note
  - marker: b
    text: Cũng có thể dịch là “thẩm vấn bằng cách đánh roi”. Tiếng Hy Lạp kết hợp ý tra hỏi với phương tiện được nói rõ là dùng roi.
    reason: lexical_alternative
lexical_decisions:
- source_word: χιλίαρχος
  choice: viên chỉ huy
  rationale: Chỉ viên sĩ quan La Mã chỉ huy lực lượng quân sự; cách dịch này tự nhiên, rõ nghĩa trong tiếng Việt hiện đại mà không gán một cấp bậc Việt Nam không tương ứng chính xác.
- source_word: παρεμβολή
  choice: đồn lính
  rationale: Trong bối cảnh Giê-ru-sa-lem, từ này chỉ khu đóng quân của quân đội La Mã, có thể là khu đồn trú trong pháo đài Antonia.
- source_word: εἰσάγεσθαι αὐτόν
  choice: đưa Phao-lô vào
  rationale: 'Giữ ý bị động về mặt nghĩa: người khác đưa ông vào bên trong; dùng tên riêng để tránh đại từ liên tiếp gây mơ hồ trong tiếng Việt.'
- source_word: εἴπας
  choice: và truyền
  rationale: Phân từ dẫn vào nội dung mệnh lệnh của viên chỉ huy; “truyền” diễn đạt tự nhiên chức năng này trong câu tiếng Việt.
- source_word: μάστιξιν ἀνετάζεσθαι
  choice: tra hỏi ông bằng roi
  rationale: Kết hợp động từ điều tra, thẩm vấn với phương tiện được nói rõ là roi; giữ nguyên sự khắc nghiệt của hành động mà không giảm nhẹ thành việc hỏi cung thông thường.
- source_word: ἵνα ἐπιγνῷ
  choice: để tìm hiểu
  rationale: Diễn đạt mục đích khám phá nguyên nhân, tự nhiên trong tiếng Việt hiện đại.
- source_word: δι’ ἣν αἰτίαν
  choice: vì lý do gì
  rationale: Giữ nghĩa nguyên nhân hoặc lý do, không tự ý biến thành một cáo buộc pháp lý chính thức.
- source_word: οὕτως ἐπεφώνουν αὐτῷ
  choice: lại gào thét chống ông như vậy
  rationale: Thì chưa hoàn thành mô tả tiếng la hét đang tiếp diễn; “chống ông” thể hiện sắc thái thù nghịch, còn “như vậy” giữ lực chỉ cách thức của οὕτως.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “viên chỉ huy” thay cho một thuật ngữ cấp bậc La Mã khó hiểu; “tra hỏi bằng roi” giữ cả mục đích thẩm vấn lẫn phương thức tra tấn. Các dấu chú thích được đặt đúng tại “đồn lính[a]” và “bằng roi[b]”.
