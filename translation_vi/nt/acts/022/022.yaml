  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἤκουον δὲ αὐτοῦ ἄχρι τούτου τοῦ λόγου καὶ ἐπῆραν τὴν φωνὴν αὐτῶν λέγοντες· Αἶρε ἀπὸ τῆς γῆς τὸν τοιοῦτον, οὐ γὰρ καθῆκεν αὐτὸν ζῆν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/022.yaml
  text: They were listening to him up to this statement, and they raised their voices, saying, “Take such a man away from the earth, for it was not fitting for him to live.”
translation:
  language: vi
  text: 'Họ nghe ông cho đến chỗ này, rồi đồng thanh lớn tiếng nói: “Hãy loại bỏ một kẻ như thế khỏi mặt đất[a], vì hắn không nên sống!”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Thành ngữ này hàm ý họ đòi giết ông; cũng có thể dịch: “Hãy loại bỏ một kẻ như thế khỏi cõi đời.”'
    reason: lexical_alternative
  - marker: b
    text: 'Dịch sát hơn: “vì việc hắn sống là điều không thích hợp”; cũng có thể dịch: “vì hắn không nên được sống.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἤκουον
  choice: vẫn nghe
  rationale: Thì chưa hoàn thành diễn tả hành động đang tiếp diễn cho đến thời điểm lời nói gây phản ứng; “vẫn nghe” tự nhiên trong tiếng Việt.
- source_word: ἄχρι τούτου τοῦ λόγου
  choice: cho đến lời này
  rationale: λόγος ở đây chỉ lời hoặc ý vừa được nói ra trong bài diễn thuyết; cách dịch giữ gần hình thức Hy Lạp mà vẫn rõ nghĩa.
- source_word: ἐπῆραν τὴν φωνὴν αὐτῶν
  choice: lớn tiếng
  rationale: Thành ngữ chỉ việc cất tiếng mạnh và ồn ào; “lớn tiếng” tự nhiên, không cần giữ máy móc hình ảnh “nâng giọng”.
- source_word: Αἶρε ἀπὸ τῆς γῆς
  choice: Hãy loại ... khỏi mặt đất
  rationale: Trong ngữ cảnh thù nghịch, αἴρω mang nghĩa loại bỏ; “khỏi mặt đất” giữ hình ảnh và hàm ý đòi giết người ấy.
- source_word: τὸν τοιοῦτον
  choice: một kẻ như thế
  rationale: “Kẻ” chuyển tải sắc thái khinh miệt của lời đám đông mà vẫn là tiếng Việt hiện đại.
- source_word: οὐ γὰρ καθῆκεν αὐτὸν ζῆν
  choice: vì hắn không đáng sống
  rationale: καθῆκεν nói về điều thích hợp hoặc phải lẽ; trong lời hô đòi giết, “không đáng sống” diễn đạt tự nhiên lực ngữ dụng mà không thêm tác nhân cho phép.
theological_decisions:
- issue: Mức độ trực tiếp của lời đám đông về cái chết của Phao-lô
  choice: Giữ lời hô dưới dạng “loại ... khỏi mặt đất” và giải thích hàm ý trong chú thích
  alternative: Dịch thẳng là “hãy giết hắn”
  rationale: Nguyên văn dùng một thành ngữ loại bỏ khỏi mặt đất, không dùng động từ “giết”; bản dịch giữ hình ảnh và không diễn giải quá mức.
- issue: Sắc thái của καθῆκεν
  choice: “không đáng sống”
  alternative: “không nên được sống” hoặc “không thích hợp để hắn sống”
  rationale: Lựa chọn này bảo tồn phán quyết chuẩn mực của đám đông và phù hợp lời nói trực tiếp, nhưng chú thích ghi nhận cách dịch sát cấu trúc hơn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “ông” trong lời kể tôn trọng nhân vật; “hắn” và “kẻ” trong lời đám đông thể hiện thái độ khinh miệt của họ. Các dấu chú thích [a], [b] đều được đặt trong chính văn.
