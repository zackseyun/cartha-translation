  - severity: low
    issue: “Hãy loại một kẻ như thế”
    rationale: Trong tiếng Việt hiện đại, “loại” ở đây cần “bỏ” để diễn đạt hành động loại trừ; “loại bỏ” vừa tự nhiên vừa phản ánh αἶρε.
  - severity: low
    issue: “cho đến lời này”
    rationale: λόγος trong ngữ cảnh này là điểm/phát biểu vừa nêu trong bài diễn từ, không nhất thiết là một từ hay một lời đơn lẻ; “cho đến chỗ này” rõ và tự nhiên hơn.
