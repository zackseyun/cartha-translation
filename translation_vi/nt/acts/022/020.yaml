id: ACT.22.20
reference: Acts 22:20
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ὅτε ⸀ἐξεχύννετο τὸ αἷμα Στεφάνου τοῦ μάρτυρός σου, καὶ αὐτὸς ἤμην ἐφεστὼς καὶ συνευδοκῶν ⸀καὶ φυλάσσων τὰ ἱμάτια τῶν ἀναιρούντων αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/020.yaml
  text: And when the blood of Stephen your witness was being poured out[a], I myself was standing by and approving, and guarding the cloaks of those who were killing him.
translation:
  language: vi
  text: Và khi máu của Ê-tiên, người làm chứng cho Ngài[a], đang bị đổ ra, chính tôi có mặt ở đó, tán thành và trông giữ áo ngoài cho những kẻ giết người ấy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “người tuẫn đạo”. Từ Hy Lạp này có nghĩa là “người làm chứng”; trong cách dùng Cơ Đốc giáo, từ này về sau được đặc biệt gắn với người chết vì lời chứng ấy.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξεχύννετο
  choice: đang bị đổ ra
  rationale: Thể chưa hoàn thành bị động diễn tả hành động đang diễn ra; cách dịch này giữ hình ảnh máu bị đổ ra thay vì làm nhẹ thành một cách nói quy ước.
- source_word: αἷμα
  choice: máu
  rationale: Tương đương trực tiếp, tự nhiên và phù hợp ngữ cảnh.
- source_word: μάρτυρός
  choice: người làm chứng
  rationale: Giữ nghĩa từ vựng cơ bản của μάρτυς trong lời Phao-lô nói với Chúa; liên hệ với nghĩa 'người tuẫn đạo' được nêu ở chú thích vì Ê-tiên bị giết do lời chứng của mình.
- source_word: ἐφεστὼς
  choice: đứng đó
  rationale: Diễn đạt tự nhiên việc Phao-lô có mặt và đứng tại hiện trường mà không thêm ý ông chỉ thụ động quan sát.
- source_word: συνευδοκῶν
  choice: tán thành
  rationale: Thể hiện sự đồng thuận và chấp thuận tích cực, mạnh hơn việc chỉ hiện diện.
- source_word: φυλάσσων
  choice: giữ
  rationale: Trong ngữ cảnh áo được giao cho Phao-lô trông coi, 'giữ' tự nhiên hơn 'canh giữ' mà vẫn bảo toàn hành động cụ thể.
- source_word: ἱμάτια
  choice: áo ngoài
  rationale: ἱμάτια ở đây chỉ những y phục ngoài mà những người hành hình cởi ra; cách dịch này cụ thể nhưng không suy diễn thành một kiểu áo riêng.
- source_word: ἀναιρούντων
  choice: giết
  rationale: Truyền đạt thẳng nghĩa lấy mạng sống trong ngữ cảnh này, không thêm phán đoán pháp lý hoặc đạo đức như 'sát hại'.
- source_word: αὐτὸς
  choice: chính tôi
  rationale: Giữ sắc thái nhấn mạnh của đại từ Hy Lạp.
theological_decisions:
- issue: Cách dịch μάρτυς khi nói về Ê-tiên
  choice: người làm chứng
  alternative: người tuẫn đạo
  rationale: Nghĩa trực tiếp trong tiếng Hy Lạp là người làm chứng. Ngữ cảnh cái chết của Ê-tiên tạo liên hệ rõ với nghĩa Kitô giáo về người chết vì lời chứng, nhưng dùng 'người tuẫn đạo' trong chính văn có thể đưa sự phát triển thuật ngữ về sau vào câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng 'Ngài' vì lời này đang thưa trực tiếp với Chúa; giữ cấu trúc tích lũy của câu Hy Lạp nhưng điều chỉnh trật tự từ cho tự nhiên trong tiếng Việt.
