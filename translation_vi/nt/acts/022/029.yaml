base_translation:
  language: en
  yaml_path: translation/nt/acts/022/029.yaml
  text: Therefore those who were about to examine him withdrew from him at once[b][a], and the tribune also became afraid when he realized that he was a Roman citizen and that he had bound him.
translation:
  language: vi
  text: Vì vậy, những người sắp thẩm tra Phao-lô[a] lập tức lui ra khỏi ông. Viên chỉ huy[b] cũng sợ hãi khi biết Phao-lô là công dân La Mã và rằng ông ta đã trói Phao-lô.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch rõ hơn theo văn cảnh: “những người sắp thẩm tra ông bằng roi.” Động từ Hy Lạp có thể chỉ việc thẩm tra chính thức, còn câu trước cho biết cách thức là đánh roi.'
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn là “thiên phu trưởng”, một chức danh quân sự La Mã dành cho sĩ quan trên danh nghĩa chỉ huy khoảng một ngàn quân, dù quân số thực tế có thể khác.
    reason: cultural_note
lexical_decisions:
- source_word: εὐθέως οὖν
  choice: Vì vậy... lập tức
  rationale: “Vì vậy” giữ quan hệ suy luận với câu trước, còn “lập tức” diễn đạt phản ứng tức thời.
- source_word: ἀπέστησαν ἀπ’ αὐτοῦ
  choice: lui ra khỏi ông
  rationale: Diễn đạt tự nhiên việc những người thi hành nhiệm vụ ngừng tiến hành và tránh xa Phao-lô.
- source_word: οἱ μέλλοντες αὐτὸν ἀνετάζειν
  choice: những người sắp tra hỏi Phao-lô
  rationale: “Sắp” thể hiện ý định cận kề; “tra hỏi” phù hợp một cuộc thẩm tra chính thức nhưng không tự đưa phương thức đánh đòn vào chính văn. Dùng tên riêng để tránh chuỗi đại từ khó hiểu trong tiếng Việt.
- source_word: χιλίαρχος
  choice: viên chỉ huy
  rationale: Cách gọi dễ hiểu, phù hợp chức vụ sĩ quan La Mã chỉ huy một đơn vị lớn; chi tiết lịch sử được giữ trong chú thích.
- source_word: ἐφοβήθη
  choice: cũng sợ hãi
  rationale: Giữ phản ứng sợ hãi nảy sinh khi viên chỉ huy nhận ra tình thế pháp lý.
- source_word: ἐπιγνοὺς
  choice: khi biết
  rationale: Diễn đạt tự nhiên phân từ chỉ hoàn cảnh và nguyên nhân, tức ông ta nhận thức được thân phận của Phao-lô.
- source_word: Ῥωμαῖός ἐστιν
  choice: ông là công dân La Mã
  rationale: Trong ngữ cảnh, cụm từ nói đến địa vị công dân hợp pháp chứ không chỉ nguồn gốc dân tộc.
- source_word: αὐτὸν ἦν δεδεκώς
  choice: mà mình đã trói ông
  rationale: 'Giữ giá trị hoàn thành của phân từ: việc trói đã xảy ra và hiện còn hệ quả pháp lý. “Mình” quy chiếu tự nhiên về viên chỉ huy.'
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Chính văn ưu tiên “viên chỉ huy” thay cho thuật ngữ cổ “thiên phu trưởng”; giữ sự phân biệt giữa việc tra hỏi nói chung và phương thức đánh roi được nêu trong văn cảnh. Các dấu chú thích [a], [b] đều có mặt trong chính văn.
