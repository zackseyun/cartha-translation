  to: Vì vậy, những người sắp thẩm tra Phao-lô[a] lập tức lui ra khỏi ông. Viên chỉ huy[b] cũng sợ hãi khi biết Phao-lô là công dân La Mã và rằng ông ta đã trói Phao-lô.
