source:
  edition: SBLGNT
  text: ἀκούσας δὲ ὁ ἑκατοντάρχης προσελθὼν ⸂τῷ χιλιάρχῳ ἀπήγγειλεν⸃ λέγων· ⸀Τί μέλλεις ποιεῖν; ὁ γὰρ ἄνθρωπος οὗτος Ῥωμαῖός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/026.yaml
  text: When the centurion heard this[a], he went to the commander and reported it, saying[b], “What are you about to do? For this man is a Roman citizen.”
translation:
  language: vi
  text: 'Khi nghe điều đó, viên đội trưởng đến gặp viên chỉ huy và báo: “Ngài định làm gì? Vì người này là công dân La Mã.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀκούσας
  choice: vừa nghe vậy
  rationale: Phân từ bất định nêu hoàn cảnh xảy ra trước hành động chính; cách diễn đạt này tự nhiên trong tiếng Việt và giữ được trình tự thời gian.
- source_word: ἑκατοντάρχης
  choice: viên đội trưởng
  rationale: Chỉ sĩ quan La Mã chỉ huy khoảng một trăm quân; đây là cách gọi rõ nghĩa, quen thuộc trong văn cảnh Kinh Thánh tiếng Việt.
- source_word: προσελθὼν
  choice: đến
  rationale: Diễn tả việc tiến lại gần cấp trên; “đến” gọn và tự nhiên trong mạch kể.
- source_word: χιλιάρχῳ
  choice: viên chỉ huy
  rationale: Chỉ viên sĩ quan cấp cao chỉ huy đơn vị quân đội; cách dịch chức năng này dễ hiểu hơn từ phiên âm hoặc thuật ngữ cổ.
- source_word: ἀπήγγειλεν
  choice: báo cho
  rationale: Động từ chỉ việc trình báo hoặc chuyển đạt thông tin, phù hợp với quan hệ quân sự giữa hai sĩ quan.
- source_word: λέγων
  choice: dấu hai chấm mở lời trực tiếp
  rationale: Tiếng Việt tự nhiên có thể thể hiện phân từ “nói rằng” bằng dấu hai chấm mà không làm mất quan hệ giữa việc trình báo và lời nói.
- source_word: Τί μέλλεις ποιεῖν;
  choice: Ngài định làm gì?
  rationale: μέλλω với động từ nguyên mẫu có thể chỉ hành động sắp xảy ra hoặc ý định. “Định làm gì” tự nhiên và giữ được sắc thái ý định trong lời cảnh báo.
- source_word: ὁ γὰρ ἄνθρωπος οὗτος
  choice: Vì người này
  rationale: Giữ liên từ giải thích γάρ và diễn đạt ἄνθρωπος tự nhiên, không thêm sắc thái miệt thị.
- source_word: Ῥωμαῖός ἐστιν
  choice: là công dân La Mã
  rationale: Trong văn cảnh pháp lý, “người La Mã” nói đến tư cách công dân chứ không đơn thuần là nguồn gốc hay nơi cư trú; dịch rõ nghĩa hàm ẩn này.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Ngài” khi cấp dưới nói với viên chỉ huy để thể hiện quan hệ cấp bậc mà không quá cổ kính. Không thêm chú thích vì các sắc thái cần thiết có thể được thể hiện rõ trong bản dịch.
