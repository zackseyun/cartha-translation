  to: Những người đi cùng tôi thấy ánh sáng, nhưng không nghe tiếng nói của người đang nói với tôi[a].
  rationale: Bản sửa loại bỏ tước hiệu “Đấng” và động từ “phán,” vốn vượt quá cách diễn đạt không xác định của nguyên văn, đồng thời giữ nghĩa trực tiếp của ἀκούω là “nghe.” Chú thích tiếp tục nêu khả năng hiểu là không hiểu tiếng nói, để bảo tồn sự căng thẳng văn bản với Công Vụ 9:7.
