  text: οἱ δὲ σὺν ἐμοὶ ὄντες τὸ μὲν φῶς ⸀ἐθεάσαντο τὴν δὲ φωνὴν οὐκ ἤκουσαν τοῦ λαλοῦντός μοι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/009.yaml
  text: Those who were with me saw the light[a], but they did not hear the voice of the one speaking to me.
translation:
  language: vi
  text: Những người đi cùng tôi thấy ánh sáng, nhưng không nghe tiếng nói của người đang nói với tôi[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc có thể hiểu: “nhưng không hiểu tiếng nói đó.” So sánh Công Vụ 9:7, nơi những người đi cùng Phao-lô được nói là nghe tiếng nói hoặc âm thanh; sự khác biệt có thể là giữa việc nghe một âm thanh và hiểu lời của người nói.'
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ δὲ σὺν ἐμοὶ ὄντες
  choice: Những người đi cùng tôi
  rationale: Diễn đạt tự nhiên cấu trúc phân từ có mạo từ, không thêm từ “đàn ông” vì nguyên văn không nói rõ.
- source_word: τὸ μὲν φῶς
  choice: ánh sáng
  rationale: φῶς có nghĩa trực tiếp là “ánh sáng”; cặp μέν…δέ tạo thế tương phản, được thể hiện bằng “nhưng”.
- source_word: ἐθεάσαντο
  choice: thấy
  rationale: θεάομαι ở đây mang nghĩa thấy hoặc quan sát; “thấy” là cách diễn đạt hiện đại, tự nhiên và không hàm ý chủ ý quá mức.
- source_word: τὴν δὲ φωνὴν
  choice: tiếng
  rationale: φωνή có thể chỉ tiếng hoặc giọng nói. “Tiếng” tự nhiên trong tiếng Việt khi đi với cụm “của Đấng đang phán”, đồng thời giữ được phần nào phạm vi nghĩa giữa âm thanh và tiếng nói.
- source_word: οὐκ ἤκουσαν
  choice: không nghe
  rationale: Giữ nghĩa trực tiếp thông thường của ἀκούω; khả năng mang sắc thái “không hiểu” được nêu trong chú thích thay vì đưa vào chính văn.
- source_word: τοῦ λαλοῦντός μοι
  choice: của Đấng đang phán với tôi
  rationale: “Đang phán” giữ sắc thái tiếp diễn của phân từ hiện tại λαλοῦντος. “Đấng” phù hợp với lời nói trang trọng về nhân vật thần linh trong ngữ cảnh, nhưng không nêu danh tính vốn không được nói trực tiếp trong câu này.
theological_decisions:
- issue: Sự căng thẳng bề mặt với Công Vụ 9:7 về việc những người đi cùng Phao-lô có nghe tiếng hay không
  choice: Giữ chính văn là “không nghe tiếng của Đấng đang phán với tôi”
  alternative: “không hiểu tiếng ấy” hoặc họ nghe âm thanh nhưng không hiểu lời người phán
  rationale: Cách đọc trực tiếp của câu Hy Lạp là họ không nghe tiếng của Đấng đang phán. Tuy nhiên, ἀκούω và φωνή có phạm vi nghĩa cho phép phân biệt giữa nghe âm thanh và hiểu tiếng nói. Chú thích bảo tồn khả năng này mà không âm thầm hóa giải sự căng thẳng trong chính văn.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Không thêm từ nối chỉ thời gian ở đầu câu vì nguyên văn không có từ tương đương với “bấy giờ” hay “lúc ấy”. Dấu chú thích được đặt sau toàn bộ mệnh đề mà chú thích giải thích.
