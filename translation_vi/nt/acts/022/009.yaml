  source_fidelity: 'Bản dịch giữ đúng trật tự ý chính: những người đi cùng Phao-lô thấy ánh sáng nhưng không nghe φωνή của người đang nói với ông. Tuy nhiên, “Đấng” thêm một tước hiệu/tham chiếu thần linh không có trong τοῦ λαλοῦντός μοι (“người đang nói với tôi”). Nguyên văn chỉ dùng phân từ có mạo từ, không nêu danh tính hay tước hiệu trong câu này.'
