  terminology: Thay “Đấng đang phán” bằng “người đang nói” để không nâng giọng điệu hoặc thêm tiền giả định thần học ngoài nguyên văn. Chú thích vẫn nên bảo lưu khả năng “không hiểu” nhằm phản ánh căng thẳng với Công Vụ 9:7 mà không giải quyết nó trong chính văn.
