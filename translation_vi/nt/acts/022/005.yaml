  verdict: revise
  source_fidelity: 'Cần chỉnh hai điểm để sát nguyên văn hơn: mở đầu tiếng Việt không nên là một mệnh đề rời bắt đầu bằng “Như”, và δεδεμένους mô tả những người được giải đi trong tình trạng bị trói, không nhất thiết nêu riêng hành động “bắt trói” trước đó.'
  naturalness: 'Bản sửa dùng câu hoàn chỉnh, hiện đại: “có thể làm chứng cho tôi về điều đó”; “áp giải ... trong tình trạng bị trói” tự nhiên trong bối cảnh pháp lý-lịch sử. “Để họ bị trừng phạt” rõ và bớt cổ hơn “hầu cho”.'
  terminology: Giữ “thầy thượng tế”, “hội đồng trưởng lão”, “các anh em”, tên địa danh Đa-mách và Giê-ru-sa-lem. Chú thích về “các anh em” được giữ nguyên và đặt đúng sau cụm liên quan.
  issues:
  - severity: medium
    issue: Câu mở đầu “Như thầy thượng tế...” là mệnh đề không trọn vẹn trong tiếng Việt.
    rationale: ὡς καὶ giới thiệu sự xác nhận cho điều Phao-lô vừa nói. Tiếng Việt cần một câu hoàn chỉnh, chẳng hạn thêm “về điều đó”, mà không thay đổi nội dung.
  - severity: medium
    issue: “để bắt trói ... và giải về” diễn giải δεδεμένους như một hành động bắt trói tách biệt.
    rationale: δεδεμένους là phân từ hoàn thành bị động, nêu trạng thái “bị trói/bị ràng buộc” của những người Phao-lô định áp giải. “Áp giải ... trong tình trạng bị trói” giữ sát trạng thái này mà không áp đặt trình tự hành động.
