revisions:
- from: Như thầy thượng tế và toàn thể hội đồng trưởng lão cũng có thể làm chứng cho tôi. Tôi cũng đã nhận thư từ họ gửi cho các anh em ở Đa-mách[a], rồi lên đường đến đó để bắt trói cả những người đang ở đó và giải về Giê-ru-sa-lem, hầu cho họ bị trừng phạt.
  to: Thầy thượng tế và toàn thể hội đồng trưởng lão cũng có thể làm chứng cho tôi về điều đó. Tôi cũng đã nhận thư từ họ gửi cho các anh em ở Đa-mách[a], rồi lên đường đến đó để áp giải cả những người ở đó, trong tình trạng bị trói, về Giê-ru-sa-lem để họ bị trừng phạt.
  rationale: Bản sửa hoàn chỉnh hóa cấu trúc xác nhận do ὡς καὶ mở ra, đồng thời chuyển cách diễn đạt δεδεμένους sang trạng thái bị động “trong tình trạng bị trói”. Các yếu tố “cũng/cả” vẫn phản ánh hai lần καί; mục đích ἵνα τιμωρηθῶσιν được giữ bằng “để họ bị trừng phạt”.
