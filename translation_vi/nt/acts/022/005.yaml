id: ACT.22.5
reference: Acts 22:5
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὡς καὶ ὁ ἀρχιερεὺς μαρτυρεῖ μοι καὶ πᾶν τὸ πρεσβυτέριον· παρ’ ὧν καὶ ἐπιστολὰς δεξάμενος πρὸς τοὺς ἀδελφοὺς εἰς Δαμασκὸν ἐπορευόμην ἄξων καὶ τοὺς ἐκεῖσε ὄντας δεδεμένους εἰς Ἰερουσαλὴμ ἵνα τιμωρηθῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/005.yaml
  text: as also the high priest and the whole council of elders can testify for me. From them I also received letters to the brothers in Damascus[a], and I was traveling there to bring also those who were there, bound, to Jerusalem so that they might be punished.
translation:
  language: vi
  text: Thầy thượng tế và toàn thể hội đồng trưởng lão cũng có thể làm chứng cho tôi về điều đó. Tôi cũng đã nhận thư từ họ gửi cho các anh em ở Đa-mách[a], rồi lên đường đến đó để áp giải cả những người ở đó, trong tình trạng bị trói, về Giê-ru-sa-lem để họ bị trừng phạt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể hiểu là “các anh chị em”. Tiếng Hy Lạp viết “các anh em”, nhưng trong một số ngữ cảnh, cách gọi này có thể chỉ một cộng đồng rộng hơn.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς καὶ
  choice: Như ... cũng
  rationale: Giữ sắc thái xác nhận, đưa ra các nhân chứng để chứng thực lời Phao-lô vừa nói, đồng thời tự nhiên trong tiếng Việt.
- source_word: ὁ ἀρχιερεύς
  choice: thầy thượng tế
  rationale: Danh xưng quen thuộc và trang trọng dành cho vị đứng đầu hàng tư tế trong bối cảnh Do Thái.
- source_word: μαρτυρεῖ μοι
  choice: có thể làm chứng cho tôi
  rationale: Diễn đạt tự nhiên ý rằng lời Phao-lô có thể được những người có thẩm quyền xác nhận.
- source_word: πᾶν τὸ πρεσβυτέριον
  choice: toàn thể hội đồng trưởng lão
  rationale: πρεσβυτέριον chỉ tập thể hay hội đồng các trưởng lão, không chỉ những người cao tuổi nói chung.
- source_word: παρ’ ὧν
  choice: từ họ
  rationale: Chỉ trở lại thầy thượng tế và toàn thể hội đồng trưởng lão như một tập thể.
- source_word: ἐπιστολάς
  choice: thư
  rationale: Giữ nghĩa căn bản của từ Hy Lạp; tính chất ủy nhiệm chính thức đã rõ nhờ ngữ cảnh.
- source_word: πρὸς τοὺς ἀδελφούς
  choice: gửi cho các anh em
  rationale: Giữ danh từ giống đực số nhiều của nguyên văn và quan hệ cộng đồng được biểu thị; khả năng chỉ cộng đồng rộng hơn được nêu trong chú thích.
- source_word: ἐπορευόμην
  choice: lên đường đến đó
  rationale: Diễn đạt hành động đang tiến hành trong quá khứ theo thể chưa hoàn thành, bằng lối kể tự nhiên của tiếng Việt.
- source_word: ἄξων
  choice: để ... giải về
  rationale: Phân từ tương lai nêu mục đích của chuyến đi; 'giải về' phù hợp với việc áp giải người bị bắt đến Giê-ru-sa-lem.
- source_word: καὶ τοὺς ἐκεῖσε ὄντας δεδεμένους
  choice: bắt trói cả những người đang ở đó
  rationale: Giữ καί bằng 'cả', địa điểm bằng 'đang ở đó', và trạng thái bị trói; tiếng Việt tự nhiên diễn đạt việc khiến họ ở trong tình trạng bị trói bằng 'bắt trói'.
- source_word: ἵνα τιμωρηθῶσιν
  choice: hầu cho họ bị trừng phạt
  rationale: Giữ mục đích và thể bị động mà không xác định một hình phạt cụ thể ngoài nguyên văn.
theological_decisions:
- issue: Phạm vi chỉ người của ἀδελφοί trong bối cảnh cộng đồng tại Đa-mách
  choice: các anh em
  alternative: các anh chị em; đồng bào Do Thái
  rationale: Nguyên văn dùng danh từ giống đực số nhiều. Bản chính giữ hình thức này thay vì xác định chắc chắn rằng nhóm ấy gồm cả nam lẫn nữ hoặc diễn giải họ là đồng bào Do Thái; khả năng rộng hơn được bảo lưu trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “thầy thượng tế”, “hội đồng trưởng lão”, “giải về” để phù hợp bối cảnh lịch sử và pháp lý; tránh thuật ngữ giáo phái. Dấu chú thích [a] được đặt ngay sau cụm từ liên quan.
