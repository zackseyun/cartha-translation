  text: ὅτι ἔσῃ μάρτυς αὐτῷ πρὸς πάντας ἀνθρώπους ὧν ἑώρακας καὶ ἤκουσας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/015.yaml
  text: For you will be a witness for him to all people of what you have seen and heard[a][b].
translation:
  language: vi
  text: Vì anh sẽ làm chứng cho Ngài[a] với mọi người[b] về những điều anh đã thấy và nghe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể hiểu là “về Ngài.” Dạng tặng cách trong tiếng Hy Lạp có thể diễn tả những quan hệ gần nhau, như làm chứng cho Ngài hoặc làm chứng về Ngài.
    reason: alternative_reading
  - marker: b
    text: Nguyên văn dùng danh từ số nhiều có hình thức giống đực nhưng ở đây chỉ con người nói chung.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Vì
  rationale: Trong mạch văn, liên từ này đưa ra lời giải thích cho sự sai phái; “Vì” diễn đạt tự nhiên quan hệ ấy trong tiếng Việt.
- source_word: ἔσῃ μάρτυς
  choice: anh sẽ là nhân chứng
  rationale: Giữ cấu trúc vị ngữ danh từ của tiếng Hy Lạp và diễn đạt rõ vai trò làm chứng được giao cho Phao-lô.
- source_word: αὐτῷ
  choice: cho Ngài
  rationale: Dạng tặng cách có thể chỉ Đấng mà Phao-lô đại diện hoặc làm chứng vì Ngài. “Cho Ngài” tự nhiên trong tiếng Việt, đồng thời không nói thêm ngoài mạch văn.
- source_word: πρὸς πάντας ἀνθρώπους
  choice: trước mọi người
  rationale: πρός hướng lời chứng đến toàn thể đối tượng nghe; “trước mọi người” phù hợp với việc xuất hiện với tư cách nhân chứng. ἄνθρωποι ở đây chỉ con người nói chung, không riêng nam giới.
- source_word: ὧν
  choice: về những điều
  rationale: Đại từ quan hệ sở hữu xác định nội dung của lời chứng; tiếng Việt tự nhiên dùng “về những điều” sau “nhân chứng”.
- source_word: ἑώρακας καὶ ἤκουσας
  choice: anh đã thấy và nghe
  rationale: “Đã” đặt cả hai kinh nghiệm trong quá khứ mà không ép tiếng Việt phải biểu đạt khác biệt thể giữa động từ hoàn thành ἑώρακας và động từ bất định quá khứ ἤκουσας.
theological_decisions:
- issue: Quan hệ của αὐτῷ với vai trò nhân chứng của Phao-lô
  choice: “cho Ngài,” hiểu là Phao-lô làm nhân chứng cho Chúa/Đức Chúa Jêsus
  alternative: “đối với Ngài” hoặc hiểu theo nghĩa sát là “cho/đến Ngài”
  rationale: Mạch văn nói về sự sai phái của Phao-lô để làm chứng trước người khác. Cách dịch chính diễn đạt hợp lý việc làm chứng cho Ngài, còn chú thích giữ lại độ linh hoạt của dạng tặng cách mà không giải quyết quá mức.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Ngài” giữ cách xưng hô tôn kính phù hợp với đối tượng được nhắc đến trong mạch văn; “mọi người” tránh khiến độc giả hiểu sai rằng lời chứng chỉ hướng đến nam giới.
