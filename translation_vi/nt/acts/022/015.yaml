    rationale: “Trước mọi người” có thể gợi chủ yếu việc đứng công khai trước một đám đông. πρός ở đây hướng lời chứng đến mọi người; “với mọi người” giữ hướng này rõ hơn.
  - severity: low
    issue: Diễn đạt chú thích cho αὐτῷ
    rationale: “Đối với Ngài” không phải là một phương án dịch tiếng Việt tự nhiên trong cấu trúc này. “Về Ngài” nêu một cách hiểu gần gũi, không áp đặt quan hệ tặng cách.
