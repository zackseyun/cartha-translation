  to: Vì anh sẽ làm chứng cho Ngài[a] với mọi người[b] về những điều anh đã thấy và nghe.
  rationale: Bản sửa giữ nguyên ý nghĩa và mức độ mơ hồ của nguyên văn, nhưng dùng “làm chứng ... với mọi người” để diễn đạt tự nhiên hơn hướng của lời chứng đến toàn thể con người. Chú thích a được điều chỉnh để cung cấp một phương án tiếng Việt có thể dùng được mà không quyết định quá mức chức năng của αὐτῷ.
