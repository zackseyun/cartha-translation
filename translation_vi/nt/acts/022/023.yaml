  text: ⸀κραυγαζόντων ⸀τε αὐτῶν καὶ ῥιπτούντων τὰ ἱμάτια καὶ κονιορτὸν βαλλόντων εἰς τὸν ἀέρα,
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/023.yaml
  text: And as they were shouting and throwing off their cloaks and flinging dust into the air,[a]
translation:
  language: vi
  text: Trong khi họ la hét, quăng áo ngoài và tung bụi lên không trung,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “quăng áo của họ” hoặc “cởi bỏ áo của họ.” Tiếng Hy Lạp có thể chỉ việc quăng áo đi hoặc vung áo trong lúc kích động.
    reason: lexical_alternative
lexical_decisions:
- source_word: κραυγαζόντων
  choice: la hét
  rationale: Phân từ hiện tại chủ động diễn tả tiếng hô lớn đang tiếp diễn; “la hét” tự nhiên trong tiếng Việt và phù hợp với cảnh đám đông kích động.
- source_word: τε
  choice: và
  rationale: Liên kết hành động đầu tiên với các hành động tiếp theo; “và” truyền đạt quan hệ phối hợp một cách tự nhiên.
- source_word: αὐτῶν
  choice: họ
  rationale: Đại từ sở hữu cách nằm trong kết cấu phân từ được chuyển thành chủ ngữ tường minh để câu tiếng Việt rõ ràng, tự nhiên.
- source_word: ῥιπτούντων
  choice: quăng
  rationale: Động từ có nghĩa là ném hoặc quăng; giữ được sắc thái mạnh và kích động nhưng không mặc nhiên xác định rằng họ đang cởi áo.
- source_word: τὰ ἱμάτια
  choice: áo ngoài
  rationale: Ἱμάτια thường chỉ lớp áo mặc bên ngoài; “áo ngoài” chính xác hơn “áo” nói chung và tự nhiên hơn một thuật ngữ cổ.
- source_word: κονιορτόν
  choice: bụi
  rationale: Nghĩa trực tiếp của danh từ, phù hợp với cử chỉ biểu lộ sự phẫn nộ của đám đông.
- source_word: βαλλόντων
  choice: tung
  rationale: Diễn tả hành động hất hoặc ném bụi lên cao, đồng thời tránh lặp lại “quăng” ngay trước đó.
- source_word: εἰς τὸν ἀέρα
  choice: lên không trung
  rationale: Cách nói tiếng Việt tự nhiên cho hướng chuyển động vào vùng không khí phía trên; không biến ἀήρ thành “bầu trời”.
theological_decisions: []
