  text: καὶ νῦν τί μέλλεις; ἀναστὰς βάπτισαι καὶ ἀπόλουσαι τὰς ἁμαρτίας σου ἐπικαλεσάμενος τὸ ὄνομα ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/016.yaml
  text: And now why are you waiting? Rise[a], be baptized, and wash away your sins[b], calling on his name.
translation:
  language: vi
  text: Bây giờ, sao anh còn chần chừ? Hãy đứng dậy, chịu phép báp-têm và rửa sạch tội lỗi mình, cầu khẩn danh Ngài.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cụm cuối cũng có thể được hiểu với sắc thái phương tiện rõ hơn: “bằng cách cầu khẩn danh Ngài”. Tiếng Hy Lạp không xác định dứt khoát mối liên hệ giữa việc cầu khẩn, chịu phép báp-têm và rửa sạch tội lỗi.'
    reason: alternative_reading
lexical_decisions:
- source_word: τί μέλλεις
  choice: sao anh còn chần chừ
  rationale: Trong câu hỏi này, μέλλω mang sắc thái thúc giục đừng trì hoãn, chứ không hỏi về ý định tương lai. “Sao anh còn chần chừ?” tự nhiên và giữ được tính cấp bách.
- source_word: ἀναστὰς
  choice: hãy đứng dậy
  rationale: Phân từ bất định đi kèm các mệnh lệnh sau đó; chuyển thành mệnh lệnh trong tiếng Việt diễn đạt tự nhiên chuỗi hành động được thúc giục.
- source_word: βάπτισαι
  choice: chịu phép báp-têm
  rationale: Dạng mệnh lệnh trung động được diễn đạt tự nhiên bằng cách nói quen thuộc “chịu phép báp-têm”, không áp đặt thêm cách hiểu thần học về tác nhân hay hiệu lực.
- source_word: ἀπόλουσαι
  choice: rửa sạch
  rationale: Động từ chỉ việc rửa đi hoặc tẩy sạch; “rửa sạch tội lỗi mình” vừa trực tiếp vừa tự nhiên trong tiếng Việt.
- source_word: τὰς ἁμαρτίας σου
  choice: tội lỗi mình
  rationale: Giữ nghĩa thông thường của ἁμαρτία và dùng đại từ phản thân tự nhiên theo chủ thể của các mệnh lệnh.
- source_word: ἐπικαλεσάμενος
  choice: đồng thời cầu khẩn
  rationale: Phân từ có thể biểu thị hoàn cảnh đi kèm hoặc phương tiện. “Đồng thời cầu khẩn” giữ liên hệ với chuỗi mệnh lệnh mà không xác quyết đây chỉ là phương tiện hay chỉ là thời điểm.
- source_word: τὸ ὄνομα αὐτοῦ
  choice: danh Ngài
  rationale: Dịch trực tiếp đại từ αὐτοῦ là “Ngài”, không thay bằng danh xưng “Chúa” hay nêu rõ “Chúa Giê-su” dù ngữ cảnh cho biết đối tượng quy chiếu.
theological_decisions:
- issue: Mối liên hệ giữa phép báp-têm, việc rửa sạch tội lỗi và sự cầu khẩn danh Ngài
  choice: Giữ nguyên chuỗi mệnh lệnh và diễn đạt phân từ theo cách không xác định dứt khoát quan hệ phương tiện.
  alternative: Có thể hiểu phép báp-têm là phương tiện rửa sạch tội lỗi; hoặc việc cầu khẩn danh Ngài là phương tiện; hoặc toàn bộ cụm từ mô tả một tiến trình nhập đạo thống nhất.
  rationale: Cú pháp Hy Lạp đặt hai mệnh lệnh cạnh nhau rồi dùng một phân từ, nhưng không buộc bản dịch phải phân xử tranh luận thần học về hiệu lực bí tích. Bản dịch và chú thích giữ lại độ mở này.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Chần chừ” truyền đạt lời thúc giục; “chịu phép báp-têm” là cách nói phổ thông trong tiếng Việt Cơ Đốc. Dùng “danh Ngài” để giữ đại từ của nguyên văn và sắc thái tôn kính.
