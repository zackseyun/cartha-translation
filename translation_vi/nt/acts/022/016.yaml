review_pass:
  verdict: revise
  source_fidelity: Bản dịch truyền đạt đúng lời thúc giục của τί μέλλεις, chuỗi mệnh lệnh «đứng dậy / chịu phép báp-têm / rửa sạch», và giữ đại từ «Ngài» tương ứng với αὐτοῦ thay vì thêm danh xưng vào nguyên văn. Tuy nhiên, «đồng thời» ấn định phân từ ἐπικαλεσάμενος là hành động xảy ra đồng thời, trong khi phân từ này có thể mang sắc thái đi kèm hoặc phương tiện. Nên bỏ từ này để giữ độ mở của tiếng Hy Lạp.
  naturalness: Câu sửa vẫn là tiếng Việt hiện đại, trang trọng và tự nhiên. Cụm động từ sau dấu phẩy («cầu khẩn danh Ngài») diễn đạt gọn chuỗi hành động liên kết mà không gượng ép quan hệ cú pháp.
  terminology: «Chịu phép báp-têm», «rửa sạch tội lỗi mình», và «cầu khẩn danh Ngài» là các cách dùng dễ hiểu và phù hợp với văn phong Kinh Thánh tiếng Việt hiện đại. «Danh Ngài» giữ được đại từ của bản gốc và lối nói tôn kính thông dụng, không thay thế bằng một danh xưng không có trong câu.
  issues:
  - severity: medium
    issue: «đồng thời cầu khẩn» giới hạn chức năng của ἐπικαλεσάμενος.
    rationale: «Đồng thời» diễn giải phân từ là trạng ngữ thời gian đồng thời. Nguyên văn cho phép, nhưng không bắt buộc, cách hiểu này; phân từ cũng thường được hiểu theo sắc thái phương tiện hoặc hành động đi kèm. Bản dịch chính văn nên không quyết định thay cho độc giả.
