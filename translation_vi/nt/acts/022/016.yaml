  to: Bây giờ, sao anh còn chần chừ? Hãy đứng dậy, chịu phép báp-têm và rửa sạch tội lỗi mình, cầu khẩn danh Ngài.[a]
  rationale: Chỉ bỏ «đồng thời» để tránh áp đặt quan hệ thời gian lên phân từ Hy Lạp. Cấu trúc còn lại giữ nguyên trình tự, giọng điệu khẩn thiết, thuật ngữ và sự mơ hồ thần học của nguyên văn; chú thích tiếp tục nêu khả năng sắc thái phương tiện mà không chọn một cách giải thích giáo phái.
