source:
  edition: SBLGNT
  text: ἀπεκρίθη ⸀δὲ ὁ χιλίαρχος· Ἐγὼ πολλοῦ κεφαλαίου τὴν πολιτείαν ταύτην ἐκτησάμην. ὁ δὲ Παῦλος ἔφη· Ἐγὼ δὲ καὶ γεγέννημαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/028.yaml
  text: But the tribune answered[a], “I acquired this citizenship for a large sum.” But Paul said[b], “But I was even born with it.”
translation:
  language: vi
  text: 'Viên chỉ huy đáp: “Tôi đã phải bỏ ra một số tiền lớn mới có được quyền công dân này.” Nhưng Phao-lô nói: “Còn tôi thì sinh ra đã có quyền ấy.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χιλίαρχος
  choice: viên chỉ huy
  rationale: Chỉ một sĩ quan La Mã chỉ huy đơn vị lớn, theo nghĩa đen liên hệ đến một nghìn quân. “Viên chỉ huy” tự nhiên và dễ hiểu trong tiếng Việt hiện đại mà không áp đặt một thuật ngữ quân hàm dễ gây nhầm.
- source_word: πολλοῦ κεφαλαίου
  choice: phải bỏ ra một số tiền lớn
  rationale: Cụm sở hữu cách mang nghĩa thành ngữ về một khoản tiền lớn; cách diễn đạt này truyền đạt rõ cái giá phải trả và phù hợp lời thoại tiếng Việt.
- source_word: τὴν πολιτείαν ταύτην
  choice: quyền công dân này
  rationale: Trong ngữ cảnh, πολιτεία chỉ địa vị pháp lý của công dân La Mã. “Quyền công dân” làm rõ phương diện pháp lý và tự nhiên hơn “quốc tịch” trong lời thoại này.
- source_word: ἐκτησάμην
  choice: mới có được
  rationale: Động từ trung thái diễn tả việc đạt được hay sở hữu cho mình; “có được” giữ phạm vi nghĩa rộng, còn cấu trúc “phải… mới” kết hợp với khoản tiền thể hiện cái giá cao mà không nhất thiết khẳng định một cơ chế mua bán cụ thể.
- source_word: καὶ γεγέννημαι
  choice: sinh ra đã có quyền ấy
  rationale: Thể hoàn thành thụ động của γεννάω nói đến địa vị có từ khi sinh ra; đối tượng được lược trong tiếng Hy Lạp được bổ sung từ ngữ cảnh. “Đã” diễn đạt trạng thái có sẵn từ lúc sinh, còn sự tương phản của καί được thể hiện tự nhiên qua “Còn tôi thì”.
- source_word: δέ
  choice: nhưng / còn… thì
  rationale: 'Các lần xuất hiện đánh dấu sự chuyển tiếp và tương phản trong đối thoại. Tiếng Việt cần biến đổi cách nối để lời văn tự nhiên: “Nhưng” nối hai lời phát biểu, còn “Còn tôi thì” nêu bật sự đối lập giữa cách hai người có quyền công dân.'
- source_word: ἔφη
  choice: nói
  rationale: Động từ phát ngôn thông dụng, được dịch trung tính là “nói”, không thêm sắc thái như tuyên bố hay phản bác.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Bản dịch ưu tiên lời thoại tự nhiên, đồng thời giữ sự tương phản giữa quyền công dân có được nhờ khoản tiền lớn và quyền công dân có từ khi sinh ra. Không thêm “La Mã” vì câu Hy Lạp chỉ nói “quyền công dân này” và ngữ cảnh đã xác định loại quyền công dân.
