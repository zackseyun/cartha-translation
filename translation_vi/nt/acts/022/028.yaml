  source_fidelity: 'Bản dịch truyền đạt đúng đối lập của nguyên văn: viên chỉ huy có được quyền công dân bằng một khoản tiền lớn, còn Phao-lô có địa vị ấy từ khi sinh ra. “Còn tôi thì” diễn đạt tự nhiên nét tương phản/emphasis của δέ và καί; “quyền ấy” có tiền ngữ rõ ràng.'
