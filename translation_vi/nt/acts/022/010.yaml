  text: εἶπον δέ· Τί ποιήσω, κύριε; ὁ δὲ κύριος εἶπεν πρός με· Ἀναστὰς πορεύου εἰς Δαμασκόν, κἀκεῖ σοι λαληθήσεται περὶ πάντων ὧν τέτακταί σοι ποιῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/010.yaml
  text: Then I said[a], ‘What should I do, Lord?’ And the Lord said to me, ‘Get up and go into Damascus[b], and there you will be told about everything that has been appointed for you to do.’
translation:
  language: vi
  text: 'Tôi thưa: “Lạy Chúa, tôi phải làm gì?” Chúa phán với tôi: “Hãy đứng dậy, đi vào Đa-mách. Tại đó, tôi sẽ cho anh biết mọi điều đã được định cho anh làm.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τί ποιήσω
  choice: con phải làm gì
  rationale: Câu hỏi với động từ giả định bất định mang sắc thái cân nhắc và xin chỉ dẫn; “phải làm gì” tự nhiên trong tiếng Việt và giữ được ý nghĩa về việc cần làm tiếp theo.
- source_word: κύριε / ὁ ... κύριος
  choice: Lạy Chúa / Chúa
  rationale: “Lạy Chúa” phù hợp với lời xưng hô trực tiếp trang trọng; “Chúa” trong mệnh đề kể chuyện giữ sức nặng Kitô học của κύριος trong trình thuật.
- source_word: Ἀναστὰς
  choice: Hãy đứng dậy
  rationale: Phân từ có chức năng mệnh lệnh, diễn tả hành động đứng dậy trước khi lên đường.
- source_word: πορεύου εἰς Δαμασκόν
  choice: đi vào Đa-mách
  rationale: “Đi vào” phản ánh chuyển động hướng vào thành được biểu thị bởi εἰς, đồng thời vẫn tự nhiên trong tiếng Việt.
- source_word: κἀκεῖ
  choice: Tại đó
  rationale: Diễn đạt rõ địa điểm và trình tự của καὶ ἐκεῖ bằng tiếng Việt hiện đại.
- source_word: λαληθήσεται
  choice: con sẽ được cho biết
  rationale: Thể tương lai bị động với đại từ gián tiếp được chuyển thành cấu trúc bị động tự nhiên, không xác định người sẽ truyền đạt.
- source_word: περὶ πάντων
  choice: mọi điều
  rationale: Trong ngữ cảnh của động từ nói, cụm từ chỉ toàn bộ nội dung sẽ được thông báo; “mọi điều” gọn và tự nhiên.
- source_word: τέτακταί σοι ποιῆσαι
  choice: đã được định cho con làm
  rationale: Thể hoàn thành bị động cho thấy những việc ấy đã được ấn định và vẫn có hiệu lực. “Được định” giữ ý về sự sắp đặt mà không áp đặt một hệ thống thần học mạnh hơn câu văn.
theological_decisions:
- issue: Sức nghĩa của τέτακταί đối với sự hướng dẫn và sự kêu gọi của Đức Chúa Trời
  choice: đã được định cho con làm
  alternative: đã được giao cho con làm; con đã được chỉ định để làm
  rationale: Cách dịch giữ nguyên việc các hành động sắp tới của Phao-lô đã được sắp đặt, nhưng không xác quyết vượt quá văn bản về cơ chế hay phạm vi của sự tiền định.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng cặp xưng hô “Chúa–con” trong lời đối thoại để thể hiện sự tôn kính; giữ tên địa danh quen dùng “Đa-mách”. Không thêm chú thích vì các sắc thái chính có thể được thể hiện trực tiếp, rõ ràng trong bản dịch.
