- from: 'Tôi thưa: “Lạy Chúa, con phải làm gì?” Chúa phán với tôi: “Hãy đứng dậy, đi vào Đa-mách. Tại đó, con sẽ được cho biết mọi điều đã được định cho con làm.”'
  to: 'Tôi thưa: “Lạy Chúa, tôi phải làm gì?” Chúa phán với tôi: “Hãy đứng dậy, đi vào Đa-mách. Tại đó, tôi sẽ cho anh biết mọi điều đã được định cho anh làm.”'
  rationale: 'Đổi cách xưng hô trong lời Chúa phán thành “tôi” (Chúa) và “anh” (Phao-lô), đồng thời giữ “tôi” trong lời Phao-lô, để đại từ nhất quán theo từng người nói và không thêm sắc thái quan hệ gia đình. Giữ nguyên các lựa chọn sát nghĩa khác: mệnh lệnh “Hãy đứng dậy”, chuyển động “đi vào”, bị động tương lai “sẽ cho anh biết”, và sắc thái hoàn thành bị động của τέτακται trong “đã được định”.'
