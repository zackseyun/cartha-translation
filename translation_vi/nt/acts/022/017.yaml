id: ACT.22.17
reference: Acts 22:17
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἐγένετο δέ μοι ὑποστρέψαντι εἰς Ἰερουσαλὴμ καὶ προσευχομένου μου ἐν τῷ ἱερῷ γενέσθαι με ἐν ἐκστάσει
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/017.yaml
  text: And it happened to me that[a], after I had returned to Jerusalem and while I was praying in the temple, I fell into a trance[b],
translation:
  language: vi
  text: Rồi sau khi tôi trở về Giê-ru-sa-lem, trong lúc đang cầu nguyện tại đền thờ[a], tôi rơi vào trạng thái xuất thần[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hy Lạp ἱερόν chỉ toàn bộ khuôn viên hay quần thể đền thờ, không chỉ riêng nơi thánh bên trong.
    reason: cultural_note
  - marker: b
    text: 'Cũng có thể dịch: “tôi ở trong trạng thái xuất thần.” Cách nói Hy Lạp sát nghĩa là “trở nên ở trong trạng thái xuất thần,” một thành ngữ chỉ việc bước vào trạng thái thị kiến.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δέ μοι
  choice: Rồi ... tôi
  rationale: Công thức trần thuật này chuyển sang biến cố kế tiếp trong lời kể của Phao-lô và cho biết chính ông là người trải nghiệm. Tiếng Việt tự nhiên không cần dịch máy móc thành “điều ấy xảy ra cho tôi”; “Rồi” giữ mạch kể, còn chủ ngữ “tôi” thể hiện μοι.
- source_word: ὑποστρέψαντι εἰς Ἰερουσαλὴμ
  choice: sau khi tôi trở về Giê-ru-sa-lem
  rationale: Phân từ bất định quá khứ diễn tả hành động xảy ra trước biến cố chính; “sau khi” làm rõ trình tự thời gian.
- source_word: καὶ προσευχομένου μου
  choice: trong lúc đang cầu nguyện
  rationale: Kết cấu sở hữu cách tuyệt đối diễn tả hành động đang diễn ra đồng thời với biến cố chính.
- source_word: ἐν τῷ ἱερῷ
  choice: tại đền thờ
  rationale: Đây là cách nói tự nhiên, dễ hiểu; ἱερόν chỉ toàn bộ khu đền thờ chứ không riêng nơi thánh bên trong, nên sắc thái chính xác hơn được nêu trong chú thích.
- source_word: γενέσθαι με ἐν ἐκστάσει
  choice: tôi rơi vào trạng thái xuất thần
  rationale: γίνομαι kết hợp với ἐν ἐκστάσει diễn tả việc bước vào một trạng thái. “Rơi vào trạng thái xuất thần” là cách diễn đạt tự nhiên, không thêm lời giải thích về cơ chế của kinh nghiệm này.
theological_decisions:
- issue: Bản chất kinh nghiệm ἐκστάσει của Phao-lô
  choice: trạng thái xuất thần
  alternative: trạng thái thị kiến; trạng thái ngây ngất
  rationale: “Xuất thần” diễn đạt một trạng thái ý thức khác thường gắn với thị kiến trong sách Công Vụ, nhưng không quyết định thêm bản chất tâm lý hay cơ chế thần học mà câu này không giải thích.
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại. “Giê-ru-sa-lem” theo lối phiên âm Kinh Thánh quen thuộc; “đền thờ” dễ hiểu trong chính văn, còn chú thích làm rõ phạm vi nghĩa của ἱερόν.
