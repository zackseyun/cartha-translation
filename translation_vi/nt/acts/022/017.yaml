  source_fidelity: 'Bản dịch truyền đạt đúng các quan hệ thời gian và hành động của câu Hy Lạp: việc trở về Giê-ru-sa-lem có trước, việc cầu nguyện tại ἱερόν diễn ra đồng thời, và Phao-lô đi vào trạng thái ἐκστάσει. “Rồi” cùng chủ ngữ “tôi” diễn đạt tự nhiên công thức tự sự Ἐγένετο δέ μοι, không cần lối dịch gượng “điều ấy xảy ra cho tôi.”'
  naturalness: Câu văn hiện đại, rõ ràng và phù hợp văn mạch lời kể trực tiếp. “Rơi vào trạng thái xuất thần” là cách diễn đạt tiếng Việt tự nhiên cho việc bước vào một trạng thái, đồng thời không làm câu trở nên quá khẩu ngữ.
  terminology: “Giê-ru-sa-lem” và “đền thờ” nhất quán với lối dùng Kinh Thánh Việt ngữ. “Trạng thái xuất thần” giữ được tính chất trạng thái thị kiến/ý thức khác thường của ἐκστάσει mà không áp đặt một diễn giải thần học. Chú thích a phân biệt chính xác ἱερόν với nơi thánh bên trong; chú thích b nêu đúng sắc thái thành ngữ của γενέσθαι με ἐν ἐκστάσει.
