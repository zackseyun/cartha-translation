id: ACT.22.11
reference: Acts 22:11
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὡς δὲ οὐκ ἐνέβλεπον ἀπὸ τῆς δόξης τοῦ φωτὸς ἐκείνου, χειραγωγούμενος ὑπὸ τῶν συνόντων μοι ἦλθον εἰς Δαμασκόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/011.yaml
  text: And since I could not see because of the brightness of that light[a], I came into Damascus being led by the hand by those who were with me.
translation:
  language: vi
  text: Vì tôi không thể nhìn thấy do sự chói lòa của ánh sáng ấy[a], nên tôi được những người đi cùng dẫn đi bằng tay vào Đa-mách.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát hơn: “do vinh quang của ánh sáng ấy.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνέβλεπον
  choice: không thể nhìn thấy
  rationale: Trong bối cảnh ánh sáng làm Phao-lô bị mù, động từ diễn tả việc ông không còn khả năng nhìn thấy, chứ không chỉ là không thể nhìn thẳng vào ánh sáng.
- source_word: ἀπὸ τῆς δόξης τοῦ φωτὸς ἐκείνου
  choice: do ánh huy hoàng của luồng sáng ấy
  rationale: δόξα ở đây chỉ vẻ rực rỡ chói lòa của ánh sáng. “Ánh huy hoàng” giữ được sắc thái cao quý của từ mà vẫn diễn đạt nguyên nhân khiến ông không nhìn thấy; chú thích bảo lưu cách dịch sát là “vinh quang”.
- source_word: χειραγωγούμενος
  choice: được ... dắt tay
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt, đồng thời giữ rõ chi tiết ông phải được người khác dẫn đi bằng tay.
- source_word: ὑπὸ τῶν συνόντων μοι
  choice: những người đi cùng
  rationale: Diễn đạt trực tiếp những người có mặt và đồng hành với ông, không hàm ý đây là một nhóm đồng sự chính thức.
- source_word: ἦλθον εἰς Δαμασκόν
  choice: vào Đa-mách
  rationale: Giữ sắc thái chuyển động vào trong địa điểm của εἰς, đồng thời kết hợp tự nhiên với “dắt tay” trong câu tiếng Việt.
- source_word: ὡς δὲ
  choice: Vì ... nên
  rationale: 'Thể hiện quan hệ hoàn cảnh-nguyên nhân trong ngữ cảnh: vì không nhìn thấy nên ông phải được dắt tay vào thành.'
theological_decisions:
- issue: Cách dịch δόξα trong bối cảnh ánh sáng từ trời
  choice: ánh huy hoàng
  alternative: vinh quang; vẻ rực rỡ
  rationale: “Ánh huy hoàng” vừa chỉ độ chói sáng gây mù trong ngữ cảnh trực tiếp, vừa không loại bỏ sắc thái uy nghiêm có thể có của δόξα. Chú thích nêu cách dịch sát “vinh quang” để bảo tồn chiều kích thần hiện và sự mơ hồ từ vựng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Luồng sáng ấy” tự nhiên trong tiếng Việt khi nói về một nguồn sáng đặc biệt; cấu trúc “Vì ... nên ...” làm rõ quan hệ nguyên nhân mà không thêm nội dung ngoài bản Hy Lạp.
