id: ACT.22.30
reference: Acts 22:30
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Τῇ δὲ ἐπαύριον βουλόμενος γνῶναι τὸ ἀσφαλὲς τὸ τί κατηγορεῖται ⸀ὑπὸ τῶν Ἰουδαίων ἔλυσεν ⸀αὐτόν, καὶ ἐκέλευσεν ⸀συνελθεῖν τοὺς ἀρχιερεῖς καὶ ⸀πᾶν τὸ ⸀συνέδριον, καὶ καταγαγὼν τὸν Παῦλον ἔστησεν εἰς αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/030.yaml
  text: But on the next day[a], wanting to know for certain what he was being accused of by the Jews, he released him and ordered the chief priests and the whole council to assemble; and bringing Paul down[b], he set him before them.
translation:
  language: vi
  text: Hôm sau, viên chỉ huy muốn biết chắc Phao-lô bị người Do Thái[a] tố cáo về điều gì, nên ông cởi trói cho Phao-lô và truyền cho các thượng tế cùng toàn thể Hội đồng[b] nhóm lại. Rồi ông đưa Phao-lô xuống và đặt ông đứng trước họ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn Hy Lạp là “người Do Thái”; trong ngữ cảnh, cách gọi này chỉ những người đang tố cáo Phao-lô, không phải mọi người Do Thái không phân biệt.
    reason: lexical_alternative
  - marker: b
    text: “Hội đồng” là Tòa Công Luận, tức cơ quan lãnh đạo của người Do Thái tại Giê-ru-sa-lem.
    reason: cultural_note
lexical_decisions:
- source_word: Τῇ δὲ ἐπαύριον
  choice: Hôm sau
  rationale: Diễn đạt tự nhiên thành ngữ chỉ thời gian “vào ngày hôm sau”; δέ chỉ sự chuyển tiếp nhẹ trong mạch kể nên không cần thêm một liên từ đối lập mạnh.
- source_word: βουλόμενος γνῶναι τὸ ἀσφαλές
  choice: muốn biết chắc
  rationale: Giữ cả ý định của βουλόμενος và ý về sự xác thực, chắc chắn của τὸ ἀσφαλές bằng cách diễn đạt gọn, tự nhiên trong tiếng Việt.
- source_word: τὸ τί κατηγορεῖται ὑπὸ τῶν Ἰουδαίων
  choice: Phao-lô bị người Do Thái tố cáo về điều gì
  rationale: Giữ thể bị động và nội dung điều viên chỉ huy muốn xác minh. “Người Do Thái” phản ánh trực tiếp Ἰουδαίων, còn chú thích làm rõ phạm vi theo ngữ cảnh.
- source_word: ἔλυσεν αὐτόν
  choice: cởi trói cho Phao-lô
  rationale: λύω có thể là tháo, cởi trói hay phóng thích. Trong ngữ cảnh Phao-lô vẫn bị nhà chức trách La Mã quản thúc và được đưa ra trước Hội đồng, “cởi trói” diễn đạt hành động cụ thể mà không hàm ý ông được trả tự do hoàn toàn.
- source_word: ἐκέλευσεν συνελθεῖν
  choice: truyền ... nhóm lại
  rationale: Thể hiện mệnh lệnh có thẩm quyền của viên chỉ huy, đồng thời dùng lối diễn đạt tự nhiên, trang trọng vừa phải.
- source_word: τοὺς ἀρχιερεῖς
  choice: các thượng tế
  rationale: Cách gọi quen thuộc trong tiếng Việt đối với giới lãnh đạo tư tế; số nhiều không có nghĩa là cùng lúc có nhiều người giữ chức thượng tế đương nhiệm.
- source_word: πᾶν τὸ συνέδριον
  choice: toàn thể Hội đồng
  rationale: πᾶν được thể hiện bằng “toàn thể”; συνέδριον được dịch theo chức năng là “Hội đồng”, với chú thích nhận diện cơ quan này.
- source_word: καταγαγὼν τὸν Παῦλον
  choice: đưa Phao-lô xuống
  rationale: Giữ hướng chuyển động “xuống” trong καταγαγών, có lẽ từ đồn lũy đến nơi Hội đồng họp, nhưng không xác định địa điểm ngoài điều bản văn nói.
- source_word: ἔστησεν εἰς αὐτούς
  choice: đặt ông đứng trước họ
  rationale: Diễn đạt ý khiến Phao-lô đứng hiện diện trước Hội đồng; “trước họ” phù hợp bối cảnh trình diện chính thức.
theological_decisions:
- issue: Phạm vi chỉ định của Ἰουδαίων trong sách Công vụ
  choice: người Do Thái
  alternative: các lãnh đạo Do Thái; người Giu-đê
  rationale: Bản văn Hy Lạp dùng Ἰουδαίων. Bản dịch giữ cách gọi rộng về mặt từ vựng thay vì âm thầm thu hẹp đối tượng, còn chú thích nêu rõ rằng trong ngữ cảnh từ này chỉ nhóm đang tố cáo Phao-lô chứ không quy kết cho mọi người Do Thái.
translation_notes:
  register: Văn phong kể chuyện hiện đại, rõ ràng và trang trọng vừa phải. Dùng “viên chỉ huy” để làm rõ chủ thể hàm ẩn từ ngữ cảnh trước; lặp tên Phao-lô ở vế đầu để tránh chuỗi đại từ khó hiểu. Các dấu chú thích được đặt ngay sau những từ ngữ mà chúng giải thích.
