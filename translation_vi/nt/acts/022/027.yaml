  terminology: “Viên chỉ huy” là lựa chọn bao quát, dễ hiểu và phù hợp cho χιλίαρχος trong bối cảnh quân sự La Mã, không áp đặt một cấp bậc Việt ngữ hiện đại. “Công dân Rô-ma” giúp tránh cách hiểu dân tộc/địa lý về “người Rô-ma” và bảo toàn ý nghĩa pháp lý theo văn mạch.
