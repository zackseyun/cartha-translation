  text: προσελθὼν δὲ ὁ χιλίαρχος εἶπεν αὐτῷ· Λέγε μοι, ⸀σὺ Ῥωμαῖος εἶ; ὁ δὲ ἔφη· Ναί.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/027.yaml
  text: So the tribune came up and said to him[a], “Tell me, are you a Roman?” And he said[b], “Yes.”
translation:
  language: vi
  text: 'Viên chỉ huy đến gần và hỏi ông: “Hãy nói cho tôi biết, ông là công dân Rô-ma phải không?” Ông đáp: “Phải.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσελθὼν
  choice: đến gần
  rationale: Phân từ bất định quá khứ của προσέρχομαι cho biết viên chỉ huy tiến lại gần Phao-lô trước khi nói; “đến gần” tự nhiên và giữ rõ chuyển động.
- source_word: δὲ
  choice: và
  rationale: Ở đây δέ chủ yếu nối tiếp diễn biến câu chuyện, không biểu thị sự tương phản mạnh. “Và” phù hợp với lối kể tự nhiên trong tiếng Việt; δέ thứ hai được thể hiện qua sự chuyển sang lời đáp.
- source_word: χιλίαρχος
  choice: viên chỉ huy
  rationale: Trong bối cảnh Công Vụ, từ này chỉ sĩ quan La Mã chỉ huy một đơn vị quân đội. “Viên chỉ huy” rõ nghĩa với độc giả phổ thông hơn thuật ngữ lịch sử chuyên biệt, mà không khẳng định quá mức về cơ cấu quân số.
- source_word: εἶπεν αὐτῷ
  choice: hỏi ông
  rationale: Động từ nghĩa đen là “nói với ông”, nhưng vì lời theo sau là một câu hỏi trực tiếp, “hỏi ông” là cách diễn đạt tự nhiên và chính xác về chức năng lời nói.
- source_word: Λέγε μοι
  choice: Hãy nói cho tôi biết
  rationale: Mệnh lệnh λέγε cùng đại từ gián tiếp μοι được chuyển thành thành ngữ tiếng Việt tự nhiên, vẫn giữ sắc thái yêu cầu trực tiếp.
- source_word: σὺ
  choice: ông
  rationale: Đại từ được nêu rõ trong tiếng Hy Lạp tạo điểm nhấn. Trong tiếng Việt, câu hỏi xác nhận “ông là… phải không?” truyền đạt điểm nhấn tự nhiên mà không cần thêm “chính ông”.
- source_word: Ῥωμαῖος
  choice: công dân Rô-ma
  rationale: Tính từ được dùng như danh từ và trong ngữ cảnh pháp lý này chỉ địa vị công dân La Mã. Tiếng Việt “người Rô-ma” dễ bị hiểu đơn thuần là nguồn gốc dân tộc hoặc nơi cư trú, nên “công dân Rô-ma” diễn đạt đúng ý theo ngữ cảnh.
- source_word: Ναί
  choice: Phải
  rationale: Lời xác nhận ngắn gọn; “Phải” đáp tự nhiên cho câu hỏi “phải không?” và không thêm nội dung ngoài nguyên văn.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “ông” để xưng hô lịch sự; dùng “viên chỉ huy” thay cho thuật ngữ vay mượn chuyên môn. Không cần chú thích vì ý nghĩa pháp lý của Ῥωμαῖος đã được thể hiện rõ ngay trong bản dịch.
