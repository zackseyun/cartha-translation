  source_fidelity: 'Bản dịch truyền đạt đúng diễn tiến của nguyên văn: viên chỉ huy tiến đến, hỏi trực tiếp người đối thoại, và nhận được câu trả lời khẳng định. “Công dân Rô-ma” diễn đạt đúng hàm ý pháp lý của Ῥωμαῖος trong ngữ cảnh liền kề, dù nguyên từ Hy Lạp dùng dạng danh từ hóa ngắn gọn hơn.'
