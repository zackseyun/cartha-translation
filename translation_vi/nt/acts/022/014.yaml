id: ACT.22.14
reference: Acts 22:14
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν· Ὁ θεὸς τῶν πατέρων ἡμῶν προεχειρίσατό σε γνῶναι τὸ θέλημα αὐτοῦ καὶ ἰδεῖν τὸν δίκαιον καὶ ἀκοῦσαι φωνὴν ἐκ τοῦ στόματος αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/014.yaml
  text: And he said[a], ‘The God of our fathers has appointed you to know his will, to see the Righteous One[b], and to hear a voice from his mouth,’
translation:
  language: vi
  text: 'Ông nói: “Đức Chúa Trời của tổ phụ chúng ta đã chỉ định anh[a] để biết ý muốn của Ngài, thấy Đấng Công Chính[b], và nghe một tiếng nói từ chính miệng Đấng ấy.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “đã chọn anh”. Động từ Hy Lạp có thể chỉ việc lựa chọn hoặc chỉ định một người cho một nhiệm vụ.
    reason: lexical_alternative
  - marker: b
    text: “Đấng Công Chính” là một tước hiệu chỉ Chúa Giê-su; cũng có thể dịch là “Đấng Công Bình”.
    reason: alternative_reading
lexical_decisions:
- source_word: προεχειρίσατό
  choice: đã chỉ định
  rationale: Động từ trung gian προχειρίζομαι diễn tả việc chọn và giao cho một nhiệm vụ. “Đã chỉ định” giữ được sắc thái hướng đến sứ mạng được nêu qua ba động từ nguyên mẫu tiếp theo, mà không nhấn quá mức ý nghĩa thời gian.
- source_word: γνῶναι
  choice: để biết
  rationale: Cách dịch ngắn gọn, tự nhiên này thể hiện mục đích của sự chỉ định; thể aorist có thể hàm ý “được biết”, nhưng ngữ cảnh không đòi hỏi phải diễn giải tiến trình nhận biết.
- source_word: τὸ θέλημα αὐτοῦ
  choice: ý muốn của Ngài
  rationale: “Ý muốn” giữ được phạm vi nghĩa rộng của θέλημα và là cách nói tự nhiên khi đề cập đến ý định của Đức Chúa Trời.
- source_word: ἰδεῖν
  choice: được thấy
  rationale: “Thấy” là nghĩa trực tiếp; thêm “được” giúp câu tiếng Việt tự nhiên và cho thấy đây là điều Phao-lô được ban cho trong sự chỉ định.
- source_word: τὸν δίκαιον
  choice: Đấng Công Chính
  rationale: Trong sách Công Vụ, cụm từ này được dùng như một tước hiệu chỉ về Chúa Giê-su. Viết hoa biểu thị chức năng tước hiệu mà không thêm lời giải nghĩa vào câu.
- source_word: ἀκοῦσαι φωνὴν
  choice: nghe tiếng
  rationale: φωνή không có mạo từ và ở đây chỉ tiếng nói được nghe. “Nghe tiếng” tránh xác định quá mức thành “nghe tiếng ấy” hay diễn giải thành “nghe lời”.
- source_word: ἐκ τοῦ στόματος αὐτοῦ
  choice: phát ra từ miệng Ngài
  rationale: Giữ hình ảnh cụ thể của nguyên văn. “Phát ra” được thêm ở mức tối thiểu để cụm từ tự nhiên trong tiếng Việt, đồng thời vẫn nhấn mạnh lời nói trực tiếp từ chính Đấng Công Chính.
- source_word: Ὁ θεὸς τῶν πατέρων ἡμῶν
  choice: Đức Chúa Trời của tổ phụ chúng ta
  rationale: “Tổ phụ” giữ thành ngữ giao ước gắn người nói và người nghe với di sản Israel, đồng thời phản ánh danh từ số nhiều giống đực πατέρων.
theological_decisions:
- issue: τὸν δίκαιον là tước hiệu chỉ Chúa Giê-su hay chỉ là một mô tả
  choice: Dịch như tước hiệu “Đấng Công Chính” chỉ về Chúa Giê-su
  alternative: “người công chính” hoặc “Đấng Công Bình”
  rationale: Cách dùng tương tự trong Công Vụ 3:14 và 7:52 cho thấy đây là một tước hiệu Cơ Đốc luận. Bản dịch giữ tước hiệu nhưng không chèn tên “Chúa Giê-su” vào câu.
- issue: Cách thể hiện πατέρων trong thành ngữ về di sản Israel
  choice: Giữ “tổ phụ chúng ta”
  alternative: “tổ tiên chúng ta” hoặc “cha ông chúng ta”
  rationale: “Tổ phụ” vừa phản ánh hình thức giống đực của từ Hy Lạp vừa giữ sắc thái giao ước của thành ngữ, không biến nó thành một khẳng định giáo phái riêng.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại. “Tổ phụ” và “Đấng Công Chính” giữ sắc thái Kinh Thánh cần thiết; cấu trúc ba vế “biết… được thấy… và nghe…” bám sát sự cân đối của nguyên văn mà vẫn dễ hiểu trong tiếng Việt.
