- from: 'Ông nói: “Đức Chúa Trời của tổ phụ chúng ta đã chỉ định anh[a] để biết ý muốn của Ngài, được thấy Đấng Công Chính[b] và nghe tiếng phát ra từ miệng Ngài.”'
  to: 'Ông nói: “Đức Chúa Trời của tổ phụ chúng ta đã chỉ định anh[a] để biết ý muốn của Ngài, thấy Đấng Công Chính[b], và nghe một tiếng nói từ chính miệng Đấng ấy.”'
  rationale: Sửa tối thiểu để làm rõ φωνή là “một tiếng nói” và để đại từ cuối câu quy chiếu minh bạch về Đấng Công Chính. Cấu trúc ba mục đích của nguyên văn được giữ bằng “biết…, thấy…, và nghe…”.
