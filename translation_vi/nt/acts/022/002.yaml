  text: Ἀκούσαντες δὲ ὅτι τῇ Ἑβραΐδι διαλέκτῳ προσεφώνει αὐτοῖς μᾶλλον παρέσχον ἡσυχίαν. καὶ φησίν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/002.yaml
  text: 'But when they heard that he was addressing them in the Hebrew language[a], they became even more quiet. And he said:'
translation:
  language: vi
  text: 'Nhưng khi họ nghe ông nói với họ bằng tiếng Hê-bơ-rơ[a], họ càng im lặng hơn. Ông nói:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể hiểu là “bằng tiếng A-ram”; nguyên văn Hy Lạp nói “bằng tiếng Hê-bơ-rơ”, nhưng trong bối cảnh này, cụm từ ấy có thể chỉ ngôn ngữ Xê-mít địa phương tại Giu-đê.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀκούσαντες δὲ
  choice: Nhưng khi nghe
  rationale: Phân từ aorist nêu hoàn cảnh thời gian của động từ chính; “khi nghe” tự nhiên trong tiếng Việt, còn “nhưng” diễn tả bước chuyển nhẹ trong diễn biến.
- source_word: τῇ Ἑβραΐδι διαλέκτῳ
  choice: bằng tiếng Hê-bơ-rơ
  rationale: Giữ cách gọi rõ ràng của nguyên văn Hy Lạp là “tiếng Hê-bơ-rơ”, đồng thời chú thích khả năng cụm từ này chỉ tiếng A-ram trong bối cảnh.
- source_word: προσεφώνει αὐτοῖς
  choice: ông nói với họ
  rationale: Động từ imperfect diễn tả lời nói đang hướng đến đám đông; cách dịch này tự nhiên và rõ ràng trong tiếng Việt.
- source_word: μᾶλλον παρέσχον ἡσυχίαν
  choice: họ càng im lặng hơn
  rationale: Chuyển thành ngữ Hy Lạp, theo nghĩa đen là “tạo ra sự yên lặng hơn”, sang cách nói tiếng Việt tự nhiên mà vẫn giữ mức độ gia tăng.
- source_word: καὶ φησίν
  choice: 'Rồi ông nói:'
  rationale: Dịch hiện tại lịch sử bằng thì kể chuyện tự nhiên trong tiếng Việt; “rồi” nối vào lời phát biểu sắp bắt đầu, và dấu hai chấm báo hiệu phần trực tiếp tiếp theo.
theological_decisions:
- issue: Ngôn ngữ được gọi là τῇ Ἑβραΐδι διαλέκτῳ
  choice: Giữ “tiếng Hê-bơ-rơ” trong chính văn
  alternative: Hiểu là “tiếng A-ram”, ngôn ngữ Semit địa phương
  rationale: Đây chủ yếu là vấn đề ngôn ngữ và lịch sử. Vì nguyên văn Hy Lạp gọi là “Hê-bơ-rơ”, chính văn giữ cách gọi ấy, còn chú thích bảo lưu khả năng trong bối cảnh này nó chỉ tiếng A-ram.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “ông” để chỉ Phao-lô theo mạch văn; giữ thuật ngữ ngôn ngữ sát nguyên văn và giải thích sự nhập nhằng lịch sử bằng chú thích.
