  text: καὶ εἶπεν πρός με· Πορεύου, ὅτι ἐγὼ εἰς ἔθνη μακρὰν ἐξαποστελῶ σε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/021.yaml
  text: And he said to me[a], ‘Go, because I will send you far away to the Gentiles.’
translation:
  language: vi
  text: 'Ngài phán với tôi: “Hãy đi, vì ta sẽ sai con đi xa đến với các dân ngoại.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đến với các dân tộc.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν πρός με
  choice: Ngài phán với tôi
  rationale: Cấu trúc λέγω với πρός và đối cách dẫn lời nói trực tiếp với một người. Trong ngữ cảnh Chúa phán, “phán với tôi” tự nhiên và trang trọng.
- source_word: Πορεύου
  choice: Hãy đi
  rationale: Mệnh lệnh thức hiện tại của πορεύομαι được dùng theo nghĩa thành ngữ là đi hoặc lên đường; “Hãy đi” truyền đạt trực tiếp mệnh lệnh.
- source_word: ὅτι
  choice: vì
  rationale: 'ὅτι ở đây nêu lý do cho mệnh lệnh: người nghe phải đi vì sẽ được sai đến một đối tượng ở xa.'
- source_word: ἐγὼ
  choice: ta
  rationale: Đại từ được nêu rõ trong tiếng Hy Lạp tạo sắc thái nhấn mạnh. Đại từ “ta” phù hợp với lời của Chúa nói trực tiếp với Phao-lô.
- source_word: εἰς ἔθνη
  choice: đến với các dân ngoại
  rationale: Trong bối cảnh sứ mạng của Phao-lô trong Công Vụ, ἔθνη chủ yếu chỉ những người không thuộc dân Do Thái; “các dân ngoại” duy trì sự phân biệt lịch sử-thần học ấy.
- source_word: μακρὰν
  choice: ở nơi xa
  rationale: Trạng từ nhấn mạnh khoảng cách; đặt sau đối tượng nhận sứ mạng tạo câu tiếng Việt tự nhiên mà không xác định quá mức địa điểm.
- source_word: ἐξαποστελῶ
  choice: sẽ sai
  rationale: Thì tương lai của ἐξαποστέλλω có nghĩa sai đi. “Sẽ sai” ngắn gọn, tự nhiên và giữ được sắc thái ủy nhiệm trong văn cảnh.
- source_word: σε
  choice: con
  rationale: Đại từ đối cách số ít chỉ Phao-lô. “Con” phù hợp quan hệ xưng hô của Chúa với người được gọi trong tiếng Việt, đồng thời tránh sắc thái thiếu trang trọng của “ngươi” trong ngôn ngữ hiện đại.
theological_decisions:
- issue: Cách dịch ἔθνη trong bối cảnh sứ mạng của sứ đồ
  choice: các dân ngoại
  alternative: các dân tộc
  rationale: “Các dân ngoại” làm rõ đối tượng là những người ngoài dân Do Thái, phù hợp chủ đề xuyên suốt Công Vụ. Tuy nhiên, nghĩa rộng “các dân tộc” vẫn khả hữu về mặt từ vựng nên được giữ trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài—ta—con” cho lời Chúa nói với Phao-lô; giữ câu ngắn và lực mệnh lệnh của nguyên văn.
