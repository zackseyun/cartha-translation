- from: 'Ngài phán với tôi: “Hãy đi, vì ta sẽ sai con đến với các dân ngoại ở nơi xa.”[a]'
  to: 'Ngài phán với tôi: “Hãy đi, vì ta sẽ sai con đi xa đến với các dân ngoại.”[a]'
  rationale: Chỉ điều chỉnh trật tự từ để “đi xa” bổ nghĩa rõ ràng cho hành động sai đi, tương ứng với μακράν. Chú thích được rút gọn để tránh lặp lại thành phần khoảng cách vốn không phải là lựa chọn từ vựng thay thế của ἔθνη.
