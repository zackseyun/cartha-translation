source:
  edition: SBLGNT
  text: ⸀Ἐγώ εἰμι ἀνὴρ Ἰουδαῖος, γεγεννημένος ἐν Ταρσῷ τῆς Κιλικίας, ἀνατεθραμμένος δὲ ἐν τῇ πόλει ταύτῃ παρὰ τοὺς πόδας Γαμαλιήλ, πεπαιδευμένος κατὰ ἀκρίβειαν τοῦ πατρῴου νόμου, ζηλωτὴς ὑπάρχων τοῦ θεοῦ καθὼς πάντες ὑμεῖς ἐστε σήμερον,
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/003.yaml
  text: I am a Jewish man[a], born in Tarsus of Cilicia, but brought up in this city at the feet of Gamaliel, educated according to the strictness of the law of our fathers[b], being zealous for God just as all of you are today.
translation:
  language: vi
  text: “Tôi là một người đàn ông Do Thái, sinh tại Tạt-sơ thuộc Ki-li-ki-a, nhưng lớn lên trong thành này, dưới chân Ga-ma-li-ên[a], được đào tạo một cách nghiêm ngặt theo luật pháp của tổ tiên[b], và là người nhiệt thành đối với Đức Chúa Trời, cũng như tất cả quý vị ngày nay.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Dưới chân Ga-ma-li-ên” là một thành ngữ chỉ việc theo học và được một người thầy đào tạo.
    reason: cultural_note
  - marker: b
    text: Cũng có thể dịch là “luật pháp của cha ông”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνὴρ Ἰουδαῖος
  choice: một người đàn ông Do Thái
  rationale: Giữ cả ý chỉ người nam trưởng thành của ἀνήρ và căn tính Do Thái của Ἰουδαῖος, thay vì chỉ dịch gọn là “người Do Thái”.
- source_word: γεγεννημένος ἐν Ταρσῷ τῆς Κιλικίας
  choice: sinh tại Tạt-sơ thuộc Ki-li-ki-a
  rationale: 'Diễn đạt tự nhiên địa danh và quan hệ địa lý của kết cấu sở hữu cách: Tạt-sơ là thành thuộc Ki-li-ki-a.'
- source_word: ἀνατεθραμμένος δὲ ἐν τῇ πόλει ταύτῃ
  choice: nhưng lớn lên trong thành này
  rationale: ἀνατρέφω ở đây nói về việc được nuôi dạy và trưởng thành; “nhưng” thể hiện sự tương phản giữa nơi sinh và nơi lớn lên.
- source_word: παρὰ τοὺς πόδας Γαμαλιήλ
  choice: dưới chân Ga-ma-li-ên
  rationale: Giữ hình ảnh cụ thể của thành ngữ môn sinh ngồi dưới chân thầy; chú thích giải thích ý nghĩa đào tạo.
- source_word: πεπαιδευμένος κατὰ ἀκρίβειαν
  choice: được đào tạo nghiêm ngặt
  rationale: Kết hợp ý được giáo dục của πεπαιδευμένος với tính chính xác, chặt chẽ của ἀκρίβεια bằng cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: τοῦ πατρῴου νόμου
  choice: theo luật pháp của tổ tiên
  rationale: πατρῷος chỉ điều thuộc về cha ông hoặc tổ tiên. Cách dịch này không thêm đại từ “chúng ta” vốn không được nêu trực tiếp trong tiếng Hy Lạp, nhưng vẫn giữ di sản chung hàm chứa trong diễn từ.
- source_word: ζηλωτὴς ὑπάρχων τοῦ θεοῦ
  choice: nhiệt thành vì Đức Chúa Trời
  rationale: Truyền đạt lòng sốt sắng hướng về Đức Chúa Trời mà không gợi nghĩa kỹ thuật-chính trị có thể có của danh xưng “người thuộc phái Quá Khích”.
- source_word: καθὼς πάντες ὑμεῖς ἐστε σήμερον
  choice: cũng như tất cả quý vị ngày nay
  rationale: Giữ phép so sánh và sự đồng nhất về mặt tu từ của Phao-lô với toàn thể thính giả trong hiện tại.
theological_decisions:
- issue: Cách diễn đạt πατρῴου νόμου và sự liên đới của Phao-lô với thính giả Do Thái
  choice: luật pháp của tổ tiên
  alternative: luật pháp của cha ông chúng ta
  rationale: Bản dịch chính giữ sát tính từ “thuộc về tổ tiên” và tránh thêm đại từ sở hữu không có trực tiếp trong nguyên văn. Chú thích nêu cách diễn đạt tương đương, còn sự liên đới cộng đồng vẫn được văn cảnh thể hiện.
- issue: Có giữ thành ngữ παρὰ τοὺς πόδας Γαμαλιήλ hay diễn giải hay không
  choice: dưới chân Ga-ma-li-ên
  alternative: theo học Ga-ma-li-ên
  rationale: Giữ hình ảnh lịch sử về quan hệ thầy-trò mà không làm mất khả năng hiểu của độc giả, vì ý nghĩa văn hóa được giải thích trong chú thích.
- issue: Ý nghĩa của ζηλωτής
  choice: nhiệt thành vì Đức Chúa Trời
  alternative: một người sốt sắng đối với Đức Chúa Trời
  rationale: Cách dịch được chọn giữ lòng nhiệt thành tôn giáo trong văn cảnh, nhưng không biến từ này thành nhãn hiệu của một phong trào chính trị hay giáo phái.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “quý vị” để phản ánh lời Phao-lô trực tiếp nói với đám đông; phiên âm các địa danh và tên riêng theo lối quen dùng trong Kinh Thánh tiếng Việt. Tách thành hai câu để lời nói rõ ràng mà vẫn giữ mạch cú pháp và phép so sánh của nguyên văn.
