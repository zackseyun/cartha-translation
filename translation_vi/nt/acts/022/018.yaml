  text: καὶ ἰδεῖν αὐτὸν λέγοντά μοι· Σπεῦσον καὶ ἔξελθε ἐν τάχει ἐξ Ἰερουσαλήμ, διότι οὐ παραδέξονταί ⸀σου μαρτυρίαν περὶ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/018.yaml
  text: and I saw him saying to me[a], ‘Hurry and get out of Jerusalem quickly, because they will not accept your testimony about me.’
translation:
  language: vi
  text: 'và tôi thấy Ngài phán với tôi: “Hãy mau lên và lập tức rời khỏi Giê-ru-sa-lem, vì họ sẽ không tiếp nhận lời làm chứng của anh về Ta.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδεῖν
  choice: tôi thấy
  rationale: Dù về hình thức là động từ nguyên mẫu, trong cấu trúc kể chuyện này từ ấy tiếp nối lời thuật về khải tượng; cách dịch hữu hạn “tôi thấy” tự nhiên trong tiếng Việt và giữ rõ ý tri giác bằng thị kiến.
- source_word: αὐτὸν λέγοντά μοι
  choice: Ngài phán với tôi
  rationale: Đại từ chỉ Đấng đã hiện ra trong ngữ cảnh trước. Tiếng Việt thường dùng đại từ tôn kính “Ngài” cho rõ quan hệ quy chiếu; “phán” phù hợp với lời của Chúa, còn “với tôi” giữ đối tượng gián tiếp μοι.
- source_word: Σπεῦσον καὶ ἔξελθε ἐν τάχει
  choice: Hãy mau lên, lập tức rời khỏi
  rationale: Hai cách diễn đạt về sự khẩn cấp trong tiếng Hy Lạp đều được giữ lại. “Rời khỏi” truyền đạt tự nhiên chuyển động ra khỏi thành, còn “lập tức” thể hiện ἐν τάχει mà không tạo câu tiếng Việt nặng nề.
- source_word: ἐξ Ἰερουσαλήμ
  choice: khỏi Giê-ru-sa-lem
  rationale: “Khỏi” diễn tả chuyển động ra khỏi thành do giới từ ἐξ biểu thị.
- source_word: διότι
  choice: vì
  rationale: Liên từ này nêu lý do cho mệnh lệnh; “vì” là cách nối câu tự nhiên và trang trọng vừa phải.
- source_word: οὐ παραδέξονταί
  choice: họ sẽ không tiếp nhận
  rationale: παραδέχομαι ở đây mang nghĩa đón nhận hoặc chấp nhận thuận lợi. “Tiếp nhận” tự nhiên với “lời làm chứng” và vẫn bảo lưu sắc thái “receive” bên cạnh “accept”.
- source_word: σου μαρτυρίαν
  choice: lời làm chứng của con
  rationale: μαρτυρία là lời chứng hoặc sự làm chứng. “Lời làm chứng” rõ nghĩa đối với độc giả phổ thông; “của con” phản ánh đại từ sở hữu và quan hệ giữa Chúa với Phao-lô trong lời trực tiếp.
- source_word: περὶ ἐμοῦ
  choice: về Ta
  rationale: περί với sở hữu cách chỉ đối tượng được nói đến. “Về Ta” ngắn gọn, tự nhiên và giữ lời nói trực tiếp của Đấng hiện ra.
theological_decisions:
- issue: Đối tượng của αὐτόν trong lời thuật về khải tượng
  choice: Dùng đại từ “Ngài” thay vì thêm danh xưng “Chúa” hay tên “Chúa Giê-xu”.
  alternative: Dịch rõ thành “Chúa” hoặc “Chúa Giê-xu”; hoặc dùng “người ấy”.
  rationale: Ngữ cảnh trước xác định người phán, nhưng câu Hy Lạp chỉ dùng đại từ. “Ngài” không thêm danh xưng vào bản văn, đồng thời tự nhiên hơn trong tiếng Việt và giữ sự tôn kính thích hợp.
- issue: Đại từ trong lời Chúa nói với Phao-lô
  choice: Dùng cặp “con—Ta”.
  alternative: Dùng “ngươi—Ta” hoặc đại từ trung tính hơn.
  rationale: “Con—Ta” truyền đạt tự nhiên mối quan hệ trong lời phán và dễ hiểu với độc giả hiện đại, nhưng không nhằm xác lập một chủ thuyết riêng về mối quan hệ ấy.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Câu giữ cả hai yếu tố nhấn mạnh sự khẩn cấp trong nguyên văn, đồng thời tránh lối nói cổ như “hãy cấp tốc ra đi”. Không đặt chú thích vì phương án “tiếp nhận” đã trực tiếp bảo lưu sắc thái từ vựng mà bản tiếng Anh nêu như một lựa chọn.
