  verdict: revise
  source_fidelity: 'Bản dịch giữ đúng các yếu tố chính của câu Hy Lạp: ngôi thứ nhất của người kể, hành động ngã xuống đất, việc nghe một giọng nói ngỏ với người kể, sự lặp lại tên Sau-lơ, và câu hỏi về việc bắt bớ chính người nói. Cặp “ngươi—ta” bảo toàn rõ các ngôi xưng hô trong lời trực tiếp và không diễn giải đại từ με.'
  naturalness: Cụm “nghe một tiếng nói với tôi” chưa tự nhiên về cú pháp tiếng Việt, vì “nói với tôi” cần được gắn rõ với chủ thể là tiếng/giọng nói. “Nghe một tiếng nói bảo tôi” tự nhiên hơn, vẫn sát nghĩa của φωνῆς λεγούσης μοι, và phù hợp văn phong trang nghiêm hiện đại.
  terminology: “Sau-lơ” là dạng phiên âm Kinh Thánh Việt ngữ quen thuộc và chấp nhận được cho Σαούλ. “Bắt bớ” diễn đạt đúng nghĩa ngữ cảnh của διώκεις. Không thêm diễn giải thần học cho “ta”.
