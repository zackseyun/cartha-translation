  rationale: Chỉ điều chỉnh cú pháp để diễn đạt rõ và tự nhiên hơn quan hệ giữa “một tiếng nói” với phân từ λεγούσης và đại từ μοι. Các lựa chọn về tên riêng, đại từ, thuật ngữ “bắt bớ”, và tính trực tiếp của lời nói đều được giữ nguyên.
