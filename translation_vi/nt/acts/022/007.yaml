  text: ἔπεσά τε εἰς τὸ ἔδαφος καὶ ἤκουσα φωνῆς λεγούσης μοι· Σαοὺλ Σαούλ, τί με διώκεις;
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/007.yaml
  text: I fell to the ground and heard a voice saying to me, ‘Saul, Saul, why are you persecuting me?’
translation:
  language: vi
  text: 'Tôi ngã xuống đất và nghe một tiếng nói bảo tôi: “Sau-lơ, Sau-lơ, sao ngươi bắt bớ ta?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔπεσά
  choice: Tôi ngã
  rationale: Động từ aorist chủ động ngôi thứ nhất số ít của πίπτω, diễn tả một hành động đã xảy ra; “ngã” là cách dịch tự nhiên, còn hướng rơi được nêu trong cụm tiếp theo.
- source_word: τε
  choice: không dịch riêng
  rationale: Tiểu từ τε nối mệnh đề này với phần trước; trong tiếng Việt, mạch kể và liên từ “và” phía sau đã đủ tự nhiên, nên không cần thêm một từ nối riêng.
- source_word: εἰς τὸ ἔδαφος
  choice: xuống đất
  rationale: Đây là cách nói tự nhiên trong tiếng Việt về nơi hoặc hướng rơi; sát ngữ cảnh hơn “xuống mặt đất” vốn dài hơn mà không thêm nghĩa đáng kể.
- source_word: ἤκουσα φωνῆς
  choice: nghe một tiếng
  rationale: φωνή trong ngữ cảnh có lời nói trực tiếp chỉ một tiếng nói/giọng nói. “Nghe một tiếng nói” dễ gây cảm giác lặp từ trong tiếng Việt, nên “nghe một tiếng nói với tôi” được hiểu tự nhiên là nghe một tiếng đang cất lời.
- source_word: λεγούσης μοι
  choice: nói với tôi
  rationale: Phân từ hiện tại bổ nghĩa cho φωνῆς, diễn tả lời đang được nói đồng thời với việc nghe; đại từ μοι được giữ rõ bằng “với tôi”.
- source_word: Σαοὺλ Σαούλ
  choice: Sau-lơ, Sau-lơ
  rationale: Phiên âm tên riêng theo cách quen thuộc trong tiếng Việt và giữ nguyên sự lặp lại mang tính nhấn mạnh, gọi trực tiếp.
- source_word: τί
  choice: sao
  rationale: Trong câu hỏi về lý do của một hành động, τί mang nghĩa “tại sao/vì sao”; “sao” tự nhiên trong lời nói trực tiếp mà vẫn trang trọng vừa phải.
- source_word: με
  choice: ta
  rationale: Giữ nguyên đại từ ngôi thứ nhất chỉ chính người đang nói. “Ta” phù hợp với lời phán trực tiếp trong văn phong Kinh Thánh tiếng Việt mà không thêm lời giải thích.
- source_word: διώκεις
  choice: ngươi bắt bớ
  rationale: Trong ngữ cảnh Sau-lơ thù nghịch và truy hại những người tin Chúa Giê-su, διώκω mang nghĩa “bắt bớ”. Thì hiện tại cho thấy hành động đang tiếp diễn; tiếng Việt thể hiện thích hợp qua ngữ cảnh câu hỏi trực tiếp.
theological_decisions:
- issue: Mối liên hệ giữa người đang nói và những người bị Sau-lơ bắt bớ
  choice: Giữ nguyên lời trực tiếp “ta”
  alternative: Diễn giải thành “dân ta”, “những người theo ta” hoặc “các môn đồ của ta”
  rationale: Bản Hy Lạp trực tiếp nói με, “ta/tôi”, qua đó đồng nhất việc bắt bớ các tín hữu với việc bắt bớ chính người đang nói. Không nên diễn giải để làm giảm hoặc giải quyết sức căng thần học này.
translation_notes:
  register: Tiếng Việt hiện đại, rõ ràng và trang nghiêm. Cặp xưng hô “ngươi—ta” được dùng trong lời phán trực tiếp để giữ sắc thái uy nghiêm quen thuộc, nhưng phần trần thuật dùng “tôi” tự nhiên. Không cần chú thích vì câu không có dị bản hay điểm mơ hồ cần giải thích trong bản văn chính.
