translation:
  language: vi
  text: “Thưa các ông, anh em và các bậc cha chú, xin hãy nghe lời biện hộ mà tôi nay trình bày với quý vị.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἄνδρες ἀδελφοὶ καὶ πατέρες
  choice: Thưa anh em và các bậc cha chú
  rationale: Đây là công thức xưng hô trang trọng với những người nam cùng dân tộc và các vị lớn tuổi đáng kính. Tiếng Việt không cần dịch tách Ἄνδρες thành “những người đàn ông”; “thưa” cùng hai nhóm xưng hô truyền đạt tự nhiên chức năng hô cách và sắc thái kính trọng.
- source_word: ἀκούσατέ
  choice: xin hãy nghe
  rationale: Mệnh lệnh số nhiều được diễn đạt bằng “xin hãy” để giữ lời kêu gọi trực tiếp nhưng lịch sự trong diễn văn công khai.
- source_word: μου ... ἀπολογίας
  choice: lời biện hộ tôi trình bày
  rationale: ἀπολογία là lời tự bào chữa hoặc biện hộ chính thức, không phải lời xin lỗi. Thêm “trình bày” làm rõ quan hệ giữa người nói và lời biện hộ một cách tự nhiên trong tiếng Việt.
- source_word: πρὸς ὑμᾶς
  choice: với quý vị
  rationale: Cụm từ chỉ lời biện hộ hướng đến những người nghe. “Với quý vị” giữ sắc thái kính trọng và tránh cách diễn đạt thiếu tự nhiên “đến quý vị”.
- source_word: νυνὶ
  choice: lúc này
  rationale: Giữ ý nhấn mạnh tính tức thời của νυνί; đặt cuối câu phù hợp nhịp câu tiếng Việt.
