  naturalness: Câu hiện tại trang trọng và dễ hiểu. Bản sửa dùng “các ông” để phản ánh thành tố mở đầu của nguyên văn; chuỗi xưng hô hơi đánh dấu theo nguyên ngữ nhưng vẫn chấp nhận được trong một bài diễn từ trang trọng. “Nay” đặt gần hành động trình bày, diễn đạt tự nhiên tính tức thời của νυνί.
  terminology: “Anh em” thích hợp cho ἀδελφοί; “các bậc cha chú” truyền đạt lối gọi kính trọng dành cho những người nam lớn tuổi của πατέρες mà không áp đặt nghĩa chức vụ. “Lời biện hộ” là cách dịch đúng cho ἀπολογία trong ngữ cảnh này.
