  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: κἀγὼ εἶπον· Κύριε, αὐτοὶ ἐπίστανται ὅτι ἐγὼ ἤμην φυλακίζων καὶ δέρων κατὰ τὰς συναγωγὰς τοὺς πιστεύοντας ἐπὶ σέ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/019.yaml
  text: And I said[a], ‘Lord[b], they themselves know that in every synagogue I was imprisoning and beating those who believe in you.’
translation:
  language: vi
  text: 'Tôi thưa: “Lạy Chúa, chính họ biết rằng trong khắp các hội đường, tôi từng bỏ tù và đánh đập những người tin nơi Ngài.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κἀγὼ εἶπον
  choice: Tôi thưa
  rationale: κἀγώ là καὶ ἐγώ; trong mạch kể chuyện, tiếng Việt không cần dịch máy móc καί là “và”. “Thưa” diễn đạt tự nhiên lời nói trực tiếp kính cẩn với Chúa.
- source_word: Κύριε
  choice: Lạy Chúa
  rationale: Dạng hô cách κύριε được diễn đạt tự nhiên bằng “Lạy Chúa”, vừa giữ sắc thái kính cẩn vừa bảo toàn sức nặng Kitô học trong lời Phao-lô nói với Chúa Giê-su.
- source_word: αὐτοὶ ἐπίστανται
  choice: chính họ biết
  rationale: “Chính họ” giữ sự nhấn mạnh của αὐτοί rằng những người ấy đích thân biết rõ quá khứ của Phao-lô.
- source_word: ἤμην φυλακίζων καὶ δέρων
  choice: tôi từng bỏ tù và đánh đập
  rationale: Kết cấu vị biến cách với hai phân từ diễn tả hành động kéo dài hoặc lặp lại trong quá khứ. “Từng” truyền đạt thói quen trước kia tự nhiên hơn trong tiếng Việt; “đánh đập” không thu hẹp nghĩa thành một hình thức roi vọt tư pháp cụ thể.
- source_word: κατὰ τὰς συναγωγάς
  choice: trong khắp các hội đường
  rationale: κατά với đối cách mang nghĩa phân bố qua nhiều hội đường. “Trong khắp các hội đường” vừa tự nhiên vừa giữ ý hành động lặp lại tại nhiều nơi.
- source_word: τοὺς πιστεύοντας ἐπὶ σέ
  choice: những người tin nơi Ngài
  rationale: πιστεύω ἐπί với đối cách chỉ lòng tin hướng về Chúa Giê-su. “Tin nơi Ngài” là cách diễn đạt trang trọng, dễ hiểu và không thêm nghĩa ngoài bản văn.
theological_decisions:
- issue: Cách dịch κύριος khi trực tiếp thưa với Chúa Giê-su
  choice: Lạy Chúa
  alternative: Thưa Chủ
  rationale: “Lạy Chúa” là cách xưng hô tiếng Việt tự nhiên đối với κύριε, giữ cả sự kính trọng lẫn sức nặng của danh xưng mà không giải thích vượt quá bản văn.
- issue: Khía cạnh kéo dài hoặc thường xuyên của việc bắt bớ trước kia
  choice: tôi từng bỏ tù và đánh đập
  alternative: tôi đã bỏ tù và đánh đập
  rationale: “Từng” thể hiện rõ hơn hành động quen làm trong quá khứ do ἤμην kết hợp với các phân từ, nhưng không quy định chính xác tần suất.
- issue: Ý nghĩa của πιστεύοντας ἐπὶ σέ
  choice: những người tin nơi Ngài
  alternative: những người đặt lòng tin nơi Ngài
  rationale: “Tin nơi Ngài” giữ được cả ý tin và tín thác của cấu trúc Hy Lạp mà không buộc bản văn theo một cách diễn giải thần học riêng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” trong lời trực tiếp thưa với Chúa; giữ “hội đường” là thuật ngữ quen thuộc. Không thêm chú thích vì các sắc thái phân bố và hành động thường xuyên đã được chuyển đạt ngay trong câu.
