  text: Ἁνανίας δέ τις ἀνὴρ ⸀εὐλαβὴς κατὰ τὸν νόμον μαρτυρούμενος ὑπὸ πάντων τῶν κατοικούντων Ἰουδαίων,
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/012.yaml
  text: A certain man[a], Ananias, devout according to the law, well spoken of by all the Jews living there,
translation:
  language: vi
  text: Có một người tên là A-na-nia, mộ đạo theo Luật pháp, có tiếng tốt với tất cả người Do Thái[a] cư ngụ tại đó,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “người Giu-đê” nếu hiểu đây là một thuật ngữ sắc tộc-địa lý thay vì chỉ cộng đồng tôn giáo.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἁνανίας
  choice: A-na-nia
  rationale: Phiên âm tên riêng theo cách viết quen thuộc, dễ đọc trong tiếng Việt.
- source_word: δέ
  choice: không dịch thành một từ riêng
  rationale: Tiểu từ này chỉ đánh dấu sự chuyển ý nhẹ trong lời kể; trong câu tiếng Việt đang tiếp nối ngữ cảnh, thêm “bấy giờ” hay “nhưng” dễ làm ý thời gian hoặc tương phản mạnh hơn nguyên văn.
- source_word: τις ἀνὴρ
  choice: có một người
  rationale: Giữ ý giới thiệu một người nam cụ thể nhưng trước đó chưa được xác định; cấu trúc này tự nhiên hơn “một người nọ” trong tiếng Việt hiện đại.
- source_word: εὐλαβής
  choice: sùng kính
  rationale: Diễn đạt lòng tôn kính cùng sự nghiêm túc trong đời sống tôn giáo, không mang sắc thái miệt thị hay quá cổ.
- source_word: κατὰ τὸν νόμον
  choice: theo Luật pháp
  rationale: Giữ mối liên hệ trực tiếp giữa sự sùng kính của A-na-nia và Luật pháp Môi-se; viết hoa “Luật pháp” để chỉ khung luật pháp cụ thể của Do Thái giáo.
- source_word: μαρτυρούμενος
  choice: được ... đánh giá tốt
  rationale: Truyền đạt lời chứng thuận lợi và danh tiếng tốt do cộng đồng dành cho ông bằng cách nói tự nhiên trong tiếng Việt hiện đại.
- source_word: ὑπὸ πάντων
  choice: được tất cả
  rationale: Giữ vai trò tác nhân và sức khái quát của πάντων.
- source_word: τῶν κατοικούντων Ἰουδαίων
  choice: người Do Thái cư ngụ tại đó
  rationale: Phân từ chỉ những người đang cư trú tại địa điểm đã rõ trong ngữ cảnh, tức Đa-mách; “tại đó” làm rõ địa điểm mà không đưa tên nơi chốn vào nguyên câu.
theological_decisions:
- issue: Cách dịch Ἰουδαίων
  choice: người Do Thái
  alternative: người Giu-đê
  rationale: Trong ngữ cảnh này, cụm từ chỉ cộng đồng Do Thái đang cư trú tại Đa-mách và lời chứng của họ về A-na-nia, nên bản sắc cộng đồng-tôn giáo nổi bật hơn nguồn gốc địa lý. Chú thích vẫn bảo lưu khả năng hiểu theo nghĩa sắc tộc-địa lý.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu giữ dấu phẩy cuối vì đây là một thành phần đang tiếp nối lời kể của Phao-lô trong câu kế tiếp. Dấu chú thích được đặt ngay sau “người Do Thái”, là từ ngữ mà chú thích giải thích.
