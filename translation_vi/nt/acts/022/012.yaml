- from: Có một người tên là A-na-nia, sùng kính theo Luật pháp và được tất cả người Do Thái[a] cư ngụ tại đó đánh giá tốt,
  to: Có một người tên là A-na-nia, mộ đạo theo Luật pháp, có tiếng tốt với tất cả người Do Thái[a] cư ngụ tại đó,
  rationale: Chỉ chỉnh các kết hợp từ để tiếng Việt hiện đại tự nhiên hơn, đồng thời bảo toàn cấu trúc câu chưa hoàn tất và dấu phẩy cuối theo nguyên văn/ngữ cảnh. Không thêm địa danh “Đa-mách” vào câu, vì địa điểm đã được chỉ bằng “tại đó” theo ngữ cảnh.
