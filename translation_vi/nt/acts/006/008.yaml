source:
  edition: SBLGNT
  text: Στέφανος δὲ πλήρης ⸀χάριτος καὶ δυνάμεως ἐποίει τέρατα καὶ σημεῖα μεγάλα ἐν τῷ λαῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/008.yaml
  text: Stephen[a], full of grace and power, was doing great wonders and signs among the people.
translation:
  language: vi
  text: Ê-tiên[a], đầy ân sủng và quyền năng, đã làm những việc kỳ diệu và dấu lạ lớn lao giữa dân chúng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Một số thủ bản chép “đầy đức tin và quyền năng” thay cho “đầy ân sủng và quyền năng”.
    reason: textual_variant
lexical_decisions:
- source_word: δὲ
  choice: không dịch thành một từ riêng
  rationale: δέ là từ nối nhẹ để tiếp diễn câu chuyện; trong tiếng Việt, mạch văn tự nhiên không cần thêm “bấy giờ” hay “nhưng”, vì những từ ấy dễ tạo sắc thái thời gian hoặc tương phản quá mức.
- source_word: πλήρης χάριτος καὶ δυνάμεως
  choice: đầy ân sủng và quyền năng
  rationale: Cấu trúc πλήρης với sở hữu cách diễn tả Ê-tiên được đầy dẫy hoặc mang đặc tính của ân sủng và quyền năng. “Ân sủng” giữ được chiều kích thần học của χάρις, còn “quyền năng” phù hợp với ngữ cảnh các phép lạ.
- source_word: ἐποίει
  choice: vẫn làm
  rationale: Thì chưa hoàn thành diễn tả hoạt động đang tiếp diễn hoặc thường xuyên trong quá khứ. “Vẫn làm” truyền đạt tính kéo dài trong văn kể chuyện Việt ngữ mà không diễn giải quá mức.
- source_word: τέρατα καὶ σημεῖα μεγάλα
  choice: những việc kỳ diệu và dấu lạ lớn
  rationale: 'Giữ hai thành tố của cặp từ quen thuộc trong Lu-ca—Công Vụ: τέρατα nhấn mạnh tính gây kinh ngạc, còn σημεῖα nhấn mạnh chức năng làm dấu. μεγάλα bổ nghĩa cho cả hai và được giữ bằng “lớn”.'
- source_word: ἐν τῷ λαῷ
  choice: giữa dân chúng
  rationale: ἐν ở đây chỉ phạm vi hoạt động. “Giữa dân chúng” là cách nói tự nhiên, dễ hiểu, không buộc cụm từ phải mang nghĩa chuyên biệt hơn mức văn bản cho phép.
theological_decisions:
- issue: Dị bản χάριτος/πίστεως
  choice: ân sủng
  alternative: đức tin
  rationale: Bản SBLGNT được cung cấp đọc χάριτος, nên chính văn dịch là “ân sủng”. Dị bản πίστεως có ý nghĩa giải thích và thần học nên được ghi ở chú thích thay vì bị bỏ qua hoặc đưa vào chính văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng tên quen thuộc “Ê-tiên”. Cụm “việc kỳ diệu và dấu lạ” giữ sự phân biệt của hai danh từ Hy Lạp; “vẫn làm” thể hiện khía cạnh tiếp diễn của động từ ở thì chưa hoàn thành.
