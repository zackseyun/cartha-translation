id: ACT.6.9
reference: Acts 6:9
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀνέστησαν δέ τινες τῶν ἐκ τῆς συναγωγῆς τῆς λεγομένης Λιβερτίνων καὶ Κυρηναίων καὶ Ἀλεξανδρέων καὶ τῶν ἀπὸ Κιλικίας καὶ Ἀσίας συζητοῦντες τῷ Στεφάνῳ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/009.yaml
  text: But some of those from the synagogue called the Synagogue of the Freedmen[a], and of the Cyrenians and Alexandrians, and of those from Cilicia and Asia[b], stood up and began arguing with Stephen.
translation:
  language: vi
  text: Nhưng có một số người thuộc hội đường, gọi là hội đường của những người được trả tự do, cùng với người Ky-rê-nê, người A-léc-xan-đri-a và những người từ Ki-li-ki-a và A-si-a[b], đứng lên tranh luận với Ê-tiên.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: “A-si-a” ở đây là tỉnh A-si-a của La Mã, nằm ở phía tây Tiểu Á, không phải toàn bộ châu Á theo nghĩa hiện đại.
    reason: cultural_note
lexical_decisions:
- source_word: ἀνέστησαν
  choice: đứng lên
  rationale: Giữ hình ảnh cụ thể của động từ ἀνίστημι và sắc thái đứng ra chống đối trong văn cảnh.
- source_word: δέ
  choice: Nhưng
  rationale: Đánh dấu bước chuyển nhẹ mang tính tương phản, từ chức vụ đầy quyền năng của Ê-tiên sang sự chống đối.
- source_word: τινες τῶν ἐκ τῆς συναγωγῆς
  choice: một số người thuộc hội đường
  rationale: 'Diễn đạt tự nhiên cấu trúc sở thuộc bộ phận: một số người trong nhóm gắn với hội đường ấy.'
- source_word: συναγωγῆς
  choice: hội đường
  rationale: Thuật ngữ tiếng Việt thông dụng chỉ nơi hội họp và cộng đồng thờ phượng của người Do Thái.
- source_word: τῆς λεγομένης
  choice: gọi là
  rationale: Giới thiệu tên gọi được biết đến của hội đường một cách trực tiếp và trung tính.
- source_word: Λιβερτίνων
  choice: Những Người Được Tự Do
  rationale: Chuyển nghĩa lịch sử của Libertini, tức những người đã được giải phóng khỏi thân phận nô lệ hoặc có thể là hậu duệ của họ, thay vì phiên âm một tên gọi dễ tối nghĩa.
- source_word: Κυρηναίων καὶ Ἀλεξανδρέων
  choice: người Ky-rê-nê, người A-léc-xan-đ-ri-a
  rationale: Diễn đạt các danh xưng chỉ người theo địa danh bằng hình thức rõ ràng, tự nhiên trong tiếng Việt.
- source_word: τῶν ἀπὸ Κιλικίας καὶ Ἀσίας
  choice: những người đến từ Ki-li-ki-a và A-si-a
  rationale: ἀπό với địa danh biểu thị xuất xứ; cách dịch này giữ nguyên hai địa danh mà không thêm diễn giải vào chính văn.
- source_word: συζητοῦντες
  choice: tranh luận với
  rationale: Trong văn cảnh chống đối, động từ chỉ sự trao đổi mang tính tranh biện, mạnh hơn trò chuyện trung tính nhưng không nhất thiết là cãi vã.
- source_word: τῷ Στεφάνῳ
  choice: với Ê-tiên
  rationale: Dịch cách ba sau συζητέω bằng giới từ “với”; dùng dạng tên riêng quen thuộc trong tiếng Việt.
theological_decisions:
- issue: Cấu trúc và số lượng các hội đường được nhắc đến
  choice: Trình bày như một hội đường có các nhóm người được liệt kê
  alternative: Hiểu câu là nói đến hai hoặc nhiều hội đường riêng biệt của các nhóm khác nhau
  rationale: Ngữ pháp Hy Lạp có danh từ συναγωγῆς ở số ít và mệnh đề τῆς λεγομένης gắn với Λιβερτίνων; tuy nhiên quan hệ chính xác giữa các nhóm địa lý vẫn có thể được phân tích khác nhau. Bản dịch giữ số ít rõ ràng nhưng dùng dấu gạch ngang để tránh khẳng định quá mức về cơ cấu tổ chức.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ nhịp kể đối lập bằng “Nhưng,” dùng tên địa danh phiên âm quen thuộc, và đặt phần liệt kê giữa dấu gạch ngang để câu dài vẫn sáng rõ.
