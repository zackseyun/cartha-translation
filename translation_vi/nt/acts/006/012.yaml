id: ACT.6.12
reference: Acts 6:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: συνεκίνησάν τε τὸν λαὸν καὶ τοὺς πρεσβυτέρους καὶ τοὺς γραμματεῖς, καὶ ἐπιστάντες συνήρπασαν αὐτὸν καὶ ἤγαγον εἰς τὸ συνέδριον,
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/012.yaml
  text: So they stirred up the people and the elders and the scribes[a], and coming upon him, they seized him and brought him before the Sanhedrin,
translation:
  language: vi
  text: Họ kích động dân chúng, các trưởng lão và các kinh sư; rồi ập đến, bắt lấy ông và giải ông ra trước Hội đồng Công luận[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “hội đồng.” Từ Hy Lạp συνέδριον có thể được dịch theo nghĩa chung như vậy, nhưng ở đây rất có thể chỉ Hội đồng Công luận, tức cơ quan lãnh đạo của người Do Thái.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνεκίνησάν
  choice: kích động
  rationale: Diễn đạt tác động khiến dân chúng và giới lãnh đạo bị khuấy động để chống lại Ê-tiên; tự nhiên trong tiếng Việt và không nhất thiết hàm ý bạo lực trực tiếp.
- source_word: τε
  choice: Vì vậy
  rationale: Thể hiện liên kết nhẹ nhưng có sắc thái tiếp nối hệ quả trong mạch kể; tránh dịch máy móc bằng một từ nối rời rạc.
- source_word: τὸν λαὸν
  choice: dân chúng
  rationale: Chỉ quần chúng trong bối cảnh công khai, tự nhiên hơn 'dân' khi đứng cạnh các nhóm lãnh đạo.
- source_word: τοὺς πρεσβυτέρους
  choice: các trưởng lão
  rationale: Giữ thuật ngữ lịch sử dành cho những người lãnh đạo được công nhận trong cộng đồng Do Thái, không hiểu đơn thuần là người cao tuổi.
- source_word: τοὺς γραμματεῖς
  choice: các kinh sư
  rationale: Thuật ngữ tiếng Việt quen thuộc cho các chuyên gia Kinh Thánh và luật pháp Do Thái; rõ nghĩa hơn cách dịch sát chữ 'các thư ký'.
- source_word: ἐπιστάντες
  choice: bất ngờ kéo đến
  rationale: Giữ sắc thái đột ngột của hành động tiến đến hoặc ập tới, đồng thời phù hợp tự nhiên với cảnh bắt giữ.
- source_word: συνήρπασαν
  choice: bắt lấy
  rationale: Truyền đạt hành động cưỡng bức nắm giữ người, đủ mạnh mà không thêm ý kéo lê vốn không được nói rõ.
- source_word: ἤγαγον
  choice: giải
  rationale: Trong ngữ cảnh bắt giữ và đưa đến cơ quan xét xử, 'giải' diễn đạt rõ tính không tự nguyện và tự nhiên trong tiếng Việt.
- source_word: τὸ συνέδριον
  choice: Hội đồng Công luận
  rationale: Chỉ cơ quan lãnh đạo và xét xử tối cao của người Do Thái tại Giê-ru-sa-lem; thuật ngữ lịch sử này giữ tính đặc thù của định chế.
theological_decisions:
- issue: Cách dịch συνέδριον
  choice: Hội đồng Công luận
  alternative: hội đồng
  rationale: Bối cảnh Giê-ru-sa-lem cùng sự hiện diện của các trưởng lão và kinh sư cho thấy đây là cơ quan lãnh đạo Do Thái cụ thể. Tuy nhiên, danh từ Hy Lạp tự nó cũng có nghĩa chung là 'hội đồng', nên phương án ấy được ghi nhận trong chú thích.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Dùng 'kinh sư' và 'Hội đồng Công luận' làm thuật ngữ lịch sử quen thuộc; cấu trúc câu giữ rõ chuỗi hành động kích động, kéo đến, bắt và giải đi.
