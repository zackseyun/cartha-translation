- from: 'Vì chúng tôi đã nghe hắn nói rằng: ‘Giê-su người Na-xa-rét này[a] sẽ phá hủy nơi này[b] và thay đổi các tục lệ mà Môi-se đã truyền lại cho chúng ta.’[c]'
  to: 'Vì chúng tôi đã nghe ông ấy nói rằng: ‘Giê-su, người Na-xa-rét này,[a] sẽ phá hủy nơi này[b] và thay đổi các tục lệ mà Môi-se đã truyền lại cho chúng ta.’[c]'
  rationale: Chỉ thay đại từ quy chiếu đến Ê-tiên từ “hắn” thành “ông ấy” để không thêm sắc thái miệt thị không được biểu thị bởi αὐτοῦ. Giữ “này” với Giê-su để phản ánh lực nhấn mạnh của οὗτος; giữ nguyên ý nghĩa, các thuật ngữ chính và toàn bộ hệ chú thích.
