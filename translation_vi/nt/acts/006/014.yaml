id: ACT.6.14
reference: Acts 6:14
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀκηκόαμεν γὰρ αὐτοῦ λέγοντος ὅτι Ἰησοῦς ὁ Ναζωραῖος οὗτος καταλύσει τὸν τόπον τοῦτον καὶ ἀλλάξει τὰ ἔθη ἃ παρέδωκεν ἡμῖν Μωϋσῆς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/014.yaml
  text: For we heard him saying that this Jesus the Nazarene will destroy this place and will change the customs that Moses handed down to us[a][b][c].
translation:
  language: vi
  text: 'Vì chúng tôi đã nghe ông ấy nói rằng: ‘Giê-su, người Na-xa-rét này,[a] sẽ phá hủy nơi này[b] và thay đổi các tục lệ mà Môi-se đã truyền lại cho chúng ta.’[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Giê-su quê Na-xa-rét này.”'
    reason: lexical_alternative
  - marker: b
    text: “Nơi này” chỉ đền thờ.
    reason: cultural_note
  - marker: c
    text: 'Cũng có thể dịch: “các truyền thống mà Môi-se đã trao lại cho chúng ta.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκηκόαμεν
  choice: chúng tôi đã nghe
  rationale: Thể hoàn thành của ἀκούω diễn tả việc họ đã nghe và nay viện dẫn điều ấy; cách nói này tự nhiên trong lời tố cáo bằng tiếng Việt.
- source_word: γὰρ
  choice: Vì
  rationale: Giữ chức năng giải thích, nối lời tố cáo này với mệnh đề trước.
- source_word: αὐτοῦ λέγοντος
  choice: nghe hắn nói
  rationale: Diễn đạt tự nhiên cấu trúc nghe trực tiếp một người nói; đại từ “hắn” phản ánh giọng điệu thù nghịch của những người tố cáo đối với Ê-tiên mà không thêm ý giải thích.
- source_word: Ἰησοῦς ὁ Ναζωραῖος οὗτος
  choice: Giê-su người Na-xa-rét này
  rationale: Giữ cả danh xưng Ναζωραῖος và sắc thái nhấn mạnh, có phần miệt thị, của οὗτος trong lời tố cáo.
- source_word: καταλύσει
  choice: sẽ phá hủy
  rationale: Trong ngữ cảnh chỉ đền thờ, καταλύω mang nghĩa phá bỏ hoặc phá hủy; “phá hủy” rõ ràng và tự nhiên.
- source_word: τὸν τόπον τοῦτον
  choice: nơi này
  rationale: Dịch sát τόπος và không đưa từ “đền thờ” vào chính văn, dù đó là đối tượng được nói đến trong ngữ cảnh.
- source_word: ἀλλάξει
  choice: sẽ thay đổi
  rationale: Tương đương trực tiếp và tự nhiên của thì tương lai ἀλλάξει.
- source_word: τὰ ἔθη
  choice: các tục lệ
  rationale: Diễn tả những tập tục và nếp thực hành được cộng đồng thừa hưởng, không áp đặt sắc thái kỹ thuật của “truyền thống”.
- source_word: ἃ παρέδωκεν ἡμῖν Μωϋσῆς
  choice: mà Môi-se đã truyền lại cho chúng ta
  rationale: “Truyền lại” thể hiện việc chuyển giao các tục lệ cho cộng đồng qua Môi-se và phù hợp cách nói tiếng Việt hiện đại.
theological_decisions:
- issue: Đối tượng của cụm “nơi này”
  choice: Giữ “nơi này” trong chính văn và giải thích rằng đó là đền thờ trong chú thích.
  alternative: Dịch trực tiếp là “đền thờ này” hoặc “nơi thánh này”.
  rationale: Bản Hy Lạp dùng τόπος, nghĩa đen là “nơi”; giữ cách nói ấy bảo toàn nguyên văn lời tố cáo, còn ngữ cảnh được làm rõ trong chú thích.
- issue: Sắc thái của lời tố cáo về Chúa Giê-su
  choice: Dịch “Giê-su người Na-xa-rét này” để giữ οὗτος và danh xưng Ναζωραῖος.
  alternative: Dịch trung tính hơn là “Giê-su quê Na-xa-rét” hoặc “Giê-su thành Na-xa-rét”.
  rationale: Cách diễn đạt giữ được sắc thái nhấn mạnh và có phần khinh miệt trong lời của những người tố cáo, nhưng không thêm lời bình luận thần học.
- issue: Tư cách phát ngôn của câu
  choice: Đặt nội dung sau “nói rằng” trong dấu ngoặc kép như lời những người tố cáo thuật lại.
  alternative: Không dùng dấu ngoặc kép và để toàn câu ở dạng lời gián tiếp.
  rationale: Dấu ngoặc làm rõ nội dung họ tuyên bố đã nghe, nhưng không xác nhận lời tố cáo ấy là đúng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “hắn” trong “nghe hắn nói” để phản ánh thái độ thù nghịch của những người làm chứng đối với Ê-tiên; dùng “Giê-su người Na-xa-rét này” để giữ sắc thái chỉ trỏ của lời tố cáo. Các dấu chú thích [a], [b], [c] đều xuất hiện trong chính văn.
