  source_fidelity: 'Bản dịch truyền đạt đầy đủ các thành tố của câu Hy Lạp: toàn thể những người đang ngồi trong συνέδριον, cái nhìn chăm chú hướng về ông, việc họ thấy gương mặt ông, và phép so sánh không xác định cụ thể với gương mặt của một thiên sứ. Trật tự câu tiếng Việt có điều chỉnh tự nhiên nhưng không làm đổi quan hệ ý nghĩa.'
  naturalness: “Tất cả những người ngồi trong Hội đồng đều chăm chú nhìn ông và thấy gương mặt ông giống như gương mặt của một thiên sứ” là tiếng Việt tiêu chuẩn, rõ ràng và phù hợp văn phong tường thuật trang trọng. Cách lặp “gương mặt” phản ánh phép so sánh của nguyên văn mà vẫn tự nhiên.
  terminology: “Hội đồng” là cách dịch trực tiếp, không áp đặt danh xưng riêng vào thân văn; chú thích xác định bối cảnh là Tòa Công luận/Sanhedrin của người Do Thái. “Thiên sứ” phù hợp ngữ cảnh hữu thể thiên giới. Cụm “giống như” giữ tính so sánh của ὡσεὶ mà không diễn giải thành sự rạng ngời, bình an hay uy nghi.
