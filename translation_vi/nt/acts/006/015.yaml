id: ACT.6.15
reference: Acts 6:15
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἀτενίσαντες εἰς αὐτὸν ⸀πάντες οἱ καθεζόμενοι ἐν τῷ συνεδρίῳ εἶδον τὸ πρόσωπον αὐτοῦ ὡσεὶ πρόσωπον ἀγγέλου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/015.yaml
  text: And all who were sitting in the council[a], fixing their eyes on him, saw his face like the face of an angel.
translation:
  language: vi
  text: Tất cả những người ngồi trong Hội đồng[a] đều chăm chú nhìn ông và thấy gương mặt ông giống như gương mặt của một thiên sứ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “Tòa Công luận” (Sanhedrin), tức hội đồng lãnh đạo của người Do Thái.
    reason: cultural_note
lexical_decisions:
- source_word: ἀτενίσαντες
  choice: chăm chú nhìn
  rationale: Diễn tả cái nhìn tập trung và kéo dài, tự nhiên trong tiếng Việt mà vẫn giữ được cường độ của động từ Hy Lạp.
- source_word: πάντες οἱ καθεζόμενοι
  choice: tất cả những người ngồi
  rationale: Giữ cả ý toàn thể của πάντες lẫn tư thế được mô tả bởi phân từ καθεζόμενοι.
- source_word: συνεδρίῳ
  choice: Hội đồng
  rationale: Chỉ hội đồng lãnh đạo Do Thái trong bối cảnh này; cách dịch bằng danh từ chung rõ nghĩa, còn tên gọi vay mượn được nêu trong chú thích.
- source_word: πρόσωπον
  choice: gương mặt
  rationale: Diễn đạt trực tiếp diện mạo nhìn thấy được của Ê-tiên bằng tiếng Việt hiện đại, trang trọng và tự nhiên.
- source_word: ὡσεὶ
  choice: giống như
  rationale: Giữ nguyên tính chất so sánh của từ Hy Lạp mà không xác định cụ thể phương diện giống nhau.
- source_word: ἀγγέλου
  choice: một thiên sứ
  rationale: Trong ngữ cảnh này, từ chỉ hữu thể thiên giới chứ không đơn thuần là một người đưa tin.
theological_decisions:
- issue: Bản chất của sự so sánh “giống như gương mặt của một thiên sứ”
  choice: Giữ đây là một phép so sánh về diện mạo của Ê-tiên mà không nói rõ nét tương đồng cụ thể.
  alternative: Giải thích cụ thể là vẻ rạng ngời, sự bình thản vô tội hoặc uy quyền từ trời.
  rationale: Bản Hy Lạp chỉ nêu sự tương đồng, không xác định đó là ánh sáng, vẻ thanh thản, sự uy nghi hay sự kết hợp của các đặc điểm ấy; bản dịch không thu hẹp sự mơ hồ có chủ ý của câu.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “ông” để quy chiếu về Ê-tiên theo văn mạch; viết hoa “Hội đồng” để chỉ cơ quan cụ thể trong bối cảnh, đồng thời chú thích tên gọi lịch sử.
