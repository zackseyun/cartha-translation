id: ACT.6.1
reference: Acts 6:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἐν δὲ ταῖς ἡμέραις ταύταις πληθυνόντων τῶν μαθητῶν ἐγένετο γογγυσμὸς τῶν Ἑλληνιστῶν πρὸς τοὺς Ἑβραίους ὅτι παρεθεωροῦντο ἐν τῇ διακονίᾳ τῇ καθημερινῇ αἱ χῆραι αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/001.yaml
  text: In those days[a], as the disciples were increasing in number, a complaint arose from the Hellenists against the Hebrews[b], because their widows were being overlooked in the daily distribution.
translation:
  language: vi
  text: Trong những ngày ấy, khi số môn đồ ngày càng gia tăng, có lời phàn nàn từ những người Hê-lê-nít nhắm vào những người Hê-bơ-rơ,[a] vì các góa phụ của người Hê-lê-nít cứ bị bỏ sót trong việc phân phát hằng ngày.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Người Hê-lê-nít” có lẽ là người Do Thái nói tiếng Hy Lạp; “người Hê-bơ-rơ” có lẽ là người Do Thái nói tiếng A-ram hoặc tiếng Hê-bơ-rơ.
    reason: Giải thích các danh xưng xã hội-văn hóa lịch sử mà không biến cách nhận diện có khả năng nhất thành khẳng định tuyệt đối.
  - marker: b
    text: 'Cũng có thể dịch: “bị bỏ quên trong sự phục vụ hằng ngày.”'
    reason: Nêu khả năng từ vựng khác của παρεθεωροῦντο và nghĩa rộng hơn của διακονία.
lexical_decisions:
- source_word: Ἐν δὲ ταῖς ἡμέραις ταύταις
  choice: Trong những ngày ấy
  rationale: Giữ nguyên khung thời gian của câu; sắc thái chuyển tiếp nhẹ của δέ được thể hiện tự nhiên qua diễn tiến câu chuyện mà không thêm một từ mang nghĩa “bây giờ” vốn không có trong nguyên văn.
- source_word: πληθυνόντων τῶν μαθητῶν
  choice: khi số môn đồ ngày càng gia tăng
  rationale: Diễn đạt cấu trúc sở hữu cách tuyệt đối như hoàn cảnh nền, đồng thời làm rõ đây là sự gia tăng về số lượng.
- source_word: ἐγένετο γογγυσμός
  choice: phàn nàn
  rationale: γογγυσμός có thể chỉ sự lẩm bẩm, bất bình hoặc lời phàn nàn; cách dịch này tự nhiên và phù hợp với một khiếu nại cụ thể, không cường điệu mức độ xung đột.
- source_word: τῶν Ἑλληνιστῶν
  choice: những người Hy Lạp hóa
  rationale: Giữ danh xưng lịch sử của nhóm thay vì đưa cách giải thích “người Do Thái nói tiếng Hy Lạp” thẳng vào chính văn; chú thích nêu nghĩa có khả năng nhất.
- source_word: πρὸς τοὺς Ἑβραίους
  choice: về những người Hê-bơ-rơ
  rationale: πρός đánh dấu đối tượng mà lời phàn nàn hướng tới. “Phàn nàn về” là cách nói tự nhiên trong tiếng Việt và vẫn thể hiện căng thẳng giữa hai nhóm.
- source_word: παρεθεωροῦντο
  choice: cứ bị bỏ sót
  rationale: Thể bị động chưa hoàn thành cho thấy tình trạng lặp lại hoặc kéo dài. “Bị bỏ sót” không mặc nhiên quy kết hành vi cố ý; “bị sao nhãng” được giữ trong chú thích như một khả năng khác.
- source_word: ἐν τῇ διακονίᾳ τῇ καθημερινῇ
  choice: trong việc phân phát hằng ngày
  rationale: διακονία có nghĩa rộng là sự phục vụ, nhưng bối cảnh các góa phụ nhận sự chu cấp và các câu tiếp theo ủng hộ nghĩa cụ thể là việc phân phát hằng ngày.
- source_word: αἱ χῆραι αὐτῶν
  choice: các góa phụ của họ
  rationale: Đại từ sở hữu tự nhiên nhất quy chiếu về nhóm người Hy Lạp hóa, đồng thời giữ nguyên cách diễn đạt của nguyên văn.
theological_decisions:
- issue: Danh xưng xã hội-văn hóa Ἑλληνισταί và Ἑβραῖοι
  choice: Giữ “những người Hy Lạp hóa” và “những người Hê-bơ-rơ” trong chính văn, kèm chú thích giải thích.
  alternative: Dịch diễn giải là “người Do Thái nói tiếng Hy Lạp” và “người Do Thái nói tiếng A-ram hoặc Hê-bơ-rơ”.
  rationale: Các danh xưng có ý nghĩa lịch sử và có thể bao hàm nhiều hơn một khác biệt thuần túy ngôn ngữ. Giữ nhãn gọi trong chính văn tránh biến một cách hiểu có khả năng cao thành điều tuyệt đối chắc chắn.
- issue: Mức độ cố ý trong παρεθεωροῦντο
  choice: Dịch “cứ bị bỏ sót”, không khẳng định sự phân biệt đối xử là cố ý.
  alternative: “cứ bị sao nhãng” hoặc “cứ bị bỏ bê”.
  rationale: Nguyên văn mô tả tình trạng các góa phụ không được lưu tâm đầy đủ nhưng không nói rõ động cơ; bản dịch giữ sự căng thẳng mà không bổ sung ý định chủ quan.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “môn đồ”, “góa phụ” và “hằng ngày” là các từ phổ thông trong văn cảnh Kinh Thánh; giữ hai danh xưng lịch sử trong chính văn nhưng giải thích ngay bằng chú thích.
