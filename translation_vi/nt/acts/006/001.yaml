review_pass:
  verdict: revise
  source_fidelity: Bản thảo phản ánh đúng khung thời gian, hoàn cảnh số môn đồ gia tăng, lời than phiền, tình trạng các góa phụ bị bỏ sót, và việc phân phát hằng ngày. Tuy nhiên, “những người Hy Lạp hóa” không phải là cách gọi tự nhiên hay ổn định trong tiếng Việt hiện đại cho Ἑλληνισταί; nó cũng có thể gợi một quá trình bị Hy Lạp hóa hơn là nhãn nhóm lịch sử. Cụm “các góa phụ của họ” có thể bị hiểu là thuộc nhóm Hê-bơ-rơ đứng gần nhất, trong khi αὐτῶν tự nhiên quy chiếu về nhóm Hê-lê-nít là bên nêu lời than phiền.
  naturalness: Câu nhìn chung rõ ràng, nhưng “người Hê-lê-nít” là dạng phiên âm danh xưng lịch sử phù hợp hơn và chú thích có thể giải thích nghĩa khả dĩ. “Có lời phàn nàn từ ... nhắm vào ...” phản ánh ἐγένετο γογγυσμὸς ... πρὸς tự nhiên và sát hơn so với việc biến nhóm này thành chủ thể trực tiếp của động từ “phàn nàn.”
  terminology: 'Giữ “môn đồ,” “góa phụ,” “Hê-bơ-rơ,” và “hằng ngày.” Đổi “Hy Lạp hóa” thành “Hê-lê-nít.” Không khẳng định quá mức về ngôn ngữ của hai nhóm: chú thích dùng “có lẽ.” Chú thích từ vựng nên dùng “bị bỏ quên/bị bỏ sót,” tránh “bị sao nhãng,” vốn không tự nhiên cho đối tượng bị động trong tiếng Việt.'
  issues:
  - severity: medium
    issue: “Những người Hy Lạp hóa” không thích hợp làm danh xưng chính văn cho Ἑλληνισταί.
