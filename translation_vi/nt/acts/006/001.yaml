revisions:
- from: Trong những ngày ấy, khi số môn đồ ngày càng gia tăng, những người Hy Lạp hóa phàn nàn về những người Hê-bơ-rơ[a], vì các góa phụ của họ cứ bị bỏ sót trong việc phân phát hằng ngày.[b]
  to: Trong những ngày ấy, khi số môn đồ ngày càng gia tăng, có lời phàn nàn từ những người Hê-lê-nít nhắm vào những người Hê-bơ-rơ,[a] vì các góa phụ của người Hê-lê-nít cứ bị bỏ sót trong việc phân phát hằng ngày.[b]
  rationale: Bản sửa giữ nguyên nghĩa và sắc thái chưa hoàn thành bị động của nguyên văn (“cứ bị bỏ sót”), đồng thời dùng danh xưng Hê-lê-nít phù hợp hơn trong tiếng Việt hiện đại. Việc nêu rõ “các góa phụ của người Hê-lê-nít” giải quyết mơ hồ do trật tự tiền ngữ tiếng Việt mà không thêm thông tin ngoài điều ngữ cảnh và cấu trúc Hy Lạp chỉ ra. Vị trí chú thích a được đặt sau cả hai danh xưng mà nó giải thích.
  reviewer_model: gpt-5.6-terra
