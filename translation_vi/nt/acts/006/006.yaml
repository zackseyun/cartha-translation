id: ACT.6.6
reference: Acts 6:6
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οὓς ἔστησαν ἐνώπιον τῶν ἀποστόλων, καὶ προσευξάμενοι ἐπέθηκαν αὐτοῖς τὰς χεῖρας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/006.yaml
  text: These they set before the apostles[a], and after praying[b], they laid their hands on them.
translation:
  language: vi
  text: Họ đưa những người ấy đến trước các sứ đồ[a]; rồi sau khi cầu nguyện, các sứ đồ đặt tay trên họ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Họ trình những người ấy trước các sứ đồ.”'
    reason: lexical_alternative
  - marker: b
    text: Hành động “đặt tay” có thể biểu thị sự công khai ủy nhiệm hoặc chúc phước; ở đây tiếng Hy Lạp chỉ nêu hành động chứ không xác định thêm ý nghĩa giáo hội học của hành động ấy.
    reason: cultural_note
lexical_decisions:
- source_word: οὓς
  choice: những người ấy
  rationale: Đại từ quan hệ số nhiều chỉ về bảy người được nêu ở câu trước; cách diễn đạt này tự nhiên trong tiếng Việt và không lặp lại danh sách.
- source_word: ἔστησαν ἐνώπιον
  choice: đưa ... đến trước
  rationale: ἔστησαν mang nghĩa khiến đứng hoặc đặt trước mặt; trong ngữ cảnh trình người trước các sứ đồ, “đưa ... đến trước” vừa tự nhiên vừa giữ ý hiện diện trước họ.
- source_word: τῶν ἀποστόλων
  choice: các sứ đồ
  rationale: Trong Công Vụ, từ này chỉ nhóm sứ đồ được thừa nhận; dùng thuật ngữ Kinh Thánh quen thuộc mà không diễn giải thêm chức vụ.
- source_word: προσευξάμενοι
  choice: sau khi cầu nguyện
  rationale: Phân từ bất định diễn tả hành động xảy ra trước động từ chính, nên cách dịch này làm rõ trình tự.
- source_word: ἐπέθηκαν αὐτοῖς τὰς χεῖρας
  choice: đặt tay trên họ
  rationale: Giữ nguyên hành động nghi lễ được tiếng Hy Lạp mô tả, theo lối nói tự nhiên và quen thuộc trong tiếng Việt, không gán sẵn ý nghĩa giáo hội học.
theological_decisions:
- issue: Ý nghĩa của hành động đặt tay
  choice: 'Dịch theo lối mô tả: “đặt tay trên họ.”'
  alternative: “phong chức cho họ” hoặc “ủy nhiệm họ”
  rationale: Bản Hy Lạp nêu hành động nhưng không xác định đầy đủ tại đây đó là phong chức, ủy nhiệm hay chúc phước; bản dịch giữ nguyên độ mở thần học.
- issue: Chủ thể của việc cầu nguyện và đặt tay
  choice: Dùng “các sứ đồ” ở mệnh đề sau để làm rõ chủ thể theo mạch cú pháp.
  alternative: 'Giữ đại từ lược bỏ: “rồi sau khi cầu nguyện, họ đặt tay trên những người ấy”'
  rationale: Chủ thể ngầm của phân từ và động từ chính tự nhiên nhất là các sứ đồ vừa được nhắc đến; lặp danh từ giúp tiếng Việt tránh nhầm “họ” với nhóm bảy người mà không thay đổi nội dung.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “sứ đồ” theo cách gọi Kinh Thánh quen thuộc; tránh từ “phong chức” vì mang tính diễn giải giáo phái. Dấu chú thích [a], [b] đều xuất hiện trong chính văn.
