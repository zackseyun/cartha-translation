  source_fidelity: 'Bản dịch phản ánh đúng cấu trúc và diễn tiến của bản Hy Lạp: cộng đồng “đưa/trình” bảy người trước các sứ đồ; các sứ đồ cầu nguyện rồi đặt tay trên họ. Việc nêu rõ “các sứ đồ” ở mệnh đề sau làm sáng tỏ chủ thể phù hợp với cú pháp và ngữ cảnh, không thêm nội dung.'
  naturalness: “Họ đưa những người ấy đến trước các sứ đồ; rồi sau khi cầu nguyện, các sứ đồ đặt tay trên họ” là tiếng Việt hiện đại, trang trọng, dễ hiểu. “Đặt tay trên họ” là cách nói Kinh Thánh tự nhiên.
  terminology: “Các sứ đồ” là thuật ngữ phù hợp trong Công Vụ. “Đặt tay” giữ nguyên hành động được mô tả, không áp đặt nghĩa phong chức hay một diễn giải giáo phái. Các chú thích được neo đúng chỗ và diễn đạt thận trọng.
