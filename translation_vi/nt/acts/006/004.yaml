  yaml_path: translation/nt/acts/006/004.yaml
  text: But we will devote ourselves to prayer and to the ministry of the word[a].
translation:
  language: vi
  text: Còn chúng tôi sẽ chuyên tâm vào việc cầu nguyện và việc phục vụ Lời Chúa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “chức vụ Lời Chúa.” Từ Hy Lạp dịch là “phục vụ” cũng có thể dịch là “chức vụ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμεῖς
  choice: chúng tôi
  rationale: Đại từ số nhiều ngôi thứ nhất được nêu rõ để nhấn mạnh và đối chiếu; “chúng tôi” tự nhiên trong tiếng Việt và phù hợp với lời các sứ đồ nói với cộng đồng.
- source_word: δὲ
  choice: Còn
  rationale: Thể hiện sự đối chiếu với nhiệm vụ được giao cho những người khác trong văn cảnh trước, đồng thời tự nhiên hơn một từ nối đối lập quá mạnh.
- source_word: τῇ προσευχῇ
  choice: cầu nguyện
  rationale: Đi với “chuyên tâm” để diễn đạt đối tượng/lĩnh vực mà họ kiên trì dấn thân; tiếng Việt không cần tái hiện mạo từ Hy Lạp.
- source_word: διακονίᾳ
  choice: phục vụ
  rationale: Giữ nghĩa căn bản là sự phục vụ và duy trì liên hệ từ vựng với việc phục vụ bàn ăn trong văn cảnh, không áp đặt sự phân biệt cứng nhắc giữa giáo sĩ và giáo dân.
- source_word: τοῦ λόγου
  choice: lời Chúa
  rationale: Trong Công Vụ, “lời” ở văn cảnh này là sứ điệp được công bố về Đức Chúa Trời và công việc cứu rỗi của Ngài; thêm “Chúa” giúp người đọc tiếng Việt nhận đúng sở chỉ, thay vì hiểu là lời nói nói chung.
- source_word: προσκαρτερήσομεν
  choice: sẽ chuyên tâm
  rationale: Diễn đạt thì tương lai cùng ý kiên trì, bền bỉ dành mình cho một công việc; đây là cách nói tự nhiên, trang trọng vừa phải trong tiếng Việt hiện đại.
theological_decisions:
- issue: Cách dịch διακονία trong tương quan với việc phục vụ bàn ăn ở văn cảnh gần
  choice: phục vụ lời Chúa
  alternative: chức vụ rao giảng lời Chúa
  rationale: “Phục vụ” bảo toàn trường nghĩa chung giữa hai loại công việc trong đoạn văn và tránh biến câu này thành một tuyên bố về chức vị giáo phẩm. “Rao giảng” có thể đúng với hoạt động liên quan nhưng cụ thể hóa hơn điều từ Hy Lạp trực tiếp nói.
- issue: Sở chỉ của τοῦ λόγου
  choice: lời Chúa
  alternative: lời / sứ điệp
  rationale: Cách dịch này làm rõ thành ngữ trong tiếng Việt mà không giới hạn “lời” chỉ vào Kinh Thánh thành văn; nó chỉ sứ điệp của Chúa được các sứ đồ công bố.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Còn chúng tôi” giữ nét đối chiếu; “chuyên tâm” thể hiện sự kiên trì liên tục. Dấu chú thích [a] xuất hiện ngay sau cụm từ cần chú giải.
