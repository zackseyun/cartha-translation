  source_fidelity: 'Bản nháp truyền đạt đúng các thành tố chính: Nhóm Mười Hai triệu tập toàn thể môn đồ, và lời khẳng định rằng các ông không nên rời việc liên quan đến lời Đức Chúa Trời để phục vụ các bàn. Tuy nhiên, trật tự “Chúng tôi bỏ ... thì không phải lẽ” kém trực tiếp trong tiếng Việt và “bàn ăn” thêm nét nghĩa ‘ăn’ không có trong τραπέζαις. Chuyển chú thích văn hóa đến ngay sau cụm ‘các bàn’ cũng làm rõ phạm vi của chú thích.'
  naturalness: “Không phải lẽ” là cách nói có phần cũ và cấu trúc với “thì” không tự nhiên bằng mẫu hiện đại “là điều không thích hợp”. “Phục vụ tại các bàn” tự nhiên, đồng thời không xác định quá mức đó chỉ là các bàn dùng bữa.
  terminology: Giữ “Nhóm Mười Hai”, “các môn đồ”, “lời Đức Chúa Trời”, và “phục vụ” là nhất quán với sắc thái danh xưng, tập thể, và công việc thực tế của câu nguồn. “Các bàn” giữ số nhiều và tính cụ thể của τραπέζαις, còn chú thích giải thích bối cảnh phân phát mà không biến nó thành nghĩa chính văn.
