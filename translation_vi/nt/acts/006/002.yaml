id: ACT.6.2
reference: Acts 6:2
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: προσκαλεσάμενοι δὲ οἱ δώδεκα τὸ πλῆθος τῶν μαθητῶν εἶπαν· Οὐκ ἀρεστόν ἐστιν ἡμᾶς καταλείψαντας τὸν λόγον τοῦ θεοῦ διακονεῖν τραπέζαις·
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/002.yaml
  text: So the Twelve called together the whole group of the disciples and said[c][b][a], “It is not right for us to abandon the word of God to serve tables.”
translation:
  language: vi
  text: 'Vì vậy, Nhóm Mười Hai triệu tập toàn thể các môn đồ[a] và nói: “Việc chúng tôi bỏ lời Đức Chúa Trời để phục vụ tại các bàn[c] là điều không thích hợp[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “toàn bộ cộng đồng môn đồ” hoặc “đông đảo môn đồ”.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “không phải lẽ” hoặc “không thể chấp nhận được đối với chúng tôi”.'
    reason: lexical_alternative
  - marker: c
    text: Tức là đảm trách việc phân phát gắn với các bữa ăn và nguồn lực của cộng đồng.
    reason: cultural_note
lexical_decisions:
- source_word: προσκαλεσάμενοι
  choice: triệu tập
  rationale: Diễn đạt tự nhiên hành động gọi các môn đồ họp lại, phù hợp với phân từ bất định trung cách dẫn vào động từ chính.
- source_word: δὲ
  choice: Vì vậy
  rationale: Ở đây δέ đánh dấu diễn tiến từ lời phàn nàn trước đó sang phản ứng của Nhóm Mười Hai, không nhất thiết biểu thị tương phản mạnh.
- source_word: οἱ δώδεκα
  choice: Nhóm Mười Hai
  rationale: Giữ nguyên danh xưng xác định của nhóm sứ đồ mà không thêm từ “sứ đồ”, vốn không có trong câu Hy Lạp.
- source_word: τὸ πλῆθος τῶν μαθητῶν
  choice: toàn thể các môn đồ
  rationale: Truyền đạt sắc thái tập thể của πλῆθος bằng tiếng Việt hiện đại, đồng thời để chú thích bảo lưu các khả năng “toàn bộ cộng đồng” hay “đông đảo”.
- source_word: Οὐκ ἀρεστόν ἐστιν
  choice: không phải lẽ
  rationale: Diễn đạt sự không thích hợp hoặc không đúng với trách nhiệm được giao, thay vì hàm ý công việc phục vụ tự nó thấp kém.
- source_word: ἡμᾶς καταλείψαντας
  choice: chúng tôi bỏ
  rationale: Giữ trực tiếp chủ thể ngôi thứ nhất số nhiều và sức nặng của καταλείπω là rời bỏ, không làm nhẹ thành chỉ “xao nhãng”.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: lời Đức Chúa Trời
  rationale: Cách dịch quen thuộc và trong sáng, bảo lưu cả sắc thái sứ điệp được công bố lẫn âm hưởng thần học của λόγος.
- source_word: διακονεῖν
  choice: phục vụ
  rationale: Từ phổ thông, tự nhiên cho hoạt động phục vụ thực tế và không áp đặt nghĩa chức vụ giáo hội về sau.
- source_word: τραπέζαις
  choice: bàn ăn
  rationale: Giữ hình ảnh cụ thể của τραπέζαις; thêm “ăn” để tiếng Việt rõ nghĩa tự nhiên, còn chú thích giải thích phạm vi phân phối bữa ăn và nguồn lực trong cộng đồng.
theological_decisions:
- issue: Ưu tiên của các sứ đồ so với công việc phục vụ thực tế
  choice: 'Dịch như một nhận định về điều thích hợp với trách nhiệm của Nhóm Mười Hai: “không phải lẽ”.'
  alternative: “không đẹp lòng”, “không thích hợp”, hoặc “không thể chấp nhận được”.
  rationale: Câu này phân định trách nhiệm chứ không hạ thấp phẩm giá của việc phục vụ bàn ăn; bản dịch giữ nguyên sự ưu tiên dành cho lời Đức Chúa Trời mà không giải quyết thay cho văn bản giá trị tương đối của hai công việc.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Nhóm Mười Hai” được dùng như một danh xưng; “không phải lẽ” giữ sắc thái về sự thích hợp của trách nhiệm mà không miệt thị công việc phục vụ. Các dấu chú thích [a], [b], [c] đều xuất hiện trong chính văn.
