language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ ὁ λόγος τοῦ θεοῦ ηὔξανεν, καὶ ἐπληθύνετο ὁ ἀριθμὸς τῶν μαθητῶν ἐν Ἰερουσαλὴμ σφόδρα, πολύς τε ὄχλος τῶν ἱερέων ὑπήκουον τῇ πίστει.
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/007.yaml
  text: And the word of God kept increasing[a], and the number of the disciples in Jerusalem kept multiplying greatly, and a large crowd of the priests were becoming obedient to the faith.
translation:
  language: vi
  text: Lời Đức Chúa Trời ngày càng lan rộng, số môn đồ tại Giê-ru-sa-lem tăng lên rất nhiều, và ngày càng có rất đông thầy tế lễ vâng phục đức tin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể hiểu là “vâng theo đức tin” hoặc “trở nên vâng phục đức tin”. Cụm từ Hy Lạp có thể chỉ việc vâng theo sứ điệp của đức tin Cơ Đốc, chứ không chỉ một hành vi tin cậy trong lòng.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ λόγος τοῦ θεοῦ
  choice: Lời Đức Chúa Trời
  rationale: Giữ thành ngữ Kinh Thánh quen thuộc và độ rộng nghĩa của λόγος, chỉ sứ điệp được công bố từ Đức Chúa Trời mà không thu hẹp thành một thuật ngữ chuyên biệt.
- source_word: ηὔξανεν
  choice: tiếp tục lan rộng
  rationale: Thì chưa hoàn thành diễn tả tiến trình đang tiếp diễn; với chủ ngữ là “Lời”, “lan rộng” tự nhiên trong tiếng Việt và chuyển tải sự phát triển của sứ điệp.
- source_word: ἐπληθύνετο ὁ ἀριθμὸς τῶν μαθητῶν
  choice: số môn đồ ... gia tăng
  rationale: Phản ánh trực tiếp ý số lượng môn đồ tiếp tục tăng, đồng thời giữ μαθηταί là “môn đồ”, thuật ngữ quan trọng trong Lu-ca–Công Vụ.
- source_word: ἐν Ἰερουσαλὴμ σφόδρα
  choice: tại Giê-ru-sa-lem ... rất nhiều
  rationale: “Tại” diễn đạt địa điểm tự nhiên; “rất nhiều” bảo toàn sức nhấn mạnh của σφόδρα.
- source_word: πολύς τε ὄχλος τῶν ἱερέων
  choice: cũng có đông đảo thầy tế lễ
  rationale: Diễn đạt tự nhiên một tập thể lớn thuộc giới tư tế Do Thái; “cũng” thể hiện liên kết τε với diễn tiến trước.
- source_word: ὑπήκουον
  choice: vâng phục
  rationale: Diễn tả việc nghe theo và quy phục; ngữ cảnh cùng thì chưa hoàn thành cho thấy ngày càng có nhiều thầy tế lễ làm như vậy, điều đã được câu văn tiếng Việt biểu đạt qua kết cấu “có đông đảo”.
- source_word: τῇ πίστει
  choice: đức tin
  rationale: Giữ thuật ngữ thần học quen thuộc và không quyết định quá mức liệu πίστις ở đây chủ yếu là sứ điệp được tin hay chính hành vi tin.
theological_decisions:
- issue: Nghĩa của πίστις trong τῇ πίστει
  choice: đức tin
  alternative: đạo ấy; nội dung đức tin
  rationale: Cụm Hy Lạp có thể mang nghĩa khách quan, tức sứ điệp hay niềm tin Cơ Đốc mà người ta vâng theo, nhưng cũng không hoàn toàn loại trừ sắc thái tin cậy. Bản chính giữ cách nói “vâng phục đức tin” để bảo toàn độ căng và chú thích làm rõ nghĩa có thể có.
- issue: Sắc thái tiến triển của các động từ ở thì chưa hoàn thành
  choice: “tiếp tục” cho ηὔξανεν và ngữ cảnh gia tăng liên tục cho ἐπληθύνετο/ὑπήκουον
  alternative: dùng ba lần “tiếp tục/đang” một cách minh thị
  rationale: Bảo toàn diễn tiến liên tục nhưng tránh lặp nặng nề, thiếu tự nhiên trong tiếng Việt; không hiểu các hành động như những biến cố đơn nhất.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Trời”, “môn đồ”, “thầy tế lễ” và “đức tin” theo lối dùng Kinh Thánh tiếng Việt phổ biến. Dấu chấm phẩy giúp giữ hai vế tăng trưởng song song mà không tạo chuỗi liên từ nặng nề.
