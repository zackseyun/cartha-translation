- from: 'Bấy giờ, họ bí mật xúi một số người nói rằng[a]: “Chúng tôi đã nghe ông ta nói những lời phạm thượng chống lại Môi-se và Đức Chúa Trời.”'
  to: 'Bấy giờ, họ ngấm ngầm xúi giục những người đàn ông nói rằng[a]: “Chúng tôi đã nghe ông ta nói những lời phạm thượng chống lại Môi-se và Đức Chúa Trời.”'
  rationale: Bản sửa loại bỏ ý “một số” không có trong nguyên văn, phục hồi tham chiếu đến những người nam của ἄνδρας, và dùng “ngấm ngầm xúi giục” để diễn đạt tự nhiên, chính xác sắc thái của ὑπέβαλον. Nội dung lời cáo buộc được giữ nguyên như lời tường thuật, không xác nhận tính đúng đắn của cáo buộc.
