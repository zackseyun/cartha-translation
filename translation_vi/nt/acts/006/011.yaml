  text: τότε ὑπέβαλον ἄνδρας λέγοντας ὅτι Ἀκηκόαμεν αὐτοῦ λαλοῦντος ῥήματα βλάσφημα εἰς Μωϋσῆν καὶ τὸν θεόν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/011.yaml
  text: Then they secretly induced men to say[a], “We have heard him speaking blasphemous words against Moses and God.”
translation:
  language: vi
  text: 'Bấy giờ, họ ngấm ngầm xúi giục những người đàn ông nói rằng[a]: “Chúng tôi đã nghe ông ta nói những lời phạm thượng chống lại Môi-se và Đức Chúa Trời.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “họ ngấm ngầm kích động những người đàn ông” hoặc “họ bí mật xúi giục những người đàn ông”. Động từ Hy Lạp hàm ý kín đáo thúc đẩy hoặc xúi giục người khác.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Bấy giờ
  rationale: Liên từ thời gian tự nhiên trong văn kể chuyện, đánh dấu hành động tiếp theo.
- source_word: ὑπέβαλον
  choice: bí mật xúi
  rationale: Diễn đạt hành động ngấm ngầm thúc đẩy người khác nói theo ý mình; giữ sắc thái khuất tất của động từ trong ngữ cảnh.
- source_word: ἄνδρας
  choice: một số người
  rationale: Tiếng Việt thường không cần đánh dấu giới tính ở đây; “một số người” diễn đạt tự nhiên đối tượng không xác định mà không biến họ thành đại diện cho mọi người.
- source_word: λέγοντας
  choice: nói rằng
  rationale: Chuyển phân từ sang kết cấu bổ ngữ tự nhiên trong tiếng Việt, dẫn vào nội dung lời được xúi nói.
- source_word: Ἀκηκόαμεν
  choice: Chúng tôi đã nghe
  rationale: “Đã nghe” diễn đạt hành động nghe đã xảy ra và vẫn là cơ sở cho lời khai hiện tại.
- source_word: αὐτοῦ λαλοῦντος
  choice: nghe ông ta nói
  rationale: Kết cấu tự nhiên trong tiếng Việt sau động từ “nghe”, giữ ý người nói tự nhận đã trực tiếp nghe Ê-tiên phát ngôn.
- source_word: ῥήματα βλάσφημα
  choice: những lời phạm thượng
  rationale: Giữ sức nặng pháp lý-tôn giáo của βλάσφημα mà không xác nhận lời cáo buộc là đúng.
- source_word: εἰς Μωϋσῆν καὶ τὸν θεόν
  choice: chống lại Môi-se và Đức Chúa Trời
  rationale: Trong ngữ cảnh cáo buộc thù nghịch, εἰς chỉ đối tượng mà lời phạm thượng hướng đến; “chống lại” truyền đạt rõ sắc thái ấy.
theological_decisions:
- issue: Tính chất lời cáo buộc nhằm vào Ê-tiên
  choice: Giữ nguyên dưới dạng lời được những người bị xúi giục nói, rằng đó là “những lời phạm thượng chống lại Môi-se và Đức Chúa Trời”.
  alternative: Dịch βλάσφημα nhẹ hơn là “những lời phỉ báng”.
  rationale: “Phạm thượng” bảo toàn sức nặng tôn giáo và pháp lý của cáo buộc; cấu trúc tường thuật cho thấy đây là lời cáo buộc, không phải sự xác nhận của người kể.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Ông ta” phù hợp với lời cáo buộc mang thái độ xa cách; “Đức Chúa Trời” duy trì cách gọi tôn kính. Dấu chú thích [a] được đặt ngay sau mệnh đề dẫn lời mà nó giải thích.
