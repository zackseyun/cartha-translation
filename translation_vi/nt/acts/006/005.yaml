revisions:
- from: Lời đề nghị ấy được toàn thể hội chúng tán thành, và họ chọn Ê-tiên, một người đầy đức tin[a] và Đức Thánh Linh, cùng Phi-líp, Pơ-rô-cô-rơ, Ni-ca-nô, Ti-môn, Pác-mê-na và Ni-cô-la[b], một người ngoại đã cải sang Do Thái giáo quê ở An-ti-ốt.
  to: Lời đề nghị ấy được cả đoàn người tán thành, và họ chọn Ê-tiên, một người đầy đức tin[a] và Đức Thánh Linh, cùng Phi-líp, Pơ-rô-cô-rơ, Ni-ca-nô, Ti-môn, Pác-mê-na và Ni-cô-la (một người ngoại đã cải sang Do Thái giáo, quê ở An-ti-ốt)[b].
  rationale: Sửa “toàn thể hội chúng” thành “cả đoàn người” để phản ánh πλῆθος cách trung tính hơn. Dùng ngoặc đơn cho phần mô tả Ni-cô-la để bảo đảm phạm vi cú pháp của προσήλυτον Ἀντιοχέα rõ ràng trong câu tiếng Việt, không thay đổi ý nghĩa bản văn.
