id: ACT.6.5
reference: Acts 6:5
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἤρεσεν ὁ λόγος ἐνώπιον παντὸς τοῦ πλήθους, καὶ ἐξελέξαντο Στέφανον, ἄνδρα ⸀πλήρης πίστεως καὶ πνεύματος ἁγίου, καὶ Φίλιππον καὶ Πρόχορον καὶ Νικάνορα καὶ Τίμωνα καὶ Παρμενᾶν καὶ Νικόλαον προσήλυτον Ἀντιοχέα,
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/005.yaml
  text: And the proposal pleased the whole multitude[a], and they chose Stephen, a man full of faith and of the Holy Spirit, Philip, Prochorus, Nicanor, Timon, Parmenas, and Nicolaus[c][b], a proselyte of Antioch.
translation:
  language: vi
  text: Lời đề nghị ấy được cả đoàn người tán thành, và họ chọn Ê-tiên, một người đầy đức tin[a] và Đức Thánh Linh, cùng Phi-líp, Pơ-rô-cô-rơ, Ni-ca-nô, Ti-môn, Pác-mê-na và Ni-cô-la (một người ngoại đã cải sang Do Thái giáo, quê ở An-ti-ốt)[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “đầy lòng trung tín”. Từ Hy Lạp có thể chỉ đức tin, lòng tin cậy hoặc sự trung tín.
    reason: lexical_alternative
  - marker: b
    text: “Người ngoại đã cải sang Do Thái giáo” là người không thuộc dân Do Thái nhưng đã tiếp nhận Do Thái giáo.
    reason: cultural_note
lexical_decisions:
- source_word: ὁ λόγος
  choice: lời đề nghị ấy
  rationale: Trong mạch văn, cụm này chỉ điều các sứ đồ vừa đề nghị, không phải “lời” theo nghĩa trừu tượng.
- source_word: ἤρεσεν ἐνώπιον παντὸς τοῦ πλήθους
  choice: được toàn thể hội chúng tán thành
  rationale: Diễn đạt tự nhiên ý đề nghị được toàn thể nhóm người đang tụ họp chấp thuận; “hội chúng” không hàm ý một cơ cấu giáo hội về sau.
- source_word: ἐξελέξαντο
  choice: họ chọn
  rationale: Cách dịch trực tiếp, tự nhiên của động từ chỉ hành động lựa chọn.
- source_word: πλήρης πίστεως
  choice: đầy đức tin
  rationale: πίστις ở đây phù hợp nhất với “đức tin”, nhưng cũng có thể mang sắc thái “lòng trung tín”, nên giữ phương án ấy trong chú thích.
- source_word: πνεύματος ἁγίου
  choice: Đức Thánh Linh
  rationale: Trong sách Công Vụ, cụm này thường chỉ Thánh Linh của Đức Chúa Trời; cách gọi này tự nhiên và trang trọng trong tiếng Việt.
- source_word: προσήλυτον
  choice: một người ngoại đã cải sang Do Thái giáo
  rationale: Dịch rõ nghĩa văn hóa-lịch sử của προσήλυτος thay vì dùng từ vay mượn khó hiểu “người cải đạo” mà không nêu đích đến.
- source_word: Ἀντιοχέα
  choice: quê ở An-ti-ốt
  rationale: Tính từ chỉ mối liên hệ địa lý của Ni-cô-la với thành An-ti-ốt; “quê ở” tự nhiên trong tiếng Việt.
- source_word: Στέφανον, Φίλιππον, Πρόχορον, Νικάνορα, Τίμωνα, Παρμενᾶν, Νικόλαον
  choice: Ê-tiên, Phi-líp, Pơ-rô-cô-rơ, Ni-ca-nô, Ti-môn, Pác-mê-na và Ni-cô-la
  rationale: Phiên âm các tên riêng theo lối quen thuộc, dễ đọc trong tiếng Việt, đồng thời trình bày danh sách tự nhiên bằng dấu phẩy và liên từ cuối.
theological_decisions:
- issue: Nghĩa của πίστις trong lời mô tả Ê-tiên
  choice: đức tin
  alternative: lòng trung tín
  rationale: Ngữ cảnh có thể nói đến niềm tin của Ê-tiên hoặc phẩm chất trung tín của ông. Bản văn chính dùng nghĩa thông dụng “đức tin” và chú thích bảo lưu khả năng còn lại.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Cấu trúc danh sách được làm tự nhiên mà vẫn giữ Ê-tiên cùng sáu người còn lại là một nhóm bảy người được chọn; không thêm chú thích về cách liệt kê cũ vì đó chỉ là vấn đề phong cách, không phải dị bản hay nét nghĩa cần bảo lưu.
