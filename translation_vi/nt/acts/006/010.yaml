revisions:
- from: Nhưng họ không thể chống lại sự khôn ngoan và Thánh Linh, là Đấng nhờ Ngài Ê-tiên đang nói[a].
  to: Họ không thể chống lại sự khôn ngoan và Thánh Linh, nhờ đó Ê-tiên đang nói[a].
  rationale: Bỏ liên từ tương phản không có trong nguyên văn; thay cấu trúc quan hệ gượng ép bằng «nhờ đó», một cách tự nhiên để diễn tả dative công cụ/tác nhân trong tiếng Việt và vẫn phù hợp với đại từ giống trung của tiếng Hy Lạp. Chú thích được chỉnh để diễn đạt cách hiểu thay thế rõ ràng, hiện đại, không áp đặt lựa chọn thần học.
