  text: καὶ οὐκ ἴσχυον ἀντιστῆναι τῇ σοφίᾳ καὶ τῷ πνεύματι ᾧ ἐλάλει.
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/010.yaml
  text: And they were not able to withstand the wisdom and the Spirit by which he was speaking[a].
translation:
  language: vi
  text: Họ không thể chống lại sự khôn ngoan và Thánh Linh, nhờ đó Ê-tiên đang nói[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “tinh thần mà nhờ đó Ê-tiên đang nói,” nếu πνεύματι được hiểu là tinh thần của chính Ê-tiên thay vì Thánh Linh.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἴσχυον
  choice: không thể
  rationale: Động từ ở thì chưa hoàn thành diễn tả sự bất lực kéo dài trong cuộc tranh luận; “không thể” tự nhiên và chính xác trong tiếng Việt.
- source_word: ἀντιστῆναι
  choice: chống lại
  rationale: Trong ngữ cảnh tranh luận, từ này chỉ việc đứng lên đối đầu hay kháng cự hữu hiệu; “chống lại” giữ được nghĩa rộng mà không thêm ý rằng họ chỉ không thể trả lời.
- source_word: σοφίᾳ
  choice: sự khôn ngoan
  rationale: Danh từ có mạo từ xác định, nói đến sự khôn ngoan thể hiện cụ thể trong lời Ê-tiên nói.
- source_word: πνεύματι
  choice: Thánh Linh
  rationale: Ngữ cảnh gần mô tả Ê-tiên đầy dẫy Thánh Linh (Công Vụ 6:5), và sự kết hợp giữa khôn ngoan với Linh hỗ trợ cách hiểu này. Tuy nhiên, khả năng chỉ tâm linh của Ê-tiên được giữ trong chú thích.
- source_word: ᾧ ἐλάλει
  choice: là Đấng nhờ Ngài Ê-tiên đang nói
  rationale: Đại từ quan hệ số ít liên hệ gần nhất với πνεύματι. Cách diễn đạt này hiểu cách dative theo nghĩa phương tiện/tác nhân, xác định rõ Thánh Linh là nguồn năng lực cho lời nói, đồng thời “đang nói” phản ánh thể chưa hoàn thành.
theological_decisions:
- issue: πνεύματι chỉ Thánh Linh hay tâm linh của chính Ê-tiên
  choice: Thánh Linh
  alternative: tâm linh
  rationale: Mạch văn Công Vụ nhấn mạnh Ê-tiên đầy dẫy Thánh Linh, nên cách hiểu “Thánh Linh” có cơ sở mạnh hơn; nhưng ngữ pháp tự nó không loại trừ “tâm linh”, vì vậy cách hiểu thay thế được ghi chú.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Thánh Linh” theo cách gọi phổ biến trong tiếng Việt; lặp tên “Ê-tiên” để tránh đại từ “ông” có thể bị hiểu nhầm là chỉ Thánh Linh.
