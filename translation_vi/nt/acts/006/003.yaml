id: ACT.6.3
reference: Acts 6:3
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐπισκέψασθε ⸀δέ, ἀδελφοί, ἄνδρας ἐξ ὑμῶν μαρτυρουμένους ἑπτὰ πλήρεις ⸀πνεύματος καὶ σοφίας, οὓς ⸀καταστήσομεν ἐπὶ τῆς χρείας ταύτης·
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/003.yaml
  text: But brothers[a], select from among yourselves seven men who are well attested, full of the Spirit and wisdom[d][c][b], whom we will appoint over this duty.
translation:
  language: vi
  text: Nhưng, thưa anh em[a], hãy chọn trong số anh em bảy người nam được tiếng tốt, đầy dẫy Thánh Linh[b] và sự khôn ngoan; chúng tôi sẽ bổ nhiệm họ phụ trách công việc này[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Anh em” dịch hình thức giống đực trong tiếng Hy Lạp; trong ngữ cảnh, lời gọi này có thể hướng đến cộng đồng tín hữu rộng hơn.
    reason: cultural_note
  - marker: b
    text: Nguyên văn viết “đầy dẫy thần/linh và sự khôn ngoan”; không có từ “thánh”. Trong ngữ cảnh này, “thần/linh” rất có thể chỉ Thánh Linh.
    reason: alternative_reading
  - marker: c
    text: “Công việc này” chỉ nhu cầu thực tiễn liên quan đến việc phân phát hằng ngày được nói đến trong ngữ cảnh.
    reason: cross_reference
lexical_decisions:
- source_word: ἐπισκέψασθε
  choice: hãy chọn
  rationale: Mệnh lệnh trung động kêu gọi cộng đồng xem xét và lựa chọn những người thích hợp; “hãy chọn” tự nhiên trong tiếng Việt và truyền đạt đúng hành động được yêu cầu.
- source_word: δέ
  choice: Vậy
  rationale: Trong mạch văn, liên từ chuyển từ nhận định và đề nghị của các sứ đồ sang việc cộng đồng cần làm; “Vậy” diễn đạt quan hệ tiếp nối–suy luận tự nhiên hơn một từ tương phản mạnh.
- source_word: ἀδελφοί
  choice: thưa anh em
  rationale: Giữ hình thức xưng hô số nhiều giống đực của tiếng Hy Lạp bằng cách nói trang trọng, tự nhiên trong tiếng Việt; chú thích nêu khả năng lời gọi hướng đến cộng đồng tín hữu rộng hơn.
- source_word: ἄνδρας ἐξ ὑμῶν
  choice: trong số anh em bảy người nam
  rationale: ἐξ ὑμῶν chỉ việc chọn từ chính cộng đồng, còn ἄνδρας chỉ rõ những người nam trưởng thành; bản dịch giữ cả hai yếu tố.
- source_word: μαρτυρουμένους
  choice: được mọi người chứng nhận tốt
  rationale: Phân từ mang ý nghĩa được người khác làm chứng thuận lợi. Cách dịch này giữ sắc thái chứng nhận, đồng thời rõ và tự nhiên hơn lối diễn đạt quá sát chữ.
- source_word: πλήρεις πνεύματος καὶ σοφίας
  choice: đầy dẫy Thánh Linh và sự khôn ngoan
  rationale: Trong ngữ cảnh Lu-ca–Công Vụ, πνεῦμα ở đây rất có khả năng chỉ Thánh Linh; “đầy dẫy” diễn đạt tình trạng được đặc trưng và chi phối bởi Thánh Linh cùng sự khôn ngoan.
- source_word: καταστήσομεν
  choice: chúng tôi sẽ bổ nhiệm
  rationale: Động từ tương lai diễn tả việc chính thức đặt những người được chọn vào trách nhiệm; “bổ nhiệm” giữ được sắc thái này.
- source_word: ἐπὶ τῆς χρείας ταύτης
  choice: phụ trách công việc này
  rationale: Cụm từ chỉ trách nhiệm thực tiễn đang được bàn đến. Kết hợp “bổ nhiệm ... phụ trách” tự nhiên trong tiếng Việt và không thu hẹp χρεία thành một chức danh giáo hội.
theological_decisions:
- issue: πνεύματος chỉ tinh thần nói chung hay Thánh Linh
  choice: Thánh Linh
  alternative: linh; Đức Thánh Linh
  rationale: Cách dùng trong Lu-ca–Công Vụ và ngữ cảnh về phẩm chất phục vụ ủng hộ việc hiểu đây là Thánh Linh. Tuy tiếng Hy Lạp không có tính từ “thánh”, tiếng Việt khó dùng riêng “Linh” một cách rõ nghĩa; chú thích minh bạch về hình thức nguyên văn để không che khuất sắc thái.
- issue: Lời gọi ἀδελφοί có bao gồm toàn thể cộng đồng tín hữu hay chỉ nam giới
  choice: anh em
  alternative: anh chị em; các tín hữu
  rationale: Bản văn dùng danh từ giống đực số nhiều, nên chính văn giữ “anh em”; chú thích bảo tồn khả năng lời xưng hô này đại diện cho cộng đồng tín hữu rộng hơn.
translation_notes:
  register: 'Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Giữ rõ yêu cầu chọn bảy người nam, nhưng không biến trách nhiệm được giao thành một chức danh giáo hội không có trong câu. Dùng “Vậy” để nối hợp lý với câu trước; dấu chấm phẩy làm rõ hai hành động: cộng đồng lựa chọn và các sứ đồ bổ nhiệm.'
