  - severity: medium
    issue: “Được mọi người chứng nhận tốt” thêm từ “mọi người”.
    rationale: μαρτυρουμένους nói đến việc được làm chứng/được nói tốt, nhưng không xác định rằng tất cả mọi người đều làm chứng. “Được tiếng tốt” tránh thêm lượng từ và tự nhiên hơn.
