  verdict: revise
  source_fidelity: 'Cần chỉnh liên từ đầu câu: δέ chủ yếu đánh dấu sự chuyển ý/đối tiếp nhẹ, không tự nó biểu thị kết luận như “Vậy”. “Được mọi người chứng nhận tốt” thêm ý toàn thể (“mọi người”) không có trong nguyên văn. Các yếu tố còn lại—bảy người nam từ trong cộng đồng, đầy dẫy Thánh Linh và khôn ngoan, và được bổ nhiệm phụ trách trách nhiệm này—được chuyển đạt trung thành.'
  naturalness: “Nhưng, thưa anh em” tự nhiên trong văn phong trang trọng hiện đại ở đây. “Được tiếng tốt” là cách nói Việt ngữ gọn, tự nhiên cho μαρτυρουμένους, đồng thời không hàm ý rằng mọi người đều đã xác nhận. Cấu trúc với dấu chấm phẩy phân biệt rõ việc cộng đồng lựa chọn với việc các sứ đồ bổ nhiệm.
  terminology: “Anh em” và “người nam” duy trì các nét giống đực tương ứng của ἀδελφοί và ἄνδρας. “Thánh Linh” là cách hiểu có cơ sở trong văn mạch Lu-ca–Công Vụ; chú thích cần nói rõ nguyên văn chỉ viết πνεύματος, không có từ “thánh”, để không xóa đi sắc thái của bản văn.
