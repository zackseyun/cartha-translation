id: ACT.6.13
reference: Acts 6:13
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἔστησάν τε μάρτυρας ψευδεῖς λέγοντας· Ὁ ἄνθρωπος οὗτος οὐ παύεται ⸂λαλῶν ῥήματα⸃ κατὰ τοῦ τόπου τοῦ ⸀ἁγίου καὶ τοῦ νόμου,
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/013.yaml
  text: They also set up false witnesses who said[c][b][a], “This man does not stop speaking against this holy place and the law,”
translation:
  language: vi
  text: 'Họ cũng đưa ra những nhân chứng gian, nói rằng: “Người này không ngừng nói những lời chống lại nơi thánh này[a] và luật pháp.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “nơi thánh.” Trong ngữ cảnh này, cụm từ Hy Lạp chỉ cụ thể đến đền thờ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔστησάν
  choice: đưa ra
  rationale: Trong bối cảnh pháp lý, động từ chỉ việc khiến các nhân chứng đứng ra hoặc được đưa ra làm chứng; “đưa ra” tự nhiên và không thêm ý quá mức.
- source_word: τε
  choice: cũng
  rationale: Diễn đạt sắc thái bổ sung của τέ trong chuỗi hành động.
- source_word: μάρτυρας ψευδεῖς
  choice: những nhân chứng giả
  rationale: Cách nói pháp lý tự nhiên, chỉ những người làm chứng gian dối.
- source_word: λέγοντας
  choice: nói rằng
  rationale: Chuyển phân từ thành mệnh đề dẫn lời trực tiếp, phù hợp cú pháp tiếng Việt.
- source_word: Ὁ ἄνθρωπος οὗτος
  choice: Người này
  rationale: Giữ cách gọi trực tiếp, hơi khinh miệt trong lời buộc tội mà không tăng sắc thái miệt thị.
- source_word: οὐ παύεται
  choice: không ngừng
  rationale: Giữ ý hành động liên tục và là cách diễn đạt trang trọng, tự nhiên trong tiếng Việt.
- source_word: λαλῶν ῥήματα
  choice: nói những lời
  rationale: Thể hiện danh từ ῥήματα có mặt trong bản Hy Lạp, đồng thời giữ giọng điệu của lời cáo buộc.
- source_word: κατὰ
  choice: chống lại
  rationale: Trong lời cáo buộc thù nghịch này, κατά với sở hữu cách biểu thị sự chống đối.
- source_word: τοῦ τόπου τοῦ ἁγίου
  choice: nơi thánh này
  rationale: Ngữ cảnh chỉ nơi thánh đang được nói đến, tức đền thờ; “này” chuyển tải tự nhiên tính chỉ xuất theo ngữ cảnh.
- source_word: νόμου
  choice: luật pháp
  rationale: Trong bối cảnh Do Thái, từ này chỉ luật Môi-se; “luật pháp” là cách gọi rõ ràng, quen thuộc mà không diễn giải thêm.
theological_decisions:
- issue: Đối tượng của “nơi thánh” và “luật pháp”
  choice: Lời cáo buộc liên quan đến đền thờ Giê-ru-sa-lem và luật Môi-se, nhưng bản dịch giữ nguyên cách gọi của các nhân chứng.
  alternative: Diễn giải trực tiếp thành “đền thờ” và “luật Môi-se”.
  rationale: Ngữ cảnh xác định các đối tượng ấy, song câu Hy Lạp dùng “nơi thánh” và “luật pháp”; giữ cách diễn đạt này tránh mở rộng lời văn.
- issue: Sắc thái của lời cáo buộc
  choice: Giữ giọng pháp lý thù nghịch bằng “nói những lời chống lại”.
  alternative: Dùng từ mạnh hơn như “phạm thượng” hoặc “vu khống”.
  rationale: Bản Hy Lạp nói “những lời chống lại”, không dùng một nhãn thần học hoặc pháp lý mạnh hơn.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu; giữ sắc thái pháp lý của lời chứng gian mà không cường điệu. Dấu [a] được đặt ngay sau cụm từ liên quan.
