  terminology: Đổi “nhân chứng giả” thành “nhân chứng gian” để giữ đúng thuật ngữ pháp lý. Giữ “nơi thánh” thay vì thay trực tiếp bằng “đền thờ,” vì câu nguồn không nêu danh từ đền thờ; chú thích có thể xác định quy chiếu theo ngữ cảnh. “Luật pháp” là cách dịch phù hợp cho νόμος trong ngữ cảnh này.
