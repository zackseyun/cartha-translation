  verdict: revise
  source_fidelity: 'Bản dịch truyền đạt đúng cấu trúc và ý chính của câu Hy Lạp: hành động đưa/trình các nhân chứng, tính chất giả dối của chứng ngôn, lời buộc tội liên tục nói chống lại nơi thánh và luật pháp. “Nói những lời” phản ánh ῥήματα một cách hợp lý; không cần diễn giải thành lời phạm thượng. “Nơi thánh này” giữ được tính chỉ xuất do ngữ cảnh của lời cáo buộc, dù tiếng Hy Lạp dùng mạo từ.'
