  to: 'Họ cũng đưa ra những nhân chứng gian, nói rằng: “Người này không ngừng nói những lời chống lại nơi thánh này[a] và luật pháp.”'
  rationale: Chỉ thay thuật ngữ “nhân chứng giả” bằng “nhân chứng gian” để diễn đạt chính xác hơn nghĩa pháp lý của μάρτυρας ψευδεῖς trong tiếng Việt hiện đại. Giữ nguyên các yếu tố khác, gồm “nói những lời,” để phản ánh danh từ ῥήματα mà không tăng cường mức độ cáo buộc.
