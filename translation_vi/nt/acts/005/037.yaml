id: ACT.5.37
reference: Acts 5:37
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: μετὰ τοῦτον ἀνέστη Ἰούδας ὁ Γαλιλαῖος ἐν ταῖς ἡμέραις τῆς ἀπογραφῆς καὶ ἀπέστησε ⸀λαὸν ὀπίσω αὐτοῦ· κἀκεῖνος ἀπώλετο καὶ πάντες ὅσοι ἐπείθοντο αὐτῷ διεσκορπίσθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/037.yaml
  text: After this[a], Judas the Galilean rose up in the days of the census and drew away people after him. He also perished[b], and all who were persuaded by him were scattered.
translation:
  language: vi
  text: Sau đó,[a] Giu-đa, người Ga-li-lê, nổi lên vào thời kỳ đăng ký dân số[b] và lôi kéo người ta theo mình.[c] Ông ấy cũng bỏ mạng, và tất cả những ai nghe theo ông ấy đều bị phân tán.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Sau người ấy,” tức là sau nhân vật vừa được nhắc đến.'
    reason: lexical_alternative
  - marker: b
    text: Từ Hy Lạp có thể chỉ một cuộc kiểm tra dân số hoặc một cuộc đăng ký chính thức.
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “khiến người ta bỏ phe cũ mà theo mình.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ τοῦτον
  choice: Sau đó
  rationale: Cụm μετά với đối cách diễn tả sự tiếp nối về thời gian trong mạch kể. Cách dịch này tự nhiên trong tiếng Việt; khả năng quy chiếu trực tiếp đến người vừa được nhắc tới được giữ trong chú thích.
- source_word: ἀνέστη
  choice: nổi lên
  rationale: Trong ngữ cảnh một lãnh tụ xuất hiện và thu hút người theo, từ này có nghĩa là đứng lên hoặc nổi lên, không mang nghĩa phục sinh.
- source_word: Ἰούδας ὁ Γαλιλαῖος
  choice: Giu-đa người Ga-li-lê
  rationale: Dùng dạng tên quen thuộc trong tiếng Việt và thể hiện tính từ chỉ xuất xứ bằng cấu trúc tự nhiên “người Ga-li-lê”.
- source_word: ἐν ταῖς ἡμέραις τῆς ἀπογραφῆς
  choice: vào thời kỳ đăng ký dân số
  rationale: ἀπογραφή chỉ một cuộc đăng ký chính thức, thường nhằm thống kê dân số. “Vào thời kỳ” truyền đạt tự nhiên thành ngữ thời gian ἐν ταῖς ἡμέραις.
- source_word: ἀπέστησε λαὸν ὀπίσω αὐτοῦ
  choice: lôi kéo người ta theo mình
  rationale: Dạng sai khiến của ἀφίστημι có thể hàm ý khiến người khác rời bỏ lập trường hay sự trung thành trước đó; “lôi kéo” giữ sắc thái này mà không tự ý nói rõ đó là một cuộc nổi loạn. “Người ta” diễn đạt λαόν không có mạo từ mà không đồng nhất với toàn dân.
- source_word: ἀπώλετο
  choice: bỏ mạng
  rationale: Diễn đạt việc Giu-đa đi đến chỗ diệt vong hoặc chết nhưng không khẳng định phương thức chết, vốn không được câu Hy Lạp nêu rõ.
- source_word: πάντες ὅσοι ἐπείθοντο αὐτῷ
  choice: tất cả những ai nghe theo ông ta
  rationale: πείθω ở đây chỉ những người bị thuyết phục và thuận theo Giu-đa. “Nghe theo” tự nhiên hơn lối dịch bị động cứng trong tiếng Việt mà vẫn giữ ý họ được ông thuyết phục.
- source_word: διεσκορπίσθησαν
  choice: bị tan tác
  rationale: Giữ nghĩa bị phân tán của động từ bị động, đồng thời diễn đạt tự nhiên kết cục của một nhóm người trong tiếng Việt.
theological_decisions:
- issue: Tính chất chính trị của phong trào do Giu-đa lãnh đạo
  choice: Không gọi trực tiếp phong trào này là “cuộc nổi loạn”; dịch rằng ông “nổi lên” và “lôi kéo người ta theo mình”.
  alternative: “Cầm đầu một cuộc nổi loạn” hoặc “xúi dân làm phản”.
  rationale: Bối cảnh lịch sử có thể là một cuộc nổi dậy, nhưng câu Hy Lạp không dùng danh từ rõ nghĩa “nổi loạn”. Bản dịch tránh đưa thêm một đánh giá chính trị vượt quá lời văn.
- issue: Ý nghĩa của ἀπώλετο đối với cái chết của Giu-đa
  choice: “bỏ mạng”, không xác định ông bị giết bằng cách nào.
  alternative: “bị giết” hoặc “bị tiêu diệt”.
  rationale: Động từ cho biết ông đã chết hoặc đi đến chỗ diệt vong, nhưng riêng câu này không nói rõ tác nhân hay phương thức.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Giu-đa” và “Ga-li-lê” theo dạng tên Kinh Thánh quen thuộc trong tiếng Việt. Các cụm “nổi lên”, “nghe theo” và “bị tan tác” giữ sắc thái thuật sự sống động mà không cường điệu tính chất chính trị hay thần học của sự kiện.
