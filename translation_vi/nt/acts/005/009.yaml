id: ACT.5.9
reference: Acts 5:9
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ δὲ ⸀Πέτρος πρὸς αὐτήν· Τί ὅτι συνεφωνήθη ὑμῖν πειράσαι τὸ πνεῦμα κυρίου; ἰδοὺ οἱ πόδες τῶν θαψάντων τὸν ἄνδρα σου ἐπὶ τῇ θύρᾳ καὶ ἐξοίσουσίν σε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/009.yaml
  text: But Peter said to her[a], “Why did you agree together to test the Spirit of the Lord? Look, the feet of those who buried your husband are at the door[b], and they will carry you out.”
translation:
  language: vi
  text: 'Nhưng Phi-e-rơ nói với bà: “Sao hai người lại thỏa thuận với nhau[a] để thử Thần Khí của Chúa? Kìa, chân của những người đã chôn chồng bà đang ở cửa, và họ sẽ khiêng bà ra ngoài.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “lại đồng lòng với nhau.” Trong ngữ cảnh, sự thỏa thuận này mang tính thông đồng.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί ὅτι
  choice: Tại sao
  rationale: Diễn đạt tự nhiên sắc thái chất vấn và quở trách của thành ngữ Hy Lạp.
- source_word: συνεφωνήθη ὑμῖν
  choice: hai người lại đồng lòng với nhau
  rationale: Dạng bị động đi với đại từ số nhiều mang ý nghĩa thành ngữ về một sự thỏa thuận chung. “Hai người” làm rõ Phi-e-rơ đang nói đến Sa-phi-ra và chồng bà theo ngữ cảnh, còn “đồng lòng” giữ đúng nghĩa căn bản mà không tăng cường thành “âm mưu”.
- source_word: πειράσαι
  choice: để thử
  rationale: Trong ngữ cảnh này, động từ nói đến việc đem Thần Khí ra thử, không phải cám dỗ; “thử” ngắn gọn và tự nhiên.
- source_word: τὸ πνεῦμα κυρίου
  choice: Thần Khí của Chúa
  rationale: Giữ nguyên cấu trúc sở hữu và cách gọi của nguyên văn, không tự ý mở rộng thành “Đức Thánh Linh,” dù ngữ cảnh rất có thể chỉ về Đức Thánh Linh.
- source_word: ἰδοὺ
  choice: Kìa
  rationale: Một từ cảm thán hiện đại, trang trọng vừa phải, thu hút sự chú ý đến điều đang xảy ra tức khắc.
- source_word: οἱ πόδες τῶν θαψάντων
  choice: chân của những người đã chôn
  rationale: Giữ hình ảnh cụ thể “chân” trong nguyên văn thay vì làm phẳng thành “những người” hoặc đổi thành “tiếng chân”.
- source_word: τὸν ἄνδρα σου
  choice: chồng bà
  rationale: Trong ngữ cảnh nói với Sa-phi-ra về A-na-nia, ἀνήρ mang nghĩa rõ ràng là “chồng.” Đại từ “bà” phù hợp với lời nói trực tiếp trang trọng trong tiếng Việt.
- source_word: ἐπὶ τῇ θύρᾳ
  choice: đang ở ngay cửa
  rationale: Diễn đạt sự hiện diện tức khắc tại lối vào; “ngay” truyền đạt tính cận kề của lời cảnh báo.
- source_word: ἐξοίσουσίν σε
  choice: họ sẽ khiêng bà ra ngoài
  rationale: Giữ lời tuyên bố trực tiếp và đáng sợ của nguyên văn, không thêm “thi thể” dù cái chết được ngụ ý rõ trong ngữ cảnh.
theological_decisions:
- issue: Đối tượng được gọi là “Thần Khí của Chúa”
  choice: Giữ nguyên “Thần Khí của Chúa,” nhiều khả năng chỉ về Đức Thánh Linh.
  alternative: Hiểu theo nghĩa khái quát hơn là sự hiện diện thần linh của Chúa.
  rationale: Mạch văn Công Vụ 5:3–9 ủng hộ mạnh việc hiểu đây là Đức Thánh Linh, nhưng bản dịch không thêm chữ “Thánh” vốn không có trong câu Hy Lạp này.
- issue: Mức độ trong lời buộc tội của Phi-e-rơ
  choice: “đồng lòng với nhau”
  alternative: “cùng nhau âm mưu” hoặc “thỏa thuận với nhau”
  rationale: Động từ Hy Lạp trực tiếp nói đến sự đồng thuận. Ngữ cảnh cho thấy sự thông đồng có tội, nhưng “âm mưu” sẽ diễn giải mạnh hơn nghĩa từ vựng cần thiết.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Thần Khí” để phản ánh πνεῦμα mà không thêm chữ “Thánh”; giữ hình ảnh “chân” và động từ “khiêng” nhằm bảo tồn tính sống động, ominous của nguyên văn. Cách xưng hô “bà” tránh lối cổ nhưng vẫn giữ sự nghiêm trang.
