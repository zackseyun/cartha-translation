  text: And he said to them[a], “Men of Israel, be careful what you are about to do with these men.”
translation:
  language: vi
  text: 'Ông nói với họ[a]: “Thưa các ông Y-sơ-ra-ên, hãy cẩn thận về điều các ông sắp làm đối với những người này.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch sát cấu trúc: “Thưa các ông Y-sơ-ra-ên, hãy tự thận trọng về những người này, về điều các ông sắp làm.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπέν τε
  choice: Ông nói
  rationale: τέ nối nhẹ lời phát biểu này với diễn tiến trước đó; trong tiếng Việt, mạch kể đã đủ rõ nên không cần thêm một liên từ dễ làm câu nặng hoặc nhấn quá mức.
- source_word: πρὸς αὐτούς
  choice: với họ
  rationale: Với động từ nói, πρός + đối cách chỉ người được nói với; “nói với họ” là cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: Ἄνδρες Ἰσραηλῖται
  choice: Thưa những người Y-sơ-ra-ên
  rationale: Giữ sắc thái xưng hô trang trọng và căn tính Y-sơ-ra-ên của nhóm người nghe; “thưa” thể hiện chức năng hô cách tự nhiên, còn “những người” không xóa bỏ việc danh từ Hy Lạp ở giống đực nhưng tránh lối gọi gượng “các ông nam giới Y-sơ-ra-ên”.
- source_word: προσέχετε ἑαυτοῖς
  choice: hãy cẩn thận
  rationale: Mệnh lệnh cùng đại từ phản thân truyền đạt lời cảnh báo phải tự dè chừng. “Hãy cẩn thận” tự nhiên và giữ lực khuyên răn; ý phản thân được thể hiện qua việc cân nhắc hành động chính họ sắp làm.
- source_word: ἐπὶ τοῖς ἀνθρώποις τούτοις
  choice: đối với những người này
  rationale: ἐπί + tặng cách ở đây nêu đối tượng liên quan đến hành động đang được cân nhắc. “Đối với” giữ nghĩa rộng, không tự ý tăng sắc thái thù địch như “chống lại”.
- source_word: τί μέλλετε πράσσειν
  choice: điều các ông sắp làm
  rationale: μέλλω + nguyên mẫu diễn tả hành động sắp xảy ra hoặc đang được dự định; “sắp làm” giữ sắc thái hướng đến tương lai gần, còn “điều” tạo câu tiếng Việt tự nhiên.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “các ông” phù hợp với lời Gamaliel nói trực tiếp với các thành viên nam của Hội đồng; “Y-sơ-ra-ên” theo lối phiên âm Kinh Thánh quen thuộc. Dấu chân chú [a] đặt sau mệnh đề dẫn để ghi nhận cấu trúc sát chữ và sắc thái phản thân của προσέχετε ἑαυτοῖς.
