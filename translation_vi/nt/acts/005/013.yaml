  source_fidelity: Bản dịch giữ đúng cấu trúc tương phản và không giải quyết quá mức các quy chiếu còn mở của τῶν λοιπῶν và các đại từ αὐτοῖς/αὐτούς. Tuy nhiên, “nhập vào với họ” không diễn đạt tự nhiên ý κολλᾶσθαι, vốn là tự gắn mình/gắn bó với một nhóm hay người nào đó.
  naturalness: “Nhập vào với họ” là một kết hợp từ không tự nhiên trong tiếng Việt chuẩn hiện đại; “gắn bó với họ” tự nhiên hơn và vẫn giữ được độ mở về đối tượng. Câu còn lại rõ ràng, trang trọng, và phù hợp văn cảnh.
  terminology: “Dân chúng rất kính trọng họ” truyền đạt phù hợp ἐμεγάλυνεν αὐτούς trong ngữ cảnh, không tạo sắc thái thờ phượng. Không cần chú thích vì bản văn đã bảo toàn các điểm mơ hồ chính.
