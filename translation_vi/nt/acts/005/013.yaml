  text: τῶν δὲ λοιπῶν οὐδεὶς ἐτόλμα κολλᾶσθαι αὐτοῖς, ἀλλ’ ἐμεγάλυνεν αὐτοὺς ὁ λαός,
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/013.yaml
  text: But none of the rest dared to join them; rather, the people held them in high esteem.
translation:
  language: vi
  text: Nhưng không một ai trong số những người còn lại dám gắn bó với họ; trái lại, dân chúng rất kính trọng họ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τῶν λοιπῶν
  choice: trong số những người còn lại
  rationale: Giữ phạm vi quy chiếu có chủ ý chưa được xác định rõ trong nguyên văn, thay vì diễn giải họ là một nhóm cụ thể.
- source_word: κολλᾶσθαι αὐτοῖς
  choice: nhập vào với họ
  rationale: Diễn đạt ý gắn bó hoặc gia nhập nhóm, đồng thời giữ đại từ “họ” vốn có thể chỉ các sứ đồ hoặc cộng đồng tín hữu theo văn cảnh.
- source_word: ἐμεγάλυνεν αὐτοὺς
  choice: rất kính trọng họ
  rationale: Trong ngữ cảnh này, động từ mang nghĩa đề cao, coi trọng; cách dịch tự nhiên này tránh sắc thái thờ phượng không có trong câu.
- source_word: ἀλλ’
  choice: trái lại
  rationale: Thể hiện sự tương phản rõ giữa việc người ngoài không dám nhập vào và việc dân chúng vẫn kính trọng họ.
theological_decisions:
- issue: Đối tượng của đại từ αὐτοῖς/αὐτούς
  choice: Giữ là “họ”
  alternative: Diễn giải là “các sứ đồ” hoặc “các tín hữu”
  rationale: Nguyên văn dùng đại từ và văn cảnh cho phép hơn một cách xác định đối tượng; bản dịch không nên tự ý giải quyết sự mơ hồ này.
- issue: Căn tính của “những người còn lại”
  choice: Không xác định thêm
  alternative: Gọi họ là “những người ngoài hội thánh” hoặc một nhóm cụ thể khác
  rationale: Cụm từ Hy Lạp không trực tiếp nêu căn tính của họ, nên giữ nguyên độ mở của câu.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dấu chấm phẩy bảo toàn hai vế tương phản. Không thêm chú thích vì sự mơ hồ được giữ trực tiếp trong bản văn.
