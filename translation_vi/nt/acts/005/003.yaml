  naturalness: “Nói dối với Đức Thánh Linh” có thể hiểu được, nhưng tiếng Việt hiện đại tự nhiên hơn là “nói dối Đức Thánh Linh.” “Sa-tan đã làm đầy lòng anh” cũng tự nhiên hơn “Sa-tan đã lấp đầy lòng anh” trong văn phong Kinh Thánh hiện đại.
  terminology: “Đức Thánh Linh,” “Sa-tan,” “Phi-e-rơ,” và “A-na-nia” phù hợp với cách dùng Cơ Đốc tiếng Việt hiện đại. “Giữ lại một phần tiền bán mảnh đất” phản ánh tốt νοσφίσασθαι và ἀπὸ τῆς τιμῆς τοῦ χωρίου, không gán thêm một thuật ngữ pháp lý như “biển thủ.”
