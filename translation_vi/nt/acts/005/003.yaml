id: ACT.5.3
reference: Acts 5:3
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἶπεν δὲ ⸀ὁ Πέτρος· Ἁνανία, διὰ τί ἐπλήρωσεν ὁ Σατανᾶς τὴν καρδίαν σου, ψεύσασθαί σε τὸ πνεῦμα τὸ ἅγιον καὶ ⸀νοσφίσασθαι ἀπὸ τῆς τιμῆς τοῦ χωρίου;
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/003.yaml
  text: But Peter said[a], “Ananias[d][c][b], why has Satan filled your heart to lie to the Holy Spirit and to keep back some of the price of the land?”
translation:
  language: vi
  text: 'Nhưng Phi-e-rơ nói: “A-na-nia, tại sao Sa-tan đã làm đầy lòng anh đến nỗi anh nói dối Đức Thánh Linh[a] và giữ lại một phần tiền bán mảnh đất[b]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “lừa dối Đức Thánh Linh.” Động từ Hy Lạp ở đây có thể chỉ việc nói điều giả dối với một người; trong văn cảnh này, “nói dối” là cách dịch trực tiếp hơn.
    reason: lexical_alternative
  - marker: b
    text: “Tiền bán mảnh đất” cũng có thể dịch là “giá bán bất động sản” hoặc “số tiền thu được từ việc bán đất.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν δὲ ὁ Πέτρος
  choice: Nhưng Phi-e-rơ nói
  rationale: δέ là từ nối nhẹ; “nhưng” diễn đạt tự nhiên bước chuyển đối lập khi Phi-e-rơ vạch trần việc làm của A-na-nia.
- source_word: διὰ τί
  choice: tại sao
  rationale: Cách diễn đạt nghi vấn tự nhiên, trực tiếp trong tiếng Việt hiện đại.
- source_word: ἐπλήρωσεν ὁ Σατανᾶς τὴν καρδίαν σου
  choice: Sa-tan đã lấp đầy lòng anh
  rationale: Giữ nguyên hình ảnh “lấp đầy lòng” và Sa-tan là chủ thể, không diễn giải quá mức thành chiếm hữu hoặc cưỡng ép hoàn toàn.
- source_word: ψεύσασθαί σε τὸ πνεῦμα τὸ ἅγιον
  choice: khiến anh nói dối với Đức Thánh Linh
  rationale: “khiến anh” thể hiện quan hệ của động từ nguyên mẫu với mệnh đề “lấp đầy lòng anh”; “nói dối với” giữ nét nghĩa giao tiếp trực tiếp với một đối tượng.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: Đức Thánh Linh
  rationale: Danh xưng phổ thông, trang trọng và dễ hiểu trong tiếng Việt Cơ Đốc hiện đại.
- source_word: νοσφίσασθαι
  choice: giữ lại một phần
  rationale: Diễn đạt rõ hành động bí mật giữ lại cho mình một phần khoản tiền, phù hợp với văn cảnh mà không dùng thuật ngữ pháp lý quá hẹp.
- source_word: ἀπὸ τῆς τιμῆς τοῦ χωρίου
  choice: một phần tiền bán mảnh đất
  rationale: ἀπό với sở hữu cách mang ý lấy một phần từ toàn bộ; τιμή trong văn cảnh là giá hay tiền bán, còn χωρίον chỉ một mảnh đất hoặc bất động sản.
theological_decisions:
- issue: Vai trò của Sa-tan trong việc lấp đầy lòng A-na-nia
  choice: Giữ nguyên Sa-tan là chủ thể của hành động “lấp đầy lòng anh”.
  alternative: “tại sao anh để Sa-tan chiếm lấy lòng mình” hoặc “tại sao Sa-tan điều khiển anh”
  rationale: Bản Hy Lạp vừa nêu hành động của Sa-tan vừa tiếp tục quy trách nhiệm cho A-na-nia, nhưng không xác định đây là sự chiếm hữu hay cưỡng ép không thể cưỡng lại. Bản dịch giữ nguyên sức căng đó.
- issue: Việc nói dối với Đức Thánh Linh
  choice: Dịch trực tiếp là “nói dối với Đức Thánh Linh”.
  alternative: “lừa dối Đức Thánh Linh” hoặc “nói dối trước mặt Đức Thánh Linh”
  rationale: Cách dịch giữ tính trực tiếp và ngôi vị trong cấu trúc Hy Lạp, không thêm lời giải thích thần học vào chính câu Kinh Thánh.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh” khi Phi-e-rơ trực tiếp nói với A-na-nia; giữ hình ảnh Semit “lấp đầy lòng” thay vì giải nghĩa thành sự kiểm soát hoàn toàn. Các tên riêng được phiên âm theo lối quen thuộc trong tiếng Việt.
