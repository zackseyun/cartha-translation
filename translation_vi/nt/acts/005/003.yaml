  to: 'Nhưng Phi-e-rơ nói: “A-na-nia, tại sao Sa-tan đã làm đầy lòng anh đến nỗi anh nói dối Đức Thánh Linh[a] và giữ lại một phần tiền bán mảnh đất[b]?”'
