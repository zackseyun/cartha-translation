    issue: Cụm «Chúng tôi đã nghiêm lệnh cho các anh» không phải lối kết hợp từ tự nhiên trong tiếng Việt chuẩn hiện đại.
    rationale: «Nghiêm lệnh» thường hoạt động như danh từ hoặc trong các cấu trúc khác, nên không tự nhiên khi dùng như động từ ở đây. «Chúng tôi đã ra lệnh nghiêm khắc cho các anh» truyền đạt rõ việc ban lệnh với sắc thái nhấn mạnh của Παραγγελίᾳ παρηγγείλαμεν.
