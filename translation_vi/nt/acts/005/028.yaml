language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸀λέγων· Παραγγελίᾳ παρηγγείλαμεν ὑμῖν μὴ διδάσκειν ἐπὶ τῷ ὀνόματι τούτῳ, καὶ ἰδοὺ πεπληρώκατε τὴν Ἰερουσαλὴμ τῆς διδαχῆς ὑμῶν, καὶ βούλεσθε ἐπαγαγεῖν ἐφ’ ἡμᾶς τὸ αἷμα τοῦ ἀνθρώπου τούτου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/028.yaml
  text: saying[a], “We strictly ordered you not to teach in this name, and look, you have filled Jerusalem with your teaching, and you intend to bring this man's blood upon us.”
translation:
  language: vi
  text: 'nói: “Chúng tôi đã ra lệnh nghiêm khắc cho các anh không được giảng dạy nhân danh này. Thế mà, kìa, các anh đã làm cho Giê-ru-sa-lem tràn ngập lời dạy của các anh, và các anh muốn đổ máu của người này lên chúng tôi[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nói rõ hơn: “bắt chúng tôi chịu trách nhiệm về cái chết của người này.” Cách nói Hy Lạp “đổ máu của người này lên” ai đó là một thành ngữ chỉ việc quy trách nhiệm hoặc tội làm đổ máu cho người ấy.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Παραγγελίᾳ παρηγγείλαμεν
  choice: Chúng tôi đã nghiêm lệnh
  rationale: Danh từ ở cách dữ liệu đi với động từ cùng gốc tạo sắc thái nhấn mạnh. “Nghiêm lệnh” truyền đạt lực nhấn ấy một cách gọn và trang trọng trong tiếng Việt.
- source_word: μὴ διδάσκειν
  choice: không được giảng dạy
  rationale: Diễn đạt trực tiếp nội dung của lệnh cấm, không thêm ý diễn giải mạnh hơn là “phải ngừng giảng dạy”.
- source_word: ἐπὶ τῷ ὀνόματι τούτῳ
  choice: nhân danh này
  rationale: “Nhân danh” tự nhiên trong tiếng Việt và giữ được ý hành động, giảng dạy dựa trên thẩm quyền gắn với danh ấy, thay vì thu hẹp thành chỉ giảng “về” danh đó.
- source_word: ἰδοὺ
  choice: nhìn xem
  rationale: Giữ sắc thái chỉ trỏ, đối chất của từ Hy Lạp bằng cách diễn đạt hiện đại, dễ hiểu.
- source_word: πεπληρώκατε τὴν Ἰερουσαλὴμ
  choice: đã làm cho Giê-ru-sa-lem tràn ngập
  rationale: Giữ hình ảnh “làm đầy” và kết quả hiện còn của thì hoàn thành; “tràn ngập” tự nhiên hơn lối dịch máy móc “làm đầy” trong ngữ cảnh này.
- source_word: τῆς διδαχῆς ὑμῶν
  choice: lời dạy của các anh
  rationale: Diễn đạt rõ nội dung được truyền dạy, tránh sắc thái hệ phái có thể đi kèm từ “giáo lý”.
- source_word: βούλεσθε
  choice: các anh muốn
  rationale: Giữ ý chí, chủ tâm trong lời buộc tội mà không tăng cường quá mức thành “quyết tâm”.
- source_word: ἐπαγαγεῖν ἐφ’ ἡμᾶς
  choice: đổ ... lên chúng tôi
  rationale: Giữ chuyển động ẩn dụ “đem đến trên” trong thành ngữ quy trách nhiệm về máu, đồng thời tạo câu tiếng Việt dễ nhận biết trong văn cảnh.
- source_word: τὸ αἷμα τοῦ ἀνθρώπου τούτου
  choice: máu của người này
  rationale: Giữ nguyên hình ảnh máu và cách gọi xa cách, có phần khinh miệt “người này”, thay vì nêu tên Chúa Giê-su hoặc giải nghĩa ngay trong chính văn.
theological_decisions:
- issue: Hàm ý của câu “đổ máu của người này lên chúng tôi”
  choice: Giữ hình ảnh máu trong chính văn như một lời buộc tội rằng các lãnh đạo phải chịu trách nhiệm về cái chết của Chúa Giê-su.
  alternative: 'Dịch giải nghĩa: “bắt chúng tôi chịu trách nhiệm về cái chết của người này.”'
  rationale: Nguyên văn dùng thành ngữ về máu, gợi tội làm đổ máu và trách nhiệm đối với cái chết. Giữ hình ảnh trong chính văn bảo toàn sức nặng và độ căng thần học của câu; chú thích làm rõ nghĩa thành ngữ mà không thay thế nó bằng diễn giải.
translation_notes:
  register: Văn phong hiện đại, trang trọng và mang sắc thái đối chất. “Các anh” phù hợp với lời của thầy tế lễ thượng phẩm nói với nhóm sứ đồ, còn “người này” bảo toàn thái độ cố ý tránh gọi tên Chúa Giê-su. Dấu chú thích được đặt ngay sau thành ngữ mà chú thích giải thích.
