revisions:
- from: 'nói: “Chúng tôi đã nghiêm lệnh cho các anh không được giảng dạy nhân danh này. Vậy mà, nhìn xem, các anh đã làm cho Giê-ru-sa-lem tràn ngập lời dạy của các anh, và các anh muốn đổ máu của người này lên chúng tôi[a].”'
  to: 'nói: “Chúng tôi đã ra lệnh nghiêm khắc cho các anh không được giảng dạy nhân danh này. Thế mà, kìa, các anh đã làm cho Giê-ru-sa-lem tràn ngập lời dạy của các anh, và các anh muốn đổ máu của người này lên chúng tôi[a].”'
  rationale: Chỉnh hai điểm diễn đạt để tiếng Việt hiện đại tự nhiên hơn, không thay đổi nghĩa. Bản sửa vẫn bảo toàn sắc thái nhấn mạnh của lệnh cấm, hình ảnh Giê-ru-sa-lem được làm cho tràn ngập lời dạy, ý chí bị cáo buộc, và thành ngữ «máu ... lên chúng tôi».
