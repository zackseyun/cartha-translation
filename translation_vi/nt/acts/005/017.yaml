  rationale: Sửa chức danh và quan hệ nhóm người để bám sát nguyên văn hơn, đồng thời làm câu tiếng Việt tự nhiên hơn. Không thay đổi cách hiểu “phái” hay nghĩa tiêu cực của ζῆλος; các chú thích vẫn được giữ đúng điểm neo và đúng phạm vi từ vựng.
