  - severity: low
    issue: “thầy thượng tế” kém tự nhiên trong tiếng Việt hiện đại.
    rationale: “Thượng tế” chuyển đạt đầy đủ chức danh ἀρχιερεύς và tránh lối ghép danh xưng không cần thiết.
