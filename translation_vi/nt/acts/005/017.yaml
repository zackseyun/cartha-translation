source:
  edition: SBLGNT
  text: Ἀναστὰς δὲ ὁ ἀρχιερεὺς καὶ πάντες οἱ σὺν αὐτῷ, ἡ οὖσα αἵρεσις τῶν Σαδδουκαίων, ἐπλήσθησαν ζήλου
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/017.yaml
  text: But the high priest rose up[a], and all those with him—that is[b], the party of the Sadducees—and were filled with jealousy.
translation:
  language: vi
  text: Nhưng thượng tế đứng dậy, cùng tất cả những người ở với ông—tức là phái Sa-đu-sê[a]—đều đầy lòng ghen tức[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hoặc “giáo phái Sa-đu-sê.” Từ Hy Lạp có thể chỉ một phái, một nhóm hoặc một trường phái.
    reason: lexical_alternative
  - marker: b
    text: Hoặc “đố kỵ.” Từ Hy Lạp cũng có thể có nghĩa là “lòng nhiệt thành,” nhưng văn cảnh ở đây nghiêng về nghĩa thù nghịch.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀναστὰς
  choice: đứng lên
  rationale: Phân từ bất định quá khứ của ἀνίστημι mở đầu một hành động quyết liệt. “Đứng lên” vừa giữ được hình ảnh của nguyên văn vừa tự nhiên trong lời kể tiếng Việt.
- source_word: δὲ
  choice: Nhưng
  rationale: δέ đánh dấu sự tương phản nhẹ giữa phản ứng thuận lợi của dân chúng ở phần trước và hành động chống đối tại đây.
- source_word: ὁ ἀρχιερεὺς
  choice: thầy thượng tế
  rationale: Cách gọi quen thuộc, chính xác cho chức vụ thượng tế trong bối cảnh Do Thái.
- source_word: πάντες οἱ σὺν αὐτῷ
  choice: tất cả những người theo ông
  rationale: Diễn đạt nhóm người đứng cùng phía và liên kết với thầy thượng tế mà không xác định quá mức địa vị chính thức của họ.
- source_word: ἡ οὖσα αἵρεσις τῶν Σαδδουκαίων
  choice: tức là phái Sa-đu-sê
  rationale: Cụm đồng vị giải thích những người theo thầy thượng tế là nhóm Sa-đu-sê. “Phái” dễ hiểu và tránh hàm ý tiêu cực về tà giáo mà từ “giáo phái” đôi khi gợi ra.
- source_word: ἐπλήσθησαν
  choice: họ đầy lòng
  rationale: Giữ thành ngữ bị động “được/làm cho đầy” theo cách diễn đạt tự nhiên của tiếng Việt; đại từ “họ” làm rõ chủ ngữ số nhiều gồm thầy thượng tế và những người theo ông.
- source_word: ζήλου
  choice: ghen tức
  rationale: ζῆλος có thể chỉ lòng nhiệt thành, ghen ghét hoặc đố kỵ; trong bối cảnh chống đối các sứ đồ, nghĩa tiêu cực “ghen tức” phù hợp nhất.
theological_decisions:
- issue: Cách dịch αἵρεσις
  choice: phái
  alternative: giáo phái; nhóm
  rationale: Ở đây từ này chỉ một phe hoặc trường phái được nhận biết trong Do Thái giáo thời ấy, không nhất thiết mang nghĩa “tà giáo”. “Phái” bảo toàn ý nghĩa xã hội-tôn giáo mà không đưa vào sắc thái luận chiến về sau.
- issue: Cách hiểu ζῆλος trong văn cảnh
  choice: ghen tức
  alternative: đố kỵ; nhiệt thành
  rationale: Bản thân từ Hy Lạp có thể mang nghĩa tích cực hoặc tiêu cực, nhưng hành động bắt bớ tiếp theo cho thấy ở đây động cơ mang nghĩa tiêu cực. Chú thích vẫn giữ lại phạm vi nghĩa vốn có của từ.
translation_notes:
  register: 'Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “thầy thượng tế” theo cách gọi Kinh Thánh quen thuộc; dùng “phái” thay cho cách gọi dễ mang sắc thái kết án. Dấu chấm phẩy giúp câu dài rõ quan hệ: cả thầy thượng tế lẫn nhóm theo ông đều đầy lòng ghen tức.'
