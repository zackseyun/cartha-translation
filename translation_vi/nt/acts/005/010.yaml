  text: ἔπεσεν δὲ παραχρῆμα ⸀πρὸς τοὺς πόδας αὐτοῦ καὶ ἐξέψυξεν· εἰσελθόντες δὲ οἱ νεανίσκοι εὗρον αὐτὴν νεκράν, καὶ ἐξενέγκαντες ἔθαψαν πρὸς τὸν ἄνδρα αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/010.yaml
  text: Then she immediately fell at his feet and died. When the young men came in, they found her dead, and they carried her out and buried her beside her husband.
translation:
  language: vi
  text: Ngay lập tức, bà ngã xuống dưới chân ông và tắt thở. Các thanh niên bước vào, thấy bà đã chết, liền khiêng bà ra và chôn bên cạnh chồng bà.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραχρῆμα
  choice: ngay lập tức
  rationale: Diễn đạt trực tiếp tính tức thời của sự việc bằng tiếng Việt tự nhiên.
- source_word: ἐξέψυξεν
  choice: tắt thở
  rationale: Giữ hình ảnh của động từ Hy Lạp về việc hơi thở/sự sống lìa khỏi người, đồng thời là cách nói trang trọng, dễ hiểu về cái chết.
- source_word: πρὸς τοὺς πόδας αὐτοῦ
  choice: dưới chân ông
  rationale: Thể hiện vị trí bà ngã xuống sát chân Phi-e-rơ; đại từ được giữ nguyên để không thêm tên không có trong câu.
- source_word: πρὸς τὸν ἄνδρα αὐτῆς
  choice: bên cạnh chồng bà
  rationale: Trong ngữ cảnh chôn cất, πρός chỉ vị trí gần hoặc bên cạnh; 'chồng bà' là nghĩa tự nhiên của ὁ ἀνήρ với sở hữu cách.
