  text: ἀπεκρίθη δὲ ⸂πρὸς αὐτὴν⸃ ⸀Πέτρος· Εἰπέ μοι, εἰ τοσούτου τὸ χωρίον ἀπέδοσθε; ἡ δὲ εἶπεν· Ναί, τοσούτου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/008.yaml
  text: But Peter answered her[a], “Tell me, did you sell the land for this much?” And she said, “Yes, for this much.”
translation:
  language: vi
  text: 'Nhưng Phi-e-rơ đáp lời bà: “Hãy nói cho tôi biết: có phải ông bà đã bán mảnh đất[a] với giá ngần ấy không?” Bà đáp: “Vâng, ngần ấy.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hoặc “bất động sản/tài sản” hay “thửa ruộng” (cho từ Hy Lạp χωρίον).
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη δὲ πρὸς αὐτὴν Πέτρος
  choice: Nhưng Phi-e-rơ hỏi bà
  rationale: δέ đánh dấu bước chuyển trong trình thuật nên dịch là “Nhưng”. Dù ἀπεκρίθη thường có nghĩa là “đáp lời”, trong ngữ cảnh Phi-e-rơ chủ động đặt câu hỏi cho Sa-phi-ra, “hỏi bà” là cách diễn đạt tự nhiên trong tiếng Việt và vẫn truyền đạt chức năng lời nói.
- source_word: Εἰπέ μοι
  choice: Hãy nói cho tôi biết
  rationale: Diễn đạt tự nhiên mệnh lệnh aorist của λέγω đi với đại từ ở cách dữ cách, đồng thời giữ sắc thái trực tiếp của lời chất vấn.
- source_word: εἰ
  choice: có phải ... không
  rationale: εἰ mở đầu một câu hỏi có/không gián tiếp về hình thức nhưng trực tiếp về chức năng; cấu trúc “có phải ... không?” là tiếng Việt tự nhiên.
- source_word: τοσούτου
  choice: với giá ấy / đúng giá ấy
  rationale: Từ này chỉ số tiền vừa được nêu trong ngữ cảnh. “Giá ấy” giữ tính quy chiếu mà không thêm một con số không có trong câu; ở lời đáp, “đúng” diễn đạt tự nhiên lời xác nhận.
- source_word: τὸ χωρίον
  choice: mảnh đất
  rationale: χωρίον ở đây chỉ một phần đất hoặc bất động sản đã bán. “Mảnh đất” phù hợp ngữ cảnh và tự nhiên hơn “tài sản”, nhưng không thu hẹp thành một loại ruộng cụ thể.
- source_word: ἀπέδοσθε
  choice: ông bà đã bán
  rationale: Trong ngữ cảnh giao dịch, ἀποδίδωμι mang nghĩa “bán”. Động từ ở ngôi thứ hai số nhiều; “ông bà” làm rõ Phi-e-rơ hỏi về hành động chung của Sa-phi-ra và chồng bà, đồng thời duy trì cách xưng hô lịch sự.
- source_word: Ναί
  choice: Vâng
  rationale: Lời khẳng định đơn giản; “Vâng” tự nhiên, trang trọng vừa phải và phù hợp khi người phụ nữ trả lời Phi-e-rơ.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. Câu hỏi giữ tính chất chất vấn trực tiếp. Không thêm chú thích vì ghi chú tiếng Anh được gắn nhầm vào “her”; các nghĩa gần của χωρίον đã được cân nhắc trong lựa chọn “mảnh đất” và không cần thiết phải chú thích trong câu ngắn này.
