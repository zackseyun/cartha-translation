    rationale: ἀποκρίνομαι trong câu này có nghĩa là “đáp lời/trả lời”; việc Phi-e-rơ tiếp tục bằng một câu hỏi không cho phép thay động từ dẫn lời bằng “hỏi.”
  - severity: low
    issue: “đúng giá ấy” thêm sắc thái nhấn mạnh không được biểu thị rõ bởi Ναί, τοσούτου.
    rationale: Lời đáp tiếng Hy Lạp chỉ xác nhận “vâng, ngần ấy [giá],” và có thể dịch sát, tự nhiên mà không thêm “đúng.”
  - severity: low
    issue: Thiếu chú thích cho tính đa nghĩa của χωρίον.
    rationale: Dấu chú thích tiếng Anh được đặt không nhất quán, nhưng nội dung chú thích thực chất liên quan χωρίον; bản tiếng Việt nên neo chú thích tại “mảnh đất.”
