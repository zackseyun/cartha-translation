review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch giữ đúng trình tự của phân từ προηγούμενο và các hành động chính: gọi các sứ đồ đến, đánh, ra lệnh, rồi thả. Tuy nhiên, nguyên văn chỉ có «Giê-su» (τοῦ Ἰησοῦ), không có danh xưng «Chúa»; việc thêm «Chúa» trong bản văn chính làm vượt quá dữ liệu nguồn tại câu này.'
  naturalness: Câu văn rõ ràng, tự nhiên và phù hợp văn phong Kinh Thánh tiếng Việt hiện đại. «Gọi các sứ đồ đến» tự nhiên hơn «gọi ... vào» khi không cần xác định một không gian cụ thể.
  terminology: «Sứ đồ», «đánh đòn», «ra lệnh», và «nhân danh» đều phù hợp. Cần dùng nhất quán «Giê-su» thay vì «Chúa Giê-su» để phản ánh chính xác câu nguồn. Chú thích nên diễn đạt phương án thay thế tự nhiên hơn trong tiếng Việt.
  issues:
  - severity: medium
    issue: Thêm danh xưng «Chúa» vào cụm «nhân danh Chúa Giê-su».
    rationale: SBLGNT đọc ἐπὶ τῷ ὀνόματι τοῦ Ἰησοῦ, nghĩa đen là «trên/về nhân danh Giê-su», không có κύριος («Chúa»). Lối kính ngữ không nên được thêm vào bản văn khi không có trong nguồn, nhất là tại một cụm từ được chú thích về sắc thái nghĩa.
