  to: Sau khi gọi các sứ đồ đến, họ đánh đòn các ông, ra lệnh không được nói nhân danh Giê-su[a], rồi thả các ông ra.
  rationale: Bỏ «Chúa» để không thêm một danh xưng không có trong nguyên văn. Điều chỉnh «gọi ... vào» thành «gọi ... đến» cho tự nhiên, không thay đổi nghĩa. Chú thích tiếp tục bảo tồn phạm vi nghĩa của ἐπὶ τῷ ὀνόματι mà không ép thành ngữ vào một cách hiểu duy nhất.
