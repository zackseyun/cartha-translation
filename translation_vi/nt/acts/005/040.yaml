  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ προσκαλεσάμενοι τοὺς ἀποστόλους δείραντες παρήγγειλαν μὴ λαλεῖν ἐπὶ τῷ ὀνόματι τοῦ Ἰησοῦ καὶ ⸀ἀπέλυσαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/040.yaml
  text: And after summoning the apostles[a], they beat them, ordered them not to speak in the name of Jesus, and released them.
translation:
  language: vi
  text: Sau khi gọi các sứ đồ đến, họ đánh đòn các ông, ra lệnh không được nói nhân danh Giê-su[a], rồi thả các ông ra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: «nói về Giê-su» hoặc «nói dựa vào danh Giê-su». Thành ngữ Hy Lạp có thể bao hàm việc nói liên quan đến Giê-su và nói dưới thẩm quyền của ngài.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκαλεσάμενοι
  choice: Sau khi gọi ... vào
  rationale: Phân từ bất định quá khứ diễn tả hành động xảy ra trước các động từ chính; cách dịch này tự nhiên và giữ rõ trình tự.
- source_word: τοὺς ἀποστόλους
  choice: các sứ đồ
  rationale: “Sứ đồ” là thuật ngữ Kinh Thánh quen thuộc trong tiếng Việt, chỉ những người được sai phái làm chứng; trong ngữ cảnh này là nhóm các sứ đồ đã bị bắt giữ.
- source_word: δείραντες
  choice: họ đánh đòn các ông
  rationale: Động từ δέρω có nghĩa rộng là đánh hoặc quất. “Đánh đòn” phù hợp với hình phạt trong ngữ cảnh mà không xác định quá mức hình thức hành hình.
- source_word: παρήγγειλαν
  choice: ra lệnh
  rationale: Diễn đạt rõ sức mạnh mệnh lệnh của παραγγέλλω và tự nhiên trong bối cảnh nhà chức trách.
- source_word: μὴ λαλεῖν
  choice: không được nói
  rationale: μή với động từ nguyên mẫu nêu nội dung của lệnh cấm; “không được nói” tự nhiên và thể hiện rõ tính bắt buộc.
- source_word: ἐπὶ τῷ ὀνόματι τοῦ Ἰησοῦ
  choice: nhân danh Chúa Giê-su
  rationale: Giữ thành ngữ Kinh Thánh quen thuộc và bao hàm việc nói liên quan đến Chúa Giê-su cũng như dựa trên thẩm quyền của Ngài. Danh xưng “Chúa” không hiện diện trong cụm Hy Lạp này nên là yếu tố kính ngữ được bổ sung theo lối dùng tiếng Việt; chú thích nêu rõ phạm vi nghĩa của thành ngữ.
- source_word: ἀπέλυσαν
  choice: thả các ông ra
  rationale: ἀπολύω ở đây chỉ việc cho ra khỏi tình trạng bị giam giữ; cách nói này tự nhiên, rõ nghĩa trong tiếng Việt.
theological_decisions:
- issue: Cách dịch thành ngữ ἐπὶ τῷ ὀνόματι τοῦ Ἰησοῦ
  choice: nhân danh Chúa Giê-su
  alternative: nói về danh Giê-su; nói dựa trên danh Giê-su
  rationale: Thành ngữ có thể gợi cả đối tượng lời rao giảng lẫn thẩm quyền làm nền tảng cho lời nói. Bản dịch chính giữ cách diễn đạt rộng, còn chú thích bảo tồn các sắc thái khác.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “các ông” để tránh lặp “các sứ đồ” và giữ thái độ kể chuyện trung tính. “Chúa Giê-su” là cách gọi kính trọng, quen thuộc trong tiếng Việt, dù nguyên văn tại đây chỉ có “Giê-su”.
