id: ACT.5.29
reference: Acts 5:29
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ Πέτρος καὶ οἱ ἀπόστολοι εἶπαν· Πειθαρχεῖν δεῖ θεῷ μᾶλλον ἢ ἀνθρώποις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/029.yaml
  text: But Peter and the apostles answered[a], “We must obey God rather than men.”
translation:
  language: vi
  text: 'Nhưng Phi-e-rơ và các sứ đồ đáp: “Phải vâng lời Đức Chúa Trời hơn là vâng lời người ta.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “con người.” Từ Hy Lạp chỉ con người nói chung; trong ngữ cảnh này, nó đặc biệt bao gồm các nhà cầm quyền đang ra lệnh cho các sứ đồ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς ... εἶπαν
  choice: đáp
  rationale: Hai hình thức động từ cùng tạo nên công thức trả lời trong lối kể chuyện; dịch gọn là “đáp” vừa tự nhiên trong tiếng Việt vừa tránh lặp ý.
- source_word: δὲ
  choice: Nhưng
  rationale: Liên từ này đánh dấu sự chuyển ý có tính tương phản với mệnh lệnh vừa được đưa ra.
- source_word: Πέτρος καὶ οἱ ἀπόστολοι
  choice: Phi-e-rơ và các sứ đồ
  rationale: Dùng cách phiên âm tên riêng và thuật ngữ Kinh Thánh quen thuộc trong tiếng Việt; ở đây “các sứ đồ” chỉ nhóm sứ đồ được xác định trong ngữ cảnh.
- source_word: Πειθαρχεῖν
  choice: vâng lời
  rationale: Động từ diễn tả việc tuân phục một người có thẩm quyền; “vâng lời” rõ ràng và tự nhiên trong ngữ cảnh.
- source_word: δεῖ
  choice: Phải
  rationale: Diễn đạt sự cần thiết hay bổn phận. Không thêm chủ ngữ giúp giữ được sắc thái khái quát của cấu trúc vô nhân xưng Hy Lạp, đồng thời vẫn bao gồm những người đang nói.
- source_word: θεῷ
  choice: Đức Chúa Trời
  rationale: Đây là đối tượng ở cách dữ của động từ “vâng lời”; dùng danh xưng tiếng Việt quen thuộc và trang trọng.
- source_word: μᾶλλον ἢ
  choice: hơn là
  rationale: Giữ trực tiếp phép so sánh giữa hai đối tượng của sự vâng lời.
- source_word: ἀνθρώποις
  choice: người ta
  rationale: Trong ngữ cảnh, từ này chỉ con người nói chung, đặc biệt là những nhà cầm quyền đang ra lệnh, đối lập với Đức Chúa Trời. “Người ta” tự nhiên trong tiếng Việt và không giới hạn vào nam giới.
theological_decisions:
- issue: Phạm vi của mệnh đề về bổn phận vâng lời
  choice: 'Giữ cấu trúc không nêu chủ ngữ: “Phải vâng lời...”'
  alternative: “Chúng ta phải vâng lời...”
  rationale: Cấu trúc Hy Lạp dùng δεῖ với động từ nguyên mẫu, không nêu rõ chủ ngữ. Bản dịch không thêm “chúng ta” để bảo toàn cả sự áp dụng trực tiếp cho các sứ đồ lẫn sắc thái nguyên tắc khái quát.
- issue: Sự đối lập giữa Đức Chúa Trời và ἀνθρώποις
  choice: “Đức Chúa Trời ... người ta”
  alternative: “Đức Chúa Trời ... loài người” hoặc “Đức Chúa Trời ... con người”
  rationale: Cách dịch này giữ sự đối lập thần học của câu mà không biến nó thành lời khẳng định rằng mọi mệnh lệnh của mọi người đều bị bác bỏ; ngữ cảnh nói đến các nhà cầm quyền đang truyền lệnh trái với bổn phận đối với Đức Chúa Trời.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu ngắn giữ sức nặng của lời đáp; “Phi-e-rơ” và “các sứ đồ” theo cách dùng Kinh Thánh tiếng Việt quen thuộc.
