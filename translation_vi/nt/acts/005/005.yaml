language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀκούων δὲ ὁ Ἁνανίας τοὺς λόγους τούτους πεσὼν ἐξέψυξεν· καὶ ἐγένετο φόβος μέγας ἐπὶ πάντας τοὺς ⸀ἀκούοντας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/005.yaml
  text: But when Ananias heard these words[a], he fell down and died. And great fear came upon all who heard.
translation:
  language: vi
  text: Nhưng khi A-na-nia nghe những lời ấy, ông ngã xuống và chết.[a] Một nỗi sợ hãi lớn ập đến trên tất cả những người nghe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát nghĩa hơn: “tắt thở” hoặc “trút hơi thở cuối cùng.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούων
  choice: khi ... nghe
  rationale: Phân từ hiện tại mang ý nghĩa thời gian trong ngữ cảnh, diễn tả phản ứng xảy ra khi A-na-nia nghe lời Phi-e-rơ.
- source_word: δὲ
  choice: Nhưng
  rationale: Liên từ đánh dấu bước chuyển của câu chuyện và sắc thái tương phản nhẹ với lời Phi-e-rơ vừa nói.
- source_word: Ἁνανίας
  choice: A-na-nia
  rationale: Dùng dạng phiên âm quen thuộc trong tiếng Việt cho tên riêng Hy Lạp.
- source_word: λόγους τούτους
  choice: những lời ấy
  rationale: Trong ngữ cảnh, cụm từ chỉ những lời Phi-e-rơ vừa nói; cách diễn đạt này tự nhiên và giữ được liên hệ hồi chỉ.
- source_word: πεσὼν
  choice: ông ngã xuống
  rationale: Giữ hình ảnh thân thể cụ thể của động từ thay vì diễn giải thành 'gục xuống' hay 'ngã quỵ'.
- source_word: ἐξέψυξεν
  choice: chết
  rationale: Động từ diễn tả việc lìa đời, theo nghĩa sát là tắt thở. 'Chết' rõ ràng trong văn kể chuyện hiện đại, còn sắc thái nguyên ngữ được giữ trong chú thích.
- source_word: ἐγένετο φόβος μέγας
  choice: Một nỗi sợ hãi lớn bao trùm
  rationale: Diễn đạt tự nhiên sự xuất hiện và lan tới của nỗi sợ, đồng thời phản ánh cấu trúc với ἐπί ở phần sau.
- source_word: ἐπὶ πάντας τοὺς ἀκούοντας
  choice: tất cả những người nghe tin này
  rationale: Phân từ được dùng như danh từ, chỉ mọi người nghe về sự việc. 'Nghe tin này' làm rõ cách hiểu tự nhiên trong ngữ cảnh mà không giới hạn họ vào những người trực tiếp có mặt.
theological_decisions:
- issue: Bản chất cái chết của A-na-nia
  choice: Trình bày thẳng rằng ông ngã xuống và chết, không xác định cơ chế gây ra cái chết.
  alternative: Diễn giải rằng ông chết vì sốc, hoặc rằng Đức Chúa Trời trực tiếp đánh chết ông.
  rationale: Bản văn Hy Lạp thuật lại cái chết tức thời và nỗi sợ tiếp theo nhưng không nói rõ cơ chế; bản dịch không nên giải quyết điều mà câu văn để ngỏ.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng 'ông' để chỉ A-na-nia cho tự nhiên; giữ hình ảnh 'ngã xuống' và tránh thêm lời giải thích thần học về nguyên nhân cái chết.
