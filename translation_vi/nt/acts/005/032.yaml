id: ACT.5.32
reference: Acts 5:32
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἡμεῖς ⸀ἐσμεν μάρτυρες τῶν ῥημάτων τούτων, καὶ τὸ ⸀πνεῦμα τὸ ἅγιον ὃ ἔδωκεν ὁ θεὸς τοῖς πειθαρχοῦσιν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/032.yaml
  text: And we are witnesses of these things[a], and so is the Holy Spirit[c][b], whom God has given to those who obey him.
translation:
  language: vi
  text: Chúng tôi là những chứng nhân về những điều này[a], và Đức Thánh Linh cũng là chứng nhân, là Đấng mà Đức Chúa Trời đã ban cho những người vâng phục Ngài.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “những lời này” hoặc “những sự việc này”.
    reason: lexical_alternative
lexical_decisions:
- source_word: μάρτυρες
  choice: những chứng nhân
  rationale: Diễn đạt tự nhiên vai trò của những người trực tiếp làm chứng, đồng thời giữ sắc thái chứng thực trong sách Công Vụ.
- source_word: ῥημάτων
  choice: những điều
  rationale: Trong ngữ cảnh này, ῥήματα chỉ các sự việc hoặc nội dung vừa được thuật lại; “những điều” tự nhiên hơn “những lời” trong tiếng Việt, nhưng vẫn giữ phương án khác trong chú thích.
- source_word: πνεῦμα τὸ ἅγιον
  choice: Đức Thánh Linh
  rationale: Cách gọi trang trọng, thông dụng trong tiếng Việt hiện đại dành cho Chúa Thánh Linh, phù hợp với ngữ cảnh Lu-ca–Công Vụ.
- source_word: ὃ
  choice: là Đấng
  rationale: Đại từ Hy Lạp mang hình thức trung tính do hòa hợp ngữ pháp với πνεῦμα; tiếng Việt dùng “Đấng” để quy chiếu tự nhiên đến một chủ thể có ngôi vị.
- source_word: ἔδωκεν
  choice: đã ban
  rationale: Giữ giá trị quá khứ của động từ aorist và dùng “ban” phù hợp với hành động Đức Chúa Trời ban Đức Thánh Linh.
- source_word: πειθαρχοῦσιν
  choice: vâng phục
  rationale: Thể hiện ý vâng theo thẩm quyền, đồng thời liên kết rõ với lời tuyên bố vâng lời Đức Chúa Trời ở Công Vụ 5:29.
- source_word: αὐτῷ
  choice: Ngài
  rationale: Đại từ quy chiếu về Đức Chúa Trời; viết hoa theo quy ước tôn kính phổ biến mà không làm thay đổi nội dung.
theological_decisions:
- issue: Đức Thánh Linh có được trình bày là cùng làm chứng với các sứ đồ hay không
  choice: Dịch “và Đức Thánh Linh cũng vậy”, chuyển tiếp vị ngữ “là chứng nhân” từ mệnh đề trước.
  alternative: “và Đức Thánh Linh [cũng là chứng nhân]” hoặc “và cả Đức Thánh Linh”
  rationale: Mệnh đề thứ hai trong tiếng Hy Lạp không có động từ nhưng tự nhiên tiếp nhận vị ngữ từ mệnh đề đầu. Cách dịch này làm rõ cú pháp mà không thêm một khẳng định ngoài văn bản.
- issue: Cách quy chiếu đến Đức Thánh Linh bằng đại từ quan hệ
  choice: 'Dùng cách nói có tính ngôi vị: “là Đấng”.'
  alternative: “mà”
  rationale: ὃ có hình thức trung tính vì hòa hợp với danh từ trung tính πνεῦμα. Tiếng Việt không cần mô phỏng giống ngữ pháp Hy Lạp; “Đấng” thể hiện tự nhiên rằng Đức Thánh Linh là chủ thể được Đức Chúa Trời ban, mà không dựa riêng vào hình thức giống của đại từ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “chứng nhân” để giữ sắc thái lời chứng; cấu trúc “cũng vậy” giúp câu tự nhiên trong tiếng Việt. Mọi dấu chú thích đều xuất hiện trong chính văn.
