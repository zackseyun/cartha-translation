revisions:
- from: Chúng tôi là những chứng nhân về những điều này[a], và Đức Thánh Linh cũng vậy[b], là Đấng Đức Chúa Trời đã ban cho những người vâng phục Ngài.
  to: Chúng tôi là những chứng nhân về những điều này[a], và Đức Thánh Linh cũng là chứng nhân, là Đấng mà Đức Chúa Trời đã ban cho những người vâng phục Ngài.
  rationale: Sửa “cũng vậy” thành “cũng là chứng nhân” để diễn đạt minh bạch vị ngữ được lược trong mệnh đề Hy Lạp thứ hai. Thêm “mà” sau “Đấng” để mệnh đề quan hệ tiếng Việt liên kết tự nhiên. Chú thích b được giữ và điều chỉnh nhẹ để khớp chính xác với bản văn đã sửa; ý nghĩa không thay đổi.
