  text: Ἐγένετο δὲ ὡς ὡρῶν τριῶν διάστημα καὶ ἡ γυνὴ αὐτοῦ μὴ εἰδυῖα τὸ γεγονὸς εἰσῆλθεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/007.yaml
  text: After an interval of about three hours, his wife came in, not knowing what had happened.
translation:
  language: vi
  text: Khoảng ba giờ sau, vợ ông đi vào mà không biết chuyện gì đã xảy ra.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: Khoảng ba giờ sau
  rationale: Cụm này dẫn sang diễn biến kế tiếp trong câu chuyện; tiếng Việt tự nhiên có thể thể hiện sự chuyển tiếp qua trạng ngữ thời gian mà không cần thêm “bấy giờ” hay “xảy ra rằng”.
- source_word: ὡς ὡρῶν τριῶν διάστημα
  choice: Khoảng ba giờ sau
  rationale: ὡς cho thấy thời lượng mang tính xấp xỉ, còn διάστημα chỉ một khoảng thời gian; cách diễn đạt này ngắn gọn, tự nhiên và giữ rõ ý đã trôi qua khoảng ba giờ.
- source_word: ἡ γυνὴ αὐτοῦ
  choice: vợ ông
  rationale: Trong ngữ cảnh, γυνή chỉ người vợ của A-na-nia. “Ông” là đại từ hồi chỉ tự nhiên, trang trọng vừa phải trong tiếng Việt.
- source_word: μὴ εἰδυῖα
  choice: mà không biết
  rationale: Phân từ diễn tả tình trạng của người vợ khi bà đi vào; “mà không biết” giữ quan hệ đồng thời và đọc tự nhiên.
- source_word: τὸ γεγονὸς
  choice: chuyện gì đã xảy ra
  rationale: Phân từ hoàn thành được danh từ hóa, chỉ sự việc đã xảy ra trước lúc bà bước vào. “Chuyện gì đã xảy ra” là cách nói tự nhiên và không thêm nội dung ngoài nguyên văn.
- source_word: εἰσῆλθεν
  choice: đi vào
  rationale: Động từ có nghĩa là vào trong. “Đi vào” tránh áp đặt điểm nhìn không được câu Hy Lạp xác định rõ như cách phân biệt “đi vào” và “đến vào” trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Tiếng Việt hiện đại, rõ ràng và trang trọng vừa phải. Câu giữ nhịp kể chuyện tự nhiên, không dùng công thức cổ như “xảy ra rằng”, đồng thời bảo toàn sắc thái xấp xỉ của ὡς.
