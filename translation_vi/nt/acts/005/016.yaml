revisions:
- from: Cả đoàn người từ các thành quanh Giê-ru-sa-lem cũng kéo đến[a], đem theo những người bệnh và những người bị các tà linh quấy nhiễu[b]; tất cả họ đều được chữa lành.
  to: Đoàn người từ các thành quanh Giê-ru-sa-lem cũng kéo đến[a], đem theo những người bệnh và những người bị các linh ô uế quấy nhiễu[b]; tất cả những người ấy đều được chữa lành.
  rationale: Bản sửa giữ cách diễn đạt tự nhiên của bản nháp cho hành động kéo đến và việc đem người bệnh đến, đồng thời thay thuật ngữ diễn giải “tà linh” bằng “các linh ô uế” sát nguyên ngữ. Cụm kết được làm rõ tiền từ để phạm vi “tất cả” là những người bệnh và người bị các linh ô uế quấy nhiễu, như trong tiếng Hy Lạp.
