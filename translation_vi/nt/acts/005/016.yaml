id: ACT.5.16
reference: Acts 5:16
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: συνήρχετο δὲ καὶ τὸ πλῆθος τῶν πέριξ ⸀πόλεων Ἰερουσαλήμ, φέροντες ἀσθενεῖς καὶ ὀχλουμένους ὑπὸ πνευμάτων ἀκαθάρτων, οἵτινες ἐθεραπεύοντο ἅπαντες.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/016.yaml
  text: And even the multitude from the towns around Jerusalem was coming together[a], bringing the sick and those troubled by unclean spirits[b], and they were all being healed.
translation:
  language: vi
  text: Đoàn người từ các thành quanh Giê-ru-sa-lem cũng kéo đến[a], đem theo những người bệnh và những người bị các linh ô uế quấy nhiễu[b]; tất cả những người ấy đều được chữa lành.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “cũng tụ họp lại”.
    reason: lexical_alternative
  - marker: b
    text: Hay “bị các linh ô uế hành hạ”.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνήρχετο
  choice: kéo đến
  rationale: Diễn đạt tự nhiên hành động nhiều người liên tục hoặc lần lượt tụ họp đến trong quá khứ, phù hợp thể chưa hoàn thành.
- source_word: τὸ πλῆθος
  choice: đoàn người
  rationale: Chỉ một số đông người như một tập thể; cách nói hiện đại, tự nhiên hơn lối dịch nặng văn phong như “đám đông đông đảo”.
- source_word: τῶν πέριξ πόλεων Ἰερουσαλήμ
  choice: từ các thành quanh Giê-ru-sa-lem
  rationale: Giữ rõ ý những khu dân cư hoặc thành ở vùng lân cận Giê-ru-sa-lem mà không hàm ý chúng thuộc về thành phố này.
- source_word: φέροντες
  choice: đem theo
  rationale: Phân từ hiện tại mô tả việc họ đưa những người đau yếu đến khi kéo đến.
- source_word: ἀσθενεῖς
  choice: những người bệnh
  rationale: Trong bối cảnh chữa lành, từ này chỉ người đau ốm về thể chất.
- source_word: ὀχλουμένους
  choice: những người bị ... quấy nhiễu
  rationale: Giữ nghĩa bị gây phiền nhiễu hoặc hành hạ nhưng không tự ý nâng mức độ cường liệt của từ.
- source_word: ὑπὸ πνευμάτων ἀκαθάρτων
  choice: bị các tà linh
  rationale: “Tà linh” là cách gọi tự nhiên, quen thuộc trong tiếng Việt đối với các linh thể xấu xa; không giản lược thành hiện tượng tâm lý.
- source_word: οἵτινες
  choice: họ
  rationale: Đại từ nối lại toàn bộ hai nhóm vừa kể; dùng “họ” giúp câu tiếng Việt sáng rõ.
- source_word: ἐθεραπεύοντο
  choice: đều được chữa lành
  rationale: Giữ thể bị động và ý hoạt động chữa lành đang diễn ra hoặc lặp lại trong quá khứ.
- source_word: ἅπαντες
  choice: tất cả ... đều
  rationale: 'Thể hiện rõ tính bao quát: mọi người thuộc các nhóm được đem đến đều được chữa lành.'
theological_decisions:
- issue: Cách dịch πνευμάτων ἀκαθάρτων
  choice: các tà linh
  alternative: các linh ô uế
  rationale: “Tà linh” truyền đạt rõ các linh thể xấu xa có tính cá vị trong ngữ cảnh Lu-ca–Công Vụ; chú thích giữ lại cách dịch sát thành tố ἀκάθαρτος là “linh ô uế”.
- issue: Phạm vi của ἅπαντες
  choice: tất cả họ đều được chữa lành
  alternative: mọi người đều được chữa lành
  rationale: Cho thấy từ này quy chiếu đến cả người bệnh lẫn người bị tà linh quấy nhiễu vừa được nhắc đến, không thêm lời giải thích thần học ngoài câu.
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại, dễ hiểu. “Kéo đến” diễn tả sinh động sự hội tụ liên tục mà không quá khẩu ngữ; dấu chấm phẩy làm rõ mệnh đề kết quả. Mọi dấu chú thích [a], [b] đều được đặt trong chính văn.
