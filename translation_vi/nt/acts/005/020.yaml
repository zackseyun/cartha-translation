source:
  edition: SBLGNT
  text: Πορεύεσθε καὶ σταθέντες λαλεῖτε ἐν τῷ ἱερῷ τῷ λαῷ πάντα τὰ ῥήματα τῆς ζωῆς ταύτης.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/020.yaml
  text: Go and stand in the temple[c][b][a], and speak to the people all the words of this life.
translation:
  language: vi
  text: “Hãy đi, đứng trong khuôn viên đền thờ[a] và nói cho dân chúng mọi lời của sự sống này[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn dùng từ chỉ toàn bộ khu đền thờ, không chỉ riêng nơi thánh bên trong.
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “mọi lời về sự sống này” hoặc “mọi lời về đời sống này.”'
    reason: alternative_reading
lexical_decisions:
- source_word: Πορεύεσθε
  choice: Hãy đi
  rationale: Mệnh lệnh trực tiếp, tự nhiên trong tiếng Việt và giữ rõ hành động mở đầu.
- source_word: σταθέντες
  choice: đứng
  rationale: Phân từ aorist có chức năng chỉ hành động đi kèm; chuyển thành động từ phối hợp giúp câu lệnh tự nhiên mà vẫn giữ chuỗi hành động đi–đứng–nói.
- source_word: λαλεῖτε
  choice: nói
  rationale: Giữ nghĩa rộng của λαλέω, không thêm sắc thái rao giảng vốn không được biểu đạt trực tiếp bởi động từ.
- source_word: ἐν τῷ ἱερῷ
  choice: trong khuôn viên đền thờ
  rationale: ἱερόν chỉ toàn bộ khu đền thờ, không riêng nơi thánh bên trong; cách dịch này tránh gây hiểu lầm trong tiếng Việt.
- source_word: τῷ λαῷ
  choice: cho dân chúng
  rationale: Diễn đạt trực tiếp đối tượng nghe, không thu hẹp thành đám đông hay thêm rõ căn tính dân Israel khi câu Hy Lạp không nói tường minh.
- source_word: πάντα τὰ ῥήματα
  choice: mọi lời
  rationale: Phản ánh cả πάντα và ῥήματα, đồng thời gọn và trang trọng trong tiếng Việt.
- source_word: τῆς ζωῆς ταύτης
  choice: về sự sống này
  rationale: Dùng quan hệ 'về' là cách hiểu khả dĩ, tự nhiên trong tiếng Việt, nhưng vẫn giữ cụm 'sự sống này' và tính hàm súc của nguyên văn.
theological_decisions:
- issue: Ý nghĩa của τῆς ζωῆς ταύτης
  choice: sự sống này
  alternative: đời sống này; lối sống này; những lời đem lại sự sống
  rationale: Nguyên văn có thể chỉ sự sống được công bố trong Tin Mừng, đời sống mới, hoặc sứ điệp gắn với sự sống. Bản dịch không thêm 'mới' hay 'đem lại' để khỏi giải quyết thay cho độc giả tính mở thần học của cụm từ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc mệnh lệnh giữ chuỗi hành động của câu Hy Lạp; dấu ngoặc kép cho thấy đây là lời thiên sứ truyền cho các sứ đồ trong ngữ cảnh.
