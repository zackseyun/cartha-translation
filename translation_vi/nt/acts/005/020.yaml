  rationale: Đổi “về sự sống này” thành “của sự sống này” để phản ánh sát hơn genitive trong nguyên ngữ và không giải quyết trước một quan hệ ngữ nghĩa còn để ngỏ. Chú thích b giữ các cách diễn đạt tự nhiên hơn, có tính diễn giải hơn, như những phương án thay thế.
