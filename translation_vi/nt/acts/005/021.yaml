id: ACT.5.21
reference: Acts 5:21
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀκούσαντες δὲ εἰσῆλθον ὑπὸ τὸν ὄρθρον εἰς τὸ ἱερὸν καὶ ἐδίδασκον. Παραγενόμενος δὲ ὁ ἀρχιερεὺς καὶ οἱ σὺν αὐτῷ συνεκάλεσαν τὸ συνέδριον καὶ πᾶσαν τὴν γερουσίαν τῶν υἱῶν Ἰσραήλ, καὶ ἀπέστειλαν εἰς τὸ δεσμωτήριον ἀχθῆναι αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/021.yaml
  text: When they heard this[a], they entered the temple courts at daybreak and were teaching. But when the high priest arrived, and those with him, they called together the Sanhedrin and the whole council of the sons of Israel, and sent to the prison to have them brought.
translation:
  language: vi
  text: Nghe vậy, họ vào khuôn viên đền thờ lúc rạng đông và giảng dạy tại đó. Khi thầy tế lễ thượng phẩm cùng những người đi với ông đến, họ triệu tập Thượng Hội đồng và toàn thể hội đồng trưởng lão của con cái Israel[a], rồi sai người đến nhà giam để áp giải các sứ đồ đến.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “toàn thể hội đồng trưởng lão của Israel” hoặc “toàn thể giới trưởng lão Israel.”'
    reason: Nêu các cách diễn đạt tự nhiên hơn cho cụm πᾶσαν τὴν γερουσίαν τῶν υἱῶν Ἰσραήλ, đồng thời giữ cách dịch sát hơn trong chính văn.
lexical_decisions:
- source_word: ἀκούσαντες
  choice: Nghe vậy
  rationale: Phân từ bất định chỉ sự việc xảy ra trước hành động chính và liên hệ với mệnh lệnh của thiên sứ ở câu trước; cách diễn đạt này tự nhiên mà vẫn giữ trình tự.
- source_word: ὑπὸ τὸν ὄρθρον
  choice: lúc rạng đông
  rationale: Diễn đạt thời điểm vào những giờ đầu khi trời vừa sáng, sát nghĩa và trang trọng.
- source_word: εἰς τὸ ἱερὸν
  choice: vào khuôn viên đền thờ
  rationale: ἱερόν chỉ toàn bộ khu đền thờ, không riêng nơi thánh bên trong; “khuôn viên đền thờ” truyền đạt rõ sự phân biệt này.
- source_word: ἐδίδασκον
  choice: giảng dạy tại đó
  rationale: Thì chưa hoàn thành diễn tả hành động đang tiếp diễn; “giảng dạy” phù hợp bối cảnh công bố và dạy lời Chúa, còn “tại đó” giúp câu tiếng Việt tự nhiên.
- source_word: Παραγενόμενος
  choice: Khi ... đến
  rationale: Phân từ bất định mở đầu biến cố tiếp theo; cấu trúc thời gian này rõ ràng trong tiếng Việt.
- source_word: οἱ σὺν αὐτῷ
  choice: những người đi với ông
  rationale: Giữ nguyên sự không xác định về thành phần của nhóm, không thêm một chức danh mà bản Hy Lạp không nêu.
- source_word: συνεκάλεσαν
  choice: triệu tập
  rationale: Động từ có nghĩa gọi một cơ quan hoặc một nhóm họp lại; “triệu tập” tự nhiên trong bối cảnh chính thức.
- source_word: τὸ συνέδριον
  choice: Thượng Hội đồng
  rationale: Trong bối cảnh này, từ chỉ cơ quan lãnh đạo Do Thái thường được gọi là Sanhedrin; “Thượng Hội đồng” vừa rõ chức năng vừa phù hợp văn phong Kinh Thánh tiếng Việt.
- source_word: πᾶσαν τὴν γερουσίαν τῶν υἱῶν Ἰσραήλ
  choice: toàn thể hội đồng trưởng lão của con cái Israel
  rationale: γερουσία là tập thể hoặc hội đồng các trưởng lão. Cách dịch này giữ sắc thái cơ cấu trưởng lão và bảo tồn thành ngữ huyết tộc-dân tộc υἱῶν Ἰσραήλ.
- source_word: τὸ δεσμωτήριον
  choice: nhà giam
  rationale: Từ thông dụng chỉ nơi giam giữ; “nhà giam” tự nhiên và chính xác trong tiếng Việt.
- source_word: ἀχθῆναι αὐτούς
  choice: để giải các sứ đồ về
  rationale: Động từ nguyên mẫu bị động diễn tả mục đích sau “sai người”; “giải ... về” thể hiện việc áp giải tù nhân đến trước hội đồng. Danh từ “các sứ đồ” làm rõ đại từ theo ngữ cảnh gần.
theological_decisions:
- issue: Cách dịch τῶν υἱῶν Ἰσραήλ
  choice: của con cái Israel
  alternative: của Israel; của dân Israel
  rationale: Giữ thành ngữ gia tộc-dân tộc trong nguyên văn mà không thu hẹp thành chỉ những người nam theo nghĩa sinh học. Chú thích cung cấp cách nói tự nhiên hơn.
- issue: Quan hệ giữa συνέδριον và γερουσία
  choice: Thượng Hội đồng và toàn thể hội đồng trưởng lão
  alternative: Thượng Hội đồng, tức toàn thể hội đồng trưởng lão
  rationale: Liên từ καί cho phép hiểu đây là hai cách chỉ hoặc hai thành phần có quan hệ gần, nhưng nguyên văn không xác quyết rõ quan hệ đồng vị. Bản dịch giữ “và” để bảo tồn sự mơ hồ ấy.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “thầy tế lễ thượng phẩm” và “Thượng Hội đồng” theo lối gọi quen thuộc; tránh từ Hán-Việt quá chuyên biệt như “nguyên lão viện.”
