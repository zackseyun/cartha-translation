  source_fidelity: 'Bản dịch nhìn chung theo sát văn bản Hy Lạp: diễn tiến thời gian, nghĩa tiếp diễn của ἐδίδασκον, phạm vi của ἱερόν, và sự mơ hồ trong quan hệ giữa συνέδριον với γερουσία đều được giữ tốt. Tuy nhiên, “giải các sứ đồ về” thêm hướng nghĩa “về/trở về” không có trong ἀχθῆναι αὐτούς, vốn chỉ nói họ được dẫn đến (ngữ cảnh ngầm hiểu là đến trước hội đồng).'
