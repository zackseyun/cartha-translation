  text: Then the young men rose[a], wrapped him up, carried him out, and buried him.
translation:
  language: vi
  text: 'Rồi những người trẻ tuổi[a] đứng dậy, quấn thi thể ông lại, khiêng ra ngoài và chôn.


    [a] Cũng có thể dịch là “những người trẻ hơn”. Từ Hy Lạp νεώτεροι có dạng so sánh và có thể chỉ những người trẻ hơn hoặc nói chung là những người trẻ tuổi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “những người trẻ hơn”. Từ Hy Lạp νεώτεροι có dạng so sánh và có thể chỉ những người trẻ hơn hoặc nói chung là những người trẻ tuổi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστάντες
  choice: đứng dậy
  rationale: Phân từ bất định quá khứ của ἀνίστημι diễn tả việc họ đứng lên để hành động; “đứng dậy” tự nhiên và giữ được trình tự của câu chuyện.
- source_word: δὲ
  choice: Rồi
  rationale: δέ ở đây đánh dấu bước tiếp theo trong diễn tiến câu chuyện; “Rồi” tự nhiên trong văn kể tiếng Việt.
- source_word: οἱ νεώτεροι
  choice: những người trẻ tuổi
  rationale: νεώτεροι có dạng so sánh nhưng trong ngữ cảnh có thể chỉ chung những người trẻ tuổi. Cách dịch chính tự nhiên, còn nghĩa “những người trẻ hơn” được giữ trong chú thích.
- source_word: συνέστειλαν
  choice: quấn thi thể ông lại
  rationale: Trong bối cảnh này, συστέλλω chỉ việc thu gọn hoặc quấn thi thể để mang đi chôn. Cách dịch này nêu rõ hành động vật lý mà không diễn giải rộng thành toàn bộ nghi thức mai táng.
- source_word: αὐτὸν
  choice: thi thể ông
  rationale: Đại từ chỉ A-na-nia; dùng “thi thể ông” trong tiếng Việt giúp câu tự nhiên và làm rõ rằng họ đang xử lý thân thể người đã chết.
- source_word: ἐξενέγκαντες
  choice: khiêng ra ngoài
  rationale: Phân từ của ἐκφέρω chỉ việc mang thi thể ra khỏi nơi ấy; “khiêng ra ngoài” phù hợp với ngữ cảnh mai táng.
- source_word: ἔθαψαν
  choice: chôn
  rationale: θάπτω có nghĩa trực tiếp là chôn cất; “chôn” rõ ràng, thông dụng và không quá kiểu cách.
