id: ACT.5.42
reference: Acts 5:42
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: πᾶσάν τε ἡμέραν ἐν τῷ ἱερῷ καὶ κατ’ οἶκον οὐκ ἐπαύοντο διδάσκοντες καὶ εὐαγγελιζόμενοι ⸂τὸν χριστὸν Ἰησοῦν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/042.yaml
  text: And every day[a], in the temple and from house to house, they did not stop teaching and proclaiming the good news that Jesus is the Messiah.
translation:
  language: vi
  text: 'Mỗi ngày, tại đền thờ và từ nhà này sang nhà khác, họ không ngừng dạy dỗ và loan báo tin mừng rằng Đức Giê-su là Đấng Mê-si.[a]


    [a] Cũng có thể dịch sát hơn: “loan báo tin mừng về Đức Giê-su, Đấng Mê-si” hoặc “loan báo Đức Giê-su là Đấng Mê-si.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch sát hơn: “loan báo tin mừng về Đức Giê-su, Đấng Mê-si” hoặc “loan báo Đức Giê-su là Đấng Mê-si.”'
    reason: Ghi nhận sự linh hoạt cú pháp của τὸν χριστὸν Ἰησοῦν sau εὐαγγελιζόμενοι mà không loại bỏ khả năng hiểu đây là cụm tân ngữ hoặc nội dung lời công bố.
lexical_decisions:
- source_word: πᾶσάν τε ἡμέραν
  choice: Mỗi ngày
  rationale: Diễn đạt tự nhiên ý nghĩa thời gian kéo dài và lặp lại thường xuyên; τε nối câu này với diễn tiến trước đó.
- source_word: ἐν τῷ ἱερῷ
  choice: tại đền thờ
  rationale: ἱερόν chỉ toàn bộ khu đền thờ, không riêng nơi thánh; cách dịch này ngắn gọn và tự nhiên trong tiếng Việt.
- source_word: κατ’ οἶκον
  choice: từ nhà này sang nhà khác
  rationale: Giữ sắc thái phân bố của κατά với danh từ số ít, cho thấy hoạt động diễn ra tại nhiều nhà riêng.
- source_word: οὐκ ἐπαύοντο
  choice: họ không ngừng
  rationale: Thể chưa hoàn thành diễn tả hành động liên tục; “không ngừng” vừa trang trọng vừa thông dụng.
- source_word: διδάσκοντες
  choice: dạy dỗ
  rationale: Diễn đạt hoạt động giảng dạy liên tục của các sứ đồ bằng cách nói tự nhiên trong tiếng Việt.
- source_word: εὐαγγελιζόμενοι
  choice: loan báo tin mừng
  rationale: Giữ nghĩa công bố tin tốt lành, tránh thuật ngữ quá chuyên biệt mà vẫn có sắc thái trang trọng.
- source_word: τὸν χριστὸν Ἰησοῦν
  choice: rằng Đức Giê-su là Đấng Mê-si
  rationale: Làm rõ nội dung lời loan báo trong tiếng Việt, đồng thời giữ Χριστός như một tước hiệu chỉ Đấng Mê-si chứ không biến thành tên riêng.
theological_decisions:
- issue: Cách dịch Χριστός
  choice: Đấng Mê-si
  alternative: Đấng Ki-tô; Đấng Được Xức Dầu
  rationale: “Đấng Mê-si” được hiểu rộng rãi như một tước hiệu và tránh nghiêng về truyền thống dùng thuật ngữ riêng của một hệ phái; cách gọi này giữ trọng tâm vào thân phận Mê-si của Đức Giê-su.
- issue: Chức năng cú pháp của τὸν χριστὸν Ἰησοῦν sau εὐαγγελιζόμενοι
  choice: 'Diễn đạt nội dung: “rằng Đức Giê-su là Đấng Mê-si”'
  alternative: 'Cụm tân ngữ: “Đức Giê-su, Đấng Mê-si” hoặc “về Đức Giê-su, Đấng Mê-si”'
  rationale: Cụm đối cách có thể được hiểu là đối tượng hoặc nội dung của sự loan báo. Bản chính dùng cách diễn đạt nội dung tự nhiên trong tiếng Việt, còn chú thích giữ các khả năng cú pháp gần mặt chữ hơn.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “Đức Giê-su” theo lối xưng gọi kính trọng phổ biến và “Đấng Mê-si” như tước hiệu không thiên lệch hệ phái. Nhịp câu giữ hai địa điểm song song và hai hoạt động liên tục của nguyên văn.
