  source_fidelity: Bản dịch truyền đạt chính xác πᾶσάν τε ἡμέραν là tính đều đặn hằng ngày; giữ được hai phạm vi hoạt động song song, “tại đền thờ” và “từ nhà này sang nhà khác”; và diễn tả đúng ý tiếp diễn của οὐκ ἐπαύοντο qua “không ngừng”. “Loan báo tin mừng rằng Đức Giê-su là Đấng Mê-si” là cách chuyển tự nhiên và trung thành với nội dung công bố của τὸν χριστὸν Ἰησοῦν. “Từ nhà này sang nhà khác” bảo toàn tốt sắc thái phân bố của κατ’ οἶκον.
  naturalness: Câu tiếng Việt chuẩn hiện đại, trang trọng và trôi chảy. Cặp động từ “dạy dỗ và loan báo tin mừng” rõ ràng, nhịp câu phù hợp văn cảnh thuật sự. “Đức Giê-su” và “Đấng Mê-si” là cách dùng quen thuộc, dễ hiểu trong đăng ký Kinh Thánh tiếng Việt.
  terminology: “Đấng Mê-si” dịch Χριστός như một tước hiệu, phù hợp quyết định thuật ngữ trong hồ sơ tiếng Anh và không biến tước hiệu này thành tên riêng. Chú thích nêu hợp lý các cách phản ánh gần mặt chữ hơn của cụm đối cách sau εὐαγγελιζόμενοι, mà không khẳng định một phân tích cú pháp không cần thiết.
