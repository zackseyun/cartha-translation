  text: ὡς δὲ ἤκουσαν τοὺς λόγους τούτους ὅ ⸀τε στρατηγὸς τοῦ ἱεροῦ καὶ οἱ ἀρχιερεῖς, διηπόρουν περὶ αὐτῶν τί ἂν γένοιτο τοῦτο.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/024.yaml
  text: When the captain of the temple and the chief priests heard these words[a], they were perplexed about them, wondering what this might come to.
translation:
  language: vi
  text: Khi viên chỉ huy Đền Thờ và các trưởng tế nghe những lời ấy, họ bối rối về những điều đó, không biết chuyện này rồi sẽ đi đến đâu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “không biết chuyện này sẽ thành ra thế nào.” Cách diễn đạt Hy Lạp hỏi về kết quả hoặc hậu quả của sự việc.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ
  choice: Khi
  rationale: Dẫn vào diễn biến kế tiếp bằng một mệnh đề thời gian tự nhiên; liên từ δέ không cần được dịch riêng trong tiếng Việt ở đây.
- source_word: ἤκουσαν
  choice: nghe
  rationale: Diễn đạt nghĩa thông thường của ἀκούω trong lời kể quá khứ; thời điểm đã được thể hiện qua cấu trúc câu.
- source_word: τοὺς λόγους τούτους
  choice: những lời ấy
  rationale: Giữ gần hình thức số nhiều của λόγοι, đồng thời chỉ lời báo cáo vừa được thuật lại.
- source_word: ὅ τε στρατηγὸς τοῦ ἱεροῦ
  choice: viên chỉ huy Đền Thờ
  rationale: στρατηγός chỉ viên chức chỉ huy lực lượng bảo vệ Đền Thờ; cách dịch này rõ chức năng mà không gán một cấp bậc quân sự hiện đại quá cụ thể.
- source_word: οἱ ἀρχιερεῖς
  choice: các trưởng tế
  rationale: Chỉ giới lãnh đạo thuộc hàng tư tế cấp cao, không hàm ý có nhiều người đồng thời giữ chức thượng tế duy nhất.
- source_word: διηπόρουν
  choice: hết sức bối rối
  rationale: Thể hiện mức độ lúng túng, không biết phải hiểu hay ứng phó thế nào; thể chưa hoàn thành mô tả trạng thái đang kéo dài.
- source_word: περὶ αὐτῶν
  choice: về những điều đó
  rationale: Giữ độ mở của đại từ số nhiều, có thể hướng đến những lời vừa nghe hoặc những sự việc được báo cáo trong đó.
- source_word: τί ἂν γένοιτο τοῦτο
  choice: không biết chuyện này rồi sẽ đi đến đâu
  rationale: Diễn đạt tự nhiên sự bất định về kết quả hay diễn biến cuối cùng mà ἄν với thức mong mỏi biểu thị.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. “Đền Thờ” được viết hoa để chỉ Đền Thờ tại Giê-ru-sa-lem; “viên chỉ huy” tránh một cấp hàm hiện đại quá hẹp. Câu giữ nguyên sự mơ hồ của περὶ αὐτῶν thay vì xác định dứt khoát đại từ này chỉ lời báo cáo hay các sự việc được báo cáo.
