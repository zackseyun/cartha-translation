source:
  edition: SBLGNT
  text: καὶ τὰ νῦν λέγω ὑμῖν, ἀπόστητε ἀπὸ τῶν ἀνθρώπων τούτων καὶ ⸀ἄφετε αὐτούς· (ὅτι ἐὰν ᾖ ἐξ ἀνθρώπων ἡ βουλὴ ⸀αὕτη ἢ τὸ ἔργον τοῦτο, καταλυθήσεται,
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/038.yaml
  text: And now I tell you[a], keep away from these men and leave them alone; for if this plan or this work is from men, it will be overthrown[b],
translation:
  language: vi
  text: 'Còn bây giờ, tôi nói với các ông: Hãy tránh xa những người này và để họ yên; vì nếu kế hoạch hay công việc này bắt nguồn từ con người[a], nó sẽ bị phá tan[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “do loài người mà ra” hoặc “đến từ người ta”.
    reason: lexical_alternative
  - marker: b
    text: Hay “nó sẽ bị phá hủy” hoặc “nó sẽ bị tiêu diệt”.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ νῦν
  choice: Còn bây giờ
  rationale: Cụm từ chuyển sang lời khuyên trong tình thế hiện tại; cách diễn đạt này tự nhiên và giữ được lực diễn ngôn.
- source_word: ἀπόστητε
  choice: Hãy tránh xa
  rationale: Mệnh lệnh yêu cầu tách khỏi và không can dự vào những người này; “tránh xa” rõ ràng, tự nhiên trong tiếng Việt.
- source_word: ἄφετε αὐτούς
  choice: để mặc họ
  rationale: Trong ngữ cảnh, câu này kêu gọi đừng tiếp tục can thiệp hoặc hành động chống lại họ.
- source_word: ὅτι
  choice: vì
  rationale: Giới thiệu lý do cho lời khuyên của Ga-ma-li-ên.
- source_word: ἐὰν ᾖ ἐξ ἀνθρώπων
  choice: nếu ... bắt nguồn từ con người
  rationale: ἐξ chỉ nguồn gốc; “con người” mang nghĩa khái quát và làm rõ sự đối lập với nguồn gốc từ Đức Chúa Trời ở câu kế tiếp.
- source_word: ἡ βουλὴ αὕτη
  choice: kế hoạch này
  rationale: βουλή ở đây chỉ kế hoạch, ý định hoặc chủ trương; “kế hoạch” là cách nói hiện đại, dễ hiểu.
- source_word: τὸ ἔργον τοῦτο
  choice: công việc này
  rationale: ἔργον là việc làm hoặc hoạt động đang được tiến hành; “công việc” giữ được nghĩa rộng của từ nguồn.
- source_word: καταλυθήσεται
  choice: nó sẽ bị phá tan
  rationale: Thể tương lai bị động diễn tả việc kế hoạch hoặc công việc bị triệt tiêu, sụp đổ; “bị phá tan” bảo toàn lực bị động và sắc thái mạnh của động từ.
theological_decisions:
- issue: Nguồn gốc được diễn tả bởi ἐξ ἀνθρώπων
  choice: bắt nguồn từ con người
  alternative: do loài người mà ra; đến từ người ta
  rationale: Cách dịch giữ trọng tâm về nguồn gốc và sự đối lập chưa nói hết với “từ Đức Chúa Trời” trong câu sau, đồng thời không giới hạn nghĩa vào riêng nam giới.
- issue: Chủ thể số ít của καταλυθήσεται sau hai danh từ nối bằng ἢ
  choice: nó sẽ bị phá tan
  alternative: sẽ bị phá tan
  rationale: Đại từ số ít phản ánh động từ Hy Lạp số ít và có thể quy chiếu đến bất cứ vế nào đúng trong cấu trúc “kế hoạch hay công việc”, không giải quyết thay sự linh hoạt cú pháp của câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “các ông” phù hợp với lời Ga-ma-li-ên nói trước Hội đồng; “con người” diễn đạt nghĩa khái quát của ἀνθρώπων. Các dấu chú thích [a], [b] đều được đặt ngay trong chính văn.
