  text: ὁ θεὸς τῶν πατέρων ἡμῶν ἤγειρεν Ἰησοῦν, ὃν ὑμεῖς διεχειρίσασθε κρεμάσαντες ἐπὶ ξύλου·
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/030.yaml
  text: The God of our fathers raised up Jesus[b][a], whom you killed by hanging on a tree.
translation:
  language: vi
  text: Đức Chúa Trời của tổ phụ chúng ta đã làm cho Giê-su sống lại[a], là Đấng mà các ông đã giết bằng cách treo Ngài trên cây[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đã dấy Giê-su lên.” Động từ Hy Lạp ở đây có thể chỉ sự sống lại, dù câu này không nói rõ “từ cõi chết.”'
    reason: lexical_alternative
  - marker: b
    text: 'Hay: “trên thập tự giá.” Nguyên văn là “trên cây,” có lẽ gợi lại Phục Truyền Luật Lệ Ký 21:23.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ θεὸς τῶν πατέρων ἡμῶν
  choice: Đức Chúa Trời của tổ phụ chúng ta
  rationale: Giữ công thức Kinh Thánh chỉ Đức Chúa Trời của các tổ phụ Israel; “tổ phụ” tự nhiên và trang trọng hơn cách dịch sát từng chữ “các cha của chúng ta” trong tiếng Việt.
- source_word: ἤγειρεν
  choice: đã khiến ... sống lại
  rationale: Trong ngữ cảnh ngay sau khi nhắc đến việc Chúa Jêsus bị giết, động từ ἐγείρω chủ yếu chỉ hành động làm cho sống lại. Cách dịch này rõ ràng trong tiếng Việt, còn chú thích ghi nhận nguyên văn không có cụm “từ cõi chết”.
- source_word: Ἰησοῦν
  choice: Đức Chúa Jêsus
  rationale: Dùng dạng tên quen thuộc trong văn phong Kinh Thánh tiếng Việt, với kính ngữ phù hợp ngữ vực trang trọng.
- source_word: διεχειρίσασθε
  choice: đã giết
  rationale: Diễn đạt trực tiếp hành động bạo lực dẫn đến cái chết, phù hợp với nghĩa của động từ trong ngữ cảnh.
- source_word: κρεμάσαντες ἐπὶ ξύλου
  choice: bằng cách treo Ngài trên cây gỗ
  rationale: Thể hiện quan hệ phương tiện của phân từ và giữ ξύλον là “cây gỗ” thay vì diễn giải thẳng thành “thập tự giá,” qua đó bảo tồn âm hưởng Phục Truyền Luật Lệ Ký 21:23.
theological_decisions:
- issue: ἤγειρεν có nên được dịch thành ngôn ngữ phục sinh minh nhiên hay giữ nghĩa rộng “dấy lên”
  choice: đã khiến Đức Chúa Jêsus sống lại
  alternative: đã dấy Đức Chúa Jêsus lên
  rationale: Cái chết được nói ngay trong mệnh đề kế tiếp và mạch văn Công Vụ 5 nhấn mạnh sự phục sinh, nên nghĩa phục sinh là tự nhiên nhất; tuy nhiên, chú thích giữ lại sự kiện rằng câu Hy Lạp không nói minh nhiên “từ cõi chết.”
- issue: ξύλου nên được dịch là “thập tự giá” hay giữ hình ảnh cây/gỗ
  choice: trên cây gỗ
  alternative: trên thập tự giá
  rationale: Nguyên văn dùng ξύλον chứ không dùng σταυρός. Giữ “cây gỗ” bảo tồn lựa chọn từ vựng và liên hệ có khả năng với Phục Truyền Luật Lệ Ký 21:23, trong khi chú thích làm rõ đối tượng lịch sử là thập tự giá.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Duy trì thuật ngữ Kinh Thánh quen thuộc “tổ phụ,” đồng thời tránh giải nghĩa ξύλον ngay trong chính văn. Các dấu chú thích [a], [b] đều xuất hiện đúng tại từ ngữ liên quan.
