revisions:
- from: Đức Chúa Trời của tổ phụ chúng ta đã khiến Đức Chúa Jêsus sống lại[a], là Đấng mà các ông đã giết bằng cách treo Ngài trên cây gỗ[b].
  to: Đức Chúa Trời của tổ phụ chúng ta đã làm cho Giê-su sống lại[a], là Đấng mà các ông đã giết bằng cách treo Ngài trên cây[b].
  rationale: Bản sửa bỏ tước hiệu được thêm vào tên riêng Giê-su, cập nhật cách viết tên theo tiếng Việt hiện hành, và thay «cây gỗ» bằng «cây». Những sửa đổi này tăng tính trung thành với Ἰησοῦν và ξύλον mà vẫn giữ nghĩa phục sinh được ngữ cảnh xác định cùng cấu trúc phương tiện «bằng cách treo».
  reviewer_model: gpt-5.6-terra
