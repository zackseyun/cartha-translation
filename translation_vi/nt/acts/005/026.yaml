  text: τότε ἀπελθὼν ὁ στρατηγὸς σὺν τοῖς ὑπηρέταις ⸀ἤγαγεν αὐτούς, οὐ μετὰ βίας, ἐφοβοῦντο γὰρ τὸν λαόν, ⸀μὴ λιθασθῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/026.yaml
  text: Then the captain went with the officers and brought them[a], not with force, for they were afraid of the people, lest they be stoned.
translation:
  language: vi
  text: Bấy giờ, viên chỉ huy[a] đi cùng các nhân viên và dẫn họ đi, không dùng vũ lực, vì sợ bị ném đá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hy Lạp chỉ viên chỉ huy Đền Thờ, viên chức phụ trách việc giữ trật tự tại Đền Thờ.
    reason: lexical_alternative
lexical_decisions:
- source_word: στρατηγὸς
  choice: viên chỉ huy
  rationale: Trong ngữ cảnh Công vụ, từ này chỉ viên chức phụ trách trật tự đền thờ, không phải một tướng lĩnh La Mã. “Viên chỉ huy” tự nhiên và giữ được vai trò lãnh đạo chính thức.
- source_word: ὑπηρέταις
  choice: các thuộc hạ
  rationale: Chỉ những nhân viên cấp dưới đi cùng viên chỉ huy. “Các thuộc hạ” giữ nghĩa rộng của từ Hy Lạp mà không xác định quá mức họ là lính hay cảnh sát.
- source_word: ἤγαγεν αὐτούς
  choice: đưa họ về
  rationale: ἄγω có nghĩa là dẫn hoặc đưa. Trong mạch truyện, họ được áp giải trở về trước Hội đồng; “về” diễn đạt hướng theo ngữ cảnh nhưng không thêm địa điểm cụ thể.
- source_word: οὐ μετὰ βίας
  choice: nhưng không dùng vũ lực
  rationale: Diễn đạt rõ cách họ đưa các sứ đồ đi, không cưỡng ép bằng bạo lực. “Nhưng” làm rõ sự tương phản trong câu tiếng Việt.
- source_word: ἐφοβοῦντο γὰρ τὸν λαόν
  choice: vì họ sợ dân chúng
  rationale: Thì chưa hoàn thành diễn tả nỗi sợ trong tình huống đang diễn ra; “dân chúng” phù hợp với công chúng Do Thái đang hiện diện.
- source_word: μὴ λιθασθῶσιν
  choice: ném đá mình
  rationale: μή với thể giả định sau động từ chỉ sự sợ hãi diễn tả điều họ lo sẽ xảy ra. Cách nói chủ động tự nhiên trong tiếng Việt; “mình” quy chiếu về viên chỉ huy và các thuộc hạ.
- source_word: τότε ἀπελθὼν
  choice: Bấy giờ, ... đi
  rationale: Chuyển phân từ đi kèm thành chuỗi hành động tự nhiên trong văn kể chuyện tiếng Việt.
theological_decisions:
- issue: Chủ thể có nguy cơ bị ném đá
  choice: “mình” quy chiếu đến viên chỉ huy và các thuộc hạ
  alternative: 'Giữ cấu trúc bị động: “kẻo họ bị ném đá”'
  rationale: Hình thái số nhiều của λιθασθῶσιν phù hợp với nhóm viên chỉ huy và các thuộc hạ. Dùng “mình” tránh sự nhập nhằng của đại từ “họ” trong tiếng Việt, nhưng chú thích ghi nhận cấu trúc bị động của nguyên văn.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. “Viên chỉ huy” tránh sắc thái quân đội La Mã; “thuộc hạ” không xác định quá mức chức danh của nhóm đi cùng.
