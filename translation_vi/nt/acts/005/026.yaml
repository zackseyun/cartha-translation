review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp hiểu đúng chủ thể của nỗi sợ: viên chỉ huy và những người đi cùng ông, không phải các sứ đồ. Tuy nhiên, “đưa họ về” thêm hướng ‘về’ không có trong ἤγαγεν và có thể gợi ý đưa về nhà hay về một nơi đã xác định. Cấu trúc chủ động “dân chúng ném đá mình” cũng đổi thể bị động của nguyên văn và kém trang trọng hơn mức cần thiết.'
  naturalness: “Viên chỉ huy cùng các thuộc hạ đi đưa họ về” hơi nặng và “thuộc hạ” dễ gợi quan hệ cá nhân/chủ tớ hơn là nhân sự thừa hành của một viên chức. “Đi cùng các nhân viên, dẫn họ đi” tự nhiên hơn trong văn kể hiện đại. Việc lược chủ ngữ ở mệnh đề cuối (“vì sợ bị ném đá”) vẫn quy chiếu rõ về nhóm viên chỉ huy và nhân viên.
  terminology: “Viên chỉ huy” là lựa chọn chấp nhận được cho στρατηγός, miễn được chú thích đây là viên chức phụ trách trật tự Đền Thờ, không phải tướng La Mã. “Các nhân viên” giữ tính khái quát của ὑπηρέταις tốt hơn “các thuộc hạ” trong tiếng Việt hiện đại.
  issues:
  - severity: medium
    issue: “đưa họ về” thêm sắc thái hướng đến ‘về’
    rationale: ἤγαγεν αὐτούς chỉ nói viên chỉ huy dẫn/đưa họ đi; hướng đến một nơi ‘về’ không được diễn đạt trong câu Hy Lạp.
  - severity: low
    issue: “các thuộc hạ” có sắc thái xã hội không cần thiết
    rationale: ὑπηρέταις trong bối cảnh này là nhân sự thừa hành đi cùng viên chỉ huy; “thuộc hạ” có thể gợi người lệ thuộc cá nhân hơn là viên chức/cán sự.
  - severity: low
    issue: Chú thích hiện có không còn cần thiết nếu giữ thể bị động trong bản dịch
    rationale: Dùng “vì sợ bị ném đá” vừa bảo toàn thể bị động vừa làm rõ nhờ chủ ngữ chung của câu; chú thích nên được dùng cho vai trò đặc thù của στρατηγός.
