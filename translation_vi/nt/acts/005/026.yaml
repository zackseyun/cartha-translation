  rationale: Bản sửa bỏ ý hướng ‘về’ không có trong nguyên văn, dùng cách gọi tự nhiên hơn cho những người thừa hành, và giữ cấu trúc bị động của μὴ λιθασθῶσιν. Chú thích được chuyển sang giải thích chức vụ của στρατηγός theo ngữ cảnh Công vụ.
