source:
  edition: SBLGNT
  text: τοῦτον ὁ θεὸς ἀρχηγὸν καὶ σωτῆρα ὕψωσεν τῇ δεξιᾷ αὐτοῦ, ⸀τοῦ δοῦναι μετάνοιαν τῷ Ἰσραὴλ καὶ ἄφεσιν ἁμαρτιῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/031.yaml
  text: God exalted this one to his right hand as Leader and Savior[a], to give repentance to Israel and forgiveness of sins.
translation:
  language: vi
  text: Đức Chúa Trời đã tôn chính Đấng ấy lên địa vị bên phải Ngài, làm Đấng Lãnh Đạo và Đấng Cứu Rỗi[a], để ban cho Israel sự ăn năn và sự tha thứ tội lỗi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Đức Chúa Trời đã dùng tay phải Ngài mà tôn chính Đấng ấy lên làm Đấng Lãnh Đạo và Đấng Cứu Rỗi.” Cụm từ Hy Lạp có thể chỉ phương tiện, dù trong ngữ cảnh này có lẽ nói đến việc Đấng ấy được tôn lên địa vị danh dự cao nhất bên phải Đức Chúa Trời.'
    reason: alternative_reading
lexical_decisions:
- source_word: τοῦτον
  choice: chính Đấng ấy
  rationale: Đại từ chỉ định có tính nhấn mạnh và quy chiếu trực tiếp về Chúa Giê-su; “chính Đấng ấy” giữ được sắc thái này mà vẫn trang trọng, tự nhiên.
- source_word: ἀρχηγὸν
  choice: Đấng Lãnh Đạo
  rationale: Từ này có thể chỉ người đứng đầu, người dẫn dắt hoặc người khởi xướng. Trong ngữ cảnh được tôn cao và đi đôi với “Đấng Cứu Rỗi”, “Đấng Lãnh Đạo” truyền đạt rõ quyền lãnh đạo mà không thu hẹp nghĩa thành một tước hiệu quân chủ.
- source_word: σωτῆρα
  choice: Đấng Cứu Rỗi
  rationale: Cách dịch quen thuộc và chính xác trong ngữ cảnh nói về Chúa Cứu Thế, bao hàm cả sự giải cứu lẫn ý nghĩa cứu độ.
- source_word: ὕψωσεν
  choice: đã tôn ... lên
  rationale: Diễn tả việc Đức Chúa Trời nâng Chúa Giê-su lên địa vị vinh dự và quyền uy, chứ không chỉ nói đến sự sống lại.
- source_word: τῇ δεξιᾷ αὐτοῦ
  choice: bên phải Ngài
  rationale: Hiểu cụm cách dữ liệu theo nghĩa vị trí/liên hệ, phù hợp với hình ảnh đăng quang và địa vị danh dự cao nhất; khả năng hiểu theo nghĩa phương tiện được giữ trong chú thích.
- source_word: τοῦ δοῦναι
  choice: để ban
  rationale: Nguyên mẫu có mạo từ biểu thị mục đích; “để ban” diễn đạt rõ và tự nhiên quan hệ mục đích.
- source_word: μετάνοιαν
  choice: sự ăn năn
  rationale: Trong ngữ cảnh Công Vụ, từ này không chỉ là đổi ý về mặt trí óc mà là sự thay đổi hướng lòng và quay về với Đức Chúa Trời. “Sự ăn năn” là cách nói rõ, quen thuộc trong tiếng Việt hiện đại.
- source_word: τῷ Ἰσραὴλ
  choice: cho Israel
  rationale: Giữ Israel là bên tiếp nhận điều Đức Chúa Trời ban và bảo toàn cấu trúc của câu Hy Lạp.
- source_word: ἄφεσιν ἁμαρτιῶν
  choice: sự tha tội
  rationale: Cách diễn đạt tự nhiên, súc tích và chính xác cho thành ngữ Tân Ước về việc tội lỗi được tha.
theological_decisions:
- issue: Ý nghĩa của việc Chúa Giê-su được tôn cao bên phải Đức Chúa Trời
  choice: Câu này nói Đức Chúa Trời tôn Chúa Giê-su lên địa vị danh dự và quyền uy bên phải Ngài.
  alternative: 'Cụm từ cũng có thể được hiểu theo nghĩa phương tiện: Đức Chúa Trời dùng quyền năng bên phải Ngài mà tôn Chúa Giê-su lên.'
  rationale: Cú pháp trong ngữ cảnh cùng hình ảnh đăng quang phổ biến trong Tân Ước nghiêng về nghĩa vị trí/liên hệ, nhưng cách dữ liệu trong tiếng Hy Lạp vẫn cho phép nghĩa phương tiện nên cần bảo lưu trong chú thích.
translation_notes:
  register: Văn phong trang trọng nhưng dễ hiểu đối với độc giả Việt Nam hiện đại. Dùng “Đức Chúa Trời” và đại từ tôn kính “Ngài”; viết hoa các danh xưng chỉ Chúa Giê-su. “Israel” theo dạng quốc tế hiện hành. Câu giữ cấu trúc mục đích của nguyên văn và bảo lưu sự mơ hồ thật sự của τῇ δεξιᾷ αὐτοῦ trong chú thích.
