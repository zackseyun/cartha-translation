revisions:
- from: Càng ngày càng có thêm nhiều người tin nơi Chúa được thêm vào, cả nam lẫn nữ[a].
  to: Ngày càng đông người tin Chúa được thêm vào, cả nam lẫn nữ[a].
  rationale: Bản sửa loại bỏ sự lặp ý, đặt “người tin Chúa” làm nhóm người được thêm vào như nguyên văn, diễn đạt πλήθη bằng “ngày càng đông người”, và duy trì sắc thái bị động cùng tác nhân hàm ẩn. Chú thích được điều chỉnh để nêu phương án nghĩa trung động/nội động mà không gọi “gia nhập” là một hình thức bị động.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T08:28:23Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp giữ được các yếu tố chính: sự gia tăng tiếp diễn (μᾶλλον ... προσετίθεντο), đức tin hướng về Chúa (πιστεύοντες τῷ κυρίῳ), số đông, và cả nam lẫn nữ. Tuy nhiên, cụm “có thêm nhiều người ... được thêm vào” lặp ý ‘thêm’ và làm mờ cấu trúc nguyên văn: những người tin Chúa là những người đang được thêm vào.'
  naturalness: Câu hiện tại không tự nhiên vì sự lặp từ và chuỗi bổ ngữ nặng. Đảo thành “Ngày càng đông người tin Chúa được thêm vào” là tiếng Việt hiện đại, rõ ràng, và vẫn giữ sắc thái bị động-tiếp diễn theo ngữ cảnh.
  terminology: “Chúa” phù hợp cho κύριος và không diễn giải quá mức thành “Chúa Giê-su”. “Tin Chúa” là cách nói tự nhiên hơn “tin nơi Chúa” trong văn xuôi Việt hiện đại, đồng thời truyền đạt đúng quan hệ πιστεύω + dative. “Cả nam lẫn nữ” giữ được lực tương liên của τε καί.
  issues:
  - severity: medium
    issue: Lặp ý và cấu trúc chủ-vị chưa rõ trong “Càng ngày càng có thêm nhiều người tin nơi Chúa được thêm vào”.
    rationale: “có thêm” và “được thêm vào” cùng diễn đạt ý προστίθημι, tạo cảm giác thừa và khiến không rõ trọng tâm là sự gia tăng hay hành động được thêm vào. Bản sửa giữ một lần “được thêm vào” để phản ánh thể bị động của προσετίθεντο.
  - severity: low
    issue: “nhiều người” chưa diễn đạt trọn lực của πλήθη.
    rationale: “Ngày càng đông người” diễn đạt tốt hơn số lượng lớn cùng tiến trình gia tăng, mà không dùng lối nói gượng như “những đám đông”.
  revised_text: Ngày càng đông người tin Chúa được thêm vào, cả nam lẫn nữ[a].
