  yaml_path: translation/nt/acts/005/014.yaml
  text: And even more believers in the Lord were being added—multitudes of both men and women[a].
translation:
  language: vi
  text: Ngày càng đông người tin Chúa được thêm vào, cả nam lẫn nữ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “gia nhập”. Động từ Hy Lạp diễn tả sự gia tăng đang tiếp diễn; hình thức bị động có thể hàm ý Đức Chúa Trời là Đấng thêm họ vào.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μᾶλλον δὲ
  choice: Càng ngày càng có thêm
  rationale: Diễn đạt tự nhiên sự tiếp nối và gia tăng liên tục trong ngữ cảnh; δέ mang tính nối tiếp nhẹ, không cần dịch thành một từ riêng.
- source_word: προσετίθεντο
  choice: được thêm vào
  rationale: Giữ thể bị động và khía cạnh tiếp diễn của thì chưa hoàn thành, đồng thời không nói rõ tác nhân mà nguyên văn chỉ hàm ý.
- source_word: πιστεύοντες τῷ κυρίῳ
  choice: người tin nơi Chúa
  rationale: Phân từ được dùng như danh từ để chỉ những người có lòng tin hướng về Chúa; “tin nơi” là cách diễn đạt trang trọng, rõ nghĩa trong tiếng Việt.
- source_word: πλήθη
  choice: nhiều người
  rationale: Trong tiếng Việt, “nhiều người” truyền đạt tự nhiên số lượng đông đảo; tránh cách dịch cứng như “những đám đông” khi danh từ này giải thích quy mô của những người được thêm vào.
- source_word: ἀνδρῶν τε καὶ γυναικῶν
  choice: cả nam lẫn nữ
  rationale: Giữ đầy đủ cấu trúc tương liên τε καί và cách nêu rõ hai giới trong nguyên văn.
theological_decisions:
- issue: Đối tượng của danh xưng τῷ κυρίῳ
  choice: Giữ “Chúa”, trong ngữ cảnh Công Vụ chỉ Chúa Giê-su và diễn tả đức tin hướng về Ngài.
  alternative: Có thể được hiểu rộng hơn là Đức Chúa Trời.
  rationale: Bản dịch giữ nguyên danh xưng thay vì diễn giải thành “Chúa Giê-su”, nhờ đó bảo toàn cách nói và mức độ minh thị của nguyên văn.
- issue: Thể và sắc thái của προσετίθεντο
  choice: 'Dịch theo nghĩa bị động tiếp diễn: “được thêm vào”.'
  alternative: 'Hiểu theo sắc thái trung động/nội động: “gia nhập”.'
  rationale: Cách dịch bị động giữ khả năng hàm ý Đức Chúa Trời là tác nhân nhưng không đưa tác nhân ấy vào câu khi nguyên văn không nói rõ.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Cấu trúc được sắp xếp tự nhiên theo tiếng Việt, đồng thời giữ thể bị động và sự mơ hồ có chủ ý về tác nhân.
