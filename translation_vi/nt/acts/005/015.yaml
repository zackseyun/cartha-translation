    issue: “Vì thế” chưa biểu đạt trực tiếp lực kết quả của ὥστε.
    rationale: ὥστε mở đầu mệnh đề hệ quả, theo sau là các động từ nguyên mẫu. “Đến nỗi người ta...” giữ rõ hơn quan hệ kết quả trong nguyên văn mà vẫn tự nhiên trong tiếng Việt.
  - severity: low
    issue: Cấu trúc “dù chỉ bóng ông cũng có thể...” hơi gượng và không biểu đạt tối ưu κἄν.
    rationale: 'κἄν ở đây nhấn mạnh mức tối thiểu mong đợi: ngay cả bóng của Phi-e-rơ. “Ngay cả bóng của ông cũng có thể phủ lên...” rõ và tự nhiên hơn.'
  - severity: low
    issue: Chú thích c nói “phủ lên họ,” trong khi τινὶ αὐτῶν là số ít bất định.
    rationale: Nên nói “phủ lên một người nào trong số họ” để phù hợp với cách diễn đạt của nguyên văn, dù ý là bất kỳ người nào thuộc nhóm ấy.
