id: ACT.5.15
reference: Acts 5:15
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὥστε ⸂καὶ εἰς⸃ τὰς πλατείας ἐκφέρειν τοὺς ἀσθενεῖς καὶ τιθέναι ἐπὶ ⸀κλιναρίων καὶ κραβάττων, ἵνα ἐρχομένου Πέτρου κἂν ἡ σκιὰ ⸀ἐπισκιάσῃ τινὶ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/015.yaml
  text: so that they even carried the sick out into the streets and laid them on cots and mats[a], so that as Peter was coming by[c][b], even his shadow might overshadow some of them.
translation:
  language: vi
  text: Đến nỗi người ta còn khiêng những người bệnh ra các đường phố[a], đặt họ trên những chiếc giường nhỏ và chiếu[b], để khi Phi-e-rơ đi ngang qua, ngay cả bóng của ông cũng có thể phủ lên một người nào trong số họ[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “ra các quảng trường công cộng”. Từ Hy Lạp πλατείας có thể chỉ những đường phố rộng hoặc những khu vực công cộng thoáng rộng.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “giường và đệm lót”. Tiếng Hy Lạp dùng hai từ khác nhau để chỉ hai loại chỗ nằm hoặc vật dụng trải nằm.
    reason: lexical_alternative
  - marker: c
    text: 'Câu này thuật lại ý định của dân chúng: họ đặt người bệnh ở đó với mong muốn ngay cả bóng của Phi-e-rơ cũng có thể phủ lên một người nào trong số họ. Riêng câu này không nói rõ rằng chính cái bóng đã chữa lành.'
    reason: theological_clarification
lexical_decisions:
- source_word: ὥστε
  choice: Vì thế
  rationale: Diễn tả kết quả phát sinh từ ảnh hưởng ngày càng lớn của các sứ đồ trong văn cảnh trước, đồng thời nối câu tự nhiên trong tiếng Việt.
- source_word: καὶ εἰς τὰς πλατείας
  choice: còn ... ra các đường phố
  rationale: “Còn” thể hiện sắc thái gia tăng của καί; “các đường phố” phù hợp với nơi người qua lại, trong khi chú thích giữ nghĩa khả dĩ là quảng trường hay khu vực công cộng rộng.
- source_word: ἐκφέρειν
  choice: khiêng ... ra
  rationale: Diễn tả việc đưa người bệnh từ bên trong ra nơi công cộng; “khiêng” phù hợp với việc họ phải nằm trên vật dụng chuyên chở hoặc chỗ nằm.
- source_word: τοὺς ἀσθενεῖς
  choice: những người bệnh
  rationale: Trong văn cảnh chữa lành, từ này chỉ người đau yếu về thể chất hơn là sự yếu đuối nói chung.
- source_word: τιθέναι
  choice: đặt họ
  rationale: Cách diễn đạt tự nhiên, không thêm giả định về tư thế hoặc tình trạng cụ thể của từng người bệnh.
- source_word: ἐπὶ κλιναρίων καὶ κραβάττων
  choice: trên những chiếc giường nhỏ và chiếu
  rationale: Giữ sự phân biệt giữa hai loại bề mặt nằm hoặc đồ dùng có thể mang theo, bằng từ ngữ hiện đại và dễ hiểu.
- source_word: ἵνα
  choice: để
  rationale: Giữ rõ ý định hay mục đích của những người sắp đặt người bệnh.
- source_word: ἐρχομένου Πέτρου
  choice: khi Phi-e-rơ đi ngang qua
  rationale: Diễn đạt kết cấu sở hữu cách tuyệt đối và chuyển động đang diễn ra của Phi-e-rơ khi ông đến gần rồi đi qua họ.
- source_word: κἂν
  choice: dù chỉ ... cũng
  rationale: 'Thể hiện hy vọng về mức tiếp xúc tối thiểu: chỉ riêng bóng của Phi-e-rơ phủ lên họ cũng là điều họ mong đợi.'
- source_word: σκιὰ
  choice: bóng
  rationale: Giữ nghĩa đen của từ Hy Lạp, không chuyển thành ẩn dụ.
- source_word: ἐπισκιάσῃ
  choice: có thể phủ lên
  rationale: “Phủ lên” giữ hình ảnh cái bóng bao trùm; “có thể” phản ánh động từ giả định sau ἵνα và tránh trình bày kết quả chữa lành như một sự việc đã được câu này xác nhận.
- source_word: τινὶ αὐτῶν
  choice: một người nào trong số họ
  rationale: Phản ánh đại từ bất định số ít đi với sở hữu cách số nhiều, tức bất kỳ cá nhân nào trong nhóm người bệnh.
theological_decisions:
- issue: Câu này có nên hàm ý rằng chính bóng của Phi-e-rơ có quyền năng chữa lành hay không
  choice: Bản dịch chỉ trình bày mục đích và niềm mong đợi của dân chúng, không khẳng định rằng chính cái bóng đã chữa lành.
  alternative: Dịch theo cách ngụ ý mạnh hơn rằng quyền năng chữa lành vốn nằm trong bóng của Phi-e-rơ.
  rationale: ἵνα đi với động từ giả định mô tả mục đích của việc họ đặt người bệnh ở đó. Chính câu này không nói rõ rằng bóng đã chữa lành, dù văn cảnh rộng hơn thuật lại nhiều phép chữa lành; vì vậy bản dịch giữ nguyên sự dè dặt của lời kể.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng gần gũi. Cấu trúc câu giữ hai quan hệ kết quả và mục đích của nguyên văn, đồng thời tránh lối diễn đạt cổ hoặc hàm ý thần học vượt quá điều câu Hy Lạp nói rõ.
