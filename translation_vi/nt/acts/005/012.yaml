id: ACT.5.12
reference: Acts 5:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Διὰ δὲ τῶν χειρῶν τῶν ἀποστόλων ἐγίνετο σημεῖα καὶ τέρατα ⸂πολλὰ ἐν τῷ λαῷ⸃· καὶ ἦσαν ὁμοθυμαδὸν ⸀ἅπαντες ἐν τῇ Στοᾷ Σολομῶντος·
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/012.yaml
  text: Many signs and wonders were being done among the people through the hands of the apostles[b][a], and they were all together in Solomon’s Portico.
translation:
  language: vi
  text: Nhờ tay các sứ đồ, nhiều dấu lạ và việc kỳ diệu được thực hiện giữa dân chúng; tất cả đều đồng lòng[a] tại hành lang Sa-lô-môn[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “tất cả đều cùng một lòng.” Từ Hy Lạp nhấn mạnh sự hiệp nhất về ý hướng.
    reason: lexical_alternative
  - marker: b
    text: Hay “Dãy cột Sa-lô-môn,” tức một lối đi có mái che và hàng cột.
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὰ ... τῶν χειρῶν τῶν ἀποστόλων
  choice: Qua tay các sứ đồ
  rationale: Giữ hình ảnh cụ thể của thành ngữ Hy Lạp và diễn đạt διά với sở hữu cách như phương tiện hoặc tác nhân; cách nói này vẫn tự nhiên trong tiếng Việt.
- source_word: δὲ
  choice: không dịch thành một từ riêng
  rationale: Ở đây δέ chủ yếu đánh dấu bước tiếp theo của mạch kể, không biểu thị sự tương phản rõ. Trật tự câu và dấu câu tiếng Việt đã chuyển tải sự tiếp nối mà không cần thêm “bấy giờ” hay “nhưng”.
- source_word: ἐγίνετο
  choice: liên tục được thực hiện
  rationale: Thể chưa hoàn thành diễn tả hoạt động tiếp diễn hoặc lặp lại trong quá khứ; dạng bị động phù hợp khi “dấu lạ và việc kỳ diệu” là chủ ngữ.
- source_word: σημεῖα καὶ τέρατα
  choice: dấu lạ và việc kỳ diệu
  rationale: Phân biệt hai danh từ trong cặp từ quen thuộc của Lu-ca, không thêm tính từ giải nghĩa như “siêu nhiên” hay “phép lạ”.
- source_word: πολλὰ
  choice: nhiều
  rationale: Diễn đạt tự nhiên số lượng lớn và bổ nghĩa cho cả hai danh từ đi liền nhau.
- source_word: ἐν τῷ λαῷ
  choice: giữa dân chúng
  rationale: Diễn đạt phạm vi diễn ra sự việc mà không tự ý xác định dân chúng là một nhóm sắc tộc cụ thể.
- source_word: ὁμοθυμαδὸν
  choice: đồng lòng tụ họp
  rationale: “Đồng lòng” giữ sắc thái hiệp nhất về ý hướng, còn “tụ họp” giúp câu tiếng Việt tự nhiên trong ngữ cảnh một địa điểm chung; chú thích nêu cách dịch gọn hơn.
- source_word: ἅπαντες
  choice: tất cả
  rationale: Giữ ý bao quát nhưng không thêm danh từ chỉ rõ nhóm người nào.
- source_word: Στοᾷ Σολομῶντος
  choice: Hành Lang Sa-lô-môn
  rationale: στοά là một lối đi có mái che và hàng cột. “Hành Lang” dễ hiểu trong tiếng Việt hiện đại; chú thích bảo lưu thuật ngữ kiến trúc thay thế.
theological_decisions:
- issue: Đối tượng được nói đến trong “tất cả”
  choice: Giữ chủ thể ngầm, chỉ dịch “tất cả” mà không xác định đó là các sứ đồ hay toàn thể tín hữu.
  alternative: “tất cả các sứ đồ” hoặc “tất cả các tín hữu”
  rationale: Tiếng Hy Lạp không nêu rõ tiền ngữ của ἅπαντες. Việc không bổ sung danh từ bảo toàn tính mơ hồ thật sự của câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu giữ thành ngữ “qua tay,” sắc thái tiếp diễn của động từ, và không xác định chủ thể ngầm của “tất cả.” Tên riêng dùng dạng Việt hóa “Sa-lô-môn.”
