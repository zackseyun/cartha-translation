  text: After bringing them in, they stood them before the council, and the high priest questioned them.
translation:
  language: vi
  text: Sau khi dẫn các sứ đồ vào, họ cho các ông đứng trước Hội đồng[a]. Vị thượng tế hỏi các ông.
  philosophy: optimal-equivalence
  footnotes:
