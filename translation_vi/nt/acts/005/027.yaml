revisions:
- from: Sau khi dẫn các sứ đồ đến, họ cho các ông đứng trước Hội đồng[a]. Thầy tế lễ thượng phẩm chất vấn các ông.
  to: Sau khi dẫn các sứ đồ vào, họ cho các ông đứng trước Hội đồng[a]. Vị thượng tế hỏi các ông.
  rationale: 'Sửa các cách diễn đạt để tiếng Việt hiện đại, tự nhiên và sát lực từ của nguyên ngữ hơn: “vào” thay cho “đến,” “vị thượng tế” thay cho cách gọi nặng nề “Thầy tế lễ thượng phẩm,” và “hỏi” thay cho “chất vấn.” Giữ nguyên quan hệ thời gian, tác động khiến các sứ đồ đứng trình diện, và cách dịch συνέδριον là “Hội đồng.”'
  reviewer_model: gpt-5.6-terra
