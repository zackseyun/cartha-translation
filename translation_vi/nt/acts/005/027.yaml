review_pass:
  verdict: revise
  source_fidelity: Bản dịch phản ánh đúng trình tự của phân từ Ἀγαγόντες và ý ngoại động của ἔστησαν. Việc làm rõ αὐτούς là “các sứ đồ” phù hợp ngữ cảnh trực tiếp. Tuy nhiên, “Thầy tế lễ thượng phẩm” không phải cách gọi hiện đại tự nhiên nhất cho ὁ ἀρχιερεύς; “vị thượng tế” chính xác và gọn hơn. “Chất vấn” có thể mạnh hơn ἐπηρώτησεν, vốn cơ bản là “hỏi.”
  naturalness: “Sau khi dẫn các sứ đồ đến” hơi thiếu điểm đến trong tiếng Việt; “dẫn các sứ đồ vào” tự nhiên hơn và phản ánh ngữ cảnh trình diện. “Vị thượng tế hỏi các ông” trang trọng, hiện đại và tự nhiên hơn câu hiện có.
  terminology: Giữ “Hội đồng” cho συνέδριον là phù hợp; chú thích có thể nêu “Tòa Công luận” như cách gọi thay thế. Dùng “vị thượng tế” cho ἀρχιερεύς là thuật ngữ chuẩn, không thêm diễn giải giáo phái.
  issues:
  - severity: medium
    issue: Cách dịch ὁ ἀρχιερεύς là “Thầy tế lễ thượng phẩm”
    rationale: Cụm này nặng và kém tự nhiên trong tiếng Việt hiện đại. “Vị thượng tế” diễn đạt trực tiếp chức danh số ít xác định của nguyên ngữ.
  - severity: low
    issue: Động từ “chất vấn” cho ἐπηρώτησεν
    rationale: Trong bối cảnh chính thức, từ này có thể chấp nhận, nhưng dễ gợi ý sắc thái truy vấn gay gắt hơn động từ “hỏi” của nguyên ngữ. “Hỏi” vẫn giữ được bối cảnh nhờ chủ ngữ và khung cảnh.
  - severity: low
    issue: Cụm “dẫn các sứ đồ đến”
    rationale: “Đến” thường cần một bổ ngữ địa điểm trong tiếng Việt. “Dẫn ... vào” tự nhiên hơn và phù hợp với hành động đưa họ vào để trình diện.
