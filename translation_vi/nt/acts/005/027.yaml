    text: 'Cũng có thể dịch: “Tòa Công luận.” Từ Hy Lạp συνέδριον chỉ hội đồng lãnh đạo của người Do Thái.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀγαγόντες δὲ αὐτοὺς
  choice: Sau khi dẫn các sứ đồ đến
  rationale: Phân từ bất định Ἀγαγόντες diễn tả hành động xảy ra trước động từ chính. Đại từ αὐτούς được diễn đạt là “các sứ đồ” theo ngữ cảnh gần để câu tiếng Việt rõ ràng; δέ là từ nối nhẹ nên không cần dịch riêng.
- source_word: ἔστησαν
  choice: họ cho các ông đứng trước
  rationale: Động từ ἵστημι ở thể ngoại động mang nghĩa khiến ai đứng hoặc đặt ai vào vị trí; cách dịch này giữ được hình ảnh cụ thể của việc đưa các sứ đồ ra trước cơ quan xét xử.
- source_word: ἐν τῷ συνεδρίῳ
  choice: trước Hội đồng
  rationale: Giới từ ἐν kết hợp với động từ chỉ việc đặt đứng được chuyển thành “trước” cho tự nhiên trong tiếng Việt. συνέδριον chỉ hội đồng lãnh đạo Do Thái; dịch nghĩa trong chính văn thay vì phiên âm tên truyền thống.
- source_word: ἐπηρώτησεν
  choice: chất vấn
  rationale: ἐπερωτάω có nghĩa hỏi hoặc tra hỏi. Trong bối cảnh xét xử chính thức, “chất vấn” thể hiện sắc thái tư pháp mà không nhất thiết hàm ý cưỡng bức.
- source_word: ὁ ἀρχιερεὺς
  choice: Thầy tế lễ thượng phẩm
  rationale: Cách gọi trang trọng, quen thuộc trong tiếng Việt dành cho vị đứng đầu hàng tư tế Do Thái trong ngữ cảnh này.
theological_decisions:
- issue: Cách dịch συνέδριον
  choice: Hội đồng
  alternative: Tòa Công Luận
  rationale: Dịch theo nghĩa từ vựng giúp độc giả hiểu đây là một hội đồng cầm quyền và xét xử của người Do Thái, còn tên gọi truyền thống được giữ trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “các ông” để quy chiếu các sứ đồ một cách tự nhiên; viết hoa “Hội đồng” vì trong ngữ cảnh đây là một cơ quan xác định.
