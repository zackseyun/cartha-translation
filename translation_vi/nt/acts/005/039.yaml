  text: εἰ δὲ ἐκ θεοῦ ἐστιν, οὐ ⸀δυνήσεσθε καταλῦσαι ⸀αὐτούς·) μήποτε καὶ θεομάχοι εὑρεθῆτε. ἐπείσθησαν δὲ αὐτῷ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/039.yaml
  text: But if it is from God[a], you will not be able to overthrow them. You may even be found to be fighting against God.” So they were persuaded by him[c][b],
translation:
  language: vi
  text: Nhưng nếu việc ấy bắt nguồn từ Đức Chúa Trời, các ông sẽ không thể đánh đổ[a] họ[c] được; e rằng các ông lại bị phát hiện là những kẻ chống lại Đức Chúa Trời[b].” Thế là họ bị ông thuyết phục.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “phá hủy” hoặc “làm cho sụp đổ”.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “những kẻ đối địch với Đức Chúa Trời”; sát nghĩa là “những kẻ chiến đấu chống lại Đức Chúa Trời”.
    reason: lexical_alternative
  - marker: c
    text: Đại từ “họ” tự nhiên nhất chỉ các sứ đồ, dù một số người hiểu rộng hơn là phong trào hoặc công việc của họ.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκ θεοῦ
  choice: bắt nguồn từ Đức Chúa Trời
  rationale: ἐκ chỉ nguồn gốc; “bắt nguồn từ” diễn đạt tự nhiên và rõ tiêu chuẩn về nguồn gốc thần thượng trong lập luận của Ga-ma-li-ên.
- source_word: δυνήσεσθε
  choice: sẽ không thể
  rationale: Dạng tương lai của δύναμαι nói đến khả năng trong tương lai; “sẽ không thể” giữ cả thời và ý nghĩa.
- source_word: καταλῦσαι
  choice: đánh đổ
  rationale: Trong ngữ cảnh, động từ nói đến việc làm cho những người hoặc công việc này sụp đổ, thất bại; “đánh đổ” giữ sắc thái đối kháng mà không tuyệt đối hóa thành tiêu diệt.
- source_word: αὐτούς
  choice: họ
  rationale: Đại từ giống đực số nhiều tự nhiên nhất quy chiếu đến các sứ đồ, nên được giữ là đại từ chỉ người.
- source_word: μήποτε
  choice: e rằng
  rationale: μήποτε mở đầu lời cảnh báo về một kết cục đáng ngại; “e rằng” tự nhiên trong tiếng Việt và giữ sắc thái cảnh báo về khả năng.
- source_word: θεομάχοι
  choice: những kẻ chống lại Đức Chúa Trời
  rationale: Từ này theo nghĩa sát là những người chiến đấu chống Đức Chúa Trời; cách dịch này rõ nghĩa, trang trọng và tự nhiên hơn một từ ghép nhân tạo.
- source_word: εὑρεθῆτε
  choice: bị nhận ra là
  rationale: Dạng bị động diễn tả việc bị phát hiện hay chứng tỏ đang ở trong một tình trạng; “bị nhận ra là” bảo toàn sắc thái ấy.
- source_word: ἐπείσθησαν δὲ αὐτῷ
  choice: Thế là họ nghe theo ông
  rationale: Cụm này cho biết hội đồng bị lời Ga-ma-li-ên thuyết phục và chấp nhận lời khuyên của ông; “nghe theo ông” tự nhiên trong tiếng Việt, còn “thế là” thể hiện diễn tiến kết quả của δέ trong văn cảnh.
theological_decisions:
- issue: Đối tượng được nói đến bằng αὐτούς trong lời cảnh báo về điều họ không thể đánh đổ
  choice: Đại từ “họ” quy chiếu trực tiếp nhất đến các sứ đồ đang bị xét xử.
  alternative: Đại từ có thể được hiểu rộng hơn, bao gồm phong trào hoặc công việc của họ được nhắc đến ở câu trước.
  rationale: Hình thái giống đực số nhiều ưu tiên đối tượng là những người, nhưng chú thích vẫn bảo lưu khả năng người đọc hiểu họ như đại diện cho phong trào hoặc công việc ấy, tránh biến lời Ga-ma-li-ên thành một khẳng định thần học rộng hơn chính lời ông.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Các ông” phù hợp với lời Ga-ma-li-ên nói trước các thành viên Hội đồng; “những kẻ chống lại Đức Chúa Trời” giữ sức nặng của θεομάχοι mà không tạo thuật ngữ khó hiểu. Các dấu chú thích được đặt ngay sau từ hoặc cụm từ liên quan.
