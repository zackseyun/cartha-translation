id: ACT.5.25
reference: Acts 5:25
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: παραγενόμενος δέ τις ἀπήγγειλεν αὐτοῖς ὅτι Ἰδοὺ οἱ ἄνδρες οὓς ἔθεσθε ἐν τῇ φυλακῇ εἰσὶν ἐν τῷ ἱερῷ ἑστῶτες καὶ διδάσκοντες τὸν λαόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/025.yaml
  text: But someone came and reported to them[a], “Look, the men whom you put in prison are standing in the temple and teaching the people.”
translation:
  language: vi
  text: 'Nhưng có người đến báo với họ: “Kìa, những người mà các ông đã giam trong tù đang đứng trong khuôn viên đền thờ[a] và dạy dân chúng.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “trong đền thờ”; từ Hy Lạp ἱερόν chỉ toàn bộ khuôn viên đền thờ chứ không riêng nơi thánh bên trong.
    reason: lexical_alternative
lexical_decisions:
- source_word: παραγενόμενος
  choice: đến
  rationale: Phân từ bất định diễn tả người đưa tin đến trước khi báo; “đến” tự nhiên và giữ đúng trình tự câu chuyện.
- source_word: δέ
  choice: Nhưng
  rationale: Đánh dấu một bước chuyển có sắc thái tương phản nhẹ với tình thế trước đó.
- source_word: τις
  choice: có người
  rationale: Giữ chủ thể bất định, không thêm danh tính hay vai trò mà nguyên văn không nêu.
- source_word: ἀπήγγειλεν αὐτοῖς
  choice: báo với họ
  rationale: Diễn tả việc chuyển tin cho các nhà chức trách; đại từ “họ” giữ nguyên cách quy chiếu theo ngữ cảnh.
- source_word: Ἰδοὺ
  choice: Kìa
  rationale: Từ thu hút sự chú ý trước một tin bất ngờ; “Kìa” trang trọng vừa phải và tự nhiên trong lời tường thuật.
- source_word: οἱ ἄνδρες
  choice: những người
  rationale: Trong tiếng Việt, “những người” quy chiếu rõ đến các sứ đồ mà không cần nhấn mạnh giới tính vốn không quan trọng ở đây.
- source_word: οὓς ἔθεσθε ἐν τῇ φυλακῇ
  choice: mà các ông đã giam trong tù
  rationale: τίθημι kết hợp với nơi giam giữ mang nghĩa đặt/giam vào tù; “giam trong tù” là cách nói tự nhiên, còn “các ông” phù hợp với lời nói hướng đến nhóm chức trách.
- source_word: ἐν τῷ ἱερῷ
  choice: trong khuôn viên đền thờ
  rationale: ἱερόν chỉ toàn bộ quần thể đền thờ, không riêng nơi thánh bên trong; cách dịch này thể hiện trực tiếp sự phân biệt về không gian.
- source_word: ἑστῶτες καὶ διδάσκοντες τὸν λαόν
  choice: đang đứng ... và dạy dân chúng
  rationale: Hai phân từ hiện tại mô tả các hành động đang diễn ra; giữ cả tư thế “đứng” lẫn hoạt động giảng dạy.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “các ông” trong lời báo để thể hiện số nhiều và quan hệ giao tiếp với nhóm chức trách, không thêm tước vị. Dấu chú thích [a] được đặt ngay sau cụm từ liên quan.
