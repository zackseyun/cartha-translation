revisions:
- from: Nhưng trong Hội đồng[a], một người Pha-ri-si tên là Ga-ma-li-ên đứng lên. Ông là một thầy dạy Luật pháp, được toàn dân kính trọng. Ông truyền đưa các sứ đồ ra ngoài một lát.[b]
  to: Nhưng có một người Pha-ri-si tên là Ga-ma-li-ên đứng lên trong Hội đồng[a]. Ông là một thầy dạy Luật pháp, được toàn dân kính trọng. Ông ra lệnh đưa những người đàn ông ấy ra ngoài một lát.[b]
  rationale: Bản sửa giữ sát cấu trúc và nội dung Hy Lạp, loại bỏ sự bổ sung «các sứ đồ» trong thân văn, và thay cách diễn đạt mệnh lệnh bằng tiếng Việt hiện đại, tự nhiên. «Những người đàn ông ấy» giữ được tham chiếu theo ngữ cảnh cùng sắc thái giống đực của τοὺς ἀνθρώπους mà không thêm một danh xưng không có trong câu.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T08:28:32Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản thảo phản ánh đúng các yếu tố chính: Ga-ma-li-ên là người Pha-ri-si, thầy dạy Luật pháp được toàn dân kính trọng, và ra lệnh cho những người bị đưa ra ngoài tạm thời. Tuy nhiên, «các sứ đồ» thay cho τοὺς ἀνθρώπους là một sự cụ thể hóa theo ngữ cảnh mà nguyên văn câu này không nêu; nên giữ cách gọi tổng quát nhưng vẫn phản ánh đối tượng nam trong ngữ cảnh.'
  naturalness: Câu «Ông truyền đưa các sứ đồ ra ngoài một lát» không tự nhiên trong tiếng Việt hiện đại; «ra lệnh đưa ... ra ngoài một lát» rõ và phù hợp hơn. Việc nối lại câu đầu cũng giúp phản ánh quan hệ cú pháp của nguyên văn mà vẫn tự nhiên.
  terminology: «Pha-ri-si», «Ga-ma-li-ên», «Luật pháp» và «Hội đồng» phù hợp văn phong Kinh Thánh tiếng Việt. Chú thích về Hội đồng nên gọi rõ đây là Hội đồng Do Thái và nêu tên Sanhedrin. Chú thích thành ngữ cần tránh dùng «các ông ấy», vì đó không phải là cách diễn đạt sát mặt chữ của nguyên văn.
  issues:
  - severity: medium
    issue: «các sứ đồ» cụ thể hóa τοὺς ἀνθρώπους.
    rationale: Dù ngữ cảnh xác định họ là các sứ đồ, câu Hy Lạp dùng «những người đàn ông/người ấy», không dùng danh xưng «sứ đồ». Bản dịch tối ưu-tương-đương nên không thêm danh xưng này vào thân văn.
  - severity: medium
    issue: Cụm «truyền đưa» không tự nhiên.
    rationale: Động từ ἐκέλευσεν biểu thị mệnh lệnh có thẩm quyền; tiếng Việt tự nhiên là «ra lệnh đưa ... ra ngoài».
  - severity: low
    issue: Chú thích b dùng «các ông ấy» trong phần được gọi là nghĩa đen.
    rationale: Nguyên văn nói «những người đàn ông» (τοὺς ἀνθρώπους), không có đại từ sở hữu hay cách xưng hô «các ông ấy». Nên diễn đạt chú thích sát hơn và tự nhiên hơn.
  revised_text: Nhưng có một người Pha-ri-si tên là Ga-ma-li-ên đứng lên trong Hội đồng[a]. Ông là một thầy dạy Luật pháp, được toàn dân kính trọng. Ông ra lệnh đưa những người đàn ông ấy ra ngoài một lát.[b]
