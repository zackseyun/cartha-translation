id: ACT.5.34
reference: Acts 5:34
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀναστὰς δέ τις ἐν τῷ συνεδρίῳ Φαρισαῖος ὀνόματι Γαμαλιήλ, νομοδιδάσκαλος τίμιος παντὶ τῷ λαῷ, ἐκέλευσεν ἔξω ⸀βραχὺ τοὺς ⸀ἀνθρώπους ποιῆσαι,
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/034.yaml
  text: But a Pharisee named Gamaliel stood up in the council[a], a teacher of the law honored by all the people[b], and ordered the men to be put outside for a short time.
translation:
  language: vi
  text: Nhưng có một người Pha-ri-si tên là Ga-ma-li-ên đứng lên trong Hội đồng[a]. Ông là một thầy dạy Luật pháp, được toàn dân kính trọng. Ông ra lệnh đưa những người đàn ông ấy ra ngoài một lát.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Hội đồng” là hội đồng lãnh đạo của người Do Thái, còn gọi là Sanhedrin.
    reason: cultural_note
  - marker: b
    text: 'Nguyên văn Hy Lạp nói theo nghĩa đen: “làm cho những người đàn ông ở bên ngoài một lát,” một thành ngữ có nghĩa là cho họ tạm thời ra ngoài.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστὰς
  choice: đứng lên
  rationale: Diễn đạt tự nhiên hành động công khai của Ga-ma-li-ên giữa phiên họp.
- source_word: δὲ
  choice: Nhưng
  rationale: Đánh dấu bước chuyển có sắc thái tương phản nhẹ với diễn biến trước đó.
- source_word: τις ... Φαρισαῖος
  choice: một người Pha-ri-si
  rationale: Giữ tính bất định của τις và dùng tên gọi quen thuộc trong tiếng Việt cho nhóm Φαρισαῖοι.
- source_word: ἐν τῷ συνεδρίῳ
  choice: trong Hội đồng
  rationale: Dịch trực tiếp cơ quan đang họp; chú thích xác định đây là Hội đồng lãnh đạo Do Thái, tức Sanhedrin.
- source_word: ὀνόματι Γαμαλιήλ
  choice: tên là Ga-ma-li-ên
  rationale: Cách giới thiệu tên tự nhiên trong tiếng Việt hiện đại.
- source_word: νομοδιδάσκαλος
  choice: một thầy dạy Luật pháp
  rationale: Phản ánh nghĩa người giảng dạy Luật Môi-se mà không biến thành thuật ngữ chuyên môn khó hiểu.
- source_word: τίμιος παντὶ τῷ λαῷ
  choice: được toàn dân kính trọng
  rationale: Diễn đạt sự quý trọng và uy tín xã hội; không tự ý thêm 'Y-sơ-ra-ên' ngoài nguyên văn.
- source_word: ἐκέλευσεν
  choice: truyền
  rationale: Thể hiện mệnh lệnh có thẩm quyền trong bối cảnh xét xử, đồng thời hợp văn phong trang trọng.
- source_word: τοὺς ἀνθρώπους
  choice: các sứ đồ
  rationale: Ngữ cảnh xác định những người bị đưa ra ngoài là các sứ đồ nam đang đứng trước Hội đồng; dùng danh xưng theo ngữ cảnh giúp tránh 'những người' mơ hồ.
- source_word: ἔξω βραχὺ ... ποιῆσαι
  choice: đưa ... ra ngoài một lát
  rationale: Diễn đạt tự nhiên thành ngữ Hy Lạp theo nghĩa cho người ta tạm thời rời khỏi phòng.
theological_decisions:
- issue: Đối tượng của τοὺς ἀνθρώπους
  choice: các sứ đồ
  alternative: những người đàn ông
  rationale: Danh từ chỉ nam giới, nhưng trong ngữ cảnh nó hồi chỉ rõ các sứ đồ bị xét hỏi; dịch theo đối tượng giúp tiếng Việt rõ ràng mà không làm thay đổi thành phần của nhóm.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Tách câu dài của tiếng Hy Lạp thành ba câu để làm rõ nhân vật, uy tín và mệnh lệnh. Viết hoa “Luật pháp” vì tại đây chỉ Luật Môi-se; “Hội đồng” được viết hoa như tên gọi ngắn của cơ quan cụ thể.
