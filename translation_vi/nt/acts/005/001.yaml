  text: Ἀνὴρ δέ τις Ἁνανίας ὀνόματι σὺν Σαπφίρῃ τῇ γυναικὶ αὐτοῦ ἐπώλησεν κτῆμα
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/001.yaml
  text: But a man named Ananias[a], with Sapphira his wife, sold a piece of property.
translation:
  language: vi
  text: Nhưng có một người tên là A-na-nia, cùng với vợ là Sa-phi-ra, đã bán một tài sản[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “một bất động sản” hoặc “một vật sở hữu”; từ Hy Lạp này có thể chỉ nói chung một tài sản hay cụ thể một phần bất động sản.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀνὴρ δέ τις
  choice: Nhưng có một người
  rationale: Cách diễn đạt này vừa tự nhiên trong tiếng Việt, vừa thể hiện τις như một yếu tố bất định và giữ sắc thái tương phản nhẹ của δέ với câu chuyện về Ba-na-ba ngay trước đó.
- source_word: Ἁνανίας ὀνόματι
  choice: tên là A-na-nia
  rationale: ὀνόματι được chuyển tự nhiên là “tên là”; tên riêng được phiên âm theo lối quen dùng trong Kinh Thánh tiếng Việt.
- source_word: σὺν Σαπφίρῃ τῇ γυναικὶ αὐτοῦ
  choice: cùng với vợ là Sa-phi-ra
  rationale: σύν diễn tả sự cùng tham gia; γυνή trong cấu trúc sở hữu này rõ ràng có nghĩa là “vợ”. Cách đặt tên sau “vợ là” tránh khả năng hiểu lầm Sa-phi-ra là một người khác.
- source_word: ἐπώλησεν
  choice: đã bán
  rationale: Động từ aorist kể một hành động đã xảy ra; “đã bán” là cách kể chuyện rõ ràng, tự nhiên trong tiếng Việt.
- source_word: κτῆμα
  choice: một tài sản
  rationale: κτῆμα có thể chỉ một vật sở hữu, tài sản hoặc bất động sản. “Một tài sản” giữ được phạm vi nghĩa rộng, không tự ý xác định đó là ruộng đất.
theological_decisions:
- issue: Sự tương phản với gương Ba-na-ba ở đoạn trước
  choice: Dịch δέ là “Nhưng”
  alternative: Có thể dịch nhẹ hơn là “Bấy giờ” hoặc nối tiếp bằng “Và”
  rationale: Ngữ cảnh đặt hành động của A-na-nia và Sa-phi-ra đối lập với hành động của Ba-na-ba. “Nhưng” thể hiện chức năng diễn ngôn của δέ mà không thêm một phán xét thần học ngoài văn bản.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “A-na-nia” và “Sa-phi-ra” theo lối phiên âm Kinh Thánh quen thuộc trong tiếng Việt. Dấu chú thích [a] được đặt ngay sau “tài sản”, là từ mà chú thích giải nghĩa.
