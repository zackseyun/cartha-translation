base_translation:
  language: en
  yaml_path: translation/nt/acts/005/023.yaml
  text: saying[a], “We found the prison securely locked, and the guards standing at the doors; but when we opened it, we found no one inside.”
translation:
  language: vi
  text: 'họ nói: “Chúng tôi thấy nhà giam được khóa cẩn mật[a], và lính canh đứng tại các cửa; nhưng khi mở ra, chúng tôi không thấy một ai ở bên trong.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “được khóa rất kỹ” hoặc “được đóng kín trong mọi sự cẩn mật.” Cụm Hy Lạp nhấn mạnh rằng nhà giam được thấy trong tình trạng được bảo vệ cẩn mật.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντες ὅτι
  choice: 'họ nói:'
  rationale: Phân từ này nối với những người thi hành công vụ ở câu trước và giới thiệu lời báo cáo trực tiếp; cách diễn đạt này tự nhiên trong tiếng Việt mà vẫn giữ quan hệ cú pháp với văn cảnh.
- source_word: δεσμωτήριον
  choice: nhà giam
  rationale: Chỉ nơi giam giữ; “nhà giam” là cách gọi rõ ràng, tự nhiên và phù hợp với văn cảnh.
- source_word: κεκλεισμένον ἐν πάσῃ ἀσφαλείᾳ
  choice: được khóa hết sức chắc chắn
  rationale: Phân từ hoàn thành bị động diễn tả tình trạng vẫn đang bị đóng hoặc khóa, còn cụm ἐν πάσῃ ἀσφαλείᾳ nhấn mạnh mức độ an toàn, chắc chắn.
- source_word: τοὺς φύλακας ἑστῶτας
  choice: lính canh đứng
  rationale: φύλακες là những người canh giữ tù nhân; ἑστῶτας khắc họa họ đang đứng nguyên tại vị trí, nên không thêm ý diễn giải quá mức như “được bố trí”.
- source_word: ἐπὶ τῶν θυρῶν
  choice: tại các cửa
  rationale: ἐπί với sở hữu cách ở đây chỉ vị trí gần hoặc ngay chỗ các cửa; “tại các cửa” giữ được hình ảnh và số nhiều của nguyên văn.
- source_word: ἀνοίξαντες
  choice: khi mở ra
  rationale: Phân từ bất định quá khứ được diễn đạt theo quan hệ thời gian. Nguyên văn không nêu rõ tân ngữ, nên “mở ra” giữ được sự hàm ẩn ấy thay vì quyết định đó là cửa hay nhà giam.
- source_word: ἔσω οὐδένα
  choice: không thấy một ai ở bên trong
  rationale: ἔσω chỉ phía bên trong, còn οὐδένα nhấn mạnh hoàn toàn không có người nào; trật tự tiếng Việt này rõ ràng và tự nhiên.
theological_decisions: []
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “nhà giam” và “lính canh” theo cách gọi thông dụng; giữ hình ảnh các lính canh đứng tại nhiều cửa và không xác định tân ngữ của động từ “mở” vì nguyên văn cũng để hàm ẩn.
