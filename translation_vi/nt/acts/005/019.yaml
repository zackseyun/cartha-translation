source:
  edition: SBLGNT
  text: ἄγγελος δὲ κυρίου ⸀διὰ νυκτὸς ⸀ἤνοιξε τὰς θύρας τῆς φυλακῆς ἐξαγαγών τε αὐτοὺς εἶπεν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/019.yaml
  text: But an angel of the Lord opened the doors of the prison during the night, brought them out, and said,
translation:
  language: vi
  text: 'Nhưng trong đêm, một thiên sứ của Chúa mở các cửa nhà tù, đưa họ ra và nói:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄγγελος
  choice: một thiên sứ
  rationale: Danh từ không có mạo từ; trong ngữ cảnh này, hành động giải thoát khỏi nhà tù cho thấy đây là một hữu thể thiên giới. “Một thiên sứ” tự nhiên trong tiếng Việt và không thêm tính xác định.
- source_word: κυρίου
  choice: của Chúa
  rationale: Giữ cách gọi κύριος là “Chúa” và bảo tồn thành ngữ Kinh Thánh quen thuộc “thiên sứ của Chúa”.
- source_word: διὰ νυκτός
  choice: trong đêm
  rationale: Cụm διά với sở hữu cách mang nghĩa thời gian; “trong đêm” ngắn gọn, tự nhiên và diễn đạt hành động xảy ra vào khoảng thời gian ban đêm.
- source_word: ἤνοιξε
  choice: mở
  rationale: Dịch trực tiếp động từ ἀνοίγω; không dùng “mở khóa” vì nguyên văn không nói rõ về ổ khóa.
- source_word: τὰς θύρας τῆς φυλακῆς
  choice: các cửa nhà tù
  rationale: Giữ số nhiều của θύρας và nghĩa cụ thể của φυλακή trong ngữ cảnh là nhà tù.
- source_word: ἐξαγαγών
  choice: đưa họ ra
  rationale: Diễn đạt tự nhiên ý khiến họ đi ra, nhưng không thêm sắc thái dẫn đường mà nguyên văn không bắt buộc.
- source_word: τε
  choice: và
  rationale: Liên kết nhẹ hành động đưa họ ra với động từ chính “nói”; “và” là cách thể hiện tự nhiên trong tiếng Việt.
- source_word: εἶπεν
  choice: nói
  rationale: Cách dịch thông thường của λέγω trong lời thuật; dấu hai chấm cho thấy nội dung lời nói tiếp tục ở câu sau.
theological_decisions:
- issue: Bản chất của ἄγγελος trong ngữ cảnh
  choice: thiên sứ
  alternative: sứ giả loài người
  rationale: Việc cửa nhà tù được mở và các sứ đồ được đưa ra trong đêm cho thấy tác nhân thiên giới; “thiên sứ” phân biệt rõ với một người đưa tin.
- issue: Cách dịch κύριος
  choice: Chúa
  alternative: Chủ
  rationale: “Thiên sứ của Chúa” vừa trung thành với cụm Hy Lạp vừa là cách diễn đạt Kinh Thánh tự nhiên, trang trọng trong tiếng Việt.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Trật tự “trong đêm” được đặt sớm để câu tiếng Việt trôi chảy; các động từ “mở, đưa, nói” giữ nhịp kể chuyện gọn và liên tục. Không cần chú thích vì không có phương án dị bản hay nét mơ hồ nào cần hiển thị trong câu này.
