  text: καὶ ἐνοσφίσατο ἀπὸ τῆς τιμῆς, συνειδυίης καὶ τῆς ⸀γυναικός, καὶ ἐνέγκας μέρος τι παρὰ τοὺς πόδας τῶν ἀποστόλων ἔθηκεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/002.yaml
  text: And he kept back some of the price[a], with his wife also knowing it, and bringing a certain part[b], he laid it at the apostles’ feet.
translation:
  language: vi
  text: Ông đã kín đáo giữ lại một phần tiền bán tài sản[a], vợ ông cũng biết việc ấy; rồi ông đem một phần đến và đặt bên chân các sứ đồ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “chiếm giữ cho mình một phần tiền bán”; động từ Hy Lạp hàm ý cố tình giữ lại một cách không ngay thẳng.'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “bên chân các sứ đồ”; đây là hình ảnh cụ thể về việc đem tiền đặt trước mặt họ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνοσφίσατο
  choice: kín đáo giữ lại một phần
  rationale: Động từ mang nghĩa giữ lại cho mình hoặc chiếm giữ một cách không ngay thẳng. Cách dịch này thể hiện tính che giấu và sai trái nhưng không áp đặt thuật ngữ pháp lý như “biển thủ”.
- source_word: ἀπὸ τῆς τιμῆς
  choice: tiền bán tài sản
  rationale: Trong ngữ cảnh, τιμή là khoản tiền thu được từ việc bán tài sản. Cách diễn đạt này tự nhiên và rõ hơn “từ giá”, đồng thời không biến nó thành một khái niệm kỹ thuật.
- source_word: συνειδυίης καὶ τῆς γυναικός
  choice: vợ ông cũng biết việc ấy
  rationale: Thể sở hữu cách tuyệt đối diễn tả hoàn cảnh đi kèm; καί được giữ bằng “cũng”. Câu dịch không nói thêm rằng người vợ đồng lõa, dù ngữ cảnh cho thấy bà biết sự việc.
- source_word: ἐνέγκας μέρος τι
  choice: rồi ông đem một phần đến
  rationale: Phân từ bất định chỉ hành động xảy ra trước động từ chính. “Rồi” thể hiện trình tự tự nhiên trong tiếng Việt, còn μέρος τι được dịch gọn là “một phần”.
- source_word: παρὰ τοὺς πόδας τῶν ἀποστόλων ἔθηκεν
  choice: đặt dưới chân các sứ đồ
  rationale: Giữ nguyên hình ảnh cụ thể và mô-típ thuật chuyện trong Công Vụ, thay vì diễn giải thành “trao cho các sứ đồ”.
theological_decisions:
- issue: Sắc thái đạo đức trong hành động của A-na-nia
  choice: Diễn đạt là kín đáo giữ lại một phần, thể hiện hành vi che giấu không ngay thẳng.
  alternative: Chỉ nói trung tính rằng ông giữ lại một phần tiền.
  rationale: νοσφίζομαι và mạch văn cho thấy đây không đơn thuần là giữ lại phần thuộc quyền mình, nhưng cũng không cần thêm bình luận giáo lý hoặc gọi hành vi này bằng một tội danh pháp lý cụ thể.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “sứ đồ” để phản ánh ἀπόστολοι theo cách gọi quen thuộc trong tiếng Việt Cơ Đốc; giữ hình ảnh “dưới chân” của nguyên văn. Dấu chấm phẩy giúp phân biệt hoàn cảnh người vợ biết sự việc với chuỗi hành động tiếp theo.
