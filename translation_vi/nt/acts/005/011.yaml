  to: Cả hội thánh và tất cả những người nghe những việc ấy đều hết sức sợ hãi.[a]
  rationale: Bản sửa giữ cách diễn đạt tự nhiên bằng vị ngữ tiếng Việt, đồng thời loại bỏ sắc thái bổ sung trong “nghe biết.” “Cả,” “tất cả,” và “hết sức sợ hãi” duy trì phạm vi toàn thể và cường độ của câu Hy Lạp. Chú thích được điều chỉnh để phản ánh các lựa chọn từ vựng gần với ἐκκλησία hơn.
