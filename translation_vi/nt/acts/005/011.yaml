  text: καὶ ἐγένετο φόβος μέγας ἐφ’ ὅλην τὴν ἐκκλησίαν καὶ ἐπὶ πάντας τοὺς ἀκούοντας ταῦτα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/011.yaml
  text: And great fear came upon the whole church and upon all who heard these things[a].
translation:
  language: vi
  text: Cả hội thánh và tất cả những người nghe những việc ấy đều hết sức sợ hãi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Hội thánh” cũng có thể dịch là “hội chúng” hoặc “cộng đoàn” (ἐκκλησία).
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο φόβος μέγας ἐπί
  choice: đều vô cùng sợ hãi
  rationale: Cụm này diễn tả nỗi sợ lớn bao trùm các đối tượng được nêu. Cách diễn đạt bằng vị ngữ tự nhiên trong tiếng Việt giữ được tính mạnh mẽ của φόβος μέγας mà tránh lối dịch cứng như “một nỗi sợ lớn đã xảy đến trên”.
- source_word: ἐφ’ ὅλην τὴν ἐκκλησίαν
  choice: cả hội thánh
  rationale: “Cả” bảo toàn ý bao quát của ὅλην; “hội thánh” là cách gọi quen thuộc trong tiếng Việt đối với cộng đồng tín hữu ở đây, nhưng chú thích vẫn ghi nhận nghĩa từ vựng rộng hơn của ἐκκλησία.
- source_word: πάντας τοὺς ἀκούοντας ταῦτα
  choice: tất cả những người nghe biết các việc ấy
  rationale: “Tất cả” giữ tính toàn thể của πάντας; “nghe biết” truyền đạt tự nhiên ý nghe tin về những biến cố vừa kể, còn “các việc ấy” giữ số nhiều của ταῦτα.
theological_decisions:
- issue: Cách dịch ἐκκλησία
  choice: hội thánh
  alternative: hội chúng; cộng đồng
  rationale: Trong Công Vụ, từ này chỉ cộng đồng những người tin Chúa. “Hội thánh” nhận diện đúng đối tượng trong văn cảnh mà không định nghĩa thêm cơ cấu hay giáo thuyết về hội thánh; chú thích bảo tồn các khả năng từ vựng khác.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Cấu trúc được chuyển thành vị ngữ “đều vô cùng sợ hãi” để tự nhiên hơn, đồng thời vẫn giữ mức độ mạnh, phạm vi toàn thể và hai nhóm chịu tác động trong câu Hy Lạp.
