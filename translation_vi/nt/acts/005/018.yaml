review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng ý bắt giữ và giam giữ. Tuy nhiên, “giam vào” lược mất bổ ngữ người bị giam, khiến câu kém trọn vẹn; chú thích lại nêu “giam giữ công khai,” dễ chuyển δημοσίᾳ thành trạng từ chỉ cách thức, trong khi từ này bổ nghĩa cho τηρήσει và chỉ sự giam giữ/nơi giam giữ công cộng hoặc chính thức.
  naturalness: “Họ bắt các sứ đồ và giam họ vào nơi giam giữ công cộng” là cách diễn đạt hiện đại, rõ ràng và tự nhiên hơn, đồng thời không buộc τηρήσις phải là một tòa nhà nhà giam cụ thể.
  terminology: “Các sứ đồ” là thuật ngữ phù hợp và nhất quán với cách dùng chức danh trong Công Vụ. “Nơi giam giữ công cộng” giữ được sắc thái δημοσίᾳ mà không diễn giải quá mức thành “giam giữ công khai” hay xác định hẳn là một nhà tù.
  issues:
  - severity: medium
    issue: Cụm “giam vào” thiếu bổ ngữ chỉ người bị giam.
    rationale: Trong tiếng Việt hiện đại, thêm “họ” sau động từ thứ hai làm rõ cấu trúc và phản ánh αὐτούς (“họ”) trong nguyên văn.
  - severity: medium
    issue: Chú thích đề xuất “giam giữ công khai.”
    rationale: Cách này có thể khiến người đọc hiểu việc giam giữ diễn ra công khai. Δημοσίᾳ ở đây bổ nghĩa cho τηρήσει, chỉ sự/nơi giam giữ công cộng, chính thức; không phải trạng từ chỉ cách thức hành động.
  revised_text: Họ bắt các sứ đồ và giam họ vào nơi giam giữ công cộng.[a]
