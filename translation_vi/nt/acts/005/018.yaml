- from: Họ bắt các sứ đồ và giam vào nhà giam công cộng.[a]
  to: Họ bắt các sứ đồ và giam họ vào nơi giam giữ công cộng.[a]
  rationale: Bản sửa giữ lực bắt giữ của ἐπέβαλον τὰς χεῖρας ἐπὶ, giữ danh xưng “các sứ đồ,” và phản ánh ἔθεντο αὐτοὺς ἐν τηρήσει δημοσίᾳ bằng một cấu trúc tiếng Việt đầy đủ. Chú thích được chỉnh để bảo toàn tính mơ hồ giữa tình trạng giam giữ và nơi giam giữ, đồng thời tránh hiểu δημοσίᾳ là “công khai.”
