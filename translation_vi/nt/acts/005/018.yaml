translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “sứ đồ” là thuật ngữ Kinh Thánh quen thuộc; dùng “bắt” thay cho lối dịch sát chữ “đặt tay trên” để tránh gợi nhầm đến nghi thức đặt tay. Dấu chú thích [a] xuất hiện ngay sau mệnh đề liên quan.
