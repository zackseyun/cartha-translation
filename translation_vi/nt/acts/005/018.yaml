translation:
  language: vi
  text: Họ bắt các sứ đồ và giam họ vào nơi giam giữ công cộng.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “đưa họ vào sự giam giữ công cộng.” Cụm từ Hy Lạp có thể chỉ tình trạng bị tạm giữ hoặc giam giữ nói chung, không nhất thiết chỉ một tòa nhà dùng làm nhà giam.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέβαλον τὰς χεῖρας ἐπὶ
  choice: bắt
  rationale: Thành ngữ theo nghĩa đen là “đặt tay trên”, nhưng trong ngữ cảnh thù địch này chỉ việc bắt giữ. “Bắt” truyền đạt tự nhiên và rõ ràng lực bắt giữ của cụm từ trong tiếng Việt hiện đại.
- source_word: ἀποστόλους
  choice: các sứ đồ
  rationale: Trong sách Công Vụ, từ này là danh xưng quen thuộc dành cho những người được Chúa Giê-su sai phái, chứ không chỉ có nghĩa chung là “sứ giả”.
- source_word: ἔθεντο
  choice: giam vào
  rationale: Động từ τίθημι có nghĩa cơ bản là “đặt, đưa vào”; kết hợp với τηρήσει trong ngữ cảnh này, “giam vào” là cách diễn đạt tự nhiên về việc đưa người vào nơi giam giữ.
- source_word: ἐν τηρήσει δημοσίᾳ
  choice: vào nhà giam công cộng
  rationale: τήρησις có thể chỉ tình trạng bị canh giữ hoặc nơi giam giữ; δημοσίᾳ cho biết tính công cộng/chính thức. Bản dịch chính chọn cách hiểu cụ thể phù hợp với ngữ cảnh, đồng thời chú thích giữ lại phạm vi nghĩa rộng hơn.
