  naturalness: «Các thuộc viên» không thông dụng trong tiếng Việt hiện đại và dễ khiến người đọc không nhận ra đây là những người được sai đi thi hành công vụ. «Các nhân viên» tự nhiên, trung tính và hợp văn phong kể chuyện. Cấu trúc câu và dấu hai chấm cuối câu phù hợp vì lời báo cáo được tiếp nối ở câu sau.
