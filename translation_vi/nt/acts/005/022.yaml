  text: But when the officers arrived, they did not find them in the prison; so they returned and reported,
translation:
  language: vi
  text: 'Nhưng khi các nhân viên đến nhà giam, họ không thấy các sứ đồ trong nhà giam, nên trở về báo cáo:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραγενόμενοι
  choice: đến nơi
  rationale: Phân từ mô tả việc các thuộc viên đến nhà giam; “đến nơi” tự nhiên trong tiếng Việt và giữ rõ sắc thái thời gian.
- source_word: ὑπηρέται
  choice: các thuộc viên
  rationale: Trong bối cảnh này, từ này chỉ những người thi hành nhiệm vụ dưới quyền giới lãnh đạo Do Thái. “Thuộc viên” giữ sắc thái chính thức mà không diễn giải quá mức thành “lính canh đền thờ”.
- source_word: αὐτούς
  choice: các sứ đồ
  rationale: Đại từ chỉ những người đã bị bắt trong ngữ cảnh trước; dùng “các sứ đồ” giúp tiếng Việt rõ đối tượng mà không làm thay đổi ý nghĩa.
- source_word: οὐχ εὗρον
  choice: không thấy
  rationale: Trong ngữ cảnh tìm người tại nhà giam, “không thấy” là cách diễn đạt tự nhiên và chính xác.
- source_word: ἐν τῇ φυλακῇ
  choice: trong nhà giam
  rationale: Mạo từ xác định chỉ nhà giam cụ thể đã được nhắc đến; “nhà giam” là cách gọi hiện đại, trang trọng vừa phải.
- source_word: ἀναστρέψαντες
  choice: trở về
  rationale: Phân từ diễn tả việc họ quay lại chỗ những người đã sai mình đi; “trở về” ngắn gọn và tự nhiên.
- source_word: ἀπήγγειλαν
  choice: báo cáo
  rationale: Động từ chỉ việc trình lại tin trong một bối cảnh chính thức; “báo cáo” phù hợp với quan hệ giữa các thuộc viên và cấp có thẩm quyền.
- source_word: δέ … δέ
  choice: Nhưng … nên
  rationale: δέ đầu tiên đánh dấu sự tương phản với điều được mong đợi; δέ thứ hai nối tiếp diễn biến. Cấu trúc “Nhưng … nên” chuyển tải mạch kể tự nhiên trong tiếng Việt.
