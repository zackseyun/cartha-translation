  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οὐχὶ μένον σοὶ ἔμενεν καὶ πραθὲν ἐν τῇ σῇ ἐξουσίᾳ ὑπῆρχεν; τί ὅτι ἔθου ἐν τῇ καρδίᾳ σου τὸ πρᾶγμα τοῦτο; οὐκ ἐψεύσω ἀνθρώποις ἀλλὰ τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/004.yaml
  text: While it remained unsold[a], did it not remain yours? And after it was sold[b], was it not under your authority? Why is it that you have set this matter in your heart? You have not lied to men but to God.
translation:
  language: vi
  text: Khi chưa bán, chẳng phải tài sản ấy vẫn là của anh sao? Sau khi bán rồi, tiền bán chẳng phải vẫn thuộc quyền định đoạt của anh[a] sao? Tại sao anh lại toan tính việc này trong lòng? Anh không nói dối người ta[b], nhưng nói dối Đức Chúa Trời.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “vẫn do anh tùy ý sử dụng” hoặc “vẫn nằm trong quyền của anh.”'
    reason: lexical_alternative
  - marker: b
    text: “Người ta” ở đây chỉ con người nói chung, không chỉ riêng nam giới.
    reason: lexical_alternative
lexical_decisions:
- source_word: μένον / ἔμενεν
  choice: khi chưa bán ... vẫn là
  rationale: Diễn đạt tự nhiên trạng thái tài sản vẫn thuộc về A-na-nia trước khi bán; từ “vẫn” giữ được ý tiếp diễn của μένω dù tiếng Việt không lặp cùng một động từ như tiếng Hy Lạp.
- source_word: σοὶ
  choice: của anh
  rationale: Dịch sở hữu cách tự nhiên trong tiếng Việt, phù hợp với cấu trúc μένω đi với sở hữu gián tiếp.
- source_word: πραθὲν
  choice: sau khi bán rồi
  rationale: Giữ ý thụ động theo nghĩa mà không dùng cấu trúc bị động nặng nề; chủ thể thực hiện hành động đã rõ trong ngữ cảnh.
- source_word: ἐν τῇ σῇ ἐξουσίᾳ ὑπῆρχεν
  choice: vẫn thuộc quyền định đoạt của anh
  rationale: ἐξουσία ở đây chỉ quyền hợp pháp và khả năng tự do quyết định cách sử dụng tiền bán, không chỉ đơn thuần là sở hữu.
- source_word: τί ὅτι
  choice: Tại sao ... lại
  rationale: Cấu trúc tiếng Việt này truyền đạt câu hỏi quở trách và sắc thái nhấn mạnh của thành ngữ Hy Lạp.
- source_word: ἔθου ἐν τῇ καρδίᾳ σου
  choice: quyết định trong lòng
  rationale: Diễn đạt ý định nội tâm đã được xác lập, đồng thời giữ hình ảnh “trong lòng” của nguyên văn.
- source_word: τὸ πρᾶγμα τοῦτο
  choice: làm việc này
  rationale: πρᾶγμα có nghĩa rộng là sự việc hoặc hành động; “việc này” để ngữ cảnh xác định tính chất đạo đức thay vì thêm từ mang tính diễn giải như “âm mưu”.
- source_word: οὐκ ἐψεύσω ἀνθρώποις ἀλλὰ τῷ θεῷ
  choice: Anh không nói dối loài người, nhưng nói dối Đức Chúa Trời
  rationale: Giữ trực tiếp sự tương phản giữa con người và Đức Chúa Trời. “Loài người” ở đây chỉ con người nói chung, không riêng nam giới.
theological_decisions:
- issue: Hàm ý về thần tính của Đức Thánh Linh trong mạch văn gần (x. Công Vụ 5:3)
  choice: Dịch trực tiếp là “Đức Chúa Trời” mà không thêm lời giải thích vào chính văn.
  alternative: “Đức Chúa Trời, tức là Đức Thánh Linh”
  rationale: Câu này tự thân nói τῷ θεῷ, “với Đức Chúa Trời.” Mối liên hệ với Đức Thánh Linh được mạch văn xác lập, nhưng bản dịch không nên đưa phần giải nghĩa vào chính văn.
- issue: Quyền sở hữu và quyền tự do đối với tài sản
  choice: “tiền bán ... vẫn thuộc quyền định đoạt của anh”
  alternative: Chỉ nói rằng tiền vẫn ở trong tay hoặc vẫn thuộc sở hữu của anh.
  rationale: Lập luận của Phi-e-rơ nhấn mạnh A-na-nia có quyền quyết định đối với tài sản và tiền bán; tội lỗi là sự dối trá chứ không phải việc không giao nộp toàn bộ tài sản.
- issue: Phạm vi nghĩa của ἀνθρώποις
  choice: “loài người”
  alternative: “người ta” hoặc “con người”
  rationale: Danh từ số nhiều ở đây chỉ nhân loại nói chung. “Loài người” giữ rõ sự tương phản khái quát với Đức Chúa Trời và không giới hạn ở nam giới.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh” theo lời Phi-e-rơ trực tiếp chất vấn A-na-nia. Hai dấu chú thích được đặt ngay sau cụm từ mà chúng giải thích; vị trí này sửa sự lệch dấu trong lớp tham khảo tiếng Anh.
