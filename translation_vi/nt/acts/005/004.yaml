  terminology: “Đức Chúa Trời” phù hợp với ngữ vực Kinh Thánh. “Người ta” là cách gọi tự nhiên, không phân biệt giới, cho ἀνθρώποις trong sự đối lập với Đức Chúa Trời. “Quyền định đoạt” diễn đạt tốt ἐξουσία, tức quyền kiểm soát/quyền quyết định hợp pháp.
