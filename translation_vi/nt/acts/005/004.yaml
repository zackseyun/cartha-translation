revisions:
- from: Khi chưa bán, chẳng phải tài sản ấy vẫn là của anh sao? Sau khi bán rồi, tiền bán chẳng phải vẫn thuộc quyền định đoạt của anh[a] sao? Tại sao anh lại quyết định trong lòng làm việc này? Anh không nói dối loài người[b], nhưng nói dối Đức Chúa Trời.
  to: Khi chưa bán, chẳng phải tài sản ấy vẫn là của anh sao? Sau khi bán rồi, tiền bán chẳng phải vẫn thuộc quyền định đoạt của anh[a] sao? Tại sao anh lại toan tính việc này trong lòng? Anh không nói dối người ta[b], nhưng nói dối Đức Chúa Trời.
  rationale: Sửa vị trí neo của chú thích a để chú giải trực tiếp cụm chỉ quyền kiểm soát. Thay “quyết định trong lòng làm việc này” bằng “toan tính việc này trong lòng” để phản ánh tự nhiên hơn thành ngữ Hy Lạp về ý định nội tâm. Đổi “loài người” thành “người ta” cho cách dùng hiện đại tự nhiên, vẫn giữ nghĩa bao quát của ἀνθρώποις và thế đối lập với Đức Chúa Trời.
