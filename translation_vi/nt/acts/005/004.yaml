  source_fidelity: 'Bản dịch truyền đạt đúng lập luận chính: tài sản khi chưa bán thuộc về A-na-nia, và sau khi bán ông vẫn có quyền quyết định đối với số tiền. Câu kết giữ đúng thế đối lập giữa con người và Đức Chúa Trời. Tuy nhiên, dấu chú thích a hiện neo sau “anh” thay vì cụm diễn đạt ἐξουσία; và “quyết định trong lòng làm việc này” chưa tự nhiên, đồng thời diễn đạt ý “đặt/toan tính việc này trong lòng” chưa sát bằng.'
