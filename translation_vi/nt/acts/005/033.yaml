  text: But when they heard this, they were enraged and wanted to kill them.
translation:
  language: vi
  text: Nhưng khi nghe những lời ấy, họ vô cùng phẫn nộ[a] và muốn giết các sứ đồ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát hơn: “như bị cưa xẻ” hoặc “bị cắt thấu,” một cách nói diễn tả sự kích động thù nghịch dữ dội.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἱ δὲ
  choice: Nhưng... họ
  rationale: δέ mang sắc thái chuyển ý hơi tương phản, chuyển từ lời của các sứ đồ sang phản ứng của những người trong Hội đồng; mạo từ được dùng như danh từ chỉ nhóm người đã được xác định trong ngữ cảnh.
- source_word: ἀκούσαντες
  choice: khi nghe những lời ấy
  rationale: Phân từ bất định quá khứ được diễn đạt theo quan hệ thời gian; “những lời ấy” nêu rõ đối tượng được hàm ý là lời vừa được nghe.
- source_word: διεπρίοντο
  choice: giận điên lên
  rationale: Động từ gợi hình ảnh bị cưa hoặc cắt xuyên qua, nhưng trong ngữ cảnh diễn tả sự kích động và phẫn nộ thù nghịch dữ dội. Cách dịch này tự nhiên trong tiếng Việt và tránh khiến độc giả hiểu thành sự ăn năn hay đau đớn nội tâm.
- source_word: ἐβούλοντο
  choice: muốn
  rationale: Thì chưa hoàn thành diễn tả ý muốn hoặc ý định đang hình thành/tiếp diễn; “muốn” tự nhiên và đủ mạnh khi đi với hành động giết người ngay sau đó.
- source_word: ἀνελεῖν
  choice: giết
  rationale: Trong ngữ cảnh này, ἀναιρέω có nghĩa là lấy mạng sống, nên “giết” truyền đạt trực tiếp và rõ ràng.
- source_word: αὐτούς
  choice: các sứ đồ
  rationale: Đại từ chỉ các sứ đồ đang bị xét hỏi. Dùng danh từ thay cho “họ” để tránh hai đại từ cùng chỉ hai nhóm người khác nhau trong một câu tiếng Việt.
theological_decisions:
- issue: διεπρίοντο có thể bị hiểu là sự cáo trách hoặc đau đớn trong lòng
  choice: giận điên lên
  alternative: bị cắt thấu trong lòng
  rationale: Ngữ cảnh—ngay sau đó họ muốn giết các sứ đồ—cho thấy phản ứng thù nghịch dữ dội. Bản dịch chính truyền đạt chức năng ngữ cảnh, còn chú thích giữ lại hình ảnh nguyên ngữ và tính đa nghĩa.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. “Giận điên lên” là thành ngữ tiếng Việt tự nhiên để diễn tả cơn giận dữ cực độ; chú thích bảo tồn hình ảnh mạnh của nguyên ngữ. Dùng “các sứ đồ” ở cuối câu giúp phân biệt rõ chủ thể nổi giận với những người bị họ muốn giết.
