review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch truyền đạt đúng diễn tiến: sau khi nghe lời các sứ đồ, nhóm người ấy phản ứng dữ dội và muốn giết các sứ đồ. “Các sứ đồ” xác định đúng đối tượng của αὐτούς. Tuy nhiên, “giận điên lên” thêm sắc thái mất kiểm soát/tựa như điên không được nêu trực tiếp trong διεπρίοντο; động từ này diễn tả sự bị khuấy động, đau nhói như bị cưa xẻ, và trong ngữ cảnh là phẫn nộ thù nghịch.'
