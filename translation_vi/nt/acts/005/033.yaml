    rationale: διεπρίοντο biểu thị phản ứng cảm xúc dữ dội; ngữ cảnh xác định đó là thù nghịch, nhưng từ Hy Lạp không khẳng định họ trở nên “điên.”
  - severity: low
    issue: Chú thích gọi “bị cắt thấu trong lòng” là dịch sát.
    rationale: Nguyên ngữ dùng hình ảnh bị cưa/cắt xuyên qua, không có từ chỉ “lòng” trong câu; có thể nêu cách diễn đạt truyền thống như một phương án giải nghĩa, nhưng không nên gọi là sát nghĩa theo mặt chữ.
  revised_text: Nhưng khi nghe những lời ấy, họ vô cùng phẫn nộ[a] và muốn giết các sứ đồ.
