source:
  edition: SBLGNT
  text: πρὸ γὰρ τούτων τῶν ἡμερῶν ἀνέστη Θευδᾶς, λέγων εἶναί τινα ἑαυτόν, ᾧ ⸀προσεκλίθη ⸂ἀνδρῶν ἀριθμὸς ὡς⸃ τετρακοσίων· ὃς ἀνῃρέθη, καὶ πάντες ὅσοι ἐπείθοντο αὐτῷ διελύθησαν καὶ ἐγένοντο εἰς οὐδέν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/036.yaml
  text: For before these days Theudas rose up[a], claiming to be somebody, and a number of men, about four hundred, joined him. He was killed[c][b], and all who had been persuaded by him were scattered and came to nothing.
translation:
  language: vi
  text: Vì, trước những ngày này, Thêu-đa đã nổi lên, tự xưng là một nhân vật quan trọng[a], và khoảng bốn trăm người đàn ông đã theo về phe ông[b]. Ông bị giết, và tất cả những người bị ông thuyết phục[c] đều tan tác và đi đến chỗ không còn gì.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “tự xưng là một nhân vật nào đó.” Cụm từ Hy Lạp hàm ý ông tự cho mình là người có tầm quan trọng.'
    reason: lexical_alternative
  - marker: b
    text: 'Hay: “quy tụ quanh ông” hoặc “gắn mình với ông.” Nguyên ngữ nói đến việc đứng về phía một người.'
    reason: lexical_alternative
  - marker: c
    text: 'Hay: “tất cả những người nghe theo ông.” Sát hơn: “tất cả những người bị ông thuyết phục.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸ γὰρ τούτων τῶν ἡμερῶν
  choice: Vì trước những ngày này
  rationale: Giữ liên từ giải thích γάρ và ý nghĩa thời gian của πρό với sở hữu cách; cách diễn đạt hơi trang trọng nhưng sát với lập luận của Ga-ma-li-ên.
- source_word: ἀνέστη
  choice: đã nổi lên
  rationale: Trong ngữ cảnh này, động từ nói đến sự xuất hiện của một người cầm đầu hay một phong trào, không phải sự sống lại.
- source_word: Θευδᾶς
  choice: Thêu-đa
  rationale: Phiên âm tên riêng Hy Lạp theo lối đọc tự nhiên trong tiếng Việt.
- source_word: λέγων εἶναί τινα ἑαυτόν
  choice: tự xưng mình là một nhân vật quan trọng
  rationale: Cụm τινα ἑαυτόν là thành ngữ chỉ việc tự cho mình là người có địa vị hoặc tầm quan trọng; bản dịch làm rõ nghĩa hàm ẩn mà không xác định cụ thể ông tự nhận danh hiệu nào.
- source_word: ᾧ προσεκλίθη
  choice: theo về phe ông
  rationale: Diễn đạt việc những người ấy gắn mình, quy tụ hoặc đứng về phía Thêu-đa, tự nhiên hơn lối dịch máy móc là 'nghiêng về ông'.
- source_word: ἀνδρῶν ἀριθμὸς ὡς τετρακοσίων
  choice: có khoảng bốn trăm người
  rationale: ὡς biểu thị con số xấp xỉ; trong ngữ cảnh nhóm người theo một thủ lĩnh, 'người' đủ tự nhiên, còn chú thích nêu rõ danh từ Hy Lạp chỉ nam giới.
- source_word: ὃς ἀνῃρέθη
  choice: Ông bị giết
  rationale: ἀναιρέω ở đây có nghĩa là giết hoặc trừ khử; thể bị động được giữ nguyên.
- source_word: πάντες ὅσοι ἐπείθοντο αὐτῷ
  choice: tất cả những người nghe theo ông
  rationale: πείθω ở dạng này có thể mang nghĩa được thuyết phục, tin theo hoặc nghe theo; 'nghe theo' tự nhiên và vẫn giữ liên hệ với ảnh hưởng của Thêu-đa.
- source_word: διελύθησαν
  choice: đều tan tác
  rationale: Diễn tả nhóm người bị phân tán và phong trào tan rã.
- source_word: ἐγένοντο εἰς οὐδέν
  choice: chẳng còn gì
  rationale: Chuyển tải thành ngữ chỉ kết cục hoàn toàn thất bại, không đạt được điều gì.
theological_decisions:
- issue: Lời thuật lịch sử về Thêu-đa trong diễn từ của Ga-ma-li-ên
  choice: Trình bày thẳng sự việc như một phần trong lập luận của Ga-ma-li-ên.
  alternative: Thêm ngôn ngữ hàm ý câu chuyện không chắc chắn, hoặc điều chỉnh để phù hợp với một cách tái dựng lịch sử bên ngoài bản văn.
  rationale: Bản Hy Lạp trình bày đây là ví dụ Ga-ma-li-ên viện dẫn; bản dịch không nên đưa phán đoán lịch sử hay cách dung hòa vào câu văn.
- issue: Mức độ quan trọng mà Thêu-đa tự nhận
  choice: một nhân vật quan trọng
  alternative: một người nào đó / một nhân vật nào đó
  rationale: Cụm Hy Lạp là một thành ngữ hàm ý tự nhận mình có tầm vóc, nhưng không nói rõ danh hiệu hay bản chất của lời tự nhận; bản dịch giữ giới hạn đó.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “nổi lên” cho sự xuất hiện của một thủ lĩnh; “theo về phe” và “tan tác” tạo mạch kể tự nhiên. Các dấu chú thích [a], [b], [c] đều được đặt ngay sau cụm từ liên quan trong chính văn.
