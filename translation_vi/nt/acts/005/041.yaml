source:
  edition: SBLGNT
  text: οἱ μὲν οὖν ἐπορεύοντο χαίροντες ἀπὸ προσώπου τοῦ συνεδρίου ὅτι ⸂κατηξιώθησαν ὑπὲρ τοῦ ὀνόματος⸃ ἀτιμασθῆναι·
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/041.yaml
  text: So they went on their way from the presence of the council[a], rejoicing that they had been counted worthy to be dishonored for the Name.
translation:
  language: vi
  text: Vậy, họ rời khỏi hội đồng, vui mừng vì đã được kể là xứng đáng chịu nhục vì Danh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “vì danh của Chúa Giê-xu.” Tiếng Hy Lạp viết “Danh,” một cách nói tôn kính mà đối tượng được để hàm ẩn trong câu.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπορεύοντο
  choice: rời khỏi
  rationale: Động từ ở thì chưa hoàn thành mô tả việc họ đi ra khỏi nơi hội đồng hiện diện; trong tiếng Việt, “rời khỏi” tự nhiên trong mạch kể và kết hợp rõ với cụm chỉ nơi chốn.
- source_word: χαίροντες
  choice: lòng vui mừng
  rationale: Phân từ hiện tại diễn tả trạng thái đi kèm khi họ rời đi. Cách nói này giữ lực động từ và tạo câu tiếng Việt tự nhiên.
- source_word: ἀπὸ προσώπου τοῦ συνεδρίου
  choice: khỏi hội đồng
  rationale: Cụm Hy Lạp có nghĩa đen là “khỏi mặt/sự hiện diện của hội đồng.” Tiếng Việt không cần dịch máy móc “khỏi trước mặt”; ngữ cảnh xét xử khiến “rời khỏi hội đồng” truyền đạt đúng ý.
- source_word: συνεδρίου
  choice: hội đồng
  rationale: Danh từ chỉ cơ quan lãnh đạo và xét xử của người Do Thái. “Hội đồng” dễ hiểu hơn việc phiên âm tên riêng Sanhedrin.
- source_word: κατηξιώθησαν
  choice: đã được kể là xứng đáng
  rationale: 'Giữ thể bị động và sắc thái đánh giá của động từ: họ được xem hoặc được kể là xứng đáng.'
- source_word: ὑπὲρ
  choice: vì
  rationale: Trong ngữ cảnh này, giới từ chỉ nguyên do hoặc điều mà sự chịu nhục gắn với. “Vì” ngắn gọn và tự nhiên.
- source_word: τοῦ ὀνόματος
  choice: Danh ấy
  rationale: Nguyên văn dùng tuyệt đối “Danh,” một lối nói tôn kính với đối tượng được để hàm ẩn. Viết hoa và thêm “ấy” giúp tiếng Việt xác định cụm danh từ mà không diễn giải thẳng thành “danh Chúa Giê-xu.”
- source_word: ἀτιμασθῆναι
  choice: chịu nhục
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt, giữ ý bị người khác làm mất danh dự trong khung ý niệm danh dự–sỉ nhục.
theological_decisions:
- issue: Cách dùng tuyệt đối của “Danh”
  choice: Giữ cách nói hàm ẩn là “Danh ấy” trong chính văn.
  alternative: “danh Chúa Giê-xu” hoặc “danh Ngài”
  rationale: τοῦ ὀνόματος không nêu rõ danh của ai, dù ngữ cảnh cho thấy đó là Chúa Giê-xu. Giữ sự hàm ẩn bảo toàn sắc thái tôn kính và tránh đưa phần giải thích vào chính văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Lòng vui mừng” tránh lối đảo câu nặng nề; “chịu nhục” là thành ngữ tự nhiên nhưng vẫn bảo toàn sắc thái danh dự–sỉ nhục. Dấu chú thích [a] được đặt ngay sau cụm từ cần giải thích.
