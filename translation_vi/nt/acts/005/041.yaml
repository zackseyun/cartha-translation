  to: Vậy, họ rời khỏi hội đồng, vui mừng vì đã được kể là xứng đáng chịu nhục vì Danh.[a]
  rationale: Chỉnh “lòng vui mừng” thành “vui mừng” để phản ánh trực tiếp hơn phân từ χαίροντες. Bỏ “ấy” sau “Danh” để không thêm sắc thái chỉ định ngoài nguyên văn, đồng thời bảo toàn lối nói tuyệt đối, tôn kính của τοῦ ὀνόματος. Chú thích được điều chỉnh nhẹ để diễn đạt tự nhiên và chính xác rằng nguyên văn không nêu đối tượng một cách minh thị.
