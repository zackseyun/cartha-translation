  source_fidelity: 'Bản nháp chuyển tải đúng mạch chính: các sứ đồ rời hội đồng trong niềm vui vì được xem là xứng đáng chịu sự sỉ nhục liên quan đến “Danh”. Tuy nhiên, “Danh ấy” thêm chỉ thị từ “ấy”, vốn không có trong cách dùng tuyệt đối τοῦ ὀνόματος và làm giảm tính cô đọng, tôn kính của nguyên văn.'
