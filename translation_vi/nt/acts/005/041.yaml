  terminology: Giữ “hội đồng”, “được kể là xứng đáng”, “chịu nhục”, và viết hoa “Danh” là phù hợp. “Danh” đứng tuyệt đối bảo toàn lối nói tôn kính và sự hàm ẩn về đối tượng; không nên thêm “ấy” hoặc đưa “Chúa Giê-xu” vào chính văn.
