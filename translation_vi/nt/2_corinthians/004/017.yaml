source:
  edition: SBLGNT
  text: τὸ γὰρ παραυτίκα ἐλαφρὸν τῆς θλίψεως ⸀ἡμῶν καθ’ ὑπερβολὴν εἰς ὑπερβολὴν αἰώνιον βάρος δόξης κατεργάζεται ἡμῖν,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/017.yaml
  text: For our momentary light affliction is producing for us an eternal weight of glory beyond all comparison,[a]
translation:
  language: vi
  text: Vì hoạn nạn nhẹ và tạm thời của chúng ta đang tạo nên cho chúng ta một sức nặng vinh quang đời đời vượt trội vô cùng,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đến một mức độ vượt trội tột cùng.” Tiếng Hy Lạp dịch sát là “theo sự vượt trội, đến sự vượt trội,” một cách lặp để nhấn mạnh mức độ phi thường.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παραυτίκα
  choice: chóng qua
  rationale: Từ này chỉ điều thuộc khoảnh khắc hiện tại, có tính tạm thời. “Chóng qua” tự nhiên trong tiếng Việt và làm nổi bật sự tương phản với “đời đời”.
- source_word: ἐλαφρὸν
  choice: nhẹ
  rationale: Giữ nguyên phép đối lập tu từ với “sức nặng” (βάρος), nhưng không hàm ý rằng hoạn nạn là dễ chịu.
- source_word: θλίψεως
  choice: hoạn nạn
  rationale: Diễn đạt sức ép, khốn khó và đau khổ trong cách dùng của Phao-lô; đây là từ trang trọng nhưng vẫn quen thuộc với độc giả Việt hiện đại.
- source_word: ἡμῶν
  choice: của chúng ta
  rationale: Giữ quan hệ sở hữu của sở hữu cách, trước hết quy về Phao-lô cùng các cộng sự.
- source_word: καθ’ ὑπερβολὴν εἰς ὑπερβολὴν
  choice: vượt xa mọi sự so sánh
  rationale: Cụm lặp nhấn mạnh mức độ phi thường, vượt quá mọi chuẩn đo lường. Cách dịch này truyền đạt sức nhấn mà không dùng một lối diễn đạt từng chữ khó hiểu.
- source_word: αἰώνιον
  choice: đời đời
  rationale: Phù hợp với sự tương phản giữa hoạn nạn chóng qua và vinh quang không chấm dứt trong ngữ cảnh.
- source_word: βάρος
  choice: sức nặng
  rationale: Bảo tồn hình ảnh đối lập có chủ ý giữa “nhẹ” và “sức nặng”; “gánh nặng” dễ gợi điều áp bức hoặc tiêu cực.
- source_word: δόξης
  choice: vinh quang
  rationale: Giữ cấu trúc “sức nặng vinh quang” theo cách tự nhiên vừa đủ trong tiếng Việt, không làm phẳng hình ảnh thành một tính từ đơn thuần.
- source_word: κατεργάζεται
  choice: đang tạo nên
  rationale: Thể hiện tác động đang diễn ra và dẫn đến kết quả thực hữu; “tạo nên” rõ nghĩa hơn lối dịch sát chữ nhưng thiếu tự nhiên.
- source_word: ἡμῖν
  choice: cho chúng ta
  rationale: 'Hiểu tặng cách theo nghĩa lợi ích: kết quả vinh quang được tạo nên cho chúng ta; tránh mặc nhiên biến câu thành lời nói riêng về sự biến đổi nội tâm.'
- source_word: τὸ ... ἐλαφρὸν τῆς θλίψεως ἡμῶν
  choice: hoạn nạn nhẹ và chóng qua của chúng ta
  rationale: Sắp xếp lại cụm từ cho tự nhiên trong tiếng Việt, đồng thời giữ đủ các ý về mức độ nhẹ, tính tạm thời và quan hệ sở hữu.
theological_decisions:
- issue: Bản chất của vinh quang được tạo nên qua hoạn nạn
  choice: Câu văn nói hoạn nạn hiện tại đang dẫn đến vinh quang đời đời cho chúng ta, nhưng không thêm ý rằng đau khổ tự nó lập công để mua lấy sự cứu rỗi.
  alternative: Hiểu rằng hoạn nạn tạo công trạng cứu rỗi, hoặc chỉ tạo nên sự trưởng thành tâm linh ngay trong hiện tại.
  rationale: Sự đối lập giữa “chóng qua” và “đời đời” hướng tới kết quả cánh chung. Bản dịch giữ nguyên ngôn ngữ nhân quả mạnh của κατεργάζεται nhưng không giải thích vượt quá câu văn.
translation_notes:
  register: Văn phong trang trọng, sáng rõ và hiện đại. “Hoạn nạn” duy trì sắc thái Kinh Thánh quen thuộc; “nhẹ” và “sức nặng” bảo tồn phép đối lập của nguyên văn. Dấu phẩy trước ký hiệu chú thích được giữ theo cấu trúc câu cung cấp.
