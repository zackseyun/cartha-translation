  rationale: 'Sửa an toàn cần thiết là làm rõ cấu trúc vị ngữ của κύριον: điều được rao giảng là Jêsus, Đấng Mê-si-a, là Chúa. Các phần còn lại giữ nguyên ý nghĩa, tương phản tu từ, và các lựa chọn từ vựng chủ đạo của bản nháp.'
