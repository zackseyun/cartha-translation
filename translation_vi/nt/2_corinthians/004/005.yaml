reference: 2 Corinthians 4:5
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οὐ γὰρ ἑαυτοὺς κηρύσσομεν ἀλλὰ ⸂Χριστὸν Ἰησοῦν⸃ κύριον, ἑαυτοὺς δὲ δούλους ὑμῶν διὰ Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/005.yaml
  text: For we do not proclaim ourselves[a], but Messiah Jesus as Lord[c][b], and ourselves as your servants for Jesus' sake.
translation:
  language: vi
  text: Vì chúng tôi không rao giảng chính mình, nhưng rao giảng Jêsus, Đấng Mê-si-a, là Chúa[a], và chính mình là nô lệ của anh chị em[b] vì Jêsus[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Christ Jêsus là Chúa.” Từ Hy Lạp Χριστός có thể được dịch là “Đấng Mê-si-a” khi mang nghĩa tước hiệu, hoặc “Christ” khi gần như một phần của tên riêng.'
    reason: lexical_alternative
  - marker: b
    text: 'Hay: “đầy tớ của anh chị em.” Từ Hy Lạp δοῦλος có thể chỉ nô lệ hoặc đầy tớ; ở đây “nô lệ” giữ sắc thái lệ thuộc mạnh, tương phản với Jêsus là Chúa.'
    reason: lexical_alternative
  - marker: c
    text: 'Hay: “do Jêsus.”'
    reason: alternative_reading
lexical_decisions:
- source_word: κηρύσσομεν
  choice: rao giảng
  rationale: Diễn đạt hành động công khai loan báo sứ điệp; trong văn cảnh sứ vụ của Phao-lô, “rao giảng” tự nhiên và rõ nghĩa hơn “công bố”.
- source_word: ἑαυτοὺς
  choice: chính mình
  rationale: 'Giữ đại từ phản thân được lặp lại để làm nổi bật sự tương phản: họ không phải là nội dung được rao giảng, nhưng tự nhận vị trí lệ thuộc để phục vụ tín hữu Cô-rinh-tô.'
- source_word: Χριστὸν Ἰησοῦν
  choice: Đấng Mê-si-a là Đức Chúa Jêsus
  rationale: Giữ Χριστός theo nghĩa tước hiệu “Đấng Mê-si-a”, đồng thời dùng cấu trúc tiếng Việt tự nhiên để gắn tước hiệu ấy với tên Jêsus.
- source_word: κύριον
  choice: Đức Chúa
  rationale: 'Trong cụm này, κύριον được hiểu theo chức năng vị ngữ: điều được rao giảng về Đấng Mê-si-a Jêsus là Ngài mang địa vị Chúa. “Đức Chúa” giữ sắc thái tôn kính và phân biệt với cách xưng hô thông thường.'
- source_word: δούλους
  choice: nô lệ
  rationale: Giữ lực mạnh của δοῦλος và sự tương phản có chủ ý giữa Jêsus là Đức Chúa với những người rao giảng ở địa vị hoàn toàn lệ thuộc để phục vụ cộng đồng.
- source_word: ὑμῶν
  choice: của anh chị em
  rationale: Thể hiện tự nhiên quan hệ lệ thuộc do sở hữu cách sau δοῦλος, đồng thời dùng cách gọi cộng đồng bao quát trong tiếng Việt hiện đại.
- source_word: διὰ Ἰησοῦν
  choice: vì Đức Chúa Jêsus
  rationale: 'διά với đối cách ở đây tự nhiên nhất là nêu nguyên do hoặc động lực: họ trở nên nô lệ của cộng đồng vì Jêsus.'
theological_decisions:
- issue: Χριστός là tước hiệu hay thành tố gần như tên riêng
  choice: 'Tước hiệu: “Đấng Mê-si-a”'
  alternative: “Đấng Christ” hoặc “Christ Jêsus”
  rationale: Trong nội dung lời rao giảng, lực tước hiệu vẫn hiện diện; cách dịch này không làm Χριστός trở thành một phần tên riêng một cách mặc định.
- issue: Quan hệ cú pháp trong Χριστὸν Ἰησοῦν κύριον
  choice: 'Hiểu κύριον theo chức năng vị ngữ: Đấng Mê-si-a là Đức Chúa Jêsus'
  alternative: “Đức Chúa Jêsus Christ” hoặc “Christ Jêsus, là Chúa”
  rationale: Cách dịch giữ lời tuyên xưng về địa vị Đức Chúa của Jêsus mà không thêm một mệnh đề thần học vượt quá cấu trúc Hy Lạp.
- issue: Mức độ lệ thuộc trong δοῦλοι ὑμῶν
  choice: “nô lệ của anh chị em”
  alternative: “đầy tớ của anh chị em” hoặc “người phục vụ anh chị em”
  rationale: “Nô lệ” giữ nguyên sức nặng của từ và sự tự hạ mạnh mẽ trong thế đối lập với κύριος, dù cách nói có tính gây chú ý trong tiếng Việt hiện đại.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ đọc. “Anh chị em” diễn đạt số nhiều ὑμῶν một cách bao quát. “Nô lệ” được giữ dù mạnh hơn lối nói thông thường vì có ý nghĩa tu từ rõ trong câu. Mọi chú thích đều được đánh dấu trong chính văn.
