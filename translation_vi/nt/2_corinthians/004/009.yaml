  text: διωκόμενοι ἀλλ’ οὐκ ἐγκαταλειπόμενοι, καταβαλλόμενοι ἀλλ’ οὐκ ἀπολλύμενοι,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/009.yaml
  text: persecuted[a], but not abandoned; struck down, but not destroyed[b],
translation:
  language: vi
  text: bị bắt bớ nhưng không bị bỏ rơi; bị đánh ngã nhưng không bị tiêu diệt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διωκόμενοι
  choice: bị bắt bớ
  rationale: Trong ngữ cảnh các hoạn nạn của Phao-lô và các bạn đồng lao, từ này chỉ sự truy đuổi và áp bức thù địch; “bị bắt bớ” là cách diễn đạt tự nhiên, rõ nghĩa trong tiếng Việt hiện đại.
- source_word: ἐγκαταλειπόμενοι
  choice: bị bỏ rơi
  rationale: Diễn tả việc bị bỏ lại, bị ruồng bỏ hoặc không còn được nâng đỡ. “Bị bỏ rơi” tự nhiên hơn “bị lìa bỏ” mà vẫn giữ nguyên ý nghĩa của từ Hy Lạp.
- source_word: καταβαλλόμενοι
  choice: bị đánh ngã
  rationale: Động từ có nghĩa bị quật hoặc đánh ngã. Cách dịch này giữ hình ảnh xung đột và tạo thế đối lập rõ ràng với việc không bị tiêu diệt.
- source_word: ἀπολλύμενοι
  choice: bị tiêu diệt
  rationale: Trong thế đối lập với “bị đánh ngã,” từ này nói đến sự hủy diệt hoàn toàn, không chỉ lâm vào nguy khốn hay đang chết dần.
- source_word: ἀλλ’ οὐκ
  choice: nhưng không
  rationale: Giữ cấu trúc đối lập ngắn gọn, cân xứng và nhịp điệu tu từ của hai vế Hy Lạp.
theological_decisions:
- issue: Có nên dịch ἐγκαταλειπόμενοι bằng cách diễn đạt mang âm hưởng thần học truyền thống hơn hay bằng tiếng Việt hiện đại
  choice: bị bỏ rơi
  alternative: bị lìa bỏ
  rationale: “Bị bỏ rơi” bảo toàn sự khẳng định rằng giữa cảnh bắt bớ, Phao-lô và các bạn đồng lao không bị bỏ mặc, nhưng không áp đặt một liên hệ trích dẫn hoặc sắc thái thần học vượt quá câu này.
translation_notes:
  register: Văn phong ngắn gọn, trang trọng và dễ hiểu; giữ nguyên hai cặp đối lập song hành của nguyên văn. Không thêm chủ thể hoặc giải thích ai là người không bỏ rơi họ, vì nguyên văn để điều đó hàm ẩn.
