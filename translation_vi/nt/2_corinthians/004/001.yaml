revisions:
- from: Vì vậy, bởi chúng tôi có chức vụ này, thể theo lòng thương xót chúng tôi đã nhận được, nên chúng tôi không nản lòng.
  to: Vì vậy, vì chúng tôi có chức vụ này, như chúng tôi đã nhận được lòng thương xót, chúng tôi không nản lòng.
  rationale: Sửa thành ngữ và cấu trúc câu cho tự nhiên hơn trong tiếng Việt hiện đại, đồng thời duy trì cả “Vì vậy” của διὰ τοῦτο lẫn liên hệ không hoàn toàn xác định của καθὼς (“như”), thay vì biến nó thành một khẳng định nhân quả rõ rệt hơn nguyên văn.
  reviewer_model: gpt-5.6-terra
