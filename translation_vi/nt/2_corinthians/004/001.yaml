  text: Διὰ τοῦτο, ἔχοντες τὴν διακονίαν ταύτην καθὼς ἠλεήθημεν, οὐκ ⸀ἐγκακοῦμεν,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/001.yaml
  text: Therefore, since we have this ministry, just as we have received mercy, we do not lose heart.
translation:
  language: vi
  text: Vì vậy, vì chúng tôi có chức vụ này, như chúng tôi đã nhận được lòng thương xót, chúng tôi không nản lòng.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διακονία
  choice: chức vụ
  rationale: Trong ngữ cảnh, từ này chỉ nhiệm vụ phục vụ được Đức Chúa Trời giao cho Phao-lô và các cộng sự; “chức vụ” tự nhiên và trang trọng hơn “sự phục vụ” ở đây.
- source_word: ἠλεήθημεν
  choice: chúng tôi đã nhận được lòng thương xót
  rationale: Dạng bị động được diễn đạt tự nhiên trong tiếng Việt, vẫn giữ Đức Chúa Trời là tác nhân ngầm và nhấn mạnh lòng thương xót đã được nhận.
- source_word: ἐγκακοῦμεν
  choice: chúng tôi không nản lòng
  rationale: Diễn đạt ý không mất can đảm, không chùn bước trong khi thi hành chức vụ.
theological_decisions:
- issue: Mối liên hệ giữa việc có chức vụ và việc nhận lòng thương xót
  choice: “thể theo lòng thương xót chúng tôi đã nhận được”
  alternative: “vì chúng tôi đã nhận được lòng thương xót”
  rationale: καθὼς có thể diễn tả sự tương ứng hoặc nền tảng liên hệ; “thể theo” bảo lưu sắc thái “just as/as” của nguyên bản mà không buộc câu thành quan hệ nguyên nhân thuần túy.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc “Vì vậy… nên…” làm rõ quan hệ suy luận trong tiếng Việt; giữ đại từ số nhiều “chúng tôi” của tác giả.
