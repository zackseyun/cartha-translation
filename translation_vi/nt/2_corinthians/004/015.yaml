reference: 2 Corinthians 4:15
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τὰ γὰρ πάντα δι’ ὑμᾶς, ἵνα ἡ χάρις πλεονάσασα διὰ τῶν πλειόνων τὴν εὐχαριστίαν περισσεύσῃ εἰς τὴν δόξαν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/015.yaml
  text: For all things are for your sake[a], so that as grace increases through more and more people, thanksgiving may overflow to the glory of God.
translation:
  language: vi
  text: Vì mọi sự đều vì anh chị em, để khi ân điển gia tăng qua ngày càng nhiều người,[a] thì lời tạ ơn cũng càng dồi dào, đem lại vinh quang cho Đức Chúa Trời.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “qua nhiều người” hoặc “qua một số người đông hơn.” Cụm từ Hy Lạp có thể chỉ nhiều người nói chung hoặc một số người ngày càng đông; cũng có thể được hiểu là gắn với việc lời tạ ơn trở nên dồi dào.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ γὰρ πάντα
  choice: Vì mọi sự
  rationale: Giữ phạm vi bao quát của τὰ πάντα và chức năng giải thích của γὰρ, đồng thời tự nhiên trong tiếng Việt.
- source_word: δι’ ὑμᾶς
  choice: đều vì anh chị em
  rationale: διά với đối cách diễn tả lợi ích dành cho người nhận; “vì anh chị em” rõ nghĩa hơn “do anh chị em” và dùng cách xưng hô bao gồm cả nam lẫn nữ.
- source_word: ἵνα
  choice: để
  rationale: Diễn đạt tự nhiên quan hệ mục đích hoặc kết quả mà không buộc phải phân định tuyệt đối giữa hai sắc thái.
- source_word: ἡ χάρις
  choice: ân điển
  rationale: Thuật ngữ trang trọng, quen thuộc để chỉ ân huệ nhưng không của Đức Chúa Trời, vẫn giữ được bề rộng thần học của χάρις.
- source_word: πλεονάσασα διὰ τῶν πλειόνων
  choice: khi đến với ngày càng nhiều người hơn
  rationale: Diễn đạt sự gia tăng của ân điển gắn với một số người ngày càng đông; “đến với” tự nhiên hơn một bản dịch máy móc dùng “qua,” nhưng không xác định cơ chế thần học.
- source_word: τὴν εὐχαριστίαν περισσεύσῃ
  choice: làm cho lời tạ ơn tràn đầy
  rationale: Giữ sắc thái dồi dào của περισσεύω và xác định εὐχαριστία là hành động tạ ơn, không chỉ là cảm xúc biết ơn.
- source_word: εἰς τὴν δόξαν τοῦ θεοῦ
  choice: đem lại vinh quang cho Đức Chúa Trời
  rationale: Truyền đạt đích hướng hoặc kết quả của εἰς bằng một cấu trúc tiếng Việt tự nhiên.
theological_decisions:
- issue: Ý nghĩa và tác động của “ân điển” trong mệnh đề mục đích
  choice: Giữ “ân điển” theo nghĩa rộng là ân huệ của Đức Chúa Trời đang lan đến ngày càng nhiều người và sinh ra lời tạ ơn.
  alternative: Hiểu riêng là ân điển cứu rỗi được ban cho thêm nhiều người, hoặc là hoạt động đầy ân huệ của Đức Chúa Trời qua chức vụ sứ đồ.
  rationale: Câu Hy Lạp không buộc phải thu hẹp χάρις vào một cơ chế giáo lý duy nhất; bản dịch giữ nguyên độ mở ấy.
- issue: Quan hệ cú pháp của διὰ τῶν πλειόνων
  choice: Gắn cụm từ với sự gia tăng/lan rộng của ân điển.
  alternative: Gắn với việc lời tạ ơn gia tăng qua nhiều người.
  rationale: Vị trí của cụm từ ngay sau πλεονάσασα thuận lợi cho cách gắn thứ nhất, nhưng tiếng Hy Lạp cho phép nhận thấy mức độ mơ hồ; chú thích bảo lưu cách hiểu khác.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” cho đại từ số nhiều ὑμᾶς nhằm bao gồm cộng đồng tín hữu; dùng “Đức Chúa Trời” theo văn phong Kinh Thánh Tin Lành phổ biến mà không thêm nét giáo phái vào nội dung.
