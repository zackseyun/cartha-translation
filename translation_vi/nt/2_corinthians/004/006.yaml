id: 2CO.4.6
reference: 2 Corinthians 4:6
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὅτι ὁ θεὸς ὁ εἰπών· Ἐκ σκότους φῶς ⸀λάμψει, ὃς ἔλαμψεν ἐν ταῖς καρδίαις ἡμῶν πρὸς φωτισμὸν τῆς γνώσεως τῆς δόξης τοῦ θεοῦ ἐν προσώπῳ ⸀Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/006.yaml
  text: For God[a], who said[c][b], “Light will shine out of darkness,” has shone in our hearts for the illumination of the knowledge of the glory of God in the face of Messiah.
translation:
  language: vi
  text: 'Vì Đức Chúa Trời, Đấng đã phán: “Ánh sáng sẽ chiếu ra từ bóng tối,”[a] đã chiếu sáng trong lòng chúng ta, để soi sáng cho chúng ta nhận biết vinh quang của Đức Chúa Trời trên gương mặt Đấng Mê-si.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Lời này gợi lại Sáng Thế Ký 1:3 và dùng hình ảnh ánh sáng trong công cuộc sáng tạo để nói về việc Đức Chúa Trời bày tỏ chính Ngài trong lòng con người.
    reason: cross_reference
  - marker: b
    text: Cụm từ Hy Lạp cũng có thể hiểu là “nơi chính Đấng Christ.” “Gương mặt Đấng Mê-si” giữ hình ảnh cụ thể về vinh quang được tỏ lộ; Χριστός là tước hiệu, nghĩa là “Đấng Mê-si” hay “Đấng được xức dầu.”
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: Vì
  rationale: Liên từ nêu lý do cho mệnh đề trước; “Vì” giữ rõ quan hệ lập luận và tự nhiên trong tiếng Việt.
- source_word: ὁ θεὸς ὁ εἰπών
  choice: Đức Chúa Trời, Đấng đã phán
  rationale: Chuyển phân từ có mạo từ thành mệnh đề quan hệ trang trọng, rõ nghĩa trong tiếng Việt.
- source_word: Ἐκ σκότους φῶς λάμψει
  choice: Ánh sáng sẽ chiếu ra từ bóng tối
  rationale: Giữ thì tương lai, hướng chuyển động của ἐκ và hình ảnh ánh sáng trong lời gợi nhắc công trình sáng tạo.
- source_word: ὃς ἔλαμψεν ἐν ταῖς καρδίαις ἡμῶν
  choice: cũng đã chiếu sáng trong lòng chúng ta
  rationale: Giữ động từ theo nghĩa nội động và hình ảnh “lòng” chỉ con người bên trong; “cũng” nối chính Đức Chúa Trời đã phán về ánh sáng với Đấng chiếu sáng trong lòng.
- source_word: πρὸς φωτισμὸν τῆς γνώσεως
  choice: để soi sáng cho chúng ta nhận biết
  rationale: Diễn đạt tự nhiên quan hệ mục đích/kết quả của πρὸς và danh từ trừu tượng φωτισμός, đồng thời giữ ý về sự nhận biết thay vì biến γνώσεως thành ánh sáng tự thân.
- source_word: τῆς δόξης τοῦ θεοῦ
  choice: vinh quang của Đức Chúa Trời
  rationale: Bảo toàn chuỗi sở thuộc và thuật ngữ thần học quen thuộc.
- source_word: ἐν προσώπῳ Χριστοῦ
  choice: nơi gương mặt Đấng Mê-si
  rationale: “Gương mặt” giữ hình ảnh cụ thể của πρόσωπον trong văn cảnh ánh sáng và vinh quang; “Đấng Mê-si” thể hiện Χριστός như một tước hiệu.
theological_decisions:
- issue: Cách dịch Χριστοῦ
  choice: Đấng Mê-si
  alternative: Đấng Christ
  rationale: Trong ngữ cảnh này, từ ngữ mang chức năng tước hiệu; dịch nghĩa giúp độc giả nhận ra sắc thái ấy mà không thêm một lập trường hệ phái.
- issue: Ý nghĩa của ἐν προσώπῳ Χριστοῦ
  choice: nơi gương mặt Đấng Mê-si
  alternative: nơi chính Đấng Christ
  rationale: Cách dịch cụ thể giữ sự liên kết giữa ánh sáng, vinh quang và gương mặt; chú thích bảo tồn cách hiểu thành ngữ rộng hơn mà không quyết đoán thay cho nguyên văn.
- issue: Quan hệ của πρὸς φωτισμόν
  choice: để soi sáng cho chúng ta nhận biết
  alternative: nhằm sự soi sáng của sự nhận biết
  rationale: Cách diễn đạt bằng động từ truyền đạt được mục đích hoặc kết quả hướng tới trong nguyên văn, tránh một chuỗi danh từ khó hiểu trong tiếng Việt.
translation_notes:
  register: 'Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Bản dịch ưu tiên tương đương tối ưu: giữ hình ảnh ánh sáng, bóng tối, lòng và gương mặt, đồng thời chuyển chuỗi danh từ Hy Lạp ở πρὸς φωτισμὸν τῆς γνώσεως thành cấu trúc động từ tự nhiên.'
