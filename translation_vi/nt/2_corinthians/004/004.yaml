revisions:
- from: Trong trường hợp của họ, thần của thời đại này đã làm mù tâm trí những người không tin, khiến ánh sáng của Tin Mừng về vinh quang của Đấng Mê-si—Đấng là hình ảnh của Đức Chúa Trời—không chiếu đến họ.[a][b][c]
  to: Đối với họ, thần của thời đại này[b] đã làm mù tâm trí những người không tin, để ánh sáng của Tin Mừng về vinh quang của Đấng Mê-si[c]—Đấng là hình ảnh của Đức Chúa Trời—không chiếu đến họ.[a]
