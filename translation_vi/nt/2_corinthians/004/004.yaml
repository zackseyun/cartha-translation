id: 2CO.4.4
reference: 2 Corinthians 4:4
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐν οἷς ὁ θεὸς τοῦ αἰῶνος τούτου ἐτύφλωσεν τὰ νοήματα τῶν ἀπίστων εἰς τὸ μὴ ⸀αὐγάσαι τὸν φωτισμὸν τοῦ εὐαγγελίου τῆς δόξης τοῦ Χριστοῦ, ὅς ἐστιν εἰκὼν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/004.yaml
  text: In their case[a], the god of this age has blinded the minds of the unbelieving, so that the light of the gospel of the glory of Messiah, who is the image of God[c][b], might not shine on them.
translation:
  language: vi
  text: Đối với họ, thần của thời đại này[b] đã làm mù tâm trí những người không tin, để ánh sáng của Tin Mừng về vinh quang của Đấng Mê-si[c]—Đấng là hình ảnh của Đức Chúa Trời—không chiếu đến họ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “để họ không nhìn thấy ánh sáng của Tin Mừng về vinh quang của Đấng Mê-si.” Động từ Hy Lạp hiếm gặp ở đây có thể nhấn mạnh ánh sáng chiếu ra hoặc việc người ta nhìn thấy ánh sáng ấy.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “thần của thế gian này.” Từ Hy Lạp aiōn thường có nghĩa là “thời đại”, nhấn mạnh kỷ nguyên sa ngã hiện tại.'
    reason: lexical_alternative
  - marker: c
    text: Tiếng Hy Lạp Christos, nghĩa là “Đấng được xức dầu”; ở đây được dịch là “Đấng Mê-si” vì từ này có chức năng như một tước hiệu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν οἷς
  choice: Trong trường hợp của họ
  rationale: Cụm từ quy chiếu về những người đang hư mất và không tin trong văn cảnh trước; cách diễn đạt này tự nhiên trong tiếng Việt và tránh hàm ý cư ngụ huyền nhiệm của nghĩa đen “trong họ”.
- source_word: ὁ θεὸς τοῦ αἰῶνος τούτου
  choice: thần của thời đại này
  rationale: “Thời đại” phản ánh αἰών chính xác hơn “thế gian”, nhấn mạnh kỷ nguyên sa ngã hiện tại; “thần” phân biệt thực thể tiếm quyền này với Đức Chúa Trời chân thật mà không tự ý thay bằng “Sa-tan”.
- source_word: ἐτύφλωσεν τὰ νοήματα
  choice: đã làm mù tâm trí
  rationale: Giữ hình ảnh của động từ và diễn đạt νόημα như năng lực nhận thức, thay vì những ý nghĩ riêng lẻ.
- source_word: τῶν ἀπίστων
  choice: những người không tin
  rationale: Diễn đạt tự nhiên tính từ được danh từ hóa, không thêm sắc thái mạnh hơn như “bất trung”.
- source_word: εἰς τὸ μὴ αὐγάσαι τὸν φωτισμόν
  choice: khiến ánh sáng ... không chiếu đến họ
  rationale: Phản ánh quan hệ mục đích/kết quả và cách hiểu αὐγάζω là ánh sáng chiếu tới; vì động từ hiếm này cũng có thể nói đến việc nhận thấy ánh sáng, cách hiểu kia được giữ trong chú thích.
- source_word: τοῦ εὐαγγελίου τῆς δόξης
  choice: của Tin Mừng về vinh quang
  rationale: Tiếng Việt cần làm rõ quan hệ giữa Tin Mừng và vinh quang; “về” truyền đạt Tin Mừng có nội dung là vinh quang của Đấng Mê-si mà không giản lược thành tính từ “vinh hiển”.
- source_word: τοῦ Χριστοῦ
  choice: của Đấng Mê-si
  rationale: Χριστός tại đây mang chức năng tước hiệu; “Đấng Mê-si” giữ rõ nghĩa “Đấng được xức dầu” và phù hợp văn phong Kinh Thánh hiện đại.
- source_word: ὅς ἐστιν εἰκὼν τοῦ θεοῦ
  choice: Đấng là hình ảnh của Đức Chúa Trời
  rationale: Giữ nguyên lời xác định trực tiếp về Đấng Mê-si và sự cộng hưởng của εἰκών trong tư tưởng Phao-lô, không thêm thuật ngữ tín lý ngoài bản văn.
theological_decisions:
- issue: Chủ thể “thần của thời đại này”
  choice: Giữ nguyên danh xưng “thần của thời đại này”, hiểu là một quyền lực tà ác có tính ngôi vị, theo truyền thống là Sa-tan.
  alternative: Hiểu là một hệ thống thế gian phi ngôi vị, hoặc thay trực tiếp bằng “Sa-tan”.
  rationale: Bản Hy Lạp nói đến một quyền lực tiếm quyền nhưng không nêu tên Sa-tan; bản dịch vì thế không nên diễn giải thay cho nguyên văn.
- issue: Chức năng của αὐγάσαι với φωτισμός
  choice: Ánh sáng của Tin Mừng không chiếu đến những người không tin.
  alternative: Những người không tin không nhìn thấy ánh sáng của Tin Mừng.
  rationale: Cả hai cách đều có cơ sở do αὐγάζω hiếm và cấu trúc có thể được hiểu theo hai hướng; bản chính chọn cách phối hợp tự nhiên với “ánh sáng”, còn chú thích bảo tồn cách kia.
- issue: Ý nghĩa Kitô học của “hình ảnh Đức Chúa Trời”
  choice: Giữ lời khẳng định trực tiếp rằng Đấng Mê-si là hình ảnh của Đức Chúa Trời.
  alternative: Mở rộng bằng ngôn ngữ tín điều về bản thể hoặc địa vị của Đấng Mê-si.
  rationale: Câu có sức nặng Kitô học rõ rệt, nhưng bản dịch chỉ nên nói điều bản Hy Lạp nói, không chèn thuật ngữ tín lý hậu kỳ.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “Tin Mừng”, “Đấng Mê-si” và “Đức Chúa Trời” nhất quán; dấu gạch ngang làm rõ mệnh đề quan hệ dài. Các dấu chú thích đều xuất hiện trong chính văn.
