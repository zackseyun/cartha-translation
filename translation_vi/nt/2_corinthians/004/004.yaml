  source_fidelity: 'Bản dịch truyền đạt đúng các thành tố chính của câu Hy Lạp: quyền lực được gọi là “thần của thời đại này,” hành động làm mù năng lực nhận thức của người không tin, ánh sáng của Tin Mừng về vinh quang của Đấng Mê-si, và mệnh đề “là hình ảnh của Đức Chúa Trời.” Tuy nhiên, “khiến” thiên về kết quả/nhân quả, trong khi εἰς τὸ μὴ diễn tả mục đích (cũng có thể bao hàm kết quả). Đổi thành “để” giữ sát cấu trúc và sắc thái hơn.'
