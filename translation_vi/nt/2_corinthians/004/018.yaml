id: 2CO.4.18
reference: 2 Corinthians 4:18
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: μὴ σκοπούντων ἡμῶν τὰ βλεπόμενα ἀλλὰ τὰ μὴ βλεπόμενα, τὰ γὰρ βλεπόμενα πρόσκαιρα, τὰ δὲ μὴ βλεπόμενα αἰώνια.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/018.yaml
  text: as we look not to the things that are seen but to the things that are not seen. For the things that are seen are temporary[a], but the things that are not seen are eternal.
translation:
  language: vi
  text: Trong khi chúng ta không chú tâm vào những điều thấy được, nhưng vào những điều không thấy được. Vì những điều thấy được là tạm thời[a], còn những điều không thấy được là đời đời.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “những gì thấy được ... những gì không thấy được”; hoặc: “những điều hữu hình ... những điều vô hình”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σκοπούντων
  choice: chú tâm vào
  rationale: Động từ σκοπέω ở đây nói đến việc hướng sự chú ý hay mối quan tâm vào một đối tượng. “Chú tâm vào” tự nhiên trong tiếng Việt và không giới hạn ý nghĩa vào hành động nhìn bằng mắt.
- source_word: τὰ βλεπόμενα
  choice: những điều thấy được
  rationale: Cụm phân từ có mạo từ, giống trung số nhiều, được dùng như danh từ. Cách dịch này giữ nguyên sự song hành cụ thể với τὰ μὴ βλεπόμενα mà không diễn giải thành phạm trù “vật chất”.
- source_word: τὰ μὴ βλεπόμενα
  choice: những điều không thấy được
  rationale: Giữ cấu trúc đối xứng với “những điều thấy được” và bảo tồn sự tương phản giữa thực tại hữu hình và vô hình mà không giải thích quá mức.
- source_word: γὰρ
  choice: Bởi
  rationale: Nêu lý do giải thích cho việc hướng sự chú tâm vào những điều không thấy được; “Bởi” duy trì mạch lập luận và phù hợp văn phong trang trọng.
- source_word: πρόσκαιρα
  choice: chỉ là tạm thời
  rationale: πρόσκαιρος chỉ điều tồn tại trong một thời gian hữu hạn. “Tạm thời” rõ nghĩa; từ “chỉ” làm nổi bật sự tương phản với “đời đời” mà không biến nghĩa thành “chốc lát”.
- source_word: αἰώνια
  choice: đời đời
  rationale: Trong thế đối lập với πρόσκαιρα, từ này chỉ điều tồn tại vĩnh viễn. “Đời đời” là cách nói Kinh Thánh quen thuộc nhưng vẫn dễ hiểu trong tiếng Việt hiện đại.
- source_word: ἡμῶν
  choice: chúng ta
  rationale: Đại từ sở hữu cách làm chủ thể của phân từ; chuyển thành “chúng ta” tạo cú pháp tiếng Việt tự nhiên và nối câu với mệnh đề trước.
theological_decisions:
- issue: Cách diễn đạt sự tương phản giữa điều thấy được và điều không thấy được
  choice: Giữ cách nói cụ thể “những điều thấy được ... những điều không thấy được”.
  alternative: “những điều hữu hình ... những điều vô hình” hoặc “những điều vật chất ... những điều thuộc linh”
  rationale: Phao-lô đối chiếu các thực tại thấy được và không thấy được nhưng không trực tiếp đồng nhất chúng với phạm trù vật chất và thuộc linh. Cách dịch đã chọn giữ nguyên độ mở và sự căng thẳng thần học của nguyên văn.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Câu mở đầu giữ tính phụ thuộc vào văn cảnh của phân từ Hy Lạp bằng “vì”, phù hợp khi câu 18 tiếp nối câu 17. Dùng “chú tâm vào” thay cho lối nói thuần thị giác để diễn đạt phạm vi nghĩa của σκοπέω; vẫn giữ mô-típ thấy/không thấy trong hai đối tượng tương phản. Dấu chú thích [a] được đặt sau toàn bộ cặp tương phản mà chú thích giải thích.
