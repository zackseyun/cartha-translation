revisions:
- from: vì chúng ta không chú tâm vào những điều thấy được, nhưng vào những điều không thấy được. Bởi những điều thấy được chỉ là tạm thời, còn những điều không thấy được là đời đời.[a]
  to: Trong khi chúng ta không chú tâm vào những điều thấy được, nhưng vào những điều không thấy được. Vì những điều thấy được là tạm thời[a], còn những điều không thấy được là đời đời.
  rationale: Sửa liên từ đầu câu để phản ánh đúng sắc thái hoàn cảnh của phân từ Hy Lạp và tránh biến mệnh đề này thành lý do. Thay “Bởi” bằng “Vì” cho tự nhiên hơn. Lược “chỉ là” vì πρόσκαιρα tự nó có nghĩa “tạm thời”; sự đối lập đã được biểu đạt đầy đủ bằng “còn ... đời đời”. Chuyển neo chú thích đến “tạm thời”, phù hợp vị trí trong dấu vết kiểm toán tiếng Anh, trong khi nội dung chú thích vẫn áp dụng cho toàn bộ cặp đối lập.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T19:25:34Z'
review_pass:
