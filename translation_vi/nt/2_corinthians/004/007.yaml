reference: 2 Corinthians 4:7
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἔχομεν δὲ τὸν θησαυρὸν τοῦτον ἐν ὀστρακίνοις σκεύεσιν, ἵνα ἡ ὑπερβολὴ τῆς δυνάμεως ᾖ τοῦ θεοῦ καὶ μὴ ἐξ ἡμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/007.yaml
  text: But we have this treasure in clay jars[b][a], so that the surpassing greatness of the power may be of God and not from us.
translation:
  language: vi
  text: Nhưng chúng ta có kho báu này trong những bình bằng đất[a], để quyền năng vô cùng lớn lao là từ Đức Chúa Trời, chứ không phải từ chúng ta[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “trong những đồ đựng bằng đất nung.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “để sự vượt trội của quyền năng là từ Đức Chúa Trời” hoặc “để quyền năng vượt trội là từ Đức Chúa Trời.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔχομεν δὲ
  choice: Nhưng chúng ta có
  rationale: Động từ hiện tại diễn tả sự sở hữu; δὲ mang sắc thái chuyển ý tương phản với câu trước nên dịch tự nhiên là “Nhưng”.
- source_word: τὸν θησαυρὸν τοῦτον
  choice: kho báu này
  rationale: Giữ nguyên hình ảnh “kho báu” và đại từ chỉ định hồi chỉ về ánh sáng/sứ điệp trong văn cảnh, không diễn giải thêm.
- source_word: ἐν ὀστρακίνοις σκεύεσιν
  choice: trong những bình bằng đất
  rationale: ὀστράκινος chỉ vật làm bằng đất nung, còn σκεῦος là vật chứa; cách dịch này vừa tự nhiên vừa giữ hình ảnh về sự bình thường và dễ vỡ.
- source_word: ἵνα
  choice: để
  rationale: Diễn đạt tự nhiên sắc thái mục đích, đồng thời vẫn có thể bao hàm kết quả trong văn mạch.
- source_word: ἡ ὑπερβολὴ τῆς δυνάμεως
  choice: quyền năng phi thường ấy
  rationale: ὑπερβολή diễn tả mức độ vượt trội, khác thường. Tiếng Việt tự nhiên hơn khi dùng tính từ “phi thường” thay vì giữ cấu trúc danh từ trừu tượng cứng nhắc.
- source_word: ᾖ τοῦ θεοῦ καὶ μὴ ἐξ ἡμῶν
  choice: được biết là đến từ Đức Chúa Trời chứ không phải từ chúng ta
  rationale: Trong cấu trúc đối lập với ἐξ ἡμῶν (“từ chúng ta”), sở hữu cách τοῦ θεοῦ biểu thị quyền năng thuộc về hoặc có nguồn từ Đức Chúa Trời. “Được biết là” làm rõ hàm ý biểu lộ của mệnh đề mục đích mà không đổi chủ thể của quyền năng.
theological_decisions:
- issue: Bản chất của ẩn dụ “kho báu” và “bình bằng đất”
  choice: Giữ nguyên ẩn dụ, không giải thích “kho báu” là Tin Lành hoặc “bình” là thân thể/sự yếu đuối của con người trong chính văn.
  alternative: Diễn giải thành “kho báu Tin Lành” hoặc “trong thân thể yếu đuối của chúng ta”.
  rationale: Văn cảnh giúp người đọc hiểu ẩn dụ, nhưng chính câu này không nêu rõ các đối tượng tương ứng; diễn giải ngay trong bản dịch sẽ thu hẹp sự phong phú và tính mở có chủ ý của hình ảnh.
- issue: Sắc thái của mệnh đề ἵνα
  choice: Dịch bằng “để”, giữ sắc thái mục đích có thể bao hàm kết quả.
  alternative: 'Dịch thuần kết quả: “vì thế ... được biết là”.'
  rationale: ἵνα có thể nghiêng về kết quả trong lối viết của Phao-lô, nhưng sắc thái mục đích vẫn hợp lý và không nên bị loại bỏ.
- issue: Quan hệ của quyền năng với Đức Chúa Trời
  choice: Diễn đạt rằng quyền năng “đến từ Đức Chúa Trời chứ không phải từ chúng ta”.
  alternative: Dịch sát hình thức là “thuộc về Đức Chúa Trời” hoặc “là của Đức Chúa Trời”.
  rationale: Cụm đối lập ἐξ ἡμῶν nêu rõ nguồn phát sinh; “đến từ” làm sáng tỏ sự tương phản ấy trong tiếng Việt mà không gán thêm một cách thức hoạt động cụ thể.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. “Bình bằng đất” giữ hình ảnh cụ thể, gần gũi; “quyền năng phi thường” tránh cấu trúc Hán-Việt nặng nề nhưng vẫn giữ sắc thái vượt trội của nguyên văn. Danh xưng “Đức Chúa Trời” phù hợp văn phong Kinh Thánh Tin Lành tiếng Việt mà không thêm diễn giải giáo phái.
