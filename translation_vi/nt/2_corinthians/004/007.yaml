  source_fidelity: Bản dịch giữ đúng hình ảnh “kho báu” trong các vật chứa bằng đất và sắc thái mục đích của ἵνα. Tuy nhiên, cụm “được biết là” thêm ý về sự nhận biết/biểu lộ mà nguyên văn không nói rõ; ᾖ chỉ nêu rằng quyền năng vượt trội là/thuộc về Đức Chúa Trời, đối lập với nguồn từ chúng ta. Từ “ấy” sau “quyền năng phi thường” cũng không có điểm quy chiếu trực tiếp trong nguyên văn.
  naturalness: “Nhưng chúng ta có kho báu này trong những bình bằng đất” là tiếng Việt hiện đại, tự nhiên và giữ được hình ảnh nguyên văn. Câu sau tự nhiên hơn khi bỏ bị động diễn giải “được biết là” và diễn đạt trực tiếp nguồn của quyền năng.
