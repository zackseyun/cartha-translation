id: 2CO.4.16
reference: 2 Corinthians 4:16
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Διὸ οὐκ ⸀ἐγκακοῦμεν, ἀλλ’ εἰ καὶ ὁ ἔξω ἡμῶν ἄνθρωπος διαφθείρεται, ἀλλ’ ὁ ⸂ἔσω ἡμῶν⸃ ἀνακαινοῦται ἡμέρᾳ καὶ ἡμέρᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/016.yaml
  text: Therefore we do not lose heart. But even if our outer man is wasting away[a], yet our inner man is being renewed day by day.
translation:
  language: vi
  text: Vì vậy, chúng tôi không nản lòng. Nhưng dù con người bên ngoài của chúng tôi đang hao mòn, thì con người bên trong của chúng tôi vẫn đang được đổi mới từng ngày.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn dùng “con người bên ngoài” và “con người bên trong” theo nghĩa đại diện, tạo nên sự tương phản có chủ ý giữa phương diện bên ngoài và bên trong của đời sống con người.
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὸ
  choice: Vì vậy
  rationale: Diễn tả kết luận suy ra từ lập luận ngay trước đó, tự nhiên và trang trọng trong tiếng Việt hiện đại.
- source_word: οὐκ ἐγκακοῦμεν
  choice: chúng tôi không nản lòng
  rationale: Truyền đạt thành ngữ chỉ việc không mất can đảm hoặc nhụt chí; phù hợp với cách dùng của Phao-lô.
- source_word: ἀλλ’ εἰ καὶ
  choice: Nhưng dù
  rationale: Giữ sắc thái nhượng bộ và sự chuyển ý đối lập của cấu trúc Hy Lạp.
- source_word: ὁ ἔξω ἡμῶν ἄνθρωπος
  choice: con người bên ngoài của chúng tôi
  rationale: Giữ danh từ số ít mang nghĩa đại diện và duy trì sự đối xứng có chủ ý với “con người bên trong”, nhưng tránh cách nói mang dấu ấn giới tính không cần thiết trong tiếng Việt.
- source_word: διαφθείρεται
  choice: đang bị hủy hoại
  rationale: Thể hiện tiến trình đang tiếp diễn và dạng bị động; “hủy hoại” giữ được độ mạnh của động từ, không thu hẹp nghĩa chỉ còn sự già yếu thể chất.
- source_word: ἀλλ’
  choice: thì ... vẫn
  rationale: Cấu trúc tương liên tự nhiên trong tiếng Việt, làm nổi bật sự tương phản với mệnh đề nhượng bộ đứng trước.
- source_word: ὁ ἔσω ἡμῶν
  choice: con người bên trong của chúng tôi
  rationale: Bổ sung danh từ được tỉnh lược từ vế trước để câu tiếng Việt rõ nghĩa, đồng thời giữ nguyên cặp đối xứng “bên ngoài/bên trong”.
- source_word: ἀνακαινοῦται
  choice: vẫn đang được đổi mới
  rationale: Giữ dạng bị động và tiến trình liên tục; “vẫn” biểu thị sự tương phản bền bỉ bất chấp sự hủy hoại bên ngoài.
- source_word: ἡμέρᾳ καὶ ἡμέρᾳ
  choice: từng ngày
  rationale: Là cách diễn đạt phân phối tự nhiên trong tiếng Việt, chỉ sự đổi mới liên tục mỗi ngày.
theological_decisions:
- issue: Sự tương phản nhân học giữa ὁ ἔξω ἄνθρωπος và ὁ ἔσω
  choice: con người bên ngoài / con người bên trong
  alternative: bản ngã bên ngoài / bản ngã bên trong; con người bề ngoài / con người bề trong
  rationale: Cách dịch giữ nguyên hình ảnh và sự đối xứng của nguyên văn mà không biến câu này thành một khẳng định kỹ thuật về thuyết nhị nguyên thân xác–linh hồn. Ngữ cảnh gợi đến sự suy tàn hữu hình và sự đổi mới nội tại, nhưng bản dịch không xác định chi tiết hơn điều câu văn nói.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Cấu trúc “dù ... thì ... vẫn” tái hiện rõ quan hệ nhượng bộ–tương phản; việc lặp “của chúng tôi” bảo toàn phạm vi của đại từ Hy Lạp và sự cân xứng giữa hai vế.
