reference: 2 Corinthians 4:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὥστε ⸀ὁ θάνατος ἐν ἡμῖν ἐνεργεῖται, ἡ δὲ ζωὴ ἐν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/012.yaml
  text: So then[a], death is at work in us, but life in you.
translation:
  language: vi
  text: Vì thế[a], sự chết đang tác động trong chúng tôi, còn sự sống trong anh chị em.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “Do đó, sự chết đang hoạt động trong chúng tôi, còn sự sống trong anh chị em.”'
    reason: Nêu cách chuyển dịch khác cho sắc thái kết luận của ὥστε và cho ἐνεργεῖται (“đang hoạt động/đang tác động”).
lexical_decisions:
- source_word: ὥστε
  choice: Vì thế
  rationale: Trong mạch văn, ὥστε nêu kết quả hoặc kết luận rút ra từ những điều ở các câu trước. “Vì thế” tự nhiên trong tiếng Việt và giữ được sắc thái suy luận.
- source_word: ὁ θάνατος
  choice: sự chết
  rationale: Danh từ trừu tượng có mạo từ chỉ sự chết như một thực tại đang tác động qua những đau khổ của các sứ đồ; “sự chết” vừa sát nguyên văn vừa không giới hạn ý nghĩa vào một biến cố chết cụ thể.
- source_word: ἐν ἡμῖν
  choice: trong chúng tôi
  rationale: “Trong chúng tôi” giữ quan hệ trực tiếp của ἐν với đại từ số nhiều và sự đối chiếu giữa nhóm phục vụ của Phao-lô với các tín hữu Cô-rinh-tô.
- source_word: ἐνεργεῖται
  choice: đang hành động
  rationale: Động từ diễn tả một thực tại đang phát huy tác dụng. “Đang hành động” giữ được tính tiếp diễn và chủ động của ý câu mà vẫn tự nhiên, trang trọng.
- source_word: ἡ δὲ ζωὴ
  choice: còn sự sống
  rationale: δέ đánh dấu sự tương phản. “Còn” tạo thế đối xứng gọn và tự nhiên giữa sự chết nơi các sứ đồ với sự sống nơi người nhận chức vụ.
- source_word: ἐν ὑμῖν
  choice: trong anh chị em
  rationale: Cách dịch này song song với “trong chúng tôi,” đồng thời dùng đại từ số nhiều hiện đại, bao gồm cả cộng đồng nam và nữ, và để ngỏ cả sắc thái cá nhân lẫn cộng đồng.
theological_decisions:
- issue: Ý nghĩa của sự tương phản giữa sự chết và sự sống
  choice: Giữ nguyên hai từ “sự chết” và “sự sống,” để câu nói bao hàm đau khổ mang dấu sự chết của Chúa Giê-su nơi các sứ đồ và sự sống được truyền đạt cho người Cô-rinh-tô qua chức vụ ấy.
  alternative: Diễn giải thuần túy là cái chết thể chất đối lập với sự bảo toàn thể chất, hoặc thuần túy là chết đối với bản thân đối lập với sự sống đời đời.
  rationale: Ngữ cảnh gần nói đến sự chết và sự sống của Chúa Giê-su được bày tỏ trong thân thể các sứ đồ, còn lập luận rộng hơn nói về chức vụ đem sự sống đến cho người khác. Bản dịch không nên thu hẹp sức căng thần học này.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Câu giữ cấu trúc đối xứng ngắn gọn của nguyên văn; “anh chị em” diễn đạt đại từ số nhiều ὑμῖν theo cách tự nhiên và bao quát.
