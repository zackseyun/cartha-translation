  yaml_path: translation/nt/2_corinthians/004/008.yaml
  text: We are afflicted in every way[a], but not crushed; perplexed[c][b], but not driven to despair.
translation:
  language: vi
  text: Chúng tôi bị dồn ép đủ bề[a], nhưng không bị dồn vào bước đường cùng[b]; bối rối, nhưng không hoàn toàn bế tắc[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “trong mọi sự.” Cụm từ này nói đến phạm vi toàn diện, không nhất thiết là bị vây quanh theo nghĩa không gian.'
    reason: lexical_alternative
  - marker: b
    text: 'Theo nghĩa sát: “không bị ép vào chỗ chật hẹp”; tức không bị dồn đến mức không còn lối thoát.'
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “không tuyệt vọng” hoặc “không hoàn toàn mất phương hướng.” Động từ Hy Lạp ở đây tăng cường ý của từ được dịch là “bối rối.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν παντί
  choice: đủ đường
  rationale: Cụm này chỉ phạm vi toàn diện của cảnh áp bức, không nhất thiết mang nghĩa không gian theo nghĩa đen. “Đủ đường” tự nhiên trong tiếng Việt và phù hợp với sắc thái chỉ phương diện/cách thức.
- source_word: θλιβόμενοι
  choice: bị áp bức
  rationale: Động từ θλίβω diễn tả việc phải chịu sức ép hoặc hoạn nạn. “Bị áp bức” giữ được hình ảnh chịu áp lực từ bên ngoài và tạo thế đối lập rõ với vế sau.
- source_word: στενοχωρούμενοι
  choice: bị dồn vào đường cùng
  rationale: Từ này gợi hình ảnh bị ép vào chỗ chật hẹp, tức bị vây hãm đến mức không còn lối thoát. Cách dịch này vừa tự nhiên vừa giữ được ẩn dụ không gian của tiếng Hy Lạp.
- source_word: ἀπορούμενοι
  choice: bối rối
  rationale: Từ này chỉ tình trạng phân vân, lúng túng hoặc không biết phải làm gì. “Bối rối” ngắn gọn, phổ thông và không diễn đạt quá mức.
- source_word: ἐξαπορούμενοι
  choice: hoàn toàn bế tắc
  rationale: Động từ ghép tăng cường ý của ἀπορέω, diễn tả tình trạng hết đường xoay xở hoặc mất hết lối thoát. “Hoàn toàn bế tắc” bảo toàn sự tăng cấp so với “bối rối” mà không nhất thiết thu hẹp nghĩa vào cảm xúc tuyệt vọng.
- source_word: ἀλλ’ οὐ ... ἀλλ’ οὐκ
  choice: nhưng không ... nhưng không
  rationale: Giữ nguyên cấu trúc đối lập lặp lại và nhịp cân xứng trong câu của Phao-lô.
theological_decisions:
- issue: Mức độ tăng cường trong cặp ἀπορούμενοι / ἐξαπορούμενοι
  choice: “bối rối, nhưng không hoàn toàn bế tắc”
  alternative: “bối rối, nhưng không tuyệt vọng”
  rationale: “Hoàn toàn bế tắc” phản ánh trực tiếp sự tăng cường về mức độ trong tiếng Hy Lạp và giữ ngỏ cả sắc thái không còn cách xoay xở lẫn nguy cơ tuyệt vọng, thay vì biến câu này thành một khẳng định chuyên biệt về trạng thái tâm lý hay đức tin.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Hai cặp đối lập được giữ cân xứng; dấu chấm phẩy làm rõ nhịp tu từ. Cách diễn đạt tránh thuật ngữ giáo phái và không giải quyết quá mức độ mở nghĩa giữa sự bế tắc thực tế với tuyệt vọng tâm lý.
