revisions:
- from: Nhưng ngay cả nếu Tin Lành chúng tôi rao giảng bị che phủ, thì cũng chỉ bị che phủ giữa những người đang hư mất.[a]
  to: Nhưng ngay cả nếu Tin Lành của chúng tôi bị che phủ, thì nó bị che phủ giữa những người đang hư mất.[a]
  rationale: Bỏ “chỉ” để loại bỏ ý giới hạn không có trong tiếng Hy Lạp; thay “chúng tôi rao giảng” bằng “của chúng tôi” để phản ánh trực tiếp ἡμῶν mà không thêm nội dung. Chú thích giữ phương án “đối với,” vốn có thể diễn đạt quan hệ của ἐν trong ngữ cảnh này, đồng thời giữ “đang hư mất” trong bản văn chính để phản ánh phân từ hiện tại.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T19:25:19Z'
