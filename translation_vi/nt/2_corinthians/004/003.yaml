  text: εἰ δὲ καὶ ἔστιν κεκαλυμμένον τὸ εὐαγγέλιον ἡμῶν, ἐν τοῖς ἀπολλυμένοις ἐστὶν κεκαλυμμένον,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/003.yaml
  text: And even if our gospel is veiled[a], it is veiled among those who are perishing,
translation:
  language: vi
  text: Nhưng ngay cả nếu Tin Lành của chúng tôi bị che phủ, thì nó bị che phủ giữa những người đang hư mất.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đối với những người đang hư mất” hoặc “giữa những người hư mất.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ καὶ
  choice: Nhưng ngay cả nếu
  rationale: Diễn đạt tự nhiên sắc thái điều kiện–nhượng bộ; “nhưng” giữ vai trò nối tiếp/đối lập của δέ, còn “ngay cả” thể hiện sức nhấn của καί.
- source_word: κεκαλυμμένον
  choice: bị che phủ
  rationale: Giữ thể hoàn thành bị động và hình ảnh tấm màn xuyên suốt ngữ cảnh 3:14–16; 4:4, thay vì làm phẳng thành “bị giấu kín”.
- source_word: τὸ εὐαγγέλιον ἡμῶν
  choice: Tin Lành chúng tôi rao giảng
  rationale: “Tin Lành” là cách gọi quen thuộc của εὐαγγέλιον; thêm “rao giảng” làm rõ tự nhiên quan hệ của đại từ sở hữu ἡμῶν mà không ngụ ý Tin Lành có nguồn gốc từ các sứ đồ.
- source_word: ἐν τοῖς ἀπολλυμένοις
  choice: giữa những người đang hư mất
  rationale: “Giữa” phản ánh ἐν theo nghĩa phạm vi/nhóm người, còn “đang hư mất” giữ sắc thái tiến trình hoặc tình trạng đang diễn ra của phân từ hiện tại ἀπολλυμένοις.
- source_word: ἐστὶν κεκαλυμμένον
  choice: thì cũng chỉ bị che phủ
  rationale: Lặp lại vị ngữ như nguyên văn để giữ sự nhấn mạnh. “Cũng chỉ” làm rõ cấu trúc giới hạn theo nhóm trong tiếng Việt, nhưng không biến động từ thành ý “vẫn còn bị che phủ”.
theological_decisions:
- issue: Bản chất của ἀπολλυμένοις trong ngữ cảnh cứu rỗi của Phao-lô
  choice: những người đang hư mất
  alternative: những người bị hư mất; những người lạc mất
  rationale: Cách dịch này giữ tình trạng/tiến trình đang diễn ra của phân từ, đồng thời không biến từ ngữ thành một nhãn tĩnh hay giải quyết trước sự căng thẳng thần học trong câu.
- issue: Quan hệ được biểu thị bởi ἐν với nhóm người đang hư mất
  choice: giữa những người đang hư mất
  alternative: đối với những người đang hư mất
  rationale: “Giữa” ưu tiên nghĩa phạm vi của ἐν, nhưng “đối với” vẫn có thể phù hợp theo nghĩa liên hệ; sự khác biệt được bảo lưu trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Viết hoa “Tin Lành” theo cách dùng phổ biến trong tiếng Việt Cơ Đốc; cụm “chúng tôi rao giảng” tránh sắc thái sở hữu độc quyền có thể phát sinh từ bản dịch quá sát “Tin Lành của chúng tôi.”
