id: 2CO.4.10
reference: 2 Corinthians 4:10
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: πάντοτε τὴν νέκρωσιν ⸀τοῦ Ἰησοῦ ἐν τῷ σώματι περιφέροντες, ἵνα καὶ ἡ ζωὴ τοῦ Ἰησοῦ ἐν τῷ σώματι ἡμῶν φανερωθῇ·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/010.yaml
  text: always carrying in the body the death of Jesus[a], so that the life of Jesus may also be revealed in our body.
translation:
  language: vi
  text: luôn mang sự chết của Đức Giê-su trong thân thể[a], để sự sống của Đức Giê-su cũng được bày tỏ trong thân thể chúng tôi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “sự chịu chết của Đức Giê-su.” Danh từ Hy Lạp có thể nhấn mạnh tình trạng hoặc kinh nghiệm chịu chết được mang trong thân thể.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντοτε
  choice: luôn
  rationale: Diễn đạt tự nhiên và cô đọng hoàn cảnh liên tục của hành động.
- source_word: νέκρωσιν
  choice: sự chết
  rationale: Giữ nghĩa về tình trạng hoặc kinh nghiệm chết, đồng thời duy trì thế đối xứng với “sự sống”; chú thích bảo lưu khả năng hiểu là tiến trình chịu chết.
- source_word: τοῦ Ἰησοῦ
  choice: của Đức Giê-su
  rationale: Giữ nguyên cấu trúc sở hữu rộng của nguyên văn, không xác định quá mức quan hệ của sở hữu cách.
- source_word: ἐν τῷ σώματι
  choice: trong thân thể
  rationale: Lần xuất hiện thứ nhất không có đại từ sở hữu; bản dịch không tự ý thêm “chúng tôi”.
- source_word: περιφέροντες
  choice: mang
  rationale: Phân từ hiện tại diễn tả việc liên tục mang nơi thân thể; “mang” tự nhiên và giữ được hình ảnh của nguyên văn.
- source_word: ἵνα
  choice: để
  rationale: Diễn đạt quan hệ mục đích hoặc kết quả một cách tự nhiên, không ép phải chọn riêng một sắc thái.
- source_word: καὶ
  choice: cũng
  rationale: Giữ sự tương ứng giữa sự chết và sự sống của Đức Giê-su.
- source_word: ζωὴ
  choice: sự sống
  rationale: Cách dịch trực tiếp, phù hợp với sự sống của Đức Giê-su được biểu lộ.
- source_word: ἐν τῷ σώματι ἡμῶν
  choice: trong thân thể chúng tôi
  rationale: Giữ danh từ số ít đi với đại từ số nhiều như nguyên văn, bảo tồn sắc thái tập thể trong chức vụ của các sứ đồ.
- source_word: φανερωθῇ
  choice: được bày tỏ
  rationale: Giữ thể bị động và diễn đạt rõ ý trở nên hiển hiện, có thể nhận thấy.
theological_decisions:
- issue: Ý nghĩa của νέκρωσις khi liên hệ với Đức Giê-su
  choice: sự chết của Đức Giê-su
  alternative: sự chịu chết của Đức Giê-su
  rationale: “Sự chết” phù hợp với nghĩa từ vựng và tạo thế song song với “sự sống”; phương án khác được ghi ở chú thích để bảo lưu sắc thái về kinh nghiệm hoặc tiến trình chịu chết.
- issue: Số của σώμα
  choice: 'Giữ số ít: “thân thể” ở cả hai vế'
  alternative: Dịch vế sau là “thân thể của mỗi người chúng tôi” hoặc “các thân thể chúng tôi”
  rationale: Nguyên văn dùng số ít ở cả hai chỗ. Giữ số ít bảo tồn cấu trúc tu từ và sắc thái tập thể, không diễn giải thêm.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Giê-su” theo lối gọi tôn kính tự nhiên trong tiếng Việt; giữ “thân thể” số ít và phân biệt việc vế đầu không có đại từ sở hữu còn vế sau có “chúng tôi”.
