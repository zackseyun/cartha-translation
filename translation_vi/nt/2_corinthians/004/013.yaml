- from: 'Nhưng vì có cùng một tinh thần đức tin[a], theo như lời đã chép: “Tôi đã tin, nên tôi đã nói,” thì chúng tôi cũng tin, nên chúng tôi cũng nói[b].'
  to: 'Nhưng chúng tôi có cùng một tinh thần đức tin[a], theo lời đã chép: “Tôi đã tin, nên tôi đã nói”; chúng tôi cũng tin, nên chúng tôi cũng nói[b].'
  rationale: Bản sửa loại bỏ liên từ “vì” để không diễn giải quá mức chức năng của phân từ ἔχοντες, đồng thời làm gọn công thức dẫn trích dẫn. Dấu chấm phẩy phân định lời trích với lời áp dụng của Phao-lô và giữ rõ nhịp song hành của nguyên văn. Không thay đổi ý nghĩa hay các chú thích.
