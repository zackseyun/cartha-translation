source:
  edition: SBLGNT
  text: Ἔχοντες δὲ τὸ αὐτὸ πνεῦμα τῆς πίστεως, κατὰ τὸ γεγραμμένον· Ἐπίστευσα, διὸ ἐλάλησα, καὶ ἡμεῖς πιστεύομεν, διὸ καὶ λαλοῦμεν,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/013.yaml
  text: But having the same spirit of faith[a], according to what is written, “I believed; therefore I spoke,” we also believe; therefore we also speak[b],
translation:
  language: vi
  text: 'Nhưng chúng tôi có cùng một tinh thần đức tin[a], theo lời đã chép: “Tôi đã tin, nên tôi đã nói”; chúng tôi cũng tin, nên chúng tôi cũng nói[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể hiểu là “cùng một Thần Linh của đức tin,” nếu πνεῦμα ở đây chỉ Đức Thánh Linh chứ không phải một tinh thần hay tâm thế chung đầy đức tin.
    reason: alternative_reading
  - marker: b
    text: Phao-lô trích Thi Thiên 116:10 (theo cách đánh số của Bản Bảy Mươi là 115:1), qua đó nối đức tin và lời nói của mình với lời chứng của tác giả Thi Thiên.
    reason: cross_reference
lexical_decisions:
- source_word: Ἔχοντες δὲ
  choice: Nhưng vì có
  rationale: Phân từ hiện tại nối với mệnh đề chính và trong tiếng Việt tự nhiên mang sắc thái căn nguyên; “nhưng” giữ bước chuyển tương phản nhẹ của δέ.
- source_word: τὸ αὐτὸ πνεῦμα τῆς πίστεως
  choice: cùng một tinh thần đức tin
  rationale: “Tinh thần” diễn đạt tự nhiên một tâm thế hay động lực chung được đặc trưng bởi đức tin, đồng thời chú thích giữ khả năng πνεῦμα chỉ Đức Thánh Linh.
- source_word: κατὰ τὸ γεγραμμένον
  choice: theo như lời đã chép
  rationale: Giữ công thức dẫn Kinh Thánh, với lối diễn đạt trang trọng nhưng quen thuộc trong tiếng Việt.
- source_word: Ἐπίστευσα, διὸ ἐλάλησα
  choice: Tôi đã tin, nên tôi đã nói
  rationale: Thể quá khứ của lời trích được thể hiện bằng “đã”; “nên” truyền đạt quan hệ kết quả của διό một cách tự nhiên.
- source_word: καὶ ἡμεῖς πιστεύομεν
  choice: thì chúng tôi cũng tin
  rationale: “Cũng” giữ sự tương ứng được nhấn mạnh giữa Phao-lô và người nói trong Thi Thiên; “thì” giúp câu tiếng Việt nối tự nhiên với mệnh đề đầu.
- source_word: διὸ καὶ λαλοῦμεν
  choice: nên chúng tôi cũng nói
  rationale: Giữ sự song hành tin–nói và ý kết quả của διό.
theological_decisions:
- issue: πνεῦμα chỉ Đức Thánh Linh hay tinh thần/tâm thế chung của đức tin
  choice: tinh thần đức tin
  alternative: Thần Linh của đức tin, hiểu là Đức Thánh Linh
  rationale: Ngữ cảnh và lời trích “tôi đã tin, nên tôi đã nói” nghiêng về một tinh thần hay tâm thế đầy đức tin. Tuy nhiên, nguyên ngữ không loại trừ việc chỉ Đức Thánh Linh, nên khả năng ấy được bảo tồn trong chú thích.
- issue: Cách dịch nhóm từ πιστ-
  choice: đức tin / tin
  alternative: lòng tin / tin cậy
  rationale: “Đức tin” và “tin” vừa tự nhiên vừa duy trì mối liên hệ từ vựng giữa πίστις và πιστεύω mà không thêm đối tượng không được nêu trong câu.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng vừa phải và dễ hiểu. Cấu trúc song hành “đã tin… đã nói / cũng tin… cũng nói” được giữ để phản ánh nhịp lập luận của nguyên văn.
