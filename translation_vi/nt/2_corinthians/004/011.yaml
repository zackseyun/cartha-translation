id: 2CO.4.11
reference: 2 Corinthians 4:11
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀεὶ γὰρ ἡμεῖς οἱ ζῶντες εἰς θάνατον παραδιδόμεθα διὰ Ἰησοῦν, ἵνα καὶ ἡ ζωὴ τοῦ Ἰησοῦ φανερωθῇ ἐν τῇ θνητῇ σαρκὶ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/011.yaml
  text: For we who are living are always being handed over to death for Jesus’ sake[b][a], so that the life of Jesus also may be revealed in our mortal flesh.
translation:
  language: vi
  text: Vì chúng tôi, là những người đang sống, luôn bị nộp vào chỗ chết vì cớ Giê-su[a], để sự sống của Giê-su cũng được bày tỏ trong thân xác phải chết của chúng tôi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “vì Giê-su” hoặc “do Giê-su.”'
    reason: lexical_alternative
  - marker: b
    text: “Thân xác” ở đây chỉ sự hiện hữu thân thể hữu tử, không phải “bản tính tội lỗi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀεὶ
  choice: luôn
  rationale: Diễn tả hoàn cảnh liên tục hoặc lặp đi lặp lại; “luôn” trực tiếp, tự nhiên và phù hợp với thì hiện tại của động từ.
- source_word: γὰρ
  choice: Vì
  rationale: Nối câu này với câu trước như một lời giải thích, không thêm cách diễn giải ngoài văn bản.
- source_word: ἡμεῖς οἱ ζῶντες
  choice: chúng tôi là những người đang sống
  rationale: Giữ đại từ ngôi thứ nhất số nhiều và sắc thái tiếp diễn của phân từ hiện tại, đồng thời làm nổi bật sự tương phản với “cái chết”.
- source_word: εἰς θάνατον παραδιδόμεθα
  choice: bị nộp cho cái chết
  rationale: Giữ thể bị động và ý hướng đến việc đối diện cái chết; “bị nộp” cũng bảo tồn âm hưởng bị trao vào tay quyền lực thù nghịch.
- source_word: διὰ Ἰησοῦν
  choice: vì Chúa Giê-su
  rationale: διά với đối cách chủ yếu chỉ nguyên nhân; cách dịch này giữ được sự hàm nghĩa rằng việc chịu khổ xảy ra vì mối liên hệ với Chúa Giê-su, trong khi chú thích bảo tồn các sắc thái khả dĩ khác.
- source_word: ἵνα
  choice: để
  rationale: Diễn đạt tự nhiên quan hệ mục đích hoặc kết quả mà không buộc phải phân định dứt khoát giữa hai sắc thái.
- source_word: καὶ
  choice: cũng
  rationale: Giữ sự tương ứng với vế trước và nhấn mạnh rằng sự sống của Chúa Giê-su cũng được bày tỏ giữa hoàn cảnh chết chóc.
- source_word: ἡ ζωὴ τοῦ Ἰησοῦ
  choice: sự sống của Chúa Giê-su
  rationale: Giữ cấu trúc sở hữu của nguyên văn và sự đối lập thần học giữa “sự sống” với “cái chết”.
- source_word: φανερωθῇ
  choice: được bày tỏ
  rationale: Giữ thể bị động và không thêm tác nhân; “được bày tỏ” trang trọng nhưng vẫn dễ hiểu trong tiếng Việt hiện đại.
- source_word: ἐν τῇ θνητῇ σαρκὶ ἡμῶν
  choice: trong thân xác phải chết của chúng tôi
  rationale: Trong ngữ cảnh này, σάρξ chỉ sự hiện hữu thân thể mong manh và hữu tử, không phải bản tính tội lỗi. “Thân xác” tự nhiên hơn “xác thịt” trong tiếng Việt và tránh hàm nghĩa đạo đức sai lệch; “phải chết” diễn đạt rõ θνητός.
theological_decisions:
- issue: Ý nghĩa của σάρξ trong ngữ cảnh thư Phao-lô
  choice: thân xác
  alternative: xác thịt; bản tính tội lỗi
  rationale: Cụm “thân xác phải chết” nói đến đời sống thể chất hữu tử và dễ bị tổn thương của các sứ đồ. Dịch là “bản tính tội lỗi” sẽ đưa vào một ý nghĩa đạo đức không có trong ngữ cảnh; “thân xác” giữ đúng nghĩa thân thể bằng tiếng Việt tự nhiên.
- issue: Sắc thái của διὰ Ἰησοῦν
  choice: vì Chúa Giê-su
  alternative: vì cớ Chúa Giê-su; bởi Chúa Giê-su
  rationale: Cấu trúc διά với đối cách có thể chỉ nguyên nhân hoặc lý do. “Vì Chúa Giê-su” bảo tồn độ rộng này tốt hơn cách dịch khẳng định Chúa Giê-su là tác nhân trực tiếp, còn chú thích nêu các cách hiểu gần nghĩa.
- issue: Quan hệ do ἵνα biểu thị
  choice: để
  alternative: hầu cho; đến nỗi
  rationale: “Để” có thể chuyên chở cả sắc thái mục đích lẫn kết quả trong câu này, nhờ đó không âm thầm giải quyết sự căng thẳng có thật của cấu trúc Hy Lạp.
translation_notes:
  register: Bản dịch dùng tiếng Việt chuẩn hiện đại, trang trọng vừa phải và dễ hiểu. “Chúng tôi” phù hợp với lời tự chỉ của Phao-lô và các cộng sự. Trật tự câu giữ mạch giải thích, sự tương phản sống–chết và thể bị động của nguyên văn; các dấu chú thích đều xuất hiện trong chính văn.
