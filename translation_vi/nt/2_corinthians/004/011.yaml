    reason: lexical_alternative
  revision_rationale: Bản sửa bỏ tước hiệu không có trong nguồn, làm câu mở đầu tự nhiên hơn, và điều chỉnh chú thích để không gán sai nghĩa tác nhân cho cụm διά + đối cách. “Bị nộp vào chỗ chết” giữ thể bị động và hướng đến cái chết của εἰς θάνατον, còn “thân xác phải chết” bảo tồn nghĩa thân thể hữu tử của σάρξ.
