id: 2CO.4.14
reference: 2 Corinthians 4:14
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἰδότες ὅτι ὁ ἐγείρας ⸀τὸν Ἰησοῦν καὶ ἡμᾶς ⸀σὺν Ἰησοῦ ἐγερεῖ καὶ παραστήσει σὺν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/014.yaml
  text: because we know that the one who raised Jesus will also raise us with Jesus and will present us with you[a].
translation:
  language: vi
  text: vì chúng tôi biết rằng Đấng đã làm cho Đức Giê-su sống lại cũng sẽ làm cho chúng tôi sống lại cùng với Đức Giê-su và sẽ đưa chúng tôi cùng với anh chị em ra trình diện.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Một số thủ bản chép “Chúa Giê-su” thay cho “Giê-su.”
    reason: textual_variant
lexical_decisions:
- source_word: εἰδότες
  choice: vì chúng tôi biết rằng
  rationale: Phân từ mang ý nghĩa nguyên nhân trong ngữ cảnh, nêu cơ sở cho sự bền lòng giữa hoạn nạn; cách dịch này tự nhiên và rõ ràng trong tiếng Việt.
- source_word: ὁ ἐγείρας
  choice: Đấng đã khiến ... sống lại
  rationale: Phân từ quá khứ có mạo từ chỉ về Đức Chúa Trời. Cách diễn đạt này vừa trang trọng vừa truyền đạt rõ hành động làm cho người chết sống lại.
- source_word: τὸν Ἰησοῦν
  choice: Đức Giê-su
  rationale: Theo nguyên văn chính của SBLGNT là 'Giê-su'; tôn xưng 'Đức' phù hợp văn phong tiếng Việt và không thêm danh hiệu 'Chúa' vốn chỉ có trong dị bản.
- source_word: καὶ ἡμᾶς ... ἐγερεῖ
  choice: cũng sẽ khiến chúng tôi sống lại
  rationale: Giữ lực bổ sung của καί và thì tương lai, liên kết sự phục sinh của các sứ đồ với sự phục sinh của Đức Giê-su.
- source_word: σὺν Ἰησοῦ
  choice: cùng với Đức Giê-su
  rationale: σύν với cách ba biểu thị sự kết hợp; không chuyển thành nghĩa phương tiện như 'nhờ Đức Giê-su'.
- source_word: παραστήσει
  choice: sẽ đưa ... ra trình diện trước Ngài
  rationale: Diễn đạt ý đặt hoặc trình diện ai trước mặt một đấng khác; bổ sung 'trước Ngài' như thành phần ngầm hiểu, nhưng không xác định quá mức khung cảnh cánh chung.
- source_word: σὺν ὑμῖν
  choice: cùng anh chị em
  rationale: Giữ ý đồng hành và niềm hy vọng chung của Phao-lô với cộng đoàn Cô-rinh-tô; 'anh chị em' truyền đạt số nhiều bao gồm cả cộng đoàn một cách tự nhiên.
theological_decisions:
- issue: Dị bản sau ἐγείρας
  choice: Dùng 'Đức Giê-su' trong chính văn theo SBLGNT và ghi 'Chúa Giê-su' trong chú thích.
  alternative: Đấng đã khiến Chúa Giê-su sống lại
  rationale: Đây là khác biệt văn bản, không phải khác biệt giáo lý. Chính văn theo bản Hy Lạp được chỉ định, còn dị bản được bảo tồn để minh bạch.
- issue: Ý nghĩa cánh chung của παραστήσει
  choice: Diễn tả việc Đức Chúa Trời sẽ đưa Phao-lô và tín hữu Cô-rinh-tô cùng ra trình diện trước Ngài.
  alternative: sẽ minh oan cho chúng tôi; sẽ đưa chúng tôi đến trước tòa/phân diện của Đấng Christ
  rationale: Ngữ cảnh phục sinh cho thấy một sự trình diện trong tương lai, nhưng câu Hy Lạp không nói rõ đây là trước tòa nào hoặc trước ai; bản dịch giữ nét khái quát ấy.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng 'chúng tôi' cho ἡμᾶς và 'anh chị em' cho ὑμῖν để giữ sự phân biệt giữa nhóm của Phao-lô và cộng đoàn Cô-rinh-tô. Cấu trúc câu giữ mạch nguyên nhân và niềm hy vọng phục sinh chung.
