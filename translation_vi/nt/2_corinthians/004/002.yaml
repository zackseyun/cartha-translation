reference: 2 Corinthians 4:2
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀλλὰ ἀπειπάμεθα τὰ κρυπτὰ τῆς αἰσχύνης, μὴ περιπατοῦντες ἐν πανουργίᾳ μηδὲ δολοῦντες τὸν λόγον τοῦ θεοῦ, ἀλλὰ τῇ φανερώσει τῆς ἀληθείας ⸀συνιστάνοντες ἑαυτοὺς πρὸς πᾶσαν συνείδησιν ἀνθρώπων ἐνώπιον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/002.yaml
  text: Instead[a], we have renounced the hidden things of shame, not walking in cunning nor falsifying the word of God[b], but by the open display of the truth commending ourselves to every human conscience before God.
translation:
  language: vi
  text: Trái lại, chúng tôi đã từ bỏ những điều kín giấu đáng hổ thẹn; không hành xử bằng mưu mẹo, cũng không làm sai lệch lời Đức Chúa Trời,[b] nhưng qua việc công khai bày tỏ chân lý,[a] chúng tôi tự giới thiệu mình với lương tâm của mọi người trước mặt Đức Chúa Trời.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “qua sự bày tỏ” hoặc “sự hiển lộ chân lý”. Từ Hy Lạp nhấn mạnh việc làm cho chân lý được tỏ rõ, không chỉ riêng việc rao giảng.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “pha tạp lời Đức Chúa Trời.” Động từ Hy Lạp gợi đến việc gian dối làm biến chất một thứ gì đó.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπειπάμεθα
  choice: chúng tôi đã từ bỏ
  rationale: Diễn đạt sự dứt khoát khước từ, phù hợp với sắc thái của động từ aorist trung động và tự nhiên trong tiếng Việt.
- source_word: τὰ κρυπτὰ τῆς αἰσχύνης
  choice: những điều kín giấu đáng hổ thẹn
  rationale: Giữ cả ý che giấu lẫn đặc tính đáng hổ thẹn của các việc ấy, đồng thời tránh lối diễn đạt gượng ép.
- source_word: περιπατοῦντες ἐν πανουργίᾳ
  choice: sống trong sự xảo quyệt
  rationale: Chuyển ẩn dụ 'bước đi' sang cách nói tự nhiên về nếp sống; πανουργία chỉ sự khôn khéo bất chính, gian xảo.
- source_word: δολοῦντες
  choice: xuyên tạc
  rationale: Truyền đạt hành vi gian dối làm sai lệch hoặc pha tạp sứ điệp; chú thích giữ lại sắc thái cụ thể hơn là 'pha tạp'.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: lời Đức Chúa Trời
  rationale: Cách dịch quen thuộc, trang trọng, không thu hẹp λόγος chỉ còn lời rao giảng hay văn bản Kinh Thánh.
- source_word: τῇ φανερώσει τῆς ἀληθείας
  choice: bằng cách bày tỏ chân lý cách công khai
  rationale: φανέρωσις nhấn mạnh việc làm cho chân lý hiện rõ, được biết đến; không giới hạn phương thức vào việc rao giảng bằng lời.
- source_word: συνιστάνοντες ἑαυτούς
  choice: chúng tôi tự chứng tỏ mình
  rationale: Trong ngữ cảnh, cụm từ nói đến việc đặt chính mình trước sự thẩm định như người đáng được công nhận; 'tự chứng tỏ mình' tự nhiên hơn 'tự tiến cử mình' và được giới hạn bởi lương tâm con người cùng sự hiện diện của Đức Chúa Trời.
- source_word: πρὸς πᾶσαν συνείδησιν ἀνθρώπων
  choice: trước lương tâm của mọi người
  rationale: Diễn đạt sự hướng đến phán đoán đạo đức nơi từng con người bằng tiếng Việt rõ ràng, tự nhiên.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: trước mặt Đức Chúa Trời
  rationale: Giữ ý Đức Chúa Trời là Đấng chứng kiến và xét đoán chức vụ của Phao-lô.
theological_decisions:
- issue: Phạm vi của sự tương phản giữa chức vụ gian dối và chức vụ chân thật
  choice: Diễn tả tính liêm chính và minh bạch trong cách thi hành chức vụ và trình bày lời Đức Chúa Trời.
  alternative: Hiểu câu này chỉ là lời lên án kỹ thuật tu từ thao túng, hoặc mở rộng thành một tuyên bố kỹ thuật về mọi cách sử dụng Kinh Thánh.
  rationale: Ngữ cảnh trực tiếp bàn về cách các sứ đồ thi hành chức vụ. Bản dịch không thu hẹp cũng không mở rộng câu thành một giáo thuyết chuyên biệt mà nguyên văn không nói rõ.
- issue: Ý nghĩa của συνιστάνοντες ἑαυτούς
  choice: Tự chứng tỏ mình trước lương tâm con người dưới sự chứng kiến của Đức Chúa Trời.
  alternative: Tự khen hoặc tự đề cao mình.
  rationale: Cụm từ có thể mang nghĩa tự giới thiệu hay tự tiến cử, nhưng các bổ ngữ cho thấy đây là sự đặt mình trước sự thẩm định đạo đức, không nhất thiết là khoe khoang.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Trời” nhất quán; giữ cấu trúc đối lập của nguyên văn nhưng chia nhịp bằng dấu chấm phẩy để câu tiếng Việt sáng rõ.
