  text: οὐ γὰρ ὡς μὴ ἐφικνούμενοι εἰς ὑμᾶς ὑπερεκτείνομεν ἑαυτούς, ἄχρι γὰρ καὶ ὑμῶν ἐφθάσαμεν ἐν τῷ εὐαγγελίῳ τοῦ Χριστοῦ—
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/014.yaml
  text: For we are not overextending ourselves[a], as though we had not reached you[c][b], for we came even as far as you with the gospel of Messiah—
translation:
  language: vi
  text: Vì chúng tôi không vươn quá giới hạn của mình như thể không vươn tới anh chị em; vì chúng tôi đã đến tận anh chị em với Tin Mừng của Đấng Mê-si—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπερεκτείνομεν ἑαυτούς
  choice: không vươn quá giới hạn của mình
  rationale: Giữ hình ảnh vươn quá phạm vi chính đáng của động từ ὑπερεκτείνω, đồng thời diễn đạt tự nhiên trong tiếng Việt.
- source_word: ὡς μὴ ἐφικνούμενοι εἰς ὑμᾶς
  choice: như thể chưa từng đến được với anh chị em
  rationale: Diễn tả giả định trái với thực tế làm cơ sở cho lời cáo buộc rằng Phao-lô đang vượt quá phạm vi; 'đến được với' phù hợp với ý về tầm vươn của sứ vụ.
- source_word: ἄχρι ... καὶ ὑμῶν ἐφθάσαμεν
  choice: đến tận anh chị em
  rationale: '''Đến tận'' truyền đạt cả giới hạn ἄχρι lẫn sắc thái nhấn mạnh của καί bằng lối nói tiếng Việt tự nhiên.'
- source_word: ἐν τῷ εὐαγγελίῳ
  choice: đem Tin Mừng ... đến
  rationale: Trong ngữ cảnh, ἐν chỉ phương diện hoặc điều đi cùng sứ vụ; cấu trúc 'đem Tin Mừng đến' rõ nghĩa và tự nhiên hơn cách dịch sát chữ 'trong Tin Mừng'.
- source_word: τοῦ Χριστοῦ
  choice: của Đấng Mê-si
  rationale: Χριστός ở đây vẫn mang chức danh chỉ Đấng được xức dầu; 'Đấng Mê-si' bảo toàn ý nghĩa ấy và phù hợp với văn phong trang trọng, dễ hiểu.
theological_decisions:
- issue: Cách hiểu τοῦ Χριστοῦ trong cụm εὐαγγελίῳ τοῦ Χριστοῦ
  choice: Tin Mừng của Đấng Mê-si
  alternative: Tin Mừng về Đấng Mê-si; Tin Mừng của Đấng Christ
  rationale: Sở hữu cách Hy Lạp có thể chỉ nguồn gốc, sự thuộc về hoặc nội dung. Bản dịch giữ cấu trúc 'của' để không thu hẹp vào riêng nghĩa 'về', đồng thời dịch Χριστός như một chức danh.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng 'anh chị em' cho đại từ số nhiều ὑμᾶς nhằm thể hiện cộng đồng gồm cả nam lẫn nữ. Giữ dấu gạch ngang cuối câu vì mạch lập luận tiếp tục sang câu sau.
