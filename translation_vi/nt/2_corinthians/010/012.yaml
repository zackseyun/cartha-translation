id: 2CO.10.12
reference: 2 Corinthians 10:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Οὐ γὰρ τολμῶμεν ἐγκρῖναι ἢ συγκρῖναι ἑαυτούς τισιν τῶν ἑαυτοὺς συνιστανόντων· ἀλλὰ αὐτοὶ ἐν ἑαυτοῖς ἑαυτοὺς μετροῦντες καὶ συγκρίνοντες ἑαυτοὺς ἑαυτοῖς οὐ συνιᾶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/012.yaml
  text: For we do not dare to classify or compare ourselves with some of those who commend themselves[a]. But when they measure themselves by themselves and compare themselves with themselves[b], they do not understand.
translation:
  language: vi
  text: Vì chúng tôi không dám xếp mình vào cùng hạng với, hay so sánh mình với, một số người tự đề cao mình[a]. Nhưng họ tự lấy mình làm chuẩn để đo mình và so sánh mình với chính mình[b], nên họ không hiểu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “tự tiến cử mình” hoặc “tự khen mình.”'
    reason: lexical_alternative
  - marker: b
    text: 'Sát nghĩa: “đo mình trong chính mình và so sánh mình với chính mình”; ý nói họ dùng chính mình làm tiêu chuẩn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τολμῶμεν
  choice: không dám
  rationale: Diễn đạt tự nhiên sự không dám hoặc không tự phụ làm điều ấy, đồng thời giữ sắc thái mỉa mai của Phao-lô.
- source_word: ἐγκρῖναι
  choice: xếp mình vào cùng hạng
  rationale: Động từ nói đến việc đặt mình vào cùng một loại hay cùng hàng ngũ với người khác, chứ không đơn thuần là phán xét.
- source_word: συγκρῖναι / συγκρίνοντες
  choice: so sánh / so sánh
  rationale: Giữ nghĩa thông thường và sự lặp lại có chủ ý trong lập luận.
- source_word: ἑαυτοὺς συνιστανόντων
  choice: những người tự đề cao mình
  rationale: Trong văn cảnh, động từ chỉ việc tự tiến cử hoặc tự khen ngợi; cách diễn đạt này tự nhiên trong tiếng Việt và giữ ý phê phán.
- source_word: ἐν ἑαυτοῖς ἑαυτοὺς μετροῦντες
  choice: lấy chính mình làm thước đo cho mình
  rationale: Giữ hình ảnh đo lường, đồng thời làm rõ ý họ dùng bản thân làm chuẩn đánh giá.
- source_word: ἑαυτοὺς ἑαυτοῖς
  choice: mình với chính mình
  rationale: Giữ chuỗi đại từ phản thân và nhấn mạnh tính tự quy chiếu trong sự so sánh.
- source_word: οὐ συνιᾶσιν
  choice: họ không hiểu
  rationale: Cách dịch trực tiếp, rõ ràng, không bổ sung một tân ngữ mà nguyên văn để ngầm.
theological_decisions:
- issue: Đối tượng của lời phê phán
  choice: Giữ chủ thể là “một số người tự đề cao mình” và không xác định thêm danh tính hay động cơ của họ.
  alternative: Gọi rõ họ là giáo sư giả hoặc đối thủ của Phao-lô.
  rationale: Nguyên văn câu này không dùng các nhãn thần học ấy; thêm vào sẽ vượt quá chứng cứ của câu.
- issue: Nội dung điều họ “không hiểu”
  choice: Không nêu rõ điều họ không hiểu.
  alternative: Bổ sung rằng họ không hiểu sự dại dột của việc tự lấy mình làm chuẩn.
  rationale: Tân ngữ của συνίημι được để ngầm trong tiếng Hy Lạp; bản dịch giữ sự hàm ẩn đó.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Xếp mình vào cùng hạng” truyền đạt sắc thái phân loại của ἐγκρῖναι; “lấy chính mình làm thước đo” giữ ẩn dụ đo lường nhưng tránh một câu tiếng Việt gượng ép. Các dấu chú thích [a], [b] đều xuất hiện trong chính văn.
