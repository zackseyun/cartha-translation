  terminology: «Tự đề cao mình» là cách diễn đạt phù hợp cho ἑαυτοὺς συνιστανόντων trong văn cảnh, dù chú thích nên nêu các khả năng sát hơn như «tự tiến cử» và «tự khen». «Không hiểu» giữ đúng tính hàm ẩn của οὐ συνιᾶσιν, không áp đặt nội dung cụ thể mà họ không hiểu.
