id: 2CO.10.8
reference: 2 Corinthians 10:8
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐάν ⸀τε ⸀γὰρ περισσότερόν τι καυχήσωμαι περὶ τῆς ἐξουσίας ἡμῶν, ἧς ἔδωκεν ὁ ⸀κύριος εἰς οἰκοδομὴν καὶ οὐκ εἰς καθαίρεσιν ὑμῶν, οὐκ αἰσχυνθήσομαι,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/008.yaml
  text: For even if I should boast somewhat more about our authority[a], which the Lord gave for building you up and not for tearing you down[b], I will not be put to shame.
translation:
  language: vi
  text: Vì, dù tôi có khoe khoang nhiều hơn một chút về thẩm quyền của chúng tôi mà Chúa đã ban để gây dựng anh chị em, chứ không phải để phá đổ anh chị em[a], thì tôi cũng sẽ không bị làm cho hổ thẹn[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “để hủy diệt anh chị em.” Từ Hy Lạp đối lập việc gây dựng với việc phá đổ hoặc hủy diệt; cách dịch trong câu chính giữ hình ảnh xây dựng.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “tôi sẽ không hổ thẹn.” Động từ Hy Lạp có hình thức bị động; “bị làm cho hổ thẹn” phản ánh hình thức ấy rõ hơn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐάν τε γὰρ
  choice: Vì cho dù
  rationale: Giữ chức năng giải thích của γάρ và sắc thái giả định, có phần nhấn mạnh của ἐάν τε bằng một kết cấu điều kiện tự nhiên trong tiếng Việt.
- source_word: περισσότερόν τι καυχήσωμαι
  choice: tôi có tự hào phần nào nhiều hơn
  rationale: “Phần nào” chuyển tải sắc thái bất định, giảm nhẹ của τι; “nhiều hơn” giữ ý so sánh của περισσότερόν, còn thể giả định được thể hiện bằng kết cấu “cho dù... có”.
- source_word: περὶ τῆς ἐξουσίας ἡμῶν
  choice: về thẩm quyền của chúng tôi
  rationale: ἐξουσία ở đây chỉ thẩm quyền được giao, không đơn thuần là năng lực hay sức mạnh.
- source_word: ἧς ἔδωκεν ὁ κύριος
  choice: thẩm quyền Chúa đã ban
  rationale: Lặp lại “thẩm quyền” giúp quan hệ của đại từ ἧς rõ ràng trong tiếng Việt; “Chúa” giữ tước hiệu κύριος và “đã ban” diễn đạt tự nhiên động từ aorist.
- source_word: εἰς οἰκοδομὴν
  choice: để xây dựng anh chị em
  rationale: Giữ hình ảnh xây dựng của οἰκοδομή đồng thời nêu rõ đối tượng được hàm ý từ ngữ cảnh.
- source_word: καὶ οὐκ εἰς καθαίρεσιν ὑμῶν
  choice: chứ không phải phá đổ anh chị em
  rationale: “Phá đổ” giữ sự đối lập về hình ảnh kiến trúc với “xây dựng”; “anh chị em” diễn đạt số nhiều ὑμῶν bằng lối xưng hô tự nhiên, bao quát.
- source_word: οὐκ αἰσχυνθήσομαι
  choice: tôi cũng sẽ không bị hổ thẹn
  rationale: “Bị hổ thẹn” phản ánh hình thức bị động của động từ, đồng thời để ngỏ sắc thái lời tự hào của Phao-lô sẽ không bị chứng minh là rỗng tuếch hay khiến ông chịu nhục.
theological_decisions:
- issue: Bản chất và mục đích của thẩm quyền sứ đồ
  choice: Thẩm quyền được Chúa ban nhằm xây dựng cộng đoàn, không nhằm phá đổ họ.
  alternative: Hiểu thẩm quyền này chủ yếu như quyền thi hành kỷ luật mang tính hủy diệt.
  rationale: Sự đối lập trực tiếp giữa οἰκοδομή và καθαίρεσις cho thấy mục đích mang tính xây dựng, nhưng bản dịch vẫn giữ nguyên thực tại của thẩm quyền và hình ảnh mạnh “phá đổ”, không làm nhẹ sự căng thẳng trong văn mạch.
- issue: Sắc thái của αἰσχυνθήσομαι
  choice: không bị hổ thẹn
  alternative: không hổ thẹn
  rationale: Cách chọn chính giữ hình thức bị động và khả năng Phao-lô bị làm cho xấu hổ hoặc bị chứng minh là khoe khoang vô căn cứ; chú thích bảo lưu cách hiểu thiên về trạng thái nội tâm.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh chị em” cho đại từ số nhiều chỉ tín hữu Cô-rinh-tô; giữ cặp hình ảnh “xây dựng/phá đổ” và dùng dấu gạch ngang để làm rõ mệnh đề quan hệ dài.
