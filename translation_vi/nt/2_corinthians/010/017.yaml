  text: Ὁ δὲ καυχώμενος ἐν κυρίῳ καυχάσθω·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/017.yaml
  text: But the one who boasts must boast in the Lord[a].
translation:
  language: vi
  text: Nhưng ai khoe mình, hãy khoe mình trong Chúa[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc, sát nguyên văn hơn: “Người khoe mình, hãy khoe mình trong Chúa.” Có lẽ Phao-lô đang gợi lại Giê-rê-mi 9:24 (Bản Bảy Mươi: 9:23).'
    reason: cross_reference
lexical_decisions:
- source_word: Ὁ ... καυχώμενος
  choice: ai khoe mình
  rationale: Mạo từ đi với phân từ hiện tại được dùng như danh từ và chỉ một người theo nghĩa khái quát. “Ai khoe mình” tự nhiên trong tiếng Việt, đồng thời giữ tính đại diện chung của số ít.
- source_word: δὲ
  choice: Nhưng
  rationale: δέ đánh dấu sự tương phản nhẹ với lập luận trước đó; “Nhưng” thể hiện rõ sự đối lập giữa việc khoe mình không chính đáng và việc khoe mình đúng chỗ.
- source_word: καυχώμενος / καυχάσθω
  choice: khoe mình / hãy khoe mình
  rationale: καυχάομαι mang nghĩa khoe, tự hào hoặc lấy làm vinh dự. “Khoe mình” giữ được sắc thái tu từ và phép lặp của nguyên văn; “hãy” diễn đạt trực tiếp mệnh lệnh ngôi thứ ba.
- source_word: ἐν
  choice: trong
  rationale: Giữ cách diễn đạt “trong Chúa,” vừa phản ánh cấu trúc Hy Lạp vừa phù hợp với ngôn ngữ thần học quen thuộc, có thể chỉ phạm vi hoặc nền tảng của sự khoe mình.
- source_word: κυρίῳ
  choice: Chúa
  rationale: Dịch κύριος là “Chúa” mà không thêm “Giê-su” hay “Đức Chúa Trời,” nhằm giữ nguyên độ mở về đối tượng quy chiếu trong lời gợi nhắc Kinh Thánh này.
theological_decisions:
- issue: Đối tượng quy chiếu của “Chúa” trong ngữ cảnh trích dẫn hoặc gợi nhắc Kinh Thánh
  choice: Chúa
  alternative: Chúa Giê-su; Đức Chúa Trời
  rationale: Phao-lô gợi lại lời trong Giê-rê-mi về việc khoe mình trong Chúa. Vì nguyên văn chỉ có κυρίῳ và không xác định thêm, bản dịch không diễn giải hẹp hơn, qua đó giữ sự cộng hưởng và căng thẳng thần học của cách dùng này.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc “ai…, hãy…” tự nhiên trong tiếng Việt, còn “khoe mình trong Chúa” giữ phép lặp cùng cách diễn đạt cô đọng của nguyên văn.
