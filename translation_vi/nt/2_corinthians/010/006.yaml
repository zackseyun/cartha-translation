source:
  edition: SBLGNT
  text: καὶ ἐν ἑτοίμῳ ἔχοντες ἐκδικῆσαι πᾶσαν παρακοήν, ὅταν πληρωθῇ ὑμῶν ἡ ὑπακοή.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/006.yaml
  text: and being ready to punish every act of disobedience[b][a], when your obedience is complete.
translation:
  language: vi
  text: và chúng tôi sẵn sàng trừng phạt[a] mọi sự bất tuân, khi sự vâng phục của anh chị em được hoàn tất.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “báo trả mọi sự bất tuân” hoặc “thực thi công lý đối với mọi sự bất tuân.” Động từ Hy Lạp có thể mang các nghĩa này; trong ngữ cảnh, từ này có lẽ nói đến sự trừng phạt mang tính kỷ luật.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “được trọn vẹn” hoặc “được đầy trọn.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἑτοίμῳ ἔχοντες
  choice: chúng tôi sẵn sàng
  rationale: Thành ngữ Hy Lạp diễn tả trạng thái đã chuẩn bị để hành động. Chủ thể “chúng tôi” được làm rõ từ ngữ cảnh trước, giúp câu tiếng Việt tự nhiên mà vẫn giữ quan hệ phân từ với mạch văn.
- source_word: ἐκδικῆσαι
  choice: trừng phạt
  rationale: Động từ có thể mang nghĩa báo trả, thực thi công lý hoặc trừng phạt. Trong ngữ cảnh về thẩm quyền sứ đồ và việc xử lý sự chống đối, “trừng phạt” truyền đạt hành động kỷ luật mà không gợi ý sự báo thù cá nhân.
- source_word: πᾶσαν παρακοήν
  choice: mọi sự bất tuân
  rationale: Cách dịch này giữ danh từ trừu tượng παρακοή và phạm vi bao quát của πᾶσαν, đồng thời rõ nghĩa trong tiếng Việt hiện đại.
- source_word: ὅταν
  choice: khi
  rationale: ὅταν với lối cầu thái chỉ một hoàn cảnh tương lai có điều kiện. Trong câu này, “khi” là cách diễn đạt tự nhiên và vẫn cho thấy hành động trừng phạt chỉ xảy ra sau khi điều kiện được đáp ứng.
- source_word: πληρωθῇ
  choice: được trọn vẹn
  rationale: Thể bị động diễn tả sự vâng phục đạt đến mức đầy đủ hoặc hoàn tất. “Được trọn vẹn” giữ sắc thái tiến đến sự đầy đủ mà không xác định quá mức cách thức hoàn tất.
- source_word: ὑμῶν ἡ ὑπακοή
  choice: sự vâng phục của anh chị em
  rationale: Giữ cấu trúc sở hữu và nghĩa căn bản của ὑπακοή; “anh chị em” là cách xưng hô cộng đồng tự nhiên, trang trọng và bao quát trong tiếng Việt hiện đại.
theological_decisions:
- issue: Bản chất hành động Phao-lô dự định thực hiện đối với sự chống đối
  choice: trừng phạt sự bất tuân trong bối cảnh thi hành thẩm quyền và kỷ luật
  alternative: báo thù cá nhân hoặc phán xét cánh chung của Đức Chúa Trời
  rationale: Ngữ cảnh gần nói về thẩm quyền sứ đồ nhằm xử lý sự chống đối. “Trừng phạt” phù hợp với ngữ cảnh ấy, nhưng chú thích vẫn giữ nghĩa khả hữu là báo trả hoặc thực thi công lý của động từ Hy Lạp.
- issue: Ý nghĩa của việc sự vâng phục “được trọn vẹn”
  choice: sự vâng phục của cộng đồng đạt đến mức đầy đủ
  alternative: sự vâng phục được hoàn tất hoặc được làm cho đầy trọn
  rationale: Bản văn không giải thích chính xác mức độ hay phương thức hoàn thành; cách dịch giữ nguyên độ mở đó thay vì quy nó thành một quan niệm giáo lý cụ thể.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. Câu giữ liên từ “và” để phản ánh sự nối tiếp với câu trước. Đại từ “chúng tôi” được bổ sung từ chủ thể ngầm trong ngữ cảnh nhằm tránh câu tiếng Việt cụt nghĩa; “anh chị em” dùng cho số nhiều ὑμῶν.
