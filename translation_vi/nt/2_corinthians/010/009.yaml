translation:
  language: vi
  text: để tôi không có vẻ như dùng các thư để làm anh chị em sợ hãi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “để tôi không có vẻ như dùng các thư để đe dọa anh chị em.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα μὴ δόξω
  choice: để tôi không có vẻ
  rationale: Giữ lực mục đích/kết quả của ἵνα với thể giả định và nghĩa “có vẻ” của δοκέω; cách diễn đạt tự nhiên trong tiếng Việt và vẫn nối với văn cảnh trước.
- source_word: ὡς ἂν ἐκφοβεῖν
  choice: như muốn… làm… khiếp sợ
  rationale: “Như muốn” chuyển tải sắc thái so sánh, có phần giảm nhẹ của ὡς ἂν; “làm… khiếp sợ” giữ cường độ đáng kể của ἐκφοβέω mà không đẩy đến mức quá mạnh như “làm kinh hoàng”.
- source_word: ὑμᾶς
  choice: anh chị em
  rationale: Đại từ số nhiều chỉ cộng đồng tín hữu; “anh chị em” là cách xưng hô tự nhiên, trang trọng vừa phải và bao hàm trong tiếng Việt hiện đại.
- source_word: διὰ τῶν ἐπιστολῶν
  choice: dùng các thư
  rationale: “Dùng” thể hiện nghĩa phương tiện của διά với sở hữu cách. Mạo từ số nhiều được giữ bằng “các thư”; không thêm đại từ sở hữu vốn không được nêu trực tiếp trong câu Hy Lạp.
