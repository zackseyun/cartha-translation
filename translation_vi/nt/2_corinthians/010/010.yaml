id: 2CO.10.10
reference: 2 Corinthians 10:10
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὅτι Αἱ ⸂ἐπιστολαὶ μέν⸃, φησίν, βαρεῖαι καὶ ἰσχυραί, ἡ δὲ παρουσία τοῦ σώματος ἀσθενὴς καὶ ὁ λόγος ἐξουθενημένος.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/010.yaml
  text: For they say[a], “His letters are weighty and strong, but his bodily presence is weak[b], and his speech is despised.”
translation:
  language: vi
  text: 'Vì có người nói[a]: “Các thư của ông thì có sức nặng và mạnh mẽ, nhưng sự hiện diện trực tiếp của ông thì yếu đuối, còn lời nói của ông bị coi thường.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “Vì người ấy nói: ‘Các thư thì có sức nặng và mạnh mẽ…’” Tiếng Hy Lạp dùng động từ số ít, nghĩa đen là “người ấy nói”; ở đây nó có thể là cách dẫn lại ý kiến tiêu biểu của những người chỉ trích Phao-lô.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Vì
  rationale: Trong ngữ cảnh, từ này đưa ra cơ sở hoặc nội dung giải thích cho câu trước; “Vì có người nói” tự nhiên trong tiếng Việt.
- source_word: ἐπιστολαὶ
  choice: các thư
  rationale: Chỉ những thư từ do Phao-lô viết; cách nói thông dụng, không cần dùng từ mang sắc thái chuyên biệt như “thư tín”.
- source_word: μέν ... δὲ
  choice: thì ... nhưng ... lại
  rationale: Diễn đạt rõ thế tương phản giữa thư từ và sự hiện diện trực tiếp của Phao-lô bằng cấu trúc tiếng Việt tự nhiên.
- source_word: φησίν
  choice: có người nói
  rationale: Hình thức Hy Lạp là ngôi thứ ba số ít, “người ấy nói,” và có thể là công thức dẫn lời mang tính đại diện. “Có người nói” giữ được số ít và cho thấy đây là lời phê phán được thuật lại, không phải nhận định của người kể.
- source_word: βαρεῖαι
  choice: nghiêm nghị
  rationale: Trong ngữ cảnh nói về thư từ, từ này biểu thị tính nặng ký, nghiêm khắc hoặc gây ấn tượng mạnh. “Nghiêm nghị” tự nhiên hơn “nặng nề” và không làm mất sắc thái nghiêm túc, áp đảo.
- source_word: ἰσχυραί
  choice: mạnh mẽ
  rationale: Tương đương trực tiếp, diễn tả sức mạnh và tác động của các thư.
- source_word: παρουσία τοῦ σώματος
  choice: khi đích thân hiện diện
  rationale: Diễn tả sự có mặt trực tiếp, bằng thân thể, đối lập với thư từ; tự nhiên hơn cách dịch sát chữ “sự hiện diện của thân thể”.
- source_word: ἀσθενὴς
  choice: yếu đuối
  rationale: Giữ nguyên lời đánh giá của những người chỉ trích mà không giải thích đó là yếu về ngoại hình, phong thái hay năng lực.
- source_word: λόγος
  choice: lời nói
  rationale: Trong thế đối lập với thư viết và sự hiện diện trực tiếp, từ này nói đến lời nói hoặc cách nói của Phao-lô.
- source_word: ἐξουθενημένος
  choice: bị coi thường
  rationale: Thể hiện việc lời nói của ông bị xem nhẹ hoặc khinh miệt, tránh hàm ý rằng nó vốn đáng khinh.
theological_decisions:
- issue: Lời phê phán Phao-lô được thuật lại chứ không phải được người kể xác nhận
  choice: Dùng công thức dẫn lời “có người nói” và đặt lời phê phán trong ngoặc kép.
  alternative: “Vì người ấy nói” hoặc “Vì họ nói.”
  rationale: φησίν về hình thức là số ít, nhưng có thể dùng như công thức trích dẫn đại diện cho ý kiến của những người chỉ trích. “Có người nói” vừa giữ dấu vết số ít vừa tránh biến lời phê phán thành lời xác nhận của tác giả.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Câu dịch duy trì thế tương phản tu từ giữa thư từ, sự hiện diện trực tiếp và lời nói; đồng thời giữ lời phê phán ở tư cách lời được thuật lại.
