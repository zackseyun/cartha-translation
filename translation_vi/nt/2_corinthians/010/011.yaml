id: 2CO.10.11
reference: 2 Corinthians 10:11
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τοῦτο λογιζέσθω ὁ τοιοῦτος, ὅτι οἷοί ἐσμεν τῷ λόγῳ δι’ ἐπιστολῶν ἀπόντες, τοιοῦτοι καὶ παρόντες τῷ ἔργῳ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/011.yaml
  text: 'Let such a person consider this: what we are in word by letters when absent[b][a], we are also in deed when present.'
translation:
  language: vi
  text: 'Người như thế hãy suy xét điều này: khi vắng mặt, chúng tôi như thế nào trong lời nói qua thư từ, thì khi có mặt, chúng tôi cũng như thế ấy trong việc làm.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “trong lời nói ... trong hành động.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: λογιζέσθω
  choice: hãy suy xét
  rationale: Mệnh lệnh ngôi thứ ba số ít, kêu gọi người ấy cân nhắc và nhận rõ một sự thật; “hãy suy xét” tự nhiên, trang trọng và giữ được sắc thái deliberative.
- source_word: ὁ τοιοῦτος
  choice: người như thế
  rationale: Chỉ đích danh kiểu người vừa được nhắc đến trong văn cảnh, đồng thời giữ số ít và không thêm sắc thái miệt thị.
- source_word: οἷοί ἐσμεν ... τοιοῦτοι
  choice: chúng tôi là thế nào ... chúng tôi cũng là thể ấy
  rationale: Giữ phép tương ứng về phẩm chất hoặc tư cách giữa hai vế của câu Hy Lạp, thay vì thu hẹp thành một hành động tương lai cụ thể.
- source_word: τῷ λόγῳ
  choice: trong lời lẽ
  rationale: Diễn đạt phạm vi/phương diện của λόγος và tạo thế đối xứng rõ với “trong việc làm”; “lời lẽ” ở đây phù hợp với nội dung được truyền đạt bằng thư.
- source_word: δι’ ἐπιστολῶν
  choice: qua các thư
  rationale: 'Giữ nghĩa phương tiện của διά với sở hữu cách: các thư là phương tiện chuyển tải lời của Phao-lô và các cộng sự.'
- source_word: ἀπόντες
  choice: khi vắng mặt
  rationale: Chuyển phân từ hoàn cảnh sang mệnh đề thời gian tự nhiên trong tiếng Việt và giữ đối lập với “khi có mặt”.
- source_word: παρόντες
  choice: khi có mặt
  rationale: Giữ cấu trúc song song với ἀπόντες và diễn đạt sự hiện diện trực tiếp.
- source_word: τῷ ἔργῳ
  choice: trong việc làm
  rationale: Diễn đạt phương diện hành động thực tế, giữ phép đối lập cô đọng giữa λόγος và ἔργον mà không diễn giải quá mức.
theological_decisions:
- issue: Mối tương quan giữa lời trong thư khi vắng mặt và việc làm khi hiện diện
  choice: Giữ lời khẳng định rằng con người và thái độ được bày tỏ qua thư sẽ tương ứng với việc làm khi họ hiện diện.
  alternative: Diễn giải thẳng thành một lời đe dọa về hình phạt hoặc thành sự đối lập giữa phong cách nói và quyền năng thuộc linh.
  rationale: Câu Hy Lạp xác lập sự tương ứng trực tiếp giữa hai phương diện nhưng không nêu cụ thể hành động sẽ là gì; bản dịch vì thế giữ sức nặng cảnh báo mà không thêm nội dung thần học hay kỷ luật ngoài văn bản.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Cấu trúc “là thế nào ... cũng là thể ấy” hơi nâng cao nhưng được giữ để phản ánh chính xác phép tương ứng οἷοι ... τοιοῦτοι; chú thích nêu cách diễn đạt tự nhiên khác cho cặp λόγος–ἔργον.
