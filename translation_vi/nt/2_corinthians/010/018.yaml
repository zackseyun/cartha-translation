id: 2CO.10.18
reference: 2 Corinthians 10:18
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οὐ γὰρ ὁ ἑαυτὸν ⸀συνιστάνων, ἐκεῖνός ἐστιν δόκιμος, ἀλλὰ ὃν ὁ κύριος συνίστησιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/018.yaml
  text: For it is not the one who commends himself who is approved[a], but the one whom the Lord commends.
translation:
  language: vi
  text: Vì không phải người tự khen mình là người được công nhận,[a] nhưng là người được Chúa khen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “tự tiến cử mình” ... “người được Chúa tiến cử.” Cả hai chỗ đều dùng cùng một động từ Hy Lạp.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συνιστάνων / συνίστησιν
  choice: khen
  rationale: Trong mạch văn nói về sự khoe mình và việc được đánh giá, động từ συνίστημι chỉ việc tiến cử hoặc nói tốt về một người để người ấy được nhìn nhận. “Khen” tự nhiên trong tiếng Việt và giữ cùng một từ ở cả hai vế.
- source_word: δόκιμος
  choice: được công nhận
  rationale: δόκιμος chỉ người đã được thẩm định và được chấp thuận. “Được công nhận” diễn đạt rõ kết quả của sự đánh giá, đồng thời phù hợp với thế đối lập giữa tự khen mình và được Chúa khen.
- source_word: κύριος
  choice: Chúa
  rationale: Dịch tước hiệu κύριος theo cách dùng tiêu chuẩn trong tiếng Việt, không xác định thêm danh tính mà câu Hy Lạp không nói rõ.
- source_word: ἑαυτὸν
  choice: mình
  rationale: Đại từ phản thân “mình” tự nhiên với chủ ngữ “người” trong tiếng Việt và chuyển tải chính xác ý tự tiến cử.
- source_word: ὃν
  choice: người
  rationale: 'Danh hóa đại từ quan hệ để tạo thế đối xứng tự nhiên: không phải người này, nhưng là người kia.'
- source_word: γὰρ
  choice: Vì
  rationale: Giữ chức năng giải thích của γάρ, nối câu này với lập luận ngay trước đó.
theological_decisions:
- issue: Đối tượng được gọi là “Chúa” (ὁ κύριος)
  choice: Chỉ dịch là “Chúa” trong chính văn.
  alternative: “Chúa Jêsus” hoặc “Đức Chúa Trời”
  rationale: Trong thư Phao-lô, danh xưng này thường chỉ Chúa Jêsus, nhưng chính câu này chỉ có κύριος. Bản dịch giữ nguyên mức độ xác định của nguồn và không giải quyết thay sự hàm ý thần học.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Cấu trúc đối lập “không phải ... nhưng là ...” giữ nhịp lập luận của nguyên văn; dấu phẩy trước ký hiệu chú thích giúp chú thích gắn với cụm “được công nhận”.
