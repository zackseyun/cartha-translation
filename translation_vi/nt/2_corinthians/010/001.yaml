source:
  edition: SBLGNT
  text: Αὐτὸς δὲ ἐγὼ Παῦλος παρακαλῶ ὑμᾶς διὰ τῆς πραΰτητος καὶ ἐπιεικείας τοῦ Χριστοῦ, ὃς κατὰ πρόσωπον μὲν ταπεινὸς ἐν ὑμῖν, ἀπὼν δὲ θαρρῶ εἰς ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/001.yaml
  text: I myself[a], Paul, appeal to you by the meekness and gentleness of Messiah—I who am humble face to face among you[c][b], but bold toward you when absent.
translation:
  language: vi
  text: Chính tôi, Phao-lô, nhân sự nhu mì và khoan dung của Đấng Mê-si mà khuyên anh chị em—tôi, người khi có mặt giữa anh chị em thì khiêm nhường[a], nhưng khi vắng mặt thì mạnh dạn đối với anh chị em.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Khiêm nhường” có thể là cách Phao-lô nhắc lại, với sắc thái mỉa mai, lời một số người nhận xét về ông khi gặp trực tiếp; cũng có thể dịch là “thấp hèn”. Dịch thành “nhút nhát” sẽ giải thích mạnh hơn nguyên văn.
    reason: lexical_alternative
lexical_decisions:
- source_word: Αὐτὸς δὲ ἐγὼ Παῦλος
  choice: Chính tôi, Phao-lô
  rationale: “Chính tôi” giữ sự nhấn mạnh của đại từ αὐτός cùng chủ ngữ ἐγώ; δέ đánh dấu bước chuyển nhẹ nên không cần dịch thành một từ nối riêng trong tiếng Việt.
- source_word: παρακαλῶ ὑμᾶς
  choice: khuyên anh chị em
  rationale: παρακαλέω ở đây là lời kêu gọi tha thiết mang tính quan hệ, không phải một mệnh lệnh; “khuyên” tự nhiên và giữ được sắc thái ấy.
- source_word: διὰ τῆς πραΰτητος καὶ ἐπιεικείας
  choice: lấy sự nhu mì và khoan dung
  rationale: διά với sở hữu cách diễn tả cơ sở hoặc phương cách của lời khuyên. “Nhu mì” giữ sắc thái sức mạnh được kiềm chế của πραΰτης; “khoan dung” thể hiện sự nhường nhịn, rộng lượng của ἐπιείκεια và phân biệt hai phẩm chất.
- source_word: τοῦ Χριστοῦ
  choice: của Đấng Mê-si
  rationale: Χριστός ở đây là tước hiệu; “Đấng Mê-si” chuyển tải ý nghĩa của tước hiệu thay vì chỉ phiên âm theo truyền thống.
- source_word: κατὰ πρόσωπον
  choice: khi đối diện
  rationale: Thành ngữ chỉ lúc hiện diện trực tiếp, đối lập với ἀπών. “Khi đối diện” tự nhiên trong tiếng Việt và vẫn giữ hình ảnh khuôn mặt của nguyên văn.
- source_word: ταπεινὸς ἐν ὑμῖν
  choice: khiêm nhường giữa anh chị em
  rationale: “Khiêm nhường” giữ nghĩa cơ bản của ταπεινός và không quyết định liệu đây là phẩm chất thật hay lời châm biếm lặp lại nhận xét của người khác; “giữa anh chị em” thể hiện ἐν ὑμῖν.
- source_word: ἀπὼν δὲ θαρρῶ εἰς ὑμᾶς
  choice: nhưng khi vắng mặt lại mạnh dạn với anh chị em
  rationale: “Khi vắng mặt” diễn đạt tự nhiên phân từ ἀπών; “mạnh dạn” giữ sự tương phản tu từ với “khiêm nhường”; “với” không áp đặt sắc thái thù nghịch mà εἰς không nhất thiết mang.
theological_decisions:
- issue: Cách dịch Χριστοῦ
  choice: Đấng Mê-si
  alternative: Đấng Christ; Chúa Cứu Thế
  rationale: Từ này đang hoạt động như một tước hiệu. “Đấng Mê-si” bảo toàn nội dung tước hiệu và âm hưởng Do Thái mà không thêm một cách giải thích thần học riêng.
- issue: Giọng điệu trong lời Phao-lô tự mô tả là ταπεινός
  choice: khiêm nhường
  alternative: thấp hèn; nhút nhát
  rationale: Ngữ cảnh có thể hàm ý Phao-lô đang nhắc lại lời người khác chê mình, nhưng tiếng Hy Lạp không đánh dấu lời trích dẫn. “Khiêm nhường” duy trì cả nghĩa từ vựng lẫn khả năng mỉa mai, thay vì giải quyết sự căng thẳng ngay trong chính văn.
- issue: Phạm vi của διὰ trong lời khuyên
  choice: lấy sự nhu mì và khoan dung của Đấng Mê-si mà khuyên
  alternative: nhân danh sự nhu mì và khoan dung; nhờ sự nhu mì và khoan dung
  rationale: Cấu trúc này có thể nói đến cơ sở hoặc phương cách Phao-lô khuyên bảo. Cách dịch đã chọn giữ được độ rộng ấy mà không biến cụm từ thành một công thức nhân danh.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh chị em” cho số nhiều ὑμᾶς nhằm diễn đạt cộng đồng tín hữu một cách tự nhiên và bao quát. Dấu gạch ngang giữ chuyển giọng đột ngột sang lời Phao-lô tự mô tả. Chỉ dùng một chú thích để bảo tồn khả năng mỉa mai của ταπεινός mà không làm chính văn nặng nề.
