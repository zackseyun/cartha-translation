  verdict: revise
  source_fidelity: Bản dịch nhìn chung phản ánh đúng mục đích truyền giáo (εὐαγγελίσασθαι), phạm vi vượt quá người nhận (τὰ ὑπερέκεινα ὑμῶν), và sự từ chối khoe khoang trong phạm vi thuộc người khác (ἐν ἀλλοτρίῳ κανόνι). Tuy nhiên, “những miền xa hơn anh chị em” không diễn đạt tự nhiên quan hệ không gian mà nguyên ngữ nêu; cần nói rõ hơn rằng các miền ấy ở xa hơn nơi cộng đoàn đang ở, mà không thêm một địa phận cụ thể. “Những điều đã được chuẩn bị sẵn” giữ được tính khái quát của τὰ ἕτοιμα tốt hơn là xác định đó là công việc đã hoàn tất.
  naturalness: Câu sửa dùng “ở những miền xa hơn nơi anh chị em đang ở”, là cách nói hiện đại, rõ ràng và tự nhiên hơn trong tiếng Việt. Cấu trúc đối lập “để ... chứ không ...” vẫn giữ được quan hệ giữa hai nguyên mẫu trong câu Hy Lạp.
  terminology: “Rao truyền Tin Mừng”, “phạm vi của người khác”, và “khoe mình” phù hợp với ngữ cảnh chức vụ của Phao-lô. Chú thích giải thích κανών là phạm vi/lĩnh vực được phân định, tránh nghĩa “quy tắc” hoặc “quy điển”, là phù hợp. Không nên xác định τὰ ἕτοιμα trong phần câu chính là công việc của người khác, vì nguyên văn để cách nói này cô đọng.
  issues:
