    issue: Cụm “những miền xa hơn anh chị em” chưa tự nhiên và dễ gây mơ hồ về quan hệ không gian.
    rationale: 'ὑμῶν xác định mốc tương quan cho τὰ ὑπερέκεινα: các miền ở phía xa hơn so với nơi người Cô-rinh-tô đang ở. Tiếng Việt cần một yếu tố như “nơi anh chị em đang ở” để diễn đạt quan hệ này rõ mà không suy diễn “địa phận”.'
  - severity: low
    issue: Chú thích a lặp lại cách diễn đạt không tự nhiên “ở bên kia anh chị em”.
    rationale: Nên thay bằng một phương án Việt ngữ tự nhiên hơn, chẳng hạn “vượt ra ngoài nơi anh chị em đang ở”, vẫn phản ánh sắc thái không gian của ὑπερέκεινα.
