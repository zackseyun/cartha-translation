reference: 2 Corinthians 10:16
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἰς τὰ ὑπερέκεινα ὑμῶν εὐαγγελίσασθαι, οὐκ ἐν ἀλλοτρίῳ κανόνι εἰς τὰ ἕτοιμα καυχήσασθαι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/016.yaml
  text: to proclaim the good news in the regions beyond you[c][b][a], not to boast in another's sphere about things already prepared.
translation:
  language: vi
  text: để rao truyền Tin Mừng ở những miền xa hơn nơi anh chị em đang ở,[a] chứ không khoe mình trong phạm vi của người khác về những điều đã được chuẩn bị sẵn.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “để rao giảng Tin Mừng tại những miền vượt ra ngoài nơi anh chị em đang ở.”'
    reason: lexical_alternative
  - marker: b
    text: '“Phạm vi” dịch từ tiếng Hy Lạp κανών, ở đây mang nghĩa địa bàn hoặc lĩnh vực công tác được phân định, không phải “quy tắc” hay “quy điển”. Cả vế cũng có thể hiểu: “không khoe mình trong địa bàn của người khác về công việc đã được làm sẵn.”'
    reason: cultural_note_and_alternative_reading
lexical_decisions:
- source_word: ὑπερέκεινα ὑμῶν
  choice: những miền xa hơn anh chị em
  rationale: Cụm từ chỉ các địa phương nằm xa hơn, lấy người Cô-rinh-tô làm mốc. Cách dịch này giữ quan hệ trực tiếp của ὑμῶν mà không tự ý thêm “địa phận của”.
- source_word: εὐαγγελίσασθαι
  choice: rao truyền Tin Mừng
  rationale: Diễn đạt tự nhiên mục tiêu truyền giáo của Phao-lô, đồng thời giữ nghĩa động từ là công bố tin mừng.
- source_word: ἐν ἀλλοτρίῳ κανόνι
  choice: trong phạm vi của người khác
  rationale: Trong mạch văn, κανών chỉ phạm vi hay địa bàn công tác được phân định, không phải luật lệ hoặc quy điển; ἀλλοτρίῳ nhấn mạnh phạm vi thuộc về người khác.
- source_word: εἰς τὰ ἕτοιμα
  choice: về những việc đã được chuẩn bị sẵn
  rationale: Giữ cách diễn đạt khái quát và hơi cô đọng của nguyên văn; trong ngữ cảnh, có thể ám chỉ thành quả hoặc công việc đã được người khác thực hiện hay chuẩn bị.
- source_word: καυχήσασθαι
  choice: khoe mình
  rationale: Giữ sắc thái tu từ lặp lại trong phân đoạn, chỉ việc tự hào hoặc khoe về thành quả.
theological_decisions:
- issue: Nghĩa của κανών trong bối cảnh chức vụ của Phao-lô
  choice: phạm vi công tác được phân định
  alternative: quy tắc, chuẩn mực, quy điển
  rationale: Các câu 13–15 nói đến giới hạn và địa bàn lao tác; vì vậy từ này ở đây chỉ phạm vi hoạt động, không mang nghĩa một luật lệ đạo đức hay bộ quy điển Kinh Thánh.
- issue: Sở chỉ của τὰ ἕτοιμα
  choice: những việc đã được chuẩn bị sẵn
  alternative: công việc hoặc thành quả đã được người khác hoàn tất
  rationale: Bản dịch chính giữ tính khái quát của nguyên văn, còn chú thích nêu cách hiểu cụ thể theo ngữ cảnh mà không biến phần diễn giải thành nội dung chắc chắn của câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” cho đại từ số nhiều chỉ cộng đoàn Cô-rinh-tô; “Tin Mừng” là cách gọi quen thuộc nhưng vẫn giữ rõ ý công bố tin lành. Cấu trúc câu duy trì sự cô đọng và độ mơ hồ có thật của nguyên văn.
