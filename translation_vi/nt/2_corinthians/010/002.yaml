reference: 2 Corinthians 10:2
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: δέομαι δὲ τὸ μὴ παρὼν θαρρῆσαι τῇ πεποιθήσει ᾗ λογίζομαι τολμῆσαι ἐπί τινας τοὺς λογιζομένους ἡμᾶς ὡς κατὰ σάρκα περιπατοῦντας.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/002.yaml
  text: But I beg that when I am present I may not have to be bold with the confidence by which I consider daring to confront some who regard us as walking according to the flesh[a].
translation:
  language: vi
  text: Nhưng tôi nài xin rằng khi có mặt, tôi sẽ không phải hành động mạnh dạn với sự tự tin mà tôi dự tính dùng để dám đối đầu với một số người cho rằng chúng tôi sống theo xác thịt[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “sống theo tiêu chuẩn của con người.”'
    reason: Nêu cách hiểu diễn giải hợp lý của κατὰ σάρκα trong khi bản chính bảo tồn thuật ngữ “xác thịt” và độ mở nghĩa của nguyên văn.
lexical_decisions:
- source_word: δέομαι
  choice: tôi nài xin
  rationale: Diễn tả lời khẩn khoản tha thiết, mạnh hơn một lời xin đơn thuần, đồng thời giữ giọng văn trang trọng và tự nhiên.
- source_word: τὸ μὴ παρὼν θαρρῆσαι
  choice: rằng khi có mặt, tôi sẽ không phải tỏ ra mạnh dạn
  rationale: Chuyển nội dung của động từ nguyên mẫu có quán từ sang cú pháp tiếng Việt tự nhiên; “không phải” làm rõ điều Phao-lô mong khỏi cần thực hiện mà không thay đổi ý chính.
- source_word: τῇ πεποιθήσει
  choice: với sự quả quyết
  rationale: πεποίθησις chỉ sự tự tin hay xác tín; “sự quả quyết” phù hợp với thái độ cứng rắn được dự liệu trong ngữ cảnh.
- source_word: ᾗ λογίζομαι
  choice: mà tôi dự tính dùng
  rationale: λογίζομαι ở đây có sắc thái cân nhắc và dự định hành động; cách diễn đạt này nối tự nhiên với “sự quả quyết” trong tiếng Việt.
- source_word: τολμῆσαι ἐπί τινας
  choice: để dám đối đầu với một số người
  rationale: Giữ ý dám hành động hướng nghịch lại một số người; “đối đầu” truyền đạt lực đối kháng của ἐπί với người mà không thêm nội dung cụ thể về hình thức xử lý.
- source_word: τοὺς λογιζομένους
  choice: những người cho rằng
  rationale: Diễn đạt sự đánh giá hay nhận định của các đối thủ bằng lối nói hiện đại, rõ ràng.
- source_word: κατὰ σάρκα
  choice: theo xác thịt
  rationale: Giữ thuật ngữ quan trọng σάρξ và sự mơ hồ trong lời cáo buộc, thay vì giới hạn nghĩa vào tiêu chuẩn thuần túy của con người hay bản tính tội lỗi.
- source_word: περιπατοῦντας
  choice: sống
  rationale: Động từ “bước đi” được dùng ẩn dụ về cách cư xử; “sống” là cách diễn đạt tự nhiên, dễ hiểu trong tiếng Việt hiện đại.
theological_decisions:
- issue: Ý nghĩa của σάρξ trong κατὰ σάρκα
  choice: theo xác thịt
  alternative: theo tiêu chuẩn của con người
  rationale: Cụm từ có thể nói đến cách sống theo những tiêu chuẩn thuần túy của con người, nhưng cũng mang âm hưởng thần học rộng hơn trong cách dùng của Phao-lô. Bản chính giữ “xác thịt” để không giải quyết sự mơ hồ quá sớm; chú thích cung cấp cách hiểu diễn giải.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Câu giữ giọng khẩn khoản của Phao-lô và sự căng thẳng giữa lời nài xin với khả năng ông sẽ hành động cứng rắn khi hiện diện.
