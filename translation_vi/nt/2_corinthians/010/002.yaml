revisions:
- from: Nhưng tôi nài xin rằng khi có mặt, tôi sẽ không phải tỏ ra mạnh dạn với sự quả quyết mà tôi dự tính dùng để dám đối đầu với một số người cho rằng chúng tôi sống theo xác thịt[a].
  to: Nhưng tôi nài xin rằng khi có mặt, tôi sẽ không phải hành động mạnh dạn với sự tự tin mà tôi dự tính dùng để dám đối đầu với một số người cho rằng chúng tôi sống theo xác thịt[a].
  rationale: Thay «sự quả quyết» bằng «sự tự tin» để phản ánh chính xác hơn πεποίθησις, và thay «tỏ ra mạnh dạn» bằng «hành động mạnh dạn» để câu tiếng Việt tự nhiên hơn. Không thay đổi cách xử lý từ ngữ thần học «xác thịt» hoặc lực đối kháng của τολμῆσαι ἐπί τινας.
