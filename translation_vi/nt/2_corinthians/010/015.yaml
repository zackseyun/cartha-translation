revisions:
- from: Chúng tôi không khoe mình vượt quá giới hạn bằng công khó của người khác.[a] Trái lại, chúng tôi hy vọng rằng, khi đức tin của anh chị em lớn lên, phạm vi công tác của chúng tôi giữa anh chị em[b] sẽ được mở rộng rất nhiều, đúng theo phần việc được giao cho chúng tôi.[c]
  to: Chúng tôi không khoe mình vượt quá giới hạn về công khó của người khác.[a] Trái lại, chúng tôi hy vọng rằng, khi đức tin của anh chị em tăng trưởng, phạm vi hoạt động của chúng tôi giữa anh chị em[b] sẽ được mở rộng hơn nữa, theo phạm vi của chúng tôi.[c]
  rationale: Sửa “bằng” thành “về” để làm rõ đối tượng của sự khoe khoang; thay cách diễn giải “phần việc được giao” bằng “phạm vi hoạt động/phạm vi” để gần κανών hơn; và thay “rất nhiều” bằng “hơn nữa” để phản ánh εἰς περισσείαν. Chú thích duy trì sự mơ hồ cú pháp của ἐν ὑμῖν và sắc thái sát chữ của μεγαλυνθῆναι.
  reviewer_model: gpt-5.6-terra
