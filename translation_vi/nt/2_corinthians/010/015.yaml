translation:
  language: vi
  text: Chúng tôi không khoe mình vượt quá giới hạn về công khó của người khác.[a] Trái lại, chúng tôi hy vọng rằng, khi đức tin của anh chị em tăng trưởng, phạm vi hoạt động của chúng tôi giữa anh chị em[b] sẽ được mở rộng hơn nữa, theo phạm vi của chúng tôi.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “không khoe mình quá mức về công khó của người khác” hoặc “không khoe mình vượt quá giới hạn trong công khó của người khác.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể ngắt ý: “khi đức tin của anh chị em tăng trưởng giữa anh chị em, chúng tôi sẽ được mở rộng.” Nguyên văn sát chữ là “chúng tôi sẽ được làm cho lớn lên giữa anh chị em”; trong ngữ cảnh, điều này có thể chỉ sự mở rộng hoạt động của Phao-lô và các cộng sự.'
    reason: syntactic_ambiguity
  - marker: c
    text: 'Nguyên văn: “theo κανών của chúng tôi”; từ này có thể chỉ thước đo, giới hạn, hoặc phạm vi đã được phân định.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ εἰς τὰ ἄμετρα καυχώμενοι
  choice: không khoe mình vượt quá giới hạn
  rationale: Giữ động từ “khoe mình” nhất quán với mạch văn, đồng thời diễn đạt hình ảnh về giới hạn hay thước đo bằng tiếng Việt tự nhiên.
- source_word: ἐν ἀλλοτρίοις κόποις
  choice: bằng công khó của người khác
  rationale: κόποις chỉ công lao khó nhọc; trong ngữ cảnh, Phao-lô phủ nhận việc dựa vào thành quả lao động của người khác để khoe mình.
- source_word: αὐξανομένης τῆς πίστεως ὑμῶν
  choice: khi đức tin của anh chị em lớn lên
  rationale: Diễn đạt tự nhiên kết cấu sở hữu cách tuyệt đối và giữ nghĩa thông thường của πίστις là “đức tin” trong ngữ cảnh này.
- source_word: ἐν ὑμῖν μεγαλυνθῆναι
  choice: phạm vi công tác của chúng tôi giữa anh chị em sẽ được mở rộng
  rationale: Nghĩa đen là “chúng tôi được làm cho lớn lên giữa anh chị em”; trong mạch văn về địa bàn được giao, câu nói đến sự mở rộng công tác hơn là sự tôn cao cá nhân. Cách dịch cũng gắn ἐν ὑμῖν với μεγαλυνθῆναι theo trật tự và ngữ cảnh Hy Lạp.
- source_word: κατὰ τὸν κανόνα ἡμῶν
  choice: đúng theo phần việc được giao cho chúng tôi
  rationale: κανών ở đây là giới hạn hay phạm vi công tác được phân định, không phải “kinh điển” theo nghĩa về sau. “Phần việc được giao” làm rõ ý theo ngữ cảnh mà không xác định thêm ai là chủ thể giao trong chính câu này.
- source_word: εἰς περισσείαν
  choice: rất nhiều
  rationale: Truyền đạt ý mức độ gia tăng vượt trội của περισσεία bằng tiếng Việt tự nhiên; trong câu này, cụm từ bổ nghĩa cho sự mở rộng.
theological_decisions:
- issue: Ý nghĩa của μεγαλυνθῆναι đối với chức vụ sứ đồ
  choice: Chỉ sự mở rộng phạm vi công tác của Phao-lô khi đức tin của tín hữu Cô-rinh-tô tăng trưởng.
  alternative: Phao-lô được tín hữu Cô-rinh-tô tôn trọng hoặc đề cao hơn.
  rationale: Các câu 13–16 tập trung vào giới hạn địa bàn và việc không khoe mình về công khó của người khác. Tuy vậy, chú thích vẫn ghi nhận cách diễn đạt sát chữ để không che khuất sắc thái có thể hiểu là chính các sứ đồ “được làm cho lớn lên” giữa họ.
- issue: Phạm vi bổ nghĩa của ἐν ὑμῖν
  choice: 'Gắn với μεγαλυνθῆναι: công tác được mở rộng “giữa anh chị em”.'
  alternative: 'Gắn với αὐξανομένης: đức tin “lớn lên giữa anh chị em”.'
  rationale: Vị trí của cụm từ ngay trước μεγαλυνθῆναι và mạch văn về sự mở rộng địa bàn nâng đỡ lựa chọn chính; tuy nhiên, cấu trúc Hy Lạp cho phép cách ngắt câu khác nên được nêu trong chú thích.
- issue: Nghĩa của κανών
  choice: Phần việc hay phạm vi công tác được giao.
  alternative: Thước đo, quy tắc hoặc giới hạn của chúng tôi.
  rationale: Trong đoạn văn này, κανών chỉ một địa hạt hoạt động có giới hạn, không mang nghĩa thần học về bộ Kinh Thánh hay một quy tắc giáo hội.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” cho số nhiều ὑμῶν/ὑμῖν; giữ hình ảnh về giới hạn và phạm vi nhưng tránh cách dịch cứng hoặc dễ bị hiểu lầm là Phao-lô tự tôn cao.
