id: 2CO.10.3
reference: 2 Corinthians 10:3
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐν σαρκὶ γὰρ περιπατοῦντες οὐ κατὰ σάρκα στρατευόμεθα—
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/003.yaml
  text: For though we walk in the flesh[a], we do not wage war according to the flesh—
translation:
  language: vi
  text: Vì tuy sống trong xác thịt[a], chúng tôi không chiến đấu theo xác thịt—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Vì tuy sống trong thân xác, chúng tôi không chiến đấu theo những tiêu chuẩn thuần túy của con người.”'
    reason: 'Nêu cách hiểu tự nhiên hơn về hai sắc thái của σάρξ: thân phận có thân xác ở lần thứ nhất và chuẩn mực thuần túy của con người ở lần thứ hai.'
lexical_decisions:
- source_word: ἐν σαρκὶ
  choice: trong xác thịt
  rationale: Giữ cách diễn đạt tương đối sát nguyên ngữ và duy trì sự lặp lại của σάρξ. Trong ngữ cảnh này, cụm từ chỉ đời sống hiện tại của con người trong thân xác, chứ không nhất thiết mang nghĩa đạo đức là “bản tính tội lỗi”.
- source_word: γὰρ
  choice: Vì
  rationale: Diễn đạt chức năng giải thích của γάρ và nối câu này với lập luận ngay trước đó.
- source_word: περιπατοῦντες
  choice: tuy sống
  rationale: περιπατέω theo nghĩa bóng thường chỉ việc sống hay cách sống. Quan hệ nhượng bộ được thể hiện tự nhiên bằng “tuy”, phù hợp với sự tương phản ở mệnh đề sau.
- source_word: οὐ κατὰ σάρκα
  choice: không ... theo xác thịt
  rationale: “Theo xác thịt” giữ được ý về chuẩn mực hoặc phương thức trong κατὰ σάρκα, đồng thời không thu hẹp nghĩa thành duy nhất “theo tiêu chuẩn loài người” hay “theo lối trần tục”.
- source_word: στρατευόμεθα
  choice: chúng tôi không chiến đấu
  rationale: Diễn đạt rõ hình ảnh quân sự trong động từ, phù hợp với ngữ cảnh Phao-lô nói về cuộc tranh chiến trong chức vụ.
theological_decisions:
- issue: Cách dịch hai lần xuất hiện của σάρξ
  choice: Dùng “xác thịt” cho cả hai lần trong câu chính.
  alternative: “sống trong thân xác ... không chiến đấu theo tiêu chuẩn thuần túy của con người” hoặc “sống trong sự yếu đuối của con người ... không chiến đấu theo lối xác thịt”.
  rationale: 'Hai lần dùng cùng một từ giúp bảo toàn sự lặp lại có chủ ý và sức căng trong lời Phao-lô: ông sống trong điều kiện hữu hạn của con người nhưng không tiến hành cuộc tranh chiến theo những nguyên tắc hay phương thức thuộc xác thịt. Cách dịch này tránh đồng nhất σάρξ ở đây với “bản tính tội lỗi”.'
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Sống” tự nhiên hơn lối dịch sát chữ “bước đi” trong tiếng Việt; “xác thịt” được giữ để bảo toàn liên kết từ vựng và tính chưa hoàn toàn xác định của nguyên ngữ. Dấu gạch ngang cuối câu được giữ vì câu tiếp tục sang 2 Cô-rinh-tô 10:4.
