revisions:
- from: Nhưng chúng tôi sẽ không khoe mình quá giới hạn, mà chỉ khoe trong giới hạn của phạm vi[a] Đức Chúa Trời đã phân cho chúng tôi—một giới hạn vươn đến cả anh chị em—
  to: Nhưng chúng tôi sẽ không khoe mình vượt quá giới hạn, nhưng khoe theo mức độ của phạm vi[a] mà Đức Chúa Trời đã phân cho chúng tôi—một mức độ vươn đến cả anh chị em—
