source:
  edition: SBLGNT
  text: ἡμεῖς δὲ ⸀οὐκ εἰς τὰ ἄμετρα καυχησόμεθα, ἀλλὰ κατὰ τὸ μέτρον τοῦ κανόνος οὗ ἐμέρισεν ἡμῖν ὁ θεὸς μέτρου, ἐφικέσθαι ἄχρι καὶ ὑμῶν—
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/013.yaml
  text: But we will not boast beyond measure[a], but according to the measure of the sphere that God assigned to us—a measure that reaches even to you—
translation:
  language: vi
  text: Nhưng chúng tôi sẽ không khoe mình vượt quá giới hạn, nhưng khoe theo mức độ của phạm vi[a] mà Đức Chúa Trời đã phân cho chúng tôi—một mức độ vươn đến cả anh chị em—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “quy tắc” hoặc “chuẩn mực”. Từ Hy Lạp có thể chỉ một thước đo, tiêu chuẩn, hoặc phạm vi được ấn định.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄμετρα
  choice: quá giới hạn
  rationale: Diễn đạt thành ngữ chỉ việc vượt ra ngoài những giới hạn thích đáng, đồng thời giữ hình ảnh về giới hạn trong mạch văn.
- source_word: καυχησόμεθα
  choice: sẽ không khoe mình … mà chỉ khoe
  rationale: “Khoe mình” truyền đạt trực tiếp sắc thái tự hào hoặc nhận phần công trong bối cảnh tranh luận; động từ được lặp lại ở vế sau để câu tiếng Việt rõ nghĩa.
- source_word: κατὰ τὸ μέτρον
  choice: trong giới hạn
  rationale: Cách nói tự nhiên trong tiếng Việt, thể hiện việc lời khoe của Phao-lô phải nằm trong mức đã được ấn định.
- source_word: κανόνος
  choice: phạm vi
  rationale: Trong ngữ cảnh này, từ ngữ nói đến địa hạt hoặc phạm vi phục vụ được Đức Chúa Trời phân định; chú thích vẫn bảo lưu các nghĩa khả hữu “quy tắc”, “chuẩn mực” và “ranh giới”.
- source_word: οὗ ἐμέρισεν ἡμῖν ὁ θεὸς
  choice: Đức Chúa Trời đã phân cho chúng tôi
  rationale: “Phân cho” diễn đạt hành động chia phần hoặc giao một địa hạt, đồng thời tự nhiên và súc tích trong tiếng Việt.
- source_word: μέτρου
  choice: một giới hạn
  rationale: Giữ lại sự lặp lại ý niệm μέτρον và làm rõ rằng phạm vi được giao có một mức độ xác định.
- source_word: ἐφικέσθαι
  choice: vươn đến
  rationale: Truyền đạt chiều kích không gian và mức độ mở rộng của phạm vi được giao.
- source_word: ἄχρι καὶ ὑμῶν
  choice: đến cả anh chị em
  rationale: 'Giữ sắc thái nhấn mạnh của καί: người Cô-rinh-tô cũng nằm trong phạm vi phục vụ được giao cho Phao-lô.'
theological_decisions:
- issue: Ý nghĩa của κανών trong lời khẳng định về chức vụ của Phao-lô
  choice: Một phạm vi phục vụ do Đức Chúa Trời phân định, bao gồm cả người Cô-rinh-tô
  alternative: Một quy tắc hoặc chuẩn mực dùng để đo lường việc khoe mình
  rationale: Ngữ cảnh nhấn mạnh mức độ, giới hạn và việc phạm vi ấy “vươn đến” người Cô-rinh-tô. Tuy vậy, vì κανών cũng có thể chỉ quy tắc hay chuẩn mực, khả năng ấy được ghi trong chú thích thay vì bị loại bỏ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Anh chị em” diễn đạt số nhiều ὑμῶν theo lối bao quát tự nhiên. Dấu gạch ngang cuối câu được giữ vì câu Hy Lạp tiếp nối sang ý sau.
