  source_fidelity: Bản dịch nhận đúng câu mở đầu là lời quở trách ở thức trực thuyết và giữ được quan hệ thuộc về trong Χριστοῦ εἶναι. Tuy nhiên, “tin chắc rằng mình” chưa diễn đạt rõ nét tự tín/tự cậy của πέποιθεν ἑαυτῷ; “tự tin rằng mình” sát hơn. “Sự việc theo bề ngoài” cũng kém tự nhiên hơn cách nói trực tiếp về việc nhìn mọi sự theo bề ngoài.
  naturalness: Nên bỏ “đang” vì không cần thiết trong tiếng Việt và đổi “tự suy xét lại” thành “tự mình xét lại” để câu tự nhiên, sáng rõ hơn mà vẫn giữ πάλιν và ἐφ’ ἑαυτοῦ.
