  to: 'Anh chị em nhìn mọi sự theo bề ngoài.[a] Nếu ai tự tin rằng mình thuộc về Đấng Mê-si-a, người ấy hãy tự mình xét lại điều này: người ấy thuộc về Đấng Mê-si-a[b] thế nào thì chúng tôi cũng thuộc về Đấng Mê-si-a như vậy.'
  rationale: Sửa nhẹ để tiếng Việt tự nhiên hơn và làm rõ sắc thái tự tín của πέποιθεν ἑαυτῷ. Bản sửa vẫn giữ cách hiểu thức trực thuyết của βλέπετε, duy trì phương án có ghi chú về khả năng mệnh lệnh, bảo toàn cấu trúc so sánh của nguyên văn, và lặp lại “Đấng Mê-si-a” ở vế cuối để phản ánh rõ từ Χριστοῦ được tỉnh lược trong tiếng Hy Lạp.
  reviewer_model: gpt-5.6-terra
