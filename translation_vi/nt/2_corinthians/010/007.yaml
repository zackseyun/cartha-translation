id: 2CO.10.7
reference: 2 Corinthians 10:7
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Τὰ κατὰ πρόσωπον βλέπετε. εἴ τις πέποιθεν ἑαυτῷ Χριστοῦ εἶναι, τοῦτο λογιζέσθω πάλιν ⸀ἐφ’ ἑαυτοῦ ὅτι καθὼς αὐτὸς Χριστοῦ οὕτως καὶ ⸀ἡμεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/007.yaml
  text: 'You are looking at outward appearances[a]. If anyone is confident in himself that he belongs to Messiah, let him consider this again within himself: that just as he belongs to Messiah[b], so also do we.'
translation:
  language: vi
  text: 'Anh chị em nhìn mọi sự theo bề ngoài.[a] Nếu ai tự tin rằng mình thuộc về Đấng Mê-si-a, người ấy hãy tự mình xét lại điều này: người ấy thuộc về Đấng Mê-si-a[b] thế nào thì chúng tôi cũng thuộc về Đấng Mê-si-a như vậy.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch sát hơn: “Anh chị em nhìn những gì theo vẻ bề ngoài”; hoặc hiểu là một mệnh lệnh: “Hãy nhìn điều ở ngay trước mắt.”'
    reason: Ngữ pháp của βλέπετε có thể được hiểu là trực thuyết hoặc mệnh lệnh, còn Τὰ κατὰ πρόσωπον cho phép sắc thái “theo bề ngoài” hay “ở trước mặt”.
  - marker: b
    text: 'Nguyên văn Hy Lạp: “là của Đấng Mê-si-a”; ở đây được dịch là “thuộc về Đấng Mê-si-a” để làm rõ quan hệ sở hữu hoặc gắn bó.'
    reason: Ghi lại cách diễn đạt sát nguyên văn và sự chuyển đổi cần thiết để câu tiếng Việt rõ nghĩa.
lexical_decisions:
- source_word: Τὰ κατὰ πρόσωπον
  choice: sự việc theo bề ngoài
  rationale: Cụm này chỉ những gì hiện ra bên ngoài hoặc sự đánh giá dựa trên vẻ bề ngoài; cách dịch này tự nhiên trong tiếng Việt mà vẫn giữ hình ảnh của nguyên văn.
- source_word: βλέπετε
  choice: anh chị em đang nhìn
  rationale: Được hiểu là trực thuyết hiện tại mang tính quở trách, phù hợp với mạch văn; tuy nhiên, hình thức này cũng có thể được hiểu là mệnh lệnh, nên phương án đó được ghi ở chú thích.
- source_word: πέποιθεν ἑαυτῷ
  choice: tin chắc rằng mình
  rationale: Thể hoàn thành diễn tả trạng thái tin chắc đã được xác lập; cách diễn đạt tiếng Việt này tự nhiên và truyền đạt sự tự tin của người được nói đến.
- source_word: Χριστοῦ εἶναι
  choice: thuộc về Đấng Mê-si-a
  rationale: Sở hữu cách Χριστοῦ với εἶναι diễn tả sự thuộc về hoặc gắn bó; Χριστός được dịch theo tước hiệu là “Đấng Mê-si-a”.
- source_word: λογιζέσθω πάλιν ἐφ’ ἑαυτοῦ
  choice: hãy tự suy xét lại điều này
  rationale: Mệnh lệnh kêu gọi người ấy tự mình cân nhắc lại; “tự suy xét lại” diễn đạt rõ lực phản tỉnh của cụm từ.
- source_word: καθὼς αὐτὸς Χριστοῦ οὕτως καὶ ἡμεῖς
  choice: người ấy thuộc về Đấng Mê-si-a thế nào thì chúng tôi cũng thuộc về Ngài như vậy
  rationale: Giữ cấu trúc so sánh và làm rõ động từ bị tỉnh lược ở vế sau, qua đó bảo toàn lời khẳng định rằng Phao-lô và các cộng sự cũng thuộc về Đấng Mê-si-a.
theological_decisions:
- issue: Cách dịch Χριστοῦ
  choice: Đấng Mê-si-a
  alternative: Đấng Christ; Chúa Kitô
  rationale: Χριστός ở đây là tước hiệu của Đấng được xức dầu. “Đấng Mê-si-a” chuyển tải chức danh này và tránh coi nó đơn thuần như tên riêng.
- issue: Ý nghĩa của việc “thuộc về” Đấng Mê-si-a
  choice: Giữ lời khẳng định về sự thuộc về mà không xác định thêm địa vị giáo hội hay phe phái
  alternative: Diễn giải là thuộc riêng một nhóm hoặc có thẩm quyền cao hơn
  rationale: Nguyên văn chỉ khẳng định mối quan hệ thuộc về Đấng Mê-si-a và đặt “người ấy” song song với “chúng tôi”; không nên đưa thêm kết luận giáo phái hoặc hệ thống thần học.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh chị em” cho ngôi thứ hai số nhiều nhằm nói với cả cộng đồng; dùng “người ấy” thay cho đại từ mang giới tính vì τις không xác định giới. Cấu trúc so sánh cuối câu được diễn đạt tự nhiên trong tiếng Việt, đồng thời giữ nguyên sức nặng của lời Phao-lô.
