id: 2CO.10.4
reference: 2 Corinthians 10:4
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τὰ γὰρ ὅπλα τῆς στρατείας ἡμῶν οὐ σαρκικὰ ἀλλὰ δυνατὰ τῷ θεῷ πρὸς καθαίρεσιν ὀχυρωμάτων— λογισμοὺς καθαιροῦντες
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/004.yaml
  text: For the weapons of our warfare are not fleshly[c][b][a], but powerful before God for the tearing down of strongholds—tearing down arguments
translation:
  language: vi
  text: Vì vũ khí dùng trong cuộc chiến đấu của chúng tôi không thuộc về xác thịt[a], nhưng mạnh mẽ trước mặt Đức Chúa Trời[b] để phá đổ các thành lũy—phá đổ những lý luận[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “không theo xác thịt.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể hiểu: “mạnh mẽ nhờ Đức Chúa Trời” hoặc “có quyền năng của Đức Chúa Trời.”'
    reason: alternative_reading
  - marker: c
    text: 'Hoặc: “những suy luận” hay “những điều suy đoán.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπλα
  choice: vũ khí
  rationale: Giữ nguyên hình ảnh quân sự cụ thể và là cách diễn đạt tự nhiên trong tiếng Việt hiện đại.
- source_word: στρατείας
  choice: cuộc chiến
  rationale: Diễn đạt tự nhiên ẩn dụ về hoạt động chiến đấu, đồng thời không thu hẹp nghĩa vào một chiến dịch riêng lẻ hay nghĩa vụ quân sự.
- source_word: σαρκικὰ
  choice: thuộc về xác thịt
  rationale: Giữ mối liên hệ rõ ràng với σάρξ và sự căng thẳng thần học trong cách dùng của Phao-lô, không diễn giải quá sớm thành chỉ 'tội lỗi' hay 'thế gian'.
- source_word: δυνατὰ τῷ θεῷ
  choice: đầy quyền năng trước mặt Đức Chúa Trời
  rationale: Phản ánh cách nói cô đọng với dữ cách τῷ θεῷ mà không mặc nhiên quyết định đó là nguồn hay phương tiện; chú thích nêu các cách hiểu khác.
- source_word: καθαίρεσιν
  choice: phá đổ
  rationale: Giữ hình ảnh công phá và đánh sập công sự, đồng thời tạo liên kết từ vựng với καθαιροῦντες.
- source_word: ὀχυρωμάτων
  choice: các thành lũy
  rationale: Tương đương tự nhiên cho những vị trí kiên cố và phù hợp với cả hình ảnh quân sự lẫn cách áp dụng ẩn dụ.
- source_word: λογισμοὺς
  choice: những lý luận
  rationale: Chỉ các lập luận hay tiến trình suy luận trong văn cảnh, nhưng không thêm sắc thái đối nghịch mạnh hơn điều từ ngữ tự nó đòi hỏi.
- source_word: καθαιροῦντες
  choice: phá đổ
  rationale: Lặp lại động từ để bảo tồn liên kết với καθαίρεσιν và sức nhấn tu từ của nguyên văn.
theological_decisions:
- issue: Sự tương phản giữa σαρκικὰ và quyền năng gắn với Đức Chúa Trời
  choice: không thuộc về xác thịt
  alternative: không theo cách của con người; không thuộc thế gian
  rationale: Cách chọn này giữ nguyên ngôn ngữ đặc trưng của Phao-lô và không thu hẹp 'xác thịt' thành bản tính tội lỗi hay nguồn lực thế gian mà thôi.
- issue: Chức năng của τῷ θεῷ trong δυνατὰ τῷ θεῷ
  choice: đầy quyền năng trước mặt Đức Chúa Trời
  alternative: đầy quyền năng bởi Đức Chúa Trời; có quyền năng của Đức Chúa Trời
  rationale: Dữ cách Hy Lạp có tính cô đọng và có thể được hiểu theo nhiều hướng. Bản văn chính tránh áp đặt sắc thái công cụ hay nguồn gốc, còn chú thích bảo tồn những cách hiểu khả dĩ.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, với ẩn dụ quân sự được giữ xuyên suốt. Đại từ “chúng tôi” phản ánh ἡμῶν mà không tự ý mở rộng thành “chúng ta”. Dấu gạch ngang giữ sự chuyển tiếp nhấn mạnh từ việc phá đổ thành lũy sang việc phá đổ các lý luận.
