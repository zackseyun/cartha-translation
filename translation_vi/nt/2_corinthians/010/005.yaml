id: 2CO.10.5
reference: 2 Corinthians 10:5
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ πᾶν ὕψωμα ἐπαιρόμενον κατὰ τῆς γνώσεως τοῦ θεοῦ, καὶ αἰχμαλωτίζοντες πᾶν νόημα εἰς τὴν ὑπακοὴν τοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/005.yaml
  text: and every lofty thing raised up against the knowledge of God[a], and taking every thought captive into obedience to Messiah[b],
translation:
  language: vi
  text: và mọi điều cao vời được tôn cao chống lại sự hiểu biết về Đức Chúa Trời[a], và bắt mọi ý tưởng làm tù binh, đưa mọi ý tưởng ấy vào sự vâng phục Đấng Mê-si[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “mọi điều cao”, “mọi sự tự cao” hoặc “mọi chướng ngại cao ngạo”.'
    reason: lexical_alternative
  - marker: b
    text: 'Tiếng Hy Lạp: “Đấng Christ”; nghĩa là “Đấng Mê-si”, tức Đấng Được Xức Dầu.'
    reason: alternative_reading
lexical_decisions:
- source_word: πᾶν ὕψωμα
  choice: mọi điều cao vời
  rationale: Giữ hình ảnh về một điều được nâng cao hay tôn lên, đồng thời không thu hẹp nghĩa thành riêng sự kiêu căng, lý lẽ hay chướng ngại.
- source_word: ἐπαιρόμενον
  choice: được dựng lên
  rationale: Phản ánh sắc thái bị động/kết quả của phân từ và phù hợp với hình ảnh một điều cao vời đứng lên đối nghịch.
- source_word: κατὰ τῆς γνώσεως τοῦ θεοῦ
  choice: chống lại sự hiểu biết về Đức Chúa Trời
  rationale: Giữ danh từ γνῶσις là “sự hiểu biết” và diễn đạt sở thuộc cách tự nhiên trong tiếng Việt mà không quyết định quá hẹp đó là kiến thức về Ngài hay hành động nhận biết Ngài.
- source_word: αἰχμαλωτίζοντες
  choice: bắt ... làm tù binh
  rationale: Giữ nguyên ẩn dụ quân sự mạnh của động từ, thay vì làm nhẹ thành “kiểm soát” hay “chế ngự”.
- source_word: πᾶν νόημα
  choice: mọi ý tưởng
  rationale: νόημα có thể chỉ ý nghĩ, ý định hoặc toan tính; “ý tưởng” là cách diễn đạt rộng và tự nhiên, không mặc nhiên gán nghĩa tiêu cực.
- source_word: εἰς τὴν ὑπακοὴν
  choice: đưa vào sự vâng phục
  rationale: Diễn đạt hướng chuyển động đến một tình trạng kết quả do εἰς biểu thị.
- source_word: τοῦ Χριστοῦ
  choice: Đấng Mê-si
  rationale: Χριστός ở đây mang chức năng tước hiệu; “Đấng Mê-si” chuyển tải ý nghĩa của tước hiệu thay vì chỉ phiên âm theo truyền thống.
theological_decisions:
- issue: Bản chất của πᾶν ὕψωμα ἐπαιρόμενον
  choice: 'một phạm trù rộng: mọi điều cao vời được dựng lên đối nghịch sự hiểu biết về Đức Chúa Trời'
  alternative: mọi sự kiêu căng tự tôn lên; mọi chướng ngại cao ngạo
  rationale: Nguyên văn duy trì một ẩn dụ rộng. Bản dịch không giới hạn đối tượng chỉ vào tính kiêu ngạo, những lập luận hay các thế lực thuộc linh.
- issue: Cách dịch Χριστοῦ
  choice: Đấng Mê-si
  alternative: Đấng Christ; Đức Kitô
  rationale: Trong cụm này từ ngữ được hiểu theo chức năng tước hiệu, nên dịch nghĩa giúp người đọc nhận ra vai trò Mê-si mà không áp đặt một truyền thống hệ phái.
- issue: Quan hệ trong ὑπακοὴ τοῦ Χριστοῦ
  choice: sự vâng phục hướng đến Đấng Mê-si
  alternative: sự vâng phục của Đấng Mê-si
  rationale: Trong mạch văn bắt các ý tưởng làm tù binh, sở hữu cách tự nhiên nhất chỉ đối tượng mà các ý tưởng phải vâng phục; cấu trúc tiếng Việt vẫn ngắn gọn và không thêm chủ thể ngoài nguyên văn.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại. Câu được giữ như một mệnh đề tiếp nối văn cảnh trước. Cách nói “bắt ... làm tù binh” duy trì ẩn dụ quân sự; “đưa vào sự vâng phục” giữ hướng chuyển động của εἰς. Các dấu chú thích [a], [b] đều xuất hiện ngay trong chính văn.
