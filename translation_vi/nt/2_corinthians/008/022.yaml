language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: συνεπέμψαμεν δὲ αὐτοῖς τὸν ἀδελφὸν ἡμῶν ὃν ἐδοκιμάσαμεν ἐν πολλοῖς πολλάκις σπουδαῖον ὄντα, νυνὶ δὲ πολὺ σπουδαιότερον πεποιθήσει πολλῇ τῇ εἰς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/022.yaml
  text: And we have sent with them our brother[a], whom we have often tested in many matters and found to be diligent, but who is now even more diligent because of his great confidence in you.
translation:
  language: vi
  text: Chúng tôi cũng đã cử người anh em của chúng tôi đi cùng họ, là người chúng tôi đã nhiều lần thử thách trong nhiều việc và nhận thấy là sốt sắng; nay người ấy càng sốt sắng hơn nhiều vì hết sức tin tưởng anh chị em.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “nay người ấy càng sốt sắng hơn nhiều nhờ lòng tin tưởng lớn lao đối với anh chị em.” Cụm từ Hy Lạp có thể diễn tả nguyên nhân hoặc phương tiện; một cách hiểu khác, nhưng kém trực tiếp hơn về mặt cú pháp, cho rằng đây là lòng tin tưởng của Phao-lô.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συνεπέμψαμεν
  choice: đã cử ... đi cùng họ
  rationale: Động từ aorist diễn tả hành động cử đi đã được thực hiện; tiền tố σύν- được thể hiện bằng “đi cùng họ”.
- source_word: ἀδελφὸν ἡμῶν
  choice: người anh em của chúng tôi
  rationale: Giữ nguyên cách gọi thân thuộc trong cộng đồng đức tin và chỉ một nam cộng sự không được nêu tên.
- source_word: ἐδοκιμάσαμεν ἐν πολλοῖς πολλάκις
  choice: đã nhiều lần thử nghiệm anh ấy trong nhiều việc
  rationale: Cách dịch giữ cả ý lặp lại của πολλάκις lẫn phạm vi rộng của ἐν πολλοῖς, đồng thời chuẩn bị cho kết quả được nêu sau đó.
- source_word: σπουδαῖον ὄντα
  choice: thấy anh ấy là người tận tâm
  rationale: “Tận tâm” diễn đạt sự chuyên cần, nhiệt thành và đáng tin cậy trong công việc; “thấy” nêu rõ kết quả đã được chứng thực qua thử nghiệm.
- source_word: νυνὶ δὲ πολὺ σπουδαιότερον
  choice: nay anh ấy còn tận tâm hơn nhiều
  rationale: Giữ phép so sánh tăng tiến của σπουδαιότερον và sắc thái nhấn mạnh của πολὺ.
- source_word: πεποιθήσει πολλῇ τῇ εἰς ὑμᾶς
  choice: vì rất tin tưởng anh chị em
  rationale: Hiểu cách dative theo nghĩa nguyên nhân, giải thích vì sao người anh em ấy càng tận tâm; lối diễn đạt tự nhiên trong tiếng Việt và giữ hướng của lòng tin tưởng về phía người Cô-rinh-tô.
theological_decisions:
- issue: Chủ thể và sắc thái của πεποιθήσει πολλῇ τῇ εἰς ὑμᾶς
  choice: Lòng tin tưởng của người anh em ấy nơi các tín hữu Cô-rinh-tô là lý do khiến anh càng tận tâm.
  alternative: Cụm từ có thể được hiểu theo nghĩa phương tiện (“nhờ lòng tin tưởng lớn lao đối với anh chị em”); một cách hiểu kém trực tiếp hơn xem đây là lòng tin tưởng của Phao-lô.
  rationale: Cú pháp gần nhất nối cụm từ này với người anh em không nêu tên và giải thích mức độ tận tâm gia tăng. Chú thích vẫn ghi nhận sắc thái nguyên nhân/phương tiện và khả năng khác về chủ thể mà không biến câu thành một khẳng định giáo lý rộng hơn.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “anh chị em” để chuyển đại từ số nhiều ὑμᾶς theo cách tự nhiên, bao quát cộng đồng; giữ “người anh em” cho thành ngữ gia đình của cộng đồng đức tin. Dấu chấm phẩy làm rõ sự chuyển từ phẩm chất đã được kiểm chứng sang mức độ tận tâm hiện tại.
