revisions:
- from: Chúng tôi cũng đã cử người anh em của chúng tôi đi cùng họ. Chúng tôi đã nhiều lần thử nghiệm anh ấy trong nhiều việc và thấy anh ấy là người tận tâm; nay anh ấy còn tận tâm hơn nhiều vì rất tin tưởng anh chị em.[a]
  to: Chúng tôi cũng đã cử người anh em của chúng tôi đi cùng họ, là người chúng tôi đã nhiều lần thử thách trong nhiều việc và nhận thấy là sốt sắng; nay người ấy càng sốt sắng hơn nhiều vì hết sức tin tưởng anh chị em.[a]
  rationale: Sửa các chỗ có thể cải thiện an toàn về độ tự nhiên và sát nghĩa mà không đổi ý nghĩa. Bản sửa giữ quan hệ cú pháp theo đó lòng tin tưởng lớn lao của người anh em là lý do hoặc phương tiện cho sự sốt sắng gia tăng; chú thích tiếp tục bảo lưu cách hiểu thay thế về chủ thể của lòng tin tưởng.
