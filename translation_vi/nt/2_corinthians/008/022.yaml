  - severity: low
    issue: “tận tâm” là lựa chọn được, nhưng chưa phản ánh trực tiếp sắc thái sốt sắng/nhiệt thành của σπουδαῖος trong sự đối chiếu tăng tiến.
    rationale: “Sốt sắng” tự nhiên, sát trường nghĩa hơn, và có thể lặp lại nhất quán ở dạng so sánh “càng sốt sắng hơn nhiều.”
