  - severity: low
    issue: Liên kết mệnh đề quan hệ hơi gượng
    rationale: “anh chị em, là những người...” đúng nghĩa nhưng không phải cách diễn đạt gọn và tự nhiên nhất trong tiếng Việt hiện đại; mệnh đề giải thích trực tiếp bảo toàn sắc thái của οἵτινες.
  - severity: low
    issue: Vị trí neo chú thích b chưa thật chính xác
    rationale: Chú thích giải thích θέλειν nên được đặt ngay sau cụm diễn đạt ý muốn, thay vì sau toàn bộ “làm việc ấy”.
