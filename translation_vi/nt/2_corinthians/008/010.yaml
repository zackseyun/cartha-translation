source:
  edition: SBLGNT
  text: καὶ γνώμην ἐν τούτῳ δίδωμι· τοῦτο γὰρ ὑμῖν συμφέρει, οἵτινες οὐ μόνον τὸ ποιῆσαι ἀλλὰ καὶ τὸ θέλειν προενήρξασθε ἀπὸ πέρυσι·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/010.yaml
  text: 'And in this matter I give my judgment: for this is beneficial for you[b][a], who began last year not only to do it but also to will it.'
translation:
  language: vi
  text: 'Về việc này, tôi đưa ra ý kiến[a], vì điều này có ích cho anh chị em: từ năm ngoái, anh chị em đã bắt đầu không những thực hiện việc ấy mà còn có ý muốn[b] thực hiện việc ấy.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “lời khuyên” hoặc “nhận định”. Phao-lô đang đưa ra một đề nghị đã cân nhắc, chứ không diễn đạt điều này như một mệnh lệnh.
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn phân biệt giữa ý muốn hoặc sự sẵn lòng thực hiện và việc thực sự thực hiện.
    reason: lexical_alternative
lexical_decisions:
- source_word: γνώμην
  choice: ý kiến
  rationale: Diễn đạt một nhận định hay lời khuyên đã được cân nhắc, phù hợp với sự phân biệt giữa lời khuyên và mệnh lệnh trong văn cảnh.
- source_word: ἐν τούτῳ
  choice: về việc này
  rationale: Cách nói tự nhiên trong tiếng Việt, chỉ vấn đề quyên góp đang được bàn đến mà không thêm nội dung ngoài văn cảnh.
- source_word: συμφέρει
  choice: có ích
  rationale: Truyền đạt nghĩa có lợi, có ích cho người nhận, bằng ngôn ngữ hiện đại và không mang sắc thái thương mại.
- source_word: τὸ ποιῆσαι
  choice: thực hiện
  rationale: Chỉ hành động thực tế trong công việc quyên góp, đồng thời tự nhiên hơn cách dịch sát chữ là 'làm nó'.
- source_word: τὸ θέλειν
  choice: mong muốn làm việc ấy
  rationale: Giữ sự phân biệt giữa ý muốn bên trong và hành động thực hiện; bổ sung 'làm việc ấy' để câu tiếng Việt rõ nghĩa.
- source_word: προενήρξασθε
  choice: đã bắt đầu
  rationale: Nêu hành động khởi đầu trước đó; yếu tố thời gian đã được ἀπὸ πέρυσι diễn đạt.
- source_word: ἀπὸ πέρυσι
  choice: từ năm ngoái
  rationale: Giữ sắc thái điểm khởi đầu của giới từ ἀπό, đồng thời để ngỏ việc hành động có tiếp diễn hay không.
theological_decisions:
- issue: Sức nặng của lời Phao-lô trong tương quan với thẩm quyền sứ đồ
  choice: Phao-lô đưa ra một ý kiến hay lời khuyên đã cân nhắc, chứ không diễn đạt câu này như một mệnh lệnh trực tiếp.
  alternative: Hiểu đây là một chỉ thị có tính mệnh lệnh.
  rationale: Danh từ γνώμη và văn cảnh gần (8:8, 8:10) phân biệt lời nhận định với mệnh lệnh. 'Ý kiến' bảo toàn giọng khuyên bảo nghiêm túc mà không làm câu mạnh hơn nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “anh chị em” cho đại từ số nhiều ὑμῖν; giữ hai phương diện ý muốn và hành động riêng biệt, đồng thời tránh cách nói gượng như “ý chí làm nó”.
