    reason: lexical_alternative
  - marker: b
    text: “Ân điển của Đức Chúa Trời” có thể vừa chỉ ân huệ của Ngài, vừa chỉ lòng rộng rãi do ân huệ ấy sinh ra trong các hội thánh Ma-xê-đô-ni-a.
    reason: lexical_alternative
lexical_decisions:
- source_word: Γνωρίζομεν δὲ ὑμῖν
  choice: chúng tôi cho anh em biết
  rationale: Γνωρίζομεν diễn tả việc làm cho biết; cách dịch này tự nhiên trong tiếng Việt và vẫn giữ sắc thái trình bày trang trọng. δέ là từ chuyển ý nhẹ, không nhất thiết cần một từ tương ứng riêng trong câu tiếng Việt.
- source_word: ἀδελφοί
  choice: Thưa anh em
  rationale: Giữ hình thức hô cách giống đực của nguyên văn và dùng lối xưng hô tự nhiên, trang trọng trong thư tín; trong cách dùng của Phao-lô, từ này thường hướng đến toàn thể hội chúng, được nêu rõ ở chú thích.
- source_word: τὴν χάριν τοῦ θεοῦ
  choice: ân điển của Đức Chúa Trời
  rationale: Giữ thuật ngữ thần học rộng nghĩa χάρις, bao hàm ân huệ của Đức Chúa Trời và tác động cụ thể của ân ấy, thay vì thu hẹp thành quà tặng hay lòng rộng rãi.
- source_word: τὴν δεδομένην
  choice: đã được ban
  rationale: Thể hoàn thành bị động được chuyển bằng cấu trúc bị động với 'đã', diễn tả hành động đã xảy ra và kết quả còn hiệu lực.
- source_word: ἐν ταῖς ἐκκλησίαις τῆς Μακεδονίας
  choice: giữa các hội thánh tại Ma-xê-đô-ni-a
  rationale: ἐν ở đây chỉ phạm vi nơi ân điển hoạt động; 'giữa' giữ được sắc thái ấy, còn 'tại Ma-xê-đô-ni-a' diễn đạt tự nhiên vị trí của các hội thánh.
theological_decisions:
- issue: Ý nghĩa của 'ân điển của Đức Chúa Trời' trong văn cảnh
  choice: Giữ cụm từ rộng nghĩa, chỉ công việc đầy ân điển của Đức Chúa Trời đang tác động giữa các hội thánh Ma-xê-đô-ni-a và sinh ra lòng rộng rãi
  alternative: Hiểu riêng là khoản quyên góp, hoặc chỉ là ân huệ chung Đức Chúa Trời ban cho họ
  rationale: Nguyên văn cho phép đồng thời thấy nguồn thần học là ân điển Đức Chúa Trời và kết quả thực tiễn là sự rộng rãi; bản dịch không thu hẹp sự căng nghĩa này.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng 'Đức Chúa Trời', 'ân điển', 'hội thánh' theo văn phong Kinh Thánh Tin Lành quen thuộc; giữ lời xưng hô 'anh em' theo hình thức nguyên văn nhưng chú thích rõ phạm vi bao gồm toàn hội chúng.
