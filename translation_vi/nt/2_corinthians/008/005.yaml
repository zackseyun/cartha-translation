id: 2CO.8.5
reference: 2 Corinthians 8:5
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ οὐ καθὼς ἠλπίσαμεν ἀλλ’ ἑαυτοὺς ἔδωκαν πρῶτον τῷ κυρίῳ καὶ ἡμῖν διὰ θελήματος θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/005.yaml
  text: And not as we expected[a], but they gave themselves first to the Lord and to us through the will of God[b],
translation:
  language: vi
  text: Không như chúng tôi đã mong đợi[a], nhưng trước hết họ đã dâng chính mình cho Chúa, rồi cho chúng tôi, theo ý muốn của Đức Chúa Trời[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đã hy vọng.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “bởi ý muốn của Đức Chúa Trời” hoặc “do ý muốn của Đức Chúa Trời.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς ἠλπίσαμεν
  choice: như chúng tôi đã mong đợi
  rationale: Động từ ἐλπίζω có thể mang nghĩa “hy vọng” hoặc, trong ngữ cảnh này, điều người ta trông đợi. “Mong đợi” là cách nói tự nhiên, đồng thời giữ được sắc thái mong mỏi mà không thu hẹp nghĩa vào dự đoán đơn thuần.
- source_word: ἑαυτοὺς ἔδωκαν
  choice: họ đã dâng chính mình
  rationale: Giữ rõ đại từ phản thân và ý nghĩa tự hiến, không giản lược câu thành việc họ chỉ dâng tiền. “Dâng” phù hợp với đối tượng là Chúa và vẫn có thể dùng cho sự tự nguyện đặt mình vào việc phục vụ các sứ đồ.
- source_word: πρῶτον
  choice: trước hết
  rationale: Diễn đạt tự nhiên tính ưu tiên của πρῶτον, có thể bao hàm cả thứ tự lẫn tầm quan trọng mà không giải thích quá mức.
- source_word: τῷ κυρίῳ
  choice: cho Chúa
  rationale: κύριος ở đây chỉ Chúa trong cách dùng của Phao-lô; “Chúa” là cách dịch trang trọng, quen thuộc và không thêm diễn giải ngoài văn bản.
- source_word: καὶ ἡμῖν
  choice: rồi cho chúng tôi
  rationale: “Rồi” làm rõ trình tự do πρῶτον chi phối trong tiếng Việt, nhưng không đặt các sứ đồ ngang hàng với Chúa. Cấu trúc “dâng chính mình… cho chúng tôi” vẫn giữ ý họ cam kết cộng tác trong sứ vụ.
- source_word: διὰ θελήματος θεοῦ
  choice: qua ý muốn của Đức Chúa Trời
  rationale: “Qua” bám sát διά với sở hữu cách và giữ mở các sắc thái phương tiện, tác động, sự chuẩn thuận hoặc sự phù hợp với ý muốn Đức Chúa Trời.
theological_decisions:
- issue: Mối quan hệ giữa việc dâng chính mình cho Chúa và cho các sứ đồ
  choice: Bản dịch trình bày việc tự dâng trước hết hướng về Chúa, rồi hướng đến Phao-lô và các cộng sự trong sự phục vụ.
  alternative: Có thể hiểu đây là sự tận hiến theo hai hướng, không nhấn mạnh một trật tự phẩm cấp ngoài từ “trước hết”.
  rationale: πρῶτον cùng thứ tự của hai bổ ngữ chỉ sự ưu tiên dành cho Chúa. Bản dịch giữ trình tự ấy nhưng không phát triển thành một khẳng định giáo hội học mạnh hơn.
- issue: Sắc thái của διὰ θελήματος θεοῦ
  choice: Dùng “qua ý muốn của Đức Chúa Trời” để giữ sự mơ hồ giữa tác động, phương tiện, sự chuẩn thuận và sự phù hợp.
  alternative: “bởi ý muốn của Đức Chúa Trời” hoặc “theo ý muốn của Đức Chúa Trời”.
  rationale: Cụm Hy Lạp cho phép nhiều sắc thái; không nên âm thầm giới hạn nó vào chỉ nguyên nhân hay chỉ sự phù hợp.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. “Dâng chính mình” giữ sức nặng của hành động tự hiến; “trước hết… rồi…” tạo câu tự nhiên và thể hiện thứ tự của nguyên văn. Mọi dấu chú thích đều có mặt trong chính văn.
