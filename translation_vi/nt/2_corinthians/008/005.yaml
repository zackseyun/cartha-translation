  to: Không như chúng tôi đã mong đợi[a], nhưng trước hết họ đã dâng chính mình cho Chúa, rồi cho chúng tôi, theo ý muốn của Đức Chúa Trời[b].
  rationale: Chỉ sửa cách diễn đạt “qua ý muốn” thành “theo ý muốn” vì đây là cách dùng tự nhiên hơn trong tiếng Việt chuẩn hiện đại. Bản dịch vẫn giữ tính mở của cụm διὰ θελήματος θεοῦ; các khả năng nhấn mạnh tác động hay nguyên do được giữ trong chú thích. Các phần còn lại trung thành với nguyên văn và không cần thay đổi.
