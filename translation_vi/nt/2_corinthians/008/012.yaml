id: 2CO.8.12
reference: 2 Corinthians 8:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἰ γὰρ ἡ προθυμία πρόκειται, καθὸ ἐὰν ⸀ἔχῃ εὐπρόσδεκτος, οὐ καθὸ οὐκ ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/012.yaml
  text: For if the readiness is present[a], it is acceptable according to what one has[b], not according to what one does not have.
translation:
  language: vi
  text: Vì nếu có lòng sẵn sàng[a], thì lòng ấy được chấp nhận tùy theo những gì người ta có[b], chứ không theo những gì người ta không có.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “lòng sốt sắng” hoặc “thiện ý”.
    reason: lexical_alternative
  - marker: b
    text: 'Sát nghĩa: “tùy theo bất cứ điều gì người ấy có … chứ không theo điều người ấy không có.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: προθυμία
  choice: lòng sẵn sàng
  rationale: Diễn tả một tâm thế tự nguyện và sốt sắng đã có; cách nói này tự nhiên trong tiếng Việt và phù hợp với ngữ cảnh chuẩn bị dâng hiến.
- source_word: πρόκειται
  choice: có
  rationale: Trong cấu trúc này, động từ nói đến sự hiện diện của tâm thế sẵn sàng, không phải nghĩa đen là được đặt ra trước mặt.
- source_word: καθὸ ἐὰν ἔχῃ
  choice: tùy theo những gì mình có
  rationale: Giữ ý về tiêu chuẩn hoặc mức độ dựa trên khả năng thực có; đại từ “mình” mang nghĩa khái quát, không giới hạn giới tính.
- source_word: εὐπρόσδεκτος
  choice: được chấp nhận
  rationale: Chuyển tải nghĩa được đón nhận hoặc nhìn nhận thuận lợi mà không thêm rõ chủ thể tiếp nhận khi nguyên văn không nêu.
- source_word: οὐ καθὸ οὐκ ἔχει
  choice: chứ không phải theo những gì mình không có
  rationale: Giữ nguyên thế đối xứng và tương phản trong tiếng Hy Lạp giữa điều một người có và điều người ấy không có.
- source_word: εἰ γὰρ
  choice: Vì nếu
  rationale: Bảo toàn cả quan hệ giải thích của γάρ lẫn điều kiện do εἰ biểu thị.
theological_decisions:
- issue: Chủ thể chấp nhận không được nêu rõ
  choice: Giữ cách nói thụ động “được chấp nhận” mà không xác định là trước mặt Đức Chúa Trời hay trước cộng đồng.
  alternative: “được Đức Chúa Trời chấp nhận” hoặc “được cộng đồng chấp nhận”
  rationale: εὐπρόσδεκτος nói đến sự chấp nhận nhưng câu không chỉ rõ bên tiếp nhận; bản dịch không nên tự giải quyết sự mở nghĩa này.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Lòng sẵn sàng” phù hợp ngữ cảnh dâng hiến; cấu trúc “tùy theo… chứ không phải theo…” giữ sự cân đối của nguyên văn.
