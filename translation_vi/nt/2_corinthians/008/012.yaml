  to: Vì nếu có lòng sẵn sàng[a], thì lòng ấy được chấp nhận tùy theo những gì người ta có[b], chứ không theo những gì người ta không có.
  rationale: 'Bản sửa phục hồi chủ ngữ của tính từ εὐπρόσδεκτος: chính “lòng sẵn sàng” được chấp nhận, chứ không phải con người được chấp nhận. Cụm “tùy theo những gì người ta có ... không theo những gì người ta không có” tiếp tục bảo toàn tính khái quát và thế đối xứng của καθὸ ἐὰν ἔχῃ ... οὐ καθὸ οὐκ ἔχει, mà không xác định bên chấp nhận.'
  reviewer_model: gpt-5.6-terra
