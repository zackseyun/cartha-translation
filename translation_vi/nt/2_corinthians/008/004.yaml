review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng lời khẩn xin mạnh mẽ (μετὰ πολλῆς παρακλήσεως δεόμενοι ἡμῶν), bối cảnh đặc ân được dự phần, và mục tiêu là các thánh đồ. Tuy nhiên, cách ghép “ân huệ tham gia” đã làm mờ hai bổ ngữ phối hợp riêng biệt τὴν χάριν καὶ τὴν κοινωνίαν. Cần biểu đạt rõ cả “ân huệ” lẫn hành động/sự dự phần.
  naturalness: “Họ hết sức nài xin chúng tôi” tự nhiên và trang trọng. “Cho họ được hưởng ân huệ và dự phần vào việc phục vụ...” vừa rõ cấu trúc vừa là tiếng Việt hiện đại tự nhiên.
  terminology: Giữ “ân huệ” cho χάρις, “dự phần” cho κοινωνία trong ngữ cảnh đóng góp/phục vụ, “việc phục vụ” cho διακονία, và “các thánh đồ” cho ἅγιοι. “Các thánh đồ” cần được hiểu theo cách dùng của Phao-lô là toàn thể tín hữu, không phải danh hiệu phong thánh.
