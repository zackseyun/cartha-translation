revisions:
- from: họ hết sức nài xin chúng tôi cho họ được ân huệ tham gia vào việc phục vụ các thánh đồ—[a]
  to: họ hết sức nài xin chúng tôi cho họ được hưởng ân huệ và dự phần vào việc phục vụ các thánh đồ—[a]
  rationale: Bản sửa khôi phục rõ ràng phép phối hợp τὴν χάριν καὶ τὴν κοινωνίαν mà vẫn giữ cách diễn đạt tiếng Việt gọn, hiện đại. Không thêm “này” cho διακονία, vì nguyên văn không có yếu tố chỉ định tương ứng. Dấu gạch ngang cuối câu được giữ để phản ánh câu tiếp diễn sang câu sau.
