  text: στελλόμενοι τοῦτο μή τις ἡμᾶς μωμήσηται ἐν τῇ ἁδρότητι ταύτῃ τῇ διακονουμένῃ ὑφ’ ἡμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/020.yaml
  text: taking this precaution, so that no one may blame us in regard to this generous gift being administered by us,
translation:
  language: vi
  text: Chúng tôi làm điều này để đề phòng, kẻo có ai chê trách chúng tôi[b] về khoản đóng góp hậu hĩnh này[a] do chúng tôi đảm trách.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “khoản đóng góp rộng rãi này” hoặc “sự dồi dào này”. Từ Hy Lạp có thể chỉ một khoản đóng góp lớn hoặc hào phóng.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “để khỏi có ai bắt lỗi chúng tôi”.
    reason: lexical_alternative
lexical_decisions:
- source_word: στελλόμενοι τοῦτο
  choice: Chúng tôi thận trọng làm như vậy
  rationale: Động từ ở thể trung mang ý thực hiện biện pháp phòng ngừa để tránh một vấn đề. Cách diễn đạt này tự nhiên trong tiếng Việt và liên kết rõ với mệnh đề chỉ mục đích theo sau.
- source_word: μή τις ἡμᾶς μωμήσηται
  choice: để không ai chê trách chúng tôi
  rationale: Cấu trúc μή với động từ giả định diễn tả điều cần ngăn ngừa; μωμάομαι có nghĩa là chê trách hoặc bắt lỗi. Bản dịch giữ trọng tâm về trách nhiệm giải trình.
- source_word: ἐν
  choice: về
  rationale: Giới từ ở đây chỉ vấn đề hoặc phạm vi có thể dẫn đến sự chê trách, không đơn thuần chỉ vị trí.
- source_word: ἁδρότητι ταύτῃ
  choice: khoản quyên góp dồi dào này
  rationale: ἁδρότης chỉ sự dồi dào, rộng rãi hoặc một khoản đóng góp lớn. Trong ngữ cảnh quyên góp cứu trợ, cách dịch này vừa nêu rõ vật được nói đến vừa giữ sắc thái phong phú của từ Hy Lạp.
- source_word: τῇ διακονουμένῃ ὑφ’ ἡμῶν
  choice: đang được chúng tôi quản lý
  rationale: Trong bối cảnh tài chính cứu trợ, διακονέω nói đến việc đảm trách và điều hành khoản quyên góp. “Quản lý” là cách nói rõ ràng, hiện đại, không tạo sắc thái giáo hội không cần thiết.
theological_decisions:
- issue: Mối quan tâm của Phao-lô khi xử lý khoản quyên góp
  choice: Nhấn mạnh biện pháp phòng ngừa nhằm tránh bị chê trách trong việc quản lý khoản quyên góp.
  alternative: Hiểu câu này chủ yếu là nói đến một sự sắp xếp thực tế, không nhấn mạnh trách nhiệm giải trình.
  rationale: Nguyên văn tập trung vào hành động phòng ngừa để không ai bắt lỗi Phao-lô và các cộng sự liên quan đến khoản quyên góp; bản dịch giữ trọng tâm đạo đức và trách nhiệm này mà không thêm kết luận giáo lý.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng vừa phải và dễ hiểu. “Khoản quyên góp” làm rõ ngữ cảnh tài chính; “thận trọng làm như vậy” giữ sắc thái phòng ngừa; “quản lý” truyền đạt chức năng thực tế của διακονέω.
