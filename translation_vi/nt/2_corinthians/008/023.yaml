language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἴτε ὑπὲρ Τίτου, κοινωνὸς ἐμὸς καὶ εἰς ὑμᾶς συνεργός· εἴτε ἀδελφοὶ ἡμῶν, ἀπόστολοι ἐκκλησιῶν, δόξα Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/023.yaml
  text: As for Titus[a], he is my partner and fellow worker for you; as for our brothers, they are messengers of the churches[b], the glory of Messiah.
translation:
  language: vi
  text: Còn về Tít, anh ấy là người cộng sự của tôi và là người cùng làm việc vì anh chị em; còn các anh em của chúng tôi, họ là những sứ giả của các hội thánh[a], là vinh quang của Đấng Mê-si[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “các sứ đồ của các hội thánh.” Từ Hy Lạp có thể chỉ những sứ giả hoặc đại biểu được ủy nhiệm, hay các sứ đồ theo nghĩa rộng; trong ngữ cảnh này, nghĩa “đại diện của các hội thánh” phù hợp hơn.
    reason: alternative_reading
  - marker: b
    text: Cũng có thể dịch là “vinh quang của Đấng Christ.” Ở đây dùng “Đấng Mê-si” vì Χριστός mang chức năng của một tước hiệu.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴτε ὑπὲρ Τίτου
  choice: Còn về Tít
  rationale: Cấu trúc tỉnh lược εἴτε... εἴτε nêu hai trường hợp song song. “Còn về” diễn đạt tự nhiên chức năng chuyển đề của câu, trong khi ὑπέρ mang nghĩa “liên quan đến/về” ở đây.
- source_word: κοινωνὸς ἐμὸς
  choice: người cộng sự của tôi
  rationale: κοινωνός chỉ người cùng chia sẻ hoặc tham gia vào một công việc; “người cộng sự” vừa tự nhiên vừa giữ được ý nghĩa quan hệ và phục vụ chung.
- source_word: εἰς ὑμᾶς συνεργός
  choice: cùng làm việc với tôi vì anh chị em
  rationale: συνεργός là người cùng làm việc, còn εἰς ὑμᾶς hướng công việc ấy đến các tín hữu Cô-rinh-tô. “Vì anh chị em” giữ hướng quy chiếu mà không thêm ý “vì lợi ích” vốn không được nói rõ trong nguyên văn.
- source_word: ἀδελφοὶ ἡμῶν
  choice: các anh em của chúng tôi
  rationale: Danh từ Hy Lạp ở giống đực số nhiều và trong ngữ cảnh chỉ các nam đại diện được cử đi; vì vậy giữ cách gọi “các anh em” thay vì mở rộng trung tính về giới.
- source_word: ἀπόστολοι ἐκκλησιῶν
  choice: những sứ giả của các hội thánh
  rationale: ἀπόστολοι có thể chỉ các sứ đồ hoặc những người được sai phái. Ngữ cảnh về các đại diện của hội thánh phụ trách việc quyên góp nghiêng về nghĩa “sứ giả,” nhưng chú thích bảo lưu cách hiểu khác.
- source_word: δόξα Χριστοῦ
  choice: vinh quang của Đấng Mê-si
  rationale: Cụm danh từ tỉnh lược được giữ trực tiếp, mô tả các anh em ấy là “vinh quang” của Χριστός. “Đấng Mê-si” thể hiện Χριστός như một tước hiệu.
theological_decisions:
- issue: Nghĩa của ἀπόστολοι khi nói về các anh em không nêu tên
  choice: sứ giả của các hội thánh
  alternative: sứ đồ của các hội thánh
  rationale: Ngữ cảnh nói đến những người đại diện liên quan đến khoản quyên góp, và sở hữu cách “của các hội thánh” cho thấy họ là những người được các hội thánh sai phái. Chú thích vẫn giữ nghĩa rộng “sứ đồ” để không xóa bỏ độ mở từ vựng.
- issue: Cách dịch Χριστοῦ
  choice: của Đấng Mê-si
  alternative: của Đấng Christ
  rationale: Χριστός ở đây hoạt động như tước hiệu; “Đấng Mê-si” chuyển tải nghĩa của tước hiệu thay vì chỉ phiên âm theo truyền thống.
- issue: Quan hệ ngữ pháp của δόξα Χριστοῦ
  choice: là vinh quang của Đấng Mê-si
  alternative: làm rạng danh Đấng Mê-si
  rationale: Nguyên văn là một cụm danh từ đồng vị, không có động từ. Bản dịch giữ hình thức nhận diện trực tiếp và không biến nó thành phát biểu về tác dụng hay hành động.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “anh chị em” cho cộng đồng tín hữu được ngỏ lời, nhưng giữ “các anh em” đối với nhóm nam đại diện. Câu giữ hai vế “còn về... còn...” để phản ánh cấu trúc song song của nguyên văn.
