language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οὐ μόνον δὲ ἀλλὰ καὶ χειροτονηθεὶς ὑπὸ τῶν ἐκκλησιῶν συνέκδημος ἡμῶν ⸀σὺν τῇ χάριτι ταύτῃ τῇ διακονουμένῃ ὑφ’ ἡμῶν πρὸς τὴν ⸀αὐτοῦ τοῦ κυρίου δόξαν καὶ προθυμίαν ἡμῶν—
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/019.yaml
  text: And not only that[d][c][b][a], but he was also appointed by the churches as our traveling companion with this gracious gift that is being administered by us for the glory of the Lord himself and our eagerness—
translation:
  language: vi
  text: Không những thế, ông còn được các hội thánh chọn[a] làm bạn đồng hành với chúng tôi trong việc lo liệu ân huệ này[b], là ân huệ chúng tôi đang đảm trách, để tôn vinh chính Chúa[c] và cho thấy lòng sốt sắng của chúng tôi—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “được các hội thánh chỉ định.”'
    reason: lexical_alternative
  - marker: b
    text: 'Hay: “ân điển này”; trong văn mạch, từ Hy Lạp cũng có thể chỉ việc quyên góp như một ân huệ.'
    reason: lexical_alternative
  - marker: c
    text: 'Cụm từ Hy Lạp cô đọng. Cũng có thể hiểu: “để tôn vinh Chúa,” hoặc, nếu hiểu theo nghĩa sở hữu, “vì vinh hiển của Chúa của người ấy/ngài.”'
    reason: alternative_reading
lexical_decisions:
- source_word: χειροτονηθεὶς
  choice: được các hội thánh chọn
  rationale: Diễn đạt việc các hội thánh chỉ định người này mà không hàm ý nhất thiết có một thủ tục bỏ phiếu theo nghĩa hiện đại.
- source_word: ἐκκλησιῶν
  choice: các hội thánh
  rationale: Trong văn mạch Phao-lô, từ này chỉ các cộng đồng tín hữu địa phương; “hội thánh” là cách gọi tự nhiên và quen thuộc trong tiếng Việt.
- source_word: συνέκδημος
  choice: bạn đồng hành với chúng tôi trong chuyến đi
  rationale: Giữ rõ ý người cùng đi trong hành trình, đồng thời tạo chỗ gắn tự nhiên cho cụm σὺν τῇ χάριτι ταύτῃ.
- source_word: χάριτι
  choice: ân huệ này
  rationale: χάρις ở đây vừa liên hệ đến ân điển vừa chỉ việc quyên góp cụ thể; “ân huệ” giữ được sắc thái ân nghĩa mà không thu hẹp hoàn toàn thành tiền quyên góp.
- source_word: διακονουμένῃ
  choice: đang được chúng tôi phục vụ
  rationale: Dạng bị động chỉ việc ân huệ này được Phao-lô và các cộng sự đảm trách như một sự phục vụ; cách dịch tránh thu hẹp nghĩa thành phân phát hay quản lý tài chính.
- source_word: πρὸς
  choice: nhằm
  rationale: Ở đây giới từ biểu thị mục đích hoặc hướng đến kết quả.
- source_word: αὐτοῦ τοῦ κυρίου
  choice: chính Chúa
  rationale: Hiểu αὐτοῦ theo nghĩa nhấn mạnh đi với τοῦ κυρίου, nhưng ghi chú cách hiểu sở hữu khác vì cấu trúc Hy Lạp cô đọng.
- source_word: δόξαν
  choice: làm vinh hiển
  rationale: Trong kết cấu mục đích tiếng Việt, động từ hóa “vinh hiển” diễn đạt tự nhiên mục tiêu hướng đến δόξα của Chúa.
- source_word: προθυμίαν
  choice: lòng sốt sắng
  rationale: Diễn đạt sự sẵn lòng nhiệt thành mà không thêm đối tượng “giúp đỡ” vốn không được nêu trực tiếp trong nguyên văn.
theological_decisions:
- issue: Ý nghĩa và sở chỉ của αὐτοῦ trong πρὸς τὴν αὐτοῦ τοῦ κυρίου δόξαν
  choice: “làm vinh hiển chính Chúa,” hiểu αὐτοῦ là yếu tố nhấn mạnh cho “Chúa”
  alternative: “vì vinh hiển của Chúa ấy/người ấy” hoặc “vì vinh hiển của Chúa”
  rationale: Cấu trúc có thể được hiểu theo hơn một cách. Bản chính dùng cách hiểu nhấn mạnh, còn chú thích bảo lưu khả năng đọc theo nghĩa sở hữu.
- issue: Quan hệ của “lòng sốt sắng của chúng tôi” với mục đích của việc phục vụ
  choice: 'Giữ song song với việc làm vinh hiển Chúa: “nhằm làm vinh hiển chính Chúa và bày tỏ lòng sốt sắng của chúng tôi”'
  alternative: “vì vinh hiển của chính Chúa và lòng sốt sắng của chúng tôi”
  rationale: πρὸς chi phối cả hai danh ngữ. Thêm “bày tỏ” giúp câu tiếng Việt tự nhiên nhưng không xác định lòng sốt sắng hướng tới một hành động cụ thể nào.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Câu giữ dấu gạch ngang cuối câu vì nguyên văn tiếp nối sang câu sau. Các thuật ngữ “hội thánh,” “ân huệ,” “vinh hiển” duy trì sắc thái Kinh Thánh quen thuộc mà không áp đặt cách hiểu hệ phái.
