  text: ὅτι κατὰ δύναμιν, μαρτυρῶ, καὶ ⸀παρὰ δύναμιν, αὐθαίρετοι
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/003.yaml
  text: For[a], I testify, they gave according to their ability, and beyond their ability, of their own accord[b],
translation:
  language: vi
  text: Vì tôi làm chứng rằng họ đã đóng góp theo khả năng[a], và còn vượt quá khả năng của mình, tự nguyện[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “theo tài lực của họ, và vượt quá tài lực ấy.”'
    reason: lexical_alternative
  - marker: b
    text: 'Hay: “tự ý” hoặc “do chính họ chủ động.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Vì
  rationale: Trong mạch văn, ὅτι dẫn vào lời giải thích làm cơ sở cho câu trước; “Vì” diễn đạt tự nhiên chức năng liên kết này.
- source_word: κατὰ δύναμιν
  choice: theo khả năng
  rationale: κατά với δύναμις chỉ chuẩn mực hoặc mức độ. Cách dịch này giữ ý họ dâng hiến tương xứng với năng lực hay nguồn lực mình có.
- source_word: μαρτυρῶ
  choice: tôi làm chứng
  rationale: Giữ sắc thái xác nhận trực tiếp và nhấn mạnh của động từ hiện tại, đồng thời phù hợp với văn phong trang trọng, dễ hiểu.
- source_word: καὶ παρὰ δύναμιν
  choice: thậm chí vượt quá khả năng của mình
  rationale: παρά với đối cách biểu thị vượt khỏi giới hạn; “thậm chí” làm rõ sức nhấn của καί trong thế đối xứng với κατὰ δύναμιν.
- source_word: αὐθαίρετοι
  choice: hoàn toàn do chính họ tự nguyện
  rationale: Tính từ này mô tả việc hành động theo ý muốn và sáng kiến của chính mình, không do ép buộc; cách diễn đạt tiếng Việt giữ được cả tính tự nguyện lẫn sắc thái tự mình chủ động.
theological_decisions:
- issue: Động từ được hiểu ngầm với αὐθαίρετοι
  choice: Bổ sung “đã dâng hiến” từ văn cảnh để câu tiếng Việt đầy đủ và tự nhiên.
  alternative: Dịch sát cấu trúc tỉnh lược là “họ tự nguyện”, không nêu lại hành động.
  rationale: Bản Hy Lạp dùng αὐθαίρετοι ở vị trí vị ngữ và lược bỏ hành động đã rõ từ văn cảnh về việc quyên góp. Bổ sung “đã dâng hiến” không thêm một ý thần học mới mà chỉ làm hiện rõ điều câu Hy Lạp hàm ý.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng thông dụng. Cấu trúc giữ thế đối xứng giữa “theo khả năng” và “vượt quá khả năng”; “dâng hiến” được bổ sung từ văn cảnh để chuyển câu tỉnh lược Hy Lạp sang tiếng Việt tự nhiên.
