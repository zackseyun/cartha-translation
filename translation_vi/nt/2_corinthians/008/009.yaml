reference: 2 Corinthians 8:9
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: γινώσκετε γὰρ τὴν χάριν τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, ὅτι δι’ ὑμᾶς ἐπτώχευσεν πλούσιος ὤν, ἵνα ὑμεῖς τῇ ἐκείνου πτωχείᾳ πλουτήσητε.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/009.yaml
  text: For you know the grace of our Lord Jesus Christ[a], that though he was rich, yet for your sake he became poor[b], so that you by his poverty might become rich.
translation:
  language: vi
  text: Vì anh em biết ân điển của Đức Giê-su Christ, Chúa chúng ta, rằng dù Ngài vốn giàu có, Ngài đã trở nên nghèo khó vì anh em, để nhờ sự nghèo khó của Ngài mà anh em trở nên giàu có.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γινώσκετε
  choice: anh em biết
  rationale: Động từ hiện tại ngôi thứ hai số nhiều nói đến điều tín hữu Cô-rinh-tô đã biết; “anh em biết” tự nhiên và chính xác trong tiếng Việt.
- source_word: χάριν
  choice: ân điển
  rationale: χάρις ở đây vừa chỉ ân huệ nhưng không của Đấng Christ vừa gợi hành động ban cho đầy nhân từ trong văn mạch. “Ân điển” giữ được chiều sâu thần học mà không loại bỏ hàm ý về lòng rộng rãi.
- source_word: κυρίου
  choice: Chúa
  rationale: Danh xưng chuẩn cho κύριος, giữ ý nghĩa về thẩm quyền và trọng lượng Cơ Đốc học.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Đức Chúa Jêsus Christ
  rationale: Cách gọi quen thuộc, trang trọng trong tiếng Việt Cơ Đốc; chú thích nêu nghĩa danh hiệu của Χριστός để người đọc không hiểu đơn thuần như họ tên.
- source_word: δι’ ὑμᾶς
  choice: vì anh em
  rationale: διά với đối cách có sắc thái vì lợi ích của người khác; trong tiếng Việt, “vì anh em” ngắn gọn và tự nhiên, diễn đạt việc Ngài hành động vì lợi ích của họ.
- source_word: πλούσιος ὤν
  choice: Ngài vốn giàu có
  rationale: “Vốn” vừa truyền đạt trạng thái có trước vừa cho thấy sự tương phản nhượng bộ với việc trở nên nghèo, không cần thêm liên từ nặng nề.
- source_word: ἐπτώχευσεν
  choice: Ngài đã trở nên nghèo khó
  rationale: Giữ chuyển biến chủ động từ giàu sang nghèo khó mà động từ aorist diễn tả, không xác định quá mức cách thức.
- source_word: τῇ ἐκείνου πτωχείᾳ
  choice: nhờ sự nghèo khó của Ngài
  rationale: Dữ cách chỉ phương tiện được diễn đạt tự nhiên bằng “nhờ”; đại từ ἐκείνου quy chiếu nhấn mạnh đến chính Ngài.
- source_word: πλουτήσητε
  choice: anh em có thể trở nên giàu có
  rationale: Diễn đạt mệnh đề mục đích với ἵνα và giữ phép đối xứng “trở nên nghèo khó / trở nên giàu có”; “có thể” tránh biến thể giả định thành lời khẳng định máy móc.
theological_decisions:
- issue: Ý nghĩa của việc Đấng Christ “giàu có” và tín hữu “trở nên giàu có”
  choice: Giữ nguyên hình ảnh giàu–nghèo mà không định rõ đó là vinh quang tiền nhập thể, địa vị Mê-si-a, của cải vật chất hay phước lành cứu rỗi.
  alternative: Giải thích cụ thể rằng sự giàu có của Ngài là vinh quang thần tính có trước, hoặc sự giàu có của tín hữu chỉ là phước lành thuộc linh.
  rationale: Bản Hy Lạp không định nghĩa rõ các phương diện của ẩn dụ. Văn mạch nối sự tự hạ của Đấng Christ với lời kêu gọi rộng rãi, nên bản dịch cần giữ cả chiều sâu thần học lẫn sức thúc đẩy đạo đức.
- issue: Sắc thái của πλούσιος ὤν
  choice: Dùng “vốn giàu có” để biểu đạt trạng thái có trước và sự tương phản.
  alternative: Dịch sát cấu trúc là “đang khi giàu có” hoặc giải thích thành “mặc dù Ngài ở trong vinh quang thiên thượng”.
  rationale: Cách chọn này truyền đạt hợp lý sức nhượng bộ của phân từ mà không thêm một cách giải nghĩa Cơ Đốc học không được câu này nói rõ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” cho số nhiều trong cộng đồng tín hữu; viết hoa đại từ chỉ Chúa theo lối văn Kinh Thánh Việt ngữ quen thuộc. Dấu hai chấm sau “Christ” giúp giới thiệu nội dung của ὅτι một cách tự nhiên trong tiếng Việt.
