id: 2CO.8.18
reference: 2 Corinthians 8:18
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: συνεπέμψαμεν δὲ μετ’ αὐτοῦ τὸν ἀδελφὸν οὗ ὁ ἔπαινος ἐν τῷ εὐαγγελίῳ διὰ πασῶν τῶν ἐκκλησιῶν—
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/018.yaml
  text: And we sent with him the brother whose praise in the gospel is throughout all the churches—[a]
translation:
  language: vi
  text: Chúng tôi cũng đã cử người anh em đi cùng ông ấy, là người được tất cả các Hội Thánh khen ngợi về Tin Lành—[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “người anh em có tiếng khen về Tin Lành giữa tất cả các Hội Thánh.”'
    reason: Giữ lại cách diễn đạt danh từ của οὗ ὁ ἔπαινος và sắc thái thay thế của ἐν τῷ εὐαγγελίῳ cùng διὰ πασῶν τῶν ἐκκλησιῶν.
lexical_decisions:
- source_word: συνεπέμψαμεν δὲ
  choice: Chúng tôi cũng đã cử
  rationale: Động từ aorist trình bày việc cử đi như một hành động đã thực hiện; tiền tố σύν và cụm theo sau diễn tả người này được cử đi cùng người khác. δέ là từ nối nhẹ, được diễn đạt tự nhiên bằng “cũng” trong mạch văn.
- source_word: μετ’ αὐτοῦ
  choice: cùng với ông ấy
  rationale: μετά với sở hữu cách chỉ sự đồng hành. “Ông ấy” phù hợp với một người nam đã được nhắc đến trước đó và giữ giọng văn trang trọng, tự nhiên.
- source_word: τὸν ἀδελφόν
  choice: người anh em
  rationale: Chỉ một nam tín hữu cụ thể, quen biết trong bối cảnh các cộng sự được sai đi; không thêm “của chúng tôi” vì nguyên văn không có.
- source_word: οὗ ὁ ἔπαινος
  choice: được … khen ngợi
  rationale: Chuyển cấu trúc danh từ sở hữu sang thể bị động tự nhiên trong tiếng Việt, vẫn giữ ý người này nhận được lời khen.
- source_word: ἐν τῷ εὐαγγελίῳ
  choice: về Tin Lành
  rationale: Diễn tả mối liên hệ hoặc phương diện của lời khen mà không thu hẹp thành việc giảng đạo hay một chức vụ cụ thể.
- source_word: διὰ πασῶν τῶν ἐκκλησιῶν
  choice: được tất cả các Hội Thánh khen ngợi
  rationale: διά với sở hữu cách ở đây chỉ phạm vi lan rộng qua toàn thể các hội thánh; cách diễn đạt này tự nhiên trong tiếng Việt và cho thấy sự công nhận rộng khắp.
- source_word: ἐκκλησιῶν
  choice: các Hội Thánh
  rationale: Trong văn mạch Phao-lô, từ này chỉ các cộng đồng Cơ Đốc địa phương; “Hội Thánh” là cách gọi rõ ràng và trang trọng.
theological_decisions:
- issue: Thân phận và giới tính của ἀδελφός
  choice: “người anh em,” chỉ một nam tín hữu và cộng sự cụ thể
  alternative: “một tín hữu” hoặc cách gọi chung không nêu giới tính
  rationale: Danh từ giống đực số ít có mạo từ, trong bối cảnh cử người đi, hướng đến một người nam xác định; bản dịch không làm mờ chi tiết này.
- issue: Sắc thái của ἐν τῷ εὐαγγελίῳ
  choice: “về Tin Lành”
  alternative: “trong việc rao giảng Tin Lành” hoặc “vì công tác Tin Lành”
  rationale: Nguyên văn chỉ xác định lời khen có liên hệ với Tin Lành, không nói rõ đó là việc rao giảng hay một chức vụ; bản dịch giữ độ mở này.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “cử” cho hành động sai phái, “người anh em” cho nam tín hữu cụ thể, và viết hoa “Tin Lành”, “Hội Thánh” theo văn phong Kinh Thánh tiếng Việt.
