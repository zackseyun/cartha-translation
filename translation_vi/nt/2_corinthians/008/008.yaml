- from: Tôi nói điều này không phải như một mệnh lệnh, nhưng qua sự sốt sắng của những người khác, tôi cũng muốn kiểm chứng tính chân thật của tình yêu thương nơi anh chị em.[a]
  to: Tôi nói điều này không phải như một mệnh lệnh, nhưng qua sự sốt sắng của những người khác, tôi cũng kiểm chứng tính chân thật của tình yêu thương nơi anh chị em.[a]
  rationale: Chỉ bỏ «muốn» để không thêm sắc thái ý định không được diễn đạt trong nguyên văn, đồng thời giữ cấu trúc, thuật ngữ, tính không xác định của «những người khác», và lực bổ sung của καί qua «cũng».
