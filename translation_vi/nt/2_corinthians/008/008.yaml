id: 2CO.8.8
reference: 2 Corinthians 8:8
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Οὐ κατ’ ἐπιταγὴν λέγω ἀλλὰ διὰ τῆς ἑτέρων σπουδῆς καὶ τὸ τῆς ὑμετέρας ἀγάπης γνήσιον δοκιμάζων·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/008.yaml
  text: I am not saying this as a command[b][a], but through the earnestness of others I am also testing the genuineness of your love.
translation:
  language: vi
  text: Tôi nói điều này không phải như một mệnh lệnh, nhưng qua sự sốt sắng của những người khác, tôi cũng kiểm chứng tính chân thật của tình yêu thương nơi anh chị em.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Kiểm chứng” cũng có thể dịch là “thử nghiệm” hoặc “chứng minh”; δοκιμάζω có thể chỉ việc đưa điều gì đó ra thử để xác nhận phẩm chất chân thật của nó.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιταγή
  choice: mệnh lệnh
  rationale: Cụm οὐ κατ’ ἐπιταγὴν λέγω phủ nhận việc Phao-lô nói theo cách ban một mệnh lệnh có thẩm quyền; “mệnh lệnh” tự nhiên và rõ nghĩa trong tiếng Việt hiện đại.
- source_word: διὰ τῆς ἑτέρων σπουδῆς
  choice: qua sự sốt sắng của những người khác
  rationale: διά với sở hữu cách diễn tả phương tiện hoặc cơ sở; “những người khác” giữ nguyên tính không xác định của ἑτέρων, không tự ý nêu đích danh người Ma-xê-đô-ni-a.
- source_word: σπουδή
  choice: sự sốt sắng
  rationale: Trong bối cảnh quyên góp, từ này chỉ thái độ nhiệt thành, nghiêm túc và sẵn lòng; “sốt sắng” truyền đạt tự nhiên các sắc thái ấy.
- source_word: ἀγάπη
  choice: tình yêu thương
  rationale: Cách dịch thông dụng, trang trọng và phù hợp với tình yêu được thể hiện bằng hành động rộng rãi.
- source_word: γνήσιον
  choice: tính chân thật
  rationale: Tính từ được danh từ hóa nói đến phẩm chất đích thực của tình yêu; “tính chân thật” giữ được trọng tâm về sự xác thực.
- source_word: δοκιμάζων
  choice: muốn kiểm chứng
  rationale: Phân từ hiện tại gắn với λέγω có thể diễn tả mục đích đồng thời của lời nói. “Kiểm chứng” giữ dải nghĩa thử nghiệm để nhận biết hoặc chứng minh phẩm chất, còn “muốn” diễn đạt tự nhiên sắc thái mục đích trong tiếng Việt.
- source_word: καί
  choice: cũng
  rationale: 'Giữ lực bổ sung của καί: bên cạnh việc viện đến sự sốt sắng của người khác, Phao-lô còn kiểm chứng tình yêu của người Cô-rinh-tô.'
- source_word: ὑμετέρας
  choice: nơi anh chị em
  rationale: Diễn đạt quyền sở hữu tập thể một cách tự nhiên, đồng thời tránh đại từ “các bạn” có sắc thái kém trang trọng trong văn bản Kinh Thánh.
theological_decisions:
- issue: Lập trường tu từ của Phao-lô đối với việc dâng hiến
  choice: Phao-lô nói rõ rằng ông không ban một mệnh lệnh, nhưng dùng sự sốt sắng của người khác để kiểm chứng tính chân thật của tình yêu nơi người Cô-rinh-tô.
  alternative: Hiểu lời này chỉ là cách nói giảm nhẹ một mệnh lệnh nhưng vẫn giữ nguyên sức bắt buộc.
  rationale: οὐ κατ’ ἐπιταγὴν λέγω là lời phủ nhận trực tiếp việc nói theo mệnh lệnh. Bản dịch không biến lời kêu gọi tự nguyện thành một yêu cầu bắt buộc, qua đó giữ nguyên sự căng thẳng giữa thẩm quyền sứ đồ và sự đáp ứng phát xuất từ tình yêu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Anh chị em” thể hiện đối tượng số nhiều trong cộng đồng Hội Thánh; câu giữ cấu trúc đối lập “không phải… nhưng…” và không nêu cụ thể “những người khác” là ai.
