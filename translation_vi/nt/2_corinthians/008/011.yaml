id: 2CO.8.11
reference: 2 Corinthians 8:11
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: νυνὶ δὲ καὶ τὸ ποιῆσαι ἐπιτελέσατε, ὅπως καθάπερ ἡ προθυμία τοῦ θέλειν οὕτως καὶ τὸ ἐπιτελέσαι ἐκ τοῦ ἔχειν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/011.yaml
  text: But now complete the doing of it also[a], so that just as there was the eagerness to will it[b], so also there may be the completion from what you have.
translation:
  language: vi
  text: Nhưng bây giờ, anh em cũng hãy hoàn tất việc ấy[a], để, cũng như anh em đã sốt sắng muốn làm, anh em cũng hoàn tất việc ấy tùy theo những gì anh em có[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “hãy làm cho xong việc ấy.”
    reason: lexical_alternative
  - marker: b
    text: 'Sát nghĩa: “từ những gì anh em có”; tức là tùy theo khả năng hiện có.'
    reason: lexical_alternative
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: Nhưng bây giờ
  rationale: Giữ cả sắc thái chuyển ý nhẹ của δέ và ý nghĩa thời gian của νυνί, đồng thời tự nhiên trong tiếng Việt.
- source_word: τὸ ποιῆσαι
  choice: việc làm ấy
  rationale: Diễn đạt danh hóa hành động đã được đề cập trước đó, tức việc đóng góp, mà không thêm đối tượng không có trong câu.
- source_word: ἐπιτελέσατε
  choice: hãy hoàn tất
  rationale: Thể hiện mệnh lệnh và nghĩa đưa một việc đã khởi sự đến chỗ hoàn thành.
- source_word: ἡ προθυμία τοῦ θέλειν
  choice: đã sốt sắng muốn làm
  rationale: προθυμία chỉ sự nhiệt tình, sẵn lòng; θέλειν nhấn mạnh ý muốn. Cách dịch này tự nhiên hơn lối sát chữ “sự sốt sắng của việc muốn”.
- source_word: τὸ ἐπιτελέσαι
  choice: hoàn thành
  rationale: Duy trì liên hệ từ vựng với ἐπιτελέσατε và giữ trọng tâm ở việc biến ý muốn thành hành động trọn vẹn.
- source_word: ἐκ τοῦ ἔχειν
  choice: tùy theo những gì mình có
  rationale: Diễn đạt nguồn lực hoặc mức độ dựa trên những gì hiện có, không hàm ý phải cho vượt quá khả năng.
theological_decisions:
- issue: Việc dâng hiến theo nguồn lực hiện có
  choice: Lời khuyên là hoàn tất khoản đóng góp dựa trên những gì họ đang có.
  alternative: Một lời kêu gọi chung phải thực hiện mọi ý định tốt bất kể khả năng.
  rationale: Ngữ cảnh trực tiếp nói về khoản đóng góp của người Cô-rinh-tô, còn ἐκ τοῦ ἔχειν giới hạn việc hoàn thành theo nguồn lực hiện có.
- issue: Mối tương ứng giữa ý muốn và sự hoàn thành
  choice: Giữ phép đối chiếu giữa sự sốt sắng muốn làm và việc thật sự hoàn thành.
  alternative: Hiểu câu này chỉ như lời khen về thiện chí.
  rationale: Cấu trúc καθάπερ… οὕτως καὶ đặt ý muốn và sự hoàn thành song song, nhưng lời mệnh lệnh cho thấy thiện chí cần được chuyển thành hành động.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “anh em” phù hợp lối xưng hô của thư tín Tân Ước; “sốt sắng” giữ sắc thái tích cực của προθυμία. Hai dấu chú thích [a], [b] đều xuất hiện trong chính văn.
