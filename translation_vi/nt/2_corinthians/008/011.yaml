review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng lời thúc giục hoàn tất việc đã khởi sự và giới hạn theo những gì hiện có. Tuy nhiên, việc lặp lại “cũng sốt sắng hoàn thành” thêm sắc thái “sốt sắng” vào vế τὸ ἐπιτελέσαι mà nguyên văn không có; nguyên văn đối chiếu sự sốt sắng/sẵn lòng với sự hoàn tất.
  naturalness: Câu sửa giữ văn phong hiện đại, rõ ràng và nhịp đối chiếu tự nhiên trong tiếng Việt. “Anh em” phù hợp với văn cảnh thư tín.
  terminology: “Hoàn tất” phản ánh tốt ἐπιτελέσατε/ἐπιτελέσαι. “Sốt sắng muốn làm” diễn đạt tự nhiên ἡ προθυμία τοῦ θέλειν. “Tùy theo những gì anh em có” diễn đạt đúng ý nguồn lực hoặc mức độ của ἐκ τοῦ ἔχειν, không áp đặt cách hiểu vượt quá khả năng.
  issues:
  - severity: medium
    issue: Bản nháp thêm “sốt sắng” vào hành động hoàn thành.
    rationale: Cụm “thì cũng sốt sắng hoàn thành” khiến προθυμία bổ nghĩa cho cả vế hoàn tất. Trong tiếng Hy Lạp, προθυμία chỉ thuộc về τοῦ θέλειν; vế song hành thứ hai chỉ nói đến sự hoàn tất từ những gì họ có.
