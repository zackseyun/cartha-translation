revisions:
- from: Nhưng bây giờ, anh em cũng hãy hoàn tất việc làm ấy[a], để như anh em đã sốt sắng muốn làm, thì cũng sốt sắng hoàn thành tùy theo những gì mình có[b].
  to: Nhưng bây giờ, anh em cũng hãy hoàn tất việc ấy[a], để, cũng như anh em đã sốt sắng muốn làm, anh em cũng hoàn tất việc ấy tùy theo những gì anh em có[b].
  rationale: Sửa vế sau để phép đối chiếu καθάπερ… οὕτως καὶ đặt “sốt sắng muốn làm” song song với “hoàn tất”, thay vì gán thêm tính từ “sốt sắng” cho hành động hoàn tất. Đồng thời giữ nguyên mệnh lệnh, ý hoàn thành, giới hạn theo nguồn lực hiện có, và các neo chú thích.
