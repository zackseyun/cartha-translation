  text: οὐ γὰρ ἵνα ἄλλοις ἄνεσις, ⸀ὑμῖν θλῖψις· ἀλλ’ ἐξ ἰσότητος
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/013.yaml
  text: For I do not mean that there should be relief for others and hardship for you, but equality[a]—
translation:
  language: vi
  text: Vì tôi không muốn người khác được nhẹ gánh, còn anh em phải chịu khó khăn, nhưng muốn có sự bình đẳng[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “sự công bằng”; từ Hy Lạp chỉ một thế cân bằng hợp lý, không nhất thiết là mọi người có tài sản hoàn toàn như nhau.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ γὰρ ἵνα
  choice: Vì không phải để
  rationale: γάρ nối câu này với lời kêu gọi trước đó bằng sắc thái giải thích; οὐ...ἵνα phủ nhận mục đích. Cách diễn đạt này tự nhiên trong tiếng Việt mà không cần thêm chủ ngữ “tôi” vốn chỉ được hàm ý.
- source_word: ἄλλοις
  choice: người khác
  rationale: Dạng tặng cách chỉ những người được hưởng tình trạng nhẹ gánh; “người khác” giữ đúng tính không xác định của từ Hy Lạp.
- source_word: ἄνεσις
  choice: được nhẹ gánh
  rationale: Trong bối cảnh quyên góp, từ này nói đến sự giảm bớt áp lực hay gánh nặng, không chỉ là sự an ủi về cảm xúc.
- source_word: ὑμῖν θλῖψις
  choice: anh em lại chịu khó khăn
  rationale: Cụm từ đối xứng với ἄλλοις ἄνεσις và chỉ khó khăn, áp lực thực tế có thể đè lên tín hữu Cô-rinh-tô. “Anh em” là cách xưng hô cộng đồng tự nhiên, còn “lại” làm rõ thế tương phản.
- source_word: ἀλλ’ ἐξ ἰσότητος
  choice: nhưng là để có sự bình đẳng
  rationale: ἰσότης có thể chỉ sự bình đẳng hay công bằng theo nghĩa cân bằng tương xứng. “Sự bình đẳng” là tương đương trực tiếp hơn, còn cách hiểu không tuyệt đối hóa được ghi trong chú thích; ἐξ được diễn đạt tự nhiên qua cấu trúc chỉ mục đích.
theological_decisions:
- issue: Ý nghĩa của ἰσότης trong việc chia sẻ vật chất
  choice: sự bình đẳng
  alternative: sự công bằng
  rationale: Giữ từ tương đương trực tiếp và sức căng trong lập luận của Phao-lô, nhưng không áp đặt ý niệm mọi người phải sở hữu hoàn toàn như nhau. Chú thích bảo lưu nghĩa “công bằng/cân bằng tương xứng” mà từ Hy Lạp cũng có thể mang.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “nhẹ gánh” đối lập tự nhiên với “chịu khó khăn”; dùng “anh em” theo lối xưng hô cộng đồng trong thư tín Tân Ước. Dấu gạch ngang cuối câu được giữ vì ý đang tiếp tục sang câu sau.
