revisions:
- from: Vì không phải để người khác được nhẹ gánh còn anh em lại chịu khó khăn, nhưng là để có sự bình đẳng[a]—
  to: Vì tôi không muốn người khác được nhẹ gánh, còn anh em phải chịu khó khăn, nhưng muốn có sự bình đẳng[a]—
  rationale: Sửa cấu trúc câu để tiếng Việt hoàn chỉnh và để quan hệ đối lập trong nguyên ngữ rõ hơn, bằng cách nêu chủ ý được hàm ý (“tôi không muốn … nhưng muốn”). Giữ nguyên ý nghĩa, thuật ngữ chính, chú thích, và dấu gạch ngang cho thấy câu tiếp tục sang câu 14.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T19:26:27Z'
review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng sự đối lập giữa sự giảm gánh cho người khác và khó khăn cho các tín hữu Cô-rinh-tô, đồng thời giữ được thuật ngữ trọng yếu ἰσότης. Tuy nhiên, “Vì không phải để … nhưng là để có …” khiến vế sau có vẻ lặp lại cấu trúc mục đích và làm mờ phần đối lập ἀλλ’ ἐξ ἰσότητος. Việc nêu rõ chủ ý được hàm ý trong câu Hy Lạp giúp câu tiếng Việt hoàn chỉnh và tự nhiên hơn.
  naturalness: “Vì tôi không muốn … nhưng muốn …” là cấu trúc hiện đại, rõ ràng và phù hợp với văn phong thư tín. Thêm “phải” trước “chịu khó khăn” diễn tả tự nhiên hơn gánh nặng không phải điều tác giả muốn áp lên người nhận.
  terminology: Giữ “sự bình đẳng” cho ἰσότης là phù hợp với tính tương đương trực tiếp và với mạch văn về sự quân bình trong các câu tiếp theo. Chú thích “sự công bằng” và “thế cân bằng hợp lý” cần được giữ để tránh hiểu từ này là sự đồng đều tuyệt đối về tài sản. “Anh em” phù hợp với lối xưng hô cộng đồng của thư tín Tân Ước.
  issues:
  - severity: low
    issue: Cấu trúc “không phải để … nhưng là để có …” chưa phản ánh rõ sự chuyển từ ἵνα ở vế đầu sang ἐξ ở vế đối lập.
    rationale: Câu Hy Lạp phủ định ý định rằng một bên được nhẹ gánh còn bên kia chịu áp lực, rồi nêu ἰσότης làm nguyên tắc đối lập. Diễn đạt bằng động từ “muốn” nêu rõ ý định hàm ẩn mà không áp đặt thêm nội dung.
  revised_text: Vì tôi không muốn người khác được nhẹ gánh, còn anh em phải chịu khó khăn, nhưng muốn có sự bình đẳng[a]—
