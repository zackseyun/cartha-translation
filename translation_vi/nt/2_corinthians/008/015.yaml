  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καθὼς γέγραπται· Ὁ τὸ πολὺ οὐκ ἐπλεόνασεν, καὶ ὁ τὸ ὀλίγον οὐκ ἠλαττόνησεν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/015.yaml
  text: 'as it is written: The one who had much did not have too much[a], and the one who had little did not have too little.'
translation:
  language: vi
  text: 'Như có lời chép: “Người có nhiều không dư, còn người có ít không thiếu.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc, theo sát cách diễn đạt của Xuất Hành 16:18: “Người thu lượm nhiều không có dư, còn người thu lượm ít không thiếu.”'
    reason: alternative_reading
lexical_decisions:
- source_word: καθὼς γέγραπται
  choice: như có lời chép
  rationale: Công thức quen thuộc dùng để dẫn Kinh Thánh; cách diễn đạt này tự nhiên, trang trọng và phản ánh thể hoàn thành γέγραπται như một lời chứng vẫn còn hiệu lực.
- source_word: Ὁ τὸ πολὺ
  choice: Người có nhiều
  rationale: Mạo từ đi với tính từ trung tính được dùng như danh từ, nghĩa là người có nhiều. Không thêm động từ “thu lượm” vì câu Hy Lạp của Phao-lô không nói rõ động từ ấy.
- source_word: ἐπλεόνασεν
  choice: không dư
  rationale: πλεονάζω ở đây chỉ tình trạng có phần vượt quá nhu cầu. “Không dư” ngắn gọn, tự nhiên và giữ thế đối xứng với “không thiếu”.
- source_word: ὁ τὸ ὀλίγον
  choice: người có ít
  rationale: Giữ cấu trúc song song với “người có nhiều” và diễn đạt đúng ý phân phối mà không đưa thêm bối cảnh thu lượm ma-na vào chính văn.
- source_word: ἠλαττόνησεν
  choice: không thiếu
  rationale: ἐλαττονέω trong ngữ cảnh này mang nghĩa không bị hụt hay không rơi vào cảnh thiếu thốn. “Không thiếu” là cách nói tiếng Việt rõ ràng và cân xứng với “không dư”.
theological_decisions:
- issue: Cách vận dụng lời trích Xuất Hành 16:18 trong bối cảnh chia sẻ và bình đẳng
  choice: Diễn đạt kết quả sở hữu/phân phối bằng “có nhiều… không dư” và “có ít… không thiếu,” không đưa “thu lượm” vào chính văn.
  alternative: “Người thu lượm nhiều không có dư, còn người thu lượm ít không bị thiếu.”
  rationale: Cách chọn giữ sát lời Hy Lạp mà Phao-lô trích và làm rõ trọng tâm trong mạch văn là không ai dư thừa trong khi người khác thiếu thốn. Chú thích vẫn bảo tồn mối liên hệ cụ thể với việc thu lượm ma-na trong Xuất Hành 16:18.
translation_notes:
  register: Tiếng Việt phổ thông hiện đại, trang trọng vừa phải và dễ hiểu. Cặp “không dư / không thiếu” tạo nhịp cân đối, súc tích, đồng thời bảo tồn sự đối lập của nguyên văn.
