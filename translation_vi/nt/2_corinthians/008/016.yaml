  text: Χάρις δὲ τῷ θεῷ τῷ ⸀διδόντι τὴν αὐτὴν σπουδὴν ὑπὲρ ὑμῶν ἐν τῇ καρδίᾳ Τίτου,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/016.yaml
  text: But thanks be to God[a], who puts the same earnestness for you into Titus's heart,
translation:
  language: vi
  text: Nhưng tạ ơn Đức Chúa Trời, Đấng đặt vào lòng Tít cùng một lòng nhiệt thành đối với anh chị em,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Χάρις δὲ τῷ θεῷ
  choice: Nhưng tạ ơn Đức Chúa Trời
  rationale: Công thức với χάρις và tặng cách τῷ θεῷ diễn tả lời cảm tạ dâng lên Đức Chúa Trời; δέ đánh dấu một bước chuyển nhẹ, được chuyển là “nhưng” theo mạch văn.
- source_word: τῷ διδόντι
  choice: Đấng đặt vào
  rationale: δίδωμι có nghĩa cơ bản là “ban/cho”, nhưng kết hợp với hình ảnh “trong lòng”, cách nói “đặt vào lòng” tự nhiên trong tiếng Việt và vẫn giữ ý Đức Chúa Trời tạo nên tâm tình ấy.
- source_word: τὴν αὐτὴν σπουδὴν
  choice: cùng một lòng nhiệt thành
  rationale: σπουδή ở đây chỉ sự sốt sắng, tận tâm và quan tâm thiết tha, không chỉ sự siêng năng; “cùng một” giữ nguyên αὐτήν và liên hệ với lòng nhiệt thành của Phao-lô trong ngữ cảnh.
- source_word: ὑπὲρ ὑμῶν
  choice: đối với anh chị em
  rationale: ὑπέρ diễn tả sự quan tâm hướng về người Cô-rinh-tô. “Đối với anh chị em” tự nhiên và tránh hàm ý thay thế không có trong ngữ cảnh.
- source_word: ἐν τῇ καρδίᾳ Τίτου
  choice: vào lòng Tít
  rationale: Nguyên văn dùng ἐν, nghĩa đen là “trong”, nhưng với δίδωμι, tiếng Việt tự nhiên nói “đặt vào lòng”. Hình ảnh về tâm tình nội tâm của Tít vẫn được giữ lại.
theological_decisions: []
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Dùng “Đức Chúa Trời” cho θεός và “anh chị em” cho đại từ số nhiều ὑμῶν nhằm nói rõ cộng đồng người nhận mà không thu hẹp giới tính. Dấu phẩy cuối câu được giữ vì câu Hy Lạp tiếp tục sang câu 17.
