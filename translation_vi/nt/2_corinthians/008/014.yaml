revisions:
- from: Trong hoàn cảnh hiện tại, sự dư dật của anh chị em dành cho sự thiếu thốn của họ, để sự dư dật của họ cũng dành cho sự thiếu thốn của anh chị em, nhờ đó có sự bình đẳng.[a]
  to: Vào lúc này, phần dư dật của anh chị em đáp ứng sự thiếu thốn của họ, để phần dư dật của họ cũng đáp ứng sự thiếu thốn của anh chị em, hầu có sự bình đẳng.[a]
  rationale: Đổi “Trong hoàn cảnh hiện tại” thành “Vào lúc này” để dịch trực tiếp và tự nhiên ἐν τῷ νῦν καιρῷ. Thêm “phần” và dùng động từ “đáp ứng” để câu tiếng Việt hoàn chỉnh, tự nhiên, đồng thời giữ nguyên cấu trúc lặp đối xứng của περίσσευμα và ὑστέρημα. Đổi “nhờ đó có” thành “hầu có” để bảo toàn quan hệ mục đích của ὅπως. Chú thích được chỉnh nhẹ để diễn đạt tự nhiên hơn, không thay đổi nội dung giải thích.
  reviewer_model: gpt-5.6-terra
