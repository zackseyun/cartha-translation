  source_fidelity: Bản dịch giữ đúng cấu trúc hỗ tương giữa phần dư dật và sự thiếu thốn. Tuy nhiên, “nhờ đó có” làm mờ sắc thái mục đích của ὅπως; cần dùng “để/hầu có”. Cụm “dành cho sự thiếu thốn” cũng chưa tự nhiên và thiếu một quan hệ từ rõ ràng trong tiếng Việt.
  naturalness: “Sự dư dật ... dành cho sự thiếu thốn” không phải cách kết hợp tự nhiên trong văn xuôi Việt hiện đại. “Phần dư dật ... đáp ứng sự thiếu thốn” vừa rõ vừa giữ tính đối xứng của nguyên văn.
  terminology: “Phần dư dật,” “sự thiếu thốn,” và “sự bình đẳng” phản ánh phù hợp περίσσευμα, ὑστέρημα, và ἰσότης. Chú thích bảo lưu đúng sắc thái rằng bình đẳng ở đây là sự cung ứng hỗ tương cân xứng, không nhất thiết là đồng nhất về tài sản.
