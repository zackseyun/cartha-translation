reference: 2 Corinthians 8:14
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐν τῷ νῦν καιρῷ τὸ ὑμῶν περίσσευμα εἰς τὸ ἐκείνων ὑστέρημα, ἵνα καὶ τὸ ἐκείνων περίσσευμα γένηται εἰς τὸ ὑμῶν ὑστέρημα, ὅπως γένηται ἰσότης·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/014.yaml
  text: At the present time[a], your abundance is for their need, so that their abundance may also be for your need, in order that there may be equality.
translation:
  language: vi
  text: Vào lúc này, phần dư dật của anh chị em đáp ứng sự thiếu thốn của họ, để phần dư dật của họ cũng đáp ứng sự thiếu thốn của anh chị em, hầu có sự bình đẳng.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hoặc “sự công bằng” hay “sự cân bằng”; từ Hy Lạp ở đây chỉ sự cung ứng hỗ tương cân xứng, không nhất thiết là mọi người có tài sản giống hệt nhau.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῷ νῦν καιρῷ
  choice: Trong hoàn cảnh hiện tại
  rationale: καιρός có thể chỉ một thời điểm gắn với hoàn cảnh cụ thể; cách dịch này tự nhiên trong tiếng Việt và giữ được sắc thái tình thế hiện thời.
- source_word: τὸ ὑμῶν περίσσευμα
  choice: sự dư dật của anh chị em
  rationale: περίσσευμα chỉ phần có nhiều hơn nhu cầu, trong văn cảnh này chủ yếu là của cải vật chất; “sự dư dật” giữ được độ rộng của từ mà không giới hạn vào tiền bạc.
- source_word: εἰς τὸ ἐκείνων ὑστέρημα
  choice: dành cho sự thiếu thốn của họ
  rationale: Cấu trúc εἰς với đối cách diễn tả sự hướng đến mục đích đáp ứng điều họ còn thiếu; “sự thiếu thốn” giữ rõ sắc thái thiếu hụt vật chất.
- source_word: ἵνα καὶ
  choice: để ... cũng
  rationale: “để” thể hiện quan hệ mục đích của ἵνα, còn “cũng” giữ ý hỗ tương do καί biểu đạt.
- source_word: τὸ ἐκείνων περίσσευμα
  choice: sự dư dật của họ
  rationale: Dùng cùng một cách dịch cho περίσσευμα nhằm bảo toàn cấu trúc đối xứng và tính hỗ tương trong lập luận.
- source_word: γένηται εἰς τὸ ὑμῶν ὑστέρημα
  choice: dành cho sự thiếu thốn của anh chị em
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt, đồng thời lặp lại cấu trúc của vế trước và không xác định cụ thể sự đáp ứng hỗ tương sẽ diễn ra bằng hình thức nào.
- source_word: ὅπως γένηται ἰσότης
  choice: nhờ đó có sự bình đẳng
  rationale: ἰσότης trực tiếp mang nghĩa bình đẳng hoặc công bằng; “nhờ đó” thể hiện kết quả được nhắm đến, còn chú thích bảo lưu sắc thái quân bình trong việc cung ứng lẫn nhau.
theological_decisions:
- issue: Ý nghĩa của ἰσότης trong lời kêu gọi đóng góp của Phao-lô
  choice: sự bình đẳng trong việc đáp ứng nhu cầu lẫn nhau
  alternative: sự công bằng hoặc sự quân bình
  rationale: Văn cảnh nói đến việc các tín hữu hỗ tương bù đắp sự thiếu thốn, chứ không trình bày một học thuyết xã hội trừu tượng hay đòi hỏi mọi người sở hữu hoàn toàn như nhau. “Sự bình đẳng” là từ tương đương trực tiếp, còn chú thích giải thích sắc thái theo văn cảnh.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Anh chị em” diễn đạt số nhiều ngôi thứ hai theo lối bao hàm, phù hợp lời Phao-lô nói với cả cộng đồng. Cấu trúc đối xứng được giữ lại để làm nổi bật tính hỗ tương của câu.
