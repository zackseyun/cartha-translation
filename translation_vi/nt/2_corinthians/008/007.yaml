id: 2CO.8.7
reference: 2 Corinthians 8:7
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀλλ’ ὥσπερ ἐν παντὶ περισσεύετε, πίστει καὶ λόγῳ καὶ γνώσει καὶ πάσῃ σπουδῇ καὶ τῇ ἐξ ⸂ἡμῶν ἐν ὑμῖν⸃ ἀγάπῃ, ἵνα καὶ ἐν ταύτῃ τῇ χάριτι περισσεύητε.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/007.yaml
  text: But just as you abound in everything—in faith and speech and knowledge and all diligence and in our love in you—see that you also abound in this grace[a][b].
translation:
  language: vi
  text: Nhưng cũng như anh em đang dồi dào trong mọi sự—trong đức tin, lời nói, sự hiểu biết, sự sốt sắng trọn vẹn, và tình yêu từ chúng tôi nơi anh em—thì anh em cũng hãy dồi dào trong ân điển này[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể hiểu là “tình yêu của anh em dành cho chúng tôi”. Cụm từ Hy Lạp này khó hiểu, và một số thủ bản chép “tình yêu của anh em ở trong chúng tôi”.
    reason: alternative_reading
  - marker: b
    text: Tức là công việc ban cho đầy ân điển này.
    reason: lexical_alternative
lexical_decisions:
- source_word: περισσεύετε / περισσεύητε
  choice: đang dư dật / hãy dư dật
  rationale: Giữ hình ảnh về sự phong phú và dùng cùng một cách dịch cho cả thực trạng hiện tại lẫn lời khích lệ.
- source_word: ἐν παντί
  choice: trong mọi sự
  rationale: Giữ phạm vi bao quát của cụm Hy Lạp và dẫn tự nhiên vào danh sách theo sau.
- source_word: πίστει
  choice: đức tin
  rationale: Nghĩa thông thường của πίστις phù hợp với danh sách các phẩm chất Cơ Đốc ở đây.
- source_word: λόγῳ
  choice: lời nói
  rationale: Trong danh sách này, λόγος có thể chỉ khả năng diễn đạt hoặc nói năng; “lời nói” tự nhiên và không giới hạn vào một phát ngôn riêng lẻ.
- source_word: γνώσει
  choice: sự hiểu biết
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt, phù hợp với nghĩa tri thức trong văn cảnh.
- source_word: πάσῃ σπουδῇ
  choice: mọi lòng sốt sắng
  rationale: σπουδή diễn tả sự nhiệt thành, nghiêm túc và chuyên cần; “lòng sốt sắng” phù hợp với danh sách phẩm chất.
- source_word: τῇ ἐξ ἡμῶν ἐν ὑμῖν ἀγάπῃ
  choice: tình yêu từ chúng tôi ở trong anh em
  rationale: Theo sát các giới từ của bản văn được chọn và không âm thầm giải quyết một cấu trúc khó, dù tiếng Việt có phần khác thường.
- source_word: χάριτι
  choice: ân điển
  rationale: Giữ chiều sâu thần học của χάρις, đồng thời chú thích làm rõ rằng trong văn cảnh từ này chỉ việc ban cho cách rộng rãi.
theological_decisions:
- issue: Ý nghĩa của χάρις trong bối cảnh cuộc quyên góp cho các thánh đồ
  choice: Dịch là “ân điển” trong chính văn.
  alternative: ân huệ; công việc đầy ân điển; việc ban tặng rộng rãi
  rationale: Phao-lô dùng χάρις với chiều sâu rộng hơn một thuật ngữ tài chính; chú thích nêu rõ đối tượng cụ thể mà không làm mất sắc thái thần học.
- issue: Cách hiểu τῇ ἐξ ἡμῶν ἐν ὑμῖν ἀγάπῃ
  choice: Giữ cách dịch sát là “tình yêu từ chúng tôi ở trong anh em”.
  alternative: tình yêu của anh em dành cho chúng tôi; tình yêu của chúng tôi ở trong anh em
  rationale: Cụm từ vừa khó về cú pháp vừa có dị bản. Chính văn giữ cấu trúc của bản SBLGNT, còn chú thích trình bày cách hiểu và dị bản quan trọng.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Cấu trúc khó về “tình yêu” được giữ tương đối sát để bảo toàn sự mơ hồ thật của bản văn; hai chú thích đều có ký hiệu tương ứng trong chính văn.
