source:
  edition: SBLGNT
  text: ⸂προνοοῦμεν γὰρ⸃ καλὰ οὐ μόνον ἐνώπιον κυρίου ἀλλὰ καὶ ἐνώπιον ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/021.yaml
  text: For we take thought for what is good[a], not only before the Lord but also before people.
translation:
  language: vi
  text: Vì chúng tôi lo liệu những điều tốt đẹp[a], không những trước mặt Chúa mà còn trước mặt người ta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “những điều đáng trọng” hoặc “những điều đúng đắn.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: προνοοῦμεν
  choice: chúng tôi quan tâm làm
  rationale: Động từ προνοέω diễn tả việc suy tính trước và chủ tâm lo liệu. Trong bối cảnh quản lý tiền quyên góp cách liêm chính, “quan tâm làm” tự nhiên trong tiếng Việt và thể hiện sự chủ động, có cân nhắc, chứ không chỉ là suy nghĩ suông.
- source_word: γὰρ
  choice: Vì
  rationale: γάρ nêu lý do giải thích cho lời ngay trước đó; “Vì” giữ rõ mạch lập luận của Phao-lô.
- source_word: καλὰ
  choice: điều tốt
  rationale: Dạng trung tính số nhiều καλὰ có thể chỉ những điều hoặc việc tốt đẹp, đáng trọng. “Điều tốt” giữ nghĩa đạo đức rộng của từ Hy Lạp; các sắc thái “điều đáng trọng” và “điều đúng đắn” được ghi ở chú thích.
- source_word: οὐ μόνον ... ἀλλὰ καὶ
  choice: không những ... mà còn
  rationale: Cấu trúc tương liên này được chuyển sang một cấu trúc tiếng Việt tự nhiên, giữ nguyên sự cân đối và nhấn mạnh của nguyên văn.
- source_word: ἐνώπιον
  choice: trước mặt
  rationale: ἐνώπιον có nghĩa là ở trước mặt hoặc trong tầm nhìn của ai đó. “Trước mặt” vừa gần hình ảnh nguyên văn vừa tự nhiên trong cả hai vế.
- source_word: κυρίου
  choice: Chúa
  rationale: κύριος ở đây được dịch theo cách gọi quen thuộc và trang trọng là “Chúa”.
- source_word: ἀνθρώπων
  choice: mọi người
  rationale: ἀνθρώπων chỉ con người nói chung, không riêng nam giới. “Mọi người” diễn đạt tự nhiên ý những người quan sát trong xã hội; từ “mọi” không nhằm tuyệt đối hóa từng cá nhân mà biểu thị phạm vi con người đối lập với Chúa.
theological_decisions:
- issue: Sắc thái đạo đức của καλὰ trong bối cảnh chịu trách nhiệm về tài chính
  choice: Dịch rộng là “điều tốt” trong chính văn
  alternative: “điều đáng trọng” hoặc “điều đúng đắn”
  rationale: Câu này nói đến cách hành xử đáng khen cả trước Chúa lẫn trước người đời. Tiếng Hy Lạp có thể nhấn mạnh điều tốt về mặt đạo đức nói chung hoặc điều đáng trọng, không thể chê trách trong mắt công chúng. Chính văn giữ nghĩa rộng, còn chú thích bảo tồn các sắc thái sát bối cảnh.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Quan tâm làm” diễn đạt sự lo liệu có chủ ý trong bối cảnh tài chính; “trước mặt” duy trì hình ảnh chung cho cả Chúa và con người. Dấu chú thích [a] được đặt ngay sau cụm từ liên quan.
