- from: Vì chúng tôi quan tâm làm điều tốt[a], không những trước mặt Chúa mà còn trước mặt mọi người.
  to: Vì chúng tôi lo liệu những điều tốt đẹp[a], không những trước mặt Chúa mà còn trước mặt người ta.
  rationale: Sửa “quan tâm làm điều tốt” thành “lo liệu những điều tốt đẹp” để phản ánh tốt hơn προνοοῦμεν và duy trì số nhiều trung tính của καλὰ. Đổi “mọi người” thành “người ta” để diễn đạt tự nhiên ἀνθρώπων như công chúng/những người quan sát. Chú thích được điều chỉnh theo số nhiều của chính văn.
