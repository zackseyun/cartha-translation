language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τὴν οὖν ἔνδειξιν τῆς ἀγάπης ὑμῶν καὶ ἡμῶν καυχήσεως ὑπὲρ ὑμῶν εἰς αὐτοὺς ⸀ἐνδεικνύμενοι εἰς πρόσωπον τῶν ἐκκλησιῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/024.yaml
  text: Therefore[b][a], show them before the churches the proof of your love and of our boasting about you.
translation:
  language: vi
  text: Vậy, hãy cho họ thấy, trước mặt các hội thánh, bằng chứng về tình yêu của anh chị em và về sự khoe mình của chúng tôi về anh chị em.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὖν
  choice: Vậy
  rationale: Diễn đạt tự nhiên quan hệ suy luận từ lời căn dặn ở phần trước.
- source_word: ἔνδειξιν
  choice: bằng chứng
  rationale: Chỉ sự biểu lộ cụ thể khiến tình yêu trở nên rõ ràng; “bằng chứng” vừa sát nghĩa vừa tự nhiên trong tiếng Việt.
- source_word: ἀγάπης
  choice: tình yêu
  rationale: Cách dịch thông thường của ἀγάπη; trong ngữ cảnh này đó là tình yêu được thể hiện bằng hành động.
- source_word: καυχήσεως
  choice: điều chúng tôi hãnh diện
  rationale: Giữ sắc thái tích cực của lời tự hào về tín hữu Cô-rinh-tô mà tránh để “khoe khoang” trong tiếng Việt bị hiểu mặc nhiên theo nghĩa xấu.
- source_word: ὑπὲρ ὑμῶν
  choice: nơi anh chị em
  rationale: Trong kết cấu với καύχησις, cụm từ nói đến điều Phao-lô hãnh diện liên quan đến người Cô-rinh-tô; cách nói này tự nhiên và không hàm ý ông hãnh diện thay họ.
- source_word: εἰς αὐτοὺς
  choice: cho họ thấy
  rationale: Đại từ chỉ các anh em là đại diện các hội thánh trong ngữ cảnh trước; tiếng Việt tự nhiên kết hợp với động từ “cho thấy”.
- source_word: ἐνδεικνύμενοι
  choice: hãy cho ... thấy
  rationale: Phân từ mang lực mệnh lệnh trong lời khuyên; cách dịch này thể hiện rõ lời kêu gọi hành động.
- source_word: εἰς πρόσωπον τῶν ἐκκλησιῶν
  choice: trước mặt các hội thánh
  rationale: Giữ hình ảnh công khai trước sự hiện diện hoặc đại diện của các hội thánh, đồng thời tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Sắc thái của καύχησις
  choice: điều chúng tôi hãnh diện nơi anh chị em
  alternative: sự khoe mình của chúng tôi về anh chị em
  rationale: Bản dịch chính giữ nội dung Phao-lô nói tốt và tự hào về họ nhưng không áp đặt nghĩa đạo đức tiêu cực vốn dễ gắn với “khoe khoang”; chú thích bảo lưu cách dịch sát hình thức hơn.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “anh chị em” cho số nhiều ὑμῶν; “các hội thánh” giữ cách dùng phổ biến của ἐκκλησίαι trong văn mạch Phao-lô.
