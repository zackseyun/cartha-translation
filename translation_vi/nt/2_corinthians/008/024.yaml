  to: Vậy, hãy cho họ thấy, trước mặt các hội thánh, bằng chứng về tình yêu của anh chị em và về sự khoe mình của chúng tôi về anh chị em.
  rationale: 'Bản sửa giữ nguyên quan hệ cú pháp: người Cô-rinh-tô phải cho các đại diện thấy bằng chứng vừa về tình yêu của mình vừa về sự khoe mình của Phao-lô về họ. “Sự khoe mình” bảo toàn καύχησις mà không áp đặt đánh giá đạo đức tiêu cực; không cần chú thích vì câu tiếng Việt đã diễn đạt trực tiếp nội dung nguồn.'
  reviewer_model: gpt-5.6-terra
