  text: ὅτι ἐν πολλῇ δοκιμῇ θλίψεως ἡ περισσεία τῆς χαρᾶς αὐτῶν καὶ ἡ κατὰ βάθους πτωχεία αὐτῶν ἐπερίσσευσεν εἰς ⸂τὸ πλοῦτος⸃ τῆς ἁπλότητος αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/002.yaml
  text: that in a severe test of affliction[b][a], the abundance of their joy and their deep poverty overflowed into the wealth of their generosity.
translation:
  language: vi
  text: 'Vì giữa cơn thử thách nặng nề của hoạn nạn, niềm vui chan chứa và cảnh nghèo khó đến tận cùng[a] của họ đã tràn ra thành sự giàu có của lòng rộng rãi[b] của họ.


    [a] Cũng có thể dịch: “cảnh nghèo khó tận đáy” hoặc “cảnh nghèo khó cùng cực.”


    [b] Cũng có thể dịch: “sự giàu có của lòng hào hiệp.” Từ Hy Lạp này cũng có thể mang nghĩa “sự đơn sơ” hoặc “lòng không phân hai”; nhưng trong văn cảnh quyên góp ở đây, có lẽ chỉ lòng rộng rãi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “cảnh nghèo khó tận đáy” hoặc “cảnh nghèo khó cùng cực.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “sự giàu có của lòng hào hiệp.” Từ Hy Lạp này cũng có thể mang nghĩa “sự đơn sơ” hoặc “lòng không phân hai”; nhưng trong văn cảnh quyên góp ở đây, có lẽ chỉ lòng rộng rãi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν πολλῇ δοκιμῇ θλίψεως
  choice: giữa cơn thử thách nặng nề của hoạn nạn
  rationale: “Cơn thử thách” thể hiện δοκιμή như một hoàn cảnh thử luyện; “nặng nề” chuyển tải πολλῇ, còn “của hoạn nạn” giữ quan hệ thuộc cách với θλίψεως mà không xác định quá mức quan hệ đó.
- source_word: ἡ περισσεία τῆς χαρᾶς αὐτῶν
  choice: niềm vui chan chứa của họ
  rationale: “Chan chứa” diễn đạt περισσεία là sự dư dật và đồng thời tạo sự liên kết tự nhiên với động từ “tràn thành” ở sau.
- source_word: ἡ κατὰ βάθους πτωχεία αὐτῶν
  choice: cảnh nghèo khó đến tận cùng của họ
  rationale: Cách dịch giữ hình ảnh chiều sâu trong κατὰ βάθους và diễn đạt sức nhấn mạnh của thành ngữ; chú thích ghi các cách dịch sát hoặc diễn giải hơn.
- source_word: ἐπερίσσευσεν
  choice: đã tràn thành
  rationale: “Tràn” giữ hình ảnh dư dật của περισσεύω, còn “thành” chuyển tải hướng kết quả của εἰς trong tiếng Việt tự nhiên.
- source_word: εἰς τὸ πλοῦτος
  choice: thành sự giàu có
  rationale: εἰς ở đây hướng đến kết quả; “thành” thể hiện quan hệ ấy, còn “sự giàu có” giữ ẩn dụ πλοῦτος.
- source_word: τῆς ἁπλότητος αὐτῶν
  choice: của lòng rộng rãi của họ
  rationale: Trong văn cảnh quyên góp, ἁπλότης nhiều khả năng nói đến lòng rộng rãi, hào hiệp; chú thích vẫn bảo tồn các nghĩa “đơn sơ,” “chân thành” và “không phân hai.”
theological_decisions:
- issue: Nghĩa của ἁπλότης trong văn cảnh dâng hiến vật chất
  choice: lòng rộng rãi
  alternative: sự đơn sơ; sự chân thành; lòng không phân hai; lòng hào hiệp
  rationale: Mạch văn đang nói về sự đóng góp cho các thánh đồ, nên sắc thái rộng rãi/hào hiệp phù hợp nhất. Vì từ này vẫn có thể nhấn mạnh sự đơn sơ hoặc tấm lòng không phân hai, các khả năng ấy được nêu trong chú thích thay vì bị loại bỏ.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại. “Ấy là” nối tự nhiên mệnh đề ὅτι với câu trước trong khi vẫn cho phép câu được trích riêng. Các hình ảnh về sự chan chứa, tràn ra, chiều sâu của nghèo khó và sự giàu có được giữ lại; chú thích ghi nhận độ rộng nghĩa mà bản chính phải chọn một cách diễn đạt rõ ràng.
