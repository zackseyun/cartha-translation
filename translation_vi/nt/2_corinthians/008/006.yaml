source:
  edition: SBLGNT
  text: εἰς τὸ παρακαλέσαι ἡμᾶς Τίτον ἵνα καθὼς προενήρξατο οὕτως καὶ ἐπιτελέσῃ εἰς ὑμᾶς καὶ τὴν χάριν ταύτην·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/006.yaml
  text: So we urged Titus that[a], just as he had previously begun, he should also complete among you this act of grace.
translation:
  language: vi
  text: Vì vậy, chúng tôi đã khuyên Tít để, như ông đã khởi sự từ trước, ông cũng hoàn tất nơi anh chị em công việc đầy ân huệ này.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “công việc ân huệ này”; sát chữ hơn: “ân huệ này.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακαλέσαι
  choice: khuyên
  rationale: Trong ngữ cảnh này, động từ nói đến việc Phao-lô thúc giục Tít hành động. “Khuyên” tự nhiên trong tiếng Việt và đủ sức diễn đạt lời đề nghị nghiêm túc mà không mang sắc thái ra lệnh.
- source_word: Τίτον
  choice: Tít
  rationale: Dùng dạng tên riêng quen thuộc trong truyền thống Kinh Thánh tiếng Việt hiện đại.
- source_word: καθὼς προενήρξατο
  choice: như ông đã bắt đầu từ trước
  rationale: 'Giữ sắc thái thời gian của động từ ghép προενάρχομαι: Tít đã khởi sự công việc này vào một dịp trước đó.'
- source_word: ἐπιτελέσῃ
  choice: hoàn tất
  rationale: Diễn đạt việc đưa công việc đã khởi sự đến chỗ hoàn thành; dạng giả định sau ἵνα được thể hiện tự nhiên trong cấu trúc lời khuyên gián tiếp.
- source_word: εἰς ὑμᾶς
  choice: giữa anh chị em
  rationale: Diễn tả công việc được thực hiện trong cộng đồng tín hữu Cô-rinh-tô. “Anh chị em” chuyển đại từ số nhiều theo lối xưng hô cộng đồng tự nhiên, bao gồm cả nam lẫn nữ.
- source_word: χάριν
  choice: công việc ân huệ
  rationale: Trong mạch văn quyên góp giúp các thánh đồ, χάρις chỉ một hoạt động cụ thể được định hình bởi ân huệ, chứ không chỉ một ý niệm trừu tượng. Cách dịch này giữ ngôn ngữ ân huệ đồng thời làm rõ đây là một công việc thực tế.
- source_word: καὶ τὴν χάριν ταύτην
  choice: cũng hoàn tất công việc ân huệ này
  rationale: Giữ lực bổ sung của καί và gắn đối tượng cụ thể này với động từ “hoàn tất” theo trật tự tự nhiên của tiếng Việt.
theological_decisions:
- issue: Ý nghĩa của χάρις trong bối cảnh cuộc quyên góp
  choice: “công việc ân huệ” chỉ việc phục vụ hay đóng góp cụ thể, đồng thời giữ cách Phao-lô nhìn công việc ấy dưới phương diện ân huệ.
  alternative: “ân huệ này” theo nghĩa sát chữ hơn, hoặc “món quà này” nhấn mạnh khoản đóng góp.
  rationale: Mạch văn 2 Cô-rinh-tô 8 nói về cuộc quyên góp và vai trò của Tít trong việc hoàn tất nó. Bản dịch không thu hẹp χάρις chỉ thành tiền bạc, cũng không để nó hoàn toàn trừu tượng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “chúng tôi,” “ông” và “anh chị em” để thể hiện rõ các bên trong câu; giữ nguyên sự căng giữa nghĩa thần học “ân huệ” và công việc quyên góp cụ thể.
