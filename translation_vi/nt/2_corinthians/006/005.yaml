  text: ἐν πληγαῖς, ἐν φυλακαῖς, ἐν ἀκαταστασίαις, ἐν κόποις, ἐν ἀγρυπνίαις, ἐν νηστείαις,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/005.yaml
  text: in beatings, in imprisonments, in riots, in labors, in sleepless nights, in fastings,
translation:
  language: vi
  text: trong những trận đánh đập, trong những lần bị giam cầm, trong những cảnh náo loạn, trong lao nhọc, trong những đêm thức trắng, trong những lần nhịn ăn,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πληγαῖς
  choice: đòn roi
  rationale: Diễn đạt tự nhiên những trận đánh đập, phù hợp với ngữ cảnh các gian khổ thể xác của Phao-lô.
- source_word: φυλακαῖς
  choice: cảnh tù đày
  rationale: Chuyển danh từ số nhiều chỉ những lần bị giam giữ thành cách nói tự nhiên trong tiếng Việt mà không làm mất ý trải nghiệm tù ngục.
- source_word: ἀκαταστασίαις
  choice: những cuộc bạo loạn
  rationale: Trong ngữ cảnh danh sách gian khổ và bản đối chiếu tiếng Anh, từ này chỉ tình trạng náo loạn hoặc bạo động mà Phao-lô phải đối diện; “bạo loạn” giữ được sắc thái biến động công cộng.
- source_word: κόποις
  choice: lao nhọc
  rationale: Giữ ý công việc vất vả, kiệt sức và phù hợp văn phong Kinh Thánh hiện đại.
- source_word: ἀγρυπνίαις
  choice: những đêm thức trắng
  rationale: Diễn đạt rõ các lần không ngủ hoặc phải thức đêm, thay vì dùng danh từ Hán-Việt khó hiểu.
- source_word: νηστείαις
  choice: những lần nhịn ăn
  rationale: Giữ sự mơ hồ của từ Hy Lạp giữa việc kiêng ăn có chủ ý và chịu thiếu ăn; không tự động quy định đây là nghi thức tôn giáo.
theological_decisions:
- issue: Ý nghĩa của νηστείαις
  choice: những lần nhịn ăn
  alternative: những lần kiêng ăn
  rationale: “Nhịn ăn” không mặc nhiên biến mọi trường hợp thành thực hành tôn giáo, đồng thời vẫn có thể bao hàm việc kiêng ăn có chủ ý; như vậy bảo toàn độ mở của nguyên ngữ.
- issue: Tác nhân gây ra ἀγρυπνίαις
  choice: những đêm thức trắng
  alternative: những đêm canh thức
  rationale: Nguyên văn không xác định việc thức đêm là do cầu nguyện, lao động hay hoàn cảnh khốn khó; bản dịch không bổ sung động cơ thần học.
translation_notes:
  register: Văn phong trang trọng nhưng thông dụng, duy trì nhịp lặp “trong…” của nguyên văn Hy Lạp. Dấu phẩy cuối câu được giữ vì đây là một phần của danh sách tiếp diễn sang câu kế cận.
