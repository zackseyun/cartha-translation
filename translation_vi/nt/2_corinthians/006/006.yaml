  text: ἐν ἁγνότητι, ἐν γνώσει, ἐν μακροθυμίᾳ, ἐν χρηστότητι, ἐν πνεύματι ἁγίῳ, ἐν ἀγάπῃ ἀνυποκρίτῳ,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/006.yaml
  text: in purity[a], in knowledge, in patience, in kindness, in the Holy Spirit, in sincere love,
translation:
  language: vi
  text: trong sự thanh sạch, trong sự hiểu biết, trong lòng kiên nhẫn, trong sự nhân từ, trong Đức Thánh Linh[a], trong tình yêu chân thành,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “trong một tinh thần thánh thiện,” nếu cụm từ này mô tả tâm thế thánh thiện của con người thay vì chỉ Đức Thánh Linh.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἁγνότητι
  choice: sự thanh sạch
  rationale: Diễn đạt sự trong sạch về đạo đức theo nghĩa rộng, không thu hẹp vào sự tiết dục hay riêng lĩnh vực tính dục.
- source_word: γνώσει
  choice: sự hiểu biết
  rationale: Giữ nghĩa rộng của γνῶσις, bao gồm tri thức và sự am hiểu thực tiễn trong chức vụ.
- source_word: μακροθυμίᾳ
  choice: lòng kiên nhẫn
  rationale: Diễn tả khả năng bền lòng chịu đựng trước khó khăn hoặc con người; cách nói tự nhiên trong tiếng Việt hiện đại.
- source_word: χρηστότητι
  choice: sự nhân từ
  rationale: Thể hiện phẩm chất tử tế, tốt lành và đầy thiện ý trong quan hệ với người khác.
- source_word: πνεύματι ἁγίῳ
  choice: Đức Thánh Linh
  rationale: Theo cách dùng thông thường của Phao-lô và ngữ cảnh, cụm từ rất có thể chỉ Thánh Linh của Đức Chúa Trời; cách viết hoa thể hiện sở chỉ này.
- source_word: ἀγάπῃ ἀνυποκρίτῳ
  choice: tình yêu chân thành
  rationale: ἀνυπόκριτος có nghĩa là không giả hình hay giả tạo; “chân thành” kết hợp tự nhiên với “tình yêu” và bảo toàn ý nghĩa.
- source_word: ἐν
  choice: trong
  rationale: Lặp lại “trong” để giữ nhịp liệt kê của nguyên văn và không quyết định quá mức rằng giới từ chỉ phương tiện, phạm vi hay cách thức.
theological_decisions:
- issue: Sở chỉ của πνεύματι ἁγίῳ
  choice: Đức Thánh Linh, tức Thánh Linh của Đức Chúa Trời
  alternative: một tâm linh thánh sạch hoặc một tinh thần thánh thiện của con người
  rationale: Cách dùng của Phao-lô và ngữ cảnh ủng hộ sở chỉ thần linh, nhưng cấu trúc Hy Lạp vẫn cho phép hiểu là phẩm chất hay tâm thế thánh thiện; vì vậy ghi nhận cách hiểu khác trong chú thích.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, giữ cấu trúc liệt kê và sự lặp lại của ἐν. Dùng các danh ngữ quen thuộc, dễ hiểu; không thu hẹp ἁγνότης thành sự trong sạch tính dục. Dấu chú thích [a] được đặt ngay sau “Đức Thánh Linh”.
