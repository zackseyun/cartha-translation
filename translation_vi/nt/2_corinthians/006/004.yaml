revisions:
- from: 'Nhưng trong mọi sự[a], chúng tôi chứng tỏ mình là những người phục vụ Đức Chúa Trời[b]: bằng lòng kiên trì lớn lao[c], trong những nỗi khốn khó, trong cảnh túng ngặt, trong bước đường cùng quẫn.'
  to: 'Nhưng trong mọi sự[a], chúng tôi chứng tỏ mình là những người phục vụ Đức Chúa Trời[b]: trong sự kiên trì lớn lao[c], trong những nỗi khốn khó, trong cảnh túng ngặt, trong những cảnh quẫn bách.'
  rationale: Bản sửa thay các cách nói chưa tự nhiên bằng những tương đương tiếng Việt hiện đại, đồng thời bảo toàn nghĩa của ὑπομονή và hình thức liệt kê lặp lại của nguyên văn. Không thay đổi ý nghĩa, tên gọi Đức Chúa Trời, hay cách hiểu không mang tính chức danh của διάκονοι.
