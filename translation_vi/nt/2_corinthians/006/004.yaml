    rationale: στενοχωρίαις nói về những cảnh bị bó buộc, bức bách. “Trong những cảnh quẫn bách” tự nhiên hơn trong tiếng Việt hiện đại và không thêm hình ảnh “bước đường” không có trong nguyên văn.
