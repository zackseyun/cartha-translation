id: 2CO.6.4
reference: 2 Corinthians 6:4
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀλλ’ ἐν παντὶ ⸀συνιστάνοντες ἑαυτοὺς ὡς θεοῦ διάκονοι· ἐν ὑπομονῇ πολλῇ, ἐν θλίψεσιν, ἐν ἀνάγκαις, ἐν στενοχωρίαις,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/004.yaml
  text: 'but in everything commending ourselves as God''s servants: in great endurance[a], in afflictions, in hardships, in distresses[c][b],'
translation:
  language: vi
  text: 'Nhưng trong mọi sự[a], chúng tôi chứng tỏ mình là những người phục vụ Đức Chúa Trời[b]: trong sự kiên trì lớn lao[c], trong những nỗi khốn khó, trong cảnh túng ngặt, trong những cảnh quẫn bách.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “trong mọi phương diện.” Cụm từ Hy Lạp có thể nói đến mọi hoàn cảnh hoặc mọi phương diện mà họ chứng tỏ mình.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “như những người phục vụ Đức Chúa Trời.” Từ Hy Lạp nhấn mạnh việc phục vụ, không nhất thiết là một chức danh chính thức.'
    reason: lexical_alternative
  - marker: c
    text: 'Sát nghĩa: “trong sự kiên trì lớn lao.” Giới từ “trong” được lặp lại trong nguyên văn để dẫn vào danh sách những điều họ trải qua.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: Nhưng
  rationale: Diễn tả sự tương phản với mệnh đề phủ định ở câu trước và mở đầu phần trình bày tích cực về cách thi hành chức vụ.
- source_word: ἐν παντί
  choice: trong mọi sự
  rationale: Giữ phạm vi rộng của cụm từ Hy Lạp, có thể chỉ mọi hoàn cảnh hoặc mọi phương diện.
- source_word: συνιστάνοντες ἑαυτούς
  choice: chúng tôi chứng tỏ mình
  rationale: Trong ngữ cảnh này, động từ có thể mang nghĩa tự giới thiệu, tiến cử hoặc chứng thực. Cách dịch này tự nhiên trong tiếng Việt và nhấn mạnh việc đời sống cùng sự chịu đựng cho thấy tính chân thật của họ, thay vì chỉ là lời tự khen.
- source_word: ὡς θεοῦ διάκονοι
  choice: là những người phục vụ Đức Chúa Trời
  rationale: διάκονοι nhấn mạnh sự phục vụ; cách dịch này dễ hiểu và không mặc nhiên biến từ ấy thành một chức danh giáo hội.
- source_word: ἐν ὑπομονῇ πολλῇ
  choice: bằng lòng kiên trì lớn lao
  rationale: ὑπομονή chỉ sự bền bỉ chịu đựng dưới thử thách, không chỉ là kiên nhẫn chờ đợi. Dùng “bằng” diễn đạt tự nhiên chức năng chỉ phương cách của ἐν.
- source_word: θλίψεσιν
  choice: trong những nỗi khốn khó
  rationale: Diễn đạt sức ép và đau khổ của θλῖψις bằng tiếng Việt hiện đại, trang trọng và dễ hiểu.
- source_word: ἀνάγκαις
  choice: trong cảnh túng ngặt
  rationale: Chỉ những hoàn cảnh cấp bách, bó buộc và khắc nghiệt, chứ không đơn thuần là nhu cầu vật chất.
- source_word: στενοχωρίαις
  choice: trong bước đường cùng quẫn
  rationale: Gợi đúng hình ảnh bị dồn ép, không còn khoảng xoay xở, đồng thời phân biệt với hai từ chỉ khốn khó đứng trước.
theological_decisions:
- issue: Ý nghĩa của διάκονοι trong bối cảnh chức vụ
  choice: những người phục vụ Đức Chúa Trời
  alternative: các tôi tớ của Đức Chúa Trời; các thừa tác viên của Đức Chúa Trời
  rationale: Từ Hy Lạp xác định Phao-lô và các cộng sự qua việc họ phục vụ Đức Chúa Trời, nhưng tự nó không nhất thiết chỉ một chức vụ chính thức trong cơ cấu giáo hội. Cách dịch được chọn tránh du nhập sắc thái định chế không bắt buộc.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Cấu trúc liệt kê và sức nặng tăng dần của ba danh từ chỉ cảnh khốn khó được giữ lại; các cách nói quá cổ hoặc mang màu sắc chức danh giáo hội được tránh.
