    issue: Cụm “hãy biệt riêng ra” hơi gượng trong tiếng Việt hiện đại.
    rationale: Cụm này vừa dùng “biệt riêng” vừa thêm “ra”, làm câu kém gọn. “Hãy tách biệt” truyền đạt tự nhiên lời kêu gọi phân cách mà không thêm diễn giải.
  - severity: low
    issue: “Chạm đến” kém trực tiếp hơn “chạm vào” trong ngữ cảnh tiếp xúc vật lý/nghi lễ.
    rationale: ἅπτεσθε trong lời vang vọng Ê-sai 52:11 dùng hình ảnh không chạm vào điều ô uế; “chạm vào” là tương đương tiếng Việt thông dụng và sát hình ảnh hơn.
