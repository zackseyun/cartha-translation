language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: διὸ ἐξέλθατε ἐκ μέσου αὐτῶν, καὶ ἀφορίσθητε, λέγει κύριος, καὶ ἀκαθάρτου μὴ ἅπτεσθε· κἀγὼ εἰσδέξομαι ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/017.yaml
  text: Therefore[a], come out from among them and be separate, says the Lord, and do not touch what is unclean[c][b]; and I will receive you.
translation:
  language: vi
  text: Vì vậy, hãy ra khỏi giữa họ và hãy tách biệt[a], Chúa phán; đừng chạm vào điều ô uế[b][c], và Ta sẽ tiếp nhận anh chị em.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “hãy biệt riêng” hoặc “hãy tự tách mình ra.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “đừng chạm vào bất cứ điều gì ô uế.”'
    reason: lexical_alternative
  - marker: c
    text: Phao-lô đang dùng ngôn ngữ gợi lại các lời tiên tri trong Cựu Ước, đặc biệt là Ê-sai 52:11.
    reason: cross_reference
lexical_decisions:
- source_word: διὸ
  choice: Vì vậy
  rationale: Diễn tả kết luận suy ra từ lập luận trước đó, tự nhiên trong tiếng Việt hiện đại.
- source_word: ἐξέλθατε ἐκ μέσου αὐτῶν
  choice: hãy ra khỏi giữa họ
  rationale: Giữ mệnh lệnh dứt khoát và ý nghĩa tách khỏi cộng đồng được nói đến, đồng thời bám sát hình ảnh không gian của nguyên văn.
- source_word: ἀφορίσθητε
  choice: hãy biệt riêng ra
  rationale: Phản ánh mệnh lệnh ở thể thụ động mà không chuyển hẳn thành ý chủ động ‘hãy tự tách mình’; cách nói này cũng giữ sắc thái được phân cách riêng.
- source_word: λέγει κύριος
  choice: Chúa phán
  rationale: Công thức dẫn lời tiên tri quen thuộc, trang trọng và tự nhiên trong tiếng Việt.
- source_word: ἀκαθάρτου μὴ ἅπτεσθε
  choice: đừng chạm đến điều ô uế
  rationale: Giữ hình ảnh ‘chạm đến’ và dùng ‘điều ô uế’ để không ép danh từ trung tính này chỉ về một vật thể cụ thể.
- source_word: κἀγὼ εἰσδέξομαι ὑμᾶς
  choice: và Ta sẽ tiếp nhận anh chị em
  rationale: Giữ liên từ, đại từ ngôi thứ nhất có sắc thái nhấn mạnh, và ý nghĩa đón nhận thuận lợi của động từ; ‘anh chị em’ diễn đạt số nhiều, bao gồm cả cộng đồng độc giả.
theological_decisions:
- issue: Cách dịch κύριος trong lời vang vọng Cựu Ước
  choice: Chúa
  alternative: ĐỨC CHÚA; Chủ
  rationale: Dịch đúng κύριος trong văn bản Tân Ước mà không tự ý thay bằng dạng danh xưng đại diện trực tiếp cho YHWH.
- issue: Sức nặng của mệnh lệnh ἀφορίσθητε
  choice: hãy biệt riêng ra
  alternative: hãy được biệt riêng; hãy tự tách mình ra
  rationale: Giữ lời kêu gọi phân cách nhưng không diễn giải thành chủ trương rút khỏi mọi tiếp xúc xã hội, cũng không làm thể thụ động thành hoàn toàn phản thân.
- issue: Phạm vi của ἀκαθάρτου
  choice: điều ô uế
  alternative: bất cứ điều gì ô uế; vật ô uế
  rationale: Giữ cách nói khái quát và sự không xác định của nguyên văn, không giới hạn nó vào một đồ vật hay một loại ô uế cụ thể.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “Ta” cho lời Chúa và “anh chị em” cho đại từ số nhiều ὑμᾶς. Dấu chấm phẩy làm rõ các vế của lời trích dẫn mà không phá vỡ nhịp câu.
