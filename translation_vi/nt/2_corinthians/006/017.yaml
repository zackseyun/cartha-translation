revisions:
- from: Vì vậy, hãy ra khỏi giữa họ và hãy biệt riêng ra[a], Chúa phán; đừng chạm đến điều ô uế[b][c], và Ta sẽ tiếp nhận anh chị em.
  to: Vì vậy, hãy ra khỏi giữa họ và hãy tách biệt[a], Chúa phán; đừng chạm vào điều ô uế[b][c], và Ta sẽ tiếp nhận anh chị em.
  rationale: 'Chỉnh sửa giới hạn ở cách diễn đạt tiếng Việt: “hãy tách biệt” thay cho “hãy biệt riêng ra” để câu tự nhiên và gọn hơn, và “chạm vào” thay cho “chạm đến” để giữ hình ảnh tiếp xúc của nguyên văn. Ý nghĩa, mức độ khái quát, register trang trọng, tên riêng và các điểm neo chú thích đều được giữ nguyên.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T19:25:57Z'
review_pass:
  verdict: revise
  source_fidelity: Bản dịch giữ đúng cấu trúc suy luận của διὸ, các mệnh lệnh số nhiều, công thức ngôn sứ λέγει κύριος, phạm vi khái quát của ἀκαθάρτου, và lời hứa tương lai εἰσδέξομαι ὑμᾶς. Tuy nhiên, “chạm vào” phản ánh trực tiếp và tự nhiên hơn cách dùng ἅπτεσθε trong hình ảnh thanh sạch này.
  naturalness: “Hãy biệt riêng ra” có thể hiểu được nhưng hơi gượng và trùng sắc thái trong tiếng Việt hiện đại. “Hãy tách biệt” là một mệnh lệnh tự nhiên hơn, vẫn diễn tả lời kêu gọi ở thể bị động/kết quả mà không áp đặt sắc thái phản thân. “Chạm vào” tự nhiên hơn “chạm đến” khi nói về sự tiếp xúc với một điều ô uế.
  terminology: “Chúa phán” phù hợp với λέγει κύριος trong ngữ cảnh Tân Ước; “Ta” phù hợp với lời phán trực tiếp của Chúa. “Điều ô uế” giữ được danh từ trung tính số ít mang tính khái quát, không xác định một vật cụ thể.
  issues:
