  yaml_path: translation/nt/2_corinthians/006/003.yaml
  text: giving no cause for stumbling in anything[a], so that the ministry may not be blamed[b],
translation:
  language: vi
  text: không gây cớ vấp phạm trong bất cứ điều gì[a], để chức vụ không bị chê trách[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “không gây sự xúc phạm trong bất cứ phương diện nào.”
    reason: lexical_alternative
  - marker: b
    text: Hay “để chức vụ không bị mất uy tín.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδεμίαν ... προσκοπήν
  choice: không gây cớ vấp phạm
  rationale: Cụm này diễn đạt việc không tạo ra bất kỳ dịp hay nguyên nhân nào khiến người khác vấp phạm. “Gây cớ vấp phạm” tự nhiên trong tiếng Việt và giữ được hình ảnh của προσκοπή.
- source_word: ἐν μηδενί
  choice: trong bất cứ điều gì
  rationale: Giữ phạm vi bao quát của cụm Hy Lạp, chỉ mọi phương diện hay hoàn cảnh.
- source_word: διδόντες
  choice: gây
  rationale: Dịch sát là “đưa ra/trao”, nhưng khi đi với “cớ vấp phạm”, tiếng Việt tự nhiên dùng “gây”; ý nghĩa nhân quả của toàn cụm vẫn được bảo toàn.
- source_word: ἵνα μὴ
  choice: để ... không
  rationale: Diễn đạt rõ sắc thái mục đích hoặc kết quả dự liệu của mệnh đề Hy Lạp.
- source_word: μωμηθῇ
  choice: bị chê trách
  rationale: Động từ bị động có nghĩa là bị trách cứ, bị bắt lỗi hoặc bị mang tiếng. “Bị chê trách” vừa trực tiếp vừa trang trọng.
- source_word: ἡ διακονία
  choice: chức vụ
  rationale: Trong ngữ cảnh, từ này chỉ công việc phục vụ mang tính sứ vụ của Phao-lô và các cộng sự. “Chức vụ” là cách nói quen thuộc, nhưng không nhất thiết hàm ý một cơ cấu giáo phẩm về sau.
theological_decisions:
- issue: Ý nghĩa của διακονία trong lời Phao-lô nói về công việc của mình
  choice: Dịch là “chức vụ”, chỉ công việc phục vụ mang tính sứ vụ của Phao-lô và các cộng sự.
  alternative: “sự phục vụ”, với nghĩa rộng và ít mang sắc thái sứ vụ hơn.
  rationale: Ngữ cảnh nói đến cách Phao-lô và các cộng sự thi hành công việc được giao với tư cách tôi tớ Đức Chúa Trời. “Chức vụ” truyền đạt đúng trọng tâm ấy mà không quy định một chức phẩm giáo hội cụ thể.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu giữ dạng phân từ nối tiếp ngữ cảnh trước, vì câu Hy Lạp là một phần của cấu trúc dài hơn. Các dấu chú thích [a], [b] đều được đặt ngay tại cụm từ liên quan.
