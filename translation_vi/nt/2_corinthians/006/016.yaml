id: 2CO.6.16
reference: 2 Corinthians 6:16
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τίς δὲ συγκατάθεσις ναῷ θεοῦ μετὰ εἰδώλων; ⸂ἡμεῖς γὰρ ναὸς θεοῦ ἐσμεν⸃ ζῶντος· καθὼς εἶπεν ὁ θεὸς ὅτι Ἐνοικήσω ἐν αὐτοῖς καὶ ἐμπεριπατήσω, καὶ ἔσομαι αὐτῶν θεός, καὶ αὐτοὶ ἔσονταί ⸀μου λαός.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/016.yaml
  text: 'And what agreement has the temple of God with idols? For we are the temple of the living God[a], just as God said: “I will dwell among them and walk among them, and I will be their God[b], and they will be my people.”'
translation:
  language: vi
  text: 'Đền thờ của Đức Chúa Trời có sự hòa hợp nào với các thần tượng?[a] Vì chúng ta là đền thờ của Đức Chúa Trời hằng sống, như Đức Chúa Trời đã phán: “Ta sẽ ngự giữa họ[b] và đi lại giữa họ; Ta sẽ là Đức Chúa Trời của họ, và họ sẽ là dân Ta.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “sự đồng thuận” hoặc “sự nhất trí”.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “trong họ”. Giới từ Hy Lạp có thể mang nghĩa “trong” hoặc “giữa”; ở đây, bối cảnh giao ước mang tính cộng đồng phù hợp với “giữa họ”.
    reason: alternative_reading
lexical_decisions:
- source_word: συγκατάθεσις
  choice: sự hòa hợp
  rationale: Danh từ này chỉ sự đồng thuận hoặc hòa hợp. “Sự hòa hợp” tự nhiên trong câu hỏi tu từ và làm nổi bật tính không thể tương hợp giữa đền thờ của Đức Chúa Trời với các thần tượng.
- source_word: ναῷ / ναὸς
  choice: đền thờ
  rationale: ναός chỉ nơi thánh hay chính đền thờ, không phải toàn bộ khuôn viên. “Đền thờ” là cách diễn đạt rõ ràng, quen thuộc và giữ được sức nặng của hình ảnh thờ phượng.
- source_word: εἰδώλων
  choice: các thần tượng
  rationale: Trong ngữ cảnh này, từ này chỉ các vật được tôn thờ như thần, chứ không phải hình ảnh theo nghĩa trung tính. “Các thần tượng” diễn đạt đúng sắc thái tôn giáo đối nghịch.
- source_word: ζῶντος
  choice: hằng sống
  rationale: Phân từ này bổ nghĩa cho θεοῦ. Cụm “Đức Chúa Trời hằng sống” là cách nói trang trọng, dễ hiểu, đồng thời giữ sự tương phản với các thần tượng vô tri.
- source_word: καθὼς εἶπεν ὁ θεὸς
  choice: như chính Đức Chúa Trời đã phán
  rationale: “Như” giữ quan hệ so sánh của καθώς; “đã phán” diễn đạt tự nhiên động từ aorist εἶπεν trong lời dẫn Kinh Thánh. “Chính” nhấn đúng chủ thể được nêu rõ mà không thêm một luận điểm thần học mới.
- source_word: Ἐνοικήσω ἐν αὐτοῖς
  choice: Ta sẽ ngự giữa họ
  rationale: ἐν với đại từ số nhiều có thể mang nghĩa “trong họ” hoặc “giữa họ”. “Ngự giữa họ” phù hợp bối cảnh cộng đồng giao ước và đi song song tự nhiên với mệnh đề “đi lại giữa họ”, trong khi chú thích giữ lại nghĩa khả dĩ kia.
- source_word: ἐμπεριπατήσω
  choice: đi lại giữa họ
  rationale: Cách dịch này giữ hình ảnh sống động về sự hiện diện của Đức Chúa Trời giữa dân Ngài và diễn đạt tự nhiên trong tiếng Việt hiện đại.
- source_word: ἔσομαι αὐτῶν θεός
  choice: Ta sẽ là Đức Chúa Trời của họ
  rationale: Đây là công thức giao ước quen thuộc; cách dịch này giữ nguyên quan hệ được biểu thị bởi đại từ sở hữu.
- source_word: λαός
  choice: dân
  rationale: Trong công thức giao ước, λαός chỉ cộng đồng thuộc về Đức Chúa Trời. “Dân” tự nhiên và bảo toàn ý nghĩa tập thể.
theological_decisions:
- issue: Hình ảnh đền thờ mang tính cộng đồng
  choice: chúng ta là đền thờ của Đức Chúa Trời hằng sống
  alternative: chúng ta là một đền thờ của Đức Chúa Trời hằng sống
  rationale: ναὸς không có mạo từ nhưng đứng làm vị ngữ, nên có thể mang ý nghĩa xác định hoặc phẩm chất. “Là đền thờ” diễn đạt căn tính tập thể của cộng đồng trong hình ảnh Phao-lô dùng và phù hợp với lời giao ước tiếp theo.
- issue: Cách diễn đạt sự ngự trị của Đức Chúa Trời
  choice: Ta sẽ ngự giữa họ
  alternative: Ta sẽ ngự trong họ
  rationale: Cấu trúc ἐν αὐτοῖς cho phép cả hai cách hiểu. Bản chính dùng “giữa họ” vì đối tượng là cộng đồng và mệnh đề song song nói Đức Chúa Trời đi lại giữa họ; chú thích bảo tồn khả năng dịch “trong họ” thay vì loại bỏ sắc thái ấy.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “Đức Chúa Trời”, “đền thờ”, “thần tượng” và đại từ “Ta” trong lời phán để duy trì sắc thái Kinh Thánh quen thuộc. Cấu trúc câu hỏi tu từ được giữ, còn lời trích dẫn được ngắt bằng dấu chấm phẩy để làm rõ các vế song song.
