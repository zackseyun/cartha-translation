id: 2CO.6.13
reference: 2 Corinthians 6:13
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τὴν δὲ αὐτὴν ἀντιμισθίαν, ὡς τέκνοις λέγω, πλατύνθητε καὶ ὑμεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/013.yaml
  text: In the same return—I speak as to children—be open wide[b][a], you also.
translation:
  language: vi
  text: Để đáp lại tương xứng[a]—tôi nói với anh chị em như nói với con cái—anh chị em cũng hãy mở rộng lòng mình[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “như một sự báo đáp,” “như một sự đền đáp,” hoặc “trong sự trao đổi tương xứng.”'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “hãy được mở rộng”; trong mạch văn, đây là hình ảnh về việc rộng mở trong tình cảm và sự đón nhận.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὴν δὲ αὐτὴν ἀντιμισθίαν
  choice: Để đáp lại tương xứng
  rationale: Cụm từ chỉ một sự đáp lại tương ứng, có tính hỗ tương. Cách dịch này tránh sắc thái trả tiền hay báo đáp công trạng, đồng thời diễn đạt tự nhiên chức năng của cụm đối cách trong lời kêu gọi.
- source_word: ὡς τέκνοις λέγω
  choice: tôi nói với anh chị em như nói với con cái
  rationale: Giữ nguyên hình ảnh gia đình của τέκνα mà không thêm đại từ sở hữu “của tôi”, vốn không được nói rõ trong tiếng Hy Lạp; “anh chị em” được bổ sung theo đối tượng đang được Phao-lô trực tiếp nói đến.
- source_word: πλατύνθητε
  choice: hãy mở rộng lòng mình
  rationale: Động từ theo nghĩa đen là “hãy được mở rộng”. Trong mạch văn gần, hình ảnh nói về tấm lòng rộng mở trong tình cảm và sự đón nhận; tiếng Việt cần nêu thành tố hàm ẩn để câu tự nhiên và dễ hiểu.
- source_word: καὶ ὑμεῖς
  choice: anh chị em cũng
  rationale: 'Diễn đạt sự nhấn mạnh và tính hỗ tương: phía người Cô-rinh-tô cũng phải đáp lại như Phao-lô và các cộng sự đã rộng lòng với họ.'
- source_word: δὲ
  choice: —
  rationale: δέ đánh dấu một bước chuyển nhẹ. Trong tiếng Việt, quan hệ chuyển ý đã được thể hiện tự nhiên qua cấu trúc lời kêu gọi, nên không cần thêm “bây giờ” hoặc một từ đối lập mạnh.
theological_decisions:
- issue: Có nên thêm ý sở hữu trong lời gọi con cái hay không
  choice: Không thêm “con cái của tôi”
  alternative: tôi nói với anh chị em như nói với con cái của tôi
  rationale: Giọng điệu của Phao-lô có tính phụ tử, nhưng bản Hy Lạp không có đại từ sở hữu. Giữ “con cái” bảo toàn sự thân tình mà không nói quá điều nguồn văn ghi rõ.
- issue: Có nên hiểu ἀντιμισθία như sự trả công hoặc báo đáp hay không
  choice: Đáp lại tương xứng trong tình cảm và sự đón nhận
  alternative: sự báo đáp; sự đền bù
  rationale: Mạch văn nói đến sự rộng mở và tình cảm giữa Phao-lô với tín hữu Cô-rinh-tô, không nói đến thanh toán vật chất hay công trạng. Bản dịch vẫn giữ ý trao đổi tương ứng mà không nhập một hệ luận thần học về phần thưởng.
- issue: Có nên nêu rõ “lòng” trong πλατύνθητε hay không
  choice: Nêu “lòng mình” như thành tố hàm ẩn theo mạch văn
  alternative: anh chị em cũng hãy được mở rộng; anh chị em cũng hãy mở rộng
  rationale: Dạng thụ động và hình ảnh “được mở rộng” có thể được giữ sát chữ, nhưng sẽ khó hiểu trong tiếng Việt. Câu trước đó (6:11–12) xác lập rõ trường nghĩa của tấm lòng và tình cảm, nên việc nêu “lòng” làm sáng nghĩa mà không thu hẹp sai ẩn dụ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” để xưng hô với cộng đồng tín hữu; giữ giọng phụ tử của câu mà không thêm sở hữu từ không có trong nguồn. Dấu gạch ngang làm nổi bật lời xen giải thích của Phao-lô.
