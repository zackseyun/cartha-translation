review_pass:
  verdict: revise
  source_fidelity: Bản dịch truyền đạt đúng lời kêu gọi đáp lại có tính hỗ tương (ἀντιμισθίαν), lời xen giải thích mang giọng cha mẹ đối với con cái (ὡς τέκνοις λέγω), và mệnh lệnh để người Cô-rinh-tô cũng rộng mở (πλατύνθητε καὶ ὑμεῖς). Việc nêu “lòng mình” là một làm rõ ngữ cảnh an toàn từ 6:11–12. Tuy nhiên, chú thích a hiện thêm đối tượng “tôi,” không được nêu trong câu Hy Lạp, và neo chú thích không đặt tại cụm từ mà chúng giải thích.
  naturalness: Câu văn hiện đại, trang trọng, và dễ hiểu. Cấu trúc gạch ngang thể hiện tự nhiên phần lời xen của Phao-lô. Di chuyển các ký hiệu chú thích đến đúng cụm từ sẽ làm câu rõ hơn mà không thay đổi ý nghĩa.
  terminology: “Đáp lại tương xứng” diễn đạt thích hợp tính hỗ tương của ἀντιμισθία mà không gợi một khoản thanh toán. “Anh chị em” phù hợp cách xưng hô với hội chúng. “Con cái” giữ đúng hình ảnh τέκνοις, không thêm “của tôi.”
  issues:
  - severity: medium
    issue: Chú thích a thêm cụm “đáp lại tôi.”
    rationale: Nguyên văn không có đại từ hay danh từ chỉ đối tượng “tôi” trong câu này. Dù ngữ cảnh cho thấy sự đáp lại dành cho Phao-lô và các cộng sự, chú thích từ vựng không nên trình bày phần suy ra theo ngữ cảnh như một phương án dịch trực tiếp.
  - severity: low
    issue: Các ký hiệu chú thích hiện cùng đặt cuối câu.
    rationale: Chú thích a giải thích ἀντιμισθίαν ở đầu câu, còn b giải thích πλατύνθητε ở gần cuối. Đặt mỗi ký hiệu sau cụm tương ứng bảo đảm neo chú thích chính xác.
  revised_text: Để đáp lại tương xứng[a]—tôi nói với anh chị em như nói với con cái—anh chị em cũng hãy mở rộng lòng mình[b].
