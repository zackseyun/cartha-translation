- from: Để đáp lại tương xứng—tôi nói với anh chị em như nói với con cái—anh chị em cũng hãy mở rộng lòng mình.[a][b]
  to: Để đáp lại tương xứng[a]—tôi nói với anh chị em như nói với con cái—anh chị em cũng hãy mở rộng lòng mình[b].
  rationale: Bản sửa chỉ loại bỏ việc thêm “tôi” trong chú thích a và đặt lại các neo chú thích theo đúng từ/cụm từ Hy Lạp mà chúng giải thích. Bản văn chính được giữ nguyên về nghĩa và cách diễn đạt, ngoại trừ vị trí ký hiệu chú thích.
