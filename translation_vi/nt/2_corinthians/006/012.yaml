source:
  edition: SBLGNT
  text: οὐ στενοχωρεῖσθε ἐν ἡμῖν, στενοχωρεῖσθε δὲ ἐν τοῖς σπλάγχνοις ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/012.yaml
  text: You are not restricted by us[a], but you are restricted in your own affections.
translation:
  language: vi
  text: Anh chị em không bị bó hẹp nơi chúng tôi[a], nhưng bị bó hẹp trong chính tình cảm của mình.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Anh chị em không bị giới hạn bởi chúng tôi, nhưng bị giới hạn trong chính lòng mình.”'
    reason: Nêu cách diễn đạt theo nghĩa quan hệ/nguồn gốc của ἐν ἡμῖν, đồng thời dùng “lòng” như một tương đương quen thuộc cho σπλάγχνα; bản văn chính giữ sát hơn hình ảnh “bó hẹp” và sắc thái giới từ của nguyên văn.
lexical_decisions:
- source_word: οὐ στενοχωρεῖσθε
  choice: không bị ... hạn chế
  rationale: Động từ στενοχωρέομαι gợi hình ảnh bị bó hẹp và theo nghĩa bóng là bị hạn chế. Cách dịch này tự nhiên trong tiếng Việt và giữ được cùng một từ ở cả hai vế để bảo toàn phép đối xứng tu từ.
- source_word: ἐν ἡμῖν
  choice: bị chúng tôi
  rationale: Dù ἐν thường có nghĩa là “trong”, tại đây cụm từ chỉ phía gây ra sự hạn chế; cấu trúc bị động “bị chúng tôi hạn chế” diễn đạt rõ và tự nhiên trong tiếng Việt.
- source_word: δὲ
  choice: nhưng
  rationale: δὲ đánh dấu sự tương phản trực tiếp giữa hai vế.
- source_word: ἐν τοῖς σπλάγχνοις ὑμῶν
  choice: trong chính tình cảm của mình
  rationale: σπλάγχνα theo nghĩa đen là nội tạng, nhưng ở đây chỉ những tình cảm sâu kín. “Tình cảm” phù hợp văn cảnh quan hệ; “chính ... của mình” nhấn mạnh rằng sự hạn hẹp nằm nơi người Cô-rinh-tô.
theological_decisions:
- issue: Nghĩa bóng của σπλάγχνα
  choice: tình cảm sâu kín của người Cô-rinh-tô
  alternative: lòng; nội tâm; ruột gan
  rationale: Văn cảnh đối chiếu tấm lòng rộng mở của Phao-lô với sự đáp lại bị bó hẹp của người Cô-rinh-tô. Bản dịch dùng nghĩa bóng tự nhiên nhưng không biến câu này thành một phán đoán thuần lý trí.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” để diễn đạt ngôi thứ hai số nhiều trong lời trực tiếp gửi cộng đồng; giữ phép lặp “hạn chế” ở hai vế nhằm bảo toàn cấu trúc tương phản của nguyên văn.
