  naturalness: “Bị bó hẹp nơi chúng tôi” tự nhiên và gần hình ảnh tu từ hơn trong văn phong Kinh Thánh tiếng Việt hiện đại. Vế sau vẫn diễn đạt rõ rằng sự bó hẹp thuộc về tình cảm của chính người nhận.
