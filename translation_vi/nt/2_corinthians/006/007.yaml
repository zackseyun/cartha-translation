lexical_decisions:
- source_word: λόγῳ ἀληθείας
  choice: lời chân thật
  rationale: Giữ hình thức cô đọng của λόγος và tính bổ nghĩa của ἀληθείας, đồng thời để ngỏ cả nghĩa lời rao giảng chân lý lẫn lời nói chân thật.
- source_word: δυνάμει θεοῦ
  choice: quyền năng của Đức Chúa Trời
  rationale: Phản ánh trực tiếp kết cấu sở hữu và duy trì nhịp điệp của hai cụm ἐν.
- source_word: διὰ
  choice: nhờ
  rationale: Với sở hữu cách, διά diễn tả phương tiện; “nhờ” tự nhiên trong tiếng Việt và rõ nghĩa công cụ.
- source_word: ὅπλων
  choice: vũ khí
  rationale: ὅπλον có thể chỉ khí cụ chiến đấu dùng để tấn công hoặc phòng thủ; “vũ khí” rộng và rõ hơn “áo giáp”.
- source_word: δικαιοσύνης
  choice: sự công chính
  rationale: Giữ thuật ngữ Phao-lô theo nghĩa rộng, không thu hẹp thành riêng công lý hay hành vi đạo đức.
- source_word: τῶν δεξιῶν καὶ ἀριστερῶν
  choice: ở tay phải và tay trái
  rationale: Bổ sung danh từ “tay” được hàm ý, tạo hình ảnh tự nhiên về vũ khí được cầm ở cả hai tay mà không xác định tay nào tấn công hay phòng thủ.
theological_decisions:
- issue: Nghĩa của δικαιοσύνη trong hình ảnh chiến trận
  choice: sự công chính
  alternative: sự công lý
  rationale: “Sự công chính” bảo toàn phạm vi thần học và đạo đức rộng của δικαιοσύνη trong văn Phao-lô; chú thích giữ lại khả năng hiểu theo nghĩa công lý.
- issue: Quan hệ của tay phải và tay trái với vũ khí
  choice: ở tay phải và tay trái
  alternative: dành cho tay phải và tay trái
  rationale: Bản dịch chính diễn đạt tự nhiên hình ảnh cầm vũ khí bằng cả hai tay, nhưng không ép văn bản thành sự phân chia cụ thể giữa tấn công và phòng thủ.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Giữ cấu trúc liệt kê nhịp nhàng của nguyên văn; dùng “Đức Chúa Trời” theo lối gọi phổ thông trong Kinh Thánh tiếng Việt. Các chú thích được đánh dấu đầy đủ trong câu chính.
