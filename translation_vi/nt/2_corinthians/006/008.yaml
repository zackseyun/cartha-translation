translation:
  language: vi
  text: qua danh dự lẫn nhục nhã[a], qua lời gièm pha lẫn lời ca ngợi[b]; bị xem là những kẻ lừa dối, nhưng vẫn chân thật[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “qua vinh quang và nhục nhã.” Từ Hy Lạp có thể có nghĩa là “vinh quang”, nhưng ở đây có lẽ chỉ danh dự trước công chúng.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “qua tiếng xấu và tiếng tốt.”'
    reason: lexical_alternative
  - marker: c
    text: 'Nguyên văn nói sát là: “như những kẻ lừa dối và chân thật.” Cách diễn đạt này tương phản giữa cách Phao-lô cùng các cộng sự bị nhìn nhận với điều họ thực sự là.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ
  choice: trong / giữa
  rationale: Với các danh từ sở hữu cách chỉ hoàn cảnh, διά diễn tả những hoàn cảnh mà chức vụ phải trải qua. “Trong/giữa” tự nhiên trong tiếng Việt và vẫn giữ được sự lặp lại có tính tu từ.
- source_word: δόξης
  choice: danh dự
  rationale: Trong thế đối lập với ἀτιμία, từ này mang nghĩa xã hội là được coi trọng hoặc có danh dự, thay vì nghĩa thần học thường gặp là “vinh quang”.
- source_word: ἀτιμίας
  choice: nhục nhã
  rationale: Diễn tả tình trạng bị hạ thấp và mất danh dự; tạo thành cặp đối lập tự nhiên với “danh dự”.
- source_word: δυσφημίας
  choice: lời gièm pha
  rationale: Chỉ lời nói bất lợi, bôi xấu hoặc tiếng xấu. “Lời gièm pha” làm rõ khía cạnh phát ngôn thù nghịch mà không nhất thiết xác nhận lời ấy là đúng.
- source_word: εὐφημίας
  choice: lời ca ngợi
  rationale: Chỉ lời nói hoặc tiếng tăm thuận lợi, đối lập với δυσφημία. “Lời ca ngợi” tạo cặp tương phản rõ và tự nhiên với “lời gièm pha”.
- source_word: ὡς
  choice: bị xem là
  rationale: Trong chuỗi tương phản này, ὡς giới thiệu cách Phao-lô và các cộng sự bị người khác đánh giá. Cách dịch này làm rõ góc nhìn hàm ẩn mà không biến lời cáo buộc thành sự thật.
- source_word: πλάνοι
  choice: những kẻ lừa dối
  rationale: Trong ngữ cảnh, từ này chỉ những người bị cho là dẫn người khác đi sai lạc; “những kẻ lừa dối” truyền đạt rõ nội dung lời cáo buộc.
- source_word: ἀληθεῖς
  choice: chân thật
  rationale: Tính từ này đối lập trực tiếp với πλάνοι. “Chân thật” có thể nói về tư cách và lời nói đáng tin, đồng thời giữ được nét cô đọng của nguyên văn.
theological_decisions:
- issue: Có nên nói rõ vế cuối tương phản giữa cách người khác nhìn nhận và thực tại hay không
  choice: Dịch ὡς là “bị xem là” và καί mang sắc thái tương phản là “nhưng vẫn”, để cho thấy “những kẻ lừa dối” là lời đánh giá từ bên ngoài, còn “chân thật” khẳng định thực tại.
  alternative: 'Dịch sát hình thức hơn: “như những kẻ lừa dối mà chân thật”.'
  rationale: Nguyên văn đặt lời cáo buộc và sự chân thật cạnh nhau trong một nghịch lý. Bản dịch làm rõ góc nhìn hàm ẩn nhưng không giải thích thêm bản chất của sự chân thật, nhờ đó vẫn giữ nguyên sức căng thần học và tu từ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Hai cặp đối lập được giữ cân xứng; “cũng như” duy trì nhịp liệt kê, còn “nhưng vẫn” truyền đạt sắc thái tương phản của καί theo ngữ cảnh.
