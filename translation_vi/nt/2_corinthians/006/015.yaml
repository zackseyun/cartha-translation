reference: 2 Corinthians 6:15
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τίς δὲ συμφώνησις ⸀Χριστοῦ πρὸς Βελιάρ, ἢ τίς μερὶς πιστῷ μετὰ ἀπίστου;
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/015.yaml
  text: And what harmony is there between Messiah and Beliar? Or what share does a believer have with an unbeliever?[a]
translation:
  language: vi
  text: Đấng Mê-si-a có sự hòa hợp nào với Bê-li-a? Hay người tin có phần chung gì với người không tin?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Bê-li-a: tiếng Hy Lạp là Βελιάρ (Beliar); tên này cũng thường được biết đến dưới dạng Bê-li-an (Belial).'
    reason: Nêu dạng nguyên ngữ và dạng tên thay thế quen thuộc mà không thay đổi chính văn.
lexical_decisions:
- source_word: συμφώνησις
  choice: sự hòa hợp
  rationale: Danh từ này chỉ sự đồng điệu, hòa hợp hay tương hợp; “sự hòa hợp” tự nhiên trong tiếng Việt và giữ được sắc thái quan hệ của câu hỏi tu từ.
- source_word: Χριστοῦ
  choice: Đấng Mê-si-a
  rationale: Ở đây Χριστός mang tính danh hiệu trong thế đối lập với Bê-li-a; “Đấng Mê-si-a” bảo toàn chức năng danh hiệu thay vì dùng dạng tên gọi “Đấng Christ”.
- source_word: Βελιάρ
  choice: Bê-li-a
  rationale: Đây là tên riêng; phiên âm trực tiếp dạng Hy Lạp Βελιάρ sang cách đọc tự nhiên trong tiếng Việt. Dạng quen thuộc khác được nêu ở chú thích.
- source_word: μερίς
  choice: phần chung
  rationale: Từ này chỉ phần được dự phần hoặc sở hữu chung. “Có phần chung gì” diễn đạt tự nhiên ý niệm cùng chia sẻ hay cùng dự phần.
- source_word: πιστῷ
  choice: người tin
  rationale: Tính từ được dùng như danh từ, chỉ người có đức tin; “người tin” rõ ràng, gọn và đối xứng với “người không tin”.
- source_word: ἀπίστου
  choice: người không tin
  rationale: Trong thế đối lập với πιστῷ, từ này chỉ người không tin; cách dịch này tránh nhập thêm sắc thái “bất trung” vốn không chắc chắn trong ngữ cảnh.
- source_word: πρὸς
  choice: và
  rationale: Đi với συμφώνησις, giới từ biểu thị quan hệ giữa hai bên; cấu trúc tiếng Việt “A và B có sự hòa hợp nào?” diễn đạt quan hệ ấy tự nhiên.
- source_word: μετὰ
  choice: với
  rationale: Giới từ chỉ sự kết hợp hay liên hệ; trong cụm “có phần chung ... với”, “với” là cách diễn đạt ngắn gọn và tự nhiên.
- source_word: δὲ
  choice: không dịch thành từ riêng
  rationale: δέ nối tiếp chuỗi câu hỏi tu từ. Trong tiếng Việt, mạch nối được thể hiện tự nhiên bằng cấu trúc câu kế tiếp; thêm “và” ở đầu dễ nặng lời, còn sắc thái bổ sung vẫn được giữ qua câu hỏi song song.
theological_decisions:
- issue: Cách dịch Χριστός
  choice: Đấng Mê-si-a
  alternative: Đấng Christ
  rationale: Trong cặp đối lập mang tính khái niệm với Bê-li-a, Χριστός nổi bật như danh hiệu. “Đấng Mê-si-a” giữ chức năng ấy mà không biến thành tên riêng.
- issue: Nhận diện Βελιάρ
  choice: Giữ như tên riêng “Bê-li-a”
  alternative: Bê-li-an (Belial)
  rationale: Bản văn dùng dạng Hy Lạp Βελιάρ. Bản dịch phiên âm đúng dạng này, không đưa lời giải thích thần học thêm vào chính văn; dạng tên quen thuộc khác được bảo tồn trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Hai câu hỏi tu từ được giữ nguyên; cách nói “có phần chung gì với” vừa tự nhiên vừa bảo toàn ý niệm dự phần chung. Mọi dấu chú thích trong chính văn đều có mục tương ứng.
