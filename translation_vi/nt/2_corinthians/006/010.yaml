source:
  edition: SBLGNT
  text: ὡς λυπούμενοι ἀεὶ δὲ χαίροντες, ὡς πτωχοὶ πολλοὺς δὲ πλουτίζοντες, ὡς μηδὲν ἔχοντες καὶ πάντα κατέχοντες.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/010.yaml
  text: as sorrowful[a], yet always rejoicing; as poor, yet making many rich; as having nothing[b], and yet possessing everything.
translation:
  language: vi
  text: như buồn rầu nhưng luôn vui mừng; như nghèo khó nhưng làm cho nhiều người giàu có[a]; như không có gì nhưng lại sở hữu mọi sự.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “làm giàu cho nhiều người.” Câu không nói rõ sự giàu có này thuộc phương diện nào.'
    reason: lexical_alternative
  - marker: b
    text: Động từ được dịch là “sở hữu” cũng có thể mang nghĩa nắm giữ hoặc giữ chặt; câu Hy Lạp không nói rõ bản chất của sự sở hữu này.
    reason: cross_reference
lexical_decisions:
- source_word: ὡς
  choice: như
  rationale: Giữ nguyên cách trình bày so sánh được lặp lại ba lần trong chuỗi nghịch lý của Phao-lô, không biến ὡς thành lời khẳng định rằng bề ngoài chỉ là giả tạo.
- source_word: λυπούμενοι
  choice: buồn rầu
  rationale: Diễn đạt tự nhiên trạng thái đau buồn của phân từ, đồng thời không xác định quá mức nguyên nhân hay tác nhân gây buồn.
- source_word: ἀεὶ δὲ χαίροντες
  choice: nhưng luôn vui mừng
  rationale: “Luôn” chuyển tải ἀεί; “nhưng” thể hiện sức tương phản của δέ; “vui mừng” giữ sắc thái chủ động, liên tục của χαίροντες.
- source_word: πτωχοὶ
  choice: nghèo khó
  rationale: Cách nói thông dụng và trang trọng, đủ rộng để chỉ tình trạng thiếu thốn mà không cường điệu thành hoàn toàn cơ cực.
- source_word: πολλοὺς δὲ πλουτίζοντες
  choice: nhưng làm cho nhiều người trở nên giàu có
  rationale: Diễn đạt rõ nghĩa tác động của πλουτίζω là làm cho người khác giàu lên, nhưng không thêm từ “thuộc linh” vốn không có trong câu Hy Lạp.
- source_word: μηδὲν ἔχοντες
  choice: không có gì
  rationale: Lối nói tự nhiên, cô đọng, giữ vế chỉ sự thiếu thốn rõ rệt của nghịch lý.
- source_word: πάντα κατέχοντες
  choice: sở hữu mọi sự
  rationale: “Sở hữu” thể hiện nghĩa nắm giữ hoặc có quyền sở hữu của κατέχω và tạo tương phản trực tiếp với “không có gì”; “mọi sự” phù hợp văn phong Kinh Thánh hiện đại mà vẫn dễ hiểu.
theological_decisions:
- issue: Bản chất của sự giàu có và việc sở hữu trong hai nghịch lý cuối
  choice: Giữ cách diễn đạt không kèm định ngữ, không đưa “thuộc linh” hay “trong Đấng Christ” vào chính văn.
  alternative: Giải thích trực tiếp là làm nhiều người giàu có về thuộc linh và sở hữu mọi sự trong Đấng Christ.
  rationale: Văn mạch và thần học của Phao-lô có thể hướng đến sự phong phú thuộc linh, nhưng nguyên văn cố ý để các khẳng định ở dạng tuyệt đối. Giữ nguyên độ căng của nghịch lý tránh giải quyết thay cho người đọc điều câu Hy Lạp không nói rõ.
- issue: Sắc thái của ὡς trong chuỗi nghịch lý
  choice: Dịch lặp lại là “như”.
  alternative: Dịch là “dường như” hoặc bỏ từ này để khẳng định trực tiếp từng tình trạng.
  rationale: “Như” bảo tồn khuôn nhịp tu từ và sự căng thẳng giữa điều các sứ đồ xem ra là hoặc bị coi là với thực tại được nêu ở vế đối lập, mà không quyết định rằng vế đầu chỉ là vẻ bề ngoài.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Ba lần “như” cùng cấu trúc “nhưng” duy trì nhịp song hành của nguyên văn. Dấu [a] được đặt sau mệnh đề về việc làm cho nhiều người giàu có, phù hợp nội dung chú thích; dấu [b] được đặt sau “mọi sự”.
