  terminology: “Buồn rầu,” “vui mừng,” “nghèo khó,” và “sở hữu mọi sự” phù hợp văn phong Kinh Thánh Việt ngữ hiện đại. Không nên xác định “giàu có” là thuộc linh trong chính văn hoặc khẳng định một ý nghĩa thần học cụ thể trong chú thích, vì nguyên văn không nêu định ngữ ấy.
