  source_fidelity: 'Chính văn phản ánh sát cấu trúc ba cặp nghịch lý của tiếng Hy Lạp: ὡς được giữ là “như,” ἀεί là “luôn,” và các phân từ được diễn đạt nhất quán. “Sở hữu mọi sự” truyền đạt phù hợp κατέχοντες, dù động từ này cũng có thể mang sắc thái nắm giữ/giữ chặt. Tuy nhiên, các chú thích hiện có đi xa hơn điều câu Hy Lạp xác định khi định hướng bản chất của sự giàu có hoặc sự sở hữu theo một cách giải thích cụ thể.'
