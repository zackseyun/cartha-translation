  to: “Ta sẽ là Cha của anh em[a], và anh em sẽ là con trai và con gái của Ta,” Chúa Toàn Năng phán.
  rationale: Bản sửa dịch trực tiếp các động từ tương lai “sẽ là”, bảo toàn tính đối ứng của công thức, và tránh dùng “các con” như một cách xưng hô diễn giải vượt quá đại từ số nhiều trong nguyên văn. Chú thích vẫn bảo tồn cấu trúc “đối với” của thành ngữ Hy Lạp.
