source:
  edition: SBLGNT
  text: καὶ ἔσομαι ὑμῖν εἰς πατέρα, καὶ ὑμεῖς ἔσεσθέ μοι εἰς υἱοὺς καὶ θυγατέρας, λέγει κύριος παντοκράτωρ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/018.yaml
  text: And I will be a Father to you[a], and you will be sons and daughters to me, says the Lord Almighty.
translation:
  language: vi
  text: “Ta sẽ là Cha của anh em[a], và anh em sẽ là con trai và con gái của Ta,” Chúa Toàn Năng phán.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát nghĩa hơn: “Ta sẽ là Cha đối với anh em, và anh em sẽ là con trai và con gái đối với Ta.” Tiếng Hy Lạp dùng một thành ngữ diễn tả quan hệ giao ước; tiếng Việt thường diễn đạt tự nhiên là “là Cha của anh em” và “là con trai và con gái của Ta”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔσομαι ὑμῖν εἰς πατέρα
  choice: Ta sẽ làm Cha của các con
  rationale: Diễn đạt tự nhiên công thức quan hệ giao ước trong tiếng Hy Lạp, đồng thời giữ thì tương lai và quan hệ Cha–con. “Ta” và “các con” phù hợp với lời Đức Chúa Trời trực tiếp phán với cộng đồng.
- source_word: ὑμεῖς ἔσεσθέ μοι
  choice: các con sẽ làm ... của Ta
  rationale: Giữ sự đối xứng và tính tương hỗ với mệnh đề đầu; tiếng Việt tự nhiên diễn đạt quan hệ này bằng “làm ... của Ta” hơn là bám sát cấu trúc “đối với Ta”.
- source_word: υἱοὺς καὶ θυγατέρας
  choice: con trai, con gái
  rationale: Giữ nguyên việc bản Hy Lạp nêu rõ cả nam lẫn nữ, thay vì khái quát thành “con cái”.
- source_word: λέγει
  choice: phán vậy
  rationale: Trong công thức trích dẫn lời Đức Chúa Trời, “phán” trang trọng và chính xác hơn “nói”; “vậy” giúp câu dẫn hậu vị tự nhiên trong tiếng Việt.
- source_word: κύριος παντοκράτωρ
  choice: Chúa Toàn Năng
  rationale: Giữ κύριος là “Chúa” và dịch παντοκράτωρ theo danh hiệu thần linh quen thuộc “Toàn Năng”, không nhập một danh hiệu Cựu Ước khác vào câu.
theological_decisions:
- issue: Cách thể hiện quan hệ Cha–con trong công thức giao ước
  choice: “Ta sẽ làm Cha của các con ... các con sẽ làm ... của Ta”
  alternative: “Ta sẽ là Cha đối với các con ... các con sẽ là ... đối với Ta”
  rationale: Bản chính ưu tiên tiếng Việt tự nhiên nhưng chú thích bảo tồn cấu trúc Hy Lạp sát chữ và sắc thái quan hệ giao ước.
- issue: Nêu rõ cả hai giới trong quan hệ làm con
  choice: “con trai, con gái”
  alternative: “con cái”
  rationale: υἱοὺς καὶ θυγατέρας nêu đích danh cả con trai lẫn con gái; không nên làm mất điểm nhấn bao gồm này.
- issue: Danh hiệu κύριος παντοκράτωρ
  choice: “Chúa Toàn Năng”
  alternative: “Chúa, Đấng Toàn Năng”
  rationale: Cách chọn ngắn gọn, trang trọng và phản ánh trực tiếp hai yếu tố của danh hiệu Hy Lạp mà không đồng nhất παντοκράτωρ với “Chúa các đạo quân”.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Viết hoa “Cha”, “Ta” và danh hiệu “Chúa Toàn Năng” vì đây là lời Đức Chúa Trời tự xưng; dùng “các con” để thể hiện cộng đồng được Ngài nhận vào quan hệ làm con.
