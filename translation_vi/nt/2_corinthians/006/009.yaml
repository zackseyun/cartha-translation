  text: ὡς ἀγνοούμενοι καὶ ἐπιγινωσκόμενοι, ὡς ἀποθνῄσκοντες καὶ ἰδοὺ ζῶμεν, ὡς παιδευόμενοι καὶ μὴ θανατούμενοι,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/009.yaml
  text: as unknown and yet well known[a], as dying and behold, we live, as disciplined and not put to death[b],
translation:
  language: vi
  text: như những người không được biết đến, nhưng lại được biết đến[a]; như đang chết, và kìa, chúng tôi vẫn sống; như bị sửa dạy[b] mà không bị giết chết;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “được nhìn nhận”; từ Hy Lạp có thể nhấn mạnh việc được nhận biết đầy đủ, chứ không chỉ là nổi tiếng.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “được rèn luyện” hoặc “bị kỷ luật”; từ Hy Lạp có thể chỉ sự kỷ luật để uốn nắn hoặc sự đào luyện nhằm trưởng thành.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς
  choice: như
  rationale: Giữ nguyên cấu trúc tu từ lặp lại, dùng để mở đầu từng cặp nghịch lý.
- source_word: ἀγνοούμενοι
  choice: những người không được biết đến
  rationale: Diễn đạt thể bị động và ý không được người khác biết đến hoặc nhìn nhận, đồng thời tạo thế đối lập rõ với ἐπιγινωσκόμενοι.
- source_word: ἐπιγινωσκόμενοι
  choice: được nhận biết rõ
  rationale: Giữ được sắc thái nhận biết hay nhìn nhận đầy đủ hơn của động từ kép, thay vì chuyển thành ý nổi tiếng.
- source_word: ἀποθνῄσκοντες
  choice: đang chết
  rationale: Phân từ hiện tại chỉ tình trạng liên tục cận kề cái chết và duy trì nghịch lý súc tích với ‘chúng tôi vẫn sống’.
- source_word: ἰδοὺ
  choice: kìa
  rationale: Giữ lực kêu gọi chú ý đột ngột của tiểu từ, với sắc thái trang trọng nhưng vẫn tự nhiên trong tiếng Việt hiện đại.
- source_word: ζῶμεν
  choice: chúng tôi vẫn sống
  rationale: ‘Chúng tôi’ phù hợp với tiếng nói của Phao-lô và các cộng sự; ‘vẫn’ làm rõ sức tương phản vốn có trong ngữ cảnh mà không thay đổi nội dung mệnh đề.
- source_word: παιδευόμενοι
  choice: bị sửa dạy
  rationale: Bao quát cả kỷ luật mang tính uốn nắn lẫn sự đào luyện, đồng thời phù hợp với bối cảnh chịu khổ.
- source_word: μὴ θανατούμενοι
  choice: không bị giết chết
  rationale: Giữ thể bị động và phân biệt với tình trạng ‘đang chết’ ở vế trước; không thu hẹp nghĩa thành việc xử tử theo thủ tục pháp lý.
theological_decisions:
- issue: Ý nghĩa của παιδευόμενοι trong mối liên hệ với sự chịu khổ
  choice: bị sửa dạy
  alternative: bị trừng phạt; được rèn luyện
  rationale: ‘Bị sửa dạy’ giữ được khả năng đây là sự uốn nắn hoặc đào luyện qua đau khổ, nhưng không khẳng định rằng các sứ đồ đang chịu hình phạt của Đức Chúa Trời.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dấu chấm phẩy giữ nhịp liệt kê nghịch lý của nguyên văn; ‘thế mà kìa’ tái hiện cả liên từ tương phản lẫn lời kêu gọi chú ý.
