revisions:
- from: Đừng mang ách chung một cách không tương xứng với những người không tin.[b] Vì sự công chính[a] có phần chung gì với sự vô luật pháp? Hay ánh sáng có sự tương giao gì với bóng tối?
  to: Đừng mang chung một ách không tương xứng với những người không tin.[b] Vì sự công chính[a] có sự chung phần gì với sự vô luật pháp? Hay ánh sáng có sự tương giao gì với bóng tối?
  rationale: Sửa câu đầu để tiếng Việt hiện đại hơn và để hình ảnh “ghép ách khác loại/không tương xứng” gắn trực tiếp với một ách chung, thay vì với cách thực hiện hành động. Sửa “phần chung” thành “sự chung phần” vì tính tự nhiên, không thay đổi nghĩa. Chú thích được điều chỉnh để nêu chính xác hơn yếu tố “khác loại” trong ἑτεροζυγοῦντες. Không thêm bất cứ áp dụng giáo phái hoặc giới hạn quan hệ cụ thể nào.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T19:25:57Z'
review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng mệnh lệnh phủ định, hình ảnh ách, đối tượng ἀπίστοις, và hai câu hỏi tu từ đối lập. Tuy nhiên, cụm “mang ách chung một cách không tương xứng” không đặt rõ tính chất ‘khác loại/không tương xứng’ của sự ghép ách và hơi gượng trong tiếng Việt. Bản sửa giữ hình ảnh này bằng cách nói rõ “một ách không tương xứng”.
  naturalness: “Đừng mang chung một ách không tương xứng với những người không tin” tự nhiên và dễ hiểu hơn “mang ách chung một cách không tương xứng”. “Sự chung phần” là cách diễn đạt mạch lạc hơn “phần chung” trong câu hỏi tu từ trang trọng. Các thuật ngữ “công chính”, “vô luật pháp”, và “tương giao” phù hợp văn phong Kinh Thánh hiện đại.
  terminology: “Công chính” bảo toàn δικαιοσύνη trong thế đối lập với ἀνομία; chú thích “công lý” giữ khả năng từ vựng. “Vô luật pháp” phản ánh trực tiếp ἀνομία, không thu hẹp thành một loại hành vi phạm pháp dân sự. “Tương giao” phản ánh κοινωνία và được giữ khác với μετοχή (“chung phần”).
  issues:
  - severity: medium
    issue: Cụm “mang ách chung một cách không tương xứng” gượng và làm mờ quan hệ cú pháp của hình ảnh ghép ách.
    rationale: ἑτεροζυγοῦντες mô tả việc ở dưới một ách với loại khác/không tương xứng; “một cách không tương xứng” có thể bị hiểu là cách thức thực hiện hành động, thay vì đặc tính của ách ghép chung.
  - severity: low
    issue: “Phần chung” kém tự nhiên trong ngữ cảnh quan hệ/chia phần.
    rationale: “Sự chung phần” diễn đạt rõ và tự nhiên hơn ý συμμετοχή/μετοχή, đồng thời vẫn phân biệt với κοινωνία ở vế sau.
