id: 2CO.6.14
reference: 2 Corinthians 6:14
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Μὴ γίνεσθε ἑτεροζυγοῦντες ἀπίστοις· τίς γὰρ μετοχὴ δικαιοσύνῃ καὶ ἀνομίᾳ, ⸂ἢ τίς⸃ κοινωνία φωτὶ πρὸς σκότος;
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/014.yaml
  text: Do not become unequally yoked with unbelievers[b][a]. For what partnership has righteousness with lawlessness? Or what fellowship has light with darkness?
translation:
  language: vi
  text: Đừng mang chung một ách không tương xứng với những người không tin.[b] Vì sự công chính[a] có sự chung phần gì với sự vô luật pháp? Hay ánh sáng có sự tương giao gì với bóng tối?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “công lý”.
    reason: lexical_alternative
  - marker: b
    text: Cách nói “mang chung một ách không tương xứng” gợi hình ảnh những con vật khác loại bị buộc chung dưới một ách; so sánh Phục Truyền Luật Lệ Ký 22:10.
    reason: cross_reference
lexical_decisions:
- source_word: Μὴ γίνεσθε
  choice: Đừng
  rationale: Thể mệnh lệnh hiện tại với μή diễn đạt lời cấm. Trong tiếng Việt, “Đừng mang…” tự nhiên hơn cách dịch sát nhưng nặng nề “Đừng trở nên là những người mang…”, trong khi vẫn giữ nguyên lực khuyên ngăn.
- source_word: ἑτεροζυγοῦντες
  choice: mang ách chung một cách không tương xứng
  rationale: Giữ hình ảnh những con vật không tương xứng bị buộc chung dưới một ách, đồng thời diễn đạt rõ ý kết hợp sai lệch hoặc không phù hợp.
- source_word: ἀπίστοις
  choice: với những người không tin
  rationale: Chỉ những người không tin; giới từ “với” phù hợp tự nhiên với hình ảnh mang ách chung.
- source_word: μετοχὴ
  choice: phần chung
  rationale: Diễn đạt ý cùng dự phần hoặc cùng chia sẻ, đồng thời phân biệt với κοινωνία ở vế kế tiếp.
- source_word: δικαιοσύνῃ
  choice: sự công chính
  rationale: Trong thế đối lập luân lý với ἀνομία, “sự công chính” giữ được nghĩa về điều ngay thẳng, phù hợp với cách dùng của Phao-lô; “công lý” được ghi nhận ở chú thích như một khả năng từ vựng.
- source_word: ἀνομίᾳ
  choice: sự vô luật pháp
  rationale: Dịch trực tiếp ý coi thường hay không tuân theo luật, và giữ thế đối lập từ vựng với “sự công chính” tốt hơn những từ rộng như “gian ác”.
- source_word: κοινωνία
  choice: sự tương giao
  rationale: Diễn đạt mối liên hệ gần gũi và sự cùng chia sẻ, thích hợp với câu hỏi tu từ và phân biệt được với μετοχή.
- source_word: φωτὶ
  choice: ánh sáng
  rationale: Giữ nguyên hình ảnh ẩn dụ trong thế đối lập với bóng tối.
- source_word: πρὸς σκότος
  choice: với bóng tối
  rationale: Trong cấu trúc nói về quan hệ và sự tương giao, “với” là cách diễn đạt tự nhiên trong tiếng Việt, dù πρός thường có nghĩa cơ bản là “hướng về”.
theological_decisions:
- issue: Cách dịch δικαιοσύνη trong thế đối lập của Phao-lô
  choice: sự công chính
  alternative: công lý
  rationale: Thế đối lập với ἀνομία nghiêng về phẩm chất và tình trạng ngay thẳng theo chuẩn mực của Đức Chúa Trời. Tuy nhiên, δικαιοσύνη cũng có thể mang sắc thái “công lý”, nên khả năng ấy được giữ trong chú thích thay vì bị loại bỏ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Bản dịch giữ hình ảnh “mang ách chung”, bảo tồn sự phân biệt giữa “phần chung” và “sự tương giao”, đồng thời tránh diễn giải câu này thành một quy tắc riêng cho bất kỳ loại quan hệ cụ thể nào.
