reference: 2 Corinthians 6:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Συνεργοῦντες δὲ καὶ παρακαλοῦμεν μὴ εἰς κενὸν τὴν χάριν τοῦ θεοῦ δέξασθαι ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/001.yaml
  text: Working together with him[a], we also urge you not to receive the grace of God in vain.
translation:
  language: vi
  text: Là những người cùng làm việc với Ngài,[a] chúng tôi cũng khuyên anh chị em đừng tiếp nhận ân điển của Đức Chúa Trời cách vô ích.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Là những người cùng làm việc, chúng tôi cũng khuyên anh chị em”; phân từ Hy Lạp không nói rõ Phao-lô cùng làm việc với ai, dù văn cảnh cho thấy rất có thể là Đức Chúa Trời.'
    reason: alternative_reading
lexical_decisions:
- source_word: Συνεργοῦντες
  choice: Là những người cùng làm việc với Ngài
  rationale: Giữ sắc thái chủ động của phân từ và diễn đạt tự nhiên trong tiếng Việt. Đại từ “Ngài” được bổ sung theo ngữ cảnh về công việc hòa giải của Đức Chúa Trời ở 5:18–20, nhưng được chú thích vì tiếng Hy Lạp không nêu rõ đối tượng cùng làm việc.
- source_word: δὲ καὶ
  choice: cũng
  rationale: δέ là từ chuyển ý nhẹ, có thể được hấp thụ vào dòng câu tiếng Việt; καί mang ý bổ sung và được thể hiện bằng “cũng”.
- source_word: παρακαλοῦμεν
  choice: chúng tôi cũng khuyên
  rationale: “Khuyên” truyền đạt lời kêu gọi tha thiết trong văn cảnh, rõ ràng và tự nhiên hơn “khuyến cáo” hay “khuyên nhủ”, đồng thời không quá chuyên biệt như “khuyến giục”.
- source_word: μὴ εἰς κενὸν
  choice: đừng ... cách vô ích
  rationale: εἰς κενόν là thành ngữ chỉ điều không sinh kết quả hoặc không đạt mục đích; “cách vô ích” giữ được lực tu từ của nguyên văn.
- source_word: τὴν χάριν τοῦ θεοῦ
  choice: ân điển của Đức Chúa Trời
  rationale: “Ân điển” là cách diễn đạt trang trọng, quen thuộc cho χάρις trong văn mạch Phao-lô và giữ nguyên kết cấu sở hữu của τοῦ θεοῦ.
- source_word: δέξασθαι ὑμᾶς
  choice: anh chị em đừng tiếp nhận
  rationale: δέχομαι được dịch là “tiếp nhận”, phù hợp với việc đón nhận ân điển; ὑμᾶς là số nhiều và được biểu đạt rõ bằng “anh chị em”.
theological_decisions:
- issue: Đối tượng hàm ẩn của Συνεργοῦντες
  choice: Hiểu là cùng làm việc với Đức Chúa Trời, nên dịch “cùng làm việc với Ngài”.
  alternative: 'Có thể dịch không nêu đối tượng: “Là những người cùng làm việc”; hoặc hiểu Phao-lô và các cộng sự cùng làm việc với nhau.'
  rationale: Văn cảnh gần nói về sáng kiến hòa giải của Đức Chúa Trời và vai trò sứ giả của Phao-lô (5:18–20). Tuy nhiên, vì nguyên văn không có đại từ chỉ đối tượng, bản dịch đánh dấu chú thích để bảo tồn tính hàm ẩn.
- issue: Ý nghĩa của việc nhận ân điển “cách vô ích”
  choice: Giữ nguyên sự căng thẳng của lời cảnh báo, không giải thích cụ thể ân điển trở nên vô hiệu theo nghĩa nào.
  alternative: Diễn giải là không đáp ứng ân điển, không sinh kết quả, hoặc đánh mất lợi ích của ân điển.
  rationale: εἰς κενόν diễn tả sự vô ích hay không đạt kết quả, nhưng câu này không xác định một cơ chế thần học cụ thể; không nên nhập thêm cách giải thích hệ phái.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. “Anh chị em” thể hiện đại từ số nhiều ὑμᾶς và giọng mục vụ; “Đức Chúa Trời” cùng “ân điển” duy trì văn phong Kinh Thánh quen thuộc. Dấu chú thích [a] được đặt ngay sau cụm từ có cách hiểu cần lưu ý.
