  text: Τὸ στόμα ἡμῶν ἀνέῳγεν πρὸς ὑμᾶς, Κορίνθιοι, ἡ καρδία ἡμῶν πεπλάτυνται·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/011.yaml
  text: Our mouth has been opened to you[a], Corinthians[b]; our heart has been widened.
translation:
  language: vi
  text: Hỡi người Cô-rinh-tô, miệng chúng tôi đã mở ra hướng về anh chị em[a]; lòng chúng tôi đã rộng mở[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay nói tự nhiên hơn: “chúng tôi đã nói cởi mở với anh chị em.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “lòng chúng tôi đã được mở rộng” hoặc “lòng chúng tôi đang rộng mở.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: στόμα
  choice: miệng
  rationale: Giữ hình ảnh thân thể nguyên văn và sự song hành tu từ với “lòng” ở vế sau.
- source_word: ἀνέῳγεν
  choice: đã mở ra
  rationale: Diễn đạt thể hoàn thành, chỉ một hành động đã xảy ra với kết quả còn tiếp diễn, đồng thời giữ ẩn dụ về miệng được mở.
- source_word: πρὸς ὑμᾶς
  choice: với anh chị em
  rationale: Trong ngữ cảnh nói năng hướng đến người nghe, “với anh chị em” tự nhiên trong tiếng Việt và vẫn thể hiện đối tượng được trực tiếp ngỏ lời.
- source_word: Κορίνθιοι
  choice: Hỡi người Cô-rinh-tô
  rationale: Thể hiện rõ cách xưng hô trực tiếp của dạng hô cách; “hỡi” tạo sắc thái trang trọng, khẩn thiết.
- source_word: καρδία
  choice: lòng
  rationale: “Lòng” là cách nói tự nhiên trong tiếng Việt về trung tâm tình cảm và tâm tình, đồng thời tránh cảm giác thuần giải phẫu của “trái tim”.
- source_word: πεπλάτυνται
  choice: đã rộng mở
  rationale: Giữ ý niệm nới rộng của động từ và sắc thái kết quả còn hiện hữu của thể hoàn thành; “rộng mở” tự nhiên hơn “đã được làm rộng” trong tiếng Việt.
theological_decisions:
- issue: Ẩn dụ về sự cởi mở trong lời nói và tình cảm của Phao-lô
  choice: Giữ hai hình ảnh “miệng… mở ra” và “lòng… rộng mở” trong câu chính.
  alternative: “Chúng tôi đã nói thẳng thắn với anh chị em…; chúng tôi hết lòng yêu thương anh chị em.”
  rationale: Bản dịch giữ cấu trúc hình ảnh của nguyên ngữ và không thu hẹp “lòng rộng mở” chỉ còn một cách diễn giải như tình yêu thương, sự chân thành hay sự cởi mở.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” để chỉ cộng đồng tín hữu được ngỏ lời; giữ các ẩn dụ nguyên ngữ nhưng bổ sung cách diễn đạt tự nhiên trong chú thích.
