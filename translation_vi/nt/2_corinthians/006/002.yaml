  to: 'Vì Ngài phán[a]: “Vào thời điểm thuận lợi, Ta đã lắng nghe con; trong ngày cứu rỗi, Ta đã giúp đỡ con.” Này, hiện nay là thời điểm đặc biệt thuận lợi; này[b], hiện nay là ngày cứu rỗi.'
  rationale: 'Sửa chính văn khi cần thiết để tránh hai chỗ diễn giải hoặc diễn đạt không tự nhiên: dùng “đã lắng nghe” cho ἐπήκουσά σου và “thời điểm thuận lợi” cho Καιρῷ δεκτῷ. “Đặc biệt thuận lợi” bảo toàn sắc thái tăng cường của εὐπρόσδεκτος so với δεκτός. Không áp đặt cách hiểu xác định hay bất định cho các cụm danh từ; tiếng Việt cho phép giữ độ mở của nguyên ngữ.'
