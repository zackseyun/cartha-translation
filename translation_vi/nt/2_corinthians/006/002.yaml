source:
  edition: SBLGNT
  text: λέγει γάρ· Καιρῷ δεκτῷ ἐπήκουσά σου καὶ ἐν ἡμέρᾳ σωτηρίας ἐβοήθησά σοι· ἰδοὺ νῦν καιρὸς εὐπρόσδεκτος, ἰδοὺ νῦν ἡμέρα σωτηρίας·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/002.yaml
  text: For he says[a], “At an acceptable time I listened to you, and in a day of salvation I helped you.” Behold, now is the acceptable time; behold[b], now is the day of salvation.
translation:
  language: vi
  text: 'Vì Ngài phán[a]: “Vào thời điểm thuận lợi, Ta đã lắng nghe con; trong ngày cứu rỗi, Ta đã giúp đỡ con.” Này, hiện nay là thời điểm đặc biệt thuận lợi; này[b], hiện nay là ngày cứu rỗi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hoặc “Ta đã nghe con cách thuận nhận.” Động từ Hy Lạp có thể chỉ việc nghe với sắc thái thuận nhận hoặc đáp ứng.
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể diễn đạt: “hiện nay là thời điểm thuận lợi … hiện nay là ngày cứu rỗi.” Tiếng Hy Lạp không dùng mạo từ trong các cụm này; tiếng Việt không cần thêm “một,” “ấy,” hoặc từ chỉ định khác.'
    reason: alternative_reading
lexical_decisions:
- source_word: λέγει γάρ
  choice: Vì Ngài phán
  rationale: γάρ nối câu này với lời kêu gọi trước đó bằng ý giải thích; λέγει ở hiện tại dẫn lời Kinh Thánh. Đại từ kính trọng “Ngài” giữ chủ thể cá nhân hàm ẩn là Đức Chúa Trời mà không thêm danh xưng vào nguyên văn.
- source_word: Καιρῷ δεκτῷ
  choice: Trong thời điểm được đoái nhận
  rationale: καιρός là thời điểm thích hợp hơn là thời gian nói chung; δεκτός có nghĩa được chấp nhận hay được ưu ái. Cách dịch này phù hợp với lời Đức Chúa Trời nói với người cầu xin và tránh biến cụm từ thành phẩm chất của chính thời gian.
- source_word: ἐπήκουσά σου
  choice: Ta đã nhậm lời con
  rationale: ἐπακούω chỉ việc nghe với thái độ thuận nhận hoặc đáp ứng. “Nhậm lời” diễn đạt tự nhiên sắc thái nghe thuận tình trong văn phong Kinh Thánh, dù mạnh hơn nghĩa đơn thuần “nghe”; phương án ít diễn giải hơn được ghi chú.
- source_word: ἐν ἡμέρᾳ σωτηρίας
  choice: trong ngày cứu rỗi
  rationale: Giữ cấu trúc giới từ và cụm danh từ không có mạo từ của tiếng Hy Lạp; tiếng Việt không buộc phải phân định xác định hay bất định.
- source_word: ἐβοήθησά σοι
  choice: Ta đã giúp đỡ con
  rationale: βοηθέω có nghĩa giúp đỡ hoặc đến cứu giúp; “giúp đỡ” rõ ràng, tự nhiên và không thêm mức độ khẩn cấp.
- source_word: ἰδοὺ
  choice: Kìa
  rationale: “Kìa” là tiểu từ trang trọng, tự nhiên, giữ chức năng thu hút sự chú ý và sức nhấn mạnh của ἰδού.
- source_word: νῦν
  choice: hiện nay
  rationale: Giữ ý nghĩa thời gian và tính cấp thiết của lời áp dụng của Phao-lô.
- source_word: καιρὸς εὐπρόσδεκτος
  choice: thời điểm thật thuận lợi
  rationale: εὐπρόσδεκτος mang nghĩa rất đáng được tiếp nhận hoặc đặc biệt thuận lợi; “thật thuận lợi” tự nhiên trong tiếng Việt và phân biệt sắc thái tăng cường với δεκτός ở câu trích dẫn.
- source_word: ἡμέρα σωτηρίας
  choice: ngày cứu rỗi
  rationale: Dịch trực tiếp cụm từ không có mạo từ; tiếng Việt giữ được sự không xác định về tính xác định mà không cần thêm “một” hay “ngày ấy”.
theological_decisions:
- issue: Cụm chỉ thời điểm và ngày cứu rỗi nên được hiểu là xác định hay bất định
  choice: 'Không thêm từ chỉ định hoặc số từ: “thời điểm thật thuận lợi” và “ngày cứu rỗi.”'
  alternative: “thời điểm thuận lợi ấy” / “ngày cứu rỗi ấy,” hoặc “một thời điểm thuận lợi” / “một ngày cứu rỗi”
  rationale: Các cụm tiếng Hy Lạp không có mạo từ, nhưng điều đó không tự động buộc nghĩa bất định. Tiếng Việt cho phép để ngỏ nét nghĩa này, vừa giữ sự cấp thiết của “hiện nay” vừa không áp đặt một lược đồ cánh chung cụ thể.
- issue: Chủ thể của λέγει là Kinh Thánh hay Đức Chúa Trời
  choice: 'Dịch theo chủ thể cá nhân: “Ngài phán.”'
  alternative: “Kinh Thánh chép” hoặc “có lời rằng”
  rationale: Ngữ cảnh trích dẫn đặt lời nói trong miệng Đức Chúa Trời. “Ngài phán” bảo tồn nét thần học ấy nhưng không thêm danh xưng không có trong câu Hy Lạp.
- issue: Mức độ diễn giải của ἐπήκουσά σου
  choice: “Ta đã nhậm lời con” trong chính văn, kèm phương án sát hình thức hơn trong chú thích.
  alternative: “Ta đã nghe con cách thuận tình” hoặc “Ta đã lắng nghe con”
  rationale: Động từ có thể bao hàm việc nghe với sự thuận nhận hay đáp ứng. “Nhậm lời” tự nhiên và phù hợp ngữ cảnh, nhưng chú thích bảo tồn phạm vi nghĩa rộng hơn để không đồng nhất tuyệt đối việc nghe với một hình thức đáp lời cụ thể.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài phán,” “Ta,” “con” để phản ánh lời Đức Chúa Trời nói với người được xưng hô; “Kìa” giữ sức nhấn mạnh tu từ. “Cứu rỗi” được giữ vì là thuật ngữ thần học quen thuộc, còn cấu trúc câu được làm tự nhiên theo tiếng Việt.
