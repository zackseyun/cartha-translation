id: 2CO.2.16
reference: 2 Corinthians 2:16
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οἷς μὲν ὀσμὴ ⸀ἐκ θανάτου εἰς θάνατον, οἷς δὲ ὀσμὴ ⸁ἐκ ζωῆς εἰς ζωήν. καὶ πρὸς ταῦτα τίς ἱκανός;
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/016.yaml
  text: To the one[a], a fragrance from death to death; to the other, a fragrance from life to life[c][b]. And who is sufficient for these things?
translation:
  language: vi
  text: Đối với người này, là một mùi[a] từ sự chết đến sự chết; còn đối với người kia, là một mùi từ sự sống đến sự sống.[b] Ai đủ khả năng cho những điều này?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Mùi” cũng có thể dịch là “mùi hương” hoặc “hương”; áp dụng cho cả hai lần xuất hiện trong câu.
    reason: lexical_alternative
  - marker: b
    text: Hai cụm “từ sự chết đến sự chết” và “từ sự sống đến sự sống” có thể chỉ nguồn gốc và kết quả (“phát ra từ sự chết và dẫn đến sự chết” / “phát ra từ sự sống và dẫn đến sự sống”), hoặc là cách diễn đạt nhấn mạnh tính chất.
    reason: alternative_reading
  - marker: c
    text: “Đủ khả năng” cũng có thể dịch là “đủ sức” hoặc “xứng hợp”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀσμή
  choice: mùi
  rationale: “Mùi” là từ tự nhiên và tương đối trung tính trong tiếng Việt, giữ được hình ảnh khứu giác mà không mặc nhiên biến cả hai vế thành dễ chịu hay khó chịu. “Mùi hương” là một khả năng khác nhưng thường mang sắc thái tích cực hơn.
- source_word: ἐκ θανάτου εἰς θάνατον
  choice: từ sự chết đến sự chết
  rationale: Cách dịch sát và cô đọng này giữ nguyên cấu trúc song hành cùng độ mở của nguyên văn, thay vì quyết định rằng cụm từ chỉ nguồn gốc-kết quả hay chỉ sự nhấn mạnh.
- source_word: ἐκ ζωῆς εἰς ζωήν
  choice: từ sự sống đến sự sống
  rationale: Giữ đúng thế cân xứng với vế “từ sự chết đến sự chết” và không thu hẹp ý nghĩa vào một cách giải thích duy nhất.
- source_word: πρὸς ταῦτα
  choice: cho những việc này
  rationale: Diễn đạt tự nhiên mối liên hệ giữa sự đủ sức và những thực tại hoặc công việc vừa được nói đến, đồng thời phản ánh dạng số nhiều của ταῦτα.
- source_word: ἱκανός
  choice: đủ sức
  rationale: Cụm từ này tự nhiên trong tiếng Việt và diễn tả khả năng tương xứng với trọng trách, phù hợp với câu hỏi tu từ của Phao-lô.
theological_decisions:
- issue: Ý nghĩa của hai cụm “từ sự chết đến sự chết” và “từ sự sống đến sự sống”
  choice: Giữ nguyên lối diễn đạt cô đọng và song hành của tiếng Hy Lạp trong chính văn.
  alternative: Diễn giải là “phát ra từ sự chết và dẫn đến sự chết / phát ra từ sự sống và dẫn đến sự sống”, hoặc hiểu là cách nhấn mạnh tính chất chết chóc / đầy sức sống.
  rationale: Nguyên văn không buộc phải chọn riêng cách hiểu nguồn gốc-kết quả hay cách hiểu nhấn mạnh tính chất. Bản dịch vì thế bảo toàn sự mơ hồ có chủ ý và sức căng thần học của câu.
- issue: Chủ thể ngầm trong hai mệnh đề đầu
  choice: Dùng “đó là” ở mệnh đề đầu và lược ở mệnh đề song hành thứ hai để tạo câu tiếng Việt tự nhiên mà vẫn nối với văn cảnh trước.
  alternative: Bổ sung rõ “chúng tôi là” từ văn cảnh câu 15.
  rationale: Tiếng Hy Lạp của câu này dựa vào câu trước và không lặp lại chủ thể. “Đó là” giúp câu đứng vững trong tiếng Việt mà không đưa “chúng tôi” vào nơi câu 16 không nêu lại.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Bản dịch giữ phép đối cùng nhịp điệu cô đọng của nguyên văn; từ “mùi” được chọn vì trung tính hơn “hương thơm”, nhờ đó phù hợp với cả vế sự chết lẫn vế sự sống.
