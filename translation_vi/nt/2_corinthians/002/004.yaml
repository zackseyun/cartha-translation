review_pass:
  verdict: revise
  source_fidelity: Bản dịch truyền đạt đúng cấu trúc mục đích và phần lớn nội dung của câu. Tuy nhiên, “từ nỗi khốn khổ lớn lao và lòng quặn thắt” chưa song song về cú pháp, còn “đặc biệt” làm yếu sắc thái mức độ/so sánh của περισσοτέρως. Bản sửa giữ đối tượng so sánh không được nêu rõ trong nguyên văn.
  naturalness: “Vì từ ... và lòng quặn thắt” hơi gượng trong tiếng Việt hiện đại. Thêm “sự ... trong lòng” tạo cấu trúc tự nhiên, rõ nghĩa. “Trong bao nước mắt” là cách diễn đạt tự nhiên cho hoàn cảnh/cách thức viết trong nước mắt.
  terminology: “Anh chị em” phù hợp cho số nhiều ὑμῖν/ὑμᾶς trong văn phong cộng đồng. “Tình yêu thương” phù hợp với ἀγάπη. “Dồi dào hơn” phản ánh tốt hơn περισσοτέρως; chú thích nêu phương án “đặc biệt” để bảo lưu cách hiểu ngữ cảnh.
  issues:
  - severity: medium
    issue: Cú pháp không song song trong cụm mở đầu
    rationale: 'Nguyên văn có hai danh từ liên kết: πολλῆς θλίψεως καὶ συνοχῆς καρδίας. “nỗi khốn khổ ... và lòng quặn thắt” ghép một danh ngữ với một cụm chủ-vị/tính chất không cân xứng. “nỗi khốn khổ lớn lao và sự quặn thắt trong lòng” rõ và tự nhiên hơn.'
  - severity: medium
    issue: “đặc biệt” không phản ánh đầy đủ περισσοτέρως
    rationale: περισσοτέρως chủ yếu diễn tả mức độ gia tăng/so sánh (“hơn”, “dồi dào hơn”), dù đối tượng so sánh không được nêu. “Đặc biệt” chuyển trọng tâm sang tính chọn lọc hay ưu tiên.
  - severity: low
    issue: Neo chú thích cần đi cùng từ/cụm từ có phương án thay thế
    rationale: Chú thích về cách hiểu của περισσοτέρως nên được đặt ngay sau “dồi dào hơn”, thay vì sau toàn câu.
  revised_text: Vì từ nỗi khốn khổ lớn lao và sự quặn thắt trong lòng, tôi đã viết cho anh chị em trong bao nước mắt, không phải để làm anh chị em đau buồn, nhưng để anh chị em biết tình yêu thương dồi dào hơn[a] mà tôi dành cho anh chị em.
