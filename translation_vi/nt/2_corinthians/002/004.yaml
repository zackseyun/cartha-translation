source:
  edition: SBLGNT
  text: ἐκ γὰρ πολλῆς θλίψεως καὶ συνοχῆς καρδίας ἔγραψα ὑμῖν διὰ πολλῶν δακρύων, οὐχ ἵνα λυπηθῆτε, ἀλλὰ τὴν ἀγάπην ἵνα γνῶτε ἣν ἔχω περισσοτέρως εἰς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/004.yaml
  text: For out of much affliction and anguish of heart I wrote to you through many tears[a], not so that you might be grieved[b], but so that you might know the love that I have especially for you.
translation:
  language: vi
  text: Vì từ nỗi khốn khổ lớn lao và sự quặn thắt trong lòng, tôi đã viết cho anh chị em trong bao nước mắt, không phải để làm anh chị em đau buồn, nhưng để anh chị em biết tình yêu thương dồi dào hơn[a] mà tôi dành cho anh chị em.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “tình yêu thương đặc biệt mà tôi dành cho anh chị em.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ πολλῆς θλίψεως καὶ συνοχῆς καρδίας
  choice: từ nỗi khốn khổ lớn lao và lòng quặn thắt
  rationale: Giữ ý nguồn gốc/nguyên do của ἐκ, sức nặng của θλίψις và hình ảnh nội tâm bị dồn ép trong συνοχὴ καρδίας, đồng thời diễn đạt tự nhiên bằng tiếng Việt hiện đại.
- source_word: ἔγραψα ὑμῖν
  choice: tôi đã viết cho anh chị em
  rationale: Dịch trực tiếp thì aorist, không tự ý xác định đây là một bức thư nào khác; “anh chị em” diễn đạt số nhiều bao gồm cả cộng đồng.
- source_word: διὰ πολλῶν δακρύων
  choice: giữa bao nước mắt
  rationale: Diễn đạt tự nhiên hoàn cảnh đầy nước mắt khi Phao-lô viết, vẫn giữ cường độ của πολλῶν.
- source_word: λυπηθῆτε
  choice: anh chị em đau buồn
  rationale: Giữ ý người nhận bị làm cho buồn đau mà không thu hẹp thành một sắc thái cảm xúc quá cụ thể.
- source_word: ἀγάπην
  choice: tình yêu thương
  rationale: Cách dịch phổ thông, trang trọng và phù hợp ngữ cảnh quan hệ mục vụ.
- source_word: γνῶτε
  choice: biết
  rationale: Giữ nguyên mục đích của mệnh đề ἵνα và không quyết định quá mức giữa ‘biết’, ‘nhận ra’ hay ‘hiểu rõ hơn’.
- source_word: περισσοτέρως εἰς ὑμᾶς
  choice: đặc biệt tôi dành cho anh chị em
  rationale: “Đặc biệt” diễn đạt tự nhiên giá trị gia tăng/so sánh của περισσοτέρως trong ngữ cảnh; chú thích bảo lưu khả năng hiểu theo mức độ dồi dào hơn.
theological_decisions:
- issue: Sắc thái so sánh của περισσοτέρως trong lời khẳng định về tình yêu
  choice: tình yêu thương đặc biệt tôi dành cho anh chị em
  alternative: tình yêu thương dồi dào hơn tôi dành cho anh chị em
  rationale: Bản chính ưu tiên cách nói tự nhiên mà không xác định đối tượng so sánh vốn không được nêu rõ; chú thích giữ lại cách hiểu nhấn mạnh mức độ.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh chị em” cho đại từ số nhiều ὑμῖν/ὑμᾶς; tránh lối nói cổ và không thêm cách giải thích mang tính hệ phái.
