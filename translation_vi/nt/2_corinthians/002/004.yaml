revisions:
- from: Vì từ nỗi khốn khổ lớn lao và lòng quặn thắt, tôi đã viết cho anh chị em giữa bao nước mắt, không phải để anh chị em đau buồn, nhưng để anh chị em biết tình yêu thương đặc biệt tôi dành cho anh chị em.[a]
  to: Vì từ nỗi khốn khổ lớn lao và sự quặn thắt trong lòng, tôi đã viết cho anh chị em trong bao nước mắt, không phải để làm anh chị em đau buồn, nhưng để anh chị em biết tình yêu thương dồi dào hơn[a] mà tôi dành cho anh chị em.
  rationale: Bản sửa làm cho hai vế danh từ ở đầu câu cân xứng, diễn đạt διὰ πολλῶν δακρύων tự nhiên, và đưa sắc thái tăng cường/so sánh của περισσοτέρως vào bản chính mà không thêm đối tượng so sánh. Chú thích bảo lưu phương án diễn đạt theo sắc thái “đặc biệt”.
