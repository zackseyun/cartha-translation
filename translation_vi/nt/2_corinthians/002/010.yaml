source:
  edition: SBLGNT
  text: ᾧ δέ τι χαρίζεσθε, κἀγώ· καὶ γὰρ ἐγὼ ⸂ὃ κεχάρισμαι, εἴ τι⸃ κεχάρισμαι, δι’ ὑμᾶς ἐν προσώπῳ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/010.yaml
  text: To anyone whom you forgive anything[a], I do too. For what I have forgiven—if I have forgiven anything—I have forgiven for your sake in the presence of Messiah,
translation:
  language: vi
  text: Anh em tha thứ cho ai về điều gì thì tôi cũng tha thứ. Thật vậy, điều tôi đã tha thứ—nếu tôi đã tha thứ điều gì—thì tôi đã tha thứ vì anh em, trước mặt Đấng Mê-si.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “trong cương vị của Đấng Mê-si.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾧ δέ τι χαρίζεσθε, κἀγώ
  choice: Anh em tha thứ cho ai điều gì thì tôi cũng tha thứ
  rationale: χαρίζομαι trong bối cảnh kỷ luật và phục hồi chỉ việc tha thứ một lỗi phạm. Cách diễn đạt này giữ đủ người được tha, điều được tha và sự hưởng ứng của Phao-lô, đồng thời tự nhiên trong tiếng Việt.
- source_word: ὃ κεχάρισμαι, εἴ τι κεχάρισμαι
  choice: điều tôi đã tha thứ—nếu quả tôi đã tha thứ điều gì—
  rationale: Giữ nguyên lối nói có điều kiện, phần nào tự hạ mình của Phao-lô, thay vì làm phẳng câu. Dấu gạch ngang thể hiện mệnh đề xen vào.
- source_word: δι’ ὑμᾶς
  choice: vì anh em
  rationale: διά với đối cách ở đây nêu lợi ích hoặc mối quan tâm hướng đến tín hữu Cô-rinh-tô; “vì anh em” ngắn gọn và tự nhiên.
- source_word: ἐν προσώπῳ Χριστοῦ
  choice: trước mặt Đấng Mê-si
  rationale: πρόσωπον có thể chỉ mặt, sự hiện diện hoặc thân vị. “Trước mặt” diễn đạt tự nhiên ý hành động trong sự hiện diện và dưới ánh nhìn của Đấng Mê-si, còn nghĩa “trong thân vị” được giữ ở chú thích.
- source_word: Χριστοῦ
  choice: Đấng Mê-si
  rationale: Χριστός ở đây được giữ như một tước hiệu, không bị xử lý như tên riêng; “Đấng Mê-si” truyền đạt chức danh ấy rõ ràng trong tiếng Việt hiện đại.
theological_decisions:
- issue: Nên dịch Χριστοῦ như một tước hiệu hay giữ dạng tên gọi truyền thống “Đấng Christ”.
  choice: Đấng Mê-si
  alternative: Đấng Christ
  rationale: Ngữ cảnh không đòi hỏi cách hiểu như tên riêng. Dịch tước hiệu giúp bảo toàn ý nghĩa của Χριστός mà không thêm nét giáo phái.
- issue: ἐν προσώπῳ Χριστοῦ nói đến sự hiện diện của Đấng Mê-si hay việc Phao-lô hành động trong thân vị của ngài.
  choice: trước mặt Đấng Mê-si
  alternative: trong thân vị của Đấng Mê-si
  rationale: Cả hai cách hiểu đều có cơ sở từ πρόσωπον. Bản chính dùng cách tự nhiên hơn và ít áp đặt hơn trong tiếng Việt; cách hiểu còn lại được nêu trong chú thích để giữ sự mơ hồ thật của nguyên văn.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, dùng “anh em” phù hợp lời Phao-lô gửi cộng đồng. Sự lặp lại của “tha thứ” được giữ có chủ ý để phản ánh cấu trúc Hy Lạp và không xóa đi sắc thái dè dặt của câu.
