  text: διὸ παρακαλῶ ὑμᾶς κυρῶσαι εἰς αὐτὸν ἀγάπην·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/008.yaml
  text: Therefore I urge you to confirm your love for him.
translation:
  language: vi
  text: Vì vậy, tôi khuyên anh chị em hãy xác nhận tình yêu thương của mình đối với người ấy.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διό
  choice: Vì vậy
  rationale: Diễn đạt rõ quan hệ suy luận với lời khuyên ở văn cảnh trước.
- source_word: παρακαλῶ
  choice: tôi khuyên
  rationale: Trong ngữ cảnh này, động từ mang nghĩa khẩn khoản khuyên nhủ; “khuyên” tự nhiên và không cường điệu sắc thái.
- source_word: ὑμᾶς
  choice: anh chị em
  rationale: Đại từ số nhiều chỉ cộng đồng tín hữu; cách gọi này tự nhiên, bao quát giới tính và phù hợp văn phong thư tín.
- source_word: κυρῶσαι
  choice: hãy xác nhận
  rationale: Giữ ý làm cho tình yêu được công khai xác lập hoặc chứng thực, phù hợp với nghĩa của động từ trong lời kêu gọi cộng đồng.
- source_word: εἰς αὐτὸν ἀγάπην
  choice: tình yêu thương của mình đối với người ấy
  rationale: “Đối với người ấy” chuyển đạt hướng của εἰς αὐτόν; “của mình” làm rõ tình yêu thuộc về cộng đồng mà không thêm nội dung thần học.
theological_decisions:
- issue: Tính chất của hành động κυρῶσαι
  choice: xác nhận tình yêu thương
  alternative: tái khẳng định tình yêu thương
  rationale: Bản Hy Lạp nhấn mạnh việc xác lập hoặc chứng thực tình yêu; “xác nhận” giữ được nghĩa này mà không mặc nhiên khẳng định rằng cộng đồng trước đó đã công khai bày tỏ tình yêu rồi.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “anh chị em” cho đối tượng số nhiều; “người ấy” giữ cách quy chiếu kín đáo của nguyên văn.
