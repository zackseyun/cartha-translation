  terminology: “Xác nhận tình yêu thương” là một lựa chọn có thể chấp nhận cho κυρῶσαι và phù hợp với “confirm” trong vệt kiểm tra tiếng Anh. Không cần thêm “tái-”, vì nguyên văn không buộc phải khẳng định một sự xác nhận công khai trước đó. “Tình yêu thương” phù hợp với ἀγάπην trong ngữ cảnh kêu gọi cộng đồng tiếp nhận và tha thứ.
