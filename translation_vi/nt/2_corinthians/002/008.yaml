  source_fidelity: 'Bản dịch chuyển đạt sát cấu trúc và ý nghĩa của nguyên văn: διό là quan hệ suy luận (“Vì vậy”); παρακαλῶ là lời khuyên/khẩn khoản của Phao-lô; ὑμᾶς là số nhiều; κυρῶσαι diễn tả việc xác nhận hay làm cho tình yêu được công nhận cách rõ ràng; và εἰς αὐτόν giữ hướng quy chiếu đến “người ấy.”'
