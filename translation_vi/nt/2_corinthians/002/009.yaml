  to: 'Vì lý do này, tôi cũng đã viết để biết các bạn đã chứng tỏ mình thế nào: liệu các bạn có vâng lời trong mọi việc hay không.[a]'
  rationale: Sửa để phản ánh δοκιμή như sự chứng tỏ hay phẩm chất được kiểm chứng, thay vì diễn giải thành hành động vượt qua một thử nghiệm. Giữ cấu trúc mục đích của ἵνα γνῶ và lực câu hỏi gián tiếp của εἰ, đồng thời dùng tiếng Việt hiện đại, tự nhiên.
