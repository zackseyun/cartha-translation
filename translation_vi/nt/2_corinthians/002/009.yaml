  text: εἰς τοῦτο γὰρ καὶ ἔγραψα ἵνα γνῶ τὴν δοκιμὴν ὑμῶν, εἰ εἰς πάντα ὑπήκοοί ἐστε.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/009.yaml
  text: 'For this is why I also wrote: so that I might know the proof of you[a], whether you are obedient in everything.'
translation:
  language: vi
  text: 'Vì lý do này, tôi cũng đã viết để biết các bạn đã chứng tỏ mình thế nào: liệu các bạn có vâng lời trong mọi việc hay không.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “để biết sự thử thách của các bạn”; hoặc “để biết phẩm chất đã được chứng tỏ của các bạn.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς τοῦτο γὰρ
  choice: Vì thế
  rationale: Diễn đạt tự nhiên quan hệ giải thích/mục đích trong mạch văn; cụm này có thể chỉ điều vừa nêu hoặc mục đích được trình bày tiếp theo.
- source_word: καὶ ἔγραψα
  choice: tôi cũng đã viết
  rationale: Giữ sắc thái bổ sung của καὶ và diễn đạt động từ aorist bằng một hành động viết đã xảy ra.
- source_word: ἵνα γνῶ
  choice: để biết
  rationale: Giữ rõ mệnh đề chỉ mục đích và ý nghĩa đi đến chỗ nhận biết.
- source_word: τὴν δοκιμὴν ὑμῶν
  choice: các bạn có vượt qua sự thử nghiệm hay không
  rationale: δοκιμή có thể chỉ sự thử nghiệm hoặc phẩm chất được chứng minh qua thử nghiệm. Cách diễn đạt này tự nhiên trong tiếng Việt, phù hợp với εἰ theo sau và không mặc nhiên gán cho người nhận một phẩm chất trừu tượng.
- source_word: εἰ εἰς πάντα ὑπήκοοί ἐστε
  choice: tức là có vâng lời trong mọi việc không
  rationale: Hiểu εἰ là dấu hiệu của câu hỏi gián tiếp; «tức là» làm rõ rằng sự vâng lời trong mọi việc là nội dung của sự thử nghiệm trong ngữ cảnh.
theological_decisions:
- issue: δοκιμή nói đến quá trình thử nghiệm hay kết quả/phẩm chất đã được chứng minh
  choice: Giữ trọng tâm ở việc họ có vượt qua sự thử nghiệm hay không
  alternative: để biết phẩm chất đã được chứng minh của các bạn
  rationale: Danh từ cho phép cả hai sắc thái. Bản dịch chính giữ hình ảnh thử nghiệm và để mệnh đề về sự vâng lời giải thích tiêu chuẩn, còn chú thích bảo lưu cách hiểu theo kết quả.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “các bạn” để chỉ cộng đồng tín hữu số nhiều; “vâng lời” giữ sắc thái đạo đức và quan hệ của ὑπήκοοι.
