    rationale: τὸ μὴ ... ἐλθεῖν là nội dung của quyết định và tự nó không xác định thời điểm tương lai. “Không lại đến” phản ánh sát hơn mà vẫn tự nhiên.
  - severity: low
    issue: “đã tự quyết định” không tự nhiên bằng cách diễn đạt không có “tự”.
    rationale: ἐμαυτῷ nhấn mạnh tính cá nhân/nội tâm của quyết định, nhưng trong tiếng Việt điều này đã được chủ ngữ “tôi” và động từ “quyết định” chuyển tải đủ trong văn cảnh.
  revised_text: 'Vì tôi đã quyết định điều này: không lại đến với anh chị em trong nỗi buồn[a].'
