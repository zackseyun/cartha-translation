  text: ἔκρινα ⸀γὰρ ἐμαυτῷ τοῦτο, τὸ μὴ πάλιν ἐν λύπῃ πρὸς ὑμᾶς ἐλθεῖν·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/001.yaml
  text: 'For I decided this for myself: not to come to you again in sorrow[a].'
translation:
  language: vi
  text: 'Vì tôi đã quyết định điều này: không lại đến với anh chị em trong nỗi buồn[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “với nỗi buồn.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔκρινα
  choice: đã quyết định
  rationale: Động từ ở thì aorist diễn tả một quyết định cá nhân đã được xác lập; cách dịch này tự nhiên và giữ được sắc thái cân nhắc.
- source_word: γὰρ
  choice: Vì
  rationale: Liên từ nối câu này với văn cảnh trước theo quan hệ giải thích hoặc nêu lý do.
- source_word: ἐμαυτῷ
  choice: tự
  rationale: Diễn đạt gọn và tự nhiên việc Phao-lô đích thân đi đến quyết định ấy.
- source_word: τοῦτο
  choice: điều này
  rationale: Đại từ chỉ về phía trước, đến nội dung quyết định được nêu sau dấu hai chấm.
- source_word: τὸ μὴ ... ἐλθεῖν
  choice: sẽ không ... đến
  rationale: Truyền đạt nội dung của quyết định bằng cấu trúc tự nhiên trong tiếng Việt, đồng thời giữ rõ chủ thể ngôi thứ nhất từ mệnh đề chính.
- source_word: πάλιν
  choice: lại
  rationale: Giữ ý về sự lặp lại mà không hàm ý chắc chắn có một chuyến thăm đau buồn trung gian.
- source_word: ἐν λύπῃ
  choice: trong nỗi buồn
  rationale: Giữ hình ảnh giới từ của nguyên văn và để mở khả năng nỗi buồn mô tả tâm trạng hoặc hoàn cảnh của chuyến thăm.
- source_word: πρὸς ὑμᾶς
  choice: đến với anh chị em
  rationale: Với động từ chỉ sự đến, πρός diễn tả hướng đến những người nhận thư; “anh chị em” phù hợp cộng đồng tín hữu gồm cả nam lẫn nữ.
