id: 2CO.2.2
reference: 2 Corinthians 2:2
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἰ γὰρ ἐγὼ λυπῶ ὑμᾶς, καὶ ⸀τίς ὁ εὐφραίνων με εἰ μὴ ὁ λυπούμενος ἐξ ἐμοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/002.yaml
  text: For if I grieve you[a], who is there to make me glad except the one who is grieved by me?
translation:
  language: vi
  text: Vì nếu tôi làm anh chị em buồn, thì ai còn làm tôi vui, ngoài người bị tôi làm cho buồn?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “ngoài người buồn vì tôi”; cụm Hy Lạp ἐξ ἐμοῦ diễn tả nguồn gốc hoặc nguyên nhân, nghĩa là “bởi tôi” hay “vì tôi”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λυπῶ
  choice: làm anh chị em đau buồn
  rationale: Diễn đạt tự nhiên động từ mang nghĩa gây buồn đau, đồng thời giữ sắc thái tác động của thể chủ động.
- source_word: εὐφραίνων
  choice: làm tôi vui
  rationale: Phản ánh rõ người đem lại niềm vui cho Phao-lô và giữ thế tương phản với việc làm người khác đau buồn.
- source_word: τίς ὁ εὐφραίνων με
  choice: ai sẽ làm tôi vui
  rationale: Chuyển phân từ dùng như danh từ thành câu hỏi tu từ tự nhiên trong tiếng Việt.
- source_word: ὁ λυπούμενος
  choice: người bị ... làm cho đau buồn
  rationale: Giữ thể bị động và sắc thái đang chịu nỗi buồn của phân từ hiện tại.
- source_word: ἐξ ἐμοῦ
  choice: bị tôi làm cho
  rationale: 'Thể hiện quan hệ nguồn gốc hoặc nguyên nhân: nỗi buồn phát sinh bởi Phao-lô.'
- source_word: γὰρ
  choice: Vì
  rationale: Giữ liên kết giải thích với lập luận ở câu trước.
theological_decisions:
- issue: Quan hệ tác nhân trong ὁ λυπούμενος ἐξ ἐμοῦ
  choice: người bị tôi làm cho đau buồn
  alternative: người đau buồn vì tôi
  rationale: Bản dịch chính giữ rõ thể bị động của λυπούμενος và nguyên nhân do Phao-lô, nhưng chú thích bảo lưu khả năng hiểu ἐξ ἐμοῦ theo nghĩa nguyên nhân rộng hơn.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải. Dùng “anh chị em” cho đại từ số nhiều ὑμᾶς; dùng “chính” để làm nổi bật lực giới hạn của εἰ μὴ trong câu hỏi tu từ.
