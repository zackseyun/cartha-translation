revisions:
- from: Vì nếu tôi làm anh chị em đau buồn, thì ai sẽ làm tôi vui, nếu không phải là chính người bị tôi làm cho đau buồn?[a]
  to: Vì nếu tôi làm anh chị em buồn, thì ai còn làm tôi vui, ngoài người bị tôi làm cho buồn?[a]
  rationale: Sửa thì tương lai thành hiện tại để phản ánh phân từ hiện tại εὐφραίνων, và làm gọn hai cụm diễn đạt nỗi buồn theo cách tự nhiên trong tiếng Việt. Bản dịch vẫn giữ thể bị động của ὁ λυπούμενος trong câu chính; chú thích bảo lưu cách hiểu nguyên nhân rộng hơn của ἐξ ἐμοῦ.
  reviewer_model: gpt-5.6-terra
