id: 2CO.2.12
reference: 2 Corinthians 2:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἐλθὼν δὲ εἰς τὴν Τρῳάδα εἰς τὸ εὐαγγέλιον τοῦ Χριστοῦ καὶ θύρας μοι ἀνεῳγμένης ἐν κυρίῳ,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/012.yaml
  text: When I came to Troas for the gospel of Messiah[a], and a door had been opened for me in the Lord[b],
translation:
  language: vi
  text: Khi tôi đến Trô-a vì Tin Lành của Đấng Mê-si-a[a], và một cánh cửa đã được mở cho tôi trong Chúa[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “Tin Lành của Đấng Christ.”'
    reason: lexical_alternative
  - marker: b
    text: 'Hay: “và một cánh cửa đang rộng mở cho tôi trong Chúa.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐλθὼν δὲ
  choice: Khi tôi đến
  rationale: Phân từ bất định Ἐλθὼν mang ý nghĩa thời gian trong ngữ cảnh. “Khi tôi đến” tự nhiên trong tiếng Việt; δέ chỉ đánh dấu sự chuyển ý nhẹ nên không cần thêm một từ nối dễ gây cảm giác tương phản mạnh.
- source_word: εἰς τὴν Τρῳάδα
  choice: đến Trô-a
  rationale: Diễn đạt hướng chuyển động đến một địa danh bằng tiếng Việt tự nhiên.
- source_word: εἰς τὸ εὐαγγέλιον
  choice: vì Tin Lành
  rationale: εἰς ở đây chỉ mục đích hoặc nguyên do hướng đến. “Vì Tin Lành” giữ cách nói cô đọng của nguyên văn và không tự ý thêm hành động “rao giảng”.
- source_word: τοῦ Χριστοῦ
  choice: của Đấng Mê-si
  rationale: Χριστός ở đây mang sắc thái tước hiệu. Cấu trúc “của” giữ nguyên độ rộng nghĩa của sở hữu cách, không quyết định đó là Tin Lành thuộc về hay nói về Đấng Mê-si.
- source_word: θύρας
  choice: một cánh cửa
  rationale: Giữ nguyên hình ảnh ẩn dụ của Phao-lô thay vì giải nghĩa trực tiếp thành “một cơ hội”.
- source_word: ἀνεῳγμένης
  choice: đã được mở ra
  rationale: Phân từ hoàn thành bị động diễn tả một hành động đã xảy ra với kết quả còn hiệu lực; cách dịch này thể hiện cả hành động lẫn trạng thái kết quả.
- source_word: ἐν κυρίῳ
  choice: trong Chúa
  rationale: Giữ cách diễn đạt đặc trưng của Phao-lô và không thu hẹp ἐν thành nghĩa công cụ “bởi Chúa”.
theological_decisions:
- issue: Cách dịch Χριστοῦ
  choice: Đấng Mê-si
  alternative: Đấng Christ
  rationale: Trong câu này Χριστός được hiểu như tước hiệu của Đấng được xức dầu; “Đấng Mê-si” làm rõ sắc thái tước hiệu mà không áp đặt thêm cách giải nghĩa.
- issue: Quan hệ trong cụm εὐαγγέλιον τοῦ Χριστοῦ
  choice: Tin Lành của Đấng Mê-si
  alternative: Tin Lành về Đấng Mê-si
  rationale: Sở hữu cách Hy Lạp có thể chỉ Tin Lành thuộc về, đến từ, hoặc nói về Đấng Mê-si. Dùng “của” bảo tồn độ mở ấy thay vì chỉ chọn nghĩa nội dung “về”.
- issue: Tác nhân mở cánh cửa
  choice: đã được mở ra cho tôi trong Chúa
  alternative: Chúa đã mở cho tôi một cánh cửa
  rationale: Nguyên văn dùng thể bị động và cụm ἐν κυρίῳ, không trực tiếp đồng nhất cụm này với tác nhân. Bản dịch giữ sự căng nghĩa thần học và cấu trúc ấy.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Câu được giữ ở dạng chưa kết thúc vì nguyên văn tiếp tục sang câu 13; dấu phẩy cuối phản ánh cấu trúc liên tục của đoạn.
