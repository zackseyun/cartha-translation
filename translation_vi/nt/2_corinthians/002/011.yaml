  text: ἵνα μὴ πλεονεκτηθῶμεν ὑπὸ τοῦ Σατανᾶ, οὐ γὰρ αὐτοῦ τὰ νοήματα ἀγνοοῦμεν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/011.yaml
  text: so that we would not be outwitted by Satan[b][a], for we are not ignorant of his schemes.
translation:
  language: vi
  text: để chúng ta không bị Sa-tan lợi dụng[a], vì chúng ta không phải là không biết các mưu đồ của Sa-tan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “bị Sa-tan qua mặt,” “bị Sa-tan khai thác” hoặc “bị Sa-tan chiếm lợi thế trên chúng ta.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “ý đồ,” “ý định” hoặc “những toan tính.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα μὴ
  choice: để ... không
  rationale: Diễn đạt tự nhiên mục đích nhằm ngăn một kết quả xảy ra, đồng thời giữ hướng nghĩa của mệnh đề Hy Lạp.
- source_word: πλεονεκτηθῶμεν
  choice: lợi dụng chúng ta
  rationale: Động từ ở thể bị động mang nghĩa bị chiếm lợi thế, bị khai thác hoặc bị lấn át. Cách dịch này rõ ràng và không thu hẹp nghĩa chỉ còn sự đánh lừa về trí óc.
- source_word: Σατανᾶ
  choice: Sa-tan
  rationale: Phiên âm tên riêng theo cách quen thuộc trong tiếng Việt.
- source_word: γὰρ
  choice: vì
  rationale: Giới thiệu lý do giải thích cho mệnh đề trước.
- source_word: νοήματα
  choice: mưu đồ
  rationale: Trong ngữ cảnh này, từ chỉ những ý định hoặc tính toán mang tính đối địch, chứ không đơn thuần là các ý nghĩ trung tính.
- source_word: οὐ ... ἀγνοοῦμεν
  choice: không phải là không biết
  rationale: Giữ nguyên lối phủ định kép và sắc thái nhấn mạnh của nguyên văn thay vì chuyển thẳng thành “biết rõ”.
- source_word: αὐτοῦ
  choice: của hắn
  rationale: Đại từ chỉ Sa-tan; “hắn” vừa rõ đối tượng vừa phù hợp sắc thái đối địch của văn cảnh.
theological_decisions:
- issue: Mức độ nhận biết các mưu đồ của Sa-tan
  choice: không phải là không biết
  alternative: biết rõ
  rationale: Nguyên văn dùng lối phủ định của động từ “không biết.” Giữ cấu trúc này tránh khẳng định một mức độ hiểu biết toàn diện mà câu Hy Lạp không nói rõ.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. “Không phải là không biết” chủ ý giữ lối nói giảm bằng phủ định kép của nguyên văn; “mưu đồ” thể hiện sắc thái chiến lược, đối địch trong ngữ cảnh.
