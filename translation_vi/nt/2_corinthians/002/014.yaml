id: 2CO.2.14
reference: 2 Corinthians 2:14
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Τῷ δὲ θεῷ χάρις τῷ πάντοτε θριαμβεύοντι ἡμᾶς ἐν τῷ Χριστῷ καὶ τὴν ὀσμὴν τῆς γνώσεως αὐτοῦ φανεροῦντι δι’ ἡμῶν ἐν παντὶ τόπῳ·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/014.yaml
  text: But thanks be to God[b][a], who always leads us in triumphal procession in the Messiah and makes the fragrance of the knowledge of him known through us in every place.
translation:
  language: vi
  text: Nhưng tạ ơn Đức Chúa Trời, Đấng luôn dẫn chúng tôi trong cuộc rước khải hoàn trong Đấng Mê-si-a[a], và qua chúng tôi làm cho hương thơm[b] của sự nhận biết Ngài được tỏ ra tại mọi nơi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Đấng luôn chiến thắng chúng tôi trong Đấng Mê-si-a.”'
    reason: alternative_reading
  - marker: b
    text: 'Hoặc: “mùi hương.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρις
  choice: tạ ơn
  rationale: Trong thành ngữ Τῷ δὲ θεῷ χάρις, “tạ ơn Đức Chúa Trời” diễn đạt tự nhiên lời cảm tạ mang sắc thái tôn vinh.
- source_word: θριαμβεύοντι
  choice: dẫn chúng tôi trong đoàn khải hoàn
  rationale: Giữ hình ảnh cụ thể của cuộc rước khải hoàn và vẫn xem ἡμᾶς là tân ngữ; nghĩa “chiến thắng chúng tôi” được giữ trong chú thích.
- source_word: ἐν τῷ Χριστῷ
  choice: trong Đấng Christ
  rationale: “Đấng Christ” là cách gọi trang trọng, quen thuộc trong tiếng Việt và giữ Χριστός như tước hiệu; giới từ “trong” bảo tồn ý về phạm vi hoặc sự liên hiệp mà không giải nghĩa quá mức.
- source_word: ὀσμὴν
  choice: hương thơm
  rationale: Phù hợp với sắc thái tích cực của ẩn dụ trong ngữ cảnh và tự nhiên hơn “mùi” trong tiếng Việt trang trọng.
- source_word: γνώσεως αὐτοῦ
  choice: sự nhận biết Ngài
  rationale: “Sự nhận biết” diễn đạt γνώσεως tự nhiên trong ngữ cảnh nói về việc biết Đức Chúa Trời; đại từ “Ngài” giữ tham chiếu của αὐτοῦ mà không thêm lời giải thích.
- source_word: φανεροῦντι
  choice: làm lan tỏa
  rationale: Kết hợp tự nhiên với ẩn dụ “hương thơm” và truyền đạt việc khiến hương ấy trở nên rõ ràng, dễ nhận biết; chú thích ghi cách dịch sát hơn.
- source_word: δι’ ἡμῶν
  choice: qua chúng tôi
  rationale: διά với sở hữu cách chỉ phương tiện hoặc tác nhân; “qua chúng tôi” là cách diễn đạt tự nhiên.
- source_word: ἐν παντὶ τόπῳ
  choice: khắp mọi nơi
  rationale: Cách nói hiện đại, tự nhiên, truyền đạt đầy đủ phạm vi phổ quát của cụm Hy Lạp.
theological_decisions:
- issue: Nghĩa của θριαμβεύω khi ἡμᾶς làm tân ngữ
  choice: Đức Chúa Trời dẫn đoàn sứ đồ trong đoàn khải hoàn trong Đấng Christ.
  alternative: Đức Chúa Trời chiến thắng chúng tôi trong Đấng Christ.
  rationale: Bản chính giữ hình ảnh đoàn rước khải hoàn và mạch nối với ẩn dụ hương thơm; chú thích bảo tồn khả năng các sứ đồ được hình dung như những người đã bị Đức Chúa Trời chinh phục, thay vì âm thầm loại bỏ sự căng thẳng.
- issue: Đối tượng của αὐτοῦ trong “sự nhận biết Ngài”
  choice: Giữ đại từ “Ngài” như nguyên văn, theo mạch gần nhất hướng về Đức Chúa Trời.
  alternative: Diễn giải rõ là “sự nhận biết Đức Chúa Trời” hoặc hiểu là sự nhận biết Đấng Christ.
  rationale: Nguyên văn dùng đại từ; giữ đại từ tránh giải quyết dứt khoát một tham chiếu có thể được người đọc liên hệ với Đức Chúa Trời trong Đấng Christ.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. “Đoàn khải hoàn” giữ hình ảnh lịch sử cụ thể; “làm lan tỏa” tạo câu tự nhiên với “hương thơm”, còn cách dịch sát được ghi ở chú thích. Mọi dấu chú thích đều xuất hiện trong chính văn.
