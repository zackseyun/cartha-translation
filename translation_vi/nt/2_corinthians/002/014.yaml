    rationale: Cụm này diễn giải theo đặc tính của hương thơm và có thể hàm ý “phát tán,” trong khi φανερόω chủ yếu là làm hiển lộ, tỏ ra, hay làm cho được biết đến. Cần giữ động từ tỏ lộ trong chính văn.
  - severity: low
    issue: “Đấng Christ” không phản ánh nhất quán quyết định dịch Χριστός là tước hiệu “Messiah”
    rationale: Trong ngữ cảnh này, dữ liệu dự án xác định Χριστός là tước hiệu. “Đấng Mê-si-a” chuyển tải tước hiệu ấy rõ hơn mà vẫn tự nhiên trong tiếng Việt trang trọng.
  - severity: low
    issue: Chú thích b hiện chỉ ghi lại cách dịch sát của một diễn đạt đã được diễn giải
    rationale: Khi chính văn được sửa sát nghĩa φανεροῦντι, chú thích này nên chuyển thành lựa chọn từ vựng thực sự cho ὀσμή, tương ứng với hồ sơ kiểm tra tiếng Anh.
