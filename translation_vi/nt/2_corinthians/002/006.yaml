  text: Đối với người như thế, hình phạt do đa số áp dụng là đủ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Biện pháp kỷ luật do phần đông trong số họ áp dụng là đủ cho người như thế.”'
    reason: Nêu các cách diễn đạt thay thế cho ἐπιτιμία và τῶν πλειόνων mà vẫn giữ ý một biện pháp chế tài do phần đông áp dụng.
lexical_decisions:
- source_word: ἱκανὸν
  choice: là đủ rồi
  rationale: Diễn đạt tự nhiên chức năng vị ngữ của từ Hy Lạp và cho thấy biện pháp kỷ luật đã đạt mức cần thiết; “rồi” phù hợp với hành động đã được áp dụng trong ngữ cảnh.
- source_word: τῷ τοιούτῳ
  choice: cho người ấy như vậy
  rationale: Giữ ý chỉ một người cụ thể có hành vi đã được biết trong ngữ cảnh, đồng thời tránh thêm từ chỉ giới tính không cần thiết vì tiếng Việt tự nhiên không đòi hỏi điều đó.
- source_word: ἐπιτιμία
  choice: hình phạt
  rationale: Chỉ một biện pháp chế tài mang tính sửa trị do cộng đồng áp dụng; “hình phạt” rõ hơn “lời quở trách”, vốn có thể bị hiểu chỉ là lời nói.
- source_word: ἡ ὑπὸ τῶν πλειόνων
  choice: do đa số áp dụng
  rationale: “Đa số” phản ánh nghĩa phần đông hơn của οἱ πλείονες; thêm “áp dụng” giúp câu tiếng Việt tự nhiên và làm rõ quan hệ tác nhân trong cấu trúc bị động của tiếng Hy Lạp.
