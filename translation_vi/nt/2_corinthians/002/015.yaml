  source_fidelity: 'Bản dịch phản ánh đúng cấu trúc và ý nghĩa câu Hy Lạp: ὅτι mang lực giải thích qua “Vì”; Χριστοῦ εὐωδία được giữ mở nghĩa bằng “hương thơm của Đấng Mê-si”; τῷ θεῷ được diễn đạt tự nhiên là “đối với Đức Chúa Trời”; và cả hai phân từ hiện tại σῳζομένοις/ἀπολλυμένοις đều được thể hiện với sắc thái tiến trình. Việc lặp lại “giữa” cũng tương ứng với hai cụm ἐν song song trong nguyên văn.'
