id: 2CO.2.15
reference: 2 Corinthians 2:15
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὅτι Χριστοῦ εὐωδία ἐσμὲν τῷ θεῷ ἐν τοῖς σῳζομένοις καὶ ἐν τοῖς ἀπολλυμένοις,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/015.yaml
  text: For we are the aroma of Messiah to God among those who are being saved and among those who are perishing[b][a],
translation:
  language: vi
  text: Vì đối với Đức Chúa Trời, chúng tôi là hương thơm của Đấng Mê-si giữa những người đang được cứu và giữa những người đang hư mất.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι
  choice: Vì
  rationale: Liên từ này giải thích cho ý trước đó và giữ sắc thái nguyên nhân/giải thích tự nhiên trong tiếng Việt.
- source_word: Χριστοῦ
  choice: của Đấng Mê-si
  rationale: Giữ ý nghĩa tước hiệu của Χριστός trong kết cấu sở hữu; cách diễn đạt không quyết định quá mức hương thơm phát xuất từ hay thuộc về Đấng Mê-si.
- source_word: εὐωδία
  choice: hương thơm
  rationale: Diễn đạt tự nhiên hình ảnh khứu giác mà không thêm tính từ 'ngọt ngào', vốn không xuất hiện minh nhiên trong câu Hy Lạp.
- source_word: τῷ θεῷ
  choice: đối với Đức Chúa Trời
  rationale: Thể hiện quan hệ của hương thơm với Đức Chúa Trời; tự nhiên hơn cách nói sát chữ 'cho Đức Chúa Trời' trong tiếng Việt.
- source_word: ἐν τοῖς σῳζομένοις
  choice: giữa những người đang được cứu
  rationale: Giữ thể bị động và sắc thái đang diễn tiến của phân từ hiện tại, đồng thời dùng 'giữa' cho nghĩa quan hệ trong nhóm người.
- source_word: ἐν τοῖς ἀπολλυμένοις
  choice: giữa những người đang hư mất
  rationale: Giữ sắc thái đang diễn tiến của phân từ hiện tại; 'hư mất' phù hợp văn cảnh và không xác định quá mức phương thức bị diệt.
theological_decisions:
- issue: Sắc thái tiến trình trong σῳζομένοις và ἀπολλυμένοις
  choice: Dịch song song là “những người đang được cứu” và “những người đang hư mất”.
  alternative: “những người được cứu” và “những người bị mất”; hoặc “người được cứu” và “kẻ hư mất”.
  rationale: Hai phân từ hiện tại trình bày sự cứu và sự hư mất với sắc thái đang diễn tiến. Bản dịch giữ nguyên sức căng này thay vì biến chúng thành các nhãn chỉ trạng thái đã hoàn tất.
- issue: Quan hệ sở hữu trong Χριστοῦ εὐωδία
  choice: “hương thơm của Đấng Mê-si”.
  alternative: “hương thơm về Đấng Mê-si” hoặc “hương thơm từ Đấng Mê-si”.
  rationale: Cách dịch bằng “của” bảo toàn độ rộng nghĩa của sở hữu cách Hy Lạp, không ép câu theo một quan hệ duy nhất.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đưa “đối với Đức Chúa Trời” lên trước giúp câu tiếng Việt trôi chảy và làm rõ rằng hương thơm được nhận định trong quan hệ với Đức Chúa Trời, trong khi vẫn giữ hai cụm “giữa...” song song theo hai lần ἐν của nguyên văn.
