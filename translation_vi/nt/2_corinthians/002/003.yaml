source:
  edition: SBLGNT
  text: καὶ ⸀ἔγραψα τοῦτο αὐτὸ ἵνα μὴ ἐλθὼν λύπην ⸀σχῶ ἀφ’ ὧν ἔδει με χαίρειν, πεποιθὼς ἐπὶ πάντας ὑμᾶς ὅτι ἡ ἐμὴ χαρὰ πάντων ὑμῶν ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/003.yaml
  text: And I wrote this very thing so that, when I came, I might not have grief from those who ought to make me rejoice, because I was confident about all of you that my joy is the joy of you all.
translation:
  language: vi
  text: Tôi đã viết chính điều ấy để khi đến, tôi khỏi phải buồn phiền do những người đáng lẽ phải làm cho tôi vui mừng,[a] với lòng tin chắc nơi tất cả anh chị em rằng niềm vui của tôi là niềm vui của tất cả anh chị em.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát nghĩa hơn: “do những người mà từ họ tôi đáng lẽ phải vui mừng.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔγραψα
  choice: Tôi đã viết
  rationale: Thì bất định chỉ hành động viết trước đó; “đã viết” tự nhiên và rõ trong tiếng Việt.
- source_word: τοῦτο αὐτὸ
  choice: chính điều ấy
  rationale: Giữ sắc thái nhấn mạnh của cụm Hy Lạp và nối tự nhiên với nội dung trước đó.
- source_word: ἵνα μὴ ἐλθὼν λύπην σχῶ
  choice: để khi đến, tôi không phải buồn phiền
  rationale: Diễn đạt mục đích của ἵνα và nỗi đau buồn về tình cảm của λύπη bằng tiếng Việt tự nhiên.
- source_word: ἀφ’ ὧν ἔδει με χαίρειν
  choice: vì những người đáng lẽ phải làm cho tôi vui mừng
  rationale: Truyền đạt ý những người ấy lẽ ra phải là nguồn vui của Phao-lô; chú thích giữ cấu trúc sát chữ vốn có thể hiểu hơi khác.
- source_word: πεποιθὼς ἐπὶ πάντας ὑμᾶς
  choice: bởi tôi tin chắc về tất cả anh chị em
  rationale: “Tin chắc” thể hiện trạng thái xác tín đã vững của phân từ hoàn thành; “bởi” nêu quan hệ hợp lý trong ngữ cảnh nhưng không biến nó thành một khẳng định thần học riêng.
- source_word: ἡ ἐμὴ χαρὰ πάντων ὑμῶν ἐστιν
  choice: niềm vui của tôi cũng là niềm vui của tất cả anh chị em
  rationale: Giữ cấu trúc đồng nhất và ý niềm vui được cùng chia sẻ; “cũng” làm câu tiếng Việt rõ, tự nhiên.
theological_decisions:
- issue: Quan hệ cú pháp của πεποιθὼς với mệnh đề chính
  choice: bởi tôi tin chắc
  alternative: vì tin chắc; trong niềm tin chắc
  rationale: Phân từ có thể mang sắc thái nguyên nhân hoặc hoàn cảnh đi kèm. Bản chính chọn cách đọc nguyên nhân phù hợp ngữ cảnh, nhưng không mở rộng thành một kết luận giáo lý.
- issue: Ý nghĩa của niềm vui chung
  choice: niềm vui của tôi cũng là niềm vui của tất cả anh chị em
  alternative: niềm vui của tôi thuộc về tất cả anh chị em
  rationale: Cách dịch này giữ sự căng mở của câu Hy Lạp giữa niềm vui chung và niềm vui được chia sẻ, không xác định thêm cơ chế hay mức độ đồng cảm.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” cho đại từ số nhiều chỉ cộng đồng tín hữu; giữ ngôi thứ nhất và sắc thái tình cảm trực tiếp của Phao-lô.
