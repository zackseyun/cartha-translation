  - severity: low
    issue: “không phải buồn phiền” có thể hàm ý ‘không cần/phải’ hơn là tránh kinh nghiệm buồn phiền.
    rationale: λύπην σχῶ trong mệnh đề mục đích nói về việc Phao-lô không phải chịu/có nỗi buồn khi ông đến. “khỏi phải buồn phiền” diễn đạt rõ hơn trong tiếng Việt.
  - severity: low
    issue: Từ “cũng” trong mệnh đề cuối là phần bổ sung diễn giải.
    rationale: 'Câu Hy Lạp chỉ nêu đồng nhất tính: ‘niềm vui của tôi là [niềm vui] của tất cả anh chị em.’ Bỏ “cũng” giữ cấu trúc này trực tiếp hơn.'
