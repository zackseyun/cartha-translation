reference: 2 Corinthians 2:5
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Εἰ δέ τις λελύπηκεν, οὐκ ἐμὲ λελύπηκεν, ἀλλὰ ἀπὸ μέρους ἵνα μὴ ἐπιβαρῶ πάντας ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/005.yaml
  text: But if anyone has caused grief[a], he has grieved not me, but in part all of you—to some extent[b], so that I may not overstate it.
translation:
  language: vi
  text: Nhưng nếu có ai đã gây buồn phiền, thì người ấy không làm tôi buồn, nhưng phần nào làm buồn tất cả anh chị em—để tôi không làm nặng lòng tất cả anh chị em.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “... nhưng phần nào làm buồn tất cả anh chị em, để tôi không quá nặng lời với tất cả anh chị em.” Cú pháp của phần cuối câu Hy Lạp cô đọng; động từ có nghĩa đen là “đặt gánh nặng lên.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: λελύπηκεν
  choice: đã gây buồn phiền / đã làm ... buồn
  rationale: Thì hoàn thành chỉ hành động đã xảy ra nhưng còn hệ quả hiện tại; hai cách diễn đạt tự nhiên này giữ được sự lặp lại của cùng một động từ trong tiếng Hy Lạp.
- source_word: οὐκ ἐμὲ
  choice: không chỉ làm tôi buồn
  rationale: Trong mạch câu, οὐκ ... ἀλλά thường diễn tả sự tương phản mang tính tương đối chứ không nhất thiết phủ nhận tuyệt đối rằng Phao-lô đã buồn; thêm “chỉ” làm rõ ý này trong tiếng Việt.
- source_word: ἀπὸ μέρους
  choice: phần nào
  rationale: Cụm từ này hạn định mức độ tác động đến toàn thể cộng đoàn; “phần nào” tự nhiên và vẫn giữ được sắc thái dè dặt của câu gốc.
- source_word: ἵνα μὴ ἐπιβαρῶ
  choice: nói như vậy để tôi không làm vấn đề trở nên quá nặng nề
  rationale: Động từ mang nghĩa đặt thêm gánh nặng; trong ngữ cảnh, Phao-lô dường như đang dè dặt để không nói quá nặng về cả cộng đoàn. Cách dịch này giữ hình ảnh sức nặng mà không buộc cụm πάντας ὑμᾶς phải làm bổ ngữ trực tiếp của động từ.
- source_word: πάντας ὑμᾶς
  choice: tất cả anh chị em
  rationale: Giữ tính bao quát rõ ràng của πάντας và diễn đạt lời xưng hô số nhiều cách tự nhiên, trang trọng trong tiếng Việt.
theological_decisions:
- issue: Phạm vi của lời phủ nhận “không làm tôi buồn”
  choice: không chỉ làm tôi buồn
  alternative: không làm tôi buồn
  rationale: Cách hiểu tương đối phù hợp với phép đối lập οὐκ ... ἀλλά và tránh hàm ý rằng Phao-lô hoàn toàn không đau buồn, trong khi ngữ cảnh thư cho thấy điều ngược lại.
- issue: Mối liên hệ cú pháp giữa ἀπὸ μέρους, πάντας ὑμᾶς và ἵνα μὴ ἐπιβαρῶ
  choice: “phần nào” bổ nghĩa cho việc làm cả cộng đoàn buồn; mệnh đề cuối diễn tả sự dè dặt của Phao-lô
  alternative: “không làm nặng lòng tất cả anh chị em”
  rationale: Cú pháp Hy Lạp cô đọng và có thể được phân tích hơn một cách. Bản chính theo cách hiểu phù hợp nhất với ngữ cảnh, còn chú thích giữ lại khả năng liên kết trực tiếp ἐπιβαρῶ với πάντας ὑμᾶς.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh chị em” cho đại từ số nhiều chỉ cộng đoàn; giữ giọng dè dặt và căng thẳng cú pháp của nguyên bản bằng một chú thích thay vì giải quyết hoàn toàn theo một hướng.
