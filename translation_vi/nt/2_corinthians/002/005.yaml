revisions:
- from: Nhưng nếu có ai đã gây buồn phiền, thì người ấy không chỉ làm tôi buồn, mà phần nào đã làm tất cả anh chị em buồn—nói như vậy để tôi không làm vấn đề trở nên quá nặng nề.[a]
  to: Nhưng nếu có ai đã gây buồn phiền, thì người ấy không làm tôi buồn, nhưng phần nào làm buồn tất cả anh chị em—để tôi không làm nặng lòng tất cả anh chị em.[a]
  rationale: Bản sửa giữ phép đối lập trực tiếp “không ... nhưng,” không thêm “vấn đề,” và phục hồi sự liên hệ của ý “gánh nặng” với “tất cả anh chị em.” “Phần nào” vẫn bảo tồn sự dè dặt của ἀπὸ μέρους. Chú thích nêu cách hiểu tu từ khả dĩ của ἐπιβαρῶ mà không quyết định vượt quá mức nguyên văn.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T19:25:00Z'
review_pass:
  verdict: revise
  source_fidelity: Bản dịch nhận đúng ý chính và giữ được tính dè dặt của ἀπὸ μέρους. Tuy nhiên, “không chỉ làm tôi buồn” làm suy giảm phép đối lập trực tiếp οὐκ ἐμέ ... ἀλλά (“không phải tôi ... nhưng ...”); còn “làm vấn đề trở nên quá nặng nề” thêm “vấn đề,” vốn không có trong nguyên văn, và chuyển gánh nặng khỏi nhóm người được nói đến. ἐπιβαρῶ vẫn nên được diễn đạt bằng hình ảnh/ý niệm đặt gánh nặng lên “tất cả anh chị em.”
  naturalness: “Nhưng nếu có ai đã gây buồn phiền” và “phần nào” là tiếng Việt chuẩn, tự nhiên. Cấu trúc có thể được làm rõ bằng dấu phẩy và gạch ngang mà vẫn bảo lưu sự cô đọng, hơi khó của câu Hy Lạp.
  terminology: “Buồn phiền / làm ... buồn” phản ánh tốt sự lặp lại của λελυπηκεν. “Anh chị em” phù hợp với cách xưng hô cộng đoàn hiện đại. “Làm nặng lòng” là cách nói Việt tự nhiên cho cách hiểu ἐπιβαρῶ theo nghĩa đặt gánh nặng lên người nghe; chú thích cần ghi nhận khả năng hiểu theo nghĩa “nặng lời/nói quá nặng.”
  issues:
  - severity: medium
    issue: “không chỉ làm tôi buồn” thay đổi mức độ của lời phủ định.
    rationale: Nguyên văn nói οὐκ ἐμέ ... ἀλλά, trực tiếp phủ định đối tượng thứ nhất rồi đối lập với đối tượng thứ hai. Dù đây có thể là lối nói giảm, thêm “chỉ” vào bản văn chính đã giải thích trước một sắc thái không được phát biểu trực tiếp.
  - severity: medium
    issue: “làm vấn đề trở nên quá nặng nề” thêm một đối tượng không có trong nguồn.
    rationale: ἐπιβαρῶ mang ý đặt gánh nặng và πάντας ὑμᾶς là đối tượng được nêu rõ. “Vấn đề” làm lệch trọng tâm khỏi tác động đối với toàn thể cộng đoàn.
  - severity: low
    issue: Chú thích có cụm “ít nhất là phần nào,” không phản ánh chính xác sắc thái hạn định của ἀπὸ μέρους.
    rationale: “Ít nhất” đưa vào một ý nhấn mức tối thiểu không có trong thành ngữ Hy Lạp.
  revised_text: Nhưng nếu có ai đã gây buồn phiền, thì người ấy không làm tôi buồn, nhưng phần nào làm buồn tất cả anh chị em—để tôi không làm nặng lòng tất cả anh chị em.[a]
