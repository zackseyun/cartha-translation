id: 2CO.2.17
reference: 2 Corinthians 2:17
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οὐ γάρ ἐσμεν ὡς οἱ ⸀πολλοὶ καπηλεύοντες τὸν λόγον τοῦ θεοῦ, ἀλλ’ ὡς ἐξ εἰλικρινείας, ἀλλ’ ὡς ἐκ θεοῦ ⸀κατέναντι θεοῦ ἐν Χριστῷ λαλοῦμεν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/017.yaml
  text: For we are not like the many[a], peddling the word of God, but as from sincerity, but as from God[f][e][d][c][b], before God we speak in Messiah.
translation:
  language: vi
  text: Vì chúng tôi không như nhiều người[a] đem lời Đức Chúa Trời ra buôn bán[b], nhưng chúng tôi nói bởi lòng chân thành[c], như từ Đức Chúa Trời, trước mặt Đức Chúa Trời, trong Đấng Mê-si-a.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đa số người ta” hoặc “rất nhiều người khác”.'
    reason: lexical_alternative
  - marker: b
    text: Từ này có thể bao hàm ý đem bán để trục lợi, và cũng có thể gợi ý pha tạp hoặc làm giảm phẩm chất món hàng.
    reason: lexical_alternative
  - marker: c
    text: 'Sát nghĩa: “từ sự chân thành”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ πολλοί
  choice: nhiều người kia
  rationale: Cách dịch này giữ sắc thái chỉ một nhóm đông người mà Phao-lô đang đối chiếu với mình, nhưng không biến cụm từ thành một khẳng định thống kê như “đa số”.
- source_word: καπηλεύοντες
  choice: đem ... ra buôn bán
  rationale: Diễn đạt hình ảnh thương mại của động từ, đồng thời gợi ý việc trục lợi từ sứ điệp mà không buộc nghĩa chính thành “pha loãng” hay “làm sai lạc”.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: lời Đức Chúa Trời
  rationale: Cách diễn đạt trực tiếp, trang trọng và quen thuộc, giữ nguyên quan hệ sở hữu của nguyên văn.
- source_word: ἐξ εἰλικρινείας
  choice: với lòng chân thành
  rationale: Tiếng Việt tự nhiên hơn cách dịch máy móc “từ sự chân thành”, trong khi vẫn diễn đạt sự chân thành là động cơ và nguồn phát sinh lời nói.
- source_word: ἐκ θεοῦ
  choice: như những người đến từ Đức Chúa Trời
  rationale: Bổ sung thành phần hàm ẩn để câu tiếng Việt sáng nghĩa, đồng thời giữ lực của ὡς và ý niệm nguồn gốc nơi Đức Chúa Trời, không diễn giải quá mức thành “được sai phái”.
- source_word: κατέναντι θεοῦ
  choice: trước mặt Đức Chúa Trời
  rationale: Diễn đạt tự nhiên ý nói trong sự hiện diện và dưới sự chứng giám của Đức Chúa Trời.
- source_word: ἐν Χριστῷ
  choice: trong Đấng Mê-si
  rationale: Giữ ý nghĩa tước hiệu của Χριστός và công thức chỉ phạm vi hiệp nhất, hoạt động trong Đấng được xức dầu.
- source_word: λαλοῦμεν
  choice: chúng tôi nói
  rationale: Phản ánh trực tiếp động từ hiện tại, không tăng nghĩa thành “rao giảng”.
theological_decisions:
- issue: Ý nghĩa của ἐν Χριστῷ
  choice: trong Đấng Mê-si
  alternative: trong Đấng Christ
  rationale: Χριστός ở đây vẫn mang ý nghĩa tước hiệu; “Đấng Mê-si” truyền đạt nội dung ấy thay vì chỉ phiên âm, đồng thời không giải thích thêm bản chất của mối liên hệ được diễn tả bằng ἐν.
- issue: Quan hệ giữa ἐξ εἰλικρινείας và ἐκ θεοῦ
  choice: giữ cả lòng chân thành và nguồn gốc nơi Đức Chúa Trời như hai nét song song
  alternative: gộp thành “do Đức Chúa Trời ban lòng chân thành”
  rationale: Nguyên văn đặt hai cụm song song và không đồng nhất chúng; bản dịch không nên giải quyết căng thẳng bằng cách biến cụm thứ nhất thành kết quả của cụm thứ hai.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc câu giữ sự đối lập mạnh giữa những kẻ buôn bán lời Đức Chúa Trời và chức vụ chân thành có nguồn từ Đức Chúa Trời; dấu chấm phẩy giúp câu dài rõ nhịp hơn.
