  source_fidelity: 'Bản thảo truyền đạt đúng mạch ý chính: đảo chiều từ kỷ luật sang tha thứ và an ủi, nhằm ngăn người ấy bị sầu buồn áp đảo. Tuy nhiên, “nỗi buồn quá lớn” làm mờ sắc thái so sánh/tăng cường của περισσοτέρᾳ; “nỗi buồn quá mức” phản ánh sát hơn ý buồn rầu quá nhiều/quá độ. Cụm “trái lại ... nên” có thể chấp nhận để chuyển τοὐναντίον μᾶλλον trong tiếng Việt tự nhiên.'
