  text: ὥστε τοὐναντίον ⸀μᾶλλον ὑμᾶς χαρίσασθαι καὶ παρακαλέσαι, μή πως τῇ περισσοτέρᾳ λύπῃ καταποθῇ ὁ τοιοῦτος.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/007.yaml
  text: so that[a], on the contrary, you should rather forgive and comfort him[b], so that such a person may not be overwhelmed by excessive sorrow.
translation:
  language: vi
  text: Vì vậy, trái lại, anh chị em nên tha thứ[a] và an ủi người ấy, kẻo người ấy bị nỗi buồn quá mức nuốt chửng[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “tha thứ cách ân hậu”; động từ này có liên hệ với việc ban ân huệ hoặc bày tỏ lòng ưu ái.'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “bị nuốt chửng”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοὐναντίον
  choice: trái lại
  rationale: Diễn tả rõ sự đảo ngược cách hành xử, tự nhiên và trang trọng trong tiếng Việt hiện đại.
- source_word: μᾶλλον
  choice: nên
  rationale: Kết hợp tự nhiên với ý tương phản của τοὐναντίον trong cấu trúc khuyên nhủ; không cường điệu thành 'càng hơn nữa'.
- source_word: χαρίσασθαι
  choice: tha thứ
  rationale: Trong bối cảnh sửa phạt và phục hồi, nghĩa phù hợp nhất là tha thứ; sắc thái ban ơn được ghi ở chú thích.
- source_word: παρακαλέσαι
  choice: an ủi
  rationale: Phù hợp với hoàn cảnh người ấy đang chịu buồn rầu, đồng thời giữ được ý nâng đỡ của động từ.
- source_word: καταποθῇ
  choice: bị ... nuốt chửng
  rationale: Giữ nguyên hình ảnh mạnh của nguyên văn Hy Lạp mà vẫn dễ hiểu trong tiếng Việt.
- source_word: ὁ τοιοῦτος
  choice: người như thế
  rationale: Giữ cách quy chiếu không nêu danh tính hay xác định thêm giới tính ngoài điều nguyên văn biểu đạt.
- source_word: τῇ περισσοτέρᾳ λύπῃ
  choice: nỗi buồn quá lớn
  rationale: Diễn đạt tự nhiên mức độ vượt quá sức chịu đựng hàm chứa trong văn cảnh, không biến nó thành một thuật ngữ kỹ thuật.
theological_decisions: []
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh chị em” để chuyển đại từ số nhiều ὑμᾶς theo lối xưng hô cộng đồng tự nhiên; giữ hình ảnh “nuốt chửng” của nguyên văn. Chú thích [b] nhấn mạnh tính trực dịch dù hình ảnh đã được giữ trong chính văn.
