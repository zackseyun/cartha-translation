  to: Lòng tôi[a] không được yên vì tôi không tìm được Tít, người anh em của tôi[b]. Nhưng sau khi từ biệt họ[c], tôi đi sang Ma-xê-đô-ni-a.
  rationale: Thay “Tâm linh tôi” bằng “Lòng tôi” để dùng cách nói Việt ngữ tự nhiên hơn cho sự bất an nội tâm mà không áp đặt nghĩa thần học đặc biệt lên πνεῦμα. Thay “không gặp” bằng “không tìm được” để phản ánh rõ hơn εὑρεῖν. Các yếu tố còn lại giữ nguyên ý nghĩa, trình tự hành động và mức độ xác định của nguyên bản.
