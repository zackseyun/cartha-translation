  source_fidelity: 'Bản dịch diễn đạt đúng mạch chính của câu: sự bất an của Phao-lô vì không tìm gặp Tít, rồi từ biệt những người tại đó để đi Ma-xê-đô-ni-a. Tuy nhiên, “tâm linh tôi” không phải cách dùng tự nhiên nhất cho τῷ πνεύματί μου trong ngữ cảnh này và dễ gợi một thuật ngữ chuyên biệt hơn điều văn bản đòi hỏi. “Lòng tôi” diễn đạt đúng sự bất an nội tâm; chú thích giữ một cách diễn đạt gần hơn với từ πνεῦμα.'
  naturalness: “Lòng tôi không được yên” là tiếng Việt hiện đại, tự nhiên và phù hợp văn phong Kinh Thánh trang trọng vừa phải. “Không tìm được Tít” phản ánh trực tiếp hơn εὑρεῖν mà vẫn tự nhiên trong ngữ cảnh Phao-lô mong gặp một người. Cấu trúc còn lại rõ ràng và mạch lạc.
  terminology: Giữ “người anh em của tôi” để bảo toàn ẩn dụ thân tộc trong nguyên ngữ. “Tít” và “Ma-xê-đô-ni-a” phù hợp lối phiên âm Kinh Thánh tiếng Việt. Chú thích về “người anh em” được diễn đạt thận trọng, không khẳng định quan hệ huyết thống.
