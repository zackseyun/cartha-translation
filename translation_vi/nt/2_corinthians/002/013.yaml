id: 2CO.2.13
reference: 2 Corinthians 2:13
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οὐκ ἔσχηκα ἄνεσιν τῷ πνεύματί μου τῷ μὴ εὑρεῖν με Τίτον τὸν ἀδελφόν μου, ἀλλὰ ἀποταξάμενος αὐτοῖς ἐξῆλθον εἰς Μακεδονίαν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/013.yaml
  text: I had no rest in my spirit because I did not find Titus my brother[a], but after taking leave of them[c][b], I went on to Macedonia.
translation:
  language: vi
  text: Lòng tôi[a] không được yên vì tôi không tìm được Tít, người anh em của tôi[b]. Nhưng sau khi từ biệt họ[c], tôi đi sang Ma-xê-đô-ni-a.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “Tâm trí tôi không được yên.”'
    reason: lexical_alternative
  - marker: b
    text: “Người anh em” ở đây chỉ Tít trong tư cách là người cùng đức tin và cộng sự của Phao-lô, không nhất thiết là anh em ruột.
    reason: cultural_note
  - marker: c
    text: 'Hay: “sau khi chào từ giã họ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἔσχηκα ἄνεσιν
  choice: không được yên
  rationale: Diễn đạt tự nhiên trạng thái bất an của Phao-lô trong mạch kể quá khứ. Cụm này giữ ý ‘không có sự nghỉ ngơi/nhẹ nhõm’ mà không thu hẹp thành một cảm xúc cụ thể hơn.
- source_word: τῷ πνεύματί μου
  choice: tâm linh tôi
  rationale: πνεῦμα ở đây chỉ phương diện nội tâm sâu xa của Phao-lô. Cách sắp xếp ‘Tâm linh tôi không được yên’ chuyển tải tự nhiên quan hệ của cách dữ cách trong tiếng Việt, đồng thời chú thích giữ lại khả năng hiểu theo nghĩa ‘cho tâm linh tôi’.
- source_word: τῷ μὴ εὑρεῖν με Τίτον
  choice: vì tôi không gặp Tít
  rationale: Cấu trúc động từ nguyên mẫu có mạo từ với μή nêu nguyên nhân khiến Phao-lô không được yên. ‘Không gặp’ tự nhiên hơn ‘không tìm thấy’ khi nói về việc không gặp được một người tại nơi dự kiến.
- source_word: Τίτον
  choice: Tít
  rationale: Dùng dạng phiên âm tiếng Việt quen thuộc, ngắn gọn của tên riêng Titus.
- source_word: τὸν ἀδελφόν μου
  choice: người anh em của tôi
  rationale: Giữ nguyên ẩn dụ thân tộc của Phao-lô và sự ấm áp trong quan hệ, thay vì diễn giải ngay thành ‘đồng đạo’ hay ‘cộng sự’.
- source_word: ἀποταξάμενος αὐτοῖς
  choice: sau khi từ biệt họ
  rationale: Phân từ aorist chỉ hành động diễn ra trước lúc Phao-lô rời đi. ‘Từ biệt’ trang trọng, tự nhiên và sát nghĩa.
- source_word: ἐξῆλθον εἰς Μακεδονίαν
  choice: tôi đi sang Ma-xê-đô-ni-a
  rationale: ‘Đi sang’ diễn đạt tự nhiên việc rời nơi ấy để đến vùng Ma-xê-đô-ni-a, không ép động từ ἐξέρχομαι thành ‘đi ra’ một cách thiếu tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Ý nghĩa của ‘tâm linh tôi’ (τῷ πνεύματί μου)
  choice: Giữ ‘tâm linh’ như phương diện nội tâm của Phao-lô, không viết hoa.
  alternative: ‘lòng tôi’ hoặc hiểu là một tham chiếu trực tiếp đến Đức Thánh Linh
  rationale: Đại từ sở hữu μου và văn cảnh về sự bất an vì không gặp Tít hướng đến tâm linh của chính Phao-lô. ‘Tâm linh’ giữ thuật ngữ của nguyên bản mà không đồng nhất nó với Đức Thánh Linh hoặc giản lược thành cảm xúc.
- issue: Quan hệ được diễn tả bằng ‘người anh em của tôi’
  choice: Giữ hình ảnh anh em và giải thích trong chú thích rằng Tít là người cùng đức tin và cộng sự.
  alternative: Dịch thẳng là ‘người đồng đạo và cộng sự của tôi’
  rationale: Nguyên bản dùng ngôn ngữ thân tộc, có giá trị thần học và quan hệ; phần chú thích giúp độc giả hiện đại không hiểu đây nhất thiết là anh em ruột.
translation_notes:
  register: Bản dịch dùng tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Cấu trúc câu bám sát diễn tiến của nguyên bản nhưng điều chỉnh trật tự từ cho tự nhiên. Các địa danh và tên riêng được phiên âm theo lối quen thuộc trong Kinh Thánh tiếng Việt.
