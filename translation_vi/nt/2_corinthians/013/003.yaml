source:
  edition: SBLGNT
  text: ἐπεὶ δοκιμὴν ζητεῖτε τοῦ ἐν ἐμοὶ λαλοῦντος Χριστοῦ· ὃς εἰς ὑμᾶς οὐκ ἀσθενεῖ ἀλλὰ δυνατεῖ ἐν ὑμῖν,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/003.yaml
  text: since you are seeking proof that Messiah is speaking in me—he is not weak toward you[a], but is powerful in you[b],
translation:
  language: vi
  text: vì anh chị em đang tìm bằng chứng rằng Đấng Mê-si phán trong tôi[a]—Ngài không yếu đuối đối với anh chị em, nhưng có quyền năng trong anh chị em.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Đấng Mê-si phán qua tôi.” Bản Hy Lạp sát nghĩa hơn là “Đấng Mê-si phán trong tôi.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “có quyền năng giữa anh chị em.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεὶ
  choice: vì
  rationale: Giữ rõ quan hệ nguyên nhân với lời cảnh báo trong văn cảnh, đồng thời tự nhiên trong tiếng Việt.
- source_word: δοκιμὴν ζητεῖτε
  choice: anh chị em đang tìm bằng chứng
  rationale: δοκιμή ở đây chỉ bằng chứng xác nhận, còn hiện tại ζητεῖτε diễn tả yêu cầu đang tiếp diễn.
- source_word: τοῦ ἐν ἐμοὶ λαλοῦντος Χριστοῦ
  choice: rằng Đấng Christ phán trong tôi
  rationale: Diễn đạt cấu trúc sở hữu bằng mệnh đề nội dung tự nhiên; giữ ἐν ἐμοί là “trong tôi” thay vì giải nghĩa thành “qua tôi”.
- source_word: εἰς ὑμᾶς οὐκ ἀσθενεῖ
  choice: Ngài không yếu đuối đối với anh chị em
  rationale: Giữ sắc thái hướng đến/đối với của εἰς và sự tương phản trực tiếp giữa yếu đuối với quyền năng.
- source_word: ἀλλὰ δυνατεῖ ἐν ὑμῖν
  choice: nhưng đầy quyền năng giữa anh chị em
  rationale: δυνατεῖ diễn tả việc có hoặc thể hiện quyền năng; “giữa anh chị em” phù hợp với đối tượng số nhiều và bối cảnh cộng đồng, trong khi chú thích giữ cách hiểu “trong anh chị em”.
theological_decisions:
- issue: Cách dịch Χριστοῦ
  choice: Đấng Christ
  alternative: Đấng Mê-si
  rationale: “Đấng Christ” là danh xưng trang trọng, quen thuộc trong văn phong Tân Ước tiếng Việt và vẫn biểu đạt tước hiệu, không thu hẹp thành tên riêng thuần túy.
- issue: Sắc thái của ἐν ἐμοί và ἐν ὑμῖν
  choice: “phán trong tôi” và “đầy quyền năng giữa anh chị em”
  alternative: “phán qua tôi” và/hoặc “đầy quyền năng trong anh chị em”
  rationale: Giữ nguyên nét nghĩa không gian của cụm thứ nhất; với cụm thứ hai, bản văn chính nêu sắc thái cộng đồng nhưng chú thích bảo lưu khả năng chỉ hoạt động nội tại, tránh giải quyết dứt khoát sự căng thẳng thần học.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” cho đại từ số nhiều chỉ cộng đồng tín hữu; dấu gạch ngang giữ nhịp đối lập mạnh của câu Hy Lạp.
