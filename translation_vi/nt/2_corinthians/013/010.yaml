  to: Vì thế, khi vắng mặt, tôi viết những điều này để khi có mặt, tôi không phải dùng đến sự nghiêm khắc,[a] theo thẩm quyền mà Chúa đã ban cho tôi—để xây dựng chứ không để phá đổ.[b]
