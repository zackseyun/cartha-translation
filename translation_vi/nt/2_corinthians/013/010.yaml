id: 2CO.13.10
reference: 2 Corinthians 13:10
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: διὰ τοῦτο ταῦτα ἀπὼν γράφω, ἵνα παρὼν μὴ ἀποτόμως χρήσωμαι κατὰ τὴν ἐξουσίαν ἣν ⸂ὁ κύριος ἔδωκέν μοι⸃, εἰς οἰκοδομὴν καὶ οὐκ εἰς καθαίρεσιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/010.yaml
  text: For this reason I write these things while absent[a], so that when present I may not have to act harshly[b], according to the authority that the Lord gave me for building up and not for tearing down.
translation:
  language: vi
  text: Vì thế, khi vắng mặt, tôi viết những điều này để khi có mặt, tôi không phải dùng đến sự nghiêm khắc,[a] theo thẩm quyền mà Chúa đã ban cho tôi—để xây dựng chứ không để phá đổ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “tôi không phải xử sự nghiêm khắc” hoặc “tôi không phải đối xử gay gắt.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “để gây dựng chứ không để hủy diệt.” Tiếng Hy Lạp dùng hình ảnh xây dựng: “xây dựng” đối lập với “phá đổ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Vì lý do đó
  rationale: Giữ rõ mối liên hệ nguyên nhân-kết quả với phần trước và tự nhiên trong tiếng Việt hiện đại.
- source_word: ταῦτα
  choice: những điều này
  rationale: Giữ số nhiều của đại từ chỉ định và quy chiếu đến nội dung hoặc những lời cảnh báo vừa được viết.
- source_word: ἀπὼν ... παρὼν
  choice: khi đang vắng mặt ... khi có mặt
  rationale: Thể hiện sự tương phản cân xứng giữa hai phân từ và diễn đạt giá trị thời gian tự nhiên trong tiếng Việt.
- source_word: μὴ ἀποτόμως χρήσωμαι
  choice: tôi không phải xử sự nghiêm khắc
  rationale: χράομαι diễn tả cách hành xử hoặc sử dụng, còn ἀποτόμως mang sắc thái nghiêm khắc, gay gắt. Cụm này truyền đạt mục đích tránh phải áp dụng sự nghiêm khắc khi Phao-lô đến.
- source_word: κατὰ τὴν ἐξουσίαν
  choice: theo thẩm quyền
  rationale: κατά chỉ sự phù hợp hoặc căn cứ theo thẩm quyền đã được trao; cách nói này ngắn gọn và tự nhiên.
- source_word: ὁ κύριος ἔδωκέν μοι
  choice: Chúa đã ban cho tôi
  rationale: Giữ nguyên tước hiệu κύριος mà không xác định thêm đối tượng; thì hoàn thành tiếng Việt diễn đạt tự nhiên việc thẩm quyền đã được trao và hiện vẫn có hiệu lực.
- source_word: εἰς οἰκοδομὴν καὶ οὐκ εἰς καθαίρεσιν
  choice: nhằm xây dựng chứ không nhằm phá đổ
  rationale: Giữ hình ảnh kiến thiết đối lập với tháo phá trong nguyên văn, đồng thời dễ hiểu với độc giả hiện đại.
theological_decisions:
- issue: Đối tượng được gọi là ὁ κύριος trong lời nói về thẩm quyền được ban
  choice: Chúa
  alternative: Chúa Jesus cụ thể; hoặc Chúa theo nghĩa thần linh rộng hơn
  rationale: Nguyên văn chỉ dùng tước hiệu ὁ κύριος. Bản dịch không thêm sự xác định thần học mà câu này không nói rõ.
- issue: Mục đích của thẩm quyền sứ đồ
  choice: nhằm xây dựng chứ không nhằm phá đổ
  alternative: để gây dựng chứ không để hủy diệt
  rationale: Giữ nguyên sức căng giữa quyền hành có thể được thi hành nghiêm khắc và mục đích tích cực của quyền ấy, đồng thời bảo tồn ẩn dụ xây dựng.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, câu chữ trực tiếp và dễ hiểu. Dùng “xử sự nghiêm khắc” thay cho cách nói Hán-Việt nặng như “thi hành nghiêm khắc”; giữ nguyên ẩn dụ “xây dựng/phá đổ”. Tất cả dấu chú thích đều xuất hiện trong chính văn.
