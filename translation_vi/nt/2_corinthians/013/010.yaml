  - severity: low
    issue: “Vì lý do đó” và “xử sự nghiêm khắc” kém tự nhiên hơn các cách diễn đạt hiện đại tương đương.
    rationale: “Vì thế” gọn và tự nhiên; “dùng đến sự nghiêm khắc” diễn tả sát hơn ý ‘sử dụng/áp dụng một cách gay gắt’ của ἀποτόμως χρήσωμαι, mà không thay đổi nghĩa.
