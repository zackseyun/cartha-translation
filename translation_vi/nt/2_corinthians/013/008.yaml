  text: οὐ γὰρ δυνάμεθά τι κατὰ τῆς ἀληθείας, ἀλλὰ ὑπὲρ τῆς ἀληθείας.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/008.yaml
  text: For we are not able to do anything against the truth[a], but for the truth.
translation:
  language: vi
  text: Vì chúng tôi không thể làm gì chống lại chân lý, nhưng có thể làm vì chân lý.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐ γὰρ
  choice: Vì ... không
  rationale: γάρ nêu lý do giải thích cho ý ngay trước đó; “Vì” là từ nối ngắn gọn và tự nhiên. οὐ phủ định mệnh đề.
- source_word: δυνάμεθά
  choice: chúng tôi không thể
  rationale: δύναμαι chỉ khả năng hoặc năng lực. “Không thể” diễn đạt tự nhiên trong tiếng Việt và giữ trọng tâm vào sự bất khả.
- source_word: τι
  choice: làm gì
  rationale: Trong mệnh đề phủ định, τι có nghĩa bao quát là “bất cứ điều gì”; kết cấu “không thể làm gì” là cách nói tiếng Việt tự nhiên.
- source_word: κατὰ τῆς ἀληθείας
  choice: chống lại chân lý
  rationale: κατά với sở hữu cách mang nghĩa đối nghịch, “chống lại”. “Chân lý” giữ sắc thái về một thực tại xác định, rộng hơn sự thành thật đơn thuần.
- source_word: ἀλλὰ
  choice: nhưng
  rationale: ἀλλά đánh dấu sự tương phản mạnh giữa hai vế; “nhưng” giữ cấu trúc đối xứng tự nhiên.
- source_word: ὑπὲρ τῆς ἀληθείας
  choice: hành động vì chân lý
  rationale: ὑπέρ ở đây diễn tả sự ủng hộ hay phục vụ lợi ích của chân lý. Bổ sung động từ “hành động” theo phép tỉnh lược của tiếng Hy Lạp để vế sau rõ nghĩa trong tiếng Việt.
theological_decisions:
- issue: Phạm vi nghĩa của τῆς ἀληθείας (“chân lý”)
  choice: Giữ cách gọi rộng là “chân lý”, không thu hẹp thành một công thức giáo lý cụ thể.
  alternative: “chân lý của Tin Lành” hoặc “điều chân thật”
  rationale: Trong văn cảnh, cụm từ chắc chắn bao gồm chân lý của Tin Lành, nhưng lời của Phao-lô có phạm vi rộng hơn. “Chân lý” bảo tồn sức nặng thần học và sự khái quát của nguyên văn.
- issue: Quan hệ giữa sự bất khả ở vế đầu và hành động ở vế sau
  choice: Dịch vế sau là “nhưng chỉ có thể hành động vì chân lý”.
  alternative: “nhưng vì chân lý”
  rationale: Nguyên văn tỉnh lược động từ ở vế sau. Tiếng Việt cần phục hồi ý “có thể làm/hành động” để câu trọn nghĩa. “Chỉ” làm rõ tính loại trừ vốn hàm chứa trong cấu trúc οὐ ... ἀλλὰ, chứ không nhằm thêm một khẳng định thần học độc lập.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Chân lý” được chọn thay cho “sự thật” để phù hợp với sắc thái đạo đức-thần học của ἀλήθεια trong văn cảnh, nhưng không thu hẹp nghĩa vào một giáo thuyết riêng.
