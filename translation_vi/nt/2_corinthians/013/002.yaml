  source_fidelity: Bản dịch truyền đạt đúng cấu trúc cảnh báo, tình trạng hiện vắng mặt đối lập với lần có mặt thứ hai, hai nhóm người được nhắm đến, và lời tuyên bố sẽ không nương tay khi trở lại. Tuy nhiên, “báo trước” cho προλέγω làm yếu sự lặp lại từ vựng với προείρηκα (“đã nói trước”), vốn là một nét có chủ ý trong nguyên văn. Chú thích cũng nên nói ngữ cảnh “gợi ý” thay vì khẳng định “cho thấy” cách hiểu lần thứ ba.
  naturalness: Câu hiện có nhìn chung tự nhiên và đúng văn phong trang trọng hiện đại. Bản sửa dùng “nói trước” ở cả hai vế để vừa sát nguyên văn vừa vẫn dễ hiểu; “tất cả những người khác” tự nhiên hơn “tất cả những người còn lại” trong sự đối lập giữa hai nhóm người.
  terminology: “Đã phạm tội trước kia” giữ đúng giá trị hồi chiếu của phân từ hoàn thành mà không suy diễn về sự ăn năn. “Không nương tay” là cách diễn đạt tốt cho οὐ φείσομαι và không áp đặt một hình thức kỷ luật cụ thể. Giữ “lại đến” trong câu chính; cách hiểu “lần thứ ba” chỉ đặt trong chú thích.
