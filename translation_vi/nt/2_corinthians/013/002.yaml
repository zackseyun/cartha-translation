source:
  edition: SBLGNT
  text: προείρηκα καὶ προλέγω ὡς παρὼν τὸ δεύτερον καὶ ἀπὼν ⸀νῦν, τοῖς προημαρτηκόσιν καὶ τοῖς λοιποῖς πᾶσιν, ὅτι ἐὰν ἔλθω εἰς τὸ πάλιν οὐ φείσομαι,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/002.yaml
  text: I have said before[a], and I say beforehand now while absent, as when present the second time, to those who sinned previously and to all the rest, that if I come again, I will not spare them.
translation:
  language: vi
  text: 'Tôi đã nói trước, và nay, khi vắng mặt, tôi nói trước—như khi tôi có mặt lần thứ hai—với những người đã phạm tội trước kia và với tất cả những người khác rằng: nếu tôi lại đến[a], tôi sẽ không nương tay.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay, nói rõ hơn: “nếu tôi đến lần thứ ba.” Tiếng Hy Lạp nói sát nghĩa là “nếu tôi lại đến,” nhưng ngữ cảnh về các lần Phao-lô đến thăm gợi ý rằng đây là một lần đến nữa sau lần thứ hai.'
    reason: alternative_reading
lexical_decisions:
- source_word: προείρηκα
  choice: Tôi đã nói trước đây
  rationale: Thì hoàn thành diễn tả lời đã nói trước đó và vẫn còn hiệu lực; cách dịch này không tự ý thêm sắc thái “cảnh cáo” dù ngữ cảnh mang tính răn đe.
- source_word: προλέγω
  choice: tôi báo trước
  rationale: Động từ có nghĩa là nói trước. “Báo trước” tự nhiên trong tiếng Việt và truyền đạt sắc thái hướng về điều sắp xảy ra mà không xác định cụ thể hình thức kỷ luật.
- source_word: ὡς παρὼν τὸ δεύτερον καὶ ἀπὼν νῦν
  choice: nay khi vắng mặt—như khi có mặt lần thứ hai—
  rationale: Cách sắp xếp này làm rõ sự đối chiếu giữa tình trạng hiện đang vắng mặt và lần thứ hai Phao-lô đã có mặt, đồng thời giữ tính cô đọng của nguyên văn.
- source_word: τοῖς προημαρτηκόσιν
  choice: cho những người đã phạm tội trước kia
  rationale: Phân từ hoàn thành chỉ những người có hành vi phạm tội trước đó đang được nhắc tới, nhưng không hàm ý họ đã hay chưa ăn năn.
- source_word: τοῖς λοιποῖς πᾶσιν
  choice: cho tất cả những người còn lại
  rationale: Giữ phạm vi bao quát của πᾶσιν và sự phân biệt với nhóm đã phạm tội trước kia.
- source_word: ἐὰν ἔλθω εἰς τὸ πάλιν
  choice: nếu tôi lại đến
  rationale: Đây là cách dịch tự nhiên và sát thành ngữ Hy Lạp về một lần đến nữa; cách hiểu cụ thể là “đến lần thứ ba” được giữ trong chú thích.
- source_word: οὐ φείσομαι
  choice: tôi sẽ không nương tay
  rationale: Diễn đạt tự nhiên ý không kiềm chế sự nghiêm khắc hay không tha nhẹ, nhưng không thêm một hình thức xử lý cụ thể mà nguyên văn không nêu.
theological_decisions:
- issue: Phạm vi của lời cảnh báo nghiêm khắc của Phao-lô
  choice: Lời báo trước được gửi đến cả những người đã phạm tội trước kia lẫn tất cả những người còn lại; khi trở lại, Phao-lô sẽ không nương tay.
  alternative: Lời đe dọa chỉ nhằm vào nhóm đã phạm tội trước kia, hoặc chỉ nói chung về sự nghiêm khắc của quyền sứ đồ mà không hàm ý biện pháp kỷ luật cụ thể.
  rationale: Cú pháp nêu rõ cả hai nhóm là đối tượng được nói với. Bản dịch giữ phạm vi rộng ấy nhưng không du nhập một cơ chế kỷ luật hay mô hình quản trị hội thánh cụ thể.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Dấu gạch ngang làm rõ cụm so sánh chen giữa mà không xóa sự cô đọng của nguyên văn. “Không nương tay” truyền đạt tự nhiên sức nặng của lời cảnh báo nhưng vẫn để ngỏ hình thức thi hành.
