source:
  edition: SBLGNT
  text: χαίρομεν γὰρ ὅταν ἡμεῖς ἀσθενῶμεν, ὑμεῖς δὲ δυνατοὶ ἦτε· ⸀τοῦτο καὶ εὐχόμεθα, τὴν ὑμῶν κατάρτισιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/009.yaml
  text: 'For we rejoice when we are weak and you are strong[a]. And this also is what we pray for: your restoration.'
translation:
  language: vi
  text: 'Vì chúng tôi vui mừng khi chúng tôi yếu đuối, còn anh chị em mạnh mẽ. Điều này cũng là điều chúng tôi cầu nguyện: sự phục hồi của anh chị em[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “sự trưởng thành của anh chị em” hoặc “anh chị em được làm nên trọn vẹn.” Từ Hy Lạp có thể chỉ sự phục hồi, sự trang bị, hoặc việc đưa một điều gì đó về tình trạng thích hợp.'
    reason: lexical_alternative
lexical_decisions:
- source_word: χαίρομεν
  choice: chúng tôi vui mừng
  rationale: Động từ hiện tại diễn tả niềm vui hiện thời của Phao-lô; “vui mừng” giữ được sắc thái mạnh hơn “vui” và phù hợp văn phong Tân Ước.
- source_word: γὰρ
  choice: vì
  rationale: Giữ quan hệ giải thích với mạch văn ngay trước đó và tự nhiên trong tiếng Việt.
- source_word: ὅταν
  choice: khi
  rationale: Kết hợp với động từ ở thể giả định để diễn tả hoàn cảnh có tính khái quát; “khi” tự nhiên mà không làm câu nặng nề.
- source_word: ἀσθενῶμεν
  choice: chúng tôi yếu đuối
  rationale: Giữ nghĩa rộng về sự yếu thế, bất lực hoặc vẻ ngoài không gây ấn tượng, đồng thời bảo toàn sự đối lập với δυνατοί.
- source_word: δυνατοὶ ἦτε
  choice: anh chị em mạnh mẽ
  rationale: “Mạnh mẽ” là vế đối tự nhiên với “yếu đuối” và không thu hẹp nghĩa thành quyền lực.
- source_word: τοῦτο καὶ εὐχόμεθα
  choice: Chúng tôi cũng cầu nguyện cho điều này
  rationale: εὔχομαι ở đây phù hợp nhất với nghĩa cầu nguyện; cách đặt câu giữ được sự nhấn mạnh vào τοῦτο mà vẫn tự nhiên trong tiếng Việt.
- source_word: τὴν ὑμῶν κατάρτισιν
  choice: anh chị em được phục hồi
  rationale: Trong bối cảnh Phao-lô mong hội thánh được sửa chỉnh và trở lại tình trạng đúng đắn, “được phục hồi” diễn đạt tốt trọng tâm mục vụ; các nghĩa trưởng thành và được làm nên trọn vẹn vẫn được giữ trong chú thích.
theological_decisions:
- issue: Ý nghĩa của κατάρτισις đối với mục tiêu mục vụ của Phao-lô
  choice: anh chị em được phục hồi
  alternative: anh chị em trưởng thành; anh chị em được làm nên trọn vẹn
  rationale: “Được phục hồi” phù hợp với bối cảnh sửa trị và lập lại trật tự, nhưng không biến từ này thành một thuật ngữ giáo lý về sự hoàn hảo. Chú thích giữ lại các khả năng nghĩa chân thực khác.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” cho đại từ số nhiều ὑμεῖς để diễn đạt cộng đồng tín hữu gồm cả nam lẫn nữ; giữ phép đối “chúng tôi yếu đuối / anh chị em mạnh mẽ.”
