source:
  edition: SBLGNT
  text: ἡ χάρις τοῦ κυρίου Ἰησοῦ Χριστοῦ καὶ ἡ ἀγάπη τοῦ θεοῦ καὶ ἡ κοινωνία τοῦ ἁγίου πνεύματος μετὰ πάντων ⸀ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/013.yaml
  text: The grace of the Lord Jesus Christ[a], and the love of God, and the fellowship of the Holy Spirit[b], be with all of you.
translation:
  language: vi
  text: Nguyện ân điển của Chúa Giê-su, Đấng Mê-si-a[a], tình yêu của Đức Chúa Trời, và sự thông công của Đức Thánh Linh[b] ở cùng tất cả anh chị em.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay theo cách gọi truyền thống: “Chúa Giê-su Christ.”'
    reason: alternative_reading
  - marker: b
    text: 'Cũng có thể dịch: “sự hiệp thông của Đức Thánh Linh” hoặc “sự dự phần trong Đức Thánh Linh.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρις
  choice: ân điển
  rationale: Cách dịch quen thuộc trong văn mạch Phao-lô, giữ được chiều sâu thần học của ân huệ nhưng không của Đức Chúa Trời.
- source_word: κυρίου
  choice: Chúa
  rationale: Danh xưng tự nhiên và trang trọng dành cho Chúa Giê-su trong tiếng Việt hiện đại.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Giê-su, Đấng Mê-si
  rationale: Giê-su là tên riêng, còn Χριστός là tước hiệu; cách dịch này làm rõ nghĩa 'Đấng được xức dầu' thay vì khiến 'Christ' có vẻ như một phần của tên riêng.
- source_word: ἀγάπη τοῦ θεοῦ
  choice: tình yêu của Đức Chúa Trời
  rationale: Giữ nguyên kết cấu sở hữu và không diễn giải quá mức đối tượng hay hướng của tình yêu.
- source_word: κοινωνία
  choice: sự thông công
  rationale: Diễn đạt cả mối liên hệ chung và sự cùng dự phần, đồng thời phù hợp với lời chúc phước; các sắc thái khác được giữ trong chú thích.
- source_word: ἁγίου πνεύματος
  choice: Đức Thánh Linh
  rationale: Danh xưng phổ biến, trang trọng trong tiếng Việt hiện đại dành cho Chúa Thánh Linh.
- source_word: μετὰ πάντων ὑμῶν
  choice: ở cùng tất cả anh chị em
  rationale: Bổ sung động từ theo phép tỉnh lược của lời chúc phước Hy Lạp và thể hiện rõ πάντων; 'anh chị em' tự nhiên, bao quát cộng đồng được gửi thư.
theological_decisions:
- issue: Cách dịch tước hiệu Χριστοῦ
  choice: Đấng Mê-si
  alternative: Đấng Christ
  rationale: Χριστός mang chức năng tước hiệu ở đây. Bản chính chuyển dịch ý nghĩa của tước hiệu, còn cách gọi truyền thống được ghi ở chú thích.
- issue: Ý nghĩa của κοινωνία τοῦ ἁγίου πνεύματος
  choice: sự thông công của Đức Thánh Linh
  alternative: sự hiệp thông của Đức Thánh Linh; sự dự phần trong Đức Thánh Linh
  rationale: Kết cấu sở hữu cách có thể chỉ sự thông công do Thánh Linh ban, sự thông công với Ngài, hoặc sự cùng dự phần trong Ngài. Cách dịch chính giữ độ rộng ấy thay vì quyết định thay cho nguyên văn.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, theo thể thức lời chúc phước. Dùng “tất cả anh chị em” để truyền đạt rõ tính bao quát của πάντων ὑμῶν; các dấu phẩy duy trì ba vế song song của nguyên văn.
