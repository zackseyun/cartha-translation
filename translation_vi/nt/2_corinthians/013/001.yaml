id: 2CO.13.1
reference: 2 Corinthians 13:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Τρίτον τοῦτο ἔρχομαι πρὸς ὑμᾶς· ἐπὶ στόματος δύο μαρτύρων καὶ τριῶν σταθήσεται πᾶν ῥῆμα.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/001.yaml
  text: 'This is the third time I am coming to you: “Every matter will be established by the testimony of two witnesses or three.”[a][b]'
translation:
  language: vi
  text: 'Đây là lần thứ ba tôi đến với anh chị em: “Mọi sự việc sẽ được xác lập dựa trên lời chứng của hai hoặc ba nhân chứng.”[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Mọi lời sẽ được xác lập bởi miệng của hai hoặc ba nhân chứng.” Bản Hy Lạp theo sát cách diễn đạt của Phục Truyền Luật Lệ Ký 19:15 và dùng một thành ngữ pháp lý.'
    reason: lexical_alternative
  - marker: b
    text: Gợi nhắc Phục Truyền Luật Lệ Ký 19:15.
    reason: cross_reference
lexical_decisions:
- source_word: Τρίτον τοῦτο
  choice: Đây là lần thứ ba
  rationale: Cụm đối cách trung tính được dùng theo nghĩa trạng từ, chỉ đây là lần thứ ba Phao-lô đến; cách diễn đạt này tự nhiên và rõ ràng trong tiếng Việt hiện đại.
- source_word: ἔρχομαι πρὸς ὑμᾶς
  choice: tôi đến với anh chị em
  rationale: Hiện tại ἔρχομαι trong ngữ cảnh có sắc thái một chuyến đi sắp diễn ra. Tiếng Việt không cần đánh dấu thì rõ như tiếng Anh; “đến” giữ được tính trực tiếp mà không thêm ý “đang trên đường”.
- source_word: ἐπὶ στόματος
  choice: dựa trên lời chứng của
  rationale: Đây là thành ngữ pháp lý theo Phục Truyền Luật Lệ Ký 19:15. “Dựa trên lời chứng của” truyền đạt chức năng pháp lý rõ hơn lối dịch sát chữ “trên miệng của”.
- source_word: δύο μαρτύρων καὶ τριῶν
  choice: hai hoặc ba nhân chứng
  rationale: καί nằm trong công thức trích dẫn Kinh Thánh mang nghĩa phân phối “hai hoặc ba”; cách sắp xếp này tự nhiên trong tiếng Việt và không gợi ý tổng cộng năm nhân chứng.
- source_word: σταθήσεται
  choice: sẽ được xác lập
  rationale: Thể tương lai bị động của ἵστημι trong văn cảnh pháp lý có nghĩa một sự việc được xác nhận là có giá trị hoặc đứng vững; “được xác lập” giữ sắc thái pháp lý.
- source_word: πᾶν ῥῆμα
  choice: mọi sự việc
  rationale: ῥῆμα có thể là “lời” hoặc “phát ngôn”, nhưng trong câu trích dẫn pháp lý này chỉ bất cứ vụ việc nào cần được chứng thực. “Mọi sự việc” giữ phạm vi rộng mà không thu hẹp thành “mọi cáo buộc”.
theological_decisions:
- issue: Phạm vi áp dụng của nguyên tắc pháp lý trích từ Phục Truyền Luật Lệ Ký 19:15
  choice: Dịch πᾶν ῥῆμα là “mọi sự việc”, không giới hạn câu này riêng vào kỷ luật Hội Thánh.
  alternative: “mọi lời” hoặc “mọi cáo buộc”
  rationale: Phao-lô viện dẫn một nguyên tắc pháp lý trong Kinh Thánh. Bản dịch cần giữ lực pháp lý rộng của lời trích mà không áp đặt một cách giải thích giáo hội học hẹp hơn điều bản Hy Lạp nói rõ.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, dễ hiểu. Dùng “anh chị em” cho đại từ số nhiều ὑμᾶς nhằm diễn đạt cộng đồng tín hữu gồm cả nam lẫn nữ; giữ cấu trúc lời trích và các dấu chú thích [a][b] trong chính văn.
