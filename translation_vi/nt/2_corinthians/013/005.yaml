revisions:
- from: Hãy tự kiểm nghiệm xem anh chị em có ở trong đức tin hay không[a]; hãy tự xem xét mình. Hay anh chị em không nhận biết rằng Chúa Giê-su, Đấng Mê-si, đang ở trong anh chị em[b] sao? Trừ phi anh chị em không vượt qua được sự kiểm nghiệm.
  to: Hãy kiểm nghiệm chính mình xem anh chị em có ở trong đức tin hay không[a]; hãy tự xem xét mình. Hay anh chị em không nhận biết rằng Giê-su, Đấng Mê-si, đang ở trong anh chị em[b] sao?—trừ khi anh chị em không đạt yêu cầu trong sự kiểm nghiệm.
  rationale: Bỏ “Chúa” vì không có tương ứng trong tiếng Hy Lạp của câu, nhưng giữ “Đấng Mê-si” để chuyển tải Χριστός như tước hiệu. Điều chỉnh cụm cuối để tiếng Việt tự nhiên hơn, vẫn giữ liên hệ ngữ nghĩa giữa việc tự kiểm nghiệm và tình trạng không được chấp nhận sau kiểm nghiệm. Các chú thích hiện có bảo tồn đầy đủ hai điểm mơ hồ chính của câu.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T19:28:37Z'
review_pass:
  verdict: revise
  source_fidelity: Bản nháp phản ánh đúng hai mệnh lệnh tự thử/xem xét, cụm “ở trong đức tin,” câu hỏi tu từ về sự hiện diện của Giê-su là Đấng Mê-si, và ngoại lệ liên quan đến việc không đứng vững trước sự kiểm tra. Tuy nhiên, “Chúa” không có từ tương ứng trong văn bản Hy Lạp của câu này (Ἰησοῦς Χριστός), nên thêm một tước hiệu không được nguồn trực tiếp nêu. Cần bỏ để giữ độ tương đương tối ưu.
  naturalness: “Hãy kiểm nghiệm chính mình” và “hãy tự xem xét mình” là tiếng Việt hiện đại, rõ ràng, đồng thời giữ được hai động từ song song. “Trừ khi anh chị em không vượt qua được sự kiểm nghiệm” có thể hiểu được, nhưng “không đạt yêu cầu trong sự kiểm nghiệm” tự nhiên hơn trong mệnh đề ngoại lệ và vẫn giữ hình ảnh kiểm tra/được chấp nhận của ἀδόκιμοι.
  terminology: “Đấng Mê-si” diễn đạt Χριστός như một tước hiệu phù hợp; không nên thêm “Chúa” ở đây. “Ở trong đức tin” bảo lưu tính mở của ἐν τῇ πίστει. Chú thích về nghĩa cộng đồng của ἐν ὑμῖν được giữ lại.
  issues:
  - severity: medium
    issue: Thêm tước hiệu “Chúa” trước “Giê-su”.
    rationale: Nguồn SBLGNT chỉ có Ἰησοῦς Χριστός, không có κύριος. Dù “Chúa Giê-su” là lối xưng hô quen thuộc trong tiếng Việt Cơ Đốc, việc thêm tước hiệu ở đây vượt quá văn bản nguồn.
  - severity: low
    issue: Cách diễn đạt cuối câu hơi gượng.
    rationale: “Không vượt qua được sự kiểm nghiệm” đúng ý, nhưng “không đạt yêu cầu trong sự kiểm nghiệm” tự nhiên hơn và vẫn truyền đạt ἀδόκιμοι là không được chấp nhận sau khi thử nghiệm.
