id: 2CO.13.5
reference: 2 Corinthians 13:5
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἑαυτοὺς πειράζετε εἰ ἐστὲ ἐν τῇ πίστει, ἑαυτοὺς δοκιμάζετε· ἢ οὐκ ἐπιγινώσκετε ἑαυτοὺς ὅτι ⸂Ἰησοῦς Χριστὸς⸃ ἐν ⸀ὑμῖν; εἰ μήτι ἀδόκιμοί ἐστε.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/005.yaml
  text: Test yourselves to see whether you are in the faith[a]; examine yourselves[c][b]. Or do you not recognize that Jesus the Messiah is in you?—unless indeed you are disqualified.
translation:
  language: vi
  text: Hãy kiểm nghiệm chính mình xem anh chị em có ở trong đức tin hay không[a]; hãy tự xem xét mình. Hay anh chị em không nhận biết rằng Giê-su, Đấng Mê-si, đang ở trong anh chị em[b] sao?—trừ khi anh chị em không đạt yêu cầu trong sự kiểm nghiệm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ở trong đức tin” có thể chỉ việc tiếp tục thuộc về đức tin Cơ Đốc, hoặc việc thật sự có đức tin chân chính.
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “ở giữa anh chị em”.'
    reason: alternative_reading
lexical_decisions:
- source_word: πειράζετε
  choice: kiểm nghiệm
  rationale: Trong ngữ cảnh này, động từ chỉ việc thử để xác định tính chân thật, không phải cám dỗ. “Kiểm nghiệm” giữ được sắc thái đánh giá.
- source_word: ἐν τῇ πίστει
  choice: ở trong đức tin
  rationale: Giữ cấu trúc có mạo từ và không quyết định dứt khoát giữa việc thuộc về phạm vi đức tin Cơ Đốc và việc có đức tin chân thật.
- source_word: δοκιμάζετε
  choice: xem xét
  rationale: Cách dịch này tự nhiên trong tiếng Việt, đồng thời phân biệt nhẹ với πειράζετε và diễn đạt việc khảo sát để nhận ra điều đã được chứng thực.
- source_word: ἐπιγινώσκετε
  choice: nhận biết
  rationale: Diễn đạt sự nhận ra hay ý thức đầy đủ trong câu hỏi tu từ.
- source_word: ἑαυτούς
  choice: tự mình / mình
  rationale: Các đại từ phản thân được thể hiện tự nhiên qua “tự kiểm nghiệm”, “tự xem xét mình”; ở câu hỏi tu từ, tiếng Việt không cần lặp một tân ngữ phản thân gượng ép.
- source_word: Ἰησοῦς Χριστός
  choice: Chúa Giê-su, Đấng Mê-si
  rationale: Χριστός ở đây có sức nặng của một tước hiệu; “Đấng Mê-si” bảo tồn ý nghĩa ấy thay vì chỉ phiên âm. “Chúa” là cách xưng gọi tiếng Việt tự nhiên dành cho Giê-su, không thay thế bất kỳ từ Hy Lạp riêng biệt nào.
- source_word: ἐν ὑμῖν
  choice: ở trong anh chị em
  rationale: Ngữ cảnh tự xem xét nghiêng về sự hiện diện của Đấng Mê-si trong các tín hữu; vì đại từ là số nhiều, câu tiếng Việt vẫn có thể gợi cả chiều kích cộng đồng. Nghĩa “ở giữa” được ghi chú.
- source_word: εἰ μήτι
  choice: trừ phi
  rationale: Diễn đạt ngoại lệ mang sắc thái dè dặt trong câu hỏi tu từ mà không thêm ý quá mức.
- source_word: ἀδόκιμοι
  choice: không vượt qua được sự kiểm nghiệm
  rationale: Giữ mối liên hệ từ vựng với các mệnh lệnh kiểm nghiệm và tránh sắc thái thần học hậu kỳ dễ gắn với những từ như “bị loại bỏ” hay “hư mất”.
theological_decisions:
- issue: Ý nghĩa của Χριστός
  choice: Đấng Mê-si
  alternative: Đấng Christ
  rationale: Ngữ cảnh tuyên xưng cho phép hiểu đây là tước hiệu; bản dịch thể hiện nghĩa của tước hiệu mà không biến nó thành một phần tên riêng.
- issue: Ý nghĩa của ἐν τῇ πίστει
  choice: ở trong đức tin
  alternative: có đức tin chân thật
  rationale: Cụm Hy Lạp có thể nói đến việc ở trong phạm vi đức tin Cơ Đốc hoặc có đức tin chân thật. Giữ cách nói sát nguồn để không giải quyết thay sự căng thẳng thần học của câu.
- issue: Ý nghĩa của ἐν ὑμῖν
  choice: ở trong anh chị em
  alternative: ở giữa anh chị em
  rationale: Mạch văn tự kiểm nghiệm ủng hộ ý về sự hiện diện bên trong các tín hữu, nhưng cách dùng số nhiều cũng có thể mang nghĩa cộng đồng; phương án kia được bảo tồn trong chú thích.
- issue: Sắc thái của ἀδόκιμοι
  choice: không vượt qua được sự kiểm nghiệm
  alternative: bị loại; không được chấp nhận
  rationale: Cách chọn giữ hình ảnh thử nghiệm và không nhập vào câu một học thuyết cụ thể về tình trạng cứu rỗi cuối cùng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và trực tiếp. “Anh chị em” thể hiện đại từ số nhiều ὑμῖν và phù hợp lời khuyên gửi cả cộng đồng. Hai mệnh lệnh song song được giữ riêng; thuật ngữ kiểm nghiệm được lặp ở kết câu để bảo tồn phép chơi ý giữa πειράζετε/δοκιμάζετε và ἀδόκιμοι.
