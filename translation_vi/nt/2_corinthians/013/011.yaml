id: 2CO.13.11
reference: 2 Corinthians 13:11
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Λοιπόν, ἀδελφοί, χαίρετε, καταρτίζεσθε, παρακαλεῖσθε, τὸ αὐτὸ φρονεῖτε, εἰρηνεύετε, καὶ ὁ θεὸς τῆς ἀγάπης καὶ εἰρήνης ἔσται μεθ’ ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/011.yaml
  text: Finally[a], brothers, rejoice, be restored, be encouraged, think the same thing, live in peace[e][d][c][b], and the God of love and peace will be with you.
translation:
  language: vi
  text: Cuối cùng[a], thưa anh em[b], hãy vui mừng, hãy được phục hồi[c], hãy đón nhận sự khích lệ[d], hãy cùng chung một ý[e], hãy sống hòa thuận; và Đức Chúa Trời của tình yêu thương và bình an sẽ ở cùng anh em.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch là “hãy vui lên” hoặc hiểu như lời chào kết thư: “chào tạm biệt.” Tuy nhiên, ở đây từ này có lẽ tiếp tục chuỗi lời khuyên: “hãy vui mừng.”'
    reason: lexical_alternative
  - marker: b
    text: “Anh em” ở đây là lời gọi toàn thể hội chúng và rất có thể bao gồm cả nam lẫn nữ.
    reason: cultural_note
  - marker: c
    text: Cũng có thể dịch là “hãy trở nên hoàn chỉnh,” “hãy được sửa chữa” hoặc “hãy chỉnh đốn.”
    reason: lexical_alternative
  - marker: d
    text: Cũng có thể dịch là “hãy tiếp nhận lời khuyên nhủ” hoặc “hãy được an ủi.”
    reason: lexical_alternative
  - marker: e
    text: Sát nghĩa là “hãy suy nghĩ cùng một điều,” tức là “hãy đồng tâm.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Λοιπόν
  choice: Cuối cùng
  rationale: Đây là từ chuyển ý đưa bức thư đến phần kết; “Cuối cùng” tự nhiên trong tiếng Việt hiện đại.
- source_word: ἀδελφοί
  choice: anh em
  rationale: Giữ cách xưng hô ở dạng giống đực của nguyên văn. Trong cách dùng hội chúng của Phao-lô, từ này có thể chỉ toàn thể cộng đồng, gồm cả nam lẫn nữ.
- source_word: χαίρετε
  choice: hãy vui mừng
  rationale: Dù từ này cũng có thể là lời chào kết thư, vị trí của nó trong chuỗi mệnh lệnh khiến nghĩa khuyên bảo “hãy vui mừng” phù hợp hơn.
- source_word: καταρτίζεσθε
  choice: hãy được phục hồi
  rationale: Động từ có thể chỉ việc sửa chữa, phục hồi, trang bị hoặc đưa về tình trạng đúng đắn. Cách dịch này phù hợp với bối cảnh chỉnh đốn hội chúng mà không hàm ý đạt đến sự hoàn hảo tuyệt đối.
- source_word: παρακαλεῖσθε
  choice: hãy được khích lệ
  rationale: Dạng trung động/thụ động có thể nói đến việc nhận sự khích lệ, an ủi hoặc khuyên nhủ. Bản dịch giữ hình thức thụ động và để chú thích nêu nghĩa thay thế.
- source_word: τὸ αὐτὸ φρονεῖτε
  choice: hãy cùng một lòng
  rationale: Đây là cách nói tự nhiên trong tiếng Việt cho nghĩa cùng chung suy nghĩ và ý hướng; chú thích bảo tồn nghĩa sát chữ “hãy suy nghĩ cùng một điều”.
- source_word: εἰρηνεύετε
  choice: hãy sống hòa thuận
  rationale: Mệnh lệnh hiện tại kêu gọi nếp sống hòa bình liên tục trong cộng đồng. “Sống hòa thuận” tự nhiên hơn “hãy hòa bình” trong tiếng Việt.
- source_word: ὁ θεὸς τῆς ἀγάπης καὶ εἰρήνης
  choice: Đức Chúa Trời của tình yêu thương và bình an
  rationale: Phản ánh trực tiếp cấu trúc sở hữu của nguyên văn và giữ hai danh từ thần học mà không diễn giải thêm.
- source_word: ἔσται μεθ’ ὑμῶν
  choice: sẽ ở cùng anh em
  rationale: Diễn đạt tự nhiên lời hứa ở thì tương lai; đại từ số nhiều được thể hiện qua “anh em”.
theological_decisions:
- issue: Phạm vi bao gồm của ἀδελφοί khi nói với hội chúng
  choice: Dịch “anh em” trong chính văn, giữ hình thức giống đực của nguyên văn và giải thích phạm vi bao gồm trong chú thích.
  alternative: “anh chị em” hoặc “các anh chị em”
  rationale: Nguyên văn dùng danh từ giống đực số nhiều, nhưng trong văn cảnh Phao-lô đang nói với toàn thể hội chúng. Chú thích vừa giữ hình thức nguồn vừa làm rõ rằng lời này không chỉ dành cho nam giới.
- issue: Sắc thái của καταρτίζεσθε
  choice: “hãy được phục hồi”
  alternative: “hãy trở nên hoàn chỉnh” hoặc “hãy chỉnh đốn”
  rationale: Nguyên văn cho phép sắc thái thụ động hoặc trung động và không xác định rõ tác nhân. Cách dịch chính không biến lời này thành tuyên bố về sự hoàn hảo vô tội.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng vừa phải và phù hợp để đọc công khai. Chuỗi “hãy” giữ nhịp các mệnh lệnh của nguyên văn; dấu chấm phẩy phân biệt chuỗi khuyên bảo với lời hứa kết thúc.
