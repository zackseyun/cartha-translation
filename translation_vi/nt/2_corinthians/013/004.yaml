id: 2CO.13.4
reference: 2 Corinthians 13:4
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ⸀γὰρ ἐσταυρώθη ἐξ ἀσθενείας, ἀλλὰ ζῇ ἐκ δυνάμεως θεοῦ. καὶ γὰρ ἡμεῖς ἀσθενοῦμεν ἐν αὐτῷ, ἀλλὰ ⸀ζήσομεν σὺν αὐτῷ ἐκ δυνάμεως θεοῦ εἰς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/004.yaml
  text: For indeed he was crucified in weakness[a], but he lives by the power of God. For indeed we are weak in him[d][c][b], but we will live with him by the power of God toward you.
translation:
  language: vi
  text: Vì thật vậy, Ngài đã bị đóng đinh trong sự yếu đuối[a], nhưng Ngài sống bởi quyền năng của Đức Chúa Trời. Vì thật vậy, chúng tôi yếu đuối trong Ngài, nhưng sẽ cùng Ngài sống bởi quyền năng của Đức Chúa Trời đối với anh chị em[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “do sự yếu đuối.” Giới từ Hy Lạp ἐξ có thể nhấn mạnh nguồn gốc hoặc căn cứ, nhưng trong ngữ cảnh này “trong sự yếu đuối” tự nhiên hơn trong tiếng Việt.'
    reason: lexical_alternative
  - marker: b
    text: “Sẽ cùng Ngài sống” có thể nói đến sự sống và quyền năng từ Đấng Christ được bày tỏ trong cách Phao-lô và các cộng sự của ông hành xử với người Cô-rinh-tô; cụm từ này cũng gợi đến chủ đề rộng hơn về sự sống phục sinh.
    reason: alternative_reading
  - marker: c
    text: Cụm “đối với anh chị em” trong tiếng Hy Lạp có thể mang nghĩa “hướng đến anh chị em,” “cho anh chị em,” hoặc “giữa anh chị em.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσταυρώθη
  choice: đã bị đóng đinh
  rationale: Giữ thể bị động và ý nghĩa chính xác của động từ σταυρόω; cách diễn đạt này tự nhiên, trang trọng trong tiếng Việt.
- source_word: ἐξ ἀσθενείας
  choice: trong sự yếu đuối
  rationale: Trong ngữ cảnh, cụm từ nói đến hoàn cảnh hoặc trạng thái yếu đuối gắn với việc chịu đóng đinh. Cách dịch này tự nhiên hơn 'từ sự yếu đuối', trong khi chú thích vẫn bảo lưu sắc thái nguồn gốc/căn cứ của ἐξ.
- source_word: ζῇ
  choice: vẫn sống
  rationale: Diễn đạt thì hiện tại và làm nổi bật thế tương phản với việc Ngài đã bị đóng đinh; 'vẫn' là yếu tố diễn ngôn tự nhiên trong tiếng Việt.
- source_word: ἐκ δυνάμεως θεοῦ
  choice: bởi quyền năng của Đức Chúa Trời
  rationale: Diễn đạt tự nhiên phương tiện hoặc căn nguyên của sự sống, đồng thời giữ sự tương phản với sự yếu đuối.
- source_word: ἀσθενοῦμεν
  choice: yếu đuối
  rationale: Giữ liên hệ từ vựng với ἀσθένεια ở mệnh đề đầu mà không thu hẹp nghĩa thành bất lực tuyệt đối.
- source_word: ἐν αὐτῷ
  choice: trong Ngài
  rationale: Bảo lưu cách nói cô đọng của Phao-lô về mối liên hệ với Đấng Christ, không giải thích quá mức.
- source_word: ζήσομεν σὺν αὐτῷ
  choice: sẽ cùng Ngài sống
  rationale: Giữ thì tương lai của ζήσομεν và ý nghĩa đồng hành/dự phần của σύν; trật tự từ tự nhiên trong tiếng Việt.
- source_word: εἰς ὑμᾶς
  choice: đối với anh chị em
  rationale: Cụm εἰς ὑμᾶς cô đọng, có thể chỉ hướng, quan hệ hoặc tác động. 'Đối với anh chị em' giữ độ rộng nghĩa tốt hơn một cách dịch thuần không gian.
theological_decisions:
- issue: Ý nghĩa của sự yếu đuối trong việc Đấng Christ chịu đóng đinh
  choice: 'Giữ nguyên nghịch lý: Ngài chịu đóng đinh trong sự yếu đuối nhưng sống bởi quyền năng Đức Chúa Trời.'
  alternative: Diễn giải là Ngài chỉ có vẻ yếu đuối theo mắt loài người.
  rationale: Bản dịch không biến 'sự yếu đuối' thành lời phủ nhận thần tính hay sự vô tội của Đấng Christ, cũng không thêm một lời giải thích thần học không có trực tiếp trong câu.
- issue: Phạm vi của câu 'sẽ cùng Ngài sống'
  choice: Để ngỏ cho cả sự sống và quyền năng của chức vụ được biểu lộ đối với người Cô-rinh-tô lẫn âm hưởng rộng hơn về sự sống phục sinh.
  alternative: Chỉ quy về sự phục sinh tương lai, hoặc chỉ quy về quyền năng trong chức vụ hiện tại.
  rationale: Ngữ cảnh gần hướng đến cách Phao-lô sẽ hành xử đối với người Cô-rinh-tô, nhưng thì tương lai và ngôn ngữ dự phần với Đấng Christ cũng mang âm hưởng phục sinh; không nên giải quyết căng thẳng này trong chính văn.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” cho Đấng Christ, “Đức Chúa Trời” cho θεός và “anh chị em” cho đại từ số nhiều ὑμᾶς. Hai lần ἐκ/ἐξ được dịch theo ngữ cảnh bằng “trong” và “bởi” để tránh lối nói gượng “từ quyền năng,” nhưng quan hệ tương phản giữa yếu đuối và quyền năng vẫn được giữ rõ.
