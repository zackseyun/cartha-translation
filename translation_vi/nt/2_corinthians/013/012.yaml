  text: ἀσπάσασθε ἀλλήλους ἐν ἁγίῳ φιλήματι. ἀσπάζονται ὑμᾶς οἱ ἅγιοι πάντες.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/012.yaml
  text: Greet one another with a holy kiss[b][a]. All the saints greet you.
translation:
  language: vi
  text: Hãy chào nhau bằng một nụ hôn thánh.[a] Tất cả các thánh đều gửi lời chào đến anh chị em.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “bằng một nụ hôn thiêng liêng.” Cụm từ này chỉ một cách chào hỏi được văn hóa thời ấy công nhận, được đánh dấu bởi sự thánh và sự hiệp thông trong cộng đồng Cơ Đốc.'
    reason: lexical_alternative
  - marker: b
    text: “Các thánh” ở đây chỉ các tín hữu, tức dân thánh của Đức Chúa Trời; không chỉ một tầng lớp đặc biệt gồm những người về sau được phong thánh.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: Hãy chào
  rationale: Động từ mệnh lệnh trực tiếp ở ngôi thứ hai số nhiều; “hãy chào” tự nhiên, ngắn gọn và giữ được sắc thái khuyên bảo.
- source_word: ἀλλήλους
  choice: nhau
  rationale: Đại từ tương hỗ, diễn tả hành động chào hỏi lẫn nhau trong cộng đồng.
- source_word: ἐν ἁγίῳ φιλήματι
  choice: bằng cái hôn thánh khiết
  rationale: ἐν trong công thức chào hỏi được diễn đạt tự nhiên bằng “bằng”; “cái hôn” giữ nghĩa trực tiếp của φίλημα, còn “thánh khiết” thể hiện tính biệt riêng cho Đức Chúa Trời và mối thông công của cộng đồng.
- source_word: ἀσπάζονται
  choice: gửi lời chào
  rationale: Trong phần kết thư, cách nói này tự nhiên hơn “chào” khi những người ở cùng người viết chuyển lời đến người nhận.
- source_word: ὑμᾶς
  choice: anh chị em
  rationale: Đại từ ngôi thứ hai số nhiều chỉ toàn thể cộng đồng; “anh chị em” làm rõ số nhiều và phù hợp với lối xưng hô Cơ Đốc trong tiếng Việt hiện đại.
- source_word: οἱ ἅγιοι πάντες
  choice: Tất cả các thánh đồ
  rationale: πάντες được thể hiện bằng “tất cả”; “thánh đồ” là cách gọi quen thuộc dành cho những người thuộc về Đức Chúa Trời, không chỉ một tầng lớp đặc biệt.
theological_decisions:
- issue: Cách dịch ἅγιοι như danh xưng cộng đồng trong thư Phao-lô
  choice: các thánh đồ
  alternative: những người thánh; dân thánh của Đức Chúa Trời
  rationale: “Các thánh đồ” duy trì thuật ngữ thần học quen thuộc trong tiếng Việt và chỉ toàn thể các tín hữu là dân được biệt riêng cho Đức Chúa Trời, chứ không hàm ý một nhóm tinh hoa được phong thánh về sau.
- issue: Tính chất của ἅγιον trong nghi thức chào hỏi
  choice: thánh khiết
  alternative: thánh; thiêng liêng
  rationale: “Thánh khiết” nhấn mạnh rằng cái hôn chào hỏi được đánh dấu bởi sự thánh và tình thông công Cơ Đốc, nhưng không biến câu thành một mệnh đề nghi lễ hay giáo phái.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “anh chị em” để biểu đạt rõ đối tượng số nhiều của ὑμᾶς; giữ hình ảnh cụ thể “cái hôn” thay vì diễn giải thành một lời chào chung chung.
