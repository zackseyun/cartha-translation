  text: ἐλπίζω δὲ ὅτι γνώσεσθε ὅτι ἡμεῖς οὐκ ἐσμὲν ἀδόκιμοι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/006.yaml
  text: But I hope that you will know that we are not disqualified[a].
translation:
  language: vi
  text: Nhưng tôi hy vọng anh chị em sẽ biết rằng chúng tôi không bị loại[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “không phải là những người không được chấp nhận” hoặc “không phải là những người không vượt qua thử nghiệm.” Tính từ Hy Lạp chỉ người không đứng vững để được chấp nhận sau khi bị thử nghiệm.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλπίζω
  choice: tôi hy vọng
  rationale: Diễn đạt tự nhiên thì hiện tại, ngôi thứ nhất số ít và giữ sắc thái mong đợi hướng về điều sẽ được nhận biết.
- source_word: δὲ
  choice: Nhưng
  rationale: Thể hiện sự tương phản nhẹ với mối lo ở câu trước, đồng thời vẫn tự nhiên trong tiếng Việt.
- source_word: γνώσεσθε
  choice: anh chị em sẽ biết
  rationale: Giữ giá trị tương lai của động từ và diễn đạt trực tiếp sự nhận biết của các tín hữu Cô-rinh-tô.
- source_word: ὅτι
  choice: rằng
  rationale: Dẫn nhập mệnh đề nội dung một cách tự nhiên trong tiếng Việt.
- source_word: ἡμεῖς
  choice: chúng tôi
  rationale: Giữ đại từ số nhiều chỉ Phao-lô và những người cùng phục vụ với ông; tiếng Việt không cần thêm từ nhấn mạnh.
- source_word: οὐκ ἐσμὲν
  choice: không phải là
  rationale: Phản ánh đúng cấu trúc hệ từ phủ định, không tăng cường mức độ phủ định.
- source_word: ἀδόκιμοι
  choice: những người không đạt yêu cầu
  rationale: Giữ hình ảnh bị xem xét nhưng không được công nhận là đạt chuẩn; cách nói này tự nhiên hơn 'không được chuẩn nhận' và tránh sắc thái giáo lý hoặc cổ xưa của các từ tương đương với 'reprobate'.
theological_decisions:
- issue: Cách dịch ἀδόκιμοι trong bối cảnh thử nghiệm và tư cách sứ đồ
  choice: không phải là những người không đạt yêu cầu
  alternative: không phải là những người không được chuẩn nhận; không phải là những người thất bại khi chịu thử nghiệm; không phải là những kẻ bị loại bỏ
  rationale: Ngữ cảnh gần nói đến việc tự xét nghiệm và chứng minh tư cách. Bản dịch giữ sức nặng đánh giá của từ Hy Lạp mà không gán thêm ý niệm về sự hư mất đời đời hay một phán quyết giáo lý không được câu này xác định.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “anh chị em” để chỉ cộng đồng người nhận, “chúng tôi” cho nhóm của Phao-lô. Cụm phủ định kép được giữ vì phản ánh cấu trúc và sự căng thẳng của nguyên văn; chú thích làm rõ trường nghĩa thử nghiệm/chuẩn nhận.
