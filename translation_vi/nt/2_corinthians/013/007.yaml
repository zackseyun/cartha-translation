source:
  edition: SBLGNT
  text: ⸀εὐχόμεθα δὲ πρὸς τὸν θεὸν μὴ ποιῆσαι ὑμᾶς κακὸν μηδέν, οὐχ ἵνα ἡμεῖς δόκιμοι φανῶμεν, ἀλλ’ ἵνα ὑμεῖς τὸ καλὸν ποιῆτε, ἡμεῖς δὲ ὡς ἀδόκιμοι ὦμεν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/007.yaml
  text: We pray to God that you may do nothing wrong—not so that we may appear approved[a], but so that you may do what is right[c][b], even if we may seem disqualified.
translation:
  language: vi
  text: Chúng tôi cầu xin Đức Chúa Trời cho anh chị em không làm điều gì sai trái—không phải để chúng tôi tỏ ra là những người được công nhận, nhưng để anh chị em làm điều đúng, còn chúng tôi thì như những người không được công nhận.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “còn chúng tôi thì như những người không đạt” hoặc “dù chúng tôi tỏ ra là những người không được công nhận.” Từ Hy Lạp này đối lập với “được công nhận” ở vế trước.'
    reason: Bảo lưu phạm vi nghĩa của ὡς ἀδόκιμοι và sự đối lập từ vựng với δόκιμοι, không khẳng định một sự kết án chung cuộc.
lexical_decisions:
- source_word: εὐχόμεθα δὲ πρὸς τὸν θεὸν
  choice: Chúng tôi cầu xin Đức Chúa Trời
  rationale: εὔχομαι với πρός + đối cách chỉ lời cầu nguyện hướng đến Đức Chúa Trời. “Cầu xin Đức Chúa Trời” tự nhiên trong tiếng Việt và δέ được thể hiện qua mạch chuyển ý của câu, không cần thêm một liên từ gượng ép.
- source_word: μὴ ποιῆσαι ὑμᾶς κακὸν μηδέν
  choice: cho anh chị em không làm điều gì sai trái
  rationale: Cấu trúc nguyên mẫu nêu nội dung lời cầu xin; κακὸν μηδέν nhấn mạnh việc không làm bất cứ điều ác hay sai trái nào. “Điều gì sai trái” rõ ràng, tự nhiên và giữ sắc thái đạo đức.
- source_word: οὐχ ἵνα
  choice: không phải để
  rationale: Giữ nguyên ý mục đích bị phủ định của οὐχ ἵνα.
- source_word: δόκιμοι φανῶμεν
  choice: chúng tôi tỏ ra là những người đã vượt qua thử thách
  rationale: δόκιμος nói về người đã được thử nghiệm và được công nhận; φανῶμεν nhấn mạnh việc tỏ ra hoặc được nhìn nhận như vậy. Cách dịch này cũng chuẩn bị rõ sự đối lập với ἀδόκιμοι.
- source_word: τὸ καλὸν ποιῆτε
  choice: anh chị em làm điều đúng
  rationale: Trong ngữ cảnh đạo đức, τὸ καλόν là điều tốt hoặc điều đúng. “Làm điều đúng” tự nhiên và diễn đạt được sức nặng thực hành của cụm từ.
- source_word: ἡμεῖς δὲ ὡς ἀδόκιμοι ὦμεν
  choice: còn chúng tôi thì có thể bị xem như những người không vượt qua thử thách
  rationale: ἀδόκιμος đối lập trực tiếp với δόκιμος, chỉ người không đạt qua sự thử nghiệm hoặc không được công nhận. ὡς cho phép sắc thái “như/bị xem như”; “có thể” phản ánh thức giả định của ὦμεν mà không biến câu thành lời khẳng định về sự kết án chung cuộc.
theological_decisions:
- issue: Ý nghĩa của cặp δόκιμοι và ἀδόκιμοι
  choice: Dịch nhất quán theo hình ảnh vượt qua hoặc không vượt qua thử thách, trong đó vế sau có thể nói đến việc bị xem như không đạt.
  alternative: “được chấp nhận / bị loại” hoặc “được chứng thực / không được chứng thực”.
  rationale: Ngữ cảnh nói đến việc thử nghiệm và sự công nhận chức vụ của Phao-lô. Cách dịch giữ sự đối lập từ vựng và căng thẳng của nguyên văn, nhưng không mặc nhiên hiểu ἀδόκιμοι là bị Đức Chúa Trời kết án đời đời.
- issue: Sắc thái của ὡς ἀδόκιμοι ὦμεν
  choice: “có thể bị xem như những người không vượt qua thử thách”
  alternative: “chúng tôi là những người không vượt qua thử thách”.
  rationale: ὡς có thể diễn tả tư cách, tình trạng hoặc vẻ bề ngoài. Ngữ cảnh đối chiếu với φανῶμεν khiến ý bị nhìn nhận như không đạt là hợp lý, nhưng chú thích vẫn bảo lưu cách hiểu trực tiếp hơn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” cho số nhiều ὑμᾶς; giữ hình ảnh thử nghiệm xuyên suốt để thể hiện quan hệ từ vựng giữa δόκιμοι và ἀδόκιμοι. Dấu chú thích [a] xuất hiện ngay sau mệnh đề mà nó giải thích.
