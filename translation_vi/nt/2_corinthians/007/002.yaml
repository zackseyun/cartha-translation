  to: Hãy dành chỗ cho chúng tôi[a]. Chúng tôi không làm hại ai, không làm hư hoại ai[b], không lợi dụng ai.
  rationale: 'Bản sửa chỉ điều chỉnh cách kết hợp từ ngữ cho tự nhiên và chính xác hơn: “làm hư hoại ai” chuyển đạt φθείρω với phạm vi nghĩa đủ rộng. Chú thích b được giới hạn vào các lựa chọn ngữ nghĩa trực tiếp của φθείρω; nhờ vậy không lẫn với ý ‘lợi dụng/trục lợi’ của πλεονεκτέω ở vế thứ ba. Các yếu tố khác, gồm ẩn dụ “dành chỗ” và phép lặp ba lần “không ... ai,” được giữ nguyên.'
  reviewer_model: gpt-5.6-terra
