review_pass:
  verdict: revise
  source_fidelity: Bản dịch giữ đúng cấu trúc mệnh lệnh rồi ba lời phủ định lặp lại của nguyên ngữ. “Hãy dành chỗ cho chúng tôi” chuyển đạt sát ẩn dụ quan hệ của Χωρήσατε ἡμᾶς. Tuy nhiên, “làm hư hỏng ai” không tự nhiên khi tân ngữ là con người; “làm hư hoại ai” diễn đạt φθείρω tự nhiên hơn mà vẫn giữ độ rộng nghĩa ‘corrupt/ruin’, không tự thu hẹp thành tổn hại đạo đức hay bóc lột.
  naturalness: Câu văn ngắn, nhịp ba vế rõ ràng và phù hợp tiếng Việt hiện đại. Thay “làm hư hỏng” bằng “làm hư hoại” tránh lối kết hợp từ ngữ gượng với “ai”.
  terminology: “Làm hại” phù hợp với ἀδικέω; “làm hư hoại” phù hợp với φθείρω; “lợi dụng” phù hợp với πλεονεκτέω. Không cần đưa “bóc lột” vào chú thích của φθείρω, vì đó không phải là lựa chọn từ vựng trực tiếp, ổn định cho động từ này trong câu này.
  issues:
  - severity: low
    issue: Cụm “không làm hư hỏng ai” chưa tự nhiên trong tiếng Việt hiện đại.
    rationale: “Hư hỏng” thường mô tả đồ vật hoặc phẩm chất/tình trạng của một người hơn là hành động trực tiếp ‘làm hư hỏng ai’. “Làm hư hoại ai” giữ nghĩa rộng của φθείρω và hợp ngữ cảnh hơn.
  - severity: medium
    issue: Chú thích b nêu “bóc lột” như một nghĩa khả dĩ của ἐφθείραμεν.
    rationale: φθείρω ở đây có trường nghĩa làm hư hoại, làm bại hoại hoặc hủy hoại. ‘Bóc lột’ thuộc rõ hơn về πλεονεκτέω ở vế kế tiếp; giữ nó trong chú thích b có thể làm mờ sự phân biệt từ vựng của nguyên ngữ.
