base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/002.yaml
  text: Make room for us[a]. We have wronged no one, corrupted no one[b], taken advantage of no one.
translation:
  language: vi
  text: Hãy dành chỗ cho chúng tôi[a]. Chúng tôi không làm hại ai, không làm hư hoại ai[b], không lợi dụng ai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Hãy đón nhận chúng tôi” hoặc “Hãy mở lòng với chúng tôi.” Nguyên ngữ nói theo nghĩa đen là “Hãy dành chỗ cho chúng tôi,” có lẽ tiếp nối hình ảnh về mối quan hệ trong 6:11–13.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “làm bại hoại” hoặc “hủy hoại.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Χωρήσατε
  choice: Hãy dành chỗ cho
  rationale: Động từ mệnh lệnh số nhiều mang nghĩa đen là “hãy dành chỗ”; trong mạch văn 6:11–13, đây là lời kêu gọi tái lập sự đón nhận trong quan hệ. Cách dịch giữ hình ảnh của nguyên ngữ mà không tự ý thêm “trong lòng” vào chính văn.
- source_word: ἡμᾶς
  choice: chúng tôi
  rationale: Tân ngữ trực tiếp của mệnh lệnh, chỉ Phao-lô và các cộng sự.
- source_word: οὐδένα
  choice: không ... ai
  rationale: Giữ lại cấu trúc phủ định được lặp ba lần để bảo toàn nhịp điệu và sức nhấn mạnh của lời biện bạch.
- source_word: ἠδικήσαμεν
  choice: làm hại
  rationale: ἀδικέω có nghĩa là đối xử bất công, gây tổn hại hoặc làm điều sai trái với người khác. “Làm hại” tự nhiên, cô đọng và không giới hạn loại tổn hại.
- source_word: ἐφθείραμεν
  choice: làm hư hỏng
  rationale: φθείρω có thể mang nghĩa làm hư hỏng, làm bại hoại hoặc hủy hoại. “Làm hư hỏng” giữ được độ rộng và sự mơ hồ của từ Hy Lạp, không thu hẹp riêng vào phương diện đạo đức hay tài chính.
- source_word: ἐπλεονεκτήσαμεν
  choice: lợi dụng
  rationale: πλεονεκτέω chỉ việc trục lợi hoặc chiếm phần hơn bằng cách khai thác người khác. “Lợi dụng” là cách nói hiện đại, rộng hơn “lừa gạt” và có thể bao hàm cả sự bóc lột tài chính lẫn quan hệ.
theological_decisions:
- issue: Bản chất lời kêu gọi Χωρήσατε ἡμᾶς
  choice: Giữ hình ảnh “dành chỗ”, hàm ý người Cô-rinh-tô mở lòng và tái đón nhận Phao-lô cùng các cộng sự
  alternative: Dịch trực tiếp hơn theo ý là “hãy đón nhận chúng tôi” hoặc “hãy mở lòng với chúng tôi”
  rationale: Mạch văn 6:11–13 nói đến tấm lòng rộng mở và tình cảm bị thu hẹp. Tuy vậy, nguyên câu này không có danh từ “lòng”, nên chính văn giữ ẩn dụ và chú thích nêu các cách hiểu.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Ba vế “không ... ai” được lặp lại để giữ cấu trúc tu từ của nguyên ngữ. “Hãy dành chỗ” duy trì ẩn dụ quan hệ; các cách diễn đạt rõ nghĩa hơn được đưa vào chú thích.
