id: 2CO.7.9
reference: 2 Corinthians 7:9
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: νῦν χαίρω, οὐχ ὅτι ἐλυπήθητε, ἀλλ’ ὅτι ἐλυπήθητε εἰς μετάνοιαν, ἐλυπήθητε γὰρ κατὰ θεόν, ἵνα ἐν μηδενὶ ζημιωθῆτε ἐξ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/009.yaml
  text: Now I rejoice[a], not because you were grieved, but because you were grieved into a change of mind; for you were grieved according to God[c][b], so that you might suffer no loss from us.
translation:
  language: vi
  text: Giờ đây tôi vui mừng, không phải vì anh chị em đã đau buồn, nhưng vì anh chị em đã đau buồn đến nỗi ăn năn[a]. Thật vậy, anh chị em đã đau buồn theo ý Đức Chúa Trời[b], để anh chị em không phải chịu bất cứ thiệt hại nào từ phía chúng tôi[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “đến sự thay đổi tâm trí.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể hiểu: “một cách phù hợp với Đức Chúa Trời” hoặc “theo cách Đức Chúa Trời muốn.”'
    reason: lexical_alternative
  - marker: c
    text: 'Hay: “không bị tổn hại chút nào vì chúng tôi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: νῦν χαίρω
  choice: Giờ đây tôi vui mừng
  rationale: Giữ rõ điểm nhìn hiện tại của Phao-lô và sắc thái tích cực của χαίρω, đồng thời dùng lối diễn đạt tự nhiên, trang trọng trong tiếng Việt.
- source_word: ἐλυπήθητε
  choice: anh chị em đã đau buồn / nỗi đau buồn ấy
  rationale: Diễn đạt trạng thái buồn đau mà không xác định quá mức tác nhân; cách chuyển thành danh ngữ ở lần lặp thứ hai giúp câu tiếng Việt tự nhiên mà vẫn giữ mạch ý lặp lại của nguyên văn.
- source_word: εἰς μετάνοιαν
  choice: đã đưa anh chị em đến sự ăn năn
  rationale: εἰς biểu thị hướng đi hoặc kết quả; 'đưa đến' truyền đạt sắc thái này tự nhiên hơn trong tiếng Việt. 'Sự ăn năn' giữ lực đạo đức và thuộc linh của μετάνοια trong ngữ cảnh.
- source_word: κατὰ θεόν
  choice: theo ý Đức Chúa Trời
  rationale: Cụm từ diễn tả nỗi buồn được định hướng hoặc đánh giá trong tương quan với Đức Chúa Trời. Cách dịch này dễ hiểu nhưng vẫn để chú thích nêu các sắc thái khả dĩ khác.
- source_word: ζημιωθῆτε
  choice: không phải chịu bất cứ thiệt hại nào
  rationale: Giữ ý bị tổn thất của động từ bị động và mục đích sau ἵνα, không giới hạn tổn thất vào tổn hại thể chất.
- source_word: ἐξ ἡμῶν
  choice: từ phía chúng tôi
  rationale: Giữ ý nguồn gốc của ἐξ, đồng thời tránh khẳng định quá mức rằng các sứ đồ trực tiếp gây hại.
theological_decisions:
- issue: Bản chất của μετάνοια
  choice: sự ăn năn
  alternative: sự thay đổi tâm trí hoặc tấm lòng
  rationale: Trong ngữ cảnh, từ này mang nội dung đạo đức và thuộc linh vượt quá một sự đổi ý thuần túy; chú thích vẫn bảo lưu nghĩa từ nguyên rộng hơn.
- issue: Quan hệ với Đức Chúa Trời trong κατὰ θεόν
  choice: theo ý Đức Chúa Trời
  alternative: phù hợp với Đức Chúa Trời; theo cách Đức Chúa Trời muốn
  rationale: Không biến cụm từ thành một thuật ngữ giáo lý cố định. Bản dịch chính diễn đạt tự nhiên mối liên hệ với tiêu chuẩn hoặc ý muốn của Đức Chúa Trời, còn chú thích bảo lưu độ rộng của tiếng Hy Lạp.
- issue: Ý nghĩa của ἐξ ἡμῶν
  choice: chịu thiệt hại từ phía chúng tôi
  alternative: bị tổn hại vì chúng tôi
  rationale: Giữ sự mơ hồ giữa nguồn phát sinh và nguyên nhân, thay vì quyết định dứt khoát cách thức Phao-lô và các cộng sự có thể liên quan đến thiệt hại ấy.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh chị em” để chỉ cộng đồng tín hữu được ngỏ lời; tránh lối văn cổ và tránh áp đặt một cách giải thích giáo phái lên các cụm từ thần học còn có độ mở.
