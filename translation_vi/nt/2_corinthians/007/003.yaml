source:
  edition: SBLGNT
  text: ⸂πρὸς κατάκρισιν οὐ⸃ λέγω, προείρηκα γὰρ ὅτι ἐν ταῖς καρδίαις ἡμῶν ἐστε εἰς τὸ συναποθανεῖν καὶ συζῆν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/003.yaml
  text: I do not say this to condemn you[a], for I have said before that you are in our hearts[b], to die together and to live together.
translation:
  language: vi
  text: Tôi nói điều này không nhằm kết án,[a] vì trước đây tôi đã nói rằng anh chị em ở trong lòng chúng tôi, để cùng chết và cùng sống.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “để kết án”, “nhằm kết án” hoặc “để định tội.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “đến mức cùng chết và cùng sống.” Tiếng Hy Lạp nhấn mạnh sự liên đới sâu xa trong cả cái chết lẫn sự sống.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸς κατάκρισιν οὐ λέγω
  choice: Tôi nói điều này không phải để kết án anh chị em
  rationale: Cụm πρός với đối cách κατάκρισιν chỉ mục đích hoặc hướng nhắm đến. Cách diễn đạt này tự nhiên trong tiếng Việt và làm rõ tân ngữ được hiểu theo văn cảnh, nhưng chú thích vẫn bảo lưu khả năng dịch sát hơn là “nhằm kết án” hay “để định tội”.
- source_word: προείρηκα
  choice: trước đây tôi đã nói
  rationale: Thì hoàn thành chỉ một lời đã nói trước đó vẫn còn hiệu lực trong hiện tại; trật tự này tự nhiên trong tiếng Việt hiện đại.
- source_word: ἐν ταῖς καρδίαις ἡμῶν ἐστε
  choice: anh chị em ở trong lòng chúng tôi
  rationale: Giữ hình ảnh καρδία và số nhiều ἡμῶν, diễn tả tình cảm sâu đậm cùng sự gắn bó nội tâm của Phao-lô và các cộng sự.
- source_word: εἰς τὸ συναποθανεῖν καὶ συζῆν
  choice: để cùng chết và cùng sống
  rationale: Giữ cấu trúc mục đích/kết quả của εἰς τό và sự song hành của hai động từ có tiền tố συν-, nhấn mạnh tình đoàn kết trong cả cái chết lẫn sự sống.
theological_decisions:
- issue: Có nên giải thích “cùng chết và cùng sống” như một thuật ngữ riêng về giao ước, hôn nhân hoặc sự hiệp nhất với Đấng Christ hay không
  choice: Giữ nguyên ngôn ngữ về sự gắn bó và đồng cam cộng khổ, không gán một phạm trù thần học hẹp
  alternative: Diễn giải rõ thành lòng trung thành giao ước hoặc sự dự phần trong Đấng Christ
  rationale: Bản văn bày tỏ tình cảm và sự liên đới sâu xa giữa Phao-lô với người Cô-rinh-tô, nhưng không xác định minh nhiên một phạm trù thần học chuyên biệt.
translation_notes:
  register: Văn phong trang trọng nhưng tự nhiên, dùng “anh chị em” cho đại từ số nhiều chỉ cộng đồng tín hữu. Giữ hình ảnh “ở trong lòng” và nhịp cân xứng “cùng chết và cùng sống” để bảo toàn sắc thái tình cảm mạnh của nguyên văn.
