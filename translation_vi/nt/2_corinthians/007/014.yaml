  source_fidelity: 'Cần sửa «khoe đôi điều»: εἴ τι mang nghĩa điều kiện bất định «có khoe gì/chút nào», không phải giới hạn nội dung thành «đôi điều». Bản sửa cũng diễn đạt rõ hơn cách thức «nói ... trong sự thật» của πάντα ἐν ἀληθείᾳ, đồng thời giữ kết quả xác nhận của ἀλήθεια ἐγενήθη.'
  naturalness: «Có khoe gì» và «lời khoe của chúng tôi với Tít đã tỏ ra là thật» tự nhiên, trang trọng và nhất quán hơn. «Bị hổ thẹn» vẫn giữ được sắc thái bị động của nguyên ngữ mà không gượng.
  terminology: Giữ nhất quán cặp «khoe/lời khoe» cho καυχάομαι/καύχησις. «Anh chị em» phù hợp với lối xưng hô hiện đại dành cho cộng đồng tín hữu. Giữ «Tít», dạng tên quen dùng trong tiếng Việt.
  issues:
