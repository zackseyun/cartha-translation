    issue: «có khoe đôi điều» dịch εἴ τι
    rationale: εἴ τι nghĩa là «nếu tôi có khoe gì/chút nào», với τι là đại từ bất định; «đôi điều» có thể gợi một số điều ít ỏi cụ thể, không có trong nguyên văn.
  - severity: low
    issue: «mọi điều chúng tôi nói ... đều đúng sự thật»
    rationale: Câu này có thể được hiểu chủ yếu là tính chân thực của nội dung, trong khi ἐν ἀληθείᾳ trực tiếp bổ nghĩa cho hành vi nói («cách chân thật»). Cách sửa giữ cả phạm vi «mọi điều» lẫn sắc thái trạng ngữ.
