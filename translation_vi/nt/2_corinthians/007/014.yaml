revisions:
- from: Vì nếu tôi có khoe đôi điều với Tít về anh chị em, thì tôi đã không bị hổ thẹn. Trái lại, cũng như mọi điều chúng tôi nói với anh chị em đều đúng sự thật, thì lời chúng tôi khoe với Tít[a] cũng đã được chứng tỏ là thật.
  to: Vì nếu tôi có khoe gì với Tít về anh chị em, thì tôi đã không bị hổ thẹn. Trái lại, cũng như chúng tôi đã nói với anh chị em mọi điều cách chân thật, thì lời khoe của chúng tôi với Tít[a] cũng đã tỏ ra là thật.
  rationale: Sửa duy nhất các chỗ cần thiết để phản ánh chính xác hơn εἴ τι và chức năng trạng ngữ của ἐν ἀληθείᾳ. Cách dịch «với Tít» theo ngữ cảnh là lời Phao-lô nói với Tít về người Cô-rinh-tô; chú thích giữ phương án «trước mặt Tít» mà không quyết đoán vượt quá mức chứng cứ của cụm ἐπὶ Τίτου.
