id: 2CO.7.14
reference: 2 Corinthians 7:14
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὅτι εἴ τι αὐτῷ ὑπὲρ ὑμῶν κεκαύχημαι, οὐ κατῃσχύνθην, ἀλλ’ ὡς πάντα ἐν ἀληθείᾳ ἐλαλήσαμεν ὑμῖν, οὕτως καὶ ἡ καύχησις ἡμῶν ⸀ἡ ἐπὶ Τίτου ἀλήθεια ἐγενήθη.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/014.yaml
  text: For if I have boasted to him at all about you[a], I was not put to shame; rather, just as we spoke everything to you in truth[b], so also our boasting to Titus proved true.
translation:
  language: vi
  text: Vì nếu tôi có khoe gì với Tít về anh chị em, thì tôi đã không bị hổ thẹn. Trái lại, cũng như chúng tôi đã nói với anh chị em mọi điều cách chân thật, thì lời khoe của chúng tôi với Tít[a] cũng đã tỏ ra là thật.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “lời khoe của chúng tôi trước mặt Tít”. Cụm Hy Lạp ἡ ἐπὶ Τίτου có thể được hiểu là lời khoe được nói với Tít hoặc trước mặt Tít.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κεκαύχημαι
  choice: có khoe
  rationale: Giữ sắc thái tu từ của καυχάομαι là “khoe/hãnh diện nói về”, thay vì làm nhẹ thành “tin tưởng”; ngữ cảnh cho thấy đây là lời khen đầy xác tín chứ không nhất thiết là kiêu ngạo tội lỗi.
- source_word: ὑπὲρ ὑμῶν
  choice: về anh chị em
  rationale: Trong ngữ cảnh, cụm này chỉ nội dung lời Phao-lô nói với Tít về tín hữu Cô-rinh-tô.
- source_word: οὐ κατῃσχύνθην
  choice: tôi đã không bị hổ thẹn
  rationale: Dạng bị động được giữ lại, diễn tả rằng lời khoe của Phao-lô không bị thực tế làm cho sai hỏng hoặc khiến ông phải hổ thẹn.
- source_word: πάντα ἐν ἀληθείᾳ ἐλαλήσαμεν
  choice: mọi điều chúng tôi nói với anh chị em đều đúng sự thật
  rationale: Diễn đạt tự nhiên trong tiếng Việt, đồng thời giữ phạm vi rộng của πάντα và ý nghĩa chỉ cách thức của ἐν ἀληθείᾳ.
- source_word: ἡ καύχησις ἡμῶν
  choice: lời chúng tôi khoe
  rationale: Giữ liên hệ từ vựng với động từ κεκαύχημαι ở đầu câu, nhưng dùng cách diễn đạt tự nhiên hơn “sự khoe mình” trong tiếng Việt.
- source_word: ἡ ἐπὶ Τίτου
  choice: với Tít
  rationale: Cụm ἐπί với sở hữu cách có thể mang nghĩa “trước mặt Tít” hoặc chỉ lời khoe hướng đến Tít; ngữ cảnh ủng hộ cách hiểu đây là điều Phao-lô đã nói với Tít.
- source_word: ἀλήθεια ἐγενήθη
  choice: đã được chứng tỏ là thật
  rationale: Truyền đạt thành ngữ rằng lời khoe đã được thực tế xác nhận, tránh cách dịch cứng “đã trở thành sự thật” có thể gợi ý rằng trước đó nó chưa thật.
- source_word: ὅτι
  choice: Vì
  rationale: Dẫn vào lời giải thích cho câu trước và phù hợp với mạch lập luận.
theological_decisions:
- issue: Tính chất của việc Phao-lô “khoe”
  choice: Giữ từ “khoe” như một lời khen và sự hãnh diện có cơ sở trong ngữ cảnh.
  alternative: Dịch là “tin tưởng” hoặc “hãnh diện” để tránh sắc thái tiêu cực.
  rationale: καυχάομαι và καύχησις trong các thư Phao-lô có thể chỉ sự tự hào hoặc lời khen đầy xác tín, không mặc nhiên là kiêu ngạo tội lỗi. Bản dịch giữ sức mạnh của từ gốc và để ngữ cảnh xác định giá trị đạo đức.
- issue: Ý nghĩa của ἀλήθεια ἐγενήθη
  choice: Lời khoe được thực tế chứng tỏ là thật.
  alternative: Lời khoe “trở thành sự thật”.
  rationale: Cách chọn không hàm ý rằng lời Phao-lô ban đầu là không thật rồi mới trở nên thật; trọng tâm là sự xác nhận qua phản ứng thực tế của người Cô-rinh-tô.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” để diễn đạt đại từ số nhiều ὑμῶν dành cho cộng đồng tín hữu; giữ cặp từ “khoe/lời khoe” nhằm phản ánh sự lặp từ trong nguyên văn.
