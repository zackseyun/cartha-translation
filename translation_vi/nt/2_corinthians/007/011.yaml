source:
  edition: SBLGNT
  text: ἰδοὺ γὰρ αὐτὸ τοῦτο τὸ κατὰ θεὸν ⸀λυπηθῆναι πόσην κατειργάσατο ὑμῖν σπουδήν, ἀλλὰ ἀπολογίαν, ἀλλὰ ἀγανάκτησιν, ἀλλὰ φόβον, ἀλλὰ ἐπιπόθησιν, ἀλλὰ ζῆλον, ἀλλὰ ἐκδίκησιν· ἐν παντὶ συνεστήσατε ἑαυτοὺς ἁγνοὺς ⸀εἶναι τῷ πράγματι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/011.yaml
  text: 'For see what earnestness this very grief according to God has produced in you: but also a defense[a], but also indignation, but also fear, but also longing, but also zeal, but also vindication[c][b]. In every way you proved yourselves to be pure in the matter.'
translation:
  language: vi
  text: 'Thật vậy, hãy xem: chính nỗi buồn theo ý Đức Chúa Trời[a] ấy đã tạo nên nơi anh em biết bao sự sốt sắng; lại còn sự biện hộ[b], lại còn sự phẫn nộ, lại còn sự sợ hãi, lại còn sự mong mỏi, lại còn lòng nhiệt thành, lại còn sự trừng phạt[c]! Về mọi phương diện, anh em đã chứng tỏ mình trong sạch trong vụ việc ấy.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “nỗi buồn đẹp lòng Đức Chúa Trời” hoặc “nỗi buồn phù hợp với Đức Chúa Trời.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “nỗ lực chứng tỏ mình vô can.”'
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “sự báo ứng,” “sự thực thi công lý” hoặc “sự minh oan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ γὰρ
  choice: Vì hãy xem
  rationale: Giữ cả ý giải thích của γάρ và lời kêu gọi chú ý đầy nhấn mạnh của ἰδού, đồng thời vẫn tự nhiên trong tiếng Việt hiện đại.
- source_word: τὸ κατὰ θεὸν λυπηθῆναι
  choice: chính nỗi buồn theo ý Đức Chúa Trời ấy
  rationale: Chuyển động từ nguyên mẫu có mạo từ thành danh ngữ “nỗi buồn”; “theo ý Đức Chúa Trời” giữ quan hệ chuẩn mực của κατὰ θεόν mà không giản lược thành một tính từ thần học.
- source_word: πόσην κατειργάσατο ὑμῖν σπουδήν
  choice: đã tạo nên nơi anh em biết bao sự sốt sắng
  rationale: κατεργάζομαι chỉ việc tạo ra một kết quả; σπουδή ở đây là thái độ nghiêm túc, khẩn thiết được biểu lộ trong phản ứng của họ.
- source_word: ἀλλὰ
  choice: lại còn
  rationale: Các lần lặp ἀλλά mang tính gia tăng và nhấn mạnh hơn là đối lập. Việc lặp “lại còn” tái hiện nhịp tu từ của câu Hy Lạp.
- source_word: ἀπολογίαν
  choice: sự tự biện giải
  rationale: Diễn tả phản ứng tự trình bày lời bênh vực hoặc chứng minh mình không đồng lõa; lựa chọn này không khẳng định trước rằng lời biện giải ấy tự nó đã đủ để minh oan.
- source_word: ἀγανάκτησιν
  choice: sự phẫn nộ
  rationale: Chỉ sự bất bình mạnh mẽ, có sắc thái đạo đức, nhưng bản văn không nêu rõ đối tượng của sự phẫn nộ.
- source_word: φόβον
  choice: sự sợ hãi
  rationale: Giữ nghĩa trực tiếp và để ngỏ đối tượng của nỗi sợ, vì câu Hy Lạp không nói rõ đó là sợ Đức Chúa Trời, Phao-lô hay hậu quả của sự việc.
- source_word: ἐπιπόθησιν
  choice: sự mong mỏi
  rationale: Thể hiện ước muốn sâu xa, có thể hướng đến việc khôi phục mối quan hệ, nhưng không đưa đối tượng suy đoán ấy vào chính văn.
- source_word: ζῆλον
  choice: lòng nhiệt thành
  rationale: Giữ cường độ tích cực của từ và phân biệt với σπουδή, được dịch là “sự sốt sắng” ở đầu danh sách.
- source_word: ἐκδίκησιν
  choice: sự thực thi công lý
  rationale: Từ này có thể chỉ sự trừng phạt, báo ứng hoặc hành động làm cho điều sai trái được xử lý đúng đắn. “Thực thi công lý” giữ nét hành động sửa lại điều sai mà không hàm ý trả thù cá nhân.
- source_word: ἐν παντὶ συνεστήσατε ἑαυτοὺς ἁγνοὺς εἶναι τῷ πράγματι
  choice: Về mọi phương diện, anh em đã chứng tỏ mình trong sạch trong vụ việc ấy
  rationale: συνίστημι mang nghĩa chứng minh hay cho thấy; ἁγνός được giữ bằng “trong sạch”, vừa có sắc thái đạo đức vừa không tuyệt đối hóa thành tuyên bố rằng họ chưa từng liên quan đến sự việc.
theological_decisions:
- issue: Ý nghĩa của κατὰ θεόν
  choice: theo ý Đức Chúa Trời
  alternative: đẹp lòng Đức Chúa Trời; phù hợp với Đức Chúa Trời
  rationale: Cụm từ có thể nói đến nỗi buồn phù hợp với tiêu chuẩn hoặc ý muốn của Đức Chúa Trời. Cách dịch chính giữ sự liên hệ ấy mà không biến nó thành nhãn “tin kính” vốn có thể che đi sắc thái chuẩn mực.
- issue: Sắc thái của ἐκδίκησις trong bối cảnh ăn năn
  choice: sự thực thi công lý
  alternative: sự trừng phạt; sự báo ứng; sự minh oan
  rationale: Ngữ cảnh cho thấy một phản ứng quyết liệt nhằm xử lý điều sai trái, nhưng từ Hy Lạp không tự xác định cụ thể ai bị phạt hoặc ai được minh oan. Chính văn dùng cách diễn đạt bao quát, còn chú thích bảo lưu các khả năng.
- issue: Phạm vi của lời tuyên bố ἁγνούς
  choice: trong sạch trong vụ việc ấy
  alternative: vô can trong vụ việc ấy
  rationale: “Trong sạch” giữ từ ngữ đạo đức của nguyên văn và không buộc câu phải có nghĩa rằng người Cô-rinh-tô hoàn toàn không liên quan; trọng tâm có thể là phản ứng đúng đắn của họ sau khi nhận thư.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, dùng cấu trúc lặp “lại còn” để giữ nhịp dồn dập của sáu lần ἀλλά. “Vụ việc ấy” dễ hiểu hơn lối dịch sát “trong vấn đề,” còn “trong sạch” bảo lưu sắc thái của ἁγνός. Tất cả dấu chú thích [a], [b], [c] đều được đặt ngay sau cụm từ liên quan trong chính văn.
