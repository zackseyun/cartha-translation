  naturalness: Câu văn trang trọng, hiện đại và nhịp lặp “lại còn” tái hiện tốt phép liệt kê. “Vì hãy xem” và “sự tự biện giải” hơi gượng trong tiếng Việt hiện đại; “Thật vậy, hãy xem” và “sự biện hộ” tự nhiên hơn mà vẫn chính xác.
  terminology: “Đức Chúa Trời,” “nỗi buồn theo ý Đức Chúa Trời,” “phẫn nộ,” “sợ hãi,” “lòng nhiệt thành,” và “trong sạch trong vụ việc ấy” đều phù hợp. Chú thích nên giữ các khả năng từ vựng mà không biến “minh oan/vindication” thành nghĩa ưu tiên của ἐκδίκησις.
