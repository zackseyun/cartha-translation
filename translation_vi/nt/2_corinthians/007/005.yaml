source:
  edition: SBLGNT
  text: Καὶ γὰρ ἐλθόντων ἡμῶν εἰς Μακεδονίαν οὐδεμίαν ⸀ἔσχηκεν ἄνεσιν ἡ σὰρξ ἡμῶν, ἀλλ’ ἐν παντὶ θλιβόμενοι— ἔξωθεν μάχαι, ἔσωθεν φόβοι—
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/005.yaml
  text: For even when we came into Macedonia[a], our flesh had no rest, but we were afflicted in every way—conflicts on the outside, fears on the inside—
translation:
  language: vi
  text: Vì khi chúng tôi đến Ma-xê-đô-ni-a, xác thịt chúng tôi[a] không hề được nghỉ ngơi; trái lại, chúng tôi bị khốn khổ mọi bề—bên ngoài là những xung đột, bên trong là những nỗi sợ hãi—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “chính chúng tôi cũng không hề được nghỉ ngơi.” Nguyên văn Hy Lạp là “xác thịt chúng tôi,” một cách nói chỉ con người trong sự yếu đuối và khốn khó của đời sống thân xác.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ γὰρ
  choice: Vì ngay cả
  rationale: Cụm từ vừa nối câu này với mạch giải thích trước đó, vừa tạo sắc thái nhấn mạnh; cách dịch này giữ được cả hai chức năng trong tiếng Việt tự nhiên.
- source_word: ἐλθόντων ἡμῶν εἰς Μακεδονίαν
  choice: khi chúng tôi đến Ma-xê-đô-ni-a
  rationale: Kết cấu sở hữu cách tuyệt đối mang ý nghĩa thời gian. “Đến” diễn đạt tự nhiên chuyển động hướng vào vùng Ma-xê-đô-ni-a mà không gượng ép.
- source_word: οὐδεμίαν ἔσχηκεν ἄνεσιν
  choice: cũng không hề được nghỉ ngơi
  rationale: ἄνεσις chỉ sự nghỉ ngơi, nhẹ nhõm hay thoát khỏi áp lực. “Không hề được nghỉ ngơi” phù hợp với tình cảnh căng thẳng cả thể chất lẫn tinh thần.
- source_word: ἡ σὰρξ ἡμῶν
  choice: xác thịt chúng tôi
  rationale: Giữ hình ảnh cụ thể của nguyên ngữ, ở đây chỉ con người trong tình trạng hữu thân, yếu đuối và khốn khó, chứ không mang nghĩa “bản tính tội lỗi.” Chú thích cung cấp cách diễn đạt thuần Việt hơn.
- source_word: ἀλλ’ ἐν παντὶ θλιβόμενοι
  choice: trái lại, chúng tôi bị khốn khổ mọi bề
  rationale: Phân từ bị động θλιβόμενοι diễn tả việc chịu sức ép hoặc hoạn nạn; “khốn khổ mọi bề” tự nhiên, có sức nặng và giữ phạm vi rộng của ἐν παντί.
- source_word: ἔξωθεν μάχαι
  choice: bên ngoài là những xung đột
  rationale: μάχαι có thể là các cuộc tranh đấu, cãi vã hoặc xung đột. Trong ngữ cảnh này, “xung đột” không giới hạn ý nghĩa vào giao chiến thể chất và làm rõ áp lực đến từ bên ngoài.
- source_word: ἔσωθεν φόβοι
  choice: bên trong là những nỗi sợ hãi
  rationale: φόβοι là số nhiều, chỉ những nỗi sợ hay lo âu. Cấu trúc song song “bên ngoài… bên trong…” giữ nguyên thế đối lập cô đọng của câu Hy Lạp.
theological_decisions:
- issue: Cách dịch σάρξ
  choice: xác thịt chúng tôi
  alternative: chính chúng tôi; thân xác chúng tôi
  rationale: Trong câu này, σάρξ không chỉ bản tính tội lỗi hay một nguyên lý đạo đức đối nghịch với Thánh Linh, mà chỉ con người trong sự yếu đuối hữu thân. Vì vậy, bản văn chính giữ hình ảnh “xác thịt,” còn chú thích nêu cách hiểu tự nhiên hơn mà không xóa bỏ sắc thái của nguyên ngữ.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. Cặp diễn đạt “bên ngoài… bên trong…” giữ nhịp đối xứng của nguyên văn; dấu gạch ngang cuối câu được giữ vì ý văn tiếp tục sang câu sau.
