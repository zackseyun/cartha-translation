    rationale: “Ngay cả” thường biểu thị nhượng bộ hoặc trường hợp cực điểm. Καὶ γάρ trong câu này có chức năng nối/giải thích (“vì quả thật”), còn phân từ ἐλθόντων là mốc thời gian; “Vì khi” truyền đạt mạch văn chính xác và tự nhiên hơn.
  revised_text: Vì khi chúng tôi đến Ma-xê-đô-ni-a, xác thịt chúng tôi[a] không hề được nghỉ ngơi; trái lại, chúng tôi bị khốn khổ mọi bề—bên ngoài là những xung đột, bên trong là những nỗi sợ hãi—
