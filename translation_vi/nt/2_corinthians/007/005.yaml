revisions:
- from: Vì ngay cả khi chúng tôi đến Ma-xê-đô-ni-a, xác thịt chúng tôi[a] cũng không hề được nghỉ ngơi; trái lại, chúng tôi bị khốn khổ mọi bề—bên ngoài là những xung đột, bên trong là những nỗi sợ hãi—
  to: Vì khi chúng tôi đến Ma-xê-đô-ni-a, xác thịt chúng tôi[a] không hề được nghỉ ngơi; trái lại, chúng tôi bị khốn khổ mọi bề—bên ngoài là những xung đột, bên trong là những nỗi sợ hãi—
  rationale: Chỉ sửa “Vì ngay cả khi” thành “Vì khi” để không thêm sắc thái nhượng bộ mà nguyên văn không đòi hỏi. Giữ nguyên các lựa chọn còn lại, gồm “xác thịt” cùng chú thích, để bảo tồn cách diễn đạt của σάρξ và không áp đặt một cách hiểu thần học.
