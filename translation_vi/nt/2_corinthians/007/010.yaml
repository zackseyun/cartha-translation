source:
  edition: SBLGNT
  text: ἡ γὰρ κατὰ θεὸν λύπη μετάνοιαν εἰς σωτηρίαν ἀμεταμέλητον ⸀ἐργάζεται· ἡ δὲ τοῦ κόσμου λύπη θάνατον κατεργάζεται.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/010.yaml
  text: For godly sorrow produces repentance leading to salvation without regret[b][a], but worldly sorrow produces death.
translation:
  language: vi
  text: Vì nỗi buồn theo ý Đức Chúa Trời[a] sinh ra sự ăn năn không đáng hối tiếc, dẫn đến sự cứu rỗi[b]; còn nỗi buồn của thế gian sinh ra sự chết.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “nỗi buồn theo Đức Chúa Trời.” Cụm tiếng Hy Lạp sát nghĩa là “nỗi buồn theo Đức Chúa Trời.”
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “sinh ra sự ăn năn dẫn đến sự cứu rỗi, không đáng hối tiếc.” Tính từ “không đáng hối tiếc” về mặt ngữ pháp bổ nghĩa cho “sự ăn năn”; vị trí của nó trong tiếng Hy Lạp sau cụm “dẫn đến sự cứu rỗi” có thể làm phạm vi diễn đạt kém trực tiếp hơn.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ θεὸν
  choice: theo ý Đức Chúa Trời
  rationale: Cụm này mô tả nỗi buồn phù hợp với Đức Chúa Trời hoặc theo chuẩn mực của Ngài. Cách dịch này tự nhiên trong tiếng Việt và tránh hiểu đơn thuần là cảm xúc mang tính tôn giáo.
- source_word: λύπη
  choice: nỗi buồn
  rationale: Diễn đạt tự nhiên trạng thái đau buồn trong cả hai vế và giữ được phép đối lập của câu.
- source_word: μετάνοιαν
  choice: sự ăn năn
  rationale: Trong ngữ cảnh này, từ chỉ sự thay đổi hướng suy nghĩ và đời sống về mặt đạo đức, tâm linh; “sự ăn năn” là cách diễn đạt quen thuộc và đầy đủ hơn “đổi ý”.
- source_word: εἰς σωτηρίαν
  choice: dẫn đến sự cứu rỗi
  rationale: εἰς biểu thị hướng tới hoặc kết quả; cách dịch này giữ được tính định hướng mà không xác định quá mức cơ chế nhân quả.
- source_word: ἀμεταμέλητον
  choice: không phải hối tiếc
  rationale: Tính từ có thể gắn trực tiếp với sự ăn năn, hoặc được hiểu rộng hơn về toàn bộ sự ăn năn dẫn đến cứu rỗi. Cách đặt trong câu chính giữ trật tự ý nghĩa, còn chú thích bảo tồn khả năng cú pháp gần hơn.
- source_word: ἐργάζεται
  choice: sinh ra
  rationale: Động từ nói đến việc tạo nên một kết quả; “sinh ra” tự nhiên và duy trì cấu trúc song song.
- source_word: τοῦ κόσμου
  choice: của thế gian
  rationale: Giữ khá sát cấu trúc sở hữu của tiếng Hy Lạp và đối lập rõ với nỗi buồn theo ý Đức Chúa Trời.
- source_word: θάνατον
  choice: sự chết
  rationale: Dịch trực tiếp và không thu hẹp ý nghĩa thành riêng sự chết thể chất, tâm linh hay cánh chung.
- source_word: κατεργάζεται
  choice: sinh ra
  rationale: Dù hình thức động từ mạnh hơn ἐργάζεται đôi chút, trong câu này hai từ gần nghĩa; dùng cùng một cách dịch bảo tồn thế đối xứng tu từ.
theological_decisions:
- issue: Hai loại nỗi buồn đối lập nhau
  choice: “nỗi buồn theo ý Đức Chúa Trời” đối lập với “nỗi buồn của thế gian”
  alternative: “nỗi buồn tin kính” đối lập với “nỗi buồn thế tục”
  rationale: Cách chọn giữ rõ quan hệ với Đức Chúa Trời và thế gian mà không giải thích thêm bản chất của từng loại nỗi buồn ngoài điều bản văn nói.
- issue: Mối liên hệ giữa sự ăn năn và sự cứu rỗi
  choice: “sự ăn năn dẫn đến sự cứu rỗi”
  alternative: “sự ăn năn để được cứu rỗi” hoặc “sự ăn năn đem lại sự cứu rỗi”
  rationale: Cách dịch thể hiện hướng đi hoặc kết quả của εἰς mà không biến câu thành một công thức giáo phái về cơ chế cứu rỗi.
- issue: Phạm vi nghĩa của “sự chết”
  choice: Giữ nguyên “sự chết” mà không định nghĩa thêm
  alternative: “sự chết thuộc linh”
  rationale: Bản văn không xác định rõ đây là sự chết thể chất, tâm linh hay chung cuộc; bản dịch cần bảo tồn độ rộng ấy.
- issue: Từ ἀμεταμέλητον bổ nghĩa cho thành phần nào
  choice: Đặt “không phải hối tiếc” sau cụm dẫn đến sự cứu rỗi, để ngỏ phạm vi liên hệ
  alternative: “sinh ra sự ăn năn không phải hối tiếc, dẫn đến sự cứu rỗi”
  rationale: Tiếng Hy Lạp cho phép hiểu tính từ gắn gần hơn với “sự ăn năn”, nhưng vị trí và phạm vi diễn đạt có độ mở. Chú thích nêu cách hiểu trực tiếp hơn thay vì âm thầm giải quyết sự mơ hồ.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Trời,” “sự ăn năn,” “sự cứu rỗi” và “sự chết” theo lối diễn đạt Kinh Thánh thông dụng, nhưng giữ cấu trúc câu tự nhiên. Hai động từ kết quả được dịch đồng nhất là “sinh ra” để bảo tồn tính song song.
