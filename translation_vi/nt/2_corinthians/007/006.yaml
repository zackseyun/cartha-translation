id: 2CO.7.6
reference: 2 Corinthians 7:6
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀλλ’ ὁ παρακαλῶν τοὺς ταπεινοὺς παρεκάλεσεν ἡμᾶς ὁ θεὸς ἐν τῇ παρουσίᾳ Τίτου·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/006.yaml
  text: But God[a], who comforts the humble[b], comforted us by the coming of Titus.
translation:
  language: vi
  text: Nhưng Đức Chúa Trời, Đấng an ủi những người ngã lòng[a], đã an ủi chúng tôi qua việc Tít đến[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “những người thấp hèn” hoặc “những người bị hạ xuống.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “qua sự hiện diện của Tít.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: Nhưng
  rationale: Diễn tả sự tương phản với cảnh khốn khó được nói đến ngay trước đó, đồng thời tự nhiên và gọn trong tiếng Việt.
- source_word: ὁ παρακαλῶν
  choice: Đấng an ủi
  rationale: Phân từ hiện tại có chức năng như danh xưng, mô tả hành động đặc trưng của Đức Chúa Trời. “An ủi” hợp với bối cảnh hoạn nạn và giữ được liên hệ từ vựng với παρεκάλεσεν.
- source_word: τοὺς ταπεινοὺς
  choice: những người ngã lòng
  rationale: Trong bối cảnh này, từ chỉ những người bị hoàn cảnh làm cho hạ xuống hoặc suy sụp. “Ngã lòng” truyền đạt tự nhiên sắc thái đau buồn cần được an ủi; chú thích giữ lại các khả năng về địa vị thấp hèn hoặc tình trạng bị hạ xuống.
- source_word: παρεκάλεσεν
  choice: đã an ủi
  rationale: Động từ chính ở thì aorist tương ứng với παρακαλῶν; lặp lại “an ủi” bảo toàn mối liên hệ có chủ ý trong nguyên văn.
- source_word: ἐν τῇ παρουσίᾳ
  choice: qua việc … đến
  rationale: παρουσία có thể chỉ sự đến hoặc sự hiện diện. Ở đây, sự xuất hiện của Tít là phương tiện Đức Chúa Trời dùng để an ủi Phao-lô và các bạn đồng hành; cách diễn đạt này tự nhiên trong tiếng Việt.
- source_word: Τίτου
  choice: Tít
  rationale: Dạng tên quen dùng và tự nhiên trong truyền thống Kinh Thánh tiếng Việt.
- source_word: ὁ θεὸς
  choice: Đức Chúa Trời
  rationale: Giữ chủ thể được nêu rõ trong nguyên văn và dùng danh xưng trang trọng, phổ thông trong tiếng Việt Cơ Đốc.
theological_decisions:
- issue: Ý nghĩa của τοὺς ταπεινοὺς trong văn cảnh
  choice: những người ngã lòng
  alternative: những người thấp hèn; những người bị hạ xuống
  rationale: Văn cảnh nhấn mạnh cảnh khốn khó và sự an ủi, nên “ngã lòng” là cách diễn đạt tự nhiên; tuy nhiên, từ Hy Lạp cũng có thể nói đến những người ở địa vị thấp hoặc bị hoàn cảnh hạ xuống. Chú thích duy trì độ rộng nghĩa thay vì biến câu thành một khẳng định riêng về đức tính khiêm nhường.
- issue: Sắc thái của ἐν τῇ παρουσίᾳ Τίτου
  choice: qua việc Tít đến
  alternative: qua sự hiện diện của Tít
  rationale: Cấu trúc có thể nhấn mạnh cả việc Tít đến lẫn sự có mặt của ông. Bản chính chọn nghĩa sự đến phù hợp mạch kể, còn chú thích bảo lưu nghĩa “sự hiện diện”.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Cấu trúc “Đấng an ủi … đã an ủi” cố ý giữ sự lặp từ của nguyên văn. Hai chú thích bảo lưu phạm vi nghĩa của ταπεινός và παρουσία.
