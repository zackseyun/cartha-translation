  source_fidelity: Bản dịch phản ánh đúng quan hệ đối nghịch của ἀλλ’, danh xưng phân từ hiện tại «Đấng an ủi», và sự lặp có chủ ý giữa παρακαλῶν / παρεκάλεσεν bằng «an ủi». «Những người ngã lòng» phù hợp văn cảnh người bị hoạn nạn, hạ xuống tinh thần, mà không biến từ này thành khẳng định chỉ về địa vị xã hội. «Qua việc Tít đến» diễn đạt tự nhiên sắc thái sự đến/đến hiện diện của ἐν τῇ παρουσίᾳ Τίτου.
