  terminology: «Đức Chúa Trời», «Đấng», «an ủi», và tên «Tít» đều là các cách dùng phổ thông, trang trọng, và nhất quán với văn phong Cơ Đốc tiếng Việt. Các chú thích giữ được những khả năng nghĩa chính của ταπεινούς và παρουσία mà không áp đặt một cách hiểu giáo phái.
