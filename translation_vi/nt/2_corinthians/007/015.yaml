language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ τὰ σπλάγχνα αὐτοῦ περισσοτέρως εἰς ὑμᾶς ἐστιν ἀναμιμνῃσκομένου τὴν πάντων ὑμῶν ὑπακοήν, ὡς μετὰ φόβου καὶ τρόμου ἐδέξασθε αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/015.yaml
  text: And his affection for you is even greater as he remembers the obedience of all of you[a], how you received him with fear and trembling.
translation:
  language: vi
  text: Và tình cảm sâu đậm của người đối với anh chị em lại càng sâu đậm hơn khi người nhớ lại sự vâng phục của tất cả anh chị em, vì anh chị em đã tiếp đón người với sự sợ hãi và run rẩy.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “với lòng kính trọng và run rẩy”; cụm “sợ hãi và run rẩy” là một lối nói của Phao-lô, diễn tả thái độ đáp ứng nghiêm túc và khiêm nhường.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σπλάγχνα
  choice: tình cảm sâu đậm
  rationale: Danh từ này theo nghĩa đen chỉ nội tạng, nhưng được dùng theo lối thành ngữ để nói đến tình cảm sâu xa, trìu mến. Cách dịch này tự nhiên trong tiếng Việt và giữ được sức nặng tình cảm.
- source_word: περισσοτέρως
  choice: càng thêm dạt dào
  rationale: Trạng từ so sánh nhấn mạnh mức độ tình cảm của Tít đối với cộng đoàn gia tăng; cách diễn đạt này giữ sắc thái tăng tiến mà vẫn tự nhiên.
- source_word: εἰς ὑμᾶς
  choice: dành cho anh chị em
  rationale: Giới từ diễn tả hướng tình cảm về phía người Cô-rinh-tô. “Dành cho” phù hợp với cách nói tự nhiên trong tiếng Việt.
- source_word: ἀναμιμνῃσκομένου
  choice: khi người nhớ lại
  rationale: Phân từ diễn tả hoàn cảnh đi kèm với tình cảm gia tăng của Tít; “khi… nhớ lại” giữ quan hệ này rõ ràng.
- source_word: ὑπακοήν
  choice: sự vâng phục
  rationale: Đây là nghĩa trực tiếp của danh từ, trong ngữ cảnh chỉ việc cộng đoàn đáp ứng và làm theo lời chỉ dẫn của sứ đồ.
- source_word: πάντων ὑμῶν
  choice: của tất cả anh chị em
  rationale: Giữ nguyên sự nhấn mạnh rằng toàn thể cộng đoàn đã vâng phục.
- source_word: μετὰ φόβου καὶ τρόμου
  choice: với lòng kính sợ và run rẩy
  rationale: Giữ hai yếu tố của thành ngữ Phao-lô, đồng thời “lòng kính sợ” tránh gợi ý đơn thuần về nỗi kinh hoàng; chú thích bảo lưu phạm vi nghĩa.
- source_word: ἐδέξασθε
  choice: đã tiếp đón
  rationale: Trong ngữ cảnh nói về cách cộng đoàn đón nhận Tít, “tiếp đón” truyền đạt tự nhiên cả hành động đón tiếp lẫn thái độ chấp nhận.
- source_word: αὐτόν
  choice: người
  rationale: Đại từ chỉ Tít được giữ thay vì lặp tên; “người” là đại từ trang trọng, phù hợp văn phong Kinh Thánh hiện đại.
theological_decisions:
- issue: Ý nghĩa của “kính sợ và run rẩy” khi người Cô-rinh-tô tiếp đón Tít
  choice: Giữ thành ngữ như một cách diễn tả thái độ nghiêm túc, khiêm nhường và kính trọng
  alternative: Hiểu theo nghĩa sợ hãi theo nghĩa đen hoặc kính úy
  rationale: Nguyên văn bảo lưu cả φόβος và τρόμος. Trong cách dùng của Phao-lô, cụm từ thường diễn tả sự nghiêm túc và khiêm nhường sâu sắc chứ không nhất thiết là nỗi kinh hoàng; bản dịch không xóa bỏ độ căng nghĩa này và giải thích ngắn trong chú thích.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh chị em” cho đại từ số nhiều chỉ cộng đoàn và “người” để chỉ Tít. Giữ cấu trúc một câu của nguyên văn nhưng điều chỉnh trật tự từ cho tự nhiên.
