id: 2CO.7.12
reference: 2 Corinthians 7:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἄρα εἰ καὶ ἔγραψα ὑμῖν, οὐχ ⸀ἕνεκεν τοῦ ἀδικήσαντος, ⸀οὐδὲ ⸁ἕνεκεν τοῦ ἀδικηθέντος, ἀλλ’ ⸀1ἕνεκεν τοῦ φανερωθῆναι τὴν σπουδὴν ὑμῶν τὴν ὑπὲρ ἡμῶν πρὸς ὑμᾶς ἐνώπιον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/012.yaml
  text: So even if I wrote to you[a], it was not because of the one who did wrong, nor because of the one who was wronged[b], but so that your earnestness for us might be made known among you before God.
translation:
  language: vi
  text: Vì vậy, dù tôi đã viết cho anh chị em, ấy không phải vì người đã làm điều bất công, cũng không phải vì người bị đối xử bất công, nhưng để lòng sốt sắng của anh chị em dành cho chúng tôi được bày tỏ giữa anh chị em trước mặt Đức Chúa Trời.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Một số thủ bản chép: “nhưng để lòng sốt sắng của chúng tôi dành cho anh chị em được bày tỏ giữa anh chị em trước mặt Đức Chúa Trời.”'
    reason: textual_variant
lexical_decisions:
- source_word: ἄρα εἰ καὶ
  choice: Vì vậy, dù
  rationale: “Vì vậy” giữ quan hệ suy luận của ἄρα với phần trước; “dù” diễn đạt tự nhiên sắc thái nhượng bộ của εἰ καὶ.
- source_word: ἔγραψα ὑμῖν
  choice: tôi đã viết cho anh chị em
  rationale: Thì aorist chỉ bức thư Phao-lô đã viết trước đó; “anh chị em” là cách xưng hô số nhiều, bao quát và tự nhiên trong tiếng Việt hiện đại.
- source_word: οὐχ ἕνεκεν τοῦ ἀδικήσαντος
  choice: ấy không phải vì người đã làm điều sai trái
  rationale: Giữ nghĩa nguyên nhân/mục đích của ἕνεκεν và ý động từ của phân từ ἀδικήσαντος mà không xác định quá mức bản chất sự việc.
- source_word: οὐδὲ ἕνεκεν τοῦ ἀδικηθέντος
  choice: cũng không phải vì người bị đối xử sai trái
  rationale: Phản ánh phân từ thụ động và duy trì kết cấu song song với vế trước.
- source_word: ἀλλ’ ἕνεκεν τοῦ φανερωθῆναι
  choice: nhưng để ... được bày tỏ
  rationale: Diễn đạt mục đích của kết cấu ἕνεκεν + động từ nguyên mẫu có mạo từ, đồng thời giữ thể bị động của φανερωθῆναι.
- source_word: τὴν σπουδὴν ὑμῶν
  choice: lòng sốt sắng của anh chị em
  rationale: σπουδή tại đây nói đến sự nhiệt thành, nghiêm túc và quan tâm sâu sắc; “lòng sốt sắng” tự nhiên và trang trọng vừa phải.
- source_word: τὴν ὑπὲρ ἡμῶν
  choice: dành cho chúng tôi
  rationale: Diễn đạt hướng quan tâm đối với Phao-lô và các cộng sự mà không thêm ý thay mặt hoặc bênh vực.
- source_word: πρὸς ὑμᾶς
  choice: giữa anh chị em
  rationale: Trong cú pháp khó của câu này, cách dịch này giữ ý sự sốt sắng được hiển lộ trong cộng đồng Cô-rinh-tô, đồng thời không làm câu tiếng Việt gượng ép như cách dịch sát “hướng đến anh chị em”.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: trước mặt Đức Chúa Trời
  rationale: Giữ khung cảnh trang nghiêm về sự hiện diện và chứng giám của Đức Chúa Trời.
theological_decisions:
- issue: Chủ thể và hướng quy chiếu trong cụm τὴν σπουδὴν ὑμῶν τὴν ὑπὲρ ἡμῶν πρὸς ὑμᾶς
  choice: “lòng sốt sắng của anh chị em dành cho chúng tôi được bày tỏ giữa anh chị em”
  alternative: “lòng sốt sắng của chúng tôi dành cho anh chị em được bày tỏ giữa anh chị em”
  rationale: Bản văn SBLGNT in ὑμῶν (“của anh chị em”) và ὑπὲρ ἡμῶν (“dành cho chúng tôi”), nên bản chính theo trực tiếp bản văn này. Dị bản đảo các đại từ tạo ra một ý khác có chứng cứ thủ bản và được ghi ở chú thích, thay vì âm thầm dung hòa.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” cho đại từ số nhiều ὑμῖν/ὑμῶν/ὑμᾶς; giữ sự lặp có chủ ý và nét khó của mệnh đề cuối mà không giải thích thêm trong bản văn.
