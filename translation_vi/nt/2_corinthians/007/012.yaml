  source_fidelity: 'Bản dịch theo sát bản SBLGNT: giữ liên từ suy luận và nhượng bộ, hai phân từ đối lập “người đã làm điều bất công/người bị đối xử bất công,” mục đích “để ... được bày tỏ,” và cách hiểu trực tiếp của chuỗi đại từ khó ở cuối câu. Chú thích ghi đúng dị bản đảo các đại từ.'
  naturalness: Câu văn trang trọng, rõ và phù hợp tiếng Việt hiện đại. Tuy nhiên, “người bị đối xử sai trái” không tự nhiên bằng “người bị đối xử bất công,” đồng thời chưa tương ứng từ vựng thật cân xứng với vế “làm điều sai trái.”
  terminology: “Anh chị em,” “lòng sốt sắng,” và “trước mặt Đức Chúa Trời” phù hợp ngữ vực Kinh Thánh hiện đại. “Bất công” diễn đạt tự nhiên và nhất quán hơn trường nghĩa của ἀδικέω/ἀδικέομαι, không xác định thêm bản chất sự việc.
  issues:
