source:
  edition: SBLGNT
  text: πολλή μοι παρρησία πρὸς ὑμᾶς, πολλή μοι καύχησις ὑπὲρ ὑμῶν· πεπλήρωμαι τῇ παρακλήσει, ὑπερπερισσεύομαι τῇ χαρᾷ ἐπὶ πάσῃ τῇ θλίψει ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/004.yaml
  text: I have great boldness toward you[a], and great boasting on your behalf. I am filled with encouragement[c][b]; I overflow with joy in all our affliction.
translation:
  language: vi
  text: Tôi rất mạnh dạn với anh chị em[a], và rất tự hào về anh chị em. Tôi tràn đầy sự khích lệ[b]; tôi tràn ngập niềm vui giữa mọi hoạn nạn của chúng tôi[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Tôi rất tự tin với anh chị em” hoặc “Tôi rất thẳng thắn với anh chị em.” Từ Hy Lạp có thể chỉ sự mạnh dạn, tự tin và cởi mở trong lời nói.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “sự an ủi” hoặc “sự yên ủi.” Từ Hy Lạp bao gồm cả ý nâng đỡ, khích lệ và an ủi.'
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể hiểu: “bất chấp mọi hoạn nạn của chúng tôi.” Câu Hy Lạp cũng có thể nhấn mạnh rằng niềm vui dâng tràn trong hoàn cảnh hoạn nạn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρρησία
  choice: hết sức tin tưởng
  rationale: Trong quan hệ với người Cô-rinh-tô, từ này diễn tả sự tự tin cởi mở, có thể bao gồm sự thẳng thắn trong lời nói. Cách dịch này tự nhiên trong tiếng Việt và giữ sắc thái tin cậy; chú thích bảo lưu nét nghĩa mạnh dạn, thẳng thắn.
- source_word: πρὸς ὑμᾶς
  choice: nơi anh chị em
  rationale: πρός với đối cách ở đây chỉ hướng quan hệ. “Nơi anh chị em” diễn đạt tự nhiên đối tượng mà Phao-lô đặt lòng tin tưởng.
- source_word: καύχησις
  choice: hãnh diện
  rationale: καύχησις là lời tự hào hoặc khoe mình. Trong tiếng Việt hiện đại, “hãnh diện về anh chị em” giữ ý tích cực của ngữ cảnh mà không gợi sự khoe khoang tự tôn không cần thiết.
- source_word: ὑπὲρ ὑμῶν
  choice: về anh chị em
  rationale: ὑπέρ với sở hữu cách có thể mang nghĩa vì, thay cho, hoặc liên quan đến. Ở đây, “về anh chị em” phù hợp với đối tượng của sự hãnh diện và không xác định quá mức sắc thái đại diện.
- source_word: πεπλήρωμαι
  choice: Tôi được đầy
  rationale: Thể hoàn thành bị động diễn tả trạng thái hiện tại do một hành động đã xảy ra; “được đầy” giữ cả sắc thái bị động lẫn kết quả hiện tại.
- source_word: παράκλησις
  choice: sự khích lệ
  rationale: παράκλησις bao gồm cả sự nâng đỡ, khích lệ và an ủi. “Sự khích lệ” hợp với tiếng Việt hiện đại; chú thích nêu sắc thái an ủi.
- source_word: ὑπερπερισσεύομαι
  choice: tràn ngập
  rationale: Động từ tăng cường diễn tả sự dư dật vượt mức. “Tràn ngập” truyền đạt hình ảnh niềm vui dâng tràn bằng lời văn tự nhiên.
- source_word: χαρά
  choice: niềm vui
  rationale: χαρά có nghĩa trực tiếp là niềm vui; thêm “niềm” tạo cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: ἐπὶ πάσῃ τῇ θλίψει ἡμῶν
  choice: giữa mọi hoạn nạn của chúng tôi
  rationale: ἐπί với tặng cách ở đây diễn tả hoàn cảnh mà niềm vui vẫn tràn ngập. “Giữa” bảo tồn sự đồng hiện của niềm vui và đau khổ, không biến câu thành ý đơn thuần tương phản.
- source_word: πολλή ... πολλή
  choice: hết sức ... rất
  rationale: Sự lặp lại nhấn mạnh mức độ lớn. Tiếng Việt cần kết hợp tự nhiên khác nhau với “tin tưởng” và “hãnh diện”; hai từ chỉ mức độ vẫn giữ phép song hành về ý.
theological_decisions:
- issue: Diễn đạt καύχησις tích cực của Phao-lô mà không gán cho ông sự tự tôn tội lỗi
  choice: Dịch là “hãnh diện”
  alternative: “khoe mình” hoặc “tự hào”
  rationale: Ngữ cảnh cho thấy Phao-lô nói tốt về người Cô-rinh-tô. “Hãnh diện” bảo tồn giá trị tích cực, trong khi “khoe mình” trong tiếng Việt dễ bị hiểu mặc nhiên là tự đề cao; “tự hào” cũng khả dĩ nhưng có thể tập trung hơn vào cảm xúc nội tâm.
- issue: Bảo tồn sự căng thẳng giữa niềm vui và đau khổ
  choice: Dịch là “giữa mọi hoạn nạn của chúng tôi”
  alternative: “bất chấp mọi hoạn nạn của chúng tôi”
  rationale: Cụm Hy Lạp cho phép hiểu niềm vui dâng tràn ngay trong hoàn cảnh hoạn nạn. “Giữa” không giải quyết sự căng thẳng thành một quan hệ nhượng bộ đơn thuần.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “anh chị em” cho số nhiều ὑμᾶς nhằm diễn đạt cộng đồng tín hữu một cách tự nhiên; dùng “chúng tôi” cho ἡμῶν để giữ sự phân biệt đại từ. Câu giữ phép song hành và cường độ cảm xúc của nguyên bản, đồng thời tránh lối diễn đạt Hán-Việt quá nặng.
