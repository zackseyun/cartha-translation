  to: và không chỉ bởi việc người đến[a], mà còn bởi sự an ủi[b] mà người đã được an ủi vì anh chị em. Người thuật lại cho chúng tôi lòng mong mỏi, nỗi đau buồn[c] và lòng nhiệt thành của anh chị em đối với tôi, khiến tôi càng vui mừng hơn.
  rationale: Sửa tối thiểu để biểu đạt rõ παρεκλήθη là “được an ủi,” đồng thời duy trì sự tương ứng cùng gốc với “sự an ủi” (παρακλήσει). Giữ “vì anh chị em” vì đây là cách dịch khả dĩ, không quá diễn giải, của ἐφ’ ὑμῖν trong ngữ cảnh này. Các lựa chọn và vị trí chú thích khác được giữ nguyên.
