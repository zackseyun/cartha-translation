id: 2CO.7.7
reference: 2 Corinthians 7:7
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οὐ μόνον δὲ ἐν τῇ παρουσίᾳ αὐτοῦ, ἀλλὰ καὶ ἐν τῇ παρακλήσει ᾗ παρεκλήθη ἐφ’ ὑμῖν, ἀναγγέλλων ἡμῖν τὴν ὑμῶν ἐπιπόθησιν, τὸν ὑμῶν ὀδυρμόν, τὸν ὑμῶν ζῆλον ὑπὲρ ἐμοῦ, ὥστε με μᾶλλον χαρῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/007.yaml
  text: and not only by his coming, but also by the comfort with which he was comforted because of you, as he reported to us your longing, your mourning, and your zeal for me, so that I rejoiced even more.
translation:
  language: vi
  text: và không chỉ bởi việc người đến[a], mà còn bởi sự an ủi[b] mà người đã được an ủi vì anh chị em. Người thuật lại cho chúng tôi lòng mong mỏi, nỗi đau buồn[c] và lòng nhiệt thành của anh chị em đối với tôi, khiến tôi càng vui mừng hơn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “bởi sự hiện diện của người.”'
    reason: lexical_alternative
  - marker: b
    text: Từ Hy Lạp cũng có thể được dịch là “sự khích lệ”; động từ cùng gốc trong câu có thể dịch là “được khích lệ.”
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “lời than khóc.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρουσίᾳ
  choice: việc người đến
  rationale: Trong bối cảnh chuyến đi của Tít, từ này chỉ việc ông đến/hiện diện; “việc người đến” diễn đạt tự nhiên ý sự kiện mà không gợi nghĩa thần học chuyên biệt.
- source_word: παρακλήσει / παρεκλήθη
  choice: niềm an ủi / nhận được
  rationale: Ngữ cảnh nhấn mạnh sự khuây khỏa sau nỗi buồn. Cấu trúc tiếng Việt tránh lặp vụng “được an ủi bằng sự an ủi” nhưng vẫn giữ ý Tít là người nhận sự an ủi.
- source_word: ἐφ’ ὑμῖν
  choice: vì anh chị em
  rationale: Giới từ với tặng cách ở đây hợp lý nhất là chỉ nguyên do hoặc dịp khiến Tít được an ủi; cách dịch vẫn để ngỏ việc sự đáp ứng của tín hữu Cô-rinh-tô là nguồn an ủi.
- source_word: ἀναγγέλλων
  choice: Người thuật lại
  rationale: Phân từ cho biết việc Tít báo tin là phương tiện hoặc hoàn cảnh qua đó Phao-lô biết thái độ của họ; tách thành câu giúp tiếng Việt sáng rõ.
- source_word: ἐπιπόθησιν
  choice: lòng mong mỏi
  rationale: Diễn tả niềm khao khát mạnh mẽ, hướng về Phao-lô theo văn cảnh.
- source_word: ὀδυρμόν
  choice: nỗi đau buồn
  rationale: Từ này chỉ nỗi buồn được bộc lộ thành than khóc; “nỗi đau buồn” tự nhiên trong tiếng Việt, còn sắc thái “than khóc” được ghi chú.
- source_word: ζῆλον
  choice: lòng nhiệt thành
  rationale: Giữ sắc thái sốt sắng, tha thiết và tích cực của từ Hy Lạp mà không thu hẹp thành một hành động cụ thể.
- source_word: ὑπὲρ ἐμοῦ
  choice: đối với tôi
  rationale: Cách diễn đạt đủ rộng để bao gồm sự quan tâm, ủng hộ hoặc sốt sắng hướng về Phao-lô, không quyết định quá mức sắc thái của giới từ.
- source_word: ὥστε με μᾶλλον χαρῆναι
  choice: khiến tôi càng vui mừng hơn
  rationale: Diễn đạt kết quả và giữ lực so sánh của μᾶλλον.
theological_decisions:
- issue: Quan hệ của ἐφ’ ὑμῖν với sự an ủi của Tít
  choice: vì anh chị em
  alternative: về anh chị em / nơi anh chị em
  rationale: Bản dịch chính hiểu cụm này là nguyên do hoặc dịp của sự an ủi, nhưng không giải thích cụ thể hành động nào của cộng đoàn đã tạo nên sự an ủi.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Người” chỉ Tít theo văn cảnh trước đó; “anh chị em” biểu đạt số nhiều trực tiếp. Các dấu chú thích đều được đặt ngay sau từ hoặc cụm từ liên quan.
