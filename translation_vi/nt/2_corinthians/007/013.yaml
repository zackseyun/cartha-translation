language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: διὰ τοῦτο παρακεκλήμεθα. Ἐπὶ δὲ τῇ παρακλήσει ⸀ἡμῶν περισσοτέρως μᾶλλον ἐχάρημεν ἐπὶ τῇ χαρᾷ Τίτου, ὅτι ἀναπέπαυται τὸ πνεῦμα αὐτοῦ ἀπὸ πάντων ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/013.yaml
  text: For this reason we have been comforted[a]. And in addition to our comfort, we rejoiced even more abundantly at Titus’s joy[b], because his spirit has been refreshed by all of you.
translation:
  language: vi
  text: Vì thế, chúng tôi đã được an ủi[a]. Ngoài niềm an ủi của chúng tôi, chúng tôi lại càng vui mừng hơn nữa vì niềm vui của Tít, vì tinh thần của ông đã được phấn chấn nhờ tất cả anh chị em[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “được khích lệ”; các từ Hy Lạp ở đây có thể mang cả nghĩa an ủi lẫn khích lệ.
    reason: lexical_alternative
  - marker: b
    text: Hay “đã được nghỉ ngơi” hoặc “đã được nhẹ nhõm”.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Vì thế
  rationale: Diễn đạt tự nhiên quan hệ nguyên nhân–kết quả rõ ràng của cụm Hy Lạp.
- source_word: παρακεκλήμεθα / παρακλήσει
  choice: đã được an ủi / niềm an ủi
  rationale: Giữ sự liên kết từ vựng trong câu và sắc thái an ủi phù hợp với bối cảnh; thể hoàn thành được thể hiện bằng “đã được” cùng trạng thái hệ quả.
- source_word: Ἐπὶ δὲ τῇ παρακλήσει ἡμῶν
  choice: Ngoài niềm an ủi ấy
  rationale: Hiểu ἐπί với cách ba là điều được thêm vào hoặc nền tảng cho niềm vui lớn hơn; “ấy” quy chiếu tự nhiên về việc vừa được an ủi.
- source_word: περισσοτέρως μᾶλλον
  choice: lại càng vui mừng hơn nữa
  rationale: Tái hiện sự tăng cường chồng lớp của hai từ so sánh mà vẫn tự nhiên trong tiếng Việt.
- source_word: ἐπὶ τῇ χαρᾷ Τίτου
  choice: trước niềm vui của Tít
  rationale: Giữ quan hệ giữa niềm vui của các sứ đồ và niềm vui của Tít mà không ấn định quá mức là nguyên nhân duy nhất.
- source_word: ἀναπέπαυται
  choice: đã được ... làm cho tươi tỉnh
  rationale: Diễn đạt trạng thái được hồi phục, nhẹ nhõm do hành động trước đó, phù hợp thể hoàn thành và bối cảnh quan hệ.
- source_word: τὸ πνεῦμα αὐτοῦ
  choice: tâm thần của anh
  rationale: Giữ hình ảnh nhân học của πνεῦμα, chỉ con người nội tâm và tâm trạng của Tít, đồng thời tránh hiểu là Đức Thánh Linh.
- source_word: ἀπὸ πάντων ὑμῶν
  choice: được tất cả anh chị em làm cho
  rationale: Chuyển nguồn/tác nhân của sự tươi tỉnh sang cấu trúc bị động tự nhiên trong tiếng Việt và bảo toàn πάντων, “tất cả”.
theological_decisions:
- issue: πνεῦμα trong cụm τὸ πνεῦμα αὐτοῦ
  choice: tâm thần/con người nội tâm của Tít
  alternative: Thánh Linh
  rationale: Đại từ sở hữu “của anh” và bối cảnh nói về phản ứng tình cảm của Tít cho thấy đây là tinh thần hoặc con người nội tâm của ông, không phải Đức Thánh Linh.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” cho đại từ số nhiều chỉ cộng đồng Cô-rinh-tô; tên Τίτος được viết là “Tít”. Cấu trúc câu giữ sự lặp lại có chủ ý giữa “an ủi” và “niềm an ủi”, đồng thời thể hiện cường độ của περισσοτέρως μᾶλλον.
