- from: Vì thế, chúng tôi đã được an ủi[a]. Ngoài niềm an ủi ấy, chúng tôi lại càng vui mừng hơn nữa trước niềm vui của Tít, vì tâm thần của anh đã được tất cả anh chị em làm cho tươi tỉnh[b].
  to: Vì thế, chúng tôi đã được an ủi[a]. Ngoài niềm an ủi của chúng tôi, chúng tôi lại càng vui mừng hơn nữa vì niềm vui của Tít, vì tinh thần của ông đã được phấn chấn nhờ tất cả anh chị em[b].
  rationale: Bản sửa giữ nguyên ý nghĩa, cấu trúc và các mỏ neo chú thích của bản nháp, nhưng thay cụm cuối bằng tiếng Việt hiện đại, tự nhiên hơn. “Tinh thần” chỉ trạng thái nội tâm của Tít, không hàm ý Đức Thánh Linh; “nhờ tất cả anh chị em” bảo toàn ý nguồn/tác nhân của ἀπό.
