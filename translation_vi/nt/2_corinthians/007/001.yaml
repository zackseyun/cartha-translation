  verdict: revise
  source_fidelity: Bản dịch giữ đúng lời khuyến dụ bao gồm của καθαρίσωμεν, ý tẩy sạch khỏi mọi ô uế, và mục tiêu hoàn tất sự thánh khiết. Tuy nhiên, “tâm linh” không tương ứng trực tiếp với πνεύματος trong cặp đối xứng với σαρκὸς; “tinh thần” phù hợp hơn. Cần nêu rõ chủ ngữ hàm ẩn của ἔχοντες là “chúng ta” và diễn đạt ἐπιτελοῦντες tự nhiên hơn trong tiếng Việt.
  naturalness: “Thưa những người yêu dấu” và “hoàn tất sự thánh khiết” khá gượng trong văn xuôi tiếng Việt hiện đại. “Anh em yêu dấu” là lối xưng hô thư tín Kinh Thánh tự nhiên; “làm cho sự thánh khiết được trọn vẹn” diễn đạt rõ tiến trình đưa sự thánh khiết đến chỗ hoàn thành.
  terminology: Giữ “lời hứa,” “thanh tẩy,” “ô uế,” “thể xác,” “tinh thần,” “sự thánh khiết,” và “kính sợ Đức Chúa Trời.” Không dùng “bản tính tội lỗi” cho σάρξ, vì cặp “thể xác và tinh thần” nói đến các phương diện của con người.
  issues:
