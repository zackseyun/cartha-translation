id: 2CO.7.1
reference: 2 Corinthians 7:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ταύτας οὖν ἔχοντες τὰς ἐπαγγελίας, ἀγαπητοί, καθαρίσωμεν ἑαυτοὺς ἀπὸ παντὸς μολυσμοῦ σαρκὸς καὶ πνεύματος, ἐπιτελοῦντες ἁγιωσύνην ἐν φόβῳ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/001.yaml
  text: Therefore[a], since we have these promises, beloved, let us cleanse ourselves from every defilement of flesh and spirit[c][b], bringing holiness to completion in the fear of God.
translation:
  language: vi
  text: Vậy, vì chúng ta có những lời hứa ấy, anh em yêu dấu, chúng ta hãy thanh tẩy mình khỏi mọi sự ô uế của thể xác và tinh thần,[a] làm cho sự thánh khiết được trọn vẹn trong sự kính sợ Đức Chúa Trời.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “khỏi mọi sự ô uế của thân thể và tinh thần.”'
    reason: lexical_alternative
  - marker: b
    text: “Kính sợ Đức Chúa Trời” nói đến lòng kính cẩn và khiếp phục trước Ngài, chứ không chỉ là sự kinh hãi.
    reason: lexical_clarification
lexical_decisions:
- source_word: ταύτας οὖν ἔχοντες τὰς ἐπαγγελίας
  choice: Vậy... vì có những lời hứa ấy
  rationale: οὖν nêu kết luận từ các lời bảo đảm ngay trước đó; ταύτας chỉ ngược về những lời hứa ấy. Cấu trúc tiếng Việt này vừa tự nhiên vừa giữ rõ quan hệ suy luận.
- source_word: ἀγαπητοί
  choice: thưa những người yêu dấu
  rationale: Giữ sắc thái trìu mến và trang trọng của lời xưng hô, đồng thời diễn đạt tự nhiên trong văn thư tiếng Việt.
- source_word: καθαρίσωμεν ἑαυτοὺς
  choice: chúng ta hãy thanh tẩy mình
  rationale: Thể giả định ngôi thứ nhất số nhiều có lực khuyến dụ bao gồm cả Phao-lô lẫn độc giả; “thanh tẩy” phù hợp với trường nghĩa ô uế và thánh khiết.
- source_word: ἀπὸ παντὸς μολυσμοῦ
  choice: khỏi mọi sự ô uế
  rationale: μολυσμός chỉ sự làm nhơ bẩn hay ô uế về phương diện đạo đức và tôn giáo; cách dịch này rõ nghĩa và giữ âm hưởng thanh sạch-thánh khiết.
- source_word: σαρκὸς καὶ πνεύματος
  choice: của thể xác và tâm linh
  rationale: Trong thế đối xứng này, σάρξ nói đến phương diện thân thể và πνεῦμα đến phương diện bên trong của con người; cách dịch tránh hiểu σάρξ là “bản tính tội lỗi”.
- source_word: ἐπιτελοῦντες ἁγιωσύνην
  choice: hoàn tất sự thánh khiết
  rationale: ἐπιτελέω mang ý đưa một điều đến chỗ hoàn thành; phân từ diễn tả tiến trình đi kèm lời kêu gọi thanh tẩy.
- source_word: ἐν φόβῳ θεοῦ
  choice: trong lòng kính sợ Đức Chúa Trời
  rationale: Giữ từ “sợ” cùng sức nặng của thành ngữ Kinh Thánh, nhưng “kính sợ” diễn đạt tự nhiên ý kính cẩn, khiếp phục trước Đức Chúa Trời chứ không chỉ là kinh hãi.
theological_decisions:
- issue: Ý nghĩa của σάρξ trong cụm σαρκὸς καὶ πνεύματος
  choice: Dịch là “thể xác”, chỉ phương diện thân thể của con người.
  alternative: “xác thịt” hoặc “bản tính tội lỗi”
  rationale: Sự sóng đôi với πνεῦμα cho thấy hai phương diện thể chất và nội tâm của toàn thể con người. “Bản tính tội lỗi” sẽ đưa vào một nghĩa chuyên biệt không được ngữ cảnh này đòi hỏi.
- issue: Lực của καθαρίσωμεν
  choice: “chúng ta hãy thanh tẩy mình”, một lời khuyên giục có tính bao gồm.
  alternative: “chúng ta nên thanh tẩy mình”
  rationale: Thể giả định khuyến dụ ngôi thứ nhất số nhiều trực tiếp kêu gọi cả người viết lẫn người đọc, mạnh hơn một lời nhận định về bổn phận.
- issue: Ý nghĩa của φόβος θεοῦ
  choice: “lòng kính sợ Đức Chúa Trời”
  alternative: “lòng tôn kính Đức Chúa Trời” hoặc “nỗi sợ Đức Chúa Trời”
  rationale: Cách dịch giữ được sự căng thẳng giữa lòng kính cẩn và ý thức nghiêm trang trước Đức Chúa Trời, không làm nhẹ thành sự tôn kính đơn thuần cũng không thu hẹp thành nỗi kinh hãi.
- issue: Quan hệ của ἐπιτελοῦντες với lời kêu gọi chính
  choice: Diễn tả việc đưa sự thánh khiết đến chỗ hoàn tất trong khi thanh tẩy mình.
  alternative: “làm nên sự thánh khiết trọn vẹn” hoặc “tiến tới sự thánh khiết trọn vẹn”
  rationale: Bản dịch giữ ý tiến trình và đích hoàn thành mà không khẳng định một học thuyết riêng về sự hoàn hảo vô tội.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “thưa những người yêu dấu” cho lời gọi trìu mến; “thanh tẩy”, “ô uế” và “sự thánh khiết” duy trì trường nghĩa tôn giáo-đạo đức của câu. Mọi dấu chú thích đều đặt trong chính văn.
