  - severity: low
    issue: “Thưa những người yêu dấu” không tự nhiên bằng cách xưng hô thư tín thông dụng.
    rationale: ἀγαπητοί là hô cách thân tình và trang trọng. “Anh em yêu dấu” chuyển tải tự nhiên chức năng này trong tiếng Việt Kinh Thánh hiện đại.
  - severity: low
    issue: “Hoàn tất sự thánh khiết” là kết hợp từ chưa tự nhiên.
    rationale: Phân từ ἐπιτελοῦντες nói đến việc đưa sự thánh khiết đến mức hoàn thành. “Làm cho sự thánh khiết được trọn vẹn” giữ ý này bằng tiếng Việt tự nhiên hơn.
