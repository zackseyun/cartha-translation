revisions:
- from: Vậy, thưa những người yêu dấu, vì có những lời hứa ấy, chúng ta hãy thanh tẩy mình khỏi mọi sự ô uế của thể xác và tâm linh,[a] hoàn tất sự thánh khiết trong lòng kính sợ Đức Chúa Trời.[b]
  to: Vậy, vì chúng ta có những lời hứa ấy, anh em yêu dấu, chúng ta hãy thanh tẩy mình khỏi mọi sự ô uế của thể xác và tinh thần,[a] làm cho sự thánh khiết được trọn vẹn trong sự kính sợ Đức Chúa Trời.[b]
