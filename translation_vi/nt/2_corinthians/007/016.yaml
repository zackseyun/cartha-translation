  terminology: “Vui mừng” và “tin tưởng” phù hợp với ngữ cảnh, không áp đặt diễn giải thần học. Chú thích nêu một cách hợp lý các khả năng “trong mọi sự,” “vững lòng,” và cách hiểu ἐν ὑμῖν là “về anh chị em.”
