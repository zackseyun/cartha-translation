  source_fidelity: Bản dịch truyền đạt đúng mệnh đề hiện tại χαίρω, phạm vi bao quát của ἐν παντί, và sự vững tin của Phao-lô đối với người nhận trong ἐν ὑμῖν. “Vì” có thể bao hàm quan hệ nội dung/nguyên cớ của ὅτι mà không làm sai nghĩa.
