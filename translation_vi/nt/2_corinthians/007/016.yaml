id: 2CO.7.16
reference: 2 Corinthians 7:16
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: χαίρω ὅτι ἐν παντὶ θαρρῶ ἐν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/016.yaml
  text: I rejoice that in every way I have confidence in you[a].
translation:
  language: vi
  text: Tôi vui mừng vì trong mọi phương diện, tôi tin tưởng anh chị em.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Tôi vui mừng vì trong mọi sự, tôi vững lòng về anh chị em.”'
    reason: Giữ lại khả năng hiểu ἐν παντί là “trong mọi sự,” θαρρῶ là “vững lòng,” và ἐν ὑμῖν là “về anh chị em,” thay vì diễn đạt như sự tin tưởng đặt nơi họ.
lexical_decisions:
- source_word: χαίρω
  choice: Tôi vui mừng
  rationale: Động từ hiện tại ngôi thứ nhất số ít diễn tả niềm vui hiện tại của Phao-lô; “vui mừng” tự nhiên, trang trọng và giữ được sắc thái động từ.
- source_word: ὅτι
  choice: vì
  rationale: Trong tiếng Việt, “vì” ở đây tự nhiên khi giới thiệu sự việc làm Phao-lô vui mừng; từ Hy Lạp cũng có thể được hiểu là giới thiệu nội dung, gần với “rằng”.
- source_word: ἐν παντί
  choice: trong mọi phương diện
  rationale: Cụm trung tính số ít có chức năng trạng ngữ, chỉ phạm vi toàn diện. Cách dịch này rõ nghĩa và tự nhiên hơn “trong mọi sự” trong câu chính.
- source_word: θαρρῶ
  choice: tôi tin tưởng
  rationale: Trong ngữ cảnh với ἐν ὑμῖν, động từ diễn tả sự vững tin của Phao-lô đối với người Cô-rinh-tô; “tin tưởng” là cách diễn đạt tiếng Việt tự nhiên mà không làm mất sắc thái hiện tại.
- source_word: ἐν ὑμῖν
  choice: anh chị em
  rationale: Sau “tin tưởng”, tiếng Việt không cần dịch riêng giới từ ἐν; bổ ngữ trực tiếp “anh chị em” truyền đạt tự nhiên ý đặt lòng tin nơi họ. Đại từ số nhiều được diễn đạt theo lối xưng hô cộng đồng Cơ Đốc.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Anh chị em” diễn đạt số nhiều ὑμῖν theo lối xưng hô cộng đồng tự nhiên trong tiếng Việt; câu chính ưu tiên tính lưu loát nhưng chú thích giữ các khả năng ngữ nghĩa của nguyên văn.
