revisions:
- from: Vì dù tôi đã làm anh chị em buồn qua lá thư ấy, tôi không hối tiếc. Tuy tôi đã từng hối tiếc[a]—vì tôi thấy rằng lá thư ấy đã làm anh chị em buồn, dẫu chỉ trong một thời gian ngắn[b]—
  to: Vì dù tôi đã làm anh chị em buồn bằng lá thư, tôi không hối tiếc, dù tôi đã từng hối tiếc[a] (vì tôi thấy rằng lá thư ấy, dẫu chỉ trong một thời gian ngắn[b], đã làm anh chị em buồn).
