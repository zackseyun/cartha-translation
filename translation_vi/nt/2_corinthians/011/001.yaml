source:
  edition: SBLGNT
  text: Ὄφελον ἀνείχεσθέ μου μικρόν ⸀τι ⸀ἀφροσύνης· ἀλλὰ καὶ ἀνέχεσθέ μου.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/001.yaml
  text: I wish you would bear with me in a little foolishness[a]. But indeed[b], do bear with me.
translation:
  language: vi
  text: Ước gì anh chị em chịu đựng tôi trong đôi chút dại dột của tôi[a]. Nhưng quả thật, xin hãy chịu đựng tôi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đôi chút điên rồ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὄφελον
  choice: Ước gì
  rationale: Diễn đạt tự nhiên sắc thái ao ước của tiểu từ, đồng thời giữ giọng khẩn khoản mang tính tu từ.
- source_word: ἀνείχεσθέ / ἀνέχεσθέ
  choice: chịu đựng tôi / xin hãy chịu đựng tôi
  rationale: Động từ ἀνέχομαι ở đây mang nghĩa kiên nhẫn chấp nhận hoặc dung chịu một người. Việc lặp lại cụm từ phản ánh sự lặp lại trong nguyên văn; “xin hãy” làm rõ lời khẩn khoản được nhắc lại.
- source_word: μου
  choice: tôi
  rationale: Là bổ ngữ của ἀνέχομαι, chỉ chính Phao-lô là người ông xin các tín hữu dung chịu.
- source_word: μικρόν τι
  choice: một chút
  rationale: Cách nói gọn, tự nhiên, giữ sắc thái giảm nhẹ mang tính tu từ của cụm từ Hy Lạp.
- source_word: ἀφροσύνης
  choice: sự dại dột
  rationale: Giữ nghĩa về cách hành xử hoặc lời nói bị xem là thiếu khôn ngoan, phù hợp với giọng tự hạ mang tính mỉa mai trong phần nói về sự khoe mình.
- source_word: ἀλλὰ καὶ
  choice: Thật ra
  rationale: Trong ngữ cảnh này, cụm từ chuyển từ lời ước sang lời khẩn khoản trực tiếp và có sắc thái xác nhận, nhấn mạnh; “Thật ra” diễn đạt tự nhiên hơn một liên từ đối lập cứng nhắc.
theological_decisions:
- issue: Phao-lô gọi lời mình sắp nói là “sự dại dột”
  choice: Giữ nguyên cách tự mô tả mang tính tu từ là “sự dại dột”
  alternative: một chút điên rồ; đôi lời thiếu khôn ngoan
  rationale: Câu này mở đầu phần Phao-lô nói cách mỉa mai về việc khoe mình. Bản dịch không làm nhẹ hay giải quyết sự căng thẳng trong cách ông tự mô tả.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “anh chị em” để chỉ cộng đồng tín hữu được ngỏ lời; giữ lời khẩn khoản lặp lại và nét tự hạ mang tính tu từ của Phao-lô.
