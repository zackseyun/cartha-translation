id: 2CO.11.7
reference: 2 Corinthians 11:7
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἢ ἁμαρτίαν ἐποίησα ἐμαυτὸν ταπεινῶν ἵνα ὑμεῖς ὑψωθῆτε, ὅτι δωρεὰν τὸ τοῦ θεοῦ εὐαγγέλιον εὐηγγελισάμην ὑμῖν;
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/007.yaml
  text: Or did I commit a sin by humbling myself so that you might be exalted[b][a], because I proclaimed the gospel of God to you free of charge?
translation:
  language: vi
  text: Hay là tôi đã phạm tội khi hạ mình để anh chị em được nâng cao, vì tôi đã rao truyền Tin Mừng của Đức Chúa Trời cho anh chị em mà không lấy tiền[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “miễn phí.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἢ
  choice: Hay là
  rationale: Mở đầu một câu hỏi tu từ nối với lập luận trước đó và giữ được giọng chất vấn sắc bén của Phao-lô.
- source_word: ἁμαρτίαν ἐποίησα
  choice: tôi đã phạm tội
  rationale: Diễn đạt tự nhiên thành ngữ Hy Lạp theo nghĩa đen là “làm một tội”, đồng thời giữ nguyên phạm trù đạo đức mạnh của câu hỏi.
- source_word: ἐμαυτὸν ταπεινῶν
  choice: khi hạ mình xuống
  rationale: Giữ nghĩa phản thân và diễn tả phân từ theo quan hệ hoàn cảnh/phương thức mà không xác định quá mức.
- source_word: ἵνα ὑμεῖς ὑψωθῆτε
  choice: để anh chị em được nâng cao
  rationale: Giữ mệnh đề mục đích, thể bị động và sự tương phản về địa vị giữa việc Phao-lô hạ mình với việc người Cô-rinh-tô được nâng cao.
- source_word: ὅτι
  choice: vì
  rationale: Nêu căn cứ hoặc nội dung của điều bị đặt câu hỏi là “phạm tội” một cách rõ ràng trong tiếng Việt.
- source_word: δωρεὰν
  choice: mà không nhận thù lao
  rationale: Trong ngữ cảnh Phao-lô nói về sự hỗ trợ tài chính cho chức vụ, cách dịch này truyền đạt rõ rằng ông rao giảng không lấy tiền công, nhưng không đưa ra phán đoán về quyền được chu cấp.
- source_word: τὸ τοῦ θεοῦ εὐαγγέλιον
  choice: Tin Mừng của Đức Chúa Trời
  rationale: Giữ cấu trúc sở hữu của nguyên văn và dùng thuật ngữ trang trọng, quen thuộc cho εὐαγγέλιον.
- source_word: εὐηγγελισάμην ὑμῖν
  choice: tôi đã rao truyền ... cho anh chị em
  rationale: Diễn đạt hành động công bố sứ điệp cách tự nhiên, không thu hẹp nghĩa vào một hình thức giảng dạy trong hội thánh.
theological_decisions:
- issue: Tính chất câu hỏi tu từ về sự hạ mình và việc không nhận hỗ trợ tài chính
  choice: Giữ nguyên câu hỏi tu từ và sắc thái mỉa mai tiềm ẩn, không thêm lời phán xét về việc người phục vụ có quyền nhận thù lao hay không.
  alternative: Diễn giải rằng Phao-lô đã từ bỏ một quyền lợi sứ đồ, hoặc làm nhẹ câu hỏi thành một lời xin lỗi.
  rationale: Nguyên văn chỉ hỏi liệu việc ông hạ mình và rao Tin Mừng không nhận thù lao có phải là tội hay không; bản dịch không nên giải quyết vượt quá sự căng thẳng thần học của câu.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh chị em” cho đại từ số nhiều ὑμεῖς nhằm nói trực tiếp với cộng đồng tín hữu; giữ cặp tương phản “hạ mình xuống / được nâng cao”. Marker [a] xuất hiện ngay sau cụm từ được chú thích.
