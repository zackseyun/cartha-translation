  text: and through a window in a basket I was lowered through the wall and escaped his hands[a].
translation:
  language: vi
  text: và tôi được hạ xuống trong một chiếc giỏ qua một ô cửa trên tường, rồi thoát khỏi tay người ấy.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “tôi được thả xuống qua một ô cửa trên tường trong một chiếc giỏ đan bằng dây.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: θυρίδος
  choice: ô cửa
  rationale: θυρίς chỉ một cửa sổ hoặc ô mở nhỏ. “Ô cửa” tự nhiên trong ngữ cảnh một lối mở trên tường và không hàm ý quá mức về cấu tạo.
- source_word: σαργάνῃ
  choice: chiếc giỏ
  rationale: σαργάνη là vật chứa đan bằng dây hoặc vật liệu tương tự. “Chiếc giỏ” rõ ràng, tự nhiên; sắc thái chất liệu được giữ trong chú thích.
- source_word: ἐχαλάσθην
  choice: tôi được hạ xuống
  rationale: Thể bị động của χαλάω ở đây diễn tả việc Phao-lô được người khác hạ xuống, có lẽ bằng dây. Cách dịch này vừa chính xác vừa tự nhiên.
- source_word: διὰ τοῦ τείχους
  choice: qua một ô cửa trên tường
  rationale: Hai cụm διὰ θυρίδος và διὰ τοῦ τείχους cùng mô tả đường thoát qua một ô mở thuộc bức tường. Cách diễn đạt này tránh câu tiếng Việt gượng “qua cửa... qua tường” nhưng vẫn bảo toàn ý nguồn.
- source_word: ἐξέφυγον τὰς χεῖρας αὐτοῦ
  choice: thoát khỏi tay ông ta
  rationale: Thành ngữ Hy Lạp diễn tả việc thoát khỏi sự bắt giữ hoặc quyền kiểm soát của người ấy. “Thoát khỏi tay ông ta” giữ được hình ảnh sinh động và tự nhiên trong tiếng Việt.
