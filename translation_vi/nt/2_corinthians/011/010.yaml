  source_fidelity: Bản dịch truyền đạt đúng cấu trúc quả quyết long trọng «Thật như ...», giữ được quan hệ rộng của ἀλήθεια Χριστοῦ, thể bị động tương lai của φραγήσεται, sắc thái quy chiếu của εἰς ἐμέ qua «của tôi», và số nhiều của κλίμασι. Tuy nhiên, «bị chặn lại» có thể gợi một vật hay lối đi bị chặn hơn là một lời khoe bị ngăn cản/không thể tiếp tục; cần dùng động từ tự nhiên hơn mà vẫn bảo lưu ẩn dụ của nguyên ngữ.
  naturalness: «Thật như sự thật của Đấng Mê-si ở trong tôi» là trang trọng và chấp nhận được trong văn mạch thư tín. «Lời khoe mình này của tôi» cũng rõ nghĩa. Đổi «sẽ không bị chặn lại» thành «sẽ không bị ngăn chặn» làm câu tiếng Việt tự nhiên và hợp kết hợp từ hơn.
