id: 2CO.11.10
reference: 2 Corinthians 11:10
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἔστιν ἀλήθεια Χριστοῦ ἐν ἐμοὶ ὅτι ἡ καύχησις αὕτη οὐ φραγήσεται εἰς ἐμὲ ἐν τοῖς κλίμασι τῆς Ἀχαΐας.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/010.yaml
  text: As the truth of Messiah is in me[c][b][a], this boasting of mine will not be silenced in the regions of Achaia.
translation:
  language: vi
  text: Thật như sự thật của Đấng Mê-si[a] ở trong tôi, lời khoe mình này của tôi[b] sẽ không bị ngăn chặn[c] tại các miền thuộc A-chai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “Đấng Christ” hoặc “Đức Kitô”. Cụm này cũng có thể được hiểu là “sự thật về Đấng Mê-si”.'
    reason: Ghi nhận cách gọi truyền thống của Χριστός và độ mở của cấu trúc sở hữu cách.
  - marker: b
    text: 'Dịch sát cụm Hy Lạp khó hiểu hơn: “lời khoe mình này, đối với tôi”.'
    reason: εἰς ἐμέ là một thành ngữ chỉ sự quy chiếu; chuyển thành “của tôi” giúp câu tự nhiên nhưng cần bảo lưu dạng khả dĩ sát chữ.
  - marker: c
    text: 'Hay: “sẽ không bị làm cho im tiếng”, “sẽ không bị chặn lại” hoặc “sẽ không bị khóa lại”.'
    reason: φραγήσεται dùng hình ảnh bị bịt hoặc chặn và có thể được áp dụng theo vài cách trong văn mạch này.
lexical_decisions:
- source_word: ἀλήθεια Χριστοῦ
  choice: sự thật của Đấng Mê-si
  rationale: Giữ nguyên cấu trúc sở hữu/liên hệ của cụm sở hữu cách, không thu hẹp thành chỉ sự chân thật của Phao-lô; “Đấng Mê-si” thể hiện chức danh Χριστός.
- source_word: ἐν ἐμοὶ
  choice: ở trong tôi
  rationale: Dịch trực tiếp giới từ ἐν, bảo toàn sắc thái của lời quả quyết long trọng mà không diễn giải quá mức.
- source_word: ὅτι
  choice: Thật như ...
  rationale: Trong cấu trúc này, ὅτι đưa vào nội dung của lời quả quyết mang dáng dấp một công thức thề; cách diễn đạt tiếng Việt này truyền đạt ý “chắc chắn như” mà không biến mệnh đề thành quan hệ nguyên nhân rõ rệt.
- source_word: καύχησις
  choice: lời khoe mình
  rationale: Diễn đạt tự nhiên hành động hoặc nội dung khoe mình trong tiếng Việt, đồng thời phù hợp với văn mạch Phao-lô đang nói về điều mình tiếp tục tuyên bố.
- source_word: φραγήσεται
  choice: sẽ không bị chặn lại
  rationale: Giữ thể tương lai bị động và hình ảnh căn bản của φράσσω là bịt, chặn hoặc khóa lại; cách dịch không quyết định hoàn toàn hình ảnh này là “làm im tiếng” hay “ngăn cản”.
- source_word: εἰς ἐμὲ
  choice: của tôi
  rationale: 'Chuyển cụm chỉ sự quy chiếu khó dịch thành sở hữu tự nhiên trong tiếng Việt: lời khoe mình liên quan đến chính Phao-lô.'
- source_word: ἐν τοῖς κλίμασι τῆς Ἀχαΐας
  choice: tại các miền thuộc A-chai
  rationale: Giữ số nhiều của κλίμασι và chỉ rõ đây là những miền hay khu vực trong tỉnh A-chai.
theological_decisions:
- issue: Cách dịch Χριστοῦ
  choice: Đấng Mê-si
  alternative: Đấng Christ / Đức Kitô
  rationale: Ở đây Χριστός vẫn có thể được nghe như một chức danh; “Đấng Mê-si” giữ rõ ý nghĩa ấy, còn cách gọi truyền thống được ghi nhận trong chú thích.
- issue: Quan hệ trong cụm ἀλήθεια Χριστοῦ
  choice: sự thật của Đấng Mê-si
  alternative: sự thật về Đấng Mê-si; sự chân thật thuộc về Đấng Mê-si
  rationale: Sở hữu cách Hy Lạp có độ mở về quan hệ; bản dịch chính giữ cấu trúc rộng thay vì quyết định đó là nguồn gốc, sở hữu hay nội dung.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Thật như” duy trì sắc thái quả quyết long trọng của câu Hy Lạp; “A-chai” là dạng phiên âm tiếng Việt của địa danh Ἀχαΐα. Các chú thích bảo lưu độ khó của εἰς ἐμέ và ẩn dụ trong φραγήσεται.
