id: 2CO.11.19
reference: 2 Corinthians 11:19
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἡδέως γὰρ ἀνέχεσθε τῶν ἀφρόνων φρόνιμοι ὄντες·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/019.yaml
  text: For you gladly put up with fools[b][a], being wise yourselves.
translation:
  language: vi
  text: Vì anh chị em vui vẻ chịu đựng những kẻ ngu dại[a], trong khi chính mình là người khôn ngoan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “dung chịu những kẻ ngu dại.”'
    reason: lexical_alternative
  - marker: b
    text: 'Phao-lô nói với giọng mỉa mai: người Cô-rinh-tô cho mình là khôn ngoan, nhưng lại dung chịu những người lãnh đạo ngu dại.'
    reason: cultural_note
lexical_decisions:
- source_word: ἡδέως
  choice: vui vẻ
  rationale: Diễn tả sự sẵn lòng, thậm chí có vẻ thích thú, khi chấp nhận điều gì; cách dịch này tự nhiên và giữ được giọng mỉa mai của Phao-lô.
- source_word: γὰρ
  choice: Vì
  rationale: Giữ chức năng giải thích hoặc nêu lý do của mệnh đề này đối với lời ngay trước đó.
- source_word: ἀνέχεσθε
  choice: chịu đựng
  rationale: Động từ có nghĩa chịu đựng hoặc dung chịu một người; “chịu đựng” trực tiếp, tự nhiên và vẫn giữ sắc thái phê phán.
- source_word: τῶν ἀφρόνων
  choice: những kẻ ngu dại
  rationale: Chỉ những người thiếu hiểu biết hoặc hành xử ngu dại; cách dịch này tạo thế đối lập rõ với “người khôn ngoan”.
- source_word: φρόνιμοι
  choice: người khôn ngoan
  rationale: Giữ đối lập từ vựng với “những kẻ ngu dại” và để giọng mỉa mai phát sinh từ chính sự tương phản đó.
- source_word: ὄντες
  choice: trong khi chính mình là
  rationale: Giữ quan hệ phân từ tương đối rộng, không quyết định cứng thành nguyên nhân hay nhượng bộ; “chính mình” làm rõ chủ thể và hỗ trợ sự tương phản mà không thêm từ tăng cường kiểu “quá khôn ngoan”.
theological_decisions:
- issue: Giọng mỉa mai của Phao-lô đối với người Cô-rinh-tô
  choice: Dịch câu theo bề mặt, để sự mỉa mai hiện ra qua đối lập giữa “những kẻ ngu dại” và “chính mình là người khôn ngoan”.
  alternative: Diễn giải rõ hơn như “vì anh chị em tự cho mình là khôn ngoan” hoặc “vì anh chị em quá khôn ngoan”.
  rationale: Bản Hy Lạp không nói trực tiếp rằng họ “tự cho mình” khôn ngoan và cũng không có từ tương đương với “quá”; không nên đưa phần giải thích mỉa mai vào chính văn.
- issue: Sắc thái của phân từ φρόνιμοι ὄντες
  choice: Dùng “trong khi chính mình là người khôn ngoan” để bảo toàn độ mở giữa sắc thái hoàn cảnh, nguyên nhân và nhượng bộ.
  alternative: Dịch xác định là “vì anh chị em là người khôn ngoan” hoặc “dù anh chị em là người khôn ngoan”.
  rationale: Phân từ Hy Lạp tự nó không buộc phải được hiểu duy nhất theo quan hệ nguyên nhân hay nhượng bộ; cách dịch trung tính hơn giữ lại sự căng thẳng của câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “anh chị em” để gọi cộng đồng tín hữu; “vui vẻ chịu đựng” giữ nét châm biếm mà không quá khẩu ngữ. Các dấu chú thích [a], [b] đều có mặt trong chính văn.
