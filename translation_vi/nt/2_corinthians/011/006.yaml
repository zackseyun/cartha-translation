id: 2CO.11.6
reference: 2 Corinthians 11:6
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἰ δὲ καὶ ἰδιώτης τῷ λόγῳ, ἀλλ’ οὐ τῇ γνώσει, ἀλλ’ ἐν παντὶ ⸀φανερώσαντες ἐν πᾶσιν εἰς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/006.yaml
  text: But even if I am unskilled in speech[a], I am not in knowledge; indeed[c][b], in every way we have made this plain among all to you.
translation:
  language: vi
  text: Nhưng dù tôi có vụng về trong lời nói[a], tôi không hề thiếu hiểu biết; thật vậy, trong mọi phương diện và trong mọi sự, chúng tôi đã bày tỏ rõ điều ấy cho anh chị em[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “không được đào luyện về tài ăn nói,” tức là thiếu kỹ năng hùng biện trau chuốt.'
    reason: lexical_alternative
  - marker: b
    text: 'Câu Hy Lạp ở đây rất cô đọng. Cũng có thể hiểu: “bằng mọi cách, chúng tôi đã bày tỏ rõ điều ấy cho anh chị em trước mặt mọi người” hoặc “trong mọi hoàn cảnh.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδιώτης τῷ λόγῳ
  choice: vụng về trong lời nói
  rationale: Diễn tả sự thiếu trau chuốt hoặc đào tạo về tài hùng biện, không hàm ý Phao-lô thiếu học thức nói chung; đồng thời giữ được sự đối lập với γνώσει.
- source_word: γνώσει
  choice: hiểu biết
  rationale: “Hiểu biết” tự nhiên trong tiếng Việt và giữ đúng ý Phao-lô khẳng định năng lực nhận thức thực chất, đối lập với cách trình bày bằng lời.
- source_word: ἀλλ’
  choice: trái lại
  rationale: Ở lần xuất hiện thứ hai, liên từ chuyển mạnh sang lời khẳng định rằng điều vừa nói đã được chứng tỏ rõ ràng.
- source_word: ἐν παντί
  choice: trong mọi phương diện
  rationale: Cụm từ có sắc thái bao quát và có thể dùng theo nghĩa trạng ngữ; cách dịch này không giới hạn vào một hoàn cảnh cụ thể.
- source_word: φανερώσαντες
  choice: chúng tôi đã bày tỏ rõ
  rationale: Chuyển phân từ aorist thành mệnh đề hữu hạn tự nhiên trong tiếng Việt, giữ ý làm cho điều gì đó trở nên hiển nhiên.
- source_word: ἐν πᾶσιν εἰς ὑμᾶς
  choice: cho anh chị em trong mọi sự
  rationale: Giữ εἰς ὑμᾶς là hướng đến người Cô-rinh-tô và bảo lưu cách diễn đạt cô đọng, rộng nghĩa của ἐν πᾶσιν.
theological_decisions:
- issue: Ý nghĩa lời Phao-lô tự nhận về khả năng nói
  choice: Ông nhượng bộ rằng mình có thể thiếu sự trau chuốt về lời nói, nhưng không thiếu hiểu biết.
  alternative: Ông tự nhận hoàn toàn thất học, hoặc chỉ nói mỉa mà không thừa nhận bất cứ hạn chế nào.
  rationale: Sự đối lập trực tiếp giữa λόγος và γνῶσις cho thấy trọng tâm là kỹ năng trình bày hay hùng biện chứ không phải thẩm quyền, chân lý hoặc học vấn nói chung.
- issue: Phạm vi của ἐν παντί ... ἐν πᾶσιν
  choice: Giữ hai cách nói bao quát là “trong mọi phương diện” và “trong mọi sự”.
  alternative: Hiểu ἐν πᾶσιν là “trước mặt mọi người” hoặc “giữa mọi người”.
  rationale: Câu Hy Lạp cô đọng và cho phép hơn một cách liên kết cú pháp; bản chính không nên quyết định quá mức rằng πᾶσιν chỉ người hay sự việc.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “anh chị em” cho đại từ số nhiều chỉ cộng đồng tín hữu. Giữ sự lặp ý bao quát của hai cụm ἐν παντί và ἐν πᾶσιν, đồng thời đưa khả năng hiểu πᾶσιν là người hoặc hoàn cảnh vào chú thích thay vì khóa nghĩa trong chính văn.
