source:
  edition: SBLGNT
  text: κατὰ ἀτιμίαν λέγω, ὡς ὅτι ἡμεῖς ⸀ἠσθενήκαμεν· ἐν ᾧ δ’ ἄν τις τολμᾷ, ἐν ἀφροσύνῃ λέγω, τολμῶ κἀγώ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/021.yaml
  text: I say this to our shame[a], as though we had been weak[d][c][b]. Yet in whatever anyone dares to boast—I am speaking foolishly—I also dare.
translation:
  language: vi
  text: Tôi nói điều này, thật nhục nhã cho chúng tôi[a], như thể chúng tôi đã yếu đuối[b]. Nhưng về bất cứ điều gì người khác dám khoe mình—tôi nói trong sự dại dột[c]—thì tôi cũng dám khoe mình.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Tôi nói điều này theo cách nhục nhã” hoặc “Tôi nói điều này như một điều đáng hổ thẹn.” Cụm từ Hy Lạp này khó hiểu và có thể được hiểu theo nhiều cách.'
    reason: lexical_alternative
  - marker: b
    text: 'Hoặc: “như thể chúng tôi yếu đuối.” Trong ngữ cảnh này, Phao-lô nói với giọng mỉa mai.'
    reason: lexical_alternative
  - marker: c
    text: 'Hoặc: “tôi nói như một kẻ dại.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ ἀτιμίαν
  choice: như thể đó là nỗi nhục của chúng tôi
  rationale: Cụm từ khó và mang sắc thái thành ngữ. Cách dịch này giữ được ý nhục nhã/mất danh dự gắn với Phao-lô và các cộng sự trong lời nhượng bộ đầy mỉa mai, đồng thời vẫn tự nhiên trong tiếng Việt.
- source_word: ὡς ὅτι ἡμεῖς ἠσθενήκαμεν
  choice: dường như chúng tôi đã tỏ ra yếu đuối
  rationale: ὡς ὅτι trình bày điều được nói theo vẻ bề ngoài hoặc như một lời nhượng bộ mỉa mai; động từ hoàn thành ἠσθενήκαμεν được diễn đạt bằng “đã tỏ ra yếu đuối” để truyền đạt tình trạng được nhìn nhận là yếu thế mà không biến câu thành một lời thú nhận đơn thuần.
- source_word: ἐν ᾧ δ’ ἄν τις τολμᾷ
  choice: nhưng bất cứ điều gì người khác dám khoe
  rationale: ἐν ᾧ chỉ phạm vi hay phương diện; “khoe” được bổ sung từ ngữ cảnh trực tiếp về sự khoe mình, giúp câu rõ nghĩa trong tiếng Việt nhưng không thay đổi nội dung hàm ẩn.
- source_word: ἐν ἀφροσύνῃ λέγω
  choice: tôi nói như một kẻ dại
  rationale: Giữ lời tự nhận mang tính tu từ của Phao-lô, đồng thời phản ánh danh từ ἀφροσύνη và tạo câu tiếng Việt tự nhiên, trang trọng.
- source_word: τολμῶ κἀγώ
  choice: thì tôi cũng dám
  rationale: Giữ sự lặp lại của τολμάω và thế đối xứng với “người khác dám”; đối tượng “khoe” đã được nêu ở vế trước nên không cần lặp lại.
theological_decisions:
- issue: Lối nói mỉa mai về sự yếu đuối của Phao-lô và các cộng sự
  choice: Giữ câu như một lời nhượng bộ mỉa mai về việc họ bị xem là yếu đuối
  alternative: Dịch như lời thừa nhận thẳng rằng họ thực sự yếu đuối
  rationale: Ngữ cảnh của “bài nói như kẻ dại” đối lập Phao-lô với những người khoe mình. “Dường như chúng tôi đã tỏ ra yếu đuối” giữ được khoảng cách tu từ mà không phủ nhận chủ đề yếu đuối thật của Phao-lô ở những chỗ khác.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dấu hai chấm và gạch ngang làm rõ hai lời chen mang tính tu từ. Cách xưng “tôi/chúng tôi” phù hợp với diễn ngôn thư tín; không thêm thuật ngữ giáo phái.
