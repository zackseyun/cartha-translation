id: 2CO.11.27
reference: 2 Corinthians 11:27
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸀κόπῳ καὶ μόχθῳ, ἐν ἀγρυπνίαις πολλάκις, ἐν λιμῷ καὶ δίψει, ἐν νηστείαις πολλάκις, ἐν ψύχει καὶ γυμνότητι·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/027.yaml
  text: in labor and hardship[a], in many sleepless nights, in hunger and thirst, in frequent fastings[b], in cold and exposure.
translation:
  language: vi
  text: trong lao nhọc và gian khổ, nhiều lần mất ngủ, chịu đói khát, nhiều lần nhịn ăn[a], chịu rét và không đủ áo che thân[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “nhiều lần kiêng ăn.” Từ Hy Lạp có thể chỉ những lần không ăn lặp đi lặp lại; bản văn không nói rõ đó là việc tự nguyện hay do hoàn cảnh bắt buộc.
    reason: lexical_alternative
  - marker: b
    text: Hay “trần trụi.” Ở đây có thể hiểu là không đủ quần áo và phải phơi mình trước thời tiết.
    reason: lexical_alternative
lexical_decisions:
- source_word: κόπῳ
  choice: lao nhọc
  rationale: Diễn đạt công việc nặng nhọc, tốn nhiều sức, đồng thời kết hợp tự nhiên với μόχθῳ trong chuỗi gian truân.
- source_word: μόχθῳ
  choice: gian khổ
  rationale: Giữ sắc thái khốn khó, nhọc nhằn đi kèm lao động và tránh đồng nhất từ này với κόπῳ.
- source_word: ἐν ἀγρυπνίαις πολλάκις
  choice: nhiều lần mất ngủ
  rationale: ἀγρυπνία chỉ tình trạng thức hoặc không ngủ; cách dịch này tự nhiên trong tiếng Việt và không mặc nhiên quy nguyên nhân cho việc canh thức có chủ ý.
- source_word: ἐν λιμῷ καὶ δίψει
  choice: chịu đói khát
  rationale: Diễn đạt tự nhiên hai tình trạng thiếu thốn mà Phao-lô phải chịu, đồng thời giữ cấu trúc liệt kê cô đọng.
- source_word: ἐν νηστείαις πολλάκις
  choice: nhiều lần nhịn ăn
  rationale: νηστεία chỉ việc không ăn hoặc kiêng ăn. “Nhịn ăn” giữ được sự phân biệt với λιμός là đói và ít áp đặt hơn về việc đó là tự nguyện hay do hoàn cảnh.
- source_word: ἐν ψύχει
  choice: chịu rét
  rationale: ψῦχος là cái lạnh được trải chịu; “chịu rét” là cách nói tự nhiên, rõ nghĩa trong tiếng Việt hiện đại.
- source_word: γυμνότητι
  choice: không đủ áo che thân
  rationale: Trong danh mục gian khổ này, từ có thể nói đến tình trạng thiếu quần áo và bị phơi ra trước thời tiết; cách dịch truyền đạt rõ nghĩa theo ngữ cảnh mà không khẳng định Phao-lô hoàn toàn khỏa thân.
theological_decisions:
- issue: Ý nghĩa của νηστείαις trong danh mục gian khổ
  choice: nhịn ăn
  alternative: kiêng ăn; thiếu ăn do hoàn cảnh
  rationale: Bản văn phân biệt νηστείαις với λιμῷ đã nhắc đến cơn đói, nhưng không cho biết những lần không ăn này là thực hành tự nguyện hay sự thiếu thốn bị áp đặt. Bản dịch và chú thích giữ nguyên điểm chưa xác định đó.
- issue: Sắc thái của γυμνότητι
  choice: không đủ áo che thân
  alternative: trần trụi
  rationale: Ngữ cảnh chịu rét khiến nghĩa thiếu quần áo, phơi mình trước thời tiết trở nên phù hợp; nghĩa trực tiếp hơn là “trần trụi” vẫn được bảo lưu trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Nhịp liệt kê dồn dập của nguyên văn được giữ bằng các cụm ngắn; “chịu” được dùng vừa đủ để chuỗi gian khổ tự nhiên trong tiếng Việt mà không làm câu nặng nề.
