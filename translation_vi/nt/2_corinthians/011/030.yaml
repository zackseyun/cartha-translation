  text: If I must boast[a], I will boast in the things of my weakness.
translation:
  language: vi
  text: Nếu phải khoe mình, tôi sẽ khoe về những điều liên quan đến sự yếu đuối của tôi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát hơn: “tôi sẽ khoe về những điều thuộc về sự yếu đuối của tôi.” Cũng có thể diễn đạt gọn hơn: “tôi sẽ khoe về những điểm yếu của mình.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰ
  choice: Nếu
  rationale: Giữ nguyên hình thức điều kiện và sắc thái tu từ của câu Hy Lạp, không diễn giải thành quan hệ nguyên nhân như “vì” hay “bởi lẽ”.
- source_word: καυχᾶσθαι / καυχήσομαι
  choice: khoe mình / tôi sẽ khoe
  rationale: “Khoe mình” diễn đạt tự nhiên ý của καυχάομαι trong văn cảnh tranh luận về sự khoe khoang; ở vế sau dùng “khoe” để câu tiếng Việt không nặng nề nhưng vẫn giữ phép lặp từ.
- source_word: δεῖ
  choice: phải
  rationale: Diễn đạt ngắn gọn và đúng sức nặng của động từ chỉ sự cần thiết.
- source_word: τὰ τῆς ἀσθενείας μου
  choice: những điều cho thấy sự yếu đuối của tôi
  rationale: Cụm danh từ số nhiều với sở hữu cách nói đến những sự việc thuộc về hoặc biểu lộ sự yếu đuối của Phao-lô. Cách dịch này giữ số nhiều và dễ hiểu hơn lối dịch sát chữ “những điều của sự yếu đuối tôi”.
- source_word: ἀσθενείας
  choice: sự yếu đuối
  rationale: Bao quát tình trạng yếu thế, giới hạn và những hoàn cảnh nhục nhã trong văn cảnh, không thu hẹp vào bệnh tật thể chất.
theological_decisions:
- issue: Bản chất lời khoe mình của Phao-lô
  choice: 'Giữ nghịch lý tu từ: nếu phải khoe, ông sẽ khoe về những điều biểu lộ sự yếu đuối của mình.'
  alternative: Diễn giải trực tiếp thành “tôi sẽ khoe về những điểm yếu của mình” hoặc giải thích ý nghĩa thần học của sự yếu đuối ngay trong câu.
  rationale: Bản Hy Lạp đặt sự khoe mình và sự yếu đuối cạnh nhau một cách căng thẳng. Bản dịch giữ nghịch lý ấy mà không thêm lời giải thích giáo lý.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. “Khoe mình” phù hợp với ngôn ngữ Kinh Thánh quen thuộc nhưng vẫn tự nhiên; “những điều cho thấy sự yếu đuối” làm rõ thành ngữ Hy Lạp mà không xóa bỏ nghịch lý của câu.
