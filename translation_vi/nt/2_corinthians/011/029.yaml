  terminology: 'Các thuật ngữ chủ chốt nhất quán và phù hợp: “yếu đuối,” “vấp ngã,” và “bừng cháy.” Chú thích giải thích đúng rằng động từ “cháy” là ẩn dụ và nêu các sắc thái khả dĩ mà không biến một sắc thái thành nghĩa duy nhất của chính văn.'
