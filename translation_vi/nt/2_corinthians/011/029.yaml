id: 2CO.11.29
reference: 2 Corinthians 11:29
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τίς ἀσθενεῖ, καὶ οὐκ ἀσθενῶ; τίς σκανδαλίζεται καὶ οὐκ ἐγὼ πυροῦμαι;
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/029.yaml
  text: Who is weak[a], and I am not weak? Who is caused to stumble, and I do not burn with indignation?
translation:
  language: vi
  text: Ai yếu đuối mà tôi lại không yếu đuối? Ai bị làm cho vấp ngã mà tôi lại không bừng cháy[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn là “cháy”; đây là một ẩn dụ có thể diễn tả nỗi đau sâu sắc, lòng nhiệt thành hoặc sự phẫn nộ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσθενεῖ / ἀσθενῶ
  choice: yếu đuối / yếu đuối
  rationale: Giữ phạm vi nghĩa rộng của động từ Hy Lạp, có thể chỉ sự yếu đuối về thể chất, xã hội hoặc thuộc linh; đồng thời diễn tả sự đồng cảm sâu xa của Phao-lô.
- source_word: σκανδαλίζεται
  choice: bị làm cho vấp ngã
  rationale: Dạng bị động và hình ảnh vấp ngã được giữ lại, không thu hẹp nghĩa thành chỉ bị xúc phạm hay phạm tội.
- source_word: πυροῦμαι
  choice: bừng cháy
  rationale: Giữ nguyên ẩn dụ mạnh của nguyên ngữ và tránh quyết định thay bản văn rằng cảm xúc ấy nhất thiết là phẫn nộ, đau buồn hay nhiệt thành.
- source_word: καὶ οὐκ ἐγὼ
  choice: mà tôi lại không
  rationale: Cấu trúc câu hỏi tu từ tự nhiên trong tiếng Việt, đồng thời thể hiện sự nhấn mạnh vào chính Phao-lô.
theological_decisions:
- issue: Bản chất cảm xúc của Phao-lô trong πυροῦμαι
  choice: Giữ ẩn dụ “bừng cháy” trong chính văn
  alternative: bừng cháy vì phẫn nộ; đau đớn trong lòng; nóng lòng
  rationale: Nguyên ngữ diễn tả sự xao động nội tâm mãnh liệt nhưng không xác định duy nhất đó là phẫn nộ, đau buồn hay nhiệt thành. Cách dịch này bảo tồn sự mơ hồ và sức căng mục vụ của câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Hai câu hỏi tu từ được giữ song song; “lại” giúp diễn đạt tự nhiên sắc thái nhấn mạnh của đại từ ἐγώ trong tiếng Việt.
