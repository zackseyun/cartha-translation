  naturalness: “Và chẳng có gì lạ” và “cải trang thành” là tiếng Việt phổ thông, trang trọng vừa phải, tự nhiên trong văn mạch Kinh Thánh. “Thiên sứ của ánh sáng” giữ được hình ảnh nguyên văn. Bỏ “cũng” làm câu gọn và trực tiếp hơn; “một thiên sứ” là cách nói tự nhiên.
