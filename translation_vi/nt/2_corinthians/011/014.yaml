  to: Và chẳng có gì lạ[a], vì chính Sa-tan cải trang thành một thiên sứ của ánh sáng.
  rationale: Chỉnh sửa tối thiểu để loại bỏ yếu tố “cũng” không được thể hiện trực tiếp trong câu nguồn, đồng thời thêm “một” cho danh từ bất định ἄγγελον. Giữ “cải trang thành” để phản ánh cách dùng theo ngữ cảnh lừa dối, và giữ chú thích về cách dịch sát hơn của μετασχηματίζεται.
