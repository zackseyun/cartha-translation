source:
  edition: SBLGNT
  text: καὶ οὐ ⸀θαῦμα, αὐτὸς γὰρ ὁ Σατανᾶς μετασχηματίζεται εἰς ἄγγελον φωτός·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/014.yaml
  text: And no wonder[a], for Satan himself disguises himself as an angel of light.
translation:
  language: vi
  text: Và chẳng có gì lạ[a], vì chính Sa-tan cải trang thành một thiên sứ của ánh sáng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Và không có gì đáng ngạc nhiên”; hoặc dịch sát hơn phần sau: “vì chính Sa-tan thay đổi hình dạng thành một thiên sứ của ánh sáng.” Động từ Hy Lạp có nghĩa sát là “thay đổi hình dạng”, nhưng trong ngữ cảnh này có lẽ chỉ vẻ ngoài nhằm lừa dối.'
    reason: Nêu cách diễn đạt tương đương của thành ngữ và bảo lưu khả năng dịch sát hơn của μετασχηματίζεται.
lexical_decisions:
- source_word: καὶ
  choice: Và
  rationale: Giữ liên từ nối câu này với lập luận ở câu trước một cách tự nhiên.
- source_word: οὐ θαῦμα
  choice: chẳng có gì lạ
  rationale: Diễn đạt thành ngữ Hy Lạp theo tiếng Việt hiện đại, giữ nghĩa “không đáng ngạc nhiên”.
- source_word: αὐτὸς ... ὁ Σατανᾶς
  choice: chính Sa-tan
  rationale: “Chính” thể hiện sắc thái nhấn mạnh của αὐτός; mạo từ Hy Lạp trước tên riêng không cần dịch riêng.
- source_word: γὰρ
  choice: vì
  rationale: Nêu lý do giải thích tại sao điều vừa nói không có gì lạ.
- source_word: μετασχηματίζεται
  choice: cải trang
  rationale: Trong ngữ cảnh nói về sự lừa dối, từ này chỉ việc thay đổi dáng vẻ hay hình thức biểu hiện; “cải trang” tự nhiên và không khẳng định một sự biến đổi bản thể.
- source_word: εἰς
  choice: thành
  rationale: Đi với “cải trang”, “thành” diễn tả dáng vẻ hay vai trò được mang lấy, đồng thời giữ được sắc thái nguyên văn.
- source_word: ἄγγελον
  choice: thiên sứ
  rationale: Ngữ cảnh siêu nhiên xác định nghĩa là thiên sứ, không chỉ là một sứ giả loài người.
- source_word: φωτός
  choice: của ánh sáng
  rationale: Giữ cấu trúc sở hữu và hình ảnh ánh sáng của nguyên văn.
theological_decisions:
- issue: Bản chất sự thay đổi của Sa-tan
  choice: Diễn đạt là “cải trang thành”, nhấn mạnh vẻ ngoài lừa dối.
  alternative: “biến đổi thành” hoặc “thay hình đổi dạng thành”, có thể được hiểu là một sự biến đổi thực sự.
  rationale: Ngữ cảnh nói về các sứ đồ giả đội lốt và hành vi lừa dối. Tuy vậy, vì động từ Hy Lạp có thể được dịch sát hơn là thay đổi hình dạng, phương án ấy được ghi trong chú thích thay vì bị loại bỏ.
translation_notes:
  register: Tiếng Việt phổ thông hiện đại, trang trọng nhưng dễ hiểu. Dùng “Sa-tan” và “thiên sứ” theo văn phong Kinh Thánh quen thuộc; tránh diễn giải giáo phái và bảo lưu nét mơ hồ từ vựng trong chú thích.
