id: 2CO.11.12
reference: 2 Corinthians 11:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ὃ δὲ ποιῶ καὶ ποιήσω, ἵνα ἐκκόψω τὴν ἀφορμὴν τῶν θελόντων ἀφορμήν, ἵνα ἐν ᾧ καυχῶνται εὑρεθῶσιν καθὼς καὶ ἡμεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/012.yaml
  text: But what I am doing[a], I will continue to do, in order to cut off the opportunity from those who want an opportunity, so that in what they boast about they may be found to be just as we are.
translation:
  language: vi
  text: Nhưng điều tôi đang làm, tôi sẽ tiếp tục làm, để cắt đứt cơ hội[a] của những người muốn có cơ hội, hầu cho trong điều họ khoe khoang, họ cũng được thấy là như chúng tôi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch là “dịp” hoặc “cớ” ở cả hai chỗ có từ “cơ hội” (Hy Lạp: ἀφορμή).'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὃ δὲ ποιῶ καὶ ποιήσω
  choice: Nhưng điều tôi đang làm, tôi sẽ tiếp tục làm
  rationale: Thì hiện tại ποιῶ kết hợp với thì tương lai ποιήσω diễn tả việc Phao-lô hiện đang làm và quyết tâm tiếp tục làm; cách dịch này diễn đạt tự nhiên sắc thái ấy trong tiếng Việt.
- source_word: ἐκκόψω
  choice: cắt đứt
  rationale: Giữ hình ảnh mạnh của ἐκκόπτω, vốn có nghĩa đen là cắt bỏ hoặc cắt lìa, đồng thời phù hợp với nghĩa ẩn dụ là loại bỏ khả năng hay cơ sở hành động.
- source_word: ἀφορμή
  choice: cơ hội
  rationale: ἀφορμή có thể chỉ cơ hội, dịp hoặc cớ. “Cơ hội” giữ nghĩa tương đối trung tính và đủ rộng, không áp đặt trước rằng điều các đối thủ tìm kiếm nhất thiết là một cái cớ gian trá.
- source_word: τῶν θελόντων ἀφορμήν
  choice: của những người muốn có cơ hội
  rationale: Giữ lại sự lặp có chủ ý của ἀφορμή và diễn đạt trực tiếp cấu trúc phân từ θελόντων mà vẫn dễ hiểu trong tiếng Việt.
- source_word: ἐν ᾧ καυχῶνται
  choice: trong điều họ khoe khoang
  rationale: Diễn đạt phạm vi hoặc vấn đề mà họ lấy làm điều khoe mình, đồng thời giữ cấu trúc tương đối khá mở của nguyên văn.
- source_word: εὑρεθῶσιν καθὼς καὶ ἡμεῖς
  choice: họ được nhận thấy là cũng như chúng tôi
  rationale: Giữ thể bị động và sắc thái khả năng/mục đích của εὑρεθῶσιν, cũng như lực so sánh của καθὼς καὶ ἡμεῖς, mà không giải thích thêm họ giống nhau ở phương diện nào.
theological_decisions:
- issue: Tính chất của ἀφορμή mà các đối thủ tìm kiếm
  choice: Dịch trung tính là “cơ hội” trong chính văn.
  alternative: “cớ” hoặc “dịp”
  rationale: Dù văn cảnh mang tính tranh luận và có thể hàm ý một cái cớ, bản thân danh từ ἀφορμή không bắt buộc sắc thái tiêu cực ấy. Cách dịch trung tính giữ nguyên khoảng nghĩa và để văn cảnh cung cấp sự đánh giá.
- issue: Ý nghĩa chính xác của việc các đối thủ “được nhận thấy là cũng như chúng tôi”
  choice: Giữ nguyên phép so sánh mở, không bổ sung phương diện giống nhau.
  alternative: Diễn giải rằng họ muốn được xem là ngang hàng với Phao-lô và các cộng sự trong một phương diện cụ thể, chẳng hạn việc phục vụ không nhận thù lao.
  rationale: Câu Hy Lạp không nói rõ ngay trong mệnh đề này phương diện so sánh; việc bổ sung một cách giải thích cụ thể sẽ thu hẹp sự mơ hồ thật có của bản văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ sự lặp của “cơ hội” và cấu trúc mục đích kép của câu Hy Lạp; dùng “khoe khoang” để chuyển tải sắc thái của καυχάομαι trong văn cảnh tranh luận.
