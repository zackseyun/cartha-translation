review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch giữ đúng cấu trúc chính của nguyên văn: hành động hiện tại đi với quyết tâm tương lai, mục đích kép ἵνα, sự lặp lại của ἀφορμή, và phép so sánh chưa xác định phương diện ở cuối câu. “Cắt đứt cơ hội” chuyển tải hợp lý hình ảnh ἐκκόψω theo nghĩa ẩn dụ; chú thích cũng bảo tồn các khả năng nghĩa của ἀφορμή.'
  naturalness: Câu “họ được nhận thấy là cũng như chúng tôi” không tự nhiên trong tiếng Việt hiện đại, đặc biệt tổ hợp “là cũng như”. Có thể giữ thể bị động và tính mở của nguyên văn bằng “họ cũng được thấy là như chúng tôi”, vốn rõ và trôi chảy hơn.
  terminology: “Cơ hội” là lựa chọn trung tính thích hợp cho cả hai lần ἀφορμή và việc lặp lại từ này phản ánh dụng ý của câu Hy Lạp. “Khoe khoang” phù hợp với καυχῶνται trong văn cảnh tranh luận. Chú thích “dịp” hoặc “cớ” là các thay thế hợp lệ, không áp đặt cách hiểu giáo phái.
  issues:
  - severity: low
    issue: Cụm “được nhận thấy là cũng như chúng tôi” gượng và không theo cú pháp tự nhiên của tiếng Việt hiện đại.
    rationale: Nguyên văn εὑρεθῶσιν καθὼς καὶ ἡμεῖς cần giữ ý bị động “được thấy/được nhận ra” và so sánh “như chúng tôi”, nhưng “là cũng như” làm câu khó đọc mà không tăng độ chính xác.
