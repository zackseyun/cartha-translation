id: 2CO.11.32
reference: 2 Corinthians 11:32
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐν Δαμασκῷ ὁ ἐθνάρχης Ἁρέτα τοῦ βασιλέως ἐφρούρει τὴν ⸂πόλιν Δαμασκηνῶν⸃ πιάσαι ⸀με,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/032.yaml
  text: In Damascus[a], the ethnarch of King Aretas was guarding the city of the Damascenes in order to seize me,
translation:
  language: vi
  text: Tại Đa-mách, tổng trấn của vua A-rê-ta canh giữ thành của người Đa-mách[a] để bắt tôi,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “thành Đa-mách.” Tiếng Hy Lạp sát nghĩa hơn là “thành của người Đa-mách.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν Δαμασκῷ
  choice: Tại Đa-mách
  rationale: Giới từ ἐν với cách dữ chỉ địa điểm; “tại Đa-mách” tự nhiên và trang trọng trong tiếng Việt.
- source_word: ἐθνάρχης
  choice: tổng trấn
  rationale: Từ này chỉ người cai trị một dân hoặc một khu vực. “Tổng trấn” giữ sắc thái chức vị lịch sử tốt hơn từ khái quát “quan cai trị”, đồng thời dễ hiểu hơn dạng phiên âm chuyên môn.
- source_word: Ἁρέτα τοῦ βασιλέως
  choice: của vua A-rê-ta
  rationale: Cấu trúc sở hữu cách gắn vị tổng trấn với vua A-rê-ta; cách dịch này gần hình thức Hy Lạp mà vẫn tự nhiên.
- source_word: ἐφρούρει
  choice: canh giữ
  rationale: Thì chưa hoàn thành diễn tả hành động đang kéo dài trong quá khứ; trong mạch câu, “canh giữ” truyền đạt việc kiểm soát thành nhằm bắt Phao-lô.
- source_word: τὴν πόλιν Δαμασκηνῶν
  choice: thành của người Đa-mách
  rationale: Giữ cách diễn đạt đặc thù của bản Hy Lạp, trong đó Δαμασκηνῶν là sở hữu cách số nhiều, nghĩa đen là “của những người Đa-mách”.
- source_word: πιάσαι με
  choice: để bắt tôi
  rationale: Động từ nguyên mẫu chỉ mục đích. “Bắt” bao quát ý tóm giữ mà không xác định quá mức đây là thủ tục bắt giữ chính thức.
theological_decisions: []
