    reason: alternative_reading
lexical_decisions:
- source_word: ὑπὸ Ἰουδαίων
  choice: bị người Do Thái đánh
  rationale: Ὑπό với sở hữu cách chỉ tác nhân. Cách diễn đạt này tự nhiên trong tiếng Việt và xác định người thực hiện hình phạt, nhưng không thêm ý rằng đó là một cơ quan cầm quyền cụ thể.
- source_word: πεντάκις
  choice: Năm lần
  rationale: Diễn đạt trực tiếp số lần Phao-lô đã trải qua hình phạt, đồng thời giữ vị trí nhấn mạnh ở đầu câu.
- source_word: τεσσεράκοντα παρὰ μίαν
  choice: bốn mươi roi bớt một
  rationale: Giữ nguyên lối nói của tiếng Hy Lạp là “bốn mươi trừ/bớt một” thay vì chuyển thẳng thành “ba mươi chín”; “roi” được bổ sung để làm rõ loại hình phạt vốn được hàm ý trong ngữ cảnh.
- source_word: ἔλαβον
  choice: tôi bị … đánh
  rationale: Động từ λαμβάνω ở đây nói đến việc nhận hoặc chịu hình phạt. Cấu trúc bị động “bị … đánh” tự nhiên hơn “nhận … roi” trong tiếng Việt và truyền đạt đúng sự việc.
theological_decisions:
- issue: Phạm vi của danh từ Ἰουδαίων
  choice: người Do Thái
  alternative: nhà chức trách Do Thái
  rationale: Bản Hy Lạp chỉ nêu người Do Thái là tác nhân, không xác định một hội đồng hay cơ quan chính quyền cụ thể; vì vậy không thêm “nhà chức trách” vào chính văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc “bị … đánh … roi” là cách nói tự nhiên trong tiếng Việt; cụm “bốn mươi roi bớt một” cố ý giữ hình thức và sắc thái của nguyên văn.
