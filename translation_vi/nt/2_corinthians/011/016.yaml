  text: Πάλιν λέγω, μή τίς με δόξῃ ἄφρονα εἶναι— εἰ δὲ μή γε, κἂν ὡς ἄφρονα δέξασθέ με, ἵνα κἀγὼ μικρόν τι καυχήσωμαι·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/016.yaml
  text: Again I say[a], let no one think me to be foolish—but if not, then receive me even as foolish, so that I too may boast a little.
translation:
  language: vi
  text: 'Tôi lại nói[a]: đừng ai cho rằng tôi là người dại dột. Nhưng nếu không, thì hãy cứ tiếp nhận tôi như một người dại dột, để tôi cũng có thể khoe mình đôi chút.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “đừng ai cho rằng tôi dại dột ... hãy tiếp nhận tôi dù là người dại dột.” Từ Hy Lạp ἄφρων có thể được hiểu là tính từ (“dại dột”) hoặc danh từ (“người dại dột”).'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάλιν λέγω
  choice: Tôi xin nói lại
  rationale: Diễn đạt tự nhiên lời nhắc lại của Phao-lô; “xin” phù hợp với sắc thái khẩn khoản của lời kêu gọi trong ngữ cảnh mà không làm thay đổi nội dung.
- source_word: μή τίς με δόξῃ ἄφρονα εἶναι
  choice: đừng ai cho rằng tôi là người dại dột
  rationale: Cấu trúc μή với động từ giả định mang lực ngăn cấm hoặc khẩn khoản; “cho rằng” phản ánh δοκέω, còn “người dại dột” truyền đạt ἄφρων tự nhiên trong tiếng Việt.
- source_word: εἰ δὲ μή γε
  choice: Nhưng nếu không thể nghĩ khác về tôi
  rationale: Cụm Hy Lạp rút gọn chuyển sang phương án nhượng bộ nếu độc giả không làm theo yêu cầu vừa nêu. Bổ sung phần được tỉnh lược giúp câu rõ ràng trong tiếng Việt mà không quyết định thêm nội dung ngoài ngữ cảnh.
- source_word: κἂν ὡς ἄφρονα δέξασθέ με
  choice: thì hãy cứ tiếp nhận tôi như một người dại dột
  rationale: “Hãy cứ” thể hiện sắc thái nhượng bộ của κἂν; “tiếp nhận” giữ được tính trực tiếp của δέχομαι và “như một người dại dột” duy trì cách tự mô tả đầy mỉa mai.
- source_word: ἵνα κἀγὼ μικρόν τι καυχήσωμαι
  choice: để tôi cũng được khoe mình một chút
  rationale: “Để” biểu đạt mục đích của ἵνα, “cũng” giữ κἀγώ, còn “khoe mình” bảo toàn ngôn ngữ καυχάομαι thay vì làm nhẹ thành lời tự biện hộ.
theological_decisions:
- issue: Lối tự mô tả mỉa mai của Phao-lô bằng ἄφρων và lời nói về sự khoe mình
  choice: Giữ nguyên ngôn ngữ “người dại dột” và “khoe mình”
  alternative: Làm nhẹ thành “ăn nói thiếu khôn ngoan” hoặc “tự bênh vực mình”
  rationale: Phao-lô tạm chấp nhận dáng vẻ dại dột để bước vào phần khoe mình bất đắc dĩ. Bản dịch cần giữ sự căng thẳng và mỉa mai này, không giải thích thay tác giả.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “tôi” theo lời trực tiếp của Phao-lô; cấu trúc câu giữ nhịp chuyển mạnh từ lời ngăn cản sang sự nhượng bộ.
