    issue: Diễn giải εἰ δὲ μή γε quá mức
    rationale: “Nếu không thể nghĩ khác về tôi” không chỉ diễn đạt “nếu không” mà còn thêm ý “không thể” và xác định rõ nội dung của mệnh đề tỉnh lược. Nguyên văn cố ý ngắn gọn; bản dịch nên bảo lưu sự tỉnh lược ấy.
  - severity: low
    issue: Thêm sắc thái trong “xin”
    rationale: λέγω là “tôi nói”; “xin” làm lời nói thành một lời thỉnh cầu rõ hơn mức nguyên văn.
