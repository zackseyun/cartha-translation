base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/028.yaml
  text: 'Apart from such external things[c][b][a], there is the daily pressure on me: concern for all the churches.'
translation:
  language: vi
  text: 'Ngoài những điều khác[a], mỗi ngày còn có áp lực đè nặng lên tôi[b]: nỗi bận tâm về tất cả các hội thánh[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Ngoài những điều ở bên ngoài” hoặc “Ngoài những điều chưa kể đến.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “gánh nặng hằng ngày của tôi” hoặc “điều dồn ép tôi mỗi ngày.”'
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “nỗi lo âu cho tất cả các hội thánh” hoặc “sự chăm lo cho tất cả các hội thánh.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: χωρὶς τῶν παρεκτὸς
  choice: Ngoài những điều khác
  rationale: Cụm từ chỉ những điều nằm ngoài hoặc chưa được kể trong danh sách gian khổ vừa nêu. Cách dịch này tự nhiên trong tiếng Việt và không buộc phải hiểu παρεκτός chỉ là những gian khổ “bên ngoài” theo nghĩa đối lập với nội tâm.
- source_word: ἐπίστασίς μοι
  choice: có áp lực đè nặng trên tôi
  rationale: ἐπίστασις có thể chỉ sự dồn ép hoặc áp lực. Trong ngữ cảnh, nghĩa ẩn dụ phù hợp hơn hình ảnh một đám đông vây ép; μοι được diễn đạt bằng “trên tôi” để giữ sắc thái điều Phao-lô phải gánh chịu.
- source_word: ἡ καθ’ ἡμέραν
  choice: mỗi ngày
  rationale: Cụm này bổ nghĩa cho ἐπίστασις và diễn tả áp lực lặp lại hằng ngày. “Mỗi ngày” là cách nói rõ ràng, tự nhiên trong tiếng Việt hiện đại.
- source_word: ἡ μέριμνα
  choice: nỗi bận tâm
  rationale: μέριμνα có thể mang nghĩa sự quan tâm, lo lắng hoặc nỗi lo. “Nỗi bận tâm” giữ được sức nặng tình cảm và trách nhiệm mục vụ mà không mặc nhiên gán cho Phao-lô một sự lo âu sai trái.
- source_word: πασῶν τῶν ἐκκλησιῶν
  choice: về tất cả các hội thánh
  rationale: Trong cách dùng của Phao-lô, ἐκκλησία thường chỉ các cộng đồng tín hữu. “Hội thánh” là cách dịch quen thuộc, trang trọng và dễ hiểu; giới từ “về” diễn đạt tự nhiên quan hệ với μέριμνα.
theological_decisions:
- issue: Sắc thái gánh nặng mục vụ của Phao-lô trong μέριμνα
  choice: nỗi bận tâm về tất cả các hội thánh
  alternative: nỗi lo âu cho tất cả các hội thánh; sự chăm lo cho tất cả các hội thánh
  rationale: “Nỗi bận tâm” giữ được cả sự quan tâm sâu sắc lẫn sức nặng nội tâm, nhưng không giải quyết trước liệu từ này thiên về lo âu hay chăm sóc, cũng không đưa vào một phán xét đạo đức không có trong câu.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Cấu trúc câu giữ nhịp chuyển từ những gian khổ đã kể sang áp lực thường xuyên trong nội tâm. “Hội thánh” được dùng nhất quán theo lối gọi quen thuộc trong Tân Ước tiếng Việt.
