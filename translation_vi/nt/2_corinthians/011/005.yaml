  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: λογίζομαι γὰρ μηδὲν ὑστερηκέναι τῶν ὑπερλίαν ἀποστόλων·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/005.yaml
  text: For I consider that I am not in the least inferior to those super-apostles[a].
translation:
  language: vi
  text: Vì tôi cho rằng mình chẳng thua kém chút nào so với những “siêu sứ đồ” ấy.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “những sứ đồ lỗi lạc nhất ấy.” Cụm từ Hy Lạp có thể được hiểu theo lối mỉa mai (“siêu sứ đồ”) hoặc theo nghĩa trực tiếp, chỉ những sứ đồ rất được trọng vọng.'
    reason: alternative_reading
lexical_decisions:
- source_word: λογίζομαι
  choice: tôi cho rằng
  rationale: Diễn đạt tự nhiên ý cân nhắc và nhận định của động từ, đồng thời giữ giọng lập luận của Phao-lô.
- source_word: γὰρ
  choice: Vì
  rationale: Nối câu này với lời giải thích hoặc cơ sở cho ý trước đó trong mạch lập luận.
- source_word: μηδὲν
  choice: chẳng ... chút nào
  rationale: 'Trong cấu trúc với động từ nguyên mẫu, từ này có tác dụng trạng từ nhấn mạnh: không hề hoặc không chút nào.'
- source_word: ὑστερηκέναι
  choice: thua kém
  rationale: Thể hiện rõ ý ở địa vị thấp hơn hoặc thiếu hụt khi so với người khác; cách nói tự nhiên trong tiếng Việt.
- source_word: τῶν ὑπερλίαν ἀποστόλων
  choice: những “siêu sứ đồ” ấy
  rationale: Giữ sắc thái châm biếm có khả năng cao trong ngữ cảnh mà không thêm trực tiếp từ “tự xưng”; dấu ngoặc kép giúp người đọc nhận ra cách gọi mang tính tu từ.
theological_decisions:
- issue: Cụm τῶν ὑπερλίαν ἀποστόλων chỉ các đối thủ của Phao-lô theo lối mỉa mai hay chỉ các sứ đồ được trọng vọng theo nghĩa trực tiếp
  choice: Dịch “những ‘siêu sứ đồ’ ấy” để giữ sắc thái mỉa mai có khả năng cao trong văn cảnh.
  alternative: “những sứ đồ lỗi lạc nhất ấy” hoặc “các sứ đồ rất mực cao trọng” theo cách hiểu trực tiếp.
  rationale: Văn cảnh 2 Cô-rinh-tô 11 thiên về cuộc đối chất với những người phục vụ đối nghịch đang khoe mình hơn Phao-lô. Tuy vậy, bản thân cụm từ Hy Lạp có thể được hiểu theo nghĩa trực tiếp, nên phương án ấy được bảo lưu trong chú thích.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. “Cho rằng” giữ sắc thái nhận định; “chẳng thua kém chút nào” vừa tự nhiên vừa truyền đạt lực nhấn mạnh. Dấu ngoặc kép quanh “siêu sứ đồ” báo hiệu lối gọi tu từ mà không giải quyết dứt khoát sự mơ hồ của nguyên văn.
