revisions:
- from: Vậy, chẳng có gì đáng ngạc nhiên nếu những kẻ phục vụ nó cũng đội lốt những người phục vụ sự công chính[a]. Kết cục của họ sẽ tương xứng với việc họ làm.
  to: Vậy thì, không có gì đáng ngạc nhiên nếu những kẻ phục vụ hắn cũng giả dạng làm những người phục vụ sự công chính[a]. Kết cục của họ sẽ tùy theo những việc họ làm.
