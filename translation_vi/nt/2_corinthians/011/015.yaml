id: 2CO.11.15
reference: 2 Corinthians 11:15
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οὐ μέγα οὖν εἰ καὶ οἱ διάκονοι αὐτοῦ μετασχηματίζονται ὡς διάκονοι δικαιοσύνης, ὧν τὸ τέλος ἔσται κατὰ τὰ ἔργα αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/015.yaml
  text: So it is no great thing if his servants also disguise themselves as servants of righteousness[a], whose end will be according to their works.
translation:
  language: vi
  text: Vậy thì, không có gì đáng ngạc nhiên nếu những kẻ phục vụ hắn cũng giả dạng làm những người phục vụ sự công chính[a]. Kết cục của họ sẽ tùy theo những việc họ làm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “công lý”. Từ Hy Lạp có thể mang nghĩa “sự công chính” hoặc “công lý”; tại đây, cụm từ nói đến vẻ ngoài của những người đứng về phía điều đúng.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ μέγα
  choice: chẳng có gì đáng ngạc nhiên
  rationale: Đây là cách diễn đạt tự nhiên trong tiếng Việt cho thành ngữ Hy Lạp nói rằng điều ấy không có gì lạ hay đáng kinh ngạc.
- source_word: οὖν
  choice: Vậy
  rationale: Giữ quan hệ suy luận với câu trước một cách ngắn gọn và tự nhiên.
- source_word: διάκονοι
  choice: những kẻ/người phục vụ
  rationale: Trong lần xuất hiện thứ nhất, “những kẻ phục vụ nó” thể hiện sắc thái tiêu cực của các tay sai Sa-tan; lần thứ hai, “những người phục vụ” diễn tả vai trò chính trực mà họ giả mạo, đồng thời tránh sắc thái giáo phẩm của “mục sư” hay “thừa tác viên”.
- source_word: μετασχηματίζονται
  choice: đội lốt
  rationale: Diễn tả việc thay đổi dáng vẻ hoặc cách tự trình bày nhằm đánh lừa, chứ không phải sự biến đổi nội tại.
- source_word: ὡς
  choice: những
  rationale: Trong cấu trúc tiếng Việt “đội lốt những người…”, ý nghĩa đảm nhận vẻ ngoài hay vai trò giả tạo của ὡς được truyền đạt tự nhiên.
- source_word: δικαιοσύνης
  choice: sự công chính
  rationale: “Sự công chính” là thuật ngữ tiếng Việt tự nhiên trong văn mạch Phao-lô và ở đây chỉ điều đúng đắn, ngay thẳng mà các kẻ giả mạo tự nhận đại diện.
- source_word: τὸ τέλος
  choice: Kết cục của họ
  rationale: Chỉ kết quả hay số phận cuối cùng chờ đợi họ trong bối cảnh phán xét.
- source_word: κατὰ τὰ ἔργα αὐτῶν
  choice: tương xứng với việc họ làm
  rationale: Giữ ý phán xét tương ứng với hành động, đồng thời dùng cách nói hiện đại, rõ nghĩa hơn lối dịch sát “theo các công việc của họ”.
theological_decisions:
- issue: Cách dịch δικαιοσύνη trong cụm từ của Phao-lô
  choice: sự công chính
  alternative: công lý
  rationale: Ở đây trọng tâm là vẻ ngoài ngay thẳng và phù hợp với điều đúng, không chủ yếu là công lý theo nghĩa tư pháp; tuy vậy, khả năng từ vựng “công lý” được bảo lưu trong chú thích.
- issue: Công thức phán xét κατὰ τὰ ἔργα αὐτῶν
  choice: Kết cục của họ sẽ tương xứng với việc họ làm
  alternative: Kết cục của họ sẽ tùy theo các việc họ làm
  rationale: Bản dịch duy trì sự tương ứng giữa kết cục và hành động mà không diễn giải thêm cơ chế hay nền tảng thần học của sự phán xét.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “nó” tiếp nối trực tiếp Sa-tan ở câu trước và tránh nhân hóa tôn kính; “đội lốt” làm rõ sự giả dạng bên ngoài. Dấu chú thích [a] được đặt ngay sau cụm từ liên quan.
