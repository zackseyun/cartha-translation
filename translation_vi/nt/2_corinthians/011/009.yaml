id: 2CO.11.9
reference: 2 Corinthians 11:9
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ παρὼν πρὸς ὑμᾶς καὶ ὑστερηθεὶς οὐ κατενάρκησα οὐθενός· τὸ γὰρ ὑστέρημά μου προσανεπλήρωσαν οἱ ἀδελφοὶ ἐλθόντες ἀπὸ Μακεδονίας· καὶ ἐν παντὶ ἀβαρῆ ⸂ἐμαυτὸν ὑμῖν⸃ ἐτήρησα καὶ τηρήσω.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/009.yaml
  text: And when I was present with you and was in need[a], I was not a burden to anyone; for the brothers who came from Macedonia supplied what I lacked. And in everything I kept myself from being a burden to you[b], and will keep doing so.
translation:
  language: vi
  text: Khi ở với anh chị em và gặp cảnh thiếu thốn, tôi đã không trở thành gánh nặng cho bất cứ ai[a]; vì các anh em[b] từ Ma-xê-đô-ni-a đến đã cung cấp điều tôi còn thiếu. Trong mọi sự, tôi đã giữ mình khỏi trở thành gánh nặng cho anh chị em, và tôi sẽ tiếp tục làm như vậy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “tôi đã không gây gánh nặng cho bất cứ ai.” Động từ Hy Lạp có thể chỉ việc đè nặng lên người khác hoặc trở thành gánh nặng tài chính cho họ.'
    reason: lexical_alternative
  - marker: b
    text: “Các anh em” dịch một hình thức giống đực số nhiều. Trong một số văn cảnh, Phao-lô có thể dùng từ này rộng hơn để chỉ các tín hữu, nhưng ở đây có lẽ từ này nói đến những cộng sự cụ thể đến từ Ma-xê-đô-ni-a.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρὼν πρὸς ὑμᾶς
  choice: khi ở với anh chị em
  rationale: Phân từ được hiểu theo nghĩa thời gian; cách diễn đạt này tự nhiên trong tiếng Việt và vẫn thể hiện sự hiện diện trực tiếp của Phao-lô giữa cộng đoàn.
- source_word: ὑστερηθεὶς
  choice: gặp cảnh thiếu thốn
  rationale: Phân từ thụ động chỉ tình trạng thiếu hụt, trong văn cảnh là nhu cầu vật chất. “Gặp cảnh thiếu thốn” rõ nghĩa và tự nhiên hơn cách dịch sát chữ.
- source_word: οὐ κατενάρκησα οὐθενός
  choice: tôi đã không trở thành gánh nặng cho bất cứ ai
  rationale: Động từ καταναρκάω ở đây nói đến việc gây gánh nặng, đặc biệt về tài chính; cấu trúc phủ định mạnh được thể hiện bằng “không… bất cứ ai”.
- source_word: τὸ ὑστέρημά μου
  choice: điều tôi còn thiếu
  rationale: Danh từ chỉ phần thiếu hụt hoặc nhu cầu chưa được đáp ứng; cách diễn đạt này giữ nghĩa cụ thể mà không làm câu nặng nề.
- source_word: προσανεπλήρωσαν
  choice: đã cung ứng
  rationale: Động từ có nghĩa bù đắp hoặc cung cấp thêm cho đủ phần còn thiếu; “cung ứng” phù hợp với đối tượng “điều tôi còn thiếu”.
- source_word: οἱ ἀδελφοὶ
  choice: các anh em
  rationale: Hình thức Hy Lạp là giống đực số nhiều và trong văn cảnh có khả năng chỉ những cộng sự cụ thể từ Ma-xê-đô-ni-a, nên giữ cách gọi giống đực trong chính văn.
- source_word: ἐλθόντες ἀπὸ Μακεδονίας
  choice: từ Ma-xê-đô-ni-a đến
  rationale: Chuyển phân từ quá khứ thành cụm bổ nghĩa tự nhiên trong tiếng Việt, đồng thời giữ rõ nơi họ xuất phát.
- source_word: ἐν παντὶ
  choice: trong mọi sự
  rationale: Giữ phạm vi bao quát của cụm Hy Lạp mà không thu hẹp thành riêng phương diện tiền bạc, dù đó là trọng tâm của văn cảnh.
- source_word: ἀβαρῆ ἐμαυτὸν ὑμῖν
  choice: tôi đã giữ mình khỏi trở thành gánh nặng cho anh chị em
  rationale: Tính từ ἀβαρής chỉ tình trạng không gây gánh nặng. Tiếng Việt cần diễn đạt mở rộng để câu rõ và tự nhiên.
- source_word: ἐτήρησα καὶ τηρήσω
  choice: tôi đã giữ mình… và tôi sẽ tiếp tục làm như vậy
  rationale: Thể quá khứ và tương lai cho thấy Phao-lô đã duy trì và sẽ tiếp tục duy trì cách hành xử ấy; “tiếp tục làm như vậy” diễn đạt rõ đối tượng hàm ẩn của động từ thứ hai.
theological_decisions:
- issue: Cách dịch οἱ ἀδελφοὶ theo giới tính
  choice: các anh em
  alternative: các anh chị em; các tín hữu
  rationale: Dạng Hy Lạp là giống đực số nhiều và văn cảnh có thể nói đến một nhóm cộng sự nam cụ thể từ Ma-xê-đô-ni-a. Chính văn vì thế không trung tính hóa, còn chú thích ghi nhận cách dùng rộng hơn có thể có trong thư Phao-lô.
- issue: Phạm vi của ἐν παντί
  choice: trong mọi sự
  alternative: về mọi phương diện
  rationale: Giữ cách nói rộng của nguyên văn, tránh biến lời khẳng định thành một tuyên bố chỉ giới hạn ở tài chính, dù gánh nặng tài chính là ý nổi bật trong ngữ cảnh.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “anh chị em” để xưng hô với toàn thể cộng đoàn Cô-rinh-tô, nhưng dùng “các anh em” cho οἱ ἀδελφοὶ nhằm giữ dấu hiệu giống đực của nguyên văn. Tên địa danh được phiên âm theo lối quen dùng trong Kinh Thánh tiếng Việt.
