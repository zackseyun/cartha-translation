review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch chuyển tải đúng các thành tố chính: γάρ là lời giải thích, ψευδαπόστολοι là các sứ đồ giả, và μετασχηματιζόμενοι chỉ sự tự trình diện giả tạo trong vai trò sứ đồ của Đấng Mê-si. Tuy nhiên, “người làm công” dễ gợi người làm thuê hơn là ἐργάται (“người làm việc/người hoạt động”), nên nên điều chỉnh để sát nghĩa và tự nhiên hơn.'
  naturalness: “Đội lốt” tự nhiên và đúng sắc thái lừa gạt, nhưng “giả dạng làm” mạch lạc hơn trong cấu trúc câu, đồng thời biểu đạt rõ việc họ tự nhận một vai trò không thuộc về mình. “Những kẻ làm việc gian dối” tự nhiên hơn “những người làm công gian dối.”
  terminology: “Sứ đồ giả” phản ánh chính xác ψευδαπόστολοι. “Đấng Mê-si” giữ Χριστοῦ ở bình diện tước hiệu, phù hợp với định hướng thuật ngữ của dự án. Không cần chú thích, vì không có dị bản hoặc mơ hồ văn bản cần giải quyết trong bản dịch tiếng Việt.
  issues:
  - severity: low
    issue: “những người làm công gian dối”
    rationale: Cụm này có thể được hiểu là người làm thuê gian dối và hơi gượng trong tiếng Việt hiện đại. ἐργάται ở đây chỉ những người hoạt động/làm việc, được mô tả bởi tính từ δόλιοι.
  revised_text: Vì những kẻ như thế là các sứ đồ giả, những kẻ làm việc gian dối, giả dạng làm các sứ đồ của Đấng Mê-si.
