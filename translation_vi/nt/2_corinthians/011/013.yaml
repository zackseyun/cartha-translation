id: 2CO.11.13
reference: 2 Corinthians 11:13
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οἱ γὰρ τοιοῦτοι ψευδαπόστολοι, ἐργάται δόλιοι, μετασχηματιζόμενοι εἰς ἀποστόλους Χριστοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/013.yaml
  text: For such men are false apostles[a], deceitful workers, disguising themselves as apostles of Messiah.
translation:
  language: vi
  text: Vì những kẻ như thế là các sứ đồ giả, những kẻ làm việc gian dối, giả dạng làm các sứ đồ của Đấng Mê-si.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γὰρ
  choice: Vì
  rationale: Nối câu này với lập luận trước đó bằng lời giải thích nguyên nhân; “Vì” ngắn gọn và tự nhiên trong tiếng Việt.
- source_word: οἱ τοιοῦτοι
  choice: những kẻ như thế
  rationale: Chỉ hạng người vừa được nói đến; “kẻ” phù hợp với sắc thái lên án rõ rệt của ngữ cảnh.
- source_word: ψευδαπόστολοι
  choice: các sứ đồ giả
  rationale: Diễn đạt trực tiếp danh từ ghép chỉ những người giả mạo hoặc tự nhận sai tư cách sứ đồ.
- source_word: ἐργάται δόλιοι
  choice: những người làm công gian dối
  rationale: Giữ hình ảnh người lao động và đặc tính lừa dối; cách nói rõ nghĩa, tự nhiên với độc giả hiện đại.
- source_word: μετασχηματιζόμενοι
  choice: đội lốt
  rationale: Trong ngữ cảnh, từ này nói đến việc thay đổi vẻ ngoài hay cách tự trình diện nhằm đánh lừa, không phải biến đổi bản chất.
- source_word: εἰς ἀποστόλους Χριστοῦ
  choice: các sứ đồ của Đấng Mê-si
  rationale: Sau động từ chỉ việc cải trang, εἰς diễn tả vai trò mà họ giả nhận; sở hữu cách Χριστοῦ cho biết họ tự xưng là những người được Đấng Mê-si sai phái.
theological_decisions:
- issue: Cách dịch Χριστοῦ
  choice: của Đấng Mê-si
  alternative: của Đấng Christ
  rationale: Ở đây Χριστός vẫn có sức nặng của tước hiệu, nên “Đấng Mê-si” làm rõ ý nghĩa mà không thêm một lập trường hệ phái.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại. “Đội lốt” diễn đạt mạnh và tự nhiên sắc thái giả dạng; “những kẻ như thế” giữ giọng lên án của Phao-lô. Không cần chú thích vì bản dịch chính không tạo ra dị bản văn bản hay độ mơ hồ cần giải thích.
