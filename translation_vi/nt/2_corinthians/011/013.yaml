revisions:
- from: Vì những kẻ như thế là các sứ đồ giả, những người làm công gian dối, đội lốt các sứ đồ của Đấng Mê-si.
  to: Vì những kẻ như thế là các sứ đồ giả, những kẻ làm việc gian dối, giả dạng làm các sứ đồ của Đấng Mê-si.
  rationale: Chỉ thay đổi cách diễn đạt “người làm công” thành “kẻ làm việc” và dùng “giả dạng làm” để câu tiếng Việt tự nhiên hơn, trong khi vẫn giữ nguyên ý nghĩa, giọng lên án, và cách dịch tước hiệu Χριστοῦ là “Đấng Mê-si.”
