source:
  edition: SBLGNT
  text: ὃ λαλῶ οὐ ⸂κατὰ κύριον λαλῶ⸃, ἀλλ’ ὡς ἐν ἀφροσύνῃ, ἐν ταύτῃ τῇ ὑποστάσει τῆς καυχήσεως.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/017.yaml
  text: What I am saying[a], I am not saying according to the Lord, but as in foolishness[c][b], in this confidence of boasting.
translation:
  language: vi
  text: Điều tôi đang nói đây, tôi không nói theo Chúa,[a] nhưng nói như trong sự dại dột,[b] trong sự tự tin này về việc khoe mình.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “tôi không nói điều này như lời đến từ Chúa,” hoặc “theo chuẩn mực của Chúa.”'
    reason: alternative_reading
  - marker: b
    text: 'Cũng có thể dịch: “nhưng như thể trong sự dại dột,” hoặc, tự nhiên hơn: “nhưng như một người dại.”'
    reason: lexical_alternative
  - marker: c
    text: Từ Hy Lạp được dịch là “sự tự tin” cũng có thể có nghĩa là “vấn đề,” “cơ sở” hoặc “việc đảm nhận” trong ngữ cảnh này.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃ λαλῶ
  choice: Điều tôi đang nói đây
  rationale: Diễn đạt tự nhiên trong tiếng Việt, giữ được ý nội dung lời Phao-lô hiện đang nói và sắc thái hiện tại của động từ.
- source_word: οὐ κατὰ κύριον λαλῶ
  choice: tôi không nói theo Chúa
  rationale: 'Giữ sự cô đọng và tính mơ hồ chân thực của κατά: có thể chỉ chuẩn mực, cách thức hoặc thẩm quyền liên hệ đến Chúa, mà không tự ý giải quyết theo một nghĩa duy nhất.'
- source_word: κύριον
  choice: Chúa
  rationale: Trong ngữ cảnh này, κύριος tự nhiên chỉ Chúa Giê-su; không cần thêm tên vào chính văn.
- source_word: ἀλλ’ ὡς ἐν ἀφροσύνῃ
  choice: nhưng nói như trong sự dại dột
  rationale: Giữ cấu trúc so sánh ὡς và giới từ ἐν, tránh biến sắc thái tu từ thành lời khẳng định thẳng rằng Phao-lô là kẻ dại.
- source_word: ἐν ταύτῃ τῇ ὑποστάσει
  choice: với sự tự tin ... này
  rationale: ὑπόστασις ở đây khó xác định, có thể là sự tự tin, cơ sở, vấn đề hay việc đảm nhận. 'Sự tự tin' phù hợp với hành động khoe mình, còn chú thích bảo lưu các khả năng khác.
- source_word: τῆς καυχήσεως
  choice: khoe mình
  rationale: Diễn đạt tự nhiên động thái của καύχησις trong tiếng Việt và kết hợp rõ nghĩa với 'sự tự tin'.
theological_decisions:
- issue: Ý nghĩa và quy chiếu của cụm κατὰ κύριον
  choice: Giữ cách nói 'không nói theo Chúa', để câu có thể nói đến chuẩn mực hoặc cách thức của Chúa.
  alternative: Không nói điều này như lời đến từ Chúa; hoặc không nói theo chuẩn mực của Chúa.
  rationale: Nguyên văn không xác định rõ Phao-lô đang phủ nhận một lời truyền trực tiếp từ Chúa hay đang tách lối khoe mình khỏi cách thức và chuẩn mực của Chúa. Bản dịch không nên biến câu này thành lời phủ nhận thẩm quyền hay tính chân thật của toàn bộ phát biểu.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Chính văn giữ nhịp lập luận có phần gập ghềnh của Phao-lô nhằm bảo tồn căng thẳng tu từ; các khả năng từ vựng quan trọng được đưa vào chú thích.
