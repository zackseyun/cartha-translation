  to: Điều tôi đang nói đây, tôi không nói theo Chúa,[a] nhưng nói như trong sự dại dột,[b] trong sự tự tin này về việc khoe mình.[c]
  rationale: Chỉnh "với" thành "trong" để phản ánh ἐν và giữ thế song song với cụm trước. Điều chỉnh nhẹ cụm danh từ cuối để tiếng Việt tự nhiên hơn và biểu thị rõ "sự tự tin" có liên hệ với "việc khoe mình," đồng thời không giải quyết quá mức nghĩa còn tranh luận của ὑπόστασις. Các chú thích được giữ đủ ba điểm neo a, b, c và được sửa tối thiểu về văn phong.
  reviewer_model: gpt-5.6-terra
