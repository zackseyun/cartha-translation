source:
  edition: SBLGNT
  text: ἄλλας ἐκκλησίας ἐσύλησα λαβὼν ὀψώνιον πρὸς τὴν ὑμῶν διακονίαν,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/008.yaml
  text: I robbed other churches by accepting support for serving you,[a]
translation:
  language: vi
  text: Tôi đã cướp các hội thánh khác bằng cách nhận sự chu cấp để phục vụ anh chị em.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay sát nghĩa hơn: “tiền công” hoặc “tiền lương.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλας ἐκκλησίας
  choice: các hội thánh khác
  rationale: Trong cách dùng của Phao-lô, ἐκκλησία ở đây chỉ các cộng đồng tín hữu địa phương; “hội thánh” là cách diễn đạt tự nhiên và quen thuộc trong tiếng Việt.
- source_word: ἐσύλησα
  choice: đã cướp
  rationale: Động từ συλάω có sắc thái mạnh, nghĩa là cướp bóc hoặc tước đoạt. “Đã cướp” giữ được lối nói cường điệu, mỉa mai có chủ ý của Phao-lô, thay vì làm nhẹ đi thành “đã nhận từ”.
- source_word: λαβὼν
  choice: bằng cách nhận
  rationale: Phân từ bất định quá khứ giải thích phương cách Phao-lô được nói là đã “cướp” các hội thánh khác; “bằng cách nhận” thể hiện rõ quan hệ phương tiện trong tiếng Việt.
- source_word: ὀψώνιον
  choice: sự chu cấp
  rationale: ὀψώνιον theo nghĩa gốc có thể là tiền công, lương hoặc khẩu phần; trong bối cảnh hỗ trợ cho chức vụ, “sự chu cấp” truyền đạt tự nhiên ý trợ giúp tài chính hay vật chất mà không áp đặt quan hệ thuê mướn. Nghĩa sát hơn được ghi ở chú thích.
- source_word: πρὸς τὴν ὑμῶν διακονίαν
  choice: để phục vụ anh chị em
  rationale: πρός với đối cách diễn tả mục đích hoặc hướng đến, còn διακονία chỉ sự phục vụ. Cách dịch này làm rõ rằng Phao-lô nhận sự chu cấp nhằm phục vụ tín hữu Cô-rinh-tô.
theological_decisions:
- issue: Sức nặng tu từ của lời Phao-lô nói về việc nhận trợ giúp từ các hội thánh khác
  choice: Giữ hình ảnh gây sửng sốt “Tôi đã cướp các hội thánh khác” như lối nói mỉa mai/cường điệu.
  alternative: Làm nhẹ thành “Tôi đã nhận sự chu cấp từ các hội thánh khác” hoặc “Tôi đã khiến các hội thánh khác chịu thiệt.”
  rationale: Động từ Hy Lạp có chủ ý mạnh. Ngữ cảnh cho thấy đây không phải lời thú nhận hành vi trộm cướp theo nghĩa đen, nhưng việc làm nhẹ câu chính sẽ đánh mất nét tự hạ và sức phản biện trong lời biện hộ của Phao-lô.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. “Anh chị em” diễn đạt đại từ số nhiều ὑμῶν theo cách bao hàm giới và tự nhiên trong cộng đồng tín hữu; giữ nguyên sắc thái mạnh của “cướp” và giải thích nghĩa gần hơn của ὀψώνιον trong chú thích.
