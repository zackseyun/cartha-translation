  source_fidelity: 'Bản dịch bảo toàn đầy đủ cấu trúc và nội dung Hy Lạp: “Đức Chúa Trời và Cha của Chúa Giê-su” tương ứng ὁ θεὸς καὶ πατὴρ τοῦ κυρίου Ἰησοῦ; mệnh đề tôn tụng quy chiếu rõ về Đức Chúa Trời; οἶδεν và ὅτι οὐ ψεύδομαι được dịch chính xác là “biết rằng tôi không nói dối.” Không thêm “chúng ta” vào tước hiệu Chúa, và không diễn giải lời khẳng định này thành một công thức làm chứng.'
