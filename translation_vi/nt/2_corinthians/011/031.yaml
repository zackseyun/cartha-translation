id: 2CO.11.31
reference: 2 Corinthians 11:31
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ θεὸς καὶ πατὴρ τοῦ κυρίου ⸀Ἰησοῦ οἶδεν, ὁ ὢν εὐλογητὸς εἰς τοὺς αἰῶνας, ὅτι οὐ ψεύδομαι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/031.yaml
  text: The God and Father of the Lord Jesus[a], he who is blessed forever, knows that I am not lying.
translation:
  language: vi
  text: Đức Chúa Trời và Cha của Chúa Giê-su—Đấng đáng chúc tụng đời đời[a]—biết rằng tôi không nói dối.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát nghĩa hơn: “cho đến các thời đại.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ θεὸς καὶ πατὴρ
  choice: Đức Chúa Trời và Cha
  rationale: Giữ nguyên hai danh từ trong công thức Hy Lạp, đồng thời cấu trúc với một mạo từ cho thấy cả hai cùng chỉ về một Đấng.
- source_word: τοῦ κυρίου Ἰησοῦ
  choice: của Chúa Giê-su
  rationale: Dịch κύριος bằng tước hiệu “Chúa”; không thêm “chúng ta” vì nguyên văn không có từ sở hữu ấy.
- source_word: οἶδεν
  choice: biết
  rationale: Giữ nghĩa trực tiếp của động từ, dù trong ngữ cảnh lời khẳng định long trọng, Đức Chúa Trời cũng được viện dẫn như nhân chứng.
- source_word: ὁ ὢν εὐλογητὸς
  choice: Đấng đáng chúc tụng
  rationale: Cụm phân từ có mạo từ mô tả Đức Chúa Trời trong một lời tôn tụng; “đáng chúc tụng” tự nhiên và phù hợp với sắc thái tôn kính của εὐλογητός.
- source_word: εἰς τοὺς αἰῶνας
  choice: đời đời
  rationale: Đây là cách diễn đạt tiếng Việt tự nhiên cho ý nghĩa kéo dài mãi mãi của thành ngữ Hy Lạp; cách sát chữ được ghi ở chú thích.
- source_word: ὅτι
  choice: rằng
  rationale: ὅτι giới thiệu nội dung điều Đức Chúa Trời biết, không phải một mệnh đề chỉ nguyên nhân.
- source_word: οὐ ψεύδομαι
  choice: tôi không nói dối
  rationale: Diễn đạt tự nhiên thể hiện lời khẳng định hiện tại của Phao-lô mà không mở rộng thành “làm chứng”.
theological_decisions:
- issue: Mối quan hệ giữa “Đức Chúa Trời và Cha” với “Chúa Giê-su”
  choice: Dịch thẳng là “Đức Chúa Trời và Cha của Chúa Giê-su”, giữ sự phân biệt về ngôi vị trong nguyên văn.
  alternative: Diễn ý để làm nhẹ hoặc tránh sự phân biệt giữa Đức Chúa Trời là Cha và Chúa Giê-su.
  rationale: Bản dịch cần bảo toàn cách diễn đạt của câu và không âm thầm giải quyết sức căng thần học bằng lối diễn giải giáo phái.
- issue: Quan hệ cú pháp của lời tôn tụng
  choice: Dùng gạch ngang để trình bày “Đấng đáng chúc tụng đời đời” như lời mô tả xen vào, quy chiếu về Đức Chúa Trời.
  alternative: Gắn cụm này thành một mệnh đề hạn định không có dấu ngắt.
  rationale: Cách ngắt này làm rõ lời tôn tụng trang trọng trong câu khẳng định giống lời thề mà không thay đổi đối tượng được mô tả.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Giê-su” theo cách phiên âm phổ biến; gạch ngang đánh dấu lời tôn tụng xen vào. Dấu chú thích được đặt ngay sau cụm từ mà chú thích giải thích.
