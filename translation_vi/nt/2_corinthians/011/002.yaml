reference: 2 Corinthians 11:2
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ζηλῶ γὰρ ὑμᾶς θεοῦ ζήλῳ, ἡρμοσάμην γὰρ ὑμᾶς ἑνὶ ἀνδρὶ παρθένον ἁγνὴν παραστῆσαι τῷ Χριστῷ·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/002.yaml
  text: For I am jealous for you with God's jealousy[a], because I betrothed you to one husband[b], to present you as a pure virgin to Messiah.
translation:
  language: vi
  text: Vì tôi ghen giữ anh chị em với lòng ghen của Đức Chúa Trời[a], bởi tôi đã hứa gả anh chị em cho một người chồng duy nhất, để trình diện anh chị em cho Đấng Mê-si như một trinh nữ thanh sạch[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “với một lòng ghen thuộc về Đức Chúa Trời.” Cụm từ Hy Lạp có thể chỉ lòng ghen của chính Đức Chúa Trời hoặc lòng ghen mang đặc tính phù hợp với Ngài.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “cho Đấng Ki-tô.” Tiếng Hy Lạp: “τῷ Χριστῷ,” nghĩa là “cho Đấng được xức dầu.”'
    reason: alternative_rendering
lexical_decisions:
- source_word: ζηλῶ
  choice: mang lòng ghen đối với
  rationale: Động từ có thể chỉ lòng sốt sắng hoặc sự ghen giữ. Trong ẩn dụ đính ước hôn nhân, cách dịch này giữ được ý quan tâm bảo vệ và tính độc quyền giao ước, không hàm ý ganh tị nhỏ nhen.
- source_word: θεοῦ ζήλῳ
  choice: bằng lòng ghen của Đức Chúa Trời
  rationale: Giữ trực tiếp cấu trúc sở hữu của nguyên văn, đồng thời không loại trừ khả năng cụm từ nói đến lòng ghen mang đặc tính thuộc về Đức Chúa Trời.
- source_word: ἡρμοσάμην
  choice: đã đính ước
  rationale: Động từ ở ngữ cảnh hôn nhân chỉ việc kết ước hay hứa gả; “đính ước” tự nhiên, trang trọng và bảo toàn hình ảnh hôn lễ.
- source_word: ἑνὶ ἀνδρὶ
  choice: với một người chồng duy nhất
  rationale: ἀνήρ có thể là “người đàn ông” hoặc “người chồng”; ẩn dụ cô dâu và việc đính ước làm cho nghĩa “người chồng” phù hợp hơn. “Duy nhất” nhấn mạnh ἑνί mà không thêm một đối tượng khác.
- source_word: παρθένον ἁγνὴν
  choice: một trinh nữ thanh sạch
  rationale: Giữ cả hình ảnh trinh nữ và phẩm chất trong sạch của nguyên văn; “thanh sạch” có sắc thái đạo đức phù hợp mà vẫn dễ hiểu.
- source_word: παραστῆσαι
  choice: để trình diện
  rationale: Diễn đạt hành động đưa một người ra trước mặt người khác trong bối cảnh trang trọng hay nghi lễ.
- source_word: τῷ Χριστῷ
  choice: trước Đấng Mê-si
  rationale: Trong hình ảnh người chồng được chỉ định, Χριστός mang lực của tước hiệu. “Đấng Mê-si” thể hiện chức danh; giới từ “trước” diễn đạt tự nhiên đối tượng mà cô dâu được trình diện.
theological_decisions:
- issue: Bản chất lòng ghen của Phao-lô
  choice: Giữ cách nói “lòng ghen của Đức Chúa Trời”, cho thấy lòng ghen của Phao-lô bắt nguồn từ hoặc phản ánh sự ghen giữ giao ước của Đức Chúa Trời.
  alternative: “lòng ghen thánh” hoặc “lòng sốt sắng thuộc về Đức Chúa Trời”
  rationale: Sở hữu cách θεοῦ và ẩn dụ hôn nhân ủng hộ sắc thái ghen giữ giao ước, nhưng nguyên văn cũng có thể chỉ phẩm chất thần thượng; chú thích bảo tồn độ mở này.
- issue: Cách dịch Χριστός
  choice: Đấng Mê-si
  alternative: Đấng Ki-tô
  rationale: Mạo từ và vai trò người chồng trong ẩn dụ khiến Χριστός có tính tước hiệu rõ rệt hơn một tên riêng; chú thích cung cấp cách gọi quen thuộc khác.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Đại từ số nhiều “anh chị em” làm rõ đối tượng là cả cộng đồng. Phép lặp “anh chị em” được giữ để bảo toàn cấu trúc và trọng tâm mục vụ của câu; hình ảnh đính ước, người chồng và trinh nữ được duy trì nhất quán.
