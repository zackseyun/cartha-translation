- from: Vì tôi mang lòng ghen đối với anh chị em bằng lòng ghen của Đức Chúa Trời[a], bởi tôi đã đính ước anh chị em với một người chồng duy nhất, để trình diện anh chị em như một trinh nữ thanh sạch trước Đấng Mê-si[b].
  to: Vì tôi ghen giữ anh chị em với lòng ghen của Đức Chúa Trời[a], bởi tôi đã hứa gả anh chị em cho một người chồng duy nhất, để trình diện anh chị em cho Đấng Mê-si như một trinh nữ thanh sạch[b].
  rationale: 'Bản sửa làm rõ hướng “hứa gả ... cho” của động từ ἁρμόζω trong ẩn dụ hôn ước, thay cách nói gượng bằng tiếng Việt hiện đại tự nhiên hơn, và chỉnh chú thích để trích đúng cụm Hy Lạp. Không giải quyết quá mức sở hữu cách θεοῦ: chú thích vẫn bảo tồn hai khả năng “của Đức Chúa Trời” và “thuộc về/đặc tính phù hợp với Đức Chúa Trời.”'
  reviewer_model: gpt-5.6-terra
