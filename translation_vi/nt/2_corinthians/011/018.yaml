  text: ἐπεὶ πολλοὶ καυχῶνται ⸀κατὰ σάρκα, κἀγὼ καυχήσομαι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/018.yaml
  text: Since many boast according to the flesh[a], I too will boast.
translation:
  language: vi
  text: Vì nhiều người khoe khoang theo xác thịt[a], tôi cũng sẽ khoe khoang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “theo tiêu chuẩn con người” hoặc “theo cách thuần túy con người.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεὶ
  choice: Vì... nên
  rationale: Diễn đạt tự nhiên quan hệ nguyên nhân–kết quả làm nền cho quyết định mang tính mỉa mai của Phao-lô.
- source_word: πολλοὶ
  choice: nhiều người
  rationale: Chuyển tải trực tiếp ý nghĩa số lượng của tính từ.
- source_word: καυχῶνται / καυχήσομαι
  choice: khoe mình / sẽ khoe mình
  rationale: Giữ nguyên sự lặp lại có chủ ý của cùng một động từ Hy Lạp và sắc thái tranh biện trong văn cảnh.
- source_word: κατὰ σάρκα
  choice: theo xác thịt
  rationale: Giữ hình ảnh và độ mở thần học của cách nói Phao-lô, thay vì giải nghĩa ngay trong chính văn là theo tiêu chuẩn con người.
- source_word: κἀγὼ
  choice: tôi cũng
  rationale: Thể hiện cả yếu tố nối kết καί và đại từ nhấn mạnh ἐγώ, qua đó phản ánh việc Phao-lô đối ứng với những người kia.
theological_decisions:
- issue: Cách dịch σάρξ trong thành ngữ κατὰ σάρκα
  choice: theo xác thịt
  alternative: theo tiêu chuẩn con người; theo cách thuần túy con người
  rationale: Cách dịch chính giữ thuật ngữ giàu sắc thái của Phao-lô và không đồng nhất nó với thân thể hay âm thầm diễn giải thành bản tính tội lỗi. Chú thích cung cấp nghĩa thành ngữ phù hợp với văn cảnh.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Cấu trúc “Vì... nên...” làm rõ quan hệ nhân quả; “khoe mình” tự nhiên hơn “khoe khoang” trong cấu trúc có bổ ngữ phản thân, đồng thời giữ được phép lặp của nguyên văn.
