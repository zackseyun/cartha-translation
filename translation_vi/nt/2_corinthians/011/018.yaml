    issue: Cách diễn đạt “khoe mình theo xác thịt” dễ gây mơ hồ và không tự nhiên.
    rationale: Trong tiếng Việt, cụm này có thể gợi ý rằng đối tượng được khoe là thân xác của người nói. Nguyên văn nói về cơ sở/cách thức khoe khoang, không nói rõ đối tượng của lời khoe.
  revised_text: Vì nhiều người khoe khoang theo xác thịt[a], tôi cũng sẽ khoe khoang.
