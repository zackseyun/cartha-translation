  source_fidelity: 'Bản dịch giữ đúng trật tự liệt kê và điệp ngữ κινδύνοις, phân biệt phù hợp các nguy hiểm “vì/từ” sông ngòi, kẻ cướp, đồng bào và dân ngoại với các nguy hiểm “trong/giữa” thành phố, nơi hoang dã, biển và anh em giả. Tuy nhiên, “anh em giả dối” thường chỉ những anh em có hành vi không thành thật, trong khi ψευδαδέλφοις là “anh em giả”: những người mang/nhận danh anh em một cách không thật. Cần chỉnh để giữ đúng nét nghĩa ghép của từ Hy Lạp.'
