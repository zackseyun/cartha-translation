reference: 2 Corinthians 11:26
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁδοιπορίαις πολλάκις, κινδύνοις ποταμῶν, κινδύνοις λῃστῶν, κινδύνοις ἐκ γένους, κινδύνοις ἐξ ἐθνῶν, κινδύνοις ἐν πόλει, κινδύνοις ἐν ἐρημίᾳ, κινδύνοις ἐν θαλάσσῃ, κινδύνοις ἐν ψευδαδέλφοις,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/026.yaml
  text: often on journeys[a], in dangers from rivers, in dangers from robbers, in dangers from my own people, in dangers from Gentiles, in dangers in the city, in dangers in the wilderness, in dangers at sea, in dangers among false brothers[b],
translation:
  language: vi
  text: thường xuyên trong những chuyến hành trình, gặp nguy hiểm vì sông ngòi, nguy hiểm vì bọn cướp, nguy hiểm vì đồng bào mình[a], nguy hiểm vì dân ngoại, nguy hiểm trong thành phố, nguy hiểm nơi hoang dã, nguy hiểm trên biển, nguy hiểm giữa những anh em giả[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “người cùng dòng giống với tôi” hoặc “dân tộc của tôi”; nguyên văn Hy Lạp nói theo nghĩa đen là “dòng giống/dân mình”.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “giữa những tín hữu giả mạo”. Nguyên văn Hy Lạp nói theo nghĩa đen là “giữa những anh em giả”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁδοιπορίαις πολλάκις
  choice: thường xuyên trong những chuyến hành trình
  rationale: Diễn đạt tự nhiên ý nhiều lần đi đường, đồng thời giữ cấu trúc mở đầu của danh sách gian khổ.
- source_word: κινδύνοις
  choice: gặp nguy hiểm / nguy hiểm
  rationale: Lần xuất hiện đầu được diễn đạt bằng “gặp nguy hiểm” để câu tiếng Việt trôi chảy; các lần sau lặp “nguy hiểm” nhằm giữ nhịp điệp ngữ dồn dập của nguyên văn.
- source_word: ποταμῶν
  choice: vì sông ngòi
  rationale: Giữ nguyên nguồn gây nguy hiểm mà không xác định thêm đó là lũ lụt hay việc vượt sông, vì nguyên văn không nói rõ.
- source_word: λῃστῶν
  choice: vì bọn cướp
  rationale: Từ này chỉ những kẻ cướp hoặc cướp đường; “bọn cướp” rõ nghĩa và hợp với bối cảnh hành trình.
- source_word: ἐκ γένους
  choice: vì đồng bào mình
  rationale: Chỉ những người cùng dân tộc với Phao-lô. Cách dịch này tự nhiên, giữ sắc thái quan hệ dân tộc và không thêm danh từ “người Do Thái” vốn không có trực tiếp trong câu Hy Lạp.
- source_word: ἐξ ἐθνῶν
  choice: vì dân ngoại
  rationale: Trong thế đối lập với đồng bào của Phao-lô, cụm từ này chỉ những người thuộc các dân khác; “dân ngoại” là cách gọi ngắn gọn, quen thuộc trong văn cảnh Kinh Thánh.
- source_word: ἐν πόλει
  choice: trong thành phố
  rationale: Giữ dạng số ít mang nghĩa khái quát của nguyên văn và tạo thế đối xứng với nơi hoang dã và biển.
- source_word: ἐν ἐρημίᾳ
  choice: nơi hoang dã
  rationale: Bao quát nghĩa vùng hoang vu, vắng vẻ hoặc sa mạc mà không thu hẹp quá mức vào một địa hình cụ thể.
- source_word: ἐν θαλάσσῃ
  choice: trên biển
  rationale: Đây là cách nói tự nhiên trong tiếng Việt về hiểm nguy khi đi biển.
- source_word: ἐν ψευδαδέλφοις
  choice: giữa những anh em giả dối
  rationale: Giữ danh từ giống đực số nhiều “anh em” và ý những người tự nhận là anh em nhưng không chân thật, thay vì mở rộng thành cả nam lẫn nữ hoặc giải thích họ là tín hữu không thật.
theological_decisions:
- issue: Cách dịch ψευδαδέλφοις và phạm vi giới tính
  choice: giữa những anh em giả dối
  alternative: giữa những tín hữu giả mạo
  rationale: Nguyên văn dùng danh từ giống đực số nhiều mang nghĩa đen là “anh em giả”. Bản dịch giữ hình ảnh quan hệ anh em và không mặc nhiên giải quyết câu hỏi thần học về địa vị đức tin thật sự của họ.
- issue: Cách dịch ἐξ ἐθνῶν trong thế đối lập với ἐκ γένους
  choice: vì dân ngoại
  alternative: vì những người không phải Do Thái
  rationale: “Dân ngoại” giữ sự đối lập dân tộc trong văn cảnh Phao-lô và không diễn giải dài hơn nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Điệp từ “nguy hiểm” được giữ để tái hiện nhịp liệt kê dồn dập của tiếng Hy Lạp. Câu được để ở dạng mảnh nối tiếp với văn mạch chung quanh và giữ dấu phẩy cuối theo đơn vị nguồn được cung cấp.
