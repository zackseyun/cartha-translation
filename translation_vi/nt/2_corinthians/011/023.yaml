reference: 2 Corinthians 11:23
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: διάκονοι Χριστοῦ εἰσιν; παραφρονῶν λαλῶ, ὑπὲρ ἐγώ· ἐν κόποις περισσοτέρως, ἐν ⸂φυλακαῖς περισσοτέρως, ἐν πληγαῖς ὑπερβαλλόντως⸃, ἐν θανάτοις πολλάκις·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/023.yaml
  text: 'Are they servants of Messiah? I am speaking as if insane: I am more so—in labors more abundantly[a], in imprisonments more abundantly, in beatings beyond measure[b], in deaths often.'
translation:
  language: vi
  text: 'Họ là những người phục vụ Đấng Mê-si[a] sao? Tôi nói như người mất trí: tôi còn hơn họ—chịu nhiều công khó hơn, bị giam nhiều hơn, bị đánh đập vượt mức, nhiều lần đối diện cái chết[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Đấng Christ”: “Họ là những người phục vụ Đấng Christ sao?”'
    reason: Ghi nhận cách chuyển dịch truyền thống của tước hiệu Χριστός.
  - marker: b
    text: 'Sát nghĩa: “nhiều lần ở trong những cái chết”, có lẽ chỉ những lần cận kề cái chết hoặc gặp hiểm nguy chết người.'
    reason: Bảo lưu hình thức số nhiều nổi bật của nguyên văn và giải thích nghĩa có khả năng nhất.
lexical_decisions:
- source_word: διάκονοι
  choice: những người phục vụ
  rationale: Diễn đạt rõ nghĩa phục vụ của διάκονοι, đồng thời tránh sắc thái chức danh giáo hội mà “mục sư” hay “thừa tác viên” có thể gợi ra.
- source_word: Χριστοῦ
  choice: Đấng Mê-si
  rationale: Ở đây Χριστός hoạt động như tước hiệu; “Đấng Mê-si” làm rõ nghĩa tước hiệu trong tiếng Việt hiện đại.
- source_word: παραφρονῶν λαλῶ
  choice: Tôi nói như người mất trí
  rationale: Giữ ý Phao-lô tự nhận lối khoe mình này nghe như lời của người không tỉnh trí, mà không biến thành một chẩn đoán y khoa.
- source_word: ὑπὲρ ἐγώ
  choice: tôi còn hơn họ
  rationale: Bổ sung đối tượng so sánh vốn được tỉnh lược trong tiếng Hy Lạp để câu tiếng Việt rõ và tự nhiên, nhưng vẫn giữ lời khẳng định mạnh của Phao-lô.
- source_word: ἐν κόποις περισσοτέρως
  choice: chịu nhiều công khó hơn
  rationale: “Công khó” truyền đạt lao nhọc gian khổ; cấu trúc so sánh giữ lực của περισσοτέρως.
- source_word: ἐν φυλακαῖς περισσοτέρως
  choice: bị tù nhiều hơn
  rationale: Thể hiện các lần bị giam giữ lặp lại bằng cách nói ngắn gọn, tự nhiên trong tiếng Việt.
- source_word: ἐν πληγαῖς ὑπερβαλλόντως
  choice: bị đánh đập quá sức kể xiết
  rationale: Giữ cả ý chịu những trận đòn và mức độ phi thường, vượt quá khả năng đếm hoặc diễn tả.
- source_word: ἐν θανάτοις πολλάκις
  choice: nhiều lần đối diện cái chết
  rationale: Chuyển số nhiều Hy Lạp “trong những cái chết” thành cách nói tiếng Việt dễ hiểu về những lần cận kề hoặc lâm vào hiểm nguy chết người; chú thích bảo lưu hình thức sát chữ.
theological_decisions:
- issue: Cách dịch Χριστοῦ
  choice: Đấng Mê-si
  alternative: Đấng Christ
  rationale: Ngữ cảnh dùng Χριστός như tước hiệu của Đấng được xức dầu; “Đấng Mê-si” biểu đạt trực tiếp chức năng ấy. Chú thích ghi nhận cách gọi truyền thống quen thuộc.
- issue: Mức độ diễn giải ἐν θανάτοις πολλάκις
  choice: nhiều lần đối diện cái chết
  alternative: nhiều lần ở trong những cái chết
  rationale: Cách dịch chính làm rõ thành ngữ chỉ các lần cận kề cái chết mà không khẳng định một cơ chế cụ thể; chú thích bảo tồn hình ảnh số nhiều khác thường của nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Nhịp liệt kê tăng tiến được giữ bằng dấu gạch ngang và các cụm song song; tránh thuật ngữ giáo hội không cần thiết.
