id: 2CO.11.3
reference: 2 Corinthians 11:3
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: φοβοῦμαι δὲ μή πως, ὡς ὁ ὄφις ⸂ἐξηπάτησεν Εὕαν⸃ ἐν τῇ πανουργίᾳ αὐτοῦ, ⸀φθαρῇ τὰ νοήματα ὑμῶν ἀπὸ τῆς ἁπλότητος ⸂καὶ τῆς ἁγνότητος⸃ τῆς εἰς τὸν Χριστόν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/003.yaml
  text: But I fear that somehow[a], just as the serpent deceived Eve by his cunning[d][c][b], your minds may be corrupted from the sincerity and purity that are toward Messiah.
translation:
  language: vi
  text: Nhưng tôi e rằng, bằng cách nào đó, cũng như con rắn đã dùng sự xảo quyệt của nó để lừa dối Ê-va, tâm trí anh chị em có thể bị làm cho hư hoại đến nỗi lìa khỏi lòng chân thành[a] và sự trong sạch[b] đối với Đấng Mê-si-a.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “lòng đơn thành” hoặc “lòng một mực.”'
    reason: lexical_alternative
  - marker: b
    text: Một số thủ bản không có cụm “và sự trong sạch.”
    reason: textual_variant
lexical_decisions:
- source_word: φοβοῦμαι δὲ μή πως
  choice: Nhưng tôi e rằng ... bằng cách nào đó
  rationale: Giữ sắc thái lo ngại đang hiện hữu của Phao-lô và diễn đạt tự nhiên cấu trúc μή πως, vốn giới thiệu điều ông lo có thể xảy ra.
- source_word: ὡς ὁ ὄφις ἐξηπάτησεν Εὕαν
  choice: như con rắn ... lừa dối Ê-va
  rationale: Giữ rõ phép so sánh và sự liên hệ với trình thuật Sáng Thế; “con rắn” là cách gọi tự nhiên trong tiếng Việt.
- source_word: ἐν τῇ πανουργίᾳ αὐτοῦ
  choice: đã dùng sự xảo quyệt của nó
  rationale: Diễn đạt πανουργία là mưu mẹo gian trá và hiểu ἐν theo nghĩa phương tiện; đại từ “nó” quy chiếu tự nhiên về con rắn.
- source_word: φθαρῇ τὰ νοήματα ὑμῶν
  choice: tâm trí anh chị em bị làm hư hoại
  rationale: Giữ thể bị động và ý niệm sự suy đồi, hư hỏng trong cách suy nghĩ; “tâm trí” phù hợp với nghĩa tập thể của νοήματα trong văn cảnh.
- source_word: ἀπὸ
  choice: lìa khỏi
  rationale: Nêu rõ ý tách rời khỏi điều vốn phải được duy trì, tự nhiên hơn việc chỉ dùng “khỏi” trong câu tiếng Việt.
- source_word: τῆς ἁπλότητος
  choice: lòng chân thành
  rationale: Trong văn cảnh này, ἁπλότης chỉ sự thành thật, không phân tâm hay hai lòng trong sự tận hiến; chú thích bảo lưu các sắc thái “đơn thành” và “một lòng”.
- source_word: καὶ τῆς ἁγνότητος
  choice: và thanh sạch
  rationale: ἁγνότης chỉ sự trong sạch nói chung; “thanh sạch” duy trì liên hệ với hình ảnh cô dâu trinh khiết ở câu trước mà không thu hẹp nghĩa chỉ vào phương diện tính dục.
- source_word: τῆς εἰς τὸν Χριστόν
  choice: đối với Đấng Mê-si-a
  rationale: Cụm giới từ bổ nghĩa cho cả “lòng chân thành và thanh sạch”; Χριστός được dịch như tước hiệu Mê-si-a thay vì được xử lý như tên riêng.
theological_decisions:
- issue: Cách dịch Χριστόν
  choice: Đấng Mê-si-a
  alternative: Đấng Christ; Chúa Cứu Thế
  rationale: Χριστός ở đây vẫn mang giá trị tước hiệu. “Đấng Mê-si-a” bảo tồn ý nghĩa đó mà không thêm một cách giải nghĩa thần học vào câu.
- issue: Ý nghĩa của ἁπλότης trong mối liên hệ với Đấng Mê-si-a
  choice: lòng chân thành
  alternative: lòng đơn thành; lòng một mực
  rationale: “Lòng chân thành” truyền đạt phẩm chất đạo đức và sự tận hiến không hai lòng, trong khi chú thích giữ lại độ rộng từ vựng của nguyên ngữ.
- issue: Có hay không cụm καὶ τῆς ἁγνότητος
  choice: giữ “và thanh sạch” trong chính văn
  alternative: lược bỏ theo dị bản ngắn hơn
  rationale: SBLGNT đưa cụm này vào chính văn; dị bản lược bỏ được ghi ở chú thích thay vì bị âm thầm loại khỏi bản dịch.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” để diễn đạt đại từ số nhiều ὑμῶν một cách bao quát; dùng “Ê-va” và “Đấng Mê-si-a” theo lối viết tên và tước hiệu quen thuộc trong tiếng Việt. Cấu trúc câu giữ phép so sánh với con rắn, đồng thời dùng “lìa khỏi” để làm rõ quan hệ tách rời của ἀπό.
