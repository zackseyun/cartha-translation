  text: τρὶς ἐραβδίσθην, ἅπαξ ἐλιθάσθην, τρὶς ἐναυάγησα, νυχθήμερον ἐν τῷ βυθῷ πεποίηκα·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/025.yaml
  text: Three times I was beaten with rods[a], once I was stoned, three times I was shipwrecked; I have spent a night and a day in the deep.
translation:
  language: vi
  text: Ba lần tôi bị đánh bằng gậy, một lần bị ném đá, ba lần gặp nạn đắm tàu; tôi đã trải qua một đêm một ngày giữa biển sâu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “ngoài biển khơi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: τρὶς
  choice: ba lần
  rationale: Cách diễn đạt tự nhiên, chính xác cho trạng từ chỉ sự việc xảy ra ba lần; được dùng nhất quán ở cả hai vị trí.
- source_word: ἐραβδίσθην
  choice: tôi bị đánh bằng gậy
  rationale: Thể bị động của ῥαβδίζω chỉ việc bị đánh bằng gậy; nêu rõ dụng cụ thay vì chỉ dịch chung là “bị đánh”.
- source_word: ἅπαξ
  choice: một lần
  rationale: Cách diễn đạt tiếng Việt tự nhiên cho một lần xảy ra.
- source_word: ἐλιθάσθην
  choice: tôi bị ném đá
  rationale: Cách dịch ngắn gọn, quen thuộc và chính xác cho hành động bạo lực dùng đá ném vào một người.
- source_word: ἐναυάγησα
  choice: gặp nạn đắm tàu
  rationale: Diễn đạt tự nhiên việc Phao-lô trải qua tai nạn đắm tàu, tránh cách nói kém tự nhiên rằng một người “bị đắm tàu”.
- source_word: νυχθήμερον
  choice: một đêm một ngày
  rationale: Giữ nguyên trình tự đêm–ngày của từ Hy Lạp và không hiện đại hóa quá mức thành một con số giờ chính xác.
- source_word: ἐν τῷ βυθῷ
  choice: giữa biển sâu
  rationale: βυθός ở đây nói đến vùng nước sâu hoặc biển khơi; cách dịch này giữ hình ảnh về biển sâu mà không xác định quá cụ thể hoàn cảnh.
- source_word: πεποίηκα
  choice: tôi đã trải qua
  rationale: ποιέω đi với một khoảng thời gian có thể mang nghĩa trải qua hoặc dành thời gian; cách dịch này tự nhiên trong tiếng Việt và giữ sắc thái hồi tưởng của thì hoàn thành.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dấu chấm phẩy giữ nhịp liệt kê rồi chuyển sang trải nghiệm kéo dài. Dấu chú thích được đặt sau “biển sâu,” là cụm từ mà chú thích giải nghĩa.
