revisions:
- from: Vì nếu có ai đến rao giảng một Giê-su khác với Đấng chúng tôi đã rao giảng, hoặc nếu anh chị em nhận một thần khác với Thần mà anh chị em đã nhận, hoặc một Tin Lành khác với Tin Lành anh chị em đã tiếp nhận, thì anh chị em lại dung chịu điều đó quá dễ dàng![a]
  to: Vì nếu có ai đến rao giảng một Giê-su khác, Đấng mà chúng tôi đã không rao giảng; hoặc anh chị em nhận một thần linh khác mà anh chị em đã không nhận; hoặc một Tin Lành khác mà anh chị em đã không tiếp nhận, thì anh chị em lại dung chịu quá dễ dàng![a]
  rationale: 'Sửa thuật ngữ “thần” thành “thần linh” để phản ánh πνεῦμα chính xác và tự nhiên hơn. Sắp xếp lại các mệnh đề quan hệ để bám sát cú pháp Hy Lạp: một Giê-su ‘mà chúng tôi đã không rao giảng’, một thần linh ‘mà anh chị em đã không nhận’, và một Tin Lành ‘mà anh chị em đã không tiếp nhận’. Bỏ “điều đó” để không thu hẹp đối tượng ngầm của ἀνέχεσθε.'
