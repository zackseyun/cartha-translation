source:
  edition: SBLGNT
  text: εἰ μὲν γὰρ ὁ ἐρχόμενος ἄλλον Ἰησοῦν κηρύσσει ὃν οὐκ ἐκηρύξαμεν, ἢ πνεῦμα ἕτερον λαμβάνετε ὃ οὐκ ἐλάβετε, ἢ εὐαγγέλιον ἕτερον ὃ οὐκ ἐδέξασθε, καλῶς ⸀ἀνέχεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/004.yaml
  text: For if someone comes and proclaims another Jesus[a], whom we did not proclaim, or if you receive a different spirit, which you did not receive, or a different gospel, which you did not accept[c][b], you put up with it well enough.
translation:
  language: vi
  text: Vì nếu có ai đến rao giảng một Giê-su khác, Đấng mà chúng tôi đã không rao giảng; hoặc anh chị em nhận một thần linh khác mà anh chị em đã không nhận; hoặc một Tin Lành khác mà anh chị em đã không tiếp nhận, thì anh chị em lại dung chịu quá dễ dàng![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cụm “anh chị em lại dung chịu quá dễ dàng” có sắc thái mỉa mai: Phao-lô trách người Cô-rinh-tô vì họ quá sẵn lòng dung nạp những điều như vậy.'
    reason: clarify_irony
lexical_decisions:
- source_word: ὁ ἐρχόμενος
  choice: có ai đến
  rationale: 'Diễn đạt tự nhiên tính chất phiếm chỉ của phân từ hiện tại có mạo từ trong ngữ cảnh: một người nào đó đến giữa cộng đoàn.'
- source_word: ἄλλον Ἰησοῦν
  choice: một Giê-su khác
  rationale: Giữ nguyên lời cảnh báo về một nhân vật được rao giảng dưới cùng danh xưng Giê-su nhưng khác với Đấng Phao-lô đã công bố.
- source_word: κηρύσσει / ἐκηρύξαμεν
  choice: rao giảng / đã rao giảng
  rationale: “Rao giảng” chuyển tải hành động công bố công khai và là cách nói tự nhiên trong tiếng Việt hiện đại.
- source_word: πνεῦμα ἕτερον
  choice: một thần khác
  rationale: Giữ nghĩa rộng và sự bất định của πνεῦμα, không tự ý xác định đó là tà linh, một ảnh hưởng thuộc linh, hay sự trình bày sai về Thánh Linh.
- source_word: λαμβάνετε / ἐλάβετε
  choice: nhận / đã nhận
  rationale: Phản ánh động từ λαμβάνω và giữ sự phân biệt với δέχομαι ở mệnh đề kế tiếp.
- source_word: εὐαγγέλιον ἕτερον
  choice: một Tin Lành khác
  rationale: “Tin Lành” là cách gọi quen thuộc của εὐαγγέλιον; “khác” thể hiện sức tương phản của ἕτερον.
- source_word: ἐδέξασθε
  choice: đã tiếp nhận
  rationale: “Tiếp nhận” hàm ý đón nhận hoặc chấp nhận, đồng thời phân biệt nhẹ với “nhận” ở mệnh đề trước.
- source_word: καλῶς ἀνέχεσθε
  choice: lại dung chịu điều đó quá dễ dàng
  rationale: “Dung chịu” diễn tả việc chấp nhận hoặc chịu đựng điều đáng lẽ phải phản đối; “quá dễ dàng” làm rõ sắc thái mỉa mai có trong văn cảnh mà không biến câu thành lời khen.
- source_word: εἰ μὲν γὰρ
  choice: Vì nếu
  rationale: Giữ liên kết lập luận do γὰρ tạo ra, đồng thời diễn đạt điều kiện tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Đối tượng được chỉ bởi πνεῦμα ἕτερον
  choice: Dịch chung là “một thần khác”, không xác định bản chất cụ thể.
  alternative: “một Thánh Linh khác”, “một tà linh”, hoặc “một ảnh hưởng/tâm thái thuộc linh khác”
  rationale: Bản Hy Lạp không giải quyết dứt khoát đối tượng quy chiếu; bản dịch cần bảo toàn tính mơ hồ thần học này.
- issue: Sắc thái của καλῶς ἀνέχεσθε
  choice: 'Hiểu là lời quở trách mang tính mỉa mai: “lại dung chịu điều đó quá dễ dàng”.'
  alternative: Lời khen theo nghĩa đen hoặc một nhận xét trung tính
  rationale: Văn cảnh cho thấy Phao-lô trách người Cô-rinh-tô vì quá sẵn lòng dung nạp lời rao giảng đối nghịch, chứ không khen họ.
- issue: Đối tượng ngầm của ἀνέχεσθε
  choice: Dùng “điều đó” để bao quát toàn bộ tình huống vừa nêu.
  alternative: “người ấy” hoặc không nêu bổ ngữ
  rationale: Động từ Hy Lạp không có bổ ngữ tân ngữ hiển ngôn tại đây; “điều đó” là cách diễn đạt tự nhiên nhưng không giới hạn sự dung chịu chỉ vào người đến hay chỉ vào thông điệp.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại. Dùng “anh chị em” cho ngôi thứ hai số nhiều nhằm chỉ toàn thể cộng đoàn; giữ “thần” ở dạng không xác định để không thu hẹp nghĩa của πνεῦμα. Viết hoa “Thần” trong lần nhắc lại vì trong văn cảnh đây có khả năng chỉ Thánh Linh mà họ đã nhận, nhưng không thêm từ “Thánh” để tránh giải quyết quá mức điều bản văn không nói rõ.
