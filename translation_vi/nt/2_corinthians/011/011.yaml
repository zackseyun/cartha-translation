source:
  edition: SBLGNT
  text: διὰ τί; ὅτι οὐκ ἀγαπῶ ὑμᾶς; ὁ θεὸς οἶδεν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/011.yaml
  text: Why? Because I do not love you? God knows I do.
translation:
  language: vi
  text: Tại sao? Vì tôi không yêu anh chị em sao? Đức Chúa Trời biết.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn chỉ nói: “Đức Chúa Trời biết.” Ngữ cảnh hàm ý rằng Ngài biết Phao-lô thật sự yêu họ.'
    reason: Giữ phép tỉnh lược của nguyên văn đồng thời giúp độc giả nhận ra câu trả lời ngầm của câu hỏi tu từ.
lexical_decisions:
- source_word: διὰ τί
  choice: Tại sao?
  rationale: Cách hỏi ngắn gọn, tự nhiên, giữ nguyên sức nặng tu từ của câu Hy Lạp.
- source_word: ὅτι
  choice: Vì
  rationale: Trong mạch văn này, ὅτι dẫn vào lý do được nêu dưới dạng câu hỏi tu từ.
- source_word: οὐκ ἀγαπῶ ὑμᾶς
  choice: tôi không yêu anh chị em
  rationale: Giữ nguyên động từ 'yêu', thể phủ định và tân ngữ số nhiều; 'anh chị em' là cách xưng hô tự nhiên, bao quát dành cho cộng đồng tín hữu.
- source_word: ὁ θεὸς
  choice: Đức Chúa Trời
  rationale: Danh xưng tiếng Việt trang trọng và quen thuộc cho θεός trong ngữ cảnh chỉ Đức Chúa Trời.
- source_word: οἶδεν
  choice: biết
  rationale: Dịch đúng điều câu Hy Lạp nói trực tiếp, không đưa câu trả lời ngầm 'tôi có yêu' vào chính văn.
theological_decisions:
- issue: Có nên nói rõ đối tượng của điều Đức Chúa Trời biết hay không
  choice: Đức Chúa Trời biết.
  alternative: Đức Chúa Trời biết rằng tôi yêu anh chị em.
  rationale: Nguyên văn kết thúc bằng ὁ θεὸς οἶδεν, không nêu bổ ngữ. Giữ cách nói ngắn này bảo toàn phép tỉnh lược và sức căng của lời kêu cầu Đức Chúa Trời làm chứng; chú thích giải thích câu trả lời tích cực được ngữ cảnh hàm ý.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Hai câu hỏi ngắn giữ nhịp điệu tu từ của nguyên văn; kết luận cô đọng được bảo toàn thay vì giải nghĩa ngay trong chính văn.
