  source_fidelity: Bản dịch bảo toàn cấu trúc tu từ của διὰ τί; ὅτι οὐκ ἀγαπῶ ὑμᾶς; và dịch ὁ θεὸς οἶδεν là “Đức Chúa Trời biết” mà không thêm bổ ngữ vào chính văn. Phép tỉnh lược của tiếng Hy Lạp được giữ đúng; chú thích nêu rõ câu trả lời tích cực chỉ là hàm ý theo ngữ cảnh.
  naturalness: “Tại sao? Vì tôi không yêu anh chị em sao? Đức Chúa Trời biết.” tự nhiên trong tiếng Việt hiện đại, trang trọng vừa phải, và duy trì nhịp ngắn, dồn của lời biện hộ. “Anh chị em” phù hợp khi Phao-lô ngỏ lời với một cộng đồng tín hữu.
  terminology: “yêu” phản ánh ἀγαπῶ mà không diễn giải thần học; “Đức Chúa Trời” là danh xưng trang trọng, quen thuộc trong văn phong Kinh Thánh tiếng Việt. Chú thích phân biệt hợp lý giữa điều được nói trực tiếp và điều được hàm ý.
