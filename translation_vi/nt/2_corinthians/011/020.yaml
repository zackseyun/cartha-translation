id: 2CO.11.20
reference: 2 Corinthians 11:20
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀνέχεσθε γὰρ εἴ τις ὑμᾶς καταδουλοῖ, εἴ τις κατεσθίει, εἴ τις λαμβάνει, εἴ τις ἐπαίρεται, εἴ τις ⸂εἰς πρόσωπον ὑμᾶς⸃ δέρει.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/020.yaml
  text: For you put up with it if someone enslaves you[a], if someone devours you, if someone takes from you, if someone exalts himself[b], if someone strikes you in the face.
translation:
  language: vi
  text: Vì anh chị em vẫn chịu đựng nếu có kẻ bắt anh chị em làm nô lệ, nếu có kẻ nuốt chửng anh chị em, nếu có kẻ lấy của anh chị em[a], nếu có kẻ tự đề cao mình, hoặc nếu có kẻ đánh vào mặt anh chị em.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát nghĩa: “lấy”. Động từ không nói rõ điều bị lấy; trong văn cảnh có thể hàm ý chiếm đoạt hoặc lợi dụng anh chị em.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέχεσθε
  choice: chịu đựng
  rationale: Diễn tả việc người Cô-rinh-tô thực sự dung chịu những kẻ lạm dụng họ; cách nói tự nhiên, trang trọng vừa phải và hợp với giọng mỉa mai quở trách.
- source_word: γὰρ
  choice: Vì
  rationale: Giữ quan hệ giải thích với lời mỉa mai ở câu trước.
- source_word: καταδουλοῖ
  choice: bắt anh chị em làm nô lệ
  rationale: Giữ nguyên sức nặng của hình ảnh đưa người khác vào cảnh nô lệ hoặc lệ thuộc, không làm nhẹ nghĩa.
- source_word: κατεσθίει
  choice: nuốt chửng anh chị em
  rationale: Bảo tồn hình ảnh mạnh về sự bóc lột mang tính săn mồi.
- source_word: λαμβάνει
  choice: vơ vét của anh chị em
  rationale: Nguyên ngữ chỉ nói 'lấy' và không nêu vật bị lấy; trong văn cảnh, động từ có sắc thái chiếm đoạt. 'Vơ vét của' truyền đạt tính bóc lột mà không giới hạn vào tiền bạc.
- source_word: ἐπαίρεται
  choice: tự cao
  rationale: Diễn đạt tự nhiên ý tự nâng mình lên, kiêu căng, đồng thời giữ sắc thái phản thân.
- source_word: εἰς πρόσωπον ὑμᾶς δέρει
  choice: đánh vào mặt anh chị em
  rationale: Giữ hành động cụ thể và tính sỉ nhục của thành ngữ, không thu hẹp thành một cái tát.
- source_word: εἴ τις
  choice: khi có kẻ
  rationale: Trong chuỗi điều kiện diễn tả những điều họ thực tế dung chịu, 'khi có kẻ' tự nhiên trong tiếng Việt; sự lặp lại được giữ để bảo tồn nhịp điệu tu từ.
theological_decisions:
- issue: Giọng điệu tu từ của lời Phao-lô
  choice: Dịch như một lời quở trách mang tính mỉa mai về việc người Cô-rinh-tô chịu đựng những kẻ lạm dụng họ, nhưng không gọi đích danh những người ấy trong câu.
  alternative: Diễn giải rõ họ là các sứ đồ giả hoặc giáo sư giả.
  rationale: Văn cảnh cho thấy sắc thái mỉa mai và nhận diện những kẻ lạm dụng, nhưng chính câu Hy Lạp chỉ liệt kê các hành vi; bản dịch không thêm nhãn giải thích vào chính văn.
- issue: Phạm vi nghĩa của λαμβάνει
  choice: Giữ nghĩa bóc lột khá rộng bằng 'vơ vét của anh chị em' và chú thích nghĩa sát chữ.
  alternative: Cụ thể hóa thành lấy tiền, chiếm tài sản, hoặc lợi dụng anh chị em.
  rationale: Văn cảnh gợi ý sự chiếm đoạt, nhưng nguyên ngữ không xác định vật bị lấy hay một loại bóc lột duy nhất.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang nghiêm nhưng dễ hiểu. Dùng “anh chị em” cho đại từ số nhiều ὑμᾶς; giữ chuỗi hành động dồn dập và giọng quở trách. Marker [a] được đặt ngay sau cụm từ liên quan.
