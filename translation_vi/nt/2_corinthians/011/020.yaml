revisions:
- from: Vì anh chị em chịu đựng khi có kẻ bắt anh chị em làm nô lệ, có kẻ nuốt chửng anh chị em, có kẻ vơ vét của anh chị em[a], có kẻ tự cao, hay có kẻ đánh vào mặt anh chị em.
  to: Vì anh chị em vẫn chịu đựng nếu có kẻ bắt anh chị em làm nô lệ, nếu có kẻ nuốt chửng anh chị em, nếu có kẻ lấy của anh chị em[a], nếu có kẻ tự đề cao mình, hoặc nếu có kẻ đánh vào mặt anh chị em.
  rationale: Thay “vơ vét của” bằng “lấy của” để không thêm mức độ hay xác định đối tượng vượt quá λαμβάνει; chú thích bảo lưu khả năng hiểu theo sắc thái bóc lột. Thay “khi” bằng “nếu” để giữ cấu trúc εἴ τις lặp lại. Các phần khác được duy trì vì phản ánh trung thành và tự nhiên các động từ cùng giọng mỉa mai của câu.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T19:28:04Z'
review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt tốt chuỗi tố cáo và hình ảnh mạnh của καταδουλοῖ, κατεσθίει, cùng hành động đánh vào mặt. Tuy nhiên, “vơ vét của anh chị em” quy định hóa và tăng cường λαμβάνει, vốn chỉ là “lấy” và không nêu rõ vật bị lấy. Nên dùng cách diễn đạt rộng hơn, kèm chú thích để giữ tính hàm ý bóc lột nhưng không xác định quá mức.
  naturalness: Câu sửa giữ nhịp liệt kê dồn dập, tự nhiên trong tiếng Việt tiêu chuẩn hiện đại. “Vẫn chịu đựng” thích hợp với giọng mỉa mai; “nếu có kẻ” phản ánh rõ cấu trúc điều kiện εἴ τις hơn “khi có kẻ”.
  terminology: “Bắt anh chị em làm nô lệ” giữ đúng sức nặng của καταδουλοῖ. “Nuốt chửng” bảo tồn ẩn dụ của κατεσθίει. “Tự đề cao mình” diễn đạt rõ sắc thái tự nâng mình của ἐπαίρεται. Chú thích tại λαμβάνει làm rõ nghĩa sát chữ và khả năng hàm ý bóc lột mà không áp đặt một đối tượng cụ thể.
  issues:
  - severity: medium
    issue: “Vơ vét của anh chị em” diễn giải quá cụ thể và quá mạnh λαμβάνει.
    rationale: λαμβάνει nghĩa cơ bản là “lấy,” trong câu không nêu điều bị lấy. Văn cảnh có thể gợi ý hành vi chiếm đoạt hoặc lợi dụng, nhưng “vơ vét” hàm ý thu gom cạn kiệt và “của” xác định loại đối tượng hơn nguyên ngữ cho phép.
  - severity: low
    issue: “Khi có kẻ” làm yếu hình thức điều kiện được lặp lại của εἴ τις.
    rationale: Dù ngữ cảnh nói về tình trạng thực tế, “nếu có kẻ” bảo tồn trực tiếp hơn cấu trúc tu từ điều kiện năm lần của bản Hy Lạp.
  revised_text: Vì anh chị em vẫn chịu đựng nếu có kẻ bắt anh chị em làm nô lệ, nếu có kẻ nuốt chửng anh chị em, nếu có kẻ lấy của anh chị em[a], nếu có kẻ tự đề cao mình, hoặc nếu có kẻ đánh vào mặt anh chị em.
