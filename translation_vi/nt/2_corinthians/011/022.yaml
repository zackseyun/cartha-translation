id: 2CO.11.22
reference: 2 Corinthians 11:22
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἑβραῖοί εἰσιν; κἀγώ. Ἰσραηλῖταί εἰσιν; κἀγώ. σπέρμα Ἀβραάμ εἰσιν; κἀγώ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/022.yaml
  text: Are they Hebrews? So am I[a]. Are they Israelites? So am I. Are they Abraham’s offspring? So am I.
translation:
  language: vi
  text: Họ là người Hê-bơ-rơ sao? Tôi cũng vậy. Họ là người Y-sơ-ra-ên sao? Tôi cũng vậy. Họ là dòng dõi Áp-ra-ham[a] sao? Tôi cũng vậy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “hạt giống của Áp-ra-ham.” Tiếng Hy Lạp dùng một danh từ số ít mang nghĩa tập thể.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἑβραῖοί
  choice: người Hê-bơ-rơ
  rationale: Thuật ngữ dân tộc–tôn giáo quen thuộc này giữ được nét riêng về di sản và căn tính Do Thái, đồng thời không đồng nhất nó với hai cách gọi kế tiếp.
- source_word: κἀγώ
  choice: Tôi cũng vậy
  rationale: Cách nói ngắn, tự nhiên và có sức nhấn trong tiếng Việt, phù hợp với sự lặp lại dồn dập của Phao-lô.
- source_word: Ἰσραηλῖται
  choice: người Y-sơ-ra-ên
  rationale: Diễn đạt tư cách thuộc về dân Y-sơ-ra-ên, giữ nguyên sự phân biệt có chủ ý với “người Hê-bơ-rơ” và “dòng dõi Áp-ra-ham”.
- source_word: σπέρμα Ἀβραάμ
  choice: dòng dõi Áp-ra-ham
  rationale: “Dòng dõi” là cách diễn đạt tự nhiên, trang trọng và mang nghĩa tập thể trong tiếng Việt; nó truyền đạt quan hệ huyết thống mà không buộc danh từ tập thể số ít của tiếng Hy Lạp thành một hình thức số nhiều rõ rệt.
- source_word: εἰσιν
  choice: Họ là ... sao?
  rationale: Đưa động từ liên hệ vào cấu trúc nghi vấn tự nhiên của tiếng Việt, bảo toàn chuỗi câu hỏi tu từ và lời đáp ngắn trong nguyên văn.
theological_decisions:
- issue: Sự phân biệt tinh tế giữa ba cách gọi về căn tính Do Thái
  choice: 'Giữ riêng ba cách gọi: “người Hê-bơ-rơ”, “người Y-sơ-ra-ên” và “dòng dõi Áp-ra-ham”'
  alternative: Gộp cả ba thành những cách gọi gần đồng nghĩa như “người Do Thái” hoặc “con cháu Áp-ra-ham”
  rationale: Lập luận tu từ của Phao-lô xếp chồng ba tuyên bố có liên hệ nhưng không hoàn toàn đồng nhất về căn tính, tư cách thuộc dân giao ước và nguồn gốc tổ tiên; bản dịch không nên san phẳng sự phân biệt ấy.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. Ba câu hỏi và ba lời đáp được giữ ngắn, cân xứng để tái hiện nhịp điệu mạnh và dồn dập của nguyên văn.
