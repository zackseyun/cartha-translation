id: 2CO.12.15
reference: 2 Corinthians 12:15
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐγὼ δὲ ἥδιστα δαπανήσω καὶ ἐκδαπανηθήσομαι ὑπὲρ τῶν ψυχῶν ὑμῶν. ⸀εἰ περισσοτέρως ὑμᾶς ⸀ἀγαπῶν, ἧσσον ἀγαπῶμαι;
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/015.yaml
  text: But I will most gladly spend and be spent for your souls. If I love you more abundantly[a], am I loved less?
translation:
  language: vi
  text: Còn tôi, tôi sẽ hết sức vui lòng chi dùng những gì mình có, và chính mình cũng sẽ bị tiêu hao vì anh chị em.[a] Nếu tôi yêu anh chị em nhiều hơn, thì tôi lại được yêu ít hơn sao?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát nghĩa: “vì linh hồn của anh chị em”; cũng có thể hiểu là “vì sự sống của anh chị em” hoặc “vì chính anh chị em.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἥδιστα
  choice: hết sức vui lòng
  rationale: Diễn đạt sắc thái cao nhất của trạng từ, cho thấy sự tự nguyện nồng nhiệt chứ không chỉ miễn cưỡng chấp thuận.
- source_word: δαπανήσω
  choice: tiêu hao mọi sự mình có
  rationale: Giữ hình ảnh chi dùng/tiêu dùng nguồn lực, đồng thời bổ sung đối tượng hàm ẩn để câu tiếng Việt tự nhiên và làm rõ sự đối xứng với việc chính Phao-lô bị tiêu hao.
- source_word: ἐκδαπανηθήσομαι
  choice: chính mình cũng sẽ bị tiêu hao
  rationale: 'Giữ thể bị động và sắc thái tăng cường của động từ ghép: Phao-lô không chỉ tiêu dùng những gì mình có mà còn hiến cả chính mình.'
- source_word: ὑπὲρ τῶν ψυχῶν ὑμῶν
  choice: vì anh chị em
  rationale: Trong ngữ cảnh này ψυχαί chỉ chính con người/sự sống của họ; cách dịch này tự nhiên trong tiếng Việt và tránh khiến người đọc hiểu theo một nhân học nhị nguyên quá hẹp. Chú thích bảo lưu nghĩa sát chữ.
- source_word: εἰ
  choice: nếu
  rationale: Giữ nguyên hình thức điều kiện và sức căng của câu hỏi tu từ, không chuyển thành lời khẳng định nguyên nhân.
- source_word: περισσοτέρως
  choice: càng... nhiều hơn
  rationale: Diễn đạt mức độ so sánh gia tăng, đồng thời tạo cấu trúc đối ứng tự nhiên với 'ít hơn' ở vế sau.
- source_word: ἀγαπῶν
  choice: tôi... yêu
  rationale: Chuyển phân từ sang động từ hữu hạn theo cú pháp tiếng Việt mà không thay đổi chủ thể hay ý nghĩa.
- source_word: ἧσσον ἀγαπῶμαι
  choice: tôi lại được yêu ít hơn
  rationale: Giữ thể bị động, mức độ so sánh và nghịch lý đau xót trong câu hỏi tu từ.
theological_decisions:
- issue: Cách hiểu ψυχαί trong lời tự hiến mang tính mục vụ
  choice: anh chị em, với chú thích 'linh hồn/sự sống của anh chị em'
  alternative: linh hồn của anh chị em
  rationale: ψυχή có thể chỉ linh hồn, sự sống hoặc chính con người. Dịch là 'anh chị em' phù hợp nghĩa toàn thể con người trong ngữ cảnh và tránh áp đặt một nghĩa nhân học chuyên biệt, còn chú thích bảo tồn phạm vi từ vựng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” cho đại từ số nhiều ὑμῶν; giữ phép ẩn dụ tiêu hao và câu hỏi tu từ, nhưng làm rõ đối tượng hàm ẩn của δαπανήσω để tiếng Việt tự nhiên.
