revisions:
- from: Còn tôi, tôi sẽ hết sức vui lòng tiêu hao mọi sự mình có, và chính mình cũng sẽ bị tiêu hao vì anh chị em.[a] Nếu tôi càng yêu anh chị em nhiều hơn, thì tôi lại được yêu ít hơn sao?
  to: Còn tôi, tôi sẽ hết sức vui lòng chi dùng những gì mình có, và chính mình cũng sẽ bị tiêu hao vì anh chị em.[a] Nếu tôi yêu anh chị em nhiều hơn, thì tôi lại được yêu ít hơn sao?
