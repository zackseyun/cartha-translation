    rationale: περισσοτέρως chỉ cần “nhiều hơn” (hoặc “hơn nữa”). Câu điều kiện tu từ trong tiếng Việt rõ và tự nhiên hơn khi không dùng đồng thời “càng” với “nhiều hơn”.
