id: 2CO.12.19
reference: 2 Corinthians 12:19
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸀Πάλαι δοκεῖτε ὅτι ὑμῖν ἀπολογούμεθα; ⸀κατέναντι θεοῦ ἐν Χριστῷ λαλοῦμεν. τὰ δὲ πάντα, ἀγαπητοί, ὑπὲρ τῆς ὑμῶν οἰκοδομῆς,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/019.yaml
  text: Have you been thinking all along that we are defending ourselves to you? Before God[a], in Messiah, we are speaking. And everything, beloved[b], is for your building up.
translation:
  language: vi
  text: Bấy lâu nay, anh em vẫn nghĩ rằng chúng tôi đang tự biện hộ trước mặt anh em sao? Chúng tôi nói trước mặt Đức Chúa Trời, trong Đấng Mê-si. Mọi điều, anh em yêu dấu, đều nhằm xây dựng anh em.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πάλαι δοκεῖτε
  choice: Bấy lâu nay, anh em vẫn nghĩ
  rationale: Cụm này diễn tả một nhận định đã kéo dài đến hiện tại; cách dịch tự nhiên này giữ được sắc thái của câu hỏi tu từ.
- source_word: ἀπολογούμεθα
  choice: chúng tôi đang tự biện hộ
  rationale: Động từ mang sắc thái tự bào chữa hoặc tự bảo vệ; “tự biện hộ” giữ được ý nghĩa pháp lý mà vẫn rõ ràng trong tiếng Việt hiện đại.
- source_word: κατέναντι θεοῦ
  choice: Trước mặt Đức Chúa Trời
  rationale: Cụm từ nói đến việc phát ngôn trong sự hiện diện của Đức Chúa Trời và dưới sự chứng giám của Ngài.
- source_word: ἐν Χριστῷ
  choice: trong Đấng Mê-si
  rationale: Giữ Χριστός như một tước hiệu và bảo toàn cách diễn đạt về sự hiệp nhất hoặc phạm vi liên hệ với Đấng Mê-si.
- source_word: τὰ δὲ πάντα
  choice: mọi điều
  rationale: Trong văn cảnh, cụm này bao quát mọi điều Phao-lô nói và làm, chứ không nêu một mệnh đề phổ quát về vạn vật.
- source_word: ἀγαπητοί
  choice: anh em yêu dấu
  rationale: Giữ nguyên lời xưng hô trìu mến và phù hợp với văn phong thư tín trang trọng.
- source_word: ὑπὲρ τῆς ὑμῶν οἰκοδομῆς
  choice: đều nhằm xây dựng anh em
  rationale: Diễn đạt mục đích và giữ hình ảnh ẩn dụ οἰκοδομή về việc làm cho cộng đồng được vững mạnh.
theological_decisions:
- issue: Cách dịch Χριστῷ
  choice: Đấng Mê-si
  alternative: Đấng Christ
  rationale: Ở đây Χριστός vẫn có giá trị tước hiệu; “Đấng Mê-si” truyền đạt nghĩa ấy rõ ràng mà không biến nó thành một tên riêng thuần túy.
- issue: Mối liên hệ cú pháp giữa κατέναντι θεοῦ và ἐν Χριστῷ
  choice: “Trước mặt Đức Chúa Trời” chỉ hoàn cảnh chịu sự chứng giám, còn “trong Đấng Mê-si” bổ nghĩa cho việc nói
  alternative: Gộp hai cụm theo cách có thể khiến “trong Đấng Mê-si” bổ nghĩa cho Đức Chúa Trời
  rationale: Trật tự và cú pháp Hy Lạp tự nhiên nhất cho thấy cả hai cụm đều xác định cách thức hoặc phạm vi của λαλοῦμεν; bản dịch giữ chúng cạnh động từ mà không giải nghĩa thần học quá mức.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Câu hỏi tu từ được giữ nguyên; hai mệnh đề sau được tách thành hai câu để tái hiện nhịp nhấn của nguyên văn. “Xây dựng” giữ ẩn dụ kiến thiết, đồng thời được hiểu tự nhiên là làm cho cộng đồng trưởng thành và vững mạnh.
