  to: Bấy lâu nay, anh em vẫn nghĩ rằng chúng tôi đang tự biện hộ trước mặt anh em sao? Chúng tôi nói trước mặt Đức Chúa Trời, trong Đấng Mê-si. Mọi điều, anh em yêu dấu, đều nhằm xây dựng anh em.
