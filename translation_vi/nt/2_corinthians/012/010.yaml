id: 2CO.12.10
reference: 2 Corinthians 12:10
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: διὸ εὐδοκῶ ἐν ἀσθενείαις, ἐν ὕβρεσιν, ἐν ἀνάγκαις, ἐν διωγμοῖς ⸀καὶ στενοχωρίαις, ὑπὲρ Χριστοῦ· ὅταν γὰρ ἀσθενῶ, τότε δυνατός εἰμι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/010.yaml
  text: Therefore I delight in weaknesses[a], in insults, in hardships, in persecutions and distresses, for the sake of Messiah; for when I am weak, then I am strong.
translation:
  language: vi
  text: Vì vậy, tôi lấy làm vui trong những sự yếu đuối, những sự sỉ nhục, những hoàn cảnh bức bách, những cuộc bắt bớ và những lúc quẫn bách vì Đấng Mê-si[a]; vì khi tôi yếu đuối, chính lúc ấy tôi mạnh mẽ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay theo cách dịch truyền thống: “Đấng Christ.”'
    reason: Nêu cách dịch truyền thống của Χριστός trong khi bản chính giữ nghĩa danh hiệu “Đấng Mê-si”.
lexical_decisions:
- source_word: διὸ
  choice: Vì vậy
  rationale: Diễn tả kết luận suy ra từ lập luận ngay trước đó, đồng thời tự nhiên trong tiếng Việt hiện đại.
- source_word: εὐδοκῶ
  choice: tôi vui thỏa
  rationale: Giữ sắc thái hài lòng, vui nhận mang tính nghịch lý, mạnh hơn ý chỉ cam chịu nhưng không hàm ý Phao-lô yêu thích đau khổ tự thân.
- source_word: ἐν ἀσθενείαις
  choice: giữa những sự yếu đuối
  rationale: Giữ số nhiều và phạm vi nghĩa rộng về sự yếu đuối, không thu hẹp thành bệnh tật thể chất; “giữa” diễn đạt tự nhiên hoàn cảnh mà ἐν nêu ra.
- source_word: ἐν ὕβρεσιν
  choice: những lời sỉ nhục
  rationale: Diễn đạt sự xúc phạm và hạ nhục mà Phao-lô phải chịu; cách nói rõ ràng, tự nhiên với độc giả hiện đại.
- source_word: ἐν ἀνάγκαις
  choice: cảnh ngặt nghèo
  rationale: Chuyển tải ý về những tình thế bức bách, thiếu thốn hoặc bị ép buộc mà không giới hạn vào một loại gian khổ cụ thể.
- source_word: ἐν διωγμοῖς
  choice: những cuộc bắt bớ
  rationale: Phản ánh nghĩa thông dụng trong văn mạch Phao-lô về sự bách hại vì lòng trung thành với Đấng Mê-si.
- source_word: καὶ στενοχωρίαις
  choice: và cảnh khốn cùng
  rationale: Giữ hình ảnh hàm ẩn về tình trạng bị dồn ép, quẫn bách và phân biệt tương đối với ἀνάγκαις.
- source_word: ὑπὲρ Χριστοῦ
  choice: vì Đấng Mê-si
  rationale: “Vì” diễn đạt nguyên do và sự tận hiến gắn với các hoạn nạn; “Đấng Mê-si” giữ lực danh hiệu của Χριστός trong ngữ cảnh này.
- source_word: ὅταν γὰρ ἀσθενῶ
  choice: vì khi tôi yếu đuối
  rationale: Giữ quan hệ giải thích của γάρ và ý thời gian khái quát của ὅταν với động từ giả định hiện tại.
- source_word: τότε δυνατός εἰμι
  choice: chính lúc ấy tôi mạnh mẽ
  rationale: “Mạnh mẽ” tạo thế đối lập trực tiếp với “yếu đuối”; “chính lúc ấy” làm rõ nét nghịch lý của τότε mà không giải thích thêm nguồn sức mạnh.
theological_decisions:
- issue: Cách dịch Χριστοῦ
  choice: Đấng Mê-si
  alternative: Đấng Christ
  rationale: Ở đây Χριστός vẫn có thể được nghe như một danh hiệu; bản chính giữ nền tảng Mê-si của từ ngữ, còn cách dịch truyền thống được nêu trong chú thích để không xóa bỏ lối hiểu quen thuộc.
- issue: Nghịch lý yếu đuối và mạnh mẽ
  choice: 'Giữ nguyên: “khi tôi yếu đuối, chính lúc ấy tôi mạnh mẽ”'
  alternative: Giải thích rõ rằng sức mạnh đến từ Đấng Mê-si
  rationale: Câu Hy Lạp không nói tường minh tác nhân trong mệnh đề cuối; không thêm lời giải thần học, nhờ đó giữ được sự cô đọng và sức căng của nguyên văn.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, dùng cấu trúc liệt kê rõ ràng. “Vui thỏa” giữ sắc thái tích cực và nghịch lý của εὐδοκῶ; “cảnh ngặt nghèo” và “cảnh khốn cùng” tránh lặp từ nhưng vẫn duy trì hai mục riêng trong nguyên văn. Dấu chú thích [a] được đặt ngay sau thuật ngữ mà chú thích giải thích.
