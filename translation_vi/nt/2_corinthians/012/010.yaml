revisions:
- from: Vì vậy, tôi vui thỏa giữa những sự yếu đuối, những lời sỉ nhục, cảnh ngặt nghèo, những cuộc bắt bớ và cảnh khốn cùng vì Đấng Mê-si[a]; vì khi tôi yếu đuối, chính lúc ấy tôi mạnh mẽ.
  to: Vì vậy, tôi lấy làm vui trong những sự yếu đuối, những sự sỉ nhục, những hoàn cảnh bức bách, những cuộc bắt bớ và những lúc quẫn bách vì Đấng Mê-si[a]; vì khi tôi yếu đuối, chính lúc ấy tôi mạnh mẽ.
  rationale: Bản sửa thay các cách diễn đạt có nguy cơ thu hẹp hoặc chồng lấn nghĩa trong danh sách, đồng thời dùng “tôi lấy làm vui” tự nhiên hơn cho εὐδοκῶ. Trật tự, tính số nhiều của danh sách, mối liên hệ “vì Đấng Mê-si”, và nghịch lý nguyên văn đều được giữ nguyên.
