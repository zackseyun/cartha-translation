id: 2CO.12.16
reference: 2 Corinthians 12:16
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἔστω δέ, ἐγὼ οὐ κατεβάρησα ὑμᾶς· ἀλλὰ ὑπάρχων πανοῦργος δόλῳ ὑμᾶς ἔλαβον.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/016.yaml
  text: 'But let it be so: I did not burden you[a]. Yet, being crafty[c][b], I took you by deceit.'
translation:
  language: vi
  text: 'Nhưng cứ cho là như vậy: tôi đã không làm gánh nặng cho anh chị em.[a] Nhưng vì là người xảo quyệt, tôi đã dùng mưu mẹo để lừa được anh chị em.[b][c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Vậy thì cứ cho là thế” hoặc “Dù sao đi nữa”; dường như Phao-lô đang tạm chấp nhận điểm này để tiếp tục lập luận.'
    reason: lexical_alternative
  - marker: b
    text: Câu “vì là người xảo quyệt, tôi đã dùng mưu mẹo để lừa được anh chị em” rất có thể là lời Phao-lô nhắc lại một cách mỉa mai lời cáo buộc chống lại ông, chứ không phải ông thật sự thú nhận.
    reason: alternative_reading
  - marker: c
    text: 'Cũng có thể dịch sát hơn: “tôi đã dùng mưu mẹo mà bắt được anh chị em”; hoặc theo nghĩa hàm ý: “tôi đã dùng sự gian dối để lợi dụng anh chị em.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔστω δέ
  choice: Nhưng cứ cho là như vậy
  rationale: 'Diễn đạt tự nhiên sắc thái nhượng bộ có tính tu từ: Phao-lô tạm chấp nhận một điểm để tiếp tục lập luận, mà không khẳng định điểm ấy là đúng.'
- source_word: κατεβάρησα
  choice: làm gánh nặng cho
  rationale: Giữ hình ảnh 'đè nặng/gây gánh nặng' của động từ Hy Lạp, đồng thời phù hợp với ngữ cảnh Phao-lô không đòi hỏi sự chu cấp vật chất từ tín hữu Cô-rinh-tô.
- source_word: ὑπάρχων
  choice: vì là
  rationale: Chuyển phân từ sang cách nói tự nhiên trong tiếng Việt. Trong lời cáo buộc được nhắc lại, cụm này thể hiện hoàn cảnh hoặc lý do bề ngoài mà không thêm lời giải thích vào chính câu.
- source_word: πανοῦργος
  choice: người xảo quyệt
  rationale: Từ này mang nghĩa tiêu cực về sự khôn khéo bất chính trong ngữ cảnh; 'xảo quyệt' giữ được giọng cáo buộc mạnh và tự nhiên.
- source_word: δόλῳ
  choice: dùng mưu gian
  rationale: Diễn đạt cách thức/phương tiện của cách dative, giữ rõ ý gian dối, thủ đoạn mà không dùng từ cổ khó hiểu.
- source_word: ἔλαβον
  choice: bắt lấy
  rationale: Giữ nghĩa tương đối sát là 'bắt/lấy được' trong một mưu kế, thay vì tự động giải nghĩa thành 'lợi dụng'; khả năng ấy được nêu trong chú thích.
theological_decisions:
- issue: Mệnh đề sau ἀλλὰ là lời thú nhận của Phao-lô hay lời ông nhắc lại một cáo buộc với giọng mỉa mai
  choice: 'Dịch trực tiếp: ''Tuy nhiên, vì là người xảo quyệt, tôi đã dùng mưu gian mà bắt lấy anh chị em.'''
  alternative: Diễn giải rõ trong câu rằng đây là lời người khác cáo buộc Phao-lô, hoặc dịch 'tôi đã lừa để lợi dụng anh chị em'.
  rationale: Ngữ cảnh rộng hơn cho thấy Phao-lô phủ nhận việc trục lợi, nên rất có thể ông đang mỉa mai nhắc lại lời cáo buộc. Tuy vậy, nguyên văn không đánh dấu minh nhiên đó là lời trích dẫn; bản dịch giữ nguyên sức căng tu từ và giải thích trong chú thích thay vì quyết định thay người đọc.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh chị em” cho đại từ số nhiều ὑμᾶς nhằm thể hiện cộng đồng tín hữu mà không gán giới tính; giữ cấu trúc tu từ sắc, hơi nghịch lý của nguyên văn. Các dấu chú thích [a], [b], [c] đều xuất hiện trong câu chính.
