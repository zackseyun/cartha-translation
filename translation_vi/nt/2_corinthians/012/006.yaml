    issue: “cũng không phải là người dại” thêm từ “cũng”
    rationale: οὐκ ἔσομαι ἄφρων không có yếu tố tương đương “cũng”; từ này tạo một liên hệ bổ sung không được nêu trong câu Hy Lạp.
  - severity: medium
    issue: “tự hào” làm dịu nghĩa của καυχήσασθαι
    rationale: Trong ngữ cảnh Phao-lô đang nói về việc tự đề cao/boasting, “khoe khoang” biểu đạt sát hơn; “tự hào” dễ nghiêng về niềm hãnh diện chính đáng.
  - severity: low
    issue: “tôi kiềm lại” chưa tự nhiên bằng “tôi tự kiềm chế”
    rationale: φείδομαι ở đây chỉ việc Phao-lô tự hạn chế không nói thêm. “Tự kiềm chế” là cách diễn đạt rõ và chuẩn hơn trong tiếng Việt hiện đại.
  - severity: low
    issue: Yếu tố τι chỉ được để trong chú thích, trong khi có thể dịch tự nhiên trong bản văn
    rationale: ἀκούει τι ἐξ ἐμοῦ nghĩa là ‘nghe điều gì từ tôi’. Việc đưa “điều” vào bản văn bảo toàn chi tiết nguồn mà vẫn tự nhiên; chú thích có thể nêu phương án rút gọn.
