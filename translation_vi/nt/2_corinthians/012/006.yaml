reference: 2 Corinthians 12:6
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐὰν γὰρ θελήσω καυχήσασθαι, οὐκ ἔσομαι ἄφρων, ἀλήθειαν γὰρ ἐρῶ· φείδομαι δέ, μή τις εἰς ἐμὲ λογίσηται ὑπὲρ ὃ βλέπει με ἢ ἀκούει ⸀τι ἐξ ἐμοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/006.yaml
  text: For if I should want to boast[a], I would not be foolish, for I would be speaking the truth. But I refrain, so that no one may reckon me above what he sees in me or hears from me.
translation:
  language: vi
  text: Vì nếu tôi muốn khoe khoang, tôi sẽ không phải là người dại, vì tôi sẽ nói sự thật. Nhưng tôi tự kiềm chế, để không ai đánh giá tôi cao hơn điều họ thấy nơi tôi hoặc điều họ nghe từ tôi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “hoặc nghe từ tôi.” Tiếng Hy Lạp có một đại từ bất định sau động từ “nghe”; trong tiếng Việt, yếu tố này cũng có thể được hiểu ngầm.'
    reason: lexical_alternative
lexical_decisions:
- source_word: θελήσω καυχήσασθαι
  choice: nếu tôi muốn tự hào
  rationale: Mệnh đề ἐὰν với động từ giả định diễn tả một khả năng có điều kiện. “Nếu tôi muốn” tự nhiên trong tiếng Việt; “tự hào” giữ sắc thái nói về điều đáng hãnh diện của καυχάομαι trong văn mạch, mà không mặc nhiên kết luận hành vi ấy là đúng hay sai.
- source_word: οὐκ ἔσομαι ἄφρων
  choice: tôi cũng không phải là người dại
  rationale: Diễn đạt tự nhiên giá trị vị ngữ của ἄφρων và duy trì mối liên hệ với mô-típ “người dại” trong phần văn mạch này.
- source_word: ἀλήθειαν γὰρ ἐρῶ
  choice: bởi tôi sẽ nói sự thật
  rationale: Giữ thì tương lai của ἐρῶ trong phạm vi điều kiện và chuyển mệnh đề sang tiếng Việt rõ ràng, tự nhiên.
- source_word: φείδομαι
  choice: tôi kiềm lại
  rationale: Trong văn mạch, động từ chỉ việc Phao-lô tự hạn chế, không tiếp tục tự hào. “Kiềm lại” rõ hành động tự chế mà không thêm tân ngữ không có trong nguyên văn.
- source_word: μή τις εἰς ἐμὲ λογίσηται
  choice: để không ai đánh giá tôi
  rationale: λογίζομαι ở đây nói đến việc hình thành sự đánh giá về Phao-lô; “đánh giá” tự nhiên và giữ được ý lượng định.
- source_word: ὑπὲρ ὃ βλέπει με
  choice: cao hơn những gì người ấy thấy nơi tôi
  rationale: “Cao hơn” thể hiện chuẩn mực bị vượt quá của ὑπέρ; “thấy nơi tôi” chuyển tải cơ sở quan sát về chính Phao-lô mà không giải thích quá mức.
- source_word: ἀκούει τι ἐξ ἐμοῦ
  choice: nghe từ tôi
  rationale: Cách nói gọn, tự nhiên trong tiếng Việt; yếu tố bất định τι có thể hiểu ngầm nhưng được nêu rõ trong chú thích để bảo toàn dữ kiện của nguyên văn.
theological_decisions:
- issue: Lời tự nhận và sự kiềm chế của Phao-lô khi tự hào
  choice: 'Giữ nguyên nghịch lý: điều ông có thể nói là sự thật nên ông không phải người dại, nhưng ông vẫn kiềm lại để người khác không đánh giá ông quá cao.'
  alternative: Diễn giải rằng Phao-lô hoàn toàn tán thành việc tự hào, hoặc rằng mọi sự tự hào ở đây nhất thiết là giả dối hay tội lỗi.
  rationale: Nguyên văn vừa khẳng định tính chân thật của điều Phao-lô có thể nói, vừa nhấn mạnh ông không nói ra vì không muốn người khác đánh giá mình vượt quá bằng chứng họ trực tiếp thấy và nghe.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “người ấy” để quy chiếu tự nhiên về “ai” trong mệnh đề trước; tránh cách dịch quá cổ như “khoe mình” hoặc quá kỹ thuật như “quy cho tôi.”
