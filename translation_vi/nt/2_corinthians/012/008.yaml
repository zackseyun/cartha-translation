  source_fidelity: 'Bản dịch truyền đạt đúng các yếu tố chính của câu: vấn đề được nói đến (ὑπὲρ τούτου), ba lần (τρὶς), lời nài xin với «Chúa» (τὸν κύριον), và việc điều gây khổ rời khỏi Phao-lô. Tuy nhiên, cấu trúc «khẩn cầu Chúa để nó...» kém tự nhiên trong tiếng Việt vì dễ đọc «để» như mục đích của hành động khẩn cầu. Dùng «xin cho» thể hiện rõ nội dung lời cầu xin và giá trị của mệnh đề ἵνα mà không xác định thêm chủ thể hàm ẩn.'
