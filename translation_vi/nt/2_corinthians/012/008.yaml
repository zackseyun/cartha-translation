translation:
  language: vi
  text: Về điều này[a], tôi đã ba lần khẩn cầu Chúa[b], xin cho nó rời khỏi tôi[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Vì điều này” hoặc “Liên quan đến điều này.”'
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn chỉ nói “Chúa”; Phao-lô không nêu đích danh Chúa Giê-su tại đây.
    reason: alternative_reading
  - marker: c
    text: 'Cũng có thể dịch: “xin cho nó lìa khỏi tôi” hoặc “xin cho nó tránh xa tôi.” Nguyên văn không nêu rõ chủ thể; chủ thể này quy chiếu về điều gây khổ được nhắc đến trong câu trước.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὑπὲρ τούτου
  choice: Về điều này
  rationale: ὑπέρ với sở hữu cách ở đây nêu vấn đề được nói đến và liên kết với nỗi khổ đã nhắc ở câu trước; cách diễn đạt này tự nhiên và không mang nghĩa ‘thay cho’.
- source_word: τρὶς
  choice: ba lần
  rationale: Trạng từ chỉ ba dịp; ‘ba lần’ là cách nói hiện đại, rõ ràng.
- source_word: τὸν κύριον
  choice: Chúa
  rationale: Giữ nguyên danh xưng κύριος mà không tự ý thêm tên Giê-su; trong tiếng Việt, ‘Chúa’ là cách dịch tự nhiên trong ngữ cảnh lời cầu nguyện.
- source_word: παρεκάλεσα
  choice: tôi đã ... khẩn cầu
  rationale: Trong ngữ cảnh cầu xin được giải thoát, παρακαλέω diễn tả một lời nài xin tha thiết; ‘khẩn cầu’ trang trọng nhưng vẫn dễ hiểu.
- source_word: ἵνα ἀποστῇ ἀπ’ ἐμοῦ
  choice: để nó lìa khỏi tôi
  rationale: ἵνα dẫn vào nội dung/mục đích của lời cầu xin; ἀποστῇ diễn tả việc rời đi. Đại từ ‘nó’ giữ chủ thể không được nêu rõ và hướng về nỗi khổ ở câu trước.
theological_decisions:
- issue: Đối tượng được gọi là τὸν κύριον
  choice: Chúa
  alternative: Chúa Giê-su
  rationale: Ngữ cảnh có khả năng chỉ về Chúa Giê-su, nhưng nguyên văn chỉ ghi ‘Chúa’; không thêm tên để tránh xác định quá mức điều câu này không nói rõ.
- issue: Chủ thể hàm ẩn của ἀποστῇ
  choice: nó
  alternative: người ấy; sứ giả ấy; cái gai ấy
  rationale: Nguyên văn không nêu chủ thể, còn câu trước nhắc cả ‘cái gai trong xác thịt’ và ‘một sứ giả của Sa-tan’. ‘Nó’ duy trì sự mơ hồ thay vì quyết định chủ thể là cái gai hay sứ giả.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. ‘Khẩn cầu’ truyền đạt tính tha thiết của lời cầu nguyện; ‘lìa khỏi tôi’ giữ sắc thái trang nghiêm mà không cổ hóa quá mức. Các chú thích bảo tồn những điểm mơ hồ có thật trong nguyên văn.
