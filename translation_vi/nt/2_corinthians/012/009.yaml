id: 2CO.12.9
reference: 2 Corinthians 12:9
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ εἴρηκέν μοι· Ἀρκεῖ σοι ἡ χάρις μου· ἡ γὰρ ⸀δύναμις ἐν ἀσθενείᾳ ⸀τελεῖται. ἥδιστα οὖν μᾶλλον καυχήσομαι ἐν ταῖς ἀσθενείαις ⸀μου, ἵνα ἐπισκηνώσῃ ἐπ’ ἐμὲ ἡ δύναμις τοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/009.yaml
  text: And he has said to me[a], “My grace is sufficient for you, for my power is made perfect in weakness.” Therefore I will boast all the more gladly in my weaknesses[d][c][b], so that the power of Messiah may dwell upon me.
translation:
  language: vi
  text: 'Ngài đã phán với tôi: “Ân điển của Ta đủ cho con, vì quyền năng được nên trọn vẹn trong sự yếu đuối.” Vì vậy, tôi sẽ càng vui mừng khoe về những yếu đuối của mình, để quyền năng của Đấng Mê-si-a phủ trên tôi.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “ngự trên tôi”; sát chữ hơn: “dựng lều trên tôi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴρηκέν
  choice: đã phán
  rationale: Thì hoàn thành chỉ lời đã được nói mà hiệu lực vẫn còn; tiếng Việt tự nhiên biểu đạt điều này bằng “đã phán” trong ngữ cảnh hiện tại.
- source_word: Ἀρκεῖ
  choice: đủ
  rationale: Diễn đạt trực tiếp và tự nhiên ý về sự đầy đủ, tương xứng.
- source_word: χάρις
  choice: ân điển
  rationale: Giữ thuật ngữ thần học quen thuộc trong văn phong Kinh Thánh tiếng Việt, bao hàm nhiều hơn nghĩa thiện cảm thông thường.
- source_word: δύναμις
  choice: quyền năng
  rationale: Giữ nguyên sự lặp lại của danh từ trong cả lời phán và lời đáp của Phao-lô, đồng thời phù hợp với quyền năng thuộc về Đấng Mê-si-a ở cuối câu.
- source_word: ἀσθενείᾳ / ἀσθενείαις
  choice: sự yếu đuối / những yếu đuối
  rationale: Giữ sự chuyển đổi từ số ít mang tính nguyên tắc sang số nhiều chỉ những trải nghiệm cụ thể của Phao-lô.
- source_word: τελεῖται
  choice: được nên trọn vẹn
  rationale: Bảo toàn sắc thái đạt đến mục đích hay biểu hiện đầy đủ, đồng thời giữ nguyên nghịch lý thần học của câu.
- source_word: ἥδιστα … μᾶλλον
  choice: càng vui lòng
  rationale: Diễn đạt tự nhiên lực tăng cường của hai trạng từ trong tiếng Việt mà không tạo cấu trúc nặng nề hoặc trùng ý.
- source_word: καυχήσομαι
  choice: sẽ … tự hào
  rationale: Truyền đạt nghịch lý tu từ của việc hãnh diện về những yếu đuối; “tự hào” tự nhiên hơn “khoe mình” trong tiếng Việt hiện đại tại đây.
- source_word: ἐπισκηνώσῃ ἐπ’ ἐμέ
  choice: ngự trên tôi
  rationale: Diễn đạt dễ hiểu ý quyền năng hiện diện và bao phủ, còn hình ảnh sát chữ về dựng lều được ghi ở chú thích.
- source_word: Χριστοῦ
  choice: của Đấng Mê-si-a
  rationale: Dịch Χριστός như một tước hiệu tại đây, thay vì mặc nhiên chuyển thành tên riêng.
theological_decisions:
- issue: Có nên thêm đại từ sở hữu với δύναμις hay không
  choice: “vì quyền năng được nên trọn vẹn” trong chính văn
  alternative: “vì quyền năng của Ta được nên trọn vẹn”
  rationale: Văn bản SBLGNT được cung cấp không có μου sau δύναμις; không tự ý thêm sở hữu từ để giải quyết quan hệ thần học. Dị bản có sở hữu từ được nêu trong chú thích.
- issue: Cách dịch τελεῖται khi nói về quyền năng
  choice: “được nên trọn vẹn”
  alternative: “được hoàn thiện” hoặc “đạt đến sự viên mãn”
  rationale: Cách chọn giữ sức căng của nguyên văn về quyền năng được biểu lộ trọn vẹn trong sự yếu đuối, nhưng không giải thích rằng quyền năng trước đó có khiếm khuyết đạo đức.
- issue: Cách dịch Χριστοῦ
  choice: “của Đấng Mê-si-a”
  alternative: “của Đấng Christ”
  rationale: Giữ chức năng tước hiệu của Χριστός trong cụm “quyền năng của…”, không áp đặt cách hiểu như một tên riêng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “Ta/con” phản ánh lời của Chúa nói trực tiếp với Phao-lô; “tôi” được giữ cho lời Phao-lô. Dùng “Đấng Mê-si-a” như tước hiệu. Các dấu chú thích [a], [b] đều xuất hiện đúng trong chính văn.
