revisions:
- from: Tôi đã khẩn khoản đề nghị Tít đi và sai người anh em kia đi cùng. Tít đâu có lợi dụng anh chị em, phải không? Chẳng phải chúng tôi đã bước đi trong cùng một tinh thần[a] sao? Chẳng phải chúng tôi đã bước theo cùng những dấu chân sao?
  to: Tôi đã khẩn khoản đề nghị Tít đi và cử người anh em đi cùng với anh ấy. Tít đã không lợi dụng anh chị em, phải không? Chẳng phải chúng tôi đã bước đi trong cùng một tinh thần[a] sao? Chẳng phải chúng tôi đã đi theo cùng một lối bước sao?
