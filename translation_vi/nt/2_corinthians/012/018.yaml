reference: 2 Corinthians 12:18
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: παρεκάλεσα Τίτον καὶ συναπέστειλα τὸν ἀδελφόν· μήτι ἐπλεονέκτησεν ὑμᾶς Τίτος; οὐ τῷ αὐτῷ πνεύματι περιεπατήσαμεν; οὐ τοῖς αὐτοῖς ἴχνεσιν;
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/018.yaml
  text: I urged Titus to go and sent the brother with him. Titus did not take advantage of you[a], did he? Did we not walk in the same spirit? Did we not walk in the same footsteps?
translation:
  language: vi
  text: Tôi đã khẩn khoản đề nghị Tít đi và cử người anh em đi cùng với anh ấy. Tít đã không lợi dụng anh chị em, phải không? Chẳng phải chúng tôi đã bước đi trong cùng một tinh thần[a] sao? Chẳng phải chúng tôi đã đi theo cùng một lối bước sao?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “nhờ cùng một Thánh Linh,” có lẽ chỉ về Đức Thánh Linh chứ không chỉ cùng một thái độ hoặc tâm thế.'
    reason: alternative_reading
lexical_decisions:
- source_word: παρεκάλεσα
  choice: đã khẩn khoản đề nghị Tít đi
  rationale: Động từ παρακαλέω ở đây diễn tả lời đề nghị hoặc thúc giục tha thiết trong bối cảnh một sứ vụ thực tế. “Đi” được bổ sung theo ngữ cảnh để câu tiếng Việt tự nhiên.
- source_word: συναπέστειλα
  choice: sai ... đi cùng
  rationale: Động từ ghép này chỉ việc sai một người đi cùng người khác; cách diễn đạt này rõ ràng và tự nhiên trong tiếng Việt.
- source_word: τὸν ἀδελφόν
  choice: người anh em kia
  rationale: Nguyên văn có mạo từ xác định nhưng không có đại từ sở hữu, dường như chỉ một tín hữu mà độc giả đã biết; “kia” thể hiện tính xác định mà không thêm ý “của chúng tôi”.
- source_word: μήτι
  choice: đâu có ... phải không?
  rationale: μήτι mở đầu câu hỏi mong đợi câu trả lời phủ định. Cấu trúc này truyền đạt tự nhiên sắc thái “chắc chắn là không” trong tiếng Việt.
- source_word: ἐπλεονέκτησεν ὑμᾶς
  choice: lợi dụng anh chị em
  rationale: πλεονεκτέω nói đến việc trục lợi hoặc giành lợi thế gây thiệt hại cho người khác. “Lợi dụng” đủ rộng cho bối cảnh, trong đó khía cạnh tài chính có thể được hàm ý nhưng không bị giới hạn.
- source_word: τῷ αὐτῷ πνεύματι
  choice: trong cùng một tinh thần
  rationale: Cách dịch này giữ khả năng hiểu πνεῦμα là tinh thần hoặc thái độ chung, đồng thời chú thích khả năng chỉ về Thánh Linh.
- source_word: περιεπατήσαμεν
  choice: chúng tôi đã bước đi
  rationale: Giữ lại ẩn dụ “bước đi” quen thuộc trong văn phong Phao-lô về cách sống và cư xử.
- source_word: τοῖς αὐτοῖς ἴχνεσιν
  choice: theo cùng những dấu chân
  rationale: ἴχνος là dấu chân hoặc vết chân, được dùng ẩn dụ về cùng một đường lối cư xử. Cách dịch giữ nguyên hình ảnh của nguyên văn.
theological_decisions:
- issue: Ý nghĩa của τῷ αὐτῷ πνεύματι
  choice: “trong cùng một tinh thần,” chủ yếu chỉ cùng thái độ hoặc cách hành xử
  alternative: “nhờ cùng một Thánh Linh,” chỉ về Đức Thánh Linh
  rationale: Ngữ cảnh trực tiếp nhấn mạnh sự nhất quán và liêm chính trong cách Phao-lô và Tít hành xử. Tuy nhiên, cấu trúc cách dữ liệu của tiếng Hy Lạp cũng có thể được hiểu theo nghĩa tác nhân hoặc phương tiện và chỉ về Thánh Linh, nên chú thích bảo lưu khả năng này.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “anh chị em” cho đại từ số nhiều ὑμᾶς; giữ các ẩn dụ “bước đi” và “dấu chân.” Hai câu hỏi tu từ được giữ riêng, đều thể hiện sự mong đợi câu trả lời phủ định.
