id: 2CO.12.21
reference: 2 Corinthians 12:21
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: μὴ πάλιν ⸂ἐλθόντος μου⸃ ⸀ταπεινώσῃ ⸀με ὁ θεός μου πρὸς ὑμᾶς, καὶ πενθήσω πολλοὺς τῶν προημαρτηκότων καὶ μὴ μετανοησάντων ἐπὶ τῇ ἀκαθαρσίᾳ καὶ πορνείᾳ καὶ ἀσελγείᾳ ᾗ ἔπραξαν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/021.yaml
  text: I fear that when I come again[a], my God may humble me before you[d][c][b], and I will mourn over many who have sinned before and have not repented of the impurity and sexual immorality and sensuality that they practiced.
translation:
  language: vi
  text: Tôi e rằng khi tôi trở lại, Đức Chúa Trời của tôi có thể hạ thấp tôi trước mặt anh chị em[a], và tôi sẽ than khóc cho nhiều người đã phạm tội trước đây mà vẫn chưa ăn năn về sự ô uế, sự vô luân về tình dục và sự phóng đãng mà họ đã thực hành[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “có thể làm nhục tôi giữa anh chị em.” Động từ Hy Lạp có thể mang nghĩa “hạ thấp,” “làm cho thấp hèn” hoặc “làm nhục”; giới từ cũng có thể được hiểu là “giữa anh chị em.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cụm này cũng có thể dịch: “sự ô uế, gian dâm và buông thả mà họ đã thực hành.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ πάλιν ἐλθόντος μου
  choice: Tôi e rằng khi tôi lại đến
  rationale: Mệnh đề tiếp nối ý ‘e rằng’ ở câu 20; tiếng Việt cần nêu lại ý này để câu đứng riêng được rõ. ‘Khi tôi lại đến’ diễn đạt tự nhiên phân từ sở hữu cách chỉ thời gian và πάλιν.
- source_word: ταπεινώσῃ με ὁ θεός μου
  choice: Đức Chúa Trời của tôi sẽ hạ tôi xuống
  rationale: ταπεινόω có thể là hạ xuống, làm cho thấp hèn hoặc làm nhục. ‘Hạ tôi xuống’ giữ được nghĩa rộng và không mặc nhiên biến điều này thành sự sỉ nhục công khai.
- source_word: πρὸς ὑμᾶς
  choice: trước mặt anh chị em
  rationale: Trong văn cảnh chuyến thăm, cụm từ diễn tả việc Phao-lô bị hạ xuống khi ở với người Cô-rinh-tô; ‘trước mặt’ tự nhiên và vẫn cho thấy sự việc xảy ra trong sự hiện diện của họ.
- source_word: πενθήσω
  choice: tôi sẽ phải than khóc
  rationale: πενθέω diễn tả nỗi đau buồn sâu sắc như than khóc. Từ ‘phải’ truyền đạt kết quả đáng sợ mà Phao-lô dự liệu, chứ không thêm một nghĩa vụ giáo lý.
- source_word: πολλοὺς τῶν προημαρτηκότων
  choice: nhiều người trong số những người đã phạm tội từ trước
  rationale: 'Giữ cấu trúc bộ phận ‘nhiều người trong số’ và sắc thái của phân từ hoàn thành: họ đã phạm tội trước đó, với hậu quả vẫn còn liên quan ở hiện tại.'
- source_word: μὴ μετανοησάντων
  choice: mà vẫn chưa ăn năn
  rationale: ‘Vẫn chưa’ thể hiện tình trạng chưa ăn năn còn kéo dài đến thời điểm Phao-lô dự định đến.
- source_word: ἀκαθαρσίᾳ
  choice: sự ô uế
  rationale: ‘Ô uế’ giữ phạm vi đạo đức rộng của danh từ Hy Lạp và phù hợp với ngữ cảnh danh sách các tội.
- source_word: πορνείᾳ
  choice: vô luân tình dục
  rationale: Cách nói hiện đại này truyền đạt nghĩa rộng của πορνεία rõ hơn ‘gian dâm’, vốn trong tiếng Việt có thể bị hiểu hẹp là ngoại tình.
- source_word: ἀσελγείᾳ
  choice: phóng đãng
  rationale: ἀσέλγεια chỉ hành vi buông thả, trơ trẽn, thường có sắc thái tình dục; ‘phóng đãng’ vừa tự nhiên vừa phân biệt với hai từ đứng trước.
- source_word: ᾗ ἔπραξαν
  choice: họ từng làm
  rationale: Đại từ quan hệ quy chiếu chung về ba điều vừa kể; ‘từng làm’ diễn đạt πράσσω là hành vi đã được thực hiện mà không thu hẹp thành một lần duy nhất.
theological_decisions:
- issue: Lực của μή khi câu này tiếp nối động từ ‘e rằng’ ở câu trước
  choice: Nêu rõ ‘Tôi e rằng’ ở đầu câu
  alternative: 'Dịch sát cấu trúc phụ thuộc: ‘Kẻo khi tôi lại đến…’'
  rationale: Bản Hy Lạp tiếp tục nỗi lo được nêu ở câu 20. Việc lặp lại ‘Tôi e rằng’ giúp câu trích riêng rõ nghĩa nhưng không biến điều Phao-lô lo sợ thành một lời khẳng định chắc chắn.
- issue: Ý nghĩa của việc Đức Chúa Trời ‘hạ’ Phao-lô xuống
  choice: Giữ cách nói rộng ‘hạ tôi xuống’
  alternative: ‘làm nhục tôi’ hoặc ‘khiến tôi phải hổ thẹn’
  rationale: Nguyên văn có thể bao hàm việc bị hạ thấp hoặc chịu nhục vì tình trạng của hội thánh. Bản dịch không quyết định quá mức về cách thức hay mục đích thần học của hành động này.
- issue: Ba thuật ngữ chỉ tội lỗi
  choice: 'Giữ ba mục riêng biệt: ‘sự ô uế, vô luân tình dục và phóng đãng’'
  alternative: Gộp thành một khái niệm chung về tội tình dục
  rationale: Nguyên văn liệt kê ba danh từ chồng lấn nhưng không đồng nhất; giữ riêng từng từ tránh áp đặt một định nghĩa giáo phái hẹp.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. Dùng ‘anh chị em’ để diễn đạt đại từ số nhiều chỉ cộng đồng tín hữu; dùng ‘Đức Chúa Trời’ theo lối gọi phổ thông trong Kinh Thánh tiếng Việt. Tránh thuật ngữ cổ ‘tà dâm’ và tránh hiểu ‘gian dâm’ theo nghĩa quá hẹp trong chính văn.
