  yaml_path: translation/nt/2_corinthians/012/017.yaml
  text: Did I exploit you through any of those whom I sent to you?[a]
translation:
  language: vi
  text: Trong số những người tôi đã sai đến với anh chị em, có ai mà qua người ấy tôi đã trục lợi từ anh chị em không?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “lợi dụng anh chị em” hoặc “lừa lấy của anh chị em.” Động từ Hy Lạp mang ý thu lợi bằng cách gây thiệt hại cho người khác.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μή
  choice: có ... không?
  rationale: μή mở đầu câu hỏi tu từ chờ câu trả lời phủ định; cấu trúc “có ... không?” tự nhiên trong tiếng Việt và vẫn giữ lực chất vấn.
- source_word: τινα ὧν
  choice: trong số những người ... có ai
  rationale: 'Giữ ý phân bộ: bất kỳ một người nào thuộc nhóm những người Phao-lô đã sai đi.'
- source_word: ἀπέσταλκα
  choice: tôi đã sai đến
  rationale: Diễn đạt thể hoàn thành bằng “đã” phù hợp ngữ cảnh, tập trung vào những người đã được phái đến Cô-rinh-tô.
- source_word: πρὸς ὑμᾶς
  choice: đến với anh chị em
  rationale: Cách diễn đạt hướng đến người nhận tự nhiên, đồng thời “anh chị em” cho thấy đại từ số nhiều chỉ cộng đồng tín hữu.
- source_word: δι’ αὐτοῦ
  choice: qua người ấy
  rationale: Giữ nguyên đại từ số ít của Hy Lạp, quy chiếu phân phối đến bất cứ người nào vừa được nêu, thay vì làm phẳng thành một cấu trúc số nhiều.
- source_word: ἐπλεονέκτησα
  choice: trục lợi từ
  rationale: “Trục lợi từ” diễn tả việc kiếm lợi bất chính bằng cách gây thiệt hại hoặc lợi dụng người khác, phù hợp sắc thái của πλεονεκτέω trong ngữ cảnh.
- source_word: ὑμᾶς
  choice: anh chị em
  rationale: Đại từ số nhiều chỉ các tín hữu Cô-rinh-tô; cách gọi này tự nhiên, trang trọng và bao quát trong tiếng Việt hiện đại.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu hỏi tu từ giữ nguyên kỳ vọng về câu trả lời phủ định; đại từ số ít “người ấy” bảo toàn cấu trúc δι’ αὐτοῦ của nguyên văn.
