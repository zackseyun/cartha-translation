revisions:
- from: Tôi đã trở nên ngu dại; chính anh chị em đã buộc tôi phải như vậy. Vì lẽ ra tôi phải được anh chị em tiến cử; bởi tôi chẳng thua kém gì những sứ đồ siêu hạng ấy[a], cho dù tôi chẳng là gì cả.
  to: Tôi đã thành một kẻ ngu dại; chính anh chị em đã buộc tôi phải làm thế. Vì lẽ ra tôi phải được anh chị em khen ngợi; bởi tôi chẳng thua kém gì những sứ đồ siêu hạng ấy[a], cho dù tôi chẳng là gì cả.
  rationale: Thay “tiến cử” bằng “khen ngợi” để diễn đạt đúng và tự nhiên hơn ý được cộng đoàn công khai xác nhận/đề cao. Điều chỉnh “đã trở nên ngu dại” thành “đã thành một kẻ ngu dại” để phản ánh rõ cấu trúc danh từ vị ngữ. Các yếu tố khác, đặc biệt cách dịch cụm “những sứ đồ siêu hạng,” được giữ nguyên nhằm bảo toàn tính cường điệu và sự mơ hồ tu từ của nguyên văn.
