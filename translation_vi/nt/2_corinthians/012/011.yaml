  terminology: Giữ “sứ đồ” và “những sứ đồ siêu hạng” là phù hợp với thuật ngữ và bảo toàn lực cường điệu của ὑπερλίαν mà không áp đặt cách hiểu mỉa mai. “Khen ngợi” phù hợp hơn “tiến cử” cho συνίστασθαι trong ngữ cảnh này.
