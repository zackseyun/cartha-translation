id: 2CO.12.11
reference: 2 Corinthians 12:11
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Γέγονα ⸀ἄφρων· ὑμεῖς με ἠναγκάσατε· ἐγὼ γὰρ ὤφειλον ὑφ’ ὑμῶν συνίστασθαι. οὐδὲν γὰρ ὑστέρησα τῶν ὑπερλίαν ἀποστόλων, εἰ καὶ οὐδέν εἰμι·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/011.yaml
  text: I have become a fool; you forced me to it. For I ought to have been commended by you[a], for I fell short in nothing compared with those super-apostles, even if I am nothing.
translation:
  language: vi
  text: Tôi đã thành một kẻ ngu dại; chính anh chị em đã buộc tôi phải làm thế. Vì lẽ ra tôi phải được anh chị em khen ngợi; bởi tôi chẳng thua kém gì những sứ đồ siêu hạng ấy[a], cho dù tôi chẳng là gì cả.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “những sứ đồ lỗi lạc nhất.” Cụm từ Hy Lạp có mức độ nhấn mạnh rất mạnh và trong ngữ cảnh có thể mang ý mỉa mai.
    reason: alternative_reading
lexical_decisions:
- source_word: Γέγονα
  choice: đã trở nên
  rationale: Thì hoàn thành diễn tả tình trạng hiện tại phát sinh từ hành động trước đó; “đã trở nên” giữ được sắc thái ấy.
- source_word: ἄφρων
  choice: ngu dại
  rationale: Diễn đạt tự nhiên lời tự nhận mang tính tu từ của Phao-lô trong mạch văn nói về việc khoe mình.
- source_word: ὑμεῖς με ἠναγκάσατε
  choice: chính anh chị em đã buộc tôi phải như vậy
  rationale: “Chính anh chị em” giữ sự nhấn mạnh của đại từ ὑμεῖς; “như vậy” chỉ việc hành xử ngu dại trong ngữ cảnh mà không giải thích quá mức.
- source_word: ὑφ’ ὑμῶν συνίστασθαι
  choice: phải được anh chị em tiến cử
  rationale: Giữ cấu trúc bị động và tác nhân được nêu rõ; “tiến cử” phù hợp với ngữ cảnh người Cô-rinh-tô đáng lẽ phải đứng ra xác nhận, nói có lợi cho Phao-lô.
- source_word: οὐδὲν ... ὑστέρησα
  choice: chẳng thua kém gì
  rationale: Diễn đạt trực tiếp ý không đứng sau hay không kém hơn trong phép so sánh.
- source_word: τῶν ὑπερλίαν ἀποστόλων
  choice: những sứ đồ siêu hạng ấy
  rationale: Giữ mức độ nhấn mạnh mạnh của ὑπερλίαν và cho phép người đọc nhận ra sắc thái có thể là mỉa mai, nhưng không thêm từ “tự xưng” hay dấu ngoặc kép để quyết định hộ cách hiểu.
- source_word: εἰ καὶ οὐδέν εἰμι
  choice: cho dù tôi chẳng là gì cả
  rationale: Giữ nguyên sắc thái nhượng bộ và lời tự hạ mình đầy căng thẳng của Phao-lô.
theological_decisions:
- issue: Sắc thái của τῶν ὑπερλίαν ἀποστόλων
  choice: “những sứ đồ siêu hạng ấy” trong chính văn, để ngỏ khả năng mỉa mai hay luận chiến
  alternative: “những sứ đồ lỗi lạc nhất” theo cách hiểu không mỉa mai
  rationale: Cụm Hy Lạp có tính cường điệu rất mạnh và trong ngữ cảnh có thể mang ý mỉa mai, nhưng bản thân câu không có dấu hiệu từ vựng buộc phải thêm “tự xưng” hoặc “gọi là.” Bản dịch vì thế bảo toàn sự căng thẳng này.
- issue: Lời Phao-lô nói mình “chẳng là gì”
  choice: Giữ nguyên “cho dù tôi chẳng là gì cả”
  alternative: Diễn giải nhẹ thành “dù bản thân tôi không đáng kể”
  rationale: Cách dịch sát hơn bảo toàn sự đối nghịch có chủ ý giữa lời khẳng định không thua kém các sứ đồ kia và lời tự hạ mình, thay vì làm dịu căng thẳng thần học-tu từ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” để chỉ cộng đồng tín hữu; giữ hai liên từ giải thích γάρ bằng “vì” và “bởi.” Không dùng dấu ngoặc kép quanh “sứ đồ siêu hạng” để tránh áp đặt sắc thái mỉa mai vốn chỉ được gợi ra bởi ngữ cảnh.
