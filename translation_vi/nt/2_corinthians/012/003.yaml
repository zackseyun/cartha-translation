source:
  edition: SBLGNT
  text: καὶ οἶδα τὸν τοιοῦτον ἄνθρωπον— εἴτε ἐν σώματι εἴτε ⸀χωρὶς τοῦ σώματος οὐκ οἶδα, ὁ θεὸς οἶδεν—
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/003.yaml
  text: And I know such a man—whether in the body or apart from the body I do not know[a]; God knows—
translation:
  language: vi
  text: Và tôi biết một người như thế—dù ở trong thân thể hay lìa khỏi thân thể, tôi không biết[a]; Đức Chúa Trời biết—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch “ngoài thân thể” thay cho “lìa khỏi thân thể”. Phao-lô không cho biết kinh nghiệm ấy xảy ra trong thân thể hay lìa khỏi thân thể.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἶδα
  choice: biết
  rationale: Cách dịch tự nhiên và trực tiếp cho ý niệm nhận biết; sự lặp lại “tôi biết/Đức Chúa Trời biết” được giữ để bảo toàn điểm nhấn tu từ.
- source_word: τὸν τοιοῦτον ἄνθρωπον
  choice: một người như thế
  rationale: Giữ lối nói ngôi thứ ba và sự quy chiếu về người đã được mô tả ở câu trước, mà không giải thích thẳng đó là Phao-lô.
- source_word: εἴτε ... εἴτε
  choice: dù ... hay
  rationale: Diễn đạt tự nhiên trong tiếng Việt hai khả năng được đặt song song nhưng chưa được xác định.
- source_word: ἐν σώματι
  choice: ở trong thân thể
  rationale: Giữ hình ảnh không gian của nguyên văn và tạo thế đối xứng rõ với “lìa khỏi thân thể”.
- source_word: χωρὶς τοῦ σώματος
  choice: lìa khỏi thân thể
  rationale: Diễn đạt sự tách rời mà không khẳng định bản chất siêu hình của kinh nghiệm; “ở ngoài thân thể” được ghi nhận như một cách dịch khác.
- source_word: οὐκ οἶδα, ὁ θεὸς οἶδεν
  choice: tôi không biết; Đức Chúa Trời biết
  rationale: Giữ sự tương phản rõ rệt giữa giới hạn hiểu biết của người nói và sự biết của Đức Chúa Trời.
- source_word: θεὸς
  choice: Đức Chúa Trời
  rationale: Danh xưng tiêu chuẩn, trang trọng và dễ hiểu trong tiếng Việt hiện đại.
theological_decisions:
- issue: Lối tự quy chiếu gián tiếp của Phao-lô và bản chất của kinh nghiệm
  choice: Giữ cách nói “một người như thế” và không xác định kinh nghiệm xảy ra trong thân thể hay lìa khỏi thân thể.
  alternative: Nói rõ người ấy là Phao-lô, hoặc dịch theo cách khẳng định đây là một trải nghiệm xuất hồn.
  rationale: Nguyên văn duy trì khoảng cách tu từ và để ngỏ hai khả năng; bản dịch không nên giải quyết điều Phao-lô chủ ý không xác định.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. Dấu gạch ngang giữ cấu trúc xen giải và sự dang dở nối với văn mạch; dấu chấm phẩy làm nổi bật đối lập “tôi không biết; Đức Chúa Trời biết”.
