  to: Quả thật, những dấu hiệu của một sứ đồ[a] đã được thực hiện giữa anh chị em với tất cả sự kiên trì, bằng những dấu lạ, những việc kỳ diệu và những việc quyền năng[b].
  rationale: Chỉ điều chỉnh “việc kỳ diệu” thành “những việc kỳ diệu” để phản ánh số nhiều của τέρασιν và làm bộ ba thuật ngữ song hành hơn. Không thay đổi cách hiểu về dấu hiệu của sứ đồ, thể bị động, hay quan hệ giữa sự kiên trì và các biểu hiện quyền năng.
