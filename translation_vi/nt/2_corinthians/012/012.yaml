  source_fidelity: 'Bản dịch giữ đúng cấu trúc và ý chính của nguyên văn: μέν được diễn đạt bằng “Quả thật”; τοῦ ἀποστόλου được hiểu theo nghĩa khái quát qua “của một sứ đồ”; κατειργάσθη vẫn là bị động; ἐν ὑμῖν là phạm vi cộng đồng; và bộ ba σημεῖα, τέρατα, δυνάμεις được giữ phân biệt. Cần sửa số nhiều của τέρασιν cho nhất quán và rõ sát nguyên văn.'
