id: 2CO.12.12
reference: 2 Corinthians 12:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τὰ μὲν σημεῖα τοῦ ἀποστόλου κατειργάσθη ἐν ὑμῖν ἐν πάσῃ ⸀ὑπομονῇ, σημείοις ⸀τε καὶ τέρασιν καὶ δυνάμεσιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/012.yaml
  text: Indeed[a], the signs of an apostle were performed among you with all perseverance[b], with signs and wonders and powers.
translation:
  language: vi
  text: Quả thật, những dấu hiệu của một sứ đồ[a] đã được thực hiện giữa anh chị em với tất cả sự kiên trì, bằng những dấu lạ, những việc kỳ diệu và những việc quyền năng[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “của vị sứ đồ” nếu hiểu cụm từ này nói riêng về Phao-lô, thay vì nói chung về những dấu hiệu đặc trưng cho một sứ đồ.
    reason: alternative_reading
  - marker: b
    text: “Những việc quyền năng” cũng có thể dịch là “các phép lạ” hoặc “những việc phi thường”; từ Hy Lạp nhấn mạnh các hành động biểu lộ quyền năng.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ μὲν σημεῖα
  choice: Quả thật, những dấu hiệu
  rationale: μέν nhấn mạnh lời khẳng định dù không có vế δέ đi kèm; “quả thật” diễn đạt tự nhiên sắc thái ấy, còn “dấu hiệu” giữ nghĩa rộng của σημεῖα trong mệnh đề chính.
- source_word: τοῦ ἀποστόλου
  choice: của một sứ đồ
  rationale: 'Cụm sở hữu cách có thể mang nghĩa phẩm chất hoặc khái quát: những dấu hiệu đặc trưng cho một sứ đồ. Cách dịch này không loại trừ khả năng cụm từ chỉ riêng Phao-lô.'
- source_word: κατειργάσθη
  choice: đã được thực hiện
  rationale: Giữ thể bị động và sắc thái kết quả của động từ, đồng thời không xác định rõ tác nhân mà nguyên văn không nêu.
- source_word: ἐν ὑμῖν
  choice: giữa anh chị em
  rationale: Trong ngữ cảnh, các dấu hiệu diễn ra trong cộng đồng Cô-rinh-tô, không phải ở bên trong từng cá nhân.
- source_word: ἐν πάσῃ ὑπομονῇ
  choice: với tất cả sự kiên trì
  rationale: ὑπομονή chỉ sự bền lòng chịu đựng trong khó khăn; cách dịch giữ được phạm vi nhấn mạnh của πάσῃ.
- source_word: σημείοις τε καὶ τέρασιν καὶ δυνάμεσιν
  choice: bằng những dấu lạ, việc kỳ diệu và những việc quyền năng
  rationale: 'Giữ ba thuật ngữ phân biệt: σημεῖα là “dấu lạ”, τέρατα là “việc kỳ diệu”, và δυνάμεις là những hành động biểu lộ quyền năng; “bằng” thể hiện khả năng công cụ/giải thích của cấu trúc ἐν.'
theological_decisions:
- issue: Ý nghĩa của “những dấu hiệu của một sứ đồ”
  choice: Giữ nghĩa rộng là những bằng chứng hoặc đặc điểm xác nhận chức vụ sứ đồ, được biểu lộ qua cả sự kiên trì và các hành động kỳ diệu.
  alternative: Hiểu cụm này theo nghĩa hẹp, chỉ các phép lạ là dấu hiệu xác định tư cách sứ đồ.
  rationale: Cú pháp nêu “những dấu hiệu của một sứ đồ” làm khẳng định chính rồi nói đến sự kiên trì cùng các dấu lạ, việc kỳ diệu và việc quyền năng. Bản dịch không áp đặt một danh sách tín lý cố định về các tiêu chuẩn của sứ đồ.
- issue: τοῦ ἀποστόλου là khái quát hay xác định
  choice: Dịch “của một sứ đồ” để thể hiện cách hiểu phẩm chất hoặc khái quát.
  alternative: Dịch “của vị sứ đồ” và hiểu là nói riêng về Phao-lô.
  rationale: Mạo từ Hy Lạp cho phép cách hiểu xác định, nhưng trong ngữ cảnh cụm từ có thể diễn tả những dấu hiệu đặc trưng cho tư cách sứ đồ. Chú thích bảo tồn khả năng còn lại.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại. “Anh chị em” truyền đạt số nhiều ὑμῖν và cách Phao-lô hướng đến toàn thể cộng đồng; câu giữ cấu trúc bị động và sự lặp ý giữa “dấu hiệu” với bộ ba phép lạ mà không làm phẳng sự phân biệt từ vựng.
