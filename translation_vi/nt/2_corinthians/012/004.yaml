id: 2CO.12.4
reference: 2 Corinthians 12:4
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὅτι ἡρπάγη εἰς τὸν παράδεισον καὶ ἤκουσεν ἄρρητα ῥήματα ἃ οὐκ ἐξὸν ἀνθρώπῳ λαλῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/004.yaml
  text: that he was caught up into paradise and heard inexpressible words, which a man is not permitted to speak.
translation:
  language: vi
  text: người ấy đã được đem lên nơi Pa-ra-đi và nghe những lời không thể diễn tả, là những lời con người không được phép nói ra.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡρπάγη
  choice: đã được đem lên
  rationale: Diễn đạt thể bị động và chuyển động hướng lên của động từ; ngữ cảnh câu trước đã làm rõ tính đột ngột, nên tránh thêm ý không có trong câu này.
- source_word: παράδεισον
  choice: nơi Pa-ra-đi
  rationale: Giữ thuật ngữ chỉ cõi phước hạnh theo ngữ cảnh Do Thái–Hy Lạp, đồng thời dùng 'nơi' để câu tiếng Việt tự nhiên.
- source_word: ἄρρητα ῥήματα
  choice: những lời không thể diễn tả
  rationale: Phản ánh ý những lời không thể nói thành lời; không đồng nhất cụm này với mệnh đề tiếp theo về điều không được phép nói.
- source_word: ἀνθρώπῳ
  choice: con người
  rationale: Danh từ số ít mang nghĩa khái quát về loài người, không nhấn mạnh giới tính nam.
- source_word: λαλῆσαι
  choice: nói ra
  rationale: Cách diễn đạt tự nhiên, giữ ý phát ngôn bằng lời.
theological_decisions:
- issue: Quan hệ giữa 'không thể diễn tả' và 'không được phép nói ra'
  choice: Giữ cả hai ý riêng biệt
  alternative: Gộp thành ý duy nhất rằng các lời ấy tuyệt đối không thể phát âm
  rationale: ἄρρητα có thể chỉ điều không thể diễn đạt, còn οὐκ ἐξόν chỉ điều không được phép; bản dịch bảo tồn sức căng giữa khả năng diễn đạt và sự cho phép.
- issue: Chủ thể của lệnh cấm
  choice: Dùng cấu trúc vô nhân xưng 'không được phép'
  alternative: Thêm 'Đức Chúa Trời không cho phép'
  rationale: Nguyên văn không nêu rõ tác nhân ban lệnh, nên không bổ sung.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng 'Pa-ra-đi' để giữ danh xưng đặc thù; 'con người' thể hiện nghĩa khái quát của ἀνθρώπῳ.
