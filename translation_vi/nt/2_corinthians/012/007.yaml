id: 2CO.12.7
reference: 2 Corinthians 12:7
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ τῇ ὑπερβολῇ τῶν ἀποκαλύψεων. ⸀διὸ ἵνα μὴ ὑπεραίρωμαι, ἐδόθη μοι σκόλοψ τῇ σαρκί, ἄγγελος ⸀Σατανᾶ, ἵνα με κολαφίζῃ, ⸂ἵνα μὴ ὑπεραίρωμαι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/007.yaml
  text: And because of the surpassing greatness of the revelations—so that I might not exalt myself—a thorn in the flesh was given to me[a], a messenger of Satan, so that it might torment me[e][d][c][b], so that I might not exalt myself.
translation:
  language: vi
  text: Và vì những sự mặc khải quá đỗi lớn lao—để tôi không tự cao—một cái gai trong thân xác đã được ban cho tôi[a], một sứ giả của Sa-tan[b], để đánh đập tôi[c], để tôi không tự cao[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “một cái cọc nhọn trong thân xác.” Từ Hy Lạp σκόλοψ có thể chỉ cái cọc nhọn, mảnh dằm hoặc cái gai; hình ảnh chính xác không rõ.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “một thiên sứ của Sa-tan.” Từ Hy Lạp ἄγγελος có thể có nghĩa là “sứ giả” hoặc “thiên sứ.”'
    reason: alternative_reading
  - marker: c
    text: 'Cũng có thể dịch: “để hành hạ tôi” hoặc “để giáng những cú đánh vào tôi.” Động từ Hy Lạp κολαφίζῃ theo nghĩa đen chỉ việc đánh hoặc đấm liên tiếp.'
    reason: lexical_alternative
  - marker: d
    text: Cụm từ “để tôi không tự cao” xuất hiện hai lần trong bản Hy Lạp và được giữ lại ở cả hai chỗ trong bản dịch.
    reason: textual_transparency
lexical_decisions:
- source_word: τῇ ὑπερβολῇ τῶν ἀποκαλύψεων
  choice: vì những sự mặc khải quá đỗi lớn lao
  rationale: Diễn đạt sức nhấn mạnh của ὑπερβολή và liên hệ nguyên nhân với mệnh đề tiếp theo bằng tiếng Việt tự nhiên, đồng thời giữ thuật ngữ quen thuộc “sự mặc khải”.
- source_word: ὑπεραίρωμαι
  choice: tôi không tự cao
  rationale: Động từ chỉ việc tự nâng mình lên hoặc trở nên kiêu căng; “tự cao” ngắn gọn, tự nhiên và giữ sắc thái phản thân. Cụm này được lặp lại hai lần như bản Hy Lạp.
- source_word: ἐδόθη μοι
  choice: đã được ban cho tôi
  rationale: Giữ thể bị động và không xác định ai là tác nhân, tránh diễn giải vượt quá điều câu văn nói rõ.
- source_word: σκόλοψ τῇ σαρκί
  choice: một cái gai trong thân xác
  rationale: “Cái gai” giữ hình ảnh ẩn dụ quen thuộc nhưng không xác định quá mức vật nhọn; “trong thân xác” tránh đồng nhất σάρξ ở đây với một khái niệm thần học về bản tính tội lỗi.
- source_word: ἄγγελος Σατανᾶ
  choice: một sứ giả của Sa-tan
  rationale: “Sứ giả” bao quát hơn “thiên sứ”, giữ được sự mơ hồ về bản chất của tác nhân.
- source_word: κολαφίζῃ
  choice: để đánh đập tôi
  rationale: Động từ gợi hành động liên tục dùng nắm tay đánh hoặc hành hạ bằng những cú đánh; “đánh đập” giữ hình ảnh bạo lực cụ thể hơn cách dịch khái quát là “hành hạ”.
theological_decisions:
- issue: Bản chất của “cái gai trong thân xác”
  choice: Giữ nguyên hình ảnh ẩn dụ, không xác định đó là bệnh tật, sự bắt bớ, quấy nhiễu của ma quỷ hay một hoạn nạn khác.
  alternative: Giải thích cụ thể là bệnh thể chất, đối thủ/bắt bớ, hoặc áp chế của ma quỷ.
  rationale: Bản Hy Lạp không xác định chính xác “cái gai”, nên bản dịch không thu hẹp ý nghĩa.
- issue: Tác nhân của “đã được ban cho tôi”
  choice: Giữ thể bị động, không nêu danh người ban.
  alternative: “Đức Chúa Trời đã ban cho tôi” hoặc “điều đó đã được cho phép”.
  rationale: Câu văn có thể hàm ý sự cho phép của Đức Chúa Trời nhưng không trực tiếp nêu tác nhân; thể bị động bảo toàn sự căng thẳng giữa quyền tể trị của Đức Chúa Trời và tác động của Sa-tan.
- issue: Ý nghĩa của ἄγγελος Σατανᾶ
  choice: “một sứ giả của Sa-tan”
  alternative: “một thiên sứ của Sa-tan”
  rationale: ἄγγελος có thể chỉ sứ giả hoặc thiên sứ; cách dịch rộng hơn không quyết định bản thể của tác nhân.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dấu gạch ngang làm rõ mệnh đề mục đích chen giữa mà vẫn giữ trọng tâm và sự lặp lại của nguyên văn Hy Lạp.
