revisions:
- from: Tôi biết một người ở trong Đấng Mê-si[a], cách đây mười bốn năm, đã được cất lên đến tầng trời thứ ba[c]—ở trong thân thể hay ở ngoài thân thể, tôi không biết[b], Đức Chúa Trời biết.
  to: Tôi biết một người trong Đấng Mê-si[a], cách đây mười bốn năm—ở trong thân thể chăng, tôi không biết; ở ngoài thân thể chăng, tôi cũng không biết; Đức Chúa Trời biết—người ấy đã được cất lên đến tầng trời thứ ba[c].
  rationale: Sửa cấu trúc câu để phần chen “cách đây mười bốn năm ... Đức Chúa Trời biết” đứng trước mệnh đề chính “người ấy đã được cất lên”, như nguyên văn. Khôi phục sự lặp lại của việc Phao-lô không biết. Chú thích b không cần neo lại vì nội dung tương ứng đã được nêu rõ trong chính văn; đặt chú thích sau “thân thể” sẽ không rõ nó áp dụng cho cả hai vế. Các chú thích a và c được giữ tại đúng thuật ngữ được chú giải.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T19:28:16Z'
