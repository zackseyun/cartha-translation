id: 2CO.12.2
reference: 2 Corinthians 12:2
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οἶδα ἄνθρωπον ἐν Χριστῷ πρὸ ἐτῶν δεκατεσσάρων— εἴτε ἐν σώματι οὐκ οἶδα, εἴτε ἐκτὸς τοῦ σώματος οὐκ οἶδα, ὁ θεὸς οἶδεν— ἁρπαγέντα τὸν τοιοῦτον ἕως τρίτου οὐρανοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/002.yaml
  text: I know a man in Messiah who[a], fourteen years ago—whether in the body I do not know, or outside the body I do not know[c][b], God knows—was caught up to the third heaven.
translation:
  language: vi
  text: Tôi biết một người trong Đấng Mê-si[a], cách đây mười bốn năm—ở trong thân thể chăng, tôi không biết; ở ngoài thân thể chăng, tôi cũng không biết; Đức Chúa Trời biết—người ấy đã được cất lên đến tầng trời thứ ba[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Theo truyền thống cũng dịch là “trong Đấng Christ”. Tiếng Hy Lạp là ἐν Χριστῷ; ở đây dịch tước hiệu là “Đấng Mê-si” để chuyển tải ý nghĩa của từ này.
    reason: alternative_reading
  - marker: c
    text: “Tầng trời thứ ba” phản ánh cách nói vũ trụ học Do Thái cổ, thường được hiểu là tầng trời cao nhất hoặc thiên đàng; bản dịch giữ nguyên thành ngữ thay vì diễn giải ngay trong chính văn.
    reason: cultural_note
lexical_decisions:
- source_word: οἶδα
  choice: Tôi biết
  rationale: Dạng hoàn thành οἶδα mang nghĩa hiện tại trong tiếng Hy Lạp Koinē; “Tôi biết” là cách dịch tự nhiên và chính xác.
- source_word: ἄνθρωπον
  choice: một người
  rationale: Trong ngữ cảnh, từ này chỉ một người nam cụ thể, nhưng tiếng Việt tự nhiên dùng “một người”; không cần thêm giới tính khi ngữ cảnh không đòi hỏi.
- source_word: ἐν Χριστῷ
  choice: ở trong Đấng Mê-si
  rationale: Giữ ngôn ngữ về mối liên hệ/hiệp nhất của Phao-lô và chuyển tải Χριστός như một tước hiệu, thay vì chỉ như tên riêng.
- source_word: πρὸ ἐτῶν δεκατεσσάρων
  choice: cách đây mười bốn năm
  rationale: Đây là cách diễn đạt thời gian tự nhiên trong tiếng Việt, tương ứng chính xác với πρό cùng sở hữu cách chỉ thời gian.
- source_word: εἴτε ἐν σώματι ... εἴτε ἐκτὸς τοῦ σώματος
  choice: ở trong thân thể hay ở ngoài thân thể
  rationale: Giữ nguyên sự đối lập và sự không chắc chắn được lặp lại trong nguyên văn, đồng thời dùng lối diễn đạt rõ ràng trong tiếng Việt.
- source_word: ὁ θεὸς οἶδεν
  choice: Đức Chúa Trời biết
  rationale: Dịch trực tiếp mệnh đề; không thêm ý “chỉ một mình” vốn không được nói rõ trong nguyên văn.
- source_word: ἁρπαγέντα
  choice: đã được cất lên
  rationale: Diễn đạt thể bị động và sự đưa lên cách đột ngột bằng cụm từ Kinh Thánh quen thuộc nhưng vẫn dễ hiểu.
- source_word: ἕως τρίτου οὐρανοῦ
  choice: đến tầng trời thứ ba
  rationale: “Đến” diễn đạt đích đến của sự cất lên; “tầng trời thứ ba” giữ nguyên cách nói vũ trụ học cổ mà không giải nghĩa ngay trong câu.
theological_decisions:
- issue: Cách dịch Χριστῷ trong ἐν Χριστῷ
  choice: ở trong Đấng Mê-si
  alternative: trong Đấng Christ
  rationale: Χριστός có giá trị tước hiệu; “Đấng Mê-si” chuyển tải ý nghĩa ấy, còn “ở trong” giữ được công thức liên hệ/hiệp nhất đặc trưng của Phao-lô.
- issue: 'Bản chất trải nghiệm: trong thân thể hay ngoài thân thể'
  choice: Giữ nguyên việc Phao-lô không biết phương thức của trải nghiệm
  alternative: Giải thích đây là sự thăng thiên bằng thân thể hoặc một khải tượng ngoài thân thể
  rationale: Nguyên văn nêu rõ sự không biết và quy tri thức cho Đức Chúa Trời; bản dịch không được giải quyết điều văn bản cố ý để ngỏ.
- issue: Ý nghĩa của “tầng trời thứ ba”
  choice: Giữ nguyên thành ngữ cổ trong chính văn
  alternative: Diễn giải trực tiếp là tầng trời cao nhất hoặc thiên đàng
  rationale: Nguyên văn dùng τρίτου οὐρανοῦ; việc giữ nguyên cách nói bảo tồn hình ảnh và tránh đồng nhất hóa những khái niệm mà câu này chưa tự giải thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đấng Mê-si” cho tước hiệu Χριστός, “Đức Chúa Trời” cho θεός, và giữ nhịp câu chen giải thích bằng dấu gạch ngang. Các dấu chú thích [a], [b], [c] đều được đặt tại nội dung tương ứng trong chính văn.
