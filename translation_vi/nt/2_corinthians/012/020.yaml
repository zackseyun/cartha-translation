revisions:
- from: Vì tôi e rằng khi đến, có lẽ tôi sẽ thấy anh chị em không như tôi mong muốn, và anh chị em cũng sẽ thấy tôi không như anh chị em mong muốn. Tôi e rằng có lẽ giữa anh chị em sẽ có tranh chấp, ghen ghét, những cơn giận dữ, tranh giành vì ích kỷ, nói xấu, lời xì xào[a], tự cao và hỗn loạn.
  to: Vì tôi e rằng khi tôi đến, tôi có thể thấy anh chị em không như tôi mong muốn, và anh chị em có thể thấy tôi không như anh chị em mong muốn; cũng e rằng sẽ có tranh chấp, ganh tị, những cơn giận dữ, tranh giành vì ích kỷ, nói xấu, những lời xì xào[a], tự cao và hỗn loạn.
  rationale: Bản sửa làm rõ tính khả hữu mà Phao-lô e ngại, cải thiện liên kết của lần μή πως thứ hai với danh sách các điều xấu, và chọn «ganh tị» cho ζῆλος. Không thêm nguyên nhân thần học hoặc diễn giải về cuộc gặp ngoài điều câu văn nêu.
  reviewer_model: gpt-5.6-terra
