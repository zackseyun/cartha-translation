id: 2CO.12.20
reference: 2 Corinthians 12:20
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: φοβοῦμαι γὰρ μή πως ἐλθὼν οὐχ οἵους θέλω εὕρω ὑμᾶς, κἀγὼ εὑρεθῶ ὑμῖν οἷον οὐ θέλετε, μή πως ⸀ἔρις, ⸀ζῆλος, θυμοί, ἐριθεῖαι, καταλαλιαί, ψιθυρισμοί, φυσιώσεις, ἀκαταστασίαι·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/020.yaml
  text: For I fear that perhaps when I come I may find you not as I wish[a], and I may be found by you to be as you do not wish—that perhaps there may be strife, jealousy, outbursts of anger, selfish ambition, slanders, whisperings, conceit, and disorder.
translation:
  language: vi
  text: Vì tôi e rằng khi tôi đến, tôi có thể thấy anh chị em không như tôi mong muốn, và anh chị em có thể thấy tôi không như anh chị em mong muốn; cũng e rằng sẽ có tranh chấp, ganh tị, những cơn giận dữ, tranh giành vì ích kỷ, nói xấu, những lời xì xào[a], tự cao và hỗn loạn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “lời đồn thổi” hoặc “lời bàn tán sau lưng.”
    reason: Từ Hy Lạp ψιθυρισμοί chỉ lời nói thầm kín, sau lưng và có thể bao gồm chuyện ngồi lê đôi mách hoặc lời gièm pha.
lexical_decisions:
- source_word: φοβοῦμαι
  choice: tôi e rằng
  rationale: Diễn đạt mối lo đang tiếp diễn của Phao-lô bằng lối nói tự nhiên, trang trọng, đồng thời giữ nguyên sức nặng của động từ.
- source_word: μή πως
  choice: có lẽ
  rationale: Giữ sắc thái khả năng đáng lo ngại ở cả hai lần xuất hiện mà không biến điều Phao-lô lo sợ thành điều chắc chắn.
- source_word: ἐλθὼν
  choice: khi đến
  rationale: Phân từ bất định mang nghĩa thời gian trong ngữ cảnh; cách dịch này tự nhiên và không hàm ý rằng việc đến là bất định.
- source_word: οὐχ οἵους θέλω
  choice: không như tôi mong muốn
  rationale: Chỉ tình trạng hoặc phẩm chất của người Cô-rinh-tô mà Phao-lô hy vọng sẽ gặp, với cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: εὕρω ὑμᾶς
  choice: tôi sẽ thấy anh chị em
  rationale: Động từ chỉ việc nhận ra họ trong một tình trạng nào đó; kết hợp với “có lẽ” để thể hiện tính khả hữu của lối giả định.
- source_word: κἀγὼ εὑρεθῶ ὑμῖν
  choice: anh chị em cũng sẽ thấy tôi
  rationale: Chuyển thể bị động Hy Lạp sang chủ động tự nhiên trong tiếng Việt, đồng thời giữ cấu trúc đối ứng giữa cách Phao-lô thấy họ và cách họ thấy ông.
- source_word: οἷον οὐ θέλετε
  choice: không như anh chị em mong muốn
  rationale: Giữ sự đối xứng với mệnh đề trước và không giải thích thêm vì sao họ có thể không hài lòng về Phao-lô.
- source_word: ἔρις
  choice: tranh chấp
  rationale: Diễn tả sự bất hòa, cãi cọ trong cộng đồng bằng từ hiện đại và có phạm vi đủ rộng.
- source_word: ζῆλος
  choice: ghen ghét
  rationale: Trong danh sách thói xấu này, từ mang nghĩa tiêu cực về lòng ganh tị hoặc ghen tuông, không phải lòng sốt sắng tích cực.
- source_word: θυμοί
  choice: những cơn giận dữ
  rationale: Dạng số nhiều gợi những lần bùng phát cơn giận, không chỉ một khuynh hướng giận dữ nói chung.
- source_word: ἐριθεῖαι
  choice: tranh giành vì ích kỷ
  rationale: Thể hiện sự mưu cầu lợi ích hoặc vị thế cá nhân mang tính phe phái; rõ nghĩa hơn cách dịch danh từ trừu tượng.
- source_word: καταλαλιαί
  choice: nói xấu
  rationale: Chỉ lời nói nhằm hạ thấp hoặc bôi nhọ người khác; đây là cách nói hiện đại, dễ hiểu.
- source_word: ψιθυρισμοί
  choice: lời xì xào
  rationale: Chỉ lời nói kín đáo, sau lưng, thường mang tính gièm pha; giữ sự phân biệt với καταλαλιαί là hành vi nói xấu công khai hơn.
- source_word: φυσιώσεις
  choice: tự cao
  rationale: Truyền đạt hình ảnh kiêu căng, tự thổi phồng mình bằng cách diễn đạt gọn và tự nhiên.
- source_word: ἀκαταστασίαι
  choice: hỗn loạn
  rationale: Chỉ tình trạng mất trật tự hoặc bất ổn trong cộng đồng; không thu hẹp nghĩa vào một hình thức cụ thể.
theological_decisions:
- issue: Sắc thái cuộc gặp mà Phao-lô lo ngại
  choice: Giữ nguyên nỗi lo về sự thất vọng lẫn nhau cùng các thói xấu trong cộng đồng.
  alternative: Diễn giải rõ rằng Phao-lô sợ phải thi hành quyền sứ đồ nghiêm khắc hoặc sợ ảnh hưởng của các giáo sư giả.
  rationale: Câu này nêu sự không hài lòng từ hai phía và liệt kê các tội gây chia rẽ, nhưng không trực tiếp xác định nguyên nhân giáo lý hay hành động cụ thể của Phao-lô.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” cho đại từ số nhiều ὑμᾶς/ὑμῖν để nói với toàn thể cộng đồng, đồng thời tránh sắc thái quá cổ. Giữ hai lần diễn đạt nỗi e ngại và cấu trúc đối ứng của nguyên văn.
