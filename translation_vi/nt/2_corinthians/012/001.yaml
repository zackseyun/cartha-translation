id: 2CO.12.1
reference: 2 Corinthians 12:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καυχᾶσθαι ⸀δεῖ· οὐ ⸂συμφέρον μέν⸃, ἐλεύσομαι ⸀δὲ εἰς ὀπτασίας καὶ ἀποκαλύψεις κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/001.yaml
  text: Boasting is necessary[a], though it is not beneficial[b]; but I will go on to visions and revelations of the Lord.
translation:
  language: vi
  text: Tôi phải khoe mình, dù điều đó chẳng ích lợi gì; nhưng tôi sẽ chuyển sang nói về các khải tượng và mặc khải của Chúa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể hiểu là “đến từ Chúa”. Sở hữu cách trong tiếng Hy Lạp không xác định rõ quan hệ này.
    reason: alternative_reading
lexical_decisions:
- source_word: Καυχᾶσθαι
  choice: khoe mình
  rationale: Động từ nguyên mẫu được dùng như danh từ, nhưng tiếng Việt tự nhiên hơn khi diễn đạt trong cấu trúc “tôi phải khoe mình”. “Khoe mình” giữ sắc thái tự quy chiếu trong mạch văn của Phao-lô.
- source_word: δεῖ
  choice: phải
  rationale: Diễn tả sự cần thiết hoặc bắt buộc; “phải” là cách nói ngắn gọn, tự nhiên và giữ đủ sức nặng của từ Hy Lạp.
- source_word: οὐ συμφέρον μέν
  choice: dù điều đó chẳng ích lợi gì
  rationale: συμφέρον chỉ điều có ích hoặc có lợi. “Dù” thể hiện chức năng nhượng bộ của μέν trong quan hệ với δέ ở mệnh đề kế tiếp.
- source_word: ἐλεύσομαι δὲ εἰς
  choice: nhưng tôi sẽ chuyển sang nói về
  rationale: Trong ngữ cảnh này, cụm từ đánh dấu việc chuyển sang một đề tài mới. Cách dịch này tự nhiên hơn lối dịch máy móc là “tôi sẽ đến với” và vẫn thể hiện sắc thái đối lập của δέ.
- source_word: ὀπτασίας
  choice: các khải tượng
  rationale: ὀπτασία chỉ cảnh tượng được thấy trong một kinh nghiệm siêu nhiên; “khải tượng” là thuật ngữ rõ ràng, quen thuộc và giữ dạng số nhiều.
- source_word: ἀποκαλύψεις
  choice: mặc khải
  rationale: Chỉ những điều được vén mở hoặc bày tỏ. “Mặc khải” là cách diễn đạt gọn, trang trọng và quen thuộc trong tiếng Việt; trong cấu trúc phối hợp này, danh từ có thể mang nghĩa loại hoặc tập hợp mà không cần lặp từ chỉ số nhiều.
- source_word: κυρίου
  choice: của Chúa
  rationale: Dịch sát cấu trúc sở hữu cách Hy Lạp và để ngỏ quan hệ chính xác giữa Chúa với các khải tượng và mặc khải, thay vì xác định hẳn rằng chúng “đến từ Chúa”.
theological_decisions:
- issue: Quan hệ của κυρίου với “các khải tượng và mặc khải”
  choice: của Chúa
  alternative: đến từ Chúa
  rationale: Sở hữu cách Hy Lạp có thể chỉ nguồn gốc, sự thuộc về hoặc một quan hệ rộng hơn. “Của Chúa” giữ được sự hàm súc và mơ hồ chân thực của nguyên văn, còn chú thích nêu cách hiểu theo nguồn gốc.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc “tôi phải khoe mình” ưu tiên tiếng Việt tự nhiên hơn lối danh hóa “việc khoe mình là cần thiết”; dấu chấm phẩy giữ rõ thế đối lập giữa sự miễn cưỡng khoe mình và việc chuyển sang đề tài mới.
