  source_fidelity: 'Bản dịch phản ánh đúng mạch cú pháp và ý nghĩa của Καυχᾶσθαι δεῖ ... οὐ συμφέρον μέν ... ἐλεύσομαι δὲ: sự cần thiết phải tự khoe, tính không ích lợi của việc ấy, rồi chuyển sang các khải tượng và mặc khải. “Chuyển sang nói về” diễn đạt phù hợp chức năng chuyển đề tài của ἐλεύσομαι εἰς trong ngữ cảnh này. “Của Chúa” bảo lưu cách để ngỏ quan hệ của sở hữu cách κυρίου, thay vì ấn định là nguồn gốc.'
