    rationale: “Vì” có thể bị hiểu theo nghĩa nguyên nhân trong tiếng Việt. Chú thích nên nêu các phương án “về/liên quan đến” và giải thích rằng ὑπέρ với sở hữu cách có phạm vi nghĩa rộng, không áp nghĩa ‘thay mặt cho’.
