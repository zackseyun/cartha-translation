id: 2CO.12.5
reference: 2 Corinthians 12:5
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὑπὲρ τοῦ τοιούτου καυχήσομαι, ὑπὲρ δὲ ἐμαυτοῦ οὐ καυχήσομαι εἰ μὴ ἐν ταῖς ⸀ἀσθενείαις.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/005.yaml
  text: On behalf of such a one I will boast[a], but on behalf of myself I will not boast[b], except in my weaknesses.
translation:
  language: vi
  text: Về một người như thế, tôi sẽ khoe khoang[a]; nhưng về chính mình thì tôi sẽ không khoe khoang, ngoại trừ trong những sự yếu đuối của mình[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “liên quan đến một người như thế” hoặc “về một người như thế.” Giới từ Hy Lạp có phạm vi nghĩa rộng và ở đây chỉ người mà lời khoe khoang quy chiếu đến; cách nói gián tiếp này giữ khoảng cách tu từ.'
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn là “trong những sự yếu đuối”; không có từ “của mình.” Từ này được bổ sung theo ngữ cảnh. “Những sự yếu đuối” có thể bao gồm sự mỏng giòn, khổ đau, hoặc những hoàn cảnh bày tỏ quyền năng của Đức Chúa Trời.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπὲρ
  choice: về
  rationale: Với sở hữu cách, giới từ này chỉ người mà lời khoe mình quy chiếu đến. “Về” tự nhiên trong tiếng Việt và không buộc câu mang nghĩa đại diện như “thay mặt cho”.
- source_word: τοῦ τοιούτου
  choice: một người như thế
  rationale: Giữ cách nói gián tiếp, có chủ ý tạo khoảng cách của Phao-lô, đồng thời không thêm giới tính mà tiếng Hy Lạp không nêu rõ trong cụm này.
- source_word: καυχήσομαι
  choice: tôi sẽ khoe mình
  rationale: “Khoe mình” diễn đạt rõ hành động καυχάομαι và duy trì sự lặp lại có tính tu từ trong cả hai vế.
- source_word: ἐμαυτοῦ
  choice: chính mình
  rationale: Từ “chính” làm nổi bật sự tương phản giữa “một người như thế” và bản thân Phao-lô.
- source_word: εἰ μὴ
  choice: ngoại trừ
  rationale: Trong cấu trúc này, cụm từ nêu một ngoại lệ chứ không đặt điều kiện.
- source_word: ἐν ταῖς ἀσθενείαις
  choice: về những yếu đuối của mình
  rationale: ἀσθένεια có thể bao gồm sự mỏng giòn, bất lực và khổ đau. “Yếu đuối” đủ rộng để giữ các sắc thái ấy; “của mình” được bổ sung theo ngữ cảnh để tiếng Việt rõ và tự nhiên.
theological_decisions:
- issue: Đối tượng của lời khoe mình được Phao-lô cho phép
  choice: Giữ sự tương phản giữa việc khoe mình về “một người như thế” và việc khoe về chính bản thân, với ngoại lệ là những yếu đuối của ông.
  alternative: Hiểu “một người như thế” là một người khác hẳn Phao-lô; hoặc diễn giải câu chỉ như một nguyên tắc thần học chung về sự yếu đuối.
  rationale: Lối nói của câu cố ý tạo khoảng cách giữa Phao-lô với kinh nghiệm mặc khải, nhưng không tự giải quyết dứt khoát câu hỏi tự thuật. Bản dịch giữ nguyên độ căng ấy.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cụm “một người như thế” giữ khoảng cách tu từ; “khoe mình” giữ sự lặp lại của nguyên văn mà không chuyển thành thuật ngữ giáo phái.
