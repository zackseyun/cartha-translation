id: 2CO.12.14
reference: 2 Corinthians 12:14
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἰδοὺ τρίτον ⸀τοῦτο ἑτοίμως ἔχω ἐλθεῖν πρὸς ὑμᾶς, καὶ οὐ ⸀καταναρκήσω· οὐ γὰρ ζητῶ τὰ ὑμῶν ἀλλὰ ὑμᾶς, οὐ γὰρ ὀφείλει τὰ τέκνα τοῖς γονεῦσιν θησαυρίζειν, ἀλλὰ οἱ γονεῖς τοῖς τέκνοις.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/014.yaml
  text: Look, this is the third time I am ready to come to you, and I will not be a burden to you. For I do not seek what is yours, but you. For children are not obligated to store up for their parents, but parents for their children.
translation:
  language: vi
  text: Này, lần thứ ba này tôi sẵn sàng đến với anh chị em,[a] và tôi sẽ không trở thành gánh nặng cho anh chị em.[b] Vì điều tôi tìm kiếm không phải là những gì thuộc về anh chị em, mà là chính anh chị em. Bởi con cái không có bổn phận tích góp cho cha mẹ, nhưng cha mẹ tích góp cho con cái.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch sát hơn: “Này, lần thứ ba này tôi sẵn sàng đến với anh chị em.”'
    reason: lexical_alternative
  - marker: b
    text: Động từ được dịch là “trở thành gánh nặng” có thể mang nghĩa gây gánh nặng vật chất hoặc tài chính cho người khác.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδοὺ
  choice: Này
  rationale: Dùng lời gọi chú ý tự nhiên, trang trọng vừa phải trong tiếng Việt hiện đại.
- source_word: τρίτον τοῦτο ἑτοίμως ἔχω ἐλθεῖν
  choice: đây là lần thứ ba tôi sẵn sàng đến
  rationale: Diễn đạt tự nhiên sự sẵn sàng hiện tại của Phao-lô, đồng thời đặt chú thích để bảo tồn cấu trúc và độ mơ hồ của nguyên văn về lịch sử các chuyến thăm.
- source_word: πρὸς ὑμᾶς
  choice: đến với anh chị em
  rationale: Phù hợp ngữ cảnh đi đến thăm; “anh chị em” là cách xưng hô cộng đồng tự nhiên và bao hàm trong tiếng Việt.
- source_word: καταναρκήσω
  choice: trở thành gánh nặng cho anh chị em
  rationale: Truyền đạt ý không gây gánh nặng, nhất là về vật chất, mà không thu hẹp nghĩa ngay trong chính văn.
- source_word: ζητῶ τὰ ὑμῶν ἀλλὰ ὑμᾶς
  choice: điều tôi tìm kiếm không phải là những gì thuộc về anh chị em, mà là chính anh chị em
  rationale: Giữ nguyên sự tương phản giữa tài vật của họ và chính con người họ; thêm “chính” để làm rõ đối lập tự nhiên trong tiếng Việt.
- source_word: ὀφείλει
  choice: không có bổn phận
  rationale: Thể hiện nghĩa vụ luân lý hoặc trách nhiệm vốn có của động từ.
- source_word: θησαυρίζειν
  choice: tích góp
  rationale: Giữ ý dành dụm, tích lũy cho tương lai và phù hợp với quan hệ cha mẹ–con cái trong ngữ cảnh.
- source_word: τέκνα / τέκνοις
  choice: con cái
  rationale: Từ bao hàm, chỉ con nói chung, không giới hạn giới tính.
- source_word: γονεῦσιν / γονεῖς
  choice: cha mẹ
  rationale: Phản ánh danh từ chỉ cả cha lẫn mẹ trong nguyên văn.
theological_decisions:
- issue: Ý nghĩa của cách nói “lần thứ ba”
  choice: Diễn đạt đây là lần thứ ba Phao-lô ở trong tư thế sẵn sàng đến, không quả quyết rằng ông chắc chắn đã thực hiện hai chuyến thăm trước đó.
  alternative: Hiểu là chuyến viếng thăm thực tế thứ ba sau hai chuyến đã xảy ra.
  rationale: Cụm Hy Lạp gắn “lần thứ ba” với sự sẵn sàng đến; bản dịch và chú thích giữ khoảng mở của câu thay vì áp đặt một cách tái dựng hành trình.
- issue: Tính chất của “gánh nặng”
  choice: Giữ cách nói rộng “gánh nặng” trong chính văn và giải thích sắc thái tài chính ở chú thích.
  alternative: Dịch trực tiếp là “không gây gánh nặng tài chính”.
  rationale: Ngữ cảnh hỗ trợ ý vật chất hoặc tài chính, nhưng cách dịch rộng hơn bảo tồn hình ảnh và phạm vi nghĩa của động từ.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” cho đại từ số nhiều chỉ hội chúng; bảo tồn phép đối giữa “những gì thuộc về anh chị em” và “chính anh chị em”, cũng như hình ảnh gia đình ở cuối câu.
