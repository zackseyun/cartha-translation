reference: 2 Corinthians 12:13
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τί γάρ ἐστιν ὃ ⸀ἡσσώθητε ὑπὲρ τὰς λοιπὰς ἐκκλησίας, εἰ μὴ ὅτι αὐτὸς ἐγὼ οὐ κατενάρκησα ὑμῶν; χαρίσασθέ μοι τὴν ἀδικίαν ταύτην.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/013.yaml
  text: For in what were you treated as inferior to the rest of the churches[c][b][a], except that I myself did not become a burden to you? Forgive me this wrong.
translation:
  language: vi
  text: Vì anh chị em đã bị đối xử kém hơn các hội thánh khác ở điểm nào, ngoại trừ việc chính tôi đã không trở thành gánh nặng cho anh chị em?[a] Xin tha thứ cho tôi về điều sai trái này![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tức là Phao-lô đã không gây gánh nặng tài chính cho họ bằng cách nhận sự chu cấp từ họ.
    reason: cultural_note
  - marker: b
    text: 'Phao-lô nói mỉa mai: “điều sai trái này” được ông nói đến là việc ông đã không trở thành gánh nặng cho họ.'
    reason: rhetorical_note
lexical_decisions:
- source_word: ἡσσώθητε
  choice: đã thua kém
  rationale: Dạng bị động có thể chỉ việc bị đặt vào vị thế kém hơn hoặc chịu thiệt. Trong câu hỏi tu từ này, “đã thua kém” diễn đạt tự nhiên sự so sánh mà không hàm ý họ vốn kém cỏi.
- source_word: ὑπὲρ τὰς λοιπὰς ἐκκλησίας
  choice: các hội thánh khác
  rationale: Sau động từ mang nghĩa so sánh, ὑπέρ đánh dấu đối tượng so sánh; cách diễn đạt này tự nhiên trong tiếng Việt.
- source_word: αὐτὸς ἐγώ
  choice: chính tôi
  rationale: Giữ sự nhấn mạnh của đại từ tăng cường αὐτός đi cùng chủ ngữ ἐγώ.
- source_word: οὐ κατενάρκησα ὑμῶν
  choice: đã không trở thành gánh nặng cho anh chị em
  rationale: Trong ngữ cảnh 2 Cô-rinh-tô, động từ chỉ việc không gây gánh nặng vật chất hoặc tài chính; cách dịch vẫn giữ hình ảnh chung của nguyên văn.
- source_word: χαρίσασθέ μοι
  choice: Xin tha cho tôi
  rationale: χαρίζομαι ở đây mang nghĩa tha thứ; mệnh lệnh tạo nên lời xin lỗi mang tính mỉa mai.
- source_word: τὴν ἀδικίαν ταύτην
  choice: sự bất công này
  rationale: ἀδικία có nghĩa là sự bất công hoặc điều sai trái. “Sự bất công này” giữ được sức nặng từ vựng và nét mỉa mai của lời kết.
- source_word: τί γάρ ἐστιν ὃ
  choice: Vì ... về điều gì
  rationale: Chuyển cấu trúc Hy Lạp thành câu hỏi tu từ tự nhiên trong tiếng Việt, đồng thời giữ γάρ như liên từ nối lập luận.
theological_decisions:
- issue: Lời tự biện hộ đầy mỉa mai của Phao-lô về việc nhận hỗ trợ tài chính
  choice: Giữ câu hỏi và lời “Xin tha cho tôi sự bất công này” theo lối trực tiếp, để nét mỉa mai tự bộc lộ qua ngữ cảnh.
  alternative: Giải thích thẳng trong chính văn rằng Phao-lô đang nói mỉa mai hoặc thêm từ cường điệu.
  rationale: Nguyên văn không gắn nhãn mỉa mai; không nên giải quyết hiệu ứng tu từ bằng cách diễn giải quá mức.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” cho đại từ số nhiều ὑμεῖς; “hội thánh” cho ἐκκλησία. Giữ câu hỏi tu từ và sự căng thẳng mỉa mai, không đưa lời giải thích vào chính văn.
