revisions:
- from: Vì anh chị em đã thua kém các hội thánh khác về điều gì, ngoài việc chính tôi đã không trở thành gánh nặng cho anh chị em?[a] Xin tha cho tôi sự bất công này![b]
  to: Vì anh chị em đã bị đối xử kém hơn các hội thánh khác ở điểm nào, ngoại trừ việc chính tôi đã không trở thành gánh nặng cho anh chị em?[a] Xin tha thứ cho tôi về điều sai trái này![b]
  rationale: Bản sửa thay cách diễn đạt có thể hàm ý sự thua kém nội tại bằng một cấu trúc bị động phản ánh ἡσσώθητε và quan hệ so sánh với các hội thánh khác. Đồng thời, bản sửa làm câu kết tự nhiên hơn trong tiếng Việt, giữ nguyên tính mỉa mai mà không đưa lời giải thích vào chính văn, và đặt lại neo chú thích cho chính xác.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T19:28:25Z'
review_pass:
  verdict: revise
  source_fidelity: 'Cần sửa “đã thua kém”, vì cách nói này dễ gợi một tình trạng kém hơn vốn có và không phản ánh rõ thể bị động của ἡσσώθητε: người Cô-rinh-tô bị đối xử hoặc bị đặt vào thế kém lợi hơn các hội thánh khác. “Bị đối xử kém hơn” giữ được sắc thái so sánh, bị động và giọng mỉa mai của câu hỏi. “Chính tôi đã không trở thành gánh nặng” truyền đạt đúng αὐτὸς ἐγὼ οὐ κατενάρκησα ὑμῶν. Cụm kết nên dùng “điều sai trái này” thay vì “sự bất công này” để tự nhiên hơn cho τὴν ἀδικίαν ταύτην trong lời xin tha thứ đầy mỉa mai.'
  naturalness: 'Bản sửa dùng trật tự câu hỏi tự nhiên trong tiếng Việt hiện đại: “... ở điểm nào?” “Xin tha thứ cho tôi về điều sai trái này” tự nhiên và vẫn giữ lực mệnh lệnh/lời khẩn xin mang tính tu từ. Dời ký hiệu chú thích [a] sát cụm “gánh nặng” giúp neo chú thích rõ ràng.'
  terminology: “Hội thánh”, “anh chị em”, và “Phao-lô” phù hợp văn phong Cơ Đốc giáo Việt ngữ hiện đại. “Bị đối xử kém hơn” là lựa chọn trung tính, không áp đặt diễn giải giáo phái, đồng thời diễn đạt đúng ý bị đặt vào vị thế bất lợi. “Điều sai trái” phù hợp hơn “sự bất công” trong lời tự nhận lỗi mỉa mai của Phao-lô.
  issues:
  - severity: medium
    issue: “đã thua kém” không biểu đạt rõ thể bị động của ἡσσώθητε.
    rationale: Nguyên văn hỏi người Cô-rinh-tô đã bị làm cho/thụ hưởng sự đối xử ở vị thế kém hơn các hội thánh khác ở phương diện nào. “Đã thua kém” có thể bị hiểu là họ tự thân kém hơn.
  - severity: low
    issue: Cách nói “Xin tha cho tôi sự bất công này” hơi gượng trong tiếng Việt hiện đại.
    rationale: “Xin tha thứ cho tôi về điều sai trái này” tự nhiên hơn, vẫn phản ánh χαρίσασθέ μοι và giữ tính mỉa mai của ἀδικία.
  - severity: low
    issue: Chú thích về gánh nặng tài chính chưa được đặt sát cụm từ được chú giải.
    rationale: Đặt [a] ngay sau “gánh nặng cho anh chị em” làm rõ phạm vi neo chú thích.
  revised_text: Vì anh chị em đã bị đối xử kém hơn các hội thánh khác ở điểm nào, ngoại trừ việc chính tôi đã không trở thành gánh nặng cho anh chị em?[a] Xin tha thứ cho tôi về điều sai trái này![b]
