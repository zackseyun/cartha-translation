  source_fidelity: 'Bản nháp truyền đạt đầy đủ công thức chúc phước của nguyên văn: χάρις/εἰρήνη, người nhận số nhiều, và hai nguồn được nối bằng καί. Tuy nhiên, cụm “cùng Chúa là Đức Giê-su” không phản ánh tự nhiên cấu trúc tước hiệu κυρίου Ἰησοῦ Χριστοῦ; nguyên văn gọi Giê-su là “Chúa”, không dùng kết cấu giải thích “Chúa là Đức Giê-su.”'
