  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: χάρις ὑμῖν καὶ εἰρήνη ἀπὸ θεοῦ πατρὸς ἡμῶν καὶ κυρίου Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/002.yaml
  text: Grace to you and peace from God our Father and the Lord Jesus the Messiah[a][b].
translation:
  language: vi
  text: Nguyện ân điển và bình an đến với anh chị em, từ Đức Chúa Trời là Cha chúng ta và từ Chúa Giê-su, Đấng Mê-si[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay theo cách gọi truyền thống: “Đức Giê-su Christ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρις
  choice: ân điển
  rationale: Cách dịch quen thuộc, trang trọng, giữ được cả sắc thái lời chào lẫn chiều sâu thần học trong thư Phao-lô.
- source_word: ὑμῖν
  choice: đến với anh chị em
  rationale: Diễn đạt tự nhiên đối tượng tiếp nhận của lời chúc trong tiếng Việt; đại từ số nhiều bao quát cộng đồng tín hữu.
- source_word: εἰρήνη
  choice: bình an
  rationale: Giữ được âm hưởng Kinh Thánh và ý nghĩa rộng hơn sự vắng bóng xung đột.
- source_word: ἀπὸ
  choice: từ
  rationale: Thể hiện trực tiếp nguồn của ân điển và bình an.
- source_word: θεοῦ πατρὸς ἡμῶν
  choice: Đức Chúa Trời, Cha chúng ta
  rationale: 'Dấu phẩy làm rõ quan hệ đồng vị: Đức Chúa Trời chính là Cha chúng ta; tránh cách hiểu ''Đức Chúa Trời của Cha chúng ta''.'
- source_word: κυρίου
  choice: Chúa
  rationale: Tước hiệu tự nhiên và truyền thống cho κύριος trong ngữ cảnh quy chiếu về Đức Giê-su.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Đức Giê-su, Đấng Mê-si
  rationale: Dịch Χριστός theo nghĩa tước hiệu 'Đấng Mê-si', đồng thời dùng dấu phẩy để biểu thị quan hệ đồng vị tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Cách dịch Χριστοῦ trong lời chào của Phao-lô
  choice: Đấng Mê-si
  alternative: Đấng Christ
  rationale: Giữ rõ nghĩa tước hiệu 'Đấng được xức dầu' thay vì chỉ dùng dạng phiên âm đã trở nên gần như tên riêng; chú thích ghi nhận cách gọi truyền thống.
- issue: Quan hệ giữa θεοῦ πατρὸς ἡμῶν và κυρίου Ἰησοῦ Χριστοῦ
  choice: từ Đức Chúa Trời, Cha chúng ta, cùng Chúa là Đức Giê-su, Đấng Mê-si
  alternative: từ Đức Chúa Trời là Cha chúng ta và từ Chúa là Đức Giê-su Christ
  rationale: Giữ nguyên hai nguồn được liên kết bằng καί trong một công thức chúc phước, không diễn giải thêm bản chất của mối quan hệ thần học giữa hai danh xưng.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại. Dùng “anh chị em” cho đại từ số nhiều ὑμῖν nhằm nói trực tiếp với toàn thể cộng đồng; thêm “Nguyện” và “đến với” để công thức lời chúc tự nhiên trong tiếng Việt mà không thay đổi nội dung nguồn.
