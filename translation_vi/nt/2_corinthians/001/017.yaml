id: 2CO.1.17
reference: 2 Corinthians 1:17
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τοῦτο οὖν ⸀βουλόμενος μήτι ἄρα τῇ ἐλαφρίᾳ ἐχρησάμην; ἢ ἃ βουλεύομαι κατὰ σάρκα βουλεύομαι, ἵνα ᾖ παρ’ ἐμοὶ τὸ Ναὶ ναὶ καὶ τὸ Οὒ οὔ;
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/017.yaml
  text: So when I intended this[a], was I acting lightly? Or do I plan what I plan according to the flesh, so that with me there should be both “Yes, yes” and “No[d][c][b], no”?
translation:
  language: vi
  text: Vậy, khi có ý định ấy, phải chăng tôi đã tỏ ra thiếu kiên định[a]? Hay những điều tôi dự định, có phải tôi dự định theo xác thịt[b], để nơi tôi có cả “Có, có” lẫn “Không, không”[c]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “một cách thất thường” hoặc “một cách hời hợt.”'
    reason: lexical_alternative
  - marker: b
    text: “Theo xác thịt” ở đây có thể có nghĩa là theo những động cơ hoặc tiêu chuẩn thuần túy của con người.
    reason: lexical_alternative
  - marker: c
    text: Tức là lời nói hoặc ý định bất nhất, như thể cả “Có” lẫn “Không” đều có thể cùng tồn tại.
    reason: cultural_note
lexical_decisions:
- source_word: βουλόμενος
  choice: có ý định
  rationale: Phân từ chỉ ý định trước đó của Phao-lô về hành trình; “có ý định” tự nhiên trong tiếng Việt và không hàm ý một kế hoạch đã được quyết định dứt khoát.
- source_word: τῇ ἐλαφρίᾳ ἐχρησάμην
  choice: đã hành động cách nhẹ dạ
  rationale: Cụm Hy Lạp diễn tả việc cư xử với sự nhẹ dạ hoặc thiếu kiên định. Cách dịch này giữ sắc thái chất vấn về tính thay đổi thất thường mà vẫn dễ hiểu.
- source_word: ἃ βουλεύομαι ... βουλεύομαι
  choice: những điều tôi dự định, tôi dự định
  rationale: Giữ phép lặp có chủ ý trong nguyên văn để bảo tồn sức nhấn mạnh của câu hỏi tu từ.
- source_word: κατὰ σάρκα
  choice: theo xác thịt
  rationale: Giữ thuật ngữ đặc trưng của Phao-lô và sự rộng nghĩa của thành ngữ, thay vì thu hẹp ngay thành một cách giải thích duy nhất.
- source_word: παρ’ ἐμοὶ
  choice: nơi tôi
  rationale: Diễn tả điều được thấy nơi cách hành xử hay lời nói của Phao-lô, đồng thời bám sát cấu trúc nguyên văn.
- source_word: τὸ Ναὶ ναὶ καὶ τὸ Οὒ οὔ
  choice: vừa có “Có, có” lại vừa có “Không, không”
  rationale: Giữ nguyên sự lặp lại của Ναί và Οὔ, đồng thời dùng cấu trúc “vừa... lại vừa...” để làm rõ lời cáo buộc về sự bất nhất mà không diễn giải quá mức.
theological_decisions:
- issue: Ý nghĩa của σάρξ trong thành ngữ κατὰ σάρκα
  choice: theo xác thịt
  alternative: theo tiêu chuẩn thuần túy của con người; theo lối thế gian
  rationale: Trong ngữ cảnh này, cụm từ có thể nói đến cách hoạch định theo động cơ hoặc chuẩn mực thuần túy của con người. Giữ “xác thịt” trong chính văn bảo tồn ngôn ngữ và độ căng thần học đặc trưng của Phao-lô; chú thích cung cấp nghĩa diễn giải.
- issue: Quan hệ giữa “Có, có” và “Không, không”
  choice: vừa có ... lại vừa có
  alternative: lúc thì nói “Có”, lúc thì nói “Không”
  rationale: Nguyên văn có thể gợi sự bất nhất hoặc nước đôi nhưng không nói rõ trình tự thời gian; vì vậy tránh thêm ý “lúc thì... lúc thì...” vào chính văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ hai câu hỏi tu từ, phép lặp của động từ βουλεύομαι và các tiếng “Có, có”/“Không, không.” Dùng “xác thịt” để bảo tồn thuật ngữ Phao-lô, kèm chú thích giải nghĩa; tránh diễn giải thành việc cố ý lừa dối hoặc thay đổi theo thời gian vì nguyên văn không nói rõ như vậy.
