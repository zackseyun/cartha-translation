id: 2CO.1.8
reference: 2 Corinthians 1:8
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Οὐ γὰρ θέλομεν ὑμᾶς ἀγνοεῖν, ἀδελφοί, ⸀ὑπὲρ τῆς θλίψεως ἡμῶν τῆς ⸀γενομένης ἐν τῇ Ἀσίᾳ, ὅτι καθ’ ὑπερβολὴν ⸂ὑπὲρ δύναμιν ἐβαρήθημεν⸃, ὥστε ἐξαπορηθῆναι ἡμᾶς καὶ τοῦ ζῆν·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/008.yaml
  text: For we do not want you to be unaware[a], brothers, about our affliction that happened in Asia, that we were burdened exceedingly, beyond our strength[c][b], so that we despaired even of life.
translation:
  language: vi
  text: Thưa anh chị em, chúng tôi không muốn anh chị em không biết về hoạn nạn đã xảy đến cho chúng tôi tại A-si[a]. Chúng tôi đã bị đè nặng quá mức, vượt quá sức mình, đến nỗi tuyệt vọng, không còn mong sống nổi nữa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “A-si” ở đây là tỉnh Asia của đế quốc La Mã, thuộc miền tây Tiểu Á, chứ không phải toàn bộ châu Á ngày nay.
    reason: cultural_note
  - marker: b
    text: 'Cũng có thể dịch: “đến nỗi chúng tôi tuyệt vọng ngay cả về sự sống.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐ γὰρ θέλομεν ὑμᾶς ἀγνοεῖν
  choice: chúng tôi không muốn anh chị em không biết
  rationale: Giữ ý chí được diễn đạt bằng θέλομεν và lối nói phủ định của ἀγνοεῖν, đồng thời dùng cách nói tự nhiên trong tiếng Việt hiện đại.
- source_word: ἀδελφοί
  choice: Thưa anh chị em
  rationale: Trong lời xưng hô thư tín, danh từ số nhiều giống đực này có thể chỉ toàn thể cộng đồng tín hữu gồm cả nam lẫn nữ; “anh chị em” truyền đạt tự nhiên phạm vi bao hàm ấy trong tiếng Việt.
- source_word: ὑπὲρ τῆς θλίψεως ἡμῶν τῆς γενομένης
  choice: về hoạn nạn đã xảy đến cho chúng tôi
  rationale: “Hoạn nạn” giữ mức độ nghiêm trọng của θλῖψις; “xảy đến cho chúng tôi” diễn đạt tự nhiên biến cố mà nhóm của Phao-lô phải chịu.
- source_word: ἐν τῇ Ἀσίᾳ
  choice: tại A-si
  rationale: Dùng tên gọi Kinh Thánh quen thuộc cho tỉnh Asia của La Mã, kèm chú thích để tránh bị hiểu là châu Á hiện đại.
- source_word: καθ’ ὑπερβολὴν ὑπὲρ δύναμιν ἐβαρήθημεν
  choice: Chúng tôi đã bị đè nặng quá mức, vượt quá sức mình
  rationale: “Bị đè nặng” giữ hình ảnh và thể bị động của ἐβαρήθημεν; hai cụm chỉ mức độ được giữ riêng để bảo toàn sức nhấn mạnh của nguyên văn.
- source_word: ὥστε ἐξαπορηθῆναι ἡμᾶς καὶ τοῦ ζῆν
  choice: đến nỗi tuyệt vọng, không còn mong sống nổi nữa
  rationale: “Đến nỗi” nêu kết quả; cách diễn đạt này truyền đạt sức mạnh của ἐξαπορέω và làm rõ rằng sự tuyệt vọng liên quan đến khả năng tiếp tục sống.
theological_decisions:
- issue: Phạm vi của ἀδελφοί trong lời xưng hô
  choice: anh chị em
  alternative: anh em
  rationale: Dù hình thức Hy Lạp là giống đực số nhiều, trong bối cảnh thư gửi hội thánh, từ này hướng đến cộng đồng tín hữu nói chung. Tiếng Việt tự nhiên dùng “anh chị em” để biểu thị cộng đồng hỗn hợp mà không thêm một khẳng định thần học riêng.
- issue: Mức độ tuyệt vọng trong καὶ τοῦ ζῆν
  choice: không còn mong sống nổi nữa
  alternative: tuyệt vọng ngay cả về sự sống
  rationale: 'Bản dịch giữ nguyên sức căng hiện sinh của câu: Phao-lô không chỉ gặp khó khăn mà đã tuyệt vọng về việc tiếp tục sống; không làm nhẹ thành cảm giác chán nản thông thường.'
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, phù hợp lời kể chân thành trong thư tín. Câu được tách làm hai để tiếng Việt dễ đọc mà vẫn giữ quan hệ ý nghĩa của nguyên văn. Dùng “chúng tôi” và “anh chị em” nhất quán; tránh từ cổ hoặc lối diễn đạt mang màu sắc hệ phái.
