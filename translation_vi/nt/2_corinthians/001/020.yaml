reference: 2 Corinthians 1:20
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὅσαι γὰρ ἐπαγγελίαι θεοῦ, ἐν αὐτῷ τὸ Ναί· ⸀διὸ καὶ ⸂δι’ αὐτοῦ⸃ τὸ Ἀμὴν τῷ θεῷ πρὸς δόξαν δι’ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/020.yaml
  text: For however many promises of God there are[a], in him is the Yes[c][b]. Therefore also through him is the Amen to God for glory through us.
translation:
  language: vi
  text: Vì hễ có bao nhiêu lời hứa của Đức Chúa Trời, thì trong Ngài là lời “Có”.[a] Vì vậy, cũng qua Ngài mà lời “A-men”[b] được nói lên hướng về Đức Chúa Trời, nhằm đem lại vinh hiển qua chúng ta.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát hơn: “Vì hễ có bao nhiêu lời hứa của Đức Chúa Trời, thì trong Ngài là lời ‘Có’.” Câu Hy Lạp rất cô đọng và không có động từ tương đương với “ứng nghiệm”.'
    reason: alternative_reading
  - marker: b
    text: “A-men” là từ phiên âm của một lời xác nhận, có nghĩa gần như “thật vậy”, “chắc chắn như thế” hoặc “nguyện được như vậy”.
    reason: cultural_note
  - marker: c
    text: Cụm Hy Lạp “nhằm [đem lại] vinh hiển qua chúng ta” rất cô đọng. Có thể hiểu rõ hơn theo mạch văn là lời “A-men” được nói lên để Đức Chúa Trời được vinh hiển qua chúng ta; tuy nhiên, bản văn chính không ấn định quá mức cách liên kết các cụm từ này.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅσαι
  choice: mọi
  rationale: Trong kết cấu này, từ này bao quát toàn bộ các lời hứa, bất kể số lượng; “mọi” diễn đạt tự nhiên trong tiếng Việt mà không làm mất ý tổng quát.
- source_word: ἐπαγγελίαι θεοῦ
  choice: lời hứa của Đức Chúa Trời
  rationale: Giữ quan hệ sở hữu tự nhiên của sở hữu cách và dùng cách gọi trang trọng, quen thuộc đối với các lời hứa đến từ Đức Chúa Trời.
- source_word: ἐν αὐτῷ
  choice: trong Ngài
  rationale: Giữ nguyên cách diễn đạt cô đọng, quy hướng về Đấng Christ, thay vì giải thích thành “được ứng nghiệm bởi Ngài” hoặc “nhờ Ngài”.
- source_word: τὸ Ναί
  choice: là “Có”
  rationale: Giữ hình ảnh tu từ nổi bật của Phao-lô và không thay bằng một công thức giải nghĩa như “được ứng nghiệm”; dấu ngoặc kép giúp người đọc nhận ra “Có” đang được dùng như một lời xác nhận.
- source_word: δι’ αὐτοῦ
  choice: qua Ngài
  rationale: Phản ánh διά với sở hữu cách, nhấn mạnh vai trò trung gian của Đấng Christ.
- source_word: τὸ Ἀμὴν
  choice: lời “A-men”
  rationale: Giữ từ phiên âm có sắc thái phụng vụ và duy trì sự song hành với lời “Có”; thêm “lời” để câu tiếng Việt tự nhiên.
- source_word: τῷ θεῷ
  choice: dâng lên Đức Chúa Trời
  rationale: Diễn đạt tự nhiên đối tượng tiếp nhận lời A-men; động từ “dâng lên” được bổ sung từ cấu trúc tỉnh lược của câu.
- source_word: πρὸς δόξαν
  choice: để Ngài được vinh hiển
  rationale: Diễn đạt mục đích của lời A-men một cách tự nhiên, đồng thời footnote ghi nhận khả năng giữ cụm từ này ít xác định hơn.
- source_word: δι’ ἡμῶν
  choice: được chúng ta dâng lên
  rationale: Hiểu cụm từ là chỉ những người qua họ lời A-men được nói ra; cách chuyển bị động giúp kết nối tự nhiên với “qua Ngài” trong tiếng Việt.
theological_decisions:
- issue: Có nên giải thích lời “Có” là sự ứng nghiệm mọi lời hứa trong Đấng Christ hay không
  choice: Giữ cách nói cô đọng “đều là ‘Có’ trong Ngài”.
  alternative: “đều được ứng nghiệm trong Ngài” hoặc “đều có lời xác nhận trong Ngài”
  rationale: Ý ứng nghiệm được hàm chứa mạnh, nhưng nguyên văn không dùng động từ “ứng nghiệm”. Bản dịch giữ hình ảnh và sức căng tu từ của câu thay vì biến hàm ý thần học thành lời giải thích trực tiếp.
- issue: Cách liên kết πρὸς δόξαν và δι’ ἡμῶν
  choice: Hiểu lời A-men được chúng ta dâng lên Đức Chúa Trời để Ngài được vinh hiển.
  alternative: 'Giữ cấu trúc ít xác định hơn: “nhằm đem lại vinh hiển qua chúng ta”.'
  rationale: Cách chọn chính tạo câu tiếng Việt rõ ràng và phù hợp với mạch văn, nhưng footnote bảo lưu độ nén cú pháp của tiếng Hy Lạp và cách phân tích khác có thể có.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng “Đức Chúa Trời” và đại từ viết hoa “Ngài” theo quy ước phổ biến; giữ “Có” và “A-men” trong ngoặc kép để làm rõ tính chất lời xác nhận. Cấu trúc chính ưu tiên sự tự nhiên của tiếng Việt nhưng các footnote bảo lưu tính cô đọng và những điểm chưa hoàn toàn xác định của nguyên văn.
