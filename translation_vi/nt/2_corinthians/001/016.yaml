  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ δι’ ὑμῶν διελθεῖν εἰς Μακεδονίαν, καὶ πάλιν ἀπὸ Μακεδονίας ἐλθεῖν πρὸς ὑμᾶς καὶ ὑφ’ ὑμῶν προπεμφθῆναι εἰς τὴν Ἰουδαίαν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/016.yaml
  text: and through you to pass into Macedonia[a], and again from Macedonia to come to you and by you to be sent on to Judea.
translation:
  language: vi
  text: rồi đi qua chỗ anh chị em để đến Ma-xê-đô-ni-a, sau đó từ Ma-xê-đô-ni-a lại đến với anh chị em, và được anh chị em tiễn lên đường đến Giu-đê[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “được anh chị em giúp đỡ để tiếp tục hành trình đến Giu-đê.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δι’ ὑμῶν
  choice: đi qua chỗ anh chị em
  rationale: διά với sở hữu cách diễn tả lộ trình đi qua nơi người Cô-rinh-tô ở; cách dịch này tự nhiên trong tiếng Việt và giữ rõ ý hành trình.
- source_word: διελθεῖν εἰς Μακεδονίαν
  choice: để đến Ma-xê-đô-ni-a
  rationale: διέρχομαι chỉ việc đi qua hoặc tiếp tục hành trình; kết hợp với εἰς, câu tiếng Việt diễn đạt tự nhiên hướng đi đến Ma-xê-đô-ni-a mà không làm mất ý đi qua Cô-rinh-tô ở cụm trước.
- source_word: πάλιν ἀπὸ Μακεδονίας ἐλθεῖν πρὸς ὑμᾶς
  choice: sau đó từ Ma-xê-đô-ni-a lại đến với anh chị em
  rationale: πάλιν đánh dấu lượt trở lại trong hành trình; “lại đến” giữ ý này mà không thêm từ “trở về,” vốn không có trực tiếp trong Hy Lạp.
- source_word: ὑφ’ ὑμῶν
  choice: được anh chị em
  rationale: ὑπό với sở hữu cách nêu tác nhân; cấu trúc bị động tiếng Việt giữ người Cô-rinh-tô là những người thực hiện việc tiễn và hỗ trợ.
- source_word: προπεμφθῆναι
  choice: tiễn lên đường
  rationale: Trong bối cảnh hành trình, προπέμπω thường bao gồm việc tiễn người đi và giúp họ tiếp tục chuyến đi; “tiễn lên đường” vừa tự nhiên vừa không quy định cụ thể hình thức hỗ trợ.
- source_word: εἰς τὴν Ἰουδαίαν
  choice: đến Giu-đê
  rationale: εἰς chỉ đích đến; “đến Giu-đê” là cách diễn đạt tự nhiên trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “anh chị em” cho đại từ số nhiều ὑμῶν; phiên âm địa danh theo lối quen thuộc trong Kinh Thánh tiếng Việt. Liên từ mở đầu “rồi” phản ánh καί và cho thấy câu này tiếp nối kế hoạch hành trình ở câu trước.
