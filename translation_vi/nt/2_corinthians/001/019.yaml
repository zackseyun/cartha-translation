id: 2CO.1.19
reference: 2 Corinthians 1:19
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ ⸂τοῦ θεοῦ γὰρ⸃ υἱὸς ⸂Ἰησοῦς Χριστὸς⸃ ὁ ἐν ὑμῖν δι’ ἡμῶν κηρυχθείς, δι’ ἐμοῦ καὶ Σιλουανοῦ καὶ Τιμοθέου, οὐκ ἐγένετο Ναὶ καὶ Οὒ, ἀλλὰ Ναὶ ἐν αὐτῷ γέγονεν·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/019.yaml
  text: For the Son of God[a], Jesus the Messiah, who was proclaimed among you through us—through me and Silvanus and Timothy—did not become Yes and No; rather[d][c][b], in him it has become Yes.
translation:
  language: vi
  text: Vì Con Đức Chúa Trời, là Giê-su, Đấng Mê-si-a, Đấng đã được rao truyền giữa anh em qua chúng tôi—qua tôi, Si-la và Ti-mô-thê—không trở thành vừa “Có” vừa “Không”; trái lại, trong Ngài, điều ấy đã trở thành “Có.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “không phải là ‘Có’ và ‘Không’; nhưng trong Ngài, điều ấy đã thành ‘Có.’”'
    reason: Nêu một cách diễn đạt tiếng Việt tự nhiên hơn cho đối lập Ναί/Οὔ và cho động từ hoàn thành γέγονεν, không diễn giải phép đối lập thành tính thất thường hay đáng tin cậy.
lexical_decisions:
- source_word: υἱὸς τοῦ θεοῦ
  choice: Con Đức Chúa Trời
  rationale: Giữ nguyên tước hiệu Cơ Đốc học, đồng thời dùng trật tự tự nhiên và trang trọng trong tiếng Việt.
- source_word: Ἰησοῦς Χριστός
  choice: Chúa Giê-su, Đấng Mê-si-a
  rationale: Χριστός có nguồn gốc là tước hiệu 'Đấng Mê-si-a'; thêm 'Chúa' theo cách gọi tự nhiên, kính trọng trong tiếng Việt, nhưng không làm Χριστός thành tên riêng không còn ý nghĩa tước hiệu.
- source_word: κηρυχθείς
  choice: đã được ... rao truyền
  rationale: Diễn đạt ý công bố công khai của κηρύσσω và giữ thể bị động của phân từ Hy Lạp.
- source_word: ἐν ὑμῖν
  choice: giữa anh em
  rationale: Trong văn cảnh cộng đồng Hội Thánh, 'giữa anh em' tự nhiên hơn 'trong anh em' và vẫn giữ nghĩa địa điểm/xã hội của ἐν.
- source_word: δι’ ἡμῶν
  choice: bởi chúng tôi
  rationale: διά với sở hữu cách chỉ tác nhân trung gian; 'bởi' tự nhiên trong cấu trúc bị động tiếng Việt.
- source_word: δι’ ἐμοῦ καὶ Σιλουανοῦ καὶ Τιμοθέου
  choice: bởi tôi, Si-la và Ti-mô-thê
  rationale: Giữ sự lặp lại ý tác nhân và nêu đúng Phao-lô cùng hai cộng sự; dùng dạng tên quen thuộc trong tiếng Việt.
- source_word: οὐκ ἐγένετο Ναὶ καὶ Οὒ
  choice: không trở thành vừa “Có” vừa “Không”
  rationale: Giữ động từ γίνομαι và hình ảnh tu từ Có/Không, thay vì giải nghĩa thành thiếu nhất quán; 'vừa ... vừa ...' làm rõ sự kết hợp mà không xóa căng thẳng của câu.
- source_word: ἀλλὰ Ναὶ ἐν αὐτῷ γέγονεν
  choice: trái lại, trong Ngài, điều ấy đã trở thành “Có”
  rationale: Giữ ἐν αὐτῷ và sắc thái kết quả hiện còn của thì hoàn thành γέγονεν; 'điều ấy' cung cấp chủ ngữ cần thiết trong tiếng Việt mà không xác định quá mức nội dung của lời 'Có'.
theological_decisions:
- issue: Cách dịch Χριστός trong Ἰησοῦς Χριστός
  choice: Chúa Giê-su, Đấng Mê-si-a
  alternative: Chúa Giê-su Christ
  rationale: Trong thế đồng vị với 'Con Đức Chúa Trời', Χριστός vẫn mang sức nặng tước hiệu. Bản dịch chính biểu thị rõ nghĩa 'Đấng Mê-si-a' thay vì phiên âm thành một phần của tên riêng.
- issue: Có nên giải thích Ναί/Οὔ là tính nhất quán hay đáng tin cậy hay không
  choice: Giữ nguyên hình ảnh “Có” và “Không”
  alternative: không hề thay đổi thất thường, nhưng hoàn toàn đáng tin cậy
  rationale: Nguyên văn dùng đối lập tu từ Có/Không và Có. Giữ cách nói ấy bảo tồn sự hàm súc và căng thẳng thần học, không thu hẹp nó thành một lời diễn giải.
- issue: Chủ ngữ hàm ẩn của γέγονεν
  choice: điều ấy đã trở thành “Có”
  alternative: Ngài luôn là lời “Có”
  rationale: Dạng động từ số ít không tự xác định rõ chủ ngữ trong cách chuyển sang tiếng Việt. 'Điều ấy' giữ mức độ mơ hồ của nguyên văn tốt hơn việc đồng nhất trực tiếp Đấng Christ với lời 'Có'.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc; giữ cách xưng hô cộng đồng 'anh em' theo văn cảnh. Dấu ngoặc kép làm rõ rằng “Có” và “Không” là các từ được dùng theo lối tu từ. Dấu gạch ngang giúp phần nêu tên ba người không che khuất mệnh đề chính.
