revisions:
- from: 'Vì điều chúng tôi tự hào là thế này: lương tâm chúng tôi làm chứng rằng chúng tôi đã sống giữa thế gian với sự thánh khiết[a] và chân thành đến từ Đức Chúa Trời[b], không theo sự khôn ngoan của xác thịt[c], nhưng nhờ ân điển của Đức Chúa Trời; và đối với anh chị em thì lại càng như vậy.'
  to: 'Vì điều chúng tôi tự hào là thế này: lương tâm chúng tôi làm chứng rằng chúng tôi đã sống trong thế gian với sự thánh khiết[a] và sự chân thành đến từ Đức Chúa Trời[b], không theo sự khôn ngoan của xác thịt[c], nhưng nhờ ân điển của Đức Chúa Trời; nhất là đối với anh chị em.'
