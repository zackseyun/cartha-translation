id: 2CO.1.12
reference: 2 Corinthians 1:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἡ γὰρ καύχησις ἡμῶν αὕτη ἐστίν, τὸ μαρτύριον τῆς συνειδήσεως ἡμῶν, ὅτι ἐν ⸀ἁγιότητι καὶ εἰλικρινείᾳ ⸀τοῦ θεοῦ, ⸀οὐκ ἐν σοφίᾳ σαρκικῇ ἀλλ’ ἐν χάριτι θεοῦ, ἀνεστράφημεν ἐν τῷ κόσμῳ, περισσοτέρως δὲ πρὸς ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/012.yaml
  text: 'For this is our boast: the testimony of our conscience[a], that we conducted ourselves in the world in holiness and sincerity of God[c][b], not in fleshly wisdom but in the grace of God—and especially toward you.'
translation:
  language: vi
  text: 'Vì điều chúng tôi tự hào là thế này: lương tâm chúng tôi làm chứng rằng chúng tôi đã sống trong thế gian với sự thánh khiết[a] và sự chân thành đến từ Đức Chúa Trời[b], không theo sự khôn ngoan của xác thịt[c], nhưng nhờ ân điển của Đức Chúa Trời; nhất là đối với anh chị em.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Một số thủ bản chép “đơn sơ” thay vì “thánh khiết”.
    reason: textual_variant
  - marker: b
    text: 'Cũng có thể dịch: “sự chân thành thuộc về Đức Chúa Trời” hoặc “lòng chân thành tin kính”.'
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “sự khôn ngoan của con người”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καύχησις
  choice: điều chúng tôi tự hào
  rationale: Diễn đạt tự nhiên danh từ chỉ niềm hãnh diện chính đáng hoặc cơ sở để tự hào, không mặc nhiên mang nghĩa kiêu ngạo.
- source_word: μαρτύριον τῆς συνειδήσεως ἡμῶν
  choice: lương tâm chúng tôi làm chứng
  rationale: Chuyển cấu trúc danh từ Hy Lạp thành mệnh đề tự nhiên trong tiếng Việt, đồng thời giữ ý về sự chứng nhận bên trong của lương tâm.
- source_word: ἁγιότητι
  choice: sự thánh khiết
  rationale: Phản ánh trực tiếp bản văn SBLGNT và giữ sắc thái đạo đức, tôn giáo của từ.
- source_word: εἰλικρινείᾳ τοῦ θεοῦ
  choice: chân thành đến từ Đức Chúa Trời
  rationale: Hiểu sở hữu cách là nguồn gốc, nhưng không làm mất mối liên hệ trực tiếp giữa phẩm chất chân thành và Đức Chúa Trời.
- source_word: σοφίᾳ σαρκικῇ
  choice: sự khôn ngoan của xác thịt
  rationale: Giữ rõ nhóm từ σάρξ quan trọng trong Phao-lô và tránh làm yếu nghĩa thành đơn thuần 'khôn ngoan của con người'.
- source_word: χάριτι θεοῦ
  choice: ân điển của Đức Chúa Trời
  rationale: Cách diễn đạt quen thuộc, trang trọng và giữ nguyên sức nặng thần học của χάρις.
- source_word: ἀνεστράφημεν ἐν τῷ κόσμῳ
  choice: chúng tôi đã sống giữa thế gian
  rationale: Trong ngữ cảnh, động từ nói đến cách ăn ở hay lối sống; cách dịch này tự nhiên hơn 'đã cư xử' mà vẫn chính xác.
- source_word: περισσοτέρως δὲ πρὸς ὑμᾶς
  choice: và đối với anh chị em thì lại càng như vậy
  rationale: Giữ lực so sánh của περισσοτέρως và quan hệ hướng đến cộng đoàn Cô-rinh-tô bằng tiếng Việt tự nhiên.
theological_decisions:
- issue: Ý nghĩa của τοῦ θεοῦ trong εἰλικρινείᾳ τοῦ θεοῦ
  choice: chân thành đến từ Đức Chúa Trời
  alternative: sự chân thành thuộc về Đức Chúa Trời; lòng chân thành tin kính
  rationale: Sở hữu cách có thể chỉ nguồn gốc hoặc phẩm chất. Bản dịch chính nêu cách hiểu nguồn gốc phù hợp ngữ cảnh, còn chú thích giữ lại khả năng hiểu theo phẩm chất.
- issue: Ý nghĩa của σαρκικῇ trong σοφίᾳ σαρκικῇ
  choice: của xác thịt
  alternative: của con người
  rationale: Giữ nguyên sự căng thẳng thần học trong cách Phao-lô đối lập xác thịt với ân điển, thay vì thu hẹp từ này thành nghĩa chỉ thuộc về loài người.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh chị em” để chỉ cộng đoàn tín hữu; giữ các thuật ngữ Phao-lô quan trọng như “xác thịt” và “ân điển”. Các dấu chú thích [a], [b], [c] đều được đặt ngay sau cụm từ liên quan.
