    rationale: περισσοτέρως δὲ πρὸς ὑμᾶς chỉ nói “nhất là/càng hơn đối với anh chị em.” Từ “như vậy” bổ sung một yếu tố hồi chỉ không được nêu rõ trong tiếng Hy Lạp.
  - severity: low
