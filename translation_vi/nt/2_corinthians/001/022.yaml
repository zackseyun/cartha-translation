review_pass:
  verdict: revise
  source_fidelity: 'Cấu trúc chính phản ánh đúng câu Hy Lạp: Đức Chúa Trời là chủ thể hàm ẩn, hai phân từ song song diễn tả việc Ngài đóng ấn và ban ἀρραβών, còn “trong lòng chúng ta” giữ vị trí nội tâm của ân ban. Tuy nhiên, “khoản đặt cọc” trong tiếng Việt thường gợi tiền bảo đảm có thể hoàn lại hơn là khoản thanh toán đầu tiên bảo đảm phần còn lại; “khoản đặt trước” chuyển tải sát hơn hình ảnh thương mại của ἀρραβών mà không diễn giải thuộc cách “của Thánh Linh”.'
  naturalness: “Ngài cũng đã đóng ấn trên chúng ta” là cách nói trang trọng, dễ hiểu trong văn cảnh Kinh Thánh và giữ được ẩn dụ nguyên văn. “Khoản đặt trước” tự nhiên hơn trong ngữ cảnh thanh toán ban đầu so với “khoản đặt cọc”.
  terminology: Giữ “Thánh Linh” nhất quán và không quyết định giữa các cách hiểu quan hệ thuộc cách trong “khoản đặt trước của Thánh Linh”. Chú thích cần tránh “khoản ký quỹ”, vì đó không phải tương đương từ vựng sát của ἀρραβών; thay bằng “tiền đặt trước” và “bảo chứng”.
  issues:
  - severity: medium
    issue: “khoản đặt cọc” có thể lệch trường nghĩa của ἀρραβών.
    rationale: ἀρραβών là khoản trả/đặt trước, bảo đảm rằng phần còn lại sẽ đến. Trong cách dùng hiện đại, “đặt cọc” thường nhấn vào khoản bảo đảm, đôi khi hoàn lại hoặc bị mất, chứ không nhất thiết là phần đầu của khoản thanh toán.
  - severity: low
    issue: Chú thích dùng “khoản ký quỹ”.
    rationale: “Ký quỹ” thường chỉ tiền hay tài sản được gửi để bảo đảm nghĩa vụ, không phải cách thay thế tự nhiên, trực tiếp cho ἀρραβών trong ẩn dụ thương mại của câu này.
  revised_text: Ngài cũng đã đóng ấn trên chúng ta và ban khoản đặt trước[a] của Thánh Linh trong lòng chúng ta.
