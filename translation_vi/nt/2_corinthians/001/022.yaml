  text: who also sealed us and gave the down payment of the Spirit in our hearts.
translation:
  language: vi
  text: Ngài cũng đã đóng ấn trên chúng ta và ban khoản đặt trước[a] của Thánh Linh trong lòng chúng ta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “tiền đặt trước” hoặc “bảo chứng” của Thánh Linh.
    reason: lexical_alternative
lexical_decisions:
- source_word: σφραγισάμενος
  choice: đã đóng ấn trên
  rationale: Giữ nguyên hình ảnh con dấu, vốn có thể gợi quyền sở hữu, sự xác nhận hoặc bảo đảm, mà không thu hẹp ý nghĩa vào chỉ một phương diện.
- source_word: δοὺς
  choice: ban
  rationale: Phân từ bất định quá khứ của δίδωμι được phối hợp tự nhiên với mệnh đề trước; “ban” phù hợp với văn phong trang trọng khi chủ thể là Đức Chúa Trời.
- source_word: ἀρραβῶνα
  choice: khoản đặt cọc
  rationale: Từ này chỉ khoản thanh toán ban đầu bảo đảm phần còn lại. “Khoản đặt cọc” giữ được hình ảnh thương mại cụ thể và dễ hiểu trong tiếng Việt hiện đại.
- source_word: τοῦ πνεύματος
  choice: của Thánh Linh
  rationale: Giữ cấu trúc sở hữu cô đọng của nguyên văn, không quyết định dứt khoát rằng khoản đặt cọc chính là Thánh Linh hay do Thánh Linh ban.
- source_word: ἐν ταῖς καρδίαις ἡμῶν
  choice: trong lòng chúng ta
  rationale: Diễn đạt tự nhiên vị trí nội tâm theo ἐν với tặng cách, đồng thời giữ hình ảnh “lòng” của nguyên văn.
- source_word: ὁ καὶ ... καὶ
  choice: Ngài cũng ... và
  rationale: Đại từ này nối về Đức Chúa Trời trong văn cảnh trước; cách diễn đạt bằng “Ngài” giúp câu tiếng Việt tự nhiên mà vẫn duy trì mạch liên kết.
theological_decisions:
- issue: Ý nghĩa của Thánh Linh như ἀρραβών
  choice: khoản đặt cọc của Thánh Linh
  alternative: Thánh Linh làm bảo chứng; khoản bảo đảm của Thánh Linh
  rationale: Bản dịch chính giữ hình ảnh giao dịch cụ thể và cấu trúc thuộc cách của tiếng Hy Lạp, tránh biến phép ẩn dụ thành một lời giải thích giáo lý hoặc xác định quá mức mối quan hệ giữa “khoản đặt cọc” và “Thánh Linh”.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Câu giữ phép ẩn dụ về con dấu và khoản đặt cọc, đồng thời không giải thích quá mức cấu trúc cô đọng của nguyên văn.
