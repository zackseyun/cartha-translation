  to: Ngài cũng đã đóng ấn trên chúng ta và ban khoản đặt trước[a] của Thánh Linh trong lòng chúng ta.
  rationale: Thay “khoản đặt cọc” bằng “khoản đặt trước” để làm rõ giá trị của ἀρραβών là khoản ban đầu bảo đảm phần còn lại, đồng thời vẫn giữ phép ẩn dụ thương mại cụ thể. Điều chỉnh chú thích để các phương án thay thế sát nghĩa và tự nhiên trong tiếng Việt. Không thay đổi cấu trúc mơ hồ có chủ ý của “của Thánh Linh”.
