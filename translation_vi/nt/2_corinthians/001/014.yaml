id: 2CO.1.14
reference: 2 Corinthians 1:14
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καθὼς καὶ ἐπέγνωτε ἡμᾶς ἀπὸ μέρους, ὅτι καύχημα ὑμῶν ἐσμεν καθάπερ καὶ ὑμεῖς ἡμῶν ἐν τῇ ἡμέρᾳ τοῦ κυρίου ⸀ἡμῶν Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/014.yaml
  text: just as you also came to understand us in part[a], that we are your boast, just as you also are ours[b], in the day of our Lord Jesus.
translation:
  language: vi
  text: cũng như anh chị em đã phần nào hiểu chúng tôi[a], rằng chúng tôi là niềm hãnh diện của anh chị em, cũng như anh chị em là niềm hãnh diện của chúng tôi[b], trong ngày của Chúa Giê-su, Chúa chúng ta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “đã hiểu chúng tôi một phần” hoặc “đã hiểu chúng tôi ở một mức độ nào đó.”
    reason: lexical_alternative
  - marker: b
    text: Hay “lý do để tự hào.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέγνωτε
  choice: đã hiểu
  rationale: Diễn đạt sự nhận biết hay hiểu biết thực sự mà người Cô-rinh-tô đã đạt tới, nhưng không hàm ý họ đã hiểu hoàn toàn.
- source_word: ἀπὸ μέρους
  choice: phần nào
  rationale: Cách nói tự nhiên trong tiếng Việt, giữ nguyên ý mức độ hiểu biết còn hạn chế mà không xác định mức độ cụ thể.
- source_word: καύχημα
  choice: niềm tự hào
  rationale: Giữ sắc thái hãnh diện và vui mừng về nhau trong cách dùng của Phao-lô, đồng thời tự nhiên hơn danh từ 'sự khoe mình' trong tiếng Việt hiện đại.
- source_word: καθάπερ
  choice: cũng như
  rationale: Bảo toàn phép so sánh tương hỗ giữa các sứ đồ và người Cô-rinh-tô.
- source_word: ἡμέρᾳ τοῦ κυρίου ἡμῶν Ἰησοῦ
  choice: ngày của Chúa chúng ta là Đức Chúa Jêsus
  rationale: Giữ cấu trúc cánh chung và làm rõ 'Chúa chúng ta' đồng vị với Jêsus theo cú pháp Hy Lạp.
- source_word: κύριος
  choice: Chúa
  rationale: Cách dịch danh hiệu κύριος tự nhiên và quen thuộc trong ngữ cảnh Cơ Đốc học.
- source_word: καθὼς καὶ
  choice: cũng như
  rationale: Nối câu này với ý trước và truyền đạt lực so sánh cùng sắc thái bổ sung của καί một cách tự nhiên.
theological_decisions:
- issue: Ngôn ngữ καύχημα mang tính tương hỗ của Phao-lô
  choice: chúng tôi là niềm tự hào của anh chị em, cũng như anh chị em là niềm tự hào của chúng tôi
  alternative: chúng tôi là lý do để anh chị em tự hào, cũng như anh chị em là lý do để chúng tôi tự hào
  rationale: Giữ nguyên tính tương hỗ và sức căng trong lời Phao-lô về sự hãnh diện trong nhau vào ngày của Chúa, không diễn giải thành một khẳng định tự tôn.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại và dễ hiểu. Dùng “anh chị em” cho đại từ số nhiều ὑμεῖς; dùng “Đức Chúa Jêsus” như một danh xưng tôn kính, đồng thời giữ nhịp so sánh tương hỗ của nguyên văn.
