  to: cũng như anh chị em đã phần nào hiểu chúng tôi[a], rằng chúng tôi là niềm hãnh diện của anh chị em, cũng như anh chị em là niềm hãnh diện của chúng tôi[b], trong ngày của Chúa Giê-su, Chúa chúng ta.
