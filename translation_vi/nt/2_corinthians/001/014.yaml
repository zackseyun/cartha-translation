  - severity: low
    issue: Chú thích b diễn đạt phương án thay thế quá hẹp
    rationale: “lý do để chúng tôi tự hào” chỉ nói đến vế cuối, trong khi καύχημα xuất hiện ở cả hai vế tương hỗ. “lý do để tự hào” là phương án từ vựng trung tính, có thể áp dụng đúng tại vị trí được đánh dấu.
