    rationale: αὐτοὶ nhấn mạnh “chính chúng ta”, còn ὑπὸ τοῦ θεοῦ chỉ tác nhân của παρακαλούμεθα. Cách viết lại đặt cả hai yếu tố ngay trong mệnh đề bị động mà vẫn tự nhiên tiếng Việt.
