id: 2CO.1.4
reference: 2 Corinthians 1:4
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ παρακαλῶν ἡμᾶς ἐπὶ πάσῃ τῇ θλίψει ἡμῶν, εἰς τὸ δύνασθαι ἡμᾶς παρακαλεῖν τοὺς ἐν πάσῃ θλίψει διὰ τῆς παρακλήσεως ἧς παρακαλούμεθα αὐτοὶ ὑπὸ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/004.yaml
  text: who comforts us in all our affliction[a], so that we may be able to comfort those in any affliction through the comfort with which we ourselves are comforted by God.
translation:
  language: vi
  text: Đấng an ủi chúng ta trong mọi hoạn nạn của chúng ta[a], để chúng ta có thể an ủi những người đang gặp bất cứ hoạn nạn nào bằng sự an ủi mà chính chúng ta được Đức Chúa Trời an ủi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “khích lệ ... sự khích lệ”; tiếng Hy Lạp dùng cùng một nhóm từ xuyên suốt câu này.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακαλῶν / παρακαλεῖν / παρακλήσεως / παρακαλούμεθα
  choice: an ủi / sự an ủi / nhận được sự an ủi
  rationale: Trong văn cảnh hoạn nạn, nhóm từ này chỉ sự nâng đỡ và khích lệ mang tính an ủi. Việc giữ cùng một nhóm từ tiếng Việt bảo tồn phép lặp có chủ ý trong tiếng Hy Lạp.
- source_word: ἐπὶ πάσῃ τῇ θλίψει ἡμῶν
  choice: trong mọi hoạn nạn của chúng ta
  rationale: “Hoạn nạn” diễn đạt sức nặng của θλῖψις—cảnh khốn khó, áp lực và đau khổ—đồng thời là cách nói trang trọng nhưng quen thuộc trong tiếng Việt.
- source_word: εἰς τὸ δύνασθαι ἡμᾶς
  choice: để chúng ta có thể
  rationale: Diễn đạt tự nhiên sắc thái mục đích hoặc kết quả của cấu trúc nguyên mẫu có giới từ.
- source_word: τοὺς ἐν πάσῃ θλίψει
  choice: những người đang gặp bất cứ hoạn nạn nào
  rationale: '“Bất cứ ... nào” thể hiện tự nhiên phạm vi phân phối rộng: những người ở trong bất kỳ loại hoạn nạn nào.'
- source_word: διὰ τῆς παρακλήσεως ἧς παρακαλούμεθα αὐτοὶ
  choice: dùng chính sự an ủi mình nhận được
  rationale: “Dùng” diễn đạt phương tiện của διά; “chính” giữ sự nhấn mạnh của αὐτοὶ. Cách chuyển bị động thành “nhận được” tự nhiên trong tiếng Việt mà vẫn cho thấy đây là sự an ủi được ban cho.
- source_word: ὑπὸ τοῦ θεοῦ
  choice: từ Đức Chúa Trời
  rationale: Tiếng Hy Lạp nêu Đức Chúa Trời là tác nhân của động từ bị động. Với cách diễn đạt “nhận được”, “từ Đức Chúa Trời” là tự nhiên và vẫn giữ rõ nguồn tác động.
theological_decisions:
- issue: Phạm vi nghĩa của παρακαλέω / παράκλησις
  choice: an ủi / sự an ủi
  alternative: khích lệ / sự khích lệ
  rationale: Vì câu được đặt trong bối cảnh θλῖψις, nét nghĩa an ủi và nâng đỡ là nổi bật. Chú thích giữ lại nghĩa “khích lệ”, tránh thu hẹp phạm vi của nhóm từ Hy Lạp.
- issue: Quan hệ mục đích hay kết quả trong εἰς τὸ δύνασθαι
  choice: để chúng ta có thể
  alternative: nhờ đó chúng ta có thể
  rationale: Cấu trúc có thể mang sắc thái mục đích hoặc kết quả. “Để” theo sát dòng lập luận và không buộc phải phân định quá mức giữa hai sắc thái.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Hoạn nạn” giữ sắc thái nặng của θλῖψις; trật tự câu được điều chỉnh vừa phải để tiếng Việt tự nhiên, trong khi phép lặp “an ủi” được duy trì.
