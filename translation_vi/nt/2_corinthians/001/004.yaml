  to: Đấng an ủi chúng ta trong mọi hoạn nạn của chúng ta[a], để chúng ta có thể an ủi những người đang gặp bất cứ hoạn nạn nào bằng sự an ủi mà chính chúng ta được Đức Chúa Trời an ủi.
