  naturalness: “An ủi” và “hoạn nạn” là tự nhiên, trang trọng vừa phải trong tiếng Việt hiện đại. Cấu trúc sửa lại với mệnh đề “mà chính chúng ta được Đức Chúa Trời an ủi” rõ nghĩa, tự nhiên, và duy trì phép lặp chủ ý.
