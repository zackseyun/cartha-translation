lexical_decisions:
- source_word: πεποιθήσει
  choice: lòng tin tưởng
  rationale: Diễn đạt tự nhiên danh từ chỉ sự tin chắc/tin tưởng, phù hợp với cơ sở khiến Phao-lô dự định hành trình.
- source_word: ἐβουλόμην
  choice: tôi đã định
  rationale: Thể hiện ý muốn và dự định trong quá khứ mà không hàm ý đây là một kế hoạch bất biến.
- source_word: πρότερον πρὸς ὑμᾶς ἐλθεῖν
  choice: đến với anh chị em trước
  rationale: Giữ nghĩa ưu tiên trong thứ tự hành trình; ngữ cảnh câu kế tiếp làm rõ ông dự tính ghé Cô-rinh-tô trước khi sang Ma-xê-đô-ni-a.
- source_word: δευτέραν χάριν
  choice: ân huệ lần thứ hai
  rationale: Giữ danh từ χάρις và sắc thái tích cực của nó, đồng thời không giới hạn nghĩa vào ân điển cứu rỗi; ở đây từ này chỉ ân huệ/lợi ích họ nhận qua chuyến thăm.
- source_word: σχῆτε
  choice: anh chị em nhận được
  rationale: Trong kết cấu này, ἔχω có thể diễn đạt việc có hoặc nhận được; tiếng Việt 'nhận được' tự nhiên hơn khi đi với 'ân huệ'.
theological_decisions:
- issue: Nghĩa của χάρις trong cụm δευτέραν χάριν
  choice: ân huệ lần thứ hai
  alternative: lợi ích thứ hai; ân điển lần thứ hai
  rationale: Bản dịch giữ trường nghĩa 'ân huệ/ơn' nhưng tránh khiến độc giả tất yếu hiểu là một lần ban ân điển cứu rỗi thứ hai. Ngữ cảnh hành trình cho thấy đó là điều tốt lành họ nhận được nhờ chuyến thăm.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” cho đại từ số nhiều ὑμᾶς. Giữ dấu phẩy cuối câu vì câu Hy Lạp tiếp tục sang ý kế tiếp.
