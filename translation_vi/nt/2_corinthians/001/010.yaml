  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὃς ἐκ τηλικούτου θανάτου ἐρρύσατο ἡμᾶς καὶ ⸀ῥύσεται, εἰς ὃν ἠλπίκαμεν ὅτι καὶ ἔτι ῥύσεται,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/010.yaml
  text: who rescued us from so great a death and will rescue us[a], in whom we have hoped that he will indeed rescue us again,
translation:
  language: vi
  text: Ngài đã giải cứu chúng tôi khỏi một cái chết ghê gớm đến thế, và sẽ giải cứu chúng tôi[a]. Chúng tôi đã đặt hy vọng nơi Ngài rằng Ngài sẽ còn giải cứu chúng tôi,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “khỏi một hiểm họa chết người nghiêm trọng đến thế.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: τηλικούτου
  choice: khủng khiếp dường ấy
  rationale: Tính từ chỉ mức độ nhấn mạnh tầm vóc nghiêm trọng của cái chết hoặc hiểm nguy; cách diễn đạt này tự nhiên trong tiếng Việt và giữ được sức nhấn mạnh.
- source_word: θανάτου
  choice: cái chết
  rationale: Danh từ có nghĩa trực tiếp là “cái chết”. Bản văn chính giữ nguyên hình ảnh của nguyên tác, còn nghĩa khả dĩ là hiểm họa chết người được nêu trong chú thích.
- source_word: ἐρρύσατο
  choice: đã giải cứu
  rationale: Động từ nói đến việc đưa ai ra khỏi hiểm nguy; “giải cứu” rõ ràng, hiện đại và phù hợp với ngữ cảnh.
- source_word: ῥύσεται
  choice: sẽ còn giải cứu / sẽ tiếp tục giải cứu
  rationale: Giữ nhất quán với cùng động từ Hy Lạp, đồng thời diễn đạt lực tương lai và ý tiếp diễn của hai lần xuất hiện trong câu.
- source_word: εἰς ὃν
  choice: nơi Ngài
  rationale: Trong cấu trúc này, giới từ chỉ đối tượng mà niềm hy vọng hướng đến; “đặt hy vọng nơi Ngài” là cách nói tự nhiên và giữ trọng tâm cá vị.
- source_word: ἠλπίκαμεν
  choice: chúng tôi đặt hy vọng
  rationale: Thì hoàn thành diễn tả một niềm hy vọng đã được đặt và vẫn còn hiệu lực; ngữ cảnh cùng mệnh đề tương lai làm rõ tư thế tin cậy liên tục.
- source_word: καὶ ἔτι
  choice: sẽ tiếp tục
  rationale: Cụm từ bổ sung ý nhấn mạnh và tiếp diễn; “sẽ tiếp tục” diễn đạt sự trông đợi rằng hành động giải cứu còn diễn ra.
theological_decisions:
- issue: Hiểu θανάτου theo nghĩa đen là “cái chết” hay diễn ý là “hiểm họa chết người” trong bản văn chính
  choice: Giữ “cái chết” trong bản văn chính
  alternative: Dịch cả cụm là “một hiểm họa chết người khủng khiếp dường ấy”
  rationale: Nguyên tác dùng trực tiếp danh từ “cái chết”. Giữ hình ảnh ấy bảo toàn lối diễn đạt mạnh của Phao-lô, trong khi chú thích cho biết nghĩa thành ngữ có thể có.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Đại từ “Ngài” nối với Đấng được nhắc đến ở văn cảnh trước. Dấu phẩy cuối câu được giữ vì câu này tiếp nối sang câu kế tiếp trong nguyên văn.
