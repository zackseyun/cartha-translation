    rationale: Văn bản Hy Lạp có καὶ ἔτι chỉ trước ῥύσεται cuối cùng. Lần ῥύσεται đầu chỉ là “sẽ giải cứu”; lần cuối mới mang ý “sẽ còn/yet”.
  - severity: low
    issue: “Chúng tôi đặt hy vọng” chưa biểu đạt rõ thì hoàn thành ἠλπίκαμεν.
    rationale: “Chúng tôi đã đặt hy vọng” diễn đạt hành động đã được thực hiện với hiệu lực tiếp diễn, mà không thêm nội dung thần học.
  - severity: low
    issue: Cách ghép “cái chết khủng khiếp dường ấy” hơi gượng trong tiếng Việt.
    rationale: “Một cái chết ghê gớm đến thế” là cách diễn đạt trôi chảy hơn, vẫn bảo toàn danh từ θανάτου và lực nhấn mạnh của τηλικούτου.
