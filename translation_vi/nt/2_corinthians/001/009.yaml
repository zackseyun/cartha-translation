revisions:
- from: Thật vậy, chính chúng tôi đã mang bản án tử hình trong mình,[a] để chúng tôi không cậy vào chính mình, nhưng cậy vào Đức Chúa Trời, Đấng khiến người chết sống lại.
  to: Thật vậy, chính chúng tôi đã có bản án phải chết trong lòng mình,[a] để chúng tôi không cậy vào chính mình, nhưng cậy vào Đức Chúa Trời, Đấng làm cho người chết sống lại.
  rationale: 'Bản sửa thay cách kết hợp không tự nhiên «đã mang bản án tử hình trong mình» bằng cách diễn đạt sát và tự nhiên hơn: «đã có bản án phải chết trong lòng mình». Chú thích nêu phương án từ vựng gần với nghĩa “phán quyết/kết luận về sự chết”, không xác định quá mức bản chất hay nguồn của phán quyết.'
