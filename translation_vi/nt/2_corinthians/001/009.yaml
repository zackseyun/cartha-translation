review_pass:
  verdict: revise
  source_fidelity: Bản dịch giữ được sự nhấn mạnh của αὐτοὶ, ý mục đích của ἵνα, sự đối lập giữa cậy mình và cậy Đức Chúa Trời, cùng mô tả Đức Chúa Trời là Đấng làm cho người chết sống lại. Tuy nhiên, «đã mang bản án tử hình trong mình» thêm sắc thái “mang” không có trong ἐσχήκαμεν và khiến «bản án tử hình» dễ được hiểu là hình phạt tử hình theo nghĩa pháp lý hiện đại. «Bản án phải chết» sát hơn với câu trạng thái/quyết định về cái chết trong văn mạch.
  naturalness: «Đã mang ... trong mình» không tự nhiên khi đi với một bản án. «Đã có ... trong lòng mình» diễn đạt tự nhiên hơn tình trạng nhận thức nội tâm mà không buộc phải xác định nguồn ban án. «Đấng làm cho người chết sống lại» là cách nói hiện đại, rõ và quen thuộc.
  terminology: Giữ «Đức Chúa Trời», «cậy vào», và «người chết sống lại». Thay «bản án tử hình» bằng «bản án phải chết» để tránh đồng nhất câu này với một án phạt hình sự cụ thể, đồng thời vẫn giữ hình ảnh phán quyết của ἀπόκριμα τοῦ θανάτου.
  issues:
  - severity: medium
    issue: «đã mang bản án tử hình trong mình» vừa không sát động từ vừa dễ gây lệch nghĩa
    rationale: ἐσχήκαμεν nghĩa cơ bản là “đã có/đang có”, không nói đến hành vi “mang”. Hơn nữa, «bản án tử hình» trong tiếng Việt hiện đại thường chỉ án phạt tử hình do tòa án áp dụng; cụm Hy Lạp ở đây nói về một quyết định/kết luận về sự chết mà các tác giả cảm nhận nơi chính mình.
  revised_text: Thật vậy, chính chúng tôi đã có bản án phải chết trong lòng mình,[a] để chúng tôi không cậy vào chính mình, nhưng cậy vào Đức Chúa Trời, Đấng làm cho người chết sống lại.
