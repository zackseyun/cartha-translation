id: 2CO.1.9
reference: 2 Corinthians 1:9
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀλλὰ αὐτοὶ ἐν ἑαυτοῖς τὸ ἀπόκριμα τοῦ θανάτου ἐσχήκαμεν, ἵνα μὴ πεποιθότες ὦμεν ἐφ’ ἑαυτοῖς ἀλλ’ ἐπὶ τῷ θεῷ τῷ ἐγείροντι τοὺς νεκρούς·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/009.yaml
  text: Indeed[a], we ourselves had the sentence of death within ourselves, so that we would not rely on ourselves but on God, who raises the dead.
translation:
  language: vi
  text: Thật vậy, chính chúng tôi đã có bản án phải chết trong lòng mình,[a] để chúng tôi không cậy vào chính mình, nhưng cậy vào Đức Chúa Trời, Đấng làm cho người chết sống lại.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “phán quyết về sự chết.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Thật vậy
  rationale: Trong mạch văn, từ này chuyển từ điều vừa nói sang lời khẳng định mạnh hơn; “Thật vậy” diễn đạt tự nhiên sắc thái nhấn mạnh ấy.
- source_word: αὐτοὶ
  choice: chính chúng tôi
  rationale: Giữ sự nhấn mạnh của đại từ trong nguyên văn.
- source_word: ἐν ἑαυτοῖς
  choice: trong mình
  rationale: Diễn đạt trạng thái mà chính Phao-lô và các cộng sự ý thức hoặc mang lấy trong bản thân, đồng thời tránh lối nói nặng nề “trong chính chúng tôi”.
- source_word: τὸ ἀπόκριμα τοῦ θανάτου
  choice: bản án tử hình
  rationale: ἀπόκριμα ở đây nhiều khả năng chỉ một phán quyết hay kết quả đã được định đoạt; “bản án tử hình” tự nhiên và phù hợp với cảm nhận rằng cái chết đã cận kề, nhưng chú thích vẫn bảo lưu khả năng dịch “phán quyết phải chết”.
- source_word: ἐσχήκαμεν
  choice: đã mang
  rationale: Động từ không nói rõ là “nhận”; “đã mang” vừa gần nghĩa có/giữ trong tình trạng đã xác lập, vừa kết hợp tự nhiên với “trong mình”.
- source_word: ἵνα μὴ πεποιθότες ὦμεν
  choice: để chúng tôi không cậy
  rationale: Giữ ý mục đích của ἵνα và diễn đạt πεποιθότες bằng động từ “cậy”, phù hợp với sự tin cậy đặt vào một đối tượng.
- source_word: ἐφ’ ἑαυτοῖς ἀλλ’ ἐπὶ τῷ θεῷ
  choice: vào chính mình, nhưng cậy vào Đức Chúa Trời
  rationale: Giữ đối lập cân xứng giữa tự cậy mình và cậy Đức Chúa Trời; lặp lại “cậy” giúp câu rõ ràng trong tiếng Việt.
- source_word: τῷ ἐγείροντι τοὺς νεκρούς
  choice: Đấng khiến người chết sống lại
  rationale: Diễn đạt trực tiếp quyền năng làm cho kẻ chết sống lại, tự nhiên hơn lối dịch sát chữ “dựng người chết dậy” trong tiếng Việt hiện đại.
theological_decisions:
- issue: Cách diễn đạt τοὺς νεκρούς
  choice: người chết
  alternative: những người đã chết
  rationale: “Người chết” chính xác, gọn và có tính khái quát, không giới hạn lời mô tả vào một nhóm cụ thể hay thêm cách giải thích thần học.
- issue: Tính chất của ἀπόκριμα τοῦ θανάτου
  choice: bản án tử hình
  alternative: phán quyết phải chết
  rationale: Cách dịch chính giữ hình ảnh tư pháp và cảm giác cái chết đã được định đoạt; chú thích bảo lưu cách diễn đạt khác mà không xác quyết nguồn hay chủ thể ban án.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Cấu trúc đối xứng “không cậy vào chính mình, nhưng cậy vào Đức Chúa Trời” giữ rõ trọng tâm thần học của câu mà không thêm diễn giải hệ phái.
