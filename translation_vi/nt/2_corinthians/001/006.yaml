revisions:
- from: Nhưng nếu chúng tôi chịu hoạn nạn[a], ấy là vì sự an ủi và sự cứu rỗi của anh chị em; còn nếu chúng tôi được an ủi, ấy là vì sự an ủi của anh chị em[b]—sự an ủi đang phát huy tác dụng khi anh chị em bền lòng chịu đựng chính những đau khổ mà chúng tôi cũng đang chịu.
  to: Nhưng nếu chúng tôi chịu hoạn nạn, ấy là vì sự an ủi và sự cứu rỗi của anh chị em; còn nếu chúng tôi được an ủi, ấy là vì sự an ủi của anh chị em[a]—sự an ủi đang phát huy tác dụng khi anh chị em bền lòng chịu đựng những đau khổ giống như những đau khổ chúng tôi cũng đang chịu.[b]
  rationale: Chỉnh sửa chỉ làm rõ ý “những đau khổ giống như” của τῶν αὐτῶν παθημάτων và đặt lại neo chú thích dị bản theo đúng mệnh đề có tranh chấp. Những lựa chọn từ vựng chủ đạo và giọng văn của bản thảo được giữ nguyên.
  reviewer_model: gpt-5.6-terra
