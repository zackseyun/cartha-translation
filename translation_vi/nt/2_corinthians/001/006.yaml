    rationale: Dị bản trong SBLGNT liên quan đến mệnh đề “còn nếu chúng tôi được an ủi, ấy là vì sự an ủi của anh chị em”; đặt dấu [a] sau mệnh đề này giúp người đọc nhận biết chính xác phạm vi chú thích.
