id: 2CO.1.6
reference: 2 Corinthians 1:6
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἴτε δὲ θλιβόμεθα, ὑπὲρ τῆς ὑμῶν παρακλήσεως καὶ σωτηρίας· ⸂εἴτε παρακαλούμεθα, ὑπὲρ τῆς ὑμῶν παρακλήσεως⸃ τῆς ἐνεργουμένης ἐν ὑπομονῇ τῶν αὐτῶν παθημάτων ὧν καὶ ἡμεῖς πάσχομεν,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/006.yaml
  text: But if we are afflicted[a], it is for your comfort and salvation; or if we are comforted, it is for your comfort[b], which is at work in enduring the same sufferings that we also suffer.
translation:
  language: vi
  text: Nhưng nếu chúng tôi chịu hoạn nạn, ấy là vì sự an ủi và sự cứu rỗi của anh chị em; còn nếu chúng tôi được an ủi, ấy là vì sự an ủi của anh chị em[a]—sự an ủi đang phát huy tác dụng khi anh chị em bền lòng chịu đựng những đau khổ giống như những đau khổ chúng tôi cũng đang chịu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Một số thủ bản không có phần: “còn nếu chúng tôi được an ủi, ấy là vì sự an ủi của anh chị em.”'
    reason: textual_variant
  - marker: b
    text: Trong cả câu này, “an ủi” cũng có thể dịch là “khích lệ”.
    reason: lexical_alternative
lexical_decisions:
- source_word: θλιβόμεθα
  choice: chúng tôi chịu hoạn nạn
  rationale: Động từ hiện tại bị động diễn tả việc liên tục phải chịu áp lực và gian truân; “chịu hoạn nạn” trang trọng, dễ hiểu và phù hợp văn cảnh.
- source_word: παρακλήσεως / παρακαλούμεθα
  choice: sự an ủi / được an ủi
  rationale: Trong 2 Cô-rinh-tô 1:3–7, nhóm từ này vừa hàm ý an ủi vừa hàm ý nâng đỡ, khích lệ. Dùng nhất quán “an ủi” giữ được sự liên kết từ vựng của đoạn văn.
- source_word: σωτηρίας
  choice: sự cứu rỗi
  rationale: Giữ nghĩa rộng của σωτηρία trong cách dùng của Phao-lô, không thu hẹp thành sự giải thoát khỏi một hoàn cảnh nhất thời.
- source_word: τῆς ἐνεργουμένης
  choice: đang phát huy tác dụng
  rationale: Diễn đạt hiệu lực đang hoạt động của phân từ hiện tại, tự nhiên hơn lối dịch sát chữ “đang vận hành” trong tiếng Việt.
- source_word: ἐν ὑπομονῇ
  choice: khi anh chị em bền lòng chịu đựng
  rationale: ὑπομονή chỉ sự kiên trì bền vững dưới thử thách; cách diễn đạt này làm rõ sự an ủi phát huy hiệu lực trong việc chịu đựng mà không biến câu thành lời giải thích thần học.
- source_word: τῶν αὐτῶν παθημάτων
  choice: chính những đau khổ
  rationale: “Chính những” thể hiện τῶν αὐτῶν và nhấn mạnh sự cùng chia sẻ những đau khổ giữa các sứ đồ với người Cô-rinh-tô.
- source_word: ὑπὲρ
  choice: vì
  rationale: Trong cả hai mệnh đề, giới từ biểu thị lợi ích hướng đến người Cô-rinh-tô; “vì” tự nhiên và súc tích trong tiếng Việt.
theological_decisions:
- issue: Phạm vi nghĩa của σωτηρία
  choice: sự cứu rỗi
  alternative: sự giải thoát
  rationale: “Sự cứu rỗi” bảo toàn ý nghĩa cứu độ rộng có thể có trong câu, thay vì mặc nhiên giới hạn vào sự thoát khỏi hoạn nạn hiện tại.
- issue: Chủ thể hàm ẩn của hành động bền lòng chịu đựng
  choice: diễn đạt là “khi anh chị em bền lòng chịu đựng”
  alternative: “trong sự bền lòng chịu đựng” không nêu chủ thể
  rationale: Cấu trúc sở hữu “sự an ủi của anh chị em” và văn cảnh cho thấy hiệu lực của sự an ủi được biểu hiện nơi sự chịu đựng của họ; cách dịch làm câu tiếng Việt rõ và tự nhiên nhưng không xác định thêm nguồn thần học của hiệu lực ấy.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại; dùng “anh chị em” cho đại từ số nhiều ὑμῶν nhằm tự nhiên và bao quát trong tiếng Việt. Dấu gạch ngang giúp xác định cụm giải thích cho “sự an ủi” mà vẫn giữ dòng lập luận dài của nguyên văn.
