    rationale: “Chính những đau khổ mà chúng tôi cũng đang chịu” có thể được hiểu là nhấn mạnh các đau khổ nói chung, nhưng không nói rõ sự tương ứng mà αὐτῶν đánh dấu. Cần dùng “những đau khổ giống như những đau khổ chúng tôi cũng đang chịu” để bảo toàn ý nghĩa mà không thêm diễn giải.
