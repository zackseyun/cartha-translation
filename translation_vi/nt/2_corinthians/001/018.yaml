  - severity: low
    issue: “nên” có thể làm mạnh quan hệ suy luận
    rationale: Cấu trúc πιστὸς δὲ ὁ θεὸς ὅτι có thể được hiểu như một lời xác quyết dựa trên sự thành tín của Đức Chúa Trời. Dấu hai chấm trong tiếng Việt giữ liên hệ này mà không ấn định quá mức quan hệ nhân quả.
