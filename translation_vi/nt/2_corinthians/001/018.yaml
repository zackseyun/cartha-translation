base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/018.yaml
  text: As surely as God is faithful[b][a], our message to you is not “Yes and No.”
translation:
  language: vi
  text: 'Nhưng Đức Chúa Trời là thành tín: lời chúng tôi gửi đến anh chị em không phải là “Có và Không.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch sát hơn: “Nhưng Đức Chúa Trời là thành tín, rằng lời chúng tôi gửi đến anh chị em không phải là ‘Có và Không.’”'
    reason: lexical_alternative
lexical_decisions:
- source_word: πιστός
  choice: thành tín
  rationale: Diễn đạt tự nhiên phẩm chất đáng tin cậy và trước sau như một của Đức Chúa Trời; đây cũng là cách dùng trang trọng, quen thuộc trong văn phong Kinh Thánh tiếng Việt.
- source_word: δὲ
  choice: nhưng
  rationale: Giữ giá trị liên kết mang sắc thái đối lập thông thường của δέ và phù hợp với mạch lập luận; lực khẳng định của cả cấu trúc được thể hiện qua mệnh đề nói về sự thành tín của Đức Chúa Trời.
- source_word: ὅτι
  choice: nên
  rationale: Trong cấu trúc này, ὅτι nối sự thành tín của Đức Chúa Trời với lời quả quyết theo sau. “Nên” truyền đạt tự nhiên quan hệ làm nền tảng/suy ra mà không buộc câu tiếng Việt theo cú pháp Hy Lạp cứng nhắc.
- source_word: λόγος
  choice: lời ... nói
  rationale: Bao quát nghĩa “lời, lời nói, thông điệp” và trong ngữ cảnh chỉ điều Phao-lô cùng các cộng sự truyền đạt cho người Cô-rinh-tô.
- source_word: ἡμῶν
  choice: chúng tôi
  rationale: Thể hiện sở hữu/người phát ngôn số nhiều của ἡμῶν.
- source_word: ὁ πρὸς ὑμᾶς
  choice: nói với anh chị em
  rationale: Diễn đạt rõ lời ấy hướng đến cộng đồng người nhận. “Anh chị em” tự nhiên hơn đại từ số nhiều thiếu phân biệt trong tiếng Việt hiện đại và phù hợp cách xưng hô với hội thánh.
- source_word: οὐκ ἔστιν
  choice: không phải là
  rationale: Phản ánh thì hiện tại và phủ định bản chất của lời truyền đạt.
- source_word: Ναὶ καὶ Οὔ
  choice: “Có” rồi lại “Không”
  rationale: Giữ cặp từ đối lập của nguyên văn; “rồi lại” làm rõ sắc thái thiếu nhất quán trong tiếng Việt mà ngữ cảnh nhắm đến, nhưng không biến nó thành một lời giải thích dài.
theological_decisions:
- issue: Cách hiểu cấu trúc xác quyết πιστὸς δὲ ὁ θεὸς ὅτι
  choice: “Nhưng Đức Chúa Trời là thành tín, nên ...”
  alternative: '“Đức Chúa Trời thành tín làm chứng rằng ...” hoặc sát chữ: “Nhưng Đức Chúa Trời là thành tín, rằng ...”'
  rationale: Bản dịch giữ chính sự thành tín của Đức Chúa Trời làm nền tảng cho lời quả quyết của Phao-lô, không biến câu thành lời thề minh nhiên hay giải quyết quá mức quan hệ cú pháp vốn có thể được diễn đạt theo nhiều cách.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Trời” theo lối gọi phổ biến trong Kinh Thánh tiếng Việt; “anh chị em” thể hiện số nhiều cộng đồng. Dấu ngoặc kép làm nổi bật cặp từ mang tính công thức.
