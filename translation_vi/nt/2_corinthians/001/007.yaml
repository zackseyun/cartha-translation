review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch truyền đạt đúng các thành tố chính của câu Hy Lạp: niềm hy vọng vững chắc liên quan đến độc giả, cơ sở là điều người viết biết, và tương quan “cũng như ... thì cũng ...” giữa việc dự phần đau khổ và sự an ủi. “Sự an ủi” phù hợp với παράκλησις trong mạch văn trực tiếp; chú thích nêu “sự khích lệ” là phương án từ vựng hợp lý.'
  naturalness: Cụm “anh chị em thế nào cùng dự phần” không tự nhiên trong tiếng Việt hiện đại. Đặt “cũng như” ở đầu vế tương liên và lặp chủ ngữ ở vế sau giúp câu sáng rõ, cân đối, mà không bổ sung ý nghĩa.
  terminology: “Niềm hy vọng,” “vững chắc,” “dự phần,” “những đau khổ,” và “sự an ủi” đều phù hợp với văn phong Kinh Thánh Việt ngữ hiện đại và giữ được tính nhất quán chủ đề của đoạn văn. “Anh chị em” là cách xưng hô số nhiều thích hợp trong ngữ cảnh thư tín.
  issues:
  - severity: medium
    issue: Cấu trúc tương liên tiếng Việt chưa tự nhiên
    rationale: Cách viết “anh chị em thế nào cùng dự phần ... thì cũng ... như vậy” đặt từ “thế nào” không đúng vị trí thông dụng và khiến quan hệ giữa hai vế bị gượng. Nguyên văn ὡς ... οὕτως καί được diễn đạt tự nhiên hơn bằng “cũng như ... thì ... cũng ...”.
  revised_text: 'Và niềm hy vọng của chúng tôi về anh chị em là vững chắc, vì chúng tôi biết rằng: cũng như anh chị em dự phần trong những đau khổ, thì anh chị em cũng dự phần trong sự an ủi.[a]'
