source:
  edition: SBLGNT
  text: καὶ ἡ ἐλπὶς ἡμῶν βεβαία ὑπὲρ ⸀ὑμῶν· εἰδότες ὅτι ⸀ὡς κοινωνοί ἐστε τῶν παθημάτων, οὕτως καὶ τῆς παρακλήσεως.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/007.yaml
  text: And our hope for you is firm[a], because we know that just as you share in the sufferings, so also you share in the comfort.
translation:
  language: vi
  text: 'Và niềm hy vọng của chúng tôi về anh chị em là vững chắc, vì chúng tôi biết rằng: cũng như anh chị em dự phần trong những đau khổ, thì anh chị em cũng dự phần trong sự an ủi.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Sự an ủi” cũng có thể dịch là “sự khích lệ”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλπίς
  choice: niềm hy vọng
  rationale: Cách dịch thông dụng và sáng rõ, giữ được cả ý mong đợi lẫn sự tin tưởng mà không diễn giải quá mức.
- source_word: βεβαία
  choice: vững chắc
  rationale: Diễn đạt tự nhiên tính kiên định và đáng tin cậy của niềm hy vọng.
- source_word: ὑπὲρ ὑμῶν
  choice: về anh chị em
  rationale: Trong ngữ cảnh này, giới từ chỉ đối tượng mà niềm hy vọng hướng đến; “về anh chị em” tự nhiên và tránh khả năng hiểu là hy vọng thay cho họ.
- source_word: εἰδότες
  choice: vì chúng tôi biết
  rationale: Phân từ nêu cơ sở cho lời khẳng định trước đó; chuyển thành mệnh đề nguyên nhân giúp câu tiếng Việt rõ ràng.
- source_word: ὡς ... οὕτως καί
  choice: thế nào ... thì cũng ... như vậy
  rationale: Giữ cấu trúc tương liên của nguyên văn trong cách diễn đạt tiếng Việt tự nhiên.
- source_word: κοινωνοί
  choice: cùng dự phần
  rationale: Giữ ý tham dự và chia sẻ chung, đồng thời phản ánh dạng danh từ chỉ người cùng tham dự trong nguyên văn.
- source_word: παθημάτων
  choice: những đau khổ
  rationale: Cách dịch rộng và trực tiếp, phù hợp với ngữ cảnh những hoạn nạn Phao-lô đang đề cập.
- source_word: παρακλήσεως
  choice: sự an ủi
  rationale: Phù hợp với mạch văn lặp lại của đoạn 2 Cô-rinh-tô 1 và giữ ý được nâng đỡ giữa đau khổ.
- source_word: '[elliptical second clause]'
  choice: cùng dự phần
  rationale: Nguyên văn lược động ý ở vế sau; lặp lại “cùng dự phần” trong tiếng Việt để câu hoàn chỉnh mà không thêm nội dung mới.
theological_decisions:
- issue: Phạm vi nghĩa của παράκλησις
  choice: sự an ủi
  alternative: sự khích lệ
  rationale: Ngữ cảnh trực tiếp nhấn mạnh sự nâng đỡ trong hoạn nạn, nhưng từ Hy Lạp cũng có thể mang nghĩa khích lệ; giữ phương án khác trong chú thích để không thu hẹp hoàn toàn sắc thái.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” cho đại từ số nhiều ὑμῶν; giữ cấu trúc cân xứng giữa việc dự phần trong đau khổ và trong sự an ủi.
