  rationale: Chỉ chỉnh cú pháp của cấu trúc so sánh tương liên để đạt tiếng Việt hiện đại, tự nhiên và rõ nghĩa hơn. Giữ nguyên các lựa chọn từ vựng chủ đạo, ý tham dự chung hàm ẩn trong ngữ cảnh, và chú thích về sắc thái thay thế của παράκλησις.
