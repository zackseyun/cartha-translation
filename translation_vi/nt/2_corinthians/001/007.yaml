revisions:
- from: Và niềm hy vọng của chúng tôi về anh chị em thật vững chắc, vì chúng tôi biết rằng anh chị em thế nào cùng dự phần trong những đau khổ, thì cũng cùng dự phần trong sự an ủi như vậy.[a]
