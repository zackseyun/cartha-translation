language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οὐ γὰρ ἄλλα γράφομεν ὑμῖν ἀλλ’ ἢ ἃ ἀναγινώσκετε ἢ καὶ ἐπιγινώσκετε, ἐλπίζω δὲ ⸀ὅτι ἕως τέλους ἐπιγνώσεσθε,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/013.yaml
  text: For we are not writing anything else to you except what you read and indeed understand[a], and I hope that you will understand fully to the end,
translation:
  language: vi
  text: Vì chúng tôi không viết cho anh chị em điều gì khác ngoài những gì anh chị em đọc hoặc hiểu rõ; và tôi hy vọng rằng anh chị em sẽ hiểu rõ cho đến cuối cùng[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể hiểu là: “sẽ hiểu một cách trọn vẹn.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλα
  choice: điều gì khác
  rationale: Dạng trung tính số nhiều trong câu phủ định được diễn đạt tự nhiên trong tiếng Việt là “điều gì khác”, giữ ý rằng thư không chứa một thông điệp khác hay ẩn giấu.
- source_word: ἀναγινώσκετε
  choice: anh chị em đọc
  rationale: Thì hiện tại mang nghĩa trực tiếp, chỉ việc người nhận đọc nội dung thư.
- source_word: ἐπιγινώσκετε
  choice: hiểu rõ
  rationale: Trong ngữ cảnh này, động từ chỉ sự nhận biết hoặc lĩnh hội điều đã đọc; “hiểu rõ” tự nhiên và vẫn giữ sắc thái nhận biết đầy đủ hơn.
- source_word: ἐπιγνώσεσθε
  choice: sẽ hiểu rõ
  rationale: Giữ sự lặp lại với ἐπιγινώσκετε và chuyển đúng dạng tương lai, không tự ý nâng nghĩa thành sự hiểu biết tuyệt đối.
- source_word: ἕως τέλους
  choice: cho đến cuối cùng
  rationale: Dịch trực tiếp giá trị thời gian hoặc giới hạn của cụm từ, đồng thời giữ nguyên khả năng nó hàm ý sự hiểu biết trọn vẹn.
- source_word: οὐ γὰρ ... ἀλλ’ ἢ
  choice: Vì ... không ... điều gì khác ngoài
  rationale: Cấu trúc tiếng Việt này giữ cả quan hệ giải thích của γάρ lẫn tính loại trừ của οὐ ... ἀλλ’ ἢ.
- source_word: ὑμῖν
  choice: cho anh chị em
  rationale: “Anh chị em” là cách xưng hô số nhiều tự nhiên, trang trọng và bao quát trong thư tín Cơ Đốc, không buộc danh từ Hy Lạp phải mang nghĩa chỉ nam giới.
theological_decisions:
- issue: Ý nghĩa của ἕως τέλους
  choice: cho đến cuối cùng
  alternative: một cách trọn vẹn
  rationale: Cụm Hy Lạp có thể được hiểu theo hướng thời gian (“đến cuối cùng”) hoặc mức độ (“hoàn toàn”). Bản chính giữ cách diễn đạt sát nguồn và ghi nhận cách hiểu về mức độ trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” cho đối tượng số nhiều; dấu chấm phẩy giúp làm rõ hai mệnh đề liên kết. Dấu chú thích [a] được đặt ngay sau cụm từ có khả năng hiểu theo hai hướng.
