source:
  edition: SBLGNT
  text: Παῦλος ἀπόστολος ⸂Χριστοῦ Ἰησοῦ⸃ διὰ θελήματος θεοῦ καὶ Τιμόθεος ὁ ἀδελφὸς τῇ ἐκκλησίᾳ τοῦ θεοῦ τῇ οὔσῃ ἐν Κορίνθῳ, σὺν τοῖς ἁγίοις πᾶσιν τοῖς οὖσιν ἐν ὅλῃ τῇ Ἀχαΐᾳ·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/001.yaml
  text: 'Paul[a], an apostle of Messiah Jesus by the will of God, and Timothy our brother, to the church of God that is in Corinth[b], together with all the saints who are in all Achaia:'
translation:
  language: vi
  text: 'Phao-lô, sứ đồ của Đấng Mê-si-a Giê-su[a] theo ý muốn của Đức Chúa Trời, và Ti-mô-thê, người anh em của chúng ta, kính gửi hội thánh của Đức Chúa Trời tại Cô-rinh-tô, cùng toàn thể các thánh đồ trong khắp miền A-chai:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: Đấng Christ Giê-su.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπόστολος
  choice: sứ đồ
  rationale: Thuật ngữ quen thuộc và chính xác trong tiếng Việt cho chức vụ được sai phái của Phao-lô; “sứ giả” không thể hiện đầy đủ sắc thái chức vụ trong lời mở đầu thư.
- source_word: Χριστοῦ Ἰησοῦ
  choice: Đấng Mê-si-a Giê-su
  rationale: Giữ rõ nghĩa tước hiệu của Χριστός trong cụm này, đồng thời dùng trật tự của nguyên văn Hy Lạp.
- source_word: διὰ θελήματος θεοῦ
  choice: theo ý muốn của Đức Chúa Trời
  rationale: Cách nói tự nhiên trong tiếng Việt, diễn đạt việc chức sứ đồ của Phao-lô bắt nguồn từ ý muốn Đức Chúa Trời.
- source_word: ὁ ἀδελφὸς
  choice: người anh em của chúng ta
  rationale: Nguyên văn có mạo từ nhưng không có đại từ sở hữu; thêm “của chúng ta” là cách diễn đạt quan hệ cộng đồng tự nhiên trong tiếng Việt và không làm thay đổi ý hàm ẩn.
- source_word: ἐκκλησίᾳ
  choice: Hội Thánh
  rationale: Thuật ngữ tiếng Việt thông dụng và phù hợp với cộng đồng tín hữu trong công thức chào thư của Phao-lô.
- source_word: ἁγίοις
  choice: các thánh đồ
  rationale: Cách gọi quen thuộc chỉ những người thuộc về Đức Chúa Trời; tránh cách dịch “những người thánh” kém tự nhiên.
- source_word: σὺν
  choice: cùng
  rationale: Diễn đạt ngắn gọn và tự nhiên ý bao gồm thêm những người nhận thư trong toàn vùng.
- source_word: ἐν ὅλῃ τῇ Ἀχαΐᾳ
  choice: trong khắp miền A-chai
  rationale: “Khắp” thể hiện đầy đủ phạm vi toàn vùng; “miền” làm rõ A-chai là một địa vực.
theological_decisions:
- issue: Cách dịch Χριστός trong danh xưng mở đầu của Phao-lô
  choice: Đấng Mê-si-a Giê-su
  alternative: Đấng Christ Giê-su
  rationale: Trong Χριστοῦ Ἰησοῦ, Χριστός vẫn mang sức nặng tước hiệu; “Đấng Mê-si-a” làm rõ nghĩa này mà không áp đặt một cách giải thích giáo phái.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Dùng lối phiên âm tên riêng quen thuộc trong Kinh Thánh tiếng Việt; giữ cấu trúc một câu chào thư và dấu hai chấm cuối câu để dẫn sang phần tiếp theo.
