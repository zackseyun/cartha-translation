    issue: “cầu xin Đức Chúa Trời làm chứng cho tôi”
    rationale: ἐπικαλοῦμαι diễn tả việc kêu cầu/invoke Đức Chúa Trời làm nhân chứng trong một lời thề; “cầu xin” và đặc biệt “làm chứng cho tôi” có thể chuyển trọng tâm sang lời cầu xin Đức Chúa Trời bênh vực người nói.
  - severity: medium
    issue: “chưa trở lại Cô-rinh-tô”
    rationale: οὐκέτι ἦλθον không đơn thuần nói “chưa” làm một việc trong tương lai. Trong ngữ cảnh, Phao-lô nói ông đã không đến/trở lại nữa; “chưa” tạo hàm ý việc đến vẫn tất yếu sẽ diễn ra.
  - severity: low
    issue: “sở dĩ ... là”
    rationale: Cấu trúc này biến mệnh đề ὅτι thành lời giải thích nguyên nhân theo lối tiếng Việt. Trong câu Hy Lạp, ὅτι chủ yếu giới thiệu nội dung lời kêu cầu long trọng; câu sửa dùng “rằng” để phản ánh chức năng ấy rõ hơn.
