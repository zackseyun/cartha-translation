id: 2CO.1.23
reference: 2 Corinthians 1:23
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἐγὼ δὲ μάρτυρα τὸν θεὸν ἐπικαλοῦμαι ἐπὶ τὴν ἐμὴν ψυχήν, ὅτι φειδόμενος ὑμῶν οὐκέτι ἦλθον εἰς Κόρινθον.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/023.yaml
  text: But I call God as witness upon my own life[b][a], that to spare you I did not come again to Corinth.
translation:
  language: vi
  text: Còn tôi, tôi kêu cầu Đức Chúa Trời làm chứng, lấy chính mạng sống mình làm bảo chứng[a], rằng vì muốn nương tay với anh chị em, tôi đã không trở lại Cô-rinh-tô nữa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát: “trên linh hồn tôi”; cũng có thể hiểu: “chống lại chính tôi.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “tôi không còn đến Cô-rinh-tô nữa.”'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐγὼ δὲ
  choice: Còn tôi, tôi
  rationale: Giữ sắc thái tương phản nhẹ của δέ và sự nhấn mạnh của đại từ ἐγώ, đồng thời vẫn tự nhiên trong tiếng Việt.
- source_word: μάρτυρα τὸν θεὸν ἐπικαλοῦμαι
  choice: tôi cầu xin Đức Chúa Trời làm chứng cho tôi
  rationale: Diễn đạt tự nhiên lời viện dẫn Đức Chúa Trời làm chứng cho tính chân thật của lời Phao-lô.
- source_word: ἐπὶ τὴν ἐμὴν ψυχήν
  choice: lấy chính mạng sống tôi mà thề
  rationale: Truyền đạt tính chất lời thề và trách nhiệm Phao-lô đặt trên chính sự sống mình, thay vì dịch sát nhưng tối nghĩa là 'trên linh hồn tôi'.
- source_word: ὅτι
  choice: sở dĩ ... là
  rationale: Giới thiệu nội dung của lời khẳng định long trọng, đồng thời tạo câu tiếng Việt rõ ràng.
- source_word: φειδόμενος ὑμῶν
  choice: để khoan dung với anh chị em
  rationale: φείδομαι ở đây mang ý tránh dùng biện pháp nghiêm khắc đối với người nhận thư; 'khoan dung' giữ được sắc thái này.
- source_word: οὐκέτι ἦλθον
  choice: chưa trở lại
  rationale: Theo ngữ cảnh về chuyến thăm bị hoãn, cách này tự nhiên và giữ khả năng hiểu rằng Phao-lô chưa thực hiện chuyến trở lại Cô-rinh-tô; chú thích ghi nhận cách hiểu gần sát hình thức hơn.
- source_word: εἰς Κόρινθον
  choice: Cô-rinh-tô
  rationale: Tên địa danh quen dùng trong tiếng Việt; động từ 'trở lại' đã bao hàm hướng chuyển động đến thành phố.
theological_decisions:
- issue: Tính chất của cụm ἐπὶ τὴν ἐμὴν ψυχήν
  choice: Diễn đạt như một lời thề đặt mạng sống của Phao-lô làm bảo chứng
  alternative: Dịch sát 'trên linh hồn tôi' hoặc 'chống lại chính tôi'
  rationale: Ngữ cảnh là lời viện dẫn Đức Chúa Trời làm chứng, có hàm ý Phao-lô tự đặt mình dưới sự phán xét nếu nói dối; bản dịch không xác định thêm công thức thần học nào ngoài điều câu văn hàm chứa.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” để diễn đạt đại từ số nhiều ὑμῶν một cách tự nhiên, không thêm phân biệt giới tính không có trong ngữ cảnh.
