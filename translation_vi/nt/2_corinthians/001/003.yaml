id: 2CO.1.3
reference: 2 Corinthians 1:3
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Εὐλογητὸς ὁ θεὸς καὶ πατὴρ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, ὁ πατὴρ τῶν οἰκτιρμῶν καὶ θεὸς πάσης παρακλήσεως,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/003.yaml
  text: Blessed be the God and Father of our Lord Jesus the Messiah[a], the Father of mercies and God of all comfort[d][c][b],
translation:
  language: vi
  text: Đáng chúc tụng là Đức Chúa Trời và là Cha của Chúa chúng ta là Đức Chúa Jêsus, Đấng Mê-si[a], là Cha của lòng thương xót[b] và là Đức Chúa Trời ban mọi sự an ủi[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “Đức Chúa Jêsus Christ.”
    reason: alternative_reading
  - marker: b
    text: 'Nguyên văn số nhiều: “Cha của những lòng thương xót”; cũng có thể dịch là “Cha của mọi niềm thương cảm.”'
    reason: lexical_alternative
  - marker: c
    text: Từ này cũng có thể dịch là “khích lệ” hoặc “yên ủi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὐλογητὸς
  choice: Đáng chúc tụng
  rationale: Diễn đạt tự nhiên công thức tôn vinh bằng tính từ vị ngữ, vừa giữ sắc thái tuyên xưng vừa phù hợp văn phong trang trọng tiếng Việt.
- source_word: ὁ θεὸς καὶ πατὴρ
  choice: Đức Chúa Trời, Cha
  rationale: Hiểu một mạo từ chi phối cụm danh từ phối hợp; cách đặt đồng vị này tự nhiên hơn trong tiếng Việt và cho thấy cùng một Đấng vừa là Đức Chúa Trời vừa là Cha của Chúa Jêsus.
- source_word: κυρίου
  choice: Chúa
  rationale: Là cách tương ứng thông dụng và thích hợp với cách dùng κύριος chỉ Đức Chúa Jêsus trong Tân Ước.
- source_word: Χριστοῦ
  choice: Đấng Mê-si
  rationale: Giữ rõ ý nghĩa tước hiệu của Χριστός thay vì coi đó đơn thuần như một phần của tên riêng.
- source_word: οἰκτιρμῶν
  choice: đầy lòng thương xót
  rationale: Chuyển số nhiều Hy Lạp sang một thành ngữ Việt tự nhiên, diễn tả nguồn mạch và sự dồi dào của lòng thương xót mà không gượng ép thành 'những lòng thương xót'.
- source_word: πάσης παρακλήσεως
  choice: ban mọi sự an ủi
  rationale: Trong ngữ cảnh hoạn nạn ở phần tiếp theo, 'an ủi' là nghĩa tự nhiên nhất; thêm 'ban' làm rõ quan hệ nguồn phát hàm chứa trong cách gọi Đức Chúa Trời, còn πάσης được giữ bằng 'mọi sự'.
theological_decisions:
- issue: Cách dịch tước hiệu Χριστός trong Ἰησοῦ Χριστοῦ
  choice: Đức Chúa Jêsus, Đấng Mê-si
  alternative: Đức Chúa Jêsus Christ
  rationale: Bản dịch chính làm hiện rõ nội dung tước hiệu 'Đấng Mê-si' nhưng dùng cấu trúc đồng vị tự nhiên trong tiếng Việt; chú thích bảo lưu cách gọi truyền thống có tính tên riêng.
- issue: Quan hệ trong cụm ὁ θεὸς καὶ πατὴρ τοῦ κυρίου ἡμῶν
  choice: Đức Chúa Trời, Cha của Chúa chúng ta
  alternative: Đức Chúa Trời và Cha của Chúa chúng ta
  rationale: Cách đồng vị tránh gợi ý sai rằng 'Đức Chúa Trời' và 'Cha' là hai đối tượng, đồng thời vẫn giữ nguyên lời xác nhận rằng Ngài là Đức Chúa Trời và Cha của Chúa Jêsus.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ đọc. Dùng “Đức Chúa Trời”, “Chúa” và “Đấng Mê-si” theo cách gọi Kitô giáo quen thuộc; tránh lối dịch số nhiều máy móc ở οἰκτιρμῶν, nhưng ghi rõ hình thức nguyên văn trong chú thích.
