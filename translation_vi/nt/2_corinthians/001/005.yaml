id: 2CO.1.5
reference: 2 Corinthians 1:5
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὅτι καθὼς περισσεύει τὰ παθήματα τοῦ Χριστοῦ εἰς ἡμᾶς, οὕτως διὰ τοῦ Χριστοῦ περισσεύει καὶ ἡ παράκλησις ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/005.yaml
  text: For just as the sufferings of Christ overflow to us[b][a], so also through Christ our comfort overflows.
translation:
  language: vi
  text: Vì cũng như những nỗi đau khổ của Đấng Christ[a][b] tràn đến chúng tôi, thì cũng vậy, qua Đấng Christ, niềm an ủi của chúng tôi cũng tràn đầy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “những nỗi đau khổ vì Đấng Christ.” Tiếng Hy Lạp có thể chỉ những đau khổ thuộc về Đấng Christ hoặc những đau khổ phải chịu vì Ngài.'
    reason: alternative_reading
  - marker: b
    text: “Đấng Christ” cũng có thể dịch là “Đấng Mê-si-a” khi nhấn mạnh ý nghĩa tước hiệu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Vì
  rationale: Mở đầu lời giải thích cho câu trước và giữ sắc thái nguyên nhân của liên từ Hy Lạp.
- source_word: καθὼς ... οὕτως
  choice: cũng như ... thì cũng vậy
  rationale: Giữ cấu trúc so sánh tương ứng của nguyên văn, đồng thời tự nhiên trong tiếng Việt hiện đại.
- source_word: περισσεύει
  choice: tràn đến / tràn đầy
  rationale: Diễn đạt ý dồi dào đến mức vượt quá giới hạn; hai cách kết hợp khác nhau giúp câu tiếng Việt tự nhiên mà vẫn giữ phép lặp của động từ Hy Lạp.
- source_word: τὰ παθήματα
  choice: những nỗi đau khổ
  rationale: Cách dịch trực tiếp, phổ thông và phù hợp với ngữ cảnh Phao-lô nói về hoạn nạn.
- source_word: τοῦ Χριστοῦ
  choice: của Đấng Christ
  rationale: Giữ nguyên quan hệ sở hữu chưa được xác định hoàn toàn trong nguyên văn, không thu hẹp thành chỉ những đau khổ chịu vì Christ.
- source_word: εἰς ἡμᾶς
  choice: tràn đến chúng tôi
  rationale: Diễn đạt tự nhiên hướng tác động của đau khổ vào Phao-lô và các cộng sự; 'chúng tôi' phù hợp với ngữ cảnh thư tín hơn nghĩa bao gồm độc giả.
- source_word: διὰ τοῦ Χριστοῦ
  choice: qua Đấng Christ
  rationale: Giữ ý trung gian/phương tiện của διά với sở hữu cách.
- source_word: ἡ παράκλησις ἡμῶν
  choice: niềm an ủi của chúng tôi
  rationale: Giữ cấu trúc sở hữu và sắc thái nâng đỡ trong bối cảnh đối lập với đau khổ.
theological_decisions:
- issue: Ý nghĩa của cụm 'những nỗi đau khổ của Đấng Christ'
  choice: Giữ cách nói 'của Đấng Christ' để bao hàm sự dự phần vào những đau khổ gắn với Christ.
  alternative: những nỗi đau khổ vì Đấng Christ; những đau khổ chính Christ đã chịu nay tràn đến dân Ngài
  rationale: Sở hữu cách Hy Lạp có thể chỉ những đau khổ thuộc về hoặc gắn với Christ, cũng có thể được hiểu là chịu vì Ngài. Bản chính không giải quyết thay nguyên văn; chú thích bảo tồn khả năng còn lại.
translation_notes:
  register: Văn phong trang trọng nhưng dễ hiểu. Dùng “Đấng Christ” theo cách gọi quen thuộc trong tiếng Việt Cơ Đốc; đặt các dấu chú thích ngay sau cụm từ liên quan. Giữ phép đối xứng và hình ảnh tràn đầy của nguyên văn.
