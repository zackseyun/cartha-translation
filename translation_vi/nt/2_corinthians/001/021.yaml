  text: ὁ δὲ βεβαιῶν ἡμᾶς σὺν ὑμῖν εἰς Χριστὸν καὶ χρίσας ἡμᾶς θεός,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/021.yaml
  text: But the one who establishes us with you in Messiah[a], and who anointed us, is God.
translation:
  language: vi
  text: Còn Đấng làm cho chúng tôi được vững lập cùng với anh chị em trong Đấng Mê-si, và đã xức dầu cho chúng tôi, chính là Đức Chúa Trời.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βεβαιῶν
  choice: làm cho ... được vững lập
  rationale: Diễn đạt ý làm cho vững chắc, bền vững; phân từ hiện tại cho thấy hành động đang tiếp diễn.
- source_word: σὺν ὑμῖν
  choice: chúng tôi cùng anh chị em
  rationale: Giữ rõ sự đồng tham dự giữa Phao-lô và các cộng sự với tín hữu Cô-rinh-tô.
- source_word: εἰς Χριστόν
  choice: trong Đấng Mê-si
  rationale: Trong ngữ cảnh Phao-lô, εἰς có sắc thái hướng đến và gắn kết với Đấng Mê-si; tiếng Việt tự nhiên dùng “trong” nhưng chú thích giữ khả năng dịch sát hơn.
- source_word: χρίσας
  choice: đã xức dầu
  rationale: Giữ mối liên hệ từ vựng với χρίω và hình ảnh xức dầu, không thu hẹp thành một nghi thức cụ thể.
- source_word: θεός
  choice: chính là Đức Chúa Trời
  rationale: Đại từ nhấn mạnh “chính” phản ánh vị trí cuối câu đầy trọng tâm của θεός trong tiếng Hy Lạp.
theological_decisions:
- issue: Sắc thái của εἰς trong εἰς Χριστόν
  choice: “trong Đấng Mê-si” trong chính văn
  alternative: “hướng đến Đấng Mê-si” hoặc sát chữ “vào trong Đấng Mê-si”
  rationale: “Trong” diễn đạt tự nhiên mối liên hệ hay sự hợp nhất trong văn mạch Phao-lô, còn chú thích bảo lưu sắc thái định hướng của εἰς.
- issue: Phạm vi của đại từ ἡμᾶς ở hai vị trí
  choice: Lần đầu dịch “chúng tôi” và lần sau “chúng ta”
  alternative: Dịch cả hai lần là “chúng tôi”
  rationale: Nguyên văn dùng cùng một đại từ ngôi thứ nhất số nhiều ở cả hai vị trí, nên có thể hiểu cùng một phạm vi. Tuy nhiên, khi đi cùng σὺν ὑμῖν, câu chuyển tự nhiên từ nhóm sứ đồ “chúng tôi” cùng độc giả sang tập thể chung “chúng ta”; lựa chọn này vẫn giữ sự căng thẳng bằng ghi chú.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” cho số nhiều ὑμεῖς; “Đấng Mê-si” giữ tính chất tước hiệu. Cấu trúc “chính là Đức Chúa Trời” tái hiện trọng tâm cuối câu của nguyên văn.
