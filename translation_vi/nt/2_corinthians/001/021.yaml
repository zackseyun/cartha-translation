  revision_rationale: Sửa “chúng ta” thành “chúng tôi” để hai lần ἡμᾶς được dịch nhất quán và không thêm một chuyển đổi phạm vi. Điều chỉnh vị trí của “cùng với anh chị em” cho sáng nghĩa hơn. Thay “Nhưng” bằng “Còn” để phản ánh δέ nhẹ hơn, và thu gọn chú thích để nêu phương án tương đương thực sự hữu ích mà không áp đặt một sắc thái định hướng cho εἰς.
