revisions:
- from: trong khi chính anh chị em cũng cùng giúp đỡ chúng tôi bằng lời cầu xin, để nhiều người dâng lời tạ ơn thay cho chúng tôi về ân huệ dành cho chúng tôi qua nhiều người.[a]
  to: vì anh chị em cũng hiệp sức giúp đỡ chúng tôi bằng lời khẩn nguyện, để nhờ nhiều người, lời tạ ơn về ân huệ đã dành cho chúng tôi được nhiều người dâng lên.[a]
  rationale: Bản sửa giữ cả hai lần xuất hiện của «nhiều», chuyển cách hiểu cú pháp ít chắc chắn về vị trí chú thích, và làm câu tiếng Việt tự nhiên hơn. «Ân huệ đã dành cho chúng tôi» chuyển tải τὸ εἰς ἡμᾶς χάρισμα đồng thời cho phép quan hệ ngữ nghĩa của ὑπὲρ ἡμῶν được hiểu trong toàn cụm mà không dùng «thay cho».
  reviewer_model: gpt-5.6-terra
