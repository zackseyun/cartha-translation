source:
  edition: SBLGNT
  text: συνυπουργούντων καὶ ὑμῶν ὑπὲρ ἡμῶν τῇ δεήσει, ἵνα ἐκ πολλῶν προσώπων τὸ εἰς ἡμᾶς χάρισμα διὰ πολλῶν εὐχαριστηθῇ ὑπὲρ ⸀ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/011.yaml
  text: as you also join in helping us by prayer[c][b][a], so that thanks may be given by many on our behalf for the gracious gift given to us.
translation:
  language: vi
  text: vì anh chị em cũng hiệp sức giúp đỡ chúng tôi bằng lời khẩn nguyện, để nhờ nhiều người, lời tạ ơn về ân huệ đã dành cho chúng tôi được nhiều người dâng lên.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cấu trúc Hy Lạp ở cuối câu khó xác định. Cụm dịch là «nhiều người» ở vế sau có nghĩa đen là «từ nhiều khuôn mặt». Cũng có thể hiểu: «để nhờ nhiều người, nhiều người dâng lời tạ ơn vì ân huệ đã dành cho chúng tôi»; hoặc hiểu «qua nhiều người» là bổ nghĩa cho «ân huệ».'
    reason: alternative_reading
lexical_decisions:
- source_word: συνυπουργούντων καὶ ὑμῶν
  choice: trong khi chính anh chị em cũng cùng giúp đỡ
  rationale: Giữ sắc thái cộng tác của tiền tố συν- và giá trị nhấn mạnh của καὶ ὑμῶν, đồng thời nối tự nhiên với mạch câu trước.
- source_word: τῇ δεήσει
  choice: bằng lời cầu xin
  rationale: Thể hiện cách thức/phương tiện và sắc thái khẩn thiết, cụ thể hơn từ «cầu nguyện» nói chung.
- source_word: ἐκ πολλῶν προσώπων
  choice: nhiều người
  rationale: πρόσωπον có nghĩa đen là «khuôn mặt», nhưng trong thành ngữ này chỉ người; lối dịch tự nhiên không làm mất nghĩa.
- source_word: τὸ εἰς ἡμᾶς χάρισμα
  choice: ân huệ dành cho chúng tôi
  rationale: χάρισμα chỉ điều được ban bởi ân điển; «ân huệ» phù hợp với sự giải cứu nhân từ trong văn cảnh mà không xác định quá mức hình thức của món quà.
- source_word: διὰ πολλῶν
  choice: qua nhiều người
  rationale: Giữ lại cụm Hy Lạp khó và sự lặp lại của πολλῶν thay vì âm thầm lược bỏ; «qua» bảo tồn nghĩa trung gian/phương tiện có thể có.
- source_word: εὐχαριστηθῇ ὑπὲρ ἡμῶν
  choice: dâng lời tạ ơn thay cho chúng tôi
  rationale: Diễn đạt tự nhiên thể bị động của động từ và giá trị đại diện/liên quan của ὑπέρ trong ngữ cảnh tạ ơn.
theological_decisions:
- issue: Mối liên hệ của διὰ πολλῶν trong cú pháp câu
  choice: Giữ «qua nhiều người» gắn với ân huệ trong dòng chính
  alternative: Hiểu là lời tạ ơn được dâng qua nhiều người, hoặc là kết quả của lời cầu nguyện của nhiều người
  rationale: Trật tự từ Hy Lạp đặt διὰ πολλῶν sau χάρισμα nhưng cấu trúc vẫn khó và có thể liên hệ theo hơn một cách. Bản dịch không nên xóa cụm từ này; chú thích ghi nhận các cách hiểu chính.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng «anh chị em» cho đối tượng số nhiều; «lời cầu xin» giữ sắc thái khẩn thiết của δέησις. Dấu chú thích [a] xuất hiện ngay sau mệnh đề khó mà chú thích giải thích.
