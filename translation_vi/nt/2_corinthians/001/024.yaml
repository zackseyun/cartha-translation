id: 2CO.1.24
reference: 2 Corinthians 1:24
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οὐχ ὅτι κυριεύομεν ὑμῶν τῆς πίστεως, ἀλλὰ συνεργοί ἐσμεν τῆς χαρᾶς ὑμῶν, τῇ γὰρ πίστει ἑστήκατε.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/024.yaml
  text: Not that we lord it over your faith[a], but we are fellow workers for your joy[c][b], for you stand firm by faith.
translation:
  language: vi
  text: Không phải chúng tôi làm chủ đức tin của anh chị em[a], nhưng chúng tôi là những người cùng làm việc vì niềm vui của anh chị em[b]; vì nhờ đức tin mà anh chị em đứng vững.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “lòng tin của anh chị em.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “các cộng sự vì niềm vui của anh chị em.”'
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “vì anh chị em đứng vững trong đức tin.”'
    reason: alternative_reading
lexical_decisions:
- source_word: κυριεύομεν
  choice: thống trị
  rationale: Động từ chỉ việc hành quyền làm chủ trên người khác; “thống trị” tự nhiên trong tiếng Việt và giữ sắc thái tiêu cực của việc áp đặt quyền lực.
- source_word: ὑμῶν τῆς πίστεως
  choice: đức tin của anh chị em
  rationale: Cách diễn đạt này phản ánh tự nhiên cấu trúc sở hữu và giữ πίστις là “đức tin”; “lòng tin” cũng có thể phù hợp về từ vựng.
- source_word: συνεργοί
  choice: những người cùng làm việc
  rationale: Diễn tả Phao-lô và các cộng sự cùng góp công, đối lập với việc thống trị; cách nói này rõ ràng và không hàm ý họ kiểm soát người Cô-rinh-tô.
- source_word: τῆς χαρᾶς ὑμῶν
  choice: vì niềm vui của anh chị em
  rationale: Dù là cấu trúc sở hữu trong tiếng Hy Lạp, ở đây sở hữu cách nhiều khả năng chỉ mục tiêu hay lợi ích của công việc chung.
- source_word: τῇ γὰρ πίστει
  choice: vì nhờ đức tin
  rationale: Dữ cách có thể chỉ phương tiện hay cơ sở; “nhờ đức tin” diễn đạt tự nhiên ý nghĩa phương tiện, trong khi “trong đức tin” vẫn là một khả năng.
- source_word: ἑστήκατε
  choice: đứng vững
  rationale: Thể hoàn thành diễn tả trạng thái đứng đã được thiết lập và vẫn tiếp diễn; “đứng vững” chuyển tải rõ sức bền của trạng thái ấy.
theological_decisions:
- issue: Ý nghĩa của πίστις trong cả hai lần xuất hiện
  choice: đức tin
  alternative: lòng tin; sự trung tín
  rationale: Ngữ cảnh nói về niềm tin của tín hữu Cô-rinh-tô và lập trường họ đang giữ, nên “đức tin” là cách dịch phù hợp nhất; không có dấu hiệu buộc phải hiểu là “sự trung tín”.
- issue: Quan hệ được diễn tả bởi τῇ πίστει
  choice: nhờ đức tin
  alternative: trong đức tin
  rationale: Dữ cách có thể được hiểu là phương tiện hoặc phạm vi. Bản chính chọn phương tiện nhưng giữ cách hiểu phạm vi trong chú thích để không xóa bỏ sự mơ hồ thật của câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “anh chị em” để diễn đạt số nhiều ὑμῶν một cách tự nhiên; giữ sự đối lập rõ giữa áp đặt quyền lực và cùng làm việc. Các chú thích bảo tồn những khả năng từ vựng và cú pháp thực sự có trong tiếng Hy Lạp.
