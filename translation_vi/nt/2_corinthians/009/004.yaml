revisions:
- from: Kẻo nếu có người Ma-xê-đô-ni-a nào cùng tôi đến và thấy anh chị em chưa chuẩn bị sẵn, thì chúng tôi—chứ chưa nói đến anh chị em[b]—sẽ bị hổ thẹn về niềm tin tưởng này.[a]
  to: E rằng nếu có những người Ma-xê-đô-ni-a cùng tôi đến mà thấy anh chị em chưa chuẩn bị sẵn, thì chúng tôi—chưa nói đến anh chị em[b]—sẽ phải hổ thẹn về niềm tin tưởng này[a].
  rationale: Bản sửa giữ nguyên ý nghĩa và tính dè dặt của nguyên văn, nhưng phản ánh rõ số nhiều của “người Ma-xê-đô-ni-a,” dùng các cấu trúc tự nhiên hơn trong tiếng Việt hiện đại, và đặt lại neo chú thích từ vựng cho đúng cụm ὑπόστασις. Không có quyết định giáo phái hay diễn giải thần học nào được thêm vào.
  reviewer_model: gpt-5.6-terra
