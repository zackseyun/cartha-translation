reference: 2 Corinthians 9:4
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: μή πως ἐὰν ἔλθωσιν σὺν ἐμοὶ Μακεδόνες καὶ εὕρωσιν ὑμᾶς ἀπαρασκευάστους καταισχυνθῶμεν ἡμεῖς, ἵνα μὴ ⸀λέγωμεν ὑμεῖς, ἐν τῇ ὑποστάσει ⸀ταύτῃ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/004.yaml
  text: lest if any Macedonians come with me and find you unprepared[b][a], we—not to say you—would be put to shame in this matter of confidence.
translation:
  language: vi
  text: E rằng nếu có những người Ma-xê-đô-ni-a cùng tôi đến mà thấy anh chị em chưa chuẩn bị sẵn, thì chúng tôi—chưa nói đến anh chị em[b]—sẽ phải hổ thẹn về niềm tin tưởng này[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “trong sự tin chắc này.” Từ Hy Lạp trong ngữ cảnh cũng có thể mang nghĩa “việc đảm nhận” hoặc “tình thế,” nhưng ở đây rất có thể chỉ niềm tin tưởng của Phao-lô về anh chị em.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “huống chi anh chị em.” Qua lời xen này, Phao-lô ngụ ý rằng người Cô-rinh-tô cũng sẽ chung sự hổ thẹn nếu họ bị thấy là chưa chuẩn bị sẵn.
    reason: alternative_reading
lexical_decisions:
- source_word: μή πως ἐὰν
  choice: Kẻo nếu
  rationale: Diễn đạt mối lo ngại và tình huống có thể xảy ra trong tương lai, đồng thời giữ sắc thái phòng ngừa của μή πως cùng điều kiện ἐάν.
- source_word: ἔλθωσιν σὺν ἐμοὶ Μακεδόνες
  choice: có người Ma-xê-đô-ni-a nào cùng tôi đến
  rationale: Danh từ không có mạo từ mang sắc thái bất định; cách dịch này không hàm ý một nhóm đã được xác định trước.
- source_word: εὕρωσιν ὑμᾶς ἀπαρασκευάστους
  choice: thấy anh chị em chưa chuẩn bị sẵn
  rationale: ἀπαρασκεύαστος chỉ tình trạng chưa sẵn sàng; trong ngữ cảnh, điều này liên quan đến khoản quyên góp mà Phao-lô mong đã được chuẩn bị.
- source_word: καταισχυνθῶμεν
  choice: sẽ bị hổ thẹn
  rationale: Giữ dạng bị động và sắc thái mất mặt trước người khác, thay vì chỉ diễn tả cảm giác xấu hổ nội tâm.
- source_word: ἡμεῖς
  choice: chúng tôi
  rationale: Đại từ được nêu rõ trong tiếng Hy Lạp để nhấn mạnh; dấu gạch ngang và lời xen giữa giúp duy trì điểm nhấn ấy.
- source_word: ἵνα μὴ λέγωμεν ὑμεῖς
  choice: chứ chưa nói đến anh chị em
  rationale: Lời xen này giảm nhẹ cách nói nhưng vẫn hàm ý rằng tín hữu Cô-rinh-tô cũng sẽ chung sự hổ thẹn.
- source_word: ἐν τῇ ὑποστάσει ταύτῃ
  choice: về niềm tin tưởng này
  rationale: Trong ngữ cảnh, ὑπόστασις hợp lý nhất là sự tin tưởng của Phao-lô về sự sẵn sàng của người Cô-rinh-tô; giới từ “về” tạo câu tiếng Việt tự nhiên mà không đưa nghĩa triết học “bản thể” vào đây.
theological_decisions:
- issue: Nghĩa của ὑπόστασις trong ngữ cảnh không mang tính thuật ngữ triết học
  choice: niềm tin tưởng
  alternative: việc đảm nhận này; tình thế này
  rationale: Mạch văn nói về sự tin tưởng của Phao-lô nơi sự sẵn sàng của người Cô-rinh-tô trước những người Ma-xê-đô-ni-a. Cách dịch này hợp ngữ cảnh nhưng chú thích vẫn bảo lưu các khả năng từ vựng khác.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, dùng “anh chị em” để gọi cộng đồng tín hữu và phiên âm địa danh quen thuộc “Ma-xê-đô-ni-a.” Cấu trúc “Kẻo nếu” giữ nét lo ngại của nguyên văn; dấu gạch ngang làm rõ lời xen mang tính tu từ của Phao-lô.
