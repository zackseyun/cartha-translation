  - severity: low
    issue: “Kẻo nếu” và “sẽ bị hổ thẹn” chưa thật tự nhiên.
    rationale: “E rằng nếu” là lối nói hiện đại, rõ sắc thái lo ngại. “Sẽ phải hổ thẹn” diễn đạt tự nhiên hậu quả đáng xấu hổ được nêu trong mệnh đề điều kiện.
  - severity: low
    issue: Vị trí neo chú thích a chưa sát từ/cụm từ được chú giải.
    rationale: Chú thích a giải thích ὑπόστασις, vì vậy nên đặt ngay sau “niềm tin tưởng này” thay vì sau dấu chấm cuối câu.
