  source_fidelity: Bản dịch giữ đúng thể bị động của πλουτιζόμενοι, ý bao quát của ἐν παντί, quan hệ nhân quả của κατεργάζεται, và vai trò trung gian của δι’ ἡμῶν. Tuy nhiên, “rộng lòng trong mọi việc” dễ được hiểu là thái độ bao dung hoặc rộng lượng nói chung trong mọi hoạt động, thay vì ἁπλότης trong ngữ cảnh này là sự hào phóng trong việc cho tặng. Cần dùng cách diễn đạt trực tiếp hơn về sự rộng rãi/hào phóng, đồng thời vẫn chuyển tải πᾶσαν.
  naturalness: “Được làm cho phong phú về mọi phương diện” và “qua chúng tôi ... làm phát sinh lời tạ ơn” đều tự nhiên trong văn phong Kinh Thánh hiện đại. “Để có thể hết sức rộng rãi” tự nhiên hơn “để rộng lòng trong mọi việc” và không tạo cảm giác giải nghĩa quá mức.
