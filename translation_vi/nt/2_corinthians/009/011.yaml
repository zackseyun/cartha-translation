revisions:
- from: được làm cho phong phú về mọi phương diện để rộng lòng trong mọi việc[a], và qua chúng tôi, lòng rộng rãi ấy làm phát sinh lời tạ ơn Đức Chúa Trời—
  to: được làm cho phong phú về mọi phương diện để có thể hết sức rộng rãi[a], và qua chúng tôi, sự rộng rãi ấy làm phát sinh lời tạ ơn dâng lên Đức Chúa Trời—
