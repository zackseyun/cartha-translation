source:
  edition: SBLGNT
  text: ἐν παντὶ πλουτιζόμενοι εἰς πᾶσαν ἁπλότητα, ἥτις κατεργάζεται δι’ ἡμῶν εὐχαριστίαν τῷ θεῷ—
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/011.yaml
  text: being enriched in every way for all generosity[a], which through us produces thanksgiving to God—
translation:
  language: vi
  text: được làm cho phong phú về mọi phương diện để có thể hết sức rộng rãi[a], và qua chúng tôi, sự rộng rãi ấy làm phát sinh lời tạ ơn dâng lên Đức Chúa Trời—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “để có mọi sự rộng rãi” hoặc “để luôn hào phóng.” Từ Hy Lạp này trong những ngữ cảnh khác còn có thể mang nghĩa “chân thành” hoặc “đơn sơ,” nhưng ở đây, bối cảnh ban tặng nghiêng về nghĩa “rộng rãi, hào phóng.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν παντὶ
  choice: về mọi phương diện
  rationale: Diễn đạt tự nhiên phạm vi bao quát của cụm từ, phù hợp với ý được ban cho đầy đủ để có thể chia sẻ.
- source_word: πλουτιζόμενοι
  choice: được làm cho phong phú
  rationale: Giữ thể bị động hiện tại và hàm ý Đức Chúa Trời là tác nhân, đồng thời tránh khiến câu chỉ nói về sự giàu có vật chất.
- source_word: εἰς πᾶσαν ἁπλότητα
  choice: để rộng lòng trong mọi việc
  rationale: Trong bối cảnh quyên góp, ἁπλότης chỉ sự hào phóng, rộng rãi cụ thể; cấu trúc với εἰς được chuyển thành mục đích hoặc kết quả tự nhiên trong tiếng Việt.
- source_word: ἥτις
  choice: lòng rộng rãi ấy
  rationale: Nêu rõ sở chỉ của đại từ quan hệ là sự rộng lòng vừa được nói đến, tránh đại từ tiếng Việt mơ hồ.
- source_word: κατεργάζεται
  choice: làm phát sinh
  rationale: Truyền đạt ý tạo nên một kết quả mà không thêm sắc thái nhân quả quá mạnh.
- source_word: δι’ ἡμῶν
  choice: qua chúng tôi
  rationale: Giữ nguyên tính trung gian của Phao-lô và các cộng sự mà không diễn giải thêm thành công tác phục vụ.
- source_word: εὐχαριστίαν τῷ θεῷ
  choice: lời tạ ơn Đức Chúa Trời
  rationale: Giữ hình thức danh từ và hướng của sự tạ ơn về Đức Chúa Trời bằng cách diễn đạt trang trọng, tự nhiên.
theological_decisions:
- issue: Nghĩa của ἁπλότης trong bối cảnh cuộc quyên góp
  choice: sự rộng lòng, hào phóng trong việc ban cho
  alternative: sự đơn sơ, chân thành hoặc một lòng
  rationale: Mạch văn về sự chu cấp, việc ban tặng và lời tạ ơn phát sinh từ đó ưu tiên nghĩa rộng rãi thực tế, nhưng chú thích vẫn bảo lưu phạm vi nghĩa khác của từ trong các ngữ cảnh khác.
- issue: Tác nhân ngầm của πλουτιζόμενοι
  choice: giữ thể bị động, để Đức Chúa Trời là tác nhân ngầm theo mạch văn
  alternative: nói rõ “Đức Chúa Trời làm cho anh em phong phú”
  rationale: Bản Hy Lạp không nêu tác nhân ngay trong mệnh đề này; giữ thể bị động tránh bổ sung điều vốn chỉ được suy ra từ ngữ cảnh.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Trời” theo văn phong Kinh Thánh Tin Lành quen thuộc; câu giữ dấu gạch ngang cuối vì đây là một phần của câu văn tiếp nối. Cụm “lòng rộng rãi ấy” được dùng để làm rõ liên hệ của đại từ quan hệ trong tiếng Việt.
