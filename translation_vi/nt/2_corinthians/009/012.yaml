id: 2CO.9.12
reference: 2 Corinthians 9:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὅτι ἡ διακονία τῆς λειτουργίας ταύτης οὐ μόνον ἐστὶν προσαναπληροῦσα τὰ ὑστερήματα τῶν ἁγίων, ἀλλὰ καὶ περισσεύουσα διὰ πολλῶν εὐχαριστιῶν τῷ θεῷ—
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/012.yaml
  text: For the ministry of this service is not only supplying the needs of the saints[b][a], but is also overflowing in many thanksgivings to God—
translation:
  language: vi
  text: Vì công tác phục vụ này không những đáp ứng những thiếu thốn của các thánh đồ[a], mà còn tuôn tràn trong nhiều lời tạ ơn dâng lên Đức Chúa Trời[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “bù đắp những gì các thánh đồ còn thiếu.”
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể hiểu là “làm phát sinh nhiều lời tạ ơn dâng lên Đức Chúa Trời.”
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: ὅτι
  choice: Vì
  rationale: Liên từ này giải thích cho ý ngay trước đó; “Vì” giữ được quan hệ giải thích và nối câu tự nhiên trong tiếng Việt.
- source_word: ἡ διακονία τῆς λειτουργίας ταύτης
  choice: việc phục vụ qua công tác này
  rationale: 'Cách dịch này phân biệt tương đối hai danh từ gần nghĩa: διακονία là “việc phục vụ”, còn λειτουργία là “công tác” cụ thể đang được thực hiện, tức việc quyên góp cứu trợ.'
- source_word: προσαναπληροῦσα τὰ ὑστερήματα
  choice: đáp ứng những thiếu thốn
  rationale: Cụm từ nói đến việc bù đắp phần còn thiếu. “Đáp ứng những thiếu thốn” vừa tự nhiên trong ngữ cảnh cứu trợ vừa không thu hẹp ý nghĩa vào một loại nhu cầu cụ thể.
- source_word: τῶν ἁγίων
  choice: của các thánh đồ
  rationale: “Các thánh đồ” giữ thuật ngữ quen thuộc của Phao-lô dành cho những người tin, không hàm ý rằng chỉ một nhóm tín hữu đặc biệt được phong thánh.
- source_word: περισσεύουσα
  choice: tuôn tràn
  rationale: Động từ diễn tả sự dư dật vượt quá mức đủ; “tuôn tràn” bảo tồn hình ảnh mạnh của nguyên văn.
- source_word: διὰ πολλῶν εὐχαριστιῶν τῷ θεῷ
  choice: qua nhiều lời tạ ơn dâng lên Đức Chúa Trời
  rationale: “Qua” phản ánh διά với sở hữu cách, còn “dâng lên” làm rõ Đức Chúa Trời là Đấng nhận những lời tạ ơn mà không quyết định quá mức quan hệ phương tiện hay kết quả.
theological_decisions:
- issue: Cách dịch ἅγιοι là thuật ngữ chỉ cộng đồng tín hữu
  choice: các thánh đồ
  alternative: dân thánh của Đức Chúa Trời; những người thánh
  rationale: “Các thánh đồ” bảo tồn cách gọi mang tính hội thánh học của Phao-lô và không thay thế thuật ngữ bằng một lời diễn giải rộng hơn.
- issue: Quan hệ giữa công tác cứu trợ và những lời tạ ơn
  choice: tuôn tràn qua nhiều lời tạ ơn
  alternative: làm phát sinh nhiều lời tạ ơn; dồi dào trong nhiều lời tạ ơn
  rationale: Nguyên văn với διά có thể được hiểu theo sắc thái phương tiện hoặc kết quả. Bản chính giữ cấu trúc tương đối gần nguyên văn, còn chú thích nêu cách diễn đạt theo kết quả.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dấu gạch ngang cuối câu được giữ lại vì câu Hy Lạp tiếp tục sang ý kế tiếp. Cụm “việc phục vụ qua công tác này” cố ý giữ sự phân biệt giữa διακονία và λειτουργία mà không dùng thuật ngữ giáo phái.
