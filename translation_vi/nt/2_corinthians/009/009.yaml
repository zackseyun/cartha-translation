base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/009.yaml
  text: 'as it is written: “He scattered abroad[a], he gave to the poor; his righteousness remains forever.”'
translation:
  language: vi
  text: 'như có lời chép:


    “Người đã rải ra khắp nơi, ban cho người nghèo;

    sự công chính[a] của người vẫn tồn tại đời đời.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “sự công bằng của người vẫn tồn tại đời đời.” Từ Hy Lạp có thể mang cả nghĩa công chính lẫn công bằng.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς γέγραπται
  choice: như có lời chép
  rationale: Công thức dẫn Kinh Thánh quen thuộc, tự nhiên và trang trọng trong tiếng Việt.
- source_word: Ἐσκόρπισεν
  choice: Người đã rải ra khắp nơi
  rationale: Giữ hình ảnh gieo rải, phân tán rộng rãi của động từ Hy Lạp, đồng thời gợi việc rộng tay phân phát thay vì làm phẳng hình ảnh thành chỉ ‘phân phát’.
- source_word: ἔδωκεν
  choice: ban cho
  rationale: Diễn đạt thể aorist bằng hành động đã xảy ra; ‘ban cho’ phù hợp với văn phong thi ca trang trọng và hành động rộng lượng.
- source_word: τοῖς πένησιν
  choice: người nghèo
  rationale: Chỉ trực tiếp những người có phương tiện sinh sống hạn hẹp; đây là cách diễn đạt rõ ràng, thông dụng trong tiếng Việt hiện đại.
- source_word: ἡ δικαιοσύνη αὐτοῦ
  choice: sự công chính của người
  rationale: ‘Sự công chính’ giữ được phạm vi nghĩa về phẩm chất ngay chính và việc làm đúng đắn; chú thích bảo lưu nghĩa gần với công bằng.
- source_word: μένει
  choice: còn lại
  rationale: Phản ánh trực tiếp ý nghĩa tiếp tục tồn tại của μένω và hợp với ý về kết quả bền lâu.
- source_word: εἰς τὸν αἰῶνα
  choice: đời đời
  rationale: Cách nói tự nhiên, trang trọng để diễn đạt sự kéo dài không dứt trong ngữ cảnh thi ca Kinh Thánh.
theological_decisions:
- issue: Cách dịch δικαιοσύνη trong lời trích dẫn được Phao-lô sử dụng
  choice: sự công chính
  alternative: sự công bằng
  rationale: ‘Sự công chính’ duy trì sự liên tục từ vựng thần học mà không giới hạn từ này vào địa vị hay hành vi; ‘sự công bằng’ được ghi ở chú thích để bảo lưu sắc thái đạo đức-xã hội có thể có.
translation_notes:
  register: Văn phong hiện đại, trang trọng, có nhịp thơ. Đại từ ‘người’ không viết hoa trong mệnh đề thứ hai vì nhân vật được nói đến là người rộng lòng trong Thi Thiên được trích dẫn, không mặc nhiên xác định là Đức Chúa Trời. Dấu chú thích đặt sau cụm có phương án dịch thay thế.
