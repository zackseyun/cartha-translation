source:
  edition: SBLGNT
  text: ἔπεμψα δὲ τοὺς ἀδελφούς, ἵνα μὴ τὸ καύχημα ἡμῶν τὸ ὑπὲρ ὑμῶν κενωθῇ ἐν τῷ μέρει τούτῳ, ἵνα καθὼς ἔλεγον παρεσκευασμένοι ἦτε,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/003.yaml
  text: But I sent the brothers[a], so that our boasting about you might not be emptied in this matter, so that, just as I was saying, you may be prepared[b],
translation:
  language: vi
  text: Nhưng tôi đã cử các anh em đi, để niềm tự hào của chúng tôi về anh chị em không trở nên vô nghĩa trong việc này, và để anh chị em sẵn sàng, đúng như tôi vẫn nói.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔπεμψα
  choice: tôi đã sai ... đến
  rationale: Thì aorist được diễn đạt tự nhiên bằng quá khứ; “sai ... đến” phù hợp với việc cử các đại diện tới Cô-rinh-tô.
- source_word: τοὺς ἀδελφούς
  choice: các anh em
  rationale: Cụm giống đực số nhiều ở đây chỉ những nam đại diện cụ thể được nhắc đến trong ngữ cảnh.
- source_word: τὸ καύχημα ἡμῶν τὸ ὑπὲρ ὑμῶν
  choice: lời chúng tôi tự hào về anh chị em
  rationale: Giữ sắc thái καύχημα là điều/lời tự hào, thay vì làm nhẹ thành “lòng tin”; “về anh chị em” diễn đạt tự nhiên đối tượng Phao-lô đã nói tốt về.
- source_word: κενωθῇ
  choice: không trở nên rỗng tuếch
  rationale: Bảo tồn hình ảnh của động từ “làm cho rỗng” đồng thời truyền đạt nghĩa lời tự hào bị chứng tỏ là không có cơ sở.
- source_word: ἐν τῷ μέρει τούτῳ
  choice: trong việc này
  rationale: μέρος được dùng theo nghĩa phương diện/vấn đề, không phải một phần vật lý.
- source_word: καθὼς ἔλεγον
  choice: như tôi vẫn nói
  rationale: “Vẫn nói” thể hiện sắc thái kéo dài hoặc lặp lại của thì imperfect.
- source_word: παρεσκευασμένοι ἦτε
  choice: anh chị em sẵn sàng
  rationale: Diễn đạt trạng thái đã được chuẩn bị mà mệnh đề mục đích hướng tới; “sẵn sàng” tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Phạm vi của đại từ số nhiều ὑμῶν
  choice: anh chị em
  alternative: các bạn / anh em
  rationale: Đại từ chỉ toàn thể hội thánh Cô-rinh-tô, một cộng đồng gồm cả nam lẫn nữ; cách dịch bao hàm giới tính mà không thay đổi đối tượng.
- issue: Quan hệ giữa hai mệnh đề ἵνα
  choice: “để ... và để ...” như hai mục đích liên hệ
  alternative: lặp “để ... để ...” hoặc coi mệnh đề sau là giải thích cho mệnh đề trước
  rationale: Cấu trúc Hy Lạp cho phép mệnh đề thứ hai nêu mục tiêu bổ sung hoặc làm rõ cách lời tự hào không trở nên rỗng; bản dịch không áp đặt quan hệ nhân quả mạnh hơn.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “tôi/chúng tôi” cho Phao-lô và các cộng sự, “anh chị em” cho hội thánh; giữ “các anh em” đối với các nam đại diện cụ thể. Không thêm chú thích vì các khác biệt từ vựng có thể được diễn đạt rõ trong chính văn.
