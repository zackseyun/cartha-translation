  - severity: low
    issue: “rỗng tuếch” lệch sắc thái văn phong.
    rationale: Từ này khá khẩu ngữ và thường dùng cho phát ngôn vô nội dung. Trong ngữ cảnh lời tự hào bị κενωθῇ, “trở nên vô nghĩa” diễn đạt tự nhiên việc lời tự hào bị thành không có hiệu lực/cơ sở.
  revised_text: Nhưng tôi đã cử các anh em đi, để niềm tự hào của chúng tôi về anh chị em không trở nên vô nghĩa trong việc này, và để anh chị em sẵn sàng, đúng như tôi vẫn nói.
