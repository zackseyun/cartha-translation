revisions:
- from: Mỗi người hãy dâng hiến theo điều mình đã quyết định trong lòng, không phải vì buồn tiếc[a] hay do bị ép buộc, vì Đức Chúa Trời yêu người vui lòng dâng hiến.
  to: Mỗi người hãy dâng hiến theo điều mình đã quyết định trong lòng, không phải vì buồn tiếc[a] hay do bị ép buộc, vì Đức Chúa Trời yêu người dâng hiến cách vui vẻ.
  rationale: Chỉ sửa cách diễn đạt của ἱλαρός từ “vui lòng” thành “cách vui vẻ” để giữ nét nghĩa vui tươi/hoan hỷ của nguyên văn. Đồng thời, chỉnh chú thích cho tự nhiên và chính xác hơn trong tiếng Việt. Không thay đổi ý nghĩa hay mức độ mở của bản văn.
