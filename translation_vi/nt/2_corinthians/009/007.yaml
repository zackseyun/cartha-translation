id: 2CO.9.7
reference: 2 Corinthians 9:7
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἕκαστος καθὼς ⸀προῄρηται τῇ καρδίᾳ, μὴ ἐκ λύπης ἢ ἐξ ἀνάγκης· ἱλαρὸν γὰρ δότην ἀγαπᾷ ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/007.yaml
  text: Each one should give as he has decided in his heart[a], not out of grief or compulsion[b], for God loves a cheerful giver.
translation:
  language: vi
  text: Mỗi người hãy dâng hiến theo điều mình đã quyết định trong lòng, không phải vì buồn tiếc[a] hay do bị ép buộc, vì Đức Chúa Trời yêu người dâng hiến cách vui vẻ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc dịch: “không miễn cưỡng.” Cụm Hy Lạp theo nghĩa đen là “không vì sự buồn phiền” hoặc “sự đau buồn.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕκαστος
  choice: Mỗi người
  rationale: Giữ nét phân phối theo từng cá nhân của số ít Hy Lạp, đồng thời tự nhiên trong tiếng Việt và không hàm ý chỉ nam giới.
- source_word: καθὼς προῄρηται τῇ καρδίᾳ
  choice: theo điều mình đã quyết định trong lòng
  rationale: Diễn đạt một quyết định có chủ ý đã được xác lập trong nội tâm; giữ hình ảnh Kinh Thánh về “lòng” thay vì thu hẹp thành hoạt động lý trí.
- source_word: μὴ ἐκ λύπης
  choice: không phải vì buồn tiếc
  rationale: Giữ sắc thái căn bản của λύπη là buồn đau, nhưng “buồn tiếc” tự nhiên hơn trong ngữ cảnh phải chia của cải để dâng và hàm ý miễn cưỡng mà không thay thế hoàn toàn nghĩa gốc.
- source_word: ἢ ἐξ ἀνάγκης
  choice: hay do bị ép buộc
  rationale: Trong ngữ cảnh dâng hiến, cụm từ chỉ hành động phát xuất từ sự bắt buộc hoặc áp lực, không phải từ ý nguyện tự do.
- source_word: ἱλαρὸν δότην
  choice: người vui lòng dâng hiến
  rationale: “Vui lòng” diễn tả tâm thế vui vẻ và tự nguyện; “dâng hiến” xác định tự nhiên hành động cho đi trong ngữ cảnh quyên góp của đoạn thư.
- source_word: ἀγαπᾷ ὁ θεός
  choice: Đức Chúa Trời yêu
  rationale: Giữ động từ “yêu” theo nghĩa trực tiếp của ἀγαπάω và dùng cách gọi trang trọng, quen thuộc trong văn phong Kinh Thánh tiếng Việt.
theological_decisions:
- issue: Chủ thể số ít mang tính đại diện
  choice: Mỗi người ... mình
  alternative: Mỗi người ... người ấy
  rationale: Tiếng Việt dùng “mình” tự nhiên để quy chiếu về từng cá nhân, giữ trọng tâm số ít mà không tạo hàm ý giới tính vốn không có ý nghĩa loại trừ trong nguyên văn.
- issue: Sắc thái của λύπη trong việc dâng hiến
  choice: không phải vì buồn tiếc
  alternative: không miễn cưỡng
  rationale: Bản chính bảo tồn sắc thái từ vựng “buồn/sầu” của nguyên văn, còn cách hiểu theo ngữ cảnh là “miễn cưỡng” được ghi trong chú thích để không âm thầm giải quyết độ mở của từ.
- issue: Tình yêu của Đức Chúa Trời đối với người dâng
  choice: Đức Chúa Trời yêu người vui lòng dâng hiến
  alternative: Đức Chúa Trời hài lòng về người vui lòng dâng hiến
  rationale: Giữ nguyên sức nặng thần học và nghĩa thông thường của ἀγαπᾷ là “yêu,” không làm nhẹ thành sự chấp thuận hay hài lòng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Dâng hiến” phù hợp ngữ cảnh quyên góp trong hội thánh; “mỗi người ... mình” giữ nét cá nhân của nguyên văn mà không gán giới tính.
