  - severity: medium
    issue: “Thứ bị ép lấy” không tự nhiên và mơ hồ về đối tượng bị ép.
    rationale: πλεονεξία về từ vựng là lòng tham/ham chiếm; trong tương phản của câu này, nó trình bày khoản quyên góp như một sự đòi hỏi bóc ép. “Khoản bị ép buộc phải nộp” rõ nghĩa hơn trong tiếng Việt.
  - severity: low
    issue: Cách lặp “món quà rộng rãi / sự ban tặng rộng rãi” thiếu nhất quán.
    rationale: Dùng cùng một cụm “khoản đóng góp rộng rãi” vừa tự nhiên trong ngữ cảnh quyên góp vừa cho thấy sự lặp lại của εὐλογία.
