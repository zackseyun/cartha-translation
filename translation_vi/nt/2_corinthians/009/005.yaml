id: 2CO.9.5
reference: 2 Corinthians 9:5
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀναγκαῖον οὖν ἡγησάμην παρακαλέσαι τοὺς ἀδελφοὺς ἵνα προέλθωσιν ⸀εἰς ὑμᾶς καὶ προκαταρτίσωσι τὴν ⸀προεπηγγελμένην εὐλογίαν ὑμῶν, ταύτην ἑτοίμην εἶναι οὕτως ὡς εὐλογίαν καὶ μὴ ὡς πλεονεξίαν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/005.yaml
  text: Therefore I considered it necessary to urge the brothers[a] to go to you ahead of us and arrange in advance the generous gift[b] you had promised, so that it would be ready as a generous gift and not as something extorted[c].
translation:
  language: vi
  text: Vì vậy, tôi đã thấy cần phải thúc giục các anh em[a] đi trước đến chỗ anh chị em và thu xếp trước khoản đóng góp rộng rãi[b] mà anh chị em đã hứa, để khoản ấy sẵn sàng như một khoản đóng góp rộng rãi, chứ không như một khoản bị ép buộc phải nộp[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể hiểu là “anh chị em” nếu từ này được dùng theo nghĩa bao hàm; trong ngữ cảnh, nó có thể chỉ các thành viên của phái đoàn.
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn là “phước lành”; ở đây từ này chỉ khoản đóng góp đã hứa như một khoản đóng góp rộng rãi.
    reason: lexical_alternative
  - marker: c
    text: Từ Hy Lạp thường có nghĩa là “lòng tham” hoặc “sự ham chiếm đoạt”; ở đây nó mô tả khoản đóng góp như một khoản bị đòi hỏi bóc ép, thay vì được tự nguyện ban tặng.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναγκαῖον οὖν ἡγησάμην
  choice: Vì vậy, tôi thấy cần phải
  rationale: Diễn đạt tự nhiên phán đoán thực tiễn của Phao-lô, đồng thời giữ quan hệ suy luận của οὖν và ý nghĩa cần thiết của ἀναγκαῖον.
- source_word: παρακαλέσαι
  choice: khuyên
  rationale: Trong ngữ cảnh này, động từ chỉ lời thúc giục tha thiết để phái đoàn hành động trước; “khuyên” tự nhiên và không mang sắc thái cưỡng ép.
- source_word: τοὺς ἀδελφοὺς
  choice: các anh em
  rationale: Giữ dạng số nhiều giống đực của tiếng Hy Lạp; khả năng từ này được dùng theo nghĩa bao hàm được nêu trong chú thích.
- source_word: προέλθωσιν εἰς ὑμᾶς
  choice: đi trước chúng tôi đến với anh chị em
  rationale: Làm rõ ý phái đoàn đi trước đoàn của Phao-lô, vốn được ngữ cảnh hành trình hàm ý; “anh chị em” diễn đạt tự nhiên số nhiều ὑμᾶς chỉ toàn thể hội thánh.
- source_word: προκαταρτίσωσι
  choice: chuẩn bị trước
  rationale: Giữ rõ tiền tố chỉ hành động làm sẵn từ trước và phù hợp với việc hoàn tất sự quyên góp trước khi Phao-lô đến.
- source_word: τὴν προεπηγγελμένην εὐλογίαν ὑμῶν
  choice: món quà rộng rãi mà anh chị em đã hứa
  rationale: Trong ngữ cảnh quyên góp, εὐλογία chỉ một tặng phẩm hào phóng; mệnh đề quan hệ diễn đạt tự nhiên việc đã hứa từ trước, còn nghĩa đen “phước lành” được bảo lưu trong chú thích.
- source_word: οὕτως ὡς εὐλογίαν
  choice: như một sự ban tặng rộng rãi
  rationale: Giữ sự lặp lại có chủ ý của εὐλογία nhưng tránh lối diễn đạt gượng; cụm từ cho thấy cách thức và tính chất hào phóng của khoản dâng.
- source_word: πλεονεξίαν
  choice: thứ bị ép lấy
  rationale: Danh từ thường mang nghĩa tham lam hoặc ham chiếm đoạt; trong thế đối lập ở đây, nó mô tả khoản tiền như thứ bị người khác ép buộc moi lấy, thay vì một món quà tự nguyện.
theological_decisions:
- issue: Phạm vi chỉ người của ἀδελφοὺς
  choice: các anh em
  alternative: anh chị em
  rationale: Bản văn dùng danh từ số nhiều giống đực và trong ngữ cảnh có thể chỉ những người nam thuộc phái đoàn. Không chuyển ngay thành cách gọi bao hàm, nhưng ghi nhận khả năng ấy trong chú thích.
- issue: Ý nghĩa của εὐλογία trong ngữ cảnh quyên góp
  choice: món quà rộng rãi / sự ban tặng rộng rãi
  alternative: phước lành
  rationale: Nghĩa theo ngữ cảnh là khoản đóng góp hào phóng. Cách dịch chính giúp độc giả hiểu ngay đối tượng được nói đến, trong khi chú thích giữ hình ảnh nguyên ngữ và sắc thái thần học của “phước lành”.
- issue: Sắc thái của πλεονεξία
  choice: thứ bị ép lấy
  alternative: lòng tham / sự tham lam
  rationale: Giữ thế đối lập giữa sự ban tặng tự nguyện và một khoản bị moi lấy do áp lực. Chú thích nêu nghĩa từ vựng thông thường để không che khuất sự căng thẳng của nguyên ngữ.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “anh chị em” cho đại từ số nhiều chỉ hội thánh, nhưng giữ “các anh em” tại ἀδελφοὺς để phản ánh hình thức nguyên ngữ và phân biệt phái đoàn. Lặp trường nghĩa “rộng rãi” nhằm tái hiện phép đối lập tu từ giữa εὐλογία và πλεονεξία.
