revisions:
- from: Vì vậy, tôi thấy cần phải khuyên các anh em[a] đi trước chúng tôi đến với anh chị em và chuẩn bị trước món quà rộng rãi[b] mà anh chị em đã hứa, để món quà ấy sẵn sàng như một sự ban tặng rộng rãi, chứ không phải như thứ bị ép lấy[c].
  to: Vì vậy, tôi đã thấy cần phải thúc giục các anh em[a] đi trước đến chỗ anh chị em và thu xếp trước khoản đóng góp rộng rãi[b] mà anh chị em đã hứa, để khoản ấy sẵn sàng như một khoản đóng góp rộng rãi, chứ không như một khoản bị ép buộc phải nộp[c].
  rationale: Sửa tối thiểu để tăng độ sát lực của παρακαλέσαι, làm câu tiếng Việt tự nhiên hơn, và diễn đạt thế đối lập εὐλογία/πλεονεξία rõ ràng hơn. “Đi trước” bảo lưu ý của προέλθωσιν mà không biến phần so sánh được ngữ cảnh hàm ý thành một khẳng định quá trực tiếp trong bản văn.
  reviewer_model: gpt-5.6-terra
