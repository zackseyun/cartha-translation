    issue: Cụm “tôi vẫn nói với người Ma-xê-đô-ni-a mà tự hào về anh chị em” mơ hồ và không tự nhiên.
    rationale: Καυχῶμαι là động từ chính, với Μακεδόσιν là người nghe và ὑπὲρ ὑμῶν là đối tượng/lợi ích của lời tự hào. Bản sửa cần biểu thị rõ “tự hào/khoe với ... về ...”.
  - severity: low
    issue: “Từ năm ngoái” chưa biểu đạt rõ hết tình trạng kéo dài đến hiện tại.
    rationale: ἀπὸ πέρυσι, đi với thì hoàn thành παρεσκεύασται, nêu tình trạng bắt đầu từ năm trước và còn hiệu lực. “Từ năm ngoái đến nay” làm rõ điều này.
