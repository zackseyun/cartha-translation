reference: 2 Corinthians 9:2
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οἶδα γὰρ τὴν προθυμίαν ὑμῶν ἣν ὑπὲρ ὑμῶν καυχῶμαι Μακεδόσιν ὅτι Ἀχαΐα παρεσκεύασται ἀπὸ πέρυσι, καὶ ⸀τὸ ὑμῶν ζῆλος ἠρέθισε τοὺς πλείονας.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/002.yaml
  text: 'For I know your eagerness[a], which I boast about to the Macedonians on your behalf: that Achaia has been ready since last year[c][b], and your zeal has stirred up most of them.'
translation:
  language: vi
  text: 'Vì tôi biết tinh thần sẵn sàng[a] của anh chị em, điều mà tôi tự hào nói với người Ma-xê-đô-ni-a về anh chị em: “A-chai[b] đã sẵn sàng từ năm ngoái đến nay”; và lòng nhiệt thành của anh chị em đã khích lệ phần đông trong số họ[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “lòng sốt sắng” hoặc “sự sẵn lòng.”
    reason: lexical_alternative
  - marker: b
    text: A-chai là một tỉnh của La Mã, bao gồm thành Cô-rinh-tô; ở đây địa danh được dùng để chỉ các tín hữu trong vùng.
    reason: cultural_note
  - marker: c
    text: Hay “đa số họ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: προθυμίαν
  choice: tinh thần sẵn sàng
  rationale: Cụm từ diễn tả trạng thái sẵn lòng và hăng hái, đồng thời phân biệt tự nhiên với ζῆλος ở cuối câu.
- source_word: καυχῶμαι
  choice: nói ... mà tự hào
  rationale: Giữ sắc thái mạnh của động từ chỉ việc công khai tự hào hoặc khoe về người khác, nhưng diễn đạt tự nhiên và trang trọng trong tiếng Việt.
- source_word: ὑπὲρ ὑμῶν
  choice: về anh chị em
  rationale: Trong kết cấu với καυχῶμαι, giới từ này chỉ đối tượng mà Phao-lô nói đến với niềm tự hào; cách dịch này tự nhiên hơn “thay mặt anh chị em” trong ngữ cảnh.
- source_word: Μακεδόσιν
  choice: người Ma-xê-đô-ni-a
  rationale: Chỉ những người ở Ma-xê-đô-ni-a mà Phao-lô đã nói chuyện với họ; không thêm từ “tín hữu” vốn chỉ được suy ra từ ngữ cảnh.
- source_word: Ἀχαΐα
  choice: A-chai
  rationale: Giữ nguyên địa danh tỉnh A-chai và lối hoán dụ của nguyên văn, thay vì diễn giải thành “anh chị em” hoặc “các tín hữu tại A-chai.”
- source_word: παρεσκεύασται
  choice: đã sẵn sàng
  rationale: Diễn tả trạng thái hiện tại là kết quả của sự chuẩn bị trước đó, phù hợp với thì hoàn thành và cụm thời gian đi kèm.
- source_word: ἀπὸ πέρυσι
  choice: từ năm ngoái
  rationale: Cách nói tự nhiên trong tiếng Việt, chỉ trạng thái bắt đầu từ năm trước và kéo dài đến hiện tại.
- source_word: τὸ ὑμῶν ζῆλος
  choice: lòng nhiệt thành của anh chị em
  rationale: Giữ cường độ tích cực của ζῆλος và tránh lặp lại cách diễn đạt dành cho προθυμίαν.
- source_word: ἠρέθισε
  choice: đã khích lệ
  rationale: Trong ngữ cảnh tích cực, động từ mang nghĩa thúc đẩy hoặc làm người khác hăng hái; “khích lệ” tránh sắc thái tiêu cực của “kích động.”
- source_word: τοὺς πλείονας
  choice: phần đông trong số họ
  rationale: Chỉ phần lớn những người Ma-xê-đô-ni-a vừa được nhắc đến, đồng thời giữ ý nghĩa “đa số” của cụm Hy Lạp.
theological_decisions:
- issue: Đối tượng được gọi là “A-chai”
  choice: Giữ địa danh A-chai như chủ ngữ, theo lối hoán dụ chỉ các hội thánh hoặc tín hữu trong vùng.
  alternative: “Anh chị em đã sẵn sàng” hoặc “các tín hữu tại A-chai đã sẵn sàng.”
  rationale: Nguyên văn nêu rõ Ἀχαΐα. Giữ địa danh bảo toàn phạm vi khu vực và lối diễn đạt của Phao-lô mà không thu hẹp thành riêng hội thánh Cô-rinh-tô.
- issue: Sắc thái của lời Phao-lô tự hào
  choice: “nói ... mà tự hào”
  alternative: “khoe về” hoặc “khen ngợi”
  rationale: Cách dịch giữ hành động công khai tự hào trong καυχῶμαι mà không làm nhẹ thành lời khen đơn thuần hay tạo sắc thái khoe khoang tiêu cực quá mức.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh chị em” cho đại từ số nhiều ὑμῶν; phiên âm các địa danh theo lối quen thuộc trong Kinh Thánh tiếng Việt. Dấu ngoặc kép làm rõ nội dung lời Phao-lô đã nói với người Ma-xê-đô-ni-a.
