- from: 'Vì tôi biết tinh thần sẵn sàng[a] của anh chị em; tôi vẫn nói với người Ma-xê-đô-ni-a mà tự hào về anh chị em rằng: “A-chai[b] đã sẵn sàng từ năm ngoái,” và lòng nhiệt thành của anh chị em đã khích lệ phần đông trong số họ[c].'
  to: 'Vì tôi biết tinh thần sẵn sàng[a] của anh chị em, điều mà tôi tự hào nói với người Ma-xê-đô-ni-a về anh chị em: “A-chai[b] đã sẵn sàng từ năm ngoái đến nay”; và lòng nhiệt thành của anh chị em đã khích lệ phần đông trong số họ[c].'
  rationale: Sửa kết cấu trung tâm để phản ánh rõ Phao-lô tự hào nói với người Ma-xê-đô-ni-a về sự sẵn lòng của độc giả, thay vì tạo một mệnh đề Việt ngữ mơ hồ. Bổ sung “đến nay” để chuyển tải an toàn sắc thái trạng thái tiếp diễn của thì hoàn thành cùng cụm thời gian “từ năm ngoái.” Các địa danh, lối hoán dụ, đại từ, và các chú thích được giữ nguyên.
