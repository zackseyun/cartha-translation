reference: 2 Corinthians 9:10
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ δὲ ἐπιχορηγῶν ⸀σπόρον τῷ σπείροντι καὶ ἄρτον εἰς βρῶσιν ⸀χορηγήσει καὶ ⸀πληθυνεῖ τὸν σπόρον ὑμῶν καὶ ⸀αὐξήσει τὰ γενήματα τῆς δικαιοσύνης ὑμῶν·)
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/010.yaml
  text: The one who supplies seed to the sower and bread for food will supply and multiply your seed and increase the harvest of your righteousness[a][b].
translation:
  language: vi
  text: Đấng cung cấp hạt giống cho người gieo và bánh để ăn sẽ cung cấp và làm cho hạt giống của anh chị em sinh sôi, đồng thời gia tăng hoa lợi của sự công chính của anh chị em[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “gia tăng các thành quả hoặc sản vật của sự công chính của anh chị em.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “hoa lợi của công lý của anh chị em.” Từ Hy Lạp δικαιοσύνη có thể mang nghĩa “sự công chính” hoặc, trong một số ngữ cảnh, “công lý.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ δὲ ἐπιχορηγῶν
  choice: Đấng cung cấp
  rationale: Mạo từ cùng phân từ được chuyển thành danh xưng chỉ Đấng cung cấp, trong ngữ cảnh là Đức Chúa Trời. Không thêm từ chỉ thời gian như “bây giờ”; δέ chỉ có lực nối nhẹ và không nhất thiết phải biểu đạt riêng trong tiếng Việt.
- source_word: σπόρον τῷ σπείροντι
  choice: hạt giống cho người gieo
  rationale: Giữ nguyên hình ảnh nông nghiệp và chuyển phân từ chỉ người thành cách nói tự nhiên, súc tích.
- source_word: ἄρτον εἰς βρῶσιν
  choice: bánh làm thức ăn
  rationale: Diễn đạt mục đích của bánh, đồng thời duy trì sự phân biệt giữa hạt giống để gieo và bánh để ăn.
- source_word: χορηγήσει
  choice: sẽ cung cấp
  rationale: Giữ thì tương lai và liên hệ ngữ nghĩa với ἐπιχορηγῶν ở đầu câu.
- source_word: πληθυνεῖ τὸν σπόρον ὑμῶν
  choice: làm cho hạt giống của anh chị em sinh sôi
  rationale: “Sinh sôi” diễn đạt sự tăng thêm dồi dào một cách tự nhiên trong hình ảnh gieo trồng, không thu hẹp “hạt giống” chỉ vào tiền bạc hay lợi ích vật chất.
- source_word: αὐξήσει
  choice: gia tăng
  rationale: Phản ánh ý khiến tăng trưởng hoặc trở nên nhiều hơn, phù hợp với tân ngữ chỉ hoa lợi.
- source_word: τὰ γενήματα
  choice: hoa lợi
  rationale: Danh từ số nhiều chỉ sản vật hoặc kết quả sinh ra. “Hoa lợi” giữ hình ảnh nông nghiệp và có thể bao hàm các kết quả của hành động công chính.
- source_word: δικαιοσύνης ὑμῶν
  choice: sự công chính nơi anh chị em
  rationale: “Sự công chính” giữ thuật ngữ thần học rộng của δικαιοσύνη; “nơi anh chị em” giúp câu tiếng Việt tự nhiên hơn mà không xác định cứng quan hệ sở hữu hay nguồn phát sinh.
theological_decisions:
- issue: Ý nghĩa của “hoa lợi của sự công chính”
  choice: Giữ đây là hình ảnh về kết quả hoặc hoa trái liên quan đến sự công chính và lòng rộng rãi của tín hữu, không giới hạn vào sự đáp trả vật chất hay một địa vị pháp lý.
  alternative: Có thể hiểu là phước lành vật chất do lòng rộng rãi đem lại, thành quả của việc thực thi công lý, hoặc bằng chứng của nếp sống công chính.
  rationale: Ngữ cảnh nói về việc ban cho rộng rãi bằng hình ảnh gieo trồng. Cách dịch giữ độ rộng thần học của câu và không biến lời hứa thành một công thức thịnh vượng.
- issue: Phạm vi nghĩa của δικαιοσύνη
  choice: sự công chính
  alternative: công lý
  rationale: “Sự công chính” là cách tương ứng rộng và quen thuộc hơn trong ngôn ngữ Phao-lô, nhưng “công lý” vẫn là khả năng từ vựng chân thực nên được nêu trong chú thích.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh chị em” cho đại từ số nhiều ὑμῶν. Giữ chuỗi hình ảnh hạt giống—gieo—sinh sôi—hoa lợi, đồng thời tránh cách diễn đạt có thể bị hiểu như một lời bảo đảm về sự giàu có vật chất.
