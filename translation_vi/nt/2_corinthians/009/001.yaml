  text: Περὶ μὲν γὰρ τῆς διακονίας τῆς εἰς τοὺς ἁγίους περισσόν μοί ἐστιν τὸ γράφειν ὑμῖν,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/001.yaml
  text: For concerning the ministry to the saints[a], it is superfluous for me to write to you,
translation:
  language: vi
  text: Thật vậy, về công việc phục vụ các thánh đồ[a] thì tôi không cần phải viết cho anh chị em,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “cho các thánh đồ.” Giới từ Hy Lạp ở đây có thể chỉ hướng đến hoặc người được hưởng việc phục vụ này.
    reason: lexical_alternative
lexical_decisions:
- source_word: Περὶ μὲν γὰρ
  choice: Vả, về
  rationale: Περὶ nêu chủ đề, còn μὲν γὰρ liên kết với mạch văn trước và chuyển sang điểm liên quan. “Vả, về” giữ được sắc thái nối kết mà vẫn tự nhiên, trang trọng trong tiếng Việt.
- source_word: διακονίας
  choice: việc phục vụ
  rationale: διακονία ở đây chỉ công việc phục vụ thiết thực qua cuộc quyên góp. “Việc phục vụ” vừa giữ nghĩa rộng và phẩm giá của công việc này, vừa dễ hiểu hơn từ vay mượn mang tính chuyên biệt.
- source_word: τῆς εἰς τοὺς ἁγίους
  choice: các thánh đồ
  rationale: εἰς có thể chỉ hướng đến hoặc đối tượng thụ hưởng. Trong câu chính, cấu trúc “phục vụ các thánh đồ” tự nhiên trong tiếng Việt; chú thích bảo lưu khả năng hiểu là “cho các thánh đồ”.
- source_word: ἁγίους
  choice: các thánh đồ
  rationale: ἅγιοι là cách Phao-lô thường gọi những người thuộc về Đức Chúa Trời, tức những người được biệt riêng cho Ngài. “Các thánh đồ” là cách dịch ngắn gọn, quen thuộc và không đồng nhất từ này với một tầng lớp đặc biệt.
- source_word: περισσόν
  choice: không cần
  rationale: Trong ngữ cảnh này, περισσόν có nghĩa là thừa hoặc không cần thiết. “Không cần” diễn đạt tự nhiên sức mạnh tu từ của câu mà không tạo cảm giác cổ hoặc nặng nề.
- source_word: μοί ἐστιν τὸ γράφειν ὑμῖν
  choice: tôi không cần phải viết cho anh chị em
  rationale: Cấu trúc động từ nguyên mẫu có mạo từ được chuyển thành câu tiếng Việt tự nhiên, vẫn giữ người viết và người nhận. “Anh chị em” diễn đạt số nhiều ὑμῖν theo lối hiện đại, bao quát cộng đồng.
theological_decisions: []
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Giữ thuật ngữ “các thánh đồ” vì đây là cách gọi cộng đồng tín hữu trong thư Phao-lô; tránh cách diễn đạt khiến người đọc hiểu là một hạng tín hữu đặc biệt. Dấu phẩy cuối câu phản ánh câu còn tiếp trong văn mạch, nhưng bản dịch vẫn đọc tự nhiên như một câu trọn ý.
