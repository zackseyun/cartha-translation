  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: διὰ τῆς δοκιμῆς τῆς διακονίας ταύτης δοξάζοντες τὸν θεὸν ἐπὶ τῇ ὑποταγῇ τῆς ὁμολογίας ὑμῶν εἰς τὸ εὐαγγέλιον τοῦ Χριστοῦ καὶ ἁπλότητι τῆς κοινωνίας εἰς αὐτοὺς καὶ εἰς πάντας,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/013.yaml
  text: Because of the proof provided by this ministry[a], they glorify God for the obedience of your confession to the gospel of the Messiah and for the generosity of your sharing with them and with everyone[d][c][b],
translation:
  language: vi
  text: Do bằng chứng mà công việc phục vụ này đem lại, họ tôn vinh Đức Chúa Trời vì sự vâng phục đi liền với lời tuyên xưng của anh chị em về Tin Mừng của Đấng Mê-si[a], và vì sự rộng rãi trong việc anh chị em chia sẻ với họ và với mọi người[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “Tin Mừng của Đấng Christ.” Từ Hy Lạp Χριστός là một tước hiệu, có nghĩa là “Đấng Mê-si,” tức Đấng Được Xức Dầu.
    reason: alternative_reading
  - marker: b
    text: Cụm “sự vâng phục đi liền với lời tuyên xưng” dịch một cấu trúc Hy Lạp cô đọng, cũng có thể dịch sát hơn là “sự thuận phục của lời tuyên xưng của anh chị em.” “Sự chia sẻ” ở đây đặc biệt bao gồm việc rộng rãi tham gia đóng góp vật chất cho công cuộc cứu trợ, chứ không chỉ nói đến tình thân hữu nói chung.
    reason: lexical_alternative
lexical_decisions:
- source_word: δοκιμῆς
  choice: bằng chứng
  rationale: Trong ngữ cảnh, sự phục vụ cứu trợ là bằng chứng đã được chứng thực về đức tin và tình yêu của người Cô-rinh-tô; “bằng chứng” diễn đạt kết quả của việc thử nghiệm.
- source_word: διακονίας
  choice: sự phục vụ
  rationale: Chỉ công việc quyên góp và cứu trợ thiết thực; “sự phục vụ” tự nhiên trong tiếng Việt và không giới hạn từ này vào một chức vụ giáo hội.
- source_word: δοξάζοντες τὸν θεὸν
  choice: họ tôn vinh Đức Chúa Trời
  rationale: Chuyển phân từ thành mệnh đề hữu hạn để câu tiếng Việt rõ nghĩa, đồng thời giữ sắc thái mạnh của δοξάζω.
- source_word: ὑποταγῇ τῆς ὁμολογίας ὑμῶν
  choice: anh chị em vâng phục điều mình tuyên xưng
  rationale: Cách diễn đạt tự nhiên cho thấy sự vâng phục tương ứng với lời tuyên xưng, nhưng không tách hai ý vốn gắn chặt trong cấu trúc Hy Lạp.
- source_word: εἰς τὸ εὐαγγέλιον τοῦ Χριστοῦ
  choice: về Tin Mừng của Đấng Mê-si
  rationale: εἰς nêu đối tượng hoặc hướng quy chiếu của lời tuyên xưng; “về” phù hợp với cú pháp tiếng Việt. Χριστός được dịch như một tước hiệu.
- source_word: ἁπλότητι
  choice: lòng rộng rãi
  rationale: Trong bối cảnh cuộc quyên góp, từ này nói đến sự hào phóng, rộng tay hơn là chỉ sự chân thành hay đơn sơ.
- source_word: κοινωνίας
  choice: sự chia sẻ
  rationale: Giữ nghĩa tham dự và thông phần, đồng thời trong văn cảnh bao gồm sự đóng góp vật chất.
- source_word: εἰς αὐτοὺς καὶ εἰς πάντας
  choice: với họ cũng như với mọi người
  rationale: Diễn đạt tự nhiên hướng đến những người nhận sự chia sẻ, đồng thời giữ phạm vi mở rộng đến tất cả.
theological_decisions:
- issue: Cách dịch Χριστοῦ trong εὐαγγέλιον τοῦ Χριστοῦ
  choice: Tin Mừng của Đấng Mê-si
  alternative: Tin Mừng của Đấng Christ
  rationale: Χριστός ở đây mang chức năng tước hiệu; dịch nghĩa giúp giữ lực Mê-si của từ mà không thêm nội dung giáo phái.
- issue: Quan hệ giữa ὑποταγή và ὁμολογία
  choice: vâng phục điều mình tuyên xưng
  alternative: sự thuận phục trong lời tuyên xưng của anh chị em
  rationale: Bản dịch chính diễn đạt mối liên hệ khó trong nguyên văn theo lối Việt tự nhiên, nhưng chú thích bảo lưu cách dịch hình thức hơn và sự mơ hồ về quan hệ cú pháp.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “anh chị em” cho đại từ số nhiều ὑμῶν; giữ nhịp câu dài của Phao-lô nhưng làm rõ các quan hệ bằng cú pháp tiếng Việt tự nhiên.
