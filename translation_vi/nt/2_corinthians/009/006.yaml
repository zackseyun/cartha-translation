source:
  edition: SBLGNT
  text: Τοῦτο δέ, ὁ σπείρων φειδομένως φειδομένως καὶ θερίσει, καὶ ὁ σπείρων ἐπ’ εὐλογίαις ἐπ’ εὐλογίαις καὶ θερίσει.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/006.yaml
  text: 'This: the one who sows sparingly will also reap sparingly[a], and the one who sows with blessings will also reap with blessings.'
translation:
  language: vi
  text: 'Điều này: Người gieo dè sẻn cũng sẽ gặt dè sẻn; còn người gieo rộng rãi[a] cũng sẽ gặt rộng rãi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cụm từ Hy Lạp dịch sát là “trên/với các phước lành”; trong ngữ cảnh này, đây là một cách nói thành ngữ có thể chỉ việc gieo và gặt “rộng rãi” hoặc “hào phóng”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῦτο δέ
  choice: 'Điều này:'
  rationale: Dẫn vào một nguyên tắc được nhấn mạnh. Cách dịch này giữ đại từ chỉ định và chức năng chuyển ý của δέ mà không thêm ý thời gian.
- source_word: ὁ σπείρων
  choice: người gieo
  rationale: Phân từ có mạo từ được dùng theo nghĩa khái quát; “người gieo” giữ hình ảnh tục ngữ và cấu trúc song song.
- source_word: φειδομένως
  choice: cách dè sẻn
  rationale: Diễn tả mức độ hạn chế, ít ỏi trong bối cảnh ban cho. “Dè sẻn” tự nhiên trong tiếng Việt và không mạnh đến mức lên án như “keo kiệt”.
- source_word: καὶ θερίσει
  choice: cũng sẽ gặt
  rationale: Giữ quan hệ tương ứng giữa cách gieo và kết quả gặt, đồng thời duy trì nhịp song song.
- source_word: ἐπ’ εὐλογίαις
  choice: gieo phước lành … gặt phước lành
  rationale: Giữ danh từ “phước lành” và sự lặp lại của nguyên văn, nhưng diễn đạt tự nhiên hơn trong tiếng Việt so với “trong/với các phước lành”. Chú thích nêu nghĩa thành ngữ liên quan đến sự rộng rãi.
theological_decisions:
- issue: Ý nghĩa của ἐπ’ εὐλογίαις trong lời ví von gieo và gặt
  choice: Giữ ngôn ngữ “phước lành” trong cả hai vế.
  alternative: “một cách rộng rãi” hoặc “hào phóng”
  rationale: Ngữ cảnh nói về sự ban cho rộng rãi, nhưng danh từ Hy Lạp cũng mang âm hưởng “phước lành”. Giữ cách nói này bảo toàn lối chơi chữ và mối liên hệ thần học mà không biến câu thành lời bảo đảm máy móc về sự giàu có vật chất.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng dấu chấm phẩy để làm rõ hai vế tương ứng; giữ hình ảnh gieo–gặt và sự lặp lại có chủ ý của nguyên văn.
