  to: 'Điều này: Người gieo dè sẻn cũng sẽ gặt dè sẻn; còn người gieo rộng rãi[a] cũng sẽ gặt rộng rãi.'
  rationale: Sửa cách diễn đạt ἐπ’ εὐλογίαις thành «rộng rãi» để phản ánh chức năng trạng ngữ của cụm từ trong câu tục ngữ và tiếng Việt hiện đại. Chú thích bảo lưu nghĩa chữ «phước lành» cùng lựa chọn thay thế «hào phóng», nên không xóa bỏ độ vang từ vựng hay áp đặt một diễn giải thần học.
