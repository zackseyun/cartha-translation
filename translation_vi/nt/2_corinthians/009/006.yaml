    rationale: Cách nói này trong tiếng Việt thường có nghĩa là gieo/rải những phước lành. Nguyên văn dùng một cụm giới từ để chỉ cách thức hoặc mức độ; trong văn mạch, đó là sự gieo rộng rãi/hào phóng. Cần chuyển thành trạng ngữ và giải thích lựa chọn từ vựng trong chú thích.
