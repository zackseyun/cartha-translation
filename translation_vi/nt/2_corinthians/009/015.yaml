  text: ⸀χάρις τῷ θεῷ ἐπὶ τῇ ἀνεκδιηγήτῳ αὐτοῦ δωρεᾷ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/015.yaml
  text: Thanks be to God for his indescribable gift[a].
translation:
  language: vi
  text: Tạ ơn Đức Chúa Trời vì món quà không thể diễn tả hết của Ngài.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “món quà không sao nói hết được.” Tính từ Hy Lạp chỉ điều vượt quá khả năng thuật lại hoặc diễn tả đầy đủ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρις
  choice: Tạ ơn
  rationale: Trong cấu trúc cảm thán với τῷ θεῷ, χάρις diễn đạt sự cảm tạ hoặc ngợi khen, chứ không mang nghĩa thông thường là “ân điển”. “Tạ ơn Đức Chúa Trời” tự nhiên và giữ được sắc thái tôn vinh.
- source_word: τῷ θεῷ
  choice: Đức Chúa Trời
  rationale: Danh từ ở cách tặng chỉ Đấng nhận lời cảm tạ. Cụm “Tạ ơn Đức Chúa Trời” diễn đạt tự nhiên quan hệ này trong tiếng Việt.
- source_word: ἐπὶ
  choice: vì
  rationale: Với cách tặng ở đây, giới từ nêu căn cứ hoặc nguyên nhân của lời cảm tạ; “vì” ngắn gọn và rõ nghĩa.
- source_word: ἀνεκδιηγήτῳ
  choice: không thể diễn tả hết
  rationale: Tính từ chỉ điều không thể thuật lại hay diễn đạt đầy đủ. Cách dịch này giữ ý vượt quá khả năng diễn tả mà vẫn tự nhiên trong tiếng Việt hiện đại.
- source_word: αὐτοῦ
  choice: của Ngài
  rationale: Đại từ quy chiếu tự nhiên về Đức Chúa Trời. “Ngài” duy trì hình thức đại từ của tiếng Hy Lạp và phù hợp với văn phong trang trọng.
- source_word: δωρεᾷ
  choice: món quà
  rationale: δωρεά là quà được ban cho nhưng câu không cần thêm từ “miễn phí”; “món quà” là cách diễn đạt rõ ràng, tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Đối tượng cụ thể của “món quà không thể diễn tả hết của Ngài”
  choice: Giữ hàm ý chung là món quà của Đức Chúa Trời, không xác định cụ thể trong chính văn.
  alternative: Có thể hiểu là Đấng Christ, sự cứu rỗi/ân điển trong Đấng Christ, hoặc rộng hơn là sự ban cho đầy ân sủng của Đức Chúa Trời được thể hiện cả trong lòng rộng rãi của tín hữu.
  rationale: Câu Hy Lạp chỉ nói “món quà của Ngài”; dù Đấng Christ thường được xem là trọng tâm, văn cảnh gần cũng nói về ân điển Đức Chúa Trời sinh ra lòng rộng rãi. Không xác định thêm giúp bảo toàn độ mở và sức căng thần học của câu.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “Đức Chúa Trời” và đại từ tôn kính “Ngài”; cấu trúc cảm thán ngắn gọn giữ sắc thái kết thúc mang tính ngợi khen.
