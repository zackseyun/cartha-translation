reference: 2 Corinthians 9:8
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸀δυνατεῖ δὲ ὁ θεὸς πᾶσαν χάριν περισσεῦσαι εἰς ὑμᾶς, ἵνα ἐν παντὶ πάντοτε πᾶσαν αὐτάρκειαν ἔχοντες περισσεύητε εἰς πᾶν ἔργον ἀγαθόν·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/008.yaml
  text: And God is able to make all grace abound to you[a], so that in everything, at all times, having all sufficiency, you may abound in every good work.
translation:
  language: vi
  text: Và Đức Chúa Trời có thể làm cho mọi ân điển tuôn tràn đến với anh chị em, để trong mọi sự và vào mọi lúc, khi có đủ mọi điều cần dùng[a], anh chị em có thể dư dật trong mọi việc lành.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “có mọi sự đầy đủ” hoặc “có sự mãn nguyện trọn vẹn.” Từ Hy Lạp có thể chỉ sự đầy đủ, thích đáng hoặc mãn nguyện; trong mạch văn này, trọng tâm là có đủ điều cần dùng nhờ Đức Chúa Trời chu cấp, chứ không phải tự túc độc lập với Ngài.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δυνατεῖ
  choice: có thể
  rationale: Diễn đạt tự nhiên khả năng và quyền năng của Đức Chúa Trời, không làm tăng hay giảm sắc thái của động từ.
- source_word: δὲ
  choice: Và
  rationale: Ở đây δέ nối tiếp ý trước hơn là biểu thị sự tương phản mạnh.
- source_word: πᾶσαν χάριν
  choice: mọi ân điển
  rationale: Giữ phạm vi rộng của χάρις là sự ban cho bởi ân của Đức Chúa Trời, bao gồm sự chu cấp giúp tín hữu rộng lòng, nhưng không thu hẹp từ này thành tiền bạc hay vật chất.
- source_word: περισσεῦσαι
  choice: làm cho ... tuôn tràn
  rationale: Thể hiện sắc thái gây khiến và hình ảnh phong phú, dư dật của động từ περισσεύω.
- source_word: εἰς ὑμᾶς
  choice: đến với anh chị em
  rationale: Diễn đạt hướng của ân điển về phía những người nhận; “anh chị em” là cách xưng hô số nhiều tự nhiên và bao quát trong tiếng Việt.
- source_word: ἵνα
  choice: để
  rationale: Giữ quan hệ mục đích hoặc kết quả mà mệnh đề ἵνα có thể biểu thị trong ngữ cảnh.
- source_word: ἐν παντὶ πάντοτε
  choice: trong mọi sự và vào mọi lúc
  rationale: Giữ rõ hai yếu tố toàn diện và nhịp điệp từ παν- trong nguyên văn.
- source_word: πᾶσαν αὐτάρκειαν
  choice: đầy đủ mọi điều cần dùng
  rationale: Diễn đạt sự đầy đủ, thích đáng do Đức Chúa Trời chu cấp trong ngữ cảnh rộng lòng ban cho, tránh gợi ý sự tự túc độc lập với Ngài.
- source_word: ἔχοντες
  choice: khi có
  rationale: 'Giữ quan hệ đồng thời của phân từ: trong khi có sự đầy đủ, họ có thể dư dật trong việc lành.'
- source_word: περισσεύητε
  choice: anh chị em được dư dật
  rationale: Duy trì mô-típ dư dật tương ứng với περισσεῦσαι, đồng thời dùng thể diễn đạt phù hợp với việc sự đầy đủ đến từ Đức Chúa Trời.
- source_word: εἰς πᾶν ἔργον ἀγαθόν
  choice: trong mọi việc lành
  rationale: Phù hợp với cách kết hợp tự nhiên sau “dư dật” và giữ nghĩa mọi hành động tốt lành, có ích.
theological_decisions:
- issue: Ý nghĩa của χάρις trong bối cảnh rộng lòng ban cho
  choice: Ân điển là sự ban cho đầy ân của Đức Chúa Trời theo nghĩa rộng, bao gồm khả năng vật chất để rộng lòng
  alternative: Chỉ ân huệ; hoặc một món quà cụ thể
  rationale: Ngữ cảnh nói đến sự chu cấp cho việc ban cho, nhưng χάρις vẫn có phạm vi thần học rộng hơn tiền bạc; “mọi ân điển” bảo toàn chiều rộng đó.
- issue: Ý nghĩa của αὐτάρκεια
  choice: Sự đầy đủ, có đủ điều cần dùng nhờ Đức Chúa Trời chu cấp
  alternative: Sự mãn nguyện; hoặc khả năng tự túc, tự mãn độc lập
  rationale: Mạch văn quy sự chu cấp cho Đức Chúa Trời và hướng nó đến việc lành; vì vậy bản dịch tránh nhập vào câu quan niệm tự lực độc lập, đồng thời chú thích các sắc thái từ vựng có thể có.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Ân điển” giữ chiều rộng thần học của χάρις; “anh chị em” biểu đạt đại từ số nhiều bao quát. Các cụm “mọi sự,” “mọi lúc,” “mọi điều” và “mọi việc” duy trì lối nhấn mạnh dồn dập của nguyên văn.
