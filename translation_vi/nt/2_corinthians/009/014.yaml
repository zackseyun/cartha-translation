id: 2CO.9.14
reference: 2 Corinthians 9:14
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ αὐτῶν δεήσει ὑπὲρ ὑμῶν ἐπιποθούντων ὑμᾶς διὰ τὴν ὑπερβάλλουσαν χάριν τοῦ θεοῦ ἐφ’ ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/014.yaml
  text: and in their prayer for you[a], they long for you because of the surpassing grace of God upon you.
translation:
  language: vi
  text: và trong lời cầu nguyện của họ cho anh chị em[a], họ tha thiết mong mỏi anh chị em vì ân điển vượt bậc của Đức Chúa Trời ở trên anh chị em.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc dịch: “và qua lời khẩn cầu của họ cho anh chị em, trong khi họ tha thiết mong mỏi anh chị em.”'
    reason: Giữ cách diễn đạt sát hơn cấu trúc dative của δεήσει và phân từ ἐπιποθούντων, đồng thời nêu sắc thái «khẩn cầu» của δέησις.
lexical_decisions:
- source_word: δέησις
  choice: cầu nguyện
  rationale: Chỉ lời khẩn cầu hay cầu thay tha thiết. “Cầu nguyện” tự nhiên trong tiếng Việt hiện đại và trong ngữ cảnh này vẫn bao hàm ý cầu thay.
- source_word: αὐτῶν
  choice: họ
  rationale: Đại từ số nhiều chỉ những người nhận sự giúp đỡ; tiếng Việt diễn đạt tự nhiên cấu trúc sở hữu Hy Lạp bằng chủ ngữ “họ” trong mệnh đề được tháo gọn.
- source_word: ὑπὲρ ὑμῶν
  choice: cho anh chị em
  rationale: ὑπέρ với sở hữu cách trong ngữ cảnh cầu nguyện mang nghĩa “cho, thay cho”. “Anh chị em” thể hiện số nhiều và cách xưng hô cộng đồng.
- source_word: ἐπιποθούντων
  choice: họ tha thiết mong gặp
  rationale: Động từ diễn tả nỗi mong mỏi sâu đậm, đang tiếp diễn. Thêm “gặp” làm rõ cách nói tự nhiên trong tiếng Việt mà không biến ý này thành một học thuyết khác.
- source_word: διὰ
  choice: vì
  rationale: 'διά với đối cách ở đây nêu nguyên nhân: họ mong gặp các tín hữu Cô-rinh-tô vì ân điển của Đức Chúa Trời trên họ.'
- source_word: ὑπερβάλλουσαν
  choice: vượt trội
  rationale: Giữ ý vượt quá mức thông thường, phi thường, mà không thu hẹp thành riêng sự dư dật vật chất.
- source_word: χάριν
  choice: ân điển
  rationale: 'Giữ sức nặng thần học quen thuộc của χάρις trong Phao-lô: sự ưu ái và hành động ban ơn của Đức Chúa Trời.'
- source_word: ἐφ’ ὑμῖν
  choice: ở trên anh chị em
  rationale: Bảo tồn hình ảnh ân điển ở trên họ; cấu trúc này cũng không loại trừ sắc thái ân điển đang tác động nơi họ.
- source_word: καὶ
  choice: và
  rationale: Liên từ nối câu này với chuỗi ý của câu trước.
theological_decisions:
- issue: Quan hệ cú pháp giữa lời cầu nguyện và nỗi mong mỏi
  choice: 'Diễn đạt thành hai hành động liên hệ nhau: trong khi họ cầu nguyện cho các tín hữu Cô-rinh-tô, họ cũng tha thiết mong gặp họ.'
  alternative: 'Có thể dịch sát cấu trúc hơn: “và bởi lời khẩn cầu của họ cho anh chị em, trong khi họ mong mỏi anh chị em...”'
  rationale: Câu Hy Lạp cô đọng, với phân từ sở hữu cách ἐπιποθούντων liên hệ với αὐτῶν. Bản dịch tháo gọn để tiếng Việt rõ và tự nhiên, nhưng chú thích giữ lại khả năng hiểu lời cầu nguyện là phạm vi hoặc phương tiện bày tỏ nỗi mong mỏi.
- issue: Ý nghĩa của ân điển Đức Chúa Trời trên người Cô-rinh-tô
  choice: Không xác định ân điển chỉ là sự rộng rãi quyên góp; giữ cụm từ rộng “ân điển vượt trội của Đức Chúa Trời”.
  alternative: Có thể diễn giải là “ơn rộng rãi Đức Chúa Trời ban cho anh chị em”.
  rationale: Ngữ cảnh liên quan đến sự ban cho rộng rãi, nhưng χάρις vẫn có bề rộng thần học; bản văn không buộc người dịch thu hẹp nghĩa vào một biểu hiện duy nhất.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” cho đại từ số nhiều ὑμῶν/ὑμᾶς, “Đức Chúa Trời” và “ân điển” theo lối dùng Tin Lành Việt ngữ quen thuộc. Câu bắt đầu bằng “và” để giữ sự nối tiếp với câu trước.
