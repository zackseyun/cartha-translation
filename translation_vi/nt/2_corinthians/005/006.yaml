  to: Vì vậy, chúng tôi luôn vững lòng và biết rằng khi còn ở trong thân thể như ở nhà mình, chúng tôi ở xa Chúa[a].
  rationale: Bản sửa thay “xa cách Chúa” bằng “ở xa Chúa” để diễn đạt đúng hơn sự tương phản không gian-ẩn dụ của nguyên văn, không áp đặt ý về sự xa lìa thuộc linh. “Như ở nhà mình” làm phép ẩn dụ tự nhiên hơn trong tiếng Việt. Chú thích được điều chỉnh để lựa chọn thay thế “vắng mặt” có cách kết hợp tự nhiên hơn trong tiếng Việt.
  reviewer_model: gpt-5.6-terra
