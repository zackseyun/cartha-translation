  source_fidelity: Bản nháp truyền đạt đúng quan hệ suy luận của οὖν, sắc thái liên tục của Θαρροῦντες/πάντοτε, nhận thức xác định của εἰδότες, và sự đối ứng ẩn dụ giữa ἐνδημέω với ἐκδημέω. Tuy nhiên, “xa cách Chúa” trong tiếng Việt thường gợi sự cách biệt hay xa lánh về quan hệ/đạo đức, mạnh hơn phép ẩn dụ không gian về tình trạng chưa hiện diện với Chúa trong nguyên văn.
