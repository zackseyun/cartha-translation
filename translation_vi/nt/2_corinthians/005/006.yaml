source:
  edition: SBLGNT
  text: Θαρροῦντες οὖν πάντοτε καὶ εἰδότες ὅτι ἐνδημοῦντες ἐν τῷ σώματι ἐκδημοῦμεν ἀπὸ τοῦ κυρίου,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/006.yaml
  text: Therefore[a], we are always confident and know that while we are at home in the body, we are away from the Lord,
translation:
  language: vi
  text: Vì vậy, chúng tôi luôn vững lòng và biết rằng khi còn ở trong thân thể như ở nhà mình, chúng tôi ở xa Chúa[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “vắng mặt trước Chúa.” Động từ Hy Lạp ἐκδημοῦμεν đối ứng với hình ảnh “ở nhà” và có thể mang nghĩa “ở xa” hoặc “vắng mặt.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Θαρροῦντες
  choice: chúng tôi luôn vững lòng
  rationale: Phân từ hiện tại diễn tả trạng thái can đảm, tin tưởng liên tục; “vững lòng” tự nhiên, trang trọng và phù hợp với mạch văn.
- source_word: οὖν
  choice: Vì vậy
  rationale: Biểu thị kết luận suy ra từ lập luận trước đó, nên giữ rõ liên kết lô-gíc.
- source_word: πάντοτε
  choice: luôn
  rationale: Diễn đạt trực tiếp ý liên tục, mọi lúc.
- source_word: εἰδότες
  choice: và biết rằng
  rationale: Phân từ hoàn thành của οἶδα mang nghĩa hiện tại, chỉ nhận thức xác định; cấu trúc hữu hạn tự nhiên trong tiếng Việt.
- source_word: ἐνδημοῦντες ἐν τῷ σώματι
  choice: khi còn ở trong thân thể như ở nhà
  rationale: Giữ hình ảnh ἐνδημέω là ở tại quê nhà/nhà mình, đồng thời diễn đạt rõ tình trạng sống trong thân thể hiện nay.
- source_word: ἐκδημοῦμεν ἀπὸ τοῦ κυρίου
  choice: chúng tôi đang xa cách Chúa
  rationale: ἐκδημέω đối ứng với ἐνδημέω và chỉ tình trạng ở xa, vắng mặt; “đang xa cách” giữ thế tương phản không gian mà không thêm ý về sự lìa bỏ hoàn toàn.
theological_decisions:
- issue: Sự tương phản giữa đời sống trong thân thể và việc ở với Chúa
  choice: Giữ hình ảnh hiện đang ở trong thân thể như ở nhà, đồng thời đang xa cách Chúa.
  alternative: Diễn giải là hoàn toàn bị phân cách khỏi sự hiện diện của Chúa, hoặc nhập trước ngôn ngữ “lìa khỏi thân thể, ở với Chúa” của câu 8.
  rationale: Câu này nói đến việc chưa ở với Chúa theo nghĩa trọn vẹn, nhưng không khẳng định tín hữu hoàn toàn bị tách khỏi sự hiện diện nâng đỡ của Ngài. Bản dịch giữ nguyên sức căng thần học và không nhập ý từ câu sau.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. “Vững lòng” tránh sắc thái tự phụ của “tự tin”; cụm “như ở nhà” bảo tồn phép ẩn dụ và sự đối ứng của hai động từ Hy Lạp.
