  terminology: Giữ “Đức Chúa Trời” và “Thánh Linh” nhất quán với thanh ngữ Cơ Đốc tiếng Việt. Thay thuật ngữ chính và các phương án chú thích để phản ánh đúng trường nghĩa của ἀρραβών hơn, đồng thời không quyết định dứt khoát cách hiểu genitive τοῦ πνεύματος trong chính văn.
