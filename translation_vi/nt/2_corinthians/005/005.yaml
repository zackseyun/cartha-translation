id: 2CO.5.5
reference: 2 Corinthians 5:5
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ δὲ κατεργασάμενος ἡμᾶς εἰς αὐτὸ τοῦτο θεός, ⸀ὁ δοὺς ἡμῖν τὸν ἀρραβῶνα τοῦ πνεύματος.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/005.yaml
  text: The one who prepared us for this very thing is God[b][a], who gave us the down payment of the Spirit.
translation:
  language: vi
  text: Đấng đã chuẩn bị chúng ta cho chính điều này là Đức Chúa Trời, Đấng đã ban cho chúng ta khoản tiền đặt trước[a] của Thánh Linh.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “vật bảo chứng”, “khoản bảo đảm” hoặc “phần trả trước đầu tiên”.
    reason: lexical_alternative
  - marker: b
    text: Cụm này có thể hiểu là chính Thánh Linh là khoản tiền đặt trước, hoặc là Đức Chúa Trời đã ban một khoản bảo đảm cho điều Thánh Linh sẽ hoàn tất.
    reason: alternative_reading
lexical_decisions:
- source_word: κατεργασάμενος
  choice: đã chuẩn bị
  rationale: Trong ngữ cảnh các câu 1–4, động từ nói đến việc Đức Chúa Trời chủ ý làm cho tín hữu sẵn sàng hướng tới tình trạng tương lai vừa được nhắc đến. “Đã chuẩn bị” tự nhiên và giữ được ý hướng đến một mục đích.
- source_word: εἰς αὐτὸ τοῦτο
  choice: cho chính điều này
  rationale: Giữ sự nhấn mạnh của αὐτὸ τοῦτο và quy chiếu về thực tại vừa bàn đến, mà không diễn giải quá mức thành một mục đích cụ thể.
- source_word: θεός
  choice: Đức Chúa Trời
  rationale: 'Là chủ thể được xác định của mệnh đề: Đấng chuẩn bị chúng ta chính là Đức Chúa Trời.'
- source_word: δοὺς
  choice: Đấng đã ban
  rationale: Chuyển phân từ aorist thành mệnh đề quan hệ để câu tiếng Việt trang trọng, rõ ràng và tự nhiên.
- source_word: ἀρραβῶνα
  choice: khoản đặt cọc
  rationale: Giữ hình ảnh thương mại về một phần được trao trước, vừa bảo đảm vừa báo trước phần còn lại sẽ được hoàn tất.
- source_word: τοῦ πνεύματος
  choice: của Thánh Linh
  rationale: Giữ cấu trúc sở hữu/genitive của Hy Lạp, không quyết định ngay trong chính văn rằng Thánh Linh là khoản đặt cọc hay khoản đặt cọc là điều do Thánh Linh ban.
- source_word: δὲ
  choice: không dịch thành một từ nối riêng
  rationale: δέ chỉ đánh dấu bước chuyển nhẹ trong diễn ngôn. Trong tiếng Việt, mạch văn có thể truyền đạt chức năng này mà không cần thêm “nay”, “nhưng” hay “và”, vốn dễ tạo sắc thái không có trong câu.
theological_decisions:
- issue: Ý nghĩa của cụm “khoản đặt cọc của Thánh Linh”
  choice: Giữ nguyên dạng mơ hồ của cụm genitive trong chính văn; cách hiểu có khả năng cao là chính Thánh Linh được ban như khoản đặt cọc bảo đảm sự hoàn tất trong tương lai.
  alternative: Đức Chúa Trời ban một khoản bảo đảm về điều Thánh Linh sẽ hoàn tất, hoặc khoản bảo đảm ấy đến từ Thánh Linh.
  rationale: Cách dùng tương tự trong 2 Cô-rinh-tô 1:22 và Ê-phê-sô 1:13–14 ủng hộ ý rằng chính Thánh Linh là quà tặng bảo đảm cơ nghiệp tương lai. Tuy nhiên, hình thức Hy Lạp τοῦ πνεύματος không tự nó buộc phải giải nghĩa hoàn toàn như vậy, nên chính văn và chú thích bảo tồn độ mở.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “Đấng” để nối mệnh đề quan hệ nói về Đức Chúa Trời; dùng “khoản đặt cọc” nhằm giữ hình ảnh cụ thể của nguyên ngữ. Các dấu chú thích [a], [b] đều được đặt ngay sau cụm từ liên quan trong chính văn.
