  to: Đấng đã chuẩn bị chúng ta cho chính điều này là Đức Chúa Trời, Đấng đã ban cho chúng ta khoản tiền đặt trước[a] của Thánh Linh.[b]
  rationale: Bản sửa chỉ thay cách dịch ἀρραβών và điều chỉnh các phương án chú thích tương ứng. “Khoản tiền đặt trước” bảo toàn phép ẩn dụ thương mại của nguyên ngữ—một phần đã được ban trước, bảo đảm phần còn lại—mà tránh nghĩa hẹp, thường có thể hoàn lại, của “đặt cọc”. Cú pháp mơ hồ của “của Thánh Linh” được giữ nguyên; chú thích tiếp tục trình bày các khả năng mà không áp đặt một diễn giải giáo phái.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T19:25:36Z'
