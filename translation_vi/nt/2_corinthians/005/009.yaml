  - severity: low
    issue: Ký hiệu chú thích đang đặt ở cuối câu thay vì ngay sau cặp “ở nhà hay xa nhà.”
    rationale: Chú thích chỉ giải thích bổ ngữ ngầm của cặp phân từ này; đặt mỏ neo cạnh cụm sẽ rõ phạm vi chú thích hơn.
  revised_text: Vì vậy, dù ở nhà hay xa nhà[a], chúng tôi cũng lấy làm mục tiêu là đẹp lòng Ngài.
