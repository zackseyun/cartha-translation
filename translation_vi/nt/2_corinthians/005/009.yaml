source:
  edition: SBLGNT
  text: διὸ καὶ φιλοτιμούμεθα, εἴτε ἐνδημοῦντες εἴτε ἐκδημοῦντες, εὐάρεστοι αὐτῷ εἶναι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/009.yaml
  text: Therefore we also make it our ambition[a], whether at home or away, to be pleasing to him.
translation:
  language: vi
  text: Vì vậy, dù ở nhà hay xa nhà[a], chúng tôi cũng lấy làm mục tiêu là đẹp lòng Ngài.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Theo văn cảnh, có thể nói rõ hơn: “dù ở nhà trong thân thể hay xa khỏi thân thể.”'
    reason: Giải thích bổ ngữ được lược bỏ trong nguyên văn nhưng được văn cảnh câu 6–8 gợi rõ.
lexical_decisions:
- source_word: διὸ
  choice: Vì vậy
  rationale: Diễn tả kết luận rút ra từ phần trước về đời sống hiện tại trong thân thể và việc ở với Chúa; tự nhiên và trang trọng trong tiếng Việt hiện đại.
- source_word: καὶ
  choice: cũng
  rationale: Giữ sắc thái tiếp nối và bổ sung của mạch lập luận mà không nhấn quá mức.
- source_word: φιλοτιμούμεθα
  choice: quyết tâm
  rationale: Diễn đạt nỗ lực tha thiết và chủ ý theo đuổi một mục tiêu; tự nhiên hơn cách dịch sát chữ như “lấy làm tham vọng” trong tiếng Việt.
- source_word: εἴτε ἐνδημοῦντες εἴτε ἐκδημοῦντες
  choice: dù ở nhà hay xa nhà
  rationale: Giữ nguyên hình ảnh đối xứng và sự hàm súc của tiếng Hy Lạp; đối tượng được ngầm hiểu là thân thể được giải thích trong chú thích theo văn cảnh câu 6–8.
- source_word: εὐάρεστοι
  choice: đẹp lòng
  rationale: Cụm từ tiếng Việt quen thuộc để chỉ việc làm hài lòng hoặc được chấp nhận trước mặt Đức Chúa Trời, đồng thời giữ sắc thái quan hệ.
- source_word: αὐτῷ
  choice: Ngài
  rationale: Đại từ chỉ về Chúa trong văn cảnh. Viết hoa theo quy ước tiếng Việt nhằm thể hiện sự tôn kính, nhưng không thay đại từ bằng danh xưng không có trong câu.
- source_word: εἶναι
  choice: sống
  rationale: Trong cụm “sống đẹp lòng Ngài”, “sống” chuyển tải tự nhiên mục tiêu hiện hữu và cách sống được hàm trong εἶναι εὐάρεστοι; tránh câu tiếng Việt gượng “là đẹp lòng Ngài”.
theological_decisions:
- issue: Có nên nói rõ thành phần được ngầm hiểu sau “ở nhà” và “xa nhà” hay không
  choice: Giữ cách nói hàm súc “dù ở nhà hay xa nhà” trong chính văn
  alternative: “dù ở nhà trong thân thể hay xa khỏi thân thể”
  rationale: Văn cảnh gần cho thấy Phao-lô nói về việc ở trong hoặc lìa khỏi thân thể, nhưng chính câu này không nêu bổ ngữ. Giữ lối nói ngắn gọn bảo toàn hình thức và phần nào sự hàm nghĩa của nguyên văn; chú thích cung cấp cách hiểu theo văn cảnh.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Trật tự câu được điều chỉnh cho tự nhiên; cặp hình ảnh “ở nhà/xa nhà” được giữ lại. Dấu chú thích đặt sau toàn câu vì chú thích giải thích cụm đối lập trung tâm của câu.
