revisions:
- from: Vì vậy, dù ở nhà hay xa nhà, chúng tôi cũng quyết tâm sống đẹp lòng Ngài.[a]
  to: Vì vậy, dù ở nhà hay xa nhà[a], chúng tôi cũng lấy làm mục tiêu là đẹp lòng Ngài.
  rationale: Thay “quyết tâm sống đẹp lòng” bằng “lấy làm mục tiêu là đẹp lòng” để phản ánh sát hơn φιλοτιμούμεθα và εἶναι εὐάρεστοι, không thêm động từ “sống.” Giữ nguyên tính hàm súc của cặp “ở nhà/xa nhà” và giữ chú thích theo văn cảnh; chuyển mỏ neo chú thích đến đúng cụm được chú giải.
