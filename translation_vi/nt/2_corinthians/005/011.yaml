    rationale: θεῷ là dative, nhưng trong tiếng Việt «trước Đức Chúa Trời» diễn đạt tự nhiên tình trạng con người/chức vụ của Phao-lô đã hiển lộ công khai đối với Đức Chúa Trời. Cách này không hàm ý Đức Chúa Trời trước đó không biết.
