id: 2CO.5.11
reference: 2 Corinthians 5:11
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Εἰδότες οὖν τὸν φόβον τοῦ κυρίου ἀνθρώπους πείθομεν, θεῷ δὲ πεφανερώμεθα· ἐλπίζω δὲ καὶ ἐν ταῖς συνειδήσεσιν ὑμῶν πεφανερῶσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/011.yaml
  text: Therefore[a], knowing the fear of the Lord, we persuade people; but we have been made known to God[b], and I hope that we also have been made known in your consciences.
translation:
  language: vi
  text: Vì thế, biết sự kính sợ Chúa[a], chúng tôi thuyết phục người ta. Nhưng chúng tôi đã được tỏ rõ trước Đức Chúa Trời[b]; và tôi hy vọng rằng chúng tôi cũng đã được tỏ rõ trong lương tâm anh chị em.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cụm “sự kính sợ Chúa” cũng có thể được hiểu là lòng kính nể sâu xa trước Chúa, nhất là trong ánh sáng của ngai phán xét được nói đến ở câu trước.
    reason: lexical_alternative
  - marker: b
    text: Hay “chúng tôi đã được biết rõ trước mặt Đức Chúa Trời”; cùng động từ này được lặp lại ở cuối câu.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰδότες οὖν
  choice: Vì vậy, vì biết
  rationale: “Vì vậy” giữ quan hệ suy luận với câu trước; “vì biết” diễn đạt tự nhiên sắc thái nguyên nhân có thể có của phân từ, đồng thời không tách ý này khỏi động từ chính.
- source_word: τὸν φόβον τοῦ κυρίου
  choice: sự kính sợ Chúa
  rationale: “Kính sợ” là cách diễn đạt Kinh Thánh tự nhiên trong tiếng Việt, giữ cả yếu tố sợ hãi trước sự phán xét lẫn lòng tôn kính, thay vì thu hẹp thành “tôn kính” בלבד.
- source_word: ἀνθρώπους πείθομεν
  choice: chúng tôi thuyết phục người ta
  rationale: “Người ta” diễn đạt đối tượng con người theo nghĩa chung, không giới hạn giới tính; “thuyết phục” giữ lực trực tiếp của động từ hiện tại πείθομεν mà không làm yếu thành “cố thuyết phục”.
- source_word: θεῷ δὲ πεφανερώμεθα
  choice: Đối với Đức Chúa Trời, chúng tôi đã được tỏ rõ
  rationale: Giữ thể bị động và trạng thái kết quả của thì hoàn thành, đồng thời diễn đạt rằng con người thật và chức vụ của Phao-lô hoàn toàn hiển nhiên đối với Đức Chúa Trời.
- source_word: ἐλπίζω
  choice: tôi hy vọng
  rationale: Giữ lời bày tỏ kỳ vọng mang tính cá nhân và khiêm nhường của Phao-lô.
- source_word: ἐν ταῖς συνειδήσεσιν ὑμῶν
  choice: trong lương tâm anh chị em
  rationale: “Lương tâm” là từ tương đương tự nhiên; tiếng Việt không cần đánh dấu số nhiều trên danh từ, còn “anh chị em” thể hiện cộng đồng độc giả gồm nhiều người.
- source_word: πεφανερῶσθαι
  choice: đã được tỏ rõ
  rationale: Lặp lại cùng cách dịch của πεφανερώμεθα để bảo toàn liên kết tu từ, đồng thời phản ánh thể bị động và ý nghĩa kết quả còn hiệu lực của thì hoàn thành.
theological_decisions:
- issue: Ý nghĩa của “sự kính sợ Chúa” trong văn cảnh
  choice: Giữ “kính sợ”, bao hàm cả nỗi sợ có trách nhiệm và lòng tôn kính.
  alternative: lòng tôn kính đối với Chúa
  rationale: Ngai phán xét trong câu 10 khiến từ φόβος có sức nặng hơn sự tôn kính đơn thuần; “kính sợ” không loại bỏ mặt nào của ý nghĩa.
- issue: Sắc thái của φανερόω đối với Đức Chúa Trời và lương tâm người Cô-rinh-tô
  choice: Dịch nhất quán là “được tỏ rõ”.
  alternative: được biết rõ; được bày tỏ; được phơi bày
  rationale: “Được tỏ rõ” giữ thể bị động, sự công khai/hiển nhiên và trạng thái kết quả mà không ngụ ý rằng trước đó Đức Chúa Trời thiếu hiểu biết.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dấu chấm được dùng sau mệnh đề đầu để tránh câu tiếng Việt quá nặng, nhưng liên kết lập luận vẫn được giữ bằng “Vì vậy” và mệnh đề tiếp nối. “Anh chị em” diễn đạt tự nhiên đại từ số nhiều chỉ cộng đồng tín hữu.
