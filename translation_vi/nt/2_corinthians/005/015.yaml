reference: 2 Corinthians 5:15
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ὑπὲρ πάντων ἀπέθανεν ἵνα οἱ ζῶντες μηκέτι ἑαυτοῖς ζῶσιν ἀλλὰ τῷ ὑπὲρ αὐτῶν ἀποθανόντι καὶ ἐγερθέντι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/015.yaml
  text: And he died for all[a], so that those who live might no longer live for themselves[b], but for the one who died and was raised for them.
translation:
  language: vi
  text: Ngài đã chết vì mọi người[a], để những người đang sống không còn sống cho chính mình nữa, nhưng sống cho Đấng đã chết vì họ và đã được phục sinh[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể hiểu: “thay mặt mọi người” hoặc “vì lợi ích của mọi người.” Giới từ Hy Lạp ὑπέρ mang sắc thái đại diện hoặc đem lại lợi ích; điều này cũng áp dụng cho cụm “vì họ” ở cuối câu.'
    reason: lexical_alternative
  - marker: b
    text: Nguyên ngữ dùng thể bị động, nghĩa là “đã được phục sinh”; tiếng Việt cũng thường diễn đạt là “đã sống lại.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπὲρ πάντων
  choice: vì mọi người
  rationale: Ὑπέρ với sở hữu cách diễn tả hành động vì lợi ích hoặc thay mặt người khác. “Vì mọi người” tự nhiên trong tiếng Việt, giữ được phạm vi rộng của πάντων mà không áp đặt một lý thuyết chuộc tội cụ thể.
- source_word: ἀπέθανεν
  choice: Ngài đã chết
  rationale: Thì aorist chỉ sự kiện đã xảy ra; chủ ngữ được xác định từ văn cảnh là Đấng Christ. “Ngài” phù hợp với văn phong tôn kính và tự nhiên.
- source_word: ἵνα
  choice: để
  rationale: Diễn đạt mục đích hoặc kết quả được nhắm đến, ngắn gọn và tự nhiên trong tiếng Việt hiện đại.
- source_word: οἱ ζῶντες
  choice: những người sống
  rationale: Phân từ hiện tại được dùng như danh từ để chỉ những người đang sống theo ý nghĩa của văn cảnh. Cách dịch này không tự ý giới hạn ý nghĩa vào sự sống thể chất hay thuộc linh.
- source_word: μηκέτι ἑαυτοῖς ζῶσιν
  choice: không còn sống cho chính mình nữa
  rationale: Μηκέτι diễn tả sự chấm dứt một lối sống trước đó; sở dữ cách phản thân với ζάω chỉ hướng sống hoặc đối tượng mà đời sống phục vụ.
- source_word: ἀλλὰ τῷ ... ἀποθανόντι καὶ ἐγερθέντι
  choice: nhưng sống cho Đấng đã chết ... và đã được làm cho sống lại
  rationale: Bổ sung lại động từ “sống” để quan hệ đối lập rõ ràng trong tiếng Việt. “Đấng” giữ sắc thái tôn kính; cách diễn đạt bị động phản ánh đúng hình thái của ἐγερθέντι.
- source_word: ὑπὲρ αὐτῶν
  choice: vì họ
  rationale: Giữ cùng cách dịch của ὑπέρ ở đầu câu, đồng thời diễn đạt tự nhiên rằng cái chết ấy nhằm lợi ích hoặc thay mặt họ.
- source_word: ἐγερθέντι
  choice: đã được làm cho sống lại
  rationale: Giữ thể bị động của nguyên ngữ và hàm ý hành động phục sinh được thực hiện trên Đấng Christ, thay vì đổi thành thể chủ động “đã sống lại”.
theological_decisions:
- issue: Phạm vi của πάντων và αὐτῶν
  choice: Dịch trực tiếp là “mọi người” và “họ”, không thu hẹp đối tượng.
  alternative: Hiểu “mọi người” theo nghĩa tuyệt đối là toàn thể nhân loại, hoặc theo nghĩa những người được Đấng Christ đại diện trong văn cảnh.
  rationale: Chính câu này dùng ngôn ngữ có phạm vi rộng nhưng không giải quyết đầy đủ các tranh luận thần học về phạm vi của sự chuộc tội; bản dịch giữ nguyên sức căng ấy.
- issue: Ý nghĩa của ὑπέρ
  choice: Dịch là “vì”, kèm chú thích về sắc thái lợi ích và đại diện.
  alternative: “thay cho” hoặc “thay mặt”
  rationale: “Thay cho” có thể xác định quá mức sắc thái thay thế, trong khi ὑπέρ ở đây chắc chắn bao hàm lợi ích hoặc đại diện nhưng không tự nó buộc phải diễn đạt trọn một mô hình chuộc tội.
- issue: Thể của ἐγερθέντι
  choice: 'Giữ thể bị động: “đã được làm cho sống lại”.'
  alternative: “đã sống lại”
  rationale: Thể bị động phản ánh sát nguyên ngữ và giữ hàm ý phổ biến trong Tân Ước rằng Đức Chúa Trời là tác nhân làm cho Đấng Christ sống lại, nhưng không phủ nhận cách nói chủ động ở những văn cảnh khác.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu giữ cấu trúc đối lập “không còn ... nhưng ...”, lặp lại “sống” để rõ nghĩa trong tiếng Việt. Không thu hẹp “mọi người” và không biến ὑπέρ thành một khẳng định giáo phái cụ thể.
