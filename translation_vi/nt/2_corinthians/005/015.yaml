  terminology: “Ngài” và “Đấng” phù hợp với văn phong Kinh Thánh trang trọng. “Được phục sinh” giữ được sắc thái bị động của nguyên ngữ mà không thêm tác nhân vốn không được nêu minh thị trong câu. Không cần chú thích thêm về phạm vi của “mọi người” ngoài chú thích từ vựng cho ὑπέρ.
