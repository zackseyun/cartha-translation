id: 2CO.5.1
reference: 2 Corinthians 5:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Οἴδαμεν γὰρ ὅτι ἐὰν ἡ ἐπίγειος ἡμῶν οἰκία τοῦ σκήνους καταλυθῇ, οἰκοδομὴν ἐκ θεοῦ ἔχομεν οἰκίαν ἀχειροποίητον αἰώνιον ἐν τοῖς οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/001.yaml
  text: For we know that if our earthly tent-house is torn down[a], we have a building from God, a house not made with hands[d][c][b], eternal in the heavens.
translation:
  language: vi
  text: Vì chúng ta biết rằng nếu ngôi nhà trần thế của chúng ta, tức là chiếc lều, bị tháo dỡ[a], thì chúng ta có một công trình đến từ Đức Chúa Trời, một ngôi nhà không do tay người làm nên[b], vĩnh cửu trong các tầng trời[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “bị phá hủy” hoặc “bị dỡ xuống.” Động từ Hy Lạp có thể chỉ việc tháo dỡ một công trình, rất phù hợp với hình ảnh chiếc lều.
    reason: lexical_alternative
  - marker: b
    text: Nghĩa đen là “không do tay làm nên”; cách nói này nhấn mạnh rằng ngôi nhà ấy đến từ Đức Chúa Trời, chứ không phải do con người tạo ra.
    reason: lexical_alternative
  - marker: c
    text: Tiếng Hy Lạp dùng “chúng ta có,” không phải “chúng ta sẽ có,” qua đó giữ lại sự căng thẳng giữa sự sở hữu hiện tại và sự thành tựu trong tương lai. “Các tầng trời” cũng phản ánh dạng số nhiều trong nguyên văn.
    reason: alternative_reading
lexical_decisions:
- source_word: Οἴδαμεν
  choice: chúng ta biết
  rationale: Diễn đạt tự nhiên ý về sự hiểu biết xác tín của οἶδα, không làm yếu thành chỉ nhận biết hay ý thức.
- source_word: γὰρ
  choice: Vì
  rationale: Giữ chức năng giải thích hoặc nêu căn cứ của γάρ trong mạch lập luận trước đó.
- source_word: ἐὰν ... καταλυθῇ
  choice: nếu ... bị tháo dỡ
  rationale: Giữ sắc thái điều kiện hướng tới tương lai và hình ảnh tháo một căn lều; đồng thời từ này cũng có thể mang nghĩa bị phá hủy.
- source_word: ἡ ἐπίγειος ἡμῶν οἰκία τοῦ σκήνους
  choice: ngôi nhà trần thế của chúng ta, là chiếc lều này
  rationale: Bảo tồn cả hai hình ảnh οἰκία là nhà và σκῆνος là lều, thay vì diễn giải trực tiếp thành thân thể. Cách đặt đồng vị này tự nhiên hơn trong tiếng Việt so với một từ ghép gượng ép.
- source_word: οἰκοδομὴν ἐκ θεοῦ
  choice: một công trình đến từ Đức Chúa Trời
  rationale: Hiểu οἰκοδομή theo nghĩa cụ thể là một công trình hoặc kiến trúc, còn ἐκ θεοῦ chỉ nguồn gốc từ Đức Chúa Trời.
- source_word: ἔχομεν
  choice: chúng ta có
  rationale: Giữ nguyên thì hiện tại của tiếng Hy Lạp, không chuyển thành 'sẽ có' và vì thế không giải quyết thay người đọc sự căng thẳng giữa sự sở hữu hiện tại với sự thành tựu tương lai.
- source_word: οἰκίαν ἀχειροποίητον
  choice: một ngôi nhà không do tay người làm nên
  rationale: Giữ hình ảnh 'nhà' và âm hưởng Kinh Thánh của ἀχειροποίητος, nhấn mạnh nguồn gốc không thuộc công việc của con người.
- source_word: αἰώνιον
  choice: vĩnh cửu
  rationale: Diễn đạt rõ sự bền vững không cùng, tương phản với chỗ ở trần thế tạm thời.
- source_word: ἐν τοῖς οὐρανοῖς
  choice: ở trên các tầng trời
  rationale: Phản ánh dạng số nhiều οὐρανοῖς bằng một cách nói trang trọng, dễ hiểu trong tiếng Việt và không thu hẹp thành số ít.
theological_decisions:
- issue: Đối tượng được chỉ đến bởi hình ảnh nhà và lều
  choice: Giữ nguyên các hình ảnh kiến trúc và lều trong chính văn.
  alternative: Diễn giải trực tiếp là 'thân thể trần thế của chúng ta'.
  rationale: Câu Hy Lạp chủ ý xếp chồng các hình ảnh nhà, lều, công trình và nhà không do tay người làm. Thay chúng bằng 'thân thể' sẽ thu hẹp hình ảnh và đưa cách giải thích vào chính văn.
- issue: Giá trị thời gian của ἔχομεν
  choice: 'Dịch ở thì hiện tại: ''chúng ta có''.'
  alternative: 'Dịch hướng về tương lai: ''chúng ta sẽ có''.'
  rationale: Động từ Hy Lạp ở thì hiện tại. Cách dịch giữ lại sự căng thẳng thần học giữa sự sở hữu hiện tại và việc hiện thực hóa trong tương lai, thay vì ngầm quyết định theo một cách hiểu.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “Đức Chúa Trời” cho θεός; giữ các hình ảnh cụ thể của nguyên văn và tránh diễn giải giáo phái. Dấu phẩy quanh cụm đồng vị giúp câu tự nhiên mà vẫn bảo tồn quan hệ giữa “ngôi nhà” và “chiếc lều”.
