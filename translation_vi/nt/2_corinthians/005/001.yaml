revisions:
- from: Vì chúng ta biết rằng nếu ngôi nhà trần thế của chúng ta, là chiếc lều này, bị tháo dỡ[a], thì chúng ta có một công trình đến từ Đức Chúa Trời, một ngôi nhà không do tay người làm nên[b], vĩnh cửu ở trên các tầng trời[c].
  to: Vì chúng ta biết rằng nếu ngôi nhà trần thế của chúng ta, tức là chiếc lều, bị tháo dỡ[a], thì chúng ta có một công trình đến từ Đức Chúa Trời, một ngôi nhà không do tay người làm nên[b], vĩnh cửu trong các tầng trời[c].
  rationale: Bản sửa loại bỏ yếu tố chỉ định không có trong tiếng Hy Lạp, dùng “trong” để phản ánh ἐν, và thay thuật ngữ không tự nhiên trong chú thích. Các hình ảnh nhà, lều, công trình và nhà không do tay người làm nên, cũng như thì hiện tại của “có,” được giữ nguyên.
