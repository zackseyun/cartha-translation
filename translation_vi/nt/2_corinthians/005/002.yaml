  source_fidelity: 'Bản nháp bảo toàn đúng các thành tố chính: tính mơ hồ của ἐν τούτῳ, động từ στενάζομεν, hình ảnh chồng lấp nơi ở/y phục, và nguồn gốc “từ trời”. Tuy nhiên, “Thật vậy” không chuyển tải liên từ giải thích καὶ γάρ; cần có “Vì” (hoặc tương đương) để nối với câu trước. “Mong được khoác lên mình” cũng có thể làm mờ sắc thái trung động của ἐπενδύσασθαι, vốn diễn tả chủ thể mong tự khoác/mặc vào.'
  naturalness: “Trong điều này” có chủ ý sát nghĩa và được chú thích nên có thể chấp nhận, dù không phải cách nói khẩu ngữ. “Vì quả thật” là cách nối câu tự nhiên, trang trọng. Bỏ “được” sau “mong” làm rõ cấu trúc chủ động-trung động của hình ảnh “khoác lên mình” mà vẫn giữ văn phong hiện đại.
