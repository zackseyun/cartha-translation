  to: Vì quả thật, trong điều này[a] chúng ta rên xiết, tha thiết mong khoác lên mình nơi ở của chúng ta từ trời[b].
  rationale: Bản sửa thêm “Vì” để phản ánh chức năng giải thích của καὶ γάρ, và dùng “mong khoác lên mình” để giữ rõ hơn sắc thái trung động của ἐπενδύσασθαι. Các lựa chọn còn lại cùng hệ thống chú thích được giữ vì trung thành với bản Hy Lạp, tự nhiên ở mức phù hợp với văn phong Kinh Thánh hiện đại, và không giải quyết thay độc giả ẩn dụ thần học của câu.
