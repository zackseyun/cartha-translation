  text: καὶ γὰρ ἐν τούτῳ στενάζομεν, τὸ οἰκητήριον ἡμῶν τὸ ἐξ οὐρανοῦ ἐπενδύσασθαι ἐπιποθοῦντες,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/002.yaml
  text: For indeed in this we groan[a], longing to put on our dwelling from heaven[b],
translation:
  language: vi
  text: Vì quả thật, trong điều này[a] chúng ta rên xiết, tha thiết mong khoác lên mình nơi ở của chúng ta từ trời[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể hiểu là “trong thân lều này” hoặc “vì điều này”. Tiếng Hy Lạp chỉ nói sát nghĩa là “trong điều này”, không nêu rõ đối tượng.
    reason: ambiguity
  - marker: b
    text: Cụm Hy Lạp nói sát nghĩa là “nơi ở của chúng ta từ trời”, nhấn mạnh nguồn gốc. Động từ “khoác lên mình” cũng có thể mang nghĩa mặc thêm một lớp áo bên ngoài.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: Thật vậy
  rationale: Cụm từ mang tính giải thích và nhấn nhẹ, nối câu này với ý trước; “Thật vậy” tự nhiên trong tiếng Việt và giữ được lực nhấn ấy.
- source_word: ἐν τούτῳ
  choice: trong điều này
  rationale: Giữ đại từ chỉ định ở dạng không xác định rõ, thay vì tự ý thêm “lều” hay diễn giải thành “trong thân thể này”.
- source_word: στενάζομεν
  choice: chúng ta rên xiết
  rationale: “Rên xiết” diễn đạt sức nặng nội tâm và nỗi khát khao, mạnh hơn “thở dài” nhưng không thêm ý than khóc.
- source_word: τὸ οἰκητήριον ἡμῶν τὸ ἐξ οὐρανοῦ
  choice: nơi ở của chúng ta đến từ trời
  rationale: “Nơi ở” giữ hình ảnh cụ thể của οἰκητήριον, còn “đến từ trời” bảo toàn ý chỉ nguồn gốc của ἐξ οὐρανοῦ, không chuyển thành một phẩm tính chung chung như “nơi ở thiên thượng”.
- source_word: ἐπενδύσασθαι
  choice: được khoác lên mình
  rationale: Cách nói này giữ hình ảnh mặc áo và có thể gợi ý khoác thêm bên ngoài; từ “được” giúp câu tiếng Việt tự nhiên trong quan hệ với điều được mong đợi mà không biến động từ thành thể thụ động về nghĩa.
- source_word: ἐπιποθοῦντες
  choice: tha thiết mong
  rationale: Diễn đạt cường độ mạnh và kéo dài của sự khao khát, đồng thời kết hợp tự nhiên với “rên xiết” trong tiếng Việt.
theological_decisions:
- issue: Bản chất của hình ảnh nơi ở và y phục đến từ trời
  choice: Giữ đồng thời hai hình ảnh “nơi ở” và “khoác lên mình”, không xác định cụ thể đó là thân thể phục sinh, trạng thái trung gian hay một nơi ở cánh chung theo nghĩa hẹp.
  alternative: Diễn giải trực tiếp thành “thân thể phục sinh từ trời” hoặc “ngôi nhà trên trời”.
  rationale: Bản văn Hy Lạp chủ ý đặt chồng hai ẩn dụ và tại câu này chưa giải quyết trọn vẹn quan hệ giữa chúng; bản dịch cần giữ nguyên sức căng thần học đó.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. “Rên xiết” giữ sắc thái mạnh của động từ Hy Lạp; “nơi ở… đến từ trời” hơi khác khẩu ngữ thông thường nhưng cần thiết để bảo toàn hình ảnh và ý chỉ nguồn gốc.
