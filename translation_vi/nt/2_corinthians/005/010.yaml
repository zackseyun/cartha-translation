  to: Vì tất cả chúng ta đều phải được phơi bày trước tòa phán xét của Đấng Mê-si[a], để mỗi người nhận lại điều tương xứng với những việc mình đã làm qua thân thể[b], dù là tốt hay xấu.
  rationale: Đổi “trong thân thể” thành “qua thân thể” để phản ánh trực tiếp hơn διά τοῦ σώματος, nhưng vẫn bảo tồn sự dè dặt cần thiết đối với cụm từ Hy Lạp cô đọng bằng chú thích nêu cách hiểu thay thế. Các yếu tố còn lại đã trung thành với nguồn và tự nhiên trong tiếng Việt.
  reviewer_model: gpt-5.6-terra
