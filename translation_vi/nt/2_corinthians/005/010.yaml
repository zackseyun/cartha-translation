id: 2CO.5.10
reference: 2 Corinthians 5:10
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τοὺς γὰρ πάντας ἡμᾶς φανερωθῆναι δεῖ ἔμπροσθεν τοῦ βήματος τοῦ Χριστοῦ, ἵνα κομίσηται ἕκαστος τὰ διὰ τοῦ σώματος πρὸς ἃ ἔπραξεν, εἴτε ἀγαθὸν εἴτε ⸀φαῦλον.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/010.yaml
  text: For we all must be revealed before the judgment seat of Messiah[a], so that each one may receive what is due for what he has done in the body[d][c][b], whether good or bad.
translation:
  language: vi
  text: Vì tất cả chúng ta đều phải được phơi bày trước tòa phán xét của Đấng Mê-si[a], để mỗi người nhận lại điều tương xứng với những việc mình đã làm qua thân thể[b], dù là tốt hay xấu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “xuất hiện trước tòa phán xét của Đấng Mê-si.” Động từ Hy Lạp có thể chỉ việc xuất hiện hoặc việc bị làm cho lộ rõ; bản chính giữ sắc thái mạnh hơn là bị phơi bày.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “những việc mình đã làm trong thân thể.” Cụm từ Hy Lạp cô đọng; “qua thân thể” giữ sắc thái thân thể là phương tiện hành động, còn “trong thân thể” hiểu theo đời sống có thân thể.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φανερωθῆναι
  choice: được phơi bày
  rationale: Động từ nguyên mẫu thụ động diễn tả việc được làm cho lộ rõ, không chỉ đơn thuần là có mặt; cách dịch này giữ sắc thái bộc lộ công khai trong bối cảnh xét xử.
- source_word: βήματος
  choice: tòa phán xét
  rationale: βῆμα ở đây chỉ bục hay ghế xét xử gắn với việc thẩm định; “tòa phán xét” tự nhiên trong tiếng Việt và giữ rõ bối cảnh pháp đình.
- source_word: Χριστοῦ
  choice: của Đấng Mê-si
  rationale: Χριστός ở đây mang chức năng tước hiệu; “Đấng Mê-si” diễn đạt trực tiếp ý nghĩa của tước hiệu mà không biến nó thành tên riêng thuần túy.
- source_word: κομίσηται
  choice: nhận lại điều tương xứng
  rationale: Thể trung gian trong ngữ cảnh mang ý nhận lại theo điều mình đã làm; “điều tương xứng” thể hiện tính báo ứng mà không xác định trước đó là thưởng hay phạt.
- source_word: τὰ διὰ τοῦ σώματος πρὸς ἃ ἔπραξεν
  choice: điều tương xứng với những gì mình đã làm trong thân thể
  rationale: Câu Hy Lạp cô đọng và có thể hiểu διά theo tính phương tiện (“qua thân thể”) hoặc theo đời sống trong thân thể. Bản chính dùng lối nói tự nhiên trong tiếng Việt, đồng thời giữ trách nhiệm cá nhân của ἔπραξεν.
- source_word: ἕκαστος
  choice: mỗi người
  rationale: Giữ lực phân phối của số ít, nhấn mạnh trách nhiệm của từng cá nhân.
- source_word: ἀγαθὸν ... φαῦλον
  choice: tốt hay xấu
  rationale: Giữ sự đối lập luân lý rộng của hai từ; “xấu” không đẩy φαῦλον đến sắc thái mạnh hơn là “gian ác”.
theological_decisions:
- issue: Bản chất và phạm vi của sự thẩm định trước Đấng Mê-si
  choice: Giữ ngôn ngữ phổ quát về việc mọi người bị phơi bày và từng người nhận điều tương xứng, nhưng không xác định đây chỉ là sự xét thưởng tín hữu hay là sự phán xét chung cuộc của toàn nhân loại.
  alternative: Hiểu đây là tòa xét thưởng dành riêng cho tín hữu, hoặc là cuộc phán xét cuối cùng dành cho mọi người.
  rationale: Chính câu này xác nhận tính phổ quát của việc bị phơi bày và trách nhiệm cá nhân, nhưng không tự giải quyết các phân biệt thần học hệ thống về đối tượng hay kết quả của sự phán xét.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “chúng ta”, “mỗi người”, “mình” để giữ tính bao quát và trách nhiệm cá nhân; tránh đại từ mặc định giống đực. “Đấng Mê-si” được dùng như một tước hiệu. Câu văn giữ sự nghiêm trọng của bối cảnh pháp đình nhưng không đưa thêm kết luận giáo phái.
