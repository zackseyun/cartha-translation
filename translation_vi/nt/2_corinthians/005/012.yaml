id: 2CO.5.12
reference: 2 Corinthians 5:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸀οὐ πάλιν ἑαυτοὺς συνιστάνομεν ὑμῖν, ἀλλὰ ἀφορμὴν διδόντες ὑμῖν καυχήματος ὑπὲρ ἡμῶν, ἵνα ἔχητε πρὸς τοὺς ἐν προσώπῳ καυχωμένους καὶ ⸂μὴ ἐν⸃ καρδίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/012.yaml
  text: We are not commending ourselves to you again[a], but giving you an opportunity to boast about us[b], so that you may have an answer for those who boast in outward appearance and not in heart.
translation:
  language: vi
  text: Chúng tôi không tự tiến cử mình với anh chị em một lần nữa, nhưng cho anh chị em cơ hội để tự hào về chúng tôi[a], để anh chị em có lời đáp lại những kẻ tự hào về vẻ bề ngoài chứ không về tấm lòng[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể hiểu: “tự hào thay mặt chúng tôi.”'
    reason: lexical_alternative
  - marker: b
    text: 'Theo nghĩa đen: “những kẻ tự hào nơi gương mặt chứ không nơi tấm lòng”; tức là tự hào về điều bề ngoài thay vì thực tại bên trong.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συνιστάνομεν
  choice: tiến cử
  rationale: Trong văn cảnh này, động từ chỉ việc giới thiệu hoặc xác nhận tư cách của một người. “Tự tiến cử mình” diễn đạt tự nhiên ý tự đề cao hay tự chứng nhận mà Phao-lô phủ nhận.
- source_word: ἀφορμὴν
  choice: cơ hội
  rationale: Từ này có thể chỉ dịp, cơ hội hoặc cơ sở để hành động. “Cho ... cơ hội” vừa tự nhiên trong tiếng Việt vừa giữ được cấu trúc Phao-lô đang cung cấp điều để người Cô-rinh-tô có thể đáp lại.
- source_word: καυχήματος / καυχωμένους
  choice: tự hào
  rationale: Dùng cùng một cách diễn đạt ở cả hai vị trí để giữ liên kết tu từ của nguyên văn. “Tự hào” có thể mang sắc thái chính đáng hoặc phô trương tùy ngữ cảnh, nên không áp đặt sắc thái tiêu cực lên lần xuất hiện đầu.
- source_word: ὑπὲρ ἡμῶν
  choice: về chúng tôi
  rationale: Cụm này có thể mang nghĩa nói về hoặc đứng về phía ai. “Về chúng tôi” phù hợp trực tiếp với đối tượng của sự tự hào, trong khi chú thích giữ lại khả năng hiểu là “thay mặt chúng tôi”.
- source_word: ἵνα ἔχητε πρὸς
  choice: để anh chị em có lời đáp lại
  rationale: Nguyên văn nói theo lối “để anh chị em có [điều gì đó] đối với”. “Có lời đáp lại” diễn đạt rõ hàm ý phản hồi mà không thêm nội dung cụ thể cho lời đáp.
- source_word: ἐν προσώπῳ
  choice: về vẻ bề ngoài
  rationale: Nghĩa đen liên quan đến “gương mặt”, nhưng trong thế đối lập với “tấm lòng”, cụm từ chỉ điều bề ngoài hoặc cái người ta phô ra. Cách dịch này sáng rõ trong tiếng Việt.
- source_word: καρδίᾳ
  choice: tấm lòng
  rationale: “Tấm lòng” là cách diễn đạt tự nhiên, trang trọng cho trung tâm nội tâm của con người và giữ nguyên thế đối lập với vẻ bề ngoài.
- source_word: πάλιν
  choice: một lần nữa
  rationale: Cụm này giữ rõ ý lặp lại của πάλιν và tự nhiên hơn cấu trúc “không lại...” trong tiếng Việt.
theological_decisions:
- issue: Sự đối lập giữa ἐν προσώπῳ và μὴ ἐν καρδίᾳ
  choice: vẻ bề ngoài đối lập với tấm lòng
  alternative: danh tiếng công khai đối lập với lòng chân thành; hoặc sự hiện diện trước mặt đối lập với thái độ nội tâm
  rationale: Cách dịch giữ trực tiếp hình ảnh bên ngoài–bên trong của nguyên văn, không thu hẹp nó thành một phán đoán giáo lý cụ thể về động cơ của đối phương.
- issue: Sắc thái của καυχάομαι
  choice: tự hào
  alternative: khoe khoang; hãnh diện
  rationale: Trong cùng câu, từ này vừa chỉ điều người Cô-rinh-tô có thể làm về Phao-lô, vừa chỉ hành vi của đối phương. “Tự hào” giữ được khả năng mang sắc thái tích cực hoặc tiêu cực do văn cảnh quyết định.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” cho đại từ số nhiều ὑμῖν; giữ phép lặp “tự hào” để phản ánh liên kết từ vựng của câu Hy Lạp.
