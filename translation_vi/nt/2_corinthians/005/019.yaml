source:
  edition: SBLGNT
  text: ὡς ὅτι θεὸς ἦν ἐν Χριστῷ κόσμον καταλλάσσων ἑαυτῷ, μὴ λογιζόμενος αὐτοῖς τὰ παραπτώματα αὐτῶν, καὶ θέμενος ἐν ἡμῖν τὸν λόγον τῆς καταλλαγῆς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/019.yaml
  text: namely[a], that God was in Messiah reconciling the world to himself, not counting their trespasses against them[d][c][b], and entrusting to us the message of reconciliation.
translation:
  language: vi
  text: 'nghĩa là: Đức Chúa Trời ở trong Đấng Mê-si, hòa giải thế gian với chính mình, không quy các vi phạm của họ cho họ, và giao phó cho chúng tôi sứ điệp hòa giải.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc dịch sát: “và đặt trong chúng tôi lời/sứ điệp hòa giải”; “trong chúng tôi” cũng có thể được hiểu là “giữa chúng tôi” hoặc, theo nghĩa chức vụ, “cho chúng tôi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς ὅτι
  choice: 'nghĩa là:'
  rationale: Cụm từ có chức năng giải thích nội dung của mệnh đề trước; “nghĩa là” tự nhiên trong tiếng Việt và tránh lặp từ vụng về.
- source_word: θεὸς ἦν ἐν Χριστῷ
  choice: Đức Chúa Trời ở trong Đấng Mê-si
  rationale: Giữ sát cấu trúc với ἐν là “ở trong”, không tự ý chuyển thành nghĩa phương tiện “qua”; Χριστός được dịch như một tước hiệu.
- source_word: κόσμον
  choice: thế gian
  rationale: Cách dịch quen thuộc, rộng nghĩa, phù hợp với nhân loại đang xa cách Đức Chúa Trời trong văn cảnh.
- source_word: καταλλάσσων ... καταλλαγῆς
  choice: hòa giải ... sự hòa giải
  rationale: Duy trì sự liên kết từ vựng giữa động từ và danh từ trong cùng câu.
- source_word: ἑαυτῷ
  choice: với chính mình
  rationale: Diễn đạt tự nhiên hướng quy chiếu của sự hòa giải về Đức Chúa Trời.
- source_word: μὴ λογιζόμενος
  choice: không kể
  rationale: Giữ hình ảnh tính sổ của động từ mà vẫn rõ ràng trong tiếng Việt hiện đại.
- source_word: παραπτώματα
  choice: những sự vi phạm
  rationale: Chỉ những hành vi sai phạm cụ thể, chính xác hơn từ khái quát “tội lỗi” trong câu này.
- source_word: καὶ θέμενος ἐν ἡμῖν
  choice: và đặt nơi chúng tôi
  rationale: Giữ động từ cụ thể τίθημι và sắc thái trực tiếp của ἐν; chú thích nêu cách hiểu thành ngữ khả dĩ.
- source_word: τὸν λόγον τῆς καταλλαγῆς
  choice: lời hòa giải
  rationale: Giữ gần danh từ λόγος và quan hệ sở hữu của nguyên văn; có thể hiểu là sứ điệp công bố về sự hòa giải.
theological_decisions:
- issue: Cách hiểu θεὸς ἦν ἐν Χριστῷ
  choice: Đức Chúa Trời ở trong Đấng Mê-si
  alternative: Trong Đấng Mê-si, Đức Chúa Trời đang hòa giải thế gian với chính mình; hoặc Đức Chúa Trời qua Đấng Mê-si hòa giải thế gian với chính mình
  rationale: Bản chính giữ trật tự và giới từ của tiếng Hy Lạp, bảo tồn độ căng thần học giữa sự hiện diện và hành động của Đức Chúa Trời trong Đấng Mê-si.
- issue: Cách dịch Χριστῷ
  choice: Đấng Mê-si
  alternative: Đấng Christ
  rationale: Χριστός hoạt động như một tước hiệu; dịch nghĩa giúp độc giả hiện đại nhận ra chức năng tước hiệu ấy.
- issue: Cách hiểu θέμενος ἐν ἡμῖν
  choice: đặt nơi chúng tôi
  alternative: giao phó cho chúng tôi
  rationale: Bản chính bảo tồn cách diễn đạt của tiếng Hy Lạp; cách hiểu theo nghĩa chức vụ, “giao phó cho,” được ghi trong chú thích để câu không bị giải nghĩa quá mức.
- issue: Đối tượng của đại từ αὐτοῖς ... αὐτῶν
  choice: họ ... họ
  alternative: người thế gian
  rationale: Giữ đại từ số nhiều của nguyên văn, với tiền đề được hiểu là con người thuộc “thế gian,” thay vì diễn giải trực tiếp vào bản văn.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại. Giữ cụm “ở trong Đấng Mê-si” và “đặt nơi chúng tôi” để bảo tồn cấu trúc cùng độ mở của nguyên văn; chú thích hỗ trợ cách hiểu thành ngữ. Dấu chú thích [a] được đặt ngay sau cụm mà chú thích giải thích.
