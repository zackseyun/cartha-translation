  text: εἴτε γὰρ ἐξέστημεν, θεῷ· εἴτε σωφρονοῦμεν, ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/013.yaml
  text: For if we are out of our minds[a], it is for God; if we are of sound mind[b], it is for you.
translation:
  language: vi
  text: Vì nếu chúng tôi mất trí[a], ấy là vì Đức Chúa Trời; còn nếu chúng tôi tỉnh táo[b], ấy là vì anh chị em.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “không còn làm chủ được mình.”'
    reason: lexical_alternative
  - marker: b
    text: 'Hoặc: “sáng suốt” hoặc “có tâm trí lành mạnh.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴτε ... εἴτε
  choice: nếu ... còn nếu
  rationale: Cặp từ nêu hai khả năng tương phản. Cách diễn đạt này tự nhiên trong tiếng Việt, đồng thời giữ được sức nặng lựa chọn của cấu trúc Hy Lạp.
- source_word: γὰρ
  choice: Vì
  rationale: Liên từ này đưa ra lời giải thích hoặc lý do cho phát biểu ngay trước đó; “Vì” giữ rõ mối liên kết lập luận.
- source_word: ἐξέστημεν
  choice: mất trí
  rationale: Động từ ở đây có thể chỉ tình trạng bị xem là không còn tỉnh trí hoặc như ở ngoài chính mình. “Mất trí” ngắn gọn, hiện đại và tạo thế đối lập rõ với σωφρονοῦμεν, nhưng chú thích vẫn bảo lưu sắc thái khác.
- source_word: θεῷ
  choice: vì Đức Chúa Trời
  rationale: Dữ cách cô đọng có thể biểu thị sự quy hướng hoặc lợi ích. “Vì Đức Chúa Trời” tự nhiên trong tiếng Việt và không buộc câu vào một cách hiểu kỹ thuật về trạng thái xuất thần.
- source_word: σωφρονοῦμεν
  choice: tỉnh táo
  rationale: Từ này diễn tả trạng thái có đầu óc sáng suốt, biết suy xét hoặc tự chủ. “Tỉnh táo” vừa dễ hiểu vừa tạo đối lập trực tiếp với “mất trí”.
- source_word: ὑμῖν
  choice: vì anh chị em
  rationale: Dữ cách song song với θεῷ, có thể chỉ sự quy hướng hoặc lợi ích. “Vì anh chị em” truyền đạt tự nhiên rằng cách hành xử tỉnh táo của Phao-lô nhằm ích lợi cho người Cô-rinh-tô.
theological_decisions:
- issue: Ý nghĩa của hai cách Phao-lô mô tả chính mình
  choice: Giữ nguyên sự tương phản giữa việc bị xem là mất trí và việc hành xử tỉnh táo, không khẳng định rằng Phao-lô thực sự điên loạn.
  alternative: Hiểu ἐξέστημεν như một kinh nghiệm xuất thần tôn giáo theo nghĩa kỹ thuật, hoặc chỉ như lời nhắc lại một lời cáo buộc mang tính cường điệu.
  rationale: Câu Hy Lạp cô đọng và có tính tu từ. Bản dịch giữ sức căng của lời đối chiếu mà không áp đặt một học thuyết về xuất thần hay thu hẹp câu thành lời xúc phạm của đối thủ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” cho đại từ số nhiều ὑμῖν nhằm diễn đạt cộng đồng tín hữu một cách tự nhiên; cấu trúc song song “vì Đức Chúa Trời ... vì anh chị em” phản ánh tính cô đọng của nguyên văn.
