  text: διὰ πίστεως γὰρ περιπατοῦμεν, οὐ διὰ εἴδους—
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/007.yaml
  text: For we walk by faith[a], not by sight—
translation:
  language: vi
  text: Vì chúng ta bước đi bởi đức tin[a], chứ không bởi điều mắt thấy—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “nhờ đức tin.” Cụm từ Hy Lạp chỉ phương tiện hoặc cách thức.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ πίστεως
  choice: bởi đức tin
  rationale: διά với sở hữu cách chỉ phương tiện hoặc cách thức. “Bởi đức tin” tự nhiên trong văn phong Kinh Thánh tiếng Việt và giữ được sự đối lập súc tích với điều mắt thấy.
- source_word: γὰρ
  choice: Vì
  rationale: γάρ nêu lý do giải thích cho lời khẳng định trong văn cảnh trước; “Vì” giữ rõ chức năng liên kết ấy.
- source_word: περιπατοῦμεν
  choice: chúng ta bước đi
  rationale: περιπατέω có nghĩa đen là “bước đi” và thường được dùng ẩn dụ về cách sống. Giữ hình ảnh bước đi vừa sát nguồn vừa dễ hiểu trong tiếng Việt.
- source_word: οὐ διὰ εἴδους
  choice: chứ không bởi điều mắt thấy
  rationale: εἶδος có thể chỉ hình dạng hữu hình, vẻ bề ngoài hoặc điều được thấy. “Điều mắt thấy” diễn đạt tự nhiên phạm vi hữu hình và giữ thế đối lập với đức tin mà không thu hẹp nghĩa thành vẻ bề ngoài đơn thuần.
theological_decisions:
- issue: Cách dịch πίστις trong sự đối lập mang ý nghĩa thần học với εἶδος
  choice: đức tin
  alternative: sự tin cậy; lòng trung tín
  rationale: Trong câu này, πίστις đối lập với điều mắt thấy và thích hợp nhất với ý nghĩa tin cậy nơi điều chưa hiện thấy. “Đức tin” là cách diễn đạt quen thuộc, không buộc từ này mang nghĩa “lòng trung tín”.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Giữ ẩn dụ “bước đi” của nguyên văn; dùng “điều mắt thấy” thay vì chỉ “thị giác” để diễn đạt tự nhiên hơn. Dấu gạch ngang cuối câu được giữ vì câu Hy Lạp tiếp nối trực tiếp sang mệnh đề kế tiếp.
