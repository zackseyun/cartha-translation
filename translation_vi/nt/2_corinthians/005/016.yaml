id: 2CO.5.16
reference: 2 Corinthians 5:16
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ὥστε ἡμεῖς ἀπὸ τοῦ νῦν οὐδένα οἴδαμεν κατὰ σάρκα· ⸀εἰ καὶ ἐγνώκαμεν κατὰ σάρκα Χριστόν, ἀλλὰ νῦν οὐκέτι γινώσκομεν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/016.yaml
  text: So from now on we regard no one according to the flesh[a]. Even if we have known Messiah according to the flesh[b], yet now we no longer know him that way.
translation:
  language: vi
  text: Vì vậy, từ nay chúng tôi không nhìn nhận một ai theo xác thịt[a]. Dù chúng tôi đã từng biết Đấng Mê-si theo xác thịt, nhưng nay chúng tôi không còn biết Ngài theo cách ấy nữa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “theo quan điểm của con người” hoặc “theo tiêu chuẩn thế gian.”
    reason: Nêu các cách diễn đạt tự nhiên hơn cho κατὰ σάρκα, đồng thời chính văn vẫn giữ hình ảnh “xác thịt” của tiếng Hy Lạp.
lexical_decisions:
- source_word: Ὥστε
  choice: Vì vậy
  rationale: Diễn tả kết luận rút ra từ lập luận trước đó, đồng thời tự nhiên và trang trọng trong tiếng Việt hiện đại.
- source_word: ἀπὸ τοῦ νῦν
  choice: từ nay
  rationale: Thành ngữ chỉ sự thay đổi dứt khoát kể từ thời điểm hiện tại trở đi.
- source_word: οὐδένα οἴδαμεν
  choice: chúng tôi không nhìn nhận một ai
  rationale: Trong kết hợp với κατὰ σάρκα, οἴδαμεν không chỉ nói đến tri thức mà còn chỉ cách nhận biết và đánh giá người khác; “nhìn nhận” truyền đạt sắc thái ấy mà vẫn giữ liên hệ với động từ “biết” ở mệnh đề sau.
- source_word: κατὰ σάρκα
  choice: theo xác thịt
  rationale: Giữ thuật ngữ thần học σάρξ của Phao-lô và sự căng thẳng vốn có của câu; ở đây cụm từ chỉ cách nhìn theo những tiêu chuẩn thuần túy thuộc con người hoặc trần thế, không nhất thiết mang nghĩa “bản tính tội lỗi”.
- source_word: εἰ καὶ
  choice: Dù
  rationale: Truyền đạt tự nhiên lực nhượng bộ của cụm từ Hy Lạp mà không quyết định quá mức giữa sắc thái “dù cho” và “mặc dù”.
- source_word: ἐγνώκαμεν
  choice: đã từng biết
  rationale: Diễn tả việc biết trong quá khứ, nay được đặt tương phản với cách biết hiện tại; “từng” làm rõ sự tương phản theo thời gian.
- source_word: Χριστόν
  choice: Đấng Mê-si
  rationale: Ở đây Χριστός chỉ tước hiệu của Chúa Giê-su; “Đấng Mê-si” bảo tồn nội dung của tước hiệu thay vì chỉ phiên âm hoặc biến nó thành tên riêng.
- source_word: ἀλλὰ νῦν οὐκέτι γινώσκομεν
  choice: nhưng nay chúng tôi không còn biết Ngài theo cách ấy nữa
  rationale: Giữ sự tương phản mạnh giữa trước kia và hiện nay; bổ sung “Ngài” từ đối tượng ở mệnh đề trước và “theo cách ấy” để làm rõ rằng điều thay đổi là phương cách nhận biết.
theological_decisions:
- issue: Ý nghĩa của κατὰ σάρκα đối với mọi người và đối với Đấng Mê-si
  choice: Giữ “theo xác thịt” trong chính văn, hiểu là nhìn nhận theo những phạm trù thuần túy thuộc con người hoặc trần thế.
  alternative: “theo quan điểm của con người” hoặc “theo tiêu chuẩn thế gian”
  rationale: Cách dịch này duy trì thuật ngữ và sự căng thẳng thần học của Phao-lô. Câu không phủ nhận nhân tính thật của Đấng Mê-si, nhưng bác bỏ cách nhận biết Ngài chỉ theo những tiêu chuẩn thuộc xác thịt.
- issue: Cách dịch Χριστός
  choice: Đấng Mê-si
  alternative: Đấng Christ
  rationale: Trong ngữ cảnh này từ Hy Lạp hoạt động như một tước hiệu; “Đấng Mê-si” truyền đạt ý nghĩa của tước hiệu mà không đưa vào một cách hiểu hệ phái riêng.
- issue: Sắc thái của εἰ καὶ
  choice: Dù
  alternative: “Dù cho” hoặc “Mặc dù”
  rationale: “Dù” bảo tồn tính nhượng bộ và tránh khẳng định quá mức liệu mệnh đề có chủ yếu mang tính giả định hay thừa nhận một thực tế trong quá khứ.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “chúng tôi” cho ngôi thứ nhất số nhiều và “Ngài” để chỉ Đấng Mê-si. Cấu trúc hai mệnh đề giữ sự lặp lại có chủ ý của “theo xác thịt” và sự tương phản giữa trước kia với hiện nay.
