  source_fidelity: Bản dịch giữ được mạch lập luận của καὶ γάρ, hình ảnh «lều», sự rên siết trong tình trạng bị đè nặng, đối lập giữa cởi áo và mặc thêm bên ngoài, cùng kết quả là cái phải chết bị sự sống nuốt chửng. Không diễn giải hình ảnh này thành một lập trường về trạng thái trung gian. Các ký hiệu chú thích [a], [b] được đặt đúng tại những từ cần chú thích trong bản tiếng Việt, dù vị trí ký hiệu trong audit trail tiếng Anh có vẻ không khớp nội dung chú thích.
  naturalness: 'Cần chỉnh nhẹ để tiếng Việt hiện đại tự nhiên và sát sắc thái bị động hơn: «Vì quả thật» thông dụng hơn «Vì thật vậy» trong văn mạch này; «rên siết vì bị đè nặng» biểu đạt rõ βαρούμενοι hơn «rên siết dưới gánh nặng»; và «mặc thêm áo ở bên ngoài» sáng rõ hơn cụm hơi nặng «mặc thêm áo phủ ngoài».'
