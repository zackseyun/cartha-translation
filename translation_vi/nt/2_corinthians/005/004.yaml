id: 2CO.5.4
reference: 2 Corinthians 5:4
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ γὰρ οἱ ὄντες ἐν τῷ σκήνει στενάζομεν βαρούμενοι ἐφ’ ᾧ οὐ θέλομεν ἐκδύσασθαι ἀλλ’ ἐπενδύσασθαι, ἵνα καταποθῇ τὸ θνητὸν ὑπὸ τῆς ζωῆς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/004.yaml
  text: For indeed[a], while we are in this tent, we groan, being burdened, because we do not want to be unclothed but to be further clothed[b], so that what is mortal may be swallowed up by life.
translation:
  language: vi
  text: Vì quả thật, khi còn ở trong lều này, chúng ta rên siết vì bị đè nặng, bởi chúng ta không muốn cởi áo ra, nhưng muốn mặc thêm áo ở bên ngoài[a], để cái phải chết[b] bị sự sống nuốt chửng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “mặc chồng thêm áo”. Động từ Hy Lạp gợi ý việc mặc một áo ngoài lên trên áo đang mặc.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “cái hữu tử” hoặc “tính hữu tử”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: Vì thật vậy
  rationale: Giữ cả chức năng nối kết, giải thích của γάρ lẫn sắc thái nhấn mạnh của καί, đồng thời vẫn tự nhiên trong tiếng Việt.
- source_word: σκήνει
  choice: lều
  rationale: Giữ nguyên hình ảnh ẩn dụ về đời sống thân xác hiện tại và sự liên kết với văn cảnh chung quanh, thay vì làm phẳng thành “nơi ở”.
- source_word: στενάζομεν
  choice: chúng ta rên siết
  rationale: Diễn tả rõ sức nặng và niềm mong mỏi cánh chung; mạnh hơn “thở dài”.
- source_word: βαρούμενοι
  choice: dưới gánh nặng
  rationale: Truyền đạt trạng thái bị đè nặng đi kèm và giải thích cho việc rên siết, với cách nói tự nhiên trong tiếng Việt.
- source_word: ἐφ’ ᾧ
  choice: bởi
  rationale: Trong văn cảnh này, cụm từ hợp lý nhất là nêu nguyên do; “bởi” rõ nghĩa mà không quá diễn giải.
- source_word: ἐκδύσασθαι
  choice: cởi áo ra
  rationale: Giữ hình ảnh y phục mà không giải thích nó thành một hệ thống giáo lý cụ thể về trạng thái trung gian.
- source_word: ἐπενδύσασθαι
  choice: mặc thêm áo phủ ngoài
  rationale: Động từ ghép gợi ý mặc một lớp áo bên ngoài lớp đang có; cách dịch này bảo tồn nét nghĩa ấy và dễ hiểu.
- source_word: καταποθῇ
  choice: bị sự sống nuốt chửng
  rationale: Giữ hình ảnh mạnh về việc cái phải chết bị sự sống hoàn toàn thắng vượt.
- source_word: τὸ θνητόν
  choice: cái phải chết
  rationale: Tính từ giống trung được dùng như danh từ. Cách dịch này giữ phạm vi quy chiếu tương đối rộng, không tự ý giới hạn vào thân thể hay chỉ biến thành khái niệm trừu tượng “tính hữu tử”.
- source_word: ζωῆς
  choice: sự sống
  rationale: Tạo sự đối lập tự nhiên và rõ ràng với “cái phải chết” trong tiếng Việt.
theological_decisions:
- issue: Hình ảnh mặc/cởi áo và trạng thái trung gian
  choice: Giữ nguyên hình ảnh “cởi áo” và “mặc thêm áo phủ ngoài”, không xác định một mô hình giáo lý cụ thể.
  alternative: Giải thích “cởi áo” là tồn tại không có thân thể, hoặc xác định “mặc thêm áo phủ ngoài” chỉ là nhận thân thể phục sinh.
  rationale: Bản Hy Lạp dùng ngôn ngữ ẩn dụ về đời sống thân xác và sự biến đổi tương lai. Bản dịch cần giữ sự căng thẳng thần học vốn có thay vì giải quyết một vấn đề còn được tranh luận.
translation_notes:
  register: Tiếng Việt phổ thông hiện đại, trang trọng nhưng dễ hiểu. Hình ảnh “lều”, “cởi áo”, “mặc thêm áo phủ ngoài” và “nuốt chửng” được giữ để bảo tồn mạch ẩn dụ của nguyên văn; dấu chấm phẩy được tránh để câu đọc tự nhiên hơn.
