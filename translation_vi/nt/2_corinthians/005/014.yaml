reference: 2 Corinthians 5:14
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἡ γὰρ ἀγάπη τοῦ Χριστοῦ συνέχει ἡμᾶς, κρίναντας τοῦτο ⸀ὅτι εἷς ὑπὲρ πάντων ἀπέθανεν· ἄρα οἱ πάντες ἀπέθανον·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/014.yaml
  text: 'For the love of Messiah compels us[a], because we have concluded this: that one died on behalf of all; therefore all died.'
translation:
  language: vi
  text: 'Vì tình yêu của Đấng Mê-si thúc bách chúng tôi,[a] vì chúng tôi đã đi đến kết luận này: một người đã chết cho mọi người; vậy thì mọi người đều đã chết.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể hiểu là “tình yêu mà Đấng Mê-si có” hoặc “tình yêu dành cho Đấng Mê-si”; sở hữu cách trong tiếng Hy Lạp có thể được hiểu theo cả hai hướng.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀγάπη
  choice: tình yêu
  rationale: Cách tương đương tự nhiên, hiện đại của ἀγάπη trong tiếng Việt, đồng thời giữ được mối liên hệ từ vựng với các chỗ khác.
- source_word: τοῦ Χριστοῦ
  choice: của Đấng Mê-si
  rationale: Χριστός mang nghĩa tước hiệu; “Đấng Mê-si” chuyển tải tước hiệu đó. Cấu trúc “của” bám sát sở hữu cách Hy Lạp, còn chú thích nêu rõ hai cách hiểu có thể có.
- source_word: συνέχει
  choice: thúc bách
  rationale: Diễn tả sức mạnh chi phối, thôi thúc mạnh mẽ trong ngữ cảnh động lực hành động; trang trọng nhưng vẫn dễ hiểu trong tiếng Việt hiện đại.
- source_word: κρίναντας τοῦτο
  choice: bởi chúng tôi đã kết luận thế này
  rationale: Phân từ aorist nêu cơ sở cho mệnh đề trước; “đã kết luận” thể hiện hoạt động cân nhắc và đi đến nhận định.
- source_word: εἷς
  choice: một người
  rationale: Tiếng Hy Lạp chỉ nói “một”; thêm danh từ loại “người” là cách diễn đạt tự nhiên trong tiếng Việt mà không nêu đích danh Đấng Mê-si trong mệnh đề.
- source_word: ὑπὲρ πάντων
  choice: vì mọi người
  rationale: Giữ nghĩa hành động được thực hiện vì hay vì lợi ích của tất cả, không thu hẹp ὑπέρ thành một mô hình chuộc tội cụ thể như “thay thế cho”.
- source_word: ἄρα
  choice: vậy thì
  rationale: Đánh dấu rõ kết luận suy ra từ mệnh đề trước, tự nhiên hơn trong câu tiếng Việt mà vẫn giữ sức nặng lập luận.
- source_word: οἱ πάντες ἀπέθανον
  choice: mọi người đều đã chết
  rationale: Giữ nguyên phát biểu cô đọng của câu Hy Lạp, không thêm lời giải thích về sự đại diện hay sự đồng chết.
theological_decisions:
- issue: Ý nghĩa sở hữu cách trong ἡ ἀγάπη τοῦ Χριστοῦ
  choice: Dùng “tình yêu của Đấng Mê-si” trong chính văn và ghi chú sự mơ hồ.
  alternative: “tình yêu Đấng Mê-si dành cho chúng ta” hoặc “tình yêu chúng ta dành cho Đấng Mê-si”
  rationale: Sở hữu cách Hy Lạp có thể được hiểu theo nghĩa chủ thể hoặc đối thể. Chính văn không âm thầm quyết định vấn đề; chú thích trình bày minh bạch cả hai khả năng.
- issue: Ý nghĩa của “mọi người đều đã chết”
  choice: Dịch trực tiếp, không diễn giải thêm.
  alternative: Mọi người đã chết cách đại diện trong Đấng Mê-si; hoặc mọi tín hữu đã cùng chết với Ngài.
  rationale: Lập luận của Phao-lô rất cô đọng. Câu này không tự nó giải quyết toàn bộ vấn đề về phạm vi của “mọi người” hay cách họ dự phần vào cái chết ấy.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. “Đấng Mê-si” giữ Χριστός như một tước hiệu; “thúc bách” truyền đạt sức thôi thúc mạnh mẽ mà không mang sắc thái máy móc.
