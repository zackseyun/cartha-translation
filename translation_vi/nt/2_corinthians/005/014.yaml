revisions:
- from: 'Vì tình yêu của Đấng Mê-si thúc bách chúng tôi,[a] bởi chúng tôi đã kết luận thế này: một người đã chết vì mọi người; vậy thì mọi người đều đã chết.'
  to: 'Vì tình yêu của Đấng Mê-si thúc bách chúng tôi,[a] vì chúng tôi đã đi đến kết luận này: một người đã chết cho mọi người; vậy thì mọi người đều đã chết.'
  rationale: Sửa cách diễn đạt của mệnh đề nguyên nhân cho tự nhiên hơn; thay “chết vì mọi người” bằng “chết cho mọi người” để phản ánh ὑπὲρ πάντων chính xác hơn mà vẫn giữ độ mở của nguyên ngữ; và sửa chú thích để bảo toàn tính mơ hồ của sở hữu cách mà không đưa thêm “chúng ta” vào nội dung.
