source:
  edition: SBLGNT
  text: τὰ δὲ πάντα ἐκ τοῦ θεοῦ τοῦ καταλλάξαντος ἡμᾶς ἑαυτῷ ⸀διὰ Χριστοῦ καὶ δόντος ἡμῖν τὴν διακονίαν τῆς καταλλαγῆς,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/018.yaml
  text: All these things are from God[a], who reconciled us to himself through Messiah and gave us the ministry of reconciliation[c][b],
translation:
  language: vi
  text: Mọi điều ấy đều đến từ Đức Chúa Trời[a], Đấng đã hòa giải chúng ta với chính Ngài nhờ Đấng Mê-si[b] và giao cho chúng ta chức vụ hòa giải[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Mọi sự đều đến từ Đức Chúa Trời.” Cụm từ này có thể chỉ rộng đến mọi sự trong thực tại mới, hoặc cụ thể hơn là những điều vừa được nói đến trong ngữ cảnh.'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn Hy Lạp: “qua Đấng Christ”; ở đây dịch là “nhờ Đấng Mê-si” vì Χριστός được dùng như một danh hiệu.'
    reason: alternative_reading
  - marker: c
    text: “Chúng ta” có thể chỉ các tín hữu nói chung; tuy nhiên, trong ngữ cảnh chung quanh, Phao-lô đặc biệt nhấn mạnh sứ mạng được giao cho ông và các cộng sự.
    reason: alternative_reading
lexical_decisions:
- source_word: τὰ δὲ πάντα
  choice: Mọi điều ấy đều
  rationale: Cụm trung tính số nhiều có mạo từ nhiều khả năng quy chiếu về những thực tại vừa được nhắc đến; “mọi điều ấy” giữ được cả tính hồi chỉ lẫn phạm vi rộng. δέ là liên từ chuyển ý nhẹ và không cần dịch thành một từ riêng trong tiếng Việt.
- source_word: ἐκ τοῦ θεοῦ
  choice: đến từ Đức Chúa Trời
  rationale: ἐκ chỉ nguồn gốc; “đến từ” là cách nói tự nhiên, rõ nghĩa trong tiếng Việt hiện đại.
- source_word: τοῦ καταλλάξαντος ἡμᾶς ἑαυτῷ
  choice: Đấng đã ... hòa giải chúng ta với chính Ngài
  rationale: Chuyển phân từ aorist thành mệnh đề quan hệ trang trọng, tự nhiên; “với chính Ngài” thể hiện đại từ phản thân ἑαυτῷ và quan hệ được phục hồi.
- source_word: διὰ Χριστοῦ
  choice: nhờ Đấng Mê-si
  rationale: διά với sở hữu cách diễn tả phương tiện hoặc trung gian; Χριστός ở đây mang chức năng danh hiệu, nên dịch là “Đấng Mê-si”.
- source_word: καὶ δόντος ἡμῖν
  choice: và giao cho chúng ta
  rationale: Phân từ aorist thứ hai cùng bổ nghĩa cho Đức Chúa Trời. Trong ngữ cảnh một nhiệm vụ được ủy thác, “giao cho” tự nhiên và chính xác hơn “ban cho”.
- source_word: τὴν διακονίαν τῆς καταλλαγῆς
  choice: chức vụ hòa giải
  rationale: διακονία chỉ sự phục vụ được giao phó; “chức vụ” giữ sắc thái sứ mạng. Sở hữu cách τῆς καταλλαγῆς xác định nội dung hoặc đặc tính của chức vụ ấy.
theological_decisions:
- issue: Cách dịch Χριστοῦ
  choice: Đấng Mê-si
  alternative: Đấng Christ; Christ
  rationale: Trong câu này, Χριστός nêu bật vai trò trung gian mang tính danh hiệu, nên dịch nghĩa thay vì chỉ phiên âm.
- issue: Phạm vi của ἡμᾶς / ἡμῖν
  choice: chúng ta
  alternative: toàn thể các tín hữu; riêng Phao-lô và các cộng sự sứ đồ
  rationale: Nguyên văn không tự xác định dứt khoát phạm vi. Ngữ cảnh vừa có thể bao gồm các tín hữu nói chung, vừa đặc biệt hướng đến sứ mạng của Phao-lô và các cộng sự; bản dịch giữ nguyên sự mở này.
- issue: Ý nghĩa của καταλλαγή
  choice: hòa giải
  alternative: làm cho hòa thuận; phục hòa
  rationale: “Hòa giải” diễn đạt việc khôi phục mối quan hệ với Đức Chúa Trời mà không thêm một mô hình thần học không được câu này nói rõ.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Trời” cho θεός và “Đấng Mê-si” cho danh hiệu Χριστός. Tránh thêm từ chuyển ý ở đầu câu vì δέ chỉ mang lực chuyển tiếp nhẹ; dấu câu kết thúc câu được chuẩn hóa.
