id: 2CO.5.21
reference: 2 Corinthians 5:21
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸀τὸν μὴ γνόντα ἁμαρτίαν ὑπὲρ ἡμῶν ἁμαρτίαν ἐποίησεν, ἵνα ἡμεῖς γενώμεθα δικαιοσύνη θεοῦ ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/021.yaml
  text: He made the one who did not know sin to be sin for us[b][a], so that in him we might become the righteousness of God.
translation:
  language: vi
  text: Đức Chúa Trời đã làm cho Đấng không hề biết tội lỗi trở thành tội lỗi[a] vì chúng ta, để trong Ngài, chúng ta có thể trở nên sự công chính của Đức Chúa Trời[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể hiểu “tội lỗi” ở đây là “lễ vật chuộc tội”. Tiếng Hy Lạp dùng từ “tội lỗi” ở cả hai chỗ; một số người hiểu lần thứ hai theo nghĩa tế lễ.
    reason: alternative_reading
  - marker: b
    text: 'Cũng có thể dịch: “sự công chính đến từ Đức Chúa Trời” hoặc “công lý của Đức Chúa Trời”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸν μὴ γνόντα ἁμαρτίαν
  choice: Đấng không hề biết tội lỗi
  rationale: Giữ thành ngữ cô đọng của Hy Lạp và khẳng định Đấng Christ không dự phần vào tội lỗi, thay vì diễn giải thành “không hề phạm tội”.
- source_word: ὑπὲρ ἡμῶν
  choice: vì chúng ta
  rationale: Diễn đạt tự nhiên sắc thái vì lợi ích và thay mặt của ὑπέρ, nhưng không thu hẹp câu vào một mô hình chuộc tội cụ thể.
- source_word: ἁμαρτίαν (lần thứ hai)
  choice: tội lỗi
  rationale: Giữ nguyên sự lặp lại đầy sức nặng của ἁμαρτία trong nguyên văn; cách hiểu “lễ vật chuộc tội” được nêu ở chú thích.
- source_word: ἐποίησεν
  choice: đã làm cho trở thành
  rationale: Trong tiếng Việt, cách diễn đạt này truyền đạt tự nhiên cấu trúc “làm cho ... thành” mà không hàm ý Đấng Christ trở nên có tội về mặt đạo đức.
- source_word: γενώμεθα
  choice: có thể trở nên
  rationale: Phản ánh thể giả định trong mệnh đề mục đích với ἵνα và giữ sắc thái chuyển thành của γίνομαι.
- source_word: δικαιοσύνη θεοῦ
  choice: sự công chính của Đức Chúa Trời
  rationale: Giữ cấu trúc sở hữu cách mở của nguyên văn, không quyết định đó là sự công chính thuộc về Đức Chúa Trời, đến từ Ngài hay địa vị công chính trước Ngài.
- source_word: ἐν αὐτῷ
  choice: trong Ngài
  rationale: Giữ nguyên thành ngữ thần học quan trọng của Phao-lô, thay vì mở rộng theo lối giải thích thành “hiệp nhất với Ngài”.
theological_decisions:
- issue: Ý nghĩa của “làm cho ... trở thành tội lỗi”
  choice: Giữ cách nói mạnh và cô đọng của Phao-lô, đồng thời văn cảnh xác nhận Đấng Christ không biết tội lỗi; câu không nói Ngài trở nên có tội về mặt đạo đức.
  alternative: “Làm thành lễ vật chuộc tội” là một cách hiểu có thể có và được ghi ở chú thích.
  rationale: Nguyên văn dùng cùng danh từ ἁμαρτία, “tội lỗi”, và không giải thích cơ chế. Bản dịch vì thế giữ căng thẳng thần học thay vì giải quyết ngay trong chính văn.
- issue: Ý nghĩa của δικαιοσύνη θεοῦ
  choice: sự công chính của Đức Chúa Trời
  alternative: sự công chính đến từ Đức Chúa Trời; sự chính trực/công lý của Đức Chúa Trời
  rationale: Cụm sở hữu cách của Phao-lô hàm chứa nhiều khả năng về nguồn gốc, sở hữu và mối quan hệ; chính văn giữ nguyên độ mở ấy.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. “Đấng” và “Ngài” thể hiện sự tôn kính; câu vẫn giữ cấu trúc đối xứng và ngôn ngữ thần học cô đọng của nguyên văn.
