revisions:
- from: 'Vậy, chúng tôi là sứ giả thay mặt Đấng Mê-si[a], như thể Đức Chúa Trời đang qua chúng tôi mà kêu gọi. Chúng tôi nhân danh Đấng Mê-si nài xin anh chị em: hãy hòa giải với Đức Chúa Trời[b].'
  to: 'Vậy, chúng tôi là đại sứ thay mặt Đấng Mê-si[a], như thể Đức Chúa Trời đang kêu gọi qua chúng tôi. Chúng tôi nhân danh Đấng Mê-si nài xin anh chị em: hãy được hòa giải với Đức Chúa Trời[b].'
  rationale: Sửa “sứ giả” thành “đại sứ” để phản ánh chính xác hơn πρεσβεύομεν; chỉnh trật tự từ cho tiếng Việt hiện đại tự nhiên; và dùng “hãy được hòa giải” để bảo toàn thể thụ động của καταλλάγητε. Giữ “với Đức Chúa Trời” vì đây là cách diễn đạt tiếng Việt tự nhiên cho quan hệ hòa giải, không làm thay đổi tính mơ hồ hợp lệ của tặng cách τῷ θεῷ.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T19:25:44Z'
