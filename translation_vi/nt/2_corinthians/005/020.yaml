  naturalness: Cụm “Đức Chúa Trời đang qua chúng tôi mà kêu gọi” chưa tự nhiên về trật tự từ. “Đức Chúa Trời đang kêu gọi qua chúng tôi” rõ ràng và tự nhiên hơn. “Đại sứ” là tương đương trực tiếp, thông dụng hơn của πρεσβεύομεν trong ngữ cảnh đại diện chính thức so với “sứ giả.”
  terminology: Giữ “Đấng Mê-si” để dịch tước hiệu Χριστός là nhất quán với định hướng dự án; chú thích về “Đấng Christ” phù hợp. “Đức Chúa Trời” và “hòa giải” là các thuật ngữ chuẩn, rõ nghĩa.
