reference: 2 Corinthians 5:20
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὑπὲρ Χριστοῦ οὖν πρεσβεύομεν ὡς τοῦ θεοῦ παρακαλοῦντος δι’ ἡμῶν· δεόμεθα ὑπὲρ Χριστοῦ, καταλλάγητε τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/020.yaml
  text: 'Therefore[a], we are ambassadors for the Messiah, as though God were appealing through us[b]. We beg you on behalf of the Messiah: be reconciled to God.'
translation:
  language: vi
  text: 'Vậy, chúng tôi là đại sứ thay mặt Đấng Mê-si[a], như thể Đức Chúa Trời đang kêu gọi qua chúng tôi. Chúng tôi nhân danh Đấng Mê-si nài xin anh chị em: hãy được hòa giải với Đức Chúa Trời[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “Đấng Christ” trong cả câu này. Từ Hy Lạp Χριστός là một tước hiệu, có nghĩa là “Đấng Mê-si,” tức Đấng Được Xức Dầu.
    reason: alternative_reading
  - marker: b
    text: Nguyên văn Hy Lạp dùng mệnh lệnh dạng thụ động; cũng có thể dịch là “hãy được hòa giải với Đức Chúa Trời.”
    reason: source_form
lexical_decisions:
- source_word: ὑπὲρ Χριστοῦ
  choice: thay mặt Đấng Mê-si / nhân danh Đấng Mê-si
  rationale: ὑπέρ với sở hữu cách chỉ sự đại diện, nghĩa là “vì” hoặc “thay mặt.” Trong ngữ cảnh sứ giả, “thay mặt” diễn đạt rõ vai trò đại diện; lần thứ hai dùng “nhân danh” để câu tiếng Việt tự nhiên mà vẫn giữ cùng ý nghĩa. Χριστός được dịch theo nghĩa tước hiệu là “Đấng Mê-si.”
- source_word: οὖν
  choice: Vậy
  rationale: οὖν nêu kết luận rút ra từ lập luận trước đó về sự hòa giải. “Vậy” ngắn gọn, tự nhiên và liên kết rõ với văn mạch.
- source_word: πρεσβεύομεν
  choice: chúng tôi là sứ giả
  rationale: πρεσβεύω nghĩa là thi hành vai trò đại sứ hay sứ giả. “Sứ giả” dễ hiểu trong tiếng Việt hiện đại và thích hợp với người được sai đi đại diện.
- source_word: ὡς τοῦ θεοῦ παρακαλοῦντος δι’ ἡμῶν
  choice: như thể Đức Chúa Trời đang qua chúng tôi mà kêu gọi
  rationale: ὡς giữ sắc thái so sánh “như thể”; παρακαλέω trong ngữ cảnh này là kêu gọi, thúc giục; διά với sở hữu cách biểu thị phương tiện hay trung gian. Cách dịch không đồng nhất lời của các sứ giả với lời Đức Chúa Trời theo lối mạnh hơn nguyên văn.
- source_word: δεόμεθα
  choice: nài xin
  rationale: δέομαι diễn tả lời khẩn cầu tha thiết. “Nài xin” trang trọng vừa phải, dễ hiểu và truyền đạt tính cấp bách.
- source_word: καταλλάγητε
  choice: hãy hòa giải
  rationale: Động từ mệnh lệnh thụ động aorist kêu gọi người nghe tiếp nhận sự hòa giải. Tiếng Việt không luôn đánh dấu thể thụ động tự nhiên như tiếng Hy Lạp; “hãy hòa giải” giữ lời kêu gọi mà không thêm tác nhân hay cơ chế ngoài nguyên văn.
- source_word: τῷ θεῷ
  choice: với Đức Chúa Trời
  rationale: Tặng cách sau καταλλάσσω có thể diễn tả bên mà một người được hòa giải cùng. “Với Đức Chúa Trời” là cách nói tự nhiên trong tiếng Việt và làm rõ quan hệ được phục hồi.
theological_decisions:
- issue: Cách dịch Χριστοῦ
  choice: Đấng Mê-si
  alternative: Đấng Christ
  rationale: Χριστός ở đây hoạt động như một tước hiệu. “Đấng Mê-si” chuyển tải nghĩa tước hiệu, còn cách gọi quen thuộc “Đấng Christ” được giữ trong chú thích.
- issue: Thể và tác nhân trong sự hòa giải
  choice: hãy hòa giải với Đức Chúa Trời
  alternative: hãy được hòa giải với Đức Chúa Trời / hãy hòa thuận lại với Đức Chúa Trời
  rationale: Nguyên văn dùng mệnh lệnh thụ động, trong khi tiếng Việt tự nhiên thường không dùng “được” với mệnh lệnh theo cách này. Bản dịch tránh giải thích quá mức cách thức tương tác giữa hành động của Đức Chúa Trời và sự đáp ứng của con người; chú thích ghi rõ dạng thụ động của tiếng Hy Lạp.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Anh chị em” được bổ sung để thể hiện đối tượng hàm ẩn của động từ δεόμεθα và mệnh lệnh số nhiều, tránh cách xưng hô quá cổ hoặc mang sắc thái giới tính đơn nhất. Hai cách “thay mặt” và “nhân danh” diễn đạt tự nhiên hai lần lặp của ὑπὲρ Χριστοῦ.
