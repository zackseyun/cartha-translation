  text: ⸂εἴ γε⸃ καὶ ⸀ἐνδυσάμενοι οὐ γυμνοὶ εὑρεθησόμεθα.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/003.yaml
  text: if indeed[a], when we have been clothed, we will not be found naked.
translation:
  language: vi
  text: nếu quả thật[a], khi đã mặc vào, chúng ta sẽ không bị thấy là trần truồng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “nếu quả thật, sau khi đã mặc vào, chúng ta sẽ không bị thấy là không mặc gì.”'
    reason: Nêu cách diễn đạt khác cho quan hệ của phân từ ἐνδυσάμενοι và cho γυμνοί (“trần truồng/không mặc gì”), không giải thích cụ thể ẩn dụ.
lexical_decisions:
- source_word: εἴ γε
  choice: nếu quả thật
  rationale: Giữ cả ý điều kiện của εἰ lẫn sắc thái nhấn mạnh/xác nhận của γε, không biến mệnh đề thành một lời khẳng định chắc chắn.
- source_word: καὶ ἐνδυσάμενοι
  choice: khi đã mặc vào
  rationale: Diễn đạt tự nhiên quan hệ của phân từ aorist với động từ tương lai, đồng thời giữ nguyên hình ảnh mặc áo và không tự ý bổ sung vật được mặc.
- source_word: γυμνοὶ
  choice: trong tình trạng trần truồng
  rationale: Giữ nghĩa trực tiếp và hình ảnh đối lập với việc mặc vào; cách diễn đạt này cũng phù hợp tự nhiên với động từ bị động 'bị thấy'.
- source_word: εὑρεθησόμεθα
  choice: chúng ta sẽ không bị thấy
  rationale: Phản ánh thể tương lai bị động và nghĩa 'được/bị nhận thấy là ở trong một tình trạng', không diễn giải thêm ai là chủ thể nhận thấy.
theological_decisions:
- issue: Ý nghĩa của hình ảnh mặc vào và trần truồng
  choice: Giữ nguyên ẩn dụ mà không xác định cụ thể tình trạng trần truồng ám chỉ điều gì.
  alternative: Diễn giải 'trần truồng' là tình trạng không có thân thể giữa lúc chết và lúc sống lại, không có thân thể thiên thượng, hoặc sự hổ thẹn/phơi bày trước Đức Chúa Trời.
  rationale: Câu Hy Lạp không tự xác định đầy đủ đối tượng thần học của ẩn dụ; bản dịch vì thế duy trì sự căng thẳng và tính đa nghĩa của lời Phao-lô.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cụm “mặc vào” cố ý không thêm tân ngữ vì bản Hy Lạp cũng không nêu rõ; “trần truồng” bảo toàn hình ảnh mạnh và sự mơ hồ thần học của nguyên văn.
