id: 2CO.5.17
reference: 2 Corinthians 5:17
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὥστε εἴ τις ἐν Χριστῷ, καινὴ κτίσις· τὰ ἀρχαῖα παρῆλθεν, ἰδοὺ γέγονεν ⸀καινά·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/017.yaml
  text: So then[a], if anyone is in Messiah, there is a new creation; the old things have passed away; behold[b], new things have come.
translation:
  language: vi
  text: Vì vậy, nếu ai ở trong Đấng Mê-si thì có một sự sáng tạo mới[a]; những điều cũ đã qua đi; kìa, những điều mới đã đến[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “người ấy là một tạo vật mới.” Tiếng Hy Lạp dùng một câu tỉnh lược, sát nghĩa là: “nếu ai ở trong Đấng Mê-si—sự sáng tạo mới.”'
    reason: alternative_reading
  - marker: b
    text: 'Nhiều bản dịch có: “mọi sự đều trở nên mới.” Tuy nhiên, bản văn SBLGNT ở đây chỉ có “những điều mới đã đến,” không có từ tương ứng với “mọi sự.”'
    reason: textual_variant
lexical_decisions:
- source_word: ὥστε
  choice: Vì vậy
  rationale: Đánh dấu kết luận suy ra từ lập luận trước đó; cách diễn đạt tự nhiên và trang trọng trong tiếng Việt.
- source_word: εἴ τις
  choice: nếu ai
  rationale: Giữ nghĩa điều kiện phiếm chỉ, bao quát, không thêm sắc thái giới tính.
- source_word: ἐν Χριστῷ
  choice: ở trong Đấng Mê-si
  rationale: Giữ ý nghĩa tước hiệu của Χριστός và ngôn ngữ hiệp nhất với Đấng Mê-si đặc trưng của Phao-lô.
- source_word: καινὴ κτίσις
  choice: thì có một tạo vật mới
  rationale: Nguyên văn không có động từ và mang tính tỉnh lược. Cách bổ sung này giữ được khả năng nói về thực tại sáng tạo mới mà không buộc cụm từ chỉ quy về cá nhân; cách hiểu cá nhân được nêu trong chú thích.
- source_word: τὰ ἀρχαῖα
  choice: những điều cũ
  rationale: Phản ánh tính từ trung tính số nhiều được dùng như danh từ, đồng thời giữ phạm vi quy chiếu rộng.
- source_word: παρῆλθεν
  choice: đã qua đi
  rationale: Diễn đạt tự nhiên thể aorist và sự chấm dứt của những điều cũ trong tương phản với thực tại mới.
- source_word: ἰδοὺ
  choice: kìa
  rationale: Giữ chức năng thu hút sự chú ý và sắc thái tu từ trang trọng mà vẫn quen thuộc trong tiếng Việt.
- source_word: γέγονεν καινά
  choice: những điều mới đã đến
  rationale: Giữ số nhiều trung tính của καινά và diễn tả trạng thái hiện tại phát sinh từ một biến đổi đã xảy ra, không tự ý thêm từ 'mọi'.
theological_decisions:
- issue: Dịch Χριστῷ như tước hiệu hay dạng gần với tên riêng
  choice: ở trong Đấng Mê-si
  alternative: ở trong Đấng Christ
  rationale: Χριστός vẫn mang ý nghĩa tước hiệu trong công thức của Phao-lô; 'Đấng Mê-si' bảo tồn ý nghĩa ấy thay vì chỉ dùng dạng tên gọi quen thuộc.
- issue: Cách hoàn chỉnh cụm tỉnh lược καινὴ κτίσις
  choice: thì có một tạo vật mới
  alternative: người ấy là một tạo vật mới
  rationale: Tiếng Hy Lạp không có động từ hay chủ ngữ được nói rõ. Bản chính tránh thu hẹp câu chỉ vào sự đổi mới cá nhân, còn cách hiểu ấy được bảo tồn trong chú thích.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “Đấng Mê-si” để thể hiện tước hiệu; dùng “kìa” để bảo tồn lực tu từ của ἰδοὺ. Cấu trúc câu giữ tính súc tích và sự mơ hồ có chủ ý của nguyên văn.
