revisions:
- from: Vì vậy, nếu ai ở trong Đấng Mê-si thì có một tạo vật mới[a]; những điều cũ đã qua đi; kìa, những điều mới đã đến[b].
  to: Vì vậy, nếu ai ở trong Đấng Mê-si thì có một sự sáng tạo mới[a]; những điều cũ đã qua đi; kìa, những điều mới đã đến[b].
  rationale: Chỉ sửa cách dịch κτίσις trong bản chính và phần diễn giải sát nghĩa của chú thích a. “Sự sáng tạo mới” phù hợp với mệnh đề tồn tại được bổ sung trong tiếng Việt, đồng thời duy trì sự rộng mở của câu Hy Lạp; chú thích vẫn nêu cách đọc cá nhân hợp lý là “người ấy là một tạo vật mới.” Không thay đổi nội dung, số nhiều, hay sắc thái hoàn thành của các phần còn lại.
