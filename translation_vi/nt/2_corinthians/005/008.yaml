revisions:
- from: Vậy, chúng tôi đầy can đảm và thà lìa xa thân thể để được ở nhà bên Chúa[a].
  to: Vì thế, chúng tôi đầy can đảm, và chúng tôi thích hơn là lìa xa thân thể và ở nhà với Chúa[a].
  rationale: Bản sửa giữ phép đối chiếu hình ảnh của Phao-lô, đồng thời sửa cấu trúc để hai vế “lìa xa thân thể” và “ở nhà với Chúa” cùng là đối tượng của sự ưa chọn hơn, đúng với cú pháp Hy Lạp. “Ở nhà với Chúa” không thêm diễn giải về cái chết, thiên đàng, hay trạng thái trung gian.
