source:
  edition: SBLGNT
  text: θαρροῦμεν δὲ καὶ εὐδοκοῦμεν μᾶλλον ἐκδημῆσαι ἐκ τοῦ σώματος καὶ ἐνδημῆσαι πρὸς τὸν κύριον·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/008.yaml
  text: So we are confident and would rather be away from the body and at home with the Lord[a].
translation:
  language: vi
  text: Vì thế, chúng tôi đầy can đảm, và chúng tôi thích hơn là lìa xa thân thể và ở nhà với Chúa[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “vắng mặt khỏi thân thể và ở với Chúa.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: θαρροῦμεν
  choice: chúng tôi đầy can đảm
  rationale: Động từ hiện tại diễn tả lòng can đảm vững vàng. Cách nói này tự nhiên trong tiếng Việt và nối lại ý “luôn đầy can đảm” ở câu 6.
- source_word: δὲ
  choice: Vậy
  rationale: Ở đây δέ tiếp nối và rút ý từ lập luận trước, không biểu thị sự tương phản mạnh.
- source_word: καὶ
  choice: và
  rationale: Liên từ nối θαρροῦμεν với εὐδοκοῦμεν; giữ lại quan hệ phối hợp của nguyên văn.
- source_word: εὐδοκοῦμεν μᾶλλον
  choice: thà
  rationale: Trong kết cấu có μᾶλλον, cụm này diễn tả sự ưa chọn hơn. “Thà” truyền đạt gọn và tự nhiên ý muốn chọn tình trạng được nói đến sau.
- source_word: ἐκδημῆσαι
  choice: lìa xa
  rationale: Động từ chỉ tình trạng xa nhà hoặc vắng mặt. “Lìa xa” giữ được ý rời khỏi một phạm vi mà không trực tiếp diễn giải thành cái chết.
- source_word: ἐκ τοῦ σώματος
  choice: thân thể
  rationale: Giữ danh từ σῶμα theo nghĩa trực tiếp; “lìa xa thân thể” diễn đạt tự nhiên quan hệ do ἐκ chỉ ra.
- source_word: ἐνδημῆσαι
  choice: được ở nhà
  rationale: Động từ đối nghĩa với ἐκδημῆσαι và mang hình ảnh cư ngụ tại quê nhà. “Ở nhà” bảo toàn phép ẩn dụ của Phao-lô; thêm “được” giúp câu tiếng Việt tự nhiên mà không đổi nội dung.
- source_word: πρὸς τὸν κύριον
  choice: bên Chúa
  rationale: Trong kết cấu này, πρός diễn tả sự hiện diện gần gũi với Chúa. “Bên Chúa” tự nhiên, đồng thời tránh khiến “ở nhà với Chúa” bị hiểu như cùng ở trong một căn nhà theo nghĩa đen.
theological_decisions:
- issue: Có nên biến hình ảnh của Phao-lô thành lời khẳng định minh nhiên về cái chết, thiên đàng hay trạng thái trung gian hay không
  choice: Giữ nguyên sự đối chiếu giữa lìa xa thân thể và ở nhà bên Chúa.
  alternative: Diễn ý thành “chết và lên thiên đàng ở với Chúa.”
  rationale: Câu này gợi mạnh đến sự hiện diện với Chúa sau khi lìa thân thể, nhưng nguyên văn không dùng các từ “chết” hay “thiên đàng.” Bản dịch không thêm lời giải thích nhằm quyết định thay cho độc giả điều nguyên văn để ở dạng hình ảnh.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cặp “lìa xa… ở nhà” bảo tồn sự tương phản ἐκδημέω/ἐνδημέω, dù tiếng Việt không thể tái hiện trọn vẹn lối chơi chữ về xa nhà và ở quê nhà. Dấu chú thích [a] được đặt ngay sau “Chúa” trong chính văn.
