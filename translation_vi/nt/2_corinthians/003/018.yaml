id: 2CO.3.18
reference: 2 Corinthians 3:18
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἡμεῖς δὲ πάντες ἀνακεκαλυμμένῳ προσώπῳ τὴν δόξαν κυρίου κατοπτριζόμενοι τὴν αὐτὴν εἰκόνα μεταμορφούμεθα ἀπὸ δόξης εἰς δόξαν, καθάπερ ἀπὸ κυρίου πνεύματος.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/018.yaml
  text: And we all[a], with unveiled face, beholding the glory of the Lord as in a mirror, are being transformed into the same image from glory to glory, just as from the Lord[b], the Spirit.
translation:
  language: vi
  text: Còn tất cả chúng ta, với gương mặt không bị che phủ, đang chiêm ngưỡng vinh quang của Chúa như trong gương[a], thì đang được biến đổi thành chính hình ảnh ấy, từ vinh quang đến vinh quang, như do Chúa, là Thần Linh, mà đến.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đang phản chiếu vinh quang của Chúa như một tấm gương.”'
    reason: alternative_reading
  - marker: b
    text: 'Cũng có thể dịch: “bởi Chúa là Thần Linh”; hoặc: “bởi Thần Linh của Chúa.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ἡμεῖς δὲ πάντες
  choice: Còn tất cả chúng ta
  rationale: Diễn đạt đầy đủ đại từ nhấn mạnh, liên từ chuyển ý và phạm vi bao quát của πάντες bằng tiếng Việt tự nhiên.
- source_word: ἀνακεκαλυμμένῳ προσώπῳ
  choice: với gương mặt không bị che phủ
  rationale: Giữ ý trạng thái hiện tại do việc vén màn đem lại và giữ danh từ số ít có tính tập thể của nguyên văn.
- source_word: τὴν δόξαν κυρίου
  choice: vinh quang của Chúa
  rationale: Chuyển trực tiếp cấu trúc sở hữu; “Chúa” là cách gọi trang trọng, phổ thông cho κύριος.
- source_word: κατοπτριζόμενοι
  choice: đang chiêm ngưỡng ... như trong gương
  rationale: Phù hợp với tiến trình nhìn thấy vinh quang rồi được biến đổi; nghĩa có thể có là “phản chiếu như gương” được giữ trong chú thích.
- source_word: τὴν αὐτὴν εἰκόνα
  choice: cùng một hình ảnh ấy
  rationale: Giữ mối liên hệ với vinh quang của Chúa và nhấn mạnh chính hình ảnh đó.
- source_word: μεταμορφούμεθα
  choice: được biến đổi
  rationale: Giữ thể bị động; từ “đang” ở mệnh đề liền trước cùng ngữ cảnh diễn tả tiến trình đang tiếp diễn mà không làm câu tiếng Việt nặng nề.
- source_word: ἀπὸ δόξης εἰς δόξαν
  choice: từ vinh quang đến vinh quang
  rationale: Giữ nguyên cách nói cô đọng và không diễn giải thêm thành các mức độ.
- source_word: καθάπερ ἀπὸ κυρίου πνεύματος
  choice: đúng như bởi Chúa, là Thần Linh
  rationale: Giữ cấu trúc súc tích và quan hệ đồng vị khả dĩ của nguyên văn, đồng thời không âm thầm loại bỏ những cách phân tích cú pháp khác.
theological_decisions:
- issue: Nghĩa của κατοπτριζόμενοι
  choice: chiêm ngưỡng vinh quang của Chúa như trong gương
  alternative: phản chiếu vinh quang của Chúa như một tấm gương
  rationale: Mạch văn từ việc thấy vinh quang đến việc được biến đổi nghiêng về nghĩa “chiêm ngưỡng”, nhưng động từ Hy Lạp thực sự có thể mang nghĩa “phản chiếu”, nên phương án ấy được bảo lưu trong chú thích.
- issue: Quan hệ giữa κυρίου và πνεύματος trong cụm kết
  choice: bởi Chúa, là Thần Linh
  alternative: bởi Chúa là Thần Linh; hoặc bởi Thần Linh của Chúa
  rationale: Cụm Hy Lạp ngắn gọn và có thể được phân tích theo nhiều cách. Bản chính giữ khả năng đồng vị mà không diễn giải giáo lý quá mức; các cách hiểu khác được nêu trong chú thích.
translation_notes:
  register: Văn phong tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Câu giữ hình ảnh “gương”, công thức cô đọng “từ vinh quang đến vinh quang” và sự mơ hồ có thật trong cụm kết. Dùng “Thần Linh” thay vì tự thêm tính từ “Thánh” vốn không hiện diện trong câu Hy Lạp.
