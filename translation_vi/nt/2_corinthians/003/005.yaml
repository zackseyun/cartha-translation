revisions:
- from: Không phải chúng tôi tự mình có đủ khả năng[a] để coi[b] bất cứ điều gì là xuất phát từ chính mình; trái lại, khả năng của chúng tôi đến từ Đức Chúa Trời.
  to: Không phải là tự chúng tôi có đủ khả năng[a] để coi[b] bất cứ điều gì là xuất phát từ chính chúng tôi; trái lại, khả năng của chúng tôi là từ Đức Chúa Trời.
  rationale: Sửa tối thiểu để câu tiếng Việt tự nhiên và chuẩn hơn, đồng thời biểu đạt nhất quán hai lần đại từ phản thân số nhiều trong nguyên văn. Không thay đổi phạm vi rộng của lời phủ định, sự liên kết từ vựng giữa “đủ khả năng” và “khả năng”, hay ý Đức Chúa Trời là nguồn của khả năng ấy.
