  text: οὐχ ὅτι ⸂ἀφ’ ἑαυτῶν ἱκανοί ἐσμεν⸃ λογίσασθαί τι ὡς ἐξ ⸀αὑτῶν, ἀλλ’ ἡ ἱκανότης ἡμῶν ἐκ τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/005.yaml
  text: Not that we are sufficient in ourselves to consider anything as coming from ourselves[a], but our sufficiency is from God[b],
translation:
  language: vi
  text: Không phải là tự chúng tôi có đủ khả năng[a] để coi[b] bất cứ điều gì là xuất phát từ chính chúng tôi; trái lại, khả năng của chúng tôi là từ Đức Chúa Trời.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “đủ sức” hoặc “có năng lực”; từ cùng gốc ở vế sau được dịch là “khả năng”.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “tính” hoặc “kể”.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχ ὅτι
  choice: Không phải
  rationale: Cụm từ mở đầu một lời đính chính, không nêu nguyên nhân; cách dịch này giữ được bước chuyển trong lập luận của Phao-lô và tự nhiên trong tiếng Việt.
- source_word: ἀφ’ ἑαυτῶν
  choice: tự mình
  rationale: Trong kết cấu với ἱκανοί ἐσμεν, cụm này nói đến khả năng vốn có hoặc do bản thân mà có.
- source_word: ἱκανοί
  choice: có đủ khả năng
  rationale: Diễn đạt rõ ý đủ sức hay đủ năng lực, đồng thời duy trì liên hệ từ vựng với ἱκανότης ở vế sau.
- source_word: λογίσασθαί
  choice: coi
  rationale: Động từ chỉ sự suy xét hay đánh giá một điều là thế nào; “coi ... là” phù hợp tự nhiên với cấu trúc ὡς trong câu.
- source_word: τι
  choice: bất cứ điều gì
  rationale: Trong ngữ cảnh phủ định, cách diễn đạt này phản ánh phạm vi bất định và rộng của đại từ.
- source_word: ὡς ἐξ αὑτῶν
  choice: là xuất phát từ chính mình
  rationale: Cách dịch làm rõ ý nguồn gốc mà không thêm nội dung ngoài bản văn.
- source_word: ἡ ἱκανότης ἡμῶν
  choice: khả năng của chúng tôi
  rationale: “Khả năng” tự nhiên trong tiếng Việt và giữ mối liên hệ với “có đủ khả năng” ở vế trước.
- source_word: ἐκ τοῦ θεοῦ
  choice: đến từ Đức Chúa Trời
  rationale: Diễn đạt trực tiếp Đức Chúa Trời là nguồn của khả năng ấy.
theological_decisions:
- issue: Phạm vi lời khẳng định về khả năng của con người
  choice: Giữ cách nói rộng về khả năng không xuất phát từ bản thân.
  alternative: Thu hẹp câu này thành năng lực dành riêng cho chức vụ sứ đồ.
  rationale: Ngữ cảnh trực tiếp nói về chức vụ, nhưng câu Hy Lạp tự nó có phạm vi rộng hơn; bản dịch không nên âm thầm thu hẹp điều Phao-lô nói.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “chúng tôi” phù hợp với lời tự thuật của Phao-lô; dùng dấu chấm phẩy và “trái lại” để làm rõ sự tương phản giữa khả năng tự thân và khả năng đến từ Đức Chúa Trời.
