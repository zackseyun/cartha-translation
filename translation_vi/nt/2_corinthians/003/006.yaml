    rationale: Không sai nghĩa, nhưng cần chỉnh nhẹ để đạt tiếng Việt hiện đại, sáng rõ hơn.
  - severity: low
    issue: Chưa có chú thích cho phương án từ vựng thay thế của διακόνους trong audit trail tiếng Anh.
    rationale: Thêm chú thích không đổi nghĩa bản văn chính, đồng thời ghi nhận lựa chọn thay thế “ministers” một cách trung tính trong tiếng Việt.
