revisions:
- from: Ngài cũng làm cho chúng tôi đủ khả năng làm những người phục vụ một giao ước mới, không phải của văn tự nhưng của Thánh Linh[a]; vì văn tự[b] giết chết, còn Thánh Linh ban sự sống.
  to: Ngài cũng ban cho chúng tôi năng lực để làm những người phục vụ[b] của một giao ước mới, không phải của văn tự nhưng của Thánh Linh[a]; vì văn tự[c] giết chết, còn Thánh Linh ban sự sống.
  rationale: Chỉnh nhẹ cách diễn đạt để tránh sự lặp và cấu trúc gượng, nhưng không thay đổi quan hệ cú pháp hoặc nội dung của nguyên văn. Giữ “Thánh Linh” với chú thích “tinh thần” để không xóa mơ hồ về cách viết hoa không có trong tiếng Hy Lạp. Bổ sung chú thích từ vựng cho διακόνους, tương ứng audit trail, với cách diễn đạt không áp đặt chức danh giáo hội.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T19:25:13Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch chuyển tải đúng các thành tố chính: Đức Chúa Trời làm cho “chúng tôi” có năng lực, họ là người phục vụ của một giao ước mới, và có sự đối lập giữa γράμμα với πνεῦμα, cũng như giữa giết chết với ban sự sống. “Thánh Linh” là một cách hiểu có cơ sở trong ngữ cảnh, và chú thích đã giữ phương án thay thế.'
  naturalness: Cụm “làm cho chúng tôi đủ khả năng làm những người phục vụ” hơi lặp và chưa tự nhiên trong tiếng Việt hiện đại. “Ban cho chúng tôi năng lực để làm người phục vụ” rõ, tự nhiên, và vẫn phản ánh ý khiến cho có đủ tư cách/năng lực của ἱκάνωσεν.
  terminology: “Giao ước mới,” “văn tự,” và “Thánh Linh” phù hợp với văn phong Kinh Thánh trang trọng hiện đại. “Văn tự” giữ được tính cô đọng và không thu hẹp nghĩa quá sớm thành luật Môi-se; chú thích “luật thành văn” là hữu ích. Thêm chú thích về phương án “người thi hành chức vụ” giúp phản ánh audit trail của διακόνους mà không biến lựa chọn chính thành một chức danh giáo hội.
  issues:
