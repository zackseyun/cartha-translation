  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὃς καὶ ἱκάνωσεν ἡμᾶς διακόνους καινῆς διαθήκης, οὐ γράμματος ἀλλὰ πνεύματος, τὸ γὰρ γράμμα ἀποκτέννει, τὸ δὲ πνεῦμα ζῳοποιεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/006.yaml
  text: who also made us competent as servants of a new covenant[a], not of the letter but of the Spirit; for the letter kills[c][b], but the Spirit gives life.
translation:
  language: vi
  text: Ngài cũng ban cho chúng tôi năng lực để làm những người phục vụ[b] của một giao ước mới, không phải của văn tự nhưng của Thánh Linh[a]; vì văn tự[c] giết chết, còn Thánh Linh ban sự sống.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “tinh thần” ở cả hai chỗ.
    reason: alternative_reading
  - marker: b
    text: Cũng có thể dịch là “những người thi hành chức vụ”.
    reason: lexical_alternative
  - marker: c
    text: “Văn tự” cũng có thể được hiểu là “luật thành văn”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἱκάνωσεν
  choice: làm cho chúng tôi đủ khả năng
  rationale: Diễn đạt hành động khiến họ có năng lực và tư cách đảm nhận sự phục vụ, không hàm ý chỉ là sự công nhận chính thức.
- source_word: διακόνους
  choice: những người phục vụ
  rationale: Giữ nét nghĩa phục vụ của danh từ Hy Lạp và tránh áp đặt một chức vụ giáo hội hình thành về sau.
- source_word: καινῆς διαθήκης
  choice: một giao ước mới
  rationale: Phản ánh tự nhiên cụm danh từ không có mạo từ trong tiếng Hy Lạp, đồng thời giữ nguyên phạm trù giao ước trong lập luận của Phao-lô.
- source_word: γράμματος / γράμμα
  choice: văn tự
  rationale: Giữ hình ảnh cô đọng và sự đối lập với πνεῦμα; cách hiểu hẹp hơn là 'luật thành văn' được ghi ở chú thích.
- source_word: πνεύματος / πνεῦμα
  choice: Thánh Linh
  rationale: Trong bối cảnh giao ước mới, từ này nhiều khả năng chỉ Đức Thánh Linh; cách viết hoa thể hiện nhận định ấy nhưng sự mơ hồ của nguyên văn được giữ trong chú thích.
- source_word: ἀποκτέννει
  choice: giết chết
  rationale: Trực tiếp, mạnh và tương ứng với động từ hiện tại trong nguyên văn.
- source_word: ζῳοποιεῖ
  choice: ban sự sống
  rationale: Tự nhiên trong tiếng Việt hiện đại và giữ rõ hành động làm cho sống.
theological_decisions:
- issue: πνεῦμα nên được hiểu là 'Thánh Linh' hay 'tinh thần'
  choice: Thánh Linh
  alternative: tinh thần
  rationale: Bối cảnh giao ước mới và hành động ban sự sống nghiêng về Đức Thánh Linh; tuy nhiên chữ Hy Lạp không phân biệt viết hoa hay viết thường, nên giữ cách hiểu khác trong chú thích.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “những người phục vụ” thay cho thuật ngữ chức vụ; giữ nhịp đối lập cô đọng “văn tự… Thánh Linh” của nguyên văn.
