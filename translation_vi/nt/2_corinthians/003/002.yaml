reference: 2 Corinthians 3:2
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἡ ἐπιστολὴ ἡμῶν ὑμεῖς ἐστε, ἐγγεγραμμένη ἐν ταῖς καρδίαις ἡμῶν, γινωσκομένη καὶ ἀναγινωσκομένη ὑπὸ πάντων ἀνθρώπων·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/002.yaml
  text: You are our letter[a], written in our hearts, known and read by all people.
translation:
  language: vi
  text: Chính anh chị em là thư của chúng tôi, được viết trong lòng chúng tôi, được mọi người biết đến và đọc.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “được mọi người nhận biết và đọc.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡ ἐπιστολὴ ἡμῶν
  choice: thư của chúng tôi
  rationale: Giữ nguyên hình ảnh ẩn dụ về một bức thư và quan hệ sở hữu do ἡμῶν biểu thị; “thư” là cách nói hiện đại, tự nhiên hơn “thư tín” trong câu này.
- source_word: ὑμεῖς ἐστε
  choice: Chính anh chị em là
  rationale: Đại từ ὑμεῖς được nêu rõ và đứng ở vị trí nhấn mạnh; “chính anh chị em” truyền đạt sắc thái ấy. “Anh chị em” phù hợp với lời trực tiếp gửi cả cộng đồng tín hữu.
- source_word: ἐγγεγραμμένη
  choice: được viết
  rationale: Phân từ hoàn thành bị động diễn tả điều đã được viết và vẫn còn ở trạng thái ấy; “được viết” tự nhiên và duy trì hình ảnh bức thư.
- source_word: ἐν ταῖς καρδίαις ἡμῶν
  choice: trong lòng chúng tôi
  rationale: “Trong lòng” là cách diễn đạt tiếng Việt tự nhiên cho ἐν ταῖς καρδίαις và vẫn giữ ý nội tâm sâu kín, không chuyển thành cách giải thích khác.
- source_word: γινωσκομένη
  choice: được mọi người biết đến
  rationale: γινώσκω ở đây có thể mang nghĩa được biết hoặc được nhận biết. “Biết đến” tự nhiên khi nói về điều công khai trước mọi người, đồng thời không xóa khả năng dịch “nhận biết”.
- source_word: ἀναγινωσκομένη
  choice: và đọc
  rationale: Giữ nghĩa trực tiếp “đọc”, qua đó duy trì phép ẩn dụ về bức thư.
- source_word: ὑπὸ πάντων ἀνθρώπων
  choice: được mọi người
  rationale: Cụm từ chỉ tác nhân và có phạm vi phổ quát; “mọi người” bao hàm mọi giới và tự nhiên trong tiếng Việt hiện đại.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “anh chị em” cho số nhiều ὑμεῖς nhằm nói với toàn thể cộng đồng; dùng “lòng” thay vì “trái tim” vì tự nhiên hơn trong ngữ cảnh chỉ nội tâm. Dấu [a] được đặt sau toàn bộ cặp “biết đến và đọc” vì chú thích liên quan đến lựa chọn nghĩa của γινωσκομένη trong cặp phân từ.
