source:
  edition: SBLGNT
  text: Ἀρχόμεθα πάλιν ἑαυτοὺς ⸀συνιστάνειν; ⸀ἢ μὴ χρῄζομεν ὥς τινες συστατικῶν ἐπιστολῶν πρὸς ὑμᾶς ἢ ἐξ ⸀ὑμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/001.yaml
  text: Are we beginning again to commend ourselves? Or do we need[a], like some, letters of recommendation to you or from you?
translation:
  language: vi
  text: Chúng tôi lại bắt đầu tự tiến cử sao? Hay chúng tôi, như một số người, cần những thư giới thiệu gửi đến anh chị em hoặc từ anh chị em sao?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀρχόμεθα πάλιν
  choice: lại bắt đầu
  rationale: Diễn đạt tự nhiên sắc thái hiện tại và ý lặp lại của động từ cùng trạng từ πάλιν.
- source_word: ἑαυτοὺς συνιστάνειν
  choice: tự tiến cử mình
  rationale: Giữ sắc thái tự trình bày bản thân một cách thuận lợi trong câu hỏi tu từ; “tiến cử” cũng liên kết tự nhiên với thư giới thiệu ở vế sau.
- source_word: ἢ μὴ χρῄζομεν
  choice: Hay chúng tôi ... cần ... sao?
  rationale: Dạng câu hỏi tu từ với μή hàm ý câu trả lời phủ định; tiếng Việt truyền đạt tự nhiên bằng cấu trúc kết thúc với “sao?” mà không biến hàm ý thành lời phủ định minh nhiên.
- source_word: ὥς τινες
  choice: cũng như một số người
  rationale: Giữ phép so sánh với một nhóm người không được xác định cụ thể.
- source_word: συστατικῶν ἐπιστολῶν
  choice: thư giới thiệu
  rationale: Đây là cách gọi hiện đại, rõ nghĩa cho thư dùng để giới thiệu hoặc chứng thực một người.
- source_word: πρὸς ὑμᾶς
  choice: gửi đến anh chị em
  rationale: Bảo toàn hướng đến người Cô-rinh-tô của πρός với đối cách.
- source_word: ἢ ἐξ ὑμῶν
  choice: hoặc do anh chị em viết
  rationale: Diễn đạt nguồn gốc được chỉ bởi ἐξ theo cách tự nhiên trong tiếng Việt; trong ngữ cảnh, thư ấy đến từ cộng đồng người nhận.
theological_decisions:
- issue: Lực của μή trong câu hỏi tu từ
  choice: Giữ dưới dạng câu hỏi hàm ý câu trả lời phủ định
  alternative: 'Dịch minh nhiên: “Dĩ nhiên chúng tôi không cần...”'
  rationale: Bản Hy Lạp gợi chờ đợi câu trả lời phủ định nhưng vẫn giữ hình thức câu hỏi; bản dịch không nên biến hàm ý thành một lời khẳng định trực tiếp.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “chúng tôi” cho ngôi thứ nhất số nhiều và “anh chị em” cho ὑμᾶς, phù hợp lối xưng hô cộng đồng trong thư tín mà không áp đặt giới tính nam. Hai câu hỏi tu từ và sự tương ứng giữa “tự tiến cử” với “thư giới thiệu” được giữ rõ.
