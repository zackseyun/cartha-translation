id: 2CO.3.11
reference: 2 Corinthians 3:11
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἰ γὰρ τὸ καταργούμενον διὰ δόξης, πολλῷ μᾶλλον τὸ μένον ἐν δόξῃ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/011.yaml
  text: For if what was being brought to an end came with glory[c][b][a], much more what remains is in glory.
translation:
  language: vi
  text: Vì nếu điều đang bị chấm dứt đã có vinh quang[a], thì điều còn lại càng ở trong vinh quang hơn biết bao!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Theo sát chữ: “qua vinh quang” hoặc “nhờ vinh quang.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: καταργούμενον
  choice: điều đang bị chấm dứt
  rationale: Phân từ hiện tại bị động mang nghĩa điều đang bị làm cho mất hiệu lực hoặc bị đưa đến chỗ chấm dứt. Cách dịch này sát hơn với động thái đang diễn ra của nguyên ngữ và tránh thu hẹp nghĩa thành hình ảnh “phai tàn”.
- source_word: διὰ δόξης
  choice: đã đến trong vinh quang
  rationale: διά với sở hữu cách theo sát chữ là “qua vinh quang”; trong tiếng Việt, “đến trong vinh quang” diễn đạt tự nhiên việc điều tạm thời xuất hiện kèm theo vinh quang, đồng thời giữ sự khác biệt với ἐν δόξῃ ở vế sau.
- source_word: μένον
  choice: điều còn lại
  rationale: Giữ cấu trúc phân từ trung tính được danh từ hóa và nghĩa cơ bản “còn lại, tiếp tục tồn tại”, không tự ý nêu đích danh giao ước hay chức vụ.
- source_word: ἐν δόξῃ
  choice: ở trong vinh quang
  rationale: Dịch trực tiếp giới từ ἐν, bảo toàn ý về trạng thái hoặc phạm vi vinh quang và thế đối xứng tu từ của câu.
- source_word: πολλῷ μᾶλλον
  choice: càng ... hơn biết bao
  rationale: 'Diễn đạt tự nhiên sức nhấn mạnh của phép so sánh: mức độ vượt trội rất lớn.'
theological_decisions:
- issue: Bản chất của sự tương phản giữa điều tạm thời và điều còn lại
  choice: Giữ nguyên hai cụm trung tính “điều đang bị chấm dứt” và “điều còn lại”.
  alternative: Nêu rõ đây là giao ước cũ và giao ước mới, hoặc dịch điều thứ nhất là “điều đang phai tàn”.
  rationale: Câu Hy Lạp không trực tiếp gọi tên hai giao ước mà dùng các phân từ trung tính được danh từ hóa. Giữ cách nói này bảo toàn lập luận theo văn cảnh mà không đưa phần diễn giải thần học vào chính câu.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại. Dùng “vinh quang” theo thuật ngữ Kinh Thánh quen thuộc; cấu trúc đối xứng được giữ rõ, đồng thời câu vẫn dễ hiểu đối với độc giả phổ thông.
