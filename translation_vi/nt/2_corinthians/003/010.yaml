revisions:
- from: Thật vậy, điều từng được làm cho vinh hiển lại không còn vinh hiển về phương diện này, vì cớ sự vinh hiển vượt trội hơn.[a]
  to: Thật vậy, điều đã được làm cho vinh hiển, xét về phương diện này, đã không được làm cho vinh hiển, vì sự vinh hiển vượt trội.[a]
  rationale: Sửa phủ định để không thêm ý “không còn,” đồng thời giữ nghịch lý tu từ và sự lặp lại của nhóm từ δοξ- trong nguyên văn. “Xét về phương diện này” tiếp tục giới hạn lời phủ định theo nghĩa so sánh; bản dịch không xác định thêm “giao ước” hay “chức vụ,” cũng không thêm đối tượng trực tiếp cho “vượt trội.”
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T19:25:10Z'
review_pass:
  verdict: revise
  source_fidelity: 'Cần sửa “không còn vinh hiển”: “còn” thêm ý thời gian/biến đổi (“no longer”) không có trong οὐ δεδόξασται. Câu Hy Lạp tạo nghịch lý có chủ ý giữa “điều đã được làm cho vinh hiển” và “đã không được làm cho vinh hiển,” với sự phủ định mang tính so sánh được giới hạn bởi ἐν τούτῳ τῷ μέρει.'
  naturalness: Bản sửa vẫn giữ nhịp điệu trang trọng, hiện đại và dễ hiểu hơn khi dùng “vì” thay cho “vì cớ.” Sự lặp lại “được làm cho vinh hiển” là có chủ ý để phản ánh lối chơi chữ cùng gốc δοξ- của nguyên văn.
  terminology: “Vinh hiển” phù hợp cho δόξα trong ngữ cảnh này. Không nên thêm đối tượng cho “vượt trội” vào bản văn chính, vì bổ ngữ so sánh chỉ được hiểu từ ngữ cảnh.
  issues:
  - severity: medium
    issue: “không còn vinh hiển” thêm sắc thái thời gian không có trong nguyên văn.
    rationale: οὐ δεδόξασται là phủ định của thể hoàn thành bị động, không diễn đạt rõ ý “không còn.” Trong ngữ cảnh, ý là vinh hiển trước kia bị coi như không được làm cho vinh hiển khi so với vinh hiển vượt trội.
  - severity: low
    issue: Ghi chú hiện tại thêm rõ đối tượng so sánh bằng “điều ấy.”
    rationale: Đây là một cách giải thích hợp ngữ cảnh, nhưng không phải một phương án dịch sát của riêng cụm τῆς ὑπερβαλλούσης δόξης. Ghi chú nên nêu phương án từ vựng không thêm đối tượng.
  revised_text: Thật vậy, điều đã được làm cho vinh hiển, xét về phương diện này, đã không được làm cho vinh hiển, vì sự vinh hiển vượt trội.[a]
