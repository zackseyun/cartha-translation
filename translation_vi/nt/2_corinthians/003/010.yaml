id: 2CO.3.10
reference: 2 Corinthians 3:10
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ γὰρ οὐ δεδόξασται τὸ δεδοξασμένον ἐν τούτῳ τῷ μέρει ⸀εἵνεκεν τῆς ὑπερβαλλούσης δόξης·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/010.yaml
  text: For indeed[a], what had been glorified has not been glorified in this respect, because of the glory that surpasses it.
translation:
  language: vi
  text: Thật vậy, điều đã được làm cho vinh hiển, xét về phương diện này, đã không được làm cho vinh hiển, vì sự vinh hiển vượt trội.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “sự vinh hiển vượt hơn.”'
    reason: Phương án diễn đạt khác cho phân từ ὑπερβαλλούσης; đối tượng so sánh được hiểu từ ngữ cảnh, không được nêu rõ trong tiếng Hy Lạp.
lexical_decisions:
- source_word: καὶ γὰρ
  choice: Thật vậy
  rationale: Diễn đạt tự nhiên sắc thái giải thích và nhấn mạnh nhẹ của tổ hợp καὶ γὰρ trong tiếng Việt hiện đại.
- source_word: οὐ δεδόξασται
  choice: không còn vinh hiển
  rationale: 'Diễn tả kết quả hiện tại của thể hoàn thành trong phép so sánh: điều ấy bị xem như không có vinh hiển khi đặt bên sự vinh hiển vượt trội, chứ không phủ nhận rằng trước đó nó thật sự có vinh hiển.'
- source_word: τὸ δεδοξασμένον
  choice: điều từng được làm cho vinh hiển
  rationale: Giữ dạng phân từ thụ động được danh từ hóa mà không tự ý thêm danh từ như “giao ước” hay “chức vụ”; “từng” đánh dấu trạng thái đã có trước.
- source_word: ἐν τούτῳ τῷ μέρει
  choice: về phương diện này
  rationale: Giữ rõ giới hạn của lời phủ định và phù hợp với lối diễn đạt trang trọng, tự nhiên trong tiếng Việt.
- source_word: εἵνεκεν
  choice: vì cớ
  rationale: Truyền đạt quan hệ nguyên nhân một cách rõ ràng, trang trọng nhưng vẫn dễ hiểu.
- source_word: τῆς ὑπερβαλλούσης δόξης
  choice: sự vinh hiển vượt trội hơn
  rationale: Bảo toàn lực so sánh của phân từ ὑπερβαλλούσης nhưng không thêm một đại từ chỉ đối tượng so sánh vốn không hiện diện minh nhiên trong tiếng Hy Lạp.
- source_word: δόξα / δεδοξασμένον
  choice: được làm cho vinh hiển ... sự vinh hiển
  rationale: Duy trì sự lặp lại của cùng nhóm từ δοξ- và hiệu quả tu từ trong câu.
theological_decisions:
- issue: Phao-lô có phủ nhận tuyệt đối vinh hiển của điều trước kia hay chỉ phủ nhận theo nghĩa so sánh?
  choice: Lời phủ định mang tính so sánh và được giới hạn bởi cụm “về phương diện này”.
  alternative: Điều trước kia hoàn toàn chưa từng có vinh hiển thật.
  rationale: Ngữ cảnh 2 Cô-rinh-tô 3 xác nhận điều trước kia đã có vinh hiển; tại đây, vinh hiển ấy bị lu mờ đến mức được kể như không còn vinh hiển khi so với sự vinh hiển vượt trội.
- issue: Có nên nói rõ sự vinh hiển mới vượt trội hơn điều gì không?
  choice: Không thêm đối tượng so sánh trong chính câu; ghi chú làm rõ cách hiểu theo ngữ cảnh.
  alternative: Dịch “sự vinh hiển vượt trội hơn nó”.
  rationale: Tiếng Hy Lạp dùng τῆς ὑπερβαλλούσης δόξης mà không nêu bổ ngữ trực tiếp; bản dịch chính bảo tồn mức độ hàm ẩn ấy.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Bản dịch giữ nghịch lý “đã được làm cho vinh hiển” nhưng “không còn vinh hiển”, đồng thời tránh tự ý nêu “giao ước cũ” hoặc “chức vụ cũ” trong câu.
