id: 2CO.3.7
reference: 2 Corinthians 3:7
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Εἰ δὲ ἡ διακονία τοῦ θανάτου ἐν ⸀γράμμασιν ⸀ἐντετυπωμένη λίθοις ἐγενήθη ἐν δόξῃ, ὥστε μὴ δύνασθαι ἀτενίσαι τοὺς υἱοὺς Ἰσραὴλ εἰς τὸ πρόσωπον Μωϋσέως διὰ τὴν δόξαν τοῦ προσώπου αὐτοῦ τὴν καταργουμένην,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/007.yaml
  text: But if the ministry of death[a], engraved in letters on stones, came with glory, so that the sons of Israel were not able to gaze at Moses’ face because of the glory of his face, which was fading away[b],
translation:
  language: vi
  text: Nhưng nếu chức vụ của sự chết, được ghi khắc bằng chữ trên đá, đã đến trong vinh quang, đến nỗi con cái Israel[b] không thể nhìn chăm chú vào mặt Môi-se vì vinh quang của mặt ông—một vinh quang đang phai tàn[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đang bị chấm dứt” hoặc “đang qua đi.”'
    reason: Bảo lưu các sắc thái khả dĩ của καταργουμένην, thay vì chỉ hiểu là sự mờ dần có thể nhìn thấy.
  - marker: b
    text: Nguyên văn sát chữ là “các con trai của Israel”; đây là cách gọi tập thể dân Israel.
    reason: Cho biết hình thức giống đực trong tiếng Hy Lạp mà không dùng một cách diễn đạt dễ bị hiểu là chỉ những người con trai theo nghĩa đen trong bản văn chính.
lexical_decisions:
- source_word: διακονία
  choice: chức vụ
  rationale: Giữ ý về một sự phục vụ được giao phó trong lập luận giao ước của Phao-lô; cách nói này trang trọng và quen thuộc trong văn cảnh Kinh Thánh.
- source_word: τοῦ θανάτου
  choice: của sự chết
  rationale: Giữ nguyên cấu trúc sở hữu cô đọng và sắc bén của tiếng Hy Lạp, không diễn giải thành “đem lại sự chết” hay “dẫn đến sự chết”.
- source_word: ἐν γράμμασιν ἐντετυπωμένη λίθοις
  choice: được khắc bằng chữ trên những tấm đá
  rationale: “Khắc bằng chữ” thể hiện dấu chữ được in/khắc; “những tấm đá” giữ số nhiều và chất liệu cụ thể mà vẫn tự nhiên trong tiếng Việt, không thêm rõ “bia luật” ngoài nguyên văn.
- source_word: ἐγενήθη ἐν δόξῃ
  choice: đã đến trong vinh quang
  rationale: Phản ánh sắc thái biến cố của ἐγενήθη và giữ sát giới từ ἐν, đồng thời nối tự nhiên với sự tương phản ở câu kế tiếp.
- source_word: ὥστε μὴ δύνασθαι ἀτενίσαι
  choice: đến nỗi … không thể nhìn chăm chú
  rationale: Giữ quan hệ kết quả của ὥστε và lực nghĩa của ἀτενίζω là nhìn cố định, chăm chú.
- source_word: τοὺς υἱοὺς Ἰσραήλ
  choice: con cái Israel
  rationale: Dùng cách gọi tập thể trang trọng, dễ hiểu trong tiếng Việt; chú thích lưu lại hình thức giống đực sát chữ của nguyên văn.
- source_word: εἰς τὸ πρόσωπον Μωϋσέως
  choice: vào mặt Môi-se
  rationale: Đi với “nhìn chăm chú vào” một cách tự nhiên và giữ trọng tâm cụ thể nơi khuôn mặt Môi-se.
- source_word: καταργουμένην
  choice: đang phai tàn
  rationale: Trong ngữ cảnh trực tiếp về vinh quang có thể thấy trên mặt Môi-se, cách dịch này tự nhiên và diễn tả tính tạm thời, nhưng chú thích vẫn bảo lưu nghĩa rộng hơn của động từ.
theological_decisions:
- issue: καταργουμένην nói về sự giảm dần có thể thấy của vinh quang hay việc vinh quang ấy bị chấm dứt/qua đi.
  choice: một vinh quang đang phai tàn
  alternative: một vinh quang đang bị chấm dứt; một vinh quang đang qua đi
  rationale: Tiền ngữ trực tiếp là “vinh quang trên mặt ông”, nên “đang phai tàn” phù hợp với hình ảnh hữu hình; chú thích bảo lưu độ rộng ngữ nghĩa và sức căng thần học của từ.
- issue: Cụm “chức vụ của sự chết” có nên được diễn giải theo quan hệ nguyên nhân hay kết quả hay không.
  choice: giữ “của sự chết”
  alternative: chức vụ đem lại sự chết; chức vụ dẫn đến sự chết
  rationale: Quan hệ chính xác của sở hữu cách không được nguyên văn giải thích tại đây; giữ cấu trúc cô đọng tránh giải quyết thay cho độc giả.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Câu được để mở bằng dấu gạch ngang vì cú pháp điều kiện tiếp tục sang câu 8. Tên riêng dùng dạng “Môi-se” quen thuộc trong tiếng Việt. Các cụm “chức vụ của sự chết” và “trong vinh quang” được giữ khá hình thức để bảo toàn cấu trúc và sức căng trong lập luận của Phao-lô.
