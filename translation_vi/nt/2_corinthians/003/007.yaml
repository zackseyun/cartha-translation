revisions:
- from: Nhưng nếu chức vụ của sự chết, được khắc bằng chữ trên những tấm đá, đã đến trong vinh quang, đến nỗi con cái Israel[b] không thể nhìn chăm chú vào mặt Môi-se vì vinh quang trên mặt ông—một vinh quang đang phai tàn[a]—
  to: Nhưng nếu chức vụ của sự chết, được ghi khắc bằng chữ trên đá, đã đến trong vinh quang, đến nỗi con cái Israel[b] không thể nhìn chăm chú vào mặt Môi-se vì vinh quang của mặt ông—một vinh quang đang phai tàn[a]—
  rationale: 'Chỉnh hai chỗ nhỏ để bám sát nguyên ngữ hơn: bỏ nét nghĩa thêm «tấm» trong λίθοις, và dùng «ghi khắc» cho rõ hình ảnh chữ được khắc trên đá. Đổi «vinh quang trên mặt ông» thành «vinh quang của mặt ông» để phản ánh trực tiếp τοῦ προσώπου αὐτοῦ, không thay đổi nghĩa trong ngữ cảnh. Các chú thích giữ nguyên vì bảo lưu thích đáng tính đa nghĩa của καταργουμένην và hình thức giống đực của υἱούς.'
