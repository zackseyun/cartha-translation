  source_fidelity: Bản dịch giữ tốt cấu trúc điều kiện, thuật ngữ «chức vụ của sự chết», quan hệ kết quả «đến nỗi», và sắc thái đang tiếp diễn của καταργουμένην. Tuy nhiên, «những tấm đá» thêm nét nghĩa “tấm/bia” không có minh nhiên trong λίθοις; nên giữ «trên đá». Cụm «được khắc bằng chữ» cũng nên được chỉnh thành «được ghi khắc bằng chữ» để diễn đạt rõ hơn việc văn tự được khắc trên đá.
  naturalness: Văn phong trang trọng, hiện đại và câu bỏ ngỏ bằng gạch ngang phù hợp vì mệnh đề tiếp tục ở câu sau. «Vinh quang trên mặt ông» tự nhiên trong tiếng Việt và phù hợp ngữ cảnh Xuất Ê-díp-tô Ký, nhưng «vinh quang của mặt ông» bám sát sở hữu cách Hy Lạp hơn mà vẫn có thể hiểu được.
