  to: Qua đó, người ta thấy rõ rằng anh chị em là bức thư đến từ Đấng Mê-si[a], do chúng tôi chuyển đạt, được viết không phải bằng mực mà bằng Thần Khí của Đức Chúa Trời hằng sống[b], không phải trên những bảng đá mà trên những bảng, tức là những tấm lòng bằng thịt.[c]
  rationale: 'Bản sửa bảo toàn hình ảnh và các đối chiếu của câu: một bức thư có nguồn từ Đấng Mê-si, được các sứ giả chuyển đạt, được Thần Khí của Đức Chúa Trời hằng sống viết, và được viết trên những tấm lòng bằng thịt thay vì trên bảng đá. Không thêm diễn giải giáo phái; chú thích tiếp tục nêu tính đa nghĩa của sở hữu cách Χριστοῦ.'
