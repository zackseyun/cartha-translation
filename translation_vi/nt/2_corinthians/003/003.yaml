reference: 2 Corinthians 3:3
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: φανερούμενοι ὅτι ἐστὲ ἐπιστολὴ Χριστοῦ διακονηθεῖσα ὑφ’ ἡμῶν, ἐγγεγραμμένη οὐ μέλανι ἀλλὰ πνεύματι θεοῦ ζῶντος, οὐκ ἐν πλαξὶν λιθίναις ἀλλ’ ἐν πλαξὶν καρδίαις σαρκίναις.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/003.yaml
  text: showing that you are a letter from the Messiah[a], ministered by us, written not with ink but with the Spirit of the living God[d][c][b], not on stone tablets but on tablets of hearts of flesh.
translation:
  language: vi
  text: Qua đó, người ta thấy rõ rằng anh chị em là bức thư đến từ Đấng Mê-si[a], do chúng tôi chuyển đạt, được viết không phải bằng mực mà bằng Thần Khí của Đức Chúa Trời hằng sống[b], không phải trên những bảng đá mà trên những bảng, tức là những tấm lòng bằng thịt.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch sát hơn là “bức thư của Đấng Christ.” Sở hữu cách trong tiếng Hy Lạp có thể chỉ sự thuộc về, nguồn gốc hoặc tác giả. “Mê-si” là tước hiệu tương ứng với Χριστός, thường được dịch theo truyền thống là “Christ.”
    reason: Giữ cách đọc thay thế của sở hữu cách và giải thích tước hiệu.
  - marker: b
    text: Trong ngữ cảnh này, “Thần Khí” được hiểu là Thần Khí của Đức Chúa Trời, chứ không chỉ một tinh thần hay thái độ.
    reason: Làm rõ lựa chọn từ vựng có ý nghĩa thần học.
  - marker: c
    text: “Những tấm lòng bằng thịt” gợi lại lời hứa về giao ước mới, đặc biệt trong Ê-xê-chi-ên 11:19 và 36:26.
    reason: Nêu liên hệ Cựu Ước quan trọng đối với hình ảnh trong câu.
lexical_decisions:
- source_word: φανερούμενοι
  choice: cho thấy rõ
  rationale: Diễn đạt tự nhiên ý nghĩa ‘được bày tỏ, trở nên hiển nhiên’ của phân từ, đồng thời nối tiếp nhận định ở câu trước.
- source_word: ἐπιστολὴ Χριστοῦ
  choice: bức thư đến từ Đấng Mê-si
  rationale: ‘Bức thư’ là cách gọi hiện đại, thông dụng; ‘đến từ’ thể hiện cách hiểu sở hữu cách là nguồn gốc hoặc tác giả, nhưng chú thích vẫn giữ cách hiểu sát mặt chữ.
- source_word: διακονηθεῖσα ὑφ’ ἡμῶν
  choice: được hình thành qua sự phục vụ của chúng tôi
  rationale: Giữ ý nghĩa phục vụ của διακονέω và vai trò trung gian của Phao-lô cùng các cộng sự, đồng thời phù hợp với ẩn dụ bức thư hơn cách dịch máy móc ‘được chúng tôi phục vụ’.
- source_word: ἐγγεγραμμένη
  choice: được viết
  rationale: Từ ngữ tự nhiên, chính xác trong phép đối chiếu giữa mực và Thần Khí.
- source_word: πνεύματι θεοῦ ζῶντος
  choice: Thần Khí của Đức Chúa Trời hằng sống
  rationale: Ngữ cảnh giao ước và sự đối lập với mực cho thấy đây là Thần Khí của Đức Chúa Trời; ‘hằng sống’ giữ đầy đủ sắc thái của ζῶντος.
- source_word: πλαξὶν λιθίναις
  choice: những bảng đá
  rationale: Giữ rõ liên tưởng đến các bảng đá tại Si-nai.
- source_word: πλαξὶν καρδίαις σαρκίναις
  choice: những tấm bảng, tức là những tấm lòng bằng thịt
  rationale: Cấu trúc giải thích ‘tức là’ làm rõ chính những tấm lòng là các tấm bảng, tránh chuỗi sở hữu gượng gạo và vẫn bảo toàn hình ảnh ‘lòng bằng thịt’.
theological_decisions:
- issue: Ý nghĩa sở hữu cách Χριστοῦ
  choice: đến từ Đấng Mê-si
  alternative: của Đấng Christ
  rationale: 'Trong ẩn dụ bức thư, sở hữu cách nhiều khả năng chỉ nguồn gốc hoặc tác giả: cộng đoàn là bức thư đến từ Đấng Mê-si. Chú thích nêu cách dịch sát mặt chữ để không xóa bỏ tính đa nghĩa.'
- issue: Cách hiểu πνεύματι
  choice: Thần Khí của Đức Chúa Trời hằng sống
  alternative: thần khí của Đức Chúa Trời hằng sống
  rationale: Sự đối lập giữa chữ viết bên ngoài và tác động thần linh bên trong trong ngữ cảnh giao ước nghiêng mạnh về Thần Khí của Đức Chúa Trời.
- issue: Hình ảnh καρδίαις σαρκίναις
  choice: những tấm lòng bằng thịt
  alternative: những tấm lòng xác thịt
  rationale: ‘Bằng thịt’ giữ hình ảnh về một tấm lòng sống động, mềm mại theo âm hưởng Ê-xê-chi-ên; ‘xác thịt’ dễ bị hiểu theo nghĩa đạo đức tiêu cực không có trong cụm từ này.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” cho số nhiều ngôi thứ hai; dùng “Đấng Mê-si” như một tước hiệu, có giải thích cách gọi truyền thống trong chú thích. Cấu trúc lặp “không phải… mà…” bảo toàn phép đối chiếu nhịp nhàng của nguyên văn.
