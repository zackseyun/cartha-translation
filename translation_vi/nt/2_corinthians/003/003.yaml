  - severity: low
    issue: Cụm “những tấm bảng, tức là những tấm lòng bằng thịt” lặp “những tấm” và hơi nặng.
    rationale: Rút thành “những bảng, tức là những tấm lòng bằng thịt” vẫn giữ quan hệ đồng vị của πλαξὶν καρδίαις σαρκίναις và đọc gọn hơn.
