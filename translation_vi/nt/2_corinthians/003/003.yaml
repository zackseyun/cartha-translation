    rationale: Phân từ φανερούμενοι có dạng bị động, diễn tả việc các độc giả được hiển lộ là thư của Đấng Mê-si. “Người ta thấy rõ rằng…” là cách Việt ngữ tự nhiên giữ được sắc thái này.
  - severity: high
    issue: “được hình thành qua sự phục vụ của chúng tôi” thêm ý tạo thành vào διακονηθεῖσα.
