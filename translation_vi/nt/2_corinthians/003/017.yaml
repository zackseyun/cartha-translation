base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/017.yaml
  text: The Lord is the Spirit[a], and where the Spirit of the Lord is, there is freedom.
translation:
  language: vi
  text: Chúa là Thánh Linh[a], và nơi nào có Thánh Linh của Chúa, nơi đó có tự do.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Câu “Chúa là Thánh Linh” có thể được hiểu như một sự đồng nhất trong văn mạch, nhưng không xác định mối quan hệ ấy phải được định nghĩa thế nào về phương diện thần học.
    reason: alternative_reading
lexical_decisions:
- source_word: κύριος
  choice: Chúa
  rationale: Cách dịch tự nhiên và trang trọng của κύριος trong văn mạch thần học của Phao-lô; không thu hẹp nghĩa thành một người chủ phàm trần.
- source_word: πνεῦμα
  choice: Thánh Linh
  rationale: Cả hai lần xuất hiện đều chỉ về Thánh Linh trong lập luận của đoạn văn; thêm “Thánh” làm rõ đối tượng theo cách dùng Kinh Thánh quen thuộc trong tiếng Việt.
- source_word: δὲ
  choice: không dịch thành một từ riêng; lần thứ hai được thể hiện bằng “và”
  rationale: δέ đầu câu chỉ đánh dấu bước triển khai của lập luận, nên tiếng Việt tự nhiên có thể không biểu đạt riêng; δέ thứ hai được nối bằng “và” để câu trôi chảy mà không tạo sắc thái đối lập quá mạnh.
- source_word: οὗ
  choice: nơi nào
  rationale: Giữ nghĩa chỉ nơi chốn đồng thời diễn đạt tự nhiên tính khái quát của mệnh đề.
- source_word: ἐλευθερία
  choice: tự do
  rationale: Tương đương hiện đại, rõ ràng và giữ nguyên sức nặng thần học của từ Hy Lạp.
- source_word: ὁ δὲ κύριος τὸ πνεῦμά ἐστιν
  choice: Chúa là Thánh Linh
  rationale: Giữ nguyên mệnh đề đồng nhất trực tiếp của tiếng Hy Lạp, không làm nhẹ thành một sự tương đồng hay chỉ một chức năng.
- source_word: τὸ πνεῦμα κυρίου
  choice: Thánh Linh của Chúa
  rationale: Bảo toàn cấu trúc sở hữu của nguyên văn và mối liên hệ ngôn từ với mệnh đề trước.
theological_decisions:
- issue: Mệnh đề “Chúa là Thánh Linh” có thể được hiểu theo nhiều cách về phương diện thần học.
  choice: 'Dịch thẳng: “Chúa là Thánh Linh.”'
  alternative: Có thể hiểu đây là sự đồng nhất chặt chẽ trong văn mạch hoặc về chức năng/giao ước, chứ không nhất thiết xác định toàn bộ bản chất mối quan hệ; “Chúa” cũng có thể được hiểu cụ thể là Đấng Christ hoặc theo nghĩa quy chiếu rộng hơn về Đức Chúa Trời.
  rationale: Nguyên văn nêu sự đồng nhất trực tiếp. Bản dịch giữ nguyên sức căng thần học và không áp đặt một cách định nghĩa giáo lý riêng.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Thánh Linh” nhất quán cho πνεῦμα khi chỉ Đức Thánh Linh. Cấu trúc “nơi nào… nơi đó…” tạo nhịp tự nhiên và diễn đạt rõ mệnh đề khái quát.
