  text: εἰ γὰρ ⸂τῇ διακονίᾳ⸃ τῆς κατακρίσεως δόξα, πολλῷ μᾶλλον περισσεύει ἡ διακονία τῆς ⸀δικαιοσύνης δόξῃ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/009.yaml
  text: For if the ministry of condemnation came with glory[a], much more does the ministry of righteousness abound in glory.
translation:
  language: vi
  text: Vì nếu chức vụ kết án đã đến trong vinh quang, thì chức vụ của sự công chính[a] càng dư dật vinh quang hơn biết bao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “công lý”.
    reason: lexical_alternative
lexical_decisions:
- source_word: διακονία
  choice: chức vụ
  rationale: Trong mạch văn, từ này chỉ một sự phục vụ hay công tác được giao trong khuôn khổ giao ước; “chức vụ” tự nhiên và giữ được tính đối chiếu giữa hai sự thi hành.
- source_word: κατάκρισις
  choice: kết án
  rationale: Giữ nghĩa pháp lý của danh từ Hy Lạp và đối lập rõ với sự công chính.
- source_word: δόξα
  choice: vinh quang
  rationale: Đây là cách tương đương quen thuộc, phù hợp với lập luận liên tục của Phao-lô về vinh quang của giao ước mới.
- source_word: πολλῷ μᾶλλον
  choice: càng ... hơn biết bao
  rationale: Diễn đạt tự nhiên sức nhấn mạnh của phép so sánh tăng cấp trong tiếng Việt.
- source_word: περισσεύω
  choice: dư dật
  rationale: Bảo toàn ý vượt trội, tràn đầy của động từ mà không thu hẹp thành chỉ “hơn”.
- source_word: δικαιοσύνη
  choice: sự công chính
  rationale: Giữ thuật ngữ Phao-lô có phạm vi nghĩa rộng liên quan đến địa vị và hành động đúng trước mặt Đức Chúa Trời; sắc thái “công lý” được ghi ở chú thích.
theological_decisions:
- issue: Cách dịch δικαιοσύνη trong sự đối chiếu giữa hai chức vụ
  choice: sự công chính
  alternative: công lý
  rationale: “Sự công chính” bảo toàn cách dùng thần học rộng của Phao-lô và thế đối lập với sự kết án, trong khi “công lý” là một sắc thái từ vựng có thể có nhưng không nên được chọn để giải quyết dứt khoát sự đa nghĩa.
- issue: Bổ sung động từ trong mệnh đề Hy Lạp không có động từ
  choice: đã đến trong vinh quang
  alternative: đã có vinh quang
  rationale: Nguyên văn chỉ đặt “vinh quang” bên cạnh “chức vụ kết án”; cách diễn đạt được chọn cung cấp động từ cần thiết trong tiếng Việt và trình bày vinh quang như điều đi kèm chức vụ ấy, không đồng nhất nó với chức vụ.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại. “Chức vụ” thích hợp với ngữ cảnh giao ước; “đã đến trong vinh quang” phản ánh tự nhiên mệnh đề Hy Lạp không có động từ, còn vế sau giữ hình ảnh dư dật trong vinh quang.
