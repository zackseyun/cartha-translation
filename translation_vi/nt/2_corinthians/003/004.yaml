  text: Such confidence we have through Messiah toward God[a][b].
translation:
  language: vi
  text: Chúng tôi có sự tin chắc như vậy, nhờ Đấng Mê-si-a, đối với Đức Chúa Trời.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “Đấng Christ.”'
    reason: alternative_reading
lexical_decisions:
- source_word: Πεποίθησιν
  choice: niềm tin vững chắc
  rationale: Diễn đạt sự xác tín vững vàng trong văn cảnh, tự nhiên hơn cách dịch chỉ bằng “sự tự tin” và không biến từ này thành một tín điều tuyệt đối.
- source_word: δὲ τοιαύτην
  choice: như vậy
  rationale: Nối câu này với lập luận ngay trước đó; tiếng Việt không cần dịch δὲ bằng một liên từ nặng, còn “như vậy” giữ được lực hồi chỉ của τοιαύτην.
- source_word: ἔχομεν
  choice: chúng tôi có được
  rationale: Giữ nghĩa trực tiếp của động từ, đồng thời hợp với cấu trúc tiếng Việt khi nói về một sự xác tín có nguồn trung gian.
- source_word: διὰ τοῦ Χριστοῦ
  choice: nhờ Đấng Christ
  rationale: διά với sở hữu cách chỉ phương tiện hoặc trung gian; “nhờ” tự nhiên trong tiếng Việt. “Đấng Christ” giữ sắc thái tước hiệu của Χριστός.
- source_word: πρὸς τὸν θεόν
  choice: hướng về Đức Chúa Trời
  rationale: Giữ hướng tính của πρός và sự mơ hồ quan hệ trong nguyên văn, thay vì diễn giải thành “trước mặt” hoặc “đối với” Đức Chúa Trời.
theological_decisions:
- issue: Cách dịch Χριστοῦ
  choice: Đấng Christ
  alternative: Đấng Mê-si-a
  rationale: “Đấng Christ” là cách gọi trang trọng, quen thuộc trong tiếng Việt và vẫn thể hiện tước hiệu; chú thích nêu nghĩa tương đương để người đọc nhận ra nội hàm Mê-si-a.
- issue: Quan hệ của πρὸς τὸν θεόν
  choice: hướng về Đức Chúa Trời
  alternative: trước mặt Đức Chúa Trời; đối với Đức Chúa Trời
  rationale: Bản chính giữ hình ảnh hướng tính khá sát nguyên văn, không thu hẹp quan hệ này thành sự hiện diện trước mặt hay chỉ một đối tượng quy chiếu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Trật tự câu được điều chỉnh cho tự nhiên trong tiếng Việt, nhưng vẫn giữ trọng tâm rằng sự xác tín ấy có được nhờ Đấng Christ và hướng về Đức Chúa Trời.
