  source_fidelity: 'Bản dịch giữ đầy đủ các thành tố chính của nguyên văn: liên hệ suy luận của οὖν (“Vậy”), sắc thái nguyên nhân của phân từ Ἔχοντες (“vì có”), “niềm hy vọng như thế,” và mức độ nhấn mạnh của πολλῇ παρρησίᾳ. “Chúng tôi hành động hết sức mạnh dạn” diễn đạt được ý χρώμεθα + tặng cách mà không tự ý giới hạn vào lời nói.'
