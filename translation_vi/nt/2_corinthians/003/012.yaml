  terminology: “Niềm hy vọng” và “mạnh dạn” phù hợp văn cảnh và cách dùng Kinh Thánh tiếng Việt hiện đại. Chú thích bảo lưu thích đáng các sắc thái “cởi mở” và “thẳng thắn” của παρρησία, không áp đặt rằng từ này chỉ nói đến lời nói.
