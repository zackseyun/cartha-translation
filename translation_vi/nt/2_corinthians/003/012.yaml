id: 2CO.3.12
reference: 2 Corinthians 3:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἔχοντες οὖν τοιαύτην ἐλπίδα πολλῇ παρρησίᾳ χρώμεθα,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/012.yaml
  text: Since, then, we have such a hope, we act with great boldness,
translation:
  language: vi
  text: Vậy, vì có niềm hy vọng như thế, chúng tôi hành động hết sức mạnh dạn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “chúng tôi hết sức cởi mở” hoặc “chúng tôi nói rất thẳng thắn.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔχοντες
  choice: vì có
  rationale: Phân từ được hiểu theo nghĩa nguyên nhân trong văn cảnh; cách dịch này tự nhiên trong tiếng Việt và giữ quan hệ lý do với mệnh đề chính.
- source_word: οὖν
  choice: Vậy
  rationale: Giữ sắc thái suy luận từ lập luận trước đó mà không diễn đạt trùng lặp quá nặng với mệnh đề nguyên nhân.
- source_word: τοιαύτην
  choice: như thế
  rationale: Diễn đạt tự nhiên sắc thái chỉ loại của đại từ, quy chiếu về niềm hy vọng vừa được trình bày.
- source_word: ἐλπίδα
  choice: niềm hy vọng
  rationale: Cách dịch thông dụng, phù hợp với sự trông đợi đầy tin tưởng trong văn cảnh.
- source_word: πολλῇ
  choice: hết sức
  rationale: Trạng ngữ này truyền đạt mức độ mạnh của phẩm chất đi kèm παρρησίᾳ một cách tự nhiên trong tiếng Việt.
- source_word: παρρησίᾳ
  choice: mạnh dạn
  rationale: Giữ nghĩa can đảm, công khai và không e dè; các nét nghĩa 'cởi mở' và 'thẳng thắn' được bảo lưu trong chú thích.
- source_word: χρώμεθα
  choice: chúng tôi hành động
  rationale: Trong kết cấu với tặng cách, động từ mang nghĩa sử dụng hoặc vận dụng; 'hành động ... mạnh dạn' tự nhiên hơn trong tiếng Việt mà không tự ý thêm đối tượng như lời nói.
theological_decisions:
- issue: Phạm vi của παρρησία
  choice: Không giới hạn vào việc nói năng; dịch là 'hành động hết sức mạnh dạn'.
  alternative: Chúng tôi nói rất thẳng thắn / chúng tôi dùng sự mạnh dạn lớn lao.
  rationale: Nguyên văn không nêu rõ một đối tượng như lời nói. Bản dịch chính giữ phạm vi rộng, còn chú thích nêu các khả năng thiên về sự cởi mở hoặc lời nói thẳng thắn.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Đại từ 'chúng tôi' phản ánh ngôi thứ nhất số nhiều của tác giả; dấu phẩy giữ nhịp suy luận của câu Hy Lạp.
