revisions:
- from: Nhưng tâm trí họ đã trở nên chai cứng. Thật vậy, cho đến tận ngày nay, khi giao ước cũ[a] được đọc, cũng tấm màn ấy vẫn còn, chưa được vén lên, vì trong Đấng Mê-si, nó được cất bỏ.[b]
  to: Nhưng tâm trí họ đã trở nên chai cứng. Vì cho đến tận ngày nay, khi giao ước cũ[a] được đọc, tấm màn ấy vẫn còn, chưa được vén lên, bởi vì trong Đấng Mê-si, nó được cất bỏ.[b]
  rationale: Chỉ chỉnh hai điểm diễn đạt để phản ánh chức năng của γάρ rõ hơn và làm câu tiếng Việt tự nhiên hơn. Giữ nguyên cách hiểu chính rằng “nó” là tấm màn, đồng thời giữ chú thích về khả năng chủ thể ngầm là giao ước cũ.
