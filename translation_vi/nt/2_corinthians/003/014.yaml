id: 2CO.3.14
reference: 2 Corinthians 3:14
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀλλὰ ἐπωρώθη τὰ νοήματα αὐτῶν. ἄχρι γὰρ τῆς σήμερον ⸀ἡμέρας τὸ αὐτὸ κάλυμμα ἐπὶ τῇ ἀναγνώσει τῆς παλαιᾶς διαθήκης μένει μὴ ἀνακαλυπτόμενον, ⸀ὅτι ἐν Χριστῷ καταργεῖται,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/014.yaml
  text: But their minds were hardened[a]. For until this very day, at the reading of the old covenant, the same veil remains, not being lifted[b], because in Messiah it is removed.
translation:
  language: vi
  text: Nhưng tâm trí họ đã trở nên chai cứng. Vì cho đến tận ngày nay, khi giao ước cũ[a] được đọc, tấm màn ấy vẫn còn, chưa được vén lên, bởi vì trong Đấng Mê-si, nó được cất bỏ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “Cựu Ước.” Tiếng Hy Lạp nói “giao ước cũ.”
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể hiểu là: “vì giao ước cũ bị bãi bỏ trong Đấng Mê-si.” Đại từ “nó” không có trong tiếng Hy Lạp; chủ thể ngầm của “được cất bỏ” có thể là tấm màn hoặc giao ước cũ.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπωρώθη τὰ νοήματα αὐτῶν
  choice: tâm trí họ đã trở nên chai cứng
  rationale: Diễn đạt thể thụ động và tình trạng mất nhạy bén hoặc kháng cự trong nhận thức, nhưng không nhấn quá mức rằng đây hoàn toàn là hành vi cố ý.
- source_word: ἄχρι γὰρ τῆς σήμερον ἡμέρας
  choice: Thật vậy, cho đến tận ngày nay
  rationale: Giữ quan hệ giải thích của γάρ cùng sắc thái nhấn mạnh về thời gian, đồng thời tự nhiên trong tiếng Việt hiện đại.
- source_word: κάλυμμα
  choice: tấm màn
  rationale: Giữ nguyên hình ảnh chiếc màn che và mối liên hệ với Môi-se trong văn cảnh.
- source_word: ἐπὶ τῇ ἀναγνώσει τῆς παλαιᾶς διαθήκης
  choice: khi giao ước cũ được đọc
  rationale: Chuyển cấu trúc danh hóa sang mệnh đề tự nhiên trong tiếng Việt nhưng vẫn giữ rõ đối tượng được đọc là giao ước cũ.
- source_word: μένει μὴ ἀνακαλυπτόμενον
  choice: vẫn còn, chưa được vén lên
  rationale: Giữ ý kéo dài của μένει, thể thụ động của phân từ và hình ảnh tấm màn được vén lên.
- source_word: ἐν Χριστῷ
  choice: trong Đấng Mê-si
  rationale: Diễn đạt Χριστός như một tước hiệu và dùng cách gọi rõ nghĩa, trang trọng trong tiếng Việt.
- source_word: καταργεῖται
  choice: được cất bỏ
  rationale: Với tấm màn là tiền ngữ gần nhất, cách dịch này tự nhiên, giữ thể thụ động và hình ảnh của câu; nghĩa rộng hơn như 'bị bãi bỏ' được ghi nhận trong chú thích.
theological_decisions:
- issue: Chủ thể ngầm của καταργεῖται
  choice: 'Hiểu chủ thể là tấm màn: “trong Đấng Mê-si, nó được cất bỏ.”'
  alternative: Có thể hiểu giao ước cũ là điều bị bãi bỏ; hoặc câu cố ý để ngỏ giữa tấm màn và giao ước.
  rationale: τὸ αὐτὸ κάλυμμα là tiền ngữ gần và phù hợp nhất với hình ảnh “chưa được vén lên.” Tuy nhiên, hình thái Hy Lạp không nêu lại chủ thể, nên chú thích bảo tồn khả năng quy chiếu sang giao ước cũ mà không áp đặt một kết luận thần học mạnh hơn cú pháp.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. “Chai cứng” giữ sắc thái ẩn dụ về sự mất nhạy bén; “vén lên” và “cất bỏ” duy trì mạch hình ảnh tấm màn. Các dấu chú thích [a], [b] được đặt ngay tại nội dung mà chúng giải thích.
