  text: how will the ministry of the Spirit not be even more in glory?[a]
translation:
  language: vi
  text: thì lẽ nào chức vụ của Thánh Linh sẽ không vinh hiển hơn?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “thì lẽ nào chức vụ của Thánh Linh sẽ không ở trong vinh quang hơn?”'
    reason: Bảo lưu cách dịch sát hơn của cụm Hy Lạp ἐν δόξῃ; “với vinh quang” cũng là một khả năng.
lexical_decisions:
- source_word: πῶς οὐχὶ
  choice: sẽ chẳng ... sao?
  rationale: Diễn đạt tự nhiên câu hỏi tu từ mong đợi câu trả lời khẳng định; kết hợp với ἔσται để giữ sắc thái hướng tới kết quả được nêu.
- source_word: μᾶλλον
  choice: càng ... hơn
  rationale: Giữ rõ phép so sánh tăng tiến từ điều kém hơn ở câu trước đến điều lớn hơn ở đây.
- source_word: ἡ διακονία
  choice: chức vụ
  rationale: Trong mạch văn này, từ này chỉ sự phục vụ được giao phó trong khuôn khổ giao ước; “chức vụ” vừa trang trọng vừa duy trì sự đối chiếu với chức vụ ở câu trước.
- source_word: τοῦ πνεύματος
  choice: của Thánh Linh
  rationale: Ngữ cảnh gần, đặc biệt 2 Cô-rinh-tô 3:6, cho thấy πνεῦμα nói đến Thánh Linh chứ không chỉ một tinh thần trừu tượng.
- source_word: ἔσται
  choice: sẽ
  rationale: Thể hiện thì tương lai của động từ εἰμί bằng cách tự nhiên trong tiếng Việt.
- source_word: ἐν δόξῃ
  choice: vinh hiển
  rationale: Chuyển cụm giới từ thành vị ngữ tính chất để câu tiếng Việt tự nhiên; chú thích giữ lại cách hiểu sát hình thức hơn là “ở trong vinh quang”.
theological_decisions:
- issue: Đối tượng được πνεύματος chỉ đến
  choice: Thánh Linh
  alternative: tinh thần theo nghĩa trừu tượng hoặc phi nhân vị
  rationale: Sự tương phản giữa chữ viết và Thánh Linh trong ngữ cảnh giao ước, nhất là câu 6, ủng hộ cách hiểu là Thánh Linh mà không cần thêm nội dung giáo lý ngoài đoạn văn.
- issue: Sắc thái của ἐν δόξῃ
  choice: vinh hiển
  alternative: ở trong vinh quang / với vinh quang
  rationale: “Vinh hiển” truyền đạt tự nhiên rằng chức vụ này mang đặc tính vinh quang; chú thích bảo lưu khả năng dịch cụm giới từ sát hơn, tránh quyết định quá mức quan hệ chính xác của ἐν.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc “sẽ chẳng ... sao?” giữ lực của câu hỏi tu từ; “càng ... hơn” làm rõ lập luận từ kém đến hơn. Cách gọi “Thánh Linh” phù hợp với tiếng Việt Cơ Đốc phổ thông.
