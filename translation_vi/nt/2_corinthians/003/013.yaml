id: 2CO.3.13
reference: 2 Corinthians 3:13
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ οὐ καθάπερ Μωϋσῆς ἐτίθει κάλυμμα ἐπὶ τὸ πρόσωπον ⸀αὐτοῦ, πρὸς τὸ μὴ ἀτενίσαι τοὺς υἱοὺς Ἰσραὴλ εἰς τὸ τέλος τοῦ καταργουμένου.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/013.yaml
  text: and not like Moses[b][a], who used to put a veil over his face so that the sons of Israel would not gaze at the end of what was fading away.
translation:
  language: vi
  text: chứ không như Môi-se, người vẫn thường đặt một tấm màn che trên mặt mình, để con dân Y-sơ-ra-ên[a] không nhìn chăm chú vào sự kết thúc của điều đang dần mất đi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “các con trai của Y-sơ-ra-ên”; đây là thành ngữ chỉ dân Y-sơ-ra-ên.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “mục tiêu hoặc kết quả của điều đang bị đưa đến chỗ chấm dứt.”'
    reason: alternative_reading
lexical_decisions:
- source_word: καθάπερ
  choice: như
  rationale: Diễn đạt tự nhiên lực so sánh với mệnh đề trước mà không làm câu nặng nề.
- source_word: ἐτίθει
  choice: vẫn thường đặt
  rationale: Thể chưa hoàn thành gợi hành động lặp lại hoặc theo thói quen; cách dịch này giữ rõ sắc thái ấy.
- source_word: κάλυμμα
  choice: một tấm màn che
  rationale: Chỉ vật che trên mặt trong câu chuyện về Môi-se, đồng thời phù hợp với hình ảnh ẩn dụ xuyên suốt đoạn văn.
- source_word: πρόσωπον αὐτοῦ
  choice: mặt mình
  rationale: Đây là nghĩa trực tiếp và tự nhiên trong tiếng Việt; đại từ phản thân làm rõ chính Môi-se che mặt.
- source_word: πρὸς τὸ μὴ ἀτενίσαι
  choice: để ... không nhìn chăm chú
  rationale: Giữ quan hệ mục đích của cấu trúc Hy Lạp và cường độ của ἀτενίζω, tức nhìn cố định hoặc chăm chú.
- source_word: τοὺς υἱοὺς Ἰσραήλ
  choice: con dân Y-sơ-ra-ên
  rationale: Diễn đạt tự nhiên thành ngữ Kinh Thánh chỉ dân Y-sơ-ra-ên, không giới hạn đối tượng vào nam giới; dạng sát chữ được ghi ở chú thích.
- source_word: εἰς τὸ τέλος
  choice: vào kết cuộc
  rationale: τέλος có thể chỉ điểm kết thúc, kết cuộc hoặc mục tiêu. Trong sự kết hợp với καταργουμένου, “kết cuộc” giữ nghĩa chấm dứt nhưng không loại bỏ hoàn toàn sắc thái kết quả.
- source_word: τοῦ καταργουμένου
  choice: của điều đang dần mất đi
  rationale: Phân từ hiện tại thụ động chỉ điều đang bị làm cho mất hiệu lực hoặc đang qua đi. Cách dịch này tự nhiên trong văn cảnh vinh quang phai tàn và không áp đặt chủ thể gây ra hành động.
theological_decisions:
- issue: Ý nghĩa của τέλος τοῦ καταργουμένου
  choice: kết cuộc của điều đang dần mất đi
  alternative: mục tiêu/kết quả của điều đang bị đưa đến chỗ chấm dứt
  rationale: Văn cảnh đối chiếu điều tạm thời với điều còn lại, nên nghĩa chấm dứt là phù hợp nhất. Tuy vậy, vì τέλος cũng có thể mang nghĩa mục tiêu hoặc kết quả và καταργουμένου có thể nhấn mạnh việc bị làm cho chấm dứt, chú thích giữ lại khả năng này thay vì giải quyết dứt khoát căng thẳng thần học.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Môi-se” và “Y-sơ-ra-ên” theo lối phiên âm Kinh Thánh Việt ngữ quen thuộc. Câu giữ cấu trúc so sánh nối tiếp văn cảnh trước; các chú thích bảo tồn thành ngữ nguyên văn và tính đa nghĩa của τέλος cùng καταργουμένου.
