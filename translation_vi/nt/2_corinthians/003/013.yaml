  source_fidelity: Bản dịch chuyển tải đúng cấu trúc so sánh, sắc thái thói quen của ἐτίθει, mục đích phủ định của πρὸς τὸ μὴ ἀτενίσαι, và ý nghĩa đang qua đi/mất hiệu lực của καταργουμένου. Tuy nhiên, “vào kết cuộc” làm εἰς τὸ τέλος nghiêng về nghĩa “kết quả/outcome” và không tự nhiên trong kết hợp với “nhìn chăm chú”; nghĩa chính trong văn mạch là sự kết thúc của điều đang qua đi.
