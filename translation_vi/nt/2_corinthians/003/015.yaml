id: 2CO.3.15
reference: 2 Corinthians 3:15
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀλλ’ ἕως σήμερον ἡνίκα ⸂ἂν ἀναγινώσκηται⸃ Μωϋσῆς κάλυμμα ἐπὶ τὴν καρδίαν αὐτῶν κεῖται·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/015.yaml
  text: But to this day[a], whenever Moses is read[b], a veil lies over their heart.
translation:
  language: vi
  text: Nhưng cho đến ngày nay, mỗi khi người ta đọc Môi-se[a], một tấm màn vẫn phủ trên lòng họ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Môi-se” ở đây chỉ các sách của Môi-se, đặc biệt là luật pháp.
    reason: cultural_note
  - marker: b
    text: Tiếng Hy Lạp dùng “lòng” ở số ít với “họ”, có lẽ theo nghĩa tập thể; cũng có thể hiểu là lòng của mỗi người trong họ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: Nhưng
  rationale: Đánh dấu sự tương phản với câu trước bằng một liên từ ngắn gọn, tự nhiên.
- source_word: ἕως σήμερον
  choice: cho đến ngày nay
  rationale: Diễn tả tình trạng vẫn tiếp tục tới hiện tại và giữ sắc thái trang trọng, dễ hiểu.
- source_word: ἡνίκα ἂν ἀναγινώσκηται
  choice: mỗi khi người ta đọc
  rationale: ἡνίκα với ἄν và thể giả định hiện tại chỉ hoàn cảnh bất định, lặp lại; cấu trúc bị động vô nhân xưng được diễn đạt tự nhiên trong tiếng Việt.
- source_word: Μωϋσῆς
  choice: Môi-se
  rationale: Giữ phép hoán dụ của nguyên văn, trong đó tên Môi-se chỉ các sách gắn với ông, thay vì giải nghĩa ngay trong chính văn.
- source_word: κάλυμμα
  choice: một tấm màn
  rationale: Phù hợp với hình ảnh tấm màn xuyên suốt văn cảnh và rõ nghĩa trong tiếng Việt hiện đại.
- source_word: ἐπὶ τὴν καρδίαν αὐτῶν
  choice: phủ trên lòng họ
  rationale: Giữ danh từ số ít mang nghĩa tập thể của nguyên văn; “lòng” truyền đạt trung tâm nhận thức và nội tâm, không chỉ cảm xúc.
- source_word: κεῖται
  choice: vẫn phủ
  rationale: Diễn đạt trạng thái tấm màn nằm yên trên lòng, đồng thời từ “vẫn” làm rõ tính tiếp diễn vốn có trong ngữ cảnh.
theological_decisions:
- issue: Có nên nói rõ “Môi-se” là luật pháp hay các sách của Môi-se hay không
  choice: Giữ “Môi-se” trong chính văn như một phép hoán dụ
  alternative: Dịch thành “luật pháp Môi-se” hoặc “các sách của Môi-se”
  rationale: Nguyên văn chỉ dùng tên Môi-se. Giữ cách nói này bảo toàn hình ảnh và độ mở của câu, còn nghĩa hoán dụ được giải thích ở chú thích.
- issue: Số ít của “lòng” với đại từ số nhiều
  choice: Giữ “lòng họ” theo số ít tập thể của nguyên văn
  alternative: Dịch tự nhiên hóa thành “lòng của mỗi người trong họ” hoặc “tấm lòng họ”
  rationale: Cách dịch giữ đặc điểm đáng chú ý của tiếng Hy Lạp mà vẫn chấp nhận được trong tiếng Việt, không quyết định quá mức giữa nghĩa tập thể và nghĩa phân phối.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Môi-se” theo cách phiên âm quen thuộc; giữ phép hoán dụ và số ít tập thể của nguyên văn, đồng thời giải thích bằng chú thích.
