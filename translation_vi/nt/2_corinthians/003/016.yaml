id: 2CO.3.16
reference: 2 Corinthians 3:16
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἡνίκα ⸂δὲ ἐὰν⸃ ἐπιστρέψῃ πρὸς κύριον, περιαιρεῖται τὸ κάλυμμα.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/016.yaml
  text: But whenever one turns to the Lord[b][a], the veil is removed.
translation:
  language: vi
  text: Nhưng bất cứ khi nào một người quay về với Chúa, tấm màn che được cất bỏ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “tấm màn che được lấy đi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡνίκα δὲ ἐὰν
  choice: Nhưng bất cứ khi nào
  rationale: Giữ liên từ δέ và sắc thái thời gian bất định, có tính khái quát của ἡνίκα kết hợp với ἐὰν và động từ giả định.
- source_word: ἐπιστρέψῃ
  choice: quay về
  rationale: Diễn đạt tự nhiên hướng chuyển về phía một người, nhưng không thu hẹp nghĩa thành một thuật ngữ chuyên biệt như “cải đạo”.
- source_word: πρὸς κύριον
  choice: với Chúa
  rationale: Trong kết cấu tiếng Việt “quay về với Chúa”, từ “với” tự nhiên mà vẫn biểu đạt hướng quy về Chúa; không thêm sự xác định Chúa là Đấng Christ hay Thánh Linh.
- source_word: περιαιρεῖται
  choice: được cất bỏ
  rationale: Giữ thể bị động và ý nghĩa loại bỏ vật che phủ mà không nêu thêm tác nhân.
- source_word: τὸ κάλυμμα
  choice: tấm màn che
  rationale: Phù hợp hình ảnh tấm màn của Môi-se trong văn cảnh, đồng thời rõ nghĩa đối với độc giả hiện đại.
theological_decisions:
- issue: Chủ ngữ không được nói rõ của ἐπιστρέψῃ
  choice: một người
  alternative: người ấy; ai
  rationale: Tiếng Việt cần một chủ thể hiển ngôn để câu tự nhiên. “Một người” giữ tính đơn nhất và không xác định của động từ Hy Lạp, không quyết định phạm vi cá nhân hay tập thể theo một lập trường thần học riêng.
- issue: Danh tính của “Chúa” trong văn cảnh
  choice: Chúa
  alternative: Chúa Cơ Đốc; Chúa, tức là Thánh Linh
  rationale: Bản văn câu này chỉ có κύριον. Không thêm định danh nhằm bảo toàn sự căng thẳng thần học trong mối liên hệ giữa Chúa và Thánh Linh ở văn cảnh kế cận.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Bất cứ khi nào” truyền đạt sắc thái bất định/lặp lại; “quay về với Chúa” là cách nói tự nhiên trong tiếng Việt; “tấm màn che” duy trì hình ảnh xuyên suốt văn cảnh.
