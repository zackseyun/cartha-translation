reference: John 21:20
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸀Ἐπιστραφεὶς ὁ Πέτρος βλέπει τὸν μαθητὴν ὃν ἠγάπα ὁ Ἰησοῦς ἀκολουθοῦντα, ὃς καὶ ἀνέπεσεν ἐν τῷ δείπνῳ ἐπὶ τὸ στῆθος αὐτοῦ καὶ εἶπεν· Κύριε, τίς ἐστιν ὁ παραδιδούς σε;
base_translation:
  language: en
  yaml_path: translation/nt/john/021/020.yaml
  text: Peter turned and saw the disciple whom Jesus loved following[a], who had also leaned back against his chest at the supper and said, “Lord[b], who is the one betraying you?”
translation:
  language: vi
  text: 'Phi-e-rơ quay lại và thấy môn đồ mà Đức Chúa Jêsus yêu đang theo[a], là người cũng đã ngả mình vào ngực Ngài[b] trong bữa ăn và hỏi: “Lạy Chúa, ai là người đang phản bội Ngài?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bản Hy Lạp không nói rõ môn đồ đi theo ai; cũng có thể hiểu là “theo Ngài” hoặc “theo họ”.
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn phản ánh tư thế nằm nghiêng khi dùng bữa; cũng có thể dịch là “tựa vào ngực Ngài”.
    reason: cultural_context
lexical_decisions:
- source_word: Ἐπιστραφεὶς
  choice: quay lại
  rationale: Diễn đạt tự nhiên phân từ bất định quá khứ, cho thấy Phi-e-rơ đổi hướng nhìn trước khi thấy người môn đồ.
- source_word: βλέπει
  choice: thấy
  rationale: Hiện tại lịch sử trong tiếng Hy Lạp được chuyển sang lối kể chuyện tự nhiên của tiếng Việt; động từ tiếng Việt không bắt buộc đánh dấu thì.
- source_word: μαθητὴν
  choice: người môn đồ
  rationale: Giữ thuật ngữ quen thuộc của sách Giăng và sắc thái một người được Chúa dạy dỗ, thay vì từ chung chung như “người đi theo”.
- source_word: ὃν ἠγάπα ὁ Ἰησοῦς
  choice: mà Đức Chúa Jêsus yêu
  rationale: Bám sát mệnh đề quan hệ Hy Lạp và giữ cách gọi đặc trưng trong sách Giăng.
- source_word: ἀκολουθοῦντα
  choice: đang đi theo phía sau
  rationale: Diễn đạt rõ chuyển động tiếp diễn mà không tự ý thêm tân ngữ “Ngài” hay “họ”, vì bản Hy Lạp không nêu tân ngữ.
- source_word: ἀνέπεσεν … ἐπὶ τὸ στῆθος αὐτοῦ
  choice: đã ngả mình vào ngực Ngài
  rationale: Phản ánh tư thế nằm nghiêng khi dự tiệc và hành động ngả về phía ngực Đức Chúa Jêsus, đồng thời dùng lời văn hiện đại.
- source_word: ἐν τῷ δείπνῳ
  choice: trong bữa ăn
  rationale: Chỉ bối cảnh bữa tối được xác định trong câu chuyện mà không đưa thêm hàm ý nghi lễ.
- source_word: Κύριε
  choice: Lạy Chúa
  rationale: “Lạy Chúa” là cách xưng hô trực tiếp trang trọng, tự nhiên trong tiếng Việt và giữ được âm hưởng thần học của κύριος.
- source_word: ὁ παραδιδούς σε
  choice: kẻ phản bội Ngài
  rationale: Trong bối cảnh cuộc thương khó, παραδίδωμι mang nghĩa phản bội và trao nộp; cách dịch này tự nhiên, rõ nghĩa trong tiếng Việt.
theological_decisions:
- issue: Tân ngữ không được nói rõ của ἀκολουθοῦντα
  choice: 'Không thêm tân ngữ: “đang đi theo phía sau”'
  alternative: “đang đi theo Ngài” hoặc “đang đi theo họ”
  rationale: Bản Hy Lạp không xác định người môn đồ đang theo riêng Đức Chúa Jêsus hay theo cả Đức Chúa Jêsus và Phi-e-rơ. Cách dịch không tân ngữ bảo tồn sự không xác định ấy.
- issue: Nghĩa của παραδίδωμι trong câu hỏi
  choice: “phản bội”
  alternative: “trao nộp”
  rationale: “Trao nộp” phản ánh nghĩa từ nguyên rộng hơn, nhưng trong ngữ cảnh Giu-đa giao Đức Chúa Jêsus cho đối phương, “phản bội” truyền đạt đúng lực ngữ cảnh mà không thêm một lập trường giáo phái.
- issue: Hiện tại lịch sử βλέπει
  choice: Dịch tự nhiên là “thấy” trong mạch kể quá khứ
  alternative: Nhấn mạnh hiện tại lịch sử bằng “bèn thấy” hoặc đổi toàn câu sang hiện tại
  rationale: Tiếng Việt không biến đổi hình thái động từ theo thì; trình tự câu đã cho biết thời gian. Không cần thêm yếu tố nhấn mạnh không có trong nguyên văn.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “Đức Chúa Jêsus”, “môn đồ” và “Lạy Chúa” để duy trì cách gọi Kinh Thánh quen thuộc; tránh cấu trúc quá cổ và không giải quyết thay cho nguyên văn tân ngữ bị lược của “đi theo”.
