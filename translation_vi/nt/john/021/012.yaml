id: JHN.21.12
reference: John 21:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: λέγει αὐτοῖς ὁ Ἰησοῦς· Δεῦτε ἀριστήσατε. οὐδεὶς ⸀δὲ ἐτόλμα τῶν μαθητῶν ἐξετάσαι αὐτόν· Σὺ τίς εἶ; εἰδότες ὅτι ὁ κύριός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/012.yaml
  text: Jesus said to them[a], “Come, eat breakfast.” But none of the disciples dared to ask him[b], “Who are you?” knowing that it was the Lord.
translation:
  language: vi
  text: 'Đức Giê-su bảo họ: “Hãy đến ăn sáng[a].” Nhưng không ai trong các môn đồ dám hỏi Người[b]: “Ngài là ai?” biết rằng Người là Chúa.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Động từ Hy Lạp chỉ riêng việc dùng bữa vào buổi sáng; cũng có thể dịch: “Hãy đến dùng bữa sáng.”'
    reason: lexical_alternative
  - marker: b
    text: Động từ được dịch là “hỏi” cũng có thể mang nghĩa “hỏi kỹ”, “chất vấn” hoặc “xem xét kỹ”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Δεῦτε
  choice: Hãy đến
  rationale: Lời mời gọi ở thể mệnh lệnh; “hãy đến” tự nhiên và giữ được ý hướng về phía người nói.
- source_word: ἀριστήσατε
  choice: ăn sáng
  rationale: Động từ chỉ việc dùng bữa vào buổi sáng, nên dịch cụ thể là “ăn sáng” thay vì chỉ “ăn”.
- source_word: οὐδεὶς δὲ
  choice: Nhưng không một ... nào
  rationale: δέ đánh dấu sự chuyển ý có sắc thái tương phản nhẹ; cấu trúc này tự nhiên trong tiếng Việt.
- source_word: ἐτόλμα
  choice: dám
  rationale: Diễn tả việc có đủ can đảm hay mạnh dạn để làm điều gì; “dám” phù hợp với cấu trúc đi cùng động từ nguyên mẫu.
- source_word: ἐξετάσαι
  choice: hỏi kỹ
  rationale: Động từ có thể mang nghĩa hỏi, chất vấn hoặc xem xét kỹ. “Hỏi kỹ” giữ được sắc thái mạnh hơn ἐρωτάω mà vẫn phù hợp với câu hỏi trực tiếp.
- source_word: Σὺ τίς εἶ;
  choice: Ngài là ai?
  rationale: Câu hỏi trực tiếp về danh tính. Đại từ Σὺ có sắc thái nhấn mạnh, nhưng cấu trúc tiếng Việt tự nhiên không cần thêm từ nhấn mạnh.
- source_word: εἰδότες ὅτι
  choice: vì họ biết
  rationale: Phân từ có thể biểu thị hoàn cảnh hoặc nguyên nhân; trong ngữ cảnh, sự biết giải thích việc họ không dám hỏi. “Vì họ biết” diễn đạt tự nhiên, đồng thời không làm thay đổi nội dung mệnh đề.
- source_word: ὁ κύριός
  choice: Chúa
  rationale: Trong bối cảnh Đức Giê-su phục sinh hiện ra, κύριος mang danh xưng có trọng lượng Kitô học; “Chúa” là cách dịch chuẩn và tự nhiên.
theological_decisions:
- issue: Cách dịch κύριος khi chỉ Đức Giê-su
  choice: Chúa
  alternative: chủ; thầy
  rationale: “Chúa” bảo tồn trọng lượng của danh xưng trong trình thuật Đức Giê-su phục sinh mà không thêm cách giải thích hệ phái.
- issue: Quan hệ ý nghĩa của phân từ εἰδότες
  choice: vì họ biết
  alternative: khi biết; trong lúc biết
  rationale: 'Ngữ cảnh ủng hộ sắc thái nguyên nhân: họ không hỏi vì đã nhận biết Người. Tuy nhiên, bản Hy Lạp dùng phân từ nên quan hệ cú pháp không được đánh dấu hoàn toàn tường minh; chú thích ghi nhận khả năng dịch trung tính hơn.'
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Giê-su” và đại từ kính trọng “Người/Ngài”; lời mời “Hãy đến ăn sáng đi” giữ sắc thái trực tiếp, thân mật. Các dấu chú thích [a], [b] đều xuất hiện trong chính văn.
