  text: This was now the third time Jesus was revealed to the disciples after he had been raised from the dead[a].
translation:
  language: vi
  text: Đây đã là lần thứ ba Chúa Giê-su tỏ mình ra cho các môn đồ sau khi Ngài được làm cho sống lại từ cõi chết.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Đây đã là lần thứ ba Chúa Giê-su hiện ra với các môn đồ sau khi Ngài được làm cho sống lại từ cõi chết.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο ἤδη τρίτον
  choice: Đây là lần thứ ba
  rationale: Diễn đạt tự nhiên trong tiếng Việt ý chỉ sự kiện vừa được thuật lại và lần xuất hiện đã đạt đến lần thứ ba; không cần dịch riêng ἤδη vì cấu trúc này đã hàm ý 'đến lúc này'.
- source_word: ἐφανερώθη
  choice: bày tỏ mình
  rationale: Giữ sắc thái 'được biểu lộ/hiện ra' của φανερόω và lối dùng đặc trưng trong Giăng, đồng thời tự nhiên hơn dạng bị động cứng trong tiếng Việt; 'hiện ra' là phương án ngữ cảnh khả dĩ.
- source_word: ὁ Ἰησοῦς
  choice: Đức Chúa Jêsus
  rationale: Cách gọi trang trọng, quen thuộc trong văn phong Kinh Thánh tiếng Việt đối với danh riêng Ἰησοῦς.
- source_word: τοῖς μαθηταῖς
  choice: cho các môn đồ
  rationale: Theo sát danh từ có mạo từ trong tiếng Hy Lạp và không thêm từ sở hữu 'của Ngài', dù ngữ cảnh cho thấy đó là các môn đồ của Chúa.
- source_word: ἐγερθεὶς ἐκ νεκρῶν
  choice: sau khi Ngài đã được khiến sống lại từ cõi chết
  rationale: Diễn đạt rõ hành động xảy ra trước động từ chính và giữ thể bị động của ἐγερθεὶς; 'từ cõi chết' là cách nói tự nhiên về sự phục sinh.
theological_decisions:
- issue: Cách chuyển ngữ ἐγερθεὶς ἐκ νεκρῶν về sự phục sinh
  choice: sau khi Ngài đã được khiến sống lại từ cõi chết
  alternative: sau khi Ngài sống lại từ cõi chết
  rationale: Bản chính giữ thể bị động của phân từ Hy Lạp, tránh tự ý đổi sang cách nói chủ động, trong khi vẫn truyền đạt rõ sự phục sinh.
- issue: Sắc thái của ἐφανερώθη
  choice: bày tỏ mình
  alternative: hiện ra
  rationale: Cách chọn chính bảo tồn sắc thái biểu lộ của φανερόω và sự căng giữa hình thức bị động trong nguyên văn với cách diễn đạt tự nhiên; chú thích ghi nhận nghĩa ngữ cảnh 'hiện ra'.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng 'bày tỏ mình' để tránh câu bị động thiếu tự nhiên, đồng thời giữ sắc thái của động từ Hy Lạp; chú thích cung cấp cách dịch 'hiện ra' gần với ngữ cảnh hơn.
