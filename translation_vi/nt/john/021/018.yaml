revisions:
- from: 'Thật, thật, tôi nói với anh: Khi còn trẻ hơn, anh tự thắt áo[a] và đi nơi mình muốn; nhưng khi về già, anh sẽ giơ hai tay ra[b], người khác sẽ thắt áo cho anh và đưa anh[c] đến nơi anh không muốn.'
  to: 'Thật vậy, thật vậy, tôi bảo anh: Khi còn trẻ, anh tự thắt lưng và đi nơi anh muốn; nhưng khi về già, anh sẽ giơ hai tay ra[b], người khác sẽ thắt lưng cho anh và đưa anh[c] đến nơi anh không muốn.'
  rationale: Thay “thắt áo” bằng “thắt lưng” để dịch chính xác và tự nhiên hơn ζώννυμι, đồng thời duy trì sự song hành giữa hai vế của lời tiên báo. Chỉnh đại từ cho nhất quán và làm rõ chú thích về ý nghĩa của câu kế tiếp. Chú thích a vẫn được giữ như một lựa chọn từ vựng, dù không được gắn neo trong chính văn, phù hợp với bộ chú thích đã cung cấp.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T08:27:11Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch giữ được cấu trúc đối chiếu chính của nguyên văn: thời trẻ tự quyết đối lập với tuổi già bị người khác chi phối; cũng không diễn giải hình ảnh dang tay thành sự đóng đinh ngay trong chính văn. Tuy nhiên, “thắt áo” không phải cách nói tự nhiên hay chính xác cho ζώννυμι trong ngữ cảnh này; động từ chỉ việc thắt/gọn y phục bằng thắt lưng, và cần được dịch song hành ở cả hai vế.'
  naturalness: “Thắt áo” gây vướng và có thể bị hiểu là buộc chính chiếc áo. “Tự thắt lưng” / “thắt lưng cho anh” là cách nói Việt ngữ quen thuộc, trang trọng vừa phải, đồng thời bảo toàn hình ảnh nguyên văn. Dùng nhất quán “anh” thay vì chuyển sang “mình” giúp lời trực tiếp mạch lạc.
  terminology: Giữ “Thật vậy, thật vậy” cho ἀμὴν ἀμὴν, “giơ hai tay ra” cho ἐκτενεῖς τὰς χεῖράς σου, và không đưa cách hiểu về đóng đinh vào chính văn. Chú thích về thập tự giá cần diễn đạt chính xác rằng cái chết ấy là phương tiện qua đó Phi-e-rơ làm vinh hiển Đức Chúa Trời.
  issues:
  - severity: medium
    issue: “tự thắt áo” / “thắt áo cho anh”
    rationale: Cách dịch này không tự nhiên trong tiếng Việt và không phản ánh rõ nét nghĩa “gird” của ζώννυμι. “Tự thắt lưng” và “thắt lưng cho anh” vừa tự nhiên vừa giữ phép lặp có chủ ý trong tiếng Hy Lạp.
  - severity: low
    issue: Đại từ thay đổi từ “anh” sang “mình” trong “đi nơi mình muốn”
    rationale: Không sai nghĩa, nhưng dùng “anh” nhất quán sẽ rõ chủ thể hơn trong lời nói trực tiếp.
  - severity: low
    issue: Cách diễn đạt trong chú thích b về việc làm vinh hiển Đức Chúa Trời
    rationale: Câu kế tiếp nói về loại cái chết mà qua đó Phi-e-rơ sẽ làm vinh hiển Đức Chúa Trời; bản chú thích nên tránh cách ghép mơ hồ như thể lời nói, thay vì cái chết, làm vinh hiển Đức Chúa Trời.
