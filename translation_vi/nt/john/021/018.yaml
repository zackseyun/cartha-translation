source:
  edition: SBLGNT
  text: ἀμὴν ἀμὴν λέγω σοι, ὅτε ἦς νεώτερος, ἐζώννυες σεαυτὸν καὶ περιεπάτεις ὅπου ἤθελες· ὅταν δὲ γηράσῃς, ἐκτενεῖς τὰς χεῖράς σου, καὶ ἄλλος ⸂σε ζώσει⸃ καὶ οἴσει ὅπου οὐ θέλεις.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/018.yaml
  text: Truly[a], truly, I say to you, when you were younger, you used to dress yourself and walk where you wanted; but when you grow old, you will stretch out your hands[c][b], and another will dress you and carry you where you do not want to go.
translation:
  language: vi
  text: 'Thật vậy, thật vậy, tôi bảo anh: Khi còn trẻ, anh tự thắt lưng và đi nơi anh muốn; nhưng khi về già, anh sẽ giơ hai tay ra[b], người khác sẽ thắt lưng cho anh và đưa anh[c] đến nơi anh không muốn.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Cụm từ “giơ hai tay ra” thường được hiểu là ám chỉ việc Phi-e-rơ sẽ chết trên thập tự giá; câu kế tiếp nói Đức Giê-su dùng lời này để chỉ về cách chết mà qua đó ông sẽ làm vinh hiển Đức Chúa Trời.
    reason: cross_reference
  - marker: c
    text: Hay “dẫn anh” hoặc “mang anh đi”. Động từ Hy Lạp có thể chỉ việc một người bị mang hoặc đưa đến một nơi trái ý mình.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  choice: Thật, thật
  rationale: Giữ nguyên công thức nhấn mạnh được lặp đôi đặc trưng trong Giăng, với cách diễn đạt trang trọng và dễ hiểu.
- source_word: λέγω σοι
  choice: tôi nói với anh
  rationale: Chuyển sát lời nói trực tiếp và giữ đại từ số ít; “anh” phù hợp khi Đức Giê-su trực tiếp nói với Phi-e-rơ.
- source_word: ὅτε ἦς νεώτερος
  choice: khi còn trẻ hơn
  rationale: Phản ánh dạng so sánh νεώτερος và sự đối chiếu với lúc về già, dù tiếng Việt tự nhiên cũng có thể nói “khi còn trẻ”.
- source_word: ἐζώννυες σεαυτόν / ἄλλος σε ζώσει
  choice: anh tự thắt áo / người khác sẽ thắt áo cho anh
  rationale: ζώννυμι chỉ việc buộc hoặc thắt y phục. Dùng cùng một cách dịch ở hai vế để giữ rõ sự đối chiếu giữa tự chủ trước kia và lệ thuộc về sau.
- source_word: περιεπάτεις ὅπου ἤθελες
  choice: đi nơi mình muốn
  rationale: Trong ngữ cảnh này περιπατέω nói về sự đi lại cụ thể; “đi” tự nhiên hơn “bước đi” và vẫn diễn tả quyền tự do hành động.
- source_word: ὅταν δὲ γηράσῃς
  choice: nhưng khi về già
  rationale: Diễn đạt tự nhiên ý hướng về tương lai của mệnh đề với ὅταν và giữ sự tương phản của δέ.
- source_word: ἐκτενεῖς τὰς χεῖράς σου
  choice: anh sẽ giơ hai tay ra
  rationale: Giữ hình ảnh cụ thể mà không giải thích ngay thành đóng đinh; “hai tay” là cách diễn đạt tự nhiên cho số nhiều trong tiếng Việt.
- source_word: οἴσει
  choice: đưa anh
  rationale: φέρω có thể mang nghĩa mang, dẫn hoặc đưa đi. “Đưa” tự nhiên trong tiếng Việt và không quyết định người ấy bị khiêng hay bị dẫn.
- source_word: ὅπου οὐ θέλεις
  choice: đến nơi anh không muốn
  rationale: Thêm “đến” để câu tiếng Việt trọn nghĩa, trong khi vẫn giữ ý về một đích đến trái ý muốn.
theological_decisions:
- issue: Có nên nói rõ trong chính câu này rằng Phi-e-rơ sẽ bị đóng đinh hay không
  choice: Giữ nguyên hình ảnh “giơ hai tay ra” trong chính văn
  alternative: Diễn giải trực tiếp là Phi-e-rơ sẽ bị đóng đinh
  rationale: Câu kế tiếp mới giải thích rằng lời này chỉ về cách Phi-e-rơ sẽ chết. Giữ hình ảnh ở đây bảo toàn tiến trình tường thuật và không giải quyết trước sự hàm ý của lời Đức Giê-su.
- issue: Sắc thái của ζώννυμι trong lời tiên báo
  choice: Dịch nhất quán là “thắt áo”
  alternative: Dịch vế sau là “trói anh”
  rationale: “Trói” có thể làm nổi bật sự cưỡng bức và cái chết, nhưng cặp động từ cùng gốc trước và sau trước hết tạo sự tương phản giữa việc tự thắt áo và được người khác thắt áo; chính văn nên giữ phép song hành ấy.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ công thức lặp “Thật, thật” và các hình ảnh cụ thể của nguyên văn. “Thắt áo” gợi đúng hơn hành động buộc y phục so với “mặc quần áo”, đồng thời cho phép duy trì phép đối xứng trong câu.
