source:
  edition: SBLGNT
  text: ⸀ἔρχεται ⸀ὁ Ἰησοῦς καὶ λαμβάνει τὸν ἄρτον καὶ δίδωσιν αὐτοῖς, καὶ τὸ ὀψάριον ὁμοίως.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/013.yaml
  text: Jesus comes and takes the bread and gives it to them[b][a], and the fish likewise.
translation:
  language: vi
  text: Đức Giê-su đến, lấy bánh và trao cho họ, rồi cũng làm như vậy với cá.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔρχεται
  choice: đến
  rationale: Giữ thì hiện tại lịch sử của câu chuyện, phù hợp với lối kể sống động của Giăng; tiếng Việt không biến đổi hình thái động từ theo thì nên ngữ cảnh thể hiện giá trị này.
- source_word: λαμβάνει
  choice: cầm lấy
  rationale: Diễn tả hành động lấy phần bánh đã có sẵn trước khi trao cho các môn đồ, không thêm ý giải thích như “dọn” hay “phục vụ”.
- source_word: τὸν ἄρτον
  choice: bánh
  rationale: Chỉ phần bánh cụ thể trong bữa ăn; tiếng Việt thường không cần từ tương ứng riêng cho mạo từ xác định.
- source_word: δίδωσιν αὐτοῖς
  choice: trao cho họ
  rationale: “Trao” tự nhiên trong ngữ cảnh phân phát thức ăn và giữ rõ đối tượng tiếp nhận; tân ngữ là bánh đã được nêu ngay trước đó nên không cần lặp lại.
- source_word: τὸ ὀψάριον
  choice: cá
  rationale: Trong văn cảnh, từ này chỉ cá dùng làm thức ăn; không thêm chi tiết “đã nướng” vì bản thân từ Hy Lạp không bắt buộc sắc thái ấy.
- source_word: ὁμοίως
  choice: cũng vậy
  rationale: Giữ cách diễn đạt cô đọng, cho thấy Đức Chúa Jêsus cũng làm với cá như vừa làm với bánh.
theological_decisions:
- issue: Các động từ hiện tại lịch sử trong trình thuật Chúa phục sinh hiện ra
  choice: Dịch bằng chuỗi động từ “đến, cầm lấy, trao” mà không thêm dấu hiệu quá khứ
  alternative: “đã đến, cầm lấy bánh và trao cho họ”
  rationale: Tiếng Việt không chia động từ theo thì. Không thêm “đã” vừa tự nhiên vừa tránh làm phẳng sắc thái hiện tại lịch sử của nguyên văn, mà không thay đổi ý nghĩa thần học.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Jêsus” theo lối gọi Kinh Thánh tiếng Việt; dấu chấm phẩy làm rõ rằng cụm “cá cũng vậy” lược lại các hành động cầm lấy và trao.
