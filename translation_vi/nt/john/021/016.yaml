source:
  edition: SBLGNT
  text: λέγει αὐτῷ πάλιν δεύτερον· Σίμων ⸀Ἰωάννου, ἀγαπᾷς με; λέγει αὐτῷ· Ναί, κύριε, σὺ οἶδας ὅτι φιλῶ σε. λέγει αὐτῷ· Ποίμαινε τὰ πρόβατά μου.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/016.yaml
  text: He said to him again a second time[a], “Simon, son of John, do you love me?” He said to him, “Yes, Lord; you know that I love you.” He said to him[b], “Shepherd my sheep.”
translation:
  language: vi
  text: 'Ngài lại hỏi ông lần thứ hai: “Si-môn, con của Giăng, con có yêu Thầy không?” Ông thưa: “Vâng, lạy Chúa, Chúa biết rằng con yêu Chúa.” Ngài bảo ông: “Hãy chăn dắt chiên của Ta.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hy Lạp dùng hai động từ khác nhau cho “yêu” trong cuộc đối thoại này: Chúa Giê-su hỏi bằng agapaō, còn Phi-e-rơ đáp bằng phileō. Nhiều người cho rằng có sự phân biệt ý nghĩa; những người khác xem đây là biến đổi văn phong. Chính văn dịch cả hai là “yêu” để không nhấn mạnh quá mức sự khác biệt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν δεύτερον
  choice: lại hỏi ông lần thứ hai
  rationale: Diễn đạt tự nhiên trong tiếng Việt mà vẫn giữ cả ý lặp lại của πάλιν và thứ tự lần thứ hai của δεύτερον.
- source_word: Σίμων Ἰωάννου
  choice: Si-môn, con của Giăng
  rationale: Danh cách kèm sở hữu cách chỉ phụ hệ, nên dịch là “con của Giăng”; không theo dị bản truyền thống “con Giô-na” vốn không phải cách đọc ở đây.
- source_word: ἀγαπᾷς με
  choice: con có yêu Thầy không
  rationale: “Yêu” là cách diễn đạt tự nhiên, không áp đặt một sắc thái chuyên biệt lên ἀγαπάω. Đại từ “Thầy” phù hợp với lời Chúa Giê-su hỏi môn đồ.
- source_word: Ναί, κύριε
  choice: Vâng, lạy Chúa
  rationale: “Vâng” thể hiện lời đáp khẳng định kính trọng; “lạy Chúa” chuyển tải cách xưng hô κύριε trong ngữ cảnh tôn kính.
- source_word: σὺ οἶδας ὅτι φιλῶ σε
  choice: Chúa biết rằng con yêu Chúa
  rationale: Giữ sự nhấn nhẹ của đại từ σὺ qua việc đặt “Chúa” làm chủ ngữ rõ ràng. Dịch φιλέω là “yêu” để không cường điệu hóa sự khác biệt với ἀγαπάω; biến thể từ vựng được nêu ở chú thích.
- source_word: Ποίμαινε
  choice: Hãy chăn dắt
  rationale: “Chăn dắt” giữ trọn hình ảnh người chăn chăm sóc, hướng dẫn và coi sóc đàn chiên, rộng hơn chỉ “cho ăn”.
- source_word: τὰ πρόβατά μου
  choice: chiên của Ta
  rationale: Giữ hình ảnh cụ thể “chiên” và quan hệ sở hữu thuộc về Chúa Giê-su.
theological_decisions:
- issue: Có nên dùng hai từ tiếng Việt khác nhau cho ἀγαπάω và φιλέω hay không
  choice: Dịch cả hai là “yêu” trong chính văn và ghi nhận sự thay đổi động từ trong chú thích.
  alternative: Dịch ἀγαπάω là “yêu” và φιλέω là “thương” hoặc “quý mến”.
  rationale: Hai động từ thật sự khác nhau trong tiếng Hy Lạp, nhưng phạm vi nghĩa của chúng có thể chồng lấn trong văn phong Giăng. Dùng hai từ Việt khác nhau dễ khiến độc giả hiểu rằng có sự phân biệt tâm lý hoặc thần học rõ rệt hơn điều bản văn xác quyết.
translation_notes:
  register: 'Văn phong hiện đại, trang trọng và dễ hiểu. Cách xưng hô duy trì quan hệ thầy–trò: Chúa Giê-su tự xưng “Thầy” trong câu hỏi; Phi-e-rơ xưng “con” và gọi Ngài là “Chúa”; mệnh lệnh dùng “Ta” để có sắc thái trang trọng. Tên riêng theo dạng quen thuộc trong truyền thống Kinh Thánh tiếng Việt.'
