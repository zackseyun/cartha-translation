id: JHN.21.9
reference: John 21:9
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ὡς οὖν ἀπέβησαν εἰς τὴν γῆν βλέπουσιν ἀνθρακιὰν κειμένην καὶ ὀψάριον ἐπικείμενον καὶ ἄρτον.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/009.yaml
  text: So when they got out onto the land[a], they saw a charcoal fire laid there, and fish lying on it[b], and bread.
translation:
  language: vi
  text: Vậy, khi họ lên đất liền[a], họ thấy một đống than hồng[b], trên đó có cá được đặt, và bánh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “lên bờ.” Nguyên văn Hy Lạp sát nghĩa hơn là “lên đất liền.”'
    reason: lexical_alternative
  - marker: b
    text: “Đống than hồng” dịch một từ cũng được dùng trong Giăng 18:18, tạo nên sự liên hệ từ ngữ với bối cảnh Phi-e-rơ chối Chúa trước đó.
    reason: cross_reference
lexical_decisions:
- source_word: Ὡς οὖν
  choice: Vậy, khi
  rationale: Kết hợp sắc thái thời gian của ὡς với mạch nối tiếp của οὖν bằng lối kể tự nhiên trong tiếng Việt.
- source_word: ἀπέβησαν εἰς τὴν γῆν
  choice: bước lên đất liền
  rationale: Diễn tả việc họ rời thuyền để lên đất, khá sát hình ảnh Hy Lạp mà vẫn tự nhiên; chú thích nêu cách nói thành ngữ 'lên bờ'.
- source_word: βλέπουσιν
  choice: họ thấy
  rationale: Dịch hiện tại lịch sử bằng thì kể chuyện tự nhiên trong tiếng Việt; tiếng Việt không cần đánh dấu hình thái quá khứ.
- source_word: ἀνθρακιὰν κειμένην
  choice: ở đó có một bếp than
  rationale: ἀνθρακιά chỉ lửa than hay đống than đang cháy; 'bếp than' rõ nghĩa, tự nhiên, đồng thời giữ liên hệ từ vựng với Giăng 18:18. κειμένην được diễn đạt bằng cấu trúc hiện hữu 'ở đó có'.
- source_word: ὀψάριον ἐπικείμενον
  choice: trên có cá
  rationale: Cho biết cá nằm trên bếp than mà không thêm ý 'đã nướng chín', điều nguyên văn không nói rõ; 'cá' giữ được khả năng dùng theo nghĩa tập hợp.
- source_word: ἄρτον
  choice: bánh
  rationale: Trong bối cảnh Kinh Thánh, 'bánh' là cách dịch tự nhiên, không xác định quá mức đó là một ổ hay nhiều ổ.
theological_decisions:
- issue: Thì hiện tại lịch sử trong βλέπουσιν
  choice: 'Diễn đạt theo lối kể tự nhiên: ''họ thấy'''
  alternative: Giữ sắc thái hiện tại sống động theo kiểu 'họ nhìn thấy' trong một chuỗi kể hiện tại
  rationale: Đây là đặc điểm văn thể hơn là một khẳng định thần học. Tiếng Việt không biến đổi động từ theo thì, nên ngữ cảnh tự nhiên truyền đạt trình tự quá khứ mà không cần thêm từ 'đã'.
- issue: Liên hệ từ vựng của ἀνθρακιά với cảnh Phi-e-rơ chối Chúa
  choice: Dùng nhất quán 'bếp than' và ghi chú liên hệ Giăng 18:18
  alternative: Dịch 'đống than hồng' hoặc 'lửa than'
  rationale: Giữ được tiếng vọng văn chương có thật trong nguyên văn mà không giải thích nó thành một kết luận thần học cụ thể.
translation_notes:
  register: Tiếng Việt phổ thông hiện đại, trang trọng vừa phải và dễ hiểu. Câu giữ nhịp kể ngắn gọn. Tuy nhiên, vì chú thích [b] giải thích 'bếp than', dấu [b] cần được đặt ngay sau cụm này trong bản xuất bản.
