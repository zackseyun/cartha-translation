  naturalness: Câu văn nhìn chung tự nhiên. “Đống than hồng” và “đặt trên đó” vừa rõ quan hệ không gian vừa phù hợp lối kể tiếng Việt hiện đại.
  terminology: Dùng “đống than hồng” cho ἀνθρακιά chính xác hơn “bếp than” trong ngữ cảnh này và có thể dùng nhất quán với Giăng 18:18 để giữ liên hệ từ vựng. “Bánh” cho ἄρτον và “cá” cho ὀψάριον đều phù hợp.
