  text: λέγει αὐτοῖς ὁ Ἰησοῦς· Ἐνέγκατε ἀπὸ τῶν ὀψαρίων ὧν ἐπιάσατε νῦν.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/010.yaml
  text: Jesus said to them[a], “Bring some of the fish that you have now caught.”
translation:
  language: vi
  text: 'Đức Giê-su nói với họ[a]: “Hãy đem một ít cá các anh vừa bắt được.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc, sát nghĩa hơn: “Hãy đem từ số cá các anh bắt được bây giờ.”'
    reason: Giữ lại lựa chọn dịch sát hơn của ἀπὸ τῶν ὀψαρίων ... νῦν, trong khi bản văn chính dùng cách diễn đạt tiếng Việt tự nhiên hơn.
lexical_decisions:
- source_word: λέγει
  choice: nói
  rationale: Thì hiện tại lịch sử trong lời thuật Hy Lạp được chuyển tự nhiên sang lối kể tiếng Việt; động từ “nói” không biểu thị thì bằng hình thái nên không cần thêm dấu hiệu thời gian.
- source_word: Ἐνέγκατε
  choice: Hãy đem đến đây
  rationale: Mệnh lệnh aorist số nhiều của φέρω là một lời truyền trực tiếp. “Đem đến đây” diễn đạt rõ hướng chuyển vật về phía Đức Giê-su trong ngữ cảnh.
- source_word: ἀπὸ τῶν ὀψαρίων
  choice: một ít cá
  rationale: 'ἀπό với cụm danh từ chỉ cá mang nghĩa phân lượng: lấy một phần trong số cá vừa bắt. “Một ít cá” tự nhiên trong tiếng Việt và không hàm ý đem toàn bộ.'
- source_word: ὀψαρίων
  choice: cá
  rationale: Trong ngữ cảnh mẻ lưới vừa kéo từ biển lên, từ này chỉ cá; không cần xác định thêm là cá nhỏ hay cá đã chế biến.
- source_word: ὧν ἐπιάσατε
  choice: các anh ... bắt được
  rationale: Mệnh đề quan hệ xác định số cá đang được nói đến. “Bắt được” phù hợp với ngữ cảnh đánh cá và thể hiện kết quả của hành động.
- source_word: νῦν
  choice: vừa
  rationale: Ở đây νῦν nhấn mạnh mẻ cá mới bắt ngay trước đó. “Vừa” diễn đạt sự gần kề về thời gian một cách tự nhiên hơn “bây giờ” trong tiếng Việt.
