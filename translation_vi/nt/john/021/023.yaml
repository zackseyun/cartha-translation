- from: 'Vì thế, lời này lan truyền giữa các anh em rằng môn đồ ấy sẽ không chết. Nhưng Đức Chúa Jêsus không nói với ông rằng môn đồ ấy sẽ không chết; Ngài chỉ nói: “Nếu Ta muốn người ấy cứ ở lại cho đến khi Ta đến, thì có liên quan gì đến con?”[a]'
