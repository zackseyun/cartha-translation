id: JHN.21.23
reference: John 21:23
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐξῆλθεν οὖν ⸂οὗτος ὁ λόγος⸃ εἰς τοὺς ἀδελφοὺς ὅτι ὁ μαθητὴς ἐκεῖνος οὐκ ἀποθνῄσκει. ⸂οὐκ εἶπεν δὲ⸃ αὐτῷ ὁ Ἰησοῦς ὅτι οὐκ ἀποθνῄσκει ἀλλ’· Ἐὰν αὐτὸν θέλω μένειν ἕως ἔρχομαι, τί πρὸς σέ;
base_translation:
  language: en
  yaml_path: translation/nt/john/021/023.yaml
  text: So this report spread among the brothers that that disciple would not die. Yet Jesus did not say to him that he would not die, but, “If I want him to remain until I come, what is that to you?”
translation:
  language: vi
  text: 'Vì thế, tin ấy lan truyền giữa các anh em rằng môn đồ ấy sẽ không chết. Nhưng Chúa Giê-su không nói với ông rằng môn đồ ấy sẽ không chết, mà nói: “Nếu Ta muốn người ấy cứ ở lại cho đến khi Ta đến, thì có liên quan gì đến con?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Chúa Giê-su không hứa rằng môn đồ ấy sẽ không bao giờ chết. Ngài nêu một điều kiện giả định: “Nếu Ta muốn người ấy cứ ở lại cho đến khi Ta đến...”'
    reason: clarification
lexical_decisions:
- source_word: ἐξῆλθεν οὖν οὗτος ὁ λόγος
  choice: Vì thế, lời này lan truyền
  rationale: Diễn đạt tự nhiên thành ngữ chỉ một lời được truyền đi, đồng thời giữ sắc thái rộng của λόγος thay vì xác định quá mức đó là một tin đồn.
- source_word: εἰς τοὺς ἀδελφοὺς
  choice: giữa các anh em
  rationale: Trong ngữ cảnh này, giới từ εἰς diễn tả sự lan truyền trong cộng đồng môn đồ; ἀδελφοί được dịch theo hình thức số nhiều giống đực của nguyên văn.
- source_word: ὁ μαθητὴς ἐκεῖνος
  choice: môn đồ ấy
  rationale: Giữ đại từ chỉ định ἐκεῖνος và mối liên hệ với môn đồ cụ thể đang được nói đến.
- source_word: οὐκ ἀποθνῄσκει
  choice: sẽ không chết
  rationale: Thì hiện tại Hy Lạp nằm trong nội dung lời truyền đạt có ý nghĩa hướng đến tương lai; tiếng Việt tự nhiên dùng “sẽ không chết”.
- source_word: Ἐὰν αὐτὸν θέλω μένειν
  choice: Nếu Ta muốn người ấy cứ ở lại
  rationale: Giữ nguyên tính điều kiện của ἐάν, ý chí trong θέλω, và sắc thái tiếp tục của μένειν.
- source_word: ἕως ἔρχομαι
  choice: cho đến khi Ta đến
  rationale: Dịch sát cách nói của nguyên văn, không diễn giải ἔρχομαι thành thuật ngữ thần học cụ thể hơn như “trở lại”.
- source_word: τί πρὸς σέ
  choice: thì có liên quan gì đến con?
  rationale: Thành ngữ tiếng Việt rõ nghĩa, giữ giọng hỏi trực tiếp nhằm chuyển sự chú ý của Phi-e-rơ khỏi số phận của môn đồ kia.
theological_decisions:
- issue: Bản chất của lời lan truyền về môn đồ ấy
  choice: Dùng “lời này lan truyền” và giữ lời đính chính rõ ràng của tác giả.
  alternative: Dịch là “tin này lan truyền” hoặc “lời đồn này lan truyền”.
  rationale: λόγος có thể là lời, phát biểu hay tin được truyền đi. “Lời này” giữ được độ mở từ vựng và câu sau cho thấy cộng đồng đã hiểu lời ấy theo một kết luận mà Đức Chúa Jêsus không hề khẳng định.
- issue: Ý nghĩa của câu điều kiện về việc môn đồ ở lại
  choice: Giữ nguyên giả định “Nếu Ta muốn...”, không biến nó thành lời hứa rằng môn đồ sẽ không chết.
  alternative: Diễn giải như một lời tiên báo chắc chắn về tuổi thọ của môn đồ hoặc về thời điểm Chúa đến.
  rationale: ἐάν đánh dấu điều kiện; chính câu văn đối chiếu điều Đức Chúa Jêsus không nói với điều Ngài thực sự nói, nên không được giải quyết giả định thành một khẳng định thần học.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Jêsus” theo lối gọi Tin Lành Việt ngữ quen thuộc; đại từ “Ta/con” phản ánh quan hệ của Đức Chúa Jêsus với Phi-e-rơ. Dấu chấm phẩy làm rõ sự đối lập giữa điều Ngài không nói và lời Ngài thực sự nói.
