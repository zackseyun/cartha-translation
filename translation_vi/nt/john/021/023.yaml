  verdict: revise
  source_fidelity: 'Bản dịch giữ đúng diễn tiến của câu: một lời/tin được lan truyền trong cộng đồng các anh em, nhưng Đức Chúa Jêsus không nói với Phi-e-rơ rằng môn đồ kia sẽ không chết; Ngài chỉ nêu một điều kiện giả định. Tuy nhiên, “Ngài chỉ nói” thêm sắc thái hạn định không cần thiết so với ἀλλ’ (“nhưng [nói]”).'
  naturalness: Câu đầu với cấu trúc “lời này lan truyền giữa các anh em rằng” hiểu được nhưng chưa thật tự nhiên trong tiếng Việt hiện đại. “Tin ấy lan truyền giữa các anh em rằng...” diễn đạt rõ đây là nội dung được truyền đi. Chính tả “Giê-su” là dạng hiện đại, phổ thông hơn trong tiếng Việt chuẩn.
  terminology: “Các anh em” giữ được hình thức giống đực số nhiều của ἀδελφοί, trong ngữ cảnh chỉ cộng đồng môn đồ. “Môn đồ” phù hợp với văn phong Kinh Thánh Tin Lành. Giữ “Ta/con” trong lời trực tiếp để phản ánh register trang trọng và tương quan với Phi-e-rơ.
  issues:
