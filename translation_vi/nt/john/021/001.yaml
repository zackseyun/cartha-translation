  to: Sau những việc ấy, Đức Chúa Giê-su lại tỏ mình[a] cho các môn đệ bên biển Ti-bê-ri-át. Ngài tỏ mình như thế này.
  rationale: 'Bản sửa thay các lối diễn đạt mô phỏng nguyên văn bằng tiếng Việt hiện đại tự nhiên hơn, đồng thời giữ mọi yếu tố ngữ nghĩa chính: “sau những việc ấy”, “lại”, việc tự biểu lộ cho các môn đệ tại biển Ti-bê-ri-át, và sự lặp lại của động từ để mở đầu trình thuật. Chú thích vẫn bảo tồn lựa chọn từ vựng hợp lệ “hiện ra” mà không làm mất sắc thái tự biểu lộ của nguyên văn.'
