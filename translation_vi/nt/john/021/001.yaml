source:
  edition: SBLGNT
  text: Μετὰ ταῦτα ἐφανέρωσεν ἑαυτὸν πάλιν ⸀ὁ Ἰησοῦς τοῖς μαθηταῖς ἐπὶ τῆς θαλάσσης τῆς Τιβεριάδος· ἐφανέρωσεν δὲ οὕτως.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/001.yaml
  text: After these things[a], Jesus revealed himself again to the disciples by the Sea of Tiberias, and he revealed himself in this way.
translation:
  language: vi
  text: Sau những việc ấy, Đức Chúa Giê-su lại tỏ mình[a] cho các môn đệ bên biển Ti-bê-ri-át. Ngài tỏ mình như thế này.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “hiện ra”; động từ Hy Lạp có thể chỉ việc làm cho mình được nhìn thấy hoặc được nhận biết.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: Sau những việc ấy
  rationale: Giữ số nhiều của đại từ chỉ định và lối chuyển tiếp thời gian đặc trưng trong văn phong Giăng.
- source_word: ἐφανέρωσεν ἑαυτὸν
  choice: bày tỏ chính mình
  rationale: Diễn đạt cả ý làm cho thấy được/làm cho được biết và giữ lực phản thân của ἑαυτόν; tự nhiên hơn lối dịch sát cứng 'bày tỏ bản thân' trong ngữ cảnh này.
- source_word: πάλιν
  choice: lại
  rationale: Biểu thị sự tái diễn sau các lần Chúa Jêsus phục sinh hiện ra trước đó.
- source_word: τοῖς μαθηταῖς
  choice: cho các môn đồ
  rationale: Không thêm từ sở hữu 'của Ngài', vì nguyên văn chỉ có mạo từ xác định.
- source_word: ἐπὶ τῆς θαλάσσης τῆς Τιβεριάδος
  choice: bên Biển Ti-bê-ri-át
  rationale: Với ἐπί và sở hữu cách, 'bên' diễn đạt tự nhiên địa điểm ở cạnh biển; giữ nguyên tên gọi được sách Giăng sử dụng.
- source_word: ἐφανέρωσεν δὲ οὕτως
  choice: Ngài đã bày tỏ chính mình như sau
  rationale: Lặp lại động từ để giữ liên kết văn chương của nguyên văn; 'như sau' tự nhiên mở đầu phần thuật lại cách sự việc diễn ra.
theological_decisions:
- issue: Ngôn ngữ mô tả sự hiện diện của Chúa Jêsus phục sinh
  choice: bày tỏ chính mình
  alternative: hiện ra; làm cho người ta nhận biết Ngài
  rationale: Cách dịch này giữ sắc thái tự mặc khải của φανερόω mà không thu hẹp sự kiện thành việc chỉ được nhìn thấy, đồng thời không phủ nhận tính hiện thực của cuộc gặp gỡ sau phục sinh.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Jêsus” và “môn đồ” theo lối gọi Kinh Thánh quen thuộc; giữ địa danh “Biển Ti-bê-ri-át”. Câu thứ hai được tách riêng để tiếng Việt tự nhiên mà vẫn bảo toàn sự lặp lại có chủ ý trong nguyên văn.
