  - severity: low
    issue: Chính tả “Jêsus” và từ “môn đồ” kém phù hợp với chuẩn hiện đại mục tiêu.
    rationale: “Giê-su” là dạng chính tả hiện hành rộng rãi; “môn đệ” là thuật ngữ hiện đại thông dụng cho μαθηταί.
  - severity: low
    issue: “Ngài đã bày tỏ chính mình như sau” nặng và không cần thiết về thì.
    rationale: Aorist δεύτερο ἐφανέρωσεν có chức năng giới thiệu cách thức của câu chuyện sau đó. “Ngài tỏ mình như thế này” giữ nguyên sự lặp lại và mạch văn tự nhiên.
