id: JHN.21.4
reference: John 21:4
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Πρωΐας δὲ ἤδη ⸀γενομένης ⸀ἔστη Ἰησοῦς εἰς τὸν αἰγιαλόν· οὐ μέντοι ᾔδεισαν οἱ μαθηταὶ ὅτι Ἰησοῦς ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/004.yaml
  text: When daybreak had already come[a], Jesus stood on the shore; yet the disciples did not know that it was Jesus.
translation:
  language: vi
  text: Khi trời đã sáng, Giê-su đứng trên bờ; nhưng các môn đồ không biết đó là Giê-su.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “không nhận ra đó là Giê-su.” Nguyên văn Hy Lạp sát nghĩa hơn là “không biết đó là Giê-su.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πρωΐας ... ἤδη γενομένης
  choice: Khi trời đã sáng
  rationale: Cụm sở hữu cách tuyệt đối diễn tả hoàn cảnh thời gian. “Trời đã sáng” truyền đạt tự nhiên πρωΐα cùng sắc thái ἤδη, tức buổi sớm đã đến.
- source_word: δὲ
  choice: không dịch thành một từ riêng
  rationale: δέ là từ nối nhẹ để tiếp diễn câu chuyện; trong tiếng Việt, quan hệ mạch văn đã rõ qua mệnh đề thời gian nên không cần thêm “bấy giờ” hay “và”.
- source_word: ἔστη
  choice: đứng
  rationale: Động từ aorist ἔστη được diễn đạt gọn bằng “đứng”, vừa tự nhiên vừa không buộc phải xác định là bắt đầu đứng hay đang đứng.
- source_word: εἰς τὸν αἰγιαλόν
  choice: trên bờ
  rationale: Với động từ chỉ tư thế, εἰς có thể chỉ vị trí; αἰγιαλός là bờ hồ hoặc bãi ven nước. “Trên bờ” phù hợp ngữ cảnh hồ Ga-li-lê.
- source_word: οὐ μέντοι
  choice: nhưng ... không
  rationale: 'Cách diễn đạt này giữ sắc thái tương phản: Giê-su hiện diện trên bờ nhưng các môn đồ vẫn không biết đó là ngài.'
- source_word: ᾔδεισαν
  choice: không biết
  rationale: Giữ nghĩa trực tiếp của οἶδα là “biết”; trong ngữ cảnh, cụm từ cũng có thể được hiểu là không nhận ra, nên phương án ấy được ghi trong chú thích.
- source_word: οἱ μαθηταὶ
  choice: các môn đồ
  rationale: Mạo từ xác định chỉ nhóm môn đồ đã được biết trong ngữ cảnh; tiếng Việt không cần thêm đại từ sở hữu.
- source_word: ὅτι Ἰησοῦς ἐστιν
  choice: đó là Giê-su
  rationale: Đây là cách nhận diện tự nhiên trong tiếng Việt, phản ánh sát cấu trúc và ý nghĩa của mệnh đề Hy Lạp.
theological_decisions:
- issue: Việc các môn đồ không nhận biết Giê-su sau khi ngài sống lại
  choice: Dịch là “không biết đó là Giê-su”, không giải thích nguyên nhân.
  alternative: “không nhận ra đó là Giê-su”
  rationale: Câu văn chỉ thuật lại việc họ không biết hoặc không nhận ra ngài, chứ không nói vì sao. Bản dịch giữ nguyên sự dè dặt ấy và không suy diễn về diện mạo của Giê-su hay khả năng nhận thức của các môn đồ.
- issue: Danh xưng dành cho Ἰησοῦς
  choice: Giê-su
  alternative: Chúa Giê-su
  rationale: Nguyên văn chỉ có tên riêng Ἰησοῦς, không có κύριος; vì vậy không thêm danh hiệu “Chúa” ngay trong câu này.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “môn đồ” để giữ thuật ngữ quen thuộc của văn mạch Tin Mừng; dùng dạng tên hiện đại “Giê-su”. Dấu chấm phẩy bảo toàn nhịp tương phản của câu mà không làm câu quá nặng.
