id: JHN.21.11
reference: John 21:11
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀνέβη ⸀οὖν Σίμων Πέτρος καὶ εἵλκυσεν τὸ δίκτυον ⸂εἰς τὴν γῆν⸃ μεστὸν ἰχθύων μεγάλων ἑκατὸν πεντήκοντα τριῶν· καὶ τοσούτων ὄντων οὐκ ἐσχίσθη τὸ δίκτυον.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/011.yaml
  text: So Simon Peter went aboard and pulled the net onto the shore[a], full of large fish, one hundred fifty-three; and though there were so many[b], the net was not torn.
translation:
  language: vi
  text: Vậy, Si-môn Phi-e-rơ lên thuyền[a] và kéo lưới vào bờ[b]. Lưới đầy cá lớn, tất cả một trăm năm mươi ba con; dù nhiều cá như vậy, lưới vẫn không bị rách.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nghĩa đen là “đi lên”; trong ngữ cảnh này có lẽ là lên thuyền để kéo lưới.
    reason: lexical_alternative
  - marker: b
    text: Nghĩa đen là “đến đất liền”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέβη
  choice: lên thuyền
  rationale: Động từ có nghĩa đen là “đi lên”; trong bối cảnh này, nhiều khả năng chỉ việc Phi-e-rơ lên thuyền để kéo lưới. Bản dịch giữ động từ “lên” và bổ sung đối tượng hàm ẩn theo ngữ cảnh, đồng thời ghi chú nghĩa đen.
- source_word: οὖν
  choice: Vậy
  rationale: Diễn tả sự tiếp nối mang tính kết quả từ lời truyền bảo ngay trước đó; “Vậy” tự nhiên trong văn kể chuyện tiếng Việt.
- source_word: εἵλκυσεν
  choice: kéo
  rationale: Diễn đạt trực tiếp hành động đưa tấm lưới nặng vào bờ, không cường điệu sắc thái thành “lôi” hay “kéo lê”.
- source_word: τὸ δίκτυον
  choice: lưới
  rationale: Từ thông dụng và chính xác cho dụng cụ đánh cá trong ngữ cảnh.
- source_word: εἰς τὴν γῆν
  choice: vào bờ
  rationale: Nghĩa đen là “đến đất/liền”; trong cảnh đánh cá, “vào bờ” diễn đạt tự nhiên hướng chuyển lưới từ nước lên đất.
- source_word: μεστὸν ἰχθύων μεγάλων
  choice: đầy cá lớn
  rationale: Giữ cấu trúc miêu tả và sắc thái trang trọng, rõ ràng của nguyên văn.
- source_word: ἑκατὸν πεντήκοντα τριῶν
  choice: một trăm năm mươi ba con
  rationale: Giữ nguyên con số cụ thể; thêm loại từ “con” theo ngữ pháp tự nhiên của tiếng Việt.
- source_word: τοσούτων ὄντων
  choice: dù nhiều cá như vậy
  rationale: Thể hiện giá trị nhượng bộ của kết cấu phân từ sở hữu cách và làm rõ đối tượng đã được nhắc đến mà không thay đổi ý.
- source_word: οὐκ ἐσχίσθη
  choice: vẫn không bị rách
  rationale: Giữ thể bị động của nguyên văn; “vẫn” làm nổi bật sự tương phản nhượng bộ đã có trong câu.
theological_decisions: []
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, rõ ràng và trang nghiêm vừa phải. Dùng câu ngắn để tránh chuỗi bổ nghĩa nặng nề, nhưng vẫn giữ quan hệ diễn tiến và nhượng bộ của nguyên văn. Tên riêng được phiên âm theo lối quen thuộc trong Kinh Thánh tiếng Việt.
