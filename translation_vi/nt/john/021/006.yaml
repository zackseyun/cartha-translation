  to: 'Nhưng Người bảo họ: “Hãy thả lưới bên phải thuyền, thì các anh sẽ tìm thấy.”[a] Vậy họ thả lưới, và vì có quá nhiều cá nên không còn kéo lưới lên nổi.'
  rationale: Chỉnh hai chỗ nhỏ để lời kể và quan hệ nguyên nhân tự nhiên hơn trong tiếng Việt, không thay đổi nghĩa. Chú thích được biên tập lại để nêu rõ rằng “cá” là tân ngữ hàm ẩn, còn bản văn chính vẫn bảo tồn sự không nêu tân ngữ của tiếng Hy Lạp.
