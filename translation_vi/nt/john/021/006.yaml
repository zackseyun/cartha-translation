base_translation:
  language: en
  yaml_path: translation/nt/john/021/006.yaml
  text: But he said to them[a], “Cast the net on the right side of the boat, and you will find some.” So they cast it, and they were no longer able to haul it in because of the multitude of fish.
translation:
  language: vi
  text: 'Nhưng Người bảo họ: “Hãy thả lưới bên phải thuyền, thì các anh sẽ tìm thấy.”[a] Vậy họ thả lưới, và vì có quá nhiều cá nên không còn kéo lưới lên nổi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “thì các anh sẽ tìm thấy cá.” Động từ Hy Lạp “tìm thấy” không nêu tân ngữ; theo ngữ cảnh đánh cá, tân ngữ được hiểu là cá.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Βάλετε
  choice: Hãy thả
  rationale: Trong ngữ cảnh đánh cá, βάλλω chỉ việc đưa hoặc quăng lưới xuống nước; “thả lưới” tự nhiên trong tiếng Việt và diễn đạt đúng hành động.
- source_word: τὰ δεξιὰ μέρη τοῦ πλοίου
  choice: bên phải thuyền
  rationale: Cụm từ chỉ khu vực phía bên phải của chiếc thuyền; cách diễn đạt này rõ ràng, tự nhiên và không dùng thuật ngữ hàng hải chuyên biệt.
- source_word: τὸ δίκτυον
  choice: lưới
  rationale: Danh từ số ít chỉ lưới đánh cá; tiếng Việt không cần mạo từ tương ứng.
- source_word: εὑρήσετε
  choice: các anh sẽ tìm thấy
  rationale: Giữ nguyên việc động từ không có tân ngữ được phát biểu trong tiếng Hy Lạp, qua đó bảo tồn sắc thái hàm ý từ ngữ cảnh.
- source_word: οὐκέτι αὐτὸ ἑλκύσαι ἴσχυον
  choice: không còn kéo lưới lên nổi
  rationale: Diễn đạt tự nhiên cả ý thời gian của οὐκέτι lẫn ý không đủ sức hoặc khả năng của ἴσχυον; “lưới” làm rõ đại từ αὐτό trong tiếng Việt.
- source_word: ἀπὸ τοῦ πλήθους τῶν ἰχθύων
  choice: vì cá quá nhiều
  rationale: Thể hiện quan hệ nguyên nhân và số lượng cá rất lớn bằng lối nói hiện đại, tự nhiên.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “người ấy” vì chủ thể trong câu Hy Lạp là đại từ, còn danh tính được xác định từ văn cảnh. “Các anh” phù hợp với lời nói trực tiếp dành cho nhóm môn đồ.
