id: JHN.21.7
reference: John 21:7
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: λέγει οὖν ὁ μαθητὴς ἐκεῖνος ὃν ἠγάπα ὁ Ἰησοῦς τῷ Πέτρῳ· Ὁ κύριός ἐστιν. Σίμων οὖν Πέτρος, ἀκούσας ὅτι ὁ κύριός ἐστιν, τὸν ἐπενδύτην διεζώσατο, ἦν γὰρ γυμνός, καὶ ἔβαλεν ἑαυτὸν εἰς τὴν θάλασσαν·
base_translation:
  language: en
  yaml_path: translation/nt/john/021/007.yaml
  text: So that disciple whom Jesus loved said to Peter[a], “It is the Lord.” Therefore, when Simon Peter heard that it was the Lord, he tied his outer garment around himself (for he was lightly clothed) and threw himself into the sea.
translation:
  language: vi
  text: 'Vậy, người môn đồ kia, người mà Đức Chúa Jêsus yêu, nói với Phi-e-rơ: “Chính là Chúa!” Vậy, Si-môn Phi-e-rơ, khi nghe rằng đó là Chúa, buộc áo ngoài quanh mình (vì ông chỉ mặc ít quần áo)[a], rồi lao mình xuống biển.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “vì ông khỏa thân.” Từ Hy Lạp γυμνός có thể chỉ tình trạng không mặc gì hoặc mặc không đủ/ít áo quần, tùy ngữ cảnh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει οὖν
  choice: Vì vậy ... nói
  rationale: Giữ lực liên kết và suy luận của οὖν trong mạch kể; thì hiện tại lịch sử λέγει được chuyển tự nhiên bằng “nói”.
- source_word: ὁ μαθητὴς ἐκεῖνος ὃν ἠγάπα ὁ Ἰησοῦς
  choice: người môn đồ ấy, người được Đức Chúa Jêsus yêu
  rationale: Giữ đại từ chỉ định ἐκεῖνος và cách gọi đặc trưng trong sách Giăng; cấu trúc bị động giúp câu tiếng Việt rõ và tự nhiên.
- source_word: Ὁ κύριός ἐστιν
  choice: Chính là Chúa!
  rationale: “Chúa” bảo toàn cả tước hiệu thông thường lẫn sức nặng Kitô học; “chính là” diễn đạt tự nhiên lời nhận ra căn tính trong tiếng Việt.
- source_word: Σίμων οὖν Πέτρος, ἀκούσας
  choice: Khi Si-môn Phi-e-rơ nghe ... ông liền
  rationale: Diễn đạt phân từ bất định ἀκούσας theo nghĩa thời gian và để οὖν thứ hai hiện qua “liền”, tránh lặp cứng “vì vậy”.
- source_word: τὸν ἐπενδύτην διεζώσατο
  choice: buộc áo ngoài quanh mình
  rationale: ἐπενδύτης là áo mặc ngoài; διεζώσατο chỉ hành động quấn hoặc buộc áo vào thân, chứ không chỉ đơn giản là mặc áo.
- source_word: ἦν γὰρ γυμνός
  choice: vì ông đang để mình trần
  rationale: Giữ nghĩa trực tiếp của γυμνός nhưng không quyết đoán rằng ông hoàn toàn không mặc gì; chú thích bảo lưu khả năng hiểu là khỏa thân hoặc chỉ mặc rất ít.
- source_word: ἔβαλεν ἑαυτὸν εἰς τὴν θάλασσαν
  choice: lao mình xuống biển
  rationale: Giữ sắc thái mạnh và sống động của βάλλω với đại từ phản thân; “biển” tương ứng với θάλασσα trong cách gọi của phân đoạn.
theological_decisions:
- issue: Cách dịch κύριος khi người môn đồ nhận ra Đức Chúa Jêsus
  choice: Chúa
  alternative: Thầy / Chủ
  rationale: “Chúa” giữ được độ rộng nghĩa của κύριος và sức nặng Kitô học trong bối cảnh nhận ra Đấng phục sinh, mà không thêm lời giải nghĩa thần học.
- issue: Tình trạng của Phi-e-rơ theo γυμνός
  choice: đang để mình trần
  alternative: khỏa thân / ăn mặc sơ sài
  rationale: Cụm chính giữ hình ảnh trực tiếp nhưng vẫn có thể được hiểu theo ngữ cảnh lao động; chú thích nêu rõ sự mơ hồ từ vựng thay vì âm thầm loại bỏ một nghĩa khả hữu.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “môn đồ” theo lối Kinh Thánh quen thuộc; phiên âm “Đức Chúa Jêsus,” “Phi-e-rơ,” và “Si-môn” theo quy ước tên riêng truyền thống. Dấu cảm thán phản ánh tính tức thời của lời nhận ra nhưng không thêm nội dung.
