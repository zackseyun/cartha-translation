revisions:
- from: Còn các môn đồ khác đi thuyền nhỏ vào, vì họ cách bờ không xa, chỉ khoảng hai trăm cu-bít[a], vừa đi vừa kéo theo lưới cá[b].
  to: Còn các môn đồ khác đến bằng chiếc thuyền nhỏ, vì họ cách bờ không xa, chỉ khoảng hai trăm cu-bít[a], kéo theo lưới cá[b].
  rationale: Sửa cách diễn đạt phương tiện và hành động đồng thời cho tự nhiên hơn trong tiếng Việt hiện đại. Không thay đổi nghĩa, mức độ xấp xỉ của khoảng cách, hay sự hàm súc của cụm “lưới cá.” Các ký hiệu chú thích vẫn được đặt ngay sau đơn vị đo và cụm từ được giải thích.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T08:26:59Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch truyền đạt đúng các yếu tố chính: các môn đồ còn lại, chiếc thuyền nhỏ, khoảng cách xấp xỉ hai trăm cu-bít, và hành động kéo lưới có cá. Tuy nhiên, “đi thuyền nhỏ vào” chưa thật tự nhiên trong tiếng Việt hiện đại; “đến bằng chiếc thuyền nhỏ” diễn đạt rõ hơn phương tiện của động từ ἦλθον mà không thêm nghĩa.'
  naturalness: “Còn các môn đồ khác” phù hợp mạch đối chiếu nhẹ với Phi-e-rơ. Cụm “vừa đi vừa kéo theo” có thể khiến người đọc hình dung việc đi bộ; đặt phân từ bằng cấu trúc “kéo theo” sau mệnh đề chính sẽ tự nhiên hơn mà vẫn giữ tính đồng thời.
  terminology: “Môn đồ,” “thuyền nhỏ,” “cu-bít,” và “lưới cá” đều thích hợp với văn phong Kinh Thánh hiện đại, trang trọng vừa phải. “Lưới cá” không khẳng định quá mức rằng lưới “đầy” cá; chú thích giải thích đúng khả năng sở hữu cách chỉ nội dung.
  issues:
  - severity: low
    issue: Cách diễn đạt “đi thuyền nhỏ vào” hơi gượng.
    rationale: Tiếng Việt thường dùng “đến bằng chiếc thuyền nhỏ” hoặc “đi vào bằng chiếc thuyền nhỏ” khi thuyền là phương tiện. Bản sửa giữ nguyên sắc thái diminutive của πλοιάριον.
  - severity: low
    issue: “Vừa đi vừa kéo theo” có thể gây liên tưởng đến đi bộ.
    rationale: Phân từ σύροντες chỉ hành động kèm theo khi họ đến bằng thuyền. “Kéo theo lưới cá” gắn trực tiếp với hành động đến và tự nhiên hơn.
  revised_text: Còn các môn đồ khác đến bằng chiếc thuyền nhỏ, vì họ cách bờ không xa, chỉ khoảng hai trăm cu-bít[a], kéo theo lưới cá[b].
