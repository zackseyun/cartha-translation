  text: οἱ δὲ ἄλλοι μαθηταὶ τῷ πλοιαρίῳ ἦλθον, οὐ γὰρ ἦσαν μακρὰν ἀπὸ τῆς γῆς ἀλλὰ ὡς ἀπὸ πηχῶν διακοσίων, σύροντες τὸ δίκτυον τῶν ἰχθύων.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/008.yaml
  text: But the other disciples came in the small boat[a], for they were not far from the land, but about two hundred cubits away[c][b], dragging the net of fish.
translation:
  language: vi
  text: Còn các môn đồ khác đến bằng chiếc thuyền nhỏ, vì họ cách bờ không xa, chỉ khoảng hai trăm cu-bít[a], kéo theo lưới cá[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hai trăm cu-bít tương đương khoảng 90 mét.
    reason: cultural_note
  - marker: b
    text: 'Dịch sát: “lưới của các con cá”; cụm Hy Lạp này có lẽ chỉ chiếc lưới có cá ở trong.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ ἄλλοι μαθηταὶ
  choice: Còn các môn đồ khác
  rationale: δέ tạo sự chuyển ý và tương phản nhẹ với hành động riêng của Phi-e-rơ ở câu trước; “còn” diễn đạt tự nhiên trong mạch kể tiếng Việt.
- source_word: τῷ πλοιαρίῳ
  choice: đi thuyền nhỏ
  rationale: πλοιάριον là dạng chỉ chiếc thuyền nhỏ; cách nói này bảo toàn sắc thái kích thước và tự nhiên hơn lối dịch sát cấu trúc “trong thuyền nhỏ”.
- source_word: ἦλθον
  choice: đi ... vào
  rationale: Trong bối cảnh họ từ ngoài hồ tiến vào bờ, “đi ... vào” diễn đạt hướng chuyển động tự nhiên; động từ chính vẫn thể hiện việc họ đến gần bờ.
- source_word: οὐ γὰρ ἦσαν μακρὰν ἀπὸ τῆς γῆς
  choice: vì họ cách bờ không xa
  rationale: γάρ nêu lý do; γῆ đối lập với mặt nước và trong ngữ cảnh này chỉ bờ/đất liền. “Bờ” là cách diễn đạt rõ và tự nhiên nhất.
- source_word: ἀλλὰ ὡς ἀπὸ πηχῶν διακοσίων
  choice: chỉ khoảng hai trăm cu-bít
  rationale: ἀλλά sau phủ định nhấn mạnh khoảng cách thực tế; ὡς biểu thị xấp xỉ. Giữ đơn vị cổ “cu-bít” trong chính văn và giải thích bằng mét ở chú thích.
- source_word: σύροντες
  choice: vừa đi vừa kéo theo
  rationale: Phân từ hiện tại diễn tả hành động đồng thời với việc họ đi vào; cấu trúc “vừa... vừa...” truyền đạt rõ quan hệ này trong tiếng Việt.
- source_word: τὸ δίκτυον τῶν ἰχθύων
  choice: lưới cá
  rationale: Cụm sở hữu cách có thể hiểu sát là “lưới của cá” nhưng theo ngữ cảnh chỉ chiếc lưới có cá ở trong. “Lưới cá” giữ được cách diễn đạt gọn và phần nào sự hàm súc của nguyên văn, không thêm rõ rằng lưới đã “đầy” cá.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “môn đồ” để phù hợp thuật ngữ Kinh Thánh quen thuộc; giữ đơn vị đo cổ trong chính văn nhưng giải thích theo hệ mét. “Lưới cá” tránh thêm ý “đầy” vốn không được nói rõ trong tiếng Hy Lạp.
