source:
  edition: SBLGNT
  text: ἦσαν ὁμοῦ Σίμων Πέτρος καὶ Θωμᾶς ὁ λεγόμενος Δίδυμος καὶ Ναθαναὴλ ὁ ἀπὸ Κανὰ τῆς Γαλιλαίας καὶ οἱ τοῦ Ζεβεδαίου καὶ ἄλλοι ἐκ τῶν μαθητῶν αὐτοῦ δύο.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/002.yaml
  text: Simon Peter[a], Thomas called Didymus, Nathanael from Cana of Galilee, the sons of Zebedee, and two others of his disciples were together.
translation:
  language: vi
  text: Si-môn Phi-e-rơ, Thô-ma gọi là Đi-đim[a], Na-tha-na-ên, người Ca-na thuộc Ga-li-lê, các con trai của Xê-bê-đê, và hai môn đồ khác của Ngài đang ở cùng nhau.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hy Lạp: “Đi-đim”, nghĩa là “sinh đôi”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦσαν ὁμοῦ
  choice: đều ở cùng nhau
  rationale: Kết hợp động từ trạng thái quá khứ ἦσαν với ὁμοῦ theo cách tự nhiên trong tiếng Việt; ngữ cảnh kể chuyện đã biểu thị thời quá khứ, còn “đều” quy tụ các nhân vật trong danh sách.
- source_word: Σίμων Πέτρος
  choice: Si-môn Phi-e-rơ
  rationale: Phiên âm tên riêng theo dạng quen thuộc trong Kinh Thánh tiếng Việt.
- source_word: Θωμᾶς ὁ λεγόμενος Δίδυμος
  choice: Thô-ma gọi là Đi-đim[a]
  rationale: Giữ Đi-đim như tên gọi Hy Lạp trong câu chính, đồng thời chú thích nghĩa từ vựng “Song Sinh”; λεγόμενος được dịch tự nhiên là “gọi là”.
- source_word: Ναθαναὴλ ὁ ἀπὸ Κανὰ τῆς Γαλιλαίας
  choice: Na-tha-na-ên quê ở Ca-na miền Ga-li-lê
  rationale: ἀπό chỉ nơi xuất thân; “quê ở” diễn đạt tự nhiên quan hệ nguồn gốc, còn “miền Ga-li-lê” làm rõ địa danh.
- source_word: οἱ τοῦ Ζεβεδαίου
  choice: các con trai của Xê-bê-đê
  rationale: Cấu trúc sở hữu lược danh từ trong tiếng Hy Lạp, theo ngữ cảnh, chỉ các con trai của Xê-bê-đê; tiếng Việt cần nêu rõ danh từ.
- source_word: ἄλλοι ἐκ τῶν μαθητῶν αὐτοῦ δύο
  choice: hai môn đồ khác của Ngài
  rationale: Giữ số lượng “hai”, ý nghĩa “khác”, và quan hệ thuộc nhóm môn đồ của Chúa Giê-su; đại từ tôn kính phù hợp văn phong Kinh Thánh tiếng Việt.
- source_word: καί ... καί
  choice: danh sách ngăn bằng dấu phẩy, với “và” trước thành phần cuối
  rationale: Chuyển chuỗi liên từ Hy Lạp thành cách liệt kê tự nhiên trong tiếng Việt mà không làm mất quan hệ phối hợp.
theological_decisions:
- issue: Đối tượng của đại từ αὐτοῦ trong “các môn đồ của Ngài”
  choice: Viết hoa “Ngài” để chỉ Chúa Giê-su
  alternative: “ông” hoặc “người”
  rationale: Trong ngữ cảnh Giăng 21, αὐτοῦ quy chiếu đến Chúa Giê-su. Viết hoa là quy ước tôn kính phổ biến trong tiếng Việt, không thêm một khẳng định giáo phái vào nội dung câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng các dạng phiên âm tên riêng quen thuộc; giữ Đi-đim trong chính văn và giải nghĩa ở chú thích để bảo toàn cả hình thức tên gọi lẫn ý nghĩa từ nguyên.
