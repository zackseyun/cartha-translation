  source_fidelity: Bản dịch chuyển tải đúng danh sách năm thành phần và ý chính của ἦσαν ὁμοῦ. Tuy nhiên, “đều ở cùng nhau” hơi dư sắc thái quy nạp do “đều” không được đòi hỏi bởi nguyên ngữ; “đang ở cùng nhau” diễn đạt tự nhiên hơn trạng thái trong bối cảnh trần thuật. “người Ca-na thuộc Ga-li-lê” bám sát hơn cụm ὁ ἀπὸ Κανὰ τῆς Γαλιλαίας mà vẫn tự nhiên.
  naturalness: Dạng tên phiên âm và trật tự liệt kê phù hợp văn phong Kinh Thánh tiếng Việt hiện đại. Thay “quê ở” bằng “người ... thuộc ...” giảm sắc thái khẩu ngữ; bỏ “đều” làm câu gọn và tự nhiên hơn.
