id: JHN.21.19
reference: John 21:19
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τοῦτο δὲ εἶπεν σημαίνων ποίῳ θανάτῳ δοξάσει τὸν θεόν. καὶ τοῦτο εἰπὼν λέγει αὐτῷ· Ἀκολούθει μοι.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/019.yaml
  text: He said this to indicate by what kind of death he would glorify God[a]. And after saying this, he says to him[b], “Follow me.”
translation:
  language: vi
  text: Ngài nói điều này để cho biết Phi-e-rơ sẽ tôn vinh Đức Chúa Trời bằng cái chết như thế nào.[a] Nói xong, Ngài bảo ông:[b] “Hãy theo Ta.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “bằng loại cái chết nào.”'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn Hy Lạp dùng thì hiện tại lịch sử: “Ngài bảo ông.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: σημαίνων
  choice: để cho biết
  rationale: Diễn đạt tự nhiên ý làm cho người ta nhận biết một điều theo cách gián tiếp hoặc hàm ý; phân từ giải thích mục đích của lời Đức Chúa Jêsus vừa nói.
- source_word: ποίῳ θανάτῳ
  choice: bằng cái chết như thế nào
  rationale: Giữ sắc thái định tính của ποίῳ và quan hệ phương tiện/cách thức của cách dative, đồng thời là cách nói tự nhiên trong tiếng Việt.
- source_word: δοξάσει τὸν θεόν
  choice: sẽ tôn vinh Đức Chúa Trời
  rationale: Giữ nguyên thì tương lai của động từ Hy Lạp và không giải thích thêm cơ chế mà qua đó cái chết của Phi-e-rơ tôn vinh Đức Chúa Trời.
- source_word: καὶ τοῦτο εἰπὼν
  choice: Nói xong
  rationale: Chuyển ngữ tự nhiên cấu trúc phân từ aorist mang ý thời gian, không cần thêm liên từ nặng nề.
- source_word: λέγει αὐτῷ
  choice: Ngài bảo ông
  rationale: Tiếng Việt thường dùng hiện tại lịch sử kém tự nhiên hơn trong câu này; dùng động từ quá khứ theo mạch kể nhưng chú thích hiện tượng nguyên ngữ.
- source_word: Ἀκολούθει μοι
  choice: Hãy theo Ta
  rationale: Mệnh lệnh ngắn gọn, trang trọng và tự nhiên; vẫn có thể mang cả ý theo ngay lúc ấy lẫn tiếp tục làm môn đồ.
theological_decisions:
- issue: Ý nghĩa của việc Phi-e-rơ tôn vinh Đức Chúa Trời qua cái chết
  choice: Giữ nguyên cách nói “tôn vinh Đức Chúa Trời” mà không diễn giải thêm.
  alternative: Nói rõ đây là cái chết tử đạo hoặc là sự làm chứng trung tín của Phi-e-rơ.
  rationale: Bản văn cho biết cái chết ấy sẽ tôn vinh Đức Chúa Trời nhưng không giải thích cụ thể bằng cách nào; bản dịch bảo toàn sức nặng và độ mở thần học đó.
- issue: Chủ thể của động từ δοξάσει
  choice: Nêu rõ “Phi-e-rơ” trong tiếng Việt.
  alternative: Dùng đại từ “ông” hoặc lược chủ thể theo sát hình thức Hy Lạp.
  rationale: Trong ngữ cảnh, chủ thể được hàm hiểu là Phi-e-rơ. Nêu tên giúp tránh nhầm với Đức Chúa Jêsus khi tiếng Việt vừa dùng “Ngài”, nhưng không thêm một cách hiểu mới vào câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài/Ta” cho Đức Chúa Jêsus, “ông” cho Phi-e-rơ, và danh xưng “Đức Chúa Trời”. Giữ câu giải thích súc tích, tránh thêm thuật ngữ “tử đạo” vốn không xuất hiện trực tiếp trong câu.
