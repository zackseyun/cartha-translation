source:
  edition: SBLGNT
  text: λέγει αὐτῷ ὁ Ἰησοῦς· Ἐὰν αὐτὸν θέλω μένειν ἕως ἔρχομαι, τί πρὸς σέ; σύ ⸂μοι ἀκολούθει⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/022.yaml
  text: Jesus said to him[a], “If I want him to remain until I come[b], what is that to you? You follow me.”
translation:
  language: vi
  text: 'Đức Giê-su nói với ông: “Nếu tôi muốn người ấy ở lại cho đến khi tôi đến[a], thì can gì đến anh? Còn anh, hãy theo tôi.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cụm từ “cho đến khi tôi đến” được chủ ý để ngỏ; bản văn không nói rõ Đức Giê-su muốn chỉ việc Ngài đến trong một biến cố lịch sử hay lần Ngài ngự đến cuối cùng.
    reason: alternative_reading
lexical_decisions:
- source_word: λέγει αὐτῷ ὁ Ἰησοῦς
  choice: Đức Giê-su nói với ông
  rationale: Dùng thì quá khứ tự nhiên trong lối kể chuyện tiếng Việt cho hiện tại lịch sử λέγει; đại từ “ông” chỉ Phê-rô theo ngữ cảnh.
- source_word: Ἐὰν
  choice: Nếu
  rationale: Giữ đúng sắc thái điều kiện, giả định của câu Hy Lạp.
- source_word: θέλω
  choice: tôi muốn
  rationale: Diễn đạt tự nhiên nghĩa ý muốn hoặc ý chí của θέλω mà không biến câu thành một lời tiên báo chắc chắn.
- source_word: μένειν
  choice: cứ ở lại
  rationale: “Ở lại” giữ nghĩa rộng của μένω và tránh diễn giải hẹp thành “còn sống”; “cứ” gợi sắc thái tiếp diễn phù hợp ngữ cảnh.
- source_word: ἕως ἔρχομαι
  choice: cho đến khi tôi đến
  rationale: Giữ nguyên sự không xác định về tính chất và thời điểm của việc Đức Giê-su “đến”, không diễn giải thành “trở lại”.
- source_word: τί πρὸς σέ;
  choice: thì can gì đến anh?
  rationale: Thành ngữ tiếng Việt tự nhiên, trực tiếp, diễn tả việc điều đó không thuộc phần Phê-rô phải bận tâm.
- source_word: σύ
  choice: Còn anh
  rationale: Làm rõ sự nhấn mạnh và tương phản giữa Phê-rô với “người ấy” trong vế trước.
- source_word: μοι ἀκολούθει
  choice: hãy theo tôi
  rationale: Mệnh lệnh rõ ràng, tự nhiên; ngữ cảnh vẫn cho phép hiểu việc đi theo là liên tục.
theological_decisions:
- issue: Ý nghĩa của lời “cho đến khi tôi đến”
  choice: Giữ cách nói chung, không xác định sự kiện được nhắc đến.
  alternative: Diễn giải là một lần Đức Giê-su đến trong lịch sử, sự phán xét, hoặc lần ngự đến cuối cùng.
  rationale: Bản văn không xác định cụ thể lần “đến” nào; câu kế tiếp cũng cảnh báo việc suy diễn quá mức. Bản dịch vì thế giữ nguyên sự mơ hồ có chủ ý.
- issue: Nghĩa của μένειν đối với môn đồ kia
  choice: Dịch là “cứ ở lại”.
  alternative: Dịch diễn giải là “cứ sống cho đến”.
  rationale: “Cứ sống” có thể phù hợp với cách người nghe hiểu trong ngữ cảnh, nhưng cụ thể hóa điều mà động từ Hy Lạp chỉ nói rộng hơn là “ở lại”.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Giê-su” theo lối gọi kính trọng; cặp đại từ “tôi—anh” giữ lời nói trực tiếp, rõ ràng. “Còn anh” truyền đạt sự nhấn mạnh của đại từ σύ mà vẫn tự nhiên trong tiếng Việt.
