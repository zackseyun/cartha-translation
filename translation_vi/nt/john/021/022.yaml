review_pass:
  verdict: revise
  source_fidelity: Bản dịch truyền đạt đúng cấu trúc điều kiện, ý chí của θέλω, tính bất định của ἕως ἔρχομαι, thành ngữ quở trách τί πρὸς σέ, và sự nhấn mạnh tương phản của σύ. Tuy nhiên, từ “cứ” trong “cứ ở lại” thêm một sắc thái tiếp diễn/để mặc có phần mạnh hơn động từ μένειν cần thiết trong câu này.
  naturalness: Cặp “tôi—anh”, cách gọi “người ấy”, và mệnh lệnh “Còn anh, hãy theo tôi” đều tự nhiên, trang trọng vừa phải trong tiếng Việt hiện đại. “Thì can gì đến anh?” là thành ngữ tự nhiên và giữ được tính trực diện của nguyên ngữ.
  terminology: “Đức Giê-su” nhất quán với lối gọi kính trọng. “Ở lại” bảo toàn nghĩa rộng của μένειν, không thu hẹp thành sống còn; “đến” không diễn giải thành “trở lại” hay một biến cố cánh chung xác định.
  issues:
  - severity: low
    issue: “Cứ ở lại” thêm sắc thái không cần thiết.
    rationale: μένειν có nghĩa cơ bản là “ở lại/tiếp tục ở lại”. Trong ngữ cảnh này, “cứ” có thể gợi một sắc thái để mặc hoặc dai dẳng mà nguyên văn không nêu rõ. “Ở lại” đã giữ đủ nghĩa và sự mơ hồ của động từ.
  - severity: low
    issue: Cách diễn đạt chú thích về “một lần Ngài đến trong lịch sử” chưa thật rõ.
    rationale: Nên nói “một biến cố lịch sử” để diễn đạt chính xác hơn lựa chọn diễn giải về một lần Chúa đến trong lịch sử, thay vì dễ bị hiểu là bất cứ lần nào Ngài đến khi còn sống trên đất.
