  text: λέγει οὖν αὐτοῖς ⸀ὁ Ἰησοῦς· Παιδία, μή τι προσφάγιον ἔχετε; ἀπεκρίθησαν αὐτῷ· Οὔ.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/005.yaml
  text: So Jesus said to them[a], “Children, you do not have any fish, do you?” They answered him, “No.”
translation:
  language: vi
  text: 'Vậy, Giê-su hỏi họ: “Các con, không có cá[a] sao?” Họ trả lời Người: “Không.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “thức ăn.” Từ Hy Lạp προσφάγιον chỉ thức ăn dùng kèm bánh; trong bối cảnh đánh cá này, từ ấy có lẽ chỉ cá.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Vậy
  rationale: Dùng từ nối tự nhiên để tiếp nối diễn biến của câu chuyện, đồng thời giữ sắc thái suy diễn nhẹ của οὖν.
- source_word: Παιδία
  choice: Các con
  rationale: Lối xưng hô thân tình, trìu mến của người trên với một nhóm người; tự nhiên hơn cách gọi theo nghĩa đen là “trẻ con” trong ngữ cảnh này mà không diễn giải thành “các bạn”.
- source_word: μή τι
  choice: không ... sao?
  rationale: Câu hỏi dùng μή dự kiến câu trả lời phủ định; cấu trúc tiếng Việt này truyền đạt tự nhiên sắc thái ấy.
- source_word: προσφάγιον
  choice: cá ăn
  rationale: Từ này chỉ thức ăn dùng kèm bánh; trong bối cảnh đánh cá, nó rất có thể chỉ cá dùng làm thức ăn. “Cá ăn” vừa gọn vừa phù hợp ngữ cảnh.
- source_word: ἔχετε
  choice: có
  rationale: Diễn đạt trực tiếp ý sở hữu trong câu hỏi bằng tiếng Việt tự nhiên.
- source_word: ἀπεκρίθησαν αὐτῷ
  choice: Họ trả lời Ngài
  rationale: Công thức tường thuật thông thường, trang trọng vừa phải và rõ đối tượng được trả lời.
- source_word: Οὔ
  choice: Không
  rationale: Giữ nguyên câu đáp phủ định ngắn gọn của bản Hy Lạp.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Đức Chúa Jêsus” theo lối gọi Kinh Thánh tiếng Việt trang nghiêm; “các con” giữ giọng thân tình của lời xưng hô mà không hàm ý các môn đồ là trẻ nhỏ.
