- from: 'Vậy, Đức Chúa Jêsus hỏi họ: “Các con, không có cá ăn sao?” Họ trả lời Ngài: “Không.”'
  to: 'Vậy, Giê-su hỏi họ: “Các con, không có cá[a] sao?” Họ trả lời Người: “Không.”'
  rationale: Sửa tên riêng để không thêm tước hiệu không có trong nguyên văn; thay «cá ăn» bằng cách nói hiện đại, tự nhiên là «cá»; đồng thời thêm chú thích để bảo lưu phạm vi nghĩa của προσφάγιον. «Người» trong lời trần thuật là đại từ trang trọng, tự nhiên, quy chiếu rõ về Giê-su mà không thêm tước hiệu.
