source:
  edition: SBLGNT
  text: ἔστιν δὲ καὶ ἄλλα πολλὰ ⸀ἃ ἐποίησεν ὁ Ἰησοῦς, ἅτινα ἐὰν γράφηται καθ’ ἕν, οὐδ’ αὐτὸν οἶμαι τὸν κόσμον ⸀χωρήσειν τὰ γραφόμενα ⸀βιβλία.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/025.yaml
  text: There are also many other things that Jesus did[a], which, if they were written down one by one, I suppose that not even the world itself would have room for the books being written.
translation:
  language: vi
  text: Ngoài ra, Giê-su còn làm nhiều việc khác nữa. Nếu từng việc ấy đều được ghi lại, tôi nghĩ rằng ngay cả chính thế gian cũng không đủ chỗ chứa những sách được viết ra.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “ngay cả chính thế gian cũng không thể chứa hết những sách sẽ được viết ra.” Động từ Hy Lạp có thể mang nghĩa “có đủ chỗ cho” hoặc “chứa,” còn phân từ có thể được diễn đạt tự nhiên theo ý kết quả trong tương lai.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ καὶ ἄλλα πολλὰ
  choice: Ngoài ra... còn... nhiều việc khác nữa
  rationale: Diễn đạt tự nhiên ý chuyển tiếp nhẹ, tính bổ sung và số lượng lớn, không thêm một từ chỉ thời gian như “bây giờ”.
- source_word: ἃ ἐποίησεν ὁ Ἰησοῦς
  choice: Đức Chúa Jêsus... làm nhiều việc
  rationale: ποιέω trong ngữ cảnh chỉ rộng các việc hoặc hành động của Chúa Jêsus; “làm” giữ được phạm vi nghĩa đó.
- source_word: ἐὰν γράφηται καθ’ ἕν
  choice: Nếu từng việc ấy đều được ghi lại
  rationale: Giữ thể bị động và điều kiện giả định; “từng việc... đều” truyền đạt lực phân phối của καθ’ ἕν một cách tự nhiên trong tiếng Việt.
- source_word: οὐδ’ αὐτὸν ... τὸν κόσμον
  choice: ngay cả thế gian
  rationale: “Ngay cả” thể hiện οὐδέ, còn ý nhấn mạnh của αὐτόν đã được truyền đạt tự nhiên mà không cần thêm đại từ gượng ép.
- source_word: οἶμαι
  choice: tôi nghĩ rằng
  rationale: Giữ nguyên lời xen mang tính cá nhân và suy tưởng của tác giả.
- source_word: χωρήσειν
  choice: không đủ chỗ chứa
  rationale: Kết hợp tự nhiên hai nét nghĩa có liên hệ của χωρέω là “có chỗ cho” và “chứa,” đồng thời giữ hình ảnh không gian của câu cường điệu.
- source_word: τὰ γραφόμενα βιβλία
  choice: những sách được viết ra
  rationale: Diễn đạt tự nhiên phân từ bị động hiện tại trong ngữ cảnh giả định, chỉ các sách hình thành do việc ghi chép.
theological_decisions:
- issue: Lối nói cường điệu về khả năng chứa sách của thế gian
  choice: Giữ nguyên hình ảnh rằng ngay cả thế gian cũng không đủ chỗ chứa các sách.
  alternative: Diễn ý thành “sẽ có vô số sách” hoặc “không thể kể hết.”
  rationale: Nguyên văn chủ ý dùng cường điệu để kết thúc sách Phúc Âm một cách mạnh mẽ; bản dịch không giản lược hình ảnh ấy thành một nhận định thuần định lượng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Jêsus” theo lối gọi quen thuộc trong truyền thống Kinh Thánh tiếng Việt; tách thành hai câu để tránh cấu trúc quan hệ dài và nặng trong tiếng Việt, nhưng vẫn bảo toàn mạch lập luận, lời xen “tôi nghĩ rằng,” và tính cường điệu của nguyên văn.
