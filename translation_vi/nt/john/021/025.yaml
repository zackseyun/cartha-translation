  rationale: Chuẩn hóa tên riêng theo tiếng Việt hiện đại và loại bỏ tước hiệu không được nêu trong câu Hy Lạp. Thêm “chính” để phản ánh yếu tố nhấn αὐτόν. Các lựa chọn còn lại, kể cả cấu trúc hai câu, điều kiện “Nếu từng việc ấy đều được ghi lại,” và hình ảnh cường điệu, được giữ nguyên.
