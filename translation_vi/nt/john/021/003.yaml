    issue: Liên từ “nhưng” được thêm vào trước “đêm ấy.”
    rationale: Nguyên văn chỉ nối các mệnh đề bằng καί (“và”); kết quả không bắt được gì có thể hàm ý tương phản theo ngữ cảnh, nhưng không cần diễn đạt bằng một liên từ đối lập rõ rệt.
  - severity: low
    issue: Từ “đây” trong “Tôi đi đánh cá đây” thêm sắc thái diễn ngôn.
    rationale: Ὑπάγω ἁλιεύειν diễn đạt ý định đi đánh cá; “đây” vẫn có thể chấp nhận, nhưng không cần thiết và không có yếu tố tương ứng rõ trong tiếng Hy Lạp.
