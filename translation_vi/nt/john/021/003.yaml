  to: 'Si-môn Phi-e-rơ nói với họ[a]: “Tôi đi đánh cá.” Họ nói với ông: “Chúng tôi cũng đi với ông.” Họ ra đi, lên thuyền, và đêm ấy họ chẳng bắt được gì.'
