  text: λέγει αὐτοῖς Σίμων Πέτρος· Ὑπάγω ἁλιεύειν· λέγουσιν αὐτῷ· Ἐρχόμεθα καὶ ἡμεῖς σὺν σοί. ἐξῆλθον καὶ ἐνέβησαν εἰς τὸ ⸀πλοῖον, καὶ ἐν ἐκείνῃ τῇ νυκτὶ ἐπίασαν οὐδέν.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/003.yaml
  text: Simon Peter said to them[a], “I am going to fish.” They said to him, “We are also coming with you.” They went out and got into the boat, and that night they caught nothing.
translation:
  language: vi
  text: 'Si-môn Phi-e-rơ nói với họ[a]: “Tôi đi đánh cá.” Họ nói với ông: “Chúng tôi cũng đi với ông.” Họ ra đi, lên thuyền, và đêm ấy họ chẳng bắt được gì.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hy Lạp dùng thì hiện tại lịch sử: “Si-môn Phi-e-rơ nói với họ… Họ nói với ông.” Đây là một đặc điểm thường gặp trong lối kể chuyện.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει ... λέγουσιν
  choice: nói ... nói
  rationale: Tiếng Hy Lạp dùng thì hiện tại lịch sử. Tiếng Việt không biến đổi hình thái động từ theo thì, nên “nói” tự nhiên trong lời kể và không cần thêm dấu hiệu quá khứ.
- source_word: Ὑπάγω ἁλιεύειν
  choice: Tôi đi đánh cá đây
  rationale: “Đi đánh cá” diễn đạt tự nhiên ý định sắp thực hiện; “đây” thể hiện sắc thái tuyên bố hành động trước mắt mà không làm thay đổi nội dung.
- source_word: Ἐρχόμεθα καὶ ἡμεῖς σὺν σοί
  choice: Chúng tôi cũng đi với ông
  rationale: Giữ nét nhấn mạnh của καὶ ἡμεῖς bằng “cũng”; trong ngữ cảnh cùng Phi-e-rơ rời chỗ để đánh cá, “đi với ông” tự nhiên hơn “đến với ông” trong tiếng Việt.
- source_word: ἐξῆλθον
  choice: Họ ra đi
  rationale: Giữ ý chuyển động ra khỏi nơi đang ở mà không xác định thêm địa điểm vốn không được nêu trong câu.
- source_word: ἐνέβησαν εἰς τὸ πλοῖον
  choice: lên thuyền
  rationale: Đây là cách nói tiếng Việt tự nhiên khi bước lên một phương tiện đường thủy; πλοῖον trong bối cảnh đánh cá là “thuyền”, không phải tàu lớn.
- source_word: ἐν ἐκείνῃ τῇ νυκτί
  choice: đêm ấy
  rationale: Cách diễn đạt thời gian ngắn gọn, tự nhiên, tương ứng trực tiếp với cụm Hy Lạp.
- source_word: ἐπίασαν οὐδέν
  choice: chẳng bắt được gì
  rationale: Trong ngữ cảnh đánh cá, πιάζω mang nghĩa “bắt”; “chẳng ... gì” giữ trọn ý phủ định tuyệt đối của οὐδέν.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “ông” cho cách xưng hô giữa các môn đồ trong lời kể; giữ tên phiên âm quen thuộc “Si-môn Phi-e-rơ”. Liên từ “nhưng” làm rõ sự tương phản ngầm giữa việc ra khơi và kết quả trắng tay.
