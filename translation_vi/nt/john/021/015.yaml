id: JHN.21.15
reference: John 21:15
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ὅτε οὖν ἠρίστησαν λέγει τῷ Σίμωνι Πέτρῳ ὁ Ἰησοῦς· Σίμων ⸀Ἰωάννου, ἀγαπᾷς με πλέον τούτων; λέγει αὐτῷ· Ναί, κύριε, σὺ οἶδας ὅτι φιλῶ σε. λέγει αὐτῷ· Βόσκε τὰ ἀρνία μου.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/015.yaml
  text: So when they had eaten breakfast[a], Jesus said to Simon Peter, “Simon, son of John, do you love me more than these?” He said to him, “Yes, Lord; you know that I love you.” He said to him[b], “Feed my lambs.”
translation:
  language: vi
  text: 'Sau khi họ ăn sáng, Đức Chúa Giê-su hỏi Si-môn Phi-e-rơ: “Si-môn, con của Giăng, con có yêu Ta hơn họ hay những điều này không?[a]” Ông đáp: “Vâng, thưa Chúa, Chúa biết con yêu Ngài.” Đức Chúa Giê-su phán: “Hãy cho chiên con của Ta ăn.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Trong tiếng Hy Lạp, Đức Chúa Giê-su dùng động từ ἀγαπάω khi hỏi “yêu”, còn Phi-e-rơ dùng φιλέω khi đáp, một từ cũng có thể mang sắc thái “thương mến”. Có người cho rằng sự khác biệt này có chủ ý; người khác xem đó là biến thể văn phong. Vì ngữ cảnh không nói rõ, chính văn dịch cả hai là “yêu”. Cụm “hơn họ hay những điều này” phản ánh một chỗ mơ hồ: có thể là “hơn những người này yêu Ta”, hoặc “hơn con yêu những người hay những sự vật này”. Câu Hy Lạp không nói rõ chuẩn so sánh.'
    reason: lexical_alternative; alternative_reading
lexical_decisions:
- source_word: ἠρίστησαν
  choice: ăn sáng xong
  rationale: Động từ ἀριστάω chỉ việc dùng bữa sáng; cách diễn đạt này tự nhiên trong tiếng Việt và giữ rõ ý hành động đã hoàn tất trước cuộc đối thoại.
- source_word: Σίμων Ἰωάννου
  choice: Si-môn, con của Giăng
  rationale: Dạng sở hữu Ἰωάννου ở đây có chức năng chỉ phụ hệ, nghĩa là Si-môn là con của Giăng; không đổi thành dạng truyền thống “con Giô-na” từ một câu khác.
- source_word: ἀγαπᾷς / φιλῶ
  choice: yêu / yêu
  rationale: Cả hai động từ đều có thể được diễn đạt tự nhiên là “yêu” trong ngữ cảnh này. Dùng hai từ khác nhau trong chính văn có thể khiến độc giả tưởng rằng bản văn chắc chắn phân cấp hai loại tình yêu; sự thay đổi từ ngữ Hy Lạp được ghi lại trong chú thích.
- source_word: πλέον τούτων
  choice: hơn những điều này
  rationale: Cụm Hy Lạp lược bỏ đối tượng hoặc chuẩn so sánh cụ thể. Cách dịch ngắn gọn này không tự ý xác định đó là các môn đồ hay những sự vật chung quanh; chú thích nêu rõ các khả năng.
- source_word: κύριε
  choice: Chúa
  rationale: Trong văn mạch Giăng, đây là lời xưng hô tôn kính dành cho Đức Chúa Jêsus, mạnh hơn một lời lịch sự đơn thuần như “thưa ông”.
- source_word: Βόσκε
  choice: Hãy cho … ăn
  rationale: βόσκω nhấn mạnh việc cho bầy chiên ăn, khác với động từ có nghĩa rộng hơn là chăn dắt; cấu trúc này tự nhiên trong tiếng Việt.
- source_word: τὰ ἀρνία μου
  choice: chiên con của Ta
  rationale: ἀρνία chỉ những con chiên non; đại từ sở hữu μου được giữ rõ để thể hiện chúng thuộc về Đức Chúa Jêsus.
theological_decisions:
- issue: Có nên phân biệt mạnh ἀγαπάω và φιλέω trong chính văn hay không
  choice: Dịch cả hai là “yêu” trong chính văn và ghi sự thay đổi động từ Hy Lạp trong chú thích.
  alternative: Dịch ἀγαπάω là “yêu” nhưng φιλέω là “thương mến” hoặc “quý mến”.
  rationale: Không chắc tác giả muốn thiết lập hai cấp độ tình yêu hay chỉ dùng biến thể văn phong. Dịch đồng nhất trong chính văn tránh áp đặt một hệ thống thần học không được câu văn xác quyết, trong khi chú thích vẫn bảo tồn dữ kiện từ vựng.
- issue: Chuẩn so sánh trong πλέον τούτων
  choice: Giữ cách nói không xác định “hơn những điều này”.
  alternative: Giải nghĩa thành “hơn những người này yêu Ta” hoặc “hơn con yêu những điều này”.
  rationale: Đại từ Hy Lạp không nói rõ chuẩn so sánh. Việc chọn hẳn một cách hiểu sẽ thu hẹp một sự mơ hồ có thật trong nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ta/con” trong lời Đức Chúa Jêsus nói với Phi-e-rơ, còn Phi-e-rơ xưng “con” và gọi “Chúa/Ngài”. Các dấu chú thích được đặt ngay sau những cụm từ mà chúng giải thích, thay vì theo vị trí bị lệch trong lớp tham khảo tiếng Anh.
