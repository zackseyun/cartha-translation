  source_fidelity: 'Bản nháp truyền đạt đúng cấu trúc chính: môn đồ này làm chứng về các điều ấy, đã viết các điều ấy, và một chủ thể số nhiều xác nhận lời chứng của ông là thật. Tuy nhiên, “đã viết lại” thường có nghĩa là viết lần nữa/viết lại theo cách khác trong tiếng Việt hiện đại, thêm một sắc thái không có trong ὁ γράψας ταῦτα (“đã viết những điều này”).'
