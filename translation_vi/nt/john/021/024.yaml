  text: Οὗτός ἐστιν ὁ μαθητὴς ὁ μαρτυρῶν περὶ τούτων καὶ ⸀ὁ γράψας ταῦτα, καὶ οἴδαμεν ὅτι ἀληθὴς ⸂αὐτοῦ ἡ μαρτυρία ἐστίν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/024.yaml
  text: This is the disciple who testifies about these things and who wrote these things[a], and we know that his testimony is true.
translation:
  language: vi
  text: Đây là môn đồ làm chứng về những điều ấy và đã viết những điều ấy,[a] và chúng tôi biết rằng lời chứng của người là thật.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “làm chứng về những điều ấy … lời chứng của người là thật.” Trong tiếng Hy Lạp, động từ “làm chứng” và danh từ “lời chứng” là những từ cùng gốc.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὗτός ἐστιν ὁ μαθητὴς
  choice: Chính môn đồ này
  rationale: Diễn đạt tự nhiên cấu trúc xác định danh tính, đồng thời giữ lực chỉ định của Οὗτός đối với môn đồ vừa được nhắc đến.
- source_word: ὁ μαρτυρῶν περὶ τούτων
  choice: là người làm chứng về những điều ấy
  rationale: Giữ trường từ vựng làm chứng/lời chứng của μαρτυρῶν và μαρτυρία; phân từ hiện tại mang ý nghĩa đặc trưng hoặc tiếp diễn.
- source_word: ὁ γράψας ταῦτα
  choice: đã viết lại những điều ấy
  rationale: Thể hiện hành động viết đã hoàn tất của phân từ aorist; “viết lại” ở đây mang nghĩa ghi chép thành văn, không phải sửa hay viết lần thứ hai.
- source_word: οἴδαμεν
  choice: chúng tôi biết
  rationale: Dịch trực tiếp ngôi thứ nhất số nhiều mà không xác định người nói; “chúng tôi” là đại từ tự nhiên trong văn cảnh tuy không bao hàm người đọc.
- source_word: ἀληθὴς αὐτοῦ ἡ μαρτυρία ἐστίν
  choice: lời chứng của người là chân thật
  rationale: Giữ quan hệ từ cùng gốc giữa động từ “làm chứng” và danh từ “lời chứng”; “chân thật” diễn đạt trực tiếp ἀληθής mà không thu hẹp thành chỉ “đáng tin”.
theological_decisions:
- issue: Danh tính và tiếng nói của “chúng tôi biết”
  choice: Giữ nguyên ngôi thứ nhất số nhiều là “chúng tôi biết”, không xác định nhóm người nói.
  alternative: Hiểu đây là lời biên tập của tác giả hoặc lời xác nhận của một cộng đồng đối với môn đồ được yêu.
  rationale: Bản Hy Lạp không nêu rõ “chúng tôi” là ai; bản dịch không nên giải quyết ngầm vấn đề tác giả hay cộng đồng chứng nhận.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Môn đồ” giữ thuật ngữ quen thuộc của văn liệu Tin Mừng. Đại từ “người” dành cho môn đồ vừa được nói đến, tránh tự ý đồng nhất danh tính. Dấu chú thích [a] được đặt ngay sau mệnh đề viết.
