revisions:
- from: Chính môn đồ này là người làm chứng về những điều ấy và đã viết lại những điều ấy,[a] và chúng tôi biết rằng lời chứng của người là chân thật.
  to: Đây là môn đồ làm chứng về những điều ấy và đã viết những điều ấy,[a] và chúng tôi biết rằng lời chứng của người là thật.
  rationale: Bỏ “lại” sau “viết” để không thêm ý viết lần nữa hoặc chép lại. Điều chỉnh mở đầu thành “Đây là môn đồ” cho tự nhiên hơn, đồng thời giữ nguyên tham chiếu chỉ định, ngôi thứ nhất số nhiều không xác định của “chúng tôi biết”, và sự liên kết từ vựng làm chứng/lời chứng. Chú thích được giữ với cách diễn đạt rõ ràng, neo đúng tại mệnh đề “đã viết những điều ấy”.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T08:27:05Z'
