    rationale: Dạng “Giê-su” thông dụng hơn trong tiếng Việt hiện đại chuẩn; việc chuẩn hóa này không ảnh hưởng đến tên gọi hay ý nghĩa.
  - severity: low
    issue: “Phán” có sắc thái cổ/truyền thống.
    rationale: “Nói” là lựa chọn hiện đại, tự nhiên hơn cho λέγει trong khi vẫn trang trọng trong ngữ cảnh Kinh Thánh.
  - severity: medium
    issue: Chú thích b đặt sau “ông” trong câu mệnh lệnh cuối, dù chú thích giải thích hai động từ chỉ sự biết trong lời đáp của Phi-e-rơ.
    rationale: Dời ký hiệu b đến cụm “Ngài biết” giúp mỏ neo chú thích khớp trực tiếp với hiện tượng từ vựng được giải thích.
