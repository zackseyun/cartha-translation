  rationale: Bản sửa chuẩn hóa tên “Giê-su” và dùng “nói” để phù hợp tiếng Việt hiện đại chuẩn. Đồng thời, ký hiệu chú thích b được dời vào lời đáp của Phi-e-rơ, nơi hai động từ οἶδα và γινώσκω thực sự xuất hiện. Các lựa chọn dịch thuật chủ đạo, đặc biệt “yêu,” “mọi sự,” và “cho chiên Ta ăn,” được giữ nguyên vì trung thành với tiếng Hy Lạp và không áp đặt diễn giải thần học.
