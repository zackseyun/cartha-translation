  text: λέγει αὐτῷ τὸ τρίτον· Σίμων ⸀Ἰωάννου, φιλεῖς με; ἐλυπήθη ὁ Πέτρος ὅτι εἶπεν αὐτῷ τὸ τρίτον· Φιλεῖς με; καὶ ⸀εἶπεν αὐτῷ· Κύριε, ⸂πάντα σὺ⸃ οἶδας, σὺ γινώσκεις ὅτι φιλῶ σε. λέγει αὐτῷ ⸀ὁ Ἰησοῦς· Βόσκε τὰ ⸀πρόβατά μου.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/017.yaml
  text: He said to him the third time[a], “Simon, son of John, do you love me?” Peter was grieved because he said to him the third time, “Do you love me?” And he said to him, “Lord, you know all things; you know that I love you.” Jesus said to him[b], “Feed my sheep.”
translation:
  language: vi
  text: 'Ngài hỏi ông lần thứ ba[a]: “Si-môn, con của Giăng, con có yêu Ta không?” Phi-e-rơ buồn lòng vì Ngài hỏi ông lần thứ ba: “Con có yêu Ta không?” Ông thưa với Ngài: “Lạy Chúa, Ngài biết mọi sự; Ngài biết[b] rằng con yêu Ngài.” Đức Chúa Giê-su nói với ông: “Hãy cho chiên Ta ăn.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ở đây tiếng Hy Lạp dùng φιλέω (“yêu, có lòng trìu mến”), trong khi ở hai câu hỏi trước Đức Chúa Giê-su dùng ἀγαπάω. Một số người cho rằng sự thay đổi này có ý nghĩa; những người khác cho rằng hai động từ có nghĩa chồng lấn trong ngữ cảnh này. Bản dịch dùng “yêu” và không áp đặt một sự tương phản rõ hơn điều tiếng Hy Lạp chắc chắn cho phép.
    reason: lexical_alternative
  - marker: b
    text: 'Trong lời đáp của Phi-e-rơ, tiếng Hy Lạp dùng hai động từ khác nhau chỉ sự biết: οἶδα và γινώσκω. Tiếng Việt tự nhiên dùng “biết” cho cả hai ở đây; sự lặp lại có thể gợi một sắc thái khác biệt, nhưng khó diễn đạt mà không giải thích quá mức.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ τρίτον
  choice: lần thứ ba
  rationale: Diễn đạt tự nhiên trong tiếng Việt và giữ nguyên mô-típ câu hỏi được lặp lại.
- source_word: Σίμων Ἰωάννου
  choice: Si-môn, con của Giăng
  rationale: Dạng sở hữu Ἰωάννου ở đây được hiểu tự nhiên nhất như tên cha; bản Hy Lạp này ghi Giăng, không phải Giô-na.
- source_word: φιλεῖς / φιλῶ
  choice: yêu / yêu
  rationale: φιλέω chỉ tình yêu hoặc lòng trìu mến. Dùng “yêu” giữ được sức nặng của cuộc đối thoại mà không áp đặt một sự phân biệt quá sắc nét với ἀγαπάω.
- source_word: ἐλυπήθη
  choice: buồn lòng
  rationale: Diễn tả nỗi đau buồn, tổn thương của Phi-e-rơ bằng cách nói tự nhiên nhưng trang trọng trong tiếng Việt.
- source_word: Κύριε
  choice: Lạy Chúa
  rationale: Phù hợp với lời Phi-e-rơ thưa cùng Đức Chúa Jêsus phục sinh và có ý nghĩa cao hơn một lời xưng hô lịch sự đơn thuần.
- source_word: πάντα σὺ οἶδας
  choice: Ngài biết mọi sự
  rationale: Giữ nguyên phạm vi rộng và sắc thái long trọng của πάντα, đồng thời dùng đại từ tôn kính tự nhiên.
- source_word: οἶδας ... γινώσκεις
  choice: biết ... biết
  rationale: Cả hai động từ đều nói về sự biết; ép thành hai từ tiếng Việt khác nhau sẽ dễ diễn giải quá mức. Sự lặp lại được giữ nguyên và khác biệt từ vựng được ghi chú.
- source_word: Βόσκε
  choice: Hãy cho ... ăn
  rationale: βόσκω cụ thể nói đến việc cho ăn hoặc cung cấp đồng cỏ, khác với ποιμαίνω là chăn dắt.
- source_word: πρόβατά
  choice: chiên
  rationale: πρόβατα là chiên nói chung, không riêng chiên con; cách dịch này giữ được sự phân biệt với ἀρνία ở câu 15.
theological_decisions:
- issue: Có nên thể hiện một sự phân biệt rõ nét giữa φιλέω và ἀγαπάω trong cuộc đối thoại hay không
  choice: Dịch φιλέω là “yêu”, không hàm ý một loại tình yêu khác ngay trong chính văn
  alternative: Dùng các từ khác nhau như “yêu” và “thương mến”, hoặc xem sự luân phiên động từ là mang ý nghĩa thần học quyết định
  rationale: Sự khác biệt ngữ nghĩa giữa hai động từ trong tiếng Hy Lạp Koinē không đủ ổn định để buộc phải thể hiện bằng hai động từ tiếng Việt ở đây. Chú thích bảo tồn vấn đề giải nghĩa mà không giải quyết thay cho độc giả.
- issue: 'Sức nặng của lời Phi-e-rơ: “Ngài biết mọi sự”'
  choice: Giữ nguyên như một khẳng định mạnh mẽ về sự hiểu biết toàn diện của Chúa trong ngữ cảnh
  alternative: Thu hẹp thành “Ngài biết mọi điều về việc này” hoặc mở rộng thành một lời giải thích giáo lý về sự toàn tri
  rationale: Bản Hy Lạp nói thẳng “Ngài biết mọi sự”; bản dịch cần giữ sức mạnh ấy mà không thu hẹp hay thêm lời giải nghĩa giáo lý.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài/con” trong lời đối thoại để thể hiện sự tôn kính và quan hệ thầy-trò; “Lạy Chúa” giữ sắc thái khẩn thiết, cung kính. Các dấu chú thích [a], [b] đều xuất hiện trong chính văn.
