  yaml_path: translation/nt/john/021/021.yaml
  text: So when Peter saw him, he says to Jesus, “Lord, what about this man?”
translation:
  language: vi
  text: 'Vậy, Phi-e-rơ thấy người ấy thì nói với Chúa Giê-su: “Thưa Chúa, còn người này thì sao?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦτον ... ἰδών
  choice: khi thấy người ấy
  rationale: Diễn đạt tự nhiên cấu trúc phân từ, đồng thời giữ đại từ chỉ người liên kết với nhân vật vừa được nhắc đến trong văn cảnh.
- source_word: λέγει
  choice: nói
  rationale: Thì hiện tại lịch sử trong tiếng Hy Lạp được chuyển sang lối kể tự nhiên của tiếng Việt; không nhất thiết phải biểu thị hình thái hiện tại.
- source_word: Κύριε
  choice: Thưa Chúa
  rationale: Giữ danh xưng κύριε và thêm từ xưng hô “Thưa” để câu nói trực tiếp tự nhiên, kính trọng trong tiếng Việt.
- source_word: οὗτος δὲ τί;
  choice: còn người này thì sao?
  rationale: Giữ sắc thái chuyển hướng/đối chiếu của δέ và lối hỏi tỉnh lược tự nhiên, không bổ sung điều cụ thể mà Phi-e-rơ muốn hỏi.
theological_decisions:
- issue: Nội dung tỉnh lược của câu hỏi οὗτος δὲ τί;
  choice: còn người này thì sao?
  alternative: Chúa sẽ làm gì với người này? / Người này sẽ thế nào?
  rationale: Nguyên văn cố ý không nói rõ câu hỏi liên quan đến số phận, nhiệm vụ hay cái chết của người môn đồ ấy; bản dịch giữ nguyên độ mở này.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Phi-e-rơ” và “Đức Chúa Jêsus” theo quy ước tên riêng Kinh Thánh tiếng Việt; câu hỏi cuối giữ khẩu khí tự nhiên.
