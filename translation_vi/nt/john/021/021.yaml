  rationale: Bản sửa chuẩn hóa tên Giê-su theo tiếng Việt hiện đại, dùng «Vậy» cho οὖν, và đưa chủ ngữ «Phi-e-rơ» lên trước hành động «thấy» để câu tự nhiên, minh bạch hơn. Câu hỏi tỉnh lược được giữ nguyên, không giải thích thay cho nguyên văn.
