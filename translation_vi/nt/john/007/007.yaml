id: JHN.7.7
reference: John 7:7
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οὐ δύναται ὁ κόσμος μισεῖν ὑμᾶς, ἐμὲ δὲ μισεῖ, ὅτι ἐγὼ μαρτυρῶ περὶ αὐτοῦ ὅτι τὰ ἔργα αὐτοῦ πονηρά ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/007.yaml
  text: The world is not able to hate you[a], but it hates me[d][c][b], because I testify about it that its works are evil.
translation:
  language: vi
  text: Thế gian không thể ghét các anh[a], nhưng nó ghét tôi, vì tôi làm chứng về thế gian ấy[b], rằng các việc của thế gian ấy là xấu xa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “không có khả năng ghét các anh.”'
    reason: lexical_alternative
  - marker: b
    text: “Thế gian” trong sách Giăng thường chỉ thế giới con người trong sự chống nghịch Đức Chúa Trời, chứ không phải chính vũ trụ được tạo dựng.
    reason: cultural_note
lexical_decisions:
- source_word: οὐ δύναται
  choice: không thể
  rationale: Diễn đạt trực tiếp ý không có khả năng của δύναμαι và tự nhiên trong tiếng Việt hiện đại.
- source_word: ὁ κόσμος
  choice: thế gian
  rationale: Giữ cách gọi ngắn gọn, quen thuộc trong văn mạch Giăng, không thu hẹp nghĩa thành một hệ thống hay toàn thể loài người chống nghịch Đức Chúa Trời.
- source_word: μισεῖν / μισεῖ
  choice: ghét / ghét
  rationale: Giữ nguyên sự lặp lại và sắc thái mạnh của động từ Hy Lạp.
- source_word: ἐμὲ δὲ
  choice: nhưng lại ghét tôi
  rationale: “Nhưng lại” làm rõ sự tương phản được δέ đánh dấu, đồng thời giữ câu tự nhiên trong tiếng Việt.
- source_word: μαρτυρῶ
  choice: tôi làm chứng
  rationale: Cách dịch hiện đại, rõ nghĩa, giữ sắc thái nhân chứng của μαρτυρέω.
- source_word: περὶ αὐτοῦ
  choice: về nó
  rationale: Đại từ quy chiếu về “thế gian”; ghi chú giúp tránh cảm giác diễn đạt gượng trong tiếng Việt.
- source_word: τὰ ἔργα αὐτοῦ
  choice: những việc nó làm
  rationale: Diễn đạt tự nhiên hơn “các công việc của nó” mà vẫn truyền đạt ἔργα là các hành vi của thế gian.
- source_word: πονηρά
  choice: xấu xa
  rationale: Thể hiện sự xấu về đạo đức, mạnh hơn “xấu” nhưng tự nhiên hơn trong cấu trúc tiếng Việt này.
theological_decisions:
- issue: Phạm vi quy chiếu và sức nặng thần học của ὁ κόσμος
  choice: Giữ “thế gian” trong chính văn
  alternative: “hệ thống thế gian” hoặc “nhân loại chống nghịch Đức Chúa Trời”
  rationale: Cách dùng của Giăng có nhiều lớp nghĩa. Không thêm lời giải thích vào chính văn để tránh giới hạn thuật ngữ vào một cách diễn giải riêng.
- issue: Sắc thái của mệnh đề τὰ ἔργα αὐτοῦ πονηρά ἐστιν
  choice: “những việc nó làm đều xấu xa”
  alternative: “các công việc của nó là gian ác”
  rationale: Giữ lời phán xét đạo đức dứt khoát mà không thêm nội dung giáo lý ngoài câu Hy Lạp.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Các anh” phù hợp với lời Đức Chúa Jêsus nói với các em trai/người anh em nam của mình trong văn mạch; “tôi” giữ lời thoại tự nhiên. Dùng “thế gian” để bảo tồn thuật ngữ giàu sắc thái của Giăng.
