revisions:
- from: 'Vì vậy, Đức Chúa Jêsus nói với họ: “Thời điểm của tôi vẫn chưa đến[a], còn thời điểm của các anh thì lúc nào cũng thuận tiện.”'
  to: 'Vì vậy, Giê-su nói với họ: “Thời điểm của tôi vẫn chưa đến[a], còn thời điểm của các anh thì lúc nào cũng thích hợp.”'
  rationale: Bản sửa loại bỏ tước hiệu không hiện diện trong nguyên văn, cải thiện cách diễn đạt vế đối lập, và điều chỉnh chú thích để giữ đúng quan hệ sở hữu trong tiếng Hy Lạp. Không cần giải thích thần học thêm.
  reviewer_model: gpt-5.6-terra
