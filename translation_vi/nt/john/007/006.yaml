source:
  edition: SBLGNT
  text: λέγει οὖν αὐτοῖς ὁ Ἰησοῦς· Ὁ καιρὸς ὁ ἐμὸς οὔπω πάρεστιν, ὁ δὲ καιρὸς ὁ ὑμέτερος πάντοτέ ἐστιν ἕτοιμος.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/006.yaml
  text: So Jesus said to them[a], “My time has not yet come, but your time is always ready.”
translation:
  language: vi
  text: 'Vì vậy, Giê-su nói với họ: “Thời điểm của tôi vẫn chưa đến[a], còn thời điểm của các anh thì lúc nào cũng thích hợp.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “thời điểm đã định của tôi vẫn chưa đến.” Từ Hy Lạp có thể chỉ thời điểm thích hợp hoặc đã được ấn định, chứ không chỉ thời gian nói chung.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Vì vậy
  rationale: Diễn tả sự tiếp nối mang tính suy luận từ lời các em trai của Đức Chúa Jêsus trong ngữ cảnh trước.
- source_word: λέγει ... ὁ Ἰησοῦς
  choice: Đức Chúa Jêsus nói
  rationale: Giữ cách kể tự nhiên trong tiếng Việt; hiện tại lịch sử của tiếng Hy Lạp không cần đánh dấu riêng.
- source_word: αὐτοῖς
  choice: với họ
  rationale: Truyền đạt bổ ngữ gián tiếp mà không giải thích thêm danh tính ngay trong câu.
- source_word: καιρός
  choice: thời điểm
  rationale: Nhấn mạnh một dịp hay thời điểm thích hợp, không chỉ thời gian nói chung, đồng thời vẫn giữ được sự tương ứng giữa hai vế.
- source_word: οὔπω πάρεστιν
  choice: vẫn chưa đến
  rationale: Diễn đạt tự nhiên ý thời điểm ấy cho đến nay chưa hiện diện hoặc chưa tới.
- source_word: δὲ
  choice: còn
  rationale: Tạo thế tương phản rõ nhưng tự nhiên giữa thời điểm của Đức Chúa Jêsus và của các em trai ngài.
- source_word: πάντοτέ ἐστιν ἕτοιμος
  choice: lúc nào cũng thuận tiện
  rationale: Với chủ ngữ là καιρός, cách nói này tự nhiên hơn 'luôn sẵn sàng' trong tiếng Việt và diễn tả một thời điểm luôn thích hợp hoặc sẵn có.
theological_decisions:
- issue: Ý nghĩa 'thời điểm' của Đức Chúa Jêsus trong văn mạch Giăng
  choice: thời điểm của tôi
  alternative: giờ của tôi; thời điểm đã định cho tôi
  rationale: Bản dịch giữ καιρός là 'thời điểm', không đổi thành 'giờ' vì nguyên văn không dùng ὥρα, và không đưa ý 'đã định' vào chính văn dù sắc thái ấy có thể hiện diện.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Đức Chúa Jêsus” theo lối gọi Cơ Đốc giáo phổ biến; đại từ “tôi/các anh” phản ánh lời nói trực tiếp với các em trai mà không làm câu quá cổ kính.
