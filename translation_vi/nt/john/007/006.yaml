review_pass:
  verdict: revise
  source_fidelity: Cần bỏ tước hiệu «Đức Chúa» vì nguyên văn chỉ có tên ὁ Ἰησοῦς, không có κύριος («Chúa»). Bản sửa giữ «Vì vậy», đại từ «họ», sự đối lập giữa «thời điểm của tôi» và «thời điểm của các anh», cùng ý οὔπω («chưa...») và πάντοτε ἕτοιμος («lúc nào cũng thích hợp»).
  naturalness: «Thời điểm ... lúc nào cũng thuận tiện» có thể hiểu là thời điểm ấy tiện lợi, nhưng «lúc nào cũng thích hợp» diễn đạt tự nhiên và sát hơn trạng thái «sẵn/chuẩn bị» của καιρός trong thế tương phản. «Giê-su nói với họ» là văn phong tường thuật hiện đại, trung tính.
  terminology: Dùng «Giê-su» là dạng tên hiện đại thông dụng và không thêm tước hiệu không có trong câu nguồn. «Thời điểm» phù hợp với καιρός và không đồng nhất nó với ὥρα («giờ»). Chú thích giữ khả năng «thời điểm đã định» như một sắc thái từ vựng, không đưa vào chính văn.
  issues:
  - severity: medium
    issue: Thêm tước hiệu «Đức Chúa» vào tên Giê-su.
    rationale: SBLGNT đọc ὁ Ἰησοῦς, chỉ nêu tên riêng với mạo từ, không có danh xưng κύριος. Việc thêm «Chúa» làm chính văn cụ thể hóa vượt quá câu nguồn và mang sắc thái truyền thống giáo phái.
  - severity: low
    issue: «Thuận tiện» chưa diễn đạt rõ nhất ἕτοιμος trong cụm «ὁ καιρὸς ... ἕτοιμος».
    rationale: «Thích hợp» giữ tốt hơn ý thời cơ luôn sẵn/thích đáng, đồng thời vẫn tự nhiên khi chủ ngữ là «thời điểm».
  - severity: low
    issue: Câu chú thích «thời điểm đã định cho tôi» làm thay đổi nhẹ quan hệ sở hữu của ὁ ἐμός.
    rationale: «Thời điểm đã định của tôi» giữ cấu trúc «thời điểm của tôi» rõ hơn; ý «đã định» vẫn chỉ là phương án diễn giải từ vựng.
  revised_text: 'Vì vậy, Giê-su nói với họ: “Thời điểm của tôi vẫn chưa đến[a], còn thời điểm của các anh thì lúc nào cũng thích hợp.”'
  revised_footnotes:
  - marker: a
    text: Hay “thời điểm đã định của tôi vẫn chưa đến.” Từ Hy Lạp có thể chỉ thời điểm thích hợp hoặc đã được ấn định, chứ không chỉ thời gian nói chung.
    reason: lexical_alternative
