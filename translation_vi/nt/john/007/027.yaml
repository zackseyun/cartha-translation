id: JHN.7.27
reference: John 7:27
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀλλὰ τοῦτον οἴδαμεν πόθεν ἐστίν· ὁ δὲ χριστὸς ὅταν ἔρχηται οὐδεὶς γινώσκει πόθεν ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/027.yaml
  text: But we know where this man is from; but when the Messiah comes[a], no one knows where he is from.
translation:
  language: vi
  text: Nhưng chúng ta biết người này từ đâu đến; còn khi Đấng Mê-si đến, không ai biết Ngài từ đâu đến.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀλλὰ
  choice: Nhưng
  rationale: Diễn tả trực tiếp sự tương phản với phần bàn luận trước đó, tự nhiên trong tiếng Việt hiện đại.
- source_word: τοῦτον
  choice: người này
  rationale: Đại từ chỉ định nói cụ thể về Đức Giê-su và mang sắc thái chỉ đích danh; “người này” tự nhiên hơn cách dịch sát chữ “người nầy/đấng này”.
- source_word: οἴδαμεν
  choice: chúng ta biết
  rationale: Diễn đạt kiến thức mà những người nói cho rằng mình đang có.
- source_word: πόθεν ἐστίν
  choice: từ đâu đến
  rationale: Diễn đạt nguồn gốc một cách tự nhiên và giữ cùng một cách nói ở cả hai vế.
- source_word: ὁ δὲ χριστός
  choice: còn ... Đấng Mê-si
  rationale: δέ được thể hiện bằng “còn” để nối hai vế tương phản; χριστός ở đây là tước hiệu của nhân vật Mê-si được mong đợi, không phải tên riêng.
- source_word: ὅταν ἔρχηται
  choice: khi ... đến
  rationale: Diễn đạt một sự kiện tương lai chưa xác định nhưng được người nói trông đợi, phù hợp với ὅταν cùng thể giả định.
- source_word: οὐδεὶς
  choice: không ai
  rationale: Cách diễn đạt phổ quát phủ định rõ ràng và tự nhiên.
- source_word: γινώσκει
  choice: biết
  rationale: Trong ngữ cảnh này động từ nói về sự biết nguồn gốc; tiếng Việt không cần gượng ép tạo khác biệt từ vựng với οἴδαμεν.
theological_decisions:
- issue: Cách dịch Χριστός như một tước hiệu
  choice: Đấng Mê-si
  alternative: Đấng Christ
  rationale: Trong câu này, χριστός chỉ nhân vật Mê-si mà dân chúng mong đợi. “Đấng Mê-si” giữ rõ bối cảnh Do Thái và chức năng tước hiệu.
- issue: Bản chất lời khẳng định của đám đông về nguồn gốc Đấng Mê-si
  choice: Dịch nguyên lời khẳng định mà không xác nhận lời ấy là đúng
  alternative: Thêm lời giải thích rằng đây chỉ là quan niệm hoặc sự hiểu lầm của dân chúng
  rationale: Câu văn thuật lại lời của dân chúng chứ không phải lời xác nhận thần học của người kể chuyện; bản dịch giữ nguyên sức căng và không giải thích thêm.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “chúng ta” cho ngôi thứ nhất số nhiều trong lời đám đông; dùng “Ngài” ở vế sau để chỉ Đấng Mê-si với sắc thái kính trọng phổ biến trong văn phong Kinh Thánh tiếng Việt. Dấu chấm phẩy giữ cấu trúc đối chiếu chặt của câu Hy Lạp.
