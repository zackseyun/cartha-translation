translation:
  language: vi
  text: Rồi[a] mỗi người trở về nhà mình.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Câu này mở đầu câu chuyện về người phụ nữ bị bắt quả tang phạm tội ngoại tình (Giăng 7:53–8:11). Toàn bộ phân đoạn không có trong các thủ bản Hy Lạp sớm nhất còn tồn tại, gồm các bản giấy cói từ thế kỷ III và các thủ bản bộ Sinaiticus và Vaticanus thế kỷ IV; cũng không có trong các bản dịch Coptic và Syriac thời kỳ đầu. Phân đoạn xuất hiện trong Codex Bezae thế kỷ V, truyền thống La-tinh và phần lớn các thủ bản Byzantine về sau. Trong một số thủ bản, câu chuyện được đặt ở những vị trí khác, như sau Giăng 21:25 hoặc Lu-ca 21:38, cho thấy lịch sử lưu truyền và vị trí của phân đoạn này có sự khác biệt. Phân đoạn được giữ ở đây vì đã được bảo lưu trong truyền thống đọc Kitô giáo qua khoảng 1.500 năm.
    reason: textual_critical
lexical_decisions:
- source_word: Καί
  choice: Rồi
  rationale: Trong mạch kể chuyện, liên từ này nối tiếp sự việc trước đó; “Rồi” tự nhiên hơn “Và” trong tiếng Việt mà không thêm quan hệ nhân quả.
- source_word: ἐπορεύθη
  choice: trở về
  rationale: Động từ chỉ sự đi lại; khi đích đến là nhà của mỗi người, “trở về” diễn đạt tự nhiên ý đi về nhà.
- source_word: ἕκαστος
  choice: mỗi người
  rationale: Giữ sắc thái phân phối ở số ít, nhấn mạnh từng người riêng biệt.
- source_word: οἶκον
  choice: nhà
  rationale: Trong cụm εἰς τὸν οἶκον αὐτοῦ, “nhà” là cách diễn đạt tiếng Việt tự nhiên cho nơi ở của chính người ấy.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Rồi” để nối mạch tự sự, “mỗi người” để giữ nét phân phối của ἕκαστος, và “trở về nhà mình” như một thành ngữ tự nhiên trong tiếng Việt.
