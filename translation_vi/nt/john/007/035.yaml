id: JHN.7.35
reference: John 7:35
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἶπον οὖν οἱ Ἰουδαῖοι πρὸς ἑαυτούς· Ποῦ οὗτος μέλλει πορεύεσθαι ὅτι ἡμεῖς οὐχ εὑρήσομεν αὐτόν; μὴ εἰς τὴν διασπορὰν τῶν Ἑλλήνων μέλλει πορεύεσθαι καὶ διδάσκειν τοὺς Ἕλληνας;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/035.yaml
  text: So the Jews said to one another, “Where is this man about to go, that we will not find him? He is not about to go to the dispersion among the Greeks and teach the Greeks, is he?”
translation:
  language: vi
  text: 'Vì vậy, người Do Thái[a] nói với nhau: “Ông này định đi đâu mà chúng ta sẽ không tìm thấy ông ấy? Chẳng lẽ ông ấy định đi đến nơi người Do Thái đang sống tản lạc giữa người Hy Lạp[b] và dạy người Hy Lạp sao?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “người Giu-đê.” Từ Hy Lạp này có thể chỉ người Do Thái nói chung hoặc, trong một số ngữ cảnh, người thuộc miền Giu-đê.
    reason: lexical_alternative
  - marker: b
    text: Cụm từ này nói đến người Do Thái sống tản lạc giữa người Hy Lạp, chứ không phải người Hy Lạp là cộng đồng bị tản lạc.
    reason: cultural_note
lexical_decisions:
- source_word: οἱ Ἰουδαῖοι
  choice: người Do Thái
  rationale: Đây là cách tương đương trực tiếp và tự nhiên trong tiếng Việt; không tự ý thu hẹp thành giới lãnh đạo. Khả năng hiểu là người Giu-đê được ghi ở chú thích.
- source_word: πρὸς ἑαυτούς
  choice: nói với nhau
  rationale: 'Diễn đạt tự nhiên ý tương hỗ: họ trao đổi trong nhóm của mình.'
- source_word: Ποῦ οὗτος
  choice: Ông này ... đi đâu
  rationale: “Ông này” giữ được sắc thái chỉ trỏ, có phần xa cách của οὗτος mà vẫn tự nhiên và không quá miệt thị.
- source_word: μέλλει πορεύεσθαι
  choice: định đi
  rationale: Trong lời suy đoán này, μέλλω với động từ nguyên mẫu có thể hàm ý dự định hoặc sắp xảy ra; “định đi” phù hợp ngữ cảnh mà không nhấn quá mức tính tức thời.
- source_word: ὅτι ἡμεῖς οὐχ εὑρήσομεν αὐτόν
  choice: mà chúng ta sẽ không tìm thấy ông ấy
  rationale: Giữ động từ tương lai và quan hệ hệ quả/giải thích của mệnh đề, không thêm ý “không thể” vốn không được nói rõ.
- source_word: μὴ
  choice: Chẳng lẽ ... sao?
  rationale: Cấu trúc nghi vấn tiếng Việt này tự nhiên truyền đạt câu hỏi có xu hướng chờ câu trả lời phủ định.
- source_word: διασπορὰν τῶν Ἑλλήνων
  choice: cộng đồng người Do Thái sống tản lạc giữa người Hy Lạp
  rationale: Làm rõ rằng διασπορά chỉ người Do Thái sống phân tán giữa các dân nói tiếng Hy Lạp, chứ không phải sự phân tán gồm người Hy Lạp; “cộng đồng” giúp câu tiếng Việt dễ hiểu.
- source_word: Ἕλληνας
  choice: người Hy Lạp
  rationale: Giữ nghĩa từ vựng trực tiếp, không mở rộng thành mọi dân ngoại.
theological_decisions:
- issue: Phạm vi nghĩa của Ἰουδαῖοι trong sách Giăng
  choice: người Do Thái
  alternative: người Giu-đê
  rationale: Ngữ cảnh không buộc phải hiểu theo vùng miền hay giới lãnh đạo; bản dịch chính giữ nghĩa dân tộc/tập thể rộng hơn, đồng thời chú thích khả năng từ này chỉ người Giu-đê.
- issue: Danh tính của διασπορά
  choice: cộng đồng người Do Thái sống tản lạc giữa người Hy Lạp
  alternative: sự tản lạc của người Hy Lạp
  rationale: Theo cách dùng Do Thái, διασπορά nói đến người Do Thái sống rải rác ngoài quê hương. Cách dịch tránh khiến độc giả hiểu nhầm rằng chính người Hy Lạp là cộng đồng bị phân tán.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. “Ông này” giữ sắc thái xa cách trong lời nói của nhóm người Do Thái; “chẳng lẽ ... sao?” bảo toàn lực nghi vấn mong đợi câu trả lời phủ định. Đại từ “ông ấy” phù hợp lời tường thuật trong ngữ cảnh mà không thêm sắc thái tôn kính mang tính diễn giải.
