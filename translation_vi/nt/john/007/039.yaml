source:
  edition: SBLGNT
  text: τοῦτο δὲ εἶπεν περὶ τοῦ πνεύματος ⸀οὗ ἔμελλον λαμβάνειν οἱ ⸀πιστεύσαντες εἰς αὐτόν· οὔπω γὰρ ἦν ⸀πνεῦμα, ὅτι Ἰησοῦς ⸀οὐδέπω ἐδοξάσθη.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/039.yaml
  text: He said this about the Spirit[a], whom those who believed in him were about to receive; for the Spirit was not yet[b], because Jesus had not yet been glorified.
translation:
  language: vi
  text: Ngài nói điều này về Thánh Linh, Đấng mà những người tin vào Ngài sắp nhận lãnh; vì chưa có Thánh Linh[a], bởi Giê-su chưa được tôn vinh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay nói rõ nghĩa hơn: “vì Thánh Linh chưa được ban.” Nguyên văn chỉ nói: “vì chưa có Thánh Linh,” và liên kết điều này với việc Giê-su chưa được tôn vinh.'
    reason: Giữ nguyên cách nói cô đọng và sức căng của tiếng Hy Lạp trong chính văn, đồng thời nêu cách hiểu theo ngữ cảnh mà không đưa phần diễn giải vào chính văn.
lexical_decisions:
- source_word: τοῦ πνεύματος / πνεῦμα
  choice: Thánh Linh
  rationale: Trong ngữ cảnh, từ này chỉ Thần Linh của Đức Chúa Trời mà người tin sẽ nhận lãnh. Tiếng Việt cần một cách gọi xác định và tự nhiên; “Thánh Linh” diễn đạt đúng sở chỉ dù nguyên văn không có ἅγιον.
- source_word: οὗ
  choice: Đấng mà
  rationale: Đại từ quan hệ quy về Thánh Linh; “Đấng mà” là cách diễn đạt tôn kính, có tính ngôi vị và tự nhiên trong tiếng Việt.
- source_word: ἔμελλον λαμβάνειν
  choice: sắp nhận lãnh
  rationale: Giữ sắc thái tương lai gần hoặc điều sắp xảy ra của μέλλω với động từ nguyên mẫu; “nhận lãnh” phù hợp văn phong Kinh Thánh trang trọng nhưng vẫn dễ hiểu.
- source_word: οἱ πιστεύσαντες εἰς αὐτόν
  choice: những người tin Ngài
  rationale: Diễn đạt tự nhiên cấu trúc πιστεύω εἰς; phân từ aorist xác định nhóm người tin mà không nhất thiết phải ép thành thì quá khứ hoàn thành trong tiếng Việt.
- source_word: οὔπω γὰρ ἦν πνεῦμα
  choice: vì lúc ấy chưa có Thánh Linh
  rationale: Giữ sự ngắn gọn và căng thẳng của nguyên văn “Thánh Linh chưa có/chưa hiện hữu”, không tự ý thêm “được ban”; “lúc ấy” làm rõ điểm nhìn thời gian trong tiếng Việt.
- source_word: ἐδοξάσθη
  choice: được tôn vinh
  rationale: Bảo toàn chủ đề δοξάζω trong Giăng, bao gồm sự chết, phục sinh và hiển vinh của Đức Chúa Jêsus mà không thu hẹp vào một phương diện.
theological_decisions:
- issue: Cách dịch οὔπω γὰρ ἦν πνεῦμα mà không ngầm phủ nhận sự hiện hữu trước đó của Thánh Linh.
  choice: 'Giữ cách nói sát nguyên văn trong chính văn: “lúc ấy chưa có Thánh Linh”, đồng thời chú thích cách hiểu minh nhiên thường gặp.'
  alternative: “vì Thánh Linh chưa được ban” hoặc “vì Thánh Linh chưa hiện diện theo cách ấy”
  rationale: Nguyên văn không có động từ “ban” và gắn tình trạng này với việc Đức Chúa Jêsus chưa được tôn vinh. Bản dịch giữ nguyên sức căng thần học thay vì âm thầm giải quyết nó, còn chú thích giúp độc giả nhận ra cách hiểu theo bối cảnh.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ đọc. Dùng “Ngài” cho Đức Chúa Jêsus và “Đấng” cho Thánh Linh. Dấu chấm phẩy giữ quan hệ giải thích giữa lời tường thuật và mệnh đề nguyên nhân.
