  source_fidelity: 'Bản dịch nhìn chung phản ánh đúng cấu trúc và ý nghĩa của câu Hy Lạp: lời giải thích liên quan đến Thánh Linh, những người tin vào Đức Chúa Jêsus sẽ nhận lãnh, và mối liên hệ với sự tôn vinh của Ngài. Tuy nhiên, “lúc ấy” không có từ tương ứng trực tiếp trong nguyên văn và không cần thiết để diễn đạt οὔπω (“chưa.../chưa có”). Danh xưng “Đức Chúa Jêsus” thêm tước hiệu không có trong Ἰησοῦς; nên dùng tên “Giê-su” trong mệnh đề cuối.'
