id: JHN.7.49
reference: John 7:49
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀλλὰ ὁ ὄχλος οὗτος ὁ μὴ γινώσκων τὸν νόμον ⸀ἐπάρατοί εἰσιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/049.yaml
  text: But this crowd[a], which does not know the law[b], is accursed.
translation:
  language: vi
  text: Nhưng đám đông này, vốn không biết luật pháp[b], thì bị nguyền rủa[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “ở dưới lời nguyền.”'
    reason: lexical_alternative
  - marker: b
    text: “Luật pháp” ở đây chỉ Luật Do Thái, tức Torah.
    reason: cultural_note
lexical_decisions:
- source_word: ἀλλὰ
  choice: Nhưng
  rationale: Diễn đạt tự nhiên sự tương phản với lời nói trước đó.
- source_word: ὁ ὄχλος οὗτος
  choice: đám đông này
  rationale: Giữ nghĩa trung tính của ὄχλος, không thêm sắc thái miệt thị mạnh như “đám dân ô hợp”.
- source_word: ὁ μὴ γινώσκων
  choice: vốn không biết
  rationale: Diễn đạt phân từ có mạo từ dùng để mô tả đám đông; “vốn” giúp mệnh đề chen vào tự nhiên mà không biến nó thành quan hệ nguyên nhân rõ rệt.
- source_word: τὸν νόμον
  choice: luật pháp
  rationale: Trong ngữ cảnh, từ này chỉ Luật Do Thái/Torah; “luật pháp” là cách nói tự nhiên và trang trọng trong tiếng Việt.
- source_word: ἐπάρατοί εἰσιν
  choice: thì bị nguyền rủa
  rationale: Giữ nguyên sức nặng của lời kết án trong câu nói trực tiếp, đồng thời dùng cấu trúc vị ngữ tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Có nên trình bày lời kết án thù nghịch của những người nói như một khẳng định thần học của người thuật chuyện hay không
  choice: Dịch thẳng lời kết án như nội dung của câu nói trực tiếp, không làm nhẹ đi và cũng không thêm lời tán thành.
  alternative: 'Thêm khoảng cách diễn giải, chẳng hạn: “họ cho rằng đám đông này bị nguyền rủa.”'
  rationale: Bản Hy Lạp ghi trực tiếp lời của những người chống đối Chúa Giê-xu. Bản dịch cần giữ sự căng thẳng ấy mà không biến lời họ thành lời xác nhận của người thuật chuyện.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Cấu trúc “vốn… thì…” giữ mệnh đề mô tả và lời phán xét gay gắt của người nói, nhưng không tự ý thêm quan hệ nhân quả. Các ký hiệu chú thích được đặt ngay sau những từ ngữ mà chúng giải thích.
