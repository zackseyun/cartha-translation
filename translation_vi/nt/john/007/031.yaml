source:
  edition: SBLGNT
  text: ⸂ἐκ τοῦ ὄχλου δὲ πολλοὶ⸃ ἐπίστευσαν εἰς αὐτόν, καὶ ⸀ἔλεγον· Ὁ χριστὸς ὅταν ἔλθῃ ⸀μὴ πλείονα ⸀σημεῖα ποιήσει ὧν οὗτος ἐποίησεν;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/031.yaml
  text: But many from the crowd believed in him[a], and they were saying, “When the Messiah comes, he will not do more signs than this man has done, will he?”
translation:
  language: vi
  text: 'Nhưng nhiều người trong đám đông đã tin vào Ngài, và họ nói: “Khi Đấng Mê-si[a] đến, chẳng lẽ Đấng ấy sẽ làm nhiều dấu lạ hơn người này đã làm sao?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “Đấng Christ.” Từ Hy Lạp Χριστός được dịch là “Đấng Mê-si” ở đây vì được dùng như một tước hiệu trong bối cảnh kỳ vọng về Đấng Mê-si của người Do Thái.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκ τοῦ ὄχλου δὲ πολλοὶ
  choice: Nhưng nhiều người trong đám đông
  rationale: 'Cụm ἐκ τοῦ ὄχλου có nghĩa phân xuất: nhiều người thuộc về đám đông ấy. “Trong đám đông” tự nhiên trong tiếng Việt, còn “nhưng” diễn đạt sự tương phản nhẹ của δέ với bối cảnh chống đối và tranh luận.'
- source_word: ἐπίστευσαν εἰς αὐτόν
  choice: đã tin Ngài
  rationale: Cấu trúc πιστεύω với εἰς diễn tả lòng tin hướng đến một người. “Tin Ngài” là cách nói tự nhiên, trang trọng và không thêm mức độ diễn giải như “đặt đức tin nơi Ngài”.
- source_word: ἔλεγον
  choice: nói với nhau
  rationale: Thì chưa hoàn thành gợi lời nói đang diễn ra hoặc được nhiều người nhắc lại. Trong ngữ cảnh một nhóm người, “nói với nhau” truyền đạt tự nhiên sắc thái ấy mà không cường điệu thành “cứ nói mãi”.
- source_word: ὁ χριστός
  choice: Đấng Mê-si
  rationale: Χριστός ở đây là tước hiệu trong bối cảnh kỳ vọng của người Do Thái về Đấng sẽ đến. “Đấng Mê-si” giữ rõ bối cảnh đó và là cách gọi trang trọng, dễ hiểu trong tiếng Việt.
- source_word: ὅταν ἔλθῃ
  choice: Khi Đấng Mê-si đến
  rationale: ὅταν với động từ giả định aorist chỉ một sự kiện tương lai được hình dung. “Khi ... đến” là cách diễn đạt tiếng Việt tự nhiên và không biến câu thành điều kiện hoài nghi.
- source_word: μὴ πλείονα σημεῖα ποιήσει
  choice: chẳng lẽ Ngài sẽ làm nhiều dấu lạ hơn ... sao?
  rationale: μή trong câu hỏi hướng người nghe đến câu trả lời phủ định. Kết cấu “chẳng lẽ ... sao?” bảo toàn lực tu từ ấy trong tiếng Việt.
- source_word: πλείονα σημεῖα
  choice: nhiều dấu lạ hơn
  rationale: πλείονα so sánh về số lượng, vì vậy “nhiều ... hơn” chính xác hơn “dấu lạ lớn hơn”. “Dấu lạ” giữ thuật ngữ thần học đặc trưng của σημεῖον trong sách Giăng thay vì giản lược thành “phép lạ”.
- source_word: οὗτος ἐποίησεν
  choice: người này đã làm
  rationale: οὗτος chỉ Đức Chúa Jêsus theo lối nói công khai, bình dân của đám đông; “người này” tự nhiên hơn “vị này”. “Đã làm” diễn đạt hành động đã xảy ra mà vẫn là cơ sở cho sự so sánh hiện tại.
theological_decisions:
- issue: Cách dịch tước hiệu Χριστός
  choice: Đấng Mê-si
  alternative: Đấng Christ
  rationale: Trong câu “khi ... đến”, từ này rõ ràng là tước hiệu gắn với niềm trông đợi Đấng được xức dầu, không phải tên riêng. “Đấng Mê-si” làm nổi bật bối cảnh Do Thái mà không thêm một lập trường giáo phái.
- issue: Lực của câu hỏi có μή
  choice: Câu hỏi tu từ mong đợi câu trả lời phủ định, diễn đạt bằng “chẳng lẽ ... sao?”
  alternative: Một câu hỏi trung tính về việc Đấng Mê-si có làm thêm dấu lạ hay không
  rationale: 'μή thường báo hiệu câu trả lời phủ định được mong đợi. Bản dịch giữ nguyên sự căng thẳng: đám đông suy luận từ các dấu lạ của Đức Chúa Jêsus nhưng câu không trực tiếp thuật lại một lời tuyên xưng đầy đủ về căn tính của Ngài.'
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” cho đại từ chỉ Đấng Mê-si/Đức Chúa Jêsus; giữ “dấu lạ” để bảo toàn thuật ngữ của sách Giăng. Không cần chú thích vì không có biến thể hay độ mơ hồ nào cần ghi ngoài phần quyết định dịch.
