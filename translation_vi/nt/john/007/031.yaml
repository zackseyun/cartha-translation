  to: 'Nhưng nhiều người trong đám đông đã tin vào Ngài, và họ nói: “Khi Đấng Mê-si[a] đến, chẳng lẽ Đấng ấy sẽ làm nhiều dấu lạ hơn người này đã làm sao?”'
