id: JHN.7.42
reference: John 7:42
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸀οὐχ ἡ γραφὴ εἶπεν ὅτι ἐκ τοῦ σπέρματος Δαυίδ, καὶ ἀπὸ Βηθλέεμ τῆς κώμης ὅπου ἦν Δαυίδ, ⸂ἔρχεται ὁ χριστός⸃;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/042.yaml
  text: Has not the Scripture said that the Messiah comes from the offspring of David and from Bethlehem[a], the village where David was?
translation:
  language: vi
  text: Kinh Thánh chẳng đã nói rằng Đấng Mê-si[a] đến từ dòng dõi Đa-vít và từ Bết-lê-hem, ngôi làng nơi Đa-vít đã ở, sao?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “Đấng Ki-tô.” Tước hiệu Hy Lạp là ὁ χριστός.
    reason: Bảo lưu cách dịch thay thế của tước hiệu Χριστός và làm rõ từ Hy Lạp đứng sau “Đấng Mê-si”.
lexical_decisions:
- source_word: ἡ γραφή
  choice: Kinh Thánh
  rationale: Trong văn mạch Giăng, danh từ số ít này chỉ lời chứng có thẩm quyền của các sách thánh; “Kinh Thánh” là cách diễn đạt tự nhiên và quen thuộc trong tiếng Việt.
- source_word: εἶπεν
  choice: chẳng đã nói
  rationale: Thì aorist được thể hiện bằng “đã nói” trong câu hỏi tu từ; cấu trúc “chẳng đã… sao?” vừa tự nhiên vừa giữ lực khẳng định của câu Hy Lạp.
- source_word: ἐκ τοῦ σπέρματος Δαυίδ
  choice: từ dòng dõi Đa-vít
  rationale: σπέρμα ở đây nói về huyết thống và hậu duệ, không phải hạt giống theo nghĩa đen; “dòng dõi” chính xác và tự nhiên trong tiếng Việt.
- source_word: ἀπὸ Βηθλέεμ
  choice: từ Bết-lê-hem
  rationale: ἀπό chỉ nguồn gốc hoặc nơi xuất phát; “từ” chuyển tải trực tiếp ý này.
- source_word: τῆς κώμης
  choice: ngôi làng
  rationale: κώμη chỉ một làng hay khu định cư nhỏ; “ngôi làng” chính xác hơn “thành” và tự nhiên trong câu.
- source_word: ὅπου ἦν Δαυίδ
  choice: nơi Đa-vít từng ở
  rationale: Giữ cách nói đơn giản của nguyên văn “nơi Đa-vít đã ở/ở đó” mà không diễn giải mạnh thành quê sinh quán hay nơi cư trú lâu dài.
- source_word: ἔρχεται
  choice: đến
  rationale: Thì hiện tại diễn tả điều Kinh Thánh nói về nguồn gốc của Đấng được mong đợi; “đến” giữ được tính khái quát mà không biến thành một lời tiên báo thuần túy ở tương lai.
- source_word: ὁ χριστός
  choice: Đấng Mê-si
  rationale: Trong cuộc tranh luận Do Thái về vị vua và đấng giải cứu được mong đợi, Χριστός hoạt động như một tước hiệu; “Đấng Mê-si” truyền đạt ý nghĩa ấy rõ ràng hơn việc dùng như tên riêng.
theological_decisions:
- issue: Cách dịch Χριστός như một tước hiệu
  choice: Đấng Mê-si
  alternative: Đấng Ki-tô
  rationale: Văn mạch bàn về nguồn gốc của nhân vật cứu thế mà dân chúng mong đợi, nên dịch theo tước hiệu “Đấng Mê-si”; chú thích bảo lưu cách gọi truyền thống bắt nguồn trực tiếp từ từ Hy Lạp.
- issue: Ý nghĩa của ὅπου ἦν Δαυίδ
  choice: nơi Đa-vít từng ở
  alternative: quê của Đa-vít
  rationale: Nguyên văn chỉ nói “nơi Đa-vít ở/đã ở”; không xác định rõ đó là nơi sinh, quê quán hay chỉ nơi cư trú, nên bản dịch giữ sự khái quát này.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. Cấu trúc câu hỏi tu từ “chẳng đã… sao?” giữ lực của οὐχ mà vẫn tự nhiên trong tiếng Việt. Tên riêng được phiên âm theo lối dùng Kinh Thánh tiếng Việt phổ biến.
