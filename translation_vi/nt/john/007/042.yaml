  terminology: “Kinh Thánh,” “dòng dõi Đa-vít,” “Bết-lê-hem,” và “Đấng Mê-si” đều phù hợp. Chú thích thay thế “Đấng Ki-tô” được neo đúng tại tước hiệu và bảo lưu cách gọi truyền thống.
