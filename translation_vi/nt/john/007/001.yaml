revisions:
- from: Sau những việc ấy, Đức Chúa Jêsus đi lại trong miền Ga-li-lê[a]. Ngài không muốn đi lại trong miền Giu-đê, vì người Do Thái đang tìm cách giết Ngài.
  to: Sau những việc ấy, Giê-su đi lại trong miền Ga-li-lê[a], vì Người không muốn đi lại trong miền Giu-đê, bởi người Do Thái đang tìm cách giết Người.
  rationale: Chỉnh tên riêng thành “Giê-su” và bỏ danh hiệu không có trong nguyên văn. Giữ “đi lại” ở cả hai lần để phản ánh sự lặp lại của περιπατέω, đồng thời dùng “đang tìm cách” để biểu đạt ý định thù nghịch đang tiếp diễn của ἐζήτουν. Chú thích được viết lại cho tự nhiên hơn, neo tại “Ga-li-lê” như bản tiếng Anh đã cung cấp, và bảo lưu các khả năng dịch cũng như phạm vi quy chiếu theo văn cảnh của οἱ Ἰουδαῖοι.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T06:21:07Z'
review_pass:
  verdict: revise
  source_fidelity: Bản thảo truyền đạt đúng trình tự, địa điểm, lý do và ý định giết Đức Giê-su. Tuy nhiên, “Đức Chúa Jêsus” thêm danh hiệu “Chúa” không có trong ὁ Ἰησοῦς, đồng thời lối viết “Jêsus” không phải chính tả hiện đại thông dụng. Cần tránh sự bổ sung này trong một bản dịch tối ưu tương đương.
  naturalness: “Đi lại trong miền” là cách diễn đạt chấp nhận được và giữ được sự lặp lại của περιπατέω. Câu chú thích hiện có cụm “chỉ cụ thể hơn đến” không tự nhiên; cần chỉnh lại. Dùng “Giê-su” là lối viết hiện đại, trung tính và tự nhiên hơn.
  terminology: Giữ “người Do Thái” trong chính văn phản ánh οἱ Ἰουδαῖοι; chú thích cần nêu rõ khả năng quy chiếu hẹp theo văn cảnh mà không khẳng định quá mức hay quy kết cho toàn thể dân Do Thái. “Giê-su” phù hợp tên riêng hiện đại và không thêm tước hiệu không có trong nguồn.
  issues:
  - severity: medium
    issue: Tên “Đức Chúa Jêsus” thêm danh hiệu không có trong tiếng Hy Lạp.
    rationale: Nguồn chỉ có ὁ Ἰησοῦς (“Giê-su”). “Đức Chúa” tương ứng với một tước hiệu như κύριος, vốn không xuất hiện trong câu này; vì vậy đây là bổ sung vượt quá nguồn.
  - severity: low
    issue: “Jêsus” là lối chính tả cũ/đặc thù, không phù hợp nhất với tiếng Việt chuẩn hiện đại.
    rationale: “Giê-su” là dạng phiên âm hiện hành, dễ hiểu rộng rãi và tránh gắn bản dịch với một truyền thống chính tả giáo phái cụ thể.
  - severity: low
    issue: 'Câu chú thích có diễn đạt không tự nhiên: “chỉ cụ thể hơn đến”.'
    rationale: Nên thay bằng cấu trúc tự nhiên hơn như “thường chỉ cụ thể giới chức... hoặc nhóm chống đối...” mà vẫn duy trì tính dè dặt về quy chiếu.
