id: JHN.7.1
reference: John 7:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ ⸂μετὰ ταῦτα περιεπάτει ὁ Ἰησοῦς⸃ ἐν τῇ Γαλιλαίᾳ, οὐ γὰρ ἤθελεν ἐν τῇ Ἰουδαίᾳ περιπατεῖν, ὅτι ἐζήτουν αὐτὸν οἱ Ἰουδαῖοι ἀποκτεῖναι.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/001.yaml
  text: And after these things Jesus was walking in Galilee[a], for he did not want to walk in Judea, because the Jews were seeking to kill him.
translation:
  language: vi
  text: Sau những việc ấy, Giê-su đi lại trong miền Ga-li-lê[a], vì Người không muốn đi lại trong miền Giu-đê, bởi người Do Thái đang tìm cách giết Người.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “người Giu-đê” hoặc, theo văn cảnh, “giới lãnh đạo Do Thái”. Trong sách Giăng, cụm từ “người Do Thái” thường chỉ cụ thể giới chức Do Thái ở Giu-đê hoặc nhóm chống đối trong trình thuật, chứ không phải toàn thể dân Do Thái.
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ ταῦτα
  choice: Sau những việc ấy
  rationale: Giữ số nhiều của đại từ chỉ định và mối nối tường thuật đặc trưng của Giăng, đồng thời vẫn tự nhiên trong tiếng Việt.
- source_word: περιεπάτει / περιπατεῖν
  choice: đi lại
  rationale: Diễn đạt hoạt động di chuyển tiếp diễn trong một vùng và giữ sự lặp lại của cùng một động từ Hy Lạp ở hai vế; tự nhiên hơn cách dịch sát chữ “bước đi” trong ngữ cảnh địa lý.
- source_word: ἐν τῇ Γαλιλαίᾳ / ἐν τῇ Ἰουδαίᾳ
  choice: trong miền Ga-li-lê / trong miền Giu-đê
  rationale: Cách dịch định vị rõ ràng; thêm “miền” giúp địa danh vùng lãnh thổ tự nhiên với độc giả Việt mà không mở rộng phạm vi thành “khắp”.
- source_word: οὐ γὰρ ἤθελεν
  choice: Ngài không muốn
  rationale: Thể hiện ý muốn, không hàm ý bất lực; quan hệ giải thích của γάρ được truyền đạt tự nhiên qua cấu trúc câu kế tiếp.
- source_word: ἐζήτουν
  choice: đang tìm cách
  rationale: Thể chưa hoàn thành chỉ ý định thù nghịch đang tiếp diễn; “tìm cách” kết hợp tự nhiên với động từ mục đích “giết”.
- source_word: οἱ Ἰουδαῖοι
  choice: người Do Thái
  rationale: Giữ cách gọi gần với hình thức nguồn, đồng thời dùng chú thích để nêu phạm vi quy chiếu có thể hẹp hơn trong văn cảnh Giăng.
- source_word: ἀποκτεῖναι
  choice: giết Ngài
  rationale: Trực tiếp, rõ nghĩa và tương ứng tự nhiên với động từ nguyên mẫu chỉ mục đích trong tiếng Hy Lạp.
theological_decisions:
- issue: Phạm vi quy chiếu của οἱ Ἰουδαῖοι trong sách Giăng
  choice: Giữ “người Do Thái” trong chính văn và chú thích rằng ở đây có thể chỉ người Giu-đê hoặc giới lãnh đạo Do Thái chống đối Đức Chúa Jêsus.
  alternative: Dịch ngay trong chính văn là “giới lãnh đạo Do Thái” hoặc “người Giu-đê”.
  rationale: Cách này bảo tồn sự khái quát và độ mơ hồ của cụm từ Hy Lạp, nhưng ngăn cách hiểu sai thành lời quy kết cho toàn thể dân Do Thái.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Jêsus” và đại từ tôn kính “Ngài”; giữ các địa danh theo lối phiên âm quen thuộc. Dấu chú thích [a] được đặt ngay sau cụm từ mà chú thích giải nghĩa.
