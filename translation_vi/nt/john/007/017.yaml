  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐάν τις θέλῃ τὸ θέλημα αὐτοῦ ποιεῖν, γνώσεται περὶ τῆς διδαχῆς πότερον ἐκ τοῦ θεοῦ ἐστιν ἢ ἐγὼ ἀπ’ ἐμαυτοῦ λαλῶ.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/017.yaml
  text: If anyone wants to do his will[a], he will know about the teaching, whether it is from God or whether I am speaking from myself.
translation:
  language: vi
  text: Nếu ai muốn làm theo ý muốn của Ngài, người ấy sẽ biết giáo huấn này có phải từ Đức Chúa Trời hay là tôi tự mình nói.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “tôi nói theo ý riêng mình” hoặc “tôi nói theo thẩm quyền riêng của mình”. Tiếng Hy Lạp theo nghĩa đen là “từ chính mình”.'
    reason: Nêu các cách hiểu tự nhiên của cụm từ chỉ nguồn gốc ἀπ’ ἐμαυτοῦ mà không thu hẹp nghĩa trong chính văn.
lexical_decisions:
- source_word: ἐάν τις θέλῃ
  choice: Nếu ai muốn
  rationale: Cấu trúc ἐάν với động từ giả định nêu một điều kiện tổng quát; “muốn” diễn đạt tự nhiên cả ý muốn và sự sẵn lòng.
- source_word: τὸ θέλημα αὐτοῦ ποιεῖν
  choice: làm theo ý muốn của Ngài
  rationale: ποιεῖν đi với θέλημα có nghĩa là thực hiện ý muốn của một người. Đại từ “Ngài” giữ nguyên hình thức đại từ của tiếng Hy Lạp, trong khi ngữ cảnh cho thấy đối tượng là Đức Chúa Trời.
- source_word: γνώσεται
  choice: người ấy sẽ biết
  rationale: Thì tương lai diễn tả sự nhận biết hoặc phân định sẽ có; lặp lại “người ấy” giúp câu tiếng Việt rõ chủ ngữ mà không giới hạn giới tính.
- source_word: περὶ τῆς διδαχῆς
  choice: giáo huấn ấy
  rationale: διδαχή là sự dạy dỗ hay giáo huấn. “Ấy” quy chiếu tự nhiên đến giáo huấn của Chúa Giê-su đang được bàn đến.
- source_word: πότερον ... ἢ
  choice: là ... hay là
  rationale: Cặp từ này trình bày hai khả năng đối lập; “là ... hay là” giữ rõ sự lựa chọn trong tiếng Việt.
- source_word: ἐκ τοῦ θεοῦ
  choice: từ Đức Chúa Trời
  rationale: ἐκ chỉ nguồn gốc; “từ Đức Chúa Trời” trực tiếp bảo toàn hình ảnh về nguồn xuất phát.
- source_word: ἀπ’ ἐμαυτοῦ
  choice: từ chính mình
  rationale: Cụm từ theo sát nghĩa đen là “từ chính mình”, nhấn mạnh nguồn gốc của lời nói mà không tự động mở rộng thành một tuyên bố cụ thể về thẩm quyền.
- source_word: λαλῶ
  choice: tôi nói
  rationale: Thì hiện tại trong mạch diễn từ được diễn đạt tự nhiên bằng “tôi nói” trong tiếng Việt.
theological_decisions:
- issue: Đối tượng được đại từ αὐτοῦ chỉ đến
  choice: Giữ đại từ “Ngài”, với đối tượng theo ngữ cảnh là Đức Chúa Trời.
  alternative: Dịch rõ thành “ý muốn của Đức Chúa Trời”.
  rationale: Ngữ cảnh trực tiếp hỏi giáo huấn của Chúa Giê-su có đến từ Đức Chúa Trời hay không. Giữ đại từ bảo toàn cách diễn đạt của nguyên văn và không thêm sự minh giải không cần thiết.
- issue: Sắc thái của ἀπ’ ἐμαυτοῦ
  choice: Dịch “từ chính mình” trong chính văn.
  alternative: “tự ý mình” hoặc “dựa vào thẩm quyền riêng của mình”.
  rationale: Nguyên văn trực tiếp nói về nguồn gốc. Cách dịch chính giữ được sự mơ hồ chân thực giữa ý tự mình khởi xướng và ý hành động theo thẩm quyền riêng; các hàm ý được nêu trong chú thích thay vì bị ấn định trong chính văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Giáo huấn” giữ sắc thái nghiêm túc của διδαχή; cấu trúc câu vẫn bảo toàn sự đối chiếu về nguồn gốc giữa Đức Chúa Trời và chính Chúa Giê-su.
