id: JHN.7.18
reference: John 7:18
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ ἀφ’ ἑαυτοῦ λαλῶν τὴν δόξαν τὴν ἰδίαν ζητεῖ· ὁ δὲ ζητῶν τὴν δόξαν τοῦ πέμψαντος αὐτὸν οὗτος ἀληθής ἐστιν καὶ ἀδικία ἐν αὐτῷ οὐκ ἔστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/018.yaml
  text: The one who speaks from himself seeks his own glory[a]; but the one who seeks the glory of the one who sent him, this one is true[c][b], and there is no unrighteousness in him.
translation:
  language: vi
  text: Ai nói từ chính mình thì tìm vinh quang cho chính mình[a]; còn ai tìm vinh quang của Đấng đã sai mình thì người ấy là người chân thật[b], và không có sự bất chính trong người ấy[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “nói theo ý riêng” hoặc “nói theo thẩm quyền riêng”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hay: “đáng tin” hoặc “thành thật”.'
    reason: lexical_alternative
  - marker: c
    text: 'Hay: “sự bất công”, “sự không công chính” hoặc “điều sai trái”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφ’ ἑαυτοῦ
  choice: tự mình
  rationale: Giữ được ý lời nói xuất phát từ chính người ấy, đồng thời trong tiếng Việt tự nhiên cũng có thể gợi nghĩa hành động theo ý hoặc thẩm quyền riêng mà không khẳng định quá mức.
- source_word: λαλῶν
  choice: nói
  rationale: Phân từ hiện tại dùng như danh từ chỉ người; “người nào… nói” diễn đạt tự nhiên một nhận định khái quát.
- source_word: δόξαν
  choice: vinh quang
  rationale: Là cách dịch quen thuộc của δόξα trong Giăng và giữ được chiều kích thần học, dù trong ngữ cảnh cũng bao hàm danh dự và sự tôn cao.
- source_word: τὴν ἰδίαν
  choice: cho chính mình
  rationale: Diễn đạt rõ đối tượng hưởng vinh quang và duy trì sự tương phản với vinh quang dành cho Đấng sai phái.
- source_word: ζητεῖ
  choice: tìm
  rationale: Giữ phép lặp của động từ ζητέω trong hai vế và sát nghĩa căn bản của từ.
- source_word: τοῦ πέμψαντος αὐτὸν
  choice: cho Đấng đã sai mình
  rationale: “Đấng” phù hợp với đối tượng sai phái là Đức Chúa Trời trong ngữ cảnh, còn “đã sai mình” giữ quan hệ sai phái và tránh lặp đại từ khó nghe trong tiếng Việt.
- source_word: οὗτος
  choice: người ấy
  rationale: Giữ sắc thái chỉ định và nhấn mạnh của οὗτος nhưng vẫn tự nhiên trong tiếng Việt.
- source_word: ἀληθής
  choice: chân thật
  rationale: Có thể chỉ một người đáng tin, thật thà hoặc đích thực; “chân thật” giữ độ rộng tốt hơn “thành thật”.
- source_word: ἀδικία
  choice: điều bất chính
  rationale: Bao quát sự không công chính, bất công hoặc sai trái về đạo đức, đồng thời tự nhiên hơn danh từ trừu tượng nặng nề trong câu tiếng Việt.
- source_word: ἐν αὐτῷ οὐκ ἔστιν
  choice: trong người ấy không có
  rationale: Bảo tồn hình thức diễn đạt nội tại của nguyên văn thay vì giản lược thành lời phán đoán chung rằng người ấy không làm sai.
theological_decisions:
- issue: Sự tương phản giữa nói ἀφ’ ἑαυτοῦ và tìm vinh quang của Đấng sai phái
  choice: Dịch “tự mình nói” để giữ ý lời nói xuất phát từ chính mình và gắn với mục tiêu tự tôn vinh.
  alternative: “nói theo thẩm quyền riêng” hoặc “tự ý nói”
  rationale: Ngữ cảnh bàn về nguồn gốc và mục tiêu của sự dạy dỗ. Bản dịch không biến hàm ý về thẩm quyền thành một khẳng định kỹ thuật mà nguyên văn không nói minh nhiên.
- issue: Phạm vi ý nghĩa của ἀληθής
  choice: chân thật
  alternative: thành thật; đáng tin; đích thực
  rationale: “Chân thật” bảo tồn sự căng nghĩa giữa tính trung thực, độ đáng tin và tính đích thực trong văn phong Giăng.
- issue: Phạm vi ý nghĩa của ἀδικία
  choice: điều bất chính
  alternative: sự bất công; sự không công chính; điều sai trái
  rationale: Cụm từ được giữ đủ rộng để chỉ tình trạng trái với sự công chính, không thu hẹp chỉ còn bất công xã hội hoặc một hành vi sai phạm riêng lẻ.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng cấu trúc song song “người nào… còn người…” để phản ánh hai vế Hy Lạp; giữ các từ chủ chốt “vinh quang”, “sai” và “trong người ấy” nhằm bảo tồn sắc thái của văn bản Giăng.
