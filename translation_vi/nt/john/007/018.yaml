  - severity: high
    issue: “tìm vinh quang cho Đấng đã sai mình” dịch sai quan hệ sở hữu trong τὴν δόξαν τοῦ πέμψαντος αὐτόν.
    rationale: Nguyên văn là “tìm vinh quang của Đấng đã sai mình,” không chỉ nói rằng người ấy tìm vinh quang nhằm đem lại cho Đấng đó.
  - severity: low
