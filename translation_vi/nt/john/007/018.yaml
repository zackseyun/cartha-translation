  source_fidelity: 'Cần sửa hai điểm: “tự mình nói” không diễn đạt rõ ἀφ’ ἑαυτοῦ là nói từ chính mình/nguồn riêng mình; và “tìm vinh quang cho Đấng đã sai mình” chuyển sở hữu cách τοῦ πέμψαντος αὐτόν thành mục đích từ “cho”. Nguyên văn nói người ấy tìm vinh quang của Đấng đã sai mình.'
  naturalness: Bản sửa dùng cấu trúc song song “Ai...; còn ai...” tự nhiên trong tiếng Việt hiện đại. “Từ chính mình” hơi sát chữ nhưng rõ nghĩa hơn “tự mình nói” (có thể bị hiểu là nói một mình).
  terminology: Giữ “vinh quang” cho δόξα và “Đấng đã sai mình” cho τοῦ πέμψαντος αὐτόν. “Sự bất chính” biểu đạt ἀδικία như một phẩm chất/hiện trạng đạo đức, phù hợp với cấu trúc phủ định hiện hữu của câu.
  issues:
