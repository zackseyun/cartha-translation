  rationale: Bản sửa khôi phục ý “từ chính mình” của ἀφ’ ἑαυτοῦ và, đặc biệt, sở hữu cách “vinh quang của Đấng đã sai mình.” Các thuật ngữ thần học chủ đạo và tính khái quát của nguyên văn được duy trì; không thêm diễn giải về thẩm quyền hay căn tính của Đấng sai phái.
