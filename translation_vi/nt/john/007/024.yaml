  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: μὴ κρίνετε κατ’ ὄψιν, ἀλλὰ τὴν δικαίαν κρίσιν ⸀κρίνετε.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/024.yaml
  text: Do not judge according to appearance[a], but judge with righteous judgment.
translation:
  language: vi
  text: Đừng xét đoán theo bề ngoài[a], nhưng hãy xét đoán một cách công chính.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Đừng xét đoán dựa vào vẻ bề ngoài, nhưng hãy xét đoán một cách công bằng.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ κρίνετε
  choice: Đừng xét đoán
  rationale: Mệnh lệnh hiện tại đi với μή mang ý cấm đoán. “Đừng xét đoán” ngắn gọn, tự nhiên và không áp đặt sắc thái thể như “hãy thôi xét đoán”.
- source_word: κατ’ ὄψιν
  choice: theo bề ngoài
  rationale: Cụm từ chỉ việc căn cứ vào điều hiện ra bên ngoài hay ấn tượng bề mặt; “theo bề ngoài” là cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: ἀλλὰ
  choice: nhưng
  rationale: Giữ rõ sự tương phản mạnh giữa cách xét đoán bị cấm và cách xét đoán được truyền phải làm.
- source_word: τὴν δικαίαν κρίσιν
  choice: cách công chính
  rationale: Trong kết cấu với động từ κρίνετε, cụm đối cách này diễn tả phẩm chất của sự phán xét. “Xét đoán cách công chính” tự nhiên hơn lối dịch sát chữ “xét đoán sự xét đoán công chính”, đồng thời giữ nội dung luân lý của δικαίαν.
- source_word: κρίνετε
  choice: hãy xét đoán
  rationale: Lặp lại “xét đoán” để bảo toàn phép đối song song của nguyên văn, nơi cùng một động từ xuất hiện trong cả hai vế.
theological_decisions:
- issue: Cách dịch δικαίαν trong ngữ cảnh đạo đức–pháp lý
  choice: công chính
  alternative: công bằng; đúng đắn
  rationale: “Công chính” giữ được cả chiều kích đạo đức lẫn tính chính đáng của δικαίαν, không thu hẹp nghĩa vào sự công bằng về thủ tục và cũng không đưa thêm một lập trường hệ phái.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Hai lần dùng “xét đoán” bảo toàn tính song song của câu Hy Lạp; “bề ngoài” diễn đạt thành ngữ κατ’ ὄψιν, còn “cách công chính” tránh lối dịch đối cách quá cứng trong tiếng Việt.
