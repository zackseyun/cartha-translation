id: JHN.7.28
reference: John 7:28
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἔκραξεν οὖν ἐν τῷ ἱερῷ διδάσκων ὁ Ἰησοῦς καὶ λέγων· Κἀμὲ οἴδατε καὶ οἴδατε πόθεν εἰμί· καὶ ἀπ’ ἐμαυτοῦ οὐκ ἐλήλυθα, ἀλλ’ ἔστιν ἀληθινὸς ὁ πέμψας με, ὃν ὑμεῖς οὐκ οἴδατε·
base_translation:
  language: en
  yaml_path: translation/nt/john/007/028.yaml
  text: So Jesus cried out in the temple[a], teaching and saying, “You know me, and you know where I am from. And I have not come from myself, but the one who sent me is true[c][b], whom you do not know.”
translation:
  language: vi
  text: 'Vì thế, khi đang giảng dạy trong đền thờ, Đức Giê-su lớn tiếng nói: “Các ông biết tôi và biết tôi từ đâu đến.[a] Tôi không tự mình đến; Đấng sai tôi là chân thật,[c] Đấng mà các ông không biết.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Câu này cũng có thể được nghe như một lời mỉa mai hoặc thách thức: “Các ông biết tôi và biết tôi từ đâu đến sao?” Tuy nhiên, câu Hy Lạp có hình thức trần thuật.'
    reason: alternative_reading
  - marker: c
    text: “Chân thật” cũng có thể mang nghĩa “thật” hoặc “đích thực” trong cách dùng của Tin Mừng Giăng.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔκραξεν
  choice: lớn tiếng nói
  rationale: Diễn đạt một lời nói công khai, vang lớn mà không gợi ý rằng Đức Giê-su kêu la vì đau đớn.
- source_word: ἐν τῷ ἱερῷ
  choice: trong đền thờ
  rationale: ἱερόν chỉ toàn bộ khuôn viên đền thờ; cách dịch này tự nhiên và quen thuộc trong tiếng Việt.
- source_word: διδάσκων ... καὶ λέγων
  choice: đang giảng dạy ... thì lớn tiếng nói
  rationale: Giữ bối cảnh hành động giảng dạy đang diễn ra, đồng thời chuyển cấu trúc phân từ Hy Lạp sang câu tiếng Việt tự nhiên.
- source_word: Κἀμὲ οἴδατε καὶ οἴδατε πόθεν εἰμί
  choice: Các ông biết tôi và biết tôi từ đâu đến
  rationale: Giữ dạng trần thuật và sự lặp lại của động từ “biết”, không tự ý biến lời này thành câu hỏi tu từ hay giải nghĩa sắc thái mỉa mai.
- source_word: ἀπ’ ἐμαυτοῦ
  choice: không tự mình mà đến
  rationale: Diễn đạt nguồn gốc hoặc sáng kiến không xuất phát từ chính Đức Giê-su, đồng thời vẫn giữ được chiều rộng ý nghĩa của nguyên văn.
- source_word: οὐκ ἐλήλυθα
  choice: không ... mà đến
  rationale: Trong tiếng Việt, dạng này tự nhiên và vẫn diễn tả việc Đức Giê-su đã đến cùng sứ mạng hiện tại.
- source_word: ἀληθινὸς
  choice: chân thật
  rationale: Giữ trường nghĩa “thật, đích thực, đáng tin” của từ này trong văn phong Giăng mà không thu hẹp vào một nét nghĩa duy nhất.
- source_word: ὁ πέμψας με
  choice: Đấng sai tôi
  rationale: Giữ nguyên lối mô tả bằng quan hệ và hành động của bản văn, không thêm danh xưng “Cha” dù ngữ cảnh rộng hơn có thể xác định như vậy.
- source_word: ὃν ὑμεῖς οὐκ οἴδατε
  choice: Đấng mà các ông không biết
  rationale: Giữ lời khẳng định trực tiếp về việc những người nghe không biết Đấng đã sai Đức Giê-su.
theological_decisions:
- issue: Lời “Các ông biết tôi và biết tôi từ đâu đến” là lời khẳng định hay câu hỏi mang tính mỉa mai
  choice: Giữ dưới dạng lời khẳng định như cấu trúc Hy Lạp
  alternative: “Các ông biết tôi và biết tôi từ đâu đến sao?”
  rationale: Ngữ cảnh có thể khiến câu nói được nghe như lời thách thức hoặc mỉa mai, nhưng nguyên văn có hình thức trần thuật. Bản dịch chính không quyết định thay người đọc sắc thái tu từ ấy.
- issue: Ý nghĩa nguồn gốc của Đức Giê-su
  choice: Dùng “từ đâu đến” và “không tự mình mà đến” để giữ cả bình diện nguồn gốc được người ta tưởng là biết lẫn sứ mạng sâu xa hơn
  alternative: Giải thích rõ là nguồn gốc địa lý hoặc nguồn gốc từ trời
  rationale: Tin Mừng Giăng thường đặt nhiều tầng nghĩa cạnh nhau. Nguyên văn tại đây không cho phép thu hẹp câu nói chỉ vào địa lý, cũng không trực tiếp thêm cụm “từ trời”.
- issue: Danh tính của “Đấng sai tôi”
  choice: Không thêm “Đức Chúa Cha” vào câu chính
  alternative: “Đức Chúa Cha, Đấng sai tôi”
  rationale: Nguyên văn dùng mô tả “Đấng sai tôi” chứ không nêu trực tiếp danh xưng. Cách dịch giữ nguyên mức độ minh thị của bản văn.
- issue: Nghĩa của ἀληθινός khi nói về Đấng sai Đức Giê-su
  choice: “chân thật”, với chú thích về nét nghĩa “thật, đích thực”
  alternative: “đích thực” hoặc “thật”
  rationale: “Chân thật” trang trọng và dễ hiểu, nhưng chú thích cần bảo tồn khả năng từ này nhấn mạnh tính thực hữu hoặc đích thực, chứ không chỉ sự thành thật trong lời nói.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “Đức Giê-su”, “Đấng” và đại từ “các ông” phù hợp với lời nói công khai hướng đến nhóm người đang tranh luận; tránh bổ sung thuật ngữ giáo phái hoặc giải thích thần học không có trong câu Hy Lạp.
