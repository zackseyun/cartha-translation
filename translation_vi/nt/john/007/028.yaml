revisions:
- from: 'Vì vậy, Đức Giê-su đang giảng dạy trong đền thờ thì lớn tiếng nói: “Các ông biết tôi và biết tôi từ đâu đến.[a] Nhưng tôi không tự mình mà đến[b]; Đấng sai tôi là chân thật[c], Đấng mà các ông không biết.”'
  to: 'Vì thế, khi đang giảng dạy trong đền thờ, Đức Giê-su lớn tiếng nói: “Các ông biết tôi và biết tôi từ đâu đến.[a] Tôi không tự mình đến; Đấng sai tôi là chân thật,[c] Đấng mà các ông không biết.”'
  rationale: Sửa câu chính để loại bỏ liên từ đối lập không có trong nguyên văn và thay cụm diễn đạt gượng bằng “Tôi không tự mình đến.” Đồng thời chỉnh trật tự mệnh đề mở đầu cho tự nhiên hơn. Các chú thích giữ nguyên nội dung; đánh dấu b được giữ trong bộ chú thích vì cung cấp lựa chọn từ vựng hữu ích, dù không cần gắn vào câu chính khi không có một vị trí neo phù hợp ngoài cụm đã được dịch trực tiếp.
