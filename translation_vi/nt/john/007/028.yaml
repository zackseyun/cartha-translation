  source_fidelity: 'Bản dịch nhìn chung bám sát SBLGNT: giữ được tiếng kêu lớn công khai, bối cảnh giảng dạy trong khuôn viên đền thờ, hình thức trần thuật của lời nói, sự lặp lại của “biết,” và không thêm “Đức Chúa Cha.” Tuy nhiên, “nhưng tôi không tự mình mà đến” thiếu tự nhiên và có cấu trúc đối lập dễ gây vướng nghĩa. Cần đổi thành “Tôi không tự mình đến” để diễn đạt rõ ἀπ’ ἐμαυτοῦ οὐκ ἐλήλυθα mà không thu hẹp nghĩa vào sáng kiến riêng hoặc nguồn gốc riêng.'
  naturalness: “Khi đang giảng dạy trong đền thờ, Đức Giê-su lớn tiếng nói” tự nhiên hơn cấu trúc “đang giảng dạy ... thì lớn tiếng nói.” “Tôi không tự mình đến” là cách nói chuẩn, rõ và trang trọng trong tiếng Việt hiện đại.
  terminology: “Đức Giê-su,” “đền thờ,” “Đấng sai tôi,” và “chân thật” phù hợp văn phong Kinh Thánh tiếng Việt hiện đại. “Chân thật” vẫn cần chú thích để không giới hạn ἀληθινός vào nghĩa chỉ sự thành thật; chú thích hiện có đáp ứng điều này.
