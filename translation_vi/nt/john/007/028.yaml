    rationale: Nguyên văn là καὶ ἀπ’ ἐμαυτοῦ οὐκ ἐλήλυθα, nghĩa là “và tôi không đến từ/tự mình.” Liên từ καὶ không là “nhưng,” còn mẫu “không tự mình mà đến” trong tiếng Việt đòi một vế đối ứng hoặc khiến câu bị gượng. “Tôi không tự mình đến” giữ được nghĩa và rõ ràng hơn.
