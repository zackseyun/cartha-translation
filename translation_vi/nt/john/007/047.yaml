  rationale: Bản sửa thay một kết hợp từ gượng bằng cách diễn đạt tiếng Việt tự nhiên hơn, đồng thời giữ ý bị động và sắc thái kết quả của động từ hoàn thành πεπλάνησθε. Câu hỏi với “cũng ... sao?” vẫn truyền đạt lực tu từ của μή mà không thêm một khẳng định diễn giải vào bản văn.
