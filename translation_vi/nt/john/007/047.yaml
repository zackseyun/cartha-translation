base_translation:
  language: en
  yaml_path: translation/nt/john/007/047.yaml
  text: So the Pharisees answered them[a], “Have you also been led astray?”
translation:
  language: vi
  text: 'Vì vậy, người Pha-ri-si đáp lại họ: “Cả các anh cũng đã bị dẫn vào lầm lạc sao?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Cả các anh cũng đã bị lừa dối sao?” Động từ Hy Lạp có thể chỉ việc bị dẫn vào sai lầm hoặc bị lừa dối.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθησαν
  choice: đáp lời
  rationale: Diễn đạt tự nhiên động từ tường thuật lời đáp, đồng thời phù hợp với bổ ngữ gián tiếp αὐτοῖς.
- source_word: οὖν
  choice: Vì thế
  rationale: Giữ quan hệ hệ quả với diễn biến trước đó mà vẫn tự nhiên trong văn kể tiếng Việt.
- source_word: αὐτοῖς
  choice: họ
  rationale: Đại từ số nhiều chỉ những người đã được sai đi và đang đối thoại với nhóm Pha-ri-si.
- source_word: οἱ Φαρισαῖοι
  choice: những người Pha-ri-si
  rationale: Cách gọi rõ ràng, phổ thông cho nhóm người được nêu trong nguyên văn có mạo từ.
- source_word: Μὴ καὶ ὑμεῖς
  choice: Cả các anh cũng ... sao?
  rationale: Cấu trúc hỏi với μή chờ câu trả lời phủ định; “cả... cũng... sao” giữ sắc thái ngạc nhiên, trách móc hướng riêng đến những người nghe.
- source_word: πεπλάνησθε
  choice: bị dẫn lạc đường
  rationale: Giữ dạng hoàn thành bị động và ý bị đưa vào sai lầm, thay vì chỉ mô tả tự mình đi lạc.
theological_decisions:
- issue: Sắc thái tu từ của câu hỏi mở đầu bằng μή
  choice: Dùng câu hỏi “Cả các anh cũng... sao?” để gợi rõ người nói mong câu trả lời phủ định mà không thêm từ khẳng định ngoài nguyên văn.
  alternative: “Chẳng lẽ cả các anh cũng đã bị lừa sao?”
  rationale: Cách chọn giữ sự khinh miệt và kinh ngạc của câu hỏi tu từ, đồng thời không diễn giải quá mức.
- issue: Phạm vi nghĩa của πλανάω
  choice: bị dẫn lạc đường
  alternative: bị lừa dối
  rationale: Nguyên ngữ có thể nói đến việc bị dẫn vào sai lầm hoặc bị lừa; bản chính giữ hình ảnh lạc đường, còn chú thích nêu phương án từ vựng khác.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Các anh” phù hợp với lời cấp trên quở trách những thuộc hạ nam trong ngữ cảnh; câu hỏi giữ sắc thái châm biếm mà không thêm lời giải thích vào bản văn.
