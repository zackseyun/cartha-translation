id: JHN.7.22
reference: John 7:22
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: διὰ τοῦτο Μωϋσῆς δέδωκεν ὑμῖν τὴν περιτομήν— οὐχ ὅτι ἐκ τοῦ Μωϋσέως ἐστὶν ἀλλ’ ἐκ τῶν πατέρων— καὶ ἐν σαββάτῳ περιτέμνετε ἄνθρωπον.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/022.yaml
  text: For this reason Moses has given you circumcision—not that it is from Moses[a], but from the fathers—and on the Sabbath you circumcise a man.
translation:
  language: vi
  text: Vì lý do này, Môi-se đã ban phép cắt bì cho các ông—không phải phép ấy bắt nguồn từ Môi-se, nhưng từ các tổ phụ[a]—và vào ngày Sa-bát, các ông cắt bì cho một người.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “không phải vì phép ấy đến từ Môi-se, nhưng từ các tổ phụ.” Mệnh đề chen vào giải thích rằng phép cắt bì không khởi nguồn từ Môi-se mà từ các tổ phụ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Vì lý do này
  rationale: Giữ lực giải thích/nguyên nhân của cụm từ Hy Lạp và mối liên hệ với lập luận đang tiếp diễn, thay vì dùng một từ kết luận mạnh như “do đó”.
- source_word: Μωϋσῆς
  choice: Môi-se
  rationale: Dùng dạng tên riêng quen thuộc trong tiếng Việt Kinh Thánh.
- source_word: δέδωκεν
  choice: đã ban
  rationale: Thể hoàn thành Hy Lạp chỉ một hành động đã thiết lập và vẫn có hiệu lực đối với người nghe; tiếng Việt diễn đạt tự nhiên bằng “đã ban”, còn hiệu lực hiện tại được ngữ cảnh cho thấy.
- source_word: τὴν περιτομήν
  choice: phép cắt bì
  rationale: Chỉ cả quy định/thực hành giao ước, không chỉ một hành động riêng lẻ; “phép cắt bì” là cách nói rõ và quen thuộc trong tiếng Việt.
- source_word: οὐχ ὅτι ἐκ τοῦ Μωϋσέως ἐστὶν ἀλλ’ ἐκ τῶν πατέρων
  choice: không phải phép ấy bắt nguồn từ Môi-se, nhưng từ các tổ phụ
  rationale: Diễn đạt ἐκ theo nghĩa nguồn gốc và giữ nguyên mệnh đề chen vào nhằm nói rõ rằng phép cắt bì có trước luật Môi-se. “Các tổ phụ” bảo tồn sắc thái Kinh Thánh của οἱ πατέρες.
- source_word: ἐν σαββάτῳ
  choice: vào ngày Sa-bát
  rationale: Dịch tự nhiên cách dùng thời gian ở tặng cách; câu nói về tập quán chung chứ không về một ngày Sa-bát riêng biệt.
- source_word: περιτέμνετε
  choice: các ông vẫn cắt bì
  rationale: Động từ hiện tại ngôi hai số nhiều mô tả tập quán được người nghe chấp nhận. “Vẫn” làm rõ sự tương phản với việc ngày ấy là Sa-bát mà không thay đổi nội dung mệnh đề.
- source_word: ἄνθρωπον
  choice: một người
  rationale: Cách nói tự nhiên trong tiếng Việt; trong ngữ cảnh cắt bì, đối tượng nam đã rõ nên không cần thêm “nam” một cách nặng nề.
theological_decisions:
- issue: Đối tượng được chỉ bằng “các tổ phụ”
  choice: Hiểu là các tổ phụ thời trước Môi-se, đặc biệt các tổ phụ của dân Israel, nên phép cắt bì có trước luật Môi-se.
  alternative: Hiểu rộng hơn là tổ tiên Israel nói chung.
  rationale: Mệnh đề nhấn mạnh nguồn gốc lịch sử trước Môi-se. Bản dịch giữ “các tổ phụ” để không thu hẹp quá mức vào một danh sách nhân vật cụ thể, đồng thời bảo tồn điểm chính của lập luận.
- issue: Quan hệ của διὰ τοῦτο với lập luận
  choice: Dịch “Vì lý do này” như một từ nối giải thích mở đầu câu.
  alternative: Có thể hiểu gần với “Do đó” hoặc nối cụm này chặt hơn với câu trước.
  rationale: Cách dịch giữ được tính nhân quả nhưng không quyết định quá mức cấu trúc diễn ngôn vốn có thể được phân đoạn khác nhau.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dấu gạch ngang làm rõ mệnh đề chen vào. “Các ông” phù hợp với lời trực tiếp ngôi hai số nhiều trong bối cảnh tranh luận; “phép cắt bì” và “các tổ phụ” giữ sắc thái Kinh Thánh mà vẫn tự nhiên trong tiếng Việt.
