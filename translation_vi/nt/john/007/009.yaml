  text: After saying these things, he himself remained in Galilee.
translation:
  language: vi
  text: Sau khi nói những điều ấy, chính Ngài ở lại Ga-li-lê.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταῦτα
  choice: những điều ấy
  rationale: Đại từ chỉ định trung tính số nhiều quy chiếu về những lời vừa nói; cách dịch này giữ được số nhiều và vẫn tự nhiên trong tiếng Việt.
- source_word: δὲ ... εἰπὼν
  choice: Sau khi nói
  rationale: Phân từ bất định quá khứ diễn tả hành động xảy ra trước động từ chính; δέ tạo bước chuyển nhẹ trong mạch kể. Gộp thành “Sau khi nói” diễn đạt tự nhiên quan hệ thời gian mà không nhấn quá mức sắc thái tương phản.
- source_word: αὐτὸς
  choice: chính Đức Chúa Jêsus
  rationale: Đại từ được nêu rõ mang sắc thái nhấn mạnh, đối chiếu hành động của Đức Chúa Jêsus với các em trai/người anh em của Ngài trong ngữ cảnh. Nêu lại chủ thể giúp tiếng Việt biểu đạt rõ sự nhấn mạnh ấy.
- source_word: ἔμεινεν
  choice: vẫn ở lại
  rationale: Động từ μένω trong ngữ cảnh kể chuyện có nghĩa là ở lại; “vẫn” làm rõ sự tiếp tục ở Ga-li-lê mà không gán thêm ý nghĩa thần học.
- source_word: ἐν τῇ Γαλιλαίᾳ
  choice: ở Ga-li-lê
  rationale: Cụm chỉ địa điểm được chuyển ngữ trực tiếp và tự nhiên.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “chính” để bảo toàn sắc thái nhấn mạnh của αὐτός; giữ cách phiên âm địa danh quen thuộc “Ga-li-lê” và danh xưng “Đức Chúa Jêsus” theo văn phong Kinh Thánh Tin Lành tiếng Việt.
