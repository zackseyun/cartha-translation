reference: John 7:3
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἶπον οὖν πρὸς αὐτὸν οἱ ἀδελφοὶ αὐτοῦ· Μετάβηθι ἐντεῦθεν καὶ ὕπαγε εἰς τὴν Ἰουδαίαν, ἵνα καὶ οἱ μαθηταί σου ⸀θεωρήσουσιν ⸂σοῦ τὰ ἔργα⸃ ἃ ποιεῖς·
base_translation:
  language: en
  yaml_path: translation/nt/john/007/003.yaml
  text: So his brothers said to him[a], “Leave here and go to Judea, so that your disciples also may see the works you are doing.”
translation:
  language: vi
  text: 'Vì vậy, anh em của Ngài nói với Ngài: “Hãy rời khỏi đây và đi đến Giu-đê, để các môn đồ của anh cũng thấy[a] những việc anh đang làm.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “sẽ thấy” hoặc “quan sát”. Động từ Hy Lạp có thể nhấn mạnh việc chăm chú nhìn hoặc chứng kiến; dạng tương lai trong mệnh đề chỉ mục đích này cho phép vài cách diễn đạt.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Vì vậy
  rationale: Giữ quan hệ suy luận hoặc tiếp nối với phần trước, đồng thời vẫn tự nhiên trong văn kể hiện đại.
- source_word: ἀδελφοὶ αὐτοῦ
  choice: anh em của Ngài
  rationale: Danh từ số nhiều giống đực chỉ những người nam cùng gia đình với Đức Chúa Jêsus trong ngữ cảnh. “Anh em” giữ được ý thân thuộc mà không tự quyết định họ lớn hay nhỏ tuổi hơn Ngài.
- source_word: Μετάβηθι ἐντεῦθεν
  choice: Hãy rời khỏi đây
  rationale: Diễn đạt trực tiếp mệnh lệnh rời địa điểm hiện tại, tự nhiên và đúng lực của thể mệnh lệnh aorist.
- source_word: ὕπαγε εἰς τὴν Ἰουδαίαν
  choice: đi đến Giu-đê
  rationale: Cách diễn đạt thông dụng cho mệnh lệnh di chuyển đến vùng Giu-đê.
- source_word: ἵνα καὶ
  choice: để ... cũng
  rationale: “Để” nêu mục đích, còn “cũng” bảo toàn ý bổ sung của καί.
- source_word: οἱ μαθηταί σου
  choice: các môn đồ của anh
  rationale: “Môn đồ” giữ mối quan hệ thầy–trò của μαθητής. Đại từ “anh” là lối xưng hô gia đình tự nhiên trong lời thoại tiếng Việt; tuy vậy, nó phần nào cụ thể hóa quan hệ tuổi tác mà tiếng Hy Lạp không nêu rõ.
- source_word: θεωρήσουσιν
  choice: thấy
  rationale: Trong mệnh đề mục đích với ἵνα, động từ tương lai mang sắc thái điều được nhắm tới. “Thấy” tự nhiên trong tiếng Việt, còn khả năng nhấn mạnh việc quan sát được ghi ở chú thích.
- source_word: σοῦ τὰ ἔργα ἃ ποιεῖς
  choice: những việc anh đang làm
  rationale: Diễn đạt tự nhiên sở hữu và hành động đang diễn ra; “những việc” giữ phạm vi rộng của ἔργα mà không thu hẹp thành phép lạ hay dấu lạ.
theological_decisions:
- issue: Đối tượng được gọi là “anh em của Ngài”
  choice: Giữ cách gọi gia đình trực tiếp “anh em của Ngài”.
  alternative: “Bà con của Ngài” hoặc một cách diễn đạt xác định họ là anh em ruột theo nghĩa sinh học cụ thể.
  rationale: Ngữ cảnh Giăng 7:3–5 trình bày họ là những người nam trong gia đình Đức Chúa Jêsus, nhưng câu này không tự nó giải quyết mọi tranh luận về bản chất chính xác của quan hệ họ hàng. Bản dịch không nhập thêm kết luận giáo phái.
- issue: Sắc thái của ἔργα
  choice: “những việc”
  alternative: “các phép lạ” hoặc “các dấu lạ”
  rationale: ἔργα có ý nghĩa thần học rộng trong sách Giăng nhưng tại đây không đồng nhất về mặt từ vựng với “dấu lạ”. “Những việc” bảo toàn độ rộng và sự căng thẳng của văn bản.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Ngài” được dùng trong lời kể để chỉ Đức Chúa Jêsus; trong lời nói trực tiếp giữa những người nam cùng gia đình, “anh” tạo lời thoại tự nhiên nhưng không thể hoàn toàn tránh việc tiếng Việt biểu thị tương quan xã hội rõ hơn đại từ Hy Lạp.
