revisions:
- from: Nhưng một số người trong họ muốn bắt Đức Chúa Jêsus[a], song không ai tra tay trên Ngài.
  to: Nhưng có vài người trong số họ muốn bắt Người, song không ai ra tay bắt Người.
  rationale: Sửa thành ngữ không tự nhiên “tra tay trên Ngài” thành “ra tay bắt Người” để chuyển đạt rõ ý thành ngữ Hy Lạp là hành động khống chế/bắt giữ. Điều chỉnh cách nói về nhóm người và đại từ để câu văn tự nhiên, hiện đại, đồng thời không thêm tước hiệu hoặc nguyên nhân ngoài nguyên văn.
