source:
  edition: SBLGNT
  text: τινὲς δὲ ἤθελον ἐξ αὐτῶν πιάσαι αὐτόν, ἀλλ’ οὐδεὶς ⸀ἐπέβαλεν ἐπ’ αὐτὸν τὰς χεῖρας.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/044.yaml
  text: But some of them wanted to seize him[b][a], yet no one laid hands on him.
translation:
  language: vi
  text: Nhưng có vài người trong số họ muốn bắt Người, song không ai ra tay bắt Người.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τινὲς δὲ
  choice: Nhưng một số người
  rationale: Diễn đạt tự nhiên một nhóm không xác định và giữ sắc thái tương phản của δέ với những phản ứng trước đó trong đám đông.
- source_word: ἐξ αὐτῶν
  choice: trong họ
  rationale: Cho biết những người ấy thuộc chính nhóm vừa được nhắc đến, đồng thời tránh lối diễn đạt nặng nề.
- source_word: ἤθελον
  choice: muốn
  rationale: Thể chưa hoàn thành cho thấy ý định trong quá khứ; “muốn” là cách diễn đạt tự nhiên và không cường điệu hóa khía cạnh động từ.
- source_word: πιάσαι αὐτόν
  choice: bắt Đức Chúa Jêsus
  rationale: Trong ngữ cảnh sách Giăng, πιάζω nói đến việc bắt giữ với ý thù nghịch và có thể hàm ý bắt giam. Dùng danh xưng thay đại từ để câu tiếng Việt rõ chủ thể được nhắc đến.
- source_word: ἀλλ’ οὐδεὶς
  choice: song không ai
  rationale: “Song” thể hiện rõ sự tương phản mạnh giữa ý định và kết quả, trong văn phong trang trọng nhưng vẫn dễ hiểu.
- source_word: ἐπέβαλεν ἐπ’ αὐτὸν τὰς χεῖρας
  choice: tra tay trên Ngài
  rationale: Giữ hình ảnh thành ngữ Hy Lạp về hành động dùng tay khống chế một người; trong ngữ cảnh, cụm từ hàm ý bắt giữ.
theological_decisions:
- issue: Nguyên nhân khiến không ai bắt Đức Chúa Jêsus
  choice: Không bổ sung nguyên nhân
  alternative: Giải thích là do sự bảo vệ hoặc thời điểm do Đức Chúa Trời định
  rationale: Câu Hy Lạp chỉ thuật lại rằng không ai tra tay trên Ngài; nguyên nhân không được nêu ngay trong câu này, nên bản dịch giữ nguyên sự hàm ẩn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Tra tay trên” giữ thành ngữ giàu hình ảnh của nguyên văn; “bắt” trong mệnh đề đầu truyền đạt tự nhiên ý định bắt giữ. Dùng “Đức Chúa Jêsus/Ngài” theo lối xưng gọi kính trọng phổ biến trong tiếng Việt Cơ Đốc.
