  timestamp: '2026-07-17T06:21:42Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp truyền đạt đúng cấu trúc chính: một nhóm trong đám đông muốn bắt Chúa Giê-su, nhưng không ai thực sự làm vậy. Tuy nhiên, “tra tay trên Ngài” không phải là cách diễn đạt tự nhiên hoặc rõ nghĩa trong tiếng Việt hiện đại cho thành ngữ ἐπέβαλεν ... τὰς χεῖρας. “Ra tay bắt Người” diễn đạt rõ hành động khống chế/bắt giữ mà không thêm nguyên nhân.'
  naturalness: “Nhưng một số người trong họ” có thể hiểu được, nhưng “Nhưng có vài người trong số họ” tự nhiên hơn. “Đức Chúa Jêsus” dùng chính tả và lối xưng hô mang tính truyền thống/giáo phái hơn là tiếng Việt chuẩn hiện đại; dùng đại từ “Người” cũng bám sát đại từ αὐτόν của nguyên văn và tránh bổ sung danh xưng.
  terminology: Thay “Jêsus” bằng cách không lặp tên trong câu này, vì nguyên văn dùng đại từ. “Bắt” phù hợp với πιάσαι trong ngữ cảnh; chú thích “tóm lấy” vẫn là một lựa chọn từ vựng hợp lệ. “Người” giữ lối xưng hô kính trọng phổ biến mà không áp đặt danh xưng thần học không có trong câu Hy Lạp.
  issues:
  - severity: medium
    issue: Cụm “tra tay trên Ngài” không tự nhiên và không rõ nghĩa trong tiếng Việt hiện đại.
    rationale: Đây không phải là thành ngữ Việt ngữ thông dụng tương đương với việc đặt tay lên ai để khống chế hoặc bắt giữ. Nó có thể khiến độc giả không hiểu hành động thực tế được nói đến.
  - severity: low
    issue: “Đức Chúa Jêsus” không phù hợp tối ưu với mục tiêu tiếng Việt chuẩn hiện đại và thêm danh xưng thay cho đại từ nguồn.
    rationale: Nguyên văn lặp đại từ αὐτόν; việc dùng “Người” vừa rõ theo ngữ cảnh vừa tránh chính tả “Jêsus” và lối xưng gọi mang dấu ấn truyền thống riêng.
  revised_text: Nhưng có vài người trong số họ muốn bắt Người, song không ai ra tay bắt Người.
