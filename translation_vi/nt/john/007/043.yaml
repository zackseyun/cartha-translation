  text: σχίσμα οὖν ⸂ἐγένετο ἐν τῷ ὄχλῳ⸃ δι’ αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/043.yaml
  text: So there was a division in the crowd because of him.
translation:
  language: vi
  text: Vì vậy, trong đám đông đã xảy ra sự chia rẽ vì Người.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σχίσμα
  choice: chia rẽ
  rationale: Danh từ này chỉ sự phân hóa hoặc rạn nứt giữa những người trong một tập thể. Cách diễn đạt “đám đông chia rẽ” tự nhiên trong tiếng Việt hiện đại và giữ rõ ý xã hội bị phân đôi.
- source_word: οὖν
  choice: Vì vậy
  rationale: Liên từ đánh dấu kết quả phát sinh từ cuộc tranh luận trước đó; “Vì vậy” nối mạch rõ ràng mà không làm ý suy luận trở nên quá nặng.
- source_word: ἐγένετο
  choice: chia rẽ
  rationale: Động từ γίνομαι diễn tả tình trạng bắt đầu xuất hiện. Trong tiếng Việt, ý này được diễn đạt tự nhiên bằng kết cấu “đám đông chia rẽ”, thay vì dịch từng chữ là “đã xảy ra một sự chia rẽ”.
- source_word: ἐν τῷ ὄχλῳ
  choice: đám đông
  rationale: ὄχλος chỉ đoàn người đang tụ họp. Chuyển kết cấu danh từ Hy Lạp sang chủ ngữ “đám đông” tạo câu tiếng Việt gọn và tự nhiên mà không đổi nghĩa.
- source_word: δι’ αὐτόν
  choice: vì Ngài
  rationale: διά với đối cách biểu thị nguyên nhân. “Vì Ngài” truyền đạt trực tiếp rằng chính người được đại từ nói đến là nguyên cớ của sự chia rẽ.
theological_decisions:
- issue: Đối tượng được đại từ αὐτόν chỉ đến
  choice: Ngài, tức là Chúa Giê-su theo văn cảnh
  alternative: ông ấy / người ấy
  rationale: Văn cảnh xác định đại từ chỉ Chúa Giê-su. “Ngài” giữ hình thức đại từ như nguyên văn, không cần đưa tên riêng vào câu và phù hợp văn phong Kinh Thánh trang trọng, dễ hiểu.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng tự nhiên. Cấu trúc được chuyển đổi từ “một sự chia rẽ xảy ra trong đám đông” sang “đám đông chia rẽ” để tránh lối danh từ hóa nặng nề; sắc thái kết quả và nguyên nhân của nguyên văn vẫn được giữ.
