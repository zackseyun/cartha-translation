revisions:
- from: Người tin Ta, như Kinh Thánh đã nói, thì từ lòng[a] người ấy[b] sẽ tuôn chảy những dòng sông nước sống.
  to: Người tin Ta, như Kinh Thánh đã nói, thì từ lòng[a] người ấy[b] sẽ tuôn chảy những dòng sông nước hằng sống.
  rationale: Sửa thuật ngữ “nước sống” thành “nước hằng sống” để tiếng Việt tự nhiên và nhất quán với cách gọi quen thuộc trong Giăng, nhưng không chuyển thành lời giải thích như “nước ban sự sống”. Sửa chú thích từ vựng để phản ánh chính xác các nghĩa đen của κοιλία. Giữ “lòng người ấy” cùng chú thích về tiền ngữ, vì αὐτοῦ có cách giải thích khác nhưng cách hiểu người tin là tiền ngữ gần nhất vẫn được thể hiện mà không loại bỏ phương án thay thế.
