review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch giữ đúng cấu trúc chính: người tin Đức Giê-su, lời chứng của Kinh Thánh, các sông/dòng nước chảy ra từ κοιλία của người ấy, và tính từ “sống” của nước. Cách neo chú thích tại “lòng” và “người ấy” cũng lần lượt tương ứng với hai điểm cần làm rõ là κοιλία và αὐτοῦ.'
  naturalness: “Người tin Ta” và trật tự câu với “thì” đều hiểu được, trang trọng và phù hợp. Tuy nhiên, cụm “những dòng sông nước sống” không tự nhiên trong tiếng Việt Kinh Thánh hiện đại. “Những dòng sông nước hằng sống” là cách diễn đạt thành ngữ, dễ hiểu, đồng thời duy trì hình ảnh và thuật ngữ của văn mạch Giăng.
  terminology: “Ta” phù hợp với lời Đức Giê-su trong văn phong trang trọng. “Lòng” là lựa chọn khả dĩ cho nghĩa hình tượng của κοιλία, miễn chú thích nêu rõ nghĩa đen. Trong chú thích, “dạ” không diễn đạt chính xác lựa chọn nghĩa đen còn lại là “dạ con”; nên sửa thành “bụng” hoặc “dạ con.” “Nước hằng sống” là thuật ngữ Việt ngữ ổn định cho ὕδωρ ζῶν và không giải nghĩa quá mức.
  issues:
  - severity: medium
    issue: Cụm “những dòng sông nước sống” chưa tự nhiên và chưa phải thuật ngữ Việt ngữ quen dùng trong văn mạch Giăng.
    rationale: ὕδατος ζῶντος cần giữ là hình ảnh “living water”. “Nước hằng sống” vừa giữ tính ẩn dụ vừa là cách dùng hiện đại, trang trọng và nhất quán với thuật ngữ Kinh Thánh tiếng Việt.
  - severity: low
    issue: Chú thích a ghi “bụng” hoặc “dạ”, nhưng không nêu rõ nghĩa “dạ con/womb” của κοιλία.
    rationale: Để phản ánh chính xác phạm vi nghĩa đen được nêu trong hồ sơ nguồn mà không áp đặt nghĩa đó vào câu chính, chú thích nên nói “bụng” hoặc “dạ con”, rồi giải thích nghĩa hình tượng trong ngữ cảnh.
