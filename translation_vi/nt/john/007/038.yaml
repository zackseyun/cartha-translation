id: JHN.7.38
reference: John 7:38
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ πιστεύων εἰς ἐμέ, καθὼς εἶπεν ἡ γραφή, ποταμοὶ ἐκ τῆς κοιλίας αὐτοῦ ῥεύσουσιν ὕδατος ζῶντος.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/038.yaml
  text: The one who believes in me[a], just as the Scripture has said[b], rivers of living water will flow from his belly.
translation:
  language: vi
  text: Người tin Ta, như Kinh Thánh đã nói, thì từ lòng[a] người ấy[b] sẽ tuôn chảy những dòng sông nước hằng sống.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tiếng Hy Lạp có nghĩa đen là “bụng” hoặc “dạ con”; tại đây có lẽ chỉ phần sâu kín bên trong con người.
    reason: lexical_alternative
  - marker: b
    text: “Người ấy” có lẽ chỉ người tin; một số người hiểu đại từ này là chỉ Đấng Mê-si-a.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ πιστεύων εἰς ἐμέ
  choice: Người tin Ta
  rationale: Phân từ hiện tại có mạo từ chỉ một người có đặc trưng là tin; cách dịch này giữ dạng số ít và diễn đạt tự nhiên trong tiếng Việt. “Tin Ta” truyền đạt sự tin cậy hướng về Đức Giê-su mà không dịch máy móc giới từ εἰς.
- source_word: καθὼς εἶπεν ἡ γραφή
  choice: như Kinh Thánh đã nói
  rationale: Giữ danh từ số ít ἡ γραφή theo lối nói có thẩm quyền của Giăng; “đã nói” diễn đạt tự nhiên động từ aorist εἶπεν.
- source_word: ποταμοὶ
  choice: những dòng sông
  rationale: Giữ hình ảnh số nhiều và quy mô dồi dào của ποταμοί, thay vì làm nhẹ thành “dòng suối”.
- source_word: ἐκ τῆς κοιλίας αὐτοῦ
  choice: từ lòng người ấy
  rationale: “Lòng” là cách nói tiếng Việt tự nhiên về phần sâu kín bên trong con người, đồng thời vẫn giữ hình ảnh thân thể của κοιλία rõ hơn một lối diễn giải hoàn toàn trừu tượng.
- source_word: ῥεύσουσιν
  choice: sẽ tuôn chảy
  rationale: Diễn đạt thì tương lai và chuyển động của nước; “tuôn chảy” tự nhiên trong tiếng Việt nhưng không nhất thiết hàm ý mạnh quá mức như “phun trào”.
- source_word: ὕδατος ζῶντος
  choice: nước sống
  rationale: Giữ nguyên ẩn dụ giàu ý nghĩa trong văn mạch Giăng, thay vì giải nghĩa thành “nước ban sự sống” hoặc thu hẹp thành “nước chảy”.
theological_decisions:
- issue: Đối tượng mà đại từ αὐτοῦ chỉ về
  choice: “người ấy” được hiểu là người tin
  alternative: Đại từ có thể được hiểu là chỉ về Đấng Mê-si-a/Đức Giê-su
  rationale: Tiền ngữ gần nhất về mặt ngữ pháp là “người tin”, và Giăng 7:39 nói tiếp về Thánh Linh mà những người tin sẽ nhận. Tuy nhiên, vì có cách hiểu Đấng Mê-si-a là nguồn nước, bản dịch không che khuất cách hiểu ấy mà nêu trong chú thích.
- issue: Nghĩa của κοιλία
  choice: lòng
  alternative: bụng; dạ; nơi sâu thẳm bên trong
  rationale: Từ Hy Lạp có nghĩa đen là bụng hoặc dạ con, nhưng tại đây được dùng theo nghĩa hình tượng về phần bên trong con người. “Lòng” vừa tự nhiên vừa giữ được tính hình tượng mà không biến câu thành một mô tả giải phẫu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ta” trong lời Đức Giê-su theo sắc thái trang nghiêm; cấu trúc “thì” giúp câu dài rõ quan hệ cú pháp trong tiếng Việt. Không thêm dấu ngoặc kép quanh nửa sau vì câu Hy Lạp không xác định rõ ranh giới của lời trích Kinh Thánh.
