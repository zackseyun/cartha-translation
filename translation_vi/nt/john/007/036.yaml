source:
  edition: SBLGNT
  text: τίς ἐστιν ⸂ὁ λόγος οὗτος⸃ ὃν εἶπε· Ζητήσετέ με καὶ οὐχ ⸀εὑρήσετε, καὶ ὅπου εἰμὶ ἐγὼ ὑμεῖς οὐ δύνασθε ἐλθεῖν;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/036.yaml
  text: What is this statement that he said[a], ‘You will seek me and will not find me, and where I am[c][b], you are not able to come’?”
translation:
  language: vi
  text: '“Câu nói này của ông ấy có nghĩa gì[a]: ‘Các ông sẽ tìm tôi mà sẽ không tìm thấy tôi, và nơi tôi ở[b], các ông không thể đến được’?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch sát cấu trúc Hy Lạp: “Câu nói này mà ông ấy đã nói là gì?” Từ Hy Lạp λόγος có thể có nghĩa là “lời,” “câu nói,” “lời phát biểu” hoặc “sứ điệp,” tùy ngữ cảnh.'
    reason: lexical_alternative
  - marker: b
    text: Một số bản dịch diễn đạt là “nơi tôi sẽ đi, các ông không thể đến,” nhưng bản Hy Lạp ở đây nói “nơi tôi ở,” giữ lại sự căng thẳng có chủ ý trong cách diễn đạt của Giăng.
    reason: alternative_reading
lexical_decisions:
- source_word: λόγος
  choice: lời
  rationale: Trong ngữ cảnh này, λόγος chỉ nội dung điều Đức Chúa Jêsus vừa nói. “Lời” tự nhiên, trang trọng và có thể bao quát các nghĩa “câu nói” hoặc “lời phát biểu” mà không biến nó thành một từ đơn lẻ.
- source_word: τίς ἐστιν ὁ λόγος οὗτος
  choice: Lời này ông ấy nói có nghĩa gì
  rationale: Cách diễn đạt này truyền đạt câu hỏi về ý nghĩa của lời vừa được nói bằng tiếng Việt tự nhiên. Từ “này” giữ đại từ chỉ định οὗτος, còn chú thích bảo lưu cách dịch sát cấu trúc Hy Lạp hơn.
- source_word: Ζητήσετέ με
  choice: Các ông sẽ tìm tôi
  rationale: “Tìm” diễn đạt trực tiếp ζητέω trong ngữ cảnh tìm kiếm một người. “Các ông” cho thấy chủ thể số nhiều và phù hợp với lời nói hướng đến nhóm người đang đối thoại.
- source_word: οὐχ εὑρήσετε
  choice: mà không tìm thấy
  rationale: Cụm này diễn đạt phủ định tương lai một cách tự nhiên trong tiếng Việt; đối tượng “tôi” đã rõ từ vế trước nên không cần lặp lại.
- source_word: ὅπου εἰμὶ ἐγώ
  choice: nơi tôi ở
  rationale: Bảo lưu thì hiện tại của εἰμί (“tôi ở/là”), không đổi thành “nơi tôi sẽ đi” hoặc “nơi tôi đi đến,” nhờ đó giữ nguyên sự căng thẳng có chủ ý trong lời văn Giăng.
- source_word: οὐ δύνασθε ἐλθεῖν
  choice: các ông không thể đến được
  rationale: “Không thể” phản ánh ý chỉ khả năng của δύνασθε; “đến được” là cách nói tự nhiên trong tiếng Việt và vẫn nhấn mạnh sự bất khả.
theological_decisions:
- issue: 'Thì hiện tại trong lời Đức Chúa Jêsus: ὅπου εἰμὶ ἐγώ'
  choice: nơi tôi ở
  alternative: nơi tôi sẽ đi / nơi tôi đi đến
  rationale: Bản Hy Lạp dùng εἰμί ở thì hiện tại. Giữ “nơi tôi ở” bảo toàn sự căng thẳng thần học trong sách Giăng về nguồn gốc, căn tính và mối liên hệ của Đức Chúa Jêsus với Cha, thay vì giải thích câu này đơn thuần như một điểm đến trong tương lai.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Câu hỏi được diễn đạt theo lối tự nhiên “có nghĩa gì,” còn chú thích [a] cung cấp cấu trúc sát nguyên văn hơn. Đại từ “ông ấy/các ông/tôi” giữ bối cảnh đối thoại mà không thêm sắc thái tôn giáo hệ phái. Toàn bộ lời trích dẫn được giữ thành một câu liên tục, với hai vế nối bằng “và,” đúng cấu trúc Hy Lạp.
