  text: ἀπεκρίθησαν καὶ εἶπαν αὐτῷ· Μὴ καὶ σὺ ἐκ τῆς Γαλιλαίας εἶ; ἐραύνησον καὶ ἴδε ὅτι ⸂ἐκ τῆς Γαλιλαίας προφήτης⸃ οὐκ ⸀ἐγείρεται.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/052.yaml
  text: They answered and said to him[b][a], “Are you also from Galilee? Search and see that no prophet arises from Galilee.”
translation:
  language: vi
  text: 'Họ đáp lại ông: “Chẳng lẽ ông cũng từ Ga-li-lê sao?[a] Hãy tra xét và xem: không một nhà tiên tri nào xuất hiện từ Ga-li-lê.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Câu hỏi Hy Lạp được đặt theo cách chờ câu trả lời phủ định; cũng có thể dịch: “Hẳn ông không phải cũng từ Ga-li-lê, phải không?”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “không một nhà tiên tri nào được dấy lên từ Ga-li-lê,” giữ lại sắc thái có thể hàm ý Đức Chúa Trời dấy các nhà tiên tri lên.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθησαν καὶ εἶπαν αὐτῷ
  choice: Họ đáp lời ông
  rationale: Cụm động từ đôi là công thức kể chuyện phổ biến; tiếng Việt tự nhiên gói ý trong “đáp lời” mà vẫn giữ hành động trả lời trực tiếp với Ni-cô-đem.
- source_word: Μὴ καὶ σὺ ἐκ τῆς Γαλιλαίας εἶ;
  choice: Chẳng lẽ ông cũng từ Ga-li-lê mà ra sao?
  rationale: “Chẳng lẽ” diễn đạt tự nhiên câu hỏi với μή, vốn chờ câu trả lời phủ định, đồng thời chuyển tải giọng khinh miệt và hoài nghi.
- source_word: ἐραύνησον καὶ ἴδε
  choice: Hãy tra xét và sẽ thấy
  rationale: “Tra xét” diễn tả việc chủ động khảo cứu; “sẽ thấy” là cách nối mệnh lệnh-kết quả tự nhiên trong tiếng Việt.
- source_word: προφήτης
  choice: một nhà tiên tri nào
  rationale: Danh từ không có mạo từ mang nghĩa bất định; trong cấu trúc phủ định tiếng Việt, “không một ... nào” diễn đạt rõ lời quả quyết rằng không có bất cứ nhà tiên tri nào.
- source_word: οὐκ ἐγείρεται
  choice: không ... xuất hiện
  rationale: Ở đây ἐγείρεται nói đến việc một nhà tiên tri nổi lên hay xuất hiện. “Xuất hiện” tự nhiên trong tiếng Việt, còn sắc thái có thể được Đức Chúa Trời dấy lên được ghi ở chú thích.
theological_decisions:
- issue: Sắc thái tu từ của câu hỏi phủ định
  choice: “Chẳng lẽ ông cũng từ Ga-li-lê mà ra sao?”
  alternative: “Ông cũng từ Ga-li-lê mà ra à?”
  rationale: Cách chọn chính biểu thị rõ μή chờ câu trả lời phủ định, nhưng không thêm một lời kết luận ngoài văn bản.
- issue: Chủ thể hàm ẩn trong ἐγείρεται
  choice: “xuất hiện”
  alternative: “được dấy lên”
  rationale: Thể trung/động hình thức ở đây có thể chỉ sự nổi lên của một nhà tiên tri, song “được dấy lên” cũng có thể gợi Đức Chúa Trời là tác nhân. Bản chính không quyết định ngầm vấn đề; khả năng kia được giữ trong chú thích.
- issue: Phạm vi của προφήτης không có mạo từ
  choice: “không một nhà tiên tri nào”
  alternative: “Đấng Tiên Tri không ...”
  rationale: Ngữ pháp và lời tranh luận phù hợp nhất với một mệnh đề tổng quát về bất cứ nhà tiên tri nào, chứ không riêng nhân vật cánh chung được gọi là “Đấng Tiên Tri”.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “ông” phù hợp với lời các lãnh đạo nói trực tiếp với Ni-cô-đem; “Ga-li-lê” theo lối phiên âm Kinh Thánh Việt ngữ quen thuộc. Các dấu chú thích đều xuất hiện trong chính văn.
