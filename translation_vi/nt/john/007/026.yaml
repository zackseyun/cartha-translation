id: JHN.7.26
reference: John 7:26
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἴδε παρρησίᾳ λαλεῖ καὶ οὐδὲν αὐτῷ λέγουσιν· μήποτε ἀληθῶς ἔγνωσαν οἱ ἄρχοντες ὅτι οὗτός ⸀ἐστιν ὁ χριστός;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/026.yaml
  text: And look[a], he is speaking openly, and they say nothing to him. Can it be that the rulers truly know that this is the Messiah?
translation:
  language: vi
  text: Kìa, ông ấy đang nói công khai mà họ chẳng nói gì với ông ấy. Chẳng lẽ các nhà lãnh đạo thật sự đã biết rằng người này là Đấng Mê-si sao?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Có lẽ nào các nhà lãnh đạo thật sự đã biết rằng người này là Đấng Mê-si?”'
    reason: μήποτε có thể được diễn đạt như một lời suy đoán dè dặt hoặc một câu hỏi mang sắc thái khó tin; hai cách dịch tiếng Việt nhấn các sắc thái này hơi khác nhau.
lexical_decisions:
- source_word: ἴδε
  choice: Kìa
  rationale: Dùng như một thán từ hướng sự chú ý của người nghe vào điều đang diễn ra; tự nhiên và trang trọng hơn cách dịch sát là “hãy xem” trong ngữ cảnh này.
- source_word: παρρησίᾳ
  choice: công khai
  rationale: Nhấn mạnh việc Đức Giê-su nói giữa công chúng mà không bị ngăn cản; tránh thu hẹp nghĩa thành sự can đảm như “mạnh dạn”.
- source_word: λαλεῖ
  choice: đang nói
  rationale: Thể hiện hành động đang diễn ra mà đám đông trực tiếp quan sát.
- source_word: οὐδὲν αὐτῷ λέγουσιν
  choice: họ chẳng nói gì với ông ấy
  rationale: Giữ quan hệ trực tiếp của đại từ gián tiếp αὐτῷ; không thêm ý “chống lại” vốn chỉ được hàm ý bởi ngữ cảnh.
- source_word: μήποτε
  choice: Chẳng lẽ ... sao?
  rationale: Diễn đạt lời suy đoán đầy ngạc nhiên và hoài nghi trong một câu hỏi tự nhiên bằng tiếng Việt, thay vì biến nó thành một lời phủ định dứt khoát.
- source_word: ἀληθῶς
  choice: thật sự
  rationale: Giữ lực nhấn của trạng từ và phù hợp với văn phong tiếng Việt hiện đại.
- source_word: ἔγνωσαν
  choice: đã biết
  rationale: Giữ nét thể aorist về việc những người lãnh đạo có thể đã đi đến chỗ nhận biết, đồng thời vẫn tự nhiên trong tiếng Việt.
- source_word: οἱ ἄρχοντες
  choice: các nhà lãnh đạo
  rationale: Chỉ giới lãnh đạo có thẩm quyền trong bối cảnh mà không bổ sung một định danh thể chế không có trong nguyên văn.
- source_word: ὅτι οὗτός ἐστιν ὁ χριστός
  choice: rằng người này là Đấng Mê-si
  rationale: Giữ οὗτός như một đại từ chỉ định và dịch χριστός theo chức danh cứu thế trong bối cảnh Do Thái.
theological_decisions:
- issue: Cách dịch ὁ χριστός như một chức danh
  choice: Đấng Mê-si
  alternative: Đấng Christ
  rationale: Trong câu hỏi của đám đông, χριστός là chức danh chỉ Đấng được xức dầu mà họ trông đợi, không phải thành phần mang tính tên riêng; “Đấng Mê-si” bảo toàn bối cảnh Do Thái.
- issue: Sắc thái của câu hỏi với μήποτε
  choice: Chẳng lẽ ... sao?
  alternative: Có lẽ nào ...?
  rationale: Cách dịch chính giữ cả sự kinh ngạc lẫn thái độ chưa tin chắc, nhưng không biến câu hỏi thành sự khẳng định hay phủ định giáo lý.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Ông ấy” phản ánh lời của đám đông về Đức Giê-su mà không tự ý đưa kính ngữ vào đại từ Hy Lạp; “người này” giữ lực chỉ định của οὗτός. Cấu trúc “mà họ chẳng nói gì” làm nổi bật sự tương phản gây kinh ngạc trong ngữ cảnh.
