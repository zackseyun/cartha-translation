  text: ἐγὼ οἶδα αὐτόν, ὅτι παρ’ αὐτοῦ εἰμι κἀκεῖνός με ἀπέστειλεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/029.yaml
  text: I know him[a], because I am from him[b], and he sent me.
translation:
  language: vi
  text: Tôi biết Ngài[a], vì tôi từ Ngài mà đến[b], và Ngài đã sai tôi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Tôi biết rằng tôi từ Ngài mà đến.” Liên từ Hy Lạp có thể giới thiệu nội dung (“rằng”) hoặc lý do (“vì”); ngữ cảnh nghiêng về nghĩa nguyên nhân.'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn có thể dịch sát hơn: “tôi từ Ngài” hoặc “tôi đến từ nơi Ngài hiện diện.” Cụm từ Hy Lạp nhấn mạnh nguồn gốc hoặc xuất xứ.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγὼ
  choice: Tôi
  rationale: Giữ đại từ chủ ngữ được nêu rõ để phản ánh sắc thái nhấn mạnh của lời khẳng định ngôi thứ nhất.
- source_word: οἶδα
  choice: biết
  rationale: οἶδα diễn tả trạng thái hiện tại là biết; hiện tại đơn tự nhiên và phù hợp với sự tương phản trong ngữ cảnh.
- source_word: αὐτόν
  choice: Ngài
  rationale: Đại từ chỉ Đức Chúa Cha trong ngữ cảnh; “Ngài” là cách xưng hô tôn kính, tự nhiên trong tiếng Việt mà không thêm danh xưng giải thích vào chính văn.
- source_word: ὅτι
  choice: vì
  rationale: 'Hiểu liên từ theo nghĩa nguyên nhân: Chúa Giê-su biết Ngài vì có nguồn gốc từ nơi Ngài; chú thích bảo lưu khả năng hiểu theo nghĩa nội dung.'
- source_word: παρ’ αὐτοῦ εἰμι
  choice: tôi từ Ngài mà đến
  rationale: Diễn đạt nguồn gốc/xuất xứ bằng tiếng Việt tự nhiên. Cách nói này không thu hẹp câu thành sự sai phái, vì vế sau riêng biệt nói rằng Ngài đã sai Chúa Giê-su đến.
- source_word: κἀκεῖνός
  choice: và chính Ngài
  rationale: κἀκεῖνος là καί + ἐκεῖνος; “chính Ngài” truyền đạt sắc thái chỉ định/nhấn mạnh tự nhiên hơn “Đấng ấy” trong tiếng Việt.
- source_word: με
  choice: tôi
  rationale: Đại từ làm tân ngữ trực tiếp của ἀπέστειλεν.
- source_word: ἀπέστειλεν
  choice: đã sai tôi đến
  rationale: Thể aorist được diễn đạt bằng “đã”; “sai ... đến” là cách nói tự nhiên, giữ chủ đề sứ mạng của động từ ἀποστέλλω.
theological_decisions:
- issue: Ý nghĩa mối liên hệ của Chúa Giê-su với Đức Chúa Cha trong παρ’ αὐτοῦ εἰμι
  choice: “tôi từ Ngài mà đến” để diễn tả nguồn gốc/xuất xứ mà không giải nghĩa siêu hình quá mức.
  alternative: “tôi thuộc về Ngài”; “tôi ở bên Ngài”; “tôi từ nơi hiện diện của Ngài mà đến”
  rationale: παρά với sở hữu cách có thể chỉ nguồn gốc hay xuất xứ. Bản dịch bảo tồn chiều sâu thần học và phân biệt mệnh đề này với mệnh đề sai phái tiếp theo.
- issue: Chức năng của ὅτι
  choice: 'Hiểu theo nghĩa nguyên nhân: “vì”.'
  alternative: 'Hiểu theo nghĩa nội dung: “rằng”.'
  rationale: Ngữ cảnh thuận hơn cho quan hệ nguyên nhân, nhưng cấu trúc Hy Lạp cho phép cách hiểu nội dung nên được ghi ở chú thích thay vì loại bỏ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” cho đại từ chỉ Đức Chúa Cha; thêm “chính” để thể hiện sắc thái nhấn mạnh của ἐκεῖνος. Cụm “từ Ngài mà đến” tự nhiên hơn “từ Ngài” đứng một mình trong tiếng Việt, đồng thời chú thích bảo lưu hình thức và phạm vi nghĩa của nguyên văn.
