- from: Tôi biết Ngài[a], vì tôi từ Ngài mà đến[b], và chính Ngài đã sai tôi đến.
  to: Tôi biết Ngài[a], vì tôi từ Ngài mà đến[b], và Ngài đã sai tôi.
  rationale: Chỉ sửa mệnh đề cuối từ “và chính Ngài đã sai tôi đến” thành “và Ngài đã sai tôi”. Sửa đổi này loại bỏ ý về đích đến không có trong nguyên văn, đồng thời giữ ý sai phái ở thì quá khứ. Các chú thích giữ được những khả năng cú pháp và ngữ nghĩa thích đáng của ὅτι và παρ’ αὐτοῦ.
