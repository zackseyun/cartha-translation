source:
  edition: SBLGNT
  text: οὐδεὶς μέντοι παρρησίᾳ ἐλάλει περὶ αὐτοῦ διὰ τὸν φόβον τῶν Ἰουδαίων.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/013.yaml
  text: Yet no one was speaking openly about him for fear of the Jews[a].
translation:
  language: vi
  text: Tuy vậy, không ai công khai nói về Ngài vì sợ người Do Thái[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Trong ngữ cảnh này, cũng có thể hiểu cụ thể hơn là “các nhà lãnh đạo Do Thái” hoặc “giới chức Do Thái tại Giu-đê”. Trong sách Giăng, “người Do Thái” đôi khi chỉ người Do Thái nói chung, nhưng ở một số đoạn lại chỉ giới chức tại Giê-ru-sa-lem chống đối Chúa Giê-su.
    reason: alternative_reading
lexical_decisions:
- source_word: οὐδεὶς
  choice: không ai
  rationale: Đại từ phủ định bao quát những người đang bàn luận; cách diễn đạt tự nhiên và chính xác trong tiếng Việt.
- source_word: μέντοι
  choice: Tuy vậy
  rationale: Thể hiện sự tương phản nhẹ với những ý kiến khác nhau về Chúa Giê-su ở câu trước.
- source_word: παρρησίᾳ
  choice: công khai
  rationale: Trong ngữ cảnh này, từ chỉ việc nói thẳng và không che giấu trước công chúng.
- source_word: ἐλάλει
  choice: nói
  rationale: Động từ thì chưa hoàn thành mô tả hoạt động đang diễn ra hoặc lặp lại trong bối cảnh lễ hội; tiếng Việt thường để ngữ cảnh truyền đạt thể tiếp diễn mà không cần thêm 'đang'.
- source_word: περὶ αὐτοῦ
  choice: về Ngài
  rationale: Cách chuyển ngữ tự nhiên của περί với sở hữu cách; 'Ngài' phù hợp văn phong Kinh Thánh trang trọng khi nói về Chúa Giê-su.
- source_word: διὰ τὸν φόβον
  choice: vì sợ
  rationale: Diễn đạt tự nhiên quan hệ nguyên nhân của διά với đối cách, không làm thay đổi đối tượng của nỗi sợ.
- source_word: τῶν Ἰουδαίων
  choice: người Do Thái
  rationale: Giữ phạm vi từ vựng trực tiếp và sự mơ hồ thật sự của Ἰουδαῖοι; chú thích nêu nghĩa hẹp có thể có trong ngữ cảnh.
theological_decisions:
- issue: Đối tượng được gọi là τῶν Ἰουδαίων trong trình thuật Giăng
  choice: Giữ 'người Do Thái' trong chính văn và giải thích phạm vi ngữ cảnh bằng chú thích.
  alternative: các nhà lãnh đạo Do Thái; giới chức Do Thái tại Giu-đê
  rationale: Cách này trung thành với hình thức Hy Lạp, bảo tồn sự linh hoạt trong cách Giăng dùng thuật ngữ, đồng thời giúp tránh cách hiểu sai rằng toàn thể dân Do Thái đều là đối tượng gây sợ hãi.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Thêm 'dám' để diễn đạt tự nhiên hệ quả của nỗi sợ đối với việc không nói công khai, nhưng không biến đổi nội dung mệnh đề; dùng 'Ngài' theo văn phong Kinh Thánh tôn kính.
