  source_fidelity: Bản dịch truyền đạt chính xác câu hỏi tu từ phủ định Οὐ ... δέδωκεν, đối tượng là Môi-se, “luật pháp” xác định, sự tương phản của καί, phủ định toàn diện οὐδεὶς ἐξ ὑμῶν, và câu hỏi về ý định đang diễn tiến “tìm cách giết tôi”. “Tuân giữ luật pháp” là cách chuyển ngữ tự nhiên, đúng nghĩa ngữ cảnh của ποιεῖ τὸν νόμον.
