  terminology: '“Môi-se” và “luật pháp” phù hợp cách dùng Kinh Thánh tiếng Việt phổ biến; ngữ cảnh tự nó xác định đây là luật Môi-se mà không cần thêm “Môi-se” vào sau “luật pháp”. Chú thích “Sát chữ: ‘làm luật pháp’” nêu đúng phương án sát nghĩa của ποιεῖ.'
