id: JHN.7.19
reference: John 7:19
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Οὐ Μωϋσῆς ⸀δέδωκεν ὑμῖν τὸν νόμον; καὶ οὐδεὶς ἐξ ὑμῶν ποιεῖ τὸν νόμον. τί με ζητεῖτε ἀποκτεῖναι;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/019.yaml
  text: Did not Moses give you the law? Yet none of you keeps the law[b][a]. Why are you seeking to kill me?
translation:
  language: vi
  text: Chẳng phải Môi-se đã ban luật pháp cho các ông sao? Thế mà không một ai trong các ông tuân giữ luật pháp.[a] Tại sao các ông tìm cách giết tôi?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát chữ: “làm luật pháp”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐ ... δέδωκεν
  choice: Chẳng phải ... đã ban ... sao?
  rationale: Cấu trúc câu hỏi với οὐ hướng tới câu trả lời khẳng định. Thì hoàn thành Hy Lạp diễn tả việc ban luật đã xảy ra và còn hiệu lực; cách nói tiếng Việt tự nhiên ở đây là “đã ban”.
- source_word: Μωϋσῆς
  choice: Môi-se
  rationale: Dùng dạng phiên âm tên riêng quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
- source_word: τὸν νόμον
  choice: luật pháp
  rationale: Trong ngữ cảnh có Môi-se, cụm từ chỉ luật pháp Môi-se, tức Torah. “Luật pháp” là cách gọi rõ ràng, trang trọng và quen thuộc trong tiếng Việt.
- source_word: καὶ
  choice: Thế mà
  rationale: καί về hình thức thường là “và”, nhưng tại đây tạo thế tương phản giữa việc nhận luật pháp và việc không tuân giữ; “thế mà” diễn đạt tự nhiên lực đối lập ấy.
- source_word: οὐδεὶς ἐξ ὑμῶν
  choice: không một ai trong các ông
  rationale: Giữ sắc thái phủ định toàn diện và nhấn mạnh của nguyên văn.
- source_word: ποιεῖ τὸν νόμον
  choice: tuân giữ luật pháp
  rationale: Nghĩa sát chữ là “làm luật pháp”, nhưng cách nói tự nhiên trong tiếng Việt về việc thực hành và vâng theo luật là “tuân giữ luật pháp”.
- source_word: τί
  choice: Tại sao
  rationale: Trong cấu trúc với động từ “tìm” và động từ nguyên mẫu, τί hỏi về lý do; “Tại sao” là tương đương tự nhiên.
- source_word: ζητεῖτε ἀποκτεῖναι
  choice: các ông tìm cách giết
  rationale: Giữ ý định hoặc nỗ lực đang tiếp diễn của ζητεῖτε mà không làm nhẹ lời cáo buộc trực tiếp “giết” của ἀποκτεῖναι.
theological_decisions:
- issue: Đối tượng quy chiếu của “luật pháp”
  choice: Luật pháp Môi-se được ban cho dân Israel
  alternative: Luật theo nghĩa đạo đức chung
  rationale: Việc nêu đích danh Môi-se cho thấy νόμος ở đây là luật pháp Môi-se/Torah; bản dịch không thêm lời giải thích giáo phái vào chính văn.
- issue: Lực của lời khẳng định “không một ai”
  choice: Giữ nguyên lời cáo buộc tuyệt đối của câu nói
  alternative: Làm nhẹ thành “không phải ai cũng tuân giữ”
  rationale: οὐδεὶς là phủ định toàn diện. Không nên tự ý giảm mức độ căng thẳng thần học và tu từ trong lời của Chúa Giê-su.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “các ông” phù hợp với lời chất vấn trực tiếp một nhóm người trong ngữ cảnh, không thêm sắc thái tôn kính không có trong nguyên văn. Dấu chú thích [a] được đặt ngay sau mệnh đề liên quan.
