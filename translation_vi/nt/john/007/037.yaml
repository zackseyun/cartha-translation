reference: John 7:37
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἐν δὲ τῇ ἐσχάτῃ ἡμέρᾳ τῇ μεγάλῃ τῆς ἑορτῆς εἱστήκει ὁ Ἰησοῦς, καὶ ἔκραξεν λέγων· Ἐάν τις διψᾷ ἐρχέσθω πρός με καὶ πινέτω.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/037.yaml
  text: On the last day[a], the great day of the feast, Jesus stood and cried out, saying, “If anyone is thirsty, let him come to me and drink.”
translation:
  language: vi
  text: 'Vào ngày cuối cùng, là ngày trọng thể của kỳ lễ, Đức Giê-su đứng và lớn tiếng nói: “Nếu ai[a] khát, hãy đến với tôi mà uống.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Từ Hy Lạp ở đây là đại từ bất định số ít, mang nghĩa khái quát: bất cứ người nào.'
    reason: Làm rõ rằng “ai” diễn đạt một chủ thể số ít mang nghĩa bao quát, chứ không giới hạn lời mời vào một nhóm người.
lexical_decisions:
- source_word: Ἐν δὲ τῇ ἐσχάτῃ ἡμέρᾳ
  choice: Vào ngày cuối cùng
  rationale: Ἐν với cách ba chỉ thời điểm; δέ là từ nối nhẹ, không cần dịch thành một từ tương phản riêng trong tiếng Việt. “Ngày cuối cùng” giữ nguyên nghĩa trong bối cảnh kỳ lễ mà không thêm sắc thái cánh chung.
- source_word: τῇ μεγάλῃ τῆς ἑορτῆς
  choice: là ngày trọng thể của kỳ lễ
  rationale: μέγας bổ nghĩa cho “ngày”, nhấn mạnh vị thế đặc biệt của ngày ấy. “Ngày trọng thể” tự nhiên và trang nghiêm trong tiếng Việt, còn “kỳ lễ” diễn đạt ἑορτή rõ ràng.
- source_word: εἱστήκει ὁ Ἰησοῦς
  choice: Đức Giê-su đứng
  rationale: Dạng của ἵστημι diễn tả tư thế đứng. Không thêm “lên”, vì nguyên văn không nhất thiết nói rằng ngài vừa đứng dậy.
- source_word: ἔκραξεν λέγων
  choice: lớn tiếng nói
  rationale: κράζω chỉ lời nói được cất lên mạnh và công khai; “lớn tiếng nói” truyền đạt điều đó tự nhiên, còn phân từ λέγων giới thiệu nội dung lời nói.
- source_word: Ἐάν τις διψᾷ
  choice: Nếu ai khát
  rationale: τις là đại từ bất định số ít mang nghĩa khái quát. “Ai” là cách diễn đạt tự nhiên trong tiếng Việt và không thu hẹp lời mời; “khát” giữ nguyên hình ảnh của nguyên văn.
- source_word: ἐρχέσθω πρός με καὶ πινέτω
  choice: hãy đến với tôi mà uống
  rationale: Hai động từ mệnh lệnh hiện tại tạo thành một lời mời gọi có sức thúc giục. “Hãy… mà…” nối hai hành động tự nhiên trong tiếng Việt và giữ nguyên hướng đến chính Đức Giê-su.
theological_decisions:
- issue: Ý nghĩa ẩn dụ của sự khát và uống
  choice: Giữ nguyên hình ảnh “khát” và “uống” trong chính văn.
  alternative: Diễn giải thành khao khát sự sống, tin hoặc nhận lãnh Thánh Linh.
  rationale: Câu này tự trình bày bằng hình ảnh mở, còn ngữ cảnh kế tiếp phát triển ý nghĩa thần học. Dịch sát hình ảnh tránh giải quyết trước mối liên hệ ấy.
- issue: Cách diễn đạt chủ thể bất định số ít τις
  choice: Dùng “ai”, một đại từ bất định tự nhiên và bao quát trong tiếng Việt.
  alternative: Thêm “người ấy” hoặc một đại từ mang giới tính sau mệnh đề điều kiện.
  rationale: Tiếng Việt có thể giữ nét số ít khái quát mà không cần gán giới tính. Cách dịch này vừa trung thành với cấu trúc bất định vừa tránh lời văn gượng ép.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. Dùng “Đức Giê-su” theo lối gọi kính trọng thông dụng; dùng “tôi” trong lời trực tiếp để phản ánh đại từ με mà không thêm một tước hiệu thần học. Tránh “đứng lên” vì có thể hàm ý một chuyển động không được nêu rõ trong nguyên văn.
