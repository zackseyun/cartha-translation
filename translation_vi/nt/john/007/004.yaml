  rationale: 'Sửa câu đầu để phản ánh trực tiếp hơn cấu trúc và nét nhấn mạnh của tiếng Hy Lạp: người làm việc trong bí mật lại tự mình tìm kiếm sự xuất hiện công khai. Bản sửa tránh thêm tác thể “công chúng”, giữ đối lập “trong chỗ kín / công khai”, và duy trì “thế gian” cho κόσμος.'
