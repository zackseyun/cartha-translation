  yaml_path: translation/nt/john/007/004.yaml
  text: For no one does anything in secret while seeking to be in public view. If you do these things, show yourself to the world.
translation:
  language: vi
  text: Vì không ai làm điều gì trong chỗ kín mà chính mình lại muốn xuất hiện công khai.[a] Nếu anh làm những việc này, hãy tỏ mình ra cho thế gian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “muốn được biết đến công khai.” Cụm từ Hy Lạp nhấn mạnh sự công khai hoặc dễ thấy.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδεὶς γάρ
  choice: Vì không ai
  rationale: Giữ lực giải thích của γάρ nối với câu trước, đồng thời diễn đạt οὐδεὶς bằng lối nói tự nhiên trong tiếng Việt.
- source_word: τι ἐν κρυπτῷ ποιεῖ
  choice: làm điều gì kín đáo
  rationale: Thể hiện đại từ bất định τι và thành ngữ ἐν κρυπτῷ về việc làm trong chỗ kín, không công khai.
- source_word: καὶ ζητεῖ αὐτὸς
  choice: mà lại muốn chính mình
  rationale: “Mà lại” làm rõ thế tương phản theo ngữ cảnh; “chính mình” giữ sắc thái nhấn mạnh của αὐτός mà không biến nó thành một ý phản thân khác.
- source_word: ἐν παρρησίᾳ εἶναι
  choice: được công chúng biết đến
  rationale: Trong ngữ cảnh này, cụm từ nói đến tình trạng công khai hoặc dễ thấy, chứ không chủ yếu nói về sự mạnh dạn trong lời nói. Dạng bị động tự nhiên trong tiếng Việt diễn đạt việc người ấy muốn được biết đến công khai.
- source_word: εἰ ταῦτα ποιεῖς
  choice: Nếu anh làm những việc ấy
  rationale: Giữ nguyên điều kiện ở thì hiện tại. “Anh” phù hợp với lời các em trai nói trực tiếp với Đức Giê-su trong ngữ cảnh.
- source_word: φανέρωσον σεαυτὸν
  choice: hãy tỏ mình ra
  rationale: Giữ mệnh lệnh trực tiếp về việc tự bày tỏ công khai, đồng thời phù hợp với giọng thách thức của người nói.
- source_word: τῷ κόσμῳ
  choice: cho thế gian
  rationale: Giữ thuật ngữ “thế gian” vốn có âm hưởng quan trọng trong sách Giăng, thay vì thu hẹp nghĩa thành “công chúng”.
theological_decisions:
- issue: Ý nghĩa của κόσμος trong văn mạch sách Giăng
  choice: thế gian
  alternative: công chúng
  rationale: Văn mạch trực tiếp liên quan đến sự xuất hiện công khai, nhưng “thế gian” bảo tồn cách dùng và âm hưởng rộng hơn của κόσμος trong sách Giăng mà không giải thích quá mức.
- issue: Sắc thái của ἐν παρρησίᾳ εἶναι
  choice: được công chúng biết đến
  alternative: xuất hiện công khai
  rationale: Cách dịch được chọn giữ trọng tâm vào tình trạng công khai hoặc được biết đến. Chú thích bảo tồn khả năng hiểu thiên về sự hiện diện công khai.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “kín đáo” đối lập với việc được biết đến công khai; giữ “thế gian” để bảo tồn từ ngữ đặc trưng của sách Giăng.
