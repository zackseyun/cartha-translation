review_pass:
  verdict: revise
  source_fidelity: Bản dịch diễn đạt đúng ý đối lập giữa làm trong kín đáo và tìm kiếm sự công khai. Tuy nhiên, “muốn chính mình được công chúng biết đến” dùng cấu trúc bị động và thêm tác thể “công chúng”, trong khi tiếng Hy Lạp nói trực tiếp rằng người ấy tự mình tìm cách ở/ra nơi công khai (ἐν παρρησίᾳ εἶναι).
  naturalness: “Làm điều gì kín đáo” có thể hiểu là làm một việc một cách tế nhị, không nhất thiết là làm trong bí mật. “Làm điều gì trong chỗ kín” và “muốn xuất hiện công khai” tự nhiên hơn, đồng thời giữ rõ nét đối lập của nguyên ngữ.
  terminology: Giữ “thế gian” cho κόσμῳ là phù hợp với cách dùng đặc trưng của Giăng. “Tỏ mình ra” truyền đạt chính xác mệnh lệnh φανέρωσον σεαυτόν. Đại từ “anh” phù hợp với lời nói trực tiếp của các em trai Chúa Giê-su trong văn mạch.
  issues:
  - severity: medium
    issue: Cụm “muốn chính mình được công chúng biết đến” diễn đạt gián tiếp ý của ἐν παρρησίᾳ εἶναι.
    rationale: Cụm Hy Lạp nhấn mạnh việc người ấy tìm sự hiện diện/xuất hiện công khai; bản hiện tại chuyển thành việc được một nhóm người (“công chúng”) biết đến. Dù gần nghĩa trong văn mạch, cách này kém trực tiếp và thêm một sắc thái không có trong câu.
  - severity: low
    issue: “Làm điều gì kín đáo” chưa nêu rõ hoàn cảnh bí mật của ἐν κρυπτῷ.
    rationale: “Kín đáo” trong tiếng Việt hiện đại cũng có thể chỉ thái độ tế nhị. “Trong chỗ kín” giữ rõ hơn ý làm việc không công khai.
  revised_text: Vì không ai làm điều gì trong chỗ kín mà chính mình lại muốn xuất hiện công khai.[a] Nếu anh làm những việc này, hãy tỏ mình ra cho thế gian.
