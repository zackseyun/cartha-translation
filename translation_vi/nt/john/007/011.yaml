  text: οἱ οὖν Ἰουδαῖοι ἐζήτουν αὐτὸν ἐν τῇ ἑορτῇ καὶ ἔλεγον· Ποῦ ἐστιν ἐκεῖνος;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/011.yaml
  text: So the Jews were looking for him at the feast and were saying[a], “Where is that one?”
translation:
  language: vi
  text: 'Vì thế, người Do Thái[a] tìm Đức Chúa Jêsus trong kỳ lễ và nói: “Người ấy ở đâu?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “người Giu-đê”; trong ngữ cảnh lời kể của Giăng, cụm từ này cũng có thể chỉ cụ thể hơn đến giới chức Do Thái tại Giu-đê.
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: Vì thế
  rationale: Giữ lực liên kết và suy diễn từ bối cảnh trước, đồng thời tự nhiên trong văn kể hiện đại.
- source_word: Ἰουδαῖοι
  choice: người Do Thái
  rationale: Đây là nghĩa trực tiếp và không tự ý thu hẹp đối tượng thành giới lãnh đạo; khả năng chỉ người Giu-đê hoặc nhà chức trách Do Thái được ghi chú.
- source_word: ἐζήτουν αὐτόν
  choice: tìm Đức Chúa Jêsus
  rationale: Thì vị hoàn biểu thị hành động đang diễn ra. Tiếng Việt cần nêu lại danh xưng để tránh đại từ liên tiếp thiếu tự nhiên; danh tính đã rõ trong ngữ cảnh.
- source_word: ἐν τῇ ἑορτῇ
  choice: trong kỳ lễ
  rationale: Chỉ kỳ lễ đã được xác định ở ngữ cảnh trước và bao gồm cả địa điểm lẫn thời gian diễn ra sự việc.
- source_word: ἔλεγον
  choice: hỏi nhau
  rationale: Nội dung lời nói là câu hỏi và dạng số nhiều trong ngữ cảnh tự nhiên cho phép diễn đạt việc họ hỏi trong nhóm; cách dịch này truyền đạt diễn tiến lặp lại mà không nặng văn dịch.
- source_word: ἐκεῖνος
  choice: ông ấy
  rationale: Giữ sắc thái chỉ định và phần nào xa cách hơn một đại từ trống không, nhưng vẫn là cách nói tự nhiên trong tiếng Việt hiện đại.
theological_decisions:
- issue: Phạm vi chỉ định của Ἰουδαῖοι trong Giăng
  choice: Dịch “người Do Thái” trong chính văn
  alternative: “người Giu-đê” hoặc, theo ngữ cảnh rộng hơn, “giới chức Do Thái”
  rationale: Câu này tự nó không xác định rõ một nhóm hẹp hơn. Chính văn giữ nghĩa rộng, còn chú thích bảo lưu khả năng địa lý hoặc thẩm quyền trong lối kể của Giăng.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Kỳ lễ” nối với lễ Lều Tạm đã nêu trong ngữ cảnh. Câu thoại dùng “ông ấy” để giữ sắc thái chỉ định của ἐκεῖνος mà không thêm danh từ “người đàn ông” vốn không có trong nguyên văn.
