  text: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτοῖς· Ἓν ἔργον ἐποίησα καὶ πάντες θαυμάζετε.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/021.yaml
  text: Jesus answered and said to them[a], “I did one work[b], and you all marvel.”
translation:
  language: vi
  text: 'Đức Giê-su trả lời họ: “Ta đã làm một việc[a][b], thế mà tất cả các ngươi đều kinh ngạc.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “một công việc” hoặc “một việc làm.” Từ Hy Lạp này có thể chỉ công việc hay hành động; trong sách Giăng, từ ấy thường được dùng cho những việc Đức Giê-su làm.
    reason: lexical_alternative
  - marker: b
    text: Có lẽ câu này nhắc lại việc Đức Giê-su chữa lành người bại trong ngày Sa-bát ở Giăng 5:1–18.
    reason: cross_reference
lexical_decisions:
- source_word: ἀπεκρίθη ... καὶ εἶπεν
  choice: đáp lời
  rationale: Đây là công thức trần thuật chịu ảnh hưởng lối nói Sê-mít. Tiếng Việt tự nhiên không cần lặp cả hai động từ thành “đáp và nói”; “đáp lời” vẫn diễn đạt đầy đủ hành động hồi đáp.
- source_word: Ἓν ἔργον
  choice: một việc
  rationale: “Một” giữ sắc thái nhấn mạnh của Ἓν; “việc” là cách nói tự nhiên, đồng thời có thể chỉ công việc hoặc hành động cụ thể của Đức Chúa Jêsus.
- source_word: ἐποίησα
  choice: Ta đã làm
  rationale: Thể quá khứ được diễn đạt trực tiếp bằng “đã làm”; đại từ “Ta” phù hợp với lời Đức Chúa Jêsus trong văn phong Kinh Thánh trang trọng.
- source_word: πάντες
  choice: tất cả các ngươi
  rationale: Cụm từ làm rõ rằng toàn thể nhóm đang được Đức Chúa Jêsus trực tiếp nói với đều có phản ứng này.
- source_word: θαυμάζετε
  choice: đều kinh ngạc
  rationale: “Kinh ngạc” truyền đạt sự sửng sốt hoặc thắc mắc mà không mặc nhiên xem phản ứng ấy là tích cực; “đều” liên kết tự nhiên với πάντες.
theological_decisions:
- issue: Ý nghĩa theo văn mạch Giăng của ἔργον
  choice: việc
  alternative: công việc; việc làm
  rationale: “Việc” giữ câu tiếng Việt tự nhiên và không thu hẹp ἔργον thành một hành vi thuần túy, trong khi chú thích nêu khả năng liên hệ đến phép chữa lành trong Giăng 5.
- issue: Sự kiện được nhắc đến bởi “một việc”
  choice: Không xác định rõ trong chính câu
  alternative: Ghi thẳng là việc chữa người bại vào ngày Sa-bát
  rationale: Nguyên văn chỉ nói “một việc”; việc liên hệ với Giăng 5 rất có khả năng nhưng vẫn là nhận định theo văn mạch, nên được đặt trong chú thích thay vì thêm vào chính văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Đáp lời” tránh lối dịch cứng “đáp và nói”; “kinh ngạc” giữ được tính không hoàn toàn xác định của phản ứng. Các dấu chú thích [a], [b] đều xuất hiện trong chính văn.
