  text: μή τις ἐκ τῶν ἀρχόντων ἐπίστευσεν εἰς αὐτὸν ἢ ἐκ τῶν Φαρισαίων;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/048.yaml
  text: Has any one of the rulers or of the Pharisees believed in him?[a]
translation:
  language: vi
  text: Có ai trong số các nhà lãnh đạo hay người Pha-ri-si tin Ngài đâu?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Trong tiếng Hy Lạp, câu hỏi mở đầu bằng μή hàm ý người hỏi mong đợi câu trả lời là “không.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μή τις
  choice: Có ai ... đâu?
  rationale: Cấu trúc nghi vấn với μή hướng người nghe đến câu trả lời phủ định. Cách nói “Có ai... đâu?” giữ nguyên hình thức câu hỏi tu từ và truyền đạt tự nhiên sắc thái mong đợi câu trả lời “không” trong tiếng Việt.
- source_word: ἐκ τῶν ἀρχόντων
  choice: trong số các nhà lãnh đạo
  rationale: ἐκ diễn tả một người thuộc nhóm, còn ἄρχοντες ở đây chỉ các nhân vật có thẩm quyền lãnh đạo trong cộng đồng Do Thái. “Trong số các nhà lãnh đạo” rõ nghĩa và không thu hẹp quá mức vào một chức danh cụ thể.
- source_word: ἐπίστευσεν
  choice: tin
  rationale: “Tin” là cách dịch tự nhiên và nhất quán cho πιστεύω trong văn mạch Giăng; tiếng Việt không cần biểu thị riêng thì aorist tại đây.
- source_word: εἰς αὐτόν
  choice: Ngài
  rationale: Sau động từ “tin,” tiếng Việt thường dùng trực tiếp đối tượng là “tin Ngài”; cách này chuyển tải thành ngữ πιστεύω εἰς αὐτόν tự nhiên hơn “tin vào Ngài.” Đại từ kính trọng phù hợp văn phong Kinh Thánh hiện đại.
- source_word: ἢ
  choice: hay
  rationale: “Hay” nối hai nhóm trong câu hỏi một cách tự nhiên, không thêm sắc thái nhấn mạnh ngoài nguyên văn.
- source_word: ἐκ τῶν Φαρισαίων
  choice: trong số ... người Pha-ri-si
  rationale: Cách diễn đạt song song với nhóm các nhà lãnh đạo, đồng thời dùng tên gọi quen thuộc trong tiếng Việt cho Φαρισαῖοι.
theological_decisions:
- issue: Sắc thái tu từ của câu hỏi phủ định
  choice: Giữ câu hỏi tu từ và dùng “đâu” để cho thấy người nói mong đợi câu trả lời “không.”
  alternative: 'Chuyển thành lời phủ định trực tiếp: “Chẳng có nhà lãnh đạo hay người Pha-ri-si nào tin Ngài cả.”'
  rationale: Nguyên văn vẫn là một câu hỏi, dù μή τις báo hiệu câu trả lời được mong đợi là phủ định. Giữ hình thức hỏi bảo toàn giọng điệu khinh miệt của người nói mà không biến hàm ý thành một lời khẳng định tuyệt đối.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. “Có ai... đâu?” là cấu trúc khẩu ngữ chuẩn có sức tu từ rõ ràng, phù hợp lời đối thoại; “nhà lãnh đạo” tránh sắc thái quân chủ hoặc hành chính quá hẹp của “người cai trị.”
