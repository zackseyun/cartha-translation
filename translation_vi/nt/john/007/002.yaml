  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἦν δὲ ἐγγὺς ἡ ἑορτὴ τῶν Ἰουδαίων ἡ σκηνοπηγία.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/002.yaml
  text: The Jewish feast[a], the Feast of Tabernacles, was near.
translation:
  language: vi
  text: Lễ Lều Tạm[a] của người Do Thái đã gần đến.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát nghĩa: “Lễ Dựng Lều.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: không dịch thành một từ riêng
  rationale: Đây là từ nối diễn ngôn nhẹ. Trong câu tiếng Việt này, mạch chuyển ý đã tự nhiên mà không cần thêm “bấy giờ” hay “nhưng”, vốn có thể làm tăng sắc thái thời gian hoặc tương phản không có trong nguyên văn.
- source_word: ἐγγὺς
  choice: đã gần đến
  rationale: Diễn đạt sự gần kề về thời gian bằng tiếng Việt hiện đại, tự nhiên.
- source_word: ἑορτὴ τῶν Ἰουδαίων
  choice: lễ ... của người Do Thái
  rationale: Giữ rõ đây là một kỳ lễ của dân Do Thái; cách diễn đạt này tự nhiên và không hàm ý tranh luận.
- source_word: σκηνοπηγία
  choice: Lễ Lều Tạm
  rationale: Tên gọi quen thuộc trong tiếng Việt của kỳ lễ gắn với việc dựng và ở trong những lều tạm; đồng thời phản ánh khá rõ nghĩa của từ Hy Lạp.
theological_decisions:
- issue: Cách hiểu τῶν Ἰουδαίων trong tên kỳ lễ
  choice: của người Do Thái
  alternative: lễ Do Thái
  rationale: Cụm từ ở đây xác định lễ hội thuộc truyền thống của dân Do Thái, không phải một nhận định mang tính đối kháng. Cách dịch bằng sở hữu ngữ bám sát cấu trúc và rõ nghĩa.
- issue: Tên gọi σκηνοπηγία
  choice: Lễ Lều Tạm
  alternative: Lễ Dựng Lều
  rationale: “Lễ Lều Tạm” là tên gọi dễ nhận biết và trang trọng; chú thích bảo lưu nghĩa sát chữ liên quan đến việc dựng lều.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Trật tự câu được điều chỉnh cho tự nhiên trong tiếng Việt, đưa tên riêng của kỳ lễ lên trước thay vì lặp lại danh từ “lễ” theo cấu trúc đồng vị của tiếng Hy Lạp.
