  source_fidelity: 'Bản dịch truyền đạt đúng ý chính của ἦν ... ἐγγύς: kỳ lễ của người Do Thái, tức Lễ Lều Tạm, đang gần đến. Việc không dịch riêng δὲ là phù hợp với chức năng liên kết nhẹ của từ này. Trật tự tiếng Việt gộp tên lễ với cụm “của người Do Thái” vẫn giữ được nội dung của cấu trúc đồng vị trong nguyên văn.'
