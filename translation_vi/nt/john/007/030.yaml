id: JHN.7.30
reference: John 7:30
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐζήτουν οὖν αὐτὸν πιάσαι, καὶ οὐδεὶς ἐπέβαλεν ἐπ’ αὐτὸν τὴν χεῖρα, ὅτι οὔπω ἐληλύθει ἡ ὥρα αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/030.yaml
  text: So they were seeking to seize him[a], yet no one laid a hand on him[b], because his hour had not yet come.
translation:
  language: vi
  text: Vì vậy, họ tìm cách bắt Ngài[a], nhưng không ai ra tay bắt Ngài, vì giờ của Ngài chưa đến[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “tóm lấy Ngài” hoặc “bắt giữ Ngài”. Động từ Hy Lạp có nghĩa là chộp lấy hay bắt lấy; trong ngữ cảnh này, có lẽ hàm ý bắt giữ.'
    reason: lexical_alternative
  - marker: b
    text: “Giờ của Ngài” là cách nói lặp lại trong sách Giăng về thời điểm đã được ấn định cho sứ mạng của Đức Giê-su, đặc biệt liên quan đến sự chịu khổ, cái chết, sự sống lại và sự được tôn vinh của Ngài.
    reason: cross_reference
lexical_decisions:
- source_word: ἐζήτουν
  choice: họ tìm cách
  rationale: Thì chưa hoàn thành diễn tả một ý định hoặc nỗ lực đang tiếp diễn; “tìm cách” tự nhiên trong tiếng Việt và giữ được sắc thái ấy.
- source_word: οὖν
  choice: Vì vậy
  rationale: Diễn tả sự tiếp nối mang tính suy luận từ lời Đức Giê-su vừa nói trong ngữ cảnh trước.
- source_word: πιάσαι
  choice: bắt
  rationale: Động từ có nghĩa căn bản là chộp lấy hoặc bắt giữ; trong ngữ cảnh này, “bắt” vừa tự nhiên vừa có thể hàm ý bắt giữ mà không thêm sắc thái pháp lý quá cụ thể.
- source_word: ἐπέβαλεν ἐπ’ αὐτὸν τὴν χεῖρα
  choice: ra tay bắt Ngài
  rationale: Đây là một thành ngữ chỉ hành động dùng tay khống chế hoặc bắt giữ. “Ra tay bắt” truyền đạt ý nghĩa trong tiếng Việt hiện đại, tránh cách dịch sát chữ nhưng thiếu tự nhiên hoặc dễ gợi liên tưởng đến nghi thức đặt tay.
- source_word: οὔπω ἐληλύθει
  choice: chưa đến
  rationale: 'Diễn đạt tự nhiên sự phủ định về thời điểm: đến lúc ấy, thời khắc quyết định vẫn chưa tới.'
- source_word: ἡ ὥρα αὐτοῦ
  choice: giờ của Ngài
  rationale: Giữ nguyên hình ảnh “giờ”, một thuật ngữ có chiều sâu xuyên suốt sách Giăng, thay vì làm phẳng thành “thời điểm” hoặc giải thích quá hẹp ngay trong câu.
theological_decisions:
- issue: Ý nghĩa của “giờ của Ngài” trong sách Giăng
  choice: Giữ cách nói “giờ của Ngài” trong chính văn, không diễn giải thêm.
  alternative: “thời điểm của Ngài” hoặc “thời điểm Ngài chịu chết đã được định”
  rationale: Trong sách Giăng, “giờ” gắn với tiến trình sứ mạng của Đức Giê-su, đặc biệt là sự chịu khổ, cái chết, sự sống lại và vinh hiển; tuy nhiên, câu này không giới hạn “giờ” vào chỉ một biến cố. Cách dịch sát giữ được chiều sâu và sự căng thẳng thần học của nguyên văn.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” để chỉ Đức Giê-su nhằm duy trì giọng văn kính trọng; “ra tay bắt” là cách diễn đạt tự nhiên cho thành ngữ Hy Lạp mà không nhập thêm một nghi thức hay thủ tục pháp lý.
