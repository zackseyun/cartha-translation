id: JHN.7.33
reference: John 7:33
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἶπεν οὖν ὁ Ἰησοῦς· Ἔτι ⸂χρόνον μικρὸν⸃ μεθ’ ὑμῶν εἰμι καὶ ὑπάγω πρὸς τὸν πέμψαντά με.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/033.yaml
  text: So Jesus said[a], “I am with you a little while longer[b], and I am going to the one who sent me.”
translation:
  language: vi
  text: 'Vì vậy, Đức Giê-su nói: “Ta còn ở với các ông một ít lâu nữa[a], và ta đi đến với Đấng đã sai ta[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “chỉ còn một thời gian ngắn.”'
    reason: lexical_alternative
  - marker: b
    text: Trong văn mạch rộng của sách Giăng, “Đấng đã sai ta” chỉ về Đức Chúa Cha.
    reason: cross_reference
lexical_decisions:
- source_word: οὖν
  choice: Vì vậy
  rationale: Diễn tả sự tiếp nối có tính suy luận từ lời bàn luận và hành động ở câu trước, đồng thời phù hợp với văn phong kể chuyện trang trọng.
- source_word: Ἔτι χρόνον μικρόν
  choice: còn … một ít lâu nữa
  rationale: Kết hợp ý ‘vẫn/còn’ của ἔτι với khoảng thời gian ngắn của χρόνον μικρόν bằng cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: μεθ’ ὑμῶν εἰμι
  choice: Ta còn ở với các ông
  rationale: Giữ ý hiện diện cùng những người đang nghe; ‘các ông’ phản ánh đại từ số nhiều và ngữ cảnh đối thoại, còn ‘Ta’ phù hợp với lời tự xưng trang trọng của Đức Giê-su.
- source_word: καὶ ὑπάγω
  choice: và ta đi
  rationale: Giữ liên từ καί và cách nói đơn giản của ὑπάγω, không thêm ‘rồi’ hay ‘sau đó’ như thể trình tự thời gian được nêu tường minh hơn nguyên văn.
- source_word: πρὸς τὸν πέμψαντά με
  choice: đến với Đấng đã sai ta
  rationale: Dịch phân từ có mạo từ theo nghĩa danh từ, giữ cách nói gián tiếp của nguyên văn; ‘Đấng’ tự nhiên và tôn kính trong ngữ cảnh chỉ về Đức Chúa Cha mà không đưa danh xưng ấy vào chính câu.
theological_decisions:
- issue: Danh tính của ‘Đấng đã sai ta’
  choice: Giữ nguyên cách nói quan hệ ‘Đấng đã sai ta’ trong chính văn.
  alternative: ‘Đức Chúa Cha, Đấng đã sai ta’
  rationale: Trong văn mạch rộng của Giăng, Đấng ấy là Đức Chúa Cha, nhưng câu Hy Lạp không nêu danh xưng trực tiếp. Bản dịch giữ sự diễn đạt của nguyên văn và giải thích ở chú thích.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng ‘Đức Giê-su’, ‘Ta’ và ‘Đấng’ để duy trì sắc thái tôn kính; tránh thêm yếu tố thời gian không được nêu rõ trong nguyên văn. Các dấu chú thích được đặt ngay sau cụm từ mà chúng giải thích.
