id: JHN.7.23
reference: John 7:23
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἰ περιτομὴν ⸀λαμβάνει ἄνθρωπος ἐν σαββάτῳ ἵνα μὴ λυθῇ ὁ νόμος Μωϋσέως, ἐμοὶ χολᾶτε ὅτι ὅλον ἄνθρωπον ὑγιῆ ἐποίησα ἐν σαββάτῳ;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/023.yaml
  text: If a man receives circumcision on the Sabbath so that the law of Moses may not be broken[c][b][a], are you angry with me because I made a whole man well on the Sabbath?
translation:
  language: vi
  text: Nếu một người chịu phép cắt bì vào ngày Sa-bát để luật Môi-se không bị vi phạm,[a] sao các ông lại giận tôi vì tôi đã làm cho một người được lành hoàn toàn vào ngày Sa-bát?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Không bị vi phạm” cũng có thể dịch là “không bị phá bỏ” hoặc “không bị vô hiệu hóa.”
    reason: lexical_alternative
  - marker: b
    text: Cụm “một người được lành hoàn toàn” nhấn mạnh sự tương phản giữa việc cắt bì một phần thân thể và việc phục hồi trọn vẹn con người ấy.
    reason: cross_reference
lexical_decisions:
- source_word: περιτομὴν λαμβάνει
  choice: chịu phép cắt bì
  rationale: Diễn đạt tự nhiên thành ngữ Hy Lạp, sát nghĩa là “nhận phép cắt bì”, đồng thời giữ ý người ấy được người khác thực hiện nghi thức cắt bì.
- source_word: ἄνθρωπος
  choice: một người
  rationale: Trong ngữ cảnh phép cắt bì, đối tượng tất yếu là nam giới; tiếng Việt không cần dùng “một người nam” vì sẽ nặng nề và không tự nhiên.
- source_word: ἐν σαββάτῳ
  choice: vào ngày Sa-bát
  rationale: Cách diễn đạt thời gian tự nhiên trong tiếng Việt, chỉ việc xảy ra trong ngày Sa-bát.
- source_word: ἵνα μὴ λυθῇ ὁ νόμος Μωϋσέως
  choice: để luật Môi-se không bị vi phạm
  rationale: Trong ngữ cảnh luật pháp, λύω mang ý phá bỏ hoặc vi phạm hiệu lực của luật. “Không bị vi phạm” rõ nghĩa trong tiếng Việt mà không khẳng định quá mức rằng luật bị hủy bỏ.
- source_word: χολᾶτε
  choice: các ông lại giận tôi
  rationale: Động từ chỉ sự tức giận hoặc phẫn nộ. “Giận” tự nhiên và không cường điệu mức độ cảm xúc; “lại” làm rõ sắc thái tương phản của câu hỏi tu từ.
- source_word: ὅλον ἄνθρωπον
  choice: cả một con người
  rationale: Giữ sự nhấn mạnh vào toàn thể con người và bảo tồn phép tương phản giữa việc tác động đến một phần thân thể trong phép cắt bì với việc phục hồi trọn vẹn một người.
- source_word: ὑγιῆ ἐποίησα
  choice: đã làm cho ... được lành
  rationale: Phản ánh cấu trúc “làm cho khỏe/lành” thay vì rút gọn thành “chữa lành”, nhờ đó giữ được liên kết tu từ với cụm “cả một con người”.
theological_decisions:
- issue: Ý nghĩa phép so sánh giữa cắt bì và chữa lành trong ngày Sa-bát
  choice: Giữ lập luận rằng nếu phép cắt bì vẫn được thực hiện vào ngày Sa-bát để luật Môi-se không bị vi phạm, thì việc phục hồi cả một con người vào ngày ấy càng không đáng bị lên án.
  alternative: Hiểu câu này chủ yếu như sự đối lập tổng quát giữa luật nghi lễ và hành động nhân ái.
  rationale: Cấu trúc câu Hy Lạp nêu một tập tục được chấp nhận rồi đối chiếu với việc làm cho toàn thể một người được lành. Bản dịch giữ nguyên sức căng của lập luận mà không biến câu này thành lời phủ nhận luật Môi-se.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “các ông” vì lời chất vấn hướng đến một nhóm người; dùng “cả một con người” để giữ điểm nhấn tu từ của nguyên văn. Mọi dấu chú thích đều được đặt ngay sau phần câu liên quan.
