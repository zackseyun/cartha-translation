revisions:
- from: Nếu một người chịu phép cắt bì vào ngày Sa-bát để luật Môi-se không bị vi phạm,[a] sao các ông lại giận tôi vì tôi đã làm cho cả một con người được lành vào ngày Sa-bát?[b]
  to: Nếu một người chịu phép cắt bì vào ngày Sa-bát để luật Môi-se không bị vi phạm,[a] sao các ông lại giận tôi vì tôi đã làm cho một người được lành hoàn toàn vào ngày Sa-bát?[b]
  rationale: 'Chỉ sửa cách diễn đạt “cả một con người được lành” thành “một người được lành hoàn toàn” để tiếng Việt tự nhiên hơn. Bản sửa vẫn bảo tồn ý nghĩa của ὅλον ἄνθρωπον ὑγιῆ ἐποίησα: Đức Giê-su đã làm cho toàn thể con người được lành, đối lập với việc cắt bì chỉ liên quan một phần thân thể. Các dấu chú thích vẫn được đặt đúng sau mệnh đề liên quan.'
