  yaml_path: translation/nt/john/007/046.yaml
  text: The officers answered[a], “Never has a man spoken like this.”
translation:
  language: vi
  text: 'Các lính canh đáp: “Chưa bao giờ có một người nào nói như thế[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Chưa bao giờ có ai nói như thế.” Nguyên văn dùng danh từ số ít “một người” với nghĩa đại diện.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθησαν
  choice: đáp
  rationale: Động từ ἀποκρίνομαι ở đây diễn tả lời đáp trong cuộc đối thoại; “đáp” tự nhiên, ngắn gọn và phù hợp văn kể chuyện.
- source_word: οἱ ὑπηρέται
  choice: các lính canh
  rationale: Trong ngữ cảnh Giăng 7:32, 45, đây là những người được các thượng tế và người Pha-ri-si sai đi bắt Đức Chúa Jêsus. “Lính canh” diễn đạt rõ chức năng của họ mà không xác định quá mức cơ cấu chính thức.
- source_word: Οὐδέποτε
  choice: chưa bao giờ
  rationale: Cụm này diễn đạt sự phủ định tuyệt đối trong toàn bộ thời gian cho đến lúc nói và là cách nói tự nhiên trong tiếng Việt hiện đại.
- source_word: ἐλάλησεν
  choice: nói
  rationale: Động từ λαλέω ở thì aorist chỉ hành động nói; kết hợp với “chưa bao giờ”, tiếng Việt không cần biểu thị riêng hình thái thì.
- source_word: οὕτως
  choice: như thế
  rationale: οὕτως chỉ cách thức; “như thế” vừa tự nhiên vừa giữ nguyên sự quy chiếu đến cách Đức Chúa Jêsus đã nói.
- source_word: ἄνθρωπος
  choice: một người nào
  rationale: ἄνθρωπος ở số ít có nghĩa đại diện. “Một người nào” giữ được hình thức số ít và ý khái quát, đồng thời tự nhiên hơn “một người đàn ông nào” trong tiếng Việt ở ngữ cảnh này.
theological_decisions:
- issue: Phạm vi đại diện của ἄνθρωπος số ít
  choice: một người nào
  alternative: ai
  rationale: Bản dịch giữ sắc thái số ít mang nghĩa đại diện của nguyên văn nhưng không thêm ý nhấn mạnh giới tính mà tiếng Hy Lạp trong ngữ cảnh không nhất thiết đòi hỏi. Chú thích nêu cách diễn đạt tiếng Việt gọn hơn để bảo tồn lựa chọn từ vựng hợp lệ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Các lính canh” phù hợp bối cảnh hơn “các đầy tớ” nhưng tránh cách diễn giải chuyên biệt quá mức như “cảnh sát đền thờ”.
