  - severity: medium
    issue: “các thuộc hạ” cho ὑπηρέτας
    rationale: Cách gọi này dễ gợi người dưới quyền riêng hoặc sắc thái lệ thuộc/miệt thị, trong khi ὑπηρέτας tại đây là những người thừa hành chính thức được giới lãnh đạo phái đi.
