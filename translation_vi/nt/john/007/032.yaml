review_pass:
  verdict: revise
  source_fidelity: 'Bản thảo truyền đạt đúng các thành phần chính của câu, nhưng liên từ “nên” biến sự nối tiếp bằng καί (“và”) thành quan hệ nhân quả rõ rệt hơn nguyên văn. “Các thuộc hạ” cũng không phải cách gọi thích hợp nhất cho ὑπηρέτας trong ngữ cảnh này: từ này chỉ những người thừa hành/chức dịch được phái đi, không nhất thiết là thuộc hạ theo nghĩa cá nhân hay thứ bậc.'
  naturalness: “Người Pha-ri-si,” “đám đông xì xào,” và “Ngài” đều tự nhiên trong văn phong Kinh Thánh Việt hiện đại. “Những người thừa hành” tự nhiên và trung tính hơn “các thuộc hạ”; cấu trúc với “và” giữ mạch câu rõ ràng.
  terminology: Giữ “Pha-ri-si” và “các thượng tế” là phù hợp. “Những người thừa hành” phản ánh ὑπηρέτας như các nhân viên/attendants chính thức mà không áp đặt định danh “lính Đền Thờ.” “Bắt Ngài” diễn đạt mục đích của ἵνα πιάσωσιν αὐτόν; chú thích bảo lưu nghĩa sát hơn là “tóm lấy.”
