source:
  edition: SBLGNT
  text: Ἤκουσαν οἱ Φαρισαῖοι τοῦ ὄχλου γογγύζοντος περὶ αὐτοῦ ταῦτα, καὶ ἀπέστειλαν ⸂οἱ ἀρχιερεῖς καὶ οἱ Φαρισαῖοι ὑπηρέτας⸃ ἵνα πιάσωσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/032.yaml
  text: The Pharisees heard the crowd muttering these things about him[c][b][a], and the chief priests and the Pharisees sent officers to seize him.
translation:
  language: vi
  text: Người Pha-ri-si nghe đám đông đang xì xào[a] những điều này về Ngài, và các thượng tế cùng người Pha-ri-si sai những người thừa hành[b] đi bắt Ngài.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “lẩm bẩm” hoặc “càu nhàu”. Từ Hy Lạp chỉ lời nói nhỏ, có thể mang sắc thái bất mãn.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “các viên chức”, “lính canh” hoặc “người phục vụ”. Từ này chỉ những người thừa hành chính thức được giới lãnh đạo Do Thái sai đi.
    reason: lexical_alternative
  - marker: c
    text: 'Theo sát nghĩa: “tóm lấy Ngài”; trong văn cảnh này cũng có thể dịch là “bắt giữ Ngài”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἤκουσαν
  choice: nghe
  rationale: Động từ aorist ở đây diễn tả việc người Pha-ri-si nghe được lời bàn tán; “nghe” là cách diễn đạt tự nhiên và chính xác.
- source_word: τοῦ ὄχλου
  choice: đám đông
  rationale: ὄχλος chỉ đoàn người đang tụ tập; “đám đông” là cách gọi rõ ràng, hiện đại.
- source_word: γογγύζοντος
  choice: xì xào
  rationale: Từ này gợi lời nói nhỏ, không công khai, có thể mang sắc thái bất mãn. “Xì xào” giữ được tính chất bàn tán khe khẽ mà không áp đặt sắc thái tiêu cực quá mạnh.
- source_word: περὶ αὐτοῦ ταῦτα
  choice: những điều ấy về Ngài
  rationale: Giữ nội dung số nhiều của ταῦτα và nghĩa thông thường của περί với sở hữu cách.
- source_word: οἱ ἀρχιερεῖς
  choice: các thượng tế
  rationale: Trong bối cảnh thời Đền Thờ thứ hai, số nhiều này chỉ giới lãnh đạo tư tế cấp cao, không hàm ý có nhiều người đồng thời giữ chức thượng tế duy nhất.
- source_word: ὑπηρέτας
  choice: các thuộc hạ
  rationale: ὑπηρέται là những người phục vụ và thi hành mệnh lệnh chính thức cho giới lãnh đạo Do Thái. “Thuộc hạ” giữ nghĩa lệ thuộc thẩm quyền mà không xác định quá mức cơ cấu của họ.
- source_word: ἵνα πιάσωσιν αὐτόν
  choice: đi bắt Ngài
  rationale: ἵνα với động từ giả định diễn tả mục đích; πιάζω có nghĩa là bắt hoặc tóm giữ. “Đi bắt Ngài” tự nhiên trong tiếng Việt và phù hợp với hành động được sai đi thực hiện.
theological_decisions:
- issue: Thân phận của ὑπηρέτας
  choice: các thuộc hạ thi hành mệnh lệnh của giới lãnh đạo
  alternative: lính Đền Thờ; lính canh; người phục vụ
  rationale: Ngữ cảnh cho thấy đây là một hành động chính thức nhằm bắt Đức Chúa Giê-su. Bản dịch giữ mối quan hệ quyền hạn nhưng không khẳng định một chức danh cụ thể hơn điều từ Hy Lạp cho biết.
- issue: Sắc thái của γογγύζοντος
  choice: xì xào
  alternative: lẩm bẩm; càu nhàu
  rationale: Từ Hy Lạp có thể hàm ý bất mãn, nhưng trong văn cảnh cũng chỉ lời bàn tán nhỏ giữa đám đông. Bản chính bảo tồn độ mở này thay vì buộc lời nói mang sắc thái chống đối.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” để chỉ Đức Chúa Giê-su theo lối xưng hô kính trọng phổ biến; câu văn giữ hai chủ thể rõ ràng và không thêm chi tiết thể chế ngoài nguyên văn.
