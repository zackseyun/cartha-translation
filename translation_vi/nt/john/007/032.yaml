revisions:
- from: Người Pha-ri-si nghe đám đông xì xào[a] những điều ấy về Ngài, nên các thượng tế và người Pha-ri-si sai các thuộc hạ[b] đi bắt Ngài.[c]
  to: Người Pha-ri-si nghe đám đông đang xì xào[a] những điều này về Ngài, và các thượng tế cùng người Pha-ri-si sai những người thừa hành[b] đi bắt Ngài.[c]
  rationale: Thay “nên” bằng “và” để không thêm quan hệ nhân quả không được đánh dấu trong tiếng Hy Lạp. Thay “các thuộc hạ” bằng “những người thừa hành” để diễn đạt chức năng chính thức của ὑπηρέτας một cách trung tính, tự nhiên, và không quy định quá mức cơ cấu thể chế. Chú thích được chỉnh cho khớp với cách dịch mới và vẫn bảo lưu các khả năng từ vựng liên quan.
  reviewer_model: gpt-5.6-terra
