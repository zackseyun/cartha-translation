  source_fidelity: 'Bản dịch chuyển tải đầy đủ các thành tố của câu Hy Lạp: Ni-cô-đem là người đã đến với Chúa Giê-xu trước đó, là một người thuộc nhóm được gọi là “họ”, và ông nói với nhóm ấy. Tuy nhiên, “và cũng là” thêm sắc thái liên kết/cộng thêm mà nguyên văn không nêu rõ; hai cụm phân từ trong nguyên văn đều là thông tin đồng vị về Ni-cô-đem.'
  naturalness: Câu có cấu trúc tự nhiên, trang trọng và dấu hai chấm thích hợp để dẫn sang lời nói ở câu kế. Bỏ “và cũng” làm câu gọn hơn và sát cấu trúc đồng vị tiếng Hy Lạp hơn.
  terminology: “Ni-cô-đem,” “Ngài,” và “nói với họ” phù hợp với cách dùng Kinh Thánh tiếng Việt hiện đại. Chú thích nên mô tả đại từ Hy Lạp trực tiếp hơn, thay vì diễn đạt “nguyên văn” theo lối có thể gây khó hiểu.
  issues:
