  text: λέγει Νικόδημος πρὸς αὐτούς, ὁ ⸀ἐλθὼν πρὸς αὐτὸν ⸀πρότερον, εἷς ὢν ἐξ αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/john/007/050.yaml
  text: Nicodemus[a], the one who had come to him earlier, being one of them, said to them,
translation:
  language: vi
  text: 'Ni-cô-đem, người trước đó đã đến gặp Ngài[a], là một người trong số họ, nói với họ:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Đại từ Hy Lạp được dịch là “Ngài” theo ngữ cảnh chỉ Chúa Giê-xu (xem Giăng 3:1–2). Cũng có thể dịch: “người đã đến gặp Ngài trước đây.”'
    reason: Làm rõ đối tượng của đại từ theo ngữ cảnh và ghi nhận cách diễn đạt thời gian tương đương.
lexical_decisions:
- source_word: λέγει
  choice: nói
  rationale: Tiếng Hy Lạp dùng thì hiện tại lịch sử; tiếng Việt kể chuyện tự nhiên có thể dùng “nói” mà không cần đánh dấu thời quá khứ, đồng thời giữ sắc thái dẫn vào lời thoại.
- source_word: Νικόδημος
  choice: Ni-cô-đem
  rationale: Phiên âm tên riêng theo cách dùng Kinh Thánh tiếng Việt quen thuộc, dễ đọc đối với độc giả phổ thông.
- source_word: πρὸς αὐτούς
  choice: với họ
  rationale: Sau động từ nói, πρός với đối cách chỉ những người được nói với; “nói với họ” là cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: ὁ ἐλθὼν πρὸς αὐτὸν πρότερον
  choice: người trước đó đã đến gặp Ngài
  rationale: Cụm mạo từ và phân từ bổ nghĩa đồng vị cho Ni-cô-đem. “Trước đó đã đến” thể hiện hành động xảy ra trước lời nói hiện tại; “gặp” diễn đạt tự nhiên chuyển động đến với một người. Đại từ được viết “Ngài” theo ngữ cảnh chỉ Chúa Giê-xu, nhưng có chú thích để minh định điều mà nguyên văn chỉ diễn đạt bằng đại từ.
- source_word: εἷς ὢν ἐξ αὐτῶν
  choice: và cũng là một người trong số họ
  rationale: Giữ chức năng cung cấp thông tin nền về tư cách thành viên của Ni-cô-đem, không biến phân từ thành quan hệ nguyên nhân.
theological_decisions:
- issue: Đối tượng của αὐτόν trong cụm “đã đến gặp Ngài”
  choice: Hiểu là Chúa Giê-xu và giữ đại từ “Ngài” trong câu chính.
  alternative: Giữ đại từ ít xác định hơn là “ông ấy” hoặc nêu thẳng “Chúa Giê-xu”.
  rationale: Ngữ cảnh rộng hơn của sách Giăng, đặc biệt Giăng 3:1–2, xác định Ni-cô-đem là người đã đến gặp Chúa Giê-xu. Không thay đại từ bằng danh xưng trong chính câu để tránh bổ sung quá mức vào nguyên văn.
- issue: Quan hệ của εἷς ὢν ἐξ αὐτῶν với mệnh đề chính
  choice: 'Dịch như thông tin đồng vị: “và cũng là một người trong số họ”.'
  alternative: 'Dịch theo nghĩa nguyên nhân: “vì ông là một người trong số họ”.'
  rationale: Phân từ ὢν không buộc phải mang nghĩa nguyên nhân; bản dịch giữ quan hệ mở, tránh giải thích rằng tư cách thành viên là lý do ông lên tiếng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Trật tự câu giữ cấu trúc đồng vị của nguyên văn nhưng thêm “và cũng” để tiếng Việt trôi chảy. Dấu hai chấm phù hợp vì câu dẫn trực tiếp sang lời phát biểu ở câu kế tiếp.
