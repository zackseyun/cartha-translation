source:
  edition: SBLGNT
  text: Μὴ ὁ νόμος ἡμῶν κρίνει τὸν ἄνθρωπον ἐὰν μὴ ἀκούσῃ ⸂πρῶτον παρ’ αὐτοῦ⸃ καὶ γνῷ τί ποιεῖ;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/051.yaml
  text: Our law does not judge a man unless it first hears from him and knows what he is doing[b][a], does it?
translation:
  language: vi
  text: Luật pháp của chúng ta đâu có xét xử một người nếu chưa trước hết nghe trực tiếp từ người ấy và chưa biết người ấy đang làm gì?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “nếu chưa nghe người ấy trước.” Nguyên văn sát hơn là “nếu chưa trước hết nghe từ người ấy.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ
  choice: có ... không?
  rationale: Cấu trúc câu hỏi với μή chờ đợi câu trả lời phủ định; dạng hỏi “có ... không?” trong tiếng Việt truyền đạt tự nhiên sức nặng tu từ này.
- source_word: ὁ νόμος ἡμῶν
  choice: luật pháp của chúng ta
  rationale: Giữ sở hữu “của chúng ta” và không xác định quá mức rằng νόμος chỉ riêng Ngũ Kinh.
- source_word: κρίνει
  choice: xét xử
  rationale: Giữ bối cảnh pháp lý và không đưa vào nghĩa mạnh hơn là “kết án”.
- source_word: τὸν ἄνθρωπον
  choice: một người
  rationale: ἄνθρωπος ở đây là số ít mang nghĩa đại diện; “một người” tự nhiên trong tiếng Việt và không hàm ý một cá nhân đã được xác định.
- source_word: ἐὰν μὴ
  choice: khi chưa
  rationale: Trong cấu trúc câu hỏi tiếng Việt, “khi chưa ... và chưa ...” diễn đạt tự nhiên các điều kiện phủ định cần có trước khi xét xử.
- source_word: ἀκούσῃ πρῶτον παρ’ αὐτοῦ
  choice: nghe chính người ấy trình bày trước
  rationale: παρ’ αὐτοῦ chỉ việc nghe trực tiếp từ người ấy; “trình bày” làm rõ bối cảnh thủ tục mà không biến câu thành lời biện hộ chuyên biệt. “Trước” giữ πρῶτον.
- source_word: γνῷ
  choice: biết
  rationale: Giữ nghĩa trực tiếp của γινώσκω là biết được sự việc, phù hợp với việc xác minh trước khi xét xử.
- source_word: τί ποιεῖ
  choice: người ấy đang làm gì
  rationale: “Đang làm” phản ánh thì hiện tại ποιεῖ và giữ mở việc câu nói nhắm đến hành động hiện thời hay đang diễn tiến.
theological_decisions:
- issue: Phạm vi của “luật pháp”
  choice: Viết thường “luật pháp”
  alternative: “Luật Pháp” như tên gọi riêng của Kinh Luật
  rationale: Ngữ cảnh có thể gợi đến Luật Môi-se hoặc nguyên tắc pháp lý Do Thái rộng hơn; viết thường giữ được độ mở của νόμος trong câu này.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu hỏi tu từ được đặt ở dạng tự nhiên trong tiếng Việt và chờ đợi câu trả lời phủ định. Dùng “người ấy” thay cho đại từ mang giới để tránh lặp vụng mà vẫn giữ số ít đại diện.
