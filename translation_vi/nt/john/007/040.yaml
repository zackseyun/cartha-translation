  source_fidelity: 'Bản dịch phản ánh đúng các yếu tố chính của nguyên văn: sắc thái phân bộ của Ἐκ τοῦ ὄχλου (“một số người trong đám đông”), liên từ suy diễn/tiếp nối οὖν (“Vì vậy”), hành động nghe đi trước phản ứng, và lời tuyên bố có tính nhấn mạnh về “Đấng Tiên Tri”. Cách dùng “nói” không biểu thị riêng thể chưa hoàn thành của ἔλεγον, nhưng đây là sự giản lược tự nhiên, không làm sai nghĩa trong tiếng Việt.'
