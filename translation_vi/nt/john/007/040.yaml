id: JHN.7.40
reference: John 7:40
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸂Ἐκ τοῦ ὄχλου οὖν⸃ ἀκούσαντες ⸂τῶν λόγων τούτων⸃ ⸀ἔλεγον· Οὗτός ἐστιν ἀληθῶς ὁ προφήτης·
base_translation:
  language: en
  yaml_path: translation/nt/john/007/040.yaml
  text: Therefore[a], some from the crowd, when they heard these words, were saying, “This truly is the Prophet.”
translation:
  language: vi
  text: 'Vì vậy, khi nghe những lời ấy, một số người trong đám đông nói: “Người này thật sự là Đấng Tiên Tri.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Đấng Tiên Tri” có lẽ chỉ vị tiên tri giống Môi-se mà dân chúng mong đợi (xem Phục Truyền Luật Lệ Ký 18:15), dù một số người hiểu cụm từ này theo nghĩa khái quát hơn là “nhà tiên tri ấy”.
    reason: Đưa ra liên hệ Cựu Ước có khả năng đứng sau tước hiệu, đồng thời ghi nhận cách hiểu khác mà không áp đặt một kết luận vào chính văn.
lexical_decisions:
- source_word: Ἐκ τοῦ ὄχλου
  choice: một số người trong đám đông
  rationale: Cụm giới từ có nghĩa phân bộ, chỉ một nhóm thuộc đám đông chứ không phải toàn thể đám đông.
- source_word: οὖν
  choice: Vì vậy
  rationale: Giữ rõ quan hệ tiếp nối hoặc suy ra từ lời Đức Chúa Jêsus trong ngữ cảnh trước.
- source_word: ἀκούσαντες
  choice: khi nghe
  rationale: Diễn đạt tự nhiên hành động xảy ra trước hoặc gắn liền với động từ chính mà không làm câu tiếng Việt nặng nề.
- source_word: τῶν λόγων τούτων
  choice: những lời ấy
  rationale: Chỉ những lời Đức Chúa Jêsus vừa phán; “lời” là cách diễn đạt trực tiếp và tự nhiên trong ngữ cảnh.
- source_word: ἔλεγον
  choice: nói
  rationale: Tiếng Việt không bắt buộc biểu thị thể chưa hoàn thành; “nói” phù hợp với phản ứng đang diễn ra trong đám đông mà không cường điệu thành “cứ nói”.
- source_word: Οὗτός ἐστιν
  choice: Người này ... là
  rationale: Giữ sắc thái chỉ trực tiếp vào Đức Chúa Jêsus, đồng thời tự nhiên và trang trọng trong tiếng Việt.
- source_word: ἀληθῶς
  choice: thật sự
  rationale: Thể hiện lời khẳng định về tính xác thực với giọng hiện đại, trang trọng vừa phải.
- source_word: ὁ προφήτης
  choice: Đấng Tiên Tri
  rationale: Cách viết như một tước hiệu cho thấy nhiều khả năng đây là nhân vật tiên tri được mong đợi, đồng thời không đồng nhất tước hiệu này với Đấng Mê-si ngay trong bản văn.
theological_decisions:
- issue: Danh tính được hàm ý bởi ὁ προφήτης
  choice: 'Dịch như một tước hiệu: “Đấng Tiên Tri”, nhưng không giải thích ngay trong chính văn rằng đó là Đấng Mê-si.'
  alternative: Dịch theo nghĩa khái quát là “nhà tiên tri ấy”, hoặc hiểu tước hiệu này hoàn toàn đồng nghĩa với Đấng Mê-si.
  rationale: Ngữ cảnh Giăng có thể gợi đến vị tiên tri giống Môi-se trong Phục Truyền Luật Lệ Ký 18:15, nhưng câu này không xác định rõ hơn. Bản dịch giữ nguyên độ căng và tính mở về thần học của lời đám đông.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, sáng rõ và trang trọng. Cấu trúc câu ưu tiên trật tự tự nhiên của tiếng Việt; tước hiệu “Đấng Tiên Tri” được viết hoa để biểu thị lực xác định của cụm từ trong ngữ cảnh.
