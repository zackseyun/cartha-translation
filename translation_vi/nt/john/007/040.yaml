  terminology: “Đấng Tiên Tri” bảo toàn lực xác định, gần như tước hiệu, của ὁ προφήτης mà không đồng nhất hóa trong chính văn với Đấng Mê-si. Chú thích nêu khả năng ám chỉ vị tiên tri như Môi-se và giữ lại cách hiểu rộng hơn, phù hợp với sự dè dặt diễn giải cần thiết.
