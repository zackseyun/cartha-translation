language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἤδη δὲ τῆς ἑορτῆς μεσούσης ⸀ἀνέβη Ἰησοῦς εἰς τὸ ἱερὸν καὶ ἐδίδασκεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/014.yaml
  text: When the feast was already half over[c][b][a], Jesus went up into the temple and was teaching.
translation:
  language: vi
  text: Khi kỳ lễ đã vào khoảng giữa[a], Giê-su đi lên khu đền thờ[b] và giảng dạy[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Khi kỳ lễ đã qua nửa.”'
    reason: lexical_alternative
  - marker: b
    text: Từ Hy Lạp ở đây chỉ toàn khu đền thờ hoặc các sân đền thờ, không riêng nơi thánh bên trong.
    reason: cultural_note
  - marker: c
    text: 'Cũng có thể dịch: “đang giảng dạy.” Thể chưa hoàn thành trong tiếng Hy Lạp có thể nhấn mạnh hành động đang tiếp diễn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἤδη
  choice: đã
  rationale: Diễn tả thời điểm của kỳ lễ đã tiến đến một mốc nhất định; “đã” là cách diễn đạt tự nhiên và súc tích trong tiếng Việt.
- source_word: δὲ
  choice: không dịch thành một từ riêng
  rationale: Ở đây δὲ chỉ đánh dấu bước chuyển nhẹ trong mạch kể. Cấu trúc câu tiếng Việt tự nhiên đã thể hiện sự chuyển tiếp này, nên thêm “bấy giờ” hoặc “nhưng” sẽ dễ nhấn quá mức.
- source_word: τῆς ἑορτῆς μεσούσης
  choice: khi kỳ lễ đã đến giữa kỳ
  rationale: Kết cấu sở hữu cách tuyệt đối nêu hoàn cảnh thời gian; μεσούσης cho biết kỳ lễ đang ở khoảng giữa. Cách dịch này giữ được ý về trung điểm mà không xác định quá cứng một khoảnh khắc chính xác.
- source_word: ἀνέβη
  choice: đi lên
  rationale: Giữ sắc thái phương hướng của ἀναβαίνω, phù hợp với việc đi lên Giê-ru-sa-lem và vào khu đền thờ.
- source_word: Ἰησοῦς
  choice: Chúa Giê-su
  rationale: Cách gọi quen thuộc, trang trọng và dễ hiểu trong tiếng Việt hiện đại.
- source_word: εἰς τὸ ἱερὸν
  choice: lên đền thờ
  rationale: “Đền thờ” là cách gọi tự nhiên; giới từ và động từ được kết hợp thành “đi lên đền thờ”. Chú thích làm rõ ἱερόν chỉ toàn khu đền thờ hay các sân, không riêng nơi thánh bên trong.
- source_word: ἐδίδασκεν
  choice: giảng dạy
  rationale: Động từ ở thì chưa hoàn thành có thể gợi hành động đang tiếp diễn. Tiếng Việt không buộc phải đánh dấu thể ở đây; “giảng dạy” giữ lời văn tự nhiên, còn sắc thái tiếp diễn được nêu trong chú thích.
theological_decisions:
- issue: Phạm vi chỉ định của ἱερόν
  choice: “đền thờ” được hiểu là khu phức hợp đền thờ hoặc các sân đền thờ
  alternative: hiểu là chính nơi thánh bên trong
  rationale: Từ ἱερόν khác với ναός và thường chỉ toàn khu đền thờ. Giữ “đền thờ” trong chính văn để lời văn tự nhiên, đồng thời chú thích nhằm tránh hình dung sai về địa điểm Chúa Giê-su giảng dạy.
- issue: Sắc thái của thể chưa hoàn thành trong ἐδίδασκεν
  choice: không thêm ý khởi đầu; dịch trung tính là “giảng dạy” và ghi chú khả năng tiếp diễn
  alternative: “bắt đầu giảng dạy” hoặc “đang giảng dạy”
  rationale: Bản Hy Lạp cho thấy hành động trong quá khứ có tính tiếp diễn nhưng không minh nhiên nói hành động bắt đầu tại thời điểm ấy. Cách dịch tránh tự ý thêm sắc thái khởi đầu và vẫn bảo tồn khả năng tiếp diễn.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Câu giữ trật tự tường thuật của nguyên bản, tránh thêm từ nối mạnh cho δὲ và tránh thêm sắc thái khởi đầu không được ἐδίδασκεν xác định rõ.
