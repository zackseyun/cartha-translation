  - severity: low
    issue: “dù chưa từng học” hơi đẩy câu sang quan hệ nhượng bộ.
    rationale: μὴ μεμαθηκώς nghĩa là “không/chưa được học” trong câu hỏi; “mà chưa từng học” tự nhiên hơn và bám sát quan hệ cú pháp-ngữ nghĩa của nguyên văn.
