source:
  edition: SBLGNT
  text: ⸂ἐθαύμαζον οὖν⸃ οἱ Ἰουδαῖοι λέγοντες· Πῶς οὗτος γράμματα οἶδεν μὴ μεμαθηκώς;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/015.yaml
  text: So the Jews were marveling[a], saying[b], “How does this man know letters without having studied?”
translation:
  language: vi
  text: 'Vì vậy, những người Do Thái[a] lấy làm kinh ngạc và nói: “Sao người này biết chữ nghĩa[b] mà chưa từng học?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Trong sách Giăng, ở đây cụm từ “những người Do Thái” theo ngữ cảnh chỉ những người Do Thái đang đối thoại hoặc chống đối Chúa Giê-su tại Giê-ru-sa-lem, có lẽ gồm cả giới chức Giu-đê; không phải là toàn thể dân Do Thái.
    reason: cultural_note
  - marker: b
    text: Hay “có học thức như vậy.” Tiếng Hy Lạp nói sát nghĩa là “biết chữ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐθαύμαζον
  choice: lấy làm kinh ngạc
  rationale: Diễn tả phản ứng ngạc nhiên đang diễn ra trong thì chưa hoàn thành; cách nói này tự nhiên và trang trọng trong tiếng Việt hiện đại.
- source_word: οὖν
  choice: Vì vậy
  rationale: Giữ quan hệ tiếp nối hoặc suy luận với mạch văn trước.
- source_word: οἱ Ἰουδαῖοι
  choice: những người Do Thái
  rationale: Giữ cách gọi trực tiếp của nguyên văn thay vì thu hẹp ngay thành giới lãnh đạo; chú thích làm rõ phạm vi chỉ những người đối thoại hoặc chống đối Chúa Giê-su trong bối cảnh này.
- source_word: λέγοντες
  choice: và nói
  rationale: Chuyển phân từ Hy Lạp sang cấu trúc phối hợp tự nhiên trong tiếng Việt.
- source_word: Πῶς οὗτος
  choice: Sao người này
  rationale: Cách hỏi tự nhiên, giữ sắc thái có phần xa cách của οὗτος mà không làm câu mang tính miệt thị quá mức.
- source_word: γράμματα οἶδεν
  choice: biết chữ nghĩa
  rationale: Giữ hình ảnh 'biết chữ' của nguyên văn đồng thời 'chữ nghĩa' trong tiếng Việt có thể chỉ kiến thức kinh sách hoặc học vấn, phù hợp ngữ cảnh.
- source_word: μὴ μεμαθηκώς
  choice: dù chưa từng học
  rationale: Diễn đạt việc không trải qua sự đào tạo chính thức được trông đợi; 'dù' thể hiện sự tương phản hàm chứa trong câu hỏi.
theological_decisions:
- issue: Phạm vi quy chiếu của οἱ Ἰουδαῖοι trong sách Giăng
  choice: những người Do Thái
  alternative: giới lãnh đạo Do Thái; những người Giu-đê
  rationale: Bản văn chính giữ từ ngữ khái quát của tiếng Hy Lạp và không tự ý thu hẹp đối tượng. Chú thích ngăn cách hiểu sai rằng câu này nói về toàn thể dân Do Thái.
- issue: Ý nghĩa của γράμματα
  choice: chữ nghĩa
  alternative: học vấn; Kinh Thánh
  rationale: Cách dịch này bảo tồn độ mở của từ Hy Lạp giữa nghĩa chữ viết, sự học và kiến thức kinh sách, thay vì quyết định riêng rằng từ này chỉ Kinh Thánh hay học vấn kinh sư.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Câu hỏi trực tiếp dùng “Sao” để tự nhiên trong lời nói; “chữ nghĩa” giữ được thành ngữ của nguyên văn và sắc thái học vấn mà không giải thích quá mức.
