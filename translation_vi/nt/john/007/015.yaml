  source_fidelity: 'Bản dịch truyền đạt đúng cấu trúc và ý chính của câu Hy Lạp: phản ứng kinh ngạc đang diễn ra, chủ ngữ οἱ Ἰουδαῖοι, và câu hỏi về γνώση γραμμάτων khi chưa được học. “Chữ nghĩa” giữ hữu ích độ mở của γράμματα là chữ viết/học vấn. Đổi “dù” thành “mà” sát hơn với phân từ phủ định μὴ μεμαθηκώς trong cấu trúc hỏi tiếng Việt.'
