  terminology: “Những người Do Thái” là cách giữ tương ứng từ vựng với οἱ Ἰουδαῖοι; chú thích cần nói rõ đây không phải là quy chiếu đến toàn thể dân Do Thái. “Chúa Giê-su” và “Giê-ru-sa-lem” nhất quán với bản thảo.
