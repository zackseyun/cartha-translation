  text: ἀπεκρίθη οὖν αὐτοῖς ⸀ὁ Ἰησοῦς καὶ εἶπεν· Ἡ ἐμὴ διδαχὴ οὐκ ἔστιν ἐμὴ ἀλλὰ τοῦ πέμψαντός με·
base_translation:
  language: en
  yaml_path: translation/nt/john/007/016.yaml
  text: So Jesus answered them[a], “My teaching is not mine, but his who sent me.”
translation:
  language: vi
  text: 'Vì vậy, Đức Giê-su trả lời họ: “Lời dạy của tôi không phải là của tôi, nhưng là của Đấng đã sai tôi.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη οὖν αὐτοῖς ὁ Ἰησοῦς καὶ εἶπεν
  choice: Vì vậy, Đức Giê-su đáp lời họ
  rationale: “Vì vậy” giữ lực liên kết của οὖν với ngữ cảnh trước; “đáp lời họ” diễn đạt tự nhiên ἀπεκρίθη αὐτοῖς. Công thức καὶ εἶπεν được gộp vào lời dẫn trực tiếp để tránh lặp nặng nề trong tiếng Việt mà không làm mất chức năng dẫn lời.
- source_word: Ἡ ἐμὴ διδαχή
  choice: Sự dạy dỗ của tôi
  rationale: “Sự dạy dỗ” là cách nói phổ thông, trang trọng vừa phải cho διδαχή và ít mang sắc thái thuật ngữ giáo hội hơn “giáo lý”; “của tôi” giữ nét nhấn mạnh sở hữu của ἐμή.
- source_word: οὐκ ἔστιν ἐμὴ
  choice: không phải là của riêng tôi
  rationale: “Của riêng tôi” làm rõ sự phủ định về nguồn gốc hoặc quyền sở hữu độc lập, đồng thời giữ cấu trúc đối lập ngắn gọn của nguyên văn.
- source_word: ἀλλὰ τοῦ πέμψαντός με
  choice: nhưng là của Đấng đã sai tôi
  rationale: Danh xưng “Đấng” phù hợp với lối văn Kinh Thánh trang trọng và cho thấy người sai Đức Giê-su mà không tự ý thêm “Đức Chúa Cha” vào câu. Cách dùng “của” giữ nguyên độ mở của sở hữu cách Hy Lạp giữa nguồn gốc và sự thuộc về.
- source_word: πέμψαντός
  choice: đã sai
  rationale: “Sai” là tương đương trực tiếp, tự nhiên của πέμπω; “ủy nhiệm” sẽ bổ sung một sắc thái không bắt buộc trong nguyên văn.
theological_decisions:
- issue: Mối liên hệ giữa sự dạy dỗ của Đức Giê-su và Đấng sai Ngài
  choice: Giữ nguyên lời khẳng định rằng sự dạy dỗ không phải của riêng Đức Giê-su nhưng là của Đấng đã sai Ngài.
  alternative: Diễn giải thành “đến từ Đấng đã sai tôi” hoặc giải thích đây chỉ là việc Đức Giê-su phủ nhận quyền sở hữu thông điệp.
  rationale: Sở hữu cách τοῦ πέμψαντός με có thể nhấn mạnh cả nguồn gốc lẫn sự thuộc về. Bản dịch không thu hẹp thành một nghĩa duy nhất, cũng không thêm kết luận tín lý về bản thể hay thẩm quyền ngoài điều câu văn trực tiếp nói.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng và dễ hiểu. Dùng “Đức Giê-su” và “Đấng” theo văn phong Kinh Thánh phổ thông; tránh “giáo lý” vì dễ tạo sắc thái kỹ thuật hơn διδαχή trong ngữ cảnh này. Không cần chú thích vì độ mở của sở hữu cách đã được giữ ngay trong cụm “là của Đấng”.
