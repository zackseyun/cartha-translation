revisions:
- from: Nhưng khi các em trai Ngài đã lên dự lễ, bấy giờ chính Ngài cũng lên, không công khai, nhưng như thể đi kín đáo.[a]
  to: Nhưng khi những người anh em của Ngài đã lên dự lễ, bấy giờ chính Ngài cũng lên, không công khai, nhưng như thể đi một cách kín đáo.[a]
  rationale: Sửa “các em trai” thành “những người anh em” để không áp đặt thứ bậc tuổi tác mà tiếng Hy Lạp không nêu. Điều chỉnh nhẹ cụm trạng ngữ cuối cho tiếng Việt tự nhiên hơn, đồng thời giữ “như thể” để phản ánh sắc thái của ὡς. Chú thích được chỉnh cho khớp với cách diễn đạt đã sửa và vẫn nêu phương án ngắn gọn hơn.
  reviewer_model: gpt-5.6-terra
