source:
  edition: SBLGNT
  text: Ὡς δὲ ἀνέβησαν οἱ ἀδελφοὶ αὐτοῦ ⸂εἰς τὴν ἑορτήν, τότε καὶ αὐτὸς ἀνέβη⸃, οὐ φανερῶς ἀλλὰ ὡς ἐν κρυπτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/010.yaml
  text: But when his brothers had gone up to the feast[a], then he also went up, not openly but as if in secret.
translation:
  language: vi
  text: Nhưng khi những người anh em của Ngài đã lên dự lễ, bấy giờ chính Ngài cũng lên, không công khai, nhưng như thể đi một cách kín đáo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “nhưng đi kín đáo.” Nguyên văn Hy Lạp dịch sát là “nhưng như ở nơi kín đáo”; từ “như” có thể làm nhẹ lời khẳng định đôi chút.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὡς δὲ
  choice: Nhưng khi
  rationale: Ὡς cùng động từ aorist mở đầu mệnh đề thời gian, còn δέ đánh dấu sự chuyển ý và tương phản nhẹ với văn cảnh trước.
- source_word: ἀνέβησαν ... ἀνέβη
  choice: đã lên ... cũng lên
  rationale: Giữ hình ảnh 'lên' của ἀναβαίνω, phù hợp với hành trình lên Giê-ru-sa-lem và việc hành hương; 'đã' trong mệnh đề đầu làm rõ trình tự trước-sau.
- source_word: οἱ ἀδελφοὶ αὐτοῦ
  choice: các em trai Ngài
  rationale: Trong văn cảnh, ἀδελφοί chỉ những người nam là anh em ruột thịt của Đức Chúa Jêsus. Tiếng Việt cần chọn vai vế; các câu trước cho thấy họ ở vị thế những người em, nên 'các em trai' tự nhiên và cụ thể.
- source_word: εἰς τὴν ἑορτήν
  choice: dự lễ
  rationale: Diễn đạt tự nhiên mục đích đi lên dự kỳ lễ đã được xác định trong văn cảnh, không cần lặp lại tên Lễ Lều Tạm trong chính câu này.
- source_word: τότε καὶ αὐτὸς
  choice: bấy giờ chính Ngài cũng
  rationale: Giữ cả trình tự do τότε biểu thị, ý bổ sung của καί và sắc thái nhấn mạnh của αὐτός.
- source_word: οὐ φανερῶς
  choice: không công khai
  rationale: Diễn đạt trực tiếp nghĩa 'không một cách công khai' của φανερῶς và tạo thế đối lập rõ với vế sau.
- source_word: ἀλλὰ ὡς ἐν κρυπτῷ
  choice: nhưng như thể đi kín đáo
  rationale: Giữ yếu tố dè dặt của ὡς ('như thể') thay vì làm phẳng thành lời khẳng định tuyệt đối 'đi kín đáo'; thêm 'đi' để câu tiếng Việt trọn và tự nhiên.
theological_decisions:
- issue: Quan hệ giữa hành động của Đức Chúa Jêsus tại đây và lời Ngài nói trước đó về việc không lên dự lễ
  choice: Thuật lại thẳng rằng Ngài lên sau các em trai và không đi công khai, không giải hòa căng thẳng trong bản văn.
  alternative: Diễn ý rằng Ngài đổi ý, hoặc thêm lời giải thích nhằm dung hòa với Giăng 7:8.
  rationale: Câu Hy Lạp chỉ kể trình tự và cách Ngài lên dự lễ; bản dịch không nên bổ sung một cách giải thích mà nguyên văn không nêu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” để quy chiếu Đức Chúa Jêsus; giữ “như thể” nhằm bảo toàn sắc thái chưa hoàn toàn tuyệt đối của ὡς. Dấu chú thích [a] được đặt ngay sau cụm từ liên quan.
