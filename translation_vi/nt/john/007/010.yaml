review_pass:
  verdict: revise
  source_fidelity: Bản dịch giữ đúng trình tự “sau khi ... đã lên ... thì ... cũng lên”, động từ “lên”, ý không công khai, và sắc thái dè dặt của ὡς. Tuy nhiên, οἱ ἀδελφοὶ αὐτοῦ không cho biết họ là em hay anh của Đức Chúa Jêsus; “các em trai” thêm một quan hệ vai vế không có trong nguyên văn.
  naturalness: Câu nhìn chung rõ ràng và trang trọng. “Như thể đi kín đáo” hơi gượng trong tiếng Việt; “như thể đi một cách kín đáo” tự nhiên hơn mà vẫn giữ sắc thái của ὡς.
  terminology: “Những người anh em của Ngài” tránh khẳng định thứ bậc tuổi tác không được văn bản nêu, đồng thời vẫn chỉ nhóm nam theo ngữ cảnh. “Lên dự lễ” và “không công khai” phù hợp với văn cảnh hành hương và cách dùng hiện đại.
  issues:
  - severity: medium
    issue: “các em trai Ngài” xác định các anh em là những người em của Ngài.
    rationale: Danh từ ἀδελφοί tự nó không mã hóa quan hệ anh/em. Bản văn câu này và dữ liệu nguồn được cung cấp chỉ xác định họ là các anh em nam, không xác định tuổi tác hay vai vế; bản dịch cần tránh thêm thông tin ấy.
  - severity: low
    issue: “như thể đi kín đáo” chưa thật tự nhiên.
    rationale: Thêm “một cách” làm trạng ngữ tiếng Việt trôi chảy hơn, vẫn chuyển tải ὡς ἐν κρυπτῷ là hành động như ở/chốn kín đáo và không biến sắc thái dè dặt thành khẳng định tuyệt đối.
  revised_text: Nhưng khi những người anh em của Ngài đã lên dự lễ, bấy giờ chính Ngài cũng lên, không công khai, nhưng như thể đi một cách kín đáo.[a]
