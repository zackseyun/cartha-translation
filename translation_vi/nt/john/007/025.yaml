  text: Ἔλεγον οὖν τινες ἐκ τῶν Ἱεροσολυμιτῶν· Οὐχ οὗτός ἐστιν ὃν ζητοῦσιν ἀποκτεῖναι;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/025.yaml
  text: So some of the people of Jerusalem were saying[a], “Is this not the man they are seeking to kill?”
translation:
  language: vi
  text: 'Vì vậy, một số người ở Giê-ru-sa-lem đang nói: “Đây chẳng phải là người họ đang tìm giết sao?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔλεγον
  choice: nói với nhau
  rationale: Thì chưa hoàn thành mô tả lời bàn tán đang diễn ra hoặc lặp lại; trong ngữ cảnh một nhóm người, “nói với nhau” diễn đạt tự nhiên sắc thái ấy mà không biến lời nói thành một phát biểu đơn lẻ.
- source_word: οὖν
  choice: Vì vậy
  rationale: Giữ lực nối kết suy luận/tường thuật với phần trước, đồng thời phù hợp văn phong tiếng Việt hiện đại.
- source_word: τινες ἐκ τῶν Ἱεροσολυμιτῶν
  choice: một số người dân Giê-ru-sa-lem
  rationale: Diễn đạt rõ một bộ phận không xác định trong số cư dân Giê-ru-sa-lem; tự nhiên hơn cách gọi danh xưng kiểu “những người Giê-ru-sa-lem”.
- source_word: Οὐχ οὗτός ἐστιν
  choice: Đây chẳng phải là người ... sao?
  rationale: Cấu trúc câu hỏi phủ định trong nguyên văn hướng tới câu trả lời khẳng định; mẫu “chẳng phải ... sao?” bảo toàn lực tu từ ấy.
- source_word: ζητοῦσιν
  choice: đang tìm
  rationale: Thì hiện tại thể hiện ý định/hành động đang tiếp diễn; “đang tìm” giữ sắc thái thời thể mà không thêm ý nghĩa “cố gắng”.
- source_word: ἀποκτεῖναι
  choice: giết
  rationale: Là nghĩa trực tiếp, thông dụng của động từ, không thêm sắc thái xét xử hay hành quyết.
theological_decisions: []
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Giê-ru-sa-lem” theo lối phiên âm Kinh Thánh quen thuộc. Không cần chú thích vì cách dịch “một số người dân Giê-ru-sa-lem” truyền đạt đầy đủ ἐκ τῶν Ἱεροσολυμιτῶν mà không tạo ra một phương án khác có ý nghĩa đáng kể.
