review_pass:
  verdict: revise
  source_fidelity: Bản dịch theo đúng dị bản SBLGNT οὐκ, không đưa “chưa” vào chính văn. “Lên dự lễ” phản ánh phù hợp ἀνάβητε/ἀναβαίνω trong bối cảnh hành hương; “các anh” phù hợp ngữ cảnh các em trai của Đức Giê-su. Tuy nhiên, “vẫn chưa đến lúc trọn vẹn” không diễn đạt tự nhiên và làm mờ ý hoàn tất/trọn đầy của πεπλήρωται.
  naturalness: Câu mệnh lệnh và cách xưng hô tự nhiên, trang trọng vừa phải. Nên thay cụm “đến lúc trọn vẹn” bằng “chưa trọn vẹn”, vốn tự nhiên hơn trong tiếng Việt hiện đại mà vẫn giữ ý thời điểm chưa đạt sự trọn đầy.
  terminology: “Lễ” và “thời điểm” phù hợp. Giữ “thời điểm của tôi” để không áp đặt rõ hơn rằng đây là thời điểm đã được thần linh định sẵn. Chú thích từ vựng có thể nêu phương án diễn giải “thời điểm đã định”.
  issues:
  - severity: medium
    issue: Cụm “vẫn chưa đến lúc trọn vẹn” thiếu tự nhiên và không rõ cấu trúc nghĩa.
    rationale: πεπλήρωται là thể hoàn thành bị động của πληρόω, nói thời điểm chưa được/lên đến sự trọn đầy. “Chưa trọn vẹn” diễn đạt rõ và tự nhiên hơn, không giản lược thành chỉ “chưa đến.”
  - severity: low
    issue: Ký hiệu chú thích dị bản hiện neo sau “lễ” trong mệnh đề đầu thay vì tại lời phủ định được dị bản tác động.
    rationale: Dị bản οὐκ/οὔπω thuộc về mệnh đề “Tôi không lên dự lễ này”; đặt ký hiệu sau “không” giúp người đọc nhận rõ phạm vi chú thích.
