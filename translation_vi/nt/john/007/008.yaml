source:
  edition: SBLGNT
  text: ὑμεῖς ἀνάβητε εἰς τὴν ⸀ἑορτήν· ἐγὼ ⸀οὐκ ἀναβαίνω εἰς τὴν ἑορτὴν ταύτην, ὅτι ὁ ⸂ἐμὸς καιρὸς⸃ οὔπω πεπλήρωται.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/008.yaml
  text: You go up to the feast[a]. I am not going up to this feast[b], because my time has not yet come to fulfillment.
translation:
  language: vi
  text: Các anh cứ lên dự lễ. Tôi không[a] lên dự lễ này, vì thời điểm của tôi vẫn chưa trọn vẹn[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Một số thủ bản chép: “Tôi chưa lên dự lễ này.”'
    reason: textual_variant
  - marker: b
    text: 'Cũng có thể dịch: “vì thời điểm đã định cho tôi vẫn chưa được hoàn tất.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνάβητε
  choice: lên dự
  rationale: Giữ sắc thái đi lên của động từ, phù hợp với việc lên Giê-ru-sa-lem dự lễ, đồng thời tự nhiên trong tiếng Việt.
- source_word: ἑορτή
  choice: lễ
  rationale: “Lễ” là cách gọi tự nhiên, trang trọng cho kỳ lễ tôn giáo trong ngữ cảnh này.
- source_word: οὐκ ἀναβαίνω
  choice: Tôi không lên dự
  rationale: Theo bản SBLGNT với οὐκ (“không”), không đưa ý “chưa” vào chính văn; cách diễn đạt hiện tại cũng phù hợp với dự định trước mắt.
- source_word: ταύτην
  choice: này
  rationale: Giữ nguyên ý chỉ định về chính kỳ lễ đang được bàn đến.
- source_word: καιρός
  choice: thời điểm
  rationale: “Thời điểm” diễn đạt tự nhiên một lúc thích hợp hay đã được định, nhưng không làm rõ quá mức yếu tố được định trước.
- source_word: πεπλήρωται
  choice: đến lúc trọn vẹn
  rationale: Giữ sắc thái đạt đến sự đầy đủ/trọn vẹn của thể hoàn thành bị động, thay vì giản lược thành chỉ “đến”.
theological_decisions:
- issue: Dị bản trong lời Đức Giê-su nói về việc lên dự lễ
  choice: 'Theo οὐκ: “Tôi không lên dự lễ này.”'
  alternative: 'Theo οὔπω: “Tôi chưa lên dự lễ này.”'
  rationale: Chính văn theo SBLGNT và giữ nguyên sự căng thẳng với việc Đức Giê-su về sau lên dự lễ; dị bản có ý nghĩa giải thích được nêu trong chú thích, không dùng để âm thầm giải quyết khó khăn.
- issue: Sắc thái của καιρός và πεπλήρωται
  choice: “thời điểm của tôi vẫn chưa đến lúc trọn vẹn”
  alternative: “thời điểm đã định cho tôi vẫn chưa được hoàn tất”
  rationale: Chính văn bảo toàn hình ảnh về sự trọn vẹn mà không khẳng định rõ hơn nguyên văn rằng thời điểm ấy do Đức Chúa Trời ấn định; phương án diễn giải hơn được ghi chú.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “các anh” theo quan hệ của Đức Giê-su với các anh em trong ngữ cảnh; dùng “cứ” để chuyển sắc thái đối lập/cho phép của đại từ nhấn mạnh ὑμεῖς mà không làm câu nặng nề.
