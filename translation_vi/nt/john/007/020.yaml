id: JHN.7.20
reference: John 7:20
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀπεκρίθη ὁ ⸀ὄχλος· Δαιμόνιον ἔχεις· τίς σε ζητεῖ ἀποκτεῖναι;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/020.yaml
  text: The crowd answered[a], “You have a demon. Who is seeking to kill you?”
translation:
  language: vi
  text: 'Đám đông đáp: “Ông có quỷ[a]! Ai đang tìm cách giết ông?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Ông bị quỷ ám.” Nguyên văn: “Ông có một quỷ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: đáp
  rationale: Động từ tường thuật lời đối đáp; “đáp” tự nhiên, trang trọng vừa phải và phù hợp với hội thoại.
- source_word: ὄχλος
  choice: đám đông
  rationale: Chỉ tập hợp đông người trong bối cảnh này; “đám đông” là cách diễn đạt rõ ràng, hiện đại.
- source_word: Δαιμόνιον ἔχεις
  choice: Ông có quỷ
  rationale: Giữ sát cấu trúc Hy Lạp, nghĩa đen là “ông có một quỷ”, đồng thời không tự ý diễn giải mức độ hay bản chất của tình trạng bị cáo buộc.
- source_word: τίς
  choice: Ai
  rationale: Giữ đại từ nghi vấn rõ ràng trong câu hỏi mang tính chất bác bỏ của đám đông.
- source_word: ζητεῖ
  choice: đang tìm cách
  rationale: Thể hiện hành động đang tiếp diễn và kết hợp tự nhiên trong tiếng Việt với động từ nguyên mẫu chỉ mục đích theo sau.
- source_word: ἀποκτεῖναι
  choice: giết
  rationale: Cách dịch trực tiếp và tự nhiên; không thêm sắc thái pháp lý hoặc đạo đức riêng như “sát hại” hay “xử tử”.
theological_decisions:
- issue: Cách dịch δαιμόνιον trong lời đám đông cáo buộc Chúa Giê-su
  choice: 'Giữ lối nói gần nguyên văn: “Ông có quỷ.”'
  alternative: “Ông bị quỷ ám.”
  rationale: Câu văn thuật lại lời cáo buộc thù nghịch của đám đông chứ không xác nhận lời ấy. Bản dịch chính giữ hình thức của nguyên ngữ, còn chú thích cung cấp cách diễn đạt tự nhiên hơn trong tiếng Việt mà không giải quyết thay sự căng thẳng của bản văn.
translation_notes:
  register: Tiếng Việt hiện đại, rõ ràng và trang nghiêm vừa phải. Đại từ “ông” phù hợp với lời đám đông trực tiếp nói với Chúa Giê-su trong một cuộc đối đáp căng thẳng; không thêm kính ngữ vốn không có trong lời Hy Lạp.
