source:
  edition: SBLGNT
  text: οὐδὲ γὰρ οἱ ἀδελφοὶ αὐτοῦ ἐπίστευον εἰς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/005.yaml
  text: For not even his brothers believed in him[a].
translation:
  language: vi
  text: Vì ngay cả các anh em của Ngài cũng không tin vào Ngài.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Động từ Hy Lạp ở thì chưa hoàn thành; trong ngữ cảnh này có thể được dịch theo quá khứ đơn, hoặc để nhấn mạnh tình trạng không tin kéo dài trong quá khứ.
    reason: Làm rõ sắc thái của thì chưa hoàn thành mà không gán sắc thái tiếp diễn cho cách dịch «đã không tin».
lexical_decisions:
- source_word: οὐδὲ
  choice: ngay cả ... cũng không
  rationale: Cấu trúc này diễn đạt tự nhiên sắc thái nhấn mạnh của οὐδέ trong tiếng Việt, thay vì chỉ nối thêm một mệnh đề phủ định.
- source_word: γὰρ
  choice: Vì
  rationale: γάρ nêu lý do giải thích cho lời kể ngay trước đó; “Vì” giữ rõ mối liên hệ diễn ngôn mà không diễn giải thêm.
- source_word: οἱ ἀδελφοὶ αὐτοῦ
  choice: các anh em của Ngài
  rationale: ἀδελφοί là danh từ giống đực số nhiều và trong ngữ cảnh chỉ những người anh em nam của Chúa Giê-su. “Anh em” tránh buộc phải xác định họ lớn hay nhỏ tuổi hơn Ngài, điều nguyên văn không nói rõ.
- source_word: ἐπίστευον
  choice: tin
  rationale: Động từ ở thì chưa hoàn thành mô tả tình trạng trong quá khứ; tiếng Việt thường dùng “tin” tự nhiên hơn mà không cần đánh dấu hình thái thì. Khả năng nhấn mạnh tính đang tiếp diễn được ghi ở chú thích.
- source_word: εἰς αὐτόν
  choice: vào Ngài
  rationale: Với πιστεύω, giới từ εἰς diễn tả niềm tin hướng đến một người; “tin vào Ngài” là cách nói rõ ràng, tự nhiên và giữ sắc thái hướng đối tượng.
theological_decisions:
- issue: Ý nghĩa của πιστεύω εἰς αὐτόν trong văn mạch Giăng
  choice: tin vào Chúa Giê-su
  alternative: tin cậy Ngài
  rationale: Cách diễn đạt này trong sách Giăng thường chỉ niềm tin hoặc sự tín thác đặt nơi Chúa Giê-su. Bản dịch giữ nguyên lời xác nhận rằng các anh em Ngài chưa có niềm tin ấy, nhưng không thêm nguyên nhân hay kết luận thần học ngoài câu văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “Ngài” được dùng nhất quán để chỉ Chúa Giê-su. Cụm “các anh em” giữ đúng số nhiều giống đực của nguyên văn nhưng không áp đặt thứ tự tuổi tác.
