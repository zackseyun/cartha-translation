id: JHN.7.12
reference: John 7:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ γογγυσμὸς ⸂περὶ αὐτοῦ ἦν πολὺς⸃ ἐν τοῖς ὄχλοις· οἱ μὲν ἔλεγον ὅτι Ἀγαθός ἐστιν, ἄλλοι ⸀δὲ ἔλεγον· Οὔ, ἀλλὰ πλανᾷ τὸν ὄχλον.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/012.yaml
  text: And there was much murmuring about him among the crowds[a]. Some were saying, “He is good.” Others were saying, “No, on the contrary[b], he is misleading the crowd.”
translation:
  language: vi
  text: 'Trong đám đông có nhiều lời xì xào về người ấy[a]. Một số người nói: “Ông ấy là người tốt.” Nhưng những người khác nói: “Không, trái lại, ông ấy đang làm cho dân chúng lầm lạc.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “nhiều lời càm ràm” hoặc “nhiều lời bàn tán nhỏ to” về người ấy.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “ông ấy lừa dối dân chúng” hoặc “ông ấy dẫn dân chúng đi sai đường.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: γογγυσμός
  choice: lời xì xào
  rationale: Diễn tả lời bàn tán nhỏ tiếng, không công khai; trong ngữ cảnh ý kiến phân rẽ, cách dịch này không giới hạn nghĩa vào sự than phiền.
- source_word: περὶ αὐτοῦ
  choice: về Ngài
  rationale: Chuyển đạt trực tiếp đối tượng của những lời xì xào; “Ngài” là đại từ tôn kính tự nhiên khi lời người kể nhắc đến Chúa Giê-su.
- source_word: πολύς
  choice: nhiều
  rationale: Giữ sắc thái chỉ mức độ lớn của những lời xì xào bằng cách diễn đạt ngắn gọn, tự nhiên.
- source_word: ἐν τοῖς ὄχλοις
  choice: trong đám đông
  rationale: Diễn đạt tự nhiên trong tiếng Việt về lời bàn tán lan truyền giữa quần chúng; tiếng Việt không cần gượng ép thể hiện số nhiều của ὄχλοις.
- source_word: οἱ μὲν ... ἄλλοι δὲ
  choice: Một số người ... Nhưng những người khác ...
  rationale: Thể hiện rõ hai nhóm có nhận định đối lập trong đám đông.
- source_word: Ἀγαθός ἐστιν
  choice: Ông ấy là người tốt
  rationale: Trong lời thoại, “người tốt” diễn đạt tự nhiên nhận định về phẩm chất của một người; không thêm một khẳng định thần học.
- source_word: Οὔ, ἀλλὰ
  choice: Không, trái lại
  rationale: Giữ cả sự phủ nhận trực tiếp lẫn ý sửa lại bằng một nhận định đối nghịch.
- source_word: πλανᾷ
  choice: đang làm cho ... lầm lạc
  rationale: Giữ độ rộng nghĩa giữa gây hiểu sai, lừa dối và dẫn đi sai đường, không mặc nhiên quy kết rõ chủ ý gian dối.
- source_word: τὸν ὄχλον
  choice: dân chúng
  rationale: Phản ánh danh từ tập hợp số ít chỉ quần chúng nói chung và tránh lặp “đám đông” một cách nặng nề trong tiếng Việt.
theological_decisions:
- issue: Những nhận định trái ngược về Chúa Giê-su
  choice: Trình bày trực tiếp cả lời khen lẫn lời cáo buộc mà không xác nhận lời nào là phán quyết của người kể chuyện.
  alternative: Diễn giải lời tích cực như một lời tuyên xưng hoặc lời tiêu cực như lời vu khống.
  rationale: Câu này thuật lại các ý kiến phân rẽ của đám đông; bản dịch cần giữ nguyên sự căng thẳng ấy.
- issue: Mức độ chủ ý trong πλανᾷ
  choice: “làm cho dân chúng lầm lạc”
  alternative: “lừa dối dân chúng”
  rationale: Động từ có thể hàm ý lừa dối hoặc dẫn người khác đi sai đường; lựa chọn chính không quyết định quá mức rằng sự lừa dối là có chủ ý.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Lời người kể dùng “Ngài” khi nói về Chúa Giê-su, còn lời trích của đám đông dùng “ông ấy” để không áp đặt lòng tôn kính lên những người đang tranh luận về Ngài.
