revisions:
- from: Các ông sẽ tìm tôi mà không gặp, và nơi tôi ở, các ông không thể đến được.
  to: Các ông sẽ tìm tôi nhưng sẽ không tìm thấy tôi; các ông không thể đến nơi tôi đang ở.
  rationale: Thay “mà không gặp” bằng “nhưng sẽ không tìm thấy tôi” để bảo toàn ý nghĩa của động từ εὑρίσκω và cặp ý “tìm—tìm thấy.” Thay “nơi tôi ở” bằng “nơi tôi đang ở” để phản ánh tự nhiên thì hiện tại εἰμί trong ngữ cảnh mà không xác định bản chất hay lý do của sự bất khả năng.
