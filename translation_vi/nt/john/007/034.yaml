id: JHN.7.34
reference: John 7:34
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ζητήσετέ με καὶ οὐχ ⸀εὑρήσετε, καὶ ὅπου εἰμὶ ἐγὼ ὑμεῖς οὐ δύνασθε ἐλθεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/034.yaml
  text: You will seek me and will not find me[a], and where I am[b], you are not able to come.
translation:
  language: vi
  text: Các ông sẽ tìm tôi nhưng sẽ không tìm thấy tôi; các ông không thể đến nơi tôi đang ở.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ζητήσετέ με
  choice: các ông sẽ tìm tôi
  rationale: Động từ tương lai chủ động ngôi thứ hai số nhiều diễn tả việc tìm kiếm Chúa Giê-su. “Tìm tôi” tự nhiên trong tiếng Việt hiện đại và phù hợp với ngữ cảnh tìm một người.
- source_word: οὐχ εὑρήσετε
  choice: mà không gặp
  rationale: Trong ngữ cảnh tìm một người, “không gặp” diễn đạt tự nhiên kết quả bất thành của việc tìm kiếm; liên từ “mà” thể hiện rõ sự tương phản giữa tìm và không gặp mà không tăng mức độ phủ định.
- source_word: ὅπου εἰμὶ ἐγώ
  choice: nơi tôi ở
  rationale: Giữ ý nghĩa chỉ địa điểm của ὅπου và sự nhấn mạnh tương phản của đại từ ἐγώ ở mức tự nhiên trong tiếng Việt, không thêm “đó” vốn không có trong nguyên văn.
- source_word: ὑμεῖς οὐ δύνασθε ἐλθεῖν
  choice: các ông không thể đến được
  rationale: “Không thể” giữ rõ nghĩa bất khả năng của δύνασθε, chứ không biến thành sự cấm đoán. “Các ông” cho thấy đối tượng số nhiều là những người đang được Chúa Giê-su nói trực tiếp trong ngữ cảnh.
theological_decisions:
- issue: Bản chất của lời tuyên bố rằng họ không thể đến nơi Chúa Giê-su ở
  choice: Diễn đạt như một sự bất khả năng, không xác định đó là bất khả năng đạo đức, thuộc linh, do phán xét hay chỉ tạm thời.
  alternative: “các ông không được đến” sẽ hàm ý sự cấm phép.
  rationale: δύνασθε nói về khả năng. Chính câu này không giải thích nguyên nhân thần học của sự bất khả năng ấy, nên bản dịch giữ nguyên sức căng của lời tuyên bố.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “các ông” để thể hiện ngôi thứ hai số nhiều và phù hợp với nhóm người đối thoại trong ngữ cảnh; câu văn giữ cấu trúc song hành của nguyên bản.
