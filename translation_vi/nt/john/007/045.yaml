revisions:
- from: 'Vì vậy, các thuộc hạ trở về gặp các thượng tế và người Pha-ri-si. Chính họ hỏi các thuộc hạ: “Tại sao các anh không giải ông ấy về?”'
  to: 'Vì vậy, các viên chức đến gặp các thượng tế và người Pha-ri-si. Chính những người này hỏi họ: “Tại sao các anh không đưa ông ấy về đây?”'
  rationale: Hiệu chỉnh các chỗ thêm ý “trở về” và “giải”, đồng thời dùng “các viên chức” cho nhóm ὑπηρέται. Giữ cấu trúc hai câu và sự nhấn mạnh của ἐκεῖνοι; “về đây” diễn đạt tự nhiên hướng “đưa đến” về phía người đang hỏi mà không khẳng định cách thức áp giải.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T06:21:42Z'
review_pass:
  verdict: revise
  source_fidelity: Bản thảo truyền đạt đúng diễn biến và các nhóm nhân vật chính, nhưng “trở về” thêm ý quay lại không được nêu bởi ἦλθον. “Giải ông ấy về” cụ thể hóa việc áp giải/câu thúc mạnh hơn động từ ἤγαγετε (“đưa, dẫn đến”) và “về” có thể gợi sự trở lại. “Các viên chức” phản ánh tốt hơn ὑπηρέται trong ngữ cảnh những người được sai đi thi hành nhiệm vụ.
  naturalness: Câu sửa giữ văn phong hiện đại, trang trọng vừa phải. “Chính những người này” bảo tồn sắc thái đánh dấu của ἐκεῖνοι mà vẫn làm rõ chủ thể hỏi; “đưa ông ấy về đây” là cách nói tự nhiên trong lời hỏi tại nơi các nhà lãnh đạo đang hiện diện.
  terminology: “Các thượng tế” và “người Pha-ri-si” phù hợp cách gọi chuẩn. “Các viên chức” tránh hiểu ὑπηρέται là thuộc hạ theo địa vị cá nhân hoặc khẳng định cụ thể họ là lính canh Đền Thờ. Không có thuật ngữ thần học cần hiệu chỉnh.
  issues:
  - severity: medium
    issue: “trở về” thêm nét nghĩa không có trong nguyên văn.
    rationale: Ἦλθον chỉ nói họ “đến” gặp các thượng tế và người Pha-ri-si; ngữ cảnh có thể khiến người đọc suy ra họ quay lại, nhưng bản dịch tối ưu-tương-đương không nên khẳng định thêm điều này.
  - severity: medium
    issue: “giải ông ấy về” cụ thể hóa quá mức động từ ἠγάγετε.
    rationale: Động từ mang nghĩa “đưa/dẫn đến”; “giải” nhấn việc áp giải người bị bắt, còn “về” gợi chuyển động trở lại. Dù phù hợp phần nào với ngữ cảnh, các nét này không được phát biểu trực tiếp trong câu.
  - severity: low
    issue: “các thuộc hạ” không phải lựa chọn rõ nhất cho ὑπηρέται.
    rationale: Trong ngữ cảnh này, từ Hy Lạp chỉ các nhân viên/viên chức thi hành nhiệm vụ của giới lãnh đạo, không đơn thuần là người lệ thuộc cá nhân.
