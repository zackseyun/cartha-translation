  text: Ἦλθον οὖν οἱ ὑπηρέται πρὸς τοὺς ἀρχιερεῖς καὶ Φαρισαίους, καὶ εἶπον αὐτοῖς ἐκεῖνοι· Διὰ τί οὐκ ἠγάγετε αὐτόν;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/045.yaml
  text: So the officers came to the chief priests and Pharisees[a], and they said to them[b], “Why did you not bring him?”
translation:
  language: vi
  text: 'Vì vậy, các viên chức đến gặp các thượng tế và người Pha-ri-si. Chính những người này hỏi họ: “Tại sao các anh không đưa ông ấy về đây?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὖν
  choice: Vì vậy
  rationale: Giữ quan hệ tiếp nối/kết quả với diễn biến trước đó; cách nói tự nhiên và trang trọng vừa phải.
- source_word: ὑπηρέται
  choice: các thuộc hạ
  rationale: Chỉ những người thi hành lệnh của giới lãnh đạo; tránh cụ thể hóa thành lính canh đền thờ khi nguyên văn không nói rõ như vậy.
- source_word: ἀρχιερεῖς
  choice: các thượng tế
  rationale: Cách gọi quen thuộc đối với tập thể những người thuộc giới lãnh đạo tư tế.
- source_word: Φαρισαίους
  choice: người Pha-ri-si
  rationale: Phiên âm thông dụng trong tiếng Việt cho tên nhóm Do Thái này.
- source_word: ἐκεῖνοι
  choice: Chính họ
  rationale: Giữ sắc thái nhấn mạnh của đại từ chỉ định và quy chiếu rõ về các thượng tế cùng người Pha-ri-si.
- source_word: Διὰ τί
  choice: Tại sao
  rationale: Tương đương nghi vấn tự nhiên trong tiếng Việt.
- source_word: ἠγάγετε
  choice: không giải ... về
  rationale: Động từ có nghĩa dẫn hoặc đưa; trong ngữ cảnh những thuộc hạ được sai đi bắt Đức Giê-su, “giải ... về” diễn đạt tự nhiên mục đích áp giải đến chỗ nhà chức trách.
- source_word: αὐτόν
  choice: ông ấy
  rationale: Đại từ làm tân ngữ, quy chiếu về Đức Giê-su; “ông ấy” phù hợp lời của giới lãnh đạo trong ngữ cảnh này.
theological_decisions:
- issue: Mức độ cụ thể hóa hành động của ἠγάγετε
  choice: giải ông ấy về
  alternative: đưa ông ấy đến / dẫn ông ấy về
  rationale: Ngữ cảnh cho thấy họ được sai đi bắt Đức Giê-su, nên “giải ... về” truyền đạt chức năng áp giải mà không thêm một kết luận thần học.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, rõ ràng và trang nghiêm. Tách thành hai câu để tránh chuỗi liên từ nặng nề; dùng “Chính họ” nhằm bảo tồn sự nhấn mạnh của ἐκεῖνοι. Không cần chú thích vì các nét nghĩa chính được thể hiện trực tiếp trong bản dịch.
