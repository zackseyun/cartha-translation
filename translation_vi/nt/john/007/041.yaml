  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἄλλοι ἔλεγον· Οὗτός ἐστιν ὁ χριστός· ⸂οἱ δὲ⸃ ἔλεγον· Μὴ γὰρ ἐκ τῆς Γαλιλαίας ὁ χριστὸς ἔρχεται;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/041.yaml
  text: Others were saying[a], “This is the Messiah.” But some were saying, “Surely the Messiah does not come from Galilee[b], does he?”
translation:
  language: vi
  text: 'Những người khác nói: “Người này là Đấng Mê-si-a.” Nhưng một số người lại nói: “Chẳng lẽ Đấng Mê-si-a đến từ Ga-li-lê sao?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄλλοι
  choice: Những người khác
  rationale: Tính từ được dùng như danh từ số nhiều, chỉ một nhóm khác trong đám đông; cách dịch này giữ rõ sự phân nhóm.
- source_word: ἔλεγον
  choice: nói
  rationale: Thì chưa hoàn thành diễn tả lời bàn luận đang diễn ra; trong tiếng Việt, “nói” trong ngữ cảnh này tự nhiên và không cần thêm dấu hiệu thể bắt buộc.
- source_word: Οὗτός ἐστιν
  choice: Người này là
  rationale: Cách chỉ định và nhận diện tự nhiên trong tiếng Việt, đồng thời cho thấy đối tượng là một người.
- source_word: ὁ χριστός
  choice: Đấng Mê-si-a
  rationale: Ở đây Χριστός là tước hiệu của nhân vật được mong đợi; “Đấng Mê-si-a” bảo tồn sắc thái Do Thái và chức năng tước hiệu.
- source_word: οἱ δὲ
  choice: Nhưng một số người lại
  rationale: Cụm này đưa vào một nhóm đối lập; “nhưng… lại” thể hiện rõ tương phản, còn “một số người” tránh lặp nặng nề.
- source_word: Μὴ γὰρ
  choice: Chẳng lẽ… sao?
  rationale: Cấu trúc câu hỏi với μή mong đợi câu trả lời phủ định; “chẳng lẽ… sao?” truyền đạt tự nhiên sắc thái hoài nghi/phản bác, còn lực của γάρ được hòa vào toàn câu.
- source_word: ἐκ τῆς Γαλιλαίας
  choice: từ Ga-li-lê
  rationale: ἐκ chỉ nguồn gốc hoặc nơi xuất phát; “từ” là tương đương tự nhiên trong tiếng Việt.
- source_word: ἔρχεται
  choice: đến
  rationale: Hiện tại được dùng trong lời khẳng định mang tính kỳ vọng chung; “đến” giữ được sự mở giữa nguồn gốc và sự xuất hiện từ một nơi.
theological_decisions:
- issue: Cách dịch Χριστός như một tước hiệu
  choice: Đấng Mê-si-a
  alternative: Đấng Christ / Đấng Ki-tô
  rationale: Trong câu này, đám đông đang tranh luận về căn tính của nhân vật được mong đợi, nên Χριστός hoạt động như tước hiệu cứu thế chứ không phải tên riêng. “Đấng Mê-si-a” giữ rõ nền tảng Do Thái mà không áp đặt cách dùng riêng của một truyền thống hệ phái.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Câu hỏi tu từ “Chẳng lẽ… sao?” giữ kỳ vọng về câu trả lời phủ định mà không làm mất giọng tranh luận của đám đông. Không thêm chú thích vì không có biến thể văn bản hoặc nét nghĩa thiết yếu nào cần ghi ngoài câu chính.
