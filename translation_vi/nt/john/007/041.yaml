  source_fidelity: Bản dịch truyền đạt trung thành cấu trúc hai nhóm người trong đám đông (ἄλλοι ... οἱ δέ), lời nhận diện “Người này là Đấng Mê-si-a,” và câu hỏi tu từ phủ định do μή γάρ mở đầu. “Chẳng lẽ ... sao?” diễn đạt đúng kỳ vọng về câu trả lời phủ định. “đến từ Ga-li-lê” giữ được cách nói về xuất xứ/nơi mà Đấng Mê-si-a được cho là phải đến từ, không thêm diễn giải.
