  terminology: “Cha” viết hoa trong lời Đức Giê-su nhất quán với quy chiếu Đức Chúa Trời trong văn mạch. Cách xưng hô “các ông” và “tôi” tự nhiên, giữ được sự đối lập giữa Đức Giê-su và nhóm người nghe. “Biết” bảo toàn sự lặp lại của οἶδα và không diễn giải quá mức.
