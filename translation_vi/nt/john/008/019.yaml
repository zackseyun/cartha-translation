source:
  edition: SBLGNT
  text: ἔλεγον οὖν αὐτῷ· Ποῦ ἐστιν ὁ πατήρ σου; ἀπεκρίθη Ἰησοῦς· Οὔτε ἐμὲ οἴδατε οὔτε τὸν πατέρα μου· εἰ ἐμὲ ᾔδειτε, καὶ τὸν πατέρα μου ⸂ἂν ᾔδειτε⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/019.yaml
  text: So they were saying to him[a], “Where is your Father?” Jesus answered, “You know neither me nor my Father. If you knew me, you would know my Father also.”
translation:
  language: vi
  text: 'Vậy, họ hỏi Ngài: “Cha của ông ở đâu?” Đức Giê-su đáp: “Các ông chẳng biết tôi, cũng chẳng biết Cha tôi. Nếu các ông biết tôi thì các ông cũng biết Cha tôi[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch theo cách nhấn mạnh tính trái với thực tế: “Nếu các ông đã biết tôi thì hẳn cũng đã biết Cha tôi.”'
    reason: Biến thể diễn đạt sắc thái phản thực của câu điều kiện Hy Lạp.
lexical_decisions:
- source_word: ἔλεγον
  choice: họ hỏi
  rationale: Thì chưa hoàn thành có thể gợi hành động đang diễn ra hoặc lặp lại; trong tiếng Việt, “họ hỏi” là cách kể tự nhiên trong ngữ cảnh đối thoại, còn “cứ hỏi” dễ nhấn quá mức ý lặp lại. Dùng “hỏi” thay cho nghĩa sát chữ “nói” vì lời trực tiếp là một câu hỏi.
- source_word: οὖν
  choice: Vì thế
  rationale: Giữ quan hệ tiếp nối hoặc suy luận với phần trước, đồng thời vẫn tự nhiên trong văn kể hiện đại.
- source_word: Ποῦ ἐστιν ὁ πατήρ σου;
  choice: Cha của ông ở đâu?
  rationale: Câu hỏi trực tiếp được giữ nguyên. Viết hoa “Cha” để cho thấy đối tượng được nói đến là Đức Chúa Trời trong văn mạch Giăng, dù những người hỏi chưa hiểu đúng điều đó.
- source_word: Οὔτε ἐμὲ οἴδατε οὔτε τὸν πατέρα μου
  choice: Các ông chẳng biết tôi, cũng chẳng biết Cha tôi
  rationale: Cấu trúc “chẳng… cũng chẳng…” truyền đạt tự nhiên cặp phủ định οὔτε…οὔτε. “Biết” giữ được phạm vi nghĩa rộng, gồm cả biết, nhận ra và có sự nhận biết mang tính quan hệ.
- source_word: οἶδατε / ᾔδειτε
  choice: biết
  rationale: Lặp lại cùng một từ để bảo toàn mối liên hệ từ vựng giữa việc biết Đức Giê-su và biết Cha, không thu hẹp nghĩa thành chỉ “hiểu” hay “nhận ra”.
- source_word: εἰ ἐμὲ ᾔδειτε, καὶ τὸν πατέρα μου ἂν ᾔδειτε
  choice: Nếu các ông biết tôi thì cũng biết Cha tôi
  rationale: Cách diễn đạt này tự nhiên trong tiếng Việt và có thể truyền đạt điều kiện trái với thực tế ở hiện tại. “Cũng” thể hiện καί mà không áp đặt sắc thái thời quá khứ.
theological_decisions:
- issue: Viết hoa danh xưng “Cha” khi chỉ Đức Chúa Trời
  choice: Viết hoa “Cha” trong cả câu hỏi lẫn lời Đức Giê-su
  alternative: Viết thường “cha”
  rationale: Văn mạch xác định Cha của Đức Giê-su là Đức Chúa Trời. Viết hoa giúp độc giả nhận ra đối tượng quy chiếu nhưng không xóa đi sự hiểu lầm đầy mỉa mai của những người đối thoại.
- issue: Sắc thái của việc biết Đức Giê-su và biết Cha
  choice: Giữ từ rộng nghĩa “biết”
  alternative: “nhận ra” hoặc “hiểu”
  rationale: “Biết” bảo toàn mối liên hệ thần học trong câu và sự căng thẳng của cách dùng trong sách Giăng, thay vì giới hạn ý nghĩa vào nhận thức trí tuệ hoặc sự nhận diện.
- issue: Sắc thái của câu điều kiện
  choice: 'Diễn đạt như điều kiện trái với thực tế ở hiện tại: “Nếu… biết… thì cũng biết…”'
  alternative: “Nếu các ông đã biết tôi thì hẳn cũng đã biết Cha tôi”
  rationale: Dạng ᾔδειτε với ἄν tự nhiên mang lực phản thực, nhưng hình thức Hy Lạp có thể được thể hiện theo cách nhấn mạnh hơn về tính phản thực. Bản chính tránh khiến độc giả hiểu câu chủ yếu nói về một thời điểm quá khứ.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Đức Giê-su” trong lời kể, “Ngài” làm đại từ tôn kính của người kể, “các ông” cho số nhiều đối thoại và “tôi” trong lời Đức Giê-su. Tránh lối cổ như “các ngươi” và tránh giải nghĩa thần học quá mức ngay trong câu.
