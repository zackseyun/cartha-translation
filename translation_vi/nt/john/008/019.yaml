  source_fidelity: 'Bản dịch truyền đạt đúng nội dung chính: nhóm người đối thoại hỏi về Cha của Đức Giê-su; Đức Giê-su nói họ không biết cả Ngài lẫn Cha Ngài; và mệnh đề điều kiện dùng lối phản thực với thì chưa hoàn thành và ἄν được giữ mà không ép thành quá khứ. Tuy nhiên, “Vì thế” có thể gợi quan hệ nguyên nhân-kết quả mạnh hơn sắc thái tiếp nối/suy luận linh hoạt của οὖν. “Vậy” phù hợp hơn trong ngữ cảnh đối thoại.'
