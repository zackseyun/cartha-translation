  yaml_path: translation/nt/john/008/008.yaml
  text: And again[a], he stooped down and wrote on the ground.
translation:
  language: vi
  text: Rồi Ngài lại cúi xuống và viết trên đất.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Đây là phần tiếp theo của câu chuyện về người phụ nữ bị bắt quả tang phạm tội ngoại tình (Giăng 7:53–8:11). Xem chú thích ở Giăng 7:53.
    reason: textual_critical
lexical_decisions:
- source_word: πάλιν
  choice: lại
  rationale: Diễn tả việc Đức Giê-su lặp lại hành động đã được kể trước đó.
- source_word: κάτω κύψας
  choice: cúi xuống
  rationale: Cụm này chỉ động tác khom người về phía trước và xuống thấp; “cúi xuống” tự nhiên, rõ nghĩa trong tiếng Việt.
- source_word: ἔγραφεν
  choice: viết
  rationale: Động từ ở thì chưa hoàn thành có thể gợi hành động đang tiếp diễn, nhưng trong mạch kể tiếng Việt, “viết” vừa tự nhiên vừa không loại trừ sắc thái ấy.
- source_word: εἰς τὴν γῆν
  choice: trên đất
  rationale: Trong ngữ cảnh, γῆ chỉ bề mặt đất ngay trước mặt Ngài; tiếng Việt tự nhiên dùng “viết trên đất”.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “Ngài” phù hợp với cách gọi Đức Giê-su trong văn mạch Kinh Thánh tiếng Việt; không thêm đối tượng hay nội dung của điều được viết.
