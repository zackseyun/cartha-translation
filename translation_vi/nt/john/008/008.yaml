  source_fidelity: 'Bản dịch truyền đạt đúng các yếu tố của tiếng Hy Lạp: πάλιν là “lại”, κάτω κύψας là “cúi xuống”, và ἔγραφεν εἰς τὴν γῆν là “viết trên đất”. Cách chuyển động từ chưa hoàn thành ἔγραφεν bằng “viết” là tự nhiên trong văn kể tiếng Việt và không thêm nội dung về điều Ngài viết.'
