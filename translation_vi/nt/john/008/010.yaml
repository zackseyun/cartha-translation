  text: Ἀνακύψας δὲ ὁ Ἰησοῦς, καὶ μηδένα θεασάμενος πλὴν τῆς γυναικός, εἶπεν αὐτῇ, Ἡ γυνή, ποῦ εἰσιν ἐκεῖνοι οἱ κατήγοροί σου; Οὐδείς σε κατέκρινεν;
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/john/008/010.yaml
  text: Then Jesus[a] straightened up, and seeing no one except the woman, said to her, "Woman, where are those accusers of yours? Has no one condemned you?"
translation:
  language: vi
  text: 'Rồi Đức Chúa Jêsus[a] đứng thẳng lên, không thấy ai ngoài người phụ nữ, thì nói với bà: “Này bà, những người tố cáo bà đâu rồi? Không ai kết án bà sao?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Câu này thuộc câu chuyện về người phụ nữ bị bắt quả tang phạm tội ngoại tình (Giăng 7:53–8:11), một phân đoạn không có trong các thủ bản Hy Lạp sớm nhất. Xem chú thích ở Giăng 7:53.
    reason: textual_critical
lexical_decisions:
- source_word: ἀνακύψας
  choice: đứng thẳng lên
  rationale: Diễn tả việc Đức Chúa Jêsus nâng người lên sau khi cúi xuống viết trên đất; cách nói này tự nhiên trong tiếng Việt và giữ mối liên hệ với ngữ cảnh trước.
- source_word: θεασάμενος
  choice: thấy
  rationale: Phân từ chỉ sự nhận thấy bằng mắt; “thấy” truyền đạt trực tiếp việc đám đông đã rời đi.
- source_word: πλὴν τῆς γυναικός
  choice: ngoài người phụ nữ
  rationale: Giữ sát ý ngoại trừ của πλὴν và không thêm thông tin ngoài bản Hy Lạp.
- source_word: Ἡ γυνή
  choice: Này bà
  rationale: Trong lời xưng hô trực tiếp, “Này bà” vừa tự nhiên, trang trọng vừa tránh sắc thái thiếu tôn trọng mà “đàn bà” có thể mang trong tiếng Việt hiện đại.
- source_word: οἱ κατήγοροί σου
  choice: những người tố cáo bà
  rationale: Truyền đạt rõ sắc thái pháp lý của κατήγοροι trong bối cảnh họ đưa ra lời buộc tội.
- source_word: κατέκρινεν
  choice: kết án
  rationale: Giữ sắc thái pháp lý của việc tuyên án có tội, mạnh và chính xác hơn từ khái quát “xét đoán”.
theological_decisions:
- issue: Tình trạng văn bản của Giăng 7:53–8:11
  choice: Giữ câu theo bản Hy Lạp Byzantine được chỉ định và đánh dấu chú thích phê bình văn bản tại tên Đức Chúa Jêsus.
  alternative: Loại câu khỏi chính văn hoặc để trong ngoặc kép/ngoặc vuông.
  rationale: Nguồn được giao có câu này, nên bản dịch trình bày đầy đủ; chú thích minh bạch rằng phân đoạn không có trong các thủ bản Hy Lạp sớm nhất mà không tự quyết định vấn đề tính kinh điển.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Jêsus” theo lối gọi Tin Lành quen thuộc; đại từ “bà” thể hiện sự tôn trọng trong lời trực tiếp. Cấu trúc câu được làm tự nhiên nhưng vẫn giữ trình tự và nội dung pháp lý của nguyên văn.
