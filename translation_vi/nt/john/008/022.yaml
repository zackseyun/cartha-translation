id: JHN.8.22
reference: John 8:22
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἔλεγον οὖν οἱ Ἰουδαῖοι· Μήτι ἀποκτενεῖ ἑαυτὸν ὅτι λέγει· Ὅπου ἐγὼ ὑπάγω ὑμεῖς οὐ δύνασθε ἐλθεῖν;
base_translation:
  language: en
  yaml_path: translation/nt/john/008/022.yaml
  text: So the Jews were saying[a], “Surely he will not kill himself, since he says, ‘Where I am going, you cannot come’?”
translation:
  language: vi
  text: 'Vì thế, người Do Thái[a] bàn với nhau: “Chẳng lẽ ông ấy sẽ tự sát, vì ông ấy nói: ‘Nơi tôi đi, các ông không thể đến’?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Trong văn cảnh Tin Mừng Giăng, cũng có thể hiểu là “người Giu-đê” hoặc “các nhà lãnh đạo Do Thái,” tùy phạm vi quy chiếu mà tác giả hàm ý tại đây.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγον
  choice: nói
  rationale: Thì vị hoàn thành diễn tả lời bàn đang diễn ra trong mạch kể; tiếng Việt tự nhiên thường không cần thêm dấu hiệu thể như “đang” hoặc “cứ” khi ngữ cảnh đã rõ.
- source_word: οὖν
  choice: Vì thế
  rationale: Giữ quan hệ suy luận từ lời Đức Giê-su vừa phán, đồng thời phù hợp với văn phong trang trọng, hiện đại.
- source_word: οἱ Ἰουδαῖοι
  choice: người Do Thái
  rationale: Giữ phạm vi từ vựng rộng của cụm Hy Lạp, không tự ý thu hẹp thành giới lãnh đạo hay người Giu-đê; chú thích nêu các khả năng theo văn cảnh.
- source_word: Μήτι
  choice: Chẳng lẽ ...
  rationale: Diễn đạt tự nhiên một câu hỏi thiên về mong đợi câu trả lời phủ định, đồng thời thể hiện sự suy đoán hoài nghi.
- source_word: ἀποκτενεῖ ἑαυτόν
  choice: sẽ tự sát
  rationale: Diễn đạt trực tiếp hành động giết chính mình; “tự sát” ngắn gọn, rõ nghĩa và trang trọng trong tiếng Việt hiện đại.
- source_word: ὅτι
  choice: nên mới
  rationale: Trong câu hỏi này, liên từ nối lời Đức Giê-su với căn cứ cho suy đoán của họ; “nên mới nói” diễn đạt tự nhiên ý ‘vì thế mà nói’ mà không làm thay đổi quan hệ lập luận.
- source_word: λέγει
  choice: nói
  rationale: Tiếng Việt không bắt buộc đánh dấu thì hiện tại; cách dịch này giữ lời dẫn trực tiếp tự nhiên.
- source_word: Ὅπου ἐγὼ ὑπάγω
  choice: Nơi tôi đi
  rationale: Giữ nghĩa chuyển động của ὑπάγω mà không diễn giải quá mức điểm đến hay việc ra đi.
- source_word: οὐ δύνασθε ἐλθεῖν
  choice: các ông không thể đến
  rationale: Giữ rõ ý không có khả năng đến; “các ông” phù hợp với lời Đức Giê-su nói với nhóm đối thoại nam giới trong văn cảnh và phân biệt với đại từ ngôi thứ nhất.
theological_decisions:
- issue: Phạm vi chỉ định của οἱ Ἰουδαῖοι trong Tin Mừng Giăng
  choice: Giữ “người Do Thái” trong chính văn
  alternative: “người Giu-đê” hoặc “các nhà lãnh đạo Do Thái”
  rationale: Cụm Hy Lạp tự nó có phạm vi rộng và câu này không xác định rõ hơn. Thu hẹp ngay trong chính văn có thể giải quyết một sự mơ hồ mà nguyên bản vẫn để ngỏ; chú thích cung cấp các khả năng theo văn cảnh.
- issue: Hàm ý về cái chết và nơi Đức Giê-su đi
  choice: Không giải thích thêm trong câu dịch
  alternative: Làm rõ rằng họ hiểu lầm lời Đức Giê-su là nói về tự sát hoặc cõi chết
  rationale: Câu văn trình bày suy đoán của những người đối thoại nhưng không trực tiếp giải thích toàn bộ hàm ý thần học; bản dịch giữ nguyên sự căng thẳng và hiểu lầm trong trình thuật.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “Chẳng lẽ” để giữ sắc thái câu hỏi mong đợi phủ định; tránh cách diễn đạt cổ và tránh thu hẹp nhóm người được nói đến ngoài điều nguyên bản xác định.
