  text: Ἡ δὲ εἶπεν, Οὐδείς, κύριε. Εἶπεν δὲ ὁ Ἰησοῦς, Οὐδὲ ἐγώ σε κατακρίνω· πορεύου, καὶ μηκέτι ἁμάρτανε.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/john/008/011.yaml
  text: She[a] said, "No one, Lord." And Jesus said, "Neither do I condemn you; go, and sin no more."
translation:
  language: vi
  text: 'Người phụ nữ[a] đáp: “Không ai cả, thưa ngài.” Giê-su nói: “Tôi cũng không kết án cô. Hãy đi, từ nay đừng phạm tội nữa.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Đây là câu cuối của câu chuyện người phụ nữ bị bắt quả tang phạm tội ngoại tình (Giăng 7:53–8:11). Xem chú thích ở Giăng 7:53.
    reason: textual_critical
lexical_decisions:
- source_word: κύριε
  choice: thưa Chúa
  rationale: Dạng hô cách có thể là lời xưng hô lịch sự (“thưa ngài”), nhưng “thưa Chúa” giữ được sự nhìn nhận thẩm quyền của Đức Chúa Jêsus và phù hợp truyền thống dịch, mà không thêm ý ngoài văn bản.
- source_word: κατακρίνω
  choice: kết án
  rationale: Từ này mang sắc thái tư pháp là tuyên án bất lợi; “kết án” tự nhiên và chính xác trong bối cảnh người phụ nữ đang đứng trước lời buộc tội.
- source_word: μηκέτι ἁμάρτανε
  choice: từ nay đừng phạm tội nữa
  rationale: “Từ nay… nữa” thể hiện rõ ý chấm dứt hành vi kể từ thời điểm này, còn “phạm tội” chuyển tải trực tiếp động từ ἁμαρτάνω.
- source_word: πορεύου
  choice: hãy đi
  rationale: Mệnh lệnh hiện tại được chuyển bằng cách nói tự nhiên, trang trọng và trực tiếp trong tiếng Việt.
- source_word: Ἡ
  choice: Bà
  rationale: Đại từ giống cái chỉ người phụ nữ trong mạch truyện; “bà” là cách gọi tôn trọng, tự nhiên trong tiếng Việt hiện đại.
theological_decisions:
- issue: Cách hiểu κύριε trong lời người phụ nữ
  choice: thưa Chúa
  alternative: thưa ngài
  rationale: Tiếng Hy Lạp cho phép cả lời xưng hô lịch sự lẫn sự nhìn nhận thẩm quyền. Bản dịch giữ cách gọi truyền thống “Chúa” nhưng không diễn giải thêm mức độ nhận thức hay đức tin của người phụ nữ.
- issue: Mối quan hệ giữa việc không kết án và mệnh lệnh thôi phạm tội
  choice: Giữ nguyên hai vế song song, không thêm lời giải thích
  alternative: Diễn giải thành sự tha thứ có điều kiện hoặc sự tuyên bố trắng án
  rationale: Văn bản vừa ghi lời Đức Chúa Jêsus không kết án, vừa truyền người phụ nữ thôi phạm tội; không nên giải quyết căng thẳng thần học này bằng nội dung không có trong nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “thưa” để lời đáp tự nhiên; dùng “phán” và đại từ “Ta” trong lời Đức Chúa Jêsus nhằm duy trì sắc thái Kinh Thánh trang nghiêm. Dấu chú thích [a] được đặt ngay sau chủ thể mà chú thích liên quan.
