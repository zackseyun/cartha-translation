  rationale: Bản sửa giữ sát cấu trúc và ý nghĩa nguyên văn, dùng “thưa ngài” để không áp đặt cách hiểu về κύριε, và chỉ gọi nhân vật là “Giê-su” như văn bản Hy Lạp. Cách diễn đạt được cập nhật cho tiếng Việt chuẩn hiện đại mà không thay đổi ý nghĩa hoặc lập trường thần học.
