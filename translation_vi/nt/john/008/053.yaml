id: JHN.8.53
reference: John 8:53
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: μὴ σὺ μείζων εἶ τοῦ πατρὸς ἡμῶν Ἀβραάμ, ὅστις ἀπέθανεν; καὶ οἱ προφῆται ἀπέθανον· τίνα ⸀σεαυτὸν ποιεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/john/008/053.yaml
  text: Surely you are not greater than our father Abraham[a], who died? The prophets also died[b]. Who do you make yourself out to be?
translation:
  language: vi
  text: Chẳng lẽ ông lại lớn hơn tổ phụ chúng tôi là Áp-ra-ham, người đã chết sao?[a] Các nhà tiên tri cũng đã chết. Ông tự cho mình là ai?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát nghĩa hơn: “Ông không lớn hơn tổ phụ chúng tôi là Áp-ra-ham... phải không?” Câu hỏi Hy Lạp được đặt theo cách chờ đợi câu trả lời phủ định.'
    reason: lexical_alternative
  - marker: b
    text: 'Sát nghĩa: “Ông làm cho mình thành ai?” Thành ngữ này có nghĩa là “Ông tự cho mình là ai?” hoặc “Ông tự nhận mình là ai?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ σὺ
  choice: Chẳng lẽ ông lại
  rationale: μή mở đầu câu hỏi tu từ chờ đợi câu trả lời phủ định; “Chẳng lẽ... lại” diễn đạt tự nhiên sắc thái hoài nghi và đối đầu trong tiếng Việt.
- source_word: μείζων
  choice: lớn hơn
  rationale: Giữ phạm vi nghĩa rộng của từ so sánh, bao gồm địa vị và tầm quan trọng, mà không diễn giải quá mức thành một loại ưu thế cụ thể.
- source_word: τοῦ πατρὸς ἡμῶν Ἀβραάμ
  choice: hơn tổ phụ chúng tôi là Áp-ra-ham
  rationale: Danh từ πατήρ ở đây chỉ Áp-ra-ham như vị tổ tiên được kính trọng của dân tộc; “tổ phụ” tự nhiên và tránh bị hiểu là cha ruột.
- source_word: ὅστις ἀπέθανεν
  choice: người đã chết
  rationale: Thể aorist nêu sự kiện lịch sử về cái chết của Áp-ra-ham; “đã chết” truyền đạt trực tiếp sự kiện ấy.
- source_word: καὶ οἱ προφῆται ἀπέθανον
  choice: Các nhà tiên tri cũng đã chết
  rationale: καί bổ sung một trường hợp song song; “cũng” giữ rõ lập luận rằng cả Áp-ra-ham lẫn các nhà tiên tri đều đã chết.
- source_word: τίνα σεαυτὸν ποιεῖς
  choice: Ông tự cho mình là ai?
  rationale: Diễn đạt tự nhiên thành ngữ mang nghĩa tự nhận hoặc tự trình bày mình là một nhân vật nào đó, đồng thời giữ sắc thái chất vấn.
theological_decisions:
- issue: Lời thách thức về địa vị của Đức Chúa Jêsus so với Áp-ra-ham và các nhà tiên tri
  choice: Dùng câu hỏi tu từ “Chẳng lẽ ông lại lớn hơn...” để giữ sự phủ nhận đầy đối đầu mà người nói mong đợi.
  alternative: 'Câu hỏi trung tính hơn: “Ông có lớn hơn tổ phụ chúng tôi là Áp-ra-ham không?”'
  rationale: μή cho thấy câu hỏi chờ đợi câu trả lời phủ định. Bản dịch giữ nguyên căng thẳng về thân phận và thẩm quyền của Đức Chúa Jêsus mà không đưa lời giải thần học vào câu nói.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Ông” giữ sắc thái trực tiếp của σύ mà không tự thêm sự kính trọng; “tổ phụ” làm rõ quan hệ tổ tiên và địa vị đáng kính của Áp-ra-ham. Các dấu [a], [b] đều xuất hiện trong chính văn.
