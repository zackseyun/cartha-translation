source:
  edition: SBLGNT
  text: εἶπεν ⸀αὐτοῖς Ἰησοῦς· Ἀμὴν ἀμὴν λέγω ὑμῖν, πρὶν Ἀβραὰμ γενέσθαι ἐγὼ εἰμί.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/058.yaml
  text: Jesus said to them[a], “Truly, truly, I say to you, before Abraham came to be[b], I am.”
translation:
  language: vi
  text: 'Đức Giê-su nói với họ: “Thật vậy, thật vậy, Ta nói với các ông: trước khi Áp-ra-ham bắt đầu hiện hữu[a], Ta là[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “được sinh ra.” Động từ Hy Lạp có nghĩa rộng hơn: “bắt đầu hiện hữu” hoặc “đi vào hiện hữu.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “Ta đã hiện hữu.” Nguyên văn Hy Lạp là “Ta là,” giữ dạng hiện tại và sắc thái thần học có thể có của lời này.'
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπεν αὐτοῖς Ἰησοῦς
  choice: Đức Giê-su nói với họ
  rationale: Chuyển sát lời dẫn chuyện Hy Lạp, dùng cách gọi tên trang trọng nhưng tự nhiên trong tiếng Việt hiện đại.
- source_word: Ἀμὴν ἀμὴν
  choice: Thật, thật
  rationale: Giữ nguyên sự lặp đôi đầy nhấn mạnh trong công thức long trọng của Đức Giê-su, thay vì làm nhẹ thành một trạng từ đơn.
- source_word: λέγω ὑμῖν
  choice: tôi nói với các ông
  rationale: Phản ánh trực tiếp công thức λέγω ὑμῖν; “các ông” phù hợp với nhóm người đối thoại trong ngữ cảnh mà không thêm sắc thái miệt thị.
- source_word: πρὶν
  choice: trước khi
  rationale: Là liên từ thời gian tự nhiên và tương ứng trực tiếp trong tiếng Việt.
- source_word: Ἀβραὰμ
  choice: Áp-ra-ham
  rationale: Dùng dạng phiên âm tên riêng quen thuộc trong tiếng Việt.
- source_word: γενέσθαι
  choice: trở nên hiện hữu
  rationale: Giữ nghĩa rộng của γίνομαι là đi vào tình trạng hiện hữu, không thu hẹp thành việc được sinh ra; đồng thời duy trì sự tương phản với ἐγὼ εἰμί.
- source_word: ἐγὼ εἰμί
  choice: Ta là
  rationale: Giữ dạng hiện tại và cấu trúc tuyệt đối nổi bật của tiếng Hy Lạp. “Ta” làm rõ đại từ chủ ngữ được nêu tường minh và mang sắc thái long trọng; không bổ sung vị ngữ nhằm bảo toàn độ căng và âm hưởng thần học của câu.
theological_decisions:
- issue: Cách dịch ἐγὼ εἰμί trong ngữ cảnh mang sức nặng Cơ Đốc luận
  choice: Ta là
  alternative: Ta đã hiện hữu
  rationale: “Ta là” phản ánh trực tiếp thì hiện tại và dạng diễn đạt tuyệt đối của nguyên văn, để ngỏ âm hưởng có thể liên quan đến lời tự xưng thần linh mà không giải thích thay cho bản văn. “Ta đã hiện hữu” tự nhiên hơn về thời gian nhưng có thể thu hẹp ý chỉ còn sự tiền hiện hữu.
- issue: Phạm vi nghĩa của γενέσθαι
  choice: trở nên hiện hữu
  alternative: được sinh ra
  rationale: Động từ Hy Lạp rộng hơn việc sinh ra về thể xác. Bản dịch chính giữ phạm vi nghĩa rộng và sự đối lập về mặt diễn đạt với “Ta là”; cách hiểu về sự ra đời được ghi ở chú thích.
translation_notes:
  register: Văn phong trang trọng, trực tiếp và dễ hiểu. Sự lặp “Thật, thật” cùng cụm tuyệt đối “Ta là” được giữ lại dù khác lối diễn đạt thông thường, vì đây là những nét tu từ và thần học nổi bật của nguyên văn. Mọi dấu chú thích [a], [b] đều được đặt đúng tại cụm từ liên quan trong chính văn.
