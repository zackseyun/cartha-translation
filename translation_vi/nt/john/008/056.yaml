  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἀβραὰμ ὁ πατὴρ ὑμῶν ἠγαλλιάσατο ἵνα ἴδῃ τὴν ἡμέραν τὴν ἐμήν, καὶ εἶδεν καὶ ἐχάρη.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/056.yaml
  text: Abraham your father rejoiced to see my day[b][a]; he saw it and was glad.
translation:
  language: vi
  text: Áp-ra-ham, tổ phụ của các ông, đã hân hoan mong được thấy ngày của tôi[a][b]; ông đã thấy và vui mừng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đã hân hoan để được thấy ngày của tôi” hoặc “đã hân hoan vì sẽ được thấy ngày của tôi.” Mệnh đề với ἵνα trong tiếng Hy Lạp có thể được hiểu theo vài cách gần nhau.'
    reason: lexical_alternative
  - marker: b
    text: “Ngày của tôi” có thể chỉ rộng đến ngày thuộc thời Đấng Mê-si của Chúa Giê-su hoặc sự ứng nghiệm nơi ngài; chính câu này không xác định chính xác biến cố hay thời điểm nào.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀβραὰμ
  choice: Áp-ra-ham
  rationale: Dùng dạng tên riêng quen thuộc trong tiếng Việt hiện đại cho vị tổ phụ.
- source_word: ὁ πατὴρ ὑμῶν
  choice: tổ phụ của các ông
  rationale: Trong ngữ cảnh tranh luận về dòng dõi Áp-ra-ham, “tổ phụ” diễn đạt tự nhiên quan hệ tổ tiên; “các ông” giữ ngôi số nhiều trong lời trực tiếp.
- source_word: ἠγαλλιάσατο
  choice: đã hân hoan
  rationale: Diễn đạt niềm vui mãnh liệt của ἀγαλλιάω và phân biệt với ἐχάρη ở cuối câu.
- source_word: ἵνα ἴδῃ
  choice: mong được thấy
  rationale: Diễn đạt tự nhiên sự hướng tới điều sẽ thấy, đồng thời không khẳng định quá chặt ἵνα chỉ mang nghĩa mục đích hay nội dung.
- source_word: τὴν ἡμέραν τὴν ἐμήν
  choice: ngày của tôi
  rationale: Giữ hình thức và sức gợi thần học của nguyên văn, không tự ý xác định đó là biến cố hay thời điểm nào.
- source_word: καὶ εἶδεν
  choice: ông đã thấy
  rationale: Tiếng Hy Lạp không lặp lại tân ngữ; tiếng Việt cũng có thể để “thấy” tuyệt đối, với đối tượng được hiểu từ mệnh đề trước.
- source_word: καὶ ἐχάρη
  choice: và vui mừng
  rationale: Diễn đạt χαίρω tự nhiên và giữ phần nào sự phân biệt với động từ mạnh hơn ἠγαλλιάσατο.
theological_decisions:
- issue: Ý nghĩa của “ngày của tôi”
  choice: Giữ nguyên cụm “ngày của tôi”, không xác định biến cố cụ thể.
  alternative: Diễn giải là ngày Đấng Mê-si, chức vụ trên đất, sự chết và phục sinh, hoặc ngày hiện đến cuối cùng của Chúa Giê-su.
  rationale: Bản thân câu này không định rõ biến cố hay thời điểm nào, nên bản dịch cần bảo toàn độ mở thần học.
- issue: Sắc thái của mệnh đề ἵνα ἴδῃ
  choice: “mong được thấy”
  alternative: “để thấy”, “vì sẽ được thấy”, hoặc “hân hoan thấy”.
  rationale: Cấu trúc ἵνα có thể được hiểu theo những sắc thái gần nhau như mục đích, nội dung hoặc niềm trông đợi; lựa chọn này tự nhiên trong tiếng Việt mà không giải quyết dứt khoát sự nhập nhằng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “các ông” phù hợp lời tranh luận trực tiếp; dùng “tổ phụ” thay vì “cha” để tránh khiến độc giả hiện đại hiểu là cha ruột.
