id: JHN.8.40
reference: John 8:40
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: νῦν δὲ ζητεῖτέ με ἀποκτεῖναι, ἄνθρωπον ὃς τὴν ἀλήθειαν ὑμῖν λελάληκα ἣν ἤκουσα παρὰ τοῦ θεοῦ· τοῦτο Ἀβραὰμ οὐκ ἐποίησεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/040.yaml
  text: But now you are seeking to kill me, a man who has told you the truth that I heard from God. Abraham did not do this.
translation:
  language: vi
  text: Nhưng bây giờ, các ông tìm cách giết tôi, một người đã nói cho các ông sự thật mà tôi nghe từ Đức Chúa Trời. Áp-ra-ham đã không làm điều đó.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νῦν δὲ
  choice: Nhưng bây giờ
  rationale: Giữ cả ý tương phản của δέ và ý thời gian của νῦν bằng cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: ζητεῖτέ με ἀποκτεῖναι
  choice: các ông lại tìm cách giết tôi
  rationale: “Tìm cách” diễn đạt ý chủ tâm đang theo đuổi của ζητέω đi với động từ nguyên mẫu; “lại” làm rõ nét tương phản trong văn cảnh mà không thay đổi nội dung hành động.
- source_word: ἀποκτεῖναι
  choice: giết
  rationale: Tương đương trực tiếp, không thêm sắc thái pháp lý của “xử tử” hay phán định đạo đức hàm chứa trong “sát hại”.
- source_word: ἄνθρωπον
  choice: một người
  rationale: Trong tiếng Việt, “một người” là cách tự nhiên để Đức Giê-su tự nói về nhân tính của mình; giới tính của người nói đã rõ trong văn cảnh nên không cần dùng từ kém tự nhiên hơn.
- source_word: τὴν ἀλήθειαν
  choice: sự thật
  rationale: Giữ nội dung xác định của danh từ có mạo từ và phù hợp cách dùng tự nhiên trong tiếng Việt.
- source_word: ὑμῖν λελάληκα
  choice: đã nói cho các ông
  rationale: “Đã nói cho” truyền đạt hành động nói đã hoàn tất và nội dung vẫn liên quan ở hiện tại; đại từ “các ông” phù hợp lời trực tiếp hướng đến nhóm đối thoại nam giới.
- source_word: ἣν ἤκουσα παρὰ τοῦ θεοῦ
  choice: mà tôi nghe từ Đức Chúa Trời
  rationale: παρά với sở hữu cách chỉ nguồn gốc; “từ Đức Chúa Trời” rõ ràng và không diễn giải quá mức.
- source_word: τοῦτο Ἀβραὰμ οὐκ ἐποίησεν
  choice: Áp-ra-ham đã không làm điều đó
  rationale: Giữ đại từ chỉ định τοῦτο và sự đối chiếu trực tiếp với hành vi của Áp-ra-ham, đồng thời theo trật tự câu tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Cách dịch ἄνθρωπον khi Đức Giê-su tự nói về mình
  choice: một người
  alternative: một người đàn ông
  rationale: “Một người” giữ nguyên lời khẳng định rõ ràng về nhân tính của Đức Giê-su và tự nhiên hơn trong tiếng Việt. Cách dịch này không phủ nhận giới tính nam đã rõ của người nói, cũng không thêm một sự nhấn mạnh giới tính mà câu Hy Lạp không đặt làm trọng tâm.
- issue: Nguồn sứ điệp của Đức Giê-su trong παρὰ τοῦ θεοῦ
  choice: từ Đức Chúa Trời
  alternative: từ Đức Chúa Cha
  rationale: Bản Hy Lạp viết τοῦ θεοῦ, “Đức Chúa Trời”, chứ không dùng danh xưng “Cha”; vì vậy bản dịch không cụ thể hóa quá điều nguyên văn nói.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “các ông” cho nhóm người nam đang đối thoại với Đức Giê-su; giữ “tôi” theo lối nói tự nhiên. Không cần chú thích vì câu không có dị bản hay nét mơ hồ nào buộc phải giải thích trong bản văn.
