id: JHN.8.30
reference: John 8:30
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ταῦτα αὐτοῦ λαλοῦντος πολλοὶ ἐπίστευσαν εἰς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/030.yaml
  text: As he was saying these things[b][a], many believed in him.
translation:
  language: vi
  text: Khi Người đang nói những điều ấy[a], nhiều người đã tin nơi Người[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Trong khi Người nói những điều ấy.”'
    reason: lexical_alternative
  - marker: b
    text: 'Hay: “đặt lòng tin nơi Người.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ταῦτα
  choice: những điều ấy
  rationale: Đại từ chỉ định trung tính số nhiều, quy chiếu về nội dung lời Đức Giê-su vừa nói; cách dịch này giữ được sắc thái số nhiều và sự liên kết với phần trước.
- source_word: αὐτοῦ λαλοῦντος
  choice: Khi Người đang nói
  rationale: Kết cấu sở hữu cách tuyệt đối với phân từ hiện tại diễn tả hành động đang diễn ra đồng thời với việc nhiều người tin; “khi... đang nói” tự nhiên và rõ nghĩa trong tiếng Việt.
- source_word: πολλοὶ
  choice: nhiều người
  rationale: Tính từ được dùng như danh từ; tiếng Việt cần thêm “người” để diễn đạt tự nhiên và xác định đối tượng là con người.
- source_word: ἐπίστευσαν
  choice: đã tin
  rationale: Động từ aorist trình bày sự việc như một toàn thể; “đã tin” truyền đạt trực tiếp sự kiện mà không giải thích thêm rằng họ bắt đầu tin.
- source_word: εἰς αὐτόν
  choice: nơi Người
  rationale: Trong cách dùng của Gioan, πιστεύω đi với εἰς chỉ lòng tin hướng về và đặt nơi một người. “Tin nơi Người” giữ được chiều kích tín thác cá vị, đồng thời có sắc thái trang trọng tự nhiên.
theological_decisions:
- issue: Cách dịch πιστεύω εἰς αὐτόν trong văn phong Gioan
  choice: tin nơi Người
  alternative: tin Người; đặt lòng tin nơi Người
  rationale: “Tin nơi Người” thể hiện lòng tin hướng đến chính Đức Giê-su, không chỉ là tin lời Người nói. Cách dịch này cũng không tự quyết định mức độ chân thật hay bền vững của đức tin ấy, vấn đề mà ngữ cảnh tiếp theo có thể làm rõ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Người” để quy chiếu Đức Giê-su mà không bổ sung danh xưng vốn không xuất hiện trong câu Hy Lạp. Trật tự câu giữ quan hệ đồng thời của kết cấu Hy Lạp và bảo toàn sự dè dặt của câu về bản chất đức tin của “nhiều người”.
