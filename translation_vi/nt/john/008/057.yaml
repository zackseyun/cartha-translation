source:
  edition: SBLGNT
  text: εἶπον οὖν οἱ Ἰουδαῖοι πρὸς αὐτόν· Πεντήκοντα ἔτη οὔπω ἔχεις καὶ Ἀβραὰμ ἑώρακας;
base_translation:
  language: en
  yaml_path: translation/nt/john/008/057.yaml
  text: So the Jews said to him, “You are not yet fifty years old, and you have seen Abraham?”
translation:
  language: vi
  text: 'Vậy, những người Do Thái[a] nói với Ngài: “Ông chưa được năm mươi tuổi mà đã thấy Áp-ra-ham sao?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “những người Giu-đê” hoặc “các lãnh đạo Do Thái”, tùy theo phạm vi mà Giăng muốn nói đến trong ngữ cảnh.
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ Ἰουδαῖοι
  choice: những người Do Thái
  rationale: Đây là cách dịch trực tiếp danh xưng tập thể trong câu. Ngữ cảnh không nói rõ chỉ các lãnh đạo, nên không thu hẹp đối tượng trong chính văn.
- source_word: οὖν
  choice: Vì vậy
  rationale: Diễn đạt quan hệ suy luận hoặc hệ quả với lời Đức Chúa Jêsus vừa nói, đồng thời phù hợp với văn phong kể chuyện trang trọng, tự nhiên.
- source_word: Πεντήκοντα ἔτη οὔπω ἔχεις
  choice: ông chưa được năm mươi tuổi
  rationale: Chuyển thành ngữ Hy Lạp dùng động từ 'có' với số năm sang cách nói tuổi tự nhiên trong tiếng Việt; 'chưa được' giữ sắc thái chưa đạt đến mốc năm mươi.
- source_word: ἑώρακας
  choice: đã thấy
  rationale: Thể hoàn thành của ὁράω được diễn đạt tự nhiên bằng 'đã thấy'; trong câu hỏi đầy ngạc nhiên, cách nói này vẫn giữ ý một việc đã xảy ra và có liên hệ với lời tuyên bố hiện tại.
- source_word: καὶ
  choice: mà
  rationale: Trong câu hỏi tỏ vẻ không tin, 'mà' diễn đạt tự nhiên sự tương phản hàm ý giữa tuổi của Đức Chúa Jêsus và việc thấy Áp-ra-ham, thay vì dịch máy móc là 'và'.
- source_word: Ἀβραὰμ
  choice: Áp-ra-ham
  rationale: Dùng dạng tên riêng quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
- source_word: πρὸς αὐτόν
  choice: nói với Ngài
  rationale: Giữ đối tượng của lời nói; 'Ngài' là đại từ tôn kính tự nhiên trong văn phong Kinh Thánh tiếng Việt khi người kể nhắc đến Đức Chúa Jêsus.
theological_decisions:
- issue: Phạm vi chỉ định của οἱ Ἰουδαῖοι trong sách Giăng
  choice: những người Do Thái
  alternative: những người Giu-đê; các lãnh đạo Do Thái
  rationale: Cụm từ có thể mang phạm vi khác nhau tùy ngữ cảnh trong sách Giăng, nhưng câu này không xác định riêng giới lãnh đạo. Chính văn giữ cách gọi rộng và trực tiếp; chú thích bảo lưu các khả năng khác để tránh quyết định thay cho văn bản.
- issue: Sắc thái câu hỏi về việc thấy Áp-ra-ham
  choice: mà đã thấy Áp-ra-ham sao?
  alternative: vậy mà ông đã thấy Áp-ra-ham ư?
  rationale: Giữ nguyên câu hỏi hoài nghi của người nói mà không giải thích liệu họ hiểu lời trước đó theo nghĩa gặp mặt trực tiếp hay theo nghĩa khác.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “ông” trong lời đối thoại vì người nói không bày tỏ sự tôn kính đối với Đức Chúa Jêsus, nhưng dùng “Ngài” trong lời kể. Cấu trúc “chưa được năm mươi tuổi mà đã…” truyền đạt tự nhiên giọng ngạc nhiên, hoài nghi của nguyên văn.
