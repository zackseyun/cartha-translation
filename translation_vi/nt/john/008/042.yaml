  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸀εἶπεν αὐτοῖς ὁ Ἰησοῦς· Εἰ ὁ θεὸς πατὴρ ὑμῶν ἦν ἠγαπᾶτε ἂν ἐμέ, ἐγὼ γὰρ ἐκ τοῦ θεοῦ ἐξῆλθον καὶ ἥκω· οὐδὲ γὰρ ἀπ’ ἐμαυτοῦ ἐλήλυθα, ἀλλ’ ἐκεῖνός με ἀπέστειλεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/042.yaml
  text: Jesus said to them[a], “If God were your Father, you would love me, because I came from God and am here. For I have not come from myself[b], but he sent me.”
translation:
  language: vi
  text: 'Đức Chúa Jêsus phán với họ: “Nếu Đức Chúa Trời là Cha các ông, thì các ông hẳn sẽ yêu mến tôi, vì tôi từ Đức Chúa Trời mà ra và hiện đang ở đây.[a] Vì tôi không tự mình mà đến,[b] nhưng chính Ngài đã sai tôi.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay, sát hơn: “vì tôi xuất phát từ Đức Chúa Trời và đã đến.”'
    reason: lexical_alternative
  - marker: b
    text: 'Hay: “Tôi không từ chính mình mà đến.” Tiếng Hy Lạp có thể nhấn mạnh nguồn gốc hoặc việc không hành động theo sáng kiến riêng.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰ ... ἦν ... ἠγαπᾶτε ἂν
  choice: Nếu Đức Chúa Trời là Cha các ông, thì các ông đã yêu mến tôi
  rationale: Cấu trúc điều kiện với εἰ, các động từ ở thì chưa hoàn thành và ἄν diễn tả điều kiện trái với thực tế. Tiếng Việt dùng “nếu... thì... đã...” để truyền đạt sắc thái giả định không có thật trong hiện tại.
- source_word: θεὸς πατὴρ ὑμῶν
  choice: Đức Chúa Trời là Cha các ông
  rationale: Giữ rõ quan hệ giữa Đức Chúa Trời và danh xưng “Cha”; “các ông” phù hợp với lời Đức Chúa Jêsus trực tiếp nói với nhóm người đối thoại.
- source_word: ἠγαπᾶτε
  choice: đã yêu mến
  rationale: “Yêu mến” là cách nói tự nhiên, trang trọng cho ἀγαπάω trong quan hệ đối với Đức Chúa Jêsus; từ “đã” ở đây góp phần biểu thị kết quả giả định trái thực tế, không nhất thiết chỉ thời quá khứ.
- source_word: ἐκ τοῦ θεοῦ ἐξῆλθον καὶ ἥκω
  choice: tôi từ Đức Chúa Trời mà ra và hiện đang ở đây
  rationale: “Từ Đức Chúa Trời mà ra” bảo toàn ý nguồn gốc của ἐκ và ἐξῆλθον mà không biến động từ thành thuật ngữ tín điều; “hiện đang ở đây” diễn đạt trạng thái hiện diện sau khi đến của ἥκω.
- source_word: οὐδὲ γὰρ ἀπ’ ἐμαυτοῦ ἐλήλυθα
  choice: Tôi không tự mình mà đến
  rationale: Cách diễn đạt tự nhiên này giữ được khả năng ἀπ’ ἐμαυτοῦ nói đến việc không hành động theo sáng kiến hay thẩm quyền độc lập; chú thích nêu thêm sắc thái nguồn gốc theo nghĩa đen.
- source_word: ἀλλ’ ἐκεῖνός με ἀπέστειλεν
  choice: nhưng chính Ngài đã sai tôi đến
  rationale: “Chính Ngài” thể hiện sự nhấn mạnh của ἐκεῖνος và chỉ về Đức Chúa Trời; “sai tôi đến” truyền đạt rõ ngôn ngữ sứ mạng của ἀποστέλλω.
theological_decisions:
- issue: Ngôn ngữ về nguồn gốc và sự đến của Đức Chúa Jêsus
  choice: tôi từ Đức Chúa Trời mà ra và hiện đang ở đây
  alternative: tôi xuất phát từ Đức Chúa Trời và đã đến
  rationale: Bản dịch khẳng định nguồn gốc nơi Đức Chúa Trời và sứ mạng được sai đến, nhưng không áp đặt thuật ngữ tín điều hậu kỳ lên các động từ thông dụng của bản Hy Lạp. Chú thích bảo lưu cách dịch sát hình thức hơn.
- issue: Ý nghĩa của ἀπ’ ἐμαυτοῦ
  choice: không tự mình mà đến
  alternative: không từ chính mình mà đến
  rationale: Cụm từ có thể nhấn mạnh cả nguồn gốc lẫn sáng kiến độc lập. Chính văn ưu tiên tiếng Việt tự nhiên mà không loại bỏ ý không tự ý đến; chú thích bảo lưu sắc thái nguồn gốc và sự song song với “từ Đức Chúa Trời mà ra”.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Jêsus” và “Đức Chúa Trời” theo lối gọi quen thuộc trong tiếng Việt Tin Lành; đại từ “tôi” phản ánh tự xưng trực tiếp, còn “các ông” giữ khoảng cách trong bối cảnh tranh luận. Hai dấu chú thích [a], [b] đều được đặt trong chính văn.
