- from: 'Đức Chúa Jêsus phán với họ: “Nếu Đức Chúa Trời là Cha các ông, thì các ông đã yêu mến tôi, vì tôi từ Đức Chúa Trời mà ra và hiện đang ở đây.[a] Tôi không tự mình mà đến,[b] nhưng chính Ngài đã sai tôi đến.”'
  to: 'Đức Chúa Jêsus phán với họ: “Nếu Đức Chúa Trời là Cha các ông, thì các ông hẳn sẽ yêu mến tôi, vì tôi từ Đức Chúa Trời mà ra và hiện đang ở đây.[a] Vì tôi không tự mình mà đến,[b] nhưng chính Ngài đã sai tôi.”'
  rationale: Bản sửa khôi phục “Vì” cho γάρ, dùng cách diễn đạt điều kiện phản thực tế tự nhiên hơn, và dịch ἀπέστειλεν là “đã sai tôi” mà không thêm nội dung. Các chú thích vẫn được neo đúng sau các mệnh đề liên hệ và tiếp tục bảo lưu những sắc thái từ vựng có thể tranh luận.
  reviewer_model: gpt-5.6-terra
