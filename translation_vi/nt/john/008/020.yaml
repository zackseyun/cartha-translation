reference: John 8:20
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ταῦτα τὰ ῥήματα ⸀ἐλάλησεν ἐν τῷ γαζοφυλακίῳ διδάσκων ἐν τῷ ἱερῷ· καὶ οὐδεὶς ἐπίασεν αὐτόν, ὅτι οὔπω ἐληλύθει ἡ ὥρα αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/020.yaml
  text: He spoke these words in the treasury while teaching in the temple[a], and no one seized him[b], because his hour had not yet come.
translation:
  language: vi
  text: Ngài nói những lời ấy tại khu vực kho tiền khi đang giảng dạy trong đền thờ[a]. Không ai bắt Ngài, vì giờ của Ngài[b] vẫn chưa đến.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “trong khuôn viên đền thờ”; từ Hy Lạp chỉ toàn bộ quần thể đền thờ, không chỉ riêng nơi thánh bên trong.
    reason: lexical_alternative
  - marker: b
    text: Trong sách Giăng, “giờ của Ngài” chỉ thời điểm đã định cho sự chịu khổ đến tột cùng và sự được tôn vinh của Đức Chúa Giê-su; cũng có thể dịch là “thời điểm đã định cho Ngài”.
    reason: cross_reference
lexical_decisions:
- source_word: ταῦτα τὰ ῥήματα
  choice: những lời ấy
  rationale: ῥήματα chỉ những lời đã được nói; “những lời ấy” tự nhiên trong tiếng Việt và liên kết với lời giảng ngay trước đó.
- source_word: ἐλάλησεν
  choice: nói
  rationale: λαλέω ở đây mang nghĩa trung tính là nói ra; “nói” sát nghĩa hơn mà vẫn phù hợp văn phong tường thuật trang trọng.
- source_word: ἐν τῷ γαζοφυλακίῳ
  choice: tại khu vực kho tiền
  rationale: γαζοφυλάκιον có thể chỉ kho tiền hoặc khu vực kho tiền trong đền thờ, không nhất thiết là một hòm tiền riêng lẻ. Thêm “khu vực” tránh khiến độc giả hiểu quá hẹp là bên trong một căn phòng.
- source_word: διδάσκων
  choice: khi đang giảng dạy
  rationale: Phân từ hiện tại diễn tả hành động diễn ra đồng thời với động từ chính; cách dịch này thể hiện rõ sự đồng thời.
- source_word: ἐν τῷ ἱερῷ
  choice: trong đền thờ
  rationale: ἱερόν chỉ toàn bộ khuôn viên đền thờ chứ không chỉ nơi thánh bên trong; bản chính giữ cách nói quen thuộc và chú thích làm rõ phạm vi.
- source_word: οὐδεὶς ἐπίασεν αὐτόν
  choice: Không ai bắt Ngài
  rationale: πιάζω diễn tả việc tóm bắt hoặc bắt giữ. “Bắt” tự nhiên trong tiếng Việt, giữ được sắc thái thù địch mà không áp đặt thủ tục pháp lý chính thức.
- source_word: οὔπω ἐληλύθει
  choice: vẫn chưa đến
  rationale: Thì quá khứ hoàn thành cho biết vào thời điểm ấy giờ đã định chưa đến; “vẫn chưa đến” diễn đạt tự nhiên trạng thái đó trong tiếng Việt.
- source_word: ἡ ὥρα αὐτοῦ
  choice: giờ của Ngài
  rationale: Giữ hình ảnh “giờ” đặc trưng của sách Giăng thay vì làm phẳng thành “thời điểm”, qua đó bảo toàn chiều kích thần học và sự căng thẳng của mạch truyện.
theological_decisions:
- issue: Cách dùng “giờ của Ngài” trong sách Giăng
  choice: Giữ nguyên cách nói “giờ của Ngài” trong bản chính.
  alternative: thời điểm đã định cho Ngài; thời của Ngài
  rationale: Trong sách Giăng, “giờ” hướng đến thời điểm đã định cho sự chịu khổ và được tôn vinh của Đức Chúa Jêsus. Giữ cách nói theo nguyên văn bảo toàn chủ đề xuyên suốt mà không thu hẹp nó thành một mốc thời gian thông thường.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “Ngài” theo mạch văn tôn kính; câu văn giữ nhịp kể chuyện rõ ràng. Các chú thích bảo toàn phạm vi nghĩa của ἱερόν và chiều kích thần học của ὥρα.
