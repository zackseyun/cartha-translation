id: JHN.8.35
reference: John 8:35
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ δὲ δοῦλος οὐ μένει ἐν τῇ οἰκίᾳ εἰς τὸν αἰῶνα· ⸀ὁ υἱὸς μένει εἰς τὸν αἰῶνα.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/035.yaml
  text: The servant does not remain in the household forever[b][a]; the son remains forever.
translation:
  language: vi
  text: Người nô lệ[a] không ở lại trong nhà mãi mãi; còn người con trai[b] thì ở lại mãi mãi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “đầy tớ”; từ Hy Lạp doulos chỉ người ở địa vị lệ thuộc như một nô lệ, và sự tương phản với người con trai khiến sắc thái ấy nổi bật ở đây.
    reason: lexical_alternative
  - marker: b
    text: Trong văn mạch, “người con trai” cũng có thể ngầm hướng đến Chúa Giê-su, dù cách nói trong câu này đồng thời mang tính khái quát như một châm ngôn.
    reason: alternative_reading
lexical_decisions:
- source_word: δοῦλος
  choice: người nô lệ
  rationale: “Người nô lệ” diễn đạt rõ địa vị lệ thuộc và không bền vững trong nhà, đồng thời giữ được sự tương phản với “người con”. “Đầy tớ” là một khả năng nhưng dễ chỉ gợi đến người phục vụ tự do.
- source_word: μένει
  choice: ở lại
  rationale: Dùng cùng một cách dịch ở cả hai vế để giữ phép lặp của nguyên văn và nhấn mạnh sự khác biệt về tính lâu dài của địa vị.
- source_word: οἰκία
  choice: nhà
  rationale: “Nhà” là cách nói tự nhiên trong tiếng Việt và có thể chỉ cả nơi ở lẫn gia đình/gia hộ, nhờ đó không thu hẹp nghĩa của οἰκία một cách không cần thiết.
- source_word: εἰς τὸν αἰῶνα
  choice: mãi mãi
  rationale: Cụm từ hiện đại, tự nhiên, diễn đạt sự lâu dài không chấm dứt; được lặp lại ở cả hai vế theo nguyên văn.
- source_word: υἱός
  choice: người con
  rationale: Giữ nghĩa nam tính/sắc thái người con trai trong cấu trúc gia đình mà không viết hoa để tránh quyết định trước rằng đây là một danh hiệu trực tiếp chỉ về Chúa Giê-su.
- source_word: δέ
  choice: thì / còn ... thì
  rationale: Cấu trúc đối chiếu tự nhiên của tiếng Việt thể hiện bước chuyển và sự tương phản giữa địa vị của người nô lệ với người con mà không thêm một từ chỉ thời gian như “bây giờ”.
theological_decisions:
- issue: Hàm ý Kitô học có thể có của “người con” trong văn mạch
  choice: Dịch “người con” và không viết hoa
  alternative: “Người Con”
  rationale: Câu này có hình thức như một nhận định khái quát về địa vị trong nhà, nhưng trong văn mạch cũng hướng đến lời Chúa Giê-su áp dụng ở câu kế tiếp. Không viết hoa bảo tồn cả hai tầng nghĩa thay vì biến ngay cụm từ này thành một danh hiệu Kitô học rõ ràng.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Cấu trúc “còn ... thì” làm rõ phép đối chiếu của câu Hy Lạp; việc lặp “ở lại” và “mãi mãi” giữ nhịp điệu cùng sự song hành của nguyên văn.
