  source_fidelity: Bản dịch giữ đúng cấu trúc đối chiếu, sự lặp lại của μένει và εἰς τὸν αἰῶνα, cùng nghĩa địa vị-gia hộ của οἰκία. Tuy nhiên, “người con” không biểu thị rõ nét giống đực số ít của υἱός; nguyên ngữ nói cụ thể là “con trai/son.”
  naturalness: Câu văn nhìn chung tự nhiên, trang trọng vừa phải. Cấu trúc “còn ... thì” diễn đạt δέ và thế đối chiếu rất tốt; “ở lại ... mãi mãi” cũng tự nhiên trong ngữ cảnh này.
  terminology: “Người nô lệ” phản ánh δοῦλος thích hợp trong thế đối chiếu với con trai. “Nhà” có thể diễn tả cả ngôi nhà lẫn gia hộ trong tiếng Việt. Cần đổi “người con” thành “người con trai” để không làm trung tính hóa υἱός; chú thích tương ứng cũng cần được chỉnh lại.
