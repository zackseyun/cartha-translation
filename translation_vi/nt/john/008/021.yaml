id: JHN.8.21
reference: John 8:21
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Εἶπεν οὖν πάλιν ⸀αὐτοῖς· Ἐγὼ ὑπάγω καὶ ζητήσετέ με, καὶ ἐν τῇ ἁμαρτίᾳ ὑμῶν ἀποθανεῖσθε· ὅπου ἐγὼ ὑπάγω ὑμεῖς οὐ δύνασθε ἐλθεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/021.yaml
  text: So he said to them again[a], “I am going away, and you will seek me, and you will die in your sin. Where I am going[c][b], you are not able to come.”
translation:
  language: vi
  text: 'Vì vậy, Ngài lại nói với họ: “Ta ra đi, các ngươi sẽ tìm Ta và sẽ chết trong tội mình.[a] Nơi Ta đi, các ngươi không thể đến được.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hy Lạp dùng số ít: “trong tội của các ngươi.” Một số bản dịch dùng “trong các tội,” nhưng số ít có thể nhấn mạnh tình trạng tội lỗi liên tục hơn là những hành vi riêng lẻ.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “Nơi Ta đi, các ngươi không có khả năng đến.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Vì vậy
  rationale: Giữ lực nối kết và suy luận với phần trao đổi trước, đồng thời tự nhiên trong văn xuôi tiếng Việt.
- source_word: πάλιν
  choice: lại
  rationale: Diễn đạt trực tiếp ý lặp lại của trạng từ.
- source_word: ὑπάγω
  choice: ra đi
  rationale: Vừa diễn tả sự rời khỏi người nghe, vừa giữ chiều sâu đặc trưng trong Giăng về sự ra đi của Đức Giê-su mà không xác định tường minh đích đến.
- source_word: ζητήσετέ με
  choice: các ngươi sẽ tìm Ta
  rationale: “Tìm” có thể chỉ việc tìm kiếm một người và vẫn để ngỏ sắc thái thuộc linh sâu hơn trong văn mạch Giăng.
- source_word: ἐν τῇ ἁμαρτίᾳ ὑμῶν
  choice: trong tội mình
  rationale: Giữ danh từ số ít ἁμαρτίᾳ và giới từ ἐν; “mình” quy chiếu tự nhiên về chủ ngữ số nhiều trong tiếng Việt, nhấn mạnh tình trạng tội lỗi hơn là liệt kê các hành vi.
- source_word: ἀποθανεῖσθε
  choice: sẽ chết
  rationale: Diễn đạt tự nhiên và chính xác hình thức tương lai của động từ.
- source_word: ὅπου ἐγὼ ὑπάγω
  choice: Nơi Ta đi
  rationale: Giữ sự lặp lại của ὑπάγω nhưng tránh lối diễn đạt nặng nề; đại từ ἐγώ được thể hiện rõ bằng “Ta”.
- source_word: οὐ δύνασθε ἐλθεῖν
  choice: các ngươi không thể đến được
  rationale: Giữ rõ ý bất khả năng trong δύνασθε và dùng cấu trúc tiếng Việt tự nhiên.
theological_decisions:
- issue: Danh từ ἁμαρτίᾳ ở số ít
  choice: trong tội mình
  alternative: trong các tội của mình
  rationale: Bản Hy Lạp dùng số ít, có thể nói đến một tình trạng tội lỗi liên tục chứ không chỉ nhiều hành vi riêng lẻ. Bản dịch giữ nguyên sức căng đó mà không giải nghĩa giáo lý ngay trong chính văn.
- issue: Hàm ý của ὑπάγω về sự ra đi của Đức Giê-su
  choice: Ta ra đi
  alternative: Ta đi / Ta lìa khỏi đây
  rationale: “Ra đi” giữ được nghĩa rời khỏi trước mắt và vẫn để ngỏ chiều sâu trong Giăng về cái chết, sự phục sinh và việc trở về cùng Cha, thay vì giải quyết hàm ý ngay trong bản dịch.
- issue: Bản chất của sự bất khả trong οὐ δύνασθε ἐλθεῖν
  choice: không thể đến được
  alternative: không đến được
  rationale: Cách dịch bảo toàn phát biểu về sự không có khả năng mà không tự ý xác định đó là bất khả về đạo đức, thuộc linh hay hoàn cảnh.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng cặp xưng hô “Ta—các ngươi” để phản ánh lời phán có thẩm quyền trong bối cảnh cổ, nhưng tránh từ ngữ quá cổ. Viết hoa đại từ chỉ Đức Giê-su theo quy ước biên tập tiếng Việt; điều này không nhằm thêm nội dung vào bản Hy Lạp.
