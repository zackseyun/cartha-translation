  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸂ἃ ἐγὼ⸃ ἑώρακα παρὰ τῷ ⸀πατρὶ λαλῶ· καὶ ὑμεῖς οὖν ⸂ἃ ἠκούσατε⸃ παρὰ ⸂τοῦ πατρὸς⸃ ποιεῖτε.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/038.yaml
  text: I speak what I have seen with the Father[a], and you, then, do what you have heard from your father.
translation:
  language: vi
  text: “Tôi nói những điều tôi đã thấy ở bên Cha; còn các ông thì cũng làm[a] những điều đã nghe từ cha mình.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hình thức động từ Hy Lạp ở đây có thể được hiểu là lời nhận định: “các ông làm”, hoặc là mệnh lệnh: “các ông hãy làm”.'
    reason: grammatical_ambiguity
  - marker: b
    text: Nguyên văn là “từ người cha”, không có đại từ sở hữu. Ngữ cảnh đối chiếu Cha của Đức Giê-su với cha của những người đang đối thoại; câu 44 mới xác định rõ người cha ấy.
    reason: alternative_reading
lexical_decisions:
- source_word: ἃ
  choice: những điều
  rationale: Đại từ quan hệ trung tính số nhiều làm bổ ngữ cho động từ; “những điều” tự nhiên trong tiếng Việt và giữ rõ nội dung được nói và được làm.
- source_word: ἑώρακα
  choice: đã thấy
  rationale: Thì hoàn thành chỉ việc đã thấy và vẫn có ý nghĩa hiện tại; tiếng Việt dùng “đã thấy” tự nhiên, còn tính liên hệ hiện tại được ngữ cảnh truyền đạt.
- source_word: παρὰ τῷ πατρὶ
  choice: khi ở bên Cha
  rationale: παρά với tặng cách diễn tả sự gần gũi hay hiện diện bên cạnh. “Khi ở bên Cha” tránh hiểu đơn thuần là nguồn gốc “từ Cha” và diễn đạt tự nhiên trong tiếng Việt.
- source_word: λαλῶ
  choice: Tôi nói
  rationale: Động từ có nghĩa trực tiếp là “nói”; đặt “những điều” làm bổ ngữ giữ sát cấu trúc và không thêm sắc thái giải thích.
- source_word: καὶ ὑμεῖς οὖν
  choice: còn các ông cũng
  rationale: “Còn” thể hiện sự đối chiếu giữa Đức Giê-su và những người đang đối thoại; “cũng” chuyển tải καί, trong khi quan hệ tiếp nối/suy luận của οὖν được diễn đạt nhẹ nhàng theo dòng câu, tránh một từ nối logic quá nặng.
- source_word: ἠκούσατε
  choice: đã nghe
  rationale: Thì bất định được chuyển bằng “đã nghe”, chỉ sự tiếp nhận trước đó đang chi phối hành động hiện tại.
- source_word: παρὰ τοῦ πατρὸς
  choice: từ cha mình
  rationale: παρά với sở hữu cách chỉ nguồn. “Cha mình” làm rõ quan hệ được ngữ cảnh ngụ ý nhưng không xác định người cha ấy là ai trước câu 44; chú thích ghi nhận rằng nguyên văn không có đại từ sở hữu.
- source_word: ποιεῖτε
  choice: làm
  rationale: Hình thức Hy Lạp có thể là trực thuyết hiện tại hoặc mệnh lệnh hiện tại. Cách đặt “các ông cũng làm” trong tiếng Việt ưu tiên lời nhận định theo mạch đối chiếu nhưng không thêm từ “đang” hay “hãy”; chú thích bảo tồn khả năng hiểu như mệnh lệnh.
- source_word: πατήρ / πατρὸς
  choice: Cha / cha
  rationale: Viết hoa lần đầu để chỉ Đức Chúa Trời là Cha của Đức Giê-su; viết thường lần sau nhằm giữ sự đối chiếu và chưa nói trước sự xác định rõ ở câu 44.
theological_decisions:
- issue: Danh tính của “cha” trong vế thứ hai
  choice: Dịch “cha mình”, không ghi rõ là ma quỷ trong chính văn.
  alternative: “người cha”, “ma quỷ”, hoặc “cha các ông là ma quỷ”
  rationale: Câu 44 mới xác định rõ người cha ấy là ma quỷ. Bản dịch giữ tiến trình tu từ của đoạn văn và không đưa lời giải thích về sau vào câu 38.
- issue: Thức của ποιεῖτε
  choice: Dùng “làm” không kèm “hãy” hoặc “đang”, đồng thời chú thích khả năng là mệnh lệnh.
  alternative: “hãy làm” hoặc “đang làm”
  rationale: ποιεῖτε giống nhau về hình thức ở trực thuyết hiện tại và mệnh lệnh hiện tại. Không nên âm thầm giải quyết sự mơ hồ có thật trong tiếng Hy Lạp.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Tôi–các ông” phù hợp với cuộc tranh luận công khai, rõ sự đối lập nhưng không thêm thái độ miệt thị. Cấu trúc hai vế song song được giữ để phản ánh sự đối chiếu trong nguyên văn.
