- from: “Tôi nói những điều tôi đã thấy khi ở bên Cha; còn các ông cũng làm[a] những điều đã nghe từ cha mình.[b]”
  to: “Tôi nói những điều tôi đã thấy ở bên Cha; còn các ông thì cũng làm[a] những điều đã nghe từ cha mình.[b]”
  rationale: Sửa “khi ở bên Cha” thành “ở bên Cha” để phản ánh chính xác hơn παρά với tặng cách mà không thêm sắc thái thời gian. Thêm “thì” để câu tiếng Việt rõ nhịp đối chiếu hơn. Giữ “cũng”, “cha mình”, và cả hai chú thích nhằm bảo toàn liên kết καί, tính hàm ẩn của “cha”, và sự mơ hồ thực sự của ποιεῖτε.
  reviewer_model: gpt-5.6-terra
