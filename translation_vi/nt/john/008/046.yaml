id: JHN.8.46
reference: John 8:46
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τίς ἐξ ὑμῶν ἐλέγχει με περὶ ἁμαρτίας; ⸀εἰ ἀλήθειαν λέγω, διὰ τί ὑμεῖς οὐ πιστεύετέ μοι;
base_translation:
  language: en
  yaml_path: translation/nt/john/008/046.yaml
  text: Which one of you convicts me of sin? If I speak the truth[c][b][a], why do you not believe me?
translation:
  language: vi
  text: Ai trong các ông chứng minh được tôi có tội? Nếu tôi nói sự thật, tại sao các ông không tin tôi?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Tin tôi” cũng có thể hiểu là “tin cậy tôi”; từ Hy Lạp có thể bao hàm cả việc tin lời một người và tin cậy chính người ấy.
    reason: lexical_alternative
lexical_decisions:
- source_word: τίς ἐξ ὑμῶν
  choice: Ai trong các ông
  rationale: Diễn đạt tự nhiên lời chất vấn trực tiếp nhắm đến những người đang nghe; “các ông” phù hợp với ngữ cảnh tranh luận và không thêm ý ngoài bản Hy Lạp.
- source_word: ἐλέγχει με περὶ ἁμαρτίας
  choice: có thể chứng minh tôi có tội
  rationale: ἐλέγχω trong ngữ cảnh này mang sắc thái vạch rõ hoặc xác lập một cáo buộc. Cách dịch này tự nhiên trong tiếng Việt và giữ sức nặng gần như pháp lý của lời thách thức; “có thể” diễn đạt hàm ý năng lực trong câu hỏi tu từ, không phải một động từ riêng trong nguyên văn.
- source_word: εἰ ἀλήθειαν λέγω
  choice: Nếu tôi nói sự thật
  rationale: Giữ nguyên hình thức điều kiện εἰ là “nếu”, không chuyển thành “vì” hay “bởi vì”, dù ngữ cảnh tu từ ngầm khẳng định lời Đức Giê-su là thật.
- source_word: διὰ τί
  choice: tại sao
  rationale: Tương đương tự nhiên và chính xác trong tiếng Việt hiện đại cho câu hỏi về nguyên nhân.
- source_word: πιστεύετέ μοι
  choice: tin tôi
  rationale: πιστεύω đi với đại từ ở cách dữ liệu có thể bao hàm cả tin lời người nói lẫn tin cậy người ấy. “Tin tôi” giữ được độ mở này trong tiếng Việt.
theological_decisions:
- issue: Sức nặng tu từ của lời Đức Giê-su về sự vô tội và tính chân thật của mình
  choice: Dịch thẳng hai câu hỏi, không diễn giải thành một lời tuyên bố minh nhiên về sự vô tội.
  alternative: “Có ai trong các ông chứng minh được rằng tôi đã phạm bất cứ tội nào không?”
  rationale: Nguyên văn trình bày dưới dạng lời thách thức và liên kết lời thách thức ấy với tính chân thật trong lời Đức Giê-su. Giữ hình thức câu hỏi bảo toàn sức căng thần học mà không thêm lời giải thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và trực tiếp. “Các ông” phản ánh lời đối thoại mang tính đối chất; “chứng minh tôi có tội” tự nhiên hơn lối dịch sát chữ “kết tội tôi về tội lỗi” trong tiếng Việt.
