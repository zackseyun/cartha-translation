  source_fidelity: Bản dịch giữ đúng cấu trúc lập luận của οὖν và γάρ, thì tương lai của ἀποθανεῖσθε, sự lặp lại của mệnh đề “chết trong tội lỗi,” và không thêm vị ngữ cho ὅτι ἐγώ εἰμι. Tuy nhiên, viết hoa “Tôi Là” đưa vào văn bản một cách đánh dấu thần học/diễn giải mà bản Hy Lạp không biểu thị bằng chữ hoa.
  naturalness: “Các ông” và “tội lỗi của mình” đều có thể hiểu tự nhiên trong văn cảnh. Cụm “rằng tôi là” được cố ý để ngỏ theo nguyên ngữ; chú thích là cần thiết để người đọc hiểu đây không phải lỗi câu. “Vì nếu” chấp nhận được trong văn phong trang trọng.
  terminology: Nên dùng “tôi là” viết thường. Viết hoa toàn cụm “Tôi Là” không phải quy ước chính tả tiếng Việt cần thiết, đồng thời dễ định hướng người đọc tới một cách hiểu tuyệt đối. Chú thích nên gọi “Đấng ấy” là một khả năng, không gọi là bản thay thế duy nhất hay làm lu mờ sự thiếu vị ngữ trong nguyên ngữ.
