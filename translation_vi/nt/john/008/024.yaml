source:
  edition: SBLGNT
  text: εἶπον οὖν ὑμῖν ὅτι ἀποθανεῖσθε ἐν ταῖς ἁμαρτίαις ὑμῶν· ἐὰν γὰρ μὴ πιστεύσητε ὅτι ἐγώ εἰμι, ἀποθανεῖσθε ἐν ταῖς ἁμαρτίαις ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/024.yaml
  text: So I told you that you will die in your sins. For unless you believe that I am[a], you will die in your sins.
translation:
  language: vi
  text: Vì thế, tôi đã nói với các ông rằng các ông sẽ chết trong tội lỗi của mình. Vì nếu các ông không tin rằng tôi là[a], các ông sẽ chết trong tội lỗi của mình.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “tôi là Đấng ấy.” Nguyên văn Hy Lạp không nêu vị ngữ rõ ràng sau “tôi là”; cách diễn đạt này có thể mang âm hưởng sâu xa hơn trong sách Giăng.'
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπον οὖν ὑμῖν
  choice: Vì thế, tôi đã nói với các ông
  rationale: οὖν nối kết câu này như một kết luận từ lời trước; “Vì thế” diễn đạt rõ quan hệ suy luận. Đại từ số nhiều ὑμῖν được chuyển là “các ông,” phù hợp với nhóm người đang đối thoại và giữ giọng trang trọng tự nhiên.
- source_word: ἀποθανεῖσθε
  choice: các ông sẽ chết
  rationale: Giữ nghĩa trực tiếp của động từ ở thì tương lai, không thêm sắc thái “hư mất” vốn mang tính diễn giải.
- source_word: ἐν ταῖς ἁμαρτίαις ὑμῶν
  choice: trong tội lỗi của mình
  rationale: Giữ số nhiều của ἁμαρτίαις theo nghĩa tập hợp tự nhiên trong tiếng Việt; “trong” diễn tả tình trạng vẫn còn ở trong tội lỗi khi chết.
- source_word: ἐὰν γὰρ μὴ
  choice: Vì nếu ... không
  rationale: γάρ nêu lý do cho lời khẳng định trước, còn ἐὰν μή đặt điều kiện phủ định; cấu trúc này tự nhiên và chính xác trong tiếng Việt.
- source_word: πιστεύσητε
  choice: tin
  rationale: “Tin” là cách chuyển phổ biến và phù hợp với cách dùng πιστεύω trong sách Giăng, đồng thời có thể bao hàm sự tin cậy mà không diễn giải quá mức.
- source_word: ὅτι ἐγώ εἰμι
  choice: rằng Tôi Là
  rationale: Nguyên ngữ không có vị ngữ sau ἐγώ εἰμι. “Tôi Là” giữ hình thức tuyệt đối và sự vang hưởng có thể có trong sách Giăng, thay vì tự ý bổ sung “Đấng ấy”; viết hoa giúp người đọc nhận ra đây là công thức tự xưng nổi bật, nhưng chú thích vẫn bảo tồn cách hiểu thành ngữ.
theological_decisions:
- issue: Cách chuyển ἐγώ εἰμι khi không có vị ngữ được nêu rõ
  choice: Tôi Là
  alternative: tôi là Đấng ấy
  rationale: Cụm Hy Lạp có thể được hiểu như lời xác nhận căn tính theo ngữ cảnh hoặc như công thức tự xưng tuyệt đối có âm hưởng sâu hơn. Bản chính giữ nguyên sự bất định bằng “Tôi Là,” còn chú thích nêu cách hiểu thành ngữ, không áp đặt một kết luận thần học duy nhất.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “các ông” cho nhóm đối thoại; lặp lại mệnh đề cuối như nguyên bản để giữ sức nặng cảnh báo. “Tội lỗi” là danh từ tập hợp tự nhiên trong tiếng Việt nhưng vẫn tương ứng với dạng số nhiều của nguyên ngữ.
