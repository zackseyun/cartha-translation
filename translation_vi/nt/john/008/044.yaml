  rationale: 'Sửa giới hạn ở hai điểm an toàn: dùng “thuộc về” để diễn đạt rõ quan hệ nguồn gốc/quy thuộc, và đổi các đại từ chỉ ma quỷ từ “nó” sang “hắn” cho phù hợp với sự nhân cách hóa giống đực của nguyên văn và tiếng Việt hiện đại. Đồng thời nhất quán đại từ trong các chú thích. Không thay đổi cách xử lý các điểm ngữ nghĩa còn tranh luận: “không đứng trong chân lý” không hàm ý một trạng thái trước đó, và “cha của điều dối trá ấy” vẫn giữ số ít cùng quy chiếu khả dĩ nhất.'
