id: JHN.8.44
reference: John 8:44
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὑμεῖς ἐκ τοῦ πατρὸς τοῦ διαβόλου ἐστὲ καὶ τὰς ἐπιθυμίας τοῦ πατρὸς ὑμῶν θέλετε ποιεῖν. ἐκεῖνος ἀνθρωποκτόνος ἦν ἀπ’ ἀρχῆς, καὶ ἐν τῇ ἀληθείᾳ ⸂οὐκ ἔστηκεν⸃, ὅτι οὐκ ἔστιν ἀλήθεια ἐν αὐτῷ. ὅταν λαλῇ τὸ ψεῦδος, ἐκ τῶν ἰδίων λαλεῖ, ὅτι ψεύστης ἐστὶν καὶ ὁ πατὴρ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/044.yaml
  text: You are from your father[a], the devil, and you want to do your father's desires. He was a murderer from the beginning, and he has not stood in the truth, because there is no truth in him. Whenever he speaks the lie, he speaks from his own nature[c][b], because he is a liar and the father of it.
translation:
  language: vi
  text: Các ông thuộc về cha mình là ma quỷ, và các ông muốn làm những điều cha mình ham muốn. Hắn là kẻ giết người từ ban đầu và không đứng trong chân lý, vì trong hắn không có chân lý. Mỗi khi hắn nói điều dối trá[a], hắn nói ra từ chính bản tính mình[b], vì hắn là kẻ nói dối và là cha của điều dối trá ấy[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát chữ hơn: “mỗi khi hắn nói lời dối trá ấy.” Cũng có thể dịch tự nhiên là “mỗi khi hắn nói dối.”'
    reason: lexical_alternative
  - marker: b
    text: 'Sát chữ: “hắn nói từ những gì thuộc riêng về mình,” nghĩa là từ điều vốn thuộc về bản tính hoặc tính cách của hắn.'
    reason: lexical_alternative
  - marker: c
    text: Cũng có thể diễn ý là “cha của những lời dối trá.” Cách hiểu đại từ là chỉ chính ma quỷ (“cha của hắn”) kém phù hợp hơn trong mạch văn.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκ τοῦ πατρὸς τοῦ διαβόλου
  choice: xuất thân từ cha mình là ma quỷ
  rationale: ἐκ đi với εἰμί diễn tả nguồn gốc hoặc sự thuộc về. “Xuất thân từ” truyền đạt lực của giới từ một cách tự nhiên; “cha mình là ma quỷ” giữ quan hệ đồng vị mà không biến “cha” và “ma quỷ” thành hai đối tượng.
- source_word: ἐπιθυμίας
  choice: những điều ... ham muốn
  rationale: Từ này chỉ các ham muốn nói chung trong ngữ cảnh đạo đức; “ham muốn” tự nhiên và không thu hẹp nghĩa vào dục vọng tình dục.
- source_word: θέλετε ποιεῖν
  choice: muốn làm
  rationale: Diễn đạt trực tiếp ý chí và ý định có trách nhiệm của chủ thể.
- source_word: ἀνθρωποκτόνος
  choice: kẻ giết người
  rationale: Chỉ người giết con người; cách dịch này trực tiếp, tự nhiên và giữ sắc thái kết án về đạo đức.
- source_word: ἀπ’ ἀρχῆς
  choice: từ ban đầu
  rationale: Giữ nguyên nét thời gian và âm hưởng đặc trưng trong văn chương Giăng.
- source_word: ἐν τῇ ἀληθείᾳ οὐκ ἔστηκεν
  choice: không đứng trong chân lý
  rationale: Giữ hình ảnh “đứng” của động từ và không diễn giải thành “không còn ở lại,” vốn có thể hàm ý rõ hơn rằng ma quỷ từng ở trong chân lý.
- source_word: ἀλήθεια
  choice: chân lý
  rationale: “Chân lý” phù hợp với ý niệm đối lập căn bản giữa sự thật và dối trá trong ngữ cảnh, đồng thời giữ giọng văn trang trọng, dễ hiểu.
- source_word: ὅταν λαλῇ τὸ ψεῦδος
  choice: mỗi khi nói điều dối trá
  rationale: Giữ tính lặp lại của ὅταν và diễn đạt τὸ ψεῦδος tự nhiên trong tiếng Việt; cấu trúc sát chữ hơn được ghi ở chú thích.
- source_word: ἐκ τῶν ἰδίων λαλεῖ
  choice: nói ra từ chính bản tính mình
  rationale: Thành ngữ Hy Lạp có nghĩa nói ra từ điều vốn thuộc về chính mình; “bản tính” làm rõ ý trong tiếng Việt nhưng mức độ diễn giải được ghi nhận bằng chú thích.
- source_word: ψεύστης
  choice: kẻ nói dối
  rationale: Cách tương đương trực tiếp, tự nhiên, giữ danh xưng mang tính quy kết.
- source_word: ὁ πατὴρ αὐτοῦ
  choice: cha của điều dối trá ấy
  rationale: Đại từ được hiểu tự nhiên nhất là quy chiếu về τὸ ψεῦδος, tức “điều dối trá”; cách dịch giữ số ít và hình ảnh nguồn gốc là “cha”.
theological_decisions:
- issue: Đối tượng mà ὁ πατὴρ αὐτοῦ quy chiếu
  choice: Hiểu là “cha của điều dối trá ấy,” tức ma quỷ là nguồn của sự dối trá.
  alternative: “Cha của những lời dối trá”; hoặc theo ngữ pháp máy móc, “cha của hắn.”
  rationale: Tiền ngữ gần và hợp mạch văn nhất là τὸ ψεῦδος. “Cha của hắn” dễ tạo ra một khẳng định suy đoán rằng ma quỷ có cha; còn “cha của những lời dối trá” chuyển danh từ số ít thành số nhiều và là một cách diễn ý rộng hơn.
- issue: Liệu câu này có nói ma quỷ từng đứng trong chân lý rồi sa ngã hay không
  choice: Giữ hình ảnh “không đứng trong chân lý” mà không xác quyết một trạng thái trước đó.
  alternative: “Không còn ở lại trong chân lý,” hàm ý rõ hơn rằng trước kia nó từng ở đó.
  rationale: Cấu trúc Hy Lạp phủ định việc đứng trong chân lý, nhưng bản thân câu không buộc người dịch phải giải quyết tranh luận về một trạng thái trước đó.
translation_notes:
  register: Dùng tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. “Các ông” tránh đại từ cổ “các ngươi” và phù hợp với lời trực tiếp dành cho một nhóm nam giới trong bối cảnh, dù tiếng Hy Lạp không tự mã hóa cấp độ xã hội. “Nó” dùng cho ma quỷ để câu rõ chủ thể và tự nhiên trong tiếng Việt. Các cụm “đứng trong chân lý” và “cha của điều dối trá ấy” cố ý giữ hình ảnh cùng độ căng thần học của nguyên văn.
