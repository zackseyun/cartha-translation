id: JHN.8.17
reference: John 8:17
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἐν τῷ νόμῳ δὲ τῷ ὑμετέρῳ γέγραπται ὅτι δύο ἀνθρώπων ἡ μαρτυρία ἀληθής ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/017.yaml
  text: And even in your law it is written that the testimony of two men is true[a].
translation:
  language: vi
  text: Ngay trong luật của các ông cũng có chép rằng lời chứng của hai người là thật.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Trong ngữ cảnh pháp lý, “thật” cũng có thể mang nghĩa “được công nhận là có giá trị”.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ... δὲ
  choice: cũng
  rationale: Trong câu này, tổ hợp liên từ nối lời đang nói với lập luận tiếp theo và thêm sắc thái nhấn mạnh; “cũng” diễn đạt tự nhiên trong tiếng Việt mà không làm quá mạnh ý.
- source_word: νόμῳ
  choice: luật
  rationale: Ở đây νόμος chỉ luật pháp hay phần Kinh Thánh có thẩm quyền mà Chúa Giê-su viện dẫn. Viết thường phù hợp với cụm mang tính tranh luận “luật của các ông” và không thu hẹp nghĩa thành một nhan đề riêng.
- source_word: ὑμετέρῳ
  choice: của các ông
  rationale: Giữ đại từ sở hữu ngôi thứ hai và sắc thái trực tiếp trong lời Chúa Giê-su nói với những người đối thoại, nhưng không thêm “chính” vì từ Hy Lạp không nhất thiết nhấn mạnh đến mức ấy.
- source_word: γέγραπται
  choice: có chép
  rationale: Đây là công thức quen thuộc dùng khi viện dẫn Kinh Thánh. “Có chép” tự nhiên, trang trọng và hàm ý điều đã được ghi vẫn có hiệu lực.
- source_word: δύο ἀνθρώπων
  choice: hai người
  rationale: Trong thành ngữ pháp lý này, ἄνθρωπος chỉ các nhân chứng là con người. Tiếng Việt “hai người” vừa bám sát nghĩa thông dụng vừa không buộc phải xác định giới tính khi ngữ pháp Hy Lạp không dùng từ riêng nghĩa là nam giới.
- source_word: μαρτυρία
  choice: lời chứng
  rationale: “Lời chứng” là cách diễn đạt tự nhiên trong tiếng Việt cho μαρτυρία và phù hợp với bối cảnh pháp lý.
- source_word: ἀληθής
  choice: thật
  rationale: Giữ nghĩa trực tiếp “thật”; trong ngữ cảnh, từ này đồng thời có thể hàm ý lời chứng được công nhận là có giá trị pháp lý.
theological_decisions:
- issue: Sắc thái tu từ của “luật của các ông”
  choice: Giữ nguyên cách xưng hô sở hữu “luật của các ông”.
  alternative: “luật pháp” hoặc “chính luật của các ông”
  rationale: Bản Hy Lạp nêu rõ sở hữu ngôi thứ hai. Cách dịch này giữ sự căng thẳng tu từ mà không suy diễn rằng Chúa Giê-su bác bỏ luật, cũng không tăng thêm sắc thái đối đầu bằng từ “chính”.
- issue: Ý nghĩa pháp lý của ἀληθής
  choice: Dịch là “thật” trong chính văn.
  alternative: “có giá trị” hoặc “đáng tin”
  rationale: “Thật” giữ nguyên cách nói của nguồn Hy Lạp; chú thích cho biết hàm ý pháp lý để không âm thầm giải quyết sự đa nghĩa.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. “Ngay trong ... cũng” giữ sắc thái nhấn mạnh của câu; “các ông” phù hợp với lời trực tiếp nói với một nhóm người trong văn cảnh. Mọi dấu chú thích đều xuất hiện trong chính văn.
