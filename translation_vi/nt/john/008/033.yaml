revisions:
- from: 'Họ đáp lời Ngài: “Chúng tôi là dòng dõi Áp-ra-ham[a] và chưa từng làm nô lệ cho bất cứ ai[b]. Sao Ngài lại nói: ‘Các người sẽ trở nên tự do’[c]?”'
  to: 'Họ đáp lại Ngài: “Chúng tôi là dòng dõi Áp-ra-ham[a] và chưa từng làm nô lệ cho bất cứ ai[b]. Sao Ngài lại nói rằng chúng tôi sẽ trở nên tự do[c]?”'
  rationale: Sửa cách diễn đạt động từ đáp lời cho tự nhiên hơn và thay lời trích trực tiếp bằng mệnh đề gián tiếp để không gán sắc thái khinh miệt/xa cách cho đại từ số nhiều. Các lựa chọn then chốt về “dòng dõi,” “làm nô lệ,” và “trở nên tự do” được giữ nguyên; chú thích c được điều chỉnh đại từ để khớp bản văn sửa.
