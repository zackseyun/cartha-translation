source:
  edition: SBLGNT
  text: ἀπεκρίθησαν ⸂πρὸς αὐτόν⸃· Σπέρμα Ἀβραάμ ἐσμεν καὶ οὐδενὶ δεδουλεύκαμεν πώποτε· πῶς σὺ λέγεις ὅτι Ἐλεύθεροι γενήσεσθε;
base_translation:
  language: en
  yaml_path: translation/nt/john/008/033.yaml
  text: They answered him[a], “We are Abraham’s offspring and have never been enslaved to anyone. How can you say[c][b], ‘You will become free’?”
translation:
  language: vi
  text: 'Họ đáp lại Ngài: “Chúng tôi là dòng dõi Áp-ra-ham[a] và chưa từng làm nô lệ cho bất cứ ai[b]. Sao Ngài lại nói rằng chúng tôi sẽ trở nên tự do[c]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “hạt giống của Áp-ra-ham”; từ Hy Lạp ở số ít nhưng được dùng với nghĩa tập hợp để chỉ dòng dõi theo huyết thống.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “chưa từng phục vụ bất cứ ai.” Tuy nhiên, trong ngữ cảnh đối lập với tự do, nghĩa làm nô lệ nổi bật hơn.'
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “chúng tôi sẽ được tự do.” Nguyên văn sát hơn là “chúng tôi sẽ trở nên tự do.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθησαν πρὸς αὐτόν
  choice: Họ đáp lời Ngài
  rationale: Diễn đạt tự nhiên hành động trả lời trực tiếp với Đức Giê-su; “Ngài” giữ văn phong trang trọng mà vẫn hiện đại.
- source_word: Σπέρμα Ἀβραάμ
  choice: dòng dõi Áp-ra-ham
  rationale: Trong ngữ cảnh, danh từ tập hợp số ít σπέρμα chỉ quan hệ huyết thống. “Dòng dõi” tự nhiên hơn “hạt giống” và không đưa thêm hàm ý thần học.
- source_word: οὐδενὶ δεδουλεύκαμεν πώποτε
  choice: chưa từng làm nô lệ cho bất cứ ai
  rationale: Thì hoàn thành cùng πώποτε được chuyển bằng “chưa từng”; “làm nô lệ” làm nổi bật tình trạng lệ thuộc trong thế đối lập với tự do.
- source_word: πῶς σὺ λέγεις
  choice: Sao Ngài lại nói
  rationale: Truyền đạt tự nhiên sắc thái ngạc nhiên và phản đối của câu hỏi, đồng thời phản ánh sự nhấn mạnh vào chủ từ σὺ.
- source_word: Ἐλεύθεροι γενήσεσθε
  choice: Các người sẽ trở nên tự do
  rationale: “Trở nên” bảo toàn ý chuyển sang một trạng thái mới của γενήσεσθε, thay vì giản lược thành “sẽ được tự do” hoặc “sẽ tự do”.
theological_decisions:
- issue: Cách dịch δουλεύω trong thế đối lập giữa nô lệ và tự do
  choice: làm nô lệ
  alternative: phục vụ; lệ thuộc
  rationale: Mạch văn gần (các câu 34–36) nói rõ về nô lệ và tự do. “Làm nô lệ” giữ được sức nặng xã hội và thần học của hình ảnh mà không đồng nhất nó ngay với một cách giải thích riêng.
- issue: Cách dịch Σπέρμα Ἀβραάμ
  choice: dòng dõi Áp-ra-ham
  alternative: hạt giống của Áp-ra-ham; hậu duệ Áp-ra-ham
  rationale: Cụm từ tại đây nêu lời khẳng định về huyết thống. “Dòng dõi” diễn đạt tự nhiên tính tập hợp của danh từ số ít và tránh nhập các sắc thái từ những văn cảnh thần học khác.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng và dễ hiểu. Câu thoại giữ giọng phản bác trực tiếp; dùng “Ngài” cho lời thưa với Đức Giê-su và “các người” trong lời trích dẫn để thể hiện số nhiều, đồng thời tránh lối diễn đạt quá cổ.
