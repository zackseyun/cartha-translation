source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς· Ἐγὼ δαιμόνιον οὐκ ἔχω, ἀλλὰ τιμῶ τὸν πατέρα μου, καὶ ὑμεῖς ἀτιμάζετέ με.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/049.yaml
  text: Jesus answered[a], “I do not have a demon, but I honor my Father, and you dishonor me.”
translation:
  language: vi
  text: 'Giê-su trả lời: “Tôi không có quỷ[a], nhưng tôi tôn kính Cha tôi, còn các ông thì làm nhục tôi.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay, theo cách diễn giải rõ hơn: “Tôi không bị quỷ ám.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: đáp
  rationale: Động từ tường thuật lời đáp trong đối thoại; “đáp” tự nhiên, trang trọng và sát nghĩa.
- source_word: δαιμόνιον οὐκ ἔχω
  choice: tôi không có quỷ
  rationale: Giữ trực tiếp thành ngữ Hy Lạp “có quỷ”, vốn vẫn dễ hiểu trong tiếng Việt, thay vì đưa cách diễn giải “bị quỷ ám” vào chính văn.
- source_word: τιμῶ
  choice: tôn kính
  rationale: Diễn đạt hành động dành sự tôn trọng và danh dự cho Cha; đồng thời tạo thế đối lập rõ với ἀτιμάζω.
- source_word: τὸν πατέρα μου
  choice: Cha tôi
  rationale: “Cha” viết hoa vì trong ngữ cảnh Tin Mừng Giăng, Đức Chúa Jêsus đang nói về Đức Chúa Trời với tư cách Cha của Ngài.
- source_word: ἀτιμάζετέ
  choice: làm nhục
  rationale: Diễn tả việc tước bỏ danh dự, khinh miệt; tự nhiên hơn “không tôn kính” và giữ được sức nặng của sự tương phản với τιμῶ.
- source_word: με
  choice: tôi
  rationale: Đại từ ngôi thứ nhất làm tân ngữ; cách xưng “tôi” phù hợp trong lời đối đáp trực tiếp ở đây.
theological_decisions:
- issue: Ý nghĩa của thành ngữ “có quỷ”
  choice: Giữ cách nói trực tiếp “tôi không có quỷ” trong chính văn.
  alternative: “Tôi không bị quỷ ám.”
  rationale: Cách chính văn bảo tồn hình thức và độ mở của nguyên ngữ; cách thay thế nêu rõ ý nghĩa thường được hiểu nhưng mang tính diễn giải hơn.
- issue: Đối tượng được gọi là “Cha tôi”
  choice: Viết hoa “Cha” để biểu thị Đức Chúa Trời trong lời của Đức Chúa Jêsus.
  alternative: Viết thường “cha tôi”.
  rationale: Ngữ cảnh Giăng xác định rõ đây là cách Đức Chúa Jêsus gọi Đức Chúa Trời; viết hoa giúp độc giả nhận ra quy chiếu mà không thêm nội dung.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Giữ thành ngữ nguồn “có quỷ”; dùng cặp “tôn kính/làm nhục” để thể hiện sự đối lập về danh dự. Danh xưng “Đức Chúa Jêsus” theo văn phong Kinh Thánh Tin Lành quen thuộc, còn lời trực tiếp dùng đại từ tự nhiên.
