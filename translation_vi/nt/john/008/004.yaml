  text: λέγουσιν αὐτῷ, Διδάσκαλε, αὕτη ἡ γυνὴ κατείληπται ἐπαυτοφώρῳ μοιχευομένη.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/john/008/004.yaml
  text: They[a] said to him, "Teacher, this woman has been caught in the very act of committing adultery."
translation:
  language: vi
  text: 'Họ[a] nói với Ngài: “Thưa Thầy, người phụ nữ này bị bắt quả tang đang ngoại tình.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Câu này thuộc phần tiếp theo của trình thuật về người phụ nữ bị bắt quả tang ngoại tình (Giăng 7:53–8:11). Xem chú thích ở Giăng 7:53.
    reason: textual_critical
lexical_decisions:
- source_word: λέγουσιν
  choice: nói
  rationale: Đây là hiện tại lịch sử trong lời kể; tiếng Việt có thể dùng “nói” tự nhiên mà không cần đánh dấu thì quá khứ.
- source_word: Διδάσκαλε
  choice: Thưa Thầy
  rationale: Dạng hô cách được chuyển bằng “Thưa” để thể hiện cách xưng hô trực tiếp, trang trọng và tự nhiên trong tiếng Việt.
- source_word: κατείληπται
  choice: bị bắt
  rationale: Thể hoàn thành bị động nói đến việc đã bị phát hiện và bắt giữ, với kết quả vẫn còn liên quan trong tình huống hiện tại.
- source_word: ἐπαυτοφώρῳ
  choice: quả tang
  rationale: Thành ngữ này chỉ việc bị phát hiện ngay khi đang thực hiện hành vi; “bắt quả tang” là cách diễn đạt tiếng Việt tương ứng, tự nhiên và chính xác.
- source_word: μοιχευομένη
  choice: đang ngoại tình
  rationale: Phân từ hiện tại mô tả hành vi đang diễn ra vào lúc người phụ nữ bị bắt; “đang ngoại tình” giữ rõ sắc thái đồng thời ấy.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Ngài” được dùng cho đại từ αὐτῷ khi nói về Chúa Giê-su; “Thưa Thầy” thể hiện tự nhiên lời gọi trực tiếp. Dấu chú thích [a] được đặt sau chủ ngữ như trong lớp tham khảo tiếng Anh, nhằm gắn ghi chú phê bình văn bản với những người đang phát biểu trong phần trình thuật này.
