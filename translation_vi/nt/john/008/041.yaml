  text: ὑμεῖς ποιεῖτε τὰ ἔργα τοῦ πατρὸς ὑμῶν. ⸀εἶπαν αὐτῷ· Ἡμεῖς ἐκ πορνείας ⸂οὐ γεγεννήμεθα⸃· ἕνα πατέρα ἔχομεν τὸν θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/041.yaml
  text: You are doing the works of your father.” They said to him[a], “We were not born of sexual immorality; we have one Father—God.”
translation:
  language: vi
  text: '“Các ông đang làm những việc của cha các ông.” Họ nói với Đức Giê-su[a]: “Chúng tôi không phải là con sinh ra từ sự gian dâm; chúng tôi chỉ có một Cha, là Đức Chúa Trời.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “Chúng tôi không phải là con ngoài giá thú.” Nguyên văn: “Chúng tôi không được sinh ra từ sự gian dâm.”'
    reason: Phương án dịch từ thành ngữ ἐκ πορνείας οὐ γεγεννήμεθα; chính văn giữ cách diễn đạt gần nguyên văn mà không quyết định hàm ý luận chiến.
lexical_decisions:
- source_word: ποιεῖτε
  choice: đang làm
  rationale: Thì hiện tại diễn tả hành động đang tiếp diễn trong lời cáo buộc; “đang làm” tự nhiên và giữ được lực của động từ.
- source_word: τὰ ἔργα
  choice: những việc
  rationale: Diễn đạt tự nhiên nghĩa “các việc làm/hành động” và duy trì liên hệ với động từ “làm”.
- source_word: τοῦ πατρὸς ὑμῶν
  choice: của cha mình
  rationale: Giữ hình ảnh quan hệ và nguồn gốc của πατήρ, đồng thời bảo toàn sự căng thẳng về căn tính người cha trong mạch văn.
- source_word: ἐκ πορνείας
  choice: từ sự gian dâm
  rationale: Giữ khá sát cấu trúc chỉ nguồn gốc với ἐκ và nghĩa rộng về quan hệ tình dục trái luân lý của πορνεία, thay vì diễn giải thẳng thành tình trạng con ngoài giá thú.
- source_word: οὐ γεγεννήμεθα
  choice: không phải được sinh ra
  rationale: Chuyển thể hoàn thành bị động sang cách nói tiếng Việt tự nhiên, nhấn mạnh lời phủ nhận nguồn gốc khi sinh ra.
- source_word: ἕνα πατέρα ἔχομεν
  choice: chỉ có một Cha
  rationale: “Chỉ có một” thể hiện sức nhấn của ἕνα; viết hoa “Cha” vì ngay sau đó được đồng nhất với Đức Chúa Trời.
- source_word: τὸν θεόν
  choice: là Đức Chúa Trời
  rationale: '“Là” diễn đạt rõ quan hệ đồng vị: người Cha duy nhất chính là Đức Chúa Trời.'
theological_decisions:
- issue: Có nên diễn giải lời phủ nhận sinh ra “từ sự gian dâm” thành lời khẳng định họ không phải con ngoài giá thú hay không
  choice: Giữ cách nói “không phải được sinh ra từ sự gian dâm” trong chính văn
  alternative: Chúng tôi không phải là con ngoài giá thú
  rationale: Nguyên văn nói trực tiếp về nguồn gốc “từ πορνεία”; cách dịch sát này giữ được hàm ý tranh luận có thể có mà không quyết định thay cho người đọc.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “các ông” theo mạch đối thoại số nhiều; “cha” viết thường ở lời Đức Chúa Jêsus để giữ sự chưa xác định, còn “Cha” viết hoa khi được đồng nhất rõ với Đức Chúa Trời.
