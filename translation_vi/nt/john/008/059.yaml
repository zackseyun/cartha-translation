source:
  edition: SBLGNT
  text: ἦραν οὖν λίθους ἵνα βάλωσιν ἐπ’ αὐτόν· Ἰησοῦς δὲ ἐκρύβη καὶ ἐξῆλθεν ἐκ τοῦ ⸀ἱεροῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/059.yaml
  text: So they picked up stones to throw at him[a], but Jesus hid himself and went out of the temple.
translation:
  language: vi
  text: Vì thế, họ nhặt đá để ném vào Ngài, nhưng Đức Giê-su ẩn mình rồi đi ra khỏi khuôn viên đền thờ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hy Lạp ở đây là ἱερόν, chỉ toàn bộ khuôn viên đền thờ, bao gồm các sân, chứ không riêng nơi thánh bên trong.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦραν
  choice: nhặt
  rationale: Trong ngữ cảnh này, αἴρω chỉ việc cầm đá lên để chuẩn bị ném; “nhặt đá” tự nhiên và diễn đạt rõ hành động thù địch.
- source_word: οὖν
  choice: Vì thế
  rationale: Từ này đánh dấu kết quả hoặc phản ứng phát sinh từ lời Đức Giê-su vừa nói, nên “Vì thế” giữ được mối liên hệ logic.
- source_word: λίθους
  choice: đá
  rationale: Cách dịch thông dụng và phù hợp với ngữ cảnh họ định ném đá Đức Giê-su.
- source_word: ἵνα βάλωσιν ἐπ’ αὐτόν
  choice: để ném Ngài
  rationale: ἵνα với động từ giả định diễn tả mục đích; cấu trúc “để” là tự nhiên trong tiếng Việt và giữ đúng ý định của hành động.
- source_word: ἐκρύβη
  choice: ẩn mình
  rationale: Dù hình thức Hy Lạp là thụ động, động từ có thể mang nghĩa trung gian trong ngữ cảnh này; “ẩn mình” tự nhiên và không hàm ý có một tác nhân khác che giấu Đức Giê-su.
- source_word: ἐξῆλθεν
  choice: đi ra khỏi
  rationale: Diễn đạt trực tiếp chuyển động ra khỏi một nơi, đồng thời kết hợp tự nhiên với cụm ἐκ τοῦ ἱεροῦ.
- source_word: ἐκ τοῦ ἱεροῦ
  choice: khỏi khuôn viên đền thờ
  rationale: ἱερόν chỉ toàn bộ khu đền thờ, gồm các sân, chứ không riêng nơi thánh bên trong; bản dịch này ưu tiên độ chính xác mà vẫn dễ hiểu.
theological_decisions:
- issue: Bản chất việc Đức Giê-su thoát đi
  choice: Chỉ nói Đức Giê-su ẩn mình rồi đi ra khỏi khuôn viên đền thờ.
  alternative: Nói thêm rằng Ngài đi xuyên qua giữa họ bằng phép lạ hoặc trở nên vô hình.
  rationale: Bản văn SBLGNT chỉ chép rằng Đức Giê-su ẩn mình và đi ra; không nên đưa vào các chi tiết có trong một số truyền thống thủ bản muộn hơn.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Đức Giê-su” và đại từ tôn kính “Ngài”; giữ câu văn gọn, đồng thời dịch chính xác sắc thái không gian của ἱερόν.
