source:
  edition: SBLGNT
  text: διὰ τί τὴν λαλιὰν τὴν ἐμὴν οὐ γινώσκετε; ὅτι οὐ δύνασθε ἀκούειν τὸν λόγον τὸν ἐμόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/043.yaml
  text: Why do you not understand my way of speaking? Because you are not able to hear my word[a][b].
translation:
  language: vi
  text: Tại sao các ông không hiểu cách tôi nói? Vì các ông không thể nghe lời tôi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “không thể đón nhận lời tôi.” Động từ Hy Lạp có nghĩa căn bản là “nghe”; trong văn cảnh, nó có thể hàm ý nghe với sự tiếp nhận, nhưng bản văn không nói rõ hơn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λαλιὰν
  choice: cách tôi nói
  rationale: Diễn đạt tự nhiên ý về cách thức/lối nói, đồng thời giữ sự phân biệt với λόγος ở vế sau.
- source_word: γινώσκετε
  choice: hiểu
  rationale: Trong ngữ cảnh này, động từ nói về việc lĩnh hội lời nói của Chúa Giê-su, không chỉ là biết hay nhận ra.
- source_word: ἀκούειν
  choice: nghe
  rationale: Giữ nghĩa căn bản của động từ và không diễn giải ngầm thành vâng theo, tiếp nhận hay tin.
- source_word: λόγον
  choice: lời
  rationale: “Lời” tự nhiên trong văn cảnh, có sức nặng thần học thích hợp và vẫn phân biệt được với “cách tôi nói” ở vế đầu.
- source_word: οὐ δύνασθε
  choice: không thể
  rationale: Diễn đạt rõ sự bất lực được nêu trong nguyên văn, nhưng không giải thích nguyên nhân thần học của sự bất lực ấy.
- source_word: ὅτι
  choice: Vì
  rationale: Giới thiệu trực tiếp lý do cho câu hỏi ở vế trước.
- source_word: τὴν ἐμὴν / τὸν ἐμόν
  choice: tôi
  rationale: Cấu trúc sở hữu “cách tôi nói” và “lời tôi” tự nhiên trong tiếng Việt, đồng thời duy trì tính song song của hai vế.
theological_decisions:
- issue: Bản chất của sự bất lực trong câu “không thể nghe lời tôi”
  choice: Dịch thẳng là “không thể”, không thêm lời giải thích về căn nguyên.
  alternative: Diễn giải là không muốn nghe, bị làm cho cứng lòng, hoặc không có khả năng thuộc linh.
  rationale: Câu này khẳng định sự bất lực nhưng không tự xác định đầy đủ cơ chế thần học; bản dịch cần giữ nguyên sức căng ấy.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “các ông” vì Chúa Giê-su đang trực tiếp nói với một nhóm đối nghịch; cách xưng hô này giữ khoảng cách và sắc thái đối chất mà không thô tục. Hai thuật ngữ λαλιὰ và λόγος được phân biệt bằng “cách tôi nói” và “lời tôi”.
