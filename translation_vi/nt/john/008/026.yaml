revisions:
- from: Tôi còn nhiều điều phải nói và xét đoán về các ông[a]. Nhưng Đấng sai tôi là chân thật, và những điều tôi đã nghe từ Ngài, chính những điều ấy tôi nói cho thế gian[b].
  to: Tôi có nhiều điều để nói và xét đoán về các ông[a]. Nhưng Đấng sai tôi là chân thật, và những điều tôi đã nghe từ Ngài, chính những điều ấy tôi nói cho thế gian[b].
  rationale: Chỉ sửa “còn nhiều điều phải nói” thành “có nhiều điều để nói” để loại bỏ sắc thái bắt buộc không được diễn đạt trong nguyên văn. Các phần còn lại, kể cả sự lặp lại nhấn mạnh ở vế cuối và các chú thích, được giữ nguyên.
  reviewer_model: gpt-5.6-terra
