    issue: “phải nói” thêm sắc thái bắt buộc
    rationale: Hy Lạp ἔχω πολλὰ ... λαλεῖν καὶ κρίνειν diễn tả rằng người nói có nhiều điều để nói và xét đoán; câu không có từ ngữ riêng chỉ sự bắt buộc như “phải.” Thay bằng “có nhiều điều để nói” bảo toàn ý nghĩa mà không thêm sắc thái tình thái.
  revised_text: Tôi có nhiều điều để nói và xét đoán về các ông[a]. Nhưng Đấng sai tôi là chân thật, và những điều tôi đã nghe từ Ngài, chính những điều ấy tôi nói cho thế gian[b].
