id: JHN.8.26
reference: John 8:26
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: πολλὰ ἔχω περὶ ὑμῶν λαλεῖν καὶ κρίνειν· ἀλλ’ ὁ πέμψας με ἀληθής ἐστιν, κἀγὼ ἃ ἤκουσα παρ’ αὐτοῦ ταῦτα ⸀λαλῶ εἰς τὸν κόσμον.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/026.yaml
  text: I have many things to say and to judge concerning you[a]. But the one who sent me is true, and what I heard from him[b], these things I speak to the world.
translation:
  language: vi
  text: Tôi có nhiều điều để nói và xét đoán về các ông[a]. Nhưng Đấng sai tôi là chân thật, và những điều tôi đã nghe từ Ngài, chính những điều ấy tôi nói cho thế gian[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “liên quan đến các ông.”'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn lặp lại đại từ chỉ định để nhấn mạnh: “những điều tôi đã nghe từ Ngài, chính những điều ấy tôi nói cho thế gian.”'
    reason: source_emphasis
lexical_decisions:
- source_word: πολλὰ
  choice: nhiều điều
  rationale: Tính từ trung tính số nhiều được dùng như danh từ; “nhiều điều” tự nhiên trong tiếng Việt và giữ rõ ý số nhiều.
- source_word: περὶ ὑμῶν
  choice: về các ông
  rationale: περί với sở hữu cách chỉ đối tượng hoặc chủ đề được nói đến. “Về các ông” là cách diễn đạt tự nhiên, đồng thời không thu hẹp nghĩa thành kết án.
- source_word: λαλεῖν
  choice: nói
  rationale: Diễn đạt hành vi phát ngôn một cách tự nhiên khi đi cùng “xét đoán”.
- source_word: κρίνειν
  choice: xét đoán
  rationale: Giữ phạm vi nghĩa rộng của κρίνω là phán xét hay đưa ra nhận định, thay vì thu hẹp thành “kết án”.
- source_word: ὁ πέμψας με
  choice: Đấng sai tôi
  rationale: Chuyển phân từ có mạo từ thành cụm danh xưng tự nhiên và trang trọng; không thêm rõ “Cha” vì danh từ ấy không có trong câu Hy Lạp.
- source_word: ἀληθής
  choice: chân thật
  rationale: Giữ được cả sắc thái nói thật, đáng tin và thực hữu vốn có thể hiện diện trong ἀληθής, không quyết định quá hẹp là “thành tín” hay “đáng tin cậy”.
- source_word: ἃ ἤκουσα παρ’ αὐτοῦ
  choice: những điều tôi đã nghe từ Ngài
  rationale: Thể hiện nội dung đã tiếp nhận từ Đấng sai mình; “đã nghe” phù hợp với thì aorist của ἤκουσα.
- source_word: ταῦτα
  choice: chính những điều ấy
  rationale: Giữ đại từ chỉ định được lặp lại rõ trong tiếng Hy Lạp và biểu đạt sức nhấn mạnh bằng “chính”.
- source_word: λαλῶ
  choice: tôi nói
  rationale: Thì hiện tại được thể hiện trực tiếp, phù hợp với việc công bố cho thế gian.
- source_word: εἰς τὸν κόσμον
  choice: cho thế gian
  rationale: Với động từ nói, εἰς diễn tả hướng lời nói đến thế gian như đối tượng tiếp nhận; “cho thế gian” tự nhiên hơn “vào thế gian” trong tiếng Việt.
theological_decisions:
- issue: Đối tượng được hàm chỉ bởi “Đấng sai tôi”
  choice: Giữ cách nói hàm ẩn “Đấng sai tôi”, không thêm “Cha”.
  alternative: “Cha, Đấng sai tôi” hoặc “Đức Chúa Cha đã sai tôi”
  rationale: Văn mạch Gioan cho thấy đối tượng là Cha, nhưng nguyên văn tại đây không nêu danh xưng ấy. Bản dịch bảo toàn cách diễn đạt của nguồn.
- issue: Sắc thái của κρίνειν
  choice: “xét đoán” theo nghĩa rộng
  alternative: “kết án” hoặc “tuyên án”
  rationale: κρίνω có thể bao hàm phán xét và kết án, nhưng riêng mệnh đề này không buộc phải chọn nghĩa hẹp là kết án.
- issue: Sắc thái của ἀληθής
  choice: “chân thật”
  alternative: “thành tín” hoặc “đáng tin cậy”
  rationale: “Chân thật” bảo toàn độ mở giữa tính chân thực, nói thật và đáng tin, phù hợp với cách dùng trong Gioan.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “các ông” cho số nhiều ὑμῶν trong lời trực tiếp với những người đang đối thoại; viết hoa “Đấng” và “Ngài” vì đối tượng hàm chỉ là Đức Chúa Cha, nhưng không đưa danh xưng “Cha” vào chính văn. Cấu trúc lặp ở vế cuối được giữ có chủ ý để phản ánh điểm nhấn của nguyên văn.
