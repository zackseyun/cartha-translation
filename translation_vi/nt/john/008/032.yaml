source:
  edition: SBLGNT
  text: καὶ γνώσεσθε τὴν ἀλήθειαν, καὶ ἡ ἀλήθεια ἐλευθερώσει ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/032.yaml
  text: and you will know the truth[b][a], and the truth will set you free.
translation:
  language: vi
  text: và các ông sẽ biết[a] chân lý, và chân lý sẽ làm cho các ông được tự do[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “sẽ nhận biết chân lý.”'
    reason: lexical_alternative
  - marker: b
    text: Trong chính câu này, lời văn không xác định đó là tự do khỏi điều gì; văn mạch tiếp theo liên hệ sự tự do này với việc thoát khỏi tội lỗi.
    reason: cross_reference
lexical_decisions:
- source_word: γνώσεσθε
  choice: sẽ biết
  rationale: Diễn đạt trực tiếp thì tương lai của γινώσκω bằng tiếng Việt tự nhiên. Cách này vẫn để ngỏ sắc thái tiến triển có thể có là “sẽ nhận biết” hay “sẽ dần biết” mà không nhấn quá mức.
- source_word: ἀλήθειαν / ἀλήθεια
  choice: chân lý
  rationale: Giữ cùng một từ ở cả hai vế để bảo toàn phép lặp tu từ của bản Hy Lạp. “Chân lý” là cách nói hiện đại, trang trọng và phù hợp với chiều sâu khái niệm của ἀλήθεια trong văn mạch Giăng.
- source_word: ἐλευθερώσει
  choice: sẽ làm cho ... được tự do
  rationale: Thể hiện rõ ý gây nên tình trạng tự do của ἐλευθερόω, đồng thời tránh sắc thái chính trị mà “giải phóng” có thể gợi lên trong tiếng Việt hiện đại.
- source_word: ὑμᾶς
  choice: các ông
  rationale: Thể hiện số nhiều và phù hợp với nhóm người trưởng thành đang được Đức Giê-su trực tiếp nói đến trong văn mạch; không thêm ý nhấn mạnh ngoài nguyên văn.
- source_word: καὶ ... καὶ
  choice: và ... và
  rationale: Giữ cấu trúc song song cùng nhịp điệu và tiến trình lập luận của hai liên từ trong nguyên văn.
theological_decisions:
- issue: Bản chất của sự tự do trong lời “chân lý sẽ làm cho các ông được tự do”
  choice: Không xác định thêm loại tự do trong chính văn.
  alternative: “chân lý sẽ giải thoát các ông khỏi tội lỗi” hoặc “sẽ làm cho các ông được tự do về phương diện thuộc linh”
  rationale: Câu này tự nó không nêu rõ tự do khỏi điều gì; các câu tiếp theo liên hệ sự tự do ấy với tội lỗi. Giữ cách nói không xác định giúp văn mạch tự giải thích mà không đưa phần diễn giải thần học vào chính văn.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “chân lý” thay cho cách nói cổ “lẽ thật”; dùng “làm cho ... được tự do” để tránh sắc thái chính trị có thể có của “giải phóng”. Các dấu chú thích được đặt ngay sau cụm từ mà mỗi chú thích giải thích.
