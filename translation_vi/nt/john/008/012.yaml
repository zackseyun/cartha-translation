id: JHN.8.12
reference: John 8:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Πάλιν οὖν αὐτοῖς ⸂ἐλάλησεν ὁ Ἰησοῦς⸃ λέγων· Ἐγώ εἰμι τὸ φῶς τοῦ κόσμου· ὁ ἀκολουθῶν ⸀ἐμοὶ οὐ μὴ περιπατήσῃ ἐν τῇ σκοτίᾳ, ἀλλ’ ἕξει τὸ φῶς τῆς ζωῆς.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/012.yaml
  text: So Jesus spoke to them again[a], saying, “I am the light of the world. The one who follows me will certainly not walk in the darkness[b], but will have the light of life.”
translation:
  language: vi
  text: 'Vậy, Giê-su lại nói với họ: “Ta là ánh sáng của thế gian. Người theo ta chắc chắn sẽ không bước đi trong bóng tối[a], nhưng sẽ có ánh sáng của sự sống[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “sẽ không bao giờ bước đi trong bóng tối.” Tiếng Hy Lạp dùng lối phủ định mạnh (οὐ μή).'
    reason: lexical_alternative
  - marker: b
    text: “Ánh sáng của sự sống” cũng có thể được hiểu là “ánh sáng ban sự sống.”
    reason: alternative_reading
lexical_decisions:
- source_word: Πάλιν οὖν
  choice: Vậy, ... lại
  rationale: “Vậy” nối tiếp mạch diễn từ mà không làm cho οὖν mang sức suy luận quá mạnh; “lại” diễn đạt hành động nói được lặp lại.
- source_word: ἐλάλησεν ... λέγων
  choice: nói với họ
  rationale: Tiếng Việt tự nhiên không cần lặp cả “nói” và “rằng rằng”; cách diễn đạt này chuyển tải hành động nói và trực tiếp dẫn vào lời trích.
- source_word: Ἐγώ εἰμι
  choice: Ta là
  rationale: Diễn đạt trực tiếp cấu trúc chủ-vị; đại từ “Ta” phù hợp với lời tự xưng trang trọng của Chúa Giê-su mà không thêm một sự nhấn mạnh thần học không có trong cú pháp.
- source_word: τὸ φῶς τοῦ κόσμου
  choice: ánh sáng của thế gian
  rationale: Giữ hình ảnh và quan hệ sở thuộc rộng mở của nguyên văn; “thế gian” phù hợp với cách dùng κόσμος trong văn mạch Giăng.
- source_word: ὁ ἀκολουθῶν ἐμοὶ
  choice: Người theo ta
  rationale: Giữ dạng số ít có tính đại diện của phân từ có mạo từ, đồng thời tự nhiên và dễ hiểu trong tiếng Việt.
- source_word: οὐ μὴ περιπατήσῃ
  choice: chắc chắn sẽ không bước đi
  rationale: “Chắc chắn sẽ không” thể hiện lối phủ định mạnh οὐ μή; “bước đi” giữ ẩn dụ của περιπατέω thay vì giải nghĩa thành một lối sống cụ thể.
- source_word: ἐν τῇ σκοτίᾳ
  choice: trong bóng tối
  rationale: Giữ hình ảnh bóng tối như một phạm vi hay tình trạng đối nghịch với ánh sáng.
- source_word: ἕξει
  choice: sẽ có
  rationale: Cách dịch trực tiếp, tự nhiên của thì tương lai động từ ἔχω.
- source_word: τὸ φῶς τῆς ζωῆς
  choice: ánh sáng của sự sống
  rationale: Giữ nguyên kết cấu sở hữu cách cô đọng, không thu hẹp ý nghĩa thành duy nhất “ánh sáng ban sự sống”.
theological_decisions:
- issue: Sức nặng trong lời tự nhận Ἐγώ εἰμι
  choice: Dịch là “Ta là” trong mệnh đề “Ta là ánh sáng của thế gian”.
  alternative: Dùng cách nhấn mạnh đặc biệt nhằm báo hiệu sự liên hệ trực tiếp với danh xưng thần linh.
  rationale: Ở đây Ἐγώ εἰμι đi với vị ngữ “ánh sáng của thế gian”. Bản dịch giữ cú pháp rõ ràng, đồng thời không ngăn người đọc nhận thấy âm hưởng thần học rộng hơn trong sách Giăng.
- issue: Ý nghĩa của τὸ φῶς τῆς ζωῆς
  choice: Giữ cách nói “ánh sáng của sự sống”.
  alternative: “ánh sáng ban sự sống” hoặc “ánh sáng đem lại sự sống”.
  rationale: Quan hệ của sở hữu cách τῆς ζωῆς có thể chỉ nguồn gốc, đặc tính hoặc hiệu quả. Cách dịch sát giữ được chiều sâu và tính rộng mở này.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “Chúa Giê-su” theo lối gọi phổ thông; “Ta” duy trì sắc thái trang trọng trong lời tự xưng. Câu văn giữ các hình ảnh “ánh sáng”, “bước đi” và “bóng tối” của nguyên bản, đồng thời đặt các ký hiệu chú thích ngay tại những cụm từ liên quan.
