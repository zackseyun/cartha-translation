id: JHN.8.50
reference: John 8:50
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐγὼ δὲ οὐ ζητῶ τὴν δόξαν μου· ἔστιν ὁ ζητῶν καὶ κρίνων.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/050.yaml
  text: But I do not seek my own glory[b][a]; there is One who seeks it and judges.
translation:
  language: vi
  text: Nhưng tôi không tìm vinh quang cho mình; có Đấng tìm điều ấy[a] và phán xét.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát hơn: “có Đấng tìm và phán xét.” Tân ngữ của “tìm” không được viết ra trong tiếng Hy Lạp, nhưng được hiểu là vinh quang của Chúa Giê-su từ vế trước.'
    reason: lexical_alternative
  - marker: b
    text: Theo ngữ cảnh, “Đấng” này thường được hiểu là Cha, dù câu Hy Lạp ở đây không nói rõ như vậy.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγὼ δὲ
  choice: Nhưng tôi
  rationale: Đại từ ἐγώ được giữ lại để thể hiện sắc thái nhấn mạnh và tương phản; δέ được dịch là “nhưng” vì đánh dấu sự đối lập với mạch văn trước.
- source_word: οὐ ζητῶ
  choice: không tìm
  rationale: Dịch thì hiện tại phủ định một cách tự nhiên, đồng thời giữ cùng động từ “tìm” với ζητῶν ở vế sau.
- source_word: τὴν δόξαν μου
  choice: vinh quang cho mình
  rationale: δόξα trong ngữ cảnh chỉ vinh quang hay sự tôn kính dành cho một người. Cách diễn đạt này tự nhiên trong tiếng Việt và làm rõ ý Chúa Giê-su không tìm cách tôn vinh chính mình.
- source_word: ἔστιν ὁ ζητῶν
  choice: có Đấng tìm điều ấy
  rationale: ἔστιν mang ý tồn tại, còn phân từ có mạo từ ὁ ζητῶν làm danh từ. “Đấng” phù hợp với một chủ thể thần linh được hàm ý trong ngữ cảnh nhưng không nêu đích danh; “điều ấy” bổ sung tân ngữ được hiểu là vinh quang của Chúa Giê-su từ vế trước.
- source_word: καὶ κρίνων
  choice: và phán xét
  rationale: Phân từ hiện tại phối hợp với ζητῶν được chuyển thành động từ song song trong tiếng Việt. “Phán xét” giữ sắc thái xét xử của κρίνω trong ngữ cảnh.
theological_decisions:
- issue: Danh tính của chủ thể không được nêu tên, là Đấng tìm và phán xét
  choice: Giữ chủ thể không nêu đích danh bằng “Đấng”
  alternative: Nêu rõ “Cha” hoặc dùng “có một người”
  rationale: Ngữ cảnh thường được hiểu là chỉ về Cha, nhưng câu Hy Lạp không trực tiếp nêu danh tính. Bản dịch không thêm “Cha”, qua đó giữ sự dè dặt và hàm ý của nguyên văn. “Đấng” tránh sắc thái ngẫu nhiên của “một người” nhưng không xác định danh tính vượt quá văn bản.
- issue: Tân ngữ hàm ẩn của ζητῶν
  choice: Bổ sung “điều ấy”, quy chiếu về vinh quang của Chúa Giê-su
  alternative: Dịch sát hình thức là “có Đấng tìm và phán xét”
  rationale: Động từ ζητῶν không có tân ngữ được viết ra, nhưng tân ngữ được hiểu từ τὴν δόξαν μου ở vế trước. Bổ sung đại từ quy chiếu giúp câu tiếng Việt tự nhiên mà không biến phần hàm ẩn thành một danh ngữ giải nghĩa quá mức.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ phép lặp “tìm” của nguyên văn, không nêu đích danh Cha trong chính văn, và dùng “phán xét” để phù hợp sắc thái pháp lý-thần học của ngữ cảnh.
