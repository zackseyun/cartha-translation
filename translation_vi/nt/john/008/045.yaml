  source_fidelity: 'Bản dịch chuyển tải chính xác các thành tố Hy Lạp: δέ là tương phản (“Nhưng”); ἐγώ được giữ để nhấn mạnh (“tôi”); ὅτι được hiểu hợp lý theo nghĩa nguyên nhân (“vì”); τὴν ἀλήθειαν là “sự thật”; và πιστεύω với tặng cách là “tin tôi”. Cấu trúc “vì … nên” diễn đạt rõ quan hệ nhân quả nghịch lý của câu mà không thêm nội dung.'
  naturalness: “Nhưng vì tôi nói sự thật, nên các ông không tin tôi” là tiếng Việt hiện đại, rõ ràng và phù hợp với lời đối thoại nghiêm nghị. Cách xưng hô “tôi / các ông” nhất quán, giữ được đối lập chủ thể và số nhiều của người nghe.
  terminology: “Sự thật” và “tin tôi” là các tương ứng tự nhiên, chính xác về ngữ nghĩa. Không có thuật ngữ thần học hoặc cách diễn giải giáo phái bị áp đặt. Chú thích nêu đúng khả năng hình thức “rằng” của ὅτι, đồng thời giải thích hợp lý lựa chọn nghĩa nguyên nhân.
