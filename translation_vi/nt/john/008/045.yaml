id: JHN.8.45
reference: John 8:45
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐγὼ δὲ ὅτι τὴν ἀλήθειαν λέγω, οὐ πιστεύετέ μοι.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/045.yaml
  text: But because I tell the truth[a], you do not believe me.
translation:
  language: vi
  text: Nhưng vì tôi nói sự thật[a], nên các ông không tin tôi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch sát hình thức hơn: “Nhưng tôi, vì nói sự thật, nên các ông không tin tôi.” Liên từ Hy Lạp cũng có thể mang nghĩa “rằng”, nhưng trong câu này nghĩa nguyên nhân “vì” phù hợp hơn.'
    reason: Nêu cách dịch sát cấu trúc và khả năng từ vựng của ὅτι.
lexical_decisions:
- source_word: ἐγὼ
  choice: tôi
  rationale: Đại từ chủ ngữ được giữ lại để thể hiện sự nhấn mạnh và tương phản với những người đang được Đức Giê-su nói đến.
- source_word: δὲ
  choice: Nhưng
  rationale: Trong mạch văn, liên từ này biểu thị sự tương phản với câu trước; “Nhưng” là cách diễn đạt tự nhiên và chính xác.
- source_word: ὅτι
  choice: vì ... nên
  rationale: 'ὅτι ở đây được hiểu theo nghĩa nguyên nhân. Cấu trúc “vì ... nên” làm rõ quan hệ nghịch lý: chính vì Đức Giê-su nói sự thật mà họ không tin ngài.'
- source_word: τὴν ἀλήθειαν
  choice: sự thật
  rationale: Cách dịch trực tiếp, tự nhiên trong tiếng Việt và phù hợp với mạch đối lập giữa thật và giả trong đoạn văn.
- source_word: λέγω
  choice: nói
  rationale: Thì hiện tại được chuyển bằng động từ đơn giản “nói”; cụm “nói sự thật” tự nhiên và sát nguyên văn.
- source_word: οὐ πιστεύετέ μοι
  choice: các ông không tin tôi
  rationale: πιστεύω đi với tặng cách có nghĩa là tin một người. “Không tin tôi” giữ được đối tượng mang tính cá nhân; “các ông” phù hợp với lời trực tiếp trang trọng gửi đến một nhóm người nam trong ngữ cảnh.
theological_decisions:
- issue: Ý nghĩa của ὅτι trong quan hệ giữa lời nói chân thật của Đức Giê-su và sự không tin của người nghe
  choice: 'Nghĩa nguyên nhân: “vì tôi nói sự thật”'
  alternative: 'Nghĩa trần thuật/hình thức: “rằng tôi nói sự thật”'
  rationale: 'Cú pháp và mạch diễn ngôn ủng hộ nghĩa nguyên nhân: trái với ma quỷ được nói đến ở câu trước, Đức Giê-su nói sự thật, nhưng chính vì thế những người nghe lại không tin ngài. Cách dịch này giữ nguyên nét nghịch lý mà không bổ sung một kết luận giáo lý.'
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “tôi” theo cách tự xưng trong lời trực tiếp; “các ông” thể hiện số nhiều và giữ sắc thái đối thoại nghiêm nghị mà không dùng thuật ngữ tôn giáo riêng biệt.
