id: JHN.8.28
reference: John 8:28
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἶπεν ⸀οὖν ὁ Ἰησοῦς· Ὅταν ὑψώσητε τὸν υἱὸν τοῦ ἀνθρώπου, τότε γνώσεσθε ὅτι ἐγώ εἰμι, καὶ ἀπ’ ἐμαυτοῦ ποιῶ οὐδέν, ἀλλὰ καθὼς ἐδίδαξέν με ὁ ⸀πατὴρ ταῦτα λαλῶ.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/028.yaml
  text: So Jesus said[a], “When you lift up the Son of Man, then you will know that I am he, and that I do nothing from myself, but just as the Father taught me[b], I speak these things.”
translation:
  language: vi
  text: 'Vì vậy, Đức Giê-su nói: “Khi các ông nâng Con Người lên[a], bấy giờ các ông sẽ biết rằng Ta là[b], và Ta không tự mình làm điều gì, nhưng Ta nói những điều này đúng như Cha đã dạy Ta.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Nâng ... lên” cũng có thể gợi việc Đức Giê-su bị nâng lên trên thập tự giá và sự Ngài được tôn cao.
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn Hy Lạp chỉ là “Ta là,” không có vị ngữ đi kèm; cũng có thể dịch: “Ta là Đấng ấy.”'
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: Vì vậy
  rationale: Giữ lực nối kết và suy luận với cuộc đối thoại trước đó, đồng thời tự nhiên trong văn xuôi tiếng Việt.
- source_word: Ὅταν
  choice: Khi
  rationale: Chỉ một biến cố cụ thể trong tương lai, không phải hành động lặp lại.
- source_word: ὑψώσητε
  choice: treo ... lên
  rationale: Diễn đạt tự nhiên hành động nâng lên theo chiều thẳng đứng trong ngữ cảnh thập tự giá, nhưng không thay bằng “đóng đinh” hay “tôn cao,” nhờ đó vẫn giữ được chiều kích kép giữa việc bị treo lên và được tôn cao.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: Con Người
  rationale: Cách gọi trang trọng, quen thuộc trong Kinh Thánh tiếng Việt và giữ liên hệ với cách dùng trong sách Đa-ni-ên cùng các sách Tin Mừng.
- source_word: γνώσεσθε
  choice: sẽ biết
  rationale: Diễn đạt trực tiếp sự nhận biết sẽ xảy đến sau biến cố được nói tới.
- source_word: ἐγώ εἰμι
  choice: Ta là
  rationale: Giữ nguyên cấu trúc không có vị ngữ của tiếng Hy Lạp và sự hàm hồ thần học có chủ ý, thay vì tự bổ sung “Đấng ấy” hay một danh xưng cụ thể.
- source_word: ἀπ’ ἐμαυτοῦ ποιῶ οὐδέν
  choice: Ta không tự mình làm điều gì
  rationale: Giữ ý nguồn gốc hoặc sáng kiến không xuất phát độc lập từ chính Đức Giê-su, bằng cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: καθὼς ἐδίδαξέν με ὁ πατήρ
  choice: đúng như Cha đã dạy Ta
  rationale: “Đúng như” giữ lực tương ứng của καθώς; “Cha” phù hợp văn cảnh Gio-an mà không tự ý thêm đại từ sở hữu.
- source_word: ταῦτα λαλῶ
  choice: Ta nói những điều này
  rationale: Giữ đại từ chỉ định ταῦτα và chuyển đạt tự nhiên hành động nói.
theological_decisions:
- issue: Cách dịch ἐγώ εἰμι không có vị ngữ
  choice: Ta là
  alternative: Ta là Đấng ấy
  rationale: Bản Hy Lạp chỉ nói “Ta là,” không nêu vị ngữ. Bản dịch chính giữ sự bỏ lửng và sức nặng thần học của câu, không quyết định thay độc giả rằng đây chỉ là cách tự nhận diện hay là lời gợi đến sự tự mặc khải thần linh.
- issue: Ý nghĩa của ὑψώσητε trong văn mạch Gio-an
  choice: treo Con Người lên
  alternative: tôn Con Người lên; đóng đinh Con Người
  rationale: Động từ có thể gợi đồng thời việc Đức Giê-su bị nâng lên trên thập tự giá và được tôn cao. Không dùng một từ chỉ khóa nghĩa vào sự hành hình hoặc sự tôn vinh.
- issue: Chủ thể số nhiều trong ὑψώσητε và γνώσεσθε
  choice: các ông
  alternative: các ngươi; anh em
  rationale: Văn cảnh là lời trực tiếp với những người đang đối thoại và chống đối Đức Giê-su. “Các ông” biểu đạt số nhiều, giữ khoảng cách phù hợp mà không mang sắc thái miệt thị quá mức.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Giê-su” trong lời dẫn và “Ta” trong lời Đức Giê-su để giữ phẩm vị. Cấu trúc câu tương đối sát nguyên văn nhưng được sắp xếp tự nhiên theo cú pháp tiếng Việt; các điểm hàm hồ quan trọng được giữ trong chính văn và chú thích.
