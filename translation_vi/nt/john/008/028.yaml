  to: 'Vì vậy, Đức Giê-su nói: “Khi các ông nâng Con Người lên[a], bấy giờ các ông sẽ biết rằng Ta là[b], và Ta không tự mình làm điều gì, nhưng Ta nói những điều này đúng như Cha đã dạy Ta.”'
