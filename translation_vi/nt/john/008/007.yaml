revisions:
- from: 'Nhưng vì họ cứ hỏi Người mãi, Người đứng thẳng lên và nói với họ: “Ai trong các ông là người không có tội, hãy là người đầu tiên ném đá vào bà ấy.”[a]'
  to: 'Nhưng khi họ cứ tiếp tục hỏi Người, Người đứng thẳng lên và nói với họ: “Ai trong các ông là người không có tội, hãy là người đầu tiên ném đá vào người phụ nữ ấy.”[a]'
  rationale: Thay “Nhưng vì” bằng “Nhưng khi” để phản ánh chính xác Ὡς δὲ và thì chưa hoàn thành của ἐπέμενον. Dùng “cứ tiếp tục hỏi” để biểu đạt hành động dai dẳng. Thay “bà ấy” bằng “người phụ nữ ấy” để không thêm hàm ý về tuổi tác, đồng thời vẫn liên kết minh bạch với nhân vật trong ngữ cảnh. Chú thích được giữ nguyên về nội dung và vị trí.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T06:21:59Z'
