  yaml_path: translation/nt/john/008/007.yaml
  text: But when[a] they continued questioning him, he straightened up and said to them, "Let the one among you who is without sin be the first to throw a stone at her."
translation:
  language: vi
  text: 'Nhưng khi họ cứ tiếp tục hỏi Người, Người đứng thẳng lên và nói với họ: “Ai trong các ông là người không có tội, hãy là người đầu tiên ném đá vào người phụ nữ ấy.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Câu này thuộc câu chuyện về người phụ nữ bị bắt quả tang phạm tội ngoại tình (Giăng 7:53–8:11), một phân đoạn không có trong các thủ bản Hy Lạp cổ nhất. Xem chú thích ở Giăng 7:53.
    reason: textual_critical
lexical_decisions:
- source_word: ἐπέμενον ἐρωτῶντες
  choice: cứ hỏi Người mãi
  rationale: Động từ ở thì chưa hoàn thành kết hợp với phân từ hiện tại diễn tả việc họ liên tục và dai dẳng hỏi; cách nói này tự nhiên trong tiếng Việt và giữ được sắc thái tiếp diễn.
- source_word: ἀνακύψας
  choice: đứng thẳng lên
  rationale: Diễn tả việc Đức Giê-su từ tư thế cúi xuống viết trên đất trở lại tư thế thẳng người; lựa chọn này rõ ràng và phù hợp ngữ cảnh.
- source_word: ἀναμάρτητος
  choice: không có tội
  rationale: Giữ nghĩa trực tiếp của tính từ hiếm này là ‘không có tội’, đồng thời không thu hẹp thành chỉ vô can đối với một hành vi cụ thể.
- source_word: πρῶτος ... τὸν λίθον βαλέτω
  choice: hãy là người đầu tiên ném đá
  rationale: Bảo toàn sự nhấn mạnh của πρῶτος và mệnh lệnh ngôi thứ ba, đồng thời dùng cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: αὐτήν
  choice: bà ấy
  rationale: Đại từ chỉ người phụ nữ trưởng thành trong ngữ cảnh; ‘bà ấy’ trang trọng, trung tính và tự nhiên hơn ‘nàng’ trong văn phong hiện đại.
theological_decisions:
- issue: Phạm vi ý nghĩa của ἀναμάρτητος
  choice: không có tội
  alternative: không phạm tội này / không có lỗi trong vụ này
  rationale: Bản Hy Lạp không giới hạn rõ ràng vào tội ngoại tình hay lỗi pháp lý cụ thể; bản dịch giữ nguyên sức căng giữa ý nghĩa đạo đức rộng và bối cảnh xét xử.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. Dùng ‘Người’ để chỉ Đức Giê-su theo lối tôn kính tự nhiên; ‘các ông’ phù hợp với nhóm người nam đang chất vấn. Dấu chú thích [a] được đặt sau toàn câu vì liên quan đến tình trạng văn bản của cả câu.
