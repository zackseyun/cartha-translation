id: JHN.8.6
reference: John 8:6
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: robinson-pierpont-2005-byzantine
  text: Τοῦτο δὲ ἔλεγον πειράζοντες αὐτόν, ἵνα ἔχωσιν κατηγορίαν κατ' αὐτοῦ. Ὁ δὲ Ἰησοῦς κάτω κύψας, τῷ δακτύλῳ ἔγραφεν εἰς τὴν γῆν, μὴ προσποιούμενος.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/john/008/006.yaml
  text: They[a] were saying this to test him, so that they might have an accusation against him. But Jesus, bending down, wrote on the ground with his finger, paying no attention.
translation:
  language: vi
  text: Họ[a] nói điều ấy để thử Ngài, hầu có cớ tố cáo Ngài. Nhưng Đức Giê-su cúi xuống, lấy ngón tay viết trên đất, làm như không để ý đến họ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Câu chuyện về người phụ nữ bị bắt quả tang phạm tội ngoại tình (Giăng 7:53–8:11) được tiếp tục ở đây. Xem chú thích tại Giăng 7:53.
    reason: textual_critical
lexical_decisions:
- source_word: πειράζω
  choice: thử
  rationale: Trong ngữ cảnh này, những người chất vấn muốn đặt Đức Giê-su vào một tình thế khó xử để có cớ tố cáo Ngài; “thử” giữ được nghĩa trực tiếp của động từ mà không thu hẹp thành “cám dỗ” hay diễn giải hẳn thành “gài bẫy”.
- source_word: κατηγορία
  choice: cớ tố cáo
  rationale: Danh từ chỉ lời buộc tội hoặc cáo buộc. Cụm “có cớ tố cáo” là cách diễn đạt tự nhiên trong tiếng Việt và phù hợp với mục đích pháp lý, đối nghịch của họ.
- source_word: προσποιέομαι
  choice: không để ý đến họ
  rationale: Dạng phân từ phủ định diễn tả việc Đức Giê-su không tỏ ra chú ý hoặc không đáp lại họ. Cách dịch này tự nhiên, đồng thời tránh thêm ý cụ thể như “không nghe thấy” vốn không được nói rõ trong câu Hy Lạp.
- source_word: κάτω κύψας
  choice: cúi xuống
  rationale: 'Diễn đạt gọn và sát hành động được mô tả bởi phân từ aorist: Đức Giê-su cúi người xuống trước hoặc trong khi viết trên đất.'
theological_decisions: []
translation_notes:
  register: Bản dịch dùng tiếng Việt hiện đại, trang trọng và dễ hiểu. “Ngài” được dùng nhất quán để chỉ Đức Giê-su; “hầu có cớ tố cáo” giữ sắc thái chủ ý và đối nghịch của nguyên văn. Dấu chú thích [a] được đặt ngay sau đại từ “Họ”, tương ứng với ghi chú về lịch sử văn bản của phân đoạn.
