lexical_decisions:
- source_word: Ἄγουσιν
  choice: dẫn đến
  rationale: Động từ hiện tại lịch sử ἄγουσιν diễn tả việc dẫn người phụ nữ đến trước Đức Chúa Jêsus; tiếng Việt dùng cách kể tự nhiên, còn “Bấy giờ” giúp nối diễn tiến câu chuyện.
- source_word: οἱ γραμματεῖς
  choice: các kinh sư
  rationale: “Kinh sư” là cách gọi hiện đại, trang trọng và dễ hiểu dành cho những người thông thạo, giảng dạy luật và Kinh Thánh.
- source_word: ἐν μοιχείᾳ κατειλημμένην
  choice: bị bắt quả tang đang ngoại tình
  rationale: Phân từ hoàn thành bị động κατειλημμένην cùng cụm ἐν μοιχείᾳ cho biết bà đã bị phát hiện trong hành vi ngoại tình; “bắt quả tang” diễn đạt tự nhiên và chính xác sắc thái này.
- source_word: στήσαντες αὐτὴν ἐν μέσῳ
  choice: Họ để bà đứng ở giữa
  rationale: Cụm này mô tả việc họ chủ ý đặt bà vào vị trí giữa những người đang hiện diện; cách dịch giữ được tư thế đứng mà vẫn tự nhiên trong tiếng Việt.
