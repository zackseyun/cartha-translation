  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸀εἶπον αὐτῷ οἱ Ἰουδαῖοι· Νῦν ἐγνώκαμεν ὅτι δαιμόνιον ἔχεις. Ἀβραὰμ ἀπέθανεν καὶ οἱ προφῆται, καὶ σὺ λέγεις· Ἐάν τις τὸν λόγον μου τηρήσῃ, οὐ μὴ γεύσηται θανάτου εἰς τὸν αἰῶνα·
base_translation:
  language: en
  yaml_path: translation/nt/john/008/052.yaml
  text: The Jews said to him[a], “Now we know that you have a demon. Abraham died, and the prophets also, yet you say, ‘If anyone keeps my word[c][b], he will certainly never taste death forever.’”
translation:
  language: vi
  text: 'Người Do Thái nói với Ngài: “Bây giờ chúng tôi biết ông có quỷ[a]. Áp-ra-ham đã chết, các nhà tiên tri cũng vậy, thế mà ông lại nói: ‘Nếu ai giữ lời tôi, người ấy chắc chắn sẽ không bao giờ nếm sự chết[b].’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “ông bị quỷ ám.” Nguyên văn Hy Lạp là “ông có quỷ.”
    reason: lexical_alternative
  - marker: b
    text: Cụm từ Hy Lạp ở đây là một lối phủ định nhấn mạnh, có nghĩa là người ấy tuyệt đối không bao giờ nếm sự chết.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ Ἰουδαῖοι
  choice: Người Do Thái
  rationale: Cách dịch trực tiếp nhóm đang đối đáp với Đức Chúa Jêsus; không thu hẹp theo lối diễn giải thành giới lãnh đạo Do Thái.
- source_word: Νῦν ἐγνώκαμεν
  choice: Bây giờ chúng tôi biết
  rationale: Diễn đạt tự nhiên trạng thái nhận biết hiện tại phát sinh từ điều họ vừa nghe.
- source_word: δαιμόνιον ἔχεις
  choice: ông có quỷ
  rationale: Giữ sát thành ngữ Hy Lạp ‘có một quỷ’; cách hiểu ‘bị quỷ ám’ được nêu trong chú thích.
- source_word: Ἀβραὰμ ἀπέθανεν καὶ οἱ προφῆται
  choice: Áp-ra-ham đã chết, các nhà tiên tri cũng vậy
  rationale: Diễn đạt tự nhiên sự phối hợp giữa Áp-ra-ham và các nhà tiên tri.
- source_word: καὶ σὺ λέγεις
  choice: thế mà ông lại nói
  rationale: Thể hiện sắc thái tương phản của καί trong ngữ cảnh.
- source_word: τὸν λόγον μου τηρήσῃ
  choice: giữ lời tôi
  rationale: Giữ cả λόγος là ‘lời’ và τηρέω là ‘giữ’, không thu hẹp ý nghĩa chỉ thành vâng lời.
- source_word: οὐ μὴ γεύσηται θανάτου εἰς τὸν αἰῶνα
  choice: chắc chắn sẽ không bao giờ nếm sự chết
  rationale: ‘Chắc chắn sẽ không bao giờ’ truyền đạt phủ định nhấn mạnh οὐ μή cùng ý nghĩa thời gian của εἰς τὸν αἰῶνα; ‘nếm sự chết’ bảo tồn hình ảnh nguyên văn.
theological_decisions:
- issue: Ý nghĩa của lời hứa về sự chết
  choice: Giữ nguyên hình ảnh ‘nếm sự chết’ mà không xác định loại sự chết nào
  alternative: Diễn giải là sự chết thể xác, sự chết thuộc linh, hoặc sự chết đời đời
  rationale: Ngữ cảnh chứa sự căng thẳng giữa cách những người đối thoại hiểu lời Đức Chúa Jêsus và chiều sâu có thể có của lời ấy; bản dịch không nên giải quyết thay cho người đọc.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ông” trong lời của những người chống đối Đức Chúa Jêsus để phản ánh thái độ không tôn kính; dùng “Ngài” trong lời dẫn của người kể. Cách viết tên riêng theo quy ước Kinh Thánh tiếng Việt phổ biến.
