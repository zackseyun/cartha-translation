review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch nhìn chung bám sát tiếng Hy Lạp: giữ được “luật của chúng ta,” Môi-se là chủ thể của mệnh lệnh, đối tượng giống cái số nhiều (“những phụ nữ như thế”), và lực chất vấn của câu cuối. Tuy nhiên, “phải ném đá” có thể được hiểu là những phụ nữ ấy phải chủ động ném đá ai đó, trong khi λιθοβολεῖσθαι là nguyên mẫu bị động: họ phải bị ném đá. “Thầy nói gì?” cũng sát τί λέγεις hơn “thầy nói sao?”.'
  naturalness: “Trong luật của chúng ta” và “Môi-se đã truyền” tự nhiên trong tiếng Việt hiện đại, với văn phong trang trọng phù hợp. “Vậy, thầy nói gì?” là lời chất vấn ngắn, trực tiếp và tự nhiên.
  terminology: “Môi-se,” “luật,” và “ném đá” phù hợp. Không thêm “đến chết,” vì chi tiết đó không được nói minh nhiên trong từ λιθοβολεῖσθαι. Cần dùng cấu trúc bị động “bị ném đá” để biểu đạt đúng ngữ pháp nguồn.
  issues:
  - severity: medium
    issue: Thiếu ý bị động trong “phải ném đá”.
    rationale: λιθοβολεῖσθαι là nguyên mẫu hiện tại bị động, nghĩa là “bị ném đá.” Cụm hiện tại có thể gây hiểu lầm về chủ thể thực hiện hành động; “phải bị ném đá” loại bỏ sự mơ hồ này.
  - severity: low
    issue: “nói sao” hơi lệch trọng tâm của τί λέγεις.
    rationale: τί hỏi nội dung (“nói gì”), không chủ yếu hỏi cách thức (“nói sao”). “Thầy nói gì?” là tương đương trực tiếp hơn và vẫn tự nhiên.
  revised_text: Trong luật của chúng ta, Môi-se đã truyền rằng những phụ nữ như thế phải bị ném đá.[a] Vậy, thầy nói gì?
