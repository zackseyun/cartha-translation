translation:
  language: vi
  text: Trong luật của chúng ta, Môi-se đã truyền rằng những phụ nữ như thế phải bị ném đá.[a] Vậy, thầy nói gì?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Câu này thuộc phần tiếp theo của câu chuyện người phụ nữ bị bắt quả tang phạm tội ngoại tình (Giăng 7:53–8:11). Xem chú thích ở Giăng 7:53.
    reason: textual_critical
lexical_decisions:
- source_word: ἐν δὲ τῷ νόμῳ ἡμῶν
  choice: Trong luật của chúng ta
  rationale: Diễn đạt tự nhiên cụm giới từ và giữ đại từ sở hữu “của chúng ta”; δὲ mang chức năng nối ý nhẹ nên không cần dịch thành một từ riêng.
- source_word: ἐνετείλατο
  choice: đã truyền
  rationale: Thể hiện mệnh lệnh có thẩm quyền do Môi-se ban trong luật, đồng thời phù hợp văn phong Kinh Thánh hiện đại.
- source_word: τὰς τοιαύτας
  choice: những phụ nữ như thế
  rationale: Mạo từ và tính từ ở giống cái số nhiều chỉ những người nữ thuộc trường hợp vừa được nhắc đến; cách dịch không mở rộng thành mọi phụ nữ phạm tội ngoại tình.
- source_word: λιθοβολεῖσθαι
  choice: phải ném đá
  rationale: Động từ nguyên mẫu bị động chỉ hình phạt ném đá; “phải” truyền đạt quan hệ bổ ngữ của động từ “truyền” một cách tự nhiên trong tiếng Việt.
- source_word: σὺ οὖν τί λέγεις;
  choice: Vậy, thầy nói sao?
  rationale: Giữ sắc thái suy luận/thách thức của οὖν và nhấn mạnh đại từ σὺ qua cách trực tiếp hỏi người đối thoại; “thầy” là đại từ xưng hô tự nhiên trong ngữ cảnh họ nói với Chúa Giê-su.
theological_decisions:
- issue: Mức độ xác định của hình phạt ném đá
  choice: Không thêm “cho đến chết”
  alternative: “ném đá đến chết”
  rationale: Ngữ cảnh pháp lý hàm ý án tử hình, nhưng bản Hy Lạp chỉ dùng λιθοβολεῖσθαι; bản dịch giữ đúng mức độ tường minh của nguồn.
- issue: Đối tượng của τὰς τοιαύτας
  choice: “những phụ nữ như thế”
  alternative: “người đàn bà như thế này”
  rationale: Giữ số nhiều và ý chỉ một hạng người trong nguyên văn, không thu hẹp ngữ pháp thành riêng người phụ nữ đang hiện diện.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Môi-se” theo dạng tên quen thuộc; câu hỏi cuối ngắn, trực tiếp, giữ sức ép trong lời chất vấn. Dấu chú thích [a] đặt sau mệnh đề liên quan đến phân đoạn có vấn đề văn bản.
