id: JHN.8.9
reference: John 8:9
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: robinson-pierpont-2005-byzantine
  text: Οἱ δὲ ἀκούσαντες, καὶ ὑπὸ τῆς συνειδήσεως ἐλεγχόμενοι, ἐξήρχοντο εἷς καθ' εἷς, ἀρξάμενοι ἀπὸ τῶν πρεσβυτέρων ἕως τῶν ἐσχάτων· καὶ κατελείφθη μόνος ὁ Ἰησοῦς, καὶ ἡ γυνὴ ἐν μέσῳ ἑστῶσα.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/john/008/009.yaml
  text: But those[a] who heard it, being convicted by their conscience, went out one by one, beginning with the older ones down to the last. And Jesus was left alone, with the woman standing in the midst.
translation:
  language: vi
  text: Nhưng khi nghe vậy, những người ấy[a] bị lương tâm cáo trách nên lần lượt đi ra, bắt đầu từ những người lớn tuổi cho đến những người cuối cùng.[b] Chỉ còn Giê-su ở lại, và người phụ nữ vẫn đứng ở giữa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Câu này thuộc phần tiếp nối của phân đoạn về người phụ nữ bị bắt quả tang phạm tội ngoại tình (Giăng 7:53–8:11). Xem chú thích ở Giăng 7:53.
    reason: textual_critical
  - marker: b
    text: 'Cũng có thể dịch: “cho tới người cuối cùng.”'
    reason: translation_alternative
lexical_decisions:
- source_word: συνείδησις
  choice: lương tâm
  rationale: Cách tương đương tự nhiên và chính xác trong tiếng Việt cho khả năng nhận biết đúng sai và làm chứng về đạo đức bên trong con người.
- source_word: ἐλέγχω
  choice: cáo trách
  rationale: Trong cấu trúc bị động với 'lương tâm', từ này diễn tả việc họ bị vạch rõ lỗi lầm và nhận biết mình có tội; 'bị lương tâm cáo trách' tự nhiên, trang trọng và không diễn giải quá mức.
- source_word: πρεσβύτερος
  choice: những người lớn tuổi
  rationale: Ngữ cảnh là một trình tự giữa những người hiện diện, không nhất thiết chỉ chức vụ trưởng lão; cách dịch theo tuổi tác giữ đúng nghĩa đối chiếu trong câu.
- source_word: ἕως τῶν ἐσχάτων
  choice: cho đến những người cuối cùng
  rationale: Giữ nghĩa giới hạn hoặc tiến trình của ἕως và sự mơ hồ của ἐσχάτων, không tự động diễn giải là 'những người trẻ nhất'.
- source_word: ἐν μέσῳ ἑστῶσα
  choice: đang đứng ở giữa
  rationale: Phản ánh trực tiếp phân từ hoàn thành ἑστῶσα với trạng thái đang đứng, đồng thời giữ nguyên cách diễn đạt không xác định rõ đứng giữa ai hoặc giữa nơi nào.
theological_decisions:
- issue: Ý nghĩa của 'những người lớn tuổi' (πρεσβυτέρων)
  choice: 'Dịch theo tuổi tác: ''những người lớn tuổi'''
  alternative: '''các trưởng lão'''
  rationale: Câu văn mô tả thứ tự những người rời đi; không có chỉ dấu chắc chắn rằng đây là một chức danh tôn giáo, nên không nhập vào bản dịch một kết luận giáo hội học.
- issue: Ý nghĩa của 'những người cuối cùng' (τῶν ἐσχάτων)
  choice: Giữ nguyên cách nói 'những người cuối cùng'
  alternative: '''những người trẻ nhất'''
  rationale: Bản Hy Lạp không nói rõ 'trẻ nhất'. Cách dịch này bảo toàn sự mơ hồ và không âm thầm hoàn tất cặp đối chiếu theo tuổi.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng 'Đức Chúa Jêsus' theo lối gọi kính trọng quen thuộc trong truyền thống Kinh Thánh tiếng Việt; 'lần lượt đi ra' chuyển tải tự nhiên εἷς καθ’ εἷς. Dấu chú thích [a], [b] đều được đặt trong chính văn.
