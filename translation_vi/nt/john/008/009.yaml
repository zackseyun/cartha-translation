revisions:
- from: Nhưng khi nghe vậy, những người ấy[a] bị lương tâm cáo trách nên lần lượt đi ra, bắt đầu từ những người lớn tuổi cho đến những người cuối cùng.[b] Chỉ còn lại một mình Đức Chúa Jêsus, cùng người phụ nữ đang đứng ở giữa.
  to: Nhưng khi nghe vậy, những người ấy[a] bị lương tâm cáo trách nên lần lượt đi ra, bắt đầu từ những người lớn tuổi cho đến những người cuối cùng.[b] Chỉ còn Giê-su ở lại, và người phụ nữ vẫn đứng ở giữa.
  rationale: 'Sửa câu cuối để tiếng Việt phân biệt rõ: Giê-su là người còn lại sau khi những người khác rời đi, còn người phụ nữ vẫn đứng ở giữa. Đổi tên gọi thành “Giê-su” để không thêm tước hiệu không hiện diện trong nguồn Hy Lạp và giữ lối dùng trung tính, hiện đại. Các phần còn lại và cả hai neo chú thích được giữ nguyên về nội dung và vị trí.'
  reviewer_model: gpt-5.6-terra
