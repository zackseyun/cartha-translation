base_translation:
  language: en
  yaml_path: translation/nt/john/008/034.yaml
  text: Jesus answered them[a], “Truly, truly, I say to you[b], everyone who practices sin is a servant of sin.”
translation:
  language: vi
  text: 'Giê-su đáp lời họ: “Quả thật, quả thật, tôi nói với các ông: Ai phạm tội thì là nô lệ[a] của tội lỗi.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hy Lạp δοῦλος cũng có thể dịch là “đầy tớ” hoặc “người tôi tớ”. Ở đây, “nô lệ” làm rõ hình ảnh bị tội lỗi thống trị; cũng có thể dịch cả cụm là “nô lệ cho tội lỗi”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπεκρίθη αὐτοῖς ὁ Ἰησοῦς
  choice: Đức Chúa Jêsus đáp lời họ
  rationale: Giữ trật tự kể chuyện tự nhiên trong tiếng Việt và sắc thái hồi đáp của ἀποκρίνομαι.
- source_word: Ἀμὴν ἀμὴν
  choice: Thật, thật
  rationale: Bảo toàn sự lặp lại trang trọng, nhấn mạnh và đặc trưng trong Phúc Âm Giăng, đồng thời dễ hiểu đối với độc giả hiện đại.
- source_word: λέγω ὑμῖν
  choice: Ta nói với các ngươi
  rationale: Bản dịch gần với công thức Hy Lạp và giữ giọng tuyên bố trang nghiêm; đại từ số nhiều phản ánh ὑμῖν.
- source_word: πᾶς ὁ ποιῶν τὴν ἁμαρτίαν
  choice: ai cứ phạm tội
  rationale: “Cứ phạm” diễn đạt tự nhiên sắc thái tiếp diễn hoặc có tính đặc trưng của phân từ hiện tại ποιῶν mà không biến câu thành lời nói chỉ về một hành vi đơn lẻ.
- source_word: δοῦλος
  choice: nô lệ
  rationale: Trong ngữ cảnh này, hình ảnh bị tội lỗi thống trị là trọng tâm; “nô lệ” truyền đạt sự lệ thuộc mạnh hơn “đầy tớ”.
- source_word: τῆς ἁμαρτίας
  choice: của tội lỗi
  rationale: 'Giữ quan hệ thuộc quyền trong sở hữu cách: người ấy thuộc dưới quyền làm chủ của tội lỗi.'
theological_decisions:
- issue: Phạm vi của hành động phạm tội
  choice: ai cứ phạm tội
  alternative: ai phạm tội
  rationale: Phân từ hiện tại có thể gợi hành động tiếp diễn hoặc đặc trưng. “Cứ phạm tội” làm rõ sắc thái ấy nhưng không dựng thành một công thức giáo lý vượt quá câu văn.
- issue: Sức nặng của ẩn dụ δοῦλος
  choice: nô lệ của tội lỗi
  alternative: đầy tớ của tội lỗi
  rationale: Mạch văn nói về tự do và sự lệ thuộc; “nô lệ” bảo toàn ý bị trói buộc và chịu quyền thống trị, trong khi “đầy tớ” có thể gợi sự phục vụ tự nguyện.
translation_notes:
  register: Văn phong trang nghiêm, rõ ràng và hiện đại. Giữ công thức lặp “Thật, thật” của Giăng và dùng “nô lệ” để bảo toàn sức nặng của hình ảnh lệ thuộc. Dùng hệ đại từ “Ta/các ngươi” theo lối Kinh Thánh trang trọng; câu vẫn dễ hiểu trong tiếng Việt phổ thông.
