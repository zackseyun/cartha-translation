  - severity: medium
    issue: “Cứ phạm tội” ấn định sắc thái lặp lại/liên tục quá rõ.
    rationale: Phân từ hiện tại có thể gợi hành động đặc trưng trong ngữ cảnh, nhưng tự nó không bắt buộc phải được diễn đạt bằng “cứ”. “Ai phạm tội” giữ được tính khái quát của cấu trúc tiếng Hy Lạp và tránh thu hẹp nghĩa.
  - severity: low
    issue: Chính tả tên riêng và hệ đại từ mang tính cổ.
    rationale: “Jêsus” cùng “Ta/các ngươi” không phải lựa chọn tối ưu cho biến thể tiếng Việt chuẩn hiện đại. “Giê-su” và “tôi/các ông” vẫn giữ giọng nghiêm trang, đồng thời tự nhiên hơn.
