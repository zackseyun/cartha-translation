review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng cấu trúc chính của câu, gồm công thức nhấn mạnh lặp lại, đối tượng số nhiều, hành động phạm tội và hình ảnh lệ thuộc của δοῦλος. Tuy nhiên, “Đức Chúa Jêsus” thêm tước hiệu không có trong tiếng Hy Lạp (ὁ Ἰησοῦς, “Giê-su”), còn “cứ phạm tội” diễn giải sắc thái tiếp diễn/đặc trưng mạnh hơn mức câu Hy Lạp buộc phải nói. Bản sửa giữ cách nói khái quát hiện tại “ai phạm tội”, vốn vẫn có thể mang nghĩa đặc trưng trong tiếng Việt mà không loại trừ các cách hiểu khác.
  naturalness: “Jêsus” và hệ xưng hô “Ta/các ngươi” mang màu sắc bản dịch cổ, không phù hợp nhất với tiếng Việt chuẩn hiện đại được yêu cầu. “Giê-su đáp lời họ”, “Quả thật, quả thật, tôi nói với các ông” là tự nhiên, trang trọng và rõ nghĩa hơn trong văn xuôi hiện đại.
  terminology: “Nô lệ của tội lỗi” giữ được sức nặng của δοῦλος trong lập luận về sự lệ thuộc. Tên riêng được chuẩn hóa thành “Giê-su”; không thêm “Đức Chúa”, vì nguyên ngữ tại đây chỉ gọi nhân vật là “Giê-su”.
  issues:
