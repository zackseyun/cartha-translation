id: JHN.8.37
reference: John 8:37
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οἶδα ὅτι σπέρμα Ἀβραάμ ἐστε· ἀλλὰ ζητεῖτέ με ἀποκτεῖναι, ὅτι ὁ λόγος ὁ ἐμὸς οὐ χωρεῖ ἐν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/037.yaml
  text: I know that you are Abraham’s offspring[a]; but you are seeking to kill me[b], because my word has no place in you.
translation:
  language: vi
  text: Ta biết các ngươi là dòng dõi Áp-ra-ham[a]; nhưng các ngươi đang tìm cách giết Ta, vì lời Ta không có chỗ trong các ngươi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “hậu duệ của Áp-ra-ham”; nguyên văn có thể dịch sát là “hạt giống của Áp-ra-ham”.
    reason: lexical_alternative
  - marker: b
    text: Hay “vì lời Ta không tìm được chỗ trong các ngươi”.
    reason: lexical_alternative
lexical_decisions:
- source_word: σπέρμα Ἀβραάμ
  choice: dòng dõi Áp-ra-ham
  rationale: Cụm từ chỉ chung những người thuộc huyết thống Áp-ra-ham. “Dòng dõi” tự nhiên trong tiếng Việt, giữ được ý nghĩa tập thể và không đưa thêm ý niệm về con cái thuộc linh.
- source_word: ζητεῖτέ με ἀποκτεῖναι
  choice: các ngươi đang tìm cách giết Ta
  rationale: “Đang tìm cách” phản ánh thể hiện tại và ý nghĩa tìm kiếm hoặc mưu toan thực hiện hành động, nhưng không diễn giải quá mức động cơ.
- source_word: ὁ λόγος ὁ ἐμὸς
  choice: lời Ta
  rationale: Cách dịch trực tiếp, trang trọng và giữ được lớp nghĩa đặc trưng của λόγος trong sách Giăng tốt hơn “sứ điệp của Ta” hay “điều Ta nói”.
- source_word: οὐ χωρεῖ ἐν ὑμῖν
  choice: không có chỗ trong các ngươi
  rationale: Giữ hình ảnh ẩn dụ về việc lời của Chúa không được tiếp nhận hay dành chỗ bên trong họ, đồng thời không thu hẹp nghĩa vào một cách giải thích duy nhất.
- source_word: ἀλλὰ
  choice: nhưng
  rationale: Diễn đạt rõ sự tương phản mạnh giữa việc thuộc dòng dõi Áp-ra-ham và ý định giết Đức Chúa Jêsus.
- source_word: οἶδα ὅτι
  choice: Ta biết
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt; nội dung của mệnh đề theo sau đã thể hiện đầy đủ quan hệ bổ ngữ mà không cần thêm “rằng”.
theological_decisions:
- issue: Mối liên hệ giữa huyết thống Áp-ra-ham và sự thật sự noi theo Áp-ra-ham
  choice: Dịch σπέρμα Ἀβραάμ theo nghĩa huyết thống là “dòng dõi Áp-ra-ham”.
  alternative: con cái Áp-ra-ham
  rationale: Trong câu này, Chúa Jêsus thừa nhận nguồn gốc huyết thống của họ nhưng đối chiếu điều ấy với thái độ thù nghịch của họ. “Dòng dõi” bảo toàn sự căng thẳng thần học và không sớm đồng nhất huyết thống với địa vị thuộc linh.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ta/các ngươi” để giữ giọng phát ngôn có thẩm quyền và lời đối đáp trực diện trong bối cảnh. Tất cả dấu chú thích đều xuất hiện trong chính văn.
