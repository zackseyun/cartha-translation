id: JHN.8.18
reference: John 8:18
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐγώ εἰμι ὁ μαρτυρῶν περὶ ἐμαυτοῦ καὶ μαρτυρεῖ περὶ ἐμοῦ ὁ πέμψας με πατήρ.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/018.yaml
  text: I am the one who testifies about myself[a], and the Father who sent me testifies about me.
translation:
  language: vi
  text: Chính tôi là người làm chứng về mình, và Cha, Đấng đã sai tôi, cũng làm chứng về tôi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “làm chứng về chính mình … làm chứng về tôi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγώ εἰμι ὁ μαρτυρῶν
  choice: Chính tôi là người làm chứng
  rationale: 'Mạo từ đi với phân từ hiện tại tạo thành cụm danh từ: “người làm chứng.” “Chính tôi” diễn đạt sự nhấn mạnh của đại từ ἐγώ trong tiếng Việt tự nhiên, còn “làm chứng” giữ sắc thái pháp lý và mô-típ chứng nhân trong Giăng.'
- source_word: περὶ ἐμαυτοῦ
  choice: về mình
  rationale: περί với sở hữu cách ở đây mang nghĩa “về/liên quan đến”; “về mình” tự nhiên và giữ nguyên ý phản thân, không diễn giải quá mức thành “bênh vực mình.”
- source_word: μαρτυρεῖ περὶ ἐμοῦ
  choice: làm chứng về tôi
  rationale: Lặp lại “làm chứng” để bảo toàn liên kết từ vựng với μαρτυρῶν và sắc thái chứng cứ; “về tôi” là cách chuyển ngữ trực tiếp, tự nhiên của περὶ ἐμοῦ.
- source_word: ὁ πέμψας με πατήρ
  choice: Cha, Đấng đã sai tôi
  rationale: Phân từ quá khứ có mạo từ bổ nghĩa cho πατήρ. Cấu trúc đồng vị “Đấng đã sai tôi” vừa rõ nghĩa vừa trang trọng; không thêm “của tôi” hay “Đức Chúa Trời,” vì các từ ấy không có trong câu Hy Lạp.
- source_word: καί
  choice: và ... cũng
  rationale: “Và” nối hai nhân chứng, còn “cũng” giúp tiếng Việt thể hiện tự nhiên rằng lời chứng của Cha song song với lời chứng của Đức Giê-su.
theological_decisions:
- issue: Cách gọi ὁ ... πατήρ trong văn cảnh Giăng
  choice: Cha, Đấng đã sai tôi
  alternative: Cha tôi, Đấng đã sai tôi; Đức Chúa Trời là Cha
  rationale: Bản Hy Lạp chỉ nói “Cha,” xác định Ngài bằng mệnh đề “Đấng đã sai tôi.” Bản dịch giữ nguyên tuyên bố quan hệ và thần học mà không thêm cách giải thích giáo lý.
- issue: Sắc thái pháp lý của μαρτυρέω
  choice: làm chứng
  alternative: chứng thực; làm chứng trong vụ việc của tôi
  rationale: “Làm chứng” là cách nói hiện đại, dễ hiểu, đồng thời giữ được mô-típ pháp lý/chứng nhân và sự lặp từ trong câu.
- issue: Khả năng hiểu περὶ theo nghĩa đối tượng hay lợi ích
  choice: về mình / về tôi
  alternative: cho mình / cho tôi; bênh vực mình / bênh vực tôi
  rationale: περί với sở hữu cách tự nhiên nhất là “về/liên quan đến.” Cách dịch này giữ độ mở của nguyên văn, không đẩy câu sang nghĩa biện hộ hoặc đứng về phía ai.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Cha” theo nguyên văn, “Đấng” trong cụm đồng vị để tránh mơ hồ, và giữ nhất quán “làm chứng” ở cả hai vế. Dấu chú thích [a] được đặt sau toàn câu vì ghi chú liên quan đến cách diễn đạt lời chứng trong cả hai vế.
