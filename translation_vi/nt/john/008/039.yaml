source:
  edition: SBLGNT
  text: Ἀπεκρίθησαν καὶ εἶπαν αὐτῷ· Ὁ πατὴρ ἡμῶν Ἀβραάμ ἐστιν. λέγει αὐτοῖς ὁ Ἰησοῦς· Εἰ τέκνα τοῦ Ἀβραάμ ⸀ἐστε, τὰ ἔργα τοῦ Ἀβραὰμ ⸀ἐποιεῖτε·
base_translation:
  language: en
  yaml_path: translation/nt/john/008/039.yaml
  text: They answered and said to him[a], “Abraham is our father.” Jesus says to them, “If you are Abraham’s children, you would be doing Abraham’s works.”
translation:
  language: vi
  text: 'Họ trả lời Người: “Áp-ra-ham là cha chúng tôi.” Giê-su nói với họ: “Nếu các ông là con cái của Áp-ra-ham, thì các ông hẳn đang làm những việc của Áp-ra-ham.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Nếu các ông là con cái của Áp-ra-ham, thì các ông làm những việc của Áp-ra-ham.” Động từ Hy Lạp ở vế sau là thì chưa hoàn thành; trong câu điều kiện này, nó thường được hiểu là hàm ý trái với thực tế.'
    reason: Ghi nhận cách hiểu khác về lực phản thực của câu điều kiện và sắc thái của ἐποιεῖτε, mà không đổi động từ chỉ định thành mệnh lệnh.
lexical_decisions:
- source_word: Ἀπεκρίθησαν καὶ εἶπαν αὐτῷ
  choice: Họ đáp lời Ngài
  rationale: Cụm hai động từ là một lối diễn đạt kể chuyện Semit hóa quen thuộc; tiếng Việt tự nhiên gói ý đáp và nói trong “đáp lời”, còn “Ngài” giữ sắc thái trang trọng khi chỉ về Đức Chúa Jêsus.
- source_word: Ὁ πατὴρ ἡμῶν Ἀβραάμ ἐστιν
  choice: Áp-ra-ham là cha chúng tôi
  rationale: Giữ nguyên lời khẳng định trực tiếp về quan hệ tổ phụ, với trật tự câu tự nhiên trong tiếng Việt.
- source_word: λέγει αὐτοῖς ὁ Ἰησοῦς
  choice: Đức Chúa Jêsus nói với họ
  rationale: Dùng thì hiện tại trong lời kể để phản ánh hiện tại lịch sử λέγει và giữ tính sống động của diễn ngôn.
- source_word: τέκνα τοῦ Ἀβραάμ
  choice: con cái của Áp-ra-ham
  rationale: “Con cái” bao gồm cả hai giới và giữ ý quan hệ thuộc về, không thu hẹp thành con trai hay chỉ giải thích theo huyết thống.
- source_word: τὰ ἔργα τοῦ Ἀβραὰμ
  choice: những việc Áp-ra-ham đã làm
  rationale: Cách nói này tự nhiên hơn “các công việc của Áp-ra-ham” trong tiếng Việt mà vẫn giữ trọng tâm đạo đức nơi hành động thực tế của Áp-ra-ham.
- source_word: ἐποιεῖτε
  choice: hẳn đang làm
  rationale: Thể chưa hoàn thành trong cấu trúc điều kiện được diễn đạt bằng “hẳn đang làm”, vừa gợi hành động liên tục vừa chuyển tải hàm ý trái với thực tế mà không làm câu trở nên cứng.
theological_decisions:
- issue: Bản chất tư cách làm con cái Áp-ra-ham
  choice: Giữ nguyên ngôn ngữ quan hệ “con cái của Áp-ra-ham” và để hành động làm tiêu chuẩn đối chiếu trong câu của Đức Chúa Jêsus.
  alternative: Diễn giải rõ thành “con cái thuộc linh của Áp-ra-ham” hoặc hiểu là phủ nhận hoàn toàn dòng dõi thể xác.
  rationale: Câu này đặt lời tự nhận Áp-ra-ham là cha bên cạnh việc họ không làm như Áp-ra-ham; bản dịch giữ nguyên sự căng thẳng ấy, không đưa vào một hệ thống thần học vượt quá điều câu văn nói.
- issue: Sắc thái của câu điều kiện
  choice: Dùng “Nếu… thì… hẳn đang…” để biểu đạt cách hiểu điều kiện trái với thực tế.
  alternative: 'Dùng câu điều kiện mở: “Nếu các ông là con cái của Áp-ra-ham, hãy làm những việc Áp-ra-ham đã làm” hoặc “thì các ông làm những việc…”'
  rationale: Dạng ἐποιεῖτε theo văn bản nguồn có thể mang lực phản thực trong ngữ cảnh; chú thích ghi nhận cách hiểu khác để không che khuất sự nhập nhằng ngữ pháp.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “các ông” phù hợp với lời Đức Chúa Jêsus nói trực tiếp với nhóm đối thoại; dùng “Đức Chúa Jêsus” và đại từ “Ngài” theo văn phong Kinh Thánh tiếng Việt phổ thông. Tên riêng viết “Áp-ra-ham” và “Jêsus” nhất quán theo lối phiên chuyển quen thuộc.
