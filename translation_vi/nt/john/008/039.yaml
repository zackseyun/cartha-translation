review_pass:
  verdict: revise
  source_fidelity: Bản dịch phản ánh đúng lời tự nhận Áp-ra-ham là cha và sự đối chiếu giữa tư cách con cái với hành động. Tuy nhiên, “Đức Chúa Jêsus” thêm tước hiệu “Chúa” không có trong ὁ Ἰησοῦς của câu này; “những việc Áp-ra-ham đã làm” cũng chuyển sở hữu cách “những việc của Áp-ra-ham” thành một diễn giải quá cụ thể. Chú thích hiện có đưa ra mệnh lệnh “hãy làm”, không tương ứng với ἐποιεῖτε là động từ chỉ định chưa hoàn thành trong văn bản SBLGNT.
  naturalness: Câu văn tự nhiên và trang trọng. “Hẳn đang làm” là cách khả dĩ để diễn tả hệ quả giả định, đồng thời gợi nét tiếp diễn của thì chưa hoàn thành. “Những việc của Áp-ra-ham” tự nhiên trong văn cảnh Kinh Thánh và sát cấu trúc nguồn hơn.
  terminology: Dùng “Giê-su” thay cho “Đức Chúa Jêsus” để không thêm danh xưng thần học ngoài bản văn và dùng chính tả Việt ngữ hiện đại. Giữ “Áp-ra-ham” và “con cái của Áp-ra-ham”; cụm này không quyết định sẵn cách hiểu về huyết thống hay tư cách thuộc linh.
  issues:
  - severity: medium
    issue: Danh xưng “Đức Chúa Jêsus” vượt quá bản văn nguồn.
    rationale: SBLGNT chỉ có ὁ Ἰησοῦς, nghĩa là “Giê-su”; không có κύριος (“Chúa”). Bản dịch không nên thêm tước hiệu thần học không hiện diện trong câu.
  - severity: medium
    issue: Chú thích thay thế bằng “hãy làm” sai loại thức của động từ nguồn.
    rationale: ἐποιεῖτε là chỉ định chưa hoàn thành, không phải mệnh lệnh. Có thể nêu phương án điều kiện không phản thực bằng một mệnh đề chỉ định, nhưng không nên biến nó thành mệnh lệnh.
  - severity: low
    issue: “Những việc Áp-ra-ham đã làm” diễn giải sở hữu cách.
    rationale: τὰ ἔργα τοῦ Ἀβραάμ sát hơn là “những việc của Áp-ra-ham”. Cách cũ không sai ý chính, nhưng thu hẹp cụm từ thành các hành vi quá khứ cụ thể.
