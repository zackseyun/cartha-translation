revisions:
- from: 'Họ đáp lời Ngài: “Áp-ra-ham là cha chúng tôi.” Đức Chúa Jêsus nói với họ: “Nếu các ông là con cái của Áp-ra-ham, thì các ông hẳn đang làm những việc Áp-ra-ham đã làm.”[a]'
  to: 'Họ trả lời Người: “Áp-ra-ham là cha chúng tôi.” Giê-su nói với họ: “Nếu các ông là con cái của Áp-ra-ham, thì các ông hẳn đang làm những việc của Áp-ra-ham.”[a]'
  rationale: Bản sửa loại bỏ tước hiệu không có trong nguyên văn, khôi phục cách diễn đạt sở hữu sát với τὰ ἔργα τοῦ Ἀβραάμ, và thay chú thích bằng một phương án ngữ pháp có thể chấp nhận được. Cách dịch chính vẫn bảo toàn sắc thái điều kiện có thể hàm ý phản thực mà không áp đặt một diễn giải thần học về tư cách con cái Áp-ra-ham.
