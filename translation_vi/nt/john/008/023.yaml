  text: καὶ ⸀ἔλεγεν αὐτοῖς· Ὑμεῖς ἐκ τῶν κάτω ἐστέ, ἐγὼ ἐκ τῶν ἄνω εἰμί· ὑμεῖς ἐκ ⸂τούτου τοῦ κόσμου⸃ ἐστέ, ἐγὼ οὐκ εἰμὶ ἐκ τοῦ κόσμου τούτου.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/023.yaml
  text: And he was saying to them[a], “You are from below; I am from above. You are from this world[b]; I am not from this world.”
translation:
  language: vi
  text: 'Ngài nói với họ: “Các ông từ dưới; còn tôi từ trên. Các ông từ thế gian này; còn tôi không từ thế gian này.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγεν
  choice: nói
  rationale: Thì chưa hoàn thành mô tả lời nói đang diễn ra trong mạch tường thuật; tiếng Việt tự nhiên thường dùng “nói” mà không cần thêm một trạng từ có thể hàm ý sự lặp lại quá mức.
- source_word: Ὑμεῖς / ἐγὼ
  choice: các ông / tôi
  rationale: Giữ đại từ được nêu rõ trong tiếng Hy Lạp để nhấn mạnh sự đối lập giữa những người nghe và Chúa Giê-su. “Các ông” phù hợp với nhóm nam giới đang đối thoại, còn “tôi” tự nhiên trong lời nói trực tiếp hiện đại.
- source_word: ἐκ τῶν κάτω
  choice: đến từ nơi dưới
  rationale: Giữ ý nguồn gốc của ἐκ và hình ảnh chiều dọc, đồng thời tránh diễn giải “nơi dưới” thành một địa hạt đạo đức hoặc siêu hình cụ thể.
- source_word: ἐκ τῶν ἄνω
  choice: đến từ nơi trên
  rationale: Đối xứng với “đến từ nơi dưới” và bảo toàn hình ảnh tương phản của văn phong Giăng.
- source_word: κόσμος
  choice: thế gian
  rationale: “Thế gian” là cách diễn đạt quen thuộc, trang trọng và đủ rộng cho κόσμος trong Giăng, có thể chỉ trật tự nhân loại xa cách Đức Chúa Trời chứ không chỉ trái đất vật chất.
- source_word: τούτου τοῦ κόσμου / τοῦ κόσμου τούτου
  choice: thế gian này
  rationale: Giữ đại từ chỉ định và dịch nhất quán hai trật tự từ Hy Lạp bằng cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: οὐκ εἰμὶ ἐκ τοῦ κόσμου τούτου
  choice: tôi không đến từ thế gian này
  rationale: Giữ cấu trúc ἐκ được lặp lại và trọng tâm về nguồn gốc; “không thuộc về” tuy tự nhiên nhưng nghiêng hơn về quan hệ liên kết.
theological_decisions:
- issue: Ý nghĩa của sự tương phản “nơi dưới/nơi trên” và “thế gian này”
  choice: Giữ ngôn ngữ về nguồn gốc và lĩnh vực tồn tại mà không giải thích thêm thành một mệnh đề đạo lý hay tín lý cụ thể.
  alternative: Có thể dịch diễn giải thành sự đối lập giữa cõi trần gian tội lỗi và cõi trời.
  rationale: Bản Hy Lạp trình bày một sự tương phản mạnh mẽ mang tính Cơ Đốc học nhưng không tự giải nghĩa đầy đủ các hình ảnh ấy; bản dịch vì vậy bảo toàn sự căng thẳng và tính đa nghĩa chính đáng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” trong lời dẫn, “tôi” trong lời trực tiếp, và “các ông” cho nhóm người đang đối thoại. Các vế song song được giữ để làm nổi bật sự đối lập trong nguyên văn.
