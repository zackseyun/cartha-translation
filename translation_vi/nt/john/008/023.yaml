- from: 'Ngài nói với họ: “Các ông đến từ nơi dưới[a]; còn tôi đến từ nơi trên. Các ông đến từ thế gian này[b]; còn tôi không đến từ thế gian này.”'
  to: 'Ngài nói với họ: “Các ông từ dưới; còn tôi từ trên. Các ông từ thế gian này; còn tôi không từ thế gian này.”'
