id: JHN.8.14
reference: John 8:14
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτοῖς· Κἂν ἐγὼ μαρτυρῶ περὶ ἐμαυτοῦ, ἀληθής ἐστιν ἡ μαρτυρία μου, ὅτι οἶδα πόθεν ἦλθον καὶ ποῦ ὑπάγω· ὑμεῖς δὲ οὐκ οἴδατε πόθεν ἔρχομαι ⸀ἢ ποῦ ὑπάγω.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/014.yaml
  text: Jesus answered and said to them[a], “Even if I testify about myself, my testimony is true, because I know where I came from and where I am going[b]; but you do not know where I come from or where I am going.”
translation:
  language: vi
  text: 'Đức Giê-su trả lời họ rằng: “Ngay cả khi chính tôi làm chứng[a] về mình, lời chứng của tôi vẫn là thật, vì tôi biết tôi từ đâu đến và đi đâu; nhưng các ông không biết tôi từ đâu đến hoặc tôi đi đâu.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “làm chứng về chính mình.”'
    reason: lexical_alternative
  - marker: b
    text: Một số bản chép tay đọc “và tôi đi đâu” thay cho “hoặc tôi đi đâu.”
    reason: textual_variant
lexical_decisions:
- source_word: ἀπεκρίθη ... καὶ εἶπεν
  choice: đáp và nói với họ
  rationale: Giữ lại cả hai động từ trong lối kể chuyện đặc trưng của Giăng, đồng thời diễn đạt bằng cấu trúc rõ ràng trong tiếng Việt.
- source_word: Κἂν
  choice: Ngay cả khi
  rationale: 'Thể hiện sắc thái nhượng bộ: Chúa Giê-su tạm chấp nhận giả định được nêu ra mà không thừa nhận lời chứng của Ngài là không đáng tin.'
- source_word: μαρτυρῶ περὶ ἐμαυτοῦ
  choice: chính tôi làm chứng về mình
  rationale: “Làm chứng” giữ được trường nghĩa chứng nhân/pháp lý; “chính tôi” phản ánh đại từ ἐγώ được nêu rõ và có tính nhấn mạnh.
- source_word: ἀληθής ... ἡ μαρτυρία μου
  choice: lời chứng của tôi vẫn là thật
  rationale: “Thật” bảo toàn ý nghĩa về tính chân thật mà không thu hẹp câu thành khái niệm pháp lý “hợp lệ”; “vẫn” diễn đạt tự nhiên hệ quả của mệnh đề nhượng bộ.
- source_word: ὅτι οἶδα
  choice: vì tôi biết
  rationale: ὅτι nêu lý do cho tính chân thật của lời chứng, còn οἶδα là lời khẳng định trực tiếp về sự biết.
- source_word: πόθεν ἦλθον καὶ ποῦ ὑπάγω
  choice: mình từ đâu đến và sẽ đi đâu
  rationale: Diễn đạt tự nhiên nguồn gốc và đích đến trong tiếng Việt; “sẽ đi đâu” phù hợp với chuyển động có hướng đến được nói tới trong ngữ cảnh.
- source_word: ὑμεῖς δὲ οὐκ οἴδατε
  choice: nhưng các ông không biết
  rationale: “Nhưng” giữ thế tương phản; “các ông” thể hiện đại từ số nhiều được nhấn mạnh trong lời Chúa Giê-su nói với những người đối thoại.
- source_word: ἢ
  choice: hoặc
  rationale: Theo bản văn chính của SBLGNT và giữ nguyên quan hệ lựa chọn giữa hai điều họ không biết; biến thể “và” được ghi ở chú thích.
theological_decisions:
- issue: Bản chất lời tự chứng của Chúa Giê-su
  choice: Trình bày lời chứng là chân thật vì Ngài biết nguồn gốc và đích đến của mình.
  alternative: Diễn đạt hẹp hơn theo nghĩa lời chứng có giá trị pháp lý, hoặc diễn giải rõ nguồn gốc thiên thượng ngay trong câu.
  rationale: Câu Hy Lạp trực tiếp đặt nền tảng cho lời chứng nơi tri thức độc nhất của Chúa Giê-su về nơi Ngài đến và nơi Ngài đi. Bản dịch không thêm công thức tín lý hay giải nghĩa nguồn gốc ấy vượt quá lời của câu.
- issue: Biến thể liên từ ở cuối câu
  choice: Dùng “hoặc”, theo ἢ trong bản văn chính SBLGNT.
  alternative: “và”, theo một số bản chép tay.
  rationale: Hai cách đọc đều không nên bị đồng nhất âm thầm; bản dịch theo bản văn chính và ghi nhận biến thể bằng chú thích.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Cách xưng hô “tôi—các ông” phù hợp với cuộc đối thoại công khai và giữ rõ đại từ số nhiều; tránh đưa thêm cách giải thích hệ phái vào bản văn.
