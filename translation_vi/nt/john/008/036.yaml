source:
  edition: SBLGNT
  text: ἐὰν οὖν ὁ υἱὸς ὑμᾶς ἐλευθερώσῃ, ὄντως ἐλεύθεροι ἔσεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/036.yaml
  text: So if the Son sets you free[a], you will be truly free.
translation:
  language: vi
  text: Vậy nếu Con giải thoát anh em, thì anh em sẽ thật sự tự do.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “thực sự tự do” hoặc “quả thật tự do.” Trạng từ Hy Lạp nhấn mạnh rằng sự tự do này là có thật, đích thực.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν οὖν
  choice: Vậy, nếu ... thì
  rationale: “Nếu ... thì” diễn đạt tự nhiên cấu trúc điều kiện, còn “vậy” giữ quan hệ suy luận của οὖν với lập luận ngay trước đó.
- source_word: ὁ υἱὸς
  choice: Con
  rationale: Mạo từ cùng văn cảnh Giăng cho thấy đây là tước hiệu chỉ riêng Chúa Giê-su. Viết hoa “Con” thể hiện cách dùng như tước hiệu mà không thêm ý ngoài văn bản.
- source_word: ὑμᾶς
  choice: anh em
  rationale: Đại từ Hy Lạp ở ngôi thứ hai số nhiều. “Anh em” truyền đạt số nhiều bằng lối xưng hô tự nhiên, trang trọng trong văn cảnh Kinh Thánh hiện đại.
- source_word: ἐλευθερώσῃ
  choice: giải thoát
  rationale: Động từ chỉ hành động làm cho một người được tự do. “Giải thoát” rõ nghĩa và tự nhiên trong văn cảnh nói về cảnh nô lệ cho tội lỗi.
- source_word: ὄντως
  choice: thật sự
  rationale: Trạng từ nhấn mạnh rằng sự tự do ấy là có thật, đích thực; “thật sự” tự nhiên trong tiếng Việt hiện đại và giữ được sức nhấn mạnh.
- source_word: ἐλεύθεροι ἔσεσθε
  choice: anh em sẽ ... tự do
  rationale: Giữ tính từ vị ngữ mô tả tình trạng kết quả và thì tương lai, thay vì chỉ nhắc lại hành động được giải thoát.
theological_decisions:
- issue: Căn tính của “Con”
  choice: Dùng “Con” như một tước hiệu chỉ Chúa Giê-su
  alternative: Hiểu là một người con nói chung
  rationale: Trong văn cảnh Phúc Âm Giăng, “Con” thuộc lời tự bày tỏ của Chúa Giê-su và gắn với thẩm quyền cùng địa vị lâu dài trong nhà; đây không phải một danh từ bất định.
- issue: Bản chất của sự tự do
  choice: Diễn đạt rộng là “thật sự tự do”
  alternative: Thu hẹp thành chỉ tự do thuộc linh, nội tâm, xã hội hoặc chính trị
  rationale: Văn cảnh trực tiếp nói đến cảnh nô lệ cho tội lỗi, nhưng chính câu này phát biểu kết quả theo nghĩa rộng. Bản dịch giữ nguyên sức nặng và phạm vi của lời tuyên bố mà không giải thích hẹp hơn văn bản.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Cấu trúc “nếu ... thì” tự nhiên; “anh em” thể hiện rõ đối tượng số nhiều mà không dùng đại từ cổ.
