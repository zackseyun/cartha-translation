source:
  edition: SBLGNT
  text: ὑμεῖς κατὰ τὴν σάρκα κρίνετε, ἐγὼ οὐ κρίνω οὐδένα.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/015.yaml
  text: You judge according to the flesh[a]; I judge no one.
translation:
  language: vi
  text: Các ông xét đoán theo xác thịt[a]; còn tôi không xét đoán một ai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “theo tiêu chuẩn loài người” hoặc “theo vẻ bề ngoài.”
    reason: Nêu các cách hiểu theo ngữ cảnh của thành ngữ κατὰ τὴν σάρκα mà không thay thế cách diễn đạt giàu sắc thái trong chính văn.
lexical_decisions:
- source_word: ὑμεῖς
  choice: Các ông
  rationale: Đại từ ngôi thứ hai số nhiều được nêu rõ và mang sắc thái nhấn mạnh. “Các ông” tự nhiên trong ngữ cảnh Chúa Giê-su nói với những người đang đối chất với Ngài, đồng thời phân biệt rõ với vế “còn tôi”.
- source_word: κατὰ τὴν σάρκα
  choice: theo xác thịt
  rationale: Giữ sát hình ảnh và độ mở nghĩa của σάρξ trong câu Hy Lạp, không thu hẹp cụm từ thành một cách giải thích duy nhất như tiêu chuẩn loài người hay vẻ bề ngoài.
- source_word: κρίνετε
  choice: xét đoán
  rationale: Động từ hiện tại chủ động, ngôi thứ hai số nhiều. “Xét đoán” diễn đạt tự nhiên hành vi đưa ra phán xét trong ngữ cảnh này.
- source_word: ἐγὼ
  choice: còn tôi, tôi
  rationale: Đại từ ngôi thứ nhất được nêu rõ để tạo thế tương phản với ὑμεῖς. Cấu trúc “còn tôi, tôi” chuyển tải sự nhấn mạnh ấy một cách rõ ràng trong tiếng Việt.
- source_word: οὐ κρίνω οὐδένα
  choice: tôi không xét đoán một ai
  rationale: Cách diễn đạt này giữ nguyên sự phủ định dứt khoát và phạm vi bao quát của οὐδένα, đồng thời tự nhiên trong tiếng Việt hiện đại.
theological_decisions:
- issue: Ý nghĩa của σάρξ trong cụm κατὰ τὴν σάρκα
  choice: Giữ cách dịch “theo xác thịt” trong chính văn.
  alternative: “theo tiêu chuẩn loài người” hoặc “theo vẻ bề ngoài”
  rationale: Trong ngữ cảnh, cụm từ có thể nói đến sự xét đoán theo tiêu chuẩn thuần túy của con người hoặc theo điều bề ngoài. Giữ “xác thịt” bảo toàn cách diễn đạt của Gio-an và sự căng nghĩa thần học, thay vì âm thầm chọn một cách giải thích.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “các ông” cho đối tượng số nhiều trong cuộc đối thoại và “còn tôi, tôi” để giữ thế tương phản rõ của hai đại từ Hy Lạp.
