  source_fidelity: 'Bản nháp truyền đạt đúng các thành phần chính: Đấng sai Đức Giê-su ở cùng Người, không để Người cô độc, và Người luôn làm điều đẹp lòng Đấng ấy. Tuy nhiên, “vẫn” thêm sắc thái ‘still/yet’ không được biểu thị trong μετ’ ἐμοῦ ἐστιν; thì hiện tại của ἐστιν chỉ khẳng định sự hiện diện hiện thời. Bỏ từ này sẽ sát nguyên văn hơn mà không mất tính tự nhiên.'
