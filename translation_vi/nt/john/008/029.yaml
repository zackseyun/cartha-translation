  terminology: “Đấng đã sai tôi” giữ được lối diễn đạt quan hệ của nguyên văn, không bổ sung danh xưng “Cha.” “Những điều đẹp lòng Ngài” diễn đạt tốt τὰ ἀρεστὰ αὐτῷ; “luôn làm” bảo toàn sắc thái thường xuyên của ποιῶ πάντοτε. Không cần chú thích.
