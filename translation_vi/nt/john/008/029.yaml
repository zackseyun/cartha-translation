  text: καὶ ὁ πέμψας με μετ’ ἐμοῦ ἐστιν· οὐκ ἀφῆκέν με ⸀μόνον, ὅτι ἐγὼ τὰ ἀρεστὰ αὐτῷ ποιῶ πάντοτε.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/029.yaml
  text: And the one who sent me is with me[a]. He has not left me alone[b], because I always do what is pleasing to him.
translation:
  language: vi
  text: Đấng đã sai tôi ở với tôi. Ngài không để tôi một mình, vì tôi luôn làm những điều đẹp lòng Ngài.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ πέμψας με
  choice: Đấng đã sai tôi
  rationale: Phân từ quá khứ có mạo từ được dùng như danh từ. “Đấng đã sai tôi” tự nhiên, trang trọng và giữ nguyên cách diễn đạt chỉ về Cha mà không thêm danh xưng vào câu.
- source_word: μετ’ ἐμοῦ ἐστιν
  choice: vẫn ở với tôi
  rationale: μετά với sở hữu cách diễn tả sự hiện diện cùng với ai. Từ “vẫn” làm rõ sự hiện diện tiếp diễn trong ngữ cảnh tiếng Việt mà không đổi ý nghĩa.
- source_word: οὐκ ἀφῆκέν με μόνον
  choice: Ngài không để tôi một mình
  rationale: ἀφίημι ở đây có nghĩa là để lại, còn μόνον bổ nghĩa theo lối vị ngữ cho “tôi”. Cách dịch này tự nhiên và giữ được ý không bị bỏ lại đơn độc.
- source_word: ὅτι
  choice: vì
  rationale: ὅτι giới thiệu lý do, nên “vì” truyền đạt rõ quan hệ nguyên nhân.
- source_word: τὰ ἀρεστὰ αὐτῷ
  choice: những điều đẹp lòng Ngài
  rationale: Cụm tính từ trung tính số nhiều được danh từ hóa, theo nghĩa sát là “những điều làm đẹp lòng Ngài”. Cách dịch này vừa tự nhiên vừa giữ sắc thái đánh giá của ἀρεστός.
- source_word: ποιῶ πάντοτε
  choice: tôi luôn làm
  rationale: Thì hiện tại diễn tả hành động thường xuyên, còn πάντοτε nhấn mạnh tính liên tục; “luôn làm” thể hiện đúng cả hai.
theological_decisions:
- issue: Đối tượng được gọi là “Đấng đã sai tôi”
  choice: Giữ nguyên cách nói quan hệ “Đấng đã sai tôi”.
  alternative: Dịch rõ thành “Cha, Đấng đã sai tôi”.
  rationale: Ngữ cảnh xác định đó là Cha, nhưng nguyên văn không dùng danh xưng “Cha” trong câu này. Giữ cách nói của nguyên văn bảo toàn văn phong Gioan và tránh thêm ý.
- issue: Sắc thái thời của ἀφῆκεν
  choice: Dịch “không để tôi một mình” trong liên hệ với sự hiện diện đang tiếp diễn.
  alternative: Dịch “đã không để tôi một mình” để biểu thị hình thức quá khứ rõ hơn.
  rationale: Động từ Hy Lạp ở thì bất định, nhưng mệnh đề trước nói Ngài đang ở với Đức Giê-su. Tiếng Việt không bắt buộc đánh dấu quá khứ; không thêm “đã” giúp câu tự nhiên và không làm lu mờ hiệu lực hiện tại.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Đấng” cho cụm phân từ chỉ về Cha, “Ngài” làm đại từ tôn kính, và tránh diễn giải thêm quan hệ thần học ngoài nguyên văn.
