  verdict: revise
  source_fidelity: Bản dịch truyền đạt đúng mạch tiếp nối của οὖν, chủ thể là người Pha-ri-si, và nội dung phản đối việc Đức Giê-su làm chứng về chính mình. Tuy nhiên, “tự làm chứng về mình” có thể gợi nghĩa tự mình thực hiện hành động hơn là đối tượng của lời chứng; “làm chứng về chính mình” sát và rõ hơn. “Không đúng sự thật” là cách diễn đạt hiện đại, tự nhiên hơn cho οὐκ ἔστιν ἀληθής mà vẫn để ngỏ sắc thái giá trị pháp lý.
  naturalness: “Những người Pha-ri-si” và sự đối lập giữa lời kể kính trọng “Ngài” với lời chất vấn “ông” đều có thể chấp nhận trong văn phong Kinh Thánh hiện đại. Thay “không chân thật” bằng “không đúng sự thật” giúp câu tiếng Việt tự nhiên hơn, nhất là khi chủ ngữ là “lời chứng”.
  terminology: Giữ “Pha-ri-si,” “làm chứng,” và “lời chứng” để nhất quán với ngữ cảnh chứng từ. Chú thích nên nêu “có giá trị” như khả năng hiểu về hiệu lực/giá trị pháp lý, không biến đó thành nghĩa chính.
