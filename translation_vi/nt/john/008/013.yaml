base_translation:
  language: en
  yaml_path: translation/nt/john/008/013.yaml
  text: So the Pharisees said to him, “You are testifying about yourself; your testimony is not true.”
translation:
  language: vi
  text: 'Vì vậy, những người Pha-ri-si nói với Ngài: “Ông làm chứng về chính mình; lời chứng của ông không đúng sự thật.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “lời chứng của ông không có giá trị.” Tiếng Hy Lạp nói “không đúng sự thật,” nhưng trong ngữ cảnh này cũng có thể hàm ý lời chứng không có giá trị pháp lý.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Vì vậy
  rationale: Diễn tả sự tiếp nối mang tính suy luận từ lời tuyên bố ngay trước đó, đồng thời vẫn tự nhiên trong văn kể tiếng Việt.
- source_word: εἶπον ... αὐτῷ οἱ Φαρισαῖοι
  choice: những người Pha-ri-si nói với Ngài
  rationale: Giữ động từ kể chuyện ở quá khứ và đại từ chỉ người nhận lời; “Ngài” phù hợp văn phong trang trọng của bản dịch mà không thay đại từ bằng tên riêng.
- source_word: Σὺ περὶ σεαυτοῦ μαρτυρεῖς
  choice: Ông tự làm chứng về mình
  rationale: “Ông” ở đầu câu thể hiện đại từ được nêu rõ; “tự làm chứng về mình” truyền đạt cả sắc thái nhấn mạnh của Σὺ/σεαυτοῦ và ngữ cảnh chứng cứ.
- source_word: ἡ μαρτυρία σου
  choice: lời chứng của ông
  rationale: “Lời chứng” là cách nói tự nhiên, dễ hiểu và duy trì liên hệ từ vựng với động từ “làm chứng”.
- source_word: οὐκ ἔστιν ἀληθής
  choice: không chân thật
  rationale: Bám sát nghĩa trực tiếp của ἀληθής, đồng thời không thu hẹp câu nói chỉ còn ý nghĩa hiệu lực pháp lý.
theological_decisions:
- issue: Ý nghĩa lời phản đối của người Pha-ri-si đối với việc tự làm chứng
  choice: lời chứng của ông không chân thật
  alternative: lời chứng của ông không có giá trị
  rationale: Ngữ cảnh có sắc thái pháp lý, nhưng ἀληθής rộng hơn một thuật ngữ kỹ thuật về tính hợp lệ. Bản dịch chính giữ chiều kích chân lý, còn chú thích ghi nhận khả năng hiểu theo giá trị pháp lý.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “những người Pha-ri-si” để nói rõ nhóm người; trong lời đối thoại, dùng “ông” để phản ánh cách họ trực tiếp chất vấn Chúa Giê-su, còn lời kể dùng “Ngài” theo văn phong kính trọng.
