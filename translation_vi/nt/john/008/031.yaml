  source_fidelity: Cụm πεπιστευκότας αὐτῷ có phân từ hoàn thành, được phản ánh đúng bằng “đã tin”. Tuy nhiên, bản chính thêm tân ngữ “lời” trong “đã tin lời Ngài”, trong khi nguyên văn chỉ có đại từ αὐτῷ (“Ngài/người ấy”). Dù cách hiểu “tin lời Ngài” có cơ sở ngữ nghĩa, việc đưa vào bản chính thu hẹp và diễn giải cấu trúc vốn còn có thể được hiểu là “tin Ngài”.
  naturalness: Bản văn nhìn chung tự nhiên, trang trọng và phù hợp tiếng Việt hiện đại. “Cứ ở lại trong lời của tôi” truyền đạt tốt sắc thái tiếp tục của μείνητε và duy trì hình ảnh Giăng. “Các ông” phù hợp ngữ cảnh lời nói trực tiếp với một nhóm nam giới được gọi là Ἰουδαίους, dù có sắc thái đối thoại trực diện.
  terminology: “Đức Giê-su,” “người Do Thái,” “lời,” và “môn đồ” nhất quán với văn phong Kinh Thánh trang trọng. Cần đổi “đã tin lời Ngài” thành “đã tin Ngài” để giữ tân ngữ trực tiếp như tiếng Hy Lạp; chú thích có thể giải thích cách hiểu “tin vào Ngài” và khả năng hàm ý tin lời Ngài.
