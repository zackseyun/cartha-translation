- from: 'Vì vậy, Đức Giê-su nói với những người Do Thái đã tin lời Ngài[a]: “Nếu các ông cứ ở lại trong lời của tôi, thì các ông thật sự là môn đồ của tôi.”'
  to: 'Vì vậy, Đức Giê-su nói với những người Do Thái đã tin Ngài[a]: “Nếu các ông cứ ở lại trong lời của tôi, thì các ông thật sự là môn đồ của tôi.”'
  rationale: Bản sửa chỉ loại bỏ từ “lời” được thêm vào cụm πεπιστευκότας αὐτῷ, để bản chính bám sát cấu trúc tân ngữ trực tiếp của nguyên văn và bảo tồn độ mở ngữ nghĩa. Khả năng hiểu là tin lời Đức Giê-su được chuyển vào chú thích, cùng với phương án “tin vào Ngài”. Những phần còn lại diễn đạt trung thành và tự nhiên nên được giữ nguyên.
