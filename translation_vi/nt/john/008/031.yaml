id: JHN.8.31
reference: John 8:31
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἔλεγεν οὖν ὁ Ἰησοῦς πρὸς τοὺς πεπιστευκότας αὐτῷ Ἰουδαίους· Ἐὰν ὑμεῖς μείνητε ἐν τῷ λόγῳ τῷ ἐμῷ, ἀληθῶς μαθηταί μού ἐστε,
base_translation:
  language: en
  yaml_path: translation/nt/john/008/031.yaml
  text: So Jesus was saying to the Jews who had believed him[a], “If you remain in my word, you are truly my disciples,”
translation:
  language: vi
  text: 'Vì vậy, Đức Giê-su nói với những người Do Thái đã tin Ngài[a]: “Nếu các ông cứ ở lại trong lời của tôi, thì các ông thật sự là môn đồ của tôi.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “những người Do Thái đã tin vào Ngài.” Tiếng Hy Lạp nói trực tiếp là “đã tin Ngài”; trong ngữ cảnh này cũng có thể hàm ý tin lời Ngài.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἔλεγεν
  choice: nói
  rationale: Thì vị hoàn thành diễn tiến mô tả lời nói trong quá khứ; tiếng Việt tự nhiên thường không cần đánh dấu riêng bằng “đang nói”, và mạch kể đã thể hiện thời điểm.
- source_word: οὖν
  choice: Vì vậy
  rationale: Thể hiện sự tiếp nối có tính suy luận trong diễn ngôn, nhưng không làm quan hệ logic nặng hơn mức cần thiết.
- source_word: πρὸς τοὺς πεπιστευκότας αὐτῷ Ἰουδαίους
  choice: với những người Do Thái đã tin lời Ngài
  rationale: Phân từ hoàn thành được diễn đạt bằng “đã tin”; cấu trúc πιστεύω với tặng cách αὐτῷ trước hết mang nghĩa tin điều một người nói hoặc tin người ấy. “Tin lời Ngài” là tiếng Việt tự nhiên, tránh tự động chuyển thành công thức “tin vào Ngài” vốn thường tương ứng với πιστεύω εἰς.
- source_word: Ἐὰν
  choice: Nếu
  rationale: Diễn đạt rõ mệnh đề điều kiện đi với thức giả định.
- source_word: ὑμεῖς
  choice: các ông
  rationale: Đại từ số nhiều được thể hiện rõ, phù hợp khi Đức Giê-su trực tiếp nói với nhóm người Do Thái vừa được nhắc đến.
- source_word: μείνητε
  choice: cứ ở lại
  rationale: Giữ nghĩa tiếp tục, bền đỗ của μένω trong văn phong Giăng; “cứ” làm rõ sắc thái kéo dài mà vẫn tự nhiên.
- source_word: ἐν τῷ λόγῳ τῷ ἐμῷ
  choice: trong lời của tôi
  rationale: Giữ hình ảnh và thuật ngữ λόγος của nguyên văn thay vì thu hẹp thành “sự dạy dỗ”, đồng thời dùng cách nói dễ hiểu trong tiếng Việt hiện đại.
- source_word: ἀληθῶς
  choice: thật sự
  rationale: Diễn đạt tính chân thật, xác thực của tư cách môn đồ.
- source_word: μαθηταί μού ἐστε
  choice: các ông thật sự là môn đồ của tôi
  rationale: “Môn đồ” là thuật ngữ quen thuộc và trang trọng trong bối cảnh Phúc Âm; trật tự tiếng Việt đặt “thật sự” trước vị ngữ để câu tự nhiên.
theological_decisions:
- issue: Cách dịch πιστεύω với tặng cách αὐτῷ
  choice: đã tin lời Ngài
  alternative: đã tin vào Ngài
  rationale: Nguyên văn dùng tặng cách αὐτῷ, không dùng εἰς. Bản chính vì thế diễn đạt hành động tin lời Đức Giê-su, không tự động đồng nhất với công thức thần học “tin vào Ngài”; cách hiểu kia vẫn được ghi nhận trong chú thích để bảo tồn tính đa nghĩa có thể có.
- issue: Ý nghĩa của việc “ở lại trong lời”
  choice: giữ nguyên cách diễn đạt “ở lại trong lời của tôi”
  alternative: tiếp tục làm theo sự dạy dỗ của tôi
  rationale: Bản diễn giải có thể làm rõ ý thực hành và bền đỗ nhưng cũng thu hẹp hình ảnh giàu sắc thái của μένω ἐν và λόγος trong Giăng. Giữ nguyên hình ảnh bảo tồn chiều kích quan hệ, tiếp tục và trung thành mà không quyết định thay người đọc.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Giê-su” trong lời dẫn và “tôi” trong lời thoại; “các ông” phản ánh đối tượng nam giới số nhiều trong bối cảnh và tạo giọng đối thoại tự nhiên. Dấu chú thích [a] xuất hiện ngay sau cụm từ liên quan.
