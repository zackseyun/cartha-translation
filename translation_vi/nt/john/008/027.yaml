  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οὐκ ἔγνωσαν ὅτι τὸν πατέρα αὐτοῖς ἔλεγεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/027.yaml
  text: They did not understand that he was speaking to them about the Father[a].
translation:
  language: vi
  text: Họ không hiểu rằng Ngài đang nói với họ về Cha[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Họ không biết rằng Ngài đang nói với họ về Cha.”'
    reason: Giữ lại nghĩa từ vựng trực tiếp hơn của οὐκ ἔγνωσαν; trong ngữ cảnh, “không hiểu” diễn đạt ý chính tự nhiên hơn.
lexical_decisions:
- source_word: οὐκ ἔγνωσαν
  choice: Họ không hiểu
  rationale: Trong ngữ cảnh này, γινώσκω nói đến việc họ không nắm được ý và đối tượng mà Đức Chúa Jêsus đang nói đến. “Không hiểu” tự nhiên và đúng ngữ cảnh hơn “không biết,” trong khi chú thích giữ lại nghĩa từ vựng thay thế.
- source_word: ὅτι
  choice: rằng
  rationale: Dẫn vào mệnh đề nội dung, nêu điều họ không hiểu.
- source_word: τὸν πατέρα
  choice: Cha
  rationale: Trong ngữ cảnh gần của Phúc Âm Giăng, danh xưng này chỉ Đức Chúa Trời là Cha của Đức Chúa Jêsus. Viết hoa “Cha” thể hiện sở chỉ theo ngữ cảnh mà không thêm nội dung thần học ngoài câu.
- source_word: αὐτοῖς
  choice: với họ
  rationale: Với động từ λέγω, tiếng Việt tự nhiên dùng “nói với họ,” diễn đạt người tiếp nhận lời nói.
- source_word: ἔλεγεν
  choice: đang nói
  rationale: Thể chưa hoàn thành diễn tả hành động đang tiếp diễn; “đang nói” giữ được thể diễn tiến và tự nhiên trong tiếng Việt hiện đại.
theological_decisions:
- issue: Sở chỉ của “Cha”
  choice: Đức Chúa Jêsus đang nói về Đức Chúa Trời là Cha.
  alternative: Một người cha theo nghĩa con người.
  rationale: Ngữ cảnh trực tiếp trong Giăng liên tục dùng “Cha” để chỉ Đức Chúa Trời trong mối liên hệ với Đức Chúa Jêsus. Cách viết hoa phản ánh nhận diện theo ngữ cảnh, không áp đặt thêm một công thức tín lý.
- issue: Cách dịch γινώσκω trong ngữ cảnh
  choice: Dịch là “hiểu.”
  alternative: “biết” hoặc “nhận ra.”
  rationale: Câu nhấn mạnh rằng người nghe không nắm được điều Đức Chúa Jêsus muốn nói, chứ không chỉ thiếu một dữ kiện. Chú thích bảo tồn khả năng dịch sát hơn là “biết.”
- issue: Đại từ chỉ Đức Chúa Jêsus
  choice: Dùng “Ngài.”
  alternative: “ông ấy” hoặc lược bỏ chủ ngữ.
  rationale: “Ngài” là cách xưng gọi trang trọng, tự nhiên trong văn phong Kinh Thánh tiếng Việt và phù hợp với sở chỉ trong ngữ cảnh, nhưng không tự nó giải quyết thêm các vấn đề tín lý.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Cấu trúc ngắn gọn theo nguyên văn; dùng “đang nói” để thể hiện sắc thái tiếp diễn của ἔλεγεν. Dấu chú thích [a] xuất hiện ngay sau “Cha,” là từ liên quan đến phương án dịch.
