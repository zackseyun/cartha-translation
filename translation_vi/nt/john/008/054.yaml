id: JHN.8.54
reference: John 8:54
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς· Ἐὰν ἐγὼ ⸀δοξάσω ἐμαυτόν, ἡ δόξα μου οὐδέν ἐστιν· ἔστιν ὁ πατήρ μου ὁ δοξάζων με, ὃν ὑμεῖς λέγετε ὅτι θεὸς ⸀ἡμῶν ἐστιν,
base_translation:
  language: en
  yaml_path: translation/nt/john/008/054.yaml
  text: Jesus answered[a], “If I glorify myself, my glory is nothing. My Father is the one who glorifies me, he whom you say is our God,”
translation:
  language: vi
  text: 'Đức Giê-su đáp[a]: “Nếu chính tôi tự tôn vinh mình, vinh quang của tôi chẳng là gì. Cha tôi là Đấng tôn vinh tôi, Đấng mà các ông nói là Đức Chúa Trời của chúng ta.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Một số thủ bản chép “Đức Chúa Trời của các ông” thay vì “Đức Chúa Trời của chúng ta.”
    reason: textual_variant
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: đáp
  rationale: Cách diễn đạt tự nhiên và trang trọng trong lời thoại, phản ánh động từ ἀποκρίνομαι.
- source_word: δοξάσω / δοξάζων
  choice: tôn vinh
  rationale: Giữ trường nghĩa về việc ban hoặc bày tỏ vinh quang trong chủ đề thần học của sách Giăng, đồng thời tự nhiên trong tiếng Việt hiện đại.
- source_word: ἡ δόξα μου οὐδέν ἐστιν
  choice: vinh quang của tôi chẳng là gì
  rationale: Bám sát cấu trúc Hy Lạp và giữ nguyên sức mạnh của lời phủ định οὐδέν mà không diễn giải thêm.
- source_word: ὁ πατήρ μου
  choice: Cha tôi
  rationale: Giữ cách xưng gọi trực tiếp, riêng biệt của Đức Chúa Jêsus đối với Cha trong ngữ cảnh.
- source_word: ὁ δοξάζων με
  choice: Đấng tôn vinh tôi
  rationale: Danh xưng “Đấng” kết hợp với mệnh đề phân từ tạo câu tiếng Việt trang trọng, rõ nghĩa và giữ tính mô tả của nguyên văn.
- source_word: ὃν ὑμεῖς λέγετε ὅτι θεὸς ἡμῶν ἐστιν
  choice: Đấng mà các ông nói là Đức Chúa Trời của chúng ta
  rationale: Giữ quan hệ trực tiếp của đại từ ὃν với “Cha tôi,” giữ lời hướng đến những người đối thoại qua “các ông,” và theo cách đọc ἡμῶν của SBLGNT.
- source_word: θεὸς
  choice: Đức Chúa Trời
  rationale: Trong ngữ cảnh, từ này chỉ Đức Chúa Trời của Israel; danh xưng truyền thống này rõ ràng và trang trọng trong tiếng Việt.
- source_word: ἡμῶν
  choice: của chúng ta
  rationale: Theo bản văn SBLGNT; biến thể ὑμῶν được ghi nhận trong chú thích.
theological_decisions:
- issue: Đại từ trong θεὸς ἡμῶν/ὑμῶν ἐστιν
  choice: Đức Chúa Trời của chúng ta
  alternative: Đức Chúa Trời của các ông
  rationale: Bản chính theo SBLGNT đọc ἡμῶν (“của chúng ta”). Biến thể ὑμῶν (“của các ông”) có ý nghĩa trong bối cảnh tranh luận nên được bảo tồn trong chú thích thay vì âm thầm lựa chọn hoặc dung hòa.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “các ông” để thể hiện ngôi thứ hai số nhiều trong cuộc đối thoại; dùng “Đấng” cho mệnh đề quy chiếu về Cha. Dấu chú thích [a] được đặt sau động từ dẫn lời theo lớp tham khảo đã cung cấp.
