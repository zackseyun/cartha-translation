source:
  edition: SBLGNT
  text: καὶ ἐὰν κρίνω δὲ ἐγώ, ἡ κρίσις ἡ ἐμὴ ⸀ἀληθινή ἐστιν, ὅτι μόνος οὐκ εἰμί, ἀλλ’ ἐγὼ καὶ ὁ πέμψας με πατήρ.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/016.yaml
  text: But even if I do judge[a], my judgment is true, because I am not alone, but I and the Father who sent me.
translation:
  language: vi
  text: Nhưng dù tôi có phán xét[a], sự phán xét của tôi vẫn là chân thật, vì không phải chỉ một mình tôi, nhưng còn có Cha, Đấng đã sai tôi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “nếu tôi phán xét” hoặc “nếu tôi có phán xét.” Cách diễn đạt điều kiện trong tiếng Hy Lạp có thể được dịch sát hơn, nhưng ở đây có lẽ mang sắc thái nhượng bộ: “dù tôi có phán xét.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν κρίνω
  choice: dù tôi có xét đoán
  rationale: Cấu trúc ἐὰν với động từ giả định hiện tại diễn tả một khả năng có điều kiện; trong ngữ cảnh, “dù… có” truyền đạt hợp lý sắc thái nhượng bộ mà không xóa bỏ cách hiểu điều kiện đơn thuần.
- source_word: δὲ
  choice: Nhưng
  rationale: δέ đánh dấu bước chuyển tương phản với lời ngay trước đó.
- source_word: ἡ κρίσις ἡ ἐμὴ
  choice: sự xét đoán của tôi
  rationale: Cách dịch này giữ sắc thái phán xét của κρίσις và phân biệt tự nhiên giữa hành động “xét đoán” với kết quả hay tính chất của sự xét đoán.
- source_word: ἀληθινή
  choice: chân thật
  rationale: ἀληθινή có thể hàm ý đúng thật, xác thực và có giá trị. “Chân thật” giữ được âm hưởng thần học trong sách Giăng mà không thu hẹp nghĩa chỉ còn giá trị pháp lý.
- source_word: μόνος οὐκ εἰμί
  choice: tôi không chỉ có một mình
  rationale: Diễn đạt tự nhiên ý rằng Chúa Giê-xu không đơn độc trong sự xét đoán hoặc làm chứng.
- source_word: ἀλλ’ ἐγὼ καὶ ὁ πέμψας με πατήρ
  choice: nhưng có tôi và Cha là Đấng đã sai tôi
  rationale: Bổ sung “có” theo cú pháp tiếng Việt để hoàn chỉnh thế đối lập, đồng thời giữ việc Chúa Giê-xu và Cha được nêu cùng nhau; phân từ πέμψας được diễn đạt bằng mệnh đề định danh “Đấng đã sai tôi”.
theological_decisions:
- issue: Quan hệ giữa sự xét đoán của Chúa Giê-xu và lời chứng của Cha
  choice: Câu dịch cho thấy sự xét đoán của Chúa Giê-xu là chân thật vì Ngài không hành động đơn độc, nhưng có Cha là Đấng sai Ngài.
  alternative: Có thể hiểu hẹp hơn như một lập luận thuần túy pháp lý về hai nhân chứng.
  rationale: Bản văn trực tiếp đặt nền tảng cho tính chân thật của sự xét đoán nơi việc Chúa Giê-xu không đơn độc và nơi sự hiện diện của Cha. Câu dịch bảo toàn khẳng định ấy mà không khai triển thành một công thức tín lý về sau.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “tôi” theo ngữ cảnh diễn ngôn trực tiếp của sách Giăng; “Cha” viết hoa như danh xưng chỉ Đức Chúa Trời. Giữ thuật ngữ “xét đoán” để nối với ngữ cảnh pháp lý và lời chứng.
