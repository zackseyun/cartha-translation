- source_word: ἐπορεύθη
  choice: đi đến
  rationale: Dạng aorist của πορεύομαι mang nghĩa chủ động, chỉ sự di chuyển đơn giản đến một địa điểm.
- source_word: τὸ ὄρος τῶν Ἐλαιῶν
  choice: núi Ô-liu
  rationale: Đây là địa danh quen thuộc chỉ ngọn núi ở phía đông Giê-ru-sa-lem; cách gọi “núi Ô-liu” tự nhiên và dễ nhận biết trong tiếng Việt.
