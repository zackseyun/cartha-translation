  yaml_path: translation/nt/john/008/002.yaml
  text: At dawn he came again to the temple, and all the people were coming to him; and he sat down and began to teach them.
translation:
  language: vi
  text: Lúc rạng sáng, Ngài lại đến đền thờ. Dân chúng đều kéo đến với Ngài; Ngài ngồi xuống và dạy họ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Câu này tiếp nối câu chuyện về người phụ nữ bị bắt quả tang phạm tội ngoại tình (Giăng 7:53–8:11), một phần không có trong các bản chép tay Hy Lạp cổ nhất. Xem chú thích ở Giăng 7:53.
    reason: textual_critical
lexical_decisions:
- source_word: Ὄρθρου
  choice: Rạng sáng
  rationale: Cách diễn đạt tự nhiên, trang trọng, chỉ thời điểm lúc trời vừa sáng hoặc gần lúc mặt trời mọc.
- source_word: παρεγένετο
  choice: đến
  rationale: Diễn tả việc xuất hiện hoặc tới một địa điểm; “đến đền thờ” tự nhiên trong tiếng Việt.
- source_word: ἱερόν
  choice: đền thờ
  rationale: Chỉ toàn bộ khuôn viên đền thờ, nơi có thể giảng dạy công khai, chứ không riêng nơi thánh bên trong.
- source_word: πᾶς ὁ λαὸς
  choice: toàn dân
  rationale: Giữ nghĩa bao quát của πᾶς và cách gọi tập thể của λαός, đồng thời phù hợp văn phong Kinh Thánh tiếng Việt.
- source_word: ἤρχετο
  choice: đều đến
  rationale: Thì chưa hoàn thành mô tả hành động đang diễn ra; “đều đến” truyền đạt tự nhiên việc dân chúng kéo đến với Ngài.
- source_word: καθίσας
  choice: ngồi xuống
  rationale: Phân từ bất định cho biết hành động ngồi xảy ra trước hoặc gắn liền với việc giảng dạy.
- source_word: ἐδίδασκεν
  choice: dạy
  rationale: Thì chưa hoàn thành có thể chỉ hành động đang tiếp diễn hoặc khởi đầu; bản dịch ngắn gọn “dạy” giữ được độ mở thay vì buộc phải hiểu là “bắt đầu dạy”.
theological_decisions: []
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” để chỉ Đức Chúa Jêsus theo lối tôn kính quen thuộc; chia thành hai câu để lời văn tự nhiên. Dấu chú thích [a] đặt sau toàn câu vì chú thích liên quan đến địa vị văn bản của cả câu.
