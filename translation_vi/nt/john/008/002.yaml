  rationale: 'Chỉnh nhẹ để diễn đạt πᾶς ὁ λαός và ἤρχετο tự nhiên, chính xác hơn trong tiếng Việt: “dân chúng đều kéo đến” tránh hàm ý quốc dân của “toàn dân” và gợi hành động đang diễn tiến. Chú thích được điều chỉnh từ “thủ bản” sang “bản chép tay” để cách gọi rõ ràng, hiện đại hơn, không thay đổi nội dung.'
