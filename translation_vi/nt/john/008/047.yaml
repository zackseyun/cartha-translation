id: JHN.8.47
reference: John 8:47
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ ὢν ἐκ τοῦ θεοῦ τὰ ῥήματα τοῦ θεοῦ ἀκούει· διὰ τοῦτο ὑμεῖς οὐκ ἀκούετε ὅτι ἐκ τοῦ θεοῦ οὐκ ἐστέ.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/047.yaml
  text: The one who is from God hears the words of God[a]. For this reason you do not hear[b], because you are not from God.
translation:
  language: vi
  text: Ai thuộc về Đức Chúa Trời[a] thì nghe lời Đức Chúa Trời. Chính vì thế, các ông không nghe, vì[b] các ông không thuộc về Đức Chúa Trời.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “do Đức Chúa Trời mà ra.” Cụm từ Hy Lạp nhấn mạnh nguồn gốc hoặc xuất xứ; “thuộc về Đức Chúa Trời” diễn đạt tự nhiên ý này trong tiếng Việt.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể hiểu: “các ông không nghe rằng các ông không thuộc về Đức Chúa Trời.” Liên từ Hy Lạp ὅτι có thể mang nghĩa “rằng”, nhưng nghĩa nguyên nhân “vì” phù hợp với văn mạch hơn.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ ὢν
  choice: Ai ... thì
  rationale: Kết cấu mạo từ đi với phân từ hiện tại chỉ một hạng người theo nghĩa khái quát. “Ai ... thì” tự nhiên trong tiếng Việt và vẫn giữ lực đại diện số ít.
- source_word: ἐκ τοῦ θεοῦ
  choice: đến từ Đức Chúa Trời
  rationale: Giới từ ἐκ nhấn mạnh nguồn gốc hoặc xuất xứ. Cách dịch này giữ hình ảnh nguồn gốc trong văn mạch Giăng mà không diễn giải thành một phạm trù thần học cụ thể.
- source_word: τὰ ῥήματα τοῦ θεοῦ
  choice: những lời của Đức Chúa Trời
  rationale: Giữ nghĩa cụ thể ở số nhiều của ῥήματα và lối nói trang trọng, dễ hiểu trong tiếng Việt hiện đại.
- source_word: ἀκούει / ἀκούετε
  choice: nghe / không nghe
  rationale: Giữ nguyên sự lặp lại của động từ Hy Lạp. Trong văn mạch, “nghe” có thể hàm ý tiếp nhận và làm theo, nhưng dịch thành “vâng lời” sẽ diễn giải quá mức.
- source_word: διὰ τοῦτο
  choice: Chính vì thế
  rationale: Diễn đạt rõ quan hệ suy luận và giữ sự nhấn mạnh của cụm từ Hy Lạp trong tiếng Việt tự nhiên.
- source_word: ὑμεῖς
  choice: các ông
  rationale: Đại từ số nhiều chỉ những người đang đối thoại với Chúa Giê-su. “Các ông” thể hiện số nhiều và phù hợp với ngữ cảnh tranh luận mà không cường điệu sắc thái nhấn mạnh.
- source_word: ὅτι
  choice: vì
  rationale: 'Hiểu liên từ theo nghĩa nguyên nhân: họ không nghe vì họ không đến từ Đức Chúa Trời. Đây là cách đọc phù hợp nhất với mạch lập luận, đồng thời cách đọc khác được ghi ở chú thích.'
- source_word: ἐκ τοῦ θεοῦ οὐκ ἐστέ
  choice: các ông không đến từ Đức Chúa Trời
  rationale: Lặp lại cách diễn đạt về nguồn gốc trong vế đầu, qua đó bảo toàn thế tương phản có chủ ý của câu Hy Lạp.
theological_decisions:
- issue: Ý nghĩa của cụm “đến từ Đức Chúa Trời”
  choice: 'Giữ ngôn ngữ chỉ nguồn gốc: “đến từ Đức Chúa Trời”.'
  alternative: “thuộc về Đức Chúa Trời” hoặc diễn giải hẹp là “được Đức Chúa Trời tái sinh”.
  rationale: Bản dịch không đồng nhất cụm từ này với riêng một phạm trù như sự tuyển chọn, sự tái sinh hay tư cách thành viên giao ước, nhờ đó giữ nguyên sức căng thần học trong lối diễn đạt của Giăng.
- issue: Sắc thái của ἀκούω
  choice: Dịch là “nghe”.
  alternative: “lắng nghe”, “tiếp nhận” hoặc “vâng lời”.
  rationale: Việc thực sự nghe trong ngữ cảnh có thể bao hàm sự tiếp nhận và đáp ứng, nhưng từ Hy Lạp trực tiếp có nghĩa là “nghe”; bản dịch không đưa hàm ý diễn giải vào chính văn.
- issue: Chức năng của ὅτι
  choice: 'Hiểu theo nghĩa nguyên nhân: “vì”.'
  alternative: 'Hiểu theo nghĩa dẫn nội dung: “rằng”.'
  rationale: 'Nghĩa nguyên nhân tạo thành lập luận mạch lạc nhất: họ không nghe vì họ không đến từ Đức Chúa Trời. Tuy nhiên, tính đa nghĩa thật sự của liên từ được bảo lưu trong chú thích.'
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Trời” nhất quán cho θεός; giữ sự lặp lại của “nghe” và “đến từ Đức Chúa Trời” để phản ánh cấu trúc đối xứng của nguyên văn. Các dấu chú thích được đặt ngay sau cụm từ liên quan.
