source:
  edition: SBLGNT
  text: ⸀Ἀπεκρίθησαν οἱ Ἰουδαῖοι καὶ εἶπαν αὐτῷ· Οὐ καλῶς λέγομεν ἡμεῖς ὅτι Σαμαρίτης εἶ σὺ καὶ δαιμόνιον ἔχεις;
base_translation:
  language: en
  yaml_path: translation/nt/john/008/048.yaml
  text: The Jews answered and said to him[c][b][a], “Are we not right in saying that you are a Samaritan and have a demon?”
translation:
  language: vi
  text: 'Người Do Thái[a] đáp lại, nói với Ngài rằng: “Chẳng phải chúng tôi nói đúng[b] rằng ông là người Sa-ma-ri và có quỷ[c] sao?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Trong một số ngữ cảnh, cũng có thể hiểu là “người Giu-đê” hoặc “các nhà lãnh đạo Do Thái”. Trong Tin Mừng Giăng, cụm “người Do Thái” có thể chỉ một nhóm cụ thể đang chống đối Đức Giê-su, chứ không nhất thiết chỉ toàn thể người Do Thái.
    reason: alternative_reading
  - marker: b
    text: 'Cũng có thể dịch: “Chúng tôi nói như vậy chẳng phải là đúng sao?”'
    reason: lexical_alternative
  - marker: c
    text: Nguyên văn là “có quỷ”; một số bản dịch diễn ý là “bị quỷ ám”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπεκρίθησαν
  choice: đáp lời
  rationale: Động từ dạng thụ động về hình thức nhưng mang nghĩa chủ động, thường có nghĩa là “trả lời/đáp lời”; “đáp lời” phù hợp với văn kể chuyện trang trọng và giữ được sự nối tiếp với động từ “nói”.
- source_word: οἱ Ἰουδαῖοι
  choice: Người Do Thái
  rationale: Cụm Hy Lạp trực tiếp chỉ “những người Do Thái”. Trong Giăng, đối tượng cụ thể đôi khi là một nhóm đang chống đối Đức Chúa Jêsus, nhưng câu này không dùng từ ngữ xác định riêng là “các lãnh đạo”; vì vậy bản chính giữ cách gọi rộng, còn chú thích nêu rõ sắc thái ngữ cảnh.
- source_word: εἶπαν αὐτῷ
  choice: nói với Ngài
  rationale: Phản ánh trực tiếp động từ kể chuyện thứ hai sau “đáp lời”, giữ lối diễn đạt hơi lặp nhưng tự nhiên của nguyên văn. “Ngài” duy trì giọng văn tôn kính của bản dịch, dù lời trích dẫn của các đối thủ dùng đại từ “ông” mang sắc thái đối đầu.
- source_word: Οὐ καλῶς λέγομεν ἡμεῖς
  choice: Chẳng phải chúng tôi nói đúng
  rationale: Tiểu từ phủ định trong câu hỏi tu từ mong đợi câu trả lời khẳng định; καλῶς ở đây có nghĩa là “đúng/phải”. Cách diễn đạt này tự nhiên trong tiếng Việt và bảo toàn lực tu từ.
- source_word: Σαμαρίτης
  choice: người Sa-ma-ri
  rationale: Danh xưng dân tộc-tôn giáo trực tiếp, được dùng như lời miệt thị trong ngữ cảnh. Cách viết “Sa-ma-ri” rõ ràng và quen thuộc trong văn phong Kinh Thánh tiếng Việt.
- source_word: δαιμόνιον ἔχεις
  choice: có quỷ
  rationale: Dịch sát cấu trúc “có một quỷ”. Cách này minh bạch hơn “bị quỷ ám”, vốn diễn giải thêm mức độ hoặc tình trạng chiếm hữu không được cấu trúc Hy Lạp tự nó xác định.
theological_decisions:
- issue: Phạm vi quy chiếu của οἱ Ἰουδαῖοι trong sách Giăng
  choice: Người Do Thái
  alternative: người Giu-đê; các lãnh đạo Do Thái
  rationale: Bản chính giữ cách gọi trực tiếp của nguyên văn, không tự thu hẹp thành “các lãnh đạo”. Chú thích giúp tránh hiểu đây là lời khái quát về mọi người Do Thái, vì trong mạch truyện Giăng, cụm từ này thường chỉ một nhóm cụ thể đang chống đối Đức Chúa Jêsus.
- issue: Mức độ diễn giải của δαιμόνιον ἔχεις
  choice: có quỷ
  alternative: bị quỷ ám
  rationale: “Có quỷ” giữ nguyên cách nói của nguồn Hy Lạp và tránh quyết định thay độc giả rằng cụm này nhất thiết mô tả tình trạng bị quỷ chiếm hữu theo một nghĩa kỹ thuật.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Câu kể giữ cả hai động từ “đáp lời” và “nói” theo nguyên văn. Đại từ trần thuật “Ngài” thể hiện văn phong tôn kính, còn “ông” trong lời của những người chống đối bảo toàn sắc thái trực diện và thiếu tôn kính của cuộc tranh luận.
