  naturalness: «Thật vậy, thật vậy, tôi nói với anh em» là cách trang trọng, rõ nghĩa và tự nhiên trong tiếng Việt Kinh Thánh hiện đại. Phần còn lại của câu mạch lạc; «sẽ không bao giờ thấy sự chết» giữ được hình ảnh của nguyên văn mà không gượng ép.
  terminology: «Giữ lời tôi» phản ánh tốt τηρέω và λόγος. «Thấy sự chết» bảo lưu thành ngữ θεωρεῖν θάνατον. Chú thích nên mô tả thành ngữ và tránh quy định trước cách giải quyết thần học; không cần thêm một xác quyết về nhóm người tin hay một hệ thống giải thích cụ thể.
