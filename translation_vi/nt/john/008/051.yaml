source:
  edition: SBLGNT
  text: ἀμὴν ἀμὴν λέγω ὑμῖν, ἐάν τις τὸν ⸂ἐμὸν λόγον⸃ τηρήσῃ, θάνατον οὐ μὴ θεωρήσῃ εἰς τὸν αἰῶνα.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/051.yaml
  text: Truly, truly, I say to you, if anyone keeps my word, he will certainly never see death forever.
translation:
  language: vi
  text: 'Thật vậy, thật vậy, tôi nói với anh em: Nếu ai giữ lời tôi, người ấy sẽ không bao giờ thấy sự chết.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Thấy sự chết” là thành ngữ chỉ việc kinh nghiệm sự chết. Câu này không nói rõ phạm vi của sự chết được nhắc đến.
    reason: Làm rõ nghĩa thành ngữ của nguyên văn mà không giải quyết thay bản văn một vấn đề diễn giải.
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  choice: Thật, tôi nói thật
  rationale: Tái hiện lời khẳng định kép trang trọng và mạnh mẽ của Chúa Giê-su theo cách tự nhiên trong tiếng Việt, đồng thời gắn với động từ “tôi nói” như cấu trúc Hy Lạp.
- source_word: τηρήσῃ
  choice: giữ
  rationale: Bao hàm việc ghi nhớ, vâng theo và trung thành làm theo lời, không thu hẹp nghĩa chỉ còn “nghe” hay “tin”.
- source_word: τὸν ἐμὸν λόγον
  choice: lời tôi
  rationale: 'Giữ số ít và sắc thái bao quát của λόγος: lời dạy hoặc sứ điệp của Chúa Giê-su.'
- source_word: θάνατον ... θεωρήσῃ
  choice: thấy sự chết
  rationale: Bảo tồn hình ảnh Semit trong nguyên văn; ở đây “thấy” có nghĩa trải nghiệm hoặc nếm chịu.
- source_word: οὐ μὴ ... εἰς τὸν αἰῶνα
  choice: sẽ không bao giờ
  rationale: Diễn đạt tự nhiên sức phủ định rất mạnh của οὐ μή cùng thành ngữ chỉ thời gian εἰς τὸν αἰῶνα, tránh cách lặp không tự nhiên “không bao giờ... đời đời”.
theological_decisions:
- issue: Ý nghĩa của lời hứa không thấy sự chết
  choice: Giữ nguyên hình ảnh “không bao giờ thấy sự chết” và giải thích ngắn trong chú thích rằng câu có thể chỉ sự chết theo nghĩa tối hậu.
  alternative: Diễn giải trực tiếp là “không bao giờ chết về phần thuộc linh” hoặc “không chịu sự chết đời đời”.
  rationale: Nguyên văn tạo ra căng thẳng với sự chết thể xác và ngữ cảnh kế tiếp khai thác chính căng thẳng ấy. Không nên đưa một hệ thống thần học cụ thể vào chính văn để giải quyết điều bản văn để ngỏ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” cho đại từ số nhiều ὑμῖν trong lời nói trực tiếp; cụm này hướng đến toàn thể người nghe, không nhằm loại trừ phụ nữ. Dấu hai chấm giúp câu tiếng Việt sáng rõ.
