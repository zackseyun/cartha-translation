  text: ἔλεγον οὖν αὐτῷ· Σὺ τίς εἶ; ⸀εἶπεν αὐτοῖς ὁ Ἰησοῦς· Τὴν ἀρχὴν ⸂ὅ τι⸃ καὶ λαλῶ ὑμῖν;
base_translation:
  language: en
  yaml_path: translation/nt/john/008/025.yaml
  text: So they were saying to him, “Who are you?” Jesus said to them, “Just what I have been telling you from the beginning.”
translation:
  language: vi
  text: 'Vì vậy, họ hỏi Ngài: “Ông là ai?” Đức Giê-su đáp: “Tôi đã nói gì với các ông ngay từ đầu?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Câu Hy Lạp này có cấu trúc khó và có thể được hiểu theo nhiều cách. Cũng có thể dịch: “Tôi chính là điều tôi vẫn nói với các ông ngay từ đầu.”'
    reason: Bảo tồn sự mơ hồ thật sự của Τὴν ἀρχὴν ὅ τι καὶ λαλῶ ὑμῖν và ghi nhận cách hiểu khẳng định đứng sau nhiều bản dịch.
lexical_decisions:
- source_word: ἔλεγον
  choice: họ hỏi
  rationale: Động từ ở thì chưa hoàn thành, nghĩa đen là “họ đang nói”, nhưng trong ngữ cảnh lời trực tiếp là một câu hỏi; tiếng Việt tự nhiên dùng “hỏi” mà không làm thay đổi nội dung.
- source_word: Σὺ τίς εἶ;
  choice: Ông là ai?
  rationale: Đại từ Σὺ được nhấn mạnh. “Ông” phù hợp với cách những người đối thoại đang chất vấn Đức Giê-su, không thêm sắc thái kính trọng vốn không có trong câu Hy Lạp.
- source_word: Τὴν ἀρχὴν
  choice: Ngay từ đầu
  rationale: Cụm này có thể mang nghĩa thời gian “từ đầu/ngay từ đầu”, dù cấu trúc toàn câu rất khó và có nhiều cách phân tích.
- source_word: ὅ τι καὶ λαλῶ ὑμῖν
  choice: tôi đã nói với các ông điều gì
  rationale: Giữ cách đọc ὅ τι thành đại từ nghi vấn “điều gì” trong một câu đáp mang tính chất vấn; “đã nói” diễn đạt hành động nói kéo dài đến hiện tại theo ngữ cảnh, dù λαλῶ tự thân là hiện tại.
theological_decisions:
- issue: Cấu trúc và ý nghĩa mơ hồ của câu đáp Τὴν ἀρχὴν ὅ τι καὶ λαλῶ ὑμῖν;
  choice: Ngay từ đầu, tôi đã nói với các ông điều gì?
  alternative: Tôi chính là điều tôi vẫn nói với các ông ngay từ đầu.
  rationale: Nguyên văn Hy Lạp có cú pháp đặc biệt khó và thực sự mơ hồ. Bản chính giữ hình thức câu hỏi theo dấu câu của SBLGNT và cách hiểu ὅ τι là “điều gì”, đồng thời chú thích cách hiểu khẳng định phổ biến; không dùng bản dịch để áp đặt một kết luận thần học.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Đức Giê-su” trong lời dẫn, còn “ông/các ông” trong cuộc đối thoại để phản ánh thái độ chất vấn. Dấu hỏi ở cuối câu đáp theo SBLGNT; chú thích ghi nhận cách phân tích khác.
