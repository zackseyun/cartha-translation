review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp truyền đạt đúng các tương quan chính của câu: người không yêu Chúa Giê-xu không giữ các lời Ngài; lời người nghe không phải của Ngài mà thuộc về Cha đã sai Ngài. Tuy nhiên, τότε hiện tại ἀκούετε không cần nhấn mạnh bằng “đang”, và καί nối hai mệnh đề phù hợp hơn với câu nối trực tiếp thay vì “Còn”.'
  naturalness: “Ai không yêu Ta” là cách diễn đạt khái quát tự nhiên hơn “Người không yêu tôi” trong tiếng Việt. Cặp xưng hô “Ta/anh em” cũng nhất quán với văn phong trang trọng hiện đại của lời Chúa Giê-xu nói với các môn đồ. Bỏ “đang” khiến câu bớt gượng mà vẫn phản ánh thì hiện tại Hy Lạp.
  terminology: “Giữ lời”, “lời”, “Cha”, và “Đấng đã sai Ta” đều thích hợp. “Lời” giữ được sự đối ứng số nhiều/số ít giữa λόγους và λόγος; chú thích “sứ điệp” là một phương án từ vựng hợp lệ.
  issues:
  - severity: low
    issue: “Người không yêu tôi” và “anh em đang nghe” hơi kém tự nhiên trong văn phong lời dạy trực tiếp.
    rationale: Phân từ có mạo từ mang nghĩa khái quát, được tiếng Việt diễn đạt tự nhiên bằng “Ai không…”. Thì hiện tại ἀκούετε có thể dịch đơn giản là “anh em nghe”; “đang” không sai nhưng tạo nét tiến hành không cần thiết.
  - severity: low
    issue: “Còn” làm sắc thái đối lập mạnh hơn liên từ καί.
    rationale: καί ở đây chỉ đơn giản nối sang lời/sứ điệp mà người nghe tiếp nhận. Một câu mới không có từ nối giữ quan hệ này mà không thêm sắc thái.
  revised_text: Ai không yêu Ta thì không giữ lời Ta. Lời[a] anh em nghe không phải là của Ta, nhưng là của Cha, Đấng đã sai Ta.
