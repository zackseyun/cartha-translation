  rationale: Bản sửa tăng tính tự nhiên và sự nhất quán của đại từ trong lời nói trực tiếp, đồng thời không thay đổi nghĩa, số của các danh từ, hay tính mơ hồ sở hữu/nguồn gốc trong nguyên văn. Chú thích được giữ nguyên nội dung và neo đúng tại “Lời”.
