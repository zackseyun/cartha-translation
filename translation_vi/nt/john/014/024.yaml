id: JHN.14.24
reference: John 14:24
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ μὴ ἀγαπῶν με τοὺς λόγους μου οὐ τηρεῖ· καὶ ὁ λόγος ὃν ἀκούετε οὐκ ἔστιν ἐμὸς ἀλλὰ τοῦ πέμψαντός με πατρός.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/024.yaml
  text: The one who does not love me does not keep my words[a]. And the word that you hear is not mine[b], but belongs to the Father who sent me.
translation:
  language: vi
  text: Ai không yêu Ta thì không giữ lời Ta. Lời[a] anh em nghe không phải là của Ta, nhưng là của Cha, Đấng đã sai Ta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hoặc “sứ điệp”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ μὴ ἀγαπῶν με
  choice: Người không yêu tôi
  rationale: Mạo từ đi với phân từ hiện tại tạo thành cách gọi khái quát về người có đặc điểm là không yêu Chúa Giê-xu. Cách dịch này giữ được cấu trúc và ý nghĩa của nguyên văn mà vẫn tự nhiên trong tiếng Việt.
- source_word: τοὺς λόγους μου
  choice: những lời của tôi
  rationale: Giữ số nhiều của λόγους và mối liên hệ trực tiếp giữa tình yêu với việc vâng giữ những điều Chúa Giê-xu phán.
- source_word: τηρεῖ
  choice: giữ
  rationale: Trong văn mạch Giăng, τηρέω bao hàm việc tuân theo và trung thành gìn giữ lời dạy. “Giữ” bảo toàn trường nghĩa rộng hơn “vâng lời” đơn thuần.
- source_word: ὁ λόγος
  choice: lời
  rationale: Danh từ số ít chỉ lời dạy được nhìn như một toàn thể, đồng thời giữ được cách dùng λόγος đặc trưng trong sách Giăng. “Sứ điệp” là một khả năng theo văn cảnh và được nêu ở chú thích.
- source_word: ὃν ἀκούετε
  choice: anh em đang nghe
  rationale: Thì hiện tại được thể hiện tự nhiên bằng “đang nghe”; không thêm “từ tôi” vì nguyên văn không nói rõ trong mệnh đề này.
- source_word: οὐκ ἔστιν ἐμὸς
  choice: không phải là của tôi
  rationale: Dịch trực tiếp tính từ sở hữu ἐμός, bảo toàn sắc thái sở hữu hoặc nguồn gốc mà không giải thích quá mức.
- source_word: ἀλλὰ τοῦ πέμψαντός με πατρός
  choice: mà là của Cha, Đấng đã sai tôi
  rationale: Cấu trúc sở hữu đối xứng với “không phải là của tôi”, còn cụm đồng vị “Đấng đã sai tôi” xác định rõ Cha và diễn đạt tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Mối quan hệ giữa lời dạy của Chúa Giê-xu và lời của Cha
  choice: không phải là của tôi, mà là của Cha, Đấng đã sai tôi
  alternative: không đến từ tôi, nhưng đến từ Cha, Đấng đã sai tôi
  rationale: Bản dịch giữ nguyên sự phân biệt giữa Chúa Giê-xu và Cha, đồng thời giữ sự hiệp nhất về lời được truyền đạt. Cách diễn đạt sở hữu không tự ý thu hẹp ý nghĩa thành nguồn gốc, cũng không hàm ý Chúa Giê-xu phủ nhận thẩm quyền của chính mình.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” cho đại từ số nhiều hướng đến các môn đồ; dùng “Đấng” trong cụm đồng vị nói về Cha để câu rõ ràng và trang nghiêm.
