id: JHN.14.21
reference: John 14:21
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ ἔχων τὰς ἐντολάς μου καὶ τηρῶν αὐτὰς ἐκεῖνός ἐστιν ὁ ἀγαπῶν με· ὁ δὲ ἀγαπῶν με ἀγαπηθήσεται ὑπὸ τοῦ πατρός μου, κἀγὼ ἀγαπήσω αὐτὸν καὶ ἐμφανίσω αὐτῷ ἐμαυτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/021.yaml
  text: The one who has my commandments and keeps them is the one who loves me[a]. And the one who loves me will be loved by my Father[c][b], and I will love him and reveal myself to him.
translation:
  language: vi
  text: Người nào có các điều răn của tôi và tuân giữ thì chính là người yêu tôi.[a] Người yêu tôi sẽ được Cha tôi yêu; tôi cũng sẽ yêu người ấy và tỏ mình cho người ấy.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tiếng Hy Lạp dùng các dạng giống đực số ít với nghĩa đại diện, chỉ bất cứ người nào có và tuân giữ các điều răn của Chúa Giê-su.
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “cho người ấy thấy mình.” Động từ Hy Lạp có thể mang nghĩa làm cho mình được biết đến hoặc được nhìn thấy; ở đây nhấn mạnh sự tự bày tỏ mang tính cá nhân.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ ἔχων
  choice: Người nào có
  rationale: Cụm mạo từ với phân từ hiện tại được dùng như danh từ, chỉ một cá nhân mang nghĩa đại diện. “Người nào có” diễn đạt tự nhiên tính khái quát mà vẫn giữ động từ “có” của nguyên văn.
- source_word: τὰς ἐντολάς μου
  choice: các điều răn của tôi
  rationale: “Điều răn” giữ được tính thẩm quyền của ἐντολή và phù hợp cách dùng trong văn mạch Giăng.
- source_word: τηρῶν
  choice: tuân giữ
  rationale: τηρέω ở đây bao gồm việc giữ, làm theo và trung thành với các điều răn. “Tuân giữ” rộng hơn “vâng lời” đơn thuần và tự nhiên trong tiếng Việt.
- source_word: ἐκεῖνός ἐστιν ὁ ἀγαπῶν με
  choice: thì chính là người yêu tôi
  rationale: '“Chính là” thể hiện sự nhấn mạnh của ἐκεῖνος: người có và tuân giữ các điều răn được xác định là người yêu Chúa Giê-su.'
- source_word: ἀγαπῶν / ἀγαπηθήσεται / ἀγαπήσω
  choice: yêu / sẽ được … yêu / sẽ yêu
  rationale: Giữ nhất quán sự lặp lại có chủ ý của nhóm từ ἀγαπάω, không thay bằng các từ gần nghĩa khác.
- source_word: ὁ δὲ ἀγαπῶν με
  choice: Người yêu tôi
  rationale: δέ ở đây nối tiếp ý hơn là biểu thị tương phản mạnh; việc mở câu mới không cần thêm “nhưng” hoặc “còn” trong tiếng Việt.
- source_word: ἀγαπηθήσεται ὑπὸ τοῦ πατρός μου
  choice: sẽ được Cha tôi yêu
  rationale: Giữ thể tương lai bị động và ngôn ngữ thân tử của nguyên văn.
- source_word: κἀγὼ
  choice: tôi cũng
  rationale: κἀγώ kết hợp καί và ἐγώ; “tôi cũng” làm rõ hành động tương ứng của Chúa Giê-su bên cạnh hành động của Cha.
- source_word: ἐμφανίσω αὐτῷ ἐμαυτόν
  choice: tỏ mình cho người ấy
  rationale: Cách diễn đạt này giữ ý Chúa Giê-su đích thân tự bày tỏ, đồng thời không thu hẹp nghĩa thành một lần hiện ra có thể nhìn thấy bằng mắt.
- source_word: αὐτὸν / αὐτῷ
  choice: người ấy / cho người ấy
  rationale: Tiếng Việt tự nhiên dùng “người ấy” để quy chiếu về cá nhân số ít mang nghĩa đại diện, không cần áp đặt giống ngữ pháp Hy Lạp thành “anh ấy”.
theological_decisions:
- issue: Mối liên hệ giữa tình yêu và sự tuân giữ điều răn
  choice: Diễn đạt rằng người có và tuân giữ các điều răn chính là người yêu Chúa Giê-su.
  alternative: Sự vâng phục chứng minh tình yêu; hoặc sự vâng phục khiến một người xứng đáng nhận tình yêu của Đức Chúa Trời.
  rationale: Cú pháp Hy Lạp xác định người tuân giữ điều răn là người yêu Chúa Giê-su, nhưng không nói rõ quan hệ nhân quả hay công trạng. Bản dịch giữ nguyên sự căng thẳng thần học này.
- issue: Bản chất việc Chúa Giê-su tự bày tỏ
  choice: tỏ mình cho người ấy
  alternative: cho người ấy thấy mình; hiện ra cho người ấy
  rationale: ἐμφανίζω có thể chỉ việc làm cho thấy hoặc làm cho biết. Văn mạch cho phép ý tự mặc khải mang tính cá nhân và không buộc phải hiểu là sự xuất hiện hữu hình.
- issue: Dạng giống đực số ít mang nghĩa đại diện
  choice: Dùng “người nào/người ấy” trong tiếng Việt và giải thích ở chú thích.
  alternative: Dùng đại từ mang giới tính như “anh ấy”.
  rationale: Nguyên văn dùng dạng giống đực số ít với nghĩa đại diện. Tiếng Việt không đánh dấu giống ngữ pháp trong “người ấy”, nên cách dịch này vừa giữ số ít vừa không tạo ra một giới hạn giới tính vốn không có trong ý nghĩa của câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “điều răn,” “tuân giữ” và “Cha tôi” để bảo toàn sắc thái thần học của văn mạch Giăng; tránh lối diễn đạt quá cổ như “kẻ nào” hoặc “bày tỏ chính mình”.
