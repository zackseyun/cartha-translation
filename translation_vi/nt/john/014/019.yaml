id: JHN.14.19
reference: John 14:19
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἔτι μικρὸν καὶ ὁ κόσμος με οὐκέτι θεωρεῖ, ὑμεῖς δὲ θεωρεῖτέ με, ὅτι ἐγὼ ζῶ καὶ ὑμεῖς ⸀ζήσετε.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/019.yaml
  text: A little while longer[a], and the world will no longer see me, but you will see me. Because I live[b], you also will live.
translation:
  language: vi
  text: Chỉ còn ít lâu nữa[a], thế gian sẽ không còn thấy Ta, nhưng các con sẽ thấy Ta. Vì Ta sống, nên các con cũng sẽ sống.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Động từ Hy Lạp được dịch là “thấy” trong cả hai vế cũng có thể mang sắc thái “nhìn xem” hoặc “quan sát,” chứ không chỉ là thoáng nhìn.
    reason: lexical_alternative
  - marker: b
    text: “Các con cũng sẽ sống” có thể chỉ việc các môn đồ dự phần vào sự sống phục sinh của Đức Giê-su, sự sống thuộc linh trong sự hiệp nhất với Ngài, hoặc cả hai.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔτι μικρὸν
  choice: Chỉ còn ít lâu nữa
  rationale: Diễn đạt tự nhiên một khoảng thời gian ngắn còn lại, đồng thời giữ hướng nhìn về sự thay đổi sắp xảy ra.
- source_word: ὁ κόσμος
  choice: thế gian
  rationale: Thuật ngữ trang trọng, quen thuộc trong văn mạch Giăng, giữ được phạm vi ý nghĩa về nhân loại xa cách Đức Chúa Trời mà không diễn giải quá mức.
- source_word: θεωρεῖ / θεωρεῖτέ
  choice: sẽ không còn thấy / sẽ thấy
  rationale: “Thấy” tự nhiên trong tiếng Việt và có thể bao hàm cả nhìn thấy lẫn nhận biết; thì tương lai được thể hiện theo khung thời gian của câu.
- source_word: οὐκέτι
  choice: không còn
  rationale: Diễn đạt ngắn gọn sự chấm dứt kể từ thời điểm sắp đến.
- source_word: δὲ
  choice: nhưng
  rationale: Nêu rõ sự tương phản giữa thế gian và các môn đồ.
- source_word: ὅτι
  choice: Vì
  rationale: 'Giữ quan hệ nguyên nhân: sự sống của Đức Giê-su là nền tảng cho sự sống của các môn đồ.'
- source_word: ἐγὼ ζῶ
  choice: Ta sống
  rationale: Giữ nguyên thì hiện tại và cách nói cô đọng, giàu sức nặng của nguyên văn.
- source_word: καὶ ὑμεῖς ζήσετε
  choice: các con cũng sẽ sống
  rationale: Giữ rõ thì tương lai và từ “cũng,” nhấn mạnh sự liên hệ giữa sự sống của Đức Giê-su với sự sống của các môn đồ.
theological_decisions:
- issue: Ý nghĩa việc các môn đồ “thấy” Đức Giê-su
  choice: Dùng từ rộng nghĩa “thấy,” không xác định đó chỉ là gặp Ngài sau khi sống lại hay nhận biết Ngài về mặt thuộc linh.
  alternative: “nhìn thấy,” “chiêm ngưỡng,” hoặc diễn giải là thấy Đức Giê-su phục sinh
  rationale: θεωρέω có thể gợi việc nhìn chăm chú hoặc nhận biết, và văn mạch có thể mang nhiều tầng ý nghĩa; bản dịch không nên tự ý thu hẹp.
- issue: Ý nghĩa “các con cũng sẽ sống”
  choice: Giữ cách diễn đạt rộng, không giới hạn vào sự sống thuộc linh hiện tại hay sự sống lại trong tương lai.
  alternative: “sẽ được sống lại” hoặc “sẽ có sự sống thuộc linh”
  rationale: ζήσετε có thể bao hàm sự dự phần vào sự sống phục sinh của Đức Giê-su, sự sống trong sự hiệp nhất với Ngài, hoặc cả hai.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “Ta—các con” để phản ánh lời Đức Giê-su nói trực tiếp với các môn đồ; giữ “thế gian” như thuật ngữ quen thuộc trong văn chương Giăng. Dấu chú thích đều xuất hiện trong chính văn.
