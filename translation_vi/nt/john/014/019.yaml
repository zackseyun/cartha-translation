  verdict: approve
  source_fidelity: 'Bản dịch phản ánh chính xác cấu trúc và ý chính của Hy Lạp: ἔτι μικρόν là thời gian ngắn còn lại; οὐκέτι diễn tả sự chấm dứt sắp tới; sự tương phản giữa «thế gian» và các môn đồ được giữ bằng «nhưng»; và ζήσετε được dịch rõ ở thì tương lai. «Vì Ta sống, nên các con cũng sẽ sống» giữ quan hệ nguyên nhân của ὅτι và không thu hẹp bản chất của sự sống được hứa.'
  naturalness: «Chỉ còn ít lâu nữa» và «sẽ không còn thấy» là tiếng Việt hiện đại, rõ ràng, đồng thời phù hợp văn phong trang trọng của lời Đức Giê-su. Cặp xưng hô «Ta—các con» nhất quán trong câu nói trực tiếp với các môn đồ.
  terminology: «Thế gian» phù hợp cách dùng Giăng về κόσμος mà không diễn giải thành một khái niệm hẹp hơn. «Thấy» giữ được độ rộng của θεωρέω; «sống» giữ độ rộng của ζάω. Chú thích a trình bày sắc thái quan sát/nhìn xem; chú thích b nêu các khả năng diễn giải mà không áp đặt một lập trường giáo phái.
