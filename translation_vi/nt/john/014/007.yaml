id: JHN.14.7
reference: John 14:7
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἰ ⸀ἐγνώκειτέ με, καὶ τὸν πατέρα μου ⸂ἂν ᾔδειτε⸃· ⸀ἀπ’ ἄρτι γινώσκετε αὐτὸν καὶ ἑωράκατε ⸀αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/007.yaml
  text: If you had known me, you would have known my Father also. From now on you do know him and have seen him.
translation:
  language: vi
  text: Nếu các con đã biết Ta thì cũng đã biết Cha Ta. Từ nay, các con biết Ngài và đã thấy Ngài.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγνώκειτέ / γινώσκετε
  choice: đã biết / biết
  rationale: Dùng “biết” cho cả hai động từ cùng gốc để giữ mối liên hệ trong câu; thì quá khứ giả định ở vế đầu và hiện tại ở vế sau được thể hiện tự nhiên trong tiếng Việt.
- source_word: ἂν ᾔδειτε
  choice: cũng đã biết
  rationale: Diễn đạt hệ quả phản thực của mệnh đề điều kiện quá khứ, đồng thời giữ sắc thái “cũng” của καί.
- source_word: ἀπ’ ἄρτι
  choice: Từ nay
  rationale: Cách nói tự nhiên, trang trọng, chỉ thời điểm bắt đầu từ hiện tại trở đi.
- source_word: ἑωράκατε
  choice: đã thấy
  rationale: 'Giữ thể hoàn thành: hành động thấy đã xảy ra và có ý nghĩa ở hiện tại.'
- source_word: αὐτόν
  choice: Ngài
  rationale: Đại từ kính trọng, tự nhiên trong văn phong Kinh Thánh tiếng Việt, quy chiếu về Đức Chúa Cha.
theological_decisions:
- issue: Mối liên hệ giữa việc biết và thấy Chúa Giê-su với việc biết và thấy Cha
  choice: Giữ nguyên lời khẳng định “biết Ngài và đã thấy Ngài” mà không giải thích thêm.
  alternative: Diễn giải rằng thấy Cha chỉ có nghĩa là thấy Cha được bày tỏ qua Chúa Giê-su.
  rationale: Bản dịch không nên đưa phần giải nghĩa thần học vào chính câu, nhưng cần bảo toàn sức căng và chiều sâu của lời tuyên bố trong nguyên văn.
- issue: Sắc thái nhấn mạnh của γινώσκετε trong lớp tham khảo tiếng Anh (“do know”)
  choice: Dịch đơn giản là “biết”.
  alternative: Dịch “thật sự biết” hoặc “quả thật biết”.
  rationale: Tiếng Hy Lạp không có tiểu từ nhấn mạnh riêng tương ứng với “do”; thêm “thật sự” có thể làm câu mạnh hơn chứng cứ nguồn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ta/các con” phù hợp lời Chúa Giê-su nói với các môn đồ; dùng “Cha Ta” và “Ngài” để chỉ Đức Chúa Cha.
