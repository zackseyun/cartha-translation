id: JHN.14.3
reference: John 14:3
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἐὰν πορευθῶ ⸀καὶ ἑτοιμάσω ⸂τόπον ὑμῖν⸃, πάλιν ἔρχομαι καὶ παραλήμψομαι ὑμᾶς πρὸς ἐμαυτόν, ἵνα ὅπου εἰμὶ ἐγὼ καὶ ὑμεῖς ἦτε.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/003.yaml
  text: And if I go and prepare a place for you[a], I am coming again and will take you to myself, so that where I am[b], you also may be.
translation:
  language: vi
  text: Và nếu Ta đi và chuẩn bị một chỗ cho các con, Ta lại đến[a][b] và sẽ đón các con về với Ta, để Ta ở đâu thì các con cũng ở đó.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Ta sẽ lại đến.” Động từ Hy Lạp có hình thức hiện tại (“Ta lại đến”) nhưng mang ý nghĩa tương lai trong văn cảnh.'
    reason: lexical_alternative
  - marker: b
    text: 'Có nhiều cách hiểu về lời “Ta lại đến”: lời này có thể chỉ riêng sự trở lại cuối cùng của Chúa Giê-su, những lần Ngài hiện ra sau khi sống lại, sự đến của Thánh Linh, hoặc là một lời hứa có nhiều tầng ý nghĩa bao gồm hơn một sự kiện.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐὰν πορευθῶ
  choice: nếu Ta đi
  rationale: Giữ cấu trúc điều kiện hướng về tương lai của ἐάν với động từ giả định, đồng thời dùng nghĩa trực tiếp và tự nhiên của πορεύομαι là “đi”, không diễn giải thêm thành “rời khỏi”.
- source_word: ἑτοιμάσω τόπον ὑμῖν
  choice: chuẩn bị một chỗ cho các con
  rationale: “Chuẩn bị” diễn đạt đúng ἑτοιμάζω, còn “một chỗ” phản ánh τόπον mà không xác định thêm bản chất của chỗ ấy.
- source_word: πάλιν ἔρχομαι
  choice: Ta lại đến
  rationale: Tiếng Việt không bắt buộc đánh dấu thì; cách nói này tự nhiên, giữ được sắc thái sống động của dạng hiện tại ἔρχομαι trong khi văn cảnh vẫn cho thấy ý hướng tương lai. Chú thích nêu cách dịch có dấu hiệu tương lai rõ hơn.
- source_word: παραλήμψομαι ὑμᾶς πρὸς ἐμαυτόν
  choice: sẽ đón các con về với Ta
  rationale: “Đón” diễn tả việc tiếp nhận và đưa các môn đồ vào sự hiện diện của Chúa Giê-su; “về với Ta” giữ lực quan hệ của πρὸς ἐμαυτόν và tự nhiên trong tiếng Việt.
- source_word: ἵνα
  choice: để
  rationale: “Để” là cách diễn đạt tự nhiên, rõ ràng cho mệnh đề chỉ mục đích do ἵνα dẫn vào.
- source_word: ὅπου εἰμὶ ἐγὼ καὶ ὑμεῖς ἦτε
  choice: Ta ở đâu thì các con cũng ở đó
  rationale: Cấu trúc “ở đâu… ở đó” tự nhiên trong tiếng Việt, giữ sự song hành và từ καί (“cũng”). Trong mệnh đề mục đích sau “để”, câu vẫn giữ ý mong muốn/kết quả nhằm tới mà không biến thành một lời xác định thời điểm.
theological_decisions:
- issue: Ý nghĩa của lời hứa πάλιν ἔρχομαι
  choice: 'Dịch như một lời hứa hướng về tương lai nhưng không xác định cách thức hay thời điểm: “Ta lại đến”.'
  alternative: Có thể hiểu cụ thể là những lần Chúa Giê-su hiện ra sau khi sống lại, sự đến của Thánh Linh, sự trở lại cuối cùng của Ngài, hoặc một lời hứa có nhiều tầng ý nghĩa.
  rationale: Câu này hứa rằng Chúa Giê-su sẽ hiện diện trở lại và đón các môn đồ về với chính Ngài, nhưng tự thân câu không buộc bản dịch phải chọn riêng một trong các cách hiểu thần học rộng hơn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cặp xưng hô “Ta—các con” phù hợp lời Chúa Giê-su nói với các môn đồ trong văn cảnh, tránh từ cổ khó hiểu. Câu giữ liên từ mở đầu “Và” để nối với mạch trước; không thêm chi tiết về “chỗ” hay thu hẹp bản chất của sự Chúa Giê-su “lại đến”.
