id: JHN.14.27
reference: John 14:27
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἰρήνην ἀφίημι ὑμῖν, εἰρήνην τὴν ἐμὴν δίδωμι ὑμῖν· οὐ καθὼς ὁ κόσμος δίδωσιν ἐγὼ δίδωμι ὑμῖν. μὴ ταρασσέσθω ὑμῶν ἡ καρδία μηδὲ δειλιάτω.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/027.yaml
  text: Peace I leave with you; my peace I give to you. I do not give to you as the world gives. Do not let your heart be troubled[a], nor let it be fearful.
translation:
  language: vi
  text: Ta để lại sự bình an cho các con; Ta ban sự bình an của Ta cho các con. Ta ban cho các con không giống như thế gian ban. Lòng các con đừng xao xuyến, cũng đừng sợ hãi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “cũng đừng mất can đảm.” Động từ Hy Lạp mang ý trở nên sợ hãi, nhút nhát hoặc mất can đảm.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰρήνην
  choice: sự bình an
  rationale: “Sự bình an” là cách dịch tự nhiên, quen thuộc và đủ rộng trong tiếng Việt, không thu hẹp ý nghĩa vào sự yên tĩnh nội tâm hay chỉ là vắng bóng xung đột.
- source_word: ἀφίημι
  choice: Ta để lại
  rationale: Diễn đạt trực tiếp hành động để lại cho các môn đồ; không dùng “di tặng” vì từ ấy làm sắc thái di chúc trở nên quá mạnh.
- source_word: εἰρήνην τὴν ἐμὴν
  choice: sự bình an của Ta
  rationale: Giữ sự nhấn mạnh của đại từ sở hữu và phân biệt sự bình an của Đức Giê-su với điều thế gian ban.
- source_word: δίδωμι
  choice: Ta ban
  rationale: “Ban” tự nhiên trong văn phong Kinh Thánh trang trọng và giữ được sự lặp lại có chủ ý của động từ trong câu.
- source_word: οὐ καθὼς ὁ κόσμος δίδωσιν
  choice: Ta ban cho các con không giống như thế gian ban
  rationale: Giữ rõ phép đối chiếu giữa cách Đức Giê-su ban và cách thế gian ban, đồng thời có trật tự câu tự nhiên trong tiếng Việt.
- source_word: κόσμος
  choice: thế gian
  rationale: “Thế gian” là cách gọi quen thuộc trong văn mạch Giăng và duy trì phạm vi nghĩa rộng của κόσμος mà không diễn giải thành một hệ thống xã hội cụ thể.
- source_word: μὴ ταρασσέσθω ὑμῶν ἡ καρδία
  choice: Lòng các con đừng xao xuyến
  rationale: “Lòng” diễn đạt tự nhiên danh từ số ít tập hợp καρδία với đại từ sở hữu số nhiều; “đừng xao xuyến” vừa sát nghĩa vừa phù hợp văn phong trang trọng hiện đại.
- source_word: μηδὲ δειλιάτω
  choice: cũng đừng sợ hãi
  rationale: δειλιάω chỉ việc trở nên sợ hãi, nhút nhát hoặc mất can đảm. “Đừng sợ hãi” tự nhiên và rõ nghĩa; chú thích bảo lưu sắc thái mất can đảm.
theological_decisions:
- issue: Bản chất của sự bình an Đức Giê-su ban
  choice: Giữ cách gọi rộng là “sự bình an” và “sự bình an của Ta”.
  alternative: Diễn giải thành sự thanh thản nội tâm, sự hòa giải với Đức Chúa Trời, hoặc sự toàn vẹn thời cánh chung.
  rationale: Câu này không giới hạn sự bình an vào một phương diện duy nhất; cách dịch rộng bảo tồn chiều sâu và sự căng thẳng thần học của nguyên văn.
- issue: Sắc thái của mệnh lệnh μηδὲ δειλιάτω
  choice: Dịch trong chính văn là “cũng đừng sợ hãi”, kèm chú thích về sắc thái mất can đảm.
  alternative: “Cũng đừng nhút nhát” hoặc “cũng đừng mất can đảm.”
  rationale: “Sợ hãi” dễ hiểu và không gán sắc thái lên án đạo đức mạnh như “hèn nhát”, còn chú thích giúp bảo tồn phạm vi nghĩa của động từ Hy Lạp.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng cặp xưng hô “Ta—các con” cho lời Đức Giê-su nói với các môn đồ; giữ danh từ tập hợp số ít “lòng” theo nguyên văn Hy Lạp. Dấu chú thích [a] được đặt ngay sau mệnh đề liên quan.
