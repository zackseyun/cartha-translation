reference: John 14:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀμὴν ἀμὴν λέγω ὑμῖν, ὁ πιστεύων εἰς ἐμὲ τὰ ἔργα ἃ ἐγὼ ποιῶ κἀκεῖνος ποιήσει, καὶ μείζονα τούτων ποιήσει, ὅτι ἐγὼ πρὸς τὸν ⸀πατέρα πορεύομαι·
base_translation:
  language: en
  yaml_path: translation/nt/john/014/012.yaml
  text: Truly[a], truly, I say to you, the one who believes in me will also do the works that I do; and he will do greater works than these[b], because I am going to the Father.
translation:
  language: vi
  text: 'Thật, thật, tôi nói với anh em: Người tin vào tôi[a] cũng sẽ làm những việc mà tôi làm, và người ấy sẽ làm những việc lớn hơn các việc này,[b] vì tôi đi về với Cha.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Người tin … người ấy” là cách nói số ít mang tính đại diện, chỉ bất cứ ai tin vào Chúa Giê-su.
    reason: cultural_note
  - marker: b
    text: 'Hoặc: “sẽ làm những điều lớn hơn những điều này”; danh từ “việc” được hiểu từ mệnh đề trước.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  choice: Thật, thật
  rationale: Giữ nguyên sự lặp lại đầy nhấn mạnh của công thức long trọng, đồng thời dùng từ tiếng Việt minh bạch thay vì để nguyên âm 'A-men'.
- source_word: ὁ πιστεύων εἰς ἐμέ
  choice: Người tin vào tôi
  rationale: Diễn đạt phân từ có mạo từ như một danh từ số ít mang tính đại diện; 'tin vào tôi' tự nhiên và phù hợp với cách dùng của Giăng.
- source_word: τὰ ἔργα ἃ ἐγὼ ποιῶ
  choice: những việc tôi làm
  rationale: '''Việc'' chuyển tải nghĩa rộng của ἔργα và giữ sự liên kết trực tiếp với động từ ποιῶ mà không giới hạn vào phép lạ hay một loại hành động riêng.'
- source_word: κἀκεῖνος ποιήσει
  choice: cũng sẽ làm
  rationale: Từ 'cũng' thể hiện lực nhấn của κἀκεῖνος, còn thì tương lai của ποιήσει được giữ rõ ràng.
- source_word: καὶ μείζονα τούτων ποιήσει
  choice: và người ấy sẽ làm những việc lớn hơn những việc này
  rationale: Bổ sung 'những việc' theo danh từ ἔργα ở mệnh đề trước, đúng với số nhiều trung tính của μείζονα và tạo câu tiếng Việt hoàn chỉnh, nhưng không xác định 'lớn hơn' theo phương diện nào.
- source_word: ὅτι
  choice: vì
  rationale: Thể hiện quan hệ nguyên nhân giữa những việc lớn hơn và việc Đức Chúa Jêsus đi đến với Cha.
- source_word: πρὸς τὸν πατέρα πορεύομαι
  choice: tôi đi đến với Cha
  rationale: Giữ mạo từ xác định qua danh xưng 'Cha', không tự thêm 'của tôi'; cách nói hiện tại mang ý nghĩa ra đi sắp xảy đến được giữ tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Ý nghĩa của 'những việc lớn hơn những việc này'
  choice: Giữ cách nói rộng, không giải thích những việc ấy lớn hơn về quyền năng, phạm vi hay ý nghĩa lịch sử cứu chuộc.
  alternative: Diễn giải là lớn hơn về phạm vi truyền giáo, về ý nghĩa sau phục sinh, hoặc nhờ công việc của Thánh Linh qua Hội Thánh.
  rationale: Câu Hy Lạp chỉ gắn lời hứa này với việc Đức Chúa Jêsus đi đến với Cha mà không chỉ rõ phương diện so sánh; bản dịch vì thế bảo tồn sự căng thẳng thần học.
- issue: Phạm vi của danh từ số ít giống đực ὁ πιστεύων ... κἀκεῖνος
  choice: Dịch là 'Người tin ... người ấy', mang nghĩa đại diện cho bất cứ ai tin.
  alternative: Dùng đại từ mang giới tính nam như 'người đó, anh ấy'.
  rationale: Tiếng Việt không buộc phải đánh dấu giống ngữ pháp ở đây; 'người ấy' vừa giữ số ít đại diện vừa không thu hẹp lời phán chỉ cho nam giới.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ công thức lặp 'Thật, thật' và đại từ số ít đại diện; không thêm lời giải thích giáo phái cho tính chất của các 'việc lớn hơn'.
