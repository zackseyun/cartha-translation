id: JHN.14.10
reference: John 14:10
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οὐ πιστεύεις ὅτι ἐγὼ ἐν τῷ πατρὶ καὶ ὁ πατὴρ ἐν ἐμοί ἐστιν; τὰ ῥήματα ἃ ἐγὼ ⸀λέγω ὑμῖν ἀπ’ ἐμαυτοῦ οὐ λαλῶ, ὁ δὲ ⸀πατὴρ ἐν ἐμοὶ ⸀μένων ποιεῖ τὰ ἔργα ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/010.yaml
  text: Do you not believe that I am in the Father and the Father is in me? The words that I say to you I do not speak from myself[b][a], but the Father who remains in me does his works.
translation:
  language: vi
  text: Bạn không tin rằng tôi ở trong Cha và Cha ở trong tôi sao? Những lời tôi nói với các bạn, tôi không tự mình nói[a]; nhưng Cha, Đấng ở lại trong tôi[b], làm các việc của Ngài.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “không nói theo ý riêng” hoặc “không nói bởi thẩm quyền riêng.” Cụm từ này có thể chỉ nguồn gốc, sáng kiến hoặc thẩm quyền của lời nói.
    reason: lexical_alternative
  - marker: b
    text: Hay “cư ngụ trong tôi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πιστεύεις
  choice: tin
  rationale: “Tin” là cách diễn đạt tự nhiên và giữ được mối liên hệ với chủ đề πιστεύω lặp lại xuyên suốt Tin Mừng Giăng.
- source_word: ἐν τῷ πατρὶ ... ἐν ἐμοί
  choice: ở trong Cha ... ở trong tôi
  rationale: Giữ nguyên giới từ “trong” và ngôn ngữ về sự ở trong nhau, không diễn giải thành “hiệp một với”.
- source_word: ῥήματα
  choice: những lời
  rationale: Cách dịch trực tiếp, tự nhiên, chỉ nội dung Chúa Giê-su nói.
- source_word: λέγω ... λαλῶ
  choice: nói ... nói
  rationale: Tiếng Việt không cần gượng ép tạo khác biệt từ vựng giữa hai động từ gần nghĩa; lặp lại “nói” rõ ràng và tự nhiên trong câu này.
- source_word: ἀπ’ ἐμαυτοῦ
  choice: tự mình
  rationale: Diễn đạt tự nhiên trong tiếng Việt, đồng thời để ngỏ sắc thái về nguồn gốc, sáng kiến hoặc thẩm quyền; chú thích nêu phương án rõ hơn.
- source_word: μένων
  choice: Đấng ở lại
  rationale: “Ở lại” là cách dịch hiện đại, rõ nghĩa và giữ sắc thái tiếp diễn của μένω.
- source_word: ποιεῖ τὰ ἔργα αὐτοῦ
  choice: đang làm những công việc của Ngài
  rationale: “Làm” tự nhiên với “công việc”; “đang” phản ánh hành động hiện thời, còn “của Ngài” thể hiện đại từ sở hữu αὐτοῦ.
theological_decisions:
- issue: Sự ở trong nhau của Cha và Con
  choice: 'Giữ nguyên: “tôi ở trong Cha và Cha ở trong tôi.”'
  alternative: “Tôi hiệp một với Cha và Cha hiệp một với tôi.”
  rationale: Bản dịch bảo toàn hình ảnh và sự căng thẳng thần học trong nguyên văn, không đồng nhất câu này với một công thức thần học khác.
- issue: Nguồn và tác nhân trong lời nói cùng công việc của Chúa Giê-su
  choice: “tôi không tự mình nói ... Cha ... đang làm những công việc của Ngài.”
  alternative: “tôi không nói theo thẩm quyền riêng ... Cha ngự trong tôi thực hiện các công việc.”
  rationale: Cách dịch giữ sự phân biệt giữa Cha và Con cùng sự hiệp nhất trong sứ mạng, nhưng không giải thích quá mức sắc thái của ἀπ’ ἐμαυτοῦ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Cha” theo cách xưng gọi của Chúa Giê-su trong văn mạch; dùng “các bạn” cho đại từ số nhiều ὑμῖν. Các dấu chú thích [a], [b] đều được đặt ngay sau cụm từ liên quan.
