  to: Bạn không tin rằng tôi ở trong Cha và Cha ở trong tôi sao? Những lời tôi nói với các bạn, tôi không tự mình nói[a]; nhưng Cha, Đấng ở lại trong tôi[b], làm các việc của Ngài.
