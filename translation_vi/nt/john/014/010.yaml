review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch giữ đúng cấu trúc chính của nguyên văn: câu hỏi với πιστεύεις số ít; ngôn ngữ hỗ tương “ở trong”; sự phân biệt giữa lời Chúa Giê-su nói không “từ chính mình” và công việc do Cha đang ở trong Người thực hiện. Tuy nhiên, “đang làm” áp sắc thái tiếp diễn lên ποιεῖ mà thì hiện tại Hy Lạp ở đây không buộc phải biểu thị; sắc thái tiếp diễn đã được chuyển tải đầy đủ bởi “Đấng ở lại”.'
  naturalness: “Những công việc của Ngài” hơi nặng và kém tự nhiên trong văn mạch này. “Các việc của Ngài” gọn, tự nhiên, và vẫn giữ được danh từ số nhiều τὰ ἔργα cùng sở hữu cách αὐτοῦ. Cặp “Bạn/các bạn” phản ánh hợp lý sự chuyển từ số ít πιστεύεις sang số nhiều ὑμῖν, nên được giữ nguyên.
  terminology: “Cha,” “ở trong,” “ở lại,” và “các việc” bảo tồn từ vựng Giăng mà không diễn giải thành công thức thần học. Chú thích b nên đưa một lựa chọn từ vựng gần nghĩa hơn (“cư ngụ”) thay vì “ngự”, vì “ngự” có sắc thái tôn giáo/trang trọng hơn và không cần thiết cho μένων.
  issues:
  - severity: low
    issue: “đang làm” diễn giải thì của ποιεῖ theo tiến hành.
    rationale: ποιεῖ là hiện tại chủ động, nhưng không tự nó đòi hỏi trợ từ tiếp diễn “đang”; μένων mới là phân từ mang nét lưu lại/tiếp diễn rõ ràng.
  - severity: low
    issue: “những công việc của Ngài” không thật tự nhiên.
    rationale: τὰ ἔργα αὐτοῦ được chuyển đạt tự nhiên hơn bằng “các việc của Ngài”, vẫn giữ từ ngữ then chốt “việc” và đại từ sở hữu.
  - severity: low
    issue: Chú thích b dùng “ngự” làm lựa chọn thay thế.
    rationale: “Ngự” có thể gợi sắc thái tôn kính/thuật ngữ tôn giáo vượt quá nét nghĩa cơ bản của μένω; “cư ngụ” là phương án gần nghĩa và trung tính hơn.
