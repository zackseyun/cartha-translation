id: JHN.14.6
reference: John 14:6
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ⸀ὁ Ἰησοῦς· Ἐγώ εἰμι ἡ ὁδὸς καὶ ἡ ἀλήθεια καὶ ἡ ζωή· οὐδεὶς ἔρχεται πρὸς τὸν πατέρα εἰ μὴ δι’ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/006.yaml
  text: Jesus said to him[a], “I am the way, and the truth, and the life[b]. No one comes to the Father except through me.”
translation:
  language: vi
  text: 'Đức Giê-su nói với ông[a]: “Ta là con đường, chân lý và sự sống. Không ai đến với Cha mà không qua Ta.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “Đức Giê-su nói với ông”; tiếng Hy Lạp dùng thì hiện tại lịch sử trong lời kể.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: nói
  rationale: Thì hiện tại lịch sử trong tiếng Hy Lạp được chuyển tự nhiên sang lối kể tiếng Việt; bản thân động từ “nói” không đánh dấu thì, nên không cần thêm “đã”.
- source_word: αὐτῷ
  choice: với ông
  rationale: Đại từ tặng cách chỉ người được Đức Giê-su nói với; “với ông” tự nhiên trong tiếng Việt và phù hợp với nhân vật Tô-ma ở văn cảnh trước.
- source_word: Ἐγώ εἰμι
  choice: Ta là
  rationale: Giữ lời tự xưng nhấn mạnh của Đức Giê-su. “Ta” mang sắc thái trang trọng, có thẩm quyền và nhất quán với lời phán trực tiếp, nhưng không thêm ý ngoài nguyên văn.
- source_word: ἡ ὁδός
  choice: con đường
  rationale: ὁδός vừa có nghĩa đen là đường đi vừa có nghĩa ẩn dụ là phương cách tiếp cận; “con đường” giữ được cả hai lớp nghĩa và tự nhiên trong tiếng Việt.
- source_word: ἡ ἀλήθεια
  choice: chân lý
  rationale: ἀλήθεια có nghĩa cốt lõi là sự thật/chân lý. Trong chuỗi vị ngữ trang trọng này, “chân lý” tự nhiên và giữ chiều sâu khái niệm mà không diễn giải thêm.
- source_word: ἡ ζωή
  choice: sự sống
  rationale: ζωή trong Giăng mang chiều rộng thần học về sự sống, kể cả sự sống đời đời; “sự sống” bảo tồn phạm vi ấy mà không thu hẹp thành đời sống sinh hoạt.
- source_word: οὐδεὶς
  choice: không ai
  rationale: Cách tương đương trực tiếp, tự nhiên của đại từ phủ định, giữ nguyên tính phổ quát của mệnh đề.
- source_word: ἔρχεται
  choice: đến
  rationale: Hiện tại Hy Lạp diễn tả chân lý tổng quát; tiếng Việt dùng “đến” không đánh dấu thì và truyền đạt tự nhiên ý này.
- source_word: πρὸς τὸν πατέρα
  choice: đến với Cha
  rationale: πρός với đối cách diễn tả sự hướng đến. “Cha” được viết hoa vì ở đây là danh xưng chỉ Đức Chúa Trời.
- source_word: εἰ μὴ
  choice: mà không
  rationale: 'Trong cấu trúc phủ định này, εἰ μή có lực loại trừ: không ai đến nếu không qua Đức Giê-su. “Mà không” tự nhiên, đồng thời bảo tồn hình thức gần với “nếu không”; có thể diễn đạt tương đương là “ngoại trừ”.'
- source_word: δι’ ἐμοῦ
  choice: qua Ta
  rationale: διά với sở hữu cách diễn tả phương tiện hoặc sự trung gian. “Qua Ta” ngắn gọn, tự nhiên và giữ lực trung gian của cụm từ.
theological_decisions:
- issue: Tính độc nhất của việc đến với Cha qua Đức Giê-su
  choice: 'Giữ nguyên lời khẳng định trực tiếp: “Không ai đến với Cha mà không qua Ta.”'
  alternative: “Không ai đến với Cha ngoại trừ qua Ta.”
  rationale: Nguyên văn Hy Lạp khẳng định rõ sự loại trừ và vai trò trung gian của Đức Giê-su. Bản dịch không làm nhẹ đi cũng không mở rộng lời khẳng định vượt quá câu văn.
- issue: Chuỗi ba vị ngữ trong lời tự xưng
  choice: “con đường, chân lý và sự sống”
  alternative: “con đường, và chân lý, và sự sống”
  rationale: Tiếng Hy Lạp lặp mạo từ và liên từ để làm nổi bật từng danh từ. Tiếng Việt không có mạo từ tương ứng và việc lặp “và” nghe nặng, nên dùng phép liệt kê tự nhiên nhưng vẫn giữ ba vị ngữ riêng biệt, xác định.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Giê-su” theo lối gọi kính trọng phổ biến; dùng “Ta” trong lời Đức Giê-su để giữ sắc thái uy nghiêm. Không thêm thuật ngữ giáo phái hoặc diễn giải giáo lý vào câu.
