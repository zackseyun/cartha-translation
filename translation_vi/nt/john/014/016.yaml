id: JHN.14.16
reference: John 14:16
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: κἀγὼ ἐρωτήσω τὸν πατέρα καὶ ἄλλον παράκλητον δώσει ὑμῖν ἵνα ⸀ᾖ μεθ’ ὑμῶν εἰς τὸν ⸀αἰῶνα,
base_translation:
  language: en
  yaml_path: translation/nt/john/014/016.yaml
  text: And I will ask the Father[a], and he will give you another Advocate, so that he may be with you forever,
translation:
  language: vi
  text: Và tôi sẽ cầu xin Cha, và Ngài sẽ ban cho anh em một Đấng Bảo Trợ khác[a], để Đấng ấy ở với anh em mãi mãi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hy Lạp παράκλητος cũng có thể dịch là “Đấng Biện Hộ,” “Đấng Giúp Đỡ,” “Đấng Cố Vấn,” hoặc theo truyền thống là “Đấng An Ủi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀγὼ
  choice: Còn tôi
  rationale: Dạng rút gọn của καί + ἐγώ vừa nối tiếp vừa nhấn nhẹ chủ thể. “Còn tôi” diễn đạt tự nhiên mối tương ứng với lời Chúa Giê-su vừa nói với các môn đồ mà không cường điệu sự nhấn mạnh.
- source_word: ἐρωτήσω
  choice: sẽ cầu xin
  rationale: Động từ ở thì tương lai chỉ việc Chúa Giê-su sẽ thỉnh cầu Cha. “Cầu xin” tự nhiên trong quan hệ với Đức Chúa Trời và trang trọng hơn “hỏi,” nhưng không mang nghĩa nghi lễ vượt quá nguyên văn.
- source_word: τὸν πατέρα
  choice: Cha
  rationale: Nguyên văn có mạo từ nhưng không có đại từ sở hữu. “Cha” phù hợp cách xưng gọi trong văn mạch Giăng và không tự ý thêm “Cha tôi.”
- source_word: ἄλλον
  choice: một ... khác
  rationale: ἄλλος chỉ một vị khác trong tương quan với vị đã hiện diện. Cách dịch này giữ nghĩa trực tiếp, không thêm diễn giải “cùng bản tính” vốn không được phát biểu ngay trong từ này.
- source_word: παράκλητον
  choice: Đấng Bảo Trợ
  rationale: παράκλητος là danh xưng giàu nghĩa, có thể bao hàm bênh vực, trợ giúp, khuyên bảo và an ủi. “Đấng Bảo Trợ” giữ tính ngôi vị và vai trò đại diện-hỗ trợ, đồng thời tránh thu hẹp từ này vào một chức năng duy nhất; các khả năng dịch khác được ghi ở chú thích.
- source_word: δώσει ὑμῖν
  choice: Ngài sẽ ban cho anh em
  rationale: Giữ động từ tương lai và tân ngữ gián tiếp. “Ban” phù hợp hành động Cha trao ban một ân tứ/ngôi vị, còn “anh em” là cách gọi tự nhiên đối với nhóm môn đồ.
- source_word: ἵνα ᾖ
  choice: để Đấng ấy ở
  rationale: ἵνα với động từ giả định diễn tả mục đích hoặc kết quả. Tiếng Việt dùng “để” là cách tự nhiên nhất để giữ sắc thái này; việc lặp “Đấng ấy” làm rõ chủ thể có ngôi vị.
- source_word: μεθ’ ὑμῶν
  choice: với anh em
  rationale: μετά với sở hữu cách có nghĩa trực tiếp là “với,” phù hợp hơn việc diễn giải thành “ở giữa.”
- source_word: εἰς τὸν αἰῶνα
  choice: mãi mãi
  rationale: Đây là thành ngữ chỉ sự kéo dài không dứt trong văn mạch Giăng. “Mãi mãi” là cách diễn đạt hiện đại, rõ ràng và tự nhiên.
theological_decisions:
- issue: Cách dịch παράκλητος trong lời hứa về một Đấng khác
  choice: Đấng Bảo Trợ
  alternative: Đấng Biện Hộ; Đấng Giúp Đỡ; Đấng Cố Vấn; Đấng An Ủi
  rationale: Danh xưng này phải vừa giữ tính ngôi vị vừa không thu hẹp công việc của Thánh Linh vào riêng ý pháp lý, trợ giúp hay an ủi. “Đấng Bảo Trợ” có độ rộng thích hợp trong tiếng Việt; chú thích bảo tồn các nét nghĩa và truyền thống dịch khác mà không giải quyết thay cho độc giả.
- issue: Ý nghĩa của “một ... khác”
  choice: Không thêm “cùng loại” hay lời giải thích về bản thể
  alternative: một Đấng khác cùng bản tính
  rationale: ἄλλον xác định sự khác biệt về ngôi được hứa ban, nhưng riêng từ này không phát biểu đầy đủ một công thức bản thể học. Bản dịch giữ nguyên sức căng thần học và để văn mạch rộng hơn của Giăng làm sáng tỏ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Ngài” dùng cho Cha nhằm duy trì sự kính trọng; “anh em” hướng đến tập thể môn đồ. Danh xưng “Đấng Bảo Trợ” được viết hoa để biểu thị một ngôi vị, không chỉ một chức năng trừu tượng.
