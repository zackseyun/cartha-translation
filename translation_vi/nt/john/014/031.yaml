id: JHN.14.31
reference: John 14:31
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀλλ’ ἵνα γνῷ ὁ κόσμος ὅτι ἀγαπῶ τὸν πατέρα, καὶ καθὼς ⸀ἐνετείλατο μοι ὁ πατὴρ οὕτως ποιῶ. Ἐγείρεσθε, ἄγωμεν ἐντεῦθεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/031.yaml
  text: But so that the world may know that I love the Father[a], I do just as the Father has commanded me. Rise, let us go from here.
translation:
  language: vi
  text: Nhưng để thế gian biết rằng tôi yêu Cha, tôi làm đúng như Cha đã truyền cho tôi.[a] Hãy đứng dậy, chúng ta hãy rời khỏi đây.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “Nhưng để thế gian biết rằng tôi yêu Cha, và như Cha đã truyền cho tôi, tôi làm như vậy.”'
    reason: Bảo tồn rõ hơn cấu trúc tương ứng καθώς ... οὕτως (“như ... như vậy”) và liên từ καί trong tiếng Hy Lạp.
lexical_decisions:
- source_word: ἀλλ’
  choice: Nhưng
  rationale: Giữ sắc thái đối lập với lời ngay trước đó, đồng thời là từ nối tự nhiên trong tiếng Việt.
- source_word: ἵνα γνῷ
  choice: để ... biết
  rationale: ἵνα đi với động từ giả định biểu thị mục đích; “để ... biết” chuyển tải trực tiếp và tự nhiên ý nghĩa ấy.
- source_word: ὁ κόσμος
  choice: thế gian
  rationale: Giữ cách dùng đặc trưng của Giăng, chỉ thế giới loài người trong ý nghĩa tập thể, thường ở trong tình trạng xa cách Đức Chúa Trời.
- source_word: ἀγαπῶ τὸν πατέρα
  choice: tôi yêu Cha
  rationale: Diễn đạt hiện tại của ἀγαπάω bằng “yêu”; “Cha” giữ danh xưng có mạo từ mà không thêm đại từ sở hữu vốn không có trong tiếng Hy Lạp.
- source_word: καθὼς ἐνετείλατο μοι ὁ πατὴρ οὕτως ποιῶ
  choice: tôi làm đúng như Cha đã truyền cho tôi
  rationale: “Đúng như” thể hiện sự tương ứng của cặp καθώς ... οὕτως; “truyền” giữ lực nghĩa của một mệnh lệnh hay sự giao phó, không làm nhẹ thành lời khuyên.
- source_word: Ἐγείρεσθε
  choice: Hãy đứng dậy
  rationale: Mệnh lệnh số nhiều kêu gọi các môn đồ đứng lên; cách nói rõ ràng, tự nhiên và trang trọng vừa phải.
- source_word: ἄγωμεν ἐντεῦθεν
  choice: chúng ta rời khỏi đây
  rationale: ἄγωμεν là giả định thức khích lệ ngôi thứ nhất số nhiều; trong ngữ cảnh này, “chúng ta rời khỏi đây” diễn đạt tự nhiên lời thúc giục cùng đi khỏi nơi hiện tại.
theological_decisions:
- issue: Danh xưng πατήρ trong mối quan hệ giữa Chúa Giê-su và Cha
  choice: Cha
  alternative: Cha tôi
  rationale: Tiếng Hy Lạp dùng danh từ với mạo từ nhưng không có đại từ sở hữu. “Cha” giữ nguyên danh xưng và không thêm yếu tố giải thích.
- issue: Lực nghĩa của ἐντέλλομαι khi nói về điều Cha giao cho Con
  choice: đã truyền cho tôi
  alternative: đã chỉ dạy tôi
  rationale: Động từ chỉ việc ban mệnh lệnh hoặc giao phó. Bản dịch giữ nguyên ngôn ngữ về sự vâng phục của Chúa Giê-su mà không làm nhẹ nghĩa vì lý do thần học.
- issue: Quan hệ cú pháp giữa mệnh đề mục đích và καθώς ... οὕτως
  choice: tôi làm đúng như Cha đã truyền cho tôi
  alternative: và Cha đã truyền cho tôi thế nào, tôi làm như vậy
  rationale: Câu Hy Lạp có cấu trúc hơi gãy và cho phép nghe mệnh đề này như hành động khiến thế gian nhận biết, hoặc như nội dung tiếp theo mà thế gian nhận biết. Bản chính chọn cách diễn đạt tự nhiên hơn trong tiếng Việt; chú thích bảo tồn cấu trúc sát chữ và khả năng đọc thay thế.
translation_notes:
  register: Tiếng Việt hiện đại, phổ thông và trang trọng vừa phải. Dùng “tôi” trong lời Chúa Giê-su để tự nhiên với độc giả hiện đại; dùng “Cha” như một danh xưng, không thêm “tôi”. “Hãy đứng dậy” rõ hơn “Hãy trỗi dậy” trong ngữ cảnh rời chỗ.
