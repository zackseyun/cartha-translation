source:
  edition: SBLGNT
  text: λέγει αὐτῷ Ἰούδας, οὐχ ὁ Ἰσκαριώτης· Κύριε, ⸀τί γέγονεν ὅτι ἡμῖν μέλλεις ἐμφανίζειν σεαυτὸν καὶ οὐχὶ τῷ κόσμῳ;
base_translation:
  language: en
  yaml_path: translation/nt/john/014/022.yaml
  text: Judas (not Iscariot) said to him[a], “Lord[b], what has happened that you are going to reveal yourself to us and not to the world?”
translation:
  language: vi
  text: 'Giu-đa (không phải Giu-đa Ích-ca-ri-ốt) thưa: “Lạy Chúa, có điều gì đã xảy ra mà Ngài định bày tỏ chính mình cho chúng con, chứ không cho thế gian?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: thưa
  rationale: Thì hiện tại lịch sử được diễn đạt tự nhiên trong lời kể tiếng Việt; “thưa” đồng thời thể hiện thái độ kính trọng khi môn đồ nói với Chúa Giê-su.
- source_word: Ἰούδας, οὐχ ὁ Ἰσκαριώτης
  choice: Giu-đa (không phải Giu-đa Ích-ca-ri-ốt)
  rationale: Giữ nguyên lời phân biệt rõ người này với Giu-đa Ích-ca-ri-ốt và dùng dạng tên quen thuộc trong tiếng Việt.
- source_word: Κύριε
  choice: Lạy Chúa
  rationale: Cách xưng hô trực tiếp trang trọng, tự nhiên, giữ được cả sự tôn kính lẫn sức nặng của tước hiệu κύριος.
- source_word: τί γέγονεν ὅτι
  choice: vì sao ... lại
  rationale: Cụm Hy Lạp theo sát mặt chữ là “điều gì đã xảy ra khiến...”; trong ngữ cảnh, đây là thành ngữ hỏi về nguyên do của một sự thay đổi, nên “vì sao ... lại” truyền đạt tự nhiên mà không thêm một biến cố cụ thể.
- source_word: ἡμῖν
  choice: cho chúng con
  rationale: Dùng đại từ tự xưng phù hợp khi các môn đồ thưa với Chúa Giê-su; không thêm từ giải thích “các môn đồ” vì ngữ cảnh đã rõ.
- source_word: μέλλεις
  choice: định
  rationale: Diễn đạt ý định hướng tới tương lai của μέλλω mà không nhấn quá mức tính cận kề như “sắp”.
- source_word: ἐμφανίζειν σεαυτόν
  choice: bày tỏ chính mình
  rationale: Giữ lực phản thân của σεαυτόν và phạm vi nghĩa của ἐμφανίζω là làm cho mình được nhận biết hoặc hiện rõ, không giới hạn vào sự xuất hiện hữu hình.
- source_word: κόσμῳ
  choice: thế gian
  rationale: Đây là thuật ngữ quen thuộc để giữ nguyên chiều sâu thần học của κόσμος trong Giăng, thay vì diễn giải thành một nhóm người cụ thể.
theological_decisions:
- issue: Cách dùng κόσμος trong Giăng
  choice: thế gian
  alternative: toàn thể nhân loại; trật tự thế gian không tin
  rationale: Câu này không buộc phải xác định κόσμος chỉ về nhân loại nói chung hay thế giới xa cách Đức Chúa Trời. “Thế gian” bảo toàn độ mở và sự căng thẳng thần học của từ.
- issue: Bản chất của việc Chúa Giê-su bày tỏ chính mình
  choice: bày tỏ chính mình
  alternative: hiện ra; làm cho chúng con nhận biết Ngài
  rationale: Không xác định việc bày tỏ chỉ là nhìn thấy bằng mắt hay chỉ là nhận biết thuộc linh; cách dịch giữ được độ rộng nghĩa của động từ Hy Lạp.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài/chúng con” theo quan hệ giao tiếp giữa Chúa Giê-su và các môn đồ; giữ “thế gian” như thuật ngữ đặc trưng của văn chương Giăng.
