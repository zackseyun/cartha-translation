review_pass:
  verdict: revise
  source_fidelity: Cụm τί γέγονεν ὅτι hỏi về điều/tình huống đã xảy ra dẫn đến việc Chúa Giê-su sẽ bày tỏ chính mình cho nhóm môn đồ chứ không cho thế gian. Bản thảo diễn đạt nguyên nhân bằng “vì sao ... lại” khá tự nhiên, nhưng làm mờ sắc thái của thể hoàn thành γέγονεν (“đã xảy ra”). Bản sửa phục hồi sắc thái này mà không suy đoán biến cố được nói đến.
  naturalness: “Có điều gì đã xảy ra mà...” là cách hỏi tự nhiên, rõ nghĩa trong tiếng Việt hiện đại. Lược “với Ngài” sau “thưa” giúp lời dẫn gọn và tự nhiên hơn; lời xưng hô trực tiếp “Lạy Chúa” vẫn giữ sắc thái kính trọng.
  terminology: Giữ “Giu-đa”, “Ích-ca-ri-ốt”, “Lạy Chúa”, “chúng con”, “bày tỏ chính mình” và “thế gian”. Các lựa chọn này phù hợp với văn phong trang trọng hiện đại và bảo toàn thuật ngữ Giăng, nhất là độ mở nghĩa của κόσμος.
  issues:
  - severity: low
    issue: Sắc thái của τί γέγονεν chưa được thể hiện đầy đủ
    rationale: “Vì sao Ngài lại...” chuyển câu hỏi thành một câu hỏi nguyên nhân chung, trong khi τί γέγονεν nêu rõ điều gì “đã xảy ra” hoặc đã phát sinh làm nên tình huống ấy. Thêm “Có điều gì đã xảy ra mà” bám sát nguyên ngữ hơn.
  revised_text: 'Giu-đa (không phải Giu-đa Ích-ca-ri-ốt) thưa: “Lạy Chúa, có điều gì đã xảy ra mà Ngài định bày tỏ chính mình cho chúng con, chứ không cho thế gian?”'
