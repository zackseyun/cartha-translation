  text: And you know the way where I am going[a].
translation:
  language: vi
  text: Và anh em biết đường đến nơi tôi đi[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Một số thủ bản chép: “Anh em biết nơi tôi đi, và anh em biết đường.”'
    reason: textual_variant
lexical_decisions:
- source_word: καὶ
  choice: (không dịch riêng)
  rationale: Liên từ nối tiếp lời trước; trong tiếng Việt, bỏ từ nối ở đầu câu giúp câu tự nhiên mà vẫn giữ đúng mạch văn.
- source_word: ὅπου
  choice: nơi
  rationale: Trạng từ chỉ địa điểm được diễn đạt tự nhiên bằng “nơi” trong cấu trúc “đến nơi tôi đi”.
- source_word: ἐγὼ
  choice: tôi
  rationale: Đại từ ngôi thứ nhất số ít được giữ lại làm chủ ngữ của động từ “đi”.
- source_word: ὑπάγω
  choice: đi
  rationale: Diễn đạt chuyển động hoặc ra đi trong ngữ cảnh; “đi” tự nhiên và không giải thích quá mức sắc thái từ biệt.
- source_word: οἴδατε
  choice: anh em biết
  rationale: οἶδα có hình thái hoàn thành nhưng mang nghĩa hiện tại. “Anh em” phù hợp với lời Chúa Giê-su nói cùng các môn đồ và dễ hiểu trong tiếng Việt hiện đại.
- source_word: τὴν ὁδόν
  choice: đường
  rationale: Giữ nghĩa rộng của ὁδός là đường/lối, đồng thời không áp đặt trước ý nghĩa được trình bày ở câu 6.
theological_decisions:
- issue: Trật tự mệnh đề và quan hệ giữa “nơi tôi đi” với “đường”
  choice: Anh em biết đường đến nơi tôi đi.
  alternative: Còn nơi tôi đi, anh em biết đường.
  rationale: Bản dịch chính diễn đạt quan hệ đích đến một cách tự nhiên trong tiếng Việt. Từ “đến” làm rõ quan hệ vốn được hàm ý bởi cấu trúc Hy Lạp mà không xác định thêm nơi Chúa Giê-su đi là đâu.
- issue: Dị bản văn bản
  choice: 'Theo SBLGNT: các môn đồ biết “đường” liên quan đến nơi Chúa Giê-su đi.'
  alternative: Anh em biết nơi tôi đi, và anh em biết đường.
  rationale: Cách đọc dài hơn thuộc một số thủ bản và được ghi ở chú thích thay vì đưa vào chính văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và trực tiếp. Dùng “anh em” cho lời xưng hô với nhóm môn đồ; giữ “đường” đủ rộng để bảo toàn sự căng thẳng thần học dẫn sang câu kế tiếp.
