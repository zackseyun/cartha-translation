    rationale: τὴν ὁδόν là một đối tượng xác định; “biết con đường” tái hiện rõ hơn danh từ xác định này và bảo toàn liên kết có chủ ý với ὁδός ở Giăng 14:6.
  - severity: low
    issue: Chú thích [a] không cần thiết và phương án nêu trong chú thích làm mờ sắc thái khả năng của δυνάμεθα.
    rationale: Bản chính đã dịch rõ “có thể”; phương án “Làm sao chúng con biết đường được?” không phải là một lựa chọn từ vựng cần thiết và không cải thiện độ chính xác. Không có vấn đề văn bản hay từ vựng tranh luận nào cần chú thích trong câu này.
