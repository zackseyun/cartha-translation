  to: 'Thô-ma nói với Ngài: “Lạy Chúa, chúng con không biết Ngài đi đâu; làm sao chúng con có thể biết con đường được?”'
  rationale: Thay “đường” bằng “con đường” để phản ánh τὴν ὁδόν như đối tượng xác định và tránh nghĩa thành ngữ “biết đường.” Bỏ chú thích không cần thiết; bản dịch chính đã biểu đạt đầy đủ sắc thái khả năng của δυνάμεθα và vẫn lặp lại “biết” như nguyên ngữ.
