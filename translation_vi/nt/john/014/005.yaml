  text: λέγει αὐτῷ Θωμᾶς· Κύριε, οὐκ οἴδαμεν ποῦ ὑπάγεις· ⸀πῶς ⸂δυνάμεθα τὴν ὁδὸν εἰδέναι⸃;
base_translation:
  language: en
  yaml_path: translation/nt/john/014/005.yaml
  text: Thomas said to him[a], “Lord, we do not know where you are going[b]. How can we know the way?”
translation:
  language: vi
  text: 'Thô-ma nói với Ngài: “Lạy Chúa, chúng con không biết Ngài đi đâu; làm sao chúng con có thể biết con đường được?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει αὐτῷ Θωμᾶς
  choice: Thô-ma nói với Ngài
  rationale: Dùng thì quá khứ tự nhiên trong lối kể tiếng Việt cho hiện tại lịch sử λέγει; đại từ kính trọng “Ngài” phù hợp với lời môn đồ thưa cùng Chúa Giê-su.
- source_word: Κύριε
  choice: Lạy Chúa
  rationale: Cách xưng hô trực tiếp trang trọng, tự nhiên, giữ được cả sắc thái tôn kính và sự nhìn nhận của môn đồ mà không thu hẹp thành lời thưa xã giao.
- source_word: οὐκ οἴδαμεν
  choice: chúng con không biết
  rationale: “Biết” diễn đạt trực tiếp ý nghĩa tri thức của οἶδα; “chúng con” tự nhiên khi các môn đồ thưa với Chúa.
- source_word: ποῦ ὑπάγεις
  choice: Ngài đi đâu
  rationale: Cách nói tự nhiên trong tiếng Việt, đồng thời không giải thích quá mức chiều sâu thần học của ὑπάγω trong sách Giăng.
- source_word: πῶς δυνάμεθα
  choice: làm sao chúng con có thể
  rationale: Giữ cả ý nghi vấn của πῶς và sắc thái khả năng của δύναμαι.
- source_word: τὴν ὁδὸν
  choice: đường
  rationale: “Đường” gọn, tự nhiên và giữ liên hệ chủ đề với câu kế tiếp; trong ngữ cảnh xác định, tiếng Việt không bắt buộc thêm “con” hay “lối”.
- source_word: εἰδέναι
  choice: biết
  rationale: Lặp lại “biết” như cùng gốc οἶδα đã xuất hiện ở đầu câu, nhờ đó giữ nguyên mạch lập luận của Thô-ma.
theological_decisions:
- issue: Sắc thái thần học tiềm ẩn của ὑπάγεις trong văn mạch sách Giăng
  choice: Dịch trung tính là “Ngài đi đâu”
  alternative: “Ngài rời đi đâu” hoặc diễn giải là trở về cùng Cha
  rationale: Câu nói của Thô-ma nhấn mạnh việc các môn đồ không biết đích đến. Bản dịch trung tính giữ nguyên sự căng thẳng của trình thuật, không đưa lời giải thích thần học từ văn mạch rộng hơn vào chính câu này.
- issue: Mối liên hệ của ὁδός với lời tuyên bố của Chúa Giê-su ở câu kế tiếp
  choice: Dịch đơn giản là “đường”
  alternative: “con đường dẫn đến đó”
  rationale: “Đường” bảo toàn liên kết từ ngữ với Giăng 14:6 nhưng không diễn giải trước ý nghĩa mà câu kế tiếp sẽ bày tỏ.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Cách xưng hô “chúng con—Ngài” phù hợp quan hệ môn đồ với Chúa Giê-su. Giữ hai lần dùng từ “biết” để phản ánh οἴδαμεν và εἰδέναι; không thêm chú thích chỉ để nêu sự lặp lại vốn đã hiện rõ trong bản dịch.
