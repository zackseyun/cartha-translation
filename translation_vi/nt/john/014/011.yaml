id: JHN.14.11
reference: John 14:11
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: πιστεύετέ μοι ὅτι ἐγὼ ἐν τῷ πατρὶ καὶ ὁ πατὴρ ἐν ἐμοί· εἰ δὲ μή, διὰ τὰ ἔργα αὐτὰ ⸀πιστεύετε.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/011.yaml
  text: Believe me that I am in the Father and the Father is in me; but if not[a], believe because of the works themselves.
translation:
  language: vi
  text: 'Hãy tin tôi: tôi ở trong Cha và Cha ở trong tôi. Còn nếu không, hãy tin vì chính các công việc ấy.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “hãy tin dựa vào chính các công việc ấy.” Động từ “tin” cuối câu không có tân ngữ được nêu rõ trong tiếng Hy Lạp; ý câu là chính các công việc ấy cung cấp cơ sở để tin.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πιστεύετέ μοι
  choice: Hãy tin tôi
  rationale: Động từ πιστεύω đi với đại từ ở cách cho phép mang nghĩa “tin tôi/tin điều tôi nói”. Cách dịch này giữ lời kêu gọi trực tiếp và không mở rộng thành một lời diễn giải dài hơn.
- source_word: ὅτι
  choice: ':'
  rationale: ὅτι giới thiệu nội dung cần tin. Trong tiếng Việt, dấu hai chấm sau “Hãy tin tôi” diễn đạt tự nhiên nội dung lời khẳng định mà không khiến câu thành cấu trúc gượng “tin tôi rằng”.
- source_word: ἐν τῷ πατρὶ ... ἐν ἐμοί
  choice: ở trong Cha ... ở trong tôi
  rationale: Giữ nguyên hình ảnh tương tại của nguyên văn Giăng, không giản lược thành “hiệp một” hoặc “là một với”, vốn mang tính diễn giải.
- source_word: εἰ δὲ μή
  choice: Còn nếu không
  rationale: 'Giữ lực tương phản và điều kiện: nếu lời kêu gọi trực tiếp vừa nêu chưa được chấp nhận, các công việc cung cấp một cơ sở khác để tin.'
- source_word: διὰ τὰ ἔργα αὐτὰ
  choice: vì chính các công việc ấy
  rationale: διά với đối cách chỉ lý do hoặc cơ sở; αὐτά nhấn mạnh chính các công việc. “Công việc” giữ thuật ngữ rộng thường gặp trong Giăng mà không thu hẹp thành riêng các phép lạ.
- source_word: πιστεύετε
  choice: hãy tin
  rationale: Mệnh lệnh hiện tại được chuyển bằng mệnh lệnh tự nhiên trong tiếng Việt. Không thêm tân ngữ vì nguyên văn không nêu rõ tin ai hoặc tin điều gì ở lần dùng này.
theological_decisions:
- issue: Sự tương tại giữa Con và Cha
  choice: Giữ lời văn “tôi ở trong Cha và Cha ở trong tôi”.
  alternative: “Tôi hiệp một với Cha và Cha hiệp một với tôi.”
  rationale: Bản dịch bảo toàn cách diễn đạt đặc thù của Giăng và sức nặng thần học của nó, nhưng không thay thế lời văn bằng một công thức giải thích về bản thể hay sự hiệp nhất.
- issue: Các công việc là cơ sở để tin
  choice: Để động từ “hãy tin” không có tân ngữ và nêu các công việc là lý do.
  alternative: “Hãy tin tôi vì chính các công việc ấy.”
  rationale: 'Động từ πιστεύετε cuối câu không có tân ngữ minh nhiên. Không thêm “tôi” giúp duy trì độ hàm hồ thật của nguyên văn: các công việc làm chứng và là cơ sở đủ để tin, trong khi đối tượng cụ thể được hiểu từ ngữ cảnh.'
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “tôi” trong lời nói của Chúa Giê-su để giữ lối xưng hô tự nhiên của tiếng Việt hiện đại; viết hoa “Cha” vì đây là danh xưng chỉ Đức Chúa Cha. Dấu hai chấm giúp câu tự nhiên mà vẫn thể hiện ὅτι là mệnh đề nội dung.
