id: JHN.14.20
reference: John 14:20
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐν ἐκείνῃ τῇ ἡμέρᾳ ⸂γνώσεσθε ὑμεῖς⸃ ὅτι ἐγὼ ἐν τῷ πατρί μου καὶ ὑμεῖς ἐν ἐμοὶ κἀγὼ ἐν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/020.yaml
  text: On that day you will know that I am in my Father[a], and you are in me[b], and I am in you.
translation:
  language: vi
  text: Vào ngày ấy[a], chính anh em sẽ biết rằng Thầy ở trong Cha Thầy[b], anh em ở trong Thầy, và Thầy ở trong anh em.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch sát hình thức hơn: “Trong ngày ấy.”'
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn lặp lại từ “trong” ở cả ba mệnh đề. Cách diễn đạt này được giữ nguyên để phản ánh chủ đề về sự ở trong nhau trong Tin Mừng Giăng; “hiệp nhất với” là một cách diễn giải rõ hơn nhưng mang tính giải thích nhiều hơn.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: Vào ngày ấy
  rationale: Cụm giới từ mang nghĩa thời gian. “Vào ngày ấy” tự nhiên trong tiếng Việt hiện đại và vẫn giữ tính xác định của ἐκείνῃ.
- source_word: γνώσεσθε
  choice: sẽ biết
  rationale: Dạng tương lai của γινώσκω chỉ sự nhận biết trong tương lai; “sẽ biết” tự nhiên và không nhấn quá mức vào tiến trình như “sẽ dần nhận biết”.
- source_word: ὑμεῖς
  choice: chính anh em
  rationale: Đại từ được nêu rõ trong tiếng Hy Lạp tạo sắc thái nhấn mạnh; “chính anh em” chuyển tải sắc thái ấy, đồng thời “anh em” phù hợp với lời Chúa Giê-su nói với nhóm môn đồ.
- source_word: ὅτι
  choice: rằng
  rationale: Từ này giới thiệu nội dung mà các môn đồ sẽ biết, không phải một mệnh đề chỉ nguyên nhân.
- source_word: ἐγὼ ἐν τῷ πατρί μου
  choice: Thầy ở trong Cha Thầy
  rationale: “Thầy” là cách xưng hô tự nhiên của Chúa Giê-su với các môn đồ trong ngữ cảnh này. Giữ nguyên giới từ “trong” để bảo toàn hình ảnh và chiều sâu thần học của câu.
- source_word: καὶ ὑμεῖς ἐν ἐμοὶ
  choice: anh em ở trong Thầy
  rationale: Bổ sung “ở” theo cú pháp tiếng Việt cho mệnh đề không có động từ trong tiếng Hy Lạp, đồng thời giữ cách nói “trong”.
- source_word: κἀγὼ ἐν ὑμῖν
  choice: và Thầy ở trong anh em
  rationale: κἀγώ có nghĩa là “và tôi”; cách dịch này giữ cấu trúc đối ứng và ngôn ngữ về sự ở trong nhau.
theological_decisions:
- issue: Ngôn ngữ về sự ở trong nhau trong Tin Mừng Giăng (ἐν ... ἐν ... ἐν)
  choice: 'Giữ “trong” ở cả ba mệnh đề: “Thầy ở trong Cha Thầy, anh em ở trong Thầy, và Thầy ở trong anh em.”'
  alternative: Diễn giải là “hiệp nhất với” hoặc “kết hiệp với”.
  rationale: “Trong” bảo toàn phép ẩn dụ, tính đối ứng và chiều sâu đa nghĩa của nguyên văn, thay vì thu hẹp câu vào một cách giải thích duy nhất về bản thể hay quan hệ.
- issue: Mối quan hệ giữa Chúa Giê-su và Cha
  choice: Dịch trực tiếp là “Thầy ở trong Cha Thầy”.
  alternative: Diễn giải thành “Thầy đồng bản thể với Cha Thầy” hoặc làm nhẹ thành “Thầy ở cùng Cha Thầy”.
  rationale: Cách dịch trực tiếp không làm suy giảm sức nặng Kitô học của lời tuyên bố, nhưng cũng không đưa một công thức tín điều về sau vào chính câu Kinh Thánh.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng cặp xưng hô “Thầy—anh em” theo quan hệ giữa Chúa Giê-su và các môn đồ trong ngữ cảnh; giữ cấu trúc lặp “ở trong” để tái hiện nhịp câu và sự căng mở thần học của nguyên văn.
