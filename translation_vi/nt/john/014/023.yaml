  source_fidelity: Bản nháp truyền đạt đúng điều kiện, việc giữ lời, tình yêu của Cha, và chủ thể số nhiều “chúng ta”. Tuy nhiên, cụm μονὴν ... ποιησόμεθα có danh từ cụ thể “một chỗ ở/nơi ở” với động từ “lập/làm”; bản dịch “cư ngụ cùng” chuyển thành động từ và làm mất hình ảnh cú pháp này. Lời dẫn cũng lược động từ εἶπεν (“và nói”).
  naturalness: “Nếu ai yêu Thầy” và “người ấy” là tiếng Việt hiện đại, rõ nghĩa. “Sẽ lập chỗ ở với người ấy” vừa tự nhiên trong văn phong trang trọng vừa phản ánh sát thành ngữ Hy Lạp hơn “cư ngụ cùng người ấy”.
  terminology: Giữ nhất quán “Đức Giê-su”, “Thầy”, “Cha”, “giữ lời”, và “chúng ta”. Cách dùng “Thầy” trong lời trực tiếp phù hợp ngữ cảnh diễn từ với các môn đồ, không thêm diễn giải tín lý cho chủ thể số nhiều.
