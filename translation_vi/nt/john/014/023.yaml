source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ· Ἐάν τις ἀγαπᾷ με τὸν λόγον μου τηρήσει, καὶ ὁ πατήρ μου ἀγαπήσει αὐτόν, καὶ πρὸς αὐτὸν ἐλευσόμεθα καὶ μονὴν παρ’ αὐτῷ ⸀ποιησόμεθα.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/023.yaml
  text: Jesus answered and said to him[a], “If anyone loves me, he will keep my word, and my Father will love him[b], and we will come to him and make our dwelling with him.”
translation:
  language: vi
  text: 'Đức Giê-su đáp và nói với ông ấy: “Nếu ai yêu Thầy, người ấy sẽ giữ lời Thầy[a]. Cha Thầy sẽ yêu người ấy, và chúng ta sẽ đến với người ấy và lập chỗ ở với người ấy[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “giữ lời dạy của Thầy” hoặc “làm theo điều Thầy nói.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “sẽ lập một nơi cư ngụ với người ấy” hoặc “sẽ làm nhà ở với người ấy.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ
  choice: Đức Giê-su đáp lời ông
  rationale: Diễn đạt tự nhiên trong tiếng Việt động từ kép ‘đáp và nói với ông’, đồng thời vẫn giữ đối tượng số ít αὐτῷ.
- source_word: Ἐάν τις
  choice: Nếu ai
  rationale: Giữ tính điều kiện và phạm vi khái quát, không giới hạn giới tính.
- source_word: ἀγαπᾷ με
  choice: yêu Thầy
  rationale: ‘Yêu’ tương ứng trực tiếp với ἀγαπάω; ‘Thầy’ phù hợp với cách các môn đồ xưng hô với Đức Giê-su trong diễn từ này và tự nhiên hơn ‘ta’ trong tiếng Việt hiện đại.
- source_word: τὸν λόγον μου τηρήσει
  choice: sẽ giữ lời Thầy
  rationale: ‘Giữ lời’ bảo toàn nghĩa rộng của τηρέω, gồm ghi nhớ, trung thành và vâng theo, còn ‘lời’ duy trì sắc thái Gio-an của λόγος.
- source_word: ὁ πατήρ μου ἀγαπήσει αὐτόν
  choice: Cha Thầy sẽ yêu người ấy
  rationale: Giữ danh xưng ‘Cha’ và quan hệ sở hữu; ‘người ấy’ duy trì tham chiếu số ít mà không gán giới tính.
- source_word: πρὸς αὐτὸν ἐλευσόμεθα
  choice: chúng ta sẽ đến với người ấy
  rationale: Giữ nguyên chủ thể số nhiều và chuyển động hướng đến một người được diễn tả bởi πρός.
- source_word: μονὴν παρ’ αὐτῷ ποιησόμεθα
  choice: cư ngụ cùng người ấy
  rationale: Diễn đạt tự nhiên thành ngữ ‘làm một chỗ ở với người ấy’ trong tiếng Việt, đồng thời giữ ý hiện diện bền lâu và ở cùng; chú thích ghi nhận hình thức danh từ cụ thể của nguyên văn.
theological_decisions:
- issue: Chủ thể số nhiều trong ‘chúng ta sẽ đến ... và cư ngụ’
  choice: Giữ ‘chúng ta’, chỉ Đức Giê-su và Cha cùng hành động.
  alternative: Làm mờ chủ thể số nhiều bằng cách diễn đạt chung về sự hiện diện của Đức Chúa Trời.
  rationale: Hai động từ ngôi thứ nhất số nhiều ἐλευσόμεθα và ποιησόμεθα trình bày rõ hành động chung của Đức Giê-su và Cha; bản dịch không thêm lời giải thích tín lý vượt quá câu văn.
- issue: Đại từ khái quát số ít
  choice: Dùng ‘ai’ và ‘người ấy’.
  alternative: Dùng đại từ mang giới tính như ‘người đó/anh ấy’.
  rationale: Cách dịch này vừa giữ chuỗi tham chiếu số ít của tiếng Hy Lạp vừa truyền đạt đúng phạm vi khái quát, không mặc nhiên giới hạn ở nam giới.
- issue: Sắc thái của việc giữ lời
  choice: Giữ cách nói ‘giữ lời’ thay vì chỉ dịch ‘vâng lời’.
  alternative: Dịch τηρέω là ‘vâng theo’.
  rationale: ‘Giữ lời’ bao hàm sự vâng phục nhưng không thu hẹp động từ vào hành động tuân lệnh, nhờ đó bảo tồn chiều sâu của lối nói trong sách Gio-an.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng ‘Đức Giê-su’ trong lời dẫn và ‘Thầy’ trong lời nói trực tiếp, phù hợp bối cảnh Đức Giê-su nói với môn đồ. Dấu chấm phẩy giúp làm rõ ba mệnh đề hệ quả liên tiếp mà không tách rời lập luận.
