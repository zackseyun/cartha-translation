revisions:
- from: 'Đức Giê-su đáp lời ông: “Nếu ai yêu Thầy, người ấy sẽ giữ lời Thầy[a]. Cha Thầy sẽ yêu người ấy; chúng ta sẽ đến với người ấy và cư ngụ cùng người ấy[b].”'
  to: 'Đức Giê-su đáp và nói với ông ấy: “Nếu ai yêu Thầy, người ấy sẽ giữ lời Thầy[a]. Cha Thầy sẽ yêu người ấy, và chúng ta sẽ đến với người ấy và lập chỗ ở với người ấy[b].”'
  rationale: Sửa câu cuối để phản ánh μονὴν (một chỗ ở/nơi cư ngụ) và ποιησόμεθα (chúng ta sẽ lập/làm), thay vì chuyển cả cụm thành động từ “cư ngụ”. Đồng thời phục hồi động từ “nói” trong lời dẫn. Các yếu tố khác của bản nháp, gồm đại từ khái quát và chủ thể số nhiều, được giữ nguyên về ý nghĩa.
