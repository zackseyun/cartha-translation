  text: Μὴ ταρασσέσθω ὑμῶν ἡ καρδία· πιστεύετε εἰς τὸν θεόν, καὶ εἰς ἐμὲ πιστεύετε.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/001.yaml
  text: Do not let your heart be troubled[a]. Believe in God[b]; believe also in me.
translation:
  language: vi
  text: “Lòng anh em đừng bối rối. Hãy tin Đức Chúa Trời[a]; cũng hãy tin tôi[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Anh em tin Đức Chúa Trời; cũng hãy tin tôi.” Dạng Hy Lạp πιστεύετε có thể là thức chỉ định (“anh em tin”) hoặc thức mệnh lệnh (“hãy tin”).'
    reason: alternative_reading
  - marker: b
    text: 'Động từ được dịch là “tin” cũng có thể mang nghĩa “tin cậy”: “Hãy tin cậy Đức Chúa Trời; cũng hãy tin cậy tôi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ ταρασσέσθω
  choice: đừng bối rối
  rationale: Mệnh lệnh hiện tại thể bị động với μή diễn tả lời ngăn cấm. Cách nói này tự nhiên trong tiếng Việt và giữ được ý lòng bị xao động, bất an mà không thu hẹp thành sợ hãi hay lo âu.
- source_word: ὑμῶν ἡ καρδία
  choice: lòng anh em
  rationale: Danh từ καρδία ở số ít nhưng đại từ ὑμῶν ở số nhiều, mang nghĩa tập thể. “Lòng anh em” vừa tự nhiên vừa giữ số ít tập thể và cho thấy lời nói hướng đến cả nhóm môn đồ.
- source_word: πιστεύετε
  choice: hãy tin
  rationale: πιστεύω có thể mang nghĩa tin hoặc tin cậy. “Hãy tin” trực tiếp, trang trọng và phù hợp với cấu trúc πιστεύω εἰς; sắc thái “tin cậy” được nêu trong chú thích.
- source_word: εἰς τὸν θεόν
  choice: Đức Chúa Trời
  rationale: Sau πιστεύω, εἰς chỉ đối tượng mà niềm tin hướng đến. Trong tiếng Việt, động từ “tin” có thể đi trực tiếp với đối tượng, nên không cần dịch máy móc giới từ εἰς.
- source_word: καὶ εἰς ἐμὲ πιστεύετε
  choice: cũng hãy tin tôi
  rationale: “Cũng” thể hiện lực bổ sung của καί và duy trì sự song song giữa việc tin Đức Chúa Trời với tin Chúa Giê-su; lặp lại “hãy tin” phản ánh sự lặp lại của động từ Hy Lạp.
theological_decisions:
- issue: Hai lần πιστεύετε có thể là thức chỉ định hoặc mệnh lệnh
  choice: 'Cả hai được dịch là mệnh lệnh: “Hãy tin Đức Chúa Trời; cũng hãy tin tôi.”'
  alternative: “Anh em tin Đức Chúa Trời; cũng hãy tin tôi.” Cũng có thể hiểu cả hai ở thức chỉ định.
  rationale: Hình thức ngôi hai số nhiều của hiện tại chủ động thức chỉ định và thức mệnh lệnh giống hệt nhau. Trong ngữ cảnh an ủi và khuyên nhủ, mệnh lệnh nối tiếp lời “đừng bối rối” là cách hiểu tự nhiên, nhưng sự mơ hồ thực sự của nguyên văn được giữ trong chú thích.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh em” cho nhóm môn đồ và “lòng” cho καρδία theo lối diễn đạt tự nhiên. “Đức Chúa Trời” được chọn làm danh xưng trang trọng, quen thuộc trong văn mạch Kinh Thánh; đại từ “tôi” giữ cách xưng hô trực tiếp của nguyên văn mà không thêm tước hiệu.
