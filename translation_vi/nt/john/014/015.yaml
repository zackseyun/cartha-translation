reference: John 14:15
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἐὰν ἀγαπᾶτέ με, τὰς ἐντολὰς τὰς ἐμὰς ⸀τηρήσετε·
base_translation:
  language: en
  yaml_path: translation/nt/john/014/015.yaml
  text: If you love me[a], you will keep my commandments.
translation:
  language: vi
  text: Nếu các con yêu mến Ta, các con sẽ giữ[a] các điều răn của Ta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “sẽ vâng theo các mệnh lệnh của Ta.” Động từ Hy Lạp có thể mang nghĩa giữ, tuân giữ, gìn giữ hoặc vâng theo; “giữ” bảo toàn trường nghĩa rộng hơn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐὰν
  choice: Nếu
  rationale: Dẫn vào một mệnh đề điều kiện; “nếu” tự nhiên và không thêm sắc thái lặp lại như “mỗi khi”.
- source_word: ἀγαπᾶτέ
  choice: các con yêu mến
  rationale: Thể hiện động từ hiện tại chủ động, ngôi thứ hai số nhiều, theo cách nói tự nhiên trong tiếng Việt; “yêu mến” phù hợp với sắc thái tình yêu hướng đến một ngôi vị.
- source_word: με
  choice: Ta
  rationale: Đại từ tân ngữ chỉ Đức Giê-su. “Ta” đi cùng cách xưng hô “các con”, tạo lời nói tự nhiên, trang trọng trong ngữ cảnh Người nói với các môn đồ.
- source_word: ἐντολάς
  choice: các điều răn
  rationale: Giữ được sức nặng của ἐντολή và cách dùng quen thuộc trong văn chương Giăng; “mệnh lệnh” cũng có thể dùng nhưng hẹp và trực tiếp hơn.
- source_word: τὰς ἐμὰς
  choice: của Ta
  rationale: Diễn đạt tự nhiên cấu trúc mạo từ cộng tính từ sở hữu, không cần mở rộng thành “những điều răn thuộc về Ta”.
- source_word: τηρήσετε
  choice: các con sẽ giữ
  rationale: Giữ nguyên hình thái tương lai chỉ định. “Giữ” bảo toàn trường nghĩa gồm gìn giữ, tuân giữ và thực hành, thay vì thu hẹp thành sự vâng lời đơn thuần.
theological_decisions:
- issue: Nên dịch τηρήσετε như một mệnh lệnh hay một lời phát biểu ở thì tương lai
  choice: 'Lời phát biểu ở thì tương lai: “các con sẽ giữ”'
  alternative: 'Sắc thái mệnh lệnh: “hãy giữ các điều răn của Ta”'
  rationale: Bản Hy Lạp dùng tương lai chỉ định chứ không dùng mệnh lệnh. Cách dịch này giữ nguyên căng thẳng thần học rằng tình yêu đối với Đức Giê-su dẫn đến việc giữ các điều răn của Người, thay vì biến câu ấy thành một lời truyền dạy trực tiếp.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cặp xưng hô “Ta—các con” phù hợp với lời Đức Giê-su nói cùng các môn đồ; động từ tương lai “sẽ giữ” được duy trì, không chuyển thành mệnh lệnh.
