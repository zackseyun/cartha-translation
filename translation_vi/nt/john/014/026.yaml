source:
  edition: SBLGNT
  text: ὁ δὲ παράκλητος, τὸ πνεῦμα τὸ ἅγιον ὃ πέμψει ὁ πατὴρ ἐν τῷ ὀνόματί μου, ἐκεῖνος ὑμᾶς διδάξει πάντα καὶ ὑπομνήσει ὑμᾶς πάντα ἃ εἶπον ⸀ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/026.yaml
  text: But the Advocate[a], the Holy Spirit, whom the Father will send in my name, he will teach you all things and remind you of all that I said to you.
translation:
  language: vi
  text: Nhưng Đấng Bảo Trợ[a], tức là Đức Thánh Linh, Đấng Cha sẽ sai nhân danh tôi, chính Ngài sẽ dạy anh em mọi điều và nhắc anh em nhớ mọi điều tôi đã nói với anh em.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch là “Đấng Giúp Đỡ”, “Đấng Cố vấn”, “Đấng An Ủi” hoặc “Đấng Biện Hộ” (Hy Lạp: paraklētos).'
    reason: lexical_alternative
lexical_decisions:
- source_word: παράκλητος
  choice: Đấng Bảo Trợ
  rationale: Danh xưng này diễn tả một nhân vật được gọi đến bên cạnh để trợ giúp, bênh vực và đại diện. “Đấng Bảo Trợ” giữ được sắc thái chủ động và có tính ngôi vị; các nghĩa gần được nêu trong chú thích vì không một từ tiếng Việt nào bao quát trọn vẹn.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: Đức Thánh Linh
  rationale: Cách gọi trang trọng, tự nhiên và quen thuộc trong tiếng Việt hiện đại dành cho Thánh Linh, đồng thời thể hiện đây là một danh xưng xác định.
- source_word: ὃ πέμψει ὁ πατήρ
  choice: Đấng mà Cha sẽ sai đến
  rationale: “Đấng” thể hiện sự quy chiếu có tính ngôi vị; “sai đến” truyền đạt tự nhiên hành động πέμπω trong ngữ cảnh người được sai từ Cha đến với các môn đồ.
- source_word: ἐν τῷ ὀνόματί μου
  choice: nhân danh tôi
  rationale: Giữ thành ngữ của nguyên văn và phạm vi ý nghĩa về sự đại diện, thẩm quyền và mối liên hệ với Chúa Giê-su mà không thu hẹp vào một nghĩa duy nhất.
- source_word: ἐκεῖνος
  choice: chính Ngài
  rationale: Đại từ chỉ định giống đực có tính nhấn mạnh, quy chiếu về παράκλητος; “chính Ngài” vừa giữ sức nhấn vừa diễn đạt tự nhiên tính ngôi vị trong tiếng Việt.
- source_word: διδάξει ὑμᾶς πάντα
  choice: sẽ dạy các con mọi điều
  rationale: Diễn đạt trực tiếp lời hứa về việc dạy dỗ; “mọi điều” giữ độ rộng của πάντα mà không giải thích quá mức.
- source_word: ὑπομνήσει ὑμᾶς πάντα ἃ εἶπον ὑμῖν
  choice: nhắc các con nhớ mọi điều tôi đã nói với các con
  rationale: “Nhắc… nhớ” truyền đạt rõ sắc thái khiến người nghe nhớ lại của ὑπομιμνῄσκω và giữ nguyên cấu trúc quy chiếu đến mọi điều Chúa Giê-su đã nói.
theological_decisions:
- issue: Cách quy chiếu có tính ngôi vị đến Đức Thánh Linh
  choice: Dùng “Đấng” và “chính Ngài”
  alternative: Dùng cách quy chiếu phi ngôi vị dựa trên giống trung của πνεῦμα
  rationale: Nguyên văn kết hợp πνεῦμα giống trung với danh xưng παράκλητος giống đực và đại từ nhấn mạnh ἐκεῖνος, đồng thời gán cho Thánh Linh các hành động sai đến, dạy và nhắc nhớ. Cách dịch có tính ngôi vị phản ánh cấu trúc và tác nhân của câu.
- issue: Cách dịch παράκλητος
  choice: Đấng Bảo Trợ
  alternative: Đấng Giúp Đỡ; Đấng Cố Vấn; Đấng An Ủi; Đấng Biện Hộ
  rationale: “Đấng Bảo Trợ” có thể bao gồm sự trợ giúp, bênh vực và đại diện mà không thu hẹp danh xưng chỉ còn chức năng an ủi hay tư vấn. Vì từ Hy Lạp có phạm vi nghĩa rộng, các phương án chính được bảo tồn trong chú thích.
- issue: Phạm vi của “mọi điều”
  choice: Giữ nguyên cách nói rộng “mọi điều”
  alternative: Giải thích là mọi chân lý nói chung hoặc chỉ mọi lời Chúa Giê-su đã dạy
  rationale: Câu có hai lần πάντα, lần thứ hai được xác định bằng “những điều tôi đã nói với các con”. Bản dịch giữ cấu trúc này, không đồng nhất hoặc tách biệt hai phạm vi bằng một diễn giải thần học không có ngay trong câu.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “Cha” và “tôi” theo lời trực tiếp của Chúa Giê-su; dùng “các con” cho ὑμᾶς/ὑμῖν để thể hiện lời Ngài nói với các môn đồ trong quan hệ thầy-trò. Viết hoa “Đấng”, “Đức Thánh Linh” và “Ngài” để nhận diện danh xưng và quy chiếu rõ ràng, không thêm nội dung ngoài nguyên văn.
