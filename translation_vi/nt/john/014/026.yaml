review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch phản ánh đúng cấu trúc chính của câu: παράκλητος được nêu đồng vị với Đức Thánh Linh; Cha là chủ thể của động từ “sẽ sai”; “nhân danh tôi” giữ được thành ngữ ἐν τῷ ὀνόματί μου; và hai vế với hai lần “mọi điều” được duy trì. Tuy nhiên, “các con” thêm sắc thái quan hệ cha-con không được biểu thị trong nguyên văn, vốn chỉ dùng đại từ số nhiều “anh em/các ông”. “Sai đến” cũng thêm nhẹ hướng chuyển động vốn không có trong động từ πέμψει.'
  naturalness: Câu nhìn chung tự nhiên, nhưng “Đấng mà Cha sẽ sai đến” nặng hơn cần thiết. “Đấng Cha sẽ sai” là lối đồng vị–mệnh đề quan hệ tự nhiên, gọn và sát nguyên văn. Dùng nhất quán “anh em” cho đại từ số nhiều phù hợp văn phong Kinh Thánh tiếng Việt hiện đại và không áp đặt quan hệ gia đình.
  terminology: “Đấng Bảo Trợ” là một lựa chọn khả dĩ cho παράκλητος, giữ được nét trợ giúp và bênh vực; chú thích nêu các phương án khác là cần thiết. “Đức Thánh Linh” và “chính Ngài” phù hợp với danh xưng và lực nhấn của ἐκεῖνος trong câu.
  issues:
  - severity: medium
    issue: “các con” cho ὑμᾶς/ὑμῖν
    rationale: Đại từ Hy Lạp chỉ người nghe ở số nhiều, không xác định họ là “con” của người nói. Cách xưng hô này đưa thêm sắc thái quan hệ gia đình/phụ tử vào bản dịch. “Anh em” giữ quy chiếu số nhiều mà không thêm sắc thái ấy.
  - severity: low
    issue: “sai đến” cho πέμψει
    rationale: πέμψει nghĩa là “sẽ sai”; yếu tố “đến” không được phát biểu trong động từ. Dù ngữ cảnh có thể gợi hướng đến các môn đồ, bản dịch tối ưu-tương-đương nên tránh thêm yếu tố này.
  - severity: low
    issue: Mệnh đề “Đấng mà Cha sẽ sai đến”
    rationale: Có thể viết gọn “Đấng Cha sẽ sai”, vừa tự nhiên hơn trong văn viết hiện đại vừa tránh yếu tố “đến” thêm vào.
