- from: Nhưng Đấng Bảo Trợ[a], là Đức Thánh Linh, Đấng mà Cha sẽ sai đến nhân danh tôi, chính Ngài sẽ dạy các con mọi điều và nhắc các con nhớ mọi điều tôi đã nói với các con.
  to: Nhưng Đấng Bảo Trợ[a], tức là Đức Thánh Linh, Đấng Cha sẽ sai nhân danh tôi, chính Ngài sẽ dạy anh em mọi điều và nhắc anh em nhớ mọi điều tôi đã nói với anh em.
