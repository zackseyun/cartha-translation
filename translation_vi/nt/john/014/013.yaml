  source_fidelity: 'Bản dịch truyền đạt đúng cấu trúc và ý chính của nguyên văn: mệnh đề bất định có ἄν (“bất cứ điều gì”), ngôi thứ hai số nhiều, thành ngữ “nhân danh Thầy,” đại từ nhấn mạnh τοῦτο (“điều ấy”), mục đích với ἵνα, và thể bị động “được tôn vinh.” Cách giữ “trong Con” phản ánh ἐν τῷ υἱῷ mà không áp đặt nghĩa phương tiện.'
  naturalness: Câu nhìn chung tự nhiên, trang trọng và phù hợp văn phong Kinh Thánh tiếng Việt hiện đại. Tuy nhiên, “Người Con” không phải là cách dùng tự nhiên nhất trong danh xưng thần học Việt ngữ; “Con” (viết hoa trong ngữ cảnh này) vừa rõ nghĩa vừa phù hợp hơn với cặp danh xưng “Cha—Con.”
  terminology: “Thầy—anh em” phù hợp ngữ cảnh diễn ngôn của Đức Giê-su với các môn đồ. “Cha,” “Con,” “tôn vinh,” và “nhân danh” là các thuật ngữ ổn định, dễ hiểu, không diễn giải quá mức. Chú thích cần đồng bộ thuật ngữ “Con” thay vì “Người Con.”
  issues:
