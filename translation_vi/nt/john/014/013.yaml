id: JHN.14.13
reference: John 14:13
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ὅ τι ἂν αἰτήσητε ἐν τῷ ὀνόματί μου τοῦτο ποιήσω, ἵνα δοξασθῇ ὁ πατὴρ ἐν τῷ υἱῷ·
base_translation:
  language: en
  yaml_path: translation/nt/john/014/013.yaml
  text: And whatever you ask in my name[a], this I will do, so that the Father may be glorified in the Son.
translation:
  language: vi
  text: Và bất cứ điều gì anh em cầu xin nhân danh Thầy, Thầy sẽ làm điều ấy, để Cha được tôn vinh trong Con.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể hiểu là “qua Con.” Tiếng Hy Lạp nói “trong Con,” có thể diễn tả phạm vi hoặc phương tiện mà nhờ đó Cha được tôn vinh.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅ τι ἂν
  choice: bất cứ điều gì
  rationale: Cấu trúc đại từ quan hệ bất định đi với ἄν diễn tả phạm vi rộng, không xác định; “bất cứ điều gì” vừa tự nhiên vừa giữ được tính mở của câu Hy Lạp.
- source_word: αἰτήσητε
  choice: anh em cầu xin
  rationale: Động từ αἰτέω có nghĩa là xin hoặc cầu xin. Trong ngữ cảnh lời cầu nguyện, “cầu xin” tự nhiên; “anh em” thể hiện ngôi thứ hai số nhiều và phù hợp với lời Chúa Giê-su nói với các môn đồ.
- source_word: ἐν τῷ ὀνόματί μου
  choice: nhân danh Thầy
  rationale: “Nhân danh” giữ được chiều sâu của thành ngữ Gio-an, có thể bao hàm sự đại diện, thẩm quyền và sự hòa hợp với Chúa Giê-su mà không thu hẹp câu vào một cách giải thích duy nhất. “Thầy” phù hợp với quan hệ giữa Chúa Giê-su và các môn đồ trong ngữ cảnh.
- source_word: τοῦτο
  choice: điều ấy
  rationale: Giữ lại đại từ chỉ định được nêu rõ trong tiếng Hy Lạp, đồng thời tạo câu tiếng Việt tự nhiên và liên kết trực tiếp với điều được cầu xin.
- source_word: ποιήσω
  choice: Thầy sẽ làm
  rationale: ποιέω ở đây mang nghĩa rộng và trực tiếp là “làm”; cách dịch này không thêm ý “ban cho” hay “hoàn thành” vốn mang tính diễn giải hơn.
- source_word: ἵνα
  choice: để
  rationale: “Để” diễn đạt rõ quan hệ mục đích do ἵνα giới thiệu, súc tích và tự nhiên trong tiếng Việt hiện đại.
- source_word: δοξασθῇ
  choice: được tôn vinh
  rationale: Cách dịch này giữ thể bị động và ngôn ngữ về vinh quang của δοξάζω, mạnh hơn cách nói đơn thuần “được kính trọng”.
- source_word: ὁ πατὴρ
  choice: Cha
  rationale: Nguyên văn là “Cha,” không phải “Cha của Thầy.” Viết hoa cho thấy đây là danh xưng chỉ Đức Chúa Trời trong văn mạch Gio-an mà không thêm từ không có trong bản Hy Lạp.
- source_word: ἐν τῷ υἱῷ
  choice: trong Người Con
  rationale: Giữ giới từ ἐν là “trong,” không tự ý thu hẹp thành nghĩa phương tiện “qua.” “Người Con” làm rõ đây là danh xưng trong mối tương quan với Cha.
theological_decisions:
- issue: Ý nghĩa của việc cầu xin “nhân danh Thầy”
  choice: Giữ thành ngữ “nhân danh Thầy” mà không diễn giải mở rộng.
  alternative: bởi thẩm quyền của Thầy; trong sự hiệp nhất với Thầy; phù hợp với bản tính và ý muốn của Thầy
  rationale: Thành ngữ này có nhiều lớp ý nghĩa trong sách Gio-an. Giữ nguyên cách nói cho phép câu văn bao hàm các sắc thái về thẩm quyền, sự đại diện và mối liên hệ với Chúa Giê-su mà không áp đặt một cách hiểu giáo lý duy nhất.
- issue: Sắc thái của ἐν τῷ υἱῷ
  choice: Dịch là “trong Người Con.”
  alternative: qua Người Con
  rationale: Giới từ ἐν ở đây có thể chỉ phạm vi hoặc phương tiện. Bản văn chính giữ cách diễn đạt gần nguyên văn để bảo toàn độ mở thần học; cách hiểu “qua” được ghi ở chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cặp xưng hô “Thầy—anh em” phù hợp với lời Chúa Giê-su nói với nhóm môn đồ, đồng thời tránh lối nói quá cổ. Các danh xưng “Cha” và “Người Con” được viết hoa để thể hiện chức năng danh xưng trong văn mạch.
