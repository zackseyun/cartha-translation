id: JHN.14.17
reference: John 14:17
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τὸ πνεῦμα τῆς ἀληθείας, ὃ ὁ κόσμος οὐ δύναται λαβεῖν, ὅτι οὐ θεωρεῖ αὐτὸ οὐδὲ ⸀γινώσκει· ⸀ὑμεῖς γινώσκετε αὐτό, ὅτι παρ’ ὑμῖν μένει καὶ ἐν ὑμῖν ⸀ἔσται.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/017.yaml
  text: the Spirit of truth[a], whom the world is not able to receive, because it neither sees him nor knows him. You know him[b], because he remains with you and will be in you.
translation:
  language: vi
  text: Thần Chân Lý[a], là Đấng mà thế gian không thể tiếp nhận, vì thế gian không thấy cũng không biết Ngài. Còn anh em biết Ngài, vì Ngài vẫn ở với anh em và sẽ ở trong anh em.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tiếng Hy Lạp dùng giống trung về ngữ pháp cho từ “Thần” (πνεῦμα) và các đại từ quy chiếu đến từ này; tuy nhiên, đối tượng được nói đến mang tính ngôi vị.
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “sẽ ở giữa anh em.” Đại từ “anh em” ở số nhiều cho phép cách hiểu tập thể, dù “ở trong anh em” giữ rõ hơn sự tương phản với “ở với anh em.”'
    reason: alternative_reading
lexical_decisions:
- source_word: τὸ πνεῦμα τῆς ἀληθείας
  choice: Thần Chân Lý
  rationale: Giữ cấu trúc sở hữu của tiếng Hy Lạp và cách gọi đặc trưng trong Giăng; viết hoa để biểu thị Đức Thánh Linh trong ngữ cảnh.
- source_word: ὃ / αὐτό
  choice: Đấng mà / Ngài
  rationale: πνεῦμα có giống trung về ngữ pháp Hy Lạp, nhưng đối tượng quy chiếu mang tính ngôi vị; cách xưng hô này tự nhiên trong tiếng Việt mà không biến giống ngữ pháp thành một tuyên bố riêng.
- source_word: ὁ κόσμος
  choice: thế gian
  rationale: Đây là cách dịch quen thuộc và rộng nghĩa cho thuật ngữ của Giăng, không thu hẹp thành toàn thể nhân loại hay một hệ thống cụ thể.
- source_word: οὐ δύναται λαβεῖν
  choice: không thể tiếp nhận
  rationale: Thể hiện cả ý bất khả năng của δύναται và ý đón nhận của λαβεῖν; “tiếp nhận” phù hợp với văn phong trang trọng, hiện đại.
- source_word: θεωρεῖ
  choice: thấy
  rationale: Giữ nghĩa trực tiếp và độ mở giữa nhìn thấy với nhận biết, không diễn giải quá mức thành “cảm nhận”.
- source_word: γινώσκει / γινώσκετε
  choice: biết / biết
  rationale: Dùng cùng một động từ để bảo toàn sự tương phản giữa thế gian và các môn đồ.
- source_word: παρ’ ὑμῖν μένει
  choice: vẫn ở với anh em
  rationale: “Ở” tự nhiên trong tiếng Việt; “vẫn” diễn đạt sắc thái tiếp tục của μένει, còn “với” giữ quan hệ của παρά với tặng cách.
- source_word: ἐν ὑμῖν ἔσται
  choice: sẽ ở trong anh em
  rationale: Giữ nghĩa thông thường của ἐν và sự phân biệt với “ở với”; “anh em” là đại từ số nhiều trong ngữ cảnh các môn đồ.
theological_decisions:
- issue: Cách quy chiếu đến Đức Thánh Linh dù danh từ Hy Lạp mang giống trung
  choice: 'Dùng cách gọi mang tính ngôi vị: “Đấng mà”, “Ngài”'
  alternative: Dùng cách quy chiếu phi ngôi vị tương ứng với giống trung ngữ pháp
  rationale: Giống trung thuộc cấu trúc ngữ pháp của πνεῦμα; ngữ cảnh trình bày Thần như một tác nhân có tính ngôi vị. Bản dịch tiếng Việt tránh gây ấn tượng rằng Thần chỉ là một vật hay năng lực vô ngôi.
- issue: Quan hệ của Thần với các môn đồ trong παρά và ἐν
  choice: Giữ riêng “ở với anh em” và “ở trong anh em”
  alternative: Dịch vế sau là “ở giữa anh em”
  rationale: Hai giới từ khác nhau tạo nên sự phân biệt thật trong câu. “Ở trong” là nghĩa trực tiếp nhất, nhưng cách hiểu tập thể “ở giữa” vẫn có thể có vì đại từ ở số nhiều và được ghi chú thay vì bị loại bỏ.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh em” cho đại từ ngôi hai số nhiều hướng đến các môn đồ; lặp “thế gian” thay vì dùng đại từ để câu rõ nghĩa. Các dấu chú thích [a], [b] đều xuất hiện trong chính văn.
