  to: Thần Chân Lý[a], là Đấng mà thế gian không thể tiếp nhận, vì thế gian không thấy cũng không biết Ngài. Còn anh em biết Ngài, vì Ngài vẫn ở với anh em và sẽ ở trong anh em.[b]
