source:
  edition: SBLGNT
  text: Λέγει αὐτῷ Φίλιππος· Κύριε, δεῖξον ἡμῖν τὸν πατέρα, καὶ ἀρκεῖ ἡμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/008.yaml
  text: Philip said to him[a], “Lord, show us the Father, and that is enough for us.”
translation:
  language: vi
  text: 'Phi-líp thưa với Ngài[a]: “Lạy Chúa, xin cho chúng con thấy Cha, thế là đủ cho chúng con.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc, ở cách xưng hô: “Thưa Ngài” (κύριε cũng có thể là lời xưng hô kính trọng, tương đương “Sir”).'
    reason: Bảo lưu khả năng κύριε là cách xưng hô kính trọng; đại từ αὐτῷ (“với Ngài”) có thể được lược bỏ tự nhiên khi dùng cách dịch này.
lexical_decisions:
- source_word: Λέγει
  choice: thưa
  rationale: Động từ ở thì hiện tại lịch sử được chuyển theo lối kể chuyện tự nhiên trong tiếng Việt. “Thưa” vừa giới thiệu lời nói vừa phù hợp với cách Phi-líp kính cẩn nói với Chúa Giê-su.
- source_word: αὐτῷ
  choice: với Ngài
  rationale: Đại từ cách gián tiếp chỉ người được Phi-líp thưa chuyện. “Với Ngài” tự nhiên trong tiếng Việt và giữ sắc thái kính trọng.
- source_word: Φίλιππος
  choice: Phi-líp
  rationale: Phiên âm tên riêng theo cách viết quen thuộc trong tiếng Việt.
- source_word: Κύριε
  choice: Lạy Chúa
  rationale: Dạng hô cách của κύριος khi Phi-líp trực tiếp thưa với Chúa Giê-su. “Lạy Chúa” là cách xưng hô tự nhiên, trang trọng; tuy vậy, từ Hy Lạp cũng có thể mang nghĩa lịch sự là “Thưa Thầy” trong một số ngữ cảnh.
- source_word: δεῖξον
  choice: xin cho ... thấy
  rationale: Mệnh lệnh cách diễn tả lời yêu cầu cho người khác được thấy hoặc nhận biết. Thêm “xin” thể hiện đúng tính chất thỉnh cầu trong tiếng Việt mà không làm yếu nội dung.
- source_word: ἡμῖν
  choice: chúng con
  rationale: Đại từ số nhiều chỉ Phi-líp và các môn đồ; “chúng con” phù hợp quan hệ kính trọng giữa họ với Chúa Giê-su trong lời trực tiếp.
- source_word: τὸν πατέρα
  choice: Cha
  rationale: Trong ngữ cảnh Gioan, danh từ xác định này chỉ Đức Chúa Trời là Cha của Chúa Giê-su. Tiếng Việt có thể dùng “Cha” như danh xưng xác định mà không cần thêm từ ngữ giải thích.
- source_word: καὶ
  choice: thế là
  rationale: Trong câu này, καὶ nối lời xin với kết quả được Phi-líp coi là đầy đủ. “Thế là” diễn đạt tự nhiên quan hệ ấy trong tiếng Việt, đồng thời không thêm điều kiện ngoài văn bản.
- source_word: ἀρκεῖ
  choice: đủ
  rationale: Giữ nghĩa căn bản “đủ, thỏa đáng” của ἀρκέω bằng cách diễn đạt thông dụng hiện nay.
- source_word: ἡμῖν
  choice: cho chúng con
  rationale: Cách gián tiếp đi với ἀρκεῖ được diễn đạt tự nhiên là “đủ cho chúng con”.
theological_decisions:
- issue: Cách dịch κύριος khi Phi-líp thưa với Chúa Giê-su
  choice: Lạy Chúa
  alternative: Thưa Thầy
  rationale: “Lạy Chúa” giữ được sự kính trọng và sức nặng Kitô học trong ngữ cảnh, nhưng chú thích vẫn bảo lưu khả năng từ κύριος được dùng như một cách xưng hô kính trọng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “thưa”, “Ngài”, “Lạy Chúa” và “chúng con” để tái hiện lời thỉnh cầu kính cẩn; câu vẫn giữ tính trực tiếp và ngắn gọn của nguyên văn.
