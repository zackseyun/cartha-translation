  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Οὐκ ἀφήσω ὑμᾶς ὀρφανούς, ἔρχομαι πρὸς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/018.yaml
  text: I will not leave you as orphans[b][a]; I am coming to you.
translation:
  language: vi
  text: Ta sẽ không để các con trở thành trẻ mồ côi[a]; Ta đang đến với các con.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Ta sẽ không để các con trong cảnh mồ côi.” Hình ảnh Hy Lạp nói về những đứa trẻ không có sự chăm sóc của cha mẹ.'
    reason: lexical_alternative
  - marker: b
    text: “Ta đang đến với các con” có thể chỉ việc Chúa Giê-su đến với các môn đồ sau khi sống lại, đến qua Thánh Linh, hoặc sự trở lại của Ngài trong tương lai; cách diễn đạt Hy Lạp không buộc phải hiểu theo duy nhất một nghĩa.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀφήσω
  choice: sẽ không để...lại
  rationale: Động từ tương lai ở đây mang nghĩa để ai lại phía sau; cách diễn đạt này tự nhiên trong tiếng Việt và phù hợp với hình ảnh mồ côi.
- source_word: ὀρφανούς
  choice: như những đứa trẻ mồ côi
  rationale: Giữ hình ảnh cụ thể về những đứa trẻ không còn sự chăm sóc của cha mẹ, thay vì thu hẹp nghĩa thành cảm giác bị bỏ rơi.
- source_word: ἔρχομαι
  choice: đang đến
  rationale: Giữ sắc thái hiện tại sống động và cận tương lai của hình thức Hy Lạp, không chuyển hẳn thành một lời hứa ở thì tương lai.
- source_word: πρὸς ὑμᾶς
  choice: với các con
  rationale: Trong cấu trúc 'đến với', tiếng Việt diễn đạt tự nhiên sự chuyển động hướng đến và hiện diện bên người nghe.
- source_word: Οὐκ
  choice: không
  rationale: Phủ định trực tiếp động từ tương lai, được diễn đạt tự nhiên bằng 'sẽ không'.
theological_decisions:
- issue: Thời điểm và cách thức của lời 'ta đang đến với các con'
  choice: Không xác định cụ thể lời này nói về lần hiện ra sau khi sống lại, sự đến qua Thánh Linh, hay sự trở lại trong tương lai.
  alternative: 'Diễn giải câu này riêng theo một trong ba cách: Chúa Giê-su hiện ra sau khi sống lại; đến qua Thánh Linh; hoặc trở lại vào thời cuối cùng.'
  rationale: Nguyên văn không buộc người đọc chọn duy nhất một đối tượng quy chiếu; bản dịch giữ nguyên độ rộng và sự căng thẳng thần học của lời nói.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ta/các con” để thể hiện lời Chúa Giê-su nói thân tình với các môn đồ; giữ hình ảnh gia đình cụ thể và sắc thái hiện tại của động từ Hy Lạp.
