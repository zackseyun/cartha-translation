  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐν τῇ οἰκίᾳ τοῦ πατρός μου μοναὶ πολλαί εἰσιν· εἰ δὲ μή, εἶπον ἂν ὑμῖν ⸀ὅτι πορεύομαι ἑτοιμάσαι τόπον ὑμῖν·
base_translation:
  language: en
  yaml_path: translation/nt/john/014/002.yaml
  text: In my Father's house there are many dwelling places[a]. If it were not so[b], would I have told you that I am going to prepare a place for you?
translation:
  language: vi
  text: Trong nhà Cha tôi có nhiều nơi ở[a]. Nếu không phải vậy, lẽ nào tôi lại nói với anh em rằng tôi đi để chuẩn bị một chỗ cho anh em?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “nhiều phòng.” Từ Hy Lạp chỉ những nơi để lưu lại hoặc cư ngụ; “nơi ở” có nghĩa rộng hơn và giữ được mối liên hệ với chủ đề ở lại trong chương này.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể hiểu: “Nếu không phải vậy, tôi đã nói với anh em rồi, vì tôi đi để chuẩn bị một chỗ cho anh em.” Mệnh đề Hy Lạp này cũng có thể được đọc như một lời khẳng định thay vì một câu hỏi tu từ.'
    reason: alternative_reading
lexical_decisions:
- source_word: οἰκίᾳ
  choice: nhà
  rationale: Danh từ οἰκία ở đây tự nhiên nhất là “nhà”, giữ nguyên hình ảnh cụ thể và cách nói “nhà Cha tôi” trong Giăng.
- source_word: πατρός μου
  choice: Cha tôi
  rationale: Cách nói sở hữu được diễn đạt tự nhiên trong tiếng Việt; “Cha” chỉ Đức Chúa Trời là Đấng Đức Giê-su đang nói đến.
- source_word: μοναὶ πολλαί
  choice: nhiều nơi ở
  rationale: μονή chỉ nơi lưu lại hoặc cư ngụ. “Nơi ở” đủ rộng, tự nhiên, và không thu hẹp nghĩa thành các phòng riêng trong một công trình.
- source_word: εἰ δὲ μή
  choice: Nếu không phải vậy
  rationale: Diễn đạt rõ điều kiện ngầm trong thành ngữ Hy Lạp và nối tự nhiên với câu trước.
- source_word: εἶπον ἂν ὑμῖν
  choice: lẽ nào tôi đã nói với anh em
  rationale: Aorist đi với ἄν được thể hiện bằng cấu trúc phản thực; “lẽ nào” chuyển tải cách hiểu như một câu hỏi tu từ.
- source_word: ὅτι
  choice: rằng
  rationale: Theo cách ngắt câu được chọn, ὅτι giới thiệu nội dung điều Đức Giê-su đã nói; cách hiểu “vì” được ghi nhận trong chú thích.
- source_word: πορεύομαι
  choice: tôi đi
  rationale: Hiện tại πορεύομαι trong ngữ cảnh này hướng đến cuộc ra đi sắp tới; “tôi đi” trang trọng, gọn và giữ được sắc thái trực tiếp.
- source_word: ἑτοιμάσαι
  choice: để chuẩn bị
  rationale: Động từ nguyên mẫu diễn tả mục đích, được chuyển rõ bằng “để chuẩn bị”.
- source_word: τόπον
  choice: một chỗ
  rationale: τόπος có nghĩa rộng là nơi/chỗ; “một chỗ” tự nhiên trong tiếng Việt và không thu hẹp thành “phòng”.
- source_word: ὑμῖν
  choice: cho anh em
  rationale: Dative mang nghĩa đối tượng thụ hưởng. “Anh em” biểu thị số nhiều và phù hợp với lời Đức Giê-su nói cùng các môn đồ.
theological_decisions:
- issue: Cách dịch μονή trong hình ảnh về nơi ở tương lai
  choice: nhiều nơi ở
  alternative: nhiều phòng; nhiều dinh thự
  rationale: “Nơi ở” phản ánh phạm vi nghĩa của μονή mà không áp đặt hình dung kiến trúc cụ thể như “phòng” hoặc nghĩa phóng đại hiện đại của “dinh thự”; đồng thời còn gợi được chủ đề ở lại/cư ngụ trong chương này.
- issue: Dấu câu và chức năng của mệnh đề thứ hai
  choice: 'Câu hỏi tu từ: “Nếu không phải vậy, lẽ nào tôi đã nói với anh em rằng tôi đi để chuẩn bị một chỗ cho anh em?”'
  alternative: 'Câu trần thuật: “Nếu không phải vậy, tôi đã nói với anh em rồi, vì tôi đi để chuẩn bị một chỗ cho anh em.”'
  rationale: Bản Hy Lạp không có dấu câu nguyên thủy và ὅτι có thể được hiểu là “rằng” hoặc “vì”. Cách đọc câu hỏi tu từ phù hợp với mạch văn, nhưng cách đọc trần thuật là một khả năng thực sự nên được bảo tồn trong chú thích.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh em” cho đại từ số nhiều ὑμῖν trong lời Đức Giê-su nói với các môn đồ; tránh “các ngươi” vì cổ và xa cách. “Nơi ở” và “một chỗ” giữ sự phân biệt giữa μονή và τόπος.
