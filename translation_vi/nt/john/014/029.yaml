  text: καὶ νῦν εἴρηκα ὑμῖν πρὶν γενέσθαι, ἵνα ὅταν γένηται πιστεύσητε.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/029.yaml
  text: And now I have told you before it happens[c][b][a], so that when it happens you may believe.
translation:
  language: vi
  text: Và bây giờ, tôi đã nói với anh em trước khi việc ấy xảy ra, để khi việc ấy xảy ra, anh em tin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Tin” cũng có thể mang sắc thái “tin cậy”; câu Hy Lạp không nói rõ đây là bắt đầu tin hay được củng cố để tiếp tục tin.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ νῦν
  choice: Và bây giờ
  rationale: Giữ cả liên từ καί và trạng từ thời gian νῦν, đồng thời nối tự nhiên với mạch văn trước.
- source_word: εἴρηκα ὑμῖν
  choice: tôi đã nói cho các con biết
  rationale: Thì hoàn thành diễn tả lời đã được nói ra và vẫn có hiệu lực ở hiện tại. Cách nói này tự nhiên trong tiếng Việt và thể hiện rõ đối tượng gián tiếp ὑμῖν.
- source_word: πρὶν γενέσθαι
  choice: trước khi việc ấy xảy ra
  rationale: πρίν với động từ nguyên mẫu aorist mang nghĩa 'trước khi xảy ra'. 'Việc ấy' bổ sung chủ thể hàm ẩn từ ngữ cảnh mà không xác định thêm bản chất sự việc.
- source_word: ἵνα
  choice: để
  rationale: Diễn đạt tự nhiên và rõ ràng ý nghĩa mục đích của ἵνα.
- source_word: ὅταν γένηται
  choice: khi việc ấy xảy ra
  rationale: ὅταν với thể giả định chỉ một sự kiện tương lai; lặp lại 'xảy ra' để bảo toàn sự lặp từ γίνομαι trong nguyên văn.
- source_word: πιστεύσητε
  choice: các con tin
  rationale: πιστεύω thường được dịch là 'tin' trong văn liệu Gioan. Cấu trúc với ἵνα đã thể hiện mục đích nên tiếng Việt không cần thêm một trợ động từ tương ứng với 'may'.
theological_decisions:
- issue: Sắc thái của πιστεύσητε trong ngữ cảnh
  choice: các con tin
  alternative: các con tiếp tục tin; các con tin cậy
  rationale: Động từ Hy Lạp có thể nói đến việc nảy sinh hoặc được củng cố trong đức tin, nhưng tại đây không xác định rõ phương diện nào. Bản dịch rộng hơn là 'tin' bảo toàn sự mở ngỏ ấy.
- issue: Cách xưng hô của Chúa Giê-su với các môn đồ
  choice: tôi—các con
  alternative: Ta—các ngươi; Thầy—anh em
  rationale: Nguyên văn chỉ mã hóa đại từ ngôi thứ nhất và ngôi thứ hai số nhiều, không mã hóa quan hệ xưng hô tiếng Việt. 'Tôi—các con' phù hợp lời thân mật, trang trọng của Chúa Giê-su với các môn đồ mà không thêm tước hiệu vốn không có trong câu.
translation_notes:
  register: Tiếng Việt hiện đại, sáng rõ và trang trọng vừa phải. Dùng hai lần “việc ấy xảy ra” để giữ phép lặp của γενέσθαι/γένηται; tránh lối cổ “ứng nghiệm” vì γίνομαι ở đây rộng hơn. Đại từ “các con” phản ánh ngữ cảnh Chúa Giê-su nói với nhóm môn đồ.
