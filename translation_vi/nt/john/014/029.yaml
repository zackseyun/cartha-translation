review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch phản ánh đúng cấu trúc chính của câu: lời đã nói trước (εἴρηκα), sự việc chưa xảy ra (πρὶν γενέσθαι), mục đích (ἵνα), và thời điểm sự việc xảy ra (ὅταν γένηται) để người nghe πιστεύσητε. Việc lặp lại “việc ấy xảy ra” bảo toàn hợp lý phép lặp của γίνομαι. Tuy nhiên, “các con” không được mã hóa trong nguyên văn và không phù hợp tự nhiên với nhóm môn đồ trưởng thành trong ngữ cảnh này.'
  naturalness: Câu văn rõ ràng, nhưng cặp xưng hô “tôi—các con” tạo độ lệch về quan hệ và sắc thái trong tiếng Việt hiện đại. “Tôi—anh em” trung tính hơn, tự nhiên trong lời nói với một nhóm người trưởng thành, và tránh thêm sắc thái cha-con không có trong câu Hy Lạp.
  terminology: “Tin” là lựa chọn thích hợp cho πιστεύω trong Gioan; không nên ép nghĩa thành “tin cậy,” “bắt đầu tin,” hoặc “tiếp tục tin.” “Để” truyền đạt đúng ý hướng/mục đích của ἵνα. Không cần thêm trợ từ tương đương “có thể” vì cấu trúc mục đích đã được tiếng Việt diễn đạt đầy đủ.
  issues:
