    issue: Cặp đại từ “tôi—các con”
    rationale: ὑμῖν chỉ đánh dấu ngôi thứ hai số nhiều, không biểu thị “con.” Cách gọi “các con” áp đặt một quan hệ cha-con và nghe không tự nhiên khi hướng đến các môn đồ trưởng thành. Đổi thành “anh em” giữ số nhiều, phù hợp ngữ cảnh, và ít diễn giải hơn.
  revised_text: Và bây giờ, tôi đã nói với anh em trước khi việc ấy xảy ra, để khi việc ấy xảy ra, anh em tin.[a]
