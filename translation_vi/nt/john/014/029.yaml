revisions:
- from: Và bây giờ, tôi đã nói cho các con biết trước khi việc ấy xảy ra, để khi việc ấy xảy ra, các con tin.[a]
  to: Và bây giờ, tôi đã nói với anh em trước khi việc ấy xảy ra, để khi việc ấy xảy ra, anh em tin.[a]
  rationale: Chỉ điều chỉnh cách xưng hô từ “các con” thành “anh em” để tránh thêm quan hệ không có trong nguyên văn và để câu tiếng Việt tự nhiên hơn. Các lựa chọn còn lại giữ nguyên vì truyền đạt đúng thì hoàn thành của εἴρηκα, tính hàm ẩn của sự việc, ý mục đích của ἵνα, và tính mở của πιστεύσητε.
  reviewer_model: gpt-5.6-terra
