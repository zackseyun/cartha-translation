id: JHN.14.9
reference: John 14:9
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ὁ Ἰησοῦς· ⸂Τοσούτῳ χρόνῳ⸃ μεθ’ ὑμῶν εἰμι καὶ οὐκ ἔγνωκάς με, Φίλιππε; ὁ ἑωρακὼς ἐμὲ ἑώρακεν τὸν πατέρα· ⸀πῶς σὺ λέγεις· Δεῖξον ἡμῖν τὸν πατέρα;
base_translation:
  language: en
  yaml_path: translation/nt/john/014/009.yaml
  text: Jesus said to him[a], “Have I been with you for so long, and you still have not known me, Philip? The one who has seen me has seen the Father. How can you say, ‘Show us the Father’?”
translation:
  language: vi
  text: 'Đức Giê-su nói với ông: “Thầy ở với anh em bấy lâu[a] mà anh vẫn chưa biết Thầy sao, Phi-líp? Ai đã thấy Thầy là đã thấy Cha. Sao anh lại nói: ‘Xin cho chúng con thấy Cha’?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “lâu đến thế.”'
    reason: Biến thể từ vựng tự nhiên cho Τοσούτῳ χρόνῳ, nhấn mạnh quãng thời gian kéo dài.
lexical_decisions:
- source_word: Τοσούτῳ χρόνῳ
  choice: lâu đến thế
  rationale: Cụm ở cách dữ cách diễn tả khoảng thời gian kéo dài; “lâu đến thế” tự nhiên trong tiếng Việt và giữ được sức nặng của câu hỏi trách nhẹ.
- source_word: μεθ’ ὑμῶν εἰμι
  choice: Ta đã ở với các con
  rationale: Dù động từ Hy Lạp ở thì hiện tại, ngữ cảnh nói về sự hiện diện kéo dài cho đến lúc đang nói; cấu trúc “đã ở với” diễn đạt tự nhiên điều đó trong tiếng Việt.
- source_word: οὐκ ἔγνωκάς με
  choice: con vẫn chưa biết Ta
  rationale: Thì hoàn thành của γινώσκω chỉ tình trạng chưa nhận biết sau một thời gian có cơ hội; “vẫn chưa” giữ được sắc thái trách vấn mà không biến thành một lời giải thích.
- source_word: Φίλιππε
  choice: Phi-líp
  rationale: Dạng phiên âm tiếng Việt rõ ràng của tên riêng ở hô cách.
- source_word: ὁ ἑωρακὼς ἐμὲ
  choice: Ai đã thấy Ta
  rationale: Phân từ hoàn thành có mạo từ được diễn đạt bằng đại từ phiếm chỉ “ai”; cách dịch này tự nhiên, bao quát và giữ ý về việc đã thấy.
- source_word: ἑώρακεν τὸν πατέρα
  choice: là đã thấy Cha
  rationale: Giữ nguyên khẳng định trực tiếp và mạnh mẽ của bản Hy Lạp, không làm nhẹ thành sự giống nhau cũng không thêm lời giải thích tín lý.
- source_word: πῶς σὺ λέγεις
  choice: Sao con lại nói
  rationale: πῶς mang sắc thái ngạc nhiên, chất vấn; “sao… lại” là cách nói tự nhiên trong tiếng Việt hiện đại.
- source_word: Δεῖξον ἡμῖν τὸν πατέρα
  choice: Xin chỉ Cha cho chúng con
  rationale: Giữ động từ trực tiếp “chỉ/cho thấy” và lời thỉnh cầu của Phi-líp; “xin” thể hiện tự nhiên lực của câu mệnh lệnh dùng như lời đề nghị.
theological_decisions:
- issue: Mối liên hệ giữa việc thấy Đức Chúa Jêsus và thấy Cha
  choice: “Ai đã thấy Ta là đã thấy Cha”
  alternative: “Ai đã thấy Ta thì biết Cha là Đấng như thế nào,” hoặc một diễn giải tín lý chi tiết hơn
  rationale: Bản dịch giữ nguyên sức mạnh Kitô học và tính trực tiếp của câu Hy Lạp, không hạ xuống thành sự tương đồng đơn thuần cũng không đưa thêm các phạm trù tín điều không có trong câu.
- issue: Cách gọi πατήρ
  choice: “Cha” không thêm đại từ sở hữu
  alternative: “Cha Ta” hoặc “Đức Chúa Cha”
  rationale: Bản Hy Lạp có “τὸν πατέρα” (người Cha/Cha), không có “của Ta”; dùng “Cha” vừa giữ lối diễn đạt của Giăng vừa tránh thêm nội dung.
translation_notes:
  register: Văn phong trang trọng nhưng dễ hiểu. Đại từ “Ta—con/các con” phân biệt số ít Φίλιππε và số nhiều ὑμῶν, ἡμῖν; viết hoa các đại từ chỉ Đức Chúa Jêsus theo quy ước trình bày, không nhằm thêm ý nghĩa vào bản Hy Lạp.
