revisions:
- from: 'Đức Chúa Jêsus nói với ông: “Ta đã ở với các con lâu đến thế[a] mà con vẫn chưa biết Ta sao, Phi-líp? Ai đã thấy Ta là đã thấy Cha. Sao con lại nói: ‘Xin chỉ Cha cho chúng con’?”'
  to: 'Đức Giê-su nói với ông: “Thầy ở với anh em bấy lâu[a] mà anh vẫn chưa biết Thầy sao, Phi-líp? Ai đã thấy Thầy là đã thấy Cha. Sao anh lại nói: ‘Xin cho chúng con thấy Cha’?”'
  rationale: Chỉnh tên riêng để không thêm tước hiệu ngoài nguyên văn và dùng dạng tiếng Việt hiện đại. Hoàn chỉnh lời xin bằng «cho chúng con thấy»; các yếu tố còn lại giữ sát nghĩa, gồm đối lập số ít «anh» (Phi-líp) với số nhiều «anh em/chúng con», thì hoàn thành và tuyên bố trực tiếp về Cha.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T06:25:12Z'
review_pass:
  verdict: revise
  source_fidelity: Bản nháp nhìn chung truyền đạt đúng cấu trúc thời lượng, sắc thái trách vấn của thì hoàn thành («vẫn chưa biết»), sự phân biệt số ít với Phi-líp và số nhiều trong lời xin, cùng khẳng định trực tiếp về việc thấy Đức Giê-su và thấy Cha. Tuy nhiên, «Đức Chúa Jêsus» thêm tước hiệu «Chúa» không có trong câu Hy Lạp, và «Xin chỉ Cha cho chúng con» thiếu rõ đối tượng được cho thấy; nên dịch đầy đủ động từ δείκνυμι là «xin cho chúng con thấy Cha».
  naturalness: «Đức Giê-su», «Thầy—anh/em» là cách xưng hô trang trọng, tự nhiên trong ngữ cảnh một người thầy nói với môn đệ, đồng thời tránh lối «Ta—con/các con» có thể mang sắc thái cổ hoặc gia trưởng hơn trong tiếng Việt hiện đại. «Ở với anh em bấy lâu» tự nhiên và giữ lực tu từ của Τοσούτῳ χρόνῳ.
  terminology: Dùng «Đức Giê-su» là dạng tên hiện đại, chuẩn hơn «Jêsus», và không thêm danh xưng vào bản văn. Giữ «Cha» không kèm sở hữu từ, phù hợp τὸν πατέρα. Không diễn giải thêm mệnh đề Kitô học.
  issues:
  - severity: medium
    issue: Tên «Đức Chúa Jêsus» vừa thêm tước hiệu vừa dùng chính tả không phải dạng hiện đại chuẩn.
    rationale: Bản Hy Lạp chỉ có ὁ Ἰησοῦς, không có κύριος. «Đức Giê-su» giữ tên riêng mà không bổ sung danh xưng; «Giê-su» phù hợp chính tả tiếng Việt hiện đại.
  - severity: medium
    issue: «Xin chỉ Cha cho chúng con» không diễn đạt trọn vẹn hành động “show ... the Father.”
    rationale: Trong tiếng Việt, «chỉ Cha cho chúng con» có thể hiểu là chỉ định/giới thiệu Cha; «xin cho chúng con thấy Cha» diễn đạt rõ và tự nhiên lời thỉnh cầu Δεῖξον ἡμῖν τὸν πατέρα.
  revised_text: 'Đức Giê-su nói với ông: “Thầy ở với anh em bấy lâu[a] mà anh vẫn chưa biết Thầy sao, Phi-líp? Ai đã thấy Thầy là đã thấy Cha. Sao anh lại nói: ‘Xin cho chúng con thấy Cha’?”'
