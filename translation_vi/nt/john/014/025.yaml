  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ταῦτα λελάληκα ὑμῖν παρ’ ὑμῖν μένων·
base_translation:
  language: en
  yaml_path: translation/nt/john/014/025.yaml
  text: I have spoken these things to you while staying with you[a].
translation:
  language: vi
  text: Thầy đã nói những điều này với anh em khi vẫn còn ở với anh em.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “trong khi lưu lại với anh em” hoặc “khi Thầy ở với anh em.” Tiếng Hy Lạp dùng phân từ của động từ “ở lại,” một từ xuất hiện nhiều lần trong Tin Mừng Giăng.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταῦτα
  choice: những điều này
  rationale: Giữ dạng số nhiều trung tính, chỉ về những lời dạy ngay trước đó, thay vì làm trơn thành số ít “điều này”.
- source_word: λελάληκα
  choice: đã nói
  rationale: Thì hoàn thành Hy Lạp trình bày những lời Chúa Giê-su đã nói với giá trị còn tiếp diễn; tiếng Việt tự nhiên diễn đạt bằng “đã nói”.
- source_word: ὑμῖν
  choice: với anh em
  rationale: Đại từ số nhiều chỉ các môn đồ. “Anh em” là cách xưng hô hiện đại, trang trọng vừa phải và làm rõ đối tượng số nhiều.
- source_word: παρ’ ὑμῖν
  choice: ở với anh em
  rationale: παρά với tặng cách diễn tả sự hiện diện hoặc gần gũi; “ở với anh em” là cách nói tự nhiên trong ngữ cảnh.
- source_word: μένων
  choice: khi vẫn còn ở
  rationale: Phân từ hiện tại của μένω được thể hiện bằng “khi vẫn còn ở”, vừa tự nhiên trong tiếng Việt vừa phần nào giữ sắc thái tiếp tục của động từ thường lặp lại trong Tin Mừng Giăng.
theological_decisions:
- issue: Duy trì mối liên hệ với cách dùng μένω lặp lại trong Tin Mừng Giăng
  choice: khi vẫn còn ở với anh em
  alternative: khi Thầy ở với anh em; trong khi lưu lại với anh em
  rationale: “Vẫn còn ở” giữ được ý tiếp tục của μένω mà không gán thêm một ý nghĩa thần học cụ thể; chú thích ghi nhận các cách dịch sát từ hơn và tự nhiên hơn.
- issue: Đại từ xưng hô của Chúa Giê-su với các môn đồ
  choice: Thầy … anh em
  alternative: Ta … các con; tôi … các anh
  rationale: Tiếng Hy Lạp không mã hóa quan hệ xã hội trong đại từ như tiếng Việt. “Thầy … anh em” phù hợp ngữ cảnh Chúa Giê-su dạy các môn đồ, tự nhiên và trang nghiêm, nhưng không hàm ý quan hệ cha-con.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang nghiêm nhưng dễ hiểu. Cấu trúc “khi vẫn còn ở” tránh lối dịch cứng “đang lưu lại,” đồng thời không làm mất hoàn toàn sắc thái tiếp tục của μένω.
