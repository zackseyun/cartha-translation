reference: John 14:28
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἠκούσατε ὅτι ἐγὼ εἶπον ὑμῖν· Ὑπάγω καὶ ἔρχομαι πρὸς ὑμᾶς. εἰ ἠγαπᾶτέ με ἐχάρητε ἄν, ⸀ὅτι πορεύομαι πρὸς τὸν πατέρα, ὅτι ὁ ⸀πατὴρ μείζων μού ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/028.yaml
  text: You heard that I said to you[a], ‘I am going away, and I am coming to you.’ If you loved me, you would have rejoiced that I am going to the Father[b], because the Father is greater than I.
translation:
  language: vi
  text: 'Các con đã nghe Ta nói với các con rằng: ‘Ta ra đi và Ta đến với các con.’ Nếu các con yêu Ta, hẳn các con đã vui mừng[a] vì Ta đi đến với Cha, bởi Cha lớn hơn Ta[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “thì các con sẽ vui mừng vì Ta đi đến với Cha.” Cấu trúc Hy Lạp có thể được diễn đạt khái quát hơn, nhưng “hẳn… đã vui mừng” phù hợp nhất với điều kiện trái với thực tế trong văn mạch.'
    reason: lexical_alternative
  - marker: b
    text: Câu “Cha lớn hơn Ta” được dịch đúng như nguyên văn, không thêm lời giải thích như “về vai trò” hoặc “về địa vị”.
    reason: alternative_reading
lexical_decisions:
- source_word: ἠκούσατε
  choice: Các con đã nghe
  rationale: Động từ aorist chỉ việc các môn đồ đã nghe lời Đức Giê-su nói trước đó; “đã nghe” tự nhiên và rõ trong tiếng Việt.
- source_word: Ὑπάγω
  choice: Ta ra đi
  rationale: Diễn tả sự rời khỏi các môn đồ với ý hướng sắp xảy ra; “ra đi” vừa trang trọng vừa tự nhiên.
- source_word: ἔρχομαι πρὸς ὑμᾶς
  choice: Ta sẽ trở lại với các con
  rationale: Động từ hiện tại có ý hướng tương lai. Trong ngữ cảnh ra đi rồi đến với họ, “trở lại” làm rõ chuyển động hồi quy vốn được ngữ cảnh gợi ra, còn “sẽ” chuyển đạt lực tương lai tự nhiên trong tiếng Việt.
- source_word: εἰ ἠγαπᾶτέ με
  choice: Nếu các con yêu Ta
  rationale: Thể chưa hoàn thành nằm trong điều kiện trái với thực tế; tiếng Việt thường để điều kiện ở dạng không đánh dấu thời, còn tính phi thực được thể hiện ở mệnh đề sau bằng “hẳn… đã”.
- source_word: ἐχάρητε ἄν
  choice: hẳn các con đã vui mừng
  rationale: Aorist với ἄν trong mệnh đề kết quả của điều kiện trái với thực tế nói đến phản ứng lẽ ra đã xảy ra; “hẳn… đã” truyền đạt sắc thái ấy tự nhiên.
- source_word: πορεύομαι πρὸς τὸν πατέρα
  choice: Ta đi đến với Cha
  rationale: Giữ ý chuyển động và đích đến mang tính tương quan. “Cha” được dùng như danh xưng, không thêm đại từ sở hữu vì nguyên văn không có.
- source_word: πατέρα / πατὴρ
  choice: Cha
  rationale: Trong văn mạch Giăng, đây là danh xưng chỉ Đức Chúa Cha; tiếng Việt tự nhiên không cần mạo từ tương ứng với τὸν/ὁ.
- source_word: μείζων μού
  choice: lớn hơn Ta
  rationale: Dịch trực tiếp phép so sánh, không bổ sung phạm vi như vai trò, địa vị hay tình trạng nhập thể.
theological_decisions:
- issue: Ý nghĩa của câu “Cha lớn hơn Ta”
  choice: Giữ nguyên phép so sánh không kèm lời giải thích trong chính văn.
  alternative: Cha lớn hơn Ta về vai trò/địa vị; hoặc Cha lớn hơn Ta xét theo tình trạng nhập thể của Đức Giê-su.
  rationale: Nguyên văn phát biểu phép so sánh một cách trực tiếp. Bản dịch cần bảo tồn sức căng thần học thay vì đưa một cách giải nghĩa giáo lý vào chính văn.
- issue: Sắc thái của điều kiện εἰ ἠγαπᾶτέ με … ἐχάρητε ἄν
  choice: 'Dịch là điều kiện trái với thực tế: “Nếu… hẳn… đã vui mừng.”'
  alternative: “Nếu… thì sẽ vui mừng.”
  rationale: Cấu trúc với imperfect ở mệnh đề điều kiện và aorist indicative kèm ἄν ở mệnh đề kết quả phù hợp nhất với phản ứng lẽ ra đã xảy ra, dù tiếng Việt cũng có thể diễn đạt khái quát hơn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng cặp xưng hô “Ta—các con” phù hợp lời Đức Giê-su nói trực tiếp với các môn đồ. Viết hoa “Ta” và “Cha” theo quy ước tôn kính phổ biến; tránh thuật ngữ giáo phái và không giải quyết hộ người đọc sức căng thần học của câu cuối.
