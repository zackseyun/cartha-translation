  - severity: medium
    issue: Chú thích a được đặt sau “Cha” nhưng nội dung lại giải thích cách dịch của ἐχάρητε ἄν trong mệnh đề điều kiện.
    rationale: Cần chuyển ký hiệu a đến “đã vui mừng” để neo chú thích đúng đơn vị văn bản.
