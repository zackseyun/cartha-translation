  source_fidelity: 'Cần sửa hai điểm để bám sát nguyên văn: “Ta sẽ trở lại với các con” thêm rõ ý ‘trở lại’ (lặp lại/quay về) mà ἔρχομαι πρὸς ὑμᾶς không nói trực tiếp; nên dịch “Ta đến với các con.” Ngoài ra, chú thích a hiện được neo sau “Cha” dù nội dung chú thích giải thích mệnh đề điều kiện và động từ “đã vui mừng”.'
  naturalness: Bản sửa giữ lối xưng hô trang trọng, hiện đại “Ta—các con”. “Ta đến với các con” tự nhiên trong văn cảnh lời báo trước, đồng thời không diễn giải thêm. “Cha lớn hơn Ta” là cách dịch trực tiếp, dễ hiểu và phù hợp văn phong Kinh Thánh tiếng Việt.
  terminology: Giữ “Cha” như danh xưng Johannine và “Cha lớn hơn Ta” như phép so sánh không kèm giới hạn diễn giải. Không thêm “về vai trò,” “về địa vị,” hoặc bất cứ giải thích tín lý nào vào chính văn.
