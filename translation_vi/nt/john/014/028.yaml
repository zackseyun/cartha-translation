  to: 'Các con đã nghe Ta nói với các con rằng: ‘Ta ra đi và Ta đến với các con.’ Nếu các con yêu Ta, hẳn các con đã vui mừng[a] vì Ta đi đến với Cha, bởi Cha lớn hơn Ta[b].'
  rationale: Sửa “sẽ trở lại” thành “đến” để không thêm sắc thái hồi quy không được nêu trực tiếp trong ἔρχομαι πρὸς ὑμᾶς. Chuyển neo chú thích a đến cụm “đã vui mừng,” là cụm mà chú thích giải thích. Các yếu tố còn lại được giữ nguyên vì phản ánh đầy đủ điều kiện trái thực tế, đích đến “Cha,” và phép so sánh không được diễn giải thêm.
  reviewer_model: gpt-5.6-terra
