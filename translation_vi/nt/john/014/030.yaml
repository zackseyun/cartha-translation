  naturalness: Câu văn tự nhiên, trang trọng và phù hợp văn mạch diễn từ của Chúa Giê-su với các môn đồ. Cặp xưng hô “Ta/các con” nhất quán với lựa chọn đăng ký Kinh Thánh truyền thống nhưng vẫn dễ hiểu trong tiếng Việt hiện đại. “Hắn chẳng có gì nơi Ta” là cách nói Việt ngữ gọn, tránh sự gượng của lối dịch quá chữ “trong Ta”.
  terminology: “Kẻ cai trị thế gian” phản ánh tốt ἄρχων và κόσμος, đồng thời không thay tước hiệu bằng tên riêng hay một diễn giải thần học. “Hắn” nhất quán với nhân vật đối nghịch được nêu bằng tước hiệu. Chú thích nêu các khả năng diễn giải hợp lý và xác nhận cách dịch sát nghĩa mà không biến một khả năng thành nghĩa duy nhất.
