id: JHN.14.30
reference: John 14:30
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οὐκέτι πολλὰ λαλήσω μεθ’ ὑμῶν, ἔρχεται γὰρ ὁ τοῦ κόσμου ἄρχων· καὶ ἐν ἐμοὶ οὐκ ἔχει οὐδέν,
base_translation:
  language: en
  yaml_path: translation/nt/john/014/030.yaml
  text: I will no longer speak much with you[a], for the ruler of the world is coming[b]. And he has nothing in me.
translation:
  language: vi
  text: Ta sẽ không còn nói nhiều với các con nữa, vì kẻ cai trị thế gian đang đến. Hắn chẳng có gì nơi Ta.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể hiểu: “Hắn không có quyền gì trên Ta,” “không có chỗ đứng nơi Ta,” hoặc “không có căn cứ gì để chống lại Ta.” Nguyên văn viết sát nghĩa là: “hắn chẳng có gì trong Ta.”'
    reason: alternative_reading
lexical_decisions:
- source_word: οὐκέτι πολλὰ λαλήσω μεθ’ ὑμῶν
  choice: Ta sẽ không còn nói nhiều với các con nữa
  rationale: Diễn đạt tự nhiên ý thời gian của οὐκέτι, cách dùng trạng từ của πολλὰ và sự trò chuyện trực tiếp trong μεθ’ ὑμῶν. “Ta/các con” phù hợp quan hệ giữa Chúa Giê-su và các môn đồ trong văn cảnh.
- source_word: ἔρχεται
  choice: đang đến
  rationale: Thì hiện tại mang ý sắp xảy đến; “đang đến” giữ sắc thái cận kề.
- source_word: ὁ τοῦ κόσμου ἄρχων
  choice: kẻ cai trị thế gian
  rationale: “Kẻ cai trị” chuyển tải ἄρχων rõ ràng trong tiếng Việt hiện đại; không thêm “này” vì nguyên văn chỉ có κόσμου.
- source_word: καὶ ἐν ἐμοὶ οὐκ ἔχει οὐδέν
  choice: Hắn chẳng có gì nơi Ta
  rationale: 'Giữ cấu trúc cô đọng và sự mơ hồ có chủ ý của nguyên văn: kẻ ấy không có gì “trong/nơi” Chúa Giê-su, thay vì thu hẹp thành quyền lực, chỗ đứng hay căn cứ pháp lý.'
theological_decisions:
- issue: Danh tính của “kẻ cai trị thế gian”
  choice: Giữ nguyên tước hiệu, không thay bằng “Sa-tan”
  alternative: Dịch trực tiếp là “Sa-tan” hoặc giải thích là quyền lực sự ác
  rationale: Văn mạch Giăng hướng đến Sa-tan, nhưng câu Hy Lạp dùng tước hiệu; giữ tước hiệu bảo toàn cách diễn đạt và mức độ hàm ẩn của bản văn.
- issue: Ý nghĩa của “chẳng có gì nơi Ta”
  choice: Giữ lối nói ngắn gọn, tương đối sát nguyên văn
  alternative: “không có quyền gì trên Ta”, “không có chỗ đứng nơi Ta”, hoặc “không có lý do gì để cáo buộc Ta”
  rationale: Cụm Hy Lạp có thể gợi đến việc không có quyền, sự khống chế, căn cứ hay điểm tựa nơi Chúa Giê-su. Không chọn riêng một nghĩa giúp bảo toàn độ rộng thần học của câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “kẻ/hắn” để biểu thị nhân vật đối nghịch mà không đưa tên Sa-tan vào chính văn. Dấu chú thích [a] đặt ngay sau mệnh đề mà chú thích giải thích.
