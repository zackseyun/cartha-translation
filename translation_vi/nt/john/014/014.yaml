  source_fidelity: 'Bản dịch phản ánh đầy đủ văn bản SBLGNT: điều kiện ἐάν, phạm vi mở của τι, động từ αἰτήσητε, tân ngữ trực tiếp με, cụm ἐν τῷ ὀνόματί μου, chủ ngữ ἐγώ và lời hứa tương lai ποιήσω. Trật tự tiếng Việt “nhân danh Ta mà cầu xin Ta” vẫn giữ rõ cả việc lời cầu xin hướng đến Chúa Giê-su lẫn khuôn khổ “nhân danh Ta”.'
