  text: ἐάν τι αἰτήσητέ ⸀με ἐν τῷ ὀνόματί μου ⸀ἐγὼ ποιήσω.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/014.yaml
  text: If you ask me anything in my name[a], I will do it.
translation:
  language: vi
  text: Nếu các con nhân danh Ta mà cầu xin Ta bất cứ điều gì[a], Ta sẽ làm điều đó.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Một số thủ bản chép: “Nếu các con nhân danh Ta mà cầu xin bất cứ điều gì, Ta sẽ làm điều đó,” lược bỏ từ “Ta” sau “cầu xin.”'
    reason: textual_variant
lexical_decisions:
- source_word: ἐάν
  choice: Nếu
  rationale: Mở đầu một mệnh đề điều kiện; “nếu” là cách diễn đạt tự nhiên và chính xác trong tiếng Việt.
- source_word: τι
  choice: bất cứ điều gì
  rationale: Đại từ bất định trong mệnh đề điều kiện, diễn tả phạm vi rộng của điều được cầu xin.
- source_word: αἰτήσητέ
  choice: cầu xin
  rationale: Động từ ở thể chủ động, thức giả định, ngôi thứ hai số nhiều; trong ngữ cảnh hướng lời cầu xin đến Chúa Giê-su, “cầu xin” tự nhiên và giữ được sắc thái khẩn cầu.
- source_word: με
  choice: Ta
  rationale: Đại từ làm tân ngữ có mặt trong bản văn SBLGNT và được dịch rõ, không lược bỏ.
- source_word: ἐν τῷ ὀνόματί μου
  choice: nhân danh Ta
  rationale: Cách nói tiếng Việt quen thuộc, trang trọng và tự nhiên cho thành ngữ chỉ việc cầu xin trong mối liên hệ với danh, thẩm quyền và thân vị của Chúa Giê-su, nhưng không diễn giải quá mức.
- source_word: ἐγὼ
  choice: Ta
  rationale: Đại từ chủ ngữ được nêu rõ trong tiếng Hy Lạp; “Ta” giữ giọng nói trang trọng của Chúa Giê-su mà không thêm sắc thái nhấn mạnh như “chính Ta”.
- source_word: ποιήσω
  choice: sẽ làm điều đó
  rationale: Động từ tương lai ngôi thứ nhất số ít; “điều đó” quy chiếu tự nhiên về điều vừa được cầu xin.
theological_decisions:
- issue: Sự hiện diện của με (“Ta”) và ý nghĩa rằng lời cầu xin được trực tiếp hướng đến Chúa Giê-su
  choice: Dịch “cầu xin Ta” trong chính văn
  alternative: “Nếu các con nhân danh Ta mà cầu xin bất cứ điều gì, Ta sẽ làm điều đó”
  rationale: Bản văn SBLGNT được cung cấp có με, nên chính văn phải phản ánh đại từ này. Vì dị bản lược bỏ με ảnh hưởng đến việc người được trực tiếp cầu xin có được nêu rõ là Chúa Giê-su hay không, dị bản được ghi trong chú thích thay vì bị bỏ qua hoặc được dùng để thay thế chính văn.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Ta/các con” để thể hiện lời Chúa Giê-su nói trực tiếp với các môn đồ; cấu trúc được sắp xếp tự nhiên trong tiếng Việt, đồng thời giữ rõ cả “nhân danh Ta” và “cầu xin Ta”.
