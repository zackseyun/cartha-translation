  yaml_path: translation/nt/john/016/011.yaml
  text: and concerning judgment[c][b][a], because the ruler of this world has been judged.
translation:
  language: vi
  text: còn về sự phán xét, vì kẻ cai trị thế gian này[a][b] đã bị phán xét[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “kẻ thống trị thế gian này.”
    reason: lexical_alternative
  - marker: b
    text: Có lẽ chỉ Sa-tan; đối chiếu Giăng 12:31 và 14:30.
    reason: cross_reference
  - marker: c
    text: Cũng có thể dịch là “đã bị phán xét và vẫn ở trong tình trạng ấy.” Thì hoàn thành trong tiếng Hy Lạp nhấn mạnh sự phán xét đã xảy ra và kết quả vẫn còn hiệu lực.
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ δὲ κρίσεως
  choice: còn về sự phán xét
  rationale: περί với sở hữu cách nêu chủ đề; δέ nối với các vế trước trong chuỗi và được diễn đạt tự nhiên bằng “còn”; κρίσις được dịch trực tiếp là “sự phán xét”.
- source_word: ὅτι
  choice: vì
  rationale: Trong mệnh đề giải thích này, ὅτι mang ý nghĩa nguyên nhân, nêu lý do liên quan đến sự phán xét.
- source_word: ὁ ἄρχων
  choice: kẻ cai trị
  rationale: ἄρχων chỉ người nắm quyền hoặc thực thi quyền cai trị. “Kẻ cai trị” rõ nghĩa trong tiếng Việt hiện đại và không hàm ý tước vị hoàng gia như “vua chúa”.
- source_word: τοῦ κόσμου τούτου
  choice: thế gian này
  rationale: κόσμος trong Giăng thường chỉ thế gian hay trật tự thế gian chống nghịch Đức Chúa Trời; “thế gian này” vừa quen thuộc trong văn phong Kinh Thánh vừa sát cụm từ Hy Lạp.
- source_word: κέκριται
  choice: đã bị phán xét
  rationale: Đây là thể hoàn thành, bị động, trình bày một sự phán xét đã xảy ra và còn hiệu lực. Cách dịch này giữ thể bị động và không thu hẹp nghĩa thành “bị kết án”.
theological_decisions:
- issue: Danh tính và ý nghĩa của “kẻ cai trị thế gian này”
  choice: Giữ nguyên danh xưng trong chính văn, không trực tiếp thay bằng Sa-tan.
  alternative: Sa-tan, kẻ cai trị thế gian này
  rationale: Trong văn mạch sách Giăng, danh xưng này thường được hiểu là chỉ Sa-tan (đối chiếu Giăng 12:31; 14:30), nhưng câu này chỉ dùng danh xưng chứ không nêu tên. Giữ nguyên cách nói bảo toàn điều bản văn thực sự phát biểu.
- issue: Sắc thái của κέκριται
  choice: Dịch là “đã bị phán xét”.
  alternative: đã bị kết án; đang ở trong tình trạng bị kết án
  rationale: “Đã bị phán xét” giữ phạm vi nghĩa của κρίνω và lực của thì hoàn thành, không biến kết quả hàm ý trong văn mạch thành một nét nghĩa hẹp hơn ngay trong chính văn.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “còn về” để tiếp nối tự nhiên chuỗi “tội lỗi… sự công chính… sự phán xét”; dùng “kẻ cai trị” thay vì một tước hiệu cổ hoặc dễ gây hiểu lầm.
