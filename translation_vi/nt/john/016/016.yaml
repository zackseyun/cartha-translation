  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Μικρὸν καὶ ⸀οὐκέτι θεωρεῖτέ με, καὶ πάλιν μικρὸν καὶ ὄψεσθέ ⸀με.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/016.yaml
  text: A little while[a], and you no longer see me; and again a little while, and you will see me.
translation:
  language: vi
  text: “Ít lâu nữa, anh em sẽ không còn thấy tôi; rồi lại ít lâu nữa, anh em sẽ thấy tôi[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hy Lạp dùng hai động từ khác nhau cho “thấy”: θεωρέω ở vế đầu và ὁράω ở vế sau. Hai từ có thể gợi những sắc thái khác nhau, nhưng ở đây đều được dịch là “thấy” vì sự tương phản chính trong câu là về thời gian.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μικρὸν
  choice: ít lâu nữa
  rationale: Tính từ trung tính số ít được dùng theo lối trạng từ để chỉ một khoảng thời gian ngắn. Cách dịch này tự nhiên trong tiếng Việt và giữ được sự lặp lại cân xứng ở cả hai vế.
- source_word: οὐκέτι
  choice: không còn
  rationale: Diễn đạt tự nhiên ý một tình trạng sẽ chấm dứt kể từ thời điểm sắp tới.
- source_word: θεωρεῖτέ
  choice: thấy
  rationale: Trong ngữ cảnh này, động từ có thể mang sắc thái nhìn hoặc quan sát, nhưng dịch là “thấy” vừa rõ nghĩa vừa tránh nhấn mạnh quá mức một khác biệt không chắc chắn với ὁράω.
- source_word: πάλιν
  choice: rồi lại
  rationale: Giữ cả trình tự thời gian lẫn ý đảo ngược tình trạng trước đó, đồng thời nối hai vế một cách tự nhiên.
- source_word: ὄψεσθέ
  choice: sẽ thấy
  rationale: Thể tương lai của ὁράω tại đây chỉ việc thấy trong tương lai. Dùng cùng động từ tiếng Việt với θεωρέω bảo toàn tính song song mà không áp đặt một phân biệt thần học.
- source_word: με
  choice: tôi
  rationale: Đại từ tân ngữ chỉ Đức Giê-su. “Tôi” giữ trực tiếp ngôi thứ nhất của nguyên văn, không thay bằng một danh xưng quan hệ vốn không hiện diện trong câu Hy Lạp.
- source_word: καὶ
  choice: rồi; lại
  rationale: Các liên từ Hy Lạp tạo cấu trúc cân xứng. Trong tiếng Việt, “rồi lại” chuyển tải tự nhiên cả sự tiếp nối và sự tái diễn.
theological_decisions:
- issue: Có nên dùng hai động từ tiếng Việt khác nhau cho θεωρέω và ὁράω để gợi hai cách thấy khác nhau hay không
  choice: Dịch cả hai là “thấy” trong chính văn
  alternative: “không còn trông thấy tôi … sẽ thấy tôi” hoặc “không còn nhìn thấy tôi … sẽ gặp lại tôi”
  rationale: Hai động từ Hy Lạp có thể có sắc thái khác nhau, nhưng phạm vi nghĩa của chúng chồng lấn đáng kể trong văn chương Giăng. Dùng những từ khác nhau hoặc dịch vế sau là “gặp lại” có thể áp đặt một sự phân biệt mà câu này không nói rõ; trọng tâm hiển nhiên hơn là sự tương phản về thời gian.
- issue: Đối tượng của hai khoảng “ít lâu” và cách thức các môn đồ sẽ thấy Đức Giê-su trở lại
  choice: Giữ nguyên cách nói ngắn gọn và không xác định của nguyên văn
  alternative: Giải thích trực tiếp là cái chết và sự phục sinh, hoặc sự thăng thiên và tái lâm
  rationale: Câu Hy Lạp không nêu rõ các biến cố được ám chỉ. Bản dịch không nên giải quyết ngay trong chính văn một căng thẳng được triển khai trong ngữ cảnh rộng hơn.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh em” cho đại từ số nhiều chỉ các môn đồ và “tôi” để giữ trực tiếp ngôi thứ nhất của με, tránh đưa danh xưng “Thầy” vào nơi nguyên văn chỉ có đại từ. Giữ nguyên sự lặp lại “ít lâu nữa” nhằm phản ánh nhịp cân xứng của câu Hy Lạp.
