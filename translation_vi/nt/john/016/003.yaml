  text: καὶ ταῦτα ποιήσουσιν ὅτι οὐκ ἔγνωσαν τὸν πατέρα οὐδὲ ἐμέ.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/003.yaml
  text: And they will do these things because they have not known the Father or me[a].
translation:
  language: vi
  text: Họ sẽ làm những điều ấy vì họ không biết Cha, cũng không biết Ta.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “họ đã không biết Cha, cũng không biết Ta,” hoặc “họ chưa nhận biết Cha, cũng chưa nhận biết Ta.” Động từ Hy Lạp ở đây có thể được diễn đạt tự nhiên theo nhiều cách trong tiếng Việt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Họ sẽ
  rationale: Liên từ nối câu này với ngữ cảnh trước. Trong tiếng Việt, không nhất thiết phải dịch riêng bằng “và”; lược dịch giúp câu tự nhiên mà vẫn giữ mạch liên kết.
- source_word: ταῦτα
  choice: những điều ấy
  rationale: Giữ số nhiều và sự quy chiếu ngược về các hành động thù nghịch vừa được nói đến.
- source_word: ποιήσουσιν
  choice: sẽ làm
  rationale: Thể tương lai chủ động được chuyển trực tiếp, tự nhiên sang tiếng Việt.
- source_word: ὅτι
  choice: vì
  rationale: Ở đây liên từ nêu nguyên nhân của những hành động sắp xảy ra.
- source_word: οὐκ ἔγνωσαν
  choice: không biết
  rationale: Động từ aorist γινώσκω có thể nhấn mạnh việc không nhận biết hoặc chưa từng đi đến chỗ nhận biết. “Không biết” tự nhiên, trực tiếp và vẫn có thể mang sắc thái nhận biết mang tính tương giao trong văn mạch Giăng.
- source_word: τὸν πατέρα
  choice: Cha
  rationale: Đây là cách gọi Đức Chúa Trời trong tương quan với Con; viết hoa để biểu thị danh xưng ngôi vị.
- source_word: οὐδὲ ἐμέ
  choice: cũng không biết Ta
  rationale: Lặp lại động từ trong tiếng Việt làm rõ cấu trúc phủ định song song. “Ta” phù hợp với lời Đức Chúa Jêsus tự xưng trong văn phong Kinh Thánh trang trọng.
theological_decisions:
- issue: Ngôn ngữ về việc biết Cha và Đức Chúa Jêsus trong sách Giăng
  choice: không biết Cha, cũng không biết Ta
  alternative: chưa nhận biết Cha, cũng chưa nhận biết Ta
  rationale: Bản dịch giữ nguyên lời khẳng định rằng sự bắt bớ bắt nguồn từ việc không biết cả Cha lẫn Đức Chúa Jêsus, nhưng không diễn giải thêm bản chất thần học của sự nhận biết ấy. Chú thích bảo tồn khả năng hiểu động từ theo sắc thái “chưa đi đến chỗ nhận biết”.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Cha” như danh xưng chỉ Đức Chúa Trời và “Ta” cho lời Đức Chúa Jêsus tự xưng. Cấu trúc phủ định được lặp lại để câu rõ ràng, tự nhiên.
