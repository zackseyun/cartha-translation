  verdict: approve
  source_fidelity: 'Bản dịch truyền đạt đúng cấu trúc và ý nghĩa của câu Hy Lạp: hành động tương lai (“sẽ làm”), đối tượng số nhiều hồi chiếu (“những điều ấy”), quan hệ nguyên nhân (“vì”), và sự phủ định song song đối với cả Cha lẫn người đang nói. Việc không dịch riêng καὶ (“Và”) là tự nhiên trong tiếng Việt và không làm đứt mạch văn.'
  naturalness: “Họ sẽ làm những điều ấy vì họ không biết Cha, cũng không biết Ta” là câu tiếng Việt hiện đại, rõ ràng và trang trọng. Việc lặp “không biết” giúp thể hiện minh bạch cấu trúc οὐκ ... οὐδὲ của nguyên văn.
  terminology: “Cha” viết hoa phù hợp với cách dùng danh xưng trong văn mạch Giăng; “Ta” thích hợp với lời tự xưng trang trọng của Đức Chúa Jêsus trong bản dịch. “Biết” giữ được độ rộng nghĩa của γινώσκω mà không diễn giải thần học quá mức. Chú thích nêu hợp lý các khả năng sắc thái của aorist.
