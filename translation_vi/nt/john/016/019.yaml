reference: John 16:19
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸀ἔγνω Ἰησοῦς ὅτι ἤθελον αὐτὸν ἐρωτᾶν, καὶ εἶπεν αὐτοῖς· Περὶ τούτου ζητεῖτε μετ’ ἀλλήλων ὅτι εἶπον· Μικρὸν καὶ οὐ θεωρεῖτέ με, καὶ πάλιν μικρὸν καὶ ὄψεσθέ με;
base_translation:
  language: en
  yaml_path: translation/nt/john/016/019.yaml
  text: Jesus knew that they wanted to ask him[a], and he said to them, “Are you discussing this with one another, that I said, ‘A little while, and you no longer see me, and again a little while[c][b], and you will see me’?”
translation:
  language: vi
  text: 'Đức Giê-su biết họ muốn hỏi Ngài, và nói với họ: “Các con đang bàn với nhau về điều Thầy đã nói[a] phải không: ‘Chẳng bao lâu nữa, các con sẽ không còn thấy Thầy; rồi chẳng bao lâu nữa, các con sẽ thấy Thầy’?[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Các con đang bàn với nhau vì Thầy đã nói...” Từ Hy Lạp có thể dẫn nội dung đang được bàn luận hoặc nêu lý do của cuộc bàn luận.'
    reason: alternative_reading
  - marker: b
    text: 'Tiếng Hy Lạp dùng hai động từ khác nhau cho “thấy” ở đây: trước hết là θεωρέω, có thể mang nghĩa “trông thấy/quan sát”; sau đó là ὁράω, nghĩa là “thấy.” Chính văn dùng “thấy” cho cả hai để giữ sự tự nhiên và tính song song.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔγνω
  choice: biết
  rationale: Động từ ở thì aorist diễn tả việc Đức Giê-su nhận biết ý định của các môn đệ; “biết” tự nhiên và trực tiếp trong tiếng Việt.
- source_word: ἤθελον αὐτὸν ἐρωτᾶν
  choice: họ muốn hỏi mình
  rationale: Diễn đạt tự nhiên ý định đang có của các môn đệ; “hỏi” phù hợp với ngữ cảnh giao tiếp, không mang sắc thái đối chất.
- source_word: Περὶ τούτου ζητεῖτε μετ’ ἀλλήλων
  choice: Các con đang bàn với nhau về lời ... phải không
  rationale: Trong ngữ cảnh, ζητέω cùng μετ’ ἀλλήλων chỉ việc các môn đệ trao đổi để hiểu lời Đức Giê-su; “bàn với nhau” rõ ràng và tự nhiên.
- source_word: ὅτι εἶπον
  choice: về lời thầy đã nói
  rationale: Hiểu ὅτι là dẫn nội dung đang được bàn luận. Cách diễn đạt này chuyển tự nhiên sang tiếng Việt mà vẫn để ngỏ khả năng hiểu ὅτι theo nghĩa nguyên nhân trong chú thích.
- source_word: Μικρὸν
  choice: chẳng bao lâu nữa
  rationale: Μικρόν được dùng theo nghĩa một khoảng thời gian ngắn; cách nói này tự nhiên trong tiếng Việt và phù hợp với trình tự sắp xảy ra.
- source_word: οὐ θεωρεῖτέ με
  choice: các con sẽ không còn thấy thầy
  rationale: Ngữ cảnh thời gian cho thấy việc nhìn thấy sắp chấm dứt; “sẽ không còn thấy” diễn đạt rõ ý ấy trong tiếng Việt.
- source_word: πάλιν μικρὸν καὶ ὄψεσθέ με
  choice: rồi chẳng bao lâu nữa, các con sẽ thấy thầy
  rationale: Giữ trình tự và sự đối xứng của hai mệnh đề; “rồi” thể hiện πάλιν tự nhiên trong văn cảnh.
theological_decisions:
- issue: Sự khác nhau giữa θεωρέω và ὁράω trong hai mệnh đề song song
  choice: Dịch cả hai là “thấy” trong chính văn
  alternative: Phân biệt bằng “trông thấy/quan sát” và “thấy”
  rationale: Hai động từ có sắc thái từ vựng khác nhau, nhưng trọng tâm ở đây là sự vắng mặt tạm thời và việc được thấy lại. Dùng cùng từ “thấy” giữ được tính song song; sự khác biệt được ghi trong chú thích.
- issue: Chức năng của ὅτι sau câu hỏi
  choice: 'Hiểu là từ dẫn nội dung: “về lời thầy đã nói”'
  alternative: 'Hiểu theo nghĩa nguyên nhân: “vì thầy đã nói”'
  rationale: Cả hai cách phân tích đều khả hữu. Cấu trúc tiếp theo là lời trích dẫn trực tiếp nên cách dẫn nội dung phù hợp hơn trong chính văn, đồng thời chú thích bảo tồn cách hiểu nguyên nhân.
- issue: Lực của câu hỏi của Đức Giê-su
  choice: “Các con đang bàn ... phải không?”
  alternative: “Có phải đây là điều các con đang bàn với nhau không?”
  rationale: Giữ đây là một câu hỏi thật, với giọng dò hỏi, nhưng không thêm sắc thái trách móc hoặc giải thích thần học.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Giê-su”; trong lời nói trực tiếp dùng cặp xưng hô “thầy—các con,” phù hợp quan hệ giữa Đức Giê-su và các môn đệ. Các chú thích được đặt sau toàn bộ lời trích để không làm gián đoạn câu nói.
