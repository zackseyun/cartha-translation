id: JHN.16.32
reference: John 16:32
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἰδοὺ ἔρχεται ὥρα ⸀καὶ ἐλήλυθεν ἵνα σκορπισθῆτε ἕκαστος εἰς τὰ ἴδια κἀμὲ μόνον ἀφῆτε· καὶ οὐκ εἰμὶ μόνος, ὅτι ὁ πατὴρ μετ’ ἐμοῦ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/032.yaml
  text: Behold[a], an hour is coming, and has come, when you will be scattered, each to his own, and will leave me alone. Yet I am not alone, because the Father is with me.
translation:
  language: vi
  text: Kìa, giờ đang đến, và đã đến rồi, khi các con sẽ bị phân tán, mỗi người về với những gì thuộc riêng mình[a], và để Ta lại một mình. Nhưng Ta không ở một mình, vì Cha ở cùng Ta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “mỗi người về nhà mình”, “mỗi người về nơi riêng của mình”, hoặc “mỗi người về với phần việc riêng của mình”. Tiếng Hy Lạp không chỉ rõ một địa điểm mà có thể chỉ chung những gì thuộc về riêng mỗi người.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: Kìa
  rationale: Giữ chức năng thu hút sự chú ý và sắc thái trang trọng của lời báo trước, đồng thời vẫn tự nhiên trong tiếng Việt hiện đại.
- source_word: ἔρχεται ὥρα καὶ ἐλήλυθεν
  choice: giờ đang đến, và đã đến rồi
  rationale: 'Bảo toàn thế căng giữa hiện tại và hoàn thành trong nguyên văn: thời điểm quyết định vừa đang đến gần vừa đã hiện diện. Không thêm mạo từ xác định mà tiếng Hy Lạp không có.'
- source_word: ἵνα
  choice: khi
  rationale: Trong cấu trúc nói về giờ đang đến, từ này giới thiệu nội dung hay kết quả đặc trưng của giờ ấy; “khi” diễn đạt tự nhiên sắc thái thời gian trong tiếng Việt.
- source_word: σκορπισθῆτε
  choice: các con sẽ bị phân tán
  rationale: Giữ thể bị động và ý nghĩa các môn đồ bị tản ra, không chỉ tự nguyện chia tay.
- source_word: ἕκαστος εἰς τὰ ἴδια
  choice: mỗi người trở về nơi thuộc về mình
  rationale: “Nơi thuộc về mình” tránh giới hạn nghĩa thành “nhà”, nhưng vẫn diễn đạt tự nhiên hướng chuyển động của εἰς; chú thích bảo lưu phạm vi nghĩa rộng hơn của τὰ ἴδια.
- source_word: κἀμὲ μόνον ἀφῆτε
  choice: và để Ta lại một mình
  rationale: Diễn đạt trực tiếp việc các môn đồ rời bỏ Chúa Giê-su mà không tăng cường quá mức thành một thuật ngữ nặng hơn như “ruồng bỏ”.
- source_word: καὶ οὐκ εἰμὶ μόνος
  choice: Nhưng Ta không ở một mình
  rationale: “Nhưng” thể hiện sự tương phản tự nhiên giữa việc các môn đồ để Ngài lại một mình và thực tại Cha ở cùng Ngài.
- source_word: ὅτι ὁ πατὴρ μετ’ ἐμοῦ ἐστιν
  choice: vì Cha ở cùng Ta
  rationale: Giữ rõ quan hệ nguyên nhân và danh xưng quan hệ “Cha”, không bổ sung kết luận thần học ngoài câu.
theological_decisions:
- issue: Phạm vi nghĩa của ἕκαστος εἰς τὰ ἴδια
  choice: mỗi người trở về nơi thuộc về mình[a]
  alternative: mỗi người về nhà mình
  rationale: Không thu hẹp τὰ ἴδια vào một địa điểm cụ thể; cách dịch chính dễ hiểu, còn chú thích bảo lưu khả năng chỉ nơi chốn, nhà cửa, tài sản hoặc những gì thuộc riêng về từng người.
- issue: Quan hệ giữa việc các môn đồ rời bỏ và sự hiện diện của Cha
  choice: Nhưng Ta không ở một mình, vì Cha ở cùng Ta
  alternative: Và Ta không ở một mình, bởi Cha ở cùng Ta
  rationale: 'Giữ nguyên sức căng của câu: Chúa Giê-su thực sự bị các môn đồ để lại một mình, nhưng không hoàn toàn cô độc vì Cha ở cùng Ngài; không suy diễn sang những kết luận tín lý khác.'
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “các con—Ta—Cha” để thể hiện lời Chúa Giê-su nói trực tiếp với các môn đồ và quan hệ với Cha; “Kìa” giữ sắc thái hướng sự chú ý mà không quá cổ.
