  source_fidelity: 'Bản dịch nhìn chung phản ánh đúng cấu trúc và ý nghĩa của nguyên văn: thời điểm vừa đang đến vừa đã đến, các môn đồ bị phân tán, việc họ để Chúa Giê-su lại, và sự hiện diện của Cha. Tuy nhiên, “trở về nơi thuộc về mình” thêm sắc thái “trở về” không có trong εἰς τὰ ἴδια, đồng thời giới hạn cụm từ này vào một “nơi” cụ thể, trong khi tiếng Hy Lạp có phạm vi rộng hơn.'
