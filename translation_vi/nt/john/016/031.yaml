  text: Jesus answered them[a], “Do you now believe?”
translation:
  language: vi
  text: 'Giê-su trả lời họ: “Bây giờ anh em tin sao?[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Bây giờ anh em tin.” Tiếng Hy Lạp có thể được hiểu là một câu khẳng định, dù ngữ cảnh nghiêng về một câu hỏi mang tính chất vấn.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: đáp lời
  rationale: Động từ trần thuật ở thì aorist của ἀποκρίνομαι; “đáp lời” tự nhiên trong văn đối thoại và không thêm sắc thái ngoài nguyên văn.
- source_word: αὐτοῖς
  choice: họ
  rationale: Đại từ số nhiều ở cách tặng, chỉ đối tượng được Đức Chúa Jêsus đáp lời; tiếng Việt diễn đạt tự nhiên là “đáp lời họ”.
- source_word: Ἰησοῦς
  choice: Đức Chúa Jêsus
  rationale: Dùng hình thức tên gọi quen thuộc và trang trọng trong tiếng Việt.
- source_word: Ἄρτι
  choice: bây giờ
  rationale: Giữ ý nghĩa thời điểm hiện tại, trực tiếp của ἄρτι và phù hợp với sắc thái nhấn mạnh trong lời hỏi.
- source_word: πιστεύετε
  choice: các con tin
  rationale: πιστεύετε là hiện tại chủ động, ngôi thứ hai số nhiều; “các con tin” diễn đạt rõ chủ thể số nhiều và phù hợp quan hệ của Đức Chúa Jêsus với các môn đồ trong ngữ cảnh.
theological_decisions:
- issue: Lực ngôn trung của Ἄρτι πιστεύετε;
  choice: 'Dịch thành câu hỏi có tính chất chất vấn: “Bây giờ các con tin sao?”'
  alternative: “Bây giờ các con tin.”
  rationale: Tiếng Hy Lạp có thể được đọc là câu hỏi hoặc câu khẳng định tùy dấu câu. Ngữ cảnh ngay sau đó, khi các môn đồ sắp bị tan tác, nghiêng về câu hỏi mang sắc thái chất vấn; chú thích vẫn bảo lưu khả năng đọc như lời khẳng định.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Cụm “tin sao?” giữ được sắc thái câu hỏi ngắn, trực diện và không biến ἄρτι thành “cuối cùng” hay “mãi đến bây giờ,” là những cách có thể diễn giải quá mức.
