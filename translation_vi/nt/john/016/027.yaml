revisions:
- from: Vì chính Cha yêu thương anh em, bởi anh em đã yêu mến tôi và tin rằng tôi từ Đức Chúa Trời mà đến.[a]
  to: Vì chính Cha yêu thương anh em, vì anh em đã yêu mến tôi và đã tin rằng tôi từ Đức Chúa Trời mà đến.[a]
  rationale: Bổ sung “đã” trước “tin” để phản ánh thể hoàn thành của πεπιστεύκατε song song với πεφιλήκατε. Chỉnh chú thích để loại bỏ đại từ mơ hồ, đồng thời vẫn bảo tồn khả năng diễn giải từ vựng của παρὰ τοῦ θεοῦ ἐξῆλθον mà không mở rộng thành diễn giải tín lý.
