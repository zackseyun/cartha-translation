source:
  edition: SBLGNT
  text: αὐτὸς γὰρ ὁ πατὴρ φιλεῖ ὑμᾶς, ὅτι ὑμεῖς ἐμὲ πεφιλήκατε καὶ πεπιστεύκατε ὅτι ἐγὼ παρὰ τοῦ ⸀θεοῦ ἐξῆλθον.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/027.yaml
  text: For the Father himself loves you[a], because you have loved me and have believed that I came from God.
translation:
  language: vi
  text: Vì chính Cha yêu thương anh em, vì anh em đã yêu mến tôi và đã tin rằng tôi từ Đức Chúa Trời mà đến.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “tôi ra từ Đức Chúa Trời”; tiếng Hy Lạp cũng có thể gợi ý rằng Chúa Giê-su đến từ sự hiện diện của Đức Chúa Trời.'
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτὸς γὰρ ὁ πατὴρ
  choice: Vì chính Cha
  rationale: “Chính” giữ sắc thái nhấn mạnh của αὐτός; “Vì” nối câu này như lời giải thích cho ý trước đó. “Cha” là cách xưng gọi Đức Chúa Trời trong văn mạch Giăng.
- source_word: φιλεῖ ὑμᾶς
  choice: yêu thương anh em
  rationale: φιλέω diễn tả tình yêu và sự trìu mến có tính cá nhân. “Yêu thương” tự nhiên, trang trọng, và phù hợp khi nói về tình yêu của Cha; “anh em” chỉ tập thể các môn đồ.
- source_word: ὅτι ὑμεῖς ἐμὲ πεφιλήκατε
  choice: bởi anh em đã yêu mến tôi
  rationale: ὅτι mang nghĩa nguyên nhân; thể hoàn thành của πεφιλήκατε được diễn đạt bằng “đã yêu mến”, chỉ tình yêu đã hình thành và vẫn có giá trị hiện tại. “Yêu mến” tự nhiên khi nói về tình yêu của các môn đồ dành cho Chúa Giê-su.
- source_word: καὶ πεπιστεύκατε
  choice: và tin rằng
  rationale: Thể hoàn thành cho thấy niềm tin đã được xác lập và còn tiếp diễn; tiếng Việt không cần lặp “đã” trước động từ phối hợp. Mệnh đề theo sau là nội dung được tin.
- source_word: παρὰ τοῦ θεοῦ ἐξῆλθον
  choice: tôi từ Đức Chúa Trời mà đến
  rationale: παρά với sở thuộc cách chỉ nguồn gốc hoặc nơi xuất phát, còn ἐξέρχομαι là đi ra/đến từ. Cấu trúc “từ… mà đến” giữ được ngôn ngữ về nguồn gốc và sứ mạng mà không thêm diễn giải tín lý.
theological_decisions:
- issue: Sắc thái Cơ Đốc học của παρὰ τοῦ θεοῦ ἐξῆλθον
  choice: tôi từ Đức Chúa Trời mà đến
  alternative: tôi ra từ Đức Chúa Trời; tôi từ nơi Đức Chúa Trời hiện diện mà đến
  rationale: Bản dịch khẳng định nguồn gốc và việc Chúa Giê-su đến từ Đức Chúa Trời, nhưng không mở rộng thành một công thức tín lý. Chú thích bảo tồn khả năng câu Hy Lạp gợi đến việc đến từ sự hiện diện của Đức Chúa Trời.
- issue: Quan hệ nguyên nhân trong lời Cha yêu các môn đồ
  choice: bởi anh em đã yêu mến tôi và tin rằng…
  alternative: vì anh em yêu mến tôi và tin rằng…
  rationale: Giữ rõ ὅτι là mệnh đề nêu lý do trong chính lời nói của Chúa Giê-su, không làm nhẹ hoặc tái diễn giải sự căng thẳng thần học của phát biểu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” cho số nhiều ὑμᾶς/ὑμεῖς trong lời Chúa Giê-su nói với các môn đồ; dùng “tôi” theo lối kể trực tiếp tự nhiên. Phân biệt nhẹ “yêu thương” (Cha đối với môn đồ) và “yêu mến” (môn đồ đối với Chúa Giê-su) để tiếng Việt tự nhiên, nhưng không chủ ý dựng nên khác biệt thần học giữa hai lần dùng cùng động từ φιλέω.
