reference: John 16:22
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ὑμεῖς οὖν ⸂νῦν μὲν λύπην⸃ ἔχετε· πάλιν δὲ ὄψομαι ὑμᾶς, καὶ χαρήσεται ὑμῶν ἡ καρδία, καὶ τὴν χαρὰν ὑμῶν οὐδεὶς ⸀αἴρει ἀφ’ ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/022.yaml
  text: So you also now have sorrow; but I will see you again[a], and your heart will rejoice, and no one will take your joy from you.
translation:
  language: vi
  text: Vậy, bây giờ anh em cũng buồn rầu; nhưng Ta sẽ lại thấy anh em, lòng anh em sẽ vui mừng, và sẽ không ai lấy mất niềm vui của anh em.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὖν
  choice: Vậy
  rationale: Nối lời áp dụng này với hình ảnh người phụ nữ sinh con ở câu trước, đồng thời diễn đạt tự nhiên trong tiếng Việt.
- source_word: νῦν μὲν λύπην ἔχετε
  choice: bây giờ anh em cũng buồn rầu
  rationale: Diễn đạt tình trạng đau buồn hiện tại; μέν được thể hiện qua thế đối lập với “nhưng” ở vế sau, còn “cũng” tương ứng với καὶ ὑμεῖς.
- source_word: πάλιν δὲ
  choice: nhưng ... lại
  rationale: “Nhưng” giữ sự tương phản giữa nỗi buồn hiện tại và cuộc gặp lại, còn “lại” diễn đạt πάλιν.
- source_word: ὄψομαι ὑμᾶς
  choice: Ta sẽ lại gặp anh em
  rationale: Giữ đúng chủ thể ngôi thứ nhất và đối tượng ngôi thứ hai của nguyên văn. “Gặp” tự nhiên hơn “thấy” trong tiếng Việt khi nói về sự tái ngộ, nhưng vẫn không đảo chủ thể như cách dịch “anh em sẽ gặp Ta”.
- source_word: χαρήσεται ὑμῶν ἡ καρδία
  choice: lòng anh em sẽ vui mừng
  rationale: “Lòng” là cách diễn đạt tự nhiên cho καρδία trong ngữ cảnh cảm xúc, và “vui mừng” giữ lực động từ của χαρήσεται.
- source_word: τὴν χαρὰν ὑμῶν
  choice: niềm vui ấy
  rationale: “Niềm vui” diễn đạt trực tiếp χαρά; từ “ấy” quy chiếu tự nhiên về niềm vui vừa được nói đến và tránh lặp nặng nề đại từ sở hữu.
- source_word: οὐδεὶς αἴρει ἀφ’ ὑμῶν
  choice: không ai lấy mất ... khỏi anh em
  rationale: “Lấy mất” diễn đạt rõ ý tước đi; dùng tương lai theo hướng thời gian của toàn câu dù động từ Hy Lạp ở thì hiện tại.
theological_decisions:
- issue: Chủ thể và điểm nhấn của cuộc tái ngộ
  choice: Ta sẽ lại gặp anh em
  alternative: anh em sẽ lại gặp Ta
  rationale: Nguyên văn Hy Lạp đặt Chúa Giê-su làm chủ thể ngôi thứ nhất của ὄψομαι và các môn đồ làm đối tượng. Bản dịch giữ cấu trúc ấy, không đồng hóa với cách nói ở Giăng 16:16, qua đó bảo toàn sắc thái Chúa Giê-su chủ động đến với họ.
- issue: Phạm vi lời hứa rằng niềm vui không bị lấy mất
  choice: không ai lấy mất niềm vui ấy khỏi anh em
  alternative: không ai có thể lấy mất niềm vui ấy khỏi anh em
  rationale: Không thêm ý khả năng “có thể,” vì nguyên văn khẳng định hành động không xảy ra chứ không trực tiếp dùng động từ chỉ khả năng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ta—anh em” phù hợp lời Chúa Giê-su nói trực tiếp với các môn đồ; giữ dấu chấm phẩy để làm rõ sự chuyển đổi từ buồn rầu sang vui mừng.
