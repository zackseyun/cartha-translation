- from: Vậy, bây giờ anh em cũng buồn rầu; nhưng Ta sẽ lại gặp anh em[a], lòng anh em sẽ vui mừng, và không ai lấy mất niềm vui ấy khỏi anh em.
  to: Vậy, bây giờ anh em cũng buồn rầu; nhưng Ta sẽ lại thấy anh em, lòng anh em sẽ vui mừng, và sẽ không ai lấy mất niềm vui của anh em.
