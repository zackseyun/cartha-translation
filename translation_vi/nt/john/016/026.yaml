id: JHN.16.26
reference: John 16:26
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐν ἐκείνῃ τῇ ἡμέρᾳ ἐν τῷ ὀνόματί μου αἰτήσεσθε, καὶ οὐ λέγω ὑμῖν ὅτι ἐγὼ ἐρωτήσω τὸν πατέρα περὶ ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/john/016/026.yaml
  text: On that day you will ask in my name[a], and I do not say to you that I will ask the Father concerning you[c][b];
translation:
  language: vi
  text: Vào ngày ấy, anh em sẽ cầu xin nhân danh tôi, và tôi không nói với anh em rằng tôi sẽ cầu xin Cha về anh em[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “cho anh em” hoặc “thay cho anh em.”'
    reason: περὶ ὑμῶν có thể chỉ điều liên quan đến họ hoặc mang sắc thái vì lợi ích, thay mặt họ.
  - marker: b
    text: 'Trong tiếng Hy Lạp, câu này dùng hai động từ khác nhau cho “cầu xin”: αἰτέω chỉ lời cầu xin của các môn đồ, còn ἐρωτάω chỉ việc Chúa Giê-su cầu xin Cha.'
    reason: Bản dịch tiếng Việt dùng cùng một cụm từ tự nhiên ở cả hai chỗ, nên chú thích bảo tồn sự khác biệt từ vựng trong nguyên văn.
lexical_decisions:
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: Trong ngày ấy
  rationale: Diễn đạt tự nhiên ý nghĩa thời gian, đồng thời giữ giới từ ἐν và sắc thái chỉ định của ἐκείνῃ.
- source_word: ἐν τῷ ὀνόματί μου
  choice: nhân danh tôi
  rationale: Thành ngữ tiếng Việt tự nhiên, trang trọng, giữ được mối liên hệ với chính con người và thẩm quyền của Chúa Giê-su mà không diễn giải quá mức.
- source_word: αἰτήσεσθε
  choice: anh em sẽ cầu xin
  rationale: Động từ ở thì tương lai, ngôi thứ hai số nhiều; trong ngữ cảnh cầu nguyện, “cầu xin” tự nhiên hơn “hỏi” và diễn đạt hành vi đưa ra lời thỉnh cầu.
- source_word: οὐ λέγω ὑμῖν
  choice: tôi không nói với anh em
  rationale: Giữ trực tiếp thì hiện tại và cấu trúc phủ định của nguyên văn bằng lối diễn đạt tiếng Việt rõ ràng, trang trọng.
- source_word: ὅτι
  choice: rằng
  rationale: Ở đây ὅτι dẫn nội dung của điều Chúa Giê-su không nói, chứ không mang nghĩa nguyên nhân.
- source_word: ἐρωτήσω
  choice: tôi sẽ cầu xin
  rationale: Trong quan hệ với Cha, “cầu xin” là cách diễn đạt tự nhiên. Chú thích ghi nhận rằng nguyên văn dùng một động từ khác với αἰτέω ở đầu câu.
- source_word: τὸν πατέρα
  choice: Cha
  rationale: Danh xưng “Cha” với chữ hoa phù hợp văn phong Kinh Thánh tiếng Việt; không thêm đại từ sở hữu vì nguyên văn không có.
- source_word: περὶ ὑμῶν
  choice: về anh em
  rationale: Bám sát nghĩa rộng của περί với sở hữu cách là “về/liên quan đến”, không tự động thu hẹp thành ý cầu thay dù ngữ cảnh có thể hàm ý “cho anh em” hoặc “thay cho anh em”.
theological_decisions:
- issue: Liệu câu này phủ nhận mọi vai trò cầu thay trong tương lai của Chúa Giê-su, hay chỉ nói điều Ngài không khẳng định trong ngữ cảnh này
  choice: Giữ nguyên cấu trúc “tôi không nói... rằng tôi sẽ cầu xin Cha” mà không thêm lời giải thích thần học.
  alternative: Diễn giải mạnh rằng Chúa Giê-su hoàn toàn không cầu thay, hoặc rằng các môn đồ đến với Cha mà không cần bất cứ sự trung gian nào.
  rationale: Ngữ cảnh nhấn mạnh việc các môn đồ trực tiếp cầu xin nhân danh Chúa Giê-su, nhưng câu này tự nó không giải quyết toàn bộ vấn đề về sự cầu thay của Ngài. Bản dịch cần bảo toàn sự căng thẳng thần học thay vì quyết định thay cho người đọc.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “anh em” cho ngôi thứ hai số nhiều trong lời Chúa Giê-su nói với các môn đồ; dùng “nhân danh” để giữ thành ngữ thần học quen thuộc mà không mở rộng thành một lời diễn giải. Dấu chấm kết câu phù hợp quy ước xuất bản tiếng Việt.
