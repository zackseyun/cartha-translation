  text: concerning sin[a], because they do not believe in me;
translation:
  language: vi
  text: về tội[a], vì họ không tin tôi;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “về tội, rằng họ không tin tôi.” Liên từ Hy Lạp có thể được hiểu theo cả hai cách, nhưng “vì” thể hiện rõ hơn ý giải thích trong ngữ cảnh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ
  choice: về
  rationale: Giới từ với sở hữu cách nêu chủ đề mà Đức Thánh Linh sẽ cáo trách; “về” tự nhiên trong tiếng Việt và giữ được cấu trúc song song với các câu 10–11.
- source_word: ἁμαρτίας
  choice: tội lỗi
  rationale: Danh từ số ít mang nghĩa khái quát, chỉ phạm trù tội lỗi chứ không liệt kê các tội riêng lẻ.
- source_word: μέν
  choice: không dịch thành từ riêng
  rationale: μέν đánh dấu mục đầu tiên trong chuỗi ở các câu 9–11. Tiếng Việt không cần một từ tương ứng; chức năng diễn ngôn được giữ bằng cấu trúc song song.
- source_word: ὅτι
  choice: vì
  rationale: Trong ngữ cảnh, liên từ giải thích căn cứ của cụm “về tội lỗi”; “vì” thể hiện sức nặng nguyên nhân, đồng thời chú thích bảo lưu khả năng hiểu là “rằng”.
- source_word: οὐ πιστεύουσιν
  choice: họ không tin
  rationale: Thì hiện tại chủ động trình bày thực trạng không tin; “không tin” là cách diễn đạt tự nhiên và trực tiếp.
- source_word: εἰς ἐμέ
  choice: nơi tôi
  rationale: Cấu trúc πιστεύω εἰς diễn tả đức tin hay sự tin cậy hướng đến Chúa Giê-su. “Tin nơi tôi” vừa tự nhiên vừa giữ sắc thái quy hướng về một ngôi vị.
theological_decisions:
- issue: Bản chất của tội lỗi được xác định trong câu
  choice: Câu này nêu việc không tin Chúa Giê-su là biểu hiện mang tính quyết định của “tội lỗi” trong ngữ cảnh này.
  alternative: Câu này nói chung về tình trạng tội lỗi của con người, còn sự không tin chỉ là một ví dụ.
  rationale: Mệnh đề do ὅτι dẫn vào trực tiếp giải thích hoặc nêu căn cứ cho “về tội lỗi”. Bản dịch giữ mối liên hệ ấy mà không mở rộng thành một công thức giáo lý vượt quá lời văn.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “về” để duy trì nhịp song song của đoạn; dùng “tin nơi tôi” nhằm diễn đạt tự nhiên chiều hướng quy về một ngôi vị của πιστεύω εἰς.
