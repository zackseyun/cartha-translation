revisions:
- from: Ta còn nhiều điều muốn nói với các con, nhưng hiện giờ các con chưa thể chịu nổi.[a]
  to: Ta còn nhiều điều cần nói với các con, nhưng hiện giờ các con chưa thể chịu nổi.[a]
  rationale: Chỉ thay “muốn nói” bằng “cần nói” để tránh thêm sắc thái ý muốn và phản ánh chính xác hơn thành ngữ ἔχω + nguyên mẫu. Giữ nguyên cách xưng hô, thì hiện tại của “hiện giờ,” và “chịu nổi” cùng chú thích từ vựng, vì chúng đều phù hợp với văn bản nguồn và tiếng Việt hiện đại.
