base_translation:
  language: en
  yaml_path: translation/nt/john/016/012.yaml
  text: I still have many things to say to you[a], but you are not able to bear them now.
translation:
  language: vi
  text: Ta còn nhiều điều cần nói với các con, nhưng hiện giờ các con chưa thể chịu nổi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “nhưng hiện giờ các con chưa thể mang nổi những điều ấy” hoặc “chưa thể chịu đựng những điều ấy.” Động từ Hy Lạp có thể mang nghĩa mang, gánh chịu hoặc chịu đựng.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔτι πολλὰ ἔχω
  choice: Ta còn nhiều điều
  rationale: Diễn đạt tự nhiên ý Chúa Giê-su vẫn còn nhiều điều cần nói; πολλὰ là tính từ trung tính số nhiều được dùng như danh từ, nên dịch là “nhiều điều”.
- source_word: ὑμῖν λέγειν
  choice: muốn nói với các con
  rationale: Cấu trúc ἔχω + động từ nguyên mẫu nói đến điều còn phải hoặc còn muốn làm. “Nói với các con” phản ánh trực tiếp λέγειν và tặng cách ὑμῖν; “muốn” giúp câu tiếng Việt tự nhiên mà không biến ý thành một mệnh lệnh bắt buộc.
- source_word: ἀλλ’ οὐ δύνασθε
  choice: nhưng ... các con chưa thể
  rationale: “Chưa thể” diễn đạt sự bất lực ở thời điểm hiện tại, phù hợp với ἄρτι và hàm ý hoàn cảnh này sẽ thay đổi trong mạch văn tiếp theo.
- source_word: βαστάζειν
  choice: chịu nổi
  rationale: Giữ được ý nghĩa ẩn dụ về khả năng mang, chịu đựng hoặc tiếp nhận sức nặng của những điều sắp được nói, đồng thời là cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: ἄρτι
  choice: hiện giờ
  rationale: Chỉ thời điểm hiện tại, tương phản với điều sẽ xảy ra sau đó trong các câu kế tiếp.
theological_decisions:
- issue: Ý nghĩa của βαστάζειν đối với sự bất lực hiện tại của các môn đồ
  choice: Các môn đồ hiện chưa thể chịu hoặc tiếp nhận sức nặng của những lời dạy thêm.
  alternative: Các môn đồ hiện chưa thể hiểu đầy đủ, hoặc chưa thể chịu đựng khi nghe những điều ấy.
  rationale: βαστάζειν có thể bao gồm cả khả năng tiếp nhận về nhận thức lẫn khả năng chịu đựng về tinh thần. “Chịu nổi” bảo tồn độ căng và tính đa nghĩa này thay vì thu hẹp thành chỉ “hiểu” hoặc chỉ “chịu đựng”.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Ta” cho lời Chúa Giê-su và “các con” cho số nhiều ὑμῖν, thể hiện quan hệ thầy–trò thân thiết trong diễn ngôn chia tay. Dấu chú thích [a] được đặt ngay sau mệnh đề liên quan.
