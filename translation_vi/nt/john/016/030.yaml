id: JHN.16.30
reference: John 16:30
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: νῦν οἴδαμεν ὅτι οἶδας πάντα καὶ οὐ χρείαν ἔχεις ἵνα τίς σε ἐρωτᾷ· ἐν τούτῳ πιστεύομεν ὅτι ἀπὸ θεοῦ ἐξῆλθες.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/030.yaml
  text: Now we know that you know all things and have no need that anyone should question you[a]. By this we believe that you came from God.
translation:
  language: vi
  text: Bây giờ chúng con biết Thầy biết mọi sự và không cần ai hỏi Thầy[a]. Nhờ điều này, chúng con tin rằng Thầy đến từ Đức Chúa Trời.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “không cần ai chất vấn Thầy.” Động từ Hy Lạp có thể mang nghĩa “hỏi” hoặc “chất vấn”; ở đây ngữ cảnh nói đến sự hiểu biết của Thầy về những điều các môn đồ muốn hỏi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: νῦν οἴδαμεν
  choice: Bây giờ chúng con biết
  rationale: Diễn đạt tự nhiên ý nhận biết ở hiện tại; dùng “chúng con” phù hợp khi các môn đồ thưa với Đức Chúa Jêsus.
- source_word: οἶδας πάντα
  choice: Thầy biết mọi sự
  rationale: Giữ nguyên phạm vi bao quát của πάντα mà không diễn giải thêm thành một công thức thần học.
- source_word: οὐ χρείαν ἔχεις ἵνα τίς σε ἐρωτᾷ
  choice: không cần ai hỏi Thầy
  rationale: Cách nói gọn, tự nhiên trong tiếng Việt; ἐρωτάω có thể chỉ việc hỏi hoặc chất vấn, và ngữ cảnh nhấn mạnh rằng Đức Chúa Jêsus biết cả điều người ta chưa nói ra.
- source_word: ἐν τούτῳ
  choice: Nhờ điều này
  rationale: Biểu đạt điều vừa nêu như cơ sở khiến các môn đồ đi đến lời tuyên xưng.
- source_word: πιστεύομεν
  choice: chúng con tin
  rationale: “Tin” là cách dịch trực tiếp, tự nhiên trong lời tuyên xưng này.
- source_word: ἀπὸ θεοῦ ἐξῆλθες
  choice: Thầy đến từ Đức Chúa Trời
  rationale: Phản ánh trực tiếp nguồn gốc và sứ mạng được nói đến, không đổi “Đức Chúa Trời” thành “Đức Chúa Cha” hay thêm ý không có trong câu.
theological_decisions:
- issue: Sức nặng Cơ Đốc luận của οἶδας πάντα
  choice: Giữ nguyên lời tuyên bố “Thầy biết mọi sự”
  alternative: Diễn giải rõ thành “Thầy là Đấng toàn tri”
  rationale: Bản văn ghi lời xác nhận của các môn đồ về sự hiểu biết của Đức Chúa Jêsus; không nên biến lời ấy thành một công thức thần học được mở rộng.
- issue: Ý nghĩa của ἀπὸ θεοῦ ἐξῆλθες
  choice: Thầy đến từ Đức Chúa Trời
  alternative: Thầy đến từ Đức Chúa Cha
  rationale: Cách dịch trực tiếp giữ được lời khẳng định về nguồn gốc và sứ mạng từ Đức Chúa Trời mà không đồng nhất hóa từ ngữ với ngữ cảnh lân cận.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “Thầy—chúng con” thể hiện quan hệ giữa Đức Chúa Jêsus và các môn đồ trong lời đối thoại, không thêm tước hiệu vào nguyên văn.
