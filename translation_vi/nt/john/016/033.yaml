revisions:
- from: Ta đã nói với các con những điều này để trong Ta, các con được bình an. Trong thế gian, các con gặp hoạn nạn[a]. Nhưng hãy vững lòng[b]; Ta đã thắng thế gian.
  to: Ta đã nói với các con những điều này để trong Ta, các con có bình an. Trong thế gian, các con gặp hoạn nạn[a]. Nhưng hãy vững lòng[b]; Ta đã thắng thế gian.
  rationale: Chỉ thay “được bình an” bằng “có bình an” để dịch sát hơn εἰρήνην ἔχητε, đồng thời vẫn giữ cấu trúc và sắc thái đối chiếu quan trọng “trong Ta / trong thế gian”. Các phần còn lại, kể cả dấu chú thích và nội dung chú thích, không cần thay đổi.
