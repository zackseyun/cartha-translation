id: JHN.16.33
reference: John 16:33
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ταῦτα λελάληκα ὑμῖν ἵνα ἐν ἐμοὶ εἰρήνην ἔχητε· ἐν τῷ κόσμῳ θλῖψιν ἔχετε, ἀλλὰ θαρσεῖτε, ἐγὼ νενίκηκα τὸν κόσμον.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/033.yaml
  text: I have spoken these things to you so that in me you may have peace[a]. In the world you have tribulation, but take courage[b]; I have overcome the world.
translation:
  language: vi
  text: Ta đã nói với các con những điều này để trong Ta, các con có bình an. Trong thế gian, các con gặp hoạn nạn[a]. Nhưng hãy vững lòng[b]; Ta đã thắng thế gian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Hoạn nạn” cũng có thể dịch là “khốn khó”, “đau khổ” hoặc “cảnh ngặt nghèo”.
    reason: lexical_alternative
  - marker: b
    text: Hay “hãy can đảm”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα
  choice: những điều này
  rationale: Giữ số nhiều của đại từ chỉ định và quy chiếu tự nhiên về những lời Đức Chúa Jêsus vừa phán.
- source_word: λελάληκα
  choice: Ta đã nói
  rationale: Cấu trúc “đã nói” diễn đạt hành động đã hoàn tất nhưng vẫn có ý nghĩa hiện tại, đồng thời tự nhiên trong tiếng Việt hiện đại.
- source_word: ἵνα
  choice: để
  rationale: Diễn đạt rõ quan hệ mục đích mà không làm câu nặng nề.
- source_word: ἐν ἐμοὶ
  choice: trong Ta
  rationale: Giữ nguyên ngôn ngữ đặc trưng của Giăng về việc ở trong Đức Chúa Jêsus, không diễn giải thành “nhờ Ta” hay “hiệp một với Ta”.
- source_word: εἰρήνην ἔχητε
  choice: các con được bình an
  rationale: Diễn đạt tự nhiên ý sở hữu hay kinh nghiệm sự bình an; “được” ở đây không xác định thêm tác nhân.
- source_word: ἐν τῷ κόσμῳ
  choice: Trong thế gian
  rationale: Giữ cách gọi nhất quán và giàu sắc thái của Giăng, không thu hẹp thành “hệ thống thế gian” hay thêm tính từ diễn giải.
- source_word: θλῖψιν ἔχετε
  choice: các con gặp hoạn nạn
  rationale: “Hoạn nạn” giữ được sức nặng của θλῖψις; động từ hiện tại được diễn đạt bằng câu hiện tại tự nhiên, không đổi thành lời tiên báo “sẽ gặp”.
- source_word: θαρσεῖτε
  choice: hãy vững lòng
  rationale: Mệnh lệnh kêu gọi sự can đảm và tin tưởng giữa hoạn nạn; cách nói này tự nhiên, trang trọng và không quá thiên về dũng khí thể chất.
- source_word: νενίκηκα
  choice: Ta đã thắng
  rationale: “Đã thắng” diễn đạt chiến thắng đã hoàn tất và đang còn hiệu lực, đồng thời tránh tăng thêm sắc thái quân sự của “chinh phục”.
theological_decisions:
- issue: Ý nghĩa của κόσμος trong văn mạch Giăng
  choice: Dịch cả hai lần là “thế gian”.
  alternative: hệ thống thế gian; thế gian sa ngã này
  rationale: “Thế gian” duy trì sự đối chiếu giữa bình an “trong Ta” và hoạn nạn “trong thế gian”, đồng thời không khóa nghĩa đa diện của κόσμος vào một cách giải thích riêng.
- issue: Giá trị của hai động từ thì hoàn thành λελάληκα và νενίκηκα
  choice: Dùng “đã nói” và “đã thắng”.
  alternative: nói; thắng; đã chinh phục
  rationale: Tiểu từ “đã” đánh dấu hành động hoàn tất; văn mạch chuyển tải hiệu lực còn tiếp tục của những lời đã phán và chiến thắng đã đạt được, kể cả sự căng thẳng thần học khi lời chiến thắng được tuyên bố trước thập tự giá trong tiến trình kể chuyện.
- issue: Đại từ xưng hô giữa Đức Chúa Jêsus và các môn đồ
  choice: “Ta” và “các con”.
  alternative: “tôi” và “anh em”; “Ta” và “các ngươi”
  rationale: Cặp đại từ này thể hiện thẩm quyền cùng sự gần gũi trong lời từ biệt, dễ hiểu với độc giả hiện đại hơn “các ngươi”, nhưng không biến lời nói thành lối giao tiếp ngang hàng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Trật tự “trong Ta” được giữ để bảo toàn sự đối chiếu với “trong thế gian”. Dấu chấm trước “Nhưng” làm nổi bật lời khích lệ mà không thay đổi quan hệ đối lập của ἀλλά. Các dấu chú thích được đặt ngay sau từ ngữ mà chú thích giải thích; thứ tự này sửa sự lệch vị trí trong lớp tham khảo tiếng Anh.
