  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἐν ἐκείνῃ τῇ ἡμέρᾳ ἐμὲ οὐκ ἐρωτήσετε οὐδέν· ἀμὴν ἀμὴν λέγω ὑμῖν, ⸂ἄν τι⸃ αἰτήσητε τὸν πατέρα ⸂δώσει ὑμῖν ἐν τῷ ὀνόματί μου⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/023.yaml
  text: And in that day you will ask me nothing[a]. Truly, truly, I say to you, whatever you ask the Father in my name[b], he will give to you.
translation:
  language: vi
  text: 'Trong ngày ấy, anh em sẽ không hỏi tôi điều gì.[a] Thật, thật, tôi bảo anh em: bất cứ điều gì anh em cầu xin Cha nhân danh tôi, Người sẽ ban cho anh em.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn dùng hai động từ khác nhau trong câu này: trước hết là ἐρωτάω, nghĩa là “hỏi/đặt câu hỏi”, nói về Chúa Giê-su; sau đó là αἰτέω, nghĩa là “cầu xin/thỉnh cầu”, nói về Cha.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: Trong ngày ấy
  rationale: Giữ cách diễn đạt thời gian của nguyên văn và sắc thái hướng đến một thời điểm đã được nói trước trong mạch văn.
- source_word: ἐμὲ οὐκ ἐρωτήσετε οὐδέν
  choice: anh em sẽ không hỏi tôi điều gì
  rationale: “Hỏi” diễn đạt tự nhiên hành động đặt câu hỏi với Chúa Giê-su, giữ rõ tân ngữ “tôi” và sự phủ định trọn vẹn.
- source_word: ἀμὴν ἀμὴν λέγω ὑμῖν
  choice: Thật, tôi bảo thật anh em
  rationale: Cách nói quen thuộc, trang trọng trong tiếng Việt, truyền đạt sự nhấn mạnh của hai lần ἀμήν mà không gượng ép lặp nguyên một từ.
- source_word: ἄν τι αἰτήσητε
  choice: bất cứ điều gì anh em cầu xin
  rationale: “Bất cứ điều gì” giữ phạm vi không xác định của ἄν τι; “cầu xin” thể hiện rõ sắc thái thỉnh cầu của αἰτέω và phân biệt tự nhiên với ἐρωτάω ở đầu câu.
- source_word: τὸν πατέρα
  choice: Cha
  rationale: Không thêm đại từ sở hữu vốn không có trong nguyên văn; viết hoa để chỉ Đức Chúa Cha trong ngữ cảnh.
- source_word: δώσει ὑμῖν
  choice: Người sẽ ban cho anh em
  rationale: “Ban” phù hợp với hành động của Cha và không cần chèn một tân ngữ không được viết ra; “Người” làm rõ chủ thể được hàm trong động từ Hy Lạp.
- source_word: ἐν τῷ ὀνόματί μου
  choice: nhân danh tôi
  rationale: Đây là cách diễn đạt tự nhiên và quen thuộc trong tiếng Việt, giữ sức nặng đại diện và quan hệ của thành ngữ Gio-an mà không giải nghĩa quá mức.
theological_decisions:
- issue: Sự phân biệt giữa ἐρωτάω và αἰτέω
  choice: Dịch lần đầu là “hỏi” và lần sau là “cầu xin”.
  alternative: Dịch cả hai động từ là “xin” hoặc “hỏi”.
  rationale: Tiếng Việt có thể bảo tồn tự nhiên sự khác biệt giữa việc hỏi Chúa Giê-su và việc cầu xin Cha, tránh làm mờ nét tương phản từ vựng của nguyên văn.
- issue: Phạm vi lời hứa về lời cầu xin nhân danh Chúa Giê-su
  choice: Giữ lời hứa trực tiếp như nguyên văn, không thêm điều kiện thần học.
  alternative: Diễn giải thành những điều phù hợp với ý muốn Chúa Giê-su.
  rationale: Các điều kiện có thể được bàn từ văn mạch rộng hơn, nhưng không nên được đưa vào bản văn câu này khi nguyên văn không nói rõ.
- issue: Phạm vi kết nối của cụm ἐν τῷ ὀνόματί μου
  choice: Gắn “nhân danh tôi” với hành động cầu xin theo cách hiểu và cách diễn đạt thông dụng.
  alternative: Hiểu là Cha sẽ ban cho anh em trong danh Chúa Giê-su.
  rationale: Trật tự từ Hy Lạp để cụm này ở cuối câu nên có thể tạo một mức độ lưỡng nghĩa về chỗ kết nối; bản dịch chính chọn cách hiểu thông dụng nhưng ghi nhận phương án kia trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” cho số nhiều ὑμῖν; dùng “Cha” và đại từ tôn kính “Người” trong ngữ cảnh này. Bản dịch tận dụng sự phân biệt tự nhiên giữa “hỏi” và “cầu xin” trong tiếng Việt.
