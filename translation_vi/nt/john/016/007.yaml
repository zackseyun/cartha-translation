reference: John 16:7
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀλλ’ ἐγὼ τὴν ἀλήθειαν λέγω ὑμῖν, συμφέρει ὑμῖν ἵνα ἐγὼ ἀπέλθω. ἐὰν ⸀γὰρ μὴ ἀπέλθω, ὁ παράκλητος ⸂οὐ μὴ ἔλθῃ⸃ πρὸς ὑμᾶς· ἐὰν δὲ πορευθῶ, πέμψω αὐτὸν πρὸς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/007.yaml
  text: 'But I am telling you the truth: it is better for you that I go away. For if I do not go away[a], the Advocate will certainly not come to you; but if I go, I will send him to you.'
translation:
  language: vi
  text: 'Nhưng tôi nói thật với anh em: tôi ra đi thì có lợi cho anh em. Vì nếu tôi không ra đi, Đấng Bảo Trợ[a] chắc chắn sẽ không đến với anh em; còn nếu tôi đi, tôi sẽ sai Ngài đến với anh em.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch là “Đấng Giúp Đỡ,” “Đấng Biện Hộ,” “Đấng An Ủi” hoặc “Đấng Cố Vấn”; Hy Lạp: παράκλητος (paraklētos).'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: Nhưng
  rationale: Diễn tả sự tương phản với nỗi buồn của các môn đồ trong văn cảnh trước, bằng liên từ tự nhiên và trang trọng.
- source_word: τὴν ἀλήθειαν λέγω ὑμῖν
  choice: tôi nói thật với anh em
  rationale: Giữ nguyên ý khẳng định long trọng về tính chân thật, đồng thời dùng cách nói tự nhiên trong tiếng Việt hiện đại.
- source_word: συμφέρει ὑμῖν
  choice: có lợi cho anh em
  rationale: Truyền đạt trực tiếp ý ích lợi hay lợi ích của động từ συμφέρω mà không diễn giải thêm.
- source_word: ἵνα ἐγὼ ἀπέλθω
  choice: tôi ra đi
  rationale: Sau συμφέρει, mệnh đề ἵνα nêu điều có lợi; “ra đi” tự nhiên và giữ được sắc thái rời khỏi của ἀπέρχομαι.
- source_word: ἐὰν γὰρ μὴ ἀπέλθω
  choice: Vì nếu tôi không ra đi
  rationale: Giữ cấu trúc điều kiện, chức năng giải thích của γάρ và sự lặp lại động từ từ mệnh đề trước.
- source_word: ὁ παράκλητος
  choice: Đấng Bảo Trợ
  rationale: Danh xưng này thể hiện một tác nhân có ngôi vị đứng bên để giúp đỡ, đại diện hoặc biện hộ. “Đấng Bảo Trợ” trang trọng, dễ hiểu và không thu hẹp từ vào riêng chức năng an ủi.
- source_word: οὐ μὴ ἔλθῃ
  choice: chắc chắn sẽ không đến
  rationale: Thể hiện phép phủ định nhấn mạnh οὐ μή với động từ giả định bằng tiếng Việt tự nhiên.
- source_word: πρὸς ὑμᾶς
  choice: đến với anh em
  rationale: Diễn tả chuyển động hướng đến các môn đồ; “với” cũng phù hợp sắc thái quan hệ trong ngữ cảnh mà không thêm ý cư ngụ.
- source_word: ἐὰν δὲ πορευθῶ
  choice: còn nếu tôi đi
  rationale: “Còn” đánh dấu sự đối lập giữa hai điều kiện; “đi” phân biệt tự nhiên với ἀπέλθω nhưng không cường điệu sắc thái hành trình.
- source_word: πέμψω αὐτὸν
  choice: tôi sẽ sai Ngài
  rationale: “Sai” là cách dùng trang trọng, tự nhiên cho hành động cử một tác nhân có ngôi vị; “Ngài” phản ánh đại từ giống đực và sự trình bày mang tính cá vị trong bản văn.
theological_decisions:
- issue: Cách dịch παράκλητος trong diễn từ Giăng
  choice: Đấng Bảo Trợ
  alternative: Đấng Giúp Đỡ; Đấng Biện Hộ; Đấng An Ủi; Đấng Cố Vấn; Đấng Pa-ra-clết
  rationale: Không một từ tiếng Việt nào bao quát trọn trường nghĩa. “Đấng Bảo Trợ” giữ được nét trợ giúp và đại diện, trong khi chú thích bảo tồn các khả năng từ vựng đáng kể khác.
- issue: Cách quy chiếu mang tính cá vị đối với παράκλητος
  choice: Ngài
  alternative: vị ấy; người ấy
  rationale: Bản Hy Lạp dùng αὐτόν giống đực, phù hợp với danh từ παράκλητος, và mô tả Đấng này như một tác nhân được sai đến. “Ngài” truyền đạt sự quy chiếu cá vị và giữ văn phong tôn kính mà không nói thêm bản thể luận ngoài câu.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “tôi—anh em” phù hợp lời Đức Chúa Jêsus nói với nhóm môn đồ; viết hoa “Đấng Bảo Trợ” và “Ngài” vì đây là một danh xưng và đại từ tôn kính. Giữ sự lặp lại “ra đi” của ἀπέλθω, đồng thời dịch πορευθῶ là “đi” để phản ánh biến đổi từ vựng trong nguyên bản.
