    rationale: Khi dùng “đã từ Cha mà ra” trong bản văn chính, chú thích nên nêu lựa chọn “đã ra từ Cha” như một cách giữ trực tiếp hơn trật tự/hình ảnh của tiếng Hy Lạp.
