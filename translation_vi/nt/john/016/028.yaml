source:
  edition: SBLGNT
  text: ἐξῆλθον ⸀ἐκ τοῦ πατρὸς καὶ ἐλήλυθα εἰς τὸν κόσμον· πάλιν ἀφίημι τὸν κόσμον καὶ πορεύομαι πρὸς τὸν πατέρα.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/028.yaml
  text: I came from the Father and have come into the world. Again[a], I am leaving the world and going to the Father.
translation:
  language: vi
  text: Tôi đã từ Cha mà ra và đã đến thế gian. Tôi lại rời thế gian và đi về với Cha.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đi đến Cha.”'
    reason: “Đi về với Cha” là cách diễn đạt tự nhiên trong tiếng Việt theo ngữ cảnh trở về; “đi đến Cha” phản ánh trực tiếp hơn hướng chuyển động của πρὸς τὸν πατέρα.
lexical_decisions:
- source_word: ἐξῆλθον ἐκ τοῦ πατρὸς
  choice: đã ra từ Cha
  rationale: Giữ hình ảnh chuyển động ra từ nguồn gốc được diễn tả bởi ἐξέρχομαι kết hợp với ἐκ, đồng thời không diễn giải thêm về cách thức Con từ Cha mà đến.
- source_word: ἐλήλυθα εἰς τὸν κόσμον
  choice: đã đến thế gian
  rationale: Tiếng Việt không biểu đạt thể hoàn thành như tiếng Hy Lạp; “đã đến” truyền đạt hành động đã hoàn tất và vẫn có ý nghĩa trong hiện tại. “Đến thế gian” là cách nói tự nhiên, vẫn thể hiện sự đi vào phạm vi thế gian theo εἰς.
- source_word: πάλιν
  choice: nay... lại
  rationale: “Lại” biểu thị chuyển động tiếp theo, đối ứng với việc đến thế gian; thêm “nay” làm rõ sự chuyển tiếp hiện tại mà không thay đổi nội dung.
- source_word: ἀφίημι τὸν κόσμον
  choice: rời thế gian
  rationale: Diễn đạt tự nhiên hành động rời bỏ sắp xảy đến; ngữ cảnh cho thấy đây là hành động cận kề.
- source_word: πορεύομαι πρὸς τὸν πατέρα
  choice: đi về với Cha
  rationale: “Đi về với” là tiếng Việt tự nhiên cho chuyển động hướng đến Cha trong mạch văn trở về, nhưng không thêm mô tả thần học ngoài câu Hy Lạp.
theological_decisions:
- issue: Mối quan hệ giữa Đức Chúa Jesus và Cha trong cụm ἐξῆλθον ἐκ τοῦ πατρὸς
  choice: Dịch trực tiếp là “đã ra từ Cha”, giữ lời khẳng định rằng nguồn xuất phát của Jesus là từ Cha.
  alternative: “Đã từ Cha mà đến” hoặc diễn giải rõ hơn theo ngôn ngữ tiền hữu và nhập thể.
  rationale: Bản dịch cần giữ nguyên lời khẳng định cao về nguồn gốc và sự trở về của Jesus, nhưng không mở rộng thành một công thức tín lý hay làm yếu đi thành một ý niệm chung rằng Ngài chỉ được Đức Chúa Trời sai đến.
- issue: Hướng chuyển động trong πρὸς τὸν πατέρα
  choice: “đi về với Cha”
  alternative: “đi đến Cha” hoặc “đi về phía Cha”
  rationale: Cách dịch đã chọn tự nhiên trong tiếng Việt và phù hợp với thế đối xứng giữa việc từ Cha đến thế gian và rời thế gian về với Cha; không xác định thêm bản chất của sự trở về.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Cha” viết hoa theo chức danh quy chiếu đến Đức Chúa Trời. Cấu trúc hai vế được giữ cân xứng để làm nổi bật chuyển động từ Cha đến thế gian rồi từ thế gian về với Cha.
