revisions:
- from: Họ sẽ khai trừ anh em khỏi các hội đường[a]. Thật vậy, giờ sẽ đến khi bất cứ ai giết anh em cũng sẽ tưởng mình đang dâng sự phụng sự lên Đức Chúa Trời[b].
  to: Họ sẽ khai trừ anh em khỏi các hội đường[a]. Hơn nữa, sẽ đến lúc bất cứ ai giết anh em sẽ nghĩ rằng mình đang làm một việc phụng sự Đức Chúa Trời[b].
  rationale: Bản sửa giữ nguyên nội dung và phạm vi của nguyên văn, đồng thời cải thiện chức năng của ἀλλά, thay thành ngữ thời gian bằng lối nói Việt tự nhiên, và thay cụm từ gượng ở cuối câu bằng một cách diễn đạt hiện đại, trang trọng. Chú thích vẫn bảo tồn các khả năng dịch thiên về “đuổi/loại khỏi” và “thờ phượng/phụng sự tôn giáo.”
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T06:25:52Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch chuyển tải đúng ý chính: các môn đồ sẽ bị loại khỏi hội đường và những người giết họ sẽ tin rằng hành động của mình là một hành vi phụng sự dành cho Đức Chúa Trời. Tuy nhiên, “Thật vậy” làm mờ sắc thái đối lập/leo thang của ἀλλά; “Hơn nữa” phản ánh tự nhiên hơn sự chuyển sang lời cảnh báo nghiêm trọng hơn. Cụm “giờ sẽ đến” không tự nhiên trong tiếng Việt hiện đại; “sẽ đến lúc” truyền đạt thành ngữ ἔρχεται ὥρα một cách rõ ràng. “Dâng sự phụng sự lên” quá gượng và không phải kết hợp từ tự nhiên trong tiếng Việt.'
  naturalness: “Họ sẽ khai trừ anh em khỏi các hội đường” và cách xưng hô “anh em” đều rõ ràng, phù hợp văn phong trang trọng hiện đại. Cần thay cụm cuối bằng “làm một việc phụng sự Đức Chúa Trời,” vốn tự nhiên hơn trong tiếng Việt mà vẫn giữ sắc thái hành vi phục vụ tôn giáo.
  terminology: “Hội đường” là thuật ngữ phù hợp cho συναγωγή; “Đức Chúa Trời” nhất quán với bản thảo. “Phụng sự” giữ được sắc thái λατρεία là sự phục vụ/thờ phượng có tính tôn giáo, không hàm ý rằng nhận định của những kẻ giết người là đúng.
  issues:
