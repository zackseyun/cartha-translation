    rationale: Dù bám sát hình ảnh ὥρα, cách nói này không tự nhiên trong tiếng Việt hiện đại. “Sẽ đến lúc” là thành ngữ thời gian tự nhiên, không thay đổi nghĩa.
  - severity: medium
    issue: Cụm “dâng sự phụng sự lên Đức Chúa Trời”
    rationale: Cách kết hợp “dâng sự phụng sự” gượng trong tiếng Việt. “Làm một việc phụng sự Đức Chúa Trời” diễn đạt tự nhiên ý những kẻ ấy xem việc giết người là một hành vi phục vụ tôn giáo dành cho Đức Chúa Trời.
