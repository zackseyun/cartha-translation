id: JHN.16.2
reference: John 16:2
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀποσυναγώγους ποιήσουσιν ὑμᾶς· ἀλλ’ ἔρχεται ὥρα ἵνα πᾶς ὁ ἀποκτείνας ὑμᾶς δόξῃ λατρείαν προσφέρειν τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/002.yaml
  text: They will make you outcasts from the synagogues[a]; indeed[b], an hour is coming when everyone who kills you will think he is offering service to God.
translation:
  language: vi
  text: Họ sẽ khai trừ anh em khỏi các hội đường[a]. Hơn nữa, sẽ đến lúc bất cứ ai giết anh em sẽ nghĩ rằng mình đang làm một việc phụng sự Đức Chúa Trời[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đuổi anh em ra khỏi hội đường” hoặc “loại anh em khỏi các hội đường.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “đang dâng sự thờ phượng lên Đức Chúa Trời” hoặc “đang dâng một sự phụng sự tôn giáo cho Đức Chúa Trời.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποσυναγώγους ποιήσουσιν ὑμᾶς
  choice: Họ sẽ khai trừ anh em khỏi các hội đường
  rationale: Diễn đạt tự nhiên ý gây cho các môn đồ bị loại khỏi cộng đồng hội đường, đồng thời giữ dạng số nhiều của danh từ trong bản Hy Lạp.
- source_word: ἀλλ’
  choice: Thật vậy
  rationale: Trong văn cảnh này, liên từ không chỉ nêu sự tương phản mà còn đẩy lời cảnh báo lên mức nghiêm trọng hơn.
- source_word: ἔρχεται ὥρα ἵνα
  choice: giờ sẽ đến khi
  rationale: Giữ hình ảnh 'giờ' đặc trưng trong sách Giăng, đồng thời dùng cấu trúc thời gian tự nhiên trong tiếng Việt.
- source_word: πᾶς ὁ ἀποκτείνας ὑμᾶς
  choice: bất cứ ai giết anh em
  rationale: Truyền đạt phạm vi khái quát của πᾶς và cấu trúc phân từ chỉ người mà không thêm giới tính vốn không cần biểu thị bằng đại từ tiếng Việt.
- source_word: δόξῃ
  choice: sẽ tưởng mình
  rationale: Diễn tả niềm tin chủ quan, sai lầm của kẻ giết người; 'tưởng' tự nhiên và hàm ý nhận định không đúng.
- source_word: λατρείαν προσφέρειν τῷ θεῷ
  choice: đang dâng sự phụng sự lên Đức Chúa Trời
  rationale: Giữ cả sắc thái phụng sự mang tính tôn giáo của λατρεία và ý dâng lên của προσφέρειν, dù cách kết hợp này trang trọng hơn lời nói thông thường.
theological_decisions:
- issue: Cách diễn đạt nhận thức tôn giáo của những kẻ bách hại
  choice: tưởng mình đang dâng sự phụng sự lên Đức Chúa Trời
  alternative: tưởng mình đang dâng sự thờ phượng lên Đức Chúa Trời
  rationale: 'Bản dịch giữ nguyên nghịch lý đáng kinh ngạc: kẻ giết các môn đồ tin hành động ấy là sự phục vụ tôn giáo dâng lên Đức Chúa Trời, nhưng câu không hề xác nhận niềm tin đó là đúng.'
- issue: Phạm vi và giới tính trong πᾶς ὁ ἀποκτείνας
  choice: bất cứ ai giết anh em cũng sẽ tưởng mình
  alternative: mọi kẻ giết anh em sẽ nghĩ rằng người ấy
  rationale: Tiếng Việt không buộc phải dùng đại từ mang giới tính ở đây. 'Bất cứ ai... mình' giữ nghĩa đại diện, phổ quát mà không thu hẹp đối tượng vào nam giới.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Khai trừ” diễn tả sự loại bỏ chính thức khỏi cộng đồng tôn giáo; “anh em” phù hợp với lời Chúa Giê-su nói cùng nhóm môn đồ. Cụm “dâng sự phụng sự” được giữ hơi trang trọng để phản ánh sắc thái tôn giáo và ý niệm dâng lên trong nguyên văn.
