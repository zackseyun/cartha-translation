id: JHN.16.20
reference: John 16:20
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀμὴν ἀμὴν λέγω ὑμῖν ὅτι κλαύσετε καὶ θρηνήσετε ὑμεῖς, ὁ δὲ κόσμος χαρήσεται· ⸀ὑμεῖς λυπηθήσεσθε, ἀλλ’ ἡ λύπη ὑμῶν εἰς χαρὰν γενήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/020.yaml
  text: Truly[a], truly, I say to you, you will weep and mourn, but the world will rejoice; you will be grieved, but your grief will become joy.
translation:
  language: vi
  text: '“Quả thật, quả thật, tôi nói với anh em: anh em sẽ khóc và than khóc, còn thế gian sẽ vui mừng. Anh em sẽ đau buồn, nhưng nỗi buồn của anh em sẽ trở thành niềm vui.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “nỗi buồn của anh em sẽ chuyển thành niềm vui.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  choice: Quả thật, quả thật
  rationale: Giữ nguyên sự lặp lại trang trọng và nhấn mạnh của công thức trong Gioan, đồng thời dùng cách diễn đạt tự nhiên, dễ hiểu trong tiếng Việt hiện đại.
- source_word: λέγω ὑμῖν
  choice: tôi nói với anh em
  rationale: Bám sát cấu trúc Hy Lạp và giữ lời nói trực tiếp với các môn đồ; “anh em” phù hợp với nhóm người nghe trong ngữ cảnh mà không thêm cách xưng hô mang màu sắc hệ phái.
- source_word: κλαύσετε καὶ θρηνήσετε
  choice: sẽ khóc và than van
  rationale: 'Phân biệt hai động từ: κλαύω chỉ khóc vì đau buồn, còn θρηνέω nhấn mạnh sự than lament công khai; cách ghép này rõ nghĩa và tự nhiên hơn việc lặp “khóc” trong tiếng Việt.'
- source_word: ὁ δὲ κόσμος
  choice: còn thế gian
  rationale: Giữ thuật ngữ rộng κόσμος và sắc thái tương phản của δέ, không diễn giải thành “thế gian không tin” hay một hệ thống đạo đức cụ thể.
- source_word: χαρήσεται
  choice: sẽ vui mừng
  rationale: Diễn đạt rõ niềm vui đối lập với sự đau buồn của các môn đồ và duy trì liên hệ ý nghĩa với χαρά ở cuối câu.
- source_word: λυπηθήσεσθε
  choice: sẽ đau buồn
  rationale: Cách nói tự nhiên trong tiếng Việt, truyền đạt trạng thái buồn đau mà không buộc phải thể hiện hình thái bị động vốn không tự nhiên ở đây.
- source_word: ἡ λύπη ὑμῶν
  choice: nỗi buồn của anh em
  rationale: Giữ mối liên hệ từ vựng với “đau buồn” ở mệnh đề trước và phản ánh trực tiếp cấu trúc sở hữu.
- source_word: εἰς χαρὰν γενήσεται
  choice: sẽ trở thành niềm vui
  rationale: Phản ánh khá sát chuyển biến được diễn tả bởi εἰς kết hợp với γενήσεται, đồng thời giữ khả năng hiểu rằng chính nỗi buồn được biến đổi thành niềm vui.
theological_decisions:
- issue: Ý nghĩa của κόσμος trong văn mạch Gioan
  choice: thế gian
  alternative: thế gian không tin; hệ thống thế gian
  rationale: Trong Gioan, κόσμος thường có sắc thái đối nghịch với Chúa Giê-su và các môn đồ, nhưng câu này không định nghĩa rõ hơn. Giữ “thế gian” bảo toàn độ rộng và sức căng thần học của nguyên văn.
- issue: Bản chất của sự chuyển biến từ buồn sang vui
  choice: nỗi buồn ... trở thành niềm vui
  alternative: nỗi buồn ... chuyển thành niềm vui
  rationale: Cách dịch chính bám sát γενήσεται và không giải thích thêm cơ chế hay thời điểm thần học của sự chuyển biến; phương án thay thế cũng khả dĩ và tự nhiên.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Quả thật, quả thật” để giữ công thức nhấn mạnh đặc trưng của Gioan; dùng “tôi—anh em” nhằm tránh lối xưng hô cổ hoặc cách gọi mang truyền thống hệ phái. Dấu [a] được đặt ngay sau cụm từ mà chú thích giải thích.
