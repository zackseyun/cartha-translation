id: JHN.16.15
reference: John 16:15
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: πάντα ὅσα ἔχει ὁ πατὴρ ἐμά ἐστιν· διὰ τοῦτο εἶπον ὅτι ἐκ τοῦ ἐμοῦ λαμβάνει καὶ ἀναγγελεῖ ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/015.yaml
  text: Everything that the Father has is mine[a]. That is why I said that he takes from what is mine and will declare it to you.
translation:
  language: vi
  text: Mọi điều Cha có đều là của tôi. Vì thế, tôi đã nói rằng Ngài lấy[a] từ những gì thuộc về tôi và sẽ công bố cho anh em.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “nhận”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα ὅσα
  choice: Mọi điều
  rationale: Diễn đạt tự nhiên sức bao quát của cụm Hy Lạp, nghĩa là toàn bộ những gì được nói đến.
- source_word: ἔχει
  choice: có
  rationale: Tương đương trực tiếp, tự nhiên của động từ ἔχω ở thì hiện tại.
- source_word: ὁ πατήρ
  choice: Cha
  rationale: Trong ngữ cảnh Giăng, đây là cách Chúa Giê-su gọi Đức Chúa Trời; lược bỏ mạo từ theo cú pháp tiếng Việt tự nhiên.
- source_word: ἐμά ἐστιν
  choice: đều là của tôi
  rationale: Giữ nguyên ý sở hữu mạnh của vị ngữ ἐμά; từ “đều” làm rõ phạm vi bao quát của πάντα ὅσα.
- source_word: διὰ τοῦτο
  choice: Vì thế
  rationale: Giữ quan hệ suy luận, đồng thời tự nhiên và trang trọng trong tiếng Việt hiện đại.
- source_word: εἶπον
  choice: tôi đã nói
  rationale: Phản ánh động từ aorist chỉ lời đã nói trước đó mà không thêm sắc thái ngoài ngữ cảnh.
- source_word: ἐκ τοῦ ἐμοῦ
  choice: từ những gì thuộc về tôi
  rationale: Làm rõ cấu trúc tỉnh lược của tiếng Hy Lạp trong tiếng Việt tự nhiên, nhưng không xác định thêm nội dung của điều thuộc về Con.
- source_word: λαμβάνει
  choice: lấy
  rationale: Giữ nghĩa trực tiếp có thể có của λαμβάνω trong cấu trúc chỉ nguồn; phương án “nhận” được ghi ở chú thích để bảo toàn sắc thái tiếp nhận.
- source_word: ἀναγγελεῖ
  choice: sẽ công bố
  rationale: Giữ thì tương lai và sắc thái truyền đạt cách công khai, có thẩm quyền của ἀναγγέλλω trong văn mạch mặc khải.
- source_word: ὑμῖν
  choice: cho anh em
  rationale: Diễn đạt đối tượng số nhiều là các môn đồ bằng cách xưng hô tự nhiên trong tiếng Việt hiện đại.
theological_decisions:
- issue: Mối quan hệ giữa những gì Cha có và Con
  choice: Mọi điều Cha có đều là của tôi
  alternative: Mọi điều Cha có đều thuộc về tôi
  rationale: Bảo toàn lời khẳng định mạnh mẽ của bản văn về mọi điều thuộc về Cha cũng là của Con, nhưng không đưa thuật ngữ tín lý hậu kỳ vào câu.
- issue: Việc Thánh Linh lấy hoặc nhận từ Con
  choice: Ngài lấy từ những gì thuộc về tôi
  alternative: Ngài nhận từ những gì thuộc về tôi
  rationale: λαμβάνει có thể mang nghĩa “lấy” hoặc “nhận”. Bản chính dùng “lấy”, còn chú thích giữ phương án “nhận”, tránh giải quyết thay cho bản văn sắc thái thần học về quan hệ của Thánh Linh với Con.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “tôi—anh em” cho lời Chúa Giê-su nói với các môn đồ và “Ngài” cho Đấng được nhắc đến trong ngôi thứ ba; tránh đại từ cổ hoặc mang dấu ấn hệ phái.
