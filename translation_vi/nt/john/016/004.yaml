review_pass:
  verdict: revise
  source_fidelity: Bản dịch nhìn chung theo sát câu Hy Lạp và giữ được cấu trúc mục đích cùng hai vế tương phản. Tuy nhiên, “nói trước” thêm sắc thái dự báo không có trực tiếp trong εἶπον (“tôi đã nói”), và “còn ở” thêm ý ‘vẫn/còn’ vượt quá ἤμην (“tôi đã/đang ở”).
  naturalness: Câu văn hiện đại, dễ đọc. Tuy vậy, “giờ của chúng” có thể nghe như quy chiếu đến đồ vật hoặc mang sắc thái miệt thị nếu hiểu là người. “Giờ của họ” tự nhiên hơn trong ngữ cảnh những kẻ chống đối vừa nhắc đến, mà vẫn không xác định cụ thể họ là ai.
  terminology: “Anh em,” “những điều này,” “giờ,” và “ngay từ đầu” phù hợp văn phong hiện đại, trang trọng vừa phải. Nên giữ “giờ” để phản ánh ὥρα. Chú thích cần dùng “nhớ đến họ” thay vì “nhớ chúng” để tiếng Việt tự nhiên hơn, đồng thời giải thích đây là cách diễn đạt sát cấu trúc gây khó trong nguyên ngữ.
  issues:
  - severity: medium
    issue: “đã nói trước” dịch εἶπον
    rationale: εἶπον chỉ là “đã nói/bảo”; ý lời nói có trước thời điểm ‘giờ’ đến đã được ngữ cảnh và thì quá khứ diễn đạt. “Nói trước” có thể gợi nội dung tiên báo và do đó thêm sắc thái không được đánh dấu riêng trong nguyên văn.
  - severity: low
    issue: “tôi còn ở với anh em” dịch ἤμην μεθ’ ὑμῶν
    rationale: “Còn” thêm ý ‘vẫn ở’, trong khi nguyên văn chỉ nói “tôi đã ở với anh em” (thì chưa hoàn thành trong bối cảnh quá khứ). “Tôi đang ở với anh em” phản ánh tự nhiên hơn tính đang diễn tiến trong lời thuật trực tiếp.
  - severity: low
    issue: “giờ của chúng”
    rationale: Đại từ “chúng” có thể không tự nhiên trong tiếng Việt khi quy chiếu tới các tác nhân con người vừa được nhắc đến và có thể tạo sắc thái miệt thị. “Họ” tự nhiên hơn; chú thích vẫn nêu rõ đại từ Hy Lạp không giải quyết dứt khoát quy chiếu.
  revised_text: Nhưng tôi đã nói với anh em những điều này để khi giờ của họ đến[a], anh em nhớ rằng tôi đã nói với anh em. Tôi đã không nói với anh em những điều này ngay từ đầu, vì tôi đang ở với anh em.
  revised_footnotes:
