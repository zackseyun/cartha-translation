id: JHN.16.4
reference: John 16:4
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀλλὰ ταῦτα λελάληκα ὑμῖν ἵνα ὅταν ἔλθῃ ἡ ὥρα ⸀αὐτῶν μνημονεύητε ⸁αὐτῶν ὅτι ἐγὼ εἶπον ὑμῖν. Ταῦτα δὲ ὑμῖν ἐξ ἀρχῆς οὐκ εἶπον, ὅτι μεθ’ ὑμῶν ἤμην.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/004.yaml
  text: But I have spoken these things to you so that when their hour comes[a], you may remember that I told you. But I did not tell you these things from the beginning, because I was with you.
translation:
  language: vi
  text: Nhưng tôi đã nói với anh em những điều này để khi giờ của họ đến[a], anh em nhớ rằng tôi đã nói với anh em. Tôi đã không nói với anh em những điều này ngay từ đầu, vì tôi đang ở với anh em.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay, sát chữ hơn: “khi giờ của họ đến, anh em nhớ đến họ, rằng tôi đã nói với anh em.” Tiếng Hy Lạp có hai lần dùng đại từ αὐτῶν (“họ/của họ”), và quy chiếu chính xác của đại từ này khó tái hiện trôi chảy trong tiếng Việt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λελάληκα
  choice: đã nói
  rationale: Thì hoàn thành chỉ hành động đã xảy ra nhưng vẫn có ý nghĩa hiện tại; tiếng Việt tự nhiên dùng “đã nói”, còn ý nghĩa tiếp diễn được ngữ cảnh truyền đạt.
- source_word: ταῦτα
  choice: những điều này
  rationale: Đại từ chỉ định số nhiều quy chiếu về các lời cảnh báo vừa nêu và được diễn đạt rõ ràng, tự nhiên trong tiếng Việt.
- source_word: ἵνα
  choice: để
  rationale: Giữ lực chỉ mục đích của liên từ Hy Lạp bằng cách diễn đạt gọn và tự nhiên.
- source_word: ὅταν ἔλθῃ ἡ ὥρα αὐτῶν
  choice: khi giờ của chúng đến
  rationale: “Giờ” bảo tồn cách dùng giàu ý nghĩa của ὥρα trong Giăng về thời điểm được định; “của chúng” giữ nguyên sự mơ hồ thật sự trong đại từ αὐτῶν thay vì xác định đó là người hay biến cố.
- source_word: μνημονεύητε
  choice: anh em nhớ
  rationale: Diễn đạt trực tiếp động từ chỉ sự nhớ lại; trong mệnh đề mục đích, tiếng Việt không cần thêm một từ tương đương máy móc với thức giả định.
- source_word: ὅτι ἐγὼ εἶπον ὑμῖν
  choice: rằng tôi đã nói trước với anh em
  rationale: “Rằng” giữ mệnh đề nội dung; “nói trước” làm rõ trong tiếng Việt rằng lời ấy đã được nói trước khi giờ đó đến, nhưng không thêm nội dung dự báo ngoài ngữ cảnh.
- source_word: ἐξ ἀρχῆς
  choice: ngay từ đầu
  rationale: Cách diễn đạt hiện đại và tự nhiên, giữ ý nghĩa thời gian bắt đầu.
- source_word: μεθ’ ὑμῶν ἤμην
  choice: tôi còn ở với anh em
  rationale: “Ở với anh em” phản ánh trực tiếp quan hệ hiện diện; “còn” phù hợp ngữ cảnh tương phản với sự ra đi sắp tới mà không thay đổi nội dung cơ bản.
theological_decisions:
- issue: Quy chiếu của hai lần αὐτῶν trong câu nói về “giờ của chúng” và việc nhớ lại
  choice: Giữ lần thứ nhất là “của chúng” trong chính văn; diễn đạt lần thứ hai tự nhiên qua nội dung “nhớ rằng tôi đã nói trước với anh em”, đồng thời ghi chú dạng sát chữ.
  alternative: 'Dịch sát hơn: “khi giờ của chúng đến, anh em nhớ chúng, rằng tôi đã nói với anh em.”'
  rationale: Bản SBLGNT có hai lần αὐτῶν, nhưng tái hiện cả hai theo đúng trật tự sẽ rất gượng và khó hiểu trong tiếng Việt. Chính văn giữ sự mơ hồ của đại từ đầu tiên; chú thích bảo tồn đầy đủ khó khăn văn bản và cú pháp thay vì âm thầm giải quyết.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “tôi—anh em” phù hợp lời Chúa Giê-su nói với nhóm môn đồ, tránh sắc thái cổ. Giữ “giờ” thay vì đổi thành “thời điểm” để bảo tồn mô-típ từ vựng của sách Giăng.
