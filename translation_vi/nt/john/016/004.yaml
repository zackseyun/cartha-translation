revisions:
- from: Nhưng tôi đã nói với anh em những điều này để khi giờ của chúng đến[a], anh em nhớ rằng tôi đã nói trước với anh em. Tôi đã không nói với anh em những điều này ngay từ đầu, vì tôi còn ở với anh em.
  to: Nhưng tôi đã nói với anh em những điều này để khi giờ của họ đến[a], anh em nhớ rằng tôi đã nói với anh em. Tôi đã không nói với anh em những điều này ngay từ đầu, vì tôi đang ở với anh em.
  rationale: Bản sửa bỏ các bổ sung diễn giải “trước” và “còn”, đồng thời dùng “họ” để câu tiếng Việt tự nhiên hơn trong ngữ cảnh. Chính văn vẫn giữ đại từ sở hữu ở lần xuất hiện thứ nhất; chú thích bảo tồn cách đọc sát chữ và nêu rõ khó khăn do hai lần αὐτῶν trong SBLGNT, không quyết định độc đoán quy chiếu của đại từ.
  reviewer_model: gpt-5.6-terra
