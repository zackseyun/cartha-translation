id: JHN.16.25
reference: John 16:25
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ταῦτα ἐν παροιμίαις λελάληκα ὑμῖν· ⸀ἔρχεται ὥρα ὅτε οὐκέτι ἐν παροιμίαις λαλήσω ὑμῖν ἀλλὰ παρρησίᾳ περὶ τοῦ πατρὸς ⸀ἀπαγγελῶ ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/025.yaml
  text: I have spoken these things to you in figures of speech[a]. An hour is coming when I will no longer speak to you in figures of speech[c][b], but will tell you plainly about the Father.
translation:
  language: vi
  text: Ta đã nói với các con những điều này bằng lời bóng gió[a]. Giờ sắp đến[b], khi Ta sẽ không còn nói với các con bằng lời bóng gió nữa, nhưng sẽ nói rõ ràng[c] cho các con về Cha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “bằng dụ ngôn”, “bằng lời ví von” hoặc “bằng lời kín nhiệm”; từ Hy Lạp chỉ lối nói mang tính hình tượng hoặc gián tiếp.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “Thời điểm sắp đến.” Trong sách Giăng, “giờ” thường mang ý nghĩa thần học.'
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “sẽ nói công khai” hoặc “sẽ nói thẳng thắn”; ở đây, ý chính là cách nói trực tiếp, không còn bóng gió.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παροιμίαις
  choice: bằng lời bóng gió
  rationale: Trong văn mạch Giăng, từ này chỉ cách nói mang tính hình tượng hoặc gián tiếp, không nhất thiết là dụ ngôn theo nghĩa chuyên biệt. “Lời bóng gió” tự nhiên trong tiếng Việt và giữ được sắc thái phần nào che khuất.
- source_word: λελάληκα
  choice: Ta đã nói
  rationale: Thì hoàn thành Hy Lạp diễn tả lời đã nói nhưng vẫn có liên hệ hiện tại; “đã nói” là cách diễn đạt tự nhiên và vẫn liên kết với động từ nói ở vế sau.
- source_word: ἔρχεται ὥρα
  choice: Giờ sắp đến
  rationale: Giữ danh từ “giờ” để bảo tồn cách dùng đặc trưng và âm hưởng thần học trong Giăng; cách nói này đồng thời tự nhiên trong tiếng Việt.
- source_word: οὐκέτι
  choice: không còn ... nữa
  rationale: Diễn đạt rõ sự chấm dứt của cách nói trước đây trong thế đối lập với sự bày tỏ rõ ràng sắp tới.
- source_word: λαλήσω
  choice: Ta sẽ ... nói
  rationale: Giữ sự nhất quán từ vựng với λελάληκα và nhấn mạnh hành vi nói.
- source_word: παρρησίᾳ
  choice: nói rõ
  rationale: Trong thế tương phản với lời bóng gió, trọng tâm là sự rõ ràng và trực tiếp, không chủ yếu là lòng can đảm hay việc nói công khai.
- source_word: ἀπαγγελῶ
  choice: sẽ nói ... cho
  rationale: Diễn đạt tự nhiên hành động truyền đạt trực tiếp cho các môn đồ; tránh sắc thái quá trang trọng của “công bố”.
- source_word: περὶ τοῦ πατρὸς
  choice: về Cha
  rationale: “Về Cha” ngắn gọn, tự nhiên và giữ nguyên tước hiệu quan hệ của πατήρ trong văn mạch Giăng.
theological_decisions:
- issue: Cách dịch ὥρα trong văn mạch Giăng
  choice: Giờ sắp đến
  alternative: Thời điểm sắp đến; Một giờ đang đến
  rationale: Giữ “giờ” nhằm bảo tồn âm hưởng thần học đặc trưng của sách Giăng mà không xác định quá mức bằng “giờ ấy” khi tiếng Hy Lạp không có mạo từ.
- issue: Nghĩa của παρρησίᾳ khi đối lập với ἐν παροιμίαις
  choice: nói rõ
  alternative: nói công khai; nói thẳng thắn
  rationale: Sự đối lập trong câu chủ yếu nằm giữa cách nói gián tiếp, có tính hình tượng và sự bày tỏ trực tiếp, rõ ràng; bản dịch không đưa thêm trọng tâm về lòng dạn dĩ.
- issue: Tước hiệu τοῦ πατρός
  choice: Cha
  alternative: Đức Chúa Cha; người Cha
  rationale: “Cha” phản ánh trực tiếp cách gọi trong nguyên văn, giữ quan hệ thần học vốn có mà không bổ sung danh xưng không hiện diện trong câu.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Ta/các con” để thể hiện lời Đức Chúa Jêsus nói với các môn đồ trong quan hệ thầy trò; giữ “giờ” và “Cha” nhằm bảo tồn từ ngữ cùng âm hưởng của văn bản Giăng.
