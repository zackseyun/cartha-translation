  terminology: «Cha» dịch trực tiếp τοῦ πατρός và không thêm danh xưng ngoài nguyên văn. «Nói rõ ràng» diễn đạt thích hợp παρρησίᾳ trong thế đối lập với παροιμίαις, không áp đặt nghĩa «công khai» hay «can đảm».
