  to: Ta đã nói với các con những điều này bằng lời bóng gió[a]. Giờ sắp đến[b], khi Ta sẽ không còn nói với các con bằng lời bóng gió nữa, nhưng sẽ nói rõ ràng[c] cho các con về Cha.
