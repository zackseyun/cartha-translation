  source_fidelity: 'Bản dịch phản ánh đúng cấu trúc và ý chính của nguyên văn: lời đã nói bằng cách diễn đạt gián tiếp, một «giờ» đang đến, sự chấm dứt của lối nói ấy, và việc bày tỏ rõ ràng về Cha. «Giờ sắp đến» bảo lưu được ὥρα trong văn mạch Giăng; «lời bóng gió» là phương án chấp nhận được cho παροιμίαις.'
