id: JHN.16.6
reference: John 16:6
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀλλ’ ὅτι ταῦτα λελάληκα ὑμῖν ἡ λύπη πεπλήρωκεν ὑμῶν τὴν καρδίαν.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/006.yaml
  text: But because I have spoken these things to you[a], sorrow has filled your heart.
translation:
  language: vi
  text: Nhưng vì Thầy đã nói với anh em những điều ấy, nỗi buồn đã tràn ngập lòng anh em.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể hiểu là “lòng của mỗi người trong anh em.” Tiếng Hy Lạp dùng danh từ số ít “lòng” với đại từ sở hữu số nhiều, có thể diễn tả nỗi buồn nội tâm chung của cả nhóm.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: Nhưng
  rationale: Liên từ biểu thị sự tương phản với điều vừa nói trước đó; “Nhưng” tự nhiên và giữ đúng mạch lập luận.
- source_word: ὅτι
  choice: vì
  rationale: Trong ngữ cảnh này, ὅτι nêu nguyên nhân khiến các môn đệ buồn, nên dịch theo nghĩa nhân quả.
- source_word: ταῦτα
  choice: những điều ấy
  rationale: Giữ số nhiều của đại từ chỉ định và quy chiếu đến những điều Đức Giê-su vừa nói.
- source_word: λελάληκα
  choice: đã nói
  rationale: Động từ hoàn thành diễn tả lời đã được nói và còn gây tác động hiện tại. Tiếng Việt không mã hóa thể hoàn thành như tiếng Hy Lạp; “đã nói” tự nhiên, còn hệ quả hiện tại được thể hiện qua vế sau.
- source_word: ὑμῖν
  choice: với anh em
  rationale: Đại từ số nhiều chỉ các môn đệ. “Nói với anh em” là cách diễn đạt tự nhiên trong tiếng Việt và làm rõ số nhiều.
- source_word: ἡ λύπη
  choice: nỗi buồn
  rationale: λύπη chỉ nỗi buồn đau hoặc sầu muộn sâu sắc; “nỗi buồn” rõ ràng, trang trọng vừa phải và phù hợp ngữ cảnh.
- source_word: πεπλήρωκεν
  choice: đã tràn ngập
  rationale: Giữ hình ảnh πληρόω là làm đầy. “Tràn ngập” tự nhiên hơn “làm đầy” khi nói về cảm xúc, mà không chuyển sang cách diễn giải mạnh hơn như “chế ngự”.
- source_word: ὑμῶν τὴν καρδίαν
  choice: lòng anh em
  rationale: Bản Hy Lạp có đại từ sở hữu số nhiều nhưng danh từ “lòng” ở số ít. Tiếng Việt không bắt buộc đánh dấu số trên danh từ, nên “lòng anh em” vừa tự nhiên vừa bảo tồn được sắc thái tập thể.
theological_decisions:
- issue: Danh từ “lòng” số ít với đại từ sở hữu số nhiều
  choice: lòng anh em
  alternative: lòng của mỗi người trong anh em
  rationale: Cấu trúc Hy Lạp có thể trình bày cả nhóm cùng chia sẻ một trạng thái nội tâm, đồng thời vẫn có thể hiểu theo nghĩa phân phối cho từng người. Bản dịch chính giữ nguyên sự hàm hồ ấy; chú thích nêu cách hiểu khác.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Thầy—anh em” phù hợp lời Đức Giê-su nói trực tiếp với các môn đệ; “tràn ngập lòng” bảo tồn hình ảnh của nguyên văn mà vẫn tự nhiên trong tiếng Việt.
