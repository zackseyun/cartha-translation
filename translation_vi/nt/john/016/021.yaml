revisions:
- from: Khi người phụ nữ sinh con, bà đau buồn vì giờ của mình đã đến; nhưng khi đã sinh đứa trẻ rồi, bà không còn nhớ nỗi khốn khó nữa, vì vui mừng rằng một con người đã được sinh ra trong thế gian.
  to: Khi một người phụ nữ sinh con, người ấy đau buồn vì giờ mình đã đến; nhưng khi đã sinh đứa trẻ rồi, người ấy không còn nhớ nỗi khổ nữa, vì niềm vui khi một con người[a] đã được sinh ra vào thế gian.
