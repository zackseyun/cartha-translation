id: JHN.16.21
reference: John 16:21
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἡ γυνὴ ὅταν τίκτῃ λύπην ἔχει, ὅτι ἦλθεν ἡ ὥρα αὐτῆς· ὅταν δὲ γεννήσῃ τὸ παιδίον, οὐκέτι μνημονεύει τῆς θλίψεως διὰ τὴν χαρὰν ὅτι ἐγεννήθη ἄνθρωπος εἰς τὸν κόσμον.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/021.yaml
  text: When a woman is giving birth[a], she has sorrow because her hour has come; but when she has given birth to the child, she no longer remembers the distress because of the joy that a child has been born into the world.
translation:
  language: vi
  text: Khi một người phụ nữ sinh con, người ấy đau buồn vì giờ mình đã đến; nhưng khi đã sinh đứa trẻ rồi, người ấy không còn nhớ nỗi khổ nữa, vì niềm vui khi một con người[a] đã được sinh ra vào thế gian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “một người nam đã được sinh ra vào thế gian.” Từ Hy Lạp anthrōpos có thể chỉ “người nam” hoặc, như trong văn cảnh này, một con người nói chung; không hàm ý đứa trẻ là nam.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡ γυνή
  choice: người phụ nữ
  rationale: Trong ví dụ khái quát về sinh nở, nghĩa tự nhiên là “người phụ nữ”, không nhất thiết là “người vợ”.
- source_word: ὅταν τίκτῃ
  choice: khi ... sinh con
  rationale: Diễn đạt một tình huống khái quát đang diễn ra; tiếng Việt tự nhiên có thể dùng “sinh con” mà không cần thêm “đang”.
- source_word: λύπην ἔχει
  choice: đau buồn
  rationale: λύπη bao gồm nỗi buồn và đau khổ, phù hợp với sự tương phản giữa buồn và vui trong văn cảnh hơn là chỉ nói đến đau đớn thể xác.
- source_word: ἡ ὥρα αὐτῆς
  choice: giờ của mình
  rationale: Giữ hình ảnh “giờ” vốn có sức gợi chủ đề trong Tin Mừng Giăng, đồng thời ở đây chỉ thời điểm sinh nở đã đến.
- source_word: γεννήσῃ τὸ παιδίον
  choice: đã sinh đứa trẻ rồi
  rationale: Thể bất định chỉ sự việc hoàn tất; “đã ... rồi” diễn đạt rõ sự hoàn thành bằng tiếng Việt tự nhiên.
- source_word: οὐκέτι μνημονεύει
  choice: không còn nhớ ... nữa
  rationale: Tương đương trực tiếp và tự nhiên với ý không còn ghi nhớ hay nghĩ đến điều ấy.
- source_word: τῆς θλίψεως
  choice: nỗi khốn khó
  rationale: θλῖψις chỉ sự khốn khó, bức bách của cuộc sinh nở; cách dịch này không thu hẹp nghĩa vào đau thể xác và tránh sắc thái kỹ thuật của “đại nạn”.
- source_word: διὰ τὴν χαράν
  choice: vì vui mừng
  rationale: διά với đối cách nêu nguyên nhân; cách diễn đạt này rõ ràng và tự nhiên trong tiếng Việt.
- source_word: ὅτι ἐγεννήθη
  choice: rằng ... đã được sinh ra
  rationale: Giữ khả năng ὅτι giới thiệu nội dung hoặc căn nguyên của niềm vui mà không diễn giải quá mức.
- source_word: ἄνθρωπος
  choice: một con người
  rationale: ἄνθρωπος ở đây mang nghĩa khái quát về một con người mới, không chỉ riêng một bé trai; “một con người” giữ rõ từ ngữ của nguồn Hy Lạp.
- source_word: εἰς τὸν κόσμον
  choice: trong thế gian
  rationale: Tiếng Việt thường diễn đạt việc một người được sinh ra “trong thế gian”; cách này chuyển tự nhiên ý đi vào phạm vi thế giới.
theological_decisions:
- issue: Nghĩa khái quát của ἄνθρωπος
  choice: một con người
  alternative: một người; một người nam; một đứa trẻ
  rationale: Danh từ giống đực về ngữ pháp nhưng mang nghĩa khái quát trong văn cảnh. “Một con người” tránh hàm ý đứa trẻ nhất thiết là nam và vẫn bảo toàn việc bản Hy Lạp chuyển từ παιδίον sang ἄνθρωπος.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Giữ “giờ” để bảo toàn âm hưởng đặc trưng của Giăng; dùng “bà” làm đại từ chỉ người phụ nữ trưởng thành. Không thêm chú thích vì bản dịch chính đã thể hiện nghĩa khái quát của ἄνθρωπος.
