revisions:
- from: Nhưng khi Đấng ấy, là Thần của sự thật, đến, Ngài sẽ dẫn các con vào toàn bộ sự thật.[a] Vì Ngài sẽ không tự mình nói,[b] nhưng nghe điều gì thì Ngài sẽ nói điều ấy, và Ngài sẽ báo cho các con biết những điều sắp xảy đến.[c]
  to: Nhưng khi Đấng ấy, là Thần Linh của sự thật, đến, Ngài sẽ dẫn anh em vào mọi sự thật.[a] Vì Ngài sẽ không tự mình nói,[b] nhưng Ngài sẽ nói mọi điều Ngài nghe, và Ngài sẽ báo cho anh em biết những điều sắp đến.[c]
  rationale: Bản sửa thay thuật ngữ chưa tự nhiên bằng “Thần Linh của sự thật,” dùng đại từ số nhiều trung tính hơn, làm trôi chảy mệnh đề “điều Ngài nghe,” và tránh thu hẹp “những điều đang đến” thành các biến cố. Các chú thích vẫn neo đúng tại những vị trí có phương án dịch đáng kể và không giải quyết quá mức sự mơ hồ của nguyên văn.
