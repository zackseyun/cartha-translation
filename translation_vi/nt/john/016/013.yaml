review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch phản ánh đúng cấu trúc và ý chính của câu Hy Lạp: mệnh đề thời gian-tương lai, sự quy chiếu có ngôi vị của ἐκεῖνος, việc Thần Linh hướng dẫn, không nói từ chính mình, nói điều mình nghe, và công bố những điều đang đến. Tuy nhiên, “Thần của sự thật” không phải cách gọi tự nhiên hay ổn định trong tiếng Việt hiện đại; “Thần Linh của sự thật” truyền đạt τὸ πνεῦμα τῆς ἀληθείας rõ hơn mà không thêm tính từ “Thánh” không có trong câu. “Sắp xảy đến” cũng thu hẹp τὰ ἐρχόμενα vào các biến cố; “sắp đến” giữ phạm vi mở của nguyên văn.'
  naturalness: 'Cần đổi “các con” thành “anh em”: nguyên văn chỉ dùng đại từ số nhiều, và “anh em” là cách xưng hô hiện đại, trang trọng, tự nhiên hơn trong diễn từ này mà không thêm sắc thái cha-con. Cấu trúc “nghe điều gì thì Ngài sẽ nói điều ấy” hiểu được nhưng hơi nặng; “Ngài sẽ nói mọi điều Ngài nghe” tự nhiên và vẫn giữ quan hệ tiếp nhận rồi công bố. “Dẫn anh em vào mọi sự thật” là cách nói tiếng Việt trôi chảy hơn “vào toàn bộ sự thật.”'
  terminology: Dùng “Thần Linh” (viết hoa theo quy chiếu trong ngữ cảnh) cho πνεῦμα, giữ “sự thật” cho ἀλήθεια, và giữ đại từ “Đấng ấy/Ngài” để phản ánh ἐκεῖνος giống đực, có quy chiếu cá vị. Không cần áp đặt thuật ngữ hệ phái “Thánh Linh” trong chính văn.
  issues:
  - severity: medium
    issue: “Thần của sự thật” thiếu tự nhiên và có thể gây mơ hồ trong tiếng Việt.
    rationale: “Thần” đứng riêng thường không là cách gọi rõ ràng cho πνεῦμα trong văn phong Kinh Thánh Việt hiện đại. “Thần Linh của sự thật” giữ nguyên cấu trúc “Spirit of truth” và nhận diện thuật ngữ tốt hơn.
  - severity: low
    issue: “Các con” thêm sắc thái quan hệ không được biểu thị bởi ὑμᾶς.
    rationale: Đại từ Hy Lạp chỉ là ngôi thứ hai số nhiều. “Anh em” là lựa chọn trung tính hơn trong tiếng Việt hiện đại.
  - severity: low
    issue: “Những điều sắp xảy đến” diễn giải τὰ ἐρχόμενα thành biến cố xảy ra.
    rationale: Cụm Hy Lạp nói rộng về “những điều đang đến”; không nhất thiết xác định đó chỉ là các sự kiện xảy ra.
