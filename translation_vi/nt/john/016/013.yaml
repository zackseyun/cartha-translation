id: JHN.16.13
reference: John 16:13
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὅταν δὲ ἔλθῃ ἐκεῖνος, τὸ πνεῦμα τῆς ἀληθείας, ὁδηγήσει ὑμᾶς ⸂ἐν τῇ ἀληθείᾳ πάσῃ⸃, οὐ γὰρ λαλήσει ἀφ’ ἑαυτοῦ, ἀλλ’ ὅσα ⸀ἀκούσει λαλήσει, καὶ τὰ ἐρχόμενα ἀναγγελεῖ ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/013.yaml
  text: But when he[a], the Spirit of truth, comes, he will guide you into all the truth. For he will not speak from himself, but whatever he hears he will speak[d][c][b], and he will declare to you the things that are coming.
translation:
  language: vi
  text: Nhưng khi Đấng ấy, là Thần Linh của sự thật, đến, Ngài sẽ dẫn anh em vào mọi sự thật.[a] Vì Ngài sẽ không tự mình nói,[b] nhưng Ngài sẽ nói mọi điều Ngài nghe, và Ngài sẽ báo cho anh em biết những điều sắp đến.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “dẫn anh em trong mọi sự thật.” Nguyên văn dùng giới từ thường có nghĩa là “trong,” nhưng với động từ “dẫn,” câu cũng có thể mang sắc thái hướng đích là “vào.”'
    reason: alternative_reading
  - marker: b
    text: 'Hay: “sẽ không nói theo ý riêng.” Sát nghĩa: “sẽ không nói từ chính mình.”'
    reason: lexical_alternative
  - marker: c
    text: 'Hay: “những điều sẽ đến” hoặc “điều sắp đến.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν δὲ
  choice: Nhưng khi
  rationale: ὅταν mở đầu mệnh đề thời gian hướng đến tương lai, còn δέ tạo nét chuyển ý nhẹ từ ngữ cảnh trước.
- source_word: ἔλθῃ ἐκεῖνος
  choice: khi Đấng ấy ... đến
  rationale: ἐκεῖνος là đại từ chỉ định giống đực, nhấn mạnh chủ thể có ngôi vị; “Đấng ấy” tự nhiên và trang trọng hơn cách dịch sát là “người ấy” khi quy chiếu đến Thần.
- source_word: τὸ πνεῦμα τῆς ἀληθείας
  choice: Thần của sự thật
  rationale: Giữ cấu trúc sở hữu của nguyên văn và danh xưng đặc trưng trong Giăng; viết hoa “Thần” theo ngữ cảnh chỉ về Thánh Linh.
- source_word: ὁδηγήσει ὑμᾶς ἐν τῇ ἀληθείᾳ πάσῃ
  choice: sẽ dẫn các con vào toàn bộ sự thật
  rationale: “Dẫn ... vào” diễn đạt tự nhiên hình ảnh ὁδηγέω cùng sắc thái hướng đích của cụm giới từ; mạo từ và πάσῃ được thể hiện bằng “toàn bộ sự thật” thay vì “mọi sự thật”.
- source_word: οὐ γὰρ λαλήσει ἀφ’ ἑαυτοῦ
  choice: Vì Ngài sẽ không tự mình nói
  rationale: “Tự mình nói” giữ ý phát xuất từ chính mình mà không diễn giải thêm thành vấn đề thẩm quyền; cách hiểu “không nói theo ý riêng” được ghi chú.
- source_word: ἀλλ’ ὅσα ἀκούσει λαλήσει
  choice: nhưng nghe điều gì thì Ngài sẽ nói điều ấy
  rationale: Giữ mối tương ứng giữa điều nghe và điều nói, đồng thời tạo câu tiếng Việt tự nhiên; thì tương lai được hiểu từ động từ chính và ngữ cảnh.
- source_word: τὰ ἐρχόμενα
  choice: những điều sắp xảy đến
  rationale: Danh hóa phân từ hiện tại chỉ các thực tại hoặc biến cố đang đến; “sắp xảy đến” rõ nghĩa trong tiếng Việt mà không xác định cụ thể bản chất của chúng.
- source_word: ἀναγγελεῖ ὑμῖν
  choice: sẽ báo cho các con biết
  rationale: Diễn đạt tự nhiên nghĩa công bố hoặc truyền đạt cho người nghe, giữ sắc thái mặc khải mà không dùng từ quá cổ.
theological_decisions:
- issue: Cách quy chiếu có ngôi vị đến Thần
  choice: Dùng “Đấng ấy” và đại từ kính trọng “Ngài”
  alternative: Lặp lại “Thần” hoặc dùng đại từ trung tính
  rationale: ἐκεῖνος là giống đực dù πνεῦμα là danh từ giống trung, cho thấy cách quy chiếu có ngôi vị. Tiếng Việt không có hòa hợp giống ngữ pháp, nên “Đấng ấy/Ngài” bảo tồn đặc điểm diễn ngôn này mà không thêm định nghĩa tín lý.
- issue: Ý nghĩa của ἐν τῇ ἀληθείᾳ πάσῃ
  choice: “vào toàn bộ sự thật”
  alternative: “trong toàn bộ sự thật”
  rationale: ἐν về hình thức thường là “trong”, nhưng đi với động từ “dẫn” có thể mang sắc thái hướng đích. Bản chính dùng cách nói tự nhiên hơn trong tiếng Việt, còn cách dịch hình thức được giữ trong chú thích.
- issue: Phạm vi của τὰ ἐρχόμενα
  choice: Giữ rộng là “những điều sắp xảy đến”
  alternative: “tương lai” hoặc một nhóm biến cố tiên tri cụ thể
  rationale: Nguyên văn không xác định đó là toàn bộ tương lai hay một chương trình biến cố riêng; bản dịch tránh thu hẹp hoặc hệ thống hóa quá mức.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “các con” vì lời Đức Giê-su trực tiếp nói với các môn đồ trong diễn từ từ biệt; dùng “Ngài” để quy chiếu đến Thần một cách tôn kính và có ngôi vị. Tránh thuật ngữ giáo phái và không xác định quá mức nội dung của “những điều sắp xảy đến”.
