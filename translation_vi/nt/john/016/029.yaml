  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸀Λέγουσιν οἱ μαθηταὶ αὐτοῦ· Ἴδε νῦν ⸀ἐν παρρησίᾳ λαλεῖς, καὶ παροιμίαν οὐδεμίαν λέγεις.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/029.yaml
  text: His disciples said[a], “Look[b], now you are speaking openly and are not speaking in any figure of speech.”
translation:
  language: vi
  text: 'Các môn đồ của Ngài nói: “Này, bây giờ Ngài nói rõ ràng[a], không dùng một lối nói bóng gió nào[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “công khai” hoặc “thẳng thắn.” Cụm từ Hy Lạp có thể chỉ việc nói cách công khai, rõ ràng hoặc thẳng thắn.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “châm ngôn,” “dụ ngôn” hoặc “lời nói hàm ý.” Ở đây, từ này chỉ lời nói mang tính hình tượng hoặc gián tiếp.
    reason: lexical_alternative
lexical_decisions:
- source_word: Λέγουσιν
  choice: nói
  rationale: Dùng hiện tại lịch sử tự nhiên trong lối kể tiếng Việt; hình thức này giữ được tính trực tiếp của cảnh đối thoại mà không gây gượng.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: các môn đồ của Ngài
  rationale: Diễn đạt tự nhiên quan hệ sở hữu và giữ cách gọi trang trọng, dễ hiểu trong văn cảnh Tin Mừng.
- source_word: Ἴδε
  choice: Kìa
  rationale: Là thán từ thu hút sự chú ý; “Kìa” tự nhiên và trang trọng hơn cách cổ “Nầy, hãy xem” trong tiếng Việt hiện đại.
- source_word: νῦν
  choice: bây giờ
  rationale: Giữ trực tiếp ý thời điểm, cho thấy các môn đồ nhận thấy cách nói của Chúa Giê-su đã thay đổi.
- source_word: ἐν παρρησίᾳ
  choice: rõ ràng
  rationale: Trong thế đối lập với παροιμία, cụm từ chủ yếu chỉ cách nói minh bạch, trực tiếp; chú thích giữ lại các sắc thái “công khai” và “thẳng thắn”.
- source_word: λαλεῖς
  choice: Ngài nói
  rationale: Thì hiện tại diễn tả lời nhận xét về cách Chúa Giê-su đang nói ngay lúc ấy; tiếng Việt không cần thêm dấu hiệu tiếp diễn.
- source_word: παροιμίαν
  choice: một lối nói bóng gió
  rationale: Trong văn cảnh Giăng, từ này chỉ lời nói hình tượng hoặc gián tiếp hơn là chỉ riêng một câu châm ngôn; cách dịch này làm rõ sự tương phản với “rõ ràng” mà không thu hẹp quá mức.
- source_word: οὐδεμίαν
  choice: không ... nào
  rationale: Cấu trúc phủ định này chuyển tải tự nhiên và đầy đủ sắc thái phủ định của tiếng Hy Lạp.
- source_word: λέγεις
  choice: dùng
  rationale: Khi đi với “lối nói,” động từ “dùng” là cách diễn đạt tự nhiên trong tiếng Việt, dù nghĩa sát chữ của λέγω là “nói”.
theological_decisions:
- issue: Ý nghĩa của παρρησία khi đối lập với παροιμία
  choice: Các môn đồ mô tả Chúa Giê-su đang nói rõ ràng, trực tiếp, thay vì bằng lời bóng gió hay hình tượng.
  alternative: Ngài đang nói công khai hoặc thẳng thắn, mạnh dạn.
  rationale: Sự đối lập ngay trong câu nghiêng về tính minh bạch, trực tiếp của lời nói hơn là sự mạnh dạn. Chú thích vẫn bảo tồn phạm vi nghĩa rộng, không biến lựa chọn từ vựng thành một khẳng định giáo lý.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. “Môn đồ” và đại từ “Ngài” phù hợp văn phong Kinh Thánh phổ thông; câu đối thoại ngắn, tự nhiên. Các dấu chú thích được đặt ngay sau những từ ngữ mà chúng giải thích.
