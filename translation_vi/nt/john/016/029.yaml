revisions:
- from: 'Các môn đồ của Ngài nói: “Kìa, bây giờ Ngài nói rõ ràng[a], không dùng một lối nói bóng gió nào[b].”'
  to: 'Các môn đồ của Ngài nói: “Này, bây giờ Ngài nói rõ ràng[a], không dùng một lối nói bóng gió nào[b].”'
  rationale: Chỉ điều chỉnh cách gọi chú ý “Kìa” thành “Này” và làm tự nhiên hóa một phương án trong chú thích. Bản dịch vẫn giữ sự đối lập ngữ cảnh giữa nói rõ ràng và nói bằng lối nói hình tượng/gián tiếp, không thêm diễn giải giáo lý.
