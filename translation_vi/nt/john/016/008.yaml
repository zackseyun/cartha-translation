- from: Và khi Đấng ấy đến,[a] Ngài sẽ vạch rõ cho thế gian biết họ sai lầm về tội lỗi, về sự công chính[b] và về sự phán xét.
  to: Và khi Đấng ấy đến,[a] Ngài sẽ chứng minh cho thế gian thấy họ sai lầm về tội lỗi, về sự công chính[b] và về sự phán xét.
  rationale: Chỉ điều chỉnh cách diễn đạt ἐλέγξει để tiếng Việt tự nhiên hơn và phản ánh chính xác hơn ý chứng minh/phơi bày điều sai lầm. Các lựa chọn còn lại, kể cả vị trí chú thích và sự song song của ba cụm “về”, được giữ nguyên.
  reviewer_model: gpt-5.6-terra
