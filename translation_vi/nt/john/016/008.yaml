id: JHN.16.8
reference: John 16:8
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἐλθὼν ἐκεῖνος ἐλέγξει τὸν κόσμον περὶ ἁμαρτίας καὶ περὶ δικαιοσύνης καὶ περὶ κρίσεως·
base_translation:
  language: en
  yaml_path: translation/nt/john/016/008.yaml
  text: And when that one comes[c][b][a], he will convict the world concerning sin and concerning righteousness and concerning judgment.
translation:
  language: vi
  text: Và khi Đấng ấy đến,[a] Ngài sẽ chứng minh cho thế gian thấy họ sai lầm về tội lỗi, về sự công chính[b] và về sự phán xét.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “khi Ngài đến”; tiếng Hy Lạp dùng đại từ chỉ định có tính nhấn mạnh, chỉ về Đấng Bảo Trợ sắp đến.'
    reason: lexical_alternative
  - marker: b
    text: 'Hay: “công lý”.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐλθὼν
  choice: khi ... đến
  rationale: Phân từ bất định mang ý nghĩa thời gian; cách diễn đạt này tự nhiên trong tiếng Việt và giữ đúng quan hệ thời gian.
- source_word: ἐκεῖνος
  choice: Đấng ấy
  rationale: Đại từ chỉ định có tính nhấn mạnh và quy chiếu về Đấng Bảo Trợ trong văn cảnh. “Đấng ấy” giữ được sắc thái nhấn mạnh, đồng thời phù hợp với văn phong trang trọng.
- source_word: ἐλέγξει
  choice: sẽ vạch rõ cho ... biết họ sai lầm
  rationale: ἐλέγχω ở đây bao hàm việc phơi bày và chứng minh thế gian là sai, với sắc thái đạo đức–pháp lý. Cách dịch này rõ nghĩa hơn “kết tội”, vốn dễ bị hiểu là tuyên án.
- source_word: τὸν κόσμον
  choice: thế gian
  rationale: Giữ cách gọi rộng và giàu sắc thái thần học quen thuộc trong văn chương Giăng, không thu hẹp thành một nhóm người cụ thể.
- source_word: περὶ
  choice: về
  rationale: Từ này được lặp lại ba lần nhằm giữ kết cấu song song của nguyên văn.
- source_word: ἁμαρτίας
  choice: tội lỗi
  rationale: Giữ danh từ số ít mang nghĩa khái quát, để câu tiếp theo giải thích nội dung cụ thể.
- source_word: δικαιοσύνης
  choice: sự công chính
  rationale: Phù hợp với ý nghĩa rộng của δικαιοσύνη và với phần giải thích mang tính Kitô học ở câu 10; “công lý” được ghi nhận như một khả năng dịch khác.
- source_word: κρίσεως
  choice: sự phán xét
  rationale: Giữ sắc thái pháp lý và cánh chung mà không thu hẹp thành “sự kết án”, tức kết quả của phán xét.
theological_decisions:
- issue: Sở chỉ và sức nhấn mạnh của ἐκεῖνος
  choice: Dịch là “Đấng ấy”, chỉ về Đấng Bảo Trợ và giữ sức nhấn mạnh của đại từ chỉ định.
  alternative: Dịch đơn giản là “Ngài” hoặc “người ấy”.
  rationale: Văn cảnh trực tiếp xác định nhân vật sắp đến là Đấng Bảo Trợ; “Đấng ấy” phản ánh hình thức nhấn mạnh của tiếng Hy Lạp mà không thêm một khẳng định giáo lý ngoài văn bản.
- issue: Cách dịch δικαιοσύνη
  choice: sự công chính
  alternative: công lý
  rationale: “Sự công chính” bảo toàn phạm vi nghĩa và phù hợp hơn với lời giải thích ở câu 10 về việc Đức Chúa Jêsus đi đến cùng Cha; “công lý” vẫn là khả năng từ vựng nên được ghi ở chú thích.
- issue: Sức nghĩa của ἐλέγξει
  choice: vạch rõ cho thế gian biết họ sai lầm
  alternative: cáo trách thế gian; kết tội thế gian; chứng minh thế gian sai
  rationale: Động từ có thể bao gồm phơi bày, cáo trách và chứng minh có lỗi. Bản dịch chính giữ sự căng thẳng đó nhưng tránh mặc nhiên biến hành động này thành lời tuyên án cuối cùng.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “Đấng ấy” để giữ sức nhấn mạnh của nguyên văn; dùng “vạch rõ cho ... biết họ sai lầm” nhằm truyền đạt sắc thái phơi bày/chứng minh sai của ἐλέγχω mà không thu hẹp thành tuyên án.
