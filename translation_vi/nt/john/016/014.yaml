revisions:
- from: Đấng ấy sẽ làm vinh hiển tôi, vì Ngài sẽ nhận lấy[a] điều thuộc về tôi và công bố cho anh em.
  to: Đấng ấy sẽ tôn vinh tôi, vì Ngài sẽ lấy từ những gì thuộc về tôi[a] và loan báo điều đó cho anh em.
  rationale: Bản sửa bổ sung “từ” để dịch rõ ἐκ, chuyển sang “tôn vinh” theo cách dùng hiện đại tự nhiên trong thuật ngữ Kinh Thánh, và thêm “điều đó” để câu đích rõ tân ngữ. “Những gì thuộc về tôi” duy trì phạm vi không xác định của nguyên văn; chú thích bảo lưu lựa chọn từ vựng “nhận.”
  reviewer_model: gpt-5.6-terra
