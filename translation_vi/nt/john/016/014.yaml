review_pass:
  verdict: revise
  source_fidelity: Bản thảo truyền đạt đúng chủ thể, quan hệ nguyên nhân, ý tôn vinh, và đối tượng số nhiều. Tuy nhiên, cụm “sẽ nhận lấy điều thuộc về tôi” không biểu thị rõ giới từ ἐκ (“từ”), vốn xác định nguồn mà Đấng ấy nhận/lấy. Cần dịch rõ “từ những gì thuộc về tôi.”
  naturalness: “Tôn vinh tôi” là cách nói hiện đại, tự nhiên và quen thuộc hơn “làm vinh hiển tôi” trong văn mạch Gio-an. Việc nêu lại tân ngữ bằng “điều đó” sau “loan báo” giúp câu tiếng Việt trọn ý mà vẫn chỉ điều được lấy từ những gì thuộc về Chúa Giê-su.
  terminology: Giữ “Đấng ấy” và “Ngài” là phù hợp với quy chiếu ngôi vị về Đấng Bảo Trợ/Thần Khí trong văn cảnh. “Tôn vinh” bảo toàn trọng lượng của δοξάζω mà không diễn giải giáo lý. “Những gì thuộc về tôi” giữ tính mở của τὸ ἐμόν, không xác định nội dung là giáo huấn, quyền năng, hay mặc khải.
  issues:
  - severity: medium
    issue: Thiếu sắc thái nguồn của giới từ ἐκ trong “sẽ nhận lấy điều thuộc về tôi”.
    rationale: ἐκ τοῦ ἐμοῦ nghĩa là “từ những gì thuộc về tôi,” không chỉ đơn thuần là nhận chính “điều thuộc về tôi.” Thêm “từ” bảo toàn quan hệ cú pháp và ý nghĩa của nguyên văn.
  - severity: low
    issue: “Công bố cho anh em” để tân ngữ hoàn toàn hàm ẩn.
    rationale: Tân ngữ có thể được hiểu từ văn cảnh, nhưng thêm “điều đó” làm câu tiếng Việt tự nhiên, rõ ràng hơn và phản ánh tân ngữ được hàm ẩn trong tiếng Hy Lạp.
  revised_text: Đấng ấy sẽ tôn vinh tôi, vì Ngài sẽ lấy từ những gì thuộc về tôi[a] và loan báo điều đó cho anh em.
