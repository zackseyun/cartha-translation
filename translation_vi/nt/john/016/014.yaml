id: JHN.16.14
reference: John 16:14
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐκεῖνος ἐμὲ δοξάσει, ὅτι ἐκ τοῦ ἐμοῦ λήμψεται καὶ ἀναγγελεῖ ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/014.yaml
  text: He will glorify me[a], because he will take from what is mine and declare it to you.
translation:
  language: vi
  text: Đấng ấy sẽ tôn vinh tôi, vì Ngài sẽ lấy từ những gì thuộc về tôi[a] và loan báo điều đó cho anh em.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “sẽ nhận từ những gì thuộc về tôi.”'
    reason: λαμβάνω có thể được hiểu là “lấy” hoặc “nhận”; cả hai đều phù hợp với cấu trúc Hy Lạp.
lexical_decisions:
- source_word: ἐκεῖνος
  choice: Đấng ấy
  rationale: Đại từ chỉ định này quy chiếu về Thần Khí trong văn cảnh trước. “Đấng ấy” giữ được sắc thái chỉ định và tính ngôi vị, đồng thời phù hợp với văn phong trang trọng hiện đại.
- source_word: ἐμὲ
  choice: tôi
  rationale: Đại từ ngôi thứ nhất số ít làm tân ngữ của δοξάσει; “tôi” là cách dịch trực tiếp và tự nhiên trong lời Đức Giê-su.
- source_word: δοξάσει
  choice: sẽ làm vinh hiển
  rationale: Giữ sức nặng của δοξάζω trong văn mạch Gio-an, nơi ý nghĩa và vinh quang của Đức Giê-su được bày tỏ, chứ không chỉ là sự tôn trọng theo nghĩa thông thường.
- source_word: ὅτι
  choice: vì
  rationale: Ở đây liên từ nêu lý do Đấng ấy sẽ làm vinh hiển Đức Giê-su; “vì” diễn đạt rõ quan hệ nguyên nhân.
- source_word: ἐκ τοῦ ἐμοῦ
  choice: điều thuộc về tôi
  rationale: Cấu trúc có mạo từ trung tính với tính từ sở hữu chỉ điều hoặc những gì thuộc về Đức Giê-su. Cách dịch này không thu hẹp đối tượng thành một nội dung cụ thể như giáo huấn, quyền năng hay mặc khải.
- source_word: λήμψεται
  choice: sẽ nhận lấy
  rationale: λαμβάνω có thể mang nghĩa “nhận lấy” hoặc “lấy”. Trong tiếng Việt, “nhận lấy điều thuộc về tôi” tự nhiên và vẫn giữ ý Đấng ấy tiếp nhận từ điều thuộc về Đức Giê-su; nghĩa “lấy” được ghi ở chú thích.
- source_word: ἀναγγελεῖ
  choice: công bố
  rationale: ἀναγγέλλω có nghĩa loan báo, thuật lại hoặc làm cho biết. “Công bố” giữ sắc thái trang trọng và rõ ràng; tân ngữ được hiểu từ cụm “điều thuộc về tôi” ngay trước đó.
- source_word: ὑμῖν
  choice: cho anh em
  rationale: Đại từ ngôi thứ hai số nhiều chỉ các môn đồ. “Anh em” thể hiện rõ số nhiều và phù hợp với cách Đức Giê-su trực tiếp nói với họ.
theological_decisions:
- issue: Mối liên hệ giữa Đấng ấy và Đức Giê-su trong cụm ἐκ τοῦ ἐμοῦ λήμψεται
  choice: sẽ nhận lấy điều thuộc về tôi
  alternative: sẽ nhận từ tôi; sẽ lấy điều thuộc về tôi
  rationale: 'Cách dịch giữ phạm vi rộng của câu Hy Lạp: Đấng ấy truyền đạt điều thuộc về Đức Giê-su, nhưng không biến câu này thành một phát biểu kỹ thuật về quan hệ nội tại trong Ba Ngôi hoặc xác định quá mức nội dung được nhận.'
- issue: Sắc thái ngôi vị của ἐκεῖνος
  choice: Đấng ấy … Ngài
  alternative: Vị ấy … vị ấy; Người … Người
  rationale: “Đấng ấy” bảo lưu sắc thái chỉ định của từ Hy Lạp, còn “Ngài” ở mệnh đề tiếp theo tránh lặp nặng nề và phù hợp với đối tượng là Thần Khí trong văn cảnh, mà không thêm danh xưng không có trong câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Làm vinh hiển” giữ thuật ngữ thần học quen thuộc mà không quá cổ; “điều thuộc về tôi” bảo toàn tính khái quát của nguyên văn. Đại từ “anh em” làm rõ đối tượng số nhiều là các môn đồ.
