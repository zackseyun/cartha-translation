id: JHN.16.17
reference: John 16:17
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἶπαν οὖν ἐκ τῶν μαθητῶν αὐτοῦ πρὸς ἀλλήλους· Τί ἐστιν τοῦτο ὃ λέγει ἡμῖν· Μικρὸν καὶ οὐ θεωρεῖτέ με, καὶ πάλιν μικρὸν καὶ ὄψεσθέ με; καί· ⸀Ὅτι ὑπάγω πρὸς τὸν πατέρα;
base_translation:
  language: en
  yaml_path: translation/nt/john/016/017.yaml
  text: 'So some of his disciples said to one another[a], “What is this that he is saying to us: ‘A little while, and you will not see me, and again a little while, and you will see me’? And, ‘Because I am going to the Father’?”'
translation:
  language: vi
  text: 'Vì vậy, một số môn đồ của Ngài nói với nhau: “Lời Ngài nói với chúng ta có nghĩa gì: ‘Ít lâu nữa, các con sẽ không thấy Ta; và lại ít lâu nữa, các con sẽ thấy Ta’? Và: ‘Vì Ta đi về với Cha’?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Và: ‘Rằng Ta đi về với Cha’?” Từ ὅτι trong tiếng Hy Lạp có thể dẫn vào nội dung được trích dẫn (“rằng”) hoặc mang nghĩa nguyên nhân (“vì”).'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Vì vậy
  rationale: Nối câu hỏi của các môn đồ với lời Đức Chúa Jêsus vừa phán, giữ sắc thái suy luận đồng thời vẫn tự nhiên trong tiếng Việt.
- source_word: ἐκ τῶν μαθητῶν αὐτοῦ
  choice: một số môn đồ của Ngài
  rationale: 'Giữ sắc thái bộ phận của ἐκ: chỉ một số người trong nhóm môn đồ, không nhất thiết là tất cả.'
- source_word: πρὸς ἀλλήλους
  choice: nói với nhau
  rationale: Diễn đạt tự nhiên ý tương hỗ của πρὸς ἀλλήλους.
- source_word: Τί ἐστιν τοῦτο ὃ λέγει ἡμῖν
  choice: Lời Ngài nói với chúng ta có nghĩa gì
  rationale: Chuyển cấu trúc Hy Lạp sang câu hỏi tiếng Việt tự nhiên, đồng thời giữ rõ sự bối rối của các môn đồ trước lời đang được nói.
- source_word: Μικρὸν
  choice: Ít lâu nữa
  rationale: Trong văn cảnh, từ này chỉ một khoảng thời gian ngắn; cách dịch này tự nhiên và phù hợp với sự lặp lại trong câu.
- source_word: θεωρεῖτέ / ὄψεσθέ
  choice: thấy / thấy
  rationale: Hai động từ Hy Lạp khác nhau nhưng cùng thuộc trường nghĩa nhìn thấy trong phép đối xứng của câu; dùng cùng một từ tiếng Việt để giữ nhịp lặp tu từ mà không áp đặt khác biệt thần học.
- source_word: πάλιν
  choice: rồi
  rationale: Trong cấu trúc thời gian này, “rồi” diễn đạt tự nhiên bước tiếp theo; ý tái diễn vẫn được thể hiện qua vế “các con sẽ thấy Ta” sau lần không thấy.
- source_word: Ὅτι ὑπάγω πρὸς τὸν πατέρα
  choice: Vì Ta đi đến cùng Cha
  rationale: Giữ cách hiểu nhân quả thông dụng của ὅτι và giữ nguyên “Cha” với mạo từ, không thêm đại từ sở hữu không có trong bản Hy Lạp.
theological_decisions:
- issue: Lời nói về việc không thấy rồi lại thấy Đức Chúa Jêsus ám chỉ biến cố nào
  choice: Không xác định trong bản dịch
  alternative: Sự chết và phục sinh; thăng thiên và sự hiện diện thuộc linh; các lần hiện ra sau phục sinh
  rationale: Câu này thuật lại sự bối rối của các môn đồ và chưa giải thích đối tượng quy chiếu; bản dịch không nên tự ý giải quyết sự căng thẳng thần học ấy.
- issue: Chức năng của ὅτι trước ὑπάγω πρὸς τὸν πατέρα
  choice: 'Hiểu theo nghĩa nguyên nhân: “Vì Ta đi đến cùng Cha”'
  alternative: 'Hiểu là từ nối dẫn nội dung trích dẫn: “Rằng Ta đi đến cùng Cha”'
  rationale: Cả hai cách phân tích đều có thể có về mặt cú pháp. Bản chính chọn nghĩa nhân quả theo mạch câu, còn cách hiểu dẫn nội dung được bảo tồn trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” trong lời dẫn và “Ta/các con” trong lời Đức Chúa Jêsus để phân biệt ngôi xưng hô rõ ràng. Dấu chú thích [a] đặt sau toàn bộ câu hỏi vì chú thích liên quan đến cách hiểu mệnh đề cuối.
