  text: ἕως ἄρτι οὐκ ᾐτήσατε οὐδὲν ἐν τῷ ὀνόματί μου· αἰτεῖτε καὶ λήμψεσθε, ἵνα ἡ χαρὰ ὑμῶν ᾖ πεπληρωμένη.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/024.yaml
  text: Until now you have asked for nothing in my name[a]. Ask, and you will receive[c][b], so that your joy may be full.
translation:
  language: vi
  text: Cho đến bây giờ, anh em chưa cầu xin điều gì nhân danh tôi. Hãy cầu xin[a], thì anh em sẽ nhận được, để niềm vui của anh em được trọn vẹn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Động từ ở dạng mệnh lệnh hiện tại cũng có thể hàm ý: “Hãy cứ cầu xin.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕως ἄρτι
  choice: Cho đến bây giờ
  rationale: Diễn đạt tự nhiên mốc thời gian kéo dài tới hiện tại.
- source_word: οὐκ ᾐτήσατε οὐδὲν
  choice: anh em chưa cầu xin điều gì
  rationale: Trong tiếng Việt, cấu trúc “chưa… điều gì” tự nhiên và truyền đạt đúng ý phủ định “không cầu xin bất cứ điều gì”; “cầu xin” phù hợp ngữ cảnh lời cầu nguyện.
- source_word: ἐν τῷ ὀνόματί μου
  choice: nhân danh tôi
  rationale: Cách nói quen thuộc, trang trọng, giữ nguyên phạm vi ý nghĩa phong phú của thành ngữ Gioan thay vì thu hẹp thành một cách giải thích.
- source_word: αἰτεῖτε
  choice: Hãy cầu xin
  rationale: Mệnh lệnh hiện tại có thể mang sắc thái tiếp diễn hoặc lặp lại, nhưng câu chính không diễn giải quá mức; khả năng ấy được ghi ở chú thích.
- source_word: λήμψεσθε
  choice: anh em sẽ nhận được
  rationale: Phản ánh trực tiếp thì tương lai và phù hợp tự nhiên với hành động cầu xin.
- source_word: ἵνα ἡ χαρὰ ὑμῶν ᾖ πεπληρωμένη
  choice: để niềm vui của anh em được trọn vẹn
  rationale: Giữ quan hệ mục đích/kết quả của ἵνα và trạng thái hoàn tất của kết cấu hoàn thành; “được trọn vẹn” tự nhiên hơn lối dịch sát cứng “được làm cho đầy”.
theological_decisions:
- issue: Ý nghĩa của việc cầu xin “nhân danh tôi”
  choice: Giữ nguyên thành ngữ “nhân danh tôi” mà không mở rộng trong câu chính.
  alternative: thay mặt tôi; dưới thẩm quyền của tôi; trong sự hiệp nhất với tôi
  rationale: Cụm từ có nội hàm thần học rộng, liên hệ đến thân vị, thẩm quyền và sứ mạng của Đức Giê-su; không nên giới hạn vào một cách giải thích.
- issue: Phạm vi của lời hứa “sẽ nhận được”
  choice: Giữ lời khẳng định nguyên dạng, không bổ sung điều kiện giải thích.
  alternative: Thêm các điều kiện thần học được suy ra từ những đoạn khác về lời cầu nguyện.
  rationale: Câu Hy Lạp không nêu điều kiện tại đây; bản dịch cần bảo toàn sức mạnh và sự căng thẳng của lời hứa trong văn mạch.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” cho đại từ số nhiều ὑμῶν và chủ ngữ hàm ẩn số nhiều, tránh cách xưng hô vùng miền; dùng “tôi” theo lời trực tiếp của Đức Giê-su.
