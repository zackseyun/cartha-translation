  rationale: Bản sửa chỉ cải thiện cách diễn đạt tiếng Việt của hướng chuyển động và điều chỉnh chú thích cho tự nhiên, thận trọng hơn. Các yếu tố nghĩa của bản Hy Lạp—chủ đề “sự công chính”, lý do “vì”, việc đi đến Cha, và việc các môn đệ không còn thấy Đức Giê-su—đều được giữ nguyên.
