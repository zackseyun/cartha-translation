base_translation:
  language: en
  yaml_path: translation/nt/john/016/010.yaml
  text: and concerning righteousness[a], because I am going to the Father and you no longer see me.
translation:
  language: vi
  text: Còn về sự công chính[a], vì tôi đi về cùng Cha, và anh em không còn thấy tôi nữa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “công lý”. Từ Hy Lạp này có thể chỉ cả sự công chính lẫn công lý; trong ngữ cảnh này, “sự công chính” phù hợp với việc Đức Giê-su đi về cùng Cha, qua đó cho thấy Ngài được minh chứng là đúng.
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ δικαιοσύνης δέ
  choice: còn về sự công chính
  rationale: “Còn về” tiếp nối tự nhiên mục thứ hai trong chuỗi các mệnh đề περὶ ở câu 9–11; “sự công chính” giữ được sắc thái về điều đúng đắn và sự được xác nhận là đúng trong ngữ cảnh.
- source_word: ὅτι
  choice: vì
  rationale: ὅτι đưa ra lý do, nên “vì” diễn đạt rõ quan hệ nhân quả.
- source_word: πρὸς τὸν πατέρα
  choice: đến với Cha
  rationale: πρός với động từ chỉ sự chuyển đi diễn tả hướng đến; “đến với Cha” tự nhiên trong tiếng Việt và không thêm đại từ sở hữu vốn không có trong bản Hy Lạp.
- source_word: ὑπάγω
  choice: tôi đi
  rationale: Thì hiện tại có ý hướng tương lai gần trong ngữ cảnh; “tôi đi” giữ cách nói trực tiếp, không diễn giải quá mức thành “lìa khỏi” hay “trở về”.
- source_word: οὐκέτι θεωρεῖτέ με
  choice: anh em không còn thấy tôi nữa
  rationale: “Không còn… nữa” diễn đạt sự chấm dứt do οὐκέτι; “thấy” là cách dịch rõ ràng, tự nhiên của θεωρέω trong ngữ cảnh thị giác.
theological_decisions:
- issue: Ý nghĩa của δικαιοσύνη trong ngữ cảnh thần học
  choice: sự công chính
  alternative: sự công lý
  rationale: δικαιοσύνη có thể chỉ cả sự công chính lẫn công lý. Ở đây, việc Đức Giê-su đi đến với Cha hàm ý Ngài được xác nhận là đúng/công chính, nên “sự công chính” phù hợp hơn nhưng không loại bỏ nghĩa rộng hơn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “tôi—anh em” phù hợp lời Đức Giê-su nói trực tiếp với các môn đệ; không viết hoa đại từ chỉ Đức Giê-su. Cấu trúc “còn về…” giữ liên kết với chuỗi ba chủ đề ở các câu 9–11.
