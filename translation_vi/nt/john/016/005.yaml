source:
  edition: SBLGNT
  text: νῦν δὲ ὑπάγω πρὸς τὸν πέμψαντά με καὶ οὐδεὶς ἐξ ὑμῶν ἐρωτᾷ με· Ποῦ ὑπάγεις;
base_translation:
  language: en
  yaml_path: translation/nt/john/016/005.yaml
  text: But now I am going to the one who sent me, and none of you asks me, ‘Where are you going?’
translation:
  language: vi
  text: 'Nhưng bây giờ, tôi đi đến với Đấng đã sai tôi, và không ai trong các anh hỏi tôi: “Thầy đi đâu?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νῦν δὲ
  choice: Nhưng bây giờ
  rationale: Giữ sắc thái chuyển ý tương phản của δέ và diễn đạt tự nhiên trong tiếng Việt.
- source_word: ὑπάγω
  choice: tôi đi
  rationale: Diễn đạt trực tiếp động từ chỉ sự đi đến một nơi khác; ngữ cảnh cho thấy hành động sắp diễn ra mà không cần thêm ý 'rời bỏ'.
- source_word: πρὸς τὸν πέμψαντά με
  choice: đến Đấng đã sai tôi
  rationale: Giữ cấu trúc phân từ có mạo từ chỉ một nhân vật cụ thể, đồng thời không tự ý thêm 'Cha', vốn không xuất hiện trong câu Hy Lạp.
- source_word: οὐδεὶς ἐξ ὑμῶν
  choice: không ai trong các anh
  rationale: Chuyển tải tự nhiên cấu trúc bộ phận và sự phủ định tuyệt đối.
- source_word: ἐρωτᾷ με
  choice: hỏi tôi
  rationale: Trong ngữ cảnh này, ἐρωτάω nói về việc đặt câu hỏi.
- source_word: Ποῦ ὑπάγεις;
  choice: Thầy đi đâu?
  rationale: Câu hỏi tự nhiên trong tiếng Việt; đại từ 'Thầy' phù hợp với lời các môn đồ trực tiếp thưa với Chúa Giê-su.
theological_decisions:
- issue: Danh tính của τὸν πέμψαντά με
  choice: Đấng đã sai tôi
  alternative: Cha, Đấng đã sai tôi
  rationale: Nguồn Hy Lạp không nêu rõ 'Cha' trong mệnh đề này, nên bản dịch giữ cách gọi khái quát nhưng xác định, tránh đưa phần nhận diện theo thần học vào chính văn.
- issue: Sự khác biệt giữa lời này và các câu hỏi trước đó của Phi-e-rơ và Tô-ma
  choice: Không thêm lời giải thích vào chính văn
  alternative: Diễn giải là không ai hỏi về đích đến theo ý nghĩa sâu xa
  rationale: Câu văn tạo ra một căng thẳng có thật với Giăng 13:36 và 14:5; bản dịch không âm thầm giải quyết căng thẳng ấy bằng cách thêm ý không có trong nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng 'tôi/các anh' trong lời Đức Giê-su nói với các môn đồ, và 'Thầy' trong câu hỏi được trích dẫn để thể hiện quan hệ thầy–trò tự nhiên trong tiếng Việt. Không có chú thích nên không dùng ký hiệu chú thích.
