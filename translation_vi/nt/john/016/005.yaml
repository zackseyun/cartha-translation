  to: 'Nhưng bây giờ, tôi đi đến với Đấng đã sai tôi, và không ai trong các anh hỏi tôi: “Thầy đi đâu?”'
  rationale: Sửa hai điểm diễn đạt nhỏ để liên từ sát với καί và cụm chỉ hướng đến một ngôi vị tự nhiên hơn. Bản sửa vẫn giữ thì hiện tại có sắc thái hướng tới, không thay «Đấng đã sai tôi» bằng «Cha», và không giải thích hay dung hòa căng thẳng với các câu hỏi ở những đoạn trước.
