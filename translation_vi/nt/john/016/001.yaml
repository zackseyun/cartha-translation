  text: I have spoken these things to you so that you may not fall away.
translation:
  language: vi
  text: Thầy đã nói với anh em những điều này để anh em không bị vấp ngã.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “không bị làm cho vấp ngã,” “không sa ngã,” hoặc “không bị xúc phạm.” Động từ Hy Lạp có thể chỉ việc bị vấp ngã đến nỗi mất lòng tin hoặc lìa bỏ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταῦτα
  choice: những điều này
  rationale: Giữ số nhiều trung tính của đại từ chỉ định và chỉ về những lời Đức Giê-su vừa phán trước đó.
- source_word: λελάληκα
  choice: đã nói
  rationale: Diễn đạt tự nhiên thì hoàn thành của λαλέω trong tiếng Việt, cho thấy những lời đã được nói và vẫn có ý nghĩa đối với người nghe.
- source_word: ὑμῖν
  choice: với anh em
  rationale: Thể hiện ngôi thứ hai số nhiều; cặp xưng hô “Thầy—anh em” phù hợp quan hệ giữa Đức Giê-su và các môn đồ trong văn cảnh mà vẫn dễ hiểu trong tiếng Việt hiện đại.
- source_word: ἵνα μὴ
  choice: để ... không
  rationale: Giữ rõ ý mục đích của mệnh đề ἵνα cùng với sự phủ định μὴ.
- source_word: σκανδαλισθῆτε
  choice: bị vấp ngã
  rationale: Giữ hình ảnh ẩn dụ và sắc thái bị tác động của dạng thụ động, đồng thời không thu hẹp nghĩa chỉ còn sự xúc phạm hay quyết định lìa bỏ đức tin.
theological_decisions:
- issue: Ý nghĩa của σκανδαλισθῆτε trong bối cảnh môn đồ sắp chịu bắt bớ
  choice: không bị vấp ngã
  alternative: không lìa bỏ đức tin; không bị làm cho sa ngã; không thấy chướng tai
  rationale: “Bị vấp ngã” giữ được hình ảnh của động từ Hy Lạp và sự căng thẳng giữa chao đảo, sa ngã và lìa bỏ đức tin. Văn cảnh kế tiếp làm cho hậu quả thuộc linh trở nên nghiêm trọng, nhưng câu này tự nó không nhất thiết chỉ rõ sự bội đạo hoàn toàn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cặp xưng hô “Thầy—anh em” làm rõ quan hệ trong văn cảnh, còn “bị vấp ngã” bảo tồn hình ảnh và độ mở nghĩa của nguyên văn.
