  text: ἔλεγον οὖν· ⸂Τί ἐστιν τοῦτο⸃ ὃ ⸀λέγει μικρόν; οὐκ οἴδαμεν τί λαλεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/018.yaml
  text: So they were saying[a], “What is this that he says, ‘A little while’? We do not know what he is saying.”
translation:
  language: vi
  text: 'Vì thế, họ cứ nói[a]: “Cái ‘một ít lâu’ mà thầy nói là gì vậy? Chúng ta không biết thầy đang nói gì.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hoặc “họ nói”.
    reason: Biến thể này dịch ἔλεγον ít nhấn mạnh hơn vào tính tiếp diễn hoặc lặp lại của thì chưa hoàn thành.
lexical_decisions:
- source_word: ἔλεγον
  choice: họ cứ nói
  rationale: Thì chưa hoàn thành diễn tả lời nói đang tiếp diễn hoặc lặp lại; “cứ nói” truyền đạt sắc thái ấy tự nhiên trong tiếng Việt.
- source_word: οὖν
  choice: Vì thế
  rationale: Giữ mối liên kết suy luận hoặc tiếp nối với lời vừa nêu trong ngữ cảnh.
- source_word: Τί ἐστιν τοῦτο
  choice: là gì vậy?
  rationale: Giữ hình thức câu hỏi trực tiếp và sự bối rối của các môn đồ, thay vì giải nghĩa rõ hơn thành “có nghĩa là gì”.
- source_word: ὃ λέγει μικρόν
  choice: Điều thầy nói—‘một ít lâu’
  rationale: Giữ μικρόν như cụm từ được trích dẫn và đặt nổi bật trong câu hỏi. “Thầy” là cách xưng gọi tự nhiên của các môn đồ đối với Chúa Giê-su trong tiếng Việt, thay cho đại từ ngôi ba dễ gây xa cách hoặc mơ hồ.
- source_word: μικρόν
  choice: một ít lâu
  rationale: Trong văn cảnh, từ này chỉ một khoảng thời gian ngắn; cách dịch này ngắn gọn và phù hợp với sự lặp lại của cụm từ trong đoạn.
- source_word: οὐκ οἴδαμεν
  choice: Chúng ta không biết
  rationale: Diễn đạt trực tiếp nghĩa phủ định của οἶδα với giá trị hiện tại.
- source_word: τί λαλεῖ
  choice: thầy đang nói gì
  rationale: Phản ánh trực tiếp hành động nói, đồng thời giữ nguyên sự chưa hiểu của các môn đồ mà không diễn giải thành “thầy muốn nói gì”.
theological_decisions: []
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Dấu gạch ngang làm nổi bật cụm từ đang khiến các môn đồ thắc mắc; câu dịch giữ sự lặp lại của động từ “nói” như trong nguyên bản.
