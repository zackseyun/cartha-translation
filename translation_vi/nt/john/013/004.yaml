    rationale: διέζωσεν ἑαυτόν nghĩa là “tự thắt/quấn [khăn] quanh mình.” Trong tiếng Việt, “thắt ngang lưng” có thể được hiểu là chỉ tư thế hay vị trí, nhưng không xác định rõ chiếc khăn là vật được quấn.
