- from: Ngài đứng dậy khỏi bàn ăn[a], cởi áo ngoài ra, rồi lấy một chiếc khăn và thắt ngang lưng[b].
  to: Ngài đứng dậy khỏi bàn ăn[a], cởi áo ngoài, rồi lấy một chiếc khăn quấn quanh người[b].
  rationale: Chỉnh cụm cuối thành “quấn quanh người” để nêu rõ chiếc khăn là vật được dùng và bảo toàn ý phản thân của động từ Hy Lạp. Bỏ “ra” sau “cởi áo ngoài” để câu gọn, tự nhiên hơn, không thay đổi nghĩa.
  reviewer_model: gpt-5.6-terra
