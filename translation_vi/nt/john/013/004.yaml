base_translation:
  language: en
  yaml_path: translation/nt/john/013/004.yaml
  text: He rises from the supper and lays aside his outer garments[a], and taking a towel[b], tied it around himself.
translation:
  language: vi
  text: Ngài đứng dậy khỏi bàn ăn[a], cởi áo ngoài, rồi lấy một chiếc khăn quấn quanh người[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát nghĩa: “khỏi bữa ăn.”'
    reason: lexical_alternative
  - marker: b
    text: 'Hay: “tự thắt khăn quanh mình.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγείρεται
  choice: đứng dậy
  rationale: Diễn đạt tự nhiên hành động rời tư thế tại bàn; tiếng Việt không cần đánh dấu riêng thì hiện tại lịch sử của lối kể Hy Lạp.
- source_word: ἐκ τοῦ δείπνου
  choice: khỏi bàn ăn
  rationale: Cách nói tự nhiên trong tiếng Việt cho việc đứng dậy giữa bữa ăn; chú thích giữ sát hình thức 'khỏi bữa ăn' của nguyên văn.
- source_word: τίθησιν τὰ ἱμάτια
  choice: cởi áo ngoài ra
  rationale: Trong ngữ cảnh này τίθημι mang nghĩa đặt/cởi sang một bên, còn ἱμάτια chỉ y phục ngoài; cách dịch tránh hàm ý Ngài cởi hết quần áo.
- source_word: λαβὼν λέντιον
  choice: lấy một chiếc khăn
  rationale: λέντιον là khăn vải dùng khi phục vụ; 'một chiếc khăn' rõ ràng và tự nhiên trong tiếng Việt hiện đại.
- source_word: διέζωσεν ἑαυτόν
  choice: thắt ngang lưng
  rationale: Diễn đạt hành động dùng chiếc khăn vừa nhắc đến để quấn/thắt vào người; 'ngang lưng' truyền đạt tự nhiên ý gird mà không dùng từ cổ.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” theo ngữ cảnh chỉ Đức Giê-su. Chuỗi động từ gọn, tự nhiên trong lời kể tiếng Việt; không cố tái tạo thì hiện tại lịch sử bằng một cấu trúc khiên cưỡng.
