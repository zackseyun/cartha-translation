id: JHN.13.37
reference: John 13:37
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ⸀ὁ Πέτρος· Κύριε, διὰ τί οὐ δύναμαί σοι ⸀ἀκολουθῆσαι ἄρτι; τὴν ψυχήν μου ὑπὲρ σοῦ θήσω.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/037.yaml
  text: Peter said to him[a], “Lord[b], why am I not able to follow you now? I will lay down my life for you.”
translation:
  language: vi
  text: 'Phê-rô thưa với Ngài: “Lạy Chúa, tại sao bây giờ con không thể theo Ngài được?[a] Con sẽ hiến mạng sống[b] mình vì Ngài.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Tại sao con không thể theo Ngài ngay lúc này?”'
    reason: lexical_alternative
  - marker: b
    text: Tiếng Hy Lạp theo nghĩa đen là “linh hồn tôi”; trong thành ngữ này, ý nghĩa là “mạng sống tôi”.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει αὐτῷ ὁ Πέτρος
  choice: Phê-rô thưa với Ngài
  rationale: Dùng “thưa” để diễn đạt lời nói trực tiếp đầy kính trọng của Phê-rô với Đức Chúa Jêsus; thì hiện tại lịch sử của λέγει được chuyển thành lối kể tự nhiên trong tiếng Việt. “Ngài” phù hợp với ngôi xưng hô trong văn cảnh.
- source_word: Κύριε
  choice: Lạy Chúa
  rationale: Giữ cách xưng hô kính trọng và sức nặng thần học có thể có của κύριος mà không xác định quá mức ý nghĩa trong câu.
- source_word: διὰ τί οὐ δύναμαί σοι ἀκολουθῆσαι ἄρτι
  choice: tại sao bây giờ con không thể theo Ngài được?
  rationale: “Theo Ngài” bảo toàn cả nghĩa đi theo về phương diện không gian lẫn sắc thái làm môn đồ; “bây giờ” diễn đạt ἄρτι một cách tự nhiên.
- source_word: τὴν ψυχήν μου
  choice: mạng sống mình
  rationale: Trong thành ngữ với τίθημι, ψυχή chỉ mạng sống được trao đi trong cái chết, chứ không chủ yếu nói về “linh hồn” theo nghĩa siêu hình.
- source_word: ὑπὲρ σοῦ θήσω
  choice: sẽ hiến ... vì Ngài
  rationale: “Hiến mạng sống” diễn đạt tự nhiên thành ngữ τίθημι τὴν ψυχήν; “vì Ngài” giữ cho ὑπέρ đủ rộng, không buộc phải hiểu là thay thế hay chỉ đơn thuần vì lợi ích.
theological_decisions:
- issue: Ý nghĩa của ψυχή trong lời tuyên bố của Phê-rô
  choice: mạng sống
  alternative: linh hồn
  rationale: Văn cảnh nói đến sự sẵn lòng chết vì Đức Chúa Jêsus. “Linh hồn” dễ tạo sắc thái siêu hình không phải trọng tâm của thành ngữ Hy Lạp tại đây.
- issue: Sắc thái của ἀκολουθέω
  choice: theo
  alternative: đi cùng
  rationale: “Theo” giữ được đồng thời ý nghĩa di chuyển và ý nghĩa làm môn đồ trong sách Giăng, không làm phẳng sự căng thẳng thần học của lời đối thoại.
- issue: Sắc thái của ὑπέρ
  choice: vì Ngài
  alternative: thay cho Ngài
  rationale: Bản dịch không thu hẹp ὑπέρ thành ý nghĩa thay thế; lời của Phê-rô có thể nói đến việc chết vì lợi ích, vì lòng trung thành, hoặc thay cho Đức Chúa Jêsus.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cặp xưng hô “con–Ngài” cùng từ “thưa” thể hiện sự kính trọng của môn đồ đối với Chúa. “Phê-rô” là dạng tên quen thuộc rộng rãi trong tiếng Việt; câu giữ nhịp đối thoại trực tiếp và sự tự tin mạnh mẽ trong lời tuyên bố của ông.
