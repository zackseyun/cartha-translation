  text: ⸀ἀποκρίνεται Ἰησοῦς· Τὴν ψυχήν σου ὑπὲρ ἐμοῦ θήσεις; ἀμὴν ἀμὴν λέγω σοι, οὐ μὴ ἀλέκτωρ φωνήσῃ ἕως οὗ ⸀ἀρνήσῃ με τρίς.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/038.yaml
  text: Jesus answered[a], “Will you lay down your life for me? Truly, truly, I say to you, the rooster will certainly not crow until you have denied me three times.”
translation:
  language: vi
  text: 'Giê-su đáp: “Anh sẽ hy sinh mạng sống mình vì tôi sao?[a] Thật vậy, thật vậy, tôi bảo anh: gà sẽ nhất định không gáy cho đến khi anh đã chối tôi ba lần.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay “linh hồn”: từ Hy Lạp ψυχή có thể có nghĩa là “linh hồn” hoặc “mạng sống”; trong ngữ cảnh này, nghĩa là hy sinh chính mạng sống mình.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκρίνεται
  choice: đáp
  rationale: Thì hiện tại lịch sử trong tiếng Hy Lạp được chuyển sang lối kể tự nhiên của tiếng Việt; “đáp” gọn và phù hợp vì đây là lời hồi đáp trực tiếp.
- source_word: Τὴν ψυχήν σου ... θήσεις
  choice: con sẽ hy sinh mạng sống
  rationale: Thành ngữ τίθημι τὴν ψυχήν nói đến việc tự nguyện phó bỏ sự sống. “Hy sinh mạng sống” truyền đạt rõ ý chịu chết vì người khác, đồng thời tự nhiên hơn cách dịch sát chữ “đặt xuống mạng sống” trong tiếng Việt.
- source_word: ὑπὲρ ἐμοῦ
  choice: vì Ta
  rationale: ὑπέρ ở đây diễn tả sự hy sinh vì lợi ích hoặc thay cho người khác; “vì Ta” ngắn gọn và tự nhiên.
- source_word: ἀμὴν ἀμὴν
  choice: Thật, Ta nói thật
  rationale: Giữ tính long trọng và sự nhấn mạnh của công thức lặp đặc trưng trong sách Giăng, nhưng diễn đạt bằng tiếng Việt hiện đại, dễ hiểu.
- source_word: οὐ μὴ ... φωνήσῃ
  choice: chắc chắn chưa gáy
  rationale: οὐ μή là phủ định mạnh. Trong cấu trúc thời gian với “cho đến khi”, “chắc chắn chưa gáy” vừa giữ sức nhấn vừa tự nhiên trong tiếng Việt.
- source_word: ἀλέκτωρ
  choice: gà
  rationale: Trong ngữ cảnh động từ “gáy”, “gà” được hiểu tự nhiên là gà trống; cách nói này thông dụng hơn “gà trống sẽ gáy” mà vẫn chính xác.
- source_word: ἕως οὗ
  choice: cho đến khi
  rationale: Phản ánh trực tiếp mốc thời gian mà trước đó tiếng gà chưa xảy ra.
- source_word: ἀρνήσῃ με
  choice: con đã chối Ta
  rationale: “Chối” diễn tả việc phủ nhận mối liên hệ hoặc không thừa nhận Chúa Jêsus; “đã” cho thấy cả ba lần chối xảy ra trước tiếng gà gáy.
- source_word: τρίς
  choice: ba lần
  rationale: Cách diễn đạt tiêu chuẩn, tự nhiên trong tiếng Việt hiện đại.
theological_decisions:
- issue: Ý nghĩa của ψυχή trong bối cảnh môn đồ tự nguyện chịu chết
  choice: mạng sống
  alternative: linh hồn
  rationale: Ngữ cảnh nói về lời tuyên bố của Phi-e-rơ rằng ông sẵn sàng chết vì Chúa Jêsus. “Mạng sống” giữ nghĩa cụ thể của sự hy sinh, không áp đặt một quan niệm nhân học hẹp hơn lên ψυχή.
- issue: Quan hệ thời gian giữa ba lần chối và tiếng gà gáy
  choice: gà chắc chắn chưa gáy cho đến khi con đã chối Ta ba lần
  alternative: trước khi gà gáy, con sẽ chối Ta ba lần
  rationale: Giữ cấu trúc phủ định mạnh οὐ μή và ἕως οὗ của bản Hy Lạp, thay vì chuyển thành lời diễn giải “trước khi,” qua đó bảo toàn trọng tâm và sắc thái nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng đại từ “Ta–con” để thể hiện quan hệ giữa Chúa Jêsus và môn đồ mà không tạo sắc thái thô tục. Danh xưng “Đức Chúa Jêsus” phù hợp văn phong Kinh Thánh tiếng Việt; câu hỏi giữ tính chất chất vấn trong nguyên văn.
