revisions:
- from: 'Đức Chúa Jêsus đáp: “Con sẽ hy sinh mạng sống vì Ta sao?[a] Thật, Ta nói thật với con: gà chắc chắn chưa gáy cho đến khi con đã chối Ta ba lần.”'
  to: 'Giê-su đáp: “Anh sẽ hy sinh mạng sống mình vì tôi sao?[a] Thật vậy, thật vậy, tôi bảo anh: gà sẽ nhất định không gáy cho đến khi anh đã chối tôi ba lần.”'
  rationale: Bản sửa giữ nghĩa cụ thể «hy sinh mạng sống» của τίθημι τὴν ψυχήν và quan hệ thời gian «cho đến khi» của ἕως οὗ, đồng thời diễn đạt lực nhấn của οὐ μή bằng «sẽ nhất định không». Đã bỏ danh xưng không có trong nguyên văn, cập nhật chính tả tên riêng và thay lối xưng hô cổ bằng cách nói hiện đại. Chú thích được chỉnh để neo đúng phương án từ vựng «linh hồn».
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T06:25:11Z'
review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng ý chính của câu, gồm câu hỏi tu từ về việc hy sinh mạng sống và lời báo trước ba lần chối. Tuy nhiên, «Đức Chúa» không có tương ứng trong Ἰησοῦς, và cách xưng hô «Ta–con» vừa cổ vừa thêm sắc thái tôn ti không được xác định bởi tiếng Hy Lạp. Cần dùng tên riêng «Giê-su» và lối xưng hô hiện đại, đồng thời giữ phủ định nhấn mạnh οὐ μή.
  naturalness: «Jêsus», «Ta–con» và «Thật, Ta nói thật với con» không phải lựa chọn hiện đại, tự nhiên nhất cho tiếng Việt chuẩn. «Thật vậy, thật vậy, tôi bảo anh» giữ được sự lặp lại của ἀμὴν ἀμὴν mà vẫn sáng rõ. «Gà sẽ nhất định không gáy...» diễn đạt tự nhiên hơn trật tự «gà chắc chắn chưa gáy».
  terminology: '«Mạng sống» là lựa chọn đúng cho ψυχή trong thành ngữ τίθημι τὴν ψυχήν. Chú thích hiện có bị lệch: «phó mạng sống» không phải là phương án từ vựng thay thế được nêu trong ghi chú tiếng Anh; phương án cần nêu là «linh hồn», đồng thời giải thích rằng ngữ cảnh này chỉ mạng sống.'
  issues:
  - severity: medium
    issue: Thêm danh xưng «Đức Chúa» và dùng chính tả/tước hiệu truyền thống «Jêsus».
    rationale: Nguyên văn chỉ có Ἰησοῦς («Giê-su»), không có κύριος. Danh xưng thêm vào làm giảm tính tương ứng nguồn; «Jêsus» cũng không phải chính tả hiện đại thông dụng.
  - severity: medium
    issue: Xưng hô «Ta–con» không phản ánh lối Việt hiện đại và áp đặt quan hệ tôn ti.
    rationale: Đại từ ngôi hai số ít trong tiếng Hy Lạp không xác định cách xưng hô tiếng Việt. «Tôi–anh» là cách hiện đại, trang trọng vừa phải trong lời nói với một môn đồ nam trưởng thành.
  - severity: medium
    issue: Chú thích a không nêu đúng phương án thay thế từ vựng cho ψυχή.
    rationale: Ghi «Hay phó mạng sống» chỉ đổi cách diễn đạt của nghĩa đã chọn, trong khi phương án từ vựng cần được ghi là «linh hồn»; chú thích cũng cần giải thích vì sao bản văn chọn «mạng sống».
