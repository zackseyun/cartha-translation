id: JHN.13.10
reference: John 13:10
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ⸀ὁ Ἰησοῦς· Ὁ λελουμένος ⸂οὐκ ἔχει χρείαν⸃ ⸂εἰ μὴ⸃ τοὺς πόδας νίψασθαι, ἀλλ’ ἔστιν καθαρὸς ὅλος· καὶ ὑμεῖς καθαροί ἐστε, ἀλλ’ οὐχὶ πάντες.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/010.yaml
  text: Jesus said to him[a], “The one who has bathed has no need except to wash his feet, but is completely clean. And you are clean, but not all of you.”
translation:
  language: vi
  text: 'Giê-su nói với ông: “Người đã tắm rồi thì không cần gì ngoài việc rửa chân[a], nhưng sạch hoàn toàn. Anh em cũng sạch, nhưng không phải tất cả.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hy Lạp dùng hai động từ khác nhau: λούω là “tắm”, thường nói về việc rửa toàn thân; còn νίπτω là “rửa”, thường nói về một bộ phận cơ thể như bàn chân.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὁ λελουμένος
  choice: Người đã tắm rồi
  rationale: Động từ λούω ở dạng phân từ hoàn thành diễn tả người đã tắm toàn thân và hiện ở trong tình trạng sau khi tắm; cách dịch này giữ được cả ý hoàn tất lẫn cách nói khái quát.
- source_word: οὐκ ἔχει χρείαν
  choice: không cần gì
  rationale: Diễn đạt tự nhiên thành ngữ Hy Lạp ἔχει χρείαν, đồng thời chuẩn bị rõ cho ngoại lệ theo sau.
- source_word: εἰ μὴ
  choice: ngoài việc
  rationale: Trong câu này, εἰ μὴ nêu ngoại lệ duy nhất đối với mệnh đề phủ định trước đó.
- source_word: τοὺς πόδας νίψασθαι
  choice: rửa chân
  rationale: νίπτω thường chỉ việc rửa một bộ phận cơ thể; tiếng Việt không cần thêm đại từ sở hữu vì chủ thể đã rõ.
- source_word: καθαρὸς ὅλος
  choice: sạch toàn thân
  rationale: Cách diễn đạt tự nhiên này giữ ý toàn vẹn của ὅλος và vẫn để ngỏ lớp nghĩa biểu tượng của καθαρός.
- source_word: καὶ ὑμεῖς καθαροί ἐστε
  choice: Anh em cũng sạch
  rationale: “Anh em” thể hiện lời nói trực tiếp với số nhiều; “cũng” nối nhóm môn đệ với hình ảnh người đã sạch ở mệnh đề trước.
- source_word: ἀλλ’ οὐχὶ πάντες
  choice: nhưng không phải tất cả
  rationale: Giữ nguyên sự tương phản và sự mơ hồ có chủ ý về người ngoại lệ trong nhóm, không giải thích thêm danh tính.
- source_word: λέγει αὐτῷ ὁ Ἰησοῦς
  choice: Chúa Giê-su nói với ông
  rationale: Dùng thì quá khứ hàm ẩn theo lối kể chuyện tự nhiên của tiếng Việt cho hiện tại lịch sử Hy Lạp; “ông” quy chiếu về Phi-e-rơ trong ngữ cảnh.
theological_decisions:
- issue: Hình ảnh rửa theo nghĩa đen và sự sạch theo nghĩa biểu tượng hoặc thuộc linh
  choice: Giữ các từ “tắm”, “rửa chân” và “sạch” mà không giải thích lớp nghĩa biểu tượng trong chính văn.
  alternative: Diễn giải thành “sạch về thuộc linh”, hoặc dịch cả λούω và νίπτω bằng cùng một từ chung.
  rationale: Câu văn chủ ý vận hành đồng thời ở bình diện hành động rửa theo nghĩa đen và ý nghĩa sâu hơn. Giữ sự phân biệt từ vựng và không chú giải trong chính văn bảo toàn sức căng thần học.
- issue: Phân từ giống đực số ít được dùng theo nghĩa khái quát
  choice: Dịch là “Người đã tắm rồi”.
  alternative: Dùng một đại từ nam giới cụ thể như “người đàn ông đã tắm”.
  rationale: Giống đực ở đây thuộc cấu trúc ngữ pháp và câu nói mang tính khái quát; “người” giữ số ít mà không thêm giới tính không thuộc trọng tâm của nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Chúa Giê-su” theo lối gọi quen thuộc trong tiếng Việt; dùng “anh em” cho đại từ số nhiều ὑμεῖς. Không thêm lời giải thích giáo lý vào chính văn.
