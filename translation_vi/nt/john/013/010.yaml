review_pass:
  verdict: revise
  source_fidelity: Bản dịch giữ đúng cấu trúc và sự đối lập từ vựng giữa λούω (“tắm”) và νίπτω (“rửa”), cũng như lời khẳng định về nhóm môn đệ kèm ngoại lệ. Tuy nhiên, “Chúa Giê-su” thêm tước hiệu không có trong nguyên văn câu này, nơi chủ ngữ chỉ là ὁ Ἰησοῦς (“Giê-su”). “Sạch toàn thân” thu hẹp καθαρὸς ὅλος vào thân thể vật lý hơn bản Hy Lạp, vốn vẫn để mở bình diện biểu tượng trong ngữ cảnh.
  naturalness: “Người đã tắm rồi thì không cần gì ngoài việc rửa chân” là tự nhiên và rõ nghĩa. “Nhưng sạch hoàn toàn” tự nhiên hơn “nhưng đã sạch toàn thân” trong câu này, đồng thời nối mạch tốt với lần lặp lại “sạch” ở mệnh đề sau.
  terminology: Dùng “tắm”/“rửa chân” và “sạch” là phù hợp, bảo toàn hình ảnh và không áp đặt diễn giải thần học. “Giê-su” thay cho “Chúa Giê-su” tránh bổ sung tước hiệu vào chính văn. Chú thích từ vựng chính xác và neo [a] đúng chỗ.
  issues:
  - severity: medium
    issue: Thêm tước hiệu “Chúa” vào tên Giê-su.
    rationale: SBLGNT viết ὁ Ἰησοῦς, nghĩa là “Giê-su”; câu này không có κύριος. Dù tước hiệu phù hợp với niềm tin Kitô giáo và có thể xuất hiện ở các bản dịch theo truyền thống, nó là phần bổ sung không được đánh dấu trong một bản dịch tối ưu tương đương.
  - severity: medium
    issue: “Sạch toàn thân” làm cụ thể hóa καθαρὸς ὅλος.
    rationale: ὅλος nhấn mạnh tính trọn vẹn (“hoàn toàn”), nhưng không nêu rõ “thân thể.” Thêm “toàn thân” làm nghiêng câu sang nghĩa thân thể theo nghĩa đen và giảm sự mở ngỏ của mô-típ “sạch” trong văn mạch Giăng.
  revised_text: 'Giê-su nói với ông: “Người đã tắm rồi thì không cần gì ngoài việc rửa chân[a], nhưng sạch hoàn toàn. Anh em cũng sạch, nhưng không phải tất cả.”'
