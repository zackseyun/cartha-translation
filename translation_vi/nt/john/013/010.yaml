revisions:
- from: 'Chúa Giê-su nói với ông: “Người đã tắm rồi thì không cần gì ngoài việc rửa chân[a], nhưng đã sạch toàn thân. Anh em cũng sạch, nhưng không phải tất cả.”'
  to: 'Giê-su nói với ông: “Người đã tắm rồi thì không cần gì ngoài việc rửa chân[a], nhưng sạch hoàn toàn. Anh em cũng sạch, nhưng không phải tất cả.”'
  rationale: Bản sửa loại bỏ tước hiệu không có trong nguyên văn và đổi “sạch toàn thân” thành “sạch hoàn toàn” để diễn đạt ὅλος mà không thu hẹp nghĩa của καθαρός. Các lựa chọn còn lại, kể cả chú thích phân biệt hai động từ, được giữ nguyên vì trung thành với nguồn và tự nhiên trong tiếng Việt hiện đại.
  reviewer_model: gpt-5.6-terra
