id: JHN.13.18
reference: John 13:18
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οὐ περὶ πάντων ὑμῶν λέγω· ἐγὼ οἶδα ⸀τίνας ἐξελεξάμην· ἀλλ’ ἵνα ἡ γραφὴ πληρωθῇ· Ὁ τρώγων ⸀μου τὸν ἄρτον ἐπῆρεν ἐπ’ ἐμὲ τὴν πτέρναν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/018.yaml
  text: 'I am not speaking about all of you[a]. I know whom I have chosen[c][b]. But this is so that the Scripture may be fulfilled: ‘The one who eats my bread has lifted up his heel against me.’'
translation:
  language: vi
  text: '“Ta không nói về tất cả các con. Ta biết Ta đã chọn ai. Nhưng để lời Kinh Thánh được ứng nghiệm: ‘Người ăn bánh của Ta đã giơ gót chân lên chống lại Ta.’[a][b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đã nhấc gót chân lên chống lại Ta.” Đây là hình ảnh chỉ sự thù nghịch và phản bội.'
    reason: lexical_alternative
  - marker: b
    text: Trích dẫn hoặc gợi nhắc Thi Thiên 41:9.
    reason: cross_reference
lexical_decisions:
- source_word: οὐ περὶ πάντων ὑμῶν λέγω
  choice: Ta không nói về tất cả các con
  rationale: Diễn đạt tự nhiên nghĩa ‘không nói về tất cả các con’, đồng thời giữ đúng phạm vi phủ định và nghĩa của περὶ là ‘về/liên quan đến’.
- source_word: οἶδα
  choice: Ta biết
  rationale: οἶδα tuy có hình thức hoàn thành nhưng mang nghĩa hiện tại thông thường trong tiếng Hy Lạp Koine.
- source_word: τίνας ἐξελεξάμην
  choice: những người Ta đã chọn
  rationale: Giữ đối tượng chỉ người và nghĩa trực tiếp của ἐκλέγομαι là ‘chọn’; ‘đã chọn’ thể hiện hành động trước đó vẫn liên quan đến hiện tại.
- source_word: ἀλλ’ ἵνα
  choice: Nhưng điều này là để
  rationale: Nối mệnh đề rõ ràng, tự nhiên, đồng thời bảo toàn sắc thái mục đích hoặc kết quả mà không thêm lời giải thích về quan hệ nhân quả.
- source_word: ἡ γραφὴ πληρωθῇ
  choice: lời Kinh Thánh được ứng nghiệm
  rationale: Trong văn mạch Giăng, γραφή chỉ Kinh Thánh; cách nói ‘được ứng nghiệm’ truyền đạt thể bị động và lối diễn đạt quen thuộc của lời tiên báo được hoàn thành.
- source_word: Ὁ τρώγων μου τὸν ἄρτον
  choice: Người ăn bánh của Ta
  rationale: Chuyển phân từ dùng như danh từ thành ‘Người…’, giữ cách hiểu μου bổ nghĩa cho ‘bánh’ và dùng động từ ‘ăn’ tự nhiên trong tiếng Việt.
- source_word: ἐπῆρεν ἐπ’ ἐμὲ τὴν πτέρναν αὐτοῦ
  choice: đã giơ gót chân lên chống lại Ta
  rationale: Giữ nguyên hình ảnh ẩn dụ của câu trích Thi Thiên và sắc thái thù nghịch, phản bội, thay vì diễn giải phẳng thành ‘đã phản bội Ta’.
theological_decisions:
- issue: Mối liên hệ giữa sự lựa chọn của Đức Chúa Giê-su và kẻ phản bội
  choice: Dịch thẳng ἐξελεξάμην là ‘Ta đã chọn’, không xác định trong bản dịch đây là sự tuyển chọn để được cứu hay chỉ là sự bổ nhiệm làm sứ đồ.
  alternative: Diễn đạt theo cách loại Giu-đa khỏi sự lựa chọn, hoặc xác định sự lựa chọn này là sự tuyển chọn cứu rỗi.
  rationale: Câu này khẳng định Đức Chúa Giê-su biết những người Ngài đã chọn nhưng không tự định nghĩa phạm trù thần học của sự lựa chọn; bản dịch cần giữ nguyên sự căng thẳng ấy.
- issue: Sắc thái của ἀλλ’ ἵνα đối với sự phản bội và việc Kinh Thánh được ứng nghiệm
  choice: Dịch là ‘Nhưng điều này là để lời Kinh Thánh được ứng nghiệm’.
  alternative: Diễn giải rằng sự phản bội xảy ra do tất định hoặc vì Kinh Thánh bắt buộc phải thành sự thật.
  rationale: Nguyên văn nêu mục đích hoặc kết quả liên quan đến sự ứng nghiệm Kinh Thánh nhưng không giải thích đầy đủ cơ chế nhân quả; bản dịch không thêm một lập trường tất định.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ ‘Ta—các con’ phù hợp lời Đức Chúa Giê-su nói trực tiếp với các môn đồ trong văn mạch; viết hoa ‘Ta’ theo quy ước tôn kính. Hình ảnh ‘giơ gót chân lên’ được giữ lại để bảo toàn liên hệ với Thi Thiên và sức gợi của nguyên văn.
