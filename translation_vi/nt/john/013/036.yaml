base_translation:
  language: en
  yaml_path: translation/nt/john/013/036.yaml
  text: Simon Peter says to him[a], “Lord, where are you going?” Jesus answered, “Where I am going, you are not able to follow me now[b], but you will follow later.”
translation:
  language: vi
  text: 'Si-môn Phi-e-rơ nói với Ngài: “Lạy Chúa, Ngài đi đâu?” Đức Giê-su đáp: “Nơi Ta đi, bây giờ con không thể theo Ta[a], nhưng sau này con sẽ theo Ta.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Bây giờ con chưa thể theo Ta.” Động từ Hy Lạp nói rõ về khả năng.'
    reason: lexical_alternative
  - marker: b
    text: Câu “sau này con sẽ theo Ta” có thể ám chỉ việc Phi-e-rơ về sau theo Đức Giê-su trong đau khổ hoặc sự chết; chính cách diễn đạt này không nói rõ ông sẽ theo bằng cách nào.
    reason: cross_reference
lexical_decisions:
- source_word: Λέγει
  choice: hỏi
  rationale: Trong ngữ cảnh, lời Phi-e-rơ là một câu hỏi; dùng “hỏi” tự nhiên trong tiếng Việt, dù động từ Hy Lạp theo nghĩa đen là “nói” và ở thì hiện tại lịch sử.
- source_word: Κύριε
  choice: Lạy Chúa
  rationale: Cách xưng hô trang trọng, tự nhiên trong tiếng Việt, giữ được cả sắc thái tôn kính lẫn ý nghĩa tước hiệu của κύριος.
- source_word: ποῦ ὑπάγεις / Ὅπου ὑπάγω
  choice: Ngài đi đâu / Nơi Ta đi
  rationale: Dịch nhất quán ὑπάγω bằng “đi”, vừa tự nhiên vừa không xác định quá mức đích đến.
- source_word: οὐ δύνασαί μοι νῦν ἀκολουθῆσαι
  choice: bây giờ con chưa thể theo Ta được
  rationale: “Chưa thể… được” giữ rõ ý khả năng của δύναμαι, đồng thời diễn đạt tự nhiên sự tương phản giữa hiện tại và tương lai.
- source_word: ἀκολουθήσεις δὲ ὕστερον
  choice: nhưng sau này con sẽ theo
  rationale: Giữ thì tương lai và nét tương phản của δέ; không thêm đối tượng ở mệnh đề sau vì tiếng Việt vẫn hiểu rõ từ ngữ cảnh và cách này bám sát độ hàm súc của nguyên văn.
theological_decisions:
- issue: Ý nghĩa việc Phi-e-rơ sẽ theo Đức Giê-su về sau
  choice: Không xác định trong chính văn việc này là tử đạo, tiếp tục làm môn đồ sau khi được phục hồi, hay theo Đức Giê-su vào sự chết và vinh quang.
  alternative: Diễn giải cụ thể là lời báo trước cuộc tử đạo của Phi-e-rơ.
  rationale: Nguyên văn chỉ nói Phi-e-rơ sẽ theo về sau; bản dịch giữ nguyên độ mở về thần học và mạch truyện.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng hệ thống xưng hô “Ngài / Ta / con” để biểu đạt quan hệ giữa Phi-e-rơ và Đức Giê-su; giữ hiện tại lịch sử bằng lối dẫn trực tiếp sống động, nhưng chuyển Λέγει thành “hỏi” cho tự nhiên theo chức năng câu nói.
