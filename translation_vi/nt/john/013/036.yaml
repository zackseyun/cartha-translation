revisions:
- from: 'Si-môn Phi-e-rơ hỏi Ngài: “Lạy Chúa, Ngài đi đâu?” Đức Giê-su đáp: “Nơi Ta đi, bây giờ con chưa thể theo Ta được[a], nhưng sau này con sẽ theo.”[b]'
  to: 'Si-môn Phi-e-rơ nói với Ngài: “Lạy Chúa, Ngài đi đâu?” Đức Giê-su đáp: “Nơi Ta đi, bây giờ con không thể theo Ta[a], nhưng sau này con sẽ theo Ta.”[b]'
  rationale: Chỉnh “hỏi” thành “nói với Ngài” để bám sát Λέγει mà vẫn tự nhiên trong văn cảnh. Chỉnh “chưa thể ... được” thành “bây giờ ... không thể” để biểu đạt trực tiếp οὐ δύνασαι ... νῦν. Bổ sung lại “Ta” ở mệnh đề tương lai chỉ để làm rõ đối tượng đã có trong ngữ cảnh, không thu hẹp ý nghĩa. Các chú thích được giữ đúng neo và tiếp tục bảo toàn tính không xác định của lời hứa theo sau.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T06:25:52Z'
review_pass:
  verdict: revise
  source_fidelity: Cần chỉnh nhẹ để phản ánh Λέγει (“nói”) thay vì thay bằng động từ “hỏi”. Câu hỏi của Phi-e-rơ đã được thể hiện nguyên vẹn trong lời trực tiếp. “bây giờ con không thể theo Ta” truyền đạt rõ οὐ δύνασαι ... νῦν; “sau này con sẽ theo Ta” giữ thì tương lai và độ mở của ὕστερον.
  naturalness: Bản chỉnh vẫn dùng tiếng Việt hiện đại, trang trọng và hệ xưng hô Kinh Thánh tự nhiên “Ngài / Ta / con”. Việc lặp “Ta” ở mệnh đề cuối giúp câu tiếng Việt rõ đối tượng mà không diễn giải thêm.
  terminology: “Lạy Chúa” là cách dịch phù hợp cho Κύριε trong lời thưa trực tiếp với Đức Giê-su. Tên riêng “Si-môn Phi-e-rơ” và “Đức Giê-su” nhất quán. Không xác định trước ý nghĩa việc Phi-e-rơ sẽ theo về sau.
  issues:
  - severity: low
    issue: Λέγει được dịch là “hỏi”.
    rationale: Dù lời nói có hình thức câu hỏi và “hỏi” tự nhiên, nguyên văn dùng động từ tường thuật “nói” (hiện tại lịch sử), không phải động từ hỏi. Dịch “nói với Ngài” bảo toàn dữ liệu nguồn, còn dấu hỏi trong lời trực tiếp vẫn biểu thị chức năng phát ngôn.
  - severity: low
    issue: “chưa thể” làm sắc thái thời điểm được suy ra thay vì dịch trực tiếp νῦν.
    rationale: Tương phản “bây giờ/sau này” quả thực hàm ý chưa, nhưng “bây giờ ... không thể” phản ánh trực tiếp hơn phủ định, khả năng và trạng từ thời gian của nguyên văn.
