id: JHN.13.29
reference: John 13:29
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τινὲς γὰρ ἐδόκουν, ἐπεὶ τὸ γλωσσόκομον ⸀εἶχεν Ἰούδας, ὅτι λέγει αὐτῷ ⸀ὁ Ἰησοῦς· Ἀγόρασον ὧν χρείαν ἔχομεν εἰς τὴν ἑορτήν, ἢ τοῖς πτωχοῖς ἵνα τι δῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/029.yaml
  text: For some thought that[a], because Judas had the money box, Jesus was telling him[b], “Buy what we need for the feast,” or that he should give something to the poor.
translation:
  language: vi
  text: 'Vì Giu-đa giữ túi tiền[a], nên một số người tưởng rằng Đức Giê-su bảo ông: “Hãy mua những thứ chúng ta cần cho kỳ lễ[b],” hoặc bảo ông cho người nghèo chút gì đó.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “hộp tiền”. Từ Hy Lạp chỉ vật đựng ngân quỹ chung của nhóm.
    reason: lexical_alternative
  - marker: b
    text: “Kỳ lễ” ở đây là lễ Vượt Qua trong bối cảnh của phân đoạn này.
    reason: cross_reference
lexical_decisions:
- source_word: τινὲς
  choice: một số người
  rationale: Đại từ bất định số nhiều chỉ một số người trong những người đang hiện diện; cách diễn đạt này tự nhiên và rõ nghĩa trong tiếng Việt.
- source_word: ἐδόκουν
  choice: tưởng rằng
  rationale: Diễn tả nhận định của họ nhưng thực tế không đúng; “tưởng rằng” phù hợp với ngữ cảnh tường thuật.
- source_word: ἐπεὶ
  choice: vì... nên
  rationale: Nêu lý do khiến họ suy đoán như vậy. Cấu trúc “vì... nên” giúp câu tiếng Việt rõ ràng mà vẫn giữ quan hệ nhân quả của nguyên bản.
- source_word: γλωσσόκομον
  choice: túi tiền
  rationale: Chỉ vật đựng ngân quỹ chung của nhóm. “Túi tiền” là cách gọi tự nhiên; hình dạng cụ thể của vật đựng không được nguyên bản xác định.
- source_word: εἶχεν
  choice: giữ
  rationale: Động từ cơ bản nghĩa là có hoặc cầm giữ; trong ngữ cảnh này, “giữ” truyền đạt tự nhiên việc Giu-đa quản giữ vật đựng tiền mà không diễn giải quá mức.
- source_word: λέγει αὐτῷ ὁ Ἰησοῦς
  choice: Đức Giê-su bảo ông
  rationale: Hiện tại lịch sử được chuyển thành quá khứ theo lối kể chuyện tự nhiên của tiếng Việt; “bảo” phù hợp với nội dung mệnh lệnh theo sau.
- source_word: Ἀγόρασον
  choice: Hãy mua
  rationale: Mệnh lệnh trực tiếp; “hãy mua” trang trọng vừa phải và tự nhiên.
- source_word: ὧν χρείαν ἔχομεν
  choice: những thứ chúng ta cần
  rationale: Chuyển đạt tự nhiên cấu trúc đại từ quan hệ kết hợp với ý “có nhu cầu” trong nguyên bản.
- source_word: εἰς τὴν ἑορτήν
  choice: cho kỳ lễ
  rationale: ἑορτή chỉ một lễ hội tôn giáo; “kỳ lễ” giữ được nghĩa rộng, còn chú thích xác định bối cảnh là lễ Vượt Qua.
- source_word: τοῖς πτωχοῖς
  choice: người nghèo
  rationale: Tính từ được dùng như danh từ tập hợp, chỉ những người nghèo; đây là cách diễn đạt chuẩn và tự nhiên.
- source_word: ἵνα τι δῷ
  choice: bảo ông cho... chút gì đó
  rationale: Giữ đây là khả năng thứ hai trong điều các môn đồ tưởng Đức Giê-su đã bảo Giu-đa làm; “chút gì đó” phản ánh đại từ bất định τι.
theological_decisions: []
