  terminology: “Đức Giê-su,” “Giu-đa,” “túi tiền,” “kỳ lễ,” và “người nghèo” nhất quán, dễ hiểu, và không áp đặt diễn giải giáo phái. Chú thích b chỉ xác định bối cảnh lễ Vượt Qua của phân đoạn, không thay thế thuật ngữ rộng ἑορτή trong câu dịch.
