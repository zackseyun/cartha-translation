  register: Văn phong tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Câu được sắp xếp theo trật tự nguyên nhân–suy đoán tự nhiên trong tiếng Việt; không thêm lời giải thích thần học ngoài văn bản.
