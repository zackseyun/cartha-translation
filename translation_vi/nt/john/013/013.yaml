source:
  edition: SBLGNT
  text: ὑμεῖς φωνεῖτέ με Ὁ διδάσκαλος καὶ Ὁ κύριος, καὶ καλῶς λέγετε, εἰμὶ γάρ.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/013.yaml
  text: You call me Teacher and Lord, and you speak rightly, for I am.
translation:
  language: vi
  text: Các con gọi Ta là Thầy và Chúa[a]. Các con nói đúng, vì Ta đúng là như vậy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch danh hiệu này là “Chủ”. Từ Hy Lạp kyrios có thể chỉ một chủ nhân hoặc người có thẩm quyền; ở đây dịch là “Chúa” vì từ này được dùng như danh hiệu dành cho Chúa Giê-su.
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνεῖτέ
  choice: gọi
  rationale: Trong kết cấu gọi một người bằng các danh xưng, “gọi Ta là” là cách diễn đạt tự nhiên và trực tiếp trong tiếng Việt.
- source_word: Ὁ διδάσκαλος
  choice: Thầy
  rationale: “Thầy” là danh xưng tự nhiên dành cho người dạy dỗ trong ngữ cảnh này; viết hoa để thể hiện chức danh được dùng trực tiếp cho Chúa Giê-su.
- source_word: Ὁ κύριος
  choice: Chúa
  rationale: “Chúa” giữ được ý nghĩa thẩm quyền và sức nặng của κύριος như một danh hiệu dành cho Chúa Giê-su; “chủ” là một khả năng từ vựng nhưng quá thu hẹp trong câu này.
- source_word: καλῶς λέγετε
  choice: Các con nói đúng
  rationale: Cụm này tự nhiên truyền đạt sự xác nhận rằng cách các môn đồ xưng gọi là đúng, đồng thời vẫn phản ánh động từ λέγετε.
- source_word: εἰμὶ γάρ
  choice: vì Ta quả thật là như vậy
  rationale: Tiếng Hy Lạp ngắn gọn, theo nghĩa đen là “vì Ta là”; thêm “quả thật… như vậy” làm rõ bổ ngữ đã được nêu trước trong tiếng Việt mà không giới hạn lời xác nhận vào chỉ một trong hai danh hiệu.
theological_decisions:
- issue: Cách dịch κύριος như danh hiệu dành cho Chúa Giê-su
  choice: Chúa
  alternative: Chủ
  rationale: “Chúa” phù hợp với cách dùng κύριος như danh hiệu trong Tân Ước và bảo toàn sức nặng thần học của lời Chúa Giê-su xác nhận, nhưng không diễn giải thêm bản chất của danh hiệu này.
- issue: Phạm vi lời xác nhận εἰμὶ γάρ
  choice: Ta quả thật là như vậy
  alternative: vì Ta là
  rationale: Cách dịch này để lời xác nhận áp dụng tự nhiên cho cả “Thầy” lẫn “Chúa”, như cấu trúc Hy Lạp, mà không khai triển thêm hàm ý thần học.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Các con—Ta” để phản ánh lời Chúa Giê-su nói với các môn đồ trong ngữ cảnh thân mật nhưng có thẩm quyền. Giữ hai danh hiệu “Thầy” và “Chúa” viết hoa.
