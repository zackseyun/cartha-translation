source:
  edition: SBLGNT
  text: ⸀ἦν ἀνακείμενος εἷς ⸀ἐκ τῶν μαθητῶν αὐτοῦ ἐν τῷ κόλπῳ τοῦ Ἰησοῦ, ὃν ἠγάπα ὁ Ἰησοῦς·
base_translation:
  language: en
  yaml_path: translation/nt/john/013/023.yaml
  text: One of his disciples[a], whom Jesus loved, was reclining in Jesus' bosom.
translation:
  language: vi
  text: Một trong các môn đồ của Đức Giê-su, người được Ngài yêu, đang nằm nghiêng sát bên Ngài.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “trong lòng (hoặc bên ngực) Đức Giê-su”; đây là cách diễn tả vị trí của một người nằm nghiêng ngay bên cạnh người khác trong bữa ăn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνακείμενος
  choice: đang nằm nghiêng
  rationale: Động từ chỉ tư thế nằm nghiêng khi dự bữa ăn theo phong tục thời ấy; cách dịch này giữ được bối cảnh lịch sử rõ hơn “đang ngồi ăn”.
- source_word: εἷς ἐκ τῶν μαθητῶν αὐτοῦ
  choice: một trong các môn đồ của Ngài
  rationale: Diễn đạt tự nhiên cấu trúc phân bộ của tiếng Hy Lạp, xác định người này thuộc nhóm môn đồ của Đức Giê-su.
- source_word: ἐν τῷ κόλπῳ τοῦ Ἰησοῦ
  choice: sát bên Ngài
  rationale: Trong bối cảnh bữa ăn, cụm từ mô tả vị trí của một người nằm nghiêng ngay cạnh Đức Giê-su. Cách dịch này truyền đạt quan hệ không gian tự nhiên trong tiếng Việt, còn nghĩa sát chữ được giữ trong chú thích.
- source_word: ὃν ἠγάπα ὁ Ἰησοῦς
  choice: người được Đức Giê-su yêu
  rationale: Giữ nguyên ý nghĩa trực tiếp của ἀγαπάω là “yêu” và làm rõ Đức Giê-su là chủ thể của tình yêu.
theological_decisions:
- issue: Cách diễn đạt vị trí của môn đồ được yêu bên Đức Giê-su
  choice: Dịch theo ý nghĩa không gian trong bối cảnh bữa ăn là “nằm nghiêng sát bên Ngài”.
  alternative: “nằm nghiêng trong lòng Đức Giê-su” hoặc “ở bên ngực Đức Giê-su”
  rationale: Cụm từ trước hết mô tả cách sắp chỗ tại bàn ăn, chứ không nhất thiết khẳng định một sự kết hợp huyền nhiệm. Chú thích giữ cách nói sát chữ và không loại bỏ âm hưởng có thể liên hệ với Giăng 1:18.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. “Nằm nghiêng” tái hiện tư thế dùng bữa cổ đại; “sát bên Ngài” tránh tạo hình ảnh thân mật sai lệch trong cách hiểu hiện đại. Đại từ “Ngài” phù hợp văn phong tôn kính và quy chiếu về Đức Giê-su.
