- from: Một trong các môn đồ của Ngài, người được Đức Giê-su yêu, đang nằm nghiêng sát bên Ngài.[a]
  to: Một trong các môn đồ của Đức Giê-su, người được Ngài yêu, đang nằm nghiêng sát bên Ngài.[a]
  rationale: Chỉ điều chỉnh vị trí nêu tên Đức Giê-su để giải quyết quy chiếu đại từ trong tiếng Việt khi câu được đọc độc lập. Các lựa chọn dịch thuật và chú thích được giữ nguyên vì phản ánh đúng văn bản Hy Lạp và bối cảnh bữa ăn.
