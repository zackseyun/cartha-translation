  text: εἶτα βάλλει ὕδωρ εἰς τὸν νιπτῆρα, καὶ ἤρξατο νίπτειν τοὺς πόδας τῶν μαθητῶν καὶ ἐκμάσσειν τῷ λεντίῳ ᾧ ἦν διεζωσμένος.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/005.yaml
  text: Then he pours water into the washbasin[b][a], and began to wash the disciples’ feet and to wipe them with the towel with which he was girded.
translation:
  language: vi
  text: Rồi Ngài đổ nước vào chậu[a] và bắt đầu rửa chân cho các môn đồ, rồi lau chân họ bằng chiếc khăn[b] Ngài đang thắt quanh mình.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “chậu rửa.” Từ Hy Lạp chỉ một vật chứa dùng để rửa.
    reason: lexical_alternative
  - marker: b
    text: 'Sát nghĩa: “bằng chiếc khăn mà Ngài đang thắt quanh mình.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶτα
  choice: Rồi
  rationale: Đánh dấu hành động kế tiếp trong trình thuật một cách tự nhiên và trang trọng.
- source_word: βάλλει ὕδωρ εἰς τὸν νιπτῆρα
  choice: đổ nước vào chậu
  rationale: Trong ngữ cảnh cho nước vào dụng cụ để rửa, βάλλει được diễn đạt tự nhiên là “đổ”; νιπτήρ là chậu dùng để rửa.
- source_word: ἤρξατο νίπτειν
  choice: bắt đầu rửa
  rationale: Giữ rõ ý khởi đầu hành động của ἤρξατο kết hợp với động từ nguyên mẫu.
- source_word: τοὺς πόδας τῶν μαθητῶν
  choice: rửa chân cho các môn đồ
  rationale: Cách diễn đạt tiếng Việt tự nhiên, đồng thời giữ đúng quan hệ giữa hành động rửa, chân và các môn đồ.
- source_word: ἐκμάσσειν
  choice: lau chân họ
  rationale: Động từ chỉ việc lau hoặc làm khô bằng cách lau; lặp lại “chân” giúp đối tượng rõ ràng trong tiếng Việt.
- source_word: τῷ λεντίῳ ᾧ ἦν διεζωσμένος
  choice: lấy chiếc khăn đang thắt ngang lưng mà lau
  rationale: Diễn đạt tự nhiên rằng chiếc khăn dùng để lau chính là khăn Ngài đang quấn hoặc thắt quanh người để phục vụ.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” cho Chúa Giê-su theo ngữ cảnh gần; “môn đồ” giữ sắc thái thuật ngữ quen thuộc. Trật tự câu được điều chỉnh nhẹ để tiếng Việt tự nhiên nhưng vẫn bảo toàn chuỗi hành động và mối liên hệ giữa chiếc khăn với việc thắt ngang lưng.
