review_pass:
  verdict: revise
  source_fidelity: Bản dịch truyền đạt đúng chuỗi hành động chính. Tuy nhiên, cụm “rồi lấy chiếc khăn ... mà lau” thêm hành động “lấy” không có trong nguyên văn; câu Hy Lạp chỉ nói Ngài lau bằng chính chiếc khăn Ngài đang thắt quanh mình. Cần diễn đạt quan hệ dụng cụ này trực tiếp hơn.
  naturalness: “Rồi Ngài đổ nước vào chậu” và “rửa chân cho các môn đồ” tự nhiên, phù hợp văn phong Kinh Thánh tiếng Việt hiện đại. Cách sửa giúp câu mạch lạc hơn, tránh gợi ý rằng Ngài tháo hoặc cầm lấy khăn trước khi lau.
  terminology: “Chậu,” “môn đồ,” “rửa chân,” và “chiếc khăn” đều phù hợp. “Thắt quanh mình” phản ánh διεζωσμένος chính xác hơn mà không dùng lối nói cổ hoặc quá gượng.
  issues:
  - severity: medium
    issue: Cụm “lấy chiếc khăn ... mà lau” thêm một hành động không được nêu trong nguyên văn.
    rationale: 'τῷ λεντίῳ ᾧ ἦν διεζωσμένος là cụm chỉ phương tiện: “bằng chiếc khăn mà Ngài đang thắt quanh mình.” Không nói Ngài lấy khăn; bản dịch nên giữ quan hệ này.'
  - severity: low
    issue: Ký hiệu chú thích b đang đặt ở cuối câu thay vì ngay sau cụm “chiếc khăn” mà nó giải thích.
    rationale: Đặt mốc sát cụm từ liên quan giúp người đọc nhận ra chú thích nói về chiếc khăn được thắt quanh người.
