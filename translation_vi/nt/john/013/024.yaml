  text: So Simon Peter motioned to this one to ask who it might be about whom he was speaking[a].
translation:
  language: vi
  text: Vì vậy, Si-môn Phi-e-rơ ra hiệu cho môn đồ ấy hỏi xem người mà Đức Chúa Jêsus đang nói đến có thể là ai.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cách dịch sát hình thức hơn: “Vì vậy, Si-môn Phi-e-rơ ra hiệu cho người ấy hỏi xem người mà Ngài đang nói đến có thể là ai.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: νεύει
  choice: ra hiệu
  rationale: Động từ chỉ việc dùng cử chỉ để truyền ý, có lẽ không thành lời. “Ra hiệu” tự nhiên trong tiếng Việt và không thu hẹp nghĩa thành một động tác cụ thể như gật đầu.
- source_word: οὖν
  choice: Vì vậy
  rationale: Từ này nối hành động của Phi-e-rơ với lời vừa nói ở câu trước, biểu thị diễn tiến có tính hệ quả.
- source_word: τούτῳ
  choice: cho môn đồ ấy
  rationale: Đại từ chỉ định trỏ về môn đồ đang được nhắc đến trong ngữ cảnh. Bổ sung danh từ “môn đồ” giúp câu tiếng Việt rõ đối tượng mà vẫn giữ sắc thái chỉ định của nguyên văn.
- source_word: πυθέσθαι
  choice: hỏi xem
  rationale: Động từ nguyên mẫu diễn tả điều Phi-e-rơ muốn môn đồ kia làm. “Hỏi xem” là cách nói tự nhiên, đồng thời hàm ý hỏi để biết.
- source_word: τίς ἂν εἴη
  choice: có thể là ai
  rationale: Cấu trúc ἄν với thức mong ước biểu thị sự chưa xác định hoặc dè dặt; “có thể là ai” giữ được sắc thái ấy.
- source_word: περὶ οὗ λέγει
  choice: người Đức Chúa Jêsus đang nói đến
  rationale: Cụm từ có nghĩa là người mà lời nói đang đề cập đến. Dùng “đang nói đến” là tự nhiên trong tiếng Việt; nêu rõ Đức Chúa Jêsus làm chủ thể để tránh đại từ mơ hồ trong câu có nhiều nhân vật.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Ra hiệu” giữ tính không lời của hành động; “môn đồ ấy” làm rõ đối tượng theo ngữ cảnh. Tên “Đức Chúa Jêsus” được dùng để tránh sự nhập nhằng của đại từ “Ngài” trong tiếng Việt.
