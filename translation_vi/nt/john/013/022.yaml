  text: ⸀ἔβλεπον εἰς ἀλλήλους οἱ μαθηταὶ ἀπορούμενοι περὶ τίνος λέγει.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/022.yaml
  text: The disciples were looking at one another, at a loss about whom he was speaking.
translation:
  language: vi
  text: Các môn đồ cứ nhìn nhau, bối rối không biết Ngài đang nói về ai.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “Các môn đồ nhìn nhau, không biết Ngài đang nói về ai.”'
    reason: Bản dịch ngắn gọn hơn; bản văn chính diễn đạt rõ hơn sắc thái tiếp diễn của ἔβλεπον và trạng thái bối rối của ἀπορούμενοι.
lexical_decisions:
- source_word: ἔβλεπον
  choice: nhìn
  rationale: Thì chưa hoàn thành diễn tả hành động đang tiếp diễn trong cảnh này; tiếng Việt tự nhiên có thể dùng “nhìn” mà không cần thêm “đang”, vì trạng thái kéo dài đã được toàn câu thể hiện.
- source_word: εἰς ἀλλήλους
  choice: nhau
  rationale: Diễn đạt tự nhiên hành động nhìn qua lại giữa các môn đồ.
- source_word: οἱ μαθηταὶ
  choice: Các môn đồ
  rationale: Mạo từ xác định chỉ nhóm môn đồ đã được biết trong ngữ cảnh; không thêm “của Ngài” vì nguyên văn không nói rõ.
- source_word: ἀπορούμενοι
  choice: không biết
  rationale: Phân từ diễn tả sự bối rối, không xác định được câu trả lời; “không biết” sáng rõ và tự nhiên trong tiếng Việt, còn sắc thái “bối rối” được ghi nhận ở chú thích.
- source_word: περὶ τίνος
  choice: về ai
  rationale: Giữ đúng câu hỏi gián tiếp về người mà Chúa Giê-su đang đề cập.
- source_word: λέγει
  choice: Ngài đang nói
  rationale: Hiện tại lịch sử trong câu hỏi gián tiếp được chuyển tự nhiên sang hành động đang diễn ra trong mạch kể quá khứ; “nói” không diễn giải quá mức thành “ám chỉ”.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “môn đồ” theo thuật ngữ Kinh Thánh quen thuộc; “Ngài” phù hợp với ngữ cảnh kính trọng dành cho Chúa Giê-su.
