  verdict: revise
  source_fidelity: 'Bản dịch nắm đúng các thành tố chính: các môn đồ nhìn lẫn nhau và không xác định được người Đức Giê-su đang nói đến. Tuy nhiên, “không biết” một mình làm yếu sắc thái ἀπορούμενοι (“bối rối, lúng túng, không biết phải hiểu sao”), và động từ chưa hoàn thành ἔβλεπον nên được thể hiện rõ hơn trong bản văn chính.'
  naturalness: “Cứ nhìn nhau, bối rối không biết...” là cách diễn đạt hiện đại, tự nhiên, mạch lạc, đồng thời tái hiện tốt cảnh nhìn qua lại kéo dài. “Ngài” phù hợp với lối xưng hô tôn kính thông dụng trong văn bản Kinh Thánh tiếng Việt.
  terminology: “Các môn đồ” là thuật ngữ Kinh Thánh quen dùng và phù hợp với οἱ μαθηταί. “Nói về ai” phản ánh trực tiếp περὶ τίνος λέγει, không diễn giải thành “ám chỉ ai.”
  issues:
