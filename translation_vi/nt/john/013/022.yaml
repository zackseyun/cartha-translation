  - severity: low
    issue: Khía cạnh tiếp diễn/lặp lại của ἔβλεπον chỉ được ghi ở chú thích.
    rationale: “Cứ nhìn nhau” là cách ngắn gọn, tự nhiên để biểu đạt hành động đang tiếp diễn hoặc lặp lại trong khung cảnh tường thuật.
  revised_text: Các môn đồ cứ nhìn nhau, bối rối không biết Ngài đang nói về ai.[a]
