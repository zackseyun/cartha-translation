id: JHN.13.26
reference: John 13:26
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸀ἀποκρίνεται ὁ Ἰησοῦς· Ἐκεῖνός ἐστιν ᾧ ἐγὼ ⸀βάψω τὸ ψωμίον ⸂καὶ δώσω αὐτῷ⸃· ⸂βάψας οὖν⸃ τὸ ⸀ψωμίον δίδωσιν Ἰούδᾳ Σίμωνος ⸀Ἰσκαριώτου.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/026.yaml
  text: Jesus answers[a], “It is he to whom I will dip the piece of bread and give it.” So, having dipped the piece of bread, he gives it to Judas, the son of Simon Iscariot.
translation:
  language: vi
  text: 'Đức Chúa Jêsus đáp: “Chính là người mà tôi sẽ nhúng miếng bánh rồi trao cho.” Vậy, sau khi nhúng miếng bánh, Ngài trao cho Giu-đa, con của Si-môn Ích-ca-ri-ốt.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Giu-đa Ích-ca-ri-ốt, con của Si-môn.” Cách diễn đạt Hy Lạp có thể được hiểu theo cả hai cách.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποκρίνεται
  choice: đáp
  rationale: Thì hiện tại lịch sử được diễn đạt tự nhiên bằng động từ kể chuyện tiếng Việt; “đáp” ngắn gọn và phù hợp với ngữ cảnh trả lời câu hỏi.
- source_word: Ἐκεῖνός ἐστιν
  choice: Chính là người
  rationale: Giữ sắc thái chỉ định và nhận diện một người, đồng thời tự nhiên trong tiếng Việt hiện đại.
- source_word: ᾧ
  choice: người mà ... trao cho
  rationale: Cấu trúc quan hệ tiếng Việt gắn người được nhận với hành động trao, tránh lối dịch cứng “cho người nào”.
- source_word: βάψω
  choice: sẽ nhúng
  rationale: Thể hiện rõ thì tương lai và nghĩa nhúng thức ăn, không gợi đến nghi thức tẩy rửa.
- source_word: ψωμίον
  choice: miếng bánh
  rationale: Diễn đạt một phần bánh nhỏ bằng cách nói phổ thông, tự nhiên và không quá văn cổ.
- source_word: καὶ δώσω αὐτῷ
  choice: rồi trao cho
  rationale: “Rồi” biểu thị hành động kế tiếp; tân ngữ được hiểu là miếng bánh, còn người nhận đã được nêu trong mệnh đề quan hệ.
- source_word: βάψας οὖν
  choice: Vậy, sau khi nhúng
  rationale: Phản ánh hành động của phân từ bất định xảy ra trước động từ chính và giữ lực nối kết của οὖν.
- source_word: δίδωσιν
  choice: Ngài trao
  rationale: Giữ tính sống động của hiện tại lịch sử; “Ngài” giúp xác định chủ thể tự nhiên trong câu tiếng Việt.
- source_word: Ἰούδᾳ Σίμωνος Ἰσκαριώτου
  choice: cho Giu-đa, con của Si-môn Ích-ca-ri-ốt
  rationale: Theo sát quan hệ sở hữu trực tiếp trong trật tự Hy Lạp, đồng thời giữ cách hiểu khác trong chú thích.
theological_decisions:
- issue: Danh xưng của Giu-đa trong cụm cuối câu
  choice: Giu-đa, con của Si-môn Ích-ca-ri-ốt
  alternative: Giu-đa Ích-ca-ri-ốt, con của Si-môn
  rationale: Cú pháp Σίμωνος Ἰσκαριώτου trực tiếp cho phép hiểu “Si-môn Ích-ca-ri-ốt,” nhưng cụm từ cũng có thể được hiểu theo danh xưng truyền thống dành cho Giu-đa; bản chính theo cấu trúc gần nhất và chú thích bảo tồn cách hiểu kia.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, dùng các tên riêng theo lối phiên âm Kinh Thánh quen thuộc. Duy trì hiện tại lịch sử bằng “đáp” và “trao”; tránh cấu trúc quá sát chữ gây gượng trong tiếng Việt.
