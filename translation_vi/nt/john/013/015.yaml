source:
  edition: SBLGNT
  text: ὑπόδειγμα γὰρ ἔδωκα ὑμῖν ἵνα καθὼς ἐγὼ ἐποίησα ὑμῖν καὶ ὑμεῖς ποιῆτε.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/015.yaml
  text: For I have given you an example[a], so that just as I have done to you[c][b], you also may do.
translation:
  language: vi
  text: Vì tôi đã nêu gương[a] cho anh em, để anh em cũng làm như tôi đã làm cho anh em.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “mẫu mực” hoặc “khuôn mẫu”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπόδειγμα
  choice: gương
  rationale: Danh từ này chỉ một gương mẫu được đưa ra để người khác noi theo. “Nêu gương” tự nhiên trong tiếng Việt hiện đại và phù hợp với hành động rửa chân ngay trong ngữ cảnh.
- source_word: γὰρ
  choice: Vì
  rationale: Từ này nối câu với lời dạy trước đó bằng cách giải thích cơ sở cho điều Chúa Giê-su vừa nói.
- source_word: ἔδωκα
  choice: đã nêu
  rationale: Thì aorist chỉ hành động đã hoàn tất; “đã nêu gương” diễn đạt tự nhiên việc Chúa Giê-su vừa làm và giá trị hiện tại của hành động ấy.
- source_word: ἵνα
  choice: để
  rationale: “Để” biểu đạt rõ mục đích của việc Chúa Giê-su nêu gương.
- source_word: καθὼς
  choice: như ... thế nào
  rationale: Cấu trúc tương liên “như ... thế nào ... cũng ... như vậy” làm rõ sự tương ứng giữa hành động của Chúa Giê-su và hành động được mong đợi nơi các môn đồ.
- source_word: ἐποίησα ὑμῖν
  choice: tôi đã làm cho anh em
  rationale: “Làm cho anh em” giữ động từ rộng nghĩa ποιέω và diễn đạt tự nhiên sắc thái của cách dative ὑμῖν trong ngữ cảnh Chúa rửa chân cho các môn đồ, mà không giải thích thêm bản chất của lợi ích.
- source_word: καὶ ὑμεῖς
  choice: anh em cũng
  rationale: “Cũng” bảo toàn ý đưa các môn đồ vào sự tương ứng với hành động của Chúa Giê-su; “anh em” là cách xưng hô số nhiều tự nhiên trong văn cảnh.
- source_word: ποιῆτε
  choice: làm
  rationale: Sau ἵνα, động từ subjunctive nằm trong mệnh đề mục đích. Tiếng Việt không cần trợ động từ tương ứng; cấu trúc “để ... cũng làm” vừa tự nhiên vừa giữ được ý định và trách nhiệm hàm chứa.
theological_decisions:
- issue: Mức độ và hình thức noi theo hành động của Chúa Giê-su
  choice: Trình bày hành động của Chúa Giê-su như một gương để các môn đồ làm tương ứng, nhưng không xác định đây nhất thiết là nghi lễ phổ quát hay chỉ là biểu tượng.
  alternative: Diễn đạt thành một mệnh lệnh thiết lập nghi thức rửa chân cho mọi tín hữu, hoặc làm nhẹ đi thành một biểu tượng không đòi hỏi sự noi theo cụ thể.
  rationale: Câu Hy Lạp khẳng định rõ mục đích nêu gương để các môn đồ làm theo, nhưng riêng câu này không giải quyết phạm vi nghi lễ hay cách áp dụng trong mọi bối cảnh.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng cặp tương liên “như ... thế nào ... cũng ... như vậy” để câu tiếng Việt tự nhiên mà vẫn phản ánh chặt chẽ cấu trúc so sánh của nguyên văn.
