source:
  edition: SBLGNT
  text: ἐν τούτῳ γνώσονται πάντες ὅτι ἐμοὶ μαθηταί ἐστε, ἐὰν ἀγάπην ἔχητε ἐν ἀλλήλοις.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/035.yaml
  text: By this everyone will know that you are my disciples[b][a], if you have love for one another.
translation:
  language: vi
  text: Qua điều này, mọi người sẽ nhận biết anh em là môn đồ của tôi, nếu anh em yêu thương nhau.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “nếu anh em có tình yêu thương với nhau”; nghĩa là yêu thương lẫn nhau.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: Qua điều này
  rationale: 'Cụm giới từ mang sắc thái phương tiện/chứng cứ: tình yêu thương lẫn nhau là dấu hiệu để người ta nhận biết các môn đồ. Cách dịch này tự nhiên trong tiếng Việt và vẫn giữ được điểm quy chiếu của đại từ chỉ định.'
- source_word: γνώσονται
  choice: sẽ nhận biết
  rationale: Động từ ở đây nói đến việc nhận ra một sự thật hay căn tính qua dấu hiệu; “nhận biết” truyền đạt sắc thái ấy rõ hơn “biết” mà không diễn giải quá mức.
- source_word: πάντες
  choice: mọi người
  rationale: Dạng số nhiều giống đực được dùng theo nghĩa bao quát; “mọi người” diễn đạt phạm vi phổ quát tự nhiên và không giới hạn vào nam giới.
- source_word: ἐμοὶ μαθηταί ἐστε
  choice: anh em là môn đồ của tôi
  rationale: Dữ cách ἐμοί thể hiện quan hệ thuộc về; cấu trúc “môn đồ của tôi” là cách nói tự nhiên, giữ quan hệ thầy–trò của μαθητής. “Anh em” phù hợp với lời Chúa Giê-su nói trực tiếp với nhóm môn đồ.
- source_word: ἐὰν
  choice: nếu
  rationale: Giữ nguyên hình thức điều kiện của tiếng Hy Lạp, không chuyển thành một khẳng định về công trạng hay nguyên nhân tạo nên địa vị môn đồ.
- source_word: ἀγάπην ἔχητε ἐν ἀλλήλοις
  choice: anh em yêu thương nhau
  rationale: Cách nói nguyên văn gần với “có tình yêu thương giữa nhau”; tiếng Việt tự nhiên diễn đạt hành động và quan hệ hỗ tương bằng “yêu thương nhau”, đồng thời giữ liên hệ từ vựng với ἀγάπη.
theological_decisions:
- issue: Tính chất của điều kiện do ἐὰν dẫn vào
  choice: nếu anh em yêu thương nhau
  alternative: khi anh em yêu thương nhau
  rationale: “Nếu” bảo toàn cấu trúc điều kiện và cho thấy tình yêu hỗ tương là dấu hiệu nhận diện môn đồ, không hàm ý rằng họ nhờ công trạng yêu thương mà đạt được địa vị ấy.
- issue: Phạm vi của πάντες
  choice: mọi người
  alternative: tất cả mọi người
  rationale: Cách dịch bao quát mọi người, không đưa vào giới hạn giới tính vốn không có trong ngữ cảnh.
- issue: Quan hệ giữa tình yêu và căn tính môn đồ
  choice: dùng dấu hai chấm trước mệnh đề điều kiện
  alternative: dùng dấu phẩy
  rationale: Dấu hai chấm làm rõ mệnh đề sau nêu dấu hiệu nhận diện, nhưng không thêm quan hệ nhân quả cứu độ hay giải quyết thay cho người đọc mọi sắc thái của điều kiện.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” cho lời trực tiếp nói với nhóm môn đồ; “môn đồ” giữ thuật ngữ quen thuộc của các sách Phúc Âm. Cấu trúc ngắn gọn, phù hợp lời tuyên bố trực tiếp.
