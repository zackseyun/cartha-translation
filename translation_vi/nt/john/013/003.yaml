source:
  edition: SBLGNT
  text: ⸀εἰδὼς ὅτι πάντα ⸀ἔδωκεν αὐτῷ ὁ πατὴρ εἰς τὰς χεῖρας, καὶ ὅτι ἀπὸ θεοῦ ἐξῆλθεν καὶ πρὸς τὸν θεὸν ὑπάγει,
base_translation:
  language: en
  yaml_path: translation/nt/john/013/003.yaml
  text: Jesus[a], knowing that the Father had given all things into his hands, and that he had come from God and was going to God[b],
translation:
  language: vi
  text: Đức Giê-su biết rằng Cha đã trao mọi sự vào tay Ngài, và Ngài đã đến từ Đức Chúa Trời[a], đang đi đến với Đức Chúa Trời[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đã xuất phát từ Đức Chúa Trời.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể hiểu: “đang trở về với Đức Chúa Trời”; nguyên văn chỉ nói “đang đi đến với Đức Chúa Trời.”'
    reason: alternative_reading
lexical_decisions:
- source_word: εἰδὼς
  choice: biết rằng
  rationale: Phân từ này nêu hoàn cảnh làm nền cho hành động tiếp theo. “Biết rằng” tự nhiên trong tiếng Việt và không diễn giải quá mức sắc thái thời gian.
- source_word: πάντα
  choice: mọi sự
  rationale: Giữ phạm vi bao quát của dạng trung tính số nhiều, đồng thời dùng cách diễn đạt trang trọng, quen thuộc trong tiếng Việt.
- source_word: ἔδωκεν
  choice: đã trao
  rationale: “Trao” thể hiện việc giao phó thẩm quyền tốt hơn “cho”, còn “đã” cho thấy hành động hoàn tất trước cảnh đang được thuật lại.
- source_word: εἰς τὰς χεῖρας
  choice: vào tay Ngài
  rationale: Giữ hình ảnh cụ thể của nguyên văn về quyền nắm giữ và sự giao phó; thành ngữ này vẫn rõ nghĩa trong tiếng Việt.
- source_word: ὁ πατὴρ
  choice: Cha
  rationale: Giữ danh xưng “Cha” của nguyên văn, không thêm đại từ sở hữu vốn không có trong tiếng Hy Lạp.
- source_word: ἀπὸ θεοῦ
  choice: từ Đức Chúa Trời
  rationale: Dịch đúng “từ Đức Chúa Trời”, không thay bằng “từ Cha” hay thêm ý về nơi hiện diện.
- source_word: ἐξῆλθεν
  choice: đã ... mà đến
  rationale: Diễn đạt tự nhiên nguồn gốc và sự sai đến trong ngữ cảnh Giăng, đồng thời không thu hẹp động từ vào chỉ một sắc thái.
- source_word: πρὸς τὸν θεὸν
  choice: đến với Đức Chúa Trời
  rationale: “Đến với” diễn đạt hướng chuyển động và vẫn để ngỏ sắc thái tương quan của πρός, không tự ý thêm “trở về”.
- source_word: ὑπάγει
  choice: nay đang đi
  rationale: Thể hiện động tác ra đi đang đến gần trong mạch kể, mà không thêm đích đến hay ý quay lại ngoài điều câu văn nói rõ.
theological_decisions:
- issue: Ngôn ngữ về nguồn gốc của Đấng Christ trong ἀπὸ θεοῦ ἐξῆλθεν
  choice: Ngài đã từ Đức Chúa Trời mà đến
  alternative: Ngài đã xuất phát từ Đức Chúa Trời
  rationale: Cách dịch giữ nguyên lời khẳng định mạnh mẽ của Giăng về nguồn gốc và sứ mạng của Đức Giê-su, nhưng không đưa vào câu những công thức thần học về sau.
- issue: Ngôn ngữ về đích đến trong πρὸς τὸν θεὸν ὑπάγει
  choice: đang đi đến với Đức Chúa Trời
  alternative: đang trở về với Đức Chúa Trời
  rationale: “Trở về” phù hợp với mạch văn rộng hơn nhưng thêm rõ ý quay lại, trong khi mệnh đề Hy Lạp ở đây chỉ trực tiếp nói Ngài đi đến với Đức Chúa Trời. Bản dịch chính giữ sự dè dặt của nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Giê-su”, “Đức Chúa Trời” và viết hoa “Ngài” để quy chiếu rõ về Đức Giê-su. Dấu phẩy cuối câu được giữ vì câu 13:3 tiếp nối trực tiếp sang hành động ở câu 13:4.
