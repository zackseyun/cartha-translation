source:
  edition: SBLGNT
  text: λέγει αὐτῷ Σίμων Πέτρος· Κύριε, μὴ τοὺς πόδας μου μόνον ἀλλὰ καὶ τὰς χεῖρας καὶ τὴν κεφαλήν.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/009.yaml
  text: Simon Peter says to him[a], “Lord, not only my feet, but also my hands and my head.”
translation:
  language: vi
  text: 'Si-môn Phi-e-rơ thưa với Ngài: “Lạy Chúa[a], không chỉ chân con, mà cả tay và đầu con nữa!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay “Thầy.” Từ Hy Lạp: Kyrios.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: thưa
  rationale: Động từ ở thì hiện tại lịch sử làm lời kể thêm sống động. Trong tiếng Việt, “thưa” tự nhiên khi dẫn lời Phi-e-rơ kính cẩn nói với Chúa Giê-su, dù không biểu thị riêng thì hiện tại.
- source_word: αὐτῷ
  choice: với Ngài
  rationale: Giữ đại từ như bản Hy Lạp thay vì thay bằng tên Chúa Giê-su; “Ngài” phù hợp với lời kể trang trọng và đối tượng được nhắc đến.
- source_word: Σίμων Πέτρος
  choice: Si-môn Phi-e-rơ
  rationale: Dùng dạng phiên âm tên riêng quen thuộc trong tiếng Việt.
- source_word: Κύριε
  choice: Lạy Chúa
  rationale: “Lạy Chúa” là cách xưng hô trực tiếp, tự nhiên và trang trọng trong tiếng Việt, đồng thời giữ được sức nặng của κύριος.
- source_word: μὴ ... μόνον ἀλλὰ καὶ
  choice: không chỉ ... mà cả ... nữa
  rationale: 'Diễn đạt tự nhiên cấu trúc mở rộng tương phản: không chỉ một phần mà thêm những phần khác nữa.'
- source_word: τοὺς πόδας μου
  choice: chân con
  rationale: “Chân” trong tiếng Việt thường không cần đánh dấu số nhiều; “con” thể hiện ngôi thứ nhất trong lời thưa kính cẩn với Chúa Giê-su.
- source_word: τὰς χεῖρας καὶ τὴν κεφαλήν
  choice: tay và đầu con
  rationale: Từ sở hữu μου không được lặp lại trong tiếng Hy Lạp nhưng chi phối tự nhiên các bộ phận cùng liệt kê; tiếng Việt đặt “con” cuối cụm phối hợp để tránh lặp.
theological_decisions:
- issue: Cách dịch κύριος khi Phi-e-rơ trực tiếp thưa với Chúa Giê-su
  choice: Lạy Chúa
  alternative: Thưa Thầy
  rationale: “Lạy Chúa” giữ cả sắc thái kính trọng lẫn chiều sâu thần học có thể có trong Tin Mừng Giăng, nhưng chú thích vẫn nêu cách hiểu theo nghĩa danh xưng tôn kính là “Thầy”.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “thưa” và cặp xưng hô “Ngài/con” để lời thoại tự nhiên trong tiếng Việt. Dấu chấm than truyền đạt sự đáp lời mạnh mẽ, nhiệt thành của Phi-e-rơ mà không thêm nội dung.
