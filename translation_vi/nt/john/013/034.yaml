  verdict: approve
  source_fidelity: 'Bản dịch chuyển đạt đầy đủ các thành tố của câu Hy Lạp: «một điều răn mới», hành động trao ban của ngôi thứ nhất cho các môn đồ, nội dung yêu thương tương hỗ, khuôn mẫu «Như Ta đã yêu thương các con», và sự nhấn mạnh «các con cũng». Cách dùng hai mệnh đề «hãy yêu thương nhau» diễn đạt phù hợp lực truyền khiến của cấu trúc ἵνα trong ngữ cảnh này. Không diễn giải thêm ý nghĩa còn để ngỏ của «mới».'
  naturalness: Câu văn hiện đại, rõ ràng, trang trọng và tự nhiên trong ngữ cảnh lời trực tiếp của Chúa Giê-su. Đại từ «Ta/các con» nhất quán, phù hợp với quan hệ diễn giả–môn đồ và sắc thái Kinh Thánh. Sự lặp lại «yêu thương nhau» phản ánh sự lặp lại có chủ ý của nguyên văn.
  terminology: «Điều răn» là thuật ngữ chuẩn xác và có sắc thái đạo đức trang trọng cho ἐντολή. «Yêu thương» bảo toàn sự lặp lại của nhóm từ ἀγαπάω và tự nhiên hơn «yêu» trong lời dạy về quan hệ cộng đồng. Chú thích [a] nêu cách hiểu mục đích/kết quả của mệnh đề ἵνα thứ hai mà không áp đặt một cách hiểu duy nhất.
