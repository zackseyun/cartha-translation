id: JHN.13.34
reference: John 13:34
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐντολὴν καινὴν δίδωμι ὑμῖν ἵνα ἀγαπᾶτε ἀλλήλους, καθὼς ἠγάπησα ὑμᾶς ἵνα καὶ ὑμεῖς ἀγαπᾶτε ἀλλήλους.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/034.yaml
  text: 'A new commandment I give to you: that you love one another[a]. Just as I loved you[b], you also are to love one another.'
translation:
  language: vi
  text: 'Ta ban cho các con một điều răn mới: các con hãy yêu thương nhau. Như Ta đã yêu thương các con, các con cũng hãy yêu thương nhau.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Như Ta đã yêu thương các con, để các con cũng yêu thương nhau.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐντολὴν καινὴν
  choice: một điều răn mới
  rationale: “Điều răn” giữ được tính trang trọng và sức nặng đạo đức của ἐντολή; “mới” chuyển đạt trực tiếp καινήν mà không giải thích thêm mới theo nghĩa thời gian hay phẩm chất.
- source_word: δίδωμι ὑμῖν
  choice: Ta ban cho các con
  rationale: “Ban cho” tự nhiên trong lời tuyên bố trang trọng và giữ rõ người trao cùng người nhận. “Ta/các con” phù hợp quan hệ giữa Chúa Giê-su và các môn đồ trong diễn từ này.
- source_word: ἵνα ἀγαπᾶτε ἀλλήλους
  choice: các con hãy yêu thương nhau
  rationale: Sau “ban một điều răn”, ἵνα nêu nội dung điều răn; “hãy” diễn đạt tự nhiên lực truyền khiến. “Yêu thương” được lặp lại để giữ trọng tâm từ vựng.
- source_word: καθὼς ἠγάπησα ὑμᾶς
  choice: Như Ta đã yêu thương các con
  rationale: “Như” bảo toàn khả năng vừa chỉ khuôn mẫu vừa chỉ chuẩn mực; “đã yêu thương” phản ánh động từ aorist mà không thu hẹp tình yêu ấy vào một hành động duy nhất.
- source_word: ἵνα καὶ ὑμεῖς ἀγαπᾶτε ἀλλήλους
  choice: các con cũng hãy yêu thương nhau
  rationale: “Cũng” giữ sự nhấn mạnh của καὶ ὑμεῖς; “hãy” thể hiện lực khuyên truyền trong tiếng Việt, đồng thời chú thích ghi nhận khả năng hiểu như mệnh đề mục đích/kết quả.
theological_decisions:
- issue: Ý nghĩa của “điều răn mới”
  choice: Giữ nguyên cách nói “một điều răn mới” mà không giải thích tính mới trong chính văn.
  alternative: Mới theo thời gian; mới về phẩm chất; hoặc mới trong sự thể hiện qua tình yêu của Chúa Giê-su.
  rationale: Câu Hy Lạp khẳng định điều răn là mới nhưng không xác định ngay tại đây nó mới theo nghĩa nào.
- issue: Chức năng của ἵνα thứ hai
  choice: 'Dịch với lực khuyên truyền: “các con cũng hãy yêu thương nhau”.'
  alternative: “để các con cũng yêu thương nhau”, nhấn mạnh mục đích hoặc kết quả.
  rationale: Cấu trúc cho phép sắc thái mục đích/kết quả, nhưng trong mạch điều răn, cách diễn đạt khuyên truyền tự nhiên hơn; sự nhập nhằng được giữ trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “Ta/các con” tạo sắc thái tôn nghiêm nhưng gần gũi, thích hợp với lời Chúa Giê-su nói trực tiếp với các môn đồ. Dùng “yêu thương” thay vì chỉ “yêu” để tự nhiên trong tiếng Việt và giữ sắc thái hành động giữa cộng đồng.
