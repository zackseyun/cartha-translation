  text: ⸀ἀναπεσὼν ἐκεῖνος οὕτως ἐπὶ τὸ στῆθος τοῦ Ἰησοῦ λέγει αὐτῷ· Κύριε, τίς ἐστιν;
base_translation:
  language: en
  yaml_path: translation/nt/john/013/025.yaml
  text: So he[a], leaning back in this way against Jesus' chest, says to him, “Lord, who is it?”
translation:
  language: vi
  text: 'Người ấy, trong tư thế ấy, ngả người tựa vào ngực Đức Chúa Jêsus[a] và hỏi Ngài: “Lạy Chúa, người ấy là ai?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “ngả người vào ngực Đức Chúa Jêsus.” Nguyên văn phản ánh tư thế nằm nghiêng khi dùng bữa tại bàn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναπεσὼν
  choice: ngả mình
  rationale: Trong bối cảnh dùng bữa theo tư thế nằm nghiêng, động từ diễn tả việc ngả người về phía sau; “ngả mình” vừa tự nhiên vừa thể hiện được chuyển động.
- source_word: ἐκεῖνος
  choice: người ấy
  rationale: Giữ sắc thái chỉ định của đại từ Hy Lạp mà không thêm danh từ giải thích như “môn đồ”.
- source_word: οὕτως
  choice: như vậy
  rationale: Liên kết động tác với tư thế vừa được mô tả ở câu trước, đồng thời giữ rõ nghĩa của trạng từ.
- source_word: ἐπὶ τὸ στῆθος τοῦ Ἰησοῦ
  choice: vào ngực Đức Chúa Jêsus
  rationale: Diễn tả tự nhiên việc người môn đồ ngả sát vào vùng ngực của Đức Chúa Jêsus trong tư thế nằm nghiêng dùng bữa.
- source_word: λέγει αὐτῷ
  choice: hỏi Ngài
  rationale: Động từ nguyên nghĩa là “nói với”, nhưng lời theo sau là câu hỏi; “hỏi” tự nhiên trong tiếng Việt. Dùng hiện tại tự sự không tự nhiên bằng cách nối động tác trong mạch kể tiếng Việt.
- source_word: Κύριε
  choice: Lạy Chúa
  rationale: Giữ tước hiệu “Chúa” và hình thức xưng hô trực tiếp trang trọng, tự nhiên trong tiếng Việt.
- source_word: τίς ἐστιν;
  choice: người đó là ai?
  rationale: Câu hỏi nhằm xác định người mà Đức Chúa Jêsus vừa nói đến; cách diễn đạt này rõ và tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Cách dịch κύριος khi trực tiếp thưa với Đức Chúa Jêsus
  choice: Lạy Chúa
  alternative: Thưa Ngài; Lạy Thầy
  rationale: “Lạy Chúa” giữ được cả sắc thái kính trọng trong lời xưng hô lẫn chiều kích Kitô học của danh xưng, mà không buộc phải chọn riêng một sắc thái.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Người ấy” giữ sát đại từ chỉ định; chú thích giải thích tư thế dùng bữa xa lạ với độc giả hiện đại. Dùng “Đức Chúa Jêsus” theo lối gọi trang trọng, còn đại từ “Ngài” tránh lặp.
