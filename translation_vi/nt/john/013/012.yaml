id: JHN.13.12
reference: John 13:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ὅτε οὖν ἔνιψεν τοὺς πόδας αὐτῶν ⸀καὶ ἔλαβεν τὰ ἱμάτια αὐτοῦ ⸂καὶ ἀνέπεσεν⸃, πάλιν εἶπεν αὐτοῖς· Γινώσκετε τί πεποίηκα ὑμῖν;
base_translation:
  language: en
  yaml_path: translation/nt/john/013/012.yaml
  text: So when he had washed their feet and taken his garments and reclined again[a], he said to them[b], “Do you understand what I have done for you?”
translation:
  language: vi
  text: 'Vậy, sau khi rửa chân cho họ, lấy lại áo ngoài và trở lại bàn ăn[a], Đức Giê-su nói với họ: “Anh em có hiểu điều Thầy đã làm cho anh em[b] không?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát nghĩa hơn: “lại ngả mình xuống”; động từ Hy Lạp nói đến tư thế ngả mình tại bàn ăn.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “đã làm đối với anh em”; cách dative trong tiếng Hy Lạp có thể được hiểu theo cả hai cách, nhưng “cho anh em” phù hợp với bối cảnh phục vụ.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ὅτε οὖν
  choice: Vậy, sau khi
  rationale: Diễn đạt tự nhiên cả quan hệ thời gian của ὅτε lẫn chức năng nối tiếp câu chuyện của οὖν.
- source_word: ἔνιψεν τοὺς πόδας αὐτῶν
  choice: rửa chân cho họ
  rationale: Cách nói tiếng Việt tự nhiên, giữ nguyên hành động và đối tượng; thì hoàn thành trước được thể hiện qua cấu trúc “sau khi”.
- source_word: ἔλαβεν τὰ ἱμάτια αὐτοῦ
  choice: lấy lại áo ngoài
  rationale: ἔλαβεν có nghĩa cơ bản là “lấy”; “lại” được gợi bởi mạch truyện trước đó, còn ἱμάτια trong ngữ cảnh chỉ áo đã cởi ra. Cách dịch tránh diễn giải thẳng thành “mặc vào”.
- source_word: καὶ ἀνέπεσεν
  choice: và trở lại bàn ăn
  rationale: Trong bối cảnh dùng bữa, ἀναπίπτω chỉ việc ngả mình vào bàn. Cách dịch này tự nhiên trong tiếng Việt và không gây ấn tượng sai rằng Đức Giê-su nằm nghỉ.
- source_word: πάλιν
  choice: trở lại
  rationale: Giữ ý lặp lại của πάλιν, kết hợp tự nhiên với hành động quay về vị trí tại bàn.
- source_word: Γινώσκετε
  choice: Anh em có hiểu
  rationale: Trong câu hỏi về ý nghĩa hành động, γινώσκω mang sắc thái nhận biết, thấu hiểu hơn là chỉ biết một sự kiện.
- source_word: τί πεποίηκα ὑμῖν
  choice: điều Thầy đã làm cho anh em
  rationale: Thì hoàn thành πεποίηκα được thể hiện bằng “đã làm”, nhấn mạnh hành động đã hoàn tất và còn có ý nghĩa hiện tại. Dative ὑμῖν được dịch theo sắc thái lợi ích “cho anh em” trong ngữ cảnh phục vụ.
theological_decisions:
- issue: Tư thế của Đức Giê-su sau khi rửa chân
  choice: trở lại bàn ăn
  alternative: lại ngả mình tại bàn; lại ngồi xuống
  rationale: Giữ bối cảnh bữa ăn cổ đại mà không buộc độc giả hiện đại phải hình dung sai từ một bản dịch quá sát hình thức. Chú thích nêu rõ nghĩa đen và tư thế dùng bữa.
- issue: Sắc thái của ὑμῖν trong câu hỏi của Đức Giê-su
  choice: cho anh em
  alternative: đối với anh em; với anh em
  rationale: Ngữ cảnh hành động phục vụ ủng hộ sắc thái lợi ích, nhưng hình thái dative vẫn cho phép cách hiểu trung tính hơn; chú thích bảo tồn khả năng đó.
- issue: Cách xưng hô của Đức Giê-su với các môn đồ
  choice: Thầy—anh em
  alternative: Ta—các ngươi; tôi—các anh
  rationale: “Thầy—anh em” phù hợp quan hệ được nêu ngay trong văn cảnh Giăng 13, trang trọng nhưng tự nhiên, không thêm lập trường hệ phái.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng và dễ hiểu. Dùng “Đức Giê-su” cùng cặp xưng hô “Thầy—anh em”. Các dấu chú thích [a], [b] đều được đặt ngay trong chính văn.
