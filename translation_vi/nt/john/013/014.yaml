id: JHN.13.14
reference: John 13:14
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἰ οὖν ἐγὼ ἔνιψα ὑμῶν τοὺς πόδας ὁ κύριος καὶ ὁ διδάσκαλος, καὶ ὑμεῖς ὀφείλετε ἀλλήλων νίπτειν τοὺς πόδας·
base_translation:
  language: en
  yaml_path: translation/nt/john/013/014.yaml
  text: If I then[a], the Lord and the Teacher, have washed your feet, you also ought to wash one another’s feet.
translation:
  language: vi
  text: Vậy, nếu chính Ta, là Chúa và là Thầy, đã rửa chân cho các con, thì các con cũng phải rửa chân cho nhau.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰ οὖν
  choice: Vậy, nếu ... thì
  rationale: Giữ cả quan hệ điều kiện của εἰ lẫn sức suy luận của οὖν, đồng thời dùng cấu trúc điều kiện tự nhiên trong tiếng Việt.
- source_word: ἐγὼ
  choice: Ta
  rationale: Giữ đại từ được nêu rõ và có tính nhấn mạnh trong tiếng Hy Lạp; “Ta” phù hợp với lời Đức Giê-su nói với các môn đồ trong văn phong Kinh Thánh trang trọng.
- source_word: ἔνιψα
  choice: đã rửa
  rationale: Diễn đạt hành động hoàn tất vừa xảy ra; “đã rửa” tự nhiên hơn trong tiếng Việt mà vẫn giữ giá trị của thì aorist trong ngữ cảnh.
- source_word: ὑμῶν τοὺς πόδας
  choice: chân cho các con
  rationale: Cấu trúc tiếng Việt tự nhiên khi nói một người rửa chân cho người khác, tương ứng chính xác với “chân của anh em” trong nguyên văn.
- source_word: ὁ κύριος
  choice: Chúa
  rationale: Giữ κύριος như một tước hiệu chỉ Đức Giê-su và bảo toàn sự tương phản giữa địa vị của Ngài với hành động phục vụ khiêm nhường.
- source_word: ὁ διδάσκαλος
  choice: Thầy
  rationale: “Thầy” là cách gọi tự nhiên, trang trọng và đúng ngữ cảnh môn đồ dành cho người dạy mình; ở đây được viết hoa như tước hiệu song song với “Chúa”.
- source_word: καὶ ὑμεῖς
  choice: các con cũng
  rationale: Giữ καὶ với nghĩa “cũng” và sắc thái nhấn mạnh của đại từ ὑμεῖς, làm nổi bật nghĩa vụ tương ứng của các môn đồ.
- source_word: ὀφείλετε
  choice: phải
  rationale: Diễn đạt rõ nghĩa vụ đạo đức của ὀφείλετε trong tiếng Việt hiện đại mà không biến câu thành một lối diễn giải rộng hơn.
- source_word: ἀλλήλων
  choice: cho nhau
  rationale: Cách diễn đạt tương hỗ tự nhiên trong tiếng Việt, giữ đúng ý “lẫn nhau” của nguyên văn.
- source_word: νίπτειν τοὺς πόδας
  choice: rửa chân
  rationale: Giữ nguyên hành động cụ thể là rửa một phần cơ thể, không khái quát hóa thành một lời diễn giải về phục vụ.
theological_decisions:
- issue: Cách dịch κύριος như một tước hiệu Kitô học
  choice: Chúa
  alternative: Chủ
  rationale: Trong ngữ cảnh, κύριος là tước hiệu các môn đồ dùng cho Đức Giê-su và làm nền cho lập luận từ địa vị cao trọng đến hành động khiêm nhường. “Chúa” giữ được chức năng tước hiệu ấy trong tiếng Việt.
- issue: Tính chất của lời dạy về việc rửa chân
  choice: Giữ hành động cụ thể “rửa chân cho nhau”
  alternative: Diễn ý thành “khiêm nhường phục vụ nhau”
  rationale: Nguyên văn nêu đích danh việc rửa chân. Dù hành động mang ý nghĩa nêu gương, bản dịch không nên thay nó bằng một sự áp dụng khái quát.
- issue: Sắc thái điều kiện trong lời lập luận của Đức Giê-su
  choice: Giữ cấu trúc “nếu ... thì”
  alternative: 'Diễn thành một mệnh đề nguyên nhân: “Vì Ta ... nên”'
  rationale: εἰ là tiểu từ điều kiện. Trong ngữ cảnh điều kiện được xem là có thật, nhưng bản dịch vẫn giữ hình thức lập luận của nguyên văn thay vì âm thầm chuyển thành quan hệ nguyên nhân.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng cặp xưng hô “Ta—các con” để thể hiện quan hệ giữa Đức Giê-su và các môn đồ; viết hoa “Chúa” và “Thầy” vì cả hai được dùng như tước hiệu. Không cần chú thích vì phương án “Chúa” là tự nhiên và không có dị bản văn bản cần ghi nhận.
