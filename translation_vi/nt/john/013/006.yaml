- from: 'Vậy, Đức Chúa Jêsus đến chỗ Si-môn Phi-e-rơ. Ông thưa với Ngài[a]: “Lạy Chúa, chính Ngài rửa chân cho con sao?”'
  to: 'Vậy, Đức Chúa Giê-su đến với Si-môn Phi-e-rơ. Phi-e-rơ thưa với Ngài[a]: “Lạy Chúa, chính Ngài rửa chân cho con sao?”'
