  text: ἔρχεται οὖν πρὸς Σίμωνα Πέτρον. ⸀λέγει ⸀αὐτῷ· Κύριε, σύ μου νίπτεις τοὺς πόδας;
base_translation:
  language: en
  yaml_path: translation/nt/john/013/006.yaml
  text: So he comes to Simon Peter. He says to him[a], “Lord, are you washing my feet?”
translation:
  language: vi
  text: 'Vậy, Đức Chúa Giê-su đến với Si-môn Phi-e-rơ. Phi-e-rơ thưa với Ngài[a]: “Lạy Chúa, chính Ngài rửa chân cho con sao?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch lời xưng hô này là: “Thưa ngài”; từ Hy Lạp κύριε có thể được dùng như một cách xưng hô kính trọng, dù ở đây bản dịch giữ “Lạy Chúa”.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἔρχεται
  choice: đến
  rationale: Động từ hiện tại mang tính kể chuyện được chuyển sang lối kể tự nhiên của tiếng Việt; “đến” diễn tả chuyển động về phía Si-môn Phi-e-rơ.
- source_word: οὖν
  choice: Vậy
  rationale: Giữ chức năng nối tiếp và suy dẫn nhẹ trong mạch kể, đồng thời tự nhiên trong văn phong trang trọng hiện đại.
- source_word: πρὸς Σίμωνα Πέτρον
  choice: đến chỗ Si-môn Phi-e-rơ
  rationale: Diễn đạt tự nhiên chuyển động đến nơi một người đang ở, thay vì cách dịch cứng “đến Si-môn Phi-e-rơ”.
- source_word: λέγει αὐτῷ
  choice: Ông thưa với Ngài
  rationale: Chủ thể theo ngữ cảnh là Phi-e-rơ; “thưa” phù hợp lời nói kính trọng với Đức Chúa Jêsus, còn “với Ngài” phản ánh αὐτῷ.
- source_word: Κύριε
  choice: Lạy Chúa
  rationale: Giữ nghĩa mặc định “Chúa” và sắc thái xưng hô trực tiếp, kính trọng; đồng thời bảo tồn chiều sâu Cơ Đốc luận có thể có trong Tin Lành Giăng.
- source_word: σύ
  choice: chính Ngài
  rationale: Từ “chính” thể hiện sự nhấn mạnh của đại từ σύ và sự sửng sốt của Phi-e-rơ.
- source_word: μου
  choice: cho con
  rationale: Trong cấu trúc tiếng Việt “rửa chân cho con” tự nhiên hơn “rửa chân con”, đồng thời thể hiện quan hệ của đại từ sở hữu Hy Lạp với đôi chân.
- source_word: νίπτεις
  choice: rửa
  rationale: Chỉ việc rửa một phần thân thể, ở đây là chân; dạng câu hỏi trong cảnh đang diễn ra truyền đạt phương diện hiện tại mà không cần thêm “đang” một cách nặng nề.
- source_word: τοὺς πόδας
  choice: chân
  rationale: Tiếng Việt tự nhiên dùng danh từ số ít tập hợp “chân” trong cụm “rửa chân”.
theological_decisions:
- issue: Cách dịch κύριος khi Phi-e-rơ xưng hô với Đức Chúa Jêsus
  choice: Chúa
  alternative: Thưa ngài
  rationale: “Chúa” giữ cả sắc thái kính trọng lẫn chiều sâu Cơ Đốc luận tiềm ẩn của sách Giăng, nhưng chú thích ghi nhận rằng từ Hy Lạp cũng có thể chỉ là cách xưng hô lịch sự trong một số ngữ cảnh.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Jêsus”, “Ngài”, “con” theo ngữ cảnh môn đồ kính cẩn thưa với Chúa. Hiện tại lịch sử của tiếng Hy Lạp không được tái tạo máy móc vì tiếng Việt kể chuyện tự nhiên không đánh dấu thì như tiếng Anh; sắc thái sống động được giữ qua trình tự câu và câu hỏi nhấn mạnh “chính Ngài”.
