    issue: “đến chỗ Si-môn Phi-e-rơ” thiên về địa điểm
    rationale: πρὸς Σίμωνα Πέτρον chỉ chuyển động hướng đến con người. “Đến với Si-môn Phi-e-rơ” tương ứng trực tiếp và tự nhiên hơn.
  - severity: medium
    issue: Chính tả “Jêsus” không phải dạng hiện hành của tiếng Việt chuẩn hiện đại
    rationale: Dạng “Giê-su” là cách phiên âm thông dụng trong tiếng Việt hiện đại. Chuẩn hóa tên giúp bản dịch phù hợp biến thể mục tiêu.
  - severity: low
    issue: Đại từ “Ông” có tiền ngữ chưa thật rõ
    rationale: Trong câu trước Si-môn Phi-e-rơ là đối tượng của động từ “đến”; nêu rõ “Phi-e-rơ thưa” làm sáng tỏ rằng ông là người nói, phù hợp ngữ cảnh của câu.
