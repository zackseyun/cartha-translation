review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp truyền đạt đúng mạch chính: Đức Chúa Giê-su đến với Si-môn Phi-e-rơ, rồi Phi-e-rơ ngạc nhiên hỏi việc Ngài rửa chân mình. Tuy nhiên, “đến chỗ” chuyển trọng tâm từ chuyển động hướng đến một người (πρὸς + đối cách) sang địa điểm của người ấy. Dùng “đến với” sát hơn mà vẫn tự nhiên. Việc nêu rõ Phi-e-rơ là người nói giúp phản ánh đúng chủ ngữ được hiểu từ ngữ cảnh và tránh đại từ “Ông” có tiền ngữ kém rõ ràng.'
  naturalness: 'Cần chuẩn hóa chính tả tên riêng theo tiếng Việt hiện đại: “Giê-su” thay vì “Jêsus”. “Ngài đến với Si-môn Phi-e-rơ” và “Phi-e-rơ thưa với Ngài” là văn phong trang trọng, rõ ràng, tự nhiên. “Rửa chân cho con” là cách nói Việt ngữ thông dụng trong lời thưa kính với Chúa và diễn đạt đúng “my feet” trong ngữ cảnh.'
  terminology: Giữ “Chúa” cho κύριε là hợp lý, đồng thời chú thích phải giữ khả năng “thưa ngài” như một lối xưng hô kính trọng. “Chính Ngài” phản ánh được sự nhấn mạnh của σύ mà không thêm nội dung giáo lý.
  issues:
