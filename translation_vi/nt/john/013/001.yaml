  - severity: low
    issue: “Về với Cha” diễn giải hướng chuyển động là trở về.
    rationale: πρὸς τὸν πατέρα nói “đến với Cha”; dù ý trở về phù hợp bối cảnh Giăng, bản văn câu này không cần thêm sắc thái ấy.
