revisions:
- from: Trước lễ Vượt Qua, Đức Chúa Jêsus biết giờ của Ngài đã đến, là lúc Ngài rời thế gian này để về với Cha. Ngài vốn yêu những người thuộc về mình đang ở trong thế gian, nên đã yêu họ cho đến cùng.[a]
  to: Trước lễ Vượt Qua, Đức Chúa Jêsus biết rằng giờ của Ngài đã đến để Ngài rời khỏi thế gian này mà đến với Cha. Ngài đã yêu những người thuộc về mình đang ở trong thế gian, và Ngài yêu họ cho đến cùng.[a]
  rationale: Bản sửa thay “nên” bằng liên kết đơn thuần để không áp đặt quan hệ nhân quả lên phân từ ἀγαπήσας, và thay “về với Cha” bằng “đến với Cha” để bám sát πρὸς τὸν πατέρα. Cụm “cho đến cùng” và chú thích được giữ để bảo tồn cả sắc thái thời gian lẫn mức độ của εἰς τέλος. Dạng “đã yêu ... và yêu” phản ánh tình yêu có trước được phân từ aorist nêu lên và lời khẳng định cao trào tiếp theo, không buộc tiếng Việt phải xác định quá mức thì/thể của động từ Hy Lạp.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T06:24:46Z'
review_pass:
