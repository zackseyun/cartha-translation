  source_fidelity: 'Bản dịch giữ đúng các ý chính: thời điểm trước lễ Vượt Qua, Đức Chúa Jêsus ý thức giờ của Ngài đã đến, sự chuyển khỏi thế gian đến với Cha, đối tượng rộng là “những người thuộc về mình”, và sự mơ hồ của εἰς τέλος. Tuy nhiên, “nên” tạo quan hệ nhân quả không được nêu rõ bởi phân từ ἀγαπήσας; “về với Cha” hơi diễn giải hơn πρὸς τὸν πατέρα, vốn chỉ nói “đến với Cha.”'
