  terminology: “Lễ Vượt Qua”, “giờ của Ngài”, “thế gian”, “Cha”, “những người thuộc về mình”, và “cho đến cùng” đều phù hợp. Cách gọi “Đức Chúa Jêsus” và đại từ “Ngài” được giữ nhất quán theo đăng ký của bản thảo.
