id: JHN.13.1
reference: John 13:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Πρὸ δὲ τῆς ἑορτῆς τοῦ πάσχα εἰδὼς ὁ Ἰησοῦς ὅτι ⸀ἦλθεν αὐτοῦ ἡ ὥρα ἵνα μεταβῇ ἐκ τοῦ κόσμου τούτου πρὸς τὸν πατέρα ἀγαπήσας τοὺς ἰδίους τοὺς ἐν τῷ κόσμῳ εἰς τέλος ἠγάπησεν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/001.yaml
  text: Before the Feast of the Passover[a], Jesus, knowing that his hour had come to depart from this world to the Father, having loved his own who were in the world[b], loved them to the end.
translation:
  language: vi
  text: Trước lễ Vượt Qua, Đức Chúa Jêsus biết rằng giờ của Ngài đã đến để Ngài rời khỏi thế gian này mà đến với Cha. Ngài đã yêu những người thuộc về mình đang ở trong thế gian, và Ngài yêu họ cho đến cùng.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “một cách trọn vẹn” hoặc “đến mức tột cùng.” Cụm từ Hy Lạp có thể vừa nói đến tình yêu bền đỗ cho đến giây phút cuối, vừa nói đến tình yêu trọn vẹn nhất.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πρὸ δὲ τῆς ἑορτῆς τοῦ πάσχα
  choice: Trước lễ Vượt Qua
  rationale: Πρό với sở hữu cách chỉ thời điểm trước một sự kiện; δέ là từ nối nhẹ, không cần dịch thành một từ riêng trong tiếng Việt. “Lễ Vượt Qua” tự nhiên và giữ rõ nghĩa lễ hội.
- source_word: εἰδὼς
  choice: biết
  rationale: Phân từ diễn tả sự nhận biết của Đức Chúa Jêsus vào thời điểm hành động; cách dịch gọn này tự nhiên trong tiếng Việt.
- source_word: ἦλθεν αὐτοῦ ἡ ὥρα
  choice: giờ của Ngài đã đến
  rationale: Giữ hình ảnh “giờ” đặc trưng trong Giăng và ý nghĩa về thời điểm quyết định đã đến.
- source_word: ἵνα μεταβῇ ἐκ τοῦ κόσμου τούτου πρὸς τὸν πατέρα
  choice: là lúc Ngài rời thế gian này để về với Cha
  rationale: ἵνα trong ngữ cảnh giải thích nội dung của “giờ”; “rời… để về với Cha” diễn đạt tự nhiên sự chuyển đi từ thế gian đến cùng Cha mà không thu hẹp thành chỉ sự chết.
- source_word: ἀγαπήσας τοὺς ἰδίους τοὺς ἐν τῷ κόσμῳ
  choice: Ngài vốn yêu những người thuộc về mình đang ở trong thế gian
  rationale: “Vốn yêu” thể hiện tình yêu đã có từ trước; “những người thuộc về mình” giữ phạm vi rộng và tính quan hệ của τοὺς ἰδίους, không giới hạn rõ rệt vào các môn đồ.
- source_word: εἰς τέλος ἠγάπησεν αὐτούς
  choice: đã yêu họ cho đến cùng
  rationale: “Cho đến cùng” giữ được nghĩa thời gian và phần nào sức gợi về mức độ trọn vẹn của εἰς τέλος; chú thích nêu rõ nghĩa thay thế.
theological_decisions:
- issue: Ý nghĩa của εἰς τέλος trong lời khẳng định cao trào về tình yêu của Đức Chúa Jêsus
  choice: cho đến cùng
  alternative: một cách trọn vẹn; đến mức tột cùng
  rationale: Cụm Hy Lạp có thể chỉ tình yêu bền đỗ đến thời điểm cuối cùng, cũng có thể chỉ tình yêu ở mức độ hoàn toàn. Bản văn chính giữ cách nói có độ mở, còn chú thích bảo tồn nghĩa về mức độ.
- issue: Đối tượng của τοὺς ἰδίους
  choice: những người thuộc về mình
  alternative: người của Ngài; các môn đồ của Ngài
  rationale: Ngữ cảnh trước mắt hướng đến các môn đồ, nhưng cụm Hy Lạp rộng hơn; không nên thu hẹp đối tượng bằng cách đưa “môn đồ” vào bản văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Jêsus” và đại từ tôn kính “Ngài”; gọi πατήρ là “Cha” để giữ lối diễn đạt giàu tính quan hệ của sách Giăng. Cấu trúc được điều chỉnh theo cú pháp tiếng Việt nhưng vẫn giữ các mệnh đề và sự mơ hồ quan trọng của nguyên văn.
