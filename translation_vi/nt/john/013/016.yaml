  text: ἀμὴν ἀμὴν λέγω ὑμῖν, οὐκ ἔστιν δοῦλος μείζων τοῦ κυρίου αὐτοῦ οὐδὲ ἀπόστολος μείζων τοῦ πέμψαντος αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/016.yaml
  text: Truly[a], truly, I say to you, a servant is not greater than his master[c][b], nor is an apostle greater than the one who sent him.
translation:
  language: vi
  text: 'Quả thật, quả thật, tôi nói với anh em: nô lệ không lớn hơn chủ mình, và sứ đồ cũng không lớn hơn người đã sai mình.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hoặc “sứ giả”; từ Hy Lạp có thể chỉ người được sai phái.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  choice: Thật, thật
  rationale: Giữ nguyên sự lặp lại cùng sắc thái trang trọng, nhấn mạnh của công thức đặc trưng trong Giăng, đồng thời vẫn dễ hiểu trong tiếng Việt hiện đại.
- source_word: λέγω ὑμῖν
  choice: tôi nói với anh em
  rationale: Chuyển đạt trực tiếp công thức phát ngôn ở thì hiện tại; “anh em” là cách xưng hô tự nhiên với nhóm môn đồ trong văn cảnh.
- source_word: δοῦλος
  choice: nô lệ
  rationale: Quan hệ lệ thuộc dưới quyền một người chủ đang nổi bật trong phép so sánh; “nô lệ” giữ được sức nặng xã hội của từ Hy Lạp hơn “đầy tớ” hay “người phục vụ”.
- source_word: μείζων
  choice: lớn hơn
  rationale: Giữ phạm vi nghĩa rộng về địa vị hoặc cấp bậc mà không thu hẹp thành “quan trọng hơn”.
- source_word: κύριος
  choice: chủ
  rationale: Trong cặp nô lệ–chủ, từ này mang nghĩa xã hội chứ không nhất thiết là tước hiệu thần học “Chúa”.
- source_word: ἀπόστολος
  choice: sứ giả
  rationale: Trong câu này, từ chỉ người được phái đi và được giải thích ngay bằng vế “người đã sai mình”; “sứ giả” truyền đạt chức năng ấy rõ ràng hơn từ chuyên biệt “sứ đồ”.
- source_word: τοῦ πέμψαντος αὐτόν
  choice: người đã sai mình
  rationale: Diễn đạt tự nhiên cấu trúc phân từ có mạo từ, đồng thời “mình” quy chiếu về chủ thể của vế là sứ giả.
theological_decisions:
- issue: Cách dịch κύριος trong phép so sánh không nhất thiết mang tính tước hiệu
  choice: chủ
  alternative: Chúa
  rationale: Văn cảnh đặt δοῦλος song song với κύριος như một quan hệ xã hội. “Chủ” giữ đúng phép so sánh và tránh tự ý biến từ này thành một tước hiệu trực tiếp.
- issue: Cách dịch ἀπόστολος theo chức năng hay thuật ngữ chức vụ
  choice: sứ giả
  alternative: sứ đồ
  rationale: Nghĩa căn bản trong cấu trúc song song là người được sai đi so với người sai phái. Bản dịch chính giữ nghĩa chức năng, còn chú thích bảo lưu cách dịch truyền thống có thể gợi đến chức vụ.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại. Giữ sự lặp “Thật, thật” để phản ánh công thức nhấn mạnh của nguyên văn; dùng “nô lệ–chủ” để bảo toàn quan hệ thứ bậc mạnh và “sứ giả” để làm rõ sự song song với hành động sai phái.
