revisions:
- from: 'Thật, thật, tôi nói với anh em: nô lệ không lớn hơn chủ mình, sứ giả cũng không lớn hơn người đã sai mình.[a]'
  to: 'Quả thật, quả thật, tôi nói với anh em: nô lệ không lớn hơn chủ mình, và sứ đồ cũng không lớn hơn người đã sai mình.[a]'
  rationale: Sửa công thức mở đầu cho tự nhiên hơn trong tiếng Việt hiện đại và dùng “sứ đồ” làm bản dịch chính của ἀπόστολος nhằm giữ độ tương ứng từ vựng với nguyên văn. Chú thích vẫn bảo lưu nghĩa chức năng “sứ giả”. “Nô lệ”, “chủ”, “lớn hơn” và cách quy chiếu “mình” được giữ vì phản ánh đúng quan hệ và tính song song của câu Hy Lạp.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T06:24:51Z'
review_pass:
  verdict: revise
  source_fidelity: Bản nháp giữ đúng cấu trúc song song và các quan hệ chủ–tớ/người được sai–người sai của nguyên văn. Tuy nhiên, ἀπόστολος nên được dịch chính là “sứ đồ” để bảo toàn từ vựng và thuật ngữ của bản văn; nghĩa chức năng “sứ giả” nên để ở chú thích.
  naturalness: “Thật, thật” có thể hiểu được nhưng hơi cụt trong tiếng Việt hiện đại. “Quả thật, quả thật” là công thức trang trọng, tự nhiên hơn cho lời khẳng định đôi ἀμὴν ἀμὴν. Các phần còn lại rõ ràng và tự nhiên.
  terminology: “Nô lệ–chủ” phản ánh đúng sắc thái xã hội của δοῦλος–κύριος trong câu này. “Sứ đồ” là đối ứng trực tiếp, ổn định của ἀπόστολος; chú thích có thể nêu “sứ giả” như lựa chọn theo chức năng trong ngữ cảnh.
  issues:
  - severity: medium
    issue: Dịch ἀπόστολος là “sứ giả” trong bản văn chính.
    rationale: Dù “sứ giả” diễn đạt chức năng được sai đi, “sứ đồ” là từ tương ứng trực tiếp với ἀπόστολος và giữ được liên kết thuật ngữ của câu. Không có lý do ngữ cảnh đủ mạnh để thay thuật ngữ chính bằng một cách diễn nghĩa; nghĩa “sứ giả” thích hợp hơn ở chú thích.
  - severity: low
    issue: Công thức “Thật, thật” chưa thật tự nhiên trong văn phong Kinh Thánh tiếng Việt hiện đại.
    rationale: “Quả thật, quả thật” truyền đạt sự lặp lại và tính trang trọng của ἀμὴν ἀμὴν rõ, tự nhiên hơn.
