id: JHN.13.32
reference: John 13:32
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸂εἰ ὁ θεὸς ἐδοξάσθη ἐν αὐτῷ,⸃ καὶ ὁ θεὸς δοξάσει αὐτὸν ἐν ⸀αὑτῷ, καὶ εὐθὺς δοξάσει αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/032.yaml
  text: If God was glorified in him[a], God will also glorify him in himself[b], and will glorify him at once.
translation:
  language: vi
  text: Nếu Đức Chúa Trời đã được tôn vinh trong Người[a], thì Đức Chúa Trời cũng sẽ tôn vinh Người trong chính Ngài[b], và Ngài sẽ tôn vinh Người ngay lập tức.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Vì Đức Chúa Trời đã được tôn vinh trong Người.” Tiếng Hy Lạp dùng εἰ (“nếu”), nhưng trong văn cảnh, điều kiện này có lẽ được giả định là đúng.'
    reason: alternative_reading
  - marker: b
    text: Cụm “trong chính Ngài” cũng có thể được hiểu là “với chính Ngài” hoặc “bởi chính Ngài”; cách diễn đạt Hy Lạp cô đọng và hàm chứa nhiều ý nghĩa thần học.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ
  choice: Nếu
  rationale: Giữ nghĩa điều kiện trực tiếp của tiểu từ Hy Lạp, đồng thời để văn cảnh cho thấy điều kiện này được xem là có thật; cách hiểu “Vì” được nêu ở chú thích.
- source_word: ἐδοξάσθη
  choice: đã được tôn vinh
  rationale: Giữ thể bị động của động từ aorist và diễn đạt tự nhiên trong tiếng Việt, chỉ sự việc được trình bày như đã xảy ra.
- source_word: ἐν αὐτῷ
  choice: nơi Người
  rationale: Giữ sát giới từ ἐν và lối diễn đạt cô đọng của Gioan, thay vì giải thích thành “qua Người”.
- source_word: δοξάσει
  choice: sẽ tôn vinh
  rationale: Giữ thì tương lai và sự lặp lại từ vựng của δοξάζω trong cả câu.
- source_word: ἐν αὑτῷ
  choice: nơi chính Ngài
  rationale: Đại từ phản thân quy chiếu về Đức Chúa Trời; “nơi chính Ngài” bảo toàn cấu trúc Hy Lạp và không quyết định thay cho độc giả sắc thái “với” hay “bởi”.
- source_word: εὐθύς
  choice: ngay lập tức
  rationale: Diễn đạt rõ tính tức thời của trạng từ εὐθύς bằng tiếng Việt hiện đại.
theological_decisions:
- issue: Lực điều kiện của εἰ khi văn cảnh dường như xem sự việc là có thật
  choice: Giữ “Nếu Đức Chúa Trời đã được tôn vinh nơi Người” trong chính văn
  alternative: “Vì Đức Chúa Trời đã được tôn vinh nơi Người”
  rationale: Bản Hy Lạp dùng εἰ (“nếu”), không dùng một liên từ nguyên nhân minh nhiên. Giữ “Nếu” bảo toàn hình thức và sức căng của câu; chú thích cho biết khả năng điều kiện được giả định là đúng.
- issue: Ý nghĩa của ἐν αὑτῷ trong hành động Đức Chúa Trời tôn vinh Người
  choice: “nơi chính Ngài”
  alternative: “với chính Ngài” hoặc “bởi chính Ngài”
  rationale: Cụm Hy Lạp cô đọng và có thể mang nhiều sắc thái. Bản dịch chính giữ cách nói gần nguyên văn thay vì ấn định một cách giải nghĩa thần học duy nhất.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “Đức Chúa Trời” cho ὁ θεός; viết hoa “Người” để chỉ Đức Chúa Jêsus và “Ngài” để chỉ Đức Chúa Trời, giúp làm rõ quy chiếu đại từ mà không diễn giải thêm nội dung.
