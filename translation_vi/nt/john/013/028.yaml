source:
  edition: SBLGNT
  text: τοῦτο δὲ οὐδεὶς ἔγνω τῶν ἀνακειμένων πρὸς τί εἶπεν αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/john/013/028.yaml
  text: But none of those reclining at the table knew why he said this to him[a].
translation:
  language: vi
  text: Nhưng không ai trong số những người đang ngả mình dùng bữa biết Ngài nói điều ấy với ông nhằm mục đích gì.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “vì sao Ngài nói điều ấy với ông.”'
    reason: πρὸς τί hỏi về lý do hoặc mục đích; “nhằm mục đích gì” làm rõ sắc thái mục đích, còn “vì sao” là cách diễn đạt tự nhiên hơn trong tiếng Việt.
lexical_decisions:
- source_word: τοῦτο
  choice: điều ấy
  rationale: Đại từ chỉ định quy chiếu về lời Đức Chúa Jêsus vừa nói; “điều ấy” giữ được lực chỉ định và tự nhiên trong tiếng Việt.
- source_word: δὲ
  choice: Nhưng
  rationale: 'δέ đánh dấu sự tương phản nhẹ với câu trước: dù Đức Chúa Jêsus đã nói với Giu-đa, những người khác vẫn không hiểu.'
- source_word: οὐδεὶς
  choice: không ai
  rationale: Diễn đạt trực tiếp ý phủ định toàn thể của οὐδείς.
- source_word: ἔγνω
  choice: hiểu
  rationale: Trong ngữ cảnh này, γινώσκω nói đến việc nắm được ý nghĩa hay mục đích của lời nói; “hiểu” tự nhiên và chính xác hơn “biết” trong tiếng Việt.
- source_word: τῶν ἀνακειμένων
  choice: trong số những người đang dùng bữa tại bàn
  rationale: ἀνάκειμαι mô tả tư thế ngả mình khi dự bữa theo phong tục thời đó. Bản dịch nêu rõ khung cảnh bữa ăn bằng cách diễn đạt tự nhiên, không khiến độc giả hiện đại tưởng họ chỉ đang nằm nghỉ.
- source_word: πρὸς τί
  choice: vì mục đích gì
  rationale: Cụm này hỏi về mục đích hoặc ý hướng. Cách dịch giữ sắc thái mục đích rõ hơn từ hỏi chung “tại sao”.
- source_word: εἶπεν αὐτῷ
  choice: Ngài nói điều ấy với ông
  rationale: Động từ và đại từ gián tiếp được chuyển dịch trực tiếp. “Ngài” và “ông” làm rõ hai nhân vật theo ngữ cảnh mà không đưa tên riêng vào câu.
theological_decisions:
- issue: Chủ thể và người nhận của εἶπεν αὐτῷ không được nêu tên trong chính câu Hy Lạp
  choice: Dùng “Ngài” cho Đức Chúa Jêsus và “ông” cho Giu-đa
  alternative: Dùng “người nói điều ấy với ông” hoặc lặp lại tên riêng
  rationale: Ngữ cảnh ngay trước xác định rõ các đại từ; cách dùng đại từ tiếng Việt giúp câu tự nhiên mà không thêm tên không có trong câu nguồn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Dùng bữa tại bàn” truyền đạt khung cảnh của ἀνακειμένων bằng tiếng Việt tự nhiên; cách xưng hô “Ngài… ông” giữ sự tôn kính đối với Đức Chúa Jêsus và phân biệt Giu-đa.
