id: JHN.13.33
reference: John 13:33
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τεκνία, ἔτι μικρὸν μεθ’ ὑμῶν εἰμι· ζητήσετέ με, καὶ καθὼς εἶπον τοῖς Ἰουδαίοις ὅτι Ὅπου ⸂ἐγὼ ὑπάγω⸃ ὑμεῖς οὐ δύνασθε ἐλθεῖν, καὶ ὑμῖν λέγω ἄρτι.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/033.yaml
  text: Little children[a], I am with you a little while longer. You will seek me, and just as I said to the Jews, ‘Where I am going[b], you are not able to come,’ so now I also say to you.
translation:
  language: vi
  text: 'Các con thân yêu, ta chỉ còn ở với các con một ít lâu nữa. Các con sẽ tìm ta. Như ta đã nói với người Do Thái[a] rằng: “Nơi ta đi, các ngươi không thể đến được[b],” thì bây giờ ta cũng nói với các con như vậy.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Trong sách Giăng, tùy ngữ cảnh, “người Do Thái” đôi khi có thể chỉ cụ thể hơn đến các nhà chức trách Do Thái tại Giu-đê.
    reason: alternative_reading
  - marker: b
    text: 'Cũng có thể dịch gọn: “các ngươi không thể đến.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: τεκνία
  choice: Các con thân yêu
  rationale: Danh từ hô cách số nhiều có sắc thái nhỏ bé và trìu mến. “Các con thân yêu” giữ được hình ảnh quan hệ cha-con và tình cảm âu yếm trong tiếng Việt tự nhiên; cách sát chữ “các con bé nhỏ” dễ khiến người đọc hiểu là trẻ nhỏ theo nghĩa tuổi tác.
- source_word: ἔτι μικρόν
  choice: chỉ còn ... một ít lâu nữa
  rationale: Cụm này chỉ quãng thời gian ngắn còn lại. Cách diễn đạt này tự nhiên trong tiếng Việt và giữ cả ý “còn” lẫn tính ngắn ngủi.
- source_word: μεθ’ ὑμῶν εἰμι
  choice: ở với các con
  rationale: Diễn đạt trực tiếp sự hiện diện của Đức Giê-su với các môn đồ, không thêm ý “ở lại” vốn không được nêu rõ trong động từ εἰμι.
- source_word: ζητήσετέ με
  choice: Các con sẽ tìm ta
  rationale: Thì tương lai của ζητέω có nghĩa là tìm hoặc tìm kiếm. “Tìm” tự nhiên trong ngữ cảnh tìm một người và không làm nặng thêm sắc thái tâm linh mà câu này chưa tự xác định.
- source_word: τοῖς Ἰουδαίοις
  choice: người Do Thái
  rationale: Giữ nghĩa trực tiếp của danh từ Hy Lạp và không tự ý thu hẹp đối tượng thành giới lãnh đạo; khả năng chỉ một nhóm cụ thể được ghi ở chú thích.
- source_word: Ὅπου ἐγὼ ὑπάγω
  choice: Nơi ta đi
  rationale: ὑπάγω ở đây nói đến việc ra đi. “Nơi ta đi” gọn, tự nhiên và giữ nguyên việc câu không nói rõ đích đến.
- source_word: οὐ δύνασθε ἐλθεῖν
  choice: các ngươi không thể đến được
  rationale: Giữ rõ nghĩa về khả năng của δύνασθε. Đại từ “các ngươi” phân biệt những người được nhắc trong lời trích với “các con” là các môn đồ đang được trực tiếp nói với.
- source_word: καὶ ὑμῖν λέγω ἄρτι
  choice: thì bây giờ ta cũng nói với các con như vậy
  rationale: Thể hiện mối liên hệ so sánh với lời đã nói trước đó và việc lời ấy nay cũng được áp dụng cho các môn đồ. “Như vậy” làm rõ đối tượng của động từ “nói” mà không thêm nội dung mới.
theological_decisions:
- issue: Phạm vi chỉ định của τοῖς Ἰουδαίοις trong sách Giăng
  choice: người Do Thái
  alternative: các nhà lãnh đạo Do Thái
  rationale: Nguyên văn không trực tiếp giới hạn đối tượng vào giới lãnh đạo. Vì cách dùng trong sách Giăng có thể tùy ngữ cảnh mà chỉ một nhóm người Do Thái cụ thể, bản dịch giữ cách gọi rộng trong chính văn và nêu khả năng hẹp hơn ở chú thích.
- issue: Bản chất của việc các môn đồ không thể đi theo Đức Giê-su
  choice: không thể đến được
  alternative: không được đến
  rationale: Câu Hy Lạp nói về sự không có khả năng, nhưng không giải thích tại đây đó là bất khả tạm thời, sự ngăn cấm hay một giới hạn thuộc linh. Bản dịch không tự giải quyết sự căng thẳng này.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cặp đại từ “ta—các con” phù hợp với cách gọi trìu mến τεκνία mà không thay “ta” bằng “Thầy,” vốn không có trong nguyên văn. Dấu ngoặc kép đánh dấu lời Đức Giê-su trích lại; mọi dấu chú thích đều xuất hiện đúng vị trí trong chính văn.
