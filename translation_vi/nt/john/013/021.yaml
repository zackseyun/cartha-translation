source:
  edition: SBLGNT
  text: Ταῦτα εἰπὼν ⸀ὁ Ἰησοῦς ἐταράχθη τῷ πνεύματι καὶ ἐμαρτύρησεν καὶ εἶπεν· Ἀμὴν ἀμὴν λέγω ὑμῖν ὅτι εἷς ἐξ ὑμῶν παραδώσει με.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/021.yaml
  text: After saying these things[a], Jesus was troubled in spirit, and testified and said, “Truly, truly, I say to you, one of you will betray me.”
translation:
  language: vi
  text: 'Sau khi nói những điều này, Giê-su xao động trong tâm thần; Ngài làm chứng và nói: “Thật, thật, Ta nói với anh em: một người trong anh em sẽ phản bội[a] Ta.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay, sát nghĩa hơn: “sẽ trao nộp Ta.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταῦτα εἰπὼν
  choice: Sau khi nói những điều ấy
  rationale: Diễn đạt phân từ bất định như một mệnh đề thời gian tự nhiên trong tiếng Việt, giữ rõ trình tự của sự việc.
- source_word: ἐταράχθη τῷ πνεύματι
  choice: bối rối trong tâm thần
  rationale: Giữ sắc thái xao động, đau buồn sâu bên trong mà không tự ý thêm mức độ; τῷ πνεύματι được hiểu là phạm vi hay phương diện.
- source_word: ἐμαρτύρησεν καὶ εἶπεν
  choice: rồi làm chứng rằng
  rationale: Giữ động từ mang tính trang trọng và chủ đề làm chứng đặc trưng trong Giăng; trong tiếng Việt, “rằng” giúp nối tự nhiên với lời trực tiếp mà không cần lặp “và nói” cứng nhắc.
- source_word: Ἀμὴν ἀμὴν
  choice: Thật, thật
  rationale: Bảo toàn sự lặp lại và tính trang trọng của công thức nhấn mạnh đặc trưng trong sách Giăng.
- source_word: λέγω ὑμῖν
  choice: Ta nói với các con
  rationale: Giữ tính trực tiếp và trang trọng; cách xưng hô phù hợp với lời Đức Chúa Jêsus nói cùng các môn đồ trong văn cảnh.
- source_word: εἷς ἐξ ὑμῶν
  choice: một người trong các con
  rationale: Diễn đạt tự nhiên cấu trúc bộ phận, đồng thời giữ sức nặng của việc người ấy thuộc chính nhóm môn đồ.
- source_word: παραδώσει με
  choice: sẽ phản bội Ta
  rationale: Trong văn cảnh, động từ chỉ hành vi phản trắc dẫn đến việc Đức Chúa Jêsus bị trao nộp; nghĩa sát chữ “trao nộp” được giữ trong chú thích.
theological_decisions:
- issue: Sự xao động nội tâm của Đức Chúa Jêsus
  choice: bối rối trong tâm thần
  alternative: bối rối trong tâm thần mình; đau đớn trong tâm thần
  rationale: Cách dịch để nguyên tính chân thực của sự xao động nơi Đức Chúa Jêsus, không giảm nhẹ cũng không thêm lời giải thích thần học ngoài câu.
- issue: Nghĩa của παραδίδωμι trong lời báo trước
  choice: sẽ phản bội Ta
  alternative: sẽ trao nộp Ta
  rationale: “Phản bội” truyền đạt rõ tính phản trắc trong văn cảnh, còn chú thích bảo tồn nghĩa cụ thể và sát chữ hơn là “trao nộp”.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ công thức lặp “Thật, thật” cùng thuật ngữ “làm chứng” để phản ánh sắc thái đặc trưng của Giăng; không thêm cường độ cảm xúc không có trong nguyên văn.
