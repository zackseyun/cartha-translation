revisions:
- from: 'Sau khi nói những điều ấy, Đức Chúa Jêsus bối rối trong tâm thần, rồi làm chứng rằng: “Thật, thật, Ta nói với các con, một người trong các con sẽ phản bội[a] Ta.”'
  to: 'Sau khi nói những điều này, Giê-su xao động trong tâm thần; Ngài làm chứng và nói: “Thật, thật, Ta nói với anh em: một người trong anh em sẽ phản bội[a] Ta.”'
  rationale: Bản sửa bảo toàn trình tự của phân từ Ταῦτα εἰπὼν, diễn đạt ἐταράχθη τῷ πνεύματι bằng từ ngữ Việt gần nghĩa hơn, và thể hiện riêng cả “làm chứng” lẫn “nói”. Tên riêng, xưng hô, và đại từ được điều chỉnh theo văn phong hiện đại trang trọng, trung tính; không thay đổi nội dung hay tăng mức độ cảm xúc.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T06:24:58Z'
review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng trình tự, lời dự báo về người phản bội, và có chú thích thích hợp cho παραδώσει. Tuy nhiên, “rồi làm chứng rằng” đã gộp ἐμαρτύρησεν καὶ εἶπεν thành một động từ kèm liên từ, không biểu đạt rõ cả hai hành động “làm chứng” và “nói”. “Bối rối” cũng thường chỉ sự lúng túng/hoang mang, chưa phản ánh tốt sự xao động nội tâm của ἐταράχθη.
  naturalness: Câu cần tách hoặc dùng dấu chấm phẩy trước lời công bố để tiếng Việt sáng rõ. “Xao động trong tâm thần” là cách nói trang trọng, dễ hiểu và gần nghĩa hơn trong ngữ cảnh này. Cách gọi “Đức Chúa Jêsus” và lối xưng hô “các con” mang dấu ấn truyền thống/nhóm phái; “Giê-su” và “anh em” phù hợp hơn với tiếng Việt hiện đại trung tính, đồng thời không thêm tước hiệu vào tên riêng Hy Lạp.
  terminology: Giữ “làm chứng” cho μαρτυρέω và “Thật, thật” cho Ἀμὴν ἀμὴν. Dịch chính “phản bội” là phù hợp ngữ cảnh; chú thích cần nêu rõ phương án sát nghĩa hơn là “trao nộp tôi”.
  issues:
  - severity: medium
    issue: Chưa biểu đạt đầy đủ hai động từ ἐμαρτύρησεν καὶ εἶπεν
    rationale: “Rồi làm chứng rằng” chỉ nêu “làm chứng” rồi dẫn lời, trong khi nguyên văn thuật rõ rằng Giê-su “làm chứng và nói”.
  - severity: medium
    issue: “Bối rối” chưa đủ chính xác cho ἐταράχθη
    rationale: Từ này trong tiếng Việt hiện đại thường nghiêng về lúng túng hoặc hoang mang; ngữ cảnh nói đến sự xao động/trăn trở sâu bên trong.
  - severity: low
    issue: Tên gọi và xưng hô có sắc thái giáo phái, đồng thời thêm tước hiệu không có trong câu nguồn
    rationale: “Đức Chúa Jêsus” và “các con” là lối dùng quen thuộc trong một số truyền thống. Bản dịch trung tính hiện đại nên dùng tên “Giê-su”; “anh em” phản ánh ngôi thứ hai số nhiều mà không thêm quan hệ cha-con.
