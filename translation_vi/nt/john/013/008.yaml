reference: John 13:8
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: λέγει αὐτῷ Πέτρος· Οὐ μὴ νίψῃς ⸂μου τοὺς πόδας⸃ εἰς τὸν αἰῶνα. ἀπεκρίθη ⸂Ἰησοῦς αὐτῷ⸃· Ἐὰν μὴ νίψω σε, οὐκ ἔχεις μέρος μετ’ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/008.yaml
  text: Peter said to him[a], “You will never wash my feet.” Jesus answered him, “If I do not wash you, you have no share with me.”
translation:
  language: vi
  text: 'Phi-e-rơ thưa với Ngài: “Thầy sẽ không bao giờ rửa chân cho con!” Đức Giê-su đáp: “Nếu Thầy không rửa con, con không có phần[a] với Thầy.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “con không có phần chung với Thầy.”'
    reason: μέρος có thể chỉ “phần” hay sự tham phần/chung phần; cách dịch này giữ nghĩa tham dự mà không chuyển mệnh đề thành ý không được phép hoặc áp đặt một diễn giải giáo lý cụ thể.
lexical_decisions:
- source_word: Οὐ μὴ νίψῃς ... εἰς τὸν αἰῶνα
  choice: Thầy sẽ không bao giờ rửa
  rationale: Cụm phủ định nhấn mạnh οὐ μή cùng thành ngữ εἰς τὸν αἰῶνα diễn tả lời khước từ quyết liệt về tương lai. “Sẽ không bao giờ” truyền đạt tự nhiên cả sức phủ định lẫn ý thời gian trong tiếng Việt hiện đại.
- source_word: μου τοὺς πόδας
  choice: chân cho con
  rationale: Nguyên văn là “chân của tôi”. Trong tiếng Việt, với động từ “rửa”, cấu trúc “rửa chân cho con” tự nhiên hơn “rửa chân của con” mà vẫn giữ đúng đối tượng và quan hệ sở hữu.
- source_word: ἀπεκρίθη Ἰησοῦς αὐτῷ
  choice: Đức Giê-su đáp
  rationale: “Đáp” là động từ trần thuật gọn, trang trọng và tương ứng trực tiếp với hành động trả lời; đại từ gián tiếp được lược vì ngữ cảnh tiếng Việt đã rõ.
- source_word: Ἐὰν μὴ νίψω σε
  choice: Nếu Thầy không rửa con
  rationale: Giữ nguyên cấu trúc điều kiện phủ định và đối tượng “con”. Không thêm “chân” ở đây, vì nguyên văn chuyển từ việc rửa chân cụ thể sang cách nói rộng hơn là “rửa con”.
- source_word: οὐκ ἔχεις μέρος
  choice: con không có phần
  rationale: μέρος có thể chỉ phần, phần được hưởng hoặc sự dự phần. “Không có phần” giữ được hình ảnh và độ rộng nghĩa, không ấn định cơ chế thần học cụ thể.
- source_word: μετ’ ἐμοῦ
  choice: với Thầy
  rationale: μετά với sở hữu cách diễn tả sự liên kết hay đồng hành “với”, không phải “trong”. Cách xưng hô Thầy–con tự nhiên trong quan hệ giữa Đức Giê-su và môn đồ.
theological_decisions:
- issue: Ý nghĩa của việc có μέρος với Đức Giê-su
  choice: Dịch “có phần với Thầy”, để ngỏ ý nghĩa về sự dự phần, liên hệ hoặc thuộc về Đức Giê-su.
  alternative: Diễn giải cụ thể là được cứu, được thanh tẩy theo bí tích, hoặc tham gia việc phục vụ khiêm nhường.
  rationale: Câu Hy Lạp khẳng định việc Đức Giê-su rửa Phi-e-rơ là điều kiện để ông có μέρος với Ngài, nhưng không tự giải thích chính xác cơ chế thần học. Bản dịch vì thế giữ cách nói rộng và sức căng của nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Thưa” phù hợp với lời của môn đồ nói với Thầy; dấu chấm than truyền đạt sự khước từ mạnh. Danh xưng “Đức Giê-su” dùng trong lời trần thuật, còn cặp xưng hô “Thầy–con” được dùng trong đối thoại.
