  verdict: revise
  source_fidelity: Bản dịch truyền đạt đúng lời khước từ quyết liệt của Phi-e-rơ, đối tượng cụ thể là chân ông, và điều kiện Đức Giê-su nêu ra. Câu sau giữ đúng sự chuyển từ “rửa chân” sang “rửa con”, cũng như độ mở của μέρος (“phần/share”) với Thầy.
  naturalness: Lối xưng hô Thầy–con phù hợp ngữ cảnh môn đồ thưa với Đức Giê-su và văn phong hiện đại, trang trọng. Tuy nhiên, chú thích hiện có dùng “không được dự phần”, có thể bị hiểu là sự không được phép, trong khi οὐκ ἔχεις μέρος diễn tả tình trạng “không có phần”.
  terminology: “Đức Giê-su,” “Thầy,” và “có phần với” nhất quán, tự nhiên và không áp đặt cách giải thích giáo lý cho μέρος. Tên “Phi-e-rơ” phù hợp quy ước phiên âm đang dùng.
  issues:
  - severity: medium
    issue: Chú thích a dùng “không được dự phần với Thầy.”
    rationale: Cách nói “không được” trong tiếng Việt thường gợi ý sự cấm đoán hay không được cho phép. Nguyên văn οὐκ ἔχεις μέρος μετ’ ἐμοῦ nói rằng Phi-e-rơ không có phần/share với Đức Giê-su. Chú thích nên bảo toàn sắc thái sở hữu/tham phần này.
