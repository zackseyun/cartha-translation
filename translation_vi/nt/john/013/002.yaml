id: JHN.13.2
reference: John 13:2
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ δείπνου ⸀γινομένου, τοῦ διαβόλου ἤδη βεβληκότος εἰς τὴν καρδίαν ⸂ἵνα παραδοῖ αὐτὸν Ἰούδας Σίμωνος ⸀Ἰσκαριώτου⸃,
base_translation:
  language: en
  yaml_path: translation/nt/john/013/002.yaml
  text: And during supper[a], when the devil had already put it into the heart of Judas Iscariot, Simon's son, to betray him[c][b],
translation:
  language: vi
  text: Và trong bữa ăn tối[a], ma quỷ đã gieo vào lòng[b] Giu-đa, con của Si-môn Ích-ca-ri-ốt, ý định phản bội Ngài[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “khi bữa ăn tối đang diễn ra.” Tiếng Hy Lạp không có nghĩa là bữa ăn đã kết thúc.'
    reason: lexical_alternative
  - marker: b
    text: 'Dịch sát: “đã đặt vào lòng.” Cũng có thể diễn đạt: “đã xui khiến.”'
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “nộp Ngài.” Trong văn cảnh này, “phản bội” diễn đạt rõ sắc thái của hành động ấy.'
    reason: alternative_reading
lexical_decisions:
- source_word: δείπνου γινομένου
  choice: trong bữa ăn tối
  rationale: 'Cụm sở hữu cách tuyệt đối diễn tả hoàn cảnh đồng thời: sự việc xảy ra khi bữa ăn tối đang diễn ra, chứ không phải sau khi bữa ăn đã kết thúc.'
- source_word: διάβολος
  choice: ma quỷ
  rationale: Trong mạch kể của Giăng, từ này chỉ đích danh nhân vật ác thuộc linh, nên dùng danh xưng thông dụng “ma quỷ” thay vì dịch theo nghĩa từ nguyên là “kẻ vu khống”.
- source_word: ἤδη βεβληκότος εἰς τὴν καρδίαν
  choice: đã gieo vào lòng
  rationale: Cách nói này chỉ việc đặt hoặc gieo một ý định vào nội tâm. “Gieo vào lòng” vừa tự nhiên trong tiếng Việt vừa giữ được hình ảnh của nguyên văn; “đã” chuyển tải hành động đã xảy ra trước thời điểm đang kể.
- source_word: καρδίαν
  choice: lòng
  rationale: “Lòng” là cách nói tự nhiên trong tiếng Việt cho trung tâm của ý chí và ý định, đồng thời bảo toàn hình ảnh nhân học của nguyên văn.
- source_word: ἵνα παραδοῖ
  choice: ý định phản bội
  rationale: Trong bối cảnh Giu-đa, παραδίδωμι mang sắc thái phản bội qua hành động nộp Đức Chúa Jêsus cho đối phương. Cấu trúc “gieo vào lòng… ý định” diễn đạt tự nhiên quan hệ mục đích trong tiếng Việt.
- source_word: αὐτόν
  choice: Ngài
  rationale: Đại từ chỉ Đức Chúa Jêsus; “Ngài” giúp người đọc nhận rõ đối tượng mà không cần thêm danh xưng không có trong câu Hy Lạp.
- source_word: Ἰούδας Σίμωνος Ἰσκαριώτου
  choice: Giu-đa, con của Si-môn Ích-ca-ri-ốt
  rationale: Σίμωνος và Ἰσκαριώτου đều ở sở hữu cách; cách dịch này theo sát hình thức của bản văn nguồn và xác định Giu-đa qua quan hệ với cha mình.
theological_decisions:
- issue: Vai trò của ma quỷ và trách nhiệm của Giu-đa trong sự phản bội
  choice: Nói ma quỷ đã gieo ý định vào lòng Giu-đa, trong khi Giu-đa vẫn là người thực hiện việc phản bội.
  alternative: Ma quỷ đã thúc giục Giu-đa; hoặc ma quỷ hành động qua Giu-đa như tác nhân duy nhất.
  rationale: Nguyên văn quy hành động gây ảnh hưởng cho ma quỷ nhưng vẫn trình bày Giu-đa là chủ thể sẽ phản bội Đức Chúa Jêsus. Bản dịch giữ nguyên sự căng thẳng này, không giải quyết theo hướng tiền định tuyệt đối hay loại bỏ trách nhiệm của Giu-đa.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Bữa ăn tối” làm rõ δείπνον mà không gợi rằng bữa ăn đã xong. “Gieo vào lòng” giữ hình ảnh nguyên ngữ nhưng vẫn tự nhiên trong tiếng Việt. Câu kết thúc bằng dấu phẩy vì câu 2 là mệnh đề hoàn cảnh tiếp nối sang các câu sau.
