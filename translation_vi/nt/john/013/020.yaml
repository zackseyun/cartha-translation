reference: John 13:20
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀμὴν ἀμὴν λέγω ὑμῖν, ὁ λαμβάνων ⸀ἄν τινα πέμψω ἐμὲ λαμβάνει, ὁ δὲ ἐμὲ λαμβάνων λαμβάνει τὸν πέμψαντά με.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/020.yaml
  text: Truly[a], truly, I say to you, whoever receives anyone I send receives me[b], and whoever receives me receives the one who sent me.
translation:
  language: vi
  text: '“Quả thật, quả thật, Ta nói với các con: Ai tiếp nhận bất cứ ai Ta sai đi[a] là tiếp nhận Ta; còn ai tiếp nhận Ta là tiếp nhận Đấng đã sai Ta[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “Ai tiếp nhận người nào Ta sai đi thì tiếp nhận Ta.”'
    reason: lexical_alternative
  - marker: b
    text: Trong ngữ cảnh sách Giăng, “Đấng đã sai Ta” chỉ về Đức Chúa Cha.
    reason: cross_reference
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  choice: Thật, thật
  rationale: Giữ nguyên sự lặp lại đầy nhấn mạnh trong công thức long trọng đặc trưng của lời Đức Chúa Giê-su, đồng thời dùng từ ngữ dễ hiểu trong tiếng Việt hiện đại.
- source_word: λέγω ὑμῖν
  choice: Ta nói với các con
  rationale: Dịch trực tiếp động từ λέγω và đại từ số nhiều ὑμῖν. Cách xưng hô này phù hợp với lời Đức Chúa Giê-su nói cùng các môn đồ trong ngữ cảnh, tự nhiên và trang trọng mà không dùng lối nói cổ.
- source_word: ὁ λαμβάνων
  choice: Ai tiếp nhận
  rationale: Phân từ có mạo từ mang ý nghĩa khái quát. “Ai” diễn đạt tự nhiên, bao gồm mọi người và không tạo hàm ý chỉ giới nam.
- source_word: ἄν τινα πέμψω
  choice: bất cứ người nào Ta sai đi
  rationale: ἄν, đại từ bất định τινα và động từ giả định πέμψω tạo ý nghĩa không xác định, mở rộng cho bất cứ người nào Đức Chúa Giê-su có thể sai đi.
- source_word: λαμβάνει
  choice: tiếp nhận
  rationale: “Tiếp nhận” bao hàm việc đón nhận và chấp nhận một người, đồng thời cho phép giữ nguyên sự lặp lại quan trọng của λαμβάνει trong chuỗi đại diện của câu.
- source_word: ὁ δὲ ἐμὲ λαμβάνων
  choice: còn ai tiếp nhận Ta
  rationale: δέ ở đây nối tiếp và phân biệt vế kế tiếp chứ không diễn tả sự tương phản mạnh. “Còn” làm rõ cấu trúc song song tăng tiến trong tiếng Việt.
- source_word: τὸν πέμψαντά με
  choice: Đấng đã sai Ta
  rationale: Phân từ aorist xác định Đấng sai Đức Chúa Giê-su. “Đấng” tự nhiên khi chỉ về Đức Chúa Trời, nhưng không đưa danh xưng “Cha” vào chính văn khi nguyên bản không nêu trực tiếp.
theological_decisions:
- issue: Danh tính của “Đấng đã sai Ta”
  choice: Giữ cách diễn đạt “Đấng đã sai Ta” trong chính văn
  alternative: “Cha, Đấng đã sai Ta”
  rationale: Trong ngữ cảnh sách Giăng, Đấng ấy là Đức Chúa Cha; tuy nhiên, câu này chỉ dùng cách diễn đạt theo mối quan hệ “Đấng đã sai Ta”. Bản dịch giữ nguyên mức độ tường minh của nguyên bản và ghi nhận danh tính ấy trong chú thích.
- issue: Ý nghĩa đại diện trong việc tiếp nhận người được sai đi
  choice: Giữ nguyên chuỗi “tiếp nhận người được sai—tiếp nhận Ta—tiếp nhận Đấng sai Ta”
  alternative: Diễn giải thành việc tôn trọng sứ giả hay vâng phục sứ điệp
  rationale: Nguyên bản lặp lại λαμβάνει để thiết lập chuỗi đại diện nhưng không giải thích cụ thể mọi hàm ý của hành động tiếp nhận. Giữ sự lặp lại giúp bảo toàn chiều sâu và sức căng thần học của câu.
- issue: Phân từ giống đực mang nghĩa khái quát
  choice: Ai tiếp nhận
  alternative: Người nào tiếp nhận
  rationale: Hình thức giống đực số ít trong tiếng Hy Lạp mang ý nghĩa đại diện, không giới hạn ở nam giới. “Ai” chuyển tải đúng phạm vi khái quát trong tiếng Việt.
translation_notes:
  register: Văn phong trang trọng, rõ ràng và hiện đại. Giữ công thức nhấn mạnh kép “Thật, thật”, chuỗi lặp “tiếp nhận” và cách gọi theo quan hệ “Đấng đã sai Ta”. Tránh lối xưng hô cổ như “các ngươi” và tránh thêm danh xưng thần học không có trực tiếp trong câu.
