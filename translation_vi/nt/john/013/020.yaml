  source_fidelity: 'Bản nháp bảo toàn đúng cấu trúc và chuỗi đại diện của nguyên văn: người tiếp nhận người được Đức Chúa Giê-su sai thì tiếp nhận Ngài, và người tiếp nhận Ngài thì tiếp nhận Đấng sai Ngài. Tuy nhiên, công thức ἀμὴν ἀμὴν tự nhiên và quen thuộc hơn trong tiếng Việt chuẩn hiện đại là “Quả thật, quả thật” thay vì “Thật, thật”. Cách “bất cứ ai Ta sai đi” chuyển tải phù hợp tính bất định/mở của ἄν τινα πέμψω.'
