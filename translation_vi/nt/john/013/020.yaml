  terminology: Giữ nhất quán “tiếp nhận” cho cả ba lần λαμβάνει, nhờ đó không làm mờ liên hệ đại diện trong câu. “Đấng đã sai Ta” không thêm trực tiếp danh xưng “Cha” vào chính văn; chú thích chỉ nêu nhận diện theo ngữ cảnh.
