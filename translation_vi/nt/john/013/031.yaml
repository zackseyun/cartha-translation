id: JHN.13.31
reference: John 13:31
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ὅτε ⸀οὖν ἐξῆλθεν ⸀λέγει Ἰησοῦς· Νῦν ἐδοξάσθη ὁ υἱὸς τοῦ ἀνθρώπου, καὶ ὁ θεὸς ἐδοξάσθη ἐν αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/john/013/031.yaml
  text: So when he had gone out[a], Jesus said, “Now the Son of Man has been glorified, and God has been glorified in him.”
translation:
  language: vi
  text: 'Vậy, sau khi Giu-đa đi ra, Đức Giê-su nói: “Giờ đây, Con Người đã được tôn vinh, và Đức Chúa Trời đã được tôn vinh trong Người.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “qua Người.” Cụm từ Hy Lạp có thể được hiểu là Đức Chúa Trời được tôn vinh trong Con Người hoặc qua Con Người.
    reason: alternative_reading
lexical_decisions:
- source_word: Ὅτε οὖν
  choice: Sau khi
  rationale: Diễn đạt tự nhiên quan hệ thời gian cùng bước chuyển tiếp trong trình thuật; ngữ cảnh cho thấy lời Đức Giê-su được nói sau khi Giu-đa ra ngoài.
- source_word: ἐξῆλθεν
  choice: Giu-đa đi ra
  rationale: Động từ aorist chỉ hành động ra ngoài đã xảy ra trước lời nói; chủ ngữ không được nêu trong chính câu Hy Lạp nhưng được xác định rõ từ ngữ cảnh ngay trước đó là Giu-đa.
- source_word: λέγει
  choice: nói
  rationale: Hiện tại lịch sử trong tiếng Hy Lạp được chuyển sang lối kể tự nhiên của tiếng Việt mà không làm thay đổi trình tự sự việc.
- source_word: Νῦν
  choice: Giờ đây
  rationale: Giữ cả sắc thái thời điểm và ý nghĩa chuyển sang giai đoạn vừa được mở ra sau khi Giu-đa rời đi.
- source_word: ἐδοξάσθη
  choice: đã được tôn vinh
  rationale: Giữ thể bị động và nét hoàn tất của aorist, đồng thời không xác định hẹp sự tôn vinh chỉ là thập tự giá, sự phục sinh hay sự thăng thiên.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Con Người
  rationale: Giữ danh hiệu quen thuộc Đức Giê-su dùng để chỉ chính mình và âm hưởng liên văn bản của danh hiệu này.
- source_word: ὁ θεὸς
  choice: Đức Chúa Trời
  rationale: Cách gọi trang trọng, rõ nghĩa cho θεός trong câu này.
- source_word: ἐν αὐτῷ
  choice: trong Người
  rationale: Bám sát nghĩa quan hệ/định vị thông thường của ἐν với tặng cách, đồng thời để ngỏ khả năng hiểu theo nghĩa phương tiện.
theological_decisions:
- issue: Phạm vi của sự tôn vinh được Đức Giê-su công bố
  choice: Giữ cách nói chung “đã được tôn vinh” mà không giới hạn vào một biến cố riêng lẻ.
  alternative: Giải thích cụ thể là sự đóng đinh, hoặc riêng sự phục sinh và tôn cao.
  rationale: Câu Hy Lạp không thu hẹp quy chiếu; cách dịch này bảo toàn độ rộng và sự căng thẳng thần học của mạch văn Giăng.
- issue: Ý nghĩa của ἐν αὐτῷ
  choice: trong Người
  alternative: qua Người
  rationale: Cụm từ có thể được hiểu theo quan hệ nội tại hoặc theo phương tiện. Bản văn chính giữ cách dịch trực tiếp hơn, còn chú thích bảo tồn cách hiểu kia.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Đức Giê-su,” “Con Người” và “Đức Chúa Trời” nhất quán; tránh diễn giải thêm đối tượng hay phương thức của sự tôn vinh ngoài điều bản văn cho phép.
