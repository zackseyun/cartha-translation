- from: Nếu các con biết những điều này, thì các con thật có phước nếu làm theo.[a]
  to: Nếu các con biết những điều này, các con có phước nếu làm những điều ấy.[a]
  rationale: Bản sửa bỏ sắc thái nhấn mạnh không có trong nguyên văn, diễn đạt rõ đối tượng số nhiều của ποιῆτε αὐτά, và điều chỉnh chú thích để phản ánh phạm vi nghĩa của μακάριος mà không gán cho từ này ý thịnh vượng vật chất.
