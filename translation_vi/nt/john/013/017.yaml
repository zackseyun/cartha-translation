  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἰ ταῦτα οἴδατε, μακάριοί ἐστε ἐὰν ποιῆτε αὐτά.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/017.yaml
  text: If you know these things[a], you are blessed if you do them.
translation:
  language: vi
  text: Nếu các con biết những điều này, các con có phước nếu làm những điều ấy.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “hạnh phúc” hoặc “may mắn”. Từ Hy Lạp được dịch là “có phước” chỉ một tình trạng tốt lành, được ưu ái, chứ không chỉ là cảm thấy vui.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ
  choice: Nếu
  rationale: Giữ nguyên cấu trúc điều kiện trực tiếp của tiếng Hy Lạp.
- source_word: ταῦτα
  choice: những điều này
  rationale: Bảo toàn dạng số nhiều của đại từ chỉ định và quy chiếu về gương mẫu cùng lời dạy ngay trước đó của Đức Chúa Jêsus.
- source_word: οἴδατε
  choice: biết
  rationale: Diễn đạt trực tiếp ý nghĩa nhận biết của οἶδα, không chuyển thành ‘hiểu’ khi động từ Hy Lạp không nói rõ như vậy.
- source_word: μακάριοί
  choice: thật có phước
  rationale: ‘Có phước’ diễn đạt trạng thái được ưu ái và thịnh vượng theo nghĩa Kinh Thánh, chứ không chỉ là cảm giác vui; ‘thật’ giúp câu tiếng Việt tự nhiên và nhấn mạnh lời tuyên bố.
- source_word: ἐὰν ποιῆτε αὐτά
  choice: nếu làm theo
  rationale: Giữ tính điều kiện của ἐὰν và ý thực hành của ποιέω; ‘làm theo’ tự nhiên hơn ‘làm chúng’ trong tiếng Việt và cho thấy việc đem những điều đã biết ra thực hiện.
theological_decisions:
- issue: Cách dịch μακάριοι trong bối cảnh môn đồ thực hành lời dạy
  choice: thật có phước
  alternative: hạnh phúc; may mắn
  rationale: ‘Có phước’ giữ được sức nặng thần học về tình trạng được hưởng ân huệ và sống tốt lành trước mặt Đức Chúa Trời, không thu hẹp ý nghĩa thành cảm xúc chủ quan hay vận may.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Dùng ‘các con’ phù hợp với lời Đức Chúa Jêsus nói trực tiếp với các môn đồ trong ngữ cảnh; giữ hai mệnh đề điều kiện của nguyên văn. Dấu chú thích được đặt ngay sau mệnh đề chứa thuật ngữ cần giải thích.
