id: JHN.13.30
reference: John 13:30
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: λαβὼν οὖν τὸ ψωμίον ἐκεῖνος ⸂ἐξῆλθεν εὐθύς⸃. ἦν δὲ νύξ.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/030.yaml
  text: So after taking the piece of bread[a], he went out immediately[c][b]. And it was night.
translation:
  language: vi
  text: Vậy, sau khi nhận miếng bánh[a], người ấy lập tức đi ra[b]. Lúc đó là ban đêm[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “mẩu bánh” hoặc “miếng thức ăn”. Từ Hy Lạp ψωμίον chỉ một miếng bánh hay thức ăn nhỏ được trao trong bữa ăn.
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn Hy Lạp là “người ấy”, có sắc thái nhấn mạnh hơn một đại từ thông thường và có lẽ hướng sự chú ý đến Giu-đa.
    reason: lexical_alternative
  - marker: c
    text: Chi tiết “ban đêm” trước hết chỉ thời gian theo nghĩa đen, nhưng cũng có thể gợi lại chủ đề ánh sáng và bóng tối trong Tin Mừng Giăng.
    reason: cross_reference
lexical_decisions:
- source_word: λαβὼν
  choice: sau khi nhận
  rationale: Phân từ bất định quá khứ diễn tả hành động xảy ra trước động từ chính; cách dịch này giữ đúng trình tự và tự nhiên trong tiếng Việt.
- source_word: οὖν
  choice: Vậy
  rationale: Đánh dấu bước tiếp diễn hoặc hệ quả trong câu chuyện; “Vậy” ngắn gọn và phù hợp mạch văn.
- source_word: τὸ ψωμίον
  choice: miếng bánh
  rationale: ψωμίον chỉ một miếng bánh hoặc thức ăn nhỏ; “miếng bánh” rõ nghĩa, tự nhiên và phù hợp bữa ăn trong ngữ cảnh.
- source_word: ἐκεῖνος
  choice: người ấy
  rationale: Giữ sắc thái chỉ định và nhấn mạnh hơn đại từ đơn thuần “ông”, đồng thời không thô cứng như “người kia” trong tiếng Việt.
- source_word: ἐξῆλθεν
  choice: đi ra
  rationale: Giữ nghĩa không gian trực tiếp của ἐξέρχομαι, thay vì diễn giải khái quát là “rời đi”.
- source_word: εὐθύς
  choice: lập tức
  rationale: Diễn đạt chính xác tính tức thời, với văn phong trang trọng nhưng hiện đại.
- source_word: ἦν δὲ νύξ
  choice: Lúc đó là ban đêm
  rationale: Giữ nghĩa thời gian đơn giản và sức gợi văn chương của câu Hy Lạp mà không đưa ý nghĩa biểu tượng vào chính văn.
theological_decisions:
- issue: Ý nghĩa biểu tượng có thể có của “ban đêm” trong Tin Mừng Giăng
  choice: 'Dịch như một lời xác định thời gian: “Lúc đó là ban đêm.”'
  alternative: Diễn giải ngay trong chính văn rằng đây là bóng tối thuộc linh.
  rationale: Mệnh đề Hy Lạp trực tiếp nói về thời gian, dù trong văn mạch Giăng nó có thể đồng thời gợi chủ đề ánh sáng và bóng tối. Bản dịch giữ nguyên độ mở này.
- issue: Sắc thái của ἐκεῖνος khi nói về Giu-đa
  choice: Giữ nét nhấn bằng “người ấy”.
  alternative: Dịch đơn giản là “ông” hoặc “người”.
  rationale: Đại từ chỉ định có tính đánh dấu và có thể tạo khoảng cách trong lời kể; “người ấy” bảo tồn sắc thái ấy mà không thêm phán đoán thần học.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng vừa phải và dễ hiểu. Câu ngắn giữ nhịp kể cô đọng của nguyên văn; các dấu chú thích được đặt ngay sau những từ hoặc mệnh đề liên quan.
