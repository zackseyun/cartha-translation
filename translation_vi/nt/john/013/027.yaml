source:
  edition: SBLGNT
  text: καὶ μετὰ τὸ ψωμίον τότε εἰσῆλθεν εἰς ἐκεῖνον ὁ Σατανᾶς. λέγει οὖν αὐτῷ ⸀ὁ Ἰησοῦς· Ὃ ποιεῖς ποίησον τάχιον.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/027.yaml
  text: And after the piece of bread[a], then Satan entered into him. So Jesus said to him, “What you are doing[b], do more quickly.”
translation:
  language: vi
  text: 'Sau miếng bánh ấy[a], thì Sa-tan nhập vào ông. Vậy Đức Giê-su nói với ông: “Việc anh đang làm, hãy làm cho mau hơn[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “miếng thức ăn”. Từ Hy Lạp ψωμίον chỉ một miếng thức ăn nhỏ; trong bối cảnh này, rất có thể là miếng bánh đã được chấm trong bữa ăn.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “hãy làm mau”. Từ Hy Lạp τάχιον có dạng so sánh, theo sát là “mau hơn”, dù trong cách nói tự nhiên nó thường chỉ mang nghĩa “mau”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ψωμίον
  choice: miếng bánh
  rationale: Từ này chỉ một miếng thức ăn nhỏ; trong bối cảnh bữa ăn ở đây, đó là miếng bánh. Cách dịch này cụ thể, tự nhiên và không thêm hành động ‘ăn’ hay ‘nhận’ vốn không được nêu trực tiếp trong câu.
- source_word: εἰσῆλθεν εἰς ἐκεῖνον
  choice: nhập vào ông
  rationale: Giữ nguyên ý về sự đi vào trực tiếp của một tác nhân có ngôi vị, không làm nhẹ thành ảnh hưởng tâm lý cũng không diễn giải quá mức thành một học thuyết đầy đủ về sự chiếm hữu.
- source_word: ὁ Σατανᾶς
  choice: Sa-tan
  rationale: Dùng tên gọi đã quen thuộc trong tiếng Việt Tân Ước, thay vì dịch theo nghĩa từ nguyên là ‘Kẻ Chống Đối’.
- source_word: λέγει οὖν αὐτῷ ὁ Ἰησοῦς
  choice: Vì vậy, Đức Giê-su nói với ông
  rationale: Thì hiện tại lịch sử của λέγει được chuyển sang thì kể chuyện tự nhiên trong tiếng Việt; οὖν được thể hiện bằng ‘Vì vậy’, giữ quan hệ nối kết với sự việc vừa nêu.
- source_word: Ὃ ποιεῖς
  choice: Việc anh đang làm
  rationale: Thể hiện giá trị hiện tại/đang diễn ra của ποιεῖς, tránh diễn giải thành ‘việc anh sắp làm’.
- source_word: ποίησον τάχιον
  choice: hãy làm mau hơn
  rationale: Giữ mệnh lệnh ngắn gọn, dứt khoát của ποίησον và sắc thái so sánh của τάχιον bằng ‘mau hơn’, dù tiếng Việt thường có thể làm trơn thành ‘làm mau’.
theological_decisions:
- issue: Bản chất hành động của Sa-tan đối với Giu-đa
  choice: Giữ cách nói trực tiếp ‘Sa-tan nhập vào ông’.
  alternative: ‘Sa-tan kiểm soát ông’ hoặc ‘ông phó mình cho Sa-tan’.
  rationale: Nguyên văn nói đến việc Sa-tan đích thân đi vào người ấy. Bản dịch không thu hẹp điều này thành ẩn dụ, nhưng cũng không thêm lời giải thích về mức độ kiểm soát hay trách nhiệm của Giu-đa.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Đại từ ‘anh’ thể hiện lời Đức Giê-su nói trực tiếp với Giu-đa mà không thêm tên ông vào câu; ‘ông’ trong lời trần thuật giữ sắc thái tôn trọng trung tính. Cấu trúc mở đầu ‘Sau miếng bánh ấy’ cố ý giữ nét cô đọng và phần nào bất thường của nguyên văn, không tự ý thêm ‘ăn’ hoặc ‘nhận’.
