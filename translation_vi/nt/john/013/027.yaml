  source_fidelity: 'Bản dịch giữ đúng các yếu tố chính: ψωμίον là “miếng bánh”, Sa-tan “nhập vào” Giu-đa, và mệnh lệnh cuối giữ sắc thái so sánh của τάχιον. Tuy nhiên, “liền” thêm sắc thái tức khắc không có trong τότε; từ này ở đây chỉ mốc tiếp nối “thì/lúc ấy”. Cần thay để không tăng cường ý thời gian.'
