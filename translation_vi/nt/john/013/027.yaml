revisions:
- from: 'Sau miếng bánh ấy[a], Sa-tan liền nhập vào ông. Vì vậy, Đức Giê-su nói với ông: “Việc anh đang làm, hãy làm mau hơn[b].”'
  to: 'Sau miếng bánh ấy[a], thì Sa-tan nhập vào ông. Vậy Đức Giê-su nói với ông: “Việc anh đang làm, hãy làm cho mau hơn[b].”'
  rationale: Thay “liền” bằng “thì” để dịch đúng τότε mà không thêm ý hành động xảy ra ngay tức khắc. Đổi “Vì vậy” thành “Vậy” cho liên từ οὖν tự nhiên và nhẹ hơn trong mạch kể chuyện. Thêm “cho” trong mệnh lệnh cuối để cụm so sánh “mau hơn” tự nhiên trong tiếng Việt, không thay đổi ý nghĩa.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T06:25:01Z'
