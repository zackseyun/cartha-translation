  yaml_path: translation/nt/john/013/007.yaml
  text: Jesus answered and said to him[a], “What I am doing you do not know now[b], but you will understand after these things.”
translation:
  language: vi
  text: 'Đức Giê-su trả lời ông: “Điều tôi đang làm, bây giờ ông chưa biết[a], nhưng sau những điều này[b] ông sẽ hiểu.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hy Lạp dùng hai động từ khác nhau: ở đây là “biết”, còn ở vế sau là động từ thường có thể dịch “biết được” hoặc “hiểu”.'
    reason: lexical_alternative
  - marker: b
    text: “Sau những điều này” có thể chỉ những gì diễn ra tiếp theo trong sự việc này, hoặc rộng hơn là những biến cố về sau sẽ làm sáng tỏ hành động của Đức Giê-su.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ
  choice: Đức Giê-su đáp lời ông
  rationale: Tiếng Hy Lạp dùng cả ‘đáp’ và ‘nói’, nhưng trong tiếng Việt hiện đại, ‘đáp lời ông’ chuyển tải tự nhiên cả ý trả lời lẫn hướng lời nói đến Phi-e-rơ, tránh lối diễn đạt nặng nề ‘đáp và nói với ông’.
- source_word: Ὃ ἐγὼ ποιῶ
  choice: Việc tôi đang làm
  rationale: Thì hiện tại chỉ hành động Đức Giê-su đang thực hiện; ‘đang làm’ thể hiện rõ tính tiếp diễn trong ngữ cảnh rửa chân.
- source_word: σὺ οὐκ οἶδας ἄρτι
  choice: bây giờ ông chưa biết
  rationale: ‘Biết’ giữ nghĩa thông thường của οἶδα và ‘chưa’ diễn đạt tự nhiên sự thiếu nhận biết ở hiện tại trong thế đối lập với sự hiểu biết về sau.
- source_word: γνώσῃ δὲ
  choice: nhưng ... ông sẽ hiểu
  rationale: ‘Hiểu’ thể hiện sự nhận ra ý nghĩa về sau, đồng thời giữ được nét phân biệt với οἶδας đã dịch là ‘biết’.
- source_word: μετὰ ταῦτα
  choice: sau những việc này
  rationale: Cách dịch sát và tự nhiên, giữ nguyên độ mở của số nhiều ταῦτα thay vì quy định đó chỉ là sau hành động rửa chân hay một biến cố thần học cụ thể.
theological_decisions:
- issue: Phạm vi thời gian của lời hứa rằng Phi-e-rơ sẽ hiểu
  choice: Giữ cách nói mở ‘sau những việc này’
  alternative: ‘sau này’ hoặc xác định là sau khi rửa chân, sau thập tự giá/phục sinh, hay nhờ Thánh Linh
  rationale: Nguyên văn không xác định biến cố nào sẽ đem lại sự hiểu biết; bản dịch không thu hẹp một cách diễn giải thần học vốn còn để ngỏ.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng ‘Đức Giê-su’ theo lối gọi kính trọng; đại từ ‘tôi/ông’ tự nhiên trong lời đối thoại. Lược phép đôi ‘đáp và nói’ để tránh văn dịch cứng, nhưng vẫn bảo toàn chức năng thuật chuyện của cụm Hy Lạp.
