review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch truyền đạt đúng ý chính của nguyên văn: Đức Giê-su trả lời Phi-e-rơ, Phi-e-rơ hiện chưa biết điều Ngài đang làm nhưng sẽ hiểu về sau. “Chưa biết” (οὐκ οἶδας) và “sẽ hiểu” (γνώσῃ) giữ được sự phân biệt có chủ ý giữa hai động từ Hy Lạp mà không ép một cách giải thích về mốc thời gian của μετὰ ταῦτα. Việc gộp ἀπεκρίθη ... καὶ εἶπεν thành “trả lời” là chấp nhận được trong tiếng Việt tự nhiên.'
  naturalness: Cần chỉnh nhẹ để câu trôi chảy và neo chú thích đúng vào cụm từ được giải thích. “Điều tôi đang làm” tự nhiên hơn “Việc tôi đang làm” trong phát ngôn này. Đặt [b] sau “những điều này” giúp người đọc thấy rõ chú thích liên quan đến μετὰ ταῦτα, thay vì tưởng rằng chú thích giải thích động từ “hiểu.”
  terminology: “Đức Giê-su” phù hợp lối gọi kính trọng; “ông” và “tôi” giữ đúng ngữ cảnh đối thoại trang trọng vừa phải. Không cần nêu tên Phi-e-rơ trong câu, vì đại từ αὐτῷ được hiểu rõ từ văn mạch. “Sau những điều này” bảo toàn số nhiều và tính chưa xác định của μετὰ ταῦτα tốt hơn cách diễn giải cụ thể hóa.
  issues:
  - severity: low
    issue: Neo chú thích [b] đang đặt sau “hiểu” thay vì sau cụm “sau những việc này.”
    rationale: Chú thích [b] giải thích phạm vi quy chiếu của μετὰ ταῦτα, nên cần được neo trực tiếp tại cụm từ tương ứng để chính xác về cấu trúc chú thích và rõ nghĩa cho người đọc.
  - severity: low
    issue: “Việc tôi đang làm” hơi kém tự nhiên hơn “Điều tôi đang làm” trong lời thoại tiếng Việt hiện đại.
    rationale: Ὃ ἐγὼ ποιῶ là một mệnh đề quan hệ trung tính; “Điều tôi đang làm” là cách diễn đạt Việt ngữ thông dụng, tự nhiên và vẫn giữ nguyên nghĩa.
  revised_text: 'Đức Giê-su trả lời ông: “Điều tôi đang làm, bây giờ ông chưa biết[a], nhưng sau những điều này[b] ông sẽ hiểu.”'
