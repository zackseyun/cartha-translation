  text: ᾔδει γὰρ τὸν παραδιδόντα αὐτόν· διὰ τοῦτο εἶπεν ⸀ὅτι Οὐχὶ πάντες καθαροί ἐστε.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/011.yaml
  text: For he knew the one who was betraying him; for this reason he said[a], “Not all of you are clean.”
translation:
  language: vi
  text: 'Vì Ngài biết người đang phản bội Ngài[a], nên Ngài đã nói: “Không phải tất cả các con đều sạch.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát nghĩa hơn: “người đang giao nộp Ngài.” Trong văn cảnh, câu này nói đến hành vi phản bội của Giu-đa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾔδει
  choice: Ngài biết
  rationale: οἶδα ở dạng này mang nghĩa trạng thái hiện tại trong mạch kể quá khứ; “biết” diễn đạt tự nhiên sự hiểu biết sẵn có của Chúa Giê-su.
- source_word: γὰρ
  choice: Vì
  rationale: γάρ giải thích cho lời khẳng định ở câu trước; “Vì” giữ rõ quan hệ giải thích.
- source_word: τὸν παραδιδόντα αὐτόν
  choice: kẻ đang phản bội Ngài
  rationale: Phân từ hiện tại παραδιδόντα có nghĩa gốc là “đang nộp/giao”, nhưng trong bối cảnh cuộc thương khó chỉ hành vi phản bội của Giu-đa. “Đang phản bội” truyền đạt lực ngữ cảnh và vẫn giữ sắc thái diễn tiến của phân từ.
- source_word: διὰ τοῦτο
  choice: nên
  rationale: Cấu trúc “Vì … nên …” diễn đạt tự nhiên và minh bạch quan hệ nguyên nhân–kết quả giữa việc Ngài biết và lời Ngài nói.
- source_word: εἶπεν ὅτι
  choice: 'Ngài đã nói:'
  rationale: Dấu hai chấm và lời trích dẫn trực tiếp thể hiện chức năng dẫn lời của ὅτι mà không cần dịch máy móc là “rằng”.
- source_word: Οὐχὶ πάντες
  choice: Không phải tất cả các con
  rationale: 'Cách diễn đạt này giữ đúng phạm vi phủ định: không phải toàn thể đều sạch, chứ không nói rằng không một ai sạch. “Các con” thể hiện ngôi thứ hai số nhiều trong lời Chúa Giê-su nói với các môn đồ.'
- source_word: καθαροί
  choice: sạch
  rationale: “Sạch” bảo toàn sự cộng hưởng giữa việc rửa theo nghĩa thể lý và tình trạng thuộc linh; “thanh sạch” dễ nghiêng quá mạnh về nghĩa đạo đức hoặc nghi lễ.
- source_word: ἐστε
  choice: đều sạch
  rationale: “Đều” phối hợp tự nhiên với “tất cả” trong cấu trúc phủ định tiếng Việt, còn tính từ “sạch” làm vị ngữ tương ứng với động từ nối ἐστε.
theological_decisions:
- issue: Ý nghĩa của παραδιδόντα đối với hành động của Giu-đa
  choice: đang phản bội
  alternative: đang nộp Ngài
  rationale: Trong văn cảnh Gio-an, động từ chỉ việc Giu-đa giao nộp Chúa Giê-su bằng hành vi phản bội. Bản dịch chính ưu tiên nghĩa ngữ cảnh, còn chú thích giữ nghĩa sát chữ để người đọc thấy sắc thái nguyên ngữ.
- issue: Sắc thái của καθαροί trong diễn từ rửa chân
  choice: sạch
  alternative: thanh sạch
  rationale: “Sạch” duy trì đồng thời hình ảnh rửa chân và hàm ý về tình trạng bên trong, không tự ý thu hẹp câu nói vào một phạm trù thần học duy nhất.
- issue: Phạm vi phủ định trong Οὐχὶ πάντες καθαροί ἐστε
  choice: Không phải tất cả các con đều sạch
  alternative: Tất cả các con không đều sạch
  rationale: Cách chọn rõ ràng hơn trong tiếng Việt hiện đại và bảo toàn ý rằng có ít nhất một người không sạch, không biến câu thành lời khẳng định rằng tất cả đều ô uế.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại. Dùng “Ngài” cho Chúa Giê-su và “các con” trong lời Ngài nói với các môn đồ. Cấu trúc “Vì … nên …” giúp câu tiếng Việt trôi chảy mà vẫn giữ quan hệ lập luận của nguyên văn.
