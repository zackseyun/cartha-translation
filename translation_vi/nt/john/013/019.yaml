revisions:
- from: Ngay từ bây giờ, Thầy nói cho anh em biết trước khi việc ấy xảy ra, để khi việc ấy xảy ra, anh em tin rằng chính là Thầy.[a]
  to: Từ bây giờ, Thầy nói cho anh em biết trước khi việc ấy xảy ra, để khi việc ấy xảy ra, anh em tin rằng chính Thầy là Đấng ấy.[a]
  rationale: Sửa bản chính để câu tự nhiên, rõ chủ ngữ và giữ ý tự nhận diện của câu; “Đấng ấy” được dùng như phần bổ sung tối thiểu cho tiếng Việt, không áp đặt danh hiệu. Chú thích giữ bản dịch sát của ἐγώ εἰμι và lưu ý khả năng liên văn bản theo cách không quyết đoán.
