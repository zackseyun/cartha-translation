base_translation:
  language: en
  yaml_path: translation/nt/john/013/019.yaml
  text: From now on I am telling you before it happens[a], so that when it does happen, you may believe that I am he.
translation:
  language: vi
  text: Từ bây giờ, Thầy nói cho anh em biết trước khi việc ấy xảy ra, để khi việc ấy xảy ra, anh em tin rằng chính Thầy là Đấng ấy.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc sát chữ: “rằng Ta là.” Cách nói Hy Lạp không có vị ngữ và cũng có thể gợi lại lời Đức Chúa Trời tự bày tỏ mình trong sách Ê-sai và ở những chỗ khác trong sách Giăng.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπ’ ἄρτι
  choice: Ngay từ bây giờ
  rationale: Diễn đạt tự nhiên mốc thời gian bắt đầu ở hiện tại và hướng về phía trước.
- source_word: λέγω ὑμῖν
  choice: Thầy nói cho anh em biết
  rationale: Giữ thì hiện tại và lời trực tiếp với các môn đồ; cách xưng hô “Thầy—anh em” tự nhiên, trang trọng trong ngữ cảnh.
- source_word: πρὸ τοῦ γενέσθαι
  choice: trước khi việc ấy xảy ra
  rationale: Giữ quan hệ thời gian đi trước và không xác định quá mức biến cố mà câu Hy Lạp để ngỏ.
- source_word: ἵνα
  choice: để
  rationale: Diễn đạt rõ mục đích của lời báo trước bằng tiếng Việt tự nhiên.
- source_word: πιστεύσητε
  choice: anh em tin
  rationale: Giữ nghĩa thông thường của πιστεύω và không áp đặt sắc thái khởi đầu tin hay tin cậy nếu ngữ cảnh không buộc phải chọn.
- source_word: ὅταν γένηται
  choice: khi việc ấy xảy ra
  rationale: Diễn đạt một biến cố tương lai được dự liệu, đồng thời lặp lại “xảy ra” để phản ánh sự lặp từ của nguyên văn.
- source_word: ὅτι ἐγώ εἰμι
  choice: rằng chính là Thầy
  rationale: Cách nói này dễ hiểu trong tiếng Việt như một lời tự nhận diện, nhưng không thêm một danh hiệu cụ thể vốn không có trong tiếng Hy Lạp; chú thích giữ cách dịch sát hơn và khả năng liên tưởng thần học.
theological_decisions:
- issue: Cách dịch lối nói tuyệt đối ἐγώ εἰμι trong văn mạch Giăng, có thể gợi đến lời Đức Chúa Trời tự bày tỏ căn tính
  choice: rằng chính là Thầy
  alternative: rằng Thầy là
  rationale: Bản chính cần tự nhiên và có thể hiểu được như lời tự nhận diện, nhưng không nên thêm một vị ngữ hay danh hiệu cụ thể. Chú thích bảo tồn cấu trúc không có vị ngữ của tiếng Hy Lạp và lưu ý âm vang có thể có từ Ê-sai cũng như những chỗ khác trong sách Giăng.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng cặp xưng hô “Thầy—anh em” phù hợp lời Đức Chúa Jêsus nói với các môn đồ; tránh lối văn cổ và tránh giải nghĩa quá mức cụm ἐγώ εἰμι.
