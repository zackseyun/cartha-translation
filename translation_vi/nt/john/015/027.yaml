id: JHN.15.27
reference: John 15:27
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ὑμεῖς δὲ μαρτυρεῖτε, ὅτι ἀπ’ ἀρχῆς μετ’ ἐμοῦ ἐστε.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/027.yaml
  text: And you also testify[b][a], because you have been with me from the beginning.
translation:
  language: vi
  text: Còn chính các con cũng làm chứng, vì các con đã ở với thầy từ ban đầu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ ὑμεῖς δὲ
  choice: Còn chính các con cũng
  rationale: 'Diễn đạt đại từ được nêu rõ và có tính nhấn mạnh, đồng thời giữ sắc thái tiếp nối/đối chiếu nhẹ của δέ: cùng với Đấng Bảo Trợ ở câu trước, các môn đồ cũng làm chứng.'
- source_word: μαρτυρεῖτε
  choice: làm chứng
  rationale: Cách nói tự nhiên trong tiếng Việt hiện đại, giữ được nghĩa chứng nhân và sắc thái pháp lý của động từ.
- source_word: ὅτι
  choice: vì
  rationale: Trong ngữ cảnh này, từ này tự nhiên nhất khi giới thiệu lý do các môn đồ làm chứng.
- source_word: ἀπ’ ἀρχῆς
  choice: từ ban đầu
  rationale: Giữ nguyên cách diễn đạt có độ mở của nguyên văn; theo ngữ cảnh, cụm này chỉ thời điểm bắt đầu các môn đồ ở với Chúa Giê-su.
- source_word: μετ’ ἐμοῦ
  choice: ở với thầy
  rationale: Diễn đạt tự nhiên ý đồng hành và gắn bó của μετά với sở hữu cách.
- source_word: ἐστε
  choice: đã ở
  rationale: Tuy hình thức Hy Lạp là hiện tại, tiếng Việt dùng 'đã ở ... từ ban đầu' để diễn tả trạng thái bắt đầu trong quá khứ và kéo dài đến thời điểm nói; cụm 'ở với' cùng ngữ cảnh vẫn giữ ý liên tục.
theological_decisions:
- issue: Phạm vi nghĩa của “từ ban đầu”
  choice: Giữ nguyên “từ ban đầu” trong chính văn, theo ngữ cảnh gợi đến sự đồng hành của các môn đồ từ đầu sứ vụ/mối quan hệ môn đồ.
  alternative: Hiểu theo nghĩa tuyệt đối hoặc siêu hình rộng hơn.
  rationale: Ngữ cảnh trực tiếp nói đến tư cách chứng nhân lịch sử của các môn đồ. Bản dịch không thêm lời giải thích làm mất độ mở của nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “các con—thầy” phù hợp lời Chúa Giê-su nói thân mật với các môn đồ, tránh lối xưng hô cổ; câu giữ nhịp gọn và rõ.
