id: JHN.15.15
reference: John 15:15
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οὐκέτι ⸂λέγω ὑμᾶς⸃ δούλους, ὅτι ὁ δοῦλος οὐκ οἶδεν τί ποιεῖ αὐτοῦ ὁ κύριος· ὑμᾶς δὲ εἴρηκα φίλους, ὅτι πάντα ἃ ἤκουσα παρὰ τοῦ πατρός μου ἐγνώρισα ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/015.yaml
  text: I no longer call you servants[a], because the servant does not know what his master is doing. But I have called you friends[b], because I have made known to you everything that I heard from my Father.
translation:
  language: vi
  text: Thầy không còn gọi anh em là nô lệ[a], vì nô lệ không biết chủ mình đang làm gì. Nhưng Thầy đã gọi anh em là bạn hữu, vì mọi điều Thầy đã nghe từ Cha Thầy, Thầy đều đã cho anh em biết.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hy Lạp doulos cũng có thể dịch là “đầy tớ” hoặc “tôi tớ”; trong câu này, “nô lệ” làm rõ hơn sự tương phản về địa vị với “bạn hữu”.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκέτι λέγω ὑμᾶς
  choice: không còn gọi anh em là
  rationale: Diễn đạt tự nhiên sự thay đổi về cách gọi; thì hiện tại của λέγω được giữ bằng “gọi”, còn οὐκέτι là “không còn”.
- source_word: δούλους / ὁ δοῦλος
  choice: nô lệ / nô lệ
  rationale: Trong thế đối lập với “bạn hữu” và với người chủ, từ này nhấn mạnh địa vị lệ thuộc và việc không được biết công việc của chủ; “nô lệ” giữ sắc thái ấy rõ hơn “đầy tớ”.
- source_word: αὐτοῦ ὁ κύριος
  choice: chủ mình
  rationale: κύριος ở đây chỉ người chủ trong quan hệ chủ–nô lệ, không phải tước hiệu thần học; “chủ mình” tự nhiên và thể hiện đúng quan hệ sở thuộc.
- source_word: ὑμᾶς δὲ εἴρηκα φίλους
  choice: Nhưng Thầy đã gọi anh em là bạn hữu
  rationale: “Đã gọi” diễn đạt hành động đã được xác lập và vẫn có hiệu lực; “bạn hữu” giữ rõ thế đối lập với “nô lệ” trong văn phong trang trọng, dễ hiểu.
- source_word: πάντα ἃ ἤκουσα παρὰ τοῦ πατρός μου
  choice: mọi điều Thầy đã nghe từ Cha Thầy
  rationale: Giữ nghĩa trực tiếp của ἀκούω là “nghe” và παρά với sở hữu cách là nguồn xuất phát, “từ Cha Thầy”.
- source_word: ἐγνώρισα ὑμῖν
  choice: Thầy đều đã cho anh em biết
  rationale: Diễn đạt tự nhiên hành động làm cho biết; “đều” liên kết với “mọi điều” và thể hiện tính toàn diện của πάντα.
theological_decisions:
- issue: Sắc thái địa vị của δοῦλος trong sự tương phản với φίλος
  choice: nô lệ
  alternative: đầy tớ; tôi tớ
  rationale: Câu này đối lập người lệ thuộc, không biết việc chủ làm, với bạn hữu được chia sẻ điều đã nghe từ Cha. “Nô lệ” giữ được sức nặng xã hội và thần học của sự tương phản mà không làm nhẹ thành quan hệ lao động tự nguyện.
- issue: Nghĩa của κύριος trong phép so sánh về địa vị
  choice: chủ
  alternative: Chúa; chủ nhân
  rationale: Ở đây κύριος là người chủ của nô lệ trong phép so sánh, không trực tiếp là danh xưng dành cho Đức Chúa Jêsus; “chủ” tránh nhập một tước hiệu thần học vào chỗ này.
- issue: Giá trị kết quả của εἴρηκα và ý nghĩa còn hiệu lực của sự bày tỏ
  choice: đã gọi ... đều đã cho ... biết
  alternative: gọi ... cho ... biết; đã gọi ... đã bày tỏ
  rationale: Cách dùng “đã” cho thấy lời xác nhận và việc truyền đạt đã xảy ra, đồng thời ngữ cảnh cho thấy kết quả vẫn còn hiệu lực. Bản dịch không thêm một cách giải thích giáo lý về phạm vi của “mọi điều”.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Cặp xưng hô “Thầy—anh em” phù hợp bối cảnh Đức Chúa Jêsus nói với các môn đồ mà không dùng đại từ cổ “các ngươi”. “Bạn hữu” được chọn thay cho “bạn bè” để giữ sắc thái trang trọng và làm nổi bật sự xác lập quan hệ. Dấu câu chia rõ hai vế tương phản.
