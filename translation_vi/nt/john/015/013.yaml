reference: John 15:13
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: μείζονα ταύτης ἀγάπην οὐδεὶς ἔχει, ἵνα τις τὴν ψυχὴν αὐτοῦ θῇ ὑπὲρ τῶν φίλων αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/013.yaml
  text: 'No one has greater love than this: that someone lay down his life for his friends[a][b][c][d].'
translation:
  language: vi
  text: 'Không ai có tình yêu nào lớn hơn tình yêu này: hy sinh mạng sống mình vì bạn hữu của mình[a][b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Mạng sống” dịch từ psychē trong tiếng Hy Lạp; từ này cũng có thể có nghĩa là “linh hồn” hoặc “bản thân”. Ở đây, từ ấy chỉ mạng sống được trao đi trong cái chết.
    reason: lexical_alternative
  - marker: b
    text: “Vì” cũng có thể dịch là “vì lợi ích của” hoặc “thay cho”; từ Hy Lạp không buộc phải chọn riêng một sắc thái trong câu này.
    reason: lexical_alternative
lexical_decisions:
- source_word: μείζονα ταύτης ἀγάπην
  choice: tình yêu lớn hơn tình yêu này
  rationale: Giữ phép so sánh và đại từ chỉ định của Hy Lạp; cách diễn đạt tự nhiên trong tiếng Việt và hướng tới mệnh đề giải thích theo sau.
- source_word: οὐδεὶς ἔχει
  choice: Không ai có
  rationale: Chuyển trực tiếp cấu trúc phủ định và động từ sở hữu, rõ ràng trong tiếng Việt hiện đại.
- source_word: ἵνα τις
  choice: hy sinh
  rationale: Mệnh đề ἵνα ở đây nêu nội dung biểu hiện của 'tình yêu này'. Tiếng Việt không cần dịch riêng chủ ngữ bất định τις vì chủ thể đã được khái quát bằng 'không ai'; cách rút gọn tránh đại từ mang giới tính.
- source_word: τὴν ψυχὴν αὐτοῦ θῇ
  choice: hy sinh mạng sống mình
  rationale: ψυχή trong ngữ cảnh là sự sống bị phó bỏ đến mức chết; 'hy sinh mạng sống mình' truyền đạt tự nhiên thành ngữ Hy Lạp 'đặt xuống mạng sống' mà không gợi sự phân đôi thân xác–linh hồn.
- source_word: ὑπὲρ
  choice: vì
  rationale: Diễn đạt ngắn gọn ý làm điều ấy vì lợi ích hoặc vì cớ người khác, nhưng không xác định quá mức sắc thái thay thế.
- source_word: τῶν φίλων αὐτοῦ
  choice: bạn hữu
  rationale: φίλοι là những người bạn của chủ thể. 'Bạn hữu' trang trọng vừa phải và phù hợp văn phong Kinh Thánh hiện đại.
theological_decisions:
- issue: Ý nghĩa của ψυχή trong lời nói về sự tự hiến
  choice: Dịch là 'mạng sống', không phải 'linh hồn'.
  alternative: '''linh hồn'' hoặc ''bản thân'''
  rationale: Ngữ cảnh nói đến việc tự nguyện chịu chết vì người khác; 'mạng sống' thể hiện đúng nghĩa cụ thể mà không đưa vào một quan niệm nhân học không được câu này nhấn mạnh.
- issue: Sắc thái của ὑπέρ
  choice: Dịch là 'vì'.
  alternative: '''thay cho'' hoặc ''vì lợi ích của'''
  rationale: ὑπέρ có thể mang sắc thái vì lợi ích, đại diện hoặc thay thế. 'Vì' giữ được độ rộng ngữ nghĩa và không áp đặt một cách giải thích thần học duy nhất.
- issue: Chủ thể bất định τις và đại từ αὐτοῦ
  choice: 'Dùng cấu trúc tiếng Việt lược chủ ngữ: ''hy sinh mạng sống mình''.'
  alternative: '''một người hy sinh mạng sống của mình'''
  rationale: Cấu trúc này vẫn mang nghĩa phổ quát, không giới hạn giới tính, đồng thời tránh sự nặng nề và giữ quan hệ phản thân của αὐτοῦ trong tiếng Việt.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng 'hy sinh mạng sống mình' thay cho cách dịch sát chữ 'đặt mạng sống xuống', vốn không tự nhiên trong tiếng Việt; 'bạn hữu' duy trì sắc thái trang nghiêm mà vẫn thông dụng.
