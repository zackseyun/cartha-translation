id: JHN.15.20
reference: John 15:20
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: μνημονεύετε τοῦ λόγου οὗ ἐγὼ εἶπον ὑμῖν· Οὐκ ἔστιν δοῦλος μείζων τοῦ κυρίου αὐτοῦ· εἰ ἐμὲ ἐδίωξαν, καὶ ὑμᾶς διώξουσιν· εἰ τὸν λόγον μου ἐτήρησαν, καὶ τὸν ὑμέτερον τηρήσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/020.yaml
  text: 'Remember the word that I said to you: ‘A servant is not greater than his master.’ If they persecuted me[a], they will also persecute you; if they kept my word[b], they will also keep yours.'
translation:
  language: vi
  text: 'Hãy nhớ lời tôi đã nói với anh em: “Nô lệ không lớn hơn chủ mình.”[a] Nếu họ đã bắt bớ tôi, họ cũng sẽ bắt bớ anh em; nếu họ đã giữ lời tôi, họ cũng sẽ giữ lời anh em.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “đầy tớ” hoặc “tôi tớ”; từ Hy Lạp δοῦλος chỉ người ở địa vị lệ thuộc vào chủ.
    reason: lexical_alternative
  - marker: b
    text: “Giữ lời” có thể bao gồm việc tiếp nhận và vâng theo lời ấy.
    reason: lexical_ambiguity
lexical_decisions:
- source_word: μνημονεύετε
  choice: Hãy nhớ
  rationale: Động từ mệnh lệnh hiện tại kêu gọi các môn đệ tiếp tục ghi nhớ; “hãy nhớ” tự nhiên và giữ nguyên lực mệnh lệnh.
- source_word: τοῦ λόγου οὗ ἐγὼ εἶπον ὑμῖν
  choice: lời tôi đã nói với anh em
  rationale: λόγος ở đây chỉ câu nói cụ thể được trích ngay sau đó. “Lời” giữ được cách diễn đạt của Giăng mà vẫn tự nhiên trong tiếng Việt.
- source_word: δοῦλος
  choice: nô lệ
  rationale: Trong câu châm ngôn đối lập với κύριος, địa vị lệ thuộc là trọng tâm; “nô lệ” diễn đạt rõ hơn sức nặng xã hội của từ Hy Lạp, còn “đầy tớ” được ghi nhận ở chú thích.
- source_word: μείζων
  choice: lớn hơn
  rationale: Giữ phạm vi so sánh rộng về địa vị và thẩm quyền, không thu hẹp thành “quan trọng hơn” hay “cao cấp hơn”.
- source_word: κυρίου
  choice: chủ
  rationale: Trong cặp δοῦλος–κύριος, từ này chỉ người chủ có quyền trên nô lệ, không được dùng như tước hiệu thần học “Chúa”.
- source_word: ἐδίωξαν / διώξουσιν
  choice: đã bắt bớ / sẽ bắt bớ
  rationale: Ngữ cảnh nói về sự thù nghịch đối với Đức Giê-su và các môn đệ; “bắt bớ” truyền đạt đúng nghĩa bách hại của διώκω.
- source_word: ἐτήρησαν / τηρήσουσιν
  choice: đã giữ / sẽ giữ
  rationale: '“Giữ lời” là cách nói tự nhiên trong tiếng Việt, đồng thời bảo tồn độ rộng nghĩa của τηρέω trong Giăng: tiếp nhận, tuân theo và sống theo lời ấy.'
- source_word: τὸν λόγον μου ... τὸν ὑμέτερον
  choice: lời tôi ... lời anh em
  rationale: Duy trì phép song song giữa lời của Đức Giê-su và lời các môn đệ công bố; trong vế sau, danh từ “lời” được lặp lại để tiếng Việt rõ nghĩa.
theological_decisions:
- issue: Cách dịch δοῦλος trong phép so sánh về địa vị
  choice: nô lệ
  alternative: đầy tớ; tôi tớ
  rationale: Cặp từ với κύριος nhấn mạnh quan hệ lệ thuộc và sự chênh lệch địa vị. “Nô lệ” giữ nguyên sức nặng ấy, nhưng chú thích nêu cách dịch nhẹ hơn có thể phù hợp trong một số truyền thống tiếng Việt.
- issue: Cách dịch κύριος trong quan hệ với δοῦλος
  choice: chủ
  alternative: chúa; chủ nhân
  rationale: Ở đây κύριος là vế đối ứng xã hội với “nô lệ”, chứ không trực tiếp là tước hiệu “Chúa”; “chủ” vừa chính xác vừa tự nhiên.
- issue: Phạm vi nghĩa của τηρέω đối với “lời”
  choice: giữ lời
  alternative: vâng theo lời; tuân giữ lời
  rationale: “Giữ lời” bảo tồn nét diễn đạt đặc trưng của Giăng và không buộc nghĩa chỉ còn hành vi vâng phục; chú thích giải thích rằng việc vâng theo nằm trong phạm vi nghĩa.
translation_notes:
  register: Bản dịch dùng tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Đại từ “tôi—anh em” phù hợp với lời Đức Giê-su nói cùng một nhóm môn đệ. Nhịp câu và phép song song của nguyên văn được giữ rõ; dấu ngoặc kép phân biệt câu nói được nhắc lại.
