id: JHN.15.2
reference: John 15:2
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: πᾶν κλῆμα ἐν ἐμοὶ μὴ φέρον καρπὸν αἴρει αὐτό, καὶ πᾶν τὸ καρπὸν φέρον καθαίρει αὐτὸ ἵνα ⸂καρπὸν πλείονα⸃ φέρῃ.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/002.yaml
  text: Every branch in me that does not bear fruit[a], he removes; and every branch that bears fruit[b], he prunes so that it may bear more fruit.
translation:
  language: vi
  text: Mọi nhánh ở trong tôi mà không sinh trái thì Ngài cắt bỏ[a]; còn mọi nhánh sinh trái thì Ngài tỉa[b], để nó sinh nhiều trái hơn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “cất đi”; một số người hiểu từ Hy Lạp αἴρει ở đây là “nâng lên”.
    reason: alternative_reading
  - marker: b
    text: Động từ được dịch là “tỉa” cũng có thể có nghĩa là “làm sạch”; cách diễn đạt này vừa hợp với hình ảnh vườn nho, vừa báo trước từ “sạch” ở câu kế tiếp.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶν κλῆμα
  choice: mọi nhánh
  rationale: πᾶν đi với danh từ số ít mang nghĩa phân phối; “mọi nhánh” tự nhiên và giữ được ý xét từng nhánh.
- source_word: ἐν ἐμοὶ
  choice: ở trong tôi
  rationale: Cách dịch trực tiếp bảo toàn ngôn ngữ thần học đặc trưng của Giăng mà không diễn giải thành “gắn với” hay “ở lại trong”.
- source_word: μὴ φέρον καρπὸν
  choice: mà không sinh trái
  rationale: Mệnh đề quan hệ diễn đạt tự nhiên trong tiếng Việt và giữ hình ảnh cây nho sinh trái.
- source_word: αἴρει αὐτό
  choice: Ngài cắt bỏ
  rationale: Trong thế đối lập với việc tỉa nhánh có trái, αἴρει phù hợp nhất với hành động loại bỏ nhánh không trái. “Cất đi” và “nâng lên” được ghi nhận ở chú thích.
- source_word: καὶ πᾶν τὸ καρπὸν φέρον
  choice: còn mọi nhánh sinh trái
  rationale: Bổ sung “nhánh” theo danh từ được hiểu ngầm từ vế trước; “còn” làm rõ cấu trúc tương phản song song.
- source_word: καθαίρει αὐτό
  choice: Ngài tỉa sạch
  rationale: “Tỉa sạch” vừa phù hợp với nghề trồng nho, vừa giữ âm hưởng nghĩa “làm sạch” của καθαίρει và liên hệ từ vựng với “sạch” ở câu kế tiếp.
- source_word: ἵνα καρπὸν πλείονα φέρῃ
  choice: để nó sinh nhiều trái hơn
  rationale: “Để” biểu thị mục đích của ἵνα; “nhiều trái hơn” truyền đạt tự nhiên dạng so sánh πλείονα.
theological_decisions:
- issue: Nghĩa của αἴρει trong vế đầu
  choice: cắt bỏ
  alternative: cất đi; nâng lên
  rationale: Ngữ cảnh trực tiếp đối chiếu cách người trồng nho xử lý nhánh không trái với việc tỉa nhánh có trái; “cắt bỏ” thể hiện rõ hình ảnh ấy mà không xác định hệ quả thần học về sự bội đạo hay sự bảo toàn. Cách hiểu “nâng lên” vẫn được giữ trong chú thích.
- issue: Nghĩa kép của καθαίρει
  choice: tỉa sạch
  alternative: tỉa; làm sạch
  rationale: Cách dịch này giữ cả hành động chăm sóc cây nho lẫn liên hệ ngôn từ với καθαροί (“sạch”) trong câu 3, không buộc người đọc phải chọn riêng một sắc thái.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” để chỉ người trồng nho đã được nhắc trong ngữ cảnh, tránh đại từ thiếu chủ thể tự nhiên trong tiếng Việt. “Nhánh” phù hợp với hình ảnh cây nho; câu giữ cấu trúc song song và sự căng thẳng diễn giải của nguyên văn.
