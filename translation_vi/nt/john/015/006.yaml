  to: Nếu ai không ở lại trong Ta[a], người ấy bị quăng ra ngoài như cành nho và khô héo. Người ta gom những cành ấy lại, quăng vào lửa[b], rồi bị đốt cháy.
  rationale: Sửa “cứ ở” thành “ở lại” để diễn đạt tự nhiên và chính xác hơn sắc thái tiếp tục của μένω. Điều chỉnh mệnh đề cuối để không áp đặt số nhiều lên καίεται số ít, trong khi vẫn duy trì dòng ẩn dụ rõ ràng bằng tiếng Việt. Chú thích b được làm mượt và giữ nguyên tính trung lập đối với tranh luận thần học.
