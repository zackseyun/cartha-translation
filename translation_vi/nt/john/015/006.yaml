id: JHN.15.6
reference: John 15:6
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐὰν μή τις ⸀μένῃ ἐν ἐμοί, ἐβλήθη ἔξω ὡς τὸ κλῆμα καὶ ἐξηράνθη, καὶ συνάγουσιν αὐτὰ καὶ εἰς τὸ πῦρ βάλλουσιν καὶ καίεται.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/006.yaml
  text: If anyone does not remain in me[a], he is thrown out like the branch and dries up; and they gather them and throw them into the fire[b], and they are burned.
translation:
  language: vi
  text: Nếu ai không ở lại trong Ta[a], người ấy bị quăng ra ngoài như cành nho và khô héo. Người ta gom những cành ấy lại, quăng vào lửa[b], rồi bị đốt cháy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “không cứ ở trong Ta.” Động từ Hy Lạp chỉ việc tiếp tục ở, lưu lại hoặc bền đỗ trong một mối liên hệ.'
    reason: lexical_alternative
  - marker: b
    text: Hình ảnh này cảnh báo về việc bị loại bỏ và bị đốt cháy, nhưng riêng câu này không nói rõ đây là việc một môn đồ thật không còn ở trong mối liên hệ ấy hay sự phơi bày một sự gắn bó vốn không thật.
    reason: alternative_reading
lexical_decisions:
- source_word: μένῃ
  choice: cứ ở
  rationale: Diễn đạt sự tiếp tục, bền đỗ trong mối liên hệ; tự nhiên trong tiếng Việt hiện đại và giữ được nét nghĩa chủ đạo của μένω trong Giăng.
- source_word: ἐν ἐμοί
  choice: trong Ta
  rationale: Giữ nguyên hình ảnh quan hệ thần học của cụm giới từ, không diễn giải thành “với Ta” hay “gắn liền với Ta”.
- source_word: ἐβλήθη ἔξω
  choice: bị quăng ra ngoài
  rationale: Giữ thể bị động và sắc thái cụ thể, mạnh của động từ βάλλω; thì quá khứ Hy Lạp được diễn đạt như hệ quả khái quát trong câu điều kiện.
- source_word: ὡς τὸ κλῆμα
  choice: như cành nho
  rationale: κλῆμα trong ngữ cảnh là cành của cây nho; thêm “nho” giúp hình ảnh rõ ràng, tự nhiên mà không diễn giải quá mức.
- source_word: ἐξηράνθη
  choice: khô héo
  rationale: Bao quát ý trở nên khô và héo của cành, đồng thời là cách nói tự nhiên trong tiếng Việt.
- source_word: συνάγουσιν
  choice: người ta gom ... lại
  rationale: Ngôi thứ ba số nhiều không xác định trong tiếng Hy Lạp được chuyển tự nhiên bằng chủ thể phiếm chỉ “người ta”.
- source_word: αὐτὰ
  choice: những cành ấy
  rationale: Làm rõ đại từ trung tính số nhiều chỉ các cành cùng loại, tránh sự mơ hồ của đại từ tiếng Việt.
- source_word: εἰς τὸ πῦρ βάλλουσιν
  choice: quăng vào lửa
  rationale: Giữ hành động mạnh, cụ thể và hình ảnh phán xét của nguyên văn.
- source_word: καίεται
  choice: chúng bị thiêu cháy
  rationale: Diễn đạt kết quả đối với các cành đã được gom; tiếng Việt dùng số nhiều theo quy chiếu ngữ cảnh, còn động từ số ít Hy Lạp có thể nhìn lửa hoặc vật liệu cành như một toàn thể.
- source_word: τις
  choice: ai
  rationale: Đại từ phiếm chỉ tự nhiên nhất trong cấu trúc điều kiện tiếng Việt “nếu ai”.
theological_decisions:
- issue: Lời cảnh báo nói về sự bội đạo của môn đồ thật hay sự phơi bày một sự gắn bó không thật
  choice: Giữ nguyên lời cảnh báo bằng hình ảnh, không xác định tình trạng cứu rỗi trước đó của người được nói đến
  alternative: Diễn giải rõ là người tin thật đánh mất sự cứu rỗi, hoặc là người chưa từng thật sự thuộc về Chúa
  rationale: Câu này nói đến việc không cứ ở trong Chúa, bị loại ra và bị thiêu, nhưng tự nó không giải quyết đầy đủ cuộc tranh luận thần học về địa vị trước đó của người ấy.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ta” trong lời trực tiếp của Chúa Giê-su; “cứ ở trong Ta” giữ sắc thái Giăng và sự căng thẳng thần học của nguyên văn. Hai dấu chú thích [a], [b] đều xuất hiện trong chính văn.
