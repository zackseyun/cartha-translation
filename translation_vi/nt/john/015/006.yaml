review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch nhìn chung bám sát SBLGNT: điều kiện “nếu ai không ở trong Ta”, sự bị quăng ra ngoài, khô héo, bị gom và quăng vào lửa đều được chuyển đạt rõ. Tuy nhiên, “cứ ở” không tự nhiên bằng “ở lại” cho μένῃ trong văn mạch Giăng, và mệnh đề cuối καίεται là hiện tại bị động số ít; tiếng Việt nên giữ hình ảnh cành như một thực thể đại diện: “rồi bị đốt cháy”, thay vì chuyển hẳn sang số nhiều “chúng bị thiêu cháy”.'
  naturalness: “Ở lại trong Ta” là cách nói hiện đại, trôi chảy và phù hợp với lối diễn đạt quen thuộc của tiếng Việt. Tách thành hai câu vẫn tự nhiên. “Người ta gom lại” giữ được chủ ngữ phiếm chỉ của số nhiều Hy Lạp.
  terminology: “Ta” trong lời Đức Chúa Jêsus phù hợp văn phong Kinh Thánh trang trọng. “Cành nho” phù hợp κλῆμα trong ẩn dụ cây nho. Chú thích b giữ đúng tính không quyết đoán về các cách đọc thần học; chỉ cần dùng thuật ngữ tự nhiên hơn là “tình trạng môn đồ thật”.
  issues:
  - severity: low
    issue: “cứ ở trong Ta”
    rationale: Cách này có thể hiểu là ‘thường xuyên ở’, nhưng μένῃ trong Giăng nhấn mạnh sự tiếp tục/lưu lại. “Ở lại trong Ta” vừa tự nhiên vừa sát hơn.
  - severity: low
    issue: “chúng bị thiêu cháy” ở mệnh đề cuối
    rationale: αὐτά ở mệnh đề trước là số nhiều, nhưng καίεται là số ít. Không cần ép thành số nhiều trong tiếng Việt; “rồi bị đốt cháy” có thể quy về hình ảnh cành đại diện và tránh làm phẳng điểm này.
  - severity: low
    issue: Cụm “sự mất đi địa vị môn đồ thật” trong chú thích b
    rationale: Cụm này hơi gượng và dễ hướng người đọc vào một khung phân loại. “Việc một môn đồ thật không còn ở trong mối liên hệ ấy” trung tính và tự nhiên hơn, đồng thời vẫn nêu được cách đọc.
