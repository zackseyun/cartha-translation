source:
  edition: SBLGNT
  text: Ἐγώ εἰμι ἡ ἄμπελος ἡ ἀληθινή, καὶ ὁ πατήρ μου ὁ γεωργός ἐστιν·
base_translation:
  language: en
  yaml_path: translation/nt/john/015/001.yaml
  text: I am the true vine[a], and my Father is the vinegrower.
translation:
  language: vi
  text: “Ta là cây nho thật[a], và Cha ta là người trồng nho.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “người chăm sóc vườn nho.” Từ Hy Lạp γεωργός chỉ người canh tác đất; trong ngữ cảnh cây nho, cách dịch này nêu rõ hơn vai trò chăm sóc cây nho.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγώ εἰμι
  choice: Ta là
  rationale: Đại từ Ἐγώ được nêu rõ tạo sắc thái nhấn mạnh; “Ta là” tự nhiên, trang trọng trong lời Đức Giê-su và không cường điệu thành “chính Ta là”.
- source_word: ἄμπελος
  choice: cây nho
  rationale: “Cây nho” là cách gọi tự nhiên, rõ ràng trong tiếng Việt và giữ nguyên hình ảnh ẩn dụ.
- source_word: ἀληθινή
  choice: thật
  rationale: '“Thật” bảo tồn phạm vi nghĩa của ἀληθινή trong văn chương Giăng: chân thật, đích thực và hoàn toàn tương ứng với thực tại của Đức Chúa Trời, mà không diễn giải quá mức.'
- source_word: ὁ πατήρ μου
  choice: Cha ta
  rationale: “Cha ta” diễn đạt quan hệ trực tiếp của Đức Giê-su với Đức Chúa Trời; viết hoa “Cha” để biểu thị quy chiếu thần học trong ngữ cảnh.
- source_word: ὁ γεωργός
  choice: người trồng nho
  rationale: γεωργός chỉ người canh tác đất; trong ngữ cảnh cụ thể của cây nho, “người trồng nho” vừa dễ hiểu vừa giữ sự nhất quán của hình ảnh.
theological_decisions:
- issue: Sự đồng nhất mang tính ẩn dụ trong lời “Ta là” của Đức Giê-su
  choice: 'Giữ nguyên ẩn dụ: “Ta là cây nho thật”'
  alternative: Ta là cây nho đích thực
  rationale: Bản dịch bảo tồn trực tiếp hình ảnh và chiều sâu thần học của ἀληθινή, không thêm lời giải thích về ý nghĩa biểu tượng.
- issue: Vai trò của Cha trong hình ảnh cây nho
  choice: người trồng nho
  alternative: người chăm sóc vườn nho; người làm vườn
  rationale: Cách dịch này gắn γεωργός với cây nho trong chính câu văn, nhưng không đưa thêm cách hiểu giáo phái hay giáo lý vào bản dịch.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng cặp đại từ “Ta/Cha ta” phù hợp với lời Đức Giê-su trong văn phong Kinh Thánh; câu ngắn gọn và giữ nguyên cấu trúc song song của nguyên văn.
