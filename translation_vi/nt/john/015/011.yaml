id: JHN.15.11
reference: John 15:11
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ταῦτα λελάληκα ὑμῖν ἵνα ἡ χαρὰ ἡ ἐμὴ ἐν ὑμῖν ⸀ᾖ καὶ ἡ χαρὰ ὑμῶν πληρωθῇ.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/011.yaml
  text: I have spoken these things to you so that my joy may be in you[b][a], and your joy may be made full.
translation:
  language: vi
  text: Ta đã nói những điều này với các con để niềm vui của ta ở trong các con[b], và niềm vui của các con được trọn vẹn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “được đầy trọn.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “ở giữa các con.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα
  choice: những điều này
  rationale: Giữ dạng số nhiều của đại từ chỉ định và cách liên kết với phần diễn từ trước.
- source_word: λελάληκα
  choice: đã nói
  rationale: Diễn đạt tự nhiên thì hoàn thành của động từ nói năng, cho thấy lời đã được nói và vẫn có hiệu lực trong ngữ cảnh.
- source_word: ὑμῖν
  choice: với các con
  rationale: Giữ rõ số nhiều của đại từ ngôi thứ hai; cách xưng hô phù hợp với lời Đức Giê-su nói cùng các môn đồ trong văn phong trang trọng, dễ hiểu.
- source_word: ἵνα
  choice: để
  rationale: Diễn đạt tự nhiên ý mục đích của mệnh đề.
- source_word: ἡ χαρὰ ἡ ἐμὴ
  choice: niềm vui của ta
  rationale: Giữ nguyên quan hệ sở hữu và không giải thích thêm đó là niềm vui Đức Giê-su ban hay niềm vui phát sinh từ sự hiệp nhất với ngài.
- source_word: ἐν ὑμῖν
  choice: ở trong các con
  rationale: Giữ nghĩa không gian/nội tại chính của ἐν, đồng thời ghi nhận nghĩa 'ở giữa' trong chú thích vì giới từ có thể mang cả hai sắc thái.
- source_word: ᾖ
  choice: ở
  rationale: Kết hợp tự nhiên với 'ở trong' trong mệnh đề mục đích; sắc thái giả định được thể hiện qua cấu trúc với 'để'.
- source_word: καὶ
  choice: và
  rationale: Giữ quan hệ liên kết đơn giản giữa hai vế.
- source_word: ἡ χαρὰ ὑμῶν
  choice: niềm vui của các con
  rationale: Giữ cấu trúc sở hữu và sự đối chiếu với 'niềm vui của ta'.
- source_word: πληρωθῇ
  choice: được đầy trọn
  rationale: Giữ thể bị động cùng hình ảnh về sự đầy đủ, viên mãn; phương án tự nhiên hơn 'được trọn vẹn' được nêu trong chú thích.
theological_decisions:
- issue: Bản chất của “niềm vui của ta”
  choice: Giữ nguyên “niềm vui của ta” mà không diễn giải thêm.
  alternative: “niềm vui ta ban” hoặc “niềm vui về ta”
  rationale: Bản Hy Lạp chỉ nêu quan hệ sở hữu; cách dịch không thu hẹp ý nghĩa vào một cách giải thích thần học duy nhất.
- issue: Sắc thái của ἐν ὑμῖν
  choice: “ở trong các con”
  alternative: “ở giữa các con”
  rationale: Cách dịch chính bảo toàn khả năng chỉ sự hiện diện nội tại, còn chú thích giữ khả năng chỉ sự hiện diện giữa cộng đồng môn đồ.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng cặp xưng hô “ta/các con” cho lời Đức Giê-su nói với nhóm môn đồ, đồng thời biểu thị rõ ngôi thứ hai số nhiều. Cấu trúc câu bám sát hai vế mục đích của bản Hy Lạp nhưng lược dấu phẩy trước “để” cho tự nhiên trong tiếng Việt.
