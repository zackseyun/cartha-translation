  to: Ta đã nói những điều này với các con để niềm vui của ta ở trong các con[b], và niềm vui của các con được trọn vẹn.[a]
  rationale: Chỉ thay đổi cách diễn đạt của πληρωθῇ để câu tiếng Việt tự nhiên hơn, không thay đổi quan hệ bị động hay ý niệm niềm vui đạt đến sự đầy đủ/trọn vẹn. Các lựa chọn khác giữ nguyên vì trung thành với văn bản gốc và không áp đặt cách hiểu thần học.
