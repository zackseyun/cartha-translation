source:
  edition: SBLGNT
  text: ἐὰν μείνητε ἐν ἐμοὶ καὶ τὰ ῥήματά μου ἐν ὑμῖν μείνῃ, ὃ ἐὰν θέλητε ⸀αἰτήσασθε καὶ γενήσεται ὑμῖν·
base_translation:
  language: en
  yaml_path: translation/nt/john/015/007.yaml
  text: If you remain in me and my words remain in you[a], ask whatever you want[b], and it will be done for you.
translation:
  language: vi
  text: Nếu các con ở lại trong Thầy, và lời Thầy ở lại trong các con,[a] thì hãy xin bất cứ điều gì các con muốn,[b] và điều ấy sẽ được thực hiện cho các con.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “cứ ở trong Thầy ... lời Thầy cứ ở trong các con.”'
    reason: lexical_alternative
  - marker: b
    text: 'Hay: “bất cứ điều gì các con ước muốn.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: μείνητε / μείνῃ (μένω)
  choice: cứ ở
  rationale: “Cứ ở” diễn đạt sự tiếp tục, bền đỗ trong một mối liên hệ bằng tiếng Việt hiện đại, đồng thời giữ cùng một cách dịch cho cả hai lần xuất hiện của μένω.
- source_word: ἐν ἐμοὶ
  choice: ở trong thầy
  rationale: Giữ giới từ “trong” để bảo tồn ngôn ngữ về sự kết hợp và mối liên hệ đặc trưng của Giăng, thay vì làm nhẹ thành “ở với thầy”.
- source_word: τὰ ῥήματά μου
  choice: lời thầy
  rationale: “Lời thầy” là cách diễn đạt trực tiếp, tự nhiên cho các lời phán của Chúa Giê-su và phù hợp với cách dùng “lời” như danh từ tập hợp trong tiếng Việt.
- source_word: ὃ ἐὰν θέλητε
  choice: bất cứ điều gì các con muốn
  rationale: Cách dịch này giữ phạm vi mở, không xác định của kết cấu Hy Lạp và tự nhiên trong tiếng Việt hiện đại.
- source_word: αἰτήσασθε
  choice: hãy xin
  rationale: “Xin” diễn đạt trực tiếp mệnh lệnh đưa ra lời cầu xin; thêm “hãy” làm rõ sắc thái mệnh lệnh của động từ Hy Lạp.
- source_word: γενήσεται ὑμῖν
  choice: điều ấy sẽ được thực hiện cho các con
  rationale: Trong ngữ cảnh lời cầu xin được đáp lại, cách dịch này truyền đạt kết quả sẽ xảy đến cho người xin mà không xác định tác nhân vốn không được nêu trong câu Hy Lạp.
theological_decisions:
- issue: Cấu trúc điều kiện và lời hứa liên quan đến việc cầu xin
  choice: 'Giữ rõ điều kiện: các môn đồ cứ ở trong Chúa Giê-su và lời ngài cứ ở trong họ; lời hứa về sự cầu xin nằm trong khuôn khổ ấy.'
  alternative: Diễn đạt tự do khiến lời hứa có vẻ vô điều kiện.
  rationale: Mệnh đề với ἐὰν đặt lời hứa dưới một điều kiện rõ ràng. Bản dịch bảo tồn cấu trúc và sức căng thần học này, không mở rộng lời hứa vượt quá điều kiện được nêu.
- issue: Cách xưng hô của Chúa Giê-su với các môn đồ
  choice: “thầy / các con”
  alternative: “ta / các ngươi” hoặc “tôi / anh em”
  rationale: “Thầy / các con” phù hợp quan hệ thầy–môn đồ trong ngữ cảnh, trang trọng mà vẫn dễ hiểu; đây là lựa chọn ngữ vực, không nhằm thêm một lập trường thần học.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Giữ phép lặp của μένω bằng “cứ ở” ở cả hai vế, giữ “trong” cho ἐν, và dùng cặp xưng hô “thầy / các con” theo bối cảnh Chúa Giê-su dạy các môn đồ.
