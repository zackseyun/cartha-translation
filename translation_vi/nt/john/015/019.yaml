id: JHN.15.19
reference: John 15:19
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἰ ἐκ τοῦ κόσμου ἦτε, ὁ κόσμος ἂν τὸ ἴδιον ἐφίλει· ὅτι δὲ ἐκ τοῦ κόσμου οὐκ ἐστέ, ἀλλ’ ἐγὼ ἐξελεξάμην ὑμᾶς ἐκ τοῦ κόσμου, διὰ τοῦτο μισεῖ ὑμᾶς ὁ κόσμος.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/019.yaml
  text: If you were from the world[a], the world would love its own. But because you are not from the world, but I chose you out of the world, for this reason the world hates you.
translation:
  language: vi
  text: Nếu anh em thuộc về thế gian[a], thế gian hẳn sẽ yêu những gì thuộc về mình. Nhưng vì anh em không thuộc về thế gian, trái lại, chính tôi đã chọn anh em ra khỏi thế gian, nên thế gian ghét anh em.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “từ thế gian”; cụm Hy Lạp ἐκ τοῦ κόσμου có thể chỉ nguồn gốc hoặc sự thuộc về. Trong chính văn, “thuộc về thế gian” diễn đạt tự nhiên ý nghĩa trong ngữ cảnh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ τοῦ κόσμου
  choice: thuộc về thế gian / ra khỏi thế gian
  rationale: Trong hai mệnh đề đầu, “thuộc về thế gian” diễn đạt tự nhiên sắc thái nguồn gốc hay sự thuộc về của ἐκ; đi với động từ “chọn”, “ra khỏi thế gian” làm rõ sắc thái tách ra. Chú thích giữ lại khả năng dịch sát hơn là “từ thế gian”.
- source_word: κόσμος
  choice: thế gian
  rationale: “Thế gian” là cách gọi quen thuộc, trang trọng và đủ rộng cho κόσμος trong văn mạch Giăng, không thu hẹp thành một hệ thống xã hội cụ thể.
- source_word: ἂν ... ἐφίλει
  choice: hẳn sẽ yêu
  rationale: Cụm này diễn tả kết quả trái với thực tế; “hẳn sẽ yêu” vừa tự nhiên vừa giữ rõ tính giả định.
- source_word: τὸ ἴδιον
  choice: người thuộc về mình
  rationale: Trong ngữ cảnh nói về các môn đồ, cách diễn đạt này tự nhiên hơn “cái thuộc về mình”, nhưng không thêm một nhóm người cụ thể ngoài ý sở thuộc của nguyên văn.
- source_word: φιλέω
  choice: yêu
  rationale: “Yêu” giữ được sự đối lập trực tiếp với μισέω, không áp đặt một phân biệt từ vựng quá mức giữa các động từ chỉ tình yêu.
- source_word: ὅτι δὲ ... ἀλλά
  choice: Nhưng vì ... trái lại
  rationale: Cách dịch này bảo toàn cả quan hệ nguyên nhân lẫn sự tương phản mạnh trong câu Hy Lạp.
- source_word: ἐγὼ ἐξελεξάμην ὑμᾶς
  choice: chính tôi đã chọn anh em
  rationale: Đại từ ἐγώ được nêu rõ để nhấn mạnh chủ thể; “đã chọn” phản ánh động từ aorist mà không đưa thêm một hệ thống thần học về sự tuyển chọn.
- source_word: διὰ τοῦτο
  choice: nên
  rationale: “Nên” diễn đạt tự nhiên quan hệ nhân quả trực tiếp trong tiếng Việt; nguyên nhân đã được nêu đầy đủ ở mệnh đề trước.
- source_word: μισεῖ
  choice: ghét
  rationale: “Ghét” giữ nguyên sức mạnh của μισέω và diễn đạt tự nhiên thì hiện tại.
theological_decisions:
- issue: Ý nghĩa của “thế gian” trong văn mạch Giăng
  choice: Giữ “thế gian” trong chính văn, không diễn giải mở rộng.
  alternative: hệ thống thế gian; xã hội loài người chống nghịch Đức Chúa Trời
  rationale: Từ này mang chiều kích đạo đức và thần học trong Giăng nhưng vẫn có độ rộng và tính đa nghĩa; diễn giải ngay trong chính văn sẽ thu hẹp ý.
- issue: Hàm ý thần học của ἐξελεξάμην
  choice: Dịch thẳng là “chính tôi đã chọn anh em ra khỏi thế gian”.
  alternative: Diễn đạt bằng thuật ngữ gắn với một học thuyết tiền định hay tuyển chọn cụ thể.
  rationale: Câu xác nhận hành động lựa chọn của Chúa Giê-su nhưng không tự nó giải quyết các tranh luận thần học về sự tuyển chọn.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “anh em” cho đại từ số nhiều chỉ các môn đồ; giữ nhịp tương phản và sự lặp lại “thế gian” của nguyên văn.
