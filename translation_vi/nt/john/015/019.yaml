revisions:
- from: Nếu anh em thuộc về thế gian[a], thế gian hẳn sẽ yêu người thuộc về mình. Nhưng vì anh em không thuộc về thế gian, trái lại, chính tôi đã chọn anh em ra khỏi thế gian, nên thế gian ghét anh em.
  to: Nếu anh em thuộc về thế gian[a], thế gian hẳn sẽ yêu những gì thuộc về mình. Nhưng vì anh em không thuộc về thế gian, trái lại, chính tôi đã chọn anh em ra khỏi thế gian, nên thế gian ghét anh em.
  rationale: Chỉ sửa chỗ quy chiếu của τὸ ἴδιον để không thêm giới hạn “người” vào danh từ trung tính của nguyên văn, đồng thời chỉnh chú thích cho rõ và đúng đơn vị từ vựng được giải thích. Các lựa chọn “thuộc về thế gian” ở hai lần đầu và “ra khỏi thế gian” sau động từ “chọn” vẫn phản ánh hợp lý sắc thái của ἐκ trong tiếng Việt tự nhiên.
