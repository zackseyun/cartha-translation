    rationale: Trích dẫn “Nếu anh em từ thế gian mà ra” không phải là một phương án tương ứng gọn và hoàn chỉnh cho cụm ἐκ τοῦ κόσμου. Nên ghi đơn giản rằng cụm này cũng có thể dịch là “từ thế gian”, rồi giải thích sắc thái.
