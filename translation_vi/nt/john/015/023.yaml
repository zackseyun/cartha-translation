id: JHN.15.23
reference: John 15:23
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ ἐμὲ μισῶν καὶ τὸν πατέρα μου μισεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/023.yaml
  text: The one who hates me also hates my Father.
translation:
  language: vi
  text: Ai ghét tôi thì cũng ghét Cha tôi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ... μισῶν
  choice: Ai ghét
  rationale: Mạo từ đi với phân từ hiện tại tạo thành cách gọi một người theo đặc điểm hành động. “Ai ghét” là cách diễn đạt tự nhiên trong tiếng Việt, giữ được ý khái quát mà không nặng nề như “người đang ghét”.
- source_word: ἐμὲ
  choice: tôi
  rationale: Đại từ ngôi thứ nhất làm tân ngữ. “Tôi” phù hợp với lời trực tiếp của Chúa Giê-su trong văn phong tiếng Việt hiện đại và trang trọng.
- source_word: μισῶν / μισεῖ
  choice: ghét / ghét
  rationale: Động từ μισέω mang nghĩa ghét. Lặp lại cùng một từ “ghét” bảo toàn sự lặp từ có chủ ý trong tiếng Hy Lạp; thì hiện tại ở đây diễn tả một sự thật khái quát.
- source_word: καὶ
  choice: thì cũng
  rationale: Trong cấu trúc tiếng Việt “Ai... thì cũng...”, cách dịch này diễn đạt tự nhiên mối liên hệ rằng ghét Chúa Giê-su đồng thời là ghét Cha ngài, tương ứng với lực bổ sung của καί.
- source_word: τὸν πατέρα μου
  choice: Cha tôi
  rationale: πατέρα với μου được dịch tự nhiên là “Cha tôi”. Viết hoa “Cha” cho thấy đây là danh xưng chỉ Đức Chúa Trời trong mối quan hệ với Chúa Giê-su.
theological_decisions:
- issue: Viết hoa danh xưng “Cha” khi chỉ Đức Chúa Trời
  choice: Cha tôi
  alternative: cha tôi
  rationale: Trong Tin Mừng Giăng, Chúa Giê-su dùng “Cha tôi” để chỉ Đức Chúa Trời và mối quan hệ đặc biệt của ngài với Đức Chúa Trời. Viết hoa giúp nhận rõ đối tượng được nói đến mà không bổ sung một cách giải nghĩa giáo phái.
translation_notes:
  register: Câu dịch ngắn gọn, trang trọng và tự nhiên trong tiếng Việt hiện đại. Cấu trúc “Ai... thì cũng...” giữ tính khái quát của nguyên văn và làm rõ liên kết giữa hai vế; không cần chú thích.
