id: JHN.15.18
reference: John 15:18
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Εἰ ὁ κόσμος ὑμᾶς μισεῖ, γινώσκετε ὅτι ἐμὲ πρῶτον ⸀ὑμῶν μεμίσηκεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/018.yaml
  text: If the world hates you[a], know that it has hated me before you.
translation:
  language: vi
  text: Nếu thế gian ghét anh em, hãy biết rằng thế gian đã ghét Thầy trước khi ghét anh em.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch sát hơn: “thế gian đã ghét Thầy trước anh em.” Tiếng Hy Lạp dùng “trước” với “anh em” để diễn tả sự ưu tiên về thời gian.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κόσμος
  choice: thế gian
  rationale: Trong Tin Mừng Giăng, từ này thường chỉ thế giới loài người, đặc biệt khi ở trong sự chống đối Đức Chúa Trời; “thế gian” giữ được chiều rộng và sắc thái thần học ấy mà không diễn giải quá mức.
- source_word: μισεῖ
  choice: ghét
  rationale: Thì hiện tại diễn tả một thực tại chung hoặc đang có hiệu lực; “ghét” là cách diễn đạt tự nhiên và trực tiếp trong tiếng Việt.
- source_word: γινώσκετε
  choice: hãy biết
  rationale: Hình thức Hy Lạp có thể được hiểu là trực thuyết hoặc mệnh lệnh, nhưng trong mạch văn, lời khuyên nhủ “hãy biết” phù hợp hơn và vẫn bảo tồn sắc thái thúc giục.
- source_word: μεμίσηκεν
  choice: đã ghét
  rationale: Thì hoàn thành Hy Lạp nói đến hành động đã xảy ra và còn liên hệ đến hiện tại. Tiếng Việt tự nhiên dùng “đã ghét”; ngữ cảnh cho thấy sự thù ghét ấy vẫn có ý nghĩa hiện thời.
- source_word: πρῶτον ὑμῶν
  choice: trước khi ghét anh em
  rationale: Cụm từ diễn tả sự ưu tiên về thời gian. Việc lặp lại “ghét” làm cho câu tiếng Việt rõ nghĩa, trong khi chú thích ghi nhận cách diễn đạt sát cấu trúc Hy Lạp hơn.
- source_word: ἐμέ
  choice: Thầy
  rationale: Trong ngữ cảnh Đức Chúa Jêsus nói với các môn đồ, “Thầy” là đại từ tự xưng tự nhiên, trang trọng và thể hiện quan hệ đã có trong diễn ngôn; chữ Hy Lạp tự nó chỉ có nghĩa là “tôi/ta”.
theological_decisions:
- issue: Ý nghĩa của κόσμος trong thần học Tin Mừng Giăng
  choice: Giữ “thế gian” trong chính văn, không khai triển thành một hệ thống chống nghịch Đức Chúa Trời.
  alternative: thế gian chống nghịch Đức Chúa Trời; hệ thống thế gian
  rationale: Ngữ cảnh mang sắc thái chống đối Đức Chúa Jêsus và các môn đồ, nhưng câu không định nghĩa đầy đủ “thế gian”. Cách dịch rộng hơn bảo tồn sự căng thẳng thần học mà không áp đặt lời giải thích.
- issue: Tính mơ hồ về thức của γινώσκετε
  choice: 'Dịch theo nghĩa mệnh lệnh: “hãy biết”.'
  alternative: 'Dịch theo nghĩa trực thuyết: “anh em biết”.'
  rationale: Cả hai cách phân tích đều khả dĩ về hình thái, nhưng câu điều kiện và dòng lập luận tự nhiên hơn khi hiểu đây là lời Đức Chúa Jêsus nhắc nhở các môn đồ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” cho đại từ số nhiều ὑμᾶς/ὑμῶν và “Thầy” cho lời tự xưng của Đức Chúa Jêsus trong quan hệ với các môn đồ. Lặp lại “thế gian” thay cho đại từ “nó” để câu rõ ràng và tự nhiên hơn trong tiếng Việt.
