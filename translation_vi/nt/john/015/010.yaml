id: JHN.15.10
reference: John 15:10
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐὰν τὰς ἐντολάς μου τηρήσητε, μενεῖτε ἐν τῇ ἀγάπῃ μου, καθὼς ἐγὼ ⸂τὰς ἐντολὰς τοῦ πατρός μου⸃ τετήρηκα καὶ μένω αὐτοῦ ἐν τῇ ἀγάπῃ.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/010.yaml
  text: If you keep my commandments, you will remain in my love, just as I have kept my Father's commandments and remain in his love.
translation:
  language: vi
  text: Nếu các con vâng giữ các điều răn của Thầy, các con sẽ ở lại trong tình yêu của Thầy, cũng như Thầy đã vâng giữ các điều răn của Cha Thầy và ở lại trong tình yêu của Ngài.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐὰν
  choice: Nếu
  rationale: Diễn đạt tự nhiên mệnh đề điều kiện đi với lối giả định, không thêm sắc thái lặp lại.
- source_word: ἐντολάς
  choice: các điều răn
  rationale: Giữ được sức nặng của những mệnh lệnh có thẩm quyền và phù hợp với cách dùng trong văn chương Giăng.
- source_word: τηρήσητε / τετήρηκα
  choice: vâng giữ / đã vâng giữ
  rationale: “Vâng giữ” vừa diễn tả sự tuân theo vừa gợi ý trung thành thực hành; việc lặp lại cùng một từ bảo toàn mối liên kết từ vựng. “Đã vâng giữ” truyền đạt thể hoàn thành của τετήρηκα trong tiếng Việt tự nhiên.
- source_word: μενεῖτε / μένω
  choice: sẽ ở lại / ở lại
  rationale: Bảo toàn từ khóa lặp lại của Giăng và hình ảnh tiếp tục ở trong một mối tương quan; “ở lại” rõ ràng, tự nhiên hơn “lưu lại” trong ngữ cảnh này.
- source_word: ἐν τῇ ἀγάπῃ μου / αὐτοῦ ἐν τῇ ἀγάπῃ
  choice: trong tình yêu của Thầy / trong tình yêu của Ngài
  rationale: Giữ nguyên hình ảnh về một phạm vi tương quan, thay vì diễn giải thành việc tiếp tục được yêu.
- source_word: καθὼς
  choice: cũng như
  rationale: Đánh dấu rõ sự tương ứng giữa môn đồ với Đức Giê-su mà không nhấn mạnh quá mức.
- source_word: τοῦ πατρός μου
  choice: của Cha Thầy
  rationale: “Cha” là cách xưng gọi tự nhiên trong lời Đức Giê-su; “Cha Thầy” giữ quan hệ sở hữu và giúp xác định rõ đại từ tiếp theo.
- source_word: αὐτοῦ
  choice: Ngài
  rationale: Chỉ về Cha và là đại từ tôn kính tự nhiên trong văn phong Kinh Thánh tiếng Việt.
theological_decisions:
- issue: Mối quan hệ giữa việc vâng giữ điều răn và ở lại trong tình yêu của Đức Giê-su
  choice: Dịch thẳng như một quan hệ điều kiện có thực.
  alternative: Diễn giải sự vâng phục là công trạng để được yêu, hoặc chỉ là dấu hiệu bên ngoài không mang sức nặng điều kiện.
  rationale: Câu Hy Lạp nêu điều kiện và đối chiếu với chính Đức Giê-su, nhưng không giải quyết các tranh luận rộng hơn về công trạng, sự cứu rỗi hay sự bền đỗ.
- issue: Ý nghĩa của ἀγάπη
  choice: tình yêu
  alternative: đức mến
  rationale: “Tình yêu” là cách diễn đạt hiện đại, phổ thông, và bảo toàn sự lặp lại trong hai vế.
- issue: Cách xưng hô của Đức Giê-su với các môn đồ
  choice: Thầy – các con
  alternative: Ta – các ngươi; tôi – anh em
  rationale: Ngữ cảnh diễn từ từ biệt là lời của Thầy dành cho các môn đồ; cách xưng hô này tự nhiên, trang trọng và thể hiện quan hệ ấy mà không thêm nội dung giáo lý.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ cấu trúc song song, từ khóa “ở lại” và hình ảnh “trong tình yêu”. Không cần chú thích văn bản vì biến thể được đánh dấu trong SBLGNT không làm thay đổi nội dung cần thể hiện trong bản dịch này.
