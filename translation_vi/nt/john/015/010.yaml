  source_fidelity: 'Bản dịch bảo toàn đúng cấu trúc điều kiện của ἐὰν với động từ ở thể giả định: “Nếu ... sẽ ...”. “Vâng giữ” phản ánh nhất quán τηρήσητε và τετήρηκα, còn “ở lại” giữ được sự lặp lại có chủ ý của μένω. Thì hoàn thành τετήρηκα được diễn đạt phù hợp bằng “đã vâng giữ”; quan hệ so sánh καθὼς được chuyển rõ bằng “cũng như”. Không thêm diễn giải giáo lý về công trạng hay sự bảo đảm cứu rỗi.'
