id: JHN.15.16
reference: John 15:16
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οὐχ ὑμεῖς με ἐξελέξασθε, ἀλλ’ ἐγὼ ἐξελεξάμην ὑμᾶς, καὶ ἔθηκα ὑμᾶς ἵνα ὑμεῖς ὑπάγητε καὶ καρπὸν φέρητε καὶ ὁ καρπὸς ὑμῶν μένῃ, ἵνα ὅ τι ἂν αἰτήσητε τὸν πατέρα ἐν τῷ ὀνόματί μου δῷ ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/016.yaml
  text: You did not choose me[a], but I chose you and appointed you so that you should go and bear fruit, and that your fruit should remain, so that whatever you ask the Father in my name[c][b], he may give you.
translation:
  language: vi
  text: Không phải các con đã chọn Thầy[a], nhưng chính Thầy đã chọn các con và đã chỉ định các con để các con ra đi và sinh hoa quả, để hoa quả của các con còn mãi[b], hầu cho bất cứ điều gì các con cầu xin Cha[c] nhân danh Thầy, Cha ban cho các con.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “đã tuyển chọn”; ở đây “chọn” phù hợp với ngữ cảnh trực tiếp và không biến động từ này thành một thuật ngữ thần học chuyên biệt.
    reason: lexical_alternative
  - marker: b
    text: Từ Hy Lạp cũng có thể dịch là “ở lại,” “bền vững” hoặc “tiếp tục tồn tại”; đây là động từ thường được dùng trong sách Giăng với nghĩa ở lại, tiếp tục hay tồn tại lâu dài.
    reason: lexical_alternative
  - marker: c
    text: Nguyên văn Hy Lạp là “Cha,” không phải “Cha của Thầy.”
    reason: textual_clarification
lexical_decisions:
- source_word: ἐξελέξασθε / ἐξελεξάμην
  choice: đã chọn
  rationale: “Chọn” diễn đạt tự nhiên động từ ἐκλέγομαι và giữ rõ sự tương phản về chủ thể, không đưa thuật ngữ thần học hệ thống vào chính văn.
- source_word: ἔθηκα
  choice: lập
  rationale: Trong ngữ cảnh giao phó mục đích cho các môn đồ, “lập” truyền đạt ý đặt để hay chỉ định, nhưng không thu hẹp thành việc phong chức cho một chức vụ giáo hội.
- source_word: ἵνα
  choice: để / hầu cho
  rationale: Hai cách diễn đạt này làm rõ quan hệ mục đích của hai mệnh đề ἵνα, đồng thời tạo câu tiếng Việt tự nhiên.
- source_word: ὑπάγητε
  choice: ra đi
  rationale: “Ra đi” giữ ý chuyển động và sắc thái được sai phái có thể có trong ngữ cảnh, mà không diễn giải quá mức địa điểm hay phạm vi sứ mạng.
- source_word: καρπὸν φέρητε
  choice: kết quả
  rationale: Động từ “kết quả” giữ nguyên hình ảnh sinh trái của nguyên văn và là cách nói trang trọng, quen thuộc trong tiếng Việt Kinh Thánh.
- source_word: μένῃ
  choice: còn lại
  rationale: “Còn lại” phản ánh nghĩa căn bản của μένω, đồng thời để ngỏ sắc thái tiếp tục tồn tại hay bền lâu.
- source_word: ὅ τι ἂν αἰτήσητε
  choice: bất cứ điều gì các con cầu xin
  rationale: “Bất cứ điều gì” thể hiện tính bất định rộng của ὅ τι ἄν; “cầu xin” phù hợp với ngữ cảnh hướng lời xin đến Cha.
- source_word: ἐν τῷ ὀνόματί μου
  choice: nhân danh Thầy
  rationale: Đây là cách diễn đạt tự nhiên và đã ổn định trong tiếng Việt, giữ nguyên sức nặng thần học và quan hệ của cụm từ mà không giải nghĩa thay cho độc giả.
- source_word: δῷ
  choice: Ngài ban
  rationale: Tiếng Việt không cần một trợ động từ tương đương máy móc với thức giả định; trong cấu trúc “hầu cho,” “ban” vẫn giữ quan hệ mục đích/kết quả và không biến mệnh đề thành một lời hứa tương lai đứng riêng.
- source_word: τὸν πατέρα
  choice: Cha
  rationale: “Cha” có mạo từ trong tiếng Hy Lạp nhưng không có đại từ sở hữu; bản dịch không thêm “Cha của Thầy.”
theological_decisions:
- issue: Khả năng đọc ἐξελεξάμην như thuật ngữ chuyên môn về sự tuyển chọn
  choice: Dịch là “Thầy đã chọn các con” trong ngữ cảnh môn đồ và sứ mạng.
  alternative: Dịch bằng một thuật ngữ chuyên biệt như “tuyển chọn” để nhấn mạnh giáo lý tuyển chọn.
  rationale: Câu nhấn mạnh sáng kiến của Đức Giê-su, nhưng động từ tự nó có nghĩa là chọn; bản dịch không nên áp đặt một hệ thống thần học hậu kỳ.
- issue: Ý nghĩa của ἔθηκα ὑμᾶς
  choice: Hiểu là lập hay chỉ định các môn đồ cho việc ra đi và kết quả.
  alternative: Hiểu theo nghĩa đen “đặt các con,” hoặc thu hẹp thành phong chức vào một chức vụ.
  rationale: 'Ngữ cảnh nêu rõ mục đích của việc lập: ra đi, kết quả và cầu xin nhân danh Đức Giê-su; không có cơ sở để giới hạn vào một nghi thức phong chức.'
- issue: Lực của mệnh đề ἵνα cuối câu
  choice: 'Giữ là mệnh đề mục đích/kết quả: “hầu cho... Ngài ban cho các con.”'
  alternative: 'Diễn đạt thành lời bảo đảm tương lai độc lập: “Ngài sẽ ban cho các con.”'
  rationale: Thức giả định δῷ nằm dưới ἵνα và liên kết lời cầu xin với việc được lập và kết quả; cách dịch được chọn bảo toàn mối liên hệ cú pháp ấy.
- issue: Cách xưng hô của Đức Giê-su với các môn đồ
  choice: Dùng “Thầy—các con.”
  alternative: Dùng “Ta—các ngươi” hoặc “tôi—anh em.”
  rationale: “Thầy—các con” tự nhiên trong diễn ngôn thầy trò của bối cảnh này, trang trọng mà vẫn dễ hiểu; lựa chọn chỉ phục vụ ngữ vực, không hàm ý một lập trường giáo phái.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng cặp xưng hô “Thầy—các con” phù hợp với lời Đức Giê-su nói cùng các môn đồ. Giữ phép ẩn dụ sinh trái bằng “kết quả,” và dùng “hầu cho” ở mệnh đề cuối để làm rõ quan hệ mục đích/kết quả.
