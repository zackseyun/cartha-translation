  source_fidelity: Bản nháp giữ đúng tương phản “các con—Thầy,” hai mệnh đề mục đích, và không thêm “Cha của Thầy.” Tuy nhiên, “lập các con” có thể gợi một việc thiết lập chức vụ hơn là sự chỉ định/giao phó trong ngữ cảnh; “kết quả” không rõ bằng cách giữ hình ảnh καρπός là “hoa quả.”
  naturalness: Câu sửa dùng “chỉ định,” “sinh hoa quả,” và trật tự “cầu xin Cha nhân danh Thầy” tự nhiên, rõ quan hệ cú pháp hơn. “Hầu cho” giữ sắc thái mục đích/kết quả của mệnh đề ἵνα cuối mà không biến nó thành một lời hứa tương lai độc lập.
  terminology: Giữ “chọn,” “Thầy—các con,” “nhân danh Thầy,” và “Cha.” “Sinh hoa quả” bảo toàn ẩn dụ Giăng cách tự nhiên trong tiếng Việt hiện đại; không áp đặt ý nghĩa phong chức hay thuật ngữ tuyển chọn chuyên biệt.
