    rationale: Cụm này có thể được đọc theo nghĩa trừu tượng là đạt kết quả và làm mờ hình ảnh “mang/sinh trái.” “Sinh hoa quả” bảo toàn phép ẩn dụ của nguyên văn và vẫn là cách nói tự nhiên, trang trọng.
  - severity: low
