id: JHN.15.8
reference: John 15:8
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐν τούτῳ ἐδοξάσθη ὁ πατήρ μου ἵνα καρπὸν πολὺν φέρητε καὶ ⸀γένησθε ἐμοὶ μαθηταί.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/008.yaml
  text: 'In this my Father is glorified: that you bear much fruit and become my disciples.'
translation:
  language: vi
  text: Điều làm Cha tôi được tôn vinh là anh em sinh nhiều trái và trở nên môn đồ của tôi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: Điều ... là
  rationale: Diễn đạt tự nhiên trong tiếng Việt quan hệ chỉ phương diện/căn cứ của cụm Hy Lạp, đồng thời để mệnh đề ἵνα phía sau xác định nội dung khiến Cha được tôn vinh.
- source_word: ἐδοξάσθη
  choice: được tôn vinh
  rationale: Giữ thể bị động aorist của δοξάζω; trong ngữ cảnh, sự sinh nhiều trái của các môn đồ biểu lộ và đem lại sự tôn vinh cho Cha.
- source_word: καρπὸν πολὺν φέρητε
  choice: anh em sinh nhiều trái
  rationale: Giữ hình ảnh cây nho xuyên suốt ngữ cảnh; “sinh trái” là cách nói tự nhiên và dễ hiểu hơn “mang trái” trong tiếng Việt.
- source_word: γένησθε ἐμοὶ μαθηταί
  choice: trở nên môn đồ của tôi
  rationale: Phản ánh γένησθε theo văn bản SBLGNT và giữ sức căng của ý “trở nên”, thay vì đổi thành “chứng tỏ là”; ἐμοὶ được diễn đạt bằng quan hệ sở thuộc tự nhiên “của tôi”.
theological_decisions:
- issue: Quan hệ giữa việc sinh nhiều trái và tư cách môn đồ
  choice: trở nên môn đồ của tôi
  alternative: chứng tỏ mình là môn đồ của tôi
  rationale: Chọn nghĩa trực tiếp của γένησθε và không diễn giải câu theo hướng chỉ nói đến bằng chứng bề ngoài của một tư cách đã có sẵn.
- issue: Chức năng của ἵνα
  choice: diễn đạt nội dung qua cấu trúc “Điều ... là”
  alternative: “để anh em...” theo nghĩa mục đích/kết quả
  rationale: Trong cấu trúc này, ἵνα có thể mang sắc thái nội dung, kết quả hoặc mục đích. Bản dịch nêu nội dung mà không ép câu vào một quan hệ thần học quá hẹp.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Cha tôi”, “anh em”, “môn đồ” để phù hợp văn mạch Tin Mừng; giữ ẩn dụ “sinh nhiều trái”.
