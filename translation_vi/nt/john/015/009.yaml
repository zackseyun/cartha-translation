id: JHN.15.9
reference: John 15:9
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καθὼς ἠγάπησέν με ὁ πατήρ, κἀγὼ ⸂ὑμᾶς ἠγάπησα⸃, μείνατε ἐν τῇ ἀγάπῃ τῇ ἐμῇ.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/009.yaml
  text: Just as the Father has loved me[a], I also have loved you; remain in my love.
translation:
  language: vi
  text: Như Cha đã yêu thương tôi, tôi cũng đã yêu thương anh em; hãy ở lại trong tình yêu của tôi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθὼς
  choice: Như
  rationale: Diễn đạt tự nhiên quan hệ so sánh giữa tình yêu của Cha dành cho Đức Giê-su và tình yêu của Đức Giê-su dành cho các môn đệ.
- source_word: ἠγάπησέν με ὁ πατήρ
  choice: Cha yêu thương tôi
  rationale: “Cha” giữ cách Đức Giê-su gọi Đức Chúa Trời trong văn mạch Giăng; “yêu thương” diễn đạt ἀγαπάω tự nhiên và trang trọng. Tiếng Việt không bắt buộc đánh dấu thì, nên cách dịch chính giữ được ý nghĩa vẫn còn hiệu lực trong văn mạch.
- source_word: κἀγὼ ὑμᾶς ἠγάπησα
  choice: tôi cũng yêu thương anh em
  rationale: “Cũng” thể hiện sự tương ứng do κἀγὼ hàm chứa. “Anh em” cho thấy ὑμᾶς là số nhiều và phù hợp lời Đức Giê-su nói với các môn đệ.
- source_word: μείνατε
  choice: hãy ở lại
  rationale: Giữ hình ảnh và chủ đề đặc trưng của động từ μένω trong Giăng, đồng thời là cách nói hiện đại, rõ ràng.
- source_word: ἐν τῇ ἀγάπῃ τῇ ἐμῇ
  choice: trong tình yêu của tôi
  rationale: Diễn đạt trực tiếp giới từ ἐν và tính từ sở hữu ἐμῇ, không xác định quá mức tình yêu ấy là tình yêu Đức Giê-su ban cho hay lĩnh vực tương giao trong tình yêu của ngài.
theological_decisions:
- issue: Ý nghĩa của ἀγάπη
  choice: tình yêu
  alternative: lòng yêu thương
  rationale: “Tình yêu” là cách gọi tự nhiên, hiện đại cho danh từ ἀγάπη và phù hợp với cụm “trong tình yêu của tôi”; không đưa thêm sắc thái giáo phái.
- issue: Sắc thái thể của hai động từ aorist ἠγάπησέν và ἠγάπησα
  choice: không thêm “đã” trong bản văn chính
  alternative: “đã yêu thương” ở cả hai vế
  rationale: Tiếng Việt không bắt buộc biểu thị quá khứ bằng một tiểu từ. Không thêm “đã” giữ được hành động được nhìn như một toàn thể mà không làm lu mờ giá trị liên tục của tình yêu trong văn mạch; chú thích bảo tồn cách hiểu quá khứ rõ hơn.
- issue: Phạm vi của “tình yêu của tôi”
  choice: giữ nguyên cấu trúc sở hữu
  alternative: “tình yêu tôi dành cho anh em” hoặc “tình yêu anh em dành cho tôi”
  rationale: Cụm Hy Lạp τῇ ἀγάπῃ τῇ ἐμῇ không tự nó giải quyết mọi sắc thái quan hệ. Giữ “tình yêu của tôi” bảo tồn độ mở của nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “tôi—anh em” cho lời Đức Giê-su nói với nhóm môn đệ; “anh em” cũng làm rõ đại từ số nhiều của nguyên văn. Viết hoa “Cha” vì đây là cách gọi Đức Chúa Trời trong lời Đức Giê-su.
