- from: Như Cha yêu thương tôi[a], tôi cũng yêu thương anh em; hãy ở lại trong tình yêu của tôi.
  to: Như Cha đã yêu thương tôi, tôi cũng đã yêu thương anh em; hãy ở lại trong tình yêu của tôi.
