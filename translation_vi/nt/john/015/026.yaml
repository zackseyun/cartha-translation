revisions:
- from: Khi Đấng Biện Hộ[a] đến, Đấng mà tôi sẽ sai từ Cha đến với anh em—Thần Khí của sự thật, Đấng xuất phát từ Cha—Ngài sẽ làm chứng về tôi.[b]
  to: Khi Đấng Biện Hộ[a] đến—Đấng mà tôi sẽ sai đến với anh em từ Cha, tức Thần Khí của sự thật, Đấng xuất phát từ Cha[c]—Ngài sẽ làm chứng về tôi.[b]
  rationale: 'Chỉnh sửa chỉ nhằm làm rõ quan hệ cú pháp của “từ Cha”, tăng tính tự nhiên của câu tiếng Việt, và tách các chú thích theo đúng neo từ/cụm từ: lựa chọn nghĩa của παράκλητος, phương án cho μαρτυρήσει, và lưu ý lịch sử-thần học gắn với ἐκπορεύεται. Bản văn vẫn giữ nguyên sự dè dặt của nguyên ngữ, không suy diễn giáo lý vượt quá câu.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T06:25:49Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch phản ánh đúng các thành phần chính của câu Hy Lạp: biến cố tương lai, Đấng παράκλητος, việc Đức Giê-su sai đến cho các môn đồ từ Cha, danh xưng “Thần Khí của sự thật”, mệnh đề “xuất phát từ Cha”, và hành động làm chứng về Đức Giê-su. Tuy nhiên, vị trí của “từ Cha” trong bản nháp có thể được đọc tạm thời như bổ nghĩa cho “đến với anh em”; đảo thành “sai đến với anh em từ Cha” làm rõ cấu trúc nguyên văn hơn. Ghi chú thần học về ἐκπορεύεται cũng nên được neo ngay tại cụm từ ấy, thay vì gộp vào chú thích ở cuối câu.'
  naturalness: “Đấng Biện Hộ”, “Thần Khí của sự thật”, “làm chứng về tôi” là tiếng Việt hiện đại, trang trọng và rõ nghĩa. Cấu trúc apposition được sửa bằng “tức” và dấu gạch ngang để câu mạch lạc hơn, đồng thời tránh lặp “Đấng mà” theo cách nặng nề.
  terminology: Giữ “Đấng Biện Hộ” cho παράκλητος vì bảo tồn sắc thái đại diện/bênh vực phù hợp văn mạch làm chứng. Giữ “Thần Khí” và đại từ “Ngài” vì câu trình bày Đấng ấy theo ngôi vị, đặc biệt với ἐκεῖνος giống đực. “Xuất phát từ Cha” giữ nét riêng của ἐκπορεύεται mà không diễn giải theo các hệ thống tín lý hậu kỳ.
  issues:
  - severity: medium
    issue: Chú thích về “xuất phát từ Cha” đang gộp chung với chú thích cuối câu và không được neo tại chính cụm từ được giải thích.
    rationale: Chú thích nên gắn với từ/cụm từ liên quan để người đọc phân biệt rõ lựa chọn từ vựng cho μαρτυρήσει với lưu ý lịch sử-thần học về ἐκπορεύεται.
  - severity: low
    issue: Cụm “sẽ sai từ Cha đến với anh em” có thể gây lúng túng về phạm vi của “từ Cha”.
    rationale: Đưa “từ Cha” sau “đến với anh em” trong cụm động từ sai phái phản ánh trật tự và quan hệ cú pháp của nguyên văn rõ hơn trong tiếng Việt.
  - severity: low
    issue: Dạng phiên âm “Pa-ra-clết” không tự nhiên trong tiếng Việt hiện đại.
    rationale: Dùng “Paraklet” như một dạng phiên âm gọn hơn trong chú thích, trong khi vẫn ưu tiên dịch nghĩa ở bản văn chính.
