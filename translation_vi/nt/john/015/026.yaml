id: JHN.15.26
reference: John 15:26
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸀Ὅταν ἔλθῃ ὁ παράκλητος ὃν ἐγὼ πέμψω ὑμῖν παρὰ τοῦ πατρός, τὸ πνεῦμα τῆς ἀληθείας ὃ παρὰ τοῦ πατρὸς ἐκπορεύεται, ἐκεῖνος μαρτυρήσει περὶ ἐμοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/john/015/026.yaml
  text: When the Advocate comes[a], whom I will send to you from the Father—the Spirit of truth[c][b], who proceeds from the Father—he will testify about me.
translation:
  language: vi
  text: Khi Đấng Biện Hộ[a] đến—Đấng mà tôi sẽ sai đến với anh em từ Cha, tức Thần Khí của sự thật, Đấng xuất phát từ Cha[c]—Ngài sẽ làm chứng về tôi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “Đấng Trợ Giúp”, “Đấng Cố Vấn”, “Đấng An Ủi”, hoặc phiên âm từ tiếng Hy Lạp là “Paraklet”.
    reason: lexical_alternative
  - marker: b
    text: “Sẽ làm chứng về tôi” cũng có thể dịch là “sẽ đưa ra lời chứng về tôi”.
    reason: lexical_alternative
  - marker: c
    text: Tiếng Hy Lạp nói “xuất phát từ Cha”; cách diễn đạt này về sau trở nên quan trọng trong các thảo luận thần học về Ba Ngôi.
    reason: cross_reference
lexical_decisions:
- source_word: Ὅταν ἔλθῃ
  choice: Khi ... đến
  rationale: Cấu trúc ὅταν với động từ giả định chỉ một biến cố tương lai được mong đợi; tiếng Việt tự nhiên dùng “Khi ... đến”.
- source_word: ὁ παράκλητος
  choice: Đấng Biện Hộ
  rationale: παράκλητος chỉ một nhân vật được gọi đến để trợ giúp, đại diện hoặc bênh vực. “Đấng Biện Hộ” giữ được sắc thái ngôi vị và đại diện trong văn mạch làm chứng, đồng thời chú thích bảo lưu các nghĩa khả dĩ khác.
- source_word: ὃν ἐγὼ πέμψω ὑμῖν παρὰ τοῦ πατρός
  choice: Đấng mà tôi sẽ sai từ Cha đến với anh em
  rationale: Diễn đạt rõ nguồn sai phái là Cha và đối tượng tiếp nhận là các môn đồ; đại từ “tôi” phù hợp lời trực tiếp của Chúa Giê-su trong tiếng Việt hiện đại.
- source_word: τὸ πνεῦμα τῆς ἀληθείας
  choice: Thần Khí của sự thật
  rationale: Giữ cấu trúc sở hữu/miêu tả của nguyên văn thay vì diễn giải thành “Thần Khí chân thật” hay “Thần Khí là sự thật”.
- source_word: ὃ παρὰ τοῦ πατρὸς ἐκπορεύεται
  choice: Đấng xuất phát từ Cha
  rationale: “Xuất phát” giữ nghĩa chuyển động từ nguồn của ἐκπορεύεται mà không tự động áp đặt thuật ngữ tín lý hậu kỳ; “Đấng” thể hiện cách văn mạch trình bày Thần Khí như một ngôi vị.
- source_word: ἐκεῖνος μαρτυρήσει περὶ ἐμοῦ
  choice: Ngài sẽ làm chứng về tôi
  rationale: “Ngài” chuyển tải đại từ nhấn mạnh ἐκεῖνος và quy chiếu có tính ngôi vị; “làm chứng” tự nhiên, dễ hiểu và giữ sắc thái chứng nhân của μαρτυρέω.
theological_decisions:
- issue: Cách dịch παράκλητος
  choice: Đấng Biện Hộ
  alternative: Đấng Trợ Giúp; Đấng An Ủi; Đấng Cố Vấn; Pa-ra-clết
  rationale: Không từ tiếng Việt đơn lẻ nào bao quát toàn bộ trường nghĩa. “Đấng Biện Hộ” phù hợp vai trò đại diện và làm chứng trong câu, còn chú thích ghi nhận những khả năng dịch khác.
- issue: Cách quy chiếu có tính ngôi vị đối với Thần Khí
  choice: Đấng ... Ngài
  alternative: thần khí ấy ... vị ấy; điều ấy ... nó
  rationale: Dù πνεῦμα có giống trung trong tiếng Hy Lạp, câu dùng ἐκεῖνος giống đực và trình bày Thần Khí như chủ thể đến, được sai và làm chứng. Cách dịch có tính ngôi vị phản ánh văn mạch mà không suy diễn thêm.
- issue: Cách dịch ἐκπορεύεται
  choice: xuất phát từ Cha
  alternative: phát xuất từ Cha; đi ra từ Cha; đến từ Cha
  rationale: Giữ sự chuyên biệt của động từ và mệnh đề hiện tại trong nguyên văn, nhưng không đưa tranh luận tín lý hậu kỳ về quan hệ giữa các ngôi vào chính bản dịch.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “anh em” cho số nhiều ὑμῖν trong lời Chúa Giê-su nói với các môn đồ; dùng “Cha” theo lối gọi trực tiếp của văn mạch Giăng. Dấu gạch ngang làm rõ cụm đồng vị “Thần Khí của sự thật”.
