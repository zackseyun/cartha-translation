id: JHN.15.21
reference: John 15:21
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀλλὰ ταῦτα πάντα ποιήσουσιν ⸂εἰς ὑμᾶς⸃ διὰ τὸ ὄνομά μου, ὅτι οὐκ οἴδασιν τὸν πέμψαντά με.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/021.yaml
  text: But they will do all these things to you because of my name[a], because they do not know the one who sent me.
translation:
  language: vi
  text: Nhưng vì danh tôi, họ sẽ làm tất cả những điều ấy đối với các con[a], bởi họ không biết Đấng đã sai tôi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “chống lại các con.” Cụm từ Hy Lạp có thể chỉ những hành động nhắm vào các môn đồ với ý thù nghịch.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Nhưng
  rationale: Diễn tả sự tương phản mạnh với lời trước đó bằng một liên từ tự nhiên trong tiếng Việt hiện đại.
- source_word: ταῦτα πάντα
  choice: tất cả những điều ấy
  rationale: Giữ cả ý chỉ định của ταῦτα và tính toàn thể của πάντα.
- source_word: ποιήσουσιν
  choice: họ sẽ làm
  rationale: Phản ánh trực tiếp thì tương lai chủ động, không thu hẹp động từ thành một cách đối xử cụ thể.
- source_word: εἰς ὑμᾶς
  choice: đối với các con
  rationale: Diễn đạt hành động hướng đến các môn đồ, đồng thời không làm sắc thái thù nghịch mạnh hơn mức cấu trúc Hy Lạp tự nó đòi hỏi.
- source_word: διὰ τὸ ὄνομά μου
  choice: vì danh tôi
  rationale: Diễn tả nguyên nhân và giữ nguyên sức nặng đại diện của 'danh', tức con người, căn tính và thẩm quyền của Đức Giê-su.
- source_word: οὐκ οἴδασιν
  choice: họ không biết
  rationale: Giữ cách nói đơn giản nhưng có thể bao hàm sự không nhận biết về mặt quan hệ, vốn quan trọng trong văn mạch Giăng.
- source_word: τὸν πέμψαντά με
  choice: Đấng đã sai tôi
  rationale: Chuyển phân từ có mạo từ thành một danh ngữ tự nhiên, không tự ý thêm danh xưng 'Cha' dù văn mạch cho thấy đó là Đấng được nói đến.
theological_decisions:
- issue: Đối tượng được nói đến trong τὸν πέμψαντά με
  choice: Đấng đã sai tôi
  alternative: Cha, Đấng đã sai tôi
  rationale: Bản văn Hy Lạp ngầm chỉ Đức Chúa Cha nhưng không dùng danh từ 'Cha'; bản dịch giữ cách nói hàm ẩn của nguyên bản.
- issue: Ý nghĩa của 'danh tôi'
  choice: Giữ nguyên 'danh tôi'
  alternative: vì tôi / vì thuộc về tôi
  rationale: Không giản lược 'danh' thành danh tiếng hay chỉ thay bằng đại từ, nhờ đó bảo tồn chiều sâu đại diện và thần học của ὄνομα trong sách Giăng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “các con” cho ὑμᾶς trong lời Đức Giê-su nói với các môn đồ; viết hoa “Đấng” để biểu thị kính trọng mà không thêm danh xưng không có trong nguyên bản.
