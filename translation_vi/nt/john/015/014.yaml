id: JHN.15.14
reference: John 15:14
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὑμεῖς φίλοι μού ἐστε ἐὰν ποιῆτε ⸀ἃ ἐγὼ ἐντέλλομαι ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/014.yaml
  text: You are my friends if you do what I command you[a].
translation:
  language: vi
  text: Các con là bạn hữu của Thầy nếu các con làm điều Thầy truyền cho các con.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát hình thức hơn: “Các con là bạn hữu của Thầy nếu các con làm những điều Thầy truyền cho các con.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς
  choice: các con
  rationale: Đại từ ngôi thứ hai số nhiều được đặt đầu câu để nhấn mạnh. Trong mạch văn Chúa Giê-su nói với các môn đồ, “các con” tự nhiên, trang trọng và biểu đạt quan hệ gần gũi; vị trí đầu câu giữ được phần nào sự nhấn mạnh.
- source_word: φίλοι μού
  choice: bạn hữu của Thầy
  rationale: φίλοι chỉ những người có quan hệ thân thiết, còn μού biểu thị quan hệ thuộc về. “Bạn hữu” giữ sắc thái trang trọng, gần gũi; “của Thầy” tự nhiên hơn cách dịch máy móc “của tôi” trong ngữ cảnh môn đồ thưa nghe Chúa Giê-su.
- source_word: ἐστε
  choice: là
  rationale: Động từ hiện tại của εἰμί được chuyển trực tiếp bằng hệ từ “là”.
- source_word: ἐὰν
  choice: nếu
  rationale: ἐὰν đi với thể giả định mở đầu một điều kiện; “nếu” bảo toàn rõ ràng tính điều kiện thay vì biến nó thành mệnh đề thời gian.
- source_word: ποιῆτε
  choice: các con làm
  rationale: Thể hiện tại giả định của ποιέω nói đến việc thực hiện mệnh lệnh. “Làm” là cách diễn đạt tự nhiên và không áp đặt quá mức sắc thái tiếp diễn.
- source_word: ἃ
  choice: điều
  rationale: Đại từ quan hệ trung tính số nhiều chỉ nội dung những điều Chúa Giê-su truyền. Tiếng Việt tự nhiên có thể dùng danh từ tập hợp “điều”; bản dịch sát hình thức hơn được ghi ở chú thích.
- source_word: ἐγὼ
  choice: Thầy
  rationale: Đại từ chủ ngữ được nêu rõ trong tiếng Hy Lạp nên có sắc thái nhấn mạnh. Dùng lại “Thầy” thay cho đại từ lược bỏ giúp giữ rõ chủ thể ra lệnh và phù hợp quan hệ thầy–trò trong mạch văn.
- source_word: ἐντέλλομαι
  choice: truyền
  rationale: Động từ chỉ việc ban mệnh lệnh có thẩm quyền. “Truyền” giữ thẩm quyền của lời Chúa Giê-su mà vẫn tự nhiên trong văn phong Kinh Thánh hiện đại.
- source_word: ὑμῖν
  choice: cho các con
  rationale: Dữ cách số nhiều biểu thị người tiếp nhận mệnh lệnh. “Truyền cho các con” là cấu trúc tiếng Việt rõ ràng, tự nhiên.
theological_decisions:
- issue: Quan hệ có điều kiện giữa tình bạn với Chúa Giê-su và sự vâng lời
  choice: 'Dịch thẳng bằng “nếu”: “Các con là bạn hữu của Thầy nếu các con làm điều Thầy truyền cho các con.”'
  alternative: “Các con là bạn hữu của Thầy khi các con làm điều Thầy truyền cho các con.”
  rationale: Cấu trúc ἐὰν với thể giả định tự nhiên nhất là một điều kiện, không chỉ một thời điểm. Bản dịch giữ nguyên mối liên hệ mà câu nêu giữa tình bạn và sự vâng lời, không tự ý giải thích theo một hệ thống giáo lý về công trạng, sự cứu rỗi hay sự bền đỗ.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Cặp xưng hô “Thầy—các con” phản ánh bối cảnh Chúa Giê-su nói với các môn đồ và duy trì sự gần gũi cùng thẩm quyền. “Bạn hữu” được chọn thay cho “bạn bè” để tránh sắc thái quá khẩu ngữ.
