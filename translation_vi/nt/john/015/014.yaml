  source_fidelity: 'Bản dịch chuyển đạt đúng cấu trúc và ý nghĩa của ὑμεῖς φίλοι μού ἐστε ἐὰν ποιῆτε ἃ ἐγὼ ἐντέλλομαι ὑμῖν: quan hệ bạn hữu, điều kiện «nếu», hành động thực hiện, và nội dung mệnh lệnh của Chúa Giê-su. «Điều» là cách Việt hóa tự nhiên cho ἃ (số nhiều trung tính) mà không làm đổi nghĩa; chú thích đã cung cấp phương án «những điều» sát hình thức hơn. Cặp xưng hô «Thầy—các con» phù hợp trực tiếp với diễn ngôn dành cho các môn đồ trong ngữ cảnh gần, không thêm diễn giải tín lý.'
  naturalness: Câu văn tự nhiên, rõ ràng và có giọng trang trọng vừa phải trong tiếng Việt tiêu chuẩn hiện đại. «Bạn hữu» phù hợp văn phong Kinh Thánh và không quá khẩu ngữ; «làm điều Thầy truyền cho các con» sáng rõ, tuy có lặp «các con» nhằm giữ chủ thể và đối tượng của động từ minh bạch.
  terminology: «Bạn hữu», «Thầy», và «truyền» nhất quán với một ngữ cảnh thầy–môn đồ và bảo toàn sắc thái thẩm quyền của ἐντέλλομαι. «Nếu» phản ánh chính xác điều kiện ἐὰν với thể giả định, không chuyển thành quan hệ thời gian hoặc áp đặt cách giải thích giáo phái.
