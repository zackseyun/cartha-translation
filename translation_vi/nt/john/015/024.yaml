  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἰ τὰ ἔργα μὴ ἐποίησα ἐν αὐτοῖς ἃ οὐδεὶς ἄλλος ⸀ἐποίησεν, ἁμαρτίαν οὐκ ⸀εἴχοσαν· νῦν δὲ καὶ ἑωράκασιν καὶ μεμισήκασιν καὶ ἐμὲ καὶ τὸν πατέρα μου.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/024.yaml
  text: If I had not done among them the works that no one else did[a], they would not have sin[b]; but now they have both seen and hated both me and my Father.
translation:
  language: vi
  text: Nếu tôi đã không làm giữa họ những việc mà không ai khác đã làm, thì họ đã không có tội[a]. Nhưng bây giờ họ đã thấy và đã ghét cả tôi lẫn Cha tôi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “thì họ đã không mắc tội.” Nguyên văn Hy Lạp sát nghĩa là “thì họ đã không có tội.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ἔργα
  choice: những việc
  rationale: “Những việc” là cách nói tự nhiên, trang trọng vừa phải trong tiếng Việt và vẫn giữ được nghĩa rộng của ἔργα về các hành động làm chứng cho căn tính và sứ mạng của Chúa Giê-su.
- source_word: ἐποίησα ἐν αὐτοῖς
  choice: tôi làm giữa họ
  rationale: ἐν αὐτοῖς được hiểu theo nghĩa địa điểm-xã hội, tức Chúa Giê-su hành động ngay giữa họ và trước sự chứng kiến của họ.
- source_word: ἃ οὐδεὶς ἄλλος ἐποίησεν
  choice: chưa từng có ai khác làm
  rationale: Cách dịch này diễn đạt tự nhiên tính độc nhất của các việc Chúa Giê-su đã làm, đồng thời phản ánh giá trị hoàn tất của động từ aorist trong mệnh đề quan hệ.
- source_word: ἁμαρτίαν οὐκ εἴχοσαν
  choice: họ đã không có tội
  rationale: Giữ nguyên thành ngữ Giăng “có tội” thay vì thu hẹp nghĩa thành “mắc tội” hoặc “chịu trách nhiệm về tội”, qua đó bảo toàn sức căng thần học của câu.
- source_word: νῦν δὲ
  choice: nhưng bây giờ
  rationale: Đánh dấu rõ sự tương phản giữa điều kiện trái thực tế và tình trạng hiện tại.
- source_word: καὶ ἑωράκασιν καὶ μεμισήκασιν
  choice: đã thấy mà vẫn ghét
  rationale: 'Hai hành động đều được giữ lại; “mà vẫn” làm rõ sự tương phản ngầm: dù đã thấy các việc ấy, họ vẫn ghét. Cách này tự nhiên hơn việc lặp “vừa… vừa…” trong tiếng Việt.'
- source_word: καὶ ἐμὲ καὶ τὸν πατέρα μου
  choice: cả tôi lẫn Cha tôi
  rationale: Cấu trúc “cả… lẫn…” bảo toàn sự nhấn mạnh tương liên của καὶ…καὶ đối với hai đối tượng.
theological_decisions:
- issue: Ý nghĩa của “họ đã không có tội” đối với trách nhiệm đạo đức
  choice: Giữ thành ngữ “có tội” trong bản văn chính.
  alternative: “họ đã không mắc tội” hoặc “họ đã không phải chịu trách nhiệm về tội.”
  rationale: Ngữ cảnh cho thấy trách nhiệm của họ gia tăng vì đã thấy những việc độc nhất của Chúa Giê-su, nhưng bản dịch không nên biến cách nói rộng và đặc trưng của Giăng thành một công thức thần học hẹp hơn.
- issue: Quan hệ giữa việc thấy và việc ghét
  choice: “đã thấy mà vẫn ghét”
  alternative: “đã vừa thấy vừa ghét”
  rationale: 'Bản dịch chính nêu bật nghịch lý thần học của câu: sự mặc khải họ chứng kiến không dẫn đến tin nhận nhưng đến thù ghét cả Chúa Giê-su lẫn Cha. Tuy vậy, nó không thêm một nguyên nhân không có trong nguyên văn.'
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. Dùng “Cha” viết hoa theo cách gọi của Chúa Giê-su trong ngữ cảnh. Cấu trúc điều kiện “Nếu… đã không…, thì… đã không…” thể hiện điều kiện trái thực tế trong quá khứ mà không gây nặng nề.
