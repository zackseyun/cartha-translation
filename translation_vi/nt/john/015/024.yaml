  source_fidelity: Bản dịch giữ đúng cấu trúc điều kiện trái với thực tế, cách nói Giăng “có tội,” và cặp đối tượng “tôi ... Cha tôi.” Tuy nhiên, “chưa từng có ai khác làm” mở rộng mệnh đề aorist thành một khẳng định phổ quát theo thời gian (“never”), còn “mà vẫn ghét” thêm sắc thái nhượng bộ/đối nghịch không được diễn đạt trực tiếp bởi các liên từ καί.
  naturalness: Câu nhìn chung tự nhiên, trang nghiêm và phù hợp tiếng Việt hiện đại. “đã thấy và đã ghét cả tôi lẫn Cha tôi” vừa tự nhiên vừa bám sát sự phối hợp hai động từ hoàn thành trong nguyên văn hơn.
  terminology: “những việc,” “có tội,” và “Cha tôi” phù hợp văn mạch Giăng. Giữ “Cha” viết hoa là nhất quán với quy chiếu trong lời của Chúa Giê-su.
  issues:
  - severity: medium
    issue: “chưa từng có ai khác làm” thêm ý ‘chưa từng/never’.
    rationale: ἃ οὐδεὶς ἄλλος ἐποίησεν nói các việc mà không ai khác đã làm; aorist không tự nó khẳng định ‘chưa từng’ theo toàn bộ thời gian. Nên tránh mở rộng phạm vi thời gian.
  - severity: medium
    issue: “đã thấy mà vẫn ghét” thêm quan hệ nhượng bộ.
    rationale: Nguyên văn phối hợp “đã thấy” và “đã ghét” bằng καί...καί, không dùng từ nối mang nghĩa ‘mà vẫn/despite that’. Sự nghịch lý có thể được độc giả nhận ra từ ngữ cảnh, nhưng không nên đưa vào bằng liên từ diễn giải.
