revisions:
- from: Ta là cây nho; các con là những cành. Người nào cứ ở trong Ta, và Ta ở trong người ấy, thì người ấy sinh nhiều trái, vì lìa khỏi Ta, các con không thể làm gì được.[a]
  to: Ta là cây nho; anh em là các cành. Người nào ở lại trong Ta, và Ta ở trong người ấy, thì sinh nhiều trái; vì lìa khỏi Ta, anh em không thể làm gì được.
  rationale: Sửa đại từ xưng hô để tránh thêm ý không có trong nguyên văn, và thay “cứ ở” bằng “ở lại” để phản ánh sắc thái tiếp diễn của μένω. Bỏ chú thích hiện có vì mệnh đề “không thể làm gì được” đã dịch trực tiếp οὐ δύνασθε ποιεῖν οὐδέν, không cần chú thích diễn giải; việc bỏ chú thích cũng loại bỏ một neo chú thích không cần thiết.
