review_pass:
  verdict: revise
  source_fidelity: Bản dịch giữ đúng các hình ảnh chính và cấu trúc hỗ tương “ở trong Ta ... Ta ở trong người ấy,” cũng như sự chuyển từ chủ ngữ số ít đại diện sang “anh em” số nhiều ở mệnh đề cuối. Tuy nhiên, “các con” thêm một quan hệ con cái không có trong ὑμεῖς (“anh em/các bạn”), nên nên sửa để không diễn giải thêm.
  naturalness: “Cây nho,” “các cành,” “sinh nhiều trái,” và “không thể làm gì được” đều tự nhiên. “Ở lại trong” truyền đạt μένων rõ và thành ngữ hơn “cứ ở trong” trong văn phong Kinh Thánh hiện đại.
  terminology: Nên dùng “anh em” thay “các con.” Cách này vừa phù hợp với ngôi xưng “Ta,” vừa không áp đặt quan hệ cha-con mà câu Hy Lạp không biểu thị. Giữ “Ta” là nhất quán với lời Đức Chúa Jêsus nói với nhóm môn đồ.
  issues:
  - severity: medium
    issue: “các con” cho ὑμεῖς
    rationale: Đại từ số nhiều ὑμεῖς chỉ những người được nói với; nguyên văn câu này không gọi họ là “con.” “Các con” vì thế thêm sắc thái quan hệ cha-con và nên được thay bằng “anh em.”
  - severity: low
    issue: “cứ ở trong” chưa phản ánh rõ nét “remain/abide”
    rationale: μένω mang ý tiếp tục, ở lại. “Ở lại trong” là cách diễn đạt tự nhiên, rõ nghĩa và quen thuộc hơn trong tiếng Việt hiện đại mà không giải thích quá mức.
  revised_text: Ta là cây nho; anh em là các cành. Người nào ở lại trong Ta, và Ta ở trong người ấy, thì sinh nhiều trái; vì lìa khỏi Ta, anh em không thể làm gì được.
