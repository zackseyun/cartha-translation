id: JHN.15.5
reference: John 15:5
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐγώ εἰμι ἡ ἄμπελος, ὑμεῖς τὰ κλήματα. ὁ μένων ἐν ἐμοὶ κἀγὼ ἐν αὐτῷ οὗτος φέρει καρπὸν πολύν, ὅτι χωρὶς ἐμοῦ οὐ δύνασθε ποιεῖν οὐδέν.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/005.yaml
  text: I am the vine[a]; you are the branches. The one who remains in me, and I in him, bears much fruit[b], because apart from me you are not able to do anything.
translation:
  language: vi
  text: Ta là cây nho; anh em là các cành. Người nào ở lại trong Ta, và Ta ở trong người ấy, thì sinh nhiều trái; vì lìa khỏi Ta, anh em không thể làm gì được.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄμπελος
  choice: cây nho
  rationale: Trong ngữ cảnh trồng nho, từ này chỉ cây nho; cách dịch tự nhiên và rõ nghĩa trong tiếng Việt.
- source_word: κλήματα
  choice: những cành
  rationale: κλῆμα là cành hoặc nhánh của cây nho. “Những cành” tự nhiên, đồng thời giữ nguyên hình ảnh ẩn dụ.
- source_word: ὁ μένων
  choice: người nào cứ ở
  rationale: Phân từ hiện tại μένων diễn tả sự tiếp tục, bền lâu. “Cứ ở” là lối nói hiện đại, dễ hiểu và giữ sắc thái kéo dài trong mối quan hệ.
- source_word: ἐν ἐμοὶ ... ἐν αὐτῷ
  choice: ở trong Ta ... ở trong người ấy
  rationale: Giữ “trong” để bảo toàn ngôn ngữ về sự ở trong nhau, thay vì làm yếu ý bằng “ở với”.
- source_word: κἀγὼ
  choice: và Ta
  rationale: 'Phản ánh cấu trúc tương hỗ: người môn đồ ở trong Chúa Giê-su, và Ngài ở trong người ấy.'
- source_word: φέρει καρπὸν πολύν
  choice: sinh nhiều trái
  rationale: “Sinh trái” là cách kết hợp từ tự nhiên trong tiếng Việt đối với cây và giữ nguyên hình ảnh nông nghiệp.
- source_word: χωρὶς ἐμοῦ
  choice: lìa khỏi Ta
  rationale: Diễn đạt tình trạng tách khỏi Chúa Giê-su, mạnh hơn ý đơn thuần là thiếu sự trợ giúp.
- source_word: οὐ δύνασθε ποιεῖν οὐδέν
  choice: các con không thể làm gì được
  rationale: Diễn đạt rõ sự bất lực trong nguyên văn và xử lý phủ định theo cú pháp tiếng Việt tự nhiên.
theological_decisions:
- issue: Ngôn ngữ Gioan về sự ở trong nhau
  choice: Giữ “ở trong Ta, và Ta ở trong người ấy”.
  alternative: “Ở với Ta, và Ta ở với người ấy”.
  rationale: “Ở trong” phản ánh trực tiếp ἐν và bảo tồn chiều sâu cũng như sự căng thẳng thần học của mối liên hiệp tương hỗ, không giải thích lấn sang diễn giải.
- issue: Dạng giống đực số ít αὐτῷ có giá trị đại diện
  choice: Dịch là “người ấy”.
  alternative: “Người đó” hoặc lặp lại “người nào”.
  rationale: Tiếng Việt không có đại từ giống đực bắt buộc tương ứng trong cấu trúc này. “Người ấy” giữ số ít và tính đại diện phổ quát mà không thêm giới tính vốn không cần biểu thị trong tiếng Việt.
- issue: Phạm vi của “không thể làm gì”
  choice: Giữ mệnh đề tuyệt đối “không thể làm gì được”.
  alternative: Giải thích thành “không thể sinh trái” hoặc “không thể làm điều gì đẹp lòng Đức Chúa Trời”.
  rationale: Nguyên văn dùng οὐδέν, “không gì cả”; không nên thu hẹp phạm vi bằng một lời diễn giải thần học không được nói rõ trong câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ta/các con” để thể hiện lời Chúa Giê-su nói thân mật nhưng có thẩm quyền với các môn đồ. “Cứ ở” chuyển tải sắc thái tiếp diễn của μένω mà không dùng từ cổ hoặc quá chuyên biệt.
