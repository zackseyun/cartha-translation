    issue: “đã được sạch” thêm sắc thái bị động vào καθαροί.
    rationale: 'καθαροί là tính từ vị ngữ: “các anh em [là/đã] sạch.” Dù ngữ cảnh có thể hàm ý được làm sạch, dạng bị động trong tiếng Việt làm rõ điều mà câu này không phát biểu trực tiếp.'
  - severity: low
    issue: Đại từ “các con” thêm sắc thái quan hệ gia trưởng/cha-con.
