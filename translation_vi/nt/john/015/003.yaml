  - severity: low
    issue: Chú thích hiện tại đảo trọng tâm ngữ nghĩa của διὰ τὸν λόγον.
    rationale: Với διά + đối cách, nghĩa nguyên nhân (“vì”) là lựa chọn chính xác và trực tiếp hơn; “nhờ” vẫn là khả năng tự nhiên khi nhấn phương tiện.
