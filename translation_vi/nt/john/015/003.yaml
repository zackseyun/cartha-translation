revisions:
- from: Các con đã được sạch nhờ lời Ta đã nói với các con.[a]
  to: Anh em đã sạch vì lời Ta đã nói với anh em.[a]
  rationale: Bản chỉnh giữ nguyên khẳng định hiện tại đã có hiệu lực của ἤδη và thì hoàn thành của λελάληκα bằng “đã ... đã nói,” đồng thời dịch καθαροί bằng tính từ “sạch” thay vì thêm bị động. “Vì” phản ánh cách dùng nhân quả thông thường của διά với đối cách; chú thích bảo lưu cách dịch “nhờ.”
