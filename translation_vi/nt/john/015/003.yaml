  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἤδη ὑμεῖς καθαροί ἐστε διὰ τὸν λόγον ὃν λελάληκα ὑμῖν·
base_translation:
  language: en
  yaml_path: translation/nt/john/015/003.yaml
  text: Already you are clean because of the word that I have spoken to you[a].
translation:
  language: vi
  text: Anh em đã sạch vì lời Ta đã nói với anh em.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “Anh em đã sạch nhờ lời Ta đã nói với anh em.”'
    reason: “Nhờ” diễn đạt sắc thái phương tiện có thể có của διὰ τὸν λόγον; “vì” trong chính văn nhấn nguyên nhân.
lexical_decisions:
- source_word: ἤδη
  choice: đã
  rationale: Diễn tả tình trạng hiện đã có hiệu lực; trong tiếng Việt, “đã” đi với “được sạch” tự nhiên hơn “đã rồi” hay “đến nay”.
- source_word: ὑμεῖς
  choice: các con
  rationale: Đại từ số nhiều được diễn đạt theo quan hệ giữa Đức Chúa Giê-su và các môn đồ trong lời trực tiếp; không thêm từ phản thân, nhưng vẫn giữ trọng tâm nhờ cấu trúc câu.
- source_word: καθαροί
  choice: được sạch
  rationale: Giữ hình ảnh sạch/tẩy sạch và mối liên hệ từ ngữ với καθαίρει ở câu trước, thay vì thu hẹp thành ý niệm trừu tượng “thanh sạch”.
- source_word: διὰ τὸν λόγον
  choice: nhờ lời
  rationale: διά với đối cách có thể chỉ nguyên nhân hoặc phương tiện. “Nhờ” tự nhiên trong tiếng Việt và giữ được phần nào cả sắc thái nguyên nhân lẫn phương tiện.
- source_word: λόγον
  choice: lời
  rationale: Là cách dịch trực tiếp, tự nhiên và giữ lối dùng từ đặc trưng của sách Giăng; “sứ điệp” hoặc “sự dạy dỗ” sẽ diễn giải nhiều hơn.
- source_word: ὃν λελάληκα
  choice: Ta đã nói
  rationale: Thì hoàn thành Hy Lạp chỉ lời đã được phán với hiệu lực còn tiếp diễn; “đã nói” là cách diễn đạt tiếng Việt tự nhiên mà không làm mất kết quả hiện tại trong ngữ cảnh.
- source_word: ὑμῖν
  choice: với các con
  rationale: Diễn đạt tự nhiên đối tượng tiếp nhận lời nói; số nhiều được thể hiện rõ bằng “các con”.
theological_decisions:
- issue: Bản chất sự sạch của các môn đồ
  choice: Giữ nguyên hình ảnh các môn đồ đã được sạch bởi/nhờ lời Đức Chúa Giê-su, không gán một phạm trù giáo lý chuyên biệt.
  alternative: Diễn giải là sự thanh tẩy bí tích hoặc lời tuyên bố xưng công chính theo nghĩa pháp đình.
  rationale: Ngữ cảnh trực tiếp là hình ảnh cây nho, việc tỉa sạch và lời Đức Chúa Giê-su. Bản dịch cần để ngỏ chiều sâu thần học của câu thay vì đồng nhất nó với một hệ thống giáo lý về sau.
- issue: Quan hệ do διά biểu thị
  choice: Dùng “nhờ” trong chính văn.
  alternative: Dùng “vì” để nhấn mạnh nguyên nhân.
  rationale: Cấu trúc διὰ với đối cách thường mang nghĩa nguyên nhân, nhưng trong văn cảnh này ranh giới giữa nguyên nhân và phương tiện không cần bị phân định quá cứng. “Nhờ” vừa tự nhiên vừa bảo tồn độ mở ấy; chú thích nêu cách hiểu thiên về nguyên nhân.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ta—các con” phù hợp lời Đức Chúa Giê-su nói trực tiếp với các môn đồ. Cụm “được sạch” giữ liên hệ với hình ảnh tỉa sạch ở câu trước và tránh áp đặt thuật ngữ giáo phái.
