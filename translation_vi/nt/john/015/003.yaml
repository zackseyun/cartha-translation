review_pass:
  verdict: revise
  source_fidelity: 'Cần chỉnh nhẹ để phản ánh trực tiếp hơn vị ngữ tính từ καθαροί (“sạch”): câu Hy Lạp nói các môn đồ hiện “sạch,” không diễn tả rõ hành động bị động “được sạch.” Với διὰ + đối cách, “vì” biểu thị nguyên nhân phù hợp nhất; “nhờ” có thể giữ ở chú thích như một cách dịch nhấn phương tiện.'
  naturalness: “Đã được sạch” không tự nhiên bằng “đã sạch” trong tiếng Việt hiện đại. Cặp xưng hô “Ta—anh em” trang trọng, tự nhiên trong lời trực tiếp của Đức Chúa Giê-su với nhóm môn đồ, mà không thêm quan hệ “cha-con” không được nêu trong câu gốc.
  terminology: Giữ “sạch” để bảo toàn liên hệ với hình ảnh thanh tẩy/tỉa sạch ở văn mạch gần. Giữ “lời” cho λόγος, không diễn giải thành một thuật ngữ giáo lý hay “sứ điệp.”
  issues:
