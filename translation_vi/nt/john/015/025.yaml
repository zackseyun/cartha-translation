reference: John 15:25
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀλλ’ ἵνα πληρωθῇ ὁ λόγος ὁ ⸂ἐν τῷ νόμῳ αὐτῶν γεγραμμένος⸃ ὅτι Ἐμίσησάν με δωρεάν.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/025.yaml
  text: 'But this happened so that the word written in their Law might be fulfilled: ‘They hated me without cause.’[a][b][c]'
translation:
  language: vi
  text: 'Nhưng điều ấy xảy ra để lời đã chép trong Luật pháp của họ được ứng nghiệm: “Họ ghét tôi vô cớ.”[a][b][c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát hình thức hơn: “Nhưng để lời đã chép trong Luật pháp của họ được ứng nghiệm.” Tiếng Hy Lạp tỉnh lược mệnh đề chính; “điều ấy xảy ra” được bổ sung từ ngữ cảnh.'
    reason: lexical_alternative
  - marker: b
    text: “Luật pháp của họ” dùng “Luật pháp” theo nghĩa rộng, chỉ Kinh Thánh Do Thái; lời trích này nằm trong Thi Thiên (xem Thi Thiên 35:19; 69:4).
    reason: cross_reference
  - marker: c
    text: 'Cũng có thể dịch: “không vì lý do gì.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: Nhưng
  rationale: Giữ quan hệ tương phản với lời ngay trước đó; cụm “điều ấy xảy ra” được bổ sung để câu tiếng Việt tự nhiên và làm rõ phần tỉnh lược trong tiếng Hy Lạp.
- source_word: ἵνα πληρωθῇ
  choice: để ... được ứng nghiệm
  rationale: Diễn đạt tự nhiên cấu trúc ἵνα với động từ bị động giả định, đồng thời giữ mô-típ lời Kinh Thánh được ứng nghiệm mà không xác định quá mức đây chỉ là mục đích hay kết quả.
- source_word: ὁ λόγος
  choice: lời
  rationale: Ở đây λόγος chỉ một lời cụ thể trong Kinh Thánh; “lời” ngắn gọn, trang trọng và phù hợp với công thức trích dẫn.
- source_word: ἐν τῷ νόμῳ αὐτῶν γεγραμμένος
  choice: đã chép trong Luật pháp của họ
  rationale: “Đã chép” phản ánh phân từ hoàn thành bị động, tức là lời vẫn còn được ghi chép; “của họ” giữ nguyên sắc thái khoảng cách tu từ của αὐτῶν.
- source_word: νόμῳ
  choice: Luật pháp
  rationale: Giữ danh từ Hy Lạp thay vì diễn giải thành “Kinh Thánh”; trong ngữ cảnh Giăng, từ này có thể được dùng theo nghĩa rộng, bao gồm cả Thi Thiên.
- source_word: ὅτι
  choice: ':'
  rationale: Dấu hai chấm giới thiệu tự nhiên nội dung của lời Kinh Thánh trong tiếng Việt.
- source_word: Ἐμίσησάν με
  choice: Họ ghét tôi
  rationale: Thì quá khứ đơn của câu trích được chuyển bằng cách diễn đạt tiếng Việt tự nhiên; đại từ “tôi” phù hợp với tiếng nói của nhân vật trong câu trích.
- source_word: δωρεάν
  choice: vô cớ
  rationale: “Vô cớ” chuyển tải ý bị ghét mà không có căn nguyên hay lý do chính đáng, đồng thời súc tích và trang trọng.
theological_decisions:
- issue: “Luật pháp của họ” trong khi câu trích đến từ Thi Thiên
  choice: Giữ “Luật pháp” trong chính văn và giải thích rằng ở đây từ này có thể chỉ Kinh Thánh Do Thái theo nghĩa rộng.
  alternative: Dịch thẳng là “Kinh Thánh của họ” để làm rõ phạm vi rộng.
  rationale: Bản Hy Lạp dùng νόμος. Giữ “Luật pháp” bảo toàn cách nói của nguồn, còn chú thích giúp người đọc không hiểu từ này chỉ giới hạn trong Ngũ Kinh.
- issue: Mệnh đề chính bị tỉnh lược sau ἀλλ’
  choice: Bổ sung “điều ấy xảy ra” để câu tiếng Việt đầy đủ và tự nhiên.
  alternative: 'Dịch sát hình thức: “Nhưng để lời đã chép ... được ứng nghiệm.”'
  rationale: Tiếng Hy Lạp dựa vào ngữ cảnh trước để hiểu phần bị tỉnh lược. Phần bổ sung không đưa vào một sự kiện mới mà chỉ biểu đạt rõ mối liên hệ vốn được ngầm hiểu; chú thích bảo lưu hình thức sát nguyên văn.
- issue: Sắc thái mục đích hay kết quả của ἵνα
  choice: Dùng “để”, cho phép ngữ cảnh mang cả sắc thái mục đích và kết quả.
  alternative: Dùng “hầu cho” hoặc diễn giải rõ là “kết quả là”.
  rationale: Cấu trúc Hy Lạp có thể mang sắc thái mục đích/kết quả. “Để” là cách diễn đạt tự nhiên mà không âm thầm giải quyết căng thẳng thần học của câu.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Câu văn giữ nhịp ngắn gọn của lời phán và dùng thuật ngữ quen thuộc “được ứng nghiệm”; các điểm tỉnh lược và phạm vi nghĩa của “Luật pháp” được giải thích trong chú thích thay vì diễn giải quá mức trong chính văn.
