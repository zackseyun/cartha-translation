id: JHN.15.4
reference: John 15:4
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: μείνατε ἐν ἐμοί, κἀγὼ ἐν ὑμῖν. καθὼς τὸ κλῆμα οὐ δύναται καρπὸν φέρειν ἀφ’ ἑαυτοῦ ἐὰν μὴ ⸀μένῃ ἐν τῇ ἀμπέλῳ, οὕτως οὐδὲ ὑμεῖς ἐὰν μὴ ἐν ἐμοὶ ⸀μένητε.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/004.yaml
  text: Remain in me[a], and I in you. Just as the branch is not able to bear fruit by itself unless it remains in the vine, so neither can you unless you remain in me.
translation:
  language: vi
  text: Hãy cứ ở trong tôi[a], và tôi trong các con. Như cành nho không thể tự mình ra trái nếu không ở trong cây nho, các con cũng không thể ra trái nếu không ở trong tôi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Hãy ở lại trong tôi.” Động từ Hy Lạp μένω chỉ việc ở, tiếp tục ở hoặc gắn bó bền lâu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μείνατε / μένῃ / μένητε
  choice: hãy cứ ở / ở
  rationale: Động từ μένω diễn tả sự tiếp tục, gắn bó bền lâu. “Hãy cứ ở trong tôi” là tiếng Việt tự nhiên, giữ được hình ảnh ở trong và sắc thái tiếp diễn; các lần lặp sau dùng “ở” để bảo toàn từ khóa.
- source_word: ἐν ἐμοί
  choice: trong tôi
  rationale: Giữ giới từ ἐν là “trong”, vì câu nhấn mạnh sự kết hợp và tương thuộc, không chỉ là ở gần hay ở cùng.
- source_word: κἀγὼ ἐν ὑμῖν
  choice: và tôi trong các con
  rationale: Bản Hy Lạp tỉnh lược động từ. Bản dịch giữ cấu trúc cô đọng, không tự ý thêm “sẽ ở” hoặc biến mệnh đề này thành một lời hứa rõ nghĩa hơn nguyên văn.
- source_word: τὸ κλῆμα
  choice: cành nho
  rationale: Trong ngữ cảnh ẩn dụ về cây nho, “cành nho” chính xác và tự nhiên hơn từ chung chung “cành”.
- source_word: οὐ δύναται καρπὸν φέρειν
  choice: không thể … ra trái
  rationale: “Không thể” truyền đạt trực tiếp ý về khả năng của δύναμαι; “ra trái” là cách nói nông nghiệp tự nhiên trong tiếng Việt và giữ nguyên hình ảnh.
- source_word: ἀφ’ ἑαυτοῦ
  choice: tự mình
  rationale: Diễn đạt tự nhiên ý cành không có khả năng kết quả từ chính nó, độc lập với cây nho.
- source_word: ἐν τῇ ἀμπέλῳ
  choice: trong cây nho
  rationale: Giữ hình ảnh “ở trong” của nguyên văn thay vì thêm cách giải thích “gắn liền với cây nho”.
- source_word: οὕτως οὐδὲ ὑμεῖς
  choice: các con cũng vậy
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt; ý “không thể ra trái” được kế thừa từ vế so sánh trước mà không cần lặp lại.
theological_decisions:
- issue: Ý nghĩa của μένω trong bối cảnh môn đồ gắn bó với Chúa Giê-su
  choice: hãy cứ ở trong tôi
  alternative: hãy ở lại trong tôi
  rationale: “Hãy cứ ở” thể hiện sự tiếp tục bền lâu, đồng thời giữ hình ảnh ở trong vốn được lặp lại trong câu. “Ở lại” cũng khả dĩ nhưng trong tiếng Việt có thể gợi mạnh hơn việc không rời khỏi một địa điểm.
- issue: Mệnh đề tỉnh lược κἀγὼ ἐν ὑμῖν
  choice: và tôi trong các con
  alternative: và tôi sẽ ở trong các con
  rationale: Giữ sự tỉnh lược và tính hàm súc của tiếng Hy Lạp, tránh quyết định thay độc giả rằng động từ ngầm mang sắc thái tương lai hay mệnh lệnh.
- issue: Cách xưng hô của Chúa Giê-su với các môn đồ
  choice: tôi / các con
  alternative: Ta / các ngươi
  rationale: “Tôi / các con” tự nhiên, trang trọng và phù hợp quan hệ giữa Chúa Giê-su với các môn đồ trong lời nói trực tiếp, không dùng lối xưng hô cổ có thể tạo khoảng cách không có trong nguyên văn.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Giữ phép lặp “ở trong” làm trục của hình ảnh cây nho–cành nho; tránh thêm lời giải thích thần học vào chính câu.
