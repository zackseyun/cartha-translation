base_translation:
  language: en
  yaml_path: translation/nt/john/015/022.yaml
  text: If I had not come and spoken to them[a], they would not have sin[c][b]; but now they have no excuse for their sin.
translation:
  language: vi
  text: Nếu tôi đã không đến và không nói với họ, thì họ đã chẳng có tội[a]. Nhưng bây giờ, họ không có cớ bào chữa cho tội của mình.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể hiểu theo ngữ cảnh: “họ đã không có tội này” hoặc “họ đã không phải chịu trách nhiệm về tội này.” Nguyên văn sát nghĩa là “họ đã chẳng có tội.”'
    reason: Bảo tồn sự mơ hồ giữa cách nói theo nghĩa đen “có tội” và ý nghĩa theo ngữ cảnh về trách nhiệm đối với việc khước từ lời Chúa Giê-su.
lexical_decisions:
- source_word: εἰ μὴ ἦλθον καὶ ἐλάλησα αὐτοῖς
  choice: Nếu tôi đã không đến và nói với họ
  rationale: Diễn đạt điều kiện trái với sự thật trong quá khứ bằng cấu trúc tự nhiên của tiếng Việt; “nói với họ” thể hiện rõ αὐτοῖς là đối tượng được nói với.
- source_word: ἁμαρτίαν οὐκ εἴχοσαν
  choice: họ đã chẳng có tội
  rationale: Giữ sát thành ngữ Gioan “có tội”, thay vì diễn giải ngay thành “không có lỗi” hay “không phải chịu trách nhiệm”; “đã chẳng” duy trì sắc thái giả định trái thực tế.
- source_word: νῦν δὲ
  choice: Nhưng bây giờ
  rationale: Giữ sự tương phản rõ giữa tình huống giả định trong quá khứ và thực trạng hiện nay.
- source_word: πρόφασιν οὐκ ἔχουσιν
  choice: họ không có cớ bào chữa
  rationale: “Cớ bào chữa” là cách nói tiếng Việt tự nhiên, chuyển tải nghĩa một lý do hoặc cái cớ dùng để biện hộ.
- source_word: περὶ τῆς ἁμαρτίας αὐτῶν
  choice: cho tội của mình
  rationale: Trong tiếng Việt, “cớ bào chữa cho” là kết hợp tự nhiên; đại từ phản thân “mình” quy chiếu rõ về chủ ngữ “họ”.
theological_decisions:
- issue: Cụm “họ đã chẳng có tội” có khẳng định họ hoàn toàn vô tội hay nói đến trách nhiệm đối với việc khước từ sự mặc khải của Chúa Giê-su
  choice: Giữ cách nói sát nguyên văn “họ đã chẳng có tội” trong chính văn.
  alternative: Diễn giải là “họ đã không mắc tội này” hoặc “họ đã không phải chịu trách nhiệm về tội này”.
  rationale: Ngữ cảnh nhấn mạnh trách nhiệm phát sinh khi Chúa Giê-su đến và phán với họ, nhưng nguyên văn chỉ nói “có tội”. Bản dịch giữ nguyên sức căng thần học ấy và nêu khả năng hiểu theo ngữ cảnh trong chú thích, thay vì âm thầm giới hạn nghĩa.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “tôi” theo lối xưng hô thông thường, không tự ý đưa sắc thái tôn xưng vào đại từ vốn không xuất hiện tường minh trong câu Hy Lạp. “Cớ bào chữa” tự nhiên hơn “lý do biện hộ” nhưng vẫn giữ được sắc thái của πρόφασις.
