source:
  edition: SBLGNT
  text: Αὕτη ἐστὶν ἡ ἐντολὴ ἡ ἐμὴ ἵνα ἀγαπᾶτε ἀλλήλους καθὼς ἠγάπησα ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/john/015/012.yaml
  text: 'This is my command: that you love one another just as I have loved you[a].'
translation:
  language: vi
  text: 'Đây là điều răn của Thầy: anh em hãy yêu thương nhau như Thầy đã yêu thương anh em.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Đây là điều răn của Thầy, ấy là anh em yêu thương nhau đúng như Thầy đã yêu thương anh em.”'
    reason: Nêu cách diễn đạt sát cấu trúc ἵνα hơn và khả năng nhấn mạnh sắc thái so sánh của καθὼς, trong khi không làm thay đổi ý chính.
lexical_decisions:
- source_word: Αὕτη ἐστὶν ἡ ἐντολὴ ἡ ἐμὴ
  choice: Đây là điều răn của Thầy
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt, vừa xác định điều răn cụ thể vừa giữ rõ thẩm quyền và quan hệ sở hữu được nhấn mạnh bởi ἡ ἐμὴ.
- source_word: ἵνα ἀγαπᾶτε ἀλλήλους
  choice: anh em hãy yêu thương nhau
  rationale: ἵνα giới thiệu nội dung của điều răn; “hãy” truyền đạt lực mệnh lệnh tự nhiên trong tiếng Việt. “Yêu thương nhau” là cách nói thông dụng, trang trọng vừa phải và giữ tính tương hỗ của ἀλλήλους.
- source_word: καθὼς
  choice: như
  rationale: Giữ quan hệ so sánh, cho thấy tình yêu của Chúa Giê-su là khuôn mẫu cho tình yêu giữa các môn đồ; tiếng Việt không cần thêm “đúng như” để diễn đạt đầy đủ ý này.
- source_word: ἠγάπησα ὑμᾶς
  choice: Thầy đã yêu thương anh em
  rationale: “Đã yêu thương” phản ánh thể aorist như một hành động có trước và mang tính xác định, không áp đặt cách hiểu hoàn thành vượt quá hình thái Hy Lạp. “Anh em” biểu thị đối tượng số nhiều trong ngữ cảnh các môn đồ.
theological_decisions:
- issue: Cách xưng hô của Chúa Giê-su với các môn đồ
  choice: Thầy / anh em
  alternative: Ta / các con; tôi / các bạn
  rationale: “Thầy / anh em” phù hợp quan hệ thầy–môn đồ trong mạch văn, tự nhiên và trang trọng trong tiếng Việt hiện đại, đồng thời tránh lối xưng hô quá cổ hoặc làm mờ vai trò của Chúa Giê-su.
- issue: Mức độ so sánh trong καθὼς
  choice: như Thầy đã yêu thương anh em
  alternative: đúng như Thầy đã yêu thương anh em
  rationale: “Như” bảo toàn việc tình yêu của Chúa Giê-su vừa là khuôn mẫu vừa là chuẩn mực, nhưng không tăng cường sắc thái vượt quá điều καθὼς tự nó đòi hỏi.
- issue: Sắc thái thời của ἠγάπησα
  choice: đã yêu thương
  alternative: vẫn luôn yêu thương; đã từng yêu thương
  rationale: Bản dịch giữ hành động quá khứ của aorist và sự liên hệ trực tiếp với mệnh lệnh hiện tại, không diễn giải thêm về thời lượng hay sự tiếp diễn.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “điều răn” thay vì “mệnh lệnh” để phù hợp văn cảnh lời dạy có thẩm quyền của Chúa Giê-su và giữ sự liên kết thuật ngữ trong diễn từ; dùng “yêu thương” tự nhiên hơn “yêu” khi nói về tình yêu tương hỗ giữa các môn đồ.
