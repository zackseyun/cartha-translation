  text: ταῦτα ἐντέλλομαι ὑμῖν ἵνα ἀγαπᾶτε ἀλλήλους.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/017.yaml
  text: These things I command you[b][a], so that you may love one another.
translation:
  language: vi
  text: Ta truyền cho anh em những điều này, để anh em yêu thương nhau.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể hiểu: “Ta truyền cho anh em điều này: hãy yêu thương nhau.” Mệnh đề Hy Lạp mở đầu bằng ἵνα có thể chỉ mục đích, hoặc gần với việc nêu nội dung của lời truyền.'
    reason: alternative_reading
lexical_decisions:
- source_word: ταῦτα
  choice: những điều này
  rationale: Giữ nghĩa số nhiều của đại từ chỉ định trung tính và tự nhiên gợi lại những lời dạy ngay trước đó.
- source_word: ἐντέλλομαι
  choice: Ta truyền
  rationale: Diễn đạt trực tiếp sắc thái ra lệnh, truyền dạy của động từ; tiếng Việt không cần dùng dấu hiệu tiếp diễn để thể hiện thì hiện tại trong ngữ cảnh này.
- source_word: ὑμῖν
  choice: cho anh em
  rationale: Thể hiện đại từ ngôi thứ hai số nhiều ở cách dữ cách. “Anh em” có sắc thái trang trọng, phù hợp lời Đức Giê-su nói với nhóm môn đồ mà không thêm danh xưng không có trong nguyên văn.
- source_word: ἵνα
  choice: để
  rationale: Giữ quan hệ mục đích hoặc kết quả dự định của mệnh đề ἵνα, đồng thời là cách nói tự nhiên trong tiếng Việt hiện đại.
- source_word: ἀγαπᾶτε
  choice: yêu thương
  rationale: Diễn đạt động từ ἀγαπάω theo lối tự nhiên và trang trọng trong tiếng Việt; hình thái giả định được thể hiện qua cấu trúc “để” chứ không cần thêm một trợ từ riêng.
- source_word: ἀλλήλους
  choice: nhau
  rationale: Đại từ tương hỗ tự nhiên trong tiếng Việt, diễn tả việc các thành viên trong nhóm yêu thương lẫn nhau.
theological_decisions:
- issue: Quan hệ giữa lời truyền và mệnh đề ἵνα
  choice: 'Dịch bằng “để”, cho thấy mục đích hoặc kết quả dự định: Đức Giê-su truyền những điều này để các môn đồ yêu thương nhau.'
  alternative: 'Có thể hiểu mệnh đề gần với nội dung của lời truyền: “Ta truyền cho anh em điều này: hãy yêu thương nhau.”'
  rationale: Cấu trúc Hy Lạp với ἵνα tự nhiên nhất là chỉ mục đích hoặc kết quả, nhưng trong văn phong Gio-an cũng có thể gần với chức năng giải thích nội dung. Bản dịch chính giữ cấu trúc mục đích, còn chú thích bảo lưu cách hiểu kia.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “Ta—anh em” giữ sắc thái uy nghiêm trong lời Đức Giê-su và cho thấy người nghe là một nhóm, nhưng không thêm quan hệ cha-con vốn không được biểu thị trực tiếp trong câu Hy Lạp.
