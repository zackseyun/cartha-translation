  text: ⸀Καὶ ἀπεσταλμένοι ἦσαν ἐκ τῶν Φαρισαίων.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/024.yaml
  text: And they had been sent from the Pharisees[a].
translation:
  language: vi
  text: Những người ấy đã được phái đến từ nhóm Pha-ri-si[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “Những người ấy đã được những người Pha-ri-si phái đến.” Tiếng Hy Lạp nói sát nghĩa là “từ những người Pha-ri-si”, nhấn mạnh nguồn gốc của họ.'
    reason: alternative_reading
lexical_decisions:
- source_word: Καὶ
  choice: không dịch riêng
  rationale: Trong ngữ cảnh, Καὶ nối câu này với câu trước; tiếng Việt tự nhiên không cần mở đầu bằng “Và”, trong khi mạch kể vẫn được duy trì.
- source_word: ἀπεσταλμένοι ἦσαν
  choice: đã được phái đến
  rationale: Kết cấu phân từ hoàn thành kết hợp với ἦσαν diễn tả việc sai phái đã xảy ra và tình trạng do việc ấy tạo nên; “đã được phái đến” vừa tự nhiên vừa giữ sắc thái bị động.
- source_word: ἐκ
  choice: từ phía
  rationale: ἐκ với sở hữu cách chủ yếu chỉ nguồn gốc hoặc xuất xứ. “Từ phía” giữ được ý đoàn người đến từ nhóm Pha-ri-si mà không khẳng định quá mức quan hệ tác nhân trực tiếp.
- source_word: τῶν Φαρισαίων
  choice: những người Pha-ri-si
  rationale: Cách gọi hiện đại, dễ hiểu đối với nhóm tôn giáo được chỉ định bởi Φαρισαῖοι; mạo từ được thể hiện tự nhiên qua “những người”.
theological_decisions:
- issue: Mối quan hệ giữa những người được sai đến và nhóm Pha-ri-si
  choice: Họ được phái đến từ phía những người Pha-ri-si, nhấn mạnh nguồn gốc của phái đoàn.
  alternative: Họ được những người Pha-ri-si phái đến, nhấn mạnh người thực hiện việc sai phái.
  rationale: Giới từ ἐκ trực tiếp biểu thị nguồn gốc hơn là tác nhân. Bản dịch chính vì thế không xác quyết quá mức rằng người Pha-ri-si là tác nhân trực tiếp, nhưng chú thích vẫn nêu cách hiểu phù hợp với ngữ cảnh.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Phái đến” tự nhiên trong bối cảnh một đoàn người được cử đi; “từ phía” bảo tồn sự phân biệt giữa nguồn gốc và tác nhân.
