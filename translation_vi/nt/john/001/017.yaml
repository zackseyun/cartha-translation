  source_fidelity: Chính văn truyền đạt đúng quan hệ giải thích của ὅτι, thế bị động của ἐδόθη, vai trò trung gian của διά với sở hữu cách, và sự đối chiếu có chủ ý giữa “đã được ban” và ἐγένετο. Không thêm liên từ đối lập là đúng. “Giê-su, Đấng Mê-si” diễn đạt được giá trị tước hiệu của Ἰησοῦ Χριστοῦ.
  naturalness: Câu văn cân xứng, trang trọng và tự nhiên trong tiếng Việt hiện đại. Dấu phẩy trong “Giê-su, Đấng Mê-si” là chấp nhận được cho ngữ đồng vị giải thích.
  terminology: “Luật pháp”, “ân điển” và “chân lý” là các thuật ngữ Kinh Thánh đã ổn định và phù hợp với ngữ cảnh Giăng. Cách dịch tước hiệu “Đấng Mê-si” giữ được nghĩa của Χριστός. Tuy nhiên, chú thích nên nêu một cách gọi truyền thống Việt ngữ nhất quán, thay vì thêm dạng “Giê-su Christ”, vốn không phải là cách phiên âm Việt ngữ chuẩn và không cần thiết.
