id: JHN.1.17
reference: John 1:17
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὅτι ὁ νόμος διὰ Μωϋσέως ἐδόθη, ἡ χάρις καὶ ἡ ἀλήθεια διὰ Ἰησοῦ Χριστοῦ ἐγένετο.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/017.yaml
  text: For the law was given through Moses[a]; grace and truth came through Jesus the Messiah.
translation:
  language: vi
  text: Vì luật pháp đã được ban qua Môi-se; ân điển và chân lý đã đến qua Giê-su, Đấng Mê-si[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cách gọi truyền thống: “Giê-su Ki-tô”.'
    reason: Ghi nhận cách gọi truyền thống của tước hiệu Χριστός, trong khi chính văn dịch nghĩa tước hiệu là “Đấng Mê-si”.
lexical_decisions:
- source_word: ὅτι
  choice: Vì
  rationale: Trong mạch văn, từ này đưa ra lời giải thích cho câu trước; “Vì” giữ được quan hệ giải thích-nguyên nhân một cách tự nhiên.
- source_word: ὁ νόμος
  choice: luật pháp
  rationale: Chỉ toàn bộ luật pháp gắn với Môi-se. Cách dịch này rõ nghĩa trong tiếng Việt và không cần thêm cách viết hoa vốn không có trong bản Hy Lạp.
- source_word: διὰ Μωϋσέως
  choice: qua Môi-se
  rationale: διά với sở hữu cách diễn tả vai trò trung gian; “qua” vừa gọn vừa duy trì sự song song với cụm từ nói về Giê-su.
- source_word: ἐδόθη
  choice: đã được ban
  rationale: Giữ thể bị động của động từ và diễn đạt hành động ban luật trong quá khứ mà không xác định thêm chủ thể vốn không được nêu trực tiếp.
- source_word: ἡ χάρις
  choice: ân điển
  rationale: Diễn đạt ý nghĩa phong phú của χάρις là ân huệ nhưng không do công trạng, đồng thời phù hợp với ngữ cảnh thần học của Giăng.
- source_word: ἡ ἀλήθεια
  choice: chân lý
  rationale: Giữ ý nghĩa về điều thật được bày tỏ, đồng thời nối lại cách dùng tương ứng ở Giăng 1:14.
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: qua Giê-su, Đấng Mê-si
  rationale: “Qua” giữ ý nghĩa trung gian. Χριστός được dịch theo nghĩa tước hiệu là “Đấng Mê-si”; dấu phẩy giúp người đọc nhận ra đây là tước hiệu của Giê-su.
- source_word: ἐγένετο
  choice: đã đến
  rationale: Diễn đạt tự nhiên việc ân điển và chân lý xuất hiện trong lịch sử qua Giê-su, đồng thời duy trì sự khác biệt với “đã được ban” ở vế trước.
theological_decisions:
- issue: Cách dịch Χριστοῦ trong Ἰησοῦ Χριστοῦ
  choice: Giê-su, Đấng Mê-si
  alternative: Giê-su Ki-tô / Giê-su Christ
  rationale: Dịch Χριστός như một tước hiệu để truyền đạt nghĩa “Đấng được xức dầu”, thay vì chỉ phiên âm. Chú thích giữ cách gọi truyền thống quen thuộc.
- issue: Mối quan hệ giữa luật pháp với ân điển và chân lý
  choice: Giữ hai vế song song, phân cách bằng dấu chấm phẩy
  alternative: Thêm từ nối đối lập như “nhưng” hoặc “còn”
  rationale: Bản Hy Lạp đặt hai mệnh đề cạnh nhau mà không có liên từ đối lập. Vì vậy không thêm “nhưng”, tránh biến sự tương phản ngầm thành một đối lập tuyệt đối về thần học.
translation_notes:
  register: 'Văn phong hiện đại, trang trọng và dễ hiểu. Giữ cấu trúc hai vế cân xứng của nguyên văn, không thêm chủ thể thần linh hoặc liên từ đối lập không có trong tiếng Hy Lạp. Dùng các dạng tên quen thuộc trong tiếng Việt: “Môi-se”, “Giê-su” và “Đấng Mê-si”.'
