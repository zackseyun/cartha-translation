id: JHN.1.25
reference: John 1:25
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἠρώτησαν αὐτὸν καὶ εἶπαν αὐτῷ· Τί οὖν βαπτίζεις εἰ σὺ οὐκ εἶ ὁ χριστὸς ⸂οὐδὲ Ἠλίας οὐδὲ⸃ ὁ προφήτης;
base_translation:
  language: en
  yaml_path: translation/nt/john/001/025.yaml
  text: And they asked him and said to him[a], “Why then are you baptizing, if you are not the Messiah, nor Elijah[b], nor the Prophet?”
translation:
  language: vi
  text: 'Họ hỏi ông và nói: “Vậy, tại sao ông làm phép báp-têm, nếu ông không phải là Đấng Mê-si[a], cũng không phải Ê-li, cũng không phải Đấng Tiên Tri[b]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “Đấng Christ.” Tước hiệu Hy Lạp Χριστός (Christos) được dịch ở đây là “Đấng Mê-si” để giữ bối cảnh về niềm trông đợi của người Do Thái.
    reason: alternative_reading
  - marker: b
    text: “Đấng Tiên Tri” có thể chỉ vị tiên tri giống như Môi-se mà dân chúng trông đợi (xem Phục Truyền Luật Lệ Ký 18:15).
    reason: cross_reference
lexical_decisions:
- source_word: ἠρώτησαν αὐτὸν καὶ εἶπαν αὐτῷ
  choice: Họ hỏi ông
  rationale: Tiếng Hy Lạp dùng hai động từ theo công thức dẫn lời, theo sát là ‘họ hỏi ông và nói với ông’. Trong tiếng Việt hiện đại, ‘họ hỏi ông’ tự nhiên và đã bao hàm hành vi nói, tránh lối diễn đạt nặng nề mà vẫn giữ đúng chức năng trần thuật.
- source_word: Τί οὖν
  choice: Vậy, tại sao
  rationale: τί về hình thức là ‘gì’, nhưng trong cấu trúc này hỏi lý do hoặc căn cứ của hành động; ‘Vậy, tại sao’ truyền đạt tự nhiên cả quan hệ suy luận của οὖν.
- source_word: βαπτίζεις
  choice: ông làm phép báp-têm
  rationale: Động từ hiện tại chỉ hoạt động Giăng đang thực hiện. ‘Làm phép báp-têm’ là cách nói rõ nghĩa và quen thuộc trong tiếng Việt, không thêm chủ thể chịu phép vốn không được nêu trong câu.
- source_word: ὁ χριστός
  choice: Đấng Mê-si
  rationale: Χριστός ở đây là tước hiệu của nhân vật được trông đợi. ‘Đấng Mê-si’ giữ bối cảnh Do Thái và biểu thị rõ đây không phải tên riêng.
- source_word: Ἠλίας
  choice: Ê-li
  rationale: Dùng dạng tên Kinh Thánh quen thuộc trong tiếng Việt hiện đại.
- source_word: ὁ προφήτης
  choice: Đấng Tiên Tri
  rationale: Mạo từ và ngữ cảnh cho thấy một nhân vật tiên tri xác định đang được trông đợi, chứ không phải bất kỳ tiên tri nào; ‘Đấng Tiên Tri’ giữ sắc thái tước hiệu.
- source_word: οὐδὲ ... οὐδὲ
  choice: cũng không phải ... cũng không phải
  rationale: Cấu trúc lặp này chuyển tải rõ chuỗi ba sự phủ định trong tiếng Việt tự nhiên.
theological_decisions:
- issue: Cách dịch Χριστός trong câu hỏi về căn tính
  choice: Đấng Mê-si
  alternative: Đấng Christ
  rationale: Từ này được dùng như tước hiệu trong bối cảnh kỳ vọng của người Do Thái. ‘Đấng Mê-si’ bảo toàn bối cảnh ấy mà không biến tước hiệu thành tên riêng.
- issue: ὁ προφήτης có chỉ một nhân vật được trông đợi cụ thể hay không
  choice: Đấng Tiên Tri
  alternative: nhà tiên tri ấy
  rationale: Mạo từ xác định và việc liệt kê riêng sau Đấng Mê-si và Ê-li ủng hộ cách hiểu đây là một nhân vật được nhận biết trong niềm mong đợi. Cách viết hoa biểu thị tước hiệu nhưng chú thích chỉ nói ‘có thể’ để không khẳng định quá mức điều câu này không giải thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ cách xưng hô ‘ông’ phù hợp với cuộc chất vấn chính thức; lược công thức kép ‘hỏi... và nói...’ vì trong tiếng Việt sẽ nặng nề. Các tước hiệu được viết hoa để biểu thị nhân vật xác định, không nhằm áp đặt một cách giải thích hệ phái.
