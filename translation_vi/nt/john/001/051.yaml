- from: 'Ngài phán với ông: “Quả thật, quả thật, tôi nói với các anh[a]: Các anh sẽ thấy trời mở ra, và các thiên sứ của Đức Chúa Trời đi lên đi xuống trên Con Người.”[b]'
  to: 'Ngài phán với ông: “Quả thật, quả thật, tôi nói với các anh[a]: Các anh sẽ thấy trời đã mở, và các thiên sứ của Đức Chúa Trời đi lên đi xuống trên Con Người.”[b]'
  rationale: Chỉ sửa “trời mở ra” thành “trời đã mở” để biểu đạt trạng thái do hành động đã hoàn tất trong nguyên văn Hy Lạp. Các yếu tố khác của bản dịch và toàn bộ hệ thống chú thích được giữ nguyên vì chúng truyền đạt đúng số nhiều, hình ảnh liên văn bản và sự mơ hồ có chủ ý của câu.
