  source_fidelity: 'Bản dịch giữ đúng cấu trúc chính: lời kể hướng đến một người rồi lời nói trực tiếp chuyển sang số nhiều; công thức Ἀμὴν ἀμὴν, các thiên sứ, cặp “đi lên đi xuống,” và danh xưng “Con Người” đều được bảo toàn. Tuy nhiên, “trời mở ra” dễ được hiểu là một biến cố đang xảy ra, trong khi phân từ hoàn thành ἀνεῳγότα mô tả trời trong trạng thái đã được mở. “Trời đã mở” chuyển đạt nét hoàn thành này rõ hơn mà không thêm diễn giải.'
  naturalness: Văn phong nhìn chung hiện đại, trang trọng và tự nhiên. “Ngài phán với ông” cùng “tôi nói với các anh” chấp nhận được trong lối văn Kinh Thánh hiện đại; “các anh” cũng biểu thị rõ số nhiều trong bối cảnh các môn đồ nam đang hiện diện. Sửa “trời mở ra” thành “trời đã mở” giúp câu Việt vừa sát nghĩa vừa trôi chảy.
  terminology: “Đức Chúa Trời,” “các thiên sứ,” và “Con Người” là các thuật ngữ phù hợp và nhất quán. “Trên Con Người” bảo lưu tính không gian và độ mở của ἐπί, không áp đặt một diễn giải về phương tiện hay địa điểm. Chú thích về số nhiều và hồi tưởng Sáng Thế Ký 28:12 đều hữu ích, với các neo chú thích đặt đúng vào nội dung liên quan.
