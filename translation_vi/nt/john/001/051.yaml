id: JHN.1.51
reference: John 1:51
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτῷ· Ἀμὴν ἀμὴν λέγω ⸀ὑμῖν, ὄψεσθε τὸν οὐρανὸν ἀνεῳγότα καὶ τοὺς ἀγγέλους τοῦ θεοῦ ἀναβαίνοντας καὶ καταβαίνοντας ἐπὶ τὸν υἱὸν τοῦ ἀνθρώπου.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/051.yaml
  text: And he said to him[a], “Truly, truly, I say to you[b], you will see heaven opened and the angels of God ascending and descending on the Son of Man.”
translation:
  language: vi
  text: 'Ngài phán với ông: “Quả thật, quả thật, tôi nói với các anh[a]: Các anh sẽ thấy trời đã mở, và các thiên sứ của Đức Chúa Trời đi lên đi xuống trên Con Người.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Trong tiếng Hy Lạp, “các anh” ở cả “tôi nói với các anh” và “các anh sẽ thấy” đều là số nhiều; lời kể ngay trước đó lại nói Đức Giê-su phán với riêng Na-tha-na-ên.
    reason: lexical_alternative
  - marker: b
    text: Hình ảnh này gợi lại giấc mơ của Gia-cốp trong Sáng Thế Ký 28:12, nhưng ở đây các thiên sứ đi lên đi xuống trên Con Người.
    reason: cross_reference
lexical_decisions:
- source_word: Ἀμὴν ἀμὴν
  choice: Quả thật, quả thật
  rationale: Giữ nguyên công thức được lặp đôi để nhấn mạnh và diễn đạt rõ sức nặng long trọng của lời mở đầu bằng tiếng Việt hiện đại, thay vì để nguyên âm A-men.
- source_word: ὑμῖν / ὄψεσθε
  choice: với các anh / Các anh sẽ thấy
  rationale: Cả đại từ và động từ đều ở số nhiều. “Các anh” biểu thị rõ sự chuyển đổi từ lời kể hướng đến riêng Na-tha-na-ên sang lời tuyên bố dành cho nhiều người.
- source_word: τὸν οὐρανὸν ἀνεῳγότα
  choice: trời mở ra
  rationale: Diễn đạt trạng thái trời đã được mở theo lối nói tự nhiên của tiếng Việt mà không thêm nét nghĩa diễn giải như “đứng rộng mở”.
- source_word: ἀγγέλους
  choice: các thiên sứ
  rationale: Trong khải tượng này, đặc biệt khi các vị ấy được gọi là thuộc về Đức Chúa Trời, từ ngữ chỉ các hữu thể thiên giới chứ không phải sứ giả loài người.
- source_word: ἀναβαίνοντας καὶ καταβαίνοντας
  choice: đi lên đi xuống
  rationale: Cặp động từ chỉ hướng được giữ sát, rõ ràng và tự nhiên, đồng thời bảo tồn âm vang của Sáng Thế Ký 28:12.
- source_word: ἐπὶ τὸν υἱὸν τοῦ ἀνθρώπου
  choice: trên Con Người
  rationale: “Trên” giữ hình ảnh các thiên sứ chuyển động trong mối liên hệ với Con Người mà không giải thích thêm bản chất của mối liên hệ ấy.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Con Người
  rationale: Giữ danh xưng tự chỉ của Đức Giê-su cùng âm hưởng Kinh Thánh và khải huyền của danh xưng này, thay vì thay bằng một cách diễn giải.
theological_decisions:
- issue: Lời kể dùng số ít αὐτῷ (“với ông”), nhưng lời Đức Giê-su dùng số nhiều ὑμῖν và ὄψεσθε.
  choice: Biểu thị trực tiếp số nhiều bằng “các anh” và ghi chú sự chuyển đổi phạm vi người nghe.
  alternative: Dùng đại từ không làm rõ số hoặc chỉ nói với riêng Na-tha-na-ên.
  rationale: Tiếng Việt có thể thể hiện số nhiều một cách tự nhiên; làm vậy bảo tồn sự mở rộng có chủ ý trong câu Hy Lạp mà không cần giới hạn lời hứa vào riêng Na-tha-na-ên.
- issue: Hình ảnh các thiên sứ đi lên đi xuống gợi lại giấc mơ của Gia-cốp trong Sáng Thế Ký 28:12, nhưng ở đây được quy tụ nơi Con Người.
  choice: Giữ nguyên hình ảnh trong chính văn và nêu liên hệ liên văn bản trong chú thích.
  alternative: Diễn giải ngay trong chính văn rằng Đức Giê-su là chiếc thang hoặc nơi gặp gỡ giữa trời và đất.
  rationale: Bản văn không gọi Con Người là “chiếc thang”; việc thêm lời giải thích ấy sẽ thu hẹp hình ảnh và giải quyết một hàm ý thần học mà câu Hy Lạp để ngỏ.
- issue: Phạm vi nghĩa của ἐπί trong cụm ἐπὶ τὸν υἱὸν τοῦ ἀνθρώπου.
  choice: Dịch là “trên Con Người”.
  alternative: Dịch diễn giải là “quanh”, “đến với” hoặc “nhờ Con Người”.
  rationale: “Trên” bảo tồn hình ảnh không gian gây ấn tượng của nguyên văn và tránh xác định quá mức thiên sứ đi lên hoặc đi xuống theo cách nào trong quan hệ với Con Người.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Ngài” và “ông” giúp lời kể tự nhiên; trong lời nói trực tiếp, “tôi” và “các anh” tránh lối xưng hô cổ như “Ta/các ngươi”. Công thức “Quả thật, quả thật” giữ sự lặp đôi long trọng của nguyên văn. Dấu hai chấm sau “các anh” giúp câu tuyên bố tiếp theo rõ nhịp trong tiếng Việt.
