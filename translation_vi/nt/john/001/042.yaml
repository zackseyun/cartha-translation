language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸀ἤγαγεν αὐτὸν πρὸς τὸν Ἰησοῦν. ἐμβλέψας αὐτῷ ὁ Ἰησοῦς εἶπεν· Σὺ εἶ Σίμων ὁ υἱὸς ⸀Ἰωάννου, σὺ κληθήσῃ Κηφᾶς (ὃ ἑρμηνεύεται Πέτρος).
base_translation:
  language: en
  yaml_path: translation/nt/john/001/042.yaml
  text: He brought him to Jesus[a]. Looking at him, Jesus said, “You are Simon, the son of John[b]; you will be called Cephas” (which is translated Peter).
translation:
  language: vi
  text: 'Ông dẫn người ấy đến gặp Giê-su. Giê-su nhìn chăm chú vào người ấy và nói: “Anh là Si-môn, con của Giăng[a]; anh sẽ được gọi là Kê-pha[b]” (tên này được dịch là Phi-e-rơ).'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Một số thủ bản chép “Giô-na” thay cho “Giăng”; bản SBLGNT chép “Giăng”.
    reason: textual_variant
  - marker: b
    text: Kê-pha là tên A-ram tương ứng với Phi-e-rơ, mang nghĩa “đá” hoặc “hòn đá”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤγαγεν αὐτὸν πρὸς τὸν Ἰησοῦν
  choice: Ông đưa người ấy đến với Chúa Jêsus
  rationale: Động từ ἄγω ở thì aorist diễn tả hành động đưa một người đến gặp một người khác. Cách dịch này tự nhiên trong tiếng Việt và không thêm tên riêng vốn không có trong câu Hy Lạp.
- source_word: ἐμβλέψας αὐτῷ
  choice: nhìn chăm chú vào người ấy
  rationale: ἐμβλέπω gợi một cái nhìn có chủ ý, chăm chú hơn là chỉ thoáng nhìn; cách diễn đạt này giữ được sắc thái ấy mà vẫn tự nhiên.
- source_word: Σὺ εἶ Σίμων ὁ υἱὸς Ἰωάννου
  choice: Anh là Si-môn, con của Giăng
  rationale: Đại từ xưng hô “anh” phù hợp với lời nói trực tiếp trong tiếng Việt hiện đại mà không mang sắc thái cổ hoặc miệt thị. Bản văn SBLGNT đọc Ἰωάννου, tức Giăng.
- source_word: σὺ κληθήσῃ
  choice: anh sẽ được gọi là
  rationale: Giữ rõ ý tương lai và thể bị động của καλέω, đồng thời diễn đạt tự nhiên trong tiếng Việt.
- source_word: Κηφᾶς
  choice: Kê-pha
  rationale: Giữ đây là tên riêng bằng hình thức phiên âm quen thuộc trong tiếng Việt, thay vì dịch nghĩa ngay trong chính văn.
- source_word: ὃ ἑρμηνεύεται Πέτρος
  choice: tên này được dịch là Phi-e-rơ
  rationale: ἑρμηνεύεται giải thích tên Semit Kê-pha bằng tên Hy Lạp Phi-e-rơ. Thêm “tên này” chỉ để làm rõ chủ thể trong tiếng Việt, không thay đổi nội dung.
theological_decisions:
- issue: Cách thể hiện Kê-pha/Phi-e-rơ và ý nghĩa “đá”
  choice: Giữ cả Kê-pha và Phi-e-rơ như tên riêng trong chính văn; nêu nghĩa “đá” ở chú thích.
  alternative: Dịch trực tiếp tên thành “Đá” trong chính văn.
  rationale: Câu này thuật lại việc đặt tên và chính bản Hy Lạp đối chiếu tên Semit với tên Hy Lạp. Giữ hai tên không áp đặt một kết luận thần học về ý nghĩa của tên, trong khi chú thích vẫn bảo tồn mối liên hệ từ vựng.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “Chúa Jêsus” và các dạng tên quen thuộc Si-môn, Giăng, Kê-pha, Phi-e-rơ. Đại từ “ông/người ấy” giữ các tham chiếu của nguyên văn mà không tự ý đưa tên An-rê hoặc Si-môn vào lời kể; “anh” tạo lời nói trực tiếp tự nhiên, tránh “ngươi” mang sắc thái cổ.
