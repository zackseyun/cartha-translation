id: JHN.1.23
reference: John 1:23
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἔφη· Ἐγὼ φωνὴ βοῶντος ἐν τῇ ἐρήμῳ· Εὐθύνατε τὴν ὁδὸν κυρίου, καθὼς εἶπεν Ἠσαΐας ὁ προφήτης.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/023.yaml
  text: He said[a], “I am a voice of one crying out in the wilderness, ‘Make straight the way of the Lord,’ just as Isaiah the prophet said.”
translation:
  language: vi
  text: 'Ông đáp[a]: “Tôi là tiếng của người kêu lên trong hoang mạc: ‘Hãy làm cho thẳng con đường của Chúa,’ đúng như lời nhà tiên tri Ê-sai đã nói.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể ngắt câu, tuy kém tự nhiên hơn: Ông đáp: “Tôi là tiếng trong hoang mạc của người kêu lên.” Cụm từ Hy Lạp có thể được hiểu theo cách này, nhưng bản văn chính theo cách hiểu tự nhiên hơn trong ngữ cảnh.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἔφη
  choice: Ông đáp
  rationale: Trong mạch đối thoại trực tiếp, “đáp” tự nhiên hơn “nói” trong tiếng Việt, đồng thời vẫn thể hiện đúng động từ dẫn lời thông dụng.
- source_word: Ἐγὼ
  choice: Tôi
  rationale: Đại từ được nêu rõ để giữ lời tự nhận của Giăng; tiếng Việt không cần thêm “chính tôi” vì sẽ nhấn mạnh quá mức.
- source_word: φωνὴ
  choice: tiếng
  rationale: “Tiếng” diễn đạt tự nhiên hình ảnh một tiếng kêu trong tiếng Việt và không biến hình ảnh ấy thành danh xưng xác định.
- source_word: βοῶντος
  choice: của người kêu lên
  rationale: Giữ quan hệ sở hữu của phân từ sở hữu cách với φωνή và sắc thái công bố mạnh mẽ của động từ.
- source_word: ἐν τῇ ἐρήμῳ
  choice: trong hoang mạc
  rationale: “Hoang mạc” phù hợp với vùng đất hoang vắng trong bối cảnh Kinh Thánh, đồng thời giữ âm hưởng của lời trích dẫn tiên tri.
- source_word: Εὐθύνατε
  choice: Hãy làm cho thẳng
  rationale: Mệnh lệnh trực tiếp, tự nhiên và giữ nguyên hình ảnh sửa đường cho thẳng.
- source_word: τὴν ὁδὸν
  choice: con đường
  rationale: Vừa giữ hình ảnh cụ thể vừa có khả năng mang nghĩa ẩn dụ như nguyên văn.
- source_word: κυρίου
  choice: Chúa
  rationale: Giữ tước hiệu thần học trong lời trích từ Ê-sai mà không làm yếu sắc thái của κύριος.
- source_word: καθὼς
  choice: đúng như
  rationale: Nêu rõ sự tương ứng giữa lời tự nhận của Giăng và lời tiên tri.
- source_word: εἶπεν
  choice: đã nói
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt cho hành động nói xảy ra trước đó.
- source_word: Ἠσαΐας ὁ προφήτης
  choice: nhà tiên tri Ê-sai
  rationale: Trật tự này tự nhiên trong tiếng Việt và chuyển tải đầy đủ tên cùng chức danh.
theological_decisions:
- issue: Cách dịch κύριος trong lời trích dẫn Ê-sai
  choice: Chúa
  alternative: chủ
  rationale: “Chúa” giữ được sức nặng giao ước và thần học của lời tiên tri; “chủ” dễ bị hiểu thuần túy là người có quyền trên người khác.
- issue: Quan hệ của cụm “trong hoang mạc”
  choice: người kêu lên trong hoang mạc
  alternative: tiếng trong hoang mạc của người kêu lên
  rationale: 'Cách chính là lối phân tích cú pháp tự nhiên hơn: cụm giới từ bổ nghĩa cho hành động kêu lên. Chú thích giữ lại khả năng cấu trúc khác của tiếng Hy Lạp mà không quyết đoán quá mức.'
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ông” để nối lời người kể với Giăng trong đối thoại; giữ hình ảnh tiên tri bằng các cụm “tiếng”, “hoang mạc” và “làm cho thẳng con đường”. Dấu chú thích [a] được đặt ngay sau động từ dẫn lời vì chú thích liên quan đến cách ngắt và cấu trúc toàn bộ lời đáp.
