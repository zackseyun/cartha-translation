  text: ἦν τὸ φῶς τὸ ἀληθινὸν ὃ φωτίζει πάντα ἄνθρωπον ἐρχόμενον εἰς τὸν κόσμον.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/009.yaml
  text: The true light[a], which enlightens every person, was coming into the world.
translation:
  language: vi
  text: Ánh sáng thật, soi sáng mọi người, đang đến thế gian.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Ánh sáng thật, soi sáng mọi người đang đến thế gian.” Phân từ Hy Lạp được dịch là “đang đến” có thể bổ nghĩa cho “mọi người” thay vì cho “Ánh sáng thật”.'
    reason: alternative_reading
lexical_decisions:
- source_word: φῶς
  choice: ánh sáng
  rationale: Dùng danh từ thông thường “ánh sáng”, không viết hoa; ngữ cảnh cho thấy ý nghĩa quy chiếu về Đấng Christ mà không cần thêm cách diễn giải vào bản văn.
- source_word: ἀληθινόν
  choice: thật
  rationale: “Thật” tự nhiên trong tiếng Việt và giữ được sắc thái chân thật, đích thực, trọn vẹn của cách dùng trong Giăng.
- source_word: φωτίζει
  choice: soi sáng
  rationale: “Soi sáng” vừa giữ hình ảnh ánh sáng vừa có thể chuyển tải ý nghĩa thuộc linh, nhận thức trong ngữ cảnh.
- source_word: πάντα ἄνθρωπον
  choice: mọi người
  rationale: Diễn đạt tự nhiên đại từ nhân loại mang nghĩa khái quát, bao gồm từng người, mà không thu hẹp theo giới tính.
- source_word: ἐρχόμενον εἰς τὸν κόσμον
  choice: đang đến thế gian
  rationale: Trong bản chính, cụm phân từ được hiểu theo nghĩa gắn với “ánh sáng thật”; “đang đến” kết hợp với ἦν để diễn đạt tiến trình trong quá khứ theo mạch câu, còn cách gắn với “mọi người” được giữ trong chú thích.
- source_word: κόσμον
  choice: thế gian
  rationale: “Thế gian” là cách dịch trang trọng, quen thuộc và phù hợp với phạm vi ý nghĩa của κόσμος trong văn chương Giăng.
- source_word: ἦν
  choice: đang
  rationale: Kết hợp động từ ở thì chưa hoàn thành với phân từ “đến” thành “đang đến”, diễn đạt tự nhiên ý nghĩa của kết cấu Hy Lạp.
theological_decisions:
- issue: Quan hệ cú pháp của ἐρχόμενον (“đến”)
  choice: 'Hiểu theo nghĩa gắn với “ánh sáng thật”: “Ánh sáng thật ... đang đến thế gian.”'
  alternative: 'Gắn với “mọi người”: “Ánh sáng thật soi sáng mọi người đến thế gian.”'
  rationale: Về hình thái, phân từ giống đực số ít đối cách có thể bổ nghĩa cho ἄνθρωπον; tuy nhiên, ngữ cảnh Lời Tựa và cách dùng của Giăng ủng hộ việc hiểu đây là sự đến thế gian của Ánh Sáng. Chú thích bảo tồn cách hiểu cú pháp còn lại thay vì loại bỏ sự mơ hồ thật có trong nguyên văn.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Giữ hình ảnh chủ đạo “ánh sáng/soi sáng”, tránh viết hoa mang tính diễn giải, đồng thời dùng chú thích để bảo tồn sự mơ hồ cú pháp của nguyên văn.
