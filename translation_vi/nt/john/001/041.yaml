id: JHN.1.41
reference: John 1:41
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εὑρίσκει οὗτος ⸀πρῶτον τὸν ἀδελφὸν τὸν ἴδιον Σίμωνα καὶ λέγει αὐτῷ· Εὑρήκαμεν τὸν Μεσσίαν (ὅ ἐστιν μεθερμηνευόμενον χριστός).
base_translation:
  language: en
  yaml_path: translation/nt/john/001/041.yaml
  text: He first found his own brother Simon and said to him[a], “We have found the Messiah” (which means Messiah).
translation:
  language: vi
  text: 'Trước hết, ông tìm gặp người anh em ruột của mình là Si-môn[a] và nói với ông ấy: “Chúng tôi đã tìm thấy Đấng Mê-si-a” (dịch ra là “Đấng Christ”).'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Một số bản chép đọc: “Ông là người đầu tiên tìm gặp người anh em ruột của mình là Si-môn.”'
    reason: Dị bản πρῶτος thay cho πρῶτον có thể chuyển trọng tâm từ hành động đầu tiên của Anh-rê sang việc Anh-rê là người đầu tiên tìm gặp người anh em ruột của mình.
lexical_decisions:
- source_word: εὑρίσκει
  choice: tìm gặp
  rationale: Thì hiện tại lịch sử được chuyển sang lối kể tự nhiên trong tiếng Việt; “tìm gặp” diễn đạt việc tìm được một người, không chỉ bắt đầu tìm kiếm.
- source_word: οὗτος
  choice: ông
  rationale: Đại từ chỉ định này quy chiếu về Anh-rê trong ngữ cảnh; “ông” là cách quy chiếu tự nhiên và trang trọng trong lời kể tiếng Việt.
- source_word: πρῶτον
  choice: trước hết
  rationale: 'Giữ ý nghĩa trình tự của trạng từ: việc đầu tiên ông làm là tìm gặp Si-môn.'
- source_word: τὸν ἀδελφὸν τὸν ἴδιον
  choice: anh mình
  rationale: Ngữ cảnh cho biết Si-môn là anh/em trai của Anh-rê; “mình” giữ sắc thái thuộc về chính ông. Tiếng Việt cần chọn cách xưng hô theo quan hệ tuổi tác; truyền thống và cách dùng thông thường gọi Si-môn là anh của Anh-rê.
- source_word: λέγει αὐτῷ
  choice: nói với anh
  rationale: Chuyển hiện tại lịch sử sang lối kể tiếng Việt tự nhiên và dùng đại từ phù hợp với cách gọi Si-môn là anh.
- source_word: Εὑρήκαμεν
  choice: Chúng tôi đã tìm thấy
  rationale: Thể hoàn thành Hy Lạp diễn tả một phát hiện đã xảy ra và vẫn có ý nghĩa ở hiện tại; “đã tìm thấy” truyền đạt rõ kết quả ấy.
- source_word: Μεσσίαν
  choice: Đấng Mê-si-a
  rationale: Phiên âm danh hiệu gốc Semit, giữ bối cảnh Do Thái và sự phân biệt cần thiết với phần giải thích bằng tiếng Hy Lạp.
- source_word: μεθερμηνευόμενον
  choice: dịch ra là
  rationale: Động từ nói rõ việc chuyển danh hiệu từ một ngôn ngữ sang ngôn ngữ khác; cách dịch này tự nhiên và chính xác hơn việc chỉ nói “nghĩa là” trong ngữ cảnh.
- source_word: χριστός
  choice: Đấng Christ
  rationale: Giữ danh hiệu Hy Lạp tương ứng với “Mê-si-a”, nhờ đó phần ngoặc vẫn thực hiện chức năng giải thích sự tương đương giữa hai danh hiệu thay vì lặp lại cùng một từ tiếng Việt.
theological_decisions:
- issue: Cách chuyển hai danh hiệu Μεσσίας và χριστός
  choice: “Đấng Mê-si-a” ... “Đấng Christ”
  alternative: “Đấng Mê-si-a” ... “Đấng được xức dầu”
  rationale: Câu Hy Lạp chủ ý đặt danh hiệu Semit bên cạnh danh hiệu Hy Lạp tương ứng. Giữ hai dạng quen thuộc giúp bảo toàn cấu trúc giải thích của nguyên bản; phương án “Đấng được xức dầu” làm rõ nghĩa từ nguyên nhưng giảm yếu tố chuyển dịch giữa hai danh hiệu.
- issue: Ý nghĩa của πρῶτον
  choice: Trước hết, ông tìm gặp anh mình
  alternative: Ông là người đầu tiên tìm gặp anh mình
  rationale: Bản văn SBLGNT đọc trạng từ πρῶτον, tự nhiên nhất là chỉ trình tự hành động. Dị bản πρῶτος có thể nhấn mạnh Anh-rê là người đầu tiên; dị bản này được ghi ở chú thích thay vì đưa vào chính văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Si-môn” và “Mê-si-a” theo lối phiên âm quen thuộc; giữ “Christ” như danh hiệu Hy Lạp đã quen dùng trong tiếng Việt. Đại từ “ông/anh” tránh lối cổ nhưng vẫn tôn trọng nhân vật.
