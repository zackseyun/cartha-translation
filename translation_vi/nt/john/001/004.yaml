  text: ἐν αὐτῷ ζωὴ ἦν, καὶ ἡ ζωὴ ἦν τὸ φῶς τῶν ἀνθρώπων·
base_translation:
  language: en
  yaml_path: translation/nt/john/001/004.yaml
  text: In him was life[a], and the life was the light of men.
translation:
  language: vi
  text: Trong Ngài có sự sống, và sự sống ấy là ánh sáng của loài người.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν αὐτῷ
  choice: Trong Ngài
  rationale: Giữ nghĩa cơ bản của ἐν là “trong”; đại từ được hiểu theo ngữ cảnh là chỉ về Ngôi Lời với tính cách hữu vị. “Ngài” là cách nói tự nhiên, trang trọng trong tiếng Việt khi quy chiếu về Ngôi Lời.
- source_word: ζωὴ
  choice: sự sống
  rationale: Dịch trực tiếp ζωή, không thêm ý “đời đời” vốn không được nói rõ trong câu này.
- source_word: ἦν
  choice: có
  rationale: Trong cấu trúc tiếng Việt “trong Ngài có…”, “có” diễn đạt tự nhiên ý sự sống hiện hữu nơi Ngài; dịch máy móc là “đã là” sẽ không tự nhiên và có thể gây hiểu sai.
- source_word: ἡ ζωὴ
  choice: sự sống ấy
  rationale: Từ “ấy” thể hiện chức năng hồi chỉ của mạo từ Hy Lạp, nối rõ với “sự sống” vừa được nhắc đến.
- source_word: τὸ φῶς
  choice: ánh sáng
  rationale: Giữ nguyên hình ảnh trung tâm φῶς là “ánh sáng”, không diễn giải thêm ý nghĩa thần học.
- source_word: τῶν ἀνθρώπων
  choice: của loài người
  rationale: ἀνθρώπων ở đây chỉ con người nói chung. “Loài người” vừa tự nhiên trong tiếng Việt, vừa truyền đạt rõ nghĩa bao quát của danh từ số nhiều Hy Lạp.
theological_decisions:
- issue: Đối tượng quy chiếu và tính cách hữu vị của αὐτῷ
  choice: Dùng “Ngài”, hiểu đại từ là chỉ về Ngôi Lời.
  alternative: Dùng một đại từ phi nhân xưng như “nó” nếu λόγος được hiểu hoàn toàn trừu tượng.
  rationale: Mạch văn mở đầu sách Giăng trình bày Ngôi Lời trong tương quan hữu vị với Đức Chúa Trời và sau đó nói Ngôi Lời trở nên xác thịt. “Ngài” giữ được tính cách hữu vị mà không thêm danh xưng thần học vào chính câu này.
- issue: Phạm vi của ἀνθρώπων
  choice: Dịch là “loài người”, bao gồm toàn thể con người.
  alternative: “người ta” hoặc “nhân loại”.
  rationale: Danh từ Hy Lạp mang nghĩa chung về con người, không giới hạn ở nam giới. “Loài người” truyền đạt chính xác phạm vi bao quát và phù hợp với văn phong trang trọng của đoạn mở đầu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu giữ nhịp song hành của nguyên văn; “sự sống ấy” làm rõ sự hồi chỉ mà không diễn giải quá mức.
