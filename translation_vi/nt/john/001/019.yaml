id: JHN.1.19
reference: John 1:19
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ αὕτη ἐστὶν ἡ μαρτυρία τοῦ Ἰωάννου ὅτε ⸀ἀπέστειλαν οἱ Ἰουδαῖοι ἐξ Ἱεροσολύμων ἱερεῖς καὶ Λευίτας ἵνα ἐρωτήσωσιν αὐτόν· Σὺ τίς εἶ;
base_translation:
  language: en
  yaml_path: translation/nt/john/001/019.yaml
  text: And this is the testimony of John[a], when the Jews sent priests and Levites from Jerusalem to ask him, “Who are you?”
translation:
  language: vi
  text: 'Đây là lời chứng của Giăng[a], khi người Do Thái sai các thầy tế lễ và những người Lê-vi từ Giê-ru-sa-lem đến hỏi ông: “Ông là ai?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể hiểu là “các nhà lãnh đạo Do Thái” hoặc “người Giu-đê”. Trong sách Giăng, cụm từ “người Do Thái” thường đặc biệt chỉ giới chức tôn giáo tại Giu-đê, chứ không phải toàn thể dân Do Thái.
    reason: lexical_alternative
lexical_decisions:
- source_word: μαρτυρία
  choice: lời chứng
  rationale: Cách dịch tự nhiên trong tiếng Việt, đồng thời giữ sắc thái làm chứng và ngôn ngữ pháp lý nổi bật trong sách Giăng.
- source_word: τοῦ Ἰωάννου
  choice: của Giăng
  rationale: 'Hiểu sở hữu cách theo nghĩa chủ thể: lời chứng do Giăng đưa ra, không phải lời chứng nói về Giăng.'
- source_word: ὅτε
  choice: khi
  rationale: Giữ quan hệ thời gian trực tiếp của câu Hy Lạp và nối tự nhiên với hoàn cảnh lời chứng được đưa ra.
- source_word: ἀπέστειλαν
  choice: sai ... đến
  rationale: Trong tiếng Việt, “sai ... đến” diễn đạt tự nhiên hành động cử người từ Giê-ru-sa-lem tới gặp Giăng.
- source_word: οἱ Ἰουδαῖοι
  choice: người Do Thái
  rationale: Giữ cách gọi khái quát của nguyên văn; chú thích làm rõ rằng trong văn cảnh sách Giăng, cụm từ thường đặc biệt chỉ giới lãnh đạo tôn giáo tại Giu-đê.
- source_word: ἐξ Ἱεροσολύμων
  choice: từ Giê-ru-sa-lem
  rationale: Diễn đạt rõ địa điểm xuất phát bằng tiếng Việt tự nhiên.
- source_word: ἱερεῖς καὶ Λευίτας
  choice: các thầy tế lễ và người Lê-vi
  rationale: Giữ nguyên hai nhóm phục vụ liên quan đến đền thờ được phân biệt trong nguyên văn.
- source_word: ἵνα ἐρωτήσωσιν αὐτόν
  choice: đến hỏi ông
  rationale: Diễn đạt mục đích của mệnh đề ἵνα một cách gọn và tự nhiên; “ông” là đại từ tôn trọng thích hợp trong lời kể.
- source_word: Σὺ τίς εἶ;
  choice: Ông là ai?
  rationale: Câu hỏi trực tiếp, tự nhiên trong tiếng Việt; ngữ cảnh đối thoại đã đủ làm rõ sự nhấn mạnh vào người được hỏi.
theological_decisions:
- issue: Đối tượng được gọi là οἱ Ἰουδαῖοι trong sách Giăng
  choice: Dịch trong chính văn là “người Do Thái”, kèm chú thích giải thích phạm vi có thể hẹp hơn.
  alternative: “các nhà lãnh đạo Do Thái” hoặc “người Giu-đê”
  rationale: Cách này giữ độ khái quát và sự mơ hồ thật có của nguyên văn, nhưng tránh khiến độc giả hiểu cụm từ như một sự quy kết cho toàn thể dân tộc Do Thái. Việc họ sai các thầy tế lễ và người Lê-vi từ Giê-ru-sa-lem cho thấy giới chức tôn giáo đặc biệt nằm trong tầm nhìn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng các tên gọi Kinh Thánh quen thuộc “Giăng”, “Giê-ru-sa-lem”, “Lê-vi”; cấu trúc câu bám sát nguyên văn nhưng vẫn tự nhiên trong tiếng Việt.
