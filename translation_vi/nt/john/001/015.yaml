  to: 'Giăng làm chứng về Người và đã kêu lớn[a]: “Đây là Đấng mà tôi đã nói đến: ‘Đấng đến sau tôi đã vượt lên trước tôi[b], vì Người có trước tôi[c].’”'
  rationale: Chỉ thay ‘đã lớn tiếng tuyên bố’ bằng ‘đã kêu lớn’ để phản ánh trực tiếp và đầy đủ hơn κέκραγεν, đồng thời không thay đổi ý nghĩa của câu. Các phần còn lại cùng hệ thống chú thích đã bảo lưu hợp lý những khả năng ngữ nghĩa của nguyên ngữ.
