source:
  edition: SBLGNT
  text: (Ἰωάννης μαρτυρεῖ περὶ αὐτοῦ καὶ κέκραγεν λέγων· Οὗτος ἦν ⸂ὃν εἶπον⸃· Ὁ ὀπίσω μου ἐρχόμενος ἔμπροσθέν μου γέγονεν, ὅτι πρῶτός μου ἦν·)
base_translation:
  language: en
  yaml_path: translation/nt/john/001/015.yaml
  text: John testifies about him and has cried out[a], saying, “This was he of whom I said, ‘The one coming after me has become before me[b], because he was before me.’”
translation:
  language: vi
  text: 'Giăng làm chứng về Người và đã kêu lớn[a]: “Đây là Đấng mà tôi đã nói đến: ‘Đấng đến sau tôi đã vượt lên trước tôi[b], vì Người có trước tôi[c].’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dạng động từ Hy Lạp có thể được dịch sát hơn là “đã kêu lớn”; nó trình bày lời công bố đã vang lên và vẫn có hiệu lực trong lời chứng.
    reason: tense_and_lexical_note
  - marker: b
    text: 'Cũng có thể dịch: “đã có địa vị cao hơn tôi” hoặc, sát từng chữ hơn, “đã trở nên ở trước tôi.” Cụm Hy Lạp có thể chỉ sự ưu tiên hoặc địa vị, không chỉ vị trí hay thứ tự.'
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể hiểu: “Người đã hiện hữu trước tôi.” Bản dịch “có trước tôi” giữ gần cách diễn đạt Hy Lạp và để văn cảnh làm rõ hàm ý về sự tiền hữu.'
    reason: alternative_reading
lexical_decisions:
- source_word: μαρτυρεῖ περὶ αὐτοῦ
  choice: làm chứng về Người
  rationale: “Làm chứng” giữ được sắc thái nhân chứng của μαρτυρέω; thì hiện tại được diễn đạt tự nhiên trong tiếng Việt mà không cần thêm từ chỉ thời gian.
- source_word: κέκραγεν λέγων
  choice: đã lớn tiếng tuyên bố
  rationale: Cụm này thể hiện lời công bố công khai, mạnh mẽ. “Đã” phản ánh hình thái hoàn thành của κέκραγεν, còn “lớn tiếng tuyên bố” chuyển tải rõ động từ kêu lớn và phân từ “nói rằng” mà không tạo câu rườm rà.
- source_word: Οὗτος ἦν ὃν εἶπον
  choice: Đây là Đấng mà tôi đã nói đến
  rationale: Cách nói tự nhiên trong tiếng Việt, giữ quan hệ hồi chỉ của mệnh đề Hy Lạp. “Đấng” phù hợp với nhân vật đang được tôn kính trong văn cảnh, nhưng không thêm một tước hiệu thần học cụ thể.
- source_word: Ὁ ὀπίσω μου ἐρχόμενος
  choice: Đấng đến sau tôi
  rationale: Giữ ý thứ tự của ὀπίσω và diễn đạt phân từ hiện tại bằng một mệnh đề quan hệ ngắn gọn, tự nhiên.
- source_word: ἔμπροσθέν μου γέγονεν
  choice: đã vượt lên trước tôi
  rationale: Cách diễn đạt tiếng Việt dễ hiểu, chuyển tải việc người đến sau lại ở trước hoặc có địa vị ưu tiên hơn. Chú thích bảo lưu khả năng hiểu theo thứ tự, sự ưu tiên hoặc địa vị của nguyên ngữ.
- source_word: ὅτι πρῶτός μου ἦν
  choice: vì Người có trước tôi
  rationale: “Vì” giữ quan hệ nguyên nhân của ὅτι. “Có trước tôi” gần với cách nói Hy Lạp và vẫn để văn cảnh quyết định mức độ nhấn mạnh đến sự hiện hữu từ trước.
theological_decisions:
- issue: Mức độ diễn đạt rõ sự tiền hữu của Đấng Christ trong πρῶτός μου ἦν
  choice: vì Người có trước tôi
  alternative: vì Người đã hiện hữu trước tôi
  rationale: Bản dịch chính giữ cách nói cô đọng và độ mở của nguyên ngữ, không biến hàm ý tiền hữu thành một lời giải thích được thêm trực tiếp vào câu. Chú thích nêu cách hiểu rõ hơn mà văn cảnh có thể hỗ trợ.
- issue: Quan hệ giữa thứ tự đến sau và địa vị ở trước trong ἔμπροσθέν μου γέγονεν
  choice: đã vượt lên trước tôi
  alternative: đã trở nên ở trước tôi / đã có địa vị cao hơn tôi
  rationale: “Vượt lên trước” vừa tự nhiên vừa có thể gợi sự ưu tiên hoặc địa vị cao hơn, nhưng không giới hạn câu chỉ vào một nghĩa phẩm trật; chú thích nêu rõ phạm vi nghĩa.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Đại từ “Người” cùng danh từ “Đấng” thể hiện sự tôn kính phù hợp với văn cảnh mà không thêm một danh hiệu ngoài nguyên bản. Cấu trúc lời dẫn và lời trích lồng nhau được giữ rõ bằng dấu câu.
