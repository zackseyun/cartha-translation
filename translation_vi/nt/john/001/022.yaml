  text: εἶπαν οὖν αὐτῷ· Τίς εἶ; ἵνα ἀπόκρισιν δῶμεν τοῖς πέμψασιν ἡμᾶς· τί λέγεις περὶ σεαυτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/john/001/022.yaml
  text: So they said to him, “Who are you, so that we may give an answer to those who sent us? What do you say about yourself?”
translation:
  language: vi
  text: 'Vậy họ nói với ông: “Ông là ai, để chúng tôi trả lời những người đã sai chúng tôi? Ông nói gì về chính mình?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὖν
  choice: Vậy
  rationale: Đánh dấu sự tiếp nối mang tính suy luận từ cuộc trao đổi trước, đồng thời tự nhiên trong tiếng Việt hiện đại.
- source_word: εἶπαν ... αὐτῷ
  choice: họ hỏi ông
  rationale: Động từ λέγω có nghĩa cơ bản là nói, nhưng ở đây lời trực tiếp là câu hỏi; “hỏi ông” diễn đạt tự nhiên chức năng ngữ cảnh mà không thay đổi nội dung.
- source_word: Τίς εἶ;
  choice: Ông là ai?
  rationale: Giữ nguyên câu hỏi trực tiếp, ngắn gọn về căn tính; đại từ “ông” phù hợp với cách những người được sai đến nói với Giăng.
- source_word: ἵνα ἀπόκρισιν δῶμεν
  choice: để chúng tôi còn trả lời
  rationale: “Để” giữ ý mục đích của ἵνα; “trả lời” diễn đạt tự nhiên cụm nghĩa đen “đưa ra một câu trả lời”, còn “còn” cho thấy mục đích thực tiễn trong mạch đối thoại.
- source_word: τοῖς πέμψασιν ἡμᾶς
  choice: những người đã sai chúng tôi đến
  rationale: Chuyển phân từ có mạo từ thành mệnh đề quan hệ tự nhiên; thêm “đến” để hoàn chỉnh cách dùng động từ “sai” trong tiếng Việt mà không xác định thêm đích đến ngoài ngữ cảnh.
- source_word: τί λέγεις περὶ σεαυτοῦ
  choice: Ông nói gì về chính mình?
  rationale: Bảo toàn động từ “nói”, giới từ chỉ chủ đề và sắc thái phản thân nhấn mạnh của σεαυτοῦ.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Hai câu hỏi trực tiếp giữ nhịp dồn của nguyên văn; không thêm cách xác định căn tính hay hàm ý thần học ngoài câu Hy Lạp.
