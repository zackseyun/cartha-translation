review_pass:
  verdict: revise
  source_fidelity: 'Bản thảo nhận ra đúng sự đối lập giữa τὰ ἴδια (giống trung, số nhiều: những gì/lĩnh vực thuộc về Ngài) và οἱ ἴδιοι (giống đực, số nhiều: những người thuộc về Ngài). Tuy nhiên, “nơi vốn thuộc về mình” thu hẹp cụm thứ nhất thành địa điểm, trong khi nguyên ngữ để ngỏ phạm vi rộng hơn. Liên từ καί được dịch sát là “và”; sắc thái đối lập vẫn hiện rõ từ mệnh đề phủ định tiếp theo.'
  naturalness: Bản sửa dùng cấu trúc hiện đại, trang trọng và dễ hiểu. “Đến với những gì thuộc về Ngài” có phần sát cấu trúc nguyên ngữ nhưng tự nhiên trong văn phong Kinh Thánh và không áp đặt nghĩa “nhà” hay “lãnh địa”.
  terminology: Giữ “Ngài” nhất quán cho αὐτόν theo văn cảnh, “tiếp nhận” cho παρέλαβον, và giữ rõ đối lập ngữ pháp-ngữ nghĩa giữa hai lần dùng ἴδιος. Các ký hiệu chú thích được đặt đúng tại từ/cụm từ liên quan.
  issues:
