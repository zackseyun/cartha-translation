  text: εἰς τὰ ἴδια ἦλθεν, καὶ οἱ ἴδιοι αὐτὸν οὐ παρέλαβον.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/011.yaml
  text: He came to his own[b][a], and his own people did not receive him.
translation:
  language: vi
  text: Ngài đã đến với những gì thuộc về Ngài[a], và những người thuộc về Ngài đã không tiếp nhận Ngài[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Ngài đã đến nơi vốn thuộc về Ngài.” Cụm từ Hy Lạp ở đây là giống trung số nhiều, khác với cụm giống đực số nhiều “những người thuộc về Ngài” ở vế sau.'
    reason: alternative_reading
  - marker: b
    text: 'Cũng có thể dịch: “không chấp nhận” hoặc “không tiếp đón.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς τὰ ἴδια
  choice: đến nơi vốn thuộc về mình
  rationale: Cụm danh từ giống trung, số nhiều chỉ điều hoặc phạm vi thuộc về Ngài, khác với cụm giống đực theo sau chỉ người. “Nơi vốn thuộc về mình” tự nhiên trong tiếng Việt mà không giới hạn quá hẹp thành một ngôi nhà hay một vùng đất cụ thể.
- source_word: ἦλθεν
  choice: đã đến
  rationale: Động từ aorist của ἔρχομαι diễn tả việc Ngài đến; “đã đến” rõ ràng và tự nhiên trong mạch tường thuật.
- source_word: οἱ ἴδιοι
  choice: những người thuộc về Ngài
  rationale: Dạng giống đực, số nhiều chỉ người. Cách dịch này giữ sự tương phản có chủ ý với τὰ ἴδια ở vế trước.
- source_word: παρέλαβον
  choice: không tiếp nhận
  rationale: Trong ngữ cảnh, παραλαμβάνω có thể bao hàm việc đón nhận, chấp nhận hoặc tiếp đón một người. “Tiếp nhận” giữ được nghĩa rộng mà không quyết định quá mức sắc thái.
- source_word: αὐτόν
  choice: Ngài
  rationale: Đại từ chỉ Đấng được nhắc đến trong ngữ cảnh, tức Ngôi Lời; “Ngài” là cách xưng hô trang trọng, tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Sự khác biệt về đối tượng giữa τὰ ἴδια và οἱ ἴδιοι
  choice: Vế đầu nói đến nơi hoặc phạm vi vốn thuộc về Ngài; vế sau nói đến những người thuộc về Ngài.
  alternative: Cả hai vế đều chỉ dân riêng của Ngài; hoặc vế đầu chỉ riêng nhà hay gia đình của Ngài.
  rationale: Tiếng Hy Lạp chuyển từ giống trung số nhiều sang giống đực số nhiều, cho thấy một sự phân biệt có chủ ý giữa điều/phạm vi thuộc về Ngài và những người thuộc về Ngài. Bản dịch giữ sự phân biệt ấy nhưng không xác định vế đầu quá cụ thể.
- issue: Sắc thái của liên từ καί giữa hai vế
  choice: nhưng
  alternative: và
  rationale: Dù καί thường có nghĩa “và”, quan hệ giữa việc Ngài đến nơi thuộc về mình và việc người thuộc về Ngài không tiếp nhận Ngài mang sắc thái tương phản rõ rệt; “nhưng” diễn đạt tự nhiên sự tương phản này mà không thêm một kết luận thần học.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” cho đại từ chỉ Ngôi Lời; giữ rõ sự tương phản giữa nơi/phạm vi thuộc về Ngài và những người thuộc về Ngài. Mọi dấu chú thích đều được đặt ngay trong câu.
