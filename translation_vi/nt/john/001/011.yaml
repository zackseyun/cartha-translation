    issue: “nơi vốn thuộc về mình” giới hạn τὰ ἴδια vào một nơi chốn.
    rationale: τὰ ἴδια là giống trung số nhiều và có thể chỉ những gì thuộc về Ngài, phạm vi/lĩnh vực của Ngài, hoặc nơi chốn của Ngài. Dịch là “nơi” chọn một khả năng cụ thể hơn nguyên ngữ.
  - severity: low
    issue: “nhưng” diễn giải liên từ καί.
    rationale: Dù quan hệ ngữ cảnh có tính tương phản, καί được dùng trực tiếp là “và”. “Và” giữ sát văn bản hơn mà không làm mất sự tương phản thực tế của câu.
