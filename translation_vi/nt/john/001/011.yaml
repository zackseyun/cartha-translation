  to: Ngài đã đến với những gì thuộc về Ngài[a], và những người thuộc về Ngài đã không tiếp nhận Ngài[b].
  rationale: Sửa cụm đầu để phản ánh mà không thu hẹp giống trung số nhiều τὰ ἴδια, đồng thời chuyển “nhưng” thành “và” theo καί. Chú thích a nay nêu phương án “nơi” như một khả năng, thay vì để bản văn chính bị giới hạn vào cách hiểu ấy.
