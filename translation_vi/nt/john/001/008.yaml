  text: οὐκ ἦν ἐκεῖνος τὸ φῶς, ἀλλ’ ἵνα μαρτυρήσῃ περὶ τοῦ φωτός.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/008.yaml
  text: He was not the light[a], but came to bear witness about the light.
translation:
  language: vi
  text: Ông không phải là ánh sáng, nhưng đến để làm chứng về ánh sáng ấy.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát hơn: “Ông không phải là ánh sáng, nhưng để làm chứng về ánh sáng ấy.” Trong vế thứ hai, nguyên văn Hy Lạp tỉnh lược động từ, và động từ này được hiểu theo ngữ cảnh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἦν ἐκεῖνος
  choice: Ông không phải
  rationale: Cụm phủ định với đại từ chỉ định nhấn mạnh phân biệt Giăng với ánh sáng. “Ông” là cách quy chiếu tự nhiên, trang trọng trong tiếng Việt hiện đại, dựa vào nhân vật đã nêu ở ngữ cảnh trước.
- source_word: τὸ φῶς
  choice: ánh sáng / ánh sáng ấy
  rationale: Giữ hình ảnh “ánh sáng” và tính xác định của danh từ; lần thứ hai thêm “ấy” để quy chiếu rõ đến ánh sáng cụ thể đã được nói đến.
- source_word: ἀλλ’ ἵνα
  choice: nhưng đến để
  rationale: Nguyên văn có một cấu trúc tỉnh lược sau ἀλλά; “đến để” bổ sung tối thiểu từ ngữ được hàm ý theo ngữ cảnh và diễn đạt tự nhiên mục đích trong tiếng Việt.
- source_word: μαρτυρήσῃ
  choice: làm chứng
  rationale: “Làm chứng” giữ được sắc thái chứng thực và là cách diễn đạt quen thuộc, rõ nghĩa trong tiếng Việt.
- source_word: περὶ τοῦ φωτός
  choice: về ánh sáng ấy
  rationale: περί với sở hữu cách diễn tả đối tượng của lời chứng; “về” là tương đương tự nhiên nhất.
theological_decisions:
- issue: Căn tính và vai trò của Giăng so với ánh sáng
  choice: Câu dịch phủ nhận Giăng là ánh sáng và trình bày mục đích của ông là làm chứng về ánh sáng ấy.
  alternative: 'Dịch sát cấu trúc tỉnh lược: “Ông không phải là ánh sáng, nhưng để làm chứng về ánh sáng ấy.”'
  rationale: Cách dịch duy trì sự phân biệt giữa người làm chứng và ánh sáng, đồng thời không thêm lời giải thích thần học ngoài câu văn. Động từ “đến” được bổ sung từ ngữ cảnh để câu tiếng Việt trọn nghĩa.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “ông” để chỉ Giăng, “làm chứng” cho thuật ngữ chủ đạo μαρτυρέω, và đặt dấu chú thích ngay sau câu.
