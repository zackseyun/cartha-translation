  source_fidelity: 'Bản dịch phản ánh sát cấu trúc và ý nghĩa của Hy Lạp: ὅσοι δὲ được chuyển là “Nhưng tất cả những ai”; ἔλαβον αὐτόν là “tiếp nhận Ngài”; ἔδωκεν αὐτοῖς ἐξουσίαν là “Ngài ban cho họ quyền”; và γενέσθαι giữ đúng sắc thái chuyển trạng thái qua “trở nên”. “Con cái Đức Chúa Trời” phản ánh chính xác τέκνα θεοῦ. Vế “tức là những người tin vào danh Ngài” bảo tồn cụm xác định/apposition τοῖς πιστεύουσιν εἰς τὸ ὄνομα αὐτοῦ, không lược bỏ một trong hai cách diễn đạt của nguyên văn.'
  naturalness: Câu văn tự nhiên, trang trọng và dễ hiểu trong tiếng Việt hiện đại. “Tiếp nhận Ngài,” “ban cho họ quyền,” và “trở nên con cái Đức Chúa Trời” là các cách diễn đạt thông dụng, phù hợp văn cảnh Kinh Thánh mà không quá cổ. Dấu gạch ngang và “tức là” giúp người đọc nhận ra quan hệ giải thích của vế cuối.
  terminology: “Quyền” là lựa chọn phù hợp cho ἐξουσία trong ngữ cảnh quyền/đặc quyền được ban; chú thích nêu “thẩm quyền” và “khả năng” cách cân bằng, không ép một sắc thái duy nhất. “Con cái Đức Chúa Trời” tránh thu hẹp τέκνα thành giới nam. Đại từ tôn kính “Ngài” và danh xưng “Đức Chúa Trời” nhất quán với thanh ghi đã chọn.
