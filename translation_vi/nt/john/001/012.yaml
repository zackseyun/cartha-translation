id: JHN.1.12
reference: John 1:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὅσοι δὲ ἔλαβον αὐτόν, ἔδωκεν αὐτοῖς ἐξουσίαν τέκνα θεοῦ γενέσθαι, τοῖς πιστεύουσιν εἰς τὸ ὄνομα αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/john/001/012.yaml
  text: But to all who received him[a], he gave them the right to become children of God—to those who believe in his name,
translation:
  language: vi
  text: Nhưng tất cả những ai tiếp nhận Ngài, Ngài ban cho họ quyền[a] trở nên con cái Đức Chúa Trời—tức là những người tin vào danh Ngài.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “thẩm quyền” hoặc “khả năng”; từ Hy Lạp có thể chỉ thẩm quyền được trao, quyền hợp pháp, hoặc năng lực.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅσοι δὲ
  choice: Nhưng tất cả những ai
  rationale: “Nhưng” thể hiện sự tương phản với việc không tiếp nhận ở câu trước; “tất cả những ai” giữ được ý nghĩa tập thể, bao quát của ὅσοι.
- source_word: ἔλαβον αὐτόν
  choice: tiếp nhận Ngài
  rationale: Trong ngữ cảnh này, λαμβάνω nói đến việc đón nhận Ngôi Lời, không phải cầm lấy theo nghĩa vật lý. “Tiếp nhận” tự nhiên và không thu hẹp ý nghĩa thành một quyết định thuần trí óc.
- source_word: ἔδωκεν αὐτοῖς
  choice: Ngài ban cho họ
  rationale: Diễn đạt trực tiếp hành động ban điều gì đó cho những người đã tiếp nhận Ngài; “ban” phù hợp với văn phong trang trọng và ngữ cảnh ân huệ.
- source_word: ἐξουσίαν
  choice: quyền
  rationale: Ở đây từ này chỉ quyền được ban để bước vào địa vị con cái Đức Chúa Trời. “Quyền” tự nhiên trong tiếng Việt, đồng thời chú thích giữ lại các sắc thái thẩm quyền và khả năng.
- source_word: τέκνα θεοῦ
  choice: con cái Đức Chúa Trời
  rationale: τέκνα là từ bao gồm cả nam lẫn nữ, nên “con cái” chính xác hơn “các con trai” và không đưa thêm sắc thái giới tính không có trong nguyên văn.
- source_word: γενέσθαι
  choice: trở nên
  rationale: Giữ ý chuyển sang một tình trạng hay địa vị mới của γίνομαι, thay vì chỉ diễn đạt trạng thái “là”.
- source_word: τοῖς πιστεύουσιν εἰς τὸ ὄνομα αὐτοῦ
  choice: tức là những người tin vào danh Ngài
  rationale: Cụm này xác định rõ hơn những người tiếp nhận Ngài. “Tin vào danh Ngài” giữ nguyên hình ảnh “danh”, chỉ con người và căn tính được bày tỏ của Ngài.
theological_decisions:
- issue: Mối quan hệ giữa “tiếp nhận Ngài” và “tin vào danh Ngài”
  choice: Giữ cả hai cách diễn đạt và dùng “tức là” để cho thấy cụm sau xác định rõ cụm trước.
  alternative: Gộp hai cụm thành một ý duy nhất và chỉ dịch một trong hai.
  rationale: Nguyên văn giữ cả ἔλαβον αὐτόν và τοῖς πιστεύουσιν εἰς τὸ ὄνομα αὐτοῦ. Việc giữ cả hai bảo toàn kết cấu và chiều sâu thần học của câu mà không xem chúng là hoàn toàn đồng nhất.
- issue: Ý nghĩa của từ chỉ địa vị làm con
  choice: Dịch τέκνα θεοῦ là “con cái Đức Chúa Trời”.
  alternative: “các con trai của Đức Chúa Trời”
  rationale: τέκνα không phải là từ chỉ riêng con trai; bản dịch bao gồm cả nam lẫn nữ phản ánh chính xác từ Hy Lạp.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Đại từ “Ngài” duy trì giọng văn tôn kính; dấu gạch ngang làm rõ quan hệ giải thích của vế cuối. Chú thích được đặt ngay sau “quyền”, là từ tương ứng với ἐξουσίαν.
