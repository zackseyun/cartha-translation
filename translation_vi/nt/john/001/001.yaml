revisions:
- from: Ban đầu[b] đã có Ngôi Lời, Ngôi Lời ở cùng Đức Chúa Trời, và Ngôi Lời là Đức Chúa Trời.[a]
  to: Lúc ban đầu[b] đã có Ngôi Lời, Ngôi Lời ở cùng Đức Chúa Trời, và Ngôi Lời là Đức Chúa Trời.[a]
  rationale: Đổi “Ban đầu” thành “Lúc ban đầu” để phản ánh chính xác hơn Ἐν ἀρχῇ và tiếng vọng Sáng Thế Ký. Điều chỉnh chú thích về θεός để giải thích sắc thái định tính mà không áp đặt diễn giải tín lý vượt quá văn bản. Các dấu chú thích vẫn được neo đúng vào cụm mở đầu và mệnh đề cuối.
