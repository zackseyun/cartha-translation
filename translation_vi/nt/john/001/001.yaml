id: JHN.1.1
reference: John 1:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἐν ἀρχῇ ἦν ὁ λόγος, καὶ ὁ λόγος ἦν πρὸς τὸν θεόν, καὶ θεὸς ἦν ὁ λόγος.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/001.yaml
  text: In the beginning was the Word[a], and the Word was with God[b], and the Word was God.
translation:
  language: vi
  text: Lúc ban đầu[b] đã có Ngôi Lời, Ngôi Lời ở cùng Đức Chúa Trời, và Ngôi Lời là Đức Chúa Trời.[a]
  philosophy: optimal-equivalence
  footnotes: &id001
  - marker: a
    text: 'Cũng có thể diễn đạt: “Ngôi Lời mang bản tính Đức Chúa Trời,” hoặc “Đức Chúa Trời thế nào, Ngôi Lời cũng thể ấy.” Cách đặt từ trong tiếng Hy Lạp cho mệnh đề cuối sắc thái định tính: mệnh đề này nói về bản tính của Ngôi Lời, đồng thời phân biệt Ngôi Lời với “Đức Chúa Trời” trong mệnh đề trước.'
    reason: alternative_reading
  - marker: b
    text: Cụm từ mở đầu gợi lại Sáng Thế Ký 1:1, liên kết Ngôi Lời với khởi nguyên của công cuộc sáng tạo.
    reason: cross_reference
lexical_decisions:
- source_word: Ἐν ἀρχῇ
  choice: Ban đầu
  rationale: Cách diễn đạt tự nhiên, trang trọng, đồng thời giữ tiếng vọng rõ ràng của Sáng Thế Ký 1:1 và đặt Ngôi Lời trước công cuộc sáng tạo.
- source_word: ἦν
  choice: đã có / ở / là
  rationale: 'Cùng một động từ εἰμί được diễn đạt theo chức năng của từng mệnh đề trong tiếng Việt: “đã có” nói đến sự hiện hữu, “ở” diễn tả tương quan, và “là” nối chủ thể với vị ngữ. “Đã có” không hàm ý Ngôi Lời bắt đầu hiện hữu, nhưng diễn tả rằng khi khởi nguyên được nói đến, Ngôi Lời vốn đã hiện hữu.'
- source_word: ὁ λόγος
  choice: Ngôi Lời
  rationale: “Ngôi Lời” là danh xưng đã quen thuộc trong tiếng Việt, giữ được ý về lời phán, sự bày tỏ và căn tính ngôi vị trong văn mạch Giăng mà không thu hẹp thành “Sứ điệp” hay phiên âm “Logos”.
- source_word: πρὸς τὸν θεόν
  choice: ở cùng Đức Chúa Trời
  rationale: “Ở cùng” diễn đạt tự nhiên sự hiện diện, tương quan và phân biệt ngôi vị mà πρός với đối cách gợi lên ở đây; dịch sát là “hướng về” sẽ cứng và dễ gây hiểu sai.
- source_word: τὸν θεόν
  choice: Đức Chúa Trời
  rationale: Danh xưng phổ thông, trang trọng trong tiếng Việt dành cho God; mạo từ Hy Lạp xác định đối tượng trong mệnh đề nhưng tiếng Việt không cần một từ tương đương riêng.
- source_word: θεὸς ἦν ὁ λόγος
  choice: Ngôi Lời là Đức Chúa Trời
  rationale: Giữ lời khẳng định mạnh và trực tiếp của nguyên văn. Trật tự và cấu trúc Hy Lạp nhấn vào phẩm tính/bản tính của Ngôi Lời, trong khi mệnh đề trước vẫn phân biệt Ngôi Lời với Đức Chúa Trời mà Ngôi Lời ở cùng.
theological_decisions:
- issue: Cách dịch θεός không có mạo từ trong mệnh đề cuối
  choice: Ngôi Lời là Đức Chúa Trời
  alternative: 'Ngôi Lời mang bản tính Đức Chúa Trời; hoặc: Đức Chúa Trời thế nào, Ngôi Lời cũng thể ấy'
  rationale: θεός đứng trước động từ có sắc thái định tính, khẳng định trọn vẹn bản tính thần linh của Ngôi Lời nhưng không đồng nhất Ngôi Lời về ngôi vị với “Đức Chúa Trời” ở mệnh đề trước. Bản chính giữ cách dịch trực tiếp; chú thích bảo tồn sắc thái cú pháp và các cách diễn đạt giải thích mà không làm yếu lời khẳng định.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. “Ngôi Lời” và “Đức Chúa Trời” là các danh xưng quen thuộc trong tiếng Việt. Nhịp ba mệnh đề của nguyên văn được giữ lại; “đã có” giúp tiếng Việt diễn tả sự hiện hữu có trước mà không biến câu thành lối nói cổ hoặc khó hiểu. Các dấu chú thích được đặt ngay tại nội dung mà mỗi chú thích giải thích.
