  text: ⸀ὁ ὀπίσω μου ⸀ἐρχόμενος, οὗ ⸂οὐκ εἰμὶ⸃ ἄξιος ἵνα λύσω αὐτοῦ τὸν ἱμάντα τοῦ ὑποδήματος.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/027.yaml
  text: the one coming after me[a], whose sandal strap I am not worthy to untie.
translation:
  language: vi
  text: là Đấng đến sau tôi, Đấng mà tôi không xứng đáng tháo quai dép của Ngài.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ὀπίσω μου ἐρχόμενος
  choice: Đấng đến sau tôi
  rationale: Cụm phân từ có mạo từ chỉ một nhân vật xác định. “Đấng đến sau tôi” tự nhiên trong tiếng Việt, giữ ý về trình tự xuất hiện và không tự ý đưa hàm ý về địa vị từ văn cảnh lân cận vào câu này.
- source_word: οὗ
  choice: cho Ngài
  rationale: Đại từ quan hệ sở hữu liên kết với “quai dép”; trong tiếng Việt, cấu trúc “cởi quai dép cho Ngài” diễn đạt tự nhiên cùng mối quan hệ ấy mà không cần dịch sát thành một đại từ sở hữu.
- source_word: οὐκ εἰμὶ ἄξιος
  choice: tôi không xứng đáng
  rationale: Giữ đúng ý về sự không xứng đáng và sắc thái khiêm nhường của Giăng, không diễn giải quá mức.
- source_word: ἵνα λύσω
  choice: cởi
  rationale: Sau ý niệm xứng đáng, mệnh đề ἵνα có thể được diễn đạt tự nhiên bằng kết cấu động từ trong tiếng Việt. Trong ngữ cảnh quai dép, λύω mang nghĩa tháo hoặc cởi.
- source_word: ἱμάντα
  choice: quai
  rationale: ἱμάς là dây hoặc quai dùng để buộc dép; “quai” rõ nghĩa, tự nhiên và phù hợp với loại dép cổ.
- source_word: τοῦ ὑποδήματος
  choice: dép
  rationale: ὑπόδημα chỉ vật mang ở chân; trong bối cảnh lịch sử này, “dép” chính xác và tự nhiên hơn “giày”.
theological_decisions:
- issue: Quan hệ của cụm “sau tôi” với Đấng đang đến
  choice: 'Dịch theo trình tự thời gian/sứ vụ: “Đấng đến sau tôi”'
  alternative: Đấng đến đằng sau tôi
  rationale: Trong văn cảnh Giăng, lời này nói đến Đấng xuất hiện sau ông trong trình tự sứ vụ, đồng thời văn cảnh rộng hơn gợi đến địa vị cao trọng hơn. Bản dịch giữ nghĩa thông thường của chính mệnh đề này mà không đưa thêm kết luận thần học từ các câu lân cận.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đấng” để chỉ nhân vật xác định đang được Giăng loan báo, và “Ngài” làm đại từ tôn kính tự nhiên trong văn cảnh Kinh Thánh. Không cần chú thích vì cấu trúc tiếng Việt truyền đạt rõ nội dung Hy Lạp mà không làm mất một phương án nghĩa đáng kể.
