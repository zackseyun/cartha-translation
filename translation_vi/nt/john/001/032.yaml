  source_fidelity: 'Bản dịch truyền đạt đúng các yếu tố chính của câu Hy Lạp: lời chứng của Giăng, kinh nghiệm trực tiếp được diễn đạt bằng thì hoàn thành “đã thấy,” Thánh Linh đi xuống từ trời, phép so sánh “như chim bồ câu,” và việc ở lại trên Chúa Giê-su. “Ở lại” phản ánh tốt μένω. Tuy nhiên, chú thích b không nêu một dị bản hay lựa chọn dịch thuật thực sự của bản gốc; chỉ đề nghị đảo trật tự từ trong tiếng Việt, nên không nên giữ như chú thích bản dịch.'
  naturalness: Câu văn tự nhiên, trang trọng và phù hợp tiếng Việt hiện đại. Cấu trúc “Giăng làm chứng rằng” có thể rút gọn thành “Giăng làm chứng” trước lời trích để phản ánh trực tiếp hơn cấu trúc lời chứng được dẫn ra và giúp câu gọn hơn.
  terminology: “Giăng,” “Thánh Linh,” “ngự xuống,” và “Ngài” nhất quán với văn phong Kinh Thánh Việt ngữ trang trọng. “Như chim bồ câu” bảo toàn tính so sánh của ὡς mà không xác định quá mức hình thức biểu hiện.
