id: JHN.1.32
reference: John 1:32
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἐμαρτύρησεν Ἰωάννης λέγων ὅτι Τεθέαμαι τὸ πνεῦμα καταβαῖνον ⸀ὡς περιστερὰν ἐξ οὐρανοῦ, καὶ ἔμεινεν ἐπ’ αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/john/001/032.yaml
  text: And John testified[a], saying, “I have seen the Spirit descending like a dove out of heaven[b], and it remained on him.”
translation:
  language: vi
  text: 'Giăng làm chứng: “Tôi đã thấy Thánh Linh từ trời ngự xuống như chim bồ câu[a] và ở lại trên Ngài.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “tựa như chim bồ câu.” Tiếng Hy Lạp diễn tả sự tương tự, nhưng không nói rõ sự tương tự ấy là về hình dạng hay cách ngự xuống.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμαρτύρησεν
  choice: làm chứng
  rationale: Diễn đạt tự nhiên trong tiếng Việt hiện đại, đồng thời giữ sắc thái nhân chứng và lời chứng của μαρτυρέω.
- source_word: λέγων ὅτι
  choice: rằng
  rationale: Gộp cấu trúc phân từ ‘nói rằng’ thành cách dẫn lời tự nhiên, súc tích trong tiếng Việt mà vẫn giữ quan hệ giữa hành động làm chứng và nội dung lời chứng.
- source_word: Τεθέαμαι
  choice: Tôi đã thấy
  rationale: Thể hoàn thành nhấn mạnh điều Giăng đích thân chứng kiến và giá trị còn hiện hữu của lời chứng; ‘đã thấy’ là cách diễn đạt tự nhiên nhất trong tiếng Việt.
- source_word: τὸ πνεῦμα
  choice: Thánh Linh
  rationale: Ngữ cảnh Giăng 1:32–33 xác định đây là Đức Thánh Linh. ‘Thánh Linh’ rõ nghĩa, trang trọng và quen thuộc, nhưng không thêm một danh xưng không có trong câu Hy Lạp.
- source_word: καταβαῖνον
  choice: ngự xuống
  rationale: Diễn tả chuyển động đi xuống với sắc thái trang trọng phù hợp khi chủ thể là Thánh Linh; tránh cách nói quá khẩu ngữ ‘đi xuống’.
- source_word: ὡς περιστερὰν
  choice: như chim bồ câu
  rationale: Giữ đúng giá trị so sánh của ὡς, không khẳng định Thánh Linh thực thể hóa thành một con chim bồ câu.
- source_word: ἐξ οὐρανοῦ
  choice: từ trời
  rationale: Truyền đạt tự nhiên nguồn xuất phát được ἐξ chỉ rõ; tiếng Việt không cần thêm yếu tố tương đương ‘ra khỏi’ vốn dễ gây gượng.
- source_word: ἔμεινεν
  choice: ở lại
  rationale: Giữ ý nghĩa của μένω và mạch từ vựng quan trọng trong sách Giăng; tự nhiên hơn ‘lưu lại’ trong ngữ cảnh này.
- source_word: ἐπ’ αὐτόν
  choice: trên Ngài
  rationale: ‘Trên’ phản ánh ἐπί; ‘Ngài’ chỉ Chúa Giê-su theo ngữ cảnh và là đại từ tôn kính tự nhiên trong văn phong Kinh Thánh tiếng Việt.
theological_decisions:
- issue: Cách xác định τὸ πνεῦμα
  choice: Thánh Linh
  alternative: Linh; thần linh
  rationale: Ngữ cảnh ngay sau đó nói rõ về Đấng làm phép báp-têm trong Thánh Linh, nên danh xưng ‘Thánh Linh’ thể hiện đúng đối tượng quy chiếu mà không bổ sung một mệnh đề thần học ngoài bản văn.
- issue: Ý nghĩa của ὡς περιστερὰν
  choice: 'so sánh: ‘như chim bồ câu’'
  alternative: ‘trong hình dạng chim bồ câu’; ‘là chim bồ câu’
  rationale: ὡς biểu thị sự tương tự nhưng bản văn không xác định chính xác sự tương tự nằm ở hình dạng, chuyển động hay phương diện nào; bản dịch giữ nguyên độ mở ấy.
- issue: Chủ ngữ hàm ẩn của ἔμεινεν
  choice: 'không lặp lại đại từ: ‘và ở lại trên Ngài’'
  alternative: ‘và Thánh Linh ở lại trên Ngài’
  rationale: Tiếng Hy Lạp không có đại từ chủ ngữ riêng ở đây; tiếng Việt cho phép lược chủ ngữ và vẫn quy chiếu rõ về Thánh Linh, nhờ đó không thêm đại từ mang giới tính hay lặp danh từ quá mức.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng ‘Giăng’, ‘Thánh Linh’ và đại từ tôn kính ‘Ngài’ theo lối dùng Kinh Thánh tiếng Việt phổ biến. Cấu trúc được điều chỉnh tự nhiên cho tiếng Việt nhưng giữ hình ảnh, sự so sánh và sự liên tục của động từ μένω.
