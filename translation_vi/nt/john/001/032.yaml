    rationale: Bản Hy Lạp có trật tự “đi xuống ... từ trời”; câu tiếng Việt đã đặt “từ trời” trước “ngự xuống” một cách tự nhiên. Việc đảo lại không tạo khác biệt nghĩa và không cần một mỏ neo chú thích.
