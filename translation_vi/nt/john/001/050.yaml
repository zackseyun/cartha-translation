source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ· Ὅτι εἶπόν σοι ⸀ὅτι εἶδόν σε ὑποκάτω τῆς συκῆς πιστεύεις; μείζω τούτων ⸀ὄψῃ.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/050.yaml
  text: Jesus answered and said to him[a], “Because I told you that I saw you under the fig tree, do you believe? You will see greater things than these.”
translation:
  language: vi
  text: 'Đức Giê-su đáp lời ông: “Vì tôi đã nói với anh rằng tôi đã thấy anh ở dưới cây vả nên anh tin sao?[a] Anh sẽ thấy những điều lớn lao hơn những điều này.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Có phải vì tôi đã nói với anh rằng tôi đã thấy anh ở dưới cây vả mà anh tin không?”'
    reason: Cách diễn đạt khác cho cấu trúc câu hỏi nguyên nhân mở đầu bằng Ὅτι.
lexical_decisions:
- source_word: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ
  choice: Đức Giê-su đáp lời ông
  rationale: Diễn đạt tự nhiên công thức trần thuật Hy Lạp ‘đáp và nói với ông’; tiếng Việt không cần lặp cả ‘đáp’ lẫn ‘nói’.
- source_word: Ὅτι ... ὅτι
  choice: Vì ... rằng
  rationale: Phân biệt ὅτι thứ nhất mang nghĩa nguyên nhân với ὅτι thứ hai giới thiệu nội dung lời nói.
- source_word: εἶδόν σε ὑποκάτω τῆς συκῆς
  choice: tôi thấy anh ở dưới cây vả
  rationale: Giữ thì quá khứ đơn và hình ảnh cụ thể của nguyên văn bằng cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: πιστεύεις
  choice: anh tin sao?
  rationale: Giữ dạng câu hỏi và sắc thái tu từ, nhưng không làm mạnh thêm thành lời trách quở.
- source_word: μείζω τούτων ὄψῃ
  choice: Anh sẽ thấy những điều lớn lao hơn thế
  rationale: Mείζω là tính từ so sánh số nhiều trung tính dùng như danh từ; ‘những điều lớn lao hơn thế’ rõ nghĩa và tự nhiên.
theological_decisions:
- issue: Sắc thái của câu hỏi πιστεύεις;
  choice: 'Giữ như một câu hỏi tu từ: ‘anh tin sao?’'
  alternative: 'Hiểu như một lời xác nhận hoặc một lời trách nhẹ: ‘anh tin chỉ vì...’'
  rationale: Cấu trúc và ngữ cảnh ủng hộ câu hỏi, nhưng bản dịch không áp đặt rằng đức tin của Na-tha-na-ên bị chê trách; lời hứa về sự mặc khải lớn hơn vẫn giữ nguyên sức căng của đoạn văn.
- issue: Quan hệ nguyên nhân do Ὅτι mở đầu
  choice: ‘Vì ... nên anh tin sao?’
  alternative: ‘Có phải vì ... mà anh tin không?’
  rationale: Cả hai đều có thể biểu đạt câu hỏi nguyên nhân. Bản chính theo sát trật tự và lực nguyên nhân của tiếng Hy Lạp; chú thích ghi nhận cách diễn đạt minh thị hơn trong tiếng Việt.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng ‘tôi–anh’ trong lời trực tiếp để tránh đại từ cổ, đồng thời dùng ‘ông’ trong lời kể để chỉ Na-tha-na-ên một cách kính trọng. ‘Đức Giê-su’ phù hợp văn phong Kinh Thánh tiếng Việt phổ thông.
