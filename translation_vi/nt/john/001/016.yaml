  text: ⸀ὅτι ἐκ τοῦ πληρώματος αὐτοῦ ἡμεῖς πάντες ἐλάβομεν, καὶ χάριν ἀντὶ χάριτος·
base_translation:
  language: en
  yaml_path: translation/nt/john/001/016.yaml
  text: For from his fullness we have all received[a], and grace upon grace.
translation:
  language: vi
  text: Vì từ sự viên mãn của Ngài, tất cả chúng ta đều đã nhận lãnh ân điển thay cho ân điển.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “ân điển trên ân điển” hoặc “ân điển này tiếp nối ân điển kia”. Cụm từ Hy Lạp có thể gợi ý những ân điển tiếp nối nhau, dù ἀντί theo nghĩa sát hơn là “thay cho”.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: Vì
  rationale: Liên từ này nêu lý do hoặc lời giải thích cho điều vừa nói; “Vì” tự nhiên và giữ được sắc thái ấy.
- source_word: ἐκ τοῦ πληρώματος αὐτοῦ
  choice: từ sự viên mãn của Ngài
  rationale: Giữ hình ảnh về sự đầy trọn thuộc về Ngôi Lời và nguồn mà mọi người nhận lãnh từ đó.
- source_word: ἡμεῖς πάντες
  choice: tất cả chúng ta
  rationale: Bảo toàn đại từ được nêu rõ cùng sắc thái nhấn mạnh của πάντες.
- source_word: ἐλάβομεν
  choice: đã nhận lãnh
  rationale: Thể bất định chỉ hành động nhận lãnh; “đã nhận lãnh” vừa rõ thời tính vừa hợp văn phong Kinh Thánh hiện đại.
- source_word: καὶ
  choice: —
  rationale: Trong tiếng Việt, dấu phẩy nối trực tiếp phần giải thích nội dung đã nhận lãnh tự nhiên hơn việc thêm “và”, mà không làm mất quan hệ liên kết của καί.
- source_word: χάριν ἀντὶ χάριτος
  choice: ân điển thay cho ân điển
  rationale: “Thay cho” giữ nghĩa cơ bản của ἀντί là một điều ở vị trí của điều khác, đồng thời không giải quyết dứt khoát sự mơ hồ giữa thay thế và tiếp nối.
theological_decisions:
- issue: Cách hiểu χάριν ἀντὶ χάριτος
  choice: ân điển thay cho ân điển
  alternative: ân điển chồng thêm ân điển; hết ân điển này đến ân điển khác
  rationale: Cụm từ có nhiều cách hiểu. Bản chính giữ lực từ vựng của ἀντί (“thay cho”), còn chú thích nêu cách hiểu tích lũy hoặc kế tiếp, nhờ đó bảo toàn sự căng thẳng thần học của nguyên văn.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. “Ngài” chỉ Ngôi Lời theo ngữ cảnh. “Ân điển” duy trì thuật ngữ thần học quen thuộc; dấu chú thích đặt ngay sau cụm từ gây tranh luận.
