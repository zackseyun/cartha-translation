  source_fidelity: Bản dịch giữ đúng quan hệ giải thích của ὅτι, nguồn gốc của điều nhận lãnh (ἐκ τοῦ πληρώματος αὐτοῦ), tính bao quát/nhấn mạnh của ἡμεῖς πάντες, và không giải quyết võ đoán tính đa nghĩa của χάριν ἀντὶ χάριτος. Tuy nhiên, câu hiện tại tách “ân điển thay cho ân điển” sau dấu phẩy mà không có động từ hay liên kết rõ ràng trong tiếng Việt, khiến quan hệ của cụm này với “đã nhận lãnh” bị đứt đoạn. Đưa cụm ấy làm bổ ngữ trực tiếp của động từ giúp chuyển tải rõ điều mọi người đã nhận lãnh.
