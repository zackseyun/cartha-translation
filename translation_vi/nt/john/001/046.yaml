  rationale: Chỉ sửa nhẹ cách diễn đạt câu hỏi để tiếng Việt hiện đại tự nhiên hơn. Bản sửa giữ trật tự nhấn mạnh “Từ Na-xa-rét,” giữ ý khả năng của δύναται, ý “có/là” của εἶναι, và không thêm hàm ý chế giễu vượt quá tính hoài nghi của nguyên văn.
