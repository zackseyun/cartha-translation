  text: καὶ εἶπεν αὐτῷ Ναθαναήλ· Ἐκ Ναζαρὲτ δύναταί τι ἀγαθὸν εἶναι; λέγει αὐτῷ ⸀ὁ Φίλιππος· Ἔρχου καὶ ἴδε.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/046.yaml
  text: And Nathanael said to him[a], “Can anything good come from Nazareth?” Philip said to him, “Come and see.”
translation:
  language: vi
  text: 'Na-tha-na-ên nói với ông: “Từ Na-xa-rét mà có thể có điều gì tốt sao?” Phi-líp nói với ông: “Hãy đến mà xem.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ εἶπεν αὐτῷ
  choice: Na-tha-na-ên nói với ông
  rationale: Trong tiếng Việt, không cần dịch liên từ καὶ ở đầu câu để nối mạch kể; “nói với ông” diễn đạt tự nhiên động từ cùng đại từ tặng cách.
- source_word: Ναθαναήλ
  choice: Na-tha-na-ên
  rationale: Phiên âm tên riêng theo cách dùng Kinh Thánh tiếng Việt quen thuộc và dễ đọc.
- source_word: Ἐκ Ναζαρὲτ
  choice: Từ Na-xa-rét
  rationale: Giữ rõ ý nguồn gốc của ἐκ và vị trí nhấn mạnh ở đầu câu hỏi.
- source_word: δύναταί τι ἀγαθὸν εἶναι
  choice: có thể có điều gì tốt được sao?
  rationale: Giữ động từ εἶναι theo nghĩa cơ bản “có/hiện hữu” thay vì thêm ý chuyển động “đến từ”; cấu trúc “được sao” truyền đạt tự nhiên sắc thái hoài nghi của câu hỏi tu từ mà không tăng thêm sự khinh miệt.
- source_word: λέγει αὐτῷ ὁ Φίλιππος
  choice: Phi-líp nói với ông
  rationale: Dùng thì kể chuyện tự nhiên trong tiếng Việt cho hiện tại lịch sử λέγει; không biểu thị mạo từ trước tên riêng.
- source_word: Ἔρχου καὶ ἴδε
  choice: Hãy đến mà xem
  rationale: “Hãy đến” thể hiện lời mời ở thể mệnh lệnh; “mà xem” là cách nối hai động từ tự nhiên, đồng thời giữ động từ “xem” và âm hưởng chủ đề của ἴδε trong Giăng.
theological_decisions:
- issue: Sắc thái câu hỏi của Na-tha-na-ên về Na-xa-rét
  choice: Trình bày như một câu hỏi tu từ mang vẻ hoài nghi, không thêm từ ngữ biểu thị chế giễu hay khinh miệt.
  alternative: “Từ Na-xa-rét mà có điều gì tốt sao?” hoặc “Có điều gì tốt ra từ Na-xa-rét được sao?”
  rationale: Nguyên văn cho thấy sự hoài nghi nhưng không xác định chính xác mức độ hoặc động cơ; bản dịch giữ nguyên sự căng thẳng ấy thay vì diễn giải tâm thái mạnh hơn.
- issue: Quan hệ giữa ἐκ Ναζαρὲτ và εἶναι
  choice: “Từ Na-xa-rét có thể có điều gì tốt”
  alternative: “Có điều gì tốt có thể đến từ Na-xa-rét”
  rationale: εἶναι có nghĩa đen là “là/có”, còn ἐκ chỉ nguồn gốc. Cách chọn giữ gần cấu trúc Hy Lạp và tránh biến “có” thành động từ chuyển động, trong khi vẫn tự nhiên trong tiếng Việt.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Tên riêng được phiên âm có gạch nối theo lối quen thuộc trong nhiều bản Kinh Thánh tiếng Việt. Câu hỏi giữ sắc thái hoài nghi tự nhiên bằng “được sao”, còn lời đáp ngắn gọn và trực tiếp.
