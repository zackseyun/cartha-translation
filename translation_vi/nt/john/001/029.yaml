  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Τῇ ἐπαύριον βλέπει τὸν Ἰησοῦν ἐρχόμενον πρὸς αὐτόν, καὶ λέγει· Ἴδε ὁ ἀμνὸς τοῦ θεοῦ ὁ αἴρων τὴν ἁμαρτίαν τοῦ κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/029.yaml
  text: The next day he sees Jesus coming toward him and says, “Look, the Lamb of God, who takes away the sin of the world!”
translation:
  language: vi
  text: 'Hôm sau, ông thấy Đức Chúa Giê-su đến với ông và nói: “Kìa, Chiên Con của Đức Chúa Trời, Đấng cất đi tội lỗi của thế gian!”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τῇ ἐπαύριον
  choice: Hôm sau
  rationale: Cách diễn đạt tự nhiên, gọn và sát nghĩa chỉ ngày kế tiếp.
- source_word: βλέπει
  choice: thấy
  rationale: Giữ thì hiện tại kể chuyện của nguyên văn để tạo tính trực tiếp trong trình thuật.
- source_word: ἐρχόμενον πρὸς αὐτόν
  choice: đang đến gần mình
  rationale: Diễn đạt chuyển động hướng về Giăng một cách tự nhiên; “mình” quy chiếu về chủ thể “ông”.
- source_word: Ἴδε
  choice: Kìa
  rationale: Thán từ thu hút sự chú ý, trang trọng nhưng vẫn quen thuộc trong tiếng Việt hiện đại.
- source_word: ὁ ἀμνὸς τοῦ θεοῦ
  choice: Chiên Con của Đức Chúa Trời
  rationale: Giữ nguyên hình ảnh chiên con và quan hệ sở thuộc của cụm Hy Lạp, không diễn giải thêm ý nghĩa hiến tế.
- source_word: ὁ αἴρων
  choice: Đấng cất đi
  rationale: “Cất đi” bảo toàn ý nghĩa loại bỏ/mang khỏi của αἴρω; “Đấng” làm rõ mệnh đề mô tả Chiên Con trong văn phong tôn kính.
- source_word: τὴν ἁμαρτίαν τοῦ κόσμου
  choice: tội lỗi của thế gian
  rationale: Giữ danh từ số ít “tội lỗi” và phạm vi phổ quát “thế gian” như nguyên văn.
theological_decisions:
- issue: Ý nghĩa của αἴρων đối với tội lỗi
  choice: cất đi
  alternative: mang lấy
  rationale: αἴρω có thể gợi cả việc nhấc/mang và loại bỏ, nhưng trong cấu trúc này “cất đi” truyền đạt trực tiếp kết quả đối với tội lỗi mà không xác định cơ chế thần học.
- issue: Danh xưng “Chiên Con của Đức Chúa Trời”
  choice: giữ nguyên hình ảnh, không giải nghĩa
  alternative: của lễ hy sinh do Đức Chúa Trời ban
  rationale: Nguyên văn chứa một hình ảnh thần học giàu liên tưởng nhưng không tự giải thích tại đây; bản dịch không nên thu hẹp nó vào một cách hiểu duy nhất.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ông” cho chủ thể ngầm là Giăng dựa trên ngữ cảnh trước đó; giữ hiện tại kể chuyện “thấy… nói” của nguyên văn. Danh xưng “Đức Chúa Jêsus” và “Đức Chúa Trời” theo lối dùng Tin Lành Việt ngữ quen thuộc.
