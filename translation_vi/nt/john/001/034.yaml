source:
  edition: SBLGNT
  text: κἀγὼ ἑώρακα, καὶ μεμαρτύρηκα ὅτι οὗτός ἐστιν ὁ ⸀ἐκλεκτὸς τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/034.yaml
  text: And I have seen and have testified that this is the Chosen One of God[a].
translation:
  language: vi
  text: Chính tôi đã thấy và đã làm chứng rằng người này là Đấng được Đức Chúa Trời chọn[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Một số bản chép tay ghi “Con Đức Chúa Trời” thay cho “Đấng được Đức Chúa Trời chọn.”
    reason: textual_variant
lexical_decisions:
- source_word: κἀγώ
  choice: Còn tôi
  rationale: Diễn đạt cả liên từ καί và đại từ nhấn mạnh ἐγώ trong tiếng Việt tự nhiên, đồng thời nối lời chứng này với câu trước.
- source_word: ἑώρακα
  choice: đã thấy
  rationale: Tiếng Việt không có hình thái tương đương trực tiếp với thì hoàn thành Hy Lạp; “đã thấy” diễn đạt kinh nghiệm chứng kiến đã xảy ra, còn hiệu lực hiện tại được ngữ cảnh lời chứng nâng đỡ.
- source_word: μεμαρτύρηκα
  choice: đã làm chứng
  rationale: “Làm chứng” là cách diễn đạt rõ ràng, trang trọng vừa phải cho μαρτυρέω; từ “đã” thể hiện hành động đã được thực hiện mà không thêm ý ngoài văn bản.
- source_word: ὅτι
  choice: rằng
  rationale: Ở đây ὅτι giới thiệu nội dung lời chứng, không mang nghĩa nguyên nhân.
- source_word: οὗτός
  choice: vị này
  rationale: Giữ sắc thái chỉ định trực tiếp của đại từ Hy Lạp và vẫn tự nhiên, tôn trọng khi quy chiếu đến Chúa Giê-xu.
- source_word: ὁ ἐκλεκτὸς
  choice: Đấng Được Chọn
  rationale: Tính từ có mạo từ được dùng như danh từ; “Đấng Được Chọn” chuyển tải tư cách danh hiệu rõ ràng và dễ hiểu trong tiếng Việt hiện đại.
- source_word: τοῦ θεοῦ
  choice: Đức Chúa Trời
  rationale: Trong cấu trúc tiếng Việt “Đấng Được Đức Chúa Trời Chọn,” Đức Chúa Trời là tác nhân của việc chọn; cách diễn đạt này tự nhiên hơn lối dịch sát cấu trúc sở hữu nhưng không thay đổi quan hệ ngữ nghĩa.
theological_decisions:
- issue: Danh hiệu Kitô học trong Giăng 1:34
  choice: Đấng Được Đức Chúa Trời Chọn
  alternative: Con Đức Chúa Trời
  rationale: Bản SBLGNT được cung cấp đọc ὁ ἐκλεκτὸς τοῦ θεοῦ, nên bản văn chính dịch trực tiếp dị bản này thay vì đồng hóa với cách đọc quen thuộc hơn. Dị bản “Con Đức Chúa Trời” có ý nghĩa văn bản học và thần học nên được ghi ở chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Còn tôi” để duy trì mạch liên kết và sắc thái nhấn mạnh; viết hoa danh hiệu “Đấng Được Chọn.”
