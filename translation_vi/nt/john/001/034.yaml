  - severity: low
    issue: Viết hoa toàn bộ các từ trong danh hiệu «Đấng Được Đức Chúa Trời Chọn».
    rationale: Trong chính tả tiếng Việt hiện đại, ngoài danh xưng mở đầu và tên riêng «Đức Chúa Trời», các từ «được» và «chọn» không cần viết hoa; cách viết thường tự nhiên hơn.
  revised_text: Chính tôi đã thấy và đã làm chứng rằng người này là Đấng được Đức Chúa Trời chọn[a].
