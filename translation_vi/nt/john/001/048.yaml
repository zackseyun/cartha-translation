  terminology: Các tên Na-tha-na-ên, Đức Giê-su, Phi-líp và thuật ngữ “cây vả” nhất quán với cách dùng Kinh Thánh tiếng Việt. Cặp đại từ “Ngài/tôi/anh” mạch lạc trong hội thoại và không giải thích thêm bản chất sự hiểu biết của Giê-su.
