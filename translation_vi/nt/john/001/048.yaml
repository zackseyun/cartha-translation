source:
  edition: SBLGNT
  text: λέγει αὐτῷ Ναθαναήλ· Πόθεν με γινώσκεις; ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ· Πρὸ τοῦ σε Φίλιππον φωνῆσαι ὄντα ὑπὸ τὴν συκῆν εἶδόν σε.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/048.yaml
  text: Nathanael said to him[a], “How do you know me?” Jesus answered and said to him, “Before Philip called you, while you were under the fig tree, I saw you.”
translation:
  language: vi
  text: 'Na-tha-na-ên hỏi Ngài: “Làm sao Ngài biết tôi?” Đức Giê-su đáp: “Trước khi Phi-líp gọi anh, khi anh đang ở dưới cây vả, tôi đã thấy anh.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πόθεν με γινώσκεις;
  choice: Làm sao Ngài biết tôi?
  rationale: Πόθεν có nghĩa đen là “từ đâu”, nhưng khi đi với γινώσκεις trong câu hỏi này, cụm từ tự nhiên hỏi bằng cách nào hoặc do đâu Đức Giê-su biết Na-tha-na-ên. “Làm sao Ngài biết tôi?” vừa rõ nghĩa vừa tự nhiên trong tiếng Việt.
- source_word: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ
  choice: Đức Giê-su đáp
  rationale: Tiếng Hy Lạp dùng công thức kép “đáp và nói với ông”. Trong tiếng Việt hiện đại, “đáp” truyền đạt đầy đủ chức năng diễn ngôn; dịch cả hai động từ sẽ nặng và thiếu tự nhiên.
- source_word: Πρὸ τοῦ σε Φίλιππον φωνῆσαι
  choice: Trước khi Phi-líp gọi anh
  rationale: Πρὸ τοῦ với động từ nguyên mẫu chỉ thời điểm có trước; φωνέω ở đây mang nghĩa gọi. Cách diễn đạt này trực tiếp và tự nhiên.
- source_word: ὄντα ὑπὸ τὴν συκῆν
  choice: lúc anh còn ở dưới cây vả
  rationale: Phân từ ὄντα nêu hoàn cảnh của Na-tha-na-ên khi Đức Giê-su thấy ông. “Lúc anh còn ở dưới cây vả” diễn đạt rõ quan hệ thời gian-hoàn cảnh và nối tự nhiên với mệnh đề trước.
- source_word: εἶδόν σε
  choice: tôi đã thấy anh
  rationale: Động từ aorist chỉ hành động thấy trong quá khứ. “Đã thấy” tự nhiên trong tiếng Việt và làm rõ rằng việc thấy xảy ra trước lời nói hiện tại, còn quan hệ với lời gọi của Phi-líp đã được xác định bởi “trước khi”.
- source_word: συκῆν
  choice: cây vả
  rationale: Đây là tên gọi thông dụng trong tiếng Việt Kinh Thánh cho cây fig; có thêm “cây” để câu rõ và tự nhiên.
- source_word: αὐτῷ / σε
  choice: Ngài / anh
  rationale: Tiếng Hy Lạp không mã hóa mức độ kính trọng trong các đại từ này. Tiếng Việt buộc phải chọn đại từ theo quan hệ giao tiếp; “Ngài” thể hiện lời Na-tha-na-ên thưa với Đức Giê-su, còn “anh” trong lời Đức Giê-su nói với Na-tha-na-ên là tự nhiên, không hàm ý một học thuyết riêng.
theological_decisions:
- issue: Bản chất việc Đức Giê-su biết và thấy Na-tha-na-ên
  choice: Dịch trực tiếp rằng Đức Giê-su đã thấy ông trước khi Phi-líp gọi, không giải thích cơ chế.
  alternative: Diễn giải rõ đây là sự biết siêu nhiên hoặc chỉ là sự quan sát thông thường.
  rationale: Câu Hy Lạp khẳng định việc thấy trước nhưng không giải thích việc đó diễn ra bằng cách nào. Giữ nguyên sự căng thẳng và hàm ý của văn mạch tránh áp đặt một cách giải nghĩa thần học.
translation_notes:
  register: 'Văn phong tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Danh xưng được phiên âm theo lối quen dùng: Na-tha-na-ên, Đức Giê-su, Phi-líp. Lược công thức kép “đáp và nói” để tránh câu văn nặng, nhưng không làm mất nội dung.'
