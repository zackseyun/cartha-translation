source:
  edition: SBLGNT
  text: εἶδεν ⸀ὁ Ἰησοῦς τὸν Ναθαναὴλ ἐρχόμενον πρὸς αὐτὸν καὶ λέγει περὶ αὐτοῦ· Ἴδε ἀληθῶς Ἰσραηλίτης ἐν ᾧ δόλος οὐκ ἔστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/047.yaml
  text: Jesus saw Nathanael coming toward him and said about him, “Look, truly an Israelite in whom there is no deceit.”
translation:
  language: vi
  text: 'Chúa Giê-su thấy Na-tha-na-ên đang đến gần mình thì nói về ông: “Kìa, thật là một người Y-sơ-ra-ên, trong người không có sự gian dối.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἴδε
  choice: Kìa
  rationale: Giữ chức năng thu hút sự chú ý của lời cảm thán Hy Lạp, đồng thời phù hợp với lời nói trang trọng, tự nhiên.
- source_word: ἀληθῶς Ἰσραηλίτης
  choice: một người Y-sơ-ra-ên đích thực
  rationale: 'Hiểu ἀληθῶς bổ nghĩa cho danh tính/phẩm chất của Ἰσραηλίτης: không chỉ là người Y-sơ-ra-ên về danh nghĩa mà thật sự mang phẩm chất ấy.'
- source_word: δόλος
  choice: gian dối
  rationale: Diễn đạt ý lừa lọc, mưu trá của δόλος bằng một từ phổ thông và tự nhiên trong tiếng Việt.
- source_word: ἐν ᾧ ... οὐκ ἔστιν
  choice: trong người không có ... nào
  rationale: Giữ hình ảnh và cấu trúc nội tại của nguyên văn, nói về điều không hiện hữu trong con người Na-tha-na-ên.
theological_decisions:
- issue: Ý nghĩa của “người Y-sơ-ra-ên đích thực”
  choice: Giữ nguyên cách gọi mang tính đánh giá của Đức Chúa Jêsus
  alternative: Diễn giải thành “người thật lòng thuộc về Y-sơ-ra-ên” hoặc liên hệ rõ với Gia-cốp
  rationale: Nguyên văn không giải thích cụ thể sự liên hệ thần học hay ám chỉ nào; bản dịch không nên tự ý làm rõ điều vẫn hàm ẩn.
- issue: Mức độ tuyệt đối của lời “không có gian dối”
  choice: Dịch trực tiếp, không thêm lời hạn định
  alternative: “không phải là người gian dối” hoặc “không có ý gian dối”
  rationale: Giữ sức mạnh tu từ và sự căng thẳng của nguyên văn, không biến câu này thành tuyên bố giáo lý về sự vô tội tuyệt đối cũng không làm yếu lời khen.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng tên riêng theo lối phiên âm Kinh Thánh Việt ngữ quen thuộc; “Kìa” giữ sắc thái trực tiếp của lời nói mà không quá cổ.
