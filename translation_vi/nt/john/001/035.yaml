source:
  edition: SBLGNT
  text: Τῇ ἐπαύριον πάλιν εἱστήκει ⸀ὁ Ἰωάννης καὶ ἐκ τῶν μαθητῶν αὐτοῦ δύο,
base_translation:
  language: en
  yaml_path: translation/nt/john/001/035.yaml
  text: On the next day[a], John was standing there again, and two of his disciples were with him.
translation:
  language: vi
  text: Ngày hôm sau, Giăng lại đang đứng đó cùng với hai môn đồ của mình.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τῇ ἐπαύριον
  choice: Ngày hôm sau
  rationale: Cụm có mạo từ này là một thành ngữ chỉ thời gian, nghĩa là “vào ngày hôm sau.” Trong tiếng Việt, “Ngày hôm sau” tự nhiên và giữ rõ trình tự tường thuật.
- source_word: πάλιν
  choice: lại
  rationale: Diễn tả sự lặp lại và nối cảnh này với cảnh trước; “lại” là cách diễn đạt ngắn gọn, tự nhiên.
- source_word: εἱστήκει
  choice: đang đứng đó
  rationale: Dạng động từ diễn tả một trạng thái đang tiếp diễn trong quá khứ. “Đang đứng” giữ sắc thái này; “đó” được thêm để câu tiếng Việt tự nhiên mà không xác định thêm địa điểm.
- source_word: ὁ Ἰωάννης
  choice: Giăng
  rationale: Dùng dạng tên Kinh Thánh quen thuộc trong tiếng Việt. Nguyên văn chỉ ghi tên Giăng, nên không mở rộng thành “Giăng Báp-tít” trong chính văn.
- source_word: καὶ
  choice: cùng với
  rationale: Trong cấu trúc câu tiếng Việt, “cùng với” diễn đạt tự nhiên việc Giăng hiện diện bên hai môn đồ, đồng thời phản ánh quan hệ phối hợp của καὶ.
- source_word: ἐκ τῶν μαθητῶν αὐτοῦ δύο
  choice: hai môn đồ của mình
  rationale: Giữ ý phân bộ “hai người trong số các môn đồ của ông.” “Môn đồ” là cách gọi quen thuộc và trang trọng cho μαθητής; “của mình” quy chiếu tự nhiên về Giăng.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu được sắp xếp tự nhiên theo tiếng Việt; không thêm lời giải thích định danh Giăng hay danh tính hai môn đồ.
