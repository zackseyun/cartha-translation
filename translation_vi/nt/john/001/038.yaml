revisions:
- from: 'Đức Giê-su quay lại, thấy họ đang đi theo, thì hỏi: “Các anh đang tìm kiếm điều gì?” Họ thưa với Ngài: “Ra-bi”[a] (dịch ra nghĩa là “Thầy”), “Thầy ở đâu?”[b]'
  to: 'Đức Giê-su quay lại, thấy họ đang đi theo, thì hỏi: “Các anh đang tìm kiếm điều gì?” Họ thưa với Ngài: “Ra-bi”[a] (nghĩa là “Thầy”), “Thầy ở đâu?”[b]'
  rationale: Chỉ chỉnh cách diễn đạt lời giải nghĩa trong ngoặc từ “dịch ra nghĩa là” thành “nghĩa là.” Không thay đổi nghĩa, nhịp kể, sắc thái đang tiếp diễn của “đang đi theo,” hay sự cân bằng giữa nghĩa ngữ cảnh và sự cộng hưởng từ vựng của μένω.
