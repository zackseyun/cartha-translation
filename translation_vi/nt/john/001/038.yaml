id: JHN.1.38
reference: John 1:38
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: στραφεὶς δὲ ὁ Ἰησοῦς καὶ θεασάμενος αὐτοὺς ἀκολουθοῦντας λέγει αὐτοῖς· Τί ζητεῖτε; οἱ δὲ εἶπαν αὐτῷ· Ῥαββί (ὃ λέγεται ⸀μεθερμηνευόμενον Διδάσκαλε), ποῦ μένεις;
base_translation:
  language: en
  yaml_path: translation/nt/john/001/038.yaml
  text: Then Jesus turned and[a], seeing them following, said to them, “What are you seeking?” They said to him, “Rabbi” (which translated means Teacher)[c][b], “where are you staying?”
translation:
  language: vi
  text: 'Đức Giê-su quay lại, thấy họ đang đi theo, thì hỏi: “Các anh đang tìm kiếm điều gì?” Họ thưa với Ngài: “Ra-bi”[a] (nghĩa là “Thầy”), “Thầy ở đâu?”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ra-bi” là một danh xưng Hê-bơ-rơ hoặc A-ram, nghĩa là “Thầy.”
    reason: cultural_note
  - marker: b
    text: 'Cũng có thể dịch: “Thầy đang lưu lại ở đâu?” Động từ Hy Lạp này thường được dịch là “ở lại” trong những chỗ khác của sách Giăng.'
    reason: lexical_alternative
lexical_decisions:
- source_word: στραφεὶς
  choice: quay lại
  rationale: Diễn tả tự nhiên hành động Đức Giê-su xoay người về phía hai người đang đi theo, không thêm chi tiết quá mức về hướng chuyển động.
- source_word: θεασάμενος
  choice: thấy
  rationale: Giữ ý nhận biết bằng mắt trong chuỗi hành động, với cách diễn đạt gọn và tự nhiên trong tiếng Việt.
- source_word: ἀκολουθοῦντας
  choice: đang đi theo
  rationale: Thể hiện hành động đang tiếp diễn, đồng thời không loại bỏ sắc thái kép giữa việc đi theo theo nghĩa đen và bước đầu làm môn đồ.
- source_word: Τί ζητεῖτε;
  choice: Các anh đang tìm kiếm điều gì?
  rationale: “Tìm kiếm” vừa phù hợp câu hỏi trong tình huống cụ thể vừa giữ được khả năng mang ý nghĩa sâu hơn trong mạch kể của Giăng.
- source_word: Ῥαββί
  choice: Ra-bi
  rationale: Phiên âm danh xưng Do Thái vì chính bản văn ngay sau đó giải nghĩa danh xưng này.
- source_word: μεθερμηνευόμενον Διδάσκαλε
  choice: dịch ra nghĩa là “Thầy”
  rationale: Tái hiện lời giải thích của tác giả một cách rõ ràng, tự nhiên; “Thầy” phù hợp với danh xưng trực tiếp Διδάσκαλε.
- source_word: ποῦ μένεις;
  choice: Thầy ở đâu?
  rationale: Trong ngữ cảnh trước mắt, câu hỏi nói đến nơi Đức Giê-su đang ở hoặc lưu trú. Cách dịch này tự nhiên trong tiếng Việt, còn chú thích bảo lưu mối liên hệ từ vựng với nghĩa “ở lại” của μένω.
theological_decisions:
- issue: Động từ μένω ở lần xuất hiện sớm này về sau mang sức nặng thần học trong sách Giăng
  choice: Thầy ở đâu?
  alternative: Thầy đang lưu lại ở đâu?
  rationale: Ngữ cảnh trực tiếp cho thấy hai người hỏi nơi Đức Giê-su ở hoặc lưu trú. Bản dịch chính ưu tiên tiếng Việt tự nhiên, còn chú thích cho biết nghĩa “lưu lại/ở lại” để không che khuất sự lặp lại có ý nghĩa của động từ trong sách.
- issue: ζητέω có thể vừa chỉ việc tìm kiếm thông thường vừa gợi một sự tìm kiếm sâu xa
  choice: Các anh đang tìm kiếm điều gì?
  alternative: Các anh đang tìm gì?
  rationale: “Tìm kiếm” bảo lưu được chiều sâu tiềm tàng trong lời hỏi đầu tiên của Đức Giê-su mà không buộc câu này phải mang một cách hiểu thần học duy nhất.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Đức Giê-su,” “Ngài,” và lời xưng hô “các anh/Thầy” để thể hiện sự kính trọng mà không cổ hóa. Cấu trúc câu giữ nhịp kể của nguyên văn nhưng chuyển động từ nói thành “hỏi/thưa” theo chức năng hội thoại tự nhiên trong tiếng Việt.
