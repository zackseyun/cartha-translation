base_translation:
  language: en
  yaml_path: translation/nt/john/001/044.yaml
  text: Philip was from Bethsaida[a], from the town of Andrew and Peter.
translation:
  language: vi
  text: Phi-líp quê ở Bết-sai-đa[a], cũng là quê của Anh-rê và Phi-e-rơ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn theo cấu trúc: “Phi-líp ở/từ Bết-sai-đa, từ thành của Anh-rê và Phi-e-rơ”; tức Bết-sai-đa cũng là quê của họ. “Thành” cũng có thể hiểu là “thị trấn”.'
    reason: Giữ lại cấu trúc lặp hai giới từ và các khả năng dịch của πόλις, đồng thời diễn đạt chính xác động từ ἦν.
lexical_decisions:
- source_word: ἦν
  choice: quê ở
  rationale: Động từ εἰμί ở thì quá khứ mô tả nguồn gốc của Phi-líp. Trong tiếng Việt, “quê ở” diễn đạt tự nhiên ý xuất thân mà không cần sao chép cấu trúc “đã là từ” của tiếng Hy Lạp.
- source_word: δὲ
  choice: không dịch riêng
  rationale: δέ là từ nối nhẹ trong mạch kể. Ở đây, tiếng Việt không cần một từ nối như “bấy giờ” hay “nhưng”; lược đi tránh tạo sắc thái thời gian hoặc tương phản không có trong nguyên văn.
- source_word: Φίλιππος
  choice: Phi-líp
  rationale: Phiên âm tên riêng theo cách dùng tiếng Việt quen thuộc.
- source_word: ἀπὸ Βηθσαϊδά
  choice: quê ở Bết-sai-đa
  rationale: ἀπό chỉ nguồn gốc. “Quê ở” là cách diễn đạt tự nhiên trong tiếng Việt; Bết-sai-đa được phiên âm như địa danh.
- source_word: ἐκ τῆς πόλεως
  choice: cũng là quê
  rationale: ἐκ tiếp tục nêu nguồn gốc từ cùng địa điểm; πόλις ở đây chỉ địa phương/thành nơi họ xuất thân. Cách dịch này tránh lặp gượng “từ thành” nhưng vẫn bảo toàn quan hệ đồng quê quán.
- source_word: Ἀνδρέου καὶ Πέτρου
  choice: của Anh-rê và Phi-e-rơ
  rationale: Các sở hữu cách gắn với πόλεως, biểu thị nơi Anh-rê và Phi-e-rơ xuất thân. “Quê của” truyền đạt rõ quan hệ ấy trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “quê ở… cũng là quê của…” để thể hiện tự nhiên rằng Bết-sai-đa là nơi xuất thân chung của ba người; dấu chú thích [a] xuất hiện ngay sau địa danh trong chính văn.
