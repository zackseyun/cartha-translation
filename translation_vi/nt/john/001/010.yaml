id: JHN.1.10
reference: John 1:10
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἐν τῷ κόσμῳ ἦν, καὶ ὁ κόσμος δι’ αὐτοῦ ἐγένετο, καὶ ὁ κόσμος αὐτὸν οὐκ ἔγνω.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/010.yaml
  text: He was in the world[a], and the world came into being through him[b], and the world did not know him.
translation:
  language: vi
  text: Ngài ở trong thế gian, thế gian đã nhờ Ngài mà có[a], nhưng thế gian không nhận biết Ngài[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “thế gian đã được tạo thành nhờ Ngài.” Động từ Hy Lạp có nghĩa là “trở thành” hoặc “đi vào hiện hữu.”'
    reason: lexical_alternative
  - marker: b
    text: “Không nhận biết Ngài” cũng có thể hàm ý “không nhận ra Ngài” hoặc “không thừa nhận Ngài.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κόσμῳ / κόσμος
  choice: thế gian
  rationale: 'Giữ cùng một cách dịch cho cả ba lần xuất hiện, đồng thời bảo toàn trường nghĩa nhiều lớp của κόσμος: trật tự thụ tạo, thế giới có người ở, và nhân loại xa cách Đức Chúa Trời.'
- source_word: ἦν
  choice: ở
  rationale: Trong cụm “ở trong thế gian”, “ở” diễn đạt tự nhiên sự hiện diện kéo dài của thì chưa hoàn thành ἦν mà không thêm sắc thái triết học.
- source_word: δι’ αὐτοῦ
  choice: nhờ Ngài
  rationale: διά với sở hữu cách biểu thị phương tiện hoặc tác nhân trung gian; “nhờ Ngài” tự nhiên trong tiếng Việt và phù hợp với ý của Giăng 1:3.
- source_word: ἐγένετο
  choice: mà có
  rationale: Cụm “đã nhờ Ngài mà có” diễn đạt việc thế gian đi vào hiện hữu, đồng thời giữ sự phân biệt giữa ἐγένετο và ἦν trong câu.
- source_word: ἔγνω
  choice: không nhận biết
  rationale: “Nhận biết” giữ được ý biết một người, đồng thời có thể bao hàm nhận ra và thừa nhận; không thu hẹp động từ vào chỉ một sắc thái.
- source_word: αὐτόν / αὐτοῦ
  choice: Ngài
  rationale: Các đại từ chỉ về Ngôi Lời trong văn cảnh trước đó. “Ngài” giữ tham chiếu nhân vị và là đại từ tôn kính tự nhiên trong văn phong Kinh Thánh tiếng Việt hiện đại.
theological_decisions:
- issue: Chủ ngữ được hiểu ngầm
  choice: Dùng “Ngài”, chỉ về Ngôi Lời trong văn cảnh trực tiếp.
  alternative: Dùng một đại từ phi nhân xưng nếu chỉ xét danh từ “Lời” một cách tách rời văn cảnh.
  rationale: Giăng 1:1–9 đã trình bày Ngôi Lời như một chủ thể có ngôi vị. “Ngài” giữ mạch quy chiếu ấy mà không thêm thuật ngữ tín lý ngoài bản văn.
- issue: Ngôn ngữ sáng tạo liên quan đến Ngôi Lời
  choice: Dịch “thế gian đã nhờ Ngài mà có”.
  alternative: “Thế gian đã được dựng nên bởi Ngài.”
  rationale: Cách dịch đã chọn bảo toàn sự tương phản trong lời mở đầu giữa ἦν, nói về sự hiện hữu của Ngôi Lời, và ἐγένετο, nói về việc thế gian đi vào hiện hữu, mà không đồng nhất hai động từ.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Lặp lại “thế gian” cả ba lần để phản ánh cấu trúc và tính đa nghĩa của nguyên văn; dùng “nhưng” ở mệnh đề cuối để diễn đạt rõ quan hệ tương phản vốn được hàm chứa trong văn cảnh.
