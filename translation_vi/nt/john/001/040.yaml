revisions:
- from: Anh-rê, em trai của Si-môn Phi-e-rơ, là một trong hai người đã nghe lời Giăng và đi theo Ngài.[a]
  to: Anh-rê, anh/em trai của Si-môn Phi-e-rơ, là một trong hai người đã nghe từ Giăng và đi theo Ngài.[a]
  rationale: Sửa «em trai» thành «anh/em trai» để bảo toàn sự không xác định về thứ tự tuổi trong ἀδελφός. Sửa «nghe lời Giăng» thành «nghe từ Giăng» để phản ánh trực tiếp hơn παρὰ Ἰωάννου và tránh thêm danh từ không có trong nguyên văn. Các yếu tố khác được giữ nguyên.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T05:36:35Z'
review_pass:
  verdict: revise
  source_fidelity: Bản thảo truyền đạt đúng cấu trúc chính của câu, trình tự «đã nghe ... và đi theo», và quy chiếu của αὐτῷ theo văn mạch. Tuy nhiên, «em trai» xác định Anh-rê là em của Si-môn, trong khi ἀδελφός ở câu này chỉ nói «anh/em trai» và không nêu thứ tự tuổi. Dữ kiện từ câu kế tiếp không nên được đưa vào bản dịch câu này.
  naturalness: Câu văn tự nhiên, rõ ràng và phù hợp văn phong Kinh Thánh tiếng Việt hiện đại. «Anh/em trai» tuy gọn nhưng là cách diễn đạt cần thiết để không áp đặt quan hệ lớn/nhỏ mà nguyên ngữ không nói. «Đã nghe từ Giăng» phản ánh trực tiếp hơn quan hệ nguồn của παρὰ Ἰωάννου.
  terminology: Các tên «Anh-rê», «Si-môn Phi-e-rơ», «Giăng», và đại từ tôn kính «Ngài» nhất quán với lối dùng Kinh Thánh tiếng Việt. Chú thích về «Ngài» phù hợp văn cảnh và không thay đại từ bằng tên riêng trong chính văn.
  issues:
  - severity: medium
    issue: «em trai của Si-môn Phi-e-rơ» thêm thứ tự tuổi không có trong nguyên ngữ.
