source:
  edition: SBLGNT
  text: ἦν Ἀνδρέας ὁ ἀδελφὸς Σίμωνος Πέτρου εἷς ἐκ τῶν δύο τῶν ἀκουσάντων παρὰ Ἰωάννου καὶ ἀκολουθησάντων αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/john/001/040.yaml
  text: Andrew[a], Simon Peter’s brother, was one of the two who had heard from John and followed him.
translation:
  language: vi
  text: Anh-rê, anh/em trai của Si-môn Phi-e-rơ, là một trong hai người đã nghe từ Giăng và đi theo Ngài.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ngài” chỉ Chúa Giê-su theo văn cảnh.
    reason: Làm rõ đối tượng của đại từ αὐτῷ mà không thay đại từ bằng tên riêng trong chính văn.
lexical_decisions:
- source_word: ἦν
  choice: là
  rationale: Động từ εἰμί ở thì chưa hoàn thành làm hệ từ trong câu nhận diện; tiếng Việt tự nhiên dùng “là”, không cần thể hiện riêng thì quá khứ.
- source_word: Ἀνδρέας
  choice: Anh-rê
  rationale: Phiên âm tên riêng theo cách dùng Kinh Thánh tiếng Việt quen thuộc.
- source_word: ὁ ἀδελφὸς Σίμωνος Πέτρου
  choice: em trai của Si-môn Phi-e-rơ
  rationale: ἀδελφός chỉ anh/em ruột; theo dữ kiện trong Giăng 1:41, Anh-rê là em của Si-môn. “Em trai” tự nhiên và cụ thể trong tiếng Việt.
- source_word: εἷς ἐκ τῶν δύο
  choice: một trong hai người
  rationale: Diễn đạt tự nhiên và chính xác cấu trúc phân bộ.
- source_word: τῶν ἀκουσάντων
  choice: đã nghe lời
  rationale: Phân từ bất định chỉ hành động xảy ra trước việc đi theo. Thêm “lời” để tiếng Việt tự nhiên nhưng không xác định nội dung ngoài văn cảnh.
- source_word: παρὰ Ἰωάννου
  choice: Giăng
  rationale: 'παρά với sở hữu cách chỉ nguồn: họ nghe từ Giăng. Trong cụm “nghe lời Giăng”, quan hệ nguồn được diễn đạt tự nhiên bằng tiếng Việt.'
- source_word: καὶ ἀκολουθησάντων αὐτῷ
  choice: và đi theo Ngài
  rationale: ἀκολουθέω được dịch trực tiếp là “đi theo”. Đại từ αὐτῷ chỉ Chúa Giê-su theo mạch văn; “Ngài” là đại từ tôn kính quen thuộc nhưng không thêm danh xưng vào câu.
theological_decisions:
- issue: Đối tượng của αὐτῷ
  choice: “Ngài” chỉ Chúa Giê-su
  alternative: “người ấy” hoặc hiểu là Giăng
  rationale: Trong Giăng 1:35–39, hai môn đồ nghe lời Giăng rồi đi theo Chúa Giê-su. Bản dịch vẫn dùng đại từ, không chèn tên Chúa Giê-su vào chính văn, nhờ đó giữ hình thức quy chiếu của tiếng Hy Lạp.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Tên riêng dùng dạng phiên âm quen thuộc trong Kinh Thánh tiếng Việt. Chính văn giữ cấu trúc nhận diện của nguyên bản và làm rõ trình tự hành động bằng “đã”.
