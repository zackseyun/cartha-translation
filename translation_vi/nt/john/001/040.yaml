  - severity: low
    issue: «nghe lời Giăng» diễn giải nhẹ quan hệ «nghe từ Giăng».
    rationale: παρὰ Ἰωάννου nêu nguồn của việc nghe; nguyên văn không có danh từ tương đương «lời». «Nghe từ Giăng» giữ sát hơn tính khái quát của nguyên ngữ mà vẫn tự nhiên.
  revised_text: Anh-rê, anh/em trai của Si-môn Phi-e-rơ, là một trong hai người đã nghe từ Giăng và đi theo Ngài.[a]
