  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Τῇ ἐπαύριον ἠθέλησεν ἐξελθεῖν εἰς τὴν Γαλιλαίαν. καὶ εὑρίσκει Φίλιππον καὶ λέγει αὐτῷ ὁ Ἰησοῦς· Ἀκολούθει μοι.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/043.yaml
  text: The next day he wanted to go out into Galilee[a], and Jesus finds Philip and says to him[c][b], “Follow me.”
translation:
  language: vi
  text: Ngày hôm sau, Giê-su muốn đi đến miền Ga-li-lê.[a] Giê-su gặp Phi-líp và nói với ông:[b] “Hãy theo tôi.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đi vào miền Ga-li-lê.” Giới từ Hy Lạp chỉ hướng chuyển động đến một nơi; trong tiếng Việt có thể diễn đạt là “đến” hoặc “vào.”'
    reason: lexical_alternative
  - marker: b
    text: Các động từ “gặp” và “nói” trong tiếng Hy Lạp ở thì hiện tại lịch sử, một cách dùng thì hiện tại để làm cho lời kể thêm sinh động.
    reason: lexical_alternative
  - marker: c
    text: “Theo tôi” có thể vừa nói đến việc cùng đi với Giê-su, vừa mang nghĩa rộng hơn là đáp lại lời kêu gọi trở thành môn đồ của Ngài.
    reason: alternative_reading
lexical_decisions:
- source_word: Τῇ ἐπαύριον
  choice: Ngày hôm sau
  rationale: Cách diễn đạt thời gian tự nhiên trong tiếng Việt, giữ rõ trình tự của câu chuyện.
- source_word: ἠθέλησεν
  choice: muốn
  rationale: Giữ sắc thái ý muốn hoặc ý định của θέλω mà không diễn giải mạnh hơn thành “quyết định”.
- source_word: ἐξελθεῖν εἰς τὴν Γαλιλαίαν
  choice: đi vào miền Ga-li-lê
  rationale: “Đi vào” phản ánh chuyển động hướng vào một vùng theo giới từ εἰς; thêm “miền” giúp địa danh vùng đất nghe tự nhiên trong tiếng Việt.
- source_word: εὑρίσκει
  choice: gặp
  rationale: Trong ngữ cảnh gặp một người, “gặp” tự nhiên hơn “tìm thấy” và không nhất thiết hàm ý đã tìm kiếm trước đó. Tiếng Việt không biến đổi động từ theo thì, nên dạng kể này không xóa bỏ tính sống động của hiện tại lịch sử Hy Lạp.
- source_word: λέγει αὐτῷ
  choice: nói với ông
  rationale: Diễn đạt tự nhiên quan hệ gián tiếp trong tiếng Việt; “ông” chỉ Phi-líp với sắc thái tôn trọng thông thường.
- source_word: Ἀκολούθει μοι
  choice: Hãy theo tôi
  rationale: Giữ trực tiếp mệnh lệnh và để nguyên khả năng vừa chỉ việc đi theo về thể chất vừa chỉ lời kêu gọi làm môn đồ.
- source_word: Φίλιππον
  choice: Phi-líp
  rationale: Phiên âm tên riêng theo cách đọc quen thuộc trong tiếng Việt.
- source_word: ὁ Ἰησοῦς
  choice: Giê-su
  rationale: Phiên âm tên riêng trung tính, không thêm tước hiệu vốn không xuất hiện trong câu Hy Lạp.
theological_decisions:
- issue: Ý nghĩa mệnh lệnh Ἀκολούθει μοι
  choice: “Hãy theo tôi”
  alternative: “Hãy đi cùng tôi” hoặc diễn giải rõ thành “Hãy làm môn đồ của tôi”
  rationale: Bản dịch giữ được cả ý đi theo trong hoàn cảnh trước mắt lẫn chiều sâu của lời kêu gọi làm môn đồ, không thu hẹp câu vào chỉ một cách hiểu.
- issue: Chủ thể của ἠθέλησεν
  choice: Dùng “Ngài” theo mạch văn trước, rồi giữ tên “Giê-su” ở mệnh đề sau
  alternative: Đưa “Giê-su” lên đầu câu để xác định chủ thể ngay lập tức
  rationale: 'Cách chọn này bám sát hơn cách phân bố chủ thể trong câu Hy Lạp: động từ đầu có chủ thể được hiểu theo ngữ cảnh, còn tên Giê-su được nêu rõ ở mệnh đề tiếp theo.'
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và trung tính về truyền thống giáo phái. Dùng “Giê-su” thay vì thêm tước hiệu không có trong nguyên văn; dùng “tôi” trong lời nói trực tiếp vì tự nhiên và không áp đặt lối xưng hô riêng của một truyền thống. Cấu trúc câu ngắn giữ nhịp kể sống động của nguyên văn.
