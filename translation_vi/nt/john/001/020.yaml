  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ὡμολόγησεν καὶ οὐκ ἠρνήσατο, καὶ ὡμολόγησεν ὅτι ⸂Ἐγὼ οὐκ εἰμὶ⸃ ὁ χριστός.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/020.yaml
  text: And he confessed and did not deny[a], but confessed, “I am not the Messiah.”
translation:
  language: vi
  text: 'Ông đã công khai xác nhận và không phủ nhận; ông xác nhận: “Tôi không phải là Đấng Mê-si[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “Đấng Christ.” Từ Hy Lạp Χριστός (Christos) có nghĩa là “Đấng được xức dầu”; tại đây từ này được dùng như một tước hiệu chỉ Đấng Mê-si.
    reason: alternative_rendering
lexical_decisions:
- source_word: ὡμολόγησεν
  choice: công khai xác nhận / tuyên bố
  rationale: Động từ ὁμολογέω ở đây chỉ sự thừa nhận công khai. Hai cách diễn đạt tự nhiên trong tiếng Việt được dùng để giữ phép lặp của nguyên văn mà tránh câu văn gượng.
- source_word: οὐκ ἠρνήσατο
  choice: không hề phủ nhận
  rationale: Giữ nghĩa trực tiếp của ἀρνέομαι và thêm “hề” để chuyển tải sắc thái nhấn mạnh trong chuỗi diễn đạt.
- source_word: καὶ ... καὶ ... καὶ
  choice: '..., không hề ..., mà ...'
  rationale: Chuỗi liên từ καί tạo nhịp nhấn mạnh; “mà” ở vế cuối diễn đạt tự nhiên quan hệ tăng tiến và tái khẳng định trong tiếng Việt.
- source_word: Ἐγὼ οὐκ εἰμὶ
  choice: Tôi không phải là
  rationale: Đây là cách phủ định danh tính tự nhiên, trực tiếp trong tiếng Việt; đại từ Ἐγώ được thể hiện bằng “Tôi”.
- source_word: ὁ χριστός
  choice: Đấng Mê-si
  rationale: Χριστός ở đây là tước hiệu chỉ Đấng được xức dầu mà dân chúng trông đợi; “Đấng Mê-si” giữ rõ bối cảnh Do Thái và chức năng tước hiệu.
theological_decisions:
- issue: Cách dịch Χριστός như một tước hiệu
  choice: Đấng Mê-si
  alternative: Đấng Christ
  rationale: Trong ngữ cảnh này, Giăng phủ nhận mình là Đấng được xức dầu mà người ta trông đợi. Vì từ này mang chức năng tước hiệu chứ không phải tên riêng, “Đấng Mê-si” được đặt trong chính văn; cách gọi quen thuộc “Đấng Christ” được ghi ở chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Ông” theo mạch văn chỉ Giăng; nhịp ba vế bảo tồn sắc thái công khai, dứt khoát của lời phủ nhận.
