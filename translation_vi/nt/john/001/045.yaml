id: JHN.1.45
reference: John 1:45
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εὑρίσκει Φίλιππος τὸν Ναθαναὴλ καὶ λέγει αὐτῷ· Ὃν ἔγραψεν Μωϋσῆς ἐν τῷ νόμῳ καὶ οἱ προφῆται εὑρήκαμεν, ⸀Ἰησοῦν υἱὸν τοῦ Ἰωσὴφ τὸν ἀπὸ Ναζαρέτ.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/045.yaml
  text: 'Philip found Nathanael and said to him[a], “We have found him of whom Moses in the Law and also the prophets wrote: Jesus son of Joseph[b], from Nazareth.”'
translation:
  language: vi
  text: 'Phi-líp tìm gặp Na-tha-na-ên và nói với ông: “Chúng ta đã tìm thấy người mà Môi-se đã viết về trong Luật pháp, và các tiên tri cũng đã viết về người ấy: Giê-su, con ông Giô-sép[a], người từ Na-xa-rét[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cụm «con ông Giô-sép» là lời Phi-líp dùng để nhận diện Giê-su trong bối cảnh xã hội lúc ấy; nguyên văn không thêm «được cho là».
    reason: theological_ambiguity
  - marker: b
    text: Nguyên văn nói sát nghĩa là «người từ Na-xa-rét», nhấn mạnh xuất xứ hoặc sự liên hệ với nơi ấy.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὑρίσκει
  choice: tìm gặp
  rationale: Thì hiện tại lịch sử của tiếng Hy Lạp được diễn đạt tự nhiên bằng quá khứ trong mạch kể tiếng Việt; “tìm gặp” phù hợp với việc Phi-líp gặp Na-tha-na-ên.
- source_word: λέγει
  choice: nói
  rationale: Hiện tại lịch sử được chuyển theo lối kể quá khứ tự nhiên của tiếng Việt, không làm thay đổi trình tự sự kiện.
- source_word: Ὃν ... ἔγραψεν
  choice: Đấng mà ... đã viết ... về Ngài
  rationale: Giữ rõ đối tượng là một người và thể hiện quan hệ cú pháp của đại từ quan hệ Hy Lạp bằng cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: ἐν τῷ νόμῳ
  choice: trong Luật pháp
  rationale: Chỉ phần Kinh Thánh gắn với Môi-se, không phải luật lệ nói chung; “Luật pháp” là cách gọi trang trọng và quen thuộc.
- source_word: οἱ προφῆται
  choice: các nhà tiên tri
  rationale: Diễn đạt tự nhiên nhóm những người và trước tác tiên tri làm chứng trong Kinh Thánh.
- source_word: εὑρήκαμεν
  choice: chúng ta đã tìm thấy
  rationale: Thể hoàn thành Hy Lạp nói đến một phát hiện đã xảy ra với kết quả còn hiện hữu; cấu trúc “đã tìm thấy” truyền đạt điều này tự nhiên.
- source_word: υἱὸν τοῦ Ἰωσὴφ
  choice: con ông Giô-sép
  rationale: Giữ nguyên cách Phi-líp nhận diện Đức Giê-su theo quan hệ xã hội thông thường, không thêm lời giải thích thần học vào chính văn.
- source_word: τὸν ἀπὸ Ναζαρέτ
  choice: người từ Na-xa-rét đến
  rationale: Phản ánh trực tiếp giới từ ἀπό, nhấn mạnh xuất xứ hoặc sự liên hệ với Na-xa-rét thay vì dùng một danh hiệu cố định.
theological_decisions:
- issue: Cách hiểu “con ông Giô-sép” trong tương quan với Kitô học
  choice: 'Giữ nguyên lời nhận diện của Phi-líp: “Đức Giê-su, con ông Giô-sép.”'
  alternative: “Đức Giê-su, người được cho là con ông Giô-sép” hoặc thêm chú thích rằng đây chỉ là quan hệ pháp lý/xã hội.
  rationale: Câu này thuật lại lời Phi-líp ở thời điểm ấy. Không nên sửa lời văn để dung hòa rõ ràng với giáo lý về sự thụ thai đồng trinh; bản dịch giữ nguyên sự căng thẳng của lời kể.
- issue: Phạm vi lời chứng của “Môi-se ... và các nhà tiên tri”
  choice: Trình bày Môi-se và các nhà tiên tri là hai chủ thể đã viết về Đấng được tìm thấy.
  alternative: Hiểu toàn cụm như một cách gọi chung cho Kinh Thánh hoặc nói rõ đây là các lời tiên tri về Đấng Mê-si-a.
  rationale: Cách dịch bám sát cấu trúc Hy Lạp và không xác định chi tiết hơn điều Phi-líp thực sự tuyên bố.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đấng/Ngài” theo ngữ cảnh người được Kinh Thánh làm chứng, nhưng không thêm danh hiệu “Đấng Mê-si-a”. Tên riêng được phiên âm theo quy ước tiếng Việt phổ biến.
