- from: Hai môn đồ ấy nghe ông nói[a] thì đi theo Đức Chúa Jêsus.
  to: Hai môn đồ ấy[a] nghe ông nói rồi đi theo Giê-su.
  rationale: Sửa tên riêng để theo tiếng Việt hiện đại và không thêm tước hiệu không có trong nguyên văn. Giữ «hai môn đồ ấy», «nghe ông nói», và «đi theo» vì chúng diễn đạt trung thành quan hệ ngữ cảnh, hành động nghe đang diễn ra, và nghĩa cụ thể đồng thời để ngỏ âm hưởng môn đồ của ἀκολουθέω. Điều chỉnh vị trí và nội dung chú thích để neo đúng cụm có αὐτοῦ.
