  text: καὶ ἤκουσαν ⸂οἱ δύο μαθηταὶ αὐτοῦ⸃ λαλοῦντος καὶ ἠκολούθησαν τῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/037.yaml
  text: And the two disciples heard him speaking[a], and they followed Jesus.
translation:
  language: vi
  text: Hai môn đồ ấy[a] nghe ông nói rồi đi theo Giê-su.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nói rõ hơn: “hai môn đồ của ông”; “ông” chỉ Giăng Báp-tít.'
    reason: Làm rõ αὐτοῦ trong cụm “hai môn đồ của ông” theo ngữ cảnh trước đó, trong khi bản văn chính tránh đại từ sở hữu có thể gây nhầm lẫn.
lexical_decisions:
- source_word: ἤκουσαν
  choice: nghe
  rationale: Động từ aorist ἀκούω diễn tả sự việc họ nghe lời được nói; “nghe” tự nhiên và không thêm ý chăm chú kéo dài.
- source_word: οἱ δύο μαθηταὶ αὐτοῦ
  choice: hai môn đồ ấy
  rationale: Cụm từ xác định hai môn đồ của Giăng Báp-tít đã xuất hiện trong câu trước. “Ấy” giúp nhận diện đúng hai người mà không dùng đại từ sở hữu dễ gây hiểu lầm là môn đồ của Đức Chúa Jêsus.
- source_word: λαλοῦντος
  choice: ông nói
  rationale: Phân từ hiện tại cho biết họ nghe Giăng trong lúc ông đang nói. Tiếng Việt tự nhiên có thể diễn đạt gọn bằng “nghe ông nói”; “ông” quy chiếu về Giăng Báp-tít.
- source_word: ἠκολούθησαν
  choice: đi theo
  rationale: ἀκολουθέω trước hết chỉ việc đi theo Đức Chúa Jêsus, đồng thời có thể gợi ý nghĩa trở thành người theo Ngài. “Đi theo” giữ được nghĩa hành động trong bối cảnh mà không loại bỏ âm hưởng môn đồ.
- source_word: τῷ Ἰησοῦ
  choice: Đức Chúa Jêsus
  rationale: Tặng cách đánh dấu người được đi theo; cú pháp tiếng Việt dùng trực tiếp “đi theo Đức Chúa Jêsus”.
theological_decisions:
- issue: Đối tượng quy chiếu của αὐτοῦ trong οἱ δύο μαθηταὶ αὐτοῦ
  choice: Hiểu là Giăng Báp-tít; bản dịch dùng “hai môn đồ ấy” và chú thích làm rõ.
  alternative: Dịch sát là “hai môn đồ của ông”, nhưng “ông” có thể bị người đọc gắn nhầm với Đức Chúa Jêsus.
  rationale: Trong Giăng 1:35–36, Giăng Báp-tít đang đứng với hai môn đồ của mình và nói về Đức Chúa Jêsus. Tuy vậy, vì αὐτοῦ có mặt trong nguyên văn, chú thích bảo tồn thông tin sở hữu thay vì hoàn toàn lược bỏ.
- issue: Sắc thái của ἠκολούθησαν
  choice: “đi theo”, vừa chỉ chuyển động thực tế vừa để ngỏ âm hưởng của việc theo làm môn đồ
  alternative: “theo” hoặc “trở thành môn đồ”
  rationale: Bối cảnh trực tiếp mô tả họ đi sau Đức Chúa Jêsus; dịch “trở thành môn đồ” sẽ giải nghĩa quá mức, còn “đi theo” giữ được cả nghĩa cụ thể lẫn chiều sâu tường thuật.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng và dễ hiểu. Dùng “môn đồ” theo thuật ngữ Kinh Thánh quen thuộc; “Đức Chúa Jêsus” theo quy ước danh xưng của bản POB tiếng Việt. Cấu trúc “nghe… thì…” diễn đạt tự nhiên quan hệ nối tiếp giữa việc nghe và việc đi theo.
