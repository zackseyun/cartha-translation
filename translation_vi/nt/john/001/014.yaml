revisions:
- from: Ngôi Lời đã trở nên xác thịt và cư ngụ giữa chúng ta[a]. Chúng ta đã chiêm ngưỡng vinh quang của Ngài, vinh quang như của Con Một đến từ Cha[b], đầy ân điển và chân lý.
  to: Ngôi Lời đã trở nên xác thịt và cư ngụ giữa chúng ta[a], và chúng ta đã chiêm ngưỡng vinh quang của Ngài, vinh quang như của Con Một đến từ Cha[b]. Ngài là Đấng đầy ân điển và chân lý.
  rationale: 'Sửa chính văn chỉ để giải quyết một điểm cú pháp quan trọng: xác định rõ “đầy ân điển và chân lý” mô tả Ngôi Lời/Đấng Con Một, theo giống và số của πλήρης trong tiếng Hy Lạp. Các lựa chọn từ ngữ cốt lõi của bản nháp được giữ lại. Chú thích a được thu gọn và chính xác hóa; chú thích b giữ các phương án dịch có liên quan mà không gán nghĩa “được sinh ra” cho μονογενοῦς.'
