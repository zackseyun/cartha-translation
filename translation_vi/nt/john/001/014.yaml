id: JHN.1.14
reference: John 1:14
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ ὁ λόγος σὰρξ ἐγένετο καὶ ἐσκήνωσεν ἐν ἡμῖν, καὶ ἐθεασάμεθα τὴν δόξαν αὐτοῦ, δόξαν ὡς μονογενοῦς παρὰ πατρός, πλήρης χάριτος καὶ ἀληθείας·
base_translation:
  language: en
  yaml_path: translation/nt/john/001/014.yaml
  text: And the Word became flesh and dwelt among us[a], and we saw his glory, glory as of the one and only Son from the Father[b], full of grace and truth.
translation:
  language: vi
  text: Ngôi Lời đã trở nên xác thịt và cư ngụ giữa chúng ta[a], và chúng ta đã chiêm ngưỡng vinh quang của Ngài, vinh quang như của Con Một đến từ Cha[b]. Ngài là Đấng đầy ân điển và chân lý.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Động từ Hy Lạp có nghĩa đen là “dựng lều ở giữa chúng ta,” gợi hình ảnh lều/đền tạm, nơi Đức Chúa Trời hiện diện giữa dân Ngài.
    reason: lexical_alternative
  - marker: b
    text: “Con Một” cũng có thể dịch là “Con duy nhất”; cách dịch truyền thống là “Con độc sinh.” Cụm “đến từ Cha” cũng có thể diễn đạt là “từ nơi Cha.”
    reason: alternative_reading
lexical_decisions:
- source_word: λόγος
  choice: Ngôi Lời
  rationale: Giữ danh xưng giàu ý nghĩa trong phần mở đầu của Giăng, đồng thời tự nhiên và quen thuộc trong tiếng Việt Kinh Thánh.
- source_word: σὰρξ ἐγένετο
  choice: đã trở nên xác thịt
  rationale: 'Bám sát sự chuyển biến được diễn đạt bởi ἐγένετο và giữ sức nặng của σάρξ: Ngôi Lời thực sự bước vào đời sống con người có thân thể, chứ không chỉ mang một ý niệm trừu tượng về nhân tính.'
- source_word: ἐσκήνωσεν ἐν ἡμῖν
  choice: cư ngụ giữa chúng ta
  rationale: Diễn đạt tự nhiên trong tiếng Việt hiện đại; hình ảnh dựng lều/Đền Tạm hàm chứa trong động từ được bảo lưu ở chú thích.
- source_word: ἐθεασάμεθα
  choice: đã chiêm ngưỡng
  rationale: Diễn tả việc trực tiếp chứng kiến với sắc thái chăm chú hơn 'đã thấy', nhưng vẫn trang trọng và dễ hiểu.
- source_word: δόξαν
  choice: vinh quang
  rationale: Là cách dịch chuẩn, giữ được chiều sâu thần học và sự liên kết với chủ đề vinh quang trong Kinh Thánh.
- source_word: μονογενοῦς
  choice: Con Một
  rationale: Diễn đạt ngắn gọn và tự nhiên tính độc nhất, vô song của người Con trong quan hệ với Cha; các cách hiểu 'Con duy nhất' và truyền thống 'Con độc sinh' được nêu trong chú thích.
- source_word: παρὰ πατρός
  choice: đến từ Cha
  rationale: Phản ánh tự nhiên ý nghĩa nguồn gốc hoặc sự đến từ nơi Cha của παρά trong ngữ cảnh này, đồng thời không thêm mạo từ mà bản Hy Lạp không có.
- source_word: πλήρης χάριτος καὶ ἀληθείας
  choice: đầy ân điển và chân lý
  rationale: Giữ cấu trúc và các thuật ngữ thần học quen thuộc, đồng thời phản ánh mô-típ giao ước của câu.
theological_decisions:
- issue: Cách hiểu μονογενοῦς trong ngữ cảnh Kitô học
  choice: Con Một
  alternative: Con duy nhất; Con độc sinh
  rationale: Nghĩa từ vựng nổi bật là độc nhất, vô song. 'Con Một' vừa tự nhiên vừa giữ được quan hệ Con–Cha; chú thích bảo lưu cách dịch truyền thống 'Con độc sinh' mà không buộc từ Hy Lạp phải mang riêng nghĩa 'được sinh ra'.
- issue: Có đưa trực tiếp hình ảnh Đền Tạm của ἐσκήνωσεν vào chính văn hay không
  choice: cư ngụ giữa chúng ta
  alternative: dựng lều ở giữa chúng ta
  rationale: Chính văn ưu tiên tiếng Việt sáng rõ, còn chú thích giúp người đọc nhận biết tiếng vọng về lều hội kiến/Đền Tạm mà không diễn giải quá mức.
- issue: Điểm quy chiếu của πλήρης
  choice: Giữ 'đầy ân điển và chân lý' sau mô tả về Con Một
  alternative: Diễn đạt lại rõ ràng rằng Ngôi Lời là Đấng đầy ân điển và chân lý
  rationale: Tiếng Hy Lạp dùng πλήρης ở giống đực số ít, về ngữ pháp hướng về λόγος/μονογενής hơn là δόξα. Bản dịch giữ trật tự và chút căng thẳng cú pháp của nguyên văn thay vì chèn chủ ngữ giải thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng 'Ngôi Lời', 'ân điển', 'chân lý' để giữ tính liên tục với thuật ngữ Kinh Thánh tiếng Việt; dùng 'Ngài' cho đại từ chỉ Ngôi Lời. Không viết hoa 'xác thịt' vì đây là danh từ chung.
