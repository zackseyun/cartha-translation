  text: πάντα δι’ αὐτοῦ ἐγένετο, καὶ χωρὶς αὐτοῦ ἐγένετο οὐδὲ ἕν. ὃ γέγονεν
base_translation:
  language: en
  yaml_path: translation/nt/john/001/003.yaml
  text: All things came into being through him[a], and apart from him not even one thing came into being that has come into being.
translation:
  language: vi
  text: Muôn vật đều nhờ Ngài mà trở nên; không có Ngài thì chẳng một vật nào đã trở nên, trong mọi vật đã trở nên.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc, bắt đầu câu 4: “Điều đã trở nên trong Ngài là sự sống.”'
    reason: alternative_reading
lexical_decisions:
- source_word: πάντα
  choice: Muôn vật
  rationale: Đại từ trung tính số nhiều mang nghĩa bao quát. “Muôn vật” tự nhiên, trang trọng và giữ phạm vi toàn thể của câu.
- source_word: δι’ αὐτοῦ
  choice: nhờ Ngài
  rationale: διά với sở hữu cách chỉ tác nhân trung gian hoặc phương tiện. “Nhờ Ngài” diễn đạt tự nhiên rằng mọi sự hiện hữu qua Logos, không đồng nhất cách nói này với tác nhân nguồn.
- source_word: ἐγένετο
  choice: hiện hữu
  rationale: Trong văn cảnh này, γίνομαι nói đến việc đi vào hiện hữu hơn là chỉ được chế tác. Cách dịch này giữ sắc thái bản thể của động từ.
- source_word: χωρὶς αὐτοῦ
  choice: không có Ngài
  rationale: χωρίς diễn tả sự tách biệt hoặc vắng mặt. “Không có Ngài” là cách nói tiếng Việt rõ ràng, tự nhiên, vẫn giữ sự phủ định về một nguồn gốc độc lập.
- source_word: οὐδὲ ἕν
  choice: chẳng một vật nào
  rationale: Cụm từ mang tính nhấn mạnh và phủ định tuyệt đối. “Chẳng một vật nào” giữ được lực của οὐδέ kết hợp với ἕν trung tính số ít.
- source_word: ὃ γέγονεν
  choice: trong số những gì đã hiện hữu
  rationale: Theo cách ngắt câu gắn mệnh đề này với câu 3, cụm từ xác định toàn bộ những gì đã đi vào hiện hữu. “Đã hiện hữu” phản ánh thể hoàn thành γέγονεν mà không làm câu tiếng Việt quá nặng.
theological_decisions:
- issue: Quan hệ của mệnh đề cuối ὃ γέγονεν
  choice: 'Gắn với câu 3: “chẳng một vật nào đã hiện hữu trong số những gì đã hiện hữu.”'
  alternative: 'Bắt đầu câu 4: “Điều đã hiện hữu trong Ngài là sự sống.”'
  rationale: Các thủ bản Hy Lạp ban đầu không có dấu câu, nên về cú pháp mệnh đề có thể thuộc câu 3 hoặc câu 4. Bản chính theo cách gắn với câu 3, còn cách đọc thực sự khả hữu kia được giữ trong chú thích để không xóa bỏ sự mơ hồ của nguồn.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “Ngài” cho αὐτός quy chiếu về Ngôi Lời; “muôn vật” tạo nhịp văn phù hợp với phần mở đầu cao trọng. Dấu chú thích [a] đặt sau toàn mệnh đề vì chú thích liên quan đến cách ngắt câu ở ranh giới câu 3–4.
