  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οὗτος ἦλθεν εἰς μαρτυρίαν, ἵνα μαρτυρήσῃ περὶ τοῦ φωτός, ἵνα πάντες πιστεύσωσιν δι’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/007.yaml
  text: He came as a witness[a], so that he might testify about the Light[b], so that all might believe through him.
translation:
  language: vi
  text: Người đến với tư cách là một chứng nhân, để làm chứng về Ánh Sáng, hầu cho mọi người nhờ người[a] mà tin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Có thể hiểu là nhờ lời chứng của Giăng; một số người hiểu “người” là Ánh Sáng.
    reason: alternative_reading
lexical_decisions:
- source_word: οὗτος
  choice: Người
  rationale: Đại từ chỉ định hồi chỉ về Giăng ở câu trước. Trong tiếng Việt, “Người” tự nhiên hơn “người này” trong mạch văn này mà vẫn giữ rõ chủ thể.
- source_word: ἦλθεν εἰς μαρτυρίαν
  choice: đến để làm chứng
  rationale: Cách diễn đạt tự nhiên này truyền đạt mục đích/vai trò chứng nhân của Giăng mà không biến μαρτυρία thành một danh xưng cứng nhắc.
- source_word: ἵνα μαρτυρήσῃ περὶ τοῦ φωτός
  choice: nhằm làm chứng về Ánh Sáng
  rationale: Giữ cấu trúc mục đích của ἵνα và sắc thái chứng nhận của μαρτυρέω; “về” là cách diễn đạt tự nhiên cho περί với sở hữu cách.
- source_word: τοῦ φωτός
  choice: Ánh Sáng
  rationale: Viết hoa để biểu thị cách dùng mang tính nhân vị/danh xưng trong văn mạch Giăng, chỉ Đấng được nói đến chứ không chỉ ánh sáng vật lý.
- source_word: ἵνα πάντες πιστεύσωσιν
  choice: để ... mọi người đều tin
  rationale: Giữ mệnh đề mục đích thứ hai; “mọi người đều” diễn đạt tự nhiên phạm vi rộng của πάντες mà không hàm ý rằng kết quả ấy nhất thiết đã xảy ra với từng người.
- source_word: δι’ αὐτοῦ
  choice: qua người
  rationale: Giữ nghĩa phương tiện của διά với sở hữu cách và sự mơ hồ về tiền ngữ của αὐτοῦ; trong văn mạch, “người” nhiều khả năng chỉ Giăng.
theological_decisions:
- issue: Tiền ngữ của αὐτοῦ trong δι’ αὐτοῦ
  choice: Giữ cách nói “qua người”, với cách hiểu chính là qua Giăng và lời chứng của ông
  alternative: “qua Ngài”, hiểu là qua Ánh Sáng/Đấng Mê-si
  rationale: Chủ thể đang được nói đến là Giăng và câu kế tiếp phân biệt ông với Ánh Sáng, nên Giăng là tiền ngữ hợp văn mạch hơn. Tuy vậy, bản dịch không thêm “lời chứng của” để tránh xóa hẳn khả năng ngữ pháp khác.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Người” cho Giăng theo lối hồi chỉ trang trọng; dùng hai cụm chỉ mục đích “nhằm... để...” để tránh lặp nặng nhưng vẫn phản ánh hai mệnh đề ἵνα của nguyên văn.
