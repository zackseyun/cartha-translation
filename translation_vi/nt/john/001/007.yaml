revisions:
- from: Người đến để làm chứng, nhằm làm chứng về Ánh Sáng, để qua người, mọi người đều tin.
  to: Người đến với tư cách là một chứng nhân, để làm chứng về Ánh Sáng, hầu cho mọi người nhờ người[a] mà tin.
  rationale: Bản sửa phân biệt vai trò “chứng nhân” với hành động “làm chứng”, chỉnh mệnh đề mục đích cuối cho tự nhiên trong tiếng Việt, và thêm chú thích tại “người” để bảo tồn khả năng tiền ngữ khác của αὐτοῦ mà không áp đặt một cách hiểu thần học.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T05:36:25Z'
review_pass:
  verdict: revise
  source_fidelity: Bản nháp giữ được hai mệnh đề mục đích (ἵνα), đối tượng “Ánh Sáng”, và ý nghĩa phương tiện của δι’ αὐτοῦ. Tuy nhiên, “để qua người, mọi người đều tin” đặt trạng ngữ và chủ ngữ không tự nhiên trong tiếng Việt; cần chuyển thành cấu trúc “mọi người nhờ người mà tin”.
  naturalness: Cụm “đến để làm chứng, nhằm làm chứng” gây lặp nặng và chưa phân biệt rõ vai trò chứng nhân (εἰς μαρτυρίαν) với hành động làm chứng (μαρτυρήσῃ). “Đến với tư cách là một chứng nhân” tự nhiên, trang trọng, và vẫn sát nghĩa.
  terminology: Giữ “làm chứng” cho μαρτυρέω và “Ánh Sáng” cho τοῦ φωτός là phù hợp với văn mạch Giăng. “Người” được giữ để hồi chỉ về Giăng mà không đưa vào tên riêng ngoài nguyên văn câu này. Chú thích cần nêu khả năng tiền ngữ khác của “người” trong δι’ αὐτοῦ.
  issues:
  - severity: medium
    issue: Trật tự từ trong mệnh đề cuối chưa tự nhiên
    rationale: “để qua người, mọi người đều tin” là cách đặt “qua người” trước chủ ngữ khá gượng trong tiếng Việt hiện đại. “hầu cho mọi người nhờ người mà tin” diễn đạt rõ và tự nhiên hơn, vẫn bảo toàn nghĩa phương tiện.
  - severity: low
    issue: Lặp cấu trúc “làm chứng” chưa được điều tiết
    rationale: Nguyên văn có danh từ μαρτυρία và động từ μαρτυρέω, nhưng tiếng Việt có thể phản ánh sự phân biệt này bằng “với tư cách là một chứng nhân” và “để làm chứng”, tránh lặp vụng mà không mất ý.
  revised_text: Người đến với tư cách là một chứng nhân, để làm chứng về Ánh Sáng, hầu cho mọi người nhờ người[a] mà tin.
