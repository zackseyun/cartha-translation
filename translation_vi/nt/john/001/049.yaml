id: JHN.1.49
reference: John 1:49
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀπεκρίθη ⸂αὐτῷ Ναθαναήλ⸃· Ῥαββί, σὺ εἶ ὁ υἱὸς τοῦ θεοῦ, σὺ ⸂βασιλεὺς εἶ⸃ τοῦ Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/049.yaml
  text: Nathanael answered him, “Rabbi, you are the Son of God; you are the King of Israel.”
translation:
  language: vi
  text: 'Na-tha-na-ên đáp lời Ngài: “Ra-bi, Ngài là Con Đức Chúa Trời; Ngài là Vua của Y-sơ-ra-ên.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: đáp lời
  rationale: Cách diễn đạt tự nhiên, trang trọng trong văn kể chuyện tiếng Việt, thể hiện hành động trả lời trong đối thoại.
- source_word: Ῥαββί
  choice: Ra-bi
  rationale: Giữ danh xưng Do Thái bằng lối phiên âm quen thuộc, bảo tồn bối cảnh văn hóa thế kỷ thứ nhất thay vì giải nghĩa thành “Thầy”.
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: Con Đức Chúa Trời
  rationale: Giữ nguyên tước hiệu xác định và sức nặng Kitô học của lời tuyên xưng, không làm yếu thành một người con bất định hay diễn giải thêm.
- source_word: βασιλεὺς
  choice: Vua
  rationale: Tương đương trực tiếp với danh từ Hy Lạp và phù hợp với tước hiệu vương quyền trong ngữ cảnh.
- source_word: τοῦ Ἰσραήλ
  choice: của Y-sơ-ra-ên
  rationale: Phản ánh trực tiếp cấu trúc sở hữu cách và giữ hình thức tước hiệu, không diễn giải thành “cai trị Y-sơ-ra-ên”.
- source_word: σὺ εἶ … σὺ … εἶ
  choice: Ngài là … Ngài là
  rationale: Lặp lại đại từ và động từ để bảo tồn tính nhấn mạnh cùng cấu trúc song song của lời tuyên xưng trong nguyên văn.
- source_word: Ναθαναήλ
  choice: Na-tha-na-ên
  rationale: Phiên âm tên riêng theo dạng quen dùng trong truyền thống Kinh Thánh tiếng Việt.
theological_decisions:
- issue: Sức nặng Kitô học của lời tuyên xưng ὁ υἱὸς τοῦ θεοῦ
  choice: Giữ tước hiệu “Con Đức Chúa Trời” đúng như nguyên văn.
  alternative: “một người con của Đức Chúa Trời” hoặc cách diễn đạt làm giảm tính tước hiệu
  rationale: Cấu trúc xác định trong tiếng Hy Lạp và văn mạch Phúc Âm Giăng đòi hỏi bảo tồn lời tuyên xưng mà không làm suy yếu hoặc đưa thêm công thức tín điều về sau.
- issue: Ý nghĩa vương quyền–Mê-si của βασιλεὺς τοῦ Ἰσραήλ
  choice: Dịch là “Vua của Y-sơ-ra-ên”.
  alternative: “vua cai trị Y-sơ-ra-ên” hoặc “vua Y-sơ-ra-ên”
  rationale: Cách dịch giữ tước hiệu vương quyền và quan hệ sở hữu cách của nguyên văn, đồng thời không diễn giải quá mức bản chất của vương quyền.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” khi Na-tha-na-ên trực tiếp thưa với Đức Giê-su để diễn đạt sự kính trọng; giữ hai vế song song và dấu chấm phẩy của lời tuyên xưng.
