  text: He was in the beginning with God[a].
translation:
  language: vi
  text: Ban đầu, Ngài ở cùng Đức Chúa Trời[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “Ban đầu, Người ấy ở cùng Đức Chúa Trời.”'
    reason: Phương án từ vựng sát hình thức hơn đối với οὗτος.
lexical_decisions:
- source_word: οὗτος
  choice: Ngài
  rationale: Đại từ chỉ định này quy chiếu trở lại Ngôi Lời trong câu 1. “Ngài” là cách diễn đạt tự nhiên, trang trọng trong tiếng Việt và giữ được quy chiếu mang tính ngôi vị; phương án sát hình thức hơn là “Đấng ấy” được ghi ở chú thích.
- source_word: ἦν
  choice: ở
  rationale: Thể chưa hoàn thành của εἰμί diễn tả trạng thái đang hiện hữu trong thời điểm được nói đến. Trong kết cấu “ở cùng”, tiếng Việt tự nhiên không cần thêm “đã”; cách dịch này cũng tránh làm câu nặng nề.
- source_word: ἐν ἀρχῇ
  choice: Ban đầu
  rationale: Giữ cách diễn đạt quen thuộc và tiếng vọng rõ ràng đến Sáng Thế Ký 1:1. Đưa cụm từ lên đầu câu vừa theo trật tự Hy Lạp vừa tự nhiên trong tiếng Việt.
- source_word: πρὸς
  choice: ở cùng
  rationale: Trong ngữ cảnh này, πρός với đối cách diễn tả sự hiện diện và mối tương quan, đồng thời phân biệt Ngôi Lời với Đức Chúa Trời. “Ở cùng” truyền đạt tự nhiên các sắc thái ấy mà không diễn giải quá mức.
- source_word: τὸν θεόν
  choice: Đức Chúa Trời
  rationale: Đây là cách gọi trang trọng, thông dụng trong tiếng Việt dành cho θεός trong ngữ cảnh độc thần; mạo từ Hy Lạp không cần được dịch riêng.
theological_decisions:
- issue: Đối tượng mà οὗτος quy chiếu trong mối liên hệ với Giăng 1:1
  choice: Dịch bằng đại từ mang tính ngôi vị “Ngài”, quy chiếu trở lại Ngôi Lời.
  alternative: “Đấng ấy”
  rationale: Câu này nhắc lại và củng cố điều câu 1 nói về Ngôi Lời. “Ngài” giữ quy chiếu mang tính ngôi vị mà không thêm danh xưng hay khẳng định giáo lý nào ngoài văn bản.
- issue: Sắc thái của πρὸς τὸν θεόν
  choice: “ở cùng Đức Chúa Trời”
  alternative: “hướng về Đức Chúa Trời”; “ở trước mặt Đức Chúa Trời”
  rationale: Cụm từ diễn tả mối tương quan và sự phân biệt giữa Ngôi Lời với Đức Chúa Trời. “Ở cùng Đức Chúa Trời” giữ được sức căng thần học ấy mà không xác định thêm các phạm trù siêu hình.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dấu phẩy sau “Ban đầu” làm rõ trạng ngữ mà không phá tiếng vọng đến Sáng Thế Ký 1:1. “Ngài” tự nhiên hơn “Đấng ấy” trong chính văn, còn phương án sát hình thức được bảo lưu trong chú thích.
