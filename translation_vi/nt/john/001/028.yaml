  text: ταῦτα ἐν Βηθανίᾳ ἐγένετο πέραν τοῦ Ἰορδάνου, ὅπου ἦν ⸀ὁ Ἰωάννης βαπτίζων.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/028.yaml
  text: These things took place in Bethany beyond the Jordan[a], where John was baptizing.
translation:
  language: vi
  text: Những việc này xảy ra tại Bê-tha-ni, bên kia sông Giô-đanh,[a] là nơi Giăng đang làm phép báp-têm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Một số thủ bản và các truyền thống dịch thuật về sau chép “Bết-ba-ra” thay cho “Bê-tha-ni.”
    reason: textual_variant
lexical_decisions:
- source_word: ταῦτα
  choice: Những việc này
  rationale: Giữ số nhiều của đại từ chỉ định Hy Lạp và quy chiếu về cuộc trao đổi cùng các sự việc vừa được thuật lại.
- source_word: ἐν Βηθανίᾳ
  choice: tại Bê-tha-ni
  rationale: Diễn đạt tự nhiên nghĩa định vị của ἐν với địa danh trong tiếng Việt hiện đại.
- source_word: ἐγένετο
  choice: xảy ra
  rationale: Trong ngữ cảnh tường thuật, động từ chỉ việc các sự kiện đã diễn ra; cách dịch này trực tiếp và tự nhiên.
- source_word: πέραν τοῦ Ἰορδάνου
  choice: bên kia sông Giô-đanh
  rationale: Thể hiện vị trí ở phía bên kia sông theo góc nhìn của lời kể; thêm “sông” để địa danh rõ ràng, tự nhiên trong tiếng Việt.
- source_word: ὅπου
  choice: là nơi
  rationale: Nối mệnh đề chỉ địa điểm một cách rõ ràng và tự nhiên, đồng thời quy chiếu về Bê-tha-ni.
- source_word: ἦν ὁ Ἰωάννης βαπτίζων
  choice: Giăng đang làm phép báp-têm
  rationale: Kết cấu ἦν với phân từ hiện tại diễn tả hoạt động đang tiếp diễn; “làm phép báp-têm” là cách nói quen thuộc, trang trọng trong tiếng Việt.
theological_decisions:
- issue: Dị bản địa danh Βηθανίᾳ (“Bê-tha-ni”) so với Βηθαβαρᾷ (“Bết-ba-ra”)
  choice: Bê-tha-ni
  alternative: Bết-ba-ra
  rationale: Bản SBLGNT được cung cấp đọc Βηθανίᾳ, nên bản văn chính theo dị bản này. Dị bản được biết đến trong một số thủ bản và truyền thống dịch thuật về sau được ghi ở chú thích, không thay thế bản văn chính.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng dạng tên quen thuộc “Bê-tha-ni,” “Giô-đanh,” và “Giăng”; giữ số nhiều của ταῦτα và sắc thái tiếp diễn của kết cấu ἦν…βαπτίζων.
