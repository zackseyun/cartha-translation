  source_fidelity: 'Bản dịch phản ánh chính xác các thành tố của SBLGNT: ταῦτα ở số nhiều (“Những việc này”), ἐγένετο (“xảy ra”), địa điểm Βηθανίᾳ πέραν τοῦ Ἰορδάνου (“tại Bê-tha-ni, bên kia sông Giô-đanh”), và sắc thái tiếp diễn của ἦν ... βαπτίζων (“Giăng đang làm phép báp-têm”).'
