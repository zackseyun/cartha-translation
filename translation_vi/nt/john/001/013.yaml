source:
  edition: SBLGNT
  text: οἳ οὐκ ἐξ αἱμάτων οὐδὲ ἐκ θελήματος σαρκὸς οὐδὲ ἐκ θελήματος ἀνδρὸς ἀλλ’ ἐκ θεοῦ ἐγεννήθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/013.yaml
  text: who were born, not from bloods, nor from the will of the flesh, nor from the will of a man, but from God.
translation:
  language: vi
  text: là những người được sinh ra không phải do huyết thống[a], cũng không do ý muốn của xác thịt, cũng không do ý muốn của người nam, nhưng do Đức Chúa Trời.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tiếng Hy Lạp dùng danh từ số nhiều khác thường, theo nghĩa đen là “các máu”; cách nói này chỉ huyết thống, dòng dõi tự nhiên, hoặc nguồn gốc từ cha mẹ.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἳ
  choice: là những người
  rationale: Đại từ quan hệ số nhiều nối câu này với những người được nói đến ở câu trước; cách diễn đạt này giữ mối liên kết cú pháp và tự nhiên trong tiếng Việt.
- source_word: ἐξ αἱμάτων
  choice: bởi các dòng máu
  rationale: Giữ nét khác thường của danh từ số nhiều αἱμάτων, đồng thời gợi đến nguồn gốc tự nhiên và huyết thống; chú thích cung cấp cách nói thuần Việt hơn.
- source_word: θελήματος
  choice: ý muốn
  rationale: Diễn đạt đúng ý chí hay ước muốn và giữ được cấu trúc lặp lại của hai vế.
- source_word: σαρκὸς
  choice: xác thịt
  rationale: Giữ thuật ngữ cụ thể của nguyên văn; trong ngữ cảnh này, từ ngữ chỉ phương diện sinh sản tự nhiên của con người, không tự động mang nghĩa 'bản tính tội lỗi'.
- source_word: ἀνδρὸς
  choice: người nam
  rationale: Thể hiện rõ danh từ chỉ người đàn ông trong số ít và vai trò tác nhân nam giới trong việc sinh con, không làm nó thành một từ trung tính hơn nguyên văn.
- source_word: ἐκ θεοῦ
  choice: bởi Đức Chúa Trời
  rationale: Diễn đạt nguồn gốc hay tác nhân tương phản với ba nguồn gốc thuộc về con người ở trước.
- source_word: ἐγεννήθησαν
  choice: được sinh ra
  rationale: Thể hiện thể bị động của động từ γεννάω bằng tiếng Việt hiện đại, tự nhiên, không dùng từ cổ nghĩa là 'được sinh thành' hay chỉ nhấn mạnh hành động của người cha.
theological_decisions:
- issue: Sự tương phản giữa nguồn gốc tự nhiên của con người và nguồn gốc từ Đức Chúa Trời
  choice: Giữ nguyên ba lần phủ định về huyết thống và ý muốn sinh sản của con người, rồi đối lập với việc được sinh ra bởi Đức Chúa Trời.
  alternative: Có thể hiểu hẹp hơn là chỉ phủ nhận ưu thế của dòng dõi dân tộc, hoặc diễn giải theo các hệ thống thần học bí tích hay siêu hình về sau.
  rationale: Cấu trúc ba lần phủ định trong tiếng Hy Lạp chủ yếu tương phản sự sinh ra tự nhiên với sự sinh ra có nguồn từ Đức Chúa Trời. Bản dịch không xác định thêm cơ chế thần học mà câu này không nói rõ.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại. Giữ cụm “xác thịt” vì có ý nghĩa từ vựng và thần học quan trọng; dùng “người nam” để chuyển tải ἀνήρ rõ ràng. Dấu chú thích [a] được đặt ngay sau cụm từ liên quan.
