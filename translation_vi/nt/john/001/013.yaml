review_pass:
  verdict: revise
  source_fidelity: Bản nháp giữ đúng cấu trúc phủ định ba vế và sự đối lập với nguồn gốc từ Đức Chúa Trời. Tuy nhiên, “các dòng máu” không phải cách diễn đạt tự nhiên trong tiếng Việt và dễ gợi nghĩa các mạch/dòng máu theo nghĩa vật lý hơn là huyết thống hay nguồn gốc cha mẹ. Không cần ép số nhiều Hy Lạp vào danh từ Việt; có thể nêu đặc điểm này trong chú thích.
  naturalness: “Không phải do huyết thống” là cách nói hiện đại, tự nhiên, và truyền đạt đúng nghĩa thành ngữ của ἐξ αἱμάτων. Cấu trúc “không phải do ... cũng không do ... nhưng do ...” rõ ràng và vẫn trang trọng. “Xác thịt” và “người nam” phù hợp với văn cảnh và đăng ký văn phong Kinh Thánh hiện đại.
  terminology: Giữ “xác thịt” cho σάρξ, không thêm hàm ý về bản tính tội lỗi. Giữ “người nam” cho ἀνήρ để không làm mờ tác nhân nam giới được nêu trong nguyên ngữ. “Đức Chúa Trời” nhất quán cho θεός. Chú thích cần giải thích số nhiều khác thường của αἱμάτων, trong khi bản văn dùng “huyết thống” theo lối thành ngữ tiếng Việt.
  issues:
  - severity: medium
    issue: “các dòng máu” là cách dịch không tự nhiên và có thể gây hiểu sai.
    rationale: αἱμάτων là số nhiều khác thường, chỉ nguồn gốc tự nhiên/cha mẹ hoặc dòng dõi. Trong tiếng Việt, “các dòng máu” không diễn đạt tự nhiên ý này. “Huyết thống” chuyển tải đúng nghĩa thành ngữ; chú thích có thể bảo tồn thông tin về số nhiều của tiếng Hy Lạp.
  - severity: low
    issue: Cụm giới từ “bởi” lặp lại không tự nhiên bằng cấu trúc “do” trong tiếng Việt hiện đại.
    rationale: “Không phải do ... nhưng do ...” vừa rõ nghĩa nguồn gốc/tác nhân trong ngữ cảnh sinh ra, vừa duy trì đầy đủ phép đối lập của nguyên văn.
