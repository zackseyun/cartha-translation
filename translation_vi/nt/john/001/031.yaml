base_translation:
  language: en
  yaml_path: translation/nt/john/001/031.yaml
  text: 'And I did not know him[a], but for this reason I came baptizing in water: that he might be revealed to Israel.'
translation:
  language: vi
  text: Tôi vốn không biết Ngài[a], nhưng sở dĩ tôi đến làm phép báp-têm trong nước là để Ngài được bày tỏ cho Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “không nhận ra Ngài.” Từ Hy Lạp có thể chỉ việc không quen biết hoặc không nhận ra; bản văn chính giữ cách nói rộng hơn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀγὼ
  choice: Chính tôi cũng
  rationale: Diễn đạt καί + ἐγώ, giữ sự nối tiếp với lời chứng trước đó cùng sắc thái nhấn nhẹ vào người nói.
- source_word: οὐκ ᾔδειν αὐτόν
  choice: không biết Ngài
  rationale: Giữ nghĩa rộng của trạng thái không biết trong quá khứ, không tự ý thu hẹp thành không nhận ra hoặc không biết căn tính Mê-si-a của Ngài.
- source_word: ἀλλ’ ἵνα φανερωθῇ τῷ Ἰσραὴλ
  choice: nhưng để Ngài được bày tỏ cho Israel
  rationale: Giữ quan hệ tương phản, mục đích do ἵνα biểu thị, thể bị động của φανερόω và đối tượng tập thể Israel.
- source_word: διὰ τοῦτο ἦλθον ἐγὼ
  choice: tôi đã đến
  rationale: Trong tiếng Việt, mục đích đứng trước đã diễn đạt tự nhiên lực quy chiếu về phía trước của διὰ τοῦτο; đại từ tôi giữ sự nhấn mạnh của ἐγώ mà không tạo câu nặng nề.
- source_word: ἐν ὕδατι βαπτίζων
  choice: làm phép báp-têm trong nước
  rationale: Dùng thuật ngữ tôn giáo quen thuộc nhưng không xác định thêm phương thức; “trong nước” giữ sát ἐν ὕδατι và cách diễn đạt của Giăng.
theological_decisions:
- issue: Ý nghĩa lời Giăng nói ông không biết Chúa Giê-su
  choice: không biết Ngài
  alternative: không nhận ra Ngài; không biết Ngài là Đấng Mê-si-a
  rationale: Bản văn không nói rõ đây là chưa quen biết cá nhân hay chưa nhận biết căn tính và sứ mạng của Ngài; bản dịch giữ nguyên độ rộng và sự căng thẳng của câu.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. “Ngài” phù hợp văn phong Kinh Thánh và quy chiếu rõ đến Chúa Giê-su; “Israel” giữ nguyên tên gọi tập thể của bản nguồn. Trật tự mệnh đề được điều chỉnh tự nhiên cho tiếng Việt trong khi vẫn bảo toàn quan hệ tương phản và mục đích.
