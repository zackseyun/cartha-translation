id: JHN.1.33
reference: John 1:33
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: κἀγὼ οὐκ ᾔδειν αὐτόν, ἀλλ’ ὁ πέμψας με βαπτίζειν ἐν ὕδατι ἐκεῖνός μοι εἶπεν· Ἐφ’ ὃν ἂν ἴδῃς τὸ πνεῦμα καταβαῖνον καὶ μένον ἐπ’ αὐτόν, οὗτός ἐστιν ὁ βαπτίζων ἐν πνεύματι ἁγίῳ·
base_translation:
  language: en
  yaml_path: translation/nt/john/001/033.yaml
  text: And I did not know him[a], but the one who sent me to baptize in water said to me, ‘The one on whom you see the Spirit descending and remaining on him[c][b], this is he who baptizes in the Holy Spirit.’
translation:
  language: vi
  text: 'Chính tôi cũng không biết Ngài[a], nhưng Đấng đã sai tôi làm phép báp-têm trong nước phán với tôi: “Người nào con thấy Thánh Linh ngự xuống và ở lại[b] trên người ấy thì chính người ấy là Đấng làm phép báp-têm trong Thánh Linh.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “không nhận ra Ngài.” Từ Hy Lạp có thể chỉ việc không biết hoặc không nhận ra trong ngữ cảnh này.'
    reason: lexical_alternative
  - marker: b
    text: “Ở lại” dịch một động từ quan trọng trong sách Giăng, cũng thường được dịch là “lưu lại” hoặc “ở trong.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀγὼ οὐκ ᾔδειν αὐτόν
  choice: Chính tôi cũng không biết Ngài
  rationale: κἀγώ (καί + ἐγώ) có sắc thái nối tiếp và nhấn mạnh chủ thể; “chính tôi cũng” diễn đạt tự nhiên. οὐκ ᾔδειν có thể chỉ không biết hoặc không nhận ra; bản chính giữ nghĩa trực tiếp “không biết”.
- source_word: ὁ πέμψας με
  choice: Đấng đã sai tôi
  rationale: Danh hóa phân từ aorist chỉ một nhân vật xác định. “Đấng” phù hợp văn phong Kinh Thánh trang trọng khi nói về Đức Chúa Trời mà không thêm tên vào câu.
- source_word: βαπτίζειν ἐν ὕδατι
  choice: làm phép báp-têm trong nước
  rationale: Giữ giới từ ἐν là “trong” và duy trì phép song song với ἐν πνεύματι ἁγίῳ ở cuối câu.
- source_word: Ἐφ’ ὃν ἂν ἴδῃς
  choice: Người nào mà con thấy ... trên người ấy
  rationale: Cấu trúc tương liên này diễn tả dấu hiệu nhận diện. “Người nào ... người ấy” tự nhiên trong tiếng Việt và giữ tính chưa xác định trong lời được trích.
- source_word: τὸ πνεῦμα καταβαῖνον καὶ μένον ἐπ’ αὐτόν
  choice: Thánh Linh ngự xuống và ở lại trên người ấy
  rationale: Ngữ cảnh xác định πνεῦμα là Thánh Linh. “Ngự xuống” thích hợp với chủ thể thần linh; “ở lại” giữ ý nghĩa trọng yếu của μένω trong sách Giăng mà vẫn dễ hiểu.
- source_word: οὗτός ἐστιν ὁ βαπτίζων ἐν πνεύματι ἁγίῳ
  choice: thì chính người ấy là Đấng làm phép báp-têm trong Thánh Linh
  rationale: “Chính người ấy” bảo toàn lực xác định của οὗτός ἐστιν; “trong Thánh Linh” giữ ἐν và sự song song với “trong nước”.
theological_decisions:
- issue: Nghĩa của οὐκ ᾔδειν
  choice: không biết
  alternative: không nhận ra
  rationale: Động từ có thể nói đến việc không biết hoặc không nhận ra căn tính. Bản chính chọn nghĩa trực tiếp hơn, còn chú thích giữ khả năng theo ngữ cảnh.
- issue: Cách dịch ἐν trong hai cụm nói về phép báp-têm
  choice: trong nước ... trong Thánh Linh
  alternative: bằng nước ... bằng Thánh Linh
  rationale: Dùng “trong” ở cả hai nơi bảo toàn cùng một giới từ Hy Lạp và sự song song có chủ ý, không quyết định dứt khoát ἐν là môi trường hay phương tiện.
- issue: Nhận diện πνεῦμα
  choice: Thánh Linh
  alternative: thần linh
  rationale: Vế cuối nói rõ πνεύματι ἁγίῳ, qua đó xác định Đấng ngự xuống là Thánh Linh; cách viết hoa phản ánh quy chiếu của ngữ cảnh.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Ngài/Đấng” cho các quy chiếu thần linh, “con” trong lời Đức Chúa Trời nói với Giăng, và giữ thuật ngữ quen thuộc “làm phép báp-têm.”
