  source_fidelity: 'Bản dịch truyền đạt đúng các thành phần chính của câu: Giăng trước đó không biết/không nhận ra Đức Chúa Jêsus; Đấng sai ông làm phép báp-têm trong nước đã ban dấu hiệu Thánh Linh ngự xuống và ở lại; và người ấy là Đấng làm phép báp-têm trong Thánh Linh. “Chính tôi cũng” phản ánh được κἀγώ, còn “trong” giữ phép song song của ἐν. Cách xưng “con” trong lời trực tiếp là cách Việt hóa tự nhiên khi Đức Chúa Trời nói với Giăng, dù đại từ ngôi hai Hy Lạp tự nó không nêu quan hệ này.'
