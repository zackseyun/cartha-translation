  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: θεὸν οὐδεὶς ἑώρακεν πώποτε· ⸂μονογενὴς θεὸς⸃ ὁ ὢν εἰς τὸν κόλπον τοῦ πατρὸς ἐκεῖνος ἐξηγήσατο.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/018.yaml
  text: No one has ever seen God[a]; the one and only God, who is in the bosom of the Father[c][b], has made him known.
translation:
  language: vi
  text: Chưa từng có ai thấy Đức Chúa Trời; Đức Chúa Trời duy nhất[a], Đấng ở trong lòng Cha[b], đã bày tỏ Đức Chúa Trời[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Một số thủ bản chép “Con duy nhất” (hoặc “Con độc sinh”) thay cho “Đức Chúa Trời duy nhất”.
    reason: textual_variant
  - marker: b
    text: 'Cũng có thể dịch: “ở bên Cha”. Nguyên văn Hy Lạp là “ở trong lòng Cha”, diễn tả sự gần gũi thân mật.'
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “đã giải bày về Ngài” hoặc “đã làm cho người ta biết Ngài”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: θεὸν
  choice: Đức Chúa Trời
  rationale: Tân ngữ trực tiếp của ἑώρακεν; cách gọi trang trọng, quen thuộc trong tiếng Việt khi θεός chỉ Đức Chúa Trời.
- source_word: οὐδεὶς … πώποτε
  choice: chưa từng có ai
  rationale: Diễn đạt tự nhiên sự phủ định phổ quát kết hợp với ý ‘bao giờ/từng’ của πώποτε.
- source_word: ἑώρακεν
  choice: thấy
  rationale: Trong cấu trúc ‘chưa từng có ai’, tiếng Việt không cần đánh dấu riêng thì hoàn thành nhưng vẫn truyền đạt kinh nghiệm kéo dài đến hiện tại.
- source_word: μονογενὴς θεὸς
  choice: Đức Chúa Trời duy nhất
  rationale: Theo bản văn SBLGNT có θεός; ‘duy nhất’ chuyển tải nghĩa độc nhất, có một không hai của μονογενής mà không mặc nhiên đưa ý ‘được sinh ra’ vào nghĩa từ vựng.
- source_word: ὁ ὢν
  choice: Đấng ở
  rationale: Mệnh đề quan hệ tôn kính, tự nhiên trong tiếng Việt, bổ nghĩa cho ‘Đức Chúa Trời duy nhất’.
- source_word: εἰς τὸν κόλπον τοῦ πατρὸς
  choice: ở trong lòng Cha
  rationale: Giữ hình ảnh κόλπος về vị trí thân mật, gần gũi; ‘trong lòng Cha’ tự nhiên hơn ‘trong ngực Cha’ trong tiếng Việt và không làm mất ẩn dụ.
- source_word: πατρὸς
  choice: Cha
  rationale: Danh xưng quan hệ xác định trong văn mạch Giăng; tiếng Việt không cần mạo từ tương ứng.
- source_word: ἐκεῖνος
  choice: Đấng ấy (hàm ẩn trong chủ ngữ)
  rationale: Tiếng Việt tự nhiên không cần lặp đại từ sau mệnh đề quan hệ; tính nhấn mạnh được giữ qua chủ ngữ đầy đủ ‘Đức Chúa Trời duy nhất, Đấng…’.
- source_word: ἐξηγήσατο
  choice: đã bày tỏ Ngài
  rationale: Truyền đạt hành động giải bày, làm cho biết về Đức Chúa Trời; ‘bày tỏ’ giữ sắc thái mặc khải và đủ rộng để không thu hẹp thành lời giải thích.
theological_decisions:
- issue: Dị bản μονογενὴς θεὸς so với ὁ μονογενὴς υἱός
  choice: 'Bản văn chính dịch theo SBLGNT: ‘Đức Chúa Trời duy nhất’.'
  alternative: ‘Con duy nhất’ hoặc ‘Con độc sinh’.
  rationale: Theo đúng bản văn nguồn đã chỉ định, đồng thời ghi chú dị bản quan trọng để không che khuất vấn đề văn bản và sức căng Kitô học.
- issue: Nghĩa của μονογενής
  choice: ‘duy nhất’
  alternative: ‘độc sinh’ hoặc ‘có một không hai’
  rationale: ‘Duy nhất’ diễn đạt tính độc nhất theo chứng cứ từ vựng hiện nay; ‘độc sinh’ có giá trị truyền thống nhưng có thể khiến độc giả tưởng ý ‘sinh ra’ nằm trực tiếp trong nghĩa thông thường của từ.
- issue: Đối tượng của ἐξηγήσατο
  choice: 'Thêm ‘Ngài’ làm tân ngữ được hàm ý: ‘đã bày tỏ Ngài’.'
  alternative: ‘đã giải bày’ không có tân ngữ, hoặc ‘đã làm cho người ta biết Đức Chúa Trời’.
  rationale: Tiếng Hy Lạp không nêu tân ngữ nhưng văn mạch chỉ về θεόν ở đầu câu; tiếng Việt cần làm rõ hơn để câu trọn nghĩa, trong khi đại từ vẫn giữ liên hệ văn mạch.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Giữ hình ảnh ‘trong lòng Cha’, dùng ‘Đấng’ cho mệnh đề quan hệ tôn kính, và tránh lặp đại từ chủ ngữ không tự nhiên. Các dấu chú thích [a], [b], [c] đều xuất hiện trong bản văn chính; [a] đặt sau toàn mệnh đề chứa cách đọc đang được chú giải.
