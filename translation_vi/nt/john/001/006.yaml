id: JHN.1.6
reference: John 1:6
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἐγένετο ἄνθρωπος ἀπεσταλμένος παρὰ θεοῦ, ὄνομα αὐτῷ Ἰωάννης·
base_translation:
  language: en
  yaml_path: translation/nt/john/001/006.yaml
  text: There was a man sent from God[a], whose name was John.
translation:
  language: vi
  text: Có một người được Đức Chúa Trời sai đến, tên là Giăng.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “người ấy tên là Giăng.”'
    reason: Nêu một cách diễn đạt đầy đủ hơn cho thành ngữ ὄνομα αὐτῷ Ἰωάννης; ý nghĩa căn bản không thay đổi.
lexical_decisions:
- source_word: Ἐγένετο
  choice: Có
  rationale: Trong câu này, động từ giới thiệu một nhân vật mới vào trình thuật. “Có” diễn đạt tự nhiên ý hiện hữu/xuất hiện trong tiếng Việt mà không hàm ý người ấy được tạo dựng ngay lúc đó.
- source_word: ἄνθρωπος
  choice: một người
  rationale: Từ này chỉ một cá nhân, ở đây là Giăng. “Một người” tự nhiên và không cần thêm từ chỉ giới tính vì danh tính được nêu ngay sau đó.
- source_word: ἀπεσταλμένος
  choice: được … sai đến
  rationale: Phân từ hoàn thành bị động mô tả Giăng là người đã được sai phái. “Được sai đến” giữ thể bị động và phù hợp với văn cảnh về sứ mạng của ông.
- source_word: παρὰ θεοῦ
  choice: được Đức Chúa Trời sai đến
  rationale: παρά với sở hữu cách nhấn mạnh nguồn xuất phát. Cấu trúc tiếng Việt này tự nhiên, đồng thời cho thấy Đức Chúa Trời là nguồn của việc sai phái mà không thêm nội dung thần học ngoài câu văn.
- source_word: ὄνομα αὐτῷ Ἰωάννης
  choice: tên là Giăng
  rationale: Đây là cách diễn đạt tự nhiên, gọn rõ trong tiếng Việt cho thành ngữ Hy Lạp có nghĩa sát là “tên của người ấy là Giăng.”
- source_word: Ἰωάννης
  choice: Giăng
  rationale: Dùng dạng tên riêng đã quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
theological_decisions:
- issue: Bản chất sứ mạng của Giăng
  choice: Giăng được trình bày là người do Đức Chúa Trời sai đến.
  alternative: Giăng chỉ có mối liên hệ với Đức Chúa Trời; hoặc nhấn mạnh riêng hành động của Đức Chúa Trời hơn là nguồn sai phái.
  rationale: ἀπεσταλμένος kết hợp với παρὰ θεοῦ cho thấy một sự sai phái có nguồn từ Đức Chúa Trời. Bản dịch giữ ý này nhưng không thêm một chức danh hay học thuyết nào mà câu không nói rõ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu ngắn giữ nhịp kể chuyện của nguyên văn; “sai đến” tự nhiên hơn “sai phái” trong chính câu, còn “Giăng” là dạng tên quen thuộc với nhiều độc giả Kinh Thánh tiếng Việt.
