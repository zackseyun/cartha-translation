  text: And looking at Jesus as he was walking, he says, “Look, the Lamb of God!”
translation:
  language: vi
  text: 'Ông chăm chú nhìn Đức Giê-su đang đi và nói: “Kìa, Chiên Con của Đức Chúa Trời!”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμβλέψας
  choice: nhìn chăm vào
  rationale: Diễn đạt cái nhìn có chủ ý, chăm chú, mạnh hơn động từ chung chung “nhìn”.
- source_word: περιπατοῦντι
  choice: đang đi
  rationale: Phân từ hiện tại mô tả Đức Giê-su trong lúc đang đi; cách dịch này tự nhiên và không thêm ý.
- source_word: λέγει
  choice: nói
  rationale: Giữ hiện tại lịch sử của tiếng Hy Lạp ở dạng hiện tại trong tiếng Việt, tạo tính trực tiếp cho lời kể.
- source_word: Ἴδε
  choice: Kìa
  rationale: Lời chỉ dẫn thu hút sự chú ý đến một người đang hiện diện; “Kìa” trang trọng vừa phải và tự nhiên hơn “Hãy xem” trong ngữ cảnh này.
- source_word: ὁ ἀμνὸς τοῦ θεοῦ
  choice: Chiên Con của Đức Chúa Trời
  rationale: Giữ hình ảnh ẩn dụ và kết cấu sở hữu của nguyên văn; viết hoa “Chiên Con” vì đây là tước hiệu chỉ Đức Giê-su trong ngữ cảnh.
theological_decisions:
- issue: Quan hệ được biểu thị bởi τοῦ θεοῦ trong cụm “Chiên Con của Đức Chúa Trời”
  choice: Giữ cách diễn đạt rộng “của Đức Chúa Trời”
  alternative: Diễn giải là “Chiên Con do Đức Chúa Trời ban” hoặc “Chiên Con thuộc về Đức Chúa Trời”
  rationale: Sở hữu cách Hy Lạp có thể hàm chứa nhiều sắc thái; bản dịch không thu hẹp thành một cách giải thích thần học riêng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Giê-su” và “Đức Chúa Trời” theo lối gọi phổ biến trong Kinh Thánh tiếng Việt; không cần chú thích.
