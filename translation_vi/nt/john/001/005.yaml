source:
  edition: SBLGNT
  text: καὶ τὸ φῶς ἐν τῇ σκοτίᾳ φαίνει, καὶ ἡ σκοτία αὐτὸ οὐ κατέλαβεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/005.yaml
  text: And the light shines in the darkness[a], and the darkness has not overcome it.
translation:
  language: vi
  text: Ánh sáng chiếu trong bóng tối, và bóng tối không thắng được ánh sáng.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “bóng tối không hiểu được ánh sáng” hoặc “không nắm bắt được ánh sáng.” Động từ Hy Lạp có thể mang nghĩa thắng/chế ngự hoặc nắm bắt/hiểu.'
    reason: alternative_reading
lexical_decisions:
- source_word: φῶς
  choice: ánh sáng
  rationale: Danh từ có mạo từ và mang tính chủ đề trong phần mở đầu; tiếng Việt không có mạo từ nên dùng tự nhiên là “ánh sáng”, đồng thời lặp lại danh từ ở cuối câu để tránh đại từ mơ hồ.
- source_word: σκοτίᾳ / σκοτία
  choice: bóng tối
  rationale: Giữ hình ảnh đối lập xuyên suốt giữa ánh sáng và bóng tối; cách nói này tự nhiên, trang trọng trong tiếng Việt hiện đại.
- source_word: φαίνει
  choice: chiếu
  rationale: Thì hiện tại diễn tả hành động đang tiếp diễn hoặc có tính thường xuyên; “chiếu” truyền đạt gọn và tự nhiên mà không diễn giải quá mức sắc thái thể.
- source_word: κατέλαβεν
  choice: không thắng được
  rationale: Động từ có thể mang nghĩa nắm bắt, hiểu, chiếm lấy hoặc chế ngự. Trong hình ảnh xung đột giữa ánh sáng và bóng tối, “không thắng được” phù hợp với nghĩa chế ngự, nhưng nghĩa hiểu/nắm bắt được giữ trong chú thích.
- source_word: αὐτὸ
  choice: ánh sáng
  rationale: Đại từ trung tính quy chiếu về φῶς. Vì đại từ “nó” trong tiếng Việt có thể thiếu trang trọng hoặc mơ hồ, lặp lại “ánh sáng” để làm rõ sở chỉ mà không nhân cách hóa quá mức.
theological_decisions:
- issue: Nghĩa của κατέλαβεν trong sự đối lập giữa ánh sáng và bóng tối
  choice: không thắng được
  alternative: không hiểu được; không nắm bắt được; không chế ngự được
  rationale: Nguyên ngữ cho phép cả nghĩa nhận thức lẫn nghĩa đối kháng. Văn cảnh hình tượng nghiêng về “thắng/chế ngự”, nhưng chú thích giữ lại nghĩa nhận thức để không xóa bỏ tính đa nghĩa và sức căng thần học.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Trật tự hai vế bám sát nguyên ngữ; không thêm liên từ mở đầu “Và” vì trong tiếng Việt ở cấp câu đơn lẻ, cách đó kém tự nhiên. Lặp lại “ánh sáng” thay cho đại từ để bảo đảm rõ nghĩa.
