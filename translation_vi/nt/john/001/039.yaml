  - severity: low
    issue: “Đang ở” có thể gợi nơi ở thường xuyên
    rationale: μένων trong ngữ cảnh chỉ nơi Chúa Giê-su đang lưu lại/trú ngụ. “Đang lưu lại” giữ tính tạm thời hoặc không xác định của nguyên văn tốt hơn.
  - severity: low
    issue: Chú thích thời gian chưa đủ cấu trúc câu
    rationale: Mệnh đề “Nếu tính từ lúc mặt trời mọc thì vào khoảng 4 giờ chiều” thiếu chủ ngữ quy chiếu rõ ràng. Thêm “giờ thứ mười là” làm rõ mà không thay đổi nội dung.
