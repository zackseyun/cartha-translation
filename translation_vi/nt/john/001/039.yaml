revisions:
- from: 'Ngài nói với họ: “Hãy đến, rồi các anh sẽ thấy.” Vậy, họ đến và thấy nơi Ngài đang ở, rồi ở lại với Ngài ngày hôm ấy. Lúc đó khoảng giờ thứ mười.[a]'
  to: 'Ngài nói với họ: “Hãy đến, rồi các anh sẽ thấy.” Vậy, họ đến và thấy nơi Ngài đang lưu lại, rồi ở lại với Ngài ngày hôm ấy. Lúc ấy là khoảng giờ thứ mười.[a]'
  rationale: Chỉnh nhẹ để tiếng Việt đầy đủ và tự nhiên hơn, đồng thời làm rõ sắc thái “đang lưu lại” của μένει. Chính văn vẫn bảo toàn cấu trúc, ý nghĩa và tính mơ hồ có chủ ý của nguyên văn về “giờ thứ mười”; chú thích tiếp tục trình bày các cách tính giờ thay thế mà không quyết định thay bản văn.
