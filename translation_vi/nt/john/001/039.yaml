  text: λέγει αὐτοῖς· Ἔρχεσθε καὶ ⸂ὄψεσθε. ἦλθαν οὖν⸃ καὶ εἶδαν ποῦ μένει, καὶ παρ’ αὐτῷ ἔμειναν τὴν ἡμέραν ἐκείνην· ὥρα ἦν ὡς δεκάτη.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/039.yaml
  text: He said to them[a], “Come, and you will see.” So they went and saw where he was staying, and they stayed with him that day. It was about the tenth hour.
translation:
  language: vi
  text: 'Ngài nói với họ: “Hãy đến, rồi các anh sẽ thấy.” Vậy, họ đến và thấy nơi Ngài đang lưu lại, rồi ở lại với Ngài ngày hôm ấy. Lúc ấy là khoảng giờ thứ mười.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nếu tính từ lúc mặt trời mọc thì giờ thứ mười là khoảng 4 giờ chiều; một số người hiểu theo cách tính giờ La Mã là khoảng 10 giờ sáng.
    reason: Nêu các cách hiểu chính về hệ thống tính giờ mà không áp đặt một cách hiểu vào chính văn.
lexical_decisions:
- source_word: λέγει αὐτοῖς
  choice: Ngài nói với họ
  rationale: Dùng thì quá khứ tự nhiên trong văn kể tiếng Việt cho lối hiện tại lịch sử của tiếng Hy Lạp; “Ngài” giữ giọng trang trọng khi nói về Chúa Giê-su.
- source_word: Ἔρχεσθε καὶ ὄψεσθε
  choice: Hãy đến, rồi các anh sẽ thấy
  rationale: Giữ lời mời trực tiếp và dạng tương lai của ὄψεσθε; “rồi” diễn đạt tự nhiên quan hệ tiếp nối mà không làm thành điều kiện.
- source_word: ἦλθαν οὖν
  choice: Vậy, họ đến
  rationale: οὖν biểu thị hệ quả tự nhiên; ἦλθαν được dịch sát là “đến”, theo điểm quy chiếu của Chúa Giê-su trong lời mời.
- source_word: εἶδαν
  choice: thấy
  rationale: Giữ nghĩa kể chuyện đơn giản và sự lặp từ với “sẽ thấy” ở trước.
- source_word: ποῦ μένει
  choice: nơi Ngài đang ở
  rationale: Trong ngữ cảnh, μένω chỉ nơi Chúa Giê-su lưu lại; “đang ở” tự nhiên hơn “đang lưu trú” và không xác định đó là chỗ ở lâu dài hay tạm thời.
- source_word: παρ’ αὐτῷ ἔμειναν
  choice: ở lại với Ngài
  rationale: Diễn đạt cả sự lưu lại và ở cùng Chúa Giê-su, đồng thời giữ liên hệ từ vựng của μένω với cụm “đang ở” trước đó.
- source_word: τὴν ἡμέραν ἐκείνην
  choice: ngày hôm ấy
  rationale: Dịch đúng phạm vi được nói rõ, không tự thêm “suốt” hoặc “phần còn lại của” ngày ấy.
- source_word: ὥρα ἦν ὡς δεκάτη
  choice: Lúc đó khoảng giờ thứ mười
  rationale: Giữ nguyên cách ghi giờ của nguyên văn; “khoảng” phản ánh ὡς và không tự quyết định hệ thống tính giờ.
theological_decisions:
- issue: Cách tính “giờ thứ mười”
  choice: Giữ “giờ thứ mười” trong chính văn.
  alternative: Khoảng 4 giờ chiều nếu tính từ lúc mặt trời mọc; một số người hiểu là khoảng 10 giờ sáng theo cách tính giờ La Mã.
  rationale: Nguyên văn không xác định hệ thống tính giờ. Giữ cách nói nguyên thủy tránh giải quyết thay độc giả một vấn đề còn được tranh luận; chú thích nêu các khả năng chính.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” cho Chúa Giê-su và “các anh” cho hai môn đồ; tránh lối diễn đạt cổ. Dấu chú thích [a] được đặt ngay sau cụm thời gian mà chú thích giải thích.
