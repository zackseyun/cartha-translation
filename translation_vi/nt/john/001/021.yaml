  source_fidelity: 'Bản dịch truyền đạt đầy đủ cấu trúc đối thoại và các phủ định ngắn gọn của nguyên văn: câu hỏi tiếp nối «Τί οὖν;», câu hỏi về Ê-li, lời phủ nhận «Οὐκ εἰμί», danh xưng xác định «Ὁ προφήτης», và câu trả lời «Οὔ». «Ông nói» phù hợp với thì hiện tại lịch sử λέγει mà không gượng ép tiếng Việt.'
  naturalness: Văn bản tự nhiên, rõ ràng và giữ được nhịp đối thoại ngắn, trực tiếp. «Vậy thì sao?» và cấu trúc «có phải ... không?» là cách dùng hiện đại thích hợp. «Không phải» trong ngữ cảnh là một đáp lời lược tỉnh tự nhiên.
  terminology: «Ê-li» và «Môi-se» theo dạng tên Kinh Thánh tiếng Việt thông dụng. «Vị Tiên Tri» bảo toàn tính xác định của Ὁ προφήτης mà không xác quyết căn tính trong chính văn. Chú thích b nêu khả năng liên hệ Phục Truyền Luật Lệ Ký mà vẫn giữ tính dè dặt; chú thích a giải thích đúng thì hiện tại lịch sử.
