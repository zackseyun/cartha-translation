id: JHN.1.21
reference: John 1:21
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἠρώτησαν αὐτόν· Τί οὖν; ⸂σὺ Ἠλίας εἶ⸃; καὶ λέγει· Οὐκ εἰμί. Ὁ προφήτης εἶ σύ; καὶ ἀπεκρίθη· Οὔ.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/021.yaml
  text: And they asked him[a], “What then? Are you Elijah?” And he says, “I am not.” “Are you the Prophet?” And he answered[b], “No.”
translation:
  language: vi
  text: 'Họ hỏi ông: “Vậy thì sao? Ông có phải là Ê-li không?” Ông nói[a]: “Không phải.” “Ông có phải là Vị Tiên Tri[b] không?” Ông đáp: “Không.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tiếng Hy Lạp dùng thì hiện tại lịch sử, theo sát chữ là “ông nói”; đây là lối kể chuyện sống động.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể diễn đạt là “vị Tiên Tri ấy”; có lẽ chỉ vị tiên tri được trông đợi giống như Môi-se (Phục Truyền Luật Lệ Ký 18:15, 18).
    reason: alternative_reading
lexical_decisions:
- source_word: ἠρώτησαν
  choice: hỏi
  rationale: Động từ ở đây dẫn vào lời chất vấn trực tiếp; “hỏi” là cách diễn đạt tự nhiên, không thêm sắc thái gay gắt vốn không được biểu thị rõ trong nguyên văn.
- source_word: Τί οὖν;
  choice: Vậy thì sao?
  rationale: Giữ được tính ngắn gọn, đột ngột và ý nối tiếp suy ra từ những lời phủ nhận trước đó.
- source_word: σὺ Ἠλίας εἶ
  choice: Ông có phải là Ê-li không?
  rationale: Cấu trúc “có phải… không?” là câu hỏi tự nhiên trong tiếng Việt; đại từ nhấn mạnh σὺ được thể hiện qua việc trực tiếp đối chiếu căn tính của người được hỏi. “Ê-li” là dạng tên quen dùng trong tiếng Việt.
- source_word: Οὐκ εἰμί
  choice: Không phải
  rationale: Giữ câu phủ nhận ngắn và dứt khoát, không bổ sung thành phần giải thích không có trong tiếng Hy Lạp.
- source_word: Ὁ προφήτης
  choice: Vị Tiên Tri
  rationale: Mạo từ xác định cho thấy đây là một nhân vật được trông đợi cụ thể, không chỉ là một tiên tri bất kỳ. Cách viết như một danh xưng giúp bảo toàn sắc thái ấy mà không quyết định căn tính của nhân vật trong chính văn.
- source_word: λέγει
  choice: nói
  rationale: Thì hiện tại lịch sử trong lời kể Hy Lạp tạo sắc thái sống động; tiếng Việt không bắt buộc đánh dấu thì, nên “nói” vừa tự nhiên vừa không biến nó thành một dạng quá khứ được đánh dấu rõ.
- source_word: ἀπεκρίθη
  choice: đáp
  rationale: Diễn đạt gọn và tự nhiên hành động trả lời trong mạch đối thoại.
- source_word: Οὔ
  choice: Không
  rationale: Hạt phủ định đứng độc lập là một câu trả lời trực tiếp; “Không” bảo toàn sự ngắn gọn.
theological_decisions:
- issue: Căn tính của “Vị Tiên Tri”
  choice: 'Dịch như một danh xưng xác định: “Vị Tiên Tri”, không giải thích thêm trong chính văn.'
  alternative: Diễn giải là “vị tiên tri giống Môi-se” hoặc hiểu như một tiên tri nói chung.
  rationale: Nguyên văn có mạo từ xác định và dường như nói đến một nhân vật mà người hỏi đã biết hoặc đang mong đợi. Bản dịch giữ nguyên độ mở về căn tính, còn chú thích chỉ nêu liên hệ có khả năng xảy ra.
- issue: Lời Giăng phủ nhận mình là Ê-li
  choice: 'Giữ nguyên lời phủ nhận trực tiếp: “Không phải.”'
  alternative: Thêm ý “không phải Ê-li theo nghĩa đen” hoặc dung hòa rõ ràng với các phân đoạn khác.
  rationale: Câu này trình bày lời phủ nhận thẳng thắn của Giăng. Không nên đưa sự dung hòa thần học từ các phân đoạn khác vào chính văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Các câu trả lời được giữ ngắn, đúng nhịp đối thoại của nguyên văn. Danh xưng “Vị Tiên Tri” được viết hoa để biểu thị một nhân vật xác định đang được trông đợi, nhưng không áp đặt cách nhận diện trong chính văn.
