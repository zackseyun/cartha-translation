  text: οὗτός ἐστιν ⸀ὑπὲρ οὗ ἐγὼ εἶπον· Ὀπίσω μου ἔρχεται ἀνὴρ ὃς ἔμπροσθέν μου γέγονεν, ὅτι πρῶτός μου ἦν·
base_translation:
  language: en
  yaml_path: translation/nt/john/001/030.yaml
  text: This is he of whom I said[a], ‘After me comes a man who ranks before me[b], because he was before me.’
translation:
  language: vi
  text: 'Đây là người mà tôi đã nói đến: “Có một người đến sau tôi nhưng đã vượt lên trước tôi[a], vì người vốn có trước tôi[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đã trở nên cao trọng hơn tôi.” Tiếng Hy Lạp có thể diễn tả sự ưu tiên hoặc địa vị cao hơn, chứ không chỉ thứ tự thời gian.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “đã hiện hữu trước tôi.” Cách nói này hàm ý sự tiền hữu của Chúa Giê-su, dù nguyên văn diễn đạt cô đọng là “vốn có trước tôi.”'
    reason: alternative_reading
lexical_decisions:
- source_word: οὗτός ἐστιν
  choice: Đây là người
  rationale: Giữ sắc thái chỉ định và nhận diện nhấn mạnh, đồng thời tự nhiên trong tiếng Việt hiện đại.
- source_word: ὑπὲρ οὗ ἐγὼ εἶπον
  choice: mà tôi đã nói đến
  rationale: Trong cấu trúc với εἶπον, ὑπὲρ οὗ mang nghĩa “về người mà”; “nói đến” diễn đạt gọn và tự nhiên.
- source_word: Ὀπίσω μου ἔρχεται ἀνὴρ
  choice: Có một người đến sau tôi
  rationale: ὀπίσω μου chỉ trình tự “sau tôi”; ἀνήρ được dịch rõ là “một người”, không trung tính hóa chủ thể nam giới.
- source_word: ἔμπροσθέν μου γέγονεν
  choice: đã vượt lên trước tôi
  rationale: Diễn đạt trạng thái ưu tiên hoặc vị thế cao hơn do thể hoàn thành γέγονεν, nhưng không giới hạn cụm từ vào trình tự thời gian đơn thuần.
- source_word: ὅτι πρῶτός μου ἦν
  choice: vì người vốn có trước tôi
  rationale: “Vốn có trước tôi” giữ lực thời gian và hàm ý tiền hữu, nhưng không diễn giải quá mức thành một phát biểu thần học mở rộng.
theological_decisions:
- issue: Mức độ làm rõ sự tiền hữu của Chúa Giê-su trong πρῶτός μου ἦν
  choice: người vốn có trước tôi
  alternative: người đã hiện hữu trước tôi
  rationale: Bản dịch chính giữ cách nói cô đọng và sự căng thẳng giữa thứ tự thời gian với địa vị ưu tiên; phương án “đã hiện hữu” làm ý tiền hữu rõ hơn nhưng giải nghĩa mạnh hơn nguyên văn.
- issue: Ý nghĩa của ἔμπροσθέν μου γέγονεν
  choice: đã vượt lên trước tôi
  alternative: đã trở nên cao trọng hơn tôi
  rationale: Cách chọn có thể bao hàm sự ưu tiên hoặc địa vị mà không đóng khung câu vào một cách giải thích giáo phái; phương án thay thế nêu rõ hơn khía cạnh phẩm vị.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “người” trong lời trích để tránh lặp nặng nề, đồng thời giữ nguyên hai lớp nghĩa về địa vị ưu tiên và sự có trước trong thời gian.
