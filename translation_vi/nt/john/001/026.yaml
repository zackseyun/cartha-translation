revisions:
- from: 'Giăng trả lời họ: “Tôi làm phép báp-têm trong nước. Giữa các ông có một Đấng đang đứng mà các ông không biết.”'
  to: 'Giăng trả lời họ: “Tôi làm báp-têm bằng nước. Giữa các ông đang có một người mà các ông không biết.”'
  rationale: Bản sửa dùng «bằng nước» cho ἐν ὕδατι, giữ «một người» thay vì danh xưng «Đấng», và diễn đạt thể hoàn thành ἕστηκεν bằng trạng thái hiện tại «đang có». Chú thích ghi nhận trật tự/diễn đạt thay thế gần sát «đứng giữa các ông».
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T05:36:30Z'
review_pass:
  verdict: revise
  source_fidelity: 'Cần sửa hai điểm để phản ánh nguyên văn không thêm sắc thái: ἐν ὕδατι không buộc phải chỉ vị trí/phương thức ngâm «trong nước», và τις/ὃν được diễn đạt là «một Đấng» trong bản dịch đã thêm sắc thái tôn kính/định danh không được nêu trong câu. «Bằng nước» là cách tiếng Việt tự nhiên, vẫn để mở phương thức; «một người» giữ sự chưa xác định của nguyên văn.'
  naturalness: «Giăng trả lời họ» và cách xưng hô «các ông» phù hợp văn phong hiện đại, trang trọng. Cấu trúc «Giữa các ông đang có một người...» tự nhiên hơn việc đặt «một Đấng đang đứng» và tránh gợi một danh hiệu.
  terminology: «làm báp-têm» là thuật ngữ Cơ Đốc quen dùng và không áp đặt một phương thức. Giữ «Giăng» theo hệ tên riêng của bản thảo. Không dùng «Đấng» vì đây là danh xưng tôn kính dễ làm lộ danh tính của người chưa được gọi tên trong câu.
  issues:
  - severity: medium
    issue: «trong nước» có thể gợi riêng phương thức hoặc vị trí ngâm trong nước.
    rationale: ἐν ὕδατι có thể được dịch theo nghĩa công cụ là «bằng nước»; cách này tự nhiên trong tiếng Việt và không thu hẹp hình thức báp-têm.
  - severity: medium
    issue: «một Đấng» thêm sắc thái tôn kính và định danh.
    rationale: Nguyên văn nói về một người chưa được biết đến (ὃν), không dùng một tước hiệu. «Một người» bảo toàn sự mơ hồ và căng thẳng tự sự.
  revised_text: 'Giăng trả lời họ: “Tôi làm báp-têm bằng nước. Giữa các ông đang có một người mà các ông không biết.”'
