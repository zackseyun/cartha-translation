  text: ἀπεκρίθη αὐτοῖς ὁ Ἰωάννης λέγων· Ἐγὼ βαπτίζω ἐν ὕδατι· ⸀μέσος ὑμῶν ⸀ἕστηκεν ὃν ὑμεῖς οὐκ οἴδατε,
base_translation:
  language: en
  yaml_path: translation/nt/john/001/026.yaml
  text: John answered them[a], saying, “I baptize in water. Among you stands one whom you do not know,”
translation:
  language: vi
  text: 'Giăng trả lời họ: “Tôi làm báp-têm bằng nước. Giữa các ông đang có một người mà các ông không biết.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη αὐτοῖς ὁ Ἰωάννης λέγων
  choice: Giăng trả lời họ
  rationale: Diễn đạt tự nhiên trong tiếng Việt hiện đại; λέγων có chức năng dẫn lời nên không cần dịch riêng thành “rằng” sau dấu hai chấm.
- source_word: βαπτίζω
  choice: làm phép báp-têm
  rationale: Dùng thuật ngữ Cơ Đốc quen thuộc, tránh thu hẹp nghĩa thành một phương thức cụ thể mà nguyên văn không đòi hỏi phải xác định tại đây.
- source_word: ἐν ὕδατι
  choice: trong nước
  rationale: Giữ sát giới từ ἐν và hình ảnh của nguyên văn, dù tiếng Việt cũng có thể nói “bằng nước”.
- source_word: μέσος ὑμῶν
  choice: giữa các ông
  rationale: Cách nói tự nhiên, truyền đạt việc người ấy hiện diện ngay trong nhóm người đang được Giăng nói với.
- source_word: ἕστηκεν
  choice: đang đứng
  rationale: Truyền đạt trạng thái hiện tại của thể hoàn thành Hy Lạp một cách tự nhiên trong tiếng Việt.
- source_word: ὃν ὑμεῖς οὐκ οἴδατε
  choice: mà các ông không biết
  rationale: Giữ nghĩa rộng của οἶδα là “biết”, không thu hẹp thành “nhận ra”.
- source_word: ὁ Ἰωάννης
  choice: Giăng
  rationale: Giữ đúng cách gọi đơn giản trong câu, không thêm danh hiệu “người làm phép báp-têm”.
theological_decisions:
- issue: Danh tính của người đang đứng giữa họ
  choice: một Đấng
  alternative: một người; Đấng Mê-si
  rationale: Không nêu đích danh Chúa Giê-su hay Đấng Mê-si, nhờ đó giữ được sự căng thẳng tự sự; “Đấng” thể hiện sắc thái tôn kính theo ngữ cảnh nhưng không giải thích danh tính vượt quá câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “các ông” vì Giăng đang trả lời nhóm người được sai đến chất vấn ông; tránh đại từ “các ngươi” mang sắc thái cổ hoặc gay gắt.
