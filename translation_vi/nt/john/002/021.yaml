revisions:
- from: Nhưng Ngài đang nói về đền thờ là thân thể mình.[a]
  to: Nhưng Ngài nói về đền thờ của thân thể Ngài.[a]
  rationale: Bản sửa giữ quan hệ sở hữu trong cụm τοῦ ναοῦ τοῦ σώματος αὐτοῦ, tránh diễn đạt đồng nhất hóa bằng “là”, và dùng thì đơn tự nhiên hơn cho lời bình thuật. Chú thích tiếp tục bảo lưu sắc thái hẹp hơn có thể có của ναός mà không áp đặt một cách hiểu vượt quá văn bản.
