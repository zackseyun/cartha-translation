  timestamp: '2026-07-17T05:36:51Z'
review_pass:
  verdict: revise
  source_fidelity: Bản nháp chuyển tải đúng sự đối lập của δέ và chủ đề lời nói của Đức Giê-su. Tuy nhiên, cấu trúc “đền thờ là thân thể mình” thay quan hệ sở hữu/định ngữ trực tiếp τοῦ ναοῦ τοῦ σώματος αὐτοῦ (“đền thờ của thân thể Ngài”) bằng một mệnh đề đồng nhất. Dù ý hướng gần nhau, cách sửa trực tiếp hơn bảo toàn cấu trúc và hình ảnh của nguyên ngữ.
  naturalness: “Nhưng Ngài nói về đền thờ của thân thể Ngài” là câu văn hiện đại, trang trọng và tự nhiên trong ngữ cảnh tường thuật. Cách dùng “đang nói” ở đây kém tự nhiên trong tiếng Việt khi không có mốc quá khứ tường minh; thì chưa hoàn thành Hy Lạp không cần được thể hiện bằng tiếp diễn tiếng Việt.
  terminology: Giữ “đền thờ” cho ναός là phù hợp; chú thích có thể nêu lựa chọn “nơi thánh” và sắc thái chỉ khu vực thánh điện bên trong. “Thân thể” giữ đúng σῶμα. Dùng nhất quán “Ngài” thay cho “mình” làm rõ sở hữu cách αὐτοῦ và phù hợp với văn phong tôn trọng.
  issues:
  - severity: medium
    issue: “đền thờ là thân thể mình” không giữ trực tiếp quan hệ “đền thờ của thân thể Ngài”.
    rationale: Nguyên văn có hai sở hữu cách liên tiếp, với ναός được xác định bởi “thân thể của Ngài”. Thêm “là” chuyển cách biểu đạt thành đồng nhất hóa cú pháp; bản sửa giữ sát cấu trúc mà vẫn rõ nghĩa tiếng Việt.
  - severity: low
    issue: “đang nói” không tự nhiên trong lời trần thuật quá khứ này.
    rationale: Thì chưa hoàn thành ἔλεγεν có thể mang sắc thái mô tả, nhưng tiếng Việt không cần đánh dấu bằng “đang”. Thì đơn “nói” trong văn cảnh quá khứ chuyển tải tự nhiên hơn.
  revised_text: Nhưng Ngài nói về đền thờ của thân thể Ngài.[a]
