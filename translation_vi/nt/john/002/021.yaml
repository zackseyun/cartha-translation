translation:
  language: vi
  text: Nhưng Ngài nói về đền thờ của thân thể Ngài.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “nơi thánh của thân thể Ngài”; từ Hy Lạp naos ở đây thường chỉ cụ thể khu vực thánh điện bên trong hơn là toàn bộ khuôn viên đền thờ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκεῖνος
  choice: Ngài
  rationale: Đại từ chỉ định này quy chiếu về Đức Giê-su; trong tiếng Việt, “Ngài” là cách quy chiếu tự nhiên và trang trọng trong ngữ cảnh Kinh Thánh, không cần dịch cứng là “người ấy”.
- source_word: δὲ
  choice: Nhưng
  rationale: δέ biểu thị sự tương phản nhẹ giữa lời giải thích này và cách người nghe hiểu ở câu trước.
- source_word: ἔλεγεν
  choice: đang nói
  rationale: Thì chưa hoàn thành diễn tả hành động trong quá khứ theo cách triển diễn; “đang nói” giữ được sắc thái ấy mà không diễn giải thành “có ý nói”.
- source_word: περὶ
  choice: về
  rationale: περί với sở hữu cách có nghĩa là “về, liên quan đến”; “về” tự nhiên và rõ ràng trong tiếng Việt hiện đại.
- source_word: ναοῦ
  choice: đền thờ
  rationale: ναός có thể chỉ cụ thể nơi thánh bên trong, nhưng “đền thờ” là cách dịch quen thuộc, dễ hiểu; sắc thái hẹp hơn được ghi ở chú thích.
- source_word: σώματος
  choice: thân thể
  rationale: “Thân thể” chuyển tải trực tiếp σῶμα và giữ nguyên ý nghĩa thần học quan trọng của hình ảnh này.
- source_word: αὐτοῦ
  choice: mình
  rationale: Đại từ phản thân “mình” quy chiếu tự nhiên về chính chủ thể đang nói là Đức Giê-su, tương ứng với ý sở hữu của αὐτοῦ trong tiếng Hy Lạp.
theological_decisions:
- issue: Sự đồng nhất mang tính ẩn dụ giữa thân thể Đức Giê-su và đền thờ
  choice: Giữ trực tiếp hình ảnh “đền thờ là thân thể mình” mà không thêm lời giải nghĩa thần học.
  alternative: “đền thờ của thân thể Ngài” hoặc “thân thể Ngài như là đền thờ”
  rationale: Cách dịch này bảo toàn lời giải thích của tác giả và ý nghĩa Cơ Đốc học, đồng thời tránh làm mờ quan hệ ẩn dụ bằng một cách diễn giải giáo lý. Từ “là” giúp câu tiếng Việt tự nhiên mà không thêm một nhận định vượt quá quan hệ giải thích trong nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” để chỉ Đức Giê-su; giữ hình ảnh đền thờ–thân thể và đặt dấu chú thích ngay sau câu.
