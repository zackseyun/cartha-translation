id: JHN.2.23
reference: John 2:23
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ὡς δὲ ἦν ἐν τοῖς Ἱεροσολύμοις ἐν τῷ πάσχα ἐν τῇ ἑορτῇ, πολλοὶ ἐπίστευσαν εἰς τὸ ὄνομα αὐτοῦ, θεωροῦντες αὐτοῦ τὰ σημεῖα ἃ ἐποίει·
base_translation:
  language: en
  yaml_path: translation/nt/john/002/023.yaml
  text: When he was in Jerusalem at the Passover[a], during the feast[b], many believed in his name as they were seeing the signs that he was doing.
translation:
  language: vi
  text: Khi Đức Giê-su ở Giê-ru-sa-lem vào dịp lễ Vượt Qua, trong thời gian lễ hội, nhiều người đã tin vào danh Ngài[a] khi chứng kiến những dấu lạ[b] Ngài đang làm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể diễn đạt: “tin nơi Ngài”. Theo nghĩa đen: “tin vào danh Ngài”; trong sách Giăng, cách nói này nhấn mạnh lòng tin hướng đến căn tính đã được bày tỏ của Đức Giê-su.'
    reason: lexical_alternative
  - marker: b
    text: “Dấu lạ” là thuật ngữ đặc trưng của Giăng dành cho những việc làm không chỉ kỳ diệu mà còn chỉ đến Đức Giê-su là ai; một số bản dịch dùng “phép lạ”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὡς δὲ ἦν ἐν τοῖς Ἱεροσολύμοις
  choice: Khi Đức Giê-su ở tại Giê-ru-sa-lem
  rationale: ὡς δέ mở đầu hoàn cảnh thời gian với sự tiếp nối nhẹ; tiếng Việt tự nhiên chỉ cần “Khi”. Chủ ngữ được nêu là Đức Giê-su theo ngữ cảnh, thay cho đại từ có thể thiếu rõ ràng khi câu đứng riêng.
- source_word: ἐν τῷ πάσχα ἐν τῇ ἑορτῇ
  choice: vào dịp lễ Vượt Qua, trong những ngày lễ
  rationale: Giữ cả hai cụm chỉ thời gian và hiểu cụm sau là sự triển khai về thời gian diễn ra lễ hội. “Trong những ngày lễ” tự nhiên hơn việc lặp “trong lễ” trong tiếng Việt.
- source_word: πολλοὶ
  choice: nhiều người
  rationale: Tiếng Việt cần danh từ chỉ người để câu rõ và tự nhiên.
- source_word: ἐπίστευσαν εἰς τὸ ὄνομα αὐτοῦ
  choice: đã tin vào danh Ngài
  rationale: Giữ thành ngữ đặc trưng của Giăng về việc tin vào “danh”, không giản lược thành “tin Ngài” và cũng không tự đánh giá mức độ chân thật của đức tin này.
- source_word: θεωροῦντες
  choice: khi thấy
  rationale: Diễn đạt hành động quan sát diễn ra đồng thời với việc tin. Trong tiếng Việt, “khi thấy” tự nhiên và không nhất thiết làm mất nét tiếp diễn trong bối cảnh.
- source_word: τὰ σημεῖα ἃ ἐποίει
  choice: những dấu lạ Ngài làm
  rationale: “Dấu lạ” vừa dễ hiểu trong tiếng Việt vừa giữ chức năng chỉ dấu của σημεῖον, thay vì chỉ gọi là “phép lạ”. Dạng vị từ tiếng Việt không cần đánh dấu riêng thể chưa hoàn thành của ἐποίει.
theological_decisions:
- issue: Tính chất của đức tin được nói đến trong ἐπίστευσαν εἰς τὸ ὄνομα αὐτοῦ
  choice: Dịch trực tiếp là “nhiều người đã tin vào danh Ngài”
  alternative: “nhiều người chỉ mới tin hời hợt nơi Ngài” hoặc “nhiều người tuyên xưng đức tin vì các phép lạ”
  rationale: Câu Hy Lạp khẳng định họ tin vào danh Ngài; bản dịch không nên dùng câu 24 để hạ thấp trước đức tin được mô tả ở câu 23. Cách dịch này giữ nguyên sức căng thần học của mạch văn.
- issue: Ý nghĩa của σημεῖα trong thần học Giăng
  choice: “những dấu lạ”
  alternative: “những phép lạ” hoặc “những dấu hiệu”
  rationale: “Dấu lạ” giữ được cả tính phi thường lẫn chức năng hướng người đọc đến căn tính của Đức Giê-su, mà không biến thuật ngữ thành một lời giải thích giáo lý.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng “Đức Giê-su”, “Ngài”, “Giê-ru-sa-lem” và “lễ Vượt Qua” theo lối gọi quen thuộc của tiếng Việt Cơ Đốc. Hai dấu chú thích đều được đặt ngay sau thành phần mà chúng giải thích.
