    rationale: Bản Hy Lạp dùng số ít, chỉ chính kỳ/lễ hội Vượt Qua. “Trong thời gian lễ hội” giữ ý số ít và vẫn tự nhiên.
  - severity: medium
    issue: Chú thích b đang đặt sau “Ngài làm” thay vì sau “dấu lạ”.
    rationale: Nội dung chú thích giải thích τὰ σημεῖα (“dấu lạ”), nên ký hiệu phải neo trực tiếp vào thuật ngữ đó.
  - severity: low
    issue: “ở tại” hơi nặng và “Ngài làm” không biểu lộ nét tiếp diễn của ἐποίει.
    rationale: Đổi thành “ở” và “Ngài đang làm” giúp câu hiện đại, gọn hơn, đồng thời phản ánh hợp lý thì chưa hoàn thành.
