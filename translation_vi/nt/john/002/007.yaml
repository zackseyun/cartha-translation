  yaml_path: translation/nt/john/002/007.yaml
  text: Jesus said to them[a], “Fill the water jars with water.” And they filled them to the brim.
translation:
  language: vi
  text: 'Chúa Giê-su bảo họ: “Hãy đổ nước đầy các chum đựng nước.” Họ đổ đầy các chum đến miệng.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: bảo
  rationale: Động từ hiện tại lịch sử được chuyển sang lối kể tự nhiên trong tiếng Việt; “bảo” diễn đạt lời truyền trực tiếp của Chúa Giê-su trong ngữ cảnh.
- source_word: αὐτοῖς
  choice: họ
  rationale: Đại từ số nhiều ở cách dữ chỉ những người nhận lời truyền; tiếng Việt thể hiện tự nhiên qua kết cấu “bảo họ”.
- source_word: Γεμίσατε
  choice: Hãy đổ nước đầy
  rationale: Mệnh lệnh số nhiều yêu cầu làm đầy các chum; cách nói này tự nhiên trong tiếng Việt và nêu rõ hành động dùng nước.
- source_word: τὰς ὑδρίας
  choice: các chum đựng nước
  rationale: ὑδρία chỉ chum hoặc vò dùng để chứa nước. “Chum đựng nước” rõ nghĩa, phù hợp ngữ cảnh và không tự ý lặp lại chất liệu bằng đá từ câu trước.
- source_word: ὕδατος
  choice: nước
  rationale: Danh từ ở sở hữu cách sau γεμίζω chỉ thứ được dùng để làm đầy; tiếng Việt diễn đạt tự nhiên là “đổ nước đầy”.
- source_word: ἐγέμισαν αὐτὰς
  choice: Họ đổ đầy
  rationale: Thể bất định thuật lại việc họ hoàn thành mệnh lệnh. Tân ngữ được lược bỏ tự nhiên trong tiếng Việt vì đã rõ là các chum.
- source_word: ἕως ἄνω
  choice: đến tận miệng chum
  rationale: Cụm từ chỉ mức đầy tới phần trên cùng. “Đến tận miệng chum” là cách diễn đạt tự nhiên, rõ ràng trong tiếng Việt và truyền đạt việc các chum được làm đầy hoàn toàn.
