revisions:
- from: 'Đức Giê-su đáp lời họ: “Hãy phá hủy đền thờ này, rồi trong ba ngày, tôi sẽ dựng nó dậy.”[a]'
  to: 'Đức Giê-su trả lời họ: “Hãy phá hủy đền thờ này, rồi trong ba ngày tôi sẽ dựng nó lên.”[a]'
  rationale: Chỉnh duy nhất cách diễn đạt động từ chính để tiếng Việt tự nhiên hơn mà vẫn bảo toàn sự căng thẳng có chủ ý giữa việc dựng một đền thờ và tiếng vọng về sự sống lại. Chú thích được điều chỉnh tương ứng và diễn đạt sát hơn lời giải thích ở 2:21.
  reviewer_model: gpt-5.6-terra
