  text: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτοῖς· Λύσατε τὸν ναὸν τοῦτον καὶ ἐν τρισὶν ἡμέραις ἐγερῶ αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/019.yaml
  text: Jesus answered and said to them[a], “Destroy this temple, and in three days I will raise it up.”
translation:
  language: vi
  text: 'Đức Giê-su trả lời họ: “Hãy phá hủy đền thờ này, rồi trong ba ngày tôi sẽ dựng nó lên.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Hãy phá bỏ đền thờ này… tôi sẽ dựng lại.” Động từ Hy Lạp được dịch là “dựng… lên” cũng có thể gợi đến sự sống lại; về sau, Giăng giải thích rằng Đức Giê-su nói về đền thờ của thân thể ngài (2:21).'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτοῖς
  choice: Đức Giê-su đáp lời họ
  rationale: Cụm Hy Lạp mang sắc thái kể chuyện theo lối Semit; tiếng Việt tự nhiên không cần lặp cả hai động từ theo kiểu “đáp và nói”, nhưng vẫn giữ đầy đủ ý rằng Đức Giê-su trả lời họ.
- source_word: Λύσατε
  choice: Hãy phá hủy
  rationale: Trong ngữ cảnh này, λύω chỉ việc phá bỏ công trình, không phải đơn thuần là tháo hay cởi; “phá hủy” giữ được sức mạnh của mệnh lệnh và sự hiểu lầm tiếp theo trong trình thuật.
- source_word: τὸν ναὸν τοῦτον
  choice: đền thờ này
  rationale: “Đền thờ” là cách nói thông dụng, trang trọng và đủ sức bao quát ναός trong câu; không giải thích trước rằng từ này ám chỉ thân thể Đức Giê-su, vì câu 21 mới làm điều đó.
- source_word: ἐν τρισὶν ἡμέραις
  choice: trong ba ngày
  rationale: Giữ nguyên cách diễn đạt thời gian của tiếng Hy Lạp mà không quyết định quá mức sắc thái chính xác là “sau” hay “nội trong” ba ngày.
- source_word: ἐγερῶ αὐτόν
  choice: tôi sẽ dựng nó dậy
  rationale: “Dựng… dậy” vừa có thể được nghe theo nghĩa dựng lại đền thờ, vừa gợi việc làm cho sống dậy; nhờ đó bảo tồn cách chơi nghĩa và âm hưởng phục sinh của ἐγείρω.
theological_decisions:
- issue: Có nên nói rõ ngay rằng “đền thờ” là thân thể Đức Giê-su hay không
  choice: Giữ nguyên cách nói bí ẩn “đền thờ này” trong chính văn.
  alternative: “Hãy phá hủy thân thể tôi là đền thờ này.”
  rationale: Giăng 2:21 mới giải thích đối tượng Đức Giê-su nói đến. Nêu rõ ngay ở câu 19 sẽ xóa đi sự mơ hồ có chủ ý và căng thẳng của trình thuật.
- issue: Nên thể hiện ἐγερῶ theo nghĩa kiến trúc hay phục sinh
  choice: Dùng “dựng nó dậy”, giữ được cả hai âm hưởng.
  alternative: “tôi sẽ xây lại nó” hoặc “tôi sẽ làm nó sống lại”
  rationale: “Xây lại” thu hẹp nghĩa vào kiến trúc, còn “làm sống lại” giải thích quá sớm. “Dựng… dậy” phù hợp với hình ảnh đền thờ và vẫn gợi sự phục sinh.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Giê-su” theo lối gọi tôn kính phổ biến; lời nói trực tiếp dùng “tôi” tự nhiên trong tiếng Việt. Tránh lối dịch cứng “đáp và nói”, đồng thời giữ sự mơ hồ thần học có chủ ý của câu.
