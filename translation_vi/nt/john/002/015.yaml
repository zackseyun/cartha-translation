id: JHN.2.15
reference: John 2:15
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ποιήσας φραγέλλιον ἐκ σχοινίων πάντας ἐξέβαλεν ἐκ τοῦ ἱεροῦ τά τε πρόβατα καὶ τοὺς βόας, καὶ τῶν κολλυβιστῶν ἐξέχεεν ⸂τὰ κέρματα⸃ καὶ τὰς τραπέζας ⸀ἀνέστρεψεν,
base_translation:
  language: en
  yaml_path: translation/nt/john/002/015.yaml
  text: And after making a whip out of cords[a], he drove them all out of the temple courts, including both the sheep and the cattle[c][b]; and he poured out the coins of the money changers and overturned the tables.
translation:
  language: vi
  text: Sau khi làm một cái roi bằng dây, Ngài đuổi tất cả ra khỏi khuôn viên đền thờ[a], cả chiên lẫn bò[b][c]; Ngài đổ các đồng tiền của những người đổi tiền và lật các bàn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hy Lạp ἱερόν chỉ toàn bộ khu đền thờ hoặc các sân đền thờ, chứ không riêng nơi thánh bên trong.
    reason: cultural_note
  - marker: b
    text: 'Cũng có thể dịch: “cả chiên lẫn bò đực.”'
    reason: lexical_alternative
  - marker: c
    text: Tiếng Hy Lạp nói “tất cả,” rồi nêu rõ “cả chiên lẫn bò”; câu không nói rõ roi đã được dùng trên người.
    reason: alternative_reading
lexical_decisions:
- source_word: ποιήσας
  choice: lấy dây bện thành
  rationale: Phân từ aorist diễn tả hành động xảy ra trước động từ chính; cách diễn đạt này tự nhiên trong tiếng Việt và cho thấy Ngài làm roi từ dây.
- source_word: φραγέλλιον ἐκ σχοινίων
  choice: một cây roi ... bằng dây
  rationale: φραγέλλιον là roi; σχοινίων chỉ các sợi dây hoặc dây thừng nhỏ. Cách dịch rõ nghĩa, hiện đại.
- source_word: πάντας ἐξέβαλεν
  choice: đuổi tất cả ra
  rationale: Giữ phạm vi bao quát của πάντας và sắc thái mạnh của ἐκβάλλω nhưng không tự ý xác định rằng roi được dùng trên người.
- source_word: τοῦ ἱεροῦ
  choice: khỏi khuôn viên đền thờ
  rationale: ἱερόν chỉ toàn bộ khu đền thờ, không riêng nơi thánh bên trong; 'khuôn viên đền thờ' truyền đạt sự phân biệt này.
- source_word: τά τε πρόβατα καὶ τοὺς βόας
  choice: cả chiên lẫn bò
  rationale: Giữ cấu trúc liên kết τε...καί và dùng từ phổ thông; βόας ở đây có thể chỉ bò nói chung.
- source_word: κολλυβιστῶν
  choice: những người đổi tiền
  rationale: Thuật ngữ tự nhiên và chính xác cho những người làm việc đổi tiền tại đền thờ.
- source_word: ἐξέχεεν τὰ κέρματα
  choice: đổ tung tiền xu
  rationale: Giữ hình ảnh 'đổ ra' của ἐκχέω, đồng thời 'tung' diễn đạt tự nhiên kết quả các đồng tiền bị đổ ra trong ngữ cảnh.
- source_word: τὰς τραπέζας ἀνέστρεψεν
  choice: lật đổ các bàn
  rationale: ἀναστρέφω trong ngữ cảnh mang nghĩa làm bàn lật nhào; cách dịch ngắn gọn và rõ ràng.
theological_decisions:
- issue: Phạm vi hành động của Chúa Giê-su và việc sử dụng roi
  choice: Dịch 'đuổi tất cả ra', rồi nêu 'cả chiên lẫn bò', nhưng không nói Ngài dùng roi đánh người.
  alternative: Hiểu rằng Ngài đuổi tất cả mọi người và súc vật; hoặc chỉ đuổi các súc vật.
  rationale: Cú pháp Hy Lạp dùng πάντας rồi nêu chiên và bò; câu không nói rõ roi được dùng trên người. Bản dịch giữ nguyên độ rộng và sự mơ hồ thật sự của văn bản.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng 'Ngài' để nói về Chúa Giê-su; tránh từ cổ và không giải quyết quá mức sự mơ hồ trong cú pháp Hy Lạp.
