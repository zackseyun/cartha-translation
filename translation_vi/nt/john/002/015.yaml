revisions:
- from: Ngài lấy dây bện thành một cây roi, rồi đuổi tất cả ra khỏi khuôn viên đền thờ[a], cả chiên lẫn bò[b][c]; Ngài đổ tung tiền xu của những người đổi tiền và lật đổ các bàn.
  to: Sau khi làm một cái roi bằng dây, Ngài đuổi tất cả ra khỏi khuôn viên đền thờ[a], cả chiên lẫn bò[b][c]; Ngài đổ các đồng tiền của những người đổi tiền và lật các bàn.
  rationale: Các sửa đổi bám sát hơn ý nghĩa từ vựng của nguyên văn mà vẫn giữ tiếng Việt hiện đại, tự nhiên. Bản sửa bảo toàn sự mơ hồ cú pháp về phạm vi của “tất cả” và không suy diễn roi được dùng với người.
