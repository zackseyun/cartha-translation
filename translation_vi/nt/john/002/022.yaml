  source_fidelity: 'Bản nháp truyền đạt đúng mạch chính của câu: mệnh đề thời gian–suy luận, dạng bị động của ἠγέρθη, việc các môn đệ nhớ lại, và hai đối tượng của ἐπίστευσαν. Tuy nhiên, cách gọi “Đức Chúa Jêsus” và “môn đồ” không phù hợp nhất với tiếng Việt chuẩn hiện đại; đồng thời nên làm rõ mệnh đề quan hệ bổ nghĩa cho λόγῳ (“lời mà ... đã nói”).'
  naturalness: “Ngài được làm cho sống lại từ cõi chết” là cách giữ được bị động và vẫn hiểu được. “Các môn đệ của Ngài” và “Chúa Giê-su” tự nhiên, phổ thông hơn trong văn phong Kinh Thánh tiếng Việt hiện đại. “Nhớ lại” diễn đạt chính xác hơn hành động hồi tưởng trong ngữ cảnh.
  terminology: Dùng “Chúa Giê-su” theo chính tả tiếng Việt hiện đại; tránh dạng “Jêsus” và tước hiệu ghép “Đức Chúa Jêsus”, vốn thuộc truyền thống phiên âm/văn phong cũ và không phải lựa chọn trung tính nhất cho bản tiếng Việt chuẩn hiện đại. “Kinh Thánh” và “lời” giữ được các thuật ngữ trọng yếu của γραφή và λόγος.
  issues:
  - severity: medium
    issue: Tên riêng và thuật ngữ chỉ môn đệ mang văn phong/phiên âm cũ.
    rationale: “Đức Chúa Jêsus” và “môn đồ” gợi một truyền thống bản dịch cụ thể hơn là tiếng Việt chuẩn hiện đại. “Chúa Giê-su” và “môn đệ” phổ thông, trung tính và dễ hiểu hơn.
