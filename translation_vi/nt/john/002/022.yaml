    rationale: Tiếng Việt cần “lời mà Chúa Giê-su đã nói” để xác định minh bạch rằng mệnh đề ὃν εἶπεν ὁ Ἰησοῦς bổ nghĩa cho λόγῳ, không phải cho toàn câu.
