source:
  edition: SBLGNT
  text: ὅτε οὖν ἠγέρθη ἐκ νεκρῶν, ἐμνήσθησαν οἱ μαθηταὶ αὐτοῦ ὅτι τοῦτο ἔλεγεν, καὶ ἐπίστευσαν τῇ γραφῇ καὶ τῷ λόγῳ ⸀ὃν εἶπεν ὁ Ἰησοῦς.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/022.yaml
  text: So when he was raised from the dead, his disciples remembered that he had been saying this, and they believed the Scripture and the word that Jesus had spoken.
translation:
  language: vi
  text: Vì vậy, khi Ngài được làm cho sống lại từ cõi chết[a], các môn đệ của Ngài nhớ lại rằng Ngài đã nói điều này[b], và họ tin Kinh Thánh cùng lời mà Chúa Giê-su đã nói[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Ngài sống lại từ cõi chết.” Động từ Hy Lạp ở dạng bị động, được giữ trong bản chính.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “Ngài đang nói điều này” hoặc “Ngài đã nói điều này.” Thì chưa hoàn thành trong tiếng Hy Lạp có thể gợi sắc thái hành động đang diễn ra, lặp lại, hoặc kéo dài trong quá khứ.'
    reason: lexical_alternative
  - marker: c
    text: Từ Hy Lạp cũng có thể được dịch là “lời tuyên bố” hoặc “sứ điệp.” Ở đây, từ ấy chỉ lời Chúa Giê-su đã nói.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε οὖν
  choice: Vì vậy, khi
  rationale: ὅτε mở đầu mệnh đề thời gian, còn οὖν nối sự việc với phần trước theo mạch suy luận; cách dịch này giữ cả hai chức năng trong tiếng Việt tự nhiên.
- source_word: ἠγέρθη
  choice: Ngài được làm cho sống lại
  rationale: Dạng bị động được giữ lại, đồng thời diễn đạt rõ nghĩa phục sinh của ἐγείρω trong ngữ cảnh.
- source_word: ἐκ νεκρῶν
  choice: từ cõi chết
  rationale: Cách nói tự nhiên trong tiếng Việt, diễn đạt thành ngữ Hy Lạp chỉ sự sống lại khỏi tình trạng và phạm vi của người chết.
- source_word: ἐμνήσθησαν
  choice: nhớ
  rationale: Diễn đạt tự nhiên việc các môn đồ nhớ lại lời đã được nói trước đó.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: các môn đồ Ngài
  rationale: Giữ thuật ngữ quen thuộc trong văn phong Kinh Thánh Việt ngữ và thể hiện rõ quan hệ sở hữu.
- source_word: ὅτι τοῦτο ἔλεγεν
  choice: rằng Ngài đã nói điều ấy
  rationale: Trong ngữ cảnh hồi tưởng, cách dịch này tự nhiên và không buộc thì chưa hoàn thành phải mang nghĩa lặp lại; khả năng sắc thái tiếp diễn được ghi ở chú thích.
- source_word: ἐπίστευσαν
  choice: họ tin
  rationale: Là cách dịch trực tiếp, ít diễn giải nhất của πιστεύω với các bổ ngữ ở cách dữ liệu.
- source_word: τῇ γραφῇ
  choice: Kinh Thánh
  rationale: γραφή số ít ở đây chỉ văn bản thánh có thẩm quyền; tiếng Việt dùng tự nhiên danh xưng tập hợp “Kinh Thánh”.
- source_word: τῷ λόγῳ
  choice: lời
  rationale: Trong ngữ cảnh, λόγος chỉ lời Đức Chúa Jêsus vừa được nhắc đến, đồng thời giữ được cách dùng giàu ý nghĩa của thuật ngữ này trong Giăng.
- source_word: ὃν εἶπεν ὁ Ἰησοῦς
  choice: Đức Chúa Jêsus đã phán
  rationale: Mệnh đề quan hệ bổ nghĩa cho “lời”; “phán” là cách diễn đạt trang trọng, tự nhiên khi nói về lời của Đức Chúa Jêsus.
theological_decisions:
- issue: Dạng của động từ phục sinh
  choice: Ngài được làm cho sống lại từ cõi chết
  alternative: Ngài sống lại từ cõi chết
  rationale: Bản chính giữ dạng bị động của ἠγέρθη, không làm mờ cách diễn đạt của câu Hy Lạp; cách chủ động tự thân vẫn được nêu như một khả năng diễn đạt tiếng Việt.
- issue: Ý nghĩa của πιστεύω với các bổ ngữ ở cách dữ liệu
  choice: tin Kinh Thánh cùng lời Đức Chúa Jêsus đã phán
  alternative: đặt lòng tin nơi Kinh Thánh cùng lời Đức Chúa Jêsus đã phán
  rationale: “Tin” bám sát câu nguồn và tránh thêm sắc thái thần học vượt quá phát biểu rằng các môn đồ tin điều Kinh Thánh và lời Đức Chúa Jêsus nói.
- issue: Sắc thái của thì chưa hoàn thành ἔλεγεν
  choice: đã nói điều ấy
  alternative: vẫn nói điều ấy / đã từng nói điều ấy
  rationale: Ngữ cảnh nhấn mạnh việc nhớ lại lời nói trước đây; bản chính không áp đặt ý lặp lại, còn chú thích bảo tồn khả năng sắc thái đang diễn tiến hoặc kéo dài.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” và “Đức Chúa Jêsus” theo văn phong Kinh Thánh Việt ngữ; giữ cấu trúc câu gọn, rõ và duy trì dạng bị động đáng kể về mặt ngữ nghĩa.
