  text: ⸀καὶ λέγει αὐτῇ ὁ Ἰησοῦς· Τί ἐμοὶ καὶ σοί, γύναι; οὔπω ἥκει ἡ ὥρα μου.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/004.yaml
  text: And Jesus said to her[a], “What does that have to do with me and with you[b], woman? My hour has not yet come.”
translation:
  language: vi
  text: 'Giê-su nói với bà: “Việc ấy có liên quan gì đến tôi và bà[a], thưa bà[b]? Giờ của tôi chưa đến.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch sát hơn: “Việc ấy là gì đối với tôi và bà?” Đây là một thành ngữ diễn tả sự khác biệt hoặc khoảng cách về mối quan tâm, không nhất thiết hàm ý thù nghịch.'
    reason: lexical_alternative
  - marker: b
    text: Trong bối cảnh thời ấy, từ được dịch là “thưa bà” là một cách xưng hô bình thường và có thể mang sắc thái tôn trọng, dù không biểu thị quan hệ thân mật.
    reason: cultural_note
lexical_decisions:
- source_word: λέγει
  choice: nói
  rationale: Thì hiện tại lịch sử trong tiếng Hy Lạp được chuyển tự nhiên bằng động từ kể chuyện “nói” trong tiếng Việt; tiếng Việt không bắt buộc đánh dấu thì quá khứ.
- source_word: Τί ἐμοὶ καὶ σοί
  choice: Điều đó có liên quan gì đến tôi và bà
  rationale: Cách dịch này truyền đạt thành ngữ diễn tả khoảng cách về mối quan tâm hoặc trách nhiệm, đồng thời giữ cả hai thành tố “tôi” và “bà” mà không đẩy giọng điệu thành thù nghịch.
- source_word: γύναι
  choice: thưa bà
  rationale: “Thưa bà” là cách xưng hô tiếng Việt hiện đại có sắc thái tôn trọng và không thân mật; nó tránh sự cộc lốc dễ nảy sinh nếu chỉ dịch là “đàn bà” hay “bà”.
- source_word: οὔπω
  choice: chưa
  rationale: Diễn đạt trực tiếp rằng thời điểm ấy chưa xảy đến tính đến lúc này.
- source_word: ἥκει
  choice: đến
  rationale: “Đến” kết hợp tự nhiên với “giờ” và giữ hình ảnh thời điểm đang tiến đến.
- source_word: ἡ ὥρα μου
  choice: Giờ của tôi
  rationale: Giữ danh từ “giờ” thay vì khái quát thành “thời điểm” để bảo toàn mô-típ thần học quan trọng trong sách Giăng.
theological_decisions:
- issue: Giọng điệu khi Đức Chúa Jêsus nói với mẹ mình
  choice: Tôn trọng nhưng tạo khoảng cách
  alternative: Một lời quở trách gay gắt; hoặc một cách gọi trìu mến
  rationale: Thành ngữ Τί ἐμοὶ καὶ σοί tạo khoảng cách về mối quan tâm, còn γύναι tự nó không nhất thiết bất kính. Bản dịch giữ sự căng thẳng ấy mà không làm lời nói trở nên xúc phạm hay quá âu yếm.
- issue: Ý nghĩa của “giờ của tôi” trong thần học Giăng
  choice: Giữ nguyên cách nói có âm hưởng về giờ đã được ấn định cho sứ mạng của Đức Chúa Jêsus
  alternative: Chỉ thời điểm làm dấu lạ này; hoặc một lời nói chung về thời gian
  rationale: Trong sách Giăng, “giờ” thường gắn với việc Đức Chúa Jêsus bày tỏ chính mình, chịu chết và được tôn vinh. Dịch sát cụm từ để người đọc nhận ra âm hưởng ấy mà không xác định quá mức ngay trong câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “tôi” và “bà” giữ khoảng cách trong lời đáp. Cụm “thưa bà” giúp tiếng Việt không nghe cộc lốc nhưng cũng không thêm sắc thái trìu mến không có rõ trong nguyên văn.
