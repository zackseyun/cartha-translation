id: JHN.2.25
reference: John 2:25
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ὅτι οὐ χρείαν εἶχεν ἵνα τις μαρτυρήσῃ περὶ τοῦ ἀνθρώπου, αὐτὸς γὰρ ἐγίνωσκεν τί ἦν ἐν τῷ ἀνθρώπῳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/025.yaml
  text: and because he had no need that anyone should testify about man[a], for he himself knew what was in man.
translation:
  language: vi
  text: và vì Ngài không cần ai làm chứng về con người[a], bởi chính Ngài biết điều gì ở trong con người.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Con người” ở đây là danh từ số ít được dùng theo nghĩa khái quát, có thể chỉ một người hoặc loài người nói chung.
    reason: lexical_alternative
lexical_decisions:
- source_word: χρείαν εἶχεν
  choice: không cần
  rationale: Diễn đạt tự nhiên thành ngữ Hy Lạp χρείαν ἔχειν trong tiếng Việt hiện đại, giữ nguyên ý thiếu nhu cầu mà không diễn giải quá mức.
- source_word: ἵνα τις μαρτυρήσῃ
  choice: ai làm chứng
  rationale: “Làm chứng” giữ sắc thái chứng nhận/chứng thực của μαρτυρέω; “ai” phù hợp với đại từ bất định τις trong câu phủ định.
- source_word: περὶ τοῦ ἀνθρώπου
  choice: về con người
  rationale: ἄνθρωπος số ít được dùng theo nghĩa khái quát. “Con người” vừa tự nhiên trong tiếng Việt vừa giữ được số ít mang tính đại diện và sự lặp lại ở cuối câu.
- source_word: αὐτὸς γὰρ
  choice: bởi chính Ngài
  rationale: “Chính Ngài” bảo toàn tính nhấn mạnh của αὐτός; “bởi” thể hiện chức năng giải thích của γάρ trong mạch câu.
- source_word: ἐγίνωσκεν
  choice: biết
  rationale: Động từ ở thì chưa hoàn thành diễn tả sự biết liên tục hoặc đặc trưng; tiếng Việt dùng “biết” tự nhiên mà không cần bổ sung trạng từ vốn không có trong nguyên văn.
- source_word: τί ἦν ἐν τῷ ἀνθρώπῳ
  choice: điều gì ở trong con người
  rationale: Giữ cách diễn đạt rộng và có chủ ý của nguyên văn về điều ở bên trong con người, đồng thời lặp lại “con người” để bảo toàn liên kết tu từ.
theological_decisions:
- issue: Phạm vi sự hiểu biết của Chúa Giê-su về con người
  choice: Giữ lời khẳng định rộng rằng chính Ngài biết điều gì ở trong con người.
  alternative: Diễn giải thành Ngài biết riêng lòng của từng người, hoặc biết bản tính loài người nói chung.
  rationale: Số ít ἀνθρώπου/ἀνθρώπῳ có thể mang nghĩa đại diện, bao hàm cả phương diện cá nhân lẫn nhân loại nói chung. Bản dịch không thu hẹp hoặc mở rộng điều nguyên văn chưa xác định.
translation_notes:
  register: Văn phong trang trọng, tự nhiên và dễ hiểu trong tiếng Việt hiện đại. Dùng “Ngài” nhất quán để chỉ Chúa Giê-su; giữ cấu trúc nối tiếp từ câu trước bằng “và vì” và giữ sự lặp lại có chủ ý của “con người”.
