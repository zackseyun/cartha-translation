  source_fidelity: 'Bản dịch chuyển đạt đầy đủ các thành tố của nguyên văn: quan hệ giải thích của καὶ ὅτι, ý “không cần” của χρείαν εἶχεν, đại từ bất định τις trong ngữ cảnh phủ định (“ai”), sắc thái làm chứng của μαρτυρήσῃ, sự nhấn mạnh của αὐτός (“chính Ngài”), và nội dung rộng của τί ἦν ἐν τῷ ἀνθρώπῳ. Cách lặp lại “con người” phù hợp với sự lặp lại của ἄνθρωπος trong tiếng Hy Lạp và không áp đặt cách hiểu chỉ cá nhân hoặc chỉ nhân loại.'
