revisions:
- from: 'Các môn đồ của Ngài nhớ rằng có lời chép: “Lòng sốt sắng vì nhà Ngài sẽ thiêu đốt con.”'
  to: 'Các môn đồ của Ngài nhớ rằng có lời chép[a]: “Lòng sốt sắng về nhà Ngài sẽ nuốt chửng con.”'
  rationale: Sửa «thiêu đốt» thành «nuốt chửng» để phản ánh chính xác hơn καταφάγεταί mà vẫn giữ thì tương lai của Giăng. Đổi «vì» thành «về» cho cách diễn đạt tiếng Việt tự nhiên hơn. Thêm chú thích có neo để nêu cách đọc quá khứ của lời Thi Thiên mà không hòa lẫn với thì tương lai trong văn bản Giăng.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T05:36:47Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp giữ đúng diễn tiến chính: các môn đồ nhớ lại một lời Kinh Thánh, công thức dẫn trích dẫn, hình ảnh «nhà» và thì tương lai của καταφάγεταί. Tuy nhiên, «thiêu đốt» thêm hình ảnh lửa không có trong καταφάγεταί («nuốt chửng/tiêu hao»), nên không phải là tương đương tối ưu.'
  naturalness: «Các môn đồ của Ngài nhớ rằng có lời chép» tự nhiên và phù hợp văn phong Kinh Thánh tiếng Việt hiện đại. Trong lời trích, «lòng sốt sắng về nhà Ngài» tự nhiên hơn «lòng sốt sắng vì nhà Ngài»; «sẽ nuốt chửng con» diễn đạt mạnh, rõ, và không gợi sai hình ảnh cháy.
  terminology: Giữ «môn đồ», «có lời chép», «lòng sốt sắng», và «nhà» là phù hợp. Cặp xưng hô «Ngài/con» trong lời trích bảo toàn việc người nói ngỏ với Đức Chúa Trời; không cần thay «nhà» bằng «đền thờ».
  issues:
  - severity: medium
    issue: «thiêu đốt» cho καταφάγεταί
    rationale: Καταφάγεταί là tương lai của động từ có nghĩa «ăn hết, nuốt chửng, tiêu hao», không hàm ý lửa. «Thiêu đốt» thu hẹp và thay đổi hình tượng của câu trích.
  - severity: low
    issue: «vì nhà Ngài»
    rationale: Cụm sở hữu τοῦ οἴκου σου trong ngữ cảnh ζῆλος diễn tả lòng nhiệt thành hướng về/đối với nhà của Đức Chúa Trời. «Về nhà Ngài» là cách kết hợp tự nhiên hơn trong tiếng Việt và vẫn giữ nguyên hình ảnh «nhà».
  revised_text: 'Các môn đồ của Ngài nhớ rằng có lời chép[a]: “Lòng sốt sắng về nhà Ngài sẽ nuốt chửng con.”'
