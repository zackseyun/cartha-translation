  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸀ἐμνήσθησαν οἱ μαθηταὶ αὐτοῦ ὅτι γεγραμμένον ἐστίν· Ὁ ζῆλος τοῦ οἴκου σου καταφάγεταί με.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/017.yaml
  text: His disciples remembered that it is written[a], “Zeal for your house will consume me.”
translation:
  language: vi
  text: 'Các môn đồ của Ngài nhớ rằng có lời chép[a]: “Lòng sốt sắng về nhà Ngài sẽ nuốt chửng con.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “đã nuốt chửng con”, theo cách diễn đạt của Thi Thiên 69:9 trong một số truyền thống văn bản; bản Hy Lạp của Giăng ở đây đọc: “sẽ nuốt chửng con.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐμνήσθησαν
  choice: nhớ
  rationale: Động từ aorist dạng deponent được diễn đạt tự nhiên là “nhớ”, chỉ việc các môn đồ nhớ lại lời Kinh Thánh.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: các môn đồ của Ngài
  rationale: “Môn đồ” là cách gọi quen thuộc, trang trọng và đúng ngữ cảnh cho μαθητής; đại từ “Ngài” chỉ Chúa Giê-su.
- source_word: γεγραμμένον ἐστίν
  choice: có lời chép
  rationale: Đây là công thức dẫn lời Kinh Thánh. “Có lời chép” tự nhiên trong tiếng Việt và vẫn giữ sắc thái thẩm quyền của văn bản đã được chép.
- source_word: ζῆλος
  choice: lòng sốt sắng
  rationale: Diễn tả sự nhiệt thành, tận tâm mãnh liệt; “lòng sốt sắng” rõ nghĩa và phù hợp văn phong trích dẫn Kinh Thánh.
- source_word: τοῦ οἴκου σου
  choice: vì nhà Ngài
  rationale: Giữ hình ảnh “nhà” của lời trích Thi Thiên thay vì giải nghĩa thành “đền thờ”; “vì” diễn đạt đối tượng mà lòng sốt sắng hướng đến.
- source_word: καταφάγεταί με
  choice: sẽ thiêu đốt con
  rationale: Giữ rõ thì tương lai của bản Hy Lạp trong Giăng. Trong thành ngữ tiếng Việt, “thiêu đốt” truyền đạt sức mạnh lấn át, tiêu hao của lòng sốt sắng mà không dùng cách nói thô cứng “ăn nuốt”.
theological_decisions:
- issue: Thì của động từ trong lời trích Thi Thiên áp dụng cho Chúa Giê-su
  choice: 'Giữ nghĩa tương lai: “sẽ thiêu đốt con”'
  alternative: “đã thiêu đốt con” hoặc “thiêu đốt con” theo cách đọc của một số truyền thống văn bản Thi Thiên 69:9
  rationale: SBLGNT tại Giăng 2:17 đọc καταφάγεταί, là dạng tương lai. Bản dịch theo chính cách diễn đạt của Giăng, không hòa đồng với cách đọc quá khứ ở truyền thống khác.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Lời trích dùng “Ngài/con” để thể hiện người nói hướng về Đức Chúa Trời; giữ “nhà” nhằm bảo toàn liên hệ với Thi Thiên 69:9.
