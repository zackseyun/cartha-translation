  yaml_path: translation/nt/john/002/002.yaml
  text: Jesus also was invited to the wedding[a], along with his disciples.
translation:
  language: vi
  text: Giê-su và các môn đệ của Người cũng được mời đến dự đám cưới[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc, theo lối trang trọng hơn: “Giê-su cũng được mời, cùng với các môn đệ của Người, đến dự đám cưới.”'
    reason: Giữ lại lựa chọn diễn đạt thay thế về trật tự câu của bản kiểm toán tiếng Anh, không thay đổi ý nghĩa.
lexical_decisions:
- source_word: ἐκλήθη
  choice: được mời
  rationale: Trong bối cảnh tham dự một sự kiện xã hội, thể bị động của καλέω tự nhiên có nghĩa là “được mời”, không chỉ là “được gọi”.
- source_word: δὲ καὶ
  choice: cũng
  rationale: Cụm liên kết nhẹ này bổ sung Đức Chúa Jêsus và các môn đồ Ngài vào số những người hiện diện đã được nhắc đến ở câu trước; “cũng” diễn đạt tự nhiên quan hệ ấy trong tiếng Việt.
- source_word: ὁ Ἰησοῦς
  choice: Đức Chúa Jêsus
  rationale: Dùng dạng tên gọi Kinh Thánh quen thuộc và trang trọng trong tiếng Việt.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: các môn đồ Ngài
  rationale: “Môn đồ” giữ được ý nghĩa người học theo và căn tính của nhóm gắn bó với Jêsus; “Ngài” phù hợp với văn phong Kinh Thánh trang trọng.
- source_word: εἰς τὸν γάμον
  choice: đến dự lễ cưới
  rationale: Trong ngữ cảnh này γάμος chỉ lễ cưới; thêm “dự” là cách diễn đạt tiếng Việt tự nhiên khi đi với “được mời”, không thêm ý về yến tiệc ngoài nguyên văn.
