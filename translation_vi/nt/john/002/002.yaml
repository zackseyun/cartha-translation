review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng ý bị động của ἐκλήθη (“được mời”), ý bổ sung của δὲ καὶ (“cũng”), và việc cả Giê-su lẫn các môn đệ đều được mời đến sự kiện cưới hỏi. Tuy nhiên, “Đức Chúa” thêm một tước hiệu không có trong bản Hy Lạp, nơi chỉ có tên ὁ Ἰησοῦς.
  naturalness: Cấu trúc câu nhìn chung tự nhiên. “Đám cưới” là cách nói hiện đại, bao quát và tự nhiên hơn “lễ cưới” trong ngữ cảnh được mời đến tham dự một sự kiện.
  terminology: Dùng “Giê-su” theo chính tả tiếng Việt hiện đại và “các môn đệ của Người” là trang trọng, phổ thông, đồng thời tránh lối gọi “Đức Chúa Jêsus” mang dấu ấn truyền thống/giáo phái cụ thể. Không nên thêm tước hiệu “Đức Chúa” khi nguyên văn không có.
  issues:
  - severity: medium
    issue: “Đức Chúa Jêsus” thêm tước hiệu “Đức Chúa”
    rationale: ὁ Ἰησοῦς chỉ nêu “Giê-su”; bản dịch không nên thêm danh xưng thần học không hiện diện trong câu nguồn.
  - severity: low
    issue: Chính tả tên “Jêsus” và cách gọi “môn đồ Ngài” không tối ưu cho tiếng Việt chuẩn hiện đại
    rationale: “Giê-su” và “các môn đệ của Người” phù hợp hơn với biến thể tiếng Việt hiện đại, vẫn giữ sắc thái trang trọng.
  - severity: low
    issue: Thiếu neo chú thích tương ứng với chú thích kiểm toán tiếng Anh
    rationale: Bản sửa giữ chú thích về trật tự diễn đạt thay thế và đặt neo [a] trong câu.
