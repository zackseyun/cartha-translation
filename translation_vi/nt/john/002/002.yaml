translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Trật tự câu được điều chỉnh tự nhiên nhưng vẫn giữ việc cả Jêsus lẫn các môn đồ đều là đối tượng của động từ bị động “được mời”.
