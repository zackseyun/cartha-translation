  source_fidelity: Bản dịch truyền đạt đúng hành động được nhắc đến, tính khai mở của ἀρχὴ τῶν σημείων, địa điểm Ca-na, sự bày tỏ vinh quang và lòng tin của các môn đồ. Tuy nhiên, αὐτοῦ trong “các môn đồ của Ngài” không nên chỉ để suy ra từ ngữ cảnh; bản sửa phục hồi rõ quan hệ này. Cụm “vinh quang của Ngài” cũng giữ nhất quán tham chiếu sở hữu của αὐτοῦ.
  naturalness: “Là khởi đầu các dấu lạ” có thể hiểu được, nhưng cần ngắt câu rõ hơn để không khiến cụm này lỏng lẻo sau địa điểm. Dấu gạch ngang tạo cấu trúc đồng vị tự nhiên trong văn phong trang trọng hiện đại. “Vinh quang của Ngài” phù hợp hơn với hệ đại từ tôn kính đã chọn.
  terminology: Giữ “dấu lạ” cho σημεῖα, “vinh quang” cho δόξα, và “tin vào Ngài” cho πιστεύω εἰς αὐτόν. Giữ tên riêng và lối viết “Đức Giê-su”, “Ca-na”, “Ga-li-lê” nhất quán. Chú thích được điều chỉnh để nêu đúng cách đọc thay thế “dấu lạ đầu tiên” mà không đồng nhất đại từ “điều này” với danh từ “dấu lạ” trong bản chính.
