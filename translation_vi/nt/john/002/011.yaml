language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ταύτην ⸀ἐποίησεν ἀρχὴν τῶν σημείων ὁ Ἰησοῦς ἐν Κανὰ τῆς Γαλιλαίας καὶ ἐφανέρωσεν τὴν δόξαν αὐτοῦ, καὶ ἐπίστευσαν εἰς αὐτὸν οἱ μαθηταὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/011.yaml
  text: Jesus did this[a], the beginning of his signs, in Cana of Galilee, and revealed his glory, and his disciples believed in him.
translation:
  language: vi
  text: Đức Giê-su đã làm điều này[a]—khởi đầu các dấu lạ của Ngài—tại Ca-na thuộc miền Ga-li-lê, và Ngài bày tỏ vinh quang của Ngài; các môn đồ của Ngài đã tin vào Ngài.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: Đây là dấu lạ đầu tiên Đức Giê-su làm.'
    reason: Bảo lưu cách hiểu ἀρχὴν τῶν σημείων theo nghĩa “dấu lạ đầu tiên”, thay vì “khởi đầu các dấu lạ”.
lexical_decisions:
- source_word: ταύτην ἐποίησεν
  choice: đã làm điều này
  rationale: Đại từ chỉ định ταύτην quy chiếu đến việc vừa được thuật lại, còn ποιέω có nghĩa rộng là “làm”. Cách dịch này không tự ý thêm “phép lạ” hay “dấu lạ” vào vị trí mà tiếng Hy Lạp chỉ dùng đại từ.
- source_word: ἀρχὴν τῶν σημείων
  choice: là khởi đầu các dấu lạ của Ngài
  rationale: Giữ ý nghĩa trực tiếp của ἀρχή là “khởi đầu”, đồng thời thể hiện đây là hành động mở đầu một chuỗi dấu lạ do Đức Giê-su thực hiện. “Của Ngài” được làm rõ từ ngữ cảnh.
- source_word: σημείων
  choice: các dấu lạ
  rationale: “Dấu lạ” là cách nói tự nhiên và quen thuộc trong tiếng Việt, đồng thời vẫn cho thấy hành động mang ý nghĩa chỉ dấu, thay vì chỉ nhấn mạnh quyền năng như “phép lạ”.
- source_word: ἐν Κανὰ τῆς Γαλιλαίας
  choice: tại Ca-na thuộc miền Ga-li-lê
  rationale: Diễn đạt tự nhiên quan hệ địa lý của cụm sở hữu cách τῆς Γαλιλαίας và giúp phân biệt địa danh Ca-na này.
- source_word: ἐφανέρωσεν
  choice: bày tỏ
  rationale: φανερόω có nghĩa làm cho điều gì được thấy hoặc được biết. “Bày tỏ” vừa tự nhiên vừa giữ sắc thái mặc khải trong ngữ cảnh.
- source_word: τὴν δόξαν αὐτοῦ
  choice: vinh quang mình
  rationale: “Vinh quang” giữ thuật ngữ thần học quan trọng δόξα; “mình” quy chiếu tự nhiên về chủ thể Đức Giê-su trong tiếng Việt.
- source_word: ἐπίστευσαν εἰς αὐτόν
  choice: tin vào Ngài
  rationale: Cụm πιστεύω với εἰς diễn tả lòng tin hướng đến chính Đức Giê-su. “Tin vào Ngài” giữ rõ sắc thái tín thác hơn cách nói chỉ là “tin Ngài”.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: các môn đồ
  rationale: “Các môn đồ” là cách dịch rõ ràng, tự nhiên cho nhóm người theo học Đức Giê-su; quan hệ với Ngài đã rõ trong câu.
theological_decisions:
- issue: Thuật ngữ σημεῖον trong sách Giăng
  choice: Dịch là “dấu lạ” thay vì “phép lạ”.
  alternative: phép lạ; dấu chỉ
  rationale: Trong sách Giăng, những việc này không chỉ là biểu hiện quyền năng mà còn chỉ đến căn tính và vinh quang của Đức Giê-su. “Dấu lạ” giữ được cả tính phi thường lẫn chức năng chỉ dấu mà vẫn tự nhiên với độc giả tiếng Việt.
- issue: Sắc thái của ἀρχὴν τῶν σημείων
  choice: Dịch là “khởi đầu các dấu lạ của Ngài”.
  alternative: dấu lạ đầu tiên của Ngài
  rationale: ἀρχή trực tiếp có nghĩa là “khởi đầu”, nên bản chính giữ cách diễn đạt này và không làm mất sắc thái khai mở một chuỗi dấu lạ. Cách hiểu “dấu lạ đầu tiên” vẫn hợp lý và được bảo lưu trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Giê-su” và đại từ tôn kính “Ngài”; giữ các thuật ngữ quan trọng “dấu lạ”, “vinh quang” và “tin vào” một cách nhất quán.
