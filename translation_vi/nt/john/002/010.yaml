revisions:
- from: 'Người nói với chú rể: “Ai cũng dọn rượu ngon ra trước, rồi khi khách đã say[a] thì mới dọn rượu kém hơn. Còn anh lại giữ rượu ngon cho đến bây giờ!”'
  to: 'Viên quản tiệc nói với chú rể: “Ai cũng dọn rượu ngon ra trước, rồi khi khách đã say[a] thì mới dọn rượu kém hơn. Còn anh lại để dành rượu ngon cho đến bây giờ!”'
  rationale: Sửa chủ ngữ để phản ánh chính xác mạch ngữ cảnh và tránh hàm ý không có trong bản văn. Thay «giữ» bằng «để dành» để tiếng Việt tự nhiên hơn mà vẫn bảo toàn nghĩa hoàn thành của τετήρηκας. Chú thích được giữ nguyên và neo đúng tại «đã say».
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T05:36:46Z'
review_pass:
  verdict: revise
  source_fidelity: Bản dịch truyền đạt đúng trình tự lập luận, đối lập giữa «rượu ngon» và «rượu kém hơn», cùng nghĩa thẳng của μεθυσθῶσιν là «đã say». Việc nêu rõ «chú rể» cho αὐτῷ phù hợp ngữ cảnh ngay trước đó. Tuy nhiên, chủ ngữ của λέγει trong ngữ cảnh là viên quản tiệc, không nên để «Người» viết hoa và mơ hồ, vốn có thể bị hiểu là Chúa Giê-su.
  naturalness: «Ai cũng dọn rượu ngon ra trước» và «khi khách đã say» là tiếng Việt hiện đại, tự nhiên. «Viên quản tiệc nói với chú rể» làm rõ người phát ngôn. «Để dành rượu ngon cho đến bây giờ» diễn đạt τετήρηκας tự nhiên hơn «giữ rượu ngon», đồng thời vẫn giữ ý rượu ngon đã được giữ lại đến thời điểm hiện tại.
  terminology: «Rượu ngon», «rượu kém hơn», «chú rể» và «viên quản tiệc» phù hợp bối cảnh tiệc cưới và không thêm diễn giải giáo lý. Chú thích giữ cách hiểu chính của động từ Hy Lạp mà không làm nhẹ nghĩa say.
  issues:
  - severity: medium
    issue: «Người nói với chú rể» mơ hồ về chủ ngữ và viết hoa không có cơ sở từ câu Hy Lạp.
    rationale: λέγει αὐτῷ tiếp tục hành động của viên quản tiệc trong ngữ cảnh (2:9–10). «Người» viết hoa có thể dẫn độc giả hiểu nhầm chủ ngữ là Chúa Giê-su; cần nêu rõ «Viên quản tiệc».
  - severity: low
    issue: «giữ rượu ngon» kém tự nhiên trong ngữ cảnh phục vụ tiệc.
    rationale: τετήρηκας có thể dịch sát là «đã giữ», nhưng «để dành» là cách nói Việt ngữ tự nhiên cho việc giữ lại rượu ngon để dùng vào lúc này, không thay đổi nghĩa.
  revised_text: 'Viên quản tiệc nói với chú rể: “Ai cũng dọn rượu ngon ra trước, rồi khi khách đã say[a] thì mới dọn rượu kém hơn. Còn anh lại để dành rượu ngon cho đến bây giờ!”'
