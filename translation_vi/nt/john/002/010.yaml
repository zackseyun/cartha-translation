id: JHN.2.10
reference: John 2:10
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτῷ· Πᾶς ἄνθρωπος πρῶτον τὸν καλὸν οἶνον τίθησιν, καὶ ὅταν ⸀μεθυσθῶσιν τὸν ἐλάσσω· σὺ τετήρηκας τὸν καλὸν οἶνον ἕως ἄρτι.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/010.yaml
  text: And he said to him[a], “Everyone sets out the good wine first, and when they have become drunk, then the inferior[b]. But you have kept the good wine until now.”
translation:
  language: vi
  text: 'Viên quản tiệc nói với chú rể: “Ai cũng dọn rượu ngon ra trước, rồi khi khách đã say[a] thì mới dọn rượu kém hơn. Còn anh lại để dành rượu ngon cho đến bây giờ!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đã uống thỏa thuê.” Động từ Hy Lạp thường có nghĩa là “trở nên say.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει αὐτῷ
  choice: Người nói với chú rể
  rationale: Dùng thì quá khứ theo lối kể chuyện tự nhiên của tiếng Việt; đại từ αὐτῷ quy chiếu về chú rể ở câu trước, nên nêu rõ đối tượng để tránh đại từ mơ hồ.
- source_word: Πᾶς ἄνθρωπος
  choice: Ai cũng
  rationale: Diễn đạt tự nhiên cấu trúc số ít mang nghĩa khái quát, chỉ người ta nói chung chứ không riêng nam giới.
- source_word: τὸν καλὸν οἶνον
  choice: rượu ngon
  rationale: καλός ở đây nói về phẩm chất; “rượu ngon” trực tiếp và tự nhiên, đồng thời giữ sự đối lập với loại kém hơn.
- source_word: τίθησιν
  choice: dọn ... ra
  rationale: Trong bối cảnh tiệc cưới, cách nói này diễn đạt tự nhiên hành động đem rượu ra đãi khách mà vẫn gần với nghĩa “đặt ra” của τίθημι.
- source_word: ὅταν μεθυσθῶσιν
  choice: khi khách đã say
  rationale: Giữ nghĩa thông thường, thẳng thắn của μεθύω là trở nên say; thêm “khách” làm rõ chủ thể hàm ẩn trong ngữ cảnh yến tiệc.
- source_word: τὸν ἐλάσσω
  choice: rượu kém hơn
  rationale: Bổ sung danh từ “rượu” vốn được lược trong tiếng Hy Lạp; “kém hơn” giữ đúng sắc thái so sánh về phẩm chất.
- source_word: τετήρηκας
  choice: anh lại giữ
  rationale: “Giữ” phản ánh trực tiếp động từ và kết quả còn kéo dài đến thời điểm phát ngôn; “lại” làm nổi bật sự tương phản với thông lệ vừa nêu.
- source_word: ἕως ἄρτι
  choice: cho đến bây giờ
  rationale: Cách diễn đạt hiện đại, chính xác về thời điểm hiện tại trong câu chuyện.
theological_decisions:
- issue: Cách dịch μεθυσθῶσιν trong bối cảnh phép lạ liên quan đến rượu
  choice: khi khách đã say
  alternative: khi khách đã uống thỏa thuê; khi khách đã uống nhiều
  rationale: Động từ Hy Lạp thường có nghĩa là trở nên say. Bản dịch không làm nhẹ đi vì lý do giáo lý hay đạo đức; đây là lời nhận xét về tập quán của nhân vật, không nhất thiết là lời tán thành sự say rượu.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Ai cũng” cho nghĩa khái quát; “anh” phù hợp lời viên quản tiệc nói trực tiếp với chú rể. Dấu chấm than truyền tải sắc thái ngạc nhiên, nhấn mạnh của sự tương phản.
