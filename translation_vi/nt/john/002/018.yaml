source:
  edition: SBLGNT
  text: ἀπεκρίθησαν οὖν οἱ Ἰουδαῖοι καὶ εἶπαν αὐτῷ· Τί σημεῖον δεικνύεις ἡμῖν, ὅτι ταῦτα ποιεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/john/002/018.yaml
  text: So the Jews answered and said to him[a], “What sign do you show us, that you do these things?”
translation:
  language: vi
  text: 'Vậy, những người Do Thái đáp lời Ngài: “Ông làm những việc này thì cho chúng tôi xem dấu lạ gì?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθησαν οὖν
  choice: Vậy, ... đáp lời
  rationale: “Vậy” giữ mạch tiếp nối và hàm ý suy luận của οὖν; “đáp lời” diễn đạt tự nhiên chức năng tường thuật của ἀπεκρίθησαν.
- source_word: οἱ Ἰουδαῖοι
  choice: những người Do Thái
  rationale: Giữ nghĩa trực tiếp của cụm từ Hy Lạp, không tự ý thu hẹp thành giới lãnh đạo; chú thích nêu các khả năng theo ngữ cảnh trong sách Giăng.
- source_word: εἶπαν αὐτῷ
  choice: Ngài
  rationale: Trong tiếng Việt, “đáp lời Ngài” đã tự nhiên bao hàm việc họ nói với Ngài, tránh lặp nặng nề “đáp và nói với Ngài” mà vẫn giữ nội dung.
- source_word: Τί σημεῖον
  choice: dấu lạ gì
  rationale: '“Dấu lạ” giữ thuật ngữ quan trọng σημεῖον trong sách Giăng: một việc có ý nghĩa xác nhận và chỉ đến thực tại vượt quá chính nó, chứ không chỉ đơn thuần là phép lạ.'
- source_word: δεικνύεις ἡμῖν
  choice: ông cho chúng tôi thấy
  rationale: Chuyển trực tiếp động từ hiện tại δεικνύεις và tân ngữ gián tiếp ἡμῖν; đại từ “ông” phù hợp với lời chất vấn trực tiếp trong ngữ cảnh.
- source_word: ὅτι ταῦτα ποιεῖς
  choice: mà lại làm những việc này
  rationale: Cấu trúc “mà lại” diễn đạt tự nhiên lời chất vấn về cơ sở cho hành động của Chúa Giê-su, đồng thời không thêm rõ ràng các ý như “có quyền” hoặc “để chứng minh” vốn không được nói thành lời trong bản Hy Lạp.
theological_decisions:
- issue: Phạm vi chỉ định của οἱ Ἰουδαῖοι trong sách Giăng
  choice: Giữ “những người Do Thái” trong chính văn
  alternative: “các nhà lãnh đạo Do Thái” hoặc “những người Giu-đê”
  rationale: Cụm Hy Lạp có thể chỉ một nhóm đại diện, đặc biệt là giới chức tại Giu-đê, nhưng câu này không tự nó nêu rõ sự giới hạn ấy. Chính văn vì thế giữ cách dịch trực tiếp, còn chú thích bảo tồn khả năng hiểu hẹp hơn theo ngữ cảnh.
- issue: Sắc thái của ὅτι trong lời chất vấn
  choice: “mà lại làm những việc này”
  alternative: “vì ông làm những việc này” hoặc “để chứng tỏ ông có quyền làm những việc này”
  rationale: Cách dịch được chọn giữ mối liên hệ giữa yêu cầu về dấu lạ và hành động trong đền thờ, nhưng tránh giải quyết dứt khoát ὅτι thành quan hệ nhân quả thuần túy hoặc thêm ý niệm “quyền” không xuất hiện minh nhiên.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Ngài” được dùng trong lời trần thuật dành cho Chúa Giê-su, còn “ông” trong lời nói trực tiếp phản ánh cách những người chất vấn xưng hô với Ngài. Câu hỏi giữ sắc thái thách thức mà không thêm lời giải thích thần học vào chính văn.
