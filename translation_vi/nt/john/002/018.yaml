  to: 'Vậy, những người Do Thái đáp lời Ngài: “Ông làm những việc này thì cho chúng tôi xem dấu lạ gì?”'
  rationale: Đổi phần cuối câu để loại bỏ sắc thái thêm vào của “mà lại”, đồng thời dùng trật tự và cấu trúc câu tự nhiên trong tiếng Việt nhằm giữ quan hệ chất vấn giữa hành động đang diễn ra và dấu lạ được đòi hỏi. Chú thích và các thuật ngữ chủ chốt được giữ nguyên.
