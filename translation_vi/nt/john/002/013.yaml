  text: Καὶ ἐγγὺς ἦν τὸ πάσχα τῶν Ἰουδαίων, καὶ ἀνέβη εἰς Ἱεροσόλυμα ὁ Ἰησοῦς.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/013.yaml
  text: The Passover of the Jews was near[a], and Jesus went up to Jerusalem.
translation:
  language: vi
  text: Lễ Vượt Qua của người Do Thái đã gần đến[a], và Giê-su đi lên Giê-ru-sa-lem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Lễ Vượt Qua của người Giu-đê.” Trong sách Giăng, Ἰουδαῖοι ở một số ngữ cảnh có thể mang nghĩa “người Giu-đê” thay vì “người Do Thái”; nhưng ở đây, cách hiểu tự nhiên nhất là từ này xác định đó là lễ của người Do Thái.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγγὺς
  choice: đã gần đến
  rationale: Trong ngữ cảnh này, từ này chỉ sự gần kề về thời gian; cách diễn đạt tự nhiên trong tiếng Việt là “đã gần đến”.
- source_word: πάσχα
  choice: Lễ Vượt Qua
  rationale: Tên gọi thông dụng và rõ nghĩa của lễ Do Thái được nói đến ở đây.
- source_word: τῶν Ἰουδαίων
  choice: của người Do Thái
  rationale: Cụm từ bổ nghĩa cho Lễ Vượt Qua và tự nhiên nhất là xác định đây là lễ của dân Do Thái; nghĩa khả dĩ “người Giu-đê” được giữ trong chú thích.
- source_word: ἀνέβη
  choice: đi lên
  rationale: Giữ sắc thái địa lý và ngôn ngữ hành hương quen dùng khi nói về việc đến Giê-ru-sa-lem.
- source_word: Ἱεροσόλυμα
  choice: Giê-ru-sa-lem
  rationale: Dạng phiên âm quen thuộc của địa danh Jerusalem trong tiếng Việt.
- source_word: Καὶ
  choice: và
  rationale: Liên từ đầu câu có chức năng tiếp nối trình thuật; trong câu tiếng Việt này không cần thêm một trạng từ thời gian không có trong nguyên văn, còn liên từ thứ hai được thể hiện bằng “và”.
theological_decisions:
- issue: Cách dịch Ἰουδαῖοι trong sách Giăng
  choice: người Do Thái
  alternative: người Giu-đê
  rationale: Ở đây từ này nằm trong tên gọi của Lễ Vượt Qua, nên nghĩa chỉ dân Do Thái nói chung là tự nhiên nhất. Chú thích vẫn bảo lưu khả năng từ này có thể mang nghĩa địa lý “người Giu-đê” trong một số ngữ cảnh của sách Giăng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ cách nói “đi lên Giê-ru-sa-lem” để phản ánh sát động từ Hy Lạp và lối nói hành hương. Dùng “Đức Chúa Jêsus” theo lối gọi kính trọng quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
