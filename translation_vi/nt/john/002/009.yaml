  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὡς δὲ ἐγεύσατο ὁ ἀρχιτρίκλινος τὸ ὕδωρ οἶνον γεγενημένον, καὶ οὐκ ᾔδει πόθεν ἐστίν, οἱ δὲ διάκονοι ᾔδεισαν οἱ ἠντληκότες τὸ ὕδωρ, φωνεῖ τὸν νυμφίον ὁ ἀρχιτρίκλινος
base_translation:
  language: en
  yaml_path: translation/nt/john/002/009.yaml
  text: When the master of the feast tasted the water that had become wine[a], and did not know where it came from (though the servants who had drawn the water knew)[c][b], the master of the feast calls the bridegroom
translation:
  language: vi
  text: Khi người quản tiệc nếm nước đã hóa thành rượu, ông không biết rượu ấy từ đâu đến—nhưng những người phục vụ đã múc nước thì biết—người quản tiệc gọi chú rể đến[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn dùng thì hiện tại: “gọi”; đây là lối dùng thì hiện tại để thuật một sự việc trong quá khứ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρχιτρίκλινος
  choice: người quản tiệc
  rationale: Chỉ người trông coi và điều hành bữa tiệc; cách dịch này tự nhiên, rõ vai trò và không thu hẹp nghĩa thành người phục vụ bàn.
- source_word: ἐγεύσατο
  choice: nếm
  rationale: Diễn đạt trực tiếp hành động nếm thử trong ngữ cảnh.
- source_word: τὸ ὕδωρ οἶνον γεγενημένον
  choice: nước đã hóa thành rượu
  rationale: Thể hiện sự biến đổi đã hoàn tất và kết quả còn hiện hữu của phân từ hoàn thành γεγενημένον.
- source_word: οὐκ ᾔδει πόθεν ἐστίν
  choice: ông không biết rượu ấy từ đâu đến
  rationale: Diễn đạt tự nhiên câu hỏi về nguồn gốc; thêm chủ thể được hiểu là rượu để tiếng Việt không mơ hồ về vật được nói đến.
- source_word: διάκονοι
  choice: những người phục vụ
  rationale: Trong bối cảnh tiệc cưới, từ này chỉ những người làm công việc phục vụ, không phải chức vụ chấp sự trong hội thánh.
- source_word: ἠντληκότες
  choice: đã múc
  rationale: Động từ nói đến việc múc nước; tiếng Việt không cần lặp tân ngữ trong mệnh đề này.
- source_word: φωνεῖ
  choice: gọi ... đến
  rationale: Giữ sắc thái hiện tại lịch sử bằng thì không đánh dấu của tiếng Việt, đồng thời diễn đạt rõ hành động gọi người đến.
- source_word: νυμφίον
  choice: chú rể
  rationale: Tương đương hiện đại, tự nhiên trong bối cảnh đám cưới.
- source_word: ὡς δὲ
  choice: Khi
  rationale: Mở đầu sự việc kế tiếp một cách tự nhiên; không thêm từ chỉ thời gian như 'bấy giờ' vốn không có từ tương ứng trực tiếp trong nguồn.
theological_decisions:
- issue: Lời thuật về phép lạ
  choice: Dịch thẳng là “nước đã hóa thành rượu”.
  alternative: “nước biến thành rượu” hoặc cách diễn đạt làm nhẹ đi thành vẻ bề ngoài hay nhận thức
  rationale: Tiếng Hy Lạp xác nhận một sự thay đổi trạng thái đã hoàn tất; bản dịch không thêm diễn giải tín lý nhưng cũng không làm suy yếu lời thuật.
- issue: Thì hiện tại lịch sử trong φωνεῖ
  choice: Dùng “gọi” theo dạng động từ tiếng Việt không đánh dấu thì.
  alternative: Dùng “đã gọi” để đồng nhất rõ ràng với mạch kể quá khứ
  rationale: Tiếng Việt cho phép ngữ cảnh xác định thời gian, nhờ đó vừa tự nhiên vừa không xóa sắc thái sống động của hiện tại lịch sử.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “người quản tiệc” thay cho thuật ngữ cổ hoặc cách gọi có thể gợi sai vai trò; dấu gạch ngang làm rõ lời xen giải thích mà vẫn giữ trật tự lập luận của câu Hy Lạp.
