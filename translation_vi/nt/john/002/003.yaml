  text: καὶ ὑστερήσαντος οἴνου λέγει ἡ μήτηρ τοῦ Ἰησοῦ πρὸς αὐτόν· Οἶνον οὐκ ἔχουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/003.yaml
  text: And when the wine ran out[a], the mother of Jesus says to him[b], “They have no wine.”
translation:
  language: vi
  text: 'Khi rượu đã hết[a], mẹ của Giê-su nói với người[b]: “Họ không còn rượu nữa.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay sát chữ hơn: “khi thiếu rượu.”'
    reason: lexical_alternative
  - marker: b
    text: 'Tiếng Hy Lạp dùng thì hiện tại lịch sử: “nói”. Một số bản dịch chuyển thành “đã nói”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑστερήσαντος οἴνου
  choice: Khi rượu đã hết
  rationale: Cấu trúc sở hữu cách tuyệt đối với phân từ bất định quá khứ nêu hoàn cảnh xảy ra trước động từ chính. Cách diễn đạt này tự nhiên trong tiếng Việt và truyền đạt rõ tình trạng rượu không còn; chú thích giữ lại sắc thái sát chữ là ‘bị thiếu’.
- source_word: λέγει
  choice: nói
  rationale: Thì hiện tại lịch sử của tiếng Hy Lạp được chuyển bằng ‘nói’, một cách dùng tự nhiên trong lời kể tiếng Việt và giữ được nét sống động của văn phong Giăng.
- source_word: ἡ μήτηρ τοῦ Ἰησοῦ
  choice: mẹ Đức Chúa Jêsus
  rationale: Giữ cách tác giả gọi bà theo mối quan hệ với Đức Chúa Jêsus, thay vì đưa tên riêng không có trong câu.
- source_word: πρὸς αὐτόν
  choice: với Ngài
  rationale: Đi với động từ ‘nói’, cụm này tự nhiên được diễn đạt là ‘nói với Ngài’; đại từ tôn kính phù hợp văn phong Kinh Thánh tiếng Việt.
- source_word: Οἶνον οὐκ ἔχουσιν
  choice: Họ không còn rượu nữa
  rationale: ‘Họ’ giữ nguyên chủ thể số nhiều không được nêu rõ trong nguyên văn; ‘không còn… nữa’ là cách nói tự nhiên trong bối cảnh rượu đã hết.
- source_word: οἶνος
  choice: rượu
  rationale: Đây là nghĩa thông thường của từ Hy Lạp và không có lý do ngữ cảnh để làm yếu hoặc diễn giải khác đi.
theological_decisions:
- issue: Thì hiện tại lịch sử trong lời kể của Giăng
  choice: Giữ dạng hiện tại bằng ‘nói’
  alternative: 'Chuyển thành quá khứ theo mạch kể: ‘đã nói’ hoặc ‘nói rằng’'
  rationale: Tiếng Việt có thể dùng hiện tại lịch sử tự nhiên trong văn kể; lựa chọn này phản ánh kết cấu diễn ngôn Hy Lạp mà không tạo thêm hàm ý thần học.
- issue: Đối tượng được chỉ bằng chủ thể số nhiều hàm ẩn trong ‘οὐκ ἔχουσιν’
  choice: Dùng đại từ không xác định rõ ‘Họ’
  alternative: Nói rõ ‘nhà trai’, ‘chủ tiệc’ hoặc ‘những người dự tiệc’
  rationale: Nguyên văn không xác định nhóm người nào; giữ ‘Họ’ bảo toàn sự mơ hồ thật sự và tránh thêm chi tiết ngoài bản văn.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng lối kể hiện tại để phản ánh nguyên văn; giữ chủ thể ‘Họ’ không xác định. Danh xưng ‘Đức Chúa Jêsus’ và đại từ ‘Ngài’ theo văn phong Kinh Thánh Tin Lành quen thuộc, không nhằm thêm một khẳng định giáo phái.
