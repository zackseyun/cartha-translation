review_pass:
  verdict: revise
  source_fidelity: Cấu trúc thời gian «Khi rượu đã hết» truyền đạt tốt sở hữu cách tuyệt đối ὑστερήσαντος οἴνου; «nói» bảo lưu thì hiện tại lịch sử λέγει; và «Họ không còn rượu nữa» giữ được chủ ngữ số nhiều không được xác định của οὐκ ἔχουσιν. Tuy nhiên, «Đức Chúa Jêsus» thêm danh xưng «Chúa» không hiện diện trong Ἰησοῦ, còn «Ngài» là đại từ tôn kính diễn giải vượt quá cách quy chiếu đơn thuần αὐτόν. Dùng tên riêng Giê-su và «người» bảo toàn sát hơn mức độ đánh dấu của nguyên văn.
  naturalness: Bản sửa vẫn là tiếng Việt chuẩn hiện đại, rõ ràng và trang trọng vừa phải. «Mẹ của Giê-su nói với người» là cách diễn đạt tự nhiên trong văn kể và không buộc một hệ thống danh xưng giáo phái. Câu nói trực tiếp «Họ không còn rượu nữa» tự nhiên trong ngữ cảnh tiệc cưới.
  terminology: Dùng «Giê-su» theo chính tả tiếng Việt hiện đại, thay cho dạng «Jêsus» gắn với truyền thống bản dịch cụ thể. «Rượu» là tương ứng trực tiếp với οἶνος. Chú thích a nên đổi «rượu bị thiếu» thành «thiếu rượu», vì nguyên ngữ mô tả tình trạng thiếu chứ không hàm ý một tác nhân gây ra sự thiếu hụt.
  issues:
  - severity: medium
    issue: Danh xưng «Đức Chúa» trong «mẹ Đức Chúa Jêsus»
    rationale: Nguyên văn chỉ có τοῦ Ἰησοῦ, nghĩa là «của Giê-su». Việc thêm «Chúa» đưa vào một danh xưng không có trong câu nguồn và mang dấu ấn truyền thống/giáo phái; không cần thiết để dịch trung thành.
  - severity: low
    issue: Đại từ «Ngài» cho αὐτόν
    rationale: Đại từ này thể hiện tôn kính mà tiếng Hy Lạp không đánh dấu trong câu. «người» giữ cách quy chiếu trung tính hơn, đồng thời vẫn phù hợp lối văn kể trang trọng.
  - severity: low
    issue: 'Chú thích a: «khi rượu bị thiếu»'
    rationale: «Bị thiếu» gợi một bị động có tác nhân không có trong ὑστερήσαντος. «Khi thiếu rượu» phản ánh sát hơn tình trạng thiếu hụt và tự nhiên hơn.
