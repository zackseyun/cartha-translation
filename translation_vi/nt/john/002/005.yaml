review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch truyền đạt đúng các thành phần chính: mẹ của Đức Giê-su nói với những người phục vụ và truyền họ thực hiện điều Người nói. Tuy nhiên, “Người bảo các anh làm gì” gộp động từ λέγῃ (“nói/bảo ... điều gì”) với nội dung mệnh lệnh “làm gì,” làm hẹp nhẹ cách diễn đạt mở của nguyên văn.'
  naturalness: Câu văn trang trọng, rõ ràng và tự nhiên trong tiếng Việt hiện đại. Cấu trúc “bảo các anh điều gì thì hãy làm điều ấy” vừa tự nhiên vừa phản ánh sát hơn quan hệ giữa “nói với các anh” và “hãy làm.”
  terminology: “Mẹ Người,” “những người phục vụ,” và “Người” phù hợp văn mạch tiệc cưới và tránh nhầm διακόνοις với chức vụ phó tế. Viết hoa “Người” là quy ước kính trọng nhất quán trong bản dịch, không thêm nội dung vào bản văn.
  issues:
  - severity: low
    issue: “bảo các anh làm gì” diễn giải λέγῃ ὑμῖν như một mệnh lệnh có nội dung hành động.
    rationale: Ὅ τι ἂν λέγῃ ὑμῖν ποιήσατε có nghĩa trực tiếp là “Điều gì Người nói với các anh, hãy làm điều ấy.” Bản sửa giữ tính bất định “bất cứ điều gì” và không định trước rằng cách nói của Người phải được cấu tạo như “bảo ... làm gì.”
