base_translation:
  language: en
  yaml_path: translation/nt/john/002/005.yaml
  text: His mother said to the servants[a], “Whatever he tells you, do it.”
translation:
  language: vi
  text: 'Mẹ Người nói với những người phục vụ: “Người bảo các anh điều gì thì hãy làm điều ấy.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μήτηρ αὐτοῦ
  choice: Mẹ Người
  rationale: Diễn đạt tự nhiên cấu trúc sở hữu Hy Lạp, đồng thời giữ cách quy chiếu kính trọng và rõ ràng đến Đức Giê-su trong văn mạch.
- source_word: διακόνοις
  choice: những người phục vụ
  rationale: Trong bối cảnh tiệc cưới, từ này chỉ những người lo việc phục vụ, không phải chức vụ hội thánh về sau; cách dịch này tự nhiên và đúng ngữ cảnh.
- source_word: Ὅ τι ἂν
  choice: làm gì
  rationale: 'Kết hợp với động từ theo sau để diễn đạt tự nhiên ý bất định, rộng mở của cấu trúc ὅ τι ἄν: bất cứ điều gì Người có thể truyền bảo.'
- source_word: λέγῃ ὑμῖν
  choice: Người bảo các anh
  rationale: Thể giả định hiện tại sau ἄν mang ý tương lai bất định; “bảo” phù hợp với lời hướng dẫn cần được thi hành, còn chủ ngữ ngầm được thể hiện bằng “Người” theo văn mạch.
- source_word: ποιήσατε
  choice: hãy làm như vậy
  rationale: Mệnh lệnh aorist số nhiều kêu gọi thi hành dứt khoát; “như vậy” lấy lại nội dung của bất cứ điều gì Người bảo mà không thêm ý mới.
theological_decisions:
- issue: Chủ thể ngầm trong λέγῃ
  choice: Dùng đại từ “Người,” chỉ Đức Giê-su, không thay bằng tên riêng.
  alternative: “Đức Giê-su bảo các anh làm gì thì hãy làm như vậy.”
  rationale: Bản Hy Lạp để chủ ngữ ngầm, còn văn mạch xác định đó là Đức Giê-su. Đại từ giữ được tính cô đọng của nguyên bản và tránh diễn giải quá mức.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Những người phục vụ” phù hợp bối cảnh tiệc cưới; “các anh” là cách xưng gọi tự nhiên với một nhóm người nam hoặc nhóm không xác định trong lời kể, không hàm ý chức vụ tôn giáo.
