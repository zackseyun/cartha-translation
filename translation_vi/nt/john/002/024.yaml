source:
  edition: SBLGNT
  text: αὐτὸς ⸀δὲ Ἰησοῦς οὐκ ἐπίστευεν ⸀αὑτὸν αὐτοῖς διὰ τὸ αὐτὸν γινώσκειν πάντας
base_translation:
  language: en
  yaml_path: translation/nt/john/002/024.yaml
  text: But Jesus himself was not entrusting himself to them[a], because he knew all people,
translation:
  language: vi
  text: Nhưng chính Đức Giê-su không phó thác mình cho họ,[a] vì ngài biết rõ mọi người.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Trong tiếng Hy Lạp, động từ ở đây cũng chính là động từ được dùng trong câu trước: nhiều người “tin” Đức Giê-su, nhưng Đức Giê-su không “phó thác” mình cho họ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτὸς δὲ Ἰησοῦς
  choice: Nhưng chính Đức Giê-su
  rationale: δέ đánh dấu sự tương phản với câu trước, còn αὐτός mang sắc thái nhấn mạnh; “nhưng chính Đức Giê-su” diễn đạt tự nhiên cả hai nét nghĩa.
- source_word: οὐκ ἐπίστευεν
  choice: không phó thác
  rationale: Ở đây πιστεύω đi với đại từ phản thân và bổ ngữ gián tiếp, mang nghĩa giao phó hay phó thác chính mình, chứ không đơn thuần là tin. Dạng chưa hoàn thành gợi một thái độ kéo dài; tiếng Việt không cần đánh dấu riêng bằng hình thái động từ.
- source_word: αὑτὸν αὐτοῖς
  choice: mình cho họ
  rationale: “Mình” diễn đạt đại từ phản thân αὑτόν, còn “cho họ” thể hiện bổ ngữ gián tiếp αὐτοῖς một cách gọn và tự nhiên.
- source_word: διὰ τὸ αὐτὸν γινώσκειν
  choice: vì ngài biết rõ
  rationale: διά với động từ nguyên mẫu có mạo từ nêu nguyên nhân. γινώσκω ở đây chỉ sự hiểu biết sâu sát; “biết rõ” phù hợp ngữ cảnh và nối tự nhiên với câu sau.
- source_word: πάντας
  choice: mọi người
  rationale: Dạng số nhiều giống đực được dùng khái quát về con người; “mọi người” giữ nguyên phạm vi bao quát mà không giới hạn vào nam giới.
theological_decisions:
- issue: Cách chuyển πιστεύω nhất quán giữa câu 23 và 24
  choice: Dịch theo nghĩa ngữ cảnh là “phó thác” ở câu 24 và ghi chú mối liên hệ từ vựng với “tin” ở câu 23.
  alternative: Dùng “tin” ở cả hai câu để giữ nguyên sự lặp từ, hoặc dùng “tin cậy” ở câu 24.
  rationale: Cùng một động từ Hy Lạp tạo nên lối chơi chữ có chủ ý, nhưng “không tin mình cho họ” không tự nhiên và sai nghĩa trong tiếng Việt. “Phó thác” truyền đạt đúng cấu trúc giao phó chính mình, còn chú thích bảo tồn mối liên hệ với câu trước.
- issue: Phạm vi của πάντας
  choice: mọi người
  alternative: tất cả; mọi người nam
  rationale: Bản văn nói khái quát về những người mà Đức Giê-su biết, không cho phép thu hẹp thành một nhóm cụ thể hay chỉ nam giới.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Đức Giê-su” phù hợp lối gọi tôn kính phổ biến trong tiếng Việt; “ngài” tránh lặp tên mà vẫn giữ sắc thái trang trọng. Dấu phẩy được đặt sau ký hiệu chú thích để ký hiệu gắn trực tiếp với cụm từ cần giải thích.
