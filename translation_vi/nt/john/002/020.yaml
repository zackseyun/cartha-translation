id: JHN.2.20
reference: John 2:20
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἶπαν οὖν οἱ Ἰουδαῖοι· Τεσσεράκοντα καὶ ἓξ ἔτεσιν οἰκοδομήθη ὁ ναὸς οὗτος, καὶ σὺ ἐν τρισὶν ἡμέραις ἐγερεῖς αὐτόν;
base_translation:
  language: en
  yaml_path: translation/nt/john/002/020.yaml
  text: So the Jews said[a], “This temple was built in forty-six years[b], and will you raise it up in three days?”
translation:
  language: vi
  text: 'Vì vậy, người Do Thái[a] nói: “Ngôi đền thờ này được xây cất trong bốn mươi sáu năm, thế mà ông sẽ dựng nó lên trong ba ngày sao?”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “người Giu-đê.” Trong sách Giăng, cách gọi “người Do Thái” có thể chỉ những nhóm người khác nhau tùy ngữ cảnh; ở đây, đó là những người đối thoại với Chúa Giê-su tại đền thờ.
    reason: alternative_reading
  - marker: b
    text: Cũng có thể hiểu theo ý những người đang nói là “xây lại nó.” Tuy nhiên, động từ Hy Lạp có nghĩa là “dựng lên” và cũng được dùng về sự sống lại; cách dịch trong chính văn giữ mối liên hệ mà Giăng giải thích ở câu tiếp theo.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Vì vậy
  rationale: Diễn tả quan hệ suy luận hoặc hệ quả với lời Đức Chúa Jêsus vừa nói, đồng thời vẫn tự nhiên trong văn kể tiếng Việt.
- source_word: οἱ Ἰουδαῖοι
  choice: người Do Thái
  rationale: Giữ cách gọi trực tiếp của nguyên văn mà không thu hẹp thành giới lãnh đạo; chú thích nêu khả năng hiểu theo nghĩa người Giu-đê trong ngữ cảnh.
- source_word: Τεσσεράκοντα καὶ ἓξ ἔτεσιν
  choice: trong bốn mươi sáu năm
  rationale: Phản ánh khoảng thời gian dành cho công việc xây dựng, thay vì biến câu thành một mốc thời gian trong quá khứ.
- source_word: οἰκοδομήθη
  choice: đã được xây
  rationale: Chuyển thể bị động aorist bằng một lời tổng thuật tự nhiên, không diễn giải quá mức về tình trạng công trình vẫn tiếp diễn.
- source_word: ὁ ναὸς οὗτος
  choice: Đền thờ này
  rationale: ναός chỉ nơi thánh/đền thờ theo nghĩa hẹp, nhưng “Đền thờ” là cách nói rõ ràng, thông dụng và phù hợp ngữ cảnh.
- source_word: καὶ σὺ
  choice: thế mà ông sẽ
  rationale: “Thế mà” thể hiện sự tương phản và giọng hoài nghi; “ông” phù hợp cách những người đối thoại trực tiếp nói với Đức Chúa Jêsus trong ngữ cảnh tranh luận.
- source_word: ἐν τρισὶν ἡμέραις
  choice: trong ba ngày
  rationale: Giữ thành ngữ thời gian và mối liên hệ bằng lời với phần giải thích về sự sống lại ở câu sau.
- source_word: ἐγερεῖς
  choice: dựng nó dậy
  rationale: Giữ hình ảnh “dựng/đứng dậy” và sự nước đôi giữa việc dựng lại công trình với việc sống lại, thay vì giải nghĩa thẳng là “xây lại”.
- source_word: αὐτόν
  choice: nó
  rationale: Đại từ tự nhiên trong tiếng Việt, quy chiếu về đền thờ.
theological_decisions:
- issue: Nguy cơ hiểu οἱ Ἰουδαῖοι như một sự quy kết cho toàn thể người Do Thái
  choice: Giữ “người Do Thái” trong chính văn và chú thích phạm vi nghĩa theo ngữ cảnh
  alternative: người Giu-đê; các nhà lãnh đạo Do Thái
  rationale: Nguyên văn không nói rõ là giới lãnh đạo, nên không thu hẹp chủ thể; đồng thời chú thích giúp tránh áp dụng cách gọi này một cách vô hạn định cho toàn dân Do Thái.
- issue: Mối liên hệ của ἐγερεῖς với hình ảnh sự sống lại
  choice: Dịch “dựng nó dậy”
  alternative: xây lại nó
  rationale: 'Cách dịch này duy trì sự trớ trêu thần học: những người nghe nghĩ đến công trình vật chất, còn tác giả sẽ nối lời ấy với thân thể và sự sống lại của Đức Chúa Jêsus ở câu kế tiếp.'
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Câu hỏi cuối dùng “thế mà… sao?” để truyền đạt sự kinh ngạc, hoài nghi. “Dựng nó dậy” hơi nổi bật hơn lời nói thông thường nhưng cần thiết để bảo toàn sự nước đôi của nguyên văn.
