revisions:
- from: Ngày thứ ba, có một đám cưới tại Ca-na miền Ga-li-lê,[a] và mẹ Đức Chúa Jêsus có mặt ở đó.
  to: Vào ngày thứ ba, có một đám cưới diễn ra tại Ca-na, thuộc miền Ga-li-lê,[a] và mẹ của Giê-su có mặt ở đó.
  rationale: Sửa duy nhất phần thêm tước hiệu không có trong nguyên văn và chuẩn hóa cách viết tên Giê-su theo tiếng Việt hiện đại. Các yếu tố thời gian, sự kiện, địa điểm và sự hiện diện vẫn được giữ sát nguồn; chú thích từ vựng về γάμος được duy trì và diễn đạt gọn hơn.
