review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng mốc thời gian, sự kiện cưới, địa điểm và sự hiện diện của mẹ Chúa Giê-su. Tuy nhiên, «Đức Chúa Jêsus» thêm danh xưng «Đức Chúa» mà nguyên văn chỉ có Ἰησοῦ (“Giê-su”); đây là sự thêm nghĩa không cần thiết.
  naturalness: Câu nhìn chung tự nhiên. «Vào ngày thứ ba» và «có một đám cưới diễn ra» giữ mạch kể rõ ràng trong tiếng Việt hiện đại. «Ca-na, thuộc miền Ga-li-lê» minh bạch hơn cấu trúc ghép «Ca-na miền Ga-li-lê».
  terminology: Dùng «Giê-su» là cách viết hiện đại, thông dụng và trung tính hơn «Jêsus». Không thêm tước hiệu thần học vào tên riêng khi nguồn không có tước hiệu ấy. «mẹ của Giê-su» phản ánh sát ἡ μήτηρ τοῦ Ἰησοῦ mà vẫn tự nhiên.
  issues:
  - severity: medium
    issue: Thêm danh xưng «Đức Chúa» trước tên Giê-su.
    rationale: Bản Hy Lạp ghi «mẹ của Giê-su», không có κύριος (“Chúa”) hay một danh xưng tương đương. Bản dịch nên không thêm định danh thần học vào câu.
  - severity: low
    issue: Cách viết «Jêsus» không phải chính tả hiện đại phổ biến.
    rationale: «Giê-su» phù hợp hơn với tiếng Việt hiện đại tiêu chuẩn và không ảnh hưởng đến tên riêng hay nghĩa văn bản.
  revised_text: Vào ngày thứ ba, có một đám cưới diễn ra tại Ca-na, thuộc miền Ga-li-lê,[a] và mẹ của Giê-su có mặt ở đó.
  revised_footnotes:
