source:
  edition: SBLGNT
  text: Καὶ τῇ ⸂ἡμέρᾳ τῇ τρίτῃ⸃ γάμος ἐγένετο ἐν Κανὰ τῆς Γαλιλαίας, καὶ ἦν ἡ μήτηρ τοῦ Ἰησοῦ ἐκεῖ·
base_translation:
  language: en
  yaml_path: translation/nt/john/002/001.yaml
  text: And on the third day there was a wedding in Cana of Galilee[b][a], and the mother of Jesus was there.
translation:
  language: vi
  text: Vào ngày thứ ba, có một đám cưới diễn ra tại Ca-na, thuộc miền Ga-li-lê,[a] và mẹ của Giê-su có mặt ở đó.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “tiệc cưới”. Từ Hy Lạp có thể chỉ lễ cưới hoặc cuộc ăn mừng nhân dịp cưới.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: Ngày thứ ba
  rationale: Không dịch riêng bằng “Và” ở đầu câu vì tiếng Việt tự nhiên có thể nối tiếp mạch kể bằng trạng ngữ thời gian; quan hệ tiếp nối vẫn được giữ.
- source_word: τῇ ἡμέρᾳ τῇ τρίτῃ
  choice: Ngày thứ ba
  rationale: Diễn đạt tự nhiên chỉ thời điểm xác định trong chuỗi tường thuật, không thêm ý biểu tượng.
- source_word: γάμος
  choice: một đám cưới
  rationale: “Đám cưới” là cách gọi hiện đại, tự nhiên và đủ rộng để chỉ cả sự kiện cưới lẫn dịp ăn mừng.
- source_word: ἐγένετο
  choice: có
  rationale: Giới thiệu sự kiện một cách giản dị, tương ứng với nghĩa “đã diễn ra/có” trong ngữ cảnh.
- source_word: ἐν Κανὰ τῆς Γαλιλαίας
  choice: tại Ca-na miền Ga-li-lê
  rationale: Giữ địa danh bằng lối phiên âm quen thuộc; “miền Ga-li-lê” diễn đạt tự nhiên quan hệ địa lý của sở hữu cách.
- source_word: ἦν
  choice: có mặt
  rationale: Trong tiếng Việt, “có mặt” diễn đạt tự nhiên việc một người hiện diện tại sự kiện, không làm thay đổi nội dung.
- source_word: ἡ μήτηρ τοῦ Ἰησοῦ
  choice: mẹ Đức Chúa Jêsus
  rationale: Giữ cách định danh bằng quan hệ thân thuộc như nguyên văn, với danh xưng quen thuộc trong văn phong Kinh Thánh tiếng Việt.
- source_word: ἐκεῖ
  choice: ở đó
  rationale: Dịch trực tiếp trạng từ chỉ nơi chốn.
theological_decisions:
- issue: Mốc thời gian “ngày thứ ba”
  choice: Giữ như một thông báo thời gian đơn thuần trong câu dịch.
  alternative: Diễn giải thành một ám chỉ biểu tượng về sự phục sinh.
  rationale: Nguyên văn cho phép độc giả nhận ra các liên hệ rộng hơn, nhưng bản dịch không nên đưa cách giải thích thần học ấy vào câu chữ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu giữ nhịp kể giản dị của nguyên văn; không thêm liên từ đầu câu khi tiếng Việt không cần. Dùng “Ca-na”, “Ga-li-lê” và “Đức Chúa Jêsus” theo lối gọi quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
