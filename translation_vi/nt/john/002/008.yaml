    rationale: Dù tiếng Hy Lạp lược đối tượng, tiếng Việt ở đây tự nhiên và rõ hơn khi dùng “đem đi,” với vật được đem và nơi đến đã rõ từ mệnh lệnh ngay trước đó.
  - severity: low
    issue: Chú thích [b] hiện đặt “mang đi” làm phương án thay thế, nhưng đó là cách diễn đạt tự nhiên hơn cho câu cuối.
    rationale: Khi đổi bản dịch chính thành “Họ liền đem đi,” chú thích cần nêu “đem đến” là phương án thay thế theo khác biệt điểm nhìn.
