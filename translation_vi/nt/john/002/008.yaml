  text: And he said to them[b][a], “Draw some out now and take it to the master of the feast.” So they took it.
translation:
  language: vi
  text: 'Ngài bảo họ: “Bây giờ hãy múc ra và đem đến cho người quản tiệc[a].” Họ liền đem đi[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “người đứng đầu phục vụ” hoặc “người phụ trách bữa tiệc.” Từ Hy Lạp chỉ người chịu trách nhiệm điều hành bữa tiệc.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “Họ bèn đem đến.” Động từ Hy Lạp có thể được diễn đạt là “đem đi” hoặc “đem đến,” tùy theo điểm nhìn.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: bảo
  rationale: Thì hiện tại được dùng theo lối hiện tại lịch sử trong lời kể; “bảo” tự nhiên trong tiếng Việt và phù hợp với việc Ngài truyền cho các đầy tớ làm một việc.
- source_word: Ἀντλήσατε
  choice: hãy múc ra
  rationale: Động từ chỉ hành động lấy chất lỏng ra; “múc ra” diễn đạt rõ động tác trong bối cảnh các chum vừa được đổ đầy nước mà không thêm đối tượng không có trong câu Hy Lạp.
- source_word: νῦν
  choice: bây giờ
  rationale: Giữ nguyên ý nghĩa thời gian và tính tức thời của mệnh lệnh.
- source_word: φέρετε
  choice: đem đến
  rationale: Diễn tả việc chuyển thứ vừa múc tới người quản tiệc; “đem đến” tự nhiên theo hướng chuyển động được nêu trong ngữ cảnh.
- source_word: ἀρχιτρικλίνῳ
  choice: người quản tiệc
  rationale: Thuật ngữ chỉ người phụ trách việc điều hành bữa tiệc; cách dịch này rõ ràng, trang trọng vừa phải và không gán một chức danh hiện đại quá cụ thể.
- source_word: οἱ δὲ ἤνεγκαν
  choice: Họ bèn đem đến
  rationale: δέ là từ nối nhẹ, còn ἤνεγκαν thuật lại việc thi hành mệnh lệnh. “Bèn” thể hiện diễn tiến trực tiếp mà không nhấn mạnh sự tương phản; đối tượng được lược bỏ tự nhiên trong tiếng Việt như trong bản Hy Lạp.
