  to: 'Ngài bảo họ: “Bây giờ hãy múc ra và đem đến cho người quản tiệc[a].” Họ liền đem đi[b].'
  rationale: Chỉ sửa câu thuật lại việc các đầy tớ thi hành mệnh lệnh, từ “Họ bèn đem đến” thành “Họ liền đem đi,” để phản ánh tự nhiên hướng chuyển động từ phía các đầy tớ và tránh một câu tiếng Việt bị cụt. Nghĩa nguyên ngữ—họ đã mang thứ vừa múc đến người quản tiệc—không thay đổi; đối tượng tiếp nhận vẫn được xác định bởi mệnh lệnh liền trước. Chú thích [b] được đảo lại cho nhất quán với bản dịch chính.
  reviewer_model: gpt-5.6-terra
