id: JHN.2.6
reference: John 2:6
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἦσαν δὲ ἐκεῖ ⸂λίθιναι ὑδρίαι⸃ ἓξ ⸂κατὰ τὸν καθαρισμὸν τῶν Ἰουδαίων κείμεναι⸃, χωροῦσαι ἀνὰ μετρητὰς δύο ἢ τρεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/006.yaml
  text: There were six stone water jars standing there[a], in accordance with the Jewish rites of purification[b], each holding two or three measures.
translation:
  language: vi
  text: Tại đó có sáu chum nước bằng đá, được đặt để dùng cho nghi thức thanh tẩy của người Do Thái,[a] mỗi chum chứa được hai hoặc ba đơn vị đo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “theo tục thanh tẩy của người Do Thái”; cụm từ này chỉ các thực hành làm sạch theo nghi thức.'
    reason: lexical_alternative
  - marker: b
    text: “Đơn vị đo” ở đây là metretēs trong tiếng Hy Lạp, một đơn vị đo chất lỏng cổ, tương đương khoảng 35–40 lít. Vì vậy, mỗi chum có sức chứa khoảng 70–120 lít.
    reason: cultural_note
lexical_decisions:
- source_word: ἦσαν δὲ ἐκεῖ
  choice: Tại đó có
  rationale: Diễn đạt tự nhiên sự hiện diện tại một địa điểm; δέ chỉ là từ nối nhẹ nên không cần thêm một trạng từ thời gian như “bấy giờ”.
- source_word: λίθιναι ὑδρίαι
  choice: chum đựng nước bằng đá
  rationale: Giữ cả công dụng của ὑδρίαι là vật chứa nước và chất liệu λίθιναι là đá, bằng cách diễn đạt tự nhiên trong tiếng Việt hiện đại.
- source_word: ἓξ
  choice: sáu
  rationale: Chuyển dịch trực tiếp số từ.
- source_word: κατὰ τὸν καθαρισμὸν τῶν Ἰουδαίων
  choice: để dùng cho việc thanh tẩy theo tục lệ của người Do Thái
  rationale: κατά trong ngữ cảnh này có thể chỉ sự phù hợp với tục lệ hoặc công dụng; cách dịch nêu công dụng nghi lễ mà vẫn giữ yếu tố tập tục. καθαρισμός được dịch là “thanh tẩy” để thể hiện việc làm sạch theo nghi thức.
- source_word: κείμεναι
  choice: được đặt sẵn
  rationale: κεῖμαι ở đây chỉ các chum ở trong vị trí đã được đặt; “được đặt sẵn” tự nhiên hơn cách dịch máy móc là “nằm” đối với chum.
- source_word: χωροῦσαι
  choice: mỗi chum chứa được
  rationale: Động từ nói đến sức chứa; “mỗi chum” làm rõ ý phân phối của ἀνά.
- source_word: ἀνὰ μετρητὰς δύο ἢ τρεῖς
  choice: hai hoặc ba đơn vị đo
  rationale: Giữ đơn vị cổ ở mức khái quát trong câu chính, tránh áp một con số hiện đại quá chính xác; chú thích cung cấp tên Hy Lạp và dung lượng ước tính.
theological_decisions:
- issue: Ý nghĩa của τῶν Ἰουδαίων trong lời kể của Giăng
  choice: của người Do Thái
  alternative: của người Giu-đê
  rationale: Trong câu này, cụm từ chỉ tục thanh tẩy mang tính tôn giáo-văn hóa, không chủ yếu nói đến nguồn gốc địa lý; “người Do Thái” truyền đạt đúng trọng tâm và không tạo thêm sắc thái đối kháng.
- issue: Quan hệ của κατὰ với các chum đá
  choice: để dùng cho việc thanh tẩy theo tục lệ
  alternative: theo tục thanh tẩy
  rationale: Cụm từ có thể nhấn mạnh sự phù hợp với tục lệ hoặc mục đích sử dụng. Bản dịch chính diễn đạt mục đích phù hợp với ngữ cảnh, còn chú thích bảo lưu khả năng dịch gần hình thức hơn.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “chum” thay vì từ cổ hoặc quá chuyên biệt; dùng “thanh tẩy” để giữ sắc thái nghi lễ. Dấu chú thích được đặt ngay sau nội dung mà từng chú thích giải thích.
