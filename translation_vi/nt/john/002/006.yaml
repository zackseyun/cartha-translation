revisions:
- from: Tại đó có sáu chum đựng nước bằng đá, được đặt sẵn để dùng cho việc thanh tẩy theo tục lệ của người Do Thái,[a] mỗi chum chứa được hai hoặc ba đơn vị đo.[b]
  to: Tại đó có sáu chum nước bằng đá, được đặt để dùng cho nghi thức thanh tẩy của người Do Thái,[a] mỗi chum chứa được hai hoặc ba đơn vị đo.[b]
  rationale: Thay “đặt sẵn” bằng “đặt” để không thêm ý nghĩa, và thay cách diễn đạt chính bằng “nghi thức thanh tẩy” để phản ánh trực tiếp hơn καθαρισμός trong bối cảnh nghi lễ. Các mỏ neo chú thích vẫn gắn đúng với cụm thanh tẩy và đơn vị đo.
  reviewer_model: gpt-5.6-terra
