id: JHN.2.12
reference: John 2:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Μετὰ τοῦτο κατέβη εἰς Καφαρναοὺμ αὐτὸς καὶ ἡ μήτηρ αὐτοῦ καὶ οἱ ⸀ἀδελφοὶ καὶ οἱ μαθηταὶ αὐτοῦ, καὶ ἐκεῖ ἔμειναν οὐ πολλὰς ἡμέρας.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/012.yaml
  text: After this he went down to Capernaum[a], he and his mother and his brothers and his disciples, and they stayed there not many days.
translation:
  language: vi
  text: Sau đó, Ngài cùng mẹ Ngài, các anh em trai[a] và các môn đồ của Ngài đi xuống Ca-phác-na-um. Họ ở lại đó không lâu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “những người bà con” hoặc “những người thân thuộc”; từ Hy Lạp có thể chỉ anh em theo nghĩa hẹp, hoặc trong một số ngữ cảnh, chỉ quan hệ họ hàng rộng hơn.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ τοῦτο
  choice: Sau đó
  rationale: Cách chuyển tiếp thời gian tự nhiên trong tiếng Việt hiện đại, đồng thời giữ sắc thái chỉ một sự việc vừa được kể.
- source_word: κατέβη
  choice: đi xuống
  rationale: Giữ ý chuyển động theo địa thế từ Ca-na xuống Ca-phác-na-um; tự nhiên hơn cách trang trọng như “hạ xuống”.
- source_word: εἰς Καφαρναοὺμ
  choice: xuống Ca-phác-na-um
  rationale: Giới từ chỉ đích đến được diễn đạt tự nhiên trong tiếng Việt; địa danh được phiên âm theo cách quen dùng.
- source_word: αὐτὸς καὶ ἡ μήτηρ αὐτοῦ καὶ οἱ ἀδελφοὶ καὶ οἱ μαθηταὶ αὐτοῦ
  choice: cùng đi có mẹ, các anh em và các môn đồ của Ngài
  rationale: Thể hiện đầy đủ nhóm người cùng đi mà không lặp đại từ sở hữu một cách nặng nề; “Ngài” duy trì văn phong tôn kính và làm rõ tất cả đều liên hệ với Chúa Giê-su.
- source_word: οἱ ἀδελφοὶ
  choice: các anh em
  rationale: Phản ánh trực tiếp danh từ giống đực số nhiều, có nghĩa thông thường là anh em trai, nhưng cụm từ tiếng Việt vẫn cho phép ghi nhận phạm vi thân tộc rộng hơn trong chú thích.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: các môn đồ của Ngài
  rationale: “Môn đồ” là thuật ngữ Kinh Thánh quen thuộc, bao hàm người học và người đi theo.
- source_word: ἐκεῖ ἔμειναν
  choice: Họ ở lại đó
  rationale: Động từ số nhiều quy về toàn nhóm; câu tiếng Việt rõ ràng và tự nhiên.
- source_word: οὐ πολλὰς ἡμέρας
  choice: không nhiều ngày
  rationale: Giữ sát lối phủ định của nguyên văn thay vì diễn giải thành “chỉ vài ngày”.
theological_decisions:
- issue: Phạm vi chỉ người của ἀδελφοί trong gia đình Chúa Giê-su
  choice: Dịch là “các anh em” trong chính văn.
  alternative: “những người bà con” hoặc “những người thân thuộc”
  rationale: Nghĩa trực tiếp và tự nhiên nhất của từ Hy Lạp trong hình thức giống đực số nhiều là anh em trai. Tuy vậy, từ này trong một số ngữ cảnh có thể chỉ quan hệ họ hàng rộng hơn; chú thích bảo lưu khả năng ấy mà không giải quyết thay cho độc giả vấn đề thần học về gia đình Chúa Giê-su.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” cho Chúa Giê-su và “môn đồ” để duy trì sắc thái Kinh Thánh quen thuộc; cấu trúc câu được điều chỉnh nhẹ để tránh chuỗi liên từ và đại từ sở hữu nặng nề.
