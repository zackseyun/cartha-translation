source:
  edition: SBLGNT
  text: καὶ εὗρεν ἐν τῷ ἱερῷ τοὺς πωλοῦντας βόας καὶ πρόβατα καὶ περιστερὰς καὶ τοὺς κερματιστὰς καθημένους,
base_translation:
  language: en
  yaml_path: translation/nt/john/002/014.yaml
  text: And he found in the temple those selling oxen and sheep and doves[a], and the money changers sitting there.
translation:
  language: vi
  text: Tại đền thờ[a], ngài bắt gặp những người đang bán bò, chiên và bồ câu, cùng những người đổi tiền đang ngồi đó.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hy Lạp ở đây chỉ toàn bộ khuôn viên đền thờ, gồm cả các sân, chứ không riêng nơi thánh bên trong.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὗρεν
  choice: ngài thấy
  rationale: Trong ngữ cảnh này, εὗρεν diễn tả điều Đức Giê-su bắt gặp khi vào khuôn viên đền thờ. “Thấy” tự nhiên trong tiếng Việt và không hàm ý ngài đang tìm kiếm.
- source_word: ἱερῷ
  choice: đền thờ
  rationale: ἱερόν chỉ toàn bộ khuôn viên đền thờ, không riêng nơi thánh bên trong. “Đền thờ” là cách diễn đạt thông dụng; chú thích làm rõ phạm vi không gian.
- source_word: πωλοῦντας
  choice: những người đang bán
  rationale: Cụm này thể hiện phân từ hiện tại dùng như danh từ và nhấn mạnh hoạt động đang diễn ra.
- source_word: βόας
  choice: bò
  rationale: βοῦς chỉ gia súc thuộc loài bò; “bò” chính xác và tự nhiên hơn “bò đực” vì nguyên văn không xác định giới tính.
- source_word: πρόβατα
  choice: chiên
  rationale: Trong bối cảnh các con vật dùng cho việc dâng tế lễ, πρόβατα được diễn đạt rõ và quen thuộc là “chiên”.
- source_word: περιστερὰς
  choice: bồ câu
  rationale: περιστερά có thể chỉ dove hoặc pigeon; tiếng Việt thường dùng chung “bồ câu”, giữ được độ rộng nghĩa.
- source_word: κερματιστὰς
  choice: những người đổi tiền
  rationale: κερματιστής là người đổi tiền hoặc tiền xu; cách diễn đạt này rõ nghĩa và phổ thông.
- source_word: καθημένους
  choice: đang ngồi đó
  rationale: Giữ tư thế được nêu trong phân từ và diễn tả tự nhiên việc họ đã ngồi tại địa điểm ấy.
theological_decisions:
- issue: Phạm vi của ἱερόν đối với đền thờ Giê-ru-sa-lem
  choice: Dùng “đền thờ” trong chính văn và chú thích rằng từ Hy Lạp chỉ khuôn viên đền thờ.
  alternative: khuôn viên đền thờ; các sân đền thờ; nơi thánh
  rationale: Bối cảnh có người bán súc vật và đổi tiền cho thấy đây là khu vực rộng của đền thờ chứ không phải nơi thánh bên trong. Cách dịch chính văn vẫn tự nhiên, còn chú thích bảo toàn sắc thái lịch sử và không gian.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ngài” để nối mạch với Đức Giê-su trong ngữ cảnh gần, tránh lặp tên không có trong câu Hy Lạp. Trật tự câu được điều chỉnh nhẹ cho tự nhiên trong tiếng Việt, đồng thời giữ hai nhóm người và các hành động đang diễn ra.
