id: JHN.2.16
reference: John 2:16
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ τοῖς τὰς περιστερὰς πωλοῦσιν εἶπεν· Ἄρατε ταῦτα ἐντεῦθεν, μὴ ποιεῖτε τὸν οἶκον τοῦ πατρός μου οἶκον ἐμπορίου.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/016.yaml
  text: And he said to those selling the doves[a], “Take these things away from here; do not make my Father’s house a house of trade.”
translation:
  language: vi
  text: 'Ngài nói với những người bán bồ câu: “Hãy đem những thứ này ra khỏi đây! Đừng biến nhà Cha tôi thành nơi buôn bán.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát chữ: “Đừng biến nhà Cha tôi thành một nhà buôn bán.” Cũng có thể dịch: “thành một khu chợ.” Bản Hy Lạp lặp lại từ “nhà” trong câu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: περιστερὰς
  choice: bồ câu
  rationale: Chỉ loài chim được bán để dâng làm sinh tế; “bồ câu” là cách gọi tự nhiên và quen thuộc trong tiếng Việt.
- source_word: πωλοῦσιν
  choice: những người bán
  rationale: Phân từ hiện tại xác định nhóm người qua hoạt động buôn bán đang diễn ra; cách diễn đạt này tự nhiên và giữ đúng chức năng của phân từ.
- source_word: Ἄρατε
  choice: Hãy đem ... ra
  rationale: Mệnh lệnh aorist đòi hỏi hành động dứt khoát; “hãy đem ... ra khỏi đây” truyền đạt rõ lực mệnh lệnh và chuyển động rời khỏi nơi ấy.
- source_word: ταῦτα
  choice: những thứ này
  rationale: Đại từ chỉ định trung tính số nhiều có thể bao gồm chim cùng các vật liên quan; cách dịch này giữ phạm vi quy chiếu không xác định rõ, không thêm chi tiết.
- source_word: ἐντεῦθεν
  choice: khỏi đây
  rationale: Diễn tả sự rời khỏi địa điểm hiện tại và kết hợp tự nhiên với “đem ... ra”.
- source_word: μὴ ποιεῖτε
  choice: Đừng biến
  rationale: Truyền đạt tự nhiên lệnh cấm của μή với mệnh lệnh hiện tại. “Biến ... thành” diễn tả quan hệ vị ngữ của hai cụm οἶκον mà không hàm ý người nghe có quyền tạo lập Đền Thờ.
- source_word: οἶκον τοῦ πατρός μου
  choice: nhà Cha tôi
  rationale: Giữ nguyên đại từ sở hữu số ít và lời tuyên bố về mối quan hệ riêng của Chúa Giê-su với Cha; cấu trúc này tự nhiên, trang trọng trong tiếng Việt.
- source_word: οἶκον ἐμπορίου
  choice: nơi buôn bán
  rationale: ἐμπόριον chỉ hoạt động thương mại hoặc nơi giao thương. “Nơi buôn bán” tự nhiên trong tiếng Việt; chú thích bảo tồn cách nói sát chữ “nhà buôn bán” và sự lặp lại của οἶκος.
theological_decisions:
- issue: Cách dịch lời Chúa Giê-su gọi Đền Thờ là οἶκον τοῦ πατρός μου
  choice: nhà Cha tôi
  alternative: nhà Cha chúng ta; nhà Đức Chúa Trời
  rationale: Bản Hy Lạp dùng μου, “của tôi”, nên cần giữ lời tuyên bố trực tiếp về mối quan hệ làm Con và thẩm quyền của Chúa Giê-su, không làm nhẹ hoặc mở rộng quá văn bản.
- issue: Sắc thái của μὴ ποιεῖτε với mệnh lệnh hiện tại
  choice: Đừng biến
  alternative: Đừng tiếp tục biến; Hãy ngừng biến
  rationale: Hình thái có thể được hiểu là lệnh cấm một hành động đang diễn ra, nhưng không nhất thiết phải mã hóa rõ ý “hãy ngừng”. Cách dịch giữ lệnh cấm trực tiếp và tránh giải quyết quá mức sắc thái thể.
translation_notes:
  register: Văn phong hiện đại, rõ ràng và trang nghiêm. Dùng “Ngài” theo mạch kể và “Cha tôi” trong lời trực tiếp. Bản chính ưu tiên cách nói tự nhiên “nơi buôn bán”, còn chú thích ghi cách dịch sát chữ để bảo tồn phép lặp tu từ của nguyên bản.
