id: JHN.17.1
reference: John 17:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ταῦτα ⸀ἐλάλησεν Ἰησοῦς, καὶ ⸂ἐπάρας τοὺς ὀφθαλμοὺς αὐτοῦ εἰς τὸν οὐρανὸν εἶπεν⸃· Πάτερ, ἐλήλυθεν ἡ ὥρα· δόξασόν σου τὸν υἱόν, ⸀ἵνα ὁ ⸀υἱὸς δοξάσῃ σέ,
base_translation:
  language: en
  yaml_path: translation/nt/john/017/001.yaml
  text: 'Jesus said these things, and lifting up his eyes to heaven, he said: “Father, the hour has come. Glorify your Son, so that the Son may glorify you,”'
translation:
  language: vi
  text: 'Giê-su nói những điều ấy, rồi ngước mắt lên trời và nói: “Cha, giờ đã đến. Xin tôn vinh Con của Cha, để Con tôn vinh Cha.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ταῦτα
  choice: những điều ấy
  rationale: Đại từ chỉ định trung tính số nhiều quy chiếu về lời giảng trước đó; “những điều ấy” vừa tự nhiên vừa giữ được số nhiều và hướng quy chiếu ngược.
- source_word: ἐλάλησεν
  choice: nói
  rationale: λαλέω chỉ hành động nói; “nói” là cách diễn đạt tự nhiên trong tiếng Việt ở đây, nhất là khi ngay sau đó có lời cầu nguyện trực tiếp.
- source_word: ἐπάρας τοὺς ὀφθαλμοὺς αὐτοῦ
  choice: ngước mắt lên
  rationale: Cụm phân từ aorist mô tả cử chỉ nâng mắt; “ngước mắt lên” là thành ngữ tự nhiên, giữ rõ hành động và hướng nhìn.
- source_word: εἰς τὸν οὐρανόν
  choice: lên trời
  rationale: εἰς với đối cách biểu thị hướng; kết hợp “ngước mắt lên trời” truyền đạt tự nhiên hướng nhìn về trời.
- source_word: Πάτερ
  choice: Cha ơi
  rationale: Hô cách Πάτερ là lời xưng gọi trực tiếp. “Cha ơi” thể hiện rõ chức năng hô gọi trong tiếng Việt mà không thêm đại từ sở hữu “của con” vốn không có trong Hy Lạp.
- source_word: ἐλήλυθεν ἡ ὥρα
  choice: giờ đã đến
  rationale: Thì hoàn thành nhấn mạnh giờ quyết định nay đã đến; giữ “giờ” để bảo tồn mô-típ ὥρα đặc trưng trong Giăng.
- source_word: δόξασόν
  choice: xin tôn vinh
  rationale: δοξάζω trong Giăng bao hàm việc bày tỏ vinh quang và ban sự tôn quý. “Tôn vinh” trang trọng, dễ hiểu và giữ được sự lặp lại đối xứng trong câu.
- source_word: σου τὸν υἱόν
  choice: Con của Cha
  rationale: Đại từ sở hữu số ít đi với “Con”; trong lời Đức Chúa Jêsus thưa với Cha, “Con của Cha” truyền đạt tự nhiên quan hệ sở hữu mà không thêm nội dung.
- source_word: ἵνα
  choice: để
  rationale: Giới thiệu mệnh đề mục đích hoặc kết quả; “để” là cách diễn đạt ngắn gọn, tự nhiên và vẫn giữ lực hướng đích.
- source_word: ὁ υἱὸς
  choice: Con
  rationale: Mạo từ xác định cùng danh xưng chỉ chính Đức Chúa Jêsus. Trong tiếng Việt, lặp “Con” tự nhiên hơn “người Con” và vẫn giữ sự chuyển từ “Con của Cha” sang chủ thể “Con”.
- source_word: δοξάσῃ σέ
  choice: cũng tôn vinh Cha
  rationale: Động từ lặp lại cùng bổ ngữ ngôi thứ hai. “Cũng” làm rõ tính tương ứng hàm chứa trong cấu trúc mà không thay đổi quan hệ mục đích; “Cha” tự nhiên hơn “Cha ấy/ngài” trong lời thưa trực tiếp.
theological_decisions:
- issue: Sự tôn vinh tương hỗ giữa Cha và Con
  choice: “Xin tôn vinh Con của Cha, để Con cũng tôn vinh Cha”
  alternative: “Xin làm vinh hiển Con của Cha, để Con làm vinh hiển Cha”
  rationale: Giữ cùng một động từ cho cả hai vế để bảo tồn tính đối xứng thần học của nguyên văn, không giải thích thêm cách sự tôn vinh diễn ra.
- issue: Cách biểu thị danh xưng υἱός
  choice: Viết hoa “Con” khi chỉ Đức Chúa Jêsus
  alternative: Viết thường “con”
  rationale: Viết hoa giúp độc giả nhận ra đây là danh xưng chỉ Đức Chúa Jêsus trong quan hệ Cha–Con, nhưng không thêm một mệnh đề tín lý vào bản văn.
- issue: Chủ thể của lời cầu nguyện
  choice: “Đức Chúa Jêsus”
  alternative: “Chúa Jêsus” hoặc “Jêsus”
  rationale: Dùng danh xưng quen thuộc, trang trọng trong tiếng Việt Cơ Đốc để xác định nhân vật, không mở rộng nội dung thần học của câu.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ đọc. Giữ cấu trúc kể thuật rồi chuyển sang lời cầu nguyện trực tiếp; bảo tồn mô-típ “giờ” và sự lặp đối xứng của “tôn vinh”. Không thêm chú thích vì câu không có điểm dị bản hay hàm nghĩa cần được giải thích bắt buộc trong bản văn.
