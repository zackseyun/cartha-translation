revisions:
- from: 'Đức Chúa Jêsus nói những điều ấy, rồi ngước mắt lên trời và nói: “Cha ơi, giờ đã đến. Xin tôn vinh Con của Cha, để Con cũng tôn vinh Cha.”'
  to: 'Giê-su nói những điều ấy, rồi ngước mắt lên trời và nói: “Cha, giờ đã đến. Xin tôn vinh Con của Cha, để Con tôn vinh Cha.”'
  rationale: Hiệu chỉnh tên riêng theo tiếng Việt hiện đại tiêu chuẩn và loại bỏ danh xưng được thêm vào ngoài nguyên văn. Đồng thời bỏ “ơi” và “cũng” để giữ sát lời xưng gọi và mệnh đề mục đích Hy Lạp, trong khi vẫn duy trì văn phong cầu nguyện tự nhiên cùng thuật ngữ “giờ” và “tôn vinh”.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T08:26:00Z'
review_pass:
  verdict: revise
  source_fidelity: Bản dịch truyền đạt đúng trình tự tường thuật, cử chỉ ngước mắt, mô-típ “giờ đã đến”, và lời cầu xin tôn vinh tương hỗ. Tuy nhiên, “Đức Chúa Jêsus” thêm danh xưng không có trong Ἰησοῦς, và “cũng” thêm một sắc thái liên kết không được diễn đạt trong mệnh đề ἵνα.
  naturalness: Câu văn nhìn chung tự nhiên, trang trọng và phù hợp văn cảnh cầu nguyện. “Giê-su” là cách viết hiện đại, chuẩn hơn “Jêsus” cho bản tiếng Việt hiện đại tiêu chuẩn. “Cha” đã đủ chức năng hô cách; bỏ “ơi” giữ lời xưng gọi sát nguyên văn hơn mà vẫn tự nhiên.
  terminology: Giữ “giờ”, “tôn vinh”, “Cha”, và “Con” là phù hợp với thuật ngữ và tính đối xứng của Giăng. Viết hoa “Con” có thể giữ để nhận diện danh xưng trong ngữ cảnh. Không thêm tước hiệu “Đức Chúa” vào tên Giê-su khi nguyên văn chỉ nêu tên riêng.
  issues:
  - severity: medium
    issue: Tên nhân vật được mở rộng thành “Đức Chúa Jêsus”.
    rationale: Nguyên văn chỉ có Ἰησοῦς (“Giê-su”); “Đức Chúa” là danh xưng bổ sung. Ngoài ra, “Jêsus” không phải chính tả hiện đại tiêu chuẩn được yêu cầu.
  - severity: low
    issue: Từ “cũng” trong “để Con cũng tôn vinh Cha” không hiện diện trong nguyên văn.
    rationale: Cấu trúc nguyên văn biểu thị mục đích bằng ἵνα, nhưng không có từ tương đương “cũng”. Tính tương hỗ vẫn được bảo toàn bằng sự lặp lại động từ “tôn vinh” mà không cần thêm từ này.
  - severity: low
    issue: “ơi” trong “Cha ơi” tăng sắc thái lời gọi.
    rationale: Πάτερ là hô cách đơn giản “Cha”. “Cha” trong lời cầu nguyện tiếng Việt đã tự nhiên và sát hơn, không thêm sắc thái cảm thán.
  revised_text: 'Giê-su nói những điều ấy, rồi ngước mắt lên trời và nói: “Cha, giờ đã đến. Xin tôn vinh Con của Cha, để Con tôn vinh Cha.”'
