  - severity: low
    issue: Viết hoa không nhất quán đại từ quy chiếu đến Con
    rationale: Bản nháp viết “Cha” hoa nhưng “con” thường, dù đây là lời Con nói với Cha. Viết “Con” nhất quán giúp nhận diện người nói trong ngữ cảnh lời cầu nguyện và phù hợp quy ước tôn kính của bản dịch.
