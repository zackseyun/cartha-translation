base_translation:
  language: en
  yaml_path: translation/nt/john/017/022.yaml
  text: And I have given them the glory that you have given me[a], so that they may be one, just as we are one.
translation:
  language: vi
  text: Và Con đã ban cho họ vinh quang mà Cha đã ban cho Con,[a] để họ nên một, như chúng ta là một.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Con cũng đã ban cho họ vinh quang mà Cha đã ban cho Con.” Từ Hy Lạp κἀγώ có thể mang sắc thái cộng thêm (“Con cũng”).'
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀγὼ
  choice: Còn con, con
  rationale: κἀγώ là dạng rút gọn của καί + ἐγώ, vừa nối tiếp mạch văn vừa nhấn mạnh chủ thể. “Còn con, con” tự nhiên trong tiếng Việt và giữ được sắc thái nối tiếp/đối ứng; sắc thái cộng thêm “cũng” được ghi ở chú thích.
- source_word: δόξαν
  choice: vinh quang
  rationale: Trong Tin Mừng Giăng, δόξα thường mang chiều kích vinh quang thần thượng, không chỉ là danh dự của con người. “Vinh quang” giữ được sức nặng thần học và sự nhất quán thuật ngữ.
- source_word: ἣν δέδωκάς μοι
  choice: mà Cha đã ban cho con
  rationale: Đại từ ngôi thứ hai được diễn đạt là “Cha” theo ngữ cảnh lời cầu nguyện, giúp tiếng Việt rõ và tự nhiên. “Đã ban” diễn tả hành động hoàn tất; hiệu lực còn tiếp diễn được ngữ cảnh bảo toàn.
- source_word: δέδωκα αὐτοῖς
  choice: con đã ban cho họ
  rationale: “Đã ban cho họ” là cách diễn đạt trang trọng, tự nhiên, phản ánh hành động đã hoàn tất của thể hoàn thành Hy Lạp mà không làm câu tiếng Việt nặng nề.
- source_word: ἵνα ὦσιν ἓν
  choice: để họ nên một
  rationale: “Để” giữ lực chỉ mục đích/kết quả của ἵνα; “nên một” diễn đạt trạng thái hiệp nhất được hướng tới, đồng thời giữ hình ảnh ngắn gọn “một” của nguyên văn thay vì giải nghĩa thành một loại hiệp nhất cụ thể.
- source_word: καθὼς ἡμεῖς ἕν
  choice: như chúng ta là một
  rationale: “Như” giữ phép so sánh trực tiếp. Động từ “là” được bổ sung cho đúng cú pháp tiếng Việt nhưng không xác định bản chất của sự hiệp nhất.
theological_decisions:
- issue: Bản chất sự nên một của các môn đồ so với sự nên một của Cha và Con
  choice: Dịch trực tiếp “để họ nên một, như chúng ta là một”, không xác định sự hiệp nhất ấy là bản thể, tương quan, sứ mạng hay cơ cấu.
  alternative: Giải nghĩa thành sự hiệp nhất thuần túy về tương quan, sự dự phần vào sự sống thần thượng, hoặc sự thống nhất hữu hình của Hội Thánh.
  rationale: Câu này đặt sự hiệp nhất của các môn đồ trong tương quan so sánh thật với sự hiệp nhất của Cha và Con, nhưng không tự xác định chính xác phương diện so sánh. Cách dịch mở giữ nguyên sức căng thần học và tránh du nhập một cách giải thích hệ phái.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu; dùng lối xưng hô “Cha–con” phù hợp ngữ cảnh lời cầu nguyện của Chúa Giê-su. Giữ “vinh quang” và “một” để bảo toàn chiều sâu thần học cũng như tính mở của nguyên văn.
