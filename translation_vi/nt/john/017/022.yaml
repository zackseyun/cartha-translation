  to: Và Con đã ban cho họ vinh quang mà Cha đã ban cho Con,[a] để họ nên một, như chúng ta là một.
  rationale: Sửa phần mở đầu để phản ánh κἀγώ cách tự nhiên hơn trong tiếng Việt, không áp đặt sắc thái đối lập. Chuẩn hóa cách viết “Cha–Con.” Các từ then chốt và cấu trúc mục đích/so sánh được giữ nguyên để bảo toàn ý nghĩa, thể hoàn thành theo mức tiếng Việt cho phép, và tính không xác định thần học của “một.”
