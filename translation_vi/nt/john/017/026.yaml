id: JHN.17.26
reference: John 17:26
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἐγνώρισα αὐτοῖς τὸ ὄνομά σου καὶ γνωρίσω, ἵνα ἡ ἀγάπη ἣν ἠγάπησάς με ἐν αὐτοῖς ᾖ κἀγὼ ἐν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/026.yaml
  text: And I made your name known to them[a], and I will make it known, so that the love with which you loved me may be in them[c][b], and I in them.
translation:
  language: vi
  text: Ta đã cho họ biết danh Cha[a], và Ta sẽ cho họ biết, để tình yêu mà Cha đã yêu thương Ta ở trong họ[b], và Ta cũng ở trong họ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Danh Cha” nói đến căn tính và phẩm tính của Đức Chúa Trời như Ngài bày tỏ, chứ không chỉ là một tên gọi được phát âm.
    reason: cultural_note
  - marker: b
    text: Cũng có thể dịch là “ở giữa họ”; chính văn dịch trực tiếp là “ở trong họ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγνώρισα
  choice: đã cho họ biết
  rationale: 'Diễn đạt tự nhiên sắc thái tác động của γνωρίζω ở thì aorist: làm cho người khác biết; đồng thời giữ sự song hành với γνωρίσω.'
- source_word: τὸ ὄνομά σου
  choice: danh Cha
  rationale: Giữ hình ảnh cụ thể “danh” trong nguyên văn; “Cha” phù hợp ngữ cảnh lời cầu nguyện trực tiếp của Chúa Giê-su và cách xưng hô tự nhiên trong tiếng Việt.
- source_word: γνωρίσω
  choice: sẽ tiếp tục cho họ biết
  rationale: Thì tương lai chỉ hành động sẽ còn diễn ra. “Tiếp tục” làm rõ sự nối tiếp giữa điều Chúa Giê-su đã làm và sẽ làm, vốn được biểu thị bởi hai động từ song hành.
- source_word: ἵνα
  choice: để
  rationale: Diễn đạt tự nhiên quan hệ mục đích hoặc kết quả mà không buộc phải phân định dứt khoát giữa hai sắc thái.
- source_word: ἡ ἀγάπη ἣν ἠγάπησάς με
  choice: tình yêu Cha đã dành cho Ta
  rationale: Chuyển cấu trúc quan hệ Hy Lạp sang cách nói tiếng Việt tự nhiên, vẫn giữ rõ tình yêu của Cha hướng đến Con.
- source_word: ἐν αὐτοῖς
  choice: ở trong họ
  rationale: Phản ánh trực tiếp ἐν với đại từ số nhiều và giữ chủ đề nội tại tương hỗ trong sách Giăng; không đổi thành “giữa họ”.
- source_word: κἀγὼ ἐν αὐτοῖς
  choice: và Ta cũng ở trong họ
  rationale: Bổ sung động từ “ở” vốn được lược trong tiếng Hy Lạp để câu tiếng Việt đầy đủ, đồng thời giữ hai thực tại được phối hợp ngang hàng.
theological_decisions:
- issue: Ý nghĩa của “danh Cha”
  choice: Giữ “danh Cha” trong chính văn và giải thích bằng chú thích.
  alternative: “Cha là Đấng như thế nào” hoặc “bản tính của Cha”
  rationale: Nguyên văn nói “danh”; giữ thành ngữ Kinh Thánh này bảo toàn chiều sâu về căn tính và phẩm tính được bày tỏ của Đức Chúa Trời mà không đưa phần giải nghĩa vào chính văn.
- issue: Mối liên hệ giữa tình yêu của Cha và sự hiện diện nội tại của Chúa Giê-su
  choice: 'Giữ hai vế phối hợp: tình yêu ở trong họ, và Ta cũng ở trong họ.'
  alternative: Diễn giải rằng một thực tại là nguyên nhân hoặc phương tiện của thực tại kia.
  rationale: Tiếng Hy Lạp đặt hai thực tại cạnh nhau nhưng không xác định rõ quan hệ nhân quả; bản dịch không giải quyết thay cho nguyên văn.
- issue: Phạm vi nghĩa của ἐν αὐτοῖς
  choice: “ở trong họ”
  alternative: “ở giữa họ”
  rationale: Cả hai có thể thuộc phạm vi nghĩa của ἐν, nhưng “ở trong họ” là cách hiểu trực tiếp hơn và giữ được chủ đề ngự trong nhau của sách Giăng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ta/Cha” để phản ánh lời Chúa Giê-su thưa trực tiếp với Cha; tránh lối diễn đạt cổ hoặc quá chuyên môn. Chính văn giữ cấu trúc cô đọng nhưng bổ sung động từ ở mệnh đề cuối để tự nhiên trong tiếng Việt.
