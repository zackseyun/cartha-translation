id: JHN.17.20
reference: John 17:20
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Οὐ περὶ τούτων δὲ ἐρωτῶ μόνον, ἀλλὰ καὶ περὶ τῶν πιστευόντων διὰ τοῦ λόγου αὐτῶν εἰς ἐμέ,
base_translation:
  language: en
  yaml_path: translation/nt/john/017/020.yaml
  text: I do not ask concerning these only[a], but also concerning those who believe in me through their word[b],
translation:
  language: vi
  text: Con không chỉ cầu xin cho những người này, mà còn cho những người tin vào con qua lời của họ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “qua sứ điệp của họ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐρωτῶ
  choice: cầu xin
  rationale: Trong ngữ cảnh Chúa Giê-su đang thưa với Cha, “cầu xin” diễn đạt tự nhiên hành động khẩn xin mà không làm thay đổi nội dung lời cầu nguyện.
- source_word: περὶ τούτων
  choice: cho những người này
  rationale: περί với sở hữu cách chỉ đối tượng mà lời cầu xin hướng đến. Tiếng Việt tự nhiên dùng “cầu xin cho”; “những người này” giữ nguyên sự quy chiếu của τούτων mà không giải thích thêm rằng đó là các môn đồ.
- source_word: Οὐ ... μόνον
  choice: không chỉ
  rationale: Cấu trúc này giữ đúng sự giới hạn rồi mở rộng phạm vi lời cầu xin.
- source_word: ἀλλὰ καὶ
  choice: mà còn
  rationale: Cặp “không chỉ... mà còn...” là cách diễn đạt tiếng Việt tự nhiên, bảo toàn cả ý tương phản lẫn bổ sung.
- source_word: τῶν πιστευόντων
  choice: những người tin
  rationale: Phân từ hiện tại được dùng như danh từ; “những người tin” giữ sắc thái hành động tốt hơn danh từ tĩnh như “các tín hữu”.
- source_word: διὰ τοῦ λόγου αὐτῶν
  choice: qua lời của họ
  rationale: “Lời” giữ gần λόγος và bảo toàn âm hưởng đặc trưng của văn chương Giăng; chú thích nêu nghĩa khả dĩ “sứ điệp” để phản ánh phạm vi nghĩa của từ.
- source_word: εἰς ἐμέ
  choice: tin vào con
  rationale: Với πιστεύω, εἰς chỉ đối tượng đức tin; “tin vào” là cách diễn đạt tiếng Việt tự nhiên và giữ tính chất hướng về một thân vị.
theological_decisions:
- issue: Phạm vi lời cầu xin của Chúa Giê-su vượt ra ngoài các môn đồ hiện diện
  choice: Không thêm từ chỉ tương lai; dịch “những người tin vào con” để câu có thể bao gồm mọi người tin nhờ lời các môn đồ.
  alternative: Dịch “những người sẽ tin vào con,” xác định rõ đây là các tín hữu tương lai.
  rationale: Bản Hy Lạp dùng phân từ hiện tại πιστευόντων, không có từ tương lai. Ngữ cảnh có thể hướng đến những người sẽ tin về sau, nhưng bản dịch không nên biến hàm ý thời gian ấy thành điều được nói minh nhiên.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “Con” phù hợp với lời Chúa Giê-su thưa với Cha trong ngữ cảnh. Cấu trúc “không chỉ... mà còn...” tạo nhịp tự nhiên và phản ánh sát cấu trúc Hy Lạp.
