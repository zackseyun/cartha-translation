  terminology: “Lời của họ” là cách chuyển dịch gần và phù hợp của λόγος αὐτῶν, đồng thời chú thích “sứ điệp của họ” nêu đúng một khả năng từ vựng mà không áp đặt diễn giải. “Những người tin” giữ được tính động của phân từ πιστευόντων.
