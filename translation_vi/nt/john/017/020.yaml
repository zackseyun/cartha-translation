  source_fidelity: 'Bản dịch phản ánh đúng cấu trúc phủ định–mở rộng của câu Hy Lạp: lời cầu xin không chỉ hướng đến “những người này” mà còn đến những người tin vào Chúa Giê-su qua lời của họ. “Cầu xin cho” diễn đạt tự nhiên ἐρωτῶ trong ngữ cảnh lời Chúa Con thưa với Cha; “tin vào con” chuyển đạt chuẩn cách dùng πιστεύω εἰς. Không thêm yếu tố thời gian tương lai vốn không được nêu minh nhiên trong nguyên văn.'
