id: JHN.17.24
reference: John 17:24
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸀πάτερ, ⸀ὃ δέδωκάς μοι, θέλω ἵνα ὅπου εἰμὶ ἐγὼ κἀκεῖνοι ὦσιν μετ’ ἐμοῦ, ἵνα θεωρῶσιν τὴν δόξαν τὴν ἐμὴν ἣν ⸀δέδωκάς μοι, ὅτι ἠγάπησάς με πρὸ καταβολῆς κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/024.yaml
  text: Father[a], I desire that those whom you have given me also may be with me where I am, so that they may see my glory that you have given me, because you loved me before the foundation of the world.
translation:
  language: vi
  text: Lạy Cha, con muốn những người Cha đã ban cho con cũng được ở với con, nơi con ở, để họ được chiêm ngưỡng vinh quang của con, là vinh quang Cha đã ban cho con, vì Cha đã yêu con trước khi thế gian được dựng nên.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πάτερ
  choice: Lạy Cha
  rationale: Dạng hô cách trực tiếp được chuyển bằng “Lạy Cha”, tự nhiên và trang trọng trong lời cầu nguyện, không thêm đại từ sở hữu.
- source_word: ὃ δέδωκάς μοι
  choice: những người Cha đã ban cho con
  rationale: Đại từ trung tính số ít có nghĩa tập thể, chỉ những người Cha ban cho Con; đại từ số nhiều theo sau xác nhận quy chiếu đến người.
- source_word: θέλω
  choice: con mong rằng
  rationale: Diễn đạt ý muốn mạnh nhưng phù hợp ngữ cảnh cầu nguyện, tránh biến lời này thành mệnh lệnh hay lời tuyên bố tương lai.
- source_word: ὅπου εἰμὶ ἐγώ
  choice: nơi con ở
  rationale: Cách nói gọn, tự nhiên, giữ nguyên ý nghĩa địa điểm mà không làm câu tiếng Việt nặng nề.
- source_word: κἀκεῖνοι ὦσιν μετ’ ἐμοῦ
  choice: cũng được ở với con
  rationale: “Cũng” giữ lực bổ sung của κἀκεῖνοι; “được ở” diễn đạt tự nhiên nội dung mong muốn trong tiếng Việt.
- source_word: θεωρῶσιν
  choice: được chiêm ngưỡng
  rationale: “Chiêm ngưỡng” phản ánh sắc thái chăm chú nhìn xem của θεωρέω và phù hợp với đối tượng là vinh quang, đồng thời vẫn dễ hiểu.
- source_word: τὴν δόξαν τὴν ἐμήν
  choice: vinh quang của con
  rationale: Giữ rõ quan hệ sở hữu và đọc tự nhiên trong tiếng Việt.
- source_word: ἣν δέδωκάς μοι
  choice: là vinh quang Cha đã ban cho con
  rationale: Lặp lại danh từ giúp tránh khả năng đại từ quan hệ tiếng Việt quy chiếu mơ hồ, đồng thời giữ ý nghĩa của thì hoàn thành là sự ban cho có kết quả còn hiệu lực.
- source_word: ὅτι ἠγάπησάς με
  choice: vì Cha đã yêu con
  rationale: Giữ quan hệ nguyên nhân của ὅτι và diễn đạt động từ aorist bằng quá khứ tự nhiên trong tiếng Việt.
- source_word: πρὸ καταβολῆς κόσμου
  choice: từ trước khi đặt nền thế gian
  rationale: Giữ hình ảnh “đặt nền” của καταβολή và mốc thời gian có trước sự sáng tạo; “từ trước khi” kết hợp tự nhiên với động từ yêu.
theological_decisions:
- issue: Sự hiện hữu tiền tại thế của Con được hàm ý qua tình yêu của Cha trước khi thế gian được đặt nền
  choice: 'Giữ nguyên phát biểu thời gian trực tiếp: “Cha đã yêu con từ trước khi đặt nền thế gian.”'
  alternative: Diễn giải mốc thời gian theo nghĩa ẩn dụ hoặc làm nhẹ ý nghĩa tiền sáng tạo
  rationale: Nguyên văn trình bày tình yêu của Cha dành cho Con có trước việc đặt nền thế gian; bản dịch không thêm lời giải thích cũng không làm suy yếu khẳng định ấy.
- issue: Lực nghĩa của θέλω trong lời cầu nguyện
  choice: “con mong rằng”
  alternative: “con muốn” hoặc “con quyết rằng”
  rationale: Cách dịch này giữ ý chí và nguyện vọng thực sự của Chúa Giê-su nhưng không tự ý biến lời cầu nguyện thành sắc lệnh.
- issue: Vinh quang được Cha ban cho Con
  choice: 'Giữ cả hai nét nghĩa: đó là “vinh quang của con” và là vinh quang Cha đã ban cho con'
  alternative: Diễn giải bản thể hoặc chức năng của vinh quang theo một hệ thần học cụ thể
  rationale: Cấu trúc Hy Lạp đặt hai khẳng định cạnh nhau; bản dịch bảo tồn sự căng thẳng thần học thay vì giải quyết bằng diễn giải.
translation_notes:
  register: Văn phong Việt ngữ hiện đại, trang trọng và dễ hiểu; dùng cặp xưng hô “Cha—con” thích hợp với lời cầu nguyện của Chúa Giê-su. “Chiêm ngưỡng” tạo sắc thái trang nghiêm nhưng vẫn thông dụng. Dấu chú thích [a] được đặt ngay sau cụm từ cần giải thích.
