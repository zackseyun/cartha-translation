id: JHN.17.9
reference: John 17:9
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐγὼ περὶ αὐτῶν ἐρωτῶ· οὐ περὶ τοῦ κόσμου ἐρωτῶ ἀλλὰ περὶ ὧν δέδωκάς μοι, ὅτι σοί εἰσιν,
base_translation:
  language: en
  yaml_path: translation/nt/john/017/009.yaml
  text: I am asking on their behalf[a]. I am not asking on behalf of the world, but on behalf of those whom you have given me[b], because they are yours.
translation:
  language: vi
  text: Tôi cầu xin cho họ[a]. Tôi không cầu xin cho thế gian, nhưng cho những người Cha đã ban cho tôi, vì họ thuộc về Cha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Tôi cầu xin về họ.” Giới từ Hy Lạp ở đây có thể mang nghĩa “về” hoặc “cho.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐρωτῶ
  choice: cầu xin
  rationale: Động từ có nghĩa cơ bản là hỏi hoặc xin; trong lời thưa trực tiếp với Cha ở đây, “cầu xin” diễn đạt tự nhiên hành động khẩn nguyện mà không thêm nội dung ngoài văn cảnh.
- source_word: περὶ αὐτῶν
  choice: cho họ
  rationale: περί với sở hữu cách có thể mang nghĩa “về” hoặc “cho”; đi với động từ cầu xin trong văn cảnh chuyển cầu, “cho họ” là cách nói tự nhiên trong tiếng Việt.
- source_word: κόσμου
  choice: thế gian
  rationale: Giữ thuật ngữ quen thuộc trong văn chương Giăng và không thu hẹp nghĩa thành toàn thể nhân loại hay một hệ thống chống nghịch Đức Chúa Trời.
- source_word: ὧν δέδωκάς μοι
  choice: những người Cha đã ban cho tôi
  rationale: Đại từ quan hệ chỉ một nhóm người; “đã ban” diễn đạt hành động đã hoàn tất và vẫn có hệ quả trong hiện tại. “Cha” làm rõ người được trực tiếp thưa chuyện theo văn cảnh của lời cầu nguyện.
- source_word: ὅτι σοί εἰσιν
  choice: vì họ thuộc về Cha
  rationale: ὅτι mang nghĩa nguyên nhân; cấu trúc với đại từ sở hữu được diễn đạt tự nhiên là “thuộc về Cha”.
- source_word: ἐγὼ
  choice: Tôi
  rationale: Giữ đại từ chủ ngữ được nêu rõ trong tiếng Hy Lạp, phù hợp với cấu trúc tương phản của câu.
- source_word: ἀλλὰ
  choice: nhưng
  rationale: Thể hiện rõ sự tương phản giữa “thế gian” và những người Cha đã ban cho Đức Chúa Jêsus.
theological_decisions:
- issue: Có dùng từ ngữ chuyên biệt cho lời cầu nguyện khi dịch ἐρωτῶ hay không
  choice: Dịch là “cầu xin”
  alternative: “xin” hoặc “thưa xin”
  rationale: Bản thân động từ mang nghĩa xin, và văn cảnh xác định đây là lời Đức Chúa Jêsus thưa với Cha; “cầu xin” tự nhiên trong tiếng Việt nhưng không biến động từ thành một thuật ngữ giáo phái.
- issue: Phạm vi ý nghĩa của “thế gian”
  choice: Giữ nguyên là “thế gian” mà không giải nghĩa hẹp hơn
  alternative: “nhân loại nói chung” hoặc “hệ thống thế gian không tin”
  rationale: κόσμος trong sách Giăng có nhiều sắc thái; câu dịch cần bảo toàn sự căng thẳng thần học thay vì quyết định thay cho người đọc.
- issue: Sắc thái của περί trong lời chuyển cầu
  choice: Dịch trong chính văn là “cho” và ghi nhận nghĩa “về” trong chú thích
  alternative: “về họ”
  rationale: “Cầu xin cho” là kết hợp từ tự nhiên nhất trong tiếng Việt ở văn cảnh này, nhưng chú thích bảo tồn khả năng gần cấu trúc Hy Lạp hơn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Cha” trong lời thưa trực tiếp để phản ánh văn cảnh Giăng 17; dùng “tôi” theo lối xưng hô trực tiếp của câu. Chỉ đặt một chú thích tại lần xuất hiện đầu tiên vì cùng một cấu trúc περί được lặp lại.
