id: JHN.17.21
reference: John 17:21
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἵνα πάντες ἓν ὦσιν, καθὼς σύ, ⸀πάτερ, ἐν ἐμοὶ κἀγὼ ἐν σοί, ἵνα καὶ αὐτοὶ ἐν ⸀ἡμῖν ὦσιν, ἵνα ὁ κόσμος ⸀πιστεύῃ ὅτι σύ με ἀπέστειλας.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/021.yaml
  text: that they may all be one[a], just as you, Father, are in me and I am in you; that they also may be in us[c][b], so that the world may believe that you sent me.
translation:
  language: vi
  text: để tất cả họ nên một[a], như Cha ở trong Con và Con ở trong Cha; để họ cũng ở trong chúng ta[b], hầu cho thế gian tin[c] rằng chính Cha đã sai Con.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “để tất cả họ được hiệp nhất.” Nguyên văn sát hơn là “để tất cả họ nên một”, giữ trọn ý nghĩa về sự hiệp nhất mà không giới hạn vào một phương diện cụ thể.'
    reason: lexical_alternative
  - marker: b
    text: Cách nói “ở trong” được lặp lại—“ở trong Con”, “ở trong Cha”, “ở trong chúng ta”—phản ánh ngôn ngữ đặc trưng của Giăng về sự ở trong nhau và sự dự phần; ý nghĩa mạnh hơn việc chỉ kết giao với nhau.
    reason: cross_reference
  - marker: c
    text: Cũng có thể hiểu là “bắt đầu tin”. Từ Hy Lạp có thể nói đến việc thế gian tin mà không xác định rõ trọng tâm là bắt đầu tin hay tiếp tục tin.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: để / hầu cho
  rationale: Ba mệnh đề ἵνα liên tiếp được giữ theo dòng mục đích-kết quả; hai lần đầu dùng “để”, lần cuối dùng “hầu cho” để câu tiếng Việt tự nhiên mà không làm mất cấu trúc.
- source_word: πάντες ἓν
  choice: tất cả họ nên một
  rationale: Giữ “một” theo sát ἓν ở giống trung, không thu hẹp ý nghĩa thành một hình thức hiệp nhất cụ thể.
- source_word: καθὼς
  choice: như
  rationale: Diễn đạt trực tiếp sự so sánh giữa việc các môn đồ nên một và mối tương quan giữa Cha với Con.
- source_word: πάτερ
  choice: Cha
  rationale: Giữ lời xưng hô trực tiếp, thân mật và mang nội hàm thần học trong lời cầu nguyện.
- source_word: ἐν ἐμοὶ ... ἐν σοί ... ἐν ἡμῖν
  choice: ở trong con ... ở trong Cha ... ở trong chúng ta
  rationale: Giữ nhất quán giới từ ἐν và ngôn ngữ đặc trưng của Giăng về sự ở trong nhau và dự phần, thay vì làm yếu thành “ở với”.
- source_word: καὶ αὐτοὶ
  choice: họ cũng
  rationale: Giữ sắc thái bổ sung của καί, nối sự dự phần của các môn đồ với mối tương quan Cha-Con.
- source_word: ὁ κόσμος
  choice: thế gian
  rationale: “Thế gian” là cách diễn đạt trang trọng, quen thuộc và giữ được chiều sâu thần học của κόσμος trong Giăng.
- source_word: πιστεύῃ
  choice: tin
  rationale: Không thêm sắc thái khởi đầu hay tiếp tục tin vốn không được hình thái hiện tại giả định xác quyết rõ.
- source_word: σύ με ἀπέστειλας
  choice: chính Cha đã sai con
  rationale: “Chính Cha” chuyển tải đại từ σύ được nêu rõ để nhấn mạnh; “đã sai” diễn đạt tự nhiên động từ aorist trong tiếng Việt.
theological_decisions:
- issue: Bản chất sự nên một của những người tin trong tương quan với Cha và Con
  choice: Giữ cách nói “nên một” và “ở trong chúng ta” mà không diễn giải thêm.
  alternative: “được hiệp nhất” hoặc “đồng một mục đích”
  rationale: Câu Hy Lạp không xác định sự hiệp nhất này chỉ là tổ chức, đạo đức, mục đích hay bản thể; bản dịch cần bảo toàn chiều sâu và sự căng thẳng thần học ấy.
- issue: Ngôn ngữ của Giăng về sự ở trong nhau
  choice: Dùng “ở trong” ở cả ba chỗ.
  alternative: “ở với” hoặc “hiệp nhất với”
  rationale: Việc lặp lại ἐν có ý nghĩa trong văn mạch Giăng và mạnh hơn sự kết giao đơn thuần; không nên giải nghĩa thay cho nguyên văn.
- issue: Sắc thái của πιστεύῃ
  choice: Dịch đơn giản là “tin”.
  alternative: “bắt đầu tin” hoặc “tiếp tục tin”
  rationale: Thể hiện tại giả định trong mệnh đề ἵνα cho phép nhưng không buộc một trong các sắc thái ấy; “tin” giữ được tính không xác định.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Đại từ “Cha/con” phù hợp lời cầu nguyện trực tiếp của Đức Giê-su; “thế gian” giữ thuật ngữ đặc trưng của văn chương Giăng. Thứ tự ký hiệu chú thích đã được đặt theo trình tự xuất hiện trong câu.
