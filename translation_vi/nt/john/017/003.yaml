id: JHN.17.3
reference: John 17:3
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: αὕτη δέ ἐστιν ἡ αἰώνιος ζωὴ ἵνα γινώσκωσι σὲ τὸν μόνον ἀληθινὸν θεὸν καὶ ὃν ἀπέστειλας Ἰησοῦν Χριστόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/003.yaml
  text: 'And this is eternal life: that they may know you[a], the only true God, and Jesus the Messiah whom you sent.'
translation:
  language: vi
  text: 'Và sự sống đời đời là thế này: để họ nhận biết Cha[a], Đức Chúa Trời chân thật duy nhất, và Đức Giê-su, Đấng Mê-si[b] mà Cha đã sai đến.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn dùng đại từ ngôi thứ hai số ít (“Ngài”); trong ngữ cảnh lời cầu nguyện này, đại từ ấy chỉ Đức Chúa Cha, là Đấng Đức Giê-su đang thưa chuyện.
    reason: Làm rõ quy chiếu theo ngữ cảnh của đại từ Hy Lạp khi bản dịch dùng “Cha” để xưng hô tự nhiên bằng tiếng Việt.
  - marker: b
    text: 'Hoặc theo cách gọi truyền thống: “Đấng Christ”. Từ Hy Lạp Χριστός có thể là tước hiệu “Đấng Mê-si” hoặc, trong một số ngữ cảnh, được dùng gần như một phần của tên gọi “Christ”.'
    reason: Bảo lưu phương án dịch truyền thống cho Χριστός, trong khi bản văn chính giữ nghĩa tước hiệu.
lexical_decisions:
- source_word: αὕτη δέ ἐστιν
  choice: Và ... là thế này
  rationale: Giữ lực nối tiếp của δέ và giới thiệu lời giải thích một cách tự nhiên trong tiếng Việt.
- source_word: ἡ αἰώνιος ζωὴ
  choice: sự sống đời đời
  rationale: Cách diễn đạt quen thuộc và chính xác cho sự sống thuộc về thời đại sẽ đến, mang đặc tính bền vững của sự sống từ Đức Chúa Trời.
- source_word: ἵνα γινώσκωσι
  choice: họ nhận biết
  rationale: Mệnh đề ἵνα ở đây nêu nội dung xác định sự sống đời đời; hiện tại γινώσκωσι gợi sự nhận biết liên tục và có tính tương giao.
- source_word: σὲ
  choice: Cha
  rationale: Đại từ số ít chỉ Đức Chúa Cha là Đấng Đức Giê-su đang cầu nguyện cùng; dùng 'Cha' làm rõ ngôi xưng hô tự nhiên trong tiếng Việt mà không thêm một nhân vật mới.
- source_word: τὸν μόνον ἀληθινὸν θεὸν
  choice: Đức Chúa Trời chân thật duy nhất
  rationale: Giữ nguyên ý nghĩa của μόνον và ἀληθινόν, đồng thời dùng danh xưng trang trọng, phổ biến trong tiếng Việt.
- source_word: καὶ
  choice: và nhận biết
  rationale: Giữ sự liên kết đơn giản; lặp lại động từ trong tiếng Việt để tránh hiểu lầm rằng 'Đức Giê-su' đồng vị trực tiếp với cụm 'Đức Chúa Trời chân thật duy nhất'.
- source_word: ὃν ἀπέστειλας
  choice: mà Cha đã sai đến
  rationale: Diễn đạt tự nhiên hành động sai phái đã xảy ra; 'đến' làm rõ hướng sai phái trong ngữ cảnh sứ mạng mà không đổi nội dung.
- source_word: Ἰησοῦν Χριστόν
  choice: Đức Giê-su, Đấng Mê-si
  rationale: Χριστός vẫn mang nghĩa tước hiệu trong câu này; 'Đấng Mê-si' bảo toàn nghĩa đó, còn dấu phẩy giúp tiếng Việt đọc tự nhiên.
theological_decisions:
- issue: Quan hệ giữa cụm 'Đức Chúa Trời chân thật duy nhất' và Đức Giê-su
  choice: Giữ việc Đức Giê-su thưa với Cha là Đức Chúa Trời chân thật duy nhất và phân biệt Ngài với chính mình là Đấng được Cha sai đến.
  alternative: Diễn giải thêm để khẳng định hoặc phủ định rõ ràng một hệ thống thần học về bản tính của Đức Giê-su.
  rationale: Câu dịch cần giữ nguyên lời văn và sức căng thần học của câu Hy Lạp, không đưa tranh luận giáo lý về sau vào bản văn.
- issue: Cách dịch Χριστόν
  choice: Đấng Mê-si
  alternative: Đấng Christ
  rationale: Trong ngữ cảnh này, sắc thái tước hiệu vẫn rõ; bản dịch chính truyền đạt nghĩa của tước hiệu, còn cách gọi truyền thống được ghi ở chú thích.
- issue: Lặp lại 'nhận biết' trước Đức Giê-su
  choice: và nhận biết Đức Giê-su
  alternative: và Đức Giê-su
  rationale: Tiếng Hy Lạp phối hợp hai bổ ngữ của γινώσκωσι. Việc lặp động từ trong tiếng Việt chỉ làm rõ quan hệ cú pháp, không tách rời hay đồng nhất hai đối tượng vượt quá bản văn.
translation_notes:
  register: 'Văn phong hiện đại, trang trọng và dễ hiểu. Dùng ''Cha'' để thể hiện ngôi thứ hai số ít trong lời cầu nguyện, ''Đức Chúa Trời'' theo lối gọi Tin Lành phổ biến, và ''Đấng Mê-si'' để chuyển nghĩa tước hiệu. Cần sửa dấu chú thích trong câu chính: chú thích về Χριστός phải là [b], không phải [a].'
