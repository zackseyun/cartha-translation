id: JHN.17.14
reference: John 17:14
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐγὼ δέδωκα αὐτοῖς τὸν λόγον σου, καὶ ὁ κόσμος ἐμίσησεν αὐτούς, ὅτι οὐκ εἰσὶν ἐκ τοῦ κόσμου καθὼς ἐγὼ οὐκ εἰμὶ ἐκ τοῦ κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/014.yaml
  text: I have given them your word[a], and the world has hated them because they are not of the world, just as I am not of the world.
translation:
  language: vi
  text: Con đã ban lời của Cha cho họ, và thế gian đã ghét họ, vì họ không đến từ thế gian[a], cũng như Con không đến từ thế gian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “thuộc về thế gian.” Giới từ Hy Lạp theo nghĩa đen chỉ sự xuất phát “từ” và có thể diễn tả nguồn gốc hoặc sự thuộc về.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δέδωκα
  choice: đã ban
  rationale: Thì hoàn thành chỉ hành động đã được thực hiện và còn hiệu lực; tiếng Việt tự nhiên dùng “đã ban”, còn ngữ cảnh cho thấy kết quả vẫn tiếp diễn. “Ban” phù hợp với văn cảnh trang trọng về lời đến từ Cha.
- source_word: λόγον
  choice: lời
  rationale: “Lời” vừa tự nhiên vừa giữ được cách dùng giàu ý nghĩa của λόγος trong sách Giăng, thay vì diễn giải hẹp thành “sứ điệp”.
- source_word: κόσμος
  choice: thế gian
  rationale: “Thế gian” là cách dịch quen thuộc và trang trọng cho κόσμος trong văn mạch Giăng, giữ được phạm vi nghĩa rộng; sự chống nghịch được bộc lộ qua việc thế gian ghét các môn đồ.
- source_word: ἐμίσησεν
  choice: đã ghét
  rationale: Thể bất định được chuyển tự nhiên bằng quá khứ “đã ghét”; câu vẫn diễn tả sự thù ghét có thực của thế gian mà không áp đặt sắc thái thời quá mức.
- source_word: ὅτι
  choice: vì
  rationale: Ở đây ὅτι nêu nguyên nhân khiến thế gian ghét họ, nên “vì” rõ ràng và tự nhiên.
- source_word: ἐκ τοῦ κόσμου
  choice: đến từ thế gian
  rationale: “Đến từ” giữ nổi bật ý nguồn gốc của ἐκ và đồng thời để ngỏ hàm ý thuộc về vốn có trong cách diễn đạt của Giăng.
- source_word: καθὼς
  choice: cũng như
  rationale: “Cũng như” đánh dấu rõ sự so sánh giữa quan hệ của các môn đồ với thế gian và quan hệ của Chúa Giê-su với thế gian.
theological_decisions:
- issue: Mối liên hệ của các môn đồ với “thế gian” khi được so sánh với Chúa Giê-su
  choice: không đến từ thế gian, cũng như Con không đến từ thế gian
  alternative: không thuộc về thế gian, cũng như Con không thuộc về thế gian
  rationale: Cách dịch giữ nguyên phép so sánh mạnh trong bản Hy Lạp và ý nguồn gốc của ἐκ, nhưng không giải thích thêm theo hướng bản thể học hoặc chỉ thuần túy xã hội. Chú thích ghi nhận sắc thái thuộc về.
- issue: Đại từ giữa Chúa Giê-su và Đức Chúa Cha trong lời cầu nguyện
  choice: Con … Cha
  alternative: tôi … Ngài
  rationale: Trong tiếng Việt, “Con/Cha” truyền đạt tự nhiên và trang trọng quan hệ được xác lập rõ trong văn cảnh lời cầu nguyện, mà không thêm một danh xưng giáo phái.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “lời”, “thế gian” để giữ cách diễn đạt đặc trưng của sách Giăng; dùng “đến từ” trong câu chính nhằm bảo toàn sự căng nghĩa giữa nguồn gốc và sự thuộc về.
