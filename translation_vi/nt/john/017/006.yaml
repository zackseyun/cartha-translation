id: JHN.17.6
reference: John 17:6
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἐφανέρωσά σου τὸ ὄνομα τοῖς ἀνθρώποις οὓς ⸀ἔδωκάς μοι ἐκ τοῦ κόσμου. σοὶ ἦσαν κἀμοὶ αὐτοὺς ⸁ἔδωκας, καὶ τὸν λόγον σου τετήρηκαν.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/006.yaml
  text: I have made your name known to the men whom you gave me out of the world. They were yours, and you gave them to me, and they have kept your word.
translation:
  language: vi
  text: Con đã bày tỏ danh Cha[a] cho những người[b] Cha đã ban cho con từ giữa thế gian[c]. Họ vốn thuộc về Cha; Cha đã ban họ cho con, và họ đã giữ lời Cha[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đã làm cho danh Cha được biết đến.” “Danh Cha” nói đến căn tính và phẩm tính được mặc khải của Đức Chúa Trời, không chỉ là một tên gọi.'
    reason: lexical_alternative_and_cultural_note
  - marker: b
    text: Từ Hy Lạp có thể chỉ “người ta” nói chung; trong văn mạch trực tiếp, từ này nói đến các môn đồ nam của Chúa Giê-xu.
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “từ thế gian.”'
    reason: lexical_alternative
  - marker: d
    text: 'Cũng có thể hiểu: “họ đã tuân giữ lời Cha” hoặc “họ đã vâng theo lời Cha”; sát nghĩa hơn là “họ đã giữ lời Cha.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐφανέρωσά
  choice: đã bày tỏ
  rationale: Động từ φανερόω diễn tả việc làm cho điều gì được tỏ lộ hoặc được biết đến. “Bày tỏ” tự nhiên, trang trọng và giữ được sắc thái mặc khải.
- source_word: τὸ ὄνομα
  choice: danh Cha
  rationale: Giữ hình ảnh cụ thể “danh” của nguyên văn; trong văn mạch, từ này bao hàm căn tính và phẩm tính được mặc khải của Đức Chúa Trời, chứ không chỉ là một tên gọi.
- source_word: τοῖς ἀνθρώποις
  choice: cho những người
  rationale: ἄνθρωποι có thể chỉ con người nói chung hoặc một nhóm người cụ thể. “Những người” là cách diễn đạt tự nhiên trong tiếng Việt và không áp đặt giới tính vào chính từ ngữ, dù đối tượng trực tiếp ở đây là các môn đồ nam của Chúa Giê-xu.
- source_word: οὓς ἔδωκάς μοι
  choice: Cha đã ban cho con
  rationale: Diễn đạt trực tiếp hành động của Cha ban những người ấy cho Con, đồng thời dùng trật tự từ tự nhiên của tiếng Việt.
- source_word: ἐκ τοῦ κόσμου
  choice: từ giữa thế gian
  rationale: ἐκ mang ý nghĩa được lấy ra từ trong phạm vi thế gian. “Từ giữa thế gian” thể hiện rõ sắc thái xuất phát từ bên trong đó hơn cách nói đơn thuần “từ thế gian”.
- source_word: σοὶ ἦσαν
  choice: Họ vốn thuộc về Cha
  rationale: Mệnh đề Hy Lạp ngắn gọn mang nghĩa sở hữu. “Vốn thuộc về Cha” vừa tự nhiên vừa chuyển tải trạng thái có trước việc họ được ban cho Con.
- source_word: κἀμοὶ αὐτοὺς ἔδωκας
  choice: Cha đã ban họ cho con
  rationale: Giữ nguyên lời khẳng định rằng Cha ban họ cho Con, không thêm một cơ chế thần học nào cho hành động ấy.
- source_word: τὸν λόγον σου
  choice: lời Cha
  rationale: λόγος có thể là lời, sứ điệp hoặc giáo huấn. “Lời Cha” giữ được từ ngữ cụ thể và âm hưởng thần học của sách Giăng mà không diễn giải quá mức.
- source_word: τετήρηκαν
  choice: họ đã giữ
  rationale: Thì hoàn thành của τηρέω chỉ hành động đã xảy ra với kết quả còn hiệu lực. “Đã giữ” bảo tồn phạm vi nghĩa gồm gìn giữ, tuân giữ và vâng theo, thay vì thu hẹp thành riêng ý “vâng lời”.
theological_decisions:
- issue: Ý nghĩa của “danh Cha”
  choice: Giữ từ “danh” trong chính văn
  alternative: Diễn giải thành “Cha là ai” hoặc “bản tính của Cha”
  rationale: Cụm từ nói đến căn tính và phẩm tính được mặc khải của Cha, nhưng nguyên văn dùng hình ảnh “danh”. Giữ từ này bảo tồn chiều sâu thần học và tránh thu hẹp ý nghĩa.
- issue: Phạm vi chỉ định của τοῖς ἀνθρώποις
  choice: Dịch là “những người”
  alternative: Dịch rõ giới tính là “những người nam” hoặc khái quát là “mọi người”
  rationale: Danh từ có thể được dùng theo nghĩa chung, còn đối tượng trực tiếp trong văn mạch là nhóm môn đồ nam. “Những người” giữ được tính tự nhiên và sự linh hoạt của nguyên văn; chú thích nêu rõ vấn đề văn mạch.
- issue: Việc Cha ban người ta cho Con
  choice: Giữ nguyên lời khẳng định mà không giải thích cơ chế
  alternative: Diễn giải theo một hệ thống thần học cụ thể về sự tuyển chọn hoặc đáp ứng của con người
  rationale: Câu này xác nhận rằng Cha đã ban họ cho Con nhưng không trình bày đầy đủ cơ chế hay trình tự thần học. Bản dịch không nên giải quyết thay cho nguyên văn sự căng thẳng này.
translation_notes:
  register: Văn phong cầu nguyện trang trọng nhưng hiện đại và dễ hiểu. Dùng “Cha/con” theo quan hệ xưng hô trực tiếp trong văn mạch; viết hoa “Cha” như danh xưng chỉ Đức Chúa Trời. Cấu trúc câu giữ sự ngắn gọn, long trọng của nguyên văn.
