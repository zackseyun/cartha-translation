id: JHN.17.8
reference: John 17:8
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὅτι τὰ ῥήματα ἃ ⸀ἔδωκάς μοι δέδωκα αὐτοῖς, καὶ αὐτοὶ ἔλαβον καὶ ἔγνωσαν ἀληθῶς ὅτι παρὰ σοῦ ἐξῆλθον, καὶ ἐπίστευσαν ὅτι σύ με ἀπέστειλας.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/008.yaml
  text: For the words that you gave me I have given to them[a], and they received them and truly came to know that I came from you[b], and they believed that you sent me.
translation:
  language: vi
  text: Vì những lời Cha đã ban cho con, con đã ban cho họ[a]. Họ đã tiếp nhận những lời ấy và thật sự nhận biết rằng con đến từ Cha[b]; họ cũng tin rằng Cha đã sai con.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “những lời phán Cha đã ban cho con, con đã ban cho họ.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “con ra từ Cha.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ῥήματα
  choice: những lời
  rationale: Giữ nghĩa số nhiều cụ thể của các lời phán hay lời nói, tự nhiên hơn trong tiếng Việt và ít diễn giải hơn “sứ điệp”.
- source_word: ἔδωκάς ... δέδωκα
  choice: đã ban ... đã truyền lại
  rationale: “Ban” phù hợp với lời Cha trao cho Con; “truyền lại” diễn đạt tự nhiên việc Con trao chính những lời ấy cho các môn đồ. Tiếng Việt không đánh dấu trực tiếp sự đối lập thể aorist–perfect, nhưng “đã” vẫn thể hiện hành động hoàn tất.
- source_word: αὐτοῖς
  choice: cho họ
  rationale: 'Thể hiện rõ quan hệ tặng cách: các lời được truyền cho các môn đồ.'
- source_word: ἔλαβον
  choice: đã tiếp nhận
  rationale: Trong văn mạch mặc khải, “tiếp nhận” tự nhiên và bao hàm hơn nghĩa vật lý “cầm lấy”, nhưng không diễn giải quá mức thành “vâng theo”.
- source_word: ἔγνωσαν ἀληθῶς
  choice: thật sự nhận biết
  rationale: “Nhận biết” chuyển tải việc đạt đến sự hiểu biết hay nhận ra, còn “thật sự” giữ nguyên sức nhấn của ἀληθῶς.
- source_word: παρὰ σοῦ ἐξῆλθον
  choice: con đến từ Cha
  rationale: Diễn đạt nguồn gốc bằng tiếng Việt hiện đại, đồng thời không quyết định thêm cách hiểu thần học mà câu Hy Lạp không nói rõ.
- source_word: ἐπίστευσαν
  choice: tin rằng
  rationale: Động từ đi với mệnh đề ὅτι, nên “tin rằng” giữ đúng cấu trúc niềm tin vào tính chân thật của mệnh đề.
- source_word: ἀπέστειλας
  choice: đã sai
  rationale: “Sai” là cách diễn đạt Kinh Thánh trang trọng nhưng vẫn thông dụng cho hành động Cha phái Con đến; không thêm sắc thái diễn giải như “ủy nhiệm”.
- source_word: ὅτι
  choice: Vì
  rationale: ὅτι đầu câu mang chức năng giải thích hoặc nêu lý do cho lời trước đó; “Vì” nối kết tự nhiên với văn mạch.
theological_decisions:
- issue: Quan hệ giữa Chúa Giê-su và Cha trong παρὰ σοῦ ἐξῆλθον
  choice: con đến từ Cha
  alternative: con ra từ Cha
  rationale: “Đến từ Cha” bảo toàn lời khẳng định về nguồn gốc mà không nhập thêm thuật ngữ tín lý; phương án “ra từ Cha” gần hình thái động từ hơn nhưng kém tự nhiên và có thể bị hiểu theo nghĩa không gian.
- issue: Cách chuyển πιστεύω với mệnh đề ὅτι
  choice: tin rằng chính Cha đã sai con
  alternative: tin cậy rằng Cha đã sai con
  rationale: “Tin rằng” phản ánh trực tiếp mệnh đề chỉ nội dung được tin; “tin cậy” có thể chuyển trọng tâm sang quan hệ cá nhân và làm mờ cú pháp.
- issue: Cách xưng hô giữa Con và Cha
  choice: Cha ... con
  alternative: Ngài ... con / Cha ... Con
  rationale: Văn mạch là lời Chúa Giê-su cầu nguyện với Cha, nên “Cha–con” tự nhiên, trang trọng và làm rõ đối tượng của đại từ ngôi thứ hai mà không thêm danh xưng ngoài văn mạch.
translation_notes:
  register: 'Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Cha–con” theo ngữ cảnh lời cầu nguyện. Dấu chấm và chấm phẩy chia chuỗi mệnh đề dài của tiếng Hy Lạp để câu tiếng Việt sáng rõ, nhưng vẫn giữ tiến trình: trao lời, tiếp nhận, nhận biết và tin.'
