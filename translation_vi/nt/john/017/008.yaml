  to: Vì những lời Cha đã ban cho con, con đã ban cho họ[a]. Họ đã tiếp nhận những lời ấy và thật sự nhận biết rằng con đến từ Cha[b]; họ cũng tin rằng Cha đã sai con.
  rationale: 'Sửa duy nhất các chỗ có thể làm lệch sắc thái nguyên văn: thay “truyền lại” bằng “ban cho” để phản ánh δίδωμι, và bỏ “chính” để không thêm nhấn mạnh. Giữ nguyên cách diễn đạt “đến từ Cha” cùng các chú thích từ vựng, vì chúng vừa tự nhiên vừa bảo toàn khẳng định về nguồn gốc mà không áp đặt diễn giải tín lý.'
