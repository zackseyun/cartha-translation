  naturalness: Cấu trúc “Mọi điều của Con đều là của Cha, và mọi điều của Cha là của Con” tự nhiên, trang trọng, và giữ được thế đối xứng. “Được tôn vinh trong họ” vẫn rõ nghĩa trong văn cảnh cầu nguyện và phù hợp với văn phong Kinh Thánh hiện đại.
