  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ τὰ ἐμὰ πάντα σά ἐστιν καὶ τὰ σὰ ἐμά, καὶ δεδόξασμαι ἐν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/010.yaml
  text: And all that is mine is yours[a], and what is yours is mine, and I have been glorified in them.
translation:
  language: vi
  text: Mọi điều của Con đều là của Cha, và mọi điều của Cha là của Con; Con đã được tôn vinh trong họ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “qua họ” hoặc “giữa họ”. Tiếng Hy Lạp nói “trong họ”, có thể diễn tả ý ở trong, phương tiện, hoặc sự biểu lộ trong ngữ cảnh này.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ἐμὰ πάντα
  choice: mọi điều của Con
  rationale: Cụm trung tính số nhiều với πᾶς chỉ cách bao quát tất cả những gì thuộc về Đức Giê-su. “Mọi điều của Con” tự nhiên, trang trọng và không khiến câu bị hiểu quá thiên về tài sản vật chất.
- source_word: σά
  choice: của Cha
  rationale: Tính từ sở hữu được diễn đạt bằng kết cấu sở hữu tự nhiên trong tiếng Việt. Đại từ “Cha” được dùng theo ngữ cảnh lời cầu nguyện trực tiếp của Đức Giê-su.
- source_word: τὰ σὰ ἐμά
  choice: mọi điều của Cha cũng là của Con
  rationale: Cách diễn đạt này giữ sự sở hữu tương hỗ và cấu trúc song song của nguyên văn; “cũng” làm rõ thế đối ứng mà không thêm nội dung thần học.
- source_word: δεδόξασμαι
  choice: Con đã được tôn vinh
  rationale: Thể hoàn thành bị động diễn tả hành động đã xảy ra với kết quả còn hiệu lực. “Đã được tôn vinh” giữ được cả sắc thái hoàn thành lẫn thể bị động.
- source_word: ἐν αὐτοῖς
  choice: nơi họ
  rationale: “Nơi họ” bảo tồn ý cơ bản của ἐν và nghe tự nhiên hơn “trong họ” trong tiếng Việt; đại từ số nhiều chỉ những người được nhắc đến trong ngữ cảnh. Các sắc thái phương tiện hay phạm vi vẫn được ghi ở chú thích.
theological_decisions:
- issue: Sự sở hữu tương hỗ giữa Con và Cha
  choice: 'Giữ nguyên lời khẳng định trực tiếp: “mọi điều của Con đều là của Cha, mọi điều của Cha cũng là của Con.”'
  alternative: Giảm nhẹ thành sự cộng tác hoặc cùng thi hành chức năng.
  rationale: Nguyên văn khẳng định rõ sự sở hữu tương hỗ. Bản dịch không làm yếu lời này, đồng thời cũng không đưa vào câu các thuật ngữ tín điều xuất hiện về sau.
- issue: Sở chỉ và sắc thái của ἐν αὐτοῖς
  choice: Dùng “nơi họ” trong chính văn.
  alternative: “qua họ” theo nghĩa phương tiện, hoặc “giữa họ” theo nghĩa hiện diện trong một tập thể.
  rationale: Giới từ ἐν có thể mang nhiều sắc thái theo ngữ cảnh. “Nơi họ” giữ được sự mơ hồ chân thực của nguyên văn, còn các cách hiểu cụ thể hơn được nêu trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Con/Cha” theo vai giao tiếp trong lời cầu nguyện của Đức Giê-su. Cấu trúc song song được giữ để bảo toàn sức nặng và tính cân xứng của câu Hy Lạp.
