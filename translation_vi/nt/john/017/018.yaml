  text: καθὼς ἐμὲ ἀπέστειλας εἰς τὸν κόσμον, κἀγὼ ἀπέστειλα αὐτοὺς εἰς τὸν κόσμον·
base_translation:
  language: en
  yaml_path: translation/nt/john/017/018.yaml
  text: Just as you sent me into the world, I also sent them into the world.
translation:
  language: vi
  text: Như Cha đã sai con vào thế gian, con cũng đã sai họ vào thế gian.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθὼς
  choice: Như
  rationale: Diễn tả rõ sự đối chiếu tương ứng giữa việc Cha sai Đức Chúa Giê-su và việc Ngài sai các môn đồ, đồng thời tự nhiên trong tiếng Việt.
- source_word: ἐμὲ
  choice: con
  rationale: Trong lời cầu nguyện trực tiếp với Cha, đại từ “con” thể hiện đúng quan hệ và ngữ cảnh giao tiếp hơn cách dịch máy móc là “tôi”.
- source_word: ἀπέστειλας / ἀπέστειλα
  choice: đã sai / sai
  rationale: Giữ cùng một động từ “sai” để bảo toàn phép song song có chủ ý trong nguyên văn; “sai phái” có thể làm câu nặng hơn và diễn giải thêm sắc thái ủy nhiệm.
- source_word: εἰς τὸν κόσμον
  choice: vào thế gian
  rationale: “Vào” bảo toàn hướng chuyển động của εἰς; “thế gian” là cách diễn đạt trang trọng, quen thuộc cho κόσμος trong văn mạch Giăng và vẫn giữ được trường nghĩa rộng.
- source_word: κἀγὼ
  choice: thì con cũng
  rationale: “Cũng” chuyển tải lực bổ sung của καί, còn “thì” làm rõ cấu trúc đối chiếu tương ứng một cách tự nhiên trong tiếng Việt.
- source_word: αὐτοὺς
  choice: họ
  rationale: Chỉ các môn đồ trong văn cảnh mà không bổ sung danh xưng không có trong câu Hy Lạp.
theological_decisions:
- issue: Sự tương ứng giữa việc Cha sai Con và việc Con sai các môn đồ
  choice: Giữ phép song song bằng cùng động từ “sai ... sai”.
  alternative: “sai ... ủy nhiệm” hoặc “sai ... sai phái”
  rationale: Nguyên văn nhấn mạnh sự tương ứng trong sứ mạng nhưng không khẳng định địa vị hay bản chất sứ mạng hoàn toàn đồng nhất. Dùng cùng một động từ bảo toàn sự căng thẳng ấy mà không diễn giải quá mức.
- issue: Cách xưng hô của Đức Chúa Giê-su với Cha
  choice: Dịch ἐμέ và ἐγώ là “con”.
  alternative: “tôi” hoặc “Ta”
  rationale: “Con” phù hợp với lời cầu nguyện hướng đến Cha trong ngữ cảnh gần, diễn đạt quan hệ được văn mạch nêu rõ mà không thêm một tước hiệu vào câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu giữ nhịp song song của nguyên bản; không cần chú thích vì không có dị bản hay sự mơ hồ từ vựng đáng kể cần đưa vào bản văn.
