id: JHN.17.15
reference: John 17:15
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οὐκ ἐρωτῶ ἵνα ἄρῃς αὐτοὺς ἐκ τοῦ κόσμου ἀλλ’ ἵνα τηρήσῃς αὐτοὺς ἐκ τοῦ πονηροῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/015.yaml
  text: I am not asking that you take them out of the world[a], but that you keep them from the evil one.
translation:
  language: vi
  text: Con không cầu xin Cha đem họ ra khỏi thế gian, nhưng xin Cha gìn giữ họ khỏi Kẻ Ác.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “gìn giữ họ khỏi điều ác.” Cụm từ Hy Lạp τοῦ πονηροῦ có thể chỉ “Kẻ Ác” hoặc “điều ác.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐρωτῶ
  choice: cầu xin
  rationale: Động từ hiện tại ngôi thứ nhất số ít diễn tả lời thỉnh cầu đang được Chúa Giê-su dâng lên. “Cầu xin” vừa tự nhiên trong ngữ cảnh cầu nguyện vừa giữ nghĩa căn bản là xin, không quá nghi lễ.
- source_word: ἄρῃς
  choice: đem ... ra khỏi
  rationale: Trong cấu trúc với ἐκ τοῦ κόσμου, αἴρω mang nghĩa lấy đi hoặc đưa ra khỏi; cách nói này tự nhiên trong tiếng Việt và thể hiện rõ chuyển động ra khỏi thế gian.
- source_word: κόσμου
  choice: thế gian
  rationale: Trong văn mạch Giăng, κόσμος thường chỉ thế giới loài người trong tình trạng xa cách Đức Chúa Trời. “Thế gian” là cách dịch quen thuộc, trang trọng và vẫn giữ được độ rộng nghĩa của từ.
- source_word: τηρήσῃς
  choice: gìn giữ
  rationale: τηρέω có thể mang nghĩa giữ gìn, bảo vệ hoặc bảo toàn. “Gìn giữ” phù hợp với lời cầu xin sự bảo hộ mà không quy định quá cụ thể cách thức bảo vệ.
- source_word: ἐκ
  choice: khỏi
  rationale: Sau τηρέω, giới từ ἐκ diễn tả sự gìn giữ khỏi một mối nguy. “Khỏi” tự nhiên trong tiếng Việt và duy trì sự tương phản với “ra khỏi” ở mệnh đề trước.
- source_word: τοῦ πονηροῦ
  choice: Kẻ Ác
  rationale: Tính từ có mạo từ ở dạng sở hữu cách có thể là giống đực, chỉ một tác nhân ác, hoặc giống trung, chỉ điều ác. Văn phong Giăng nghiêng về nghĩa chỉ một hữu thể đối nghịch; viết hoa “Kẻ Ác” làm rõ cách hiểu chính, còn nghĩa phi nhân xưng được giữ trong chú thích.
theological_decisions:
- issue: τοῦ πονηροῦ chỉ “Kẻ Ác” hay “điều ác”
  choice: Kẻ Ác
  alternative: điều ác
  rationale: Hình thức Hy Lạp thực sự mơ hồ giữa giống đực và giống trung. Cách dùng trong các trước tác của Giăng và văn mạch về sự bảo vệ nghiêng về một tác nhân cá nhân, nhưng không đủ để loại bỏ nghĩa “điều ác”; vì vậy phương án ấy được ghi ở chú thích.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Cặp “đem họ ra khỏi thế gian” và “gìn giữ họ khỏi Kẻ Ác” giữ sự đối lập của hai mệnh đề; đại từ “Con—Cha” phản ánh quan hệ được xác lập trong lời cầu nguyện của Chúa Giê-su.
