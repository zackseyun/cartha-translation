  source_fidelity: 'Bản dịch phản ánh chính xác cấu trúc tương phản của nguyên văn: không xin Cha đem họ ra khỏi thế gian, nhưng xin Cha gìn giữ họ khỏi τοῦ πονηροῦ. “Đem ... ra khỏi,” “thế gian,” và “gìn giữ ... khỏi” diễn đạt trung thành các cụm ἄρῃς ... ἐκ τοῦ κόσμου và τηρήσῃς ... ἐκ. Cách hiểu chính “Kẻ Ác” là khả dĩ trong văn mạch Giăng, đồng thời chú thích giữ lại đúng sự mơ hồ giống đực/trung của τοῦ πονηροῦ.'
  naturalness: Văn câu tự nhiên, rõ ràng và phù hợp tiếng Việt chuẩn hiện đại trong ngữ cảnh lời cầu nguyện. Cặp xưng hô “Con—Cha” thích hợp với diễn ngôn của Chúa Giê-su và không gây gượng ép. “Gìn giữ họ khỏi” là cách kết hợp tự nhiên cho ý bảo vệ/bảo toàn.
  terminology: “Thế gian” giữ được thuật ngữ quen dùng và độ rộng nghĩa của κόσμος trong Giăng. “Kẻ Ác” nhất quán với lựa chọn nghĩa nhân xưng của bản tiếng Anh; viết hoa cho thấy đây là cách hiểu chỉ một tác nhân, không phải khẳng định rằng tiếng Hy Lạp không mơ hồ. Chú thích “điều ác” bảo toàn phương án thay thế cần thiết.
