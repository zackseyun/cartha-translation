id: JHN.17.5
reference: John 17:5
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ νῦν δόξασόν με σύ, πάτερ, παρὰ σεαυτῷ τῇ δόξῃ ᾗ εἶχον πρὸ τοῦ τὸν κόσμον εἶναι παρὰ σοί.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/005.yaml
  text: And now[a], Father[b], glorify me in your presence with the glory that I had with you before the world existed.
translation:
  language: vi
  text: Giờ đây, thưa Cha, xin Cha làm vinh hiển Con bên Cha, bằng vinh quang Con đã có bên Cha trước khi thế gian hiện hữu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δόξασόν
  choice: xin Cha làm vinh hiển Con
  rationale: Động từ mệnh lệnh δοξάζω được diễn đạt bằng lời cầu xin kính trọng trong tiếng Việt; “làm vinh hiển” giữ nguyên trường từ vựng về vinh quang xuyên suốt sách Giăng.
- source_word: παρὰ σεαυτῷ
  choice: bên Cha
  rationale: παρά với cách ba biểu thị sự gần gũi hoặc hiện diện. “Bên Cha” tự nhiên, cô đọng và giữ được sắc thái tương quan lẫn không gian.
- source_word: τῇ δόξῃ
  choice: bằng chính vinh quang
  rationale: Cách ba gắn với hành động làm vinh hiển và chỉ vinh quang được xác định bởi mệnh đề quan hệ. “Chính” làm rõ rằng đây là vinh quang đã được nói đến, chứ không thêm một loại vinh quang khác.
- source_word: ᾗ εἶχον
  choice: Con đã có
  rationale: Thì chưa hoàn thành εἶχον nói đến việc sở hữu vinh quang trước đó; “đã có” là cách diễn đạt tự nhiên và không giải thích quá mức.
- source_word: πρὸ τοῦ τὸν κόσμον εἶναι
  choice: trước khi thế gian hiện hữu
  rationale: Cấu trúc động từ nguyên mẫu có mạo từ diễn tả thời điểm có trước. “Hiện hữu” phản ánh trực tiếp εἶναι và tránh biến nó thành ý ‘được tạo dựng’ vốn không được nêu rõ trong câu.
- source_word: παρὰ σοί
  choice: bên Cha
  rationale: Lặp lại “bên Cha” để bảo toàn sự song hành rõ rệt với παρὰ σεαυτῷ trong nguyên văn.
- source_word: σύ, πάτερ
  choice: thưa Cha, xin Cha
  rationale: Đại từ σύ có tính nhấn mạnh. Tiếng Việt diễn đạt tự nhiên sự trực tiếp và nhấn mạnh ấy bằng lời xưng hô “thưa Cha” rồi nhắc lại chủ thể “Cha” trong lời cầu xin.
- source_word: κόσμον
  choice: thế gian
  rationale: “Thế gian” là cách dịch quen thuộc, trang trọng và phù hợp với κόσμος trong văn mạch Giăng, ở đây chỉ thế giới hiện hữu.
theological_decisions:
- issue: Sự tiền hiện hữu của Con được hàm ý trong câu
  choice: Dịch trực tiếp rằng Con đã có vinh quang bên Cha trước khi thế gian hiện hữu.
  alternative: Làm nhẹ câu thành việc vinh quang chỉ được định trước cho Con trước khi sáng thế.
  rationale: Ngữ pháp nói rằng chính Chúa Giê-su “đã có” vinh quang ấy bên Cha. Bản dịch giữ nguyên lời khẳng định tiền thời gian mà không diễn giải thêm cơ chế hay bản chất.
- issue: Bản chất của vinh quang Con có bên Cha
  choice: Giữ từ “vinh quang” mà không triển khai thành uy nghi, danh dự hay bản tính thần linh.
  alternative: Dịch diễn giải là “uy nghi thần thượng” hoặc chỉ là “danh dự”.
  rationale: δόξα có chiều sâu thần học đặc biệt trong sách Giăng, nhưng câu này không tự định nghĩa đầy đủ bản chất của vinh quang ấy; giữ nguyên thuật ngữ bảo toàn độ căng và tính mở của văn bản.
translation_notes:
  register: Văn phong hiện đại, trang trọng và phù hợp với lời cầu nguyện. Dùng đại từ “Con” và “Cha” theo quan hệ xưng hô trực tiếp trong câu; tránh lối cổ “nay” và tránh thuật ngữ giáo phái. Sự lặp lại “bên Cha” có chủ ý nhằm phản ánh cấu trúc lặp παρὰ σεαυτῷ / παρὰ σοί của nguyên văn.
