  text: νῦν ἔγνωκαν ὅτι πάντα ὅσα ⸀δέδωκάς μοι παρὰ σοῦ ⸀εἰσιν·
base_translation:
  language: en
  yaml_path: translation/nt/john/017/007.yaml
  text: Now they have come to know that everything you have given me is from you[a].
translation:
  language: vi
  text: Giờ đây họ đã nhận biết rằng mọi điều Cha đã ban cho Con đều đến từ Cha.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “mọi điều Cha đã ban cho Con đều là từ Cha.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: νῦν
  choice: Giờ đây
  rationale: Diễn tả giai đoạn hiện tại trong sự nhận biết của các môn đồ; tự nhiên và trang trọng trong tiếng Việt hiện đại.
- source_word: ἔγνωκαν
  choice: họ đã nhận biết
  rationale: Thì hoàn thành diễn tả sự nhận biết đã hình thành và hiện vẫn còn; “đã nhận biết” truyền đạt kết quả hiện tại mà không diễn giải quá mức.
- source_word: πάντα ὅσα
  choice: mọi điều
  rationale: Diễn tả tính toàn thể, đồng thời phù hợp với các thực tại rộng hơn đồ vật hữu hình.
- source_word: δέδωκάς μοι
  choice: Cha đã ban cho Con
  rationale: Giữ sắc thái hoàn thành và ý nghĩa tiếp diễn của điều được ban; dùng “ban” phù hợp với văn cảnh cầu nguyện. Đại từ thân tộc “Cha/Con” làm rõ người nói và người được nói với theo ngữ cảnh.
- source_word: παρὰ σοῦ εἰσιν
  choice: đều đến từ Cha
  rationale: παρά với sở hữu cách chỉ nguồn gốc; “đến từ” diễn đạt tự nhiên rằng mọi điều ấy có nguồn từ Cha.
theological_decisions:
- issue: Mối liên hệ giữa những điều Cha ban cho Con và nguồn gốc của chúng
  choice: mọi điều Cha đã ban cho Con đều đến từ Cha
  alternative: mọi điều Cha đã ban cho Con đều là từ Cha
  rationale: Cách dịch chính nhấn mạnh nguồn gốc nơi Cha mà không khai triển thành một công thức tín lý; chú thích bảo lưu cách diễn đạt sát cấu trúc hơn.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng lối xưng hô “Cha/Con” theo ngữ cảnh lời cầu nguyện của Chúa Giê-su; viết hoa để xác định các ngôi trong văn cảnh, không thêm nội dung tín lý ngoài câu nguồn.
