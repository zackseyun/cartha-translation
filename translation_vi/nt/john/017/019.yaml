  to: Vì họ, Con tự thánh hóa mình[a], để chính họ cũng được thánh hóa trong chân lý[b].
  rationale: Bản sửa dùng “thánh hóa” ở cả hai vế để tái hiện liên kết từ vựng ἁγιάζω / ἡγιασμένοι. Chú thích a nêu rõ nghĩa thay thế mang tính tự hiến trong ngữ cảnh, thay vì diễn giải giáo lý ngay trong thân câu. Viết hoa “Con” phù hợp với lời Chúa Giê-su thưa cùng Cha và văn phong Kinh Thánh tiếng Việt trang trọng-hiện đại.
