source:
  edition: SBLGNT
  text: καὶ ὑπὲρ αὐτῶν ἐγὼ ἁγιάζω ἐμαυτόν, ἵνα ⸂ὦσιν καὶ αὐτοὶ⸃ ἡγιασμένοι ἐν ἀληθείᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/019.yaml
  text: And for their sake I sanctify myself[b][a], so that they also may be sanctified in truth.
translation:
  language: vi
  text: Vì họ, Con tự thánh hóa mình[a], để chính họ cũng được thánh hóa trong chân lý[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “tự thánh hiến mình” hoặc “tự dâng mình”. Động từ Hy Lạp ở đây cùng gốc với từ được dịch là “được thánh hóa” ở phần sau của câu.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “trong lẽ thật”; so sánh câu 17.
    reason: alternative_reading
lexical_decisions:
- source_word: ὑπὲρ αὐτῶν
  choice: Vì họ
  rationale: Diễn đạt tự nhiên ý hành động vì lợi ích của các môn đồ, nhưng không tự ý nhấn mạnh sắc thái thay thế.
- source_word: ἁγιάζω ἐμαυτόν
  choice: con tự thánh hiến mình
  rationale: Trong mệnh đề nói về Chúa Giê-su, “thánh hiến” diễn đạt việc tự biệt riêng và dâng mình cho sứ mạng, tránh gợi ý rằng Ngài chuyển từ không thánh khiết sang thánh khiết. Đại từ “con” phù hợp với lời cầu nguyện hướng về Cha trong ngữ cảnh.
- source_word: ἵνα
  choice: để
  rationale: Giữ rõ ý mục đích của liên từ ἵνα và tự nhiên trong tiếng Việt hiện đại.
- source_word: καὶ αὐτοὶ
  choice: chính họ cũng
  rationale: Giữ cả ý bao gồm của καί và sắc thái nhấn mạnh của αὐτοί.
- source_word: ἡγιασμένοι
  choice: được thánh hóa
  rationale: Thể bị động được giữ lại; cách dịch này cũng phản ánh cùng gốc từ với ἁγιάζω, dù tiếng Việt cần dùng “thánh hiến” ở mệnh đề đầu để diễn đạt đúng ngữ cảnh.
- source_word: ἐν ἀληθείᾳ
  choice: trong chân lý
  rationale: Giữ giới từ và sự không xác định của danh từ không có mạo từ, đồng thời để ngỏ sắc thái phạm vi hoặc thực tại của sự thánh hóa.
theological_decisions:
- issue: Ý nghĩa việc Chúa Giê-su tự thánh hiến
  choice: Dịch là “tự thánh hiến mình,” chỉ sự tự biệt riêng và dâng mình cho sứ mạng vì các môn đồ.
  alternative: “tự thánh hóa mình” hoặc “làm cho mình nên thánh”
  rationale: Trong ngữ cảnh, động từ không nhất thiết nói đến việc trở nên tinh sạch hơn về đạo đức. “Thánh hiến” bảo toàn ý biệt riêng cho Đức Chúa Trời mà không áp đặt quan niệm Chúa Giê-su trước đó thiếu thánh khiết.
- issue: Sắc thái của ἐν ἀληθείᾳ
  choice: “trong chân lý”
  alternative: “trong lẽ thật” hoặc “bởi chân lý”
  rationale: Cụm Hy Lạp không có mạo từ và ἐν tự nhiên chỉ phạm vi; bản dịch không biến nó thành phương tiện một cách dứt khoát, đồng thời vẫn giữ liên hệ với câu 17.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại. Dùng “con” vì đây là lời Chúa Giê-su thưa với Cha trong toàn bộ lời cầu nguyện. Cặp “thánh hiến/thánh hóa” ưu tiên nghĩa đúng theo từng ngữ cảnh, còn chú thích bảo tồn mối liên hệ từ nguyên trong tiếng Hy Lạp.
