    rationale: Nguyên văn dùng ἁγιάζω cho hành động của Chúa Giê-su và ἡγιασμένοι, phân từ hoàn thành bị động cùng gốc, cho các môn đồ. “Thánh hiến/thánh hóa” truyền tải ngữ cảnh nhưng che khuất liên kết này. Dùng “thánh hóa” nhất quán, kèm chú thích về nghĩa “tự thánh hiến”, bảo toàn cả liên kết lẫn sắc thái ngữ cảnh.
