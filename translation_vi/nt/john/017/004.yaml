base_translation:
  language: en
  yaml_path: translation/nt/john/017/004.yaml
  text: I glorified you on the earth by completing the work that you have given me to do[a].
translation:
  language: vi
  text: Con đã làm vinh hiển Cha trên đất bằng cách hoàn tất công việc Cha đã giao cho Con làm[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Con đã làm vinh hiển Cha trên đất, đã hoàn tất công việc Cha đã giao cho Con làm.”'
    reason: Bảo lưu cách hiểu phân từ τελειώσας theo sắc thái hoàn cảnh đi kèm hoặc thời gian, thay vì nêu rõ quan hệ phương cách.
lexical_decisions:
- source_word: ἐδόξασα
  choice: đã làm vinh hiển
  rationale: 'Giữ sắc thái thần học nổi bật của δοξάζω trong Giăng: Đức Con bày tỏ và đem lại vinh hiển cho Đức Cha; cách dịch này đầy đủ hơn từ đơn thuần ''tôn kính''.'
- source_word: ἐπὶ τῆς γῆς
  choice: trên đất
  rationale: Diễn đạt tự nhiên trong tiếng Việt hiện đại, đồng thời giữ nghĩa không gian của ἐπί với sở hữu cách.
- source_word: τελειώσας
  choice: bằng cách hoàn tất
  rationale: 'Hiểu phân từ bất định như chỉ phương cách: việc hoàn tất công việc giải thích Đức Con đã làm vinh hiển Đức Cha như thế nào.'
- source_word: τὸ ἔργον
  choice: công việc
  rationale: Là cách tương ứng trực tiếp và tự nhiên với ἔργον trong ngữ cảnh sứ mạng Đức Cha giao cho Đức Con.
- source_word: δέδωκάς μοι
  choice: Cha đã giao cho Con
  rationale: Trong tiếng Việt, 'giao công việc' tự nhiên hơn 'ban/cho công việc'; thì hoàn thành Hy Lạp được thể hiện bằng 'đã' và kết quả vẫn có hiệu lực trong ngữ cảnh.
- source_word: ἵνα ποιήσω
  choice: cho Con làm
  rationale: Diễn đạt tự nhiên mục đích gắn với động từ 'giao', không làm câu nặng nề.
- source_word: ἐγώ σε
  choice: Con ... Cha
  rationale: Ngữ cảnh lời cầu nguyện giữa Đức Con và Đức Cha khiến đại từ thân tộc 'Con—Cha' vừa rõ nghĩa vừa tự nhiên trong tiếng Việt; không thêm từ nhấn mạnh tương đương 'chính Con' vì không cần thiết.
theological_decisions:
- issue: Quan hệ giữa việc Đức Con làm vinh hiển Đức Cha và phân từ τελειώσας
  choice: 'Dịch theo nghĩa phương cách: Đức Con làm vinh hiển Đức Cha bằng cách hoàn tất công việc được giao.'
  alternative: 'Có thể hiểu theo nghĩa thời gian hoặc hoàn cảnh đi kèm: ''sau khi/đã hoàn tất công việc...'''
  rationale: Cú pháp tự nhiên nhất cho thấy phân từ giải thích cách thức Đức Con làm vinh hiển Đức Cha, nhưng chú thích vẫn bảo lưu khả năng dịch sát hình thức hơn mà không mở rộng thành một khẳng định giáo lý ngoài câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng cặp xưng hô “Con—Cha” theo ngữ cảnh trực tiếp của lời cầu nguyện; tránh lối diễn đạt cổ như “nơi thế gian” hoặc “đặng làm”. Marker [a] xuất hiện trong chính văn.
