  source_fidelity: 'Chính văn truyền đạt chính xác các yếu tố của câu Hy Lạp: “Con” làm vinh hiển “Cha,” trong phạm vi trần thế, và phân từ τελειώσας được hiểu hợp lý theo nghĩa phương cách. “Công việc Cha đã giao cho Con làm” phản ánh tốt τὸ ἔργον ὃ δέδωκάς μοι ἵνα ποιήσω. Tuy nhiên, chú thích dùng “sau khi hoàn tất” làm mạnh sắc thái trước-sau thời gian hơn điều phân từ bất định tự nó đòi hỏi.'
