id: JHN.17.12
reference: John 17:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὅτε ἤμην μετ’ ⸀αὐτῶν ἐγὼ ἐτήρουν αὐτοὺς ἐν τῷ ὀνόματί σου ⸀ᾧ δέδωκάς μοι, ⸀καὶ ἐφύλαξα, καὶ οὐδεὶς ἐξ αὐτῶν ἀπώλετο εἰ μὴ ὁ υἱὸς τῆς ἀπωλείας, ἵνα ἡ γραφὴ πληρωθῇ.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/012.yaml
  text: While I was with them[a], I kept them in your name, which you have given me, and I guarded them, and not one of them perished except the son of destruction[b], so that the Scripture might be fulfilled.
translation:
  language: vi
  text: Khi còn ở với họ, chính con đã gìn giữ họ trong danh Cha, là danh Cha đã ban cho con. Con đã bảo vệ họ, và không một ai trong họ bị hư mất[a], ngoại trừ con của sự hư mất[b], để lời Kinh Thánh được ứng nghiệm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “không một ai trong họ bị mất.”'
    reason: lexical_alternative
  - marker: b
    text: “Con của sự hư mất” là cách nói kiểu Hê-bơ-rơ; cũng có thể hiểu là “người thuộc về sự hư mất.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε ἤμην μετ’ αὐτῶν
  choice: Khi còn ở với họ
  rationale: Diễn đạt tự nhiên mệnh đề thời gian và trạng thái kéo dài trong quá khứ; “còn” gợi thời gian Chúa Giê-su hiện diện với các môn đồ.
- source_word: ἐγὼ ἐτήρουν αὐτοὺς
  choice: chính con đã gìn giữ họ
  rationale: “Chính con” thể hiện sự nhấn mạnh của đại từ ἐγώ; “gìn giữ” phù hợp với hành động liên tục của thể chưa hoàn thành mà vẫn tự nhiên trong tiếng Việt.
- source_word: ἐν τῷ ὀνόματί σου
  choice: trong danh Cha
  rationale: Giữ cách nói giàu ý nghĩa thần học của nguyên văn, không diễn giải riêng thành quyền năng hay thẩm quyền. Đại từ Cha–con phù hợp với lời cầu nguyện trong ngữ cảnh.
- source_word: ᾧ δέδωκάς μοι
  choice: là danh Cha đã ban cho con
  rationale: Đại từ quan hệ giống trung số ít quy chiếu tự nhiên về “danh”, không phải về các môn đồ; cách lặp “danh” giúp quan hệ này rõ ràng trong tiếng Việt.
- source_word: καὶ ἐφύλαξα
  choice: Con đã bảo vệ họ
  rationale: Dùng “bảo vệ” để phân biệt φυλάσσω với τηρέω (“gìn giữ”), đồng thời truyền đạt sắc thái canh giữ, che chở.
- source_word: οὐδεὶς ἐξ αὐτῶν ἀπώλετο
  choice: không một ai trong họ bị hư mất
  rationale: “Bị hư mất” mang sắc thái nghiêm trọng của ἀπόλλυμι và quen thuộc trong văn mạch Giăng; ghi chú giữ phương án “bị mất”.
- source_word: εἰ μὴ ὁ υἱὸς τῆς ἀπωλείας
  choice: ngoại trừ đứa con của sự hư mất
  rationale: Giữ cấu trúc kiểu Hê-bơ-rơ của nguyên văn thay vì giải nghĩa thành một khẳng định đầy đủ về số phận hay tiền định.
- source_word: ἵνα ἡ γραφὴ πληρωθῇ
  choice: để lời Kinh Thánh được ứng nghiệm
  rationale: “Để” giữ được sắc thái mục đích/kết quả của ἵνα; “lời Kinh Thánh” là cách nói tự nhiên, trang trọng trong tiếng Việt.
theological_decisions:
- issue: Đối tượng mà ᾧ δέδωκάς μοι quy chiếu
  choice: 'Mệnh đề quan hệ bổ nghĩa cho “danh Cha”: “là danh Cha đã ban cho con.”'
  alternative: 'Hiểu là các môn đồ: “những người Cha đã ban cho con.”'
  rationale: Trong bản văn SBLGNT được cung cấp, ᾧ là đại từ quan hệ trung số ít, phù hợp tự nhiên với ὀνόματι (“danh”, trung số ít), chứ không với αὐτούς (“họ”, nam số nhiều). Bản dịch theo ngữ pháp của bản văn nguồn, không hòa đồng với cách diễn đạt quen thuộc ở những câu khác.
- issue: Ý nghĩa của ὁ υἱὸς τῆς ἀπωλείας
  choice: Giữ thành ngữ ở dạng “đứa con của sự hư mất.”
  alternative: “kẻ thuộc về sự hư mất” hoặc “kẻ bị định cho sự hư mất.”
  rationale: Cách dịch chính giữ hình thức thành ngữ và sự căng thẳng thần học, không tự ý biến nó thành một tuyên bố giáo lý về tiền định hay sự ruồng bỏ.
- issue: Quan hệ xưng hô trong lời cầu nguyện
  choice: Dùng “Cha–con.”
  alternative: Dùng “Ngài–tôi.”
  rationale: Ngữ cảnh xác định Chúa Giê-su đang thưa với Cha; cách xưng hô Cha–con tự nhiên, trang trọng và dễ hiểu trong tiếng Việt, không thêm một nét giáo phái riêng.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng lối xưng hô “Cha–con” theo ngữ cảnh lời cầu nguyện. Phân biệt “gìn giữ” với “bảo vệ” để phản ánh hai động từ Hy Lạp khác nhau, đồng thời giữ nguyên thành ngữ thần học thay vì giải nghĩa quá mức.
