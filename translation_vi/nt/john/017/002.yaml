id: JHN.17.2
reference: John 17:2
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καθὼς ἔδωκας αὐτῷ ἐξουσίαν πάσης σαρκός, ἵνα πᾶν ὃ δέδωκας αὐτῷ ⸀δώσῃ αὐτοῖς ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/002.yaml
  text: just as you gave him authority over all flesh[a], so that to all whom you have given him[b], he may give eternal life.
translation:
  language: vi
  text: như Cha đã ban cho Con thẩm quyền trên mọi người phàm[a], để Con ban sự sống đời đời cho tất cả những người Cha đã ban cho Con[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “trên toàn thể loài người.” Nguyên văn Hy Lạp là “trên mọi xác thịt,” một thành ngữ Kinh Thánh chỉ loài người.
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn sát nghĩa là “tất cả những gì Cha đã ban cho Con”; tiếng Hy Lạp dùng một biểu thức tập hợp ở giống trung số ít để chỉ những người được ban cho Con.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς
  choice: như
  rationale: Diễn tả sự tương ứng với lời cầu xin ở câu trước; “như” tự nhiên trong tiếng Việt và vẫn giữ lực so sánh.
- source_word: ἔδωκας
  choice: đã ban
  rationale: Thì aorist chỉ hành động Cha trao thẩm quyền cho Con; “ban” phù hợp với văn cảnh trang trọng và quan hệ Cha–Con.
- source_word: ἐξουσίαν
  choice: thẩm quyền
  rationale: Diễn đạt quyền được trao và quyền cai quản, không chỉ là sức mạnh.
- source_word: πάσης σαρκός
  choice: trên mọi người phàm
  rationale: Giữ sắc thái của thành ngữ Kinh Thánh có chữ “xác thịt” nhưng tránh cách nói “mọi xác thịt” dễ gây khó hiểu trong tiếng Việt hiện đại; cụm này chỉ toàn thể loài người.
- source_word: ἵνα
  choice: để
  rationale: Giữ ý mục đích hoặc kết quả dự định một cách tự nhiên trong tiếng Việt.
- source_word: πᾶν ὃ
  choice: tất cả những người
  rationale: Dù nguyên ngữ dùng một biểu thức tập hợp ở giống trung số ít, đối tượng trong văn cảnh là những người được Cha ban cho Con.
- source_word: δέδωκας
  choice: Cha đã ban
  rationale: Thì hoàn thành diễn tả hành động đã hoàn tất và còn hiệu lực; tiếng Việt dùng “đã ban”, còn ý nghĩa tiếp diễn được thể hiện qua văn cảnh.
- source_word: δώσῃ
  choice: Con ban
  rationale: Thể giả định sau ἵνα được chuyển bằng cấu trúc mục đích “để Con ban”, không thêm sắc thái bất định không có trong ngữ cảnh.
- source_word: αὐτοῖς
  choice: cho tất cả những người
  rationale: Liên kết đại từ với tiền ngữ chỉ người để câu tiếng Việt rõ ràng, đồng thời không đồng nhất nhóm này với “mọi người phàm” ở mệnh đề trước.
- source_word: ζωὴν αἰώνιον
  choice: sự sống đời đời
  rationale: Cách diễn đạt quen thuộc, chính xác cho thuật ngữ chủ đạo trong Giăng, bao hàm sự sống không chấm dứt và sự sống thuộc thời đại sẽ đến.
theological_decisions:
- issue: Phạm vi của “mọi người phàm” và đối tượng nhận sự sống đời đời
  choice: Giữ thẩm quyền phổ quát của Con trên mọi người phàm, đồng thời nói riêng đến tất cả những người Cha đã ban cho Con là những người được Con ban sự sống đời đời.
  alternative: Đồng nhất hai nhóm, hoặc diễn giải câu theo một hệ thống thần học rộng hơn hay hẹp hơn điều nguyên văn nói.
  rationale: Nguyên văn phân biệt phạm vi thẩm quyền với nhóm được Cha ban cho Con. Bản dịch giữ nguyên sự căng thẳng thần học này mà không áp đặt một lập trường hệ phái.
- issue: Cách xưng hô giữa Con và Cha trong lời cầu nguyện
  choice: Dùng “Cha” và “Con” thay cho đại từ “Ngài” và “người”.
  alternative: Dịch sát hình thức đại từ là “Ngài đã ban cho người”.
  rationale: Trong tiếng Việt, “Cha/Con” thể hiện rõ người nói và người được thưa chuyện, phù hợp văn cảnh trực tiếp của lời cầu nguyện mà không thêm nội dung thần học ngoài nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Mọi người phàm” giữ phần nào hình ảnh của thành ngữ nguyên ngữ mà không tạo liên tưởng sai như cách dịch máy móc “mọi xác thịt”. Cách xưng hô “Cha/Con” tự nhiên trong lời cầu nguyện của Giăng 17.
