id: JHN.17.25
reference: John 17:25
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸀Πάτερ δίκαιε, καὶ ὁ κόσμος σε οὐκ ἔγνω, ἐγὼ δέ σε ἔγνων, καὶ οὗτοι ἔγνωσαν ὅτι σύ με ἀπέστειλας,
base_translation:
  language: en
  yaml_path: translation/nt/john/017/025.yaml
  text: Righteous Father[a], though the world has not known you, I have known you[b], and these have known that you sent me.
translation:
  language: vi
  text: Lạy Cha công chính, thế gian đã không biết Cha, nhưng con biết Cha, và những người này biết rằng chính Cha đã sai con.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πάτερ δίκαιε
  choice: Lạy Cha công chính
  rationale: Giữ cách xưng hô trực tiếp trang trọng; “công chính” chuyển tải sức nặng đạo đức và thần học của δίκαιος mà không thu hẹp vào sự công bằng pháp lý.
- source_word: καὶ ὁ κόσμος ... ἐγὼ δέ
  choice: thế gian ... nhưng con
  rationale: Καί đầu câu có thể được hiểu theo sắc thái nhượng bộ, nhưng cấu trúc đối lập với δέ cũng được diễn đạt tự nhiên và sát hình thức bằng “thế gian... nhưng con”.
- source_word: ὁ κόσμος
  choice: thế gian
  rationale: Cách dùng quen thuộc trong văn phong Giăng, bảo toàn phạm vi nghĩa nhiều lớp của κόσμος thay vì giải nghĩa ngay thành một nhóm người hay một hệ thống.
- source_word: ἔγνω / ἔγνων / ἔγνωσαν
  choice: đã không biết / biết / biết
  rationale: Tiếng Việt không buộc phải đánh dấu thì như tiếng Anh. “Đã không biết” nêu thực trạng được xác lập của thế gian; “biết” ở hai vế sau tự nhiên hơn và giữ giá trị hiện tại của sự nhận biết.
- source_word: οὗτοι
  choice: những người này
  rationale: Diễn đạt đại từ chỉ định tự nhiên trong tiếng Việt mà không thêm cách gọi giải nghĩa như “các môn đồ”.
- source_word: σύ με ἀπέστειλας
  choice: chính Cha đã sai con
  rationale: “Chính Cha” thể hiện đại từ σύ được nêu rõ để nhấn mạnh; “đã sai” diễn đạt tự nhiên hành động sai phái của động từ aorist.
theological_decisions:
- issue: Thuộc tính δίκαιε của Cha
  choice: Cha công chính
  alternative: Cha công bình
  rationale: “Công chính” giữ nghĩa rộng về sự ngay thẳng và đúng đắn của Đức Chúa Trời, không giới hạn vào bình đẳng hay phán xét pháp lý.
- issue: Ý nghĩa của κόσμος trong văn mạch Giăng
  choice: thế gian
  alternative: người đời
  rationale: Giữ nguyên độ rộng và sự căng thẳng thần học của từ nguồn, có thể bao hàm nhân loại trong tình trạng xa cách Đức Chúa Trời mà không đóng khung thành một lời giải thích.
- issue: Quan hệ diễn ngôn của καὶ ... δέ
  choice: thế gian... nhưng con
  alternative: dù thế gian... con vẫn
  rationale: Bản dịch chính bảo toàn rõ sự tương phản trong tiếng Hy Lạp; cách dịch nhượng bộ là khả hữu nhưng diễn giải quan hệ logic rõ hơn hình thức bề mặt.
- issue: Khía cạnh của các động từ γινώσκω ở aorist
  choice: đã không biết / biết / biết
  alternative: đã không nhận biết / đã biết / đã biết
  rationale: Không áp đặt hệ thống thì tiếng Anh lên tiếng Việt; cách dùng này vừa tự nhiên vừa để sự nhận biết mang ý nghĩa quan hệ và giá trị hiện tại.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Cha/con” theo lời cầu nguyện trực tiếp của Đức Giê-su; tránh từ cổ và tránh diễn giải κόσμος thành một khái niệm hệ phái.
