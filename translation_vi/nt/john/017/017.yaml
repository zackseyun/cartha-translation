source:
  edition: SBLGNT
  text: ἁγίασον αὐτοὺς ἐν τῇ ⸀ἀληθείᾳ· ὁ λόγος ὁ σὸς ἀλήθειά ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/017.yaml
  text: Sanctify them in the truth[a]; your word is truth.
translation:
  language: vi
  text: Xin Cha thánh hóa họ trong chân lý[a]; lời Cha là chân lý.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “bởi chân lý.” Giới từ Hy Lạp có thể chỉ phạm vi hoặc phương tiện; “trong chân lý” giữ được cả hai sắc thái.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἁγίασον
  choice: xin Cha thánh hóa
  rationale: Động từ mệnh lệnh aorist của ἁγιάζω mang ý nghĩa làm nên thánh và biệt riêng cho Đức Chúa Trời. Trong lời cầu nguyện trực tiếp với Cha, “xin Cha thánh hóa” vừa tự nhiên trong tiếng Việt vừa giữ được chiều kích thánh khiết và biệt riêng.
- source_word: αὐτοὺς
  choice: họ
  rationale: Đại từ đối cách số nhiều chỉ các môn đồ; “họ” là cách diễn đạt trực tiếp, tự nhiên.
- source_word: ἐν τῇ ἀληθείᾳ
  choice: trong chân lý
  rationale: Giữ giới từ ἐν cùng danh từ có mạo từ, bảo toàn độ mở giữa sắc thái phạm vi và phương tiện, thay vì thu hẹp thành “bởi chân lý”.
- source_word: ὁ λόγος ὁ σὸς
  choice: lời Cha
  rationale: λόγος ở đây là lời được Đức Chúa Trời truyền đạt. Vì Đức Chúa Jesus đang thưa với Cha, “lời Cha” tự nhiên và trang trọng hơn “lời của Ngài”, đồng thời diễn đạt đúng cấu trúc sở hữu.
- source_word: ἀλήθειά ἐστιν
  choice: là chân lý
  rationale: Giữ ἀλήθεια như danh từ, không làm yếu thành tính từ “chân thật”. Tiếng Việt không có mạo từ tương ứng nên “là chân lý” có thể bảo toàn sắc thái phẩm tính mà không buộc phải xác định theo cách tiếng Hy Lạp không đánh dấu.
theological_decisions:
- issue: Sắc thái phẩm tính hay đồng nhất xác định của ἀλήθεια trong mệnh đề thứ hai
  choice: lời Cha là chân lý
  alternative: lời Cha chính là chân lý
  rationale: Danh từ vị ngữ ἀλήθεια không có mạo từ, có thể nhấn mạnh phẩm tính. Bản dịch không thêm “chính” để tránh biến câu thành một lời đồng nhất mang tính nhấn mạnh hơn hình thức Hy Lạp, nhưng vẫn giữ trọn sức nặng thần học của danh từ “chân lý”.
- issue: Sắc thái của ἐν trong ἐν τῇ ἀληθείᾳ
  choice: trong chân lý
  alternative: bởi chân lý
  rationale: “Trong chân lý” bảo toàn khả năng hiểu theo phạm vi hoặc môi trường thánh hóa, đồng thời không loại trừ sắc thái phương tiện; “bởi chân lý” sẽ quyết định hẳn theo nghĩa công cụ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Cha” phù hợp ngữ cảnh lời cầu nguyện của Đức Chúa Jesus; “thánh hóa” và “chân lý” là các thuật ngữ quen thuộc, giữ được chiều sâu thần học của nguyên văn.
