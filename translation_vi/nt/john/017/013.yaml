language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: νῦν δὲ πρὸς σὲ ἔρχομαι, καὶ ταῦτα λαλῶ ἐν τῷ κόσμῳ ἵνα ἔχωσιν τὴν χαρὰν τὴν ἐμὴν πεπληρωμένην ἐν ⸀ἑαυτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/013.yaml
  text: But now I am coming to you[b][a], and I am speaking these things in the world so that they may have my joy fulfilled in themselves.
translation:
  language: vi
  text: Nhưng bây giờ, con đến cùng Cha, và con nói những điều này khi còn ở thế gian, để họ có niềm vui của con được trọn vẹn trong họ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “trọn vẹn giữa họ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: νῦν δὲ
  choice: Nhưng bây giờ
  rationale: νῦν xác định thời điểm hiện tại, còn δέ tạo sự chuyển ý nhẹ có sắc thái tương phản với phần trước; cách dịch này giữ được cả hai nét nghĩa.
- source_word: πρὸς σὲ ἔρχομαι
  choice: con đến cùng Cha
  rationale: ἔρχομαι với πρὸς và đối cách diễn tả chuyển động hướng đến người Cha. Trong lời cầu nguyện trực tiếp, đại từ ngôi hai được diễn đạt tự nhiên là “Cha”, còn “con” phù hợp quan hệ Cha–Con trong ngữ cảnh.
- source_word: ταῦτα λαλῶ
  choice: con nói những điều này
  rationale: Giữ rõ hành động nói và đối tượng chỉ định ταῦτα, đồng thời dùng cách diễn đạt tự nhiên trong tiếng Việt hiện đại.
- source_word: ἐν τῷ κόσμῳ
  choice: khi còn ở thế gian
  rationale: 'Cụm ἐν ở đây có thể được hiểu theo hoàn cảnh của hành động nói: Đức Giê-su nói những lời này trong lúc vẫn ở thế gian. “Thế gian” cũng giữ được từ ngữ đặc trưng của sách Giăng.'
- source_word: ἵνα ἔχωσιν
  choice: để họ có
  rationale: ἵνα nêu mục đích hoặc kết quả được nhắm đến; “để” diễn đạt điều này gọn và tự nhiên.
- source_word: τὴν χαρὰν τὴν ἐμὴν
  choice: niềm vui của con
  rationale: Cấu trúc có tính từ sở hữu nhấn mạnh niềm vui thuộc về Đức Giê-su; cách dịch không diễn giải thêm bản chất của sự chia sẻ niềm vui ấy.
- source_word: πεπληρωμένην ἐν ἑαυτοῖς
  choice: trọn vẹn trong chính họ
  rationale: Phân từ hoàn thành bị động πεπληρωμένην chỉ trạng thái đã được làm cho đầy trọn. ἐν ἑαυτοῖς tự nhiên nhất là “trong chính họ”, nhưng cấu trúc có thể gắn về mặt ý nghĩa với việc họ có niềm vui ấy hoặc với trạng thái trọn vẹn của niềm vui.
theological_decisions:
- issue: Bản chất của “niềm vui của con”
  choice: Niềm vui thuộc về Đức Giê-su và hiện diện trọn vẹn trong các môn đồ.
  alternative: Niềm vui của các môn đồ về Đức Giê-su.
  rationale: Đại từ sở hữu ἐμὴν tự nhiên nhất chỉ chính niềm vui của Đức Giê-su. Bản dịch giữ nguyên cách nói này mà không giải thích thêm cơ chế các môn đồ dự phần vào niềm vui ấy.
- issue: Quan hệ của ἐν ἑαυτοῖς với mệnh đề
  choice: Dịch là “trong chính họ”, để mở khả năng niềm vui được trọn vẹn trong nội tâm họ.
  alternative: Hiểu là “giữa họ”, nhấn mạnh chiều kích cộng đồng.
  rationale: Đại từ phản thân số nhiều có thể cho phép sắc thái nội tại hoặc cộng đồng. Ngữ cảnh nghiêng về sự hiện diện nội tại, nhưng chú thích bảo tồn phương án còn lại.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “con–Cha” phản ánh lời Đức Giê-su trực tiếp thưa với Cha, tránh đại từ xa cách; “thế gian” được giữ để bảo tồn ngôn ngữ thần học đặc trưng của sách Giăng.
