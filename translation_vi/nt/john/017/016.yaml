source:
  edition: SBLGNT
  text: ἐκ τοῦ κόσμου οὐκ εἰσὶν καθὼς ἐγὼ ⸂οὐκ εἰμὶ ἐκ τοῦ κόσμου⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/016.yaml
  text: They are not from the world[a], just as I am not from the world.
translation:
  language: vi
  text: Họ không thuộc về thế gian[a], cũng như chính tôi không thuộc về thế gian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “từ thế gian mà ra.” Giới từ Hy Lạp ἐκ có thể diễn tả nguồn gốc, sự phát xuất hoặc sự quy thuộc.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ τοῦ κόσμου
  choice: thuộc về thế gian
  rationale: Trong tiếng Việt, “thuộc về thế gian” diễn đạt tự nhiên ý về nguồn gốc, sự quy thuộc hoặc căn tính mà ἐκ có thể mang trong cụm này; chú thích giữ lại sắc thái sát chữ “từ thế gian mà ra”.
- source_word: οὐκ εἰσὶν
  choice: không thuộc về
  rationale: Kết hợp động từ εἰμί với cụm ἐκ τοῦ κόσμου thành cách nói tiếng Việt tự nhiên, không biến câu thành một khẳng định về vị trí vật lý.
- source_word: κόσμου
  choice: thế gian
  rationale: “Thế gian” là cách gọi trang trọng, quen thuộc trong văn mạch Giăng và không thu hẹp nghĩa thành “hệ thống thế gian” hay một cách giải thích thần học cụ thể.
- source_word: καθὼς
  choice: cũng như
  rationale: Diễn đạt rõ quan hệ so sánh giữa các môn đồ và Đức Giê-su bằng tiếng Việt hiện đại, tự nhiên.
- source_word: ἐγώ
  choice: chính tôi
  rationale: Từ “chính” phản ánh mức độ nhấn mạnh của đại từ chủ ngữ được nêu rõ trong tiếng Hy Lạp và làm nổi bật phép so sánh.
- source_word: οὐκ εἰμὶ ἐκ τοῦ κόσμου
  choice: tôi không thuộc về thế gian
  rationale: Giữ nguyên sự lặp lại của cụm then chốt ở cả hai vế, đồng thời bảo đảm câu văn Việt tự nhiên.
theological_decisions:
- issue: Ý nghĩa của “thế gian” trong thần học Giăng
  choice: Giữ nguyên “thế gian” trong chính văn, không thêm lời diễn giải.
  alternative: “hệ thống thế gian” hoặc “trật tự sa ngã hiện tại”
  rationale: κόσμος có chiều sâu thần học trong sách Giăng, nhưng câu này không xác định một cách diễn giải hẹp hơn; giữ thuật ngữ đơn giản bảo tồn sự căng thẳng và tính đa nghĩa của văn bản.
- issue: 'Sắc thái của ἐκ: nguồn gốc hay sự quy thuộc'
  choice: Dùng “thuộc về” trong chính văn và nêu cách dịch sát chữ trong chú thích.
  alternative: “từ thế gian mà ra”
  rationale: Cụm Hy Lạp có thể chỉ nguồn gốc, sự phát xuất hoặc sự quy thuộc. Chính văn ưu tiên cách nói tự nhiên trong tiếng Việt, còn chú thích bảo tồn sắc thái nguồn gốc.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Thế gian” được giữ vì phù hợp văn mạch Giăng; “chính tôi” thể hiện sự nhấn mạnh của ἐγώ. Dấu chú thích [a] xuất hiện ngay sau lần đầu của cụm từ liên quan.
