  to: Con không còn ở trong thế gian nữa, nhưng họ vẫn ở trong thế gian, còn Con đang đến với Cha. Lạy Cha thánh, xin gìn giữ họ trong danh Cha[a], là danh Cha đã ban cho Con[b], để họ nên một, như chúng ta là một.
  rationale: Chỉ điều chỉnh “hiệp làm một” thành “nên một” để tăng tính tự nhiên và tránh diễn giải vượt quá ἓν. Các phần còn lại, gồm đại từ Cha/Con, cấu trúc đối chiếu, cách dịch “trong danh Cha,” và hai chú thích, đều được giữ vì phản ánh đúng văn bản SBLGNT và bảo toàn các khả năng diễn giải.
