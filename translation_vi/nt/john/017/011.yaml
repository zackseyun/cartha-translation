id: JHN.17.11
reference: John 17:11
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ οὐκέτι εἰμὶ ἐν τῷ κόσμῳ, καὶ ⸀αὐτοὶ ἐν τῷ κόσμῳ εἰσίν, κἀγὼ πρὸς σὲ ἔρχομαι. πάτερ ἅγιε, τήρησον αὐτοὺς ἐν τῷ ὀνόματί σου ᾧ δέδωκάς μοι, ἵνα ὦσιν ἓν ⸀καθὼς ἡμεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/011.yaml
  text: And I am no longer in the world[a], but they are in the world, and I am coming to you. Holy Father, keep them in your name, which you have given to me, so that they may be one[b], just as we are.
translation:
  language: vi
  text: Con không còn ở trong thế gian nữa, nhưng họ vẫn ở trong thế gian, còn Con đang đến với Cha. Lạy Cha thánh, xin gìn giữ họ trong danh Cha[a], là danh Cha đã ban cho Con[b], để họ nên một, như chúng ta là một.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “xin dùng danh Cha mà gìn giữ họ” hoặc “xin bảo vệ họ nhờ danh Cha.” Cụm từ Hy Lạp có thể chỉ phạm vi, phương tiện hoặc thẩm quyền.'
    reason: lexical_alternative
  - marker: b
    text: 'Một số thủ bản có cách đọc được hiểu là: “xin gìn giữ trong danh Cha những người Cha đã ban cho Con.” Bản dịch này theo cách đọc của SBLGNT, trong đó “là danh” quy chiếu về “danh Cha.”'
    reason: textual_variant
lexical_decisions:
- source_word: οὐκέτι
  choice: không còn… nữa
  rationale: 'Diễn đạt tự nhiên ý phủ định theo thời gian: tình trạng ấy sắp chấm dứt theo góc nhìn của lời cầu nguyện.'
- source_word: κόσμος
  choice: thế gian
  rationale: Giữ thuật ngữ quen thuộc trong văn chương Gioan, chỉ phạm vi trần thế nơi các môn đồ còn ở lại, mà không thu hẹp thành “xã hội” hay “thời đại”.
- source_word: κἀγὼ πρὸς σὲ ἔρχομαι
  choice: còn Con đang đến với Cha
  rationale: Thì hiện tại mang sắc thái tiến triển hoặc tương lai gần; “đến với Cha” giữ nguyên hướng nhìn của động từ Hy Lạp.
- source_word: πάτερ ἅγιε
  choice: Lạy Cha thánh
  rationale: Lời xưng hô trực tiếp vừa giữ “Cha” vừa diễn đạt phẩm tính thánh; cách nói trang trọng và tự nhiên trong tiếng Việt.
- source_word: τήρησον
  choice: xin gìn giữ
  rationale: Bao quát các nét nghĩa giữ gìn, canh giữ và bảo vệ mà không giới hạn vào sự an toàn thể chất.
- source_word: ἐν τῷ ὀνόματί σου
  choice: trong danh Cha
  rationale: Giữ cách diễn đạt với ἐν để bảo toàn khả năng chỉ phạm vi, phương tiện hoặc thẩm quyền, thay vì quyết định hẳn một nghĩa.
- source_word: ᾧ δέδωκάς μοι
  choice: là danh Cha đã ban cho Con
  rationale: Đại từ quan hệ giống trung phù hợp với “danh”; lặp lại “danh” trong tiếng Việt để quan hệ ngữ pháp được rõ mà không làm mất nội dung của bản văn.
- source_word: ἵνα ὦσιν ἓν
  choice: để họ hiệp làm một
  rationale: “Để” thể hiện mục đích; “hiệp làm một” diễn đạt sự hiệp nhất của nhiều người mà không biến họ thành một cá thể duy nhất.
- source_word: καθὼς ἡμεῖς
  choice: như chúng ta là một
  rationale: Bổ sung vị ngữ được hàm ý trong tiếng Hy Lạp để câu tiếng Việt tự nhiên, đồng thời giữ nguyên sức nặng của phép so sánh.
theological_decisions:
- issue: Ý nghĩa của “gìn giữ họ trong danh Cha”
  choice: Giữ nguyên “trong danh Cha” trong chính văn.
  alternative: “nhờ danh Cha mà gìn giữ họ” hoặc “dùng danh Cha bảo vệ họ”
  rationale: Cụm từ Hy Lạp có thể chỉ phạm vi, phương tiện, thẩm quyền hoặc thực tại được bày tỏ qua danh Đức Chúa Trời; bản dịch không nên thu hẹp sự đa nghĩa này.
- issue: Sự hiệp nhất trong “để họ hiệp làm một, như chúng ta là một”
  choice: Giữ một phép so sánh thực sự giữa sự hiệp nhất của các môn đồ và sự hiệp nhất của Cha với Con.
  alternative: Giải thích thành sự hợp tác đơn thuần, hoặc diễn đạt như sự đồng nhất về bản thể.
  rationale: Câu văn mang sức nặng thần học nhưng không tự định nghĩa bản chất của phép so sánh; bản dịch tránh cả việc làm yếu lẫn việc diễn giải quá mức.
- issue: Tiền ngữ của đại từ quan hệ ᾧ
  choice: Hiểu ᾧ là “là danh…”, quy chiếu về “danh Cha”.
  alternative: 'Theo một số dị bản hoặc cách hiểu khác: “những người Cha đã ban cho Con”.'
  rationale: Hình thức ᾧ trong SBLGNT hòa hợp về giống với ὀνόματι, vì vậy bản dịch theo văn bản nguồn đã cho, đồng thời ghi nhận dị bản trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “Con/Cha” phù hợp ngữ cảnh lời cầu nguyện trực tiếp của Chúa Giê-su. “Thế gian,” “danh Cha” và “hiệp làm một” giữ âm hưởng Gioan quen thuộc nhưng không dùng lối diễn đạt quá cổ.
