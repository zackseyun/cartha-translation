  terminology: “Cha/Con,” “ở trong,” “thế gian,” “sai,” và “yêu” đều thích hợp với cách dùng đặc trưng trong Giăng. “Được hoàn thiện” giữ được sắc thái hoàn tất/được đưa đến chỗ trọn vẹn mà không tự thêm ý về sự vô tội tuyệt đối. “Như Cha đã yêu Con” bảo toàn trực tiếp lực so sánh của καθὼς.
