id: JHN.17.23
reference: John 17:23
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐγὼ ἐν αὐτοῖς καὶ σὺ ἐν ἐμοί, ἵνα ὦσιν τετελειωμένοι εἰς ἕν, ⸀ἵνα γινώσκῃ ὁ κόσμος ὅτι σύ με ἀπέστειλας καὶ ἠγάπησας αὐτοὺς καθὼς ἐμὲ ἠγάπησας.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/023.yaml
  text: I in them and you in me[a], so that they may be perfected into one, so that the world may know that you sent me and loved them just as you loved me.
translation:
  language: vi
  text: Con ở trong họ và Cha ở trong Con, để họ được hoàn thiện mà trở nên một[a], hầu cho thế gian biết rằng Cha đã sai Con và đã yêu họ như Cha đã yêu Con.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “được làm cho trọn vẹn để hiệp làm một” hoặc “được đưa đến chỗ hoàn thiện trong sự hiệp một.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγὼ ἐν αὐτοῖς καὶ σὺ ἐν ἐμοί
  choice: Con ở trong họ và Cha ở trong Con
  rationale: Giữ giới từ “ở trong” để bảo toàn ngôn ngữ đặc trưng của Giăng về sự ở trong nhau; dùng “Con/Cha” theo ngữ cảnh lời cầu nguyện của Chúa Giê-su với Cha.
- source_word: τετελειωμένοι
  choice: được hoàn thiện
  rationale: Thể hoàn thành bị động diễn tả trạng thái do một hành động đưa đến chỗ trọn vẹn; “được hoàn thiện” giữ cả ý hoàn tất lẫn biến đổi mà không mặc nhiên giới hạn vào sự hoàn hảo đạo đức tuyệt đối.
- source_word: εἰς ἕν
  choice: mà trở nên một
  rationale: Diễn đạt hướng đi và kết quả của εἰς với đối cách bằng tiếng Việt tự nhiên, thay vì chỉ mô tả một trạng thái thống nhất có sẵn.
- source_word: γινώσκῃ
  choice: biết
  rationale: Cách dịch trực tiếp, tự nhiên của động từ ở thể giả định trong mệnh đề chỉ mục đích.
- source_word: ὁ κόσμος
  choice: thế gian
  rationale: Giữ thuật ngữ quen thuộc và giàu sắc thái trong văn chương Giăng, không diễn giải thành một nhóm người hay một hệ thống cụ thể.
- source_word: ἀπέστειλας
  choice: đã sai
  rationale: “Sai” là cách diễn đạt ngắn gọn, tự nhiên trong ngữ cảnh Cha sai Con, đồng thời giữ sắc thái sứ mạng.
- source_word: ἠγάπησας
  choice: đã yêu
  rationale: Giữ nguyên sự lặp lại của động từ ἀγαπάω trong hai vế so sánh.
- source_word: καθὼς
  choice: như
  rationale: Đánh dấu trực tiếp sự so sánh mà không làm nhẹ hoặc diễn giải quá mức mối liên hệ giữa tình yêu của Cha dành cho các môn đồ và dành cho Con.
theological_decisions:
- issue: Sức nặng của phép so sánh trong câu “Cha đã yêu họ như Cha đã yêu Con”
  choice: 'Giữ phép so sánh trực tiếp: “như Cha đã yêu Con”.'
  alternative: Làm nhẹ thành “bằng một tình yêu giống như tình yêu Cha dành cho Con” hoặc chỉ nói “cũng yêu họ”.
  rationale: καθὼς đưa ra một phép so sánh thực sự. Bản dịch giữ nguyên sức nặng thần học của lời này mà không xác định thêm phạm vi hay bản chất của sự tương ứng.
- issue: Ý nghĩa của τετελειωμένοι trong văn cảnh
  choice: Diễn tả việc được đưa đến chỗ hoàn thiện với kết quả là trở nên một.
  alternative: “được làm cho hoàn hảo trong một” hoặc “được trọn vẹn trong sự hiệp nhất”.
  rationale: Cách dịch bảo toàn ý hoàn tất của τελειόω và hướng tới sự hiệp một của εἰς ἕν, nhưng không áp đặt cách hiểu rằng các môn đồ đã đạt sự hoàn hảo tuyệt đối, không còn tội lỗi.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “Con/Cha” phản ánh quan hệ giữa Chúa Giê-su và Đức Chúa Cha trong lời cầu nguyện. “Hầu cho” được dùng để phân biệt mệnh đề mục đích thứ hai và tránh hai lần “để” liền nhau, đồng thời vẫn phù hợp văn phong Kinh Thánh trang trọng.
