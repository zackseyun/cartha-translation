source:
  edition: SBLGNT
  text: ἔρχεται ⸀Μαριὰμ ἡ Μαγδαληνὴ ⸀ἀγγέλλουσα τοῖς μαθηταῖς ὅτι ⸀Ἑώρακα τὸν κύριον καὶ ταῦτα εἶπεν αὐτῇ.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/018.yaml
  text: Mary Magdalene came announcing to the disciples[a], “I have seen the Lord,” and that he had said these things to her.
translation:
  language: vi
  text: Ma-ri Ma-đơ-len đến báo cho các môn đồ rằng bà đã thấy Chúa và Ngài đã nói với bà những điều ấy.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔρχεται
  choice: đến
  rationale: Đây là hiện tại lịch sử trong lời kể; tiếng Việt dùng “đến” tự nhiên để thuật lại sự việc và giữ hướng chuyển động về phía các môn đồ.
- source_word: Μαριὰμ ἡ Μαγδαληνὴ
  choice: Ma-ri Ma-đơ-len
  rationale: Dùng dạng tên quen thuộc trong tiếng Việt hiện đại, đồng thời giữ địa danh hiệu “Ma-đơ-len” thay vì diễn giải thêm.
- source_word: ἀγγέλλουσα
  choice: báo
  rationale: Phân từ diễn tả việc chuyển lời đồng thời với hành động đến; “báo” ngắn gọn, tự nhiên và giữ ý truyền đạt một thông tin.
- source_word: τοῖς μαθηταῖς
  choice: cho các môn đồ
  rationale: “Môn đồ” là cách dịch quen thuộc và chính xác; không thêm “của Ngài” vì nguyên văn không có.
- source_word: ὅτι
  choice: dấu hai chấm và lời trích dẫn trực tiếp
  rationale: ὅτι dẫn nội dung lời báo; cấu trúc trích dẫn trực tiếp là cách thể hiện tự nhiên trong tiếng Việt.
- source_word: Ἑώρακα
  choice: Tôi đã thấy
  rationale: Thể hoàn thành chỉ một việc đã xảy ra nhưng có ý nghĩa hiện tại; “đã thấy” truyền đạt rõ điều Ma-ri đang làm chứng.
- source_word: τὸν κύριον
  choice: Chúa
  rationale: Giữ trọng lượng danh hiệu của κύριος trong bối cảnh Chúa Giê-su sống lại; tiếng Việt không cần mạo từ tương ứng.
- source_word: καὶ ταῦτα εἶπεν αὐτῇ
  choice: và rằng Ngài đã nói với bà những điều ấy
  rationale: Hiểu mệnh đề này là phần tiếp theo trong nội dung Ma-ri báo lại. “Đã nói” thể hiện lời nói xảy ra trước lúc bà báo tin; “những điều ấy” giữ giá trị chỉ định số nhiều của ταῦτα.
theological_decisions:
- issue: Cách dịch κύριος trong bối cảnh phục sinh
  choice: Chúa
  alternative: chủ; thầy
  rationale: Trong ngữ cảnh này, từ ngữ chỉ Chúa Giê-su và mang trọng lượng của một danh hiệu; “Chúa” giữ được ý nghĩa ấy mà không áp đặt cách giải thích hệ phái.
- issue: Quan hệ của καὶ ταῦτα εἶπεν αὐτῇ với lời báo của Ma-ri
  choice: 'Xem đây là phần nội dung Ma-ri báo: “và rằng Ngài đã nói với bà những điều ấy”'
  alternative: 'Xem đây là lời nhận xét riêng của người kể: “và Ngài đã nói với bà những điều ấy”'
  rationale: Nguyên văn không lặp lại ὅτι nên có thể hiểu theo cả hai cách. Bản chính chọn cách mệnh đề tiếp tục nội dung lời báo, còn chú thích giữ lại khả năng đó là lời của người kể.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Ma-ri Ma-đơ-len”, “môn đồ” và “Chúa” theo lối dùng quen thuộc trong tiếng Việt Kinh Thánh; giữ nguyên sự mơ hồ cú pháp của mệnh đề cuối bằng chú thích.
