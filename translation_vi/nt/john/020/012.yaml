source:
  edition: SBLGNT
  text: καὶ θεωρεῖ δύο ἀγγέλους ἐν λευκοῖς καθεζομένους, ἕνα πρὸς τῇ κεφαλῇ καὶ ἕνα πρὸς τοῖς ποσίν, ὅπου ἔκειτο τὸ σῶμα τοῦ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/012.yaml
  text: and she sees two angels in white sitting[a], one at the head and one at the feet[b], where the body of Jesus had been lying.
translation:
  language: vi
  text: và bà thấy hai thiên sứ mặc áo trắng đang ngồi[a], một vị ở phía đầu và một vị ở phía chân[b], nơi thi thể của Giê-su đã nằm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “trong màu trắng”; cũng có thể dịch là “trong y phục trắng”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hoặc: “một vị gần phía đầu và một vị gần phía chân”. Đây là hai đầu của chỗ thi thể của Giê-su đã nằm.'
    reason: lexical_alternative
lexical_decisions:
- source_word: θεωρεῖ
  choice: bà thấy
  rationale: Thì hiện tại lịch sử tạo nét kể chuyện sống động; chủ ngữ theo ngữ cảnh là Ma-ri Ma-đơ-len, và tiếng Việt cần nêu đại từ để câu tự nhiên.
- source_word: ἀγγέλους
  choice: thiên sứ
  rationale: Trong bối cảnh ngôi mộ phục sinh, từ này chỉ các hữu thể từ trời, không đơn thuần là người đưa tin.
- source_word: ἐν λευκοῖς
  choice: mặc áo trắng
  rationale: Cụm Hy Lạp theo sát mặt chữ là ‘trong màu trắng’, hàm ý y phục trắng; cách dịch này rõ ràng và tự nhiên trong tiếng Việt.
- source_word: καθεζομένους
  choice: đang ngồi
  rationale: Phân từ mô tả tư thế của hai thiên sứ; ‘đang ngồi’ tự nhiên và không thêm trạng từ chỉ nơi chốn vốn không có trong nguyên văn.
- source_word: ἕνα πρὸς τῇ κεφαλῇ καὶ ἕνα πρὸς τοῖς ποσίν
  choice: một vị ở phía đầu và một vị ở phía chân
  rationale: πρός với cách ba chỉ vị trí gần hoặc tại hai đầu nơi thi thể đã được đặt; ‘phía đầu’ và ‘phía chân’ giúp tránh hiểu đây là đầu và chân hiện còn ở đó.
- source_word: ἔκειτο
  choice: đã được đặt
  rationale: κεῖμαι diễn tả trạng thái nằm hoặc được đặt; trong bối cảnh thi thể không còn ở đó, ‘đã được đặt’ truyền đạt tự nhiên trạng thái có trước mà không khẳng định quá mức cách thức.
- source_word: σῶμα
  choice: thi thể
  rationale: Trong ngữ cảnh mai táng, ‘thi thể’ chính xác hơn ‘thân thể’ và vẫn giữ sắc thái trang trọng, không thô như ‘xác chết’.
- source_word: τοῦ Ἰησοῦ
  choice: Đức Chúa Jêsus
  rationale: Dùng dạng danh xưng và phiên âm trang trọng, quen thuộc trong văn phong Kinh Thánh tiếng Việt của dự án.
theological_decisions:
- issue: Bản chất của ἀγγέλους trong bối cảnh phục sinh
  choice: các thiên sứ từ trời
  alternative: những sứ giả là con người
  rationale: Ngữ cảnh ngôi mộ trống cùng y phục trắng cho thấy đây là các hữu thể thiên thượng; quyết định dựa trên ngữ cảnh từ vựng, không nhằm thêm một khẳng định giáo phái.
- issue: Sắc thái thời gian và trạng thái của ἔκειτο
  choice: đã được đặt
  alternative: đã nằm / đang nằm
  rationale: Ngữ cảnh cho biết thi thể trước đó ở vị trí ấy nhưng nay không còn; cách dịch giữ logic thời gian và sắc thái trạng thái của κεῖμαι, đồng thời không dùng ‘đang nằm’ dễ gợi rằng thi thể vẫn còn đó.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu giữ liên từ mở đầu “và” để nối với câu trước. Dùng “vị” cho hai thiên sứ nhằm tự nhiên và tôn trọng; tránh thêm “ở đó” vì nguyên văn không có từ tương ứng.
