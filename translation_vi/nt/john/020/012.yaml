    rationale: Nguyên văn chỉ có «của Giê-su» (τοῦ Ἰησοῦ). «Đức Chúa» là một tước hiệu được thêm vào và cách viết «Jêsus» mang dấu ấn truyền thống hệ phái hơn là tiếng Việt chuẩn hiện đại.
  - severity: medium
    issue: «Đã được đặt» không phản ánh chính xác ἔκειτο.
    rationale: ἔκειτο là động từ chỉ trạng thái nằm/được đặt nằm trong quá khứ, không trực tiếp thuật lại hành động đặt thi thể. «Đã nằm» giữ đúng trạng thái và quá khứ có liên hệ với thời điểm quan sát.
  - severity: low
    issue: Chú thích b lặp lại cách dịch «đã được đặt».
    rationale: Cần sửa cho nhất quán với cách dịch sát nghĩa của ἔκειτο trong bản văn đã hiệu đính.
