  verdict: revise
  source_fidelity: 'Bản dịch truyền đạt đúng cảnh tượng: Ma-ri Ma-đơ-len thấy hai thiên sứ mặc trắng, ngồi ở hai đầu nơi thân thể Giê-su từng nằm. Tuy nhiên, «Đức Chúa Jêsus» thêm tước hiệu «Đức Chúa» không có trong τοῦ Ἰησοῦ, và «đã được đặt» chuyển động từ chỉ trạng thái ἔκειτο (“đã nằm/đã từng nằm”) thành hành động đặt để.'
  naturalness: Câu văn nhìn chung tự nhiên, trang trọng và rõ ràng. «Một vị ở phía đầu và một vị ở phía chân» diễn đạt tốt tương quan vị trí. «Đã nằm» là cách tự nhiên, sát nghĩa hơn trong ngữ cảnh ngôi mộ trống.
  terminology: Giữ «thiên sứ» phù hợp văn cảnh và văn phong Kinh Thánh. Dùng «Giê-su» là dạng hiện đại, trung tính về hệ phái, đồng thời tránh thêm danh xưng không có trong nguyên văn. «Thi thể» thích hợp trong ngữ cảnh mai táng và có thể giữ được nghĩa của σῶμα.
  issues:
