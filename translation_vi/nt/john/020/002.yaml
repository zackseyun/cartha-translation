    issue: Tên «Jêsus» và thuật ngữ «môn đồ» mang lối chính tả/cách dùng cũ, không phải lựa chọn chuẩn nhất cho tiếng Việt hiện đại.
    rationale: Bản dịch nhắm đến tiếng Việt chuẩn hiện đại; «Giê-su» và «môn đệ» là các hình thức phổ biến, trung tính và dễ hiểu hơn.
  - severity: low
    issue: «Người môn đồ kia» có thể gợi nghĩa chỉ định «người kia», trong khi ἄλλον chủ yếu đánh dấu «người khác» đối chiếu với Phi-e-rơ.
    rationale: «Người môn đệ khác» giữ rõ hơn quan hệ đối chiếu của τὸν ἄλλον μαθητήν.
  revised_text: 'Vì vậy, bà chạy đến gặp Si-môn Phi-e-rơ và người môn đệ khác[a], người mà Đức Chúa Giê-su yêu mến, rồi nói với họ: “Người ta đã đem Chúa ra khỏi mộ, và chúng tôi không biết họ đã đặt Ngài ở đâu.”[b]'
