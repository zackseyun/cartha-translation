revisions:
- from: 'Vì thế, bà chạy đến với Si-môn Phi-e-rơ và người môn đồ kia[a], là người Đức Chúa Jêsus yêu mến, rồi nói với họ: “Người ta đã đem Chúa ra khỏi mộ, và chúng tôi không biết họ đã đặt Ngài ở đâu.”[b]'
  to: 'Vì vậy, bà chạy đến gặp Si-môn Phi-e-rơ và người môn đệ khác[a], người mà Đức Chúa Giê-su yêu mến, rồi nói với họ: “Người ta đã đem Chúa ra khỏi mộ, và chúng tôi không biết họ đã đặt Ngài ở đâu.”[b]'
  rationale: Sửa tên riêng và thuật ngữ sang dạng tiếng Việt hiện đại chuẩn, đồng thời thay «kia» bằng «khác» để phản ánh chính xác hơn tính đối chiếu của ἄλλον. Các lựa chọn còn lại giữ nguyên ý nghĩa, tính không xác định của các chủ thể số nhiều, và số nhiều «chúng tôi» của nguyên văn.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T08:26:40Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch giữ đúng các yếu tố chính: Ma-ri chạy đến với Si-môn Phi-e-rơ và môn đệ kia, lời nói hướng đến cả hai, chủ thể số nhiều không xác định trong hai động từ, và đại từ ngôi thứ nhất số nhiều «chúng tôi». Tuy nhiên, «môn đồ» và chính tả «Jêsus» không phù hợp nhất với tiếng Việt chuẩn hiện đại của dự án. «Người môn đệ khác» phản ánh τὸν ἄλλον μαθητήν rõ hơn «người môn đồ kia».'
  naturalness: 'Câu sửa dùng cách gọi tên và thuật ngữ quen thuộc, hiện đại hơn: «Giê-su», «môn đệ», «đến gặp». Cấu trúc vẫn gọn, trang trọng, và tự nhiên trong văn xuôi Kinh Thánh.'
  terminology: Dùng «Đức Chúa Giê-su» cho ὁ Ἰησοῦς và «Chúa» cho τὸν κύριον, bảo toàn sự phân biệt trong nguyên văn. «Môn đệ» là thuật ngữ hiện đại chuẩn hơn «môn đồ». Không giải quyết hay suy diễn số nhiều của «chúng tôi».
  issues:
