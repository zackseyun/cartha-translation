reference: John 20:2
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τρέχει οὖν καὶ ἔρχεται πρὸς Σίμωνα Πέτρον καὶ πρὸς τὸν ἄλλον μαθητὴν ὃν ἐφίλει ὁ Ἰησοῦς, καὶ λέγει αὐτοῖς· Ἦραν τὸν κύριον ἐκ τοῦ μνημείου, καὶ οὐκ οἴδαμεν ποῦ ἔθηκαν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/002.yaml
  text: So she runs and comes to Simon Peter and to the other disciple[a], whom Jesus loved, and says to them, “They have taken the Lord out of the tomb[b], and we do not know where they have laid him.”
translation:
  language: vi
  text: 'Vì vậy, bà chạy đến gặp Si-môn Phi-e-rơ và người môn đệ khác[a], người mà Đức Chúa Giê-su yêu mến, rồi nói với họ: “Người ta đã đem Chúa ra khỏi mộ, và chúng tôi không biết họ đã đặt Ngài ở đâu.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hy Lạp: “người môn đệ khác, người mà Đức Chúa Giê-su yêu mến.” Động từ ở đây thuộc φιλέω, có thể nhấn mạnh tình cảm trìu mến; cũng có thể dịch: “người mà Đức Chúa Giê-su quý mến.”'
    reason: lexical_alternative
  - marker: b
    text: Ma-ri nói “chúng tôi không biết”, theo ngôi thứ nhất số nhiều trong bản Hy Lạp. Có người hiểu số nhiều này bao gồm những phụ nữ khác đi cùng bà, nhưng chính câu này không giải thích số nhiều ấy.
    reason: alternative_reading
lexical_decisions:
- source_word: τρέχει οὖν καὶ ἔρχεται
  choice: Vì thế, bà chạy đến
  rationale: οὖν nêu hệ quả từ câu trước; hai động từ hiện tại lịch sử tạo nhịp kể sống động. Tiếng Việt tự nhiên có thể gộp ý chuyển động “chạy và đến” thành “chạy đến” mà không mất nội dung.
- source_word: πρὸς Σίμωνα Πέτρον καὶ πρὸς τὸν ἄλλον μαθητήν
  choice: với Si-môn Phi-e-rơ và người môn đồ kia
  rationale: πρός chỉ hướng chuyển động đến hai người; “đến với” là cách diễn đạt tự nhiên. μαθητής được dịch nhất quán là “môn đồ”, còn ἄλλον là “kia” trong tương quan đối chiếu với Phi-e-rơ.
- source_word: ὃν ἐφίλει ὁ Ἰησοῦς
  choice: là người Đức Chúa Jêsus yêu mến
  rationale: φιλέω diễn tả tình yêu và sự trìu mến. “Yêu mến” vừa tự nhiên vừa giữ sắc thái tình cảm; thể chưa hoàn thành được diễn đạt bằng quan hệ có tính kéo dài, không cần cấu trúc tiếp diễn vụng về.
- source_word: λέγει αὐτοῖς
  choice: rồi nói với họ
  rationale: Hiện tại lịch sử được chuyển thành lời kể tiếng Việt trôi chảy; “rồi” làm rõ diễn tiến kế tiếp mà không thêm quan hệ nhân quả mới.
- source_word: Ἦραν τὸν κύριον ἐκ τοῦ μνημείου
  choice: Người ta đã đem Chúa ra khỏi mộ
  rationale: Chủ ngữ số nhiều không xác định được diễn đạt tự nhiên bằng “người ta”; không xác định danh tính người hành động. ἐκ được giữ bằng “ra khỏi”, μνημεῖον trong ngữ cảnh là mộ chôn cất, và κύριος là “Chúa”.
- source_word: οὐκ οἴδαμεν
  choice: chúng tôi không biết
  rationale: Giữ nguyên ngôi thứ nhất số nhiều của Hy Lạp, không đổi thành số ít dù người nói được kể là Ma-ri.
- source_word: ποῦ ἔθηκαν αὐτόν
  choice: họ đã đặt Ngài ở đâu
  rationale: τίθημι ở đây là đặt để một người; “đặt” trung tính và tự nhiên, không giả định thêm việc chôn cất. Đại từ kính trọng “Ngài” phù hợp với cách xưng gọi Chúa trong văn phong Kinh Thánh Việt ngữ.
theological_decisions:
- issue: Cách dịch κύριος khi chỉ về Đức Chúa Jêsus
  choice: Chúa
  alternative: chủ; thầy
  rationale: Trong lời của môn đồ và bối cảnh phục sinh, đây là cách xưng kính trọng có trọng lượng Cơ Đốc luận; “Chúa” giữ được cách gọi ấy mà không hạ xuống thành một danh xưng thuần xã hội.
- issue: Số nhiều trong οἴδαμεν
  choice: chúng tôi không biết
  alternative: tôi không biết
  rationale: Bản Hy Lạp dùng ngôi thứ nhất số nhiều. Giữ số nhiều bảo toàn sự căng thẳng của lời kể; câu này không giải thích “chúng tôi” bao gồm những ai.
- issue: Chủ thể không được nêu của Ἦραν và ἔθηκαν
  choice: người ta ... họ
  alternative: họ ... họ
  rationale: Các động từ số nhiều không cho biết danh tính chủ thể. “Người ta” mở đầu lời nói tự nhiên trong tiếng Việt, rồi “họ” quy chiếu lại, tránh gán hành động cho một nhóm cụ thể.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ tên riêng theo lối phiên âm Kinh Thánh Việt ngữ quen thuộc và dùng “Đức Chúa Jêsus” để nhận diện rõ chủ thể trong mệnh đề quan hệ. Cấu trúc kể chuyện được làm tự nhiên cho tiếng Việt nhưng vẫn bảo toàn hiện tại lịch sử về mặt độ sống động, số nhiều gây chú ý trong lời Ma-ri, và sự không xác định của những người đã đem thi thể đi.
