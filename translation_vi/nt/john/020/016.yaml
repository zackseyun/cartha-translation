  text: λέγει ⸀αὐτῇ Ἰησοῦς· ⸀Μαριάμ. στραφεῖσα ἐκείνη λέγει αὐτῷ ⸀Ἑβραϊστί· Ραββουνι (ὃ λέγεται Διδάσκαλε).
base_translation:
  language: en
  yaml_path: translation/nt/john/020/016.yaml
  text: Jesus says to her[a], “Mary.” Turning, she says to him in Hebrew, “Rabboni!” (which means, “Teacher”).
translation:
  language: vi
  text: 'Jêsus nói với bà: “Ma-ri!” Bà quay lại và nói với Ngài bằng tiếng Hê-bơ-rơ[a]: “Ra-bu-ni!” (nghĩa là “Thầy”).'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hoặc “bằng tiếng A-ram.” Cách Giăng nói “bằng tiếng Hê-bơ-rơ” có thể được dùng theo nghĩa rộng hơn để chỉ tiếng Xê-mít được dùng tại Giu-đê.
    reason: Bảo lưu cách hiểu thay thế có cơ sở lịch sử-ngôn ngữ mà không thay đổi cách gọi trong nguyên văn Hy Lạp.
lexical_decisions:
- source_word: λέγει
  choice: nói
  rationale: Động từ hiện tại lịch sử được diễn đạt bằng “nói”; tiếng Việt không bắt buộc đánh dấu thì, nên vẫn giữ được lối kể sống động của Giăng mà không gượng ép.
- source_word: αὐτῇ
  choice: với bà
  rationale: Dạng tặng cách chỉ người tiếp nhận lời nói; “với bà” tự nhiên trong tiếng Việt và phù hợp cách xưng gọi Ma-ri trong ngữ cảnh.
- source_word: Μαριάμ
  choice: Ma-ri
  rationale: Dùng dạng tên quen thuộc trong tiếng Việt thay vì phiên âm máy móc “Ma-ri-am”.
- source_word: στραφεῖσα
  choice: quay lại
  rationale: Diễn đạt ngắn gọn hành động của phân từ bất định quá khứ, giữ trình tự bà nghe được gọi tên rồi quay lại.
- source_word: ἐκείνη
  choice: bà
  rationale: Đại từ chỉ định ở đây làm chủ ngữ; “bà” là cách diễn đạt tự nhiên, tôn trọng trong tiếng Việt.
- source_word: Ἑβραϊστί
  choice: bằng tiếng Hê-bơ-rơ
  rationale: Theo sát từ Hy Lạp, vốn nói rõ “bằng tiếng Hê-bơ-rơ”; khả năng từ này chỉ tiếng A-ram được giữ trong chú thích.
- source_word: Ραββουνι
  choice: Ra-bu-ni
  rationale: Giữ nguyên danh xưng Semit bằng phiên âm dễ đọc vì chính tác giả giải nghĩa ngay sau đó; cách này bảo toàn sắc thái thân mật và cảm xúc của lời gọi.
- source_word: ὃ λέγεται Διδάσκαλε
  choice: nghĩa là “Thầy”
  rationale: Cụm này đưa ra lời giải nghĩa. “Thầy” là cách dịch tự nhiên của danh từ xưng hô Διδάσκαλε và không thêm sắc thái quyền uy quá mức.
theological_decisions:
- issue: Cách hiểu Ἑβραϊστί trong lời kể của Giăng
  choice: bằng tiếng Hê-bơ-rơ
  alternative: bằng tiếng A-ram
  rationale: Bản văn chính theo đúng cách gọi của tiếng Hy Lạp, trong khi chú thích bảo lưu khả năng thuật ngữ của Giăng được dùng rộng hơn để chỉ ngôn ngữ Semit thông dụng tại Giu-đê, có lẽ là tiếng A-ram.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. Dùng “Chúa Jêsus”, “bà” và “Ngài” theo lối xưng hô tôn kính quen thuộc; tên riêng và danh xưng Semit được phiên âm theo âm tiết để độc giả Việt dễ đọc.
