revisions:
- from: 'Chúa Jêsus nói với bà: “Ma-ri!” Bà quay lại và nói với Ngài bằng tiếng Hê-bơ-rơ[a]: “Ra-bu-ni!” (nghĩa là “Thầy”).'
  to: 'Jêsus nói với bà: “Ma-ri!” Bà quay lại và nói với Ngài bằng tiếng Hê-bơ-rơ[a]: “Ra-bu-ni!” (nghĩa là “Thầy”).'
  rationale: Bỏ «Chúa» để không thêm danh xưng vắng mặt trong nguyên văn. Giữ cấu trúc, tên riêng, lối xưng hô và lời giải nghĩa của bản thảo. Chỉnh nhẹ chú thích để diễn đạt chính xác hơn tính chất rộng của Ἑβραϊστί trong cách dùng của Giăng.
  reviewer_model: gpt-5.6-terra
