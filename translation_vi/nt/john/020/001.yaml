id: JHN.20.1
reference: John 20:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Τῇ δὲ μιᾷ τῶν σαββάτων Μαρία ἡ Μαγδαληνὴ ἔρχεται πρωῒ σκοτίας ἔτι οὔσης εἰς τὸ μνημεῖον, καὶ βλέπει τὸν λίθον ἠρμένον ἐκ τοῦ μνημείου.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/001.yaml
  text: On the first day of the week[a], Mary Magdalene comes to the tomb early, while it was still dark, and sees the stone having been taken away from the tomb.
translation:
  language: vi
  text: Vào ngày thứ nhất trong tuần[a], Ma-ri Ma-đơ-len đến mộ vào lúc sáng sớm, khi trời vẫn còn tối, và thấy tảng đá đã được dời khỏi mộ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Theo sát mặt chữ: “vào một [ngày] của các ngày Sa-bát”; đây là một thành ngữ có nghĩa là “vào ngày thứ nhất trong tuần.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τῇ δὲ μιᾷ τῶν σαββάτων
  choice: Vào ngày thứ nhất trong tuần
  rationale: Cụm từ này theo sát mặt chữ là “vào ngày thứ nhất của các ngày Sa-bát”, nhưng trong tiếng Hy Lạp Koine là cách nói chỉ ngày thứ nhất trong tuần. Không dịch riêng δέ vì trong câu tiếng Việt, một từ nối như “bấy giờ” hoặc “nhưng” dễ làm tăng sắc thái thời gian hay tương phản không có trong ngữ cảnh.
- source_word: Μαρία ἡ Μαγδαληνὴ
  choice: Ma-ri Ma-đơ-len
  rationale: Dùng dạng phiên âm tên riêng quen thuộc, rõ ràng trong tiếng Việt hiện đại.
- source_word: ἔρχεται
  choice: đến
  rationale: Tiếng Việt không biến đổi động từ theo thì, nên “đến” tự nhiên giữ được tính trực tiếp của hiện tại lịch sử trong lời kể.
- source_word: πρωῒ σκοτίας ἔτι οὔσης
  choice: từ sáng sớm, lúc trời vẫn còn tối
  rationale: “Từ sáng sớm” diễn đạt πρωῒ mà không đồng nhất nó với lúc rạng đông; mệnh đề sau giữ rõ hoàn cảnh bóng tối vẫn tiếp diễn.
- source_word: εἰς τὸ μνημεῖον
  choice: đến mộ
  rationale: Trong ngữ cảnh mai táng, μνημεῖον chỉ ngôi mộ; “mộ” là cách diễn đạt tự nhiên và không thêm chi tiết về cấu trúc.
- source_word: βλέπει
  choice: thấy
  rationale: Cách dịch trực tiếp, tự nhiên, giữ nhịp kể sống động mà không thêm ý quan sát kỹ hay bất ngờ.
- source_word: τὸν λίθον ἠρμένον ἐκ τοῦ μνημείου
  choice: tảng đá đã được dời khỏi mộ
  rationale: '“Đã được dời” thể hiện thể hoàn thành bị động: hành động đã xảy ra và tảng đá đang ở trạng thái không còn tại vị trí ở mộ. “Dời” giữ nghĩa rộng của αἴρω, không xác định ai thực hiện.'
theological_decisions:
- issue: Thì hiện tại lịch sử trong trình thuật phục sinh
  choice: 'Dùng các động từ tiếng Việt không kèm dấu hiệu quá khứ: “đến”, “thấy”'
  alternative: Thêm dấu hiệu quá khứ hoặc chuyển toàn câu thành lối kể quá khứ
  rationale: Tiếng Việt không bắt buộc đánh dấu thì trên động từ; cách dịch này tự nhiên và vẫn giữ tính trực tiếp của hiện tại lịch sử Hy Lạp, không thêm diễn giải thần học.
- issue: Tác nhân dời tảng đá
  choice: Giữ cấu trúc bị động “đã được dời”
  alternative: Nêu rõ thiên sứ, Đức Chúa Trời hoặc một tác nhân khác đã dời tảng đá
  rationale: Bản văn ở câu này không nêu tác nhân, nên bản dịch không xác định thêm.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu giữ nhịp kể trực tiếp của nguyên văn, tránh thêm từ nối hoặc giải thích không có trong bản Hy Lạp.
