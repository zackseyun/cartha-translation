  text: καὶ παρακύψας βλέπει κείμενα τὰ ὀθόνια, οὐ μέντοι εἰσῆλθεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/005.yaml
  text: And stooping to look in[a], he sees the linen cloths lying there, yet he did not enter.
translation:
  language: vi
  text: Ông cúi xuống nhìn vào trong và thấy những dải vải lanh đang nằm đó, nhưng ông không bước vào.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρακύψας
  choice: cúi xuống nhìn vào trong
  rationale: Diễn đạt cả động tác cúi người lẫn hướng nhìn vào trong mộ, phù hợp với phân từ aorist trong ngữ cảnh.
- source_word: βλέπει
  choice: thấy
  rationale: Tiếng Việt không đánh dấu thì trên động từ; cách kể hiện tại lịch sử của Hy Lạp được giữ tự nhiên trong mạch thuật bằng động từ trực tiếp, sinh động.
- source_word: κείμενα
  choice: đang nằm đó
  rationale: Diễn tả trạng thái các dải vải ở vị trí nằm; “đó” làm câu tự nhiên và chỉ vị trí trong mộ mà không hàm ý chúng được ai chủ ý đặt xuống.
- source_word: τὰ ὀθόνια
  choice: những dải vải lanh
  rationale: ὀθόνια chỉ các mảnh hoặc dải vải lanh dùng trong việc mai táng; cách dịch này cụ thể, tự nhiên và không thêm ý ngoài văn cảnh.
- source_word: οὐ μέντοι
  choice: nhưng ... không
  rationale: Giữ sắc thái tương phản nhẹ giữa việc nhìn thấy và việc chưa bước vào.
- source_word: εἰσῆλθεν
  choice: bước vào
  rationale: Cách nói tự nhiên trong tiếng Việt, đồng thời diễn đạt rõ hành động đi vào bên trong ngôi mộ.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Đại từ “ông” giữ sự tôn trọng đối với người môn đồ được nhắc đến trong ngữ cảnh. Không thêm chú thích vì cấu trúc tiếng Việt “đang nằm đó” tự nhiên và không cần trình bày một phương án cú pháp khó tạo khác biệt thực chất trong bản dịch.
