- from: Nếu anh em tha tội cho ai, thì tội của người ấy đã được tha; nếu anh em giữ lại tội của ai, thì tội ấy vẫn bị giữ lại.[a]
  to: Nếu anh em tha tội cho ai, thì tội của người ấy đã được tha; nếu anh em giữ lại tội của ai, thì tội của người ấy đã bị giữ lại.[a]
  rationale: Chỉ thay «vẫn bị giữ lại» bằng «đã bị giữ lại» trong chính văn và chú thích để phản ánh nhất quán hai thể hoàn thành bị động của tiếng Hy Lạp. Bản sửa vẫn giữ tác nhân không được nêu, tính điều kiện bất định, và sự căng thẳng thần học của nguyên văn.
