review_pass:
  verdict: revise
  source_fidelity: Bản dịch phản ánh đúng cấu trúc điều kiện bất định (ἄν ...), hai động từ chủ động ngôi thứ hai số nhiều («anh em tha/giữ lại»), và hai động từ bị động thể hoàn thành. Việc không nêu tác nhân của thể bị động là đúng, không áp đặt cách giải thích thần học. Tuy nhiên, «vẫn bị giữ lại» chuyển trọng tâm của κεκράτηνται sang tính tiếp diễn («vẫn») thay vì đánh dấu kết quả hoàn tất như vế song song ἀφέωνται; «đã bị giữ lại» sát hơn và đối xứng hơn.
  naturalness: «Nếu anh em tha tội cho ai ...; nếu anh em giữ lại tội của ai ...» là tiếng Việt hiện đại, trang trọng và rõ nghĩa. Lặp lại «tội của người ấy» giúp tránh việc đại từ «chúng» hoặc «nó» trở nên mơ hồ. Dùng «đã bị giữ lại» tự nhiên trong văn cảnh này và làm hai vế cân xứng.
  terminology: «Tha tội» là cách dùng chuẩn và tự nhiên cho ἀφίημι trong ngữ cảnh này. «Giữ lại tội» giữ được đối lập từ vựng với «tha tội» và không diễn giải thành «không tha». «Anh em» phù hợp với lời phán trực tiếp dành cho nhóm môn đồ.
  issues:
