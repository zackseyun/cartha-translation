base_translation:
  language: en
  yaml_path: translation/nt/john/020/023.yaml
  text: If you forgive the sins of any[a], they have been forgiven them; if you retain them[b], they have been retained.
translation:
  language: vi
  text: Nếu anh em tha tội cho ai, thì tội của người ấy đã được tha; nếu anh em giữ lại tội của ai, thì tội của người ấy đã bị giữ lại.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch sát cấu trúc song song hơn: “Nếu anh em tha tội cho bất cứ ai, tội của người ấy đã được tha; nếu anh em giữ lại tội của bất cứ ai, tội của người ấy đã bị giữ lại.” Hai động từ bị động trong tiếng Hy Lạp đều ở thể hoàn thành, có thể nhấn mạnh một hành động đã hoàn tất với kết quả vẫn còn hiệu lực.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄν τινων
  choice: Nếu ... cho ai / của ai
  rationale: Cấu trúc ἄν với động từ giả định diễn tả điều kiện không xác định. Cách dịch này giữ được cả ý điều kiện lẫn đối tượng không xác định, đồng thời tự nhiên trong tiếng Việt.
- source_word: ἀφῆτε
  choice: anh em tha
  rationale: Trong ngữ cảnh nói về tội lỗi, ἀφίημι có nghĩa thông dụng là “tha”. Đại từ “anh em” phù hợp với nhóm môn đồ được Chúa Giê-su trực tiếp phán bảo.
- source_word: τὰς ἁμαρτίας
  choice: tội
  rationale: Tiếng Việt thường dùng danh từ khối “tội” trong cấu trúc “tha tội cho ai”; thêm “các” hoặc lặp “những tội lỗi” sẽ nặng nề mà không tăng độ chính xác.
- source_word: ἀφέωνται αὐτοῖς
  choice: tội của người ấy đã được tha
  rationale: Giữ thể bị động và dùng “đã được tha” để phản ánh thể hoàn thành, tức hành động đã xảy ra với kết quả còn hiệu lực. Việc nêu lại “tội của người ấy” tránh sự mơ hồ về chủ thể trong tiếng Việt.
- source_word: κρατῆτε
  choice: anh em giữ lại
  rationale: κρατέω ở đây đối lập với “tha”, mang nghĩa giữ lại, không buông tha. “Giữ lại” bảo toàn hình ảnh và không diễn giải thành “không tha” ngay trong chính văn.
- source_word: κεκράτηνται
  choice: tội ấy vẫn bị giữ lại
  rationale: Thể hoàn thành bị động được diễn đạt bằng “vẫn bị giữ lại”, nhấn mạnh trạng thái còn tiếp diễn và duy trì thế song song với “đã được tha”.
theological_decisions:
- issue: Mối liên hệ giữa hành động của các môn đồ và sự tha hoặc giữ tội của Đức Chúa Trời
  choice: 'Giữ nguyên thể bị động: “đã được tha” và “vẫn bị giữ lại”, không nêu tác nhân.'
  alternative: Diễn giải rõ tác nhân là Đức Chúa Trời, hoặc dịch đơn giản “sẽ được tha / sẽ không được tha”.
  rationale: Bản Hy Lạp không nêu tác nhân của hai động từ bị động. Cách dịch này không quyết định thay cho văn bản rằng hành động của các môn đồ tự mình tạo ra kết quả hay công bố một thực tại do Đức Chúa Trời thiết lập; đồng thời vẫn phản ánh sắc thái kết quả còn hiệu lực của thể hoàn thành.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” cho đại từ số nhiều chỉ các môn đồ; tránh thuật ngữ giáo hội như “xá giải” hoặc “cầm buộc”. Dấu chú thích [a] được đặt sau toàn câu vì giải thích cấu trúc và thể động từ của cả hai vế.
