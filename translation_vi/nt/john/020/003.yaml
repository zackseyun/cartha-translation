source:
  edition: SBLGNT
  text: ἐξῆλθεν οὖν ὁ Πέτρος καὶ ὁ ἄλλος μαθητής, καὶ ἤρχοντο εἰς τὸ μνημεῖον.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/003.yaml
  text: So Peter and the other disciple went out and were going to the tomb[a].
translation:
  language: vi
  text: Vì thế, Phi-e-rơ và môn đồ kia đi ra, rồi đi đến ngôi mộ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “họ đang đi đến ngôi mộ.” Động từ Hy Lạp ở thì chưa hoàn thành có thể được dịch đơn giản như trong câu chính, nhưng cách dịch “đang đi” biểu đạt rõ hơn hành động đang diễn tiến.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: đi ra
  rationale: Động từ aorist của ἐξέρχομαι diễn tả việc rời khỏi một nơi; “đi ra” tự nhiên và giữ được ý hướng ra ngoài.
- source_word: οὖν
  choice: Vì thế
  rationale: Liên từ nối hành động này như hệ quả trong mạch kể từ câu trước; “Vì thế” rõ ràng và tự nhiên trong tiếng Việt hiện đại.
- source_word: ὁ Πέτρος
  choice: Phi-e-rơ
  rationale: Dùng dạng phiên âm tên riêng quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
- source_word: ὁ ἄλλος μαθητής
  choice: môn đồ kia
  rationale: “Môn đồ” phù hợp với ngữ cảnh sách Phúc Âm; “kia” nhận diện người môn đồ còn lại đã được nhắc đến trong văn cảnh.
- source_word: ἤρχοντο
  choice: đi đến
  rationale: Động từ chỉ sự di chuyển hướng đến ngôi mộ. Cách dịch này tự nhiên trong câu kể tiếng Việt; sắc thái hành động đang diễn tiến của thì chưa hoàn thành được nêu trong chú thích.
- source_word: εἰς τὸ μνημεῖον
  choice: đến ngôi mộ
  rationale: Trong ngữ cảnh, μνημεῖον là nơi chôn cất Đức Chúa Jêsus. “Đến” diễn tả hướng tới đích mà không hàm ý họ đã đi vào bên trong.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng tự nhiên, dễ hiểu đối với độc giả Việt Nam hiện đại. Dùng “rồi” để nối hai hành động mạch lạc mà không làm thay đổi đích đến hay hàm ý họ đã vào trong mộ.
