id: JHN.20.25
reference: John 20:25
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἔλεγον οὖν αὐτῷ οἱ ἄλλοι μαθηταί· Ἑωράκαμεν τὸν κύριον. ὁ δὲ εἶπεν αὐτοῖς· Ἐὰν μὴ ἴδω ἐν ταῖς χερσὶν αὐτοῦ τὸν τύπον τῶν ἥλων καὶ βάλω τὸν δάκτυλόν μου εἰς τὸν τύπον τῶν ἥλων καὶ βάλω ⸂μου τὴν χεῖρα⸃ εἰς τὴν πλευρὰν αὐτοῦ, οὐ μὴ πιστεύσω.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/025.yaml
  text: So the other disciples were telling him[a], “We have seen the Lord.” But he said to them, “Unless I see in his hands the mark of the nails, and put my finger into the mark of the nails, and put my hand into his side, I will certainly not believe.”
translation:
  language: vi
  text: 'Vì vậy, các môn đồ khác cứ nói với ông: “Chúng tôi đã thấy Chúa.” Nhưng ông nói với họ: “Nếu tôi không thấy dấu đinh nơi hai bàn tay Ngài, không đặt ngón tay tôi vào dấu đinh ấy và không đặt bàn tay tôi vào sườn Ngài, thì tôi nhất định không tin.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “tôi sẽ không bao giờ tin.” Tiếng Hy Lạp dùng lối phủ định nhấn mạnh.'
    reason: Nêu cách chuyển ngữ khác cho cấu trúc phủ định mạnh οὐ μή và giúp người đọc nhận biết sắc thái dứt khoát của nguyên văn.
lexical_decisions:
- source_word: ἔλεγον
  choice: cứ nói
  rationale: Thì chưa hoàn thành diễn tả hành động đang tiếp diễn hoặc lặp lại; “cứ nói” truyền đạt tự nhiên việc các môn đồ nhiều lần quả quyết với Tô-ma.
- source_word: οὖν
  choice: Vì vậy
  rationale: Giữ chức năng nối kết và suy diễn trong mạch tường thuật, đồng thời phù hợp với văn phong tiếng Việt hiện đại.
- source_word: Ἑωράκαμεν
  choice: Chúng tôi đã thấy
  rationale: Thì hoàn thành chỉ một việc đã xảy ra nhưng vẫn có ý nghĩa ở hiện tại; “đã thấy” là cách diễn đạt tự nhiên nhất trong tiếng Việt.
- source_word: τὸν κύριον
  choice: Chúa
  rationale: Trong ngữ cảnh này, κύριος là tước hiệu chỉ Chúa Giê-su phục sinh; “Chúa” vừa trang trọng vừa quen thuộc.
- source_word: ἐν ταῖς χερσὶν αὐτοῦ
  choice: nơi hai bàn tay Ngài
  rationale: “Nơi” diễn đạt vị trí của dấu đinh một cách tự nhiên; “hai bàn tay” làm rõ dạng số nhiều của χερσίν mà không thay đổi ý nghĩa.
- source_word: τὸν τύπον τῶν ἥλων
  choice: dấu đinh
  rationale: τύπος ở đây là dấu hoặc vết do đinh để lại. “Dấu đinh” ngắn gọn, cụ thể và quen thuộc hơn “vết in của những chiếc đinh”.
- source_word: βάλω ... εἰς
  choice: đặt ... vào
  rationale: Diễn tả đúng chuyển động vào trong được nêu bởi εἰς, đồng thời giữ hình ảnh mạnh và cụ thể trong lời đòi hỏi của Tô-ma.
- source_word: τὴν πλευρὰν αὐτοῦ
  choice: sườn Ngài
  rationale: πλευρά chỉ phần bên hông hoặc sườn thân thể; “sườn” là cách dịch trang trọng, chính xác và phù hợp với ngữ cảnh vết thương.
- source_word: οὐ μὴ πιστεύσω
  choice: tôi nhất định không tin
  rationale: Cấu trúc οὐ μή với động từ giả định tương lai tạo lời phủ định đặc biệt mạnh; “nhất định không tin” giữ được sự nhấn mạnh mà không biến lời nói thành một sự phủ nhận vĩnh viễn ngoài điều kiện vừa nêu.
theological_decisions:
- issue: Mức độ dứt khoát trong lời từ chối của Tô-ma (οὐ μὴ πιστεύσω)
  choice: “tôi nhất định không tin”
  alternative: “tôi sẽ không bao giờ tin”
  rationale: Bản dịch chính giữ sức nặng của phủ định kép Hy Lạp nhưng vẫn gắn lời từ chối với điều kiện Tô-ma vừa nêu. Cách dịch “không bao giờ” có thể được hiểu là một quyết định tuyệt đối và vĩnh viễn, mạnh hơn điều ngữ cảnh đòi hỏi.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” khi Tô-ma nói về Chúa Giê-su để duy trì sắc thái kính trọng; giữ cấu trúc điều kiện và ba động tác “thấy… đặt… đặt” nhằm bảo toàn nhịp điệu cùng sự căng thẳng trong nguyên văn.
