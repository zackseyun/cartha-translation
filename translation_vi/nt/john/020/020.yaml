  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ τοῦτο εἰπὼν ⸀ἔδειξεν τὰς χεῖρας καὶ τὴν πλευρὰν ⸀αὐτοῖς. ἐχάρησαν οὖν οἱ μαθηταὶ ἰδόντες τὸν κύριον.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/020.yaml
  text: And after saying this, he showed them his hands and his side. Then the disciples rejoiced when they saw the Lord.
translation:
  language: vi
  text: Sau khi nói điều đó, Ngài cho họ xem đôi tay và sườn mình. Vì thế, các môn đệ vui mừng khi thấy Chúa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦτο εἰπὼν
  choice: Sau khi nói điều đó
  rationale: Phân từ bất định diễn tả hành động xảy ra trước động từ chính; cách dịch này tự nhiên và giữ rõ trình tự thời gian.
- source_word: ἔδειξεν
  choice: cho ... xem
  rationale: Trong ngữ cảnh, δείκνυμι có nghĩa đưa ra để người khác nhìn thấy; “cho xem” là cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: τὰς χεῖρας
  choice: hai bàn tay
  rationale: Danh từ số nhiều chỉ đôi tay của Đức Chúa Jêsus; tiếng Việt tự nhiên dùng “hai bàn tay”, còn quan hệ sở hữu đã rõ nhờ “mình” ở cuối cụm song song.
- source_word: τὴν πλευράν
  choice: cạnh sườn mình
  rationale: πλευρά chỉ phần bên hông hoặc cạnh sườn. “Cạnh sườn” tự nhiên, chính xác và gợi đến vết thương đã được nhắc đến mà không thêm ý ngoài bản văn.
- source_word: αὐτοῖς
  choice: họ
  rationale: Đại từ tặng cách được kết hợp tự nhiên trong cấu trúc tiếng Việt “cho họ xem”.
- source_word: ἐχάρησαν
  choice: vui mừng
  rationale: χαίρω diễn tả niềm vui rõ rệt; “vui mừng” vừa thông dụng vừa giữ được sức nặng của động từ.
- source_word: οὖν
  choice: Bấy giờ
  rationale: οὖν nối kết phản ứng của các môn đồ với việc Đức Chúa Jêsus cho họ xem tay và cạnh sườn; “bấy giờ” truyền đạt mạch tiếp diễn và kết quả trong lối kể chuyện tự nhiên.
- source_word: οἱ μαθηταί
  choice: các môn đồ
  rationale: “Môn đồ” là từ quen thuộc và chính xác trong văn cảnh Tin Lành để chỉ những người theo học Đức Chúa Jêsus.
- source_word: ἰδόντες
  choice: khi thấy
  rationale: Phân từ bất định nêu hoàn cảnh hoặc nguyên nhân của niềm vui; “khi thấy” giữ được quan hệ này mà không giải thích quá mức.
- source_word: τὸν κύριον
  choice: Chúa
  rationale: κύριος ở đây vừa nhận diện Đức Chúa Jêsus vừa mang sức nặng tước hiệu; “Chúa” bảo tồn điều đó trong tiếng Việt.
theological_decisions:
- issue: Cách dịch κύριος
  choice: Chúa
  alternative: Thầy; chủ
  rationale: Trong trình thuật Đức Chúa Jêsus sống lại, κύριος không chỉ là cách xưng hô lịch sự mà còn là tước hiệu Kitô học. “Chúa” giữ được chiều sâu ấy mà không bổ sung diễn giải.
- issue: Chủ thể ngầm của ἔδειξεν
  choice: Nêu rõ “Đức Chúa Jêsus”
  alternative: Dùng đại từ “Ngài”
  rationale: Tiếng Hy Lạp cho phép lược chủ ngữ vì đã rõ từ văn cảnh. Trong câu tiếng Việt đứng riêng, nêu danh xưng giúp câu sáng rõ mà không thay đổi nội dung.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Đức Chúa Jêsus”, “môn đồ” và “Chúa” theo lối dùng Tin Lành tiếng Việt; cấu trúc câu gọn, giữ nguyên quan hệ thời gian và phản ứng vui mừng trong nguyên văn.
