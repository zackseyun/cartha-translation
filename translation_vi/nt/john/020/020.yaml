  - severity: low
    issue: “Cạnh sườn” kém tự nhiên
    rationale: πλευρά ở đây là “sườn/bên sườn”; “sườn mình” diễn đạt gọn và tự nhiên hơn, không thay đổi nghĩa.
  - severity: low
    issue: Liên từ οὖν chưa được phản ánh đầy đủ
    rationale: “Bấy giờ” chỉ thời gian. “Vì thế” diễn đạt sự tiếp nối có tính kết quả của niềm vui sau khi họ thấy Chúa.
