  to: Bấy giờ, người môn đồ kia, là người đã đến mộ trước, cũng đi vào[a]. Ông thấy và tin[b].
  rationale: Bản sửa thay «bước vào» bằng «đi vào» để tránh thêm sắc thái không được nêu rõ trong động từ Hy Lạp, và làm rõ trong chú thích rằng lựa chọn diễn giải cuối là một lời báo trước đó, không phải một lời tiên báo. Nội dung niềm tin vẫn được giữ không xác định trong câu dịch chính.
