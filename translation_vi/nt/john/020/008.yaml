source:
  edition: SBLGNT
  text: τότε οὖν εἰσῆλθεν καὶ ὁ ἄλλος μαθητὴς ὁ ἐλθὼν πρῶτος εἰς τὸ μνημεῖον, καὶ εἶδεν καὶ ἐπίστευσεν·
base_translation:
  language: en
  yaml_path: translation/nt/john/020/008.yaml
  text: Then the other disciple[a], who had arrived at the tomb first, also went in[b], and he saw and believed.
translation:
  language: vi
  text: Bấy giờ, người môn đồ kia, là người đã đến mộ trước, cũng đi vào[a]. Ông thấy và tin[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “vào.”
    reason: lexical_alternative
  - marker: b
    text: Tiếng Hy Lạp chỉ nói “tin” mà không nêu rõ ông tin điều gì. Có thể hiểu là ông tin Chúa Giê-su đã sống lại, tin những bằng chứng trước mắt, hoặc tin lời báo đã được nói trước đó.
    reason: alternative_reading
lexical_decisions:
- source_word: τότε οὖν
  choice: Bấy giờ
  rationale: Cụm từ này vừa nối tiếp trình tự câu chuyện vừa hàm ý suy ra nhẹ. “Bấy giờ” diễn đạt tự nhiên diễn tiến của trình thuật mà không nhấn quá mức sắc thái kết luận.
- source_word: εἰσῆλθεν
  choice: bước vào
  rationale: Động từ chỉ hành động đi vào. “Bước vào” tự nhiên trong tiếng Việt hiện đại và giữ được chuyển động cụ thể; “vào” là cách dịch ngắn gọn hơn.
- source_word: ὁ ἄλλος μαθητής
  choice: người môn đồ kia
  rationale: “Môn đồ” là cách gọi quen thuộc và chính xác trong văn cảnh Giăng; “kia” giúp nhận diện người đã được nhắc đến trong trình thuật.
- source_word: ὁ ἐλθὼν πρῶτος εἰς τὸ μνημεῖον
  choice: là người đã đến mộ trước
  rationale: Cách diễn đạt này phản ánh hành động xảy ra trước động từ chính và cho biết người môn đồ ấy đã đến nơi trước.
- source_word: μνημεῖον
  choice: mộ
  rationale: Trong văn cảnh mai táng và phục sinh, từ này chỉ nơi đặt thi hài. “Mộ” rõ ràng, tự nhiên và trang trọng trong tiếng Việt.
- source_word: καὶ εἶδεν
  choice: Ông thấy
  rationale: “Thấy” là tương đương trực tiếp; thêm đại từ “ông” làm rõ chủ thể sau mệnh đề chen giữa và tạo câu tiếng Việt tự nhiên.
- source_word: ἐπίστευσεν
  choice: tin
  rationale: Bản Hy Lạp không nêu đối tượng hay nội dung của niềm tin. Dịch đơn giản là “tin” giữ nguyên sự ngắn gọn và mơ hồ có chủ ý của nguồn.
theological_decisions:
- issue: Người môn đồ đã tin điều gì
  choice: Dịch tuyệt đối là “tin”, không bổ sung nội dung ông tin.
  alternative: tin rằng Chúa Giê-su đã sống lại; tin lời Ma-ri báo; bắt đầu có đức tin
  rationale: Nguyên văn không nói rõ đối tượng hoặc nội dung của động từ “tin”. Việc thêm một nội dung cụ thể sẽ giải quyết thay cho bản văn một câu hỏi diễn giải, nhất là khi xét đến câu kế tiếp. Cách dịch này giữ nguyên sức căng trong trình thuật và thần học.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng câu ngắn ở vế cuối để giữ nhịp kể và sức nhấn của hai động từ “thấy” và “tin”. Các dấu chú thích được đặt ngay sau từ ngữ mà chúng giải thích.
