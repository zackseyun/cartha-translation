translation_notes:
  register: Bản dịch dùng tiếng Việt hiện đại, trang trọng và dễ hiểu. “Ma-ri” theo lối phiên âm tên riêng quen thuộc trong Kinh Thánh tiếng Việt; đại từ “bà” thể hiện sự tôn trọng tự nhiên. Dấu phẩy cuối câu của lớp tham khảo tiếng Anh không được giữ vì câu tiếng Việt đứng độc lập tại ranh giới câu.
