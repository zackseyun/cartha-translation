  yaml_path: translation/nt/john/020/011.yaml
  text: But Mary was standing outside the tomb, weeping. So, as she was weeping, she bent over to look into the tomb,
translation:
  language: vi
  text: Nhưng Ma-ri đứng bên ngoài mộ mà khóc. Trong lúc khóc, bà cúi xuống nhìn vào trong mộ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “bà khom người nhìn vào trong mộ.” Động từ Hy Lạp bao hàm ý cúi hoặc khom người xuống để nhìn vào.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Nhưng
  rationale: Đánh dấu sự chuyển cảnh có sắc thái tương phản nhẹ với việc các môn đồ đã trở về nhà ở câu trước.
- source_word: εἱστήκει
  choice: đứng
  rationale: Trong kết cấu với động từ chỉ vị trí, diễn tả trạng thái đang tiếp diễn của Ma-ri; tiếng Việt tự nhiên không cần thêm từ tương đương riêng cho thì quá khứ tiếp diễn.
- source_word: πρὸς τῷ μνημείῳ ἔξω
  choice: bên ngoài mộ
  rationale: Diễn đạt tự nhiên vị trí của Ma-ri ở ngoài ngôi mộ, đồng thời giữ sự tương phản không gian với việc bà nhìn vào bên trong.
- source_word: μνημεῖον
  choice: mộ
  rationale: Chỉ ngôi mộ dùng để an táng trong bối cảnh này; “mộ” là cách gọi chính xác, trang trọng vừa phải và thông dụng trong tiếng Việt hiện đại.
- source_word: κλαίουσα / ἔκλαιεν
  choice: mà khóc / Trong lúc khóc
  rationale: Giữ ý hành động khóc kéo dài và sự lặp lại có chủ ý trong nguyên văn, nhưng dùng cấu trúc tự nhiên của tiếng Việt.
- source_word: ὡς οὖν
  choice: Trong lúc
  rationale: Liên kết hành động cúi nhìn với việc bà vẫn đang khóc; tiếng Việt không cần biểu đạt οὖν bằng một từ chỉ kết quả mạnh như “vì vậy” trong mạch kể này.
- source_word: παρέκυψεν
  choice: cúi xuống nhìn
  rationale: Bao hàm cả động tác cúi người và mục đích nhìn vào; tự nhiên trong bối cảnh cửa mộ và giữ đầy đủ nội dung của động từ Hy Lạp.
- source_word: εἰς τὸ μνημεῖον
  choice: vào trong mộ
  rationale: Giữ hướng nhìn về phía nội thất của ngôi mộ; “vào trong” làm rõ nét nghĩa phương hướng của εἰς.
