revisions:
- from: 'Đức Giê-su nói với bà: “Thưa bà, sao bà khóc? Bà tìm ai?” Bà tưởng người là người làm vườn, nên nói: “Thưa ông[a], nếu ông đã mang người ấy đi, xin cho tôi biết ông đã đặt người ấy ở đâu, tôi sẽ đem người ấy về.”'
  to: 'Đức Giê-su nói với bà: “Thưa bà, sao bà khóc? Bà tìm ai?” Bà tưởng Người là người làm vườn, nên nói: “Thưa ông[a], nếu ông đã mang người ấy đi, xin cho tôi biết ông đã đặt người ấy ở đâu, tôi sẽ đem người ấy đi.”'
  rationale: Chỉ sửa “đem người ấy về” thành “đem người ấy đi” để phản ánh αἴρω mà không thêm hướng chuyển động. Chuẩn hóa nhẹ câu chú thích để làm rõ rằng khả năng “Lạy Chúa” thuộc về từ Hy Lạp Κύριε, không phải toàn câu.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T08:26:45Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch theo sát cấu trúc và các tham chiếu của bản Hy Lạp: Đức Giê-su hỏi lý do Ma-ri khóc và người bà tìm; bà lầm tưởng Người là người làm vườn; và lời thỉnh cầu giữ được các động từ mang đi, đặt, rồi mang đi. Tuy nhiên, “tôi sẽ đem người ấy về” thêm hướng chuyển động “về” không có trong ἀρῶ, vốn chỉ nói bà sẽ mang/cất người ấy đi.'
  naturalness: Văn phong hiện đại, lịch sự và tự nhiên. “Thưa bà,” “Thưa ông,” “người làm vườn,” và “xin cho tôi biết” phù hợp ngữ cảnh. Thay “đem ... về” bằng “đem ... đi” vừa tự nhiên vừa tránh thêm ý.
  terminology: “Đức Giê-su” và cách phân biệt “Người” trong lời trần thuật với “người ấy” trong lời Ma-ri là nhất quán và phù hợp việc bà chưa nhận ra Đức Giê-su. “Thưa ông” là cách dịch đúng theo ngữ cảnh của Κύριε; chú thích bảo lưu lựa chọn “Lạy Chúa” một cách thích hợp.
  issues:
  - severity: medium
    issue: “tôi sẽ đem người ấy về”
    rationale: Từ “về” xác định hướng đến một nơi của người nói, nhưng κἀγὼ αὐτὸν ἀρῶ chỉ có nghĩa “và tôi sẽ mang/cất người ấy đi.” Bản nguồn không nói người ấy sẽ được mang về đâu.
  revised_text: 'Đức Giê-su nói với bà: “Thưa bà, sao bà khóc? Bà tìm ai?” Bà tưởng Người là người làm vườn, nên nói: “Thưa ông[a], nếu ông đã mang người ấy đi, xin cho tôi biết ông đã đặt người ấy ở đâu, tôi sẽ đem người ấy đi.”'
