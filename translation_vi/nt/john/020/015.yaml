id: JHN.20.15
reference: John 20:15
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: λέγει ⸀αὐτῇ Ἰησοῦς· Γύναι, τί κλαίεις; τίνα ζητεῖς; ἐκείνη δοκοῦσα ὅτι ὁ κηπουρός ἐστιν λέγει αὐτῷ· Κύριε, εἰ σὺ ἐβάστασας αὐτόν, εἰπέ μοι ποῦ ἔθηκας αὐτόν, κἀγὼ αὐτὸν ἀρῶ.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/015.yaml
  text: Jesus says to her[a], “Woman, why are you weeping? Whom are you seeking?” She, supposing that he was the gardener, says to him, “Sir, if you carried him away, tell me where you put him, and I will take him away.”
translation:
  language: vi
  text: 'Đức Giê-su nói với bà: “Thưa bà, sao bà khóc? Bà tìm ai?” Bà tưởng Người là người làm vườn, nên nói: “Thưa ông[a], nếu ông đã mang người ấy đi, xin cho tôi biết ông đã đặt người ấy ở đâu, tôi sẽ đem người ấy đi.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hy Lạp này cũng có thể được dịch là “Lạy Chúa”; ở đây rất có thể là lời xưng hô kính trọng “Thưa ông”, vì Ma-ri tưởng mình đang nói với người làm vườn.
    reason: alternative_reading
lexical_decisions:
- source_word: Γύναι
  choice: Thưa bà
  rationale: Lối xưng hô trực tiếp nhưng kính trọng; tự nhiên trong tiếng Việt hiện đại và không mang sắc thái miệt thị.
- source_word: τί κλαίεις
  choice: sao bà khóc
  rationale: Diễn đạt tự nhiên câu hỏi về lý do, đồng thời giữ sắc thái đau buồn của κλαίω.
- source_word: τίνα ζητεῖς
  choice: Bà tìm ai?
  rationale: Cách nói hiện đại, rõ nghĩa, giữ đối tượng chỉ người của τίνα và ý tìm kiếm của ζητέω.
- source_word: δοκοῦσα
  choice: tưởng
  rationale: Thể hiện nhận định nhầm của Ma-ri một cách ngắn gọn, không làm tăng mức độ chắc chắn.
- source_word: ὁ κηπουρός
  choice: người làm vườn
  rationale: Tương đương trực tiếp, tự nhiên của κηπουρός.
- source_word: Κύριε
  choice: Thưa ông
  rationale: Trong ngữ cảnh Ma-ri tưởng đang nói với người làm vườn, κύριε là lời xưng hô kính trọng hơn là lời tuyên xưng thần học.
- source_word: ἐβάστασας αὐτόν
  choice: ông đã mang người ấy đi
  rationale: Giữ ý di chuyển thân thể bằng động từ βαστάζω, đồng thời tránh cách nói thô hoặc mơ hồ.
- source_word: ποῦ ἔθηκας αὐτόν
  choice: ông đã đặt người ấy ở đâu
  rationale: Dịch trực tiếp τίθημι bằng “đặt”, phù hợp với ngữ cảnh vị trí của thi thể.
- source_word: κἀγὼ αὐτὸν ἀρῶ
  choice: tôi sẽ đem người ấy về
  rationale: Diễn đạt ý Ma-ri sẽ nhận và mang thi thể đi; “về” tự nhiên trong tiếng Việt nhưng không xác định một địa điểm không có trong bản Hy Lạp.
theological_decisions:
- issue: Cách dịch κύριε khi Ma-ri chưa nhận ra Đức Giê-su phục sinh
  choice: Thưa ông
  alternative: Lạy Chúa
  rationale: Ngữ cảnh cho biết bà tưởng người là người làm vườn, nên nghĩa xưng hô lịch sự là hợp lý nhất. Chú thích giữ nghĩa từ nguyên/thần học quen thuộc để người đọc kiểm chứng.
translation_notes:
  register: Văn phong trang trọng vừa phải, tự nhiên và dễ hiểu. Dùng “Đức Giê-su” và đại từ “người” trong lời trần thuật; dùng “người ấy” trong lời Ma-ri để tránh hàm ý bà đã nhận ra Đức Giê-su. Dấu chú thích [a] được đặt ngay sau cách dịch κύριε.
