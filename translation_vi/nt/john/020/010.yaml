  text: So the disciples went away again to their own homes[a].
translation:
  language: vi
  text: Vậy, các môn đồ lại trở về chỗ mình đang ở.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay, sát nghĩa hơn, “về với chính mình” hoặc “về chỗ riêng của mình”. Cụm từ Hy Lạp có lẽ có nghĩa là họ trở về nơi mình đang lưu trú.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπῆλθον
  choice: trở về
  rationale: Động từ chỉ việc rời khỏi hiện trường; kết hợp với πάλιν và đích đến trong ngữ cảnh, “trở về” diễn đạt tự nhiên hành động quay lại nơi họ đang ở.
- source_word: οὖν
  choice: Vậy
  rationale: Từ nối đánh dấu sự tiếp nối hoặc kết quả trong diễn tiến câu chuyện; “Vậy” giữ được lực liên kết mà vẫn tự nhiên trong tiếng Việt.
- source_word: πάλιν
  choice: lại
  rationale: Diễn tả sự quay lại hoặc lặp lại; “lại” kết hợp tự nhiên với “trở về”.
- source_word: πρὸς αὑτούς
  choice: về chỗ mình đang ở
  rationale: Nghĩa đen là “về với chính mình/họ”, nhưng trong ngữ cảnh đây là thành ngữ chỉ nơi họ thuộc về hoặc đang lưu trú. Cách dịch này tránh khẳng định quá mức rằng mỗi người trở về nhà riêng.
- source_word: οἱ μαθηταί
  choice: các môn đồ
  rationale: Danh xưng quen thuộc trong văn mạch Tin Mừng dành cho những người theo học Chúa Giê-su; “các môn đồ” trang trọng, rõ nghĩa và phổ biến trong tiếng Việt Kinh Thánh.
theological_decisions: []
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Giữ nhịp kể ngắn gọn; dùng “chỗ mình đang ở” để truyền đạt thành ngữ Hy Lạp mà không thu hẹp nghĩa thành “nhà riêng”.
