  text: ἔτρεχον δὲ οἱ δύο ὁμοῦ· καὶ ὁ ἄλλος μαθητὴς προέδραμεν τάχιον τοῦ Πέτρου καὶ ἦλθεν πρῶτος εἰς τὸ μνημεῖον,
base_translation:
  language: en
  yaml_path: translation/nt/john/020/004.yaml
  text: The two were running together[a], and the other disciple ran ahead faster than Peter and came first to the tomb.
translation:
  language: vi
  text: Cả hai cùng chạy; người môn đồ kia chạy nhanh hơn Phi-e-rơ, vượt lên trước ông và đến mộ trước.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔτρεχον
  choice: chạy
  rationale: Trong kết cấu “cả hai cùng chạy”, tiếng Việt tự nhiên không cần đánh dấu riêng thể tiếp diễn của thì chưa hoàn thành; ngữ cảnh vẫn cho thấy hành động đang diễn ra.
- source_word: δὲ
  choice: ;
  rationale: δέ ở đây nối nhẹ hai mệnh đề. Dấu chấm phẩy thể hiện bước chuyển mà không áp đặt sắc thái đối lập mạnh như “nhưng”.
- source_word: οἱ δύο ὁμοῦ
  choice: cả hai cùng
  rationale: Diễn đạt tự nhiên, đồng thời giữ cả ý hai người và hành động chung.
- source_word: ὁ ἄλλος μαθητής
  choice: người môn đồ kia
  rationale: “Môn đồ” là cách gọi quen thuộc, trang trọng trong văn thuật chuyện Phúc Âm; “kia” phân biệt người này với Phi-e-rơ theo ngữ cảnh.
- source_word: προέδραμεν
  choice: vượt lên trước
  rationale: Giữ ý chạy vượt lên phía trước của động từ ghép, đồng thời tránh lặp từ “chạy” một cách nặng nề.
- source_word: τάχιον τοῦ Πέτρου
  choice: chạy nhanh hơn Phi-e-rơ
  rationale: Thể hiện rõ phép so sánh trong nguyên văn và phù hợp cú pháp tiếng Việt.
- source_word: ἦλθεν πρῶτος
  choice: đến ... đầu tiên
  rationale: Bám sát ý người ấy là người đến trước; cách nói tự nhiên trong tiếng Việt.
- source_word: εἰς τὸ μνημεῖον
  choice: đến mộ
  rationale: Ở đây μνημεῖον là nơi chôn cất Chúa Giê-su. “Đến mộ” phù hợp diễn tiến vì câu sau cho biết môn đồ chưa đi vào bên trong.
theological_decisions: []
translation_notes:
  register: Văn phong thuật chuyện hiện đại, trang trọng và dễ hiểu. Giữ tên riêng theo lối phiên âm Kinh Thánh tiếng Việt quen thuộc. Không thêm chú thích vì cách dịch chính đã thể hiện đồng thời ý “nhanh hơn” và “vượt lên trước” của nguyên văn.
