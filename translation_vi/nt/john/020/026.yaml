source:
  edition: SBLGNT
  text: Καὶ μεθ’ ἡμέρας ὀκτὼ πάλιν ἦσαν ἔσω οἱ μαθηταὶ αὐτοῦ καὶ Θωμᾶς μετ’ αὐτῶν. ἔρχεται ὁ Ἰησοῦς τῶν θυρῶν κεκλεισμένων, καὶ ἔστη εἰς τὸ μέσον καὶ εἶπεν· Εἰρήνη ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/026.yaml
  text: And after eight days, his disciples were inside again, and Thomas was with them. Jesus comes, though the doors had been shut, and stood in the midst and said, “Peace to you.”
translation:
  language: vi
  text: 'Tám ngày sau, các môn đệ của Ngài lại ở bên trong, và Thô-ma ở cùng họ. Dù các cửa đã đóng, Giê-su đến, đứng giữa họ và nói: “Bình an cho anh em!”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μεθ’ ἡμέρας ὀκτώ
  choice: Tám ngày sau
  rationale: Diễn đạt tự nhiên trong tiếng Việt, đồng thời giữ cách tính thời gian của nguyên văn mà không giải thích thêm.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: các môn đồ của Đức Chúa Jêsus
  rationale: Giữ thuật ngữ quen thuộc “môn đồ”; nêu rõ sở hữu chủ để câu tiếng Việt tự nhiên và tránh đại từ mơ hồ.
- source_word: τῶν θυρῶν κεκλεισμένων
  choice: Dù các cửa đều đã đóng
  rationale: Phân từ sở hữu cách diễn tả hoàn cảnh các cửa đang ở tình trạng đóng; “dù” truyền đạt sắc thái nhượng bộ hợp với ngữ cảnh nhưng không thêm cách thức Đức Chúa Jêsus đi vào.
- source_word: ἔρχεται
  choice: đến
  rationale: Hiện tại lịch sử trong tiếng Hy Lạp được chuyển thành lối kể tự nhiên của tiếng Việt; nội dung hành động vẫn được bảo toàn.
- source_word: Εἰρήνη ὑμῖν
  choice: Bình an cho các con!
  rationale: Giữ công thức chào và lời ban bình an; “các con” phù hợp quan hệ giữa Đức Chúa Jêsus và các môn đồ trong văn phong Kinh Thánh trang trọng, dễ hiểu.
theological_decisions:
- issue: Cách Đức Chúa Jêsus hiện diện khi các cửa đã đóng
  choice: Không nói Ngài đi xuyên qua cửa hay bằng cách nào vào được
  alternative: “Đức Chúa Jêsus đi xuyên qua các cửa đóng kín mà vào”
  rationale: Nguyên văn chỉ đặt việc Ngài đến trong hoàn cảnh các cửa đã đóng, không giải thích cơ chế; bản dịch giữ nguyên sự hàm ý và tính mầu nhiệm.
- issue: Thì hiện tại lịch sử của ἔρχεται
  choice: Dùng thì kể chuyện tự nhiên “đến”
  alternative: “Đức Chúa Jêsus đến” theo hiện tại kịch tính được hiểu ngầm, hoặc “bỗng đến”
  rationale: Tiếng Việt không biến đổi hình thái động từ theo thì; không thêm “bỗng” vì nguyên văn không có từ tương ứng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng “Đức Chúa Jêsus” và “môn đồ” theo lối gọi quen thuộc trong tiếng Việt Cơ Đốc; tránh giải thích vượt quá nguyên văn.
