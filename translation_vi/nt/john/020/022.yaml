  text: καὶ τοῦτο εἰπὼν ἐνεφύσησεν καὶ λέγει αὐτοῖς· Λάβετε πνεῦμα ἅγιον·
base_translation:
  language: en
  yaml_path: translation/nt/john/020/022.yaml
  text: And after saying this[a], he breathed on them and said to them, “Receive the Holy Spirit.”
translation:
  language: vi
  text: 'Nói xong, Ngài hà hơi trên họ[a] và nói với họ: “Hãy nhận Đức Thánh Linh.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “hà hơi vào họ.” Động từ này cũng gợi lại hình ảnh sáng tạo và sáng tạo mới trong Sáng Thế Ký 2:7 và Ê-xê-chi-ên 37.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο εἰπὼν
  choice: Nói xong
  rationale: Phân từ bất định chỉ hành động xảy ra trước động từ chính. “Nói xong” tự nhiên, gọn và giữ rõ trình tự thời gian.
- source_word: ἐνεφύσησεν
  choice: thổi hơi trên họ
  rationale: Động từ diễn tả hành động thổi hơi trên hoặc vào người khác. Cách dịch này tự nhiên trong tiếng Việt và không xác định quá mức hướng của hành động; phương án “thổi hơi vào họ” được giữ trong chú thích cùng âm hưởng sáng tạo.
- source_word: λέγει αὐτοῖς
  choice: bảo
  rationale: Hiện tại lịch sử của tiếng Hy Lạp được chuyển sang lối kể quá khứ tự nhiên trong tiếng Việt. “Bảo” phù hợp vì lời nói trực tiếp theo sau được hướng đến các môn đồ.
- source_word: Λάβετε
  choice: Hãy nhận
  rationale: Mệnh lệnh này nói đến việc tiếp nhận, không nhấn mạnh sự tự mình chiếm lấy; “hãy nhận” là cách diễn đạt tự nhiên và đúng ngữ cảnh.
- source_word: πνεῦμα ἅγιον
  choice: Đức Thánh Linh
  rationale: Trong ngữ cảnh Giăng, cụm từ không có mạo từ này vẫn chỉ Thánh Linh của Đức Chúa Trời. Danh xưng “Đức Thánh Linh” rõ ràng, trang trọng và quen thuộc trong tiếng Việt.
theological_decisions:
- issue: πνεῦμα ἅγιον chỉ Thánh Linh của Đức Chúa Trời hay một “linh thánh” không xác định
  choice: Đức Thánh Linh
  alternative: thánh linh; một linh thánh
  rationale: Ngữ cảnh của sách Giăng cho thấy đây là Thánh Linh của Đức Chúa Trời. Cách dịch này xác định đối tượng mà không thêm nội dung ngoài nguyên văn.
- issue: ἐνεφύσησεν nên hiểu là thổi hơi “trên” hay “vào” các môn đồ
  choice: thổi hơi trên họ, đồng thời ghi phương án “thổi hơi vào họ” trong chú thích
  alternative: thổi hơi vào họ
  rationale: Động từ gợi lại ngôn ngữ về sáng tạo và tái tạo trong bản Hy Lạp Cựu Ước, nhưng chính câu không nêu tân ngữ hay giới từ để buộc phải chọn một hướng duy nhất. Bản văn chính dùng cách diễn đạt ít xác định hơn và chú thích bảo tồn phương án còn lại.
- issue: Thì hiện tại lịch sử của λέγει trong lời kể
  choice: bảo
  alternative: bảo họ rằng theo sắc thái hiện tại lịch sử; nói với họ
  rationale: Tiếng Việt thường không đánh dấu thì bằng hình thái động từ. “Bảo” hòa hợp tự nhiên với mạch kể mà không làm thay đổi ý nghĩa thần học.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “Ngài” theo mạch quy chiếu về Chúa Giê-su và “Đức Thánh Linh” như một danh xưng thần linh quen thuộc; câu ngắn, giữ nhịp kể trực tiếp của nguyên văn.
