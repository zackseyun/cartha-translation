  source_fidelity: Bản nháp truyền đạt đúng trình tự của phân từ τοῦτο εἰπών, mệnh lệnh Λάβετε, và quy chiếu πνεῦμα ἅγιον là Đức Thánh Linh. Tuy nhiên, «thổi hơi trên họ» là cách kết hợp từ chưa tự nhiên trong tiếng Việt; «hà hơi trên họ» diễn đạt chính xác ἐνεφύσησεν mà không áp đặt hướng «vào». Động từ λέγει αὐτοῖς cũng nên giữ đối tượng tường minh là «họ».
