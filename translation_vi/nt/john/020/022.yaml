  - severity: low
    issue: Bản nháp không nêu tường minh đối tượng của λέγει αὐτοῖς.
    rationale: «Bảo» trước lời trực tiếp có thể hiểu được theo ngữ cảnh, nhưng «nói với họ» bảo toàn thành tố αὐτοῖς và rõ ràng hơn mà không làm câu nặng nề.
