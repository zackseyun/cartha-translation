  terminology: «Đức Thánh Linh» là danh xưng quen thuộc, trang trọng và phù hợp ngữ cảnh Giăng. «Hà hơi» là cách dùng Kinh Thánh tiếng Việt tự nhiên cho hành động đặc thù này, không phải một diễn giải thần học về việc ban Thánh Linh.
