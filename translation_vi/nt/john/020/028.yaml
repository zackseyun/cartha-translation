  rationale: Bản sửa giữ αὐτῷ bằng “Ngài”, thể hiện chức năng xưng hô trực tiếp của hai danh từ có mạo từ qua “Lạy”, và giữ nguyên hai sở hữu từ μου bằng “của tôi”. Câu được làm gọn theo cú pháp tiếng Việt hiện đại mà không giảm lực Kitô học hay áp đặt một diễn giải giáo phái.
