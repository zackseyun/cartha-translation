  - severity: low
    issue: Cụm “đáp lời và nói” nặng, trùng nghĩa trong tiếng Việt hiện đại
    rationale: Công thức ἀπεκρίθη ... καὶ εἶπεν thường được diễn đạt tự nhiên bằng “trả lời”; việc giữ hai động từ riêng rẽ không cần thiết để bảo toàn nghĩa.
  - severity: low
