  yaml_path: translation/nt/john/020/028.yaml
  text: Thomas answered and said to him[a], “My Lord and my God!”
translation:
  language: vi
  text: 'Tô-ma trả lời Ngài[a]: “Lạy Chúa của tôi và Đức Chúa Trời của tôi!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Một cách hiểu khác, nhưng ít có khả năng hơn: “Tô-ma trả lời: ‘Lạy Chúa của tôi và Đức Chúa Trời của tôi!’” như một lời cảm thán. Tuy nhiên, nguyên văn Hy Lạp nói ông đã nói “với Ngài”, điều này ủng hộ cách hiểu đây là lời trực tiếp thưa với Chúa Giê-su.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: đáp lời
  rationale: Diễn đạt tự nhiên chức năng trần thuật của ἀποκρίνομαι là đáp lại, đồng thời phù hợp với kết cấu đi cùng “nói” trong câu Hy Lạp.
- source_word: Θωμᾶς
  choice: Thô-ma
  rationale: Phiên âm tên riêng theo cách viết quen thuộc trong tiếng Việt.
- source_word: εἶπεν αὐτῷ
  choice: nói với Ngài
  rationale: Giữ đại từ tân ngữ αὐτῷ thay vì thêm tên “Đức Chúa Jêsus”; viết “Ngài” thể hiện sự kính trọng trong lời văn tiếng Việt mà không thay đổi đối tượng được nói đến.
- source_word: Ὁ κύριός μου
  choice: Lạy Chúa của con
  rationale: κύριος được dịch là “Chúa” để bảo toàn sắc thái tôn kính và trọng lượng thần học. “Lạy” đánh dấu lời xưng hô trực tiếp; “của con” giữ đại từ sở hữu μου và tự nhiên trong lời thưa trang trọng.
- source_word: καὶ
  choice: và
  rationale: Giữ nguyên quan hệ phối hợp giữa hai danh hiệu.
- source_word: ὁ θεός μου
  choice: Đức Chúa Trời của con
  rationale: Dịch θεός bằng cách gọi phổ thông, trang trọng trong văn phong Kinh Thánh tiếng Việt; giữ μου là “của con”, qua đó bảo toàn tính chất lời tuyên xưng cá nhân.
theological_decisions:
- issue: Lời của Thô-ma là lời trực tiếp thưa với Đức Chúa Jêsus hay chỉ là một tiếng kêu hướng về Đức Chúa Trời
  choice: 'Lời trực tiếp thưa với Đức Chúa Jêsus: “Lạy Chúa của con và Đức Chúa Trời của con!”'
  alternative: Một tiếng kêu cảm thán không trực tiếp gọi Đức Chúa Jêsus là Chúa và Đức Chúa Trời
  rationale: Cụm εἶπεν αὐτῷ nói rõ Thô-ma “nói với Ngài”; các danh từ ở dạng chủ cách có mạo từ có thể đảm nhiệm chức năng xưng hô trong tiếng Hy Lạp Koine. Bản dịch giữ nguyên sức nặng Kitô học của lời nói mà không diễn giải thêm.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “đáp lời và nói” để phản ánh kết cấu Hy Lạp; dùng “Lạy” nhằm thể hiện chức năng xưng hô của các danh từ chủ cách có mạo từ. Marker [a] được đặt ngay sau “Ngài” để gắn chú thích với cụm “nói với Ngài”.
