source:
  edition: SBLGNT
  text: Θωμᾶς δὲ εἷς ἐκ τῶν δώδεκα, ὁ λεγόμενος Δίδυμος, οὐκ ἦν μετ’ αὐτῶν ὅτε ⸀ἦλθεν Ἰησοῦς.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/024.yaml
  text: Thomas[a], one of the Twelve, the one called Didymus, was not with them when Jesus came.
translation:
  language: vi
  text: Còn Thô-ma, một người trong Nhóm Mười Hai, được gọi là Đi-đim[a], không có mặt với họ khi Giê-su đến.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hy Lạp: “Đi-đim”, nghĩa là “sinh đôi”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Còn
  rationale: Đây là từ nối chuyển nhẹ trọng tâm câu chuyện sang Thô-ma, không phải trạng từ thời gian. “Còn” tạo mạch kể tự nhiên mà không hàm ý đối lập mạnh.
- source_word: εἷς ἐκ τῶν δώδεκα
  choice: một người trong Nhóm Mười Hai
  rationale: Diễn đạt Thô-ma thuộc nhóm môn đồ được biết đến với danh xưng “Nhóm Mười Hai”; viết hoa cho thấy đây là danh xưng của một nhóm xác định.
- source_word: ὁ λεγόμενος Δίδυμος
  choice: cũng được gọi là Đi-đim[a]
  rationale: Giữ Đi-đim như một tên gọi Hy Lạp và chú thích nghĩa “Sinh Đôi”, vừa phản ánh cấu trúc nguồn vừa giúp độc giả hiểu ý nghĩa của tên.
- source_word: οὐκ ἦν μετ’ αὐτῶν
  choice: không ở cùng họ
  rationale: Phản ánh trực tiếp sự vắng mặt của Thô-ma khỏi nhóm vào thời điểm ấy, đồng thời tự nhiên trong tiếng Việt.
- source_word: ὅτε ἦλθεν Ἰησοῦς
  choice: khi Đức Giê-su đến
  rationale: “Đến” là cách dịch trực tiếp và tự nhiên của ἦλθεν; không thêm chi tiết về cách thức hay địa điểm.
theological_decisions:
- issue: Cách thể hiện Δίδυμος
  choice: Phiên âm “Đi-đim” trong chính văn và giải nghĩa ở chú thích
  alternative: Dịch trực tiếp là “Sinh Đôi”
  rationale: Δίδυμος vừa là tên gọi Hy Lạp vừa có nghĩa từ vựng là “sinh đôi”. Cách trình bày này bảo toàn hình thức tên gọi trong nguồn, đồng thời không che khuất ý nghĩa của nó; không có khác biệt giáo lý giữa hai cách.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng và dễ hiểu. “Còn” đánh dấu sự chuyển trọng tâm nhẹ; “Nhóm Mười Hai” là danh xưng đã xác định. Dùng lối phiên âm tiếng Việt cho các tên riêng.
