revisions:
- from: Còn Thô-ma, một người trong Nhóm Mười Hai, cũng được gọi là Đi-đim[a], không ở cùng họ khi Đức Giê-su đến.
  to: Còn Thô-ma, một người trong Nhóm Mười Hai, được gọi là Đi-đim[a], không có mặt với họ khi Giê-su đến.
  rationale: Sửa để loại bỏ ý “cũng” không có trong tiếng Hy Lạp, tránh thêm danh xưng trước tên Giê-su, và dùng cách nói tự nhiên hơn cho việc Thô-ma vắng mặt. Vẫn giữ Đi-đim trong chính văn và giải nghĩa từ vựng ở chú thích, bảo toàn cả hình thức tên gọi lẫn ý nghĩa của Δίδυμος.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T08:26:51Z'
review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng việc Thô-ma, một thành viên của Nhóm Mười Hai, vắng mặt khi Giê-su đến. Tuy nhiên, “cũng được gọi là” thêm sắc thái “cũng/also” không có trong ὁ λεγόμενος. Danh xưng tôn kính “Đức” trước tên Giê-su không được biểu thị trong nguyên văn câu này; bỏ danh xưng sẽ sát nguồn hơn mà vẫn trang trọng trong ngữ cảnh Kinh Thánh.
  naturalness: “Còn Thô-ma” và “một người trong Nhóm Mười Hai” tự nhiên, rõ ràng. “Không ở cùng họ” có thể hiểu được nhưng “không có mặt với họ” diễn đạt trực tiếp và tự nhiên hơn về sự vắng mặt trong một cuộc tụ họp. Trong chú thích, “Sinh Đôi” viết hoa không tự nhiên khi đây là nghĩa từ vựng chứ không phải tên riêng.
  terminology: Giữ “Nhóm Mười Hai” là phù hợp cho danh xưng xác định. “Đi-đim” có thể được giữ như hình thức tên gọi Hy Lạp, với chú thích nêu nghĩa “sinh đôi.” Không nên thêm “cũng” vào công thức “được gọi là.”
  issues:
  - severity: medium
    issue: “cũng được gọi là” thêm ý
    rationale: ὁ λεγόμενος chỉ có nghĩa “người được gọi là”; không có từ nào tương ứng với “cũng.”
  - severity: low
    issue: Danh xưng “Đức” được thêm trước Giê-su
    rationale: Nguyên văn chỉ viết Ἰησοῦς. Trong một bản dịch ưu tiên tương đương tối ưu, tên riêng không cần thêm danh xưng tôn kính không có trong câu nguồn.
  - severity: low
    issue: Cách diễn đạt sự vắng mặt và viết hoa trong chú thích
    rationale: “Không có mặt với họ” tự nhiên hơn trong ngữ cảnh một nhóm đang tụ họp; “sinh đôi” nên viết thường vì là nghĩa giải thích của Đi-đim.
  revised_text: Còn Thô-ma, một người trong Nhóm Mười Hai, được gọi là Đi-đim[a], không có mặt với họ khi Giê-su đến.
  revised_footnotes:
