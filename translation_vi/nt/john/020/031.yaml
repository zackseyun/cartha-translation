id: JHN.20.31
reference: John 20:31
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ταῦτα δὲ γέγραπται ἵνα ⸀πιστεύητε ὅτι Ἰησοῦς ἐστιν ὁ χριστὸς ὁ υἱὸς τοῦ θεοῦ, καὶ ἵνα πιστεύοντες ζωὴν ἔχητε ἐν τῷ ὀνόματι αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/031.yaml
  text: But these have been written so that you may believe that Jesus is the Messiah[a], the Son of God[b], and so that by believing you may have life in his name.
translation:
  language: vi
  text: Nhưng những điều này đã được chép lại để anh em tin rằng Đức Giê-su là Đấng Mê-si-a[a], Con Đức Chúa Trời, và để nhờ tin, anh em có sự sống trong danh Ngài.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “Đấng Christ.” Từ Hy Lạp χριστός là một tước hiệu; ở đây được dịch là “Đấng Mê-si-a.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ταῦτα
  choice: những điều này
  rationale: Chỉ các dấu lạ và nội dung đã được ghi lại; cách diễn đạt này rõ ràng, tự nhiên trong tiếng Việt.
- source_word: δὲ
  choice: Nhưng
  rationale: Thể hiện sự chuyển ý có sắc thái tương phản nhẹ với câu trước.
- source_word: γέγραπται
  choice: đã được chép lại
  rationale: Giữ thể bị động và sắc thái hoàn thành với kết quả còn hiệu lực của thì hoàn thành Hy Lạp.
- source_word: ἵνα πιστεύητε
  choice: để anh em tin
  rationale: Diễn đạt mục đích mà không ép sắc thái thành bắt đầu tin hay tiếp tục tin; biến thể bản văn được nêu ở chú thích.
- source_word: ὁ χριστός
  choice: Đấng Mê-si-a
  rationale: Dịch Χριστός như một tước hiệu, đồng thời giữ bối cảnh cứu thế Do Thái.
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: Con Đức Chúa Trời
  rationale: Giữ nguyên tước hiệu Cơ Đốc học, không làm nhẹ hay diễn giải thêm.
- source_word: πιστεύοντες
  choice: nhờ tin
  rationale: Diễn đạt phân từ theo nghĩa phương tiện liên hệ với việc có sự sống.
- source_word: ζωὴν
  choice: sự sống
  rationale: Không thêm 'đời đời' vì nguyên văn tại đây không có tính từ αἰώνιος.
- source_word: ἐν τῷ ὀνόματι αὐτοῦ
  choice: trong danh Ngài
  rationale: Giữ hình ảnh và chiều sâu thần học của thành ngữ Hy Lạp thay vì diễn giải thành 'nhờ quyền năng' hay 'bởi danh'.
theological_decisions:
- issue: Cách dịch Χριστός như tước hiệu
  choice: Đấng Mê-si-a
  alternative: Đấng Christ
  rationale: Ở đây từ này xác nhận căn tính cứu thế của Đức Giê-su; dịch nghĩa tước hiệu giúp độc giả hiện đại nhận ra chức năng ấy.
- issue: Biến thể và thể của πιστεύητε
  choice: để anh em tin
  alternative: để anh em tiếp tục tin / để anh em đi đến chỗ tin
  rationale: Bản SBLGNT in πιστεύητε, có thể gợi hành động đang tiếp diễn, trong khi biến thể πιστεύσητε dễ gợi việc đi đến đức tin. Bản chính giữ cách nói rộng và chú thích nêu rõ vấn đề.
- issue: Ý nghĩa của 'sự sống'
  choice: sự sống
  alternative: sự sống đời đời
  rationale: Giữ đúng từ ζωὴν không có tính từ 'đời đời', để văn mạch Giăng tự cung cấp chiều sâu thần học.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Dùng “anh em” cho số nhiều ngôi thứ hai; “Đức Giê-su”, “Đức Chúa Trời” và “Ngài” theo lối gọi tôn kính phổ biến. Chỉ đặt một dấu chú thích [a], tương ứng với vấn đề biến thể bản văn; thông tin 'Đấng Christ' được gộp trong chính chú thích về thuật ngữ nếu cần ở ấn bản mở rộng, nhưng không tạo dấu chú thích không cần thiết.
