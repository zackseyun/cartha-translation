- from: Nhưng những điều này đã được chép lại để anh em tin rằng Đức Giê-su là Đấng Mê-si-a[a], Con Đức Chúa Trời, và để nhờ tin mà anh em có sự sống trong danh Ngài.
  to: Nhưng những điều này đã được chép lại để anh em tin rằng Đức Giê-su là Đấng Mê-si-a[a], Con Đức Chúa Trời, và để nhờ tin, anh em có sự sống trong danh Ngài.
  rationale: Thêm chú thích thuật ngữ cho “Đấng Mê-si-a” để bảo toàn dấu neo và lựa chọn thay thế trong hồ sơ POB tiếng Anh. Chú thích biến thể bản văn được giữ lại nhưng chuyển sang dấu [b], đồng thời diễn đạt cân xứng hơn về hai cách đọc. Chỉnh nhẹ trật tự từ ở mệnh đề cuối cho tự nhiên hơn.
