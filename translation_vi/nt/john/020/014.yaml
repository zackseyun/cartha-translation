source:
  edition: SBLGNT
  text: ⸀ταῦτα εἰποῦσα ἐστράφη εἰς τὰ ὀπίσω, καὶ θεωρεῖ τὸν Ἰησοῦν ἑστῶτα, καὶ οὐκ ᾔδει ὅτι Ἰησοῦς ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/014.yaml
  text: After saying these things[a], she turned around and saw Jesus standing there, and she did not know that it was Jesus.
translation:
  language: vi
  text: Sau khi nói những lời ấy, bà quay lại và thấy Giê-su đang đứng đó, và bà không biết đó là Giê-su.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “bà không nhận ra đó là Giê-su.” Tiếng Hy Lạp nói sát nghĩa: “bà không biết rằng đó là Giê-su,” diễn tả việc bà chưa biết danh tính của người đang đứng trước mặt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα εἰποῦσα
  choice: Sau khi nói những lời ấy
  rationale: Phân từ bất định quá khứ εἰποῦσα diễn tả hành động xảy ra trước động từ chính; “sau khi nói” tự nhiên trong tiếng Việt. Đại từ số nhiều ταῦτα được diễn đạt là “những lời ấy” vì chỉ điều bà vừa nói trong mạch văn.
- source_word: ἐστράφη εἰς τὰ ὀπίσω
  choice: bà quay lại
  rationale: Thành ngữ Hy Lạp chỉ việc xoay người về phía sau; “quay lại” ngắn gọn và tự nhiên trong tiếng Việt hiện đại.
- source_word: θεωρεῖ
  choice: thấy
  rationale: Hiện tại lịch sử được chuyển sang cách kể quá khứ tự nhiên của tiếng Việt. Trong ngữ cảnh này, động từ diễn tả việc bà nhìn thấy Giê-su, không nhất thiết hàm ý đã nhận ra Ngài.
- source_word: ἑστῶτα
  choice: đang đứng đó
  rationale: Phân từ hoàn thành diễn tả tư thế đứng đang duy trì; “đang đứng đó” tái hiện cảnh tượng rõ ràng mà không thêm vị trí cụ thể.
- source_word: οὐκ ᾔδει ὅτι Ἰησοῦς ἐστιν
  choice: bà không biết đó là Giê-su
  rationale: Giữ nghĩa căn bản của οἶδα là “biết” và bảo toàn mệnh đề nhận diện. Cách dịch “không nhận ra” phù hợp với ngữ cảnh nhưng mang tính diễn giải hơn nên được ghi ở chú thích.
theological_decisions:
- issue: Việc nhận diện Giê-su phục sinh
  choice: bà không biết đó là Giê-su
  alternative: bà không nhận ra đó là Giê-su
  rationale: Bản văn nêu sự thiếu nhận biết về căn tính của người đang đứng đó nhưng không giải thích nguyên nhân. Bản dịch chính giữ nguyên độ mở này, không quy nguyên nhân cho thị giác, trạng thái tâm lý hay một hành động siêu nhiên.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “bà” theo ngữ cảnh nói về Ma-ri; không thêm tước hiệu trước tên Giê-su vì nguyên văn chỉ dùng tên riêng.
