revisions:
- from: Sau khi nói những lời ấy, bà quay lại và thấy Giê-su đang đứng đó, nhưng bà không biết đó là Giê-su.[a]
  to: Sau khi nói những lời ấy, bà quay lại và thấy Giê-su đang đứng đó, và bà không biết đó là Giê-su.[a]
  rationale: Đổi “nhưng” thành “và” để phản ánh chính xác καί và không thêm quan hệ tương phản. Chỉnh câu chú thích cho tự nhiên hơn, đồng thời vẫn phân biệt bản dịch sát nghĩa “không biết” với phương án theo ngữ cảnh “không nhận ra”.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T08:26:44Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch theo sát trình tự và nội dung Hy Lạp: hành động nói trước, quay về phía sau, thấy Chúa Giê-su đang đứng, rồi không biết người ấy là Giê-su. Tuy nhiên, καί là liên từ nối đơn thuần (“và”), không biểu thị tương phản; “nhưng” thêm sắc thái đối lập không có trong nguyên văn.'
  naturalness: “Sau khi nói những lời ấy, bà quay lại và thấy Giê-su đang đứng đó” tự nhiên, rõ ràng trong tiếng Việt hiện đại. Thay “nhưng” bằng “và” vừa tự nhiên vừa trung thành hơn. Trong chú thích, “danh tính” thông dụng hơn “căn tính” ở văn phong phổ thông trang trọng.
  terminology: “Giê-su” nhất quán và phù hợp. “Không biết đó là Giê-su” giữ được động từ οἶδα mà không áp đặt nguyên nhân cho việc không nhận diện. Chú thích có thể nêu “không nhận ra” như một phương án diễn giải.
  issues:
  - severity: medium
    issue: Liên từ “nhưng”
    rationale: Nguyên văn dùng καί (“và”), nối hai sự việc mà không đánh dấu đối lập. “Nhưng” tạo một quan hệ tương phản diễn giải, dù ngữ cảnh có thể khiến người đọc suy ra sự tương phản đó.
  - severity: low
    issue: Cụm “nhấn mạnh việc bà chưa nhận biết căn tính” trong chú thích
    rationale: “Căn tính” có thể hiểu được nhưng ít tự nhiên hơn “danh tính”; đồng thời “nhấn mạnh” hơi mạnh so với chức năng đơn thuần của mệnh đề nội dung sau οἶδα.
  revised_text: Sau khi nói những lời ấy, bà quay lại và thấy Giê-su đang đứng đó, và bà không biết đó là Giê-su.[a]
