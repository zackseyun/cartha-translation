  yaml_path: translation/nt/john/020/009.yaml
  text: For they did not yet understand the Scripture[a], that he had to rise from the dead.
translation:
  language: vi
  text: Vì bấy giờ họ vẫn chưa hiểu lời Kinh Thánh nói rằng Ngài phải sống lại từ cõi chết.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể diễn đạt: “Ngài phải được làm cho sống lại từ cõi chết.” Tuy nhiên, tiếng Hy Lạp ở đây dùng động từ chủ động: “sống lại.”'
    reason: alternative_reading
lexical_decisions:
- source_word: οὐδέπω
  choice: vẫn chưa
  rationale: 'Diễn đạt tự nhiên ý thời gian: cho đến lúc ấy họ chưa đạt tới sự hiểu biết này.'
- source_word: γὰρ
  choice: Vì
  rationale: Giữ quan hệ giải thích với câu trước.
- source_word: ᾔδεισαν
  choice: hiểu
  rationale: Trong ngữ cảnh nói về Kinh Thánh và nội dung của Kinh Thánh, động từ chỉ việc nắm được ý nghĩa chứ không chỉ biết đến sự tồn tại của bản văn.
- source_word: τὴν γραφὴν
  choice: lời Kinh Thánh
  rationale: Giữ số ít của γραφή và diễn đạt tự nhiên trong tiếng Việt, có thể chỉ một lời cụ thể hoặc lời chứng của Kinh Thánh.
- source_word: ὅτι
  choice: rằng
  rationale: Dẫn vào nội dung mà họ chưa hiểu từ Kinh Thánh.
- source_word: δεῖ
  choice: phải
  rationale: Bảo toàn sắc thái tất yếu, có thể hàm ý sự tất yếu theo ý định của Đức Chúa Trời mà không giải thích thêm.
- source_word: αὐτὸν
  choice: Ngài
  rationale: Đại từ chỉ Chúa Giê-su; cách viết tôn kính phù hợp văn phong Kinh Thánh tiếng Việt hiện đại.
- source_word: ἐκ νεκρῶν
  choice: từ cõi chết
  rationale: Cách diễn đạt tự nhiên của tiếng Việt cho thành ngữ phục sinh; nguyên ngữ theo nghĩa đen là ra khỏi giữa những người chết.
- source_word: ἀναστῆναι
  choice: sống lại
  rationale: Phản ánh dạng chủ động của động từ và là cách nói rõ ràng, quen thuộc trong tiếng Việt về sự phục sinh.
theological_decisions:
- issue: Cách diễn đạt sự phục sinh và tác nhân
  choice: Ngài phải sống lại từ cõi chết
  alternative: Ngài phải được làm cho sống lại từ cõi chết
  rationale: Nguyên ngữ dùng động từ nguyên mẫu chủ động ἀναστῆναι, nên bản chính giữ cách diễn đạt chủ động. Cách bị động phù hợp với những chỗ khác trong Tân Ước nhưng không nên được đưa vào đây để giải quyết thay cho cách nói riêng của câu này.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “lời Kinh Thánh” để giữ danh từ số ít; dùng “sống lại” nhằm bảo toàn dạng chủ động của nguyên ngữ. Dấu chú thích [a] xuất hiện trong chính văn.
