  terminology: Giữ “lời Kinh Thánh,” “Ngài,” và “sống lại từ cõi chết” phù hợp văn phong Kinh Thánh tiếng Việt và phản ánh nguyên ngữ. Chú thích được chỉnh nhẹ để không trình bày cách bị động như một bản dịch trực tiếp ngang hàng với động từ chủ động của tiếng Hy Lạp.
