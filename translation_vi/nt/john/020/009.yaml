  source_fidelity: 'Bản dịch truyền đạt đúng các yếu tố chính: quan hệ giải thích của γάρ, ý chưa hiểu cho đến thời điểm ấy của οὐδέπω, số ít của γραφή, sự tất yếu trong δεῖ, và động từ chủ động ἀναστῆναι qua “sống lại”. Tuy nhiên, cấu trúc “hiểu lời Kinh Thánh rằng” hơi gượng trong tiếng Việt; thêm “nói” làm rõ rằng mệnh đề sau là nội dung của lời Kinh Thánh mà không thêm nghĩa.'
