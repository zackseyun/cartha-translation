  source_fidelity: 'Bản dịch truyền đạt đúng cấu trúc và ý nghĩa của nguyên văn: Đức Giê-su nói với Tô-ma; mệnh đề đầu được giữ ở dạng nghi vấn có thể tranh luận về dấu câu; lời chúc phước hướng đến những người không thấy nhưng tin. “Vì ... nên ... sao?” diễn đạt tự nhiên quan hệ nguyên nhân của ὅτι mà không làm mất lực tu từ. “Không thấy mà tin” bảo toàn sự đối lập hàm ẩn của hai phân từ Hy Lạp mà không thêm nội dung đáng kể.'
  naturalness: Tiếng Việt hiện đại, gọn, trang nghiêm và dễ đọc. Cặp xưng hô “tôi/anh” nhất quán trong lời trực tiếp và phù hợp với ngữ cảnh đối thoại. “Phước cho” là công thức Kinh Thánh quen thuộc, tự nhiên trong văn cảnh chúc phước.
  terminology: “Đức Giê-su” và “Phước” phù hợp văn phong Kinh Thánh tiếng Việt phổ thông. Không có thuật ngữ thần học nào bị diễn giải theo một truyền thống giáo phái riêng. Cách dùng “ông” trong lời người kể và “anh” trong lời thoại phân biệt hợp lý ngôi quy chiếu.
