source:
  edition: SBLGNT
  text: λέγει αὐτῷ ὁ Ἰησοῦς· Ὅτι ἑώρακάς με πεπίστευκας; μακάριοι οἱ μὴ ἰδόντες καὶ πιστεύσαντες.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/029.yaml
  text: Jesus said to him, “Because you have seen me, you have believed? Blessed are those who have not seen and yet have believed.”
translation:
  language: vi
  text: 'Đức Giê-su nói với ông: “Vì đã thấy tôi nên anh tin sao?[a] Phước cho những người không thấy mà tin.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Vì đã thấy tôi nên anh tin.” Tiếng Hy Lạp có thể được hiểu là câu hỏi hoặc câu khẳng định.'
    reason: alternative_reading
lexical_decisions:
- source_word: λέγει αὐτῷ ὁ Ἰησοῦς
  choice: Đức Giê-su nói với ông
  rationale: Dùng thì quá khứ tự nhiên trong lời kể tiếng Việt cho hiện tại lịch sử λέγει; αὐτῷ được giữ là “với ông”, chỉ Tô-ma.
- source_word: Ὅτι
  choice: Vì ... nên
  rationale: Hiểu ὅτι theo nghĩa nguyên nhân; cấu trúc “vì... nên...” diễn đạt rõ và tự nhiên mối liên hệ giữa việc thấy và việc tin.
- source_word: ἑώρακάς με
  choice: đã thấy tôi
  rationale: Tiếng Việt không có hình thái tương đương trực tiếp với thì hoàn thành Hy Lạp; “đã thấy tôi” diễn đạt hành động đã hoàn tất và có liên hệ với niềm tin hiện tại.
- source_word: πεπίστευκας
  choice: anh tin
  rationale: “Tin” diễn đạt trạng thái đức tin hiện tại phát sinh từ việc đã thấy; đại từ “anh” phù hợp với lời Đức Giê-su trực tiếp nói với Tô-ma trong văn phong hiện đại, trang trọng vừa phải.
- source_word: μακάριοι
  choice: Phước cho
  rationale: “Phước cho” là cách diễn đạt quen thuộc, trang nghiêm của công thức chúc phước, mạnh hơn nghĩa cảm xúc chủ quan của “hạnh phúc”.
- source_word: οἱ μὴ ἰδόντες καὶ πιστεύσαντες
  choice: những người không thấy mà tin
  rationale: “Mà” thể hiện sự tương phản vốn được hàm ý giữa không thấy và tin, đồng thời tránh thêm một trạng từ nhấn mạnh không có mặt trong tiếng Hy Lạp.
theological_decisions:
- issue: Sắc thái câu đầu của Đức Giê-su
  choice: 'Dịch thành câu hỏi: “Vì đã thấy tôi nên anh tin sao?”'
  alternative: 'Dịch thành câu khẳng định: “Vì đã thấy tôi nên anh tin.”'
  rationale: Bản SBLGNT chấm câu theo lối nghi vấn, phù hợp với sắc thái đối chiếu nhẹ trong ngữ cảnh. Tuy nhiên, thủ bản cổ không có dấu câu hiện đại, nên cách hiểu như câu khẳng định vẫn có thể có và được giữ trong chú thích.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang nghiêm nhưng dễ hiểu. Dùng “Đức Giê-su” theo văn phong Kinh Thánh phổ thông; giữ câu ngắn, trực tiếp, và bảo tồn sự không chắc chắn về dấu câu bằng chú thích.
