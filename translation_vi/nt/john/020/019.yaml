reference: John 20:19
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Οὔσης οὖν ὀψίας τῇ ἡμέρᾳ ἐκείνῃ τῇ ⸀μιᾷ σαββάτων, καὶ τῶν θυρῶν κεκλεισμένων ὅπου ἦσαν οἱ ⸀μαθηταὶ διὰ τὸν φόβον τῶν Ἰουδαίων, ἦλθεν ὁ Ἰησοῦς καὶ ἔστη εἰς τὸ μέσον, καὶ λέγει αὐτοῖς· Εἰρήνη ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/019.yaml
  text: So when it was evening on that day[a], the first day of the week, and the doors had been locked where the disciples were because of fear of the Jews, Jesus came and stood in the midst of them and said to them[b], “Peace to you.”
translation:
  language: vi
  text: 'Vậy, vào buổi tối ngày hôm ấy, tức ngày thứ nhất trong tuần, các cửa tại nơi các môn đệ đang ở đều đã khóa, vì sợ người Do Thái[a]. Giê-su đến, đứng giữa họ và nói: “Bình an cho anh em!”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tùy cách hiểu thuật ngữ Hy Lạp trong ngữ cảnh, cũng có thể là “các lãnh đạo Do Thái” hoặc “người Giu-đê”.
    reason: alternative_reading
  - marker: b
    text: 'Cũng có thể dịch: “Nguyện anh em được bình an!” Nguyên văn Hy Lạp viết sát nghĩa là: “Bình an cho anh em.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὔσης ... ὀψίας
  choice: vào buổi chiều tối
  rationale: Cụm sở hữu cách tuyệt đối nêu bối cảnh thời gian; cách diễn đạt này tự nhiên trong tiếng Việt và giữ được nghĩa ‘khi trời đã về chiều/tối’ mà không xác định quá mức thời điểm.
- source_word: οὖν
  choice: Vậy
  rationale: Giữ mối nối diễn ngôn nhẹ với phần tường thuật trước, tự nhiên hơn một từ chỉ kết luận mạnh như ‘vì thế’.
- source_word: τῇ ἡμέρᾳ ἐκείνῃ τῇ μιᾷ σαββάτων
  choice: ngày hôm ấy, tức ngày thứ nhất trong tuần
  rationale: 'Diễn đạt rõ quan hệ đồng vị: đó vẫn là ngày đang được nói đến, đồng thời là ngày thứ nhất trong tuần.'
- source_word: τῶν θυρῶν κεκλεισμένων
  choice: các cửa ... đều đã khóa
  rationale: Phân từ hoàn thành thụ động nhấn mạnh tình trạng cửa đang bị khóa do hành động trước đó; ‘đã khóa’ phù hợp với bối cảnh an ninh hơn chỉ ‘đóng’.
- source_word: μαθηταὶ
  choice: các môn đệ
  rationale: Thuật ngữ tiếng Việt hiện đại, trang trọng và dễ hiểu, giữ ý nghĩa những người theo học và đi theo một vị thầy.
- source_word: διὰ τὸν φόβον τῶν Ἰουδαίων
  choice: vì họ sợ người Do Thái
  rationale: Chuyển danh ngữ chỉ nguyên nhân thành mệnh đề tự nhiên trong tiếng Việt, nhưng không thu hẹp đối tượng hơn từ Hy Lạp.
- source_word: ἦλθεν ὁ Ἰησοῦς
  choice: Chúa Giê-su đến
  rationale: ‘Đến’ là tương đương kể chuyện tự nhiên của ἦλθεν; danh xưng ‘Chúa’ phù hợp cách gọi tôn kính, thông dụng trong văn bản Cơ Đốc tiếng Việt.
- source_word: ἔστη εἰς τὸ μέσον
  choice: đứng giữa họ
  rationale: Giữ hình ảnh không gian rõ ràng của nguyên văn mà vẫn gọn và tự nhiên.
- source_word: λέγει αὐτοῖς
  choice: nói
  rationale: Hiện tại lịch sử trong tiếng Hy Lạp được chuyển sang lối kể tiếng Việt theo mạch quá khứ, tránh sự đổi thì gượng gạo.
- source_word: Εἰρήνη ὑμῖν
  choice: Bình an cho anh em!
  rationale: Giữ sát cấu trúc ngắn gọn ‘bình an cho các anh/em’ và sắc thái của lời chào, đồng thời ‘anh em’ thể hiện ngôi thứ hai số nhiều.
theological_decisions:
- issue: Đối tượng được chỉ bởi τῶν Ἰουδαίων trong Giăng
  choice: người Do Thái trong chính văn, kèm chú thích về các khả năng theo ngữ cảnh
  alternative: các lãnh đạo Do Thái; người Giu-đê
  rationale: Từ Hy Lạp có thể chỉ người Do Thái nói chung, người Giu-đê, hoặc trong một số ngữ cảnh là giới lãnh đạo chống đối. Chính văn không tự ý thu hẹp đối tượng, còn chú thích giúp tránh cách hiểu rằng câu này quy kết cho toàn thể một dân tộc.
- issue: Dạng lời chào Εἰρήνη ὑμῖν
  choice: Bình an cho anh em!
  alternative: Nguyện anh em được bình an!; Chúc anh em bình an!
  rationale: Bản dịch chính giữ tính cô đọng và độ mở của câu danh từ Hy Lạp, không quyết định đó chỉ là lời chúc hay lời tuyên bố ban bình an.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng ‘môn đệ’ thay cho cách gọi ít phổ thông hơn; câu được tách ở điểm tự nhiên để tránh một cấu trúc quá dài. Cụm ‘người Do Thái’ được giữ trong chính văn vì nguyên bản không nói rõ ‘lãnh đạo’, nhưng có chú thích nhằm bảo toàn sự mơ hồ theo ngữ cảnh và ngăn cách hiểu quy chụp sắc tộc.
