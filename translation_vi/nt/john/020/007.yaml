  text: καὶ τὸ σουδάριον, ὃ ἦν ἐπὶ τῆς κεφαλῆς αὐτοῦ, οὐ μετὰ τῶν ὀθονίων κείμενον ἀλλὰ χωρὶς ἐντετυλιγμένον εἰς ἕνα τόπον·
base_translation:
  language: en
  yaml_path: translation/nt/john/020/007.yaml
  text: and the face cloth[a], which had been on his head, was not lying with the linen cloths but folded up separately in one place.
translation:
  language: vi
  text: và khăn che mặt[a], vốn ở trên đầu Ngài, không nằm chung với các tấm vải liệm, nhưng được cuộn lại và để riêng ở một chỗ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “khăn phủ đầu”; từ Hy Lạp chỉ một tấm khăn, và trong ngữ cảnh này mệnh đề quan hệ cho biết khăn ấy đã ở trên đầu Ngài.
    reason: lexical_alternative
lexical_decisions:
- source_word: σουδάριον
  choice: khăn che mặt
  rationale: Trong bối cảnh mai táng và với mệnh đề giải thích rằng khăn đã ở trên đầu Chúa Giê-su, cách dịch này tự nhiên, rõ nghĩa hơn “khăn tay”, nhưng không biến nó thành một loại khăn liệm chuyên biệt.
- source_word: ἐπὶ τῆς κεφαλῆς αὐτοῦ
  choice: ở trên đầu Ngài
  rationale: Bám sát giới từ và danh từ Hy Lạp, không xác định quá mức rằng khăn quấn quanh hay phủ kín đầu.
- source_word: ὀθονίων
  choice: các tấm vải liệm
  rationale: Diễn đạt số nhiều của những tấm vải lanh dùng trong việc mai táng bằng tiếng Việt tự nhiên; “tấm” giữ ý đây là các mảnh vải, còn “liệm” làm rõ bối cảnh.
- source_word: κείμενον
  choice: nằm
  rationale: Diễn tả trực tiếp trạng thái ở một vị trí của vật thể, phù hợp với κεῖμαι.
- source_word: χωρὶς
  choice: để riêng
  rationale: Thể hiện rõ sự tách biệt về vị trí với các tấm vải liệm và phối hợp tự nhiên với câu tiếng Việt.
- source_word: ἐντετυλιγμένον
  choice: được cuộn lại
  rationale: Động từ ἐντυλίσσω cơ bản mang nghĩa quấn hoặc cuộn; phân từ hoàn thành bị động chỉ chiếc khăn đang ở trong trạng thái đã được cuộn/quấn lại. Cách dịch này tránh khẳng định chắc chắn rằng khăn được gấp ngay ngắn.
- source_word: εἰς ἕνα τόπον
  choice: tại một chỗ
  rationale: Giữ cách nói không xác định của nguyên văn về một vị trí riêng biệt, không thêm ý “đúng chỗ của nó”.
- source_word: καὶ
  choice: và
  rationale: Giữ liên từ nối tiếp lời mô tả ở câu trước.
theological_decisions:
- issue: Liệu cách sắp đặt khăn liệm có hàm ý thần học vượt quá lời mô tả hay không
  choice: Chỉ trình bày quan sát rằng khăn che mặt ở trạng thái cuộn lại và nằm riêng tại một chỗ.
  alternative: Diễn giải chiếc khăn như biểu tượng của trật tự, chủ ý, hoặc như bằng chứng tự thân cho một cách tái dựng cụ thể về sự phục sinh.
  rationale: Nguyên văn mô tả vị trí và trạng thái của khăn nhưng không nêu ý nghĩa biểu tượng hay kết luận hộ giáo; bản dịch không nên thêm điều văn bản không nói.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. Dùng “Ngài” để quy chiếu Chúa Giê-su theo ngữ cảnh tiếng Việt. Chọn “được cuộn lại” thay vì “được gấp lại” nhằm phản ánh trực tiếp hơn ἐντετυλιγμένον và giữ độ mở giữa các khả năng cuộn, quấn hoặc gấp. Dấu [a] xuất hiện ngay sau từ được chú thích.
