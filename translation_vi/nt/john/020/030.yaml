  text: Πολλὰ μὲν οὖν καὶ ἄλλα σημεῖα ἐποίησεν ὁ Ἰησοῦς ἐνώπιον τῶν ⸀μαθητῶν, ἃ οὐκ ἔστιν γεγραμμένα ἐν τῷ βιβλίῳ τούτῳ·
base_translation:
  language: en
  yaml_path: translation/nt/john/020/030.yaml
  text: Jesus did many other signs in the presence of the disciples[a], which are not written in this book.
translation:
  language: vi
  text: Giê-su đã làm nhiều dấu lạ khác trước sự chứng kiến của các môn đệ[a]; những dấu lạ ấy không được chép trong sách này.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “phép lạ”; từ Hy Lạp là “dấu hiệu”, nhấn mạnh những việc làm chỉ về điều vượt quá chính bản thân chúng, bày tỏ Giê-su là ai.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πολλὰ μὲν οὖν καὶ ἄλλα
  choice: còn nhiều ... khác
  rationale: Cụm từ tiếp nối phần tường thuật và mở vế thứ nhất của thế đối chiếu μέν...δέ kéo sang câu 31. “Còn... khác” diễn đạt tự nhiên ý bổ sung và liên kết mà không gán nghĩa thời gian cho οὖν.
- source_word: σημεῖα
  choice: dấu lạ
  rationale: Trong tiếng Việt Kinh Thánh, “dấu lạ” vừa tự nhiên vừa giữ được ý đây là những việc kỳ diệu chỉ tới và bày tỏ căn tính của Đức Chúa Jêsus, thay vì chỉ nhấn mạnh quyền năng.
- source_word: ἐποίησεν
  choice: làm
  rationale: Động từ ποιέω ở đây có nghĩa trực tiếp là “làm”; cách dịch này gọn, tự nhiên và không trang trọng hóa quá mức như “thực hiện”.
- source_word: ἐνώπιον τῶν μαθητῶν
  choice: trước mặt các môn đồ
  rationale: Diễn đạt việc các môn đồ hiện diện và chứng kiến. Bản Hy Lạp không có đại từ sở hữu, nên không thêm “Ngài” hay “của Ngài”.
- source_word: ἃ οὐκ ἔστιν γεγραμμένα
  choice: nhưng không được chép
  rationale: Giữ thể bị động và trạng thái hiện tại của kết cấu phân từ hoàn thành. “Nhưng” diễn đạt quan hệ tương phản tự nhiên trong tiếng Việt giữa các dấu lạ đã làm và những điều không có trong sách.
- source_word: ἐν τῷ βιβλίῳ τούτῳ
  choice: trong sách này
  rationale: “Sách” là cách gọi tự nhiên cho tác phẩm được viết; “cuộn sách” quá cụ thể về hình thức vật chất và dễ gây xao lãng.
theological_decisions:
- issue: Cách dịch σημεῖα trong thần học của Giăng
  choice: dấu lạ
  alternative: phép lạ
  rationale: “Dấu lạ” bảo tồn ý nghĩa các việc làm của Đức Chúa Jêsus không chỉ là biểu hiện quyền năng mà còn chỉ vượt lên chính chúng để bày tỏ Ngài là ai.
- issue: Chủ thể ngầm của mệnh đề quan hệ ἃ οὐκ ἔστιν γεγραμμένα
  choice: Hiểu là các dấu lạ khác không được chép trong sách
  alternative: Diễn giải là mọi chi tiết về các dấu lạ không được ghi lại
  rationale: Đại từ quan hệ số nhiều trung tính ἃ quy chiếu trực tiếp về σημεῖα; bản dịch không mở rộng đối tượng quá điều văn bản nói.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Đức Chúa Jêsus” và “môn đồ” theo lối gọi quen thuộc trong tiếng Việt Cơ Đốc; cấu trúc câu gọn, tránh dịch máy móc từng tiểu từ Hy Lạp.
