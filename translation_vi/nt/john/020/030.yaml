revisions:
- from: Đức Chúa Jêsus còn làm nhiều dấu lạ khác trước mặt các môn đồ[a], nhưng không được chép trong sách này.
  to: Giê-su đã làm nhiều dấu lạ khác trước sự chứng kiến của các môn đệ[a]; những dấu lạ ấy không được chép trong sách này.
  rationale: Bản sửa giữ ý “nhiều dấu lạ khác”, chức năng chứng kiến của ἐνώπιον τῶν μαθητῶν, và thể bị động của γεγραμμένα. Cấu trúc “những dấu lạ ấy” làm rõ tiền ngữ số nhiều của đại từ quan hệ ἃ, đồng thời loại bỏ sắc thái đối lập không có trong nguyên ngữ. Tước hiệu được loại bỏ để không bổ sung nội dung ngoài câu Hy Lạp.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T08:26:57Z'
review_pass:
  verdict: revise
  source_fidelity: Bản nháp thêm quan hệ đối lập bằng “nhưng”, trong khi văn bản Hy Lạp chỉ dùng mệnh đề quan hệ nối tiếp (ἃ ...). Hơn nữa, cách đặt “nhưng không được chép” sau cụm “các môn đồ” dễ làm mệnh đề này mơ hồ về chủ thể. Nguyên ngữ chỉ nêu tên “Giê-su”, không kèm tước hiệu “Đức Chúa”; bản sửa không thêm tước hiệu không có trong câu nguồn.
  naturalness: “Trước mặt các môn đồ” hiểu được, nhưng “trước sự chứng kiến của các môn đệ” tự nhiên, rõ ý làm chứng, và hiện đại hơn. Chú thích hiện có chứa cụm “chỉ vượt lên chính chúng” không tự nhiên trong tiếng Việt.
  terminology: Giữ “dấu lạ” để phản ánh σημεῖα trong cách dùng đặc trưng của Giăng. Dùng “Giê-su” theo chính tả Việt ngữ hiện đại và “môn đệ” là cách gọi hiện hành, trang trọng vừa phải. Không thêm danh hiệu “Đức Chúa” vào tên riêng khi nguyên ngữ không có.
  issues:
  - severity: medium
    issue: Thêm từ nối “nhưng”
    rationale: Câu nguồn không có liên từ đối lập; ἃ οὐκ ἔστιν γεγραμμένα là mệnh đề quan hệ bổ nghĩa cho “các dấu lạ khác”. Dấu chấm phẩy và đại từ quy chiếu diễn đạt quan hệ này chính xác hơn.
  - severity: medium
    issue: Thêm tước hiệu “Đức Chúa”
    rationale: SBLGNT ghi ὁ Ἰησοῦς, nghĩa là “Giê-su”, không có κύριος hay một tước hiệu tương đương. Việc thêm danh hiệu làm vượt quá dữ liệu câu nguồn.
  - severity: low
    issue: Chú thích diễn đạt không tự nhiên
    rationale: Cụm “chỉ vượt lên chính chúng” không phải lối nói tự nhiên. “Chỉ về điều vượt quá chính bản thân chúng” giữ ý nghĩa chú giải mà rõ hơn.
