  - severity: low
    issue: Câu cuối chú thích b chưa thật tự nhiên
    rationale: «có thể nói đến một nhóm đại diện rộng hơn» mơ hồ và không trôi chảy. «có thể bao hàm một nhóm đại diện rộng hơn» truyền đạt đúng nội dung chú thích tiếng Anh.
