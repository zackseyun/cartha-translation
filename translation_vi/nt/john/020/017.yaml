  verdict: revise
  source_fidelity: 'Bản dịch nhìn chung bám sát văn bản Hy Lạp: giữ đúng sự đối lập giữa «Cha» ở mệnh đề đầu và «Cha tôi ... Cha anh em» ở lời nhắn; đồng thời dịch trực tiếp «Đức Chúa Trời của tôi và Đức Chúa Trời của anh em». «Đừng níu giữ tôi» là một cách dịch phù hợp cho μὴ μου ἅπτου, với chú thích nêu các khả năng khác. Tuy nhiên, «Tôi đang lên» trong tiếng Việt thường gợi hành động đang diễn ra, không phù hợp tự nhiên với lời vừa nói «tôi chưa lên»; thì hiện tại có hướng tương lai của ἀναβαίνω nên được diễn đạt là «Tôi sẽ lên».'
  naturalness: «Hãy đi đến với các anh em của tôi» không tự nhiên trong tiếng Việt hiện đại. «Hãy đi gặp các anh em của tôi» diễn đạt rõ mệnh lệnh đi đến nhóm môn đồ mà không thêm ý nghĩa đáng kể. Cần đổi tương ứng chú thích/từ neo vẫn giữ nguyên vị trí.
  terminology: Cách dùng «Đức Giê-su», «Cha», và «Đức Chúa Trời» nhất quán với văn phong Kinh Thánh tiếng Việt hiện đại, trang trọng. «Các anh em» giữ được giống đực số nhiều của ἀδελφούς; chú thích nên diễn đạt phạm vi đại diện rộng hơn bằng tiếng Việt tự nhiên hơn.
