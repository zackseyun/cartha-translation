  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: λέγει ⸀αὐτῇ Ἰησοῦς· Μή μου ἅπτου, οὔπω γὰρ ἀναβέβηκα πρὸς τὸν ⸀πατέρα· πορεύου δὲ πρὸς τοὺς ἀδελφούς μου καὶ εἰπὲ αὐτοῖς· Ἀναβαίνω πρὸς τὸν πατέρα μου καὶ πατέρα ὑμῶν καὶ θεόν μου καὶ θεὸν ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/017.yaml
  text: Jesus said to her[a], “Do not cling to me, for I have not yet ascended to the Father. But go to my brothers and tell them, ‘I am ascending to my Father and your Father[b], and my God and your God.’”
translation:
  language: vi
  text: 'Đức Giê-su nói với bà: “Đừng níu giữ tôi[a], vì tôi chưa lên với Cha. Nhưng hãy đi gặp các anh em của tôi[b] và nói với họ: ‘Tôi sẽ lên với Cha tôi và Cha anh em, với Đức Chúa Trời của tôi và Đức Chúa Trời của anh em.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Đừng chạm vào tôi” hoặc “Đừng giữ tôi lại.” Từ Hy Lạp ở đây có lẽ nói đến việc níu lấy hoặc tiếp tục giữ Người hơn là chỉ chạm vào.'
    reason: lexical_alternative
  - marker: b
    text: “Các anh em” dịch một từ Hy Lạp giống đực số nhiều; ở đây từ này chỉ các môn đồ của Đức Giê-su và có thể bao hàm một nhóm đại diện rộng hơn.
    reason: cultural_note
lexical_decisions:
- source_word: Μή μου ἅπτου
  choice: Đừng níu giữ tôi
  rationale: Động từ ἅπτομαι ở mệnh lệnh hiện tại với μή trong ngữ cảnh này hợp lý nhất là chỉ việc đang níu hoặc tiếp tục giữ, chứ không đơn thuần là chạm vào. “Níu giữ” tự nhiên trong tiếng Việt và không diễn giải quá mức.
- source_word: οὔπω γὰρ ἀναβέβηκα πρὸς τὸν πατέρα
  choice: vì tôi chưa lên với Cha
  rationale: “Chưa lên” truyền đạt thể hoàn thành phủ định cùng hướng chuyển động đến với Cha; cách nói này tự nhiên trong tiếng Việt và vẫn giữ sắc thái thần học của động từ ἀναβαίνω trong Giăng.
- source_word: πρὸς τὸν πατέρα
  choice: với Cha
  rationale: Danh từ có mạo từ nhưng không có đại từ sở hữu trong mệnh đề đầu. “Cha” bảo toàn sự khác biệt với lời tiếp theo, nơi Đức Giê-su nói rõ “Cha tôi và Cha anh em”.
- source_word: πορεύου
  choice: hãy đi đến với
  rationale: Mệnh lệnh chuyển động được diễn đạt tự nhiên; “đến với” phản ánh πρὸς và tránh cách nói hơi gượng “đi tới các anh em”.
- source_word: τοὺς ἀδελφούς μου
  choice: các anh em của tôi
  rationale: Giữ hình thức giống đực số nhiều của tiếng Hy Lạp. Trong ngữ cảnh, cụm từ chỉ các môn đồ của Đức Giê-su; phạm vi chính xác được ghi chú thay vì đưa cách hiểu bao quát vào chính văn.
- source_word: εἰπὲ αὐτοῖς
  choice: nói với họ
  rationale: Cách diễn đạt trực tiếp, tự nhiên và sát cấu trúc Hy Lạp.
- source_word: Ἀναβαίνω
  choice: Tôi đang lên
  rationale: Thì hiện tại có thể diễn tả hành động sắp diễn ra với sắc thái tiến triển. “Đang lên” giữ tính sống động và không biến câu thành một phát biểu chung chung.
- source_word: πατέρα μου καὶ πατέρα ὑμῶν
  choice: Cha tôi và Cha anh em
  rationale: Giữ phép song song có chủ ý và sự phân biệt giữa mối quan hệ của Đức Giê-su với Cha và mối quan hệ của các môn đồ với Cha.
- source_word: θεόν μου καὶ θεὸν ὑμῶν
  choice: Đức Chúa Trời của tôi và Đức Chúa Trời của anh em
  rationale: Dịch trực tiếp cấu trúc song song, không làm nhẹ đi cụm “Đức Chúa Trời của tôi” vì lý do thần học.
theological_decisions:
- issue: Ý nghĩa của Μή μου ἅπτου
  choice: Lời cấm tiếp tục níu giữ Đức Giê-su
  alternative: Đừng chạm vào tôi
  rationale: Thể và ngữ cảnh ủng hộ sắc thái một hành động đang tiếp diễn. Bản dịch vẫn ghi nhận các khả năng từ vựng khác trong chú thích và không tuyệt đối hóa thành lệnh cấm mọi tiếp xúc.
- issue: Cách dịch πατέρα trong mệnh đề đầu
  choice: Cha
  alternative: Cha tôi
  rationale: Bản Hy Lạp không có μου ở mệnh đề đầu. Không thêm “tôi” giúp giữ nguyên cách diễn đạt và để lời trích dẫn sau đó nêu rõ “Cha tôi và Cha anh em”.
- issue: Hàm ý Kitô học của θεόν μου καὶ θεὸν ὑμῶν
  choice: Dịch thẳng “Đức Chúa Trời của tôi và Đức Chúa Trời của anh em”
  alternative: Diễn ý nhằm giảm nhẹ cụm “Đức Chúa Trời của tôi”
  rationale: Giữ nguyên sức nặng và sự căng thẳng thần học của câu, không sửa lời văn để ngăn trước một cách hiểu giáo lý nào.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Giê-su” và “Đức Chúa Trời” theo lối gọi phổ biến trong tiếng Việt; đại từ “tôi/anh em” giữ lời nói trực tiếp tự nhiên và phép song song của nguyên văn. Các dấu chú thích [a], [b] đều xuất hiện trong chính văn.
