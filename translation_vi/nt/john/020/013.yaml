  source_fidelity: 'Cần chỉnh nhẹ động từ tường thuật đầu câu: λέγουσιν αὐτῇ là “họ nói với bà”, rồi lời nói mang hình thức câu hỏi. “Họ hỏi bà” truyền đạt được chức năng nhưng làm yếu sự tương ứng trực tiếp với nguyên ngữ. Các phần còn lại truyền đạt đúng: τί κλαίεις là câu hỏi lý do; ἦραν diễn tả việc đã mang/lấy đi; và chủ thể của ἦραν/ἔθηκαν vẫn không xác định.'
  naturalness: Bản dịch nhìn chung tự nhiên, trang trọng vừa phải. “Thưa bà” là cách chuyển ngữ lịch sự, phù hợp với chức năng của Γύναι trong ngữ cảnh này. Việc chuyển từ “Người ta” sang “họ” vẫn rõ là cùng một chủ thể không xác định. Đặt ký hiệu chú thích ngay sau từ “đặt” giúp neo chú thích chính xác hơn.
  terminology: “Chúa của tôi” bảo toàn κύριόν μου và độ mở của danh xưng trong văn mạch Giăng. “Ngài” nhất quán với lối văn Kinh Thánh tiếng Việt và không áp đặt thêm một cách hiểu giáo phái. Không cần chú thích thay thế cho κύριος trong câu này.
  issues:
