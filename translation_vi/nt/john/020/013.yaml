  - severity: low
    issue: Vị trí neo chú thích [a]
    rationale: Chú thích giải thích lựa chọn “đặt/để”, nên ký hiệu cần đặt ngay sau “đặt”, thay vì sau toàn bộ câu trích dẫn.
