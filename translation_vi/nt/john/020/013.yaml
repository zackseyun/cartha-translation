id: JHN.20.13
reference: John 20:13
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ λέγουσιν αὐτῇ ἐκεῖνοι· Γύναι, τί κλαίεις; λέγει αὐτοῖς ὅτι Ἦραν τὸν κύριόν μου, καὶ οὐκ οἶδα ποῦ ἔθηκαν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/013.yaml
  text: And they said to her[a], “Woman, why are you weeping?” She said to them, “They have taken away my Lord[b], and I do not know where they have put him.”
translation:
  language: vi
  text: 'Họ nói với bà: “Thưa bà, sao bà khóc?” Bà đáp: “Người ta đã đem Chúa của tôi đi, và tôi không biết họ đặt[a] Ngài ở đâu.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “họ để Ngài ở đâu.” Động từ Hy Lạp có nghĩa rộng là “đặt” hoặc “để”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Γύναι
  choice: Thưa bà
  rationale: Lối xưng hô trực tiếp nhưng kính trọng trong tiếng Hy Lạp; “Thưa bà” truyền đạt sắc thái lịch sự tự nhiên trong tiếng Việt hiện đại mà không thêm tình cảm không có trong nguyên văn.
- source_word: τί κλαίεις
  choice: sao bà khóc?
  rationale: τί có nghĩa hình thức là “gì”, nhưng trong cấu trúc này hỏi nguyên do; “sao bà khóc?” là cách diễn đạt tự nhiên, đồng thời giữ thể hiện tại của κλαίεις về hành động đang tiếp diễn.
- source_word: Ἦραν
  choice: đã đem ... đi
  rationale: Động từ chỉ hành động lấy hoặc dời khỏi chỗ; “đã đem ... đi” phù hợp với việc thi thể không còn trong mộ và giữ tác nhân không xác định.
- source_word: τὸν κύριόν μου
  choice: Chúa của tôi
  rationale: Giữ κύριος là “Chúa”, bảo toàn cả sắc thái tôn kính cá nhân lẫn khả năng hàm nghĩa Kitô học; cấu trúc “của tôi” diễn đạt rõ đại từ sở hữu μου.
- source_word: οὐκ οἶδα
  choice: tôi không biết
  rationale: οἶδα có hình thức hoàn thành nhưng mang nghĩa trạng thái hiện tại, nên được dịch tự nhiên là “không biết”.
- source_word: ποῦ ἔθηκαν αὐτόν
  choice: họ đặt Ngài ở đâu
  rationale: τίθημι ở đây là đặt/để một người tại nơi nào đó; “đặt” tự nhiên trong ngữ cảnh thi thể và không thu hẹp nghĩa thành “an táng” hay “đặt nằm”.
- source_word: ἐκεῖνοι / chủ ngữ số nhiều không xác định của Ἦραν và ἔθηκαν
  choice: Họ / Người ta / họ
  rationale: ἐκεῖνοι được dịch là “Họ” vì chỉ hai thiên sứ vừa được nhắc đến; chủ thể của Ἦραν và ἔθηκαν không được xác định, nên lần đầu dùng “Người ta” để tránh khiến độc giả hiểu nhầm rằng chính các thiên sứ đã đem Chúa đi.
theological_decisions:
- issue: Cách dịch κύριος trong lời Ma-ri
  choice: Chúa của tôi
  alternative: chủ của tôi / thầy của tôi
  rationale: κύριος có thể là danh xưng kính trọng hoặc chỉ người chủ, nhưng trong Tin Mừng Giăng từ này cũng có sức nặng Kitô học. “Chúa” giữ nguyên độ mở đó thay vì thu hẹp về một quan hệ xã hội.
- issue: Sắc thái của Γύναι
  choice: Thưa bà
  alternative: Hỡi người đàn bà / Bà
  rationale: Nguyên ngữ là cách gọi kính trọng, không thô lỗ. “Thưa bà” tái hiện chức năng giao tiếp trong tiếng Việt hiện đại mà không thêm sắc thái thân mật.
- issue: Viết hoa đại từ chỉ Chúa Giê-su
  choice: Ngài
  alternative: ông ấy / người
  rationale: Dùng “Ngài” phù hợp văn phong Kinh Thánh tiếng Việt và sự tôn kính trong lời Ma-ri, nhưng không làm thay đổi danh xưng κύριος; đây là lựa chọn văn phong hơn là giải quyết hàm nghĩa thần học của câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Thưa bà” tránh sự cứng hoặc dễ bị hiểu là bất kính của cách dịch sát chữ Γύναι. “Người ta” giữ chủ thể của việc đem Chúa đi không xác định; “họ” ở mệnh đề sau tiếp nối cùng nhóm người không xác định. Dấu chú thích [a] được đặt ngay sau câu có từ cần giải thích.
