  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἶπεν οὖν αὐτοῖς ⸂ὁ Ἰησοῦς⸃ πάλιν· Εἰρήνη ὑμῖν· καθὼς ἀπέσταλκέν με ὁ πατήρ, κἀγὼ πέμπω ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/021.yaml
  text: So Jesus said to them again[a], “Peace to you. As the Father has sent me, even so I am sending you.”
translation:
  language: vi
  text: 'Vậy, Đức Giê-su lại nói với họ: “Bình an cho anh em.[a] Như Cha đã sai Ta, Ta cũng sai anh em như vậy.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc theo cách dịch truyền thống hơn: “Bình an ở cùng anh em.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Vì vậy
  rationale: Giữ lực nối tiếp và suy diễn nhẹ từ cảnh trước; cách nói tự nhiên, trang trọng trong tiếng Việt hiện đại.
- source_word: πάλιν
  choice: lại
  rationale: Cho thấy Đức Chúa Jêsus lặp lại lời chào ở câu trước.
- source_word: Εἰρήνη ὑμῖν
  choice: Bình an cho các con
  rationale: Giữ cấu trúc tỉnh lược động từ và sắc thái lời chào kiểu Sê-mít của nguyên văn; tiếng Việt vẫn rõ nghĩa và tự nhiên.
- source_word: καθὼς
  choice: Như ... thể nào
  rationale: Mở đầu phép so sánh giữa việc Cha sai Đức Chúa Jêsus và việc Ngài sai các môn đồ; kết hợp với “thể ấy” để diễn đạt đầy đủ cấu trúc tương ứng trong tiếng Việt.
- source_word: ἀπέσταλκέν
  choice: đã sai
  rationale: Tiếng Việt không đánh dấu thì hoàn thành như tiếng Hy Lạp; “đã sai” diễn tả hành động đã được thực hiện, còn hệ quả hiện tại được ngữ cảnh sứ mạng duy trì.
- source_word: ὁ πατήρ
  choice: Cha
  rationale: Không thêm đại từ sở hữu vốn không có trong nguyên văn; trong lời Đức Chúa Jêsus, “Cha” giữ cách gọi thần học đặc trưng của Giăng và tự nhiên hơn “người Cha”.
- source_word: κἀγὼ
  choice: Ta cũng
  rationale: Diễn đạt cả liên từ và sự nhấn mạnh vào chủ thể, đồng thời cân xứng với mệnh đề so sánh đứng trước.
- source_word: πέμπω
  choice: sai
  rationale: Thì hiện tại chỉ hành động ủy nhiệm đang diễn ra; tiếng Việt dùng động từ đơn trong lời tuyên bố hiện tại tự nhiên hơn dạng mở rộng “đang sai”.
- source_word: ὑμᾶς
  choice: các con
  rationale: Diễn đạt số nhiều và quan hệ giữa Đức Chúa Jêsus với các môn đồ trong lối xưng hô trang trọng, dễ hiểu; không biến đại từ thành một chức danh hay một nhóm giáo phẩm.
theological_decisions:
- issue: Mối liên hệ giữa việc Cha sai Đức Chúa Jêsus và việc Đức Chúa Jêsus sai các môn đồ
  choice: “Như Cha đã sai Ta thể nào, Ta cũng sai các con thể ấy.”
  alternative: “Cha đã sai Ta thế nào, Ta cũng sai các con như vậy.”
  rationale: Giữ phép loại suy về sứ mạng và sự ủy nhiệm nhưng không diễn giải thành sự đồng nhất tuyệt đối về thẩm quyền, phương thức hay chức vụ.
- issue: Cách gọi ὁ πατήρ
  choice: “Cha”
  alternative: “Đức Chúa Cha” hoặc “Cha Ta”
  rationale: Nguyên văn có danh từ xác định nhưng không có đại từ sở hữu; “Cha” không thêm thuật ngữ tín điều hay quan hệ sở hữu không được nói rõ tại đây.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Jêsus”, cùng cặp xưng hô “Ta—các con” theo lối Kinh Thánh Tin Lành quen thuộc; giữ lời chào ngắn gọn và phép so sánh cân xứng của nguyên văn.
