revisions:
- from: 'Vì vậy, Đức Chúa Jêsus lại nói với họ: “Bình an cho các con.[a] Như Cha đã sai Ta thể nào, Ta cũng sai các con thể ấy.”'
  to: 'Vậy, Đức Giê-su lại nói với họ: “Bình an cho anh em.[a] Như Cha đã sai Ta, Ta cũng sai anh em như vậy.”'
  rationale: Bản sửa giữ οὖν (“Vậy”), πάλιν (“lại”), lời chào tỉnh lược động từ, thì đã hoàn tất của ἀπέσταλκεν (“đã sai”), và phép đối ứng “Như …, Ta cũng … như vậy.” Đồng thời, bản sửa loại bỏ tước hiệu không có trong nguyên văn và tránh cụ thể hóa đại từ số nhiều thành quan hệ cha-con. Chú thích duy trì lựa chọn diễn đạt truyền thống cho lời chào mà không khẳng định đó là nghĩa duy nhất.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T08:26:53Z'
review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng lời chào được lặp lại và phép so sánh giữa việc Cha sai Đức Giê-su với việc Ngài sai nhóm người nghe. Tuy nhiên, “Đức Chúa Jêsus” thêm danh xưng “Chúa” không có trong ὁ Ἰησοῦς, còn “các con” cụ thể hóa quan hệ phụ tử không được biểu thị bởi ὑμᾶς. “Vì vậy” cũng mạnh tính suy luận hơn οὖν trong mạch tự sự này.
  naturalness: Câu “Như Cha đã sai Ta thể nào, Ta cũng sai các con thể ấy” hiểu được nhưng khá khuôn sáo và nặng trong tiếng Việt hiện đại. Cấu trúc “Như …, … cũng … như vậy” tự nhiên hơn, vẫn giữ rõ tính tương ứng.
  terminology: Dùng “Đức Giê-su” để tôn kính theo cách dùng Kinh Thánh tiếng Việt mà không thêm tước hiệu vào tên riêng của bản Hy Lạp. “Ta—anh em” giữ giọng trang trọng phù hợp lời nói của Đức Giê-su với các môn đồ, không áp đặt quan hệ “cha—con” tại nơi nguyên văn chỉ dùng đại từ số nhiều.
  issues:
  - severity: medium
    issue: Danh xưng “Đức Chúa Jêsus” thêm “Chúa” vào ὁ Ἰησοῦς.
    rationale: Bản SBLGNT ở câu này chỉ ghi “Jesus”; không có κύριος. Bản dịch không nên đưa một tước hiệu thần học vào câu khi nguyên văn không nêu.
  - severity: medium
    issue: “các con” diễn giải ὑμᾶς thành quan hệ cha-con.
    rationale: Đại từ Hy Lạp chỉ là “anh em/các người” số nhiều. Dù cách xưng hô này quen thuộc trong một số truyền thống, nó thêm sắc thái quan hệ không được nói rõ trong câu.
  - severity: low
    issue: “Vì vậy” có sắc thái kết luận mạnh hơn cần thiết.
    rationale: οὖν ở đây có thể đánh dấu sự tiếp nối của lời kể; “Vậy” bảo toàn liên kết mà nhẹ hơn trong tiếng Việt.
  - severity: low
    issue: Cặp “thể nào—thể ấy” kém tự nhiên trong văn phong hiện đại.
    rationale: Cách diễn đạt thay thế vẫn phản ánh καθὼς và lực so sánh của κἀγώ, đồng thời đọc trôi chảy hơn.
