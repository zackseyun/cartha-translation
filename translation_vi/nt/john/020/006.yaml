source:
  edition: SBLGNT
  text: ἔρχεται οὖν ⸀καὶ Σίμων Πέτρος ἀκολουθῶν αὐτῷ, καὶ εἰσῆλθεν εἰς τὸ μνημεῖον· καὶ θεωρεῖ τὰ ὀθόνια κείμενα,
base_translation:
  language: en
  yaml_path: translation/nt/john/020/006.yaml
  text: Then Simon Peter also came[a], following him, and entered into the tomb; and he sees the linen cloths lying there,
translation:
  language: vi
  text: Rồi Si-môn Phi-e-rơ cũng đến[a], theo sau người môn đồ ấy. Ông vào trong mộ và thấy những tấm vải lanh đang nằm đó.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tiếng Hy Lạp dùng thì hiện tại lịch sử ở cả “đến” và “thấy”, làm cho lời kể thêm sống động. Tiếng Việt không cần biến đổi hình thức động từ theo thì.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχεται
  choice: đến
  rationale: Động từ hiện tại lịch sử được dịch tự nhiên theo mạch kể tiếng Việt; tiếng Việt không bắt buộc đánh dấu thì, nên “đến” vừa trôi chảy vừa không làm mất sắc thái nguyên văn.
- source_word: οὖν
  choice: Rồi
  rationale: Trong ngữ cảnh, từ này chủ yếu nối tiếp diễn biến câu chuyện; “Rồi” tự nhiên hơn “Vì vậy” và vẫn cho thấy trình tự sự việc.
- source_word: καὶ Σίμων Πέτρος
  choice: Si-môn Phi-e-rơ cũng
  rationale: 'Dịch καὶ theo nghĩa bổ sung: Phi-e-rơ cũng đến, sau người môn đồ kia.'
- source_word: ἀκολουθῶν αὐτῷ
  choice: theo sau người môn đồ ấy
  rationale: Làm rõ đại từ αὐτῷ quy về người môn đồ vừa được nhắc đến, tránh đại từ tiếng Việt có thể bị hiểu là chỉ Phi-e-rơ, nhưng không thêm danh tính mà văn bản chưa nêu.
- source_word: εἰσῆλθεν εἰς τὸ μνημεῖον
  choice: Ông vào trong mộ
  rationale: Diễn đạt rõ chuyển động đi vào nơi chôn cất bằng tiếng Việt tự nhiên.
- source_word: θεωρεῖ
  choice: thấy
  rationale: Từ này chỉ việc nhìn thấy/chăm chú quan sát cảnh trước mắt; “thấy” rõ ràng, phổ thông và phù hợp nhịp kể sống động.
- source_word: τὰ ὀθόνια
  choice: những tấm vải gai
  rationale: Giữ nghĩa vật liệu và dạng số nhiều của các mảnh/tấm vải dùng trong việc mai táng, không diễn giải quá mức thành một kiểu quấn xác cụ thể.
- source_word: κείμενα
  choice: đang nằm đó
  rationale: Diễn tả trạng thái các tấm vải nằm tại chỗ trong mộ và giữ chi tiết thị giác của cảnh.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “mộ” thay cho cách diễn đạt dài hơn như “ngôi mộ chôn cất”; tách thành hai câu để tránh chuỗi liên từ nặng nề trong tiếng Việt, đồng thời giữ nguyên trình tự hành động.
