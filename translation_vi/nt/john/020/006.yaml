  verdict: revise
  source_fidelity: 'Bản dịch giữ đúng trình tự và các yếu tố chính của câu Hy Lạp: Si-môn Phi-e-rơ đến sau người môn đồ kia, vào mộ, và nhìn các tấm vải ở đó. Tuy nhiên, “vải gai” không tương ứng với ὀθόνια trong ngữ cảnh này; từ này chỉ các tấm vải lanh dùng trong việc mai táng, không phải vải gai/bố thô.'
