- from: Rồi Si-môn Phi-e-rơ cũng đến[a], theo sau người môn đồ ấy. Ông vào trong mộ và thấy những tấm vải gai đang nằm đó.
  to: Rồi Si-môn Phi-e-rơ cũng đến[a], theo sau người môn đồ ấy. Ông vào trong mộ và thấy những tấm vải lanh đang nằm đó.
  rationale: Chỉ thay thuật ngữ vật liệu “vải gai” bằng “vải lanh” để phản ánh chính xác ὀθόνια. Các lựa chọn còn lại truyền đạt trung thực mạch kể, quan hệ “cũng/theo sau”, chuyển động vào mộ, và trạng thái các tấm vải nằm tại đó.
