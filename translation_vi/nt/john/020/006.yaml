  terminology: Cần thay “vải gai” bằng “vải lanh”. “Mộ” và tên “Si-môn Phi-e-rơ” phù hợp; “những tấm vải lanh” giữ được số nhiều và tránh diễn giải cụ thể hóa cách quấn xác.
