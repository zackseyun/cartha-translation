source:
  edition: SBLGNT
  text: εἶτα λέγει τῷ Θωμᾷ· Φέρε τὸν δάκτυλόν σου ὧδε καὶ ἴδε τὰς χεῖράς μου, καὶ φέρε τὴν χεῖρά σου καὶ βάλε εἰς τὴν πλευράν μου, καὶ μὴ γίνου ἄπιστος ἀλλὰ πιστός.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/027.yaml
  text: Then he said to Thomas[a], “Bring your finger here and see my hands, and bring your hand and put it into my side, and do not become unbelieving, but believing.”
translation:
  language: vi
  text: 'Rồi Ngài phán với Thô-ma: “Hãy đưa ngón tay con lại đây và xem hai bàn tay Ta; hãy đưa tay con ra, rồi đặt vào cạnh sườn Ta. Đừng trở thành người không tin, nhưng hãy là người tin.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Đừng là người bất tín, nhưng hãy là người trung tín.” Hai tính từ Hy Lạp có thể mang cả hai nghĩa; trong ngữ cảnh này, trọng tâm là việc Thô-ma tin Chúa Giê-su đã sống lại.'
    reason: alternative_reading
lexical_decisions:
- source_word: εἶτα
  choice: Rồi
  rationale: Diễn tả trình tự của câu chuyện một cách tự nhiên trong tiếng Việt hiện đại.
- source_word: λέγει
  choice: Ngài phán
  rationale: Thì hiện tại lịch sử của tiếng Hy Lạp được chuyển sang lối kể quá khứ theo ngữ cảnh; “phán” giữ sắc thái trang trọng, phù hợp với lời Chúa Giê-su.
- source_word: Φέρε … φέρε
  choice: Hãy đưa … lại đây / hãy đưa … ra
  rationale: Giữ sự lặp lại của hai mệnh lệnh và diễn tả tự nhiên động tác đưa ngón tay, bàn tay về phía Chúa Giê-su.
- source_word: δάκτυλόν σου ὧδε
  choice: ngón tay con lại đây
  rationale: “Lại đây” giữ lực chỉ nơi chốn của ὧδε; “con” thể hiện cách xưng hô tự nhiên từ Chúa Giê-su với môn đồ trong tiếng Việt.
- source_word: ἴδε τὰς χεῖράς μου
  choice: xem hai bàn tay Ta
  rationale: “Xem” truyền đạt mệnh lệnh trực tiếp; “hai bàn tay” diễn đạt số nhiều tự nhiên trong tiếng Việt.
- source_word: βάλε εἰς τὴν πλευράν μου
  choice: đặt vào cạnh sườn Ta
  rationale: “Đặt vào” giữ hướng đi vào của εἰς, còn “cạnh sườn” chỉ phần thân bên đã bị đâm mà không giải thích quá mức.
- source_word: μὴ γίνου
  choice: Đừng trở thành
  rationale: Giữ sắc thái tiến trình hoặc chuyển thành trạng thái của γίνομαι, thay vì làm phẳng thành một mệnh đề tĩnh.
- source_word: ἄπιστος … πιστός
  choice: người không tin … người tin
  rationale: Trong mạch văn, sự tương phản tập trung vào việc Thô-ma tin hay không tin Chúa Giê-su đã sống lại; cách diễn đạt này rõ ràng và tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Sự tương phản ἄπιστος / πιστός trong lời Chúa Giê-su nói với Thô-ma
  choice: người không tin / người tin
  alternative: người bất tín / người trung tín
  rationale: Ngữ cảnh trực tiếp nói về việc Thô-ma từ chối tin lời chứng về sự phục sinh nếu chưa thấy và chạm. Vì vậy, nghĩa liên quan đến tin là trọng tâm, nhưng chú thích vẫn bảo lưu khả năng hai tính từ chỉ sự bất tín và trung tín.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Đại từ “Ngài/Ta/con” tạo lời thoại tự nhiên trong quan hệ giữa Chúa Giê-su và môn đồ; cấu trúc mệnh lệnh và sự lặp lại của nguyên văn được giữ lại khi tiếng Việt cho phép.
