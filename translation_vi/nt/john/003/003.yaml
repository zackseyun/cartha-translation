revisions:
- from: 'Đức Chúa Jêsus đáp lời ông: “Thật, thật, tôi nói với ông, nếu một người không được sinh ra từ trên,[a] thì người ấy không thể thấy vương quốc của Đức Chúa Trời.”'
  to: 'Giê-su trả lời ông và nói: “Quả thật, quả thật, tôi nói với ông, nếu một người không được sinh ra từ trên,[a] thì người ấy không thể thấy vương quốc của Đức Chúa Trời.”'
  rationale: Bản sửa loại bỏ tước hiệu không có trong nguyên ngữ và thay chính tả tên riêng bằng dạng hiện đại, trung tính hơn. Đồng thời, bản sửa làm tự nhiên hóa công thức nhấn mạnh mà vẫn bảo toàn sự lặp đôi, giữ nghĩa chính có chủ ý của ἄνωθεν và chú thích về lối chơi nghĩa ở câu kế tiếp.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T05:36:55Z'
review_pass:
  verdict: revise
  source_fidelity: 'Cần bỏ danh xưng thêm vào trước tên riêng: Ἰησοῦς chỉ là “Giê-su”, không có κύριος/“Chúa”. Bản sửa cũng biểu đạt rõ hai động từ tường thuật bằng “trả lời ... và nói”, giữ thể bị động của γεννηθῇ, nghĩa chính “từ trên” của ἄνωθεν, và điều kiện bất khả của οὐ δύναται.'
  naturalness: “Quả thật, quả thật” là công thức Việt ngữ tự nhiên và trang trọng hơn “Thật, thật”. “Giê-su trả lời ông và nói” rõ ràng, hiện đại, tuy có độ lặp nhẹ phù hợp với cấu trúc nhấn mạnh của nguyên ngữ.
  terminology: Dùng “Giê-su” theo chính tả Việt hiện đại, không áp dụng lối gọi “Đức Chúa Jêsus” mang tính truyền thống giáo phái và còn thêm tước hiệu không có trong câu nguồn. “Vương quốc của Đức Chúa Trời” được giữ vì chuyển tải βασιλεία τοῦ θεοῦ mà không tự diễn giải thành một khía cạnh riêng.
  issues:
  - severity: medium
    issue: Danh xưng “Đức Chúa Jêsus” thêm tước hiệu và dùng chính tả hệ phái.
    rationale: Nguyên văn chỉ có Ἰησοῦς (“Giê-su”). “Đức Chúa” không hiện diện trong nguồn và “Jêsus” không phải chính tả trung tính của tiếng Việt hiện đại chuẩn.
  - severity: low
    issue: “Thật, thật” hơi gượng trong tiếng Việt hiện đại.
    rationale: “Quả thật, quả thật” vẫn giữ nguyên sự lặp nhấn mạnh của Ἀμὴν ἀμὴν nhưng tự nhiên hơn trong văn xuôi trang trọng.
