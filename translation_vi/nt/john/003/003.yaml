id: JHN.3.3
reference: John 3:3
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸀ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ· Ἀμὴν ἀμὴν λέγω σοι, ἐὰν μή τις γεννηθῇ ἄνωθεν, οὐ δύναται ἰδεῖν τὴν βασιλείαν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/003.yaml
  text: Jesus answered and said to him, “Truly, truly, I say to you, unless someone is born from above,[a] he is not able to see the kingdom of God.”
translation:
  language: vi
  text: 'Giê-su trả lời ông và nói: “Quả thật, quả thật, tôi nói với ông, nếu một người không được sinh ra từ trên,[a] thì người ấy không thể thấy vương quốc của Đức Chúa Trời.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “được sinh ra lại” hoặc “được sinh ra một lần nữa.” Trạng từ Hy Lạp có thể mang cả nghĩa “từ trên” và “lại”; cuộc đối thoại ở câu kế tiếp dựa trên hai nghĩa này.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθη … καὶ εἶπεν
  choice: đáp lời
  rationale: Tiếng Hy Lạp dùng hai động từ ‘đáp’ và ‘nói’; ‘đáp lời’ diễn đạt tự nhiên chức năng của cả cụm trong lời kể tiếng Việt mà không tạo cách nói nặng nề ‘đáp và nói’.
- source_word: Ἀμὴν ἀμὴν
  choice: Thật, thật
  rationale: Giữ nguyên sự lặp đôi đầy nhấn mạnh của công thức Hy Lạp, đồng thời rõ nghĩa với độc giả Việt hiện đại.
- source_word: ἐὰν μή τις
  choice: nếu một người không
  rationale: Diễn đạt điều kiện phủ định và chủ thể phiếm chỉ một cách tự nhiên, không quy định giới tính.
- source_word: γεννηθῇ
  choice: được sinh ra
  rationale: Phản ánh thể bị động của γεννάω; không đưa nghĩa ‘lại’ vào động từ vì sắc thái đó thuộc về ἄνωθεν.
- source_word: ἄνωθεν
  choice: từ trên
  rationale: Giữ nghĩa chỉ nguồn gốc ‘từ trên’, phù hợp cách dùng trong Giăng và chủ đề trời–đất, nhưng không loại bỏ nghĩa ‘lại’ được ghi ở chú thích.
- source_word: οὐ δύναται
  choice: không thể
  rationale: Cách nói Việt tự nhiên và chính xác để diễn đạt sự bất khả của cụm Hy Lạp.
- source_word: ἰδεῖν
  choice: thấy
  rationale: Tương đương trực tiếp, đồng thời giữ độ mở giữa nhận biết và dự phần, thay vì giải nghĩa quá mức.
- source_word: βασιλείαν τοῦ θεοῦ
  choice: vương quốc của Đức Chúa Trời
  rationale: Cách dịch trang trọng, dễ hiểu, giữ được ý niệm vương quyền và phạm vi cai trị mà không thu hẹp thành một cách giải thích riêng.
theological_decisions:
- issue: Nghĩa của ἄνωθεν trong lời Đức Chúa Jêsus
  choice: từ trên
  alternative: lại; một lần nữa
  rationale: Trạng từ Hy Lạp thực sự có thể mang cả nghĩa ‘từ trên’ lẫn ‘lại’. Văn mạch và cách dùng trong sách Giăng nghiêng về nguồn gốc từ trên, còn phản ứng của Ni-cô-đem ở câu sau dựa trên nghĩa ‘lại’. Bản dịch chính và chú thích cùng bảo toàn lối chơi nghĩa và sự căng thẳng thần học này.
- issue: Ý nghĩa của ‘thấy’ vương quốc Đức Chúa Trời
  choice: giữ động từ ‘thấy’ mà không diễn giải
  alternative: nhận biết; bước vào; kinh nghiệm
  rationale: ἰδεῖν cho phép chiều nghĩa rộng hơn thị giác đơn thuần. Dịch ‘thấy’ tránh đồng nhất trước với ‘bước vào’ ở câu 5 hoặc áp đặt một cách hiểu thần học riêng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng ‘tôi—ông’ phù hợp lời đối thoại trực tiếp mà không thêm sắc thái thân mật. Giữ công thức nhấn mạnh ‘Thật, thật’ và thuật ngữ ‘vương quốc của Đức Chúa Trời’. Danh xưng ‘Đức Chúa Jêsus’ theo lối Kinh Thánh Tin Lành Việt ngữ quen thuộc, nhưng toàn câu tránh biệt ngữ giáo phái.
