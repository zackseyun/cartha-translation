id: JHN.3.16
reference: John 3:16
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Οὕτως γὰρ ἠγάπησεν ὁ θεὸς τὸν κόσμον ὥστε τὸν ⸀υἱὸν τὸν μονογενῆ ἔδωκεν, ἵνα πᾶς ὁ πιστεύων εἰς αὐτὸν μὴ ἀπόληται ἀλλὰ ἔχῃ ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/016.yaml
  text: 'For God loved the world in this way: he gave his only Son[b][a], so that everyone who believes in him should not perish but have eternal life.'
translation:
  language: vi
  text: 'Vì Đức Chúa Trời đã yêu thế gian theo cách này[a]: Ngài đã ban Con Một của Ngài[b], để bất cứ ai tin vào Con ấy không bị hư mất nhưng có sự sống đời đời.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch theo cách truyền thống: “Vì Đức Chúa Trời yêu thế gian đến nỗi…”. Tiếng Hy Lạp có thể được hiểu là nhấn mạnh cách thức Đức Chúa Trời yêu: “theo cách này”.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “người Con duy nhất” hoặc “người Con độc nhất vô nhị”; theo cách dịch truyền thống: “Con độc sinh”.'
    reason: alternative_reading
lexical_decisions:
- source_word: Οὕτως
  choice: theo cách này
  rationale: Trong cấu trúc của câu, từ này tự nhiên nhấn mạnh cách thức tình yêu của Đức Chúa Trời được bày tỏ, và phần sau giải thích cách ấy bằng việc Ngài ban Con mình.
- source_word: γὰρ
  choice: Vì
  rationale: Giữ chức năng giải thích và làm nền cho điều được nói trong ngữ cảnh ngay trước đó.
- source_word: ἠγάπησεν
  choice: đã yêu
  rationale: Diễn đạt tự nhiên thì quá khứ của động từ aorist mà không thêm sắc thái không có trong nguyên văn.
- source_word: ὁ θεὸς
  choice: Đức Chúa Trời
  rationale: Cách gọi trang trọng, quen thuộc trong tiếng Việt và tương ứng trực tiếp với danh từ chỉ Đức Chúa Trời trong nguyên văn.
- source_word: τὸν κόσμον
  choice: thế gian
  rationale: Giữ phạm vi rộng của κόσμος trong Giăng, không thu hẹp rõ ràng thành riêng nhân loại hay toàn thể tạo vật.
- source_word: ὥστε
  choice: ': Ngài đã ban'
  rationale: Dấu hai chấm diễn đạt tự nhiên rằng việc ban Con là cách thức và kết quả cụ thể của tình yêu vừa được nêu.
- source_word: τὸν υἱὸν τὸν μονογενῆ
  choice: Con Một của Ngài
  rationale: “Con Một” là cách nói tiếng Việt gọn, tự nhiên, chỉ người Con duy nhất và giữ quan hệ Cha–Con; chú thích bảo lưu các cách dịch nhấn mạnh tính độc nhất hoặc cách dịch truyền thống.
- source_word: ἔδωκεν
  choice: đã ban
  rationale: Giữ nghĩa rộng của động từ, không tự ý giới hạn việc ban Con vào riêng sự nhập thể hay sự đóng đinh.
- source_word: ἵνα
  choice: để
  rationale: Diễn đạt tự nhiên quan hệ mục đích hoặc kết quả được nhắm đến.
- source_word: πᾶς ὁ πιστεύων
  choice: bất cứ ai tin
  rationale: Thể hiện tính bao quát và khái quát của cụm phân từ danh hóa mà không đưa vào kết luận của một hệ phái về sự tuyển chọn hay đáp ứng của con người.
- source_word: εἰς αὐτὸν
  choice: nơi Con ấy
  rationale: “Tin nơi” là cách diễn đạt tự nhiên cho πιστεύω εἰς; “Con ấy” làm rõ đại từ đang chỉ về người Con vừa được nhắc đến.
- source_word: μὴ ἀπόληται
  choice: không bị diệt vong
  rationale: Giữ sức nặng của ἀπόλλυμι nhưng không xác định thêm bản chất hoặc phương thức của sự diệt vong.
- source_word: ἔχῃ ζωὴν αἰώνιον
  choice: có sự sống đời đời
  rationale: Cách dịch trực tiếp, tự nhiên, bảo lưu khái niệm Johannine về sự sống đời đời.
theological_decisions:
- issue: Ý nghĩa của Οὕτως
  choice: 'Cách thức: “theo cách này”'
  alternative: 'Mức độ: “yêu ... đến nỗi” hoặc “yêu ... biết bao”'
  rationale: Cú pháp với ὥστε và hành động ban Con cho thấy phần sau giải thích cách tình yêu được bày tỏ. Chú thích vẫn bảo lưu cách hiểu truyền thống thiên về mức độ.
- issue: Cách dịch μονογενής khi nói về Con
  choice: “Con Một” trong chính văn
  alternative: “Con duy nhất”, “người Con độc nhất vô nhị”, hoặc theo truyền thống “Con độc sinh”
  rationale: Cách chọn chính nhấn mạnh rằng đây là người Con duy nhất mà không giải thích quá mức từ nguyên; chú thích bảo lưu cách dịch truyền thống có ý nghĩa lịch sử và thần học.
- issue: Phạm vi của πᾶς ὁ πιστεύων
  choice: “bất cứ ai tin”
  alternative: “mọi người tin” hoặc “ai tin”
  rationale: Giữ lời văn bao quát, có điều kiện của câu mà không dùng bản dịch để giải quyết các tranh luận thần học về sự tuyển chọn, phạm vi cứu chuộc hay ý chí con người.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. “Ngài” được dùng kính trọng cho Đức Chúa Trời; “Con ấy” tránh đại từ mơ hồ. Câu giữ cấu trúc giải thích của nguyên văn nhưng dùng dấu hai chấm để tự nhiên trong tiếng Việt.
