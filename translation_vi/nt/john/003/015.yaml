    issue: 'Chú thích a: “mọi người tin” chưa tự nhiên và không phản ánh rõ phương án thay thế cho cụm chủ ngữ khái quát.'
    rationale: Cụm này thiếu yếu tố chỉ người như “ai,” nên có thể được đọc là “all people believe.” “Mọi ai tin” là phương án ngắn gọn, tự nhiên, và giữ phạm vi khái quát của πᾶς ὁ πιστεύων.
