source:
  edition: SBLGNT
  text: ἵνα πᾶς ὁ πιστεύων ⸂ἐν αὐτῷ⸃ ἔχῃ ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/015.yaml
  text: so that everyone who believes in him may have eternal life[a][b].
translation:
  language: vi
  text: để bất cứ ai tin nơi người ấy đều có sự sống đời đời.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “mọi ai tin.”
    reason: lexical_alternative
  - marker: b
    text: Một số bản dịch dùng “tin vào người ấy,” nhưng tiếng Hy Lạp ở đây viết “nơi người ấy” (ἐν αὐτῷ).
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: để
  rationale: Diễn đạt tự nhiên quan hệ mục đích hoặc kết quả với lời ngay trước đó.
- source_word: πᾶς ὁ πιστεύων
  choice: bất cứ ai tin
  rationale: Phân từ hiện tại có mạo từ được dùng như danh từ và mang nghĩa khái quát, bao gồm mọi người thuộc nhóm tin; cách dịch này tự nhiên trong tiếng Việt.
- source_word: πιστεύων
  choice: tin
  rationale: Đây là cách tương đương trực tiếp, trong sáng và quen thuộc của πιστεύω trong văn mạch Giăng.
- source_word: ἐν αὐτῷ
  choice: nơi người ấy
  rationale: Giữ đúng giới từ ἐν, không thay bằng sắc thái hướng đến của εἰς; “nơi” diễn đạt thành ngữ tin đặt ở một người mà vẫn phản ánh nghĩa “trong/nơi”.
- source_word: ἔχῃ
  choice: có
  rationale: Sau ἵνα, thể giả định được tiếng Việt diễn đạt tự nhiên bằng cấu trúc “để... có”, không cần thêm từ chỉ khả năng.
- source_word: ζωὴν αἰώνιον
  choice: sự sống đời đời
  rationale: Cách dịch chính xác, trang trọng và quen thuộc, chuyển tải cả tính không cùng và phẩm chất cánh chung của sự sống.
theological_decisions:
- issue: Cách dịch thành ngữ tin với ἐν αὐτῷ
  choice: tin nơi người ấy
  alternative: tin vào người ấy
  rationale: Bản Hy Lạp dùng ἐν chứ không dùng εἰς. “Tin nơi người ấy” giữ nét nghĩa của bản nguồn mà vẫn là tiếng Việt tự nhiên; không nhập cấu trúc thường gặp hơn ở những câu khác.
- issue: Phạm vi của πᾶς ὁ πιστεύων
  choice: bất cứ ai tin
  alternative: mọi người tin
  rationale: Cách dịch này bảo toàn phạm vi khái quát và bao gồm của cụm từ, đồng thời phản ánh cấu trúc số ít mang tính đại diện mà không giới hạn giới tính.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Đại từ “người ấy” tránh tự ý giải quyết tham chiếu của αὐτῷ trong một câu phụ thuộc vào văn cảnh trước; chữ thường cũng phù hợp vì bản Hy Lạp không mã hóa lối viết hoa tôn kính.
