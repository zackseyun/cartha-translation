review_pass:
  verdict: revise
  source_fidelity: Bản dịch giữ đúng cấu trúc tương phản và lực tất yếu của δεῖ. Tuy nhiên, “được tôn cao” diễn giải αὐξάνειν theo nghĩa được đề cao và còn thêm ý bị động không có trong nguyên ngữ. Động từ này nói cách khái quát rằng Đấng ấy phải ‘lớn lên/gia tăng’, song hành với việc Giăng ‘nhỏ đi/giảm đi’.
  naturalness: “Ngài phải lớn lên, còn tôi phải nhỏ đi” ngắn gọn, tự nhiên trong tiếng Việt chuẩn hiện đại, giữ được nhịp song hành và giọng trang trọng của lời tuyên bố.
  terminology: “Ngài” phù hợp với quy chiếu Đức Giê-su trong ngữ cảnh; “tôi” phù hợp với lời của Giăng. “Phải” truyền đạt δεῖ mà không xác định quá mức bản chất của sự cần thiết.
  issues:
  - severity: medium
    issue: “được tôn cao” cho αὐξάνειν
    rationale: Cụm này chuyển nghĩa rộng ‘tăng lên/lớn lên’ thành ý ‘được tôn vinh, được đề cao’, đồng thời dùng bị động dù αὐξάνειν là chủ động. Ngữ cảnh có thể bao hàm sự tăng trưởng về mức độ nổi bật, nhưng bản văn không nói riêng về hành động tôn cao.
  - severity: low
    issue: Chú thích dùng “trở nên ít hơn”
    rationale: Cách này sát một khả năng từ vựng nhưng không tự nhiên trong tiếng Việt. “nhỏ đi” hoặc “giảm đi” vừa rõ vừa giữ được tính khái quát của ἐλαττοῦσθαι.
  revised_text: Ngài phải lớn lên, còn tôi phải nhỏ đi.[a]
  revised_footnotes:
