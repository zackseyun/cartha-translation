  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐκεῖνον δεῖ αὐξάνειν, ἐμὲ δὲ ἐλαττοῦσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/030.yaml
  text: He must increase[a], but I must decrease.
translation:
  language: vi
  text: Ngài phải lớn lên, còn tôi phải nhỏ đi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc sát chữ hơn: “Đấng ấy phải gia tăng, còn tôi phải giảm đi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκεῖνον
  choice: Ngài
  rationale: Đại từ chỉ định ở đối cách làm chủ thể logic của động từ nguyên mẫu. Trong ngữ cảnh, từ này chỉ Đức Giê-su; “Ngài” là cách diễn đạt tự nhiên, tôn kính trong tiếng Việt mà không cần đưa danh xưng vào câu.
- source_word: δεῖ
  choice: phải
  rationale: “Phải” giữ được sức nặng của ý nghĩa cần thiết hay tất yếu, đồng thời không xác định quá mức đó là tất yếu thực tiễn hay sắc lệnh rõ ràng của Đức Chúa Trời.
- source_word: αὐξάνειν
  choice: được tôn cao
  rationale: Trong ngữ cảnh về vị thế và ảnh hưởng của Đức Giê-su so với Giăng, cách dịch này truyền đạt tự nhiên ý Ngài ngày càng nổi bật; chú thích giữ lại nghĩa sát chữ rộng hơn là “gia tăng”.
- source_word: ἐμὲ
  choice: tôi
  rationale: Đại từ ở đối cách là chủ thể logic của động từ nguyên mẫu và được diễn đạt tự nhiên bằng đại từ chủ ngữ “tôi” trong tiếng Việt.
- source_word: δὲ
  choice: còn
  rationale: “Còn” biểu thị rõ sự tương phản cân xứng giữa sự gia tăng của Đức Giê-su và sự thu nhỏ vai trò của Giăng, với giọng trang trọng, tự nhiên.
- source_word: ἐλαττοῦσθαι
  choice: trở nên nhỏ bé hơn
  rationale: Cách dịch này giữ sắc thái “trở nên ít hơn/nhỏ hơn” của dạng động từ, đồng thời phù hợp với sự suy giảm vị thế của Giăng trong ngữ cảnh.
theological_decisions:
- issue: Bản chất của sự cần thiết được diễn tả bởi δεῖ
  choice: Dịch đơn giản là “phải”, giữ ý về một trật tự cần thiết và thích hợp trong chương trình cứu rỗi.
  alternative: Xác định đây chỉ là nhu cầu thực tiễn, hoặc nói rõ đó là sắc lệnh trực tiếp của Đức Chúa Trời.
  rationale: δεῖ có thể hàm ý sự cần thiết thuộc ý định Đức Chúa Trời, nhưng câu này không giải thích cụ thể nguồn gốc hay cơ chế của sự cần thiết ấy. “Phải” bảo toàn sức nặng thần học mà không giải quyết thay cho bản văn.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, ngắn gọn và trang trọng. Cấu trúc song hành được giữ để bảo toàn tính cô đọng, đáng nhớ của lời nói; “được tôn cao” làm rõ ý theo ngữ cảnh, còn chú thích cung cấp cách dịch sát chữ.
