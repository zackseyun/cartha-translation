revisions:
- from: Ngài phải được tôn cao[a], còn tôi phải trở nên nhỏ bé hơn.
  to: Ngài phải lớn lên, còn tôi phải nhỏ đi.[a]
  rationale: Thay “được tôn cao” bằng “lớn lên” để dịch trực tiếp αὐξάνειν, duy trì thế song hành với ἐλαττοῦσθαι là “nhỏ đi”, và tránh thêm sắc thái tôn vinh hoặc bị động. Chú thích nêu phương án từ vựng “gia tăng/giảm đi” mà vẫn tự nhiên.
