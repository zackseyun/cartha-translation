id: JHN.3.5
reference: John 3:5
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸀ἀπεκρίθη Ἰησοῦς· Ἀμὴν ἀμὴν λέγω σοι, ἐὰν μή τις γεννηθῇ ἐξ ὕδατος καὶ πνεύματος, οὐ δύναται εἰσελθεῖν εἰς τὴν βασιλείαν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/005.yaml
  text: Jesus answered[a], “Truly, truly, I say to you, unless someone is born of water and the Spirit[b], he is not able to enter the kingdom of God.”
translation:
  language: vi
  text: 'Đức Giê-su đáp: “Quả thật, quả thật, tôi nói với ông: nếu ai không được sinh ra bởi nước và Thánh Linh[a], thì người ấy không thể vào vương quốc của Đức Chúa Trời.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “nước và linh.” Cụm “nước và Thánh Linh” đã được hiểu theo nhiều cách, như hình ảnh về sự thanh tẩy và đổi mới, sự sinh ra về thể xác và sự sinh ra thuộc linh, hoặc phép báp-têm. Bản dịch giữ cách diễn đạt của tiếng Hy Lạp mà không quyết định vấn đề giải nghĩa ngay trong chính văn.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθη Ἰησοῦς
  choice: Đức Giê-su đáp
  rationale: Cách kể đối thoại tự nhiên, trang trọng; “đáp” giữ sắc thái hồi đáp của động từ Hy Lạp.
- source_word: Ἀμὴν ἀμὴν
  choice: Thật, thật
  rationale: Giữ nguyên công thức nhấn mạnh được lặp đôi, đồng thời truyền đạt ý nghĩa cho độc giả Việt hiện đại.
- source_word: λέγω σοι
  choice: tôi nói với ông
  rationale: Giữ sự trực tiếp và trang trọng; đại từ số ít “ông” phù hợp với lời Đức Giê-su nói cùng Ni-cô-đê-mô.
- source_word: ἐὰν μή τις
  choice: nếu một người không
  rationale: Diễn đạt điều kiện phủ định và ý nghĩa chỉ người nói chung, không đưa thêm tính biệt giới.
- source_word: γεννηθῇ
  choice: được sinh ra
  rationale: Giữ thể bị động của γεννάω; không thêm nghĩa “lại” hay “từ trên” vì ἄνωθεν không có trong câu này.
- source_word: ἐξ ὕδατος καὶ πνεύματος
  choice: bởi nước và Thánh Linh
  rationale: “Bởi” diễn đạt nguồn hoặc tác nhân của sự sinh ra một cách tự nhiên. Viết “Thánh Linh” thể hiện đối tượng quy chiếu có khả năng nhất trong ngữ cảnh, nhưng chú thích vẫn bảo lưu khả năng dịch “linh”.
- source_word: οὐ δύναται εἰσελθεῖν
  choice: không thể vào
  rationale: Cách nói Việt ngữ tự nhiên, chuyển tải rõ ý không có khả năng bước vào.
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: vương quốc của Đức Chúa Trời
  rationale: Giữ hình ảnh βασιλεία và kết cấu sở hữu của nguyên văn mà không thu hẹp nghĩa chỉ còn lãnh thổ hay sự cai trị.
theological_decisions:
- issue: Đối tượng quy chiếu của πνεύματος trong ἐξ ὕδατος καὶ πνεύματος
  choice: Thánh Linh, tức Thánh Linh của Đức Chúa Trời
  alternative: linh, theo nghĩa một thực tại hoặc nguyên lý thuộc linh
  rationale: Ngữ cảnh Giăng và nền tảng Kinh Thánh rộng hơn khiến cách hiểu về Thánh Linh có khả năng cao hơn. Tuy nhiên, nguyên văn không có mạo từ và chữ viết Hy Lạp không phân biệt hoa-thường, nên chú thích bảo lưu cách dịch khác.
- issue: Ý nghĩa của “nước và Thánh Linh”
  choice: Giữ nguyên hình ảnh và cấu trúc của tiếng Hy Lạp trong chính văn
  alternative: Giải thích là sự thanh tẩy và đổi mới; sự sinh thể lý và sinh thuộc linh; hoặc phép báp-têm
  rationale: Câu dịch không áp đặt một mô hình giải nghĩa hay lập trường hệ phái cụ thể; chú thích nêu các cách hiểu chính để bảo tồn độ mở của nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Giê-su,” “Thánh Linh” và “Đức Chúa Trời” nhất quán với lối gọi tôn kính phổ biến; giữ nhịp lặp “Thật, thật” để bảo toàn sức nhấn của lời tuyên bố.
