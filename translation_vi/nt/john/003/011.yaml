id: JHN.3.11
reference: John 3:11
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀμὴν ἀμὴν λέγω σοι ὅτι ὃ οἴδαμεν λαλοῦμεν καὶ ὃ ἑωράκαμεν μαρτυροῦμεν, καὶ τὴν μαρτυρίαν ἡμῶν οὐ λαμβάνετε.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/011.yaml
  text: Truly[a], truly, I tell you, we speak what we know and testify to what we have seen[c][b], and you do not receive our testimony.
translation:
  language: vi
  text: 'Thật vậy, thật vậy, tôi nói với ông[a]: Chúng tôi nói điều chúng tôi biết và làm chứng về điều chúng tôi đã thấy, và các ông không đón nhận lời chứng của chúng tôi.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “A-men, a-men, tôi nói với ông.”'
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn chuyển từ “ông” ở số ít sang “các ông” ở số nhiều. “Chúng tôi” và “của chúng tôi” cũng là số nhiều; chính xác “chúng tôi” gồm những ai vẫn là điều được tranh luận.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  choice: Thật, thật
  rationale: Giữ nguyên công thức nhấn mạnh được lặp đôi, đồng thời diễn đạt ý xác quyết bằng tiếng Việt dễ hiểu; phương án phiên âm được ghi ở chú thích.
- source_word: λέγω σοι
  choice: tôi nói với ông
  rationale: Diễn đạt tự nhiên lời khẳng định trực tiếp với Ni-cô-đem; đại từ số ít của σοι được giữ rõ.
- source_word: ὃ οἴδαμεν λαλοῦμεν
  choice: chúng tôi nói điều mình biết
  rationale: Giữ ngôi thứ nhất số nhiều và trật tự ý nghĩa của nguyên văn, nhưng dùng cấu trúc tiếng Việt tự nhiên.
- source_word: ὃ ἑωράκαμεν μαρτυροῦμεν
  choice: làm chứng về điều mình đã thấy
  rationale: “Đã thấy” chuyển tải hành động đã xảy ra và vẫn có giá trị đối với lời chứng hiện tại; “làm chứng” giữ trường nghĩa chứng nhân của μαρτυρέω.
- source_word: τὴν μαρτυρίαν ἡμῶν
  choice: lời chứng của chúng tôi
  rationale: Giữ liên hệ từ vựng với “làm chứng” và không xác định thêm nhóm người được đại từ số nhiều bao gồm.
- source_word: οὐ λαμβάνετε
  choice: các ông không đón nhận
  rationale: “Đón nhận” bảo tồn sắc thái tiếp nhận của λαμβάνω, rộng hơn sự đồng ý thuần túy; dạng số nhiều của λαμβάνετε được thể hiện bằng “các ông”.
- source_word: καὶ
  choice: nhưng
  rationale: Liên từ có nghĩa cơ bản là “và”, nhưng tại đây nối lời chứng có cơ sở với sự không tiếp nhận, nên “nhưng” diễn đạt tự nhiên quan hệ tương phản trong tiếng Việt; chú thích bảo tồn phương án hình thức hơn.
theological_decisions:
- issue: Các đại từ ngôi thứ nhất số nhiều “chúng tôi/của chúng tôi”
  choice: Giữ nguyên số nhiều mà không xác định nhóm người được bao gồm.
  alternative: Hiểu là Đức Giê-su cùng các môn đồ, số nhiều tu từ, hoặc lời chứng thuộc thiên giới rộng hơn.
  rationale: Nguyên văn dùng số nhiều rõ ràng nhưng đối tượng quy chiếu còn được tranh luận; bản dịch không nên tự ý giải quyết sự căng thẳng giải nghĩa này.
- issue: Sự chuyển đổi từ “ông” số ít sang “các ông” số nhiều
  choice: Thể hiện rõ sự chuyển đổi số trong nguyên văn.
  alternative: Dùng một đại từ tiếng Việt không phân biệt số hoặc hiểu cả hai đều chỉ riêng Ni-cô-đem.
  rationale: σοι là số ít, còn λαμβάνετε là số nhiều. Giữ sự chuyển đổi này bảo tồn khả năng Đức Giê-su mở rộng lời nhận xét từ Ni-cô-đem sang một nhóm người mà ông đại diện, nhưng không xác định nhóm ấy.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. “Tôi/ông/các ông” phản ánh trực tiếp ngôi và số của tiếng Hy Lạp mà không áp đặt cách xưng hô thần học đặc thù. Dấu chấm phẩy giúp làm rõ bước chuyển sang phản ứng của người nghe.
