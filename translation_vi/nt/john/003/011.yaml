revisions:
- from: 'Thật, thật, tôi nói với ông[a]: Chúng tôi nói điều mình biết và làm chứng về điều mình đã thấy; nhưng các ông không đón nhận lời chứng của chúng tôi.[b]'
  to: 'Thật vậy, thật vậy, tôi nói với ông[a]: Chúng tôi nói điều chúng tôi biết và làm chứng về điều chúng tôi đã thấy, và các ông không đón nhận lời chứng của chúng tôi.[b]'
  rationale: Sửa “nhưng” thành “và” để phản ánh καὶ trực tiếp, đồng thời thay “mình” bằng “chúng tôi” để biểu thị minh bạch các động từ ngôi thứ nhất số nhiều. Chú thích được rút gọn để chỉ giải thích hai điểm ngữ pháp và diễn giải còn bất định thực sự có trong bản văn.
  reviewer_model: gpt-5.6-terra
