id: JHN.3.28
reference: John 3:28
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: αὐτοὶ ὑμεῖς ⸀μοι μαρτυρεῖτε ὅτι ⸀εἶπον· Οὐκ εἰμὶ ἐγὼ ὁ χριστός, ἀλλ’ ὅτι Ἀπεσταλμένος εἰμὶ ἔμπροσθεν ἐκείνου.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/028.yaml
  text: You yourselves bear me witness that I said[a], ‘I am not the Messiah[b], but I have been sent ahead of him.’
translation:
  language: vi
  text: 'Chính anh em làm chứng cho tôi rằng tôi đã nói: “Tôi không phải là Đấng Mê-si-a[a], nhưng tôi đã được sai đi trước Ngài[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “Đấng Ki-tô.”'
    reason: Cung cấp cách phiên âm Hy Lạp quen thuộc thay cho tước hiệu “Mê-si-a”.
  - marker: b
    text: 'Cũng có thể dịch: “tôi được sai đi trước Ngài” hoặc “tôi đã được sai đi trước Ngài.”'
    reason: Cấu trúc Hy Lạp có thể được diễn đạt với trọng tâm vào tình trạng hiện tại hoặc hành động sai phái đã hoàn tất; tiếng Việt không tái hiện trọn vẹn sắc thái này bằng một hình thức duy nhất.
lexical_decisions:
- source_word: αὐτοὶ ὑμεῖς
  choice: Chính anh em
  rationale: Đại từ kết hợp mang tính nhấn mạnh; “chính anh em” diễn đạt tự nhiên rằng những người nghe đích thân là nhân chứng.
- source_word: μοι μαρτυρεῖτε
  choice: làm chứng cho tôi
  rationale: Giữ sắc thái chứng nhận/làm chứng nổi bật trong văn chương Giăng; đại từ ở cách cho chỉ người được lời chứng xác nhận.
- source_word: εἶπον
  choice: tôi đã nói
  rationale: Thì aorist quy chiếu đến lời Giăng đã nói trước đó; “đã nói” là cách diễn đạt quá khứ tự nhiên trong tiếng Việt.
- source_word: ὁ χριστός
  choice: Đấng Mê-si
  rationale: Ở đây Χριστός là tước hiệu của nhân vật được xức dầu mà dân chúng mong đợi, không phải một thành phần tên riêng.
- source_word: Ἀπεσταλμένος εἰμὶ
  choice: tôi đã được sai đi
  rationale: Cấu trúc phân từ hoàn thành kết hợp với εἰμί trình bày việc được sai phái đã xảy ra nhưng địa vị/sứ mạng ấy vẫn có hiệu lực; “đã được sai đi” giữ cả thể bị động lẫn ý nghĩa đó.
- source_word: ἔμπροσθεν ἐκείνου
  choice: trước Ngài
  rationale: Diễn đạt vai trò đi trước, chuẩn bị của Giăng đối với Đấng Mê-si; “Ngài” có tiền ngữ rõ ràng và tự nhiên trong văn phong Kinh Thánh tiếng Việt.
theological_decisions:
- issue: Cách dịch Χριστός như một tước hiệu
  choice: Đấng Mê-si
  alternative: Đấng Ki-tô
  rationale: Lời phủ nhận của Giăng nói đến Đấng được xức dầu mà người ta mong đợi. “Đấng Mê-si” làm rõ chức năng tước hiệu, còn cách gọi truyền thống “Đấng Ki-tô” được giữ trong chú thích.
- issue: Sắc thái sứ mạng của Giăng trong Ἀπεσταλμένος εἰμὶ
  choice: tôi đã được sai đi trước Ngài
  alternative: tôi được sai đi trước Ngài; tôi đã được sai đi trước Ngài từ trước
  rationale: Bản dịch chính giữ ý được sai phái trước đó với hiệu lực hiện tại, đồng thời chỉ nói đến vai trò đi trước mà không thêm nội dung thần học ngoài câu Hy Lạp.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” để nói với một nhóm người, “Đấng Mê-si” như tước hiệu, và “Ngài” cho tiền ngữ là Đấng Mê-si. Cấu trúc câu giữ sự nhấn mạnh ở “chính anh em” và sự tương phản giữa lời phủ nhận với sứ mạng đi trước.
