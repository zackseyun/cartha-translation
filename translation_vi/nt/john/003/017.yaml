  terminology: “Đức Chúa Trời,” “Con,” “thế gian,” “phán xét,” và “được cứu” nhất quán với văn phong Kinh Thánh tiếng Việt và không áp đặt diễn giải giáo phái vượt quá nguyên văn. Chú thích thay thế “kết án” đặt đúng tại κρίνῃ và diễn đạt chính xác tính khả dĩ theo ngữ cảnh.
