id: JHN.3.17
reference: John 3:17
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οὐ γὰρ ἀπέστειλεν ὁ θεὸς τὸν ⸀υἱὸν εἰς τὸν κόσμον ἵνα κρίνῃ τὸν κόσμον, ἀλλ’ ἵνα σωθῇ ὁ κόσμος δι’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/017.yaml
  text: For God did not send the Son into the world so that he might judge the world[a], but so that the world might be saved through him.
translation:
  language: vi
  text: Vì Đức Chúa Trời không sai Con vào thế gian để phán xét thế gian[a], nhưng để thế gian nhờ Con mà được cứu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “để kết án thế gian.” Trong ngữ cảnh này, động từ Hy Lạp có thể được hiểu theo nghĩa hẹp ấy, nhưng nghĩa cơ bản là “phán xét.”'
    reason: alternative_reading
lexical_decisions:
- source_word: οὐ γὰρ
  choice: Vì ... không
  rationale: γάρ nối câu này với lời khẳng định trước bằng ý giải thích; “Vì” tự nhiên trong tiếng Việt, còn οὐ phủ định động từ.
- source_word: ἀπέστειλεν
  choice: sai
  rationale: “Sai” là cách diễn đạt trang trọng, tự nhiên cho hành động Đức Chúa Trời cử Con đến, đồng thời giữ chủ đề sai phái trong Phúc Âm Giăng mà không thêm sắc thái ngoài văn bản.
- source_word: ὁ θεὸς
  choice: Đức Chúa Trời
  rationale: Cách gọi tiêu chuẩn, trang trọng và dễ hiểu trong tiếng Việt dành cho θεός có mạo từ xác định ở đây.
- source_word: τὸν υἱὸν
  choice: Con
  rationale: Nguyên văn là “người Con/Con” với mạo từ, không có đại từ sở hữu. Viết hoa “Con” giữ tính danh xưng và quan hệ phụ tử đã rõ trong ngữ cảnh mà không thêm từ “Ngài”.
- source_word: εἰς τὸν κόσμον
  choice: vào thế gian
  rationale: εἰς diễn tả chuyển động vào trong phạm vi thế gian; “vào thế gian” trực tiếp và tự nhiên.
- source_word: ἵνα κρίνῃ τὸν κόσμον
  choice: để phán xét thế gian
  rationale: κρίνω có nghĩa cơ bản rộng là xét xử/phán xét, không chỉ riêng kết án. “Phán xét” giữ được phạm vi nghĩa và sự căng thẳng thần học của câu; cấu trúc “để” diễn đạt mục đích của ἵνα với động từ giả định mà tiếng Việt không cần đánh dấu riêng.
- source_word: ἀλλ’ ἵνα
  choice: nhưng để
  rationale: Giữ sự tương phản mạnh và cấu trúc mục đích song song giữa hai mệnh đề ἵνα.
- source_word: σωθῇ
  choice: được cứu
  rationale: Dạng bị động của σῴζω được diễn đạt tự nhiên bằng “được cứu”, giữ nghĩa rộng về sự giải cứu và cứu rỗi.
- source_word: ὁ κόσμος
  choice: thế gian
  rationale: “Thế gian” là cách diễn đạt tự nhiên trong văn phong Kinh Thánh tiếng Việt và giữ nguyên sự lặp lại của κόσμος, không thu hẹp thành chỉ một nhóm người.
- source_word: δι’ αὐτοῦ
  choice: nhờ Con
  rationale: διά với sở hữu cách chỉ phương tiện hoặc tác nhân. “Nhờ Con” tự nhiên trong tiếng Việt, làm rõ αὐτοῦ quy về “Con” và giữ ý cứu rỗi được thực hiện qua Con.
theological_decisions:
- issue: Nghĩa của κρίνῃ khi tương phản với σωθῇ
  choice: phán xét
  alternative: kết án
  rationale: Dù trong ngữ cảnh κρίνω có thể mang sắc thái “kết án”, nghĩa cơ bản của động từ rộng hơn. “Phán xét” bảo toàn phạm vi từ vựng và không biến câu thành một kết luận thần học hẹp hơn nguyên văn. Cách hiểu “kết án” được ghi ở chú thích.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ đọc. Giữ cấu trúc tương phản “không... nhưng...” cùng ba lần nhắc đến “thế gian”; dùng “Con” như danh xưng để bám sát τὸν υἱόν và tránh thêm đại từ sở hữu không có trong nguyên văn.
