review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch truyền đạt đúng địa điểm, lý do và chuỗi hành động; tuy nhiên “kéo đến” thêm sắc thái đám đông/ồ ạt không có trong παρεγίνοντο, vốn chỉ việc người ta đến liên tục hoặc lần lượt. Chú thích a gọi “vùng nước” là sát nghĩa không thật chính xác: ὕδατα πολλὰ là “nhiều nước” (theo số nhiều), không nhất thiết xác định là các ‘vùng nước’.'
  naturalness: “Giăng cũng đang làm phép báp-têm” và “chịu phép báp-têm” có thể hiểu được, nhưng “đang” trong câu kể tách riêng có thể gợi hiện tại tiếng Việt. Dùng “làm phép báp-têm” / “được làm phép báp-têm” giữ được sắc thái quá khứ tiếp diễn nhờ ngữ cảnh và thể bị động của nguyên ngữ.
  terminology: Giữ “Giăng”, “Ê-nôn”, “Sa-lim” và thuật ngữ “báp-têm” theo bản thảo. Chú thích về khả năng dịch βαπτίζω là “dìm xuống” cần áp dụng rõ cho cả dạng chủ động và bị động, đồng thời không kết luận về phương thức nghi lễ.
  issues:
