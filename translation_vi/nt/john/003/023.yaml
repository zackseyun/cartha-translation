  text: ἦν δὲ καὶ ⸀ὁ Ἰωάννης βαπτίζων ἐν Αἰνὼν ἐγγὺς τοῦ Σαλείμ, ὅτι ὕδατα πολλὰ ἦν ἐκεῖ, καὶ παρεγίνοντο καὶ ἐβαπτίζοντο·
base_translation:
  language: en
  yaml_path: translation/nt/john/003/023.yaml
  text: John also was baptizing at Aenon near Salim[a], because there were many waters there[b], and people were coming and being baptized.
translation:
  language: vi
  text: Giăng cũng làm phép báp-têm tại Ê-nôn, gần Sa-lim, vì ở đó có nhiều nước[a]. Người ta đến và được làm phép báp-têm[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Theo sát chữ: “vì có nhiều nước ở đó.”'
    reason: lexical_alternative
  - marker: b
    text: Động từ được dịch là “làm phép báp-têm” và “được làm phép báp-têm” cũng có thể dịch là “dìm xuống” và “được dìm xuống”. Ở đây giữ thuật ngữ quen dùng “báp-têm”; bản thân từ này không tự nó quyết định phương thức thực hiện.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν δὲ καὶ ὁ Ἰωάννης βαπτίζων
  choice: Giăng cũng đang làm phép báp-têm
  rationale: Cấu trúc ἦν + phân từ hiện tại diễn tả hoạt động đang tiếp diễn trong quá khứ; “cũng” thể hiện καί, còn δέ là chuyển ý nhẹ nên không cần thêm một từ nối gượng ép.
- source_word: ἐν Αἰνὼν ἐγγὺς τοῦ Σαλείμ
  choice: tại Ê-nôn, gần Sa-lim
  rationale: Dùng các địa danh phiên âm quen thuộc; “tại” chỉ địa điểm và “gần” diễn đạt trực tiếp quan hệ khoảng cách.
- source_word: ὅτι ὕδατα πολλὰ ἦν ἐκεῖ
  choice: vì nơi đó có nhiều nước
  rationale: ὅτι mang nghĩa nguyên nhân. Cách nói “nhiều nước” vừa tự nhiên trong tiếng Việt vừa giữ được hình thức số nhiều của ὕδατα.
- source_word: παρεγίνοντο
  choice: kéo đến
  rationale: Thì chưa hoàn thành diễn tả việc người ta liên tục hoặc lần lượt đến; “kéo đến” truyền đạt sắc thái nhiều người đến mà không thêm một con số cụ thể.
- source_word: ἐβαπτίζοντο
  choice: chịu phép báp-têm
  rationale: Giữ ý tiếp nhận hành động của thể bị động và dùng thuật ngữ tôn giáo đã được xác lập trong tiếng Việt.
theological_decisions:
- issue: Cách dịch βαπτίζω
  choice: làm phép báp-têm / chịu phép báp-têm
  alternative: dìm xuống / được dìm xuống
  rationale: “Báp-têm” giữ tính liên tục của thuật ngữ Tân Ước và không tự quyết định phương thức nghi lễ. Nghĩa thay thế liên quan đến việc dìm xuống được nêu trong chú thích để bảo tồn phạm vi nghĩa mà không áp đặt một lập trường hệ phái.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu được tách làm hai để tiếng Việt tự nhiên hơn nhưng vẫn giữ quan hệ diễn tiến của nguyên văn. Không thêm danh hiệu “người làm phép báp-têm” vào tên Giăng vì nguyên văn chỉ có tên riêng.
