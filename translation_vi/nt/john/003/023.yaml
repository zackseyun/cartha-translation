- from: Giăng cũng đang làm phép báp-têm tại Ê-nôn, gần Sa-lim, vì nơi đó có nhiều nước[a]. Người ta kéo đến và chịu phép báp-têm[b].
  to: Giăng cũng làm phép báp-têm tại Ê-nôn, gần Sa-lim, vì ở đó có nhiều nước[a]. Người ta đến và được làm phép báp-têm[b].
  rationale: Thay “kéo đến” bằng “đến” để không thêm ý về số đông hay cách thức đến. Chỉnh chú thích a theo nghĩa sát chữ của ὕδατα πολλὰ, và chỉnh chú thích b để tương ứng với cả hai lần xuất hiện của βαπτίζω, gồm cả thể bị động. Bản văn vẫn giữ quan hệ nguyên nhân, tính tiếp diễn theo ngữ cảnh, và không áp đặt quan điểm về phương thức báp-têm.
