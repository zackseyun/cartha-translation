  - severity: medium
    issue: Chú thích a mô tả “nhiều vùng nước” là ‘sát nghĩa’.
    rationale: Nguyên ngữ nói theo chữ là “nhiều nước”; ‘vùng nước’ là một cách giải thích khả dĩ, không phải bản dịch sát chữ.
