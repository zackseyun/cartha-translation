  text: ὁ λαβὼν αὐτοῦ τὴν μαρτυρίαν ἐσφράγισεν ὅτι ὁ θεὸς ἀληθής ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/033.yaml
  text: Whoever has received his testimony has certified that God is true[a].
translation:
  language: vi
  text: Ai đã tiếp nhận lời chứng của Ngài thì xác nhận rằng Đức Chúa Trời là chân thật.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nói sát hơn: “đã đóng ấn xác nhận rằng Đức Chúa Trời là chân thật.”'
    reason: Giữ lại hình ảnh ẩn dụ của ἐσφράγισεν, nghĩa đen là đóng hoặc đặt ấn.
lexical_decisions:
- source_word: ὁ λαβὼν
  choice: Ai đã tiếp nhận
  rationale: Mạo từ đi với phân từ aorist tạo thành cách nói chỉ người nói chung; “Ai đã tiếp nhận” tự nhiên trong tiếng Việt và giữ sắc thái hành động đã hoàn tất.
- source_word: αὐτοῦ
  choice: của người ấy
  rationale: Đại từ quy về nhân vật vừa được nói đến trong ngữ cảnh, tức Đấng từ trời đến; “người ấy” tránh sự mơ hồ về đại từ sở hữu trong tiếng Việt.
- source_word: τὴν μαρτυρίαν
  choice: lời chứng
  rationale: Diễn đạt tự nhiên đối tượng được tiếp nhận và giữ mô-típ làm chứng nổi bật trong Giăng.
- source_word: ἐσφράγισεν
  choice: xác nhận
  rationale: Động từ có nghĩa đen là đóng hoặc đặt ấn, nhưng tại đây được dùng ẩn dụ với nghĩa chứng thực; “xác nhận” truyền đạt rõ chức năng ấy, còn hình ảnh nguyên văn được giữ trong chú thích.
- source_word: ὅτι
  choice: rằng
  rationale: Liên từ giới thiệu nội dung được xác nhận, không phải mệnh đề chỉ nguyên nhân.
- source_word: ὁ θεὸς
  choice: Đức Chúa Trời
  rationale: Cách gọi trang trọng, quen thuộc và rõ nghĩa trong tiếng Việt, không thêm ý ngoài nguyên văn.
- source_word: ἀληθής
  choice: chân thật
  rationale: Giữ được cả ý đúng thật lẫn đáng tin, phù hợp với bối cảnh nói về lời chứng của Đức Chúa Trời.
theological_decisions:
- issue: Sức gợi của hình ảnh đóng ấn
  choice: Dùng “xác nhận” trong chính văn
  alternative: đã đặt ấn xác nhận
  rationale: Câu nói về việc tiếp nhận lời chứng như một hành động chứng thực Đức Chúa Trời là chân thật. Chính văn dùng cách nói hiện đại, dễ hiểu; chú thích bảo tồn hình ảnh đóng ấn của nguyên ngữ.
- issue: Đối tượng của αὐτοῦ
  choice: “người ấy,” chỉ Đấng từ trời đến trong ngữ cảnh
  alternative: “Ngài,” có thể bị hiểu là Đức Chúa Trời
  rationale: Đại từ gần nhất quy về nhân vật đang ban lời chứng; cách dịch không đồng nhất hóa đại từ này với Đức Chúa Trời được nhắc sau đó.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Cấu trúc “Ai... thì...” diễn đạt tự nhiên ý khái quát; “lời chứng” duy trì thuật ngữ xuyên suốt văn mạch Giăng.
