id: JHN.3.12
reference: John 3:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἰ τὰ ἐπίγεια εἶπον ὑμῖν καὶ οὐ πιστεύετε, πῶς ἐὰν εἴπω ὑμῖν τὰ ἐπουράνια πιστεύσετε;
base_translation:
  language: en
  yaml_path: translation/nt/john/003/012.yaml
  text: If I told you about earthly things and you do not believe[b][a], how will you believe if I tell you about heavenly things?
translation:
  language: vi
  text: Nếu tôi đã nói với các ông về những điều thuộc về đất mà các ông không tin, thì làm sao các ông sẽ tin nếu tôi nói với các ông về những điều thuộc về trời?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὰ ἐπίγεια
  choice: những điều thuộc về đất
  rationale: Tính từ số nhiều giống trung được dùng như danh từ. Cách dịch này giữ nguyên phạm vi nghĩa rộng và tạo thế đối xứng tự nhiên với “những điều thuộc về trời”, không thu hẹp thành các ví dụ hay sự kiện cụ thể trên đất.
- source_word: εἶπον
  choice: tôi đã nói
  rationale: Động từ aorist chỉ lời Đức Chúa Jêsus vừa nói trước đó; “đã nói với các ông” diễn đạt tự nhiên cấu trúc có ὑμῖν và giữ sắc thái của động từ λέγω.
- source_word: ὑμῖν
  choice: với các ông
  rationale: Đại từ số nhiều hướng đến Ni-cô-đem cùng nhóm mà ông đại diện. “Các ông” giữ số nhiều và phù hợp với lối xưng hô trang trọng trong ngữ cảnh.
- source_word: οὐ πιστεύετε
  choice: các ông không tin
  rationale: Thì hiện tại với οὐ diễn tả phản ứng hay tình trạng hiện tại. “Không tin” là cách dịch trực tiếp, tự nhiên và không ép nghĩa thành một sắc thái riêng như “không tín thác”.
- source_word: πῶς ... πιστεύσετε
  choice: thì làm sao các ông sẽ tin
  rationale: Giữ câu hỏi tu từ và dạng tương lai của πιστεύσετε, nói về khả năng họ sẽ đáp lại lời mặc khải tiếp theo.
- source_word: ἐὰν εἴπω
  choice: nếu tôi nói
  rationale: ἐὰν với aorist subjunctive nêu điều kiện có triển vọng trong tương lai; tiếng Việt tự nhiên dùng “nếu tôi nói” mà không cần thêm yếu tố suy đoán.
- source_word: τὰ ἐπουράνια
  choice: những điều thuộc về trời
  rationale: Tính từ số nhiều giống trung được dùng như danh từ. “Thuộc về trời” giữ tương phản với “thuộc về đất” và không xác định quá mức rằng đây là địa điểm, đề tài hay những mầu nhiệm cụ thể.
theological_decisions:
- issue: Ý nghĩa của sự tương phản giữa τὰ ἐπίγεια và τὰ ἐπουράνια
  choice: Dịch rộng là “những điều thuộc về đất” và “những điều thuộc về trời”.
  alternative: Có thể hiểu là “những điều ở dưới đất/ở trên trời”, các minh họa từ đời sống trần thế đối lập với những mầu nhiệm sâu xa của Đức Chúa Trời, hoặc các sự việc diễn ra trên đất đối lập với các thực tại trên trời.
  rationale: Nguyên văn xác lập hai phạm trù tương phản nhưng không tự giải thích chính xác phạm vi của từng phạm trù. Cách dịch rộng bảo toàn sự mơ hồ có thật và tránh đưa một lối giải nghĩa riêng vào câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ đại từ số nhiều ὑμῖν bằng “các ông”; cấu trúc đối xứng “thuộc về đất/thuộc về trời” vừa tự nhiên vừa bảo toàn tính khái quát của nguyên văn.
