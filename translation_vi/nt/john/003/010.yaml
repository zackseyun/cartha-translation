  rationale: Bản sửa chỉ khôi phục động từ «nói» trong công thức kể chuyện hai động từ của tiếng Hy Lạp và làm cho phương án thay thế trong chú thích song hành với thuật ngữ của bản văn. Nghĩa, sắc thái tu từ, và tính mơ hồ về mức độ định danh của «ὁ διδάσκαλος» đều được giữ nguyên.
