  text: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ· Σὺ εἶ ὁ διδάσκαλος τοῦ Ἰσραὴλ καὶ ταῦτα οὐ γινώσκεις;
base_translation:
  language: en
  yaml_path: translation/nt/john/003/010.yaml
  text: Jesus answered and said to him[a], “You are the teacher of Israel, and you do not know these things?”
translation:
  language: vi
  text: 'Đức Chúa Jêsus đáp và nói với ông: “Ông là bậc thầy của Y-sơ-ra-ên[a] mà lại không biết những điều này sao?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “một bậc thầy của Y-sơ-ra-ên.” Tiếng Hy Lạp dùng dạng xác định “bậc thầy”, có lẽ làm cho lời chất vấn thêm sắc bén.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη … καὶ εἶπεν αὐτῷ
  choice: đáp lời ông
  rationale: Công thức kể chuyện Hy Lạp dùng hai động từ theo nghĩa đen là ‘đáp và nói với ông’. Tiếng Việt tự nhiên chỉ cần ‘đáp lời ông’; dịch đủ cả hai sẽ nặng và trùng ý.
- source_word: Σὺ
  choice: Ông
  rationale: Đại từ được nêu rõ trong tiếng Hy Lạp mang sắc thái nhấn mạnh. Đặt ‘ông’ ở đầu lời chất vấn giúp giữ trọng tâm ấy và phù hợp với cách Đức Chúa Jêsus nói với Ni-cô-đem.
- source_word: ὁ διδάσκαλος
  choice: bậc thầy
  rationale: ‘Bậc thầy’ diễn đạt tự nhiên địa vị nổi bật và sắc thái xác định của danh ngữ Hy Lạp, đồng thời giữ lực chất vấn có phần sắc bén.
- source_word: τοῦ Ἰσραὴλ
  choice: của Y-sơ-ra-ên
  rationale: Giữ quan hệ sở thuộc/đại diện của sở hữu cách, thay vì thu hẹp thành địa điểm ‘ở Y-sơ-ra-ên’.
- source_word: ταῦτα
  choice: những điều này
  rationale: Cách dịch trực tiếp, tự nhiên, quy chiếu rộng đến lời dạy ngay trước đó.
- source_word: οὐ γινώσκεις
  choice: lại không biết … sao?
  rationale: ‘Biết’ giữ tính minh bạch từ vựng của γινώσκω; ‘mà lại… sao?’ thể hiện tự nhiên câu hỏi tu từ và sự tương phản trong tiếng Việt.
theological_decisions:
- issue: Sắc thái của ὁ διδάσκαλος τοῦ Ἰσραήλ khi Đức Chúa Jêsus gọi Ni-cô-đem
  choice: bậc thầy của Y-sơ-ra-ên
  alternative: một thầy dạy của Y-sơ-ra-ên
  rationale: 'Mạo từ xác định và ngữ cảnh tạo sắc thái nổi bật, có tính tu từ: người có địa vị dạy dỗ trong Y-sơ-ra-ên lại không biết các điều này. ‘Bậc thầy’ bảo toàn sắc thái ấy mà không khẳng định một chức danh chính thức không có trong văn bản.'
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng ‘Đức Chúa Jêsus’ và ‘Y-sơ-ra-ên’ theo lối gọi tên quen thuộc trong truyền thống Kinh Thánh tiếng Việt; ‘ông’ giữ phép xưng hô tôn trọng. Cấu trúc ‘mà lại… sao?’ truyền đạt tự nhiên lực của câu hỏi tu từ.
