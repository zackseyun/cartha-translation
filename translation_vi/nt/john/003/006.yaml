  source_fidelity: Bản dịch phản ánh đúng cấu trúc song song của τὸ γεγεννημένον ... ἐστιν, giữ quan hệ nguồn gốc của ἐκ bằng “từ”, và không thêm ý luân lý vào σάρξ. “Thánh Linh” phù hợp với τὸ πνεῦμα trong ngữ cảnh, còn “linh” viết thường ở vị ngữ giữ được sự phân biệt giữa Đấng là nguồn và tính chất/kết quả được diễn đạt bằng πνεῦμα không mạo từ.
  naturalness: Câu văn cân xứng, trang trọng và có thể hiểu được trong văn cảnh Kinh Thánh hiện đại. Cách dùng “linh” độc lập có sắc thái thuật ngữ, nhưng được dùng có chủ ý để bảo toàn danh từ và đối lập “xác thịt / linh”; chú thích b hỗ trợ người đọc mà không làm thay đổi bản văn.
  terminology: “Xác thịt” là thuật ngữ thích hợp và không áp đặt nghĩa “bản tính tội lỗi”. “Thánh Linh” nhất quán với ngữ cảnh sinh bởi Thánh Linh. Các chú thích a và b trung thành với những khả năng từ vựng liên quan và các ký hiệu neo được đặt đúng sau từ/cụm từ cần chú thích.
