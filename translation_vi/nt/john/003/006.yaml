id: JHN.3.6
reference: John 3:6
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τὸ γεγεννημένον ἐκ τῆς σαρκὸς σάρξ ἐστιν, καὶ τὸ γεγεννημένον ἐκ τοῦ πνεύματος πνεῦμά ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/006.yaml
  text: What is born of the flesh is flesh[b][a], and what is born of the Spirit is spirit.
translation:
  language: vi
  text: Điều được sinh ra từ xác thịt là xác thịt,[a] còn điều được sinh ra từ Thánh Linh là linh.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “Điều được sinh ra từ xác thịt mang bản tính con người.” Từ Hy Lạp được dịch là “xác thịt” trong một số ngữ cảnh có thể chỉ bản tính sa ngã hay tội lỗi của con người, nhưng ở đây sự đối lập chủ yếu là với việc được sinh ra từ Thánh Linh.'
    reason: lexical_alternative
  - marker: b
    text: 'Hoặc: “điều được sinh ra từ Thánh Linh thì thuộc linh.” Nguyên văn nói “là linh”, duy trì sự đối lập về tính chất với “xác thịt”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ γεγεννημένον
  choice: điều được sinh ra
  rationale: Cụm mạo từ giống trung số ít với phân từ hoàn thành thụ động mang nghĩa khái quát. “Điều được sinh ra” giữ được tính phạm trù và cấu trúc song song của nguyên văn.
- source_word: ἐκ
  choice: từ
  rationale: Trong ngữ cảnh sinh ra và nguồn gốc, “từ” diễn đạt tự nhiên, rõ ràng nguồn phát sinh.
- source_word: σάρξ / σαρκὸς
  choice: xác thịt
  rationale: “Xác thịt” bảo tồn hình ảnh và sự đối lập trong văn phong Giăng, không thu hẹp nghĩa thành “bản tính tội lỗi” khi trọng tâm ở đây là sự sinh ra tự nhiên đối lập với sự sinh ra từ Thánh Linh.
- source_word: πνεύματος
  choice: Thánh Linh
  rationale: Trong ngữ cảnh trực tiếp, danh từ có mạo từ chỉ Thánh Linh là nguồn của sự sinh ra; cách gọi này tự nhiên và rõ nghĩa trong tiếng Việt.
- source_word: πνεῦμα
  choice: linh
  rationale: Danh từ vị ngữ không có mạo từ mang sắc thái phẩm chất. Chữ thường phân biệt kết quả hay bản chất của điều được sinh ra với Thánh Linh là nguồn, đồng thời giữ nguyên danh từ thay vì diễn giải thành tính từ “thuộc linh”.
- source_word: ἐστιν
  choice: là
  rationale: Giữ nguyên hệ từ đơn giản và kết cấu định nghĩa súc tích của câu Hy Lạp.
theological_decisions:
- issue: Nghĩa của σάρξ trong mệnh đề thứ nhất
  choice: “xác thịt” theo bình diện con người tự nhiên
  alternative: “bản tính tội lỗi” hoặc “bản tính con người”
  rationale: Dù σάρξ đôi khi có nghĩa luân lý tiêu cực, ngữ cảnh này chủ yếu đối lập sự sinh ra tự nhiên với sự sinh ra từ Thánh Linh. “Xác thịt” giữ được độ mở và sức căng thần học của nguyên văn.
- issue: Ý nghĩa của πνεῦμα trong vị ngữ mệnh đề thứ hai
  choice: “linh” viết thường
  alternative: “Thánh Linh” hoặc “thuộc linh”
  rationale: 'Nguyên văn không có mạo từ ở danh từ vị ngữ và có thể nhấn mạnh phẩm chất: điều được sinh bởi Thánh Linh thuộc bình diện linh. “Linh” tránh đồng nhất kết quả với chính Thánh Linh và tránh diễn giải quá mức bằng tính từ.'
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng cấu trúc lặp cân xứng để phản ánh lời phán súc tích trong nguyên văn; giữ “xác thịt” và “linh” nhằm bảo tồn hình ảnh cùng sự mơ hồ có chủ ý.
