    rationale: Trong tiếng Việt hiện đại, «giáo sư» chủ yếu là học hàm/chức danh đại học. διδάσκαλος ở đây là «thầy dạy/teacher», nên «giáo sư» tạo một liên tưởng lịch sử-xã hội không có trong bản gốc.
  - severity: low
    issue: Thiếu yếu tố chỉ định trong «những dấu lạ»
    rationale: ταῦτα τὰ σημεῖα là «những dấu lạ này»/«những dấu chỉ này». Cần giữ «này» để phản ánh ταῦτα.
  - severity: low
    issue: «đang làm» thêm sắc thái tiếp diễn
    rationale: ποιεῖς là hiện tại, nhưng trong mệnh đề quan hệ tổng quát có thể dịch đơn giản là «thầy làm». «Đang» dễ gợi một hành động hiện diễn, không được câu Hy Lạp xác định.
