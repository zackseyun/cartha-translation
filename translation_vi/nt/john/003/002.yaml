  verdict: revise
  source_fidelity: Bản nháp giữ được ngôi số nhiều của «chúng tôi biết», nguồn gốc «đến từ Đức Chúa Trời», và sự chuyển từ ngôi thứ hai sang ngôi thứ ba ở mệnh đề cuối. Tuy nhiên, «giáo sư» thường chỉ chức danh học thuật hiện đại, không tương ứng tốt với διδάσκαλος trong bối cảnh này; «đang làm» cũng thêm sắc thái tiếp diễn không cần thiết. Cụm «những dấu lạ» thiếu từ chỉ định «này» của ταῦτα.
  naturalness: «Thầy dạy» là cách gọi tự nhiên và đúng bối cảnh hơn «giáo sư». Câu được chỉnh nhẹ để lời nói trang trọng, hiện đại, đồng thời vẫn giữ cấu trúc và sự lặp lại của động từ «làm» trong nguyên ngữ.
  terminology: Giữ «Ra-bi», «Đức Chúa Trời», và «dấu lạ». «Dấu lạ này» bảo toàn thuật ngữ Giăng và tính chỉ định của nguyên văn; chú thích giải thích lựa chọn này mà không biến nó thành «phép lạ» trong bản văn chính.
