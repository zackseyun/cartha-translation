reference: John 3:2
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οὗτος ἦλθεν πρὸς αὐτὸν νυκτὸς καὶ εἶπεν αὐτῷ· Ῥαββί, οἴδαμεν ὅτι ἀπὸ θεοῦ ἐλήλυθας διδάσκαλος· οὐδεὶς γὰρ ⸂δύναται ταῦτα τὰ σημεῖα⸃ ποιεῖν ἃ σὺ ποιεῖς, ἐὰν μὴ ᾖ ὁ θεὸς μετ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/002.yaml
  text: This man came to him by night and said to him[a], “Rabbi, we know that you have come from God as a teacher[c][b], for no one is able to do these signs that you do unless God is with him.”
translation:
  language: vi
  text: 'Người này đến gặp Đức Chúa Jêsus vào ban đêm[a] và thưa với Ngài: “Ra-bi, chúng tôi biết thầy đã đến từ Đức Chúa Trời với tư cách là một thầy dạy, vì không ai có thể làm những dấu lạ này[b] mà thầy làm, nếu Đức Chúa Trời không ở cùng người ấy.”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “trong đêm.” Trong sách Giăng, đêm và bóng tối đôi khi còn mang ý nghĩa biểu tượng.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “những phép lạ này.” Từ Hy Lạp σημεῖα được dịch là “dấu lạ” trong sách Giăng để giữ ý nghĩa các việc ấy là những dấu hiệu hướng đến điều vượt quá chính chúng.'
    reason: lexical_alternative
  - marker: c
    text: 'Nguyên văn Hy Lạp giữ ngôi thứ ba: “nếu Đức Chúa Trời không ở cùng người ấy,” thay vì đổi thành “ở cùng thầy.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτος
  choice: Người này
  rationale: Chỉ lại Ni-cô-đem vừa được giới thiệu ở câu 1, đồng thời giữ sắc thái chỉ định của đại từ Hy Lạp.
- source_word: νυκτός
  choice: vào ban đêm
  rationale: Diễn đạt tự nhiên cách nói chỉ thời gian, đồng thời không làm mất khả năng 'đêm' mang âm hưởng biểu tượng trong Giăng.
- source_word: Ῥαββί
  choice: Ra-bi
  rationale: Giữ danh xưng Do Thái bằng lối phiên âm quen thuộc, phù hợp bối cảnh lịch sử và cách bản Hy Lạp bảo lưu từ gốc Semit.
- source_word: οἴδαμεν
  choice: chúng tôi biết
  rationale: Giữ nguyên ngôi thứ nhất số nhiều; không tự ý đổi thành 'tôi biết' dù người nói là Ni-cô-đem.
- source_word: ἀπὸ θεοῦ ἐλήλυθας διδάσκαλος
  choice: thầy là một giáo sư đến từ Đức Chúa Trời
  rationale: Diễn đạt vai trò διδάσκαλος tự nhiên trong tiếng Việt và giữ ý nguồn gốc 'đến từ Đức Chúa Trời', không thêm khái niệm 'được sai đến' vốn không được động từ này nói rõ.
- source_word: ταῦτα τὰ σημεῖα
  choice: những dấu lạ
  rationale: '''Dấu lạ'' là cách gọi tự nhiên trong tiếng Việt, vừa cho thấy tính phi thường vừa giữ chức năng chỉ dấu của σημεῖον trong sách Giăng.'
- source_word: ποιεῖν ἃ σὺ ποιεῖς
  choice: làm những dấu lạ thầy đang làm
  rationale: Giữ sự lặp lại của ποιέω bằng động từ 'làm'; 'đang làm' diễn đạt hành động được chứng kiến mà không thay đổi nội dung mệnh đề.
- source_word: ἐὰν μὴ ᾖ ὁ θεὸς μετ’ αὐτοῦ
  choice: nếu Đức Chúa Trời không ở cùng người ấy
  rationale: Giữ ngôi thứ ba 'người ấy' của nguyên văn thay vì đổi thành ngôi thứ hai 'thầy', dù tiếng Việt có thể thấy hơi trang trọng hoặc gián tiếp.
theological_decisions:
- issue: Ý nghĩa của σημεῖα trong văn mạch sách Giăng
  choice: dấu lạ
  alternative: phép lạ
  rationale: Cách dịch này giữ được cả tính phi thường của hành động lẫn chức năng làm dấu chỉ hướng đến căn tính và sứ mạng của Đức Chúa Jêsus.
- issue: Sự chuyển từ ngôi thứ hai sang ngôi thứ ba trong lời Ni-cô-đem
  choice: nếu Đức Chúa Trời không ở cùng người ấy
  alternative: nếu Đức Chúa Trời không ở cùng thầy
  rationale: Nguyên văn chuyển từ lời trực tiếp nói với Đức Chúa Jêsus sang một phát biểu khái quát ở ngôi thứ ba; giữ sự chuyển đổi này bảo toàn kết cấu và sắc thái của câu.
- issue: ἀπὸ θεοῦ ἐλήλυθας có hàm ý được chính thức sai phái hay không
  choice: đến từ Đức Chúa Trời
  alternative: được Đức Chúa Trời sai đến
  rationale: Câu này nói rõ nguồn gốc từ Đức Chúa Trời nhưng không dùng động từ 'sai'; bản dịch không nên đưa thêm một ý thần học mạnh hơn chính cách diễn đạt tại đây.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “thưa” cho lời nói kính trọng của Ni-cô-đem; “thầy” tương ứng với cách xưng hô trực tiếp sau danh xưng Ra-bi. Giữ “Đức Chúa Trời” và “Đức Chúa Jêsus” theo lối gọi Cơ Đốc quen thuộc trong tiếng Việt.
