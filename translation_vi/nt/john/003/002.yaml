revisions:
- from: 'Người này đến gặp Đức Chúa Jêsus vào ban đêm[a] và thưa: “Ra-bi, chúng tôi biết thầy là một giáo sư đến từ Đức Chúa Trời, vì không ai có thể làm những dấu lạ[b] thầy đang làm nếu Đức Chúa Trời không ở cùng người ấy.”[c]'
  to: 'Người này đến gặp Đức Chúa Jêsus vào ban đêm[a] và thưa với Ngài: “Ra-bi, chúng tôi biết thầy đã đến từ Đức Chúa Trời với tư cách là một thầy dạy, vì không ai có thể làm những dấu lạ này[b] mà thầy làm, nếu Đức Chúa Trời không ở cùng người ấy.”[c]'
  rationale: Sửa «giáo sư» thành «thầy dạy» để phản ánh διδάσκαλος mà không gán một chức danh học thuật hiện đại; thêm «đã» để biểu đạt tự nhiên thì hoàn thành ἐλήλυθας; thêm «này» cho ταῦτα; và bỏ «đang» để không thêm nét nghĩa tiếp diễn. Các chú thích được giữ đủ ba mốc và chỉnh nhẹ chú thích b cho nhất quán với bản văn.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T05:36:56Z'
