  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: πᾶς γὰρ ὁ φαῦλα πράσσων μισεῖ τὸ φῶς καὶ οὐκ ἔρχεται πρὸς τὸ φῶς, ἵνα μὴ ἐλεγχθῇ τὰ ἔργα αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/john/003/020.yaml
  text: For everyone who practices evil hates the light and does not come to the light[b][a], lest his works be exposed.
translation:
  language: vi
  text: Vì bất cứ ai làm điều ác đều ghét ánh sáng và không đến với ánh sáng, để những việc mình làm[a] khỏi bị phơi bày.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn dùng đại từ giống đực số ít theo nghĩa khái quát, chỉ bất cứ người nào làm điều ác; cũng có thể dịch là “những việc của người ấy”.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “bị khiển trách” hoặc “bị chứng minh là có lỗi”; động từ Hy Lạp có thể mang nghĩa phơi bày điều sai trái, cho thấy có lỗi, hoặc đưa ra ánh sáng.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς γὰρ ὁ
  choice: Vì bất cứ ai
  rationale: “Vì” giữ chức năng giải thích của γάρ; “bất cứ ai” diễn đạt tự nhiên cấu trúc πᾶς với phân từ có mạo từ, chỉ mọi người có đặc điểm hành động được nói đến.
- source_word: φαῦλα πράσσων
  choice: làm điều ác
  rationale: φαῦλα mang nghĩa luân lý trong thế đối lập với “ánh sáng”; “làm điều ác” vừa rõ ràng vừa tự nhiên, còn dạng phân từ hiện tại mô tả người có lối hành xử ấy mà không nhất thiết phải thêm một trạng từ chỉ thói quen.
- source_word: μισεῖ τὸ φῶς
  choice: ghét ánh sáng
  rationale: Giữ nguyên sức mạnh của μισεῖ và hình ảnh thần học chủ đạo “ánh sáng” trong sách Giăng.
- source_word: οὐκ ἔρχεται πρὸς τὸ φῶς
  choice: không đến với ánh sáng
  rationale: Bảo tồn hình ảnh chuyển động hướng về sự sáng và cách diễn đạt đơn giản của nguyên văn.
- source_word: ἵνα μὴ
  choice: để ... khỏi
  rationale: Diễn đạt mục đích phủ định hoặc ý tránh né bằng tiếng Việt tự nhiên, không làm mất quan hệ ý nghĩa của mệnh đề.
- source_word: ἐλεγχθῇ
  choice: bị phơi bày
  rationale: Trong ngữ cảnh ánh sáng làm lộ rõ việc làm, “bị phơi bày” phù hợp với hình ảnh và vẫn để ngỏ sắc thái bị chứng minh là sai hoặc bị khiển trách.
- source_word: τὰ ἔργα αὐτοῦ
  choice: những việc mình làm
  rationale: Diễn đạt tự nhiên “các việc làm của người ấy” trong tiếng Việt; “mình” quy chiếu về bất cứ người nào đang được nói đến mà không gán giới tính vốn không bắt buộc trong tiếng Việt.
theological_decisions:
- issue: Đại từ giống đực số ít trong lời khái quát
  choice: những việc mình làm
  alternative: những việc của người ấy
  rationale: Nguyên văn dùng dạng giống đực số ít theo nghĩa đại diện cho bất cứ người nào. Tiếng Việt không có yêu cầu giống ngữ pháp tương ứng; “mình” giữ số ít và quan hệ quy chiếu mà không giới hạn câu cho nam giới.
- issue: Ý nghĩa của ἐλεγχθῇ trong quan hệ với ánh sáng
  choice: bị phơi bày
  alternative: bị khiển trách; bị chứng minh là có lỗi
  rationale: Ngữ cảnh nhấn mạnh ánh sáng làm lộ rõ việc làm. Bản dịch giữ sự căng thẳng giữa việc bị đưa ra ánh sáng, bị chứng minh là sai và bị khiển trách, thay vì thu hẹp từ này vào một sắc thái pháp lý.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. Giữ nguyên ẩn dụ “ánh sáng” đặc trưng của sách Giăng; dùng “để ... khỏi” để diễn đạt tự nhiên ý cố tránh việc các hành động bị ánh sáng làm lộ ra.
