id: JHN.3.36
reference: John 3:36
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ πιστεύων εἰς τὸν υἱὸν ἔχει ζωὴν αἰώνιον· ὁ δὲ ἀπειθῶν τῷ υἱῷ οὐκ ὄψεται ζωήν, ἀλλ’ ἡ ὀργὴ τοῦ θεοῦ μένει ἐπ’ αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/036.yaml
  text: The one who believes in the Son has eternal life; but the one who disobeys the Son will not see life, but the wrath of God remains on him.
translation:
  language: vi
  text: Ai tin Con thì có sự sống đời đời; còn ai không vâng phục Con[a] sẽ không thấy sự sống, nhưng cơn thịnh nộ của Đức Chúa Trời vẫn ở trên người ấy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “ai không chịu tin Con.” Động từ Hy Lạp có thể mang nghĩa khước từ tin cũng như không vâng phục.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ πιστεύων εἰς τὸν υἱόν
  choice: Ai tin Con
  rationale: Cụm phân từ có mạo từ diễn tả một người bất kỳ; “ai” tự nhiên trong tiếng Việt. “Tin Con” diễn đạt hướng của lòng tin mà không cần chuyển giới từ εἰς thành một từ riêng thiếu tự nhiên.
- source_word: ἔχει ζωὴν αἰώνιον
  choice: có sự sống đời đời
  rationale: Động từ hiện tại ἔχει cho biết sự sở hữu hiện tại; “sự sống đời đời” là cách diễn đạt rõ ràng, quen thuộc và phù hợp với cách dùng của Giăng.
- source_word: ὁ δὲ ἀπειθῶν τῷ υἱῷ
  choice: còn ai không vâng phục Con
  rationale: ἀπειθέω có thể bao hàm không vâng phục và khước từ tin. Bản văn chính giữ nghĩa rộng “không vâng phục,” còn sắc thái “không chịu tin” được ghi ở chú thích.
- source_word: οὐκ ὄψεται ζωήν
  choice: sẽ không thấy sự sống
  rationale: Giữ hình ảnh nguyên văn của ὁράω và nét hướng đến tương lai, thay vì diễn giải thành “không có” hay “không trải nghiệm.”
- source_word: ἡ ὀργὴ τοῦ θεοῦ
  choice: cơn thịnh nộ của Đức Chúa Trời
  rationale: “Cơn thịnh nộ” chuyển tải trực tiếp ὀργή mà không làm nhẹ ý phán xét; “Đức Chúa Trời” là danh xưng trang trọng và dễ hiểu.
- source_word: μένει ἐπ’ αὐτόν
  choice: vẫn ở trên người ấy
  rationale: “Vẫn ở” thể hiện trạng thái hiện tại tiếp diễn của μένει; “trên người ấy” giữ quan hệ của ἐπί và tránh khiến đại từ giống đực số ít bị hiểu là chỉ nam giới.
theological_decisions:
- issue: Nghĩa của ἀπειθῶν khi đối lập với πιστεύων
  choice: không vâng phục Con
  alternative: không chịu tin Con
  rationale: Sự đối lập với “tin” khiến ý không tin nổi bật, nhưng động từ cũng mang nghĩa không vâng phục. Bản chính bảo tồn nghĩa rộng, còn chú thích ghi nhận cách hiểu thay thế để không xóa bỏ sức căng của nguyên ngữ.
- issue: Thời điểm của sự sống đời đời và cơn thịnh nộ
  choice: Giữ sự sống đời đời là điều người tin hiện có và cơn thịnh nộ là trạng thái hiện vẫn tiếp diễn
  alternative: Hiểu cả hai chỉ thuộc về tương lai
  rationale: ἔχει và μένει đều ở thì hiện tại, trong khi οὐκ ὄψεται hướng đến tương lai. Bản dịch giữ nguyên sự kết hợp giữa hiện tại và tương lai.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng cấu trúc đối xứng “Ai…; còn ai…” và giữ các thuật ngữ thần học rõ ràng, không thêm diễn giải hệ phái.
