  text: Do not be amazed that I told you[b][a], ‘You must be born from above.’
translation:
  language: vi
  text: 'Đừng ngạc nhiên về điều tôi đã nói với ông[b]: ‘Các ông phải được sinh ra từ trên.’[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “được sinh lại” hoặc “được sinh ra một lần nữa”. Từ Hy Lạp ἄνωθεν có thể có nghĩa là “từ trên” hoặc “lại, một lần nữa”.'
    reason: alternative_reading
  - marker: b
    text: Trong nguyên văn Hy Lạp, “ông” trong cụm “tôi đã nói với ông” là số ít, nhưng đối tượng của lời “phải được sinh ra” là số nhiều.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ θαυμάσῃς
  choice: Đừng ngạc nhiên
  rationale: Cấu trúc μή với động từ ở thể giả định aorist mang sức mạnh ngăn cấm; cách diễn đạt này tự nhiên trong tiếng Việt hiện đại và giữ đúng ý của θαυμάζω.
- source_word: ὅτι
  choice: vì
  rationale: Trong tiếng Việt, “đừng ngạc nhiên vì tôi đã nói...” tự nhiên và truyền đạt điều làm Ni-cô-đem ngạc nhiên; câu trích dẫn tiếp theo làm rõ nội dung lời đã nói.
- source_word: εἶπόν σοι
  choice: tôi đã nói với ông
  rationale: σοι là đại từ số ít. “Ông” phù hợp với lời Chúa Giê-su trực tiếp nói với Ni-cô-đem và phân biệt được với ὑμᾶς số nhiều ở vế sau.
- source_word: Δεῖ
  choice: phải
  rationale: Diễn đạt ngắn gọn và mạnh mẽ tính tất yếu của δεῖ.
- source_word: ὑμᾶς
  choice: tất cả các ông
  rationale: ὑμᾶς là số nhiều, tương phản đáng chú ý với σοι số ít. Tiếng Việt có thể biểu thị rõ nét số nhiều ngay trong chính văn; chú thích vẫn giải thích sự chuyển đổi này.
- source_word: γεννηθῆναι
  choice: được sinh ra
  rationale: Động từ nguyên mẫu aorist bị động của γεννάω được chuyển bằng cấu trúc bị động tự nhiên, phù hợp ngữ cảnh nói về sự sinh ra.
- source_word: ἄνωθεν
  choice: từ trên
  rationale: ἄνωθεν có thể mang nghĩa “từ trên” hoặc “lại/một lần nữa”. “Từ trên” giữ trọng tâm về nguồn gốc thiên thượng trong văn mạch Giăng, còn nghĩa thay thế được bảo tồn trong chú thích.
theological_decisions:
- issue: Ý nghĩa của ἄνωθεν trong lời nói về sự sinh ra
  choice: từ trên
  alternative: lại; một lần nữa
  rationale: Từ Hy Lạp có tính đa nghĩa thực sự trong Giăng 3. Cách dùng rộng hơn trong sách Giăng và trọng tâm về sự sống bắt nguồn từ Đức Chúa Trời hỗ trợ “từ trên” trong chính văn, nhưng cách hiểu của Ni-cô-đem trong câu kế tiếp dựa vào nghĩa “lại”; vì vậy không được xóa bỏ nghĩa thay thế.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “tôi—ông” để giữ lời đối thoại trực tiếp mà không nâng giọng thành kính vượt quá dấu hiệu của nguyên văn. Cụm “tất cả các ông” làm rõ số nhiều của ὑμᾶς; các dấu chú thích [a], [b] đều xuất hiện trong chính văn.
