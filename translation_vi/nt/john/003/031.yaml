id: JHN.3.31
reference: John 3:31
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ὁ ἄνωθεν ἐρχόμενος ἐπάνω πάντων ἐστίν. ὁ ὢν ἐκ τῆς γῆς ἐκ τῆς γῆς ἐστιν καὶ ἐκ τῆς γῆς λαλεῖ· ὁ ἐκ τοῦ οὐρανοῦ ἐρχόμενος ἐπάνω πάντων ἐστίν·
base_translation:
  language: en
  yaml_path: translation/nt/john/003/031.yaml
  text: The one who comes from above is above all[a]. The one who is from the earth is from the earth and speaks from the earth[b]. The one who comes from heaven is above all.
translation:
  language: vi
  text: Đấng đến từ trên cao thì ở trên tất cả.[a] Người từ đất thì thuộc về đất và nói từ đất.[b] Đấng đến từ trời thì ở trên tất cả.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch “Đấng đến từ trời”; từ Hy Lạp ἄνωθεν chỉ nguồn gốc từ bên trên và được cụm “từ trời” ở cuối câu làm sáng tỏ.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch “nói về những điều thuộc đất”. Nguyên văn lặp lại sát nghĩa “từ đất”, có thể chỉ nguồn gốc, phạm vi hoặc nội dung lời nói.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄνωθεν
  choice: từ trên cao
  rationale: Diễn tả nguồn gốc từ bên trên, không phải sự lặp lại; đồng thời giữ cách nói khác biệt với cụm “từ trời” ở cuối câu.
- source_word: ἐρχόμενος
  choice: Đấng đến
  rationale: Phân từ có mạo từ được dùng như danh từ; “Đấng đến” tự nhiên, trang trọng và phù hợp với đối tượng được tôn cao trong ngữ cảnh.
- source_word: ἐπάνω πάντων
  choice: ở trên tất cả
  rationale: Giữ hình ảnh không gian đồng thời diễn tả địa vị tối thượng; “tất cả” bảo lưu khả năng πάντων chỉ mọi sự hoặc mọi người.
- source_word: ὁ ὢν ἐκ τῆς γῆς
  choice: Người từ đất mà ra
  rationale: Diễn đạt nguồn gốc của nhân vật một cách tự nhiên trong tiếng Việt và duy trì sự đối lập với Đấng đến từ trời.
- source_word: γῆ
  choice: đất
  rationale: Trong thế đối lập với trời, “đất” là từ ngắn gọn, tự nhiên và cho phép lặp lại phép đối chiếu của nguyên văn.
- source_word: ἐκ τῆς γῆς ἐστιν
  choice: thuộc về đất
  rationale: Tránh câu tiếng Việt vụng “là từ đất” nhưng vẫn diễn tả căn tính và phạm vi gắn với đất; sự lặp lại “đất” được giữ nguyên.
- source_word: ἐκ τῆς γῆς λαλεῖ
  choice: nói từ đất
  rationale: Bảo lưu giới từ ἐκ và sự mơ hồ giữa nguồn gốc, phạm vi và nội dung của lời nói, thay vì giải thích thành “theo quan điểm trần thế”.
- source_word: οὐρανός
  choice: trời
  rationale: Chỉ cõi trời, nguồn gốc thiên thượng, chứ không đơn thuần là bầu trời vật lý.
theological_decisions:
- issue: Quan hệ giữa “từ trên cao” và “từ trời”
  choice: 'Dùng hai cách diễn đạt khác nhau như nguyên văn: “từ trên cao” rồi “từ trời”.'
  alternative: Dịch cả hai là “từ trời”.
  rationale: Nguyên văn dùng hai biểu thức có liên hệ nhưng không đồng nhất. Cách dịch này giữ văn phong của Giăng và để vế sau làm sáng tỏ nguồn gốc thiên thượng mà không xóa khác biệt từ vựng.
- issue: Ý nghĩa của πάντων trong cụm ἐπάνω πάντων
  choice: Dịch “tất cả”, không xác định riêng là mọi người hay mọi sự.
  alternative: Dịch “mọi người” hoặc “muôn vật”.
  rationale: Dạng Hy Lạp có thể được hiểu rộng; “tất cả” giữ được tính bao quát và sự mơ hồ chân thực của nguyên văn.
- issue: Sức nhấn của ba lần nhắc đến đất
  choice: Giữ cả ba lần xuất hiện của “đất”.
  alternative: Rút gọn thành “người thuộc về đất thì nói những điều trần thế”.
  rationale: Sự lặp lại tạo nhịp điệu và nhấn mạnh sự tương phản giữa nguồn gốc thuộc đất với nguồn gốc từ trời; không nên làm trơn đến mức mất sức nhấn ấy.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “Đấng” cho nhân vật đến từ trên cao/từ trời và “Người” cho nhân vật từ đất để lời văn tự nhiên, đồng thời không nêu đích danh nhân vật mà nguyên văn không nêu. Giữ phép lặp “đất” và cấu trúc song hành của câu.
