revisions:
- from: Nhưng người làm theo chân lý thì đến với ánh sáng, để những việc người ấy làm được tỏ ra rằng chúng đã được thực hiện trong Đức Chúa Trời.[a][b]
  to: Nhưng người thực hành chân lý[a] thì đến với ánh sáng, để các việc làm của người ấy được tỏ rõ là đã được thực hiện trong Đức Chúa Trời.[b]
  rationale: Bản sửa thay cấu trúc mơ hồ “những việc người ấy làm được” bằng “các việc làm của người ấy”, và dùng “được tỏ rõ” để giữ thể bị động của động từ Hy Lạp. Cụm “là đã được thực hiện” diễn đạt tự nhiên chức năng nội dung của ὅτι, trong khi chú thích bảo tồn cách hiểu nguyên nhân “vì”.
  reviewer_model: gpt-5.6-terra
