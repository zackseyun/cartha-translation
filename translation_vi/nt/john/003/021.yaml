  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ δὲ ποιῶν τὴν ἀλήθειαν ἔρχεται πρὸς τὸ φῶς, ἵνα φανερωθῇ αὐτοῦ τὰ ἔργα ὅτι ἐν θεῷ ἐστιν εἰργασμένα.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/021.yaml
  text: But the one who does the truth comes to the light[a], so that his works may be revealed[d][c][b], because they have been done in God.
translation:
  language: vi
  text: Nhưng người thực hành chân lý[a] thì đến với ánh sáng, để các việc làm của người ấy được tỏ rõ là đã được thực hiện trong Đức Chúa Trời.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cụm này theo sát mặt chữ Hy Lạp là “làm chân lý”; cũng có thể dịch là “làm theo chân lý” hoặc “làm điều chân thật.”
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể hiểu phần cuối là: “để các việc làm của người ấy được tỏ rõ, vì chúng đã được thực hiện trong Đức Chúa Trời.” “Trong Đức Chúa Trời” cũng có thể hàm ý “bởi Đức Chúa Trời” hoặc “nhờ Đức Chúa Trời,” nhưng nguyên văn không giới hạn vào một sắc thái duy nhất.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ δὲ ποιῶν τὴν ἀλήθειαν
  choice: Nhưng người làm theo chân lý
  rationale: δέ biểu thị sự tương phản nhẹ với câu trước. Thành ngữ Hy Lạp theo sát mặt chữ là “làm chân lý”; tiếng Việt “làm theo chân lý” vừa tự nhiên hơn vừa giữ được ý chân lý được thể hiện bằng hành động, thay vì chỉ là điều được tin.
- source_word: ἔρχεται πρὸς τὸ φῶς
  choice: thì đến với ánh sáng
  rationale: πρός đi với động từ chuyển động mang nghĩa đến hoặc hướng tới. “Đến với ánh sáng” giữ hình ảnh tiếp cận ánh sáng và tự nhiên trong tiếng Việt.
- source_word: ἵνα φανερωθῇ αὐτοῦ τὰ ἔργα
  choice: để những việc người ấy làm được tỏ ra
  rationale: “Để” truyền đạt mục đích của ἵνα; “được tỏ ra” giữ thể bị động của φανερωθῇ. Diễn đạt ἔργα bằng “những việc ... làm” rõ ràng và tự nhiên hơn “các công việc” trong ngữ cảnh đạo đức.
- source_word: ὅτι
  choice: rằng
  rationale: 'Trong câu chính, ὅτι được hiểu là dẫn nội dung được bày tỏ: các việc ấy đã được thực hiện trong Đức Chúa Trời. Cách hiểu nguyên nhân “vì” vẫn khả dĩ và được ghi ở chú thích.'
- source_word: ἐν θεῷ
  choice: trong Đức Chúa Trời
  rationale: Giữ giới từ ἐν theo nghĩa rộng, không thu hẹp thành “bởi Đức Chúa Trời” hoặc “nhờ Đức Chúa Trời”; nhờ đó bảo tồn độ mở giữa phạm vi, mối liên hệ và tác động của Đức Chúa Trời.
- source_word: ἐστιν εἰργασμένα
  choice: đã được thực hiện
  rationale: Cấu trúc hoàn thành bị động nhấn mạnh việc đã hoàn tất cùng kết quả hiện hữu. “Đã được thực hiện” giữ thể bị động và sắc thái kết quả.
theological_decisions:
- issue: Ý nghĩa của thành ngữ ποιῶν τὴν ἀλήθειαν
  choice: làm theo chân lý
  alternative: thực hành chân lý; làm điều chân thật; sống theo chân lý
  rationale: Cách dịch này đủ tự nhiên đối với độc giả Việt ngữ nhưng vẫn giữ mối liên hệ trực tiếp giữa chân lý và hành động, không thu hẹp thành chỉ sự thành thật hay chỉ lối sống.
- issue: Chức năng của ὅτι
  choice: 'dẫn nội dung được tỏ ra: “rằng”'
  alternative: 'dẫn nguyên nhân: “vì/bởi vì”'
  rationale: Sau φανερωθῇ, ὅτι có thể nêu nội dung được bày tỏ, nhưng cũng có thể nêu lý do các việc ấy được tỏ ra. Bản chính chọn cách thứ nhất và chú thích cách thứ hai.
- issue: Sắc thái của ἐν θεῷ
  choice: trong Đức Chúa Trời
  alternative: bởi Đức Chúa Trời; nhờ Đức Chúa Trời; trong sự hiệp nhất với Đức Chúa Trời
  rationale: Cụm Hy Lạp có thể gợi đến phạm vi, mối liên hệ hoặc tác nhân. Giữ “trong Đức Chúa Trời” tránh quyết định thay cho nguyên văn một cách hiểu thần học hẹp hơn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Trời” cho θεός; tránh lối diễn đạt quá cổ. “Người ấy” giữ tham chiếu số ít mà không áp đặt giới tính trong tiếng Việt.
