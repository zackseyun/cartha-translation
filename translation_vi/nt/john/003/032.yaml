  to: Điều Người đã thấy và đã nghe, Người làm chứng về điều ấy, và không ai tiếp nhận lời chứng của Người.[a]
  rationale: Chỉ thay “nhưng” bằng “và” để phản ánh trực tiếp καὶ, không áp đặt cách giải quyết căng thẳng tu từ giữa câu này và câu 33. Các lựa chọn còn lại đều trung thành với nguyên văn và tự nhiên trong tiếng Việt hiện đại.
