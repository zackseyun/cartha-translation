  text: ⸀ὃ ἑώρακεν καὶ ἤκουσεν τοῦτο μαρτυρεῖ, καὶ τὴν μαρτυρίαν αὐτοῦ οὐδεὶς λαμβάνει.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/032.yaml
  text: What he has seen and heard[a], this he testifies to[b], and no one receives his testimony.
translation:
  language: vi
  text: Điều Người đã thấy và đã nghe, Người làm chứng về điều ấy, và không ai tiếp nhận lời chứng của Người.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Không ai tiếp nhận lời chứng của Người” là một cách khái quát mạnh; câu kế tiếp lại nói đến người tiếp nhận lời chứng ấy.
    reason: cross_reference
lexical_decisions:
- source_word: ὃ
  choice: Điều
  rationale: Đại từ quan hệ trung tính số ít chỉ nội dung Người đã thấy và nghe; “điều” tự nhiên trong tiếng Việt và không biến nó thành một tiền ngữ chỉ người.
- source_word: ἑώρακεν
  choice: đã thấy
  rationale: Thì hoàn thành Hy Lạp diễn tả việc đã thấy với giá trị còn liên hệ; tiếng Việt không mã hóa trực tiếp sự đối lập thể này, nên “đã thấy” truyền đạt tự nhiên ý nghĩa cốt lõi.
- source_word: ἤκουσεν
  choice: đã nghe
  rationale: Thì aorist đi cùng động từ hoàn thành phía trước. Lặp “đã” giúp câu tiếng Việt sáng rõ, dù không thể hiện trọn sự khác biệt về thể của hai động từ Hy Lạp.
- source_word: τοῦτο
  choice: điều ấy
  rationale: Đại từ chỉ định số ít nhắc lại chính nội dung vừa nêu và giữ được cấu trúc hồi chỉ của nguyên văn.
- source_word: μαρτυρεῖ
  choice: làm chứng về
  rationale: Giữ sắc thái nhân chứng/pháp lý quen thuộc trong văn chương Giăng; “về” nối động từ với nội dung lời chứng một cách tự nhiên.
- source_word: μαρτυρίαν
  choice: lời chứng
  rationale: Giữ sự liên kết từ vựng với “làm chứng” và diễn đạt tự nhiên danh từ μαρτυρία trong tiếng Việt.
- source_word: οὐδεὶς
  choice: không ai
  rationale: Phản ánh nguyên vẹn phủ định phổ quát, không làm nhẹ thành “rất ít người”.
- source_word: λαμβάνει
  choice: tiếp nhận
  rationale: Bao hàm hành động nhận lấy và đón nhận lời chứng, đồng thời ít thuần diễn giải hơn “tin”.
theological_decisions:
- issue: Phạm vi của lời khẳng định phổ quát οὐδεὶς λαμβάνει
  choice: Giữ nguyên cách nói mạnh “không ai tiếp nhận”.
  alternative: “Rất ít người tiếp nhận” hoặc hiểu tuyệt đối theo nghĩa toán học rằng hoàn toàn không một ai tiếp nhận.
  rationale: Nguyên văn dùng phủ định phổ quát một cách dứt khoát, trong khi câu kế tiếp nói đến người tiếp nhận lời chứng. Bản dịch giữ nguyên sức căng tu từ và thần học thay vì âm thầm giải quyết nó.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Người” để chỉ nhân vật đang được nói đến mà không thêm danh xưng không có trong câu Hy Lạp; dùng “lời chứng” nhất quán với trường nghĩa làm chứng trong sách Giăng.
