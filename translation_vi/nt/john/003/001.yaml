  text: Ἦν δὲ ἄνθρωπος ἐκ τῶν Φαρισαίων, Νικόδημος ὄνομα αὐτῷ, ἄρχων τῶν Ἰουδαίων·
base_translation:
  language: en
  yaml_path: translation/nt/john/003/001.yaml
  text: There was a man from the Pharisees named Nicodemus[a], a ruler of the Jews.
translation:
  language: vi
  text: Có một người thuộc phái Pha-ri-si tên là Ni-cô-đem, một nhà lãnh đạo của người Do Thái[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch “của người Giu-đê.” Trong Tin Mừng Giăng, từ Hy Lạp được dịch là “người Do Thái” tùy ngữ cảnh có thể chỉ người Do Thái nói chung, người Giu-đê, hoặc các nhà chức trách Do Thái.
    reason: Bảo tồn phạm vi nghĩa không hoàn toàn xác định của Ἰουδαίων trong văn mạch Giăng, đồng thời không làm giảm nghĩa thẩm quyền của ἄρχων.
lexical_decisions:
- source_word: Ἦν δὲ
  choice: Có một
  rationale: Ἦν giới thiệu sự hiện diện của nhân vật, còn δέ là từ nối nhẹ chuyển mạch câu chuyện. Cách dịch này tự nhiên trong tiếng Việt và không thêm ý thời gian như “bấy giờ”.
- source_word: ἄνθρωπος
  choice: một người
  rationale: Trong ngữ cảnh, danh từ chỉ một người nam cụ thể; tiếng Việt tự nhiên dùng “một người”, còn giới tính và danh tính được làm rõ qua tên riêng.
- source_word: ἐκ τῶν Φαρισαίων
  choice: thuộc phái Pha-ri-si
  rationale: ἐκ với sở hữu cách biểu thị người này xuất thân từ hoặc thuộc về nhóm Pha-ri-si. “Thuộc phái” diễn đạt rõ tư cách thành viên trong tiếng Việt hiện đại.
- source_word: Νικόδημος ὄνομα αὐτῷ
  choice: tên là Ni-cô-đêm
  rationale: Đây là lối diễn đạt tên gọi thông dụng trong tiếng Hy Lạp chịu ảnh hưởng Sê-mít; “tên là” vừa chính xác vừa tự nhiên.
- source_word: ἄρχων
  choice: một nhà lãnh đạo
  rationale: ἄρχων chỉ người giữ địa vị có thẩm quyền. “Nhà lãnh đạo” giữ nghĩa rộng của từ mà không khẳng định cụ thể chức vụ hay tư cách thành viên một hội đồng vốn không được nêu trực tiếp trong câu.
- source_word: τῶν Ἰουδαίων
  choice: của người Do Thái
  rationale: Trong ngữ cảnh này, cụm từ liên hệ địa vị của Ni-cô-đêm với cộng đồng và giới lãnh đạo Do Thái. Cách dịch chính giữ nghĩa rộng; sắc thái “người Giu-đê” hoặc “giới chức Do Thái” được ghi nhận trong chú thích.
theological_decisions:
- issue: Phạm vi nghĩa của Ἰουδαίων trong Tin Mừng Giăng
  choice: của người Do Thái
  alternative: của người Giu-đê; thuộc giới chức Do Thái
  rationale: Ἰουδαῖοι có thể mang nghĩa dân tộc-tôn giáo, địa vực hoặc chỉ giới hữu trách tùy ngữ cảnh. Vì Ni-cô-đêm vừa được giới thiệu là người Pha-ri-si vừa là ἄρχων, bản chính dùng nghĩa cộng đồng rộng mà không thu hẹp quá mức; chú thích bảo tồn các sắc thái khả hữu.
translation_notes:
  register: Tiếng Việt phổ thông hiện đại, trang trọng nhưng dễ hiểu. Tên riêng được phiên âm theo lối quen dùng trong các bản Kinh Thánh tiếng Việt. Câu giữ cấu trúc giới thiệu nhân vật gọn, không thêm một trạng từ thời gian không có trong nguyên văn.
