  source_fidelity: Bản dịch truyền đạt đầy đủ cấu trúc đối chiếu καθὼς ... οὕτως, hành động cụ thể “nâng ... lên” đối với con rắn, sự tất yếu của δεῖ qua “phải”, và thể bị động của ὑψωθῆναι. Việc dùng cùng một cách diễn đạt “nâng lên” ở cả hai vế bảo toàn liên kết cố ý trong nguyên văn và không thu hẹp nghĩa kép Giăng của ὑψόω.
