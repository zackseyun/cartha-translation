  terminology: “Môi-se,” “con rắn,” “hoang mạc,” và đặc biệt “Con Người” đều nhất quán với cách dùng Kinh Thánh tiếng Việt. “Nâng lên” là lựa chọn thích hợp hơn các cách diễn giải như “treo lên” hoặc chỉ “tôn cao”.
