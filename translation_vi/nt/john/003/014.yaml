id: JHN.3.14
reference: John 3:14
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ καθὼς Μωϋσῆς ὕψωσεν τὸν ὄφιν ἐν τῇ ἐρήμῳ, οὕτως ὑψωθῆναι δεῖ τὸν υἱὸν τοῦ ἀνθρώπου,
base_translation:
  language: en
  yaml_path: translation/nt/john/003/014.yaml
  text: And just as Moses lifted up the serpent in the wilderness[a], so the Son of Man must be lifted up[b],
translation:
  language: vi
  text: Như Môi-se đã nâng con rắn lên trong hoang mạc[a] thế nào, thì Con Người cũng phải được nâng lên[b] như vậy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Xem Dân Số Ký 21:8–9 về việc Môi-se nâng con rắn lên trong hoang mạc.
    reason: cross_reference
  - marker: b
    text: Cũng có thể hiểu là “được tôn cao”. Động từ Hy Lạp có thể chỉ cả việc được nâng lên về thể chất lẫn việc được tôn cao; trong sách Giăng, có lẽ cả hai nghĩa đều được chủ ý gợi lên ở đây.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς ... οὕτως
  choice: như ... thế nào, thì ... như vậy
  rationale: Diễn đạt rõ cấu trúc so sánh tương ứng giữa việc Môi-se làm và điều phải xảy đến với Con Người, đồng thời giữ văn phong tự nhiên trong tiếng Việt.
- source_word: ὕψωσεν / ὑψωθῆναι
  choice: đã nâng ... lên / phải được nâng lên
  rationale: “Nâng lên” giữ được nghĩa cụ thể là đưa lên cao trong câu chuyện về con rắn, đồng thời không loại bỏ sắc thái được tôn cao trong cách dùng có chủ ý đa nghĩa của Giăng.
- source_word: ὄφιν
  choice: con rắn
  rationale: Cách gọi thông dụng, rõ nghĩa trong tiếng Việt hiện đại và phù hợp với câu chuyện được nhắc lại từ Dân Số Ký 21.
- source_word: ἐν τῇ ἐρήμῳ
  choice: trong hoang mạc
  rationale: “Hoang mạc” diễn tả vùng hoang vu nơi dân Y-sơ-ra-ên đi qua, có sắc thái Kinh Thánh trang trọng nhưng vẫn dễ hiểu.
- source_word: δεῖ
  choice: phải
  rationale: Diễn đạt sự tất yếu, bao gồm sắc thái cần thiết theo ý định của Đức Chúa Trời, chứ không chỉ là một dự đoán.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: Con Người
  rationale: Giữ danh xưng quen thuộc của Chúa Giê-su và các âm hưởng thần học của danh xưng này mà không diễn giải thêm.
theological_decisions:
- issue: Nghĩa kép của động từ ὑψόω trong Giăng
  choice: Dùng “nâng lên” cho cả hai lần xuất hiện và chú thích thêm nghĩa “tôn cao”.
  alternative: Dịch là “treo lên” hoặc “tôn cao”.
  rationale: “Treo lên” sẽ thu hẹp câu chỉ còn việc đóng đinh, còn “tôn cao” sẽ làm mờ hình ảnh đưa lên cao về thể chất. “Nâng lên” bảo toàn sự liên hệ với con rắn và sự căng thẳng có chủ ý giữa cái chết trên thập tự giá với sự tôn cao.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Cấu trúc “như ... thế nào, thì ... như vậy” giữ rõ phép đối chiếu của nguyên văn; “nâng lên” tránh lối diễn giải quá hẹp và bảo toàn tính đa nghĩa.
