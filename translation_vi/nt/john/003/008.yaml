  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τὸ πνεῦμα ὅπου θέλει πνεῖ, καὶ τὴν φωνὴν αὐτοῦ ἀκούεις, ἀλλ’ οὐκ οἶδας πόθεν ἔρχεται καὶ ποῦ ὑπάγει· οὕτως ἐστὶν πᾶς ὁ γεγεννημένος ἐκ τοῦ πνεύματος.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/008.yaml
  text: The wind blows where it wishes[a], and you hear its sound, but you do not know where it comes from and where it goes[b]. So it is with everyone who has been born of the Spirit.
translation:
  language: vi
  text: Gió muốn thổi đâu thì thổi[a]; ông nghe tiếng gió[b], nhưng không biết gió từ đâu đến và đi đâu. Ai được sinh bởi Thánh Linh cũng như vậy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hy Lạp pneuma có thể nghĩa là “gió” hoặc “thần linh/Thánh Linh”. Đức Chúa Jêsus dùng cùng một từ ở cả hai phần của câu, tạo nên một lối chơi chữ mà tiếng Việt không thể diễn đạt trọn vẹn bằng một từ duy nhất.
    reason: lexical_alternative
  - marker: b
    text: Từ Hy Lạp được dịch là “tiếng” cũng có thể mang nghĩa là “giọng nói”; ở đây nó chỉ âm thanh của gió.
    reason: lexical_alternative
lexical_decisions:
- source_word: πνεῦμα (câu 8a)
  choice: gió
  rationale: Đi cùng động từ πνεῖ (“thổi”) và âm thanh có thể nghe được, từ này ở mệnh đề đầu chỉ “gió”. Cách dịch này diễn đạt hình ảnh tự nhiên trong tiếng Việt, còn chú thích bảo lưu lối chơi chữ với πνεῦμα ở cuối câu.
- source_word: ὅπου θέλει
  choice: muốn thổi đâu thì thổi
  rationale: θέλει diễn tả ý muốn; cấu trúc tiếng Việt này tự nhiên, giữ sắc thái nhân cách hóa và kết hợp trôi chảy với πνεῖ.
- source_word: πνεῖ
  choice: thổi
  rationale: Khi πνεῦμα mang nghĩa “gió”, “thổi” là nghĩa trực tiếp và tự nhiên của động từ.
- source_word: φωνήν
  choice: tiếng gió
  rationale: φωνή có thể là “tiếng”, “âm thanh” hoặc “giọng nói”. “Tiếng gió” phù hợp với hiện tượng có thể nghe thấy và giúp đại từ sở hữu của tiếng Hy Lạp được diễn đạt rõ ràng trong tiếng Việt.
- source_word: οὐκ οἶδας πόθεν ἔρχεται καὶ ποῦ ὑπάγει
  choice: không biết gió từ đâu đến và đi đâu
  rationale: Diễn đạt tự nhiên cặp hướng nguồn–đích πόθεν/ποῦ; lặp lại “gió” để tránh đại từ vô tri gượng gạo hoặc mơ hồ trong tiếng Việt.
- source_word: οὕτως ἐστὶν πᾶς ὁ γεγεννημένος
  choice: Ai được sinh ... cũng như vậy
  rationale: Cấu trúc khái quát, tự nhiên trong tiếng Việt. “Được sinh” phản ánh thể bị động, còn ngữ cảnh vẫn cho thấy tình trạng phát sinh từ một sự sinh ra đã xảy ra, phù hợp với phân từ hoàn thành γεγεννημένος.
- source_word: ἐκ τοῦ πνεύματος (câu 8b)
  choice: bởi Thánh Linh
  rationale: Trong ngữ cảnh về sự sinh ra mới, πνεῦμα chỉ Thánh Linh; ἐκ nêu nguồn gốc hay tác nhân của sự sinh ra. “Bởi Thánh Linh” vừa tự nhiên vừa giữ được quan hệ ấy.
theological_decisions:
- issue: Hai lần dùng πνεῦμα tạo nên nghĩa kép giữa gió và Thánh Linh
  choice: Dịch lần đầu là “gió” và lần cuối là “Thánh Linh”, kèm chú thích về cùng một từ Hy Lạp.
  alternative: Dịch cả hai lần bằng cùng một từ, hoặc dịch lần đầu là “thần linh/hơi thở”.
  rationale: Các từ “thổi” và “nghe tiếng” làm cho nghĩa “gió” nổi bật ở đầu câu, trong khi mạch văn về sinh ra bởi Thánh Linh xác định nghĩa ở cuối câu. Tiếng Việt không có một từ thông dụng duy nhất giữ được cả hai nghĩa, nên phân biệt trong chính văn và bảo lưu lối chơi chữ trong chú thích.
- issue: Phạm vi của phép so sánh οὕτως ἐστίν
  choice: 'Giữ câu khái quát: “Ai được sinh bởi Thánh Linh cũng như vậy.”'
  alternative: Giải nghĩa cụ thể rằng người ấy hành động khó đoán hoặc không ai biết nguồn gốc và đích đến của họ.
  rationale: Nguyên văn không nói rõ phép so sánh ứng vào khía cạnh nào của gió. Bản dịch không nên tự ý giải quyết sự mơ hồ hay thêm một cách giải thích thần học.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh” theo lời Đức Chúa Jêsus trực tiếp nói với Ni-cô-đem trong ngữ cảnh gần; dùng “Ai” để giữ nghĩa khái quát của πᾶς. “Thánh Linh” là cách gọi quen thuộc, phân biệt rõ với “gió” nhưng không xóa lối chơi chữ nhờ chú thích.
