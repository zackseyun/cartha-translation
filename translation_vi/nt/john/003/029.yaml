id: JHN.3.29
reference: John 3:29
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ ἔχων τὴν νύμφην νυμφίος ἐστίν· ὁ δὲ φίλος τοῦ νυμφίου ὁ ἑστηκὼς καὶ ἀκούων αὐτοῦ, χαρᾷ χαίρει διὰ τὴν φωνὴν τοῦ νυμφίου. αὕτη οὖν ἡ χαρὰ ἡ ἐμὴ πεπλήρωται.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/029.yaml
  text: The one who has the bride is the bridegroom[a]. But the friend of the bridegroom, who stands and hears him, rejoices greatly because of the bridegroom’s voice[c][b]. Therefore this joy of mine has been made complete.
translation:
  language: vi
  text: Ai có cô dâu thì là chàng rể. Còn người bạn của chàng rể[a], người đứng nghe chàng, thì hết sức vui mừng[b] vì tiếng nói của chàng rể. Vì vậy, niềm vui này của tôi đã trọn vẹn[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn là “người bạn của chàng rể”. Trong bối cảnh văn hóa, vai trò này có thể gần với vai trò của phù rể, nhưng tiếng Hy Lạp nói theo nghĩa đen là “người bạn của chàng rể”.
    reason: cultural_note
  - marker: b
    text: 'Dịch sát hơn: “vui mừng với niềm vui [lớn]”. Đây là lối diễn đạt Hy Lạp nhấn mạnh niềm vui.'
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “đã được đầy trọn”. Từ Hy Lạp có thể chỉ việc đạt đến sự đầy đủ hoặc trọn vẹn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἔχων τὴν νύμφην
  choice: Ai có cô dâu
  rationale: Diễn đạt tự nhiên phân từ hiện tại có mạo từ như một chủ thể khái quát, đồng thời giữ nguyên hình ảnh cô dâu trong ngữ cảnh hôn lễ.
- source_word: νυμφίος
  choice: chàng rể
  rationale: Đây là từ tiếng Việt thông dụng, rõ nghĩa và duy trì nhất quán hình ảnh hôn lễ của câu.
- source_word: φίλος τοῦ νυμφίου
  choice: người bạn của chàng rể
  rationale: Bám sát cách diễn đạt Hy Lạp, không đưa chức danh văn hóa cụ thể như “phù rể” vào chính văn.
- source_word: ὁ ἑστηκὼς καὶ ἀκούων αὐτοῦ
  choice: là người đứng đó và nghe chàng
  rationale: “Đứng đó” diễn đạt trạng thái đứng hiện thời của phân từ hoàn thành; “nghe chàng” giữ đối tượng là chính chàng rể mà không thêm “nói” vốn không có trực tiếp trong nguyên văn.
- source_word: χαρᾷ χαίρει
  choice: hết sức vui mừng
  rationale: Cụm danh từ đồng gốc đi với động từ có tác dụng nhấn mạnh; cách dịch này truyền đạt sắc thái cường điệu bằng tiếng Việt tự nhiên.
- source_word: διὰ τὴν φωνὴν τοῦ νυμφίου
  choice: vì tiếng của chàng rể
  rationale: Giữ quan hệ nguyên nhân của διά với đối cách và danh từ “tiếng” trong nguyên văn, không diễn giải thêm nội dung lời nói.
- source_word: αὕτη οὖν ἡ χαρὰ ἡ ἐμὴ
  choice: Vì vậy, niềm vui này của tôi
  rationale: “Vì vậy” giữ quan hệ suy ra của οὖν; “niềm vui này của tôi” bảo toàn cả đại từ chỉ định lẫn sắc thái nhấn mạnh sở hữu.
- source_word: πεπλήρωται
  choice: đã được trọn vẹn
  rationale: Thể hoàn thành bị động chỉ một trạng thái đầy trọn đã đạt tới và còn hiệu lực; cách dịch tránh giới hạn nghĩa vào sự ứng nghiệm lời tiên báo.
theological_decisions:
- issue: Hình ảnh hôn lễ và vị trí tự nhận của Giăng
  choice: Giữ hình ảnh chàng rể, cô dâu và người bạn của chàng rể mà không xác định cô dâu là ai trong chính văn.
  alternative: Giải thích cô dâu là hội thánh hoặc dân của Đức Chúa Trời, hay dịch người bạn là “phù rể”.
  rationale: Câu này không trực tiếp đồng nhất cô dâu, cũng không dùng một chức danh kỹ thuật tương đương hoàn toàn với “phù rể”; bản dịch vì thế bảo tồn không gian giải nghĩa và không đưa kết luận giáo hội học vào câu chữ.
- issue: Sự trọn vẹn của niềm vui
  choice: Dịch πεπλήρωται là “đã được trọn vẹn”.
  alternative: “đã được ứng nghiệm” hoặc “đã đầy tràn”.
  rationale: Cách chọn nhấn mạnh niềm vui đạt đến mức đầy đủ, phù hợp thể hoàn thành bị động, nhưng không áp đặt ý niệm ứng nghiệm tiên tri vốn không được nêu rõ ở đây.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “chàng rể”, “cô dâu” theo ngôn ngữ hôn lễ quen thuộc; giữ cấu trúc ẩn dụ và không giải thích căn tính của cô dâu trong chính văn.
