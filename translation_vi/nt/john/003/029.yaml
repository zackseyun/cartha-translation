revisions:
- from: Ai có cô dâu, người ấy chính là chàng rể. Còn người bạn của chàng rể[a], là người đứng đó và nghe chàng, thì hết sức vui mừng[b] vì tiếng của chàng rể. Vì vậy, niềm vui này của tôi đã được trọn vẹn[c].
  to: Ai có cô dâu thì là chàng rể. Còn người bạn của chàng rể[a], người đứng nghe chàng, thì hết sức vui mừng[b] vì tiếng nói của chàng rể. Vì vậy, niềm vui này của tôi đã trọn vẹn[c].
  rationale: Chỉnh sửa chỉ nhằm làm rõ φωνή là “tiếng nói,” làm câu Việt tự nhiên hơn, và sửa chú thích về thành ngữ nhấn mạnh. Bản sửa vẫn giữ nguyên ẩn dụ, tính khái quát của chủ ngữ đầu câu, và không diễn giải căn tính của cô dâu hay vai trò của người bạn.
  reviewer_model: gpt-5.6-terra
