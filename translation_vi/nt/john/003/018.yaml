id: JHN.3.18
reference: John 3:18
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ πιστεύων εἰς αὐτὸν οὐ κρίνεται· ὁ ⸀δὲ μὴ πιστεύων ἤδη κέκριται, ὅτι μὴ πεπίστευκεν εἰς τὸ ὄνομα τοῦ μονογενοῦς υἱοῦ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/018.yaml
  text: The one who believes in him is not judged[a]; but the one who does not believe has already been judged[b], because he has not believed in the name of the one and only Son of God.
translation:
  language: vi
  text: Ai tin vào Ngài thì không bị kết án[a]; còn ai không tin thì đã bị kết án rồi, vì người ấy không tin vào danh của Con Một[b] của Đức Chúa Trời.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “không bị xét xử” hoặc “không bị phán xét.” Động từ Hy Lạp κρίνω có thể mang nghĩa “xét xử, phán xét” hoặc, trong văn cảnh này, “kết án.”
    reason: lexical_alternative
  - marker: b
    text: 'Hay “Con duy nhất,” “Con độc nhất”; theo cách dịch truyền thống: “Con độc sinh.” Từ Hy Lạp μονογενής nhấn mạnh tính độc nhất, có một không hai.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ πιστεύων εἰς αὐτόν
  choice: Người tin vào Con ấy
  rationale: Phân từ hiện tại có mạo từ được dùng như danh từ, chỉ một hạng người nói chung. “Tin vào” diễn đạt tự nhiên sự tin cậy hướng đến một thân vị; “Con ấy” làm rõ đại từ αὐτόν theo văn cảnh gần.
- source_word: οὐ κρίνεται
  choice: không bị kết án
  rationale: κρίνω có nghĩa rộng là xét xử/phán xét, nhưng trong Giăng 3:17–19, sự đối lập với cứu và hậu quả của sự không tin khiến sắc thái phán quyết bất lợi nổi bật; “bị kết án” diễn đạt rõ lực tư pháp ấy.
- source_word: ὁ δὲ μὴ πιστεύων
  choice: nhưng người không tin
  rationale: δέ đánh dấu sự tương phản; phân từ có mạo từ tiếp tục chỉ một hạng người nói chung.
- source_word: ἤδη κέκριται
  choice: đã bị kết án rồi
  rationale: Thì hoàn thành diễn tả một phán quyết đã xảy ra với tình trạng vẫn còn hiệu lực; cấu trúc “đã… rồi” tự nhiên trong tiếng Việt và giữ được cả ý đã hoàn tất lẫn kết quả hiện tại.
- source_word: ὅτι μὴ πεπίστευκεν
  choice: vì người ấy không tin
  rationale: ὅτι nêu lý do. Thì hoàn thành của πεπίστευκεν chỉ tình trạng không tin vẫn tồn tại; tiếng Việt hiện đại thường không đánh dấu riêng thì hoàn thành, nên “không tin” truyền đạt trạng thái này tự nhiên hơn “đã không tin”.
- source_word: εἰς τὸ ὄνομα
  choice: vào danh
  rationale: Giữ nguyên thành ngữ của Giăng, trong đó “danh” bao hàm căn tính được bày tỏ và thẩm quyền của thân vị, thay vì diễn giải ngay trong chính văn.
- source_word: τοῦ μονογενοῦς υἱοῦ τοῦ θεοῦ
  choice: Con Một của Đức Chúa Trời
  rationale: μονογενής nhấn mạnh địa vị độc nhất, có một không hai của Con. “Con Một” là cách diễn đạt tiếng Việt ngắn gọn, trang trọng và quen thuộc, không nhất thiết hàm ý sinh sản theo nghĩa sinh học.
theological_decisions:
- issue: Cách dịch κρίνω trong câu này
  choice: Dùng “bị kết án” ở cả hai lần
  alternative: bị xét xử; bị phán xét
  rationale: Văn cảnh Giăng 3:17–19 đặt sự cứu rỗi đối lập với một phán quyết bất lợi gắn với sự không tin. “Bị kết án” chuyển tải sắc thái ấy, còn chú thích bảo lưu nghĩa rộng hơn của động từ Hy Lạp.
- issue: Cách dịch μονογενής
  choice: Con Một
  alternative: Con duy nhất; Con độc nhất; Con được sinh ra duy nhất
  rationale: Bản dịch giữ trọng tâm từ vựng là tính độc nhất của Con, không áp đặt cách diễn đạt tín điều về tiến trình sinh ra vào chính văn. Chú thích bảo lưu các khả năng dịch khác và cách dịch truyền thống.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “Đức Chúa Trời” nhất quán cho θεός và “Con Một” như một danh xưng tự nhiên. Cấu trúc hai vế tương phản được giữ sát nguyên văn; dấu chấm phẩy giúp câu rõ nhịp.
