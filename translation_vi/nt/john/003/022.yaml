source:
  edition: SBLGNT
  text: Μετὰ ταῦτα ἦλθεν ὁ Ἰησοῦς καὶ οἱ μαθηταὶ αὐτοῦ εἰς τὴν Ἰουδαίαν γῆν, καὶ ἐκεῖ διέτριβεν μετ’ αὐτῶν καὶ ἐβάπτιζεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/022.yaml
  text: After these things[a], Jesus and his disciples went into the land of Judea[c][b], and there he was spending time with them and baptizing.
translation:
  language: vi
  text: Sau những việc ấy, Giê-su và các môn đồ của Người đi vào miền đất Giu-đê[a]. Tại đó, Người lưu lại với họ[b] và làm báp-têm[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “vào vùng Giu-đê” hoặc đơn giản là “vào Giu-đê”.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “Người ở lại tại đó với họ” hoặc “Người dành một thời gian tại đó với họ”.'
    reason: lexical_alternative
  - marker: c
    text: Giăng 4:2 giải thích thêm rằng chính Giê-su không trực tiếp làm báp-têm; các môn đồ của Người làm việc ấy.
    reason: cross_reference
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: Sau những việc ấy
  rationale: Giữ được hình thức số nhiều của đại từ chỉ định và trình tự tường thuật, đồng thời vẫn tự nhiên trong tiếng Việt hiện đại.
- source_word: ἦλθεν
  choice: đi vào
  rationale: Dù động từ có thể dịch sát là “đến”, ngữ cảnh có đích đến rõ ràng nên “đi vào” diễn đạt tự nhiên hướng di chuyển từ bối cảnh trước đó đến Giu-đê.
- source_word: ὁ Ἰησοῦς καὶ οἱ μαθηταὶ αὐτοῦ
  choice: Chúa Giê-su và các môn đồ của Ngài
  rationale: Cách diễn đạt tự nhiên, trang trọng; “môn đồ” chỉ những người theo học và đi theo Chúa Giê-su.
- source_word: εἰς τὴν Ἰουδαίαν γῆν
  choice: vào miền đất Giu-đê
  rationale: γῆ ở đây có thể chỉ đất, miền hoặc vùng. “Miền đất Giu-đê” phản ánh từ ngữ nguồn mà không thu hẹp chắc chắn thành vùng nông thôn.
- source_word: διέτριβεν
  choice: ở lại
  rationale: Thì vị hoàn biểu thị hành động kéo dài; “ở lại” diễn đạt việc lưu lại một thời gian, tự nhiên hơn cách dịch máy móc “đang dành thời gian”.
- source_word: μετ’ αὐτῶν
  choice: với họ
  rationale: Đại từ chỉ các môn đồ vừa được nhắc đến.
- source_word: ἐβάπτιζεν
  choice: làm phép báp-têm
  rationale: Giữ thuật ngữ tôn giáo quen thuộc mà không quy định cách thức thực hiện; cấu trúc câu và ngữ cảnh thể hiện hành động đang tiếp diễn.
theological_decisions:
- issue: Chủ thể của hành động làm phép báp-têm khi đối chiếu Giăng 4:2
  choice: Giữ Chúa Giê-su làm chủ thể ngữ pháp trong câu này.
  alternative: Đổi chủ thể trong chính văn thành các môn đồ hoặc dùng lối diễn đạt vô nhân xưng.
  rationale: Động từ số ít trong câu nguồn tự nhiên tiếp tục lấy Chúa Giê-su làm chủ thể. Giăng 4:2 giải thích rằng chính Ngài không trực tiếp làm phép báp-têm, nhưng các môn đồ làm; không nên dùng lời giải thích về sau để sửa cấu trúc của câu này.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Lặp lại “Ngài” ở câu thứ hai để tránh chuỗi chủ ngữ mơ hồ. Dùng “Giu-đê” và “báp-têm” theo dạng phiên âm quen thuộc; không diễn giải βαπτίζω theo một phương thức nghi lễ riêng.
