revisions:
- from: Sau những việc ấy, Chúa Giê-su và các môn đồ của Ngài đi vào miền đất Giu-đê[a]. Tại đó, Ngài ở lại với họ[b] và làm phép báp-têm[c].
  to: Sau những việc ấy, Giê-su và các môn đồ của Người đi vào miền đất Giu-đê[a]. Tại đó, Người lưu lại với họ[b] và làm báp-têm[c].
  rationale: Bỏ tước hiệu không có trong câu nguồn để giữ tính trung thành văn bản; thay «Ngài» bằng «Người» để duy trì lối quy chiếu tôn kính, tự nhiên trong tiếng Việt. Đổi «ở lại» thành «lưu lại» để biểu đạt tốt hơn hành động kéo dài, và đổi «làm phép báp-têm» thành «làm báp-têm» để tránh thêm sắc thái nghi lễ. Các chú thích được giữ đúng neo và điều chỉnh nhất quán với chính văn.
