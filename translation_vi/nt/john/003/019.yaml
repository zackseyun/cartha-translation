id: JHN.3.19
reference: John 3:19
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: αὕτη δέ ἐστιν ἡ κρίσις ὅτι τὸ φῶς ἐλήλυθεν εἰς τὸν κόσμον καὶ ἠγάπησαν οἱ ἄνθρωποι μᾶλλον τὸ σκότος ἢ τὸ φῶς, ἦν γὰρ ⸂αὐτῶν πονηρὰ⸃ τὰ ἔργα.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/019.yaml
  text: 'And this is the judgment: that the light has come into the world[a], and people loved the darkness rather than the light, because their works were evil.'
translation:
  language: vi
  text: 'Và đây là sự phán xét: ánh sáng đã đến thế gian, nhưng người ta lại yêu bóng tối hơn ánh sáng, vì những việc họ làm là xấu xa.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κρίσις
  choice: sự phán xét
  rationale: Giữ nghĩa rộng là sự đánh giá và phán quyết, không thu hẹp sớm thành kết án.
- source_word: τὸ φῶς
  choice: ánh sáng
  rationale: Giữ nguyên ẩn dụ chủ đạo của Giăng, không thay bằng tên của Chúa Giê-su.
- source_word: ἐλήλυθεν
  choice: đã đến
  rationale: Diễn đạt tự nhiên trong tiếng Việt về sự kiện ánh sáng đến thế gian; ngữ cảnh vẫn cho thấy thực tại ấy đang có hiệu lực.
- source_word: κόσμον
  choice: thế gian
  rationale: Phù hợp cách dùng của Giăng, vừa chỉ thế giới con người vừa có thể gợi sắc thái nhân loại xa cách Đức Chúa Trời.
- source_word: ἠγάπησαν
  choice: yêu
  rationale: Giữ sức nặng đạo đức của động từ, thay vì làm nhẹ thành 'ưa thích'.
- source_word: οἱ ἄνθρωποι
  choice: người ta
  rationale: Chỉ con người nói chung, không riêng nam giới; cách nói tự nhiên và gọn trong tiếng Việt hiện đại.
- source_word: μᾶλλον ... ἢ
  choice: hơn
  rationale: Trong cấu trúc 'yêu ... hơn ...', cách này diễn đạt tự nhiên sự lựa chọn thiên về bóng tối.
- source_word: τὸ σκότος
  choice: bóng tối
  rationale: Bảo toàn sự tương phản biểu tượng với ánh sáng.
- source_word: πονηρὰ
  choice: gian ác
  rationale: Truyền đạt rõ phẩm chất xấu xa về đạo đức, mạnh hơn 'xấu' nhưng vẫn tự nhiên.
- source_word: τὰ ἔργα
  choice: những việc họ làm
  rationale: Tự nhiên hơn 'các công việc' trong tiếng Việt và diễn đạt đúng những hành vi của con người.
theological_decisions:
- issue: Đối tượng được gọi là 'ánh sáng'
  choice: Giữ nguyên ẩn dụ 'ánh sáng'.
  alternative: Viết hoa 'Ánh Sáng' như một danh hiệu hoặc thay trực tiếp bằng 'Chúa Giê-su'.
  rationale: Ngữ cảnh liên hệ ánh sáng với Con, nhưng câu Hy Lạp vẫn dùng ẩn dụ; giữ nguyên giúp bảo toàn chiều sâu thần học của Giăng mà không giải thích thay cho bản văn.
- issue: Sắc thái của κρίσις
  choice: Dịch là 'sự phán xét'.
  alternative: Dịch là 'sự kết án' hoặc 'bản án'.
  rationale: Câu này nêu nội dung hoặc cơ sở của sự phán xét; 'sự phán xét' giữ được phạm vi nghĩa rộng và sự căng thẳng của bản văn.
- issue: Phạm vi của οἱ ἄνθρωποι
  choice: Dịch là 'người ta', mang nghĩa con người nói chung.
  alternative: Dịch sát hình thức giống đực là 'những người nam'.
  rationale: Trong ngữ cảnh, danh từ này quy chiếu đến nhân loại nói chung chứ không chỉ nam giới.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng 'thế gian' để phù hợp sắc thái thuật ngữ của văn chương Giăng. Liên từ 'nhưng' làm rõ sự tương phản vốn được biểu đạt bởi καί trong mạch ý tiếng Hy Lạp; 'lại' nhấn mạnh nghịch lý con người yêu bóng tối dù ánh sáng đã đến.
