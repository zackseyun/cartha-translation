    rationale: Nguyên văn chỉ khẳng định các việc làm của họ có tính πονηρά (“xấu xa/gian ác”), không đánh dấu rõ ý “tất cả từng việc” như “đều” có thể gợi ra. Bỏ “đều” tránh tăng cường nghĩa không cần thiết.
