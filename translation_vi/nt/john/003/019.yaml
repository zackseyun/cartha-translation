  source_fidelity: 'Bản thảo bảo toàn đúng cấu trúc và các thuật ngữ trọng tâm: κρίσις là “sự phán xét,” “ánh sáng” và “bóng tối” được giữ như ẩn dụ, ἐλήλυθεν được phản ánh bằng “đã đến,” và οἱ ἄνθρωποι được diễn đạt bao quát bằng “người ta.” Tuy nhiên, từ “đều” thêm một ý phân phối tuyệt đối không được nêu rõ trong τὰ ἔργα ... πονηρά.'
