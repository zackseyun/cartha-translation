  terminology: “Sự phán xét,” “ánh sáng,” “thế gian,” và “bóng tối” là các lựa chọn thuật ngữ phù hợp văn mạch Giăng. “Xấu xa” diễn đạt πονηρά tự nhiên cho “việc làm,” mà không giảm nhẹ tính chất đạo đức.
