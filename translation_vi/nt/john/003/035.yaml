  yaml_path: translation/nt/john/003/035.yaml
  text: The Father loves the Son and has given all things into his hand[a].
translation:
  language: vi
  text: Cha yêu Con và đã giao mọi sự vào tay Con.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “trong tay Con.” Đây là thành ngữ chỉ việc trao quyền hành, quyền kiểm soát hoặc sự sở hữu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ πατὴρ
  choice: Cha
  rationale: Trong văn mạch Giăng, đây là danh xưng chỉ Đức Chúa Trời trong tương quan với Con. Tiếng Việt tự nhiên có thể dùng “Cha” mà không cần thêm từ giải thích.
- source_word: ἀγαπᾷ
  choice: yêu
  rationale: Thì hiện tại diễn tả một thực tại đang tiếp diễn; “yêu” là cách diễn đạt tự nhiên, trực tiếp trong tiếng Việt.
- source_word: τὸν υἱόν
  choice: Con
  rationale: Đây là danh xưng chỉ Chúa Giê-su trong tương quan với Cha; viết hoa để thể hiện chức năng danh xưng trong văn mạch.
- source_word: πάντα
  choice: mọi sự
  rationale: Giữ phạm vi bao quát của dạng trung tính số nhiều mà không giới hạn nội dung được giao.
- source_word: δέδωκεν
  choice: đã giao
  rationale: “Đã” diễn tả hành động hoàn tất; “giao” kết hợp tự nhiên với thành ngữ “vào tay” và hàm ý trao quyền hoặc trao quyền quản trị, đồng thời kết quả vẫn còn hiệu lực theo thì hoàn thành Hy Lạp.
- source_word: ἐν τῇ χειρὶ αὐτοῦ
  choice: vào tay Con
  rationale: Dịch theo thành ngữ tự nhiên của tiếng Việt khi đi với “giao”, truyền đạt ý phó thác quyền hoặc quyền sở hữu. Đại từ được thay bằng “Con” để tránh cách nói “tay Người” dễ mơ hồ trong tiếng Việt.
theological_decisions:
- issue: Mối quan hệ giữa Cha và Con
  choice: Giữ nguyên các danh xưng quan hệ “Cha” và “Con”.
  alternative: Dùng danh từ chung “người cha” và “người con”, hoặc thêm các thuật ngữ tín lý ngoài câu.
  rationale: Văn mạch dùng các từ này như những danh xưng cá nhân và mang tính Kitô học; bản dịch giữ nguyên quan hệ được nêu mà không mở rộng thành công thức tín lý.
- issue: Phạm vi và hiệu lực của điều được giao cho Con
  choice: Dịch πάντα δέδωκεν là “đã giao mọi sự”.
  alternative: “đã cho mọi vật” hoặc diễn giải rõ thành “đã trao mọi quyền hành”.
  rationale: “Mọi sự” giữ phạm vi rộng và chưa xác định của πάντα; “đã giao” phản ánh hành động hoàn tất có kết quả còn hiệu lực, nhưng không thu hẹp “mọi sự” chỉ còn quyền hành.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc ngắn gọn bám sát câu Hy Lạp; dùng “giao ... vào tay” vì tự nhiên trong tiếng Việt, đồng thời chú thích hình thức nguyên văn để bảo tồn sắc thái thành ngữ.
