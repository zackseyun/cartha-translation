  text: ἀπεκρίθη Ἰωάννης καὶ εἶπεν· Οὐ δύναται ἄνθρωπος λαμβάνειν ⸂οὐδὲ ἓν⸃ ἐὰν μὴ ᾖ δεδομένον αὐτῷ ἐκ τοῦ οὐρανοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/027.yaml
  text: John answered and said[a], “A man is not able to receive even one thing unless it has been given to him from heaven.”
translation:
  language: vi
  text: 'Giăng đáp rằng: “Một người không thể nhận được dù chỉ một điều, trừ khi điều đó đã được ban cho người ấy từ trời.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη Ἰωάννης καὶ εἶπεν
  choice: Giăng đáp rằng
  rationale: Diễn đạt tự nhiên công thức dẫn lời Hy Lạp “Giăng trả lời và nói”; tiếng Việt không cần giữ hai động từ gần như đồng nghĩa, nhưng vẫn bảo toàn ý đáp lời.
- source_word: Οὐ δύναται
  choice: không thể
  rationale: Cách nói tự nhiên, trực tiếp trong tiếng Việt, giữ nguyên ý về khả năng hay sự bất khả.
- source_word: ἄνθρωπος
  choice: một người
  rationale: Trong câu này danh từ số ít có nghĩa đại diện, chỉ con người nói chung chứ không giới hạn ở nam giới; “một người” truyền đạt đúng phạm vi ấy trong tiếng Việt hiện đại.
- source_word: λαμβάνειν οὐδὲ ἓν
  choice: nhận được dù chỉ một điều
  rationale: “Nhận được” phù hợp với ý được ban ở vế sau; “dù chỉ một điều” giữ sức nhấn mạnh của οὐδὲ ἓν.
- source_word: ἐὰν μὴ ᾖ δεδομένον αὐτῷ
  choice: nếu điều ấy không được ban cho người
  rationale: Giữ cấu trúc điều kiện ngoại trừ và sắc thái thụ động của việc được ban; “điều ấy” làm rõ chủ thể ngữ pháp hàm ẩn trong tiếng Hy Lạp.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: từ trời
  rationale: Giữ hình ảnh và nguồn gốc thần thượng được diễn đạt bằng “trời”, thay vì giải nghĩa trực tiếp thành “từ Đức Chúa Trời”.
theological_decisions:
- issue: Phạm vi của điều được ban từ trời
  choice: 'Giữ lời tuyên bố ở dạng rộng: một người chỉ có thể nhận điều đã được ban từ trời.'
  alternative: Thu hẹp câu chỉ vào chức vụ, thẩm quyền thuộc linh trong ngữ cảnh, hoặc mở rộng thành một khẳng định tất định luận bao quát.
  rationale: Ngữ cảnh trực tiếp nói về vai trò của Giăng và sự nổi bật của Chúa Giê-su, nhưng cách diễn đạt của câu mang tính nguyên tắc. Bản dịch không thu hẹp cũng không mở rộng thành một hệ thống thần học.
translation_notes:
  register: Văn phong trang trọng, sáng rõ và tự nhiên trong tiếng Việt hiện đại. Dùng “Giăng” theo quy ước tên Kinh Thánh tiếng Việt phổ biến; tránh cấu trúc cứng “đáp và nói”. Không cần chú thích vì “một người” đã biểu đạt tự nhiên nghĩa đại diện của ἄνθρωπος.
