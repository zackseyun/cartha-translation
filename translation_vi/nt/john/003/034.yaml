  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὃν γὰρ ἀπέστειλεν ὁ θεὸς τὰ ῥήματα τοῦ θεοῦ λαλεῖ, οὐ γὰρ ἐκ μέτρου ⸀δίδωσιν τὸ πνεῦμα.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/034.yaml
  text: For the one whom God sent speaks the words of God[a], for he gives the Spirit without measure.
translation:
  language: vi
  text: Vì Đấng mà Đức Chúa Trời sai đến nói những lời của Đức Chúa Trời, bởi Ngài ban Thánh Linh không giới hạn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '“Ngài” cũng có thể được hiểu là Đấng mà Đức Chúa Trời sai đến: “vì Đấng ấy ban Thánh Linh không giới hạn.”'
    reason: Nguyên văn Hy Lạp không nêu rõ chủ ngữ của động từ “ban”; có thể hiểu là Đức Chúa Trời hoặc Đấng Ngài sai đến.
lexical_decisions:
- source_word: ὃν
  choice: Đấng ... sai đến
  rationale: Đại từ quan hệ đối cách giống đực số ít được diễn đạt theo lối danh từ hóa tự nhiên trong tiếng Việt, chỉ người được Đức Chúa Trời sai đến.
- source_word: ἀπέστειλεν
  choice: sai đến
  rationale: Thì aorist được chuyển bằng động từ quá khứ theo ngữ cảnh; “sai đến” giữ được mô-típ sai phái trong sách Giăng và tự nhiên hơn chỉ nói “sai” ở đây.
- source_word: τὰ ῥήματα τοῦ θεοῦ
  choice: những lời của Đức Chúa Trời
  rationale: Giữ số nhiều của ῥήματα và quan hệ sở hữu trong nguyên văn, đồng thời dùng cách diễn đạt rõ ràng, trang trọng.
- source_word: λαλεῖ
  choice: nói
  rationale: Diễn đạt trực tiếp hành động nói; thì hiện tại của Hy Lạp được giữ bằng dạng hiện tại không đánh dấu trong tiếng Việt.
- source_word: ἐκ μέτρου
  choice: không giới hạn
  rationale: Khi đi với οὐ, thành ngữ này nói đến việc ban không theo một mức đo hay giới hạn. Cách dịch này tự nhiên trong tiếng Việt hiện đại, dù hình ảnh “đo lường” không được thể hiện nguyên dạng.
- source_word: δίδωσιν
  choice: ban
  rationale: “Ban” phù hợp với văn cảnh Đức Chúa Trời ban Thánh Linh, giữ sắc thái trang trọng mà vẫn quen thuộc.
- source_word: τὸ πνεῦμα
  choice: Thánh Linh
  rationale: Trong văn cảnh Giăng, danh từ này tự nhiên nhất được hiểu là Thánh Linh. Tiếng Việt cần gọi rõ danh xưng thay vì chỉ dùng “linh” hoặc “thần” vốn dễ gây mơ hồ ngoài ý định.
theological_decisions:
- issue: Chủ ngữ hàm ẩn của δίδωσιν (“ban”)
  choice: Dùng “Ngài” với cách hiểu chính là Đức Chúa Trời ban Thánh Linh không giới hạn.
  alternative: “Ngài” có thể chỉ Đấng được Đức Chúa Trời sai đến, nghĩa là chính Đấng ấy ban Thánh Linh không giới hạn.
  rationale: Chủ ngữ gần nhất được nêu rõ trong mạch câu là Đức Chúa Trời, và cách hiểu Đức Chúa Trời ban Thánh Linh cho Đấng Ngài sai đến giải thích vì sao Đấng ấy nói lời Đức Chúa Trời. Tuy nhiên, nguyên văn không nêu chủ ngữ của δίδωσιν, nên giữ cách hiểu kia trong chú thích thay vì quyết đoán.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Đấng” thể hiện lực danh từ hóa của đại từ quan hệ; “Thánh Linh” theo cách dùng Tin Lành quen thuộc nhưng cũng is explicit referent. The pronoun “Ngài” preserves some source ambiguity, clarified by footnote.
