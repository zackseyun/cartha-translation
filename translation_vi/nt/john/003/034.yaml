  source_fidelity: 'Bản nháp phản ánh đúng các yếu tố chính của nguyên văn: người được Đức Chúa Trời sai, nói những lời của Đức Chúa Trời, và việc ban Thánh Linh không theo mức độ. Tuy nhiên, cụm “Đấng Đức Chúa Trời sai đến” thiếu từ nối cần thiết để diễn đạt đại từ quan hệ ὃν; cần là “Đấng mà Đức Chúa Trời sai đến.” Chủ ngữ hàm ẩn của δίδωσιν được giữ không xác quyết trong bản văn và cần tiếp tục được chú thích.'
