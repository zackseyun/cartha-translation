  source_fidelity: 'Bản dịch truyền đạt đúng các yếu tố chính: Ni-cô-đem là chủ ngữ, câu nói hướng đến đại từ quy chiếu Đức Giê-su, và câu hỏi về khả năng/việc những điều vừa nói có thể xảy ra. Tuy nhiên, “những điều này” phản ánh sát hơn ταῦτα (“những điều này”) trong ngữ cảnh gần. Cụm động từ Hy Lạp ἀπεκρίθη ... καὶ εἶπεν là lối tường thuật có tính công thức; không cần sao chép thành hai động từ nặng nề trong tiếng Việt.'
  naturalness: “Ni-cô-đem đáp lời và nói với Người” hơi gượng và trùng chức năng trong văn xuôi tiếng Việt hiện đại. “Ni-cô-đem đáp lại Người” là cách kể tự nhiên, trang trọng, vẫn biểu đạt rõ rằng ông đáp lời Đức Giê-su. Câu hỏi giữ được giọng điệu tự nhiên và không giải thích thêm điều được hỏi.
  terminology: “Ni-cô-đem” là dạng tên riêng quen thuộc; “Người” phù hợp quy ước kính trọng trong bản dịch Kinh Thánh tiếng Việt và vẫn giữ đại từ, không thay bằng tên riêng. “có thể xảy ra được” chuyển tải tốt δύναται γενέσθαι, không áp đặt cách hiểu thần học.
