  yaml_path: translation/nt/john/003/009.yaml
  text: Nicodemus answered and said to him[a], “How can these things happen?”
translation:
  language: vi
  text: 'Ni-cô-đem đáp lại Người: “Làm sao những điều này có thể xảy ra được?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: đáp lời
  rationale: Động từ ἀποκρίνομαι trong văn đối thoại thường có nghĩa là trả lời; “đáp lời” vừa tự nhiên vừa giữ sắc thái tường thuật trang trọng.
- source_word: Νικόδημος
  choice: Ni-cô-đem
  rationale: Dùng dạng phiên âm tên riêng quen thuộc trong tiếng Việt.
- source_word: εἶπεν αὐτῷ
  choice: nói với Người
  rationale: Giữ đại từ của nguyên văn thay vì thay bằng tên Giê-su; viết hoa “Người” để quy chiếu kính trọng, nhưng không thêm nội dung ngoài văn bản.
- source_word: Πῶς
  choice: Làm sao
  rationale: Cách hỏi tự nhiên trong tiếng Việt về khả năng hoặc phương thức.
- source_word: δύναται
  choice: có thể
  rationale: Diễn đạt trực tiếp ý nghĩa khả năng của δύναμαι.
- source_word: ταῦτα
  choice: những điều ấy
  rationale: Giữ dạng số nhiều và sự quy chiếu về những điều Đức Giê-su vừa nói.
- source_word: γενέσθαι
  choice: xảy ra được
  rationale: γίνομαι ở đây chỉ việc những điều được nói đến xảy đến hoặc trở thành hiện thực; “xảy ra” tự nhiên và vẫn giữ tính biến cố của động từ.
theological_decisions:
- issue: Câu hỏi của Ni-cô-đem về những thực tại Đức Giê-su vừa trình bày
  choice: Làm sao những điều ấy có thể xảy ra được?
  alternative: Làm sao những điều ấy có thể thành được?
  rationale: “Xảy ra” truyền đạt nghĩa sự việc diễn ra của γενέσθαι mà không giải thích thêm bản chất của sự sinh lại hay giải quyết sự huyền nhiệm trong ngữ cảnh.
translation_notes:
  register: Văn phong hiện đại, dễ hiểu và trang trọng. Giữ cấu trúc kể chuyện “đáp lời và nói” tương đối sát nguyên văn, dù tiếng Việt thông thường có thể rút gọn thành “đáp”. Không cần chú thích vì phương án thay thế không tạo khác biệt nội dung đáng kể trong tiếng Việt.
