id: JHN.3.26
reference: John 3:26
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἦλθον πρὸς τὸν Ἰωάννην καὶ εἶπαν αὐτῷ· Ῥαββί, ὃς ἦν μετὰ σοῦ πέραν τοῦ Ἰορδάνου, ᾧ σὺ μεμαρτύρηκας, ἴδε οὗτος βαπτίζει καὶ πάντες ἔρχονται πρὸς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/026.yaml
  text: And they came to John and said to him[a], “Rabbi, the one who was with you beyond the Jordan, to whom you have borne witness—look, he is baptizing[b], and everyone is going to him.”
translation:
  language: vi
  text: 'Họ đến gặp Giăng và nói với ông: “Ra-bi, người đã ở với thầy bên kia sông Giô-đanh, người mà thầy đã làm chứng về người ấy[a]—kìa, người ấy đang làm báp-têm[b], và mọi người đều đến với người ấy.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “người mà thầy đã làm chứng cho.” Cấu trúc tặng cách trong tiếng Hy Lạp cho phép hiểu theo cả hai cách.'
    reason: lexical_alternative
  - marker: b
    text: Tiếng Hy Lạp dùng đại từ chỉ định οὗτος, sát nghĩa là “người này”; cách nói này có thể biểu lộ sự nhấn mạnh có chủ ý của những người đang nói.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθον πρὸς τὸν Ἰωάννην
  choice: Họ đến gặp Giăng
  rationale: Diễn đạt tự nhiên hành động đến chỗ Giăng; chủ ngữ số nhiều được khôi phục từ hình thái động từ Hy Lạp.
- source_word: Ῥαββί
  choice: Ra-bi
  rationale: Giữ danh xưng Do Thái bằng lối phiên âm quen thuộc, thay vì chuyển thẳng thành “Thầy,” đồng thời lời nói sau đó vẫn dùng đại từ xưng hô tự nhiên.
- source_word: ὃς ἦν μετὰ σοῦ πέραν τοῦ Ἰορδάνου
  choice: người đã ở với thầy bên kia sông Giô-đanh
  rationale: Giữ quan hệ từ và địa danh, đồng thời dùng cú pháp tiếng Việt hiện đại, rõ ràng.
- source_word: ᾧ σὺ μεμαρτύρηκας
  choice: người mà thầy đã làm chứng về
  rationale: “Làm chứng về” tự nhiên trong tiếng Việt và giữ mô-típ làm chứng quan trọng trong sách Giăng; chú thích nêu cách hiểu khác của cấu trúc tặng cách.
- source_word: ἴδε οὗτος
  choice: kìa, người ấy
  rationale: “Kìa” giữ chức năng thu hút sự chú ý của ἴδε; “người ấy” tự nhiên hơn “người này” trong tiếng Việt nhưng vẫn phản ánh đại từ chỉ định οὗτος.
- source_word: βαπτίζει
  choice: đang làm báp-têm
  rationale: Thể tiếp diễn biểu thị hoạt động đang diễn ra; “báp-têm” giữ thuật ngữ gắn trực tiếp với từ Hy Lạp mà không giải thích thêm phương thức.
- source_word: πάντες ἔρχονται πρὸς αὐτόν
  choice: mọi người đều đến với người ấy
  rationale: Giữ sắc thái khái quát có tính cường điệu của πάντες và hướng chuyển động về phía người được nói đến.
theological_decisions:
- issue: Ngôn ngữ về việc làm chứng trong sách Giăng
  choice: làm chứng về
  alternative: làm chứng cho
  rationale: Cách chọn giữ thuật ngữ “làm chứng” và xác định đối tượng của lời chứng theo lối nói tự nhiên; chú thích bảo lưu khả năng khác của tặng cách Hy Lạp.
- issue: Cách gọi hành động βαπτίζει
  choice: làm báp-têm
  alternative: làm phép rửa
  rationale: Phiên âm giúp tránh áp đặt cách diễn đạt riêng của một truyền thống giáo hội và không tự ý xác định phương thức của nghi thức.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Ra-bi,” “Giăng,” “Giô-đanh” và “báp-têm” theo lối phiên âm Kinh Thánh tiếng Việt quen thuộc; tránh từ cổ và không làm phẳng sắc thái chỉ trỏ trong lời phàn nàn.
