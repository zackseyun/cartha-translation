  to: 'Họ đến gặp Giăng và nói với ông: “Ra-bi, người đã ở với thầy bên kia sông Giô-đanh, người mà thầy đã làm chứng về người ấy[a]—kìa, người ấy đang làm báp-têm[b], và mọi người đều đến với người ấy.”'
  rationale: 'Chỉ sửa một điểm cú pháp tiếng Việt: đưa đối tượng của giới từ “về” vào sau giới từ. Không thay đổi nghĩa, sắc thái làm chứng, cách gọi, hay các neo chú thích.'
