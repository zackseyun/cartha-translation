id: JHN.3.13
reference: John 3:13
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ οὐδεὶς ἀναβέβηκεν εἰς τὸν οὐρανὸν εἰ μὴ ὁ ἐκ τοῦ οὐρανοῦ καταβάς, ὁ υἱὸς τοῦ ⸀ἀνθρώπου.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/013.yaml
  text: And no one has ascended into heaven except the one who descended from heaven—the Son of Man[a][b].
translation:
  language: vi
  text: Không ai từng lên trời, ngoại trừ Đấng từ trời xuống—tức là Con Người[a][b].[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “Đấng từ trời mà đến.”'
    reason: lexical_alternative
  - marker: b
    text: “Con Người” là cách Chúa Giê-su thường dùng để tự xưng và gợi lại Đa-ni-ên 7:13–14.
    reason: cross_reference
  - marker: c
    text: 'Một số thủ bản thêm: “Đấng ở trên trời.”'
    reason: textual_variant
lexical_decisions:
- source_word: οὐδεὶς
  choice: không ai
  rationale: Đại từ phủ định này chỉ tất cả mọi người; “không ai” là cách diễn đạt tự nhiên, rõ nghĩa và không giới hạn phạm vi theo giới tính.
- source_word: ἀναβέβηκεν
  choice: từng lên
  rationale: Thì hoàn thành Hy Lạp diễn tả hành động đã xảy ra và vẫn có ý nghĩa ở hiện tại. Trong cấu trúc phủ định, “không ai từng lên” truyền đạt tự nhiên ý một hành động chưa hề xảy ra đối với bất cứ ai, đồng thời giữ đối lập lên/xuống.
- source_word: εἰς τὸν οὐρανόν
  choice: lên trời
  rationale: Trong tiếng Việt, động từ “lên” đã diễn tả hướng chuyển động vào cõi trời; cách nói này tự nhiên hơn “lên vào trời” mà vẫn giữ được ý của εἰς.
- source_word: εἰ μὴ
  choice: ngoại trừ
  rationale: Trong cấu trúc loại trừ sau mệnh đề phủ định, “ngoại trừ” nêu rõ trường hợp duy nhất được loại ra.
- source_word: ὁ ἐκ τοῦ οὐρανοῦ καταβάς
  choice: Đấng từ trời xuống
  rationale: Cụm phân từ có mạo từ được dùng như danh từ. “Đấng” phù hợp với nhân vật đã được xác định và văn phong trang trọng; “từ trời xuống” giữ nguyên nguồn gốc và sự đối lập không gian với “lên trời” mà không diễn giải thêm.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Con Người
  rationale: Giữ cách xưng đặc trưng của Chúa Giê-su trong các sách Phúc Âm và âm hưởng của Đa-ni-ên 7:13–14. Viết hoa cho thấy đây là danh xưng trong ngữ cảnh, nhưng không giải nghĩa thay cho bản văn.
theological_decisions:
- issue: Sức nặng Cơ Đốc học của cụm “Con Người”
  choice: Dịch bằng danh xưng quen thuộc “Con Người”, không diễn giải thành một cách gọi thuần túy chung về con người.
  alternative: Đấng Nhân Tử; Con của loài người; Người Phàm
  rationale: Cụm từ vừa mang sắc thái thành ngữ vừa gợi đến hình tượng khải huyền trong Đa-ni-ên 7. Giữ “Con Người” bảo tồn sự căng thẳng và liên hệ liên văn bản mà không áp đặt một cách giải thích thần học riêng.
- issue: Ý nghĩa thời–thể của ngôn ngữ lên trời và từ trời xuống
  choice: Dùng “không ai từng lên” và “Đấng từ trời xuống”.
  alternative: không ai đã lên… Đấng đã từ trời xuống
  rationale: Cách dịch này giữ lời khẳng định về nguồn gốc từ trời và địa vị độc nhất của Con Người, đồng thời diễn đạt thì hoàn thành một cách tự nhiên trong tiếng Việt mà không mở rộng giáo lý ngoài câu Hy Lạp.
- issue: Dị bản về cụm “Đấng ở trên trời”
  choice: Không đưa cụm này vào chính văn, nhưng ghi nhận trong chú thích.
  alternative: Thêm “Đấng ở trên trời” vào chính văn
  rationale: SBLGNT không nhận cụm ὁ ὢν ἐν τῷ οὐρανῷ vào bản văn; cụm này có trong một số chứng cứ thủ bản nhưng không thuộc văn bản nguồn được chọn. Chú thích bảo tồn thông tin văn bản học mà không trộn dị bản vào chính văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Không ai từng lên trời” tự nhiên hơn lối dịch sát chữ nhưng gượng “không ai đã lên vào trời”; dấu gạch ngang làm rõ rằng “Con Người” đồng vị với “Đấng từ trời xuống”. Các danh xưng “Đấng” và “Con Người” được viết hoa theo quy ước tiếng Việt dành cho danh xưng xác định trong ngữ cảnh Kinh Thánh.
