  text: οὔπω γὰρ ἦν βεβλημένος εἰς τὴν φυλακὴν ⸀ὁ Ἰωάννης.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/024.yaml
  text: For John had not yet been thrown into prison[a].
translation:
  language: vi
  text: Vì lúc ấy Giăng vẫn chưa bị tống vào tù[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tức là Giăng Báp-tít.
    reason: cross_reference
lexical_decisions:
- source_word: οὔπω
  choice: lúc ấy… vẫn chưa
  rationale: Diễn đạt tự nhiên rằng cho đến thời điểm đang được thuật lại, sự việc vẫn chưa xảy ra.
- source_word: γὰρ
  choice: Vì
  rationale: Giữ chức năng giải thích bối cảnh của γάρ trong mạch văn.
- source_word: ἦν βεβλημένος
  choice: bị tống
  rationale: Kết hợp với οὔπω để diễn tả hành động thụ động chưa xảy ra trước thời điểm quy chiếu; “tống vào tù” vừa tự nhiên vừa giữ được sắc thái mạnh của βάλλω.
- source_word: εἰς τὴν φυλακήν
  choice: vào tù
  rationale: Chỉ việc bị giam cầm và giữ hướng nghĩa của εἰς; đây là cách nói thông dụng trong tiếng Việt.
- source_word: ὁ Ἰωάννης
  choice: Giăng
  rationale: Nguyên văn chỉ nêu tên Giăng; không thêm danh hiệu vào chính văn. Dùng dạng tên quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
theological_decisions:
- issue: Danh tính của ὁ Ἰωάννης
  choice: Giăng
  alternative: Giăng Báp-tít
  rationale: Theo ngữ cảnh, đây là Giăng Báp-tít, nhưng câu Hy Lạp chỉ ghi tên Giăng; vì vậy giữ tên đơn trong chính văn và nêu danh tính ở chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Vẫn chưa” làm rõ trạng thái kéo dài đến thời điểm kể chuyện; “bị tống vào tù” tự nhiên và truyền đạt sắc thái mạnh của động từ Hy Lạp.
