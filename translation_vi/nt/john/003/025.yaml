  rationale: Sửa từ nối để không áp đặt quan hệ nhân quả mạnh hơn mức văn cảnh đòi hỏi; dùng thuật ngữ hiện đại hơn cho μαθηταί; và chỉnh nhẹ chú thích để các phương án song song với cách diễn đạt chính văn. Các yếu tố ngữ nghĩa khác, nhất là số ít “một người Do Thái” và tính không xác định hoàn toàn của καθαρισμός, được giữ nguyên.
