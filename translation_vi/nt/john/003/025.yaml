source:
  edition: SBLGNT
  text: Ἐγένετο οὖν ζήτησις ἐκ τῶν μαθητῶν Ἰωάννου μετὰ Ἰουδαίου περὶ καθαρισμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/025.yaml
  text: Then a dispute arose between John's disciples and a Jew about purification[a].
translation:
  language: vi
  text: Bấy giờ, một cuộc tranh luận đã nảy sinh giữa các môn đệ của Giăng và một người Do Thái về sự thanh tẩy[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “sự làm sạch” hoặc “nghi thức thanh tẩy”. Từ Hy Lạp này có thể chỉ sự làm sạch nói chung, nhưng trong ngữ cảnh này có lẽ mang sắc thái nghi lễ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο
  choice: đã nảy sinh
  rationale: Động từ giới thiệu sự xuất hiện của một sự việc; cách diễn đạt này tự nhiên trong tiếng Việt khi nói một cuộc tranh luận bắt đầu.
- source_word: οὖν
  choice: Vì vậy
  rationale: Liên từ nối sự việc này với bối cảnh trước đó và có thể hàm ý hệ quả; “Vì vậy” giữ được sắc thái suy luận mà không giải thích thêm quan hệ logic.
- source_word: ζήτησις
  choice: một cuộc tranh luận
  rationale: Danh từ có thể chỉ sự bàn luận, tranh luận hoặc tranh chấp; ngữ cảnh cho thấy một cuộc trao đổi có bất đồng, nên “tranh luận” phù hợp mà không quá gay gắt như “tranh cãi”.
- source_word: ἐκ τῶν μαθητῶν Ἰωάννου μετὰ Ἰουδαίου
  choice: giữa các môn đồ của Giăng và một người Do Thái
  rationale: Dù ἐκ theo nghĩa đen là “từ/phía”, kết cấu với ζήτησις và μετά chỉ hai bên tham gia. “Giữa… và…” là cách diễn đạt tự nhiên, đồng thời giữ số ít của Ἰουδαίου.
- source_word: περὶ καθαρισμοῦ
  choice: về việc thanh tẩy
  rationale: καθαρισμός chỉ sự làm sạch hoặc thanh tẩy, thường mang sắc thái nghi lễ trong ngữ cảnh Do Thái. “Việc thanh tẩy” giữ được cả nghĩa rộng lẫn sắc thái tôn giáo có khả năng hiện diện.
theological_decisions:
- issue: Có nên diễn đạt καθαρισμός một cách minh nhiên là nghi thức thanh tẩy hay không
  choice: việc thanh tẩy
  alternative: việc làm sạch; nghi thức thanh tẩy
  rationale: Ngữ cảnh gần cho thấy sắc thái nghi lễ, nhưng chính câu này không xác định rõ phạm vi của vấn đề. “Việc thanh tẩy” giữ được hàm ý tôn giáo mà không bổ sung từ “nghi thức” vào chính văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “môn đồ” và tên “Giăng” theo lối diễn đạt Kinh Thánh tiếng Việt quen thuộc; câu giữ kết cấu kể chuyện gọn và không làm rõ quá mức tính chất nghi lễ của cuộc tranh luận.
