  terminology: “Giăng,” “người Do Thái,” và “sự thanh tẩy” đều phù hợp. “Sự thanh tẩy” giữ được độ rộng nghĩa của καθαρισμός và không khẳng định quá mức rằng đây nhất thiết là một nghi thức cụ thể. Chú thích nêu lựa chọn “nghi thức thanh tẩy” như một khả năng ngữ cảnh, không đưa nó vào chính văn.
  issues:
