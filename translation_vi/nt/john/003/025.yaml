  - severity: low
    issue: “Môn đồ” có sắc thái truyền thống hơn là hiện đại.
    rationale: “Môn đệ” là từ dùng tự nhiên trong tiếng Việt hiện đại và truyền đạt chính xác μαθηταί, không thay đổi nghĩa.
