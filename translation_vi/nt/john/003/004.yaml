id: JHN.3.4
reference: John 3:4
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: λέγει πρὸς αὐτὸν ⸀ὁ Νικόδημος· Πῶς δύναται ἄνθρωπος γεννηθῆναι γέρων ὤν; μὴ δύναται εἰς τὴν κοιλίαν τῆς μητρὸς αὐτοῦ δεύτερον εἰσελθεῖν καὶ γεννηθῆναι;
base_translation:
  language: en
  yaml_path: translation/nt/john/003/004.yaml
  text: Nicodemus said to him[a], “How can a man be born when he is old? He cannot enter his mother’s womb a second time and be born[b], can he?”
translation:
  language: vi
  text: 'Ni-cô-đem nói với Ngài: “Làm sao một người đã già có thể được sinh ra? Chẳng lẽ người ấy có thể vào lòng mẹ mình lần thứ hai rồi được sinh ra sao?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει πρὸς αὐτὸν
  choice: nói với Ngài
  rationale: Động từ hiện tại là lối hiện tại lịch sử thường gặp trong lời kể của Giăng; tiếng Việt tự nhiên có thể dùng “nói”. Đại từ “Ngài” xác định người được nói đến là Chúa Giê-su theo ngữ cảnh.
- source_word: ἄνθρωπος
  choice: một người
  rationale: Danh từ số ít giống đực được dùng theo nghĩa đại diện, chỉ một con người nói chung. “Một người” truyền đạt tự nhiên phạm vi khái quát ấy trong tiếng Việt mà không giới hạn vào nam giới.
- source_word: γεννηθῆναι
  choice: được sinh ra
  rationale: Động từ nguyên mẫu bị động ở đây nói về việc chào đời; không tự thêm ý “lại” vốn không nằm trong chính động từ này.
- source_word: γέρων ὤν
  choice: đã già
  rationale: 'Diễn đạt tự nhiên tình trạng làm hoàn cảnh cho câu hỏi: người ấy đang ở tuổi già.'
- source_word: μὴ δύναται
  choice: Chẳng lẽ ... có thể ... sao?
  rationale: μή mở đầu câu hỏi dự kiến câu trả lời phủ định. Cấu trúc “Chẳng lẽ ... sao?” vừa tự nhiên vừa giữ sự sửng sốt và hoài nghi của Ni-cô-đem.
- source_word: κοιλίαν τῆς μητρὸς αὐτοῦ
  choice: dạ mẹ
  rationale: Trong ngữ cảnh này, κοιλία chỉ nơi người con được cưu mang. “Dạ mẹ” là cách nói trang trọng, dễ hiểu và ít mang sắc thái y khoa hơn “tử cung”.
- source_word: δεύτερον
  choice: lần thứ hai
  rationale: Từ này chỉ rõ một lần thứ hai, qua đó giữ nguyên cách Ni-cô-đem hiểu lời Chúa Giê-su theo nghĩa thể lý.
- source_word: εἰσελθεῖν καὶ γεννηθῆναι
  choice: vào ... rồi được sinh ra
  rationale: Giữ cả hai động tác riêng biệt và dùng “rồi” để diễn đạt trình tự logic tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Cách dịch ἄνθρωπος giống đực nhưng có nghĩa khái quát
  choice: một người
  alternative: một người đàn ông
  rationale: Trong tiếng Hy Lạp, từ này mang hình thức giống đực số ít nhưng ở đây có nghĩa đại diện cho con người nói chung. Tiếng Việt không có yêu cầu hòa hợp giống ngữ pháp tương ứng, nên “một người” bảo toàn nghĩa khái quát mà không thêm giới tính sinh học.
- issue: Có nên đưa ý “sinh lại” từ Giăng 3:3 vào riêng động từ γεννηθῆναι hay không
  choice: được sinh ra ... lần thứ hai
  alternative: được sinh lại
  rationale: Câu này có δεύτερον, nghĩa là “lần thứ hai”, thể hiện cách hiểu theo nghĩa đen của Ni-cô-đem. Bản dịch không đưa trước sắc thái còn gây căng thẳng của ἄνωθεν ở câu trước vào chính động từ này.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Ni-cô-đem” theo lối phiên âm tên riêng quen thuộc trong tiếng Việt; “dạ mẹ” giữ sắc thái trang nghiêm mà vẫn tự nhiên. Cấu trúc câu hỏi với “Chẳng lẽ ... sao?” bảo toàn kỳ vọng về câu trả lời phủ định.
