revisions:
- from: 'Ni-cô-đem nói với Ngài: “Một người[a] đã già thì làm sao có thể được sinh ra? Chẳng lẽ người ấy có thể vào dạ mẹ lần thứ hai rồi được sinh ra[b] sao?”'
  to: 'Ni-cô-đem nói với Ngài: “Làm sao một người đã già có thể được sinh ra? Chẳng lẽ người ấy có thể vào lòng mẹ mình lần thứ hai rồi được sinh ra sao?”'
  rationale: Chỉnh nhẹ để dùng cách nói hiện đại, tự nhiên hơn cho “womb” và để chú thích phản ánh chính xác, trung tính lối hiểu theo nghĩa đen của Ni-cô-đem. Không thay đổi nghĩa, sắc thái câu hỏi tu từ phủ định, hay tính mơ hồ thần học của ngữ cảnh.
  reviewer_model: gpt-5.6-terra
