id: JHN.18.11
reference: John 18:11
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἶπεν οὖν ὁ Ἰησοῦς τῷ Πέτρῳ· Βάλε τὴν ⸀μάχαιραν εἰς τὴν θήκην· τὸ ποτήριον ὃ δέδωκέν μοι ὁ πατὴρ οὐ μὴ πίω αὐτό;
base_translation:
  language: en
  yaml_path: translation/nt/john/018/011.yaml
  text: So Jesus said to Peter[a], “Put the sword into its sheath[b]. Shall I not drink the cup that the Father has given me?”
translation:
  language: vi
  text: 'Vì vậy, Chúa Giê-su nói với Phi-e-rơ: “Hãy tra gươm vào vỏ[a]. Chẳng lẽ Ta không uống chén[b] mà Cha đã ban cho Ta sao?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “bao kiếm”.
    reason: lexical_alternative
  - marker: b
    text: “Chén” là hình ảnh ẩn dụ trong Kinh Thánh về sự đau khổ hoặc phần đã được Đức Chúa Trời định; đối chiếu lời cầu nguyện tại Ghết-sê-ma-nê trong Ma-thi-ơ 26:39; Mác 14:36; Lu-ca 22:42.
    reason: cross_reference
lexical_decisions:
- source_word: οὖν
  choice: Vì vậy
  rationale: Giữ chức năng nối tiếp và suy luận của οὖν trong mạch tường thuật, đồng thời vẫn tự nhiên trong tiếng Việt hiện đại.
- source_word: Βάλε
  choice: Hãy tra
  rationale: Trong ngữ cảnh cất gươm vào vỏ, động từ tiếng Việt “tra” diễn đạt tự nhiên và chính xác hành động đặt lưỡi gươm trở lại vỏ.
- source_word: μάχαιραν
  choice: gươm
  rationale: μάχαιρα chỉ một loại vũ khí có lưỡi; “gươm” là cách dịch quen thuộc, rõ nghĩa và không thu hẹp quá mức thành dao găm.
- source_word: θήκην
  choice: vỏ
  rationale: “Vỏ” là cách gọi ngắn gọn, tự nhiên cho vật chứa lưỡi gươm; chú thích nêu phương án cụ thể hơn là “bao kiếm”.
- source_word: ποτήριον
  choice: chén
  rationale: Giữ nguyên hình ảnh ẩn dụ trong nguyên văn thay vì diễn giải thành sự đau khổ, cái chết hay cơn thịnh nộ.
- source_word: δέδωκέν
  choice: đã ban
  rationale: Thể hoàn thành nói đến hành động đã được thực hiện và vẫn có hiệu lực; “đã ban” truyền đạt điều ấy tự nhiên trong tiếng Việt.
- source_word: ὁ πατήρ
  choice: Cha
  rationale: Nguyên văn dùng danh từ có mạo từ nhưng không có đại từ sở hữu. “Cha” giữ lối diễn đạt của Giăng mà không thêm “Cha Ta”.
- source_word: οὐ μὴ πίω αὐτό;
  choice: Chẳng lẽ Ta không uống… sao?
  rationale: Cấu trúc câu hỏi tu từ mạnh mong đợi câu trả lời khẳng định. Cách diễn đạt này giữ được ý rằng Đức Giê-su quả thật sẽ uống chén ấy.
theological_decisions:
- issue: Ý nghĩa của “chén”
  choice: Giữ “chén” như một ẩn dụ về phần đau khổ hoặc số phận do Đức Chúa Trời định, không giải nghĩa hẹp hơn trong chính văn.
  alternative: Diễn giải là sự đau khổ dành cho Đức Giê-su, số phận Cha giao, hoặc chén thịnh nộ của Đức Chúa Trời.
  rationale: Văn cảnh hỗ trợ ý niệm về sự đau khổ được định trước, nhưng câu này không trực tiếp giới hạn ẩn dụ vào một cách giải thích thần học cụ thể.
- issue: Mối quan hệ giữa Đức Giê-su với Cha trong cụm “Cha đã ban cho Ta”
  choice: Diễn đạt trực tiếp sự tự nguyện vâng phục Cha, không thêm lời giải thích giáo lý.
  alternative: Dịch thành “Cha Ta đã giao điều này cho Ta” hoặc “Cha đã trao điều này vào tay Ta”.
  rationale: Nguyên văn trình bày sự vâng phục của Con đối với ý muốn của Cha; cách dịch thẳng giữ được ý nghĩa ấy mà không thêm sở hữu từ hay diễn giải ngoài văn bản.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “Chúa Giê-su”, “Phi-e-rơ” và đại từ “Ta” phù hợp với lời phán có thẩm quyền. Cấu trúc “Chẳng lẽ… sao?” giữ lực của câu hỏi tu từ. Các dấu chú thích được đặt đúng sau “vỏ” và “chén”.
