  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἶπεν οὖν αὐτῷ ὁ Πιλᾶτος· Οὐκοῦν βασιλεὺς εἶ σύ; ἀπεκρίθη ⸀ὁ Ἰησοῦς· Σὺ λέγεις ὅτι βασιλεύς ⸀εἰμι. ἐγὼ εἰς τοῦτο γεγέννημαι καὶ εἰς τοῦτο ἐλήλυθα εἰς τὸν κόσμον ἵνα μαρτυρήσω τῇ ἀληθείᾳ· πᾶς ὁ ὢν ἐκ τῆς ἀληθείας ἀκούει μου τῆς φωνῆς.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/037.yaml
  text: 'Then Pilate said to him[a], “So then, are you a king?” Jesus answered, “You say that I am a king. For this I have been born, and for this I have come into the world: that I should bear witness to the truth. Everyone who is of the truth listens to my voice.”'
translation:
  language: vi
  text: 'Bấy giờ, Phi-lát nói với Người: “Vậy ông là vua sao?” Đức Giê-su đáp: “Ông nói rằng tôi là vua.[a] Tôi được sinh ra chính vì điều này, và cũng chính vì điều này tôi đã đến thế gian: để làm chứng cho sự thật. Ai thuộc về sự thật đều nghe tiếng tôi.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Ông nói vậy: tôi là vua,” hoặc “Ông nói đúng rằng tôi là vua.” Cách diễn đạt Hy Lạp ngắn gọn và có thể được hiểu là một lời xác nhận dè dặt.'
    reason: alternative_reading
lexical_decisions:
- source_word: Οὐκοῦν
  choice: Vậy
  rationale: Diễn đạt tự nhiên sắc thái suy luận trong câu hỏi của Phi-lát dựa trên cuộc đối thoại trước đó.
- source_word: βασιλεὺς
  choice: vua
  rationale: Từ tương đương thông dụng, giữ nguyên cả sắc thái chính trị lẫn hàm ý về Đấng Mê-si trong cuộc thẩm vấn của La Mã.
- source_word: Σὺ λέγεις ὅτι βασιλεύς εἰμι
  choice: Chính ông nói rằng tôi là vua
  rationale: Bám sát cấu trúc Hy Lạp và giữ tính hàm súc của lời đáp; “chính ông” thể hiện sự nhấn mạnh của đại từ Σὺ nhưng không biến câu thành lời xác nhận tuyệt đối hay phủ nhận.
- source_word: γεγέννημαι
  choice: Tôi đã sinh ra
  rationale: Thể hoàn thành được diễn đạt tự nhiên trong tiếng Việt, đồng thời giữ riêng mệnh đề nói về sự sinh ra và ý nghĩa hiện tại của sứ mạng.
- source_word: ἐλήλυθα εἰς τὸν κόσμον
  choice: tôi đã đến thế gian
  rationale: Giữ ngôn ngữ về việc đến thế gian và không hòa lẫn mệnh đề này với mệnh đề nói về sự sinh ra.
- source_word: μαρτυρήσω τῇ ἀληθείᾳ
  choice: làm chứng cho sự thật
  rationale: “Làm chứng” duy trì sắc thái chứng ngôn và pháp lý nổi bật trong Giăng; “cho sự thật” là kết hợp tự nhiên trong tiếng Việt.
- source_word: πᾶς ὁ ὢν ἐκ τῆς ἀληθείας
  choice: Bất cứ ai thuộc về sự thật
  rationale: Diễn đạt tự nhiên quan hệ nguồn gốc hoặc gắn bó của ἐκ mà không dùng cách nói gượng “từ sự thật”.
- source_word: ἀκούει μου τῆς φωνῆς
  choice: nghe tiếng tôi
  rationale: Giữ sát hình ảnh “tiếng” trong nguyên văn và vẫn có thể bao hàm ý lắng nghe, đáp ứng, không ép nghĩa thành sự vâng phục.
theological_decisions:
- issue: 'Sắc thái lời đáp của Đức Chúa Jêsus: Σὺ λέγεις ὅτι βασιλεύς εἰμι'
  choice: 'Giữ như một lời xác nhận có điều kiện hoặc dè dặt: “Chính ông nói rằng tôi là vua.”'
  alternative: '“Ông nói đúng: tôi là vua” hoặc “Ông nói vậy; tôi là vua.”'
  rationale: Câu Hy Lạp ngắn gọn và có thể được nghe như một lời xác nhận có giới hạn. Bản dịch chính không biến nó thành lời xác nhận mạnh tuyệt đối, cũng không khiến nó thành lời phủ nhận; chú thích nêu các khả năng.
- issue: Hai mệnh đề về sự sinh ra và việc đến thế gian
  choice: Giữ hai mệnh đề riêng biệt
  alternative: Gộp lại thành một câu diễn ý chung về sứ mạng
  rationale: Cách diễn đạt của Giăng phân biệt việc được sinh ra với việc đến thế gian và có thể mang ý nghĩa về nguồn gốc cùng sứ mạng; bản dịch không thêm lời giải thích thần học ngoài văn bản.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Dùng “Phi-lát”, “Đức Chúa Jêsus” theo lối gọi quen thuộc trong Kinh Thánh tiếng Việt; đại từ “ông/tôi” phù hợp bối cảnh xét hỏi. Giữ “sự thật” và “nghe tiếng tôi” để bảo toàn các âm hưởng đặc trưng của sách Giăng.
