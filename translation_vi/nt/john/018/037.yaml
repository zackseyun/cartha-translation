revisions:
- from: 'Bấy giờ, Phi-lát nói với Ngài: “Vậy ông là vua sao?” Đức Chúa Jêsus đáp: “Chính ông nói rằng tôi là vua.[a] Tôi đã sinh ra vì điều này, và cũng vì điều này mà tôi đã đến thế gian: để làm chứng cho sự thật. Bất cứ ai thuộc về sự thật đều nghe tiếng tôi.”'
  to: 'Bấy giờ, Phi-lát nói với Người: “Vậy ông là vua sao?” Đức Giê-su đáp: “Ông nói rằng tôi là vua.[a] Tôi được sinh ra chính vì điều này, và cũng chính vì điều này tôi đã đến thế gian: để làm chứng cho sự thật. Ai thuộc về sự thật đều nghe tiếng tôi.”'
  rationale: Bản sửa loại bỏ tước hiệu không có trong nguyên văn và chuẩn hóa tên riêng theo cách dùng Việt hiện đại; thay «đã sinh ra» bằng «được sinh ra» để phản ánh thể bị động; giảm nhấn mạnh không cần thiết trong lời đáp của Đức Giê-su; và điều chỉnh chú thích để bảo tồn tính mơ hồ của Σὺ λέγεις ὅτι βασιλεύς εἰμι mà không diễn giải nó như một mệnh đề có điều kiện.
