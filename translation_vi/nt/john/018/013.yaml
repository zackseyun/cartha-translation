id: JHN.18.13
reference: John 18:13
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ⸀ἤγαγον πρὸς Ἅνναν πρῶτον· ἦν γὰρ πενθερὸς τοῦ Καϊάφα, ὃς ἦν ἀρχιερεὺς τοῦ ἐνιαυτοῦ ἐκείνου·
base_translation:
  language: en
  yaml_path: translation/nt/john/018/013.yaml
  text: And they led him first to Annas, for he was the father-in-law of Caiaphas, who was high priest that year.
translation:
  language: vi
  text: Trước hết, họ giải Đức Giê-su đến chỗ An-na, vì ông là cha vợ của Cai-pha, người giữ chức thượng tế năm ấy.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤγαγον
  choice: họ giải Đức Giê-su
  rationale: ἄγω có nghĩa là dẫn hoặc đưa đi; trong bối cảnh Đức Giê-su bị bắt và chuyển giao dưới sự canh giữ, “giải” diễn đạt tự nhiên và chính xác. Tân ngữ được nêu rõ theo ngữ cảnh để câu tiếng Việt sáng nghĩa.
- source_word: πρὸς Ἅνναν
  choice: đến chỗ An-na
  rationale: πρός với đối cách chỉ hướng chuyển động về phía một người; “đến chỗ An-na” là cách nói tự nhiên trong tiếng Việt và không biến cụm này thành ý nghĩa xét xử “trước mặt” An-na.
- source_word: πρῶτον
  choice: Trước hết
  rationale: Trạng từ này chỉ thứ tự, cho biết An-na là người đầu tiên Đức Giê-su được giải đến.
- source_word: πενθερὸς
  choice: cha vợ
  rationale: πενθερός chỉ cụ thể cha của người vợ; Cai-pha là nam giới, nên “cha vợ” chính xác và tự nhiên hơn từ khái quát “cha chồng/cha vợ”.
- source_word: ἀρχιερεὺς
  choice: thượng tế
  rationale: Đây là thuật ngữ quen thuộc trong tiếng Việt chỉ chức vụ tư tế tối cao của Do Thái giáo, đồng thời phân biệt với các thượng tế theo nghĩa số nhiều trong một số ngữ cảnh.
- source_word: τοῦ ἐνιαυτοῦ ἐκείνου
  choice: năm ấy
  rationale: Cụm sở hữu cách bổ nghĩa cho chức thượng tế; “năm ấy” giữ nguyên dấu mốc thời gian của tác giả và tự nhiên trong tiếng Việt.
- source_word: Ἅνναν
  choice: An-na
  rationale: Tên riêng được phiên âm theo cách dùng Kinh Thánh tiếng Việt phổ biến.
- source_word: Καϊάφα
  choice: Cai-pha
  rationale: Tên riêng được phiên âm theo cách dùng Kinh Thánh tiếng Việt phổ biến.
theological_decisions:
- issue: Sở chỉ của mệnh đề “người giữ chức thượng tế năm ấy”
  choice: Mệnh đề quan hệ chỉ Cai-pha.
  alternative: Có thể bị hiểu nhầm là chỉ An-na nếu cấu trúc câu tiếng Việt thiếu rõ ràng.
  rationale: Đại từ quan hệ ὃς ở giống đực số ít tự nhiên quy chiếu về tiền ngữ gần nhất là Καϊάφα. Cách đặt “Cai-pha, người...” duy trì rõ sở chỉ này mà không thêm diễn giải thần học.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Giê-su” theo lối xưng danh kính trọng phổ biến; “giải” phản ánh tình trạng bị áp giải. Không cần chú thích vì câu không có dị bản hay độ mơ hồ đáng kể cần trình bày.
