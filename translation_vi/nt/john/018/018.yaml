revisions:
- from: Các đầy tớ[a] và những người thuộc đội canh[b] đang đứng đó. Họ đã nhóm một bếp than vì trời lạnh và đang sưởi ấm. Phi-e-rơ cũng đứng với họ và sưởi ấm.
  to: Các nô lệ[a] và những người phục dịch[b] đang đứng đó, đã nhóm một bếp lửa than vì trời lạnh và đang sưởi ấm. Phi-e-rơ cũng đang đứng với họ và sưởi ấm.
  rationale: Sửa các từ chỉ hai nhóm người để giữ sự phân biệt của nguyên văn mà không gán quá mức một chức năng quân sự cho ὑπηρέται. Điều chỉnh cách nói về bếp than và thể tiếp diễn để văn bản tự nhiên hơn, đồng thời phản ánh sát hơn các phân từ và thì chưa hoàn thành trong tiếng Hy Lạp.
