  text: εἱστήκεισαν δὲ οἱ δοῦλοι καὶ οἱ ὑπηρέται ἀνθρακιὰν πεποιηκότες, ὅτι ψῦχος ἦν, καὶ ἐθερμαίνοντο· ἦν δὲ ⸂καὶ ὁ Πέτρος μετ’ αὐτῶν⸃ ἑστὼς καὶ θερμαινόμενος.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/018.yaml
  text: The servants and the officers were standing there[a], having made a charcoal fire because it was cold, and they were warming themselves[b]. Peter also was standing with them and warming himself.
translation:
  language: vi
  text: Các nô lệ[a] và những người phục dịch[b] đang đứng đó, đã nhóm một bếp lửa than vì trời lạnh và đang sưởi ấm. Phi-e-rơ cũng đang đứng với họ và sưởi ấm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “các đầy tớ”; từ Hy Lạp chỉ những người có thân phận nô lệ, ở đây thuộc gia thuộc của thượng tế.
    reason: lexical_alternative
  - marker: b
    text: Hay “các lính canh”; từ Hy Lạp chỉ những người phục vụ chính thức, có lẽ liên hệ với đền thờ hoặc nhà thượng tế và có thể thi hành nhiệm vụ canh giữ.
    reason: lexical_alternative
lexical_decisions:
- source_word: δοῦλοι
  choice: các đầy tớ
  rationale: Trong bối cảnh nhà thượng tế, từ này chỉ những người phục dịch trong gia thuộc, có thể mang thân phận nô lệ. “Đầy tớ” là cách nói tự nhiên, trang trọng trong tiếng Việt, còn sắc thái về thân phận được nêu ở chú thích.
- source_word: ὑπηρέται
  choice: những người thuộc đội canh
  rationale: Trong Giăng, từ này thường chỉ những thuộc viên chính thức có nhiệm vụ chấp pháp hoặc canh giữ cho giới lãnh đạo tôn giáo. Cách dịch này rõ nghĩa hơn “nhân viên” nhưng không khẳng định họ là binh lính.
- source_word: ἀνθρακιὰν
  choice: một bếp than
  rationale: Diễn đạt tự nhiên chi tiết cụ thể là lửa đốt bằng than, một chi tiết có ý nghĩa trong mạch thuật chuyện của Giăng.
- source_word: πεποιηκότες
  choice: đã nhóm
  rationale: Thể hoàn thành của phân từ diễn tả hành động đã hoàn tất với kết quả còn hiện hữu; “đã nhóm” phù hợp với cách nói tiếng Việt về việc làm ra một bếp lửa.
- source_word: ὅτι ψῦχος ἦν
  choice: vì trời lạnh
  rationale: Giữ rõ quan hệ nguyên nhân do ὅτι biểu thị và dùng cách nói tự nhiên trong tiếng Việt.
- source_word: ἐθερμαίνοντο
  choice: đang sưởi ấm
  rationale: “Đang” thể hiện hành động tiếp diễn của thì chưa hoàn thành; “sưởi ấm” tự nhiên và không cần thêm tân ngữ phản thân trong tiếng Việt.
- source_word: ἦν δὲ καὶ ὁ Πέτρος μετ’ αὐτῶν ἑστὼς
  choice: Phi-e-rơ cũng đứng với họ
  rationale: “Cũng” giữ sắc thái bổ sung của καί; “đứng với họ” bảo toàn cả tư thế lẫn việc Phi-e-rơ ở giữa nhóm người ấy.
- source_word: θερμαινόμενος
  choice: sưởi ấm
  rationale: Giữ sự song hành với hành động của nhóm người ở câu trước và diễn tả hành động đang tiếp diễn một cách gọn, tự nhiên.
- source_word: δέ
  choice: không dịch thành một từ nối riêng
  rationale: δέ chỉ có chức năng liên kết nhẹ trong mạch kể; việc tách thành hai câu tiếng Việt đã chuyển tải diễn tiến mà không cần thêm “bấy giờ” hay tạo sắc thái tương phản không có trong nguyên văn.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng và dễ hiểu. Tách câu sau cụm chỉ địa điểm để tránh một câu tiếng Việt quá nặng, đồng thời giữ nguyên trình tự thông tin và sự lặp có chủ ý giữa nhóm người đang sưởi với Phi-e-rơ.
