  - severity: medium
    issue: Chú thích khẳng định bối cảnh là “một cuộc thẩm vấn chính thức.”
    rationale: ἠρώτησεν có nghĩa cơ bản là “hỏi”; “chất vấn” là khả năng dịch theo ngữ cảnh, nhưng nguyên văn không tự nó xác định mức độ hay tính chất pháp lý của cuộc hỏi đáp.
  - severity: low
    issue: “Vì vậy” và “sự dạy dỗ” hơi nặng trong câu trần thuật ngắn.
    rationale: “Vậy” và “lời dạy” tự nhiên, gọn hơn trong tiếng Việt tiêu chuẩn hiện đại mà không làm thay đổi nghĩa.
