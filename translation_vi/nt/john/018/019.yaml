  verdict: revise
  source_fidelity: 'Bản dịch chuyển đạt đúng các thành phần chính: liên từ οὖν, danh xưng số ít xác định “thượng tế,” động từ ἠρώτησεν, và hai đối tượng được hỏi. Tuy nhiên, cả hai đại từ αὐτοῦ đều quy chiếu đến Chúa Giê-su; nên biểu thị rõ ở cả “các môn đệ của Ngài” lẫn “lời dạy của Ngài,” thay vì tỉnh lược lần đầu. Chú thích hiện có cũng diễn giải bối cảnh như một cuộc thẩm vấn chính thức quá dứt khoát, trong khi bản văn chỉ dùng động từ “hỏi/đặt câu hỏi.”'
  naturalness: “Vậy” là cách mở câu tự nhiên hơn “Vì vậy” trong mạch kể chuyện. “Các môn đệ” là thuật ngữ hiện đại, chuẩn mực và vẫn giữ rõ quan hệ thầy–trò. “Lời dạy” gọn, tự nhiên hơn “sự dạy dỗ” trong ngữ cảnh nói về nội dung giáo huấn.
  terminology: Giữ “thượng tế” cho ἀρχιερεύς, không thêm tên An-ne. Giữ “Chúa Giê-su” và “Ngài” theo thanh giọng tôn kính của bản thảo. Dùng “môn đệ” cho μαθηταί và “lời dạy” cho διδαχή; cả hai tránh thêm sắc thái giáo lý hệ thống hoặc pháp lý không có trong nguyên ngữ.
