  text: Ὁ οὖν ἀρχιερεὺς ἠρώτησεν τὸν Ἰησοῦν περὶ τῶν μαθητῶν αὐτοῦ καὶ περὶ τῆς διδαχῆς αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/019.yaml
  text: So the high priest questioned Jesus about his disciples and about his teaching[a].
translation:
  language: vi
  text: Vậy, thượng tế hỏi Chúa Giê-su về các môn đệ của Ngài và về lời dạy của Ngài.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “chất vấn Chúa Giê-su.” Động từ Hy Lạp này có thể dịch là “hỏi” hoặc “chất vấn”; cách dịch sau nhấn mạnh sắc thái của ngữ cảnh phiên hỏi cung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Vì vậy
  rationale: Giữ sức nối tiếp và suy ra từ các sự việc ngay trước đó; cách diễn đạt tự nhiên, trang trọng vừa phải trong tiếng Việt.
- source_word: ἀρχιερεὺς
  choice: thượng tế
  rationale: Danh xưng tiêu chuẩn cho chức vụ tư tế tối cao của người Do Thái; không thay bằng tên riêng dù trong ngữ cảnh người được nói đến là An-ne.
- source_word: ἠρώτησεν
  choice: hỏi
  rationale: Động từ có thể chỉ việc hỏi hoặc chất vấn. “Hỏi” giữ được phạm vi nghĩa rộng của từ Hy Lạp; bối cảnh cho thấy đây là một cuộc thẩm vấn chính thức mà không cần tăng sắc thái trong chính văn.
- source_word: περὶ
  choice: về
  rationale: Diễn đạt tự nhiên chủ đề của câu hỏi trong cả hai lần xuất hiện.
- source_word: μαθητῶν
  choice: các môn đồ
  rationale: Giữ quan hệ thầy–trò vốn có trong μαθητής và phù hợp thuật ngữ Kinh Thánh quen thuộc.
- source_word: διδαχῆς
  choice: sự dạy dỗ
  rationale: Tự nhiên và dễ hiểu, đồng thời tránh sắc thái hệ thống hoặc kỹ thuật có thể phát sinh từ “giáo lý”.
- source_word: αὐτοῦ
  choice: của Ngài
  rationale: Cả hai đại từ sở hữu đều quy chiếu về Chúa Giê-su; lần đầu được diễn đạt bằng “các môn đồ [của Ngài]” theo phép tỉnh lược tự nhiên trong tiếng Việt, lần sau dùng “của Ngài” để làm rõ.
theological_decisions:
- issue: Danh xưng ἀρχιερεύς trong bối cảnh nhân vật là An-ne chứ không phải Cai-phe, người đang giữ chức được La Mã công nhận
  choice: Dịch trực tiếp là “thượng tế”
  alternative: “Thượng tế An-ne” hoặc “trưởng tế”
  rationale: Theo sát cách trình bày của bản Hy Lạp, không đưa tên riêng hay lời giải thích mang tính dung hòa lịch sử vào chính văn.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng và dễ hiểu. Dùng “Chúa Giê-su” và đại từ tôn kính “Ngài”; giữ thuật ngữ quen thuộc “thượng tế,” “môn đồ,” đồng thời tránh lối diễn đạt quá chuyên môn.
