source:
  edition: SBLGNT
  text: ὁ δὲ Πέτρος εἱστήκει πρὸς τῇ θύρᾳ ἔξω. ἐξῆλθεν οὖν ὁ μαθητὴς ὁ ἄλλος ⸀ὁ γνωστὸς ⸂τοῦ ἀρχιερέως⸃ καὶ εἶπεν τῇ θυρωρῷ καὶ εἰσήγαγεν τὸν Πέτρον.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/016.yaml
  text: But Peter was standing outside at the door[a]. So the other disciple, who was known to the high priest[b], went out and spoke to the doorkeeper and brought Peter in.
translation:
  language: vi
  text: Nhưng Phi-e-rơ đang đứng ở ngoài, gần cửa. Vì thế, người môn đồ kia, người mà thầy tế lễ thượng phẩm quen biết[a], đi ra, nói với người phụ nữ giữ cửa[b], rồi đưa Phi-e-rơ vào.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “người quen của thầy tế lễ thượng phẩm.” Tiếng Hy Lạp không cho biết chính xác mức độ thân quen trong mối quan hệ này.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “người phụ nữ giữ cổng.” Từ Hy Lạp chỉ người được bố trí trông coi lối vào.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἱστήκει
  choice: vẫn đứng
  rationale: Dạng động từ diễn tả trạng thái đang tiếp diễn của Phi-e-rơ; “vẫn đứng” vừa tự nhiên vừa nối rõ với diễn tiến trước đó.
- source_word: πρὸς τῇ θύρᾳ ἔξω
  choice: bên ngoài, gần cửa
  rationale: 'Giữ cả hai ý: Phi-e-rơ ở bên ngoài và ở sát hoặc gần lối cửa; không thu hẹp θύρα thành một loại cổng cụ thể.'
- source_word: ὁ μαθητὴς ὁ ἄλλος
  choice: người môn đồ kia
  rationale: “Môn đồ” thể hiện quan hệ theo học và gắn bó trong văn cảnh Tin Mừng; “kia” nhận diện nhân vật đã được nhắc đến.
- source_word: ὁ γνωστὸς τοῦ ἀρχιερέως
  choice: vốn quen biết thầy thượng tế
  rationale: γνωστός cho biết có sự quen biết nhưng không xác định mức độ thân thiết; cách dịch này tránh gọi người môn đồ là bạn thân hay cộng sự.
- source_word: ἀρχιερεύς
  choice: thầy thượng tế
  rationale: Cách gọi ngắn gọn, trang trọng và dễ hiểu cho chức vụ tư tế cao nhất trong văn cảnh Do Thái.
- source_word: τῇ θυρωρῷ
  choice: người nữ giữ cửa
  rationale: θυρωρός chỉ người trông coi lối vào, còn mạo từ giống cái cho thấy người này là nữ; bản dịch diễn đạt cả vai trò lẫn giới tính được đánh dấu trong tiếng Hy Lạp.
- source_word: εἶπεν τῇ θυρωρῷ
  choice: nói với người nữ giữ cửa
  rationale: Không có lời trực tiếp đi kèm, nên “nói với” là cách diễn đạt tự nhiên và không thêm nội dung cuộc nói chuyện.
- source_word: εἰσήγαγεν τὸν Πέτρον
  choice: đưa Phi-e-rơ vào
  rationale: Diễn đạt trực tiếp hành động đưa một người từ ngoài vào trong mà không hàm ý quá mức về cách thức dẫn dắt.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Phi-e-rơ” theo lối phiên âm quen thuộc; “thầy thượng tế” giữ sắc thái chức vụ tôn giáo. Các liên từ và trạng từ được chọn để thể hiện sự tương phản và tiếp nối của câu Hy Lạp mà không làm câu tiếng Việt nặng nề.
