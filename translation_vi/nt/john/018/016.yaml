revisions:
- from: Nhưng Phi-e-rơ vẫn đứng bên ngoài, gần cửa. Vì vậy, người môn đồ kia, vốn quen biết thầy thượng tế[a], đi ra nói với người nữ giữ cửa[b], rồi đưa Phi-e-rơ vào.
  to: Nhưng Phi-e-rơ đang đứng ở ngoài, gần cửa. Vì thế, người môn đồ kia, người mà thầy tế lễ thượng phẩm quen biết[a], đi ra, nói với người phụ nữ giữ cửa[b], rồi đưa Phi-e-rơ vào.
  rationale: Bản sửa giữ trạng thái tiếp diễn của Phi-e-rơ, vị trí ở ngoài gần cửa, và chuỗi hành động của người môn đồ kia. Cụm quan hệ được chuyển thành “người mà thầy tế lễ thượng phẩm quen biết” để phản ánh hướng diễn đạt của γνωστός τοῦ ἀρχιερέως mà không suy đoán mức độ thân thiết. Chức danh và cách gọi người giữ cửa được điều chỉnh cho tự nhiên, hiện đại, đồng thời giữ chi tiết người giữ cửa là nữ.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T08:26:11Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp diễn đạt đúng mạch hành động và giữ được giới tính nữ của τῇ θυρωρῷ. Tuy nhiên, “vốn quen biết thầy thượng tế” đổi hướng quan hệ của ὁ γνωστὸς τοῦ ἀρχιερέως: nguyên ngữ mô tả người môn đồ là người được/thầy thượng tế biết đến, không nói trực tiếp rằng ông ấy là người biết thầy thượng tế. Cần chỉnh để giữ hướng này, đồng thời không xác định mức độ thân tình.'
  naturalness: Câu kể nhìn chung tự nhiên. “Thầy thượng tế” không phải cách gọi chức danh thông dụng, dễ gây cảm giác “thầy” là một thành tố riêng. “Thầy tế lễ thượng phẩm” là cách gọi Việt ngữ Kinh Thánh chuẩn hơn và rõ nghĩa hơn. “Người phụ nữ giữ cửa” tự nhiên hơn “người nữ giữ cửa” mà vẫn bảo toàn dấu hiệu giống cái.
  terminology: Giữ “môn đồ” và “Phi-e-rơ” là nhất quán với văn phong tường thuật Kinh Thánh. Dùng “thầy tế lễ thượng phẩm” cho ἀρχιερεύς. Chú thích về γνωστός cần nêu lựa chọn “người quen” là khả dĩ, không biến nó thành lời khẳng định về mức độ hay chiều hướng quan hệ.
  issues:
  - severity: medium
    issue: Hướng quan hệ trong “vốn quen biết thầy thượng tế”
    rationale: ὁ γνωστὸς τοῦ ἀρχιερέως có nghĩa là người được thầy tế lễ thượng phẩm biết đến/quen biết. Câu nháp lại chủ động nói người môn đồ biết thầy thượng tế. Dù quan hệ quen biết có thể trên thực tế là hai chiều, bản dịch nên giữ cách biểu đạt và độ bất định của nguyên ngữ.
  - severity: low
    issue: Cách gọi “thầy thượng tế”
    rationale: Cụm này không tự nhiên như một tên chức vụ trong tiếng Việt hiện đại. “Thầy tế lễ thượng phẩm” rõ và phù hợp với cách dùng Kinh Thánh tiếng Việt hơn.
  revised_text: Nhưng Phi-e-rơ đang đứng ở ngoài, gần cửa. Vì thế, người môn đồ kia, người mà thầy tế lễ thượng phẩm quen biết[a], đi ra, nói với người phụ nữ giữ cửa[b], rồi đưa Phi-e-rơ vào.
