source:
  edition: SBLGNT
  text: Ἠκολούθει δὲ τῷ Ἰησοῦ Σίμων Πέτρος ⸀καὶ ἄλλος μαθητής. ὁ δὲ μαθητὴς ἐκεῖνος ἦν γνωστὸς τῷ ἀρχιερεῖ καὶ συνεισῆλθεν τῷ Ἰησοῦ εἰς τὴν αὐλὴν τοῦ ἀρχιερέως,
base_translation:
  language: en
  yaml_path: translation/nt/john/018/015.yaml
  text: Simon Peter was following Jesus[a], and so was another disciple. That disciple was known to the high priest, and he went in with Jesus into the courtyard of the high priest,
translation:
  language: vi
  text: Si-môn Phi-e-rơ đang đi theo Giê-su[a], và một môn đồ khác cũng vậy. Môn đồ ấy quen biết thầy tế lễ thượng phẩm, và đã cùng Giê-su đi vào sân của thầy tế lễ thượng phẩm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát hơn: “Si-môn Phi-e-rơ đang đi theo Giê-su, và một môn đồ khác.” Tiếng Hy Lạp hàm ý rằng môn đồ thứ hai cũng thực hiện hành động đi theo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἠκολούθει
  choice: đi theo
  rationale: Thì chưa hoàn thành diễn tả hành động đang tiếp diễn trong mạch kể; tiếng Việt tự nhiên có thể dùng “đi theo” mà không cần thêm “đang”.
- source_word: δὲ
  choice: không dịch thành một từ riêng
  rationale: Đây là liên từ chuyển tiếp nhẹ trong diễn ngôn; mạch kể tiếng Việt đã tự nhiên nên không cần thêm “bấy giờ” hoặc “nhưng”.
- source_word: καὶ ἄλλος μαθητής
  choice: và một môn đồ khác cũng vậy
  rationale: Làm rõ rằng môn đồ kia cũng đi theo Đức Chúa Jêsus, trong khi chú thích ghi nhận rằng động từ chung chỉ được hàm ý trong tiếng Hy Lạp.
- source_word: μαθητής
  choice: môn đồ
  rationale: Thuật ngữ quen thuộc, trang trọng và chính xác cho người học và đi theo Đức Chúa Jêsus trong sách Giăng.
- source_word: ἐκεῖνος
  choice: ấy
  rationale: Chỉ ngược lại “một môn đồ khác” vừa được nhắc đến mà không xác định danh tính người ấy.
- source_word: γνωστὸς
  choice: quen biết
  rationale: Diễn đạt quan hệ biết nhau với thầy tế lễ thượng phẩm, không cường điệu thành “thân thiết” hay “rất nổi tiếng”.
- source_word: ἀρχιερεῖ / ἀρχιερέως
  choice: thầy tế lễ thượng phẩm
  rationale: Cách gọi truyền thống, rõ nghĩa trong văn cảnh Do Thái, giữ nguyên số ít ở cả hai lần.
- source_word: συνεισῆλθεν
  choice: cùng Đức Chúa Jêsus đi vào
  rationale: 'Giữ ý của tiền tố σύν: môn đồ ấy vào cùng với Đức Chúa Jêsus.'
- source_word: αὐλήν
  choice: sân nhà
  rationale: Chỉ khu sân khép kín thuộc dinh hoặc tư gia của thầy tế lễ thượng phẩm; “sân nhà” rõ hơn “sân” đơn độc và không diễn giải quá mức thành “sân dinh”.
theological_decisions: []
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu; dùng tên gọi “Đức Chúa Jêsus”, “Si-môn Phi-e-rơ” và thuật ngữ “môn đồ”, “thầy tế lễ thượng phẩm” theo văn phong Kinh Thánh phổ thông. Dấu phẩy cuối câu trong nguồn được chuyển thành dấu chấm vì đây là một câu trọn vẹn khi đứng riêng theo đơn vị câu.
