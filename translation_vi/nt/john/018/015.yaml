revisions:
- from: Si-môn Phi-e-rơ đi theo Đức Chúa Jêsus[a], và một môn đồ khác cũng vậy. Môn đồ ấy quen biết thầy tế lễ thượng phẩm, nên cùng Đức Chúa Jêsus đi vào sân nhà của thầy tế lễ thượng phẩm.
  to: Si-môn Phi-e-rơ đang đi theo Giê-su[a], và một môn đồ khác cũng vậy. Môn đồ ấy quen biết thầy tế lễ thượng phẩm, và đã cùng Giê-su đi vào sân của thầy tế lễ thượng phẩm.
  rationale: Loại bỏ quan hệ nhân quả không có trong nguyên văn, nêu rõ sắc thái tiếp diễn của động từ chính, chuẩn hóa tên Giê-su theo tiếng Việt hiện đại, và giữ nguyên tính không xác định của «một môn đồ khác».
  reviewer_model: gpt-5.6-terra
