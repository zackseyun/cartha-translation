source:
  edition: SBLGNT
  text: λέγει εἷς ἐκ τῶν δούλων τοῦ ἀρχιερέως, συγγενὴς ὢν οὗ ἀπέκοψεν Πέτρος τὸ ὠτίον· Οὐκ ἐγώ σε εἶδον ἐν τῷ κήπῳ μετ’ αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/john/018/026.yaml
  text: One of the high priest’s servants[a], being a relative of the man whose ear Peter had cut off, said, “Didn’t I see you in the garden with him?”
translation:
  language: vi
  text: 'Một người trong số các nô lệ[a] của thầy tế lễ thượng phẩm, vốn là họ hàng của người có tai bị Phi-e-rơ chém đứt, nói: “Chẳng phải chính tôi đã thấy anh ở trong vườn với ông ấy sao?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “đầy tớ”. Từ Hy Lạp doulos có thể chỉ “đầy tớ” hoặc “nô lệ”, tùy bối cảnh; ở đây chọn “nô lệ” để thể hiện địa vị lệ thuộc mà từ này hàm ý.
    reason: lexical_alternative
lexical_decisions:
- source_word: δούλων
  choice: các nô lệ
  rationale: Danh từ δοῦλος trong bối cảnh gia nhân thuộc nhà thầy tế lễ thượng phẩm nói đến địa vị lệ thuộc thực sự; “nô lệ” giữ được thực tế xã hội này, còn “đầy tớ” là một khả năng dịch mềm hơn.
- source_word: ἀρχιερέως
  choice: thầy tế lễ thượng phẩm
  rationale: Cách gọi rõ ràng, quen thuộc cho chức vụ tư tế cao nhất trong bối cảnh cuộc thương khó.
- source_word: συγγενὴς ὢν
  choice: vốn là họ hàng
  rationale: Diễn đạt tự nhiên phân từ chỉ hoàn cảnh, đồng thời giữ rõ quan hệ thân thuộc của người đang nói với người bị chém tai.
- source_word: οὗ ἀπέκοψεν Πέτρος τὸ ὠτίον
  choice: của người bị Phi-e-rơ chém đứt tai
  rationale: Chuyển cấu trúc sở hữu của tiếng Hy Lạp sang câu bị động tự nhiên trong tiếng Việt mà vẫn xác định rõ Phi-e-rơ là người thực hiện hành động.
- source_word: Οὐκ ἐγώ σε εἶδον
  choice: Chẳng phải chính tôi đã thấy anh ... sao?
  rationale: Cấu trúc câu hỏi với οὐκ chờ câu trả lời khẳng định; “chính tôi” bảo tồn sự nhấn mạnh của đại từ ἐγώ.
- source_word: ἐν τῷ κήπῳ
  choice: ở trong vườn
  rationale: Cách dịch trực tiếp và tự nhiên của κῆπος trong bối cảnh nơi Đức Giê-su bị bắt.
- source_word: μετ’ αὐτοῦ
  choice: với ông ấy
  rationale: Đại từ αὐτοῦ chỉ Đức Giê-su; “ông ấy” phù hợp với lời chất vấn của nhân vật mà không tự ý thêm sắc thái tôn kính vào lời nói.
theological_decisions:
- issue: Cách dịch δοῦλος trong bối cảnh gia nhân thực tế
  choice: nô lệ
  alternative: đầy tớ; gia nhân
  rationale: Không làm nhẹ địa vị lệ thuộc được từ Hy Lạp hàm ý. Chú thích vẫn ghi nhận cách dịch khác vì phạm vi nghĩa của từ tùy thuộc bối cảnh.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu hỏi dùng “Chẳng phải ... sao?” để giữ lực tu từ chờ sự xác nhận; “chính tôi” bảo tồn điểm nhấn trong nguyên văn.
