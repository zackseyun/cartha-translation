id: JHN.18.34
reference: John 18:34
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸀ἀπεκρίθη Ἰησοῦς· ⸂Ἀπὸ σεαυτοῦ⸃ σὺ τοῦτο λέγεις ἢ ἄλλοι ⸂εἶπόν σοι⸃ περὶ ἐμοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/john/018/034.yaml
  text: Jesus answered[a], “Are you saying this on your own, or did others tell you about me?”
translation:
  language: vi
  text: 'Đức Giê-su đáp: “Điều này do chính ông nói ra[a], hay những người khác đã nói với ông về tôi?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “từ chính ông”; câu hỏi muốn biết lời Phi-lát nói có xuất phát từ chính ông hay không.'
    reason: Giải thích sắc thái chỉ nguồn gốc của ἀπὸ σεαυτοῦ, vốn khó chuyển nguyên dạng sang tiếng Việt tự nhiên.
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: đáp
  rationale: Động từ kể chuyện thông dụng chỉ lời đáp; “đáp” tự nhiên, trang trọng và hợp với đối thoại trong sách Tin Mừng.
- source_word: Ἀπὸ σεαυτοῦ
  choice: do chính ông nói ra
  rationale: 'Cụm ἀπό với đại từ phản thân chỉ nguồn gốc: lời này có xuất phát từ chính Phi-lát hay không. Cách diễn đạt này tự nhiên trong tiếng Việt và giữ được sắc thái nhấn mạnh.'
- source_word: σὺ
  choice: chính ông
  rationale: Đại từ được nêu rõ trong tiếng Hy Lạp để nhấn mạnh; “chính ông” thể hiện sự nhấn mạnh ấy mà vẫn tự nhiên.
- source_word: τοῦτο
  choice: điều này
  rationale: Chỉ câu hỏi ngay trước đó của Phi-lát; “điều này” rõ nghĩa và tự nhiên.
- source_word: λέγεις
  choice: nói ra
  rationale: Thì hiện tại trong lời đối thoại nói về phát biểu của Phi-lát; “nói ra” giúp diễn đạt tự nhiên ý phát biểu bắt nguồn từ ông.
- source_word: ἢ
  choice: hay
  rationale: Liên từ phân cách, đưa ra khả năng thứ hai trong câu hỏi.
- source_word: ἄλλοι
  choice: những người khác
  rationale: Chỉ những người ngoài Phi-lát, không xác định cụ thể; cách dịch này minh bạch và tự nhiên.
- source_word: εἶπόν σοι
  choice: đã nói với ông
  rationale: Thì bất định chỉ hành động xảy ra trước lời đối thoại hiện tại; “đã nói với ông” phù hợp ngữ cảnh và giữ động từ λέγω.
- source_word: περὶ ἐμοῦ
  choice: về tôi
  rationale: περί với sở hữu cách mang nghĩa “về, liên quan đến”; “về tôi” là cách nói tiếng Việt hiện đại, trực tiếp.
theological_decisions:
- issue: Trọng tâm câu hỏi của Đức Giê-su dành cho Phi-lát
  choice: 'Diễn đạt câu hỏi về nguồn gốc lời Phi-lát nói: lời ấy xuất phát từ chính ông hay do người khác nói cho ông biết.'
  alternative: Diễn giải thành câu hỏi về sáng kiến hoặc động cơ riêng của Phi-lát.
  rationale: Bản Hy Lạp tập trung vào nguồn gốc của lời phát biểu, chưa giải thích động cơ sâu xa của Phi-lát; bản dịch vì thế giữ nguyên sự căng thẳng và không thêm một cách hiểu thần học.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Đức Giê-su” theo lối gọi tôn kính; dùng “ông” trong lời đối thoại để phản ánh cách xưng hô với Phi-lát mà không thêm sắc thái miệt thị hay thân mật.
