  source_fidelity: 'Bản dịch truyền đạt đúng cấu trúc lựa chọn của câu hỏi: liệu lời/câu hỏi ấy xuất phát từ chính Phi-lát hay từ những người khác nói với ông về Đức Giê-su. “do chính ông nói ra” diễn tả được trọng tâm nguồn gốc của ἀπὸ σεαυτοῦ, và “đã nói với ông về tôi” phản ánh đầy đủ εἶπόν σοι περὶ ἐμοῦ. Không thêm diễn giải về động cơ hoặc ý nghĩa thần học.'
  naturalness: Câu văn rõ ràng, tự nhiên trong tiếng Việt hiện đại và giữ được giọng đối thoại trang trọng. Cách gọi “ông” phù hợp với ngữ cảnh Đức Giê-su nói với Phi-lát. “Điều này do chính ông nói ra” hơi mang sắc thái văn viết, nhưng phù hợp với văn phong Kinh Thánh hiện đại và không gây khó hiểu.
  terminology: “Đức Giê-su” là cách gọi tôn kính thông dụng trong tiếng Việt; “đáp,” “điều này,” và “về tôi” nhất quán về sắc thái trang trọng. Không có thuật ngữ thần học nào bị áp đặt hoặc cần điều chỉnh.
