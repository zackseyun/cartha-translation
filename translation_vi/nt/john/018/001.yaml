  - severity: low
    issue: Dùng “Ngài” thay cho đại từ tường thuật trung tính.
    rationale: “Ngài” là kính ngữ và thêm sắc thái tôn kính không được đánh dấu trong nguyên văn. “Người” phù hợp hơn với mức độ đánh dấu của tiếng Hy Lạp trong văn cảnh này.
  - severity: low
    issue: Thiếu đại từ sở hữu ở lần nhắc đầu về các môn đệ.
    rationale: “các môn đồ” có thể hiểu theo ngữ cảnh, nhưng τοῖς μαθηταῖς αὐτοῦ được diễn đạt đầy đủ, tự nhiên bằng “các môn đệ của mình”.
