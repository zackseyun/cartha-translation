source:
  edition: SBLGNT
  text: Ταῦτα ⸀εἰπὼν Ἰησοῦς ἐξῆλθεν σὺν τοῖς μαθηταῖς αὐτοῦ πέραν τοῦ χειμάρρου ⸀τοῦ Κεδρὼν ὅπου ἦν κῆπος, εἰς ὃν εἰσῆλθεν αὐτὸς καὶ οἱ μαθηταὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/001.yaml
  text: After saying these things[a], Jesus went out with his disciples across the Kidron Valley, where there was a garden, into which he and his disciples entered.
translation:
  language: vi
  text: Sau khi nói những điều ấy, Giê-su cùng các môn đệ của mình đi ra, sang bên kia khe Kít-rôn[a], nơi có một khu vườn. Người cùng các môn đệ của mình đi vào khu vườn ấy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “suối Kít-rôn” hoặc “thung lũng Kít-rôn”. Từ Hy Lạp chỉ một khe hay dòng nước chảy theo mùa.
    reason: Giữ lại phạm vi nghĩa của χείμαρρος, vì từ này có thể nói đến cả dòng nước theo mùa lẫn khe hoặc thung lũng mà dòng nước ấy chảy qua.
lexical_decisions:
- source_word: Ταῦτα εἰπὼν
  choice: Sau khi nói những điều ấy
  rationale: Phân từ bất định quá khứ diễn tả hành động xảy ra trước động từ chính; cách dịch này tự nhiên trong tiếng Việt và giữ rõ trình tự của câu.
- source_word: ἐξῆλθεν
  choice: đi ra
  rationale: Giữ nghĩa cụ thể của động từ và phù hợp với lối kể chuyện, không diễn giải rộng thành “rời khỏi nơi ấy”.
- source_word: σὺν τοῖς μαθηταῖς αὐτοῦ
  choice: cùng các môn đồ
  rationale: Diễn đạt tự nhiên ý đồng hành của σύν với cách cho; quan hệ sở hữu đã rõ nhờ chủ thể Chúa Giê-su nên không cần lặp “của Ngài”.
- source_word: πέραν τοῦ χειμάρρου τοῦ Κεδρών
  choice: băng qua khe Kít-rôn[a]
  rationale: 'πέραν trong ngữ cảnh chuyển động chỉ việc sang phía bên kia. “Khe” giữ được phần nào phạm vi nghĩa của χείμαρρος: một khe hoặc dòng nước chảy theo mùa, mà không buộc câu văn phải chọn riêng nghĩa “suối” hay “thung lũng”.'
- source_word: ὅπου ἦν κῆπος
  choice: Nơi đó có một khu vườn
  rationale: Diễn đạt tự nhiên cấu trúc chỉ nơi chốn và sự hiện hữu; κῆπος được dịch theo nghĩa thông thường là “khu vườn”.
- source_word: εἰς ὃν εἰσῆλθεν
  choice: đi vào vườn
  rationale: Giữ rõ hướng chuyển động do εἰς biểu thị, đồng thời tránh cấu trúc đại từ quan hệ gượng gạo trong tiếng Việt.
- source_word: αὐτὸς καὶ οἱ μαθηταὶ αὐτοῦ
  choice: Ngài cùng các môn đồ
  rationale: Tái hiện đầy đủ chủ thể gồm Chúa Giê-su và các môn đồ, nhưng không thêm sắc thái nhấn mạnh “chính Ngài” vốn không bắt buộc trong ngữ cảnh.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “môn đồ” vì đây là thuật ngữ Kinh Thánh quen thuộc trong tiếng Việt; phiên âm tên riêng là “Kít-rôn”. Tách câu dài Hy Lạp thành hai câu tiếng Việt để lời kể sáng rõ mà không làm thay đổi quan hệ ý nghĩa.
