  text: Ἦν δὲ Σίμων Πέτρος ἑστὼς καὶ θερμαινόμενος. εἶπον οὖν αὐτῷ· Μὴ καὶ σὺ ἐκ τῶν μαθητῶν αὐτοῦ εἶ; ⸀ἠρνήσατο ἐκεῖνος καὶ εἶπεν· Οὐκ εἰμί.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/025.yaml
  text: Simon Peter was standing and warming himself. So they said to him[a], “You are not also one of his disciples, are you?” He denied it and said, “I am not.”
translation:
  language: vi
  text: 'Còn Si-môn Phi-e-rơ đang đứng sưởi ấm. Vì thế, họ hỏi ông: “Anh cũng không phải là một trong các môn đồ của người ấy, phải không?”[a] Ông chối và nói: “Tôi không phải.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Chắc anh cũng không phải là một trong các môn đồ của người ấy?” Trong tiếng Hy Lạp, cách đặt câu hỏi ở đây hướng đến câu trả lời phủ định.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἦν δὲ
  choice: Còn ... đang
  rationale: δέ là từ nối nhẹ, đưa câu chuyện trở lại với Phi-e-rơ; “Còn” thể hiện tự nhiên sự chuyển cảnh này mà không tạo ra một mốc thời gian không có trong nguyên văn.
- source_word: ἑστὼς καὶ θερμαινόμενος
  choice: đang đứng sưởi ấm
  rationale: Diễn đạt tư thế đang tiếp diễn và hành động tự sưởi ấm; không thêm “bên đống lửa” vì chi tiết ấy chỉ có trong ngữ cảnh, không được nói rõ ở câu này.
- source_word: εἶπον οὖν αὐτῷ
  choice: Vì thế, họ hỏi ông
  rationale: οὖν biểu thị mối liên hệ suy ra hoặc tiếp nối; “hỏi” phù hợp với câu nghi vấn trực tiếp theo sau và tự nhiên hơn “nói với ông” trong tiếng Việt.
- source_word: Μὴ καὶ σὺ ... εἶ;
  choice: Anh cũng không phải là ... phải không?
  rationale: Cấu trúc câu hỏi với μή hướng người nghe đến câu trả lời phủ định; cách hỏi đuôi tiếng Việt giữ được định hướng ấy, còn καὶ σὺ được thể hiện bằng “anh cũng”.
- source_word: ἐκ τῶν μαθητῶν αὐτοῦ
  choice: một trong các môn đồ của người ấy
  rationale: ἐκ với sở hữu cách diễn tả tư cách thuộc về một nhóm. “Một trong các môn đồ” là cách nói tự nhiên và chính xác; “người ấy” giữ quy chiếu ngôi thứ ba mà không thêm cách xưng hô mang sắc thái tôn kính hay khinh miệt không có trong nguyên văn.
- source_word: ἠρνήσατο ἐκεῖνος
  choice: Ông chối
  rationale: Động từ diễn tả sự phủ nhận; tiếng Việt có thể dùng “chối” không cần thêm tân ngữ. Đại từ “ông” giữ chủ thể là Phi-e-rơ mà không dịch cứng sắc thái nhấn nhẹ của ἐκεῖνος.
- source_word: Οὐκ εἰμί
  choice: Tôi không phải
  rationale: Giữ lời phủ nhận ngắn gọn và tỉnh lược của nguyên văn, không thêm “Không” hay “một trong số họ”.
theological_decisions:
- issue: Phạm vi lời chối của Phi-e-rơ
  choice: Trình bày đây là lời phủ nhận việc mình thuộc nhóm môn đồ của Đức Chúa Jêsus, đúng theo câu hỏi ngay trước đó.
  alternative: Mở rộng thành “Tôi không phải là một trong số họ” hoặc diễn giải như một lời phủ nhận rộng hơn về mối liên hệ với Đức Chúa Jêsus.
  rationale: Nguyên văn ngắn gọn và tỉnh lược. Bản dịch không mở rộng lời chối thành một tuyên bố thần học vượt quá nội dung trực tiếp của câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “môn đồ” để giữ thuật ngữ quen thuộc của văn mạch Tin Lành Giăng; câu hỏi đuôi truyền đạt tự nhiên kỳ vọng phủ định của nguyên văn.
