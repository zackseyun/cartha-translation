  to: Nhưng các ông có tục lệ là tôi phóng thích cho các ông một người vào dịp Lễ Vượt Qua. Vậy, các ông có muốn tôi phóng thích cho các ông Vua dân Do Thái[a] không?
  rationale: Chỉnh trật tự cụm thời gian để câu tiếng Việt trôi chảy hơn, vẫn giữ nguyên việc “phóng thích cho các ông” ở cả hai lần. Chỉnh cách diễn đạt trong chú thích để phương án nghĩa địa phương/dân cư tự nhiên và rõ hơn, không thay đổi lựa chọn chính hoặc ý nghĩa câu.
