  text: ἔστιν δὲ συνήθεια ὑμῖν ἵνα ἕνα ⸂ἀπολύσω ὑμῖν⸃ ἐν τῷ πάσχα· βούλεσθε οὖν ⸄ἀπολύσω ὑμῖν⸅ τὸν βασιλέα τῶν Ἰουδαίων;
base_translation:
  language: en
  yaml_path: translation/nt/john/018/039.yaml
  text: But you have a custom that I release one man for you at the Passover[a]. So do you want me to release to you the King of the Jews?
translation:
  language: vi
  text: Nhưng các ông có tục lệ là tôi phóng thích cho các ông một người vào dịp Lễ Vượt Qua. Vậy, các ông có muốn tôi phóng thích cho các ông Vua dân Do Thái[a] không?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Vua của người Giu-đê.” Từ Hy Lạp này có thể chỉ dân Do Thái hoặc người Giu-đê, tùy văn cảnh; tại đây, nó nằm trong tước hiệu cố định được dùng trong trình thuật thương khó.'
    reason: alternative_reading
lexical_decisions:
- source_word: συνήθεια
  choice: tục lệ
  rationale: Diễn đạt một thông lệ xã hội đã được thiết lập trong bối cảnh xét xử và lễ hội; tự nhiên hơn “thói quen”, vốn dễ gợi tập quán cá nhân.
- source_word: ἵνα ἕνα ἀπολύσω ὑμῖν
  choice: là ... tôi phóng thích cho các ông một người
  rationale: “Là” giới thiệu nội dung của tục lệ; “một người” làm rõ đối tượng chỉ người của ἕνα trong tiếng Việt, còn “phóng thích” phù hợp với việc nhà cầm quyền trả tự do cho tù nhân.
- source_word: ἀπολύω
  choice: phóng thích
  rationale: Phù hợp với ngữ cảnh pháp lý và được giữ nhất quán ở cả hai lần xuất hiện.
- source_word: ἐν τῷ πάσχα
  choice: vào dịp Lễ Vượt Qua
  rationale: Truyền đạt tự nhiên ý nghĩa thời gian của giới từ ἐν trong một thông lệ gắn với kỳ lễ.
- source_word: βούλεσθε οὖν
  choice: Vậy, các ông có muốn
  rationale: “Vậy” giữ sắc thái suy luận/chuyển tiếp của οὖν; “có muốn” là cách diễn đạt hiện đại, tự nhiên của βούλεσθε.
- source_word: τὸν βασιλέα τῶν Ἰουδαίων
  choice: Vua dân Do Thái
  rationale: Giữ cụm từ như một tước hiệu/lời cáo buộc cố định trong trình thuật thương khó. Viết hoa “Vua” để biểu thị tính chất tước hiệu trong lời của Phi-lát.
theological_decisions:
- issue: Cách dịch Ἰουδαίων trong tước hiệu τὸν βασιλέα τῶν Ἰουδαίων
  choice: Vua dân Do Thái
  alternative: Vua dân Giu-đê
  rationale: Trong trình thuật thương khó của Giăng, cụm này là tước hiệu/lời cáo buộc mang tính vương quyền và Đấng Mê-si dành cho Đức Chúa Jêsus. “Dân Do Thái” giữ nghĩa lịch sử và văn mạch quen thuộc mà không âm thầm giới hạn thành căn tính địa phương; phương án “dân Giu-đê” được ghi chú để bảo tồn độ rộng nghĩa của từ Hy Lạp.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Các ông” phù hợp với lời Phi-lát nói với nhóm người đối diện, đồng thời tránh sắc thái suồng sã. Cấu trúc được sắp xếp tự nhiên theo tiếng Việt nhưng vẫn giữ cả hai lần “phóng thích cho các ông” của nguyên văn.
