    rationale: Trong tiếng Việt hiện đại, “Vua của người Giu-đê” diễn đạt rõ quan hệ sở hữu/tước hiệu và căn tính nhóm người, đồng thời vẫn bảo lưu khả năng nghĩa Judeans của Ἰουδαίων.
