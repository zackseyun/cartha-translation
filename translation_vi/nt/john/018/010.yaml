id: JHN.18.10
reference: John 18:10
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Σίμων οὖν Πέτρος ἔχων μάχαιραν εἵλκυσεν αὐτὴν καὶ ἔπαισεν τὸν τοῦ ἀρχιερέως δοῦλον καὶ ἀπέκοψεν αὐτοῦ τὸ ⸀ὠτάριον τὸ δεξιόν. ἦν δὲ ὄνομα τῷ δούλῳ Μάλχος.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/010.yaml
  text: Then Simon Peter[a], having a sword, drew it and struck the high priest’s servant and cut off his right ear. Now the servant’s name was Malchus.
translation:
  language: vi
  text: Bấy giờ, Si-môn Phi-e-rơ có một thanh gươm; ông rút gươm ra, đánh người nô lệ[a] của thầy tế lễ thượng phẩm và chém đứt tai phải của người ấy. Người nô lệ đó tên là Man-chu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “người đầy tớ”. Từ Hy Lạp doulos có thể chỉ “nô lệ” hoặc “đầy tớ”, tùy ngữ cảnh.
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: Bấy giờ
  rationale: Diễn đạt sự tiếp nối của câu chuyện và mối liên hệ với cảnh trước một cách tự nhiên, không biến liên từ thành một kết luận lô-gích quá mạnh.
- source_word: ἔχων μάχαιραν
  choice: có một thanh gươm
  rationale: Giữ nghĩa của phân từ ἔχων và dùng “gươm” là cách gọi rộng, quen thuộc cho μάχαιρα; nguyên ngữ không buộc phải hiểu cụ thể là dao găm.
- source_word: εἵλκυσεν αὐτὴν
  choice: rút gươm ra
  rationale: Đây là cách nói tiếng Việt tự nhiên về hành động rút vũ khí, đồng thời nêu lại danh từ thay cho đại từ để câu rõ ràng.
- source_word: ἔπαισεν
  choice: đánh
  rationale: Truyền đạt trực tiếp hành động tấn công, tự nhiên trong tiếng Việt hiện đại và không cổ hóa văn phong.
- source_word: τὸν τοῦ ἀρχιερέως δοῦλον
  choice: người nô lệ của thầy tế lễ thượng phẩm
  rationale: “Nô lệ” thể hiện rõ địa vị lệ thuộc hàm trong δοῦλος và quan hệ sở thuộc ở đây; “thầy tế lễ thượng phẩm” là thuật ngữ trang trọng, dễ hiểu.
- source_word: ἀπέκοψεν
  choice: chém đứt
  rationale: Trong bối cảnh dùng gươm, “chém đứt” tự nhiên và cụ thể hơn “cắt đứt”, diễn tả việc phần tai bị lìa ra.
- source_word: ὠτάριον τὸ δεξιόν
  choice: tai phải
  rationale: ὠτάριον là dạng giảm nhẹ nhưng trong ngữ cảnh chỉ đơn giản là “tai”; không đủ căn cứ để thu hẹp thành “dái tai”.
- source_word: ἦν δὲ ὄνομα τῷ δούλῳ Μάλχος
  choice: Người nô lệ đó tên là Man-chu
  rationale: Chuyển cấu trúc sở hữu bằng cách nói tự nhiên trong tiếng Việt; δέ mở ra thông tin nhận diện bổ sung, còn Μάλχος được phiên âm thành tên quen thuộc “Man-chu”.
theological_decisions:
- issue: Cách dịch δοῦλος
  choice: nô lệ
  alternative: đầy tớ
  rationale: Quan hệ “của thầy tế lễ thượng phẩm” khiến địa vị lệ thuộc nổi bật, nên bản văn chính dùng “nô lệ”; chú thích giữ lại khả năng dịch rộng hơn là “đầy tớ” mà không xóa sự căng thẳng từ vựng.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng và dễ hiểu. Câu được chia bằng dấu chấm phẩy để tránh chuỗi động từ nặng nề nhưng vẫn giữ nhịp hành động liên tục của nguyên ngữ. Dấu chú thích [a] được đặt ngay sau từ ngữ mà chú thích giải thích.
