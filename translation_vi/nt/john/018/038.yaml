revisions:
- from: 'Phi-lát nói với Ngài: “Chân lý là gì?” Nói xong, ông lại đi ra gặp những người Do Thái[a] và bảo họ: “Ta không tìm thấy nơi người này lý do nào để buộc tội.”'
  to: 'Phi-lát nói với Ngài: “Chân lý là gì?” Nói xong, ông lại đi ra gặp những người Do Thái[a] và nói với họ: “Tôi không thấy có căn cứ nào để buộc tội người này.”'
  rationale: Bản sửa thay cách diễn đạt pháp lý gượng ép bằng “căn cứ nào để buộc tội người này,” phản ánh chính xác αἰτία trong bối cảnh xét xử. “Tôi” hiện đại hóa lời trực tiếp của Phi-lát mà không thêm sắc thái địa vị. Chú thích được chỉnh nhẹ để rõ rằng cách hiểu hẹp của Ἰουδαίους là theo ngữ cảnh, không phải một khẳng định về toàn thể người Do Thái.
  reviewer_model: gpt-5.6-terra
