source:
  edition: SBLGNT
  text: λέγει αὐτῷ ὁ Πιλᾶτος· Τί ἐστιν ἀλήθεια; Καὶ τοῦτο εἰπὼν πάλιν ἐξῆλθεν πρὸς τοὺς Ἰουδαίους, καὶ λέγει αὐτοῖς· Ἐγὼ οὐδεμίαν ⸂εὑρίσκω ἐν αὐτῷ αἰτίαν⸃·
base_translation:
  language: en
  yaml_path: translation/nt/john/018/038.yaml
  text: Pilate said to him[a], “What is truth?” After saying this, he went out again to the Jews and said to them, “I find no case against him.”
translation:
  language: vi
  text: 'Phi-lát nói với Ngài: “Chân lý là gì?” Nói xong, ông lại đi ra gặp những người Do Thái[a] và nói với họ: “Tôi không thấy có căn cứ nào để buộc tội người này.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “các nhà lãnh đạo Do Thái.” Trong sách Giăng, “những người Do Thái” đôi khi chỉ cụ thể hơn những giới chức tại Giu-đê hoặc nhóm đại diện chống đối Đức Chúa Jêsus trong ngữ cảnh.
    reason: alternative_reading
lexical_decisions:
- source_word: λέγει αὐτῷ ὁ Πιλᾶτος
  choice: Phi-lát nói với Ngài
  rationale: Động từ hiện tại λέγει được dùng như hiện tại lịch sử; tiếng Việt kể chuyện tự nhiên bằng “nói”. Đại từ kính trọng “Ngài” phù hợp văn phong Kinh Thánh trang trọng mà không thêm danh xưng không có trong nguyên văn.
- source_word: Τί ἐστιν ἀλήθεια;
  choice: Chân lý là gì?
  rationale: ἀλήθεια không có mạo từ và chỉ khái niệm sự thật/chân lý nói chung. Trong câu hỏi mang tính khái quát này, “chân lý” tự nhiên và sát nghĩa hơn “sự thật”.
- source_word: Καὶ τοῦτο εἰπὼν
  choice: Nói xong
  rationale: Phân từ bất định quá khứ εἰπών diễn tả hành động xảy ra trước hành động chính; “Nói xong” truyền đạt gọn và tự nhiên trình tự ấy.
- source_word: πάλιν ἐξῆλθεν πρὸς τοὺς Ἰουδαίους
  choice: ông lại đi ra gặp những người Do Thái[a]
  rationale: “Lại đi ra” giữ nghĩa lặp lại của πάλιν và chuyển động ra ngoài của ἐξῆλθεν. Cụm “những người Do Thái” giữ dạng từ vựng của Ἰουδαίους, còn chú thích nêu phạm vi hẹp hơn có thể có trong ngữ cảnh.
- source_word: καὶ λέγει αὐτοῖς
  choice: và bảo họ
  rationale: λέγει là hiện tại lịch sử; “bảo họ” là cách kể tự nhiên trong tiếng Việt và tránh lặp từ “nói” quá gần.
- source_word: Ἐγὼ οὐδεμίαν εὑρίσκω ἐν αὐτῷ αἰτίαν
  choice: Ta không tìm thấy nơi người này lý do nào để buộc tội
  rationale: Trong bối cảnh xét xử, αἰτία là lý do hoặc căn cứ để cáo buộc. Cách dịch này giữ sắc thái pháp lý, đồng thời “nơi người này” phản ánh ἐν αὐτῷ rõ hơn cách nói thuần thành ngữ “chống lại người này”.
theological_decisions:
- issue: Phạm vi chỉ người của τοὺς Ἰουδαίους trong trình thuật thương khó
  choice: Giữ “những người Do Thái” trong chính văn và thêm chú thích về nghĩa theo ngữ cảnh.
  alternative: các nhà lãnh đạo Do Thái; những người Giu-đê
  rationale: Nguyên văn dùng danh từ Ἰουδαῖοι, nhưng trong ngữ cảnh này có thể chỉ cụ thể giới lãnh đạo hoặc nhóm đại diện đang chống đối Đức Chúa Jêsus, chứ không nhất thiết toàn thể dân Do Thái. Chú thích bảo tồn sự căng thẳng ngữ nghĩa và ngăn cách hiểu quá rộng.
- issue: Sắc thái câu hỏi Τί ἐστιν ἀλήθεια;
  choice: Dịch trực tiếp “Chân lý là gì?” mà không thêm sắc thái hoài nghi, mỉa mai hay chân thành.
  alternative: Chân lý nào?; Sự thật là gì?
  rationale: Nguyên văn không xác định giọng điệu hoặc động cơ của Phi-lát; bản dịch không nên tự ý giải quyết sự mơ hồ đó.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Phi-lát”, “Ngài”, “Ta” theo lối văn Kinh Thánh quen thuộc; tránh ngôn ngữ giáo phái và không gán cho câu hỏi của Phi-lát một thái độ mà nguyên văn không nêu.
