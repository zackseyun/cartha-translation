  text: ὡς οὖν εἶπεν ⸀αὐτοῖς· Ἐγώ εἰμι, ἀπῆλθον εἰς τὰ ὀπίσω καὶ ἔπεσαν χαμαί.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/006.yaml
  text: So when he said to them[a], “I am he,” they went backward and fell to the ground.
translation:
  language: vi
  text: 'Vì vậy, khi Ngài nói với họ: “Chính là Ta[a],” họ lùi lại và ngã xuống đất.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay, sát chữ hơn: “Ta là.” Cụm từ Hy Lạp này cũng có thể gợi lại những lời “Ta là” đặc trưng trong sách Giăng.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὡς οὖν
  choice: Vì vậy, khi
  rationale: Diễn đạt cả quan hệ suy luận của οὖν và ý nghĩa thời gian của ὡς bằng tiếng Việt tự nhiên.
- source_word: εἶπεν αὐτοῖς
  choice: Ngài nói với họ
  rationale: Bám sát cấu trúc λέγω với bổ ngữ gián tiếp αὐτοῖς; đại từ “Ngài” giữ giọng văn trang trọng và chỉ rõ Chúa Giê-su trong ngữ cảnh.
- source_word: Ἐγώ εἰμι
  choice: Chính là Ta
  rationale: Trong cảnh bắt giữ, câu này trực tiếp xác nhận căn tính để đáp lại người họ đang tìm. “Chính là Ta” tự nhiên trong tiếng Việt, còn nghĩa sát chữ và âm vang thần học được giữ trong chú thích.
- source_word: ἀπῆλθον εἰς τὰ ὀπίσω
  choice: họ lùi lại
  rationale: Diễn đạt rõ chuyển động về phía sau, tự nhiên hơn cách nói cứng “đi về phía sau” mà không thêm nguyên nhân tâm lý.
- source_word: ἔπεσαν χαμαί
  choice: ngã xuống đất
  rationale: Truyền đạt trực tiếp chuyển động ngã xuống mặt đất của ἔπεσαν χαμαί.
theological_decisions:
- issue: Cách dịch Ἐγώ εἰμι trong văn mạch Giăng, nơi cụm từ có thể mang âm vang thần học
  choice: Chính là Ta
  alternative: Ta là
  rationale: Văn mạch trước mắt thiên về lời tự nhận diện, nên bản văn chính dùng cách nói tiếng Việt tự nhiên. Tuy vậy, bản dịch sát chữ “Ta là” và khả năng liên hệ với những lời “Ta là” đặc trưng trong sách Giăng được bảo tồn trong chú thích, không giải quyết dứt khoát sự căng thẳng thần học.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “Ngài” trong lời thuật và “Ta” trong lời Chúa Giê-su; tránh lối diễn đạt quá cổ hoặc giải thích vượt quá nguyên văn.
