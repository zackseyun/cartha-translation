source:
  edition: SBLGNT
  text: Εἰσῆλθεν οὖν ⸂πάλιν εἰς τὸ πραιτώριον⸃ ὁ Πιλᾶτος καὶ ἐφώνησεν τὸν Ἰησοῦν καὶ εἶπεν αὐτῷ· Σὺ εἶ ὁ βασιλεὺς τῶν Ἰουδαίων;
base_translation:
  language: en
  yaml_path: translation/nt/john/018/033.yaml
  text: So Pilate went back into the governor’s headquarters and called Jesus and said to him[b][a], “Are you the King of the Jews?”
translation:
  language: vi
  text: 'Vậy, Phi-lát lại đi vào dinh tổng đốc[a], gọi Chúa Giê-su và nói với Ngài: “Ông có phải là Vua của người Do Thái[b] không?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “praetorium”; tức dinh thự hoặc trụ sở chính thức của tổng đốc La Mã.
    reason: lexical_alternative
  - marker: b
    text: Hay “người Giu-đê.” Từ Hy Lạp có thể chỉ người Do Thái nói chung hoặc, trong một số văn cảnh, người thuộc xứ Giu-đê.
    reason: alternative_reading
lexical_decisions:
- source_word: Εἰσῆλθεν οὖν πάλιν
  choice: Vì vậy, ... lại đi vào
  rationale: Cụm này vừa nối tiếp diễn tiến bằng οὖν vừa diễn tả việc Phi-lát trở vào bằng πάλιν. Cách nói này tự nhiên trong tiếng Việt mà vẫn giữ đủ ý của nguyên văn.
- source_word: πραιτώριον
  choice: dinh tổng đốc
  rationale: Chỉ nơi ở hoặc trụ sở chính thức của tổng đốc La Mã. “Dinh tổng đốc” rõ nghĩa, trang trọng và quen thuộc hơn từ phiên âm chuyên môn.
- source_word: ἐφώνησεν τὸν Ἰησοῦν
  choice: gọi Đức Chúa Jêsus đến
  rationale: φωνέω trong ngữ cảnh này có nghĩa gọi người nào đến. Thêm “đến” làm rõ ý gọi vào mà không nâng sắc thái lên thành mệnh lệnh mạnh như “triệu đến”.
- source_word: εἶπεν αὐτῷ
  choice: nói với Ngài
  rationale: Giữ động từ khái quát λέγω là “nói” thay vì diễn giải thành “hỏi”; hình thức nghi vấn đã thể hiện trong lời trích dẫn.
- source_word: Σὺ εἶ ὁ βασιλεὺς
  choice: Ông có phải là Vua ... không?
  rationale: Cấu trúc nghi vấn tự nhiên trong tiếng Việt truyền đạt câu hỏi trực tiếp và sự nhấn mạnh của đại từ σύ. “Vua” được viết hoa vì được dùng như tước hiệu trong lời buộc tội chính trị.
- source_word: τῶν Ἰουδαίων
  choice: dân Do Thái
  rationale: Trong lời cáo buộc trước tổng đốc La Mã, cụm quen dùng và phù hợp lịch sử là “Vua dân Do Thái”; khả năng mang nghĩa địa lý “người Giu-đê” được bảo lưu trong chú thích.
theological_decisions:
- issue: Cách dịch Ἰουδαίων trong tước hiệu hoàng gia
  choice: dân Do Thái
  alternative: người Giu-đê
  rationale: Bối cảnh là lời cáo buộc chính trị nhằm vào Đức Chúa Jêsus trước Phi-lát, nên “Vua dân Do Thái” phù hợp nhất. Tuy nhiên, Ἰουδαῖοι có thể mang sắc thái địa lý là người xứ Giu-đê trong một số văn cảnh, vì thế không loại bỏ khả năng ấy mà ghi ở chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “dinh tổng đốc” thay thuật ngữ vay mượn khó hiểu; giữ lối xưng hô “Ông” của Phi-lát với Đức Chúa Jêsus để phản ánh bối cảnh xét xử, không hàm ý tôn kính hay xúc phạm quá mức.
