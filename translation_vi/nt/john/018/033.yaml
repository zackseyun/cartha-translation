revisions:
- from: 'Vì vậy, Phi-lát lại đi vào dinh tổng đốc[a], gọi Đức Chúa Jêsus đến và nói với Ngài: “Ông có phải là Vua dân Do Thái[b] không?”'
  to: 'Vậy, Phi-lát lại đi vào dinh tổng đốc[a], gọi Chúa Giê-su và nói với Ngài: “Ông có phải là Vua của người Do Thái[b] không?”'
  rationale: Bản sửa loại bỏ danh xưng không có trong nguyên văn và lối chính tả mang tính truyền thống riêng; không thêm ý «đến» cho động từ «gọi»; đồng thời sửa chú thích πραιτώριον để phản ánh đúng nghĩa lịch sử-ngữ nghĩa. Không thay đổi nội dung hay giải quyết dứt khoát sự mơ hồ có thể có của Ἰουδαίων.
  reviewer_model: gpt-5.6-terra
