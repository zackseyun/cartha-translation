  text: πάλιν οὖν ⸀ἠρνήσατο Πέτρος· καὶ εὐθέως ἀλέκτωρ ἐφώνησεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/027.yaml
  text: Then Peter denied it again[a], and immediately a rooster crowed.
translation:
  language: vi
  text: Bấy giờ, Phi-e-rơ lại chối[a], và ngay lập tức gà trống gáy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Bấy giờ, Phi-e-rơ lại chối điều đó”; tiếng Hy Lạp không nêu rõ đối tượng bị chối, nhưng ngữ cảnh cho thấy đó là điều trong câu hỏi ngay trước.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν
  choice: lại
  rationale: Trạng từ diễn tả sự lặp lại, tự nhiên và ngắn gọn trong mạch các lần Phi-e-rơ chối.
- source_word: οὖν
  choice: Bấy giờ
  rationale: Tiểu từ nối kết có sắc thái suy diễn hoặc tiếp diễn; “Bấy giờ” diễn đạt tự nhiên bước kế tiếp của câu chuyện mà không nhấn quá mức quan hệ kết quả.
- source_word: ἠρνήσατο
  choice: chối
  rationale: Động từ ἀρνέομαι ở đây chỉ việc phủ nhận điều vừa được hỏi. Tiếng Hy Lạp không nêu rõ bổ ngữ, nên bản dịch giữ cách nói không có bổ ngữ để bảo toàn độ hàm hồ của nguyên văn.
- source_word: Πέτρος
  choice: Phi-e-rơ
  rationale: Dạng phiên âm tên riêng quen thuộc trong tiếng Việt.
- source_word: καὶ
  choice: và
  rationale: Liên từ đơn giản nối lời chối của Phi-e-rơ với sự việc xảy ra ngay sau đó.
- source_word: εὐθέως
  choice: ngay lập tức
  rationale: Giữ rõ sắc thái tức thời giữa lời chối và tiếng gà gáy.
- source_word: ἀλέκτωρ
  choice: gà trống
  rationale: Cách gọi rõ ràng, thông dụng trong tiếng Việt hiện đại.
- source_word: ἐφώνησεν
  choice: gáy
  rationale: Dù động từ có nghĩa rộng là phát tiếng hoặc kêu lên, với chủ ngữ là gà trống, “gáy” là cách diễn đạt tự nhiên và chính xác theo ngữ cảnh.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Giữ câu ngắn, nhịp kể trực tiếp; không tự ý thêm bổ ngữ vào động từ “chối” trong chính văn.
