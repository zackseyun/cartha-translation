base_translation:
  language: en
  yaml_path: translation/nt/john/018/005.yaml
  text: They answered him, “Jesus the Nazarene.” He said to them, “I am he.” Now Judas, who was betraying him, was also standing with them.
translation:
  language: vi
  text: 'Họ đáp: “Giê-su người Na-xa-rét.” Ngài nói với họ: “Chính là tôi.” Giu-đa, kẻ đang giao nộp Ngài, cũng đứng với họ.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰησοῦν τὸν Ναζωραῖον
  choice: Giê-su người Na-xa-rét
  rationale: Diễn đạt tự nhiên trong tiếng Việt, giữ nguyên cách xác định Giê-su theo quê quán/xuất thân.
- source_word: Ἐγώ εἰμι
  choice: Chính là tôi
  rationale: Trong ngữ cảnh trả lời câu hỏi họ đang tìm ai, cụm này có nghĩa trực tiếp là tự nhận mình chính là người ấy; cách dịch vẫn giữ sắc thái nhấn mạnh của đại từ ἐγώ mà không áp đặt một cách đọc thần học từ công thức này.
- source_word: ὁ παραδιδοὺς αὐτὸν
  choice: kẻ phản bội Ngài
  rationale: Động từ παραδίδωμι theo nghĩa đen là giao nộp; trong ngữ cảnh Giu-đa, 'phản bội' chuyển đạt rõ vai trò đang diễn ra, phù hợp cách nói tự nhiên hiện đại.
- source_word: εἱστήκει ... μετ’ αὐτῶν
  choice: đang đứng cùng với họ
  rationale: Giữ hình ảnh cụ thể của động từ 'đứng' và sự liên kết của Giu-đa với nhóm đến bắt Giê-su.
theological_decisions:
- issue: Cách dịch Ἐγώ εἰμι và khả năng gợi liên hệ thần học
  choice: Chính là tôi
  alternative: Ta là / Tôi là Đấng ấy
  rationale: Ngữ pháp và ngữ cảnh cho phép hiểu là câu trả lời xác nhận danh tính với bổ ngữ được hàm ý. 'Chính là tôi' giữ sự nhấn mạnh và chức năng đối thoại, không phủ nhận khả năng độc giả nhận ra âm vang rộng hơn trong văn mạch Giăng, đồng thời không biến âm vang ấy thành lời giải thích ngay trong bản dịch.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Ngài” cho Giê-su để giữ sự tôn kính; câu ngắn, trực tiếp, phù hợp nhịp kể của nguyên văn.
