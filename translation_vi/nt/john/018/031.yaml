source:
  edition: SBLGNT
  text: εἶπεν οὖν αὐτοῖς ⸀ὁ Πιλᾶτος· Λάβετε αὐτὸν ὑμεῖς, καὶ κατὰ τὸν νόμον ὑμῶν κρίνατε αὐτόν. ⸀εἶπον αὐτῷ οἱ Ἰουδαῖοι· Ἡμῖν οὐκ ἔξεστιν ἀποκτεῖναι οὐδένα·
base_translation:
  language: en
  yaml_path: translation/nt/john/018/031.yaml
  text: So Pilate said to them[a], “Take him yourselves and judge him according to your law.” The Jews said to him, “It is not lawful for us to put anyone to death.”
translation:
  language: vi
  text: 'Vậy, Phi-lát nói với họ: “Các ông tự đem người này đi và xét xử theo luật của các ông.” Những người Do Thái[a] nói với ông: “Chúng tôi không được phép xử tử bất cứ ai.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn Hy Lạp dùng cụm “những người Do Thái” (hoi Ioudaioi). Trong ngữ cảnh này, cụm từ chỉ nhóm người đang nói với Phi-lát—có thể gồm các nhà chức trách Do Thái hoặc những người tố cáo—chứ không phải toàn thể dân Do Thái.
    reason: Làm rõ phạm vi quy chiếu theo ngữ cảnh của οἱ Ἰουδαῖοι và tránh cách hiểu quy chụp toàn thể dân Do Thái.
lexical_decisions:
- source_word: οὖν
  choice: Vì vậy
  rationale: Giữ quan hệ suy luận và mạch kể của câu; tự nhiên trong văn xuôi tiếng Việt hiện đại.
- source_word: Λάβετε αὐτὸν ὑμεῖς
  choice: Chính các ông hãy đem người này đi
  rationale: “Chính các ông” thể hiện sự nhấn mạnh của đại từ ὑμεῖς; “người này” quy chiếu rõ đến Đức Giê-su mà không lặp tên vốn không có trong câu Hy Lạp.
- source_word: κατὰ τὸν νόμον ὑμῶν
  choice: theo luật của các ông
  rationale: Diễn đạt κατά như một tiêu chuẩn chi phối việc xét xử, đồng thời giữ sắc thái Phi-lát tách mình khỏi hệ thống luật ấy.
- source_word: κρίνατε
  choice: xét xử
  rationale: Trong bối cảnh pháp lý, “xét xử” tự nhiên và chính xác hơn “phán xét”, nhưng không thu hẹp thành một thủ tục tố tụng La Mã cụ thể.
- source_word: οἱ Ἰουδαῖοι
  choice: Những người Do Thái
  rationale: Giữ cách gọi hình thức của nguyên bản; chú thích xác định phạm vi quy chiếu trong ngữ cảnh để tránh hiểu là toàn thể dân Do Thái.
- source_word: οὐκ ἔξεστιν
  choice: không được phép
  rationale: Thể hiện điều không được luật pháp hay thẩm quyền cho phép bằng cách nói hiện đại, rõ ràng.
- source_word: ἀποκτεῖναι
  choice: xử tử
  rationale: Bối cảnh là thẩm quyền tư pháp áp dụng án chết; “xử tử” chuyển tải lực pháp lý rõ hơn “giết”.
- source_word: οὐδένα
  choice: bất cứ ai
  rationale: Giữ phạm vi phủ định phổ quát và phù hợp cú pháp tiếng Việt.
theological_decisions:
- issue: Phạm vi quy chiếu của οἱ Ἰουδαῖοι trong sách Giăng
  choice: Giữ “Những người Do Thái” trong chính văn và thêm chú thích rằng ở đây là các nhà chức trách hoặc những người Do Thái đang tố cáo Đức Giê-su trước Phi-lát.
  alternative: “Các nhà lãnh đạo Do Thái” hoặc “những người Giu-đê”
  rationale: Cách này bảo toàn lối diễn đạt của nguyên bản và tính phức tạp của thuật ngữ trong sách Giăng, đồng thời ngăn cách hiểu sai rằng câu nói quy cho toàn thể dân Do Thái.
- issue: Sắc thái pháp lý của οὐκ ἔξεστιν và ἀποκτεῖναι
  choice: “không được phép xử tử”
  alternative: “không hợp pháp để giết” hoặc “không có quyền kết án tử hình”
  rationale: Bản dịch giữ ý về sự không được phép và hành vi thi hành án chết, nhưng không xác định quá mức nguồn gốc hay phạm vi chính xác của sự hạn chế pháp lý mà câu Hy Lạp không nói rõ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “các ông” phù hợp lời Phi-lát nói với một nhóm nam giới có thẩm quyền; “Chính các ông” bảo toàn sự nhấn mạnh của đại từ Hy Lạp.
