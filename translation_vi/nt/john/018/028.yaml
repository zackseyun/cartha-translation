id: JHN.18.28
reference: John 18:28
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἄγουσιν οὖν τὸν Ἰησοῦν ἀπὸ τοῦ Καϊάφα εἰς τὸ πραιτώριον· ἦν δὲ πρωΐ· καὶ αὐτοὶ οὐκ εἰσῆλθον εἰς τὸ πραιτώριον, ἵνα μὴ μιανθῶσιν ⸀ἀλλὰ φάγωσιν τὸ πάσχα.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/028.yaml
  text: So they led Jesus from Caiaphas into the governor’s headquarters[a]. Now it was early morning. They themselves did not enter the headquarters, so that they would not be defiled[c][b], but could eat the Passover.
translation:
  language: vi
  text: Vậy, họ dẫn Giê-su từ Ca-i-pha đến dinh tổng đốc[a]. Lúc ấy là sáng sớm. Chính họ không vào trong dinh, để khỏi bị ô uế[b] và có thể ăn lễ Vượt Qua[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “Praetorium”; đây là nơi ở chính thức và trụ sở hành chính, xét xử của tổng đốc La Mã.'
    reason: lexical_alternative
  - marker: b
    text: “Bị ô uế” ở đây có nghĩa là trở nên không thanh sạch theo nghi lễ.
    reason: cultural_note
  - marker: c
    text: “Ăn lễ Vượt Qua” có thể chỉ riêng bữa ăn Vượt Qua, hoặc rộng hơn là những bữa ăn và nghi thức trong kỳ lễ Vượt Qua.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἄγουσιν
  choice: họ dẫn
  rationale: Thì hiện tại lịch sử được chuyển thành cách kể quá khứ theo văn mạch tiếng Việt; “dẫn” phù hợp với việc áp giải Đức Chúa Jêsus.
- source_word: οὖν
  choice: Vậy
  rationale: Giữ chức năng nối tiếp và suy dẫn trong trình thuật bằng một liên từ tự nhiên, trang trọng vừa phải.
- source_word: πραιτώριον
  choice: dinh tổng đốc
  rationale: Diễn đạt nơi ở và trụ sở xét xử chính thức của tổng đốc La Mã theo cách quen thuộc, dễ hiểu trong tiếng Việt.
- source_word: πρωΐ
  choice: sáng sớm
  rationale: Chỉ phần đầu của buổi sáng mà không xác định quá mức là đúng lúc rạng đông.
- source_word: αὐτοὶ
  choice: chính họ
  rationale: Giữ sắc thái nhấn mạnh của đại từ và sự tương phản giữa việc họ giao Đức Chúa Jêsus vào dinh với việc bản thân họ không bước vào.
- source_word: εἰσῆλθον
  choice: không vào trong
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt, nêu rõ họ không bước vào bên trong dinh.
- source_word: μιανθῶσιν
  choice: bị ô uế
  rationale: Giữ ý nghĩa ô uế về nghi lễ; chú thích làm rõ khía cạnh lễ nghi để tránh hiểu đơn thuần là bẩn về thể chất.
- source_word: φάγωσιν τὸ πάσχα
  choice: có thể ăn lễ Vượt Qua
  rationale: Giữ cách nói của nguyên văn và không quyết định rằng cụm từ chỉ riêng bữa ăn Vượt Qua hay rộng hơn là các bữa ăn trong kỳ lễ.
- source_word: Καϊάφα
  choice: Cai-phe
  rationale: Dùng dạng tên riêng quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
- source_word: Ἰησοῦν
  choice: Đức Chúa Jêsus
  rationale: Dùng dạng tên gọi trang trọng, quen thuộc với độc giả Kinh Thánh tiếng Việt; tước xưng kính trọng không nhằm thêm một mệnh đề thần học vào câu.
theological_decisions:
- issue: Ý nghĩa của cụm “ăn lễ Vượt Qua” đối với niên biểu cuộc thương khó
  choice: Giữ cụm “ăn lễ Vượt Qua” mà không thu hẹp đối tượng được ăn.
  alternative: Dịch là “ăn bữa Vượt Qua” hoặc “ăn các lễ vật trong kỳ lễ”.
  rationale: Nguyên văn rõ về hành động ăn nhưng phạm vi quy chiếu của “lễ Vượt Qua” vẫn được tranh luận. Bản dịch giữ nguyên sự căng thẳng về niên biểu thay vì ngầm giải quyết vấn đề hòa hợp các sách.
- issue: Tính chất của sự ô uế
  choice: Dùng “bị ô uế” trong chính văn và giải thích là ô uế theo nghi lễ trong chú thích.
  alternative: Dịch thẳng là “bị ô uế theo nghi lễ”.
  rationale: Cách chọn này bảo toàn tính cô đọng của μιανθῶσιν, đồng thời chú thích ngăn cách hiểu sai theo nghĩa vệ sinh hay đạo đức thuần túy.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu được chia theo nhịp kể tự nhiên của tiếng Việt; “chính họ” bảo toàn nét nhấn mạnh, còn các chú thích giữ lại thông tin văn hóa và sự mơ hồ thật sự của nguyên văn.
