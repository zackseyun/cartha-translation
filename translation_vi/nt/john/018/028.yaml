review_pass:
  verdict: revise
  source_fidelity: Bản dịch chuyển tải đúng mạch kể, địa điểm, thời điểm, sự nhấn mạnh ở αὐτοὶ, mục đích tránh ô uế nghi lễ, và giữ được tính chưa xác định của cụm φάγωσιν τὸ πάσχα. Tuy nhiên, “Đức Chúa Jêsus” thêm tước hiệu không có trong nguyên văn, còn dạng tên “Jêsus” không phù hợp với chuẩn chính tả Việt ngữ hiện đại hướng đến độc giả phổ thông.
  naturalness: Câu văn nhìn chung tự nhiên và trang trọng. “Dinh tổng đốc” và “sáng sớm” phù hợp. “Chính họ” diễn đạt tốt nét đối lập nhấn mạnh. Cần dùng dạng tên hiện đại “Giê-su”; “Ca-i-pha” là dạng phiên âm hiện đại, dễ nhận diện hơn.
  terminology: Dùng “ô uế” với chú thích về nghi lễ là chính xác. “Ăn lễ Vượt Qua” được giữ để không quyết định tranh luận về niên biểu; chú thích giải thích hợp lý. Chú thích a không nên nêu “Pháp đình” như một phương án dịch tương đương, vì πραιτώριον chỉ nơi ở/trụ sở hành chính–xét xử của tổng đốc, không đơn thuần là một pháp đình.
  issues:
