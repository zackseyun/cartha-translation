  to: Vậy, họ dẫn Giê-su từ Ca-i-pha đến dinh tổng đốc[a]. Lúc ấy là sáng sớm. Chính họ không vào trong dinh, để khỏi bị ô uế[b] và có thể ăn lễ Vượt Qua[c].
