    issue: Thêm tước hiệu “Đức Chúa” trước tên Giê-su
    rationale: Ἰησοῦν chỉ là tên riêng “Giê-su”; nguyên văn câu này không có κύριος hay một tước hiệu tương đương. Tước hiệu này nên được bỏ để bảo toàn độ chính xác của văn bản nguồn.
  - severity: low
    issue: Dạng tên “Jêsus” và “Cai-phe” mang tính truyền thống hơn là chuẩn Việt ngữ hiện đại
    rationale: “Giê-su” và “Ca-i-pha” phù hợp hơn với chính tả, cách phiên âm và mức độ dễ hiểu của tiếng Việt hiện đại.
  - severity: medium
    issue: Chú thích a gọi “Pháp đình” là phương án dịch
    rationale: “Pháp đình” thu hẹp nghĩa của πραιτώριον vào nơi xét xử; từ này cũng chỉ dinh/trụ sở chính thức của tổng đốc. Nên đưa “Praetorium” làm phương án phiên âm và giải thích chức năng của địa điểm.
