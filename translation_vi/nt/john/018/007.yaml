source:
  edition: SBLGNT
  text: πάλιν οὖν ⸂ἐπηρώτησεν αὐτούς⸃· Τίνα ζητεῖτε; οἱ δὲ εἶπαν· Ἰησοῦν τὸν Ναζωραῖον.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/007.yaml
  text: So he asked them again[a], “Whom are you seeking?” And they said, “Jesus the Nazarene.”
translation:
  language: vi
  text: 'Vậy, Ngài lại hỏi họ: “Các anh tìm ai?” Họ đáp: “Giê-su người Na-xa-rét.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πάλιν
  choice: lại
  rationale: Diễn tả sự lặp lại của câu hỏi, tự nhiên và gọn trong lời kể tiếng Việt.
- source_word: οὖν
  choice: Vậy
  rationale: Nối câu này với diễn biến ngay trước đó, vừa thể hiện sự tiếp nối vừa hàm ý kết quả.
- source_word: ἐπηρώτησεν αὐτούς
  choice: hỏi họ
  rationale: Diễn đạt trực tiếp hành động đặt câu hỏi; không thêm sắc thái chất vấn đối đầu.
- source_word: Τίνα ζητεῖτε
  choice: Các anh tìm ai?
  rationale: Tiếng Việt dùng “ai” cho tân ngữ; “tìm” tự nhiên trong bối cảnh nhóm người đang đến bắt một người. “Các anh” biểu thị số nhiều và phù hợp với lời nói trực tiếp mà không quá suồng sã.
- source_word: οἱ δὲ εἶπαν
  choice: Họ đáp
  rationale: δέ chủ yếu chuyển tiếp diễn biến; “đáp” thể hiện rõ đây là câu trả lời mà không cần một liên từ gượng ép.
- source_word: Ἰησοῦν
  choice: Giê-su
  rationale: Dạng phiên âm quen thuộc của tên Ἰησοῦς trong tiếng Việt.
- source_word: τὸν Ναζωραῖον
  choice: người Na-xa-rét
  rationale: Giữ chức năng định danh của Ναζωραῖος và diễn đạt tự nhiên trong tiếng Việt, chỉ người gắn với Na-xa-rét.
theological_decisions:
- issue: Cách dịch Ναζωραῖος như danh xưng định danh của Chúa Giê-su
  choice: người Na-xa-rét
  alternative: người quê Na-xa-rét; người thuộc Na-xa-rét
  rationale: Đây trước hết là một định danh địa lý-lịch sử, không phải danh hiệu giáo lý. “Người Na-xa-rét” bám sát cấu trúc Hy Lạp và tránh thêm mức độ xác định về nơi sinh hoặc quê quán mà từ này tự nó không nhất thiết giải quyết.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Ngài” cho chủ thể là Chúa Giê-su theo mạch văn, và “các anh” cho nhóm người được hỏi; câu thoại ngắn, tự nhiên. Không cần chú thích vì “người Na-xa-rét” đã giữ được ý nghĩa và hình thức định danh của nguyên văn.
