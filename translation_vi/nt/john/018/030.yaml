  text: ἀπεκρίθησαν καὶ εἶπαν αὐτῷ· Εἰ μὴ ἦν οὗτος ⸂κακὸν ποιῶν⸃, οὐκ ἄν σοι παρεδώκαμεν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/030.yaml
  text: They answered and said to him[a], “If this man were not an evildoer, we would not have handed him over to you.”
translation:
  language: vi
  text: 'Họ đáp lời và nói với ông: “Nếu người này không làm điều ác thì chúng tôi đã không giao nộp người cho ông.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθησαν καὶ εἶπαν
  choice: Họ đáp lời và nói
  rationale: Giữ cả hai động từ trong công thức trần thuật mang ảnh hưởng Semit, đồng thời dùng cách diễn đạt trang trọng và tự nhiên trong tiếng Việt.
- source_word: αὐτῷ
  choice: với ông
  rationale: Đại từ gián tiếp chỉ Phi-lát trong ngữ cảnh; “ông” phù hợp với lời đối thoại trang trọng.
- source_word: Εἰ μὴ ἦν
  choice: Nếu ... không
  rationale: Bảo toàn cấu trúc điều kiện trái với thực tế của câu Hy Lạp, thay vì cô đọng thành “trừ phi”.
- source_word: οὗτος
  choice: người này
  rationale: Chỉ Đức Giê-su với sắc thái giữ khoảng cách, không thêm mức khinh miệt mà nguyên văn không bắt buộc.
- source_word: κακὸν ποιῶν
  choice: làm điều ác
  rationale: Giữ lực động từ của ποιῶν và nội dung đạo đức rộng của κακόν, không biến lời cáo buộc chung chung thành một danh xưng pháp lý cụ thể.
- source_word: οὐκ ἄν ... παρεδώκαμεν
  choice: chúng tôi đã không giao nộp
  rationale: Trong mệnh đề điều kiện trái với thực tế, tiếng Việt diễn đạt hệ quả giả định quá khứ tự nhiên bằng “đã không”; “giao nộp” phù hợp bối cảnh tư pháp và mô-típ παραδίδωμι trong sách.
- source_word: σοι ... αὐτόν
  choice: người cho ông
  rationale: Các đại từ lần lượt chỉ Đức Giê-su và Phi-lát; dùng “người” cho Đức Giê-su tạo văn phong trang trọng, rõ nghĩa.
theological_decisions:
- issue: Sắc thái và phạm vi lời cáo buộc chống lại Đức Giê-su
  choice: làm điều ác
  alternative: kẻ làm điều ác; phạm nhân
  rationale: κακὸν ποιῶν là một cụm phân từ chỉ hành động và rộng hơn một thuật ngữ pháp lý chuyên biệt. Cách dịch này giữ nguyên tính chung chung, né tránh của lời cáo buộc mà không tự ý xác định tội danh.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Câu giữ công thức “đáp lời và nói” để phản ánh đầy đủ cấu trúc Hy Lạp; không thêm chú thích vì bản dịch chính đã trực tiếp thể hiện phương án ưu tiên từ nguyên văn.
