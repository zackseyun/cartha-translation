  text: ἀπεκρίθη ⸀αὐτῷ Ἰησοῦς· Εἰ κακῶς ἐλάλησα, μαρτύρησον περὶ τοῦ κακοῦ· εἰ δὲ καλῶς, τί με δέρεις;
base_translation:
  language: en
  yaml_path: translation/nt/john/018/023.yaml
  text: Jesus answered him[a], “If I spoke wrongly, testify about the wrong; but if rightly[b], why do you strike me?”
translation:
  language: vi
  text: 'Giê-su trả lời người ấy: “Nếu tôi đã nói sai, hãy làm chứng về điều sai ấy; còn nếu tôi nói đúng, tại sao lại đánh tôi?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Động từ Hy Lạp có thể chỉ việc đánh nói chung, và trong một số ngữ cảnh có thể mang nghĩa đánh đập.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη αὐτῷ Ἰησοῦς
  choice: Đức Chúa Jêsus đáp
  rationale: Cách kể tự nhiên trong tiếng Việt; đại từ gián tiếp αὐτῷ có thể được lược bỏ vì người được đáp đã rõ từ văn cảnh, tránh câu nặng nề.
- source_word: Εἰ κακῶς ἐλάλησα
  choice: Nếu Ta đã nói sai
  rationale: Giữ cấu trúc điều kiện và diễn đạt κακῶς theo nghĩa nói điều sai hoặc không đúng trong bối cảnh xét hỏi.
- source_word: μαρτύρησον περὶ τοῦ κακοῦ
  choice: hãy làm chứng về điều sai đó
  rationale: “Làm chứng” giữ sắc thái pháp lý của μαρτυρέω; “điều sai đó” duy trì danh từ hóa của τοῦ κακοῦ mà không giới hạn nó thành tội ác hay sự dữ đạo đức.
- source_word: εἰ δὲ καλῶς
  choice: còn nếu Ta nói đúng
  rationale: “Còn” thể hiện sự tương phản giữa hai vế; “nói đúng” tạo thế đối xứng tự nhiên với “nói sai” trong tiếng Việt.
- source_word: τί με δέρεις
  choice: tại sao anh đánh Ta?
  rationale: “Đánh” đủ rộng để chuyển tải δέρω trong ngữ cảnh một cú đánh, không thu hẹp thành “tát” hay tăng mức độ thành “đánh đập”.
theological_decisions:
- issue: Tính chất lời đáp của Đức Chúa Jêsus trước hành vi bạo lực
  choice: Trình bày như một lời chất vấn có logic pháp lý và đạo đức, không thêm bình luận thần học.
  alternative: Diễn giải mạnh hơn để nhấn vào tính bất công, hoặc làm nhẹ sắc thái pháp lý.
  rationale: Nguyên văn đòi hỏi bằng chứng về điều sai rồi đối chiếu với việc đánh người nếu lời nói là đúng; bản dịch giữ nguyên sức căng ấy mà không mở rộng thành một giáo huấn không được phát biểu trực tiếp.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ta” cho lời Đức Chúa Jêsus và “anh” để phản ánh lời nói trực tiếp với viên thuộc hạ mà không thêm sắc thái khinh miệt. Dùng cách viết “Đức Chúa Jêsus” theo quy ước tiếng Việt của dự án.
