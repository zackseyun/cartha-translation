- from: 'Đức Chúa Jêsus đáp: “Nếu Ta đã nói sai, hãy làm chứng về điều sai đó; còn nếu Ta nói đúng, tại sao anh đánh Ta?”[a]'
  to: 'Giê-su trả lời người ấy: “Nếu tôi đã nói sai, hãy làm chứng về điều sai ấy; còn nếu tôi nói đúng, tại sao lại đánh tôi?”[a]'
  rationale: Sửa tên riêng và lối xưng hô để tránh thêm tước hiệu hay quan hệ xã hội không có trong nguyên văn; giữ nguyên cấu trúc, sắc thái pháp lý và mức độ mơ hồ của động từ “đánh”.
