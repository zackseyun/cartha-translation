    issue: Tên riêng kèm tước hiệu “Đức Chúa”
    rationale: Nguyên văn chỉ có Ἰησοῦς (“Giê-su”). “Đức Chúa” là một tước hiệu thần học không hiện diện trong câu và vì vậy không nên được thêm trong bản dịch tối ưu tương đương.
  - severity: medium
    issue: Cặp xưng hô “Ta/anh”
    rationale: Tiếng Hy Lạp chỉ có ngôi thứ nhất με và không nêu đại từ ngôi hai. “Ta” mang sắc thái cổ hoặc quân vương, còn “anh” quy định quan hệ xã hội/tuổi tác; cả hai đều vượt quá dữ liệu nguồn.
  - severity: low
    issue: Lược αὐτῷ trong câu dẫn
    rationale: Có thể lược trong tiếng Việt nhờ ngữ cảnh, nhưng “trả lời người ấy” là cách ngắn gọn giữ rõ thành tố gián tiếp của nguyên văn.
