id: JHN.18.35
reference: John 18:35
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀπεκρίθη ὁ Πιλᾶτος· Μήτι ἐγὼ Ἰουδαῖός εἰμι; τὸ ἔθνος τὸ σὸν καὶ οἱ ἀρχιερεῖς παρέδωκάν σε ἐμοί· τί ἐποίησας;
base_translation:
  language: en
  yaml_path: translation/nt/john/018/035.yaml
  text: Pilate answered[a], “I am not a Jew, am I? Your own nation and the chief priests handed you over to me. What have you done?”
translation:
  language: vi
  text: 'Phi-lát đáp: “Chẳng lẽ tôi là người Do Thái[a] sao? Chính dân tộc ông và các thượng tế đã giao nộp ông cho tôi. Ông đã làm gì?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “người Giu-đê.” Từ Hy Lạp này có thể chỉ căn tính dân tộc-tôn giáo (“người Do Thái”) hoặc căn tính khu vực (“người Giu-đê”), tùy theo ngữ cảnh.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: đáp
  rationale: Động từ tường thuật tự nhiên, gọn và trang trọng trong một cuộc đối thoại.
- source_word: Μήτι
  choice: Chẳng lẽ ... sao?
  rationale: Diễn đạt câu hỏi tu từ chờ đợi câu trả lời phủ định, thay vì biến nó thành một câu hỏi trung tính.
- source_word: Ἰουδαῖός
  choice: người Do Thái
  rationale: Trong ngữ cảnh này, Phi-lát phân biệt mình với dân tộc của Đức Chúa Giê-su; nghĩa dân tộc-tôn giáo là phù hợp nhất, dù nghĩa khu vực “người Giu-đê” vẫn có thể có.
- source_word: τὸ ἔθνος τὸ σὸν
  choice: chính dân tộc ông
  rationale: “Dân tộc” giữ nghĩa tập thể của ἔθνος, còn “chính” làm nổi bật sắc thái nhấn mạnh và khoảng cách trong τὸ σὸν.
- source_word: ἀρχιερεῖς
  choice: các thượng tế
  rationale: Cách gọi quen thuộc và chính xác dành cho giới lãnh đạo tư tế tại Giê-ru-sa-lem.
- source_word: παρέδωκάν
  choice: đã giao nộp
  rationale: Giữ sắc thái trao một người vào tay nhà cầm quyền để xét xử, không thêm hàm ý “phản bội” vốn không bắt buộc ở đây.
- source_word: τί ἐποίησας
  choice: Ông đã làm gì?
  rationale: Thì quá khứ với “đã” diễn đạt hành động đã xảy ra nhưng đang là căn cứ của cuộc thẩm vấn hiện tại.
theological_decisions:
- issue: Cách dịch Ἰουδαῖος trong sách Giăng
  choice: người Do Thái
  alternative: người Giu-đê
  rationale: Câu hỏi tu từ của Phi-lát cùng cụm “chính dân tộc ông” nghiêng về căn tính dân tộc-tôn giáo rộng hơn, không chỉ nguồn gốc khu vực. Chú thích vẫn bảo lưu nghĩa khu vực có thể có của từ Hy Lạp.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cặp đại từ “tôi–ông” tạo giọng thẩm vấn chính thức mà không áp đặt sắc thái khinh miệt không được biểu thị rõ trong nguyên văn. “Chẳng lẽ ... sao?” bảo toàn lực tu từ của câu hỏi chờ đợi câu trả lời phủ định.
