id: JHN.18.14
reference: John 18:14
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἦν δὲ Καϊάφας ὁ συμβουλεύσας τοῖς Ἰουδαίοις ὅτι συμφέρει ἕνα ἄνθρωπον ⸀ἀποθανεῖν ὑπὲρ τοῦ λαοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/014.yaml
  text: Caiaphas was the one who had advised the Jews that it was better for one man to die for the people[a][b].
translation:
  language: vi
  text: Cai-pha là người đã khuyên người Do Thái[a] rằng một người chết vì dân chúng[b] thì có lợi hơn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể hiểu là “các nhà lãnh đạo Do Thái” hoặc “người Giu-đê”, tùy cách hiểu cụm từ “người Do Thái” trong văn mạch sách Giăng.
    reason: alternative_reading
  - marker: b
    text: Cũng có thể dịch là “vì lợi ích của dân chúng” hoặc “thay mặt dân chúng”; trong văn mạch, cụm từ này cũng có thể mang sắc thái đại diện hoặc hy sinh.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν δὲ
  choice: chính là
  rationale: δέ là từ nối nhẹ mang tính tiếp nối; tiếng Việt không cần dịch thành một trạng từ thời gian. “Chính là” giúp câu hồi chỉ tự nhiên đến Cai-pha mà không tạo ý đối lập mạnh.
- source_word: Καϊάφας
  choice: Cai-pha
  rationale: Phiên âm tên riêng theo dạng quen dùng trong tiếng Việt.
- source_word: ὁ συμβουλεύσας
  choice: người đã khuyên
  rationale: Phân từ quá khứ có mạo từ xác định Cai-pha qua lời khuyên ông đã đưa ra trước đó.
- source_word: τοῖς Ἰουδαίοις
  choice: người Do Thái
  rationale: Giữ cách gọi không giới hạn rõ trong nguyên văn; chú thích nêu các cách hiểu theo ngữ cảnh của sách Giăng.
- source_word: ὅτι συμφέρει
  choice: rằng ... thì có lợi hơn
  rationale: συμφέρει chỉ điều có lợi hoặc thuận lợi; cách diễn đạt này tự nhiên và giữ sắc thái tính toán trong lời khuyên.
- source_word: ἕνα ἄνθρωπον
  choice: một người
  rationale: Giữ rõ số từ “một”; tiếng Việt không cần thêm từ chỉ giới tính vì ngữ cảnh đã quy chiếu đến một người nam.
- source_word: ἀποθανεῖν
  choice: chết
  rationale: Diễn đạt trực tiếp động từ nguyên mẫu, không thêm ý ngoài nguyên văn.
- source_word: ὑπὲρ τοῦ λαοῦ
  choice: chết thay cho dân chúng
  rationale: “Thay cho” truyền đạt sắc thái đại diện hoặc vì lợi ích của dân chúng và để ngỏ âm hưởng hy sinh trong văn mạch; chú thích bảo lưu cách dịch ít xác định hơn.
- source_word: λαοῦ
  choice: dân chúng
  rationale: λαός ở đây là “dân” hoặc “dân chúng”, khác với ἔθνος là “dân tộc/quốc gia” trong Giăng 11:50.
theological_decisions:
- issue: Sắc thái chuộc tội hoặc thay thế trong ὑπὲρ τοῦ λαοῦ
  choice: chết thay cho dân chúng
  alternative: chết vì dân chúng; chết vì lợi ích của dân chúng
  rationale: ὑπέρ có thể mang nghĩa vì lợi ích hoặc thay mặt, và trong văn mạch có thể gợi sắc thái đại diện hay hy sinh. Chú thích giữ các khả năng này thay vì biến câu thành một công thức giáo lý rõ hơn nguyên văn.
- issue: Đối tượng của τοῖς Ἰουδαίοις trong cách dùng của sách Giăng
  choice: người Do Thái
  alternative: các nhà lãnh đạo Do Thái; người Giu-đê
  rationale: Nguyên văn không thêm từ hạn định. Bản chính giữ cách gọi rộng, còn chú thích cho biết những cách hiểu hẹp hơn có thể phù hợp với văn mạch.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu giữ cấu trúc hồi chỉ của lời thuật, tránh thêm từ nối thời gian không có trong nguyên văn. “Thà để ... thì có lợi hơn” thể hiện tự nhiên phép cân nhắc hàm chứa trong συμφέρει.
