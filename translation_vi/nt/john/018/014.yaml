revisions:
- from: Cai-pha chính là người đã khuyên người Do Thái[a] rằng thà để một người chết thay cho dân chúng[b] thì có lợi hơn.
  to: Cai-pha là người đã khuyên người Do Thái[a] rằng một người chết vì dân chúng[b] thì có lợi hơn.
  rationale: Bỏ “chính là” để câu không thêm sự nhấn mạnh không cần thiết, đồng thời thay “thà để ... chết thay cho” bằng cách diễn đạt giữ được cấu trúc và độ mở ngữ nghĩa của συμφέρει ἕνα ἄνθρωπον ἀποθανεῖν ὑπὲρ τοῦ λαοῦ. Các neo chú thích vẫn đặt đúng sau “người Do Thái” và “dân chúng”.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T08:26:01Z'
review_pass:
  verdict: revise
  source_fidelity: Bản nháp diễn đạt đúng ý chính, nhưng “thà để” thêm sắc thái cho phép/để mặc không có trong nguyên văn, và “chết thay cho” xác định hóa ὑπέρ theo nghĩa thay thế mạnh hơn mức văn bản đòi hỏi. Ὑπέρ ở đây nên được giữ ở cách diễn đạt rộng hơn là “vì”.
  naturalness: Câu sửa vẫn hiện đại, rõ ràng và tự nhiên. Cấu trúc “một người chết vì dân chúng thì có lợi hơn” truyền đạt mệnh đề nguyên mẫu làm chủ ngữ của συμφέρει mà không thêm ý “để”.
  terminology: Giữ “Cai-pha,” “người Do Thái,” và “dân chúng” là phù hợp. Chú thích a bảo lưu cách hiểu theo văn mạch của Ἰουδαῖοι. Chú thích b cần không trình bày “thay cho” như nghĩa chính của cụm từ, nhưng có thể ghi nhận sắc thái đại diện hoặc hy sinh theo văn mạch.
  issues:
  - severity: medium
    issue: “thà để một người chết”
    rationale: “Để” gợi một hành vi cho phép hoặc quyết định để ai đó chết, trong khi nguyên văn chỉ nói rằng một người chết là điều có lợi hơn.
  - severity: medium
    issue: “chết thay cho dân chúng” làm nghĩa ὑπέρ quá cụ thể
    rationale: Ὑπέρ trước hết có thể chỉ lợi ích hay đại diện (“vì,” “vì lợi ích của,” “thay mặt”). Dù văn mạch có thể gợi âm hưởng hy sinh, bản chính không nên khẳng định riêng nghĩa thay thế.
  revised_text: Cai-pha là người đã khuyên người Do Thái[a] rằng một người chết vì dân chúng[b] thì có lợi hơn.
