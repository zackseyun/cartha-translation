- from: Giu-đa, kẻ đang phản bội Ngài[a], cũng biết nơi ấy, vì Chúa Giê-su đã nhiều lần tụ họp tại đó với các môn đồ của Ngài[b].
  to: Giu-đa, kẻ phản bội Người[a], cũng biết chỗ ấy, vì Giê-su đã nhiều lần gặp các môn đồ của Người tại đó.[b]
  rationale: Bản sửa không thêm danh xưng vào tên Giê-su, dùng cách định danh tự nhiên cho phân từ παραδιδοὺς, và dịch συνήχθη theo nghĩa ngữ cảnh là Giê-su nhiều lần gặp các môn đồ tại địa điểm ấy. Chú thích giữ các phương án sát từ vựng «giao nộp» và «tụ họp».
