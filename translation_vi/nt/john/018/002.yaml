  text: ᾔδει δὲ καὶ Ἰούδας ὁ παραδιδοὺς αὐτὸν τὸν τόπον, ὅτι πολλάκις ⸀συνήχθη Ἰησοῦς ἐκεῖ μετὰ τῶν μαθητῶν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/002.yaml
  text: Judas, who was betraying him, also knew the place, because Jesus had often gathered there with his disciples.
translation:
  language: vi
  text: Giu-đa, kẻ phản bội Người[a], cũng biết chỗ ấy, vì Giê-su đã nhiều lần gặp các môn đồ của Người tại đó.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “kẻ giao nộp Người.”'
    reason: lexical_alternative
  - marker: b
    text: 'Hay: “vì Giê-su đã nhiều lần tụ họp tại đó với các môn đồ của Người.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾔδει
  choice: biết
  rationale: Diễn đạt tự nhiên sự hiểu biết và quen thuộc của Giu-đa đối với địa điểm này.
- source_word: δὲ καὶ
  choice: cũng
  rationale: “Cũng” giữ sắc thái bổ sung của καί; không thêm một từ chỉ thời gian như “bấy giờ” vì nguyên văn không có từ tương ứng rõ ràng.
- source_word: ὁ παραδιδοὺς αὐτὸν
  choice: kẻ đang phản bội Ngài
  rationale: Giữ sức mạnh động từ và khía cạnh đang diễn tiến của phân từ hiện tại; trong mạch thương khó, hành động giao nộp mang ý nghĩa phản bội.
- source_word: τὸν τόπον
  choice: nơi ấy
  rationale: Chỉ địa điểm đã được nhắc đến và nghe tự nhiên trong tiếng Việt hiện đại.
- source_word: ὅτι
  choice: vì
  rationale: Giới thiệu nguyên nhân Giu-đa biết địa điểm ấy.
- source_word: πολλάκις
  choice: đã nhiều lần
  rationale: Diễn đạt rõ hành động lặp lại trước biến cố đang thuật lại.
- source_word: συνήχθη
  choice: tụ họp
  rationale: Dạng bị động có thể mang nghĩa nội động trong ngữ cảnh; “tụ họp” giữ hình ảnh quy tụ mà vẫn tự nhiên.
- source_word: μετὰ τῶν μαθητῶν αὐτοῦ
  choice: với các môn đồ của Ngài
  rationale: Giữ quan hệ đồng hành của μετά và thuật ngữ quen thuộc chỉ những người theo học Chúa Giê-su.
theological_decisions:
- issue: Cách dịch παραδιδοὺς khi nói về Giu-đa
  choice: đang phản bội
  alternative: đang giao nộp
  rationale: “Phản bội” truyền đạt đúng sức nặng đạo đức và vai trò của Giu-đa trong trình thuật; chú thích giữ lại nghĩa sát chữ hơn.
- issue: Ý nghĩa của συνήχθη
  choice: đã nhiều lần tụ họp
  alternative: đã nhiều lần gặp nhau
  rationale: Giữ ngôn ngữ quy tụ của động từ Hy Lạp mà không buộc dạng bị động thành một cách diễn đạt gượng ép trong tiếng Việt.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” để quy chiếu Chúa Giê-su, “môn đồ” để giữ quan hệ thầy-trò trong bối cảnh Phúc Âm; không thêm một từ chuyển đoạn mang nghĩa thời gian ở đầu câu.
