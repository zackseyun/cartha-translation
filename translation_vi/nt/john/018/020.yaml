revisions:
- from: 'Đức Chúa Jêsus đáp: “Ta đã công khai nói với thế gian. Ta luôn dạy dỗ trong các hội đường và trong khuôn viên đền thờ[a], nơi mọi người Do Thái[b] tụ họp; Ta không nói điều gì kín giấu.”'
  to: 'Đức Chúa Giê-su đáp lại ông ấy: “Ta đã công khai nói với thế gian. Ta luôn dạy trong hội đường và trong đền thờ[a], nơi mọi người Do Thái[b] tụ họp. Ta không hề nói gì trong bí mật.”'
  rationale: Sửa chính tả tên riêng theo tiếng Việt hiện đại, giữ “hội đường” ở số ít theo nguyên văn, và thay cách diễn đạt không tự nhiên về lời nói bí mật bằng một trạng ngữ rõ ràng. Các chú thích giữ đúng vị trí sau cụm từ liên quan và bảo tồn các khả năng từ vựng quan trọng.
