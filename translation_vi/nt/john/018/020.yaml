source:
  edition: SBLGNT
  text: ἀπεκρίθη ⸀αὐτῷ Ἰησοῦς· Ἐγὼ παρρησίᾳ ⸀λελάληκα τῷ κόσμῳ· ἐγὼ πάντοτε ἐδίδαξα ἐν συναγωγῇ καὶ ἐν τῷ ἱερῷ, ὅπου ⸀πάντες οἱ Ἰουδαῖοι συνέρχονται, καὶ ἐν κρυπτῷ ἐλάλησα οὐδέν·
base_translation:
  language: en
  yaml_path: translation/nt/john/018/020.yaml
  text: Jesus answered him[a], “I have spoken openly to the world. I always taught in the synagogue and in the temple, where all the Jews gather[b], and I said nothing in secret.”
translation:
  language: vi
  text: 'Đức Chúa Giê-su đáp lại ông ấy: “Ta đã công khai nói với thế gian. Ta luôn dạy trong hội đường và trong đền thờ[a], nơi mọi người Do Thái[b] tụ họp. Ta không hề nói gì trong bí mật.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hy Lạp ἱερόν chỉ toàn bộ khuôn viên hoặc quần thể đền thờ, không chỉ riêng nơi thánh bên trong.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “mọi người Giu-đê”. Từ Hy Lạp Ἰουδαῖοι có nghĩa tùy theo ngữ cảnh; tại đây có lẽ chỉ người Do Thái nói chung.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρρησίᾳ
  choice: công khai
  rationale: Trong ngữ cảnh này, từ này đối lập trực tiếp với ἐν κρυπτῷ (‘kín giấu’), nên ‘công khai’ diễn đạt lời nói không che giấu mà không nhấn quá mức ý can đảm.
- source_word: λελάληκα
  choice: đã ... nói
  rationale: Thì hoàn thành chỉ lời Đức Chúa Jêsus đã nói trước đó và vẫn có liên hệ với cuộc thẩm vấn hiện tại; cấu trúc ‘đã ... nói’ tự nhiên trong tiếng Việt.
- source_word: τῷ κόσμῳ
  choice: với thế gian
  rationale: Giữ lối dùng κόσμος đặc trưng của Giăng và phạm vi rộng của câu, thay vì thu hẹp thành ‘với công chúng’.
- source_word: πάντοτε
  choice: luôn
  rationale: Diễn đạt tự nhiên tính thường xuyên, nhất quán của việc dạy dỗ công khai.
- source_word: ἐδίδαξα
  choice: dạy dỗ
  rationale: Động từ quá khứ đơn được chuyển bằng cách diễn đạt tự nhiên, trang trọng trong tiếng Việt.
- source_word: ἐν συναγωγῇ
  choice: trong các hội đường
  rationale: Danh từ Hy Lạp ở số ít có thể mang nghĩa loại hình hoặc khái quát; số nhiều trong tiếng Việt làm rõ rằng đây là địa điểm công cộng quen thuộc nơi Ngài giảng dạy, không nhất thiết chỉ một hội đường.
- source_word: ἐν τῷ ἱερῷ
  choice: trong khuôn viên đền thờ
  rationale: ἱερόν chỉ toàn bộ quần thể đền thờ, không riêng nơi thánh bên trong; ‘khuôn viên đền thờ’ thể hiện rõ phạm vi ấy.
- source_word: πάντες οἱ Ἰουδαῖοι
  choice: mọi người Do Thái
  rationale: Trong bối cảnh hội đường và đền thờ, cụm từ phù hợp nhất với cộng đồng người Do Thái nói chung; cách dịch vẫn để ngỏ sắc thái ‘người Giu-đê’ trong chú thích.
- source_word: συνέρχονται
  choice: tụ họp
  rationale: Diễn đạt tự nhiên hành động cùng đến và nhóm lại tại một nơi.
- source_word: ἐν κρυπτῷ
  choice: kín giấu
  rationale: Giữ sự đối lập với ‘công khai’; ‘kín giấu’ nhấn mạnh tính che giấu hơn là chỉ một cuộc nói chuyện riêng tư.
- source_word: ἐλάλησα οὐδέν
  choice: Ta không nói điều gì
  rationale: Cách phủ định tự nhiên trong tiếng Việt, bảo toàn nghĩa nhấn mạnh rằng không có điều gì được nói một cách kín giấu.
- source_word: ἀπεκρίθη αὐτῷ
  choice: đáp
  rationale: Đại từ ‘với ông’ có thể lược bỏ tự nhiên trong tiếng Việt vì đối tượng đã rõ từ ngữ cảnh; ‘đáp’ giữ sắc thái tường thuật trang trọng.
theological_decisions:
- issue: Phạm vi của κόσμος
  choice: thế gian
  alternative: công chúng; mọi người
  rationale: ‘Thế gian’ bảo tồn từ vựng và sắc thái rộng đặc trưng của Giăng, dù tại đây trọng tâm thực dụng là lời giảng công khai.
- issue: Đối tượng của οἱ Ἰουδαῖοι trong sách Giăng
  choice: người Do Thái
  alternative: người Giu-đê
  rationale: Bối cảnh nói đến việc tụ họp tại hội đường và đền thờ phù hợp với cộng đồng Do Thái rộng hơn, chứ không buộc phải chỉ giới lãnh đạo hoặc cư dân miền Giu-đê. Chú thích bảo tồn khả năng ngữ cảnh khác của danh từ.
- issue: Tuyên bố ‘không nói điều gì kín giấu’
  choice: Giữ nguyên tính tuyệt đối của lời tuyên bố
  alternative: Diễn giải là không dạy giáo lý bí mật trái với lời dạy công khai
  rationale: Bản dịch không tự ý dung hòa câu này với những cuộc trò chuyện riêng được kể ở nơi khác, nhưng giữ nguyên sức căng và hình thức tuyệt đối của nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng ‘Đức Chúa Jêsus’ trong lời dẫn và đại từ ‘Ta’ trong lời Ngài để duy trì phẩm cách truyền thống mà vẫn tự nhiên. Hai dấu chú thích [a], [b] đều được đặt ngay sau cụm từ liên quan.
