    issue: “Ông đáp” và “Không phải” hơi diễn giải hoặc thiếu quy chiếu chủ ngữ.
    rationale: 'λέγει chỉ nói; “Ông nói: ‘Tôi không phải’” bảo toàn lời phủ nhận ngắn gọn nhưng rõ ràng trong tiếng Việt.'
