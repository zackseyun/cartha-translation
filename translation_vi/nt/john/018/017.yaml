    issue: Cách gọi “cô tớ gái” và “môn đồ” hơi kém tự nhiên/ít hiện hành trong tiếng Việt chuẩn hiện đại.
    rationale: “Cô đầy tớ” và “môn đệ” tự nhiên hơn mà không làm thay đổi nghĩa gốc.
