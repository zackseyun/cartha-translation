id: JHN.18.17
reference: John 18:17
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: λέγει οὖν ⸂τῷ Πέτρῳ ἡ παιδίσκη ἡ θυρωρός⸃· Μὴ καὶ σὺ ἐκ τῶν μαθητῶν εἶ τοῦ ἀνθρώπου τούτου; λέγει ἐκεῖνος· Οὐκ εἰμί.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/017.yaml
  text: So the servant girl who kept the door said to Peter[a], “You are not also one of this man's disciples, are you?” He said, “I am not.”
translation:
  language: vi
  text: 'Vậy, cô đầy tớ giữ cửa nói với Phi-e-rơ[a]: “Ông cũng không phải là một trong các môn đệ của người này, phải không?” Ông nói: “Tôi không phải.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “cô gái nô lệ, người giữ cửa.”
    reason: Bảo lưu khả năng παιδίσκη chỉ một nữ nô lệ trẻ, đồng thời giữ rõ chức năng θυρωρός.
lexical_decisions:
- source_word: οὖν
  choice: Vậy
  rationale: Đánh dấu bước tiếp diễn hoặc hệ quả trong mạch kể; “Vậy” tự nhiên và vẫn giữ lực liên kết của từ Hy Lạp.
- source_word: παιδίσκη
  choice: cô tớ gái
  rationale: Chỉ một nữ đầy tớ còn trẻ. “Cô tớ gái” vừa thể hiện giới tính và độ tuổi tương đối, vừa tránh xác quyết quá mức về địa vị pháp lý; phương án “nữ nô lệ” được ghi ở chú thích.
- source_word: θυρωρός
  choice: giữ cửa
  rationale: Diễn tả chức năng trông coi lối vào bằng cách nói tự nhiên trong tiếng Việt.
- source_word: Μὴ καὶ σὺ
  choice: Ông cũng không phải... phải không?
  rationale: Câu hỏi với μή thiên về việc mong đợi câu trả lời phủ định; cấu trúc đuôi “phải không?” truyền đạt sắc thái ấy tự nhiên.
- source_word: ἐκ τῶν μαθητῶν
  choice: một trong các môn đồ
  rationale: Giữ nghĩa chỉ thành viên thuộc một nhóm của cấu trúc ἐκ.
- source_word: τοῦ ἀνθρώπου τούτου
  choice: của người này
  rationale: Giữ cách gọi thông thường và phần nào xa cách của cụm Hy Lạp, không biến ἄνθρωπος thành một danh hiệu.
- source_word: ἐκεῖνος
  choice: Ông
  rationale: Trong ngữ cảnh, đại từ chỉ Phi-e-rơ; dùng “Ông” là cách quy chiếu tự nhiên trong tiếng Việt.
- source_word: Οὐκ εἰμί
  choice: Không phải
  rationale: Lời phủ nhận ngắn gọn, trực tiếp, tương ứng với câu Hy Lạp tỉnh lược mà không thêm nội dung.
theological_decisions:
- issue: Lực của câu hỏi phủ định mở đầu bằng μή
  choice: 'Dùng câu hỏi thiên về câu trả lời phủ định: “Ông cũng không phải... phải không?”'
  alternative: 'Dùng câu hỏi trung tính hơn: “Ông cũng là một trong các môn đồ... sao?”'
  rationale: Cách chọn giữ sắc thái ngữ pháp và diễn ngôn của bản Hy Lạp mà không cường điệu giọng điệu.
- issue: Sắc thái địa vị xã hội của παιδίσκη
  choice: Dùng “cô tớ gái” trong chính văn
  alternative: “nữ nô lệ” hoặc “cô gái”
  rationale: Từ này có thể chỉ một nữ đầy tớ hoặc nữ nô lệ trẻ. Trong ngữ cảnh, vai trò giữ cửa được nêu rõ hơn địa vị pháp lý; chú thích bảo lưu khả năng dịch mạnh hơn.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “môn đồ” để phù hợp ngữ cảnh Tin Mừng; câu hỏi đuôi giữ sự chờ đợi một lời phủ định. Tên Πέτρος được phiên âm là “Phi-e-rơ”.
