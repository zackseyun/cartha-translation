id: JHN.18.3
reference: John 18:3
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ οὖν Ἰούδας λαβὼν τὴν σπεῖραν καὶ ἐκ τῶν ἀρχιερέων καὶ ⸂ἐκ τῶν⸃ Φαρισαίων ὑπηρέτας ἔρχεται ἐκεῖ μετὰ φανῶν καὶ λαμπάδων καὶ ὅπλων.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/003.yaml
  text: So Judas[a], having taken the cohort and officers from the chief priests and from the Pharisees[b], comes there with lanterns and torches and weapons.
translation:
  language: vi
  text: Vậy, Giu-đa, sau khi nhận một đội lính[a] và các viên chức[b] từ các thượng tế và người Pha-ri-si, đến đó với đèn lồng, đuốc và vũ khí.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hy Lạp cũng có thể dịch là “cơ đội”, “phân đội” hoặc “toán lính”; từ này chỉ một đơn vị quân sự và không nhất thiết có nghĩa là toàn bộ đơn vị với đủ quân số đều hiện diện.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “vệ binh”, “cảnh vệ” hoặc “nhân viên công vụ”; từ này chỉ những người phục vụ chính thức cho các giới chức Do Thái.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Vậy
  rationale: Giữ chức năng liên kết và tiếp nối mạch kể của từ Hy Lạp, đồng thời tự nhiên trong tiếng Việt hiện đại.
- source_word: λαβὼν
  choice: dẫn theo
  rationale: Diễn đạt tự nhiên hành động Giu-đa đưa lực lượng đi cùng mình; vẫn thể hiện hành động này gắn liền và có trước việc đến nơi đó.
- source_word: σπεῖραν
  choice: một đội lính
  rationale: Chỉ một đơn vị hoặc phân đội quân sự nhưng không khiến người đọc mặc nhiên hiểu rằng toàn bộ một quân đoàn với quân số đầy đủ đều có mặt.
- source_word: ὑπηρέτας
  choice: các thuộc hạ
  rationale: Chỉ những người thi hành công vụ phục vụ giới lãnh đạo Do Thái; cách dịch đủ rộng để không khẳng định quá mức rằng họ nhất thiết là cảnh sát đền thờ.
- source_word: ἀρχιερέων
  choice: các thượng tế
  rationale: Cách gọi quen thuộc dành cho giới lãnh đạo tư tế, không hàm ý có nhiều người đồng thời giữ duy nhất chức vụ thầy tế lễ thượng phẩm.
- source_word: Φαρισαίων
  choice: người Pha-ri-si
  rationale: Cách phiên âm thông dụng và dễ nhận biết tên nhóm này trong tiếng Việt.
- source_word: ἔρχεται
  choice: đến
  rationale: Động từ tiếng Việt không biến đổi theo thì nên giữ được sắc thái hiện tại lịch sử sinh động của lời kể mà không cần thêm dấu hiệu thời quá khứ.
- source_word: ἐκεῖ
  choice: đó
  rationale: Chỉ địa điểm đã được nêu trong văn cảnh trước.
- source_word: φανῶν
  choice: đèn lồng
  rationale: Diễn tả nguồn sáng cầm tay và phân biệt với λαμπάδων.
- source_word: λαμπάδων
  choice: đuốc
  rationale: Giữ sự phân biệt từ vựng với đèn lồng trong cặp từ Hy Lạp.
- source_word: ὅπλων
  choice: vũ khí
  rationale: Cách gọi rõ ràng, hiện đại cho các dụng cụ dùng trong hành động vũ trang.
theological_decisions:
- issue: Thành phần và quy mô của nhóm đến bắt Đức Chúa Giê-su
  choice: Dịch thành “một đội lính” và “các thuộc hạ”, qua đó giữ hai thành phần quân sự và nhân viên của giới chức Do Thái mà không xác định quân số.
  alternative: “một cơ đội và các vệ binh” hoặc “một toán lính và cảnh sát đền thờ”
  rationale: Câu Hy Lạp phân biệt σπεῖρα với ὑπηρέται đến từ các thượng tế và người Pha-ri-si. Bản dịch cần giữ cấu trúc hỗn hợp ấy nhưng không khẳng định toàn bộ một cơ đội La Mã đều hiện diện hay các thuộc hạ nhất thiết mang một chức danh cụ thể.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Dẫn theo” tự nhiên hơn lối dịch sát chữ “sau khi lấy”, còn chuỗi “đèn lồng, đuốc và vũ khí” giữ nhịp liệt kê cùng sự phân biệt của nguyên văn.
