revisions:
- from: Vậy, Giu-đa dẫn theo một đội lính[a] cùng các thuộc hạ[b] của các thượng tế và người Pha-ri-si, đến đó với đèn lồng, đuốc và vũ khí.
  to: Vậy, Giu-đa, sau khi nhận một đội lính[a] và các viên chức[b] từ các thượng tế và người Pha-ri-si, đến đó với đèn lồng, đuốc và vũ khí.
  rationale: Sửa “dẫn theo” thành “sau khi nhận” để phản ánh trực tiếp phân từ λαβών và giữ quan hệ hành động trước động từ chính “đến”. Sửa “thuộc hạ” thành “các viên chức” để tránh hàm ý họ là người dưới quyền riêng của Giu-đa, đồng thời vẫn để chú thích giải thích chức năng chính thức của họ. Không thay đổi ý nghĩa hay mức độ bất định về quy mô và bản chất chính xác của lực lượng.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T08:25:34Z'
review_pass:
  verdict: revise
  source_fidelity: Bản thảo giữ đúng các thành phần của đoàn người, địa điểm, và chuỗi “đèn lồng, đuốc và vũ khí”. Tuy nhiên, “dẫn theo” làm rõ quá mức động từ λαβών (“đã nhận/lấy”), vốn không trực tiếp nói rằng Giu-đa dẫn hoặc chỉ huy họ. “Thuộc hạ” cũng dễ gợi người hầu hay tay chân riêng của Giu-đa, trong khi ὑπηρέτας là các nhân viên/thuộc viên chính thức của giới chức được nêu.
  naturalness: Câu sửa vẫn tự nhiên trong tiếng Việt hiện đại, với cấu trúc tham trạng “sau khi nhận” phản ánh quan hệ của phân từ Hy Lạp mà không gán vai trò lãnh đạo cho Giu-đa. “Các viên chức” trong ngữ cảnh và chú thích là cách gọi trung tính, trang trọng hơn “thuộc hạ”.
  terminology: Giữ “Giu-đa”, “các thượng tế”, “người Pha-ri-si”, “đèn lồng”, “đuốc”, và “vũ khí”. Dùng “đội lính” cho σπεῖρα, kèm chú thích để không khẳng định toàn bộ quân số của một đơn vị. Dùng “các viên chức” cho ὑπηρέτας, kèm các phương án “vệ binh/cảnh vệ” và “nhân viên công vụ”.
  issues:
