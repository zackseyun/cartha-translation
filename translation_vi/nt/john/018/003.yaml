    issue: “dẫn theo” cho λαβών
    rationale: λαβών nghĩa cơ bản là “đã nhận/lấy”, không phải “dẫn theo”. Dù đoàn người đi cùng Giu-đa theo văn cảnh, bản dịch không nên thêm rõ ý ông dẫn hay chỉ huy lực lượng đó.
  - severity: medium
    issue: “các thuộc hạ” cho ὑπηρέτας
    rationale: “Thuộc hạ” trong tiếng Việt thường gợi người dưới quyền cá nhân. Từ Hy Lạp chỉ những nhân viên/thuộc viên chính thức phục vụ các thượng tế và người Pha-ri-si.
