revisions:
- from: 'Sau khi Đức Chúa Jêsus nói những lời ấy, một trong các viên chức đang đứng đó đánh Ngài[a] và nói: “Ông trả lời thầy tế lễ thượng phẩm như thế sao?”'
  to: 'Khi Giê-su nói những điều ấy, một người trong số các thuộc hạ đang đứng đó đánh Giê-su[a] và nói: “Ông trả lời thầy tế lễ thượng phẩm như thế sao?”'
  rationale: Bản sửa thay các kính ngữ và tước hiệu được thêm vào bằng tên riêng có trong nguồn, dùng «thuộc hạ» để diễn đạt ὑπηρέτης theo bối cảnh mà không xác định quá mức, và chuẩn hóa chính tả «Giê-su». Hành động «đánh» cùng chú thích vẫn bảo tồn biên độ nghĩa của ῥάπισμα.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T08:26:16Z'
review_pass:
  verdict: revise
  source_fidelity: Bản nháp chuyển đạt đúng diễn tiến chính và câu hỏi quở trách. Tuy nhiên, «Đức Chúa Jêsus/Ngài» thêm tước hiệu và kính ngữ không có trong câu Hy Lạp, còn «viên chức» dễ gợi một công chức theo nghĩa hiện đại hơn là một thuộc hạ/nhân viên của giới thượng tế. «đánh» cùng chú thích giữ được tính không xác định hoàn toàn của ῥάπισμα.
  naturalness: «Một người trong số các thuộc hạ đang đứng đó» là cách nói tự nhiên và phù hợp bối cảnh hơn «một trong các viên chức». «Giê-su» dùng chính tả Việt ngữ hiện đại thông dụng. Câu hỏi trực tiếp vẫn giữ giọng thiếu tôn trọng của người nói bằng đại từ «ông».
  terminology: Dùng «thầy tế lễ thượng phẩm» cho ἀρχιερεύς, là thuật ngữ rõ nghĩa và đã quen thuộc trong văn cảnh Kinh Thánh Việt ngữ. «Thuộc hạ» phản ánh ὑπηρέτης mà không xác định quá mức là cảnh binh Đền Thờ.
  issues:
  - severity: medium
    issue: «Đức Chúa Jêsus/Ngài» bổ sung danh xưng và kính ngữ.
    rationale: Nguyên văn chỉ có tên riêng Ἰησοῦ trong câu này. Để ưu tiên tính trung thành với nguồn, nên dùng «Giê-su» nhất quán trong lời trần thuật; sự thiếu kính trọng trong lời viên chức được thể hiện bởi «ông».
  - severity: medium
    issue: «Viên chức» không phải tương đương ngữ cảnh tự nhiên nhất cho ὑπηρέτης.
    rationale: Trong tiếng Việt hiện đại, từ này thường chỉ cán bộ/công chức. «Thuộc hạ» chỉ người dưới quyền, phù hợp với nhân sự phục vụ chính thức của thượng tế mà không thêm định danh «cảnh binh Đền Thờ».
  - severity: low
    issue: Chính tả «Jêsus» không phải dạng hiện đại thông dụng.
    rationale: «Giê-su» phù hợp hơn với mục tiêu tiếng Việt chuẩn hiện đại.
