base_translation:
  language: en
  yaml_path: translation/nt/john/018/022.yaml
  text: And when he had said these things[a], one of the officers standing by struck Jesus, saying[b], “Is this how you answer the high priest?”
translation:
  language: vi
  text: 'Khi Giê-su nói những điều ấy, một người trong số các thuộc hạ đang đứng đó đánh Giê-su[a] và nói: “Ông trả lời thầy tế lễ thượng phẩm như thế sao?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cụm từ Hy Lạp chỉ một cú đánh bằng tay, có thể là một cái tát hoặc một kiểu đánh tương tự.
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα δὲ αὐτοῦ εἰπόντος
  choice: Sau khi Đức Chúa Jêsus nói những lời ấy
  rationale: Chuyển cấu trúc sở hữu cách tuyệt đối sang mệnh đề thời gian tự nhiên trong tiếng Việt; “những lời ấy” giữ ý số nhiều của ταῦτα và quy chiếu về lời Đức Chúa Jêsus vừa nói.
- source_word: εἷς παρεστηκὼς τῶν ὑπηρετῶν
  choice: một trong các viên chức đang đứng đó
  rationale: “Viên chức” thể hiện vai trò chính thức của ὑπηρέται trong bối cảnh thẩm vấn, đồng thời không xác định quá mức họ là cảnh binh đền thờ; “đang đứng đó” diễn đạt sự hiện diện của παρεστηκώς.
- source_word: ἔδωκεν ῥάπισμα τῷ Ἰησοῦ
  choice: đánh Ngài
  rationale: Diễn đạt tự nhiên hành động giáng một cái bằng tay, nhưng không buộc phải hiểu cụ thể là tát hay đánh trái tay; chú thích bảo tồn phạm vi nghĩa.
- source_word: Οὕτως ἀποκρίνῃ
  choice: Ông trả lời ... như thế sao?
  rationale: Giữ sắc thái chất vấn, quở trách về cách trả lời; đại từ “ông” phản ánh lời nói thiếu kính trọng của viên chức với Đức Chúa Jêsus.
- source_word: τῷ ἀρχιερεῖ
  choice: thầy tế lễ thượng phẩm
  rationale: Thuật ngữ tiếng Việt rõ nghĩa và quen dùng cho chức vụ ἀρχιερεύς trong bối cảnh Do Thái.
theological_decisions:
- issue: Danh tính của ὑπηρετῶν
  choice: các viên chức
  alternative: những người phục dịch; thuộc viên; cảnh binh đền thờ
  rationale: Trong trình thuật xét xử của Giăng, từ này có vẻ chỉ nhân sự chính thức thuộc giới lãnh đạo tư tế. Tuy vậy, bản dịch không thêm “đền thờ” vì nguồn Hy Lạp không nói rõ tại câu này.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. Dùng “Đức Chúa Jêsus/Ngài” trong lời trần thuật, nhưng dùng “ông” trong lời viên chức để truyền đạt giọng quở trách thiếu kính trọng. Marker [a] được đặt ngay sau động từ cần chú giải.
