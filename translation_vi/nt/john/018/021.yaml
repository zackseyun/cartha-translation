source:
  edition: SBLGNT
  text: τί με ⸂ἐρωτᾷς; ἐρώτησον⸃ τοὺς ἀκηκοότας τί ἐλάλησα αὐτοῖς· ἴδε οὗτοι οἴδασιν ἃ εἶπον ἐγώ.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/021.yaml
  text: Why do you question me? Question those who have heard what I said to them. Look[a], they know what I said.
translation:
  language: vi
  text: Sao ông lại chất vấn tôi? Hãy hỏi những người đã nghe điều tôi đã nói với họ. Kìa, chính họ biết tôi đã nói gì.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τί με ἐρωτᾷς
  choice: Sao ông lại chất vấn tôi?
  rationale: τί đặt câu hỏi trực tiếp về lý do; trong bối cảnh thẩm vấn trước thầy tế lễ thượng phẩm, “chất vấn” truyền đạt sắc thái tư pháp của ἐρωτάω tự nhiên hơn “hỏi”, còn “lại” làm câu thách vấn tự nhiên trong tiếng Việt mà không thêm nội dung thực chất.
- source_word: ἐρώτησον
  choice: Hãy hỏi
  rationale: Mệnh lệnh aorist yêu cầu một hành động trực tiếp. Tiếng Việt không tự nhiên khi lặp “chất vấn những người đã nghe”; “hãy hỏi” vẫn giữ nghĩa căn bản và làm rõ rằng chính các nhân chứng phải được hỏi.
- source_word: τοὺς ἀκηκοότας
  choice: những người đã nghe
  rationale: Phân từ hoàn thành chỉ những người ở trong tình trạng đã nghe; “đã nghe” truyền đạt kết quả còn liên quan mà không thêm tân ngữ “tôi” vốn không có tại đây.
- source_word: τί ἐλάλησα αὐτοῖς
  choice: điều tôi nói với họ
  rationale: λαλέω ở đây mang nghĩa thông dụng là nói; cách diễn đạt này tự nhiên, giữ cả nội dung được nghe lẫn αὐτοῖς “với họ”.
- source_word: ἴδε
  choice: Kìa
  rationale: ἴδε là từ gọi sự chú ý. “Kìa” ngắn gọn, hiện hành và giữ lực chỉ xuất của câu; “hãy xem” dễ bị hiểu là yêu cầu quan sát theo nghĩa đen.
- source_word: οὗτοι οἴδασιν
  choice: chính họ biết
  rationale: οὗτοι có lực chỉ định và trong ngữ cảnh trỏ lại những người vừa được nhắc đến. “Chính họ” vừa tự nhiên trong tiếng Việt vừa giữ sắc thái nhấn mạnh tốt hơn “họ” đơn thuần.
- source_word: ἃ εἶπον ἐγώ
  choice: tôi đã nói gì
  rationale: Cấu trúc này được diễn đạt tự nhiên bằng mệnh đề nghi vấn gián tiếp. “Tôi” mang trọng tâm trong thế đối chiếu với các nhân chứng, còn “đã” đặt lời nói vào thời điểm trước cuộc thẩm vấn.
theological_decisions:
- issue: Sắc thái tư pháp trong lời đáp của Chúa Giê-su
  choice: Dùng “chất vấn” ở câu hỏi đầu, rồi “hãy hỏi” đối với những người đã nghe.
  alternative: Dùng “hỏi” cho cả hai lần xuất hiện của ἐρωτάω.
  rationale: Bối cảnh là một cuộc thẩm vấn chính thức, nên “chất vấn” thích hợp ở lời phản vấn. Tuy nhiên, lặp lại từ ấy với các nhân chứng sẽ gượng và có thể làm mạnh quá mức ý của mệnh lệnh; cách phối hợp này giữ sắc thái pháp lý mà vẫn tự nhiên, không giải quyết thay sự căng thẳng trong lời đáp.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và trực tiếp. Đại từ “ông” phù hợp với lời Chúa Giê-su nói với thầy tế lễ thượng phẩm mà không dùng lối xưng hô cổ. Không cần chú thích vì khác biệt giữa “hỏi” và “chất vấn” đã được thể hiện trong chính bản dịch, và câu không có dị bản văn bản cần ghi.
