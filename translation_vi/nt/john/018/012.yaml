  source_fidelity: 'Bản dịch phản ánh đúng các thành tố chính của câu Hy Lạp: liên từ οὖν, đơn vị quân sự σπεῖρα, viên chỉ huy χιλίαρχος, các ὑπηρέται thuộc về “người Do Thái,” cùng hành động bắt giữ và trói Đức Giê-su. Tuy nhiên, “đội quân” dễ gợi toàn bộ một đạo quân hơn là một đơn vị quân sự cụ thể; “đội binh” sát và tự nhiên hơn. “Những thuộc viên” không chuyển tải rõ, tự nhiên nghĩa các nhân sự/chức dịch thi hành công vụ của ὑπηρέται trong văn cảnh này.'
