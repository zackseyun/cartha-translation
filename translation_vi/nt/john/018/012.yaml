  text: Ἡ οὖν σπεῖρα καὶ ὁ χιλίαρχος καὶ οἱ ὑπηρέται τῶν Ἰουδαίων συνέλαβον τὸν Ἰησοῦν καὶ ἔδησαν αὐτὸν
base_translation:
  language: en
  yaml_path: translation/nt/john/018/012.yaml
  text: So the cohort[a], the commander, and the officers of the Jews seized Jesus and bound him.
translation:
  language: vi
  text: Vậy đội binh, viên chỉ huy và các viên chức của người Do Thái[a] bắt giữ Đức Giê-su và trói ngài lại.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tùy theo ngữ cảnh, cũng có thể hiểu là “giới lãnh đạo Do Thái” hoặc “người Giu-đê”; trong sách Gio-an, cụm từ “người Do Thái” thường được dùng với nghĩa cụ thể hơn là toàn thể dân Do Thái.
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: Vậy
  rationale: Diễn tả sự tiếp nối và hệ quả trong mạch kể; tự nhiên, ngắn gọn và vẫn giữ lực liên kết của nguyên văn.
- source_word: σπεῖρα
  choice: đội quân
  rationale: Giữ nghĩa đơn vị quân sự mà không thêm từ “La Mã”, điều không được nêu trực tiếp trong danh từ Hy Lạp; cách nói này dễ hiểu hơn thuật ngữ chuyên môn “đội binh” hay “cohort”.
- source_word: χιλίαρχος
  choice: viên chỉ huy
  rationale: Chỉ sĩ quan chỉ huy đơn vị quân sự; cách dịch hiện đại, rõ nghĩa mà không dùng chức danh La Mã ít quen thuộc.
- source_word: ὑπηρέται
  choice: những thuộc viên
  rationale: Trong ngữ cảnh Gio-an, từ này chỉ những người thi hành nhiệm vụ cho giới chức, không phải gia nhân; “thuộc viên” giữ được vai trò chính thức mà không xác định quá mức là lính canh hay cảnh sát đền thờ.
- source_word: τῶν Ἰουδαίων
  choice: của người Do Thái
  rationale: Dịch minh bạch cấu trúc sở hữu của nguyên văn và không tự ý thu hẹp đối tượng thành giới lãnh đạo; chú thích giải thích phạm vi ngữ cảnh có thể hẹp hơn toàn thể dân Do Thái.
- source_word: συνέλαβον
  choice: bắt giữ
  rationale: Bao hàm cả hành động khống chế và đưa vào tình trạng bị giam giữ, phù hợp với ngữ cảnh mà không nhấn quá mức thủ tục pháp lý.
- source_word: ἔδησαν αὐτὸν
  choice: trói ngài lại
  rationale: Diễn đạt tự nhiên hành động trói buộc đã hoàn tất; “ngài” duy trì văn phong trang trọng khi quy chiếu về Đức Giê-su.
theological_decisions:
- issue: Phạm vi quy chiếu của τῶν Ἰουδαίων trong sách Gio-an
  choice: Giữ “của người Do Thái” trong chính văn, kèm chú thích [a].
  alternative: “của giới lãnh đạo Do Thái” hoặc “của người Giu-đê”
  rationale: Nguyên văn không trực tiếp nói “giới lãnh đạo”, nhưng trong Gio-an cụm từ này thường có phạm vi cụ thể hơn toàn thể dân Do Thái. Giữ cách dịch sát trong chính văn bảo toàn sự mơ hồ, còn chú thích ngăn cách hiểu khái quát hóa.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng và dễ hiểu. Dùng “Đức Giê-su” và đại từ “ngài” theo lối kính trọng phổ thông. Tránh thêm “La Mã” hoặc “cảnh sát đền thờ” vì đó là những xác định hợp ngữ cảnh nhưng không hiện diện trực tiếp trong câu Hy Lạp.
