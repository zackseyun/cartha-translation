  text: ἀπεκρίθη Ἰησοῦς· Εἶπον ὑμῖν ὅτι ἐγώ εἰμι· εἰ οὖν ἐμὲ ζητεῖτε, ἄφετε τούτους ὑπάγειν·
base_translation:
  language: en
  yaml_path: translation/nt/john/018/008.yaml
  text: Jesus answered[a], “I told you that I am he. So if you are seeking me, let these men go.”
translation:
  language: vi
  text: 'Giê-su trả lời: “Tôi đã bảo các ông rằng tôi là người ấy. Vậy, nếu các ông tìm tôi, hãy để những người này đi.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: đáp
  rationale: Cách kể đối thoại tự nhiên, trang trọng vừa phải; diễn đạt đúng động từ ἀποκρίνομαι mà không thêm sắc thái.
- source_word: Εἶπον ὑμῖν
  choice: Tôi đã nói với các ông
  rationale: Thì aorist nhắc lại lời Đức Chúa Jêsus vừa nói trước đó; “đã nói với” vừa sát cấu trúc có ὑμῖν vừa tự nhiên trong tiếng Việt.
- source_word: ἐγώ εἰμι
  choice: chính là tôi
  rationale: Trong ngữ cảnh nhận diện người họ đang tìm, cách nói này rõ ràng và tự nhiên. Chú thích giữ lại cách dịch sát “Tôi là” để không xóa bỏ khả năng vang vọng thần học của cách nói tuyệt đối trong sách Giăng.
- source_word: ζητεῖτε
  choice: tìm
  rationale: Diễn đạt trực tiếp hành động tìm kiếm Đức Chúa Jêsus trong tình huống bắt giữ; tiếng Việt không cần đánh dấu thể tiếp diễn như tiếng Anh.
- source_word: ἄφετε
  choice: hãy để
  rationale: Mệnh lệnh này yêu cầu cho phép những người đi cùng được rời đi; “hãy để” không thêm ý họ đã chính thức bị giam giữ.
- source_word: τούτους
  choice: những người này
  rationale: Đại từ chỉ định giống đực số nhiều nói đến những người đi cùng Đức Chúa Jêsus; cách dịch làm rõ đối tượng một cách tự nhiên.
- source_word: ὑπάγειν
  choice: đi
  rationale: Sau ἄφετε, động từ nguyên mẫu chỉ việc được phép rời khỏi đó; “đi” ngắn gọn và đúng ngữ cảnh.
theological_decisions:
- issue: Cách dịch ἐγώ εἰμι trong văn mạch sách Giăng
  choice: chính là tôi
  alternative: Tôi là
  rationale: Văn mạch trực tiếp là lời Đức Chúa Jêsus xác nhận mình chính là người họ đang tìm, nên “chính là tôi” truyền đạt rõ nghĩa nhận diện. Tuy nhiên, nguyên văn không có vị ngữ sau “là,” và cách dùng tuyệt đối có thể mang âm vang thần học trong sách Giăng; vì vậy, cách dịch sát được giữ trong chú thích thay vì âm thầm loại bỏ sự căng thẳng này.
translation_notes:
  register: Tiếng Việt hiện đại, rõ ràng và trang trọng vừa phải. Dùng “các ông” cho nhóm người đối diện và “những người này” cho các môn đồ đi cùng. Cách xưng “tôi” giữ lời thoại tự nhiên trong tình huống nhận diện, còn chú thích bảo toàn hình thức ngắn gọn và khả năng hàm ý của nguyên văn.
