source:
  edition: SBLGNT
  text: ἐξῆλθεν οὖν ὁ Πιλᾶτος ⸀ἔξω πρὸς αὐτοὺς καὶ ⸀φησίν· Τίνα κατηγορίαν φέρετε ⸀κατὰ τοῦ ἀνθρώπου τούτου;
base_translation:
  language: en
  yaml_path: translation/nt/john/018/029.yaml
  text: So Pilate went outside to them and said, “What accusation do you bring against this man?”
translation:
  language: vi
  text: 'Vì vậy, Phi-lát đi ra gặp họ và hỏi: “Các ông tố cáo người này về điều gì?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξῆλθεν … ἔξω
  choice: đi ra
  rationale: Động từ ἐξέρχομαι cùng trạng từ ἔξω nhấn mạnh chuyển động từ bên trong ra bên ngoài. Trong tiếng Việt, “đi ra” diễn đạt tự nhiên đầy đủ ý này mà không cần lặp “ra ngoài”.
- source_word: οὖν
  choice: Vì vậy
  rationale: 'οὖν nối hành động này với tình huống ngay trước đó: những người tố cáo không vào dinh tổng đốc, vì vậy Phi-lát phải đi ra. “Vì vậy” giữ được sắc thái suy luận và tiến triển của câu chuyện.'
- source_word: πρὸς αὐτούς
  choice: gặp họ
  rationale: πρός với đối cách chỉ hướng chuyển động đến chỗ những người ấy. Trong ngữ cảnh một cuộc đối thoại trực tiếp, “gặp họ” tự nhiên hơn “đến với họ” và không thêm nội dung đáng kể.
- source_word: φησίν
  choice: hỏi
  rationale: Dù nghĩa từ vựng cơ bản là “nói”, lời theo sau có hình thức câu hỏi. Tiếng Việt kể chuyện tự nhiên dùng “hỏi”; thì hiện tại lịch sử của tiếng Hy Lạp không cần đánh dấu riêng vì động từ tiếng Việt không biến đổi theo thì.
- source_word: Τίνα κατηγορίαν
  choice: về điều gì
  rationale: κατηγορία là lời tố cáo hay cáo buộc mang tính pháp lý. Khi kết hợp với “tố cáo”, cấu trúc hỏi “tố cáo … về điều gì?” là cách diễn đạt tiếng Việt tự nhiên, rõ nghĩa và tránh cụm vụng “mang lời tố cáo nào”.
- source_word: φέρετε κατὰ
  choice: tố cáo
  rationale: Cụm φέρω κατηγορίαν κατά có nghĩa đưa ra lời cáo buộc chống lại ai. Động từ “tố cáo” cô đọng cụm pháp lý này và giữ rõ quan hệ bất lợi do κατά biểu thị.
- source_word: τοῦ ἀνθρώπου τούτου
  choice: người này
  rationale: Trong tiếng Việt, “người này” là cách chỉ một người nam đã hiện diện trong ngữ cảnh mà không cần thêm từ chỉ giới tính; “người đàn ông này” sẽ nặng và kém tự nhiên hơn trong lời hỏi pháp lý này.
