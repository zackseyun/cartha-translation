id: JHN.18.36
reference: John 18:36
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς· Ἡ βασιλεία ἡ ἐμὴ οὐκ ἔστιν ἐκ τοῦ κόσμου τούτου· εἰ ἐκ τοῦ κόσμου τούτου ἦν ἡ βασιλεία ἡ ἐμή, οἱ ὑπηρέται ⸂οἱ ἐμοὶ ἠγωνίζοντο ἄν⸃, ἵνα μὴ παραδοθῶ τοῖς Ἰουδαίοις· νῦν δὲ ἡ βασιλεία ἡ ἐμὴ οὐκ ἔστιν ἐντεῦθεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/036.yaml
  text: Jesus answered[a], “My kingdom is not from this world. If my kingdom were from this world, my servants would be fighting so that I might not be handed over to the Jews. But as it is, my kingdom is not from here.”
translation:
  language: vi
  text: 'Đức Giê-su đáp: “Vương quốc của tôi không bắt nguồn từ thế gian này. Nếu vương quốc của tôi bắt nguồn từ thế gian này, các tôi tớ của tôi đã chiến đấu để tôi không bị nộp cho người Do Thái[a]. Nhưng thực ra, vương quốc của tôi không bắt nguồn từ đây.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “người Giu-đê”; trong văn cảnh này, từ này có thể chỉ cụ thể hơn giới lãnh đạo Do Thái.'
    reason: Giữ khả năng nghĩa theo vùng miền hoặc theo nhóm nhà chức trách của Ἰουδαῖοι trong văn mạch Giăng.
lexical_decisions:
- source_word: βασιλεία
  choice: vương quốc
  rationale: “Vương quốc” tự nhiên trong ngữ cảnh Đức Giê-su nói về các tôi tớ và có thể bao hàm cả lãnh địa lẫn quyền trị vì; “triều đại” hoặc “quyền cai trị” sẽ thu hẹp một nét nghĩa.
- source_word: ἐκ τοῦ κόσμου τούτου
  choice: không bắt nguồn từ thế gian này
  rationale: ἐκ nhấn mạnh nguồn gốc; “bắt nguồn từ” giữ rõ ý ấy hơn “không thuộc về,” đồng thời không hàm ý rằng vương quốc hoàn toàn không hiện diện trong thế gian.
- source_word: κόσμος
  choice: thế gian
  rationale: “Thế gian” là cách diễn đạt quen thuộc, trang trọng cho κόσμος trong văn mạch Giăng và có thể gợi trật tự nhân loại hiện tại mà không diễn giải quá mức.
- source_word: ὑπηρέται
  choice: các tôi tớ
  rationale: Từ này chỉ những người phục vụ dưới quyền; “tôi tớ” phù hợp với ngữ cảnh vương quốc và không biến họ thành lực lượng công quyền chuyên biệt.
- source_word: ἠγωνίζοντο ἄν
  choice: hẳn đã chiến đấu
  rationale: Thể chưa hoàn thành đi với ἄν trong điều kiện trái thực tế diễn tả việc chiến đấu đáng lẽ đang diễn ra; tiếng Việt tự nhiên dùng “hẳn đã chiến đấu” để biểu đạt hệ quả giả định.
- source_word: ἵνα μὴ παραδοθῶ
  choice: để tôi không bị nộp
  rationale: Giữ quan hệ mục đích và sắc thái bị trao nộp vào tay nhà chức trách của παραδίδωμι.
- source_word: τοῖς Ἰουδαίοις
  choice: cho người Do Thái
  rationale: Giữ nghĩa từ vựng rộng của Ἰουδαῖοι trong chính văn; chú thích nêu khả năng chỉ cụ thể hơn người Giu-đê hoặc giới lãnh đạo Do Thái trong văn cảnh.
- source_word: νῦν δὲ
  choice: Nhưng thực ra
  rationale: Trong câu điều kiện trái thực tế, νῦν δὲ đối chiếu giả định với tình trạng thực tế; “nhưng thực ra” rõ và tự nhiên hơn cách dịch thuần thời gian “nhưng bây giờ.”
- source_word: ἐντεῦθεν
  choice: không bắt nguồn từ đây
  rationale: “Từ đây” giữ tính chỉ xuất của ἐντεῦθεν, còn “bắt nguồn” làm rõ quan hệ nguồn gốc đã được thiết lập ở đầu câu.
theological_decisions:
- issue: Bản chất vương quốc của Đức Giê-su trong quan hệ với thế gian
  choice: Dịch ngôn ngữ chỉ nguồn gốc là “không bắt nguồn từ thế gian này.”
  alternative: “không thuộc về thế gian này” hoặc “không phải là một phần của thế gian này”
  rationale: Câu nói phủ nhận nguồn gốc của vương quốc từ trật tự thế gian, chứ không nhất thiết phủ nhận sự hiện diện hay tác động của vương quốc trong thế gian; cách dịch giữ nguyên sức căng thần học ấy.
- issue: Đối tượng được gọi là Ἰουδαῖοι trong Giăng
  choice: Chính văn dùng “người Do Thái,” kèm chú thích về nghĩa hẹp theo văn cảnh.
  alternative: “người Giu-đê” hoặc “giới lãnh đạo Do Thái”
  rationale: Từ Hy Lạp có thể chỉ người Do Thái nói chung hoặc một nhóm người Giu-đê/nhà chức trách cụ thể. Chính văn không thu hẹp nghĩa, còn chú thích giúp tránh cách hiểu đồng nhất hóa toàn thể dân tộc.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Giê-su” theo lối gọi tôn kính phổ biến; lặp lại “vương quốc của tôi” và cấu trúc nguồn gốc để giữ nhịp lập luận của nguyên văn.
