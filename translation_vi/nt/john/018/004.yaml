  text: Ἰησοῦς ⸀οὖν εἰδὼς πάντα τὰ ἐρχόμενα ἐπ’ αὐτὸν ⸂ἐξῆλθεν, καὶ λέγει⸃ αὐτοῖς· Τίνα ζητεῖτε;
base_translation:
  language: en
  yaml_path: translation/nt/john/018/004.yaml
  text: Jesus therefore[a], knowing all the things coming upon him, went out and said to them, “Whom are you seeking?”
translation:
  language: vi
  text: 'Vậy, Giê-su, biết mọi điều sắp xảy đến với mình, đã đi ra và nói với họ: “Các người tìm ai?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὖν
  choice: Vì vậy
  rationale: Giữ sắc thái nối tiếp có tính hệ quả của οὖν trong mạch thuật chuyện, tự nhiên hơn trong tiếng Việt hiện đại.
- source_word: εἰδὼς
  choice: biết
  rationale: Diễn đạt sự nhận biết đã có trước và đầy đủ của Đức Chúa Jêsus mà không thêm ý thần học ngoài câu.
- source_word: πάντα τὰ ἐρχόμενα ἐπ’ αὐτόν
  choice: mọi điều sắp xảy đến với mình
  rationale: Giữ tính bao quát của πάντα và ý các biến cố đang cận kề; “xảy đến với mình” tự nhiên trong tiếng Việt mà không xác định thêm bản chất các biến cố.
- source_word: ἐξῆλθεν
  choice: bước ra
  rationale: Diễn đạt rõ hành động đi ra đối diện với nhóm người; “bước ra” tự nhiên, trang trọng vừa phải và không cường điệu.
- source_word: λέγει
  choice: hỏi
  rationale: Dịch theo chức năng trực tiếp của lời nói theo sau là một câu hỏi; thì hiện tại lịch sử được chuyển sang lối kể tiếng Việt tự nhiên.
- source_word: Τίνα
  choice: ai
  rationale: Đại từ nghi vấn làm tân ngữ được tiếng Việt diễn đạt tự nhiên là “ai”, không cần biến cách.
- source_word: ζητεῖτε
  choice: tìm
  rationale: “Tìm” là cách diễn đạt rõ ràng, tự nhiên cho ζητέω trong ngữ cảnh họ đến để tìm một người.
theological_decisions:
- issue: Sự biết trước của Đức Chúa Jêsus trong trình thuật
  choice: Giữ lời khẳng định rằng Ngài biết mọi điều sắp xảy đến với mình.
  alternative: Diễn giải rõ hơn thành sự biết trước tuyệt đối hoặc toàn tri.
  rationale: Câu Hy Lạp nhấn mạnh sự nhận biết đầy đủ của Ngài về các biến cố sắp đến, nhưng không nên mở rộng thành một công thức thần học vượt quá lời văn.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Jêsus” theo văn phong Kinh Thánh Tin Lành quen thuộc; “Các người” thể hiện số nhiều của ζητεῖτε và giữ khoảng cách trang trọng trong lời đối thoại.
