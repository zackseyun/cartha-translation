revisions:
- from: 'Vì vậy, Đức Chúa Jêsus biết mọi điều sắp xảy đến với mình, nên bước ra và hỏi họ: “Các người tìm ai?”'
  to: 'Vậy, Giê-su, biết mọi điều sắp xảy đến với mình, đã đi ra và nói với họ: “Các người tìm ai?”'
  rationale: 'Bản sửa bỏ tước hiệu được thêm vào, giữ οὖν bằng “Vậy”, bảo toàn phân từ “biết”, dịch ἐξῆλθεν là “đã đi ra”, và dịch λέγει là “nói với họ” trước câu hỏi trực tiếp. Không cần chú thích: “sắp xảy đến” đã thể hiện đầy đủ cách hiểu tự nhiên của cụm τὰ ἐρχόμενα.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T08:25:37Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp truyền đạt đúng ý chính: Giê-su biết trước mọi điều sắp xảy đến với mình, đi ra, rồi ngỏ lời với nhóm người đang đến tìm. Tuy nhiên, “Đức Chúa” không có trong nguyên văn, và “hỏi” thu hẹp λέγει (“nói”) thành một động từ chỉ hành vi hỏi. Cấu trúc “Vì vậy … nên” cũng làm sắc thái liên kết của οὖν và quan hệ của phân từ εἰδὼς kém rõ.'
  naturalness: Câu sửa giữ lối kể tự nhiên, trang trọng vừa phải trong tiếng Việt hiện đại. “Vậy” diễn tả liên kết mạch truyện; “nói với họ” bám sát động từ nguồn, sau đó câu hỏi trực tiếp tự cho thấy chức năng chất vấn.
  terminology: Dùng “Giê-su” là cách phiên âm hiện đại và không thêm tước hiệu không có trong câu Hy Lạp. “Mọi điều sắp xảy đến với mình” giữ được tính bao quát của πάντα và tính sắp xảy ra của τὰ ἐρχόμενα ἐπ’ αὐτόν.
  issues:
  - severity: medium
    issue: Thêm tước hiệu “Đức Chúa”
    rationale: Nguyên văn chỉ có Ἰησοῦς (“Giê-su”), không có κύριος hay tước hiệu tương đương. Không nên thêm tước hiệu vào bản văn câu này.
  - severity: low
    issue: “hỏi họ” thay cho “nói với họ”
    rationale: λέγει nghĩa cơ bản là “nói”; câu hỏi trực tiếp theo sau đã biểu thị hành vi hỏi. Dịch “nói với họ” tránh thu hẹp cách diễn đạt của nguyên văn.
  - severity: low
    issue: Cấu trúc “Vì vậy ... nên”
    rationale: Cách này có thể làm quan hệ nhân quả trong tiếng Việt nặng hơn và phân tán chức năng của οὖν. Đưa “Vậy” lên đầu câu giữ liên kết tự nhiên hơn.
  revised_text: 'Vậy, Giê-su, biết mọi điều sắp xảy đến với mình, đã đi ra và nói với họ: “Các người tìm ai?”'
