review_pass:
  verdict: revise
  source_fidelity: Bản nháp giữ đúng mệnh đề mục đích với “để” và mô-típ “được ứng nghiệm”. Tuy nhiên, “sắp phải chết” thêm sắc thái tất yếu/ép buộc mà μέλλω ἀποθνῄσκειν không tự nó nêu. Cấu trúc “lời Đức Giê-su đã phán ... qua đó, Ngài cho biết” cũng đã hòa lẫn mệnh đề quan hệ ὃν εἶπεν với phân từ σημαίνων, làm quan hệ cú pháp kém rõ.
  naturalness: Câu sửa phân biệt rõ lời Đức Giê-su đã nói với điều Ngài cho biết qua lời ấy, vẫn giữ văn phong hiện đại và trang trọng. Việc lặp “Ngài” là tự nhiên để tránh đại từ “mình” có thể kém trang trọng trong ngữ cảnh này.
  terminology: “Đức Giê-su”, “được ứng nghiệm”, và “sắp chết” phù hợp. Giữ “lời” trong chính văn để không gợi tước hiệu “Ngôi Lời”; chú thích nêu lựa chọn “lời phán” là thích hợp.
  issues:
  - severity: medium
    issue: “phải chết” thêm sắc thái bắt buộc
    rationale: μέλλω diễn tả điều sắp xảy ra/tương lai gần; nguyên văn không có từ ngữ tương đương “phải” trong mệnh đề này. Nên dịch “sắp chết” để không thêm diễn giải về tính tất yếu.
  - severity: low
    issue: Quan hệ giữa lời đã nói và hành động cho biết chưa rõ
    rationale: 'ὃν εἶπεν là mệnh đề quan hệ bổ nghĩa cho “lời”, còn σημαίνων là phân từ quy về Đức Giê-su. Câu sửa trình bày rõ: đó là lời Ngài đã nói, và qua lời ấy Ngài cho biết cách Ngài sắp chết.'
