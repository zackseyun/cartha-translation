id: JHN.18.32
reference: John 18:32
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἵνα ὁ λόγος τοῦ Ἰησοῦ πληρωθῇ ὃν εἶπεν σημαίνων ποίῳ θανάτῳ ἤμελλεν ἀποθνῄσκειν.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/032.yaml
  text: so that the word of Jesus would be fulfilled[a], which he had spoken[c][b], indicating by what kind of death he was about to die.
translation:
  language: vi
  text: để lời Đức Giê-su được ứng nghiệm[a], lời mà Ngài đã nói và qua đó Ngài cho biết Ngài sắp chết cách nào.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “lời phán của Đức Giê-su”.
    reason: lexical_alternative
  - marker: b
    text: Đức Giê-su đã cho biết cách thức Ngài sẽ chết, có lẽ ám chỉ việc bị đóng đinh trên thập tự giá. So sánh Giăng 12:32–33.
    reason: cross_reference
lexical_decisions:
- source_word: ἵνα
  choice: để
  rationale: Diễn đạt tự nhiên quan hệ mục đích/kết quả của ἵνα trong mạch kể.
- source_word: ὁ λόγος τοῦ Ἰησοῦ
  choice: lời Đức Giê-su đã phán
  rationale: λόγος ở đây là lời tuyên bố của Đức Giê-su, không phải tước hiệu “Ngôi Lời”; chuyển mệnh đề quan hệ vào cụm danh từ giúp câu tiếng Việt tự nhiên.
- source_word: πληρωθῇ
  choice: được ứng nghiệm
  rationale: Giữ nguyên ngôn ngữ ứng nghiệm mang ý nghĩa thần học trong Giăng và thể bị động của động từ.
- source_word: σημαίνων
  choice: qua đó, Ngài cho biết
  rationale: Phân từ bổ nghĩa cho hành động phán; cách diễn đạt này giữ quan hệ giải thích mà không buộc nó chỉ mang nghĩa mục đích.
- source_word: ποίῳ θανάτῳ
  choice: phải chết cách nào
  rationale: Truyền đạt loại hoặc phương cách chết, đồng thời thể hiện tự nhiên sắc thái phương tiện của θανάτῳ trong tiếng Việt.
- source_word: ἤμελλεν ἀποθνῄσκειν
  choice: mình sắp phải chết
  rationale: “Sắp” giữ sắc thái tương lai gần của μέλλω; “phải chết” phù hợp ngữ cảnh nhưng không nâng thành khẳng định minh nhiên về tiền định.
theological_decisions:
- issue: Ngôn ngữ ứng nghiệm liên quan đến lời báo trước của Đức Giê-su
  choice: Giữ cụm “được ứng nghiệm”.
  alternative: “trở thành sự thật” hoặc “được thực hiện”
  rationale: πληρωθῇ thuộc mô-típ ứng nghiệm quan trọng trong sách Giăng; làm phẳng thành “trở thành sự thật” sẽ làm suy yếu sắc thái này.
- issue: Sức nghĩa của μέλλω đối với cái chết của Đức Giê-su
  choice: 'Dịch theo nghĩa tương lai gần: “sắp phải chết”.'
  alternative: “đã được định phải chết” hoặc “sẽ chết”
  rationale: Bản văn nói đến điều sắp xảy ra và phương cách chết, nhưng riêng động từ này không đòi hỏi phải diễn giải rõ theo hướng tiền định.
- issue: Quan hệ của σημαίνων với εἶπεν
  choice: Dùng “qua đó, Ngài cho biết” để giữ chức năng giải thích của phân từ.
  alternative: “đã phán để cho biết”
  rationale: Cách chọn không đóng khung phân từ chỉ như mục đích, nhờ vậy bảo tồn độ mở cú pháp của nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Giê-su” theo lối gọi kính trọng phổ biến; “Ngài” tránh lặp tên, còn “mình” quy chiếu tự nhiên về chủ thể Đức Giê-su. Mọi dấu chú thích đều có mặt trong chính văn.
