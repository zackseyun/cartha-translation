revisions:
- from: để lời Đức Giê-su đã phán được ứng nghiệm[a]; qua đó, Ngài cho biết mình sắp phải chết cách nào.[b]
  to: để lời Đức Giê-su được ứng nghiệm[a], lời mà Ngài đã nói và qua đó Ngài cho biết Ngài sắp chết cách nào.[b]
  rationale: Bỏ “phải” để không thêm nghĩa vượt quá μέλλω, đồng thời tách rõ lời Đức Giê-su đã nói (ὃν εἶπεν) và chức năng cho biết của lời ấy (σημαίνων). Giữ nguyên lực ứng nghiệm, cách chết, sắc thái tương lai gần, và các neo chú thích.
  reviewer_model: gpt-5.6-terra
