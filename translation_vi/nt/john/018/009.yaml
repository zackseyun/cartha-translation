id: JHN.18.9
reference: John 18:9
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἵνα πληρωθῇ ὁ λόγος ὃν εἶπεν ὅτι Οὓς δέδωκάς μοι οὐκ ἀπώλεσα ἐξ αὐτῶν οὐδένα.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/009.yaml
  text: 'so that the word that he had spoken might be fulfilled: “Of those whom you have given me[a], I lost not one.”'
translation:
  language: vi
  text: 'Để lời Đức Giê-su đã phán được ứng nghiệm: “Trong những người Ngài đã ban cho tôi, tôi đã không làm mất một ai[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “không một ai trong số họ” hoặc “tôi đã không làm mất dù chỉ một người nào trong số họ.”'
    reason: Nêu các cách diễn đạt khác của cấu trúc phân bộ nhấn mạnh ἐξ αὐτῶν οὐδένα.
lexical_decisions:
- source_word: ἵνα πληρωθῇ
  choice: để… được ứng nghiệm
  rationale: Giữ sắc thái mục đích/kết quả của ἵνα cùng thể bị động của πληρωθῇ; “được ứng nghiệm” phù hợp với cách dùng trang trọng nhưng tự nhiên khi một lời đã phán trở thành hiện thực.
- source_word: ὁ λόγος ὃν εἶπεν
  choice: lời Đức Giê-su đã phán
  rationale: λόγος ở đây là một lời nói cụ thể, không phải tước hiệu “Ngôi Lời”. Nêu rõ Đức Giê-su là chủ thể giúp câu độc lập sáng nghĩa trong tiếng Việt mà không thay đổi quy chiếu của đại từ Hy Lạp.
- source_word: Οὓς δέδωκάς μοι
  choice: Trong số những người Ngài đã ban cho tôi
  rationale: “Trong số” chuẩn bị tự nhiên cho cấu trúc phân bộ ἐξ αὐτῶν; “đã ban” truyền đạt hành động hoàn tất của thể hoàn thành δέδωκάς. “Ngài/tôi” giữ nguyên quan hệ ngôi thứ hai/ngôi thứ nhất mà không đưa danh xưng không có trực tiếp trong câu Hy Lạp vào lời trích.
- source_word: οὐκ ἀπώλεσα
  choice: tôi không để mất
  rationale: Trong bối cảnh Đức Giê-su bảo vệ các môn đồ, ἀπόλλυμι mang nghĩa không làm mất hay để ai bị thất lạc. “Không để mất” tự nhiên hơn “không làm hư mất” và không thu hẹp câu vào sự hủy diệt thể chất.
- source_word: ἐξ αὐτῶν οὐδένα
  choice: một ai
  rationale: Kết hợp với “Trong số những người…” để diễn đạt đầy đủ ý phân bộ và nhấn mạnh rằng không một người nào bị mất.
theological_decisions:
- issue: Bản chất của ngôn ngữ ứng nghiệm
  choice: Dịch πληρωθῇ là “được ứng nghiệm”, áp dụng cho lời Đức Giê-su đã phán trước đó.
  alternative: “trở thành hiện thực” hoặc “được hoàn thành”
  rationale: Giăng dùng ngôn ngữ ứng nghiệm cả với Kinh Thánh lẫn lời Đức Giê-su. Cách dịch này giữ sức nặng thần học và diễn tiến có chủ đích của trình thuật nhưng không gọi lời ấy là một lời tiên tri theo nghĩa kỹ thuật.
- issue: Ý nghĩa của ἀπώλεσα đối với những người được giao cho Đức Giê-su
  choice: “tôi không để mất một ai”
  alternative: “tôi không làm hư mất ai” hoặc “tôi không để ai phải chết”
  rationale: Cách dịch giữ trọng tâm vào việc Đức Giê-su gìn giữ những người được giao cho mình, đồng thời không biến câu thành một khẳng định chỉ về cái chết thể xác hay áp đặt một hệ thống tín lý hẹp hơn văn cảnh.
- issue: Danh tính của người được xưng là σύ trong lời trích
  choice: Giữ đại từ kính trọng “Ngài” thay vì thêm trực tiếp “Cha”.
  alternative: “những người Cha đã ban cho con”
  rationale: Văn cảnh rộng hơn cho thấy Đức Giê-su thưa với Cha, nhưng câu Hy Lạp tại đây chỉ có đại từ ngôi thứ hai. “Ngài/tôi” bảo toàn quy chiếu ngữ pháp và tránh làm mất sự hàm ẩn của nguyên văn.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. “Phán” được dùng cho lời của Đức Giê-su; “Ngài” là đại từ kính trọng trong lời trích. Cấu trúc câu giữ sự cô đọng và nhịp nhấn của nguyên văn.
