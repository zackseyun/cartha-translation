base_translation:
  language: en
  yaml_path: translation/nt/john/018/024.yaml
  text: So Annas sent him bound to Caiaphas the high priest[a].
translation:
  language: vi
  text: Vậy, An-na sai giải Đức Giê-su bị trói đến Cai-pha, là thượng tế.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc, xét theo văn cảnh: “Trước đó, An-na đã sai giải Đức Giê-su bị trói đến Cai-pha, là thượng tế,” nếu hiểu câu này là một lời chú thích giải thích các diễn biến trước đó.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: sai giải
  rationale: Động từ ở thì aorist chủ động chỉ hành động chuyển một người đang bị giam giữ đến nơi khác; “sai giải” tự nhiên trong ngữ cảnh bắt giữ và rõ hơn “sai” đơn độc.
- source_word: οὖν
  choice: Vậy
  rationale: Giữ chức năng nối tiếp hoặc suy diễn của οὖν mà vẫn phù hợp với văn kể chuyện trang trọng.
- source_word: αὐτόν
  choice: Đức Chúa Jêsus
  rationale: Dùng tên nhân vật được đại từ chỉ đến để câu tiếng Việt rõ nghĩa; kính ngữ phù hợp văn phong Kinh Thánh tiếng Việt mà không làm thay đổi nội dung mệnh đề.
- source_word: ὁ Ἅννας
  choice: An-ne
  rationale: Phiên âm tên riêng theo cách quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
- source_word: δεδεμένον
  choice: đang bị trói
  rationale: Phân từ hoàn thành bị động mô tả tình trạng bị trói của Đức Chúa Jêsus vào lúc bị giải đi; “đang bị trói” thể hiện trạng thái tiếp diễn mà không thêm từ nhấn mạnh như “vẫn”.
- source_word: πρὸς Καϊάφαν
  choice: đến Cai-phe
  rationale: πρός với đối cách sau động từ chuyển đi biểu thị hướng đến một người; “đến” là cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: τὸν ἀρχιερέα
  choice: là thầy tế lễ thượng phẩm
  rationale: Chỉ chức vụ thượng tế của Cai-phe; thêm “là” giúp quan hệ đồng vị tự nhiên và rõ ràng trong tiếng Việt.
theological_decisions:
- issue: Trình tự tường thuật so với văn cảnh chung quanh
  choice: 'Dịch như một hành động quá khứ tiếp nối: An-ne sai giải Đức Chúa Jêsus đang bị trói đến Cai-phe.'
  alternative: 'Hiểu đây là lời chú thích hồi cố: trước đó An-ne đã sai giải Ngài đến Cai-phe.'
  rationale: Dạng aorist indicative tự nhiên nhất là một biến cố trong mạch kể. Tuy nhiên, quan hệ của câu này với các câu trước có thể cho phép cách hiểu hồi cố; chú thích giữ lại khả năng ấy thay vì đưa một giải pháp hài hòa vào chính văn.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu; giữ thuật ngữ Kinh Thánh quen thuộc “thầy tế lễ thượng phẩm.” Chính văn giữ cách đọc tường thuật trực tiếp, còn chú thích bảo tồn khả năng hiểu câu như một lời hồi cố.
