  rationale: Bản sửa giữ mạch tường thuật đơn giản của thì aorist và lực nối tiếp của οὖν, đồng thời giữ khả năng hiểu hồi cố trong chú thích. Các tên riêng và chức danh được cập nhật theo cách dùng tiếng Việt hiện đại; “bị trói” phản ánh tình trạng do phân từ hoàn thành bị động biểu thị.
