  source_fidelity: 'Bản nháp truyền đạt đúng các thành phần chính của câu Hy Lạp: liên từ οὖν, chủ ngữ An-na, hành động ἀπέστειλεν, tình trạng δεδεμένον, và đích đến là Cai-pha, thượng tế. Tuy nhiên, “đang bị trói” dễ gợi một hành động đang diễn ra hơn là tình trạng kết quả của phân từ hoàn thành bị động; “bị trói” diễn đạt chính xác và gọn hơn.'
