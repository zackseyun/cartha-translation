  text: ἐκραύγασαν οὖν ⸀πάλιν λέγοντες· Μὴ τοῦτον ἀλλὰ τὸν Βαραββᾶν. ἦν δὲ ὁ Βαραββᾶς λῃστής.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/040.yaml
  text: So they shouted again[a], saying, “Not this man, but Barabbas!” Now Barabbas was a robber.
translation:
  language: vi
  text: 'Vì thế, họ lại hét lên: “Không phải người này, mà là Ba-ra-ba!” Ba-ra-ba là một tên cướp.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hoặc “kẻ cướp, thảo khấu”; trong một số văn cảnh, từ Hy Lạp này có thể chỉ một người nổi loạn bạo lực.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκραύγασαν
  choice: la lớn
  rationale: Động từ chỉ việc cất tiếng kêu lớn; “la lớn” tự nhiên trong tiếng Việt hiện đại và giữ được cường độ của hành động.
- source_word: οὖν
  choice: Vì thế
  rationale: Liên từ nối phản ứng của đám đông với lời Phi-lát vừa nói; “Vì thế” giữ sắc thái suy diễn, tiếp nối của câu.
- source_word: πάλιν
  choice: lại
  rationale: Diễn đạt trực tiếp ý lặp lại.
- source_word: λέγοντες
  choice: dẫn trực tiếp bằng dấu hai chấm
  rationale: Trong tiếng Việt, sau “la lớn”, thêm “nói rằng” sẽ nặng và dư; dấu hai chấm tự nhiên truyền đạt chức năng của phân từ λέγοντες mà không làm mất nội dung.
- source_word: Μὴ τοῦτον ἀλλὰ τὸν Βαραββᾶν
  choice: Không phải người này, nhưng Ba-ra-ba!
  rationale: “Người này” giữ lực chỉ định của τοῦτον; “nhưng” bảo toàn cấu trúc tương phản mạnh của μὴ ... ἀλλά.
- source_word: Βαραββᾶν / Βαραββᾶς
  choice: Ba-ra-ba
  rationale: Phiên âm tên riêng theo cách quen thuộc, dễ đọc trong tiếng Việt.
- source_word: ἦν δὲ
  choice: vốn là
  rationale: Ở đây δέ đưa vào lời giải thích nền về Ba-ra-ba; “vốn là” diễn đạt chức năng ấy tự nhiên và gọn.
- source_word: λῃστής
  choice: tên cướp
  rationale: Nghĩa cốt lõi là kẻ cướp hoặc thảo khấu. “Tên cướp” rõ ràng, tự nhiên; phạm vi nghĩa rộng hơn được giữ trong chú thích.
theological_decisions:
- issue: Sắc thái của λῃστής khi mô tả Ba-ra-ba
  choice: tên cướp
  alternative: kẻ cướp có vũ trang; kẻ nổi loạn bạo lực
  rationale: Riêng câu này không buộc phải hiểu Ba-ra-ba là một người nổi dậy chính trị. Bản chính giữ nghĩa cốt lõi, còn chú thích bảo toàn khả năng từ này chỉ kẻ cướp có vũ trang hoặc kẻ nổi loạn bạo lực trong một số văn cảnh.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Cấu trúc lời hô được giữ ngắn, mạnh; tên Ba-ra-ba được phiên âm có gạch nối. Dấu chú thích [a] đặt ngay sau cụm từ được giải thích.
