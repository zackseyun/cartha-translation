  source_fidelity: Bản dịch giữ đúng lời mời gọi số nhiều (Δεῦτε ἴδετε), mệnh đề quan hệ, ý toàn bộ của πάντα ὅσα, và sắc thái dè dặt của μήτι. Tuy nhiên, ἄνθρωπον ở đây chỉ rõ một người nam (Đức Giê-su); “một người” làm mất nét giới tính có trong nguyên ngữ mà không có lý do ngữ cảnh để trung hòa.
  naturalness: “Hãy đến xem” và toàn câu dùng tiếng Việt hiện đại, rõ ràng, với mức trang trọng phù hợp. “Một người đàn ông” vẫn tự nhiên trong lời giới thiệu về một nhân vật nam cụ thể, dù dài hơn “một người”. “Chẳng lẽ ... sao?” diễn đạt được sự thăm dò và nghiêng về phủ định của μήτι.
  terminology: “Đấng Mê-si” là cách chuyển phù hợp cho ὁ χριστός khi dùng như tước hiệu trong bối cảnh Do Thái–Sa-ma-ri. Chú thích phương án thay thế được neo đúng ở câu hỏi và không áp đặt diễn giải hệ phái.
