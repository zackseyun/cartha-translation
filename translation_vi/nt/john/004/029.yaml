  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Δεῦτε ἴδετε ἄνθρωπον ὃς εἶπέ μοι πάντα ⸀ὅσα ἐποίησα· μήτι οὗτός ἐστιν ὁ χριστός;
base_translation:
  language: en
  yaml_path: translation/nt/john/004/029.yaml
  text: Come[a], see a man who told me everything I have done. Could this be the Messiah?
translation:
  language: vi
  text: “Hãy đến xem một người đàn ông đã nói cho tôi biết tất cả những gì tôi đã làm. Chẳng lẽ người này là Đấng Mê-si sao?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “Có thể nào người này là Đấng Mê-si không?”'
    reason: Cách dịch khác giữ tính thăm dò của μήτι nhưng làm nhẹ hơn sắc thái câu hỏi nghiêng về câu trả lời phủ định.
lexical_decisions:
- source_word: Δεῦτε ἴδετε
  choice: Hãy đến xem
  rationale: Diễn đạt tự nhiên lời mời gọi trực tiếp ở số nhiều; giữ được cả ý ‘đến’ lẫn ‘xem’ mà không dùng lối văn cổ.
- source_word: ἄνθρωπον
  choice: một người
  rationale: Trong ngữ cảnh từ này chỉ một cá nhân cụ thể là nam giới, nhưng ‘một người’ là cách nói tự nhiên trong tiếng Việt và không thêm nét nghĩa không cần thiết.
- source_word: ὃς εἶπέ μοι
  choice: đã nói cho tôi biết
  rationale: λέγω đi với tân ngữ gián tiếp và mệnh đề nội dung được diễn đạt tự nhiên bằng ‘nói cho tôi biết’.
- source_word: πάντα ὅσα
  choice: tất cả những gì
  rationale: Giữ sắc thái bao quát, nhấn mạnh của tổ hợp Hy Lạp bằng một cấu trúc tiếng Việt rõ ràng, thông dụng.
- source_word: ἐποίησα
  choice: tôi đã làm
  rationale: Thì quá khứ với ‘đã’ phù hợp với động từ aorist, quy chiếu đến những việc người phụ nữ đã làm trước đó.
- source_word: μήτι
  choice: Chẳng lẽ ... sao?
  rationale: Giữ tính thăm dò, dè dặt và sắc thái câu hỏi vốn nghiêng về câu trả lời phủ định, đồng thời vẫn cho thấy người phụ nữ đang mời dân làng cân nhắc khả năng ấy.
- source_word: ὁ χριστός
  choice: Đấng Mê-si
  rationale: Ở đây Χριστός là tước hiệu chỉ Đấng được xức dầu mà người Sa-ma-ri đang mong đợi; ‘Đấng Mê-si’ chuyển tải chức năng tước hiệu trong bối cảnh Do Thái–Sa-ma-ri.
theological_decisions:
- issue: Cách dịch tước hiệu Χριστός
  choice: Đấng Mê-si
  alternative: Đấng Cơ Đốc
  rationale: Từ này được dùng như tước hiệu cứu thế được nhận biết trong bối cảnh, chứ không phải như một phần tên riêng; ‘Đấng Mê-si’ làm rõ ý ấy mà không áp đặt cách giải thích hệ phái.
- issue: Sắc thái câu hỏi với μήτι
  choice: Chẳng lẽ người này là Đấng Mê-si sao?
  alternative: Có thể nào người này là Đấng Mê-si không?
  rationale: Bản dịch chính giữ sự dè dặt và xu hướng chờ câu trả lời phủ định của μήτι, nhưng không biến lời người phụ nữ thành một lời phủ nhận dứt khoát.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Dùng lời mời trực tiếp ‘Hãy đến xem’; tránh từ cổ. Dấu chú thích đặt sau toàn bộ câu hỏi vì chú thích liên quan đến cách diễn đạt μήτι, không phải riêng lời ‘Hãy đến’.
