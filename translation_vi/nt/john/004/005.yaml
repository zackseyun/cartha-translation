reference: John 4:5
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἔρχεται οὖν εἰς πόλιν τῆς Σαμαρείας λεγομένην Συχὰρ πλησίον τοῦ χωρίου ὃ ἔδωκεν Ἰακὼβ ⸀τῷ Ἰωσὴφ τῷ υἱῷ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/john/004/005.yaml
  text: So he came to a town of Samaria called Sychar[b][a], near the piece of land that Jacob had given to Joseph his son.
translation:
  language: vi
  text: Vậy, Ngài đến một thành[a] thuộc miền Sa-ma-ri, gọi là Si-kha, gần phần đất[b] mà Gia-cốp đã cho Giô-sép, con trai mình.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “thị trấn thuộc miền Sa-ma-ri.” Từ Hy Lạp πόλις có thể chỉ thành phố hoặc thị trấn, tùy văn cảnh.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “cánh đồng” hoặc “mảnh đất.” Từ Hy Lạp χωρίον có thể chỉ cánh đồng, tài sản đất đai hoặc một phần đất.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχεται
  choice: đến
  rationale: Thì hiện tại Hy Lạp được dùng như hiện tại lịch sử trong lời kể; tiếng Việt tự nhiên không cần đánh dấu hình thái thì, và “đến” diễn đạt rõ diễn tiến sự việc.
- source_word: οὖν
  choice: Vậy
  rationale: Giữ chức năng nối kết và chuyển tiếp có tính suy luận từ văn cảnh trước mà vẫn tự nhiên, trang trọng.
- source_word: πόλιν
  choice: một thành
  rationale: πόλις có thể chỉ thành phố hoặc thị trấn. “Thành” là cách gọi rộng, gọn và phù hợp văn phong Kinh Thánh tiếng Việt; chú thích bảo lưu khả năng dịch “thị trấn”.
- source_word: τῆς Σαμαρείας
  choice: thuộc miền Sa-ma-ri
  rationale: Diễn đạt tự nhiên quan hệ sở thuộc hoặc vị trí của sở hữu cách, đồng thời làm rõ Sa-ma-ri ở đây là miền.
- source_word: λεγομένην Συχὰρ
  choice: gọi là Si-kha
  rationale: Chuyển ngữ tự nhiên phân từ bị động dùng để nêu tên địa điểm.
- source_word: πλησίον
  choice: gần
  rationale: Diễn đạt trực tiếp và tự nhiên quan hệ không gian.
- source_word: χωρίου
  choice: phần đất
  rationale: χωρίον có thể chỉ một mảnh đất, cánh đồng hoặc bất động sản; “phần đất” đủ rộng để không mặc nhiên giới hạn vào đất canh tác.
- source_word: ὃ ἔδωκεν Ἰακὼβ
  choice: mà Gia-cốp đã cho
  rationale: “Đã” thể hiện hành động xảy ra trước sự kiện chính; mệnh đề quan hệ giữ đúng quan hệ cú pháp của nguyên văn.
- source_word: τῷ Ἰωσὴφ τῷ υἱῷ αὐτοῦ
  choice: cho con trai mình là Giô-sép
  rationale: Giữ Giô-sép là người nhận và nêu rõ quan hệ đồng vị “con trai của ông” bằng trật tự tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Chủ ngữ ngầm của ἔρχεται
  choice: Đức Chúa Jêsus
  alternative: Ngài
  rationale: Động từ Hy Lạp không nêu lại chủ ngữ, nhưng văn cảnh xác định đó là Đức Chúa Jêsus. Nêu danh xưng giúp câu đứng riêng rõ nghĩa mà không thêm một khẳng định thần học ngoài văn bản.
translation_notes:
  register: 'Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng các dạng tên quen thuộc trong truyền thống Kinh Thánh tiếng Việt: Sa-ma-ri, Si-kha, Gia-cốp và Giô-sép. Các dấu chú thích được đặt ngay sau từ ngữ mà chúng giải thích.'
