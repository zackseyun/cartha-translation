id: JHN.4.23
reference: John 4:23
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀλλὰ ἔρχεται ὥρα καὶ νῦν ἐστιν, ὅτε οἱ ἀληθινοὶ προσκυνηταὶ προσκυνήσουσιν τῷ πατρὶ ἐν πνεύματι καὶ ἀληθείᾳ, καὶ γὰρ ὁ πατὴρ τοιούτους ζητεῖ τοὺς προσκυνοῦντας αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/john/004/023.yaml
  text: But an hour is coming[a], and is now here, when the true worshipers will worship the Father in spirit and truth; for the Father indeed seeks such people to worship him.
translation:
  language: vi
  text: Nhưng giờ đang đến, và nay đã đến, khi những người thờ phượng chân thật sẽ thờ phượng Cha trong tâm linh[a] và chân lý; vì Cha thật sự tìm kiếm những người như thế, tức là những người thờ phượng Ngài.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “trong Thánh Linh”. Từ Hy Lạp có thể chỉ sự thờ phượng nhờ Đức Thánh Linh ban năng lực, sự thờ phượng trong tâm linh con người, hoặc sự thờ phượng mang bản chất thiêng liêng.
    reason: Giữ nguyên tính đa nghĩa của ἐν πνεύματι.
lexical_decisions:
- source_word: ἀλλὰ
  choice: Nhưng
  rationale: Đánh dấu sự tương phản với cuộc bàn luận trước đó về nơi chốn thờ phượng.
- source_word: ἔρχεται ὥρα καὶ νῦν ἐστιν
  choice: giờ sắp đến, và hiện đã đến
  rationale: Giữ hình ảnh 'giờ' đặc trưng của Giăng và diễn đạt tự nhiên sự căng thẳng giữa điều sắp đến với thực tại đã hiện diện.
- source_word: οἱ ἀληθινοὶ προσκυνηταὶ
  choice: những người thật sự thờ phượng
  rationale: Diễn đạt ἀληθινοί theo nghĩa chân thật, đích thực, đồng thời tránh một danh từ Hán-Việt nặng nề.
- source_word: προσκυνήσουσιν τῷ πατρὶ
  choice: sẽ thờ phượng Cha
  rationale: Phản ánh thì tương lai và hiểu 'Cha' là danh xưng chỉ Đức Chúa Trời trong văn mạch Giăng.
- source_word: ἐν πνεύματι καὶ ἀληθείᾳ
  choice: trong tâm linh và chân lý
  rationale: Giữ hai danh từ và quan hệ song hành; 'tâm linh' không tự động xác định đây là Đức Thánh Linh, còn chú thích nêu rõ tính đa nghĩa.
- source_word: καὶ γὰρ ὁ πατὴρ τοιούτους ζητεῖ
  choice: vì Cha thật sự tìm kiếm những người ... như vậy
  rationale: '''Vì'' nêu lý do, ''thật sự'' chuyển tải sắc thái nhấn mạnh của καὶ γάρ, và ''như vậy'' quy chiếu đến loại người vừa được mô tả.'
- source_word: τοὺς προσκυνοῦντας αὐτόν
  choice: những người thờ phượng Ngài
  rationale: Chuyển phân từ hiện tại thành mệnh đề quan hệ tự nhiên trong tiếng Việt, giữ đối tượng là Cha.
theological_decisions:
- issue: Ý nghĩa của ἐν πνεύματι
  choice: trong tâm linh
  alternative: trong Thánh Linh; trong thần linh; theo cách thiêng liêng
  rationale: Danh từ Hy Lạp không có mạo từ và văn cảnh cho phép các sắc thái liên quan đến tâm linh con người, Đức Thánh Linh, hoặc thực tại thiêng liêng. Bản chính không viết hoa để tránh quyết định thay cho nguyên văn; chú thích bảo tồn các khả năng.
- issue: Phạm vi của οἱ ἀληθινοὶ προσκυνηταὶ
  choice: những người thật sự thờ phượng
  alternative: những người thờ phượng chân thật; những người thờ phượng đích thực
  rationale: Cách dịch mang ý nghĩa phẩm chất chân thật, không biến câu này thành sự phân định giáo phái.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Giữ từ 'giờ' để bảo tồn cách diễn đạt và sắc thái thời điểm cứu chuộc đặc trưng của sách Giăng; dùng 'Cha' và 'Ngài' như danh xưng tôn kính mà không thêm thuật ngữ giáo phái.
