revisions:
- from: Nhưng giờ sắp đến, và hiện đã đến, khi những người thật sự thờ phượng sẽ thờ phượng Cha trong tâm linh[a] và chân lý; vì Cha thật sự tìm kiếm những người thờ phượng Ngài như vậy.
  to: Nhưng giờ đang đến, và nay đã đến, khi những người thờ phượng chân thật sẽ thờ phượng Cha trong tâm linh[a] và chân lý; vì Cha thật sự tìm kiếm những người như thế, tức là những người thờ phượng Ngài.
  rationale: Sửa “sắp đến” thành “đang đến” để không thêm sắc thái thời gian; thay cụm mô tả người thờ phượng và tái đặt “những người như thế” để phản ánh rõ hơn cấu trúc và quy chiếu của tiếng Hy Lạp. Không thay đổi nghĩa thần học hay giải quyết tính mơ hồ của ἐν πνεύματι.
