review_pass:
  verdict: revise
  source_fidelity: 'Cần chỉnh nhẹ để phản ánh sát hơn ἔρχεται: “sắp đến” thêm sắc thái cận kề không có trong động từ hiện tại “đang đến”. Cụm “và nay đã đến” diễn đạt tự nhiên ý καὶ νῦν ἐστιν trong tiếng Việt. “Những người thờ phượng chân thật” giữ rõ cấu trúc danh từ có phẩm chất của οἱ ἀληθινοὶ προσκυνηταὶ. Chú thích bảo tồn thích đáng tính đa nghĩa của ἐν πνεύματι.'
  naturalness: Bản sửa giữ văn phong trang trọng, hiện đại. “Giờ đang đến, và nay đã đến” có tính nghịch hợp chủ ý, phù hợp văn phong Giăng, nhưng vẫn tự nhiên. “Những người như thế, tức là những người thờ phượng Ngài” làm rõ rằng τοιούτους quy chiếu đến loại người được mô tả, không chỉ cách thức thờ phượng.
  terminology: Giữ “Cha”, “Ngài”, “tâm linh” và “chân lý” nhất quán với đăng ký trang trọng hiện đại. Không viết hoa “tâm linh” trong bản chính, để không giải quyết trước tính mơ hồ giữa Thánh Linh, tâm linh con người, và phẩm tính thiêng liêng.
  issues:
  - severity: medium
    issue: “sắp đến” cho ἔρχεται
    rationale: “Sắp” thường chỉ sự gần kề sắp xảy ra, trong khi ἔρχεται là hiện tại “đang đến”; nguyên văn đồng thời khẳng định “nay là/đã hiện diện”.
  - severity: low
    issue: “những người thật sự thờ phượng”
    rationale: Cách này có thể được hiểu là những người thờ phượng một cách thật sự; “những người thờ phượng chân thật” biểu đạt trực tiếp hơn tính chất của các người thờ phượng (οἱ ἀληθινοὶ προσκυνηταὶ).
  - severity: low
    issue: Vị trí của “như vậy”
    rationale: Đưa “như vậy” sau “thờ phượng Ngài” có thể khiến nó bổ nghĩa chủ yếu cho hành vi thờ phượng. Tái cấu trúc câu làm rõ τοιούτους là “những người như thế”.
  revised_text: Nhưng giờ đang đến, và nay đã đến, khi những người thờ phượng chân thật sẽ thờ phượng Cha trong tâm linh[a] và chân lý; vì Cha thật sự tìm kiếm những người như thế, tức là những người thờ phượng Ngài.
