  source_fidelity: Bản dịch phản ánh đầy đủ γάρ (“Vì”), sắc thái nhấn mạnh của αὐτός (“chính”), động từ μαρτυρέω (“đã làm chứng”), nội dung cách ngôn, và không thu hẹp πατρίς vào một địa danh cụ thể. “Không được tôn trọng” truyền đạt đúng ý τιμὴν οὐκ ἔχει, dù chuyển cấu trúc danh từ của tiếng Hy Lạp sang cách nói tiếng Việt tự nhiên.
