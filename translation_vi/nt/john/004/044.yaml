source:
  edition: SBLGNT
  text: αὐτὸς ⸀γὰρ Ἰησοῦς ἐμαρτύρησεν ὅτι προφήτης ἐν τῇ ἰδίᾳ πατρίδι τιμὴν οὐκ ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/044.yaml
  text: For Jesus himself testified that a prophet has no honor in his own homeland[a].
translation:
  language: vi
  text: 'Vì chính Đức Giê-su đã làm chứng rằng: “Một nhà tiên tri không được tôn trọng tại quê hương mình[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “xứ mình” hoặc “quê quán của mình.” Từ Hy Lạp πατρίς có thể chỉ quê hương, quê quán hoặc vùng bản quán của một người.
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: Vì
  rationale: Giữ chức năng giải thích của liên từ, nối câu này với mạch thuật chuyện xung quanh.
- source_word: αὐτὸς ... Ἰησοῦς
  choice: chính Đức Giê-su
  rationale: Diễn đạt sắc thái nhấn mạnh của αὐτός đi cùng tên Ἰησοῦς bằng cách nói tự nhiên trong tiếng Việt.
- source_word: ἐμαρτύρησεν
  choice: đã làm chứng
  rationale: Giữ ngôn ngữ về việc làm chứng vốn quan trọng trong sách Giăng, đồng thời rõ nghĩa với độc giả hiện đại.
- source_word: ὅτι
  choice: rằng
  rationale: Dẫn vào nội dung lời chứng của Đức Giê-su một cách tự nhiên.
- source_word: προφήτης
  choice: một nhà tiên tri
  rationale: Danh từ số ít không có mạo từ mang nghĩa bất định và tạo nên tính cách ngôn của lời nói.
- source_word: ἐν τῇ ἰδίᾳ πατρίδι
  choice: tại quê hương mình
  rationale: πατρίς có thể chỉ quê hương, quê quán hoặc vùng bản quán; “quê hương mình” tự nhiên, giữ được ἰδίᾳ và không thu hẹp địa điểm.
- source_word: τιμὴν οὐκ ἔχει
  choice: không được tôn trọng
  rationale: Diễn đạt tự nhiên trong tiếng Việt ý một người không nhận được sự kính trọng, dù chuyển cấu trúc danh từ của tiếng Hy Lạp sang dạng bị động.
theological_decisions:
- issue: Phạm vi quy chiếu của “quê hương mình” trong văn mạch Giăng
  choice: Giữ cách nói khái quát “quê hương mình”, không xác định địa danh.
  alternative: Giu-đê, Ga-li-lê, hoặc Na-xa-rét/vùng quê quán nói chung
  rationale: Bản thân câu này nêu một lời mang tính cách ngôn nhưng không nói rõ địa điểm nào; bản dịch giữ nguyên sự căng thẳng diễn giải thay vì quyết định thay cho độc giả.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Đức Giê-su” và “nhà tiên tri”; lời cách ngôn được đặt trong dấu ngoặc kép để làm rõ nội dung của động từ “làm chứng”.
