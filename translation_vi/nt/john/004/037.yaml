  text: ἐν γὰρ τούτῳ ὁ λόγος ⸀ἐστὶν ἀληθινὸς ὅτι Ἄλλος ἐστὶν ὁ σπείρων καὶ ἄλλος ὁ θερίζων·
base_translation:
  language: en
  yaml_path: translation/nt/john/004/037.yaml
  text: 'For in this the saying is true: one is the one sowing[c][b][a], and another the one reaping.'
translation:
  language: vi
  text: 'Vì trong việc này, câu nói sau thật đúng: “Một người gieo, người khác gặt.”[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “lời này thật đúng” hoặc “tục ngữ này thật đúng”.
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “Người gieo là một người, còn người gặt là một người khác.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν γὰρ τούτῳ
  choice: Vì trong trường hợp này
  rationale: Giữ chức năng giải thích của γάρ và quy chiếu của ἐν τούτῳ đến tình huống đang được Chúa Giê-su nói tới; cách diễn đạt tự nhiên hơn lối dịch sát chữ “trong điều này”.
- source_word: ὁ λόγος
  choice: câu nói
  rationale: Trong ngữ cảnh, λόγος chỉ một lời nói hay câu cách ngôn được nêu tiếp theo, không phải danh hiệu thần học “Ngôi Lời”.
- source_word: ἐστὶν ἀληθινός
  choice: thật đúng
  rationale: Diễn đạt tự nhiên giá trị xác thực của câu nói; “thật” ở đây bổ nghĩa mức độ khẳng định cho “đúng”, không biến ἀληθινός thành ý niệm khác.
- source_word: ὅτι
  choice: dấu hai chấm
  rationale: ὅτι giới thiệu nội dung câu nói; dấu hai chấm và ngoặc kép thể hiện chức năng này tự nhiên trong tiếng Việt.
- source_word: ἄλλος ... καὶ ἄλλος
  choice: người này ... người khác
  rationale: Giữ sự đối chiếu giữa hai chủ thể khác nhau mà không xác định họ là ai.
- source_word: ὁ σπείρων ... ὁ θερίζων
  choice: gieo ... gặt
  rationale: Hai phân từ hiện tại được diễn đạt bằng động từ trong cấu trúc “người này… người khác…”, vừa gọn, cân đối, mang sắc thái cách ngôn, vừa bảo toàn hành động gieo và gặt.
theological_decisions:
- issue: Các chủ thể được ví như người gieo và người gặt
  choice: Không xác định họ trong bản văn dịch
  alternative: Giải thích người gieo là các tiên tri, Giăng Báp-tít hoặc Chúa Giê-su, còn người gặt là các môn đồ
  rationale: Câu Hy Lạp chỉ nêu một câu nói khái quát; danh tính và sự ứng dụng được để cho văn cảnh làm sáng tỏ. Việc đưa một cách đồng nhất cụ thể vào câu dịch sẽ giải quyết điều bản văn vẫn để mở.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Cấu trúc ngắn và cân đối nhằm giữ sắc thái câu cách ngôn; tránh cách nói gượng “một người là người đang gieo”. Các dấu chú thích đều xuất hiện trong chính văn.
