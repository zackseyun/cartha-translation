id: JHN.4.1
reference: John 4:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ὡς οὖν ἔγνω ὁ ⸀Ἰησοῦς ὅτι ἤκουσαν οἱ Φαρισαῖοι ὅτι Ἰησοῦς πλείονας μαθητὰς ποιεῖ καὶ βαπτίζει ἢ Ἰωάννης—
base_translation:
  language: en
  yaml_path: translation/nt/john/004/001.yaml
  text: Therefore[a], when Jesus knew that the Pharisees had heard that Jesus was making and baptizing more disciples than John—
translation:
  language: vi
  text: Vì vậy, khi Giê-su biết rằng những người Pha-ri-sêu đã nghe tin Ngài đang làm cho nhiều người trở thành môn đồ và làm phép báp-têm cho họ nhiều hơn Giăng[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể hiểu: “Giê-su đang làm cho nhiều người trở thành môn đồ hơn và làm phép báp-têm nhiều hơn Giăng.” Trong tiếng Hy Lạp, sự so sánh có thể áp dụng cho cả hai hoạt động, chứ không chỉ cho số người trở thành môn đồ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὡς οὖν
  choice: Vì vậy, khi
  rationale: Ὡς mở đầu mệnh đề thời gian, còn οὖν biểu thị suy luận hoặc chuyển tiếp trong mạch kể; cách dịch này giữ cả hai chức năng một cách tự nhiên.
- source_word: ἔγνω
  choice: biết
  rationale: Động từ γινώσκω ở đây nói Đức Chúa Jêsus đã nhận biết sự việc; “biết” ngắn gọn, tự nhiên và không buộc phải xác định Ngài biết bằng cách nào.
- source_word: οἱ Φαρισαῖοι
  choice: những người Pha-ri-si
  rationale: Tên nhóm được phiên âm theo cách quen dùng trong tiếng Việt, đồng thời diễn đạt mạo từ xác định bằng cấu trúc tự nhiên.
- source_word: ἤκουσαν
  choice: đã nghe tin
  rationale: Thì quá khứ trong mệnh đề phụ được diễn đạt bằng “đã”; thêm “tin” làm rõ rằng họ nghe được một báo cáo, phù hợp ngữ cảnh và tự nhiên trong tiếng Việt.
- source_word: πλείονας μαθητὰς
  choice: nhiều môn đồ hơn
  rationale: Giữ nguyên ý so sánh về số lượng của πλείονας với cách diễn đạt thông dụng trong tiếng Việt.
- source_word: ποιεῖ
  choice: thu nhận
  rationale: Trong kết hợp ποιεῖ μαθητάς, ý là làm cho người ta trở thành hoặc có họ làm môn đồ. “Thu nhận” tự nhiên trong câu kể và tránh sắc thái máy móc của “tạo ra môn đồ,” nhưng vẫn giữ ý Đức Chúa Jêsus đang có thêm môn đồ.
- source_word: βαπτίζει
  choice: làm phép báp-têm cho
  rationale: Đây là cách diễn đạt rõ ràng, quen thuộc trong tiếng Việt cho βαπτίζω, không tự ý đưa lời giải thích của câu 2 vào câu này.
- source_word: ἢ Ἰωάννης
  choice: hơn Giăng
  rationale: Giữ cấu trúc so sánh cô đọng; tên Ἰωάννης được phiên âm theo cách quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
theological_decisions:
- issue: Câu chữ bề mặt có thể khiến người đọc hiểu rằng chính Đức Chúa Jêsus làm phép báp-têm
  choice: Giữ Đức Chúa Jêsus làm chủ thể chung của “thu nhận và làm phép báp-têm,” không đưa trước lời giải thích của câu 2.
  alternative: Dịch rằng các môn đồ hoặc nhóm của Đức Chúa Jêsus làm phép báp-têm.
  rationale: Bản Hy Lạp ở câu 1 quy cả hai hoạt động cho Đức Chúa Jêsus trên bề mặt ngữ pháp, còn câu 2 mới giải thích rằng chính Ngài không làm phép báp-têm. Bản dịch cần để mạch văn tự cung cấp sự phân định ấy.
- issue: Phạm vi của phép so sánh πλείονας ... ἢ Ἰωάννης
  choice: Trong chính văn, đặt “nhiều môn đồ hơn Giăng” sao cho cách đọc tự nhiên nhấn vào số môn đồ được thu nhận và làm phép báp-têm.
  alternative: Hiểu phép so sánh là Đức Chúa Jêsus vừa thu nhận nhiều môn đồ hơn, vừa làm phép báp-têm nhiều hơn Giăng.
  rationale: Cấu trúc Hy Lạp có thể cho phép phạm vi so sánh bao trùm hoạt động phối hợp. Chú thích giữ lại cách đọc thay thế thay vì giải quyết dứt khoát sự mơ hồ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Jêsus,” “Pha-ri-si,” “Giăng” và “phép báp-têm” theo lối gọi quen thuộc trong tiếng Việt. Dấu gạch ngang cuối câu được giữ vì câu Hy Lạp tiếp tục sang câu 2.
