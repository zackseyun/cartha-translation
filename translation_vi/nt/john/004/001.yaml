  rationale: Bản sửa dịch sát ποιεῖ μαθητάς là việc làm cho người ta trở thành môn đồ, giữ Giê-su là chủ thể bề mặt của cả hai hoạt động như nguyên văn, và để câu 2 tự cung cấp sự giải thích về người trực tiếp làm phép báp-têm. Chú thích bảo toàn sự mơ hồ có cơ sở về phạm vi của phép so sánh. Dấu gạch ngang cuối câu được giữ vì câu tiếp tục ở 4:2.
