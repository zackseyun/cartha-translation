  - severity: medium
    issue: «thu nhận» làm yếu nghĩa của ποιεῖ μαθητάς
    rationale: «Thu nhận» có thể chỉ hành vi tiếp nhận người đã là môn đồ; trong ngữ cảnh này ποιεῖ μαθητάς nói việc làm cho người ta trở thành môn đồ. Cần diễn đạt rõ ý đó.
  - severity: low
