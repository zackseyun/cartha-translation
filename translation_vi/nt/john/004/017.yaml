  terminology: Cách gọi “Đức Giê-su,” “Người,” và “bà” nhất quán với thanh ghi tôn kính. “Chồng” là lựa chọn chính xác theo văn cảnh; chú thích từ vựng nên được neo trực tiếp tại lần xuất hiện đầu tiên của từ này.
  issues:
