    rationale: Đặt neo ở lần đầu “chồng” giúp người đọc nhận biết ngay chú thích đang giải thích lựa chọn dịch của ἀνήρ; chú thích vẫn áp dụng cho cả sự lặp lại trong lời Đức Giê-su.
