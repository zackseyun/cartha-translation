base_translation:
  language: en
  yaml_path: translation/nt/john/004/017.yaml
  text: 'The woman answered and said to him[a], “I do not have a husband.” Jesus said to her[b], “You have spoken well: ‘I do not have a husband.’”'
translation:
  language: vi
  text: 'Người phụ nữ đáp lời Người: “Tôi không có chồng.”[a] Đức Giê-su nói với bà: “Bà đã nói đúng: ‘Tôi không có chồng.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hy Lạp ἀνήρ có thể có nghĩa là “người đàn ông” hoặc “chồng”; ở đây văn cảnh cho thấy nghĩa là “chồng”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη ἡ γυνὴ καὶ εἶπεν αὐτῷ
  choice: Người phụ nữ đáp lời Người
  rationale: Cụm “đáp lời” diễn đạt tự nhiên công thức kể chuyện gồm cả “trả lời” và “nói”; “Người” chỉ Đức Giê-su theo văn cảnh.
- source_word: Οὐκ ἔχω ἄνδρα
  choice: Tôi không có chồng
  rationale: Trong văn cảnh về quan hệ hôn nhân, ἀνήρ mang nghĩa “chồng”; cách diễn đạt này tự nhiên trong tiếng Việt hiện đại.
- source_word: λέγει αὐτῇ ὁ Ἰησοῦς
  choice: Đức Giê-su nói với bà
  rationale: Thì hiện tại lịch sử của λέγει được chuyển thành lối kể quá khứ tự nhiên trong tiếng Việt; “bà” là đại từ xưng hô trang trọng, không thêm sắc thái thân mật.
- source_word: Καλῶς εἶπας
  choice: Bà nói đúng
  rationale: Καλῶς ở đây xác nhận tính đúng đắn của lời bà vừa nói; “nói đúng” tự nhiên và rõ hơn cách dịch sát chữ “nói tốt”.
- source_word: ὅτι Ἄνδρα οὐκ ἔχω
  choice: 'khi nói: ‘Tôi không có chồng.’'
  rationale: ὅτι giới thiệu nội dung lời nói. Bản dịch giữ nguyên việc Đức Giê-su nhắc lại lời của người phụ nữ, đồng thời dùng kết cấu tiếng Việt tự nhiên.
theological_decisions:
- issue: Nghĩa của ἀνήρ trong lời người phụ nữ
  choice: chồng
  alternative: người đàn ông
  rationale: ἀνήρ có thể chỉ “người đàn ông” hoặc “chồng”, nhưng câu kế tiếp nói rõ về lịch sử hôn nhân của bà, nên “chồng” là nghĩa phù hợp với văn cảnh mà không thêm diễn giải thần học.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Giê-su” theo lối gọi tôn kính quen thuộc; giữ nguyên sự lặp lại có chủ ý trong nguyên văn.
