  source_fidelity: 'Bản dịch truyền đạt đúng diễn tiến và nội dung của câu: người phụ nữ trả lời rằng bà không có chồng, và Đức Giê-su xác nhận lời ấy. “Chồng” là nghĩa phù hợp của ἀνήρ trong văn cảnh gần. Tuy nhiên, “Bà nói đúng khi nói” không phản ánh tự nhiên quan hệ nội dung do ὅτι giới thiệu và tạo lặp từ không cần thiết.'
