  source_fidelity: 'Bản dịch phản ánh đúng trình tự và nội dung của nguyên văn: viên quan nghe tin, đến với Đức Giê-su, thỉnh cầu Người xuống chữa lành con trai, vì người con sắp chết. Tuy nhiên, “cậu bé” thu hẹp υἱός (“con trai”) thành một độ tuổi mà câu Hy Lạp này không nêu rõ.'
  naturalness: Văn phong tự nhiên, trang trọng. Cụm “đã từ miền Giu-đê đến miền Ga-li-lê” có thể được sắp xếp lại thành “đã đến miền Ga-li-lê từ miền Giu-đê” cho mạch tiếng Việt sáng rõ hơn.
  terminology: “Đức Giê-su,” “Giu-đê,” “Ga-li-lê,” “Người,” và “chữa lành” nhất quán với register đã chọn. “Con trai ông” giữ đúng mức độ xác định của υἱός.
  issues:
  - severity: medium
    issue: Neo chú thích a hiện đặt sau “Người”, thay vì sau động từ “xin”.
    rationale: Chú thích a giải thích thể chưa hoàn thành của ἠρώτα, được dịch là “xin”; neo phải gắn với chính từ/cụm từ được chú giải để tránh hiểu nhầm rằng chú thích nói về “Người”.
  - severity: low
    issue: “Cậu bé” thêm sắc thái tuổi tác.
    rationale: υἱός nghĩa là “con trai” và bản thân câu không xác định người con là một cậu bé. Dùng “con trai ông” bảo toàn độ mở của nguyên văn.
