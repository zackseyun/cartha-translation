id: JHN.4.47
reference: John 4:47
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οὗτος ἀκούσας ὅτι Ἰησοῦς ἥκει ἐκ τῆς Ἰουδαίας εἰς τὴν Γαλιλαίαν ἀπῆλθεν πρὸς αὐτὸν καὶ ⸀ἠρώτα ἵνα καταβῇ καὶ ἰάσηται αὐτοῦ τὸν υἱόν, ἤμελλεν γὰρ ἀποθνῄσκειν.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/047.yaml
  text: When this man heard that Jesus had come from Judea into Galilee[a], he went to him and asked him to come down and heal his son[b], for he was about to die.
translation:
  language: vi
  text: Khi người này nghe tin Đức Giê-su đã đến miền Ga-li-lê từ miền Giu-đê, ông đến gặp Người và xin[a] Người xuống[b] chữa lành con trai ông, vì người con ấy sắp chết.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “cứ xin Người”; thể chưa hoàn thành trong tiếng Hy Lạp có thể gợi một lời thỉnh cầu kéo dài hoặc lặp lại.
    reason: lexical_alternative
  - marker: b
    text: “Xuống” phản ánh sự chênh lệch độ cao giữa các địa điểm tại Ga-li-lê.
    reason: cultural_note
lexical_decisions:
- source_word: οὗτος
  choice: người này
  rationale: Giữ sắc thái chỉ định của đại từ Hy Lạp và quy chiếu tự nhiên về viên quan đã được nhắc đến ở câu trước.
- source_word: ἀκούσας ὅτι
  choice: khi ... nghe tin
  rationale: Chuyển phân từ bất định sang mệnh đề thời gian tự nhiên trong tiếng Việt; “nghe tin” phù hợp với nội dung được thuật lại sau ὅτι.
- source_word: ἥκει
  choice: đã ... đến
  rationale: Diễn đạt việc Đức Giê-su đã tới và hiện diện tại Ga-li-lê, phù hợp với ý nghĩa kết quả của ἥκω trong ngữ cảnh.
- source_word: ἐκ τῆς Ἰουδαίας εἰς τὴν Γαλιλαίαν
  choice: từ miền Giu-đê đến miền Ga-li-lê
  rationale: Giữ rõ điểm xuất phát và điểm đến; thêm “miền” để các địa danh khu vực được hiểu tự nhiên trong tiếng Việt.
- source_word: ἀπῆλθεν πρὸς αὐτόν
  choice: ông đến gặp Người
  rationale: Diễn đạt tự nhiên hành động đi tới chỗ Đức Giê-su; “gặp” làm rõ hướng đến một người mà không thêm nội dung đáng kể.
- source_word: ἠρώτα
  choice: xin
  rationale: ἐρωτάω ở đây là đưa ra lời thỉnh cầu. “Xin” tự nhiên và không cường điệu thành “van xin”; thể chưa hoàn thành được ghi nhận trong chú thích vì có thể chỉ hành động đang diễn ra hoặc lặp lại.
- source_word: ἵνα καταβῇ
  choice: Người xuống
  rationale: Sau “xin”, cấu trúc tiếng Việt không cần liên từ tương ứng với ἵνα. “Xuống” giữ nét địa hình của καταβαίνω.
- source_word: ἰάσηται
  choice: chữa lành
  rationale: Diễn đạt trực tiếp việc phục hồi khỏi bệnh trong ngữ cảnh chữa bệnh, đồng thời giữ văn phong trang trọng, dễ hiểu.
- source_word: αὐτοῦ τὸν υἱόν
  choice: con trai mình
  rationale: Đại từ phản thân “mình” quy chiếu tự nhiên về chủ ngữ “ông” và tránh lặp nặng nề.
- source_word: ἤμελλεν γὰρ ἀποθνῄσκειν
  choice: vì cậu bé sắp chết
  rationale: “Sắp chết” truyền đạt rõ tính cận kề của μέλλω với động từ nguyên mẫu; “cậu bé” làm rõ người sắp chết là người con.
theological_decisions:
- issue: Chủ thể của cụm “sắp chết”
  choice: Người con trai
  alternative: Đức Giê-su hoặc viên quan
  rationale: Danh ngữ gần nhất và mạch văn đều cho thấy mệnh đề này nói về người con trai; cách dịch “cậu bé” làm rõ quy chiếu mà không thay đổi ý nghĩa.
- issue: Sắc thái thể của ἠρώτα
  choice: Dịch chính là “xin” và bảo lưu khả năng tiếp diễn/lặp lại trong chú thích
  alternative: “cứ xin” hoặc “khẩn khoản xin”
  rationale: Thể chưa hoàn thành có thể gợi hành động kéo dài hay lặp lại nhưng không bắt buộc. Bản dịch chính tránh quyết định quá mức; chú thích giữ lại sắc thái khả hữu của nguyên văn.
translation_notes:
  register: 'Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Người” làm đại từ tôn kính chỉ Đức Giê-su, không đưa thêm nét giáo phái. Các tên địa lý được phiên âm theo lối quen thuộc: Giu-đê, Ga-li-lê.'
