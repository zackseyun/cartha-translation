  to: Khi người này nghe tin Đức Giê-su đã đến miền Ga-li-lê từ miền Giu-đê, ông đến gặp Người và xin[a] Người xuống[b] chữa lành con trai ông, vì người con ấy sắp chết.
  rationale: Đã chuyển neo chú thích a đến “xin”, là từ dịch ἠρώτα; thay “cậu bé” bằng “người con ấy” để không thêm thông tin về tuổi; và điều chỉnh trật tự cụm chỉ hướng đi cho tự nhiên hơn trong tiếng Việt. Các sửa đổi không thay đổi ý nghĩa câu.
