revisions:
- from: Đây lại là dấu lạ thứ hai Đức Giê-su đã làm sau khi từ Giu-đê đến Ga-li-lê.[a]
  to: Sau khi từ Giu-đê đến Ga-li-lê, đây lại là dấu lạ thứ hai Đức Giê-su đã làm.[a]
  rationale: Sửa vị trí trạng ngữ để phản ánh rõ phân từ “sau khi đến” quy về Đức Giê-su, đồng thời sửa câu chú thích cho tự nhiên và chính xác hơn. Không thay đổi ý nghĩa, trình tự, hay thuật ngữ chủ chốt của nguyên văn.
