source:
  edition: SBLGNT
  text: τοῦτο ⸀δὲ πάλιν δεύτερον σημεῖον ἐποίησεν ὁ Ἰησοῦς ἐλθὼν ἐκ τῆς Ἰουδαίας εἰς τὴν Γαλιλαίαν.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/054.yaml
  text: This again was the second sign Jesus did after coming from Judea into Galilee[a].
translation:
  language: vi
  text: Sau khi từ Giu-đê đến Ga-li-lê, đây lại là dấu lạ thứ hai Đức Giê-su đã làm.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “phép lạ.” Giăng thường dùng từ “dấu lạ” để nhấn mạnh cả ý nghĩa lẫn quyền năng của hành động ấy.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο
  choice: Đây
  rationale: Đại từ chỉ định quy chiếu về việc chữa lành vừa được thuật lại; “Đây” tự nhiên và rõ nghĩa trong tiếng Việt.
- source_word: δὲ πάλιν
  choice: lại
  rationale: δέ là liên từ nhẹ, còn πάλιν diễn tả sự lặp lại; gộp thành “lại” giúp câu tiếng Việt tự nhiên mà vẫn giữ quan hệ nối tiếp.
- source_word: δεύτερον
  choice: thứ hai
  rationale: Giữ nguyên ý nghĩa số thứ tự bổ nghĩa cho “dấu lạ”.
- source_word: σημεῖον
  choice: dấu lạ
  rationale: '“Dấu lạ” vừa dễ hiểu trong tiếng Việt, vừa giữ được chức năng của σημεῖον trong sách Giăng: một việc quyền năng mang ý nghĩa chỉ dấu, không chỉ đơn thuần là phép mầu.'
- source_word: ἐποίησεν
  choice: đã làm
  rationale: Cách diễn đạt thông dụng, gần với động từ ποιέω và phù hợp với cụm “làm dấu lạ”.
- source_word: ἐλθὼν
  choice: sau khi ... đến
  rationale: Phân từ bất định quá khứ có sắc thái thời gian trong ngữ cảnh; “sau khi” thể hiện hành động đến trước việc làm dấu lạ.
- source_word: ἐκ τῆς Ἰουδαίας εἰς τὴν Γαλιλαίαν
  choice: từ Giu-đê đến Ga-li-lê
  rationale: Diễn đạt tự nhiên hướng chuyển động từ nơi xuất phát đến đích, tương ứng với ἐκ ... εἰς.
theological_decisions:
- issue: Thuật ngữ σημεῖον trong sách Giăng
  choice: dấu lạ
  alternative: phép lạ
  rationale: “Dấu lạ” bảo tồn chiều kích mặc khải và chức năng chỉ dấu đặc trưng của thuật ngữ trong sách Giăng, trong khi chú thích nêu phương án quen thuộc “phép lạ” mà không áp đặt thêm cách giải thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng cách phiên âm địa danh và tên riêng quen thuộc trong truyền thống Kinh Thánh tiếng Việt; cấu trúc câu gọn, giữ rõ trình tự thời gian của nguyên văn.
