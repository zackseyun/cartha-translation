  text: Ἔρχεται γυνὴ ἐκ τῆς Σαμαρείας ἀντλῆσαι ὕδωρ. λέγει αὐτῇ ὁ Ἰησοῦς· Δός μοι πεῖν·
base_translation:
  language: en
  yaml_path: translation/nt/john/004/007.yaml
  text: A woman from Samaria came to draw water. Jesus said to her[a], “Give me a drink.”
translation:
  language: vi
  text: 'Một người phụ nữ từ Sa-ma-ri đến để múc nước. Giê-su nói với bà[a]: “Xin cho tôi uống.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn dùng thì hiện tại lịch sử cho “đến” và “nói”; trong tiếng Việt, động từ không đánh dấu thì nên mạch kể được hiểu theo ngữ cảnh.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔρχεται
  choice: đến
  rationale: Đây là thì hiện tại lịch sử trong lời kể. Tiếng Việt không biến đổi động từ theo thì, nên “đến” vừa tự nhiên vừa không cần thêm dấu hiệu quá khứ.
- source_word: γυνὴ
  choice: một người phụ nữ
  rationale: Trong ngữ cảnh, từ này chỉ một phụ nữ chưa được xác định, không mang nghĩa chuyên biệt là “vợ”.
- source_word: ἐκ τῆς Σαμαρείας
  choice: từ Sa-ma-ri
  rationale: Diễn đạt trực tiếp nguồn gốc hoặc nơi bà đi ra; không tự ý đổi thành “một phụ nữ Sa-ma-ri,” vì câu Hy Lạp ở đây dùng cụm chỉ nơi chốn.
- source_word: ἀντλῆσαι ὕδωρ
  choice: để lấy nước
  rationale: Động từ nguyên mẫu chỉ mục đích. “Lấy nước” là cách nói tự nhiên trong tiếng Việt và phù hợp với việc lấy nước từ giếng.
- source_word: λέγει αὐτῇ
  choice: nói với bà
  rationale: Động từ Hy Lạp là hiện tại lịch sử. Tiếng Việt kể chuyện tự nhiên bằng dạng động từ không đánh dấu thì; “bà” là đại từ lịch sự thích hợp cho một phụ nữ trưởng thành.
- source_word: Δός μοι πεῖν
  choice: Cho tôi uống một chút
  rationale: Câu mệnh lệnh diễn đạt một lời xin nước uống. “Cho tôi uống một chút” tự nhiên và giữ được sắc thái yêu cầu trực tiếp hơn cách dịch cứng “Hãy cho tôi để uống”.
theological_decisions:
- issue: Ý nghĩa của “Sa-ma-ri”
  choice: Giữ cách nói “một người phụ nữ từ Sa-ma-ri,” chỉ nơi bà đến từ.
  alternative: Dịch là “một phụ nữ Sa-ma-ri” hoặc “một người phụ nữ từ thành Sa-ma-ri.”
  rationale: Nguyên văn câu này nói bà đến “từ Sa-ma-ri,” chứ chưa trực tiếp dùng tính từ chỉ dân tộc và cũng không xác định rõ là thành phố. Bản dịch tránh đưa thêm kết luận dân tộc hoặc địa lý vượt quá câu chữ.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. Dùng “Đức Chúa Jêsus” theo lối gọi kính trọng; “bà” thể hiện phép xưng hô tự nhiên. Tên địa danh được viết “Sa-ma-ri”.
