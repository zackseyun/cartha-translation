revisions:
- from: 'Một người phụ nữ từ Sa-ma-ri đến lấy nước. Đức Chúa Jêsus nói với bà[a]: “Cho tôi uống một chút.”'
  to: 'Một người phụ nữ từ Sa-ma-ri đến để múc nước. Giê-su nói với bà[a]: “Xin cho tôi uống.”'
  rationale: Loại bỏ tước hiệu không có trong nguyên văn và từ “một chút” được thêm vào; dùng “múc nước” để phản ánh ἀντλῆσαι. Chú thích về thì hiện tại lịch sử được giữ nhưng diễn đạt phù hợp với đặc điểm không biến đổi thì của động từ tiếng Việt.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T05:37:12Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp truyền đạt đúng trình tự cơ bản và cụm “từ Sa-ma-ri”, nhưng “Đức Chúa Jêsus” thêm một tước hiệu không có trong tiếng Hy Lạp (ὁ Ἰησοῦς: “Chúa Giê-su/Jesus” chỉ là tên riêng với mạo từ trong ngữ cảnh này). “một chút” cũng thêm giới hạn không được nêu trong Δός μοι πεῖν. “Múc nước” phản ánh chính xác hơn ἀντλῆσαι ὕδωρ, tức lấy/draw nước từ giếng.'
  naturalness: Câu sửa dùng tiếng Việt hiện đại, rõ ràng và tự nhiên. “Giê-su nói với bà” tránh cách xưng hô mang tính diễn giải về tuổi tác hay địa vị, đồng thời vẫn lịch sự trong văn cảnh.
  terminology: Dùng dạng tên hiện đại thông dụng “Giê-su” và không thêm tước hiệu thần học. Giữ “Sa-ma-ri” theo cách phiên âm đang dùng trong bản nháp. “Xin cho tôi uống” là lời thỉnh cầu tự nhiên, tương ứng với mệnh lệnh ngắn trong nguyên văn mà không thêm “một chút”.
  issues:
  - severity: high
    issue: “Đức Chúa Jêsus” thêm tước hiệu và dùng dạng chính tả không phù hợp mục tiêu hiện đại.
    rationale: Nguyên văn chỉ viết ὁ Ἰησοῦς, tức “Giê-su/Jesus” trong vai chủ ngữ; không có κύριος (“Chúa”) hay một tước hiệu tương đương. Bản dịch không nên đưa thêm tước hiệu thần học vào câu.
  - severity: medium
    issue: “một chút” không có trong Δός μοι πεῖν.
    rationale: Cụm Hy Lạp yêu cầu một thức uống/nước để uống, nhưng không định lượng là “một chút”.
  - severity: low
    issue: “lấy nước” kém cụ thể hơn động từ ἀντλέω.
    rationale: Trong bối cảnh giếng, “múc nước” phản ánh rõ hành động draw water mà vẫn tự nhiên trong tiếng Việt.
  revised_text: 'Một người phụ nữ từ Sa-ma-ri đến để múc nước. Giê-su nói với bà[a]: “Xin cho tôi uống.”'
