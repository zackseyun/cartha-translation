id: JHN.4.4
reference: John 4:4
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἔδει δὲ αὐτὸν διέρχεσθαι διὰ τῆς Σαμαρείας.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/004.yaml
  text: He had to pass through Samaria[a].
translation:
  language: vi
  text: Ngài phải đi qua miền Sa-ma-ri[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Ngài cần phải đi qua miền Sa-ma-ri.” Tiếng Hy Lạp nói đến sự cần thiết nhưng không nêu rõ lý do cụ thể.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδει
  choice: phải
  rationale: Động từ ở thì chưa hoàn thành diễn tả sự cần thiết trong mạch kể quá khứ. “Phải” tự nhiên, gọn và giữ nguyên ý cần thiết mà không xác định căn nguyên.
- source_word: δὲ
  choice: không dịch thành từ riêng
  rationale: δέ ở đây là liên từ nhẹ để tiếp nối câu chuyện, không biểu thị sự tương phản mạnh. Tiếng Việt không cần thêm “nhưng” hoặc “bấy giờ”, vì như vậy có thể nhấn quá mức.
- source_word: αὐτὸν
  choice: Ngài
  rationale: Dù αὐτόν ở đối cách vì làm chủ ngữ của cấu trúc nguyên mẫu, tiếng Việt tự nhiên chuyển thành chủ ngữ của mệnh đề hữu hạn. “Ngài” chỉ Chúa Giê-su một cách trang trọng và thông dụng.
- source_word: διέρχεσθαι
  choice: đi qua
  rationale: διέρχομαι đi với διά chỉ việc di chuyển qua một địa phận; “đi qua” là cách diễn đạt tự nhiên và chính xác.
- source_word: διὰ τῆς Σαμαρείας
  choice: qua miền Sa-ma-ri
  rationale: διά với sở hữu cách diễn tả chuyển động xuyên qua một nơi. Thêm “miền” làm rõ Sa-ma-ri ở đây là địa phận, không chỉ là một thành phố, mà vẫn giữ câu văn tự nhiên.
theological_decisions:
- issue: Sắc thái cần thiết của ἔδει
  choice: Dịch là “phải” nhưng không nói rõ lý do của sự cần thiết.
  alternative: Có thể hiểu là sự cần thiết do địa lý, hoặc là sự cần thiết thuộc ý định và sứ mạng thiêng liêng của Chúa Giê-su.
  rationale: Bản Hy Lạp khẳng định sự cần thiết nhưng riêng câu này không xác định nền tảng của nó. Bản dịch giữ nguyên sự mở ngỏ ấy, không tự ý giải quyết căng thẳng thần học.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” để nói về Chúa Giê-su; “Sa-ma-ri” theo lối phiên âm Kinh Thánh quen thuộc. Dấu chú thích [a] xuất hiện ngay trong chính văn.
