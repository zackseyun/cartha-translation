reference: John 4:27
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ ἐπὶ τούτῳ ἦλθαν οἱ μαθηταὶ αὐτοῦ, καὶ ⸀ἐθαύμαζον ὅτι μετὰ γυναικὸς ἐλάλει· οὐδεὶς μέντοι εἶπεν· Τί ζητεῖς; ἢ τί λαλεῖς μετ’ αὐτῆς;
base_translation:
  language: en
  yaml_path: translation/nt/john/004/027.yaml
  text: And at this point his disciples came[a], and they were amazed that he was speaking with a woman. Yet no one said, “What are you seeking?” or[b], “Why are you speaking with her?”
translation:
  language: vi
  text: 'Đúng lúc ấy, các môn đồ của Ngài trở về và ngạc nhiên vì Ngài đang nói chuyện với một phụ nữ. Tuy vậy, không ai hỏi: “Thầy đang tìm gì[a]?” hoặc: “Tại sao Thầy nói chuyện với người phụ nữ ấy[b]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát nghĩa: “Thầy đang tìm kiếm điều gì?” Cũng có thể hiểu theo ngữ cảnh: “Thầy muốn gì?”'
    reason: lexical_alternative
  - marker: b
    text: 'Theo từng từ: “Thầy đang nói gì với người phụ nữ ấy?” Trong ngữ cảnh, câu này có nghĩa tự nhiên là: “Tại sao Thầy nói chuyện với người phụ nữ ấy?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπὶ τούτῳ
  choice: Đúng lúc ấy
  rationale: Diễn đạt tự nhiên ý nghĩa thời gian “ngay tại thời điểm này”, đồng thời giữ mạch kể rằng các môn đồ trở về đúng khi cuộc trò chuyện đang diễn ra.
- source_word: ἦλθαν
  choice: trở về
  rationale: Động từ có nghĩa cơ bản là “đến”; trong ngữ cảnh các môn đồ đã vào thành rồi quay lại với Đức Giê-su, “trở về” diễn đạt tự nhiên hướng chuyển động theo mạch truyện.
- source_word: ἐθαύμαζον
  choice: ngạc nhiên
  rationale: Thì chưa hoàn thành mô tả phản ứng đang diễn ra của các môn đồ. “Ngạc nhiên” là cách nói hiện đại, không cường điệu thành kinh hãi.
- source_word: μετὰ γυναικὸς
  choice: với một phụ nữ
  rationale: Danh từ không có mạo từ mang nghĩa bất định ở đây; ngữ cảnh chỉ một người phụ nữ, không phải “vợ”.
- source_word: ἐλάλει
  choice: đang nói chuyện
  rationale: Giữ khía cạnh tiếp diễn của thì chưa hoàn thành và diễn đạt tự nhiên một cuộc đối thoại.
- source_word: μέντοι
  choice: Tuy vậy
  rationale: 'Thể hiện sự tương phản: họ ngạc nhiên, nhưng không ai nói ra thắc mắc.'
- source_word: Τί ζητεῖς;
  choice: Thầy muốn gì?
  rationale: ζητέω theo nghĩa đen là “tìm kiếm”, nhưng khi không nêu bổ ngữ trong ngữ cảnh này, câu hỏi tự nhiên có thể mang nghĩa “Thầy muốn gì?”. Giữ nghĩa sát hơn trong chú thích.
- source_word: τί λαλεῖς μετ’ αὐτῆς;
  choice: Tại sao Thầy nói chuyện với bà ấy?
  rationale: Dù τί theo nghĩa đen là “gì”, cấu trúc với “nói chuyện với bà ấy” có lực dụng học là hỏi lý do; tiếng Việt tự nhiên dùng “tại sao”.
theological_decisions:
- issue: Hàm ý xã hội của việc Đức Giê-su nói chuyện với một phụ nữ
  choice: Chỉ thuật lại sự ngạc nhiên của các môn đồ, không giải thích nguyên nhân trong câu chính.
  alternative: Bổ sung rằng sự ngạc nhiên bắt nguồn từ quy ước nam-nữ hoặc quan hệ Do Thái–Sa-ma-ri.
  rationale: Bản Hy Lạp chỉ nói họ ngạc nhiên vì Ngài nói chuyện với một phụ nữ; câu này không nêu cụ thể nguyên nhân xã hội hay sắc tộc.
- issue: Đối tượng của câu hỏi Τί ζητεῖς;
  choice: Giữ câu hỏi hướng đến Đức Giê-su bằng đại từ xưng hô “Thầy”, nhưng không thêm một bổ ngữ như “ở bà ấy”.
  alternative: 'Dịch mở rộng: “Thầy muốn gì ở bà ấy?” hoặc hiểu câu hỏi là dành cho người phụ nữ.'
  rationale: Động từ ngôi thứ hai số ít không biểu thị giới tính, nên về hình thức có thể gây lưỡng nghĩa; tuy nhiên câu hỏi kế tiếp rõ ràng hướng đến Đức Giê-su. Không thêm “ở bà ấy” vì nguyên văn không có bổ ngữ ấy.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Ngài” trong lời trần thuật và “Thầy” trong câu hỏi giả định của các môn đồ. “Một phụ nữ” giữ sự tiết chế của nguyên văn; không đưa lời giải thích phong tục hay sắc tộc vào câu chính.
