    issue: Câu hỏi thứ nhất dịch ζητεῖς là “muốn gì”.
    rationale: “Muốn gì” là một cách hiểu dụng học có thể có, nhưng ζητεῖς có nghĩa cơ bản là “đang tìm/kiếm”. Bản chính nên giữ nghĩa này; cách hiểu “muốn gì” có thể đặt trong chú thích.
  - severity: low
    issue: “bà ấy” có thể gợi tuổi tác hoặc quan hệ xưng hô không được nguyên ngữ xác định.
    rationale: γυνή chỉ nêu một người phụ nữ. “người phụ nữ ấy” trung tính hơn, đồng thời vẫn tự nhiên trong văn phong tường thuật/lời thoại trang trọng.
