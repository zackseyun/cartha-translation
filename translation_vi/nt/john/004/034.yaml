revisions:
- from: 'Đức Chúa Jêsus nói với họ: “Thức ăn của tôi là làm theo ý muốn của Đấng đã sai tôi và hoàn tất công việc của Ngài.”[a][b]'
  to: 'Giê-su nói với họ: “Thức ăn của tôi là làm theo ý muốn của Đấng đã sai tôi[b] và hoàn tất công việc của Ngài[a].”'
  rationale: Sửa tên riêng thành “Giê-su” để phản ánh chính xác ὁ Ἰησοῦς mà không bổ sung danh hiệu không có trong câu. Giữ nguyên các lựa chọn dịch trung tâm vốn phù hợp với βρῶμα, θέλημα, τελειώσω và ἔργον; chỉ điều chỉnh neo chú thích và diễn đạt phương án thay thế của τελειώσω cho sát nghĩa “finish.”
