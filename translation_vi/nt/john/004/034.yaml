source:
  edition: SBLGNT
  text: λέγει αὐτοῖς ὁ Ἰησοῦς· Ἐμὸν βρῶμά ἐστιν ἵνα ⸀ποιήσω τὸ θέλημα τοῦ πέμψαντός με καὶ τελειώσω αὐτοῦ τὸ ἔργον.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/034.yaml
  text: Jesus said to them[b][a], “My food is to do the will of him who sent me and to complete his work.”
translation:
  language: vi
  text: 'Giê-su nói với họ: “Thức ăn của tôi là làm theo ý muốn của Đấng đã sai tôi[b] và hoàn tất công việc của Ngài[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “làm xong công việc của Ngài.”'
    reason: lexical_alternative
  - marker: b
    text: “Đấng đã sai tôi” theo ngữ cảnh chỉ về Đức Chúa Cha, dù nguyên văn Hy Lạp ở đây không nêu tước hiệu ấy.
    reason: cross_reference
lexical_decisions:
- source_word: λέγει αὐτοῖς ὁ Ἰησοῦς
  choice: Đức Chúa Jêsus nói với họ
  rationale: Dùng thì kể chuyện tự nhiên trong tiếng Việt cho hiện tại lịch sử λέγει; giữ rõ chủ thể và người nghe.
- source_word: Ἐμὸν βρῶμά ἐστιν
  choice: Thức ăn của tôi là
  rationale: Giữ nguyên ẩn dụ cụ thể về thức ăn, nối trực tiếp với cuộc trò chuyện về việc ăn trong ngữ cảnh.
- source_word: ἵνα ποιήσω τὸ θέλημα
  choice: làm theo ý muốn
  rationale: Cách nói tiếng Việt tự nhiên để diễn đạt việc thực hiện θέλημα; “theo” làm rõ ý vâng làm mà không thêm nội dung ngoài nguyên văn.
- source_word: τοῦ πέμψαντός με
  choice: của Đấng đã sai tôi
  rationale: Danh xưng “Đấng” diễn đạt tự nhiên một sở chỉ ngôi vị được tôn kính, nhưng không chèn thêm tước hiệu “Cha” vốn không xuất hiện minh nhiên trong câu Hy Lạp.
- source_word: τελειώσω
  choice: hoàn tất
  rationale: Diễn đạt việc đưa điều gì đến chỗ trọn vẹn hoặc kết thúc, giữ được sắc thái mạnh hơn chỉ đơn thuần “làm xong”.
- source_word: αὐτοῦ τὸ ἔργον
  choice: công việc của Ngài
  rationale: “Công việc” là từ tương ứng rộng và tự nhiên cho ἔργον; “Ngài” phù hợp với lối xưng hô tôn kính trong văn phong Kinh Thánh tiếng Việt.
theological_decisions:
- issue: Sở chỉ của “Đấng đã sai tôi”
  choice: Giữ cách nói hàm ẩn “Đấng đã sai tôi” trong chính văn.
  alternative: Dịch tường minh là “Cha, Đấng đã sai tôi” hoặc “Đức Chúa Trời, Đấng đã sai tôi”.
  rationale: Ngữ cảnh sách Giăng cho thấy sở chỉ là Đức Chúa Cha, nhưng câu Hy Lạp tại đây không nêu tước hiệu ấy; bản dịch không nên âm thầm bổ sung.
- issue: Sắc thái của τελειώσω
  choice: hoàn tất
  alternative: hoàn thành; làm xong
  rationale: “Hoàn tất” giữ cả ý kết thúc lẫn đưa công việc đến mục tiêu, nhưng không ép từ này thành một khẳng định thần học chuyên biệt.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng và dễ hiểu. Giữ ẩn dụ “thức ăn,” tránh giải nghĩa quá mức, và bảo lưu cách quy chiếu hàm ẩn của nguyên văn. Các dấu chú thích được đặt ngay sau câu liên quan.
