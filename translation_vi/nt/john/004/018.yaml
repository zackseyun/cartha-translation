base_translation:
  language: en
  yaml_path: translation/nt/john/004/018.yaml
  text: For you have had five husbands[a], and the man you now have is not your husband; this you have said truly.
translation:
  language: vi
  text: Vì chị đã có năm người chồng[a], còn người mà hiện nay chị đang có không phải là chồng chị; chị nói như vậy là đúng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát hơn: “Vì chị đã có năm người đàn ông, còn người mà hiện nay chị có không phải là người đàn ông hay chồng của chị.” Từ Hy Lạp ἀνήρ có thể có nghĩa là “người đàn ông” hoặc “chồng”; trong mạch văn này, nghĩa “chồng” phù hợp hơn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πέντε γὰρ ἄνδρας ἔσχες
  choice: Vì chị đã có năm người chồng
  rationale: γάρ mang ý giải thích cho lời xác nhận của Đức Giê-su; ἀνήρ trong mạch văn chỉ người chồng, còn ἔσχες nói đến lịch sử hôn nhân trước đó.
- source_word: καὶ νῦν ὃν ἔχεις
  choice: còn người đàn ông chị đang chung sống hiện nay
  rationale: Cách dịch này diễn đạt tự nhiên mối quan hệ hiện tại được hàm ý bởi ἔχεις, đồng thời không gọi người ấy là chồng trước khi mệnh đề kế tiếp phủ định điều đó.
- source_word: οὐκ ἔστιν σου ἀνήρ
  choice: không phải là chồng chị
  rationale: Đại từ sở hữu σου cùng ἀνήρ diễn tả quan hệ hôn nhân; câu tiếng Việt này rõ ràng và tự nhiên.
- source_word: τοῦτο ἀληθὲς εἴρηκας
  choice: chị đã nói điều này đúng sự thật
  rationale: Giữ khá sát cấu trúc Hy Lạp, trong đó τοῦτο là đối tượng của εἴρηκας và ἀληθές nêu tính chân thật của lời vừa nói; thì hoàn thành nhấn mạnh lời đã được nói và vẫn có giá trị ở hiện tại.
theological_decisions:
- issue: Nghĩa của ἀνήρ trong hai lần xuất hiện
  choice: Dịch lần đầu là “người chồng” và lần sau là “chồng”.
  alternative: Dịch sát nghĩa rộng hơn là “người đàn ông/đàn ông”.
  rationale: Mạch văn về lịch sử hôn nhân và sự tương phản với quan hệ hiện tại nghiêng rõ về nghĩa “chồng”, nhưng chú thích vẫn bảo tồn phạm vi nghĩa rộng hơn của từ Hy Lạp.
- issue: Cách diễn đạt ὃν ἔχεις
  choice: “người đàn ông chị đang chung sống hiện nay”
  alternative: “người chị hiện có” hoặc “người đàn ông chị đang có”.
  rationale: Tiếng Việt không tự nhiên khi dùng “có” trực tiếp về một người trong quan hệ này. “Đang chung sống” truyền đạt sự liên hệ hiện tại mà không bổ sung nhận định đạo đức hay pháp lý ngoài lời phủ định kế tiếp.
translation_notes:
  register: Dùng tiếng Việt hiện đại, trang trọng và dễ hiểu. Đại từ “chị” phù hợp với lời Đức Giê-su nói trực tiếp với một phụ nữ trưởng thành mà không tạo sắc thái miệt thị. Dấu chấm phẩy duy trì sự gắn kết giữa lời bày tỏ hoàn cảnh và lời xác nhận tính chân thật.
