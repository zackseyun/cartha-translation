  text: ἀφῆκεν οὖν τὴν ὑδρίαν αὐτῆς ἡ γυνὴ καὶ ἀπῆλθεν εἰς τὴν πόλιν καὶ λέγει τοῖς ἀνθρώποις·
base_translation:
  language: en
  yaml_path: translation/nt/john/004/028.yaml
  text: So the woman left her water jar and went into the town and says to the people,
translation:
  language: vi
  text: 'Vậy, người phụ nữ để vò nước lại, đi vào thành và nói với mọi người:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑδρία
  choice: vò nước
  rationale: Chỉ chiếc vò dùng để đựng hoặc lấy nước; cách nói tự nhiên, rõ nghĩa trong tiếng Việt hiện đại.
- source_word: πόλις
  choice: thành
  rationale: Trong bối cảnh này, 'thành' phù hợp với cách gọi địa điểm dân cư trong văn phong Kinh Thánh và vẫn dễ hiểu.
- source_word: ἄνθρωποι
  choice: mọi người
  rationale: Dạng số nhiều có nghĩa chung là những người ở đó; 'mọi người' tự nhiên hơn 'những người' trong lời dẫn này.
- source_word: λέγει
  choice: nói
  rationale: Hiện tại lịch sử của tiếng Hy Lạp được chuyển bằng hiện tại không đánh dấu thời trong tiếng Việt, giữ sắc thái kể chuyện sống động mà không gượng ép.
theological_decisions: []
