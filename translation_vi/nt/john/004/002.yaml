translation:
  language: vi
  text: —dù chính Chúa Giê-su không làm phép báp-têm, nhưng các môn đệ Người làm[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Chính Chúa Giê-su không làm phép báp-têm, nhưng các môn đệ Người làm.” Động từ Hy Lạp ở thì quá khứ bất hoàn thành, có thể gợi ý một hành động đang diễn ra hoặc thường xuyên trong quá khứ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καίτοιγε
  choice: mặc dù
  rationale: Diễn đạt tự nhiên quan hệ nhượng bộ và lời đính chính đối với câu trước.
- source_word: Ἰησοῦς
  choice: Đức Chúa Giê-su
  rationale: Dùng cách gọi tên trang trọng, quen thuộc trong tiếng Việt Cơ Đốc.
- source_word: αὐτὸς
  choice: chính
  rationale: Giữ sắc thái nhấn mạnh rằng bản thân Chúa Giê-su không trực tiếp thực hiện việc làm phép báp-têm.
- source_word: οὐκ ἐβάπτιζεν
  choice: không làm phép báp-têm
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt; thì quá khứ bất hoàn thành Hy Lạp có thể chỉ hành động đang tiếp diễn hoặc thường lệ, nhưng tiếng Việt không bắt buộc đánh dấu riêng sắc thái ấy.
- source_word: ἀλλ’
  choice: mà
  rationale: Sau mệnh đề phủ định, “mà” diễn đạt tự nhiên sự tương phản và đính chính hơn “nhưng”.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: các môn đồ của Ngài làm
  rationale: Bổ sung động từ “làm” được tỉnh lược trong Hy Lạp, với nội dung “làm phép báp-têm” đã rõ từ mệnh đề trước.
theological_decisions:
- issue: Ai trực tiếp làm phép báp-têm trong chức vụ của Chúa Giê-su
  choice: Chính Chúa Giê-su không trực tiếp làm phép báp-têm; các môn đồ của Ngài làm.
  alternative: 'Có thể dịch đơn giản: “Chúa Giê-su không làm phép báp-têm, nhưng các môn đồ Ngài làm,” không giữ rõ nét nhấn mạnh của αὐτός.'
  rationale: Bản dịch giữ sự phân biệt có tính tường thuật giữa chính Chúa Giê-su và các môn đồ, không thêm lời giải thích thần học ngoài nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ dấu gạch ngang vì câu này là lời đính chính chen giữa mạch văn của Giăng 4:1–3. Dùng “làm phép báp-têm” để diễn đạt βαπτίζω theo cách quen thuộc, đồng thời tránh diễn giải thêm phương thức nghi lễ.
