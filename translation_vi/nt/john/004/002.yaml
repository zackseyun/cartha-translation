revisions:
- from: —mặc dù chính Đức Chúa Giê-su không làm phép báp-têm, mà các môn đồ của Ngài làm[a]—
  to: —dù chính Chúa Giê-su không làm phép báp-têm, nhưng các môn đệ Người làm[a]—
  rationale: Bản sửa thay “mà” bằng “nhưng” để phản ánh ἀλλ’ và tạo cấu trúc nhượng bộ tự nhiên trong tiếng Việt. “Chính” tiếp tục chuyển tải sự nhấn mạnh của αὐτός; động từ được lược ở vế sau được cung cấp tự nhiên bằng “làm.” Chú thích giữ lưu ý cần thiết về sắc thái bất hoàn thành mà không ép tiếng Việt phải biểu thị một cách diễn giải duy nhất.
  reviewer_model: gpt-5.6-terra
