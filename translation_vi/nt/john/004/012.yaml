id: JHN.4.12
reference: John 4:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: μὴ σὺ μείζων εἶ τοῦ πατρὸς ἡμῶν Ἰακώβ, ὃς ἔδωκεν ἡμῖν τὸ φρέαρ καὶ αὐτὸς ἐξ αὐτοῦ ἔπιεν καὶ οἱ υἱοὶ αὐτοῦ καὶ τὰ θρέμματα αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/john/004/012.yaml
  text: Are you greater than our father Jacob[a], who gave us the well and drank from it himself, as did his sons and his livestock?
translation:
  language: vi
  text: Chẳng lẽ ông lại lớn hơn tổ phụ chúng tôi là Gia-cốp[a], người đã cho chúng tôi giếng này, và chính người cùng các con trai và đàn gia súc của người đều đã uống nước từ đó sao?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch rõ hơn: “Ông không lớn hơn tổ phụ chúng tôi là Gia-cốp, phải không?” Câu hỏi Hy Lạp dùng μή, cho thấy người nói mong đợi câu trả lời phủ định.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ σὺ
  choice: Chẳng lẽ ông lại
  rationale: Cách hỏi với μή hướng người nghe đến câu trả lời phủ định; “chẳng lẽ... sao?” truyền đạt tự nhiên sắc thái chất vấn ấy, còn đại từ σὺ được nhấn bằng “ông lại” trong ngữ cảnh đối thoại.
- source_word: μείζων
  choice: lớn hơn
  rationale: Ở đây từ so sánh nói về tầm vóc hoặc địa vị, không phải kích thước thể chất; “lớn hơn” vừa sát nghĩa vừa tự nhiên.
- source_word: τοῦ πατρὸς ἡμῶν Ἰακώβ
  choice: tổ phụ chúng tôi là Gia-cốp
  rationale: πατήρ trong lời viện dẫn gia thế này chỉ vị tổ tiên; “tổ phụ” làm rõ quan hệ lịch sử mà vẫn giữ sắc thái tôn kính.
- source_word: ἔδωκεν ἡμῖν
  choice: đã cho chúng tôi
  rationale: Thì aorist trình bày việc đã xảy ra; “đã cho chúng tôi” là cách diễn đạt tiếng Việt trực tiếp và tự nhiên.
- source_word: τὸ φρέαρ
  choice: giếng này
  rationale: φρέαρ trong bối cảnh chỉ giếng; thêm “này” theo điểm quy chiếu hiện diện trong cuộc đối thoại, không đổi đối tượng được nói đến.
- source_word: καὶ αὐτὸς ἐξ αὐτοῦ ἔπιεν
  choice: và chính người ... đã uống nước từ đó
  rationale: “chính người” giữ sự nhấn mạnh của αὐτός; “uống nước từ đó” là cách nói tiếng Việt tự nhiên khi nguồn nước là một cái giếng.
- source_word: οἱ υἱοὶ αὐτοῦ
  choice: các con trai của người
  rationale: υἱοί là danh từ giống đực số nhiều, nên dịch cụ thể là “các con trai” thay vì khái quát thành “con cái”.
- source_word: τὰ θρέμματα αὐτοῦ
  choice: đàn gia súc của người
  rationale: θρέμματα chỉ những vật nuôi được chăn nuôi; “đàn gia súc” rõ ràng, hiện đại và không thu hẹp nghĩa vào riêng bò.
theological_decisions:
- issue: Lực ngôn trung của câu hỏi mở đầu bằng μή
  choice: Câu hỏi tu từ “Chẳng lẽ... sao?” hàm ý người nói mong đợi câu trả lời “không”
  alternative: “Ông không lớn hơn tổ phụ chúng tôi là Gia-cốp, phải không?”
  rationale: Cách diễn đạt được chọn bảo toàn sự thách thức và kỳ vọng phủ định của câu Hy Lạp mà không biến câu hỏi thành một lời khẳng định thẳng.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “ông” phù hợp lời người phụ nữ nói với một người đàn ông xa lạ; “tổ phụ” giữ sắc thái về di sản tổ tiên. Cấu trúc liệt kê được sắp lại nhẹ để câu tiếng Việt trôi chảy nhưng vẫn bảo toàn việc Gia-cốp, các con trai và gia súc đều uống từ giếng.
