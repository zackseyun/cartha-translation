  terminology: “Tổ phụ” chuyển đạt đúng sắc thái tổ tiên được tôn kính của πατήρ trong bối cảnh này; “Gia-cốp,” “các con trai,” và “đàn gia súc” đều chính xác và nhất quán. “Lớn hơn” ở đây có thể diễn đạt sự hơn trội về tầm vóc/địa vị như μείζων, không buộc nghĩa theo kích thước vật lý.
