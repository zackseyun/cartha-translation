  source_fidelity: 'Bản dịch bảo toàn đầy đủ các thành phần của câu Hy Lạp: câu hỏi tu từ với μή hàm ý đáp án phủ định; so sánh với tổ phụ Gia-cốp; việc ông ban giếng cho “chúng tôi”; và việc chính Gia-cốp, các con trai ông, cùng gia súc ông đều uống từ giếng. Trật tự tiếng Việt gộp ba chủ thể dưới “đều đã uống” vẫn truyền đạt đúng quan hệ cú pháp và sự nhấn mạnh của αὐτός.'
