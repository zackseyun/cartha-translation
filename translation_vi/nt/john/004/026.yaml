translation:
  language: vi
  text: 'Đức Giê-su nói với bà: “Ta là người đang nói với bà.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: nói
  rationale: Thì hiện tại lịch sử trong tiếng Hy Lạp được chuyển theo lối kể chuyện tự nhiên của tiếng Việt; “nói” rõ ràng, hiện đại và không làm tăng sắc thái trang trọng ngoài nguyên văn.
- source_word: αὐτῇ
  choice: với bà
  rationale: Đại từ tặng cách chỉ người phụ nữ Sa-ma-ri; “với bà” tự nhiên trong tiếng Việt và giữ thái độ tôn trọng.
- source_word: Ἐγώ εἰμι
  choice: Ta là
  rationale: Giữ nguyên cấu trúc ngắn gọn của tiếng Hy Lạp, không tự ý thêm “Đấng ấy” hay “Đấng Mê-si-a”. “Ta” phù hợp với lời Đức Giê-su trong văn phong Kinh Thánh trang trọng, còn “là” bảo tồn sự bỏ ngỏ của vị ngữ và âm hưởng thần học có thể có.
- source_word: ὁ λαλῶν σοι
  choice: người đang nói với bà đây
  rationale: Diễn đạt phân từ hiện tại có mạo từ như một cụm danh từ đồng vị. “Đang nói” giữ tính tiếp diễn, còn “đây” giúp câu nhận diện tự nhiên trong tiếng Việt mà không thêm một danh hiệu.
theological_decisions:
- issue: Có nên nói rõ Đức Giê-su tự nhận là Đấng Mê-si-a trong chính câu dịch hay không
  choice: Giữ “Ta là”, rồi đặt cụm “người đang nói với bà đây” làm phần đồng vị.
  alternative: “Ta chính là Đấng ấy, người đang nói với bà đây.”
  rationale: Ngữ cảnh câu trước cho thấy đối tượng được nhận diện là Đấng Mê-si-a, nhưng nguyên văn câu này không có từ tương đương với “Đấng ấy” hay “Đấng Mê-si-a”. Cách dịch chính giữ sự cô đọng và độ mở của nguyên văn; chú thích nêu cách hiểu được ngữ cảnh hàm ý.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Đức Giê-su” và đại từ tự xưng “Ta” theo văn phong Kinh Thánh dignified; dấu gạch ngang giúp cụm đồng vị tự nhiên hơn trong tiếng Việt mà vẫn giữ quan hệ cú pháp của nguyên văn.
