  text: πνεῦμα ὁ θεός, καὶ τοὺς προσκυνοῦντας αὐτὸν ἐν πνεύματι καὶ ἀληθείᾳ δεῖ προσκυνεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/024.yaml
  text: God is spirit[b][a], and those who worship him must worship in spirit and truth.
translation:
  language: vi
  text: Đức Chúa Trời là Thần[b], và những người thờ phượng Ngài phải thờ phượng trong tâm linh và chân lý.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “trong Đức Thánh Linh và chân lý.” Tiếng Hy Lạp có thể được hiểu theo nghĩa cụ thể hơn này, nhưng cách dịch trong câu chính giữ nghĩa rộng của cụm từ.'
    reason: alternative_reading
  - marker: b
    text: “Đức Chúa Trời là Thần” diễn tả bản tính của Ngài; câu này không chỉ có nghĩa rằng Đức Chúa Trời là một hữu thể thần linh giữa những hữu thể khác.
    reason: lexical_alternative
lexical_decisions:
- source_word: πνεῦμα
  choice: thần linh
  rationale: 'Danh từ vị ngữ không có mạo từ đứng trước ὁ θεός diễn tả phẩm tính hay bản tính: Đức Chúa Trời là thần linh, chứ không phải chỉ là một thần linh giữa nhiều thần linh khác.'
- source_word: ὁ θεός
  choice: Đức Chúa Trời
  rationale: Cách gọi trang trọng, quen thuộc trong tiếng Việt dành cho θεός khi chỉ Đức Chúa Trời; mạo từ xác định chủ ngữ của mệnh đề.
- source_word: τοὺς προσκυνοῦντας
  choice: những người thờ phượng
  rationale: Phân từ hiện tại có mạo từ được dùng như danh từ, chỉ chung những người thờ phượng; cách dịch này tự nhiên và giữ được ý nghĩa khái quát.
- source_word: ἐν πνεύματι
  choice: trong tâm linh
  rationale: Giữ nghĩa rộng của cụm từ không có mạo từ và tránh mặc nhiên xác định đây chỉ là sự quy chiếu trực tiếp đến Đức Thánh Linh. Cách hiểu “trong Thánh Linh” được ghi ở chú thích.
- source_word: ἀληθείᾳ
  choice: chân lý
  rationale: Diễn đạt ἀλήθεια theo nghĩa sự thật/chân lý, phù hợp sắc thái mặc khải trong sách Giăng hơn cách hiểu thu hẹp thành lòng chân thành.
- source_word: δεῖ
  choice: phải
  rationale: Diễn đạt trực tiếp tính tất yếu và bắt buộc của δεῖ trong tiếng Việt hiện đại.
- source_word: προσκυνεῖν
  choice: thờ phượng
  rationale: Cách dịch tự nhiên và đúng ngữ cảnh; không nhấn quá mức nét nghĩa lịch sử về động tác phủ phục.
theological_decisions:
- issue: Ý nghĩa của câu “Đức Chúa Trời là thần linh”
  choice: Một lời khẳng định về bản tính của Đức Chúa Trời, không nói Ngài chỉ là một thần linh thuộc cùng loại với các thần linh khác.
  alternative: Đức Chúa Trời là một thần linh.
  rationale: Trật tự từ Hy Lạp và danh từ vị ngữ πνεῦμα không có mạo từ thiên về ý nghĩa phẩm tính. Không thêm từ “một” để tránh biến lời khẳng định về bản tính thành sự phân loại.
- issue: Ý nghĩa của cụm “trong tâm linh và chân lý”
  choice: Sự thờ phượng phải mang tính thuộc linh và phù hợp với chân lý, nhưng bản dịch chính không xác định quá mức πνεῦμα là Đức Thánh Linh.
  alternative: trong Thánh Linh và chân lý
  rationale: πνεύματι và ἀληθείᾳ đều không có mạo từ; cách dịch chính giữ độ rộng và sự căng thẳng giải nghĩa của nguyên văn, còn cách hiểu cụ thể hơn được bảo lưu trong chú thích.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “Đức Chúa Trời” và đại từ tôn kính “Ngài”; chọn “tâm linh” trong cụm ἐν πνεύματι để phân biệt với lời khẳng định về bản tính “thần linh” và tránh tự ý đồng nhất cụm từ với Đức Thánh Linh.
