    issue: “thần linh” ở câu chính và chú thích b có thể gợi một hữu thể thần linh trong số nhiều thần linh.
    rationale: Trong tiếng Việt hiện đại, “thần linh” thường được dùng cho các thần linh/hữu thể siêu nhiên; vì vậy cụm “Đức Chúa Trời là thần linh” có nguy cơ truyền đạt chính sắc thái phân loại mà nguyên văn πνεῦμα không mạo từ, đứng vị ngữ trước chủ ngữ có mạo từ, không nhấn mạnh. “Đức Chúa Trời là Thần” phù hợp hơn với cách dùng Kinh Thánh Việt ngữ và nghĩa phẩm tính.
