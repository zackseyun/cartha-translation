- from: Đức Chúa Trời là thần linh[b], và những người thờ phượng Ngài phải thờ phượng trong tâm linh và chân lý.[a]
  to: Đức Chúa Trời là Thần[b], và những người thờ phượng Ngài phải thờ phượng trong tâm linh và chân lý.[a]
  rationale: Sửa duy nhất thuật ngữ “thần linh” thành “Thần” và điều chỉnh chú thích tương ứng. Điều này cải thiện độ tự nhiên của tiếng Việt và tránh hiểu πνεῦμα như danh từ chỉ một thành viên trong loại các thần linh, đồng thời không giải quyết quá mức sự mơ hồ của “trong tâm linh và chân lý”.
