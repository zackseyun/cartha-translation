review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp truyền đạt đúng các thành tố chính: nhiều người Sa-ma-ri từ thành ấy tin hướng về Đức Giê-su, vì lời của người phụ nữ làm chứng, với nội dung lời chứng là Ngài đã nói cho bà mọi điều bà đã làm. Tuy nhiên, cụm “lời của người phụ nữ làm chứng” dễ bị hiểu là chính “lời” đang làm chứng, thay vì người phụ nữ là người làm chứng. Dấu neo chú thích cũng đang đặt sau toàn bộ câu trích dẫn, không neo vào từ “lời” (λόγος) mà chú thích giải thích.'
  naturalness: Cần làm rõ quan hệ cú pháp bằng mệnh đề quan hệ có dấu phẩy. “Tin vào Ngài” tự nhiên hơn trong tiếng Việt hiện đại mà vẫn giữ lực hướng về đối tượng của πιστεύω εἰς. Cách dùng “Ngài” phù hợp văn phong Kinh Thánh trang trọng.
  terminology: Giữ “Sa-ma-ri,” “Ngài,” “tin vào,” và “lời” là nhất quán và phù hợp. Chú thích giữ các phương án nghĩa của λόγος; “bản thuật lại” tự nhiên và chính xác hơn “lời thuật lại” trong ngữ cảnh này.
  issues:
  - severity: medium
    issue: Cú pháp của cụm “lời của người phụ nữ làm chứng” mơ hồ/không tự nhiên.
    rationale: Phân từ μαρτυρούσης bổ nghĩa cho “người phụ nữ,” không bổ nghĩa cho “lời.” Cần đánh dấu rõ người phụ nữ là chủ thể làm chứng.
  - severity: medium
    issue: Dấu neo chú thích [a] đặt sau câu trích dẫn thay vì sau “lời.”
    rationale: Chú thích là thay thế từ vựng cho λόγος (“lời”), nên phải neo trực tiếp tại từ đó.
  revised_text: 'Nhiều người Sa-ma-ri từ thành ấy đã tin vào Ngài vì lời[a] của người phụ nữ, người làm chứng rằng: “Ngài đã nói cho tôi mọi điều tôi đã làm.”'
