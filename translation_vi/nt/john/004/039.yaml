base_translation:
  language: en
  yaml_path: translation/nt/john/004/039.yaml
  text: And many of the Samaritans from that town believed in him because of the word of the woman who was testifying, “He told me everything I did.”
translation:
  language: vi
  text: 'Nhiều người Sa-ma-ri từ thành ấy đã tin vào Ngài vì lời[a] của người phụ nữ, người làm chứng rằng: “Ngài đã nói cho tôi mọi điều tôi đã làm.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “vì thông điệp của người phụ nữ.” Từ Hy Lạp λόγος có thể có nghĩa là “lời,” “thông điệp” hoặc “bản thuật lại.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐκ δὲ τῆς πόλεως ἐκείνης
  choice: từ thành ấy
  rationale: ἐκ chỉ nguồn gốc; πόλις là thành hoặc thị trấn. “Thành ấy” tự nhiên, trang trọng và nối rõ với địa điểm đã được nhắc đến; δέ được thể hiện qua mạch kể tự nhiên thay vì thêm một liên từ nặng nề.
- source_word: πολλοὶ ... τῶν Σαμαριτῶν
  choice: nhiều người Sa-ma-ri
  rationale: 'Cách nói này diễn đạt tự nhiên ý phân chia: nhiều người trong số dân Sa-ma-ri.'
- source_word: ἐπίστευσαν εἰς αὐτόν
  choice: tin nơi Ngài
  rationale: πιστεύω đi với εἰς diễn tả lòng tin hướng đến một người. “Tin nơi Ngài” giữ sắc thái quan hệ mà không diễn giải thêm nội dung thần học.
- source_word: διὰ τὸν λόγον
  choice: vì lời
  rationale: διά với đối cách nêu nguyên nhân. λόγος có thể là lời, thông điệp hoặc lời thuật lại; “lời” giữ được độ rộng nghĩa và âm hưởng của văn chương Giăng.
- source_word: τῆς γυναικὸς μαρτυρούσης
  choice: của người phụ nữ làm chứng
  rationale: Phân từ hiện tại μαρτυρούσης mô tả người phụ nữ đang đưa ra lời chứng. Tiếng Việt không bắt buộc đánh dấu tiếp diễn; “làm chứng” vừa tự nhiên vừa giữ đúng ý.
- source_word: Εἶπέν μοι
  choice: Ngài đã nói cho tôi
  rationale: λέγω với tân ngữ gián tiếp có nghĩa là nói cho ai biết. Dạng “đã nói cho tôi” tự nhiên trong tiếng Việt và phù hợp với nội dung trực tiếp theo sau.
- source_word: πάντα ἃ ἐποίησα
  choice: mọi điều tôi đã làm
  rationale: πάντα ἃ mang nghĩa bao quát. Động từ aorist ἐποίησα được diễn đạt tự nhiên bằng “đã làm”, không áp đặt sắc thái thời gian vượt quá văn cảnh.
theological_decisions:
- issue: Sắc thái của πιστεύω εἰς trong văn chương Giăng
  choice: tin nơi Ngài
  alternative: đặt lòng tin nơi Ngài
  rationale: Bản dịch giữ lòng tin hướng về Chúa Giê-su nhưng không mở rộng thành một công thức giáo lý mà câu Hy Lạp không nói rõ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” để quy chiếu Chúa Giê-su trong lời kể và lời trích dẫn; giữ “lời” trong chính văn để bảo toàn độ rộng nghĩa của λόγος.
