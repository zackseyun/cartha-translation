revisions:
- from: 'Nhiều người Sa-ma-ri từ thành ấy tin nơi Ngài vì lời của người phụ nữ làm chứng rằng: “Ngài đã nói cho tôi mọi điều tôi đã làm.”[a]'
  to: 'Nhiều người Sa-ma-ri từ thành ấy đã tin vào Ngài vì lời[a] của người phụ nữ, người làm chứng rằng: “Ngài đã nói cho tôi mọi điều tôi đã làm.”'
  rationale: Bản sửa làm rõ rằng người phụ nữ, chứ không phải “lời,” là người làm chứng; chuyển dấu neo đến đúng từ λόγος; và dùng “tin vào Ngài” như một cách diễn đạt hiện đại, tự nhiên cho πιστεύω εἰς αὐτόν. “Mọi điều tôi đã làm” vẫn phản ánh đầy đủ aorist ἐποίησα mà không áp đặt sắc thái thời gian bổ sung.
  reviewer_model: gpt-5.6-terra
