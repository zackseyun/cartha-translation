  timestamp: '2026-07-17T05:37:16Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch chuyển tải đúng ý chính của câu: người uống thứ nước đang nói đến sẽ khát trở lại. Tuy nhiên, tên riêng “Đức Chúa Jêsus” vừa dùng chính tả cũ, vừa thêm tước hiệu “Chúa” không có trong Ἰησοῦς của câu này. Từ “rồi” cũng thêm một sắc thái trình tự không cần thiết trong nguyên văn.'
  naturalness: Câu nói trực tiếp tự nhiên, nhưng “sẽ lại khát” gọn và sát hơn “rồi sẽ lại khát”. “Giê-su” là chính tả hiện đại, phổ biến hơn “Jêsus” trong văn phong tiếng Việt chuẩn hiện nay.
  terminology: Dùng “Đức Giê-su” giữ sắc thái trang trọng phù hợp văn cảnh Kinh Thánh mà không thêm danh xưng κύριος/Lord. “Đáp lời bà” là cách Việt ngữ tự nhiên để chuyển công thức kể chuyện kép ἀπεκρίθη ... καὶ εἶπεν αὐτῇ; không cần dịch máy móc cả hai động từ.
  issues:
  - severity: medium
    issue: “Đức Chúa Jêsus” thêm “Chúa” và dùng dạng tên không phải chính tả hiện đại chuẩn.
    rationale: Nguyên văn chỉ có Ἰησοῦς (“Giê-su”), không có κύριος. Dạng “Jêsus” thuộc truyền thống chính tả cũ; “Giê-su” phù hợp mục tiêu tiếng Việt hiện đại.
  - severity: low
    issue: “rồi” thêm liên hệ trình tự không được nêu rõ.
    rationale: διψήσει πάλιν chỉ nói “sẽ lại khát”; bỏ “rồi” giúp câu gọn và bám sát hơn.
  revised_text: 'Đức Giê-su đáp lời bà: “Ai uống nước này sẽ lại khát.”'
  revised_footnotes: []
  revision_rationale: Chuẩn hóa tên Giê-su theo tiếng Việt hiện đại và bỏ tước hiệu không hiện diện trong câu nguồn. Giữ “đáp lời bà” như một cách chuyển ngữ tự nhiên cho công thức đáp–nói, giữ phạm vi khái quát của “Ai uống”, và diễn đạt trực tiếp tương lai lặp lại bằng “sẽ lại khát”.
