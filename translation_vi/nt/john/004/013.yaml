revisions:
- from: 'Đức Chúa Jêsus đáp lời bà: “Ai uống nước này rồi sẽ lại khát.”'
  to: 'Đức Giê-su đáp lời bà: “Ai uống nước này sẽ lại khát.”'
  rationale: Chuẩn hóa tên Giê-su theo tiếng Việt hiện đại và bỏ tước hiệu không hiện diện trong câu nguồn. Giữ “đáp lời bà” như một cách chuyển ngữ tự nhiên cho công thức đáp–nói, giữ phạm vi khái quát của “Ai uống”, và diễn đạt trực tiếp tương lai lặp lại bằng “sẽ lại khát”.
