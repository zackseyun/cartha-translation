base_translation:
  language: en
  yaml_path: translation/nt/john/004/013.yaml
  text: Jesus answered and said to her[a], “Everyone who drinks from this water will be thirsty again.”
translation:
  language: vi
  text: 'Đức Giê-su đáp lời bà: “Ai uống nước này sẽ lại khát.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη ... καὶ εἶπεν αὐτῇ
  choice: đáp lời bà
  rationale: Đây là công thức dẫn lời phổ biến trong lối kể chuyện Hy Lạp. Tiếng Việt tự nhiên gộp hai động từ thành “đáp lời” mà vẫn truyền đạt đầy đủ ý nghĩa hồi đáp và nói với bà.
- source_word: Πᾶς ὁ πίνων
  choice: Ai uống
  rationale: Phân từ hiện tại có mạo từ mang nghĩa khái quát, chỉ bất cứ người nào uống; “ai uống” tự nhiên, bao quát và không hàm ý chỉ nam giới.
- source_word: ἐκ τοῦ ὕδατος τούτου
  choice: nước này
  rationale: Chỉ trực tiếp thứ nước cụ thể đang được nói đến. Trong tiếng Việt, động từ “uống” không cần dịch riêng giới từ ἐκ.
- source_word: διψήσει πάλιν
  choice: rồi sẽ lại khát
  rationale: Thì tương lai được thể hiện bằng “sẽ”, πάλιν bằng “lại”; “rồi” giúp diễn đạt tự nhiên trình tự uống rồi lại khát mà không thêm một kết luận thần học.
theological_decisions:
- issue: Công thức kép ἀπεκρίθη ... καὶ εἶπεν
  choice: Gộp tự nhiên thành “đáp lời bà”
  alternative: Dịch sát hình thức là “đáp và nói với bà”
  rationale: “Đáp và nói với bà” gượng và trùng ý trong tiếng Việt hiện đại. “Đáp lời bà” giữ chức năng của cả công thức Hy Lạp mà không làm thay đổi nội dung.
- issue: Phạm vi khái quát của Πᾶς ὁ πίνων
  choice: Dùng “Ai uống”
  alternative: “Mọi người uống” hoặc “Bất cứ ai uống”
  rationale: Cấu trúc Hy Lạp tuy mang hình thức giống đực nhưng có nghĩa khái quát. “Ai uống” giữ phạm vi bao quát, không giới hạn giới tính.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Đức Chúa Jêsus” theo lối gọi Kinh Thánh tiếng Việt quen thuộc; câu dẫn được diễn đạt tự nhiên thay vì sao chép máy móc thành ngữ Hy Lạp.
