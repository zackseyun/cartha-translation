  text: After the two days[a], he departed from there for Galilee.
translation:
  language: vi
  text: Sau hai ngày ấy, Giê-su rời nơi đó để đến Ga-li-lê.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μετὰ δὲ τὰς δύο ἡμέρας
  choice: Sau hai ngày ấy
  rationale: μετά với đối cách chỉ thời điểm tiếp sau; mạo từ xác định nối cụm này với hai ngày lưu lại vừa được nhắc đến. δέ là từ nối nhẹ nên không cần dịch riêng trong tiếng Việt.
- source_word: ἐξῆλθεν
  choice: rời
  rationale: Động từ ἐξέρχομαι theo nghĩa đen là “đi ra”; trong mạch thuật hành trình, “rời” diễn đạt tự nhiên việc ra đi khỏi địa điểm trước đó.
- source_word: ἐκεῖθεν
  choice: nơi đó
  rationale: Trạng từ chỉ nơi chốn quy chiếu về địa điểm vừa nói đến; kết hợp “rời nơi đó” là cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: εἰς τὴν Γαλιλαίαν
  choice: đi đến Ga-li-lê
  rationale: εἰς biểu thị chuyển động hướng tới đích đến. Thêm “đi” để câu tiếng Việt tự nhiên sau động từ “rời”, nhưng không thêm ý nghĩa ngoài nguyên văn.
- source_word: implicit subject of ἐξῆλθεν
  choice: Đức Chúa Jêsus
  rationale: Chủ ngữ ngôi thứ ba số ít được xác định từ văn cảnh là Đức Chúa Jêsus; nêu rõ danh xưng giúp câu tiếng Việt đứng độc lập và dễ hiểu.
