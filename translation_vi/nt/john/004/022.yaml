source:
  edition: SBLGNT
  text: ὑμεῖς προσκυνεῖτε ὃ οὐκ οἴδατε, ἡμεῖς προσκυνοῦμεν ὃ οἴδαμεν, ὅτι ἡ σωτηρία ἐκ τῶν Ἰουδαίων ἐστίν·
base_translation:
  language: en
  yaml_path: translation/nt/john/004/022.yaml
  text: You worship what you do not know; we worship what we know[a], because salvation is from the Jews.
translation:
  language: vi
  text: Các ngươi thờ điều các ngươi không biết; còn chúng tôi thờ điều chúng tôi biết, vì sự cứu rỗi đến từ dân Do Thái.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “người Do Thái”. Ở một số chỗ khác trong sách Giăng, từ này có thể mang nghĩa “người Giu-đê”; nhưng tại đây, sự đối chiếu với người Sa-ma-ri liên quan đến việc thờ phượng và lịch sử cứu rỗi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκυνεῖτε / προσκυνοῦμεν
  choice: thờ
  rationale: Trong ngữ cảnh này, động từ chỉ sự thờ phượng tôn giáo. “Thờ” tự nhiên trong tiếng Việt và giữ được cấu trúc đối ứng ngắn gọn của câu Hy Lạp.
- source_word: ὃ
  choice: điều
  rationale: Đại từ quan hệ giống trung trong tiếng Hy Lạp được giữ ở mức khái quát là “điều”, thay vì cụ thể hóa thành “Đấng” hay “Người”, vốn sẽ làm rõ hơn nguyên văn.
- source_word: οἴδατε / οἴδαμεν
  choice: biết
  rationale: “Biết” chuyển tải trực tiếp sự tương phản về tri thức đối với đối tượng thờ phượng và phù hợp với lối diễn đạt hiện đại.
- source_word: σωτηρία
  choice: sự cứu rỗi
  rationale: Đây là cách diễn đạt quen thuộc, trang trọng và thích hợp cho công việc cứu độ của Đức Chúa Trời trong ngữ cảnh Giăng.
- source_word: ἐκ
  choice: đến từ
  rationale: Cụm này diễn đạt tự nhiên nguồn gốc được đánh dấu bởi ἐκ; không hàm ý rằng dân Do Thái là tác nhân tự mình tạo ra sự cứu rỗi.
- source_word: τῶν Ἰουδαίων
  choice: dân Do Thái
  rationale: Trong câu này, sự đối chiếu với người Sa-ma-ri liên quan đến việc thờ phượng và lịch sử cứu rỗi; “dân Do Thái” nói rõ đây là cộng đồng dân tộc-tôn giáo, tránh sắc thái xa cách có thể có của “những người Do Thái”.
theological_decisions:
- issue: Ý nghĩa của câu “sự cứu rỗi đến từ dân Do Thái”
  choice: Giữ lời khẳng định về nguồn gốc lịch sử và sự trung chuyển theo giao ước của công cuộc cứu rỗi qua dân Do Thái.
  alternative: Chỉ nói đến nguồn gốc Do Thái của Đấng Mê-si-a, hoặc diễn giải rộng thành ưu thế dân tộc của người Do Thái.
  rationale: Mệnh đề Hy Lạp nói đến nguồn gốc trong lịch sử cứu rỗi nhưng không tự nó khẳng định ưu thế sắc tộc. Bản dịch không thu hẹp câu chỉ vào Đấng Mê-si-a và cũng không thêm hàm ý bài Do Thái hay thay thế dân giao ước.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Cấu trúc đối xứng của nguyên văn được giữ. Dùng “các người” để phản ánh đại từ số nhiều ὑμεῖς và lời Chúa Giê-su nói với người phụ nữ như đại diện cho cộng đồng Sa-ma-ri; sắc thái có phần trực diện phù hợp với câu gốc.
