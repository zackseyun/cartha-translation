  to: Các ngươi thờ điều các ngươi không biết; còn chúng tôi thờ điều chúng tôi biết, vì sự cứu rỗi đến từ dân Do Thái.[a]
  rationale: Chỉ thay “các người” bằng “các ngươi” và làm tường minh các đại từ trong hai cụm song song. Sửa đổi này cải thiện sắc thái và tính tự nhiên trong văn phong Kinh Thánh tiếng Việt mà không thêm diễn giải hoặc thay đổi nghĩa của câu.
