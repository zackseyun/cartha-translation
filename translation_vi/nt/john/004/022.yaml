review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch truyền đạt đúng các đối ứng chính: προσκυνεῖτε/προσκυνοῦμεν là “thờ”, ὃ là “điều”, οἴδατε/οἴδαμεν là “biết”, và ἐκ τῶν Ἰουδαίων là nguồn gốc “đến từ dân Do Thái”. Cấu trúc đối lập giữa nhóm Sa-ma-ri và nhóm Do Thái cũng được giữ. Tuy nhiên, “các người” trong tiếng Việt hiện đại dễ mang sắc thái miệt thị mạnh hơn mức cần thiết của đại từ số nhiều Hy Lạp trong ngữ cảnh này.'
  naturalness: “Các ngươi” là lối xưng hô Kinh Thánh quen thuộc, trang trọng và phù hợp hơn “các người” trong một lời đối thoại có tính khái quát về hai cộng đồng. Việc lặp “các ngươi/chúng tôi” sau “điều” làm rõ quan hệ sở hữu-ngữ nghĩa và giữ phép đối xứng của nguyên văn.
  terminology: “Sự cứu rỗi”, “dân Do Thái”, “Sa-ma-ri”, và “Giu-đê” đều phù hợp với thuật ngữ Kinh Thánh tiếng Việt. Chú thích bảo lưu hợp lý khả năng nghĩa “người Do Thái”/“người Giu-đê” của Ἰουδαίων mà không làm thay đổi ý nghĩa chính trong văn mạch.
  issues:
