revisions:
- from: 'Đức Giê-su nói với ông: “Hãy đi, con trai ông vẫn sống.” Người đàn ông ấy tin[a] lời Đức Giê-su đã nói với mình và lên đường.'
  to: 'Đức Giê-su nói với ông: “Hãy đi, con trai ông đang sống.” Người đàn ông ấy tin[a] lời Đức Giê-su đã nói với mình và lên đường.'
  rationale: Chỉ thay «vẫn sống» bằng «đang sống» để giữ lời tuyên bố hiện tại ζῇ mà không thêm sắc thái tiếp diễn. Các phần khác truyền đạt sát nguyên văn và dùng tiếng Việt hiện đại tự nhiên.
  reviewer_model: gpt-5.6-terra
