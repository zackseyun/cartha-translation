source:
  edition: SBLGNT
  text: λέγει αὐτῷ ὁ Ἰησοῦς· Πορεύου· ὁ υἱός σου ζῇ. ⸀ἐπίστευσεν ὁ ἄνθρωπος τῷ λόγῳ ⸀ὃν εἶπεν αὐτῷ ὁ Ἰησοῦς καὶ ἐπορεύετο.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/050.yaml
  text: Jesus said to him[a], “Go; your son lives.” The man believed the word that Jesus spoke to him and went on his way.
translation:
  language: vi
  text: 'Đức Giê-su nói với ông: “Hãy đi, con trai ông đang sống.” Người đàn ông ấy tin[a] lời Đức Giê-su đã nói với mình và lên đường.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “tin cậy lời Đức Giê-su đã nói với mình.”
    reason: 'Giữ khả năng ngữ nghĩa của πιστεύω với bổ ngữ τῷ λόγῳ: vừa có thể nhấn mạnh việc tin lời là thật, vừa có thể nhấn mạnh sự tín nhiệm đặt vào lời ấy.'
lexical_decisions:
- source_word: Πορεύου
  choice: Hãy đi
  rationale: Mệnh lệnh hiện tại của πορεύομαι là lời truyền bảo trực tiếp; “Hãy đi” ngắn gọn, tự nhiên và không thêm đích đến vốn không được nêu rõ trong câu.
- source_word: ὁ υἱός σου
  choice: con trai ông
  rationale: υἱός chỉ rõ người con là nam; cách dịch này giữ đúng giới tính được nêu trong nguyên văn.
- source_word: ζῇ
  choice: vẫn sống
  rationale: Động từ ở thì hiện tại xác nhận người con đang còn sống. “Vẫn sống” tự nhiên trong tiếng Việt và tránh chuyển lời tuyên bố thành lời hứa ở tương lai.
- source_word: ἐπίστευσεν
  choice: tin
  rationale: Với bổ ngữ ở cách tặng là τῷ λόγῳ, πιστεύω diễn tả việc tin hoặc tin cậy lời đã nói. “Tin” giữ mối liên hệ nhất quán của nhóm từ πιστ- mà không xác định quá mức bản chất thần học của phản ứng này.
- source_word: ὁ ἄνθρωπος
  choice: Người đàn ông ấy
  rationale: Nguyên văn dùng danh từ khái quát ἄνθρωπος nhưng trong ngữ cảnh chỉ một người nam đã được nhắc đến. Cách dịch này giữ cách gọi của chính câu này, không thay bằng chức danh “quan chức” từ văn cảnh trước.
- source_word: τῷ λόγῳ
  choice: lời
  rationale: λόγος ở đây chỉ lời phát biểu cụ thể của Đức Giê-su; “lời” vừa gọn vừa được mệnh đề theo sau làm rõ.
- source_word: ὃν εἶπεν αὐτῷ ὁ Ἰησοῦς
  choice: Đức Giê-su đã nói với mình
  rationale: Mệnh đề quan hệ bổ nghĩa cho “lời.” Đại từ phản thân “mình” quy chiếu tự nhiên về người đàn ông, còn “đã nói” diễn đạt hành động xảy ra trước lúc ông tin.
- source_word: ἐπορεύετο
  choice: lên đường
  rationale: Dạng chưa hoàn thành mô tả người ấy bắt đầu hoặc tiếp tục hành trình sau khi tin. “Lên đường” truyền đạt chuyển động trong câu chuyện mà không thêm rõ ông đi đâu.
theological_decisions:
- issue: Cách dịch πιστεύω khi người đàn ông đáp lại lời phán của Đức Giê-su
  choice: tin
  alternative: tin cậy
  rationale: “Tin” diễn đạt trực tiếp phản ứng đối với lời Đức Giê-su và không buộc câu văn phải phân định đây là đức tin cứu rỗi hay chỉ là sự tin tưởng vào lời hứa. “Tin cậy” là khả năng hợp ngữ cảnh nên được ghi ở chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Giê-su” theo lối gọi kính trọng phổ biến; giữ câu nói ngắn, dứt khoát và tránh thêm chức danh hoặc đích đến không có trong nguyên văn.
