id: JHN.4.9
reference: John 4:9
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: λέγει οὖν αὐτῷ ἡ γυνὴ ἡ Σαμαρῖτις· Πῶς σὺ Ἰουδαῖος ὢν παρ’ ἐμοῦ πεῖν αἰτεῖς ⸂γυναικὸς Σαμαρίτιδος οὔσης⸃; οὐ γὰρ συγχρῶνται Ἰουδαῖοι Σαμαρίταις.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/009.yaml
  text: So the Samaritan woman said to him[a], “How is it that you, being a Jew, ask for a drink from me, a Samaritan woman?” (For Jews do not associate with Samaritans.)
translation:
  language: vi
  text: 'Người phụ nữ Sa-ma-ri liền nói với Ngài: “Sao ông là người Do Thái mà lại xin tôi, một phụ nữ Sa-ma-ri, cho uống nước?” (Vì người Do Thái không giao thiệp với người Sa-ma-ri.)[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Vì người Do Thái không qua lại với người Sa-ma-ri,” hoặc hiểu cụ thể hơn rằng họ không dùng chung đồ vật, chẳng hạn dụng cụ đựng nước uống.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει οὖν
  choice: liền nói
  rationale: οὖν nối tiếp diễn tiến câu chuyện; “liền” tự nhiên trong tiếng Việt và giữ được lực liên kết mà không diễn giải quá mức thành quan hệ nhân quả rõ rệt.
- source_word: ἡ γυνὴ ἡ Σαμαρῖτις
  choice: người phụ nữ Sa-ma-ri
  rationale: Cách diễn đạt tự nhiên, hiện đại, giữ cả giới tính và căn tính cộng đồng của người phụ nữ.
- source_word: Πῶς
  choice: Sao ... mà lại
  rationale: Cấu trúc này diễn đạt tự nhiên sự ngạc nhiên, khó hiểu trước việc vượt qua ranh giới xã hội.
- source_word: Ἰουδαῖος
  choice: người Do Thái
  rationale: Trong ngữ cảnh đối lập với người Sa-ma-ri, từ này chỉ căn tính cộng đồng dân tộc-tôn giáo hơn là chỉ riêng người thuộc vùng Giu-đê.
- source_word: ὢν
  choice: là
  rationale: Giữ hoàn cảnh nền của phân từ mà không quyết định đó là quan hệ nguyên nhân hay nhượng bộ.
- source_word: παρ’ ἐμοῦ πεῖν αἰτεῖς
  choice: xin tôi ... cho uống nước
  rationale: Cách nói tiếng Việt tự nhiên, thể hiện việc Chúa Giê-su xin nước uống từ chính người phụ nữ.
- source_word: γυναικὸς Σαμαρίτιδος οὔσης
  choice: tôi, một phụ nữ Sa-ma-ri
  rationale: Cách đồng vị giữ lời tự nhận ở ngôi thứ nhất cùng căn tính giới và cộng đồng, đồng thời phù hợp cú pháp tiếng Việt.
- source_word: συγχρῶνται
  choice: giao thiệp với
  rationale: Diễn đạt nghĩa rộng về quan hệ xã hội giữa hai cộng đồng; nghĩa hẹp hơn là dùng chung đồ vật được bảo lưu trong chú thích.
theological_decisions:
- issue: Nghĩa của Ἰουδαῖος trong văn mạch Giăng
  choice: người Do Thái
  alternative: người Giu-đê
  rationale: Câu này đối chiếu hai cộng đồng Do Thái và Sa-ma-ri về căn tính cùng tập tục giao tiếp, chứ không chủ yếu đối chiếu nơi cư trú.
- issue: Phạm vi nghĩa của συγχρῶνται
  choice: không giao thiệp với
  alternative: không dùng chung đồ vật với
  rationale: Mệnh đề giải thích có thể nói chung về sự xa cách xã hội, nhưng văn cảnh xin nước khiến nghĩa cụ thể về việc dùng chung vật dụng uống nước cũng có thể có; chú thích giữ lại khả năng ấy.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Ngài” trong lời dẫn nhưng giữ “ông” trong lời người phụ nữ để phản ánh cách xưng hô tự nhiên ở giai đoạn đầu cuộc đối thoại. Tên dân tộc được viết “Sa-ma-ri” theo dạng quen thuộc trong văn phong Kinh Thánh tiếng Việt.
