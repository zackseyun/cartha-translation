id: JHN.4.11
reference: John 4:11
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ⸂ἡ γυνή⸃· Κύριε, οὔτε ἄντλημα ἔχεις καὶ τὸ φρέαρ ἐστὶν βαθύ· πόθεν οὖν ἔχεις τὸ ὕδωρ τὸ ζῶν;
base_translation:
  language: en
  yaml_path: translation/nt/john/004/011.yaml
  text: The woman said to him[a], “Lord, you have neither a bucket nor is the well deep[b]. So where do you get the living water?”
translation:
  language: vi
  text: 'Người phụ nữ nói với Người: “Thưa Ngài,[a] Ngài không có gàu mà giếng lại sâu. Vậy Ngài lấy đâu ra nước sống?[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Lạy Chúa.” Từ Hy Lạp κύριε có thể là lời xưng hô kính trọng, tương đương “thưa ngài,” hoặc mang nghĩa “Chúa,” tùy ngữ cảnh.'
    reason: alternative_reading
  - marker: b
    text: “Nước sống” cũng có thể chỉ nước chảy hoặc nước nguồn, tức nước trong lành đang chảy, trái với nước tù đọng. Cách diễn đạt này đồng thời giữ lại ý nghĩa sâu hơn trong lời Chúa Giê-su.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει αὐτῷ
  choice: nói với Người
  rationale: Thì hiện tại lịch sử của tiếng Hy Lạp được chuyển bằng lối kể tự nhiên trong tiếng Việt; đại từ “Người” giữ giọng văn trang trọng và chỉ về Chúa Giê-su.
- source_word: ἡ γυνή
  choice: người phụ nữ
  rationale: Trong ngữ cảnh, cụm từ chỉ người phụ nữ Sa-ma-ri bên giếng, không mang nghĩa “người vợ”.
- source_word: Κύριε
  choice: Thưa Ngài
  rationale: Cách xưng hô này vừa kính trọng vừa không mặc nhiên cho rằng người phụ nữ đã nhận biết đầy đủ căn tính của Chúa Giê-su; chú thích bảo lưu khả năng dịch là “Lạy Chúa”.
- source_word: ἄντλημα
  choice: gàu
  rationale: Danh từ chỉ dụng cụ dùng để múc nước; “gàu” tự nhiên và chính xác trong bối cảnh giếng nước.
- source_word: τὸ φρέαρ
  choice: giếng
  rationale: Trong bối cảnh này, φρέαρ là giếng dùng để lấy nước.
- source_word: βαθύ
  choice: sâu
  rationale: Phản ánh đúng tính từ Hy Lạp mà không thêm mức độ như “rất sâu”.
- source_word: πόθεν οὖν
  choice: Vậy ... lấy đâu ra
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt, giữ cả ý hỏi về nguồn và quan hệ suy luận của οὖν.
- source_word: τὸ ὕδωρ τὸ ζῶν
  choice: nước sống
  rationale: 'Giữ nguyên hình ảnh của tiếng Hy Lạp và nghĩa kép trong sách Giăng: có thể chỉ nước chảy/nước nguồn trong cách hiểu thông thường, đồng thời gợi ý nghĩa sâu hơn trong lời Chúa Giê-su.'
theological_decisions:
- issue: Cách dịch κύριε trong lời người phụ nữ thưa với Chúa Giê-su
  choice: Thưa Ngài
  alternative: Lạy Chúa
  rationale: Ở giai đoạn đầu của cuộc đối thoại, từ này có thể chỉ là lời xưng hô kính trọng. “Thưa Ngài” tránh gán cho người phụ nữ một sự nhận biết thần học chưa chắc đã có, trong khi chú thích vẫn bảo lưu nghĩa danh hiệu “Chúa”.
- issue: Cách dịch ὕδωρ τὸ ζῶν để giữ nghĩa kép
  choice: nước sống
  alternative: nước chảy; nước nguồn
  rationale: “Nước sống” giữ hình thức ẩn dụ và chiều sâu thần học của lời Chúa Giê-su, còn chú thích giải thích nghĩa thông dụng mà người phụ nữ có thể đang hiểu.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Cấu trúc “không có gàu mà giếng lại sâu” diễn đạt tự nhiên quan hệ giữa việc thiếu dụng cụ và độ sâu của giếng. Các dấu chú thích [a], [b] đều xuất hiện trong chính văn.
