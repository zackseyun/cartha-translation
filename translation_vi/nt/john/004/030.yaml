    text: 'Hoặc: “Họ ra khỏi thành và đang trên đường đến chỗ Ngài.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθον ἐκ τῆς πόλεως
  choice: ra khỏi thành
  rationale: Diễn đạt tự nhiên chuyển động từ bên trong thành ra ngoài; thì aorist trình bày việc họ rời thành như một sự kiện.
- source_word: ἤρχοντο
  choice: đang đi đến
  rationale: Thì chưa hoàn thành diễn tả hành động đang tiếp diễn trong quá khứ. Tiếng Việt dùng “đang đi đến” để giữ tiến trình mà không phụ thuộc vào điểm nhìn của người nói như “đang đến” có thể gợi ra.
- source_word: πρὸς αὐτόν
  choice: đến với Ngài
  rationale: πρός với đối cách chỉ sự chuyển động hướng đến một người. “Ngài” là đại từ tôn kính tự nhiên trong văn phong Kinh Thánh tiếng Việt và ở đây quy chiếu đến Chúa Giê-su.
