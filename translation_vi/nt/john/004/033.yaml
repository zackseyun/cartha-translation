  yaml_path: translation/nt/john/004/033.yaml
  text: So the disciples were saying to one another[a], “Has anyone brought him something to eat?”
translation:
  language: vi
  text: 'Vậy các môn đồ nói với nhau[a]: “Chẳng lẽ có ai đã mang cho Thầy thứ gì để ăn?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Câu hỏi Hy Lạp dùng μή, thường dự kiến câu trả lời phủ định. Cũng có thể diễn đạt: “Chắc không ai đã mang thứ gì để ăn cho Thầy chứ?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγον
  choice: nói
  rationale: Thì chưa hoàn thành cho thấy lời trao đổi đang diễn ra; trong văn kể tiếng Việt, “nói với nhau” tự nhiên và đủ chuyển tải sắc thái này mà không cần thêm “đang”.
- source_word: οὖν
  choice: Vì vậy
  rationale: Giữ mối liên hệ suy luận với lời Đức Giê-su vừa nói, đồng thời vẫn tự nhiên trong văn kể.
- source_word: οἱ μαθηταὶ
  choice: các môn đồ
  rationale: “Môn đồ” là cách gọi quen thuộc, chính xác trong ngữ cảnh Tin Mừng đối với những người theo học Đức Giê-su.
- source_word: πρὸς ἀλλήλους
  choice: với nhau
  rationale: Diễn đạt tự nhiên hành động trao đổi qua lại trong nhóm.
- source_word: Μή τις
  choice: Có ai ... sao?
  rationale: Cấu trúc câu hỏi với μή hướng người nghe đến câu trả lời phủ định; tiểu từ “sao” giúp thể hiện sự ngạc nhiên và dự đoán rằng không có ai làm việc ấy, nhưng vẫn giữ hình thức câu hỏi.
- source_word: ἤνεγκεν αὐτῷ
  choice: đã mang ... đến cho Thầy
  rationale: ἤνεγκεν là hành động mang đến; αὐτῷ chỉ Đức Giê-su. Dùng “Thầy” trong lời của các môn đồ tự nhiên hơn đại từ “ông/người” và không thêm một tước hiệu ngoài quan hệ đã có trong ngữ cảnh.
- source_word: φαγεῖν
  choice: thức ăn
  rationale: Động từ nguyên mẫu “để ăn” hàm ý vật được mang đến là thứ để ăn; “thức ăn” diễn đạt gọn và tự nhiên trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Giữ sắc thái trao đổi đang diễn ra qua cụm “nói với nhau”; đặt dấu chú thích ngay sau cụm có vấn đề dịch thuật. Đại từ “Thầy” phản ánh cách các môn đồ nói về Đức Giê-su trong cuộc trao đổi nội bộ.
