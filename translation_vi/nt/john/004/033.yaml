- from: 'Vì vậy, các môn đồ nói với nhau[a]: “Có ai đã mang thức ăn đến cho Thầy sao?”'
  to: 'Vậy các môn đồ nói với nhau[a]: “Chẳng lẽ có ai đã mang cho Thầy thứ gì để ăn?”'
  rationale: Đổi “Vì vậy” thành “Vậy” cho nhịp văn kể gọn tự nhiên, và sửa câu hỏi để biểu đạt trực tiếp hàm ý phủ định của μή. “Thứ gì để ăn” giữ cấu trúc “mang cho Thầy ... để ăn” của nguyên ngữ, thay vì biến động từ nguyên mẫu thành danh từ “thức ăn”.
