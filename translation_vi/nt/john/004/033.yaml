    rationale: Μή τις mở đầu một câu hỏi mà người nói dự kiến câu trả lời phủ định. “Có ai đã mang ... sao?” có thể gợi ngạc nhiên, nhưng không biểu đạt nhất quán sắc thái này; “Chẳng lẽ có ai ...?” làm rõ hơn mà vẫn là câu hỏi mở.
  revised_text: 'Vậy các môn đồ nói với nhau[a]: “Chẳng lẽ có ai đã mang cho Thầy thứ gì để ăn?”'
