revisions:
- from: 'Vì vậy, ông hỏi họ giờ nào con mình bắt đầu khá hơn. Họ thưa với ông: “Hôm qua, vào giờ thứ bảy[a], cơn sốt đã rời khỏi cậu ấy.”'
  to: 'Vì vậy, ông hỏi họ xem con trai mình bắt đầu khá hơn vào giờ nào. Họ thưa với ông: “Hôm qua, vào giờ thứ bảy[a], cơn sốt đã rời khỏi con trai ông.”'
  rationale: Chỉnh rất nhẹ để tăng tính tự nhiên và rõ chủ thể trong tiếng Việt, đồng thời giữ nguyên ý nghĩa, thời điểm mơ hồ của “giờ thứ bảy”, và hình ảnh nguồn văn “cơn sốt rời khỏi” người bệnh.
