  text: ἐπύθετο οὖν ⸂τὴν ὥραν παρ’ αὐτῶν⸃ ἐν ᾗ κομψότερον ἔσχεν· ⸂εἶπαν οὖν⸃ αὐτῷ ὅτι ⸀Ἐχθὲς ὥραν ἑβδόμην ἀφῆκεν αὐτὸν ὁ πυρετός.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/052.yaml
  text: So he asked them the hour in which he got better. Then they said to him[a], “Yesterday at the seventh hour the fever left him.”
translation:
  language: vi
  text: 'Vì vậy, ông hỏi họ xem con trai mình bắt đầu khá hơn vào giờ nào. Họ thưa với ông: “Hôm qua, vào giờ thứ bảy[a], cơn sốt đã rời khỏi con trai ông.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Có thể là khoảng một giờ chiều nếu tính giờ từ lúc mặt trời mọc; một số người hiểu rằng Giăng dùng một cách tính giờ khác.
    reason: Nêu cách quy đổi có thể có nhưng vẫn bảo toàn sự không chắc chắn về hệ thống tính giờ.
lexical_decisions:
- source_word: ἐπύθετο οὖν
  choice: Vì vậy, ông hỏi
  rationale: πυνθάνομαι diễn tả việc hỏi để biết, còn οὖν nối câu này với diễn tiến và suy luận từ câu trước; cách dịch này tự nhiên và giữ được mối liên kết.
- source_word: τὴν ὥραν παρ’ αὐτῶν
  choice: hỏi họ giờ nào
  rationale: παρά với sở hữu cách chỉ nguồn cung cấp thông tin; tiếng Việt tự nhiên dùng cấu trúc trực tiếp “hỏi họ”. “Giờ nào” giữ ý về một thời điểm cụ thể.
- source_word: ἐν ᾗ κομψότερον ἔσχεν
  choice: con mình bắt đầu khá hơn
  rationale: Thành ngữ κομψότερον ἔχειν nói về tình trạng sức khỏe được cải thiện. “Bắt đầu khá hơn” diễn đạt phù hợp thời điểm chuyển biến được hỏi đến; chủ thể được nêu là “con mình” để tiếng Việt rõ và tự nhiên trong ngữ cảnh.
- source_word: εἶπαν οὖν αὐτῷ
  choice: Họ thưa với ông
  rationale: εἶπαν là “nói”; trong quan hệ giữa các gia nhân và người cha, “thưa” là cách nói tiếng Việt tự nhiên, trang trọng vừa phải. οὖν ở đây tiếp nối lời đáp và không cần lặp thành một liên từ riêng.
- source_word: Ἐχθὲς ὥραν ἑβδόμην
  choice: Hôm qua, vào giờ thứ bảy
  rationale: Giữ nguyên cách gọi giờ của bản Hy Lạp, không tự chuyển sang hệ giờ hiện đại vốn còn có cách hiểu khác nhau.
- source_word: ἀφῆκεν αὐτὸν ὁ πυρετός
  choice: cơn sốt đã rời khỏi cậu ấy
  rationale: Giữ hình ảnh và cấu trúc của tiếng Hy Lạp, trong đó “cơn sốt” là chủ thể và “rời khỏi” người bệnh; “cậu ấy” phù hợp với người con trai trong ngữ cảnh.
theological_decisions:
- issue: Cách tính “giờ thứ bảy”
  choice: Giữ nguyên “giờ thứ bảy” trong chính văn.
  alternative: Khoảng một giờ chiều nếu tính từ lúc mặt trời mọc; một số người hiểu cách tính giờ trong sách Giăng theo hệ khác.
  rationale: Câu Hy Lạp không xác định hệ thống tính giờ. Giữ cách nói nguyên văn tránh giải quyết một sự mơ hồ mà nguồn không tự giải quyết.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “ông”, “họ thưa” và “cậu ấy” theo quan hệ ngữ cảnh; giữ cách diễn đạt giàu hình ảnh “cơn sốt đã rời khỏi” và giữ nguyên “giờ thứ bảy”.
