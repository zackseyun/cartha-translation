source:
  edition: SBLGNT
  text: τῇ τε γυναικὶ ἔλεγον ὅτι Οὐκέτι διὰ τὴν σὴν λαλιὰν πιστεύομεν· αὐτοὶ γὰρ ἀκηκόαμεν, καὶ οἴδαμεν ὅτι οὗτός ἐστιν ἀληθῶς ὁ σωτὴρ τοῦ ⸀κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/042.yaml
  text: And they were saying to the woman[a], “We no longer believe because of your word, for we ourselves have heard[b], and we know that this one truly is the Savior of the world.”
translation:
  language: vi
  text: 'Họ nói với người phụ nữ: “Chúng tôi không còn tin chỉ vì lời bà nói, vì chính chúng tôi đã nghe và biết rằng người này thật sự là Đấng Cứu Thế của thế gian[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: “Thế gian” ở đây giữ nguyên cách diễn đạt rộng của bản Hy Lạp, không thêm “toàn thể” hay thu hẹp thành một nhóm người.
    reason: theological_scope
lexical_decisions:
- source_word: τῇ τε γυναικὶ ἔλεγον
  choice: Họ nói với người phụ nữ
  rationale: Dịch tự nhiên trong tiếng Việt; thể chưa hoàn thành của ἔλεγον cho thấy lời nói trong diễn tiến, nhưng trong ngữ cảnh này “họ nói” truyền đạt đầy đủ mà không nặng nề.
- source_word: Οὐκέτι διὰ τὴν σὴν λαλιὰν πιστεύομεν
  choice: Bây giờ chúng tôi tin không còn chỉ vì lời chị kể
  rationale: Οὐκέτι diễn tả sự thay đổi căn cứ của đức tin, không phải họ thôi tin. Thêm “chỉ” để câu tiếng Việt tránh bị hiểu lầm; λαλιά chỉ lời nói hay lời thuật lại của người phụ nữ.
- source_word: αὐτοὶ γὰρ ἀκηκόαμεν
  choice: vì chính chúng tôi đã nghe
  rationale: “Chính chúng tôi” giữ sắc thái nhấn mạnh của αὐτοί; “đã nghe” diễn đạt hành động đã xảy ra với kết quả còn hiệu lực của thì hoàn thành ἀκηκόαμεν.
- source_word: καὶ οἴδαμεν
  choice: và chúng tôi biết
  rationale: 'οἴδαμεν mang nghĩa trạng thái hiện tại: họ hiện biết chắc điều mình tuyên xưng.'
- source_word: οὗτός
  choice: người này
  rationale: Giữ lực chỉ định tương đối mạnh của đại từ Hy Lạp và vẫn tự nhiên hơn “vị này” trong lời nói trực tiếp.
- source_word: ἀληθῶς
  choice: thật sự
  rationale: Diễn đạt lời xác quyết trang trọng nhưng dễ hiểu trong tiếng Việt hiện đại.
- source_word: ὁ σωτὴρ τοῦ κόσμου
  choice: Đấng Cứu Thế của thế gian
  rationale: “Đấng Cứu Thế” giữ nội dung Kitô học và sắc thái tước hiệu của σωτήρ; “thế gian” phản ánh κόσμος mà không tự ý thu hẹp hay mở rộng phạm vi.
theological_decisions:
- issue: Căn cứ của đức tin của người Sa-ma-ri
  choice: “tin không còn chỉ vì lời chị kể”
  alternative: “không còn tin vì lời chị kể”
  rationale: Câu Hy Lạp nói rằng lời chứng của người phụ nữ không còn là căn cứ duy nhất/trực tiếp của họ; nó không nói họ phủ nhận lời chứng ấy hoặc ngừng tin. Cách dịch giữ sự chuyển từ lời chứng gián tiếp sang việc trực tiếp nghe.
- issue: Phạm vi của danh xưng “Đấng Cứu Thế của thế gian”
  choice: Giữ nguyên “của thế gian”
  alternative: “Đấng Cứu Thế của mọi người” hoặc cách diễn đạt thu hẹp phạm vi cứu rỗi
  rationale: κόσμος có phạm vi rộng trong lời tuyên xưng này. Bản dịch không biến câu thành một định đề hệ thống về cách thức hay đối tượng cuối cùng của sự cứu rỗi.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “chị” phù hợp với lời một nhóm người nói với người phụ nữ mà không suy đoán tuổi tác quá mức. Cấu trúc “không còn chỉ vì” được dùng để tránh cách hiểu sai rằng họ không còn tin.
