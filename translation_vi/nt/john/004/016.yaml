  yaml_path: translation/nt/john/004/016.yaml
  text: He said to her[a], “Go, call your husband, and come here.”
translation:
  language: vi
  text: 'Ngài nói với bà: “Hãy đi gọi chồng bà rồi đến đây.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Λέγει
  choice: Ngài nói
  rationale: Thì hiện tại Hy Lạp được dùng như hiện tại lịch sử trong lời kể. Tiếng Việt có thể dùng “nói” tự nhiên mà không cần đánh dấu rõ quá khứ; đại từ “Ngài” phù hợp khi chỉ Chúa Giê-su trong văn phong Kinh Thánh trang trọng.
- source_word: αὐτῇ
  choice: với bà
  rationale: Đại từ ở cách dữ chỉ người tiếp nhận lời nói. “Với bà” tự nhiên trong tiếng Việt và phù hợp cách xưng hô với người phụ nữ trưởng thành trong ngữ cảnh.
- source_word: Ὕπαγε
  choice: Hãy đi
  rationale: Mệnh lệnh yêu cầu bà rời chỗ để thực hiện hành động tiếp theo; “hãy đi” vừa trực tiếp vừa tự nhiên.
- source_word: φώνησον
  choice: gọi
  rationale: Động từ có nghĩa gọi hoặc mời một người đến. “Gọi” là cách diễn đạt phổ thông, không mang sắc thái hành chính như “triệu”.
- source_word: τὸν ἄνδρα σου
  choice: chồng bà
  rationale: ἀνήρ có thể là “người đàn ông” hoặc “chồng”; với sở hữu từ và ngữ cảnh gia đình ở đây, “chồng” là nghĩa thích hợp.
- source_word: καὶ
  choice: rồi
  rationale: Liên từ nối hai mệnh lệnh theo trình tự. “Rồi” diễn đạt tự nhiên chuỗi hành động trong tiếng Việt mà không làm thay đổi quan hệ ý nghĩa.
- source_word: ἐλθὲ ἐνθάδε
  choice: trở lại đây
  rationale: Nghĩa sát là “hãy đến đây”. Vì bà được bảo đi trước rồi đến chỗ Chúa Giê-su, tiếng Việt tự nhiên dùng “trở lại đây”; ý trở lại được hàm ý bởi ngữ cảnh, dù không nằm riêng trong động từ.
