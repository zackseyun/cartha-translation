revisions:
- from: 'Đức Giê-su nói với bà: “Hãy tin tôi[a], thưa bà[b], giờ đang đến[c], khi các người sẽ thờ phượng Cha, không phải trên núi này, cũng không phải tại Giê-ru-sa-lem.”'
  to: 'Đức Giê-su nói với bà: “Hãy tin tôi[a], thưa bà[b], giờ đang đến[c], khi người ta sẽ không thờ phượng Cha trên núi này cũng không tại Giê-ru-sa-lem.”'
  rationale: Bản sửa loại bỏ đại từ “các người,” vốn gây sắc thái không có trong nguyên văn, và sắp xếp lại phủ định để câu Việt tự nhiên hơn, đồng thời giữ nguyên ý nghĩa rằng sự thờ phượng Cha sẽ không còn được gắn với núi này hay Giê-ru-sa-lem. Các chú thích giữ nguyên vì còn chính xác, có neo đầy đủ và không áp đặt diễn giải giáo phái.
  reviewer_model: gpt-5.6-terra
