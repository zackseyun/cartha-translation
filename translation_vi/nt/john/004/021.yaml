  verdict: revise
  source_fidelity: 'Bản dịch truyền đạt đúng các yếu tố chính của câu: lời kêu gọi tin, cách xưng hô kính trọng, “giờ” đang đến, hai địa điểm bị loại trừ, và việc thờ phượng Cha. Tuy nhiên, “các người” là cách gọi trực tiếp có sắc thái xa cách hoặc gay gắt trong tiếng Việt hiện đại, không thích hợp với giọng điệu của nguyên văn. Trật tự “sẽ thờ phượng Cha, không phải trên...” cũng kém tự nhiên và làm quan hệ phủ định với hai địa điểm không rõ bằng cấu trúc trực tiếp hơn.'
  naturalness: Nên dùng chủ ngữ phi nhân xưng “người ta” trong mệnh đề khái quát về những người thờ phượng; điều này tự nhiên trong tiếng Việt và phù hợp với việc động từ Hy Lạp ở số nhiều vượt quá riêng người phụ nữ. Cấu trúc “không ... trên núi này cũng không ... tại Giê-ru-sa-lem” diễn đạt rõ cặp οὔτε ... οὔτε.
  terminology: “Đức Giê-su,” “thưa bà,” “giờ,” “thờ phượng,” “Cha,” và “Giê-ru-sa-lem” đều phù hợp văn phong Kinh Thánh Việt hiện đại. Giữ “giờ” là cần thiết để bảo tồn mô-típ Johannine, không thay bằng cách giải thích như “thời điểm.”
