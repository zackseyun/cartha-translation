source:
  edition: SBLGNT
  text: λέγει αὐτῇ ὁ Ἰησοῦς· ⸂Πίστευέ μοι, γύναι⸃, ὅτι ἔρχεται ὥρα ὅτε οὔτε ἐν τῷ ὄρει τούτῳ οὔτε ἐν Ἱεροσολύμοις προσκυνήσετε τῷ πατρί.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/021.yaml
  text: Jesus said to her[a], “Believe me, woman[c][b], an hour is coming when neither on this mountain nor in Jerusalem will you worship the Father.”
translation:
  language: vi
  text: 'Đức Giê-su nói với bà: “Hãy tin tôi[a], thưa bà[b], giờ đang đến[c], khi người ta sẽ không thờ phượng Cha trên núi này cũng không tại Giê-ru-sa-lem.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Hãy tin cậy tôi.” Động từ Hy Lạp có thể nói đến việc tin điều một người nói hoặc tin cậy chính người ấy.'
    reason: lexical_alternative
  - marker: b
    text: “Thưa bà” diễn đạt một cách xưng hô kính trọng trong ngữ cảnh này, không phải lời nói thô lỗ.
    reason: cultural_note
  - marker: c
    text: 'Cũng có thể hiểu: “giờ ấy đang đến.” Tuy danh từ Hy Lạp tại đây không có mạo từ, sách Giăng thường dùng “giờ” như một thuật ngữ chủ đề chỉ thời điểm quyết định trong chương trình của Đức Chúa Trời.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πίστευέ μοι
  choice: Hãy tin tôi
  rationale: Mệnh lệnh hiện tại với đại từ ở cách cho là lời trực tiếp kêu gọi người phụ nữ tin điều Đức Giê-su sắp nói. Cách dịch này tự nhiên và giữ được liên hệ với động từ πιστεύω xuyên suốt sách Giăng; nghĩa “hãy tin cậy tôi” vẫn có thể có nhưng nhấn mạnh hơn đến sự nương cậy mang tính quan hệ.
- source_word: γύναι
  choice: thưa bà
  rationale: Từ hô cách γύναι có nghĩa đen là “người phụ nữ/bà”, nhưng trong ngữ cảnh này là lối xưng hô kính trọng, không thô lỗ. “Thưa bà” truyền đạt đúng chức năng xưng hô trong tiếng Việt hiện đại mà không thêm sắc thái thân mật.
- source_word: ἔρχεται ὥρα
  choice: giờ đang đến
  rationale: Giữ danh từ “giờ” để bảo tồn mô-típ ὥρα trong sách Giăng. Danh từ Hy Lạp không có mạo từ, còn tiếng Việt không buộc phải biểu thị bất định; “giờ đang đến” vừa gần hình thức nguồn vừa tự nhiên.
- source_word: οὔτε ... οὔτε
  choice: không phải ... cũng không phải
  rationale: Cặp phủ định loại trừ cả hai địa điểm. Cấu trúc tiếng Việt này rõ ràng, tự nhiên và giữ nguyên sự đối chiếu giữa núi của người Sa-ma-ri với Giê-ru-sa-lem.
- source_word: ἐν τῷ ὄρει τούτῳ
  choice: trên núi này
  rationale: Với địa hình là núi, ἐν được diễn đạt tự nhiên bằng “trên” trong tiếng Việt.
- source_word: ἐν Ἱεροσολύμοις
  choice: tại Giê-ru-sa-lem
  rationale: “Tại” là giới từ địa điểm tự nhiên trong cấu trúc song song này; dạng số nhiều trong tiếng Hy Lạp là hình thức thông dụng của địa danh Giê-ru-sa-lem và không cần phản ánh bằng số nhiều trong tiếng Việt.
- source_word: προσκυνήσετε
  choice: các người sẽ thờ phượng
  rationale: Động từ tương lai ngôi thứ hai số nhiều cho thấy lời nói vượt quá riêng người phụ nữ và hướng đến cộng đồng. “Các người” biểu thị số nhiều rõ ràng; “thờ phượng” phù hợp với nghĩa tôn giáo trong toàn ngữ cảnh Giăng 4.
- source_word: τῷ πατρί
  choice: Cha
  rationale: Trong văn mạch sách Giăng, danh từ này chỉ Đức Chúa Trời trong tư cách Cha. Viết hoa như một danh xưng thần linh, không bổ sung cách giải nghĩa ngoài nguyên bản.
theological_decisions:
- issue: Sắc thái của cách xưng hô γύναι
  choice: Dịch theo chức năng là “thưa bà”, kèm chú thích rằng đây là cách xưng hô kính trọng.
  alternative: “này bà”, “người phụ nữ”, hoặc chỉ “bà”
  rationale: Bản dịch cần tránh khiến độc giả Việt hiểu sai lời Đức Giê-su là cộc lốc, đồng thời không thêm sắc thái trìu mến không có trong nguyên bản.
- issue: Mô-típ ὥρα trong sách Giăng
  choice: Giữ từ “giờ” và sự không xác định của danh từ qua cách diễn đạt không có từ chỉ định.
  alternative: “thời điểm đang đến” hoặc “giờ ấy đang đến”
  rationale: “Giờ” bảo tồn ngôn ngữ chủ đề của Giăng; không thêm “ấy” vì nguyên bản tại đây không có mạo từ, nhưng chú thích ghi nhận khả năng hiểu theo mô-típ về thời điểm quyết định trong chương trình của Đức Chúa Trời.
- issue: Phạm vi của ngôi thứ hai số nhiều προσκυνήσετε
  choice: Biểu thị rõ bằng “các người”.
  alternative: Lược đại từ và dịch chung là “sẽ thờ phượng”
  rationale: Hình thái số nhiều có ý nghĩa vì Đức Giê-su đang nói với một phụ nữ nhưng đề cập đến những người thờ phượng rộng hơn. Bản dịch không thu hẹp lời này chỉ vào cá nhân bà.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Giê-su” và “Giê-ru-sa-lem” theo cách phiên âm quen thuộc; dùng “thờ phượng” cho hành vi tôn giáo. Câu được sắp xếp lại đôi chút để cặp phủ định tự nhiên trong tiếng Việt, đồng thời biểu thị rõ ngôi thứ hai số nhiều của động từ.
