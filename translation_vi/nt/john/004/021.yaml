    rationale: “Sẽ thờ phượng Cha, không phải trên núi này...” có thể hiểu được, nhưng cách đặt phủ định sau động từ làm câu nặng. Đưa “không” trước động từ và giữ “cũng không” trước địa điểm thứ hai phản ánh rõ hơn cặp phủ định Hy Lạp.
