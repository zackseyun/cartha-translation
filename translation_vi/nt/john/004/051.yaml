  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἤδη δὲ αὐτοῦ καταβαίνοντος οἱ δοῦλοι αὐτοῦ ⸀ὑπήντησαν ⸀αὐτῷ λέγοντες ὅτι ὁ παῖς ⸀αὐτοῦ ζῇ.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/051.yaml
  text: And while he was already going down[a], his servants met him, saying that his child was alive.
translation:
  language: vi
  text: Khi ông đang trên đường đi xuống, các đầy tớ của ông ra đón ông và báo rằng con ông còn sống.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hoặc “đứa trẻ của ông”; từ Hy Lạp pais có thể có nghĩa là “đứa trẻ”, “cậu bé”, hoặc, trong một số văn cảnh, “đầy tớ”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤδη
  choice: đang
  rationale: Kết hợp với phân từ hiện tại để diễn tả hành động đã bắt đầu và đang tiếp diễn lúc cuộc gặp xảy ra; trong tiếng Việt, “đang trên đường” tự nhiên hơn việc dịch riêng ἤδη là “đã”. Tuy nhiên, sắc thái “đã/đến lúc ấy” không được biểu đạt hoàn toàn tách biệt.
- source_word: δὲ
  choice: Khi
  rationale: Tiểu từ nối nhẹ để tiếp tục câu chuyện; quan hệ thời gian với cấu trúc sở hữu cách tuyệt đối được diễn đạt tự nhiên bằng “Khi”, không nhấn mạnh tương phản.
- source_word: καταβαίνοντος
  choice: đang trên đường đi xuống
  rationale: Phân từ hiện tại trong cấu trúc sở hữu cách tuyệt đối chỉ hành động đang diễn ra. “Đi xuống” giữ hình ảnh địa lý của hành trình từ Ca-na về Ca-bê-na-um, còn “trên đường” làm câu tiếng Việt tự nhiên.
- source_word: δοῦλοι
  choice: đầy tớ
  rationale: Chỉ những người lệ thuộc và phục vụ trong nhà vị quan. “Đầy tớ” vừa dễ hiểu trong văn cảnh cổ đại vừa giữ rõ quan hệ dưới quyền hơn “người phục vụ”, dù không biểu đạt hết địa vị nô lệ có thể hàm chứa trong từ Hy Lạp.
- source_word: ὑπήντησαν
  choice: ra đón
  rationale: Động từ có thể chỉ việc đi ra để gặp một người đang đến; “ra đón” phù hợp với việc những người trong nhà chủ động đến gặp vị quan trên đường về.
- source_word: λέγοντες
  choice: và báo rằng
  rationale: Phân từ diễn tả hành động kèm theo cuộc gặp. “Báo rằng” tự nhiên trong tiếng Việt và phù hợp với việc họ đem tin đến, thay vì cách dịch sát nhưng cứng là “nói rằng”.
- source_word: παῖς
  choice: con
  rationale: Trong toàn văn câu chuyện, người bệnh là con trai của vị quan; “con” tự nhiên, không xác định tuổi và không cần lặp lại giới tính. Chú thích bảo lưu phạm vi nghĩa rộng của παῖς ngay trong câu này.
- source_word: ζῇ
  choice: vẫn sống
  rationale: Thì hiện tại mang nghĩa “đang sống/còn sống”. Trong lời báo trực tiếp, “vẫn sống” tự nhiên và giữ sức nặng của tin rằng đứa trẻ không chết; không thêm diễn giải “đã khỏi bệnh”.
theological_decisions:
- issue: Phạm vi chỉ đối tượng của παῖς trong câu chuyện chữa lành
  choice: Con ông
  alternative: Đứa trẻ của ông; con trai ông; đầy tớ của ông
  rationale: παῖς tự nó có thể nghĩa là trẻ em, con trai hoặc đầy tớ. Tuy nhiên, văn cảnh gần gọi người bệnh là υἱός, tức “con trai” của vị quan (4:46–50), nên “con” nhận diện tự nhiên cùng một người mà không xác định tuổi. Chú thích giữ lại sự rộng nghĩa của từ trong chính câu này.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “ông” cho vị quan, “đầy tớ” cho người thuộc nhà ông. Chuyển lời báo thành lời trực tiếp để tiếng Việt tự nhiên, đồng thời giữ nguyên nội dung mệnh đề Hy Lạp.
