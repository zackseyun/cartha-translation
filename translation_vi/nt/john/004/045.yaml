  to: Vậy, khi Đức Giê-su đến Ga-li-lê, người Ga-li-lê tiếp đón Ngài[a], là những người đã thấy mọi việc Ngài đã làm tại Giê-ru-sa-lem trong kỳ lễ[b], vì chính họ cũng đã đi dự kỳ lễ ấy.
  rationale: 'Sửa cấu trúc câu để phản ánh tốt hơn quan hệ giữa phân từ ἑωρακότες và γάρ: người Ga-li-lê là những người đã thấy các việc Đức Giê-su làm; lý do họ có mặt để thấy là vì chính họ cũng đã đi dự kỳ lễ. Đồng thời thêm “đã” trong “Ngài đã làm” để diễn đạt tự nhiên hơn trình tự quá khứ. Không thay đổi ý nghĩa, thuật ngữ chính, hoặc các neo chú thích.'
