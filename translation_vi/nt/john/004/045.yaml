id: JHN.4.45
reference: John 4:45
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὅτε οὖν ἦλθεν εἰς τὴν Γαλιλαίαν, ἐδέξαντο αὐτὸν οἱ Γαλιλαῖοι, πάντα ἑωρακότες ⸀ὅσα ἐποίησεν ἐν Ἱεροσολύμοις ἐν τῇ ἑορτῇ, καὶ αὐτοὶ γὰρ ἦλθον εἰς τὴν ἑορτήν.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/045.yaml
  text: So when he came into Galilee[a], the Galileans welcomed him, having seen all that he had done in Jerusalem at the feast[b], for they too had gone to the feast.
translation:
  language: vi
  text: Vậy, khi Đức Giê-su đến Ga-li-lê, người Ga-li-lê tiếp đón Ngài[a], là những người đã thấy mọi việc Ngài đã làm tại Giê-ru-sa-lem trong kỳ lễ[b], vì chính họ cũng đã đi dự kỳ lễ ấy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “tiếp nhận Ngài.” Động từ Hy Lạp có thể chỉ việc tiếp nhận hoặc chào đón; trong ngữ cảnh này, nó gợi một sự đón tiếp thuận lợi.
    reason: lexical_alternative
  - marker: b
    text: Hay “lễ hội.” Từ Hy Lạp ἑορτή chỉ một kỳ lễ tôn giáo; theo ngữ cảnh xung quanh, có lẽ đây là kỳ lễ hành hương tại Giê-ru-sa-lem.
    reason: cultural_note
lexical_decisions:
- source_word: ὅτε οὖν
  choice: Vậy, khi
  rationale: οὖν vừa nối tiếp diễn tiến câu chuyện vừa hàm ý hệ quả; “Vậy, khi” giữ được lực liên kết mà vẫn tự nhiên trong tiếng Việt.
- source_word: ἦλθεν εἰς τὴν Γαλιλαίαν
  choice: đến Ga-li-lê
  rationale: Diễn đạt tự nhiên chuyển động vào vùng Ga-li-lê; tiếng Việt không cần thêm từ tương đương máy móc với “vào”.
- source_word: ἐδέξαντο αὐτὸν
  choice: tiếp đón Ngài
  rationale: δέχομαι trong ngữ cảnh chỉ sự tiếp nhận thuận lợi, mang sắc thái chào đón, chứ không chỉ đơn thuần nhận lấy.
- source_word: οἱ Γαλιλαῖοι
  choice: người Ga-li-lê
  rationale: Cách gọi địa-dân tự nhiên, rõ nghĩa trong tiếng Việt hiện đại.
- source_word: πάντα ἑωρακότες ὅσα
  choice: vì đã thấy mọi việc
  rationale: Phân từ hoàn thành nói đến điều họ đã chứng kiến trước đó và vẫn có liên hệ với việc tiếp đón; “vì” làm rõ quan hệ nguyên nhân được ngữ cảnh gợi ra.
- source_word: ἐποίησεν
  choice: Ngài làm
  rationale: Sau “đã thấy”, tiếng Việt không cần đánh dấu quá khứ thêm lần nữa; cách diễn đạt vẫn giữ đúng thứ tự thời gian.
- source_word: ἐν Ἱεροσολύμοις
  choice: tại Giê-ru-sa-lem
  rationale: “Tại” diễn đạt địa điểm trang trọng, tự nhiên.
- source_word: ἐν τῇ ἑορτῇ
  choice: trong kỳ lễ
  rationale: ἑορτή là một dịp lễ tôn giáo; “kỳ lễ” vừa tự nhiên vừa giữ sắc thái một thời kỳ cử hành lễ.
- source_word: καὶ αὐτοὶ γὰρ
  choice: bởi chính họ cũng
  rationale: “Bởi” giữ chức năng giải thích của γάρ, còn “chính họ cũng” bảo toàn sắc thái nhấn mạnh và bao gồm của αὐτοὶ καί.
- source_word: ἦλθον εἰς τὴν ἑορτήν
  choice: đã đi dự kỳ lễ ấy
  rationale: Diễn đạt việc họ đã đến tham dự lễ trước đó; “đi dự” tự nhiên hơn cách dịch sát từng từ và “ấy” quy chiếu rõ về kỳ lễ vừa nhắc.
theological_decisions: []
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “Đức Giê-su” và đại từ tôn kính “Ngài”; giữ địa danh theo lối phiên âm quen thuộc. Câu văn bảo toàn mạch kể, nguyên nhân của sự tiếp đón và sắc thái nhấn mạnh rằng chính người Ga-li-lê cũng đã dự lễ.
