reference: John 4:48
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἶπεν οὖν ὁ Ἰησοῦς πρὸς αὐτόν· Ἐὰν μὴ σημεῖα καὶ τέρατα ἴδητε, οὐ μὴ πιστεύσητε.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/048.yaml
  text: So Jesus said to him[a], “Unless you see signs and wonders, you will certainly not believe.”
translation:
  language: vi
  text: 'Vậy, Đức Giê-su nói với ông[a]: “Nếu các ông không thấy dấu lạ và những điều kỳ diệu, các ông nhất định sẽ không tin.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Trong tiếng Hy Lạp, lời dẫn nói Đức Giê-su nói với một người, nhưng các động từ “thấy” và “tin” trong lời Ngài đều ở số nhiều. Vì thế, lời này có lẽ hướng đến một nhóm rộng hơn, chứ không chỉ riêng viên quan.
    reason: Làm rõ sự chuyển đổi từ người nghe số ít sang lời nói ở số nhiều trong nguyên văn.
lexical_decisions:
- source_word: οὖν
  choice: Vì vậy
  rationale: Diễn tả sự tiếp nối có tính suy luận từ lời thỉnh cầu ở câu trước, đồng thời vẫn tự nhiên trong văn kể hiện đại.
- source_word: πρὸς αὐτόν
  choice: nói với ông
  rationale: 'Giữ rõ khung tường thuật: Đức Giê-su đang trực tiếp nói với một người nam đã được nhắc đến trước đó.'
- source_word: Ἐὰν μὴ
  choice: Nếu ... không
  rationale: Cách diễn đạt điều kiện phủ định tự nhiên trong tiếng Việt; không cần thêm từ ngữ diễn giải.
- source_word: σημεῖα
  choice: những dấu lạ
  rationale: 'Giữ sắc thái của σημεῖον trong sách Giăng: một việc phi thường mang ý nghĩa chỉ dấu, thay vì chỉ diễn đạt chung là phép lạ.'
- source_word: τέρατα
  choice: việc kỳ diệu
  rationale: Diễn đạt hiện tượng gây kinh ngạc bằng ngôn ngữ phổ thông, trang trọng, đồng thời phân biệt tương đối với ‘dấu lạ’.
- source_word: ἴδητε
  choice: các ông ... thấy
  rationale: Dùng ‘các ông’ để thể hiện rõ ngôi thứ hai số nhiều của động từ Hy Lạp, dù lời dẫn cho biết Đức Giê-su đang nói trực tiếp với một người.
- source_word: οὐ μὴ πιστεύσητε
  choice: các ông nhất định sẽ không tin
  rationale: ‘Nhất định ... không’ bảo toàn sức nhấn mạnh của phủ định kép οὐ μή đi với động từ giả định, mà không cường điệu thành một mệnh đề tuyệt đối vượt quá văn bản.
- source_word: πιστεύσητε
  choice: tin
  rationale: ‘Tin’ là cách tương đương trực tiếp, tự nhiên và ít áp đặt diễn giải nhất cho πιστεύω trong văn mạch của sách Giăng.
theological_decisions:
- issue: Số lượng và phạm vi người được nói với
  choice: Lời dẫn dùng số ít ‘với ông’, còn lời Đức Giê-su dùng số nhiều ‘các ông’.
  alternative: Hiểu toàn bộ câu chỉ nhắm đến viên quan và dùng đại từ số ít; hoặc mở rộng thành ‘các người’ với sắc thái quở trách mạnh hơn.
  rationale: αὐτόν là số ít, nhưng ἴδητε và πιστεύσητε đều là số nhiều. Bản dịch giữ nguyên sự chuyển đổi này, qua đó để ngỏ việc lời nói vượt ra ngoài riêng viên quan mà không xác định thêm nhóm người nào.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. ‘Đức Giê-su’ phù hợp văn phong Kinh Thánh trang nghiêm; ‘các ông’ thể hiện số nhiều mà không dùng cách gọi miệt thị hay quá cổ. Cấu trúc giữ nhịp ngắn gọn và sức nhấn mạnh của câu Hy Lạp.
