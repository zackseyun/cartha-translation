review_pass:
  verdict: revise
  source_fidelity: Bản nháp giữ đúng trình tự thời gian, chủ thể là các môn đồ, sắc thái lặp lại/tiếp diễn của ἠρώτων, và lời xưng hô Ῥαββί. Tuy nhiên, “cứ nài” thường gợi ý van nài hoặc quấy rầy mạnh hơn động từ ἐρωτάω trong ngữ cảnh này. “Mời” diễn đạt tự nhiên lời đề nghị/giục ăn và vẫn phù hợp với ý xin mời đang tiếp diễn.
  naturalness: '“các môn đồ cứ nài Người rằng” hơi gượng: “nài” mang sắc thái quá mạnh, còn “rằng” trước lời trực tiếp không cần thiết. Cấu trúc dùng dấu hai chấm sau “mời Người” tự nhiên hơn. “môn đệ” là thuật ngữ hiện hành hơn trong tiếng Việt tiêu chuẩn hiện đại.'
  terminology: Giữ “Ra-bi” để bảo toàn tước hiệu Do Thái trong nguyên văn; “Thầy” trong lời mời là đại từ xưng hô kính trọng tự nhiên, không thay thế hay xóa “Ra-bi”. Chú thích nên nói đây là cách xưng hô, thay vì gọi khái quát là “tước hiệu”.
  issues:
  - severity: medium
    issue: “cứ nài” mạnh hơn sắc thái của ἠρώτων.
    rationale: ἠρώτων (thể chưa hoàn thành) chủ yếu diễn tả việc họ đang/cứ hỏi, xin hoặc mời; ngữ cảnh cho phép ý thúc giục, nhưng “nài” dễ hàm ý van vỉ khẩn khoản không được nguyên văn xác định.
  - severity: low
    issue: “môn đồ” ít hiện hành hơn “môn đệ” trong tiếng Việt tiêu chuẩn hiện đại.
    rationale: Cả hai đều hiểu được, nhưng “môn đệ” tự nhiên và thông dụng hơn trong văn phong Kinh Thánh hiện đại.
  - severity: low
    issue: Câu dẫn “nài Người rằng” không tự nhiên bằng cấu trúc dùng dấu hai chấm.
    rationale: 'Phân từ λέγοντες chỉ dẫn nội dung phát ngôn; tiếng Việt có thể biểu đạt gọn và tự nhiên bằng “mời Người: ...”.'
