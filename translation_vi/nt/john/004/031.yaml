revisions:
- from: 'Trong lúc ấy[a], các môn đồ cứ nài Người rằng[b]: “Ra-bi[c], xin Thầy ăn đi.”'
  to: 'Trong lúc đó[a], các môn đệ cứ mời Người[b]: “Ra-bi[c], xin Thầy ăn đi.”'
  rationale: Đổi “cứ nài” thành “cứ mời” để diễn đạt tự nhiên hơn lời các môn đệ đề nghị Đức Giê-su ăn, không thêm sắc thái van nài quá mạnh; đổi “môn đồ” thành “môn đệ” theo tiếng Việt tiêu chuẩn hiện đại; và làm gọn câu dẫn lời nói trực tiếp. Các yếu tố thời gian, tính tiếp diễn, lời xưng hô Ra-bi và mệnh lệnh ăn đều được giữ lại.
  reviewer_model: gpt-5.6-terra
