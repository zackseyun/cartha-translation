base_translation:
  language: en
  yaml_path: translation/nt/john/004/031.yaml
  text: Meanwhile, the disciples were urging him, saying, “Rabbi, eat.”
translation:
  language: vi
  text: 'Trong lúc đó[a], các môn đệ cứ mời Người[b]: “Ra-bi[c], xin Thầy ăn đi.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Trong khi ấy.”'
    reason: lexical_alternative
  - marker: b
    text: Động từ này cũng có thể dịch là “hỏi,” “xin” hoặc “cứ xin”; thể chưa hoàn thành có thể diễn tả hành động đang tiếp diễn hoặc lặp lại. Trong ngữ cảnh này, lời xin có ý mời hoặc giục Chúa Giê-su ăn.
    reason: lexical_alternative
  - marker: c
    text: “Ra-bi” là cách xưng hô của người Do Thái, cũng có nghĩa là “Thầy.”
    reason: cultural_note
lexical_decisions:
- source_word: Ἐν τῷ μεταξὺ
  choice: Trong lúc ấy
  rationale: Thành ngữ chỉ khoảng thời gian xen giữa việc người phụ nữ rời đi và cuộc đối thoại tiếp theo; cách dịch này tự nhiên trong tiếng Việt và giữ đúng ý thời gian.
- source_word: ἠρώτων
  choice: cứ nài
  rationale: Thể chưa hoàn thành diễn tả hành động đang tiếp diễn hoặc lặp lại; trong ngữ cảnh, các môn đồ tha thiết đề nghị Chúa Giê-su ăn, nên “cứ nài” truyền đạt được sắc thái ấy.
- source_word: αὐτὸν
  choice: Người
  rationale: Đại từ làm tân ngữ, chỉ về Chúa Giê-su; “Người” là cách quy chiếu trang trọng, rõ nghĩa trong văn mạch Kinh Thánh tiếng Việt.
- source_word: οἱ μαθηταὶ
  choice: các môn đồ
  rationale: Mạo từ xác định nhóm môn đồ đã được biết trong văn mạch; tiếng Việt không cần thêm sở hữu từ.
- source_word: λέγοντες
  choice: rằng
  rationale: Phân từ dẫn vào nội dung lời nài xin; “rằng” chuyển tự nhiên sang lời nói trực tiếp mà không tạo cấu trúc nặng nề.
- source_word: Ῥαββί
  choice: Ra-bi
  rationale: Giữ lại tước hiệu xưng hô Do Thái bằng lối phiên âm dễ đọc, thay vì đồng nhất hoàn toàn với “Thầy”; ý nghĩa văn hóa được giải thích trong chú thích.
- source_word: φάγε
  choice: xin Thầy ăn đi
  rationale: Mệnh lệnh cách số ít được diễn đạt thành lời đề nghị trực tiếp, tự nhiên và kính trọng trong tiếng Việt; “Thầy” được bổ sung theo ngữ dụng xưng hô, không thay đổi đối tượng hay nội dung mệnh lệnh.
theological_decisions: []
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “môn đồ” để giữ sắc thái Kinh Thánh quen thuộc; “cứ nài” thể hiện khía cạnh tiếp diễn của động từ; lời trực tiếp dùng cách nói kính trọng và tự nhiên.
