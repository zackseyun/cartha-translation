  text: Ἦλθεν οὖν ⸀πάλιν εἰς τὴν Κανὰ τῆς Γαλιλαίας, ὅπου ἐποίησεν τὸ ὕδωρ οἶνον. καὶ ἦν τις βασιλικὸς οὗ ὁ υἱὸς ἠσθένει ἐν Καφαρναούμ.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/046.yaml
  text: So he came again to Cana of Galilee[a], where he had made the water wine[b]. And there was a certain royal official whose son was sick in Capernaum.
translation:
  language: vi
  text: Vì vậy, Ngài lại đến Ca-na thuộc Ga-li-lê, nơi Ngài đã làm nước thành rượu[a]. Tại đó có một viên chức hoàng gia[b] có con trai đang đau ốm ở Ca-phác-na-um.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch rõ nghĩa hơn: “đã biến nước thành rượu.” Nguyên văn sát hơn là “đã làm nước thành rượu.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “quan của vua” hoặc “viên chức triều đình.” Từ Hy Lạp chỉ một người có liên hệ với triều đình hoặc phục vụ nhà vua.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: Vì vậy
  rationale: Giữ sức nối tiếp hoặc suy luận của liên từ Hy Lạp trong mạch kể chuyện.
- source_word: πάλιν
  choice: lại
  rationale: Diễn đạt tự nhiên việc Ngài trở lại Ca-na một lần nữa.
- source_word: Κανὰ τῆς Γαλιλαίας
  choice: Ca-na thuộc Ga-li-lê
  rationale: Dùng dạng địa danh quen thuộc trong tiếng Việt và diễn đạt rõ quan hệ địa lý của sở hữu cách.
- source_word: ἐποίησεν τὸ ὕδωρ οἶνον
  choice: đã làm nước thành rượu
  rationale: Bám sát cấu trúc 'làm nước [thành] rượu', đồng thời dùng 'đã' để chỉ sự việc xảy ra trước lần đến này.
- source_word: βασιλικός
  choice: viên chức hoàng gia
  rationale: Chỉ một người có liên hệ với vua hoặc triều đình mà không xác định quá mức chức vụ, phẩm cấp hay thân phận quý tộc.
- source_word: τις
  choice: một
  rationale: Giới thiệu một người cụ thể nhưng không nêu tên; cách diễn đạt này tự nhiên hơn 'một người nào đó' trong tiếng Việt.
- source_word: υἱός
  choice: con trai
  rationale: Giữ đúng giới tính được danh từ Hy Lạp nêu rõ.
- source_word: ἠσθένει
  choice: đang đau ốm
  rationale: Diễn đạt tình trạng bệnh tật kéo dài tại thời điểm câu chuyện diễn ra.
- source_word: Καφαρναούμ
  choice: Ca-phác-na-um
  rationale: Dùng dạng phiên âm địa danh quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
theological_decisions:
- issue: Không xác định quá mức thân phận lịch sử của βασιλικός
  choice: viên chức hoàng gia
  alternative: quan của vua; người quý tộc
  rationale: Nguyên văn chỉ xác nhận mối liên hệ với hoàng gia, không cho biết chính xác ông giữ chức gì, phục vụ vị vua nào hay thuộc tầng lớp quý tộc.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” để chỉ Đức Chúa Jêsus theo chủ thể đã có trong văn cảnh; giữ câu kể gọn, không bổ sung danh tính hay chức vụ mà nguyên văn không xác định.
