  to: Vì vậy, Ngài lại đến Ca-na thuộc Ga-li-lê, nơi Ngài đã làm nước thành rượu[a]. Tại đó có một viên chức hoàng gia[b] có con trai đang đau ốm ở Ca-phác-na-um.
  rationale: Chỉ chỉnh cú pháp câu thứ hai để tiếng Việt tự nhiên và rõ nghĩa hơn, đồng thời làm rõ phương án chú thích của βασιλικός. Không thay đổi nghĩa của đoạn, mức độ xác định lịch sử, hay các điểm thần học.
