  source_fidelity: 'Bản dịch giữ đúng cấu trúc và hình ảnh của nguyên văn: người gặt nhận μισθός, thu góp καρπός hướng tới/sự sống đời đời, nhằm để người gieo và người gặt cùng vui mừng. Tuy nhiên, “nhận công” trong tiếng Việt hiện đại dễ được hiểu là nhận việc/công việc hơn là nhận tiền công; cần nêu rõ đối tượng của λαμβάνει μισθόν.'
