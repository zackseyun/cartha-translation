id: JHN.4.36
reference: John 4:36
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸀ὁ θερίζων μισθὸν λαμβάνει καὶ συνάγει καρπὸν εἰς ζωὴν αἰώνιον, ⸀ἵνα ὁ σπείρων ὁμοῦ χαίρῃ καὶ ὁ θερίζων.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/036.yaml
  text: The one who reaps is receiving wages and gathering fruit for eternal life[b][a], so that the one who sows and the one who reaps may rejoice together.
translation:
  language: vi
  text: Người gặt đang nhận tiền công[a] và thu hoa lợi cho sự sống đời đời[b], để người gieo và người gặt cùng vui mừng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “thù lao” hoặc “phần thưởng.” Từ Hy Lạp có thể chỉ tiền công kiếm được hoặc sự báo đáp.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “dẫn đến sự sống đời đời.” Cụm từ này có thể diễn tả mục đích, hướng đến hoặc kết quả.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ θερίζων
  choice: người gặt
  rationale: Phân từ hiện tại có mạo từ được dùng như danh từ; cách dịch này tự nhiên, súc tích và giữ hình ảnh mùa gặt.
- source_word: μισθὸν
  choice: công
  rationale: Trong ngữ cảnh lao động gặt hái, “công” diễn đạt tiền công/thù lao một cách tự nhiên, đồng thời không loại trừ sắc thái phần thưởng.
- source_word: λαμβάνει
  choice: đang nhận
  rationale: Thể hiện hành động hiện tại đang diễn ra, phù hợp với trọng tâm của ngữ cảnh rằng mùa gặt hiện đang có.
- source_word: συνάγει καρπὸν
  choice: thu hoa lợi
  rationale: “Thu” diễn tả hành động gom góp, còn “hoa lợi” giữ được hình ảnh καρπός là thành quả hay sản vật mà không đồng nhất nó với chính mùa gặt.
- source_word: εἰς ζωὴν αἰώνιον
  choice: cho sự sống đời đời
  rationale: Giữ độ mở của εἰς về hướng đến, mục đích hoặc kết quả; chú thích nêu cách hiểu thay thế.
- source_word: ἵνα
  choice: để
  rationale: Diễn đạt tự nhiên mệnh đề mục đích/kết quả mà không ấn định quá mức quan hệ giữa hai sắc thái.
- source_word: ὁ σπείρων
  choice: người gieo
  rationale: Song song trực tiếp với “người gặt” và phản ánh phân từ có mạo từ dùng như danh từ.
- source_word: ὁμοῦ χαίρῃ
  choice: cùng vui mừng
  rationale: Diễn đạt niềm vui chung của người gieo và người gặt bằng tiếng Việt tự nhiên, trang trọng.
theological_decisions:
- issue: Có nên thêm từ tương đương với “đã/đã đến lúc” để nhấn mạnh tính hiện tại hay không
  choice: Không thêm từ nào ngoài văn bản Hy Lạp; dùng “đang nhận” để thể hiện thì hiện tại
  alternative: Thêm “ngay từ bây giờ” hoặc “đã” dựa trên ngữ cảnh gần
  rationale: Câu Hy Lạp không có trạng từ riêng mang nghĩa “đã rồi”. Thì hiện tại của λαμβάνει đủ truyền đạt tính hiện thời mà không bổ sung ý ngoài câu.
- issue: Quan hệ của εἰς ζωὴν αἰώνιον với hoa lợi được thu
  choice: Dịch “cho sự sống đời đời”
  alternative: “để được sự sống đời đời” hoặc “dẫn đến sự sống đời đời”
  rationale: Cách dịch chính giữ được sự mơ hồ chân thực giữa mục đích, hướng đến và kết quả, tránh xác định quá mức cơ chế thần học.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Cấu trúc song song “người gieo và người gặt” được giữ rõ; không thêm “đã” vì từ này không hiện diện riêng trong nguyên văn.
