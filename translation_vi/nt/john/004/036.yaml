revisions:
- from: Người gặt đang nhận công[a] và thu hoa lợi cho sự sống đời đời[b], để người gieo và người gặt cùng vui mừng.
  to: Người gặt đang nhận tiền công[a] và thu hoa lợi cho sự sống đời đời[b], để người gieo và người gặt cùng vui mừng.
  rationale: Chỉ thay “công” bằng “tiền công” để loại bỏ một khả năng hiểu sai trong tiếng Việt hiện đại. Giữ “đang nhận” để phản ánh thì hiện tại trong ngữ cảnh, giữ “hoa lợi” cho καρπός, và không thêm ý “đã rồi/ngay từ bây giờ” vốn không có trong mệnh đề Hy Lạp này.
