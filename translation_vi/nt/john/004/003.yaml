  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Đại từ “Ngài” nối tự nhiên với chủ thể là Chúa Giê-su trong ngữ cảnh trước đó; tên địa lý dùng dạng phiên âm quen thuộc Giu-đê và Ga-li-lê.
