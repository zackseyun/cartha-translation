translation:
  language: vi
  text: Ngài rời miền Giu-đê và trở lại miền Ga-li-lê[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “lại đến Ga-li-lê.” Trạng từ Hy Lạp πάλιν có nghĩa là “lại”; trong ngữ cảnh này, từ ấy có thể mang ý trở về, nên được dịch là “trở lại”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφῆκεν
  choice: rời
  rationale: Động từ ἀφίημι ở đây có nghĩa là rời một nơi lại phía sau; “rời” tự nhiên, trực tiếp và phù hợp với bổ ngữ “miền Giu-đê”.
- source_word: τὴν Ἰουδαίαν
  choice: miền Giu-đê
  rationale: Chỉ vùng địa lý Giu-đê; thêm “miền” giúp người đọc hiện đại nhận rõ đây là địa danh vùng lãnh thổ.
- source_word: ἀπῆλθεν
  choice: trở lại
  rationale: Kết hợp ἀπῆλθεν với πάλιν để diễn đạt tự nhiên hành động đi về một nơi đã từng ở, thay vì dịch cứng từng từ.
- source_word: πάλιν
  choice: lại
  rationale: Trong ngữ cảnh hành trình, πάλιν có thể chỉ sự trở về; “trở lại” diễn đạt nghĩa này tự nhiên, nhưng chú thích vẫn giữ khả năng hiểu sát hơn là “lại đi đến”.
- source_word: εἰς τὴν Γαλιλαίαν
  choice: miền Ga-li-lê
  rationale: εἰς chỉ hướng đến đích; trong cấu trúc “trở lại”, tiếng Việt không cần thêm “đến”. “Miền Ga-li-lê” xác định đây là một vùng địa lý.
theological_decisions: []
