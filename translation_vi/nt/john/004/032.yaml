  text: ὁ δὲ εἶπεν αὐτοῖς· Ἐγὼ βρῶσιν ἔχω φαγεῖν ἣν ὑμεῖς οὐκ οἴδατε.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/032.yaml
  text: But he said to them[a], “I have food to eat that you do not know.”
translation:
  language: vi
  text: 'Nhưng Người nói với họ: “Ta có thức ăn mà các con không biết.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: Nhưng
  rationale: Đánh dấu sự tương phản nhẹ giữa lời thúc giục của các môn đồ và lời đáp gây bất ngờ của Đức Chúa Jêsus.
- source_word: εἶπεν αὐτοῖς
  choice: Ngài nói với họ
  rationale: Cách diễn đạt tự nhiên, trang trọng, giữ đúng cấu trúc kể chuyện của nguyên văn.
- source_word: Ἐγὼ
  choice: Ta
  rationale: Đại từ được nêu rõ trong tiếng Hy Lạp tạo thế đối lập với ὑμεῖς; “Ta” phù hợp lời Đức Chúa Jêsus nói với các môn đồ trong văn phong Kinh Thánh trang trọng.
- source_word: βρῶσιν
  choice: thức ăn
  rationale: Chỉ đồ ăn hay sự nuôi dưỡng; giữ nghĩa cụ thể để phép ẩn dụ và sự hiểu lầm có chủ ý được bộc lộ qua văn cảnh.
- source_word: ἔχω φαγεῖν
  choice: có thức ăn để ăn
  rationale: Phản ánh trực tiếp cấu trúc chỉ sự sở hữu một thứ để ăn, đồng thời vẫn rõ nghĩa trong tiếng Việt.
- source_word: ἣν
  choice: mà
  rationale: Đại từ quan hệ quy chiếu về “thức ăn”; “mà” là cách nối tự nhiên trong tiếng Việt.
- source_word: ὑμεῖς οὐκ οἴδατε
  choice: các con không biết
  rationale: Giữ động từ “biết” không thêm lời giải nghĩa như “không biết đến”; đại từ ὑμεῖς tạo đối lập với Ἐγώ và được thể hiện bằng “các con”.
theological_decisions:
- issue: Ý nghĩa ẩn dụ của “thức ăn”
  choice: Giữ từ cụ thể “thức ăn” trong câu chính mà không giải thích phép ẩn dụ.
  alternative: Diễn giải là “nguồn nuôi dưỡng” hoặc nói thẳng về việc làm theo ý muốn của Cha.
  rationale: Câu này cố ý duy trì sự nhập nhằng khiến các môn đồ hiểu theo nghĩa vật chất; câu kế tiếp mới làm rõ ý nghĩa. Giải thích ngay tại đây sẽ làm mất diễn tiến tu từ và căng thẳng của bản văn.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Ngài/Ta/các con” để biểu thị quan hệ giữa Đức Chúa Jêsus và các môn đồ; không thêm chú thích vì phương án “có thức ăn để ăn” đã truyền đạt trực tiếp nguyên văn và phép ẩn dụ được giữ nguyên.
