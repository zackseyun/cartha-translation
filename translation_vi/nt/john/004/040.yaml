source:
  edition: SBLGNT
  text: ὡς οὖν ἦλθον πρὸς αὐτὸν οἱ Σαμαρῖται, ἠρώτων αὐτὸν μεῖναι παρ’ αὐτοῖς· καὶ ἔμεινεν ἐκεῖ δύο ἡμέρας.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/040.yaml
  text: So when the Samaritans came to him[a], they asked him to stay with them, and he stayed there two days.
translation:
  language: vi
  text: Vì vậy, khi những người Sa-ma-ri đến gặp Ngài, họ xin[a] Ngài ở lại với họ, và Ngài đã ở đó hai ngày.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Động từ Hy Lạp ở thì chưa hoàn thành (“đang xin”) có thể gợi rằng họ xin nhiều lần hoặc tiếp tục khẩn khoản.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς οὖν
  choice: Vậy, khi
  rationale: Diễn đạt cả ý nối tiếp/suy luận của οὖν và ý thời gian của ὡς một cách tự nhiên trong tiếng Việt.
- source_word: ἦλθον πρὸς αὐτὸν
  choice: đến gặp Ngài
  rationale: Diễn đạt chuyển động hướng đến một người; “đến gặp” tự nhiên hơn cách dịch sát chữ “đến với” trong ngữ cảnh này.
- source_word: οἱ Σαμαρῖται
  choice: những người Sa-ma-ri
  rationale: Chỉ nhóm người theo sắc tộc/xuất thân địa phương một cách rõ ràng và trung tính.
- source_word: ἠρώτων
  choice: họ xin
  rationale: Động từ ở thì chưa hoàn thành có thể gợi hành động kéo dài hoặc lặp lại, nhưng tiếng Việt tự nhiên có thể dùng “xin”; sắc thái thể được ghi nhận trong chú thích thay vì cường điệu thành “cứ nài xin”.
- source_word: μεῖναι παρ’ αὐτοῖς
  choice: ở lại với họ
  rationale: “Ở lại” là cách diễn đạt tự nhiên của μένω trong ngữ cảnh lưu trú, còn παρά với tặng cách thể hiện việc ở cùng họ.
- source_word: καὶ ἔμεινεν ἐκεῖ
  choice: và Ngài đã ở đó
  rationale: Giữ rõ liên từ καί và trạng từ ἐκεῖ; “đã ở” diễn đạt hành động thực sự diễn ra mà không cần lặp “ở lại” một cách nặng nề.
- source_word: δύο ἡμέρας
  choice: hai ngày
  rationale: Cách dịch trực tiếp của đối cách chỉ khoảng thời gian.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” để chỉ Đức Chúa Jêsus theo lối xưng hô kính trọng quen thuộc trong tiếng Việt; không thêm sắc thái thần học ngoài đại từ Hy Lạp. Dấu phẩy và liên từ giữ nhịp kể liền mạch của câu gốc.
