id: JHN.4.6
reference: John 4:6
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἦν δὲ ἐκεῖ πηγὴ τοῦ Ἰακώβ. ὁ οὖν Ἰησοῦς κεκοπιακὼς ἐκ τῆς ὁδοιπορίας ἐκαθέζετο οὕτως ἐπὶ τῇ πηγῇ· ὥρα ἦν ⸀ὡς ἕκτη.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/006.yaml
  text: Jacob’s well was there[a]. So Jesus, wearied from the journey, was sitting there by the well[c][b]. It was about the sixth hour.
translation:
  language: vi
  text: Ở đó có giếng Gia-cốp[a]. Đức Giê-su, vì mệt mỏi do đi đường, đang ngồi[b] bên giếng. Lúc ấy vào khoảng giờ thứ sáu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “nguồn nước Gia-cốp”; từ Hy Lạp πηγή có thể chỉ một nguồn nước hoặc một cái giếng.
    reason: lexical_alternative
  - marker: b
    text: Trong tiếng Hy Lạp có từ οὕτως, nghĩa đen là “như vậy”; cụm này cũng có thể hàm ý “trong tình trạng ấy” hoặc “cứ thế”.
    reason: lexical_alternative
  - marker: c
    text: Nếu tính các giờ ban ngày theo lối Do Thái thông thường, đây là khoảng giữa trưa. Cũng có ý kiến cho rằng sách Giăng dùng một cách tính khác, theo đó giờ này có thể tương ứng khoảng sáu giờ chiều.
    reason: alternative_reading
lexical_decisions:
- source_word: πηγὴ τοῦ Ἰακώβ
  choice: giếng Gia-cốp
  rationale: πηγή có thể chỉ nguồn nước hoặc giếng; trong bối cảnh người ta đến lấy nước và theo cách gọi quen thuộc của địa điểm này, “giếng Gia-cốp” là cách diễn đạt tự nhiên nhất, đồng thời nghĩa “nguồn nước” được giữ trong chú thích.
- source_word: κεκοπιακὼς ἐκ τῆς ὁδοιπορίας
  choice: mệt mỏi do đi đường
  rationale: Phân từ hoàn thành κεκοπιακὼς diễn tả trạng thái mệt nhọc do sự gắng sức trước đó; ἐκ nêu nguyên nhân. Cách dịch này rõ ràng, tự nhiên và không thêm đại từ sở hữu vốn không có trong câu Hy Lạp.
- source_word: ἐκαθέζετο
  choice: ngồi
  rationale: Thì chưa hoàn thành mô tả tư thế hoặc hành động đang diễn ra. Tiếng Việt có thể diễn đạt tự nhiên bằng “ngồi” trong mạch kể mà không cần gượng ép thêm dấu hiệu thể.
- source_word: οὕτως
  choice: không diễn đạt riêng trong câu chính
  rationale: Sắc thái của οὕτως ở đây không chắc chắn, có thể là “như vậy”, “trong tình trạng ấy” hoặc “cứ thế”. Đưa một nghĩa cụ thể vào câu chính dễ giải quyết quá mức; chú thích bảo tồn các khả năng này.
- source_word: ἐπὶ τῇ πηγῇ
  choice: bên giếng
  rationale: ἐπί với tặng cách mang nghĩa vị trí; “bên giếng” là cách nói tự nhiên cho vị trí ngồi cạnh giếng.
- source_word: ὥρα ἦν ὡς ἕκτη
  choice: Lúc ấy vào khoảng giờ thứ sáu
  rationale: Giữ cách tính giờ của nguyên bản và dịch ὡς là “khoảng”, thay vì quyết định ngay giờ tương ứng theo đồng hồ hiện đại.
- source_word: δὲ / οὖν
  choice: Ở đó / Vì
  rationale: δὲ đánh dấu bước chuyển nhẹ trong lời kể nên không cần một từ nối riêng; οὖν ở đây nối tình trạng mệt mỏi với việc Chúa Giê-su ngồi bên giếng, được diễn đạt tự nhiên qua cấu trúc “Vì…”. Không thêm một từ mang nghĩa thời gian như “bấy giờ” vào đầu câu.
theological_decisions:
- issue: Cách hiểu “giờ thứ sáu”
  choice: Giữ nguyên “khoảng giờ thứ sáu” trong câu chính.
  alternative: Khoảng giữa trưa nếu tính giờ ban ngày theo lối Do Thái; khoảng sáu giờ chiều theo giả thuyết tính giờ kiểu La Mã.
  rationale: Nguyên bản không xác định hệ quy chiếu theo đồng hồ hiện đại. Giữ cách nói nguyên văn bảo tồn vấn đề niên đại học trong sách Giăng thay vì ngầm giải quyết một cách hiểu còn được tranh luận.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Đức Giê-su” theo lối gọi tôn kính phổ biến; giữ “giờ thứ sáu” để bảo tồn cách diễn đạt và tính mơ hồ của nguyên bản. Các tên riêng được viết theo dạng phiên âm quen thuộc trong Kinh Thánh tiếng Việt.
