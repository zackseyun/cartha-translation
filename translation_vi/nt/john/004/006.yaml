    rationale: Động từ ở thì chưa hoàn thành mô tả tình trạng/hành động đang diễn ra; «ngồi» có thể được hiểu như hành động hoàn tất. «Đang ngồi» phản ánh sát hơn mà vẫn tự nhiên.
  - severity: low
    issue: Vị trí neo chú thích cho οὕτως
    rationale: Chú thích [b] giải thích οὕτως, là từ bổ nghĩa cho việc ngồi, nên nên đặt ngay sau «đang ngồi» thay vì sau «giếng».
