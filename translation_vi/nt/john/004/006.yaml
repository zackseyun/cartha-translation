- from: Ở đó có giếng Gia-cốp[a]. Vì mệt mỏi do đi đường, Đức Giê-su ngồi bên giếng[b]. Lúc ấy vào khoảng giờ thứ sáu[c].
  to: Ở đó có giếng Gia-cốp[a]. Đức Giê-su, vì mệt mỏi do đi đường, đang ngồi[b] bên giếng. Lúc ấy vào khoảng giờ thứ sáu[c].
  rationale: Chỉ sửa để biểu đạt rõ hơn sắc thái chưa hoàn thành của ἐκαθέζετο và để neo chú thích οὕτως đúng vào cụm từ liên quan. Cách dịch vẫn giữ sự dè dặt cần thiết về sắc thái của οὕτως và về cách quy đổi «giờ thứ sáu».
