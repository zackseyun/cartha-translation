id: JHN.4.25
reference: John 4:25
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ἡ γυνή· Οἶδα ὅτι Μεσσίας ἔρχεται, ὁ λεγόμενος χριστός· ὅταν ἔλθῃ ἐκεῖνος, ἀναγγελεῖ ἡμῖν ⸀ἅπαντα.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/025.yaml
  text: The woman said to him[a], “I know that Messiah is coming” (the one called Messiah). “When he comes, he will tell us all things.”
translation:
  language: vi
  text: 'Người phụ nữ nói với ông: “Tôi biết Đấng Mê-si đang đến” (tức là Đấng được gọi là Đấng Christ).[a] “Khi vị ấy đến, vị ấy sẽ cho chúng ta biết mọi điều.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hy Lạp: “Đấng Mê-si, tức là Đấng được gọi là Christ.” “Mê-si” là danh hiệu gốc Sê-mít; “Christ” là danh hiệu Hy Lạp tương ứng, cả hai đều có nghĩa là “Đấng được xức dầu.”'
    reason: Giải thích sự phân biệt từ vựng và chức năng giải nghĩa giữa Μεσσίας và χριστός trong nguyên văn.
lexical_decisions:
- source_word: λέγει
  choice: nói
  rationale: Dùng thì kể chuyện tự nhiên trong tiếng Việt; không cần biểu thị riêng thì hiện tại lịch sử của tiếng Hy Lạp.
- source_word: γυνή
  choice: người phụ nữ
  rationale: Chỉ người phụ nữ Sa-ma-ri trong ngữ cảnh, không mang nghĩa “người vợ” ở đây.
- source_word: Οἶδα
  choice: tôi biết
  rationale: Cách diễn đạt trực tiếp, tự nhiên và đúng nghĩa nhận thức chắc chắn trong ngữ cảnh.
- source_word: Μεσσίας
  choice: Đấng Mê-si
  rationale: Giữ danh hiệu gốc Sê-mít dưới dạng quen thuộc trong tiếng Việt, đồng thời dùng “Đấng” để biểu thị đây là một danh hiệu chỉ nhân vật được mong đợi.
- source_word: ἔρχεται
  choice: đang đến
  rationale: Phản ánh sắc thái hiện tại mang ý nghĩa tương lai gần hoặc điều đang được mong đợi.
- source_word: ὁ λεγόμενος χριστός
  choice: tức là Đấng được gọi là Đấng Christ
  rationale: 'Giữ rõ cấu trúc giải thích của bản Hy Lạp: Μεσσίας là danh hiệu gốc Sê-mít, còn χριστός là từ Hy Lạp tương ứng. Không đồng nhất hai hình thức ngay trong bản dịch rồi làm mất chức năng giải thích.'
- source_word: ὅταν ἔλθῃ ἐκεῖνος
  choice: khi vị ấy đến
  rationale: Diễn đạt tự nhiên điều sẽ xảy ra trong tương lai và phần nào giữ sắc thái nhấn mạnh của đại từ ἐκεῖνος.
- source_word: ἀναγγελεῖ
  choice: sẽ cho … biết
  rationale: Trong ngữ cảnh tranh luận về sự thờ phượng, động từ mang nghĩa trình bày hoặc làm cho biết; cách dịch này rõ ràng và tự nhiên trong tiếng Việt.
- source_word: ἡμῖν
  choice: cho chúng ta
  rationale: Giữ đại từ số nhiều bao gồm người nói và cộng đồng mà bà đang nghĩ đến.
- source_word: ἅπαντα
  choice: mọi điều
  rationale: Truyền đạt sức khái quát của từ Hy Lạp bằng lối nói hiện đại, không quá cổ kính.
theological_decisions:
- issue: Mối quan hệ giữa Μεσσίας và χριστός trong lời giải thích
  choice: Dịch “Đấng Mê-si” và giữ “Đấng Christ” trong phần giải thích đặt trong ngoặc.
  alternative: Dịch cả hai là “Đấng Mê-si”, hoặc dịch χριστός là “Đấng được xức dầu”.
  rationale: Câu Hy Lạp cố ý đặt danh hiệu Sê-mít Μεσσίας bên cạnh từ Hy Lạp tương ứng χριστός. Giữ hai hình thức giúp người đọc thấy chức năng giải thích song ngữ của nguyên văn mà không biến chúng thành hai nhân vật hay hai danh hiệu có ý nghĩa khác nhau.
- issue: Đại từ chỉ Đấng Mê-si
  choice: Dùng “vị ấy” thay vì đại từ tôn kính mang tính tín điều.
  alternative: Dùng “Ngài” hoặc chỉ dùng “ông ấy”.
  rationale: “Vị ấy” vừa giữ được sự kính trọng và nét nhấn mạnh của ἐκεῖνος, vừa không áp đặt lối viết hoa hay cách xưng hô thần học lên lời của người phụ nữ Sa-ma-ri.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “nói với ông” để tránh đưa thêm danh xưng hoặc lối viết hoa tôn kính không có trong nguyên văn; dùng “vị ấy” cho Đấng Mê-si để giữ sự kính trọng tự nhiên. Dấu ngoặc thể hiện hợp lý lời giải thích của tác giả dành cho độc giả.
