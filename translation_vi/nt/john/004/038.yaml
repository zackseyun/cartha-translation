id: JHN.4.38
reference: John 4:38
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐγὼ ἀπέστειλα ὑμᾶς θερίζειν ὃ οὐχ ὑμεῖς κεκοπιάκατε· ἄλλοι κεκοπιάκασιν, καὶ ὑμεῖς εἰς τὸν κόπον αὐτῶν εἰσεληλύθατε.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/038.yaml
  text: I sent you to reap what you have not labored for[a]; others have labored[b], and you have entered into their labor.
translation:
  language: vi
  text: Chính tôi đã sai anh em đi gặt[a] những gì anh em không nhọc công làm nên; những người khác đã nhọc công, còn anh em đã bước vào công khó của họ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “thu hoạch”.
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn sát hơn: “đã đi vào công khó của họ”; cũng có thể hiểu là “được hưởng thành quả công khó của họ” hoặc “tham gia vào công việc của họ”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγὼ ἀπέστειλα ὑμᾶς
  choice: Chính tôi đã sai anh em
  rationale: Động từ aorist được diễn đạt bằng “đã sai”, chỉ hành động sai phái đã xảy ra. “Chính tôi” thể hiện mức nhấn của đại từ ἐγώ mà không diễn giải quá mức thành “ủy thác sứ mạng”.
- source_word: θερίζειν
  choice: đi gặt
  rationale: Giữ nguyên hình ảnh nông nghiệp đang chi phối văn cảnh; “đi” diễn đạt tự nhiên mục đích của hành động sai phái trong tiếng Việt.
- source_word: ὃ οὐχ ὑμεῖς κεκοπιάκατε
  choice: những gì anh em không nhọc công làm nên
  rationale: “Những gì” thể hiện đại từ quan hệ trung tính dùng như danh từ. “Nhọc công làm nên” truyền đạt công sức trước đó dẫn đến đối tượng được gặt, đồng thời tránh biến hình ảnh thành một lời giải thích thần học cụ thể.
- source_word: ἄλλοι κεκοπιάκασιν
  choice: những người khác đã nhọc công
  rationale: Giữ chủ thể “những người khác” ở nghĩa rộng như nguyên bản và lặp lại “nhọc công” để bảo toàn liên hệ từ vựng với mệnh đề trước.
- source_word: εἰς τὸν κόπον αὐτῶν εἰσεληλύθατε
  choice: anh em đã bước vào công khó của họ
  rationale: Theo sát cấu trúc “đã đi/bước vào công khó của họ”, giữ sắc thái kết quả hiện tại của thì hoàn thành và không tự ý đổi thành chỉ hưởng thành quả.
- source_word: κόπον
  choice: công khó
  rationale: “Công khó” diễn tả lao động vất vả và duy trì quan hệ ý nghĩa với động từ κοπιάω (“nhọc công”), tự nhiên hơn “lao khổ” trong câu này.
theological_decisions:
- issue: “Những người khác” là ai
  choice: Giữ cách nói khái quát “những người khác”.
  alternative: Xác định đó là các nhà tiên tri, Giăng Báp-tít, Đức Chúa Jêsus, hoặc một nhóm nhân chứng cụ thể.
  rationale: Câu Hy Lạp không xác định rõ họ là ai; bản dịch không thu hẹp sự mơ hồ chính đáng của nguyên bản.
- issue: Ý nghĩa của việc “bước vào công khó”
  choice: Giữ hình ảnh bước vào chính công khó của người khác.
  alternative: Diễn giải là hưởng thành quả lao động của họ hoặc cùng tham gia công việc của họ.
  rationale: Nguyên bản nói trực tiếp εἰς τὸν κόπον, “vào công khó”; các cách nói về thành quả hoặc sự chia sẻ đều có tính giải thích hơn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” cho đại từ số nhiều ὑμᾶς/ὑμεῖς; giữ hình ảnh gặt hái và sự mơ hồ về những người đã làm công trước đó.
