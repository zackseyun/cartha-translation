source:
  edition: SBLGNT
  text: οὐχ ὑμεῖς λέγετε ὅτι Ἔτι τετράμηνός ἐστιν καὶ ὁ θερισμὸς ἔρχεται; ἰδοὺ λέγω ὑμῖν, ἐπάρατε τοὺς ὀφθαλμοὺς ὑμῶν καὶ θεάσασθε τὰς χώρας ὅτι λευκαί εἰσιν πρὸς θερισμόν· ἤδη
base_translation:
  language: en
  yaml_path: translation/nt/john/004/035.yaml
  text: 'Do you not say[a], ‘There are still four months, and then the harvest comes’? Look, I tell you: lift up your eyes and see the fields, that they are white for harvest already.'
translation:
  language: vi
  text: 'Anh em chẳng nói rằng: “Còn bốn tháng nữa thì mùa gặt đến” sao? Này, tôi nói với anh em: Hãy ngước mắt lên và nhìn các cánh đồng; chúng đã trắng xóa, sẵn sàng cho mùa gặt rồi.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc có thể hiểu: “chúng đã chín để gặt.” Tiếng Hy Lạp nói theo nghĩa đen là “trắng,” giữ hình ảnh thị giác trên đồng ruộng đồng thời hàm ý đã đến lúc gặt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχ ὑμεῖς λέγετε
  choice: Chẳng phải chính anh em vẫn nói ... sao?
  rationale: Dùng dạng câu hỏi phủ định tự nhiên trong tiếng Việt; “chính anh em” thể hiện đại từ ὑμεῖς được nêu rõ để nhấn mạnh, còn “vẫn nói” phù hợp với một câu nói quen thuộc.
- source_word: Ἔτι τετράμηνός ἐστιν
  choice: Còn bốn tháng nữa
  rationale: Diễn đạt tự nhiên khoảng thời gian còn lại trước mùa gặt mà không bám máy móc vào cấu trúc tính từ số ít của tiếng Hy Lạp.
- source_word: ὁ θερισμὸς ἔρχεται
  choice: là đến mùa gặt
  rationale: Cách nói hiện đại, tự nhiên, giữ ý mùa gặt sẽ đến sau khoảng thời gian được nhắc tới.
- source_word: ἰδοὺ
  choice: Này
  rationale: Giữ chức năng thu hút sự chú ý của ἰδού bằng một từ trang trọng vừa phải, không cổ kính.
- source_word: ἐπάρατε τοὺς ὀφθαλμοὺς ὑμῶν
  choice: Hãy ngước mắt lên
  rationale: Giữ nguyên hình ảnh sinh động của thành ngữ Hy Lạp thay vì giản lược thành “hãy nhìn”.
- source_word: θεάσασθε
  choice: nhìn xem
  rationale: Thể hiện lời kêu gọi quan sát có chủ ý và kết hợp tự nhiên với “ngước mắt lên”.
- source_word: τὰς χώρας
  choice: các cánh đồng
  rationale: Trong ngữ cảnh mùa gặt, từ này chỉ những vùng đất canh tác, nên “các cánh đồng” rõ nghĩa hơn “các miền” hay “đất đai”.
- source_word: λευκαί εἰσιν
  choice: chúng đã trắng
  rationale: Giữ hình ảnh “trắng” của nguyên văn, không thay thẳng bằng cách giải nghĩa “đã chín”; “đã” đồng thời kết hợp tự nhiên với ἤδη ở cuối câu.
- source_word: πρὸς θερισμόν
  choice: cho mùa gặt
  rationale: Giữ phép ẩn dụ nông nghiệp và tránh đưa thẳng cách giải thích về con người vào chính văn.
- source_word: ἤδη
  choice: đã ... rồi
  rationale: Cấu trúc gián đoạn “đã ... rồi” là cách tự nhiên trong tiếng Việt để nhấn mạnh rằng tình trạng ấy đã hiện hữu, tương phản với việc còn chờ bốn tháng.
theological_decisions:
- issue: Có nên diễn giải mùa gặt ngay trong chính văn là việc thu nhận con người hay không
  choice: Giữ nguyên hình ảnh nông nghiệp về các cánh đồng và mùa gặt.
  alternative: Diễn ý thành “người ta đã sẵn sàng được quy tụ” hoặc một cách nói tương tự.
  rationale: Ngữ cảnh cho thấy lời nói mang nghĩa ẩn dụ về con người và sứ mạng, nhưng câu Hy Lạp vẫn dùng trọn vẹn hình ảnh mùa gặt. Bản dịch không nên giải quyết ẩn dụ thay cho người đọc.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Câu hỏi mở đầu mang sắc thái một lời nói quen thuộc; mệnh lệnh “ngước mắt lên và nhìn xem” giữ nhịp điệu và hình ảnh của nguyên văn. Dấu [a] được đặt ngay sau mệnh đề mà chú thích giải thích.
