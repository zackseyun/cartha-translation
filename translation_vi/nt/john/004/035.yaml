review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp giữ đúng cấu trúc và hình ảnh chính: câu hỏi phủ định, bốn tháng còn lại, lời kêu gọi ngước mắt, các cánh đồng, hình ảnh “trắng”, và tính khẩn trương của ἤδη. Tuy nhiên, “vẫn nói” không có đối ứng rõ trong οὐχ ὑμεῖς λέγετε và dễ chuyển nghĩa thành một hành động đang tiếp diễn; cần bỏ. Cụm “trắng cho mùa gặt” quá sát tiếng Anh/Hy Lạp và không tự nhiên trong tiếng Việt.'
  naturalness: Câu sửa dùng “Anh em chẳng nói rằng ... sao?” và “đã trắng xóa, sẵn sàng cho mùa gặt rồi” để giữ câu hỏi tu từ, hình ảnh thị giác, và sự sẵn sàng hướng đến việc gặt bằng tiếng Việt hiện đại tự nhiên. “Tôi nói với anh em” phản ánh λέγω ὑμῖν chính xác hơn và bớt sắc thái ra lệnh hơn “tôi bảo anh em.”
  terminology: Giữ “mùa gặt” và “các cánh đồng” phù hợp ngữ cảnh nông nghiệp và không diễn giải ẩn dụ thành con người hay công cuộc truyền giáo. “Trắng xóa” là cách diễn đạt tự nhiên của λευκαί, còn “sẵn sàng cho mùa gặt” chuyển đạt chức năng của πρὸς θερισμόν mà không thay hình ảnh bằng “chín” trong chính văn.
  issues:
  - severity: medium
    issue: “vẫn nói” thêm một sắc thái không được nguyên ngữ nêu rõ.
    rationale: Ἔτι (“còn/vẫn”) thuộc mệnh đề về bốn tháng còn lại, không bổ nghĩa cho λέγετε. Câu hỏi có thể nhắc một lời nói quen thuộc, nhưng “vẫn nói” khẳng định sự tiếp diễn không cần thiết.
  - severity: medium
    issue: “chúng đã trắng cho mùa gặt rồi” không tự nhiên trong tiếng Việt hiện đại.
    rationale: Cấu trúc “trắng cho” là lối ghép sát chữ, khó đọc. Cần một cách nối tự nhiên hơn mà vẫn giữ λευκαί là “trắng” và πρὸς θερισμόν là sự hướng tới mùa gặt.
  - severity: low
    issue: “tôi bảo anh em” có thể nghe như một mệnh lệnh hơn là lời tuyên bố dẫn nhập.
    rationale: λέγω ὑμῖν ở đây là “tôi nói với anh em/tôi bảo các anh”, nhưng “tôi nói với anh em” là tương ứng trực tiếp và trung tính hơn trong văn phong hiện đại.
