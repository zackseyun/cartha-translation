revisions:
- from: 'Chẳng phải chính anh em vẫn nói: “Còn bốn tháng nữa là đến mùa gặt” sao? Này, tôi bảo anh em: Hãy ngước mắt lên và nhìn xem các cánh đồng; chúng đã trắng cho mùa gặt rồi.[a]'
  to: 'Anh em chẳng nói rằng: “Còn bốn tháng nữa thì mùa gặt đến” sao? Này, tôi nói với anh em: Hãy ngước mắt lên và nhìn các cánh đồng; chúng đã trắng xóa, sẵn sàng cho mùa gặt rồi.[a]'
  rationale: Bỏ yếu tố “vẫn” được thêm vào, thay cụm từ không tự nhiên “trắng cho mùa gặt” bằng diễn đạt tiếng Việt thông suốt, và điều chỉnh động từ dẫn nhập cho sát λέγω ὑμῖν. Bản sửa vẫn giữ nguyên hình ảnh nông nghiệp, tính mơ hồ/ẩn dụ của câu, và neo chú thích ngay sau mệnh đề “trắng xóa ... mùa gặt rồi.”
  reviewer_model: gpt-5.6-terra
