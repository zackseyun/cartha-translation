revisions:
- from: Tổ phụ chúng tôi đã thờ phượng trên núi này,[a] còn các ông nói rằng Giê-ru-sa-lem là nơi người ta phải thờ phượng.[b]
  to: Tổ tiên chúng tôi[a] đã thờ phượng trên núi này, còn các ông nói rằng nơi người ta phải thờ phượng là tại Giê-ru-sa-lem.[b]
  rationale: Thay «Tổ phụ» bằng «Tổ tiên» để phù hợp cách dùng tiếng Việt hiện đại và phạm vi nghĩa cộng đồng-lịch sử của οἱ πατέρες; giữ «các tổ phụ» ở chú thích như một lựa chọn sát hình ảnh truyền thống hơn. Dời neo chú thích a về đúng cụm từ được chú giải. Điều chỉnh trật tự mệnh đề để biểu đạt minh bạch hơn «ở Giê-ru-sa-lem là nơi» mà không thêm ý độc tôn hay giải thích về người Sa-ma-ri/người Do Thái. Chú thích b vẫn giữ lựa chọn diễn đạt tính cần thiết của δεῖ.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T05:37:19Z'
review_pass:
  verdict: revise
  source_fidelity: Bản dịch truyền đạt đúng sự đối chiếu giữa «tổ tiên/chúng tôi» và «các ông», địa điểm ngọn núi, cùng tính tất yếu phiếm chỉ của προσκυνεῖν δεῖ. Tuy nhiên, «Tổ phụ» hẹp hơn và mang sắc thái Kinh Thánh cổ hơn οἱ πατέρες trong ngữ cảnh này; «tổ tiên» là cách tương đương tự nhiên, hiện đại và bao quát hơn. Cấu trúc «Giê-ru-sa-lem là nơi...» chấp nhận được, nhưng đảo thành «nơi ... là tại Giê-ru-sa-lem» phản ánh rõ hơn quan hệ định vị ἐν Ἱεροσολύμοις mà vẫn tự nhiên.
  naturalness: «Tổ tiên chúng tôi» phù hợp tiếng Việt hiện đại hơn «Tổ phụ chúng tôi». Cần dời chú thích thay thế về «tổ tiên/tổ phụ» đến ngay sau cụm từ mà nó giải thích; vị trí cũ sau «núi này» có thể khiến người đọc hiểu nhầm chú thích liên quan đến địa điểm.
  terminology: Giữ «thờ phượng» cho προσκυνέω là nhất quán và phù hợp văn cảnh. «Các ông» duy trì đối chiếu số nhiều mà không thêm tên các cộng đồng ngoài nguyên văn. Giữ «Giê-ru-sa-lem» theo lối phiên âm Kinh Thánh thông dụng.
