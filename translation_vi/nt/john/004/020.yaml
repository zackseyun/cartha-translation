  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οἱ πατέρες ἡμῶν ἐν τῷ ὄρει τούτῳ προσεκύνησαν· καὶ ὑμεῖς λέγετε ὅτι ἐν Ἱεροσολύμοις ἐστὶν ὁ τόπος ὅπου ⸂προσκυνεῖν δεῖ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/020.yaml
  text: Our fathers worshiped on this mountain[b][a], and you say that in Jerusalem is the place where one must worship.
translation:
  language: vi
  text: Tổ tiên chúng tôi[a] đã thờ phượng trên núi này, còn các ông nói rằng nơi người ta phải thờ phượng là tại Giê-ru-sa-lem.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Các tổ phụ chúng tôi.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “nơi cần phải thờ phượng.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ πατέρες ἡμῶν
  choice: Tổ phụ chúng tôi
  rationale: Giữ sắc thái về nguồn gốc cộng đồng và các thế hệ đi trước của cách nói Hy Lạp, đồng thời tự nhiên và trang trọng trong tiếng Việt. “Tổ tiên chúng tôi” là một cách diễn đạt hiện đại hơn nhưng ít phản ánh trực tiếp hình ảnh “các cha” trong nguyên văn.
- source_word: ἐν τῷ ὄρει τούτῳ
  choice: trên núi này
  rationale: “Trên núi này” là cách nói địa điểm tự nhiên trong tiếng Việt và truyền đạt đúng ý nghĩa định vị của ἐν trong văn cảnh.
- source_word: προσεκύνησαν
  choice: đã thờ phượng
  rationale: Trong cuộc bàn luận về địa điểm thờ phượng, προσκυνέω chỉ hành vi tôn kính mang tính tôn giáo; “thờ phượng” diễn đạt rõ mà không thu hẹp vào tư thế phủ phục.
- source_word: ὑμεῖς
  choice: các ông
  rationale: Đại từ Hy Lạp được nêu rõ và tạo thế đối chiếu với “chúng tôi”. Trong lời người phụ nữ nói với Chúa Giê-su với tư cách đại diện cho quan điểm của người Do Thái, “các ông” thể hiện số nhiều và sự tương phản mà không thêm tên nhóm sắc tộc vào câu.
- source_word: ἐν Ἱεροσολύμοις
  choice: Giê-ru-sa-lem
  rationale: Trong cấu trúc tiếng Việt “Giê-ru-sa-lem là nơi…”, quan hệ địa điểm được diễn đạt tự nhiên mà không cần dịch máy móc giới từ ἐν thành “tại”.
- source_word: ὁ τόπος
  choice: nơi
  rationale: “Nơi” truyền đạt danh từ địa điểm có tính xác định trong một cấu trúc tiếng Việt tự nhiên; không thêm “nơi duy nhất” hay “nơi thích hợp”, vì những cách ấy sẽ làm rõ hơn điều nguyên văn chỉ hàm ý.
- source_word: ὅπου
  choice: nơi …
  rationale: Mệnh đề quan hệ địa điểm được kết hợp tự nhiên vào cấu trúc “là nơi người ta phải…”, thay vì lặp “nơi mà” một cách nặng nề.
- source_word: προσκυνεῖν δεῖ
  choice: người ta phải thờ phượng
  rationale: “Người ta” giữ tính phiếm chỉ, còn “phải” diễn đạt sức bắt buộc hoặc cần thiết của δεῖ mà không biến câu thành mệnh lệnh dành cho một cá nhân cụ thể.
- source_word: καὶ
  choice: còn
  rationale: καί nối hai vế, nhưng ngữ cảnh và các đại từ tạo thế đối chiếu. “Còn” là liên từ tiếng Việt tự nhiên, vừa nối vừa làm rõ sự tương phản sẵn có mà không mạnh như “nhưng”.
theological_decisions:
- issue: Có nên nói rõ đây là sự đối lập giữa người Sa-ma-ri và người Do Thái hay không
  choice: Chỉ giữ sự đối lập qua “tổ phụ chúng tôi” và “các ông nói”
  alternative: “Tổ phụ người Sa-ma-ri chúng tôi… còn người Do Thái các ông nói…”
  rationale: Nguyên văn tạo sự tương phản bằng đại từ và văn cảnh, không trực tiếp gọi tên hai cộng đồng trong câu này. Thêm tên các nhóm sẽ giải thích vượt quá lời văn.
- issue: Cách diễn đạt tính tất yếu phiếm chỉ trong προσκυνεῖν δεῖ
  choice: “nơi người ta phải thờ phượng”
  alternative: “nơi cần phải thờ phượng” hoặc “nơi mọi người phải thờ phượng”
  rationale: “Người ta phải” giữ được cả tính phiếm chỉ lẫn sức quy phạm của cấu trúc. “Mọi người” có thể thêm ý bao quát không được nêu rõ; “cần phải” tự nhiên nhưng làm mờ chủ thể phiếm chỉ.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Câu giữ sự đối chiếu cộng đồng trong nguyên văn nhưng không thêm “người Sa-ma-ri” hay “người Do Thái”. “Giê-ru-sa-lem” dùng lối phiên âm Kinh Thánh quen thuộc; “thờ phượng” được dùng nhất quán cho προσκυνέω.
