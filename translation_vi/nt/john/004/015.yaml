source:
  edition: SBLGNT
  text: λέγει πρὸς αὐτὸν ἡ γυνή· Κύριε, δός μοι τοῦτο τὸ ὕδωρ, ἵνα μὴ διψῶ μηδὲ ⸀διέρχωμαι ἐνθάδε ἀντλεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/015.yaml
  text: The woman said to him[a], “Lord, give me this water, so that I may not be thirsty or come here to draw.”
translation:
  language: vi
  text: 'Người phụ nữ nói với ngài: “Lạy Chúa[a], xin cho tôi nước ấy, để tôi không khát và không phải đến đây múc nước nữa.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Thưa ngài, xin cho tôi nước ấy…”'
    reason: Bảo lưu nghĩa khả dĩ của κύριος như một cách xưng hô kính trọng, thay vì một lời tuyên xưng rõ ràng.
lexical_decisions:
- source_word: λέγει
  choice: nói
  rationale: Tiếng Hy Lạp dùng hiện tại lịch sử; tiếng Việt kể chuyện tự nhiên có thể dùng “nói” mà không cần đánh dấu thì quá khứ.
- source_word: γυνή
  choice: người phụ nữ
  rationale: Trong ngữ cảnh, từ này chỉ người phụ nữ Sa-ma-ri, không mang nghĩa “vợ”.
- source_word: Κύριε
  choice: Lạy Chúa
  rationale: Giữ nghĩa chủ đạo “Chúa” và khả năng hàm chứa ý nghĩa sâu hơn trong sách Giăng; lời chú thích bảo lưu khả năng đây chỉ là cách xưng hô kính trọng.
- source_word: δός μοι
  choice: xin cho tôi
  rationale: Diễn đạt mệnh lệnh trực tiếp theo cách xưng hô lịch sự, tự nhiên trong tiếng Việt.
- source_word: τοῦτο τὸ ὕδωρ
  choice: nước ấy
  rationale: Đại từ chỉ định quy chiếu đến thứ nước Đức Chúa Jêsus vừa nói; không thêm tính từ “sống” vì câu Hy Lạp này không lặp lại từ đó.
- source_word: ἵνα μὴ διψῶ
  choice: để tôi không còn khát
  rationale: Diễn đạt tự nhiên mục đích mong muốn của người phụ nữ; “không còn” phù hợp với thể hiện tại và ngữ cảnh về việc chấm dứt cơn khát tái diễn.
- source_word: μηδὲ διέρχωμαι ἐνθάδε
  choice: và cũng không phải đến đây … nữa
  rationale: Bảo toàn lực phủ định bổ sung của μηδέ và sắc thái hành động thường xuyên của động từ hiện tại trong lối nói Việt tự nhiên.
- source_word: ἀντλεῖν
  choice: múc nước
  rationale: Trong ngữ cảnh bên giếng, động từ có nghĩa múc nước; nêu rõ “nước” là cách diễn đạt tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Cách dịch κύριος trong lời người phụ nữ Sa-ma-ri
  choice: Lạy Chúa
  alternative: Thưa ngài
  rationale: κύριος có thể là lời tôn xưng “Chúa” hoặc cách xưng hô kính trọng “ngài”. Bản chính giữ “Chúa” để bảo toàn khả năng cộng hưởng thần học trong sách Giăng, còn chú thích giữ nghĩa giao tiếp trực tiếp có thể có.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. Dùng “ngài” trong lời dẫn để chỉ Đức Chúa Jêsus và “Lạy Chúa” trong lời thoại. Cụm “không phải … nữa” diễn đạt tự nhiên mong muốn khỏi phải tiếp tục đến giếng múc nước.
