    rationale: Nguyên văn chỉ có “Jesus”; tước hiệu này không được biểu thị trong câu và nên tránh thêm vào bản văn chính.
  - severity: low
    issue: Dạng tên “Jêsus” không phải chính tả hiện đại phổ biến.
    rationale: “Giê-su” là dạng chuẩn và dễ hiểu hơn trong tiếng Việt hiện đại.
  - severity: low
    issue: “Con trai ông đang sống” gượng trong ngữ cảnh.
    rationale: “Còn sống” là lời xác nhận tự nhiên hơn về tình trạng sống, đồng thời không chuyển ζῇ sang thì tương lai.
  - severity: low
    issue: “Cả gia đình ông cũng vậy” diễn đạt gián tiếp phần cuối câu.
    rationale: Có thể nêu trực tiếp rằng ông và cả nhà đều tin, vẫn giữ phạm vi không được nói rõ của πιστεύω.
