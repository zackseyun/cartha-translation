source:
  edition: SBLGNT
  text: ἔγνω οὖν ὁ πατὴρ ⸀ὅτι ἐκείνῃ τῇ ὥρᾳ ἐν ᾗ εἶπεν αὐτῷ ὁ ⸀Ἰησοῦς· Ὁ υἱός σου ζῇ, καὶ ἐπίστευσεν αὐτὸς καὶ ἡ οἰκία αὐτοῦ ὅλη.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/053.yaml
  text: So the father knew that it was at that hour when Jesus said to him[a], “Your son lives,” and he himself believed[b], and his whole household.
translation:
  language: vi
  text: 'Vì vậy, người cha nhận ra rằng vào giờ ấy, Giê-su đã nói với ông: “Con trai ông còn sống[a].” Ông ấy và cả nhà ông đều tin[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Con trai ông đang sống.”'
    reason: lexical_alternative
  - marker: b
    text: Động từ “tin” có thể chỉ việc ông tin lời Giê-su đã nói, hoặc việc ông tiến đến một đức tin đầy đủ hơn nơi Ngài; tiếng Hy Lạp không nói rõ phạm vi.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔγνω
  choice: nhận ra
  rationale: Động từ ở đây diễn tả việc người cha nhận biết sự trùng khớp giữa giờ con mình bình phục và giờ Đức Chúa Jêsus phán; “nhận ra” tự nhiên và thể hiện rõ khoảnh khắc nhận biết.
- source_word: οὖν
  choice: Vì vậy
  rationale: Nối câu này như kết luận rút ra từ lời báo và thời điểm được các đầy tớ cho biết ở câu trước.
- source_word: ὁ πατὴρ
  choice: người cha
  rationale: Theo sát cách câu chuyện chuyển trọng tâm sang vai trò gia đình của viên quan.
- source_word: ἐκείνῃ τῇ ὥρᾳ ἐν ᾗ
  choice: chính vào giờ ấy
  rationale: Diễn đạt tự nhiên quan hệ thời gian và sự trùng khớp cụ thể; “chính” làm rõ giá trị xác định của cấu trúc mà không đổi nội dung.
- source_word: Ὁ υἱός σου ζῇ
  choice: Con trai ông đang sống
  rationale: Giữ nghĩa hiện tại của ζῇ như lời xác nhận tình trạng sống; “đang sống” tự nhiên trong tiếng Việt và không biến lời này thành thì tương lai.
- source_word: ἐπίστευσεν
  choice: tin
  rationale: Giữ phạm vi bổ ngữ ngầm như nguyên văn, không quyết định rằng đây chỉ là tin lời chữa lành hay là đức tin đầy đủ hơn nơi Đức Chúa Jêsus.
- source_word: αὐτὸς καὶ ἡ οἰκία αὐτοῦ ὅλη
  choice: Ông tin, và cả gia đình ông cũng vậy
  rationale: Truyền đạt việc chính ông tin cùng toàn thể gia đình; cách diễn đạt tiếng Việt tự nhiên vẫn phân biệt phản ứng cá nhân của ông với gia đình.
theological_decisions:
- issue: Phạm vi ý nghĩa của việc người cha “tin”
  choice: Giữ động từ đơn giản là “tin”, không nêu rõ bổ ngữ.
  alternative: Diễn giải là “tin lời Đức Chúa Jêsus” hoặc “tin Đức Chúa Jêsus cách trọn vẹn hơn”.
  rationale: Nguyên văn không nói rõ phạm vi của πιστεύω. Văn cảnh có thể gợi cả việc tin lời phán lẫn một bước tiến sâu hơn trong đức tin, nên bản dịch không âm thầm chọn một cách hiểu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Jêsus” theo lối gọi Tin Lành Việt ngữ quen thuộc; “cả gia đình” diễn đạt οἰκία theo nghĩa hộ gia đình chứ không phải căn nhà.
