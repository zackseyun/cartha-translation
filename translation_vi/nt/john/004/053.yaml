revisions:
- from: 'Vì vậy, người cha nhận ra rằng chính vào giờ ấy, Đức Chúa Jêsus đã nói với ông: “Con trai ông đang sống[a].” Ông tin[b], và cả gia đình ông cũng vậy.'
  to: 'Vì vậy, người cha nhận ra rằng vào giờ ấy, Giê-su đã nói với ông: “Con trai ông còn sống[a].” Ông ấy và cả nhà ông đều tin[b].'
  rationale: Bản sửa loại bỏ tước hiệu không có trong nguồn, chuẩn hóa tên riêng thành “Giê-su”, dùng lối nói tự nhiên “còn sống”, và diễn đạt rõ rằng người cha cùng cả nhà đều tin. Chú thích b giữ nguyên tính mơ hồ có chủ ý của πιστεύω, không áp đặt cách hiểu thần học nào.
