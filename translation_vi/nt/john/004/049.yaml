source:
  edition: SBLGNT
  text: λέγει πρὸς αὐτὸν ὁ βασιλικός· Κύριε, κατάβηθι πρὶν ἀποθανεῖν τὸ παιδίον μου.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/049.yaml
  text: The royal official said to him[a], “Lord, come down before my child dies.”
translation:
  language: vi
  text: 'Viên quan hoàng gia nói với Ngài: “Lạy Chúa[a], xin xuống trước khi con tôi chết.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “thưa ngài.” Từ Hy Lạp κύριε là lời xưng hô kính trọng, đồng thời cũng có thể có nghĩa là “Chúa.”
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ βασιλικός
  choice: viên quan hoàng gia
  rationale: Từ này được dùng như danh từ, chỉ một người có liên hệ với vua hoặc triều đình. Cách dịch này giữ được mối liên hệ hoàng gia mà không hàm ý người ấy thuộc tầng lớp quý tộc.
- source_word: Κύριε
  choice: Lạy Chúa
  rationale: κύριε vừa có thể là lời xưng hô kính trọng tương đương “thưa ngài,” vừa có thể mang nghĩa đầy đủ là “Chúa.” “Lạy Chúa” giữ được chiều sâu khả dĩ trong sách Giăng; nghĩa xưng hô lịch sự được nêu ở chú thích.
- source_word: κατάβηθι
  choice: xin xuống
  rationale: Mệnh lệnh cách của καταβαίνω có nghĩa đi hoặc xuống. “Xin xuống” giữ hướng địa hình từ Ca-na xuống Ca-bê-na-um và phù hợp với lời khẩn cầu trực tiếp.
- source_word: πρὶν ἀποθανεῖν
  choice: trước khi ... chết
  rationale: πρίν đi với động từ nguyên mẫu diễn tả thời điểm trước một biến cố; tiếng Việt tự nhiên cần nêu rõ chủ thể theo ngữ cảnh.
- source_word: τὸ παιδίον μου
  choice: con tôi
  rationale: παιδίον chỉ một đứa trẻ hoặc con nhỏ. “Con tôi” tự nhiên trong tiếng Việt và không xác định giới tính quá mức so với từ Hy Lạp ở câu này.
- source_word: λέγει πρὸς αὐτόν
  choice: nói với Ngài
  rationale: Thì hiện tại lịch sử λέγει được chuyển thành lối kể tự nhiên trong tiếng Việt; đại từ “Ngài” biểu thị sự kính trọng đối với Chúa Giê-su trong lời tường thuật.
theological_decisions:
- issue: Cách dịch κύριος khi dùng để xưng hô với Chúa Giê-su
  choice: Lạy Chúa
  alternative: Thưa ngài
  rationale: Cách gọi này trong sách Giăng có thể vừa là lời kính trọng thông thường vừa gợi nhận thức sâu hơn về căn tính của Chúa Giê-su. Bản dịch chính giữ “Chúa” để không làm mất tầng nghĩa thần học, còn chú thích bảo tồn khả năng hiểu là lời xưng hô lịch sự.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Viên quan hoàng gia” rõ nghĩa hơn “nhà quý tộc”; “xin xuống” truyền đạt tính khẩn thiết mà vẫn giữ sắc thái địa hình. Dấu chú thích [a] được đặt ngay sau từ cần giải thích.
