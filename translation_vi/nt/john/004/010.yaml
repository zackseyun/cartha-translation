id: JHN.4.10
reference: John 4:10
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῇ· Εἰ ᾔδεις τὴν δωρεὰν τοῦ θεοῦ καὶ τίς ἐστιν ὁ λέγων σοι· Δός μοι πεῖν, σὺ ἂν ᾔτησας αὐτὸν καὶ ἔδωκεν ἄν σοι ὕδωρ ζῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/010.yaml
  text: Jesus answered and said to her[a], “If you knew the gift of God, and who it is who says to you, ‘Give me a drink,’ you would have asked him, and he would have given you living water.”
translation:
  language: vi
  text: 'Giê-su trả lời bà: “Nếu bà biết món quà của Đức Chúa Trời và biết người đang nói với bà: ‘Cho tôi uống,’ là ai, thì hẳn bà đã xin người ấy, và người ấy đã cho bà nước sống[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “nước chảy” hoặc “nước nguồn”; cụm từ này có thể chỉ nước đang chảy, nhưng “nước sống” giữ được hai tầng nghĩa trong lời Giê-su tại đây.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῇ
  choice: Đức Chúa Jêsus trả lời bà
  rationale: “Trả lời bà” diễn đạt tự nhiên công thức kể chuyện “đáp và nói với bà”; tiếng Việt không cần giữ nguyên hai động từ đồng nghĩa nếu làm câu nặng nề.
- source_word: τὴν δωρεὰν τοῦ θεοῦ
  choice: món quà của Đức Chúa Trời
  rationale: “Món quà” là cách nói phổ thông, tự nhiên cho δωρεά, còn “của Đức Chúa Trời” giữ quan hệ sở hữu/nguồn ban trong cấu trúc sở hữu cách mà không giải nghĩa quá mức.
- source_word: τίς ἐστιν ὁ λέγων σοι
  choice: người đang nói với bà ... là ai
  rationale: Cấu trúc này giữ trọng tâm nhận diện “là ai” và thể hiện phân từ hiện tại λέγων bằng “đang nói”, đồng thời vẫn tự nhiên trong tiếng Việt.
- source_word: Δός μοι πεῖν
  choice: Cho tôi uống
  rationale: Đây là cách nói ngắn gọn, tự nhiên, sát với mệnh lệnh kèm động từ nguyên mẫu của tiếng Hy Lạp; không thêm đối tượng không có trong nguyên văn.
- source_word: ᾔτησας ... ἔδωκεν ἄν
  choice: hẳn bà đã xin ... người ấy hẳn đã cho
  rationale: “Hẳn ... đã” truyền đạt kết quả giả định trái với thực tế trong quá khứ, đồng thời tránh khiến câu bị hiểu như một sự việc thực sự đã xảy ra.
- source_word: αὐτόν
  choice: người ấy
  rationale: Đại từ này chỉ người đang nói với bà. “Người ấy” giữ cách quy chiếu trung tính trong chính lời Đức Chúa Jêsus, không áp đặt trước sự nhận biết của người phụ nữ.
- source_word: ὕδωρ ζῶν
  choice: nước sống
  rationale: 'Cách dịch sát này giữ được lối nói hai nghĩa: có thể gợi nước chảy theo nghĩa thông thường nhưng cũng mở ra ý nghĩa sâu hơn trong mạch văn Giăng.'
theological_decisions:
- issue: Giữ đồng thời nghĩa vật chất và hàm ý sâu hơn của ὕδωρ ζῶν
  choice: nước sống
  alternative: nước chảy; nước nguồn
  rationale: Dịch thẳng thành “nước chảy” sẽ dễ thu hẹp lời nói vào nghĩa vật chất. “Nước sống” giữ hình ảnh khác thường và sự căng thẳng có chủ ý giữa cách hiểu trước mắt của người phụ nữ với điều Đức Chúa Jêsus muốn bày tỏ.
- issue: Cách gọi người nói trong mệnh đề giả định
  choice: người ấy
  alternative: Ngài
  rationale: “Người ấy” phản ánh αὐτός mà không đưa sự tôn xưng của người kể chuyện vào lời giả định trước khi người phụ nữ nhận biết người đang nói với mình là ai.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. Dùng “bà” phù hợp với người phụ nữ trưởng thành trong cuộc đối thoại; dùng “Đức Chúa Jêsus” và “Đức Chúa Trời” theo lối gọi Tin Lành Việt ngữ quen thuộc. Câu được sắp xếp lại theo cú pháp tiếng Việt để cụm “là ai” rõ nghĩa mà không làm mất sự nhấn mạnh của nguyên văn.
