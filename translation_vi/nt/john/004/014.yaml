id: JHN.4.14
reference: John 4:14
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὃς δ’ ἂν πίῃ ἐκ τοῦ ὕδατος οὗ ἐγὼ δώσω αὐτῷ, οὐ μὴ ⸀διψήσει εἰς τὸν αἰῶνα, ἀλλὰ τὸ ὕδωρ ὃ δώσω αὐτῷ γενήσεται ἐν αὐτῷ πηγὴ ὕδατος ἁλλομένου εἰς ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/014.yaml
  text: But whoever drinks from the water that I will give him will never thirst forever; rather, the water that I will give him will become in him a spring of water welling up to eternal life.
translation:
  language: vi
  text: Nhưng ai uống nước tôi sẽ ban cho người ấy thì sẽ chẳng bao giờ khát nữa; trái lại, nước tôi sẽ ban cho người ấy sẽ trở thành trong người ấy một mạch nước vọt lên đến sự sống đời đời.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐ μὴ διψήσει εἰς τὸν αἰῶνα
  choice: đời đời sẽ không bao giờ khát nữa
  rationale: Giữ cả sắc thái phủ định nhấn mạnh của οὐ μή lẫn thành ngữ thời gian εἰς τὸν αἰῶνα; cách diễn đạt tự nhiên trong tiếng Việt và không làm mất ý 'mãi mãi'.
- source_word: πηγὴ ὕδατος
  choice: một mạch nước
  rationale: πηγή chỉ nguồn hay mạch nước phát sinh và chảy ra, phù hợp hình ảnh một nguồn nước ở bên trong người uống.
- source_word: ἁλλομένου
  choice: tuôn trào
  rationale: Động từ gợi chuyển động bật lên, nhảy vọt; 'tuôn trào' truyền đạt hình ảnh sinh động của nước mà vẫn tự nhiên.
- source_word: εἰς ζωὴν αἰώνιον
  choice: đem lại sự sống đời đời
  rationale: εἰς diễn tả hướng tới hoặc kết quả. 'Đem lại' giúp câu tiếng Việt rõ nghĩa mà không khẳng định quá mức cơ chế của hình ảnh.
theological_decisions:
- issue: Quan hệ của mạch nước với sự sống đời đời
  choice: tuôn trào, đem lại sự sống đời đời
  alternative: tuôn trào đến sự sống đời đời
  rationale: Bản dịch chính diễn đạt tự nhiên ý hướng đích/kết quả của εἰς, đồng thời tránh giải thích mạch nước như một thực thể thần học cụ thể mà câu này không trực tiếp định danh.
- issue: Mức độ tuyệt đối của lời hứa không còn khát
  choice: đời đời sẽ không bao giờ khát nữa
  alternative: sẽ chẳng bao giờ khát
  rationale: Giữ nguyên sức nhấn mạnh của οὐ μή và cụm εἰς τὸν αἰῶνα, không giảm lời hứa thành sự thỏa mãn tạm thời hay chỉ thuộc thể chất.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng 'người ấy' để tránh mặc định giới tính trong đại từ αὐτῷ; lặp lại 'tôi ban cho người ấy' theo cấu trúc Hy Lạp nhằm duy trì trọng tâm của lời Chúa Giê-su.
