  verdict: revise
  source_fidelity: Bản nháp giữ đúng quan hệ giải thích của γάρ, mục đích của ἵνα, và nội dung mua thức ăn. Tuy nhiên, “đã vào thành” chưa biểu đạt rõ động từ ἀπεληλύθεισαν (“đã đi/đã rời đi”), vốn nhấn mạnh việc các môn đệ đã vắng mặt khỏi nơi Chúa Giê-su đang ở.
  naturalness: “Các môn đệ của Người đã đi vào thành để mua thức ăn” là cách diễn đạt hiện đại, tự nhiên, đồng thời vẫn phù hợp văn phong Kinh Thánh trang trọng vừa phải.
  terminology: “Môn đệ” là thuật ngữ hiện đại và thông dụng hơn “môn đồ” trong tiếng Việt chuẩn đương đại. “Người” ở đây là đại từ quy chiếu về Chúa Giê-su; không thêm diễn giải thần học.
  issues:
  - severity: medium
    issue: Động từ “đã vào” làm mờ sắc thái rời đi/đi khỏi của ἀπεληλύθεισαν.
    rationale: ἀπεληλύθεισαν là quá khứ hoàn thành của ἀπέρχομαι, diễn tả các môn đệ đã đi khỏi trước thời điểm tường thuật. Thêm “đi” bảo toàn ý này mà vẫn tự nhiên.
  - severity: low
    issue: “Môn đồ” kém hiện đại hơn “môn đệ”.
    rationale: Cả hai đều có thể hiểu được, nhưng “môn đệ” phù hợp hơn với mục tiêu tiếng Việt chuẩn hiện đại.
  revised_text: Vì các môn đệ của Người đã đi vào thành để mua thức ăn.[a][b]
