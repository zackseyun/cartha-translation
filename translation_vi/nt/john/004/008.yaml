  text: οἱ γὰρ μαθηταὶ αὐτοῦ ἀπεληλύθεισαν εἰς τὴν πόλιν, ἵνα τροφὰς ἀγοράσωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/008.yaml
  text: For his disciples had gone away into the city to buy food[a][b].
translation:
  language: vi
  text: Vì các môn đệ của Người đã đi vào thành để mua thức ăn.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “đến thành”; πόλις có thể chỉ một thành hoặc, theo văn cảnh, một thị trấn.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “mua lương thực.”
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: Vì
  rationale: Liên từ này giải thích cho lời kể ngay trước đó; “Vì” giữ rõ quan hệ giải thích trong tiếng Việt.
- source_word: μαθηταὶ αὐτοῦ
  choice: các môn đồ của Ngài
  rationale: “Môn đồ” là cách gọi quen thuộc và chính xác trong văn mạch Giăng; “của Ngài” diễn đạt đại từ sở hữu, quy chiếu về Chúa Giê-su.
- source_word: ἀπεληλύθεισαν
  choice: đã vào
  rationale: Thì quá khứ hoàn thành cho biết việc này xảy ra trước cảnh đang được thuật lại. Trong tiếng Việt, “đã” thể hiện quan hệ thời gian ấy; “vào” kết hợp tự nhiên với đích đến là thành và hàm ý họ đã rời chỗ đang đứng.
- source_word: εἰς τὴν πόλιν
  choice: vào thành
  rationale: εἰς với đối cách chỉ chuyển động hướng tới hoặc đi vào một nơi. “Vào thành” vừa sát nghĩa vừa tự nhiên; tùy quy mô khu dân cư, πόλις cũng có thể được hiểu là “thị trấn”.
- source_word: ἵνα
  choice: để
  rationale: ἵνα giới thiệu mục đích; “để” diễn đạt trực tiếp và tự nhiên chức năng này.
- source_word: τροφὰς
  choice: thức ăn
  rationale: Danh từ số nhiều ở đây chỉ đồ ăn hay lương thực nói chung; “thức ăn” là cách nói thông dụng, tự nhiên.
- source_word: ἀγοράσωσιν
  choice: mua
  rationale: Động từ chỉ hành động dự định sau ἵνα; “mua” là tương đương tiếng Việt rõ ràng và hiện đại.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Giữ liên từ giải thích ở đầu câu và dấu mốc thời gian “đã”; dùng “môn đồ” theo thuật ngữ Kinh Thánh quen thuộc. Các dấu chú thích [a], [b] đều được đặt trong chính văn.
