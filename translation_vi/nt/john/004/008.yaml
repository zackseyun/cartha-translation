- from: Vì các môn đồ của Ngài đã vào thành để mua thức ăn.[a][b]
  to: Vì các môn đệ của Người đã đi vào thành để mua thức ăn.[a][b]
  rationale: Sửa “môn đồ” thành “môn đệ” để dùng thuật ngữ hiện đại hơn, và sửa “đã vào thành” thành “đã đi vào thành” để phản ánh rõ hơn động từ ἀπεληλύθεισαν. Các chú thích vẫn được neo đúng sau câu và bảo tồn các phương án từ vựng hợp lý.
