  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ἡ γυνή· Κύριε, θεωρῶ ὅτι προφήτης εἶ σύ.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/019.yaml
  text: The woman said to him[a], “Lord, I see that you are a prophet.”
translation:
  language: vi
  text: 'Người phụ nữ nói với Ngài: “Thưa Chúa,[a] tôi nhận thấy Ngài là một nhà tiên tri.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Thưa ông.” Từ Hy Lạp κύριε vừa có thể là cách xưng hô kính trọng, vừa có thể mang nghĩa “Chúa.”'
    reason: alternative_reading
lexical_decisions:
- source_word: λέγει
  choice: nói
  rationale: Động từ hiện tại lịch sử trong lối kể chuyện Hy Lạp được chuyển tự nhiên sang tiếng Việt là “nói”; tiếng Việt không bắt buộc đánh dấu thì quá khứ.
- source_word: αὐτῷ
  choice: với Ngài
  rationale: Đại từ ở cách dữ thể chỉ người tiếp nhận lời nói; “với Ngài” là cách diễn đạt tự nhiên và kính trọng trong ngữ cảnh.
- source_word: ἡ γυνή
  choice: người phụ nữ
  rationale: Chỉ người phụ nữ Sa-ma-ri trong mạch truyện, không mang nghĩa “người vợ” ở đây.
- source_word: Κύριε
  choice: Thưa Chúa
  rationale: Giữ cách dịch mặc định của κύριος là “Chúa”, đồng thời dùng “thưa” để thể hiện đây là lời xưng hô kính trọng. Trong ngữ cảnh, từ này cũng có thể chỉ có nghĩa “thưa ông”; phương án ấy được ghi ở chú thích.
- source_word: θεωρῶ
  choice: tôi nhận thấy
  rationale: Diễn tả sự nhận định dựa trên điều Đức Chúa Giê-su vừa bày tỏ; “nhận thấy” tự nhiên và rõ hơn nghĩa quan sát đơn thuần của “thấy”.
- source_word: ὅτι
  choice: rằng
  rationale: Dẫn vào nội dung điều người phụ nữ nhận thấy; trong câu trực tiếp này, tiếng Việt có thể lược “rằng” để lời nói tự nhiên hơn.
- source_word: προφήτης
  choice: một nhà tiên tri
  rationale: Danh từ vị ngữ không có mạo từ xác định, nên diễn đạt là “một nhà tiên tri”, không đồng nhất rõ ràng với “Đấng Tiên Tri”.
- source_word: σύ
  choice: Ngài
  rationale: Đại từ được nêu rõ trong tiếng Hy Lạp; “Ngài” duy trì cách xưng hô kính trọng với Đức Chúa Giê-su mà không cần thêm dấu nhấn nhân tạo.
theological_decisions:
- issue: Cách dịch κύριος khi người phụ nữ xưng hô với Đức Chúa Giê-su
  choice: Thưa Chúa
  alternative: Thưa ông
  rationale: Ngữ cảnh cho phép hiểu đây chỉ là lời xưng hô lễ phép, chưa nhất thiết là một lời tuyên xưng đầy đủ về căn tính của Đức Chúa Giê-su. Bản chính giữ “Chúa”, còn chú thích bảo tồn nghĩa thay thế để không giải quyết thay sự mơ hồ của nguyên văn.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “người phụ nữ” phù hợp mạch kể; “Thưa Chúa” và “Ngài” giữ sắc thái kính trọng. Dấu chú thích [a] được đặt ngay sau cụm từ có ý nghĩa chưa xác định hoàn toàn.
