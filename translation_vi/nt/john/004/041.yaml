lexical_decisions:
- source_word: πολλῷ πλείους
  choice: còn nhiều người hơn nữa
  rationale: Cụm so sánh được πολλῷ nhấn mạnh, diễn tả số người tin tăng lên đáng kể so với câu trước. Cách dịch này tự nhiên trong tiếng Việt và giữ rõ ý so sánh.
- source_word: ἐπίστευσαν
  choice: tin
  rationale: Động từ aorist được dịch trực tiếp là “tin”, không thêm sắc thái khởi đầu hay một tân ngữ không được nêu rõ trong câu.
- source_word: διὰ
  choice: vì
  rationale: 'διά đi với đối cách ở đây chỉ nguyên nhân: họ tin vì điều Ngài nói.'
- source_word: λόγον
  choice: lời
  rationale: “Lời” vừa phù hợp với phát ngôn của Chúa Giê-su trong ngữ cảnh, vừa giữ được cách dùng λόγος đặc trưng của sách Giăng; “sứ điệp” là một khả năng diễn đạt theo nghĩa.
- source_word: αὐτοῦ
  choice: của Ngài
  rationale: Đại từ chỉ Chúa Giê-su trong ngữ cảnh gần. “Ngài” giữ văn phong trang trọng, tự nhiên của bản dịch Kinh Thánh tiếng Việt.
theological_decisions:
- issue: Cách dịch πιστεύω trong trình thuật có ý nghĩa cứu rỗi
  choice: tin
  alternative: tin Ngài; đặt đức tin nơi Ngài
  rationale: Nguyên văn chỉ nói “tin” mà không có tân ngữ trong câu này. Bản dịch không thêm một công thức thần học đầy đủ hơn văn bản, đồng thời để ngữ cảnh Giăng cho thấy đối tượng của niềm tin là Chúa Giê-su.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. “Còn nhiều người hơn nữa” giữ sắc thái so sánh được nhấn mạnh của πολλῷ πλείους; không cần chú thích riêng vì ý này đã được thể hiện trực tiếp trong chính văn.
