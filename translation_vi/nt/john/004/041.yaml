review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp giữ đúng các thành tố chính: liên từ, ý so sánh tăng cường của πολλῷ πλείους, động từ “tin” không thêm tân ngữ, và nguyên nhân “vì lời Ngài”. Tuy nhiên, “còn nhiều người hơn nữa” chưa truyền đạt rõ mức nhấn mạnh của πολλῷ (“hơn rất nhiều/hơn hẳn”), và trật tự với “tin” thiếu tự nhiên trong văn xuôi hiện đại.'
  naturalness: “Và nhiều người hơn rất nhiều đã tin vì lời Ngài” là cách diễn đạt tự nhiên, trang trọng vừa phải, và rõ quan hệ với số người ở câu trước. Việc thêm “đã” là phù hợp cho hành động hoàn tất trong mạch trần thuật, không áp đặt một sắc thái thần học.
  terminology: Giữ “tin” cho ἐπίστευσαν, không thêm “tin Ngài” hay “đặt đức tin nơi Ngài”. Giữ “lời Ngài” cho τὸν λόγον αὐτοῦ; cách viết này vừa tự nhiên vừa bảo tồn âm hưởng Giăng. “Sứ điệp” thích hợp làm phương án chú thích.
  issues:
  - severity: medium
    issue: Cụm “còn nhiều người hơn nữa” chưa biểu đạt minh bạch cường độ của πολλῷ πλείους.
    rationale: Dative πολλῷ tăng cường so sánh πλείους; “hơn rất nhiều” truyền đạt trực tiếp hơn ý “many/far more”.
  - severity: low
    issue: Trật tự “nhiều người hơn nữa tin” hơi gượng trong tiếng Việt hiện đại.
    rationale: Đặt “đã tin” sau cụm chủ ngữ giúp câu trôi chảy và phản ánh hành động đã xảy ra trong trình thuật.
  revised_text: Và nhiều người hơn rất nhiều đã tin vì lời Ngài.[a]
