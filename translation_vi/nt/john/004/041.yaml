  yaml_path: translation/nt/john/004/041.yaml
  text: And many more believed because of his word[b][a],
translation:
  language: vi
  text: Và nhiều người hơn rất nhiều đã tin vì lời Ngài.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
