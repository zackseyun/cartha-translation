source:
  edition: SBLGNT
  text: Ὁ οὖν Πιλᾶτος ἀκούσας ⸂τῶν λόγων τούτων⸃ ἤγαγεν ἔξω τὸν Ἰησοῦν, καὶ ἐκάθισεν ⸀ἐπὶ βήματος εἰς τόπον λεγόμενον Λιθόστρωτον, Ἑβραϊστὶ δὲ Γαββαθα.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/013.yaml
  text: So when Pilate heard these words[a], he brought Jesus outside and sat down on the judgment seat at a place called the Stone Pavement, and in Hebrew[b], Gabbatha.
translation:
  language: vi
  text: Vì vậy, khi Phi-lát nghe những lời ấy[a], ông đưa Đức Giê-su ra ngoài rồi ngồi trên ghế xét xử tại một nơi gọi là Nền Đá, theo tiếng Hê-bơ-rơ gọi là Ga-ba-tha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “ông đưa Đức Giê-su ra ngoài và đặt Người ngồi trên ghế xét xử.” Động từ Hy Lạp có thể được hiểu theo nghĩa ngoại động, dù cách hiểu có khả năng hơn ở đây là chính Phi-lát ngồi trên ghế xét xử.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: Vì vậy
  rationale: Diễn tả sự tiếp nối có tính hệ quả từ lời đối đáp ngay trước đó, đồng thời vẫn tự nhiên trong văn kể chuyện tiếng Việt.
- source_word: ἀκούσας τῶν λόγων τούτων
  choice: khi Phi-lát nghe những lời ấy
  rationale: Chuyển phân từ bất định quá khứ thành mệnh đề thời gian; “những lời ấy” chỉ các lời vừa được nói.
- source_word: ἤγαγεν ἔξω τὸν Ἰησοῦν
  choice: ông đưa Đức Giê-su ra ngoài
  rationale: Giữ rõ chuyển động ra phía ngoài mà không hàm ý quá cụ thể về cách dẫn đi.
- source_word: ἐκάθισεν ἐπὶ βήματος
  choice: ngồi trên ghế xét xử
  rationale: Theo cách hiểu tự nhiên hơn rằng Phi-lát là người ngồi; βῆμα trong bối cảnh này là chỗ ngồi chính thức để xét xử. Tính khả dĩ của cách hiểu ngoại động được giữ trong chú thích.
- source_word: εἰς τόπον λεγόμενον Λιθόστρωτον
  choice: tại một nơi gọi là Nền Đá
  rationale: εἰς được diễn đạt theo vị trí kết quả sau hành động đi ra và ngồi xuống; Λιθόστρωτον được dịch theo nghĩa của tên gọi thay vì phiên âm.
- source_word: Ἑβραϊστὶ δὲ Γαββαθα
  choice: tiếng Hê-bơ-rơ là Ga-ba-tha
  rationale: Giữ nguyên cách gọi ngôn ngữ của bản Hy Lạp; δέ mang tính nối nhẹ nên không cần dịch thành một từ đối lập. Tên địa danh được phiên âm dễ đọc trong tiếng Việt.
theological_decisions:
- issue: Chủ thể và cách dùng của ἐκάθισεν
  choice: Phi-lát ngồi trên ghế xét xử
  alternative: Phi-lát đặt Đức Giê-su ngồi trên ghế xét xử
  rationale: Dạng Hy Lạp có thể được hiểu là nội động hoặc ngoại động. Bối cảnh tư pháp và cú pháp thông thường nghiêng về việc Phi-lát ngồi vào vị trí xét xử, nhưng cách hiểu kia là khả dĩ và có ý nghĩa diễn giải nên được nêu trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Giê-su” và “Phi-lát” theo lối phiên âm quen thuộc; “ghế xét xử” truyền đạt chức năng pháp lý của βῆμα rõ hơn “tòa” hoặc từ chuyên môn khó hiểu. Mọi dấu chú thích đều xuất hiện trong chính văn.
