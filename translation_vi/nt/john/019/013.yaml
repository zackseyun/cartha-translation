  to: Vì vậy, khi Phi-lát nghe những lời ấy[a], ông đưa Đức Giê-su ra ngoài rồi ngồi trên ghế xét xử tại một nơi gọi là Nền Đá, theo tiếng Hê-bơ-rơ gọi là Ga-ba-tha.
