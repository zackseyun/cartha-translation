  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἶτα λέγει τῷ μαθητῇ· ⸀Ἴδε ἡ μήτηρ σου. καὶ ἀπ’ ἐκείνης τῆς ὥρας ἔλαβεν ὁ μαθητὴς αὐτὴν εἰς τὰ ἴδια.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/027.yaml
  text: Then he said to the disciple, “Look, your mother.” And from that hour the disciple took her into his own home.
translation:
  language: vi
  text: 'Rồi Ngài nói với môn đồ: “Đây là mẹ của con.” Kể từ giờ đó, môn đồ ấy đón bà về nhà mình.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἴδε
  choice: Đây là
  rationale: Trong lời giới thiệu một người, ἴδε tự nhiên mang nghĩa “đây là”; cách dịch này trang trọng, rõ ràng và tránh lối cổ “hãy xem” vốn kém tự nhiên trong tiếng Việt hiện đại.
- source_word: ὥρας
  choice: giờ
  rationale: Giữ hình ảnh thời gian cụ thể của nguyên ngữ trong cụm “kể từ giờ đó”, thay vì diễn giải rộng thành “từ lúc ấy”.
- source_word: ἔλαβεν ... αὐτὴν
  choice: đón bà
  rationale: Trong ngữ cảnh chăm sóc và đưa về nơi ở của mình, “đón bà” diễn đạt tự nhiên động từ λαμβάνω mà không thêm ý nhận làm mẹ theo nghĩa pháp lý.
- source_word: εἰς τὰ ἴδια
  choice: về nhà mình
  rationale: Thành ngữ chỉ nơi chốn/tài sản thuộc về người môn đồ; “về nhà mình” phù hợp ngữ cảnh, dù nguyên ngữ không có danh từ “nhà” minh thị.
theological_decisions:
- issue: Quan hệ được thiết lập qua câu “Đây là mẹ của con”
  choice: Giữ nguyên lời tuyên bố ngắn gọn, không giải thích bản chất quan hệ.
  alternative: “Hãy nhận bà làm mẹ của con.”
  rationale: Nguyên ngữ chỉ nói Ἴδε ἡ μήτηρ σου, không có động từ “nhận làm”; thêm động từ ấy sẽ giải quyết một hàm ý mà bản văn để mở.
- issue: Đối tượng được người môn đồ đón nhận
  choice: Dùng đại từ kính trọng “bà”.
  alternative: “mẹ” hoặc “người”.
  rationale: αὐτήν là đại từ giống cái chỉ mẹ Đức Chúa Jêsus; “bà” tự nhiên trong tiếng Việt và không thêm quan hệ mẫu tử vào mệnh đề kể chuyện.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Viết hoa “Ngài” theo quy ước tôn kính phổ biến khi chỉ Đức Chúa Jêsus; dùng “môn đồ” để giữ thuật ngữ quen thuộc của văn phong Kinh Thánh tiếng Việt. Không cần chú thích vì các nét nghĩa chính có thể truyền đạt trực tiếp.
