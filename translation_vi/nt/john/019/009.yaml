    issue: «Đức Chúa Jê-su» thêm tước hiệu «Chúa».
    rationale: Nguyên văn chỉ có τῷ Ἰησοῦ và ὁ δὲ Ἰησοῦς, nghĩa là «Giê-su», không có κύριος («Chúa») hay tước hiệu tương đương. Việc thêm tước hiệu làm bản dịch vượt quá văn bản nguồn.
