  text: καὶ εἰσῆλθεν εἰς τὸ πραιτώριον πάλιν καὶ λέγει τῷ Ἰησοῦ· Πόθεν εἶ σύ; ὁ δὲ Ἰησοῦς ἀπόκρισιν οὐκ ἔδωκεν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/009.yaml
  text: And he entered the governor’s headquarters again and said to Jesus[a], “Where are you from?” But Jesus gave him no answer.
translation:
  language: vi
  text: 'Ông lại đi vào dinh tổng đốc[a] và hỏi Giê-su: “Ông từ đâu đến?” Nhưng Giê-su không trả lời ông.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “phủ tổng đốc”; từ Hy Lạp chỉ nơi ở hoặc trụ sở chính thức của tổng đốc La Mã.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσῆλθεν
  choice: đi vào
  rationale: Động từ chỉ sự di chuyển vào bên trong một nơi; “đi vào” tự nhiên trong văn kể chuyện tiếng Việt.
- source_word: πραιτώριον
  choice: dinh tổng đốc
  rationale: Chỉ nơi ở hoặc trụ sở chính thức của tổng đốc La Mã; “dinh tổng đốc” rõ nghĩa, trang trọng và phù hợp bối cảnh.
- source_word: πάλιν
  choice: lại
  rationale: Diễn đạt hành động được lặp lại một cách tự nhiên trong tiếng Việt.
- source_word: λέγει
  choice: hỏi
  rationale: Dù nghĩa cơ bản là “nói”, lời theo sau là một câu hỏi trực tiếp, nên “hỏi” truyền đạt đúng chức năng phát ngôn và tự nhiên hơn trong tiếng Việt.
- source_word: Πόθεν εἶ σύ;
  choice: Ông từ đâu đến?
  rationale: Giữ câu hỏi về nguồn gốc hoặc xuất xứ, đồng thời dùng cách nói tự nhiên trong tiếng Việt.
- source_word: ἀπόκρισιν οὐκ ἔδωκεν αὐτῷ
  choice: không trả lời ông
  rationale: Chuyển thành ngữ Hy Lạp theo cách tự nhiên trong tiếng Việt mà vẫn giữ rõ sự im lặng của Đức Chúa Jê-su trước người hỏi.
theological_decisions:
- issue: Chủ ngữ hàm ẩn của εἰσῆλθεν và λέγει
  choice: Dùng đại từ “Ông”, theo ngữ cảnh chỉ Phi-lát, nhưng không thêm tên riêng.
  alternative: Ghi rõ “Phi-lát” trong câu chính.
  rationale: Bản Hy Lạp để chủ ngữ hàm ẩn; ngữ cảnh xác định đó là Phi-lát. Đại từ giữ sát cấu trúc nguồn mà vẫn dễ hiểu khi đọc trong mạch văn.
- issue: Ý nghĩa câu hỏi Πόθεν εἶ σύ;
  choice: Giữ câu hỏi mở “Ông từ đâu đến?”
  alternative: Diễn giải thành câu hỏi về quê quán hoặc nguồn gốc thiên thượng.
  rationale: Câu Hy Lạp có thể gợi nhiều tầng ý nghĩa về nguồn gốc; bản dịch không thu hẹp câu hỏi vào một cách giải thích thần học cụ thể.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Jê-su” cho Ἰησοῦς; lời Phi-lát dùng đại từ “ông” để thể hiện lối xưng hô trực tiếp mà không áp đặt sắc thái kính trọng quá mức. Dấu chú thích được đặt ngay sau cụm từ mà chú thích giải nghĩa.
