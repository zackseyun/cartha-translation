reference: John 19:10
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: λέγει οὖν αὐτῷ ὁ Πιλᾶτος· Ἐμοὶ οὐ λαλεῖς; οὐκ οἶδας ὅτι ἐξουσίαν ἔχω ⸂ἀπολῦσαί σε καὶ ἐξουσίαν ἔχω σταυρῶσαί⸃ σε;
base_translation:
  language: en
  yaml_path: translation/nt/john/019/010.yaml
  text: So Pilate said to him[a], “Will you not speak to me? Do you not know that I have authority to release you and authority to crucify you?”
translation:
  language: vi
  text: 'Vì thế, Phi-lát nói với Ngài: “Ông không nói với ta sao? Ông không biết rằng ta có thẩm quyền[a] thả ông và có thẩm quyền đóng đinh ông vào thập tự giá sao?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “quyền lực” hoặc “quyền”; từ Hy Lạp exousia có thể chỉ thẩm quyền, quyền hạn hoặc quyền lực. Ở đây chọn “thẩm quyền” vì Phi-lát đang nói trong bối cảnh xét xử và cai trị.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει οὖν αὐτῷ ὁ Πιλᾶτος
  choice: Vì thế, Phi-lát nói với Ngài
  rationale: οὖν nối lời này với sự im lặng của Đức Chúa Giê-su ở câu trước, vừa có sắc thái suy diễn vừa đẩy trình thuật tiến tới. “Vì thế” giữ được mối liên hệ ấy. αὐτῷ được thể hiện bằng “với Ngài”; cách xưng gọi trong lời trần thuật tôn kính Đức Chúa Giê-su nhưng không thay đổi thái độ của Phi-lát trong lời thoại.
- source_word: Ἐμοὶ οὐ λαλεῖς;
  choice: Ông không nói với ta sao?
  rationale: Ἐμοὶ được đặt đầu câu để nhấn mạnh sự xúc phạm mà Phi-lát cảm nhận. “Với ta” giữ trọng tâm ấy; câu hỏi đuôi “sao?” truyền đạt giọng sửng sốt và quở trách của câu hỏi tu từ.
- source_word: οὐκ οἶδας ὅτι
  choice: Ông không biết rằng
  rationale: Dịch trực tiếp ý nghĩa thông dụng của οἶδα và giữ nguyên hình thức câu hỏi mang tính chất trách cứ.
- source_word: ἐξουσίαν ἔχω
  choice: ta có thẩm quyền
  rationale: Trong bối cảnh xét xử và cai trị, “thẩm quyền” diễn đạt khía cạnh quyền hạn của ἐξουσία chính xác hơn “quyền lực”, đồng thời không xác nhận lời tự nhận của Phi-lát là tuyệt đối hay chính đáng.
- source_word: ἀπολῦσαί σε
  choice: thả ông
  rationale: ἀπολύω trong ngữ cảnh pháp lý có nghĩa là phóng thích. “Thả ông” tự nhiên trong lời nói trực tiếp và không hàm ý quá mức rằng Phi-lát tuyên trắng án.
- source_word: καὶ ἐξουσίαν ἔχω σταυρῶσαί σε
  choice: và có thẩm quyền đóng đinh ông vào thập tự giá
  rationale: Giữ lại lần lặp “thẩm quyền” như nguyên văn để nhấn mạnh sự tương phản giữa hai kết quả. “Đóng đinh ... vào thập tự giá” diễn đạt rõ phương thức hành hình của σταυρόω; không chuyển thành thể sai khiến dù việc thi hành có thể do binh lính thực hiện.
theological_decisions:
- issue: Bản chất của ἐξουσία mà Phi-lát tự nhận
  choice: Dịch là “thẩm quyền” nhưng chỉ trình bày lời tự nhận của Phi-lát, không xác nhận ông có quyền tự chủ hay tối hậu.
  alternative: “quyền lực” hoặc “quyền”
  rationale: “Thẩm quyền” phù hợp bối cảnh pháp lý–cai trị và để nguyên sự căng thẳng thần học sẽ được lời đáp ở câu kế tiếp làm sáng tỏ.
- issue: Cách xưng hô giữa Phi-lát và Đức Chúa Giê-su
  choice: Trong lời trần thuật dùng “Ngài”; trong lời Phi-lát dùng cặp “ta–ông”.
  alternative: Dùng “ông” ở cả lời trần thuật, hoặc dùng cặp xưng hô trung tính hơn trong lời thoại.
  rationale: Sự phân biệt này tạo lời trần thuật trang trọng, dễ hiểu cho độc giả Việt Nam, đồng thời bảo toàn giọng bề trên và thái độ gây sức ép của Phi-lát mà không gán cho ông sự tôn kính không có trong văn cảnh.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Tên Πιλᾶτος được phiên âm theo lối quen dùng là “Phi-lát”. Câu thoại dùng “ta–ông” để truyền đạt địa vị cai trị và giọng uy hiếp của Phi-lát; không dùng lối cổ “ngươi”. Dấu [a] đặt ngay sau từ được chú thích.
