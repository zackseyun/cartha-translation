source:
  edition: SBLGNT
  text: ὅτε οὖν ἔλαβεν τὸ ὄξος ὁ Ἰησοῦς εἶπεν· Τετέλεσται, καὶ κλίνας τὴν κεφαλὴν παρέδωκεν τὸ πνεῦμα.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/030.yaml
  text: So when Jesus had received the sour wine[a], he said, “It is finished,” and bowing his head[c][b], he gave up his spirit.
translation:
  language: vi
  text: 'Vậy, sau khi nhận rượu chua[a], Đức Giê-su nói: “Đã hoàn tất[b]!” Rồi Ngài cúi đầu và trao linh hồn mình[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “giấm” hoặc “giấm rượu.” Từ Hy Lạp ὄξος chỉ rượu chua.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “Đã xong” hoặc “Đã được hoàn tất.”
    reason: lexical_alternative
  - marker: c
    text: Cũng có thể dịch là “Ngài tắt thở.” Nguyên văn Hy Lạp nói sát hơn là “Ngài trao linh hồn.”
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτε οὖν
  choice: Vậy, sau khi
  rationale: “Vậy” giữ chức năng nối tiếp/suy luận của οὖν, còn “sau khi” diễn đạt tự nhiên quan hệ thời gian của ὅτε với hành động đã xảy ra trước lời nói.
- source_word: ἔλαβεν
  choice: nhận
  rationale: Trong ngữ cảnh rượu chua được đưa đến cho Chúa Giê-su, “nhận” tự nhiên và chính xác hơn “lấy”.
- source_word: τὸ ὄξος
  choice: rượu chua
  rationale: ὄξος chỉ loại rượu đã chua hoặc giấm rượu; “rượu chua” rõ nghĩa đối với độc giả hiện đại và không gợi sai rằng đây chỉ là giấm ăn.
- source_word: Τετέλεσται
  choice: Đã hoàn tất
  rationale: Thì hoàn thành diễn tả việc đã được đưa đến chỗ trọn vẹn với kết quả còn hiệu lực. Cách dịch không thêm một chủ thể hay đối tượng mà nguyên văn không nêu.
- source_word: κλίνας τὴν κεφαλήν
  choice: cúi đầu
  rationale: Diễn đạt tự nhiên phân từ chỉ hành động xảy ra trước động từ chính.
- source_word: παρέδωκεν τὸ πνεῦμα
  choice: trao linh hồn mình
  rationale: Giữ hình ảnh cụ thể của nguyên văn thay vì giản lược thành “chết” hay “tắt thở”; đại từ “mình” là bổ sung cần thiết theo cách nói tự nhiên của tiếng Việt.
theological_decisions:
- issue: Τετέλεσται không nêu rõ điều gì đã hoàn tất.
  choice: Đã hoàn tất
  alternative: Mọi sự đã hoàn tất
  rationale: Không thêm “mọi sự,” nhờ đó giữ nguyên sự cô đọng và độ mở về điều được hoàn tất.
- issue: παρέδωκεν τὸ πνεῦμα có thể được hiểu như thành ngữ chỉ cái chết hoặc như lời diễn tả việc Chúa Giê-su chủ động trao linh hồn.
  choice: trao linh hồn mình
  alternative: tắt thở
  rationale: Cách dịch chính giữ sắc thái chủ động và chiều kích tinh thần của câu Hy Lạp mà không khai triển thành một kết luận giáo lý vượt quá bản văn.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. Câu nói “Đã hoàn tất!” được giữ ngắn gọn như nguyên văn; “trao linh hồn mình” trang trọng nhưng vẫn rõ nghĩa, đồng thời tránh làm mất sắc thái chủ động của động từ.
