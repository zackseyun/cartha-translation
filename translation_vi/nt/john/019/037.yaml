  yaml_path: translation/nt/john/019/037.yaml
  text: And again another Scripture says[a], “They will look on the one whom they pierced.”
translation:
  language: vi
  text: 'Và một lời Kinh Thánh khác lại nói[a]: “Họ sẽ nhìn về người mà họ đã đâm.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Họ sẽ nhìn vào người mà họ đã đâm.” Cấu trúc Hy Lạp có thể được hiểu là nhìn vào hoặc hướng nhìn về một người; lời này gợi lại Xa-cha-ri 12:10.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν
  choice: Lại
  rationale: Đánh dấu việc đưa ra thêm một lời chứng từ Kinh Thánh; cách nối câu này tự nhiên và sát nghĩa trong tiếng Việt.
- source_word: ἑτέρα γραφή
  choice: một lời Kinh Thánh khác
  rationale: γραφή chỉ Kinh Thánh hoặc một lời được chép trong Kinh Thánh, còn ἑτέρα giới thiệu thêm một lời chứng khác. Cách dịch này rõ nghĩa và tự nhiên hơn việc nhân cách hóa toàn bộ Kinh Thánh.
- source_word: λέγει
  choice: nói
  rationale: Giữ thì hiện tại của công thức trích dẫn Kinh Thánh và diễn đạt tự nhiên trong tiếng Việt.
- source_word: Ὄψονται
  choice: họ sẽ nhìn
  rationale: Thì tương lai của ὁράω trong ngữ cảnh này diễn tả hành động nhìn có hướng đến một đối tượng, không chỉ đơn thuần là trông thấy.
- source_word: εἰς ὃν
  choice: vào người mà
  rationale: εἰς sau động từ chỉ sự nhìn diễn tả hướng nhìn đến một người. “Vào người mà” giữ được nét nghĩa này mà không thêm một tước hiệu không có trong nguyên văn.
- source_word: ἐξεκέντησαν
  choice: họ đã đâm
  rationale: Diễn tả hành động đâm xuyên đã xảy ra, phù hợp cả với ngữ cảnh đóng đinh lẫn tiếng vọng của Xa-cha-ri 12:10.
theological_decisions:
- issue: Diễn đạt lời ám chỉ Xa-cha-ri 12:10 mà vẫn giữ trọng tâm Cơ Đốc học của Giăng, không đưa thêm cách xưng hô từ bản Hê-bơ-rơ hoặc Bảy Mươi vào câu này
  choice: Họ sẽ nhìn vào người mà họ đã đâm
  alternative: Họ sẽ hướng nhìn về người mà họ đã đâm
  rationale: Bản dịch lấy chính câu Hy Lạp của Giăng làm chuẩn. “Người mà” giữ nguyên cấu trúc quan hệ chỉ một nhân vật và để ngữ cảnh nhận diện người bị đâm là Đức Giê-su, thay vì thêm “Đấng” hoặc một đại từ ngôi thứ nhất vốn không xuất hiện trong câu Hy Lạp này.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “người mà” thay vì viết hoa “Đấng” để không thêm sắc thái giải nghĩa vào đại từ quan hệ Hy Lạp; căn tính của người bị đâm vẫn được xác định rõ bởi ngữ cảnh.
