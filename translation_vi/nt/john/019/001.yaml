- from: Bấy giờ, Phi-lát bắt Đức Giê-su và đánh đòn Người.[a]
  to: Bấy giờ, Phi-lát đem Giê-su đi đánh roi.[a]
  rationale: Thay “bắt” bằng “đem ... đi” để không thêm ý bắt giữ, thay “đánh đòn” bằng “đánh roi” để phản ánh μαστιγόω, và bỏ tước hiệu không có trong nguyên ngữ. Chú thích bảo lưu cách hiểu hợp lệ về hành động qua thuộc cấp, thay vì buộc bản chính phải quyết định chi tiết lịch sử này.
