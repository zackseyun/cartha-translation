review_pass:
  verdict: revise
  source_fidelity: Bản nháp giữ đúng trình tự của Τότε οὖν ... καὶ và nhận đúng Phi-lát là chủ ngữ ngữ pháp. Tuy nhiên, “bắt” thường chỉ hành vi bắt giữ/khống chế và mạnh hơn ἔλαβεν (“đem, đưa, nhận lấy”) trong câu này. “Đánh đòn” có thể chỉ nhiều hình thức phạt đòn, trong khi μαστιγόω nói cụ thể đến việc đánh bằng roi/scourge. Tước hiệu “Đức” không hiện diện trong τὸν Ἰησοῦν và không cần thiết để dịch tên riêng ở đây.
  naturalness: 'Câu chỉnh sửa dùng cách nói hiện đại, trang trọng và gọn: “đem ... đi đánh roi” là cách diễn đạt tự nhiên trong ngữ cảnh một viên chức ra thi hành hình phạt. Cách này không khẳng định Phi-lát tự tay thực hiện hay sai thuộc cấp làm.'
  terminology: Dùng “Giê-su” tương ứng trực tiếp với Ἰησοῦν, không thêm tước hiệu. “Đánh roi” phản ánh chính xác hơn μαστιγόω mà vẫn tránh sắc thái cổ của “đánh đòn bằng roi/đánh đập”. “Phi-lát” là dạng tên riêng quen dùng và nhất quán.
  issues:
  - severity: medium
    issue: “bắt” dịch ἔλαβεν quá mạnh và có thể gợi một vụ bắt giữ mới.
    rationale: λαμβάνω có nghĩa cơ bản là “lấy/đem/đưa”; trong mạch này Giê-su đã bị giam giữ. “Bắt” thêm một sắc thái khống chế hoặc bắt giữ không được động từ này tự nó xác định.
  - severity: medium
    issue: “đánh đòn” chưa nêu được phương thức đánh bằng roi của ἐμαστίγωσεν.
    rationale: μαστιγόω là đánh bằng roi/scourge. “Đánh roi” là tương đương cụ thể và tự nhiên hơn trong tiếng Việt hiện đại.
  - severity: low
    issue: “Đức” thêm yếu tố tôn xưng không có trong tên Ἰησοῦν.
    rationale: Câu Hy Lạp chỉ dùng tên riêng. Bỏ tước hiệu giúp bản dịch bám sát nguồn mà không làm thay đổi sự tôn trọng của văn cảnh.
  revised_text: Bấy giờ, Phi-lát đem Giê-su đi đánh roi.[a]
