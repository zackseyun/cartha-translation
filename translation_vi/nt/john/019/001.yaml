  yaml_path: translation/nt/john/019/001.yaml
  text: Then Pilate took Jesus and flogged him[a].
translation:
  language: vi
  text: Bấy giờ, Phi-lát đem Giê-su đi đánh roi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc, diễn đạt rõ tác nhân được ủy quyền: “Bấy giờ, Phi-lát cho đem Giê-su đi đánh roi.”'
    reason: Bản Hy Lạp đặt Phi-lát làm chủ ngữ của cả hai động từ nhưng không nói rõ ông tự tay thi hành hay thực hiện qua thuộc cấp.
lexical_decisions:
- source_word: Τότε οὖν
  choice: Bấy giờ
  rationale: Diễn đạt tự nhiên bước chuyển tiếp theo thời gian và mạch kể chuyện; sắc thái suy diễn nhẹ của οὖν được hàm chứa trong dòng tường thuật thay vì dịch cứng thành “vì vậy”.
- source_word: ἔλαβεν
  choice: bắt
  rationale: Trong ngữ cảnh giam giữ và xử phạt, “bắt” tự nhiên hơn “lấy” nhưng không mạnh quá mức như “tóm lấy”; vẫn để ngỏ việc Phi-lát trực tiếp hành động hay hành động qua thuộc cấp.
- source_word: ὁ Πιλᾶτος
  choice: Phi-lát
  rationale: Cách phiên âm tên riêng quen thuộc trong tiếng Việt; mạo từ Hy Lạp không cần biểu đạt.
- source_word: τὸν Ἰησοῦν
  choice: Đức Giê-su
  rationale: Cách gọi trang trọng, quen thuộc và dễ hiểu trong văn phong Kinh Thánh tiếng Việt.
- source_word: ἐμαστίγωσεν
  choice: đánh đòn Người
  rationale: “Đánh đòn” diễn đạt rõ việc dùng roi để trừng phạt, tự nhiên và trang trọng hơn “quất roi”; “Người” tránh lặp tên và duy trì văn phong tôn kính.
theological_decisions:
- issue: Tác nhân trực tiếp hay được ủy quyền trong ἔλαβεν ... ἐμαστίγωσεν
  choice: 'Giữ Phi-lát làm chủ ngữ ngữ pháp của cả hai hành động: “bắt Đức Giê-su và đánh đòn Người.”'
  alternative: “Phi-lát bắt Đức Giê-su và truyền đánh đòn Người” hoặc “cho đánh đòn Người.”
  rationale: Bản Hy Lạp đặt Phi-lát làm chủ ngữ của cả hai động từ nhưng không xác định ông tự tay thi hành hay ra lệnh cho thuộc cấp. Bản chính giữ cấu trúc bề mặt và để chú thích nêu khả năng tác nhân được ủy quyền.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Đức Giê-su” và đại từ “Người” theo lối văn Kinh Thánh phổ thông; câu ngắn giữ nhịp tường thuật súc tích của nguyên bản.
