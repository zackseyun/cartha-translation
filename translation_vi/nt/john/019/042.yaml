revisions:
- from: Vậy, vì là ngày chuẩn bị của người Do Thái, và vì ngôi mộ ở gần, nên họ đặt Đức Giê-su tại đó.[a]
  to: Vậy, vì là ngày chuẩn bị của người Do Thái, và vì ngôi mộ ở gần, nên họ đặt Giê-su tại đó.[a]
  rationale: Chỉ bỏ “Đức” để không thêm một kính ngữ không có trong nguyên văn. Các lựa chọn còn lại giữ đúng ý nghĩa, trật tự lập luận và văn phong hiện đại của câu Hy Lạp.
