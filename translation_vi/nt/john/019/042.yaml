  verdict: revise
  source_fidelity: 'Bản dịch phản ánh đầy đủ các thành tố chính: liên từ suy kết οὖν, hai yếu tố nguyên nhân διὰ… và ὅτι, sự gần của ngôi mộ, và địa điểm ἐκεῖ. Tuy nhiên, “Đức” trong “Đức Giê-su” là một yếu tố tôn kính không hiện diện trong τὸν Ἰησοῦν, vốn chỉ là tên riêng không kèm tước hiệu.'
  naturalness: Cấu trúc “Vậy, vì … và vì …, nên …” tự nhiên, rõ ràng trong tiếng Việt hiện đại. “Ngôi mộ ở gần” và “đặt … tại đó” đều phù hợp với văn cảnh an táng.
  terminology: “Ngày chuẩn bị của người Do Thái” bảo toàn tính liên hệ của τῶν Ἰουδαίων mà không áp đặt chi tiết lịch pháp. “Ngôi mộ” là cách dịch phù hợp của μνημεῖον trong ngữ cảnh này. Tên riêng nên là “Giê-su”, không thêm kính ngữ ngoài bản văn.
  issues:
