    rationale: Nguyên văn chỉ có τὸν Ἰησοῦν (“Giê-su”), không có danh xưng hay kính ngữ tương ứng. Dù quen thuộc trong một số truyền thống tiếng Việt, “Đức” thêm sắc thái tôn kính không được biểu thị tại đây.
  revised_text: Vậy, vì là ngày chuẩn bị của người Do Thái, và vì ngôi mộ ở gần, nên họ đặt Giê-su tại đó.[a]
