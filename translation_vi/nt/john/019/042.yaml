id: JHN.19.42
reference: John 19:42
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐκεῖ οὖν διὰ τὴν παρασκευὴν τῶν Ἰουδαίων, ὅτι ἐγγὺς ἦν τὸ μνημεῖον, ἔθηκαν τὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/042.yaml
  text: So there[a], because of the Jews’ day of preparation, since the tomb was nearby, they laid Jesus there.
translation:
  language: vi
  text: Vậy, vì là ngày chuẩn bị của người Do Thái, và vì ngôi mộ ở gần, nên họ đặt Giê-su tại đó.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Vậy, vì ngày chuẩn bị của người Do Thái, và vì ngôi mộ ở gần, nên họ đặt Giê-su tại đó.”'
    reason: Cụm Hy Lạp διὰ τὴν παρασκευὴν τῶν Ἰουδαίων có thể được diễn đạt trong tiếng Việt bằng mệnh đề “vì là ngày chuẩn bị…” hoặc bằng cụm danh từ “vì ngày chuẩn bị…”, mà vẫn giữ quan hệ nguyên nhân.
lexical_decisions:
- source_word: ἐκεῖ
  choice: tại đó
  rationale: Trạng từ chỉ nơi chốn, quy chiếu đến ngôi mộ vừa được nhắc đến; đặt ở cuối câu là tự nhiên trong tiếng Việt và làm rõ nơi an táng.
- source_word: οὖν
  choice: Vậy
  rationale: Giữ chức năng nối kết và suy kết trong mạch kể chuyện mà không tạo sắc thái lập luận quá nặng.
- source_word: διὰ τὴν παρασκευὴν
  choice: vì là ngày chuẩn bị
  rationale: διά với đối cách biểu thị nguyên nhân; παρασκευή trong bối cảnh này là ngày chuẩn bị trước ngày sa-bát. Cách dịch giải thích thuật ngữ lịch sử nhưng không xác định thêm điều văn bản không nói rõ.
- source_word: τῶν Ἰουδαίων
  choice: của người Do Thái
  rationale: Giữ quan hệ sở hữu/liên hệ của sở hữu cách Hy Lạp, thay vì diễn giải rộng hơn thành một nhận định về dân tộc hay tôn giáo.
- source_word: ὅτι
  choice: và vì
  rationale: Dẫn vào lý do thứ hai cho việc chọn ngôi mộ ấy. Thêm 'và' giúp cấu trúc hai nguyên nhân rõ ràng, tự nhiên trong tiếng Việt.
- source_word: ἐγγὺς
  choice: ở gần
  rationale: Diễn đạt tự nhiên sự gần về vị trí của ngôi mộ.
- source_word: μνημεῖον
  choice: ngôi mộ
  rationale: Trong ngữ cảnh mai táng, đây là cách gọi rõ ràng và thông dụng cho nơi đặt thi thể.
- source_word: ἔθηκαν
  choice: họ đặt
  rationale: τίθημι chỉ hành động đặt Đức Giê-su vào mộ. 'Đặt' trung tính, sát nghĩa; ngữ cảnh đã cho biết đây là việc an táng.
- source_word: τὸν Ἰησοῦν
  choice: Đức Giê-su
  rationale: Dùng dạng tên gọi trang trọng, quen thuộc trong tiếng Việt hiện đại.
theological_decisions:
- issue: Ý nghĩa lịch pháp của παρασκευή trong trình thuật Thương Khó
  choice: ngày chuẩn bị
  alternative: Ngày Chuẩn Bị; ngày sửa soạn
  rationale: Cách dịch này vừa dễ hiểu vừa giữ được khả năng đây là tên gọi quy ước của ngày chuẩn bị trước ngày sa-bát, không áp đặt một kết luận lịch pháp chi tiết hơn văn bản.
- issue: Quan hệ của τῶν Ἰουδαίων với παρασκευή
  choice: ngày chuẩn bị của người Do Thái
  alternative: ngày chuẩn bị theo tục Do Thái; ngày chuẩn bị của dân Do Thái
  rationale: Giữ sát cấu trúc sở hữu cách và sự căng nghĩa của lối diễn đạt trong Giăng, đồng thời không biến câu này thành một phán xét thần học về người Do Thái.
- issue: Quan hệ giữa hai mệnh đề nguyên nhân
  choice: vì là ngày chuẩn bị... và vì ngôi mộ ở gần
  alternative: vì ngày chuẩn bị... bởi ngôi mộ ở gần
  rationale: Tiếng Hy Lạp dùng διά để nêu hoàn cảnh/nguyên nhân và ὅτι để giải thích thêm. Cấu trúc song song trong tiếng Việt bảo toàn cả hai yếu tố mà không quyết định rằng chỉ một yếu tố là nguyên nhân duy nhất.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ngày chuẩn bị” thay cho thuật ngữ cổ hoặc viết hoa như một tên riêng; dùng “ngôi mộ” và “đặt ... tại đó” để câu rõ nghĩa trong tiếng Việt. Dấu chú thích [a] được đặt ngay sau câu.
