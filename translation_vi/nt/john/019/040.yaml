- from: Vậy, họ lấy thi thể Đức Giê-su và quấn trong những tấm vải gai cùng với các hương liệu, theo tục lệ mai táng của người Do Thái.[a]
  to: Vậy họ lấy thi thể Đức Giê-su và quấn thi thể ấy bằng những tấm vải lanh cùng với các hương liệu, theo tục lệ mai táng của người Do Thái.[a]
  rationale: Sửa “vải gai” thành “vải lanh” để phù hợp với ὀθόνια theo lựa chọn dịch đã nêu và với cách dùng tiếng Việt hiện đại. Thêm “thi thể ấy” sau “quấn” để phản ánh rõ tân ngữ αὐτό và cải thiện độ tự nhiên của câu. Các yếu tố nghĩa khác, bao gồm cách hiểu “người Do Thái” và chú thích về “người Giu-đê”, được giữ nguyên.
