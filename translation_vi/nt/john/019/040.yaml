  text: ἔλαβον οὖν τὸ σῶμα τοῦ Ἰησοῦ καὶ ἔδησαν ⸀αὐτὸ ὀθονίοις μετὰ τῶν ἀρωμάτων, καθὼς ἔθος ἐστὶν τοῖς Ἰουδαίοις ἐνταφιάζειν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/040.yaml
  text: So they took Jesus’s body and wrapped it in linen cloths with the spices[a], as is the burial custom of the Jews.
translation:
  language: vi
  text: Vậy họ lấy thi thể Đức Giê-su và quấn thi thể ấy bằng những tấm vải lanh cùng với các hương liệu, theo tục lệ mai táng của người Do Thái.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “của người Giu-đê” nếu hiểu theo nghĩa địa lý thay vì nghĩa dân tộc-tôn giáo; tại đây, ngữ cảnh nghiêng về tục lệ mai táng của người Do Thái nói chung.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔλαβον οὖν
  choice: Vậy, họ lấy
  rationale: οὖν nối hành động này với câu trước theo quan hệ kết quả hoặc tiếp diễn; “Vậy” tự nhiên trong văn kể. ἔλαβον chỉ việc họ nhận lấy và xử lý thi thể để chuẩn bị mai táng.
- source_word: τὸ σῶμα τοῦ Ἰησοῦ
  choice: thi thể Đức Giê-su
  rationale: σῶμα nghĩa đen là “thân thể”; trong ngữ cảnh Đức Giê-su đã chết và đang được chuẩn bị mai táng, “thi thể” rõ nghĩa và tự nhiên, nhưng vẫn giữ sắc thái trang trọng.
- source_word: ἔδησαν αὐτὸ ὀθονίοις
  choice: quấn trong những tấm vải gai
  rationale: δέω có nghĩa là buộc hoặc bó; khi nói về nghi thức mai táng bằng ὀθόνια, “quấn” diễn đạt tự nhiên hành động dùng các mảnh vải bó quanh thi thể. ὀθόνια là những tấm hoặc dải vải bằng gai dùng cho việc mai táng.
- source_word: μετὰ τῶν ἀρωμάτων
  choice: cùng với các hương liệu
  rationale: ἀρώματα là các chất thơm dùng khi chuẩn bị thi thể; “hương liệu” chính xác và tự nhiên hơn “gia vị” trong tiếng Việt ở ngữ cảnh này.
- source_word: καθὼς ἔθος ἐστὶν
  choice: theo tục lệ
  rationale: Cụm này diễn tả sự phù hợp với một tập tục đã được thiết lập; “theo tục lệ” gọn, tự nhiên và giữ đầy đủ quan hệ so sánh.
- source_word: τοῖς Ἰουδαίοις
  choice: của người Do Thái
  rationale: Ở đây Ἰουδαῖοι nói đến cộng đồng Do Thái theo phương diện văn hóa-tôn giáo, không chỉ cư dân miền Giu-đê.
- source_word: ἐνταφιάζειν
  choice: mai táng
  rationale: Động từ bao gồm việc chuẩn bị thi thể cho an táng, chứ không chỉ động tác đặt vào mộ; “mai táng” phù hợp với toàn bộ tiến trình được mô tả.
theological_decisions:
- issue: Phạm vi nghĩa của τοῖς Ἰουδαίοις
  choice: người Do Thái
  alternative: người Giu-đê
  rationale: Ngữ cảnh nói đến một tục lệ mai táng chung theo văn hóa-tôn giáo Do Thái. Cách hiểu địa lý “người Giu-đê” vẫn khả dĩ về mặt từ vựng nhưng kém phù hợp hơn trong câu này.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Giê-su” theo lối gọi tôn kính thông dụng; “thi thể” làm rõ ngữ cảnh tử nạn; “vải gai” và “hương liệu” giữ các chi tiết vật chất của nguyên văn.
