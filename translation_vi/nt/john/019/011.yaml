source:
  edition: SBLGNT
  text: ἀπεκρίθη ⸀αὐτῷ Ἰησοῦς· Οὐκ εἶχες ἐξουσίαν ⸂κατ’ ἐμοῦ οὐδεμίαν⸃ εἰ μὴ ἦν ⸂δεδομένον σοι⸃ ἄνωθεν· διὰ τοῦτο ὁ ⸀παραδούς μέ σοι μείζονα ἁμαρτίαν ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/011.yaml
  text: Jesus answered him[a], “You would have no authority over me at all unless it had been given to you from above[b]. Therefore the one who handed me over to you has the greater sin.”
translation:
  language: vi
  text: 'Đức Giê-su đáp: “Ông không có bất cứ thẩm quyền nào đối với tôi, nếu thẩm quyền ấy không được ban cho ông từ trên[a]. Vì vậy, người đã nộp tôi cho ông mắc tội nặng hơn[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “từ trời.” Từ Hy Lạp có nghĩa đen là “từ trên” và trong sách Giăng thường chỉ nguồn đến từ Đức Chúa Trời.'
    reason: lexical_alternative
  - marker: b
    text: Câu này không nói rõ người đã nộp Đức Giê-su là ai; có thể được hiểu là Giu-đa, Cai-phe, hoặc giới lãnh đạo Do Thái nói chung.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐξουσίαν
  choice: thẩm quyền
  rationale: “Thẩm quyền” diễn đạt đúng quyền tài phán được giao của Phi-lát trong bối cảnh xét xử, thay vì chỉ khả năng hay sức mạnh.
- source_word: κατ’ ἐμοῦ οὐδεμίαν
  choice: chẳng có chút thẩm quyền nào trên tôi
  rationale: Cách diễn đạt này giữ quan hệ “trên/đối với tôi” và nhấn mạnh tuyệt đối của οὐδεμίαν.
- source_word: δεδομένον σοι
  choice: được ban cho ông
  rationale: Thể bị động giữ nguyên việc tác nhân ban thẩm quyền không được nêu trực tiếp, đồng thời “ban” phù hợp với nguồn từ trên.
- source_word: ἄνωθεν
  choice: từ trên
  rationale: Giữ sát nghĩa và sắc thái đặc trưng trong Giăng, chỉ nguồn thần thượng mà không diễn giải thẳng thành “từ trời” trong chính văn.
- source_word: διὰ τοῦτο
  choice: Vì vậy
  rationale: Thể hiện tự nhiên quan hệ nguyên nhân-suy luận của cụm từ.
- source_word: ὁ παραδούς
  choice: người đã nộp tôi cho ông
  rationale: Giữ cách gọi chung của nguyên văn, không tự đồng nhất người ấy với Giu-đa, Cai-phe hay giới lãnh đạo Do Thái.
- source_word: μείζονα ἁμαρτίαν
  choice: mắc tội nặng hơn
  rationale: Diễn đạt tự nhiên sự so sánh về mức độ tội lỗi và trách nhiệm, không biến câu thành tên gọi của một tội danh riêng.
theological_decisions:
- issue: Nguồn thẩm quyền của Phi-lát được hàm ý qua ἄνωθεν
  choice: “từ trên,” hàm ý nguồn thần thượng nhưng không khai triển thành một học thuyết tổng quát về chính quyền
  alternative: “từ trời” hoặc hiểu theo nghĩa chung là từ cấp cao hơn
  rationale: Nguyên văn đặt thẩm quyền của Phi-lát dưới một nguồn cao hơn; bản dịch giữ hàm ý thần học cùng độ gián tiếp của câu.
- issue: Danh tính của ὁ παραδούς μέ σοι
  choice: 'Giữ cách gọi không xác định: “người đã nộp tôi cho ông”'
  alternative: Giu-đa, Cai-phe, hoặc giới lãnh đạo Do Thái nói chung
  rationale: Câu Hy Lạp không nêu tên người ấy, nên không giải quyết sự mơ hồ trong chính văn.
- issue: Mức độ trách nhiệm tội lỗi
  choice: “mắc tội nặng hơn,” cho thấy trách nhiệm của người nộp Đức Chúa Jêsus lớn hơn mà không miễn trách Phi-lát
  alternative: “có tội lớn hơn”
  rationale: So sánh μείζονα hàm ý các mức độ trách nhiệm; câu không nói Phi-lát hoàn toàn vô tội.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ông” trong lời Đức Chúa Jêsus nói với Phi-lát; dùng “Đức Chúa Jêsus” theo lối gọi kính trọng. “Chẳng có chút… nào” bảo toàn sắc thái nhấn mạnh, còn “mắc tội nặng hơn” tự nhiên hơn trong tiếng Việt hiện đại.
