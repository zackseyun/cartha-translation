  text: Ὅτε οὖν ἤκουσεν ὁ Πιλᾶτος τοῦτον τὸν λόγον, μᾶλλον ἐφοβήθη,
base_translation:
  language: en
  yaml_path: translation/nt/john/019/008.yaml
  text: When Pilate heard this statement, he became even more afraid,
translation:
  language: vi
  text: Khi Phi-lát nghe lời ấy, ông càng thêm sợ hãi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὅτε οὖν
  choice: Vì vậy, khi
  rationale: Ὅτε nêu hoàn cảnh thời gian, còn οὖν nối phản ứng của Phi-lát với lời buộc tội vừa được nói ở câu trước. Cách diễn đạt này giữ cả quan hệ thời gian lẫn mạch suy luận của bản Hy Lạp.
- source_word: ἤκουσεν
  choice: nghe
  rationale: Trong ngữ cảnh, động từ chỉ việc Phi-lát tiếp nhận điều vừa được nói; “nghe” là cách diễn đạt tự nhiên và chính xác.
- source_word: ὁ Πιλᾶτος
  choice: Phi-lát
  rationale: Dùng dạng phiên âm quen thuộc trong tiếng Việt cho tên riêng Πιλᾶτος; mạo từ Hy Lạp không cần dịch.
- source_word: τοῦτον τὸν λόγον
  choice: lời ấy
  rationale: λόγος ở đây chỉ nội dung phát biểu ngay trước đó, không phải một từ đơn lẻ. “Lời ấy” tự nhiên trong văn kể chuyện và liên kết rõ với câu 7.
- source_word: μᾶλλον
  choice: càng ... hơn
  rationale: Diễn đạt mức độ gia tăng so với nỗi sợ đã có trước đó.
- source_word: ἐφοβήθη
  choice: sợ
  rationale: Động từ mô tả phản ứng sợ hãi của Phi-lát. Kết hợp với μᾶλλον thành “càng sợ hơn” để thể hiện sự gia tăng mà không suy đoán nguyên nhân.
theological_decisions:
- issue: Bản chất nỗi sợ của Phi-lát
  choice: Chỉ nói rằng Phi-lát càng sợ hơn, không xác định nguyên nhân.
  alternative: Giải thích nỗi sợ là do áp lực chính trị hoặc do hàm ý thần linh trong danh xưng “Con Đức Chúa Trời”.
  rationale: Bản Hy Lạp chỉ cho biết nỗi sợ gia tăng sau khi Phi-lát nghe lời ấy; không nói rõ đó là nỗi sợ chính trị, mê tín hay thần học. Bản dịch giữ nguyên sự căng thẳng và mơ hồ của trình thuật.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang nghiêm và dễ hiểu. “Phi-lát” theo lối phiên âm Kinh Thánh quen thuộc; không thêm chủ thể giải thích hoặc nguyên nhân cho nỗi sợ.
