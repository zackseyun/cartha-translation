  - severity: low
    issue: “càng sợ hơn” hơi dư sắc thái so sánh.
    rationale: “Càng” đã biểu thị mức độ tăng lên; thêm “hơn” không sai nghiêm trọng nhưng kém gọn tự nhiên. “Càng thêm sợ hãi” biểu đạt tốt μᾶλλον ἐφοβήθη.
