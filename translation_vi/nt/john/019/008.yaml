  source_fidelity: 'Bản thảo truyền đạt đúng diễn tiến cơ bản: Phi-lát nghe một lời/phát biểu vừa được nói và nỗi sợ của ông tăng lên. Tuy nhiên, việc đặt “Vì vậy” trước “khi” khiến liên từ οὖν bị diễn đạt như một kết luận độc lập, hơi gượng và làm cấu trúc mở đầu câu tiếng Việt kém tự nhiên. Trong câu này, có thể để mạch văn lân cận gánh nhẹ sắc thái liên kết của οὖν mà không mất nghĩa.'
  naturalness: “Vì vậy, khi Phi-lát...” không tự nhiên trong văn kể chuyện hiện đại. Cụm “càng sợ hơn” cũng hơi trùng lặp về sắc thái so sánh. “Khi Phi-lát nghe lời ấy, ông càng thêm sợ hãi” là văn xuôi tự nhiên, trang trọng vừa phải, và diễn đạt rõ sự gia tăng.
  terminology: “Phi-lát” là dạng tên Kinh Thánh tiếng Việt quen dùng và phù hợp. “Lời ấy” chuyển tải τοῦτον τὸν λόγον cách ngắn gọn, quy chiếu đúng lời tuyên bố ở câu trước, không áp đặt cách hiểu về động cơ nỗi sợ. “Sợ hãi” phù hợp với ἐφοβήθη và không suy diễn đó là sợ chính trị, mê tín, hay thần học.
  issues:
