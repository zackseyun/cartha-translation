source:
  edition: SBLGNT
  text: ὅτε οὖν εἶδον αὐτὸν οἱ ἀρχιερεῖς καὶ οἱ ὑπηρέται ἐκραύγασαν λέγοντες· Σταύρωσον ⸀σταύρωσον. λέγει αὐτοῖς ὁ Πιλᾶτος· Λάβετε αὐτὸν ὑμεῖς καὶ σταυρώσατε, ἐγὼ γὰρ οὐχ εὑρίσκω ἐν αὐτῷ αἰτίαν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/006.yaml
  text: So when the chief priests and the officers saw him[a], they cried out, saying, “Crucify him! Crucify him!” Pilate said to them, “You take him and crucify him[b], for I find no charge against him.”
translation:
  language: vi
  text: 'Vì vậy, khi các thầy tế lễ thượng phẩm và các viên chức thấy Người, họ kêu lớn: “Đóng đinh ông ấy vào thập tự giá! Đóng đinh ông ấy vào thập tự giá!” Phi-lát nói với họ: “Chính các ông hãy đem ông ấy đi và đóng đinh ông ấy vào thập tự giá[a], vì ta không thấy nơi ông ấy có căn cứ nào để buộc tội[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Các ông hãy tự mình đem ông ấy đi và đóng đinh ông ấy vào thập tự giá.” Tiếng Hy Lạp nêu rõ đại từ “các ông” để nhấn mạnh.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “ta không thấy ông ấy có lỗi gì.” Từ Hy Lạp có thể chỉ một cáo buộc hoặc căn cứ để cáo buộc; trong văn cảnh này, nghĩa pháp lý là chính.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε οὖν
  choice: Vì thế, khi
  rationale: Giữ cả ý thời gian của ὅτε và sự tiếp nối mang tính suy luận của οὖν, đồng thời tự nhiên trong văn kể chuyện tiếng Việt.
- source_word: οἱ ἀρχιερεῖς
  choice: các thượng tế
  rationale: Chỉ giới lãnh đạo tư tế tại Giê-ru-sa-lem, chứ không phải nhiều người cùng giữ chức thầy tế lễ thượng phẩm.
- source_word: οἱ ὑπηρέται
  choice: những thuộc hạ
  rationale: Diễn tả những người thi hành nhiệm vụ dưới quyền giới lãnh đạo Do Thái mà không xác định quá mức rằng họ là lính đền thờ hay một đơn vị cụ thể.
- source_word: ἐκραύγασαν λέγοντες
  choice: họ la lớn
  rationale: Chuyển tự nhiên cấu trúc động từ kèm phân từ, giữ được sắc thái tiếng kêu lớn và công khai mà không lặp từ vụng về.
- source_word: Σταύρωσον σταύρωσον
  choice: Đóng đinh hắn vào thập tự giá! Đóng đinh hắn vào thập tự giá!
  rationale: Bổ sung tân ngữ vốn đã rõ trong ngữ cảnh và dùng cách diễn đạt tiếng Việt rõ nghĩa; giữ nguyên sự lặp lại đầy thúc ép.
- source_word: Λάβετε αὐτὸν ὑμεῖς
  choice: Chính các ông hãy đem hắn đi
  rationale: Từ “chính” thể hiện sự nhấn mạnh của đại từ ὑμεῖς được nêu rõ trong tiếng Hy Lạp và làm nổi bật sự đối lập với Phi-lát.
- source_word: σταυρώσατε
  choice: đóng đinh vào thập tự giá
  rationale: Cách diễn đạt chính xác, dễ hiểu trong tiếng Việt hiện đại cho mệnh lệnh hành hình bằng thập tự giá; tân ngữ được hiểu từ vế trước.
- source_word: αἰτίαν
  choice: lý do nào để buộc tội
  rationale: Giữ sắc thái pháp lý của αἰτία là căn cứ hay lý do cáo buộc, thay vì biến lời Phi-lát thành một khẳng định thần học rộng hơn về sự vô tội.
theological_decisions:
- issue: Lời tuyên bố của Phi-lát về sự vô tội của Chúa Giê-su
  choice: ta không tìm thấy nơi hắn lý do nào để buộc tội
  alternative: ta không thấy hắn có lỗi gì
  rationale: Bản dịch chính ưu tiên bối cảnh xét xử và nghĩa pháp lý của αἰτία. Cách dịch khác là khả dĩ nhưng “có lỗi” có thể được hiểu rộng theo nghĩa đạo đức hơn văn cảnh trực tiếp.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Ngài” được dùng trong lời người kể để tôn kính Chúa Giê-su; “hắn” trong lời của đám đông và Phi-lát phản ánh thái độ cùng tình thế xét xử, không áp đặt sự tôn kính vào lời thoại của họ. Tên riêng được viết theo dạng Việt hóa “Phi-lát”.
