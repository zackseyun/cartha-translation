  to: 'Vì vậy, khi các thầy tế lễ thượng phẩm và các viên chức thấy Người, họ kêu lớn: “Đóng đinh ông ấy vào thập tự giá! Đóng đinh ông ấy vào thập tự giá!” Phi-lát nói với họ: “Chính các ông hãy đem ông ấy đi và đóng đinh ông ấy vào thập tự giá[a], vì ta không thấy nơi ông ấy có căn cứ nào để buộc tội[b].”'
  rationale: Bản sửa loại bỏ các sắc thái không có trong nguyên ngữ, nhất là tính miệt thị của “hắn” trong lời Phi-lát, đồng thời dùng thuật ngữ chính xác và trung tính hơn cho các chức sắc và viên chức. Sự nhấn mạnh của ὑμεῖς được giữ bằng “Chính các ông”, và tuyên bố tư pháp của Phi-lát vẫn được diễn đạt theo nghĩa “không có căn cứ để buộc tội”.
