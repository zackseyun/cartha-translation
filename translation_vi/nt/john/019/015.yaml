  text: ⸂ἐκραύγασαν οὖν ἐκεῖνοι⸃· Ἆρον ἆρον, σταύρωσον αὐτόν. λέγει αὐτοῖς ὁ Πιλᾶτος· Τὸν βασιλέα ὑμῶν σταυρώσω; ἀπεκρίθησαν οἱ ἀρχιερεῖς· Οὐκ ἔχομεν βασιλέα εἰ μὴ Καίσαρα.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/015.yaml
  text: So they cried out[a], “Away, away! Crucify him!” Pilate said to them, “Shall I crucify your king?” The chief priests answered, “We have no king except Caesar.”
translation:
  language: vi
  text: 'Vì thế, họ kêu lớn: “Đem đi! Đem đi! Đóng đinh người ấy vào thập tự giá!” Phi-lát nói với họ: “Lẽ nào ta đóng đinh vua của các ngươi vào thập tự giá?” Các thượng tế đáp: “Chúng tôi không có vua nào ngoài Sê-sa.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκραύγασαν οὖν ἐκεῖνοι
  choice: Vì thế, họ la lớn
  rationale: κραυγάζω chỉ tiếng kêu la lớn; οὖν nêu hệ quả hoặc bước tiếp theo của trình thuật. Đại từ “họ” diễn đạt tự nhiên ἐκεῖνοι trong ngữ cảnh.
- source_word: Ἆρον ἆρον
  choice: Đem đi! Đem đi!
  rationale: Hai mệnh lệnh lặp lại đòi loại bỏ người đang được nói đến. Cách dịch giữ nguyên sự lặp lại và không thêm tân ngữ vốn không được nói rõ trong cụm Hy Lạp.
- source_word: σταύρωσον αὐτόν
  choice: Đóng đinh hắn vào thập tự giá!
  rationale: σταυρόω trong bối cảnh hành hình La Mã có nghĩa là đóng đinh vào thập tự giá; “hắn” giữ sắc thái lời hô thù nghịch của đám đông.
- source_word: λέγει αὐτοῖς ὁ Πιλᾶτος
  choice: Phi-lát nói với họ
  rationale: Hiện tại lịch sử λέγει được chuyển sang cách kể tự nhiên trong tiếng Việt mà không làm đổi chức năng trình thuật.
- source_word: Τὸν βασιλέα ὑμῶν σταυρώσω
  choice: Ta sẽ đóng đinh vua của các ngươi vào thập tự giá sao?
  rationale: Câu hỏi với thể giả định mang tính cân nhắc và tu từ; “sẽ ... sao?” truyền đạt lời thách thức đầy mỉa mai của Phi-lát.
- source_word: οἱ ἀρχιερεῖς
  choice: các thượng tế
  rationale: Số nhiều chỉ giới lãnh đạo tư tế, được diễn đạt bằng thuật ngữ Kinh Thánh tiếng Việt quen thuộc và chính xác.
- source_word: Οὐκ ἔχομεν βασιλέα εἰ μὴ Καίσαρα
  choice: Chúng tôi không có vua nào ngoài Sê-sa
  rationale: εἰ μὴ nêu ngoại lệ mang tính loại trừ; “ngoài Sê-sa” rõ nghĩa và giữ nguyên sức nặng của lời tuyên bố.
theological_decisions:
- issue: Lời tuyên bố trung thành chính trị của các thượng tế
  choice: Chúng tôi không có vua nào ngoài Sê-sa
  alternative: Chúng tôi không có vua nào, chỉ có Sê-sa
  rationale: Cách dịch giữ nguyên tuyên bố loại trừ gay gắt trong trình thuật mà không giải thích thêm ý nghĩa thần học hay động cơ của người nói.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ nhịp gấp gáp của tiếng hô lặp lại, sự mỉa mai trong câu hỏi của Phi-lát và sức căng trong lời đáp của các thượng tế. Dùng “Phi-lát,” “Sê-sa” và “thượng tế” theo lối phiên chuyển quen thuộc trong tiếng Việt.
