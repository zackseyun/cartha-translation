revisions:
- from: 'Vì thế, họ la lớn: “Đem đi! Đem đi! Đóng đinh hắn vào thập tự giá!” Phi-lát nói với họ: “Ta sẽ đóng đinh vua của các ngươi vào thập tự giá sao?” Các thượng tế đáp: “Chúng tôi không có vua nào ngoài Sê-sa.”'
  to: 'Vì thế, họ kêu lớn: “Đem đi! Đem đi! Đóng đinh người ấy vào thập tự giá!” Phi-lát nói với họ: “Lẽ nào ta đóng đinh vua của các ngươi vào thập tự giá?” Các thượng tế đáp: “Chúng tôi không có vua nào ngoài Sê-sa.”'
  rationale: Bản sửa loại bỏ sắc thái miệt thị không được đánh dấu trong đại từ Hy Lạp, làm tự nhiên hơn động từ tường thuật, và diễn đạt rõ hơn lực tu từ của câu hỏi dùng thể giả định. Không thay đổi ý nghĩa, thuật ngữ chủ chốt, hay tính mơ hồ của mệnh lệnh lặp lại Ἆρον ἆρον.
