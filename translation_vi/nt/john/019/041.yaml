  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἦν δὲ ἐν τῷ τόπῳ ὅπου ἐσταυρώθη κῆπος, καὶ ἐν τῷ κήπῳ μνημεῖον καινόν, ἐν ᾧ οὐδέπω οὐδεὶς ⸂ἦν τεθειμένος⸃·
base_translation:
  language: en
  yaml_path: translation/nt/john/019/041.yaml
  text: In the place where he was crucified there was a garden, and in the garden a new tomb, in which no one had yet been laid.
translation:
  language: vi
  text: Tại nơi Chúa Giê-xu bị đóng đinh có một khu vườn, và trong vườn có một ngôi mộ mới, chưa hề có ai được đặt vào đó.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: không dịch thành một từ riêng
  rationale: Tiểu từ này đánh dấu sự chuyển tiếp nhẹ trong mạch kể; tiếng Việt tự nhiên không cần thêm “bấy giờ” hay “vả”, vì những từ ấy dễ gợi sắc thái thời gian hoặc tương phản không có trong nguyên văn.
- source_word: ἐν τῷ τόπῳ ὅπου ἐσταυρώθη
  choice: Tại nơi Chúa Giê-xu bị đóng đinh
  rationale: Giữ cấu trúc bị động của nguyên văn. Danh xưng “Chúa Giê-xu” được nêu rõ theo ngữ cảnh để đại từ được tự nhiên và không mơ hồ trong tiếng Việt.
- source_word: κῆπος
  choice: khu vườn
  rationale: “Khu vườn” là cách nói hiện đại, tự nhiên cho κῆπος và không thu hẹp nghĩa thành một loại vườn cụ thể.
- source_word: μνημεῖον καινόν
  choice: một ngôi mộ mới
  rationale: “Ngôi mộ” phù hợp với nơi an táng trong ngữ cảnh, còn “mới” giữ nguyên nghĩa của καινόν; mệnh đề sau giải thích rằng mộ chưa từng được sử dụng.
- source_word: οὐδέπω οὐδεὶς ἦν τεθειμένος
  choice: chưa hề có ai được đặt vào đó
  rationale: “Chưa hề” diễn đạt tự nhiên sức phủ định kết hợp của οὐδέπω và οὐδείς; “được đặt vào đó” giữ thể bị động và chỉ việc đặt thi thể vào mộ mà không thêm chi tiết ngoài nguyên văn.
theological_decisions:
- issue: Cách diễn đạt nơi mai táng và hành động đặt vào mộ
  choice: ngôi mộ ... được đặt vào đó
  alternative: phần mộ ... được an táng ở đó
  rationale: Bản dịch chọn từ ngữ cụ thể, gần nguyên văn và không thêm ý nghi lễ hàm chứa trong “an táng”.
- issue: Thể của ἐσταυρώθη
  choice: Chúa Giê-xu bị đóng đinh
  alternative: họ đóng đinh Chúa Giê-xu
  rationale: Giữ thể bị động của tiếng Hy Lạp và không thêm chủ thể hành động vốn không được nêu trong mệnh đề.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu giữ nhịp kể súc tích của nguyên văn, tránh các từ nối cổ như “vả” và tránh diễn giải thần học vượt quá nội dung mô tả.
