  text: ἦλθον οὖν οἱ στρατιῶται, καὶ τοῦ μὲν πρώτου κατέαξαν τὰ σκέλη καὶ τοῦ ἄλλου τοῦ συσταυρωθέντος αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/john/019/032.yaml
  text: So the soldiers came and broke the legs of the first man[b][a], and of the other who had been crucified with him.
translation:
  language: vi
  text: Vậy, quân lính đến và đánh gãy chân của người thứ nhất và của người kia, người đã bị đóng đinh cùng với Đức Chúa Giê-su.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὖν
  choice: Vậy
  rationale: Diễn tả sự tiếp nối có tính hệ quả từ câu trước, tự nhiên trong văn kể chuyện tiếng Việt.
- source_word: οἱ στρατιῶται
  choice: quân lính
  rationale: Chỉ những binh sĩ La Mã trong bối cảnh; cách gọi rõ ràng và thông dụng.
- source_word: τοῦ μὲν πρώτου
  choice: người thứ nhất
  rationale: Hy Lạp chỉ nói sát nghĩa là “người thứ nhất”; thêm “người” để tiếng Việt rõ và tự nhiên.
- source_word: κατέαξαν τὰ σκέλη
  choice: đánh gãy chân
  rationale: Κατάγνυμι có nghĩa là làm gãy; “đánh gãy chân” truyền đạt cả hành động bạo lực có chủ ý trong bối cảnh hành hình. Tiếng Việt dùng “chân” tự nhiên hơn “các chân” dù danh từ Hy Lạp ở số nhiều.
- source_word: τοῦ ἄλλου
  choice: chân người kia
  rationale: Lặp lại “chân” để làm rõ tân ngữ được tỉnh lược trong tiếng Hy Lạp, đồng thời giữ quan hệ song song giữa hai người.
- source_word: τοῦ συσταυρωθέντος αὐτῷ
  choice: là người đã bị đóng đinh cùng Đức Chúa Giê-su
  rationale: Phân từ mô tả người kia là người đã chịu đóng đinh cùng với nhân vật trung tâm của cảnh này. Nêu tên Đức Chúa Giê-su thay cho đại từ giúp tránh khả năng tiếng Việt hiểu nhầm “cùng người thứ nhất”.
theological_decisions:
- issue: Đối tượng được đại từ αὐτῷ chỉ đến
  choice: Đức Chúa Giê-su
  alternative: người thứ nhất
  rationale: Trong mạch văn Giăng, hai người kia được xác định theo quan hệ với Đức Chúa Giê-su. Tuy về hình thức đại từ có thể gây thoáng mơ hồ nếu tách khỏi ngữ cảnh, Đức Chúa Giê-su là đối tượng quy chiếu tự nhiên nhất; nêu tên Ngài làm câu tiếng Việt sáng nghĩa.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “rồi” để nối hai đối tượng của cùng hành động mà không tạo cấu trúc tỉnh lược gượng gạo. Không cần chú thích vì phần bổ sung “người” và việc chuyển số nhiều Hy Lạp thành danh từ tập hợp “chân” đều là cách diễn đạt tự nhiên trong tiếng Việt.
