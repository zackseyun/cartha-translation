  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ὁ ἑωρακὼς μεμαρτύρηκεν, καὶ ἀληθινὴ ⸂αὐτοῦ ἐστιν⸃ ἡ μαρτυρία, καὶ ἐκεῖνος οἶδεν ὅτι ἀληθῆ λέγει, ἵνα ⸀καὶ ὑμεῖς ⸀πιστεύητε.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/035.yaml
  text: And the one who has seen has testified[a], and his testimony is true, and that one knows that he is telling the truth, so that you also may believe.
translation:
  language: vi
  text: Người đã thấy đã làm chứng, và lời chứng của người là chân thật. Chính người ấy biết rằng mình nói sự thật, để anh em cũng tin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “để anh em cũng tiếp tục tin.” Thể giả định hiện tại có thể mang sắc thái tiếp diễn.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ ἑωρακὼς
  choice: người đã thấy việc ấy
  rationale: Giữ dạng phân từ được danh từ hóa và sắc thái nhân chứng của thì hoàn thành; thêm “việc ấy” cho tự nhiên trong tiếng Việt mà không gọi đích danh người chứng kiến.
- source_word: μεμαρτύρηκεν
  choice: đã làm chứng
  rationale: “Làm chứng” là cách nói tự nhiên, trang trọng, diễn đạt lời chứng đã được đưa ra và vẫn có giá trị.
- source_word: ἀληθινὴ ... ἡ μαρτυρία
  choice: lời chứng của người là chân thật
  rationale: “Lời chứng” tương ứng tự nhiên với động từ “làm chứng”; “chân thật” nhấn mạnh tính đáng tin và đúng sự thật.
- source_word: ἐκεῖνος
  choice: chính người ấy
  rationale: Giữ lực nhấn mạnh của đại từ chỉ định, đồng thời tránh lối diễn đạt gượng “người đó” trong văn cảnh trang trọng.
- source_word: οἶδεν
  choice: biết
  rationale: Dù có hình thái hoàn thành, οἶδα mang nghĩa trạng thái ở hiện tại, nên “biết” là tương đương tự nhiên.
- source_word: ἀληθῆ λέγει
  choice: mình nói sự thật
  rationale: Diễn đạt thành ngữ Hy Lạp bằng tiếng Việt tự nhiên; “mình” quy chiếu về chính người làm chứng mà không thêm căn tính cho người ấy.
- source_word: ἵνα καὶ ὑμεῖς πιστεύητε
  choice: để anh em cũng tin
  rationale: “Để” thể hiện mục đích của ἵνα; “cũng” giữ ý bao gồm người đọc. Cách dịch “tin” không tự quyết định sắc thái khởi đầu hay tiếp tục tin.
theological_decisions:
- issue: Đối tượng quy chiếu của các cách gọi nhấn mạnh trong câu
  choice: 'Giữ ngôi thứ ba: “người đã thấy” và “chính người ấy”'
  alternative: Xác định người ấy là người môn đồ được Chúa yêu hoặc là một nhân chứng khác
  rationale: Bản Hy Lạp không nêu rõ căn tính của nhân chứng; bản dịch không giải quyết thay cho nguyên văn sự mơ hồ giữa lời tự thuật ở ngôi thứ ba và một nhân chứng riêng biệt.
- issue: Sắc thái của πιστεύητε
  choice: tin
  alternative: tiếp tục tin
  rationale: Thể giả định hiện tại có thể mang sắc thái tiếp diễn, nhưng trong cách dùng của Giăng cũng có thể chỉ việc đi đến đức tin; bản chính giữ cách nói không đánh dấu và ghi khả năng tiếp diễn trong chú thích.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh em” cho đại từ số nhiều ὑμεῖς; giữ sự lặp lại “làm chứng/lời chứng” và tính nhấn mạnh của ἐκεῖνος. Dấu chú thích [a] đặt ngay sau mệnh đề liên quan.
