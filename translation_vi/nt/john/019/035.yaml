  - severity: low
    issue: Thiếu liên từ “rằng” sau “biết”
    rationale: Không làm sai nghĩa, nhưng thêm “rằng” khiến mệnh đề thuật lại tự nhiên và rõ quan hệ hơn trong tiếng Việt hiện đại.
