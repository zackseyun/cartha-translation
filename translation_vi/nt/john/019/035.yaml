  terminology: “Làm chứng/lời chứng,” “chân thật,” và “tin” là những lựa chọn nhất quán, phù hợp văn cảnh Giăng. “Anh em” là cách xưng hô Kinh Thánh Việt ngữ thông dụng cho số nhiều ở đây.
