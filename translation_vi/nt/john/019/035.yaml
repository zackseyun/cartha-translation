  source_fidelity: 'Bản dịch nhìn chung phản ánh đúng cấu trúc và ý nghĩa của nguyên văn: các thì hoàn thành trong “đã thấy/đã làm chứng,” tính xác thực của lời chứng, đại từ chỉ định nhấn mạnh, và mệnh đề mục đích đều được chuyển đạt tốt. Tuy nhiên, “việc ấy” không có đối ứng trong nguyên văn, vốn chỉ nói “người đã thấy”; phần thêm này thu hẹp đối tượng của điều được thấy theo ngữ cảnh.'
