id: JHN.19.38
reference: John 19:38
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Μετὰ ⸀δὲ ταῦτα ἠρώτησεν τὸν Πιλᾶτον Ἰωσὴφ ⸀ἀπὸ Ἁριμαθαίας, ὢν μαθητὴς τοῦ Ἰησοῦ κεκρυμμένος δὲ διὰ τὸν φόβον τῶν Ἰουδαίων, ἵνα ἄρῃ τὸ σῶμα τοῦ Ἰησοῦ· καὶ ἐπέτρεψεν ὁ Πιλᾶτος. ἦλθεν οὖν καὶ ἦρεν τὸ σῶμα ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/038.yaml
  text: After these things[a], Joseph from Arimathea, being a disciple of Jesus but having kept it hidden because of fear of the Jews, asked Pilate that he might take away the body of Jesus. And Pilate gave permission. So he came and took away his body.
translation:
  language: vi
  text: Sau những việc ấy, Giô-sép, người từ A-ri-ma-thê, là môn đệ của Đức Giê-su nhưng đã giữ kín điều đó vì sợ người Do Thái[a], xin Phi-lát cho phép ông đem thi hài Đức Giê-su đi. Phi-lát cho phép. Vậy ông đến và đem thi hài Đức Giê-su đi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Trong ngữ cảnh này, “người Do Thái” có thể đặc biệt chỉ các giới chức Do Thái tại Giu-đê chống đối Đức Giê-su, chứ không phải toàn thể dân Do Thái không phân biệt.
    reason: Giải thích phạm vi ngữ cảnh có thể có của Ἰουδαῖοι, đồng thời giữ cách gọi rộng và tính mơ hồ của nguyên văn trong chính văn.
lexical_decisions:
- source_word: Μετὰ δὲ ταῦτα
  choice: Sau những việc ấy
  rationale: Giữ sát chuyển tiếp thời gian và dạng số nhiều của ταῦτα, đồng thời tự nhiên trong tiếng Việt.
- source_word: Ἰωσὴφ ἀπὸ Ἁριμαθαίας
  choice: Giô-sép, người A-ri-ma-thê
  rationale: Diễn đạt rõ xuất xứ do ἀπό chỉ nơi đến từ; cách nói tự nhiên hơn kiểu sở thuộc trong tiếng Việt.
- source_word: ὢν μαθητὴς τοῦ Ἰησοῦ
  choice: vốn là môn đồ của Đức Chúa Jêsus
  rationale: Chuyển phân từ thành mệnh đề mô tả tự nhiên; μαθητής được dịch theo thuật ngữ Kinh Thánh quen thuộc là “môn đồ”.
- source_word: κεκρυμμένος δὲ
  choice: nhưng đã giấu kín điều đó
  rationale: Làm rõ đối tượng hàm ẩn là việc ông làm môn đồ, đồng thời phản ánh trạng thái che giấu kéo dài của phân từ hoàn thành.
- source_word: διὰ τὸν φόβον τῶν Ἰουδαίων
  choice: vì sợ người Do Thái
  rationale: Diễn đạt gọn và tự nhiên quan hệ nguyên nhân, nhưng vẫn giữ cách gọi rộng của nguyên văn; chú thích giải thích phạm vi theo ngữ cảnh.
- source_word: ἵνα ἄρῃ τὸ σῶμα τοῦ Ἰησοῦ
  choice: cho phép ông đem thi thể Đức Chúa Jêsus đi
  rationale: Trong tiếng Việt, “xin Phi-lát cho phép” biểu đạt tự nhiên nội dung của lời thỉnh cầu; αἴρω ở đây là đưa thi thể khỏi nơi đóng đinh để an táng.
- source_word: ἐπέτρεψεν ὁ Πιλᾶτος
  choice: Phi-lát cho phép
  rationale: Bản dịch trực tiếp, rõ ràng của động từ chỉ việc chấp thuận hay ban phép.
- source_word: ἦλθεν οὖν καὶ ἦρεν τὸ σῶμα αὐτοῦ
  choice: Vậy, ông đến và đem thi thể Ngài đi
  rationale: “Vậy” thể hiện οὖν như kết quả của sự cho phép; lặp lại “đem... đi” duy trì liên hệ từ vựng với αἴρω trước đó, và “Ngài” thể hiện đại từ αὐτοῦ.
theological_decisions:
- issue: Phạm vi chỉ người của τῶν Ἰουδαίων trong Phúc Âm Giăng
  choice: Giữ “người Do Thái” trong chính văn và thêm chú thích giải thích ngữ cảnh.
  alternative: “giới lãnh đạo Do Thái” hoặc “người Giu-đê”
  rationale: Nguyên văn dùng thuật ngữ rộng Ἰουδαῖοι. Trong ngữ cảnh này, từ có lẽ đặc biệt chỉ những nhà chức trách Do Thái chống đối Đức Chúa Jêsus, nhưng thay trực tiếp bằng một nhóm hẹp hơn sẽ giải quyết sự mơ hồ ngay trong chính văn. Chú thích vừa giữ nguyên căng thẳng của nguồn vừa hạn chế cách hiểu sai rằng câu này quy kết cho toàn thể dân Do Thái.
translation_notes:
  register: 'Văn phong hiện đại, trang trọng và dễ hiểu. Dùng các dạng tên quen thuộc trong truyền thống Kinh Thánh tiếng Việt: Giô-sép, A-ri-ma-thê, Phi-lát; dùng “Đức Chúa Jêsus” và đại từ tôn kính “Ngài”. “Thi thể” được chọn thay vì “thân thể” vì ngữ cảnh nói rõ về người đã chết.'
