  - severity: low
    issue: “người A-ri-ma-thê” chưa thể hiện trực tiếp ἀπὸ Ἁριμαθαίας.
    rationale: Cụm ἀπό chỉ nguồn gốc/liên hệ địa phương; “người từ A-ri-ma-thê” rõ và tự nhiên hơn.
  - severity: low
