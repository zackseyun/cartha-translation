  source_fidelity: 'Bản dịch phản ánh đúng trình tự và nội dung của câu Hy Lạp: lời xin phép Phi-lát, sự cho phép, rồi việc Giô-sép đến đem thi hài Đức Giê-su đi. Tuy nhiên, “người A-ri-ma-thê” không diễn đạt rõ ἀπὸ Ἁριμαθαίας bằng cách “người từ A-ri-ma-thê”; và cách gọi “Đức Chúa Jêsus” thêm một tước hiệu không có trong câu nguồn.'
  naturalness: Câu văn nhìn chung rõ, nhưng “người từ A-ri-ma-thê” tự nhiên hơn “người A-ri-ma-thê”. “Môn đệ”, “Giê-su”, và việc lặp lại tên riêng ở cuối câu là các lựa chọn trung tính, hiện đại, tránh màu sắc truyền thống hệ phái không cần thiết.
  terminology: Đổi “môn đồ” thành “môn đệ” và “Đức Chúa Jêsus” thành “Đức Giê-su” để dùng thuật ngữ hiện đại, trang trọng và không thêm nội dung xưng nhận vào chính văn. “Thi hài” phù hợp ngữ cảnh người đã chết. Chú thích về “người Do Thái” vẫn cần thiết và phải giữ tính dè dặt về phạm vi quy chiếu.
