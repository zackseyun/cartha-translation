  rationale: Bản sửa duy trì sát nghĩa nguyên văn và tính trung lập diễn giải, đồng thời làm văn xuôi gọn tự nhiên hơn. Neo [a] được chuyển đến ngay sau “giáo” và nội dung được thu hẹp thành phương án từ vựng thực sự (“thương”), còn [b] vẫn neo đúng tại mệnh đề “máu và nước”.
