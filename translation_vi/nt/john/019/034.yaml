source:
  edition: SBLGNT
  text: ἀλλ’ εἷς τῶν στρατιωτῶν λόγχῃ αὐτοῦ τὴν πλευρὰν ἔνυξεν, καὶ ⸂ἐξῆλθεν εὐθὺς⸃ αἷμα καὶ ὕδωρ.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/034.yaml
  text: But one of the soldiers pierced his side with a spear[b][a], and immediately blood and water came out.
translation:
  language: vi
  text: Nhưng một trong các binh lính lấy giáo[a] đâm vào sườn Ngài, và lập tức máu và nước chảy ra.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “thương.”
    reason: lexical_alternative
  - marker: b
    text: Một số nhà giải nghĩa hiểu “máu và nước” theo nghĩa biểu tượng hoặc bí tích; những người khác xem đây là một mô tả thể lý. Chính bản văn Hy Lạp không giải thích ý nghĩa của cụm từ này tại đây.
    reason: cross_reference
lexical_decisions:
- source_word: ἀλλ’
  choice: Nhưng
  rationale: 'Diễn tả sự tương phản với câu trước: chân Chúa Giê-su không bị đánh gãy, nhưng cạnh sườn Ngài bị đâm.'
- source_word: εἷς τῶν στρατιωτῶν
  choice: một người trong số những người lính
  rationale: Giữ rõ cấu trúc bộ phận trong tiếng Hy Lạp, thay vì giản lược thành “một người lính”.
- source_word: λόγχῃ
  choice: lấy giáo
  rationale: “Giáo” là từ tiếng Việt tự nhiên, dễ hiểu, chỉ loại vũ khí cán dài có mũi nhọn của người lính; cũng có thể gọi là “thương”.
- source_word: αὐτοῦ τὴν πλευρὰν
  choice: cạnh sườn của Ngài
  rationale: πλευρά chỉ phần bên thân mình. “Cạnh sườn” tự nhiên và không xác định cụ thể hơn nguyên văn; “của Ngài” giữ đại từ quy chiếu về Chúa Giê-su với sắc thái trang trọng.
- source_word: ἔνυξεν
  choice: đâm vào
  rationale: Diễn đạt hành động dùng vật nhọn chọc xuyên vào thân thể một cách rõ ràng, tự nhiên và trang nghiêm.
- source_word: καὶ ⸂ἐξῆλθεν εὐθὺς⸃
  choice: lập tức ... chảy ra
  rationale: Giữ ý thời gian của εὐθύς và diễn đạt ἐξέρχομαι phù hợp với chủ thể “máu và nước” trong tiếng Việt.
- source_word: αἷμα καὶ ὕδωρ
  choice: máu và nước
  rationale: Dịch trực tiếp, không thêm cách giải thích mang tính y học, biểu tượng hay bí tích.
theological_decisions:
- issue: Ý nghĩa của “máu và nước”
  choice: Giữ nguyên cụm từ cụ thể “máu và nước” mà không giải nghĩa trong chính văn.
  alternative: Hiểu theo nghĩa biểu tượng hoặc bí tích; hoặc hiểu như một mô tả hiện tượng thể lý.
  rationale: Bản văn Hy Lạp thuật lại hiện tượng nhưng không giải thích ý nghĩa tại đây; bản dịch cần bảo toàn sự mở ngỏ và căng thẳng thần học ấy.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. Dùng “Ngài” để quy chiếu về Chúa Giê-su theo lối hành văn kính trọng phổ biến trong tiếng Việt. Đặt [a] ngay sau mệnh đề về ngọn giáo và [b] sau cụm “máu và nước” để mỗi chú thích gắn đúng nội dung.
