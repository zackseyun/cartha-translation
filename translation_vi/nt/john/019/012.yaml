  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐκ τούτου ⸂ὁ Πιλᾶτος ἐζήτει⸃ ἀπολῦσαι αὐτόν· οἱ δὲ Ἰουδαῖοι ⸀ἐκραύγασαν λέγοντες· Ἐὰν τοῦτον ἀπολύσῃς, οὐκ εἶ φίλος τοῦ Καίσαρος· πᾶς ὁ βασιλέα ἑαυτὸν ποιῶν ἀντιλέγει τῷ Καίσαρι.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/012.yaml
  text: From then on Pilate was seeking to release him. But the Jews shouted, saying, “If you release this man, you are not Caesar’s friend. Everyone who makes himself a king speaks against Caesar.”
translation:
  language: vi
  text: 'Từ lúc đó, Phi-lát tìm cách thả Ngài.[a] Nhưng những người Do Thái[b] la lớn: “Nếu ông thả người này, ông không phải là bạn của Sê-sa. Bất cứ ai tự lập mình làm vua đều chống lại Sê-sa.”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Vì điều này, Phi-lát cứ tìm cách thả Ngài.” Cụm từ Hy Lạp ἐκ τούτου có thể được hiểu theo nghĩa thời gian (“từ lúc đó”) hoặc nguyên nhân (“vì điều này”).'
    reason: lexical_alternative
  - marker: b
    text: Trong sách Giăng, “những người Do Thái” thường chỉ cụ thể hơn đến giới chức Do Thái hoặc những người Do Thái chống đối trong văn cảnh, chứ không nhất thiết chỉ toàn thể dân Do Thái.
    reason: cultural_note
  - marker: c
    text: 'Cũng có thể dịch: “nói chống Sê-sa” hoặc “đối nghịch với Sê-sa.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ τούτου
  choice: Từ lúc đó
  rationale: Cụm từ có thể mang nghĩa thời gian hoặc nguyên nhân; trong mạch tường thuật ở đây, cách hiểu thời gian là tự nhiên, đồng thời ghi chú bảo lưu nghĩa nguyên nhân.
- source_word: ἐζήτει
  choice: tìm cách
  rationale: Thì chưa hoàn thành diễn tả nỗ lực đang tiếp diễn hoặc lặp lại; “tìm cách” là cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: ἀπολῦσαι / ἀπολύσῃς
  choice: thả
  rationale: Trong bối cảnh xét xử và giam giữ, “thả” diễn đạt rõ việc cho người bị giữ được tự do.
- source_word: οἱ δὲ Ἰουδαῖοι
  choice: Nhưng những người Do Thái
  rationale: Giữ cách gọi ở cấp độ văn bản nguồn, không tự ý thu hẹp thành “các lãnh đạo Do Thái”; ghi chú giải thích phạm vi chỉ định theo văn cảnh.
- source_word: ἐκραύγασαν λέγοντες
  choice: la lớn
  rationale: Động từ chỉ tiếng kêu lớn nơi công cộng; tiếng Việt không cần dịch riêng phân từ “nói rằng” trước lời nói trực tiếp.
- source_word: τοῦτον
  choice: người này
  rationale: Bảo lưu sắc thái chỉ định của đại từ và phù hợp với giọng điệu trong lời buộc tội.
- source_word: φίλος τοῦ Καίσαρος
  choice: bạn của Sê-sa
  rationale: Bám sát cấu trúc sở hữu và bảo lưu hàm ý trung thành chính trị mà không khẳng định đây là một tước hiệu chính thức.
- source_word: πᾶς ὁ βασιλέα ἑαυτὸν ποιῶν
  choice: Bất cứ ai tự xưng mình là vua
  rationale: Trong tiếng Việt, “tự xưng mình là vua” diễn đạt tự nhiên hành động tự đặt mình vào địa vị vua trong ngữ cảnh cáo buộc chính trị.
- source_word: ἀντιλέγει τῷ Καίσαρι
  choice: chống lại Sê-sa
  rationale: Trong ngữ cảnh chính trị-pháp lý này, ἀντιλέγω mang nghĩa đối kháng hoặc chống đối, không chỉ là nói lời phản bác.
theological_decisions:
- issue: Phạm vi chỉ định của οἱ Ἰουδαῖοι trong sách Giăng
  choice: Giữ “những người Do Thái” trong chính văn và giải thích theo văn cảnh ở chú thích.
  alternative: các lãnh đạo Do Thái; người Giu-đê
  rationale: Nguyên văn không nêu rõ “lãnh đạo”; tuy nhiên, chú thích cần ngăn cách hiểu sai rằng cụm từ nhất thiết chỉ toàn thể dân Do Thái.
- issue: Sắc thái của ἀντιλέγει τῷ Καίσαρι
  choice: chống lại Sê-sa
  alternative: nói chống Sê-sa; đối nghịch với Sê-sa
  rationale: “Chống lại” phù hợp với sức nặng của lời đe dọa về lòng trung thành chính trị, nhưng chú thích bảo lưu nghĩa thiên về lời nói.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Phi-lát” và “Sê-sa” theo lối phiên âm Kinh Thánh quen thuộc; đại từ “Ngài” dành cho Chúa Giê-su, còn “ông” chỉ Phi-lát trong lời đám đông.
