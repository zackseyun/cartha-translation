  text: τότε οὖν παρέδωκεν αὐτὸν αὐτοῖς ἵνα σταυρωθῇ. Παρέλαβον ⸀οὖν τὸν ⸀Ἰησοῦν·
base_translation:
  language: en
  yaml_path: translation/nt/john/019/016.yaml
  text: Then he handed him over to them to be crucified[b][a]. So they took Jesus.
translation:
  language: vi
  text: Bấy giờ, ông giao Người cho họ để Người bị đóng đinh vào thập tự giá.[a] Vậy họ đem Đức Giê-su đi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Chủ thể của “giao”, những người được nói đến là “họ”, và chủ thể của “đem” không được gọi đích danh trong câu Hy Lạp này; văn cảnh gần giúp nhận ra các nhân vật được nói đến.
    reason: alternative_reading
lexical_decisions:
- source_word: τότε οὖν
  choice: Bấy giờ
  rationale: Hai từ nối đánh dấu bước tiếp theo và hệ quả của diễn biến trước đó. Trong tiếng Việt, “bấy giờ” diễn đạt tự nhiên mạch thời gian-kết quả mà không tạo một chuỗi từ nối nặng nề.
- source_word: παρέδωκεν
  choice: giao ... cho
  rationale: Diễn tả việc trao một người vào quyền kiểm soát của người khác, phù hợp với sắc thái chuyển giao trong bối cảnh xét xử.
- source_word: αὐτὸν
  choice: Người
  rationale: Đại từ chỉ Đức Giê-su; giữ cách dùng đại từ thay vì lặp lại tên riêng ở mệnh đề đầu.
- source_word: αὐτοῖς
  choice: cho họ
  rationale: Giữ nguyên đại từ số nhiều không được xác định rõ ngay trong câu, tránh tự ý gọi tên một nhóm cụ thể.
- source_word: ἵνα σταυρωθῇ
  choice: để Người bị đóng đinh vào thập tự giá
  rationale: Giữ rõ ý mục đích của ἵνα và thể bị động của σταυρωθῇ; “đóng đinh vào thập tự giá” là cách diễn đạt rõ ràng, quen thuộc trong tiếng Việt hiện đại.
- source_word: Παρέλαβον
  choice: họ nhận lấy
  rationale: Trong ngữ cảnh, động từ nói đến việc tiếp nhận hoặc nhận quyền kiểm soát Đức Giê-su. “Nhận lấy” tự nhiên hơn “tiếp nhận” nhưng không thêm chi tiết như “áp giải” vốn không có trong chính động từ.
- source_word: οὖν
  choice: Thế là
  rationale: Nêu diễn tiến/hệ quả sang hành động kế tiếp bằng một liên từ kể chuyện tự nhiên trong tiếng Việt.
- source_word: Ἰησοῦν
  choice: Đức Giê-su
  rationale: Dạng tên riêng thông dụng, trang trọng và dễ hiểu trong tiếng Việt hiện đại.
theological_decisions:
- issue: Đối tượng của “họ” trong αὐτοῖς và chủ ngữ hàm ẩn của Παρέλαβον
  choice: Giữ “họ” trong bản văn chính, không xác định nhóm người.
  alternative: Diễn giải là các thượng tế và thuộc hạ của họ, hoặc là lính La Mã.
  rationale: Câu Hy Lạp chỉ dùng đại từ và chủ ngữ hàm ẩn, không gọi đích danh nhóm người. Việc nêu một nhóm cụ thể sẽ giải quyết sự để ngỏ của nguyên văn.
- issue: Quan hệ mục đích trong ἵνα σταυρωθῇ
  choice: Dịch rõ là “để Người bị đóng đinh vào thập tự giá”.
  alternative: Dịch gọn là “để chịu đóng đinh vào thập tự giá”.
  rationale: Cách chọn giữ cả quan hệ mục đích lẫn thể bị động, đồng thời tránh cấu trúc tiếng Việt có thể khiến chủ thể chịu hành động trở nên kém rõ.
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại. Dùng “ông” cho chủ ngữ nam đã được biết từ văn cảnh và “Người” cho Đức Giê-su; tránh bổ sung tên Phi-lát hoặc xác định “họ” là một nhóm cụ thể. Các từ nối được diễn đạt tự nhiên, không máy móc lặp cả hai tiểu từ Hy Lạp.
