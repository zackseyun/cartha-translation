    rationale: Trong ngữ cảnh này, παραλαμβάνω nói đến việc họ tiếp lấy Đức Giê-su để đưa đi; “nhận lấy” có thể gợi việc thụ nhận đơn thuần và thiếu ý chuyển động/đưa đi. “Đem ... đi” là cách Việt ngữ tự nhiên mà không nêu thêm phương thức như áp giải hay lôi đi.
  - severity: low
    issue: Chú thích cần cập nhật theo động từ đã sửa và diễn đạt chính xác tính hàm ẩn của các tác nhân.
    rationale: Nguyên văn không nêu đích danh chủ thể của παρέδωκεν, những người nhận trong αὐτοῖς, hay chủ thể số nhiều của Παρέλαβον; chú thích nên nói rõ điều này mà không tự nhận diện nhóm người.
