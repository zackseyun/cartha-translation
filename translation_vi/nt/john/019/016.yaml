  terminology: “Đức Giê-su,” “thập tự giá,” “giao ... cho,” và “bị đóng đinh” phù hợp với văn phong Kinh Thánh trang trọng-hiện đại. Không xác định “họ” là một nhóm cụ thể, nên không áp đặt cách giải thích về các nhân vật được hàm chỉ.
