base_translation:
  language: en
  yaml_path: translation/nt/john/019/007.yaml
  text: The Jews answered him[a], “We have a law, and according to that law he ought to die[b], because he made himself the Son of God.”
translation:
  language: vi
  text: 'Người Do Thái trả lời ông ấy: “Chúng tôi có một luật, và theo luật ấy, người ấy phải chết, vì người ấy đã tự cho mình là Con Đức Chúa Trời.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθησαν αὐτῷ
  choice: đáp lời ông
  rationale: Diễn đạt tự nhiên động từ đáp lại và giữ đại từ chỉ Phi-lát theo ngữ cảnh.
- source_word: οἱ Ἰουδαῖοι
  choice: Người Do Thái
  rationale: Giữ cách gọi nhóm trực tiếp của bản Hy Lạp; câu này tự nó không giới hạn rõ ràng vào giới lãnh đạo.
- source_word: νόμον ἔχομεν
  choice: chúng tôi có một luật
  rationale: Danh từ không có mạo từ ở lần xuất hiện đầu; “một luật” phản ánh hình thức Hy Lạp và lời viện dẫn một căn cứ pháp lý.
- source_word: κατὰ τὸν νόμον
  choice: theo luật ấy
  rationale: Mạo từ ở lần xuất hiện thứ hai có tính hồi chỉ; “luật ấy” liên kết tự nhiên với luật vừa nêu.
- source_word: ὀφείλει ἀποθανεῖν
  choice: hắn phải chết
  rationale: “Phải” truyền đạt nghĩa vụ hoặc đòi hỏi pháp lý của ὀφείλει; “hắn” phù hợp giọng kết tội và cách họ nói về Chúa Giê-su trước Phi-lát.
- source_word: υἱὸν θεοῦ ἑαυτὸν ἐποίησεν
  choice: hắn đã tự xưng là Con Đức Chúa Trời
  rationale: “Tự xưng là” diễn đạt tự nhiên thành ngữ “làm chính mình thành”; “Con Đức Chúa Trời” giữ sức nặng tước hiệu trong văn mạch Giăng mà không biến lời buộc tội thành lời bình của người dịch.
theological_decisions:
- issue: Cách dịch υἱὸν θεοῦ trong lời buộc tội Chúa Giê-su
  choice: Con Đức Chúa Trời
  alternative: một người con của Đức Chúa Trời; Con của Đức Chúa Trời
  rationale: Văn mạch Giăng cho thấy lời buộc tội liên quan đến địa vị làm Con độc nhất, không chỉ thuộc một nhóm bất định. Cách dịch này giữ nguyên sức nặng thần học nhưng vẫn trình bày đây là lời của những người tố cáo.
- issue: Cách hiểu ἑαυτὸν ἐποίησεν
  choice: tự xưng là
  alternative: tự làm mình thành
  rationale: Bản dịch được chọn tránh hàm ý rằng Chúa Giê-su thực sự biến đổi bản thể của mình, đồng thời phản ánh đúng lời cáo buộc rằng ngài nhận cho mình địa vị ấy.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. Dùng “Người Do Thái” để bám sát danh xưng Hy Lạp; dùng “hắn” trong lời thoại nhằm thể hiện thái độ đối nghịch của người tố cáo, không phải giọng của người kể.
