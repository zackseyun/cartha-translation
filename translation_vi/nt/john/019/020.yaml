review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp truyền đạt đúng mạch chính của câu: nhiều người Do Thái đọc thông báo vì địa điểm Đức Chúa Jêsus bị đóng đinh gần thành, và nội dung được viết bằng ba ngôn ngữ. Tuy nhiên, τίτλος trong ngữ cảnh này nhấn mạnh dòng chữ/thông báo được đọc; cách lặp lại “bảng được viết” trong vế sau dễ khiến tiếng Việt nói về vật thể tấm bảng hơn là nội dung được viết. Danh xưng “Đức Chúa” không hiện diện trong nguyên văn, vốn chỉ có ὁ Ἰησοῦς, nên không nên thêm vào chính văn.'
  naturalness: “Dòng chữ ấy” tự nhiên, rõ nghĩa và liên kết tốt với cả động từ “đọc” lẫn mệnh đề “được viết”. “Vì” phù hợp hơn “bởi” trong văn xuôi hiện đại. Cấu trúc câu vẫn giữ được quan hệ nguyên nhân và trình tự của tiếng Hy Lạp.
  terminology: Dùng “Giê-su” cho tên riêng trong chính văn hiện đại và không thêm tước hiệu không có trong nguồn. Giữ “tiếng Hê-bơ-rơ”, “tiếng La-tinh”, và “tiếng Hy Lạp”. Khả năng Ἑβραϊστί ám chỉ tiếng A-ram được đặt chú thích ngay sau “Hê-bơ-rơ”, là vị trí neo chính xác hơn.
  issues:
  - severity: medium
    issue: Thêm “Đức Chúa” trước tên Jêsus
    rationale: Nguyên văn viết “ὁ Ἰησοῦς” (Giê-su), không có danh xưng tương đương “Đức Chúa”. Thêm tước hiệu làm vượt quá nội dung ngữ nghĩa trực tiếp của câu.
  - severity: low
    issue: “bảng được viết” mơ hồ về đối tượng được viết
    rationale: γεγραμμένον quy chiếu đến τίτλος, tức lời/biển thông báo đã được ghi. Trong tiếng Việt, “bảng được viết” có thể gợi vật liệu tấm bảng, trong khi “dòng chữ ấy được viết” diễn đạt trực tiếp nội dung ngôn ngữ.
  - severity: low
    issue: Vị trí chú thích không neo trực tiếp vào “tiếng Hê-bơ-rơ”
    rationale: Chú thích về khả năng “tiếng A-ram” nên được đánh dấu tại thuật ngữ Ἑβραϊστί, thay vì tại “tấm bảng” ở đầu câu.
  revised_text: Vì thế, nhiều người Do Thái đã đọc dòng chữ ấy, vì nơi Giê-su bị đóng đinh ở gần thành; dòng chữ ấy được viết bằng tiếng Hê-bơ-rơ[a], tiếng La-tinh và tiếng Hy Lạp.
