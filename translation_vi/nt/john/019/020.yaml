revisions:
- from: Vì vậy, nhiều người Do Thái đã đọc tấm bảng ấy[a], bởi nơi Đức Chúa Jêsus bị đóng đinh ở gần thành; và bảng được viết bằng tiếng Hê-bơ-rơ, tiếng La-tinh và tiếng Hy Lạp.
  to: Vì thế, nhiều người Do Thái đã đọc dòng chữ ấy, vì nơi Giê-su bị đóng đinh ở gần thành; dòng chữ ấy được viết bằng tiếng Hê-bơ-rơ[a], tiếng La-tinh và tiếng Hy Lạp.
  rationale: Bản sửa giữ sát τίτλος là nội dung thông báo được đọc và được viết, loại bỏ tước hiệu không có trong câu tiếng Hy Lạp, đồng thời chuyển chú thích về Ἑβραϊστί đến đúng vị trí từ được chú giải. Không thay đổi ý nghĩa, quan hệ nguyên nhân, hay sự mơ hồ lịch sử-ngôn ngữ của nguyên văn.
  reviewer_model: gpt-5.6-terra
