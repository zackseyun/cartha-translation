id: JHN.19.20
reference: John 19:20
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τοῦτον οὖν τὸν τίτλον πολλοὶ ἀνέγνωσαν τῶν Ἰουδαίων, ὅτι ἐγγὺς ἦν ὁ τόπος τῆς πόλεως ὅπου ἐσταυρώθη ὁ Ἰησοῦς· καὶ ἦν γεγραμμένον Ἑβραϊστί, ⸂Ῥωμαϊστί, Ἑλληνιστί⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/020.yaml
  text: Therefore many of the Jews read this inscription[a], because the place where Jesus was crucified was near the city; and it was written in Hebrew, in Latin, and in Greek.
translation:
  language: vi
  text: Vì thế, nhiều người Do Thái đã đọc dòng chữ ấy, vì nơi Giê-su bị đóng đinh ở gần thành; dòng chữ ấy được viết bằng tiếng Hê-bơ-rơ[a], tiếng La-tinh và tiếng Hy Lạp.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể hiểu là “tiếng A-ram”; trong sách Giăng, “Hê-bơ-rơ” có thể chỉ ngôn ngữ Sê-mít địa phương.
    reason: lexical_alternative
lexical_decisions:
- source_word: τίτλον
  choice: tấm bảng
  rationale: Trong bối cảnh đóng đinh, từ này chỉ tấm bảng có ghi nội dung được đặt trên thập tự giá; cách dịch này tự nhiên và cụ thể trong tiếng Việt.
- source_word: πολλοὶ ... τῶν Ἰουδαίων
  choice: nhiều người Do Thái
  rationale: Diễn đạt tự nhiên ý nghĩa bộ phận của kết cấu Hy Lạp, không hàm ý toàn thể người Do Thái.
- source_word: ἀνέγνωσαν
  choice: đã đọc
  rationale: Truyền đạt hành động đọc đơn thuần; nguyên văn không buộc phải hiểu là đọc thành tiếng.
- source_word: ἐγγὺς ἦν ὁ τόπος τῆς πόλεως
  choice: nơi ... ở gần thành
  rationale: Giữ đúng ý vị trí gần thành mà không thêm chi tiết như cổng thành.
- source_word: ὅπου ἐσταυρώθη ὁ Ἰησοῦς
  choice: nơi Đức Chúa Jêsus bị đóng đinh
  rationale: Giữ thể bị động của nguyên văn và không thêm tác nhân.
- source_word: γεγραμμένον
  choice: bảng được viết
  rationale: Diễn đạt trạng thái nội dung đã được viết trên bảng một cách rõ ràng, tự nhiên.
- source_word: Ἑβραϊστί
  choice: bằng tiếng Hê-bơ-rơ
  rationale: Giữ cách gọi trực tiếp của nguyên văn; khả năng từ này chỉ tiếng A-ram được nêu trong chú thích.
- source_word: Ῥωμαϊστί
  choice: bằng tiếng La-tinh
  rationale: Từ Hy Lạp theo nghĩa đen là 'theo tiếng Rô-ma', nhưng ngôn ngữ được chỉ đến là tiếng La-tinh.
- source_word: Ἑλληνιστί
  choice: bằng tiếng Hy Lạp
  rationale: Cách dịch trực tiếp, chuẩn xác tên ngôn ngữ.
- source_word: οὖν
  choice: Vì vậy
  rationale: Giữ mối liên hệ suy luận và tường thuật với câu trước.
theological_decisions:
- issue: Cách hiểu Ἑβραϊστί trong văn phong Giăng
  choice: tiếng Hê-bơ-rơ trong chính văn
  alternative: tiếng A-ram
  rationale: Nguyên văn gọi là 'Hê-bơ-rơ', nên chính văn giữ cách gọi ấy; tuy nhiên, trong cách dùng thời đó và trong sách Giăng, từ này có thể chỉ ngôn ngữ Sê-mít địa phương, tức tiếng A-ram, nên giữ khả năng đó trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “thành” theo lối kể Kinh Thánh tự nhiên, chỉ Giê-ru-sa-lem từ ngữ cảnh. Danh xưng “Đức Chúa Jêsus” phù hợp văn phong Kinh Thánh Tin Lành tiếng Việt; câu vẫn giữ cấu trúc và quan hệ ý nghĩa của nguyên văn.
