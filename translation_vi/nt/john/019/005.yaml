id: JHN.19.5
reference: John 19:5
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐξῆλθεν οὖν ὁ Ἰησοῦς ἔξω, φορῶν τὸν ἀκάνθινον στέφανον καὶ τὸ πορφυροῦν ἱμάτιον. καὶ λέγει αὐτοῖς· ⸀Ἰδοὺ ὁ ἄνθρωπος.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/005.yaml
  text: So Jesus came out[a], wearing the crown of thorns and the purple robe. And he says to them, “Behold, the man.”
translation:
  language: vi
  text: 'Vậy, Đức Giê-su bước ra ngoài, đội vương miện bằng gai và khoác áo choàng màu tía. Phi-lát nói với họ: “Kìa, người này!”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Hãy nhìn người này!” Từ Hy Lạp Ἰδού là lời gọi sự chú ý, có thể được dịch là “Kìa,” “Hãy nhìn,” hoặc “Hãy xem.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθεν οὖν ... ἔξω
  choice: Vậy, ... bước ra ngoài
  rationale: “Bước ra ngoài” diễn đạt tự nhiên chuyển động hướng ra được nhấn mạnh bởi cả ἐξῆλθεν và ἔξω; “Vậy” giữ quan hệ tiếp nối/kết quả của οὖν.
- source_word: φορῶν
  choice: đội ... và khoác
  rationale: 'Tiếng Việt thường dùng động từ riêng theo vật được mang trên người: “đội” với vương miện và “khoác” với áo choàng. Cách diễn đạt này tự nhiên mà vẫn giữ hành động đồng thời của phân từ.'
- source_word: τὸν ἀκάνθινον στέφανον
  choice: vương miện bằng gai
  rationale: στέφανος trong cảnh chế giễu vương quyền là vương miện, còn ἀκάνθινος cho biết nó được làm bằng gai. Cách dịch này rõ nghĩa hơn “mão gai” đối với độc giả hiện đại.
- source_word: τὸ πορφυροῦν ἱμάτιον
  choice: áo choàng màu tía
  rationale: ἱμάτιον chỉ áo ngoài; “áo choàng” phù hợp ngữ cảnh mặc giả làm vua mà không xác định quá mức kiểu áo. “Màu tía” giữ sắc thái lịch sử của πορφυροῦν.
- source_word: λέγει αὐτοῖς
  choice: Phi-lát nói với họ
  rationale: Động từ hiện tại lịch sử được diễn đạt bằng hiện tại không đánh dấu trong tiếng Việt. Chủ ngữ ngầm được nêu là Phi-lát theo ngữ cảnh để câu rõ ràng, không thay đổi nhân vật phát ngôn.
- source_word: Ἰδοὺ
  choice: Kìa
  rationale: “Kìa” là lời gọi sự chú ý tự nhiên, trang trọng vừa phải, phù hợp hành động Phi-lát đưa Đức Giê-su ra trước đám đông.
- source_word: ὁ ἄνθρωπος
  choice: người này
  rationale: Cụm từ chỉ chính Đức Giê-su đang được đưa ra trước mặt mọi người. “Người này” tự nhiên trong tiếng Việt và không biến câu thành một khẳng định nhân học rộng hơn.
theological_decisions:
- issue: Cách dịch ὁ ἄνθρωπος trong lời Phi-lát
  choice: người này
  alternative: con người; người đàn ông này
  rationale: “Người này” giữ quy chiếu cụ thể đến Đức Giê-su và lời giới thiệu công khai của Phi-lát. Không dùng “con người” để tránh áp đặt hàm ý về nhân loại nói chung hoặc tước hiệu “Con Người”; cũng không cần thêm “đàn ông,” vì giới tính và nhân vật đã rõ trong ngữ cảnh.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang nghiêm nhưng dễ hiểu. Dùng “Đức Giê-su” và “Phi-lát” theo lối viết tên riêng quen thuộc trong Kinh Thánh tiếng Việt; cấu trúc “đội ... và khoác ...” tạo hình ảnh rõ ràng, tự nhiên.
