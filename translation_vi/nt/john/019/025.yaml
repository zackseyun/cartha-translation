    rationale: SBLGNT có τοῦ Ἰησοῦ, nghĩa là “của Giê-su”, không có κύριος (“Chúa”). Bản dịch tối ưu tương đương không nên thêm tước hiệu không hiện diện trong câu nguồn.
  - severity: low
    issue: “chị hay em gái” có thể chỉnh thành “chị hoặc em gái”.
    rationale: Cả hai đều trung thành với ἀδελφή, vốn không cho biết lớn hay nhỏ tuổi; “hoặc” có sắc thái liệt kê/trung tính hơn trong văn xuôi hiện đại.
