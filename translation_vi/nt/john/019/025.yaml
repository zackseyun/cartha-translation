revisions:
- from: Đứng bên thập tự giá của Chúa Giê-su có mẹ Ngài, chị hay em gái của mẹ Ngài, Ma-ri, vợ của Clô-pa[a], và Ma-ri Ma-đơ-len.[b]
  to: Đứng bên thập tự giá của Giê-su có mẹ Ngài, chị hoặc em gái của mẹ Ngài, Ma-ri, vợ của Clô-pa[a], và Ma-ri Ma-đơ-len.[b]
  rationale: Bản sửa chỉ loại bỏ danh xưng “Chúa”, vốn không có trong nguyên văn, và điều chỉnh nhẹ liên từ trong “chị hoặc em gái”. Chú thích về quan hệ của Ma-ri với Clô-pa và cách đếm ba hay bốn phụ nữ được giữ nguyên về nội dung, nhờ đó không áp đặt một cách giải thích lên cú pháp Hy Lạp cô đọng.
  reviewer_model: gpt-5.6-terra
