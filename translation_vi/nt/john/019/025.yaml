source:
  edition: SBLGNT
  text: Εἱστήκεισαν δὲ παρὰ τῷ σταυρῷ τοῦ Ἰησοῦ ἡ μήτηρ αὐτοῦ καὶ ἡ ἀδελφὴ τῆς μητρὸς αὐτοῦ, Μαρία ἡ τοῦ Κλωπᾶ καὶ Μαρία ἡ Μαγδαληνή.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/025.yaml
  text: Standing by the cross of Jesus were his mother[a], and his mother's sister, Mary the wife of Clopas[b], and Mary Magdalene.
translation:
  language: vi
  text: Đứng bên thập tự giá của Giê-su có mẹ Ngài, chị hoặc em gái của mẹ Ngài, Ma-ri, vợ của Clô-pa[a], và Ma-ri Ma-đơ-len.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “Ma-ri của Clô-pa”. Tiếng Hy Lạp không nói rõ bà có quan hệ gì với Clô-pa, dù cách hiểu “vợ của Clô-pa” khá phổ biến.
    reason: lexical_alternative
  - marker: b
    text: Câu này cũng có thể được hiểu là kể tên ba người phụ nữ thay vì bốn, nếu “chị hoặc em gái của mẹ Ngài” và “Ma-ri của Clô-pa” là cùng một người.
    reason: alternative_reading
lexical_decisions:
- source_word: Εἱστήκεισαν
  choice: Đứng ... có
  rationale: Diễn tả tư thế đang đứng và trạng thái kéo dài trong bối cảnh, đồng thời giữ câu tiếng Việt tự nhiên.
- source_word: δὲ
  choice: không dịch thành một từ riêng
  rationale: Ở đây δέ chủ yếu đánh dấu sự chuyển tiếp nhẹ trong trình thuật; mạch câu tiếng Việt đã thể hiện sự chuyển cảnh mà không cần thêm “bấy giờ” hay một từ chỉ thời gian không có trong nguyên văn.
- source_word: παρὰ τῷ σταυρῷ τοῦ Ἰησοῦ
  choice: bên thập tự giá của Chúa Giê-su
  rationale: παρά với cách dữ cách chỉ vị trí gần hoặc sát bên; cụm sở hữu được giữ theo nguyên văn.
- source_word: ἡ ἀδελφὴ τῆς μητρὸς αὐτοῦ
  choice: chị hay em gái của mẹ Ngài
  rationale: ἀδελφή chỉ người nữ cùng cha mẹ hoặc có quan hệ chị em nhưng không cho biết lớn hay nhỏ tuổi; cách dịch tránh tự ý chọn “chị” hoặc “em”.
- source_word: Μαρία ἡ τοῦ Κλωπᾶ
  choice: Ma-ri, vợ của Clô-pa
  rationale: Cấu trúc mạo từ cộng sở hữu cách xác định Ma-ri qua quan hệ với Clô-pa; hiểu là quan hệ vợ chồng là cách đọc phổ biến, nhưng nguyên văn không nói rõ “vợ”, nên có chú thích.
- source_word: Μαρία ἡ Μαγδαληνή
  choice: Ma-ri Ma-đơ-len
  rationale: Cách gọi quen thuộc trong tiếng Việt dành cho Ma-ri quê ở Ma-đa-la.
theological_decisions:
- issue: Số người phụ nữ được nhắc đến bên thập tự giá
  choice: 'Dịch theo cách hiểu có bốn người: mẹ Chúa Giê-su, chị hoặc em gái của bà, Ma-ri vợ Clô-pa, và Ma-ri Ma-đơ-len.'
  alternative: Có thể hiểu là ba người nếu “chị hay em gái của mẹ Ngài” chính là “Ma-ri của Clô-pa”.
  rationale: Cú pháp Hy Lạp cô đọng và không có dấu câu trong bản thảo cổ, nên cả hai cách phân nhóm đều có thể được cân nhắc. Bản dịch theo cách liệt kê bốn người nhưng giữ cách đọc ba người trong chú thích.
translation_notes:
  register: Ngôn ngữ hiện đại, trang trọng và dễ hiểu. Dùng “chị hay em gái” để không áp đặt thứ bậc tuổi tác mà từ Hy Lạp không xác định; dùng các dạng tên phiên âm quen thuộc trong tiếng Việt.
