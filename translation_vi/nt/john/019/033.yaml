  to: Nhưng khi họ đến chỗ Đức Giê-su[a], thấy Người đã chết[b], họ không bẻ gãy chân Người.
  rationale: Sửa tên riêng để không thêm tước hiệu không có trong nguyên văn và dùng chính tả hiện đại “Giê-su”. Đổi “đánh gãy” thành “bẻ gãy” cho cách diễn đạt trực tiếp, tự nhiên. Chỉnh chú thích [b] để nêu phương án cú pháp phù hợp với ὡς εἶδον, đồng thời giữ cách nói trực tiếp “đã chết” của nguồn.
