source:
  edition: SBLGNT
  text: ἐπὶ δὲ τὸν Ἰησοῦν ἐλθόντες, ὡς εἶδον ⸂ἤδη αὐτὸν⸃ τεθνηκότα, οὐ κατέαξαν αὐτοῦ τὰ σκέλη,
base_translation:
  language: en
  yaml_path: translation/nt/john/019/033.yaml
  text: But when they came to Jesus[a], seeing that he was already dead[b], they did not break his legs.
translation:
  language: vi
  text: Nhưng khi họ đến chỗ Đức Giê-su[a], thấy Người đã chết[b], họ không bẻ gãy chân Người.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Về sau, Giăng liên hệ việc này với lời Kinh Thánh: “Không một xương nào của Người sẽ bị gãy” (Giăng 19:36; xem thêm Xuất Ai Cập 12:46; Dân Số 9:12; Thi Thiên 34:20).'
    reason: cross_reference
  - marker: b
    text: 'Hoặc: “khi họ thấy Người đã chết.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπὶ δὲ τὸν Ἰησοῦν ἐλθόντες
  choice: Nhưng khi đến chỗ Đức Chúa Jêsus
  rationale: Cụm phân từ được chuyển thành mệnh đề thời gian tự nhiên trong tiếng Việt. “Nhưng” thể hiện sắc thái tương phản nhẹ của δέ với việc những người lính vừa làm cho hai người kia, còn “đến chỗ” giữ ý chuyển động hướng tới Đức Chúa Jêsus.
- source_word: ὡς εἶδον
  choice: thấy
  rationale: Trong ngữ cảnh này, ὡς εἶδον nêu hoàn cảnh và căn cứ khiến họ không đánh gãy chân Ngài. “Thấy” diễn đạt gọn, tự nhiên cả sự nhận biết lẫn mối liên hệ với hành động tiếp theo.
- source_word: ἤδη
  choice: đã
  rationale: ἤδη cho biết cái chết đã xảy ra trước lúc họ đến. Trong kết cấu “đã chết”, tiếng Việt diễn đạt ý này tự nhiên mà không cần thêm “rồi”.
- source_word: τεθνηκότα
  choice: đã chết
  rationale: Phân từ hoàn thành của θνῄσκω nhấn mạnh trạng thái sau khi chết. “Đã chết” vừa diễn tả biến cố đã xảy ra vừa nêu rõ trạng thái mà những người lính quan sát thấy.
- source_word: οὐ κατέαξαν
  choice: họ không đánh gãy
  rationale: κατάγνυμι ở đây nói đến hành động dùng lực làm gãy chân. “Đánh gãy” rõ nghĩa và phù hợp bối cảnh hành quyết hơn chỉ dùng “bẻ gãy”.
- source_word: τὰ σκέλη
  choice: chân Ngài
  rationale: σκέλη chỉ hai chân. Cách nói tự nhiên trong tiếng Việt là “đánh gãy chân”; không cần đưa “xương” vào câu chính vì từ nguồn dùng σκέλη chứ không dùng từ chỉ xương.
theological_decisions:
- issue: Hàm ý ứng nghiệm Kinh Thánh qua việc chân Đức Chúa Jêsus không bị đánh gãy
  choice: Giữ câu chính như một lời thuật chuyện trực tiếp, không thêm ngôn ngữ về sự ứng nghiệm; ghi mối liên hệ Kinh Thánh trong chú thích [a].
  alternative: Dùng “xương chân” hoặc thêm lời nói rõ đây là sự ứng nghiệm lời Kinh Thánh.
  rationale: Giăng 19:36 mới trực tiếp giải thích sự việc này là ứng nghiệm Kinh Thánh. Câu 33 chỉ thuật lại điều những người lính đã làm, nên bản dịch không nên nói trước phần giải thích của tác giả.
- issue: Trạng thái “đã chết” và biến cố “đã chết” trong τεθνηκότα
  choice: Dùng “đã chết” trong câu chính và giữ cách diễn đạt “đã qua đời” như một khả năng trong chú thích [b].
  alternative: Dịch “đã qua đời” ngay trong câu chính.
  rationale: “Đã chết” thể hiện trực tiếp trạng thái kết quả của phân từ hoàn thành, còn chú thích bảo tồn khả năng diễn đạt theo hướng biến cố mà không áp đặt một cách hiểu độc nhất.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Jêsus” và đại từ tôn kính “Ngài” theo văn phong Kinh Thánh tiếng Việt; cấu trúc câu bám sát diễn tiến của bản Hy Lạp nhưng vẫn tự nhiên trong tiếng Việt.
