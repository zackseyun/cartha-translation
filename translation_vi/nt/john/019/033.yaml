  - severity: low
    issue: “Đánh gãy chân” không phải cách diễn đạt sát và trung tính nhất cho κατέαξαν trong câu này.
    rationale: “Bẻ gãy chân” diễn đạt trực tiếp hành động làm gãy các chân mà không hàm ý một phương thức cụ thể.
  - severity: low
    issue: Chú thích [b] dùng “qua đời” như thể là phương án dịch từ vựng.
    rationale: “Qua đời” là uyển ngữ tiếng Việt, không bảo tồn trực tiếp sắc thái của τεθνηκότα. Phương án “khi họ thấy Người đã chết” phản ánh cách phân tích ὡς εἶδον rõ hơn.
