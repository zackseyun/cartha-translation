review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp phản ánh đúng trình tự và nội dung Hy Lạp: đến với Chúa Giê-su, thấy Người đã chết, nên không làm gãy chân Người. Tuy nhiên, “Đức Chúa Jêsus” thêm tước hiệu “Chúa” không có trong Ἰησοῦν ở câu này. Cần dùng tên không thêm tước hiệu để giữ đúng mức độ diễn đạt của nguồn.'
  naturalness: Câu được sửa vẫn tự nhiên, trang trọng, và rõ chủ ngữ trong tiếng Việt hiện đại. “Bẻ gãy chân” là cách nói trực tiếp, thông dụng hơn “đánh gãy chân” khi bản văn không nêu dụng cụ hay cú đánh.
  terminology: Chuẩn hóa tên thành “Đức Giê-su”, tránh lối chính tả/tên riêng mang tính truyền thống hệ phái “Jêsus” và tránh thêm “Chúa”. Chú thích [b] nên nêu một phương án cú pháp thực sự, thay vì thay “chết” bằng uyển ngữ “qua đời”.
  issues:
