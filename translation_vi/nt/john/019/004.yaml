- from: 'Phi-lát lại đi ra ngoài và nói với họ: “Này, tôi đưa người ấy ra cho các người để các người biết rằng tôi không tìm thấy lý do nào để kết tội người.”[a]'
  to: 'Phi-lát lại đi ra ngoài và nói với họ: “Này, tôi đưa người ấy ra cho các ông để các ông biết rằng tôi không thấy nơi người ấy có căn cứ nào để buộc tội.”[a]'
  rationale: Bản sửa làm rõ nghĩa tư pháp của αἰτία mà không chuyển lời Phi-lát thành phán quyết kết án; đồng thời thống nhất đại từ quy chiếu, dùng cách xưng hô số nhiều tự nhiên hơn, và sửa câu chú thích cho chuẩn tiếng Việt. Các yếu tố “lại,” “đi ra ngoài,” “Này,” “đưa ... ra,” và quan hệ mục đích “để ... biết” đều được giữ.
