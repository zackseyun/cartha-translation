  text: ⸂καὶ ἐξῆλθεν⸃ πάλιν ἔξω ὁ Πιλᾶτος καὶ λέγει αὐτοῖς· Ἴδε ἄγω ὑμῖν αὐτὸν ἔξω, ἵνα γνῶτε ὅτι ⸂οὐδεμίαν αἰτίαν εὑρίσκω ἐν αὐτῷ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/004.yaml
  text: Then Pilate went outside again and said to them[a], “Look, I am bringing him out to you so that you may know that I find no case against him.”
translation:
  language: vi
  text: 'Phi-lát lại đi ra ngoài và nói với họ: “Này, tôi đưa người ấy ra cho các ông để các ông biết rằng tôi không thấy nơi người ấy có căn cứ nào để buộc tội.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Tôi không thấy người ấy có lỗi gì.” Từ Hy Lạp ở đây mang sắc thái pháp lý, chỉ một lý do hoặc căn cứ để buộc tội.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθεν ... ἔξω
  choice: đi ra ngoài
  rationale: Diễn đạt tự nhiên chuyển động từ bên trong ra bên ngoài; không lặp ý vụng về như cấu trúc Hy Lạp.
- source_word: πάλιν
  choice: lại
  rationale: Đánh dấu hành động được lặp lại trong mạch tường thuật.
- source_word: λέγει
  choice: nói
  rationale: Hiện tại lịch sử trong tiếng Hy Lạp được chuyển thành lối kể tự nhiên của tiếng Việt; hình thức động từ tiếng Việt không cần đánh dấu thì.
- source_word: Ἴδε
  choice: Này
  rationale: Là lời gọi sự chú ý trực tiếp, trang trọng vừa phải và tự nhiên trong lời nói.
- source_word: ἄγω ... αὐτὸν ἔξω
  choice: tôi đưa người ấy ra
  rationale: ἄγω có thể là dẫn hoặc đưa; trong cảnh Phi-lát đem Đức Giê-su ra trình diện đám đông, “đưa ... ra” rõ và tự nhiên.
- source_word: ἵνα γνῶτε
  choice: để các người biết
  rationale: Giữ rõ ý mục đích của ἵνα cùng động từ giả định γνῶτε.
- source_word: οὐδεμίαν αἰτίαν εὑρίσκω ἐν αὐτῷ
  choice: tôi không tìm thấy lý do nào để kết tội người
  rationale: αἰτία trong bối cảnh xét xử chỉ căn cứ pháp lý cho lời buộc tội. Cách dịch này truyền đạt sắc thái tư pháp và tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Cách diễn đạt lời tuyên bố pháp lý của Phi-lát về Đức Giê-su
  choice: tôi không tìm thấy lý do nào để kết tội người
  alternative: tôi không thấy người có tội gì
  rationale: Bản dịch giữ trọng tâm ở kết luận tư pháp của Phi-lát, không mở rộng câu này thành một tuyên bố thần học bao quát, đồng thời vẫn để hàm ý về sự vô tội của Đức Giê-su hiện lên trong câu chuyện.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “người ấy/người” làm đại từ quy chiếu theo lời Phi-lát, tránh thêm tước hiệu không có trong câu Hy Lạp. “Các người” phản ánh số nhiều của ὑμῖν và γνῶτε, đồng thời phù hợp với lời của viên tổng trấn nói với đám đông.
