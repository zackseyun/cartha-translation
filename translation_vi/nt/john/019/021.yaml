id: JHN.19.21
reference: John 19:21
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἔλεγον οὖν τῷ Πιλάτῳ οἱ ἀρχιερεῖς τῶν Ἰουδαίων· Μὴ γράφε· Ὁ βασιλεὺς τῶν Ἰουδαίων, ἀλλ’ ὅτι ἐκεῖνος εἶπεν Βασιλεὺς ⸂τῶν Ἰουδαίων εἰμί⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/021.yaml
  text: So the chief priests of the Jews were saying to Pilate[a], “Do not write, ‘The King of the Jews,’ but that he said[b], ‘I am King of the Jews.’”
translation:
  language: vi
  text: 'Vậy, các thượng tế của người Do Thái[a] nói với Phi-lát: “Đừng viết: ‘Vua dân Do Thái,’ nhưng hãy viết: ‘Người ấy đã nói: “Ta là Vua dân Do Thái[b].”’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “người Giu-đê” hoặc, trong danh hiệu, “Vua dân Giu-đê.” Từ Hy Lạp có thể chỉ người Do Thái nói chung hoặc người thuộc vùng Giu-đê nói riêng, tùy ngữ cảnh.
    reason: alternative_reading
  - marker: b
    text: Trong câu “Ta là Vua dân Do Thái,” tiếng Hy Lạp không có mạo từ trước từ “Vua.” Tiếng Việt không có hệ thống mạo từ tương ứng; cũng có thể diễn đạt là “Ta là vị Vua của dân Do Thái.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγον
  choice: nói với
  rationale: Thì vị hoàn thành diễn tả hành động đang diễn ra hoặc được lặp lại. Tiếng Việt không bắt buộc đánh dấu thì; trong mạch tường thuật, “nói với” tự nhiên hơn “đã nói,” đồng thời không loại trừ sắc thái kéo dài.
- source_word: οὖν
  choice: Vậy
  rationale: Giữ chức năng nối tiếp và suy ra trong diễn tiến câu chuyện bằng một từ nối tự nhiên trong tiếng Việt hiện đại.
- source_word: ἀρχιερεῖς
  choice: các thượng tế
  rationale: Chỉ giới lãnh đạo tư tế; số nhiều không có nghĩa là nhiều người cùng giữ duy nhất chức vụ thượng tế tại một thời điểm.
- source_word: τῶν Ἰουδαίων
  choice: của người Do Thái / dân Do Thái
  rationale: “Người Do Thái” phù hợp khi nói về nhóm người và “dân Do Thái” tự nhiên trong tước hiệu chính trị “Vua dân Do Thái.” Khả năng hiểu là “người Giu-đê/dân Giu-đê” được giữ trong chú thích.
- source_word: Μὴ γράφε
  choice: Đừng viết
  rationale: Truyền đạt trực tiếp mệnh lệnh phủ định ở hiện tại, tự nhiên và sát nghĩa.
- source_word: Ὁ βασιλεὺς τῶν Ἰουδαίων
  choice: Vua dân Do Thái
  rationale: Giữ nguyên nội dung danh hiệu trên tấm biển; tiếng Việt không cần mạo từ xác định tương ứng với ὁ.
- source_word: ἀλλ’ ὅτι
  choice: nhưng hãy viết rằng
  rationale: Làm rõ sự sửa đổi mà các thượng tế yêu cầu. Động từ “viết” được lặp lại theo yêu cầu của cú pháp tiếng Việt, dù trong tiếng Hy Lạp nó được hiểu ngầm sau liên từ tương phản.
- source_word: ἐκεῖνος
  choice: người ấy
  rationale: Giữ lực chỉ định và một mức độ xa cách của đại từ Hy Lạp mà không áp đặt sắc thái khinh miệt quá mạnh như “kẻ ấy.”
- source_word: εἶπεν
  choice: đã nói
  rationale: Dịch đúng động từ phát ngôn, không thêm sắc thái diễn giải như “tuyên bố” hay “tự xưng.”
- source_word: Βασιλεὺς τῶν Ἰουδαίων εἰμί
  choice: Ta là Vua dân Do Thái
  rationale: Trật tự tiếng Việt tự nhiên, giữ tước hiệu vị ngữ. “Ta” phù hợp với lời tự thuật của một người nam trong bối cảnh trang trọng; tiếng Việt không biểu thị đối lập có hay không có mạo từ như tiếng Hy Lạp.
theological_decisions:
- issue: Cách dịch Ἰουδαῖος/Ἰουδαίων trong trình thuật thương khó của Giăng
  choice: người Do Thái / dân Do Thái
  alternative: người Giu-đê / dân Giu-đê
  rationale: Ngữ cảnh trực tiếp là danh hiệu công khai và chính trị “Vua dân Do Thái,” nên cách dịch quen thuộc này rõ ràng và tự nhiên. Tuy nhiên, từ Hy Lạp cũng có thể chỉ người Giu-đê theo nghĩa địa lý; chú thích giữ lại khả năng đó để không thu hẹp sự mơ hồ có thật.
- issue: Mạo từ trong lời được gán cho Đức Chúa Giê-su
  choice: Ta là Vua dân Do Thái
  alternative: Ta là vị Vua của dân Do Thái
  rationale: Danh từ βασιλεύς trong mệnh đề vị ngữ không có mạo từ, nhưng sự khác biệt này không thể hiện trực tiếp như trong tiếng Anh. Bản dịch chính tránh tự ý thêm “vị” hoặc “của,” còn chú thích giải thích vấn đề ngữ pháp.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Phi-lát,” “thượng tế,” và “Vua dân Do Thái” theo lối gọi quen thuộc trong tiếng Việt Kinh Thánh; dấu ngoặc kép phân tầng làm rõ lời nói và nội dung tấm biển.
