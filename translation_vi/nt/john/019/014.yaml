id: JHN.19.14
reference: John 19:14
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἦν δὲ παρασκευὴ τοῦ πάσχα, ὥρα ⸂ἦν ὡς⸃ ἕκτη. καὶ λέγει τοῖς Ἰουδαίοις· Ἴδε ὁ βασιλεὺς ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/014.yaml
  text: It was the day of preparation of the Passover[a]; it was about the sixth hour. And he says to the Jews, “Behold[b], your king!”
translation:
  language: vi
  text: 'Hôm ấy là ngày chuẩn bị cho lễ Vượt Qua; lúc đó vào khoảng giờ thứ sáu.[a] Ông nói với người Do Thái[b]: “Kìa, vua của các người!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tùy theo cách tính giờ, theo cách nói hiện đại có thể là “khoảng giữa trưa”.
    reason: cultural_note
  - marker: b
    text: Trong ngữ cảnh này, “người Do Thái” có thể chỉ cụ thể hơn các nhà chức trách tại Giu-đê hoặc giới lãnh đạo Do Thái.
    reason: alternative_reading
lexical_decisions:
- source_word: παρασκευὴ τοῦ πάσχα
  choice: ngày chuẩn bị cho lễ Vượt Qua
  rationale: Diễn đạt tự nhiên chức năng thời gian của παρασκευή, đồng thời giữ mối liên hệ của cụm sở hữu τοῦ πάσχα mà không quyết định quá mức ngày này được tính chính xác thế nào trong lịch lễ.
- source_word: ὥρα ἦν ὡς ἕκτη
  choice: lúc đó vào khoảng giờ thứ sáu
  rationale: Giữ cách tính giờ của văn hóa nguồn và sắc thái ước chừng của ὡς; cách quy đổi sang giờ hiện đại được nêu trong chú thích.
- source_word: λέγει
  choice: nói
  rationale: Tiếng Việt không buộc đánh dấu thì ở động từ; cách dịch này tự nhiên và không làm mất lối kể sống động bằng hiện tại lịch sử của Giăng.
- source_word: τοῖς Ἰουδαίοις
  choice: với người Do Thái
  rationale: Giữ nghĩa trực tiếp của cụm từ Hy Lạp, không tự ý thu hẹp thành giới lãnh đạo, nhưng ghi nhận khả năng ấy trong chú thích theo ngữ cảnh.
- source_word: Ἴδε
  choice: Kìa
  rationale: Là lời chỉ dẫn gây chú ý, phù hợp với việc Phi-lát công khai đưa Đức Giê-su ra trước đám đông và giữ được sắc thái trang trọng, châm biếm của câu.
- source_word: ὁ βασιλεὺς ὑμῶν
  choice: vua của các người
  rationale: Giữ đại từ sở hữu số nhiều cùng sức nặng chính trị và sắc thái châm biếm trong lời tuyên bố.
theological_decisions:
- issue: Đối tượng của cụm “người Do Thái” trong sách Giăng
  choice: Giữ “người Do Thái” trong chính văn
  alternative: giới lãnh đạo Do Thái; người Giu-đê
  rationale: τοῖς Ἰουδαίοις không tự nó thu hẹp đối tượng. Chú thích bảo lưu khả năng ngữ cảnh nói cụ thể hơn đến nhà chức trách hoặc giới lãnh đạo Do Thái.
- issue: Cách hiểu “giờ thứ sáu”
  choice: Giữ cách ghi giờ cổ trong chính văn
  alternative: khoảng giữa trưa
  rationale: Cách dịch này bảo toàn hình thức và tính ước chừng của nguyên văn, không giải quyết thay độc giả vấn đề hệ thống tính giờ; cách quy đổi khả dĩ được đưa vào chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Hôm ấy” diễn đạt tự nhiên mệnh đề thời gian mà không thêm một từ nối tương đương “bây giờ”. Đại từ “Ông” giữ chủ thể ngầm của λέγει theo ngữ cảnh trước đó, thay vì nêu đích danh Phi-lát khi nguyên văn không lặp lại tên.
