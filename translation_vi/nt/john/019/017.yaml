  terminology: “Thập tự giá,” “Nơi Sọ,” “Hê-bơ-rơ,” và “Gôn-gô-tha” phù hợp với thuật ngữ Kinh Thánh tiếng Việt. Chú thích nên dùng dạng Việt hóa nhất quán “Xê-mít” thay cho “Semit”.
