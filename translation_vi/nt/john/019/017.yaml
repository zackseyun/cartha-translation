  source_fidelity: 'Bản dịch truyền đạt đúng các yếu tố chính: Chúa Giê-su tự mình mang/vác thập tự giá, đi ra tới địa điểm được gọi là Nơi Sọ, và tên Gôn-gô-tha được nêu theo cách gọi “trong tiếng Hê-bơ-rơ”. Tuy nhiên, giới từ εἰς (“đến/tới”) nên được thể hiện rõ để tránh việc “đi ra nơi” bị hiểu là chỉ rời khỏi nơi ấy.'
