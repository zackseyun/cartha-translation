source:
  edition: SBLGNT
  text: καὶ βαστάζων ⸂αὑτῷ τὸν σταυρὸν⸃ ἐξῆλθεν εἰς ⸀τὸν λεγόμενον Κρανίου Τόπον, ⸀ὃ λέγεται Ἑβραϊστὶ Γολγοθα,
base_translation:
  language: en
  yaml_path: translation/nt/john/019/017.yaml
  text: And carrying the cross by himself[a], he went out to the place called Skull Place, which in Hebrew is called Golgotha.
translation:
  language: vi
  text: Ngài tự mình vác thập tự giá và đi ra đến nơi gọi là Nơi Sọ, mà trong tiếng Hê-bơ-rơ[a] gọi là Gôn-gô-tha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể hiểu là “trong tiếng A-ram”. Từ Giăng dùng, theo nghĩa đen là “trong tiếng Hê-bơ-rơ”, có thể chỉ ngôn ngữ Xê-mít địa phương tại Giu-đê.
    reason: lexical_alternative
lexical_decisions:
- source_word: βαστάζων
  choice: vác
  rationale: Động từ chỉ hành động mang một vật nặng; “vác” tự nhiên và cụ thể trong ngữ cảnh thập tự giá.
- source_word: αὑτῷ τὸν σταυρόν
  choice: tự mình vác thập tự giá
  rationale: 'Cách diễn đạt này giữ lực nhấn mạnh của đại từ phản thân αὑτῷ: chính Chúa Giê-su thực hiện việc vác, mà không biến cấu trúc ấy thành một sở hữu từ không nhất thiết có trong tiếng Hy Lạp.'
- source_word: σταυρός
  choice: thập tự giá
  rationale: Đây là từ tương đương chuẩn, rõ nghĩa trong ngữ cảnh thương khó; tiếng Hy Lạp ở đây không buộc phải thu hẹp thành “thanh ngang”.
- source_word: ἐξῆλθεν
  choice: đi ra
  rationale: Diễn đạt trực tiếp nghĩa của động từ và phù hợp với tiếng Việt hiện đại.
- source_word: τὸν λεγόμενον Κρανίου Τόπον
  choice: nơi gọi là Nơi Sọ
  rationale: Giữ cả ý “nơi” và tên gọi gắn với “sọ”, đồng thời tránh thêm “đồi”, một chi tiết không có trong nguyên văn.
- source_word: Ἑβραϊστί
  choice: trong tiếng Hê-bơ-rơ
  rationale: Theo sát cách gọi minh nhiên của bản văn Hy Lạp; khả năng từ này chỉ tiếng A-ram địa phương được ghi ở chú thích.
- source_word: Γολγοθα
  choice: Gôn-gô-tha
  rationale: Phiên âm địa danh Semit theo cách rõ ràng, quen thuộc với độc giả tiếng Việt.
theological_decisions:
- issue: Ngôn ngữ được chỉ bởi Ἑβραϊστί
  choice: trong tiếng Hê-bơ-rơ
  alternative: trong tiếng A-ram
  rationale: Bản văn gọi ngôn ngữ ấy là “Hê-bơ-rơ”, nên bản dịch chính giữ nguyên cách gọi này; chú thích bảo tồn khả năng từ ngữ của Giăng có thể chỉ ngôn ngữ Semit địa phương, thường được hiểu là tiếng A-ram.
- issue: Lực nghĩa của αὑτῷ khi Chúa Giê-su vác thập tự giá
  choice: tự mình vác thập tự giá
  alternative: vác thập tự giá của mình
  rationale: Bản dịch nhấn mạnh chính chủ thể vác thập tự giá, phù hợp với đại từ phản thân, nhưng không diễn giải nó thành quan hệ sở hữu.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Dùng “Ngài” để chỉ Chúa Giê-su theo ngữ cảnh liền trước; tránh cách gọi truyền thống “Đồi Sọ” vì nguyên văn không có từ “đồi”. Dấu chú thích được đặt ngay sau cụm từ có vấn đề ngôn ngữ.
