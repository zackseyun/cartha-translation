revisions:
- from: Vậy, sau khi đóng đinh Đức Chúa Jêsus, những người lính lấy áo ngoài của Ngài chia làm bốn phần, mỗi người lính một phần; họ cũng lấy cả áo dài mặc trong. Áo dài ấy không có đường may,[a] được dệt liền từ trên xuống dưới.[b]
  to: Vậy, khi đã đóng đinh Giê-su, các binh lính lấy áo ngoài của Người, chia thành bốn phần, mỗi người lính một phần; rồi họ lấy cả áo trong. Áo trong ấy không đường may,[a] được dệt từ phần trên suốt cả chiếc áo.[b]
  rationale: Bản sửa loại bỏ tước hiệu không có trong tiếng Hy Lạp, chuẩn hóa tên riêng theo tiếng Việt hiện đại, thay cách gọi y phục quá cụ thể bằng “áo trong”, và diễn đạt cấu tạo chiếc áo sát hơn với ἄραφος, ἐκ τῶν ἄνωθεν, và δι’ ὅλου. Các chú thích giữ lại những khả năng diễn đạt hợp lý mà không áp đặt biểu tượng thần học.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T08:26:34Z'
review_pass:
  verdict: revise
  source_fidelity: Cần sửa một số chỗ để bám sát tiếng Hy Lạp hơn. Nguyên văn chỉ có tên Ἰησοῦν, không có tước hiệu “Đức Chúa”; vì vậy “Đức Chúa Jêsus” thêm nội dung. “Áo dài mặc trong” gợi một loại y phục dài theo cách hiểu Việt ngữ và không cần thiết; χιτών được diễn đạt trung tính, rõ nghĩa hơn bằng “áo trong”. Cụm “từ trên xuống dưới” diễn giải hướng dệt; bản chính nên giữ “từ trên ... suốt cả chiếc áo”, còn khả năng hiểu là hướng từ trên xuống có thể để trong chú thích.
  naturalness: 'Bản sửa dùng tiếng Việt hiện đại, tự nhiên và giữ giọng văn trang trọng: “các binh lính”, “áo ngoài”, “áo trong”, “không đường may”. Cấu trúc “chia thành bốn phần, mỗi người lính một phần” phản ánh rõ cách phân chia trong nguyên văn.'
  terminology: Dùng “Giê-su” theo chính tả Việt ngữ hiện đại, không thêm tước hiệu không có trong nguồn. “Áo ngoài” và “áo trong” duy trì sự phân biệt giữa ἱμάτια và χιτών. “Không đường may” dịch trực tiếp ἄραφος, không gán ý nghĩa biểu tượng.
  issues:
  - severity: medium
    issue: “Đức Chúa Jêsus” thêm tước hiệu không có trong nguyên văn.
    rationale: SBLGNT chỉ viết τὸν Ἰησοῦν. Bản dịch không nên bổ sung một danh xưng thần học vào câu khi nguồn không có.
  - severity: medium
    issue: “Áo dài mặc trong” là cách gọi quá cụ thể cho χιτών.
    rationale: χιτών là áo mặc trong/tunic; yếu tố “dài” không được nêu trong câu và có thể gợi hình thức y phục không cần thiết.
  - severity: low
    issue: “được dệt liền từ trên xuống dưới” vừa lặp ý với “không có đường may” vừa diễn giải δι’ ὅλου thành hướng “xuống dưới”.
    rationale: ἐκ τῶν ἄνωθεν ὑφαντὸς δι’ ὅλου nói chiếc áo được dệt từ phần trên xuyên suốt toàn bộ. Hướng từ trên xuống là cách hiểu có cơ sở, nhưng không cần đóng khung trong bản chính.
