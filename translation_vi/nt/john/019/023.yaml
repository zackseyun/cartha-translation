id: JHN.19.23
reference: John 19:23
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οἱ οὖν στρατιῶται ὅτε ἐσταύρωσαν τὸν Ἰησοῦν ἔλαβον τὰ ἱμάτια αὐτοῦ καὶ ἐποίησαν τέσσαρα μέρη, ἑκάστῳ στρατιώτῃ μέρος, καὶ τὸν χιτῶνα. ἦν δὲ ὁ χιτὼν ἄραφος, ἐκ τῶν ἄνωθεν ὑφαντὸς δι’ ὅλου·
base_translation:
  language: en
  yaml_path: translation/nt/john/019/023.yaml
  text: So when the soldiers had crucified Jesus[a], they took his outer garments and made four parts, a part for each soldier, and also the tunic. Now the tunic was seamless[c][b], woven from the top throughout.
translation:
  language: vi
  text: Vậy, khi đã đóng đinh Giê-su, các binh lính lấy áo ngoài của Người, chia thành bốn phần, mỗi người lính một phần; rồi họ lấy cả áo trong. Áo trong ấy không đường may,[a] được dệt từ phần trên suốt cả chiếc áo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “được dệt liền một mảnh suốt cả chiếc áo.”'
    reason: Cụm “không đường may” cùng mô tả tiếp theo có thể được diễn đạt gộp để nhấn mạnh chiếc áo được dệt thành một thể liên tục.
  - marker: b
    text: 'Hoặc: “được dệt từ trên xuống, suốt cả chiếc áo.”'
    reason: ἐκ τῶν ἄνωθεν nghĩa đen là “từ phần trên/từ phía trên”; trong ngữ cảnh y phục, nhiều cách hiểu xem đây là hướng dệt từ phần trên của áo xuống dưới. δι’ ὅλου diễn tả toàn bộ chiếc áo.
lexical_decisions:
- source_word: οἱ οὖν στρατιῶται
  choice: Vậy, ... những người lính
  rationale: οὖν nối tiếp diễn biến câu chuyện; “Vậy” tự nhiên trong văn kể mà không nhấn quá mức quan hệ suy luận.
- source_word: ὅτε ἐσταύρωσαν τὸν Ἰησοῦν
  choice: sau khi đóng đinh Đức Chúa Jêsus
  rationale: ὅτε với động từ aorist đặt việc đóng đinh trước các hành động tiếp theo; “sau khi” diễn đạt rõ trình tự trong tiếng Việt.
- source_word: ἔλαβον τὰ ἱμάτια αὐτοῦ
  choice: lấy áo ngoài của Ngài
  rationale: ἱμάτια có thể chỉ y phục nói chung, nhưng ở đây được phân biệt với χιτών được nêu riêng; “áo ngoài” giữ được sự đối lập ấy.
- source_word: ἐποίησαν τέσσαρα μέρη, ἑκάστῳ στρατιώτῃ μέρος
  choice: chia làm bốn phần, mỗi người lính một phần
  rationale: Diễn đạt sát cấu trúc Hy Lạp và tự nhiên trong tiếng Việt, đồng thời làm rõ bốn phần tương ứng với bốn người lính.
- source_word: καὶ τὸν χιτῶνα
  choice: họ cũng lấy cả áo dài mặc trong
  rationale: χιτών là áo mặc sát thân; cụm “áo dài mặc trong” dễ hiểu hơn từ vay mượn “áo tunic” và phân biệt với áo ngoài.
- source_word: ἦν δὲ ὁ χιτὼν ἄραφος
  choice: Áo dài ấy không có đường may
  rationale: δέ ở đây chuyển sang mô tả chiếc áo hơn là nêu tương phản mạnh; ἄραφος có nghĩa là không có đường may.
- source_word: ἐκ τῶν ἄνωθεν ὑφαντὸς δι’ ὅλου
  choice: được dệt liền từ trên xuống dưới
  rationale: Trong ngữ cảnh y phục, ἄνωθεν chỉ phần trên; δι’ ὅλου nói đến toàn bộ chiều dài hoặc toàn thể chiếc áo. “Dệt liền” truyền đạt việc chiếc áo được dệt như một thể liên tục.
theological_decisions:
- issue: Khả năng diễn giải biểu tượng về chiếc áo không có đường may
  choice: Chỉ dịch theo nghĩa mô tả cấu tạo chiếc áo và hành động của quân lính.
  alternative: Đưa vào bản văn ý nghĩa tượng trưng về phẩm phục tư tế hoặc sự hiệp nhất của Hội Thánh.
  rationale: Câu này không phát biểu trực tiếp ý nghĩa biểu tượng nào; bản dịch không nên thêm một kết luận thần học mà nguyên văn để ngỏ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Jêsus” và đại từ tôn kính “Ngài”; tránh thuật ngữ may mặc xa lạ, đồng thời bảo toàn sự phân biệt giữa ἱμάτια và χιτών.
