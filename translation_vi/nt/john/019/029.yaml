  text: ⸀σκεῦος ἔκειτο ὄξους μεστόν· ⸂σπόγγον οὖν μεστὸν τοῦ⸃ ὄξους ⸀ὑσσώπῳ περιθέντες προσήνεγκαν αὐτοῦ τῷ στόματι.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/029.yaml
  text: A container full of sour wine was lying there[b][a]; so they put a sponge full of the sour wine on hyssop and brought it to his mouth.
translation:
  language: vi
  text: Ở đó có một bình đầy rượu chua[a]. Vậy, họ đặt một miếng bọt biển thấm đầy rượu chua lên cây bài hương[b], rồi đưa đến miệng Ngài.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “giấm.” Từ Hy Lạp có thể chỉ rượu chua hoặc giấm; trong bối cảnh này, có lẽ là loại rượu chua dùng làm thức uống.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể hiểu là “trên một cành bài hương” hoặc “bằng bài hương.” Nguyên văn chỉ nói “trên/bằng bài hương”; hình ảnh chính xác vẫn còn được tranh luận.
    reason: lexical_alternative
lexical_decisions:
- source_word: σκεῦος
  choice: một bình
  rationale: Danh từ chỉ vật chứa nói chung; “bình” tự nhiên trong tiếng Việt mà không xác định quá mức chất liệu hay hình dạng.
- source_word: ἔκειτο
  choice: có đặt ở đó
  rationale: Diễn tả trạng thái vật ấy đang ở tại chỗ; cách nói này tự nhiên hơn “nằm ở đó” đối với một bình chứa.
- source_word: ὄξους
  choice: rượu chua
  rationale: Trong bối cảnh này, từ này có thể chỉ loại rượu đã chua dùng làm thức uống; “rượu chua” dễ hiểu và phù hợp hơn việc chỉ dịch là giấm, đồng thời ghi nhận phương án ấy trong chú thích.
- source_word: μεστόν / μεστὸν
  choice: đầy / thấm đầy
  rationale: Với bình dùng “đầy”; với bọt biển dùng “thấm đầy” để diễn đạt tự nhiên cách bọt biển chứa chất lỏng mà vẫn giữ ý đầy.
- source_word: σπόγγον
  choice: một miếng bọt biển
  rationale: Tương đương trực tiếp, tự nhiên trong tiếng Việt khi nói về một phần bọt biển được dùng để thấm chất lỏng.
- source_word: οὖν
  choice: Vậy
  rationale: Nối hành động tiếp theo với tình huống vừa nêu, giữ sắc thái hệ quả hoặc tiếp diễn của trình thuật.
- source_word: ὑσσώπῳ
  choice: vào cây bài hương
  rationale: Giữ tên loài cây và diễn đạt cách hiểu gắn miếng bọt biển vào đó; chú thích bảo lưu sự không chắc chắn của cách dative này và việc bản Hy Lạp không nói rõ “cành”.
- source_word: περιθέντες
  choice: gắn
  rationale: Phân từ chỉ hành động xảy ra trước động từ chính; “gắn” phù hợp với việc đặt miếng bọt biển vào hoặc trên cây bài hương.
- source_word: προσήνεγκαν
  choice: đưa lên
  rationale: Diễn đạt chuyển động mang vật đến miệng người đang ở trên thập tự giá; “lên” tự nhiên theo khung cảnh nhưng không đổi ý cơ bản là đem đến.
- source_word: αὐτοῦ τῷ στόματι
  choice: lên miệng Đức Chúa Jêsus
  rationale: Dùng danh xưng để tránh đại từ có thể kém rõ trong câu đứng riêng; diễn đạt đích đến của hành động.
theological_decisions:
- issue: Âm hưởng lịch sử và nghi lễ của ὑσσώπῳ
  choice: Giữ “cây bài hương” trong chính văn mà không giải thích biểu tượng.
  alternative: Dịch thành “một cành bài hương,” “bằng cây bài hương,” hoặc thay bằng một loại que/cây sậy.
  rationale: Cách gọi này bảo tồn khả năng gợi đến Lễ Vượt Qua hoặc nghi thức thanh tẩy trong văn mạch Kinh Thánh, nhưng không đưa ý nghĩa biểu tượng chưa được câu này nói rõ vào bản dịch.
- issue: Chủ thể số nhiều không được nêu danh tính
  choice: Dịch đơn giản là “họ.”
  alternative: Xác định là binh lính hoặc những người đứng gần đó.
  rationale: Nguyên văn chỉ dùng động từ ngôi thứ ba số nhiều, nên không nên xác định chủ thể vượt quá điều câu này trực tiếp nói.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Chính văn giữ cấu trúc kể chuyện gọn, tránh giải thích biểu tượng. Hai chú thích được đặt ngay sau các cụm từ liên quan và bảo lưu các khả năng từ vựng/cú pháp của nguyên văn.
