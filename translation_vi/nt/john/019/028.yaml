source:
  edition: SBLGNT
  text: Μετὰ τοῦτο ⸀εἰδὼς ὁ Ἰησοῦς ὅτι ⸂ἤδη πάντα⸃ τετέλεσται ἵνα τελειωθῇ ἡ γραφὴ λέγει· Διψῶ.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/028.yaml
  text: After this[a], Jesus, knowing that all things had already been completed, in order that the Scripture might be fulfilled, said, “I thirst.”
translation:
  language: vi
  text: 'Sau đó, Giê-su biết rằng mọi sự đã hoàn tất rồi, để lời Kinh Thánh được ứng nghiệm, Người nói: “Ta khát.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μετὰ τοῦτο
  choice: Sau đó
  rationale: Cách chuyển tiếp thời gian tự nhiên trong tiếng Việt, đồng thời phản ánh đại từ chỉ định số ít τοῦτο.
- source_word: εἰδὼς
  choice: biết rằng
  rationale: Diễn đạt tự nhiên phân từ chỉ hoàn cảnh đồng thời, bổ nghĩa cho Đức Chúa Jêsus.
- source_word: ἤδη πάντα τετέλεσται
  choice: mọi việc đã hoàn tất
  rationale: Thể hoàn thành chỉ một tình trạng đã được hoàn tất trước lời nói tiếp theo; 'mọi việc' phản ánh πάντα. Không dịch riêng ἤδη vì 'đã hoàn tất' trong mạch kể đã truyền đạt rõ ý hoàn thành trước đó mà không nặng lời.
- source_word: ἵνα τελειωθῇ
  choice: để ... được ứng nghiệm
  rationale: Với 'Kinh Thánh' làm chủ ngữ, 'được ứng nghiệm' là cách nói tự nhiên và đúng ngữ cảnh; 'để' giữ sắc thái mục đích hoặc kết quả của ἵνα.
- source_word: ἡ γραφή
  choice: lời Kinh Thánh
  rationale: Chỉ phần Kinh Thánh thánh thiêng được viện dẫn; thêm 'lời' tạo cách diễn đạt tiếng Việt tự nhiên mà không xác định quá mức một câu cụ thể.
- source_word: λέγει
  choice: Ngài nói
  rationale: Thì hiện tại lịch sử Hy Lạp được chuyển sang quá khứ theo lối kể chuyện tự nhiên của tiếng Việt; thêm đại từ để câu rõ chủ ngữ.
- source_word: Διψῶ
  choice: Ta khát
  rationale: Ngắn gọn, trực tiếp và trang trọng; truyền đạt đúng động từ hiện tại ngôi thứ nhất mà không trở nên cổ kính khó hiểu.
theological_decisions:
- issue: Quan hệ giữa sự nhận biết của Đức Chúa Jêsus, việc mọi sự đã hoàn tất và sự ứng nghiệm Kinh Thánh
  choice: Câu dịch nói Đức Chúa Jêsus biết mọi việc đã hoàn tất, rồi Ngài nói để lời Kinh Thánh được ứng nghiệm.
  alternative: Có thể hiểu lời Ngài nói dẫn đến kết quả là Kinh Thánh được ứng nghiệm, mà không quy định một hệ thống thần học rộng hơn.
  rationale: Giữ nguyên trật tự và sức căng của cú pháp Hy Lạp, không áp đặt cách giải thích riêng về sự biết trước hay tiền định; đồng thời duy trì sự phân biệt giữa τετέλεσται ('đã hoàn tất') và τελειωθῇ ('được ứng nghiệm/hoàn tất').
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng 'Đức Chúa Jêsus' và đại từ 'Ngài/Ta' theo văn phong Kinh Thánh tiếng Việt quen thuộc; câu nói 'Ta khát' giữ sự súc tích và trang nghiêm của nguyên văn.
