revisions:
- from: 'Phi-lát cũng viết một tấm bảng và gắn lên thập tự giá. Trên đó viết: “Giê-su người Na-xa-rét, Vua dân Do Thái[a].”'
  to: 'Phi-lát cũng viết một tấm bảng và gắn trên thập tự giá. Trên đó có viết: “Giê-su, người Na-xa-rét, Vua dân Do Thái[a].”'
  rationale: Chỉnh rất nhẹ để giữ sát giới từ ἐπὶ (‘trên’), làm sáng cấu trúc đồng vị của dòng chữ, và dùng lối diễn đạt tiếng Việt tự nhiên cho mệnh đề ἦν ... γεγραμμένον. Bản chú thích tiếp tục bảo lưu khả năng nghĩa ‘người Giu-đê’ của Ἰουδαίων mà không áp đặt một cách hiểu duy nhất.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T08:26:27Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch truyền đạt đúng các thành tố chính: Phi-lát là chủ thể, viết một τίτλος, đặt nó trên thập tự giá, và nội dung dòng chữ nêu Giê-su, người Na-xa-rét, là Vua dân Do Thái. Tuy nhiên, “gắn lên thập tự giá” có thể gợi hướng chuyển động ‘lên/ở phía trên’ hơn là vị trí ἐπὶ (‘trên’); “gắn trên thập tự giá” sát hơn. Dấu phẩy quanh “người Na-xa-rét” làm rõ đây là định ngữ/biệt hiệu apposition trong dòng chữ.'
  naturalness: “Trên đó có viết” là cách nói hiện đại, tự nhiên hơn “Trên đó viết”, đồng thời vẫn phản ánh trạng thái kết quả của ἦν γεγραμμένον. Câu văn giữ được sắc thái trang trọng và ngắn gọn.
  terminology: “Thập tự giá,” “Giê-su,” “Phi-lát,” “Na-xa-rét,” và “Vua dân Do Thái” đều phù hợp cách dùng Việt ngữ Kinh Thánh. Chú thích nên dùng “Vua của người Giu-đê” để diễn đạt rõ quan hệ sở hữu và số nhiều của τῶν Ἰουδαίων.
  issues:
  - severity: low
    issue: “gắn lên thập tự giá”
    rationale: “Lên” có thể khiến người đọc hiểu là ‘phía trên’ thập tự giá. Nguyên văn chỉ nói tấm bảng được đặt ‘trên’ thập tự giá, không xác định vị trí cao hơn.
  - severity: low
    issue: Thiếu dấu phẩy phân cách biệt hiệu “người Na-xa-rét”
    rationale: Trong tiếng Việt, dấu phẩy giúp đọc rõ “người Na-xa-rét” là danh xưng đồng vị với “Giê-su”, tiếp theo là danh hiệu vương quyền.
  - severity: low
    issue: “Trên đó viết” hơi khẩu ngữ/lược chủ ngữ
    rationale: Thêm “có” tạo lối diễn đạt tự nhiên hơn cho nội dung hiện diện trên tấm bảng, không thêm thông tin vào nguyên văn.
