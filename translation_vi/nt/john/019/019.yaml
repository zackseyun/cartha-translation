  text: ἔγραψεν δὲ καὶ τίτλον ὁ Πιλᾶτος καὶ ἔθηκεν ἐπὶ τοῦ σταυροῦ· ἦν δὲ γεγραμμένον· Ἰησοῦς ὁ Ναζωραῖος ὁ βασιλεὺς τῶν Ἰουδαίων.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/019.yaml
  text: 'Pilate also wrote an inscription and put it on the cross. It was written: “Jesus the Nazarene[a], the King of the Jews.”'
translation:
  language: vi
  text: 'Phi-lát cũng viết một tấm bảng và gắn trên thập tự giá. Trên đó có viết: “Giê-su, người Na-xa-rét, Vua dân Do Thái[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Vua của người Giu-đê.” Từ Hy Lạp có thể chỉ dân Do Thái nói chung hoặc người Giu-đê nói riêng, tùy theo ngữ cảnh.'
    reason: alternative_reading
lexical_decisions:
- source_word: τίτλον
  choice: một tấm bảng
  rationale: Trong bối cảnh đóng đinh, từ này chỉ tấm bảng ghi cáo trạng hoặc danh hiệu được gắn trên thập tự giá. “Tấm bảng” tự nhiên, rõ nghĩa trong tiếng Việt hiện đại; nội dung viết trên bảng được nêu ngay sau đó.
- source_word: ἔθηκεν ἐπὶ τοῦ σταυροῦ
  choice: gắn lên thập tự giá
  rationale: Giữ trực tiếp ý nghĩa “trên thập tự giá” của nguyên văn; “gắn” phù hợp với việc đặt một tấm bảng lên vật thể hơn cách nói chung chung “đặt”.
- source_word: ἦν δὲ γεγραμμένον
  choice: Trên đó viết
  rationale: Diễn đạt tự nhiên trạng thái nội dung đã được ghi trên bảng, không làm thay đổi ý nghĩa kết quả của cấu trúc Hy Lạp.
- source_word: Ναζωραῖος
  choice: người Na-xa-rét
  rationale: Chuyển tải biệt danh xác định nguồn gốc/liên hệ với Na-xa-rét bằng cách nói tự nhiên và dễ hiểu trong tiếng Việt hiện đại.
- source_word: βασιλεὺς τῶν Ἰουδαίων
  choice: Vua dân Do Thái
  rationale: Phản ánh cách hiểu phù hợp nhất trong lời cáo trạng công khai ở trình thuật thương khó, đồng thời giữ cách gọi quen thuộc trong tiếng Việt.
- source_word: δὲ καὶ
  choice: cũng
  rationale: Truyền đạt gọn và tự nhiên sắc thái tiếp nối có bổ sung.
- source_word: Πιλᾶτος
  choice: Phi-lát
  rationale: Dạng phiên âm tiếng Việt quen dùng cho tên riêng Hy Lạp Πιλᾶτος.
- source_word: Ἰησοῦς
  choice: Giê-su
  rationale: Dạng phiên âm tiếng Việt quen dùng cho tên riêng Hy Lạp Ἰησοῦς.
- source_word: σταυροῦ
  choice: thập tự giá
  rationale: Cách dịch chuẩn, tự nhiên và phù hợp bối cảnh trình thuật đóng đinh.
theological_decisions:
- issue: Cách dịch Ἰουδαίων trong dòng chữ
  choice: dân Do Thái
  alternative: người Giu-đê
  rationale: Trong bối cảnh này, cụm từ là một danh xưng vương quyền công khai và nhiều khả năng chỉ dân Do Thái nói chung. Tuy nhiên, từ Hy Lạp cũng có thể mang nghĩa địa lý là người Giu-đê, nên khả năng ấy được giữ trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. Câu ngắn, rõ; giữ cấu trúc thuật sự và nguyên văn của dòng chữ. Viết hoa “Vua” trong lời trích như một danh hiệu trên tấm bảng, không nhằm áp đặt thêm một kết luận thần học.
