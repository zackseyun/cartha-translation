id: JHN.19.31
reference: John 19:31
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Οἱ οὖν Ἰουδαῖοι, ⸂ἐπεὶ παρασκευὴ ἦν, ἵνα μὴ μείνῃ ἐπὶ τοῦ σταυροῦ τὰ σώματα ἐν τῷ σαββάτῳ⸃, ἦν γὰρ μεγάλη ἡ ἡμέρα ἐκείνου τοῦ σαββάτου, ἠρώτησαν τὸν Πιλᾶτον ἵνα κατεαγῶσιν αὐτῶν τὰ σκέλη καὶ ἀρθῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/031.yaml
  text: Therefore the Jews[a], because it was the day of preparation[d][c][b], asked Pilate that the bodies might not remain on the cross on the Sabbath—for that Sabbath day was a great one—and that their legs might be broken and they might be taken away.
translation:
  language: vi
  text: Vì hôm ấy là ngày Chuẩn bị[d], những người Do Thái[a] xin Phi-lát cho đánh gãy chân những người bị đóng đinh và đem các thi thể đi[c], để các thi thể không còn ở trên thập tự giá trong ngày Sa-bát; vì ngày Sa-bát ấy là một ngày trọng thể.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Trong sách Gioan, cụm từ “những người Do Thái” đôi khi có thể chỉ cụ thể hơn giới lãnh đạo Do Thái hoặc những người Giu-đê.
    reason: alternative_reading
  - marker: b
    text: Hay “vì ngày Sa-bát ấy là một ngày lớn,” nghĩa là một ngày Sa-bát đặc biệt quan trọng.
    reason: lexical_alternative
  - marker: c
    text: “Đem các thi thể đi” cũng có thể dịch là “đem xuống” hoặc “dời đi.”
    reason: lexical_alternative
  - marker: d
    text: Tức ngày chuẩn bị trước ngày Sa-bát.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἱ οὖν Ἰουδαῖοι
  choice: nên những người Do Thái
  rationale: οὖν nối hệ quả với ngữ cảnh trước; Ἰουδαῖοι được dịch theo nghĩa trực tiếp, đồng thời chú thích khả năng chỉ giới lãnh đạo Do Thái trong văn cảnh Gioan.
- source_word: ἐπεὶ παρασκευὴ ἦν
  choice: Vì hôm ấy là ngày Chuẩn Bị
  rationale: παρασκευή là ngày chuẩn bị trước Sa-bát; viết hoa như tên gọi của ngày nhưng vẫn giữ từ ngữ dễ hiểu.
- source_word: ἵνα μὴ μείνῃ ἐπὶ τοῦ σταυροῦ τὰ σώματα ἐν τῷ σαββάτῳ
  choice: để các thi thể không còn ở trên thập tự giá trong ngày Sa-bát
  rationale: Giữ rõ quan hệ mục đích của ἵνα và dùng 'thi thể' tự nhiên hơn 'các thân thể' khi nói về người đã chết.
- source_word: ἦν γὰρ μεγάλη ἡ ἡμέρα ἐκείνου τοῦ σαββάτου
  choice: vì ngày Sa-bát ấy là một ngày trọng thể
  rationale: μεγάλη theo nghĩa đen là 'lớn', nhưng ở đây chỉ tầm quan trọng đặc biệt; 'trọng thể' truyền đạt ý nghĩa mà không dùng thuật ngữ giáo phái.
- source_word: ἠρώτησαν τὸν Πιλᾶτον
  choice: xin Phi-lát
  rationale: Trong ngữ cảnh thỉnh cầu nhà cầm quyền, ἐρωτάω mang nghĩa xin hoặc yêu cầu; 'xin' gọn và tự nhiên.
- source_word: ἵνα κατεαγῶσιν αὐτῶν τὰ σκέλη
  choice: cho đánh gãy chân họ
  rationale: Thể bị động Hy Lạp được diễn đạt tự nhiên qua cấu trúc 'cho' trong tiếng Việt, ngụ ý Phi-lát cho phép người thi hành thực hiện.
- source_word: καὶ ἀρθῶσιν
  choice: rồi đem họ đi
  rationale: αἴρω có phạm vi nghĩa nhấc lên, dời đi hoặc đem đi; cách dịch này giữ độ rộng của động từ, còn nghĩa 'đem xuống' được ghi chú.
theological_decisions:
- issue: Phạm vi chỉ người của Ἰουδαῖοι trong Gioan
  choice: những người Do Thái
  alternative: giới lãnh đạo Do Thái; những người Giu-đê
  rationale: Câu Hy Lạp không tự giới hạn rõ vào giới lãnh đạo. Bản chính giữ cách gọi trực tiếp và chú thích sắc thái văn cảnh để tránh quy trách nhiệm cho toàn thể dân tộc.
- issue: Ý nghĩa của μεγάλη đối với ngày Sa-bát
  choice: một ngày trọng thể
  alternative: một ngày lớn; một ngày Sa-bát đặc biệt quan trọng
  rationale: Cụm từ cho biết ngày Sa-bát ấy có ý nghĩa đặc biệt. 'Trọng thể' bảo toàn ý nghĩa theo văn cảnh mà không xác định thêm nguyên nhân thần học ngoài câu.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Trật tự câu được điều chỉnh để quan hệ nguyên nhân, mục đích và lời thỉnh cầu rõ ràng. Dùng “Sa-bát,” “Phi-lát” và “thập tự giá” theo lối gọi Kinh Thánh quen thuộc; tránh cách diễn đạt cổ hoặc thuật ngữ giáo phái.
