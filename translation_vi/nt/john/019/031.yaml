  verdict: revise
  source_fidelity: 'Cần sửa. Bản nháp truyền đạt phần lớn ý câu Hy Lạp, nhưng đại từ “họ” trong “đánh gãy chân họ” tự nhiên sẽ quy chiếu về chủ ngữ “những người Do Thái,” trong khi αὐτῶν chỉ những người bị đóng đinh. Cần nêu rõ đối tượng này. “Rồi” cũng thêm sắc thái tuần tự không cần thiết; hai hành động đều là nội dung lời xin. Cấu trúc sửa giữ quan hệ mục đích: họ xin Phi-lát thực hiện các việc ấy để các thi thể không còn trên thập tự giá trong ngày Sa-bát.'
  naturalness: Bản sửa dùng “những người bị đóng đinh” và “các thi thể” để quy chiếu rõ ràng, tự nhiên trong tiếng Việt hiện đại. “Ngày Chuẩn bị” được giữ như cách gọi Kinh Thánh quen thuộc và được giải thích ngắn trong chú thích.
  terminology: Giữ “Phi-lát,” “Sa-bát,” và “thập tự giá” theo lối dùng Kinh Thánh Việt ngữ. “Một ngày trọng thể” diễn đạt μεγάλη theo ngữ cảnh mà không áp đặt lý giải về lý do ngày Sa-bát ấy đặc biệt. Chú thích về “những người Do Thái” duy trì khả năng “người Giu-đê” hoặc giới lãnh đạo trong văn mạch Gioan mà không thay thế cách dịch chính.
