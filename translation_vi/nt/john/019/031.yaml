revisions:
- from: Vì hôm ấy là ngày Chuẩn Bị, nên những người Do Thái[a] xin Phi-lát cho đánh gãy chân họ rồi đem họ đi, để các thi thể không còn ở trên thập tự giá trong ngày Sa-bát; vì ngày Sa-bát ấy là một ngày trọng thể.[b][c]
  to: Vì hôm ấy là ngày Chuẩn bị[d], những người Do Thái[a] xin Phi-lát cho đánh gãy chân những người bị đóng đinh và đem các thi thể đi[c], để các thi thể không còn ở trên thập tự giá trong ngày Sa-bát; vì ngày Sa-bát ấy là một ngày trọng thể.[b]
  rationale: Sửa quy chiếu đại từ để tránh đảo ngược đối tượng của việc đánh gãy chân; bỏ sắc thái tuần tự do “rồi” thêm vào; gắn lại chú thích c đúng vị trí; và thêm chú thích cho παρασκευή. Bản sửa vẫn giữ cách dịch chính “những người Do Thái,” sự nhấn mạnh đặc biệt của ngày Sa-bát, và độ rộng nghĩa của ἀρθῶσιν.
