  - severity: low
    issue: Thiếu chú thích giải thích thuật ngữ “ngày Chuẩn bị.”
    rationale: Παρασκευή là ngày chuẩn bị trước ngày Sa-bát; một chú thích ngắn giúp minh bạch nghĩa thuật ngữ, phù hợp với audit trail tiếng Anh.
