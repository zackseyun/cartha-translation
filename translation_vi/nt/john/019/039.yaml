id: JHN.19.39
reference: John 19:39
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἦλθεν δὲ καὶ Νικόδημος, ὁ ἐλθὼν πρὸς ⸀αὐτὸν νυκτὸς τὸ πρῶτον, φέρων ⸀μίγμα σμύρνης καὶ ἀλόης ὡς λίτρας ἑκατόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/039.yaml
  text: Nicodemus also came—the one who had first come to him at night—bringing a mixture of myrrh and aloes[b][a], about a hundred litras.
translation:
  language: vi
  text: Ni-cô-đem cũng đến—ông là người trước kia đã đến gặp Đức Chúa Giê-su vào ban đêm[a]—mang theo một hỗn hợp gồm một dược và trầm hương, khoảng một trăm li-tra[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “ông là người lần đầu tiên đã đến gặp Đức Chúa Giê-su vào ban đêm”; xem Giăng 3:1–2.'
    reason: cross_reference
  - marker: b
    text: Li-tra là đơn vị cân nặng của La Mã, khoảng 327 gam; một trăm li-tra tương đương khoảng 32–33 kilôgam.
    reason: cultural_note
lexical_decisions:
- source_word: ἦλθεν δὲ καὶ
  choice: cũng đến
  rationale: δέ nối nhẹ với câu trước, còn καί thêm Ni-cô-đem vào số những người lo việc an táng; “cũng đến” tự nhiên và giữ được ý bổ sung.
- source_word: Νικόδημος
  choice: Ni-cô-đem
  rationale: Phiên âm tên riêng theo cách dùng quen thuộc, dễ đọc trong tiếng Việt.
- source_word: ὁ ἐλθὼν πρὸς αὐτὸν νυκτὸς τὸ πρῶτον
  choice: ông là người trước kia đã đến gặp Đức Chúa Giê-su vào ban đêm
  rationale: Cụm phân từ có chức năng đồng vị để nhận diện Ni-cô-đem và gợi lại Giăng 3:1–2. “Trước kia” diễn đạt tự nhiên τὸ πρῶτον trong ngữ cảnh này; bổ sung danh xưng “Đức Chúa Giê-su” thay cho đại từ để câu tiếng Việt rõ ràng.
- source_word: φέρων
  choice: mang theo
  rationale: Phân từ hiện tại diễn tả hoàn cảnh đi kèm khi Ni-cô-đem đến; “mang theo” tự nhiên trong tiếng Việt.
- source_word: μίγμα σμύρνης καὶ ἀλόης
  choice: một hỗn hợp gồm một dược và trầm hương
  rationale: μίγμα là hỗn hợp; σμύρνη là một dược. Trong bối cảnh mai táng, ἀλόη chỉ loại gỗ thơm (agarwood/aloeswood), nên “trầm hương” tránh khiến độc giả hiểu là cây nha đam hiện đại.
- source_word: ὡς
  choice: khoảng
  rationale: Khi đi với số lượng, ὡς biểu thị sự ước lượng.
- source_word: λίτρας ἑκατόν
  choice: một trăm li-tra
  rationale: Giữ đơn vị La Mã cổ bằng dạng phiên âm để không đồng nhất sai với cân Anh hay đơn vị hiện đại; chú thích cung cấp quy đổi gần đúng.
theological_decisions:
- issue: Đối tượng của αὐτόν trong mệnh đề nhận diện
  choice: Đức Chúa Giê-su
  alternative: ngài / người ấy
  rationale: Ngữ cảnh rõ ràng gợi lại lần Ni-cô-đem đến gặp Đức Chúa Giê-su trong Giăng 3:1–2. Nêu danh xưng trong bản dịch giúp câu tiếng Việt tự nhiên và không thay đổi nội dung thần học.
- issue: Ý nghĩa của τὸ πρῶτον
  choice: trước kia
  alternative: lần đầu tiên
  rationale: Trong ngữ cảnh hồi chỉ, cụm này có thể mang nghĩa “trước đây/trước kia,” dù cũng có thể hiểu là “lần đầu tiên.” Bản chính chọn cách nói tự nhiên hơn và chú thích bảo lưu khả năng kia.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng dấu gạch ngang để đặt mệnh đề nhận diện trong phần xen giải thích. “Trầm hương” truyền đạt đúng loại hương liệu từ gỗ được dùng trong việc mai táng, tránh nghĩa nha đam thường gặp trong tiếng Việt hiện đại.
