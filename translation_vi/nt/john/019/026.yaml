  source_fidelity: Bản dịch truyền đạt đúng mạch nối của οὖν, trình tự thời gian của ἰδὼν, người mẹ của Đức Giê-su, người môn đồ được ngài yêu, và lời tuyên bố về “con trai của bà.” Tuy nhiên, “đang đứng gần đó” thêm một sắc thái khoảng cách không được xác định trong παρεστῶτα; “đứng đó” giữ ý hiện diện/đứng tại chỗ mà không định vị thêm.
  naturalness: Câu nhìn chung tự nhiên và trang trọng. Thêm “mà” trong “người môn đồ mà ngài yêu” làm quan hệ từ rõ ràng, tránh thoáng khả năng ngắt nhịp không thuận trong “người môn đồ ngài yêu.”
  terminology: “Đức Giê-su,” “môn đồ,” “Thưa bà,” và “con trai của bà” phù hợp văn phong Kinh Thánh tiếng Việt hiện đại. Chú thích về Γύναι hữu ích và không áp đặt diễn giải thần học.
