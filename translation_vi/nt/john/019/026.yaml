reference: John 19:26
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἰησοῦς οὖν ἰδὼν τὴν μητέρα καὶ τὸν μαθητὴν παρεστῶτα ὃν ἠγάπα λέγει τῇ ⸀μητρί· Γύναι, ⸀ἴδε ὁ υἱός σου·
base_translation:
  language: en
  yaml_path: translation/nt/john/019/026.yaml
  text: So when Jesus saw his mother and the disciple whom he loved standing there[a], he says to his mother, “Woman, behold, your son.”
translation:
  language: vi
  text: 'Vậy, khi Đức Giê-su thấy mẹ mình và người môn đồ mà ngài yêu đang đứng đó, ngài nói với mẹ: “Thưa bà[a], đây là con trai của bà.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sát chữ là “người nữ.” Trong tiếng Hy Lạp, đây là cách xưng hô kính trọng, không phải lời nói thô lỗ hay khinh miệt.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Vậy
  rationale: Giữ chức năng nối kết và chuyển tiếp của câu trong mạch tường thuật, đồng thời tự nhiên trong tiếng Việt hiện đại.
- source_word: ἰδὼν
  choice: khi ... thấy
  rationale: Diễn đạt phân từ bất định quá khứ theo nghĩa thời gian, cho thấy việc nhìn thấy xảy ra trước lời nói mà không tạo cấu trúc gượng ép.
- source_word: τὴν μητέρα
  choice: mẹ mình
  rationale: Mạo từ Hy Lạp chỉ người mẹ đã xác định; tiếng Việt tự nhiên cần đại từ phản thân để làm rõ đây là mẹ của Đức Giê-su.
- source_word: τὸν μαθητὴν
  choice: người môn đồ
  rationale: Giữ tính xác định của danh từ có mạo từ và dùng thuật ngữ quen thuộc trong văn cảnh Tin Mừng.
- source_word: παρεστῶτα
  choice: đang đứng gần đó
  rationale: Diễn tả người môn đồ đang hiện diện và đứng gần tại hiện trường, không xác định quá mức ông đứng cạnh ai.
- source_word: ὃν ἠγάπα
  choice: ngài yêu
  rationale: Giữ nguyên cách nhận diện kín đáo của Tin Mừng Giăng, không thay đại từ bằng tên riêng hay thêm đối tượng giải thích.
- source_word: λέγει
  choice: ngài nói
  rationale: Tiếng Việt thường dùng thì tường thuật không đánh dấu; cách này tự nhiên mà không làm mất sắc thái sống động của hiện tại lịch sử Hy Lạp.
- source_word: Γύναι
  choice: Thưa bà
  rationale: Trong lối xưng hô Hy Lạp này, từ ngữ mang sắc thái kính trọng chứ không thô lỗ. “Thưa bà” truyền đạt đúng chức năng xưng hô trong tiếng Việt hiện đại; chú thích bảo tồn hình thức sát chữ.
- source_word: ἴδε
  choice: đây là
  rationale: Chuyển mệnh lệnh chỉ xuất “hãy nhìn/kìa” thành công thức giới thiệu tự nhiên trong tiếng Việt, vẫn giữ hành động Đức Giê-su chỉ người môn đồ cho mẹ mình.
- source_word: ὁ υἱός σου
  choice: con trai của bà
  rationale: Giữ quan hệ được tuyên bố trực tiếp, không giải thích thêm đây là quan hệ sinh học, chăm sóc hay biểu tượng.
theological_decisions:
- issue: Sắc thái lời Đức Giê-su gọi mẹ bằng Γύναι
  choice: Dịch “Thưa bà” trong chính văn và chú thích nghĩa sát chữ cùng sắc thái kính trọng.
  alternative: “Hỡi người nữ” hoặc “Bà”
  rationale: “Hỡi người nữ” giữ hình thức từ vựng nhưng dễ tạo cảm giác xa cách hoặc cứng nhắc trong tiếng Việt hiện đại; chỉ dùng “Bà” có thể bị nghe như thiếu kính trọng. “Thưa bà” bảo tồn chức năng kính trọng mà không thêm sự thân mật không có trong nguyên văn.
- issue: Bản chất quan hệ trong câu ὁ υἱός σου
  choice: Giữ nguyên lời tuyên bố “đây là con trai của bà” mà không giải nghĩa.
  alternative: Diễn giải thành lời giao phó chăm sóc hoặc xác lập quan hệ thiêng liêng
  rationale: Nguyên văn tuyên bố quan hệ nhưng không giải thích đầy đủ bản chất hay phạm vi thần học của quan hệ ấy; bản dịch không nên tự quyết định điều còn để ngỏ trong câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Giê-su” theo lối gọi tên kính trọng quen thuộc; dùng “ngài” để tránh thêm danh hiệu không có trong nguyên văn. Cấu trúc câu giữ nhịp tường thuật và sự trang nghiêm của lời nói từ thập tự giá.
