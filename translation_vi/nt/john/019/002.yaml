  text: καὶ οἱ στρατιῶται πλέξαντες στέφανον ἐξ ἀκανθῶν ἐπέθηκαν αὐτοῦ τῇ κεφαλῇ, καὶ ἱμάτιον πορφυροῦν περιέβαλον αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/john/019/002.yaml
  text: And the soldiers, after weaving a crown out of thorns, put it on his head and clothed him in a purple robe,
translation:
  language: vi
  text: Các binh lính bện một mão gai, đặt lên đầu Ngài và khoác cho Ngài một áo choàng màu tím.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στρατιῶται
  choice: các binh lính
  rationale: Cách gọi tự nhiên và chính xác đối với quân nhân Rô-ma trong bối cảnh này.
- source_word: πλέξαντες
  choice: kết
  rationale: Diễn tả việc đan hoặc bện các cành gai thành một vật đội đầu; trật tự câu tiếng Việt vẫn cho thấy hành động này xảy ra trước việc đặt lên đầu.
- source_word: στέφανον ἐξ ἀκανθῶν
  choice: một mão bằng gai
  rationale: “Mão” truyền đạt hình ảnh vương quyền bị nhạo báng, còn “bằng gai” nêu rõ vật liệu mà không hàm ý ngoài nguyên văn.
- source_word: ἐπέθηκαν αὐτοῦ τῇ κεφαλῇ
  choice: đặt lên đầu Ngài
  rationale: Chuyển thành ngữ Hy Lạp sang cách nói tiếng Việt tự nhiên; tân ngữ được hiểu rõ là chiếc mão vừa nhắc đến.
- source_word: ἱμάτιον πορφυροῦν
  choice: một áo choàng màu tím
  rationale: ἱμάτιον chỉ áo ngoài và trong cảnh phong vương giả này, “áo choàng” vừa tự nhiên vừa giữ được sắc thái biểu tượng; πορφυροῦν được dịch trực tiếp là “màu tím”.
- source_word: περιέβαλον αὐτόν
  choice: khoác cho Ngài
  rationale: Cách diễn đạt tự nhiên cho hành động choàng một áo ngoài quanh người.
theological_decisions:
- issue: Hình ảnh giả làm vua trong hành động của binh lính
  choice: Thuật lại trực tiếp chiếc mão gai và áo choàng màu tím, không thêm từ “nhạo báng”.
  alternative: Diễn giải rõ rằng họ đội mão và khoác áo để nhạo báng Ngài như một vị vua.
  rationale: Ý nhạo báng hiện rõ trong văn cảnh và hình ảnh, nhưng câu Hy Lạp chỉ kể hành động; bản dịch không nên đưa lời giải thích vào chính câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” để chỉ Đức Giê-su theo lối tôn kính phổ biến; câu văn giữ nhịp kể gọn và trình tự hành động của nguyên bản.
