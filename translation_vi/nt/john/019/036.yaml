  source_fidelity: Bản dịch truyền đạt đúng quan hệ giải thích của γάρ, sự quy chiếu của ταῦτα đến các sự việc vừa thuật lại, mệnh đề mục đích/kết quả với ἵνα, và thể bị động trong “được ứng nghiệm” và “sẽ bị bẻ gãy”. Câu trích giữ đúng ý phân phối của Ὀστοῦν số ít và phủ định tương lai của οὐ συντριβήσεται.
