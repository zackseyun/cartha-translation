  rationale: Chỉ điều chỉnh đại từ trong câu trích để quy chiếu rõ ràng đến Đức Giê-su theo ngữ cảnh, và cập nhật chú thích cho nhất quán. Các lựa chọn còn lại giữ nguyên vì trung thành với tiếng Hy Lạp và tự nhiên trong tiếng Việt hiện đại.
