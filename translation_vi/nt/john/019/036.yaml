  terminology: “lời Kinh Thánh được ứng nghiệm” là thuật ngữ chuẩn và phù hợp cho ἡ γραφή ... πληρωθῇ. “bẻ gãy” phù hợp ngữ cảnh xương và không làm mạnh nghĩa hơn bản gốc.
