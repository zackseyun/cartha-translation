  text: ἐγένετο γὰρ ταῦτα ἵνα ἡ γραφὴ πληρωθῇ· Ὀστοῦν οὐ συντριβήσεται ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/036.yaml
  text: 'For these things happened so that the Scripture might be fulfilled: “Not one of his bones will be broken.”[a]'
translation:
  language: vi
  text: 'Vì những việc ấy đã xảy ra để lời Kinh Thánh được ứng nghiệm: “Không một xương nào của Người sẽ bị bẻ gãy.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hy Lạp theo sát nghĩa: “Xương của Người sẽ không bị bẻ gãy.” Danh từ “xương” ở số ít; cấu trúc “không một xương nào” diễn đạt tự nhiên ý nghĩa phân phối của câu trích trong tiếng Việt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: đã xảy ra
  rationale: Diễn đạt tự nhiên thể aorist của γίνομαι trong ngữ cảnh các sự việc vừa được thuật lại.
- source_word: γὰρ
  choice: Vì
  rationale: Giữ chức năng giải thích, nối câu này với lời kể ngay trước đó.
- source_word: ταῦτα
  choice: những việc ấy
  rationale: Đại từ chỉ định trung tính số nhiều quy chiếu đến các sự việc vừa xảy ra; “ấy” phù hợp văn phong tường thuật trang trọng.
- source_word: ἵνα
  choice: để
  rationale: Giữ sắc thái mục đích-kết quả của mệnh đề ứng nghiệm mà không buộc phải phân định cứng giữa hai sắc thái.
- source_word: ἡ γραφή
  choice: lời Kinh Thánh
  rationale: Trong cách dùng của Giăng, danh từ số ít có mạo từ chỉ lời chép trong Kinh Thánh; cách dịch này tự nhiên và rõ nghĩa trong tiếng Việt.
- source_word: πληρωθῇ
  choice: được ứng nghiệm
  rationale: Giữ thể bị động và thuật ngữ quen thuộc, chính xác cho sự hoàn thành lời Kinh Thánh.
- source_word: Ὀστοῦν
  choice: một xương nào
  rationale: Danh từ số ít mang nghĩa phân phối/tập hợp trong câu trích dẫn; cách nói này tự nhiên trong tiếng Việt và không chuyển thành số nhiều không cần thiết.
- source_word: οὐ συντριβήσεται
  choice: sẽ bị bẻ gãy
  rationale: Giữ thì tương lai và thể bị động; trong ngữ cảnh nói về xương, “bẻ gãy” chính xác hơn nghĩa rộng “đập nát”.
- source_word: αὐτοῦ
  choice: của người
  rationale: Đại từ sở hữu quy chiếu đến Đức Giê-su; “người” giữ lối diễn đạt trang trọng mà không thêm danh xưng vào câu trích dẫn.
theological_decisions:
- issue: Cách diễn đạt câu trích Kinh Thánh và mối liên hệ với Xuất Ê-díp-tô Ký 12:46, Dân Số Ký 9:12 và Thi Thiên 34:20
  choice: Không một xương nào của người sẽ bị bẻ gãy
  alternative: Xương của người sẽ không bị đập vỡ
  rationale: Cách chọn giữ danh từ “xương” ở số ít như bản Hy Lạp, đồng thời dùng cấu trúc phân phối tự nhiên trong tiếng Việt. Nó duy trì mô-típ ứng nghiệm và các liên hệ Cựu Ước mà không xác quyết riêng một nguồn trích dẫn.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “lời Kinh Thánh được ứng nghiệm” theo văn phong Kinh Thánh tự nhiên; tránh lối cổ như “hầu cho” hoặc “chẳng”. Dấu [a] được đặt ngay sau câu trích dẫn.
