id: JHN.19.24
reference: John 19:24
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἶπαν οὖν πρὸς ἀλλήλους· Μὴ σχίσωμεν αὐτόν, ἀλλὰ λάχωμεν περὶ αὐτοῦ τίνος ἔσται· ἵνα ἡ γραφὴ πληρωθῇ ⸂ἡ λέγουσα⸃· Διεμερίσαντο τὰ ἱμάτιά μου ἑαυτοῖς καὶ ἐπὶ τὸν ἱματισμόν μου ἔβαλον κλῆρον. Οἱ μὲν οὖν στρατιῶται ταῦτα ἐποίησαν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/024.yaml
  text: So they said to one another[a], “Let us not tear it, but cast lots for it to decide whose it will be,” so that the Scripture might be fulfilled that says, “They divided my garments among themselves[b], and for my clothing they cast a lot.” So the soldiers did these things.
translation:
  language: vi
  text: 'Vì vậy, họ nói với nhau: “Chúng ta đừng xé áo này, nhưng hãy bắt thăm xem áo sẽ thuộc về ai,” để lời Kinh Thánh được ứng nghiệm: “Họ chia áo xống của tôi cho nhau, còn áo của tôi thì họ bắt thăm.”[a] Vậy, những người lính đã làm những việc ấy.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Trích Thi Thiên 22:18.
    reason: cross_reference
lexical_decisions:
- source_word: σχίσωμεν
  choice: xé
  rationale: Động từ chỉ việc xé hoặc làm rách; “xé” tự nhiên và chính xác khi nói về áo.
- source_word: αὐτόν
  choice: áo này
  rationale: Đại từ giống đực quy chiếu về chiếc áo dài trong ngữ cảnh trước; nêu lại danh từ giúp câu tiếng Việt rõ nghĩa.
- source_word: λάχωμεν
  choice: bắt thăm
  rationale: Động từ nói đến việc quyết định quyền sở hữu bằng lá thăm; “bắt thăm” là cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: περὶ αὐτοῦ τίνος ἔσται
  choice: xem áo sẽ thuộc về ai
  rationale: Diễn đạt rõ mục đích của việc bắt thăm mà không thêm ý ngoài bản Hy Lạp.
- source_word: ἵνα ἡ γραφὴ πληρωθῇ
  choice: để lời Kinh Thánh được ứng nghiệm
  rationale: Giữ công thức ứng nghiệm quen thuộc của Giăng cùng dạng bị động, nhưng không giải thích quá mức quan hệ giữa mục đích và kết quả.
- source_word: Διεμερίσαντο τὰ ἱμάτιά μου ἑαυτοῖς
  choice: Họ chia áo xống của tôi cho nhau
  rationale: “Chia… cho nhau” giữ nghĩa phân chia giữa những người thực hiện; “áo xống” là cách gọi tự nhiên cho số nhiều chỉ y phục.
- source_word: ἐπὶ τὸν ἱματισμόν μου ἔβαλον κλῆρον
  choice: bắt thăm để lấy áo của tôi
  rationale: Giữ hình ảnh lá thăm và thể hiện quan hệ giữa việc bắt thăm với chiếc áo; dùng “áo” để phân biệt tự nhiên với “áo xống” ở vế trước.
- source_word: Οἱ μὲν οὖν στρατιῶται ταῦτα ἐποίησαν
  choice: Vậy, những người lính đã làm những việc ấy
  rationale: Giữ câu kết nhấn mạnh rằng chính những người lính đã thực hiện các hành động vừa được Kinh Thánh nói đến.
theological_decisions:
- issue: Quan hệ giữa hành động của binh lính và sự ứng nghiệm Kinh Thánh trong ἵνα ἡ γραφὴ πληρωθῇ
  choice: “để lời Kinh Thánh được ứng nghiệm”
  alternative: “và như thế lời Kinh Thánh được ứng nghiệm”
  rationale: Bản dịch giữ nguyên lực mục đích của ἵνα trong công thức ứng nghiệm của Giăng, đồng thời không áp đặt lời giải thích mang tính tất định luận về ý định của Đức Chúa Trời và hành động của con người.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “áo xống” trong câu trích dẫn để diễn đạt số nhiều τὰ ἱμάτια, còn “áo” cho ἱματισμός và chiếc áo đang được bắt thăm. Không thêm chú thích từ vựng không phù hợp; ghi chú tiếng Anh gắn [a] với một phương án của “cast lots” dường như đặt sai vị trí, nên bản Việt chỉ giữ chú thích đối chiếu Thi Thiên với dấu [a] xuất hiện trong chính văn.
