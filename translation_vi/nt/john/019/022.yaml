  text: Pilate answered[a], “What I have written, I have written.”
translation:
  language: vi
  text: 'Phi-lát đáp[a]: “Điều ta đã viết, ta đã viết rồi.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch động từ này là “trả lời”. Trong tiếng Hy Lạp, động từ “đã viết” xuất hiện hai lần ở thì hoàn thành, có thể nhấn mạnh rằng điều Phi-lát viết vẫn giữ nguyên và là quyết định dứt khoát.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: đáp
  rationale: Động từ ἀποκρίνομαι trong lời kể đối thoại thường có nghĩa là “đáp” hoặc “trả lời”; “đáp” tự nhiên, trang trọng và gọn trong văn cảnh.
- source_word: ὁ Πιλᾶτος
  choice: Phi-lát
  rationale: Danh từ riêng có mạo từ theo lối kể chuyện Hy Lạp; tiếng Việt bỏ mạo từ và dùng dạng tên quen thuộc “Phi-lát”.
- source_word: Ὃ
  choice: Điều
  rationale: Đại từ quan hệ trung tính số ít được dùng như danh từ, nghĩa là “điều mà/cái gì”; cấu trúc “Điều ta đã viết” tự nhiên và giữ nguyên quan hệ ngữ pháp.
- source_word: γέγραφα
  choice: ta đã viết ... ta đã viết rồi
  rationale: Thì hoàn thành chủ động diễn tả hành động đã hoàn tất với kết quả còn hiệu lực. “Đã viết rồi” ở vế cuối làm rõ tính đã định và dứt khoát; sự lặp lại của động từ được giữ nguyên.
theological_decisions:
- issue: Sắc thái của γέγραφα được lặp hai lần
  choice: “Điều ta đã viết, ta đã viết rồi.”
  alternative: “Điều ta viết, ta đã viết.”
  rationale: Cách dịch giữ phép lặp nhấn mạnh và biểu đạt tính dứt khoát, còn hiệu lực của lời đã viết, nhưng không thêm lời giải thích vào chính câu nói.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Đại từ “ta” phù hợp với lời nói có thẩm quyền của Phi-lát trong bối cảnh cổ đại; tránh cách diễn đạt quá cổ như “điều chi ta đã chép”.
