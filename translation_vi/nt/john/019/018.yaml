- from: Tại đó họ đóng đinh Ngài trên thập tự giá, cùng với Ngài còn có hai người khác, mỗi người một bên, còn Đức Chúa Jêsus ở giữa.
  to: Tại đó, họ đóng đinh Ngài trên thập giá, cùng với Ngài là hai người khác, mỗi người ở một bên, còn Giê-su ở giữa.
  rationale: 'Chỉnh sửa chỉ loại bỏ danh xưng không có trong nguyên văn, chuẩn hóa tên “Giê-su”, và làm văn phong hiện đại, tự nhiên hơn. Bản văn vẫn giữ: hai người khác ở hai phía đối nhau và Giê-su ở vị trí trung tâm, không thêm đại từ “họ” hay giải thích thần học.'
