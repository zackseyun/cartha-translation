  text: ὅπου αὐτὸν ἐσταύρωσαν, καὶ μετ’ αὐτοῦ ἄλλους δύο ἐντεῦθεν καὶ ἐντεῦθεν, μέσον δὲ τὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/018.yaml
  text: where they crucified him[a], and with him two others, one on each side, and Jesus in the middle.
translation:
  language: vi
  text: Tại đó, họ đóng đinh Ngài trên thập giá, cùng với Ngài là hai người khác, mỗi người ở một bên, còn Giê-su ở giữa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅπου
  choice: Tại đó
  rationale: Đại từ trạng ngữ chỉ nơi chốn, nối trực tiếp với địa điểm đã nêu ở câu trước; “Tại đó” tự nhiên trong mạch văn tiếng Việt.
- source_word: ἐσταύρωσαν
  choice: họ đóng đinh Ngài trên thập tự giá
  rationale: Trong trình thuật thương khó, động từ chỉ việc hành hình bằng cách đóng đinh trên thập tự giá; cách diễn đạt này quen thuộc, chính xác và không thêm chi tiết về phương thức.
- source_word: μετ’ αὐτοῦ
  choice: cùng với Ngài
  rationale: Giữ nghĩa đi cùng của μετά với sở hữu cách và thể hiện rằng những người khác cũng chịu đóng đinh tại đó.
- source_word: ἄλλους δύο
  choice: hai người khác
  rationale: Tiếng Hy Lạp nói “hai người khác”; thêm danh từ loại “người” là cần thiết để tiếng Việt tự nhiên và phù hợp với các đối tượng trong ngữ cảnh.
- source_word: ἐντεῦθεν καὶ ἐντεῦθεν
  choice: mỗi người một bên
  rationale: Diễn đạt tự nhiên sự phân bố hai người ở hai phía đối diện mà cụm từ Hy Lạp biểu thị.
- source_word: μέσον δὲ τὸν Ἰησοῦν
  choice: còn Đức Chúa Jêsus ở giữa
  rationale: “còn” phản ánh sắc thái chuyển nhẹ của δέ, trong khi “ở giữa” giữ nguyên hình ảnh vị trí trung tâm, không diễn giải quá mức thành “ở giữa họ”.
theological_decisions:
- issue: Có nên nói rõ Đức Chúa Jêsus ở giữa hai người kia hay không
  choice: còn Đức Chúa Jêsus ở giữa
  alternative: với Đức Chúa Jêsus ở giữa họ
  rationale: Nguyên văn xác định hai phía rồi nêu Đức Chúa Jêsus ở vị trí giữa. Bản dịch giữ cấu trúc không gian ấy mà không bổ sung đại từ “họ”, dù quan hệ này đã rõ trong ngữ cảnh.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” cho đại từ chỉ Đức Chúa Jêsus và danh xưng quen thuộc “Đức Chúa Jêsus”; câu giữ nhịp kể cô đọng của nguyên văn.
