review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng bố cục không gian của câu. Tuy nhiên, τὸν Ἰησοῦν chỉ nêu tên “Giê-su”; danh xưng “Đức Chúa” không có trong nguyên văn. Cụm “đóng đinh ... trên thập tự giá” diễn đạt nghĩa đóng đinh trên thập giá của ἐσταύρωσαν một cách rõ ràng.
  naturalness: Câu chỉnh sửa dùng chính tả hiện đại “Giê-su”, thêm dấu phẩy sau trạng ngữ đầu câu, và dùng “mỗi người ở một bên” để cấu trúc phân bố được rõ, tự nhiên.
  terminology: Không thêm danh xưng thần học vào tên riêng khi nguyên văn chỉ có “Giê-su”. “Thập giá” là thuật ngữ hiện đại, trang trọng và phổ biến hơn “thập tự giá”; “Ngài” được giữ như lối xưng hô tôn kính của bản nháp, không làm thay đổi quan hệ không gian hay nội dung mệnh đề.
  issues:
  - severity: medium
    issue: “Đức Chúa Jêsus” thêm danh xưng không có trong τὸν Ἰησοῦν, đồng thời dùng lối chính tả tên riêng mang tính truyền thống giáo phái.
    rationale: Nguyên văn chỉ ghi “Giê-su”. Bản dịch trung tính nên không bổ sung danh xưng “Chúa” vào câu này và dùng chính tả hiện đại chuẩn “Giê-su”.
  - severity: low
    issue: “thập tự giá” và “mỗi người một bên” có thể được cập nhật nhẹ cho văn phong hiện đại và rõ nghĩa hơn.
    rationale: “Thập giá” gọn, hiện hành; “mỗi người ở một bên” minh định đây là vị trí của từng người mà không thêm ý “ở giữa họ”.
  revised_text: Tại đó, họ đóng đinh Ngài trên thập giá, cùng với Ngài là hai người khác, mỗi người ở một bên, còn Giê-su ở giữa.
