base_translation:
  language: en
  yaml_path: translation/nt/john/019/003.yaml
  text: And they came up to him and said[a], “Hail[b], King of the Jews!” And they were slapping him.
translation:
  language: vi
  text: 'Họ cứ tiến lại gần Đức Giê-su và nói[a]: “Vạn tuế, Vua dân Do Thái!” và họ tát ngài liên tiếp.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “họ liên tục tiến lại gần ngài và nói đi nói lại,” phản ánh dạng động từ Hy Lạp có thể chỉ hành động đang tiếp diễn hoặc lặp lại.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤρχοντο πρὸς αὐτὸν καὶ ἔλεγον
  choice: họ cứ tiến lại gần Đức Giê-su và nói
  rationale: Hai động từ ở thì chưa hoàn thành có thể diễn tả hành động lặp lại trong cảnh nhạo báng. “Cứ tiến lại gần” truyền đạt sắc thái này tự nhiên, còn “nói” tránh câu văn nặng nề; chú thích bảo lưu khả năng thể hiện sự lặp lại ở cả hai động từ.
- source_word: Χαῖρε
  choice: Vạn tuế
  rationale: Trong ngữ cảnh giả vờ tung hô một vị vua, “Vạn tuế” là lời chào-tung hô trang trọng nhưng đầy mỉa mai, tự nhiên hơn cách dịch máy móc là “Hãy vui mừng”.
- source_word: ὁ βασιλεὺς τῶν Ἰουδαίων
  choice: Vua dân Do Thái
  rationale: Chuyển trực tiếp tước hiệu mang ý nghĩa chính trị và Đấng Mê-si trong trình thuật thương khó, không làm nhẹ đi tính mỉa mai.
- source_word: ἐδίδοσαν αὐτῷ ῥαπίσματα
  choice: họ tát ngài liên tiếp
  rationale: ῥαπίσματα chỉ những cái tát hoặc cú đánh bằng tay; thì chưa hoàn thành cho thấy hành động đang tiếp diễn hoặc lặp lại. Cách diễn đạt này rõ ràng và tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Sắc thái lời quân lính nói với Đức Giê-su
  choice: 'Diễn đạt như lời tung hô hoàng gia mang tính nhạo báng: “Vạn tuế Vua dân Do Thái!”'
  alternative: “Kính chào Vua dân Do Thái!”
  rationale: Ngữ cảnh cuộc thương khó cho thấy đây là hành động chế giễu. “Vạn tuế” giữ hình thức tung hô vua và để chính ngữ cảnh bộc lộ sự mỉa mai, không thêm lời giải thích vào câu Kinh Thánh.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. Dùng “Đức Giê-su” để xác định đại từ αὐτόν trong một câu đứng riêng, rồi dùng “ngài” nhằm tránh lặp. “Vạn tuế” giữ sắc thái nghi thức hoàng gia và sự mỉa mai do ngữ cảnh tạo nên.
