  terminology: «Đức Giê-su» và «Vua dân Do Thái» nhất quán, trang trọng, và không thêm diễn giải giáo phái. «Vạn tuế» có thể giữ được hình thức tung hô hoàng gia mang tính nhạo báng của χαῖρε; chú thích bảo lưu lựa chọn «Kính chào».
