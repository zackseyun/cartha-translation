  text: But the one who enters through the door is the shepherd of the sheep[a].
translation:
  language: vi
  text: Nhưng người đi vào qua cửa là người chăn chiên.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “một người chăn chiên.” Danh từ ποιμήν trong tiếng Hy Lạp không có mạo từ, nhưng ngữ cảnh nghiêng về nghĩa xác định: người chăn chính đáng, đối lập với những kẻ vào bằng đường khác.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ εἰσερχόμενος
  choice: Nhưng người đi vào
  rationale: Mạo từ đi với phân từ hiện tại tạo thành danh ngữ chỉ người có hành động đi vào; cách diễn đạt này tự nhiên trong tiếng Việt và giữ được ý khái quát. δέ được dịch là “Nhưng” để nêu sự tương phản với kẻ trộm và kẻ cướp ở câu trước.
- source_word: διὰ τῆς θύρας
  choice: qua cửa
  rationale: διά với sở hữu cách diễn tả sự chuyển động xuyên qua; “qua cửa” là cách nói không gượng ép và sát với hình ảnh không gian.
- source_word: ποιμήν
  choice: người chăn
  rationale: Trong ngữ cảnh chăn chiên, “người chăn” rõ nghĩa, tự nhiên và không cần lặp từ “chiên” trong danh từ ghép. Danh từ vị ngữ tiếng Hy Lạp không có mạo từ nên bản dịch kèm chú thích giữ lại khả năng hiểu là “một người chăn”.
- source_word: τῶν προβάτων
  choice: của chiên
  rationale: Giữ trực tiếp hình ảnh “chiên” của πρόβατα thay vì diễn giải thành “bầy”; cấu trúc sở hữu diễn tả người chăn thuộc về hoặc có trách nhiệm đối với những con chiên ấy.
theological_decisions:
- issue: Tính xác định của ποιμήν trong vị ngữ
  choice: người chăn của chiên
  alternative: một người chăn chiên
  rationale: Ngữ cảnh đối lập người đi vào đúng cửa với những kẻ xâm nhập bất hợp pháp, nên cách hiểu xác định—người chăn chính đáng của chiên—phù hợp với mạch văn. Tuy vậy, vì ποιμήν không có mạo từ và tiếng Việt không bắt buộc đánh dấu tính xác định, chú thích ghi nhận khả năng hiểu bất định mà không áp đặt một kết luận thần học vượt quá ẩn dụ trước mắt.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Câu giữ hình ảnh cụ thể của nguyên văn; cấu trúc “thì là” phản ánh chức năng nhận định của ἐστιν, còn chú thích bảo tồn sự mơ hồ về tính xác định của danh từ vị ngữ.
