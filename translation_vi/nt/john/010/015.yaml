  source_fidelity: 'Bản dịch truyền đạt đúng các yếu tố chính: sự tương hỗ trong việc biết giữa Cha và Chúa Giê-su, việc hiến mạng sống, và đối tượng là chiên. Tuy nhiên, “Cũng như” phản ánh rõ hơn lực so sánh của καθὼς và liên kết với mệnh đề trước đó. Chú thích b hiện dùng “thay mặt cho chiên”, vốn dễ chuyển nghĩa ὑπέρ thành hành động đại diện do chiên thực hiện, không phù hợp ở đây.'
