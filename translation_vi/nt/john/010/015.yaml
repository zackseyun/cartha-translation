id: JHN.10.15
reference: John 10:15
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καθὼς γινώσκει με ὁ πατὴρ κἀγὼ γινώσκω τὸν πατέρα, καὶ τὴν ψυχήν μου τίθημι ὑπὲρ τῶν προβάτων.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/015.yaml
  text: just as the Father knows me and I know the Father[b][a], and I lay down my life for the sheep.
translation:
  language: vi
  text: Cũng như Cha biết tôi và tôi biết Cha, tôi hy sinh mạng sống mình vì chiên.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát: “đặt mạng sống mình xuống”; đây là cách nói về việc tự nguyện hiến mạng sống.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “vì lợi ích của chiên” hoặc “cho chiên.” Giới từ Hy Lạp có thể mang sắc thái đại diện hay hy sinh.'
    reason: alternative_reading
lexical_decisions:
- source_word: καθὼς
  choice: như
  rationale: Diễn đạt tự nhiên sự so sánh với mệnh đề trước, đồng thời giữ mối liên hệ chặt chẽ giữa hai kiểu nhận biết.
- source_word: γινώσκει / γινώσκω
  choice: biết
  rationale: Giữ nguyên động từ tương ứng trong hai vế và để văn mạch truyền tải chiều sâu quan hệ, thay vì diễn giải thành “hiểu rõ” hay “biết cách thân mật”.
- source_word: ὁ πατὴρ / τὸν πατέρα
  choice: Cha
  rationale: Giữ cách gọi đặc trưng trong Giăng và cấu trúc song song của nguyên văn; tiếng Việt không cần mạo từ tương ứng.
- source_word: κἀγὼ
  choice: và tôi
  rationale: Phản ánh καί + ἐγώ và giữ thế cân xứng giữa Cha biết Con và Con biết Cha.
- source_word: τὴν ψυχήν μου
  choice: mạng sống mình
  rationale: Trong ngữ cảnh tự hiến chịu chết, ψυχή chỉ sự sống hay mạng sống của Chúa Giê-su, không chủ yếu nói đến “linh hồn” như một phần phi vật chất.
- source_word: τίθημι
  choice: hy sinh
  rationale: Thành ngữ tiếng Việt “hy sinh mạng sống” truyền đạt tự nhiên hành động tự nguyện trao mạng sống trong ngữ cảnh này; nghĩa sát mặt chữ được ghi ở chú thích.
- source_word: ὑπὲρ
  choice: vì
  rationale: “Vì” tự nhiên, bao quát ý vì lợi ích và thay mặt cho, nhưng không thu hẹp giới từ thành một công thức thần học duy nhất.
- source_word: τῶν προβάτων
  choice: chiên
  rationale: Giữ hình ảnh người chăn và chiên xuyên suốt phân đoạn, thay vì chuyển sang từ khái quát “bầy”.
theological_decisions:
- issue: Sắc thái của ὑπὲρ trong sự tự hiến của Chúa Giê-su
  choice: Dịch là “vì” để giữ ý hành động hướng đến lợi ích của chiên và khả năng mang sắc thái đại diện hoặc hy sinh.
  alternative: “thay cho” hoặc “vì lợi ích của”
  rationale: Nguyên văn không tự nó giới hạn ὑπέρ vào duy nhất một mô hình giáo lý; “vì” bảo toàn độ rộng ngữ nghĩa ấy.
- issue: Nghĩa của ψυχή trong văn cảnh
  choice: Dịch là “mạng sống” chứ không phải “linh hồn”.
  alternative: “linh hồn”
  rationale: Văn cảnh nói về người chăn tự nguyện chết vì chiên; “mạng sống” tránh gây ấn tượng rằng chỉ phần phi vật chất được đem dâng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “tôi” theo lời trực tiếp của Chúa Giê-su, “Cha” theo lối gọi trong Tin Mừng Giăng, và giữ nguyên ẩn dụ “chiên”. Dấu chấm phẩy làm rõ hai phần của câu mà không tách chúng thành hai câu độc lập.
