  text: ἀλλὰ ὑμεῖς οὐ πιστεύετε, ⸂ὅτι οὐκ⸃ ἐστὲ ἐκ τῶν προβάτων τῶν ⸀ἐμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/026.yaml
  text: But you do not believe[a], because you are not among my sheep.
translation:
  language: vi
  text: Nhưng các ông không tin[a], vì các ông không thuộc về đàn chiên của tôi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “Nhưng các ông không tin rằng mình không thuộc về đàn chiên của tôi.” Liên từ Hy Lạp cũng có thể được hiểu là dẫn nội dung thay vì nêu nguyên nhân.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλὰ
  choice: Nhưng
  rationale: Liên từ đối lập, nối sự không tin của những người nghe với lời mô tả trước đó về chiên của Đức Giê-su.
- source_word: ὑμεῖς
  choice: các ông
  rationale: Đại từ được nêu rõ trong tiếng Hy Lạp để tạo sắc thái nhấn mạnh. Trong ngữ cảnh Đức Giê-su đang nói với những người Do Thái đối nghịch, “các ông” là cách xưng hô tự nhiên và phù hợp.
- source_word: οὐ πιστεύετε
  choice: không tin
  rationale: Thì hiện tại chủ động với phủ định được diễn đạt tự nhiên bằng hiện tại đơn; “tin” phù hợp với cách dùng đặc trưng trong sách Giăng.
- source_word: ὅτι
  choice: vì
  rationale: ὅτι có khả năng mang nghĩa nguyên nhân ở đây, giải thích sự không tin bằng việc họ không thuộc về đàn chiên; khả năng hiểu là từ dẫn nội dung được giữ trong chú thích.
- source_word: οὐκ ἐστὲ ἐκ
  choice: không thuộc về
  rationale: Cụm ἐκ với động từ εἰμί diễn tả tư cách thuộc về một nhóm; “thuộc về” truyền đạt tự nhiên hơn cách dịch sát chữ “không phải từ”.
- source_word: τῶν προβάτων τῶν ἐμῶν
  choice: đàn chiên của tôi
  rationale: Diễn đạt tự nhiên ý những con chiên thuộc về Đức Giê-su. “Đàn chiên” làm rõ tập hợp đang được nói đến mà không thêm nội dung thần học.
theological_decisions:
- issue: Chức năng của ὅτι giữa sự không tin và việc thuộc về chiên của Đức Giê-su
  choice: 'Cách hiểu nguyên nhân: “vì các ông không thuộc về đàn chiên của tôi”'
  alternative: 'Cách hiểu dẫn nội dung: “các ông không tin rằng mình không thuộc về đàn chiên của tôi”'
  rationale: Ngữ cảnh gần đối chiếu những con chiên nghe và đi theo Đức Giê-su với các đối thủ không tin, nên nghĩa nguyên nhân có vẻ thích hợp hơn. Tuy nhiên, cấu trúc Hy Lạp cũng cho phép ὅτι dẫn nội dung; chú thích bảo tồn sự mơ hồ có ý nghĩa thần học này mà không dùng câu văn để quyết định một hệ thống giáo lý rộng hơn.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “các ông” theo ngữ cảnh đối thoại; “đàn chiên của tôi” giữ hình ảnh mục tử và tư cách thuộc về.
