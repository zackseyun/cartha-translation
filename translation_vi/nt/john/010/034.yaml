  to: 'Giê-su trả lời họ: “Chẳng phải trong Luật của các ông có chép rằng: ‘Ta đã phán: Các ngươi là các thần[a]’ sao?”'
  rationale: Chỉnh sửa chỉ nhằm cải thiện cú pháp và tính tự nhiên của tiếng Việt hiện đại. Lời trích, thuật ngữ «Luật» và «các thần», cũng như sự mơ hồ diễn giải của Thi Thiên 82:6, đều được giữ nguyên.
