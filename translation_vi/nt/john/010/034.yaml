  text: ἀπεκρίθη αὐτοῖς ὁ Ἰησοῦς· Οὐκ ἔστιν γεγραμμένον ἐν τῷ νόμῳ ὑμῶν ⸀ὅτι Ἐγὼ εἶπα· Θεοί ἐστε;
base_translation:
  language: en
  yaml_path: translation/nt/john/010/034.yaml
  text: Jesus answered them[a], “Is it not written in your Law, ‘I said, you are gods’?”
translation:
  language: vi
  text: 'Giê-su trả lời họ: “Chẳng phải trong Luật của các ông có chép rằng: ‘Ta đã phán: Các ngươi là các thần[a]’ sao?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “những hữu thể thần linh.” Giê-su trích Thi Thiên 82:6; cách hiểu cụm từ này trong Thi Thiên ấy vẫn còn được tranh luận. Bản văn chính giữ cách diễn đạt trực tiếp của lời trích.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη αὐτοῖς
  choice: đáp họ
  rationale: Diễn đạt ngắn gọn, tự nhiên động từ tường thuật cùng tân ngữ số nhiều trong tiếng Việt.
- source_word: Οὐκ ἔστιν γεγραμμένον
  choice: chẳng phải có chép rằng … sao?
  rationale: Giữ nguyên hình thức câu hỏi phủ định và công thức dẫn nhập một lời Kinh Thánh, đồng thời phù hợp cách diễn đạt tiếng Việt.
- source_word: ἐν τῷ νόμῳ ὑμῶν
  choice: trong Luật của các ông
  rationale: “Luật” ở đây chỉ Kinh Thánh Do Thái theo nghĩa rộng, vì lời trích đến từ Thi Thiên 82:6; viết hoa để biểu thị danh xưng Kinh Thánh trong ngữ cảnh.
- source_word: Ἐγὼ εἶπα
  choice: Ta đã phán
  rationale: Đại từ “Ta” phù hợp lời Đức Chúa Trời trong câu trích; “đã phán” truyền đạt tự nhiên động từ aorist trong văn cảnh trang trọng.
- source_word: Θεοί
  choice: các thần
  rationale: Đây là tương đương trực tiếp của danh từ số nhiều θεοί và giữ nguyên sức nặng cũng như sự căng thẳng thần học của lời trích Thi Thiên 82:6.
- source_word: ἐστε
  choice: các ngươi là
  rationale: Dịch trực tiếp động từ liên kết; không thêm ý diễn giải như “được gọi là”.
theological_decisions:
- issue: Cách dịch θεοί trong lời trích Thi Thiên 82:6
  choice: các thần
  alternative: các hữu thể thần linh
  rationale: Bản văn chính giữ cách diễn đạt trực tiếp của tiếng Hy Lạp, không tự ý xác định những đối tượng được gọi là θεοί là ai. Phương án giải thích được nêu trong chú thích để bảo toàn sự mơ hồ và tranh luận của ngữ cảnh Thi Thiên.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “Giê-su” không kèm tước hiệu vì nguyên văn chỉ có tên Ἰησοῦς. “Các ông” thể hiện ngôi thứ hai số nhiều trong lời đối thoại; “các ngươi” được giữ trong lời trích để phù hợp giọng phán trang trọng.
