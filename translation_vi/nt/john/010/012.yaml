  verdict: revise
  source_fidelity: 'Bản nháp chuyển đạt đúng cấu trúc và diễn tiến chính của câu Hy Lạp: người làm thuê không phải người chăn, chiên không thuộc riêng về người ấy, thấy sói đến thì bỏ chiên chạy trốn; sói chộp lấy và làm chúng phân tán. Tuy nhiên, “chiên không thuộc về mình” có thể mơ hồ về chủ thể quy chiếu; “không phải là của riêng người ấy” phản ánh rõ hơn ἴδια. “Chộp lấy” cũng sát lực nghĩa ἁρπάζει hơn “vồ lấy”, vốn có thể chỉ riêng động tác lao vào tấn công.'
