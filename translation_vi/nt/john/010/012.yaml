  terminology: 'Giữ nhất quán hệ hình ảnh Giăng 10: “người làm thuê”, “người chăn”, “chiên”, “sói”. Không diễn giải ẩn dụ thành vai trò lãnh đạo hay giáo lý. Chú thích được rút gọn để chỉ nêu lựa chọn từ vựng, không đưa ra một hàm ý sở hữu vốn thuộc về mệnh đề kế tiếp của câu.'
  issues:
