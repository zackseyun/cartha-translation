source:
  edition: SBLGNT
  text: ὁ ⸀μισθωτὸς καὶ οὐκ ὢν ποιμήν, οὗ οὐκ ⸀ἔστιν τὰ πρόβατα ἴδια, θεωρεῖ τὸν λύκον ἐρχόμενον καὶ ἀφίησιν τὰ πρόβατα καὶ φεύγει— καὶ ὁ λύκος ἁρπάζει αὐτὰ καὶ ⸀σκορπίζει—
base_translation:
  language: en
  yaml_path: translation/nt/john/010/012.yaml
  text: The hired hand[a], who is not a shepherd and whose sheep are not his own, sees the wolf coming and leaves the sheep and flees—and the wolf snatches them and scatters them.
translation:
  language: vi
  text: Người làm thuê[a], không phải là người chăn và chiên không phải là của riêng người ấy, thấy sói đến thì bỏ chiên mà chạy trốn—sói chộp lấy chúng và làm chúng tan tác.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “kẻ làm thuê”. Từ này chỉ người làm việc để nhận tiền công.
    reason: lexical_alternative
lexical_decisions:
- source_word: μισθωτός
  choice: người làm thuê
  rationale: Chỉ người làm việc để nhận tiền công; cách nói này tự nhiên trong tiếng Việt hiện đại và giữ sự tương phản với người chăn thật.
- source_word: οὐκ ὢν ποιμήν
  choice: không phải là người chăn
  rationale: Chuyển kết cấu phân từ thành mệnh đề rõ nghĩa, vẫn giữ nhận định rằng người ấy không thật sự là người chăn.
- source_word: οὗ οὐκ ἔστιν τὰ πρόβατα ἴδια
  choice: chiên không thuộc về mình
  rationale: Diễn đạt tự nhiên việc người làm thuê không sở hữu và không có mối gắn bó riêng với đàn chiên.
- source_word: θεωρεῖ τὸν λύκον ἐρχόμενον
  choice: khi thấy sói đến
  rationale: Giữ hình ảnh sống động về việc nhận thấy mối nguy đang đến, đồng thời phù hợp cú pháp tiếng Việt.
- source_word: ἀφίησιν
  choice: bỏ
  rationale: Có thể mang nghĩa rời bỏ hoặc bỏ mặc; “bỏ” ngắn gọn, tự nhiên và giữ độ mở về sắc thái, còn ngữ cảnh cho thấy tính đáng trách.
- source_word: φεύγει
  choice: chạy trốn
  rationale: Diễn tả rõ hành động tháo chạy trước nguy hiểm bằng tiếng Việt thông dụng.
- source_word: ἁρπάζει
  choice: vồ lấy
  rationale: Trong ngữ cảnh sói tấn công chiên, “vồ lấy” truyền đạt hành động dữ dội và giữ hình ảnh thú săn mồi.
- source_word: σκορπίζει
  choice: làm chúng tan tác
  rationale: Diễn tả việc đàn chiên bị phân tán do sói tấn công; đại từ “chúng” làm rõ đối tượng ngầm trong tiếng Hy Lạp.
- source_word: πρόβατα
  choice: chiên
  rationale: Giữ danh từ số nhiều cụ thể và toàn bộ hình ảnh mục tử, thay vì đổi thành khái niệm diễn giải.
theological_decisions:
- issue: Sức gợi ẩn dụ của hình ảnh người chăn và người làm thuê
  choice: Giữ nguyên các thuật ngữ mục đồng “người chăn”, “người làm thuê”, “chiên” và “sói” trong bản văn.
  alternative: Diễn giải thành các vai trò như “người lãnh đạo” hoặc “người chăm sóc”.
  rationale: Giăng 10 triển khai một ẩn dụ mục đồng xuyên suốt. Thay bằng các khái niệm giải thích sẽ làm phẳng hình ảnh và đưa cách diễn giải thần học vào quá mức nguồn Hy Lạp.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dấu gạch ngang giữ nhịp chuyển đột ngột từ việc người làm thuê chạy trốn sang hậu quả đối với đàn chiên.
