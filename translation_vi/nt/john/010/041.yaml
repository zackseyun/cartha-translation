    rationale: Cấu trúc này có thể hiểu theo nghĩa tồn tại (“there were many people”), trong khi πολλοὶ ἦλθον trực tiếp nói rằng nhiều người đã đến. Bỏ “Có” sát nguồn và tự nhiên hơn.
  - severity: low
    issue: Liên kết mệnh đề lời nói
    rationale: ἔλεγον ὅτι được diễn đạt tự nhiên, rõ quan hệ hơn bằng “và nói rằng:”, dù dấu hai chấm và lời trích vẫn bảo toàn nội dung.
