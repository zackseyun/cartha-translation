base_translation:
  language: en
  yaml_path: translation/nt/john/010/041.yaml
  text: And many came to him and were saying, “John did no sign, but everything that John said about this man was true.”
translation:
  language: vi
  text: 'Nhiều người đến với Ngài và nói rằng: “Giăng không làm một dấu lạ nào,[a] nhưng mọi điều Giăng nói về người này[b] đều là thật.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “không thực hiện một dấu lạ nào.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “về Ngài.” Tiếng Hy Lạp dùng một đại từ chỉ định, nghĩa là “về người này.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: nhiều người
  rationale: Tính từ số nhiều được dùng như danh từ; thêm “người” là cách diễn đạt tự nhiên và rõ nghĩa trong tiếng Việt.
- source_word: ἦλθον πρὸς αὐτὸν
  choice: đến với Ngài
  rationale: Diễn đạt chuyển động hướng đến Chúa Giê-su; “đến với” tự nhiên trong mạch kể. “Ngài” duy trì văn phong tôn kính mà không thêm danh xưng không có trong câu Hy Lạp.
- source_word: ἔλεγον
  choice: nói
  rationale: Thì chưa hoàn thành có thể gợi lời nói đang diễn ra hoặc lặp lại; tiếng Việt thường dùng “nói” trong cấu trúc này mà không cần thêm trạng từ dễ làm quá rõ sắc thái.
- source_word: σημεῖον
  choice: dấu lạ
  rationale: Giữ ý nghĩa một việc phi thường có tính chỉ dấu trong Tin Mừng Giăng, thay vì chỉ dịch chung là “phép lạ”.
- source_word: ἐποίησεν οὐδέν
  choice: không làm một dấu lạ nào
  rationale: Phản ánh trực tiếp động từ ποιέω và phủ định toàn diện οὐδέν, đồng thời tự nhiên trong tiếng Việt.
- source_word: πάντα δὲ ὅσα
  choice: nhưng mọi điều
  rationale: Giữ lực bao quát của cấu trúc Hy Lạp và quan hệ tương phản của δέ.
- source_word: περὶ τούτου
  choice: về người này
  rationale: τούτου là đại từ chỉ định quy về Chúa Giê-su; “người này” bảo tồn sắc thái chỉ định thay vì làm phẳng thành “về Ngài”.
- source_word: ἀληθῆ ἦν
  choice: đều là thật
  rationale: “Đều” phù hợp với “mọi điều,” còn “là thật” chuyển tải trực tiếp vị ngữ ἀληθῆ mà không thêm ý ‘được chứng minh là đúng.’
theological_decisions:
- issue: Thuật ngữ σημεῖον trong Tin Mừng Giăng
  choice: dấu lạ
  alternative: phép lạ
  rationale: “Dấu lạ” giữ được chức năng thần học của σημεῖον như một hành động vừa kỳ diệu vừa chỉ đến căn tính và công việc của Chúa Giê-su.
- issue: Sắc thái của περὶ τούτου
  choice: về người này
  alternative: về Ngài
  rationale: Giữ đại từ chỉ định của nguyên văn và không xóa bỏ khoảng cách diễn ngôn trong lời của đám đông; chú thích nêu cách dịch tự nhiên khác.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Giăng” theo lối phiên âm Kinh Thánh quen thuộc; dùng “Ngài” để quy chiếu Chúa Giê-su, nhưng giữ “người này” tại περὶ τούτου nhằm bảo tồn sắc thái chỉ định của nguyên văn.
