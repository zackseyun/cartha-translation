  terminology: “Giăng” là cách gọi Kinh Thánh quen thuộc; “Ngài” duy trì lối xưng hô tôn kính nhất quán trong lời người kể. “Dấu lạ” giữ thuật ngữ then chốt của Tin Mừng Giăng. “Người này” được giữ trong lời thuật lại của đám đông để không làm phẳng đại từ chỉ định τούτου.
  issues:
