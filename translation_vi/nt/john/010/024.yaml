id: JHN.10.24
reference: John 10:24
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐκύκλωσαν οὖν αὐτὸν οἱ Ἰουδαῖοι καὶ ἔλεγον αὐτῷ· Ἕως πότε τὴν ψυχὴν ἡμῶν αἴρεις; εἰ σὺ εἶ ὁ χριστός, εἰπὲ ἡμῖν παρρησίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/024.yaml
  text: So the Jews surrounded him and were saying to him[a], “How long will you keep us in suspense? If you are the Messiah[b], tell us plainly.”
translation:
  language: vi
  text: 'Vì thế, những người Do Thái[a] vây quanh Đức Giê-su và cứ hỏi Người: “Ông còn để chúng tôi thấp thỏm đến bao giờ?[b] Nếu ông là Đấng Mê-si, hãy nói rõ cho chúng tôi.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Trong sách Giăng, tùy văn cảnh, cụm từ “những người Do Thái” có thể chỉ cụ thể hơn đến các nhà chức trách hoặc những người Do Thái chống đối Đức Giê-su, chứ không nhất thiết là toàn thể dân Do Thái.
    reason: cultural_note
  - marker: b
    text: 'Dịch sát hơn: “Ông còn nâng linh hồn chúng tôi lên đến bao giờ?” Đây là một thành ngữ chỉ việc để người ta trong tình trạng bất định hoặc thấp thỏm chờ đợi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκύκλωσαν
  choice: vây quanh
  rationale: Giữ nghĩa cụ thể của động từ κυκλόω là bao vây hoặc đứng thành vòng quanh, đồng thời tự nhiên trong tiếng Việt và không làm nhẹ sắc thái đối chất.
- source_word: οὖν
  choice: Vì thế
  rationale: Diễn tả quan hệ tiếp nối/suy ra của οὖν trong mạch kể; “Vì thế” trang trọng, rõ nghĩa và phù hợp văn cảnh.
- source_word: οἱ Ἰουδαῖοι
  choice: những người Do Thái
  rationale: Giữ cách gọi trực tiếp của nguyên văn, không tự ý thu hẹp thành giới lãnh đạo; chú thích nêu khả năng từ này chỉ một nhóm cụ thể trong văn cảnh Giăng.
- source_word: ἔλεγον
  choice: hỏi
  rationale: Nội dung lời nói là một câu hỏi tiếp theo bằng mệnh lệnh; tiếng Việt tự nhiên dùng “hỏi”. Dạng chưa hoàn thành trong tiếng Hy Lạp cho thấy hành động đang diễn ra, nhưng dịch máy móc là “đang nói” sẽ kém tự nhiên.
- source_word: Ἕως πότε τὴν ψυχὴν ἡμῶν αἴρεις
  choice: Thầy còn để chúng tôi thấp thỏm đến bao giờ?
  rationale: Chuyển tải thành ngữ nghĩa là giữ người khác trong tình trạng bất định, chờ đợi căng thẳng. “Thấp thỏm” tự nhiên và giữ được sắc thái cảm xúc; hình ảnh sát chữ được nêu trong chú thích.
- source_word: ὁ χριστός
  choice: Đấng Mê-si
  rationale: Χριστός ở đây là tước hiệu về nhân vật được xức dầu mà người hỏi đang chờ đợi; “Đấng Mê-si” bảo tồn bối cảnh Do Thái và chức năng tước hiệu.
- source_word: εἰπὲ ἡμῖν
  choice: hãy nói ... cho chúng tôi
  rationale: Thể mệnh lệnh aorist là lời yêu cầu trực tiếp; cấu trúc này rõ ràng, tự nhiên trong tiếng Việt.
- source_word: παρρησίᾳ
  choice: nói rõ
  rationale: Trong văn cảnh, từ này chỉ việc phát biểu công khai, thẳng thắn và không mơ hồ. “Nói rõ” phù hợp trực tiếp với đòi hỏi xác nhận căn tính.
theological_decisions:
- issue: Cách dịch Χριστός
  choice: Đấng Mê-si
  alternative: Đấng Ki-tô
  rationale: Từ này đang hoạt động như tước hiệu của vị vua/đấng giải cứu được mong đợi, không phải như một phần tên riêng; “Đấng Mê-si” giữ rõ bối cảnh của câu hỏi.
- issue: Đối tượng của οἱ Ἰουδαῖοι trong sách Giăng
  choice: những người Do Thái
  alternative: các nhà lãnh đạo Do Thái; những người Giu-đê
  rationale: Câu này không minh nhiên gọi họ là giới lãnh đạo. Bản dịch giữ phạm vi từ ngữ của nguyên văn và dùng chú thích để tránh khiến độc giả hiểu đây nhất thiết là toàn thể dân Do Thái.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Đức Giê-su” theo lối gọi kính trọng phổ biến; đại từ “thầy” phản ánh cách người đối thoại trực tiếp gọi một bậc giáo huấn mà không áp đặt lời tuyên xưng thần học. Hai dấu chú thích [a], [b] đều có mặt trong chính văn.
