source:
  edition: SBLGNT
  text: τούτῳ ὁ θυρωρὸς ἀνοίγει, καὶ τὰ πρόβατα τῆς φωνῆς αὐτοῦ ἀκούει καὶ τὰ ἴδια πρόβατα ⸀φωνεῖ κατ’ ὄνομα καὶ ἐξάγει αὐτά.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/003.yaml
  text: To him the gatekeeper opens[a], and the sheep hear his voice, and he calls his own sheep by name and leads them out.
translation:
  language: vi
  text: Người giữ cửa mở cho người ấy, và chiên nghe tiếng người ấy; người ấy gọi đích danh các con chiên của mình và dẫn chúng ra.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đưa chúng ra.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: τούτῳ
  choice: cho người ấy
  rationale: Đại từ chỉ định ở cách dữ, số ít, quy chiếu về người chăn chiên trong câu trước. “Cho người ấy” tự nhiên trong tiếng Việt và không đưa danh tính của nhân vật vào bản dịch.
- source_word: ὁ θυρωρός
  choice: người giữ cửa
  rationale: Chỉ người trông coi và mở lối vào chuồng chiên; cách diễn đạt này rõ nghĩa, tự nhiên hơn từ cổ hoặc quá chuyên biệt.
- source_word: ἀνοίγει
  choice: mở cửa
  rationale: Động từ hiện tại đơn có nghĩa “mở”; thêm “cửa” làm rõ đối tượng vốn được ngữ cảnh và danh từ “người giữ cửa” hàm ý.
- source_word: τὰ πρόβατα
  choice: chiên
  rationale: Cách gọi thông dụng trong hình ảnh mục tử; tiếng Việt không cần mạo từ xác định tương ứng.
- source_word: τῆς φωνῆς αὐτοῦ ἀκούει
  choice: nghe tiếng người ấy
  rationale: Giữ nghĩa trực tiếp của “nghe tiếng”. Chủ ngữ trung tính số nhiều đi với động từ số ít trong tiếng Hy Lạp nhưng mang nghĩa số nhiều; tiếng Việt không cần biểu thị sự hòa hợp số.
- source_word: τὰ ἴδια πρόβατα
  choice: từng con chiên của mình
  rationale: “Của mình” thể hiện quan hệ sở hữu đặc biệt của ἴδια; “từng con” phối hợp tự nhiên với việc gọi đích danh từng cá thể.
- source_word: φωνεῖ κατ’ ὄνομα
  choice: gọi đích danh
  rationale: Diễn đạt tự nhiên ý gọi riêng từng con theo tên, đồng thời giữ hành động của người chăn.
- source_word: ἐξάγει αὐτά
  choice: dẫn chúng ra
  rationale: ἐξάγω có thể là “dẫn ra” hoặc “đưa ra”. Trong hình ảnh người chăn chiên, “dẫn chúng ra” nhấn mạnh sự hướng dẫn mà không thêm ý ngoài văn bản.
theological_decisions:
- issue: Hình ảnh người chăn chiên và chủ thể hành động
  choice: 'Giữ cách gọi “người ấy” cho nhân vật người chăn chiên: người giữ cửa mở cho người ấy, chiên nghe tiếng người ấy, rồi người ấy gọi và dẫn chiên ra.'
  alternative: Nêu đích danh Chúa Giê-su hoặc giải thích biểu tượng ngay trong câu.
  rationale: Bản văn ở đây tiếp tục hình ảnh ẩn dụ từ câu trước nhưng chưa nêu đích danh nhân vật trong chính câu này. Bản dịch không nên giải quyết ẩn dụ bằng cách thêm phần diễn giải thần học.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Lặp lại “người ấy” để các đại từ quy chiếu rõ ràng trong tiếng Việt; dấu chú thích được đặt ngay sau cụm từ mà chú thích giải thích.
