revisions:
- from: Người giữ cửa mở cửa cho người ấy; chiên nghe tiếng người ấy. Người ấy gọi đích danh từng con chiên của mình và dẫn chúng ra.[a]
  to: Người giữ cửa mở cho người ấy, và chiên nghe tiếng người ấy; người ấy gọi đích danh các con chiên của mình và dẫn chúng ra.[a]
  rationale: Bản sửa chỉ làm câu gọn và tự nhiên hơn, đồng thời duy trì sát nghĩa trình tự, chủ thể, sở hữu nhấn mạnh trong τὰ ἴδια πρόβατα, và ý gọi theo tên của κατ’ ὄνομα. Chú thích từ vựng cho ἐξάγει vẫn phù hợp và được neo ngay sau «dẫn chúng ra».
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T06:23:03Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp truyền đạt đúng chuỗi hành động và các quan hệ trong tiếng Hy Lạp: người giữ cửa mở cho người chăn, chiên nghe tiếng ông, ông gọi các chiên thuộc về mình theo tên và dẫn chúng ra. Tuy nhiên, «mở cửa cho» thêm rõ đối tượng trực tiếp không được nêu rõ trong câu Hy Lạp, dù ngữ cảnh hàm ý; có thể diễn đạt gọn hơn mà vẫn tự nhiên.'
  naturalness: «Người giữ cửa mở cửa cho người ấy» hơi lặp và nặng. Cấu trúc một câu với «và» sau mệnh đề đầu phản ánh liên kết καί tốt hơn, đồng thời «các con chiên của mình» tự nhiên hơn «từng con chiên của mình» trong vị trí bổ ngữ của «gọi đích danh».
  terminology: «Người giữ cửa», «chiên», «nghe tiếng», «gọi đích danh», và «dẫn ... ra» đều phù hợp với văn phong Kinh Thánh Việt ngữ hiện đại và giữ nguyên hình ảnh chăn chiên. Không nên thay «người ấy» bằng danh xưng giải thích thần học.
  issues:
  - severity: low
    issue: Cụm «mở cửa cho người ấy» có sự lặp từ và nêu rõ «cửa» như đối tượng.
    rationale: ἀνοίγει không nêu đối tượng trực tiếp; trong tiếng Việt, «người giữ cửa mở cho người ấy» vừa tự nhiên vừa để đối tượng mở được hàm ý theo ngữ cảnh chuồng chiên.
  - severity: low
    issue: «Từng con chiên của mình» có thể làm «từng» mang sắc thái phân phối mạnh hơn cần thiết.
    rationale: κατ’ ὄνομα có nghĩa gọi theo tên, tức gọi từng con một, nhưng «gọi đích danh các con chiên của mình» đã diễn đạt đầy đủ ý này trong tiếng Việt tự nhiên.
  revised_text: Người giữ cửa mở cho người ấy, và chiên nghe tiếng người ấy; người ấy gọi đích danh các con chiên của mình và dẫn chúng ra.[a]
