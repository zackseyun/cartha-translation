id: JHN.10.11
reference: John 10:11
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἐγώ εἰμι ὁ ποιμὴν ὁ καλός· ὁ ποιμὴν ὁ καλὸς τὴν ψυχὴν αὐτοῦ τίθησιν ὑπὲρ τῶν προβάτων·
base_translation:
  language: en
  yaml_path: translation/nt/john/010/011.yaml
  text: I am the good shepherd[c][b][a]. The good shepherd lays down his life for the sheep.
translation:
  language: vi
  text: Ta là người chăn chiên tốt lành.[a] Người chăn chiên tốt lành hy sinh mạng sống mình vì đàn chiên.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “người chăn chiên cao quý” hoặc “người chăn chiên mẫu mực”; từ Hy Lạp καλός có thể chỉ điều tốt đẹp, cao quý hoặc đáng noi theo.'
    reason: lexical_alternative
  - marker: b
    text: 'Theo sát chữ: “đặt xuống sự sống của mình”; đây là một thành ngữ Hy Lạp chỉ việc trao hoặc hy sinh mạng sống.'
    reason: lexical_alternative
  - marker: c
    text: “Vì” cũng có thể diễn đạt là “vì lợi ích của đàn chiên.”
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐγώ εἰμι
  choice: Ta là
  rationale: Đại từ Ἐγώ được nêu rõ nên có sắc thái nhấn mạnh. “Ta là” là cách tự xưng trang trọng, tự nhiên của Chúa Giê-su trong văn cảnh này, nhưng không diễn giải quá mức thành một ám chỉ minh nhiên đến danh Đức Chúa Trời.
- source_word: ποιμήν
  choice: người chăn chiên
  rationale: Diễn đạt trực tiếp hình ảnh người chăm sóc đàn chiên; tránh “mục sư,” vốn dễ đưa vào văn bản một chức vụ hội thánh về sau.
- source_word: καλός
  choice: tốt lành
  rationale: Vừa tự nhiên trong danh xưng quen thuộc “người chăn chiên tốt lành,” vừa chuyển tải phẩm chất tốt đẹp, cao quý và mẫu mực của καλός mà không thu hẹp nghĩa.
- source_word: τὴν ψυχὴν αὐτοῦ τίθησιν
  choice: hy sinh mạng sống mình
  rationale: Cụm Hy Lạp, theo sát chữ là “đặt xuống sự sống của mình,” là một thành ngữ chỉ việc tự nguyện trao hoặc bỏ mạng sống. “Hy sinh mạng sống mình” truyền đạt ý nghĩa tự nhiên bằng tiếng Việt và giữ sắc thái tự hiến trong văn cảnh.
- source_word: ὑπὲρ τῶν προβάτων
  choice: vì đàn chiên
  rationale: “Vì” giữ được phạm vi nghĩa thụ hưởng và đại diện của ὑπέρ mà không áp đặt một lý thuyết chuộc tội cụ thể. “Đàn chiên” tự nhiên hơn “những con chiên” trong hình ảnh người chăn chiên, đồng thời không thêm đại từ sở hữu.
theological_decisions:
- issue: Sức nặng của lời tự nhận Ἐγώ εἰμι
  choice: Dịch là “Ta là” mà không giải thích thêm trong chính văn.
  alternative: “Chính Ta là”; hoặc diễn đạt theo hướng minh nhiên ám chỉ danh Đức Chúa Trời.
  rationale: Trong câu này, cụm từ hoạt động về ngữ pháp như lời tự xác định với vị ngữ “người chăn chiên tốt lành.” Cách dịch không phủ nhận âm hưởng rộng hơn trong thần học Giăng nhưng cũng không biến âm hưởng ấy thành điều được câu văn nói rõ.
- issue: Ý nghĩa của καλός trong danh xưng người chăn chiên
  choice: “người chăn chiên tốt lành”
  alternative: “người chăn chiên cao quý”; “người chăn chiên mẫu mực”
  rationale: καλός có thể bao hàm sự tốt đẹp, cao quý và đáng noi theo. “Tốt lành” vừa chính xác, trang trọng, vừa tránh chọn riêng một sắc thái và loại bỏ các sắc thái còn lại.
- issue: Ý nghĩa của ὑπὲρ τῶν προβάτων đối với cái chết của Chúa Giê-su
  choice: “vì đàn chiên”
  alternative: “thay cho đàn chiên”; “vì lợi ích của đàn chiên”
  rationale: ὑπέρ có thể mang sức nghĩa “vì,” “vì lợi ích của,” hoặc “thay mặt cho.” Bản dịch chính giữ độ rộng này, không thu hẹp thành một công thức tín lý cụ thể.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Ta” cho lời tự xưng của Chúa Giê-su và “người chăn chiên” để giữ hình ảnh nguyên ngữ. “Hy sinh mạng sống” ưu tiên sự tự nhiên của tiếng Việt hơn lối dịch sát chữ khó hiểu, trong khi chú thích bảo tồn cấu trúc Hy Lạp.
