id: JHN.10.18
reference: John 10:18
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οὐδεὶς ⸀αἴρει αὐτὴν ἀπ’ ἐμοῦ, ἀλλ’ ἐγὼ τίθημι αὐτὴν ἀπ’ ἐμαυτοῦ. ἐξουσίαν ἔχω θεῖναι αὐτήν, καὶ ἐξουσίαν ἔχω πάλιν λαβεῖν αὐτήν· ταύτην τὴν ἐντολὴν ἔλαβον παρὰ τοῦ πατρός μου.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/018.yaml
  text: No one takes it from me[a], but I lay it down of myself. I have authority to lay it down, and I have authority to take it up again[c][b]. This command I received from my Father.
translation:
  language: vi
  text: Không ai lấy mạng sống tôi khỏi tôi; nhưng chính tôi tự nguyện hiến mạng sống mình.[a] Tôi có quyền[b] hiến mạng sống ấy và có quyền lấy lại mạng sống ấy.[c] Mệnh lệnh này tôi đã nhận từ Cha tôi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cụm Hy Lạp có thể dịch sát hơn là “từ chính mình” hoặc “do chính mình”; ở đây nó nhấn mạnh rằng Chúa Giê-xu tự nguyện hiến mạng sống, nhưng phần cuối câu không cho thấy Ngài hành động độc lập với Cha.
    reason: lexical_alternative
  - marker: b
    text: Từ Hy Lạp có thể mang nghĩa “quyền”, “thẩm quyền” hoặc “quyền năng”, bao gồm cả quyền chính đáng lẫn khả năng thực hiện.
    reason: lexical_alternative
  - marker: c
    text: “Lấy lại” cũng có thể dịch là “nhận lại”. Đại từ trong nguyên văn chỉ về mạng sống của Chúa Giê-xu.
    reason: lexical_alternative
lexical_decisions:
- source_word: αἴρει αὐτὴν ἀπ’ ἐμοῦ
  choice: lấy mạng sống tôi khỏi tôi
  rationale: Trong ngữ cảnh, đại từ αὐτήν chỉ về mạng sống của Chúa Giê-xu ở câu trước; αἴρω cùng ἀπό diễn tả việc lấy đi khỏi Ngài. Nêu rõ “mạng sống” giúp câu tiếng Việt tự nhiên và rõ nghĩa.
- source_word: τίθημι αὐτὴν
  choice: hiến mạng sống mình
  rationale: Thành ngữ Hy Lạp “đặt mạng sống xuống” nói về việc tự nguyện phó mạng sống. Dịch “hiến mạng sống” truyền đạt đúng ý trong tiếng Việt hiện đại mà không làm mất sắc thái tự nguyện và hy sinh.
- source_word: ἀπ’ ἐμαυτοῦ
  choice: chính tôi tự nguyện
  rationale: Cụm phản thân nhấn mạnh hành động phát xuất từ chính Chúa Giê-xu. “Chính tôi tự nguyện” diễn đạt rõ quyền chủ động nhưng không hàm ý Ngài hành động tách biệt với Cha.
- source_word: ἐξουσίαν
  choice: quyền
  rationale: ἐξουσία bao hàm thẩm quyền hoặc quyền chính đáng, chứ không chỉ khả năng. “Quyền” tự nhiên trong tiếng Việt và phù hợp với mệnh lệnh nhận từ Cha ở cuối câu.
- source_word: πάλιν λαβεῖν αὐτήν
  choice: lấy lại mạng sống ấy
  rationale: λαμβάνω có thể là “lấy” hoặc “nhận”; với πάλιν, “lấy lại” giữ được sắc thái chủ động của văn cảnh, đồng thời chú thích bảo lưu khả năng dịch khác.
- source_word: ἐντολήν
  choice: mệnh lệnh
  rationale: “Mệnh lệnh” phản ánh trực tiếp lực nghĩa của ἐντολή và giữ nguyên mối quan hệ giữa Con với Cha trong câu.
- source_word: παρὰ τοῦ πατρός μου
  choice: từ Cha tôi
  rationale: παρά với sở hữu cách chỉ nguồn gốc; “từ Cha tôi” là cách diễn đạt rõ ràng, tự nhiên và giữ nguyên ngôn ngữ quan hệ của bản văn.
theological_decisions:
- issue: Quyền chủ động của Chúa Giê-xu và sự vâng phục Cha
  choice: “chính tôi tự nguyện” đi cùng “mệnh lệnh này tôi đã nhận từ Cha tôi”
  alternative: “do tự mình tôi” hoặc “theo sáng kiến riêng của tôi”
  rationale: 'Bản dịch giữ cả hai vế căng thẳng của bản văn: Chúa Giê-xu tự nguyện hiến mạng sống, nhưng hành động ấy không được trình bày như độc lập với Cha.'
- issue: Nghĩa của ἐξουσία đối với sự chết và việc nhận lại mạng sống
  choice: quyền
  alternative: quyền năng; thẩm quyền
  rationale: “Quyền” có thể bao gồm cả quyền chính đáng lẫn năng lực thực hiện, không thu hẹp câu thành lời khẳng định về sức mạnh thuần túy.
- issue: Chủ thể của việc πάλιν λαβεῖν
  choice: Chúa Giê-xu “lấy lại” mạng sống
  alternative: Chúa Giê-xu “nhận lại” mạng sống
  rationale: Thể chủ động của động từ cho phép cách dịch “lấy lại”, nhưng “nhận lại” vẫn là một khả năng từ vựng. Chú thích bảo lưu điểm chưa hoàn toàn đơn nghĩa này thay vì giải quyết nó theo một hệ phái.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Bản dịch dùng “hiến mạng sống” thay cho hình ảnh dịch sát nhưng thiếu tự nhiên “đặt mạng sống xuống”; lặp lại “mạng sống ấy” để câu đứng riêng vẫn rõ nghĩa. Đại từ “tôi” theo lời trực tiếp của Chúa Giê-xu, và “Cha tôi” giữ nguyên sắc thái quan hệ của nguyên văn.
