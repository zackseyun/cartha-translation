  text: εἰ οὐ ποιῶ τὰ ἔργα τοῦ πατρός μου, μὴ πιστεύετέ μοι·
base_translation:
  language: en
  yaml_path: translation/nt/john/010/037.yaml
  text: If I am not doing the works of my Father[a], do not believe me;
translation:
  language: vi
  text: Nếu tôi không làm những việc của Cha tôi, thì đừng tin tôi;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰ
  choice: Nếu
  rationale: Mở đầu mệnh đề điều kiện; “nếu” là cách diễn đạt tự nhiên và sát nghĩa trong tiếng Việt.
- source_word: οὐ ποιῶ
  choice: tôi không làm
  rationale: Động từ hiện tại chủ động ngôi thứ nhất số ít, được phủ định bởi οὐ. Tiếng Việt không bắt buộc đánh dấu thể tiếp diễn; “không làm” vừa tự nhiên vừa có thể chỉ hành động đang diễn ra hoặc mang tính thường xuyên trong ngữ cảnh.
- source_word: τὰ ἔργα
  choice: những công việc
  rationale: Giữ nghĩa rộng của ἔργα là các việc làm/hành động; “công việc” cũng duy trì mối liên hệ với cách dùng quan trọng của từ này trong sách Giăng mà không thu hẹp riêng vào phép lạ.
- source_word: τοῦ πατρός μου
  choice: của Cha tôi
  rationale: Dịch trực tiếp kết cấu sở hữu. Viết hoa “Cha” vì trong ngữ cảnh đây là cách Chúa Giê-su gọi Đức Chúa Trời.
- source_word: μὴ πιστεύετέ
  choice: đừng tin
  rationale: Mệnh lệnh hiện tại với μή diễn đạt lời ngăn cấm. “Đừng tin” là cách nói hiện đại, tự nhiên và phù hợp với nghĩa thông thường của πιστεύω.
- source_word: μοι
  choice: tôi
  rationale: Đại từ tặng cách đi với πιστεύω có thể chỉ việc tin một người; “tin tôi” giữ cấu trúc trực tiếp và không diễn giải quá mức thành nội dung lời nói.
theological_decisions:
- issue: Sắc thái của πιστεύω với đại từ tặng cách μοι
  choice: “đừng tin tôi,” hướng sự tin nhận vào chính Chúa Giê-su
  alternative: “đừng tin lời tôi nói”
  rationale: Cấu trúc Hy Lạp có thể mang nghĩa tin một người, đồng thời trong ngữ cảnh cũng hàm ý tin lời người ấy. Bản chính giữ cách nói trực tiếp, bảo toàn sự chồng lấn giữa bình diện cá nhân và lời chứng mà không âm thầm chọn một cách diễn giải hẹp hơn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “những công việc” thay vì “các việc làm” để giữ âm hưởng Giăng và phạm vi nghĩa rộng của ἔργα. Không thêm chú thích vì phương án “tin lời tôi nói” đã được ghi nhận trong quyết định dịch nhưng không cần thiết cho một câu tiếng Việt vốn tự nhiên và vẫn giữ được độ mở của nguyên văn.
