id: JHN.10.21
reference: John 10:21
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸀ἄλλοι ἔλεγον· Ταῦτα τὰ ῥήματα οὐκ ἔστιν δαιμονιζομένου· μὴ δαιμόνιον δύναται τυφλῶν ὀφθαλμοὺς ⸀ἀνοῖξαι;
base_translation:
  language: en
  yaml_path: translation/nt/john/010/021.yaml
  text: Others were saying[a], “These words are not those of a demon-possessed man. A demon cannot open the eyes of the blind, can it?”
translation:
  language: vi
  text: 'Những người khác lại nói: “Những lời này không phải là lời của một người bị quỷ ám.[a] Lẽ nào quỷ có thể mở mắt người mù sao?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Những lời này không thể phát ra từ một người bị quỷ ám.”'
    reason: Nêu cách diễn đạt khác cho quan hệ hàm ý giữa những lời nói và người nói trong οὐκ ἔστιν δαιμονιζομένου.
lexical_decisions:
- source_word: ἄλλοι
  choice: Những người khác
  rationale: Diễn tả nhóm người đối lập với những người vừa phát biểu trong ngữ cảnh trước đó.
- source_word: ἔλεγον
  choice: lại nói
  rationale: Thì chưa hoàn thành có thể gợi lời đang được nói hoặc lặp lại; tiếng Việt không bắt buộc đánh dấu quá khứ, còn “lại” làm rõ sự tương phản giữa hai nhóm.
- source_word: Ταῦτα τὰ ῥήματα
  choice: Những lời này
  rationale: Chỉ trực tiếp những lời Đức Giê-su vừa nói và giữ cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: οὐκ ἔστιν δαιμονιζομένου
  choice: không phải là lời của một người bị quỷ ám
  rationale: Chuyển cấu trúc sở hữu hàm ý nguồn phát ngôn thành câu tiếng Việt rõ ràng, đồng thời không xác định chi tiết cơ chế quỷ tác động vượt quá bản Hy Lạp.
- source_word: δαιμόνιον
  choice: quỷ
  rationale: Là cách tương ứng trực tiếp, thông dụng với δαιμόνιον; tránh dùng “tà linh”, vốn mang tính diễn giải hơn.
- source_word: μὴ ... δύναται
  choice: Lẽ nào ... có thể ... sao?
  rationale: Cấu trúc nghi vấn tu từ tự nhiên trong tiếng Việt và cho thấy câu hỏi chờ đợi câu trả lời phủ định.
- source_word: τυφλῶν ὀφθαλμοὺς ἀνοῖξαι
  choice: mở mắt người mù
  rationale: Giữ hình ảnh cụ thể “mở mắt” của nguyên văn và mối liên hệ với việc chữa lành người mù trong ngữ cảnh.
theological_decisions:
- issue: Cách dịch δαιμονίζομαι và δαιμόνιον
  choice: bị quỷ ám / quỷ
  alternative: bị quỷ tác động / tà linh
  rationale: “Bị quỷ ám” là cách nói quen thuộc, dễ hiểu, nhưng không thêm mô tả về bản chất hay mức độ kiểm soát của quỷ; “quỷ” dịch trực tiếp δαιμόνιον mà không làm nhẹ ngôn ngữ của câu.
- issue: Sắc thái câu hỏi do μή dẫn nhập
  choice: Lẽ nào quỷ có thể mở mắt người mù sao?
  alternative: Quỷ không thể mở mắt người mù, phải không?
  rationale: Cách chọn giữ hình thức nghi vấn và thể hiện rõ người nói mong đợi câu trả lời phủ định, nhưng không biến lập luận của đám đông thành lời khẳng định tuyệt đối của người thuật chuyện.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Lẽ nào … sao?” truyền đạt tự nhiên sức nặng của câu hỏi tu từ; “mở mắt người mù” giữ hình ảnh nguyên văn thay vì diễn giải thành “làm cho người mù thấy được”.
