source:
  edition: SBLGNT
  text: εἰ ἐκείνους εἶπεν θεοὺς πρὸς οὓς ὁ λόγος τοῦ θεοῦ ἐγένετο, καὶ οὐ δύναται λυθῆναι ἡ γραφή,
base_translation:
  language: en
  yaml_path: translation/nt/john/010/035.yaml
  text: If he called those to whom the word of God came ‘gods’—and the Scripture cannot be broken—[a][b]
translation:
  language: vi
  text: Nếu Ngài gọi những người mà lời Đức Chúa Trời đã đến với là ‘các thần’[a]—mà Kinh Thánh không thể bị vô hiệu hóa[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “các đấng thần linh”. Tiếng Hy Lạp nói “các thần”, nhắc lại Thi Thiên 82:6; một số người giải thích rằng những người được nói đến là các quan xét loài người.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “không thể bị phá bỏ” hoặc “không thể bị gạt sang một bên”.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ
  choice: Nếu
  rationale: Giữ nguyên cấu trúc điều kiện trong lập luận của Chúa Giê-su; trong ngữ cảnh này, mệnh đề nêu một tiền đề được thừa nhận để suy luận.
- source_word: ἐκείνους εἶπεν θεοὺς
  choice: Ngài gọi những người ... là ‘các thần’
  rationale: Diễn đạt tự nhiên cấu trúc vị ngữ của tiếng Hy Lạp mà không thêm ‘đàn ông’ hay đồng nhất họ với các quan xét.
- source_word: θεοὺς
  choice: các thần
  rationale: Phản ánh trực tiếp số nhiều của θεός và lời dẫn Thi Thiên 82:6; chữ thường phân biệt với Đức Chúa Trời nhưng không giải quyết danh tính của những người được nói đến.
- source_word: πρὸς οὓς ὁ λόγος τοῦ θεοῦ ἐγένετο
  choice: những người được lời Đức Chúa Trời truyền đến
  rationale: Giữ hướng ‘đến những người ấy’ và sắc thái lời phán được ban/truyền đến họ; câu bị động giúp tiếng Việt tự nhiên trong cấu trúc bao quanh.
- source_word: ὁ λόγος τοῦ θεοῦ
  choice: lời Đức Chúa Trời
  rationale: Ở đây chỉ lời phán của Đức Chúa Trời trong Kinh Thánh, không phải danh xưng Ngôi Lời trong Giăng 1.
- source_word: οὐ δύναται λυθῆναι
  choice: không thể bị vô hiệu hóa
  rationale: λυθῆναι theo ngữ cảnh mang ý nghĩa hủy bỏ, làm mất hiệu lực hoặc gạt sang một bên; cách dịch này rõ nghĩa trong tiếng Việt hiện đại.
- source_word: ἡ γραφή
  choice: Kinh Thánh
  rationale: Diễn đạt tự nhiên danh từ số ít có mạo từ, chỉ văn bản Kinh Thánh có thẩm quyền.
theological_decisions:
- issue: Ý nghĩa của ‘các thần’ trong lời trích dẫn
  choice: Giữ nguyên ‘các thần’ trong chính văn, không chú giải thành ‘các quan xét’.
  alternative: các bậc thần linh; các quan xét
  rationale: Lập luận dựa trên chính từ ngữ của Thi Thiên 82:6. Dịch thành ‘các quan xét’ sẽ quyết định một cách hiểu còn đang được tranh luận; chú thích bảo tồn phương án từ vựng và cách giải thích ấy.
- issue: Ý nghĩa của mệnh đề Kinh Thánh không thể bị λυθῆναι
  choice: không thể bị vô hiệu hóa
  alternative: không thể bị phá bỏ; không thể bị gạt sang một bên
  rationale: Cách chọn làm rõ ý Kinh Thánh không thể bị hủy bỏ hay làm mất hiệu lực, đồng thời tránh hình ảnh ‘bẻ gãy’ có thể khó hiểu trong tiếng Việt.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng ‘Ngài’ vì chủ thể ngầm trong mạch văn là Đức Chúa Trời; giữ dấu gạch ngang để thể hiện mệnh đề xen và giữ câu mở, vì câu Hy Lạp tiếp tục sang câu sau.
