  source_fidelity: 'Bản dịch giữ đúng cấu trúc điều kiện của εἰ, thuật ngữ số nhiều θεούς (“các thần”), và ý nghĩa pháp lý/thẩm quyền của οὐ δύναται λυθῆναι (“không thể bị vô hiệu hóa”). Tuy nhiên, cụm “những người được lời Đức Chúa Trời truyền đến” đảo sai quan hệ cú pháp: trong nguyên văn, “lời Đức Chúa Trời” là chủ thể đến với những người ấy, chứ không phải điều được “truyền đến” theo dạng bị động cho họ.'
  naturalness: Cụm hiện hữu “được lời ... truyền đến” không tự nhiên trong tiếng Việt hiện đại và dễ gây vướng nghĩa. “những người mà lời Đức Chúa Trời đã đến với” diễn đạt rõ hướng của πρὸς οὓς ... ἐγένετο, vẫn trang trọng và phù hợp văn mạch Kinh Thánh.
  terminology: Giữ “Đức Chúa Trời”, “các thần” (chữ thường), và “Kinh Thánh” là nhất quán với bản thảo và không áp đặt cách giải thích về đối tượng của Thi Thiên 82:6. “Không thể bị vô hiệu hóa” chuyển tải thích hợp λυθῆναι; các phương án khác được bảo lưu ở chú thích.
