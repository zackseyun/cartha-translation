id: JHN.10.9
reference: John 10:9
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐγώ εἰμι ἡ θύρα· δι’ ἐμοῦ ἐάν τις εἰσέλθῃ σωθήσεται καὶ εἰσελεύσεται καὶ ἐξελεύσεται καὶ νομὴν εὑρήσει.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/009.yaml
  text: I am the door. If anyone enters through me[a], he will be saved, and will go in and go out and find pasture.
translation:
  language: vi
  text: Ta là cửa[a]. Nếu ai qua ta mà vào, người ấy sẽ được cứu; sẽ vào, sẽ ra và tìm được đồng cỏ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “cổng”. Từ Hy Lạp có thể chỉ cửa hoặc cổng; chính văn dùng “cửa” vì đây là nghĩa trực tiếp hơn.
    reason: lexical_alternative
lexical_decisions:
- source_word: θύρα
  choice: cửa
  rationale: θύρα trước hết chỉ cửa hoặc lối vào. “Cửa” là từ tương đương trực tiếp, tự nhiên trong tiếng Việt và giữ nguyên hình ảnh ẩn dụ của lời “Ta là”; “cổng” vẫn có thể phù hợp với bối cảnh chăn chiên nên được ghi ở chú thích.
- source_word: δι’ ἐμοῦ
  choice: qua ta
  rationale: διά với sở hữu cách diễn tả phương tiện hoặc trung gian. “Qua ta” tự nhiên trong tiếng Việt và cho thấy chính Đức Giê-su là con đường để đi vào.
- source_word: ἐάν τις εἰσέλθῃ
  choice: Nếu ai ... mà vào
  rationale: Cấu trúc ἐάν với động từ giả định diễn tả điều kiện tổng quát. “Nếu ai ... mà vào” giữ phạm vi rộng, không xác định của τις và có nhịp văn tự nhiên.
- source_word: σωθήσεται
  choice: sẽ được cứu
  rationale: σῴζω có thể mang nghĩa cứu, giải cứu hoặc giải thoát. “Được cứu” giữ được chiều rộng thần học trong Tin Mừng Giăng mà không giới hạn câu này vào sự an toàn thể chất hay áp đặt một công thức tín lý hẹp hơn.
- source_word: εἰσελεύσεται καὶ ἐξελεύσεται
  choice: sẽ vào, sẽ ra
  rationale: Cách diễn đạt ngắn gọn này bảo toàn cặp chuyển động đối xứng trong tiếng Hy Lạp, đồng thời không giải thích thêm rằng đó nhất thiết là tự do hay an toàn.
- source_word: νομὴν
  choice: đồng cỏ
  rationale: νομή chỉ nơi chăn thả hoặc thức ăn trên đồng cỏ. “Đồng cỏ” rõ nghĩa, tự nhiên và phù hợp với hình ảnh chiên trong văn cảnh.
- source_word: εὑρήσει
  choice: tìm được
  rationale: εὑρίσκω có nghĩa trực tiếp là tìm thấy. “Tìm được” vừa tự nhiên trong tiếng Việt vừa giữ sắc thái đạt tới điều được tìm kiếm.
theological_decisions:
- issue: Cách dịch ẩn dụ θύρα trong bối cảnh chăn chiên
  choice: cửa
  alternative: cổng
  rationale: “Cửa” giữ sát nghĩa cơ bản của từ Hy Lạp và hình thức trực tiếp của lời tuyên bố “Ta là”. “Cổng” có thể làm rõ khung cảnh chuồng chiên nhưng cũng cụ thể hóa hình ảnh hơn nguyên văn; vì vậy được giữ ở chú thích.
- issue: Phạm vi ý nghĩa của σωθήσεται
  choice: sẽ được cứu
  alternative: sẽ được giải cứu; sẽ được giải thoát
  rationale: “Sẽ được cứu” bảo toàn cả sức nặng thần học lẫn hình ảnh được bảo vệ trong văn cảnh chăn chiên, không thu hẹp câu này thành sự an toàn thể chất và cũng không diễn giải vượt quá điều bản văn nói.
- issue: Ý nghĩa của cặp “vào” và “ra”
  choice: giữ nguyên hình ảnh chuyển động, không chú giải trong chính văn
  alternative: diễn giải là được tự do và an toàn
  rationale: Cụm từ có thể gợi sự tự do và an ổn, nhưng nguyên văn chỉ nêu hành động vào và ra. Giữ cách nói cụ thể giúp bảo tồn độ mở của hình ảnh.
translation_notes:
  register: Dùng văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “ta” phù hợp với lời tự xưng trang nghiêm của Đức Giê-su trong truyền thống văn chương Kinh Thánh tiếng Việt; “người ấy” tránh giả định giới tính mà vẫn diễn đạt rõ chủ thể số ít không xác định. Dấu chấm phẩy phân tách lời hứa cứu rỗi với chuỗi hình ảnh vào, ra và tìm được đồng cỏ.
