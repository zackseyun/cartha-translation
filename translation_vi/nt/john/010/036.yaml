id: JHN.10.36
reference: John 10:36
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὃν ὁ πατὴρ ἡγίασεν καὶ ἀπέστειλεν εἰς τὸν κόσμον ὑμεῖς λέγετε ὅτι Βλασφημεῖς, ὅτι εἶπον· Υἱὸς τοῦ θεοῦ εἰμι;
base_translation:
  language: en
  yaml_path: translation/nt/john/010/036.yaml
  text: do you say of the one whom the Father sanctified and sent into the world[a], ‘You are blaspheming,’ because I said, ‘I am the Son of God’?”
translation:
  language: vi
  text: 'thế mà các ông lại nói về Đấng được Cha thánh hóa[a] và sai đến thế gian rằng: ‘Ông nói phạm thượng,’ vì tôi đã nói: ‘Tôi là Con Đức Chúa Trời’ sao?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “thánh hiến” hoặc “biệt riêng”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡγίασεν
  choice: thánh hóa
  rationale: Giữ mối liên hệ trực tiếp với ý niệm thánh và bảo tồn sức nặng thần học của động từ; trong ngữ cảnh này, từ này cũng có thể chỉ việc biệt riêng hoặc hiến thánh cho sứ mạng.
- source_word: ἀπέστειλεν
  choice: sai
  rationale: Cách dịch trực tiếp, tự nhiên và nhất quán với ngôn ngữ về sứ mạng trong Giăng, không thêm ý diễn giải như ‘ủy nhiệm’.
- source_word: εἰς τὸν κόσμον
  choice: đến thế gian
  rationale: ‘Thế gian’ là cách diễn đạt quen thuộc và phù hợp với sắc thái thần học của κόσμος trong Giăng; ‘đến’ diễn đạt tự nhiên hướng chuyển động của εἰς.
- source_word: Βλασφημεῖς
  choice: Ông nói phạm thượng
  rationale: Trong tiếng Việt, ‘nói phạm thượng’ diễn đạt tự nhiên lời cáo buộc trực tiếp ở thì hiện tại mà không làm nặng câu.
- source_word: Υἱὸς τοῦ θεοῦ
  choice: Con Đức Chúa Trời
  rationale: Giữ lực của tước hiệu Kitô học trong ngữ cảnh lời cáo buộc phạm thượng, đồng thời dùng cách gọi trang trọng và quen thuộc trong tiếng Việt.
- source_word: ὃν ὁ πατὴρ
  choice: Đấng được Cha
  rationale: ‘Đấng’ phù hợp với đối tượng là chính Chúa Giê-su và tạo câu tiếng Việt tự nhiên; thể bị động bảo toàn hành động của Cha đối với Đấng ấy.
- source_word: ὅτι ... ὅτι
  choice: nói về ... rằng ... chỉ vì
  rationale: ‘Rằng’ giới thiệu nội dung lời cáo buộc, còn ‘chỉ vì’ làm rõ căn cứ của cáo buộc và truyền đạt sắc thái phản vấn trong ngữ cảnh.
theological_decisions:
- issue: Cách dịch ἡγίασεν khi nói về Con
  choice: thánh hóa
  alternative: hiến thánh; biệt riêng
  rationale: ‘Thánh hóa’ giữ gần hình thức và trường nghĩa của nguyên văn, không tự ý giải quyết sự căng thẳng thần học. Chú thích nêu các nghĩa phù hợp với việc Cha biệt riêng Con cho sứ mạng, nhưng bản văn chính không hàm ý Con từng bất khiết hoặc cần được cải thiện về đạo đức.
- issue: Sức nặng Kitô học của Υἱὸς τοῦ θεοῦ
  choice: Con Đức Chúa Trời
  alternative: Con của Đức Chúa Trời
  rationale: Dạng không có ‘của’ tự nhiên hơn như một tước hiệu trong tiếng Việt và bảo tồn sức nặng của cụm từ trong ngữ cảnh, nhưng không đưa thêm công thức tín lý ngoài bản văn.
- issue: Dạng câu hỏi phản vấn
  choice: thế mà ... sao?
  alternative: các ông lại nói ... sao?
  rationale: Nguyên văn là phần tiếp nối của lập luận và mang lực phản vấn. ‘Thế mà’ cùng tiểu từ ‘sao’ tái hiện quan hệ ấy trong tiếng Việt mà không thay đổi nội dung lập luận.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. ‘Các ông’ phù hợp với lời Chúa Giê-su trực tiếp nói với những người đối thoại; ‘Cha’ giữ cách gọi đặc trưng trong ngữ cảnh. Dấu ngoặc kép và câu hỏi cuối câu làm rõ cấu trúc lời trích dẫn lồng trong câu hỏi phản vấn.
