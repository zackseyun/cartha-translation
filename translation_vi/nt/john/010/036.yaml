    issue: “Chỉ vì” trong mệnh đề nguyên nhân
    rationale: ὅτι thứ hai giải thích căn cứ của lời cáo buộc (“vì/bởi vì tôi đã nói”), nhưng không tự nó biểu thị ý “chỉ” hay loại trừ các căn cứ khác. Nên bỏ “chỉ” để không thêm sắc thái.
  - severity: low
    issue: Cách nêu lựa chọn từ vựng trong chú thích
    rationale: “Thánh hiến” là cách nói hiện đại, quen thuộc và chính xác hơn “hiến thánh” để diễn đạt nghĩa “consecrated” của ἡγίασεν trong ngữ cảnh này.
