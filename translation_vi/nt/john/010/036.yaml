  to: 'thế mà các ông lại nói về Đấng được Cha thánh hóa[a] và sai đến thế gian rằng: ‘Ông nói phạm thượng,’ vì tôi đã nói: ‘Tôi là Con Đức Chúa Trời’ sao?'
  rationale: Bản sửa chỉ loại bỏ từ “chỉ,” vốn thêm sắc thái không có trong nguyên văn, và điều chỉnh cách diễn đạt một phương án chú thích. Các yếu tố chính của bản dịch—cấu trúc phản vấn, “thánh hóa,” sứ mạng được sai đến thế gian, và tước hiệu “Con Đức Chúa Trời”—được giữ nguyên.
  reviewer_model: gpt-5.6-terra
