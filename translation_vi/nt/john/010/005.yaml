source:
  edition: SBLGNT
  text: ἀλλοτρίῳ δὲ οὐ μὴ ⸀ἀκολουθήσουσιν ἀλλὰ φεύξονται ἀπ’ αὐτοῦ, ὅτι οὐκ οἴδασι τῶν ἀλλοτρίων τὴν φωνήν.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/005.yaml
  text: But they will certainly not follow a stranger[a]; instead, they will flee from him[b], because they do not know the voice of strangers.
translation:
  language: vi
  text: Nhưng chúng nhất định không đi theo người lạ[a]; trái lại, chúng sẽ chạy trốn người ấy, vì chúng không nhận ra giọng của những người lạ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “chúng sẽ không bao giờ đi theo người lạ.” Tiếng Hy Lạp dùng lối phủ định nhấn mạnh (οὐ μή).'
    reason: lexical_alternative
  - marker: b
    text: “Nhận ra giọng” cũng có thể dịch là “biết giọng.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλοτρίῳ
  choice: người lạ
  rationale: Trong ẩn dụ về người chăn và đàn chiên, từ này chỉ người không thuộc về hoặc không quen biết với đàn chiên; “người lạ” tự nhiên và không hàm ý khác biệt sắc tộc.
- source_word: οὐ μὴ ἀκολουθήσουσιν
  choice: nhất định không đi theo
  rationale: οὐ μή đi với thì tương lai tạo lời phủ định nhấn mạnh; cách dịch này giữ được sức nhấn trong tiếng Việt hiện đại.
- source_word: ἀκολουθήσουσιν
  choice: đi theo
  rationale: Phù hợp tự nhiên với hành động của chiên theo người chăn, đồng thời giữ nguyên hình ảnh ẩn dụ.
- source_word: φεύξονται ἀπ’ αὐτοῦ
  choice: sẽ chạy trốn người ấy
  rationale: Diễn đạt rõ hành động tránh xa người lạ; “chạy trốn” tự nhiên hơn “trốn khỏi” trong ngữ cảnh này.
- source_word: οἴδασι
  choice: nhận ra
  rationale: Với đối tượng là tiếng nói, οἶδα trong ngữ cảnh này có thể chỉ sự nhận biết hay nhận ra; “nhận ra” thể hiện tự nhiên khả năng phân biệt tiếng quen với tiếng lạ.
- source_word: τῶν ἀλλοτρίων
  choice: của những người lạ
  rationale: Giữ số nhiều của nguyên văn và chỉ chung lớp người không quen thuộc với đàn chiên.
- source_word: φωνήν
  choice: tiếng
  rationale: “Tiếng” là cách nói tự nhiên trong tiếng Việt khi chiên nghe và nhận ra tiếng gọi, đồng thời vẫn giữ chiều kích nhận diện của φωνή.
- source_word: δὲ ... ἀλλὰ
  choice: Nhưng ... trái lại
  rationale: 'Giữ cấu trúc tương phản: chúng không làm điều thứ nhất mà làm điều ngược lại.'
theological_decisions:
- issue: Ý nghĩa ẩn dụ của hình ảnh chiên và người chăn
  choice: Giữ nguyên ẩn dụ, không xác định “người lạ” là một nhóm thần học cụ thể.
  alternative: Giải thích trực tiếp “người lạ” là giáo sư giả hoặc người lãnh đạo bất hợp pháp.
  rationale: Câu này không tự xác định đối tượng được ẩn dụ nói đến; diễn giải ngay trong bản văn sẽ vượt quá điều tiếng Hy Lạp nêu rõ.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “chúng” theo mạch nói về đàn chiên; “người ấy” tránh sắc thái xa cách quá mạnh của “hắn”. Cấu trúc câu giữ rõ sự đối lập của nguyên văn.
