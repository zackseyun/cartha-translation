  source_fidelity: 'Bản dịch truyền đạt đầy đủ ba mệnh đề hiện tại trong tiếng Hy Lạp: chiên nghe tiếng, người nói biết chúng, và chúng theo người nói. “Chiên của tôi” phản ánh tự nhiên τὰ πρόβατα τὰ ἐμά; “nghe tiếng tôi,” “tôi biết chúng,” và “chúng theo tôi” đều giữ đúng quan hệ cú pháp và ý nghĩa của nguyên văn. Dấu chấm phẩy thay cho liên từ rõ hiện không làm mất quan hệ liên kết trong tiếng Việt.'
