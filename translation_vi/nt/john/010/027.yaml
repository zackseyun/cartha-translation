id: JHN.10.27
reference: John 10:27
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τὰ πρόβατα τὰ ἐμὰ τῆς φωνῆς μου ⸀ἀκούουσιν, κἀγὼ γινώσκω αὐτά, καὶ ἀκολουθοῦσίν μοι,
base_translation:
  language: en
  yaml_path: translation/nt/john/010/027.yaml
  text: My sheep hear my voice, and I know them, and they follow me.
translation:
  language: vi
  text: Chiên của tôi nghe tiếng tôi; tôi biết chúng, và chúng theo tôi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὰ πρόβατα τὰ ἐμὰ
  choice: Chiên của tôi
  rationale: Giữ hình ảnh người chăn và chiên, đồng thời diễn đạt quyền sở hữu được nhấn nhẹ bởi cấu trúc có mạo từ và tính từ sở hữu. Cách nói này tự nhiên, trang trọng trong tiếng Việt hiện đại.
- source_word: τῆς φωνῆς μου ἀκούουσιν
  choice: nghe tiếng tôi
  rationale: φωνή trong ngữ cảnh nhận biết người chăn là “tiếng”; ἀκούουσιν ở thì hiện tại diễn tả hành động mang tính thường xuyên, đặc trưng. “Nghe” giữ nghĩa trực tiếp mà không thêm sắc thái chủ ý mạnh như “lắng nghe”.
- source_word: κἀγὼ γινώσκω αὐτά
  choice: tôi biết chúng
  rationale: κἀγώ nối ý bằng “và/tôi”, nhưng trong tiếng Việt dấu chấm phẩy đã thể hiện liên kết rõ ràng; γινώσκω được dịch là “biết” để giữ nguyên chiều sâu quan hệ mà không diễn giải quá mức thành “biết rõ” hay “nhận ra”.
- source_word: ἀκολουθοῦσίν μοι
  choice: chúng theo tôi
  rationale: Thì hiện tại diễn tả hành động thường xuyên, đặc trưng; “theo tôi” vừa tự nhiên vừa giữ được nghĩa môn đồ trong ngữ cảnh mà không cần thêm lời giải thích.
theological_decisions:
- issue: Sắc thái quan hệ của γινώσκω trong hình ảnh người chăn và chiên
  choice: Dịch là “biết” mà không mở rộng
  alternative: “biết rõ”, “thấu biết”, hoặc “nhận ra”
  rationale: '“Biết” bảo toàn độ rộng và chiều sâu thần học của động từ Hy Lạp: có thể bao hàm sự nhận biết mang tính quan hệ, nhưng câu không tự buộc phải diễn giải chi tiết hơn.'
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “chiên” thay vì “cừu” vì đây là cách gọi tự nhiên, quen thuộc trong ngôn ngữ Kinh Thánh tiếng Việt và vẫn rõ nghĩa đối với độc giả phổ thông. Dấu chấm phẩy giúp thể hiện ba mệnh đề liên kết chặt chẽ mà không làm câu nặng nề.
