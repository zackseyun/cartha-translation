revisions:
- from: 'Người Do Thái trả lời Ngài: “Chúng tôi ném đá ông không phải vì một việc tốt, nhưng vì lời phạm thượng, bởi vì ông vốn là người mà lại tự cho mình là Đức Chúa Trời.[a]”'
  to: 'Người Do Thái trả lời Ngài: “Chúng tôi không ném đá ông vì một việc tốt, nhưng vì tội phạm thượng, và vì ông là người mà lại tự cho mình là Đức Chúa Trời.[a]”'
  rationale: Bản sửa giữ nguyên nghĩa và mức độ nhập nhằng của nguyên văn, đồng thời cải thiện cú pháp tiếng Việt, tránh thêm sắc thái trong «vốn», và làm rõ phần văn bản mà chú thích thay thế áp dụng. Không thay đổi cách quy chiếu mở của «Người Do Thái» hay lựa chọn thần học có chú thích về θεόν.
  reviewer_model: gpt-5.6-terra
