source:
  edition: SBLGNT
  text: ἀπεκρίθησαν αὐτῷ οἱ ⸀Ἰουδαῖοι· Περὶ καλοῦ ἔργου οὐ λιθάζομέν σε ἀλλὰ περὶ βλασφημίας, καὶ ὅτι σὺ ἄνθρωπος ὢν ποιεῖς σεαυτὸν θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/033.yaml
  text: The Jews answered him[a], “We are not stoning you for a good work, but for blasphemy, and because you, being a man, make yourself God.”
translation:
  language: vi
  text: 'Người Do Thái trả lời Ngài: “Chúng tôi không ném đá ông vì một việc tốt, nhưng vì tội phạm thượng, và vì ông là người mà lại tự cho mình là Đức Chúa Trời.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “tự cho mình là một vị thần.” Từ Hy Lạp θεόν không có mạo từ; tuy nhiên, trong ngữ cảnh lời cáo buộc phạm thượng ở đây, nghĩa có khả năng nhất là “Đức Chúa Trời.”'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἰουδαῖοι
  choice: Người Do Thái
  rationale: Cách dịch trực tiếp, giữ nguyên phạm vi quy chiếu có phần linh hoạt trong văn phong Giăng; ngữ cảnh cho thấy đây là nhóm đang chống đối Đức Chúa Jêsus tại đền thờ, nhưng bản văn không gọi họ cụ thể là các nhà lãnh đạo.
- source_word: Περὶ καλοῦ ἔργου
  choice: vì một việc tốt
  rationale: Diễn đạt tự nhiên quan hệ nguyên nhân của περί với sở hữu cách, đồng thời giữ số ít của ἔργου và phẩm chất tích cực của καλοῦ.
- source_word: λιθάζομέν
  choice: ném đá
  rationale: Thì hiện tại trong lời đối đáp trực tiếp mô tả hành động hoặc ý định đang diễn ra; tiếng Việt không cần thêm dấu hiệu thể bắt buộc vì ngữ cảnh đã làm rõ.
- source_word: βλασφημίας
  choice: lời phạm thượng
  rationale: Trong ngữ cảnh cáo buộc liên quan đến Đức Chúa Trời, cụm này tự nhiên và rõ nghĩa hơn danh từ trừu tượng đơn lẻ, nhưng vẫn giữ nội dung của βλασφημία.
- source_word: ἄνθρωπος ὢν
  choice: ông vốn là người
  rationale: Giữ sự tương phản mà những người tố cáo nêu ra giữa thân phận con người của Đức Chúa Jêsus và điều họ cho là Ngài tự nhận; “vốn là” truyền đạt sắc thái hoàn cảnh/nhượng bộ mà không thêm chữ “chỉ” vốn không có trong nguyên văn.
- source_word: ποιεῖς σεαυτὸν θεόν
  choice: tự cho mình là Đức Chúa Trời
  rationale: Cấu trúc ποιέω với đại từ phản thân và bổ ngữ vị ngữ mang nghĩa tự đặt hoặc tự trình bày mình là ai. “Tự cho mình là” là tiếng Việt tự nhiên trong lời cáo buộc. Ngữ cảnh về tội phạm thượng nghiêng về “Đức Chúa Trời”, trong khi khả năng “một vị thần” được bảo lưu ở chú thích.
theological_decisions:
- issue: Cách dịch θεόν không có mạo từ trong lời cáo buộc
  choice: Đức Chúa Trời
  alternative: một vị thần
  rationale: Việc thiếu mạo từ cho phép cân nhắc cách hiểu định tính hoặc bất định, nhưng trong bối cảnh độc thần của sách Giăng và lời cáo buộc phạm thượng, những người đối thoại dường như hiểu Đức Chúa Jêsus đang tự nhận địa vị thuộc về Đức Chúa Trời. Chú thích giữ lại khả năng ngữ pháp khác thay vì xóa bỏ sự nhập nhằng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” trong lời trần thuật và “ông” trong lời của nhóm chống đối để phản ánh thái độ đối thoại, không áp đặt sự tôn kính lên lời cáo buộc. Dùng “Đức Chúa Trời” theo cách gọi Tin Lành Việt ngữ quen thuộc, còn phương án “một vị thần” được ghi rõ trong chú thích.
