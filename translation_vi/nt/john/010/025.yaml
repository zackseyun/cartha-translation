id: JHN.10.25
reference: John 10:25
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀπεκρίθη αὐτοῖς ὁ Ἰησοῦς· Εἶπον ὑμῖν καὶ οὐ πιστεύετε· τὰ ἔργα ἃ ἐγὼ ποιῶ ἐν τῷ ὀνόματι τοῦ πατρός μου ταῦτα μαρτυρεῖ περὶ ἐμοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/john/010/025.yaml
  text: Jesus answered them[a], “I told you, and you do not believe[b]. The works that I do in the name of my Father—these testify about me.”
translation:
  language: vi
  text: 'Đức Giê-su đáp lời họ: “Tôi đã nói với các ông, nhưng các ông không tin. Những việc tôi làm nhân danh Cha tôi[a]—chính những việc ấy làm chứng về tôi[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “bởi thẩm quyền của Cha tôi.”
    reason: Nêu rõ sắc thái thẩm quyền có thể có trong thành ngữ ἐν τῷ ὀνόματι.
  - marker: b
    text: Hay “làm chứng liên quan đến tôi.”
    reason: Ghi nhận cách diễn đạt sát hơn đối với περὶ ἐμοῦ, dù bản chính tự nhiên hơn trong tiếng Việt.
lexical_decisions:
- source_word: ἀπεκρίθη αὐτοῖς
  choice: đáp lời họ
  rationale: Diễn đạt tự nhiên hành động trả lời trong đối thoại, đồng thời giữ đại từ số nhiều của nguyên văn.
- source_word: Εἶπον ὑμῖν
  choice: Tôi đã nói với các ông
  rationale: Thì aorist chỉ lời Đức Giê-su đã nói trước đó; cách dịch này tự nhiên và không bổ sung nội dung không có trong câu.
- source_word: οὐ πιστεύετε
  choice: các ông không tin
  rationale: Giữ cách dịch nhất quán của πιστεύω trong Tin Mừng Giăng và không thu hẹp đối tượng của niềm tin thành một mệnh đề cụ thể.
- source_word: τὰ ἔργα
  choice: những việc
  rationale: Trong tiếng Việt hiện đại, “những việc” tự nhiên hơn “các công việc” khi nói đến những hành động của Đức Giê-su, đồng thời vẫn duy trì mối liên hệ với chủ đề các việc Ngài làm trong sách Giăng.
- source_word: ἐν τῷ ὀνόματι τοῦ πατρός μου
  choice: nhân danh Cha tôi
  rationale: “Nhân danh” giữ hình ảnh và phạm vi nghĩa của thành ngữ Hy Lạp, bao gồm sự đại diện và thẩm quyền, mà không giải thích quá mức.
- source_word: ταῦτα μαρτυρεῖ περὶ ἐμοῦ
  choice: chính những việc ấy làm chứng về tôi
  rationale: Từ “chính” thể hiện sự nhấn mạnh của đại từ ταῦτα; “làm chứng về” giữ sắc thái chứng nhân quan trọng trong Tin Mừng Giăng.
theological_decisions:
- issue: Mối liên hệ giữa những việc Đức Giê-su làm với danh và thẩm quyền của Cha
  choice: nhân danh Cha tôi
  alternative: bởi thẩm quyền của Cha tôi
  rationale: Bản dịch chính giữ nguyên thành ngữ của nguồn Hy Lạp, qua đó bảo tồn cả ý đại diện lẫn ý được trao thẩm quyền mà không giới hạn câu vào chỉ một cách hiểu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Đức Giê-su” là cách gọi tôn kính nhưng không thêm tước hiệu không có trong nguyên văn. “Các ông” phù hợp với nhóm người trưởng thành đang trực tiếp chất vấn Đức Giê-su trong ngữ cảnh. Dấu gạch ngang làm nổi bật đại từ ταῦτα được đưa lên trước để nhấn mạnh.
