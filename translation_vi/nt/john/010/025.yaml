  source_fidelity: 'Bản dịch truyền đạt đầy đủ các thành phần của câu Hy Lạp: hành động trả lời, lời Đức Giê-su đã nói trước đó, sự không tin, các việc Ngài làm nhân danh Cha Ngài, và chức năng làm chứng của các việc ấy. “Nhưng” diễn đạt hợp lý quan hệ tương phản được ngữ cảnh hàm ý giữa việc đã nói và việc họ không tin, dù nguyên văn dùng καὶ.'
