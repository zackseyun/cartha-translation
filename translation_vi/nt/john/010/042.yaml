  text: καὶ ⸂πολλοὶ ἐπίστευσαν εἰς αὐτὸν ἐκεῖ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/042.yaml
  text: And many believed in him there.
translation:
  language: vi
  text: Và tại đó, nhiều người đã tin vào Ngài.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: Và
  rationale: Giữ liên kết phối hợp trực tiếp với mạch tường thuật trước đó mà không thêm sắc thái kết quả hay thời gian.
- source_word: πολλοὶ
  choice: nhiều người
  rationale: Tính từ số nhiều được dùng như danh từ, chỉ nhiều người; tiếng Việt cần nêu rõ danh từ để câu tự nhiên.
- source_word: ἐπίστευσαν
  choice: đã tin
  rationale: Diễn đạt trực tiếp động từ aorist πιστεύω như một hành động xảy ra trong mạch kể; “đã” phù hợp với văn kể tiếng Việt nhưng không áp đặt sắc thái khởi đầu như “bắt đầu tin”.
- source_word: εἰς αὐτόν
  choice: tin Ngài
  rationale: Trong tiếng Việt, động từ “tin” có thể nhận trực tiếp đối tượng là một người và diễn đạt lòng tin hướng về người ấy; cách này tự nhiên hơn “tin vào Ngài” trong văn cảnh này mà vẫn giữ sức nặng thần học của cấu trúc πιστεύω εἰς.
- source_word: ἐκεῖ
  choice: tại đó
  rationale: Giữ rõ sự nhấn mạnh về địa điểm; đặt gần đầu câu tạo diễn đạt tiếng Việt tự nhiên và không làm thay đổi nghĩa.
theological_decisions:
- issue: Cách dịch πιστεύω εἰς αὐτόν trong văn cảnh đức tin hướng về Chúa Giê-su
  choice: tin Ngài
  alternative: tin vào Ngài
  rationale: “Tin Ngài” trong tiếng Việt tự nhiên và có thể bao hàm sự tín thác nơi một người, chứ không chỉ tin lời người ấy. “Tin vào Ngài” cũng khả dĩ và bám sát hình thức giới từ hơn, nhưng hơi kém tự nhiên; bản dịch không mở rộng thành “đặt đức tin nơi Ngài” để tránh diễn giải quá mức.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” để quy chiếu Chúa Giê-su theo lối xưng hô kính trọng quen thuộc; câu ngắn gọn, giữ nguyên liên kết và trọng tâm địa điểm của nguyên văn.
