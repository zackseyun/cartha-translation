review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch truyền đạt đúng trình tự và quan hệ của câu Hy Lạp: sau khi người chăn đưa các con của mình ra, người đi trước; chiên theo sau vì biết tiếng người. Tuy nhiên, “những con thuộc về mình” tuy bám sát τὰ ἴδια nhưng không tự nhiên trong tiếng Việt và làm mơ hồ đối tượng là chiên. Trong ngữ cảnh trực tiếp này, “tất cả chiên của mình” diễn đạt trung thành ý quy chiếu của thành ngữ ấy.'
  naturalness: Cần thay các cách nói lặp và hơi gượng như “người đi trước chúng” / “tiếng người” bằng “người ấy đi trước chúng” / “tiếng của người ấy”. “Tiếng người” trong tiếng Việt có thể được hiểu là tiếng nói của loài người, thay vì giọng nói của chính người chăn.
  terminology: Dùng “chiên” và “bầy chiên” giữ đúng hình ảnh mục tử của πρόβατα, đồng thời tránh áp đặt cách viết hoa hay diễn giải thần học. “Đưa ... ra” vẫn là lựa chọn cân bằng, phù hợp ἐκβάλῃ trong bối cảnh chăn chiên; chú thích nêu các khả năng “lùa ra” và “dẫn ra”.
  issues:
  - severity: medium
    issue: Cụm “tất cả những con thuộc về mình” không tự nhiên và không xác định rõ đối tượng.
    rationale: τὰ ἴδια là cách nói trung tính “những gì/con gì thuộc về mình”, nhưng trong ngữ cảnh πρόβατα nó chỉ chiên của người chăn. Tiếng Việt cần nêu “chiên” để câu rõ nghĩa và tự nhiên.
  - severity: low
    issue: “tiếng người” có thể mơ hồ trong tiếng Việt.
    rationale: Cụm này có thể chỉ tiếng nói của con người nói chung. “Tiếng của người ấy” xác định đúng τὴν φωνὴν αὐτοῦ mà không thêm nghĩa.
  revised_text: Khi đã đưa tất cả chiên của mình ra[a], người ấy đi trước chúng, và bầy chiên theo người ấy, vì chúng biết tiếng của người ấy.
