base_translation:
  language: en
  yaml_path: translation/nt/john/010/004.yaml
  text: When he has brought out all his own[a], he goes before them, and the sheep follow him, because they know his voice.
translation:
  language: vi
  text: Khi đã đưa tất cả chiên của mình ra[a], người ấy đi trước chúng, và bầy chiên theo người ấy, vì chúng biết tiếng của người ấy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đã lùa ra” hoặc “đã dẫn ra”; động từ Hy Lạp có thể mang nghĩa lùa hay đưa ra khỏi nơi quây nhốt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν
  choice: Khi
  rationale: Diễn đạt tự nhiên mệnh đề thời gian bất định đi với lối liên subjunctive; trong ngữ cảnh mang tính khái quát, “khi” không nhấn quá mức ý lặp lại.
- source_word: τὰ ἴδια πάντα
  choice: tất cả những con thuộc về mình
  rationale: Giữ ý sở hữu của thành ngữ trung tính số nhiều, đồng thời dùng “những con” để câu tiếng Việt tự nhiên trong ngữ cảnh đàn chiên mà chưa lặp từ “chiên” quá sớm.
- source_word: ἐκβάλῃ
  choice: đã đưa ... ra
  rationale: Giữ rõ chuyển động từ bên trong ra ngoài; “đưa ra” phù hợp cảnh chăn chiên và tránh tự ý áp đặt sắc thái xua đuổi mạnh, còn thể hoàn thành “đã” thể hiện hành động xảy ra trước việc người chăn đi trước.
- source_word: ἔμπροσθεν αὐτῶν πορεύεται
  choice: người đi trước chúng
  rationale: Diễn đạt trực tiếp vị trí và chuyển động của người chăn dẫn đầu đàn.
- source_word: τὰ πρόβατα αὐτῷ ἀκολουθεῖ
  choice: đàn chiên theo người
  rationale: “Đàn chiên” tự nhiên trong tiếng Việt; “theo người” chuyển đúng cấu trúc ἀκολουθέω với tân ngữ cách cho.
- source_word: ὅτι οἴδασιν τὴν φωνὴν αὐτοῦ
  choice: vì chúng biết tiếng người
  rationale: “Vì” nêu nguyên nhân; “biết tiếng” giữ nghĩa cơ bản của οἶδα và trong tiếng Việt tự nhiên bao hàm khả năng nhận ra giọng gọi.
theological_decisions:
- issue: Hình ảnh chăn chiên và sắc thái của ἐκβάλῃ
  choice: đã đưa ... ra
  alternative: đã lùa ... ra; đã dẫn ... ra
  rationale: Ngữ cảnh nói người chăn đưa những con thuộc về mình ra khỏi chuồng. “Đưa ra” bảo toàn hướng chuyển động nhưng không gán sắc thái cưỡng ép hoặc dịu dàng vượt quá điều động từ tự nó có thể biểu đạt; các sắc thái khác được ghi ở chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “người” để chỉ người chăn trong hình ảnh ẩn dụ, tránh viết hoa hoặc thêm danh xưng thần học không có trong câu Hy Lạp.
