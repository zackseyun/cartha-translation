revisions:
- from: Khi đã đưa tất cả những con thuộc về mình ra[a], người đi trước chúng, và đàn chiên theo người, vì chúng biết tiếng người.
  to: Khi đã đưa tất cả chiên của mình ra[a], người ấy đi trước chúng, và bầy chiên theo người ấy, vì chúng biết tiếng của người ấy.
  rationale: Bản sửa thay cách diễn đạt không tự nhiên “những con thuộc về mình” bằng “chiên của mình”, là đối tượng được ngữ cảnh xác định; đồng thời làm rõ các đại từ sở hữu trong tiếng Việt. Không thay đổi trình tự, sắc thái thời gian, hình ảnh chăn chiên, hay mức độ mơ hồ thần học của nguyên văn.
