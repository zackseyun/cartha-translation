id: JHN.10.10
reference: John 10:10
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ κλέπτης οὐκ ἔρχεται εἰ μὴ ἵνα κλέψῃ καὶ θύσῃ καὶ ἀπολέσῃ· ἐγὼ ἦλθον ἵνα ζωὴν ἔχωσιν καὶ περισσὸν ἔχωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/010.yaml
  text: The thief comes only to steal and slaughter and destroy[a]; I came so that they may have life[b], and have it abundantly.
translation:
  language: vi
  text: Kẻ trộm chỉ đến để trộm cắp, giết mổ[a] và hủy diệt; còn tôi đã đến để họ có sự sống, và có sự sống dồi dào[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “giết”. Động từ Hy Lạp thường chỉ việc giết mổ, phù hợp với hình ảnh đàn chiên trong ngữ cảnh.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “có sự sống cách sung mãn” hoặc “có sự sống đến mức trọn vẹn”.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ κλέπτης
  choice: Kẻ trộm
  rationale: Mạo từ cùng danh từ số ít mang ý nghĩa xác định hoặc đại diện trong diễn từ về người chăn và đàn chiên; cách dịch này tự nhiên trong tiếng Việt.
- source_word: οὐκ ἔρχεται εἰ μὴ
  choice: chỉ đến để
  rationale: 'Diễn đạt tự nhiên ý nghĩa loại trừ: mục đích đến của kẻ trộm không ngoài những hành động được kể tiếp.'
- source_word: ἵνα κλέψῃ
  choice: để trộm cắp
  rationale: Giữ rõ quan hệ mục đích của mệnh đề ἵνα và dùng cách nói thông dụng trong tiếng Việt.
- source_word: θύσῃ
  choice: giết thịt
  rationale: Động từ θύω thường chỉ việc giết mổ động vật; “giết thịt” phù hợp với hình ảnh đàn chiên và cụ thể hơn từ “giết” nói chung.
- source_word: ἀπολέσῃ
  choice: hủy diệt
  rationale: Truyền đạt mức độ tàn phá toàn diện trong chuỗi ba động từ mà không xác định thêm đối tượng hay phương thức.
- source_word: ἐγὼ ἦλθον
  choice: còn tôi đã đến
  rationale: “Đã đến” phản ánh thì aorist; “còn” làm nổi bật sự tương phản giữa sứ mạng của Đức Giê-su và mục đích của kẻ trộm.
- source_word: ἵνα ζωὴν ἔχωσιν
  choice: để họ được sự sống
  rationale: Giữ mệnh đề chỉ mục đích và thuật ngữ trọng yếu ζωὴ là “sự sống”, không tự ý thu hẹp thành “sự sống đời đời”.
- source_word: περισσὸν ἔχωσιν
  choice: được sự sống ấy cách dư dật
  rationale: Làm rõ περισσόν mô tả mức độ họ có sự sống; đại từ “ấy” nối trực tiếp với “sự sống” vừa nêu và tránh hàm ý thịnh vượng vật chất.
theological_decisions:
- issue: Phạm vi ý nghĩa của ζωὴ trong văn liệu Giăng
  choice: sự sống
  alternative: sự sống đời đời; sự sống đích thực
  rationale: Nguyên văn không có tính từ “đời đời”. Giữ “sự sống” bảo toàn chiều sâu thần học và độ mở của từ ngữ mà không đưa phần diễn giải vào bản văn.
- issue: Sắc thái của περισσὸν
  choice: cách dư dật
  alternative: cách sung mãn; đến mức trọn vẹn; sự sống dư dật
  rationale: Cách dịch diễn tả sự phong phú, đầy tràn của sự sống Đức Giê-su ban nhưng không biến câu này thành lời hứa về sung túc vật chất.
- issue: Đối tượng ngầm của các động từ κλέψῃ, θύσῃ và ἀπολέσῃ
  choice: không thêm tân ngữ trong bản dịch
  alternative: trộm chiên, giết chiên và hủy diệt chiên; trộm cắp, giết người và hủy diệt
  rationale: Tiếng Hy Lạp không nêu tân ngữ. Không bổ sung đối tượng giúp duy trì hình ảnh đàn chiên theo ngữ cảnh mà không đóng khung phép ẩn dụ.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Nhịp ba động từ được giữ rõ; “giết thịt” cố ý bảo toàn hình ảnh chiên bị giết mổ. Các dấu chú thích [a], [b] đều xuất hiện trong chính văn.
