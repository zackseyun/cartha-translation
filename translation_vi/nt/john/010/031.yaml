  text: Ἐβάστασαν ⸀οὖν πάλιν λίθους οἱ Ἰουδαῖοι ἵνα λιθάσωσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/031.yaml
  text: So the Jews picked up stones again to stone him[a].
translation:
  language: vi
  text: Vì vậy, người Do Thái lại nhặt đá để ném đá Ngài[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Trong văn cảnh, cũng có thể hiểu là “các nhà lãnh đạo Do Thái” hoặc “người Giu-đê”. Trong sách Giăng, cụm từ “người Do Thái” thường chỉ những người Do Thái cụ thể chống đối Chúa Giê-su, chứ không nhất thiết chỉ toàn thể dân Do Thái.
    reason: Giữ cách diễn đạt của nguyên bản đồng thời tránh hiểu phạm vi rộng hơn điều văn cảnh cho phép.
lexical_decisions:
- source_word: Ἐβάστασαν
  choice: nhặt
  rationale: Trong ngữ cảnh hostile với λίθους, động từ chỉ việc cầm/lấy đá lên để sử dụng ngay; “nhặt đá” là cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: οὖν
  choice: Vì vậy
  rationale: Giữ quan hệ suy luận với lời tuyên bố ngay trước đó, đồng thời phù hợp với văn phong kể chuyện trang trọng.
- source_word: πάλιν
  choice: lại
  rationale: Diễn đạt trực tiếp ý lặp lại và gợi lại phản ứng thù nghịch trước đó.
- source_word: λίθους
  choice: đá
  rationale: Tương ứng trực tiếp với λίθος, không đưa thêm ý hành quyết vào danh từ.
- source_word: οἱ Ἰουδαῖοι
  choice: người Do Thái
  rationale: Giữ cách gọi minh nhiên của bản Hy Lạp; chú thích nêu rõ rằng trong văn cảnh Giăng, cụm từ có thể chỉ một nhóm đối thủ cụ thể chứ không nhất thiết toàn thể dân Do Thái.
- source_word: ἵνα
  choice: để
  rationale: Diễn đạt mục đích của hành động nhặt đá một cách tự nhiên và sát cấu trúc Hy Lạp.
- source_word: λιθάσωσιν
  choice: ném đá
  rationale: Động từ λιθάζω có nghĩa là dùng đá ném vào một người, thường với ý hành quyết; “ném đá” giữ đúng hành động mà không diễn giải thêm thành “giết bằng cách ném đá”.
- source_word: αὐτόν
  choice: Ngài
  rationale: Đại từ làm tân ngữ chỉ Chúa Giê-su; “Ngài” là cách xưng hô trang trọng, tự nhiên trong văn bản Kinh Thánh tiếng Việt.
theological_decisions:
- issue: Phạm vi chỉ định của οἱ Ἰουδαῖοι trong Phúc Âm Giăng
  choice: Dịch là “người Do Thái” trong chính văn và nêu cách hiểu hẹp hơn ở chú thích.
  alternative: các nhà lãnh đạo Do Thái; người Giu-đê
  rationale: Bản Hy Lạp dùng cụm từ “người Do Thái” mà không minh nhiên giới hạn đối tượng. Tuy nhiên, cách dùng của Giăng thường tùy văn cảnh mà chỉ những người Do Thái cụ thể chống đối Chúa Giê-su; chú thích giúp tránh việc quy kết cho toàn thể dân tộc mà không thu hẹp chính văn quá mức.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. “Nhặt đá để ném” tránh lối diễn đạt dễ gây lặp “lấy đá để ném đá”, còn “Ngài” duy trì cách xưng hô tôn kính quen thuộc trong văn phong Kinh Thánh.
