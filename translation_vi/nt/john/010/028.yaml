id: JHN.10.28
reference: John 10:28
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: κἀγὼ ⸂δίδωμι αὐτοῖς ζωὴν αἰώνιον⸃, καὶ οὐ μὴ ἀπόλωνται εἰς τὸν αἰῶνα, καὶ οὐχ ἁρπάσει τις αὐτὰ ἐκ τῆς χειρός μου.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/028.yaml
  text: And I give them eternal life, and they will certainly never perish forever, and no one will snatch them out of my hand.
translation:
  language: vi
  text: Ta ban cho chúng sự sống đời đời; chúng chắc chắn sẽ không bao giờ bị diệt vong, và không ai giật chúng khỏi tay Ta.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κἀγώ
  choice: Ta
  rationale: Đại từ ngôi thứ nhất đặt ở đầu câu giữ nét nhấn mạnh vào chính Đức Giê-su; “Ta” phù hợp với lời phán trang trọng trong văn cảnh.
- source_word: δίδωμι αὐτοῖς ζωὴν αἰώνιον
  choice: ban cho chúng sự sống đời đời
  rationale: “Ban” diễn đạt tự nhiên hành động trao tặng; “sự sống đời đời” là cách diễn đạt rõ ràng và quen thuộc cho ζωὴ αἰώνιος.
- source_word: οὐ μὴ ἀπόλωνται εἰς τὸν αἰῶνα
  choice: chắc chắn sẽ không bao giờ bị diệt vong
  rationale: Kết hợp οὐ μή với εἰς τὸν αἰῶνα tạo lời phủ định đặc biệt mạnh. “Chắc chắn sẽ không bao giờ” chuyển tải cả sức nhấn mạnh lẫn phạm vi thời gian mà không dùng cụm tiếng Việt dư thừa như “không bao giờ... đời đời”.
- source_word: οὐχ ἁρπάσει τις αὐτὰ ἐκ τῆς χειρός μου
  choice: không ai giật chúng khỏi tay Ta
  rationale: “Giật... khỏi” giữ sắc thái dùng sức chiếm lấy của ἁρπάζω và hình ảnh “tay Ta” của nguyên văn.
theological_decisions:
- issue: Mức độ chắc chắn trong lời phủ định về sự diệt vong
  choice: chắc chắn sẽ không bao giờ bị diệt vong
  alternative: sẽ chẳng bao giờ bị diệt vong
  rationale: Bản dịch thể hiện rõ cấu trúc phủ định mạnh οὐ μή cùng thành ngữ εἰς τὸν αἰῶνα, nhưng không thêm lời giải thích về các hệ thống thần học liên quan đến sự bảo toàn hay kiên trì.
- issue: Đối tượng được bảo vệ
  choice: không ai giật chúng khỏi tay Ta
  alternative: không ai có thể giật chúng khỏi tay Ta
  rationale: Không thêm “có thể”, vì nguyên văn trực tiếp nói rằng không ai sẽ giật chúng đi; cách dịch giữ nguyên hình thức khẳng định mà không mở rộng sang một phát biểu riêng về năng lực.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ta/chúng” nhất quán với lời Đức Giê-su nói về chiên trong văn cảnh; tránh lặp cứng “không bao giờ... đời đời” nhưng vẫn bảo toàn cường độ của phủ định Hy Lạp.
