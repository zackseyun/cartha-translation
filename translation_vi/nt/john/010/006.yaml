- from: Đức Chúa Jêsus nói với họ ẩn dụ này[a], nhưng họ không hiểu những điều Ngài đang nói với họ.
  to: Đức Giê-su đã nói với họ cách nói ví von này[a], nhưng họ không hiểu những điều Người nói với họ là gì.
  rationale: Đổi “ẩn dụ” thành “cách nói ví von” để phản ánh phạm vi nghĩa rộng và không chuyên biệt của παροιμία. Chuẩn hóa tên riêng thành “Đức Giê-su” và loại tước hiệu không có trong nguyên văn. Giữ sự lặp lại “với họ” và ý họ không hiểu nội dung điều Người nói.
  reviewer_model: gpt-5.6-terra
