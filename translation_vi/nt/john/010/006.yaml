source:
  edition: SBLGNT
  text: ταύτην τὴν παροιμίαν εἶπεν αὐτοῖς ὁ Ἰησοῦς· ἐκεῖνοι δὲ οὐκ ἔγνωσαν τίνα ⸀ἦν ἃ ἐλάλει αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/006.yaml
  text: Jesus spoke this figure of speech to them[a], but they did not understand what he was saying to them.
translation:
  language: vi
  text: Đức Giê-su đã nói với họ cách nói ví von này[a], nhưng họ không hiểu những điều Người nói với họ là gì.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “dụ ngôn”, “lời nói hình tượng”, “minh họa” hoặc “tục ngữ”. Từ Hy Lạp này có thể chỉ chung một lời nói mang nghĩa bóng; ở đây, từ ấy nói đến diễn ngôn về người chăn chiên mà Đức Giê-su vừa trình bày theo lối không hiểu theo nghĩa đen.
    reason: lexical_alternative
lexical_decisions:
- source_word: παροιμίαν
  choice: ẩn dụ
  rationale: Từ này chỉ một lời nói mang nghĩa bóng, cách nói hình tượng hoặc minh họa kín đáo. Trong ngữ cảnh, “ẩn dụ” diễn đạt tự nhiên diễn ngôn về người chăn chiên mà không giới hạn nghĩa vào “tục ngữ” hay đồng nhất hoàn toàn với thuật ngữ παραβολή.
- source_word: εἶπεν
  choice: nói
  rationale: Động từ λέγω ở đây đơn giản chỉ hành động Đức Chúa Jêsus trình bày ẩn dụ với những người nghe; “nói” là cách diễn đạt tự nhiên và sát nghĩa trong tiếng Việt.
- source_word: ἐκεῖνοι δὲ
  choice: nhưng họ
  rationale: Đại từ ἐκεῖνοι tạo thế tương phản với Đức Chúa Jêsus, còn δέ mang sắc thái đối lập; “nhưng họ” vừa tự nhiên vừa giữ rõ tương phản.
- source_word: οὐκ ἔγνωσαν
  choice: không hiểu
  rationale: Trong văn cảnh, vấn đề không phải là thiếu thông tin mà là không nắm được ý nghĩa của lời nói hình tượng, nên “không hiểu” phù hợp hơn “không biết”.
- source_word: τίνα ἦν ἃ ἐλάλει αὐτοῖς
  choice: những điều Ngài đang nói với họ
  rationale: Cấu trúc Hy Lạp khá gập ghềnh, sát chữ là họ không hiểu những điều Ngài nói với họ là gì. Bản dịch giữ danh ngữ số nhiều “những điều” và nội dung của sự không hiểu, đồng thời diễn đạt tự nhiên trong tiếng Việt.
- source_word: αὐτοῖς
  choice: với họ
  rationale: Dạng tặng cách đánh dấu những người tiếp nhận lời nói. “Nói với họ” là kết hợp tự nhiên trong tiếng Việt; việc lặp lại ở cuối câu phản ánh cấu trúc và trọng tâm của nguyên văn.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Jêsus” và đại từ “Ngài” theo lối xưng gọi Kinh Thánh Việt ngữ trang nghiêm; câu giữ sự lặp lại “với họ” của nguyên văn mà vẫn tự nhiên.
