id: JHN.10.38
reference: John 10:38
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἰ δὲ ποιῶ, κἂν ἐμοὶ μὴ πιστεύητε τοῖς ἔργοις ⸀πιστεύετε, ἵνα γνῶτε καὶ ⸀γινώσκητε ὅτι ἐν ἐμοὶ ὁ πατὴρ κἀγὼ ἐν ⸂τῷ πατρί⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/038.yaml
  text: But if I do them[a], even if you do not believe me, believe the works, so that you may know and continue to know that the Father is in me[c][b], and I am in the Father.
translation:
  language: vi
  text: Nhưng nếu tôi làm những việc ấy, thì dù các ông không tin tôi, hãy tin những việc đó, để các ông nhận biết và tiếp tục nhận biết rằng Cha ở trong tôi, và tôi ở trong Cha.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch phần cuối là: “để các ông đi đến chỗ nhận biết và hiểu rằng Cha ở trong tôi, và tôi ở trong Cha.” Hai động từ Hy Lạp cùng thuộc nhóm nghĩa “biết/nhận biết” nhưng có dạng thể khác nhau; cách diễn đạt chính xác sắc thái giữa chúng không hoàn toàn chắc chắn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιῶ
  choice: tôi làm những việc ấy
  rationale: Động từ hiện tại có tân ngữ được hiểu ngầm từ văn cảnh là các công việc của Đức Giê-su; thêm “những việc ấy” giúp câu tiếng Việt rõ và tự nhiên.
- source_word: κἂν ἐμοὶ μὴ πιστεύητε
  choice: dù các ông không tin tôi
  rationale: 'πιστεύω với đại từ ở cách dữ cách tại đây có thể là tin lời Đức Giê-su hoặc tin vào Ngài. “Không tin tôi” phù hợp nhất với sự đối chiếu ngay sau đó: “hãy tin những việc đó,” đồng thời vẫn giữ phần nào độ mở của nguyên ngữ.'
- source_word: τοῖς ἔργοις πιστεύετε
  choice: hãy tin những việc đó
  rationale: 'Cách diễn đạt này giữ lực cô đọng của tiếng Hy Lạp: các công việc làm chứng cho lời Đức Giê-su. Không dùng “tin vào” để tránh gợi ý rằng chính các công việc là đối tượng của đức tin.'
- source_word: ἔργοις
  choice: những việc
  rationale: Trong Giăng, ἔργα chỉ các công việc mang tính mặc khải của Đức Giê-su. “Những việc” tự nhiên hơn “các công tác” và không diễn giải thành “dấu lạ,” vì nguyên văn không dùng σημεῖα.
- source_word: ἵνα γνῶτε καὶ γινώσκητε
  choice: để các ông nhận biết và tiếp tục nhận biết
  rationale: Hai dạng động từ—bất định quá khứ và hiện tại—có thể gợi tiến trình đi đến nhận biết rồi duy trì sự nhận biết ấy. Bản dịch thể hiện sự khác biệt thể mà không đổi động từ thứ hai thành một ý khác như “hiểu.”
- source_word: ἐν ἐμοὶ ὁ πατὴρ κἀγὼ ἐν τῷ πατρί
  choice: Cha ở trong tôi, và tôi ở trong Cha
  rationale: Giữ nguyên cấu trúc ἐν lặp lại và ngôn ngữ nội tại hỗ tương, không diễn giải thành hiệp nhất hay đưa thuật ngữ tín điều hậu kỳ vào câu.
- source_word: πατήρ
  choice: Cha
  rationale: Danh từ có mạo từ chỉ Đức Chúa Cha. Trong tiếng Việt, “Cha” viết hoa là cách gọi tự nhiên và trang trọng; không thêm “của tôi,” vì nguyên văn không có đại từ sở hữu.
theological_decisions:
- issue: Sự ở trong nhau giữa Cha và Con
  choice: Giữ cách nói trực tiếp “Cha ở trong tôi, và tôi ở trong Cha.”
  alternative: “Cha hiệp nhất với tôi, và tôi hiệp nhất với Cha” hoặc “Cha ngự trong tôi, và tôi ngự trong Cha.”
  rationale: Nguyên văn khẳng định mối tương quan hỗ tương bằng ἐν nhưng không tự giải thích bản chất của mối tương quan ấy. Cách dịch trực tiếp bảo toàn sức nặng thần học và độ căng của lời văn Giăng, không đồng nhất nó với một lối giải nghĩa giáo phái hay công thức tín điều về sau.
- issue: Khía cạnh của γνῶτε và γινώσκητε
  choice: Dịch “nhận biết và tiếp tục nhận biết.”
  alternative: “đi đến chỗ nhận biết và hiểu” hoặc chỉ “nhận biết.”
  rationale: Cách chọn này cố gắng bảo toàn sự chuyển từ dạng bất định quá khứ sang dạng hiện tại. Tuy vậy, vì ý nghĩa chính xác của khác biệt thể trong cấu trúc này còn có thể được hiểu khác, ghi chú nêu một cách dịch tiếng Việt tự nhiên hơn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng đại từ “tôi/các ông” phù hợp với cuộc đối thoại đối nghịch trong văn cảnh; “Cha” viết hoa để chỉ Đức Chúa Cha. Câu giữ nhịp lập luận điều kiện–nhượng bộ–mệnh lệnh–mục đích của nguyên văn.
