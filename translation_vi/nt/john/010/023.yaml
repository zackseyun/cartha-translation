  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ περιεπάτει ὁ Ἰησοῦς ἐν τῷ ἱερῷ ἐν τῇ στοᾷ ⸀τοῦ Σολομῶνος.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/023.yaml
  text: And Jesus was walking in the temple courts[b][a], in Solomon’s Portico.
translation:
  language: vi
  text: Đức Giê-su đang đi lại trong khuôn viên đền thờ[b], tại Hành lang Sa-lô-môn[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “hàng hiên”; từ Hy Lạp στοά chỉ một lối đi có mái che và hàng cột.
    reason: lexical_alternative
  - marker: b
    text: Từ Hy Lạp ἱερόν chỉ toàn bộ khuôn viên hay phạm vi đền thờ, chứ không riêng nơi thánh bên trong.
    reason: cultural_note
lexical_decisions:
- source_word: καὶ
  choice: Đức Giê-su
  rationale: Không dịch riêng liên từ καί ở đầu câu để câu tiếng Việt nối tiếp tự nhiên trong ngữ cảnh, mà không thêm sắc thái thời gian.
- source_word: περιεπάτει
  choice: đang đi lại
  rationale: Thì chưa hoàn thành diễn tả hành động đang tiếp diễn trong quá khứ; “đang đi lại” cũng phản ánh sắc thái chuyển động quanh một khu vực.
- source_word: ἱερῷ
  choice: khuôn viên đền thờ
  rationale: ἱερόν chỉ toàn bộ khu đền thờ, không riêng nơi thánh bên trong; cách dịch này rõ nghĩa và tự nhiên trong tiếng Việt.
- source_word: στοᾷ
  choice: Hành lang
  rationale: στοά là lối đi có mái che và hàng cột; “Hành lang” dễ hiểu, phù hợp với tên địa điểm, còn chi tiết kiến trúc được giữ trong chú thích.
- source_word: τοῦ Σολομῶνος
  choice: Sa-lô-môn
  rationale: Sở hữu cách Hy Lạp được diễn đạt tự nhiên bằng cấu trúc danh từ riêng đứng sau “Hành lang” trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Giê-su” theo cách gọi kính trọng phổ biến; giữ hai chú thích để phân biệt khu đền thờ với nơi thánh và giải thích đặc điểm kiến trúc của στοά.
