  text: ⸀ὅτι μισθωτός ἐστιν καὶ οὐ μέλει αὐτῷ περὶ τῶν προβάτων.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/013.yaml
  text: because he is a hired hand and does not care about the sheep.
translation:
  language: vi
  text: vì người ấy là người làm thuê và không quan tâm đến chiên.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι
  choice: vì
  rationale: Liên từ nêu nguyên nhân cho việc người làm thuê bỏ chạy ở mệnh đề trước; “vì” tự nhiên và rõ nghĩa trong tiếng Việt hiện đại.
- source_word: μισθωτός
  choice: kẻ làm thuê
  rationale: Từ này chỉ người làm việc để nhận tiền công, đối lập với người chăn có trách nhiệm đối với chiên. “Kẻ làm thuê” phù hợp với sắc thái phê phán trong ngữ cảnh mà không dùng từ cổ.
- source_word: οὐ μέλει αὐτῷ περὶ
  choice: không quan tâm đến
  rationale: Cấu trúc vô nhân xưng với tặng cách và περί diễn tả sự quan tâm; cách dịch này tự nhiên, chính xác và giữ nguyên sức nặng đạo đức của lời nhận xét.
- source_word: τῶν προβάτων
  choice: chiên
  rationale: Giữ trực tiếp hình ảnh mục tử của danh từ Hy Lạp. Tiếng Việt có thể dùng danh từ loài “chiên” mà không cần mạo từ; không đổi thành “bầy chiên” vì nguyên văn nói đến những con chiên, không dùng danh từ “bầy”.
theological_decisions:
- issue: Cách khắc họa μισθωτός trong sự tương phản với người chăn tốt lành
  choice: Dịch lời nhận xét theo nghĩa đạo đức trực tiếp của câu, không xác định người làm thuê là một nhóm lãnh đạo cụ thể.
  alternative: Diễn giải người làm thuê là một hạng lãnh đạo giả dối cụ thể, hoặc làm nhẹ sự tương phản thành thái độ xa cách nghề nghiệp.
  rationale: Câu văn chỉ nêu rằng người ấy là người làm thuê và không quan tâm đến chiên. Bản dịch giữ sự tương phản với người chăn tốt lành nhưng không đưa vào một danh tính hay kết luận giáo lý mà câu không nói rõ.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Kẻ làm thuê” giữ sắc thái bất lợi của ngữ cảnh; “người ấy” nối tự nhiên với nhân vật đã được nhắc đến trong câu trước.
