  text: Εἶπεν οὖν πάλιν ⸀αὐτοῖς ὁ Ἰησοῦς· Ἀμὴν ἀμὴν λέγω ὑμῖν ⸀ὅτι ἐγώ εἰμι ἡ θύρα τῶν προβάτων.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/007.yaml
  text: So Jesus said to them again[a], “Truly, truly, I say to you, I am the door for the sheep.”
translation:
  language: vi
  text: 'Vậy, Đức Giê-su lại nói với họ: “Quả thật, quả thật, tôi nói với các ông: tôi là cửa của chiên.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “cổng của chiên.” Từ Hy Lạp θύρα có thể chỉ “cửa” hoặc “cổng,” nhất là trong hình ảnh chăn chiên.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Vì vậy
  rationale: 'Diễn tả sự tiếp nối có tính suy luận từ lời trước: vì họ không hiểu hình ảnh Ngài vừa nói, Đức Chúa Jêsus nói lại để giải thích.'
- source_word: πάλιν
  choice: lại
  rationale: Giữ rõ ý lặp lại, đồng thời đặt tự nhiên trong câu tiếng Việt.
- source_word: Ἀμὴν ἀμὴν
  choice: Thật, thật
  rationale: Bảo toàn phép lặp trang trọng và nhấn mạnh đặc trưng trong lời Đức Chúa Jêsus, thay vì làm yếu đi bằng một trạng từ đơn.
- source_word: λέγω ὑμῖν
  choice: tôi nói với các ông
  rationale: Dịch sát công thức phát ngôn; “các ông” phù hợp với nhóm người đang được nói trực tiếp trong ngữ cảnh.
- source_word: ἐγώ εἰμι
  choice: tôi là
  rationale: Cách tự nhiên và trực tiếp để diễn đạt lời tự nhận mang tính nhấn mạnh trong tiếng Hy Lạp.
- source_word: θύρα
  choice: cửa
  rationale: “Cửa” là nghĩa trực tiếp và vẫn thích hợp với hình ảnh lối ra vào chuồng chiên; nghĩa theo ngữ cảnh “cổng” được nêu ở chú thích.
- source_word: τῶν προβάτων
  choice: của chiên
  rationale: Giữ quan hệ sở hữu/liên hệ của cấu trúc sở hữu cách Hy Lạp mà không giải thích quá mức thành “dành cho chiên” hay “dẫn vào chuồng chiên”.
theological_decisions:
- issue: Lời tự nhận ẩn dụ “tôi là cửa”
  choice: tôi là cửa của chiên
  alternative: tôi là cổng dành cho chiên
  rationale: Giữ nguyên hình ảnh và quan hệ ngữ pháp có phần mở của nguyên văn, không triển khai thành một diễn giải giáo lý về sự cứu rỗi, sự an toàn hay tính độc nhất.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Duy trì nhịp lặp “Thật, thật” của nguyên văn và dùng “Đức Chúa Jêsus” theo lối gọi quen thuộc trong tiếng Việt Cơ Đốc; không thêm lời giải nghĩa thần học vào chính văn.
