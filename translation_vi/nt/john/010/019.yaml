source:
  edition: SBLGNT
  text: ⸀Σχίσμα πάλιν ἐγένετο ἐν τοῖς Ἰουδαίοις διὰ τοὺς λόγους τούτους.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/019.yaml
  text: Because of these words[a], a division arose again among the Jews.
translation:
  language: vi
  text: Vì những lời ấy, sự chia rẽ lại xảy ra giữa những người Do Thái.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “những người Giu-đê” hoặc, trong một số ngữ cảnh của sách Giăng, “các nhà lãnh đạo Do Thái”. Cụm từ ở đây phản ánh cách diễn đạt Hy Lạp, nhưng trong sách Giăng, từ này thường chỉ một nhóm cụ thể theo ngữ cảnh chứ không nhất thiết chỉ toàn thể dân Do Thái.
    reason: lexical_alternative
lexical_decisions:
- source_word: Σχίσμα
  choice: sự chia rẽ
  rationale: Danh từ này chỉ sự rạn nứt hoặc phân chia; trong ngữ cảnh, nó nói đến những phản ứng trái ngược nhau trước lời Đức Chúa Jêsus.
- source_word: πάλιν
  choice: lại
  rationale: Diễn tả sự việc tái diễn và phù hợp tự nhiên với trật tự câu tiếng Việt.
- source_word: ἐγένετο
  choice: xảy ra
  rationale: Giữ ý một tình trạng hay biến cố phát sinh, đồng thời kết hợp tự nhiên với “sự chia rẽ”.
- source_word: ἐν τοῖς Ἰουδαίοις
  choice: giữa những người Do Thái
  rationale: Bám sát nghĩa trực tiếp của cụm từ Hy Lạp mà không tự giới hạn đối tượng thành giới lãnh đạo; chú thích ghi nhận các khả năng theo ngữ cảnh trong sách Giăng.
- source_word: διὰ
  choice: Vì
  rationale: Với đối cách, giới từ diễn tả nguyên nhân; “Vì” truyền đạt quan hệ nhân quả rõ ràng và gọn.
- source_word: τοὺς λόγους τούτους
  choice: những lời ấy
  rationale: Chỉ những lời Đức Chúa Jêsus vừa nói ở phần trước; “ấy” hồi chỉ tự nhiên trong văn thuật chuyện tiếng Việt.
theological_decisions:
- issue: Đối tượng của Ἰουδαῖοι trong sách Giăng
  choice: Dịch trong chính văn là “những người Do Thái”, kèm chú thích về phạm vi nghĩa tùy ngữ cảnh.
  alternative: “những người Giu-đê” hoặc “các nhà lãnh đạo Do Thái”
  rationale: Cách dịch chính giữ sát từ ngữ Hy Lạp và không loại bỏ tính mơ hồ thật sự. Chú thích ngăn việc hiểu câu này như một sự khái quát hóa về toàn thể dân Do Thái.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu giữ quan hệ nguyên nhân ở đầu câu như nguyên bản; “sự chia rẽ lại xảy ra” vừa tự nhiên vừa bảo toàn ý tái diễn.
