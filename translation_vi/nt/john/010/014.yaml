  terminology: “Người chăn chiên” tránh liên tưởng chức vụ “mục sư”; “tốt lành” truyền đạt καλά một cách trang trọng và tự nhiên. “Những người thuộc về Ta” là diễn giải ngữ cảnh hợp lý của τὰ ἐμά, còn “chiên của Ta” nên được giữ như phương án chú thích.
