  text: ἐγώ εἰμι ὁ ποιμὴν ὁ καλός, καὶ γινώσκω τὰ ἐμὰ καὶ ⸂γινώσκουσί με τὰ ἐμά⸃,
base_translation:
  language: en
  yaml_path: translation/nt/john/010/014.yaml
  text: I am the good shepherd[a], and I know my own, and my own know me,
translation:
  language: vi
  text: Ta là người chăn chiên tốt lành; Ta biết những người thuộc về Ta[a], và những người thuộc về Ta biết Ta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “chiên của Ta.” Trong cả hai vế, nguyên văn Hy Lạp dùng một tính từ sở hữu số nhiều giống trung, nghĩa là “những điều thuộc về Ta”; theo ngữ cảnh, cách nói này chỉ những người thuộc về Ta.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγώ εἰμι
  choice: Ta là
  rationale: Diễn đạt trực tiếp lời tự xưng ở thì hiện tại; “Ta” phù hợp với lời Đức Giê-su tự nói trong văn phong Kinh Thánh trang trọng mà vẫn dễ hiểu.
- source_word: ποιμὴν
  choice: người chăn chiên
  rationale: Giữ nguyên hình ảnh nghề chăn chiên trong ngữ cảnh, không dùng “mục sư,” vì từ ấy dễ gợi đến một chức vụ Hội Thánh về sau.
- source_word: καλός
  choice: tốt lành
  rationale: Truyền đạt phẩm chất tốt đẹp cả về đạo đức lẫn sự xứng hợp; đây cũng là cách nói tự nhiên, trang trọng trong tiếng Việt.
- source_word: γινώσκω / γινώσκουσί
  choice: biết
  rationale: Giữ được tính tương ứng giữa hai vế và sắc thái nhận biết mang tính cá nhân, tương giao; “nhận ra” sẽ quá yếu và thiên về tình huống.
- source_word: τὰ ἐμὰ / τὰ ἐμά
  choice: những người thuộc về Ta
  rationale: Tính từ sở hữu số nhiều giống trung được dùng độc lập, theo ngữ cảnh chỉ những người thuộc về người chăn. Cách dịch này tự nhiên hơn lối dịch sát chữ “những gì thuộc về Ta,” đồng thời không tự ý thêm danh từ “chiên” vào chính văn.
- source_word: καί
  choice: và
  rationale: Giữ cách nối đơn giản, tích lũy của nguyên văn mà không thêm sắc thái nhấn mạnh.
theological_decisions:
- issue: Diễn đạt mối quan hệ nhận biết lẫn nhau giữa Đức Giê-su và những người thuộc về Ngài mà không đưa thêm công thức thần học về sau
  choice: những người thuộc về Ta
  alternative: chiên của Ta
  rationale: Cách chọn này giữ trọng tâm về sự thuộc về và sự nhận biết mang tính tương giao, đồng thời phản ánh việc nguyên văn không lặp lại danh từ “chiên” trong câu này.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Ta” nhất quán cho lời tự xưng của Đức Giê-su. Tách câu sau “tốt lành” để nhịp văn tự nhiên, trong khi vẫn giữ nguyên quan hệ phối hợp của các mệnh đề.
