source:
  edition: SBLGNT
  text: καὶ ἄλλα πρόβατα ἔχω ἃ οὐκ ἔστιν ἐκ τῆς αὐλῆς ταύτης· κἀκεῖνα ⸂δεῖ με⸃ ἀγαγεῖν, καὶ τῆς φωνῆς μου ἀκούσουσιν, καὶ ⸀γενήσονται μία ποίμνη, εἷς ποιμήν.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/016.yaml
  text: And I have other sheep that are not from this sheepfold[a]. I must bring them also, and they will listen to my voice. Then there will be one flock[b], one shepherd.
translation:
  language: vi
  text: Ta còn có những chiên khác không thuộc chuồng này. Ta cũng phải đem chúng về; chúng sẽ nghe tiếng Ta[a]. Rồi sẽ có một bầy, một người chăn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “chúng sẽ lắng nghe tiếng Ta” hoặc “chúng sẽ nghe theo tiếng Ta”. Động từ Hy Lạp có thể mang nghĩa “nghe” hoặc “lắng nghe”; trong ngữ cảnh này, có lẽ hàm ý sự đáp lại.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλα πρόβατα
  choice: những chiên khác
  rationale: πρόβατα là từ thông dụng chỉ chiên, không riêng chiên con; ἄλλα cho biết còn có những chiên ngoài số đang được nói đến.
- source_word: αὐλή
  choice: chuồng
  rationale: Trong hình ảnh chăn chiên, αὐλή chỉ nơi có rào bao quanh để giữ chiên. “Chuồng” tự nhiên trong tiếng Việt và phân biệt được với “bầy” ở cuối câu.
- source_word: κἀκεῖνα
  choice: chúng
  rationale: Đại từ này quy chiếu về “những chiên khác”; từ “cũng” đi với mệnh đề diễn đạt sắc thái bổ sung của καί.
- source_word: δεῖ με ἀγαγεῖν
  choice: Ta cũng phải đem chúng về
  rationale: “Phải” giữ sức nặng của δεῖ, còn “đem ... về” diễn đạt tự nhiên hành động ἄγω trong khung cảnh người chăn quy tụ chiên mà không giải thích nguồn gốc của sự tất yếu.
- source_word: τῆς φωνῆς μου ἀκούσουσιν
  choice: chúng sẽ nghe theo tiếng Ta
  rationale: ἀκούω có thể là nghe hoặc lắng nghe; “nghe theo” trong ngữ cảnh này chuyển tải sự nghe có đáp ứng, đồng thời chú thích giữ lại khả năng dịch đơn giản là “nghe”.
- source_word: γενήσονται
  choice: rồi sẽ chỉ có
  rationale: Cách diễn đạt này tự nhiên trong tiếng Việt đối với trạng thái kết quả do γενήσονται nêu ra; “chỉ” nhấn mạnh tính duy nhất vốn có trong μία và εἷς, không thêm ý độc quyền thể chế.
- source_word: μία ποίμνη
  choice: một bầy
  rationale: ποίμνη chỉ tập thể các con chiên, khác với αὐλή là chuồng hoặc khu quây giữ chiên.
- source_word: εἷς ποιμήν
  choice: một người chăn
  rationale: ποιμήν nghĩa là người chăn; cách dịch giữ nguyên hình ảnh mục tử và sự song hành với “một bầy”.
theological_decisions:
- issue: Phân biệt αὐλή với ποίμνη
  choice: chuồng này ... một bầy
  alternative: chuồng này ... một chuồng
  rationale: 'Nguyên văn dùng hai danh từ khác nhau: αὐλή là nơi quây giữ chiên, còn ποίμνη là bầy chiên. Giữ sự phân biệt tránh biến sự hiệp nhất dưới một người chăn thành việc cùng ở trong một cơ cấu hoặc khuôn viên.'
- issue: Sức nặng của δεῖ
  choice: Ta cũng phải đem chúng về
  alternative: Ta cũng cần đem chúng về
  rationale: “Phải” bảo toàn ý tất yếu của δεῖ trong sách Giăng mà không áp đặt một lời giải thích thần học cụ thể về nguồn gốc của sự tất yếu ấy.
- issue: Sắc thái của ἀκούω
  choice: nghe theo tiếng Ta
  alternative: nghe tiếng Ta
  rationale: Ngữ cảnh về chiên nhận biết và đi theo người chăn gợi ý sự nghe có đáp ứng. Tuy nhiên, vì động từ cũng có thể chỉ hành vi nghe, phương án đó được ghi trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ta” theo lời trực tiếp của Chúa Giê-su, phù hợp giọng uy nghiêm nhưng không cổ kính quá mức. “Chiên”, “chuồng”, “bầy” và “người chăn” duy trì nhất quán hình ảnh mục tử, đồng thời bảo toàn sự phân biệt từ vựng của nguyên văn.
