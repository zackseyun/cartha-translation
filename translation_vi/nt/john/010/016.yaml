  naturalness: Văn phong tự nhiên, trang trọng và nhất quán với lời trực tiếp dùng “Ta”. “Chuồng này”, “một bầy” và “một người chăn” đều rõ nghĩa trong tiếng Việt hiện đại.
  terminology: “Chiên”, “chuồng”, “bầy”, và “người chăn” giữ được trường nghĩa chăn chiên. Chú thích phân biệt αὐλή và ποίμνη là hữu ích và đúng trọng tâm. Chú thích về ἀκούω nên nêu khả năng “lắng nghe/nghe theo” như sắc thái ngữ cảnh, thay vì trình bày “nghe theo” như nghĩa chính bắt buộc.
