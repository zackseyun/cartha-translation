source:
  edition: SBLGNT
  text: ἀπεκρίθη αὐτοῖς ὁ Ἰησοῦς· Πολλὰ ⸂ἔργα καλὰ ἔδειξα ὑμῖν⸃ ἐκ τοῦ ⸀πατρός· διὰ ποῖον αὐτῶν ἔργον ⸂ἐμὲ λιθάζετε⸃;
base_translation:
  language: en
  yaml_path: translation/nt/john/010/032.yaml
  text: Jesus answered them[a], “I showed you many good works from the Father[b]; for which of them are you stoning me?”
translation:
  language: vi
  text: 'Đức Giê-su trả lời họ: “Tôi đã cho các ông thấy nhiều việc tốt lành đến từ Cha[a]. Vì việc nào trong số đó mà các ông ném đá tôi[b]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Một số bản dịch viết “Cha tôi,” nhưng tiếng Hy Lạp ở đây chỉ nói “Cha.”
    reason: alternative_reading
  - marker: b
    text: 'Cũng có thể dịch: “Vì việc nào trong những việc ấy mà các ông ném đá tôi?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη αὐτοῖς
  choice: đáp họ
  rationale: Diễn đạt trực tiếp động từ kể chuyện ἀπεκρίθη cùng đại từ αὐτοῖς, tự nhiên trong tiếng Việt mà không thêm sắc thái.
- source_word: Πολλὰ ἔργα καλὰ
  choice: nhiều việc tốt lành
  rationale: “Việc” phù hợp với các hành động hữu hình của Đức Giê-su trong văn mạch Gio-an; “tốt lành” giữ sắc thái đáng quý và đem lại ích lợi của καλὰ.
- source_word: ἔδειξα ὑμῖν
  choice: đã cho các ông thấy
  rationale: Cách nói tự nhiên trong tiếng Việt, giữ ý Đức Giê-su làm cho những việc ấy trở nên rõ ràng trước mắt họ.
- source_word: ἐκ τοῦ πατρός
  choice: đến từ Cha
  rationale: Giữ quan hệ nguồn gốc của ἐκ và không thêm đại từ sở hữu “của tôi,” vốn không có trong bản Hy Lạp.
- source_word: διὰ ποῖον αὐτῶν ἔργον
  choice: vì việc nào trong số đó
  rationale: διά với đối cách chỉ nguyên nhân hoặc căn cứ; cách dịch này cũng giữ việc ποῖον ἔργον ở số ít và αὐτῶν quy chiếu về nhiều việc vừa nêu.
- source_word: ἐμὲ λιθάζετε
  choice: các ông ném đá tôi
  rationale: Giữ trực tiếp động từ λιθάζω và không thêm ý “định” hay “cố,” vốn chỉ được suy ra từ tình huống.
theological_decisions:
- issue: Cách gọi πατήρ trong lời Đức Giê-su
  choice: Cha
  alternative: Cha tôi
  rationale: Bản Hy Lạp có mạo từ nhưng không có μου (“của tôi”). “Cha” giữ cách gọi trong nguyên bản và không làm lời tuyên bố về quan hệ Cha-Con rõ hơn mức câu này trực tiếp nói.
- issue: Sắc thái của hành động ném đá
  choice: ném đá tôi
  alternative: định ném đá tôi
  rationale: Thì hiện tại và văn cảnh có thể gợi hành động đang cận kề, nhưng động từ không trực tiếp chứa ý “định”; bản dịch giữ nguyên sức căng của câu hỏi.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Giê-su” theo lối gọi tôn kính phổ biến; “tôi/các ông” phản ánh lời đối đáp trực diện trong bối cảnh tranh luận. Không thêm yếu tố sở hữu vào “Cha” và không diễn giải hành động ném đá thành ý định.
