    rationale: Động từ “đáp” thường đi với “lời,” “lại,” hoặc xuất hiện trong lối văn cổ/trang trọng hơn. “Trả lời họ” truyền đạt chính xác ἀπεκρίθη αὐτοῖς và tự nhiên hơn, không thay đổi nghĩa.
  revised_text: 'Đức Giê-su trả lời họ: “Tôi đã cho các ông thấy nhiều việc tốt lành đến từ Cha[a]. Vì việc nào trong số đó mà các ông ném đá tôi[b]?”'
