id: JHN.10.1
reference: John 10:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἀμὴν ἀμὴν λέγω ὑμῖν, ὁ μὴ εἰσερχόμενος διὰ τῆς θύρας εἰς τὴν αὐλὴν τῶν προβάτων ἀλλὰ ἀναβαίνων ἀλλαχόθεν ἐκεῖνος κλέπτης ἐστὶν καὶ λῃστής·
base_translation:
  language: en
  yaml_path: translation/nt/john/010/001.yaml
  text: Truly[a], truly, I say to you, the one who does not enter through the door into the sheepfold[c][b], but climbs up from somewhere else—that man is a thief and a robber.
translation:
  language: vi
  text: '“Thật, thật, tôi nói với các anh: người nào không đi qua cửa[a] mà vào chuồng chiên[b], nhưng trèo vào từ một chỗ khác, thì kẻ ấy là tên trộm và tên cướp.[c]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “cổng”. Từ Hy Lạp θύρα có thể chỉ cửa hoặc cổng tùy ngữ cảnh.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “khu quây chiên” hoặc “sân có rào dành cho chiên”. Từ Hy Lạp αὐλή chỉ một khoảng sân hay khu vực có tường hoặc rào bao quanh.
    reason: lexical_alternative
  - marker: c
    text: Tiếng Hy Lạp phân biệt “tên trộm” (κλέπτης), thường lén lút lấy cắp, với “tên cướp” (λῃστής), thường gợi sự cưỡng đoạt hoặc bạo lực hơn.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀμὴν ἀμὴν
  choice: Thật, thật
  rationale: Giữ nguyên sự lặp lại đầy nhấn mạnh và sắc thái trang trọng của công thức mở đầu, đồng thời dùng lời Việt dễ hiểu.
- source_word: λέγω ὑμῖν
  choice: tôi nói với các anh
  rationale: Diễn đạt trực tiếp công thức nói; đại từ số nhiều được thể hiện bằng “các anh”, phù hợp nhóm người nghe trong mạch văn mà không làm câu quá cổ kính.
- source_word: ὁ μὴ εἰσερχόμενος
  choice: người nào không đi ... mà vào
  rationale: Thể hiện phân từ danh từ hóa mang nghĩa khái quát ở số ít bằng cấu trúc tiếng Việt tự nhiên.
- source_word: διὰ τῆς θύρας
  choice: đi qua cửa
  rationale: θύρα có thể là cửa ra vào hoặc cổng; “cửa” là từ tương ứng trực tiếp và thích hợp với hình ảnh, còn khả năng dịch “cổng” được ghi chú.
- source_word: εἰς τὴν αὐλὴν τῶν προβάτων
  choice: vào chuồng chiên
  rationale: Trong ngữ cảnh chăn chiên, “chuồng chiên” diễn đạt tự nhiên khu vực có rào bao để giữ chiên, dù αὐλή cũng có thể chỉ sân có tường bao.
- source_word: ἀλλὰ ἀναβαίνων ἀλλαχόθεν
  choice: nhưng trèo vào từ một chỗ khác
  rationale: “Trèo vào” giữ hình ảnh vượt qua rào hoặc tường thay vì đi vào bình thường; “từ một chỗ khác” thể hiện ἀλλαχόθεν mà không biến nó thành khái niệm trừu tượng “cách khác”.
- source_word: ἐκεῖνος
  choice: kẻ ấy
  rationale: Giữ lực chỉ định, nhận diện của đại từ Hy Lạp; “kẻ” cũng tự nhiên trước hai danh xưng mang nghĩa xấu ở cuối câu.
- source_word: κλέπτης
  choice: tên trộm
  rationale: Chỉ người lén lút lấy tài sản, phân biệt với λῃστής.
- source_word: λῃστής
  choice: tên cướp
  rationale: Gợi hành vi chiếm đoạt công khai hoặc bằng bạo lực hơn κλέπτης, nhờ đó giữ sự phân biệt giữa hai danh từ.
theological_decisions:
- issue: Hình ảnh ẩn dụ αὐλή/θύρα
  choice: Dịch cụ thể là “cửa” và “chuồng chiên”, không giải nghĩa biểu tượng ngay trong câu.
  alternative: Dịch “cổng” và “khu quây chiên”, hoặc thêm lời giải thích về căn tính của cửa và những người chăn.
  rationale: Câu này mở đầu hình ảnh sẽ được khai triển trong mạch văn kế tiếp; bản dịch cần giữ hình ảnh và tránh đưa kết luận thần học từ các câu sau vào chính câu này.
- issue: Hai từ κλέπτης và λῃστής
  choice: 'Giữ hai danh xưng riêng biệt: “tên trộm” và “tên cướp”.'
  alternative: Gộp thành một ý như “kẻ trộm cướp”.
  rationale: Nguyên văn dùng hai danh từ khác nhau, trong đó từ thứ hai thường hàm ý sự cưỡng đoạt hoặc bạo lực; giữ cả hai bảo toàn cường độ và sự căng thẳng của lời nói.
- issue: Chủ thể số ít giống đực trong ὁ ... ἐκεῖνος
  choice: Dùng “người nào ... kẻ ấy”, một cấu trúc số ít và khái quát tự nhiên trong tiếng Việt.
  alternative: Dùng “ai ... người đó” hoặc thêm đại từ chỉ giới tính.
  rationale: Tiếng Việt không bắt buộc đánh dấu giống ngữ pháp. Cấu trúc này bảo toàn số ít và tính đại diện của nguyên văn mà không thêm giới tính sinh học ngoài điều câu văn cần truyền đạt.
translation_notes:
  register: Văn phong trang trọng, rõ ràng và hiện đại. Giữ nhịp nhấn mạnh “Thật, thật” cùng hình ảnh cụ thể của chuồng chiên. Dùng “tôi” trong lời nói trực tiếp để tự nhiên trong tiếng Việt hiện đại; “các anh” biểu thị đối tượng số nhiều trong mạch văn. Các dấu chú thích [a], [b], [c] đều được đặt ngay sau nội dung liên quan.
