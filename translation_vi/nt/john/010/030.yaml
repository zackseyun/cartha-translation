id: JHN.10.30
reference: John 10:30
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐγὼ καὶ ὁ πατὴρ ἕν ἐσμεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/030.yaml
  text: I and the Father are one[a].
translation:
  language: vi
  text: Ta và Cha là một[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hy Lạp được dịch là “một” ở giống trung, nhấn mạnh sự hiệp một mà không đồng nhất Chúa Giê-su và Cha thành một ngôi vị.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγὼ
  choice: Ta
  rationale: Đại từ ngôi thứ nhất số ít được nêu rõ để làm nổi bật chủ thể. Trong lời trực tiếp của Chúa Giê-su với danh xưng “Cha”, “Ta” giữ sắc thái trang trọng và tự nhiên của văn phong Kinh Thánh tiếng Việt.
- source_word: καὶ
  choice: và
  rationale: Liên từ đẳng lập đơn giản, nối hai chủ thể mà không thêm ý nghĩa ngoài sự phối hợp.
- source_word: ὁ πατὴρ
  choice: Cha
  rationale: Trong văn mạch Giăng, danh từ có mạo từ này chỉ Cha của Chúa Giê-su như một danh xưng; tiếng Việt tự nhiên lược mạo từ và viết hoa “Cha”.
- source_word: ἕν
  choice: một
  rationale: Tính từ số đếm ở giống trung, số ít, diễn đạt sự hiệp một nhưng không đồng nhất Chúa Giê-su và Cha thành một ngôi vị. “Một” là cách dịch trực tiếp và giữ được độ cô đọng cùng sự căng thẳng thần học của nguyên văn.
- source_word: ἐσμεν
  choice: là
  rationale: Động từ ngôi thứ nhất số nhiều của εἰμί. Tiếng Việt không biến đổi động từ theo số, nhưng hai chủ thể “Ta và Cha” vẫn thể hiện rõ tính số nhiều và sự phân biệt giữa hai chủ thể.
theological_decisions:
- issue: Ý nghĩa của ἕν giống trung đi với ἐσμεν số nhiều trong một tuyên bố có ý nghĩa Cơ Đốc học
  choice: Dịch là “Ta và Cha là một”, khẳng định sự hiệp một thật sự giữa Chúa Giê-su và Cha, đồng thời vẫn giữ sự phân biệt giữa hai chủ thể.
  alternative: “Ta và Cha là một thực thể”; “Ta và Cha hiệp một.”
  rationale: Dạng giống trung của “một” không nói Chúa Giê-su và Cha là cùng một ngôi vị, còn động từ số nhiều cho thấy hai chủ thể vẫn được phân biệt. Không nên làm nhẹ lời tuyên bố thành sự đồng thuận đơn thuần, cũng không nên đưa thuật ngữ tín điều hậu kỳ vào bản văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và cô đọng. Dùng “Ta” trong lời Chúa Giê-su và “Cha” như danh xưng; giữ nguyên cấu trúc ngắn, mạnh của câu Hy Lạp.
