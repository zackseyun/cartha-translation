    reason: cultural_note
lexical_decisions:
- source_word: Ἐγένετο
  choice: được tổ chức
  rationale: Trong ngữ cảnh một kỳ lễ, động từ chỉ việc sự kiện diễn ra; “được tổ chức” tự nhiên trong tiếng Việt và giữ sắc thái sự kiện.
- source_word: τότε
  choice: Lúc ấy
  rationale: Diễn đạt tự nhiên sự chuyển tiếp thời gian do τότε đánh dấu.
- source_word: τὰ ἐγκαίνια
  choice: Lễ Cung Hiến
  rationale: Chuyển nghĩa tên lễ chỉ việc cung hiến lại Đền Thờ, đồng thời tránh thay trực tiếp thuật ngữ Hy Lạp bằng tên gọi phổ biến về sau là Hanukkah.
- source_word: ἐν τοῖς Ἱεροσολύμοις
  choice: tại Giê-ru-sa-lem
  rationale: Cách diễn đạt địa điểm trang trọng, tự nhiên trong tiếng Việt hiện đại.
- source_word: χειμὼν ἦν
  choice: Khi đó là mùa đông
  rationale: Giữ câu miêu tả ngắn gọn của nguyên bản; “khi đó” giúp câu độc lập tự nhiên hơn trong tiếng Việt.
theological_decisions:
- issue: Cách xác định τὰ ἐγκαίνια
  choice: Dịch trong chính văn là “Lễ Cung Hiến”
  alternative: Hanukkah; Lễ Khánh Thành
  rationale: “Lễ Cung Hiến” phản ánh trực tiếp nghĩa của thuật ngữ Hy Lạp và sự kiện cung hiến lại Đền Thờ, còn tên gọi quen thuộc “Hanukkah” được giữ trong chú thích để cung cấp bối cảnh văn hóa mà không thay thế cách diễn đạt của nguyên bản.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “Lễ Cung Hiến” như tên riêng của kỳ lễ; “Giê-ru-sa-lem” theo lối phiên âm Kinh Thánh quen thuộc.
