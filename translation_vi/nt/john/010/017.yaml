source:
  edition: SBLGNT
  text: διὰ τοῦτό ⸂με ὁ πατὴρ⸃ ἀγαπᾷ ὅτι ἐγὼ τίθημι τὴν ψυχήν μου, ἵνα πάλιν λάβω αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/017.yaml
  text: For this reason the Father loves me[a], because I lay down my life so that I may take it up again.
translation:
  language: vi
  text: Vì điều này, Cha yêu tôi, vì tôi phó mạng sống mình để tôi có thể lấy lại mạng sống ấy.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch là “linh hồn tôi.” Ở đây, ψυχή tự nhiên nhất có nghĩa là “mạng sống”: mạng sống Chúa Giê-su phó đi khi chịu chết và lấy lại.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Vì lý do này
  rationale: Diễn đạt tự nhiên quan hệ nguyên nhân, đồng thời giữ liên kết với lời giải thích theo sau.
- source_word: με ὁ πατὴρ ἀγαπᾷ
  choice: Cha yêu tôi
  rationale: Giữ chủ thể xác định ὁ πατήρ và quan hệ chủ thể–đối tượng; trong ngữ cảnh lời Chúa Giê-su, “Cha” là cách gọi tự nhiên, trang trọng.
- source_word: ὅτι
  choice: vì
  rationale: Ở đây ὅτι nêu nguyên do, không chỉ nội dung.
- source_word: τίθημι τὴν ψυχήν μου
  choice: tôi hy sinh mạng sống mình
  rationale: Trong ngữ cảnh này, cụm từ chỉ hành động tự nguyện phó mạng sống; “hy sinh mạng sống” tự nhiên hơn lối dịch từng chữ “đặt xuống mạng sống” trong tiếng Việt.
- source_word: ἵνα
  choice: để rồi
  rationale: Giữ sắc thái mục đích nhưng không áp đặt cách phân biệt quá cứng giữa mục đích và kết quả.
- source_word: πάλιν λάβω αὐτήν
  choice: nhận lại mạng sống ấy
  rationale: λάμβανω có thể là nhận hoặc lấy; “nhận lại” giữ được độ mở từ vựng và πάλιν, đồng thời rõ nghĩa khi đối tượng là mạng sống.
theological_decisions:
- issue: Nghĩa của ψυχή trong lời nói về sự chết của Chúa Giê-su
  choice: mạng sống
  alternative: linh hồn
  rationale: Ngữ cảnh nói đến mạng sống được tự nguyện phó đi trong sự chết rồi được nhận lại; “linh hồn” dễ đưa vào câu một đối lập thân thể–linh hồn mà bản văn không nhấn mạnh.
- issue: Sắc thái của ἵνα với λάβω
  choice: để rồi nhận lại
  alternative: để có thể nhận lại; hầu nhận lại
  rationale: Cách dịch giữ quan hệ mục đích được ἵνα biểu thị, nhưng không biến thức giả định Hy Lạp thành ý nghĩa bất định không cần thiết trong tiếng Việt.
- issue: Quan hệ giữa tình yêu của Cha và việc Chúa Giê-su hy sinh mạng sống
  choice: giữ nguyên cấu trúc nêu lý do bằng “vì”
  alternative: diễn giải thành tình yêu có điều kiện hoặc tình yêu chỉ phát sinh sau hành động
  rationale: Bản dịch không giải quyết thêm câu hỏi thần học về bản chất hay thời điểm của tình yêu; chỉ giữ mệnh đề nguyên nhân như bản Hy Lạp.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “hy sinh mạng sống” thay cho lối dịch sát chữ thiếu tự nhiên; dấu hai chấm làm rõ rằng mệnh đề sau giải thích “lý do này”.
