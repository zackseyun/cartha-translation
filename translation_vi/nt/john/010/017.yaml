  - severity: medium
    issue: “để rồi” chưa giữ rõ lực mục đích của ἵνα.
    rationale: Cụm này thường gợi trình tự hoặc kết quả tiếp diễn trong tiếng Việt. “để tôi có thể” biểu đạt tự nhiên mệnh đề mục đích với động từ ở dạng giả định mà không áp đặt một giải thích thần học.
  - severity: low
