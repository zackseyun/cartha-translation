revisions:
- from: Rồi Đức Chúa Jêsus lại đi sang bên kia sông Giô-đanh, đến nơi trước kia Giăng đã làm phép báp-têm, và Ngài ở lại đó.
  to: Rồi Đức Chúa Giê-su lại đi sang bên kia sông Giô-đanh, đến nơi trước kia Giăng đang làm phép báp têm, rồi ở lại đó.
  rationale: 'Sửa nhẹ để cập nhật chính tả, làm rõ tính tiếp diễn của hoạt động báp têm trước đây của Giăng, và vẫn giữ cấu trúc cùng ý nghĩa của câu Hy Lạp. Không cần chú thích: «sang bên kia sông Giô-đanh» đã diễn đạt rõ πέραν τοῦ Ἰορδάνου; phương án «bên kia/beyond» không tạo ra khác biệt nghĩa cần chú thích trong câu tiếng Việt này.'
