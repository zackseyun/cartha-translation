    rationale: Dạng «Giê-su» và cách viết không gạch nối phù hợp hơn với mục tiêu ngôn ngữ hiện đại, mà không thay đổi danh tính hay thuật ngữ.
  - severity: low
    issue: «Giăng đã làm phép báp-têm» chưa phản ánh rõ hoạt động kéo dài của βαπτίζων.
    rationale: Phân từ hiện tại mô tả Giăng đang thi hành phép báp têm trong giai đoạn trước đó. «Giăng đang làm phép báp têm» dưới sự chi phối của «trước kia» bảo toàn sắc thái này một cách tự nhiên.
