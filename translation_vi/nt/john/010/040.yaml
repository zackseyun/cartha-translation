source:
  edition: SBLGNT
  text: Καὶ ἀπῆλθεν πάλιν πέραν τοῦ Ἰορδάνου εἰς τὸν τόπον ὅπου ἦν Ἰωάννης τὸ πρῶτον βαπτίζων, καὶ ἔμεινεν ἐκεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/040.yaml
  text: And he went away again across the Jordan to the place where John had first been baptizing[a], and he stayed there.
translation:
  language: vi
  text: Rồi Đức Chúa Giê-su lại đi sang bên kia sông Giô-đanh, đến nơi trước kia Giăng đang làm phép báp têm, rồi ở lại đó.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπῆλθεν
  choice: đi
  rationale: Động từ ἀπέρχομαι chỉ việc rời địa điểm hiện tại; trong mạch văn, “đi” kết hợp với đích đến diễn đạt tự nhiên, không cần thêm từ nặng nghĩa.
- source_word: πάλιν
  choice: lại
  rationale: Diễn đạt trực tiếp hành động được lặp lại.
- source_word: πέραν τοῦ Ἰορδάνου
  choice: sang bên kia sông Giô-đanh
  rationale: πέραν với sở hữu cách chỉ phía bên kia của một ranh giới; “sang bên kia sông” vừa thể hiện chuyển động theo văn cảnh vừa tự nhiên trong tiếng Việt.
- source_word: εἰς τὸν τόπον
  choice: đến nơi
  rationale: εἰς đánh dấu đích của chuyển động; “đến nơi” là cách diễn đạt tiếng Việt gọn và tự nhiên.
- source_word: ὅπου ἦν Ἰωάννης τὸ πρῶτον βαπτίζων
  choice: nơi trước kia Giăng đã làm phép báp-têm
  rationale: Cụm này nhắc đến địa điểm hoạt động trước đó của Giăng. “Trước kia” thể hiện τὸ πρῶτον, còn “đã làm phép báp-têm” truyền đạt hoạt động trong quá khứ mà không làm câu tiếng Việt rườm rà.
- source_word: ἔμεινεν ἐκεῖ
  choice: ở lại đó
  rationale: μέ­νω ở đây có nghĩa lưu lại; “ở lại đó” là cách nói hiện đại và sát nghĩa.
theological_decisions:
- issue: Chủ ngữ ẩn của ἀπῆλθεν
  choice: Đức Chúa Jêsus
  alternative: Ngài
  rationale: Tiếng Hy Lạp chỉ dùng chủ ngữ hàm ẩn, nhưng văn cảnh xác định là Đức Chúa Jêsus. Nêu danh xưng giúp câu đứng riêng rõ nghĩa mà không thêm diễn giải thần học.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng các tên quen thuộc “Đức Chúa Jêsus,” “Giăng,” “Giô-đanh” và thuật ngữ truyền thống “làm phép báp-têm.” Không đặt chú thích vì cách dịch “sang bên kia sông Giô-đanh” thể hiện trực tiếp nghĩa địa lý của πέραν τοῦ Ἰορδάνου; chú thích tiếng Anh được cung cấp dường như không tạo ra một phương án nghĩa khác thực chất cho bản Việt.
