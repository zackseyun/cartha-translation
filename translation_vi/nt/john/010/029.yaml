  source_fidelity: Bản dịch chính phản ánh hợp lý cách hiểu theo ngữ cảnh về các chiên được Cha ban cho Đức Chúa Giê-su, đồng thời chú thích giữ lại cách đọc/cú pháp trung tính số ít khó của ὃ δέδωκέν μοι. “Lớn hơn tất cả” bảo toàn phạm vi rộng của πάντων, và “không ai có thể” dịch đúng οὐδεὶς δύναται.
  naturalness: Cấu trúc câu và lối xưng hô “Cha tôi” tự nhiên, trang trọng trong tiếng Việt hiện đại. Tuy nhiên, “giật họ khỏi tay Cha” hơi khẩu ngữ và kém hợp với sắc thái cưỡng đoạt của ἁρπάζειν trong văn cảnh bảo vệ chiên; “cướp họ khỏi tay Cha” tự nhiên hơn trong văn phong Kinh Thánh hiện đại.
  terminology: “Cha tôi,” “Đấng đã ban họ cho tôi,” “lớn hơn tất cả,” và “tay Cha” đều nhất quán với ngữ cảnh và không áp đặt diễn giải giáo phái. Giữ đại từ “họ” trong bản chính là cách làm rõ quy chiếu ngữ cảnh; chú thích đã minh bạch hóa cách hiểu thay thế là “điều [Ngài] đã ban.”
