id: JHN.10.29
reference: John 10:29
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ πατήρ μου ⸀ὃ δέδωκέν ⸀μοι ⸂πάντων μεῖζων⸃ ἐστίν, καὶ οὐδεὶς δύναται ἁρπάζειν ἐκ τῆς χειρὸς τοῦ ⸀πατρός.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/029.yaml
  text: My Father[a], who has given them to me, is greater than all, and no one is able to snatch them out of the Father's hand.
translation:
  language: vi
  text: Cha tôi[a], Đấng đã ban họ cho tôi, lớn hơn tất cả; và không ai có thể cướp họ khỏi tay Cha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc, sát chữ hơn: “Cha tôi, điều Ngài đã ban cho tôi, lớn hơn tất cả.” Cách diễn đạt Hy Lạp ở đây khó hiểu; một số người cho rằng chính điều được ban, chứ không phải những người được ban, là chủ thể của sự so sánh.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ πατήρ μου
  choice: Cha tôi
  rationale: Cách diễn đạt tự nhiên, trang trọng trong tiếng Việt, giữ nguyên mối quan hệ Cha–Con mà không thêm lời giải thích.
- source_word: ὃ δέδωκέν μοι
  choice: Đấng đã ban họ cho tôi
  rationale: Đại từ trung tính số ít ὃ tạo khó khăn về văn bản và cú pháp; theo ngữ cảnh các con chiên ở câu 27–28, bản dịch hiểu mệnh đề này quy về Cha là Đấng ban họ cho Đức Chúa Giê-su. “Đã ban” diễn đạt thì hoàn thành, còn “họ” làm rõ đối tượng chỉ người trong tiếng Việt. Cách hiểu sát hình thức hơn được giữ trong chú thích.
- source_word: πάντων μεῖζων
  choice: lớn hơn tất cả
  rationale: Giữ phạm vi so sánh rộng của πάντων, không tự ý giới hạn thành mọi người hay mọi vật.
- source_word: οὐδεὶς δύναται
  choice: không ai có thể
  rationale: Diễn đạt tự nhiên trong tiếng Việt và giữ rõ ý về khả năng trong δύναται.
- source_word: ἁρπάζειν
  choice: giật
  rationale: Truyền đạt hành động cưỡng đoạt đột ngột và phù hợp với hình ảnh ngay trong câu 28; đại từ “họ” được thêm theo ngữ cảnh tiếng Việt.
- source_word: ἐκ τῆς χειρὸς τοῦ πατρός
  choice: khỏi tay Cha
  rationale: “Khỏi” phản ánh hướng tách ra của ἐκ; “tay” giữ nguyên ẩn dụ về sự nắm giữ, che chở và quyền năng.
theological_decisions:
- issue: Khó khăn văn bản và cú pháp trong ὃ δέδωκέν μοι
  choice: 'Dịch theo ngữ cảnh các con chiên: “Cha tôi, Đấng đã ban họ cho tôi”'
  alternative: '“Điều Cha tôi đã ban cho tôi lớn hơn tất cả” hoặc sát hình thức hơn: “Cha tôi, điều Ngài đã ban cho tôi, lớn hơn tất cả”'
  rationale: Bản Hy Lạp in có đại từ quan hệ trung tính số ít và cấu trúc khó; các thủ bản cũng có dị biệt. Ngữ cảnh nói về các con chiên được Cha ban cho Con và không bị giật khỏi tay Ngài, nên bản chính dùng cách hiểu chỉ người nhưng ghi lại cách hiểu xem chính món quà là chủ thể so sánh.
- issue: Phạm vi so sánh của πάντων μεῖζων
  choice: “lớn hơn tất cả”
  alternative: “lớn hơn mọi người” hoặc “lớn hơn mọi vật”
  rationale: πάντων không buộc phải chỉ riêng người hay vật. Cách dịch rộng bảo toàn sự mơ hồ và sức khẳng định của nguyên văn.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “Cha tôi” và “tay Cha” để tránh lặp nặng nề mà vẫn giữ rõ quy chiếu. Câu chính ưu tiên tính tự nhiên theo ngữ cảnh, còn chú thích bảo toàn khó khăn cú pháp và cách hiểu thay thế chính đáng.
