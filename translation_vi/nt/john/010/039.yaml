  source_fidelity: 'Bản nháp phản ánh đúng các thành tố chính: οὖν là quan hệ hệ quả, πάλιν là sự lặp lại, ἐζήτουν πιάσαι là nỗ lực bắt giữ, và thành ngữ ἐκ τῆς χειρὸς αὐτῶν được giữ lại. Tuy nhiên, “Ngài đã ra khỏi tay họ” quá sát cấu trúc Hy Lạp và không tự nhiên trong tiếng Việt; “thoát khỏi tay họ” diễn đạt đúng kết quả ngữ cảnh mà không khẳng định cách thức thoát đi.'
