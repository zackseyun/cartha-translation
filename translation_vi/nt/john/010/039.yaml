base_translation:
  language: en
  yaml_path: translation/nt/john/010/039.yaml
  text: So they were seeking again to seize him[a], but he escaped from their hand.
translation:
  language: vi
  text: Vì thế, họ lại tìm cách bắt Ngài, nhưng Ngài đã thoát khỏi tay họ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hy Lạp: “ra khỏi tay họ.” “Tay” là thành ngữ chỉ quyền lực, sự kiểm soát hoặc sự nắm giữ. Cũng có thể dịch: “lọt khỏi tay họ” hoặc “thoát khỏi sự khống chế của họ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐζήτουν
  choice: tìm cách
  rationale: Thì chưa hoàn thành diễn tả nỗ lực đang tiếp diễn hoặc chưa thành; “tìm cách” truyền đạt tự nhiên ý họ đang cố thực hiện việc bắt Ngài.
- source_word: οὖν
  choice: Vì thế
  rationale: Giữ quan hệ suy luận và diễn tiến từ cuộc đối thoại ngay trước đó.
- source_word: πάλιν
  choice: lại
  rationale: Diễn tả sự lặp lại của một ý định hoặc hành động đã xảy ra trước đó.
- source_word: πιάσαι
  choice: bắt
  rationale: Trong ngữ cảnh xung đột này, từ chỉ hành động túm giữ nhằm khống chế; “bắt” tự nhiên trong tiếng Việt và không nhất thiết áp đặt sắc thái thủ tục pháp lý của “bắt giữ”.
- source_word: ἐξῆλθεν
  choice: đã ra khỏi
  rationale: Giữ nghĩa trực tiếp “đi/ra khỏi” thay vì đổi thành một động từ minh nhiên có nghĩa “trốn thoát,” trong khi toàn cụm vẫn cho thấy họ không bắt được Ngài.
- source_word: ἐκ τῆς χειρὸς αὐτῶν
  choice: khỏi tay họ
  rationale: Bảo tồn sát thành ngữ Hy Lạp ở số ít tập hợp, nói đến quyền lực, sự kiểm soát hoặc sự nắm giữ của họ; cách nói này cũng dễ hiểu trong tiếng Việt.
theological_decisions:
- issue: Có nên nói rõ rằng Đức Chúa Jêsus “trốn thoát” hay giữ cách diễn đạt trực tiếp của bản Hy Lạp
  choice: Giữ “Ngài đã ra khỏi tay họ.”
  alternative: “Ngài đã thoát khỏi tay họ” hoặc “Ngài đã thoát khỏi sự khống chế của họ.”
  rationale: Bản Hy Lạp không dùng động từ chuyên biệt có nghĩa “trốn thoát,” mà nói Ngài “ra khỏi tay họ.” Cách dịch được chọn bảo tồn hình ảnh và không xác định phương thức Ngài thoát khỏi sự kiểm soát của họ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” để quy chiếu đến Đức Chúa Jêsus. Liên từ “nhưng” thể hiện rõ sự tương phản theo ngữ cảnh, dù tiếng Hy Lạp dùng καί, vốn thường có nghĩa cơ bản là “và.”
