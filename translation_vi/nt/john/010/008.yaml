  terminology: Giữ “chiên” là thuật ngữ nhất quán, phù hợp văn mạch Người Chăn. Giữ “kẻ trộm” và dùng “kẻ cướp” bảo toàn sự phân biệt từ vựng giữa κλέπται và λῃσταί mà không gán thêm sắc thái tập thể. “Đức Chúa Trời” và “Chúa Giê-su” phù hợp register của bản dịch.
