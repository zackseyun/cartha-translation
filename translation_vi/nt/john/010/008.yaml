  source_fidelity: 'Chính văn truyền đạt đúng các thành tố của tiếng Hy Lạp: phạm vi khái quát của πάντες ὅσοι, aorist ἦλθον, sự đối lập giữa κλέπται và λῃσταί, và ý đáp ứng/hưởng ứng trong οὐκ ἤκουσαν αὐτῶν. Tuy nhiên, “quân cướp” có sắc thái một nhóm/bè đảng và không song song tự nhiên với “kẻ trộm”; “kẻ cướp” phản ánh λῃσταί trực tiếp và nhất quán hơn. Chú thích nên sửa cách nói “đến đi trước tôi”, vốn không tự nhiên trong tiếng Việt.'
