  text: πάντες ὅσοι ἦλθον ⸂πρὸ ἐμοῦ⸃ κλέπται εἰσὶν καὶ λῃσταί· ἀλλ’ οὐκ ἤκουσαν αὐτῶν τὰ πρόβατα.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/008.yaml
  text: All who came before me are thieves and robbers[a], but the sheep did not listen to them.
translation:
  language: vi
  text: Tất cả những ai đã đến trước tôi đều là kẻ trộm và kẻ cướp[a], nhưng chiên không nghe theo họ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể hiểu là “đi trước tôi”. Cụm từ này có thể mang nghĩa thời gian (“đến trước tôi”), hoặc chỉ những kẻ đi trước và tự nhận thẩm quyền ngoài Chúa Giê-su. Văn mạch gợi đến những kẻ chăn giả, chứ không phải tất cả các đầy tớ của Đức Chúa Trời từ trước đó.
    reason: alternative_reading
lexical_decisions:
- source_word: πάντες ὅσοι
  choice: Tất cả những ai
  rationale: Cách diễn đạt tự nhiên, mang tính phân phối và giữ nguyên phạm vi khái quát của cụm từ Hy Lạp.
- source_word: ἦλθον
  choice: đã đến
  rationale: Thì aorist được chuyển bằng dạng quá khứ tự nhiên trong tiếng Việt, không thêm sắc thái kết quả còn tiếp diễn.
- source_word: πρὸ ἐμοῦ
  choice: trước tôi
  rationale: Giữ cách diễn đạt ngắn gọn và sự mơ hồ có thật giữa ý nghĩa thời gian và ý nghĩa đi trước hoặc tự đặt mình lên trước.
- source_word: κλέπται
  choice: kẻ trộm
  rationale: Từ thông dụng chỉ người lén lấy tài sản, phù hợp với hình ảnh trong văn mạch.
- source_word: λῃσταί
  choice: quân cướp
  rationale: Phân biệt với κλέπται bằng từ ngữ gợi tính công khai, bạo lực hoặc hung hãn hơn; 'quân' tạo sắc thái tập thể và lên án nhưng vẫn dễ hiểu.
- source_word: ἀλλ’
  choice: nhưng
  rationale: Liên từ tương phản đơn giản và tự nhiên trong tiếng Việt.
- source_word: οὐκ ἤκουσαν αὐτῶν
  choice: không nghe theo họ
  rationale: Với đối tượng ở sở hữu cách, ἀκούω tại đây hàm ý nghe và đáp ứng; 'nghe theo' phù hợp với hình ảnh chiên nhận biết rồi đi theo tiếng người chăn.
- source_word: τὰ πρόβατα
  choice: chiên
  rationale: Thuật ngữ quen thuộc, trang trọng trong văn cảnh người chăn chiên; tiếng Việt không bắt buộc lặp từ chỉ số nhiều.
theological_decisions:
- issue: Phạm vi và ý nghĩa của cụm 'tất cả những ai đã đến trước tôi'
  choice: 'Giữ nguyên cách nói rộng: ''Tất cả những ai đã đến trước tôi'', không thu hẹp đối tượng ngay trong chính văn.'
  alternative: Tất cả những ai đã đến trước tôi, tức những kẻ tự nhận thẩm quyền chăn dắt ngoài Chúa Giê-su.
  rationale: Cấu trúc Hy Lạp có phạm vi rộng, nhưng văn cảnh nói về những người chăn giả, nên không nhất thiết lên án mọi đầy tớ của Đức Chúa Trời sống trước Chúa Giê-su. Chú thích nêu vấn đề mà không xóa bỏ sức căng thần học của chính văn.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng 'tôi' theo lời trực tiếp của Chúa Giê-su để tự nhiên trong tiếng Việt; dùng cặp 'kẻ trộm và quân cướp' nhằm giữ sự phân biệt giữa hai danh từ Hy Lạp. Dấu chú thích [a] xuất hiện ngay sau cặp từ liên quan.
