revisions:
- from: 'Nhưng nhiều người trong số họ cứ nói: “Ông ấy có quỷ và điên rồi. Tại sao các ông còn nghe ông ấy?”'
  to: 'Nhưng nhiều người trong số họ cứ nói: “Ông ấy có quỷ và điên. Tại sao các ông nghe ông ấy?”'
  rationale: Chỉ bỏ hai tiểu từ Việt ngữ bổ sung sắc thái thời/thể không có trong bản SBLGNT. Giữ “cứ nói” để biểu đạt cách an toàn sắc thái chưa hoàn thành của ἔλεγον, đồng thời giữ lối dịch trực tiếp “có quỷ”. Không cần chú thích vì bản văn chính đã chọn cách dịch sát nguồn và không có vấn đề văn bản cần ghi chú.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T06:23:21Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp phản ánh đúng phần lớn câu Hy Lạp: δὲ là tương phản, πολλοὶ ἐξ αὐτῶν là một bộ phận trong nhóm, và Δαιμόνιον ἔχει được dịch trực tiếp là “có quỷ”. Tuy nhiên, “rồi” trong “điên rồi” thêm sắc thái đã xảy ra/đã chuyển trạng thái mà thì hiện tại μαίνεται không biểu thị. “Còn” trong câu hỏi cũng thêm ý ‘vẫn còn’ không có trong nguyên văn.'
  naturalness: “Nhiều người trong số họ cứ nói” tự nhiên và truyền được sắc thái chưa hoàn thành lặp lại/tiếp diễn của ἔλεγον. Sau khi bỏ các tiểu từ thêm nghĩa, lời thoại vẫn hiện đại, rõ ràng, và phù hợp với tính chất lời công kích của nhân vật.
  terminology: “Có quỷ” là cách dịch sát và không xác nhận lời vu cáo là thật. “Điên” phản ánh μαίνεται trong ngữ cảnh này; đây là lời kết án của những người đối nghịch, không phải một chẩn đoán của người kể. Đại từ “ông ấy/các ông” giữ khoảng cách không tôn kính vốn thuộc lời nói được trích dẫn.
  issues:
  - severity: medium
    issue: “điên rồi” thêm “rồi”
    rationale: μαίνεται là hiện tại (‘đang/ là điên, mất trí’) và không mang ý ‘đã trở nên’ hoặc ‘đã xảy ra rồi’.
  - severity: low
    issue: “còn” trong “Tại sao các ông còn nghe ông ấy?” thêm ý tiếp diễn
    rationale: τί αὐτοῦ ἀκούετε; hỏi trực tiếp ‘Tại sao các ông nghe ông ấy?’. Dù ‘còn’ có thể hợp ngữ cảnh, nó thêm ý ‘vẫn tiếp tục’ không được nêu trong tiếng Hy Lạp.
  revised_text: 'Nhưng nhiều người trong số họ cứ nói: “Ông ấy có quỷ và điên. Tại sao các ông nghe ông ấy?”'
