  text: ἔλεγον δὲ πολλοὶ ἐξ αὐτῶν· Δαιμόνιον ἔχει καὶ μαίνεται· τί αὐτοῦ ἀκούετε;
base_translation:
  language: en
  yaml_path: translation/nt/john/010/020.yaml
  text: But many of them were saying[a], “He has a demon and is insane. Why do you listen to him?”
translation:
  language: vi
  text: 'Nhưng nhiều người trong số họ cứ nói: “Ông ấy có quỷ và điên. Tại sao các ông nghe ông ấy?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγον
  choice: cứ nói
  rationale: Thì chưa hoàn thành diễn tả lời nói đang tiếp diễn hoặc được lặp lại trong cảnh; “cứ nói” chuyển tải sắc thái ấy tự nhiên trong tiếng Việt.
- source_word: δὲ
  choice: Nhưng
  rationale: Liên từ đánh dấu sự tương phản với phản ứng tích cực ở văn cảnh kế cận.
- source_word: πολλοὶ ἐξ αὐτῶν
  choice: nhiều người trong số họ
  rationale: Giữ rõ cấu trúc chỉ một bộ phận thuộc nhóm người đã được nhắc đến.
- source_word: Δαιμόνιον ἔχει
  choice: Ông ấy có quỷ
  rationale: Bám sát cách diễn đạt trực tiếp của tiếng Hy Lạp, không diễn giải thành một mô tả thần học cụ thể hơn như “bị quỷ ám”.
- source_word: μαίνεται
  choice: điên rồi
  rationale: Diễn đạt tự nhiên lời cáo buộc rằng người ấy mất trí; “rồi” phù hợp sắc thái khẩu ngữ của lời công kích mà không biến nó thành chẩn đoán lâm sàng.
- source_word: τί αὐτοῦ ἀκούετε;
  choice: Tại sao các ông còn nghe ông ấy?
  rationale: τί mang nghĩa “tại sao” trong ngữ cảnh; ἀκούω với đối tượng ở sở hữu cách phù hợp với nghĩa “nghe/nghe theo”. Từ “còn” làm rõ lực chất vấn trong tiếng Việt mà không thay đổi nội dung.
theological_decisions:
- issue: Cách dịch lời cáo buộc thù nghịch về tình trạng của Chúa Giê-su
  choice: Ông ấy có quỷ và điên rồi
  alternative: Ông ấy bị quỷ ám và mất trí
  rationale: Bản dịch giữ nguyên hai lời vu cáo trong hình thức trực tiếp, không làm nhẹ đi và cũng không xác nhận chúng là sự thật. “Có quỷ” gần với cấu trúc Hy Lạp hơn “bị quỷ ám”, nhờ đó tránh áp đặt một mức độ chiếm hữu cụ thể.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Đại từ “ông ấy/các ông” phản ánh lời nói của những người trong cảnh mà không thêm sắc thái tôn kính của người kể. Không cần chú thích vì phương án sát nguồn “có quỷ” đã được giữ ngay trong chính văn.
