  text: Διὰ τί τοῦτο τὸ μύρον οὐκ ἐπράθη τριακοσίων δηναρίων καὶ ἐδόθη πτωχοῖς;
base_translation:
  language: en
  yaml_path: translation/nt/john/012/005.yaml
  text: Why was this perfume not sold for three hundred denarii and given to the poor?[a]
translation:
  language: vi
  text: “Sao không bán dầu thơm này lấy ba trăm đê-na-ri rồi đem cho người nghèo?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Một đê-na-ri là tiền công thông thường cho một ngày lao động; ba trăm đê-na-ri xấp xỉ thu nhập của một năm nếu trừ những ngày không làm việc.
    reason: cultural_note
lexical_decisions:
- source_word: Διὰ τί
  choice: Sao không
  rationale: Trong câu hỏi phủ định này, “Sao không” là cách nói tự nhiên trong tiếng Việt hiện đại, truyền đạt đúng sắc thái chất vấn “vì sao đã không làm như vậy?”
- source_word: μύρον
  choice: dầu thơm
  rationale: Chỉ chất thơm đắt tiền dùng để xức; “dầu thơm” tự nhiên trong ngữ cảnh cổ đại và không gợi loại nước hoa hiện đại một cách quá hẹp.
- source_word: οὐκ ἐπράθη
  choice: không bán
  rationale: Động từ Hy Lạp ở thể bị động, nghĩa đen là “đã không được bán”; tiếng Việt thường dùng cấu trúc chủ động không nêu tác nhân trong câu hỏi này để diễn đạt tự nhiên mà vẫn giữ nguyên ý.
- source_word: τριακοσίων δηναρίων
  choice: lấy ba trăm đê-na-ri
  rationale: Sở hữu cách biểu thị giá bán. Giữ đơn vị tiền cổ trong chính văn, còn giá trị tương đối được giải thích ở chú thích.
- source_word: καὶ ἐδόθη
  choice: rồi đem cho
  rationale: 'Diễn đạt tự nhiên chuỗi hành động dự kiến: bán dầu thơm rồi lấy số tiền ấy cho người nghèo. “Cho” phản ánh trực tiếp δίδωμι mà không thêm ý phân phát có tổ chức.'
- source_word: πτωχοῖς
  choice: người nghèo
  rationale: Cách gọi tự nhiên, trang trọng vừa phải cho tính từ số nhiều được dùng như danh từ, chỉ những người nghèo.
theological_decisions: []
translation_notes:
  register: Bản dịch dùng tiếng Việt hiện đại, sáng rõ và trang trọng vừa phải. Câu hỏi có sắc thái trách cứ được giữ bằng cấu trúc “Sao không…?”. Đơn vị tiền cổ được phiên âm là “đê-na-ri” và giải thích trong chú thích.
