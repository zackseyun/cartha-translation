source:
  edition: SBLGNT
  text: εἶπεν δὲ τοῦτο οὐχ ὅτι περὶ τῶν πτωχῶν ἔμελεν αὐτῷ, ἀλλ’ ὅτι κλέπτης ἦν καὶ τὸ γλωσσόκομον ⸀ἔχων τὰ βαλλόμενα ἐβάσταζεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/006.yaml
  text: He said this not because he cared about the poor[a], but because he was a thief, and having the money box[b], he used to take what was put into it.
translation:
  language: vi
  text: Ông nói điều này không phải vì ông quan tâm đến người nghèo, nhưng vì ông là kẻ trộm; ông giữ hộp tiền[a] và thường lấy[b] những gì người ta bỏ vào đó.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “túi tiền”. Từ Hy Lạp chỉ một vật chứa dùng để đựng tiền.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “mang đi” hoặc “thường ăn trộm”. Động từ này thường có nghĩa là “mang” hoặc “vác”, nhưng trong ngữ cảnh này—“ông là kẻ trộm”—nó hàm ý chiếm dụng những gì được bỏ vào hộp tiền.
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπεν δὲ τοῦτο
  choice: Ông nói điều này
  rationale: Dịch trực tiếp động từ và đại từ chỉ định; δέ chỉ nối nhẹ với mạch văn nên không cần thêm một từ nối dễ làm đậm sắc thái tương phản.
- source_word: οὐχ ὅτι περὶ τῶν πτωχῶν ἔμελεν αὐτῷ
  choice: không phải vì quan tâm đến người nghèo
  rationale: Kết cấu οὐχ ὅτι nêu động cơ bị phủ nhận; μέλει với περί diễn tả sự quan tâm đến ai.
- source_word: ἀλλ’ ὅτι κλέπτης ἦν
  choice: nhưng vì ông là kẻ trộm
  rationale: Giữ rõ thế đối xứng giữa động cơ bị phủ nhận và lý do thật; κλέπτης là người lén lấy đồ của người khác, phù hợp với “kẻ trộm” hơn “kẻ cướp”.
- source_word: τὸ γλωσσόκομον ἔχων
  choice: ông giữ hộp tiền
  rationale: Phân từ ἔχων diễn tả việc Giu-đa có hộp tiền trong tay hoặc thuộc quyền quản lý; “giữ” tự nhiên trong tiếng Việt mà không thêm chức danh không có trong nguyên văn.
- source_word: τὰ βαλλόμενα
  choice: những gì người ta bỏ vào đó
  rationale: Phân từ bị động được diễn đạt tự nhiên bằng chủ thể phiếm chỉ “người ta”; “vào đó” làm rõ đích đến vốn hiển nhiên từ hộp tiền.
- source_word: ἐβάσταζεν
  choice: thường lấy
  rationale: Thể vị hoàn biểu thị hành động lặp lại hoặc kéo dài. βαστάζω thường có nghĩa “mang, giữ”, nhưng trong ngữ cảnh tác giả vừa gọi Giu-đa là kẻ trộm, từ này hàm ý lấy đi hoặc chiếm dụng.
theological_decisions:
- issue: Ý nghĩa của ἐβάσταζεν trong lời tố cáo Giu-đa
  choice: thường lấy
  alternative: thường mang/giữ
  rationale: Ngữ cảnh “ông là kẻ trộm” nghiêng mạnh về hành vi chiếm dụng, nhưng “lấy” vẫn bảo lưu phần nào độ rộng nghĩa của động từ thay vì trực tiếp lặp lại “ăn trộm”.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “ông” để nối tự nhiên với nhân vật Giu-đa trong văn cảnh, không dùng đại từ miệt thị. Dấu chấm phẩy giúp giữ quan hệ chặt giữa lời giải thích về động cơ và hành vi lấy tiền.
