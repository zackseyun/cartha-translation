  - severity: low
    issue: Chú thích hiện hữu không còn là một phương án thay thế rõ rệt nếu dùng bản văn sửa
    rationale: Với bản văn sửa, câu chú thích cũ lặp lại gần như nguyên văn phần chính. Nên thay bằng phương án từ vựng thực sự cho ὥρα, đồng thời giữ giải thích ngắn về mô-típ ‘giờ’ trong Giăng.
