source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς ⸀ἀποκρίνεται αὐτοῖς λέγων· Ἐλήλυθεν ἡ ὥρα ἵνα δοξασθῇ ὁ υἱὸς τοῦ ἀνθρώπου.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/023.yaml
  text: But Jesus answered them[a], saying[b], “The hour has come for the Son of Man to be glorified.”
translation:
  language: vi
  text: 'Nhưng Đức Chúa Jêsus đáp lời họ rằng: “Giờ[a] đã đến để Con Người được tôn vinh.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “Thời điểm đã đến để Con Người được tôn vinh.” Tiếng Hy Lạp dùng “giờ”, một từ lặp lại trong sách Giăng để chỉ thời điểm đã được định cho sự chịu khổ và vinh quang của Đức Chúa Jêsus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκρίνεται αὐτοῖς λέγων
  choice: đáp lời họ
  rationale: Cụm này tự nhiên trong tiếng Việt khi giới thiệu lời nói trực tiếp; lược cách dịch riêng phân từ λέγων để tránh câu rườm rà mà không làm mất nội dung.
- source_word: Ἐλήλυθεν
  choice: đã đến
  rationale: Thì hoàn thành diễn tả giờ ấy đã đến và hiện đang có hiệu lực; “đã đến” truyền đạt tự nhiên cả sự kiện lẫn kết quả hiện tại.
- source_word: ἡ ὥρα
  choice: Giờ
  rationale: Giữ hình ảnh “giờ” vốn lặp lại và mang sức nặng thần học trong sách Giăng, thay vì khái quát hóa thành “thời điểm”.
- source_word: ἵνα δοξασθῇ
  choice: được tôn vinh
  rationale: Giữ thể bị động và diễn đạt mục đích/nội dung của giờ đã đến; “tôn vinh” tự nhiên, trang trọng và bảo toàn chiều kích vinh quang trong động từ δοξάζω.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Con Người
  rationale: Giữ danh hiệu quen thuộc của Đức Chúa Jêsus và âm hưởng Đa-ni-ên 7, không giản lược thành một cách gọi chung về con người.
theological_decisions:
- issue: Ý nghĩa của “giờ” và mối liên hệ cú pháp với việc được tôn vinh
  choice: “Giờ Con Người được tôn vinh đã đến”
  alternative: “Giờ đã đến để Con Người được tôn vinh”
  rationale: Cách chọn tự nhiên trong tiếng Việt, đồng thời giữ “giờ” là thời điểm được ấn định cho sự tôn vinh. Không giải thích thêm rằng sự tôn vinh bao gồm thập tự giá, phục sinh và thăng cao, để câu vẫn giữ độ hàm súc của bản gốc.
- issue: Danh hiệu ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Con Người
  alternative: Đấng Làm Người
  rationale: “Con Người” bảo toàn danh hiệu mang tính Cơ Đốc học và liên văn bản; phương án thay thế dễ diễn giải danh hiệu thành một nhận định về nhân tính.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Jêsus” theo lối gọi Tin Lành tiếng Việt; giữ danh hiệu “Con Người” và mô-típ “giờ”. Dấu chú thích [a] được đặt ngay sau mệnh đề liên quan.
