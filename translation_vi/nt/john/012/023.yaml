  verdict: revise
  source_fidelity: 'Bản nháp truyền đạt đúng các yếu tố chính: Đức Chúa Jêsus đáp lời những người ấy, ‘giờ’ đã đến, danh hiệu ‘Con Người,’ và thể bị động ‘được tôn vinh.’ Tuy nhiên, trật tự “Giờ Con Người được tôn vinh đã đến” khiến mệnh đề bổ nghĩa cho “giờ” trở nên dễ bị hiểu như một cấu trúc quan hệ; cách “Giờ đã đến để Con Người được tôn vinh” phản ánh rõ hơn liên hệ ἵνα + subjunctive trong tiếng Hy Lạp.'
