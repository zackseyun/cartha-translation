revisions:
- from: Vì vậy, một đoàn người đông đảo trong số những người Do Thái[a] biết Ngài đang ở đó. Họ đến không chỉ vì Chúa Giê-su mà còn để thấy La-xa-rơ, người Ngài đã khiến sống lại từ cõi chết.
  to: Vì vậy, một đám đông lớn gồm những người Do Thái[a] biết được rằng Giê-su đang ở đó. Họ đến không chỉ vì Giê-su mà còn để thấy La-xa-rơ, người mà Ngài đã khiến sống lại từ cõi chết.
  rationale: Sửa “biết” thành “biết được” để biểu đạt việc đám đông nhận tin; thay cụm danh từ bằng cách nói tiếng Việt tự nhiên hơn nhưng vẫn giữ ý ἐκ; bỏ danh xưng “Chúa” khi dịch tên Giê-su để không thêm nội dung không có trong câu; và thêm “mà” trong mệnh đề quan hệ. Chú thích được giữ, chỉ điều chỉnh nhẹ cách gọi phương án địa lý cho gọn và tự nhiên.
