id: JHN.12.9
reference: John 12:9
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἔγνω ⸀οὖν ὄχλος πολὺς ἐκ τῶν Ἰουδαίων ὅτι ἐκεῖ ἐστιν, καὶ ἦλθον οὐ διὰ τὸν Ἰησοῦν μόνον, ἀλλ’ ἵνα καὶ τὸν Λάζαρον ἴδωσιν ὃν ἤγειρεν ἐκ νεκρῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/009.yaml
  text: So a large crowd of the Jews learned that he was there[a], and they came not only because of Jesus, but also so that they might see Lazarus, whom he had raised from the dead.
translation:
  language: vi
  text: Vì vậy, một đám đông lớn gồm những người Do Thái[a] biết được rằng Giê-su đang ở đó. Họ đến không chỉ vì Giê-su mà còn để thấy La-xa-rơ, người mà Ngài đã khiến sống lại từ cõi chết.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “người Giu-đê.” Từ Hy Lạp này có thể chỉ người Do Thái nói chung hoặc, trong một số ngữ cảnh của sách Giăng, chỉ người thuộc miền Giu-đê.
    reason: Giữ lại phạm vi nghĩa có thể là dân tộc–tôn giáo hoặc địa lý của Ἰουδαίων.
lexical_decisions:
- source_word: Ἔγνω
  choice: biết
  rationale: Động từ ở thì aorist diễn tả việc đám đông nhận được tin. Trong tiếng Việt, “biết” sau mạch kể tự nhiên đã hàm ý họ biết được sự việc, không chỉ trạng thái sở hữu kiến thức.
- source_word: οὖν
  choice: Vì vậy
  rationale: Giữ quan hệ tiếp nối hoặc hệ quả với ngữ cảnh trước, đồng thời phù hợp với văn kể trang trọng, hiện đại.
- source_word: ὄχλος πολὺς ἐκ τῶν Ἰουδαίων
  choice: một đoàn người đông đảo trong số những người Do Thái
  rationale: “Đoàn người đông đảo” truyền đạt danh từ tập hợp ὄχλος và mức độ của πολὺς; “trong số” phản ánh ἐκ và tránh hàm ý rằng toàn thể người Do Thái đều có mặt.
- source_word: ὅτι ἐκεῖ ἐστιν
  choice: Ngài đang ở đó
  rationale: Giữ thể hiện tại của ἐστιν bằng “đang ở” theo lối gián tiếp tự nhiên trong tiếng Việt. Đại từ “Ngài” chỉ Chúa Giê-su theo ngữ cảnh mà không chèn tên vào vị trí nguyên văn dùng chủ ngữ ngầm.
- source_word: ἦλθον
  choice: Họ đến
  rationale: Cách diễn đạt trực tiếp và tự nhiên của động từ chỉ chuyển động trong bối cảnh này.
- source_word: οὐ διὰ τὸν Ἰησοῦν μόνον
  choice: không chỉ vì Chúa Giê-su
  rationale: διά với đối cách chỉ nguyên nhân hoặc động cơ; “vì” truyền đạt ý này gọn và tự nhiên.
- source_word: ἀλλ’ ἵνα καὶ ... ἴδωσιν
  choice: mà còn để thấy
  rationale: Giữ cả cấu trúc tương phản “không chỉ... mà còn” và ý mục đích của ἵνα với động từ giả định.
- source_word: Λάζαρον
  choice: La-xa-rơ
  rationale: Phiên âm tên riêng theo cách đọc quen thuộc, rõ ràng trong tiếng Việt.
- source_word: ὃν ἤγειρεν ἐκ νεκρῶν
  choice: người Ngài đã khiến sống lại từ cõi chết
  rationale: “Đã” làm rõ hành động xảy ra trước lúc đám đông đến; “khiến sống lại từ cõi chết” diễn đạt đúng việc phục hồi La-xa-rơ về sự sống mà không mở rộng thêm ý nghĩa thần học.
theological_decisions:
- issue: Phạm vi nghĩa của Ἰουδαίων trong sách Giăng
  choice: những người Do Thái
  alternative: những người Giu-đê
  rationale: Trong ngữ cảnh lễ hội và công chúng này, từ có thể chỉ người Do Thái nói chung, nhưng trong sách Giăng đôi khi cũng mang nghĩa địa lý là người Giu-đê. Bản chính dùng nghĩa dân tộc–tôn giáo quen thuộc, còn chú thích giữ lại khả năng địa lý và tránh biến nhóm người được nói đến thành toàn thể dân Do Thái.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Chúa Giê-su” và đại từ tôn kính “Ngài” theo ngữ cảnh Cơ Đốc phổ thông; cấu trúc câu tránh lối dịch quá sát gây nặng nề nhưng vẫn giữ quan hệ logic, mục đích và trình tự thời gian của nguyên văn.
