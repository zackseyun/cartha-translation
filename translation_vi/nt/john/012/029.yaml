  terminology: “Thiên sứ” và đại từ kính ngữ “Ngài” phù hợp văn phong Kinh Thánh Việt ngữ trang trọng. Chú thích “sứ giả” ghi nhận nghĩa từ vựng rộng hơn của ἄγγελος, dù nghĩa “thiên sứ” là phù hợp nhất trong văn cảnh.
