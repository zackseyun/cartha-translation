  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ οὖν ὄχλος ὁ ἑστὼς καὶ ἀκούσας ἔλεγεν βροντὴν γεγονέναι· ἄλλοι ἔλεγον· Ἄγγελος αὐτῷ λελάληκεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/029.yaml
  text: So the crowd that was standing there and had heard it was saying that thunder had happened; others were saying[a], “An angel has spoken to him.”
translation:
  language: vi
  text: 'Vì vậy, đám đông đứng đó, sau khi nghe tiếng ấy, nói rằng đã có tiếng sấm; những người khác lại nói: “Một thiên sứ[a] đã nói với Ngài.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Thiên sứ” cũng có thể dịch là “sứ giả.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Vì vậy
  rationale: Giữ lực liên kết và suy dẫn từ tiếng phán ở câu trước, đồng thời vẫn tự nhiên trong văn kể hiện đại.
- source_word: ὁ ἑστὼς
  choice: đang đứng tại đó
  rationale: Diễn đạt phân từ hoàn thành dùng như tính ngữ, mô tả tư thế và vị trí hiện tại của đám đông.
- source_word: ἀκούσας
  choice: sau khi nghe tiếng ấy
  rationale: Thể hiện hành động nghe xảy ra trước động từ chính; “tiếng ấy” được bổ sung theo ngữ cảnh của tiếng phán vừa được nhắc đến.
- source_word: ἔλεγεν
  choice: thì nói rằng
  rationale: Giữ ý của thì chưa hoàn thành về lời nhận xét đang diễn ra; tiếng Việt không cần thêm từ chỉ tiếp diễn một cách nặng nề.
- source_word: βροντὴν γεγονέναι
  choice: đã có tiếng sấm
  rationale: Vừa sát cấu trúc ‘tiếng sấm đã xảy ra/đã có’ vừa tự nhiên hơn trong tiếng Việt, không biến lời đám đông thành một lời giải thích vượt quá bản văn.
- source_word: ἄλλοι
  choice: những người khác
  rationale: Chỉ nhóm thứ hai đối lập với nhóm người trong đám đông vừa đưa ra nhận định trước.
- source_word: Ἄγγελος
  choice: một thiên sứ
  rationale: Trong ngữ cảnh họ đang giải thích một tiếng từ trời, từ này nhiều khả năng chỉ một hữu thể trên trời; “thiên sứ” là cách gọi trang trọng và dễ hiểu.
- source_word: αὐτῷ
  choice: với Ngài
  rationale: λαλέω với tặng cách có thể được diễn đạt tự nhiên là ‘nói với’; đại từ chỉ Chúa Giê-su, và “Ngài” phù hợp văn phong Kinh Thánh trang trọng.
- source_word: λελάληκεν
  choice: đã nói
  rationale: Tiếng Việt dùng “đã” để diễn tả hành động hoàn tất; hệ thống thì tiếng Việt không đòi hỏi một hình thức riêng tương đương hoàn thành Hy Lạp.
theological_decisions:
- issue: Bản chất của người nói từ trời theo cách hiểu của đám đông
  choice: Một thiên sứ đã nói với Ngài
  alternative: Một sứ giả đã nói với Ngài
  rationale: Ngữ cảnh khiến nghĩa ‘thiên sứ’ phù hợp hơn, nhưng chú thích vẫn ghi nhận nghĩa rộng ‘sứ giả’ của ἄγγελος mà không áp đặt thêm một giải thích giáo lý.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc được giữ gần với diễn tiến của câu Hy Lạp, nhưng dùng “đã có tiếng sấm” để tránh lối nói gượng “tiếng sấm đã xảy ra.”
