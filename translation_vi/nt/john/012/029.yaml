  source_fidelity: 'Bản dịch truyền đạt đúng hai cách giải thích của đám đông về âm thanh/tiếng phán: có tiếng sấm, hoặc một thiên sứ đã nói với Chúa Giê-su. “Đã có tiếng sấm” là cách diễn đạt tự nhiên và đủ sát βροντὴν γεγονέναι. Tuy nhiên, dấu chú thích từ vựng cho ἄγγελος nên được neo trực tiếp sau “thiên sứ”, thay vì sau toàn bộ lời trích dẫn.'
