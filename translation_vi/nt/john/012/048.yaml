  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ ἀθετῶν ἐμὲ καὶ μὴ λαμβάνων τὰ ῥήματά μου ἔχει τὸν κρίνοντα αὐτόν· ὁ λόγος ὃν ἐλάλησα ἐκεῖνος κρινεῖ αὐτὸν ἐν τῇ ἐσχάτῃ ἡμέρᾳ·
base_translation:
  language: en
  yaml_path: translation/nt/john/012/048.yaml
  text: 'The one who rejects me and does not receive my words has one who judges him: the word that I spoke will judge him on the last day[a][b].'
translation:
  language: vi
  text: 'Người nào khước từ tôi và không tiếp nhận những lời của tôi thì có một người xét xử mình: chính lời mà tôi đã nói sẽ xét xử người ấy vào ngày sau cùng[a][b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “không chấp nhận những lời của tôi.” Động từ Hy Lạp có thể mang nghĩa tiếp nhận, đón nhận hoặc chấp nhận.
    reason: lexical_alternative
  - marker: b
    text: Hay “chính sứ điệp mà tôi đã nói.” Từ Hy Lạp logos có thể có nghĩa là “lời” hoặc “sứ điệp,” tùy văn cảnh.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀθετῶν
  choice: khước từ
  rationale: Diễn đạt sự bác bỏ chính Chúa Giê-su, mạnh hơn nghĩa chỉ phớt lờ, đồng thời tự nhiên và trang trọng trong tiếng Việt hiện đại.
- source_word: μὴ λαμβάνων τὰ ῥήματά μου
  choice: không tiếp nhận những lời tôi
  rationale: “Tiếp nhận” giữ được cả ý nhận lấy lẫn đón nhận/chấp nhận sự mặc khải, phù hợp cách dùng của Giăng.
- source_word: τὰ ῥήματά μου
  choice: những lời tôi
  rationale: Số nhiều ῥήματα chỉ các lời được nói ra; “những lời” tự nhiên và sát nghĩa.
- source_word: ἔχει τὸν κρίνοντα αὐτόν
  choice: đã có Đấng xét xử mình
  rationale: Giữ cấu trúc hơi hàm súc của nguyên văn rằng người khước từ đã có một chủ thể xét xử; “Đấng” làm rõ lực danh từ hóa của phân từ mà chưa vội đồng nhất chủ thể ấy trước mệnh đề giải thích tiếp theo.
- source_word: ὁ λόγος
  choice: lời
  rationale: Giữ số ít và sức nặng gần như được nhân cách hóa của λόγος, đồng thời duy trì liên hệ với lời Chúa Giê-su đã phán.
- source_word: ὃν ἐλάλησα
  choice: tôi đã nói
  rationale: Thì quá khứ “đã nói” chuyển tải trực tiếp động từ aorist và nghe tự nhiên trong tiếng Việt.
- source_word: ἐκεῖνος
  choice: chính lời
  rationale: “Chính” thể hiện nét nhấn mạnh của đại từ chỉ định ἐκεῖνος và quy chiếu rõ về “lời” vừa nêu.
- source_word: κρινεῖ
  choice: sẽ xét xử
  rationale: Giữ nghĩa rộng của κρίνω trong bối cảnh phán xét cánh chung, không thu hẹp thành “kết án”.
- source_word: ἐν τῇ ἐσχάτῃ ἡμέρᾳ
  choice: trong ngày sau cùng
  rationale: Cách nói trang trọng, dễ hiểu, giữ nguyên thuật ngữ cánh chung đặc trưng của Giăng mà không thêm một hệ thống giáo lý cụ thể.
theological_decisions:
- issue: Chủ thể thực hiện sự xét xử trong câu
  choice: Bản dịch trình bày lời Chúa Giê-su đã nói như chủ thể hoặc phương tiện trực tiếp của sự xét xử sau cùng.
  alternative: Có thể hiểu “lời” là tiêu chuẩn xét xử, còn chính Chúa Giê-su là Đấng xét xử.
  rationale: Cú pháp trước hết nói người khước từ “có Đấng xét xử mình,” rồi xác định bằng mệnh đề sau rằng chính lời Chúa Giê-su đã nói sẽ xét xử. Bản dịch giữ nguyên sức căng này, không hòa giải với các phát biểu khác trong Giăng về vai trò xét xử của Con.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “khước từ” để thể hiện sự bác bỏ có chủ ý; giữ sự phân biệt giữa “những lời” (ῥήματα, số nhiều) và “lời” (λόγος, số ít). Các dấu chú thích [a][b] đều xuất hiện trong chính văn.
