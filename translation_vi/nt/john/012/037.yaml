  source_fidelity: Bản dịch chuyển tải đúng cấu trúc nhượng bộ của mệnh đề phân từ sở hữu cách hoàn thành ("Dù ... đã làm") và mệnh đề chính phủ định ở thì chưa hoàn thành. “Rất nhiều dấu lạ trước mắt họ” phản ánh chính xác τοσαῦτα ... σημεῖα ... ἔμπροσθεν αὐτῶν. “Họ vẫn không tin Ngài” diễn đạt tự nhiên tính kéo dài/hành trạng chưa hoàn thành của οὐκ ἐπίστευον mà không thêm ý cố tình khước từ.
