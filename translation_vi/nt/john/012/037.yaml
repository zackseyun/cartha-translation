source:
  edition: SBLGNT
  text: τοσαῦτα δὲ αὐτοῦ σημεῖα πεποιηκότος ἔμπροσθεν αὐτῶν οὐκ ἐπίστευον εἰς αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/john/012/037.yaml
  text: Although he had done so many signs before them[a], they did not believe in him[b],
translation:
  language: vi
  text: Dù Đức Chúa Jêsus đã làm rất nhiều dấu lạ trước mắt họ, họ vẫn không tin Ngài.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “họ không tin Ngài.” Động từ Hy Lạp ở thì chưa hoàn thành có thể gợi ý sự không tin kéo dài hoặc lặp đi lặp lại.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοσαῦτα
  choice: rất nhiều
  rationale: Diễn đạt tự nhiên sắc thái định lượng nhấn mạnh số lượng lớn của các dấu lạ.
- source_word: δὲ
  choice: Dù... vẫn
  rationale: 'Cấu trúc nhượng bộ tiếng Việt chuyển tải rõ sự tương phản: nhiều dấu lạ đã được thực hiện nhưng sự không tin vẫn tiếp diễn.'
- source_word: σημεῖα
  choice: dấu lạ
  rationale: 'Giữ sắc thái Giăng: các việc kỳ diệu là dấu hiệu chỉ đến căn tính và sự mặc khải của Đức Chúa Jêsus, thay vì chỉ nhấn mạnh tính siêu nhiên như từ ''phép lạ''.'
- source_word: πεποιηκότος
  choice: đã làm
  rationale: Diễn đạt hành động xảy ra trước với kết quả còn liên quan trong bối cảnh; kết hợp với 'dù' thể hiện giá trị nhượng bộ của kết cấu phân từ.
- source_word: ἔμπροσθεν αὐτῶν
  choice: trước mắt họ
  rationale: Cho thấy các dấu lạ diễn ra công khai ngay trong tầm nhìn của họ; tự nhiên hơn cách dịch máy móc 'trước họ'.
- source_word: οὐκ ἐπίστευον
  choice: vẫn không tin
  rationale: Thì chưa hoàn thành có thể gợi sự không tin kéo dài; 'vẫn' thể hiện tính tiếp diễn trong tiếng Việt mà không thêm sắc thái cố ý khước từ.
- source_word: εἰς αὐτόν
  choice: tin Ngài
  rationale: Trong tiếng Việt, 'tin Ngài' diễn đạt tự nhiên cấu trúc πιστεύω + εἰς với đối tượng là Đức Chúa Jêsus; không dịch máy móc giới từ thành 'vào'.
theological_decisions:
- issue: Sắc thái kéo dài của sự không tin trong động từ chưa hoàn thành
  choice: họ vẫn không tin Ngài
  alternative: họ không tin Ngài
  rationale: '''Vẫn không tin'' bảo tồn khả năng diễn tả tình trạng kéo dài bất chấp nhiều dấu lạ, nhưng không áp đặt sắc thái mạnh hơn như ''cứ khước từ tin''.'
- issue: Chủ thể của đại từ αὐτοῦ / αὐτόν
  choice: Đức Chúa Jêsus ... Ngài
  alternative: Ngài ... Ngài
  rationale: Nêu danh xưng ở đầu câu giúp câu đứng riêng rõ nghĩa theo tham chiếu câu, trong khi vẫn xác định đúng chủ thể và đối tượng là Đức Chúa Jêsus.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “dấu lạ” để giữ thuật ngữ đặc trưng của sách Giăng; dùng cặp “dù... vẫn” để truyền đạt tự nhiên quan hệ nhượng bộ và tương phản.
