id: JHN.12.42
reference: John 12:42
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὅμως μέντοι καὶ ἐκ τῶν ἀρχόντων πολλοὶ ἐπίστευσαν εἰς αὐτόν, ἀλλὰ διὰ τοὺς Φαρισαίους οὐχ ὡμολόγουν ἵνα μὴ ἀποσυνάγωγοι γένωνται,
base_translation:
  language: en
  yaml_path: translation/nt/john/012/042.yaml
  text: Nevertheless, even among the rulers many believed in him, but because of the Pharisees they were not confessing it, so that they might not become excluded from the synagogue.
translation:
  language: vi
  text: Tuy vậy, ngay cả trong giới lãnh đạo cũng có nhiều người tin Ngài; nhưng vì những người Pha-ri-si, họ không công khai xưng nhận, để khỏi bị loại khỏi hội đường.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “bị đuổi khỏi hội đường” hoặc “bị khai trừ khỏi hội đường.” Từ Hy Lạp chỉ việc bị loại khỏi cộng đồng hội đường.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅμως μέντοι
  choice: Tuy vậy
  rationale: Cặp tiểu từ nhấn mạnh sự nhượng bộ và tương phản; “Tuy vậy” tự nhiên, trang trọng và truyền đạt đầy đủ lực đối lập.
- source_word: καὶ ἐκ τῶν ἀρχόντων πολλοὶ
  choice: ngay cả trong giới lãnh đạo cũng có nhiều người
  rationale: ἐκ với sở hữu cách chỉ thành phần thuộc một nhóm; ἄρχοντες ở đây là những người có địa vị lãnh đạo, không phải các vua chúa. Cách diễn đạt này tự nhiên trong tiếng Việt và giữ sắc thái “ngay cả” của καί.
- source_word: ἐπίστευσαν εἰς αὐτόν
  choice: tin Ngài
  rationale: Cụm πιστεύω εἰς diễn tả đức tin hướng đến Đức Giê-su. “Tin Ngài” là cách nói tự nhiên, không làm yếu thành chỉ tán thành cũng không cường điệu thành một phán quyết về tình trạng cứu rỗi.
- source_word: διὰ τοὺς Φαρισαίους
  choice: vì những người Pha-ri-si
  rationale: διά với đối cách chỉ nguyên nhân. Bản dịch không thêm rõ “sợ” vì ý đó chỉ được hàm ý trong ngữ cảnh, không được nêu trực tiếp.
- source_word: οὐχ ὡμολόγουν
  choice: họ không công khai xưng nhận
  rationale: Thì chưa hoàn thành gợi hành động kéo dài hoặc thường xuyên không làm. Động từ ὁμολογέω ở đây mang nghĩa thừa nhận hay tuyên xưng công khai; tiếng Việt có thể để tân ngữ được hiểu theo ngữ cảnh như nguyên văn Hy Lạp.
- source_word: ἵνα μὴ
  choice: để khỏi
  rationale: Diễn đạt mục đích tránh một hậu quả, tự nhiên và súc tích trong tiếng Việt hiện đại.
- source_word: ἀποσυνάγωγοι γένωνται
  choice: bị loại khỏi hội đường
  rationale: Từ này chỉ việc bị loại khỏi cộng đồng hội đường và sự tham gia tại đó. Cách dịch giữ ý loại trừ mà không áp đặt một thủ tục pháp lý chính thức hơn mức nguyên văn cho phép.
theological_decisions:
- issue: Bản chất đức tin của những người lãnh đạo trong thần học Gio-an
  choice: Dịch ἐπίστευσαν trực tiếp là “tin” và đồng thời giữ nguyên việc họ không công khai xưng nhận.
  alternative: Diễn giải họ chỉ tin ngoài mặt, hoặc khẳng định họ chắc chắn đã có đức tin cứu rỗi.
  rationale: Câu văn vừa nói họ tin Đức Giê-su vừa nói họ không công khai xưng nhận. Bản dịch cần giữ nguyên sức căng thần học này thay vì quyết định tình trạng đức tin của họ vượt quá điều văn bản nói.
- issue: Tân ngữ ngầm của ὡμολόγουν
  choice: Không thêm tân ngữ, dịch “không công khai xưng nhận”.
  alternative: “không xưng nhận Ngài” hoặc “không công khai thừa nhận điều đó”.
  rationale: Nguyên văn không có tân ngữ hiển ngôn. Cách dịch không tân ngữ bảo tồn sự hàm ẩn, đồng thời ngữ cảnh vẫn cho thấy điều họ không chịu công khai thừa nhận là đức tin nơi Đức Giê-su.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. “Giới lãnh đạo” diễn đạt địa vị của ἄρχοντες tự nhiên hơn “các nhà cầm quyền” trong ngữ cảnh này; “hội đường” giữ thuật ngữ quen thuộc cho συναγωγή. Đại từ “Ngài” được dùng kính trọng để chỉ Đức Giê-su.
