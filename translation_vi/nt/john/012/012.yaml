base_translation:
  language: en
  yaml_path: translation/nt/john/012/012.yaml
  text: The next day[a], the large crowd that had come to the feast, when they heard that Jesus was coming to Jerusalem[b],
translation:
  language: vi
  text: Hôm sau, đám đông lớn đã đến dự kỳ lễ[a], khi họ nghe tin Giê-su đang đến Giê-ru-sa-lem[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “lễ hội”. Từ Hy Lạp ἑορτή có thể chỉ một kỳ lễ hoặc lễ hội.
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn dùng thì hiện tại lịch sử: “Giê-su đang đến Giê-ru-sa-lem.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τῇ ἐπαύριον
  choice: Hôm sau
  rationale: Cách diễn đạt thời gian tự nhiên trong tiếng Việt, giữ rõ trình tự tường thuật.
- source_word: ὁ ὄχλος πολὺς
  choice: đoàn dân đông đảo
  rationale: Diễn đạt rõ một đám đông lớn bằng ngôn ngữ hiện đại, trang trọng và tự nhiên.
- source_word: ὁ ἐλθὼν εἰς τὴν ἑορτήν
  choice: đã đến dự lễ
  rationale: Mệnh đề quan hệ trong nguyên văn bổ nghĩa cho đoàn dân; “đã đến” thể hiện hành động xảy ra trước thời điểm đang được thuật lại, còn “dự lễ” truyền đạt tự nhiên ý đến kỳ lễ.
- source_word: ἀκούσαντες
  choice: nghe tin
  rationale: Phân từ số nhiều quy chiếu đến những người trong danh từ tập hợp; “nghe tin” tự nhiên trong ngữ cảnh họ nhận được tin Đức Chúa Jêsus đang đến.
- source_word: ὅτι ἔρχεται
  choice: Đức Chúa Jêsus đang đến
  rationale: Giữ sắc thái hiện tại lịch sử của ἔρχεται và diễn tả hành động đang diễn tiến; chú thích nêu khả năng chuyển sang thì quá khứ trong lời kể.
- source_word: ὁ Ἰησοῦς
  choice: Đức Chúa Jêsus
  rationale: Dùng dạng tên gọi Kinh Thánh quen thuộc và cung kính trong tiếng Việt, không thêm một tước hiệu thần học ngoài truyền thống định danh.
- source_word: εἰς Ἱεροσόλυμα
  choice: đến Giê-ru-sa-lem
  rationale: Diễn đạt tự nhiên hướng chuyển động về thành phố, không nhấn quá mức ý đi vào bên trong.
