review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng trình tự thời gian, đám đông đông đảo đã đến dự kỳ lễ, và tin Giê-su đang đến Giê-ru-sa-lem. Tuy nhiên, “Đức Chúa Jêsus” thêm tước hiệu không có trong nguyên văn, nơi chỉ ghi tên ὁ Ἰησοῦς; cần dùng tên riêng được phiên âm mà không thêm tước hiệu.
  naturalness: “Đoàn dân đông đảo” hơi thiên về nghĩa một tập thể dân chúng hơn là một đám đông cụ thể. “Đám đông lớn” là cách nói hiện đại, tự nhiên và sát ὁ ὄχλος πολὺς hơn. Thêm “khi họ” giúp biểu đạt rõ phân từ số nhiều ἀκούσαντες quy chiếu đến những người trong đám đông.
  terminology: Dùng “Giê-su” theo chính tả Việt ngữ hiện đại và chính sách phiên âm tên riêng. Không thêm “Đức Chúa”, vì đây là tước hiệu/thần xưng không xuất hiện trong câu nguồn. “Kỳ lễ” diễn đạt ἑορτή thích hợp; chú thích chỉ nên nêu lựa chọn từ vựng, không khẳng định cụ thể tính tôn giáo vượt quá từ ngữ của câu này.
  issues:
  - severity: high
    issue: “Đức Chúa Jêsus” thêm tước hiệu vào tên Giê-su.
    rationale: Nguyên văn γράφει ὁ Ἰησοῦς, tức tên Giê-su với mạo từ dùng theo cách kể chuyện, không có κύριος, θεός, hay tước hiệu nào tương đương “Đức Chúa”. Bản dịch cần không thêm nội dung thần học.
  - severity: medium
    issue: “đoàn dân đông đảo” chưa sát nhất với ὁ ὄχλος πολὺς.
    rationale: ὄχλος chỉ một đám đông; “đám đông lớn” tự nhiên hơn trong tiếng Việt hiện đại và tránh chuyển nghĩa sang toàn thể dân chúng.
  - severity: low
    issue: Chú thích a khẳng định “kỳ lễ tôn giáo”.
    rationale: ἑορτή có thể chỉ lễ hội/kỳ lễ; bối cảnh rộng hơn cho thấy lễ Vượt Qua, nhưng riêng chú thích từ vựng nên giữ ở mức “kỳ lễ” hoặc “lễ hội”.
