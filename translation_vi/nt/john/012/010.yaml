  source_fidelity: 'Bản dịch truyền đạt đúng các thành tố chính của câu Hy Lạp: chủ thể số nhiều οἱ ἀρχιερεῖς, quyết định có chủ ý của ἐβουλεύσαντο, nội dung/mục đích với ἵνα, hành động ἀποκτείνωσιν, và tính bổ sung của καί đối với La-xa-rơ. “Vì thế” là một cách diễn đạt có thể chấp nhận được cho liên từ δέ trong mạch văn trực tiếp, nơi sự hiện diện và ảnh hưởng của La-xa-rơ dẫn đến phản ứng này; nó không làm thay đổi ý nghĩa cốt lõi.'
