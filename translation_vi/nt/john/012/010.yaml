id: JHN.12.10
reference: John 12:10
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐβουλεύσαντο δὲ οἱ ἀρχιερεῖς ἵνα καὶ τὸν Λάζαρον ἀποκτείνωσιν,
base_translation:
  language: en
  yaml_path: translation/nt/john/012/010.yaml
  text: So the chief priests decided to kill Lazarus also,[a]
translation:
  language: vi
  text: Vì thế, các thượng tế quyết định giết cả La-xa-rơ nữa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Các thượng tế lập kế hoạch giết cả La-xa-rơ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐβουλεύσαντο
  choice: quyết định
  rationale: Động từ chỉ sự bàn tính đi đến một chủ ý rõ ràng. “Quyết định” tự nhiên trong tiếng Việt hiện đại và giữ được tính chủ ý; “lập kế hoạch” thiên hơn về quá trình chuẩn bị.
- source_word: δὲ
  choice: Vì thế
  rationale: Trong mạch kể chuyện, liên từ này nối với nguyên nhân được nêu ở câu trước và có thể diễn đạt tự nhiên bằng “Vì thế”; không nên dùng “nhưng” vì sẽ nhấn mạnh sự tương phản quá mức.
- source_word: οἱ ἀρχιερεῖς
  choice: các thượng tế
  rationale: Số nhiều chỉ giới lãnh đạo tư tế cấp cao, không phải chỉ một thầy tế lễ thượng phẩm. “Các thượng tế” là cách gọi gọn, trang trọng và quen thuộc.
- source_word: ἵνα
  choice: giết
  rationale: Sau động từ “quyết định”, cấu trúc ἵνα với động từ giả định diễn đạt nội dung hoặc mục đích của quyết định; tiếng Việt tự nhiên dùng trực tiếp động từ “giết”.
- source_word: καὶ
  choice: cả ... nữa
  rationale: 'Diễn đạt rõ ý bổ sung: La-xa-rơ cũng trở thành đối tượng bị nhắm đến, bên cạnh Chúa Giê-su theo văn cảnh.'
- source_word: τὸν Λάζαρον
  choice: La-xa-rơ
  rationale: Dùng dạng phiên âm tên riêng quen thuộc trong tiếng Việt; mạo từ Hy Lạp không cần dịch riêng.
- source_word: ἀποκτείνωσιν
  choice: giết
  rationale: “Giết” trực tiếp và tự nhiên, không ngụ ý thủ tục tư pháp như “xử tử” và không thêm phán xét đạo đức vào từ vựng như “sát hại” có thể làm.
theological_decisions:
- issue: Cách trình bày ý định của các thượng tế đối với La-xa-rơ
  choice: Diễn đạt thẳng rằng họ quyết định giết La-xa-rơ, không bổ sung động cơ hay yếu tố âm mưu.
  alternative: Dùng ngôn ngữ mạnh hơn như “âm mưu” hoặc “lập mưu giết”.
  rationale: Câu Hy Lạp cho thấy một quyết định có chủ ý, nhưng không dùng thuật ngữ chuyên biệt chỉ âm mưu. Bản dịch giữ nguyên mức độ nghiêm trọng mà không thêm sắc thái diễn giải.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc “cả ... nữa” chuyển tải tự nhiên lực bổ sung của καί; tên La-xa-rơ theo lối phiên âm Kinh Thánh quen thuộc.
