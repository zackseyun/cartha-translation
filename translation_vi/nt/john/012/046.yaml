id: JHN.12.46
reference: John 12:46
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐγὼ φῶς εἰς τὸν κόσμον ἐλήλυθα, ἵνα πᾶς ὁ πιστεύων εἰς ἐμὲ ἐν τῇ σκοτίᾳ μὴ μείνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/046.yaml
  text: I have come into the world as light[b][a], so that everyone who believes in me may not remain in the darkness.
translation:
  language: vi
  text: Ta đã đến thế gian như ánh sáng,[a] để bất cứ ai tin nơi Ta không ở lại trong bóng tối.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “như một ánh sáng.” Tiếng Hy Lạp không có mạo từ trước từ “ánh sáng”, nên cụm từ có thể được hiểu theo nghĩa định tính hoặc được diễn đạt với “một”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φῶς
  choice: ánh sáng
  rationale: Danh từ không có mạo từ mang sắc thái định tính; “như ánh sáng” diễn đạt căn tính và vai trò của Đức Giê-su mà không biến ẩn dụ thành lời giải thích.
- source_word: εἰς τὸν κόσμον
  choice: đến thế gian
  rationale: Trong tiếng Việt, “đến thế gian” tự nhiên hơn cách dịch sát cấu trúc “vào trong thế gian”, đồng thời vẫn giữ ý chuyển động và sứ mạng.
- source_word: ἐλήλυθα
  choice: đã đến
  rationale: Thì hoàn thành Hy Lạp nói về hành động đến với kết quả còn hiệu lực; “đã đến” là cách diễn đạt tiếng Việt tự nhiên, không buộc thêm từ giải thích.
- source_word: ἵνα
  choice: để
  rationale: Diễn đạt trực tiếp mục đích của việc Đức Giê-su đến thế gian.
- source_word: πᾶς ὁ πιστεύων
  choice: bất cứ ai tin
  rationale: Diễn đạt tự nhiên phạm vi khái quát của cấu trúc phân từ có πᾶς, không thêm giới hạn thần học ngoài câu.
- source_word: πιστεύων εἰς ἐμέ
  choice: tin nơi Ta
  rationale: Giữ hướng quy chiếu cá nhân của πιστεύω εἰς và phù hợp văn phong Kinh Thánh trang trọng, dễ hiểu.
- source_word: ἐν τῇ σκοτίᾳ
  choice: trong bóng tối
  rationale: Giữ nguyên hình ảnh Giăng về bóng tối như một lĩnh vực tinh thần và đạo đức đối lập với ánh sáng.
- source_word: μὴ μείνῃ
  choice: không còn ở lại
  rationale: “Ở lại” phản ánh động từ μένω; từ “còn” làm rõ ý không tiếp tục ở trong tình trạng bóng tối mà không biến mục đích thành một lời bảo đảm cơ học.
theological_decisions:
- issue: Lời tự nhận của Đấng Christ qua hình ảnh ánh sáng
  choice: “đến thế gian như ánh sáng”
  alternative: “đến thế gian, là một ánh sáng” hoặc “đến đem ánh sáng cho thế gian”
  rationale: Cách chọn giữ nguyên ẩn dụ về chính Đức Giê-su là ánh sáng, không hạ thành việc Ngài chỉ đem ánh sáng, đồng thời phản ánh sắc thái định tính của φῶς không có mạo từ.
- issue: Phạm vi của πᾶς ὁ πιστεύων
  choice: “bất cứ ai tin”
  alternative: “mọi người tin” hoặc “ai tin”
  rationale: Giữ phạm vi phổ quát của lớp người được nói đến mà không nhập vào câu một lập trường hệ phái về ý chí tự do hay sự tuyển chọn.
- issue: Sắc thái mục đích của ἵνα... μὴ μείνῃ
  choice: “để... không còn ở lại”
  alternative: “hầu cho... khỏi ở lại”
  rationale: Bảo toàn mục đích cứu độ được câu văn nêu ra, nhưng không diễn giải thêm về cơ chế hay thời điểm thoát khỏi bóng tối.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ta” cho lời Đức Giê-su để giữ giọng tự xưng có thẩm quyền; “thế gian”, “ánh sáng”, “bóng tối” bảo toàn hệ thống hình ảnh đặc trưng của sách Giăng.
