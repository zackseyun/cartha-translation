  terminology: Giữ “Hô-sa-na,” “Chúa,” và “Vua của Y-sơ-ra-ên” là phù hợp với văn phong Kinh Thánh tiếng Việt hiện đại. “Đấng đến nhân danh Chúa” vừa tự nhiên vừa bảo toàn công thức trích dẫn Thi Thiên.
