  verdict: revise
  source_fidelity: 'Bản nháp truyền đạt đúng các thành tố chính: cành cọ, đi ra gặp Ngài, lời hô lặp lại, Hô-sa-na, Đấng đến nhân danh Chúa, và tước hiệu Vua của Y-sơ-ra-ên. Tuy nhiên, “Ngài chính là” giải thích và nhấn mạnh quan hệ của καὶ vượt quá điều câu Hy Lạp xác định; trong khi chính chú thích thừa nhận cách đọc liên từ đơn giản.'
