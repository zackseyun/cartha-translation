source:
  edition: SBLGNT
  text: ἔλαβον τὰ βαΐα τῶν φοινίκων καὶ ἐξῆλθον εἰς ὑπάντησιν αὐτῷ, καὶ ⸀ἐκραύγαζον· Ὡσαννά, εὐλογημένος ὁ ἐρχόμενος ἐν ὀνόματι κυρίου, ⸂καὶ ὁ⸃ βασιλεὺς τοῦ Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/013.yaml
  text: They took the palm branches and went out to meet him[a], and they were crying out, “Hosanna! Blessed is the one who comes in the name of the Lord[c][b], even the King of Israel!”
translation:
  language: vi
  text: 'Họ lấy những cành cọ, đi ra gặp Ngài và cứ reo hô: “Hô-sa-na![a] Chúc tụng Đấng đến nhân danh Chúa![b] Và Vua của Y-sơ-ra-ên!”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Hô-sa-na” là lời tung hô có nguồn gốc Hê-bơ-rơ, nghĩa ban đầu là “xin cứu ngay” hoặc “xin cứu”; vào thời ấy, từ này cũng được dùng như tiếng reo ca ngợi.
    reason: lexical_alternative
  - marker: b
    text: Lời này vọng lại Thi Thiên 118:26.
    reason: cross_reference
  - marker: c
    text: 'Cũng có thể hiểu theo nghĩa giải thích: “tức là Vua của Y-sơ-ra-ên.”'
    reason: alternative_reading
lexical_decisions:
- source_word: τὰ βαΐα τῶν φοινίκων
  choice: những cành lá cọ
  rationale: Cụm từ chỉ các cành của cây cọ. “Những cành lá cọ” vừa tự nhiên trong tiếng Việt vừa giữ rõ hình ảnh cụ thể của nguyên văn.
- source_word: ἐξῆλθον εἰς ὑπάντησιν αὐτῷ
  choice: đi ra gặp Ngài
  rationale: Diễn đạt trực tiếp hành động đi ra để gặp một người; không thêm sắc thái “chào đón” vốn không bắt buộc trong cụm từ Hy Lạp.
- source_word: ἐκραύγαζον
  choice: liên tục reo hô
  rationale: Thì chưa hoàn thành diễn tả tiếng hô đang tiếp diễn hoặc lặp lại. “Reo hô” phù hợp với khung cảnh tung hô công khai, còn “liên tục” làm rõ thể của động từ.
- source_word: Ὡσαννά
  choice: Hô-sa-na
  rationale: Giữ lại lời tung hô có nguồn gốc Hê-bơ-rơ bằng dạng phiên âm quen thuộc; chú thích giải thích cả nghĩa cầu xin cứu giúp và chức năng ca ngợi của từ này.
- source_word: εὐλογημένος ὁ ἐρχόμενος
  choice: Chúc tụng Đấng … mà đến
  rationale: Cách nói trang trọng, tự nhiên trong lời tung hô và giữ được liên hệ với Thi Thiên 118:26. “Đấng … mà đến” thể hiện phân từ được dùng như danh từ.
- source_word: ἐν ὀνόματι κυρίου
  choice: nhân danh Chúa
  rationale: Đây là cách diễn đạt tiếng Việt tự nhiên và sát với thành ngữ Hy Lạp “trong danh Chúa”, không diễn giải quá mức thành “được Chúa trao quyền”.
- source_word: καὶ ὁ βασιλεὺς τοῦ Ἰσραήλ
  choice: Ngài chính là Vua của Y-sơ-ra-ên
  rationale: Hiểu καί theo nghĩa nhấn mạnh/đồng vị, xác định Đấng đang đến là Vua của Y-sơ-ra-ên. Chú thích giữ lại khả năng dịch καί theo nghĩa nối kết đơn giản là “và”.
theological_decisions:
- issue: Cách dịch κυρίου trong lời trích dẫn Thi Thiên
  choice: Chúa
  alternative: CHÚA
  rationale: Bản Hy Lạp dùng κυρίου; “Chúa” phản ánh trực tiếp văn bản Hy Lạp. Dù câu này vọng lại Thi Thiên 118:26, không chuyển sang kiểu chữ “CHÚA” chỉ để biểu thị danh Đức Chúa Trời trong bản Hê-bơ-rơ đứng sau lời trích.
- issue: Sắc thái vương quyền và Đấng Mê-si-a trong lời tung hô
  choice: giữ nguyên tước hiệu “Vua của Y-sơ-ra-ên”
  alternative: Vua Y-sơ-ra-ên
  rationale: Nguyên văn công khai gắn tước hiệu hoàng gia này với Đức Giê-su. Bản dịch không làm nhẹ đi cũng không mở rộng ý nghĩa thần học vượt quá câu văn.
- issue: Quan hệ của καὶ ὁ βασιλεὺς τοῦ Ἰσραήλ với mệnh đề trước
  choice: Ngài chính là Vua của Y-sơ-ra-ên
  alternative: và Vua của Y-sơ-ra-ên
  rationale: καί có thể mang sắc thái nhấn mạnh hoặc giải thích đồng vị, nhưng cũng có thể chỉ là liên từ “và”. Bản chính chọn cách đọc tự nhiên theo ngữ cảnh tung hô, còn chú thích bảo tồn cách hiểu khác.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” phù hợp lối kể kính trọng phổ biến trong tiếng Việt Cơ Đốc; “reo hô” tái hiện sắc thái công khai, hân hoan của đám đông. Các dấu chú thích được đặt ngay sau nội dung tương ứng.
