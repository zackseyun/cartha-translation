review_pass:
  verdict: revise
  source_fidelity: Chính văn truyền đạt đúng cấu trúc thời gian song song của νῦν, đối tượng “thế gian này” (τοῦ κόσμου τούτου), và ý bị động tương lai của ἐκβληθήσεται ἔξω. “Là lúc ... bị phán xét” là cách Việt hóa chấp nhận được cho κρίσις ἐστὶν τοῦ κόσμου τούτου, không áp đặt nghĩa “kết án”.
  naturalness: Câu văn hiện đại, rõ ràng và giữ được nhịp song hành. “Kẻ cai trị” và “bị đuổi ra ngoài” tự nhiên trong ngữ cảnh này.
  terminology: “Thế gian” phù hợp với cách dùng quan trọng của κόσμος trong Giăng. Tuy nhiên, phương án chú thích “vua chúa” không phải là tương đương từ vựng tự nhiên hay chính xác cho số ít ὁ ἄρχων; nên thay bằng “người cai trị” hoặc “thủ lĩnh”. Danh tính nhân vật cần tiếp tục được giữ hàm ẩn trong chính văn.
  issues:
  - severity: medium
    issue: Chú thích đề xuất “vua chúa của thế gian này” như một phương án dịch.
    rationale: ὁ ἄρχων là số ít và chỉ người nắm quyền/cai trị. “Vua chúa” không phải lựa chọn từ vựng sát nghĩa, có sắc thái không xác định và dễ gợi số nhiều. Việc sửa chú thích không thay đổi nghĩa chính văn.
