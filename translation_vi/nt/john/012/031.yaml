base_translation:
  language: en
  yaml_path: translation/nt/john/012/031.yaml
  text: Now is the judgment of this world[b][a]; now the ruler of this world will be cast out.
translation:
  language: vi
  text: Bây giờ là lúc thế gian này bị phán xét; bây giờ kẻ cai trị thế gian này[a] sẽ bị đuổi ra ngoài.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc dịch: “người cai trị thế gian này.” Cụm này thường được hiểu là chỉ Sa-tan.'
    reason: Nêu một phương án từ vựng tự nhiên cho ἄρχων và cách hiểu phổ biến, trong khi chính văn vẫn giữ tước hiệu không nêu đích danh.
lexical_decisions:
- source_word: νῦν
  choice: bây giờ
  rationale: Giữ nguyên sức nhấn mạnh về thời điểm và cấu trúc song song của hai lần νῦν.
- source_word: κρίσις ἐστὶν τοῦ κόσμου τούτου
  choice: là lúc thế gian này bị phán xét
  rationale: Diễn đạt tự nhiên trong tiếng Việt ý về một hành động phán xét mang tính quyết định; cách chuyển thành mệnh đề bị động phản ánh khách thể của sự phán xét mà không thêm kết quả kết án.
- source_word: κόσμου τούτου
  choice: thế gian này
  rationale: Giữ đại từ chỉ định τούτου và sắc thái đặc trưng trong Giăng về thế gian hiện tại đối lập với quyền trị vì của Đức Chúa Trời.
- source_word: ἄρχων
  choice: kẻ cai trị
  rationale: Là cách nói hiện đại, rõ nghĩa về một nhân vật có quyền cai trị, đồng thời không nêu đích danh nhân vật ấy.
- source_word: ἐκβληθήσεται ἔξω
  choice: sẽ bị đuổi ra ngoài
  rationale: Giữ thể tương lai bị động và sức nhấn mạnh của ἔξω về việc bị loại trừ, bằng lối diễn đạt tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Danh tính của “kẻ cai trị thế gian này”
  choice: Giữ nguyên tước hiệu trong chính văn, không nêu đích danh.
  alternative: Sa-tan hoặc ma quỷ; cũng có thể hiểu là hệ thống thế gian hiện tại được nhân cách hóa.
  rationale: Trong văn mạch Giăng, cụm từ này thường được hiểu là chỉ Sa-tan, nhưng bản Hy Lạp dùng tước hiệu chứ không dùng tên riêng. Bản dịch giữ nguyên sự hàm ẩn và không tự ý giải quyết căng thẳng thần học.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Thế gian” được chọn thay cho “thế giới” để phù hợp ngữ vực Kinh Thánh tiếng Việt và sắc thái thần học trong Giăng; “kẻ cai trị” tránh sắc thái tôn kính không cần thiết của “vị” nhưng vẫn giữ tính cá nhân của ὁ ἄρχων.
