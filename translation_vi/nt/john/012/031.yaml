  rationale: Chỉ sửa chú thích để loại bỏ phương án “vua chúa”, vốn không phản ánh chính xác danh từ số ít ὁ ἄρχων. Chính văn đã trung thành với tiếng Hy Lạp và tự nhiên trong tiếng Việt nên được giữ nguyên.
