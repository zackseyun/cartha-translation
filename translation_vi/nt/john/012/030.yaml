  text: ἀπεκρίθη ⸂Ἰησοῦς καὶ εἶπεν⸃· Οὐ δι’ ἐμὲ ⸂ἡ φωνὴ αὕτη⸃ γέγονεν ἀλλὰ δι’ ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/030.yaml
  text: Jesus answered and said[a], “This voice has not come for my sake, but for yours.”
translation:
  language: vi
  text: 'Đức Giê-su đáp: “Tiếng nói này không phải vang lên nhằm ích lợi cho tôi, nhưng nhằm ích lợi cho anh em.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể hiểu: “Tiếng nói này không vang lên vì tôi, nhưng vì anh em.” Giới từ Hy Lạp có thể mang nghĩa nguyên nhân, dù ngữ cảnh nghiêng về nghĩa tiếng nói này được ban vì lợi ích của những người nghe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν
  choice: Đức Giê-su đáp
  rationale: Công thức kể chuyện gồm hai động từ được chuyển tự nhiên sang tiếng Việt bằng một động từ “đáp”; dịch cả hai là “đáp và nói” sẽ nặng và kém tự nhiên, trong khi chức năng diễn ngôn vẫn được giữ.
- source_word: φωνή
  choice: tiếng phán
  rationale: Trong ngữ cảnh, đây là lời từ trời vừa được nghe, nên “tiếng phán” diễn đạt rõ một tiếng nói có nội dung và giữ sắc thái trang trọng; “âm thanh” quá rộng.
- source_word: γέγονεν
  choice: vang lên
  rationale: Thể hoàn thành của γίνομαι nói đến việc tiếng phán đã xảy ra và hiệu quả hiện tại của nó. “Vang lên” kết hợp tự nhiên với “tiếng phán” trong tiếng Việt.
- source_word: δι’ ἐμὲ ... δι’ ὑμᾶς
  choice: vì tôi ... vì anh em
  rationale: διά với đối cách có thể chỉ mục đích/lợi ích hoặc nguyên nhân. “Vì” giữ được sự cô đọng và phần nào giữ tính đa nghĩa của nguyên ngữ, còn ngữ cảnh nghiêng về ý tiếng phán nhằm ích lợi cho người nghe.
- source_word: Οὐ ... ἀλλὰ
  choice: không phải ... nhưng
  rationale: Giữ trực tiếp cấu trúc tương phản của nguyên văn.
theological_decisions:
- issue: Mục đích của tiếng phán từ trời
  choice: Câu chính dùng “vì” để không khóa chặt διά vào một nghĩa duy nhất; theo ngữ cảnh, tiếng phán không nhằm cho Đức Giê-su mà nhằm cho những người nghe.
  alternative: '“không phải vì lợi ích của tôi, nhưng vì lợi ích của anh em” hoặc cách hiểu theo nguyên nhân: “không xảy ra bởi tôi, nhưng bởi anh em.”'
  rationale: Hai cụm διά + đối cách song song có thể được hiểu theo hướng mục đích/lợi ích hoặc nguyên nhân. Ngữ cảnh ưu tiên nghĩa dành cho lợi ích của đám đông, nhưng bản dịch và chú thích vẫn bảo tồn khả năng ngữ nghĩa khác mà không thêm khẳng định giáo lý.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Giê-su” theo lối gọi tôn kính; “anh em” diễn đạt đại từ số nhiều ὑμᾶς. Dấu chú thích được đặt ngay sau câu trích dẫn.
