revisions:
- from: vì do người ấy mà nhiều người Do Thái đã rời đi và tin vào Đức Giê-su.[a][b][c]
  to: vì nhiều người Do Thái đang bỏ đi do người ấy và tin vào Đức Giê-su.[a][b][c]
  rationale: Sửa câu mở đầu để tiếng Việt tự nhiên, đồng thời giữ hai quan hệ nguyên nhân riêng biệt của nguyên văn. Đổi “đã rời đi” thành “đang bỏ đi” để phản ánh an toàn hơn nét chưa hoàn thành của ὑπῆγον. Các ghi chú được giữ và chỉnh nhẹ cách gọi động từ cho khớp bản chính; không thêm diễn giải thần học hay xác định quá mức điều người Do Thái đang rời bỏ.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T06:24:11Z'
review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng quan hệ nhân quả của ὅτι, ý bộ phận của πολλοὶ τῶν Ἰουδαίων, nguyên nhân δι’ αὐτόν (chỉ La-xa-rơ theo ngữ cảnh), và đức tin hướng về Đức Giê-su. Tuy nhiên, “đã rời đi” dễ làm mất sắc thái chưa hoàn thành của ὑπῆγον; dùng “đang bỏ đi” phản ánh trực tiếp hơn hành động đang diễn tiến mà không xác định quá mức đối tượng họ rời bỏ.
  naturalness: Cụm mở đầu “vì do người ấy mà” không tự nhiên trong tiếng Việt hiện đại vì chồng hai dấu hiệu nguyên nhân. Cấu trúc “vì nhiều người Do Thái đang bỏ đi do người ấy” tự nhiên hơn, đồng thời vẫn phân biệt nguyên nhân ở cấp câu (ὅτι) với nguyên nhân liên quan đến La-xa-rơ (δι’ αὐτόν).
  terminology: “Người Do Thái,” “Đức Giê-su,” và “tin vào Đức Giê-su” đều phù hợp văn phong Kinh Thánh tiếng Việt hiện đại. Ghi chú về khả năng “người Giu-đê” và các cách hiểu của πιστεύω εἰς là thích hợp; không nên thay bản chính bằng “giới lãnh đạo Do Thái,” vì cụm từ nguyên ngữ nói “nhiều người trong số người Do Thái.”
  issues:
  - severity: medium
    issue: “Vì do người ấy mà” là cấu trúc nguyên nhân chồng lấp, gượng trong tiếng Việt.
    rationale: “Vì” dịch ὅτι và “do ... mà” dịch δι’ αὐτόν cùng xuất hiện trong một cụm khiến câu mở đầu không tự nhiên. Có thể phân bố hai quan hệ này trong cả mệnh đề mà không đổi nghĩa.
  - severity: low
    issue: “Đã rời đi” chưa biểu đạt rõ nét chưa hoàn thành của ὑπῆγον.
    rationale: Thì chưa hoàn thành mô tả một tiến trình hoặc hành động lặp lại trong quá khứ. “Đang bỏ đi” là cách diễn đạt tiếng Việt trực tiếp hơn; ghi chú tiếp tục bảo lưu rằng đây có thể là sự rời khỏi lập trường/ảnh hưởng chứ không chỉ di chuyển địa lý.
  revised_text: vì nhiều người Do Thái đang bỏ đi do người ấy và tin vào Đức Giê-su.[a][b][c]
