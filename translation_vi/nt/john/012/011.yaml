language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὅτι πολλοὶ δι’ αὐτὸν ὑπῆγον τῶν Ἰουδαίων καὶ ἐπίστευον εἰς τὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/011.yaml
  text: because many of the Jews were going away because of him and were believing in Jesus[a][b][c][d].
translation:
  language: vi
  text: vì nhiều người Do Thái đang bỏ đi do người ấy và tin vào Đức Giê-su.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch “nhiều người Giu-đê.” Trong sách Giăng, “người Do Thái” đôi khi có thể chỉ cụ thể hơn người Giu-đê hoặc giới lãnh đạo Do Thái, tùy ngữ cảnh.
    reason: alternative_reading
  - marker: b
    text: “Bỏ đi” cũng có thể dịch là “rời đi” hoặc “lìa khỏi.” Động từ Hy Lạp gợi ý một hành động đang tiếp diễn, có lẽ là họ lìa khỏi lập trường hoặc ảnh hưởng của những người chống đối Đức Giê-su.
    reason: lexical_alternative
  - marker: c
    text: “Tin vào Đức Giê-su” cũng có thể dịch là “đặt đức tin nơi Đức Giê-su” hoặc “tin cậy Đức Giê-su.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: vì
  rationale: Liên từ này nêu lý do các thượng tế muốn giết La-xa-rơ trong câu trước; “vì” diễn đạt tự nhiên quan hệ nguyên nhân.
- source_word: πολλοὶ ... τῶν Ἰουδαίων
  choice: nhiều người Do Thái
  rationale: 'Cấu trúc sở thuộc mang nghĩa bộ phận: nhiều người thuộc cộng đồng Do Thái, không phải toàn thể người Do Thái.'
- source_word: δι’ αὐτὸν
  choice: do người ấy mà
  rationale: διά với đối cách có nghĩa nguyên nhân ở đây. “Người ấy” chỉ La-xa-rơ theo ngữ cảnh, nhưng không thay đại từ bằng tên riêng để giữ cách diễn đạt của nguyên văn.
- source_word: ὑπῆγον
  choice: đã rời đi
  rationale: Động từ ở thì chưa hoàn thành mô tả hành động đang diễn ra hoặc lặp lại; “rời đi” giữ được ý lìa khỏi lập trường hay ảnh hưởng của những người chống đối Đức Giê-su mà không diễn giải thành sự bội giáo chính thức.
- source_word: ἐπίστευον εἰς τὸν Ἰησοῦν
  choice: tin vào Đức Giê-su
  rationale: Diễn đạt đức tin hướng đến Đức Giê-su; tiếng Việt không cần hình thái tiếp diễn, còn sắc thái đang diễn ra được hiểu từ mạch kể.
theological_decisions:
- issue: Phạm vi nghĩa của Ἰουδαίων trong sách Giăng
  choice: người Do Thái
  alternative: người Giu-đê; giới lãnh đạo Do Thái
  rationale: Trong câu này, “nhiều người” cho thấy một bộ phận trong cộng đồng, không phải lời quy kết cho toàn thể dân Do Thái. Bản chính giữ nghĩa rộng, còn khả năng chỉ người Giu-đê được ghi chú.
- issue: Ý nghĩa của πιστεύω εἰς
  choice: tin vào Đức Giê-su
  alternative: đặt đức tin nơi Đức Giê-su; tin cậy Đức Giê-su
  rationale: Nguyên văn nói đến đức tin hướng về Đức Giê-su nhưng không trực tiếp nói họ đã trở thành môn đồ hay đã được cứu; bản dịch không thêm kết luận thần học.
- issue: Đối tượng được δι’ αὐτὸν nhắc đến
  choice: người ấy
  alternative: La-xa-rơ
  rationale: Theo ngữ cảnh, đại từ chỉ La-xa-rơ, nhưng giữ đại từ trong bản chính bảo toàn hình thức và liên kết của nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc “vì do người ấy mà” tránh lặp hai từ “vì” sát nhau, đồng thời giữ rõ cả quan hệ nguyên nhân của ὅτι lẫn δι’ αὐτόν. Danh xưng “Đức Giê-su” phù hợp văn phong Kinh Thánh tiếng Việt trang trọng.
