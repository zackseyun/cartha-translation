source:
  edition: SBLGNT
  text: Ἰησοῦς δὲ ἔκραξεν καὶ εἶπεν· Ὁ πιστεύων εἰς ἐμὲ οὐ πιστεύει εἰς ἐμὲ ἀλλὰ εἰς τὸν πέμψαντά με,
base_translation:
  language: en
  yaml_path: translation/nt/john/012/044.yaml
  text: But Jesus cried out and said[a], “The one who believes in me does not believe in me[b], but in the one who sent me,”
translation:
  language: vi
  text: 'Nhưng Đức Giê-su kêu lớn tiếng: “Ai tin vào tôi thì không tin vào tôi, nhưng tin vào Đấng đã sai tôi.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Câu này không phủ nhận việc tin vào Đức Giê-su, nhưng nhấn mạnh rằng tin vào Ngài không thể tách rời khỏi tin vào Đấng đã sai Ngài.
    reason: cross_reference
lexical_decisions:
- source_word: Ἰησοῦς
  choice: Đức Giê-su
  rationale: Dùng cách gọi trang trọng, quen thuộc trong tiếng Việt hiện đại đối với tên Giê-su.
- source_word: δὲ
  choice: Nhưng
  rationale: Thể hiện sự chuyển ý có sắc thái tương phản nhẹ với văn cảnh trước.
- source_word: ἔκραξεν καὶ εἶπεν
  choice: lớn tiếng nói
  rationale: κράζω chỉ lời nói được cất lên lớn tiếng và công khai; cách diễn đạt này tự nhiên hơn việc dịch tách thành “kêu lên và nói” mà vẫn giữ được sức mạnh của động từ.
- source_word: Ὁ πιστεύων
  choice: Ai tin
  rationale: Phân từ hiện tại có mạo từ mang nghĩa khái quát; “ai tin” là cách diễn đạt tự nhiên, phổ quát trong tiếng Việt mà không áp đặt thêm sắc thái thời gian.
- source_word: πιστεύων / πιστεύει εἰς
  choice: tin vào
  rationale: Giữ nguyên sự lặp lại của cùng động từ và diễn đạt hướng quy chiếu cá nhân của cấu trúc πιστεύω εἰς.
- source_word: οὐ ... ἀλλὰ
  choice: không phải ... nhưng
  rationale: Giữ cấu trúc tương phản mạnh của nguyên văn mà không tự ý thêm từ “chỉ” để làm dịu nghịch lý.
- source_word: τὸν πέμψαντά με
  choice: Đấng đã sai tôi
  rationale: “Đấng” phù hợp với ngôi vị thần linh được ngụ ý, còn “đã sai tôi” bảo toàn cấu trúc phân từ quá khứ mà không nêu rõ “Chúa Cha” khi nguyên văn không nêu.
theological_decisions:
- issue: Mệnh đề “không phải tin vào tôi, nhưng tin vào Đấng đã sai tôi” có thể bị hiểu là phủ nhận việc đặt đức tin nơi Đức Giê-su.
  choice: 'Giữ nguyên sự căng thẳng của câu: “không phải tin vào tôi, nhưng tin vào Đấng đã sai tôi.”'
  alternative: “không chỉ tin vào tôi, mà còn tin vào Đấng đã sai tôi” hoặc nêu thẳng “Chúa Cha” trong chính văn.
  rationale: Nguyên văn không có từ “chỉ” hay “còn,” nên thêm vào sẽ âm thầm giải quyết nghịch lý. Trong văn mạch Gio-an, đức tin nơi Đức Giê-su không thể tách rời khỏi đức tin nơi Đấng sai Ngài; chú thích giải thích điều này mà không sửa lời chính văn.
translation_notes:
  register: Văn phong trang trọng nhưng tự nhiên, dễ hiểu đối với độc giả Việt Nam hiện đại. Dùng “Đức Giê-su” và “Đấng” để giữ sự tôn kính; không viết hoa đại từ “tôi/Ngài” trong lời trực tiếp ngoài quy ước thông thường. Dấu chú thích [a] được đặt sau toàn bộ lời tuyên bố vì chú thích giải thích sự căng thẳng thần học của cả cấu trúc đối lập.
