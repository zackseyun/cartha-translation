revisions:
- from: 'Nhưng Đức Giê-su lớn tiếng nói: “Ai tin vào tôi thì không phải tin vào tôi, nhưng tin vào Đấng đã sai tôi.[a]”'
  to: 'Nhưng Đức Giê-su kêu lớn tiếng: “Ai tin vào tôi thì không tin vào tôi, nhưng tin vào Đấng đã sai tôi.[a]”'
  rationale: Bản sửa khôi phục phép đối lập động từ “không tin ... nhưng tin” của nguyên văn, không thêm “chỉ,” “còn,” hoặc nêu đích danh Chúa Cha. Đồng thời, “kêu lớn tiếng” giữ lực của ἔκραξεν và chú thích giải thích tối thiểu mà không thay đổi ý chính văn.
