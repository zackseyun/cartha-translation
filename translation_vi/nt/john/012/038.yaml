id: JHN.12.38
reference: John 12:38
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἵνα ὁ λόγος Ἠσαΐου τοῦ προφήτου πληρωθῇ ὃν εἶπεν· Κύριε, τίς ἐπίστευσεν τῇ ἀκοῇ ἡμῶν; καὶ ὁ βραχίων κυρίου τίνι ἀπεκαλύφθη;
base_translation:
  language: en
  yaml_path: translation/nt/john/012/038.yaml
  text: 'so that the word of Isaiah the prophet might be fulfilled[a], which he said: “Lord, who has believed our report? And to whom has the arm of the Lord been revealed?”'
translation:
  language: vi
  text: 'để lời của nhà tiên tri Ê-sai được ứng nghiệm, như ông đã nói:


    “Lạy Chúa, ai đã tin lời chúng con loan báo[a]?


    Và cánh tay của Chúa đã được bày tỏ cho ai?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “điều chúng con đã nghe” hoặc “sứ điệp của chúng con.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: để
  rationale: Giữ liên từ chỉ mục đích/kết quả một cách tự nhiên trong tiếng Việt, không quyết đoán sắc thái nào là duy nhất.
- source_word: ὁ λόγος Ἠσαΐου τοῦ προφήτου
  choice: lời của nhà tiên tri Ê-sai
  rationale: “Lời” giữ sát λόγος và phù hợp với công thức ứng nghiệm lời Kinh Thánh; tên và danh hiệu được diễn đạt theo cách dùng tiếng Việt thông dụng.
- source_word: πληρωθῇ
  choice: được ứng nghiệm
  rationale: Giữ thể bị động và mô-típ ứng nghiệm, đồng thời phù hợp với thức giả định sau ἵνα.
- source_word: Κύριε
  choice: Lạy Chúa
  rationale: Dạng xưng hô “Lạy Chúa” truyền đạt tự nhiên hô cách của κύριος trong lời cầu hỏi trang trọng.
- source_word: ἐπίστευσεν
  choice: đã tin
  rationale: Thì quá khứ trong câu hỏi tu từ là cách diễn đạt tự nhiên trong tiếng Việt và không thêm ý thời gian ngoài văn bản.
- source_word: τῇ ἀκοῇ ἡμῶν
  choice: lời chúng con loan báo
  rationale: ἀκοή tại đây có thể chỉ điều được nghe hay nội dung được công bố. Cách dịch này rõ nghĩa, tự nhiên trong ngữ cảnh lời tiên tri, còn các khả năng thực sự khác được giữ trong chú thích.
- source_word: ὁ βραχίων κυρίου
  choice: cánh tay của Chúa
  rationale: Giữ nguyên ẩn dụ Kinh Thánh về quyền năng và hành động của Chúa, không diễn giải thay bằng một khái niệm trừu tượng.
- source_word: ἀπεκαλύφθη
  choice: đã được bày tỏ
  rationale: Giữ thể bị động và ý nghĩa làm cho điều vốn chưa thấy được trở nên hiển lộ.
theological_decisions:
- issue: Ngôn ngữ ứng nghiệm và quan hệ mục đích/kết quả
  choice: “để ... được ứng nghiệm”
  alternative: “vì thế ... đã được ứng nghiệm” hoặc “nhằm làm ứng nghiệm”
  rationale: ἵνα trong lối văn Gioan có thể mang sắc thái mục đích, kết quả, hoặc cả hai. Cách dịch được chọn bảo tồn sự căng thẳng này thay vì áp đặt một cách giải thích tất định.
- issue: Nghĩa của ἀκοή trong lời trích Ê-sai
  choice: “lời chúng con loan báo”
  alternative: “điều chúng con đã nghe” hoặc “sứ điệp của chúng con”
  rationale: Danh từ có thể chỉ việc nghe, điều được nghe, hoặc lời được truyền đạt. Bản chính chọn nghĩa nội dung được công bố vì hợp ngữ cảnh, đồng thời chú thích giữ các khả năng từ vựng khác.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc “lời ... lời ông đã nói” được dùng để giữ λόγος và liên kết rõ với lời trích dẫn; ẩn dụ “cánh tay của Chúa” được bảo tồn nguyên vẹn.
