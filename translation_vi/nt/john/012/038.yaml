  terminology: “Chúa,” “nhà tiên tri,” “được ứng nghiệm,” và “cánh tay của Chúa” nhất quán với ngữ vực Kinh Thánh trang trọng. Không cần diễn giải ẩn dụ hoặc áp đặt cách hiểu thần học về quan hệ mục đích/kết quả của ἵνα.
