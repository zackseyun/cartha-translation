  to: Bấy giờ, Ma-ri lấy một lít-ra[a] dầu thơm cam tùng nguyên chất[b], rất quý giá, xức lên chân Đức Giê-su, rồi lấy tóc mình lau chân Người. Ngôi nhà ngập tràn hương dầu thơm.
  rationale: Chỉ sửa “Cả nhà” thành “Ngôi nhà” để phản ánh rõ ἡ οἰκία là không gian vật lý, và chuyển các ký hiệu chú thích đến đúng từ/cụm được giải thích. Các lựa chọn từ vựng và mức độ trang trọng còn lại đều có thể giữ nguyên.
