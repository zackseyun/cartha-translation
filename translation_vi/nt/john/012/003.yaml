id: JHN.12.3
reference: John 12:3
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἡ οὖν ⸀Μαριὰμ λαβοῦσα λίτραν μύρου νάρδου πιστικῆς πολυτίμου ἤλειψεν τοὺς πόδας τοῦ Ἰησοῦ καὶ ἐξέμαξεν ταῖς θριξὶν αὐτῆς τοὺς πόδας αὐτοῦ· ἡ δὲ οἰκία ἐπληρώθη ἐκ τῆς ὀσμῆς τοῦ μύρου.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/003.yaml
  text: Then Mary took a litra of costly pure nard perfume[a], anointed Jesus's feet, and wiped his feet with her hair[c][b]. And the house was filled with the fragrance of the perfume.
translation:
  language: vi
  text: Bấy giờ, Ma-ri lấy một lít-ra[a] dầu thơm cam tùng nguyên chất[b], rất quý giá, xức lên chân Đức Giê-su, rồi lấy tóc mình lau chân Người. Ngôi nhà ngập tràn hương dầu thơm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Lít-ra là một đơn vị cân nặng của La Mã, tương đương khoảng 327 gam, tức gần một phần ba kilôgam.
    reason: cultural_note
  - marker: b
    text: Từ Hy Lạp được dịch là “nguyên chất” (πιστικῆς) có nghĩa chưa chắc chắn; cũng có thể hiểu là “chính hiệu”.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Bấy giờ
  rationale: Diễn tả sự tiếp nối của câu chuyện một cách tự nhiên, đồng thời không nhấn quá mức quan hệ suy luận.
- source_word: λαβοῦσα
  choice: lấy
  rationale: Chuyển phân từ bất định quá khứ thành động từ trong chuỗi hành động, phù hợp cú pháp kể chuyện tiếng Việt.
- source_word: λίτραν
  choice: một lít-ra
  rationale: Giữ nguyên đơn vị cân nặng thời cổ bằng cách phiên âm, tránh đồng nhất sai với pao hay lít hiện đại; chú thích giải thích khối lượng gần đúng.
- source_word: μύρου νάρδου
  choice: dầu thơm cam tùng
  rationale: μύρον là dầu hoặc thuốc thơm dùng để xức; νάρδος chỉ cam tùng, chất tạo hương cụ thể. Cụm này tự nhiên và rõ nghĩa trong tiếng Việt.
- source_word: πιστικῆς
  choice: nguyên chất
  rationale: Đây là một nghĩa khả dĩ và phù hợp với phẩm chất cao của dầu cam tùng trong ngữ cảnh; vì nghĩa của từ Hy Lạp còn được tranh luận, chú thích giữ lại cách hiểu khác.
- source_word: πολυτίμου
  choice: rất quý giá
  rationale: Truyền đạt giá trị rất cao của dầu thơm, không chỉ vẻ đáng quý về tình cảm.
- source_word: ἤλειψεν
  choice: xức lên
  rationale: Diễn tả đúng hành động thoa dầu thơm và vẫn để ngỏ ý nghĩa biểu tượng của hành động, không áp đặt cách giải thích nghi lễ hay thần học.
- source_word: ἐξέμαξεν ταῖς θριξὶν αὐτῆς
  choice: lấy tóc mình lau
  rationale: Thể hiện rõ tóc của Ma-ri là phương tiện dùng để lau, bằng cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: ἡ οἰκία ἐπληρώθη ἐκ τῆς ὀσμῆς τοῦ μύρου
  choice: Cả nhà ngập tràn hương dầu thơm
  rationale: Tái hiện hình ảnh hương thơm lan đầy ngôi nhà bằng lối nói tự nhiên, giàu sức gợi nhưng không thêm nội dung.
theological_decisions:
- issue: Khả năng diễn giải quá mức động từ ἤλειψεν
  choice: Dịch là “xức lên” theo nghĩa hành động trong câu chuyện.
  alternative: “thoa dầu thơm lên” hoặc cách diễn đạt mang nghĩa nghi lễ rõ hơn.
  rationale: “Xức” vừa chính xác về hành động vừa giữ được khả năng có ý nghĩa biểu tượng, nhưng không tự ý biến câu này thành lời khẳng định về nghi lễ, vương quyền hay bí tích.
- issue: Sắc thái của đại từ chỉ Đức Giê-su
  choice: Dùng “Người” khi thay cho tên Đức Giê-su.
  alternative: Dùng “ông” hoặc lặp lại “Đức Giê-su”.
  rationale: “Người” giữ văn phong trang trọng quen thuộc trong tiếng Việt mà không thêm một danh hiệu thần học vốn không có trong câu Hy Lạp.
translation_notes:
  register: Bản dịch dùng tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. “Lít-ra” được giữ như đơn vị cổ và giải thích bằng chú thích; “dầu thơm cam tùng” vừa gọi đúng chất thơm vừa tránh từ ngữ quá chuyên môn. Câu cuối được diễn đạt gọn để giữ hiệu ứng cảm giác của nguyên văn.
