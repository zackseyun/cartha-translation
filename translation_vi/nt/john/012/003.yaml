review_pass:
  verdict: revise
  source_fidelity: Bản dịch truyền đạt đúng các hành động chính, lượng dầu, tính chất đắt giá, việc Ma-ri dùng tóc lau chân Đức Giê-su và hương thơm lan đầy nhà. Tuy nhiên, “Cả nhà” trong tiếng Việt thường có thể chỉ toàn bộ người trong gia đình, trong khi οἰκία ở đây là không gian ngôi nhà; cần làm rõ chủ thể vật lý được hương thơm làm đầy.
  naturalness: Văn phong hiện đại, trang trọng và tự nhiên. “Dầu thơm cam tùng” và “lấy tóc mình lau chân Người” rõ ràng. “Ngôi nhà ngập tràn hương dầu thơm” vừa tự nhiên vừa sát hình ảnh nguyên văn hơn “Cả nhà ngập tràn”.
  terminology: “Ma-ri,” “Đức Giê-su,” “lít-ra,” “dầu thơm cam tùng,” và “xức” phù hợp văn phong Kinh Thánh tiếng Việt hiện đại. Cách hiểu “nguyên chất” cho πιστικῆς được giữ ở văn bản, đồng thời chú thích đúng mức tính bất định của từ này. Cần đặt các ký hiệu chú thích ngay sau từ/cụm mà chúng giải thích.
  issues:
  - severity: medium
    issue: “Cả nhà” có thể được hiểu là cả gia đình/người nhà.
    rationale: ἡ οἰκία chỉ ngôi nhà, và câu mô tả hương thơm lan đầy không gian. “Ngôi nhà” loại bỏ sự nhập nhằng mà không đổi ý nghĩa.
  - severity: low
    issue: Vị trí các ký hiệu chú thích chưa gắn sát các yếu tố được chú thích.
    rationale: Chú thích về lít-ra nên theo ngay “lít-ra”; chú thích từ vựng về πιστικῆς nên theo ngay “nguyên chất”, thay vì cả hai cùng đặt sau “rất quý giá”.
