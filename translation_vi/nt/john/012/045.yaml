source:
  edition: SBLGNT
  text: καὶ ὁ θεωρῶν ἐμὲ θεωρεῖ τὸν πέμψαντά με.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/045.yaml
  text: And the one who sees me sees the one who sent me[a].
translation:
  language: vi
  text: Và ai thấy tôi thì thấy Đấng đã sai tôi[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “chiêm ngưỡng”; động từ Hy Lạp có thể hàm ý nhìn với sự chú tâm và nhận biết, chứ không chỉ nhìn thấy bằng mắt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Và
  rationale: Giữ liên từ nối trực tiếp câu này với ngữ cảnh trước.
- source_word: ὁ θεωρῶν ἐμὲ
  choice: ai thấy tôi
  rationale: Phân từ hiện tại có mạo từ được dùng như danh từ và mang ý nghĩa khái quát. Cách diễn đạt này tự nhiên trong tiếng Việt, không gượng ép theo số ít hình thức của tiếng Hy Lạp.
- source_word: θεωρεῖ
  choice: thấy
  rationale: θεωρέω có thể chỉ việc nhìn thấy, quan sát hoặc nhận biết bằng sự chú ý. Dùng lại “thấy” bảo toàn sự lặp từ của nguyên bản và phù hợp tiếng Việt hiện đại.
- source_word: τὸν πέμψαντά με
  choice: Đấng đã sai tôi
  rationale: Phân từ aorist có mạo từ mô tả Đấng sai phái Đức Giê-su. “Đấng” diễn đạt tự nhiên sự quy chiếu đến một nhân vật tôn kính mà không thêm danh xưng “Cha” vốn không xuất hiện trong câu.
theological_decisions:
- issue: Mối liên hệ giữa việc thấy Đức Giê-su và thấy Đấng sai Ngài
  choice: 'Giữ nguyên lời khẳng định trực tiếp: ai thấy Đức Giê-su thì thấy Đấng đã sai Ngài.'
  alternative: Diễn giải nhẹ hơn là qua Đức Giê-su người ta chỉ biết về Đấng sai Ngài, hoặc diễn giải mạnh hơn thành sự đồng nhất bản thể được nói rõ.
  rationale: Nguyên văn trình bày sự thống nhất trực tiếp trong mặc khải nhưng không tự giải thích bản chất của sự thống nhất ấy. Bản dịch giữ sức nặng và độ căng thần học mà không thêm lời giải thích giáo lý.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Ai… thì…” là cấu trúc khái quát tự nhiên; “Đấng” duy trì sự tôn kính và tránh thêm danh xưng không có trong nguyên văn.
