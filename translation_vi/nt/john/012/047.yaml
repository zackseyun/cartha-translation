id: JHN.12.47
reference: John 12:47
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἐάν τίς μου ἀκούσῃ τῶν ῥημάτων καὶ μὴ ⸀φυλάξῃ, ἐγὼ οὐ κρίνω αὐτόν, οὐ γὰρ ἦλθον ἵνα κρίνω τὸν κόσμον ἀλλ’ ἵνα σώσω τὸν κόσμον.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/047.yaml
  text: And if anyone hears my words and does not keep them[a], I do not judge him; for I did not come to judge the world[b], but to save the world.
translation:
  language: vi
  text: Nếu ai nghe lời Ta mà không tuân giữ, thì Ta không xét xử[a] người ấy[b]; vì Ta đến không phải để xét xử thế gian, nhưng để cứu thế gian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “kết án”. Động từ Hy Lạp có nghĩa là “xét xử” và trong một số ngữ cảnh có thể hàm ý phán quyết bất lợi.
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn Hy Lạp dùng đại từ số ít giống đực, nhưng với nghĩa khái quát, chỉ bất cứ ai nghe mà không tuân giữ lời của Chúa Giê-su.
    reason: source_clarification
lexical_decisions:
- source_word: ἐάν τίς
  choice: nếu ai
  rationale: Diễn đạt tự nhiên một điều kiện bất định, có tính khái quát và áp dụng cho bất cứ người nào.
- source_word: ἀκούσῃ τῶν ῥημάτων μου
  choice: nghe những lời của ta
  rationale: Giữ nghĩa căn bản của ἀκούω là “nghe” và thể hiện ῥήματα là những lời được Chúa Giê-su phán, không thêm sắc thái chủ ý của “lắng nghe”.
- source_word: μὴ φυλάξῃ
  choice: mà không giữ
  rationale: φυλάσσω có thể mang nghĩa giữ, tuân giữ hoặc vâng theo. “Giữ” bảo toàn phạm vi nghĩa rộng và phù hợp với cách nói của Tin Mừng Giăng, thay vì thu hẹp ngay thành “không vâng lời”.
- source_word: οὐ κρίνω αὐτόν
  choice: ta không xét xử người ấy
  rationale: “Xét xử” giữ được nghĩa chính và sự lặp lại của κρίνω trong cùng câu. “Người ấy” vừa phản ánh đại từ số ít αὐτόν vừa tự nhiên hơn đại từ mang dấu giới trong tiếng Việt.
- source_word: οὐ γὰρ ἦλθον
  choice: vì ta đến không phải
  rationale: Thì aorist tóm lược việc Chúa Giê-su đến và sứ mạng của Ngài; cách diễn đạt này tự nhiên trong tiếng Việt và nối trực tiếp với hai mệnh đề chỉ mục đích.
- source_word: ἵνα κρίνω τὸν κόσμον
  choice: để xét xử thế gian
  rationale: Diễn đạt rõ mục đích của ἵνα và duy trì cùng một cách dịch κρίνω trong cả hai lần xuất hiện.
- source_word: ἵνα σώσω τὸν κόσμον
  choice: để cứu thế gian
  rationale: “Cứu” giữ nguyên thuật ngữ cứu rỗi trọng yếu của σῴζω và sự đối lập trực tiếp giữa xét xử với cứu.
theological_decisions:
- issue: Lời tuyên bố “ta không xét xử người ấy” trong tương quan với ngôn ngữ xét xử ở Tin Mừng Giăng
  choice: Dịch nhất quán κρίνω là “xét xử” và để ngữ cảnh bày tỏ trọng tâm sứ mạng cứu rỗi.
  alternative: Dịch là “kết án” hoặc thêm ý “nay ta chưa xét xử”.
  rationale: Bản Hy Lạp dùng cùng động từ κρίνω hai lần và không trực tiếp thêm yếu tố thời gian. Cách dịch này giữ nguyên sức căng thần học với các câu khác nói về sự xét xử, không tự ý hài hòa hóa.
- issue: Đại từ số ít giống đực αὐτόν sau đại từ bất định τις
  choice: Dịch là “người ấy” và ghi rõ tính khái quát trong chú thích.
  alternative: Dịch bằng một đại từ mang dấu giới tính hoặc lặp lại “ai”.
  rationale: Trong tiếng Việt, “người ấy” giữ số ít mà không tạo ra hàm ý chỉ áp dụng cho nam giới; chú thích giúp người đọc thấy rõ cấu trúc của nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ta” trong lời trực tiếp của Chúa Giê-su theo lối xưng hô Kinh Thánh quen thuộc nhưng không cổ hóa. Cấu trúc “không phải… nhưng…” giữ thế đối lập rõ của nguyên văn.
