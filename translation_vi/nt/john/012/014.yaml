  source_fidelity: 'Bản dịch phản ánh đúng cấu trúc và ý chính của bản Hy Lạp: phân từ εὑρών được diễn đạt bằng chuỗi hành động có trình tự “tìm được … và ngồi”; ὀνάριον được chuyển là “con lừa con”; và ἐκάθισεν ἐπ’ αὐτό là “ngồi lên nó.” Công thức καθώς ἐστιν γεγραμμένον được giữ đúng chức năng dẫn lời Kinh Thánh bằng “đúng như lời đã chép.” Không thêm ý về động cơ chủ ý ứng nghiệm lời tiên tri.'
  naturalness: Câu văn tự nhiên, trang trọng và phù hợp tiếng Việt hiện đại trong văn cảnh Kinh Thánh. “Bấy giờ” là một cách nối mạch kể chấp nhận được cho δέ; “Đức Giê-su” và “đúng như lời đã chép” cũng nhất quán với văn phong tôn giáo phổ thông.
  terminology: “Đức Giê-su” là cách gọi trang trọng, thông dụng. “Một con lừa con” truyền đạt hợp lý sắc thái giảm nhẹ/thường chỉ con non của ὀνάριον; chú thích kèm theo nêu phương án “một con lừa nhỏ” và giải thích đúng mức, không khẳng định tuổi của con vật một cách tuyệt đối.
