source:
  edition: SBLGNT
  text: εὑρὼν δὲ ὁ Ἰησοῦς ὀνάριον ἐκάθισεν ἐπ’ αὐτό, καθώς ἐστιν γεγραμμένον·
base_translation:
  language: en
  yaml_path: translation/nt/john/012/014.yaml
  text: 'Then Jesus[a], having found a young donkey, sat on it, just as it is written:'
translation:
  language: vi
  text: 'Bấy giờ, Đức Giê-su tìm được một con lừa con[a] và ngồi lên nó, đúng như lời đã chép:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “một con lừa nhỏ”. Từ Hy Lạp ὀνάριον chỉ một con lừa, thường là con còn non.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὑρὼν
  choice: tìm được
  rationale: Phân từ bất định chủ động diễn tả hành động xảy ra trước động từ chính; tiếng Việt tự nhiên có thể dùng chuỗi động từ “tìm được… và ngồi” mà vẫn giữ rõ trình tự.
- source_word: δὲ
  choice: Bấy giờ
  rationale: Ở đây δέ là từ nối nhẹ để tiếp diễn câu chuyện, không nhất thiết biểu thị tương phản. “Bấy giờ” tạo dòng kể trang trọng, tự nhiên.
- source_word: ὀνάριον
  choice: một con lừa con
  rationale: ὀνάριον là dạng giảm nhẹ của từ chỉ con lừa và thường nói đến con còn non. “Lừa con” vừa gọn vừa giữ được khả năng chỉ tuổi non mà không thêm chi tiết ngoài nguyên văn.
- source_word: ἐκάθισεν ἐπ’ αὐτό
  choice: ngồi lên nó
  rationale: Dịch trực tiếp thành ngữ Hy Lạp, tránh diễn giải mạnh hơn như “cưỡi nó”.
- source_word: καθώς ἐστιν γεγραμμένον
  choice: đúng như lời đã chép
  rationale: Giữ lực so sánh của καθώς và công thức dẫn Kinh Thánh, đồng thời diễn đạt tự nhiên, trang trọng trong tiếng Việt.
- source_word: ὁ Ἰησοῦς
  choice: Đức Giê-su
  rationale: Dùng cách gọi trang trọng, thông dụng trong văn phong Kinh Thánh tiếng Việt; mạo từ Hy Lạp trước tên riêng không cần dịch riêng.
theological_decisions:
- issue: Mối liên hệ giữa hành động của Đức Giê-su và lời Kinh Thánh được trích dẫn
  choice: Trình bày hành động của Đức Giê-su là tương ứng với điều đã chép, nhưng không nói rõ trong câu này rằng ngài chủ ý thực hiện lời tiên tri.
  alternative: Diễn đạt năng động hơn để hàm ý Đức Giê-su cố ý ứng nghiệm lời tiên tri.
  rationale: Nguyên văn thuật lại hành động rồi đưa vào công thức trích dẫn Kinh Thánh. Câu cho thấy sự tương ứng mang tính tiên tri nhưng không trực tiếp xác định động cơ, nên bản dịch giữ nguyên sự dè dặt ấy.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Bấy giờ” nối mạch kể; “đúng như lời đã chép” giữ sắc thái công thức dẫn Kinh Thánh. Dấu [a] được đặt ngay sau cụm từ mà chú thích giải thích.
