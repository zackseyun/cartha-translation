- from: 'Vì vậy, Đức Giê-su nói với họ: “Ánh sáng còn ở giữa các ông[a] ít lâu nữa. Hãy bước đi khi các ông còn có ánh sáng, để bóng tối không bắt kịp các ông. Người bước đi trong bóng tối không biết mình đang đi đâu.”'
  to: 'Vì vậy, Đức Giê-su nói với họ: “Ánh sáng còn ở giữa các ông trong một thời gian ngắn nữa[a]. Hãy bước đi khi các ông còn có ánh sáng, để bóng tối không bắt kịp các ông. Người bước đi trong bóng tối không biết mình đang đi đâu.”'
  rationale: Chỉ điều chỉnh trật tự trạng ngữ thời gian trong câu đầu để tiếng Việt hiện đại tự nhiên hơn. Không thay đổi nghĩa, sắc thái ẩn dụ, cách xưng hô, hay chú thích bảo tồn tính đa nghĩa của ἐν ὑμῖν.
