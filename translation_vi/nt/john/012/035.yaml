id: JHN.12.35
reference: John 12:35
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἶπεν οὖν αὐτοῖς ὁ Ἰησοῦς· Ἔτι μικρὸν χρόνον τὸ φῶς ⸂ἐν ὑμῖν⸃ ἐστιν. περιπατεῖτε ⸀ὡς τὸ φῶς ἔχετε, ἵνα μὴ σκοτία ὑμᾶς καταλάβῃ, καὶ ὁ περιπατῶν ἐν τῇ σκοτίᾳ οὐκ οἶδεν ποῦ ὑπάγει.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/035.yaml
  text: So Jesus said to them[a], “The light is still among you for a little while. Walk while you have the light, so that darkness may not overtake you. The one who walks in the darkness does not know where he is going.”
translation:
  language: vi
  text: 'Vì vậy, Đức Giê-su nói với họ: “Ánh sáng còn ở giữa các ông trong một thời gian ngắn nữa[a]. Hãy bước đi khi các ông còn có ánh sáng, để bóng tối không bắt kịp các ông. Người bước đi trong bóng tối không biết mình đang đi đâu.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “ở trong các ông” hoặc “ở với các ông.” Cụm từ Hy Lạp có thể được hiểu theo nhiều cách, nhưng “ở giữa các ông” phù hợp nhất với văn mạch trực tiếp về sự hiện diện công khai của Đức Giê-su.
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: Vì vậy
  rationale: Dùng từ nối tự nhiên để liên kết lời Đức Giê-su với cuộc trao đổi trước đó, nhưng không làm quan hệ suy luận trở nên quá mạnh.
- source_word: Ἔτι μικρὸν χρόνον
  choice: còn ... ít lâu nữa
  rationale: Diễn đạt đầy đủ ý tiếp diễn của ἔτι và khoảng thời gian ngắn của μικρὸν χρόνον bằng tiếng Việt hiện đại.
- source_word: τὸ φῶς
  choice: ánh sáng
  rationale: Giữ nguyên hình ảnh ánh sáng cùng sức nặng ẩn dụ và thần học trong văn mạch Giăng, không diễn giải thành một danh xưng.
- source_word: ἐν ὑμῖν
  choice: ở giữa các ông
  rationale: Phù hợp nhất với bối cảnh Đức Giê-su đang hiện diện công khai giữa những người nghe; các nghĩa khả dĩ khác được giữ trong chú thích.
- source_word: περιπατεῖτε
  choice: Hãy bước đi
  rationale: Giữ hình ảnh bước đi của nguyên ngữ, vốn có thể gợi cả hành động lẫn cách sống.
- source_word: ὡς
  choice: khi
  rationale: Hiểu theo nghĩa thời gian trong cụm 'khi ... còn có ánh sáng', phù hợp với tính cấp bách của lời nói.
- source_word: σκοτία
  choice: bóng tối
  rationale: Cách dịch thông dụng, giữ nguyên sự tương phản chủ đạo giữa ánh sáng và bóng tối.
- source_word: καταλάβῃ
  choice: bắt kịp
  rationale: Giữ nét nghĩa bóng tối đuổi theo rồi chụp lấy hoặc ập đến; tự nhiên trong hình ảnh đang bước đi.
- source_word: ὁ περιπατῶν ἐν τῇ σκοτίᾳ
  choice: Người bước đi trong bóng tối
  rationale: Giữ cấu trúc khái quát số ít và sự lặp lại có chủ ý của động từ 'bước đi'.
- source_word: οὐκ οἶδεν ποῦ ὑπάγει
  choice: không biết mình đang đi đâu
  rationale: Diễn đạt tự nhiên trong tiếng Việt, đồng thời giữ ý phương hướng và thì hiện tại của câu Hy Lạp.
theological_decisions:
- issue: Ý nghĩa của ἐν ὑμῖν khi nói về ánh sáng
  choice: ở giữa các ông
  alternative: ở trong các ông; ở với các ông
  rationale: Văn mạch trực tiếp nói đến sự hiện diện công khai có giới hạn của Đức Giê-su như ánh sáng. Tuy nhiên, ἐν ὑμῖν có thể được hiểu theo hơn một cách, nên không loại bỏ các khả năng khác mà ghi chúng trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Giê-su” và đại từ “các ông” phù hợp với lời nói hướng đến nhóm người đối thoại trong bối cảnh. Giữ chuỗi hình ảnh “ánh sáng—bước đi—bóng tối” và sự lặp từ của nguyên ngữ.
