source:
  edition: SBLGNT
  text: ἔρχεται ⸀ὁ Φίλιππος καὶ λέγει τῷ Ἀνδρέᾳ· ⸀ἔρχεται Ἀνδρέας καὶ Φίλιππος ⸀καὶ λέγουσιν τῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/022.yaml
  text: Philip comes and tells Andrew[a]; Andrew and Philip come and tell Jesus.
translation:
  language: vi
  text: Phi-líp đến và nói với Anh-rê[a]; Anh-rê và Phi-líp đến và nói với Giê-su.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tiếng Hy Lạp dùng thì hiện tại lịch sử xuyên suốt câu (“đến… nói… đến… nói”), một đặc điểm kể chuyện tạo cảm giác trực tiếp, sinh động. Nhiều bản dịch chuyển các động từ này sang thì quá khứ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχεται
  choice: đến
  rationale: Giữ thì hiện tại lịch sử của tiếng Hy Lạp để tạo tính trực tiếp, sinh động; trong cả hai lần, chuyển động hướng đến người sắp được thưa chuyện nên “đến” phù hợp hơn “đi”.
- source_word: λέγει / λέγουσιν
  choice: nói với
  rationale: “Nói với” tự nhiên trong tiếng Việt và không bổ sung nội dung chưa được nêu rõ như cách dịch “báo cho”; đồng thời thể hiện đúng người tiếp nhận qua cách dative.
- source_word: ὁ Φίλιππος
  choice: Phi-líp
  rationale: Phiên âm tên riêng theo dạng quen dùng trong truyền thống Kinh Thánh tiếng Việt; mạo từ Hy Lạp trước tên riêng không cần biểu đạt riêng.
- source_word: τῷ Ἀνδρέᾳ
  choice: với Anh-rê
  rationale: Dative chỉ người tiếp nhận lời nói được diễn đạt tự nhiên bằng giới từ “với”; tên riêng được phiên âm.
- source_word: τῷ Ἰησοῦ
  choice: với Đức Chúa Jêsus
  rationale: Dative được thể hiện bằng “với”. Dùng danh xưng và cách viết tên quen thuộc trong văn phong Kinh Thánh tiếng Việt, trang trọng nhưng dễ nhận biết.
- source_word: καί
  choice: và / ;
  rationale: Giữ mạch kể nối tiếp đơn giản của καί. Ở ranh giới hai mệnh đề chính, dấu chấm phẩy giúp câu tiếng Việt sáng rõ mà không thêm sắc thái thời gian hay nguyên nhân.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ hiện tại lịch sử cùng cấu trúc song hành của nguyên văn; không thêm “rồi”, “sau đó” hay “báo việc ấy” vì các ý này không được nói rõ trong tiếng Hy Lạp.
