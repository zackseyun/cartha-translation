id: JHN.12.25
reference: John 12:25
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ φιλῶν τὴν ψυχὴν αὐτοῦ ⸀ἀπολλύει αὐτήν, καὶ ὁ μισῶν τὴν ψυχὴν αὐτοῦ ἐν τῷ κόσμῳ τούτῳ εἰς ζωὴν αἰώνιον φυλάξει αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/025.yaml
  text: The one who loves his life loses it[b][a], and the one who hates his life in this world will keep it for eternal life.
translation:
  language: vi
  text: Ai yêu mạng sống mình thì đánh mất nó; còn ai ghét mạng sống mình trong thế gian này thì sẽ giữ được nó cho sự sống đời đời.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hy Lạp ψυχή cũng có thể có nghĩa là “sự sống”, “bản thân” hoặc “linh hồn”, tùy ngữ cảnh. “Ghét mạng sống mình” là một nghịch lý có chủ ý, nói về việc không bám víu vào mạng sống trong thế gian hiện tại, chứ không cổ xúy sự căm ghét bản thân; so sánh Lu-ca 14:26.
    reason: lexical_alternative_and_cross_reference
lexical_decisions:
- source_word: ὁ φιλῶν
  choice: Ai yêu
  rationale: Phân từ hiện tại có mạo từ được dùng như danh từ, chỉ một người bất kỳ; “Ai yêu” tự nhiên trong tiếng Việt và giữ tính khái quát.
- source_word: τὴν ψυχὴν αὐτοῦ
  choice: mạng sống mình
  rationale: Trong ngữ cảnh này, ψυχή chủ yếu chỉ mạng sống hay chính sự sống của một người, là điều có thể bị mất hoặc được giữ; “mạng sống” hợp với cặp động từ đối lập và tránh mặc nhiên áp đặt nghĩa “linh hồn”.
- source_word: ἀπολλύει αὐτήν
  choice: đánh mất nó
  rationale: Động từ hiện tại diễn tả kết quả nghịch lý của việc yêu mạng sống; “đánh mất” tự nhiên và đối ứng rõ với “giữ được”.
- source_word: ὁ μισῶν
  choice: ai ghét
  rationale: Giữ nguyên sức mạnh của μισέω và nghịch lý có chủ ý, không làm nhẹ thành “ít yêu hơn” trong chính văn.
- source_word: ἐν τῷ κόσμῳ τούτῳ
  choice: trong thế gian này
  rationale: Cách diễn đạt trang trọng nhưng thông dụng, phù hợp sắc thái của κόσμος trong Giăng về trật tự thế gian hiện tại.
- source_word: φυλάξει αὐτήν
  choice: sẽ giữ được nó
  rationale: Thì tương lai được giữ rõ; “giữ được” diễn đạt tự nhiên kết quả bảo toàn và tạo thế đối lập với “đánh mất”.
- source_word: εἰς ζωὴν αἰώνιον
  choice: cho sự sống đời đời
  rationale: εἰς diễn tả đích đến hoặc kết quả; “cho sự sống đời đời” giữ được sự mở về quan hệ chính xác giữa việc giữ mạng sống và sự sống đời đời.
theological_decisions:
- issue: Ý nghĩa của “ghét mạng sống mình”
  choice: Giữ cách nói mạnh “ghét mạng sống mình” như một nghịch lý về việc từ bỏ sự bám víu vào mạng sống trong trật tự thế gian hiện tại.
  alternative: “yêu mạng sống mình ít hơn” hoặc “không quý mạng sống mình”
  rationale: Bản Hy Lạp dùng μισέω. Làm nhẹ ngay trong chính văn sẽ giải quyết thay cho độc giả một căng thẳng thần học và tu từ mà câu nói cố ý duy trì; cụm “trong thế gian này” giới hạn và định hướng ý nghĩa.
- issue: Nghĩa của ψυχή
  choice: Dịch là “mạng sống” trong cả hai vế.
  alternative: “linh hồn” hoặc “bản thân”
  rationale: Ngữ cảnh nhấn mạnh mạng sống có thể bị mất hoặc được giữ, không buộc phải hiểu theo sự phân đôi thân xác–linh hồn. Chú thích bảo lưu trường nghĩa rộng hơn.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng và dễ hiểu. Dùng cấu trúc song song “Ai…; còn ai…” để tái hiện phép đối của nguyên văn. Giữ “ghét” nhằm bảo toàn sức mạnh tu từ; chú thích giải thích mà không làm mềm chính văn.
