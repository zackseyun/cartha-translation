  text: Ἦσαν δὲ ⸂Ἕλληνές τινες⸃ ἐκ τῶν ἀναβαινόντων ἵνα προσκυνήσωσιν ἐν τῇ ἑορτῇ·
base_translation:
  language: en
  yaml_path: translation/nt/john/012/020.yaml
  text: There were some Greeks among those going up to worship at the feast[a].
translation:
  language: vi
  text: Có một số người Hy Lạp trong số những người lên dự lễ để thờ phượng.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “những người Hy Lạp nào đó”; có thể đây là những người không phải Do Thái đã lên dự lễ để thờ phượng.
    reason: Ghi nhận sắc thái không xác định của τινες và nêu khả năng về căn tính tôn giáo mà không khẳng định điều bản văn không nói rõ.
lexical_decisions:
- source_word: Ἦσαν δὲ
  choice: có
  rationale: ἦσαν mang nghĩa tồn tại, được diễn đạt tự nhiên bằng “có”; δέ là liên từ chuyển ý nhẹ và không nhất thiết phải biểu đạt riêng trong câu tiếng Việt này.
- source_word: Ἕλληνές τινες
  choice: mấy người Hy Lạp
  rationale: Ἕλληνες theo nghĩa trực tiếp là “người Hy Lạp”, còn τινες biểu thị một số người không xác định; “mấy người” tự nhiên trong tiếng Việt hiện đại.
- source_word: ἐκ τῶν ἀναβαινόντων
  choice: trong số những người lên dự lễ
  rationale: ἐκ cho biết họ thuộc nhóm những người đang đi lên; “lên” giữ lại cách nói hành hương lên Giê-ru-sa-lem. “Dự lễ” được nối với cụm cuối để câu tiếng Việt rõ và tự nhiên.
- source_word: ἵνα προσκυνήσωσιν
  choice: để thờ phượng
  rationale: ἵνα với động từ giả định diễn tả mục đích; προσκυνέω ở đây chỉ sự thờ phượng tôn giáo.
- source_word: ἐν τῇ ἑορτῇ
  choice: dự lễ
  rationale: ἑορτή chỉ kỳ lễ Do Thái đang được nói đến; “dự lễ” truyền đạt tự nhiên ý đến kỳ lễ để thờ phượng mà không thêm tên lễ vốn không có trong câu.
theological_decisions:
- issue: Danh tính của Ἕλληνες
  choice: Giữ cách gọi “người Hy Lạp” theo nghĩa dân tộc/văn hóa.
  alternative: “dân ngoại” hoặc xác định họ là người Do Thái nói tiếng Hy Lạp, người cải đạo hay người kính sợ Đức Chúa Trời
  rationale: Bản văn chỉ gọi họ là Ἕλληνες và nói họ lên dự lễ để thờ phượng; không nên giải quyết thay cho bản văn câu hỏi họ thuộc nhóm tôn giáo nào.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Trật tự câu được điều chỉnh theo tiếng Việt tự nhiên; tránh dùng thuật ngữ hệ phái và không xác định quá mức căn tính của những người Hy Lạp.
