  source_fidelity: Cần đổi “mấy người” thành “một số người”. Τινές biểu thị một số người không xác định, không hàm ý số lượng ít như “mấy người” có thể gợi ra trong tiếng Việt. Cấu trúc “trong số những người lên” diễn đạt đầy đủ ἐκ τῶν ἀναβαινόντων.
  naturalness: “Có một số người Hy Lạp trong số những người lên dự lễ để thờ phượng” là câu tiếng Việt hiện đại, rõ ràng và giữ được trật tự thông tin tự nhiên. Cụm “lên dự lễ” vẫn bảo toàn cách nói hành hương của nguyên văn mà không thêm địa danh.
  terminology: Giữ “người Hy Lạp” cho Ἕλληνες, không chuyển thành “dân ngoại”. Giữ “thờ phượng” cho προσκυνήσωσιν và “dự lễ” cho ἐν τῇ ἑορτῇ. Chú thích tiếp tục nêu khả năng diễn giải về căn tính của họ, không coi đó là điều bản văn khẳng định.
