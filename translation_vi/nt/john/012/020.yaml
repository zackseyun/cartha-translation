  to: Có một số người Hy Lạp trong số những người lên dự lễ để thờ phượng.[a]
  rationale: Thay “mấy người” bằng “một số người” để tránh thêm sắc thái “ít” không có trong τινες. Điều chỉnh cách diễn đạt thay thế trong chú thích cho nhất quán với sắc thái bất định của nguyên ngữ. Không thay đổi ý nghĩa, không xác định quá mức căn tính của những người Hy Lạp.
