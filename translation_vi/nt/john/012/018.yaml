  text: διὰ τοῦτο ⸀καὶ ὑπήντησεν αὐτῷ ὁ ὄχλος ὅτι ⸀ἤκουσαν τοῦτο αὐτὸν πεποιηκέναι τὸ σημεῖον.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/018.yaml
  text: For this reason also the crowd went to meet him[b][a], because they heard that he had done this sign.
translation:
  language: vi
  text: Chính vì thế, đám đông cũng đi đón Ngài[a], vì họ đã nghe Ngài đã làm dấu lạ này[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “đám đông đã gặp Ngài” hoặc “đám đông đã ra đón Ngài.” Động từ Hy Lạp hàm ý đi đến để gặp một người.'
    reason: lexical_alternative
  - marker: b
    text: “Dấu lạ” là từ ngữ Giăng thường dùng về một hành động kỳ diệu, có chức năng chỉ vượt quá chính nó đến căn tính và sứ mạng của Chúa Giê-su; cũng có thể dịch là “phép lạ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο καὶ
  choice: Cũng vì lý do đó
  rationale: Giữ cả quan hệ nguyên nhân của διὰ τοῦτο lẫn sắc thái bổ sung của καὶ, đồng thời tạo câu tiếng Việt tự nhiên.
- source_word: ὑπήντησεν αὐτῷ
  choice: đã đi đón Ngài
  rationale: Diễn đạt sắc thái chuyển động để gặp một người của ὑπαντάω; “Ngài” quy chiếu về Chúa Giê-su theo văn phong Kinh Thánh trang trọng, dễ hiểu.
- source_word: ὁ ὄχλος
  choice: đoàn dân
  rationale: Chỉ đám đông đã tụ tập, tự nhiên trong ngữ cảnh đoàn người ra đón Chúa Giê-su.
- source_word: ὅτι ἤκουσαν
  choice: bởi họ nghe rằng
  rationale: ὅτι mang nghĩa nguyên nhân trong mạch câu, còn mệnh đề sau cũng là nội dung họ nghe được; cách dịch này giữ được cả hai quan hệ mà không làm câu nặng nề.
- source_word: τοῦτο αὐτὸν πεποιηκέναι τὸ σημεῖον
  choice: Ngài đã làm dấu lạ này
  rationale: “Đã làm” phản ánh hành động hoàn tất của πεποιηκέναι; “này” giữ lực chỉ định của τοῦτο.
- source_word: τὸ σημεῖον
  choice: dấu lạ
  rationale: “Dấu lạ” vừa tự nhiên trong tiếng Việt vừa giữ ý nghĩa một việc kỳ diệu có tính chỉ dấu, thay vì chỉ nhấn mạnh yếu tố phi thường như “phép lạ”.
theological_decisions:
- issue: Cách dịch thuật ngữ σημεῖον đặc trưng trong Giăng
  choice: dấu lạ
  alternative: phép lạ; dấu hiệu
  rationale: “Dấu lạ” bảo toàn đồng thời tính kỳ diệu và chức năng mặc khải, hướng vượt khỏi chính sự việc đến căn tính và sứ mạng của Chúa Giê-su, mà không giải thích quá mức.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “đoàn dân” để tránh sắc thái tiêu cực có thể có của “đám đông”; dùng “Ngài” nhất quán cho đại từ chỉ Chúa Giê-su. Các dấu chú thích được đặt ngay sau cụm từ liên quan.
