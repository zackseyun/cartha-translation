    rationale: ἐπὶ πῶλον ὄνου chỉ nói “trên một con non của lừa / một con lừa non.” Dịch “ngồi trên một con lừa non” vừa thành ngữ vừa không thêm chi tiết từ vựng.
  - severity: low
    issue: Các ký hiệu chú thích đang được đặt chung ở cuối câu.
    rationale: Đặt từng ký hiệu ngay sau cụm được chú thích giúp người đọc xác định rõ chú thích về “đừng sợ,” “con gái Si-ôn,” “kìa,” và con vật non.
