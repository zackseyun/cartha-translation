  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Μὴ φοβοῦ, θυγάτηρ Σιών· ἰδοὺ ὁ βασιλεύς σου ἔρχεται, καθήμενος ἐπὶ πῶλον ὄνου.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/015.yaml
  text: Do not be afraid[a], daughter of Zion. Look, your King is coming[e][d][c][b], seated on a donkey’s colt.
translation:
  language: vi
  text: “Đừng sợ[a], hỡi con gái Si-ôn[b]! Kìa[c], Vua của ngươi đang đến, ngồi trên một con lừa non[d].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “Đừng sợ hãi.”'
    reason: lexical_alternative
  - marker: b
    text: “Con gái Si-ôn” là cách các sách tiên tri nhân cách hóa Si-ôn, tức Giê-ru-sa-lem.
    reason: cultural_note
  - marker: c
    text: 'Hoặc: “Hãy xem” hoặc “Này.”'
    reason: lexical_alternative
  - marker: d
    text: 'Nguyên văn: “trên một con non của lừa.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ φοβοῦ
  choice: đừng sợ
  rationale: Mệnh lệnh phủ định diễn tả lời ngăn cấm sự sợ hãi. “Đừng sợ” tự nhiên, ngắn gọn và giữ nguyên lực của nguyên văn.
- source_word: θυγάτηρ Σιών
  choice: hỡi con gái Si-ôn
  rationale: Giữ hình ảnh nhân cách hóa mang tính tiên tri, trong đó Si-ôn/Giê-ru-sa-lem được gọi như một người con gái.
- source_word: ἰδοὺ
  choice: kìa
  rationale: Tiểu từ thu hút sự chú ý; “kìa” trang trọng vừa phải, tự nhiên và phù hợp lời tiên tri.
- source_word: ὁ βασιλεύς σου
  choice: Vua của ngươi
  rationale: Giữ danh từ xác định cùng đại từ sở hữu. Viết hoa “Vua” để thể hiện sắc thái tước hiệu trong ngữ cảnh nói về Chúa Giê-su, dù nguyên bản Hy Lạp không quyết định việc viết hoa.
- source_word: ἔρχεται
  choice: đang đến
  rationale: Diễn đạt tính hiện tại sống động và tiến trình của động từ trong ngữ cảnh.
- source_word: καθήμενος
  choice: ngồi
  rationale: Phân từ mô tả cách vị vua đang đến; “ngồi” không thêm sắc thái diễn giải như “cưỡi”.
- source_word: ἐπὶ πῶλον ὄνου
  choice: trên lưng một con lừa con
  rationale: πῶλος chỉ con vật non, còn ὄνου xác định đó là lừa. Cách nói này tự nhiên trong tiếng Việt và bảo toàn cả hai yếu tố.
theological_decisions:
- issue: Lời gợi nhắc mang tính Mê-si-a đến Xa-cha-ri 9:9
  choice: Giữ nguyên lời xưng hô tiên tri “con gái Si-ôn” và tước hiệu “Vua của ngươi” trong chính văn.
  alternative: Giải thích trực tiếp Si-ôn là Giê-ru-sa-lem hoặc nói rõ đây là vị vua Mê-si-a ngay trong chính văn.
  rationale: Bản dịch nên duy trì hình ảnh và sức gợi của lời tiên tri, còn ý nghĩa liên văn bản được nêu trong chú thích thay vì được chèn vào câu.
- issue: Viết hoa danh từ chỉ vua
  choice: Vua
  alternative: vua
  rationale: Nguyên bản Hy Lạp không xác định lối viết hoa. Viết hoa thể hiện sắc thái tước hiệu của Chúa Giê-su trong ngữ cảnh vương quyền Mê-si-a, nhưng không thay đổi nội dung từ vựng.
- issue: Quan hệ cú pháp của καθήμενος
  choice: Dịch là “ngồi”, mô tả cách nhà vua đang đến.
  alternative: Dịch là “cưỡi”, làm rõ hành động theo ngữ cảnh.
  rationale: “Ngồi” bám sát động từ nguồn hơn và tránh thêm một nét nghĩa không được phát biểu trực tiếp.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Hỡi” cùng “kìa” giữ âm hưởng của lời tiên tri mà không quá cổ; “ngươi” được dùng vì đây là lời trực tiếp nói với hình tượng nhân cách hóa Si-ôn. Mọi dấu chú thích đều xuất hiện trong chính văn.
