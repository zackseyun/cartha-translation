revisions:
- from: “Hỡi con gái Si-ôn, đừng sợ! Kìa, Vua của ngươi đang đến, ngồi trên lưng một con lừa con.”[a][b][c]
  to: “Đừng sợ[a], hỡi con gái Si-ôn[b]! Kìa[c], Vua của ngươi đang đến, ngồi trên một con lừa non[d].”
  rationale: Điều chỉnh cụm chỉ con vật để bám sát ἐπὶ πῶλον ὄνου mà vẫn tự nhiên trong tiếng Việt. Khôi phục các lựa chọn từ vựng tương ứng với những chỗ có thể dịch khác trong bản kiểm tra tiếng Anh và neo chú thích vào đúng cụm từ. Chú thích liên văn bản được giữ ngoài chính văn; không thêm diễn giải giáo phái.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T06:24:14Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch truyền đạt đúng các thành tố chính của nguyên văn: mệnh lệnh đừng sợ, lời gọi mang tính tiên tri dành cho Si-ôn, lời chỉ thị thu hút chú ý, vị vua đang đến, và hình ảnh ngồi trên con vật non của lừa. Tuy nhiên, “trên lưng một con lừa con” thêm rõ bộ phận cơ thể không có trong tiếng Hy Lạp, còn “lừa con” kém tự nhiên và có thể gây cảm giác khẩu ngữ hoặc mơ hồ. “Con lừa non” chuyển tải πῶλον ὄνου trực tiếp, rõ ràng và tự nhiên hơn.'
  naturalness: “Hỡi,” “Kìa,” và “đừng sợ” tạo văn phong trang trọng vừa phải, phù hợp với lời tiên tri và vẫn dễ hiểu trong tiếng Việt hiện đại. Đặt các dấu chú thích sát từ/cụm từ được chú giải làm rõ phạm vi chú thích hơn thay vì gom tất cả ở cuối câu.
  terminology: Giữ “Si-ôn,” “Giê-ru-sa-lem,” “Xa-cha-ri,” và “Chúa Giê-su” theo cách phiên âm Kinh Thánh Việt ngữ phổ biến. “Vua” viết hoa là một lựa chọn biên tập có thể chấp nhận trong ngữ cảnh quy chiếu về Chúa Giê-su; không cần mở rộng diễn giải trong chính văn.
  issues:
