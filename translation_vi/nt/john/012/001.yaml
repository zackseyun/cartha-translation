id: JHN.12.1
reference: John 12:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ὁ οὖν Ἰησοῦς πρὸ ἓξ ἡμερῶν τοῦ πάσχα ἦλθεν εἰς Βηθανίαν, ὅπου ἦν ⸀Λάζαρος, ὃν ἤγειρεν ἐκ νεκρῶν ⸀Ἰησοῦς.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/001.yaml
  text: So Jesus came to Bethany six days before the Passover[a], where Lazarus was, whom Jesus had raised from the dead.
translation:
  language: vi
  text: Vậy, sáu ngày trước lễ Vượt Qua, Giê-su đến Bê-ta-ni, nơi La-xa-rơ ở—người mà Giê-su đã làm cho sống lại từ cõi chết.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay sát nghĩa hơn: “từ giữa những người chết.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Vậy
  rationale: Giữ chức năng liên kết với mạch kể trước đó, đồng thời tự nhiên và trang trọng trong tiếng Việt hiện đại.
- source_word: πρὸ ἓξ ἡμερῶν τοῦ πάσχα
  choice: sáu ngày trước lễ Vượt Qua
  rationale: Diễn đạt tự nhiên quan hệ thời gian; thêm “lễ” để người đọc nhận ra πάσχα ở đây là kỳ lễ Do Thái đã được xác định trong ngữ cảnh.
- source_word: ἦλθεν εἰς Βηθανίαν
  choice: đến Bê-tha-ni
  rationale: “Đến” phù hợp với động từ chuyển động ἔρχομαι mà không thêm sắc thái “tới nơi” không được biểu thị rõ.
- source_word: ὅπου ἦν Λάζαρος
  choice: nơi La-xa-rơ ở
  rationale: Giữ tính khái quát của mệnh đề chỉ nơi chốn, không tự ý xác định ông cư trú hay tạm trú tại đó.
- source_word: ἤγειρεν
  choice: đã khiến sống lại
  rationale: Trong ngữ cảnh La-xa-rơ đã chết, cụm này truyền đạt rõ nghĩa làm cho sống lại, đồng thời tránh cách nói “đã sống lại” có thể làm mờ vai trò tác động của Đức Chúa Jêsus.
- source_word: ἐκ νεκρῶν
  choice: từ cõi chết
  rationale: Là cách diễn đạt tự nhiên trong tiếng Việt về sự trở lại từ tình trạng hay lĩnh vực của sự chết; nghĩa sát hơn “từ giữa những người chết” được ghi ở chú thích.
- source_word: Ἰησοῦς
  choice: Đức Chúa Jêsus
  rationale: Dùng dạng tên gọi Kinh Thánh quen thuộc và trang trọng trong tiếng Việt; giữ nguyên việc nguồn Hy Lạp lặp lại tên ở cuối mệnh đề.
theological_decisions:
- issue: Ngôn ngữ về việc La-xa-rơ sống lại
  choice: người mà Đức Chúa Jêsus đã khiến sống lại từ cõi chết
  alternative: người mà Ngài đã khiến sống lại từ cõi chết
  rationale: Nguồn Hy Lạp lặp lại rõ tên Ἰησοῦς; giữ tên thay vì đổi thành đại từ bảo toàn sự nhấn mạnh và minh bạch về chủ thể hành động.
- issue: Phạm vi của ἐκ νεκρῶν
  choice: từ cõi chết, kèm chú thích nghĩa sát
  alternative: từ giữa những người chết
  rationale: Bản chính ưu tiên tiếng Việt tự nhiên nhưng chú thích bảo tồn hình thức có thể hiểu là ra khỏi số những người chết, không buộc người đọc vào một cách giải thích thần học.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng và dễ hiểu. Dấu gạch ngang giúp mệnh đề quan hệ dài được đọc rõ ràng. Dùng các dạng phiên âm Bê-tha-ni và La-xa-rơ, cùng danh xưng Đức Chúa Jêsus, theo lối Kinh Thánh tiếng Việt quen thuộc.
