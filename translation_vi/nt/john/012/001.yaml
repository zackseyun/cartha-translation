review_pass:
  verdict: revise
  source_fidelity: Bản dịch truyền đạt đúng quan hệ liên kết của οὖν, mốc thời gian “sáu ngày trước lễ Vượt Qua,” địa điểm Bê-ta-ni, và việc La-xa-rơ đã được làm cho sống lại. Tuy nhiên, bản Hy Lạp chỉ dùng tên Ἰησοῦς, không có tước hiệu κύριος hay θεός; vì vậy việc thêm “Đức Chúa” ở cả hai chỗ vượt quá văn bản nguồn.
  naturalness: Câu nhìn chung tự nhiên và trang trọng. Có thể dùng chính tả tên riêng hiện hành “Giê-su, Bê-ta-ni” và thay “khiến sống lại” bằng “làm cho sống lại,” một cách diễn đạt rõ và tự nhiên trong văn kể hiện đại.
  terminology: “Lễ Vượt Qua,” “La-xa-rơ,” và “từ cõi chết” phù hợp. Không nên gán danh xưng thần học “Đức Chúa” khi nguồn chỉ lặp lại tên Giê-su. Chú thích giữ được phương án sát nghĩa cho ἐκ νεκρῶν.
  issues:
  - severity: high
    issue: Thêm danh xưng “Đức Chúa” trước tên Giê-su
    rationale: SBLGNT có Ἰησοῦς ở đầu câu và cuối mệnh đề quan hệ, không có danh xưng nào tương ứng với “Đức Chúa.” Bản dịch nên giữ tên “Giê-su” và sự lặp lại của tên này, không thêm tước hiệu không được phát biểu trong câu.
  - severity: low
    issue: Chính tả tên riêng và cách diễn đạt có sắc thái truyền thống hơn là hiện đại chuẩn
    rationale: “Giê-su” và “Bê-ta-ni” phù hợp chính tả Việt ngữ hiện hành; “đã làm cho sống lại” là cách nói tự nhiên, minh bạch về tác nhân, mà không đổi nghĩa của ἤγειρεν.
