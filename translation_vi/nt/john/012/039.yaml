  text: 'For this reason they were not able to believe, because Isaiah said again:'
translation:
  language: vi
  text: 'Vì lý do này, họ không thể tin, vì Ê-sai lại nói:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Vì lý do đó
  rationale: Cụm διά với đối cách τοῦτο nêu nguyên nhân và liên kết rõ với phần trước; cách dịch này trực tiếp hơn sắc thái suy luận của “vì vậy”.
- source_word: οὐκ ἠδύναντο
  choice: họ không thể
  rationale: Dạng chưa hoàn thành của δύναμαι diễn tả sự bất khả năng; “không thể” tự nhiên trong tiếng Việt và không làm nhẹ ý nghĩa thành chỉ không muốn.
- source_word: πιστεύειν
  choice: tin
  rationale: Trong cách dùng của Giăng, πιστεύω được chuyển tự nhiên và nhất quán là “tin”.
- source_word: ὅτι
  choice: bởi vì
  rationale: Trong ngữ cảnh này, ὅτι mở đầu lý do cho sự bất khả năng, được trình bày qua lời trích tiếp theo từ Ê-sai.
- source_word: πάλιν
  choice: lại
  rationale: πάλιν đánh dấu thêm một lời trích của Ê-sai sau lời trích trước đó; “lại” ngắn gọn và tự nhiên.
- source_word: εἶπεν
  choice: nói rằng
  rationale: Trong công thức dẫn lời, λέγω được dịch tự nhiên là “nói”; thêm “rằng” giúp dẫn vào lời trích ở câu kế tiếp.
- source_word: Ἠσαΐας
  choice: Ê-sai
  rationale: Dùng dạng tên riêng quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
theological_decisions:
- issue: Bản chất của việc không thể tin
  choice: Dịch thẳng là “họ không thể tin”, không giải thích thêm nguyên nhân hay cơ chế của sự bất khả năng.
  alternative: “Họ không chịu tin”, hoặc diễn giải rõ theo một hệ thống thần học về sự làm cứng lòng và trách nhiệm con người.
  rationale: Bản Hy Lạp nói đến sự bất khả năng chứ không chỉ sự không sẵn lòng. Tuy nhiên, câu này không buộc bản dịch phải giải quyết cuộc tranh luận thần học rộng hơn; cần giữ nguyên sức căng của bản văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ cấu trúc nhân quả kép của câu Hy Lạp, đồng thời dùng “không thể” theo cách nói tự nhiên của tiếng Việt.
