review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch giữ đúng các yếu tố chính: γάρ («Vì»), tính khái quát của τοὺς πτωχούς («người nghèo»), sự tương phản δέ («nhưng»), và sự tương ứng của «luôn» với «không phải lúc nào cũng». Tuy nhiên, «ở bên mình» không tự nhiên khi chủ ngữ là «các con» và làm mờ quan hệ trực tiếp «với các con» của μεθ’ ἑαυτῶν. Cần đổi thành «ở với các con».'
  naturalness: «Các con ... Thầy» là lối xưng hô trang trọng, dễ hiểu trong ngữ cảnh Đức Giê-su nói với các môn đồ. «Ở với các con» tự nhiên, rõ nghĩa hơn «ở bên mình» và vẫn giữ phép song hành của hai lần ἔχετε.
  terminology: «Người nghèo» chuyển đạt chính xác tính từ danh từ hóa πτωχούς. «Thầy» là cách tự xưng theo quan hệ giao tiếp phù hợp trong tiếng Việt, dù nguyên ngữ dùng đại từ ngôi thứ nhất; không thêm một khẳng định thần học nào. Chú thích thay thế «ở giữa các con» là khả dĩ cho ý hiện diện trong cộng đồng.
  issues:
  - severity: low
    issue: Cụm «ở bên mình» thiếu tự nhiên và có quy chiếu phản thân không rõ.
    rationale: μεθ’ ἑαυτῶν có nghĩa là «với/cùng các con», không phải vị trí không gian «bên mình». Trong tiếng Việt hiện đại, «ở với các con» diễn đạt trực tiếp và idiomatic hơn.
  revised_text: Vì các con luôn có người nghèo ở với các con[a], nhưng không phải lúc nào cũng có Thầy.
