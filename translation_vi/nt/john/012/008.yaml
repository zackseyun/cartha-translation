source:
  edition: SBLGNT
  text: τοὺς πτωχοὺς γὰρ πάντοτε ἔχετε μεθ’ ἑαυτῶν, ἐμὲ δὲ οὐ πάντοτε ἔχετε.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/008.yaml
  text: For you always have the poor with you[a], but you do not always have me.
translation:
  language: vi
  text: Vì các con luôn có người nghèo ở với các con[a], nhưng không phải lúc nào cũng có Thầy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “ở giữa các con.”'
    reason: Cụm Hy Lạp μεθ’ ἑαυτῶν chỉ sự hiện diện với, hoặc trong cộng đồng của, những người nghe.
lexical_decisions:
- source_word: πτωχούς
  choice: người nghèo
  rationale: Tính từ được dùng như danh từ, chỉ chung những người nghèo; “người nghèo” là cách nói tự nhiên và trang trọng trong tiếng Việt.
- source_word: γάρ
  choice: Vì
  rationale: Liên từ nêu lý do giải thích cho lời ngay trước đó; “Vì” giữ rõ quan hệ lập luận.
- source_word: πάντοτε
  choice: luôn / lúc nào cũng
  rationale: Hai cách diễn đạt tự nhiên tương ứng với hai lần xuất hiện; trong mệnh đề phủ định, “không phải lúc nào cũng” tránh cách nói gượng “không luôn luôn” mà vẫn giữ nguyên nghĩa.
- source_word: ἔχετε
  choice: có
  rationale: Trong ngữ cảnh, động từ nói đến sự hiện diện và gần gũi chứ không hàm ý sở hữu.
- source_word: μεθ’ ἑαυτῶν
  choice: ở bên mình
  rationale: Diễn đạt tự nhiên ý ở cùng, trong sự hiện diện của những người nghe; đại từ phản thân số nhiều được chuyển thành “mình” theo lối nói tiếng Việt.
- source_word: ἐμέ
  choice: Thầy
  rationale: Đại từ ngôi thứ nhất chỉ Đức Giê-su. Trong lời Đức Giê-su nói với các môn đồ, “Thầy” là đại từ tự xưng tự nhiên, trang trọng và biểu đạt đúng quan hệ giao tiếp.
- source_word: δέ
  choice: nhưng
  rationale: Nêu rõ sự tương phản giữa việc người nghèo luôn ở bên các môn đồ và thời gian Đức Giê-su hiện diện với họ có giới hạn.
- source_word: οὐ πάντοτε
  choice: không phải lúc nào cũng
  rationale: Cách phủ định tự nhiên trong tiếng Việt, giữ được ý rằng sự hiện diện ấy không kéo dài mãi.
theological_decisions:
- issue: Nguy cơ dùng lời này để xem nhẹ việc chăm sóc người nghèo
  choice: Giữ nguyên sự tương phản về sự hiện diện và thời điểm, không thêm ý rằng người nghèo kém quan trọng.
  alternative: Diễn giải rằng người nghèo ít quan trọng hơn Đức Giê-su, hoặc làm nhẹ sự tương phản trong nguyên văn.
  rationale: Câu Hy Lạp nói rằng người nghèo luôn ở bên các môn đồ, còn sự hiện diện của Đức Giê-su với họ thì không kéo dài mãi. Bản dịch giữ nguyên sức căng này mà không đưa thêm một phán đoán thần học về giá trị của người nghèo.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “các con—Thầy” phù hợp lời Đức Giê-su nói với các môn đồ; “ở bên mình” tự nhiên hơn lối dịch máy móc “với chính các con.”
