revisions:
- from: 'Vậy, những người ấy đến gặp Phi-líp, người quê ở Bết-sai-đa thuộc miền Ga-li-lê, và thưa hỏi ông: “Thưa ông,[a] chúng tôi muốn gặp Đức Giê-su.”'
  to: 'Vậy, những người ấy đến gặp Phi-líp, người từ Bết-sai-đa, miền Ga-li-lê, và họ xin ông: “Thưa ông,[a] chúng tôi muốn được thấy Đức Giê-su.”'
  rationale: Bản sửa giữ cấu trúc và nội dung của câu, đồng thời dùng “muốn được thấy” để phản ánh trực tiếp ἰδεῖν, thay “người quê ở” bằng cách nhận diện trung tính hơn cho ἀπό, và làm câu kể tự nhiên hơn. Chú thích tiếp tục bảo toàn khả năng “Chúa” của κύριε mà không áp đặt cách hiểu thần học vào lời xưng hô với Phi-líp.
