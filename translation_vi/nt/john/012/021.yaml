id: JHN.12.21
reference: John 12:21
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οὗτοι οὖν προσῆλθον Φιλίππῳ τῷ ἀπὸ Βηθσαϊδὰ τῆς Γαλιλαίας, καὶ ἠρώτων αὐτὸν λέγοντες· Κύριε, θέλομεν τὸν Ἰησοῦν ἰδεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/021.yaml
  text: So these came to Philip[a], who was from Bethsaida in Galilee, and were asking him, saying, “Lord, we want to see Jesus.”
translation:
  language: vi
  text: 'Vậy, những người ấy đến gặp Phi-líp, người từ Bết-sai-đa, miền Ga-li-lê, và họ xin ông: “Thưa ông,[a] chúng tôi muốn được thấy Đức Giê-su.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hy Lạp κύριε cũng có thể dịch là “Chúa”. Từ này có thể là danh xưng “Chúa” hoặc là cách xưng hô kính trọng với một người; ở đây lời nói hướng đến Phi-líp.
    reason: Giữ sự đa nghĩa của κύριε và giải thích lựa chọn “Thưa ông” trong ngữ cảnh.
lexical_decisions:
- source_word: οὗτοι οὖν
  choice: Vậy, những người ấy
  rationale: “Những người ấy” giữ rõ liên hệ với những người Hy Lạp ở câu trước; “vậy” chuyển tải chức năng nối tiếp của οὖν trong mạch kể.
- source_word: προσῆλθον Φιλίππῳ
  choice: đến gặp Phi-líp
  rationale: Diễn đạt tự nhiên hành động đến gần hoặc tìm đến Phi-líp.
- source_word: τῷ ἀπὸ Βηθσαϊδὰ τῆς Γαλιλαίας
  choice: người quê ở Bết-sai-đa thuộc miền Ga-li-lê
  rationale: Mệnh đề quan hệ tự nhiên trong tiếng Việt, đồng thời giữ thông tin nhận diện và địa lý của nguyên văn.
- source_word: ἠρώτων αὐτὸν λέγοντες
  choice: thưa hỏi ông
  rationale: “Thưa hỏi” vừa thể hiện lời yêu cầu kính trọng vừa phù hợp với thể chưa hoàn thành của ἠρώτων; không cần dịch máy móc phân từ λέγοντες bằng “nói rằng”.
- source_word: Κύριε
  choice: Thưa ông
  rationale: Trong ngữ cảnh, người Hy Lạp đang trực tiếp nói với Phi-líp, nên đây hợp lý nhất là cách xưng hô kính trọng. Nghĩa từ vựng “Chúa” được giữ trong chú thích để phản ánh độ mở của từ Hy Lạp.
- source_word: θέλομεν
  choice: chúng tôi muốn
  rationale: Cách nói hiện đại, trực tiếp, giữ nghĩa mong muốn hoặc có ý định của θέλω.
- source_word: τὸν Ἰησοῦν ἰδεῖν
  choice: muốn gặp Đức Giê-su
  rationale: ἰδεῖν có nghĩa đen là “thấy”, nhưng trong lời xin tiếp cận một người, “gặp” là cách diễn đạt tự nhiên trong tiếng Việt và không thêm mục đích như “nói chuyện với”. “Đức Giê-su” là cách gọi kính trọng, tự nhiên trong văn phong Kinh Thánh tiếng Việt.
theological_decisions:
- issue: Cách dịch κύριε khi lời này hướng đến Phi-líp
  choice: Thưa ông
  alternative: Chúa
  rationale: Người được xưng hô trực tiếp là Phi-líp, vì thế từ này nhiều khả năng là lối gọi lịch sự chứ không phải một lời tuyên xưng thần học. Chú thích giữ nghĩa “Chúa” có thể có về mặt từ vựng, không xóa bỏ sự đa nghĩa của nguyên văn.
- issue: Ý nghĩa của ἰδεῖν trong lời xin
  choice: gặp
  alternative: thấy
  rationale: Ngữ cảnh cho thấy họ xin được tiếp cận Đức Giê-su; “gặp” là tiếng Việt tự nhiên. Tuy nhiên, không mở rộng thành “thưa chuyện” hay “nói chuyện”, vì nguyên văn không nêu rõ mục đích ấy.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “thưa hỏi” để thể hiện thái độ kính trọng; các địa danh và tên riêng được phiên âm theo lối quen thuộc trong Kinh Thánh tiếng Việt. Dấu chú thích [a] được đặt ngay sau cụm từ mà chú thích giải thích.
