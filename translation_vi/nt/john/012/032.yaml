  source_fidelity: 'Bản nháp truyền đạt đúng cấu trúc chính: κἀγώ được nhấn nhẹ bằng “Còn tôi,” ἐὰν được diễn đạt theo lực ngữ cảnh là “khi,” πάντας là “mọi người,” và ἑλκύσω là “sẽ kéo.” Tuy nhiên, “được treo lên” quy định hóa ὑψωθῶ quá trực tiếp theo hành vi đóng đinh, trong khi động từ Giăng cố ý giữ song nghĩa giữa được nâng lên trên thập tự giá và được tôn cao. “Được nâng lên” bảo toàn tốt hơn sự mơ hồ này; chú thích vẫn giải thích bình diện đóng đinh và tôn cao.'
