base_translation:
  language: en
  yaml_path: translation/nt/john/012/032.yaml
  text: And I[a], when I am lifted up from the earth[c][b], will draw all people to myself.
translation:
  language: vi
  text: Còn tôi, khi được nâng lên khỏi đất[a], sẽ kéo mọi người đến với chính mình.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “nếu được nâng lên khỏi đất.” Nguyên văn dùng cấu trúc điều kiện; tuy nhiên, trong mạch văn, Chúa Giê-su nói về cái chết sắp xảy ra như một điều chắc chắn. “Được nâng lên” cũng có thể mang nghĩa “được tôn cao,” giữ lại nghĩa kép về sự đóng đinh và sự vinh hiển trong sách Giăng.'
    reason: alternative_reading_and_lexical_alternative
  - marker: b
    text: Nguyên văn có thể dịch sát là “tất cả”; ở đây từ này tự nhiên chỉ mọi người. Câu này không tự giải quyết các tranh luận thần học về phạm vi hay kết quả cuối cùng của sự cứu rỗi.
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀγὼ
  choice: Còn tôi
  rationale: Dạng rút gọn của καί + ἐγώ vừa nối tiếp mạch văn vừa nhấn nhẹ vào chủ thể; “Còn tôi” tự nhiên trong tiếng Việt và giữ được sắc thái ấy.
- source_word: ἐὰν
  choice: khi
  rationale: Dù ἐάν với giả định thức có hình thức điều kiện, trong mạch văn sự kiện được nói đến là cái chết sắp xảy ra và được trình bày như chắc chắn; “khi” diễn đạt tự nhiên lực ngữ cảnh. Chú thích ghi nhận cách dịch sát hình thức là “nếu”.
- source_word: ὑψωθῶ
  choice: được treo lên
  rationale: Trong Giăng, động từ này gợi đồng thời việc Chúa Giê-su bị đưa lên cao trên thập tự giá và được tôn cao. “Được treo lên” làm rõ hình ảnh trong ngữ cảnh nhưng vẫn cần chú thích để bảo toàn lớp nghĩa tôn cao.
- source_word: ἐκ τῆς γῆς
  choice: khỏi mặt đất
  rationale: Ở đây γῆ chỉ mặt đất, nơi Chúa Giê-su được nâng lên khỏi đó khi chịu đóng đinh; cách nói này tự nhiên và cụ thể trong tiếng Việt.
- source_word: πάντας
  choice: mọi người
  rationale: Tính từ số nhiều giống đực được dùng độc lập, tự nhiên chỉ con người. “Mọi người” giữ phạm vi rộng mà không tự quyết định các tranh luận thần học về kết quả cứu rỗi.
- source_word: ἑλκύσω
  choice: sẽ kéo
  rationale: ἕλκω có nghĩa kéo hoặc lôi về phía mình. “Kéo” giữ được lực của động từ nguồn tốt hơn “thu hút” mà không giải thích quá mức cơ chế của hành động.
- source_word: πρὸς ἐμαυτόν
  choice: đến với chính mình
  rationale: Đại từ phản thân ἐμαυτόν có sắc thái nhấn mạnh hơn đại từ đơn; “chính mình” bảo toàn sự nhấn mạnh đó.
theological_decisions:
- issue: Phạm vi của πάντας trong liên hệ với sự cứu rỗi
  choice: mọi người
  alternative: tất cả; mọi hạng người; mọi người không trừ ai
  rationale: Ngữ pháp tự nhiên hướng đến con người chứ không phải mọi vật. Bản dịch giữ nguyên bề rộng của lời tuyên bố nhưng không áp đặt kết luận về việc “mọi” chỉ từng cá nhân hay mọi nhóm người, cũng không đồng nhất hành động kéo với kết quả cứu rỗi cuối cùng.
- issue: Nghĩa kép của ὑψωθῶ trong sách Giăng
  choice: được treo lên, kèm chú thích về nghĩa “được tôn cao”
  alternative: được nâng lên; được tôn cao
  rationale: Ngữ cảnh kế tiếp liên hệ trực tiếp lời này với cách Chúa Giê-su sẽ chết, trong khi cách dùng của Giăng cũng gắn sự chịu đóng đinh với sự tôn cao. Chú thích bảo toàn cả hai bình diện.
- issue: Hình thức điều kiện ἐὰν và tính chắc chắn trong mạch văn
  choice: khi
  alternative: nếu
  rationale: “Khi” phản ánh sự kiện sắp đến được trình bày như chắc chắn trong câu chuyện, còn chú thích giữ cho người đọc biết nguyên văn dùng cấu trúc có thể dịch là “nếu”.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Còn tôi” giữ liên kết cùng sự nhấn mạnh của câu; “kéo” bảo toàn sức của động từ Hy Lạp. Các chú thích ghi nhận hình thức điều kiện, nghĩa kép của “treo lên/tôn cao,” và độ rộng không được giải quyết thêm của “mọi người.”
