  source_fidelity: 'Bản dịch giữ đúng các yếu tố chính của nguyên văn: liên từ suy luận οὖν (“Vì vậy”), ý tương hỗ của πρὸς ἑαυτούς (“nói với nhau”), lời nhận xét ngôi thứ hai số nhiều, sắc thái vô hiệu của οὐκ ὠφελεῖτε οὐδέν, lời thu hút chú ý ἴδε, và hình ảnh κόσμος ὀπίσω αὐτοῦ ἀπῆλθεν. “Cả thế gian” bảo toàn cách nói cường điệu của κόσμος mà không diễn giải thành một khẳng định theo nghĩa đen.'
  naturalness: Câu văn tự nhiên, rõ ràng và phù hợp tiếng Việt hiện đại. “Các ông thấy đó” và “Kìa” diễn tả hợp lý giọng bực bội, bất lực của nhóm người Pha-ri-si. “Đã đi theo ông ấy rồi” cũng truyền được kết quả đang hiển nhiên trong ngữ cảnh.
  terminology: “Pha-ri-si” là dạng phiên âm quen thuộc; “thế gian” phù hợp với từ vựng Giăng và giữ được cộng hưởng của κόσμος. Cách gọi “ông ấy” thích hợp trong lời thuật lại trực tiếp của các người Pha-ri-si, không áp đặt cách xưng hô tôn kính của người kể chuyện.
