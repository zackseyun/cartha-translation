id: JHN.12.19
reference: John 12:19
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οἱ οὖν Φαρισαῖοι εἶπαν πρὸς ἑαυτούς· Θεωρεῖτε ὅτι οὐκ ὠφελεῖτε οὐδέν· ἴδε ὁ ⸀κόσμος ὀπίσω αὐτοῦ ἀπῆλθεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/019.yaml
  text: So the Pharisees said to one another[a], “You see that you are accomplishing nothing. Look—the world has gone after him.”
translation:
  language: vi
  text: 'Vì vậy, những người Pha-ri-si nói với nhau: “Các ông thấy đó, các ông không làm được gì cả. Kìa, cả thế gian[a] đã đi theo ông ấy rồi!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “mọi người đều đã đi theo ông ấy.” Tiếng Hy Lạp viết là “thế gian”, có lẽ là cách nói phóng đại.'
    reason: Nêu cách diễn đạt tương đương theo ngữ cảnh nhưng vẫn giải thích vì sao bản văn chính giữ hình ảnh của nguyên ngữ.
lexical_decisions:
- source_word: οὖν
  choice: Vì vậy
  rationale: Diễn tả quan hệ suy luận hoặc kết quả với cảnh ngay trước đó, đồng thời tự nhiên trong tiếng Việt hiện đại.
- source_word: πρὸς ἑαυτούς
  choice: nói với nhau
  rationale: 'Cụm từ mang nghĩa tương hỗ trong ngữ cảnh: những người Pha-ri-si trao đổi với nhau trong nhóm.'
- source_word: Θεωρεῖτε
  choice: Các ông thấy đó
  rationale: Giữ dạng chỉ định hiện tại số nhiều và sắc thái bực bội, nhấn mạnh một thực tế mà người nghe có thể nhận thấy.
- source_word: οὐκ ὠφελεῖτε οὐδέν
  choice: các ông không làm được gì cả
  rationale: Truyền đạt tự nhiên ý nghĩa rằng những nỗ lực của họ hoàn toàn không đem lại kết quả, đồng thời giữ ngôi thứ hai số nhiều của nguyên văn.
- source_word: ἴδε
  choice: Kìa
  rationale: Giữ chức năng thu hút sự chú ý và sắc thái cảm thán đột ngột của lời nói.
- source_word: κόσμος
  choice: cả thế gian
  rationale: Giữ hình ảnh theo nguyên văn Hy Lạp và sắc thái cường điệu trong lời than phiền, thay vì thu hẹp ngay thành “mọi người” hoặc “đám đông”.
- source_word: ὀπίσω αὐτοῦ
  choice: đi theo ông ấy
  rationale: Diễn đạt thành ngữ chỉ việc đi theo một người; “ông ấy” phù hợp với lời của những người Pha-ri-si khi nói về Đức Chúa Giê-su.
- source_word: ἀπῆλθεν
  choice: đã đi
  rationale: Diễn tả hành động đã xảy ra với kết quả đang hiển hiện trước mắt những người nói.
theological_decisions:
- issue: Phạm vi của κόσμος trong lời những người Pha-ri-si
  choice: Giữ “cả thế gian” như một cách nói cường điệu.
  alternative: “mọi người đều đã đi theo ông ấy” hoặc “cả đám đông đã đi theo ông ấy”
  rationale: Lời nói thể hiện sự bực bội và phóng đại, không phải một khẳng định giáo lý rằng mọi người trên thế giới đều trở thành môn đồ. Cách dịch này vừa giữ từ ngữ và âm hưởng của nguyên văn vừa không âm thầm thu hẹp phạm vi.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Các ông thấy đó” cùng “Kìa” giữ sắc thái bực bội, đầy kịch tính của lời đối thoại; “Pha-ri-si” dùng dạng phiên âm quen thuộc trong tiếng Việt.
