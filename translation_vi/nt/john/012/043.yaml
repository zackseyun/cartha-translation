  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἠγάπησαν γὰρ τὴν δόξαν τῶν ἀνθρώπων μᾶλλον ἤπερ τὴν δόξαν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/043.yaml
  text: For they loved the glory of men rather than the glory of God[a].
translation:
  language: vi
  text: Vì họ yêu vinh quang của loài người hơn vinh quang của Đức Chúa Trời.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “sự tán thưởng của loài người” hoặc “vinh quang đến từ loài người hơn vinh quang đến từ Đức Chúa Trời.”'
    reason: Nêu nghĩa hẹp khả hữu của δόξα và khả năng hiểu thuộc cách là nguồn phát sinh, trong khi chính văn giữ từ “vinh quang” cùng cấu trúc song song.
lexical_decisions:
- source_word: ἠγάπησαν
  choice: họ yêu
  rationale: Động từ aorist chủ động, ngôi ba số nhiều của ἀγαπάω. “Yêu” giữ được sức nặng ý chí và liên hệ từ vựng của nguyên bản; ý ưa chuộng hơn đã được cụm so sánh diễn đạt.
- source_word: γὰρ
  choice: Vì
  rationale: γάρ nêu lý do cho lời khẳng định ngay trước đó; “Vì” nối kết nhân quả tự nhiên và trang trọng trong tiếng Việt.
- source_word: δόξαν
  choice: vinh quang
  rationale: δόξα có thể chỉ vinh quang, danh dự, lời khen hay sự tán thưởng. “Vinh quang” giữ nguyên sự lặp từ và âm hưởng thần học trong Giăng, không thu hẹp nghĩa quá mức.
- source_word: τῶν ἀνθρώπων
  choice: của loài người
  rationale: ἄνθρωποι ở đây chỉ con người nói chung, không riêng nam giới. “Của loài người” giữ kết cấu sở hữu/nguồn gốc có thể có của thuộc cách và tạo thế song song với “của Đức Chúa Trời”.
- source_word: μᾶλλον ἤπερ
  choice: hơn
  rationale: Cặp so sánh biểu thị việc coi trọng đối tượng này hơn đối tượng kia; cấu trúc “yêu X hơn Y” tự nhiên trong tiếng Việt và vẫn giữ được sắc thái lựa chọn.
- source_word: τοῦ θεοῦ
  choice: của Đức Chúa Trời
  rationale: Cách dịch giữ thế song song với “của loài người” và không quyết định dứt khoát thuộc cách là sở hữu hay nguồn phát sinh.
theological_decisions:
- issue: Nghĩa của δόξα trong sự tương phản giữa con người và Đức Chúa Trời
  choice: vinh quang
  alternative: lời khen; danh dự; sự tán thưởng
  rationale: “Vinh quang” bảo tồn tính liên tục từ vựng và thần học của δόξα trong sách Giăng. Các cách dịch khác có thể phù hợp theo ngữ cảnh nhưng thu hẹp trường nghĩa sang sự công nhận hay khen ngợi.
- issue: Quan hệ thuộc cách trong τῶν ἀνθρώπων và τοῦ θεοῦ
  choice: của loài người / của Đức Chúa Trời
  alternative: đến từ loài người / đến từ Đức Chúa Trời
  rationale: “Của” giữ được sự mơ hồ chân thực giữa vinh quang thuộc về một chủ thể và vinh quang do chủ thể ấy ban hoặc phát sinh, đồng thời bảo tồn cấu trúc song song của nguyên văn.
- issue: Phạm vi chỉ người của ἀνθρώπων
  choice: loài người
  alternative: người ta; con người
  rationale: Trong ngữ cảnh, từ này chỉ con người nói chung. “Loài người” truyền đạt rõ phạm vi phổ quát và tránh cách hiểu chỉ nam giới.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ sự lặp lại của “vinh quang” cùng thế đối xứng trong câu Hy Lạp; dùng “loài người” theo nghĩa bao quát.
