  text: εἶπεν οὖν ὁ Ἰησοῦς· Ἄφες αὐτήν, ⸀ἵνα εἰς τὴν ἡμέραν τοῦ ἐνταφιασμοῦ μου ⸀τηρήσῃ αὐτό·
base_translation:
  language: en
  yaml_path: translation/nt/john/012/007.yaml
  text: So Jesus said[a], “Leave her alone[b], so that she may keep it for the day of my burial.”
translation:
  language: vi
  text: Vì vậy, Đức Chúa Jêsus phán:[a] “Hãy để cô ấy yên[b], để cô ấy giữ lại dầu thơm ấy cho ngày mai táng Ta.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Hãy để cô ấy yên; cô ấy đã giữ lại dầu thơm ấy cho ngày mai táng Ta.” Một số người hiểu mệnh đề này là nói về điều cô ấy đã làm, thay vì điều cô ấy còn có thể làm.'
    reason: alternative_reading
  - marker: b
    text: 'Cũng có thể dịch: “Hãy để cô ấy yên, để cô ấy giữ lại dầu thơm ấy cho đến ngày mai táng Ta.” Cấu trúc Hy Lạp cũng có thể được hiểu với ý nghĩa thời gian rõ hơn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Vì vậy
  rationale: Diễn tả sự tiếp nối có tính suy luận trong lời kể; cách nói tự nhiên và vẫn giữ quan hệ với câu trước.
- source_word: Ἄφες αὐτήν
  choice: Hãy để cô ấy yên
  rationale: Mệnh lệnh này theo ngữ cảnh có nghĩa là đừng can thiệp hay quấy rầy người phụ nữ.
- source_word: ἵνα
  choice: để
  rationale: Giữ quan hệ mục đích hoặc kết quả dự định mà không diễn giải quá mức.
- source_word: εἰς τὴν ἡμέραν
  choice: cho ngày
  rationale: Chỉ dịp tương lai được nhắm tới; “cho ngày” không buộc cấu trúc phải mang nghĩa thời gian rõ hơn là “cho đến ngày”.
- source_word: ἐνταφιασμοῦ
  choice: mai táng
  rationale: Từ chỉ việc chôn cất; “mai táng” trang trọng, rõ nghĩa và tự nhiên trong văn cảnh.
- source_word: τηρήσῃ
  choice: giữ
  rationale: Giữ nghĩa bảo lưu hoặc dành lại. Thể giả định sau ἵνα được chuyển thành mệnh đề với “để”; cách hiểu khác được nêu trong chú thích.
- source_word: αὐτό
  choice: vật này
  rationale: Đại từ giống trung chỉ dầu thơm đã được nhắc đến. “Vật này” giữ hình thức quy chiếu mà vẫn rõ ràng hơn đại từ “nó” trong tiếng Việt.
theological_decisions:
- issue: Quan hệ giữa hành động xức dầu và ngày mai táng của Đức Chúa Jêsus
  choice: Chuyển câu theo hướng Đức Chúa Jêsus bảo để người phụ nữ giữ vật ấy cho ngày mai táng Ngài.
  alternative: “Hãy để cô ấy yên; cô ấy đã giữ vật này cho ngày mai táng Ta”, hoặc “Hãy để cô ấy yên, để cô ấy giữ vật này cho đến ngày mai táng Ta.”
  rationale: Cấu trúc Hy Lạp khó và có thể được hiểu theo nhiều cách. Bản chính giữ cách đọc hướng tới tương lai, còn các khả năng thật sự khác được bảo tồn trong chú thích, không dùng bản dịch để giải quyết dứt khoát sự căng thẳng.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “Đức Chúa Jêsus” và đại từ tự xưng “Ta” phù hợp văn phong Kinh Thánh; giữ câu ngắn, trực tiếp và bảo tồn sự mơ hồ cú pháp bằng chú thích.
