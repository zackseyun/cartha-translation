  source_fidelity: Bản dịch phản ánh đúng mạch nối của οὖν, mệnh lệnh Ἄφες αὐτήν, và mệnh đề mục đích/hướng đến tương lai với ἵνα ... τηρήσῃ. Tuy nhiên, “vật này” là quy chiếu quá chung và không tự nhiên cho αὐτό, vốn trong ngữ cảnh trực tiếp chỉ dầu thơm. “Giữ lại dầu thơm ấy” diễn đạt rõ chức năng bảo lưu của τηρέω mà không giải quyết thay sự mơ hồ cú pháp.
  naturalness: “Hãy để cô ấy yên” và “ngày mai táng Ta” phù hợp văn phong Kinh Thánh hiện đại. Thay “vật này” bằng “dầu thơm ấy” giúp câu tiếng Việt tự nhiên và mạch lạc hơn. Đặt các ký hiệu chú thích sát thành phần được chú giải giúp người đọc nhận rõ phạm vi của từng phương án.
