id: JHN.12.36
reference: John 12:36
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸀ὡς τὸ φῶς ἔχετε, πιστεύετε εἰς τὸ φῶς, ἵνα υἱοὶ φωτὸς γένησθε. Ταῦτα ⸀ἐλάλησεν Ἰησοῦς, καὶ ἀπελθὼν ἐκρύβη ἀπ’ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/036.yaml
  text: While you have the light[a], believe in the light, so that you may become sons of light. Jesus spoke these things[b], and he departed and hid from them.
translation:
  language: vi
  text: Khi còn có ánh sáng, hãy tin vào ánh sáng, để trở nên con cái của ánh sáng.[a] Đức Chúa Jêsus phán những điều ấy, rồi Ngài rời đi và ẩn mình khỏi họ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hy Lạp: “các con trai của ánh sáng,” một thành ngữ chỉ những người thuộc về hoặc mang đặc tính của ánh sáng.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch sát cấu trúc Hy Lạp: “và sau khi rời đi, Ngài ẩn mình khỏi họ.”'
    reason: previous_rendering
lexical_decisions:
- source_word: ὡς τὸ φῶς ἔχετε
  choice: Trong khi các con còn có ánh sáng
  rationale: ὡς với động từ hiện tại mang nghĩa thời gian, “trong khi.” Từ “còn” diễn đạt tự nhiên tính hữu hạn và cấp bách của cơ hội mà không biến câu thành lời giải nghĩa.
- source_word: τὸ φῶς
  choice: ánh sáng
  rationale: Giữ nguyên hình ảnh chủ đạo của Phúc Âm Giăng, có thể đồng thời mang sắc thái biểu tượng và quy chiếu đến Đức Chúa Jêsus.
- source_word: πιστεύετε εἰς τὸ φῶς
  choice: hãy tin vào ánh sáng
  rationale: Mệnh lệnh hiện tại được chuyển bằng “hãy tin”; “tin vào” phản ánh trực tiếp cấu trúc πιστεύω εἰς quen thuộc trong Giăng.
- source_word: ἵνα ... γένησθε
  choice: để ... trở nên
  rationale: “Để” giữ lực mục đích của ἵνα, còn “trở nên” bảo toàn ý chuyển thành trạng thái mới của γίνομαι.
- source_word: υἱοὶ φωτός
  choice: con cái của ánh sáng
  rationale: Đây là thành ngữ Semit chỉ những người thuộc về hoặc mang đặc tính của ánh sáng. Trong tiếng Việt, “con cái” truyền đạt tự nhiên phạm vi đại diện của số nhiều υἱοί mà không giới hạn đối tượng vào nam giới; dạng sát chữ được ghi chú.
- source_word: Ταῦτα ἐλάλησεν Ἰησοῦς
  choice: Đức Chúa Jêsus phán những điều ấy
  rationale: “Phán” là cách diễn đạt trang trọng, tự nhiên khi Đức Chúa Jêsus nói; “những điều ấy” giữ đại từ chỉ định số nhiều Ταῦτα.
- source_word: ἀπελθὼν ἐκρύβη ἀπ’ αὐτῶν
  choice: rồi Ngài rời đi và ẩn mình khỏi họ
  rationale: “Rồi” thể hiện trình tự của phân từ bất định ἀπελθών trước động từ chính. “Ẩn mình” phù hợp cách dùng có nghĩa trung động của hình thức ἐκρύβη trong văn cảnh.
theological_decisions:
- issue: Cách diễn đạt υἱοὶ φωτός
  choice: con cái của ánh sáng
  alternative: các con trai của ánh sáng
  rationale: Danh từ Hy Lạp mang hình thức giống đực, nhưng cả cụm là thành ngữ chỉ những người được ánh sáng định hình. Bản chính dùng cách nói tự nhiên và bao quát trong tiếng Việt, đồng thời chú thích dạng sát chữ để không che khuất hình thức nguồn.
- issue: Ý nghĩa của “ánh sáng”
  choice: giữ nguyên “ánh sáng” mà không giải thích ngay trong câu
  alternative: diễn giải trực tiếp là Đức Chúa Jêsus
  rationale: Văn bản duy trì sự cộng hưởng giữa hình ảnh ánh sáng và ý nghĩa Kitô học; việc thay bằng tên riêng sẽ giải quyết quá mức điều câu văn để ở dạng hình tượng.
- issue: πιστεύω εἰς trong văn phong Giăng
  choice: tin vào ánh sáng
  alternative: đặt lòng tin nơi ánh sáng
  rationale: “Tin vào” vừa trực tiếp vừa quen thuộc, không thêm sắc thái thần học vượt quá cấu trúc Hy Lạp.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “các con” vì Đức Chúa Jêsus đang trực tiếp nói với đám đông, “Ngài” để chỉ Đức Chúa Jêsus, và “phán” theo văn phong Kinh Thánh tiếng Việt. Các dấu chú thích [a], [b] đều xuất hiện trong bản văn.
