  terminology: “Ánh sáng,” “tin vào,” “trở nên,” và “con cái của ánh sáng” truyền đạt tốt mô-típ Giăng cùng thành ngữ υἱοὶ φωτός. Giữ tên gọi và cách xưng hô kính trọng đã có của bản thảo để nhất quán nội bộ; không cần diễn giải “ánh sáng” thành một tên riêng.
