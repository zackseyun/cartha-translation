  source_fidelity: 'Bản dịch giữ tốt các yếu tố chính: mệnh lệnh πιστεύετε, mục đích ἵνα, sắc thái trở thành của γένησθε, và chuỗi hành động “rời đi ... ẩn mình” của ἀπελθὼν ἐκρύβη. Tuy nhiên, “các con” thêm một quan hệ xưng hô cha-con không được nêu trong nguyên văn, vốn chỉ dùng số nhiều ngôi thứ hai để nói với đám đông.'
