  source_fidelity: 'Bản dịch truyền đạt đúng cấu trúc và nội dung Hy Lạp: đám đông đáp lại Chúa Giê-su, viện dẫn Luật Pháp, nêu sự căng thẳng giữa Đấng Mê-si còn mãi và việc Con Người phải được giương cao, rồi hỏi về căn tính của Con Người. “Được giương cao” bảo toàn cách diễn đạt có chủ ý đa tầng của ὑψωθῆναι. Tuy nhiên, “tồn tại đời đời” thiên về sự hiện hữu nói chung, trong khi μένει nhấn mạnh sự còn lại/tiếp tục tồn tại; “còn mãi mãi” phản ánh sát và tự nhiên hơn.'
