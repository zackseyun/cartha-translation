id: JHN.12.34
reference: John 12:34
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀπεκρίθη ⸀οὖν αὐτῷ ὁ ὄχλος· Ἡμεῖς ἠκούσαμεν ἐκ τοῦ νόμου ὅτι ὁ χριστὸς μένει εἰς τὸν αἰῶνα, καὶ πῶς ⸂λέγεις σὺ⸃ ⸀ὅτι δεῖ ὑψωθῆναι τὸν υἱὸν τοῦ ἀνθρώπου; τίς ἐστιν οὗτος ὁ υἱὸς τοῦ ἀνθρώπου;
base_translation:
  language: en
  yaml_path: translation/nt/john/012/034.yaml
  text: So the crowd answered him[a], "We have heard from the Law that the Messiah remains forever[b], and how can you say that the Son of Man must be lifted up? Who is this Son of Man?"
translation:
  language: vi
  text: 'Vậy, đám đông đáp lời Ngài: “Chúng tôi đã nghe trong Luật Pháp rằng Đấng Mê-si còn mãi mãi. Thế sao Ngài lại nói Con Người phải được giương cao[a]? Con Người ấy là ai?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “được tôn cao”. Trong sách Giăng, “được giương cao” có thể đồng thời chỉ việc được nâng lên theo nghĩa đen và được tôn cao.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη οὖν αὐτῷ ὁ ὄχλος
  choice: Vậy, đám đông đáp lời Ngài
  rationale: “Vậy” giữ lực nối tiếp/suy luận của οὖν; “đám đông” diễn đạt tự nhiên ὁ ὄχλος; “đáp lời Ngài” phản ánh αὐτῷ mà vẫn trang trọng, dễ hiểu.
- source_word: Ἡμεῖς ἠκούσαμεν ἐκ τοῦ νόμου
  choice: Chúng tôi đã nghe trong Luật Pháp
  rationale: “Đã nghe” diễn tả lời dạy được tiếp nhận; “trong Luật Pháp” là cách nói tự nhiên bằng tiếng Việt và vẫn giữ khuôn khổ Kinh Thánh Do Thái của νόμος.
- source_word: ὁ χριστός
  choice: Đấng Mê-si
  rationale: Ở đây Χριστός là tước hiệu của nhân vật được mong đợi, nên “Đấng Mê-si” giữ rõ bối cảnh Do Thái hơn cách phiên âm “Christ”.
- source_word: μένει εἰς τὸν αἰῶνα
  choice: tồn tại đời đời
  rationale: Diễn đạt rõ ý tiếp tục hiện hữu vĩnh viễn của μένει εἰς τὸν αἰῶνα trong tiếng Việt hiện đại.
- source_word: πῶς λέγεις σὺ
  choice: Thế sao Ngài lại nói
  rationale: Cách hỏi này thể hiện sắc thái ngạc nhiên và chất vấn trong πῶς, đồng thời “lại” làm rõ sự tương phản với điều đám đông vừa viện dẫn.
- source_word: δεῖ ὑψωθῆναι
  choice: phải được giương cao
  rationale: “Phải” giữ ý tất yếu của δεῖ; “được giương cao” không thu hẹp ὑψωθῆναι chỉ vào đóng đinh hay chỉ vào sự tôn cao, nhờ đó bảo toàn nghĩa kép trong Giăng.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: Con Người
  rationale: Cách gọi quen thuộc và trang trọng cho tước hiệu này, giữ được âm hưởng Đa-ni-ên và chức năng tự xưng trong văn mạch.
- source_word: τίς ἐστιν οὗτος ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Con Người ấy là ai?
  rationale: Trật tự tiếng Việt tự nhiên; “ấy” thể hiện sắc thái chỉ định của οὗτος và câu hỏi cho thấy đám đông muốn xác định nhân vật được nói đến.
theological_decisions:
- issue: Cách dịch Χριστός
  choice: Đấng Mê-si
  alternative: Đấng Christ
  rationale: Danh từ có mạo từ và hoạt động như một tước hiệu trong lời tuyên bố “tồn tại đời đời”; “Đấng Mê-si” làm rõ khung kỳ vọng Do Thái mà không thêm một cách giải nghĩa hệ phái.
- issue: Nghĩa của ὑψωθῆναι trong Giăng
  choice: được giương cao
  alternative: được tôn cao
  rationale: Động từ mang sự căng thẳng có chủ ý giữa việc được nâng lên về thể lý trong sự đóng đinh và được tôn cao. Bản dịch chính giữ hình ảnh nâng lên, còn chú thích nêu nghĩa lớp thứ hai.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “Ngài” trong lời đám đông nói trực tiếp với Chúa Giê-su; viết hoa các tước hiệu “Đấng Mê-si” và “Con Người”. Dấu chú thích [a] được đặt ngay sau cụm từ mà nó giải thích.
