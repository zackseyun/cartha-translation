- from: Ban đầu, các môn đồ của Đức Chúa Jêsus không hiểu những điều này[a]. Nhưng khi Ngài được tôn vinh[b], họ mới nhớ ra rằng những điều ấy đã được chép về Ngài[c], và người ta đã làm những điều ấy cho Ngài.
  to: Ban đầu, các môn đệ của Giê-su không hiểu những điều này[a]. Nhưng khi Giê-su được tôn vinh[b], họ mới nhớ ra rằng những điều này đã được chép về Người[c], và người ta đã làm những điều này đối với Người.
