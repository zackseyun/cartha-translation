  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸀ταῦτα οὐκ ἔγνωσαν ⸂αὐτοῦ οἱ μαθηταὶ⸃ τὸ πρῶτον, ἀλλ’ ὅτε ἐδοξάσθη Ἰησοῦς τότε ἐμνήσθησαν ὅτι ταῦτα ἦν ἐπ’ αὐτῷ γεγραμμένα καὶ ταῦτα ἐποίησαν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/016.yaml
  text: His disciples did not understand these things at first[a], but when Jesus was glorified[c][b], then they remembered that these things had been written about him and that they had done these things to him.
translation:
  language: vi
  text: Ban đầu, các môn đệ của Giê-su không hiểu những điều này[a]. Nhưng khi Giê-su được tôn vinh[b], họ mới nhớ ra rằng những điều này đã được chép về Người[c], và người ta đã làm những điều này đối với Người.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “không biết những điều này.”'
    reason: lexical_alternative
  - marker: b
    text: Trong sách Giăng, việc Giê-su “được tôn vinh” thường gắn với sự chết, sự phục sinh và sự thăng thiên của Người.
    reason: cross_reference
  - marker: c
    text: 'Hay: “đã được chép liên quan đến Người.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔγνωσαν
  choice: không hiểu
  rationale: Trong ngữ cảnh, các môn đồ chưa nắm được ý nghĩa của những sự việc đang diễn ra, chứ không chỉ thiếu thông tin; “không hiểu” diễn đạt tự nhiên sắc thái này.
- source_word: αὐτοῦ οἱ μαθηταί
  choice: các môn đồ của Đức Chúa Jêsus
  rationale: Đại từ sở hữu quy chiếu về Đức Chúa Jêsus; nêu rõ danh xưng giúp câu tiếng Việt tự nhiên và tránh đại từ mở đầu thiếu tiền ngữ trong một câu đứng riêng.
- source_word: τὸ πρῶτον
  choice: ban đầu
  rationale: Đây là thành ngữ chỉ thời gian, nghĩa là “lúc đầu”; “ban đầu” ngắn gọn, tự nhiên và trang trọng.
- source_word: ἐδοξάσθη
  choice: được tôn vinh
  rationale: Giữ thể bị động và nội hàm thần học của δοξάζω trong Giăng, không thu hẹp thành chỉ “được tôn trọng” hay chỉ “được cất cao”.
- source_word: ἐμνήσθησαν
  choice: họ mới nhớ ra
  rationale: “Nhớ ra” diễn đạt hành động hồi tưởng; từ “mới” thể hiện tự nhiên quan hệ thời gian τότε sau mệnh đề “khi”.
- source_word: ἐπ’ αὐτῷ γεγραμμένα
  choice: đã được chép về Ngài
  rationale: ἐπί với tặng cách ở đây mang nghĩa “về/liên quan đến”; “đã được chép” biểu thị lời Kinh Thánh có trước lúc các môn đồ nhớ ra.
- source_word: ταῦτα ἐποίησαν αὐτῷ
  choice: người ta đã làm những điều ấy cho Ngài
  rationale: Chủ ngữ số nhiều không được nêu rõ trong tiếng Hy Lạp nên dùng “người ta”; “cho Ngài” phù hợp với các hành động tôn kính trong ngữ cảnh tiến vào Giê-ru-sa-lem, đồng thời ghi nhận khả năng dịch sát hình thức là “đối với Ngài” trong chú thích.
- source_word: ταῦτα
  choice: những điều này / những điều ấy
  rationale: Giữ nghĩa số nhiều tập hợp của đại từ; thay đổi chỉ xuất gần–xa theo dòng văn tiếng Việt nhưng vẫn duy trì liên kết giữa các sự việc.
theological_decisions:
- issue: Ý nghĩa của việc Đức Chúa Jêsus “được tôn vinh” trong văn mạch Giăng
  choice: Giữ cách nói “được tôn vinh” mà không xác định hẹp thời điểm hay phạm vi.
  alternative: được cất cao; được tôn trọng; sau khi sống lại
  rationale: Ngôn ngữ tôn vinh trong Giăng có thể bao hàm sự chết, sự phục sinh và sự thăng thiên của Đức Chúa Jêsus. Bản dịch giữ nguyên chiều sâu và sự căng thẳng thần học thay vì giải nghĩa ngay trong câu.
- issue: Quan hệ của ταῦτα ἐποίησαν αὐτῷ
  choice: “người ta đã làm những điều ấy cho Ngài,” hiểu là các hành động vừa được thuật lại hướng đến Đức Chúa Jêsus.
  alternative: “người ta đã làm những điều ấy đối với Ngài” hoặc “những điều ấy đã xảy đến cho Ngài”
  rationale: Động từ ở thể chủ động có chủ ngữ số nhiều hàm ẩn, nên không chuyển thành cấu trúc vô nhân xưng “đã xảy đến.” Tuy vậy, tặng cách αὐτῷ có độ mở nên chú thích ghi nhận cách dịch sát hình thức hơn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “môn đồ” và “được tôn vinh” để duy trì thuật ngữ Kinh Thánh quen thuộc; không giải quyết dứt khoát nội hàm nhiều lớp của “tôn vinh.” Tất cả dấu chú thích đều xuất hiện trong chính văn.
