id: JHN.12.49
reference: John 12:49
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὅτι ἐγὼ ἐξ ἐμαυτοῦ οὐκ ἐλάλησα, ἀλλ’ ὁ πέμψας με πατὴρ αὐτός μοι ἐντολὴν ⸀δέδωκεν τί εἴπω καὶ τί λαλήσω.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/049.yaml
  text: For I have not spoken from myself[b][a], but the Father who sent me has himself given me a command as to what I should say and what I should speak.
translation:
  language: vi
  text: Vì tôi không tự mình nói[a], nhưng chính Cha là Đấng đã sai tôi đã truyền cho tôi phải nói điều gì và phải phát biểu điều gì[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát chữ: “từ chính mình”; cũng có thể hiểu là “theo ý riêng” hoặc “bằng thẩm quyền riêng của tôi”.'
    reason: lexical_alternative
  - marker: b
    text: 'Tiếng Hy Lạp dùng hai động từ khác nhau: một động từ có nghĩa là “nói” và một động từ có nghĩa là “phát biểu/nói”. Động từ thứ hai cũng xuất hiện ở đầu câu; bản dịch cố gắng giữ sự phân biệt này.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξ ἐμαυτοῦ
  choice: tự mình
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt, giữ ý Chúa Giê-su không nói độc lập theo sáng kiến hay thẩm quyền riêng; chú thích nêu cách hiểu sát chữ hơn.
- source_word: οὐκ ἐλάλησα
  choice: không ... nói ra
  rationale: Tiếng Việt không cần biểu thị riêng thì hoàn thành như tiếng Anh; ngữ cảnh cho thấy lời khẳng định về hoạt động nói năng của Chúa Giê-su cho đến thời điểm này.
- source_word: ὁ πέμψας με πατὴρ
  choice: Cha, Đấng đã sai tôi
  rationale: Dùng cấu trúc đồng vị trang trọng và rõ nghĩa; viết hoa “Cha” vì đây là danh xưng chỉ Đức Chúa Trời trong ngữ cảnh.
- source_word: αὐτός
  choice: chính Cha
  rationale: Bảo toàn sắc thái nhấn mạnh của đại từ Hy Lạp mà vẫn tự nhiên trong tiếng Việt.
- source_word: ἐντολὴν δέδωκεν
  choice: đã truyền cho tôi
  rationale: Động từ “truyền” diễn đạt tự nhiên cả hành động ban mệnh lệnh lẫn thẩm quyền của ἐντολή; hiệu lực tiếp tục của thể hoàn thành được hiểu từ ngữ cảnh.
- source_word: τί εἴπω καὶ τί λαλήσω
  choice: phải nói điều gì và phải nói ra điều gì
  rationale: Giữ hai vế song song và cố gắng phản ánh hai động từ khác nhau εἴπω và λαλήσω, dù sự phân biệt sắc thái trong tiếng Việt rất nhẹ.
theological_decisions:
- issue: Mối liên hệ giữa lời nói của Con và mệnh lệnh của Cha
  choice: Diễn đạt rằng Chúa Giê-su không tự mình nói độc lập, nhưng nói theo sứ mạng và mệnh lệnh của Cha.
  alternative: Diễn giải thành việc Chúa Giê-su chỉ là một tiên tri loài người, hoặc nói theo thẩm quyền riêng nhưng tình cờ đồng thuận với Cha.
  rationale: Bản dịch giữ nguyên sự lệ thuộc trong sứ mạng và lời nói được câu văn nêu rõ, nhưng không thêm lời giải thích về bản tính của Con hay giải quyết vượt quá điều bản văn nói.
- issue: Cách dịch πατήρ
  choice: Cha
  alternative: cha
  rationale: Viết hoa vì từ này được dùng như danh xưng chỉ Đức Chúa Trời trong văn mạch Giăng.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Đại từ “tôi” phù hợp lời phát biểu trực tiếp trong ngữ cảnh. Cụm lặp ở cuối được giữ có chủ ý để phản ánh hai động từ Hy Lạp, đồng thời chú thích giải thích sự lặp.
