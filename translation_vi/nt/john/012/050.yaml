language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ οἶδα ὅτι ἡ ἐντολὴ αὐτοῦ ζωὴ αἰώνιός ἐστιν. ἃ οὖν ⸂ἐγὼ λαλῶ⸃, καθὼς εἴρηκέν μοι ὁ πατήρ, οὕτως λαλῶ.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/050.yaml
  text: And I know that his commandment is eternal life. So what I speak[a], I speak just as the Father has told me.
translation:
  language: vi
  text: Và tôi biết rằng điều răn của Ngài là sự sống đời đời.[a] Vì vậy, những gì tôi nói, tôi nói đúng như Cha đã nói với tôi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể hiểu: “điều răn của Ngài dẫn đến sự sống đời đời” hoặc “điều răn của Ngài liên quan đến sự sống đời đời.” Tiếng Hy Lạp nói sát chữ là: “điều răn của Ngài là sự sống đời đời.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐντολή
  choice: điều răn
  rationale: Diễn đạt mệnh lệnh có thẩm quyền của Đức Chúa Trời bằng cách nói quen thuộc, trang trọng trong tiếng Việt; sát với danh từ Hy Lạp hơn “lời truyền dạy”.
- source_word: ζωὴ αἰώνιος
  choice: sự sống đời đời
  rationale: Cụm từ quen thuộc trong văn liệu Giăng, vừa diễn tả tính trường tồn vừa giữ nội hàm thần học về sự sống thuộc thời đại sẽ đến.
- source_word: ἃ
  choice: những gì
  rationale: Chuyển tự nhiên đại từ quan hệ trung tính số nhiều và giữ nó làm tân ngữ của động từ “nói”.
- source_word: λαλῶ
  choice: tôi nói
  rationale: Dùng cùng một cách dịch cho cả hai lần xuất hiện để giữ phép lặp của nguyên văn mà vẫn tự nhiên trong tiếng Việt.
- source_word: καθὼς
  choice: đúng như
  rationale: Nêu rõ sự tương ứng giữa lời Cha phán bảo và điều Đức Chúa Jêsus nói, nhưng không cường điệu thành “chính xác từng lời”.
- source_word: εἴρηκέν μοι
  choice: đã phán bảo tôi
  rationale: “Phán bảo” phù hợp với lời của Cha và truyền đạt việc Ngài đã nói với Đức Chúa Jêsus; “đã” diễn tả hành động hoàn tất có hiệu lực trong hiện tại theo văn cảnh.
- source_word: ὁ πατήρ
  choice: Cha
  rationale: Giữ danh hiệu quan hệ “Cha” mà không thêm đại từ sở hữu “của tôi”, vốn không có trong nguyên văn.
- source_word: οὖν
  choice: vì vậy
  rationale: Giữ quan hệ suy luận với mệnh đề trước bằng một liên từ tự nhiên, trang trọng vừa phải.
- source_word: οἶδα
  choice: tôi biết
  rationale: Cách dịch trực tiếp, tự nhiên, giữ sắc thái xác quyết của câu.
theological_decisions:
- issue: Ý nghĩa của câu “điều răn của Ngài là sự sống đời đời”
  choice: 'Giữ nguyên cấu trúc đồng nhất trực tiếp: “điều răn của Ngài là sự sống đời đời.”'
  alternative: “Điều răn của Ngài dẫn đến sự sống đời đời” hoặc “điều răn của Ngài liên quan đến sự sống đời đời.”
  rationale: Nguyên văn dùng mệnh đề hệ từ trực tiếp. Bản dịch không thu hẹp ý nghĩa thành kết quả hay chủ đề, nhờ đó giữ sự hàm súc và căng thẳng thần học của câu.
- issue: Cách gọi ὁ πατήρ
  choice: Cha
  alternative: Cha tôi
  rationale: Nguyên văn là danh từ có mạo từ, không có đại từ sở hữu; không nên thêm quan hệ sở hữu dù văn cảnh cho thấy Đức Chúa Jêsus đang nói về Cha của mình.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Giữ phép lặp “tôi nói... tôi nói” của nguyên văn; dùng “Ngài” cho đại từ chỉ Cha và “phán bảo” để phù hợp văn phong Kinh Thánh mà không quá cổ.
