revisions:
- from: Và tôi biết rằng điều răn của Ngài là sự sống đời đời. Vì vậy, những gì tôi nói, tôi nói đúng như Cha đã phán bảo tôi.[a]
  to: Và tôi biết rằng điều răn của Ngài là sự sống đời đời.[a] Vì vậy, những gì tôi nói, tôi nói đúng như Cha đã nói với tôi.
  rationale: Giữ nguyên mệnh đề đồng nhất trực tiếp để bảo tồn tính hàm súc của nguyên văn và các cách hiểu đang được tranh luận. Đổi «phán bảo» thành «đã nói với tôi» để phản ánh εἴρηκέν μοι mà không thêm sắc thái mệnh lệnh; đồng thời chuyển neo chú thích đến đúng mệnh đề được giải thích.
  reviewer_model: gpt-5.6-terra
