  text: ἐποίησαν οὖν αὐτῷ δεῖπνον ἐκεῖ, καὶ ἡ Μάρθα διηκόνει, ὁ δὲ Λάζαρος εἷς ἦν ⸀ἐκ τῶν ἀνακειμένων σὺν αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/john/012/002.yaml
  text: So they made a dinner for him there[a], and Martha was serving, but Lazarus was one of those reclining at the table with him.
translation:
  language: vi
  text: Vì thế, họ dọn một bữa ăn cho Ngài tại đó; Ma-thê đang phục vụ, còn La-xa-rơ là một trong những người đồng bàn[a] với Ngài.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát: “những người nằm tựa để dùng bữa với Ngài.” Nằm tựa là tư thế thông thường trong các bữa ăn trang trọng thời ấy.'
    reason: cultural_note
lexical_decisions:
- source_word: ἐποίησαν οὖν αὐτῷ δεῖπνον
  choice: Vì vậy, ... người ta chuẩn bị một bữa tối cho Đức Chúa Jêsus
  rationale: Cụm ποιεῖν δεῖπνον có nghĩa là chuẩn bị hoặc tổ chức một bữa ăn; chủ ngữ số nhiều không được xác định nên dùng “người ta”, tránh suy đoán ai là chủ tiệc. οὖν được giữ bằng “Vì vậy” để nối với diễn tiến trước đó, và αὐτῷ được diễn đạt bằng tên Đức Chúa Jêsus cho rõ quy chiếu.
- source_word: ἐκεῖ
  choice: tại đó
  rationale: Giữ nguyên ý chỉ địa điểm, quy chiếu về Bê-tha-ni trong văn cảnh.
- source_word: ἡ Μάρθα διηκόνει
  choice: Ma-thê đang phục vụ
  rationale: Thì chưa hoàn thành mô tả hành động đang diễn ra; “phục vụ” tự nhiên trong ngữ cảnh bữa ăn và tránh sắc thái chức vụ giáo hội không có trong câu.
- source_word: ὁ δὲ Λάζαρος
  choice: còn La-xa-rơ
  rationale: δέ biểu thị sự chuyển ý và tương phản nhẹ giữa việc Ma-thê phục vụ với việc La-xa-rơ dự bữa; “còn” tự nhiên hơn “nhưng” trong tiếng Việt ở đây.
- source_word: εἷς ἦν ἐκ τῶν ἀνακειμένων σὺν αὐτῷ
  choice: là một trong những người cùng ngồi dự bữa với Ngài
  rationale: Giữ thành ngữ “một trong những người” và ý cùng dự bữa với Đức Chúa Jêsus. “Ngồi dự bữa” là cách diễn đạt tự nhiên trong chính văn; chú thích bảo tồn chi tiết văn hóa rằng nguyên văn nói họ nằm tựa mình khi ăn.
theological_decisions: []
