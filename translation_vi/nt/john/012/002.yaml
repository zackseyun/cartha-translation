revisions:
- from: Vì vậy, tại đó người ta chuẩn bị một bữa tối cho Đức Chúa Jêsus. Ma-thê đang phục vụ, còn La-xa-rơ là một trong những người cùng ngồi dự[a] bữa với Ngài.
  to: Vì thế, họ dọn một bữa ăn cho Ngài tại đó; Ma-thê đang phục vụ, còn La-xa-rơ là một trong những người đồng bàn[a] với Ngài.
  rationale: Bản sửa giữ liên từ οὖν («Vì thế»), chủ ngữ số nhiều không xác định («họ»), sắc thái chưa hoàn thành của διηκόνει («đang phục vụ»), và cấu trúc «một trong những...» của εἷς ἦν ἐκ. «Đồng bàn» giúp chính văn trôi chảy, còn chú thích bảo tồn chi tiết văn hóa về ἀνακειμένων mà không biến nó thành một khẳng định quá nặng trong chính văn.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T06:24:05Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp truyền đạt đúng diễn tiến chính: một bữa ăn được chuẩn bị cho Chúa Giê-su tại đó, Ma-thê đang phục vụ, và La-xa-rơ thuộc nhóm những người dùng bữa với Ngài. Tuy nhiên, «người ta» làm mờ chủ ngữ số nhiều của ἐποίησαν; «họ» giữ được chủ ngữ không xác định mà vẫn phản ánh số nhiều. «Đức Chúa Jêsus» cũng thay cho đại từ αὐτῷ bằng một tước hiệu không có trong câu Hy Lạp.'
  naturalness: «Họ dọn một bữa ăn cho Ngài tại đó» và «những người đồng bàn với Ngài» là cách diễn đạt tự nhiên, hiện đại. «Đồng bàn» truyền đạt việc cùng dự bữa; chú thích bảo lưu tư thế nằm tựa đặc trưng của nguyên ngữ.
  terminology: Dùng «Chúa Giê-su» theo chính tả Việt hiện đại trong chú thích quy chiếu, nhưng chính văn giữ đại từ «Ngài» tương ứng với αὐτῷ. Tên Ma-thê và La-xa-rơ được giữ nhất quán với bản nháp. Không thêm diễn giải thần học.
  issues:
  - severity: medium
    issue: «người ta» thay cho chủ ngữ số nhiều không xác định
    rationale: ἐποίησαν là động từ số nhiều. «Họ» bảo toàn số nhiều mà không suy đoán danh tính người chuẩn bị bữa ăn.
  - severity: low
    issue: «Đức Chúa Jêsus» thay cho αὐτῷ
    rationale: Nguyên văn dùng đại từ «cho ngài/người ấy»; việc chèn tước hiệu và tên trong chính câu vượt quá cách diễn đạt của nguồn. «Ngài» vừa tự nhiên vừa sát hơn trong văn cảnh.
  - severity: low
    issue: Chú thích có thể diễn đạt sát và rõ hơn tư thế ἀνακειμένων
    rationale: «Nằm tựa mình» có thể hiểu không rõ trong tiếng Việt hiện đại. «Nằm tựa để dùng bữa» nêu rõ đây là tư thế dùng bữa, không phải chỉ ngồi dự bữa.
  revised_text: Vì thế, họ dọn một bữa ăn cho Ngài tại đó; Ma-thê đang phục vụ, còn La-xa-rơ là một trong những người đồng bàn[a] với Ngài.
