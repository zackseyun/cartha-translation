source:
  edition: SBLGNT
  text: λέγει ⸀δὲ ⸂Ἰούδας ὁ Ἰσκαριώτης εἷς τῶν μαθητῶν αὐτοῦ⸃, ὁ μέλλων αὐτὸν παραδιδόναι·
base_translation:
  language: en
  yaml_path: translation/nt/john/012/004.yaml
  text: But Judas Iscariot[a], one of his disciples—the one who was about to betray him—said,
translation:
  language: vi
  text: 'Nhưng Giu-đa Ích-ca-ri-ốt, một trong các môn đệ của Ngài—người sắp phản bội Ngài[a]—nói:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “trao nộp Ngài.”'
    reason: Bảo tồn nghĩa trực tiếp hơn của παραδιδόναι (“hand over/deliver over”) bên cạnh cách dịch theo ngữ cảnh là “phản bội”.
lexical_decisions:
- source_word: λέγει
  choice: nói
  rationale: Động từ Hy Lạp dùng thì hiện tại lịch sử, nhưng “nói” trong mạch kể tiếng Việt diễn đạt tự nhiên chức năng dẫn lời mà không cần mô phỏng hình thái thì của nguyên văn.
- source_word: δὲ
  choice: Nhưng
  rationale: 'δέ đánh dấu một bước chuyển có sắc thái tương phản: hành động tận tâm vừa được kể đối lập với lời phản đối sắp theo sau.'
- source_word: Ἰούδας ὁ Ἰσκαριώτης
  choice: Giu-đa Ích-ca-ri-ốt
  rationale: Dùng dạng phiên âm quen thuộc trong tiếng Việt hiện đại để nhận diện nhân vật rõ ràng và tự nhiên.
- source_word: εἷς τῶν μαθητῶν αὐτοῦ
  choice: một trong các môn đồ của Ngài
  rationale: “Môn đồ” giữ được quan hệ thầy-trò của μαθητής trong bối cảnh Phúc Âm; “của Ngài” quy chiếu về Chúa Giê-su theo ngữ cảnh.
- source_word: ὁ μέλλων
  choice: người sắp
  rationale: “Sắp” bảo toàn ý hướng tới một hành động gần kề của μέλλω và tạo một cụm đồng vị tự nhiên trong tiếng Việt.
- source_word: παραδιδόναι
  choice: phản
  rationale: Trong ngữ cảnh Giu-đa đối với Chúa Giê-su, “phản” truyền đạt rõ tính phản bội của hành động; nghĩa trực tiếp rộng hơn là “nộp” được giữ trong chú thích.
theological_decisions:
- issue: Cách dịch παραδιδόναι khi nói về hành động của Giu-đa đối với Chúa Giê-su
  choice: phản
  alternative: nộp; trao nộp
  rationale: “Phản” thể hiện chính xác ý nghĩa phản bội trong ngữ cảnh, còn “nộp” giữ sát hình ảnh chuyển giao của động từ Hy Lạp. Bản chính dùng nghĩa phù hợp ngữ cảnh, đồng thời chú thích bảo tồn khả năng dịch sát hơn để không che khuất chiều rộng từ vựng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dấu gạch ngang làm rõ cụm đồng vị mô tả Giu-đa; dấu hai chấm dẫn sang lời nói ở câu kế tiếp. Đại từ “Ngài” duy trì lối quy chiếu tôn kính, quen thuộc đối với Chúa Giê-su.
