  rationale: Chỉnh “phản Ngài” thành “phản bội Ngài” để loại bỏ sự mơ hồ và dùng tiếng Việt hiện đại tự nhiên, đồng thời giữ nguyên ý ngữ cảnh của nguyên văn. Chỉnh chú thích thành “trao nộp Ngài” để phản ánh chính xác hơn nghĩa trực tiếp của động từ Hy Lạp. Không thay đổi nội dung hay sắc thái thần học của câu.
