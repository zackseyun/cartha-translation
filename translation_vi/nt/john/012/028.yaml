id: JHN.12.28
reference: John 12:28
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: πάτερ, δόξασόν σου τὸ ὄνομα. ἦλθεν οὖν φωνὴ ἐκ τοῦ οὐρανοῦ· Καὶ ἐδόξασα καὶ πάλιν δοξάσω.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/028.yaml
  text: 'Father[a], glorify your name. Then a voice came from heaven: “I have glorified it, and I will glorify it again.”'
translation:
  language: vi
  text: '“Lạy Cha, xin làm vinh hiển danh Cha.” Bấy giờ, có tiếng từ trời phán rằng: “Ta đã làm vinh hiển danh Ta, và Ta sẽ lại làm vinh hiển danh Ta.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πάτερ
  choice: Lạy Cha
  rationale: Dạng hô cách trực tiếp thưa với Đức Chúa Trời. “Lạy Cha” tự nhiên, trang trọng trong tiếng Việt và không thêm đại từ sở hữu vốn không có trong tiếng Hy Lạp.
- source_word: δόξασόν
  choice: xin làm vinh hiển
  rationale: Động từ mệnh lệnh aorist của δοξάζω. “Làm vinh hiển” giữ được trường nghĩa thần học về việc bày tỏ vinh quang, mạnh hơn “tôn trọng” và tự nhiên hơn “làm lớn lên”.
- source_word: σου τὸ ὄνομα
  choice: danh Cha
  rationale: “Danh” trong ngữ cảnh Kinh Thánh không chỉ là tên gọi mà còn chỉ bản tính được bày tỏ và danh tiếng. Cách xưng hô “Cha” phù hợp với lời cầu nguyện trực tiếp trong tiếng Việt.
- source_word: ἦλθεν οὖν
  choice: Bấy giờ, có ...
  rationale: οὖν ở đây chủ yếu đưa câu chuyện tiến tới hệ quả tiếp theo. “Bấy giờ” diễn đạt tự nhiên sự chuyển tiếp; cấu trúc “có tiếng ... phán” là thành ngữ tiếng Việt thích hợp khi một tiếng nói vang lên.
- source_word: φωνὴ
  choice: tiếng ... phán
  rationale: φωνή có thể là “âm thanh” hoặc “tiếng nói”; lời nói trực tiếp theo sau xác định đây là tiếng nói có nội dung. Thêm “phán” làm rõ chủ thể thần thượng mà không xác định danh tính ngoài điều ngữ cảnh cho phép.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: từ trời
  rationale: Cách dịch ngắn gọn, tự nhiên, giữ ý nguồn gốc thiên thượng; “từ bầu trời” sẽ làm giảm sắc thái thần học.
- source_word: Καὶ ἐδόξασα καὶ πάλιν δοξάσω
  choice: Ta đã làm vinh hiển danh Ta, và Ta sẽ lại làm vinh hiển danh Ta
  rationale: ἐδόξασα là aorist, được diễn đạt bằng “đã” để giữ nghĩa hành động hoàn tất; δοξάσω là tương lai. Tân ngữ được phục hồi từ “danh Cha” ở câu trước; vì chính Cha đang phán, tiếng Việt đổi thành “danh Ta”. πάλιν được gắn với hành động tương lai qua “sẽ lại”.
theological_decisions:
- issue: Tân ngữ hàm ẩn trong lời từ trời
  choice: Lặp lại “danh Ta” làm tân ngữ của cả hai động từ
  alternative: 'Để tân ngữ hàm ẩn: “Ta đã làm vinh hiển và sẽ lại làm vinh hiển”'
  rationale: 'Tiếng Hy Lạp có thể bỏ tân ngữ vì đã rõ từ câu trước, nhưng tiếng Việt tự nhiên hơn khi nêu lại. “Danh Ta” phản ánh đúng sự chuyển ngôi: Đức Chúa Cha đáp lời nói về “danh Cha” bằng cách nói về “danh Ta”.'
- issue: Sắc thái của δοξάζω trong thần học Giăng
  choice: làm vinh hiển
  alternative: tôn vinh; bày tỏ vinh quang của
  rationale: “Làm vinh hiển” giữ liên hệ từ vựng với “vinh quang” và không thu hẹp ý nghĩa thành sự tôn kính đơn thuần. Cách dịch không quyết định cụ thể bằng phương thức nào danh Đức Chúa Trời được làm vinh hiển.
- issue: Giá trị thời của ἐδόξασα
  choice: Ta đã làm vinh hiển
  alternative: Ta từng làm vinh hiển; Ta đã từng làm vinh hiển
  rationale: Aorist trình bày hành động như một sự kiện hoàn tất mà không tự nó đòi hỏi sắc thái “đã từng”. “Đã” là cách tương đương tự nhiên và ít diễn giải hơn trong tiếng Việt.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Lạy Cha” cho lời thưa trực tiếp, “Ta” cho tiếng phán từ trời, và giữ nhất quán cụm từ thần học “làm vinh hiển”. Không cần chú thích vì bản dịch chính có thể diễn đạt trực tiếp cả thể aorist lẫn tân ngữ hàm ẩn mà không che khuất một dị nghĩa đáng kể.
