  to: Vì thế, đám đông — những người đã ở với Ngài khi Ngài gọi La-xa-rơ ra khỏi mộ và khiến ông sống lại từ cõi chết — đang làm chứng[a].
  rationale: Sửa “vẫn đang làm chứng” thành “đang làm chứng” để giữ sắc thái chưa hoàn thành của ἐμαρτύρει mà không thêm ý ‘vẫn còn’. Sửa chú thích để nêu một lựa chọn dịch thực sự khác và giải thích đúng giá trị khía cạnh của động từ. Không thay đổi ý nghĩa của biến cố La-xa-rơ hay mức độ khẳng định của câu.
