  verdict: revise
  source_fidelity: 'Bản nháp truyền đạt đúng các thành phần chính của câu: liên từ οὖν, đám đông xác định đã ở với Chúa Giê-su trong biến cố La-xa-rơ, việc gọi ông ra khỏi mộ, việc khiến ông sống lại từ cõi chết, và động từ μαρτυρέω. Tuy nhiên, “vẫn đang” thêm rõ nét ý ‘vẫn/còn tiếp tục’ mà thì chưa hoàn thành ἐμαρτύρει tự nó không đòi hỏi; nên chỉ diễn đạt tính đang diễn tiến/lặp lại mà không khẳng định sự tiếp tục từ một mốc ngầm định.'
