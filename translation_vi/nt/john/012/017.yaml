  text: ἐμαρτύρει οὖν ὁ ὄχλος ὁ ὢν μετ’ αὐτοῦ ὅτε τὸν Λάζαρον ἐφώνησεν ἐκ τοῦ μνημείου καὶ ἤγειρεν αὐτὸν ἐκ νεκρῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/017.yaml
  text: So the crowd that had been with him when he called Lazarus out of the tomb and raised him from the dead was bearing witness[a].
translation:
  language: vi
  text: Vì thế, đám đông — những người đã ở với Ngài khi Ngài gọi La-xa-rơ ra khỏi mộ và khiến ông sống lại từ cõi chết — đang làm chứng[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “đã làm chứng”. Động từ Hy Lạp ở thì chưa hoàn thành, có thể diễn tả việc làm chứng đang diễn ra hoặc lặp lại; “làm chứng” là một chủ đề lặp lại trong sách Giăng.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμαρτύρει
  choice: vẫn đang làm chứng
  rationale: Thì chưa hoàn thành diễn tả hành động đang tiếp diễn hoặc được lặp lại trong mạch kể. “Làm chứng” giữ được chủ đề μαρτυρέω xuyên suốt sách Giăng; “vẫn đang” nối hành động này với biến cố họ đã chứng kiến.
- source_word: οὖν
  choice: Vì vậy
  rationale: Biểu thị sự liên kết suy luận hoặc tường thuật với ngữ cảnh trước đó, đồng thời vẫn tự nhiên trong văn phong tiếng Việt.
- source_word: ὁ ὄχλος
  choice: đám đông
  rationale: Cách gọi tự nhiên, hiện đại cho nhóm đông người được xác định trong câu.
- source_word: ὁ ὢν μετ’ αὐτοῦ
  choice: đã ở với Ngài
  rationale: Phân từ có mạo từ xác định đám đông cụ thể từng hiện diện với Chúa Giê-su vào lúc biến cố xảy ra. “Đã ở” thể hiện rõ quan hệ thời gian so với hành động làm chứng.
- source_word: ἐφώνησεν
  choice: gọi
  rationale: Diễn đạt trực tiếp hành động Chúa Giê-su gọi La-xa-rơ; không thêm sắc thái “kêu lớn” vốn không nhất thiết nằm trong riêng động từ này.
- source_word: ἐκ τοῦ μνημείου
  choice: ra khỏi mộ
  rationale: μνημεῖον ở đây là nơi chôn cất, còn ἐκ diễn tả chuyển động từ bên trong ra ngoài.
- source_word: ἤγειρεν αὐτὸν ἐκ νεκρῶν
  choice: khiến ông sống lại từ cõi chết
  rationale: Trong ngữ cảnh La-xa-rơ, cách diễn đạt này truyền đạt rõ hành động phục sinh được ἐγείρω và ἐκ νεκρῶν mô tả, đồng thời tự nhiên với độc giả Việt hiện đại.
theological_decisions:
- issue: Cách diễn đạt việc La-xa-rơ được khiến sống lại
  choice: khiến ông sống lại từ cõi chết
  alternative: làm cho ông trỗi dậy từ giữa những người chết
  rationale: Bản dịch giữ nguyên lời khẳng định rằng Chúa Giê-su đã làm La-xa-rơ sống lại, không giảm nhẹ phép lạ và cũng không thêm lời giải thích tín lý ngoài câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Ngài” cho đại từ chỉ Chúa Giê-su trong câu này, “ông” cho La-xa-rơ, và giữ thuật ngữ chủ đề “làm chứng” của sách Giăng.
