id: JHN.12.24
reference: John 12:24
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀμὴν ἀμὴν λέγω ὑμῖν, ἐὰν μὴ ὁ κόκκος τοῦ σίτου πεσὼν εἰς τὴν γῆν ἀποθάνῃ, αὐτὸς μόνος μένει· ἐὰν δὲ ἀποθάνῃ, πολὺν καρπὸν φέρει.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/024.yaml
  text: Truly[a], truly, I say to you, unless the grain of wheat falls into the ground and dies, it remains by itself; but if it dies[b], it bears much fruit.
translation:
  language: vi
  text: 'Quả thật, quả thật, tôi nói với anh em: nếu hạt lúa mì không rơi xuống đất và chết đi, nó vẫn chỉ một mình[a]; nhưng nếu chết đi[b], nó sinh nhiều hoa trái.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “nó vẫn ở một mình.”'
    reason: lexical_alternative
  - marker: b
    text: Hình ảnh nói về một hạt phải chết trong đất mới có thể sinh hoa trái. Trong văn cảnh, Chúa Giê-su áp dụng khuôn mẫu này cho cái chết của chính Ngài và cho những người theo Ngài.
    reason: cross_reference
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  choice: Quả thật, quả thật
  rationale: Giữ nguyên sự lặp lại trang trọng và sức nhấn mạnh của công thức đặc trưng trong sách Giăng, đồng thời dùng cách diễn đạt dễ hiểu trong tiếng Việt hiện đại.
- source_word: λέγω ὑμῖν
  choice: tôi nói với anh em
  rationale: Giữ lời nói trực tiếp và đại từ số nhiều của nguyên văn; “anh em” tự nhiên, trang trọng và không thêm một danh xưng thần học không có trong câu Hy Lạp.
- source_word: ἐὰν μὴ
  choice: nếu ... không
  rationale: Cấu trúc này tự nhiên hơn “trừ khi” trong câu tiếng Việt có hai hành động liên tiếp, đồng thời truyền đạt đúng điều kiện phủ định của nguyên văn.
- source_word: ὁ κόκκος τοῦ σίτου
  choice: hạt lúa mì
  rationale: κόκκος chỉ một hạt, còn σῖτος trong hình ảnh nông nghiệp ở đây là lúa mì; cách dịch này rõ ràng và thông dụng.
- source_word: πεσὼν εἰς τὴν γῆν
  choice: rơi xuống đất
  rationale: Diễn đạt tự nhiên phân từ Hy Lạp như một động từ nối tiếp, giữ cả hướng chuyển động vào đất trong hình ảnh gieo hạt.
- source_word: ἀποθάνῃ
  choice: chết đi
  rationale: Giữ nguyên động từ mạnh “chết” của hình ảnh thay vì làm nhẹ thành “mục nát” hay giải thích theo sinh học.
- source_word: αὐτὸς μόνος μένει
  choice: nó vẫn chỉ trơ trọi một mình
  rationale: “Vẫn” thể hiện μένει, còn “chỉ ... một mình” giữ sức nhấn của αὐτός và μόνος; “trơ trọi” làm rõ tình trạng đơn độc, không sinh thêm, nhưng không biến hình ảnh thành một lời giải nghĩa thần học.
- source_word: πολὺν καρπὸν φέρει
  choice: nó sinh nhiều hoa trái
  rationale: Giữ ẩn dụ “hoa trái” của καρπός và diễn đạt tự nhiên ý φέρει trong tiếng Việt; không đổi thành “mùa gặt lớn,” vốn sẽ diễn giải quá mức.
theological_decisions:
- issue: Hình ảnh nông nghiệp hàm ý về cái chết của Chúa Giê-xu và việc theo Ngài
  choice: Giữ nguyên hình ảnh hạt lúa mì chết rồi sinh nhiều hoa trái trong chính văn, không đưa lời giải nghĩa thần học vào câu.
  alternative: Mở rộng chính văn để nói rõ Chúa Giê-xu đang ám chỉ cái chết của Ngài và kết quả dành cho nhiều người.
  rationale: Văn cảnh cho thấy hình ảnh hướng đến cái chết của Chúa Giê-xu và cũng liên hệ với môn đồ trong các câu kế tiếp, nhưng chính câu này chỉ trình bày hình ảnh. Giữ hình ảnh nguyên vẹn bảo tồn chiều sâu và sự căng thẳng thần học của nguyên văn.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Giữ sự lặp lại “Quả thật, quả thật” và ẩn dụ nông nghiệp của nguyên văn; tránh thuật ngữ giáo phái và không giải nghĩa ẩn dụ ngay trong chính văn.
