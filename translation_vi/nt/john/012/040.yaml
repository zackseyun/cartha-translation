  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Τετύφλωκεν αὐτῶν τοὺς ὀφθαλμοὺς καὶ ⸀ἐπώρωσεν αὐτῶν τὴν καρδίαν, ἵνα μὴ ἴδωσιν τοῖς ὀφθαλμοῖς καὶ νοήσωσιν τῇ καρδίᾳ καὶ ⸀στραφῶσιν, καὶ ⸀ἰάσομαι αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/040.yaml
  text: He has blinded their eyes and hardened their heart[a], so that they may not see with their eyes and understand with their heart and turn[c][b], and I would heal them.
translation:
  language: vi
  text: Ngài đã làm mù mắt họ và làm chai cứng lòng họ, kẻo họ thấy bằng mắt, hiểu bằng lòng, quay lại[a], và Ta sẽ chữa lành họ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “được hoán cải.”'
    reason: lexical_alternative
  - marker: b
    text: Câu này vọng lại Ê-sai 6:10. Động từ Hy Lạp được dịch là “Ta sẽ chữa lành” có hình thức thì tương lai.
    reason: cross_reference
lexical_decisions:
- source_word: Τετύφλωκεν
  choice: đã làm mù
  rationale: Thì hoàn thành diễn tả một hành động đã xảy ra với tình trạng còn tiếp diễn; tiếng Việt tự nhiên dùng “đã làm mù”, còn hệ quả hiện tại được ngữ cảnh thể hiện.
- source_word: ἐπώρωσεν
  choice: làm chai cứng
  rationale: Diễn đạt sự làm cho mất nhạy bén, cứng lại; “chai cứng” tự nhiên hơn “làm cứng” và giữ sắc thái phán xét trong lời trích dẫn.
- source_word: καρδίαν / καρδίᾳ
  choice: lòng
  rationale: “Lòng” là cách nói Kinh Thánh tự nhiên trong tiếng Việt, bao gồm đời sống nội tâm và khả năng hiểu biết; động từ “hiểu” làm rõ sắc thái nhận thức.
- source_word: ἵνα μὴ
  choice: để ... không
  rationale: Giữ được sức nặng mục đích/kết quả của cấu trúc Hy Lạp mà không làm nhẹ căng thẳng thần học.
- source_word: ἴδωσιν τοῖς ὀφθαλμοῖς
  choice: mắt họ không thấy
  rationale: Giữ hình ảnh cụ thể và phép song hành của nguyên văn, đồng thời có trật tự từ tự nhiên trong tiếng Việt.
- source_word: νοήσωσιν τῇ καρδίᾳ
  choice: lòng họ không hiểu
  rationale: Diễn đạt trực tiếp sự nhận biết bằng nội tâm và song hành với “mắt họ không thấy”.
- source_word: στραφῶσιν
  choice: quay lại
  rationale: Bảo toàn nghĩa rộng của động từ là quay trở lại, không thu hẹp thành một thuật ngữ giáo phái như “cải đạo”; thể thụ động Hy Lạp ở đây có thể mang nghĩa nội động.
- source_word: ἰάσομαι
  choice: Ta chữa lành
  rationale: Hình thái Hy Lạp là tương lai, nhưng nằm trong chuỗi mệnh đề phụ thuộc ἵνα; tiếng Việt không bắt buộc đánh dấu tương lai. Cách dịch này giữ được sự mơ hồ giữa “Ta sẽ chữa lành” và sắc thái hệ quả giả định theo văn cảnh.
- source_word: αὐτῶν τὴν καρδίαν
  choice: lòng họ
  rationale: Giữ danh từ số ít mang nghĩa tập thể của nguyên văn thay vì đổi thành “những tấm lòng”.
theological_decisions:
- issue: Tác nhân thần linh trong việc làm mù và làm chai cứng
  choice: Giữ chủ ngữ minh nhiên “Ngài” cùng các động từ chủ động “đã làm mù... và làm chai cứng...”
  alternative: Dùng lối vô nhân xưng hoặc bị động để giảm nhẹ tác nhân thần linh
  rationale: Nguyên văn quy các hành động cho một chủ thể số ít. Bản dịch giữ nguyên căng thẳng thần học về sự làm cứng lòng trong phán xét, không âm thầm làm nhẹ đi.
- issue: Ngôn ngữ hoán cải của στραφῶσιν
  choice: quay lại
  alternative: được cải đạo / hoán cải
  rationale: “Quay lại” giữ nghĩa của động từ và thành ngữ tiên tri, đồng thời tránh nhập một cách diễn giải giáo hội hẹp hơn.
- issue: Quan hệ cú pháp của καὶ ἰάσομαι αὐτούς
  choice: “thì Ta chữa lành họ”
  alternative: “và Ta sẽ chữa lành họ”
  rationale: “Thì” giúp tiếng Việt biểu đạt quan hệ hệ quả/điều kiện tiềm ẩn sau chuỗi phủ định mà không phủ nhận hình thái tương lai của động từ; phương án sát hình thức hơn được ghi ở chú thích.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. Giữ cách nói tập thể “lòng họ”, phép song hành “mắt... lòng...”, cùng căng thẳng thần học của lời trích. Các dấu chú thích [a], [b], [c] đều xuất hiện trong chính văn.
