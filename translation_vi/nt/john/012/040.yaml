    rationale: Sau “họ không quay lại”, liên từ “thì” dễ đặt việc chữa lành làm hệ quả của việc không quay lại. Nó không diễn đạt rõ quan hệ ‘kẻo/lest’ của lời trích dẫn, cũng không phản ánh rõ tương lai ἰάσομαι.
  - severity: low
    issue: Câu chính chưa nêu rõ phương tiện song hành “bằng mắt / bằng lòng”.
    rationale: “Mắt họ không thấy, lòng họ không hiểu” có thể chấp nhận, nhưng “thấy bằng mắt, hiểu bằng lòng” sát cấu trúc τοῖς ὀφθαλμοῖς / τῇ καρδίᾳ hơn và vẫn tự nhiên trong tiếng Việt.
  revised_text: Ngài đã làm mù mắt họ và làm chai cứng lòng họ, kẻo họ thấy bằng mắt, hiểu bằng lòng, quay lại[a], và Ta sẽ chữa lành họ.[b]
