  yaml_path: translation/nt/john/012/033.yaml
  text: He was saying this to signify what kind of death he was about to die[a].
translation:
  language: vi
  text: Ngài nói điều này để cho biết Ngài sẽ chết cách nào.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “Ngài sẽ chết bằng cách nào.” Cách diễn đạt Hy Lạp có thể nhấn mạnh phương thức của cái chết.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο
  choice: điều này
  rationale: Đại từ chỉ định trung tính số ít quy chiếu về lời Đức Chúa Giê-su vừa nói; “điều này” là cách diễn đạt tự nhiên và rõ nghĩa trong tiếng Việt.
- source_word: δὲ
  choice: không dịch thành một từ riêng
  rationale: Ở đây δέ chỉ có chức năng nối hoặc chuyển nhẹ. Mạch văn tiếng Việt đã tự nhiên mà không cần thêm “bấy giờ”, “nhưng” hay “còn”, vốn có thể làm sắc thái mạnh hơn nguyên văn.
- source_word: ἔλεγεν
  choice: nói
  rationale: Thì chưa hoàn thành diễn tả hành động trong bối cảnh quá khứ, nhưng tiếng Việt không bắt buộc đánh dấu thể này; “nói” tự nhiên hơn “đang nói” trong lời giải thích của người kể chuyện.
- source_word: σημαίνων
  choice: để cho biết
  rationale: Phân từ diễn tả việc lời nói ấy chỉ ra hoặc làm cho người nghe nhận biết một điều. “Để cho biết” giữ được ý nghĩa chỉ dấu mà vẫn sáng rõ với độc giả hiện đại.
- source_word: ποίῳ θανάτῳ
  choice: phải chết cách nào
  rationale: Cụm nghi vấn ở cách dữ liệu nhấn mạnh loại hoặc phương thức của cái chết. Cách nói này tự nhiên trong tiếng Việt và không chỉ đơn thuần nói đến sự kiện Ngài sẽ chết.
- source_word: ἤμελλεν
  choice: sắp phải
  rationale: μέλλω chỉ điều sắp xảy ra hoặc sẽ xảy ra theo diễn tiến. “Sắp phải” truyền đạt hướng tương lai trong bối cảnh và không đưa thêm ý tiền định mạnh hơn chính động từ.
- source_word: ἀποθνῄσκειν
  choice: chết
  rationale: Động từ nguyên mẫu bổ nghĩa cho ἤμελλεν; “chết” là cách tương đương trực tiếp và tự nhiên.
theological_decisions:
- issue: Có nên nói rõ đây là cái chết trên thập tự giá hay không
  choice: 'Giữ cách nói gián tiếp: “Ngài sắp phải chết cách nào”'
  alternative: “Ngài sắp phải chết trên thập tự giá” hoặc “Ngài sắp bị hành hình cách nào”
  rationale: Người kể chuyện cho biết lời Đức Chúa Giê-su ám chỉ phương thức Ngài sẽ chết nhưng không nêu đích danh sự đóng đinh trong câu này. Bản dịch giữ nguyên tính gián tiếp của nguyên văn, không giải thích thay cho độc giả.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” cho chủ thể hàm ẩn là Đức Chúa Giê-su. Không thêm từ chuyển ý ở đầu câu vì δέ chỉ nối nhẹ và tiếng Việt không cần biểu thị riêng trong ngữ cảnh này.
