reference: John 12:41
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ταῦτα εἶπεν Ἠσαΐας ⸀ὅτι εἶδεν τὴν δόξαν αὐτοῦ, καὶ ἐλάλησεν περὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/041.yaml
  text: Isaiah said these things because he saw his glory and spoke about him[a].
translation:
  language: vi
  text: Ê-sai đã nói những điều ấy vì ông đã thấy vinh quang của Ngài và nói về Ngài.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể hiểu: “Ê-sai đã nói những điều ấy vì ông đã thấy vinh quang của Đức Chúa Trời và nói về Ngài.” Trong mạch văn của Giăng, các đại từ nhiều khả năng chỉ Chúa Giê-su; còn trong bối cảnh rộng hơn của sách Ê-sai, đây là khải tượng về vinh quang của Chúa (Ê-sai 6:1).'
    reason: alternative_reading
lexical_decisions:
- source_word: ταῦτα
  choice: những điều ấy
  rationale: Đại từ chỉ định số nhiều trung tính, quay lại các lời tiên tri vừa được trích dẫn; cách dịch này tự nhiên và giữ rõ sắc thái số nhiều.
- source_word: εἶπεν
  choice: đã nói
  rationale: Cách dịch trực tiếp của động từ λέγω ở thì bất định; tiếng Việt tự nhiên dùng “nói” trong cấu trúc này.
- source_word: Ἠσαΐας
  choice: Ê-sai
  rationale: Dạng tên vị tiên tri quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
- source_word: ὅτι
  choice: vì
  rationale: Trong ngữ cảnh, ὅτι tự nhiên nhất là nêu nguyên nhân khiến Ê-sai nói những điều ấy; cách hiểu “rằng” vẫn có thể có về ngữ pháp nhưng kém phù hợp hơn với mạch giải thích.
- source_word: εἶδεν
  choice: đã thấy
  rationale: Cách dịch trực tiếp, rõ ràng của động từ ὁράω ở thì bất định.
- source_word: τὴν δόξαν
  choice: vinh quang
  rationale: “Vinh quang” là cách dịch chuẩn và có sức nặng thần học thích hợp cho δόξα trong văn chương Giăng.
- source_word: αὐτοῦ
  choice: của Ngài
  rationale: Đại từ sở hữu được dịch tự nhiên với “vinh quang”; viết hoa “Ngài” cho thấy ngữ cảnh hướng đến một đối tượng thần linh, nhưng chú thích vẫn bảo toàn độ mở về việc quy chiếu cụ thể đến Chúa Giê-su hay Đức Chúa Trời/Chúa trong bối cảnh Ê-sai.
- source_word: ἐλάλησεν
  choice: nói
  rationale: λαλέω mang nghĩa nói/phát biểu; tiếng Việt không có sự phân biệt tự nhiên tương đương với λέγω ở đầu câu, nên lặp “nói” là rõ và không gượng ép.
- source_word: περὶ αὐτοῦ
  choice: về Ngài
  rationale: περί với sở hữu cách có nghĩa “về/liên quan đến”; “về Ngài” là cách diễn đạt hiện đại và tự nhiên.
theological_decisions:
- issue: Đối tượng mà hai đại từ αὐτοῦ chỉ đến
  choice: Giữ đại từ “Ngài” trong chính văn; theo mạch văn của Giăng, đại từ nhiều khả năng chỉ Chúa Giê-su.
  alternative: Hiểu đại từ là chỉ Đức Chúa Trời/Chúa nói chung, dựa trên khung cảnh Ê-sai 6.
  rationale: Giăng 12:37–41 áp dụng lời Ê-sai vào sự vô tín trước Chúa Giê-su, khiến Chúa Giê-su là đối tượng quy chiếu tự nhiên trong ngữ cảnh gần. Tuy nhiên, Ê-sai 6 kể việc vị tiên tri thấy vinh quang của Chúa. Chính văn không thay đại từ bằng một danh xưng cụ thể, còn chú thích trình bày sự căng thẳng liên văn bản thay vì âm thầm giải quyết nó.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Dùng “Ê-sai” theo cách gọi quen thuộc trong Kinh Thánh tiếng Việt; giữ đại từ “Ngài” nhằm tránh chèn danh xưng không có trực tiếp trong câu Hy Lạp, đồng thời chú thích làm rõ khả năng quy chiếu.
