id: JHN.12.26
reference: John 12:26
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐὰν ἐμοί ⸂τις διακονῇ⸃ ἐμοὶ ἀκολουθείτω, καὶ ὅπου εἰμὶ ἐγὼ ἐκεῖ καὶ ὁ διάκονος ὁ ἐμὸς ἔσται· ⸀ἐάν τις ἐμοὶ διακονῇ τιμήσει αὐτὸν ὁ πατήρ.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/026.yaml
  text: If anyone serves me[a], let him follow me; and where I am, there my servant will be also. If anyone serves me, the Father will honor him.
translation:
  language: vi
  text: Nếu ai phục vụ Ta[a], người ấy hãy theo Ta; và Ta ở đâu, người phục vụ Ta cũng sẽ ở đó. Nếu ai phục vụ Ta, Cha sẽ tôn quý người ấy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hy Lạp dùng cấu trúc số ít giống đực theo nghĩa khái quát: “Nếu ai phục vụ Ta… Cha sẽ tôn quý người ấy.”'
    reason: Giải thích hình thức ngữ pháp của nguyên văn; tiếng Việt không biểu thị giống ngữ pháp trong “ai… người ấy”.
lexical_decisions:
- source_word: διακονῇ (διακονέω)
  choice: phục vụ
  rationale: Diễn tả việc phục vụ Chúa Giê-xu theo nghĩa rộng, tự nhiên trong tiếng Việt hiện đại; tránh “phụng sự” quá trang trọng và “thi hành chức vụ” vốn dễ gợi đến một chức vụ trong hội thánh.
- source_word: ἀκολουθείτω
  choice: người ấy hãy theo Ta
  rationale: Giữ lực mệnh lệnh của thể mệnh lệnh hiện tại mà không diễn giải quá mức sắc thái tiếp diễn.
- source_word: διάκονος
  choice: người phục vụ Ta
  rationale: Chỉ một người phục vụ Chúa Giê-xu nói chung, không phải chức danh “chấp sự”; cách dịch này cũng giữ mối liên hệ từ vựng với động từ διακονέω.
- source_word: ὅπου εἰμὶ ἐγὼ ... ἐκεῖ καὶ
  choice: Ta ở đâu ... cũng sẽ ở đó
  rationale: Cấu trúc tự nhiên trong tiếng Việt, đồng thời giữ cả ý chỉ nơi chốn và sắc thái bổ sung của καί.
- source_word: τιμήσει
  choice: sẽ tôn quý
  rationale: Truyền đạt ý Cha ban sự tôn trọng và vinh dự cho người phục vụ; “tôn quý” phù hợp văn phong trang nghiêm hơn “coi trọng” nhưng không xác định cụ thể hình thức của sự tôn quý.
- source_word: ὁ πατήρ
  choice: Cha
  rationale: Giữ nguyên cách gọi “Cha” trong tiếng Hy Lạp, không tự ý thêm đại từ sở hữu “Ta” hay “của Ta”.
- source_word: τις ... αὐτόν
  choice: ai ... người ấy
  rationale: Tiếng Việt tự nhiên dùng “ai ... người ấy” cho một đối tượng bất định, bao gồm cả nam lẫn nữ, trong khi vẫn giữ số ít và quan hệ hồi chỉ của câu Hy Lạp.
theological_decisions:
- issue: Lời kêu gọi đi theo Chúa Giê-xu
  choice: Dịch bằng mệnh lệnh “người ấy hãy theo Ta”.
  alternative: “người ấy phải theo Ta” hoặc “người ấy hãy tiếp tục theo Ta”.
  rationale: Bản dịch giữ lực mệnh lệnh nhưng không tăng thành nghĩa bắt buộc mạnh hơn, cũng không biến sắc thái thể hiện tại thành một diễn giải rõ về sự tiếp diễn.
- issue: Bản chất của sự tôn quý do Cha ban
  choice: Giữ lời hứa rộng là “Cha sẽ tôn quý người ấy”.
  alternative: Giải thích đó cụ thể là phần thưởng trên trời hoặc sự tôn vinh trong thời kỳ sau cùng.
  rationale: Câu Hy Lạp không nói rõ hình thức hay thời điểm của sự tôn quý, nên bản dịch không thu hẹp lời hứa theo một hệ thống thần học riêng.
- issue: Cách gọi người phục vụ Chúa Giê-xu
  choice: Dùng “người phục vụ Ta”, không dùng một chức danh giáo hội.
  alternative: “chấp sự của Ta” hoặc “mục sư của Ta”.
  rationale: διάκονος trong ngữ cảnh này mang nghĩa chung về người phục vụ, không xác lập một chức vụ hội thánh.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. Đại từ “Ta” phù hợp lời phán của Chúa Giê-xu trong văn cảnh Kinh Thánh tiếng Việt; “người ấy” tránh giới hạn giới tính mà không đổi số ít của nguyên văn. Nhịp hai mệnh đề được giữ gần cấu trúc Hy Lạp.
