id: JHN.12.27
reference: John 12:27
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Νῦν ἡ ψυχή μου τετάρακται, καὶ τί εἴπω; πάτερ, σῶσόν με ἐκ τῆς ὥρας ταύτης. ἀλλὰ διὰ τοῦτο ἦλθον εἰς τὴν ὥραν ταύτην.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/027.yaml
  text: Now my soul is troubled[a], and what should I say? Father, save me from this hour. But for this reason I came to this hour.
translation:
  language: vi
  text: Giờ đây, tâm hồn tôi xao xuyến[a]. Tôi sẽ nói gì? Cha ơi, xin cứu con khỏi giờ này. Nhưng chính vì điều này mà con đã đến giờ này.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể hiểu: “Tôi sẽ nói gì? ‘Cha ơi, xin cứu con khỏi giờ này’ sao?” Tiếng Hy Lạp cũng có thể được đọc như một câu hỏi tu từ, chứ không phải một lời cầu xin trực tiếp.'
    reason: alternative_reading
lexical_decisions:
- source_word: Νῦν
  choice: Giờ đây
  rationale: Diễn tả tính tức thời của nỗi xao xuyến hiện tại; tự nhiên và trang trọng trong tiếng Việt hiện đại.
- source_word: ἡ ψυχή μου
  choice: tâm hồn tôi
  rationale: Chỉ đời sống nội tâm và chính con người Đức Giê-su đang xao xuyến; “tâm hồn” tự nhiên hơn “linh hồn” trong ngữ cảnh cảm xúc này mà không giản lược thành cảm giác đơn thuần.
- source_word: τετάρακται
  choice: xao xuyến
  rationale: Thể hoàn thành diễn tả trạng thái hiện tại do sự khuấy động gây nên. “Xao xuyến” ở đây mang nghĩa bối rối, bất an sâu sắc, phù hợp văn phong Kinh Thánh tiếng Việt.
- source_word: τί εἴπω
  choice: Tôi sẽ nói gì?
  rationale: Truyền đạt thể giả định mang ý cân nhắc mà vẫn tự nhiên trong tiếng Việt; không buộc phải hiểu là thiếu thông tin.
- source_word: πάτερ
  choice: Cha ơi
  rationale: Lời xưng hô trực tiếp với Đức Chúa Trời; “ơi” thể hiện hô cách tự nhiên, tha thiết nhưng không suồng sã.
- source_word: σῶσόν με ἐκ τῆς ὥρας ταύτης
  choice: xin cứu con khỏi giờ này
  rationale: Giữ động từ “cứu” và giới từ chỉ sự giải thoát khỏi biến cố sắp đến. Đại từ “con” phù hợp khi thưa với Cha trong tiếng Việt.
- source_word: ὥρα
  choice: giờ
  rationale: Giữ hình ảnh chủ đạo của Giăng về thời điểm đã định cho sự chịu khổ, sự chết và được tôn vinh của Đức Giê-su, thay vì làm phẳng thành “lúc” hay “thời điểm”.
- source_word: ἀλλὰ διὰ τοῦτο
  choice: Nhưng chính vì điều này
  rationale: Thể hiện sự tương phản cùng sắc thái lý do hoặc mục đích, đồng thời không xác định quá mức “điều này” chỉ về một nội dung duy nhất.
- source_word: ἦλθον εἰς τὴν ὥραν ταύτην
  choice: con đã đến giờ này
  rationale: Giữ chuyển động “đến” và giới từ εἰς thay vì diễn giải thành “đến vì giờ này”; “đã đến” tự nhiên trong tiếng Việt và nhấn mạnh việc đã tới thời điểm quyết định.
theological_decisions:
- issue: Lời “Cha ơi, xin cứu con khỏi giờ này” là lời cầu xin trực tiếp hay một khả năng được nêu trong câu hỏi tu từ?
  choice: Trình bày như lời cầu xin trực tiếp, phù hợp dấu câu của SBLGNT.
  alternative: 'Đọc toàn bộ như câu hỏi tu từ: “Tôi sẽ nói gì? ‘Cha ơi, xin cứu con khỏi giờ này’ sao?”'
  rationale: Các thủ bản sớm nhất không có hệ thống dấu câu nguyên thủy, nên cả hai cách đọc đều khả hữu. Bản chính giữ sự căng thẳng giữa nỗi xao xuyến thật và việc Đức Giê-su chấp nhận giờ đã định; chú thích bảo tồn cách đọc tu từ mà không giải quyết giáo lý thay cho văn bản.
- issue: Ý nghĩa của διὰ τοῦτο trong quan hệ với “giờ này”
  choice: Dịch “chính vì điều này” để giữ đại từ chỉ định tương đối mở.
  alternative: “chính vì giờ này” hoặc “chính vì mục đích này”
  rationale: Cụm từ có thể hướng đến chính việc bước vào giờ chịu khổ hoặc mục đích sứ mạng rộng hơn. Không thay “điều này” bằng một diễn giải cụ thể giúp bảo tồn độ mở của nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “tôi” khi Đức Giê-su nói về chính mình, nhưng dùng “con” khi trực tiếp thưa với Cha, theo cách xưng hô tự nhiên trong tiếng Việt. Dấu ngoặc đơn đánh dấu lời cầu xin được trích trong lời nói; chú thích [a] đặt sau mệnh đề mở đầu nhưng giải thích cách phân câu của phần tiếp theo.
