  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ εἶπεν ὁ Ἰησοῦς· Εἰς κρίμα ἐγὼ εἰς τὸν κόσμον τοῦτον ἦλθον, ἵνα οἱ μὴ βλέποντες βλέπωσιν καὶ οἱ βλέποντες τυφλοὶ γένωνται.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/039.yaml
  text: And Jesus said[a], “For judgment I came into this world, so that those who do not see may see, and those who see may become blind.”
translation:
  language: vi
  text: 'Giê-su nói: “Chính vì sự phán xét mà tôi đã đến thế gian này, để những người không thấy có thể thấy, còn những người thấy có thể trở nên mù.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κρίμα
  choice: sự phán xét
  rationale: Giữ sắc thái tư pháp và tác động phân định do việc Đức Chúa Jêsus đến; không thu hẹp thành sự kết án vì câu này gồm cả việc cho thấy và khiến trở nên mù.
- source_word: κόσμον
  choice: thế gian
  rationale: Cách dịch quen thuộc và phù hợp với cách dùng κόσμος trong Giăng, chỉ thế giới loài người trong quan hệ xa cách hoặc chống nghịch Đức Chúa Trời.
- source_word: οἱ μὴ βλέποντες / οἱ βλέποντες
  choice: những người không thấy / những người thấy
  rationale: Giữ cấu trúc song song và sự nhập nhòe có chủ ý giữa thị giác thể lý với nhận thức thuộc linh.
- source_word: βλέπωσιν
  choice: được thấy
  rationale: Diễn đạt tự nhiên kết quả trong mệnh đề ἵνα, đồng thời không giới hạn ý nghĩa vào việc phục hồi thị lực thể lý.
- source_word: τυφλοὶ γένωνται
  choice: trở nên mù
  rationale: Giữ đúng sắc thái biến đổi của γένωνται và sự đảo ngược mạnh mẽ trong lời phán.
- source_word: εἰς τὸν κόσμον τοῦτον ἦλθον
  choice: Ta đã đến thế gian này
  rationale: Diễn đạt tự nhiên bằng tiếng Việt và bảo toàn ngôn ngữ về việc đến thế gian đặc trưng của sách Giăng.
theological_decisions:
- issue: Quan hệ với Giăng 3:17, nơi nói Con đến không phải để xét đoán thế gian
  choice: Dịch κρίμα là “sự phán xét” và không làm nhẹ sự căng thẳng
  alternative: Diễn ý là “tạo nên sự phân rẽ” hoặc thu hẹp thành “sự kết án”
  rationale: 'Câu này trình bày việc Đức Chúa Jêsus đến như điều tạo ra một sự phân định mang tính tư pháp: người không thấy được thấy, còn người thấy trở nên mù. Bản dịch giữ nguyên sự căng thẳng thần học thay vì âm thầm dung hòa.'
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “phán”, “Ta” theo lối văn Kinh Thánh tiếng Việt quen thuộc; giữ cặp “không thấy/thấy” để bảo toàn cả nghĩa thể lý lẫn nghĩa thuộc linh.
