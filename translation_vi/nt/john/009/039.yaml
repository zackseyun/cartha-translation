revisions:
- from: 'Đức Chúa Jêsus phán: “Ta đã đến thế gian này để phán xét,[a] hầu cho những người không thấy thì được thấy, còn những người thấy thì trở nên mù.”'
  to: 'Giê-su nói: “Chính vì sự phán xét mà tôi đã đến thế gian này, để những người không thấy có thể thấy, còn những người thấy có thể trở nên mù.”'
  rationale: Bản sửa bám sát danh từ κρίμα, bảo toàn sự nhấn mạnh của ἐγώ bằng «chính», giữ cặp động từ «thấy» có chủ ý mơ hồ, và giữ «trở nên mù» cho γένωνται. Chú thích được rút gọn và điều chỉnh để phản ánh «kết quả mang tính xét đoán» thay vì dùng cách giải thích quá chuyên biệt «tư pháp».
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T06:23:04Z'
review_pass:
  verdict: revise
  source_fidelity: Bản thảo truyền đạt đúng cấu trúc đối nghịch và sắc thái trở nên của γένωνται. Tuy nhiên, «Đức Chúa Jêsus» thêm tước hiệu không có trong nguyên văn, «để phán xét» chuyển danh từ κρίμα thành động từ và làm mờ cách diễn đạt «vì/cho sự phán xét», còn «được thấy» có hình thức bị động trong khi βλέπωσιν là chủ động.
  naturalness: Câu sửa dùng chính tả hiện đại «Giê-su», cách tự xưng «tôi» và động từ «nói», vẫn giữ giọng trang trọng, tự nhiên của văn xuôi Kinh Thánh hiện đại. Cặp «không thấy/thấy» được giữ nguyên để không giải thích quá mức hình ảnh.
  terminology: Dịch κρίμα là «sự phán xét» phù hợp nhất và không thu hẹp thành «sự kết án». «Thế gian» là cách dịch thích hợp cho κόσμος trong văn mạch Giăng. Không thêm danh xưng «Chúa» hoặc «Đức Chúa» vào tên riêng khi bản tiếng Hy Lạp chỉ ghi ὁ Ἰησοῦς.
  issues:
  - severity: medium
    issue: Tên nhân vật thêm tước hiệu và dùng chính tả không theo chuẩn hiện đại.
    rationale: ὁ Ἰησοῦς chỉ là «Giê-su»; «Đức Chúa» không có trong nguồn. Dạng «Jêsus» không phải chính tả hiện đại chuẩn được yêu cầu.
  - severity: medium
    issue: «để phán xét» diễn giải κρίμα như một động từ.
    rationale: εἰς κρίμα dùng danh từ «phán xét»; giữ danh từ giúp bảo toàn sắc thái kết quả/tác động xét đoán và sự mơ hồ được ghi nhận trong audit trail.
  - severity: low
    issue: «được thấy» chuyển động từ chủ động βλέπωσιν sang cấu trúc bị động.
    rationale: «có thể thấy» giữ tốt hơn chủ động và tính mục đích/kết quả của mệnh đề ἵνα, mà không loại bỏ tầng nghĩa thể lý và thuộc linh.
  revised_text: 'Giê-su nói: “Chính vì sự phán xét mà tôi đã đến thế gian này, để những người không thấy có thể thấy, còn những người thấy có thể trở nên mù.”'
  revised_footnotes:
  - marker: a
    text: 'Hoặc: “vì một sự phán xét.” Cụm từ Hy Lạp εἰς κρίμα có thể nhấn mạnh kết quả mang tính xét đoán của việc Giê-su đến, chứ không chỉ sự kết án.'
    reason: lexical_alternative
  revision_rationale: Bản sửa bám sát danh từ κρίμα, bảo toàn sự nhấn mạnh của ἐγώ bằng «chính», giữ cặp động từ «thấy» có chủ ý mơ hồ, và giữ «trở nên mù» cho γένωνται. Chú thích được rút gọn và điều chỉnh để phản ánh «kết quả mang tính xét đoán» thay vì dùng cách giải thích quá chuyên biệt «tư pháp».
