reference: John 9:17
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: λέγουσιν ⸀οὖν τῷ τυφλῷ πάλιν· ⸂Τί σὺ⸃ λέγεις περὶ αὐτοῦ, ὅτι ἠνέῳξέν σου τοὺς ὀφθαλμούς; ὁ δὲ εἶπεν ὅτι Προφήτης ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/017.yaml
  text: So they said again to the blind man[a], “What do you say about him, since he opened your eyes?” And he said[c][b], “He is a prophet.”
translation:
  language: vi
  text: 'Vậy họ lại hỏi người mù ấy: “Còn chính anh, anh nói gì về người ấy, vì người ấy đã mở mắt cho anh?”[a] Anh đáp: “Người ấy là một nhà tiên tri.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hy Lạp được dịch là “vì” cũng có thể hiểu là “rằng”, liên kết việc người ấy đã mở mắt cho anh với điều họ yêu cầu anh nói về người ấy.
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể hiểu với sắc thái danh hiệu: “Người ấy là Đấng Tiên Tri.” Tuy nhiên, ngữ cảnh cũng phù hợp với nghĩa “một nhà tiên tri.”'
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: Vậy
  rationale: Diễn tả sự tiếp nối và suy luận từ cuộc chất vấn ngay trước đó, đồng thời tự nhiên trong văn kể chuyện tiếng Việt.
- source_word: τῷ τυφλῷ
  choice: người mù ấy
  rationale: Tính từ được dùng như danh từ. Cách dịch này giữ cách gọi của những người đang chất vấn mà không thêm ý không được nêu trực tiếp trong mệnh đề.
- source_word: πάλιν
  choice: lại
  rationale: Giữ rõ ý hành động chất vấn được lặp lại.
- source_word: Τί σὺ λέγεις
  choice: Còn chính anh, anh nói gì
  rationale: Đại từ σὺ được nêu tường minh để nhấn mạnh; “còn chính anh” truyền đạt cả sắc thái nhấn mạnh lẫn sự chuyển sang hỏi ý kiến của người đã được chữa lành.
- source_word: περὶ αὐτοῦ
  choice: về người ấy
  rationale: Cách diễn đạt tự nhiên, trang trọng vừa phải cho περί với sở hữu cách trong ngữ cảnh này.
- source_word: ὅτι
  choice: vì
  rationale: Hiểu ὅτι theo nghĩa nguyên nhân, nêu cơ sở của câu hỏi; ghi chú bảo lưu khả năng đọc theo nghĩa nội dung.
- source_word: ἠνέῳξέν σου τοὺς ὀφθαλμούς
  choice: người ấy đã mở mắt cho anh
  rationale: Giữ hình ảnh cụ thể của nguyên văn và thể hiện hành động đã xảy ra bằng “đã”.
- source_word: Προφήτης
  choice: một nhà tiên tri
  rationale: 'Danh từ vị ngữ không có mạo từ phù hợp nhất với nghĩa phân loại: người được chữa lành nhận định Đức Giê-su là một nhà tiên tri; không áp đặt một danh hiệu chuyên biệt.'
theological_decisions:
- issue: Προφήτης là danh từ chung hay danh hiệu
  choice: một nhà tiên tri
  alternative: Đấng Tiên Tri
  rationale: Mạch truyện cho thấy nhận thức đang phát triển của người được chữa lành. Cách dịch bằng danh từ chung không biến lời nhận định này thành một tuyên xưng danh hiệu chuyên biệt, nhưng chú thích vẫn bảo lưu sắc thái danh hiệu có thể có.
- issue: Chức năng của ὅτι trong câu hỏi
  choice: vì
  alternative: rằng
  rationale: Cách hiểu nguyên nhân phù hợp tự nhiên với câu hỏi được đặt ra dựa trên việc người ấy đã mở mắt cho anh; tuy vậy, cấu trúc Hy Lạp cũng cho phép liên hệ ὅτι với nội dung điều anh nói, nên khả năng ấy được ghi chú.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm nhưng dễ hiểu. Dùng “người ấy” thay cho đại từ quá thân mật, và dùng “Còn chính anh” để thể hiện sự nhấn mạnh của đại từ Hy Lạp σὺ mà vẫn tự nhiên trong tiếng Việt.
