  text: ἀπεκρίθη οὖν ⸀ἐκεῖνος· Εἰ ἁμαρτωλός ἐστιν οὐκ οἶδα· ἓν οἶδα ὅτι τυφλὸς ὢν ἄρτι βλέπω.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/025.yaml
  text: 'So that man answered[a], “Whether he is a sinner, I do not know. One thing I do know: though I was blind, now I see.”'
translation:
  language: vi
  text: 'Vậy người ấy đáp: “Người ấy có phải là người tội lỗi hay không, tôi không biết. Tôi chỉ biết một điều: trước kia tôi mù, nay tôi thấy.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη οὖν ἐκεῖνος
  choice: Vậy người ấy đáp
  rationale: “Vậy” giữ liên kết diễn ngôn của οὖν; “người ấy” thể hiện đại từ chỉ định ἐκεῖνος và tự nhiên trong văn kể; “đáp” là cách chuyển trực tiếp của ἀπεκρίθη.
- source_word: Εἰ ἁμαρτωλός ἐστιν
  choice: Ông ta có phải là người tội lỗi hay không
  rationale: Trong lời nói gián tiếp phụ thuộc vào “tôi không biết”, εἰ diễn tả câu hỏi gián tiếp “có… hay không”; cách dịch này giữ sự không xác quyết của người nói, không biến câu thành điều kiện.
- source_word: οὐκ οἶδα
  choice: tôi không biết
  rationale: Diễn đạt trực tiếp động từ οἶδα có nghĩa hiện tại và giữ nguyên giới hạn hiểu biết của người được chữa lành.
- source_word: ἓν οἶδα
  choice: Tôi chỉ biết một điều
  rationale: Đưa ἓν lên thành “một điều” và dùng “chỉ” để làm rõ sự tương phản nhấn mạnh với điều ông không biết ở mệnh đề trước.
- source_word: τυφλὸς ὢν
  choice: trước đây tôi bị mù
  rationale: Phân từ chỉ tình trạng mù trước kia, được hiểu nhờ sự đối lập với ἄρτι; “bị mù” là cách nói tự nhiên về tình trạng mất thị lực.
- source_word: ἄρτι βλέπω
  choice: còn bây giờ tôi thấy được
  rationale: “Bây giờ” giữ tương phản thời gian của ἄρτι; “thấy được” diễn đạt tự nhiên việc thị lực đã được phục hồi mà không thêm ý nghĩa thuộc linh vào lời nói.
theological_decisions:
- issue: Giữ lời chứng của người được chữa lành mà không đưa phán quyết thần học của người dịch về việc Đức Giê-su có tội hay không
  choice: Ông ta có phải là người tội lỗi hay không, tôi không biết.
  alternative: Nếu ông ta là người tội lỗi, tôi không biết.
  rationale: Câu này trình bày giới hạn nhận thức của người nói trước lời cáo buộc trong ngữ cảnh. Cấu trúc “có phải… hay không” giữ sự bỏ ngỏ của câu hỏi gián tiếp và không ngầm xác nhận tiền đề rằng Đức Giê-su là người tội lỗi.
translation_notes:
  register: 'Tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “ông ta” trong lời của người được chữa lành để chỉ người đang bị các đối thủ bàn luận, tránh tự động đưa danh xưng thần học không có trong câu Hy Lạp. Nhịp câu giữ sự tương phản mạnh giữa điều không biết và sự kiện chắc chắn: trước mù, nay thấy.'
