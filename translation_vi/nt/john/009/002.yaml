source:
  edition: SBLGNT
  text: καὶ ἠρώτησαν αὐτὸν οἱ μαθηταὶ αὐτοῦ λέγοντες· Ῥαββί, τίς ἥμαρτεν, οὗτος ἢ οἱ γονεῖς αὐτοῦ, ἵνα τυφλὸς γεννηθῇ;
base_translation:
  language: en
  yaml_path: translation/nt/john/009/002.yaml
  text: And his disciples asked him[a], saying, “Rabbi, who sinned, this man or his parents, that he should be born blind?”
translation:
  language: vi
  text: 'Các môn đồ của Ngài hỏi Ngài: “Ra-bi, ai đã phạm tội, người này hay cha mẹ người ấy, để người ấy sinh ra đã mù?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đến nỗi người ấy sinh ra đã mù.” Mệnh đề Hy Lạp có thể diễn tả mối liên hệ mục đích hoặc kết quả mà các môn đồ giả định trong câu hỏi.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἠρώτησαν
  choice: hỏi
  rationale: Động từ aorist ở đây thuật lại một câu hỏi trực tiếp; “hỏi” là cách diễn đạt tự nhiên, không thêm sắc thái chất vấn.
- source_word: μαθηταὶ
  choice: các môn đồ
  rationale: “Môn đồ” là cách gọi quen thuộc trong văn mạch Phúc Âm, giữ được quan hệ thầy–trò và người theo học.
- source_word: λέγοντες
  choice: rằng
  rationale: Trong tiếng Việt, cấu trúc “hỏi ... rằng” chuyển tải tự nhiên chức năng dẫn lời của phân từ λέγοντες mà không cần dịch cứng là “nói rằng”.
- source_word: Ῥαββί
  choice: Ra-bi
  rationale: Giữ lại danh xưng Do Thái và bối cảnh lịch sử; dạng phiên âm này dễ đọc đối với độc giả Việt.
- source_word: τίς
  choice: ai
  rationale: Đại từ nghi vấn trực tiếp hỏi người chịu trách nhiệm.
- source_word: ἥμαρτεν
  choice: đã phạm tội
  rationale: Thì aorist được diễn đạt tự nhiên bằng “đã phạm tội”, chỉ hành vi mà các môn đồ giả định là có liên hệ với tình trạng mù.
- source_word: οὗτος
  choice: người này
  rationale: Chỉ người mù đang được nói đến; cách dịch này giữ sắc thái chỉ định của nguyên văn.
- source_word: γονεῖς
  choice: cha mẹ
  rationale: Tương đương tự nhiên và chính xác của danh từ số nhiều chỉ cha mẹ một người.
- source_word: ἵνα
  choice: mà
  rationale: Trong câu hỏi tiếng Việt, “mà” diễn tả mối liên hệ mục đích/kết quả được các môn đồ giả định, đồng thời không ấn định quá mức quan hệ nhân quả.
- source_word: τυφλὸς γεννηθῇ
  choice: sinh ra đã bị mù
  rationale: Diễn đạt tự nhiên tình trạng mù từ khi sinh; “bị mù” phản ánh tình trạng bất lợi mà không gán rõ tác nhân.
theological_decisions:
- issue: Sắc thái nhân quả hoặc mục đích của ἵνα trong câu hỏi về tội lỗi và tình trạng mù bẩm sinh
  choice: Dịch “mà anh ta sinh ra đã bị mù” để giữ mối liên hệ được các môn đồ giả định.
  alternative: “đến nỗi anh ta sinh ra đã bị mù” hoặc “để anh ta sinh ra bị mù”
  rationale: Câu này thuật lại giả định trong câu hỏi của các môn đồ, chứ chưa xác nhận về mặt thần học rằng tội của người này hoặc cha mẹ trực tiếp gây ra tình trạng mù. Cách dịch giữ nguyên sự căng thẳng để lời đáp tiếp theo của Chúa Giê-xu xử lý.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Ngài” cho đại từ chỉ Chúa Giê-xu, “các môn đồ” theo lối dùng quen thuộc, và “anh ta” để chỉ người đàn ông mà không làm câu văn quá cổ.
