  rationale: Bản sửa thay “tin người” bằng “tin vào Người” để phản ánh chính xác πιστεύω εἰς αὐτόν, thêm “Vậy” để biểu đạt tự nhiên liên từ Καὶ, và đặt lời xưng hô sau câu hỏi cho nhịp lời thoại tiếng Việt. Chú thích được giữ và rút gọn để bảo toàn tính mơ hồ ngữ nghĩa của κύριε. Dấu chú thích [a] cần được đặt ngay sau “Chúa” trong định dạng xuất bản.
