id: JHN.9.18
reference: John 9:18
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Οὐκ ἐπίστευσαν οὖν οἱ Ἰουδαῖοι περὶ αὐτοῦ ὅτι ⸂ἦν τυφλὸς⸃ καὶ ἀνέβλεψεν, ἕως ὅτου ἐφώνησαν τοὺς γονεῖς αὐτοῦ ⸂τοῦ ἀναβλέψαντος⸃
base_translation:
  language: en
  yaml_path: translation/nt/john/009/018.yaml
  text: So the Jews did not believe concerning him that he had been blind and had received sight[a], until they called the parents of the one who had received sight.
translation:
  language: vi
  text: Vì vậy, người Do Thái không tin rằng người ấy đã bị mù và đã thấy được[a], cho đến khi họ gọi cha mẹ của người đã thấy được đến.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Trong ngữ cảnh này, “người Do Thái” có thể được hiểu là các nhà lãnh đạo Do Thái hoặc những người Giu-đê, tùy cách hiểu về cách sách Giăng dùng cụm từ này.
    reason: Giữ nguyên độ rộng của οἱ Ἰουδαῖοι trong bản văn chính, đồng thời nêu các cách hiểu theo ngữ cảnh.
lexical_decisions:
- source_word: ἐπίστευσαν
  choice: không tin
  rationale: Động từ đi với mệnh đề nội dung do ὅτι dẫn vào, nên diễn tả việc không chấp nhận một sự việc là thật; “không tin” là cách nói tự nhiên và chính xác.
- source_word: οἱ Ἰουδαῖοι
  choice: người Do Thái
  rationale: Giữ cách gọi trực tiếp của nguyên văn, không tự thu hẹp thành giới lãnh đạo hay cư dân Giu-đê; chú thích nêu khả năng hiểu theo ngữ cảnh.
- source_word: περὶ αὐτοῦ
  choice: rằng người ấy
  rationale: Trong tiếng Việt, cấu trúc tự nhiên là nối “không tin” trực tiếp với nội dung về người ấy, thay vì dịch cứng thành “về người ấy rằng”.
- source_word: ἦν τυφλὸς
  choice: vốn bị mù
  rationale: “Vốn” thể hiện tình trạng mù có trước việc được chữa lành; “bị mù” phù hợp cách diễn đạt thông dụng trong tiếng Việt.
- source_word: ἀνέβλεψεν
  choice: nay đã thấy được
  rationale: Trong bối cảnh chữa lành, động từ chỉ việc có được khả năng nhìn. “Thấy được” không hàm ý người ấy trước kia từng sáng mắt như “thấy lại”; “nay” làm rõ sự tương phản với tình trạng trước đó.
- source_word: ἕως ὅτου
  choice: cho đến khi
  rationale: Diễn đạt tự nhiên giới hạn thời gian của hành động không tin.
- source_word: ἐφώνησαν
  choice: gọi ... đến
  rationale: Trong bối cảnh thẩm vấn, cách nói này tự nhiên hơn chỉ “gọi”, nhưng không mạnh quá mức như “triệu tập”.
- source_word: γονεῖς
  choice: cha mẹ
  rationale: Tương đương chính xác và tự nhiên của danh từ số nhiều chỉ cha mẹ.
- source_word: τοῦ ἀναβλέψαντος
  choice: của người đã thấy được
  rationale: Giữ cấu trúc phân từ định danh của nguyên văn mà không thêm thông tin không được nói rõ.
theological_decisions:
- issue: Đối tượng được gọi là οἱ Ἰουδαῖοι trong sách Giăng
  choice: người Do Thái
  alternative: các nhà lãnh đạo Do Thái; người Giu-đê
  rationale: Nguyên văn dùng cách gọi rộng “người Do Thái”, dù trong mạch truyện có thể chỉ nhóm chức trách đang điều tra. Bản dịch chính giữ độ rộng và sự mơ hồ của từ Hy Lạp; chú thích giúp tránh hiểu rằng câu này quy kết cho toàn thể dân tộc Do Thái.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. Dùng “người ấy” thay cho đại từ có thể thiếu rõ ràng; dùng “thấy được” để tránh hàm ý ông từng có thị lực trước đó. Dấu chú thích [a] được đặt ngay sau mệnh đề có cụm từ cần giải thích.
