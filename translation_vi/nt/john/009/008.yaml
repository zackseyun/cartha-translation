base_translation:
  language: en
  yaml_path: translation/nt/john/009/008.yaml
  text: So the neighbors[a], and those who had seen him before as a beggar, were saying, “Is this not the man who used to sit and beg?”
translation:
  language: vi
  text: 'Vì vậy, những người hàng xóm và những người từng thấy anh trước kia trong tư cách là một người ăn xin nói: “Đây chẳng phải là người thường ngồi ăn xin sao?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát hình thức hơn: “Đây chẳng phải là người ngồi và ăn xin sao?” Tiếng Hy Lạp dùng các phân từ “ngồi” và “ăn xin” để nhận diện anh qua hoạt động quen thuộc trước kia.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Vì vậy
  rationale: Giữ lực nối tiếp và suy luận của câu chuyện sau việc người mù được chữa lành; cách nói tự nhiên và trang trọng vừa phải trong tiếng Việt.
- source_word: γείτονες
  choice: những người hàng xóm
  rationale: Chỉ những người sống gần anh; đây là cách dịch trực tiếp và thông dụng.
- source_word: θεωροῦντες αὐτὸν τὸ πρότερον
  choice: những người trước kia thường thấy anh
  rationale: Kết hợp ý quan sát trong θεωροῦντες với mốc thời gian trước đây của τὸ πρότερον; “thường thấy” phù hợp với việc họ nhận ra anh qua sinh hoạt quen thuộc.
- source_word: ὅτι προσαίτης ἦν
  choice: ăn xin
  rationale: Trong cấu trúc tiếng Việt, gắn với “thường thấy anh” diễn đạt tự nhiên việc trước kia họ thấy anh trong tư cách/nghề sinh sống là người ăn xin, không buộc ὅτι mang nghĩa nhân quả.
- source_word: ἔλεγον
  choice: nói
  rationale: Tiếng Việt không bắt buộc đánh dấu thể chưa hoàn thành; ngữ cảnh số nhiều vẫn cho phép hiểu đây là lời đang được họ trao đổi.
- source_word: Οὐχ οὗτός ἐστιν
  choice: Đây chẳng phải là ... sao?
  rationale: Giữ câu hỏi phủ định vốn chờ câu trả lời khẳng định, đồng thời tự nhiên trong tiếng Việt.
- source_word: ὁ καθήμενος καὶ προσαιτῶν
  choice: người vẫn thường ngồi ăn xin
  rationale: Hai phân từ xác định anh qua hoạt động quen thuộc trước đây; “vẫn thường” làm rõ sắc thái tập quán mà không dịch cứng hình thức phân từ.
theological_decisions: []
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, rõ ràng và trang nghiêm vừa phải. “Anh” phù hợp với một người đàn ông trưởng thành chưa được nêu tên trong mạch kể; câu hỏi giữ sắc thái nhận diện đầy kinh ngạc của nguyên bản.
