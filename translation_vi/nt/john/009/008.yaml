    rationale: Cách đặt này chủ yếu mô tả điều họ thấy anh làm, trong khi nguyên văn xác định anh là người ăn xin. “Từng thấy anh trước kia trong tư cách là một người ăn xin” giữ được ý nhận diện mà không buộc ὅτι phải là nhân quả.
  - severity: low
    issue: “Vẫn thường ngồi ăn xin” có thể gợi hoạt động còn tiếp diễn.
    rationale: Các phân từ hiện tại dùng để nhận diện người ấy qua hoạt động đặc trưng trước đây. “Thường ngồi ăn xin” truyền đạt điều này rõ hơn trong tiếng Việt.
