  text: καὶ ἠρώτησαν αὐτοὺς λέγοντες· Οὗτός ἐστιν ὁ υἱὸς ὑμῶν, ὃν ὑμεῖς λέγετε ὅτι τυφλὸς ἐγεννήθη; πῶς οὖν ⸂βλέπει ἄρτι⸃;
base_translation:
  language: en
  yaml_path: translation/nt/john/009/019.yaml
  text: And they asked them, saying, “Is this your son, whom you say was born blind? How then does he now see?”
translation:
  language: vi
  text: 'Họ hỏi cha mẹ anh: “Đây có phải là con trai của ông bà, người mà ông bà nói là bị mù từ khi sinh ra không? Vậy tại sao bây giờ anh ấy nhìn thấy?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἠρώτησαν αὐτοὺς λέγοντες
  choice: Họ hỏi cha mẹ anh
  rationale: Tiếng Việt tự nhiên không cần dịch riêng phân từ λέγοντες là “rằng”; αὐτούς được diễn rõ theo ngữ cảnh ngay trước đó là cha mẹ của người được chữa lành.
- source_word: Οὗτός ἐστιν ὁ υἱὸς ὑμῶν
  choice: Đây có phải là con trai của ông bà
  rationale: Dù hình thức Hy Lạp là câu trần thuật, ngữ cảnh cho thấy đây là câu hỏi. “Ông bà” là cách xưng hô tự nhiên với một cặp cha mẹ.
- source_word: ὃν ὑμεῖς λέγετε
  choice: người mà ông bà nói
  rationale: Giữ sắc thái trung tính của λέγετε, không thêm ý hoài nghi như “quả quyết” hay “tự nhận”.
- source_word: τυφλὸς ἐγεννήθη
  choice: bị mù từ khi sinh ra
  rationale: Diễn đạt tự nhiên tình trạng mù bẩm sinh; “từ khi sinh ra” rõ nghĩa trong tiếng Việt hiện đại.
- source_word: πῶς οὖν
  choice: Vậy sao
  rationale: Giữ quan hệ suy luận của οὖν, đồng thời phù hợp với lời chất vấn trực tiếp trong tiếng Việt.
- source_word: βλέπει ἄρτι
  choice: bây giờ anh ấy lại thấy được
  rationale: “Bây giờ” thể hiện sự tương phản với tình trạng trước kia; “thấy được” diễn tả tình trạng hiện tại mà không chuyển câu hỏi thành câu hỏi thuần túy về khả năng. Từ “lại” làm rõ nét tương phản hàm chứa trong câu hỏi.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện trang trọng vừa phải, tự nhiên và dễ hiểu. Dùng “ông bà” để xưng hô với cha mẹ và “anh ấy” để chỉ người con trưởng thành; không thêm sắc thái thần học hay hoài nghi ngoài văn bản.
