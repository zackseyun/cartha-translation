  - severity: low
    issue: “Thấy được” có thể được hiểu là khả năng nhìn.
    rationale: 'βλέπει là hiện tại chỉ thực trạng: người ấy hiện đang nhìn thấy. “Nhìn thấy” diễn đạt trực tiếp hơn mà vẫn tự nhiên.'
