    rationale: Động từ ἦν có nghĩa là «là/ở»; cùng παρὰ θεοῦ, cụm này biểu thị người ấy không có nguồn gốc «từ Đức Chúa Trời». «Không đến từ» là cách nói có thể chấp nhận, nhưng trong tiếng Việt dễ lệch sang hành động hoặc điểm xuất phát. «Không phải từ» sát và rõ hơn.
  revised_text: Nếu người này không phải từ Đức Chúa Trời[a], thì người ấy không thể làm được gì cả.
