source:
  edition: SBLGNT
  text: εἰ μὴ ἦν οὗτος παρὰ θεοῦ, οὐκ ἠδύνατο ποιεῖν οὐδέν.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/033.yaml
  text: If this man were not from God[a], he could do nothing.
translation:
  language: vi
  text: Nếu người này không phải từ Đức Chúa Trời[a], thì người ấy không thể làm được gì cả.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “Trừ khi người này từ Đức Chúa Trời mà đến.”'
    reason: Cụm εἰ μὴ có thể được diễn đạt bằng cấu trúc điều kiện tương đương «trừ khi», đồng thời vẫn giữ ý «từ Đức Chúa Trời» của παρὰ θεοῦ.
lexical_decisions:
- source_word: εἰ μὴ
  choice: Nếu ... không
  rationale: Giữ rõ cấu trúc điều kiện của tiếng Hy Lạp; trong sự kết hợp với động từ ở thì chưa hoàn thành, câu diễn tả một giả định trái với điều người nói cho là thật.
- source_word: ἦν
  choice: đến
  rationale: Trong cụm παρὰ θεοῦ, động từ 'đến' giúp tiếng Việt diễn đạt tự nhiên ý nguồn gốc 'đến từ', dù bản thân ἦν có nghĩa đen là 'là/ở'.
- source_word: οὗτος
  choice: người này
  rationale: Chỉ một người nam đang được bàn đến, tức Đức Chúa Jêsus; 'người này' tự nhiên và không thêm sắc thái miệt thị.
- source_word: παρὰ θεοῦ
  choice: đến từ Đức Chúa Trời
  rationale: παρά với sở hữu cách chỉ nguồn gốc. Cách dịch này giữ phạm vi nghĩa rộng của nguyên văn, không diễn giải hẹp thành 'được Đức Chúa Trời sai đến' hay 'được Đức Chúa Trời ban quyền'.
- source_word: οὐκ ἠδύνατο
  choice: không thể
  rationale: Diễn đạt trực tiếp sự bất khả năng và phù hợp với kết luận của câu điều kiện.
- source_word: ποιεῖν
  choice: làm được
  rationale: ποιέω có nghĩa rộng là 'làm'; ngữ cảnh cho thấy những việc đang nói đến là các dấu lạ nhưng không cần chèn cách giải thích ấy vào câu.
- source_word: οὐδέν
  choice: gì cả
  rationale: Kết hợp tự nhiên với 'không thể' trong tiếng Việt và giữ sắc thái phủ định toàn diện của οὐδέν.
theological_decisions:
- issue: Ý nghĩa của cụm 'đến từ Đức Chúa Trời' đối với Đức Chúa Jêsus
  choice: 'Giữ nguyên ý nguồn gốc rộng: ''đến từ Đức Chúa Trời''.'
  alternative: '''được Đức Chúa Trời sai đến'' hoặc ''được Đức Chúa Trời ban quyền'''
  rationale: Câu khẳng định mối liên hệ của Đức Chúa Jêsus với Đức Chúa Trời làm nền tảng cho các việc Ngài làm, nhưng nguyên văn không xác định cụm này chỉ nói về sứ mạng, thẩm quyền hay một nội hàm bản thể học cụ thể.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc 'Nếu ... không ..., thì ...' giữ lập luận điều kiện rõ ràng; 'gì cả' truyền đạt đầy đủ sức nhấn mạnh của phủ định kép trong tiếng Hy Lạp mà vẫn tự nhiên trong tiếng Việt.
