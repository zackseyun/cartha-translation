  source_fidelity: 'Bản nháp giữ đúng lập luận điều kiện, ý nguồn gốc trong παρὰ θεοῦ, và sự phủ định toàn diện của οὐκ ἠδύνατο ποιεῖν οὐδέν. Tuy nhiên, «không đến từ» dễ được hiểu là không xuất phát/không đi đến từ một nơi, trong khi ἦν παρὰ θεοῦ nói về tình trạng hay nguồn gốc: «không phải từ Đức Chúa Trời».'
  naturalness: Câu điều kiện với «thì» tự nhiên trong tiếng Việt hiện đại. «Không thể làm được gì cả» cũng tự nhiên; việc thêm «người ấy» ở mệnh đề chính giúp câu rõ chủ ngữ mà không thêm nghĩa.
  terminology: «Đức Chúa Trời» nhất quán với bản nháp và phù hợp với văn phong Kinh Thánh Tin Lành tiếng Việt. «Người này» giữ sắc thái chỉ định của οὗτος, không áp đặt sắc thái đánh giá.
