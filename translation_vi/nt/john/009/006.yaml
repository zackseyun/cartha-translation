base_translation:
  language: en
  yaml_path: translation/nt/john/009/006.yaml
  text: After saying these things[a], he spit on the ground and made mud from the saliva, and he spread the mud on his eyes,
translation:
  language: vi
  text: Nói những lời ấy xong, Ngài nhổ nước bọt xuống đất, làm thành bùn từ nước bọt ấy, rồi bôi[a] bùn lên mắt người ấy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “xức bùn lên mắt người ấy.” Động từ Hy Lạp có thể mang nghĩa “xức” hoặc “bôi lên.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα εἰπὼν
  choice: Nói những lời ấy xong
  rationale: Phân từ bất định quá khứ diễn tả hành động xảy ra trước các động từ chính; cách dịch này tự nhiên trong tiếng Việt và giữ rõ trình tự thời gian.
- source_word: ἔπτυσεν χαμαί
  choice: Ngài nhổ nước bọt xuống đất
  rationale: χαμαί có nghĩa là xuống đất hoặc trên mặt đất; cách diễn đạt này truyền đạt cụ thể, tự nhiên hành động trong nguyên văn.
- source_word: ἐποίησεν πηλὸν ἐκ τοῦ πτύσματος
  choice: trộn thành bùn
  rationale: πηλός có thể chỉ bùn hoặc đất sét; trong ngữ cảnh nước bọt được nhổ xuống đất rồi tạo thành hỗn hợp, “bùn” là từ thông dụng và thích hợp. “Trộn thành” diễn đạt tự nhiên việc tạo bùn từ nước bọt và đất mà không làm câu nặng nề.
- source_word: ἐπέχρισεν
  choice: bôi
  rationale: Động từ ἐπιχρίω có thể mang nghĩa bôi, phết hoặc xức. Vì vật được dùng là bùn và hành động ở đây mang tính vật lý cụ thể, “bôi” là cách dịch rõ ràng, tự nhiên, không tự ý thêm sắc thái nghi lễ; khả năng dịch “xức” được giữ trong chú thích.
- source_word: αὐτοῦ τὸν πηλὸν ἐπὶ τοὺς ὀφθαλμούς
  choice: bùn lên mắt người ấy
  rationale: Mạo từ xác định cho thấy đây là bùn vừa được làm ra, còn αὐτοῦ chỉ người mù trong văn cảnh. “Người ấy” làm rõ sở chỉ trong tiếng Việt mà không lặp lại danh xưng không cần thiết.
theological_decisions:
- issue: Sắc thái nghi lễ có thể có của ἐπέχρισεν
  choice: Dùng động từ chỉ hành động cụ thể “bôi” trong chính văn.
  alternative: “xức bùn lên mắt người ấy”
  rationale: “Xức” là một khả năng từ vựng có thật, nhưng trong câu này vật được bôi là bùn và bản văn không nói rõ đến nghi thức hay ý nghĩa biểu tượng. Chính văn vì thế dùng “bôi”, đồng thời chú thích bảo tồn cách hiểu khác mà không áp đặt kết luận thần học.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Ngài” để tiếp nối chủ thể là Đức Chúa Jêsus trong văn cảnh; câu giữ nhịp kể tuần tự và các hành động cụ thể của nguyên văn.
