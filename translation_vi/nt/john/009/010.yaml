  yaml_path: translation/nt/john/009/010.yaml
  text: So they said to him[a], “How were your eyes opened?”
translation:
  language: vi
  text: 'Vậy họ hỏi anh: “Mắt anh đã được mở ra bằng cách nào?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Làm thế nào mà mắt anh được mở ra?” Tiếng Hy Lạp giữ cấu trúc bị động.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγον
  choice: họ hỏi
  rationale: Động từ ở thì chưa hoàn thành có thể gợi lời nói đang diễn ra hoặc được lặp lại. Trong tiếng Việt, “họ hỏi” tự nhiên trong lời kể và ngữ cảnh cho thấy đây là câu hỏi trực tiếp; không cần thêm “cứ hỏi” vì có thể hàm ý sự lặp lại mạnh hơn nguyên văn.
- source_word: οὖν
  choice: Vì vậy
  rationale: Giữ sắc thái tiếp nối có tính hệ quả của liên từ, đồng thời vẫn tự nhiên trong tiếng Việt hiện đại.
- source_word: αὐτῷ
  choice: anh
  rationale: Đại từ chỉ người đàn ông vừa được sáng mắt. Trong cấu trúc “hỏi anh”, tiếng Việt không cần dịch riêng giới từ tương đương với “với/cho anh”.
- source_word: Πῶς
  choice: thế nào
  rationale: Cách hỏi tự nhiên về phương cách hoặc diễn biến trong tiếng Việt.
- source_word: ἠνεῴχθησάν
  choice: đã được mở ra
  rationale: Giữ thể bị động của động từ Hy Lạp và hình ảnh đôi mắt được mở ra, không diễn giải thành “được chữa lành” hay “nhìn thấy lại”.
- source_word: σου οἱ ὀφθαλμοί
  choice: mắt anh
  rationale: Diễn đạt quan hệ sở hữu tự nhiên trong tiếng Việt; danh từ số nhiều “đôi mắt” không bắt buộc phải biểu thị hình thái số nhiều trong cách nói này.
theological_decisions:
- issue: Chủ thể làm cho mắt được mở ra không được nêu rõ
  choice: Giữ cấu trúc bị động “được mở ra”
  alternative: Ai đã mở mắt cho anh / làm sao anh nhìn thấy lại được
  rationale: Nguyên văn không nêu tác nhân trong câu hỏi. Giữ thể bị động bảo toàn sự để ngỏ này và không đưa thêm một cách giải thích thần học hay y học vào bản văn.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. “Mắt anh đã được mở ra thế nào?” giữ hình ảnh và thể bị động của nguyên văn, dù hơi trang trọng hơn cách nói thông thường.
