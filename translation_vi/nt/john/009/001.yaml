  text: Καὶ παράγων εἶδεν ἄνθρωπον τυφλὸν ἐκ γενετῆς.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/001.yaml
  text: And as he was passing by[a], he saw a man blind from birth.
translation:
  language: vi
  text: Khi Đức Chúa Giê-su đang đi ngang qua[a], Ngài thấy một người mù từ khi mới sinh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Lúc đi ngang qua”; phân từ Hy Lạp mô tả Đức Chúa Giê-su đang trên đường đi khi Ngài thấy người ấy.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: Khi
  rationale: Liên từ Καὶ mở tiếp diễn biến trước; trong tiếng Việt, không cần dịch riêng là “và” khi quan hệ kể chuyện được diễn đạt tự nhiên bằng mệnh đề thời gian.
- source_word: παράγων
  choice: đang đi ngang qua
  rationale: Phân từ hiện tại diễn tả hành động đang diễn ra đồng thời và làm nền cho động từ chính; “đang đi ngang qua” giữ được sắc thái tiến hành.
- source_word: εἶδεν
  choice: thấy
  rationale: Dịch trực tiếp động từ ὁράω, không thêm sắc thái chủ ý như “để ý thấy”.
- source_word: ἄνθρωπον
  choice: một người
  rationale: Trong tiếng Việt, “một người” là cách gọi tự nhiên đối với cá nhân này; giới tính nam được làm rõ trong văn cảnh tiếp theo, còn câu này tự nó dùng danh từ ἄνθρωπος.
- source_word: τυφλὸν
  choice: bị mù
  rationale: Cách diễn đạt tiếng Việt tự nhiên cho tình trạng không nhìn thấy; đặt sau “một người” để giữ cấu trúc mô tả.
- source_word: ἐκ γενετῆς
  choice: từ khi sinh ra
  rationale: Thành ngữ chỉ tình trạng có từ lúc chào đời; cách dịch này rõ nghĩa và tự nhiên trong tiếng Việt hiện đại.
theological_decisions:
- issue: Cách biểu đạt giới tính của ἄνθρωπον
  choice: một người
  alternative: một người đàn ông
  rationale: ἄνθρωπος về mặt từ vựng có thể chỉ một con người mà không tự nó nhấn mạnh giới tính. Tiếng Việt dùng “một người” tự nhiên ở đây và không phủ nhận việc nhân vật được xác định là nam trong phần kể tiếp theo.
- issue: Chủ thể ngầm của παράγων và εἶδεν
  choice: Đức Chúa Jêsus
  alternative: Ngài
  rationale: Tiếng Hy Lạp để chủ thể ngầm theo văn cảnh trước. Nêu “Đức Chúa Jêsus” giúp câu đứng riêng theo đơn vị câu Kinh Thánh được rõ ràng, nhưng không thêm một nhân vật hay cách hiểu thần học mới.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Jêsus” theo lối gọi Kinh Thánh Tin Lành quen thuộc; câu được tái cấu trúc bằng mệnh đề thời gian để diễn đạt tự nhiên quan hệ giữa phân từ và động từ chính.
