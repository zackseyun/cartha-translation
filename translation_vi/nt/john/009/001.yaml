  source_fidelity: Bản dịch truyền đạt đúng quan hệ đồng thời của phân từ παράγων với động từ chính εἶδεν, cũng như ý nghĩa “một người mù từ khi sinh ra” của ἄνθρωπον τυφλὸν ἐκ γενετῆς. Tuy nhiên, cách viết tên riêng “Jêsus” không theo chính tả Việt ngữ hiện đại chuẩn; nên dùng “Giê-su”.
