  text: Ἄγουσιν αὐτὸν πρὸς τοὺς Φαρισαίους τόν ποτε τυφλόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/013.yaml
  text: They brought the man who had formerly been blind to the Pharisees[a].
translation:
  language: vi
  text: Người ta dẫn người trước kia bị mù đến với những người Pha-ri-si.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἄγουσιν
  choice: Người ta dẫn
  rationale: Động từ hiện tại được dùng như hiện tại lịch sử trong lời kể. Tiếng Việt có thể giữ dạng “dẫn” một cách tự nhiên, tạo sắc thái kể chuyện sống động mà không cần chuyển thành quá khứ.
- source_word: αὐτὸν
  choice: người
  rationale: Đại từ “người ấy/ông ấy” kết hợp với cụm đồng vị theo sau; trong tiếng Việt, gộp thành “người trước kia bị mù” tự nhiên và xác định rõ đối tượng.
- source_word: πρὸς τοὺς Φαρισαίους
  choice: đến với những người Pha-ri-si
  rationale: πρός với đối cách chỉ sự chuyển động hướng đến người nào đó. “Đến với” giữ nghĩa trực tiếp, ít diễn giải hơn “đến trước mặt”.
- source_word: Φαρισαίους
  choice: những người Pha-ri-si
  rationale: Dùng tên gọi phiên âm quen thuộc trong tiếng Việt và thêm “những người” để chỉ rõ đây là một nhóm người.
- source_word: τόν ποτε τυφλόν
  choice: người trước kia bị mù
  rationale: Cụm tính từ được danh từ hóa, nghĩa là “người trước kia mù”. Cách diễn đạt này tự nhiên trong tiếng Việt và làm rõ sự tương phản giữa tình trạng trước đây với hiện tại.
- source_word: ποτε
  choice: trước kia
  rationale: Trong ngữ cảnh này, ποτε chỉ tình trạng từng có trong quá khứ; “trước kia” rõ nghĩa và tự nhiên.
- source_word: τυφλόν
  choice: bị mù
  rationale: “Bị mù” là cách nói thông dụng, tự nhiên trong tiếng Việt để mô tả tình trạng không nhìn thấy của người này.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Giữ hiện tại lịch sử của tiếng Hy Lạp vì cách kể “Người ta dẫn…” vẫn tự nhiên trong tiếng Việt. Không thêm chú thích vì trật tự từ khác nhau không tạo ra khác biệt thực chất về nghĩa trong bản dịch tiếng Việt.
