base_translation:
  language: en
  yaml_path: translation/nt/john/009/037.yaml
  text: Jesus said to him[a], “You have seen him, and the one speaking with you is he.”
translation:
  language: vi
  text: 'Chúa Giê-su nói với người ấy: “Anh đã thấy Người, và Đấng đang nói với anh chính là Người.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπεν αὐτῷ
  choice: nói với người
  rationale: Động từ aorist εἶπεν thuật lại lời nói trực tiếp; đại từ tặng cách αὐτῷ chỉ người được nói với. “Nói với người” tự nhiên trong văn kể trang trọng và không diễn giải quá mức như “bảo người”.
- source_word: Καὶ ἑώρακας αὐτὸν
  choice: Anh đã thấy Ngài
  rationale: Thì hoàn thành của ὁράω diễn tả việc đã xảy ra nhưng còn liên hệ trực tiếp đến hiện tại. Trong tiếng Việt, “đã thấy” truyền đạt tự nhiên ý này; không cần dịch καί thành “và” ở đầu câu vì như vậy gượng, còn quan hệ liên kết vẫn được giữ bằng mệnh đề tiếp theo.
- source_word: ὁ λαλῶν μετὰ σοῦ
  choice: Đấng đang nói chuyện với anh
  rationale: Phân từ hiện tại có mạo từ được chuyển thành danh ngữ “Đấng đang…”. “Nói chuyện với” giữ sắc thái tương hỗ của μετά với sở hữu cách, thay vì thu hẹp thành “nói với”.
- source_word: ἐκεῖνός ἐστιν
  choice: chính … là Ngài
  rationale: Đại từ chỉ định ἐκεῖνος trong công thức nhận diện mang lực nhấn mạnh. Cấu trúc “chính … là Ngài” vừa tự nhiên trong tiếng Việt vừa giữ sự tự nhận diện trực tiếp mà không lặp lại danh xưng từ câu trước.
theological_decisions:
- issue: Đức Chúa Jêsus tự nhận mình là đối tượng được nhắc đến trong câu hỏi ngay trước đó
  choice: “chính Đấng đang nói chuyện với anh là Ngài”
  alternative: “Ngài chính là người đang nói với anh”
  rationale: Bản dịch giữ lời nhận diện rõ ràng nhưng không tự ý chèn lại danh xưng “Con Người” vốn không xuất hiện trong câu Hy Lạp này. Trật tự đã chọn cũng bảo tồn trọng tâm đặt trên người hiện đang đối thoại với anh.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Jêsus” theo văn phong Kinh Thánh Tin Lành phổ biến; “anh” phù hợp với lời trực tiếp dành cho người đàn ông trưởng thành mà không tạo sắc thái xa cách. Viết hoa “Đấng/Ngài” để chỉ Đức Chúa Jêsus theo quy ước tôn kính tiếng Việt, không nhằm giải quyết thêm một vấn đề thần học.
