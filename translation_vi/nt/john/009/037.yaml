  rationale: Bản sửa giữ nguyên lời nhận diện cô đọng của tiếng Hy Lạp, không lặp lại danh xưng từ câu trước và không áp đặt diễn giải thần học. Cú pháp được chỉnh để lời thoại tự nhiên, trang trọng, và rõ quy chiếu trong tiếng Việt hiện đại.
