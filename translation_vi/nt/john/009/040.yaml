source:
  edition: SBLGNT
  text: ⸀ἤκουσαν ἐκ τῶν Φαρισαίων ταῦτα οἱ ⸂μετ’ αὐτοῦ ὄντες⸃, καὶ εἶπον αὐτῷ· Μὴ καὶ ἡμεῖς τυφλοί ἐσμεν;
base_translation:
  language: en
  yaml_path: translation/nt/john/009/040.yaml
  text: Some of the Pharisees who were with him heard these things and said to him[a], “Surely we are not blind too, are we?”
translation:
  language: vi
  text: 'Một số người Pha-ri-si đang ở cùng Đức Giê-su nghe những điều ấy thì nói với Ngài: “Chẳng lẽ chúng tôi cũng mù sao?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Chúng tôi cũng mù sao?” Từ μή trong tiếng Hy Lạp mở đầu câu hỏi cho thấy họ mong câu trả lời là “không”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤκουσαν
  choice: nghe
  rationale: Động từ ở thì aorist chỉ việc họ nghe được điều Đức Chúa Jêsus vừa phán; “nghe” tự nhiên trong văn thuật sự.
- source_word: ἐκ τῶν Φαρισαίων
  choice: một số người Pha-ri-si
  rationale: Cấu trúc bộ phận ἐκ với sở hữu cách chỉ một nhóm trong số những người Pha-ri-si, không phải toàn thể.
- source_word: ταῦτα
  choice: những lời ấy
  rationale: Đại từ số nhiều quy chiếu đến những điều Đức Chúa Jêsus vừa phán; “những lời ấy” tự nhiên trong tiếng Việt và phù hợp ngữ cảnh lời nói.
- source_word: οἱ μετ’ αὐτοῦ ὄντες
  choice: đang ở cùng Đức Chúa Jêsus
  rationale: Cụm phân từ có mạo từ xác định những người Pha-ri-si hiện diện cùng Ngài; thêm danh xưng để đại từ quy chiếu rõ ràng trong tiếng Việt.
- source_word: εἶπον αὐτῷ
  choice: nói với Ngài
  rationale: Giữ nghĩa thông thường của λέγω khi dẫn lời trực tiếp; hình thức câu trích dẫn tự biểu thị đây là câu hỏi.
- source_word: Μὴ
  choice: Chẳng lẽ ... sao?
  rationale: Cách hỏi này trong tiếng Việt truyền đạt câu hỏi μή mong đợi câu trả lời phủ định và sắc thái khó tin, nhưng không biến kỳ vọng ấy thành một lời khẳng định.
- source_word: καὶ
  choice: cũng
  rationale: Liên kết “chúng tôi” với những người mù vừa được nhắc đến và diễn đạt tự nhiên ý “cũng/too”.
- source_word: ἡμεῖς
  choice: chúng tôi
  rationale: Đại từ Hy Lạp được nêu rõ để nhấn mạnh chủ thể. “Chúng tôi” phù hợp khi nhóm Pha-ri-si nói với Đức Chúa Jêsus, người không thuộc nhóm ấy.
- source_word: τυφλοί
  choice: mù
  rationale: Giữ nguyên hình ảnh không được định tính trong nguyên văn, để ngữ cảnh chuyển tải nghĩa ẩn dụ.
- source_word: ἐσμεν
  choice: '[hàm ẩn trong cấu trúc] ... mù sao'
  rationale: Tiếng Việt không cần động từ nối tương đương “là” trong vị ngữ tính từ; cấu trúc “chúng tôi cũng mù sao” diễn đạt tự nhiên thì hiện tại.
theological_decisions:
- issue: Có nên nói rõ τυφλοί là sự mù lòa thuộc linh hay không
  choice: Giữ “mù” mà không thêm “thuộc linh”
  alternative: mù về tâm linh
  rationale: Ngữ cảnh cho thấy nghĩa ẩn dụ, nhưng nguyên văn không định tính từ này. Cách dịch ngắn gọn bảo toàn sự mơ hồ có chủ ý và nét châm biếm trong sách Giăng.
- issue: Sắc thái của câu hỏi với μή
  choice: Dùng “Chẳng lẽ ... sao?” và giải thích kỳ vọng phủ định trong chú thích
  alternative: Chúng tôi cũng mù sao?
  rationale: μή thường cho thấy người hỏi mong câu trả lời là “không”. Cấu trúc đã phản ánh sắc thái ấy, còn chú thích giúp người đọc nhận ra đặc điểm ngữ pháp mà không cường điệu thành sự chắc chắn tuyệt đối.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Jêsus/Ngài” theo lối gọi kính trọng; “Pha-ri-si” là dạng phiên âm quen thuộc. Câu hỏi giữ được vẻ tự tin pha khó tin của người nói mà không giải thích quá mức.
