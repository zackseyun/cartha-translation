review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng mệnh lệnh đi rửa ở hồ Si-lô-am, lời chú giải tên hồ, và kết quả người ấy trở về có thể nhìn thấy. Tuy nhiên, “Được Sai Đi” không phản ánh tự nhiên hay chính xác sắc thái bị động của Ἀπεσταλμένος; trong tiếng Việt, “sai đi” thường gợi ý bị đuổi đi hoặc được phái đi xa, thay vì ý “được sai phái.”
  naturalness: Câu hiện tại nhìn chung dễ hiểu, nhưng “anh đi rửa” hơi thiếu đối tượng/địa điểm trong mạch kể, và viết hoa từng chữ trong cụm giải nghĩa tên (“Được Sai Đi”) không tự nhiên. “Người ấy liền đi rửa, rồi trở về và nhìn thấy được” mạch lạc, hiện đại và vẫn giữ nhịp kể của nguyên văn.
  terminology: Giữ “Si-lô-am” là phiên âm chấp nhận được từ Σιλωάμ. Đổi lời giải nghĩa thành “được sai phái” để diễn đạt participle bị động Ἀπεσταλμένος mà không thêm diễn giải về biểu tượng hay đồng nhất trực tiếp với Chúa Giê-xu.
  issues:
  - severity: medium
    issue: Cụm “Được Sai Đi” trong lời chú giải tên Si-lô-am
    rationale: Ἀπεσταλμένος là phân từ bị động, nghĩa là “được sai/phái.” “Sai đi” trong tiếng Việt không phải cách chuyển tự nhiên ở đây và có thể gây hiểu lệch. “được sai phái” giữ được thể bị động và ý nghĩa từ vựng mà không diễn giải thần học.
  - severity: low
    issue: Viết hoa từng chữ trong cụm giải nghĩa
    rationale: Đây là lời dịch nghĩa của tên gọi, không cần trình bày như một tước hiệu trong tiếng Việt. Viết thường tự nhiên hơn và tránh làm tăng sắc thái thần học ngoài nguyên văn.
