revisions:
- from: 'Ngài nói với anh: “Hãy đi rửa tại hồ Si-lô-am” (tên này được dịch là “Được Sai Đi”[a]). Vậy, anh đi rửa, rồi trở lại và nhìn thấy được.'
  to: 'Ngài nói với anh: “Hãy đi rửa tại hồ Si-lô-am” (tên này được dịch là “được sai phái”[a]). Vậy, người ấy liền đi rửa, rồi trở về và nhìn thấy được.'
  rationale: Bản sửa chỉ điều chỉnh lời giải nghĩa của Σιλωάμ và làm trơn mạch kể tiếng Việt. “được sai phái” tương ứng sát với Ἀπεσταλμένος, duy trì tính bị động, và không áp đặt cách giải thích biểu tượng. Các yếu tố còn lại—mệnh lệnh đi rửa, địa danh, trình tự đi/rửa/trở về, và kết quả nhìn thấy—đều được giữ nguyên.
