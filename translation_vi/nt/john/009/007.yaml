id: JHN.9.7
reference: John 9:7
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτῷ· Ὕπαγε νίψαι εἰς τὴν κολυμβήθραν τοῦ Σιλωάμ (ὃ ἑρμηνεύεται Ἀπεσταλμένος). ἀπῆλθεν οὖν καὶ ἐνίψατο, καὶ ἦλθεν βλέπων.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/007.yaml
  text: And he said to him[a], “Go, wash in the pool of Siloam” (which is translated “Sent”). So he went and washed, and came back seeing.
translation:
  language: vi
  text: 'Ngài nói với anh: “Hãy đi rửa tại hồ Si-lô-am” (tên này được dịch là “được sai phái”[a]). Vậy, người ấy liền đi rửa, rồi trở về và nhìn thấy được.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “nghĩa là ‘được sai phái.’”'
    reason: Nêu cách diễn đạt tự nhiên khác cho ἑρμηνεύεται; động từ này có thể được chuyển là “được dịch là” hoặc “nghĩa là” trong ngữ cảnh lời chú giải tên gọi.
lexical_decisions:
- source_word: Ὕπαγε
  choice: Hãy đi
  rationale: Mệnh lệnh đơn giản chỉ sự di chuyển; cách dịch này tự nhiên, rõ ràng và không thêm sắc thái ngoài nguyên văn.
- source_word: νίψαι / ἐνίψατο
  choice: rửa / đi rửa
  rationale: νίπτω thường chỉ việc rửa, nhất là rửa một phần thân thể chứ không nhất thiết là tắm toàn thân. Tiếng Việt có thể để hàm ý phản thân trong ngữ cảnh mà không cần thêm “mình”.
- source_word: εἰς τὴν κολυμβήθραν
  choice: tại hồ
  rationale: κολυμβήθρα là hồ hoặc bể chứa nước. Với động từ “rửa”, “tại hồ” là cách nói tự nhiên, tránh hàm ý không chắc chắn rằng anh phải bước hẳn xuống hồ.
- source_word: Σιλωάμ
  choice: Si-lô-am
  rationale: Phiên âm trực tiếp địa danh Hy Lạp Σιλωάμ theo lối dễ đọc trong tiếng Việt.
- source_word: ὃ ἑρμηνεύεται Ἀπεσταλμένος
  choice: tên này được dịch là “Được Sai Đi”
  rationale: Giữ nguyên lời giải thích minh nhiên của tác giả. “Được Sai Đi” bảo toàn dạng bị động và không tự ý làm nổi bật thêm ý nghĩa biểu tượng.
- source_word: οὖν
  choice: Vậy
  rationale: Diễn tả hệ quả tự nhiên trong mạch kể chuyện bằng một từ nối gọn và trang trọng vừa phải.
- source_word: ἀπῆλθεν
  choice: anh đi
  rationale: Thể quá khứ kể chuyện chỉ việc rời đi; “anh đi” là cách diễn đạt trực tiếp và tự nhiên.
- source_word: ἦλθεν βλέπων
  choice: trở lại và nhìn thấy được
  rationale: “Trở lại” thể hiện sự đối ứng tự nhiên với việc anh đã đi, còn “nhìn thấy được” nêu kết quả chữa lành. Cách dịch này rõ nghĩa trong tiếng Việt mà không giải thích thêm cơ chế hay ý nghĩa thần học.
theological_decisions:
- issue: Cách chuyển lời giải thích tên Si-lô-am mà không diễn giải quá mức biểu tượng trong sách Giăng
  choice: 'Giữ lời giải thích trong ngoặc: “tên này được dịch là ‘Được Sai Đi’.”'
  alternative: Diễn giải rõ rằng tên hồ tượng trưng cho Chúa Giê-xu là Đấng được Cha sai đến.
  rationale: Nguyên văn tự cung cấp lời giải thích về tên gọi, nên cần giữ trong chính văn; tuy nhiên, câu này không nói rõ mối liên hệ biểu tượng, vì vậy bản dịch không nên thêm một cách giải nghĩa thần học vào lời kể.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, rõ ràng và trang trọng vừa phải. Dùng “Ngài” cho Chúa Giê-xu và “anh” cho người được chữa lành; tránh lối văn cổ cũng như tránh thêm cách giải thích hệ phái.
