  verdict: revise
  source_fidelity: Bản dịch truyền đạt đúng các hành động chính và giữ cách người được chữa lành chỉ nhận diện Giê-su là “người tên là Giê-su,” không thêm tước hiệu thần học. Tuy nhiên, “rửa đi” có thể gợi nghĩa ‘rửa cho trôi đi’ trong tiếng Việt; mệnh lệnh νίψαι ở đây tự nhiên hơn là “hãy rửa.”
  naturalness: Câu cuối “tôi nhìn thấy được” hiểu được nhưng kém tự nhiên hơn cách nói thành ngữ, rõ nghĩa trong ngữ cảnh chữa người mù là “tôi được sáng mắt.” Thêm “đã” vào hai hành động đã hoàn tất giúp mạch kể quá khứ tự nhiên hơn.
  terminology: “Giê-su,” “Si-lô-am,” “bùn,” và “bôi lên mắt tôi” phù hợp tiếng Việt hiện đại và phản ánh tốt các từ Hy Lạp. Ghi chú về “đất sét,” “xức/phết,” và “được sáng mắt” thích hợp.
  issues:
