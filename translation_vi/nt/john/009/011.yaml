id: JHN.9.11
reference: John 9:11
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀπεκρίθη ⸀ἐκεῖνος· ⸂Ὁ ἄνθρωπος ὁ⸃ λεγόμενος Ἰησοῦς πηλὸν ἐποίησεν καὶ ἐπέχρισέν μου τοὺς ὀφθαλμοὺς καὶ εἶπέν μοι ⸀ὅτι Ὕπαγε εἰς ⸀τὸν Σιλωὰμ καὶ νίψαι· ἀπελθὼν ⸀οὖν καὶ νιψάμενος ἀνέβλεψα.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/011.yaml
  text: He answered[a], “The man called Jesus made mud and spread it on my eyes, and he told me, ‘Go to Siloam and wash.’ So I went away and washed[c][b], and I received my sight.”
translation:
  language: vi
  text: 'Người ấy trả lời: “Người tên là Giê-su đã làm bùn[a], bôi lên mắt tôi[b], rồi bảo tôi: ‘Hãy đi đến Si-lô-am và hãy rửa.’ Vậy nên tôi đã đi, đã rửa, và tôi được sáng mắt[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đất sét.” Từ Hy Lạp πηλός có thể chỉ bùn hoặc đất sét.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “xức mắt tôi” hoặc “phết lên mắt tôi.” Động từ Hy Lạp có nghĩa là bôi, phết hoặc xức lên.'
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “tôi nhận được thị lực.” Trong ngữ cảnh này, động từ chỉ việc một người mù có được khả năng nhìn thấy.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη ἐκεῖνος
  choice: Người ấy trả lời
  rationale: Diễn đạt đại từ chỉ định ἐκεῖνος một cách tự nhiên, đồng thời duy trì sự liên kết với người vừa được hỏi trong mạch truyện.
- source_word: Ὁ ἄνθρωπος ὁ λεγόμενος Ἰησοῦς
  choice: Người tên là Giê-su
  rationale: 'Giữ cách nhận diện đơn giản của người được chữa lành: ông gọi Giê-su là một người, chứ chưa dùng một danh xưng mang tính tuyên xưng.'
- source_word: πηλὸν ἐποίησεν
  choice: đã làm bùn
  rationale: πηλός có thể chỉ bùn hoặc đất sét; trong ngữ cảnh Giê-su trộn nước bọt với đất, “bùn” tự nhiên và dễ hiểu hơn trong tiếng Việt hiện đại.
- source_word: ἐπέχρισέν μου τοὺς ὀφθαλμούς
  choice: bôi lên mắt tôi
  rationale: Diễn tả rõ hành động phết hoặc bôi chất bùn lên mắt, không đưa vào sắc thái nghi lễ mà từ “xức” có thể gợi ra.
- source_word: εἶπέν μοι ὅτι
  choice: rồi bảo tôi
  rationale: Cách dẫn mệnh lệnh trực tiếp tự nhiên trong tiếng Việt và thể hiện đúng nghĩa “nói với tôi”.
- source_word: Ὕπαγε εἰς τὸν Σιλωὰμ καὶ νίψαι
  choice: Hãy đi đến Si-lô-am và rửa đi
  rationale: Giữ hai mệnh lệnh liên tiếp và không tự ý thêm “hồ” vì câu Hy Lạp tại đây chỉ ghi địa danh Si-lô-am.
- source_word: ἀπελθὼν οὖν καὶ νιψάμενος
  choice: Vậy tôi đi, rửa
  rationale: “Vậy” thể hiện quan hệ kết quả của οὖν; chuỗi động từ ngắn gọn phản ánh việc người ấy làm theo lời truyền.
- source_word: ἀνέβλεψα
  choice: tôi nhìn thấy được
  rationale: Trong ngữ cảnh chữa lành người mù, động từ mang nghĩa có được khả năng nhìn thấy. Cách dịch này tránh “lại” vì người này bị mù từ khi sinh ra.
theological_decisions:
- issue: Cách người được chữa lành nhận diện Giê-su
  choice: Người tên là Giê-su
  alternative: Giê-su, người ấy / Chúa Giê-su
  rationale: 'Giữ nguyên mức độ hiểu biết của người nói tại thời điểm này trong diễn tiến câu chuyện: ông nhận diện Giê-su đơn giản là một người có tên Giê-su, không đưa lời tuyên xưng hoặc tước hiệu thần học về sau vào câu nói.'
- issue: Sắc thái của hành động bôi bùn
  choice: bôi lên mắt tôi
  alternative: xức mắt tôi
  rationale: “Bôi” truyền đạt hành động vật lý được kể ở đây mà không quyết định rằng động từ nhất thiết mang ý nghĩa nghi lễ hay biểu tượng.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Giê-su” và “Si-lô-am” theo lối phiên âm phổ biến. Lời kể ngắn gọn, trực tiếp, phù hợp với lời đáp của người bình dân; tránh thuật ngữ nghi lễ không cần thiết và tránh từ “lại” vì người này mù từ thuở mới sinh.
