- from: 'Người ấy trả lời: “Người tên là Giê-su đã làm bùn[a], bôi lên mắt tôi[b], rồi bảo tôi: ‘Hãy đi đến Si-lô-am và rửa đi.’ Vậy tôi đi, rửa, và tôi nhìn thấy được[c].”'
  to: 'Người ấy trả lời: “Người tên là Giê-su đã làm bùn[a], bôi lên mắt tôi[b], rồi bảo tôi: ‘Hãy đi đến Si-lô-am và hãy rửa.’ Vậy nên tôi đã đi, đã rửa, và tôi được sáng mắt[c].”'
  rationale: 'Chỉnh sửa chỉ nhằm làm rõ và tự nhiên hóa tiếng Việt: thay “rửa đi” bằng mệnh lệnh đơn giản “hãy rửa,” và dùng “được sáng mắt” cho kết quả chữa lành. Bản sửa vẫn giữ trình tự nguyên văn: làm bùn, bôi lên mắt, truyền đi rửa, người ấy đi, rửa và nhận được thị lực.'
