  - severity: low
    issue: “tôi nhìn thấy được” hơi gượng trong lời kể về việc khỏi mù.
    rationale: ἀνέβλεψα trong ngữ cảnh này chỉ việc có được thị lực. “Tôi được sáng mắt” là cách nói tự nhiên, rõ nghĩa và không hàm ý người ấy từng thấy trước đó.
