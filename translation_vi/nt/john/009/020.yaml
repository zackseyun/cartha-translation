  rationale: Bản sửa giữ nguyên mạch tiếp nối của οὖν và nội dung chứng nhận của cha mẹ, đồng thời thay đại từ có sắc thái không phù hợp bằng cách lặp lại danh ngữ tự nhiên trong tiếng Việt. Cụm “sinh ra đã mù” diễn đạt trực tiếp τυφλὸς ἐγεννήθη mà không hàm ý nguyên nhân của tình trạng mù.
