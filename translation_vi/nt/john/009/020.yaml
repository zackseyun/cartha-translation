translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “cha mẹ” thay cho cách gọi dài hơn; dùng “nó” trong lời cha mẹ nói về con trai trưởng thành, phù hợp khẩu ngữ tự nhiên nhưng vẫn giữ sắc thái lời chứng trực tiếp.
