  text: So his parents answered and said[a], “We know that this is our son and that he was born blind.
translation:
  language: vi
  text: 'Vì vậy, cha mẹ người ấy trả lời: “Chúng tôi biết đây là con trai chúng tôi và con trai chúng tôi sinh ra đã mù.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὖν
  choice: Vì vậy
  rationale: Đánh dấu sự tiếp nối mang tính suy luận từ cuộc chất vấn ở câu trước; cách dịch này giữ rõ liên hệ logic mà vẫn tự nhiên.
- source_word: οἱ γονεῖς αὐτοῦ
  choice: cha mẹ anh
  rationale: Danh từ số nhiều chỉ cha và mẹ của người đã được chữa lành; đại từ “anh” phù hợp với cách quy chiếu tự nhiên trong tiếng Việt.
- source_word: ἀπεκρίθησαν ... καὶ εἶπαν
  choice: trả lời
  rationale: Trong tiếng Việt hiện đại, dịch gộp thành “trả lời” tránh lối diễn đạt nặng nề “trả lời và nói” nhưng vẫn truyền đạt đầy đủ chức năng diễn ngôn của cặp động từ Hy Lạp.
- source_word: Οἴδαμεν
  choice: Chúng tôi biết
  rationale: Diễn đạt trực tiếp lời xác nhận chắc chắn của cha mẹ.
- source_word: οὗτός ἐστιν ὁ υἱὸς ἡμῶν
  choice: đây là con trai chúng tôi
  rationale: Giữ sự chỉ định và nhận diện rõ ràng, đồng thời dùng cấu trúc tiếng Việt tự nhiên.
- source_word: τυφλὸς ἐγεννήθη
  choice: nó bị mù từ khi sinh ra
  rationale: Truyền đạt tự nhiên tình trạng mù có từ lúc chào đời; “bị mù” ở đây mô tả tình trạng, không xác định nguyên nhân.
