  edition: SBLGNT
  text: ἄλλοι ἔλεγον ὅτι Οὗτός ἐστιν· ἄλλοι ⸂ἔλεγον· Οὐχί, ἀλλὰ⸃ ὅμοιος αὐτῷ ἐστιν. ἐκεῖνος ἔλεγεν ὅτι Ἐγώ εἰμι.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/009.yaml
  text: Some were saying[a], “This is he.” Others were saying, “No, but he is like him.” He kept saying, “I am he.”
translation:
  language: vi
  text: 'Có người nói: “Chính là người ấy.” Người khác nói: “Không, nhưng chỉ giống người ấy thôi.” Còn người ấy cứ nói: “Chính tôi đây.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát chữ: “Tôi là.” Theo văn cảnh, người đàn ông đang xác nhận mình chính là người họ bàn đến.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλοι ... ἄλλοι
  choice: Có người ... Những người khác
  rationale: Hai lần dùng ἄλλοι phân chia đám đông thành các nhóm có ý kiến đối lập; cách diễn đạt này tự nhiên trong tiếng Việt và giữ rõ sự tương phản.
- source_word: ἔλεγον ... ἔλεγον
  choice: nói ... lại nói
  rationale: Thì chưa hoàn thành mô tả cuộc bàn luận đang diễn ra. Tiếng Việt không đánh dấu thể bằng biến tố; “lại” giúp thể hiện nhóm thứ hai đang nêu ý kiến đối lập mà không làm câu nặng nề.
- source_word: Οὗτός ἐστιν
  choice: Chính là anh ta
  rationale: Giữ lời nhận diện ngắn gọn, trực tiếp; “chính” truyền đạt sắc thái xác nhận người đang được bàn đến.
- source_word: Οὐχί, ἀλλὰ
  choice: Không phải, nhưng
  rationale: Diễn đạt rõ sự phủ định rồi chuyển sang nhận định tương phản.
- source_word: ὅμοιος αὐτῷ ἐστιν
  choice: trông giống anh ta
  rationale: Trong ngữ cảnh nhận diện một người bằng diện mạo, “trông giống” là cách nói tự nhiên và vẫn phân biệt sự tương tự với sự đồng nhất.
- source_word: ἐκεῖνος ἔλεγεν
  choice: Còn anh ấy cứ nói
  rationale: “Còn” chuyển điểm nhìn sang chính người đàn ông; “cứ nói” truyền đạt thể chưa hoàn thành với sắc thái lặp lại hoặc kiên trì xác nhận.
- source_word: Ἐγώ εἰμι
  choice: Chính là tôi
  rationale: Trong ngữ cảnh này, cụm từ là lời tự nhận diện. “Chính là tôi” tự nhiên trong tiếng Việt, giữ sự nhấn mạnh của ἐγώ và tránh gán cho lời người được chữa lành một tuyên bố thần học không do ngữ cảnh đòi hỏi.
theological_decisions:
- issue: Cách dịch Ἐγώ εἰμι trong văn mạch Giăng
  choice: Chính là tôi
  alternative: Tôi là
  rationale: Văn mạch trực tiếp là cuộc tranh luận về danh tính của người từng bị mù; anh xác nhận mình chính là người họ đang nói đến. Bản dịch thể hiện chức năng tự nhận diện, còn chú thích giữ lại hình thức sát chữ để người đọc thấy cách diễn đạt Hy Lạp và không xóa hoàn toàn khả năng liên hệ văn chương trong sách Giăng.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Đại từ “anh ta/anh ấy” phù hợp với một người đàn ông đã trưởng thành trong cuộc đối thoại; sự thay đổi sang “anh ấy” khi người kể nhắc đến nhân vật tránh sắc thái xa cách quá mức. Dấu [a] được đặt ngay sau lời tự nhận diện mà chú thích giải thích.
