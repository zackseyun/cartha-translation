  to: Cha mẹ anh ấy nói những điều ấy vì họ sợ người Do Thái[a], bởi người Do Thái đã thỏa thuận từ trước rằng nếu ai tuyên xưng Giê-su là Đấng Mê-si-a[b] thì người ấy sẽ bị khai trừ khỏi hội đường.
