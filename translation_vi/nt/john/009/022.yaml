id: JHN.9.22
reference: John 9:22
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ταῦτα εἶπαν οἱ γονεῖς αὐτοῦ ὅτι ἐφοβοῦντο τοὺς Ἰουδαίους, ἤδη γὰρ συνετέθειντο οἱ Ἰουδαῖοι ἵνα ἐάν τις αὐτὸν ὁμολογήσῃ χριστόν, ἀποσυνάγωγος γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/022.yaml
  text: His parents said these things because they were afraid of the Jews[a], for the Jews had already agreed that if anyone confessed him as the Messiah[b], he would be put out of the synagogue.
translation:
  language: vi
  text: Cha mẹ anh ấy nói những điều ấy vì họ sợ người Do Thái[a], bởi người Do Thái đã thỏa thuận từ trước rằng nếu ai tuyên xưng Giê-su là Đấng Mê-si-a[b] thì người ấy sẽ bị khai trừ khỏi hội đường.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hy Lạp: “người Do Thái.” Trong văn cảnh này, cụm từ có lẽ chỉ giới lãnh đạo Do Thái có thẩm quyền khai trừ người khác khỏi hội đường, chứ không chỉ toàn thể người Do Thái nói chung.'
    reason: cultural_note
  - marker: b
    text: 'Cũng có thể dịch: “Đấng Christ.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ταῦτα
  choice: những điều ấy
  rationale: Giữ số nhiều của đại từ chỉ định và quy chiếu tự nhiên đến các lời cha mẹ vừa nói trước đó.
- source_word: οἱ γονεῖς αὐτοῦ
  choice: cha mẹ anh
  rationale: γονεῖς có nghĩa thông dụng là cha mẹ; đại từ sở hữu được diễn đạt tự nhiên theo ngữ cảnh tiếng Việt.
- source_word: ἐφοβοῦντο
  choice: họ sợ
  rationale: Thì chưa hoàn thành diễn tả trạng thái sợ hãi đang tồn tại; tiếng Việt không cần đánh dấu hình thái thì.
- source_word: τοὺς Ἰουδαίους / οἱ Ἰουδαῖοι
  choice: người Do Thái
  rationale: Giữ cách gọi rộng của nguyên văn, đồng thời chú thích rằng trong văn cảnh nhóm có thẩm quyền tại hội đường có lẽ là giới lãnh đạo Do Thái.
- source_word: ἤδη ... συνετέθειντο
  choice: đã thỏa thuận với nhau từ trước
  rationale: Diễn đạt hành động đã được thống nhất trước thời điểm câu chuyện, đồng thời phản ánh sắc thái tương hỗ của συντίθεμαι.
- source_word: αὐτὸν ὁμολογήσῃ χριστόν
  choice: tuyên xưng Đức Chúa Jêsus là Đấng Mê-si-a
  rationale: ὁμολογέω ở đây chỉ sự công khai thừa nhận; đại từ αὐτόν được làm rõ bằng danh xưng của nhân vật trung tâm để câu tiếng Việt tự nhiên và không mơ hồ, còn χριστόν được giữ như một tước hiệu.
- source_word: ἀποσυνάγωγος γένηται
  choice: bị khai trừ khỏi hội đường
  rationale: Diễn đạt rõ tình trạng bị loại khỏi cộng đồng hội đường do quyết định kỷ luật.
theological_decisions:
- issue: Cách dịch χριστόν
  choice: Đấng Mê-si-a
  alternative: Đấng Christ
  rationale: Trong câu này, χριστός hoạt động như tước hiệu của nhân vật được mong đợi trong Do Thái giáo, nên “Đấng Mê-si-a” làm rõ bối cảnh mà không biến tước hiệu thành tên riêng.
- issue: Đối tượng của οἱ Ἰουδαῖοι trong Giăng
  choice: người Do Thái, kèm chú thích theo văn cảnh
  alternative: giới lãnh đạo Do Thái
  rationale: Nguyên văn dùng thuật ngữ có phạm vi linh hoạt. Giữ cách gọi nguyên văn trong chính văn bảo toàn sự mơ hồ, còn chú thích ngăn việc hiểu là toàn thể người Do Thái không phân biệt.
- issue: Ý nghĩa của ἀποσυνάγωγος
  choice: bị khai trừ khỏi hội đường
  alternative: bị đuổi khỏi hội đường
  rationale: “Khai trừ” thể hiện cả quyết định loại khỏi cộng đồng, không chỉ hành động buộc rời một địa điểm.
translation_notes:
  register: Văn phong tường thuật trang trọng nhưng hiện đại. “Tuyên xưng” giữ sắc thái công khai của lời thừa nhận; “khai trừ khỏi hội đường” truyền đạt cả chiều kích cộng đồng và kỷ luật. Dùng “Đức Chúa Jêsus” để làm rõ đại từ trong cấu trúc tiếng Việt, không thêm một nhận định thần học ngoài văn cảnh.
