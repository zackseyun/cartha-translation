base_translation:
  language: en
  yaml_path: translation/nt/john/009/023.yaml
  text: For this reason his parents said[a], “He is of age; ask him.”
translation:
  language: vi
  text: 'Vì thế, cha mẹ anh nói: “Anh đã đủ tuổi rồi; hãy hỏi chính anh ấy.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Anh đã trưởng thành rồi; hãy hỏi anh ấy.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Vì thế
  rationale: Cụm từ chỉ nguyên nhân, liên kết trực tiếp với lý do được nêu ở câu 22; “Vì thế” tự nhiên và rõ nghĩa trong tiếng Việt.
- source_word: οἱ γονεῖς αὐτοῦ
  choice: cha mẹ anh
  rationale: Danh từ số nhiều chỉ chung cha mẹ của người trước kia bị mù; cách gọi này tự nhiên và chính xác.
- source_word: εἶπαν
  choice: nói
  rationale: Động từ λέγω ở đây mang nghĩa thông thường là nói; không cần thêm sắc thái “trả lời” hay “bảo họ” vốn không được biểu thị rõ trong nguyên văn.
- source_word: Ἡλικίαν ἔχει
  choice: Anh đã đủ tuổi rồi
  rationale: Thành ngữ Hy Lạp theo nghĩa đen là “có tuổi”, nhưng trong ngữ cảnh có nghĩa anh đủ tuổi để tự trả lời. Cách dịch này vừa tự nhiên vừa giữ sắc thái trưởng thành và có khả năng chịu trách nhiệm.
- source_word: αὐτὸν
  choice: anh ấy
  rationale: Đại từ nhấn mạnh chính người trước kia bị mù là người họ phải hỏi.
- source_word: ἐπερωτήσατε
  choice: cứ hỏi
  rationale: Mệnh lệnh aorist yêu cầu họ trực tiếp hỏi người ấy; “cứ hỏi” diễn đạt tự nhiên sắc thái chuyển việc chất vấn sang cho anh.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Đại từ “anh” phù hợp với người đàn ông trưởng thành trong ngữ cảnh; “anh ấy” làm rõ đối tượng được hỏi. Dấu chú thích [a] được đặt sau toàn bộ lời dẫn để ghi nhận các lựa chọn từ vựng thay thế.
