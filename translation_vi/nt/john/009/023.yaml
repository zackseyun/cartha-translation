  verdict: revise
  source_fidelity: 'Bản dịch phản ánh đúng quan hệ nhân quả của διὰ τοῦτο, chủ ngữ «cha mẹ anh», và ý nghĩa ngữ cảnh của Ἡλικίαν ἔχει: người này đã đủ tuổi để tự trả lời. Mệnh lệnh ἐπερωτήσατε nên được chuyển trực tiếp là «hãy hỏi»; «cứ hỏi» thêm một sắc thái cho phép/đẩy việc sang người khác không được biểu thị rõ trong nguyên văn. Đại từ αὐτόν có thể được làm rõ bằng «chính anh ấy».'
  naturalness: Câu ngắn gọn, hiện đại và phù hợp văn cảnh đối thoại. «Anh»/«anh ấy» là cách quy chiếu lịch sự, tự nhiên đối với một người đàn ông trưởng thành. «Hãy hỏi chính anh ấy» rõ ràng hơn và sát lực mệnh lệnh hơn «cứ hỏi anh ấy».
  terminology: «Đủ tuổi» diễn đạt tốt thành ngữ Ἡλικίαν ἔχει trong bối cảnh trách nhiệm tự trả lời. Không có thuật ngữ thần học chuyên biệt trong câu này. Chú thích giữ phương án «trưởng thành», nhưng dùng «hỏi» thay vì «chất vấn» để không tăng sắc thái thẩm vấn.
  issues:
