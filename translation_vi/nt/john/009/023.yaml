    issue: «cứ hỏi» thêm sắc thái diễn ngôn ngoài mệnh lệnh trực tiếp.
    rationale: ἐπερωτήσατε là mệnh lệnh aorist «hãy hỏi/hỏi đi». «Cứ» có thể hàm ý cho phép hoặc thách thức, không cần thiết trong bản dịch tối ưu tương đương.
  - severity: low
    issue: Chú thích dùng «chất vấn» mạnh hơn động từ hỏi trong văn cảnh.
    rationale: ἐπερωτάω ở đây là hỏi người ấy để lấy lời khai; «hỏi» giữ nghĩa trung tính hơn, còn «chất vấn» dễ gợi sắc thái đối đầu.
