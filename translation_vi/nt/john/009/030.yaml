source:
  edition: SBLGNT
  text: ἀπεκρίθη ὁ ἄνθρωπος καὶ εἶπεν αὐτοῖς· Ἐν ⸂τούτῳ γὰρ τὸ⸃ θαυμαστόν ἐστιν ὅτι ὑμεῖς οὐκ οἴδατε πόθεν ἐστίν, καὶ ἤνοιξέν μου τοὺς ὀφθαλμούς.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/030.yaml
  text: 'The man answered and said to them[a], “This is the remarkable thing: you do not know where he is from[b], and yet he opened my eyes.”'
translation:
  language: vi
  text: 'Người ấy trả lời họ: “Điều đáng ngạc nhiên chính là thế này: các ông không biết ông ấy từ đâu đến[a], vậy mà ông ấy đã mở mắt tôi.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “ông ấy xuất thân từ đâu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη ὁ ἄνθρωπος καὶ εἶπεν αὐτοῖς
  choice: Người ấy đáp lời họ
  rationale: Gộp công thức kể chuyện Hy Lạp thành cách nói tự nhiên trong tiếng Việt, vẫn giữ rõ hành động trả lời và đối tượng được nói với; “người ấy” chỉ người đàn ông vốn bị mù trong ngữ cảnh.
- source_word: Ἐν τούτῳ γὰρ τὸ θαυμαστόν ἐστιν
  choice: Điều đáng ngạc nhiên chính là thế này
  rationale: Diễn đạt tự nhiên cấu trúc nhấn mạnh ἐν τούτῳ ... τὸ θαυμαστόν; “đáng ngạc nhiên” giữ sắc thái kinh ngạc và lời mỉa mai hàm ẩn mà không cường điệu.
- source_word: ὑμεῖς οὐκ οἴδατε
  choice: các ông không biết
  rationale: Đại từ ὑμεῖς được thể hiện rõ để giữ sự nhấn mạnh. “Các ông” phù hợp với nhóm nam giới có thẩm quyền đang chất vấn người được chữa lành.
- source_word: πόθεν ἐστίν
  choice: người ấy từ đâu đến
  rationale: Cách nói tiếng Việt tự nhiên, chỉ nguồn gốc của Chúa Giê-su mà không quyết định cụ thể đó là quê quán, xuất thân hay nguồn gốc sâu xa hơn.
- source_word: καὶ
  choice: vậy mà
  rationale: 'Thể hiện lực tương phản, có tính mỉa mai của καί trong ngữ cảnh: họ không biết nguồn gốc của người đã thực hiện việc chữa lành rõ ràng.'
- source_word: ἤνοιξέν μου τοὺς ὀφθαλμούς
  choice: người ấy đã mở mắt cho tôi
  rationale: Giữ hình ảnh nguyên văn và nghĩa trực tiếp là chữa lành đôi mắt, đồng thời để ý nghĩa biểu tượng về sự sáng mắt tự xuất hiện từ văn mạch.
theological_decisions:
- issue: Âm vang biểu tượng của việc “mở mắt” trong sách Giăng
  choice: Giữ nguyên cách diễn đạt về sự chữa lành thể chất, không giải thích thêm ý nghĩa thuộc linh
  alternative: Diễn đạt theo hướng nhấn mạnh sự soi sáng thuộc linh
  rationale: Trong câu này, đối tượng trực tiếp là đôi mắt thể chất của người vốn bị mù. Chủ đề thấy và mù thuộc linh vẫn hiện diện trong toàn trình thuật, nhưng không nên được đưa thêm vào bản dịch.
- issue: Sự mơ hồ trong πόθεν ἐστίν về nguồn gốc của Chúa Giê-su
  choice: Dịch “từ đâu đến”
  alternative: Dịch cụ thể thành “quê quán” hoặc “nguồn gốc thiên thượng”
  rationale: Cụm từ Hy Lạp có thể gợi nhiều tầng nghĩa trong sách Giăng; bản dịch giữ độ mở thay vì ấn định một cách hiểu thần học.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “các ông” để phản ánh số nhiều ὑμεῖς và quan hệ đối thoại trong bối cảnh; lặp “người ấy” nhằm giữ tham chiếu rõ ràng, tránh đại từ tiếng Việt có thể gây nhập nhằng. Dấu [a] xuất hiện ngay sau cụm từ được chú thích.
