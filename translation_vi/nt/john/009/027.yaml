reference: John 9:27
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀπεκρίθη αὐτοῖς· Εἶπον ὑμῖν ἤδη καὶ οὐκ ἠκούσατε· τί πάλιν θέλετε ἀκούειν; μὴ καὶ ὑμεῖς θέλετε αὐτοῦ μαθηταὶ γενέσθαι;
base_translation:
  language: en
  yaml_path: translation/nt/john/009/027.yaml
  text: He answered them[a], “I already told you, and you did not listen. Why do you want to hear it again? You do not also want to become his disciples[b], do you?”
translation:
  language: vi
  text: 'Anh đáp lại họ: “Tôi đã nói với các ông rồi mà các ông không chịu nghe.[a] Tại sao các ông lại muốn nghe nữa? Chẳng lẽ các ông cũng muốn trở thành môn đồ của người ấy sao?”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “các ông không nghe.” Động từ Hy Lạp có thể chỉ việc nghe thấy hoặc việc lắng nghe, tiếp nhận; trong ngữ cảnh này, nhiều khả năng câu nói nhấn mạnh rằng họ không chịu lưu tâm đến lời anh đã nói.'
    reason: lexical_alternative
  - marker: b
    text: 'Câu hỏi trong tiếng Hy Lạp dùng μή, thường hướng đến câu trả lời phủ định; vì vậy cũng có thể diễn đạt: “Hẳn các ông không muốn trở thành môn đồ của người ấy chứ?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη αὐτοῖς
  choice: Anh đáp
  rationale: Động từ chỉ lời đáp được dịch tự nhiên trong văn kể chuyện; đại từ số ít nối với người đã được chữa lành trong ngữ cảnh, còn đối tượng số nhiều được thể hiện qua lời xưng hô “các ông” ngay sau đó.
- source_word: ἤδη
  choice: đã ... rồi
  rationale: Cặp từ tiếng Việt “đã ... rồi” diễn đạt tự nhiên ý việc này đã xảy ra trước đó và có sắc thái nhấn mạnh.
- source_word: οὐκ ἠκούσατε
  choice: các ông không chịu nghe
  rationale: ἀκούω có thể là “nghe” hoặc “lắng nghe/để tâm”; trong ngữ cảnh quở trách, “không chịu nghe” truyền đạt việc không tiếp nhận hay không lưu tâm, đồng thời giữ động từ “nghe” để liên kết với lần xuất hiện kế tiếp.
- source_word: τί πάλιν θέλετε ἀκούειν;
  choice: Tại sao các ông lại muốn nghe nữa?
  rationale: τί được hiểu theo chức năng hỏi lý do trong ngữ cảnh đầy vẻ bực bội; “lại ... nữa” diễn đạt πάλιν tự nhiên mà không cần thêm tân ngữ vốn được ngầm hiểu.
- source_word: μὴ καὶ ὑμεῖς
  choice: Chẳng lẽ các ông cũng ... sao?
  rationale: Cấu trúc “chẳng lẽ ... sao?” là cách tự nhiên trong tiếng Việt để thể hiện câu hỏi với μή, vốn hướng người nghe đến câu trả lời phủ định; “cũng” giữ καί.
- source_word: αὐτοῦ μαθηταὶ γενέσθαι
  choice: trở thành môn đồ của người ấy
  rationale: “Trở thành” giữ sắc thái bước vào một trạng thái của γενέσθαι; “môn đồ” là từ trang trọng, dễ hiểu và phù hợp với μαθηταί. “Người ấy” giữ khoảng cách tham chiếu của αὐτοῦ trong lời nói.
theological_decisions:
- issue: Sắc thái tu từ của câu hỏi cuối
  choice: “Chẳng lẽ các ông cũng muốn trở thành môn đồ của người ấy sao?”—một câu hỏi mỉa mai, hướng đến câu trả lời phủ định
  alternative: “Các ông cũng muốn trở thành môn đồ của người ấy phải không?”
  rationale: μή trong câu hỏi trực tiếp thường báo hiệu người nói mong đợi câu trả lời phủ định. “Chẳng lẽ ... sao?” giữ được sắc thái kinh ngạc và mỉa mai mà không biến câu thành lời khẳng định giáo lý.
- issue: Ý nghĩa của ἀκούω trong mệnh đề phủ định
  choice: “không chịu nghe”
  alternative: “không nghe”
  rationale: Ngữ cảnh cho thấy vấn đề không phải đơn thuần là không nghe thấy âm thanh, mà là không tiếp nhận hoặc không lưu tâm lời đã nói. Tuy nhiên, nghĩa rộng hơn của động từ được ghi ở chú thích để không loại bỏ sự đa nghĩa nguyên ngữ.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và phù hợp lời đối đáp căng thẳng. Cách xưng hô “tôi—các ông” phản ánh người nói đang đáp lại một nhóm nam giới có thẩm quyền trong ngữ cảnh, đồng thời giữ sắc thái thẳng thắn. Các dấu chú thích [a], [b] đều xuất hiện trong chính văn.
