language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς· Οὔτε οὗτος ἥμαρτεν οὔτε οἱ γονεῖς αὐτοῦ, ἀλλ’ ἵνα φανερωθῇ τὰ ἔργα τοῦ θεοῦ ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/003.yaml
  text: Jesus answered[a], “Neither this man sinned, nor his parents[c][b], but so that the works of God might be revealed in him.”
translation:
  language: vi
  text: 'Chúa Giê-su đáp: “Không phải người này đã phạm tội, cũng không phải cha mẹ anh, nhưng ấy là để các công việc của Đức Chúa Trời được bày tỏ nơi anh.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “qua anh”; nguyên văn là “trong/nơi anh”, có thể chỉ nơi các công việc của Đức Chúa Trời được bày tỏ hoặc người mà qua đó các công việc ấy được bày tỏ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: đáp
  rationale: Cách dịch tự nhiên, trang trọng trong lời thoại, giữ đúng chức năng trần thuật của động từ.
- source_word: Οὔτε ... οὔτε
  choice: Không phải ... cũng không phải
  rationale: Diễn đạt tự nhiên trong tiếng Việt sự phủ định song song và nhấn mạnh rằng cả hai phương án đều bị bác bỏ.
- source_word: οὗτος
  choice: người này
  rationale: Nêu rõ người đàn ông đang được nói đến mà không thêm thông tin ngoài ngữ cảnh.
- source_word: ἥμαρτεν
  choice: đã phạm tội
  rationale: Phản ánh trực tiếp động từ aorist ἁμαρτάνω bằng một cách nói tiếng Việt thông dụng.
- source_word: γονεῖς
  choice: cha mẹ
  rationale: Tương đương tự nhiên và chính xác của danh từ chỉ cha mẹ.
- source_word: ἀλλ’ ἵνα
  choice: nhưng ấy là để
  rationale: Giữ sắc thái mục đích của ἵνα và làm cho cấu trúc tỉnh lược của tiếng Hy Lạp trở nên tự nhiên trong tiếng Việt; “ấy là” không khẳng định thêm một biến cố hay nguyên nhân cụ thể.
- source_word: φανερωθῇ
  choice: được bày tỏ
  rationale: Giữ thể bị động và ý nghĩa điều vốn chưa thấy nay được biểu lộ.
- source_word: τὰ ἔργα τοῦ θεοῦ
  choice: các công việc của Đức Chúa Trời
  rationale: Giữ cấu trúc sở hữu và cách dùng thần học đặc trưng của Giăng, đồng thời phù hợp văn phong Kinh Thánh tiếng Việt.
- source_word: ἐν αὐτῷ
  choice: nơi anh
  rationale: “Nơi anh” giữ gần nghĩa cơ bản của ἐν αὐτῷ và duy trì khả năng hiểu là trong trường hợp, nơi thân thể hoặc qua chính người này, thay vì quyết định hẳn theo nghĩa phương tiện.
theological_decisions:
- issue: Lời phủ định có phải là một tuyên bố phổ quát rằng mọi đau khổ đều không liên hệ với tội lỗi hay không
  choice: Giới hạn lời phủ định vào người đàn ông này và cha mẹ anh trong trường hợp đang được hỏi.
  alternative: Diễn giải thành một nguyên tắc phổ quát rằng đau khổ không bao giờ liên hệ với tội lỗi cá nhân hoặc của cha mẹ.
  rationale: Câu này trực tiếp bác bỏ hai cách giải thích do các môn đồ nêu ra về trường hợp cụ thể; bản dịch không nên mở rộng thành một tín điều phổ quát.
- issue: ἵνα diễn tả mục đích hay chỉ kết quả
  choice: 'Dùng ngôn ngữ chỉ mục đích: “để các công việc của Đức Chúa Trời được bày tỏ”.'
  alternative: Dịch thuần kết quả, hoặc ngắt câu nhằm tránh sắc thái mục đích.
  rationale: Cách đọc trực tiếp nhất của ἵνα với thể giả định là mục đích. Bản dịch giữ nguyên căng thẳng thần học mà không thêm lời khẳng định rằng Đức Chúa Trời chủ động gây ra sự mù lòa.
- issue: ἐν αὐτῷ chỉ vị trí/phạm vi hay phương tiện
  choice: Dịch “nơi anh”.
  alternative: Dịch “qua anh”.
  rationale: “Nơi anh” theo sát giới từ ἐν và không thu hẹp sự mơ hồ chính đáng của nguyên văn vào riêng ý nghĩa phương tiện.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “Đức Chúa Jêsus” và “Đức Chúa Trời” theo lối gọi quen thuộc trong Kinh Thánh Tin Lành tiếng Việt; đại từ “anh” phù hợp với người đàn ông trưởng thành được nhắc đến. Cấu trúc “nhưng ấy là để” giữ sự tỉnh lược và căng thẳng của nguyên văn mà vẫn đọc tự nhiên.
