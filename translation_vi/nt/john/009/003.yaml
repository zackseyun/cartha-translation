    issue: Tên riêng “Đức Chúa Jêsus” không phù hợp nhất với chuẩn chính tả tiếng Việt hiện đại và thêm tước hiệu vào chỗ nguyên văn chỉ có “Jesus.”
    rationale: SBLGNT viết Ἰησοῦς, tức “Giê-su.” “Chúa” là cách gọi tôn kính tự nhiên trong văn phong Kinh Thánh Việt ngữ; bỏ “Đức” và dùng chính tả “Giê-su” cải thiện tính hiện đại mà không làm thay đổi ý nghĩa câu.
