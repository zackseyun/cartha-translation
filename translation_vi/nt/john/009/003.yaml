revisions:
- from: 'Đức Chúa Jêsus đáp: “Không phải người này đã phạm tội, cũng không phải cha mẹ anh, nhưng ấy là để các công việc của Đức Chúa Trời được bày tỏ nơi anh.[a]”'
  to: 'Chúa Giê-su đáp: “Không phải người này đã phạm tội, cũng không phải cha mẹ anh, nhưng ấy là để các công việc của Đức Chúa Trời được bày tỏ nơi anh.[a]”'
  rationale: Chỉ sửa cách gọi và chính tả tên Giê-su để phù hợp tiếng Việt tiêu chuẩn hiện đại và sát hơn với tên riêng trong nguyên văn. Giữ “nhưng ấy là để” vì đây là cách nối tỉnh lược có thể chấp nhận trong văn phong trang trọng, diễn đạt mệnh đề ἀλλ’ ἵνα mà không thêm rõ ràng rằng sự mù lòa đã “xảy ra” hoặc do Đức Chúa Trời gây ra. Chú thích được giữ nguyên cả nội dung lẫn điểm neo.
  reviewer_model: gpt-5.6-terra
