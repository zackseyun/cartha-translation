  text: ὅταν ἐν τῷ κόσμῳ ὦ, φῶς εἰμι τοῦ κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/005.yaml
  text: While I am in the world, I am the light of the world.
translation:
  language: vi
  text: Khi còn ở trong thế gian, tôi là ánh sáng của thế gian.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅταν
  choice: Khi
  rationale: 'Trong ngữ cảnh này, ὅταν với động từ giả định ὦ diễn tả khoảng thời gian hay hoàn cảnh: khi/chừng nào còn ở trong thế gian. “Khi” tự nhiên trong tiếng Việt và không làm câu nặng nề.'
- source_word: ἐν τῷ κόσμῳ
  choice: ở trong thế gian
  rationale: Giữ hình ảnh và thuật ngữ quen thuộc của Gioan; “thế gian” phù hợp hơn “thế giới” trong văn mạch thần học này.
- source_word: φῶς εἰμι τοῦ κόσμου
  choice: tôi là ánh sáng của thế gian
  rationale: Theo sát cấu trúc Hy Lạp, giữ nguyên lời tự xưng và hình ảnh thần học trọng tâm.
theological_decisions:
- issue: Phạm vi thời gian của ὅταν ἐν τῷ κόσμῳ ὦ
  choice: Khi còn ở trong thế gian
  alternative: Hễ khi nào tôi ở trong thế gian
  rationale: Cách chọn diễn đạt tự nhiên ý “while/as long as I am in the world” theo văn cảnh, nhưng không biến câu thành một mệnh đề tuyệt đối hoặc giải thích thêm bản chất sự hiện diện của Chúa Giê-su.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “tôi” theo ngữ cảnh lời Chúa Giê-su nói với các môn đồ; “còn” làm rõ sắc thái thời gian của mệnh đề mà không thêm chú giải giáo lý.
