  text: So they said to him, “What did he do to you? How did he open your eyes?”
translation:
  language: vi
  text: 'Vậy, họ nói với ông: “Người ấy đã làm gì cho ông? Người ấy đã mở mắt ông bằng cách nào?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπον
  choice: họ nói
  rationale: Động từ λέγω ở thì aorist dẫn vào lời nói trực tiếp. “Họ nói” bám sát nghĩa từ vựng hơn “họ hỏi”, dù nội dung lời nói là hai câu hỏi.
- source_word: οὖν
  choice: Vì vậy
  rationale: Liên từ này biểu thị sự tiếp nối có tính suy luận từ diễn biến trước; “Vì vậy” giữ rõ lực liên kết ấy, thay vì chỉ diễn đạt trình tự thời gian.
- source_word: αὐτῷ
  choice: với ông
  rationale: Đại từ ở cách tặng chỉ người đàn ông từng bị mù; “nói với ông” là cách diễn đạt tự nhiên và tôn trọng trong tiếng Việt.
- source_word: Τί ἐποίησέν σοι
  choice: Ông ấy đã làm gì với anh?
  rationale: Giữ câu hỏi trực tiếp và sắc thái “làm gì với anh”; không đổi thành “làm gì cho anh”, vốn dễ nhấn mạnh ý ban ơn hơn nguyên văn.
- source_word: πῶς ἤνοιξέν σου τοὺς ὀφθαλμούς
  choice: Ông ấy đã mở mắt anh bằng cách nào?
  rationale: “Bằng cách nào” diễn đạt rõ câu hỏi về phương cách, còn “mở mắt anh” là lối nói tự nhiên tương ứng với cấu trúc Hy Lạp về bộ phận cơ thể.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “ông ấy” cho người chữa lành, “ông” trong lời dẫn và “anh” trong lời chất vấn để phản ánh sự chuyển đổi xưng hô tự nhiên của tiếng Việt mà không thêm thái độ miệt thị không có trong nguyên văn.
