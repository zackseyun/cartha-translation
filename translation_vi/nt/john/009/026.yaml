  to: 'Vậy, họ nói với ông: “Người ấy đã làm gì cho ông? Người ấy đã mở mắt ông bằng cách nào?”'
  rationale: Sửa cách xưng hô để cùng một nhóm người nói trực tiếp với cùng một người bằng “ông” xuyên suốt. “Người ấy” giữ cách quy chiếu trung tính đối với người đã mở mắt ông. “Vậy” phản ánh οὖν một cách tự nhiên trong tiếng Việt hiện đại. Câu “đã làm gì cho ông?” là cách diễn đạt tiếng Việt tự nhiên cho ποιέω với cách tặng trong ngữ cảnh này, không thêm một khẳng định thần học về động cơ hay lợi ích.
