- from: 'Vậy, họ gọi người trước đây bị mù đến lần thứ hai và nói với anh[a]: “Hãy tôn vinh Đức Chúa Trời; chúng tôi biết người này là kẻ có tội.”'
  to: 'Vậy họ gọi người trước đây bị mù đến lần thứ hai và nói với anh: “Hãy tôn vinh Đức Chúa Trời[a]; chúng tôi biết người này là một người tội lỗi.”'
