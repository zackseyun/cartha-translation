id: JHN.9.24
reference: John 9:24
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἐφώνησαν οὖν ⸂τὸν ἄνθρωπον ἐκ δευτέρου⸃ ὃς ἦν τυφλὸς καὶ εἶπαν αὐτῷ· Δὸς δόξαν τῷ θεῷ· ἡμεῖς οἴδαμεν ὅτι ⸂οὗτος ὁ ἄνθρωπος⸃ ἁμαρτωλός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/024.yaml
  text: So they called the man who had been blind a second time and said to him[a], “Give glory to God; we know that this man is a sinner.”
translation:
  language: vi
  text: 'Vậy họ gọi người trước đây bị mù đến lần thứ hai và nói với anh: “Hãy tôn vinh Đức Chúa Trời[a]; chúng tôi biết người này là một người tội lỗi.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể đây là một lời buộc phải nói thật theo lối thành ngữ: “Hãy quy vinh quang cho Đức Chúa Trời,” nghĩa là “Hãy nói thật trước mặt Đức Chúa Trời” hoặc “Hãy công khai thú nhận trước mặt Đức Chúa Trời.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐφώνησαν
  choice: họ gọi ... đến
  rationale: Trong ngữ cảnh, φωνέω nói đến việc các nhà chức trách gọi người đã được chữa lành trở lại; “gọi ... đến” tự nhiên trong tiếng Việt mà không thêm sắc thái cưỡng chế như “triệu tập”.
- source_word: οὖν
  choice: Vậy
  rationale: Từ nối này biểu thị diễn tiến hoặc kết quả từ cuộc trao đổi trước đó; “Vậy” giữ được lực liên kết trong lối kể trang trọng, tự nhiên.
- source_word: ἐκ δευτέρου
  choice: lần thứ hai
  rationale: Cụm từ chỉ rõ đây là lần thứ hai, chính xác hơn cách nói chung chung “lại”.
- source_word: ὃς ἦν τυφλός
  choice: người trước đây bị mù
  rationale: Người này nay đã được chữa lành; “trước đây bị mù” diễn đạt tình trạng quá khứ mà không khiến độc giả hiểu rằng anh vẫn còn mù.
- source_word: Δὸς δόξαν τῷ θεῷ
  choice: Hãy tôn vinh Đức Chúa Trời
  rationale: Giữ hình thức trực tiếp của thành ngữ Hy Lạp, đồng thời ghi chú khả năng đây là lời buộc người nghe phải nói thật hoặc công khai thú nhận trước mặt Đức Chúa Trời.
- source_word: ἡμεῖς οἴδαμεν
  choice: chúng tôi biết
  rationale: Đại từ được nêu rõ trong tiếng Hy Lạp nhấn mạnh lời quả quyết của những người nói; “chúng tôi biết” bảo toàn sắc thái ấy.
- source_word: οὗτος ὁ ἄνθρωπος
  choice: người này
  rationale: Cách dịch tự nhiên và trung tính, không tự ý thêm giọng khinh miệt.
- source_word: ἁμαρτωλός
  choice: kẻ có tội
  rationale: Diễn đạt lời quy kết một người là tội nhân, thay vì chỉ mô tả trừu tượng là “có tính tội lỗi”; “kẻ có tội” phù hợp giọng cáo buộc trong ngữ cảnh.
theological_decisions:
- issue: Sức hàm ý thành ngữ của Δὸς δόξαν τῷ θεῷ
  choice: Giữ cách nói trực tiếp “Hãy tôn vinh Đức Chúa Trời” trong chính văn
  alternative: Dịch diễn giải là “Hãy nói thật trước mặt Đức Chúa Trời” hoặc “Hãy công khai thú nhận trước mặt Đức Chúa Trời”
  rationale: Cụm từ có lẽ là một lời yêu cầu trang nghiêm phải nói thật hoặc thú nhận, nhưng mặt chữ vẫn nói đến việc tôn vinh Đức Chúa Trời. Chính văn giữ nguyên hình ảnh thần học, còn chú thích bảo tồn hàm ý thành ngữ mà không quyết đoán quá mức.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Trời” cho θεός và đại từ “anh” để chỉ người đàn ông đã được chữa lành; tránh tăng mức độ chính thức của hành động gọi hoặc thêm giọng khinh miệt không được biểu thị rõ trong nguyên văn.
