  text: ἡμεῖς οἴδαμεν ὅτι Μωϋσεῖ λελάληκεν ὁ θεός, τοῦτον δὲ οὐκ οἴδαμεν πόθεν ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/029.yaml
  text: We know that God has spoken to Moses[a], but as for this man, we do not know where he is from.
translation:
  language: vi
  text: Chúng tôi biết Đức Chúa Trời đã phán với Môi-se; còn người này, chúng tôi không biết ông ấy từ đâu đến.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “ông ấy xuất thân từ đâu.” Trong sách Giăng, những câu hỏi về nguồn gốc của Chúa Giê-xu có thể vừa mang nghĩa thông thường vừa hàm chứa ý nghĩa thần học sâu xa hơn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμεῖς
  choice: Chúng ta
  rationale: Đại từ được nêu rõ tạo sắc thái nhấn mạnh và đối lập; “chúng ta” tự nhiên trong tiếng Việt và phù hợp với lời của nhóm người đang nói.
- source_word: οἴδαμεν
  choice: biết
  rationale: Diễn đạt trực tiếp sự hiểu biết hay xác tín mà những người nói tự nhận; được giữ nhất quán ở cả hai lần xuất hiện.
- source_word: Μωϋσεῖ
  choice: Môi-se
  rationale: Dùng dạng tên riêng quen thuộc trong tiếng Việt.
- source_word: λελάληκεν
  choice: đã phán
  rationale: “Phán” phù hợp với lời Đức Chúa Trời nói với Môi-se; “đã” diễn đạt hành động đã xảy ra và vẫn được viện dẫn như một sự kiện có giá trị hiện tại.
- source_word: ὁ θεός
  choice: Đức Chúa Trời
  rationale: Danh xưng trang trọng, phổ biến trong tiếng Việt, không thêm nội dung ngoài nguyên văn.
- source_word: τοῦτον δὲ
  choice: còn người này
  rationale: Vừa chuyển chủ đề vừa tạo thế đối lập, đồng thời giữ sắc thái xa cách của đại từ chỉ định mà không làm lời văn miệt thị quá mức.
- source_word: οὐκ οἴδαμεν
  choice: chúng ta không biết
  rationale: Lặp lại “biết” để bảo toàn cấu trúc tương phản của nguyên văn.
- source_word: πόθεν ἐστίν
  choice: ông ấy từ đâu đến
  rationale: Cách nói tự nhiên trong tiếng Việt, vẫn để ngỏ câu hỏi về quê quán, nguồn gốc hay thẩm quyền của Chúa Giê-xu.
theological_decisions:
- issue: Ý nghĩa nguồn gốc của Chúa Giê-xu trong πόθεν ἐστίν
  choice: ông ấy từ đâu đến
  alternative: ông ấy xuất thân từ đâu; nguồn gốc của ông ấy là gì
  rationale: Cách dịch không quyết định rằng người nói chỉ hỏi về địa lý hay đang vô tình chạm đến nguồn gốc và thẩm quyền sâu xa hơn của Chúa Giê-xu; nhờ đó giữ được tính đa nghĩa và sự mỉa mai trong mạch kể của Giăng.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “phán” cho lời Đức Chúa Trời và “ông ấy” trong lời trích dẫn để giữ lối diễn đạt tự nhiên; “còn người này” bảo toàn sắc thái đối lập, xa cách của nguyên văn.
