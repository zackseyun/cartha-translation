revisions:
- from: 'Đức Chúa Jêsus phán với họ: “Nếu các ông mù, các ông đã không có tội[a]. Nhưng bây giờ các ông nói: ‘Chúng tôi thấy,’ nên tội của các ông vẫn còn.”'
  to: 'Đức Chúa Giê-su phán với họ: “Nếu các ông mù thì các ông hẳn không có tội[a]. Nhưng bây giờ các ông nói: ‘Chúng tôi thấy,’ nên tội của các ông vẫn còn.”'
  rationale: Bản sửa thay chính tả tên riêng bằng dạng tiếng Việt hiện đại và thêm “hẳn” để biểu đạt tự nhiên hơn tính phản thực tế của mệnh đề điều kiện Hy Lạp. Các hình ảnh và thuật ngữ then chốt—“mù”, “thấy”, “tội”, và “vẫn còn”—đều được giữ nguyên, không giải thích hóa nghĩa ẩn dụ trong chính văn.
