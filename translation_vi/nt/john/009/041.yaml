source:
  edition: SBLGNT
  text: εἶπεν αὐτοῖς ὁ Ἰησοῦς· Εἰ τυφλοὶ ἦτε, οὐκ ἂν εἴχετε ἁμαρτίαν· νῦν δὲ λέγετε ὅτι Βλέπομεν· ⸀ἡ ἁμαρτία ὑμῶν μένει.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/041.yaml
  text: Jesus said to them[a], “If you were blind, you would not have sin. But now you say, ‘We see,’ so your sin remains.”
translation:
  language: vi
  text: 'Đức Chúa Giê-su phán với họ: “Nếu các ông mù thì các ông hẳn không có tội[a]. Nhưng bây giờ các ông nói: ‘Chúng tôi thấy,’ nên tội của các ông vẫn còn.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể hiểu: “hẳn không mắc tội” hoặc “hẳn không bị quy tội.” Nguyên văn Hy Lạp dùng từ “tội”, nhưng trong văn cảnh từ này có thể bao hàm ý chịu trách nhiệm về tội.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τυφλοὶ
  choice: mù
  rationale: Giữ nghĩa trực tiếp là “mù” và để văn cảnh của cả chương truyền tải nghĩa ẩn dụ về sự nhận biết thuộc linh, thay vì thêm lời giải thích vào chính văn.
- source_word: οὐκ ἂν εἴχετε
  choice: đã không có
  rationale: Cấu trúc điều kiện trái với thực tế được diễn đạt tự nhiên trong tiếng Việt bằng “nếu... đã không...”, đồng thời giữ ý “có” của động từ Hy Lạp.
- source_word: ἁμαρτίαν
  choice: tội
  rationale: Đây là tương đương trực tiếp của ἁμαρτία; trong văn cảnh từ này cũng có thể hàm ý tình trạng mắc tội hoặc chịu trách nhiệm, nhưng không nên thu hẹp nghĩa trong chính văn.
- source_word: νῦν δὲ
  choice: Nhưng bây giờ
  rationale: Diễn tả rõ sự tương phản giữa giả định vừa nêu và thực trạng hiện tại.
- source_word: λέγετε ὅτι Βλέπομεν
  choice: 'các ông nói: ‘Chúng tôi thấy,’'
  rationale: Giữ nguyên sự chuyển đổi đại từ từ ngôi thứ hai số nhiều sang lời nói trực tiếp ở ngôi thứ nhất số nhiều, cùng sắc thái mỉa mai trong câu.
- source_word: ἡ ἁμαρτία ὑμῶν μένει
  choice: tội của các ông vẫn còn
  rationale: “Vẫn còn” diễn đạt tự nhiên trạng thái tiếp diễn của μένει và giữ mô-típ Gioan về điều gì đó tiếp tục tồn tại.
theological_decisions:
- issue: Có nên nói rõ “mù” là mù thuộc linh và “tội” là trách nhiệm định tội trước Đức Chúa Trời hay không
  choice: Giữ các từ trực tiếp “mù” và “tội” trong chính văn.
  alternative: “Nếu các ông mù về thuộc linh, các ông đã không mắc tội” hoặc “Nếu các ông mù, các ông đã không bị quy tội.”
  rationale: Lời của Đức Chúa Jêsus tiếp tục hình ảnh mù và thấy xuyên suốt chương. Việc thêm “thuộc linh” hoặc đổi “tội” thành “bị quy tội” sẽ giải thích dứt khoát một sự đa nghĩa và căng thẳng thần học mà nguyên văn vẫn để mở.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “các ông” vì Đức Chúa Jêsus đang nói với nhóm người Pha-ri-si trong văn cảnh gần; cách gọi này tự nhiên hơn “các ngươi” nhưng vẫn giữ khoảng cách. Giữ “Đức Chúa Jêsus” theo lối gọi Tin Lành Việt ngữ quen thuộc, không thêm thuật ngữ giáo phái vào nội dung câu.
