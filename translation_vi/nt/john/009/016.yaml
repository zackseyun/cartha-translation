source:
  edition: SBLGNT
  text: ἔλεγον οὖν ἐκ τῶν Φαρισαίων τινές· ⸂Οὐκ ἔστιν οὗτος παρὰ θεοῦ ὁ ἄνθρωπος⸃, ὅτι τὸ σάββατον οὐ τηρεῖ. ⸀ἄλλοι ἔλεγον· Πῶς δύναται ἄνθρωπος ἁμαρτωλὸς τοιαῦτα σημεῖα ποιεῖν; καὶ σχίσμα ἦν ἐν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/016.yaml
  text: So some of the Pharisees were saying[a], “This man is not from God, because he does not keep the Sabbath.” But others were saying[b], “How can a sinful man do such signs?” And there was a division among them.
translation:
  language: vi
  text: 'Vì vậy, một số người Pha-ri-si nói: “Người này không phải từ Đức Chúa Trời mà đến, vì ông không giữ ngày Sa-bát.” Nhưng những người khác nói: “Làm sao một người tội lỗi[a] có thể làm được những dấu lạ[b] như thế?” Và giữa họ có sự chia rẽ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “một kẻ có tội.” Tiếng Hy Lạp viết sát nghĩa là “một người tội lỗi”, trong đó “tội lỗi” là tính từ bổ nghĩa cho “người”.'
    reason: lexical_alternative
  - marker: b
    text: Trong sách Giăng, “dấu lạ” thường chỉ các việc Chúa Giê-su làm và nhấn mạnh ý nghĩa mặc khải của chúng; cũng có thể dịch là “những dấu chỉ kỳ diệu”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγον οὖν ἐκ τῶν Φαρισαίων τινές
  choice: Vì vậy, một số người Pha-ri-si nói
  rationale: “Vì vậy” giữ chức năng nối kết/suy luận của οὖν; “một số người Pha-ri-si” diễn đạt tự nhiên ý một nhóm nhỏ từ trong số họ. Tiếng Việt không nhất thiết phải đánh dấu thể chưa hoàn thành của ἔλεγον bằng một từ riêng; ngữ cảnh đối thoại đối lập vẫn cho thấy các ý kiến đang được nêu ra.
- source_word: οὗτος ... ὁ ἄνθρωπος
  choice: Người này
  rationale: Giữ đại từ chỉ định và cách gọi một người nam mà không thêm sắc thái miệt thị quá mức.
- source_word: παρὰ θεοῦ
  choice: không phải từ Đức Chúa Trời mà đến
  rationale: Diễn đạt tự nhiên nguồn gốc “từ Đức Chúa Trời” trong tiếng Việt, không thêm ý “được sai đến” vốn không được nói rõ ở đây.
- source_word: τὸ σάββατον οὐ τηρεῖ
  choice: không giữ ngày Sa-bát
  rationale: “Giữ ngày Sa-bát” là cách nói rõ ràng, quen thuộc cho việc tuân giữ ngày này.
- source_word: ἁμαρτωλὸς ἄνθρωπος
  choice: một người tội lỗi
  rationale: Giữ cấu trúc tính từ ἁμαρτωλός bổ nghĩa cho ἄνθρωπος, đồng thời tự nhiên trong tiếng Việt.
- source_word: τοιαῦτα σημεῖα
  choice: những dấu lạ như thế
  rationale: “Dấu lạ” giữ được ý nghĩa dấu chỉ mang tính mặc khải của σημεῖον trong Giăng, thay vì chỉ gọi đó là phép màu; “như thế” phản ánh τοιαῦτα.
- source_word: σχίσμα ἦν ἐν αὐτοῖς
  choice: giữa họ có sự chia rẽ
  rationale: Bám sát danh từ σχίσμα và diễn đạt rõ sự bất đồng gây phân rẽ trong nhóm.
theological_decisions:
- issue: Ý nghĩa của παρὰ θεοῦ đối với nguồn gốc hoặc thẩm quyền của Chúa Giê-su
  choice: từ Đức Chúa Trời mà đến
  alternative: được Đức Chúa Trời sai đến
  rationale: Bản dịch giữ nguyên cách nói về nguồn gốc từ Đức Chúa Trời và không thu hẹp nó thành công thức sai phái cụ thể hơn.
- issue: Cách dịch thuật ngữ mang tính chủ đề σημεῖα trong sách Giăng
  choice: dấu lạ
  alternative: phép lạ
  rationale: “Dấu lạ” vừa cho thấy tính phi thường của việc làm, vừa bảo toàn chức năng chỉ dấu/mặc khải đặc trưng trong sách Giăng.
- issue: Cách mô tả ἁμαρτωλὸς ἄνθρωπος
  choice: một người tội lỗi
  alternative: một kẻ có tội
  rationale: Lựa chọn chính phản ánh trực tiếp tính từ “tội lỗi” bổ nghĩa cho “người”, không biến lời nói thành một nhãn danh từ mạnh hơn mức cần thiết.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Trời”, “Pha-ri-si” và “Sa-bát” theo cách gọi Kinh Thánh phổ biến trong tiếng Việt. Các vế đối lập được giữ cân xứng, còn câu cuối bảo toàn danh từ “sự chia rẽ” của nguyên bản.
