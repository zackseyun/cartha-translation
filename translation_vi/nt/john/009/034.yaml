language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀπεκρίθησαν καὶ εἶπαν αὐτῷ· Ἐν ἁμαρτίαις σὺ ἐγεννήθης ὅλος, καὶ σὺ διδάσκεις ἡμᾶς; καὶ ἐξέβαλον αὐτὸν ἔξω.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/034.yaml
  text: They answered and said to him[a], “You were born entirely in sins[c][b], and are you teaching us?” And they cast him out.
translation:
  language: vi
  text: 'Họ đáp lời ông: “Anh từ khi sinh ra đã hoàn toàn ở trong tội lỗi[a], thế mà anh lại dạy chúng tôi sao?” Rồi họ đuổi ông ra ngoài.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn là “trong các tội lỗi”; đây là lời buộc tội mang tính xúc phạm, nhưng không nói rõ họ quy cho ông tội của ai hay loại tội nào.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể hiểu là “họ trục xuất ông”. Cụm từ này có thể chỉ việc đuổi ông khỏi chỗ họ đang hiện diện và, theo ngữ cảnh, cũng có thể hàm ý loại ông khỏi cộng đồng hội đường.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθησαν καὶ εἶπαν αὐτῷ
  choice: Họ đáp lời ông
  rationale: Tiếng Hy Lạp dùng công thức kép theo lối kể chuyện của Giăng. Trong tiếng Việt, “đáp lời” truyền đạt tự nhiên cả hành động trả lời lẫn nói với ông, không tạo cấu trúc rườm rà.
- source_word: Ἐν ἁμαρτίαις
  choice: ở trong tội lỗi
  rationale: Giữ sắc thái số nhiều của ἁμαρτίαις bằng danh từ tập hợp tự nhiên “tội lỗi”, thay vì thu hẹp thành “một tội” hoặc diễn giải thành “là kẻ có tội”.
- source_word: ἐγεννήθης ὅλος
  choice: sinh ra đã hoàn toàn
  rationale: “Hoàn toàn” thể hiện sức nhấn của ὅλος đối với tình trạng mà những người nói gán cho ông từ khi sinh ra, đồng thời giữ được giọng xúc phạm.
- source_word: καὶ σὺ διδάσκεις ἡμᾶς;
  choice: thế mà anh lại dạy chúng tôi sao?
  rationale: “Anh” được nêu rõ để phản ánh đại từ nhấn mạnh σὺ; “thế mà… lại… sao?” diễn đạt tự nhiên sự phẫn nộ và khinh miệt của câu hỏi tu từ.
- source_word: ἐξέβαλον αὐτὸν ἔξω
  choice: họ đuổi ông ra ngoài
  rationale: Cách diễn đạt hiện đại, trang trọng vừa phải, phản ánh hành động trục xuất mang tính thù địch và giữ thành tố ἔξω là “ra ngoài”.
theological_decisions:
- issue: Ý nghĩa lời buộc tội người ấy sinh ra ở trong tội lỗi
  choice: Giữ lời cáo buộc rằng ông sinh ra đã hoàn toàn ở trong “tội lỗi”, không xác định đó là tội riêng, tội thừa hưởng hay tội của cha mẹ.
  alternative: “Anh sinh ra đã là một kẻ hoàn toàn tội lỗi” hoặc “Anh sinh ra trong tội.”
  rationale: Bản văn ghi lại lời sỉ nhục của những người nói nhưng không giải thích nền thần học của họ về mối liên hệ giữa tội lỗi và chứng mù bẩm sinh. Bản dịch vì vậy bảo tồn sự mơ hồ và căng thẳng của nguyên văn.
- issue: Phạm vi của việc đuổi ra ngoài
  choice: Dịch trực tiếp là “đuổi ông ra ngoài”.
  alternative: Diễn giải rõ là “khai trừ ông khỏi hội đường”.
  rationale: Trong ngữ cảnh, hành động có thể hàm ý loại khỏi cộng đồng hội đường, nhưng riêng câu này không nói rõ phạm vi chính thức của việc trục xuất; không nên đưa cách hiểu đó vào chính văn.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “ông” trong lời kể để chỉ người đã được chữa lành, nhưng giữ “anh” trong lời đối thoại nhằm thể hiện thái độ bề trên và khinh miệt của những người chất vấn. Không giải thích quá mức mối liên hệ giữa tội lỗi, sự sinh ra và chứng mù.
