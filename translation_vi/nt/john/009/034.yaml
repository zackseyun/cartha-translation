  source_fidelity: 'Bản dịch giữ đúng các ý chính của nguyên văn: lời đáp mang tính khinh miệt, lời buộc tội về tình trạng “trong các tội lỗi” từ khi sinh ra, câu hỏi tu từ nhấn mạnh “anh”, và hành động đuổi người ấy ra ngoài. Không diễn giải lời sỉ nhục này thành một học thuyết cụ thể về nguồn gốc tội lỗi hay nguyên nhân chứng mù.'
  naturalness: Câu “Anh sinh ra đã hoàn toàn ở trong tội lỗi” hiểu được nhưng trật tự từ hơi gượng trong tiếng Việt hiện đại. Đưa cụm thời gian lên trước giúp câu tự nhiên hơn mà vẫn giữ mức độ nhấn mạnh của ὅλος.
  terminology: “Tội lỗi” là cách chuyển tự nhiên cho số nhiều ἁμαρτίαις trong tiếng Việt và không thu hẹp thành một tội cụ thể. “Đuổi ông ra ngoài” chuyển đạt tốt ἐξέβαλον αὐτὸν ἔξω; chú thích giữ đúng khả năng hàm ý rộng hơn trong ngữ cảnh mà không khẳng định quá mức.
  issues:
