id: JHN.9.28
reference: John 9:28
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸀ἐλοιδόρησαν αὐτὸν καὶ εἶπον· Σὺ ⸂μαθητὴς εἶ⸃ ἐκείνου, ἡμεῖς δὲ τοῦ Μωϋσέως ἐσμὲν μαθηταί·
base_translation:
  language: en
  yaml_path: translation/nt/john/009/028.yaml
  text: They reviled him and said[a], “You are that man's disciple, but we are disciples of Moses.”
translation:
  language: vi
  text: 'Họ mắng nhiếc anh và nói: “Anh là môn đồ của người đó[a], còn chúng tôi là môn đồ của Môi-se.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “Anh là môn đồ của ông ấy.” Tiếng Hy Lạp dùng từ có nghĩa là “người đó/người kia”, có thể mang sắc thái xa cách hoặc khinh miệt trong ngữ cảnh này.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλοιδόρησαν
  choice: mắng nhiếc
  rationale: Động từ chỉ việc dùng lời lẽ nhục mạ, sỉ nhục. “Mắng nhiếc” tự nhiên trong tiếng Việt hiện đại và giữ được mức độ gay gắt hơn “xúc phạm”.
- source_word: αὐτὸν
  choice: anh
  rationale: Đại từ chỉ người đàn ông đã được chữa lành; “anh” phù hợp mạch kể và cách gọi một người đàn ông trưởng thành.
- source_word: καὶ εἶπον
  choice: và nói
  rationale: Giữ phép nối kể chuyện trực tiếp của nguyên văn; chủ ngữ đã rõ từ mệnh đề trước.
- source_word: Σὺ
  choice: Anh
  rationale: Đại từ được nêu rõ và đặt đầu câu trong tiếng Hy Lạp để nhấn mạnh, được giữ ở đầu lời nói trong tiếng Việt.
- source_word: μαθητὴς / μαθηταί
  choice: môn đồ
  rationale: Thuật ngữ diễn tả sự gắn bó và đi theo một người thầy, không chỉ là việc học kiến thức; dùng nhất quán ở cả hai vế để giữ phép đối lập.
- source_word: ἐκείνου
  choice: của người đó
  rationale: Đại từ chỉ định tạo khoảng cách và trong ngữ cảnh thù nghịch có thể mang sắc thái khinh miệt. “Người đó” giữ được sắc thái xa cách mà không thêm lời miệt thị không có trong nguyên văn.
- source_word: ἡμεῖς δὲ
  choice: còn chúng tôi
  rationale: “Còn” diễn đạt tự nhiên sự tương phản giữa “anh” và “chúng tôi”; đại từ “chúng tôi” giữ sự nhấn mạnh của ἡμεῖς.
- source_word: τοῦ Μωϋσέως
  choice: của Môi-se
  rationale: Sở hữu cách diễn tả mối liên hệ với Môi-se; cấu trúc “môn đồ của Môi-se” rõ ràng và tự nhiên.
- source_word: ἐσμὲν μαθηταί
  choice: là môn đồ
  rationale: Giữ cấu trúc vị ngữ và sự lặp lại có chủ ý của μαθητής trong hai vế.
theological_decisions:
- issue: Sắc thái của ἐκείνου khi nói về Chúa Giê-su
  choice: “người đó” để giữ khoảng cách và khả năng mang sắc thái khinh miệt
  alternative: “người ấy” hoặc “của ông ấy” với sắc thái trung tính hơn
  rationale: Nguyên văn dùng đại từ chỉ định có tính xa cách trong bối cảnh họ đang mắng nhiếc người được chữa lành. Bản dịch giữ sắc thái ấy nhưng không tăng mức độ thành một danh xưng miệt thị rõ rệt.
- issue: Cách dịch μαθητής ở cả hai lần xuất hiện
  choice: Dùng “môn đồ” cho cả hai
  alternative: “người theo” hoặc “học trò”
  rationale: “Môn đồ” bảo toàn ý nghĩa về sự gắn bó với thầy và giữ nguyên thế đối lập tu từ giữa việc theo Chúa Giê-su và theo Môi-se.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Mắng nhiếc” truyền đạt sự công kích bằng lời; “môn đồ” duy trì thuật ngữ Kinh Thánh quen thuộc và phép đối lập của câu. Dấu chú thích [a] được đặt ngay sau cụm từ liên quan.
