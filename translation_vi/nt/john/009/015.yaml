source:
  edition: SBLGNT
  text: πάλιν οὖν ἠρώτων αὐτὸν καὶ οἱ Φαρισαῖοι πῶς ἀνέβλεψεν. ὁ δὲ εἶπεν αὐτοῖς· Πηλὸν ἐπέθηκέν μου ἐπὶ τοὺς ὀφθαλμούς, καὶ ἐνιψάμην, καὶ βλέπω.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/015.yaml
  text: So the Pharisees also asked him again how he had received his sight[a]. He said to them, “He put mud on my eyes, and I washed[b], and I see.”
translation:
  language: vi
  text: 'Vậy, các người Pha-ri-si cũng hỏi ông một lần nữa làm sao ông đã nhìn thấy được[a]. Ông nói với họ: “Người ấy đã đắp bùn[b] lên mắt tôi, tôi đã rửa, và nay tôi nhìn thấy.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “ông đã thấy lại” hay “ông đã lấy lại được thị lực.”'
    reason: lexical_alternative
  - marker: b
    text: 'Hay: “đất sét.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν οὖν
  choice: Vì thế, ... cũng lại
  rationale: “Vì thế” nối diễn tiến này với bối cảnh ngay trước đó; “cũng lại” giữ cả ý những người Pha-ri-si tham gia hỏi và việc câu hỏi được lặp lại.
- source_word: ἠρώτων
  choice: hỏi
  rationale: Thì vị hoàn có thể gợi hành động đang diễn ra hoặc lặp lại; trong tiếng Việt, “hỏi” kết hợp với “lại” truyền đạt tự nhiên ý này.
- source_word: πῶς ἀνέβλεψεν
  choice: làm thế nào ông được sáng mắt
  rationale: Trong bối cảnh chữa lành người mù, ἀναβλέπω nói đến việc có được hoặc lấy lại thị lực. “Được sáng mắt” tự nhiên, rõ nghĩa và không buộc phải xác định ông từng nhìn thấy trước khi bị mù.
- source_word: Πηλὸν
  choice: bùn
  rationale: πηλός có thể chỉ bùn hoặc đất sét. “Bùn” là từ thông dụng, phù hợp với chất được tạo ra trong câu 6; phương án “đất sét” được giữ trong chú thích.
- source_word: ἐπέθηκέν μου ἐπὶ τοὺς ὀφθαλμούς
  choice: đắp ... lên mắt tôi
  rationale: “Đắp” diễn đạt tự nhiên hành động đặt một chất mềm lên mắt, đồng thời giữ rõ hướng của ἐπί.
- source_word: ἐνιψάμην
  choice: tôi đã rửa
  rationale: Dạng trung động có thể hiểu là chính ông thực hiện việc rửa; tiếng Việt không cần thêm đại từ phản thân. “Đã” đánh dấu hành động hoàn tất trước tình trạng hiện tại.
- source_word: βλέπω
  choice: giờ tôi thấy được
  rationale: Giữ kết quả ở hiện tại của động từ βλέπω. “Giờ” làm rõ sự tương phản thời gian vốn hàm chứa trong lời kể, còn “thấy được” là cách nói tự nhiên về khả năng nhìn.
