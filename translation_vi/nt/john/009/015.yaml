revisions:
- from: 'Vì thế, những người Pha-ri-si cũng lại hỏi ông làm thế nào ông được sáng mắt[a]. Ông đáp họ: “Người ấy đắp bùn[b] lên mắt tôi; tôi đã rửa, và giờ tôi thấy được.”'
  to: 'Vậy, các người Pha-ri-si cũng hỏi ông một lần nữa làm sao ông đã nhìn thấy được[a]. Ông nói với họ: “Người ấy đã đắp bùn[b] lên mắt tôi, tôi đã rửa, và nay tôi nhìn thấy.”'
  rationale: Bản sửa dùng “Vậy” cho οὖν, phân biệt tự nhiên καί và πάλιν qua “cũng ... một lần nữa”, và dùng “đã nhìn thấy được” cho ἀνέβλεψεν. Lời đáp giữ chuỗi hành động ngắn gọn của nguyên văn; “nay tôi nhìn thấy” phản ánh trực tiếp thì hiện tại βλέπω. Các chú thích được giữ đúng vị trí của từ/cụm từ liên quan.
