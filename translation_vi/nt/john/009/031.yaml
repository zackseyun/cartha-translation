id: JHN.9.31
reference: John 9:31
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸀οἴδαμεν ὅτι ⸂ἁμαρτωλῶν ὁ θεὸς⸃ οὐκ ἀκούει, ἀλλ’ ἐάν τις θεοσεβὴς ᾖ καὶ τὸ θέλημα αὐτοῦ ποιῇ τούτου ἀκούει.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/031.yaml
  text: We know that God does not listen to sinners; but if anyone is God-fearing and does his will[a], he listens to him.
translation:
  language: vi
  text: Chúng ta biết rằng Đức Chúa Trời không nghe người tội lỗi; nhưng nếu ai kính sợ Đức Chúa Trời[a] và làm theo ý muốn của Ngài, thì Ngài nghe người ấy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “người thờ phượng Đức Chúa Trời.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἴδαμεν
  choice: Chúng ta biết
  rationale: Dạng οἶδα mang nghĩa hiện tại trong tiếng Hy Lạp Koinē; cách dịch này tự nhiên và giữ ngôi số nhiều của nguyên bản.
- source_word: ἁμαρτωλῶν
  choice: những kẻ có tội
  rationale: Danh từ số nhiều chỉ một hạng người; cách dịch này giữ sức nặng luân lý–tôn giáo mà vẫn dễ hiểu trong tiếng Việt hiện đại.
- source_word: ἀκούει
  choice: nghe
  rationale: Trong ngữ cảnh, động từ không chỉ nói đến tiếp nhận âm thanh mà còn hàm ý thuận nghe hoặc đáp lại. “Nghe” giữ được độ mở của nguyên bản, không diễn giải quá mức thành “nhậm lời” hay “đáp lời”.
- source_word: θεοσεβὴς
  choice: kính sợ Đức Chúa Trời
  rationale: Từ này mô tả người có lòng tôn kính đối với Đức Chúa Trời. “Kính sợ Đức Chúa Trời” bảo toàn yếu tố kính reverence và nhắc đích danh Đức Chúa Trời, đồng thời không thu hẹp nghĩa vào hành vi thờ phượng nghi lễ.
- source_word: τὸ θέλημα αὐτοῦ ποιῇ
  choice: làm theo ý muốn của Ngài
  rationale: Đây là cách diễn đạt tự nhiên trong tiếng Việt cho thành ngữ “làm ý muốn của Ngài”; thêm “theo” giúp câu rõ nghĩa mà không thay đổi nội dung.
- source_word: τούτου ἀκούει
  choice: Ngài nghe người ấy
  rationale: Đại từ τούτου quy chiếu nhấn mạnh về người kính sợ Đức Chúa Trời vừa được nói đến. Lặp lại “nghe” duy trì sự đối xứng với mệnh đề trước.
- source_word: ἀλλ’ ἐάν τις
  choice: nhưng nếu ai
  rationale: Giữ nguyên sự tương phản và điều kiện bất định ở số ít của câu Hy Lạp.
theological_decisions:
- issue: Phạm vi của lời khẳng định “Đức Chúa Trời không nghe những kẻ có tội”
  choice: Giữ nguyên lời khẳng định theo cách người nói trình bày trong ngữ cảnh, không làm nhẹ hoặc hệ thống hóa thêm.
  alternative: “Đức Chúa Trời không nghe lời cầu nguyện của những kẻ có tội” hoặc “Đức Chúa Trời không chấp nhận những kẻ có tội.”
  rationale: Nguyên bản chỉ nói Đức Chúa Trời không “nghe” những kẻ có tội, đối lập với việc Ngài nghe người kính sợ Ngài và làm theo ý muốn Ngài. Bản dịch giữ sức mạnh cùng độ căng thần học của phát biểu, không biến nó thành một mệnh đề giáo lý bao quát hơn lời văn.
- issue: Cách hiểu θεοσεβής
  choice: kính sợ Đức Chúa Trời
  alternative: người thờ phượng Đức Chúa Trời
  rationale: Cách chọn chính giữ nghĩa rộng về lòng tôn kính của tính từ; cách thay thế là khả dĩ nhưng có thể được hiểu hẹp hơn theo nghĩa hành vi thờ phượng.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Trời” và đại từ tôn kính “Ngài”; giữ cấu trúc tương phản của nguyên bản và tránh diễn giải “nghe” thành một thuật ngữ giáo lý cụ thể hơn.
