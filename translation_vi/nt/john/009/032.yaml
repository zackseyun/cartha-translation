  naturalness: “Từ xưa đến nay, chưa từng nghe nói có ai mở mắt cho một người bị mù từ khi sinh ra” là câu tiếng Việt hiện đại, rõ ràng, có nhịp văn tự nhiên và phù hợp với văn cảnh lập luận trang trọng. Cấu trúc “nghe nói có ai” diễn đạt tự nhiên mệnh đề nội dung sau ὅτι.
