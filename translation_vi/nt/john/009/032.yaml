  text: ἐκ τοῦ αἰῶνος οὐκ ἠκούσθη ὅτι ἠνέῳξέν τις ὀφθαλμοὺς τυφλοῦ γεγεννημένου·
base_translation:
  language: en
  yaml_path: translation/nt/john/009/032.yaml
  text: From of old it has never been heard that anyone opened the eyes of one born blind[a].
translation:
  language: vi
  text: Từ xưa đến nay, chưa từng nghe nói có ai mở mắt cho một người bị mù từ khi sinh ra.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Từ khi có thế gian, chưa từng nghe nói…”'
    reason: Nêu cách hiểu rộng hơn của thành ngữ ἐκ τοῦ αἰῶνος mà không thay thế cách diễn đạt tự nhiên trong chính văn.
lexical_decisions:
- source_word: ἐκ τοῦ αἰῶνος
  choice: Từ xưa đến nay
  rationale: Thành ngữ chỉ toàn bộ quãng thời gian trong ký ức và kinh nghiệm của loài người; cách dịch này tự nhiên trong tiếng Việt, giữ sắc thái lịch sử mà không biến câu thành một khẳng định siêu hình về cõi đời đời.
- source_word: οὐκ ἠκούσθη
  choice: chưa từng nghe nói
  rationale: Diễn đạt tự nhiên lối bị động vô nhân xưng về một tiền lệ chưa hề được thuật lại, đồng thời giữ sức nhấn mạnh phủ định.
- source_word: ὅτι
  choice: '[được thể hiện bằng cấu trúc] nghe nói có'
  rationale: Liên từ dẫn nội dung điều chưa từng được nghe; tiếng Việt tự nhiên dùng cấu trúc “nghe nói có ai…” thay vì dịch máy móc bằng “rằng”.
- source_word: ἠνέῳξέν
  choice: mở mắt
  rationale: Giữ nguyên hình ảnh và nghĩa thông thường của động từ ἀνοίγω đi với “mắt”, không diễn giải thêm thành “chữa lành” hay “phục hồi thị lực”.
- source_word: τις
  choice: có ai
  rationale: Đại từ bất định trong phạm vi phủ định phổ quát; “có ai” là cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: ὀφθαλμοὺς
  choice: mắt
  rationale: Trong tiếng Việt, kết cấu “mở mắt cho một người” truyền đạt tự nhiên quan hệ giữa đôi mắt và người được nói đến mà không cần thêm từ sở hữu.
- source_word: τυφλοῦ γεγεννημένου
  choice: một người bị mù từ khi sinh ra
  rationale: Phản ánh phân từ hoàn thành chỉ tình trạng mù có từ lúc chào đời; “một người” không thêm giới tính mà nguyên văn không cần nhấn mạnh.
theological_decisions:
- issue: Phạm vi thời gian của ἐκ τοῦ αἰῶνος
  choice: Từ xưa đến nay
  alternative: Từ khi có thế gian / từ đời đời
  rationale: Trong lời của người từng bị mù, đây là nhận định tu từ về tiền lệ trong kinh nghiệm con người. Bản dịch giữ phạm vi lịch sử rộng và chừa chỗ cho cách hiểu truyền thống, nhưng tránh áp đặt ý niệm siêu hình “từ đời đời”.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Từ xưa đến nay” cùng “chưa từng nghe nói” tạo nhịp tự nhiên, phù hợp với lời lập luận đầy kinh ngạc của người nói.
