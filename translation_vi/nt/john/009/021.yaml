revisions:
- from: Nhưng hiện giờ anh ấy thấy được bằng cách nào, chúng tôi không biết; ai đã mở mắt cho anh ấy, chúng tôi cũng không biết. Hãy hỏi anh ấy; anh ấy đã đủ tuổi rồi. Anh ấy sẽ tự nói về mình.[a]
  to: Nhưng hiện nay làm sao anh ấy nhìn thấy, chúng tôi không biết; cũng không biết ai đã mở mắt anh ấy. Hãy hỏi anh ấy; anh ấy đã đủ tuổi. Anh ấy sẽ tự nói về mình.[a]
  rationale: Chỉnh nhẹ để dịch βλέπει trực tiếp là “nhìn thấy,” duy trì πῶς bằng “làm sao,” và làm câu về tuổi tác trung tính, tự nhiên hơn. Không thay đổi ý nghĩa, mức độ xác quyết, hay sắc thái tự làm chứng của nguyên ngữ; chú thích vẫn được neo đúng vào mệnh đề tương lai cuối câu.
