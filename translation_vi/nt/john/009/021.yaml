source:
  edition: SBLGNT
  text: πῶς δὲ νῦν βλέπει οὐκ οἴδαμεν, ἢ τίς ἤνοιξεν αὐτοῦ τοὺς ὀφθαλμοὺς ἡμεῖς οὐκ οἴδαμεν· ⸂αὐτὸν ἐρωτήσατε, ἡλικίαν ἔχει⸃, αὐτὸς περὶ ἑαυτοῦ λαλήσει.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/021.yaml
  text: But how he now sees[a], we do not know; or who opened his eyes, we do not know. Ask him; he is of age. He will speak for himself.
translation:
  language: vi
  text: Nhưng hiện nay làm sao anh ấy nhìn thấy, chúng tôi không biết; cũng không biết ai đã mở mắt anh ấy. Hãy hỏi anh ấy; anh ấy đã đủ tuổi. Anh ấy sẽ tự nói về mình.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể hiểu: “Anh ấy có thể tự trả lời về mình.” Dạng tương lai trong tiếng Hy Lạp ở đây có thể là một lời khẳng định thực tế rằng anh ấy có khả năng hoặc có trách nhiệm tự trả lời.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πῶς δὲ νῦν βλέπει
  choice: Nhưng hiện giờ anh ấy thấy được bằng cách nào
  rationale: “Nhưng” thể hiện sắc thái chuyển ý nhẹ của δέ; “hiện giờ” dịch νῦν; “thấy được bằng cách nào” diễn đạt tự nhiên câu hỏi πῶς với động từ βλέπει trong bối cảnh người trước kia bị mù nay nhìn thấy.
- source_word: οὐκ οἴδαμεν
  choice: chúng tôi không biết
  rationale: Dịch trực tiếp οὐκ οἴδαμεν và giữ sự lặp lại trong câu nhằm phản ánh cách nhấn mạnh của lời khai nguyên ngữ.
- source_word: ἢ τίς ἤνοιξεν αὐτοῦ τοὺς ὀφθαλμούς
  choice: ai đã mở mắt cho anh ấy
  rationale: Giữ hình ảnh “mở mắt” của ἀνοίγω ... τοὺς ὀφθαλμούς và mối liên hệ với toàn bộ trình thuật; trong tiếng Việt không cần dịch ἤ thành “hoặc” sau dấu chấm phẩy để câu tự nhiên mà quan hệ giữa hai điều không biết vẫn rõ.
- source_word: αὐτὸν ἐρωτήσατε
  choice: Hãy hỏi anh ấy
  rationale: Diễn đạt trực tiếp mệnh lệnh số nhiều của ἐρωτήσατε; tiếng Việt không cần đánh dấu số nhiều của người nghe.
- source_word: ἡλικίαν ἔχει
  choice: anh ấy đã đủ tuổi rồi
  rationale: Trong ngữ cảnh thẩm vấn, cụm này nói đến tuổi đủ để tự trả lời và chịu trách nhiệm về lời mình nói, không phải vóc dáng; “đã đủ tuổi rồi” là cách nói hiện đại, rõ nghĩa.
- source_word: αὐτὸς περὶ ἑαυτοῦ λαλήσει
  choice: Anh ấy sẽ tự nói về mình
  rationale: “Sẽ ... nói” giữ dạng tương lai của λαλήσει; “tự” chuyển tải sự nhấn mạnh của αὐτός cùng ý phản thân của περὶ ἑαυτοῦ, đồng thời không loại bỏ sắc thái anh ấy có thể hoặc có trách nhiệm tự trả lời.
theological_decisions:
- issue: Ý nghĩa của ἡλικίαν ἔχει trong ngữ cảnh
  choice: Đã đủ tuổi để tự trả lời
  alternative: Đã trưởng thành nói chung; hoặc có tầm vóc (ít phù hợp trong ngữ cảnh này)
  rationale: Ngữ cảnh là cuộc chất vấn của giới lãnh đạo và việc cha mẹ chuyển trách nhiệm trả lời cho con trai. Bản dịch nêu tuổi đủ để tự khai mà không thêm một quy định pháp lý cụ thể không có trong câu.
- issue: Sắc thái của αὐτὸς περὶ ἑαυτοῦ λαλήσει
  choice: Anh ấy sẽ tự nói về mình
  alternative: Anh ấy có thể tự trả lời về mình
  rationale: Giữ hình thức tương lai và sắc thái tự làm chứng trong nguyên ngữ, đồng thời chú thích khả năng câu nói mang lực thực tế về năng lực hoặc trách nhiệm trả lời.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Đại từ “anh ấy” tránh sắc thái hạ thấp có thể có của “nó” trong tiếng Việt hiện đại, đồng thời không thêm danh xưng tôn giáo hay địa vị xã hội. Dấu chú thích được đặt sau mệnh đề mà chú thích trực tiếp giải thích.
