  to: Chúng ta phải làm các việc của Đấng đã sai tôi khi còn ban ngày; đêm đang đến[a], khi không ai có thể làm việc.
  rationale: Sửa nhẹ nhằm diễn đạt chính xác hơn cặp đối lập ἡμέρα/νύξ là “ban ngày/đêm”, làm câu gọn tự nhiên hơn, và chuẩn hóa cách giới thiệu dị bản bằng “đọc”. Cách đọc số nhiều của SBLGNT cùng sự căng thẳng “chúng ta”/“tôi” được giữ nguyên trong bản chính; dị bản số ít được nêu rõ trong chú thích.
