    rationale: ἕως ἡμέρα ἐστίν nói về thời kỳ “ngày”, đối lập với “đêm”, không chủ yếu về độ sáng của bầu trời. Cách sửa tránh liên tưởng thời tiết và giữ hình ảnh nguyên ngữ.
  - severity: low
    issue: “những công việc” hơi nặng so với “các việc”.
    rationale: “Các việc” là cách nói tự nhiên, trang trọng trong tiếng Việt Kinh Thánh và chuyển đạt τὰ ἔργα mà không thay đổi nghĩa.
