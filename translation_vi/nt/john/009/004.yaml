  verdict: revise
  source_fidelity: Bản dịch theo đúng cách đọc SBLGNT ἡμᾶς với “Chúng ta phải”, giữ được sắc thái tất yếu của δεῖ, đối tượng “các việc của Đấng đã sai tôi”, và sự đối lập ngày/đêm. Ghi chú dị bản số ít phản ánh thích đáng ἐμέ (“tôi”).
  naturalness: Bản nháp nhìn chung tự nhiên và trang trọng. Tuy nhiên, “khi trời còn sáng” có thể gợi điều kiện thời tiết/ánh sáng hơn là thời khoảng “ban ngày” (ἡμέρα); “khi còn ban ngày” trực tiếp hơn. “Các việc” gọn và tự nhiên hơn “những công việc”, đồng thời bảo toàn thuật ngữ Johannine.
  terminology: “Đấng đã sai tôi” là cách chuyển đạt phù hợp cho τοῦ πέμψαντός με trong văn cảnh và đăng ký trang trọng. “Các việc” giữ liên hệ thuật ngữ với ἔργα; “làm việc” ở vế sau diễn đạt chính xác động từ tuyệt đối ἐργάζεσθαι.
  issues:
