source:
  edition: SBLGNT
  text: ⸀ἡμᾶς δεῖ ἐργάζεσθαι τὰ ἔργα τοῦ πέμψαντός με ἕως ἡμέρα ἐστίν· ἔρχεται νὺξ ὅτε οὐδεὶς δύναται ἐργάζεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/004.yaml
  text: We must do the works of the one who sent me while it is day; night is coming[a], when no one can work.
translation:
  language: vi
  text: Chúng ta phải làm các việc của Đấng đã sai tôi khi còn ban ngày; đêm đang đến[a], khi không ai có thể làm việc.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Một số thủ bản đọc: “Tôi phải làm các việc của Đấng đã sai tôi khi còn ban ngày.”'
    reason: textual_variant
lexical_decisions:
- source_word: ἡμᾶς
  choice: Chúng ta
  rationale: Đại từ ngôi thứ nhất số nhiều làm chủ thể theo nghĩa với δεῖ; “chúng ta phải” là cách diễn đạt tự nhiên, bao gồm người nói và những người cùng hiện diện.
- source_word: δεῖ
  choice: phải
  rationale: Diễn đạt rõ sự cần thiết hoặc bổn phận, tự nhiên trong tiếng Việt hiện đại.
- source_word: ἐργάζεσθαι τὰ ἔργα
  choice: làm những công việc
  rationale: Tránh lặp từ vụng về nhưng vẫn giữ liên hệ giữa động từ “làm” và danh từ “công việc”; “những công việc” phù hợp với các việc được Đấng sai phái giao làm trong văn mạch Gioan.
- source_word: τοῦ πέμψαντός με
  choice: của Đấng đã sai tôi
  rationale: Dịch phân từ có mạo từ như một danh xưng; “Đấng” là cách nói trang trọng, tự nhiên về Đức Chúa Trời mà không thêm tên vốn không có trong câu.
- source_word: ἕως ἡμέρα ἐστίν
  choice: khi trời còn sáng
  rationale: Thành ngữ tiếng Việt tự nhiên, thể hiện khoảng thời gian còn có thể hành động và giữ sự tương phản với đêm sắp đến.
- source_word: ἔρχεται νὺξ
  choice: đêm đang đến
  rationale: Giữ hình ảnh đêm và sắc thái hiện tại mang ý nghĩa đang tiến đến.
- source_word: ὅτε οὐδεὶς δύναται ἐργάζεσθαι
  choice: lúc không ai có thể làm việc được
  rationale: Dịch trực tiếp mệnh đề thời gian, giữ tính phổ quát của οὐδεὶς và ý nghĩa khả năng của δύναται.
theological_decisions:
- issue: 'Dị bản đầu câu: ἡμᾶς (“chúng ta”) hay ἐμέ (“tôi”)'
  choice: Chúng ta phải làm những công việc của Đấng đã sai tôi
  alternative: Tôi phải làm những công việc của Đấng đã sai tôi
  rationale: Bản văn SBLGNT được cung cấp đọc ἡμᾶς, nên bản dịch chính dùng “chúng ta”. Dị bản số ít có chứng cứ thủ bản đáng kể và quen thuộc trong nhiều bản dịch, vì vậy được ghi chú để minh bạch mà không hòa lẫn hai cách đọc.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đấng” cho phân từ chỉ Đấng sai phái, đồng thời giữ nguyên đại từ “tôi” của lời Đức Giê-su. Hình ảnh sáng–đêm và sự căng thẳng giữa “chúng ta” với “Đấng đã sai tôi” được bảo toàn.
