source:
  edition: SBLGNT
  text: ⸀Ἤκουσεν Ἰησοῦς ὅτι ἐξέβαλον αὐτὸν ἔξω, καὶ εὑρὼν αὐτὸν ⸀εἶπεν· Σὺ πιστεύεις εἰς τὸν υἱὸν τοῦ ⸀ἀνθρώπου;
base_translation:
  language: en
  yaml_path: translation/nt/john/009/035.yaml
  text: Jesus heard that they had thrown him out[a], and when he found him, he said, “Do you believe in the Son of Man?”
translation:
  language: vi
  text: 'Giê-su nghe tin họ đã đuổi người ấy ra ngoài. Khi tìm gặp người ấy, Ngài nói: “Anh có tin Con Người[a] không?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Một số thủ bản chép “Con Đức Chúa Trời” thay cho “Con Người.”
    reason: textual_variant
lexical_decisions:
- source_word: ἐξέβαλον ... ἔξω
  choice: đã đuổi người ấy ra ngoài
  rationale: Cách dịch này giữ được sắc thái nhấn mạnh của động từ ἐκβάλλω đi với ἔξω, diễn tả việc trục xuất, đồng thời tự nhiên trong tiếng Việt hiện đại.
- source_word: εὑρὼν
  choice: Khi tìm gặp người
  rationale: 'Phân từ bất định được hiểu theo nghĩa thời gian, thể hiện tự nhiên trình tự hành động: Đức Chúa Jêsus tìm và gặp người ấy rồi ngỏ lời.'
- source_word: Σὺ πιστεύεις
  choice: Anh có tin ... không?
  rationale: πιστεύω được dịch là “tin”; đại từ Σὺ có tính nhấn mạnh được chuyển tải bằng lời hỏi trực tiếp với đại từ xưng hô “anh” phù hợp ngữ cảnh.
- source_word: εἰς
  choice: tin ...
  rationale: Sau πιστεύω, εἰς chỉ lòng tin hướng đến một người. Tiếng Việt thường diễn đạt tự nhiên bằng “tin” với đối tượng trực tiếp, không cần thêm giới từ.
- source_word: υἱὸν τοῦ ἀνθρώπου
  choice: Con Người
  rationale: Đây là cách dịch quen thuộc của danh hiệu này, giữ được sự liên hệ với Đa-ni-ên 7 và cách dùng trong sách Giăng.
theological_decisions:
- issue: Dị bản về danh hiệu Cơ Đốc học trong câu hỏi
  choice: Con Người
  alternative: Con Đức Chúa Trời
  rationale: Bản văn SBLGNT đọc ἀνθρώπου (“người”), nên được giữ trong chính văn. Dị bản “Con Đức Chúa Trời” có ý nghĩa và ảnh hưởng lịch sử đáng kể, vì vậy được ghi ở chú thích thay vì đưa vào chính văn.
translation_notes:
  register: Văn phong trang trọng, rõ ràng và hiện đại. Dùng “Đức Chúa Jêsus” và đại từ “Ngài” theo lối dịch Kinh Thánh tiếng Việt quen thuộc; dùng “anh” để lời hỏi tự nhiên mà vẫn tôn trọng. Dấu chú thích [a] được đặt sau mệnh đề nói về việc bị đuổi ra ngoài theo dữ liệu đầu vào, dù nội dung chú thích liên quan đến danh hiệu ở cuối câu.
