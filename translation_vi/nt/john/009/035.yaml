revisions:
- from: 'Đức Chúa Jêsus nghe tin họ đã đuổi người ấy ra ngoài[a]. Khi tìm gặp người, Ngài hỏi: “Anh có tin Con Người không?”'
  to: 'Giê-su nghe tin họ đã đuổi người ấy ra ngoài. Khi tìm gặp người ấy, Ngài nói: “Anh có tin Con Người[a] không?”'
  rationale: Sửa vị trí neo chú thích để liên kết chính xác với dị bản văn bản, đồng thời chuẩn hóa cách viết tên Giê-su và không thêm tước hiệu vào tên riêng. Giữ “đã đuổi ... ra ngoài” để phản ánh sắc thái nhấn mạnh của ἐξέβαλον ... ἔξω; giữ cấu trúc thời gian “Khi tìm gặp” cho εὑρών; và giữ “Con Người” theo bản văn SBLGNT.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T06:23:02Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch phản ánh đúng trình tự và ý nghĩa chính của bản SBLGNT: Giê-su nghe việc người ấy bị trục xuất, tìm gặp người ấy, rồi hỏi về đức tin nơi Con Người. Tuy nhiên, chú thích về dị bản danh hiệu phải được neo tại “Con Người”, không phải tại mệnh đề “đuổi ... ra ngoài”.'
  naturalness: “Đức Chúa Jêsus” dùng lối chính tả và tước hiệu truyền thống, không phải lựa chọn trung tính, hiện đại nhất; “Giê-su” tự nhiên hơn trong tiếng Việt chuẩn hiện đại và bám sát tên riêng Ἰησοῦς. Câu sửa vẫn giữ giọng văn Kinh Thánh trang trọng, rõ ràng.
  terminology: “Con Người” là cách dịch thích hợp cho ὁ υἱὸς τοῦ ἀνθρώπου và phải được giữ trong chính văn theo SBLGNT. Chú thích nêu đúng dị bản quan trọng “Con Đức Chúa Trời”.
  issues:
