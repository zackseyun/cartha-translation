    issue: Neo chú thích [a] đặt sai vị trí.
    rationale: Nội dung chú thích nói về dị bản “Con Đức Chúa Trời”/“Con Người”, nên dấu [a] phải gắn với “Con Người”, không gắn với việc bị đuổi ra ngoài.
  - severity: low
    issue: Tên “Jêsus” và tước hiệu “Đức Chúa” không phải cách diễn đạt trung tính, hiện đại nhất.
    rationale: Bản Hy Lạp chỉ có tên Ἰησοῦς. Dùng “Giê-su” tránh thêm tước hiệu không có trong câu và phù hợp tiếng Việt chuẩn hiện đại.
