source:
  edition: SBLGNT
  text: ὁ δὲ ἔφη· Πιστεύω, κύριε· καὶ προσεκύνησεν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/038.yaml
  text: And he said[a], “I believe[b], Lord,” and he worshiped him.
translation:
  language: vi
  text: 'Người ấy nói: “Tôi tin, lạy Chúa[a],” rồi thờ lạy Ngài[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hoặc “thưa ngài” hoặc “thưa ông.” Từ Hy Lạp κύριε có thể là một cách xưng hô kính trọng; ở đây dịch là “lạy Chúa” vì văn cảnh đạt đến cao trào bằng lời tuyên xưng đức tin và hành động thờ lạy.
    reason: alternative_reading
  - marker: b
    text: Hoặc “sấp mình trước Ngài” hoặc “bày tỏ lòng tôn kính với Ngài.” Động từ Hy Lạp có thể chỉ hành động phủ phục hoặc bày tỏ lòng tôn kính; ở đây dịch là “thờ lạy” theo văn cảnh.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ
  choice: Người ấy
  rationale: Mạo từ ὁ được dùng như đại từ, chỉ người đã được chữa lành; δέ nối tiếp lời kể và không cần dịch thành một từ chỉ sự tương phản mạnh.
- source_word: ἔφη
  choice: thưa
  rationale: φημί ở thì aorist giới thiệu lời nói. Trong tiếng Việt, “thưa” tự nhiên khi người nói trực tiếp kính cẩn xưng hô với Chúa Giê-su.
- source_word: Πιστεύω
  choice: con tin
  rationale: Giữ nghĩa trực tiếp của πιστεύω và mối liên hệ với chủ đề “tin” trong sách Giăng. Đại từ “con” phù hợp với lời thưa kính cẩn trong ngữ cảnh này mà không thêm nội dung vào động từ.
- source_word: κύριε
  choice: Lạy Chúa
  rationale: κύριε có thể là cách xưng hô lịch sự hoặc mang nghĩa “Chúa.” Việc Chúa Giê-su vừa bày tỏ chính mình, tiếp theo là lời tuyên xưng đức tin và hành động προσκυνέω, khiến “Lạy Chúa” phù hợp nhất trong chính văn; khả năng chỉ là lời xưng hô kính trọng được giữ trong chú thích.
- source_word: προσεκύνησεν
  choice: thờ lạy
  rationale: προσκυνέω có thể chỉ hành động phủ phục, bày tỏ lòng tôn kính hoặc thờ phượng. Trong văn cảnh lời tuyên xưng đức tin hướng về Chúa Giê-su, “thờ lạy” truyền đạt tốt nhất sức nặng của câu, còn các sắc thái khác được ghi ở chú thích.
- source_word: αὐτῷ
  choice: Ngài
  rationale: Đại từ ở cách tặng chỉ đối tượng của hành động προσκυνέω. “Ngài” là cách quy chiếu trang trọng, tự nhiên đến Chúa Giê-su trong tiếng Việt.
theological_decisions:
- issue: κύριε là lời xưng hô lịch sự hay lời nhìn nhận Chúa Giê-su là “Chúa”
  choice: Lạy Chúa
  alternative: Thưa ông / thưa Ngài
  rationale: Văn cảnh đạt đến cao trào bằng lời tin và hành động thờ lạy, nên “Lạy Chúa” phù hợp hơn, nhưng chú thích vẫn bảo toàn khả năng từ này chỉ là cách xưng hô kính trọng.
- issue: προσεκύνησεν diễn tả sự thờ phượng hay chỉ động tác phủ phục/tỏ lòng tôn kính
  choice: thờ lạy
  alternative: sấp mình trước Ngài / bày tỏ lòng tôn kính với Ngài
  rationale: Đối tượng là Chúa Giê-su và hành động diễn ra ngay sau lời tuyên xưng “con tin,” nên “thờ lạy” hợp với văn cảnh nhất. Tuy vậy, không loại bỏ phạm vi nghĩa rộng hơn của động từ Hy Lạp, vì thế các cách hiểu khác được nêu trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Thưa,” “Lạy Chúa,” “con” và “Ngài” tạo thành lối xưng hô kính cẩn, tự nhiên trong lời nói trực tiếp; câu vẫn ngắn gọn theo cấu trúc nguyên bản.
