source:
  edition: SBLGNT
  text: ἦν δὲ σάββατον ⸂ἐν ᾗ ἡμέρᾳ⸃ τὸν πηλὸν ἐποίησεν ὁ Ἰησοῦς καὶ ἀνέῳξεν αὐτοῦ τοὺς ὀφθαλμούς.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/014.yaml
  text: It was a Sabbath on the day when Jesus made the mud and opened his eyes.
translation:
  language: vi
  text: Ngày Đức Giê-su làm bùn[a] và mở mắt cho người ấy là ngày Sa-bát.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “đất sét”.
    reason: lexical_alternative
lexical_decisions:
- source_word: σάββατον
  choice: ngày Sa-bát
  rationale: Cách gọi tự nhiên trong tiếng Việt, diễn đạt ngày Sa-bát mà không thêm nhận định về luật Sa-bát.
- source_word: ἐν ᾗ ἡμέρᾳ
  choice: Hôm ấy ... ngày
  rationale: Tái cấu trúc câu theo tiếng Việt tự nhiên nhưng vẫn giữ quan hệ thời gian giữa ngày Sa-bát và hai hành động của Đức Giê-su.
- source_word: πηλόν
  choice: bùn
  rationale: Trong ngữ cảnh đất trộn với nước miếng, “bùn” là từ thông dụng và tự nhiên; “đất sét” vẫn là một khả năng từ vựng.
- source_word: ἐποίησεν
  choice: làm
  rationale: Diễn đạt trực tiếp động từ ποιέω, chỉ việc làm ra hỗn hợp bùn.
- source_word: ἀνέῳξεν
  choice: mở
  rationale: Giữ hình ảnh cụ thể của nguyên văn thay vì diễn giải thành “chữa sáng mắt” hay “phục hồi thị lực”.
- source_word: αὐτοῦ τοὺς ὀφθαλμούς
  choice: mắt cho người ấy
  rationale: Đại từ chỉ người mù đã được nhắc đến; cách diễn đạt này rõ nghĩa trong tiếng Việt và vẫn giữ bộ phận cơ thể cụ thể là mắt.
- source_word: δὲ
  choice: không dịch riêng
  rationale: δέ là chuyển tiếp nhẹ trong mạch kể; tiếng Việt không cần thêm “bấy giờ” hay “nhưng” tại đây, tránh tạo sắc thái thời gian hoặc đối lập quá mức.
theological_decisions:
- issue: Việc chữa lành diễn ra vào ngày Sa-bát
  choice: Chỉ thuật lại thời điểm và hành động của Đức Giê-su, không bình luận về tính hợp luật.
  alternative: Diễn giải thêm rằng hành động ấy dẫn đến tranh luận về luật Sa-bát.
  rationale: Câu này nêu dữ kiện làm nền cho cuộc tranh luận tiếp theo; bản dịch không nên giải quyết trước sự căng thẳng thần học của trình thuật.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Đức Giê-su” phù hợp với lối gọi kính trọng phổ biến; “ngày Sa-bát” giữ thuật ngữ Kinh Thánh quen thuộc. Cấu trúc “Hôm ấy là...” tránh câu tiếng Việt gượng kiểu “Đó là một ngày Sa-bát vào ngày khi...”, đồng thời giữ trọng tâm thời gian của nguyên văn.
