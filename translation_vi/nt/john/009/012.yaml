  text: ⸂καὶ εἶπαν⸃ αὐτῷ· Ποῦ ἐστιν ἐκεῖνος; λέγει· Οὐκ οἶδα.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/012.yaml
  text: And they said to him[a], “Where is that man?” He says, “I do not know.”
translation:
  language: vi
  text: 'Họ hỏi anh: “Người ấy ở đâu?” Anh đáp: “Tôi không biết.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ εἶπαν αὐτῷ
  choice: Họ hỏi anh
  rationale: Trong ngữ cảnh, εἶπαν dẫn vào một câu hỏi trực tiếp; tiếng Việt tự nhiên dùng “hỏi”. Đại từ “anh” chỉ người đã được chữa lành. Không dịch riêng καὶ vì mở đầu bằng “Và họ nói với anh” kém tự nhiên trong tiếng Việt và quan hệ tiếp nối đã rõ từ mạch kể.
- source_word: Ποῦ
  choice: ở đâu
  rationale: Diễn đạt trực tiếp trạng từ nghi vấn về nơi chốn.
- source_word: ἐκεῖνος
  choice: người ấy
  rationale: Đại từ chỉ định được dùng như danh từ; “người ấy” vừa tự nhiên vừa giữ được sắc thái chỉ định và khoảng cách của tiếng Hy Lạp, thay vì làm yếu thành “ông ấy” hay “người đó” với sắc thái có thể suồng sã hơn.
- source_word: λέγει
  choice: Anh đáp
  rationale: Hiện tại lịch sử λέγει tiếp nối lời thoại. “Đáp” là lối kể tự nhiên, trang trọng vừa phải trong tiếng Việt; không nhất thiết tái hiện hình thái hiện tại vì tiếng Việt không đánh dấu thì như tiếng Hy Lạp.
- source_word: Οὐκ οἶδα
  choice: Tôi không biết
  rationale: Bản dịch trực tiếp, rõ ràng và phù hợp với văn phong hiện đại trang nghiêm.
theological_decisions: []
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, ngắn gọn và trang trọng tự nhiên. Dùng “anh” cho người được chữa lành và “người ấy” cho ἐκεῖνος; tránh cấu trúc dịch sát máy móc “Và họ nói với anh”.
