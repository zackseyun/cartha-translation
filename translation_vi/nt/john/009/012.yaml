  source_fidelity: 'Bản dịch chuyển tải đầy đủ ý chính của καὶ εἶπαν αὐτῷ· Ποῦ ἐστιν ἐκεῖνος; λέγει· Οὐκ οἶδα. “Họ hỏi anh” diễn đạt tự nhiên chức năng của λέγω khi dẫn một câu nghi vấn trực tiếp; “người ấy” giữ được tính chỉ định của ἐκεῖνος; và “Anh đáp: ‘Tôi không biết’” truyền đạt rõ lời đáp của người được chữa lành. Việc không dịch riêng καὶ là chấp nhận được trong mạch văn tiếng Việt.'
