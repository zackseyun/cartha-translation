source:
  edition: SBLGNT
  text: Ἔστιν ⸀παιδάριον ὧδε ⸀ὃς ἔχει πέντε ἄρτους κριθίνους καὶ δύο ὀψάρια· ἀλλὰ ταῦτα τί ἐστιν εἰς τοσούτους;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/009.yaml
  text: There is a boy here who has five barley loaves and two fish[a], but what are these for so many?
translation:
  language: vi
  text: “Ở đây có một cậu bé có năm ổ bánh lúa mạch và hai con cá, nhưng bấy nhiêu thì thấm vào đâu cho ngần ấy người?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παιδάριον
  choice: một cậu bé
  rationale: Chỉ một trẻ em hoặc thiếu niên nam; “cậu bé” tự nhiên trong tiếng Việt hiện đại mà không nhấn quá mức rằng em còn rất nhỏ.
- source_word: ὧδε
  choice: ở đây
  rationale: Diễn đạt trực tiếp trạng từ chỉ nơi chốn.
- source_word: ὃς ἔχει
  choice: có
  rationale: 'Trong tiếng Việt, lược đại từ quan hệ tạo câu tự nhiên: “một cậu bé có…”, vẫn giữ chức năng xác định cậu bé qua những gì em mang theo.'
- source_word: ἄρτους κριθίνους
  choice: năm ổ bánh lúa mạch
  rationale: “Ổ bánh” thể hiện ἄρτους, còn “lúa mạch” thể hiện κριθίνους; cách nói rõ ràng và tự nhiên.
- source_word: ὀψάρια
  choice: hai con cá
  rationale: Trong ngữ cảnh này là cá dùng ăn với bánh. Hy Lạp có dạng giảm nhẹ nhưng không nhất thiết phải định rõ kích cỡ; “cá” tránh thêm ý ngoài văn bản.
- source_word: ἀλλὰ
  choice: nhưng
  rationale: Giữ sự tương phản trực tiếp giữa số thức ăn hiện có và đám đông.
- source_word: ταῦτα τί ἐστιν εἰς τοσούτους
  choice: bấy nhiêu thì thấm vào đâu cho ngần ấy người?
  rationale: Câu hỏi mang ý đánh giá sự thiếu hụt, không chỉ hỏi nhận diện vật. Thành ngữ “thấm vào đâu” truyền đạt tự nhiên sức mạnh tu từ của câu, còn “cho ngần ấy người” giữ quan hệ về mức độ đủ dùng.
