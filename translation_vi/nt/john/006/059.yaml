  text: ταῦτα εἶπεν ἐν συναγωγῇ διδάσκων ἐν Καφαρναούμ.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/059.yaml
  text: He said these things while teaching in the synagogue in Capernaum.
translation:
  language: vi
  text: Ngài nói những điều này khi đang giảng dạy trong nhà hội tại Ca-bê-na-um.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταῦτα
  choice: những điều này
  rationale: Đại từ chỉ định trung tính số nhiều quy chiếu về toàn bộ những lời hoặc vấn đề vừa được trình bày, nên giữ rõ ý số nhiều.
- source_word: εἶπεν
  choice: Ngài nói
  rationale: Động từ aorist của λέγω được chuyển trực tiếp là “nói”. Chủ ngữ ẩn được hiểu theo ngữ cảnh là Chúa Giê-su; “Ngài” tự nhiên trong văn phong Kinh Thánh tiếng Việt mà không lặp lại tên riêng.
- source_word: ἐν συναγωγῇ
  choice: trong nhà hội
  rationale: Dù danh từ Hy Lạp không có mạo từ, cấu trúc giới từ với danh từ số ít ở đây có thể chỉ một địa điểm xác định trong ngữ cảnh. Tiếng Việt không cần thêm từ biểu thị tính xác định.
- source_word: διδάσκων
  choice: khi đang giảng dạy
  rationale: Phân từ hiện tại diễn tả hành động đang diễn ra đồng thời với động từ chính; cách dịch này giữ rõ quan hệ thời gian ấy.
- source_word: ἐν Καφαρναούμ
  choice: tại Ca-bê-na-um
  rationale: Giữ tên địa danh theo lối phiên âm quen thuộc trong tiếng Việt; “tại” diễn đạt tự nhiên vị trí của nhà hội.
