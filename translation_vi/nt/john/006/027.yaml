  source_fidelity: Bản dịch giữ đúng mệnh lệnh tương phản, hai loại thức ăn, danh xưng «Con Người», ngôi số nhiều của ὑμῖν, và hình ảnh «đóng ấn». Tuy nhiên, «còn lại» thường chỉ thức ăn thừa trong tiếng Việt, không diễn tả tự nhiên μένουσαν («còn mãi/tồn tại»). «Đã đóng ấn xác nhận» đưa phần giải thích vào văn bản chính; nguyên văn chỉ dùng hình ảnh đóng ấn.
