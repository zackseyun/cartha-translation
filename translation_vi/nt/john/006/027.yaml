id: JHN.6.27
reference: John 6:27
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐργάζεσθε μὴ τὴν βρῶσιν τὴν ἀπολλυμένην ἀλλὰ τὴν βρῶσιν τὴν μένουσαν εἰς ζωὴν αἰώνιον, ἣν ὁ υἱὸς τοῦ ἀνθρώπου ὑμῖν δώσει, τοῦτον γὰρ ὁ πατὴρ ἐσφράγισεν ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/027.yaml
  text: Do not work for the food that perishes[a], but for the food that remains to eternal life, which the Son of Man will give to you[b]; for God the Father has set his seal on him.
translation:
  language: vi
  text: Đừng làm việc vì thức ăn sẽ hư mất, nhưng hãy làm việc vì thức ăn còn mãi đến sự sống đời đời, là thức ăn Con Người sẽ ban cho anh em; vì Đức Chúa Trời, là Cha, đã đóng ấn trên Ngài.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “đã đóng ấn trên Ngài”; hình ảnh này hàm ý sự xác nhận hoặc chứng thực.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐργάζεσθε μὴ ... ἀλλὰ
  choice: Đừng làm việc vì ... nhưng hãy làm việc vì
  rationale: Diễn đạt tự nhiên mệnh lệnh tương phản trong tiếng Việt, đồng thời giữ ý hướng đến đối tượng mà người nghe phải tìm kiếm.
- source_word: βρῶσιν
  choice: thức ăn
  rationale: Trong ngữ cảnh, từ này chỉ đồ ăn chứ không phải hành động ăn uống.
- source_word: ἀπολλυμένην
  choice: sẽ hư mất
  rationale: Giữ ý thức ăn phải tiêu hoại, rộng hơn nghĩa chỉ bị ôi thiu.
- source_word: μένουσαν εἰς ζωὴν αἰώνιον
  choice: còn lại cho sự sống đời đời
  rationale: “Còn lại” phản ánh μένω; “cho sự sống đời đời” giữ sắc thái mục đích hoặc kết quả của εἰς mà không quyết định quá mức quan hệ chính xác.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Con Người
  rationale: Danh xưng quen thuộc, giữ cách diễn đạt và âm hưởng thần học của nguyên văn.
- source_word: ὑμῖν δώσει
  choice: sẽ ban cho anh em
  rationale: “Ban” tự nhiên khi chủ thể là Con Người và đối tượng là thức ăn ban sự sống; “anh em” thể hiện ngôi thứ hai số nhiều.
- source_word: ἐσφράγισεν
  choice: đã đóng ấn xác nhận
  rationale: Giữ hình ảnh cái ấn trong nguyên văn, đồng thời làm rõ chức năng xác nhận hoặc chứng thực.
- source_word: ὁ πατὴρ ... ὁ θεός
  choice: Đức Chúa Trời là Cha
  rationale: Phản ánh cấu trúc đồng vị xác định Cha là Đức Chúa Trời mà không thêm một công thức tín lý ngoài câu.
theological_decisions:
- issue: Quan hệ của cụm εἰς ζωὴν αἰώνιον với thức ăn còn lại
  choice: còn lại cho sự sống đời đời
  alternative: tồn tại đến sự sống đời đời
  rationale: Cách chọn giữ được hướng đích hoặc kết quả của εἰς, đồng thời không thu hẹp thành một cách giải thích duy nhất.
- issue: Ý nghĩa của ἐσφράγισεν đối với Con Người
  choice: đã đóng ấn xác nhận Ngài
  alternative: đã đóng ấn trên Ngài
  rationale: Giữ ẩn dụ đóng ấn và nói rõ nét xác nhận/chứng thực vốn phù hợp với ngữ cảnh, nhưng không thay ẩn dụ bằng một lời giải nghĩa hoàn toàn.
- issue: Cấu trúc ὁ πατὴρ ... ὁ θεός
  choice: Đức Chúa Trời là Cha
  alternative: Cha, tức là Đức Chúa Trời
  rationale: Giữ sự đồng nhất được phát biểu trong nguyên văn mà không đưa thêm định thức hệ phái.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” cho đại từ số nhiều ὑμῖν và viết hoa danh xưng “Con Người”. Đại từ “Ngài” trong mệnh đề cuối chỉ Con Người.
