revisions:
- from: Đừng làm việc vì thức ăn sẽ hư mất, nhưng hãy làm việc vì thức ăn còn lại cho sự sống đời đời, là thức ăn Con Người sẽ ban cho anh em; vì Đức Chúa Trời là Cha đã đóng ấn xác nhận Ngài.[a]
  to: Đừng làm việc vì thức ăn sẽ hư mất, nhưng hãy làm việc vì thức ăn còn mãi đến sự sống đời đời, là thức ăn Con Người sẽ ban cho anh em; vì Đức Chúa Trời, là Cha, đã đóng ấn trên Ngài.[a]
  rationale: Bản sửa thay cách hiểu không chủ ý «thức ăn còn lại» bằng «thức ăn còn mãi», giữ tương phản giữa ἀπολλυμένην và μένουσαν cũng như hướng đích εἰς ζωὴν αἰώνιον. Hình ảnh «đóng ấn» được giữ trong câu chính, còn nét xác nhận/chứng thực được chuyển sang chú thích. Cụm đồng vị về Cha và Đức Chúa Trời được diễn đạt tự nhiên hơn mà không thêm diễn giải tín lý.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T06:20:05Z'
review_pass:
