  verdict: revise
  source_fidelity: 'Bản nháp phản ánh đúng thành phần chính của câu, nhưng “khó chấp nhận” thu hẹp tính mơ hồ của σκληρός vào sự tiếp nhận, và “nghe theo” thêm sắc thái vâng phục/tuân theo mạnh hơn ἀκούειν trong câu này. Cần giữ độ mở của lời than phiền: lời ấy vừa có thể khó, khắc nghiệt, vừa khó tiếp nhận.'
  naturalness: Câu sửa dùng tiếng Việt hiện đại, trang trọng và tự nhiên. “Nhiều người trong số các môn đồ của Ngài” làm rõ ἐκ τῶν μαθητῶν αὐτοῦ là một nhóm trong số các môn đồ; “ai có thể nghe nổi?” tự nhiên trong một lời phản đối mà không biến động từ thành mệnh lệnh phải vâng theo.
  terminology: Giữ “môn đồ” và “Ngài” phù hợp văn phong Phúc Âm trang trọng. “Lời này” là cách chuyển ngữ phù hợp cho ὁ λόγος οὗτος, vẫn mở cho các nghĩa lời nói, lời dạy hay sứ điệp.
  issues:
