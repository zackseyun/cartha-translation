id: JHN.6.60
reference: John 6:60
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Πολλοὶ οὖν ἀκούσαντες ἐκ τῶν μαθητῶν αὐτοῦ εἶπαν· Σκληρός ἐστιν ⸂ὁ λόγος οὗτος⸃· τίς δύναται αὐτοῦ ἀκούειν;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/060.yaml
  text: Therefore many of his disciples[a], when they heard it, said, “This word is hard[b]; who can listen to it?”
translation:
  language: vi
  text: 'Vì vậy, nhiều người trong số các môn đồ của Ngài, sau khi nghe lời ấy, nói: “Lời này thật khó[a]; ai có thể nghe nổi[b]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “Lời này thật cứng”, “thật khắc nghiệt” hoặc “thật khó tiếp nhận”. Từ Hy Lạp có thể chỉ điều khó, gay gắt hoặc khó tiếp nhận, chứ không chỉ điều khó hiểu.
    reason: lexical_alternative
  - marker: b
    text: Hay “ai có thể nghe lời ấy?” Động từ Hy Lạp có thể mang nghĩa nghe, lắng nghe, hoặc tiếp nhận; trong ngữ cảnh này câu hỏi không chỉ nói về khả năng nghe bằng tai.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πολλοὶ οὖν
  choice: Vì vậy... nhiều
  rationale: “Nhiều” diễn đạt tự nhiên số lượng đáng kể trong nhóm môn đồ; “vì vậy” giữ quan hệ tiếp nối và suy ra từ lời giảng trước đó.
- source_word: ἀκούσαντες
  choice: sau khi nghe lời ấy
  rationale: Phân từ bất định quá khứ có giá trị thời gian; “lời ấy” được bổ sung theo ngữ cảnh, chỉ diễn từ vừa được nghe.
- source_word: ἐκ τῶν μαθητῶν αὐτοῦ
  choice: nhiều môn đồ của Ngài
  rationale: Diễn đạt gọn và tự nhiên, đồng thời cho thấy những người nói thuộc nhóm môn đồ rộng hơn của Chúa Giê-xu.
- source_word: Σκληρός
  choice: thật khó chấp nhận
  rationale: Trong ngữ cảnh, từ này không chỉ nói đến sự khó hiểu mà còn đến tính gay gắt, khó chịu đựng hoặc khó tiếp nhận; cách dịch này truyền đạt ý chính nhưng chú thích vẫn giữ các sắc thái khác.
- source_word: ὁ λόγος οὗτος
  choice: Lời này
  rationale: Giữ sự gần gũi với λόγος và có thể chỉ lời nói, lời dạy hoặc sứ điệp vừa được trình bày.
- source_word: τίς δύναται αὐτοῦ ἀκούειν
  choice: ai có thể nghe theo được
  rationale: “Nghe theo” phù hợp với ý tiếp nhận hoặc thuận phục trong ngữ cảnh, không giới hạn động từ vào khả năng nghe bằng tai; chú thích bảo tồn nghĩa rộng của ἀκούω.
theological_decisions:
- issue: Bản chất lời phản đối của các môn đồ
  choice: Lời của Chúa Giê-xu khó tiếp nhận, nhưng không xác định khó vì trí hiểu, vì tính gay gắt hay vì gây vấp phạm.
  alternative: Chỉ hiểu là khó hiểu về mặt trí tuệ, hoặc xác định hẳn là xúc phạm và không thể chịu nổi.
  rationale: σκληρός có thể bao hàm sự cứng, gay gắt, khắc nghiệt hoặc khó chấp nhận. Bản dịch và chú thích tránh thu hẹp sự căng thẳng vốn có.
- issue: Ý nghĩa của “nghe” trong câu hỏi
  choice: Dùng “nghe theo” để biểu đạt sự lắng nghe có tiếp nhận, đồng thời chú thích nghĩa đen rộng hơn.
  alternative: Dịch đơn thuần là “nghe được” hoặc diễn giải mạnh thành “chấp nhận”.
  rationale: ἀκούω có thể là nghe, lắng nghe hoặc vâng theo/tiếp nhận. “Nghe theo” phù hợp ngữ cảnh mà chưa đồng nhất hoàn toàn với việc tin nhận.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “môn đồ” để giữ thuật ngữ quen thuộc trong văn mạch Phúc Âm; đại từ “Ngài” thể hiện sự tôn kính mà không thêm cách giải thích giáo phái.
