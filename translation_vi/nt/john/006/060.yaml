    rationale: σκληρός có thể chỉ điều khó, khắc nghiệt/gay gắt, hoặc khó tiếp nhận. Cụm “khó chấp nhận” ưu tiên một cách hiểu và làm giảm sự mơ hồ ngữ nghĩa của nguyên văn.
  - severity: medium
