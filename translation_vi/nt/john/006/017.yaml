- from: Họ xuống thuyền và đang đi qua biển, hướng về Ca-phác-na-um.[a] Trời đã tối, mà Đức Giê-su vẫn chưa đến với họ.
  to: Họ lên thuyền và đang vượt qua biển để đến Ca-phác-na-um.[a] Trời đã tối, và Đức Giê-su vẫn chưa đến với họ.
  rationale: Bản sửa dùng “lên thuyền” để diễn đạt rõ hành động ἐμβάντες, dùng “đang vượt qua” để giữ phương diện chưa hoàn thành của ἤρχοντο, và dùng “để đến Ca-phác-na-um” để phản ánh đích điểm εἰς mà không ngụ ý đã đến nơi. Chú thích được thu gọn thành phương án trực tiếp cho πέραν τῆς θαλάσσης. Câu về bóng tối và việc Đức Giê-su chưa đến được giữ với sắc thái đã/vẫn chưa của các thì hoàn thành quá khứ.
