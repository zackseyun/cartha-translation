  text: καὶ ἐμβάντες ⸀εἰς πλοῖον ἤρχοντο πέραν τῆς θαλάσσης εἰς Καφαρναούμ. καὶ σκοτία ἤδη ἐγεγόνει καὶ ⸀οὔπω ἐληλύθει πρὸς αὐτοὺς ὁ Ἰησοῦς,
base_translation:
  language: en
  yaml_path: translation/nt/john/006/017.yaml
  text: They got into a boat and were heading across the sea to Capernaum[a]. And it had already become dark[c][b], and Jesus had not yet come to them.
translation:
  language: vi
  text: Họ lên thuyền và đang vượt qua biển để đến Ca-phác-na-um.[a] Trời đã tối, và Đức Giê-su vẫn chưa đến với họ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “sang bên kia biển.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμβάντες εἰς πλοῖον
  choice: Họ xuống thuyền
  rationale: Chuyển phân từ bất định sang động từ hữu hạn để câu tiếng Việt tự nhiên mà vẫn giữ hành động xảy ra trước diễn tiến chính. “Xuống thuyền” là cách nói thông dụng trong tiếng Việt khi bước vào thuyền.
- source_word: ἤρχοντο
  choice: đang đi
  rationale: Thể chưa hoàn thành diễn tả chuyển động đang tiếp diễn; “đang đi” bảo toàn phương diện này, thay vì hiểu là họ đã đến nơi.
- source_word: πέραν τῆς θαλάσσης εἰς Καφαρναούμ
  choice: đi qua biển, hướng về Ca-phác-na-um
  rationale: “Qua biển” giữ hình ảnh θάλασσα và ý chuyển sang phía bên kia; “hướng về” diễn đạt đích đến mà không hàm ý họ đã tới Ca-phác-na-um.
- source_word: σκοτία ἤδη ἐγεγόνει
  choice: Trời đã tối
  rationale: Cách nói tự nhiên trong tiếng Việt; “đã” chuyển tải trạng thái bóng tối đã hình thành trước thời điểm kể chuyện.
- source_word: οὔπω ἐληλύθει πρὸς αὐτοὺς
  choice: vẫn chưa đến với họ
  rationale: “Vẫn chưa” diễn đạt οὔπω trong bối cảnh trạng thái kéo dài tới thời điểm ấy; “đến với họ” bám sát πρὸς αὐτούς và không diễn giải thành “nhập đoàn”.
- source_word: ὁ Ἰησοῦς
  choice: Đức Giê-su
  rationale: Dạng tên gọi tiếng Việt hiện hành, trang trọng và dễ hiểu.
theological_decisions:
- issue: Phương diện kể chuyện và trình tự thời gian
  choice: Giữ việc họ đang trên đường vượt biển khi trời đã tối và Đức Giê-su vẫn chưa đến với họ.
  alternative: Dịch các động từ bằng quá khứ đơn, có thể làm mờ diễn tiến đang tiếp tục hoặc trạng thái đã hình thành.
  rationale: Cách dịch duy trì sức căng của trình thuật và phương diện động từ Hy Lạp, nhưng không thêm một kết luận thần học ngoài văn bản.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng “xuống thuyền” theo thành ngữ tiếng Việt; giữ “biển” thay vì đổi thành “hồ” để phản ánh θάλασσα. Dấu [a] được đặt ngay sau cụm từ liên quan.
