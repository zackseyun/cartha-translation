review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch truyền đạt đúng trình tự chung và các sắc thái thời gian chính: họ lên thuyền, đang di chuyển; trời đã tối; Đức Giê-su chưa đến với họ. Tuy nhiên, “hướng về Ca-phác-na-um” làm yếu đích điểm εἰς Καφαρναούμ (“đến Ca-phác-na-um”), và chú thích hiện tại thêm “về phía Ca-phác-na-um” không phải là một phương án tương đương của cụm Hy Lạp.'
  naturalness: “Lên thuyền” rõ nghĩa và tự nhiên hơn “xuống thuyền” trong tiếng Việt hiện đại khi diễn tả hành động lên/board a boat. “Đang vượt qua biển để đến...” diễn đạt tự nhiên chuyển động đang tiếp diễn và mục đích/đích đến. Liên từ “và” phù hợp với chuỗi tường thuật καὶ hơn “mà”, vốn có thể gợi sắc thái tương phản không được đánh dấu trong nguyên văn.
  terminology: Giữ “biển,” “Ca-phác-na-um,” và “Đức Giê-su” là nhất quán với văn phong trang trọng hiện đại và bám sát thuật ngữ/tên riêng của bản văn.
  issues:
  - severity: medium
    issue: “hướng về Ca-phác-na-um” giảm nhẹ lực của εἰς Καφαρναούμ.
    rationale: Giới từ εἰς đánh dấu đích đến (“đến/tới Ca-phác-na-um”), không chỉ một hướng di chuyển tổng quát. Dạng “để đến Ca-phác-na-um” vẫn không hàm ý họ đã tới nơi, đồng thời phản ánh đúng đích điểm.
  - severity: low
    issue: “xuống thuyền” có thể mơ hồ trong tiếng Việt hiện đại.
    rationale: Trong cách dùng thông thường, “lên thuyền” là cách rõ ràng hơn cho ἐμβάντες εἰς πλοῖον, tức bước lên/đi vào thuyền.
  - severity: low
    issue: Chú thích [a] không trình bày đúng phương án từ vựng của πέραν τῆς θαλάσσης.
    rationale: Phương án cần nêu là “sang bờ/bên kia biển”; việc thêm “về phía Ca-phác-na-um” không phải là nội dung của phương án thay thế này và làm chú thích kém chính xác.
  revised_text: Họ lên thuyền và đang vượt qua biển để đến Ca-phác-na-um.[a] Trời đã tối, và Đức Giê-su vẫn chưa đến với họ.
