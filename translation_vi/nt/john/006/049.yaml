source:
  edition: SBLGNT
  text: οἱ πατέρες ὑμῶν ἔφαγον ⸂ἐν τῇ ἐρήμῳ τὸ μάννα⸃ καὶ ἀπέθανον·
base_translation:
  language: en
  yaml_path: translation/nt/john/006/049.yaml
  text: Your fathers ate the manna in the wilderness[a], and they died.
translation:
  language: vi
  text: Tổ tiên các ông[a] đã ăn ma-na trong hoang mạc và đã chết.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “các cha ông các ông.” Tiếng Hy Lạp nghĩa đen là “các cha của các ông.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ πατέρες ὑμῶν
  choice: Tổ phụ các ông
  rationale: πατέρες theo nghĩa đen là “các cha”, nhưng ở đây chỉ thế hệ cha ông của những người nghe, cụ thể là thế hệ Israel trong hoang mạc. “Tổ phụ” giữ được sắc thái nam giới và ý nghĩa lịch sử của từ Hy Lạp, đồng thời tự nhiên, trang trọng trong tiếng Việt.
- source_word: ἔφαγον
  choice: đã ăn
  rationale: Động từ aorist của ἐσθίω chỉ hành động ăn đã xảy ra; “đã ăn” diễn đạt rõ và tự nhiên trong tiếng Việt.
- source_word: ἐν τῇ ἐρήμῳ
  choice: trong hoang mạc
  rationale: ἔρημος trong bối cảnh cuộc xuất hành chỉ vùng hoang vu nơi Israel lưu lạc. “Hoang mạc” giữ âm hưởng Kinh Thánh mà không nhất thiết thu hẹp nghĩa thành sa mạc toàn cát.
- source_word: τὸ μάννα
  choice: ma-na
  rationale: Danh từ chỉ thức ăn quen thuộc Thiên Chúa ban cho Israel trong hoang mạc. Tiếng Việt không cần biểu thị mạo từ xác định bằng một từ riêng trong câu này.
- source_word: καὶ ἀπέθανον
  choice: rồi họ đã chết
  rationale: καί nối sự kiện ăn ma-na với kết cục vẫn phải chết. “Rồi” thể hiện diễn tiến và sự tương phản ngầm trong ngữ cảnh; chủ ngữ “họ” làm câu tiếng Việt rõ ràng.
theological_decisions:
- issue: Cách gọi thế hệ Israel trong hoang mạc
  choice: Tổ phụ các ông
  alternative: Tổ tiên các ông
  rationale: “Tổ phụ” bảo toàn hình thức mang giới tính của πατέρες và sức nặng tu từ khi Đức Giê-su nói với những người nghe về cha ông họ, trong khi không thêm cách giải thích giáo phái.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “các ông” vì lời nói trực tiếp hướng đến một nhóm người nghe; “ma-na” theo cách phiên âm quen thuộc trong tiếng Việt. Không cần chú thích vì “tổ phụ” truyền đạt được cả nghĩa trực tiếp lẫn nghĩa tổ tiên trong văn cảnh.
