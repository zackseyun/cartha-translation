  verdict: revise
  source_fidelity: 'Bản thảo truyền đạt đúng mạch chính của câu: ý muốn của Cha, phạm vi phổ quát của πᾶς ὁ θεωρῶν, việc tin nơi Con, sự sống đời đời, và lời hứa Chúa Giê-su đích thân làm cho người ấy sống lại vào ngày cuối cùng. Tuy nhiên, “được sự sống đời đời” không phản ánh trực tiếp động từ ἔχῃ (“có”) và kém tự nhiên hơn trong tiếng Việt. Vị trí chú thích a cũng cần đặt ngay sau “Con”, là từ/cụm từ mà chú thích giải thích.'
  naturalness: “Con ấy” nghe gượng trong tiếng Việt hiện đại; “Người” vừa rõ quy chiếu vừa phù hợp văn phong trang trọng. Cấu trúc “hễ ai ... thì ...” tự nhiên, giữ được tính khái quát của các phân từ hiện tại có mạo từ. “Vào ngày cuối cùng” tự nhiên hơn “trong ngày cuối cùng” đối với thời điểm.
  terminology: Giữ “Cha”, “Con”, “sự sống đời đời”, và “ngày cuối cùng” là các thuật ngữ quen thuộc, phù hợp văn mạch Giăng. “Chính tôi” bảo tồn nhấn mạnh của ἐγώ mà không thêm diễn giải giáo lý.
