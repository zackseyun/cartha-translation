  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τοῦτο ⸀γάρ ἐστιν τὸ θέλημα τοῦ ⸂πατρός μου⸃ ἵνα πᾶς ὁ θεωρῶν τὸν υἱὸν καὶ πιστεύων εἰς αὐτὸν ἔχῃ ζωὴν αἰώνιον, καὶ ἀναστήσω αὐτὸν ⸀ἐγὼ τῇ ἐσχάτῃ ἡμέρᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/040.yaml
  text: 'For this is the will of my Father: that everyone who sees the Son and believes in him may have eternal life[b][a], and I myself will raise him up on the last day.'
translation:
  language: vi
  text: 'Vì đây là ý muốn của Cha tôi: hễ ai nhìn Con[a] và tin vào Người thì có sự sống đời đời, và chính tôi[b] sẽ làm cho người ấy sống lại vào ngày cuối cùng.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “chiêm ngưỡng Con và tin vào Người.” Động từ Hy Lạp có thể hàm ý nhìn một cách chăm chú, chứ không chỉ thấy bằng mắt.
    reason: lexical_alternative
  - marker: b
    text: 'Bản Hy Lạp nêu rõ đại từ “tôi” để nhấn mạnh: “chính tôi sẽ làm cho người ấy sống lại.”'
    reason: lexical_emphasis
lexical_decisions:
- source_word: τοῦτο γάρ ἐστιν
  choice: Vì ... là thế này
  rationale: Giữ chức năng giải thích của γάρ, nối câu này với lời trước, đồng thời dùng cấu trúc tiếng Việt tự nhiên để dẫn vào nội dung của ý muốn.
- source_word: τὸ θέλημα τοῦ πατρός μου
  choice: ý muốn của Cha tôi
  rationale: “Ý muốn” diễn đạt trực tiếp θέλημα; “Cha” được viết hoa vì trong ngữ cảnh đây là cách Chúa Giê-su gọi Đức Chúa Trời.
- source_word: πᾶς ὁ θεωρῶν τὸν υἱὸν
  choice: tất cả những ai nhìn thấy Con
  rationale: Giữ phạm vi phổ quát và cấu trúc chỉ hạng người của phân từ có mạo từ; “nhìn thấy” dễ hiểu, còn sắc thái chăm chú nhìn được ghi ở chú thích.
- source_word: καὶ πιστεύων εἰς αὐτὸν
  choice: và tin vào Con ấy
  rationale: πιστεύω εἰς diễn tả đức tin hướng về một đối tượng; lặp lại “Con ấy” giúp tiếng Việt rõ quy chiếu và trang trọng hơn đại từ viết hoa.
- source_word: ἔχῃ ζωὴν αἰώνιον
  choice: thì được sự sống đời đời
  rationale: “Được” diễn đạt tự nhiên nội dung của ἵνα với động từ giả định mà không biến câu thành lời diễn giải về cơ chế cứu rỗi; “sự sống đời đời” là cách gọi rõ và quen thuộc.
- source_word: καὶ ἀναστήσω αὐτὸν ἐγὼ
  choice: và chính tôi sẽ khiến người ấy sống lại
  rationale: “Chính tôi” bảo tồn sự nhấn mạnh của đại từ ἐγώ; “khiến ... sống lại” truyền đạt nghĩa phục sinh của ἀνίστημι rõ ràng trong tiếng Việt.
- source_word: τῇ ἐσχάτῃ ἡμέρᾳ
  choice: trong ngày cuối cùng
  rationale: Cách diễn đạt tự nhiên cho trạng ngữ thời gian, giữ nguyên hình ảnh cánh chung “ngày cuối cùng”.
theological_decisions:
- issue: Phạm vi và điều kiện trong πᾶς ὁ θεωρῶν ... καὶ πιστεύων
  choice: tất cả những ai nhìn thấy Con và tin vào Con ấy thì được sự sống đời đời
  alternative: bất cứ ai chiêm ngưỡng Con và tin vào Con ấy đều có sự sống đời đời
  rationale: Bản dịch giữ cách phát biểu phổ quát, mô tả những người nhìn thấy và tin, nhưng không áp đặt một hệ thống giáo lý về sự tuyển chọn hay ý chí tự do. “Thì được” phản ánh tự nhiên mệnh đề ἵνα với giả định.
- issue: Sự nhấn mạnh của ἐγώ
  choice: chính tôi sẽ khiến người ấy sống lại
  alternative: tôi sẽ khiến người ấy sống lại
  rationale: Từ “chính” giữ sự nhấn mạnh rõ ràng của đại từ ἐγώ, nêu bật tác nhân là Chúa Giê-su mà không thêm nội dung ngoài văn bản.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “Con” như tước hiệu trong văn mạch; tránh thuật ngữ hệ phái và giữ nguyên sức căng giữa ý muốn của Cha, việc nhìn thấy, tin và lời hứa phục sinh.
