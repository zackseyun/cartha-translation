    rationale: ἔχῃ có nghĩa cơ bản là “có”; “được sự sống” thêm sắc thái tiếp nhận và không tự nhiên bằng “có sự sống đời đời” trong cấu trúc tiếng Việt này.
  - severity: low
    issue: Chú thích a đang neo sau “sự sống đời đời” thay vì cụm “nhìn thấy Con”
    rationale: Chú thích giải thích θεωρῶν, nên cần gắn ngay sau “Con” để người đọc nhận biết đúng phạm vi của chú thích.
  - severity: low
    issue: “Con ấy” và “trong ngày cuối cùng”
    rationale: “Con ấy” không tự nhiên trong văn phong hiện đại; “Người” rõ quy chiếu hơn. “Vào ngày cuối cùng” là cách chỉ thời điểm thông dụng hơn.
