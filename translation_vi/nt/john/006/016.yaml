  text: Khi chiều đến, các môn đồ của Ngài đi xuống biển[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “xuống hồ.” Vùng nước này là Biển Ga-li-lê, xét về địa lý là một hồ, nhưng bản Hy Lạp dùng từ “biển” (θάλασσα).
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὡς δὲ
  choice: Khi
  rationale: Cụm từ mở đầu một chuyển tiếp về thời gian; “Khi” diễn đạt tự nhiên quan hệ thời gian trong tiếng Việt, còn sắc thái nối tiếp của δέ được ngữ cảnh đảm nhiệm.
- source_word: ὀψία ἐγένετο
  choice: chiều đến
  rationale: Đây là cách diễn đạt tự nhiên trong tiếng Việt cho thành ngữ chỉ lúc trời chuyển sang buổi chiều tối.
- source_word: κατέβησαν
  choice: đi xuống
  rationale: Giữ rõ ý chuyển động xuống thấp của καταβαίνω và phù hợp với góc nhìn trần thuật.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: các môn đồ của Ngài
  rationale: Diễn đạt trực tiếp quan hệ sở hữu; “môn đồ” là từ trang trọng nhưng quen thuộc trong văn cảnh Kinh Thánh, còn “Ngài” giữ cách xưng hô tôn kính dành cho Chúa Giê-su.
- source_word: ἐπὶ τὴν θάλασσαν
  choice: xuống biển
  rationale: Sau động từ chuyển động, ἐπί với đối cách chỉ hướng đến nơi chốn. “Biển” giữ nguyên nghĩa trực tiếp của θάλασσα, dù vùng nước này về địa lý là một hồ.
