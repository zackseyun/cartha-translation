id: JHN.6.57
reference: John 6:57
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καθὼς ἀπέστειλέν με ὁ ζῶν πατὴρ κἀγὼ ζῶ διὰ τὸν πατέρα, καὶ ὁ τρώγων με κἀκεῖνος ⸀ζήσει δι’ ἐμέ.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/057.yaml
  text: Just as the living Father sent me[a], and I live because of the Father[b], so also the one who feeds on me will live because of me.
translation:
  language: vi
  text: Như Cha hằng sống đã sai tôi và tôi sống nhờ Cha,[a] thì người ăn tôi cũng sẽ sống nhờ tôi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “tôi sống vì Cha” hoặc “tôi sống bởi Cha.” Giới từ Hy Lạp có thể chỉ căn nguyên hoặc phương tiện.'
    reason: alternative_reading
  - marker: b
    text: 'Động từ Hy Lạp được dùng ở đây là một từ cụ thể, gợi hành động ăn, thậm chí nhai. Cụm cuối cũng có thể dịch: “sẽ sống vì tôi” hoặc “sẽ sống bởi tôi.”'
    reason: lexical_and_alternative_reading
lexical_decisions:
- source_word: καθὼς
  choice: Như ... thì ... cũng
  rationale: Diễn đạt tự nhiên quan hệ so sánh chi phối toàn câu; “thì ... cũng” làm rõ vế tương ứng được hàm ý trong tiếng Hy Lạp.
- source_word: ὁ ζῶν πατὴρ
  choice: Cha hằng sống
  rationale: Giữ tính chất định ngữ của ζῶν và chủ đề sự sống trong Giăng, không diễn giải quá mức thành “Cha ban sự sống”.
- source_word: ἀπέστειλέν με
  choice: đã sai tôi
  rationale: Thể bất định được diễn đạt bằng hành động quá khứ đơn giản; “sai” tự nhiên và giữ mô-típ Đấng sai phái trong Giăng.
- source_word: κἀγὼ ζῶ
  choice: và tôi sống
  rationale: Giữ động từ ở thì hiện tại và sự song song với ζήσει, “sẽ sống”.
- source_word: διὰ τὸν πατέρα
  choice: nhờ Cha
  rationale: “Nhờ” trong tiếng Việt tự nhiên, có thể bao hàm căn nguyên hoặc phương tiện, nên không khép lại sự mơ hồ thật của διά với đối cách trong ngữ cảnh này.
- source_word: ὁ τρώγων με
  choice: người ăn tôi
  rationale: Dịch trực tiếp động từ cụ thể τρώγω, vốn gợi hành động ăn/nhai; không làm yếu hình ảnh và cũng không áp đặt riêng cách hiểu bí tích hay ẩn dụ.
- source_word: κἀκεῖνος
  choice: cũng
  rationale: Truyền đạt sắc thái nhấn mạnh “người ấy cũng” một cách gọn và tự nhiên trong cấu trúc so sánh tiếng Việt.
- source_word: ζήσει
  choice: sẽ sống
  rationale: Giữ nguyên ý tương lai và sự song song bằng lời với “tôi sống”.
- source_word: δι’ ἐμέ
  choice: nhờ tôi
  rationale: Dịch nhất quán với διὰ τὸν πατέρα để bảo tồn phép song song Cha–Con và Con–người ăn; “nhờ” vẫn để ngỏ sắc thái căn nguyên hay phương tiện.
theological_decisions:
- issue: Quan hệ sự sống của Đức Chúa Giê-su với Cha trong διὰ τὸν πατέρα
  choice: “tôi sống nhờ Cha”
  alternative: “tôi sống vì Cha” hoặc “tôi sống bởi Cha”
  rationale: “Nhờ Cha” bảo tồn ý lệ thuộc trong quan hệ được câu văn nêu ra mà không tự suy diễn về bản thể hay địa vị của Con; đồng thời không buộc διά chỉ mang nghĩa căn nguyên hoặc phương tiện.
- issue: Sắc thái bí tích hay ẩn dụ của ὁ τρώγων με
  choice: “người ăn tôi”
  alternative: “người nuôi mình bằng tôi” hoặc “người dự phần vào tôi”
  rationale: Bản dịch cụ thể giữ sức mạnh của động từ ăn, nhưng không giải quyết thay độc giả cuộc tranh luận giữa cách hiểu bí tích và cách hiểu rộng hơn về đức tin, sự kết hợp với Đấng Christ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Cha” theo cách gọi trực tiếp trong văn mạch Giăng. “Nhờ” là lựa chọn tự nhiên trong tiếng Việt, đồng thời giữ được độ mở ngữ nghĩa của διά. Các dấu chú thích [a], [b] đều xuất hiện trong chính văn.
