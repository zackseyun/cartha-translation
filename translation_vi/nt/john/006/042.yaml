source:
  edition: SBLGNT
  text: καὶ ἔλεγον· ⸀Οὐχ οὗτός ἐστιν Ἰησοῦς ὁ υἱὸς Ἰωσήφ, οὗ ἡμεῖς οἴδαμεν τὸν πατέρα καὶ τὴν μητέρα; πῶς ⸀νῦν ⸀λέγει ὅτι Ἐκ τοῦ οὐρανοῦ καταβέβηκα;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/042.yaml
  text: And they were saying, “Is this not Jesus, the son of Joseph, whose father and mother we know? How does he now say, ‘I have come down from heaven’?”
translation:
  language: vi
  text: 'Họ cứ nói: “Đây chẳng phải là Giê-xu, con trai của Giô-sép, người mà chúng ta biết cả cha lẫn mẹ sao? Sao bây giờ ông ấy nói: ‘Tôi đã từ trời xuống’?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγον
  choice: Họ cứ nói
  rationale: Thì chưa hoàn thành diễn tả lời bàn tán đang tiếp diễn hoặc lặp đi lặp lại; “cứ nói” truyền đạt rõ sắc thái ấy trong tiếng Việt tự nhiên.
- source_word: Οὐχ οὗτός ἐστιν
  choice: Đây chẳng phải là ... sao?
  rationale: Giữ hình thức câu hỏi phủ định, vốn chờ người nghe đồng ý, đồng thời tự nhiên trong tiếng Việt hiện đại.
- source_word: ὁ υἱὸς Ἰωσήφ
  choice: con của Giô-sép
  rationale: Dịch trực tiếp cấu trúc chỉ quan hệ, duy trì trọng tâm của đám đông về nguồn gốc gia đình mà họ cho là đã biết rõ.
- source_word: οὗ ἡμεῖς οἴδαμεν τὸν πατέρα καὶ τὴν μητέρα
  choice: người mà chúng ta biết cả cha lẫn mẹ
  rationale: Giữ mệnh đề quan hệ và đại từ nhấn mạnh ἡμεῖς qua “chúng ta”; “cả ... lẫn ...” diễn đạt tự nhiên việc họ tự nhận biết cả hai người.
- source_word: πῶς νῦν λέγει
  choice: Vậy sao bây giờ ông ấy lại nói
  rationale: “Sao” giữ nghĩa cơ bản của πῶς trong lời chất vấn; “bây giờ” tương ứng νῦν, còn “lại” biểu đạt tự nhiên sắc thái ngạc nhiên, phản bác mà không thêm ý bất khả năng.
- source_word: Ἐκ τοῦ οὐρανοῦ
  choice: từ trời
  rationale: Diễn đạt tự nhiên nguồn gốc bằng ἐκ; “trời” trong ngữ cảnh này chỉ cõi trời/heaven chứ không phải bầu trời khí tượng.
- source_word: καταβέβηκα
  choice: Tôi ... xuống
  rationale: Động từ hoàn thành chỉ hành động đi xuống đã xảy ra với hệ quả hiện tại. Tiếng Việt không đánh dấu thì hoàn thành như tiếng Hy Lạp; cấu trúc “từ trời xuống” vừa tự nhiên vừa giữ hướng chuyển động, không rút gọn thành chỉ “đến từ trời”.
theological_decisions:
- issue: Lời tuyên bố về nguồn gốc từ trời của Đức Giê-xu
  choice: Giữ nguyên lời trực tiếp “Tôi từ trời xuống”
  alternative: “Tôi đến từ trời” hoặc diễn giải lời này theo nghĩa ẩn dụ
  rationale: Bản Hy Lạp nói rõ chuyển động đi xuống từ trời. Bản dịch không làm nhẹ tuyên bố ấy, cũng không giải thích thêm bản thể hay cơ chế của sự giáng xuống, nhờ đó giữ nguyên căng thẳng thần học trong lời phản đối của đám đông.
- issue: Cách gọi cha mẹ mà đám đông cho là mình biết
  choice: “cha lẫn mẹ” không thêm tên hay lời giải thích
  alternative: Giải thích Giô-sép là cha nuôi hoặc bổ sung tên Ma-ri
  rationale: Câu này trình bày nhận thức và lập luận của đám đông. Việc thêm “cha nuôi” hay tên người mẹ sẽ đưa thông tin ngoài câu vào và có thể âm thầm giải quyết căng thẳng mà tác giả đang để nguyên.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “ông ấy” trong lời đám đông để phản ánh cách họ nhìn Đức Giê-xu như một người quen thuộc, không tự ý thêm tước hiệu tôn kính. Tên riêng được phiên âm theo lối quen dùng trong Kinh Thánh tiếng Việt.
