id: JHN.6.15
reference: John 6:15
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἰησοῦς οὖν γνοὺς ὅτι μέλλουσιν ἔρχεσθαι καὶ ἁρπάζειν αὐτὸν ἵνα ⸀ποιήσωσιν βασιλέα ἀνεχώρησεν ⸀πάλιν εἰς τὸ ὄρος αὐτὸς μόνος.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/015.yaml
  text: So Jesus[a], knowing that they were about to come and seize him in order to make him king, withdrew again to the mountain by himself.
translation:
  language: vi
  text: Vì thế, Chúa Giê-su, biết rằng họ sắp đến bắt Ngài để tôn Ngài làm vua, lại lui lên núi một mình.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “đến bắt Ngài đi để tôn Ngài làm vua.”'
    reason: Nêu cách diễn đạt tự nhiên khác cho ἁρπάζειν, vẫn giữ sắc thái cưỡng bức của hành động bắt giữ và mục đích tôn Ngài làm vua.
lexical_decisions:
- source_word: οὖν
  choice: Vì vậy
  rationale: Giữ chức năng nối kết và suy diễn trong mạch kể, liên hệ phản ứng của Đức Chúa Jêsus với sự việc ngay trước đó.
- source_word: γνοὺς
  choice: biết rằng
  rationale: Diễn đạt tự nhiên phân từ chỉ hoàn cảnh và nguyên do dẫn đến hành động lui đi của Đức Chúa Jêsus.
- source_word: μέλλουσιν ἔρχεσθαι
  choice: họ sắp đến
  rationale: Thể hiện tính cận kề của hành động mà μέλλω với động từ nguyên mẫu thường diễn tả.
- source_word: ἁρπάζειν
  choice: bắt lấy
  rationale: Giữ sắc thái cưỡng ép của động từ, không làm nhẹ thành một lời mời hay sự tôn lập tự nguyện.
- source_word: ἵνα ποιήσωσιν βασιλέα
  choice: để ép Ngài làm vua
  rationale: Diễn đạt mục đích của đám đông; từ “ép” làm rõ sắc thái cưỡng bức vốn nằm trong ἁρπάζειν khi kết hợp với mục đích này.
- source_word: ἀνεχώρησεν
  choice: lui
  rationale: Phù hợp với hành động rút khỏi tình thế và di chuyển lên núi, đồng thời tự nhiên trong văn kể trang trọng.
- source_word: πάλιν
  choice: lại
  rationale: Giữ ý lặp lại của trạng từ mà không thêm diễn giải.
- source_word: εἰς τὸ ὄρος
  choice: lên núi
  rationale: Tiếng Việt tự nhiên dùng “lên” khi đi đến núi; vẫn không xác định quá mức địa hình hay một ngọn núi cụ thể.
- source_word: αὐτὸς μόνος
  choice: một mình
  rationale: Diễn đạt tự nhiên sự nhấn mạnh rằng Ngài ở riêng, không tạo lối nói dư thừa trong tiếng Việt.
theological_decisions:
- issue: Tính chất của ý định tôn Đức Chúa Jêsus làm vua
  choice: 'Diễn đạt đây là hành động cưỡng ép: “bắt lấy Ngài để ép Ngài làm vua”.'
  alternative: “đưa Ngài đi để lập làm vua” hoặc “đến tôn Ngài làm vua”
  rationale: ἁρπάζειν hàm ý chiếm lấy bằng sức mạnh hoặc đột ngột. Bản dịch không làm dịu ý định chính trị cưỡng ép của đám đông, cũng không biến cảnh này thành một lễ tôn vương được Đức Chúa Jêsus chấp thuận.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Jêsus/Ngài” theo lối xưng gọi kính trọng phổ biến trong tiếng Việt Cơ Đốc; câu giữ mạch nhân quả của nguyên văn và tránh giải thích thêm động cơ của đám đông.
