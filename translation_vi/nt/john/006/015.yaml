revisions:
- from: Vì vậy, Đức Chúa Jêsus biết rằng họ sắp đến bắt lấy Ngài để ép Ngài làm vua,[a] nên Ngài lại lui lên núi một mình.
  to: Vì thế, Chúa Giê-su, biết rằng họ sắp đến bắt Ngài để tôn Ngài làm vua, lại lui lên núi một mình.[a]
  rationale: Bản sửa loại bỏ tước hiệu được thêm vào, dùng tên Giê-su theo chính tả tiếng Việt hiện đại, và để sắc thái cưỡng bức nằm ở “bắt” như ἁρπάζειν. Câu vẫn thể hiện tính cận kề của μέλλουσιν, mục đích của ἵνα, ý lặp lại của πάλιν, hướng đi lên núi, và sự ở riêng được nhấn mạnh bởi αὐτὸς μόνος. Chú thích được chỉnh để không diễn giải việc tôn làm vua là hành vi ép buộc tách biệt với hành động bắt giữ.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T06:19:49Z'
review_pass:
  verdict: revise
  source_fidelity: 'Cần sửa để tránh thêm tước hiệu không có trong nguyên văn: Ἰησοῦς là “Chúa Giê-su” (hoặc “Giê-su” theo quy ước bản dịch), không phải “Đức Chúa Jêsus.” “Bắt” truyền đạt đầy đủ sắc thái cưỡng bức của ἁρπάζειν; việc thêm “ép Ngài làm vua” chuyển sắc thái cưỡng bức từ hành động bắt giữ sang chính hành vi lập vua, vượt quá điều câu Hy Lạp nói rõ. Bản sửa giữ mục đích ἵνα ποιήσωσιν βασιλέα là “tôn Ngài làm vua.”'
  naturalness: “Vì vậy ... nên ...” tạo liên kết kép, nặng câu. Đưa cụm phân từ “biết rằng” vào giữa câu và dùng một liên từ “Vì thế” tạo văn phong hiện đại, trang trọng, tự nhiên. “Lui lên núi một mình” rõ và phù hợp ngữ cảnh.
  terminology: Dùng chính tả hiện đại phổ biến “Giê-su.” “Chúa” là lối xưng hô kính trọng trong bản dịch Cơ Đốc tiếng Việt; không thêm “Đức Chúa,” vốn vừa cổ hơn vừa thêm nội dung “Lord” vào tên riêng của nguyên văn. “Tôn Ngài làm vua” là cách nói tự nhiên cho ποιεῖν βασιλέα.
  issues:
  - severity: medium
    issue: “Đức Chúa Jêsus” thêm tước hiệu và dùng chính tả tên riêng không phải dạng hiện đại chuẩn.
    rationale: Nguyên văn chỉ nêu Ἰησοῦς, không có κύριος hay θεός. “Đức Chúa” làm bản dịch thêm một tước hiệu; “Giê-su” phù hợp tiếng Việt hiện đại hơn “Jêsus.”
  - severity: medium
    issue: “để ép Ngài làm vua” diễn giải quá mức quan hệ ngữ nghĩa.
    rationale: ἁρπάζειν nhấn mạnh việc họ sẽ đến bắt/giành lấy Ngài bằng sức mạnh; ἵνα ποιήσωσιν βασιλέα nêu mục đích tôn/làm Ngài thành vua. Bản dịch không nên khẳng định riêng rằng việc làm vua trái ý Ngài bằng động từ “ép.”
  - severity: low
    issue: Cấu trúc “Vì vậy ... nên ...” lặp chức năng liên kết.
    rationale: οὖν chỉ cần được phản ánh một lần; cấu trúc sửa câu vẫn giữ liên kết mạch kể và hoàn cảnh của phân từ γνούς.
  revised_text: Vì thế, Chúa Giê-su, biết rằng họ sắp đến bắt Ngài để tôn Ngài làm vua, lại lui lên núi một mình.[a]
