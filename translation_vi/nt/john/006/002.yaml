  text: ⸂ἠκολούθει δὲ⸃ αὐτῷ ὄχλος πολύς, ὅτι ⸀ἐθεώρουν τὰ σημεῖα ἃ ἐποίει ἐπὶ τῶν ἀσθενούντων.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/002.yaml
  text: And a large crowd was following him[a], because they were seeing the signs that he was doing on those who were sick.
translation:
  language: vi
  text: Một đám đông lớn đi theo Ngài, vì họ thấy những dấu lạ[a] Ngài làm cho những người đau yếu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “phép lạ” hoặc “dấu hiệu kỳ diệu”; từ mà Giăng dùng nhấn mạnh điều những việc này bày tỏ về Chúa Giê-su.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠκολούθει
  choice: đi theo
  rationale: Thì vị hoàn diễn tả hành động đang tiếp diễn trong quá khứ; trong mạch kể tiếng Việt, “đi theo” tự nhiên và vẫn truyền đạt diễn tiến ấy.
- source_word: δὲ
  choice: không dịch thành một liên từ riêng
  rationale: δέ ở đây chỉ là từ nối nhẹ để tiếp tục câu chuyện; tiếng Việt không cần thêm “và” hay “nhưng” ở đầu câu.
- source_word: ὄχλος πολύς
  choice: một đoàn dân đông
  rationale: Diễn đạt tự nhiên một đám đông có số lượng lớn, đồng thời giữ sắc thái kể chuyện trang trọng.
- source_word: ἐθεώρουν
  choice: vẫn thấy
  rationale: Thì vị hoàn gợi sự quan sát lặp lại hoặc kéo dài; “vẫn thấy” thể hiện tính tiếp diễn mà không tạo câu tiếng Việt gượng gạo.
- source_word: σημεῖα
  choice: những dấu lạ
  rationale: “Dấu lạ” giữ ý nghĩa các việc quyền năng vừa kỳ diệu vừa chỉ đến và bày tỏ căn tính của Chúa Giê-su, thay vì chỉ nhấn mạnh yếu tố siêu nhiên.
- source_word: ἐποίει
  choice: Ngài làm
  rationale: Cách nói ngắn gọn, tự nhiên; trong văn cảnh cùng với “vẫn thấy”, hoạt động đang diễn ra và lặp lại đã được thể hiện đầy đủ.
- source_word: ἐπὶ τῶν ἀσθενούντων
  choice: cho những người đau yếu
  rationale: ἐπί với sở hữu cách ở đây chỉ những người mà các dấu lạ được thực hiện liên quan đến họ; “cho” diễn đạt tự nhiên quan hệ ấy trong tiếng Việt mà không khẳng định quá mức cách thức tác động.
- source_word: ἀσθενούντων
  choice: những người đau yếu
  rationale: Trong văn cảnh, phân từ này nói đến những người mắc bệnh hoặc suy yếu về thể chất; “đau yếu” rõ nghĩa và phù hợp văn phong.
theological_decisions:
- issue: Thuật ngữ σημεῖα trong Tin Mừng Giăng
  choice: dấu lạ
  alternative: phép lạ; dấu hiệu kỳ diệu
  rationale: Trong Giăng, σημεῖα không chỉ nói đến một phép màu mà còn nhấn mạnh điều việc ấy bày tỏ về Chúa Giê-su. “Dấu lạ” bảo tồn cả tính kỳ diệu lẫn chức năng mặc khải.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “Ngài” để quy chiếu Chúa Giê-su theo văn phong Kinh Thánh phổ thông; cấu trúc câu được làm tự nhiên trong tiếng Việt nhưng vẫn giữ sắc thái hành động tiếp diễn của các động từ vị hoàn Hy Lạp.
