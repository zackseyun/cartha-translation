revisions:
- from: Một đoàn dân đông đi theo Ngài, vì họ vẫn thấy những dấu lạ[a] Ngài làm cho những người đau yếu.
  to: Một đám đông lớn đi theo Ngài, vì họ thấy những dấu lạ[a] Ngài làm cho những người đau yếu.
  rationale: Thay “một đoàn dân đông” bằng “một đám đông lớn” cho tự nhiên và sát nghĩa hơn. Bỏ “vẫn” để không thêm sắc thái tiếp diễn đối lập không có trong tiếng Hy Lạp; trong văn kể tiếng Việt, “họ thấy” có thể diễn đạt sự quan sát kéo dài/lặp lại mà không gượng ép. Giữ “dấu lạ” cho σημεῖα và “làm cho những người đau yếu” để bảo toàn quan hệ rộng của ἐπὶ τῶν ἀσθενούντων.
