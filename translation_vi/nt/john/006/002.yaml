  source_fidelity: 'Bản dịch phản ánh đúng các thành tố chính: đám đông đông đảo theo Chúa Giê-su, lý do là họ quan sát các σημεῖα, và các dấu lạ ấy được thực hiện liên hệ đến người đau yếu. Tuy nhiên, “vẫn thấy” thêm sắc thái ‘vẫn/còn’ không có trong vị hoàn ἐθεώρουν. Vị hoàn biểu thị sự quan sát đang diễn ra hoặc lặp lại, chứ không tự nó xác nhận sự tiếp tục trái với một tình trạng trước đó.'
