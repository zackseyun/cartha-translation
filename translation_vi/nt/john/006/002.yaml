  - severity: low
    issue: “Một đoàn dân đông” không tự nhiên trong tiếng Việt hiện đại.
    rationale: Cụm này có vẻ cổ hoặc khẩu ngữ vùng miền; “một đám đông lớn” diễn đạt trực tiếp ὄχλος πολύς và phù hợp hơn với bản dịch tiếng Việt chuẩn hiện đại.
  - severity: low
