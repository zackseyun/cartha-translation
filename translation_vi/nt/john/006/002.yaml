  terminology: “Dấu lạ” là lựa chọn tốt cho σημεῖα trong Giăng, vừa giữ tính nhất quán thuật ngữ vừa không thu hẹp nghĩa thành chỉ ‘phép lạ’. “Ngài” và “Chúa Giê-su” trong chú thích phù hợp văn phong Kinh Thánh trang trọng. Chú thích cần thêm “mà” trong cụm “từ mà Giăng dùng” để câu tiếng Việt chuẩn xác hơn.
