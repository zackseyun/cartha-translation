  text: εἶπεν οὖν ὁ Ἰησοῦς τοῖς δώδεκα· Μὴ καὶ ὑμεῖς θέλετε ὑπάγειν;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/067.yaml
  text: So Jesus said to the Twelve[a], “You do not want to go away too, do you?”
translation:
  language: vi
  text: 'Vậy, Đức Giê-su nói với Nhóm Mười Hai: “Chẳng lẽ các anh cũng muốn bỏ đi sao?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Các anh cũng muốn bỏ đi sao?” Câu hỏi Hy Lạp mở đầu bằng μή thường cho thấy người hỏi trông đợi một câu trả lời phủ định.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Vì thế
  rationale: Nối câu hỏi của Đức Chúa Jêsus với việc nhiều môn đồ vừa rời bỏ Ngài, giữ sắc thái tiếp nối và suy luận của mạch văn.
- source_word: τοῖς δώδεκα
  choice: Nhóm Mười Hai
  rationale: Giữ đây là danh xưng đã được xác lập cho nhóm môn đồ thân cận, thay vì diễn giải thêm là “mười hai môn đồ”.
- source_word: Μὴ καὶ ὑμεῖς
  choice: Chẳng lẽ các con cũng ... sao?
  rationale: Cấu trúc câu hỏi với μή thường hướng đến câu trả lời phủ định; “chẳng lẽ ... sao?” truyền đạt kỳ vọng ấy tự nhiên trong tiếng Việt, còn “cũng” thể hiện καί trong tương quan với những người vừa bỏ đi.
- source_word: θέλετε
  choice: muốn
  rationale: Diễn đạt trực tiếp ý muốn hoặc sự sẵn lòng bằng từ ngữ hiện đại, thông dụng.
- source_word: ὑπάγειν
  choice: bỏ đi
  rationale: Giữ ý chuyển động rời xa trong bối cảnh các môn đồ đang rút lui; cách nói này tự nhiên hơn “đi khỏi” và chưa xác định quá mức bản chất của việc rời bỏ.
theological_decisions:
- issue: Sắc thái câu hỏi của Đức Chúa Jêsus được mở đầu bằng μή
  choice: Dùng câu hỏi “Chẳng lẽ ... sao?” để cho thấy người hỏi hướng đến câu trả lời phủ định nhưng không biến điều đó thành lời khẳng định tuyệt đối.
  alternative: “Các con cũng muốn bỏ đi sao?” là một câu hỏi trung tính hơn.
  rationale: μή trong loại câu hỏi này thường báo hiệu sự trông đợi câu trả lời “không”. Bản dịch giữ sắc thái diễn ngôn ấy mà không loại bỏ khả năng lựa chọn thực sự hàm chứa trong câu hỏi.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Đức Chúa Jêsus” theo lối gọi Tin Lành Việt ngữ quen thuộc; “các con” thể hiện lời Đức Chúa Jêsus nói trực tiếp với nhóm môn đồ mà không quá suồng sã. Dấu [a] được đặt ngay sau câu hỏi mà chú thích giải thích.
