id: JHN.6.33
reference: John 6:33
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ γὰρ ἄρτος τοῦ θεοῦ ἐστιν ὁ καταβαίνων ἐκ τοῦ οὐρανοῦ καὶ ζωὴν διδοὺς τῷ κόσμῳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/033.yaml
  text: For the bread of God is the one who comes down from heaven and gives life to the world[a].
translation:
  language: vi
  text: Vì bánh của Đức Chúa Trời là Đấng từ trời xuống và ban sự sống cho thế gian.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Vì bánh của Đức Chúa Trời là thứ từ trời xuống và ban sự sống cho thế gian.” Cách diễn đạt Hy Lạp có thể được hiểu theo nghĩa ít mang tính ngôi vị hơn, nhưng các phân từ giống đực thiên về một chủ thể có ngôi vị.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἄρτος
  choice: bánh
  rationale: Giữ hình ảnh cụ thể của nguyên văn và mạch ẩn dụ xuyên suốt diễn từ; trong tiếng Việt, “bánh” tự nhiên hơn “ổ bánh” tại đây.
- source_word: τοῦ θεοῦ
  choice: của Đức Chúa Trời
  rationale: Giữ cấu trúc sở hữu/nguồn gốc rộng của thuộc cách, không thu hẹp thành riêng nghĩa “từ Đức Chúa Trời” hay “do Đức Chúa Trời ban”.
- source_word: ὁ καταβαίνων
  choice: Đấng từ trời xuống
  rationale: Mạo từ cùng phân từ giống đực số ít thiên về một chủ thể có ngôi vị; “Đấng” diễn đạt tự nhiên và trang trọng trong tiếng Việt, đồng thời hướng tới lời tự nhận của Chúa Giê-su trong ngữ cảnh.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: từ trời
  rationale: Cách diễn đạt tiếng Việt tự nhiên, giữ ý nguồn gốc được biểu thị bởi ἐκ với thuộc cách.
- source_word: ζωὴν
  choice: sự sống
  rationale: Giữ thuật ngữ trọng yếu trong Tin Mừng Giăng và sắc thái đầy đặn hơn “cuộc sống” trong ngữ cảnh này.
- source_word: διδοὺς
  choice: ban
  rationale: “Ban” là cách diễn đạt tự nhiên, trang trọng cho hành động trao sự sống, và phù hợp với hành động đặc trưng được phân từ hiện tại mô tả.
- source_word: τῷ κόσμῳ
  choice: cho thế gian
  rationale: Giữ bề rộng và sự căng thẳng thần học của κόσμος trong Giăng, không thu hẹp thành “nhân loại” hay “mọi người”.
- source_word: γὰρ
  choice: Vì
  rationale: Diễn đạt quan hệ giải thích/làm căn cứ cho lời ngay trước đó.
theological_decisions:
- issue: Chủ thể có ngôi vị hay cách hiểu phi ngôi vị trong ὁ καταβαίνων ... καὶ ζωὴν διδοὺς
  choice: 'Dùng ngôn ngữ có ngôi vị: “Đấng từ trời xuống và ban sự sống cho thế gian.”'
  alternative: “thứ từ trời xuống và ban sự sống cho thế gian” hoặc “bánh từ trời xuống và ban sự sống cho thế gian”
  rationale: Các phân từ có mạo từ ở giống đực số ít thiên về một chủ thể có ngôi vị và, trong ngữ cảnh Giăng 6, báo trước việc Chúa Giê-su tự nhận là bánh từ trời. Chú thích vẫn ghi nhận khả năng hiểu phi ngôi vị do cấu trúc vị ngữ và hình ảnh “bánh”.
- issue: Phạm vi của κόσμος
  choice: Giữ “thế gian”.
  alternative: “nhân loại” hoặc “mọi người”
  rationale: “Thế gian” bảo toàn thuật ngữ đặc trưng của Giăng và không giải quyết thay cho bản văn những tranh luận về phạm vi hay cách áp dụng sự sống được ban.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Trời” và “Đấng” theo lối diễn đạt Kinh Thánh tiếng Việt quen thuộc; giữ “thế gian” và “sự sống” để bảo toàn vốn từ thần học đặc trưng của Tin Mừng Giăng.
