  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng câu hỏi cân nhắc của Τί ποιῶμεν và giữ được tính mơ hồ của sở hữu cách τοῦ θεοῦ. Tuy nhiên, “để thực hiện những công việc” làm mờ sự lặp lại có chủ ý giữa ἐργαζώμεθα và ἔργα; nguyên văn dùng cùng một trường từ vựng là “làm/công việc.” “Vậy” diễn đạt οὖν vừa phải hơn “Vì vậy,” vốn có thể nhấn mạnh quan hệ suy luận mạnh hơn cần thiết.
  naturalness: “Vậy, họ hỏi Ngài” và “Chúng tôi phải làm gì để làm những việc...” là tiếng Việt hiện đại, rõ ràng và trang trọng vừa phải. Sự lặp lại “làm ... việc” có chủ ý theo nguyên văn và vẫn tự nhiên trong một câu hỏi như thế này.
  terminology: Giữ “Ngài” cho Đức Chúa Giê-xu và “Đức Chúa Trời” cho θεός, phù hợp với đăng ký của bản nháp. “Những việc của Đức Chúa Trời” giữ mở sở hữu cách, không quyết định đó là việc Ngài đòi hỏi, việc thuộc về Ngài, hay việc Ngài làm.
