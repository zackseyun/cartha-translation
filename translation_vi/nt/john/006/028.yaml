  yaml_path: translation/nt/john/006/028.yaml
  text: Then they said to him[a], “What must we do so that we may work the works of God?”
translation:
  language: vi
  text: 'Vậy, họ hỏi Ngài: “Chúng tôi phải làm gì để làm những việc của Đức Chúa Trời?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Chúng tôi nên làm gì để làm những việc của Đức Chúa Trời?” Cụm Hy Lạp “những việc của Đức Chúa Trời” cũng có thể được hiểu là “những việc Đức Chúa Trời đòi hỏi.”'
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπον οὖν πρὸς αὐτόν
  choice: Vì vậy, họ hỏi Ngài
  rationale: οὖν nối câu hỏi này với lời Đức Chúa Giê-xu vừa phán và mang sắc thái suy luận; “vì vậy” giữ được liên hệ ấy. εἶπον πρὸς αὐτόν theo nghĩa đen là “họ nói với Ngài”, nhưng vì lời trực tiếp là một câu hỏi, “họ hỏi Ngài” tự nhiên và chính xác trong tiếng Việt.
- source_word: Τί ποιῶμεν
  choice: Chúng tôi phải làm gì
  rationale: Câu hỏi với động từ giả định ποιῶμεν có tính cân nhắc về hành động cần thực hiện; “phải làm gì” diễn đạt rõ lực nghĩa ấy mà không thêm nội dung.
- source_word: ἵνα ἐργαζώμεθα
  choice: để thực hiện
  rationale: ἵνα nêu mục đích, còn ἐργάζομαι có nghĩa làm, thực hiện hoặc hoàn thành. “Để thực hiện” là cách nói tự nhiên, tránh cụm tiếng Việt gượng “làm các công việc” nhưng vẫn duy trì liên hệ ý nghĩa với ἔργα.
- source_word: τὰ ἔργα
  choice: những công việc
  rationale: Danh từ số nhiều xác định chỉ các việc làm hoặc công việc. “Những công việc” phù hợp với văn cảnh người nghe đang hỏi họ cần thực hiện điều gì.
- source_word: τοῦ θεοῦ
  choice: của Đức Chúa Trời
  rationale: Giữ nguyên cấu trúc sở hữu của nguyên văn, không quyết định rằng đây là những việc Đức Chúa Trời đòi hỏi, những việc thuộc về Ngài hay những việc Ngài làm.
theological_decisions:
- issue: Ý nghĩa của sở hữu cách trong τὰ ἔργα τοῦ θεοῦ
  choice: Giữ cách diễn đạt “những công việc của Đức Chúa Trời” trong chính văn.
  alternative: “những việc Đức Chúa Trời đòi hỏi” hoặc “những công việc Đức Chúa Trời làm”
  rationale: Sở hữu cách Hy Lạp có nhiều khả năng giải thích, và câu 29 tiếp tục khai triển cách nói này. Chính văn không nên âm thầm chọn một cách hiểu thần học duy nhất.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Ngài” cho đại từ chỉ Đức Chúa Giê-xu và “Đức Chúa Trời” cho θεός. Cấu trúc chính văn ưu tiên sự tự nhiên nhưng vẫn giữ nguyên nét mơ hồ thần học của sở hữu cách.
