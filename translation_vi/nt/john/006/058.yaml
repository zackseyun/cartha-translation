  terminology: “Bánh,” “các tổ phụ,” và “sống đời đời” đều nhất quán với văn phong Kinh Thánh Việt ngữ và chính xác trong ngữ cảnh. Cách dùng “ăn” là trung tính, không đưa thêm diễn giải bí tích. Chú thích giải thích hợp lý cách diễn đạt εἰς τὸν αἰῶνα.
