id: JHN.6.58
reference: John 6:58
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οὗτός ἐστιν ὁ ἄρτος ὁ ⸀ἐξ οὐρανοῦ καταβάς, οὐ καθὼς ἔφαγον οἱ ⸀πατέρες καὶ ἀπέθανον· ὁ τρώγων τοῦτον τὸν ἄρτον ⸀ζήσει εἰς τὸν αἰῶνα.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/058.yaml
  text: This is the bread that came down from heaven[a], not as the fathers ate and died[b]; the one who eats this bread will live forever.
translation:
  language: vi
  text: Đây là bánh từ trời xuống, không như các tổ phụ đã ăn rồi chết; người ăn bánh này sẽ sống đời đời.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát nghĩa: “sẽ sống cho đến muôn đời.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτός ἐστιν ὁ ἄρτος
  choice: Đây là bánh
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt, đồng thời giữ đại từ chỉ định và xác định bánh đang được nói đến trong văn mạch.
- source_word: ὁ ἐξ οὐρανοῦ καταβάς
  choice: từ trời xuống
  rationale: Mệnh đề rút gọn tự nhiên trong tiếng Việt, giữ nguyên ý xuất phát từ trời và hành động đi xuống của phân từ aorist.
- source_word: οὐ καθὼς
  choice: không như
  rationale: Giữ trực tiếp ý so sánh của cụm Hy Lạp.
- source_word: ἔφαγον οἱ πατέρες καὶ ἀπέθανον
  choice: các tổ phụ đã ăn rồi chết
  rationale: “Các tổ phụ” chỉ những bậc cha ông của Israel trong hoang mạc; “đã ăn rồi chết” diễn đạt tự nhiên chuỗi hai động từ aorist mà không thêm quan hệ nhân quả.
- source_word: ὁ τρώγων τοῦτον τὸν ἄρτον
  choice: người ăn bánh này
  rationale: Diễn đạt gọn, tự nhiên cho phân từ hiện tại được danh từ hóa; “ăn” giữ nghĩa từ vựng trung tính, không áp đặt cách hiểu bí tích hay ẩn dụ.
- source_word: ζήσει εἰς τὸν αἰῶνα
  choice: sẽ sống đời đời
  rationale: Thành ngữ tiếng Việt tương đương tự nhiên với cách nói Johannine “sẽ sống cho đến muôn đời,” chỉ sự sống bền vững không cùng.
theological_decisions:
- issue: Đối tượng của οἱ πατέρες trong phép so sánh về bánh
  choice: các tổ phụ
  alternative: tổ tiên; cha ông
  rationale: Cụm Hy Lạp ở giống đực số nhiều và trong văn mạch ám chỉ các bậc tiền nhân của Israel đã ăn ma-na. “Các tổ phụ” giữ sắc thái Kinh Thánh mà không mở rộng đối tượng quá mức.
- issue: Sắc thái của τρώγων trong diễn từ về bánh sự sống
  choice: người ăn
  alternative: người nhai; người dùng bánh; ai ăn
  rationale: “Ăn” truyền đạt nghĩa từ vựng rõ ràng và giữ nguyên sự căng thẳng thần học trong văn bản, không tự ý quyết định giữa cách hiểu bí tích và cách hiểu ẩn dụ về đức tin.
- issue: Ý nghĩa của εἰς τὸν αἰῶνα
  choice: đời đời
  alternative: đến muôn đời; cho đến đời sau
  rationale: “Đời đời” là cách nói tự nhiên về sự sống không chấm dứt; không thu hẹp αἰών thành riêng một thời đại tương lai.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “các tổ phụ” để giữ liên hệ với những bậc tiền nhân Israel trong câu chuyện ma-na; không thêm cách giải thích mang tính hệ phái.
