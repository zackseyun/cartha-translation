  source_fidelity: 'Bản dịch truyền đạt đầy đủ cấu trúc và ý chính của tiếng Hy Lạp: bánh “từ trời xuống,” sự đối chiếu với các tổ phụ đã ăn và đã chết, cùng lời hứa rằng người ăn bánh này sẽ sống đời đời. “Các tổ phụ” giữ được số nhiều giống đực của οἱ πατέρες và phù hợp với ám chỉ về ma-na trong văn mạch. “Người ăn” phản ánh phân từ hiện tại có tính khái quát mà không áp đặt cách hiểu thần học.'
