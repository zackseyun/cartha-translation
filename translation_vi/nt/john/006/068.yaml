  to: 'Si-môn Phi-e-rơ đáp lời Ngài[a]: “Lạy Chúa, chúng con sẽ đi đến với ai? Chúa có những lời của sự sống đời đời.”'
  rationale: Đổi “đi theo ai” thành “đi đến với ai” để phản ánh πρός với động từ chỉ sự đi, không thêm ý theo làm môn đồ. Đổi “lời ban sự sống đời đời” thành “lời của sự sống đời đời” để giữ cấu trúc sở hữu cách và độ mở nghĩa của nguyên văn. Các yếu tố còn lại được giữ vì vừa sát nguồn vừa phù hợp tiếng Việt tiêu chuẩn hiện đại.
