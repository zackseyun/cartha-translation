source:
  edition: SBLGNT
  text: ⸀ἀπεκρίθη αὐτῷ Σίμων Πέτρος· Κύριε, πρὸς τίνα ἀπελευσόμεθα; ῥήματα ζωῆς αἰωνίου ἔχεις,
base_translation:
  language: en
  yaml_path: translation/nt/john/006/068.yaml
  text: Simon Peter answered him[a], “Lord, to whom will we go? You have words of eternal life,”
translation:
  language: vi
  text: 'Si-môn Phi-e-rơ đáp lời Ngài[a]: “Lạy Chúa, chúng con sẽ đi đến với ai? Chúa có những lời của sự sống đời đời.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Lạy Chúa” cũng có thể được hiểu là “Thưa Thầy” hoặc là một lời xưng hô kính trọng. Từ Hy Lạp κύριος có thể mang các sắc thái ấy, nhưng “Chúa” phù hợp với cách dùng trong sách Giăng tại đây.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθη αὐτῷ
  choice: đáp lời Ngài
  rationale: Diễn đạt tự nhiên động từ đáp lời cùng đại từ chỉ Đức Chúa Giê-su; “Ngài” giữ sắc thái tôn kính trong văn phong Kinh Thánh hiện đại.
- source_word: Σίμων Πέτρος
  choice: Si-môn Phi-e-rơ
  rationale: Dùng dạng phiên âm quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
- source_word: Κύριε
  choice: Lạy Chúa
  rationale: Hô cách được diễn đạt tự nhiên bằng “Lạy”; “Chúa” bảo toàn cả ý xưng hô tôn kính lẫn sức nặng Kitô học có thể có trong văn mạch Giăng.
- source_word: πρὸς τίνα ἀπελευσόμεθα
  choice: chúng con sẽ đi theo ai
  rationale: πρός với động từ chỉ sự đi đến có nghĩa đen là “đi đến với ai”; trong ngữ cảnh các môn đồ có rời bỏ Đức Chúa Giê-su hay không, “đi theo ai” truyền đạt tự nhiên lực hướng về và gắn bó với một người.
- source_word: ῥήματα
  choice: những lời
  rationale: Giữ hình thức số nhiều và nhấn mạnh những lời được nói ra.
- source_word: ζωῆς αἰωνίου
  choice: ban sự sống đời đời
  rationale: Cụm sở hữu cách có thể chỉ những lời thuộc về, đem lại, hoặc truyền đạt sự sống đời đời. “Ban” diễn đạt quan hệ hiệu quả phù hợp văn mạch nhưng cần ghi nhận rằng nguyên văn chỉ nói sát là “những lời của sự sống đời đời”.
- source_word: ἔχεις
  choice: Chúa có
  rationale: Dịch trực tiếp động từ chỉ sự sở hữu, đồng thời lặp lại danh xưng để câu tiếng Việt rõ và trang trọng.
theological_decisions:
- issue: Sức nghĩa của Κύριε khi Phi-e-rơ thưa với Đức Chúa Giê-su
  choice: Lạy Chúa
  alternative: Thưa Thầy / Lạy Chủ
  rationale: “Chúa” là cách dịch mặc định và phù hợp cách dùng trong sách Giăng, bảo toàn cả lời xưng hô tôn kính lẫn âm hưởng Kitô học mà không định nghĩa quá mức danh xưng tại đây.
- issue: Quan hệ của sở hữu cách ζωῆς αἰωνίου với ῥήματα
  choice: những lời ban sự sống đời đời
  alternative: những lời của sự sống đời đời
  rationale: Cách dịch chính tự nhiên và phù hợp chủ đề những lời đem lại sự sống trong Giăng; chú thích bảo lưu cấu trúc và độ mở của nguyên văn Hy Lạp.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “chúng con” phù hợp lời môn đồ thưa với Đức Chúa Giê-su. Câu hỏi tu từ được giữ nguyên. Dấu phẩy cuối câu của lớp tham khảo tiếng Anh được chuẩn hóa thành dấu chấm vì câu trích dẫn kết thúc tại câu 68.
