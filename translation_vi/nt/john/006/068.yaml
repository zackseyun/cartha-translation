  source_fidelity: Bản dịch giữ đúng chủ thể, lời xưng hô Κύριε và số nhiều của ῥήματα. Tuy nhiên, “đi theo ai” đổi động từ ἀπελευσόμεθα (“đi/đi đến với”) thành ý “theo” một người; còn “những lời ban sự sống đời đời” thu hẹp sở hữu cách ζωῆς αἰωνίου thành quan hệ tác hiệu mà nguyên văn không nêu rõ.
  naturalness: Văn phong trang trọng, rõ ràng và tự nhiên. “Chúng con sẽ đi đến với ai?” vẫn tự nhiên trong lời thưa kính trọng và phản ánh chính xác hướng đích của πρὸς τίνα.
  terminology: “Si-môn Phi-e-rơ,” “Lạy Chúa,” “Ngài,” và “sự sống đời đời” phù hợp cách dùng Kinh Thánh tiếng Việt hiện đại. Chú thích về “Chúa/Thầy” bảo lưu sắc thái xưng hô của κύριος mà không áp đặt một cách hiểu thần học.
  issues:
  - severity: medium
    issue: “đi theo ai” cho πρὸς τίνα ἀπελευσόμεθα
    rationale: ἀπέρχομαι với πρός diễn tả đi đến/hướng đến một người. “Đi theo” thêm ý làm môn đồ hoặc theo sau, không được động từ Hy Lạp biểu thị.
  - severity: medium
    issue: “những lời ban sự sống đời đời” cho ῥήματα ζωῆς αἰωνίου
    rationale: Nguyên văn nói sát là “những lời của sự sống đời đời.” Sở hữu cách này có thể gợi nhiều quan hệ trong ngữ cảnh, nhưng “ban” xác định riêng quan hệ tác hiệu và thêm một ý không có trong câu.
