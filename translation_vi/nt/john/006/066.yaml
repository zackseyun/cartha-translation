  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἐκ τούτου πολλοὶ ⸀ἐκ ⸂τῶν μαθητῶν αὐτοῦ ἀπῆλθον⸃ εἰς τὰ ὀπίσω καὶ οὐκέτι μετ’ αὐτοῦ περιεπάτουν.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/066.yaml
  text: From this time many of his disciples went back and no longer walked with him[a].
translation:
  language: vi
  text: Từ lúc ấy, nhiều người trong số các môn đồ của Ngài đã rút lui và không còn đi cùng Ngài nữa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Vì điều này, nhiều môn đồ của Ngài đã bỏ đi”; cụm Hy Lạp mở đầu có thể được hiểu theo nghĩa nguyên nhân, dù trong văn cảnh, “Từ lúc ấy” thể hiện rõ hơn ý về một bước ngoặt.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐκ τούτου
  choice: Từ lúc ấy
  rationale: Trong văn cảnh, cụm này chủ yếu đánh dấu thời điểm bước ngoặt sau lời dạy khó nghe của Đức Chúa Jêsus, đồng thời vẫn có thể hàm ý nguyên nhân.
- source_word: πολλοὶ ἐκ τῶν μαθητῶν αὐτοῦ
  choice: nhiều người trong số các môn đồ của Ngài
  rationale: 'Cách dịch này giữ rõ sắc thái phân chia của ἐκ: những người rời đi thuộc một bộ phận trong nhóm môn đồ rộng hơn.'
- source_word: ἀπῆλθον εἰς τὰ ὀπίσω
  choice: đã quay lui
  rationale: Hai thành tố kết hợp diễn tả việc rút lui, quay trở lại phía sau, chứ không chỉ đơn thuần rời khỏi một nơi.
- source_word: οὐκέτι
  choice: không còn... nữa
  rationale: Diễn tả sự chấm dứt kể từ thời điểm ấy bằng lối nói tự nhiên trong tiếng Việt.
- source_word: μετ’ αὐτοῦ περιεπάτουν
  choice: đi cùng Ngài
  rationale: Giữ hình ảnh 'đi' của περιπατέω và ý đồng hành với Đức Chúa Jêsus, không thu hẹp nghĩa thành một kết luận thần học như chỉ 'tin' hay 'vâng phục'.
theological_decisions:
- issue: Danh từ μαθηταί có nên được diễn giải là Nhóm Mười Hai hoặc chỉ những người thật sự tin hay không
  choice: các môn đồ
  alternative: những người theo Ngài
  rationale: Nguyên văn gọi họ là môn đồ nhưng không đồng nhất họ với Nhóm Mười Hai, cũng không trực tiếp phán quyết tình trạng đức tin sâu xa của họ. Cách dịch giữ nguyên sự căng thẳng của trình thuật.
- issue: Ἐκ τούτου mang nghĩa thời gian hay nguyên nhân
  choice: Từ lúc ấy
  alternative: Vì điều đó
  rationale: Mạch văn nhấn mạnh một bước ngoặt từ thời điểm ấy; chú thích bảo tồn khả năng hiểu theo nghĩa nguyên nhân thay vì loại bỏ nó.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “môn đồ” để giữ thuật ngữ của trình thuật; “quay lui” vừa tự nhiên vừa bảo tồn hình ảnh rút về phía sau. Đại từ “Ngài” duy trì văn phong Kinh Thánh trang trọng.
