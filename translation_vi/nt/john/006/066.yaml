  to: Từ lúc ấy, nhiều người trong số các môn đồ của Ngài đã rút lui và không còn đi cùng Ngài nữa.[a]
  rationale: Chỉ thay “đã quay lui” bằng “đã rút lui” để có tiếng Việt hiện đại, tự nhiên hơn trong khi vẫn phản ánh sự rút khỏi/đi lùi lại của ἀπῆλθον εἰς τὰ ὀπίσω. Chú thích được chỉnh rất nhẹ từ “Vì điều đó” thành “Vì điều này” để lối nói tiếng Việt tự nhiên hơn; vẫn bảo tồn cách hiểu nhân quả đang được tranh luận của Ἐκ τούτου.
