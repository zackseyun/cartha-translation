  source_fidelity: Bản dịch nhận đúng giá trị thời gian theo văn cảnh của Ἐκ τούτου, tính bộ phận của ἐκ τῶν μαθητῶν αὐτοῦ, và sự chấm dứt kéo dài do οὐκέτι diễn tả. Tuy nhiên, “đã quay lui” không phải là cách kết hợp tự nhiên trong tiếng Việt hiện đại. “Đã rút lui” diễn đạt rõ hành động rời bỏ/quay khỏi nhóm của ἀπῆλθον εἰς τὰ ὀπίσω mà không thêm một kết luận thần học.
  naturalness: Câu nhìn chung trang trọng và dễ hiểu, nhưng “quay lui” hơi gượng. “Rút lui” là lối nói hiện đại, tự nhiên, và phù hợp với sắc thái rút khỏi sự đồng hành đang được thuật lại. Giữ “đi cùng Ngài” để bảo tồn hình ảnh περιπατέω thay vì diễn giải thành “theo Ngài.”
