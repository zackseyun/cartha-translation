source:
  edition: SBLGNT
  text: Ἐμάχοντο οὖν πρὸς ἀλλήλους οἱ Ἰουδαῖοι λέγοντες· Πῶς δύναται οὗτος ἡμῖν δοῦναι τὴν σάρκα ⸀αὐτοῦ φαγεῖν;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/052.yaml
  text: So the Jews were arguing among themselves[a], saying[b], “How can this man give us his flesh to eat?”
translation:
  language: vi
  text: 'Vậy, người Do Thái tranh cãi với nhau[a], nói rằng: “Làm sao người này có thể cho chúng ta thịt mình[b] để ăn?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “người Giu-đê” hoặc, theo ngữ cảnh, “các nhà lãnh đạo Do Thái.” Tiếng Hy Lạp chỉ ghi đơn giản là “người Do Thái.”
    reason: alternative_reading
  - marker: b
    text: Cũng có thể dịch là “thân thể của ông ấy.” Từ Hy Lạp σάρξ nghĩa là “thịt”; cách dịch này được giữ để bảo toàn lối nói cụ thể và sức căng của phân đoạn.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐμάχοντο
  choice: tranh luận
  rationale: Thể chưa hoàn thành diễn tả cuộc tranh cãi đang tiếp diễn. “Tranh luận” truyền đạt sự xung đột bằng lời mà không hàm ý đánh nhau bằng thể chất.
- source_word: οὖν
  choice: Vì vậy
  rationale: Giữ sắc thái nối kết và hệ quả từ lời Đức Giê-su vừa nói, đồng thời tự nhiên trong văn kể chuyện tiếng Việt.
- source_word: πρὸς ἀλλήλους
  choice: với nhau
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt cho hành động tranh luận qua lại trong cùng một nhóm.
- source_word: οἱ Ἰουδαῖοι
  choice: những người Do Thái
  rationale: Dịch trực tiếp danh xưng trong tiếng Hy Lạp, không tự ý thu hẹp thành giới lãnh đạo Do Thái hay người Giu-đê; các khả năng theo ngữ cảnh được ghi ở chú thích.
- source_word: λέγοντες
  choice: rằng
  rationale: Phân từ dẫn vào nội dung lời nói; “rằng” liên kết tự nhiên nội dung câu hỏi với cuộc tranh luận.
- source_word: Πῶς δύναται
  choice: Làm sao ... có thể
  rationale: Diễn đạt tự nhiên câu hỏi về khả năng thực hiện hành động.
- source_word: οὗτος
  choice: người này
  rationale: Giữ sắc thái chỉ định và phần nào xa cách của đại từ Hy Lạp, rõ hơn nếu chỉ dùng “ông ấy”.
- source_word: ἡμῖν
  choice: cho chúng ta
  rationale: Thể hiện vai trò tân ngữ gián tiếp của động từ “cho” theo cú pháp tự nhiên của tiếng Việt.
- source_word: δοῦναι
  choice: cho
  rationale: Giữ nghĩa cơ bản của δίδωμι, không thêm sắc thái giải thích.
- source_word: τὴν σάρκα αὐτοῦ
  choice: thịt của mình
  rationale: “Thịt” giữ hình ảnh cụ thể của σάρξ và sức căng trong lời phản ứng của những người nghe; đại từ phản thân “mình” quy chiếu tự nhiên về chủ thể “người này”.
- source_word: φαγεῖν
  choice: để ăn
  rationale: Diễn đạt tự nhiên động từ nguyên mẫu chỉ hành động mà phần thịt được trao cho họ thực hiện.
theological_decisions:
- issue: Cách dịch σάρξ trong ngữ cảnh có sức căng thần học
  choice: thịt
  alternative: thân thể
  rationale: “Thịt” phản ánh trực tiếp σάρξ và giữ nguyên tính cụ thể, gây vấp của lời nói trong ngữ cảnh, không diễn giải trước câu này theo một lập trường bí tích hay hoàn toàn tượng trưng.
- issue: Phạm vi chỉ định của οἱ Ἰουδαῖοι trong sách Giăng
  choice: những người Do Thái
  alternative: những người Giu-đê; các nhà lãnh đạo Do Thái
  rationale: Bản văn Hy Lạp không tự giới hạn đối tượng trong câu này. Bản dịch chính giữ cách gọi trực tiếp, còn chú thích nêu các khả năng theo ngữ cảnh để tránh âm thầm giải quyết vấn đề còn có thể tranh luận.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. Câu hỏi giữ giọng hoài nghi và khoảng cách của người nói qua cụm “người này”; không thêm lời giải thích thần học vào chính văn.
