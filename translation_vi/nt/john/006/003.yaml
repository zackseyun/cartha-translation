revisions:
- from: Rồi Đức Chúa Jêsus đi lên núi và ngồi tại đó với các môn đồ mình.
  to: Sau đó, Giê-su lên núi và ngồi ở đó với các môn đệ của mình.
  rationale: Bản sửa loại bỏ tước hiệu không có trong nguyên văn, dùng tên riêng theo chính tả Việt hiện đại, và thay cụm sở hữu không tự nhiên bằng “các môn đệ của mình”. “Sau đó” phản ánh chức năng nối tiếp tường thuật của δέ; “lên núi”, “ngồi ở đó”, và “với” lần lượt giữ nghĩa của ἀνῆλθεν, ἐκεῖ ἐκάθητο, và μετὰ.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T06:19:31Z'
review_pass:
  verdict: revise
  source_fidelity: Bản nháp thêm tước hiệu “Đức Chúa” dù nguyên văn chỉ có tên Ἰησοῦς; đây là sự bổ sung không có trong câu nguồn. Các thành phần còn lại truyền đạt đúng diễn tiến, chuyển động đi lên, địa điểm, và sự hiện diện cùng các môn đệ.
  naturalness: “Rồi” và “ngồi tại đó” đều hiểu được, nhưng “các môn đồ mình” không tự nhiên trong tiếng Việt chuẩn hiện đại. “Các môn đệ của mình” là cách diễn đạt tự nhiên, rõ quy chiếu hơn. Dạng chính tả “Giê-su” phù hợp hơn với tiếng Việt hiện đại phổ thông.
  terminology: Giữ “môn đệ” cho μαθηταί trong ngữ cảnh Phúc Âm. Không thêm “Chúa” hoặc “Đức” vào tên riêng khi nguyên văn câu này không có tước hiệu ấy.
  issues:
  - severity: high
    issue: “Đức Chúa Jêsus” thêm tước hiệu không hiện diện trong nguyên văn.
    rationale: SBLGNT chỉ viết Ἰησοῦς (“Giê-su”); việc thêm “Đức Chúa” làm thay đổi mức độ tường thuật và vượt quá dữ liệu của câu nguồn.
  - severity: medium
    issue: “các môn đồ mình” không phải cách dùng tự nhiên của tiếng Việt hiện đại.
    rationale: Cụm này thiếu từ chỉ sở hữu rõ ràng; “các môn đệ của mình” vừa tự nhiên vừa phản ánh αὐτοῦ.
  - severity: low
    issue: Chính tả “Jêsus” mang sắc thái bản dịch truyền thống hơn là chuẩn hiện đại phổ thông.
    rationale: “Giê-su” là dạng hiện hành, dễ đọc trong tiếng Việt hiện đại.
  revised_text: Sau đó, Giê-su lên núi và ngồi ở đó với các môn đệ của mình.
