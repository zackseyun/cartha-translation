  text: ἀνῆλθεν δὲ εἰς τὸ ⸀ὄρος Ἰησοῦς, καὶ ἐκεῖ ἐκάθητο μετὰ τῶν μαθητῶν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/003.yaml
  text: Then Jesus went up on the mountain, and there he sat with his disciples.
translation:
  language: vi
  text: Sau đó, Giê-su lên núi và ngồi ở đó với các môn đệ của mình.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνῆλθεν
  choice: đi lên
  rationale: Động từ ἀνέρχομαι trong chuyển động tường thuật mang nghĩa thông thường là “đi lên”; cách dịch này tự nhiên và không gợi sắc thái thăng thiên.
- source_word: δὲ
  choice: Rồi
  rationale: δέ ở đây nối tiếp diễn tiến câu chuyện, không biểu thị sự tương phản mạnh; “Rồi” chuyển tải mạch kể tự nhiên.
- source_word: εἰς τὸ ὄρος
  choice: lên núi
  rationale: Trong kết hợp với ἀνῆλθεν, cụm này chỉ việc đi lên vùng núi hoặc sườn núi. Tiếng Việt tự nhiên dùng “lên núi”; mạo từ Hy Lạp không nhất thiết đòi hỏi phải dịch thành “ngọn núi ấy” khi địa điểm chưa được định danh.
- source_word: Ἰησοῦς
  choice: Đức Chúa Jêsus
  rationale: Dùng dạng tên gọi trang trọng, quen thuộc trong truyền thống Kinh Thánh tiếng Việt, đồng thời vẫn dễ hiểu với độc giả hiện đại.
- source_word: ἐκεῖ
  choice: tại đó
  rationale: Trạng từ chỉ nơi chốn được chuyển thành “tại đó”, vừa rõ nghĩa vừa phù hợp văn phong trang trọng.
- source_word: ἐκάθητο
  choice: ngồi
  rationale: Dạng chưa hoàn thành của κάθημαι mô tả tư thế hoặc hành động đang diễn ra. Trong câu kể tiếng Việt, “ngồi” diễn đạt tự nhiên mà không cần thêm “đang”.
- source_word: μετὰ τῶν μαθητῶν αὐτοῦ
  choice: với các môn đồ mình
  rationale: μετά với sở hữu cách có nghĩa là “với”. “Môn đồ” giữ được quan hệ thầy–trò và người đi theo đặc trưng của μαθητής; “mình” quy chiếu tự nhiên về Đức Chúa Jêsus.
theological_decisions: []
