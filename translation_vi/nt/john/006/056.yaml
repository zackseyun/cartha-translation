  text: ὁ τρώγων μου τὴν σάρκα καὶ πίνων μου τὸ αἷμα ἐν ἐμοὶ μένει κἀγὼ ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/056.yaml
  text: The one who eats my flesh and drinks my blood remains in me[b][a], and I in him.
translation:
  language: vi
  text: Ai ăn thịt tôi và uống máu tôi[a] thì ở lại trong tôi, và tôi cũng ở lại trong người ấy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “ăn nhai” hoặc “ăn lấy”; động từ Hy Lạp ở đây sinh động hơn động từ thông thường chỉ việc ăn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ τρώγων
  choice: Ai ăn
  rationale: Mạo từ đi với phân từ hiện tại tạo thành cụm chỉ người được đặc trưng bởi hành động này. “Ai ăn” tự nhiên trong tiếng Việt, có nghĩa khái quát mà không làm mất tính tiếp diễn theo ngữ cảnh.
- source_word: τρώγων
  choice: ăn
  rationale: τρώγω có sắc thái sinh động hơn động từ ăn thông thường, đôi khi gợi ý nhai hoặc ăn ngấu nghiến; tuy nhiên “ăn” là cách diễn đạt rõ ràng, tự nhiên và không diễn giải quá mức trong câu này.
- source_word: μου τὴν σάρκα
  choice: thịt tôi
  rationale: σάρξ ở đây chỉ thịt cách cụ thể trong hình ảnh gây ấn tượng mạnh của diễn từ. “Thịt tôi” là cách nói tự nhiên hơn “xác thịt tôi” trong tiếng Việt mà vẫn giữ nguyên hình ảnh cụ thể.
- source_word: καὶ πίνων μου τὸ αἷμα
  choice: và uống huyết tôi
  rationale: Giữ cách diễn đạt trực tiếp và song song với hành động ăn. “Huyết” có sắc thái trang trọng, phù hợp văn phong Kinh Thánh và vẫn giữ nguyên hình ảnh về máu, không giải nghĩa theo một truyền thống thần học.
- source_word: ἐν ἐμοὶ μένει
  choice: ở trong tôi
  rationale: μένω là động từ quan trọng trong Gioan, mang nghĩa ở lại, lưu lại hoặc duy trì. Trong kết cấu tương hỗ này, “ở trong tôi” vừa tự nhiên vừa diễn đạt sự gắn bó bền vững mà không biến câu thành một công thức thần học về sự hiệp nhất.
- source_word: κἀγὼ ἐν αὐτῷ
  choice: và tôi ở trong người ấy
  rationale: Bản Hy Lạp lược động từ ở vế thứ hai. Tiếng Việt tự nhiên cần lặp lại “ở” để biểu đạt rõ quan hệ song song; cách này làm sáng tỏ phép tỉnh lược nhưng không thêm ý mới.
- source_word: αὐτῷ
  choice: người ấy
  rationale: Đại từ giống đực số ít quy chiếu về người thực hiện hành động. Tiếng Việt không bắt buộc đánh dấu giới tính ở đây; “người ấy” giữ số ít và quy chiếu rõ ràng mà không thu hẹp đối tượng thành nam giới.
theological_decisions:
- issue: Cách hiểu mang tính Tiệc Thánh/bí tích hay ẩn dụ về việc ăn thịt và uống huyết
  choice: Giữ nguyên ngôn ngữ cụ thể “ăn thịt tôi và uống huyết tôi”, không thêm lời giải thích.
  alternative: Diễn giải rõ theo Tiệc Thánh, hoặc thay hình ảnh bằng cách nói về đức tin.
  rationale: Câu Hy Lạp nêu hình ảnh cụ thể nhưng không tự giải quyết mọi tranh luận thần học quanh hình ảnh ấy. Bản dịch không áp đặt một cách hiểu hệ phái.
- issue: Ngôn ngữ về sự ở trong nhau trong Gioan
  choice: Dịch μένει là “ở trong” trong kết cấu “ở trong tôi”.
  alternative: “ở lại trong tôi”, “lưu lại trong tôi” hoặc diễn giải là “hiệp nhất với tôi”.
  rationale: “Ở trong” giữ được quan hệ tương hỗ của hai vế, tự nhiên trong tiếng Việt và tránh thu hẹp ý nghĩa thành một công thức thần học về sự hiệp nhất.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “thịt” thay vì “xác thịt” để giữ hình ảnh cụ thể mà tự nhiên; dùng “huyết” để duy trì sắc thái trang trọng trong lời của Chúa Giê-su. Đại từ “tôi” theo lối diễn đạt trực tiếp, phổ thông; “người ấy” giữ quy chiếu số ít.
