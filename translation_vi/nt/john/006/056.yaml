  verdict: revise
  source_fidelity: Bản nháp giữ đúng hình ảnh cụ thể của σάρξ và αἷμα, cũng như cấu trúc tương hỗ của câu. Tuy nhiên, dịch μένει là “ở trong” làm mất nét nghĩa tiếp diễn/bền vững của động từ μένω. Vế δεύτερη được tỉnh lược động từ trong tiếng Hy Lạp, nhưng việc cung cấp “ở lại” trong tiếng Việt là chính đáng để duy trì sự song song và ý nghĩa của μένει.
  naturalness: “Ở lại trong” là cách diễn đạt tự nhiên, rõ ràng trong tiếng Việt hiện đại đối với ngôn ngữ tương thuộc của Gioan. “Máu” tự nhiên hơn “huyết” trong tiếng Việt tiêu chuẩn hiện đại, vẫn giữ nguyên tính cụ thể và sắc thái gây sốc của nguyên văn. “Người ấy” giữ quy chiếu số ít mà không áp đặt giới tính.
  terminology: Giữ “thịt” cho σάρξ và “máu” cho αἷμα; không diễn giải theo bí tích hay ẩn dụ. Dịch μένω nhất quán là “ở lại”. Chú thích ghi nhận sắc thái sinh động hơn của τρώγω mà không ép nghĩa “nhai” vào bản văn chính.
