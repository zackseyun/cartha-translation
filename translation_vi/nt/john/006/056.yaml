  - severity: low
    issue: “huyết” kém tự nhiên hơn “máu” cho tiếng Việt tiêu chuẩn hiện đại
    rationale: “Huyết” vẫn có thể dùng trong văn phong Kinh Thánh, nhưng “máu” là từ thông dụng, hiện đại hơn và vẫn dịch sát αἷμα, không làm suy giảm tính cụ thể của hình ảnh.
  - severity: low
