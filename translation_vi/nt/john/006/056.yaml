    rationale: Bản văn chính dùng “ăn” là lựa chọn tự nhiên và an toàn, nhưng τρώγω có thể sinh động hơn động từ ăn thông thường. Một chú thích ngắn bảo tồn thông tin từ vựng mà không diễn giải quá mức.
