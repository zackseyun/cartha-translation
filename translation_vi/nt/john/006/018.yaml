  text: ἥ τε θάλασσα ἀνέμου μεγάλου πνέοντος ⸀διεγείρετο.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/018.yaml
  text: And the sea was being stirred up because a strong wind was blowing[a].
translation:
  language: vi
  text: Biển động mạnh vì một cơn gió lớn đang thổi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Biển đang bị khuấy động” hoặc “biển nổi sóng.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἥ τε θάλασσα
  choice: Biển
  rationale: θάλασσα là danh từ chung chỉ biển; dù ngữ cảnh nói đến Biển Ga-li-lê, bản dịch không chuyển thành địa danh riêng. τε có tính nối nhẹ và được thể hiện tự nhiên qua mạch câu tiếng Việt, không cần dịch thành một từ riêng.
- source_word: ἀνέμου μεγάλου
  choice: một cơn gió lớn
  rationale: ἄνεμος là “gió”; μέγας diễn tả cường độ lớn. “Một cơn gió lớn” vừa tự nhiên trong tiếng Việt vừa không đẩy nghĩa xa đến mức “gió dữ” hay “bão tố”.
- source_word: πνέοντος
  choice: đang thổi
  rationale: Phân từ hiện tại chủ động diễn tả hành động đang tiếp diễn của gió. Cấu trúc “vì ... đang thổi” truyền đạt tự nhiên quan hệ hoàn cảnh/nguyên nhân trong câu.
- source_word: διεγείρετο
  choice: động mạnh
  rationale: Động từ ở thì chưa hoàn thành, thể bị động, diễn tả biển đang bị khuấy động liên tục. “Động mạnh” là cách nói tự nhiên về mặt biển trong tiếng Việt; mức độ mạnh cũng phù hợp với cơn gió lớn, trong khi chú thích giữ các khả năng diễn đạt sát hình thái bị động hơn.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Câu ngắn gọn, giữ tiến trình đang diễn ra qua “đang thổi”; “biển động mạnh” là thành ngữ tự nhiên trong tiếng Việt, còn chú thích bảo lưu các sắc thái khác của διεγείρετο.
