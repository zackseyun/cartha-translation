  source_fidelity: 'Bản dịch truyền đạt đúng ἀλλ’ εἶπον ὑμῖν ὅτι: “Nhưng tôi đã nói với các ông rằng”. “Các ông quả thật đã thấy tôi” phản ánh hợp lý sắc thái nhấn mạnh có thể có của καὶ ἑωράκατέ με và thì hoàn thành của ἑωράκατέ. “Vậy mà vẫn không tin” diễn đạt tự nhiên tình trạng không tin hiện tại (οὐ πιστεύετε) cùng sự tương phản tu từ của hai mệnh đề, mà không thêm đối tượng cho động từ “tin”.'
  naturalness: Câu tiếng Việt hiện đại, rõ ràng và có nhịp điệu tự nhiên. Cặp xưng hô “tôi / các ông” phù hợp văn phong trang trọng, hiện đại của lời đối thoại công khai. “Vậy mà vẫn” nêu bật nghịch lý của câu mà không làm câu trở nên nặng nề.
