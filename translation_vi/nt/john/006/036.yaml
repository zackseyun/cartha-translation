id: JHN.6.36
reference: John 6:36
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀλλ’ εἶπον ὑμῖν ὅτι καὶ ἑωράκατέ με καὶ οὐ πιστεύετε.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/036.yaml
  text: But I told you that you have even seen me[a], and yet you do not believe.
translation:
  language: vi
  text: Nhưng tôi đã nói với các ông rằng các ông quả thật đã thấy tôi, vậy mà vẫn không tin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch sát cấu trúc hơn: “Nhưng tôi đã nói với các ông rằng các ông quả thật đã thấy tôi và không tin.”'
    reason: Giữ lại khả năng hiểu hai mệnh đề như được nối đơn thuần bằng καί, thay vì biểu thị rõ sắc thái tương phản trong câu chính.
lexical_decisions:
- source_word: ἀλλ’
  choice: Nhưng
  rationale: Diễn đạt trực tiếp sự tương phản với lời trước đó bằng liên từ đối lập tự nhiên trong tiếng Việt.
- source_word: εἶπον ὑμῖν
  choice: tôi đã nói với các ông
  rationale: Thể bất định chỉ lời đã nói trước đó; “với các ông” giữ rõ tân ngữ gián tiếp số nhiều mà không dùng lối xưng hô cổ.
- source_word: ὅτι
  choice: rằng
  rationale: Giới thiệu nội dung lời Đức Giê-su đã nói.
- source_word: καὶ ἑωράκατέ με
  choice: các ông quả thật đã thấy tôi
  rationale: “Quả thật” thể hiện sắc thái nhấn mạnh có thể có của καί; “đã thấy” truyền đạt hành động đã xảy ra và còn liên hệ đến tình trạng hiện tại.
- source_word: καὶ οὐ πιστεύετε
  choice: vậy mà vẫn không tin
  rationale: 'Diễn đạt tự nhiên sự phối hợp mang tính tương phản: dù đã thấy, họ hiện vẫn không tin; “tin” là từ tương đương trực tiếp, quen thuộc của πιστεύω trong văn mạch Gio-an.'
theological_decisions:
- issue: Sắc thái của καί thứ nhất trong καὶ ἑωράκατέ με
  choice: quả thật đã thấy tôi
  alternative: cũng đã thấy tôi; đã thấy tôi
  rationale: καί có thể mang nghĩa bổ sung hoặc nhấn mạnh. “Quả thật” giữ được sức nhấn của câu mà không biến nó thành một mệnh đề nhượng bộ rõ hơn nguyên văn.
- issue: Quan hệ giữa hai mệnh đề có καί
  choice: vậy mà vẫn không tin
  alternative: và không tin
  rationale: “Vậy mà” làm rõ sự tương phản tu từ vốn tự nhiên trong văn cảnh, còn “vẫn” phản ánh tình trạng không tin đang tiếp diễn. Chú thích giữ lại cách dịch hình thức hơn để không che khuất cấu trúc phối hợp của tiếng Hy Lạp.
- issue: Cách dịch πιστεύετε
  choice: tin
  alternative: có đức tin; tin cậy
  rationale: “Tin” là cách dịch trực tiếp và trung tính, không giới hạn động từ vào sự đồng ý thuần lý trí cũng không thêm một đối tượng hoặc sắc thái thần học không được nói rõ trong câu.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “tôi” theo lời trực tiếp của Đức Giê-su và “các ông” cho nhóm người nghe số nhiều, tránh đại từ cổ “các ngươi”. Câu chính ưu tiên lối diễn đạt tự nhiên, còn chú thích bảo tồn cấu trúc phối hợp và độ mơ hồ của καί.
