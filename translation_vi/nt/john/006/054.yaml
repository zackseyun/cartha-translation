  terminology: “Thịt,” “máu,” “sự sống đời đời,” và “ngày cuối cùng” phù hợp thuật ngữ và không làm giảm tính cụ thể của nguyên văn. Tuy nhiên, chú thích hiện có dùng “ăn lấy,” một cách nói không tự nhiên và không phản ánh rõ nét nghĩa cụ thể hơn của τρώγω; nên thay bằng các lựa chọn như “nhai” hoặc “gặm.”
  issues:
