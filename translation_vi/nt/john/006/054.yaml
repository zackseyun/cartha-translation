source:
  edition: SBLGNT
  text: ὁ τρώγων μου τὴν σάρκα καὶ πίνων μου τὸ αἷμα ἔχει ζωὴν αἰώνιον, κἀγὼ ἀναστήσω αὐτὸν τῇ ἐσχάτῃ ἡμέρᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/054.yaml
  text: The one who eats my flesh and drinks my blood has eternal life[b][a], and I will raise him up on the last day.
translation:
  language: vi
  text: Ai ăn[a] thịt tôi và uống máu tôi thì có sự sống đời đời, và tôi sẽ khiến người ấy sống lại vào ngày cuối cùng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Động từ Hy Lạp τρώγω ở đây cụ thể hơn từ thông thường chỉ việc ăn; cũng có thể dịch là “nhai” hoặc “gặm”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ τρώγων
  choice: Ai ăn
  rationale: Mạo từ đi với phân từ hiện tại tạo thành một cụm chỉ người được đặc trưng bởi hành động này. “Ai ăn” là cách diễn đạt tự nhiên trong tiếng Việt, vẫn giữ ý khái quát và tính tiếp diễn của hành động.
- source_word: τρώγων
  choice: ăn
  rationale: τρώγω là từ cụ thể, có thể gợi sắc thái ăn, nhai hoặc gặm. “Ăn” rõ ràng và tự nhiên nhất trong câu chính; sắc thái sinh động hơn được giữ trong chú thích.
- source_word: μου τὴν σάρκα
  choice: thịt tôi
  rationale: σάρξ ở đây mang nghĩa cụ thể là “thịt”, không nên làm nhẹ thành “thân thể” hoặc giải thích theo một hệ thần học.
- source_word: πίνων μου τὸ αἷμα
  choice: uống máu tôi
  rationale: Giữ nguyên hình ảnh cụ thể và song song với “ăn thịt tôi”; “máu” là từ hiện đại, trực tiếp và dễ hiểu.
- source_word: ἔχει ζωὴν αἰώνιον
  choice: có sự sống đời đời
  rationale: Thì hiện tại của ἔχει diễn tả sự sở hữu ngay trong hiện tại. “Sự sống đời đời” là cách nói quen thuộc, truyền đạt cả chiều kích trường tồn lẫn phẩm chất cánh chung.
- source_word: κἀγὼ ἀναστήσω αὐτόν
  choice: và tôi sẽ khiến người ấy sống lại
  rationale: ἀναστήσω trong ngữ cảnh này chỉ việc làm cho người chết sống lại. “Người ấy” nối lại với chủ thể số ít mang tính khái quát mà không buộc tiếng Việt phải gán giới tính.
- source_word: τῇ ἐσχάτῃ ἡμέρᾳ
  choice: vào ngày cuối cùng
  rationale: Đây là cách diễn đạt tự nhiên trong tiếng Việt cho cụm từ cánh chung quen thuộc của Tin Mừng Giăng.
theological_decisions:
- issue: Nên hiểu ngôn ngữ ăn thịt và uống máu theo nghĩa bí tích hay nghĩa ẩn dụ trong bản dịch
  choice: Giữ nguyên ngôn ngữ cụ thể “ăn thịt” và “uống máu” mà không diễn giải thêm
  alternative: Diễn giải rõ là dự Tiệc Thánh hoặc là tin nhận Chúa Giê-xu
  rationale: Bản Hy Lạp dùng những từ cụ thể và không tự giải quyết sự căng thẳng giữa các cách hiểu. Bản dịch vì thế không áp đặt một lập trường hệ phái.
- issue: Cách chuyển đại từ giống đực số ít αὐτόν sang tiếng Việt
  choice: người ấy
  alternative: người nam ấy; họ
  rationale: Giống đực ở đây phù hợp về ngữ pháp với chủ thể số ít chỉ người nói chung, không nhất thiết giới hạn vào nam giới. “Người ấy” giữ số ít và quan hệ hồi chỉ mà không thêm ý nghĩa giới tính không có trong ngữ cảnh.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “thịt” và “máu” để giữ tính cụ thể của nguyên văn; dùng “khiến người ấy sống lại” để diễn đạt rõ ngữ cảnh phục sinh. Không giữ chú thích tiếng Anh về cách nói truyền thống “raise him up” vì đó là vấn đề riêng của lối diễn đạt tiếng Anh, không phải một dị bản hay nét nghĩa cần chú thích trong tiếng Việt.
