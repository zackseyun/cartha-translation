  verdict: revise
  source_fidelity: 'Câu chính chuyển đạt đúng các thành tố của bản Hy Lạp: chủ thể khái quát số ít được đặc trưng bởi hai hành động hiện tại, “thịt” (σάρξ), “máu” (αἷμα), sự sống đời đời hiện có, và lời hứa Chúa Giê-xu sẽ làm người ấy sống lại vào ngày cuối cùng. “Khiến người ấy sống lại” diễn đạt phù hợp lực tác động của ἀναστήσω trong ngữ cảnh phục sinh.'
