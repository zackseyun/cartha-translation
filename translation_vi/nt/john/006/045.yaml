- from: 'Trong sách các nhà tiên tri có chép rằng: “Tất cả họ sẽ được Đức Chúa Trời dạy dỗ.”[a] Ai đã nghe và học từ Cha thì đến với tôi.'
  to: 'Có chép trong các sách Tiên tri rằng: “Mọi người sẽ được Đức Chúa Trời dạy.”[a] Ai đã nghe từ Cha và đã học thì đến với tôi.'
  rationale: Sửa cách gọi tuyển tập Kinh Thánh thành “các sách Tiên tri,” thay “Tất cả họ” bằng “Mọi người” để tiếng Việt rõ và tự nhiên hơn, và giữ nguyên trình tự cũng như mức độ không xác định thần học của nguyên văn. Cụm “đã nghe từ Cha và đã học” giữ hai phân từ hoàn tất trước động từ chính mà không thêm đối tượng hay cơ chế giải thích.
