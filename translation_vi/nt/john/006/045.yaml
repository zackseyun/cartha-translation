source:
  edition: SBLGNT
  text: ἔστιν γεγραμμένον ἐν τοῖς προφήταις· Καὶ ἔσονται πάντες διδακτοὶ θεοῦ· ⸀πᾶς ὁ ⸀ἀκούσας παρὰ τοῦ πατρὸς καὶ μαθὼν ἔρχεται πρὸς ⸀ἐμέ.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/045.yaml
  text: It is written in the Prophets[a], ‘And they will all be taught by God.’ Everyone who has heard from the Father and has learned comes to me.
translation:
  language: vi
  text: 'Có chép trong các sách Tiên tri rằng: “Mọi người sẽ được Đức Chúa Trời dạy.”[a] Ai đã nghe từ Cha và đã học thì đến với tôi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Mọi người sẽ là những người được Đức Chúa Trời dạy.”'
    reason: Giữ cách diễn đạt tính từ của διδακτοί (“được Đức Chúa Trời dạy”), bên cạnh cách dịch bằng động từ bị động.
lexical_decisions:
- source_word: ἔστιν γεγραμμένον
  choice: có chép rằng
  rationale: Công thức trích dẫn Kinh Thánh tự nhiên, trang trọng trong tiếng Việt; thể hiện điều đã được ghi chép và vẫn có hiệu lực.
- source_word: ἐν τοῖς προφήταις
  choice: Trong sách các nhà tiên tri
  rationale: Làm rõ đây là phần văn phẩm tiên tri trong Kinh Thánh, thay vì chỉ nói lời ấy ở giữa các cá nhân là tiên tri.
- source_word: ἔσονται πάντες διδακτοὶ θεοῦ
  choice: Tất cả họ sẽ được Đức Chúa Trời dạy dỗ
  rationale: Giữ sắc thái tương lai và ý Đức Chúa Trời là Đấng dạy, đồng thời diễn đạt tự nhiên trong tiếng Việt hiện đại.
- source_word: πᾶς ὁ
  choice: Ai
  rationale: 'Diễn đạt tự nhiên lực khái quát của cấu trúc danh hóa số ít: bất cứ người nào thuộc nhóm được mô tả.'
- source_word: ἀκούσας παρὰ τοῦ πατρὸς καὶ μαθὼν
  choice: đã nghe và học từ Cha
  rationale: Hai phân từ aorist chỉ những hành động có trước động từ chính; “từ Cha” giữ παρά với nghĩa nguồn gốc.
- source_word: ἔρχεται πρὸς ἐμέ
  choice: đến với tôi
  rationale: Giữ thì hiện tại và chuyển động mang tính tương quan hướng về Chúa Giê-su, không diễn giải thêm.
theological_decisions:
- issue: Mối quan hệ giữa sự dạy dỗ của Đức Chúa Trời và việc đến với Chúa Giê-su
  choice: 'Giữ nguyên trình tự: người đã nghe và học từ Cha thì đến với Chúa Giê-su.'
  alternative: Diễn đạt theo hướng tất định mạnh hơn hoặc nhấn mạnh sự hợp tác/chọn lựa của con người.
  rationale: Câu Hy Lạp nêu mối liên hệ nhưng không giải thích cơ chế siêu hình; bản dịch không giải quyết thay cho văn bản sự căng thẳng thần học này.
- issue: Quan hệ giữa “Cha” và “tôi”
  choice: Giữ trực tiếp “từ Cha” và “đến với tôi”.
  alternative: Mở rộng bằng lời giải thích Kitô học.
  rationale: Cách dịch bảo toàn lực Kitô học của câu văn—việc thực sự học từ Cha dẫn đến Chúa Giê-su—mà không thêm điều câu này không nói rõ.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “Đức Chúa Trời” cho θεός và “Cha” cho ὁ πατήρ trong văn mạch Giăng. Đại từ “tôi” phản ánh lời nói trực tiếp của Chúa Giê-su, tránh tự ý nâng cấp đại từ theo truyền thống hệ phái.
