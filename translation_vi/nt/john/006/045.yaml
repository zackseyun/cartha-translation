  source_fidelity: 'Bản nháp truyền đạt đúng cấu trúc chính của câu: công thức trích dẫn, lời hứa được Đức Chúa Trời dạy, và trình tự nghe/học từ Cha rồi đến với Chúa Giê-su. Tuy nhiên, “Trong sách các nhà tiên tri” không phản ánh tự nhiên và chính xác cách gọi tập thể ἐν τοῖς προφήταις, vốn chỉ phần Kinh Thánh gọi là “các sách Tiên tri,” không phải một cuốn sách hay các cá nhân tiên tri.'
  naturalness: “Có chép trong các sách Tiên tri rằng” là công thức tiếng Việt hiện đại, trang trọng và tự nhiên hơn. “Mọi người sẽ được Đức Chúa Trời dạy” tránh đại từ “họ” không có tiền ngữ rõ trong câu trích dẫn, đồng thời giữ được tính khái quát của πάντες.
  terminology: Giữ nhất quán “Đức Chúa Trời,” “Cha,” và “tôi.” “Các sách Tiên tri” diễn đạt đúng tên gọi tập thể của tuyển tập ngôn sứ. Chú thích được rút gọn để nêu đúng phương án “được Đức Chúa Trời dạy”/“do Đức Chúa Trời dạy” mà không thay đổi ý nghĩa.
  issues:
