  text: ἐγώ εἰμι ὁ ἄρτος τῆς ζωῆς·
base_translation:
  language: en
  yaml_path: translation/nt/john/006/048.yaml
  text: I am the bread of life.
translation:
  language: vi
  text: Ta là bánh của sự sống.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγώ
  choice: Ta
  rationale: Đại từ ngôi thứ nhất được diễn đạt là “Ta”, phù hợp với lời tự xưng trực tiếp của Chúa Giê-su trong văn phong Kinh Thánh trang trọng nhưng dễ hiểu. Sự hiện diện rõ của ἐγώ được giữ lại, không thêm từ nhấn mạnh như “chính Ta”.
- source_word: εἰμι
  choice: là
  rationale: Động từ hiện tại của εἰμί trong cấu trúc vị ngữ danh từ được dịch tự nhiên bằng hệ từ “là”; tiếng Việt không cần biểu thị riêng thì hiện tại ở đây.
- source_word: ὁ ἄρτος
  choice: bánh
  rationale: Ἄρτος chỉ bánh dùng làm lương thực, thường là bánh mì hoặc ổ bánh. Tiếng Việt tự nhiên dùng “bánh” trong ẩn dụ này; tính xác định của mạo từ Hy Lạp được thể hiện qua cấu trúc đồng nhất “Ta là bánh...” chứ không cần thêm một từ tương đương máy móc với “the”.
- source_word: τῆς ζωῆς
  choice: của sự sống
  rationale: Giữ quan hệ sở hữu/định tính cô đọng của cách sở hữu Hy Lạp và cách diễn đạt đặc trưng trong sách Giăng, không diễn giải thành “ban sự sống” hoặc “đem lại sự sống”.
theological_decisions:
- issue: Sức nặng của lời tuyên bố ἐγώ εἰμι trong thần học về Đấng Christ của sách Giăng
  choice: Dịch thẳng là “Ta là”, không mở rộng thành một diễn giải thần học rõ hơn.
  alternative: “Chính Ta là” hoặc một cách diễn đạt hàm ý công thức thần danh tuyệt đối
  rationale: Ở đây ἐγώ εἰμι có vị ngữ ὁ ἄρτος τῆς ζωῆς, nên không phải cấu trúc “Ta là” tuyệt đối. Bản dịch giữ sự tự đồng nhất mạnh mẽ của Chúa Giê-su nhưng không đưa thêm ý ngoài câu Hy Lạp.
- issue: Ý nghĩa của cách sở hữu trong τῆς ζωῆς
  choice: Giữ cách nói “của sự sống”.
  alternative: “ban sự sống” hoặc “nuôi dưỡng sự sống”
  rationale: Cách sở hữu có thể gợi bánh đem lại hoặc gắn với sự sống, nhưng nguyên văn không xác định tường minh chỉ một quan hệ. Cách dịch hình thức giữ được độ hàm súc và sự căng mở thần học của hình ảnh.
translation_notes:
  register: Văn phong hiện đại, trang trọng và cô đọng. “Ta” được dùng cho lời tự xưng của Chúa Giê-su; “bánh của sự sống” giữ hình ảnh và cấu trúc nguyên văn, dễ nhận biết trong truyền thống Kinh Thánh tiếng Việt mà không lệ thuộc máy móc vào bản tiếng Anh.
