source:
  edition: SBLGNT
  text: ἀπεκρίθη αὐτοῖς ὁ Ἰησοῦς· Οὐκ ἐγὼ ὑμᾶς τοὺς δώδεκα ἐξελεξάμην; καὶ ἐξ ὑμῶν εἷς διάβολός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/070.yaml
  text: Jesus answered them[a], “Did I not choose you, the Twelve? Yet one of you is a devil.”
translation:
  language: vi
  text: 'Đức Giê-su đáp lại họ: “Chẳng phải chính tôi đã chọn các anh, tức là Nhóm Mười Hai, sao? Thế mà một người trong các anh là quỷ[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “một kẻ vu khống”. Từ Hy Lạp có thể chỉ một kẻ cáo buộc gian dối, còn trong nhiều ngữ cảnh thì chỉ Ma Quỷ. Ở đây, cách diễn đạt mang tính mô tả phẩm chất hơn là trực tiếp đồng nhất người ấy với Sa-tan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη αὐτοῖς
  choice: đáp lời họ
  rationale: Diễn đạt tự nhiên động từ trần thuật chỉ lời đáp, đồng thời giữ đại từ số nhiều αὐτοῖς.
- source_word: Οὐκ ἐγὼ ... ἐξελεξάμην;
  choice: Chẳng phải chính tôi đã chọn ... sao?
  rationale: Giữ câu hỏi tu từ với οὐκ vốn chờ câu trả lời khẳng định; “chính tôi” thể hiện đại từ ἐγώ được nêu rõ để nhấn mạnh.
- source_word: ὑμᾶς τοὺς δώδεκα
  choice: anh em, Nhóm Mười Hai
  rationale: “Anh em” là cách Đức Giê-su xưng hô tự nhiên với nhóm môn đồ nam trong ngữ cảnh; “Nhóm Mười Hai” thể hiện cụm từ như danh xưng của một nhóm đã được xác định.
- source_word: καὶ
  choice: Thế mà
  rationale: Trong mạch câu, liên từ mang sắc thái tương phản giữa việc Đức Giê-su chọn Nhóm Mười Hai và thực trạng một người trong số họ là διάβολος.
- source_word: ἐξ ὑμῶν εἷς
  choice: một người trong anh em
  rationale: 'Giữ rõ nghĩa bộ phận của ἐξ: một người thuộc chính nhóm đang được nói đến.'
- source_word: διάβολός
  choice: quỷ
  rationale: Giữ sức nặng và độ gay gắt của từ Hy Lạp mà không thêm mạo từ xác định để đồng nhất trực tiếp người ấy với Sa-tan; chú thích nêu nghĩa từ nguyên khả dĩ “kẻ vu khống” và sắc thái định tính.
theological_decisions:
- issue: διάβολός là sự đồng nhất với Sa-tan hay lời mô tả định tính
  choice: là quỷ
  alternative: là kẻ vu khống; là Ma Quỷ
  rationale: Danh từ vị ngữ không có mạo từ mang sức mạnh định tính trong câu này. Bản dịch giữ nguyên căng thẳng thần học và lời nói mạnh của Đức Giê-su, nhưng chú thích ngăn người đọc mặc nhiên hiểu đây là sự đồng nhất trực tiếp với Sa-tan.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Giê-su” theo lối gọi tôn kính phổ biến; “Nhóm Mười Hai” làm rõ đây là danh xưng tập thể. Cấu trúc “Chẳng phải ... sao?” giữ lực của câu hỏi tu từ, còn “Thế mà” truyền đạt sắc thái tương phản trong ngữ cảnh.
