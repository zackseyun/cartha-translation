- from: 'Đức Giê-su đáp lời họ: “Chẳng phải chính tôi đã chọn anh em, Nhóm Mười Hai, sao? Thế mà một người trong anh em là quỷ[a].”'
  to: 'Đức Giê-su đáp lại họ: “Chẳng phải chính tôi đã chọn các anh, tức là Nhóm Mười Hai, sao? Thế mà một người trong các anh là quỷ[a].”'
  rationale: Chỉnh cách diễn đạt của cụm đồng vị “Nhóm Mười Hai” để bản dịch tiếng Việt rõ và tự nhiên hơn. Các lựa chọn còn lại được giữ vì trung thành với bản Hy Lạp và bảo toàn tính mạnh, định tính của διάβολος.
  reviewer_model: gpt-5.6-terra
