id: JHN.6.5
reference: John 6:5
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐπάρας οὖν ⸂τοὺς ὀφθαλμοὺς ὁ Ἰησοῦς⸃ καὶ θεασάμενος ὅτι πολὺς ὄχλος ἔρχεται πρὸς αὐτὸν λέγει ⸀πρὸς Φίλιππον· Πόθεν ⸀ἀγοράσωμεν ἄρτους ἵνα φάγωσιν οὗτοι;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/005.yaml
  text: So Jesus[a], lifting up his eyes and seeing that a large crowd was coming toward him, said to Philip[c][b], “Where are we to buy bread so that these may eat?”
translation:
  language: vi
  text: 'Vậy, Đức Giê-su ngước mắt lên và thấy một đám đông lớn đang tiến về phía mình, rồi nói với Phi-líp: “Chúng ta sẽ mua bánh[b] ở đâu[a] để những người này ăn?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát chữ: “Từ đâu chúng ta sẽ mua bánh…?”'
    reason: lexical_alternative
  - marker: b
    text: Từ Hy Lạp này có thể chỉ bánh nói chung hoặc các ổ bánh.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπάρας … τοὺς ὀφθαλμοὺς
  choice: ngước mắt lên
  rationale: Cách nói tự nhiên trong tiếng Việt, giữ hình ảnh thành ngữ của nguyên văn về việc Đức Giê-su đưa mắt lên nhìn.
- source_word: οὖν
  choice: Khi ấy
  rationale: Thể hiện sự tiếp nối của trình thuật mà không ép liên từ thành một kết luận nhân quả quá mạnh.
- source_word: θεασάμενος
  choice: thấy
  rationale: Diễn đạt gọn và tự nhiên hành động quan sát có nhận biết; không nâng giọng quá mức như “chiêm ngắm”.
- source_word: πολὺς ὄχλος
  choice: một đám đông lớn
  rationale: Diễn đạt rõ số lượng đông đảo bằng tiếng Việt hiện đại.
- source_word: ἔρχεται πρὸς αὐτόν
  choice: đang tiến về phía mình
  rationale: Giữ sắc thái chuyển động hướng đến Đức Giê-su của πρός và dùng thể tiếp diễn tự nhiên trong mạch kể.
- source_word: λέγει πρὸς Φίλιππον
  choice: nên nói với Phi-líp
  rationale: Chuyển hiện tại lịch sử sang thì kể chuyện tự nhiên trong tiếng Việt; “với” giữ quan hệ hướng lời nói đến người nghe.
- source_word: Πόθεν
  choice: ở đâu
  rationale: Đây là cách hỏi địa điểm mua tự nhiên trong tiếng Việt; nghĩa sát chữ “từ đâu” được lưu ở chú thích.
- source_word: ἀγοράσωμεν
  choice: chúng ta sẽ mua
  rationale: Giữ ngôi thứ nhất số nhiều và sắc thái cân nhắc của câu hỏi; “mua” là từ thông dụng, chính xác.
- source_word: ἄρτους
  choice: bánh
  rationale: Ἄρτος có thể chỉ bánh nói chung hoặc những ổ bánh; “bánh” giữ được độ rộng đó tốt hơn việc quy cụ thể thành một dạng bánh hiện đại.
- source_word: ἵνα φάγωσιν οὗτοι
  choice: để những người này ăn
  rationale: Giữ quan hệ mục đích của ἵνα và tính chỉ định trực tiếp của οὗτοι bằng lối nói rõ ràng, tự nhiên.
theological_decisions:
- issue: Cách thể hiện hiện tại lịch sử và chuỗi phân từ trong lời kể
  choice: Dùng lời kể tự nhiên “ngước mắt lên và thấy… nên nói”
  alternative: 'Bám sát hình thức hơn: “sau khi ngước mắt lên và thấy… Đức Giê-su nói”'
  rationale: Đây là lựa chọn văn phong chứ không phải giải thích giáo lý. Bản dịch giữ thứ tự và quan hệ giữa các hành động, đồng thời tránh kết cấu phân từ nặng nề trong tiếng Việt.
- issue: Sắc thái của câu hỏi ἀγοράσωμεν
  choice: “Chúng ta sẽ mua… ở đâu”
  alternative: “Chúng ta phải mua… ở đâu” hoặc sát chữ “Từ đâu chúng ta sẽ mua…”
  rationale: Giữ ngôi số nhiều và sắc thái cân nhắc mà không thêm ý bắt buộc quá rõ vốn không được phát biểu trực tiếp trong động từ nguyên văn.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “Đức Giê-su” và “Phi-líp” theo lối phiên âm quen thuộc; tránh từ cổ và không giải quyết quá mức sự linh hoạt của ἄρτους.
