revisions:
- from: 'Khi ấy, Đức Giê-su ngước mắt lên và thấy một đám đông lớn đang tiến về phía mình, nên nói với Phi-líp: “Chúng ta sẽ mua bánh[b] ở đâu[a] để những người này ăn?”'
  to: 'Vậy, Đức Giê-su ngước mắt lên và thấy một đám đông lớn đang tiến về phía mình, rồi nói với Phi-líp: “Chúng ta sẽ mua bánh[b] ở đâu[a] để những người này ăn?”'
  rationale: Sửa tối thiểu để phản ánh οὖν bằng “Vậy” và để quan hệ trình tự của các hành động rõ, tự nhiên hơn bằng “rồi nói.” Các từ ngữ còn lại, cấu trúc câu hỏi, tên riêng, và vị trí các neo chú thích được giữ nguyên về nghĩa.
