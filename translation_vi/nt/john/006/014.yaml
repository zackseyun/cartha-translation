id: JHN.6.14
reference: John 6:14
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οἱ οὖν ἄνθρωποι ἰδόντες ⸂ὃ ἐποίησεν σημεῖον⸃ ⸀ἔλεγον ὅτι Οὗτός ἐστιν ἀληθῶς ὁ προφήτης ὁ ἐρχόμενος εἰς τὸν κόσμον.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/014.yaml
  text: So when the people saw the sign that he had done[a], they were saying[b], “This truly is the Prophet who is coming into the world.”
translation:
  language: vi
  text: 'Vậy, khi thấy dấu lạ Ngài đã làm[a], dân chúng nói: “Ngài thật là Đấng Tiên Tri đang đến thế gian.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “phép lạ Ngài đã làm”. Trong sách Giăng, từ “dấu lạ” (σημεῖον) thường nhấn mạnh ý nghĩa mặc khải của những việc Đức Chúa Giê-su làm, chứ không chỉ tính chất kỳ diệu của chúng.
    reason: lexical_alternative
  - marker: b
    text: “Đấng Tiên Tri” có lẽ chỉ vị tiên tri giống như Môi-se mà dân chúng mong đợi (Phục Truyền Luật Lệ Ký 18:15–18).
    reason: cross_reference
lexical_decisions:
- source_word: οἱ οὖν ἄνθρωποι
  choice: Vậy ... dân chúng
  rationale: οἱ ἄνθρωποι trong ngữ cảnh chỉ đám đông nói chung, nên “dân chúng” tự nhiên hơn “những người”; οὖν được thể hiện bằng “Vậy” để nối kết diễn tiến và hệ quả trong câu chuyện.
- source_word: ἰδόντες
  choice: khi thấy
  rationale: Phân từ bất định diễn tả hành động xảy ra trước phản ứng nói năng; “khi thấy” chuyển cấu trúc sang tiếng Việt tự nhiên mà không làm nặng câu.
- source_word: ὃ ἐποίησεν σημεῖον
  choice: dấu lạ Ngài đã làm
  rationale: σημεῖον được dịch là “dấu lạ” nhằm giữ cả tính phi thường lẫn ý nghĩa mặc khải đặc trưng trong Giăng; “đã làm” phản ánh hành động đã hoàn tất mà dân chúng vừa chứng kiến.
- source_word: ἔλεγον
  choice: nói
  rationale: Thì chưa hoàn thành có thể gợi lời nói đang diễn ra hoặc được nhiều người cùng nói; tiếng Việt “dân chúng nói” tự nhiên và không buộc phải xác định đó là lặp đi lặp lại.
- source_word: ἀληθῶς
  choice: thật là
  rationale: “Thật là” diễn đạt sự xác nhận mạnh mẽ, tự nhiên trong lời tuyên bố tiếng Việt.
- source_word: ὁ προφήτης
  choice: Đấng Tiên Tri
  rationale: Mạo từ xác định và ngữ cảnh cho thấy một nhân vật được mong đợi, không chỉ là một tiên tri bất kỳ. “Đấng Tiên Tri” biểu thị cách dùng như một danh hiệu mà chưa xác định thêm trong chính câu dịch.
- source_word: ὁ ἐρχόμενος εἰς τὸν κόσμον
  choice: phải đến thế gian
  rationale: Phân từ có mạo từ mô tả nhân vật được mong đợi sẽ đến; “phải đến” là lối nói tiếng Việt tự nhiên cho niềm trông đợi ấy, còn “thế gian” giữ sắc thái từ κόσμος trong văn chương Giăng.
theological_decisions:
- issue: Danh tính của ὁ προφήτης
  choice: Dịch là “Đấng Tiên Tri” mà không nêu danh tính trong chính văn.
  alternative: “vị tiên tri giống như Môi-se” hoặc “một tiên tri”
  rationale: Cụm từ có lẽ gợi đến vị tiên tri được hứa trong Phục Truyền Luật Lệ Ký 18:15–18, nhưng nguyên văn chỉ nói “Đấng Tiên Tri”. Bản dịch giữ nguyên sức căng và để chú thích nêu liên hệ có khả năng xảy ra.
- issue: Sắc thái thời gian của ὁ ἐρχόμενος
  choice: “phải đến thế gian”
  alternative: “đang đến thế gian” hoặc “đến thế gian”
  rationale: Trong ngữ cảnh, đây là cách gọi nhân vật mà dân chúng trông đợi. “Phải đến” diễn đạt sự mong đợi mang tính lời hứa mà không khẳng định một hệ thống cánh chung cụ thể.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “Ngài” cho Đức Chúa Giê-su theo văn phong Kinh Thánh phổ thông; dùng “Đấng Tiên Tri” như một danh hiệu để phản ánh tính xác định của cụm Hy Lạp. Hai dấu chú thích [a], [b] đều xuất hiện trong chính văn.
