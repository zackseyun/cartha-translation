  yaml_path: translation/nt/john/006/013.yaml
  text: So they gathered them[b][a], and filled twelve baskets with pieces from the five barley loaves left over by those who had eaten.
translation:
  language: vi
  text: Vậy, họ gom lại và làm đầy mười hai giỏ bằng những mẩu bánh từ năm ổ bánh lúa mạch, là những phần còn dư lại sau khi những người ấy đã ăn.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνήγαγον οὖν
  choice: Vì vậy, họ thu gom lại
  rationale: οὖν nối hành động này như kết quả của mệnh lệnh ở câu trước; “vì vậy” giữ sắc thái suy luận. “Thu gom lại” diễn đạt tự nhiên hành động tập hợp các phần bánh còn thừa; tân ngữ được hiểu từ ngữ cảnh.
- source_word: ἐγέμισαν δώδεκα κοφίνους
  choice: chất đầy mười hai giỏ
  rationale: Giữ nguyên con số và hình ảnh các giỏ được làm đầy; “chất đầy” tự nhiên khi nói đến việc cho nhiều mẩu bánh vào giỏ.
- source_word: κλασμάτων
  choice: những mẩu bánh
  rationale: κλάσματα là các phần bánh đã được bẻ ra. “Mẩu bánh” vừa rõ nghĩa trong ngữ cảnh vừa tự nhiên hơn cách dịch trừu tượng như “mảnh vụn”.
- source_word: ἐκ τῶν πέντε ἄρτων τῶν κριθίνων
  choice: từ năm ổ bánh lúa mạch
  rationale: Diễn đạt trực tiếp nguồn gốc của các mẩu bánh, đồng thời giữ chi tiết bánh làm từ lúa mạch.
- source_word: ἃ ἐπερίσσευσαν τοῖς βεβρωκόσιν
  choice: còn thừa cho những người đã ăn
  rationale: Giữ quan hệ ngữ pháp của động từ ἐπερίσσευσαν với bổ ngữ cách cho τοῖς βεβρωκόσιν và không chuyển thành tác nhân bị động. Cách nói hơi khác tiếng Việt thông thường nên được giải thích bằng chú thích.
theological_decisions:
- issue: Quan hệ giữa phần bánh dư và những người đã ăn
  choice: còn thừa cho những người đã ăn
  alternative: còn lại sau khi mọi người ăn xong
  rationale: Bản chính giữ sát cấu trúc và sự mở của τοῖς βεβρωκόσιν (“cho/đối với những người đã ăn”), thay vì diễn giải hoàn toàn thành một mệnh đề thời gian.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “ổ bánh lúa mạch”, “mẩu bánh” và “giỏ” là những từ phổ thông; chú thích bảo tồn sắc thái sát nguyên văn của mệnh đề cuối.
