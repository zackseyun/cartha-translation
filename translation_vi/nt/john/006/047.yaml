  - severity: low
    issue: “Người tin” hơi kém thành ngữ trong câu khái quát.
    rationale: “Ai tin” là lựa chọn tự nhiên hơn trong tiếng Việt hiện đại và vẫn chuyển tải phân từ hiện tại có mạo từ theo nghĩa người nào tin, không thêm đối tượng của niềm tin.
  revised_text: 'Quả thật, quả thật, tôi nói với anh em: ai tin thì có sự sống đời đời.'
