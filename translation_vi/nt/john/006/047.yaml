  text: ἀμὴν ἀμὴν λέγω ὑμῖν, ὁ ⸀πιστεύων ἔχει ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/047.yaml
  text: Truly[a], truly, I say to you[b], the one who believes has eternal life.
translation:
  language: vi
  text: 'Quả thật, quả thật, tôi nói với anh em: ai tin thì có sự sống đời đời.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  choice: Thật, thật
  rationale: Giữ nguyên phép lặp trang trọng và nhấn mạnh đặc trưng trong lời Đức Giê-su ở sách Giăng; cách diễn đạt này gần nguồn hơn việc gộp thành “thật vậy” hoặc “quả thật”.
- source_word: λέγω ὑμῖν
  choice: tôi nói với anh em
  rationale: Dịch trực tiếp động từ hiện tại và đại từ số nhiều; “anh em” là cách xưng hô tự nhiên, trang trọng trong văn cảnh Đức Giê-su nói với những người nghe.
- source_word: ὁ πιστεύων
  choice: người tin
  rationale: Diễn đạt tự nhiên danh hóa phân từ hiện tại có mạo từ, chỉ người được đặc trưng bởi việc tin, mà không thêm đối tượng không có trong câu Hy Lạp.
- source_word: ἔχει
  choice: có
  rationale: Giữ thì hiện tại của nguyên bản, khẳng định sự sống đời đời là điều người tin hiện có, chứ không chỉ sẽ có trong tương lai.
- source_word: ζωὴν αἰώνιον
  choice: sự sống đời đời
  rationale: Đây là cách nói tự nhiên, quen thuộc trong tiếng Việt, chuyển tải cả tính bền lâu lẫn phẩm chất của sự sống trong văn mạch Giăng.
theological_decisions:
- issue: Sự sống đời đời là sở hữu hiện tại
  choice: có sự sống đời đời
  alternative: sẽ có sự sống đời đời
  rationale: ἔχει là thì hiện tại. Đổi sang tương lai sẽ làm mất sự căng thẳng cánh chung hiện tại trong câu và thêm ý ngoài nguyên bản.
- issue: Đối tượng của hành động tin không được nêu trong câu
  choice: người tin
  alternative: người tin tôi / người tin nơi tôi
  rationale: Một số văn cảnh và dị bản có thể khiến người đọc hiểu đối tượng là Đức Giê-su, nhưng bản SBLGNT được cung cấp không có εἰς ἐμέ; vì vậy không nên bổ sung đối tượng vào chính văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ nhịp lặp “Thật, thật” của nguyên bản và dùng “thì” để câu tiếng Việt tự nhiên, đồng thời làm rõ quan hệ chủ đề–vị ngữ mà không thay đổi nội dung.
