review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch giữ đúng cấu trúc và nội dung chính của SBLGNT: lời khẳng định được nhấn mạnh bằng phép lặp, chủ thể tổng quát của phân từ có mạo từ ὁ πιστεύων, động từ hiện tại ἔχει, và cụm ζωὴν αἰώνιον. Đặc biệt, bản dịch không thêm đối tượng cho động từ “tin”, phù hợp với văn bản SBLGNT được cung cấp.'
  naturalness: “Thật, thật” có tính bám sát hình thức nhưng không tự nhiên trong tiếng Việt hiện đại. “Quả thật, quả thật” vẫn bảo toàn phép lặp và sắc thái long trọng của ἀμὴν ἀμὴν, đồng thời là cách nói Việt ngữ tự nhiên hơn trong văn phong Kinh Thánh. “Ai tin” diễn đạt tự nhiên hơn “người tin” mà vẫn giữ nghĩa tổng quát của phân từ danh hóa.
  terminology: “Sự sống đời đời” là cách dịch chuẩn xác, quen thuộc và phù hợp cho ζωὴ αἰώνιος. “Có” giữ đúng thì hiện tại của ἔχει. Không cần chú thích vì câu tiếng Việt không tạo ra một mơ hồ hoặc quyết định diễn giải mới cần được đánh dấu.
