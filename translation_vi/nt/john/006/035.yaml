language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸀Εἶπεν αὐτοῖς ὁ Ἰησοῦς· Ἐγώ εἰμι ὁ ἄρτος τῆς ζωῆς· ὁ ἐρχόμενος πρὸς ἐμὲ οὐ μὴ πεινάσῃ, καὶ ὁ πιστεύων εἰς ⸀ἐμὲ οὐ μὴ ⸀διψήσει πώποτε.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/035.yaml
  text: Jesus said to them, “I am the bread of life; the one who comes to me will never hunger, and the one who believes in me will never thirst again.”
translation:
  language: vi
  text: 'Đức Giê-su nói với họ: “Tôi là bánh của sự sống; ai đến với tôi sẽ không bao giờ đói, và ai tin vào tôi sẽ không bao giờ khát.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “nhất định sẽ không bao giờ khát.” Tiếng Hy Lạp dùng lối phủ định nhấn mạnh cùng với từ “bao giờ”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἶπεν αὐτοῖς ὁ Ἰησοῦς
  choice: Đức Chúa Jêsus phán với họ
  rationale: Động từ λέγω ở thể kể chuyện có nghĩa cơ bản là “nói”; “phán” là cách diễn đạt trang trọng, tự nhiên trong văn phong Kinh Thánh tiếng Việt khi Đức Chúa Jêsus lên tiếng, mà không thêm nội dung ngoài nguyên văn. Dative αὐτοῖς được giữ là “với họ”.
- source_word: Ἐγώ εἰμι
  choice: Ta là
  rationale: Giữ lời tự xưng trực tiếp và sắc thái nhấn mạnh của đại từ Ἐγώ trong một công thức tự xác định trang trọng; không diễn giải thêm hàm ý thần học.
- source_word: ὁ ἄρτος τῆς ζωῆς
  choice: bánh của sự sống
  rationale: Giữ nguyên cấu trúc sở hữu và hình ảnh ẩn dụ của tiếng Hy Lạp; tránh chuyển thành “bánh ban sự sống,” vốn giải thích quan hệ sở hữu theo một hướng cụ thể.
- source_word: ὁ ἐρχόμενος πρὸς ἐμέ
  choice: Ai đến với Ta
  rationale: Diễn đạt phân từ hiện tại có mạo từ theo nghĩa khái quát bằng cấu trúc tiếng Việt tự nhiên “Ai...”; πρὸς chỉ sự hướng đến và được chuyển là “đến với”.
- source_word: οὐ μὴ πεινάσῃ
  choice: sẽ chẳng bao giờ đói
  rationale: οὐ μή là phủ định nhấn mạnh; “chẳng bao giờ” truyền đạt tự nhiên và rõ sức phủ định mạnh trong tiếng Việt hiện đại.
- source_word: ὁ πιστεύων εἰς ἐμέ
  choice: ai tin Ta
  rationale: “Tin Ta” là cách nói tiếng Việt tự nhiên cho πιστεύω εἰς trong văn cảnh này, giữ ý hướng lòng tin vào Đức Chúa Jêsus mà không thu hẹp thành chỉ sự đồng ý về nhận thức.
- source_word: οὐ μὴ διψήσει πώποτε
  choice: sẽ chẳng bao giờ khát
  rationale: Kết hợp οὐ μή với πώποτε biểu thị phủ định đặc biệt mạnh và bao quát mọi thời điểm. “Chẳng bao giờ khát” chính xác hơn “chẳng bao giờ khát lại,” vì πώποτε có nghĩa “bao giờ/bất cứ lúc nào,” không tự thân mang nghĩa “lại”.
theological_decisions:
- issue: Sắc thái của lời tự xác định Ἐγώ εἰμι
  choice: Ta là
  alternative: Chính Ta là
  rationale: Bản chính giữ lời tự xác định trực tiếp và trang trọng, để các âm hưởng trong Phúc Âm Giăng tự đứng vững mà không cường điệu hoặc giải thích thần học ngay trong câu.
- issue: Ý nghĩa của πιστεύων εἰς ἐμέ
  choice: ai tin Ta
  alternative: ai tin cậy nơi Ta
  rationale: “Tin Ta” vừa tự nhiên vừa bám sát thuật ngữ πιστεύω; phương án “tin cậy nơi Ta” làm nổi bật sắc thái phó thác nhưng có phần diễn giải hơn.
- issue: Phạm vi lời hứa không đói và không khát
  choice: Giữ hình ảnh tuyệt đối của nguyên văn, không giải thích loại đói khát
  alternative: Diễn giải là đói khát thuộc linh
  rationale: Nguyên văn dùng ẩn dụ trong diễn ngôn về bánh sự sống nhưng không gắn tính từ “thuộc linh” tại câu này. Giữ nguyên sự căng thẳng và chiều rộng thần học, không thu hẹp lời nói bằng chú giải giáo phái.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Jêsus” và đại từ “Ta” theo văn phong Kinh Thánh trang nghiêm; giữ phép ẩn dụ “bánh của sự sống.” Dấu chân chú [a] được đặt ngay sau mệnh đề mà chú thích giải thích.
