source:
  edition: SBLGNT
  text: ἦν δὲ ἐγγὺς τὸ πάσχα, ἡ ἑορτὴ τῶν Ἰουδαίων.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/004.yaml
  text: The Passover[a], the feast of the Jews, was near.
translation:
  language: vi
  text: Lễ Vượt Qua[a], là lễ của người Do Thái, đã gần đến.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch cụm sau là “lễ của người Giu-đê.” Từ Hy Lạp này có thể chỉ người Do Thái nói chung hoặc người Giu-đê nói riêng, tùy ngữ cảnh.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: không dịch thành một từ riêng
  rationale: δέ là liên từ nhẹ dùng để tiếp nối mạch kể. Trong tiếng Việt, câu chuyển cảnh tự nhiên mà không cần thêm “bấy giờ” hay “vả”, vì nguyên văn không có một trạng từ thời gian riêng biệt.
- source_word: ἐγγὺς
  choice: đã gần đến
  rationale: ἐγγύς kết hợp với ἦν để diễn tả sự gần kề về thời gian; “đã gần đến” tự nhiên và rõ nghĩa trong tiếng Việt.
- source_word: πάσχα
  choice: Lễ Vượt Qua
  rationale: πάσχα chỉ lễ Passover của người Do Thái; “Lễ Vượt Qua” là cách gọi tiêu chuẩn, chính xác và quen thuộc trong tiếng Việt.
- source_word: ἑορτὴ
  choice: lễ
  rationale: ἑορτή chỉ một kỳ lễ tôn giáo. “Lễ” vừa trang trọng vừa tự nhiên; việc lặp lại từ này trong cụm đồng vị giúp câu dễ hiểu.
- source_word: τῶν Ἰουδαίων
  choice: của người Do Thái
  rationale: Ἰουδαῖοι có thể chỉ người Do Thái nói chung hoặc người Giu-đê tùy ngữ cảnh. Vì Lễ Vượt Qua là kỳ lễ của toàn dân Do Thái chứ không chỉ của một vùng, nghĩa rộng phù hợp hơn ở đây.
theological_decisions:
- issue: Cách dịch Ἰουδαίων trong lời kể của Giăng
  choice: của người Do Thái
  alternative: của người Giu-đê
  rationale: Trong sách Giăng, Ἰουδαῖοι thay đổi nghĩa theo ngữ cảnh và đôi khi chỉ giới lãnh đạo hoặc cư dân Giu-đê. Tuy nhiên, ở đây cụm từ xác định Lễ Vượt Qua là kỳ lễ gắn với dân Do Thái nói chung. Bản dịch chính giữ nghĩa phù hợp nhất với ngữ cảnh, còn chú thích bảo lưu khả năng từ vựng hẹp hơn.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Cấu trúc đồng vị “là lễ của người Do Thái” làm rõ mối quan hệ giữa Lễ Vượt Qua và ἡ ἑορτή, đồng thời tránh văn phong cổ.
