base_translation:
  language: en
  yaml_path: translation/nt/john/006/026.yaml
  text: Jesus answered them[a], “Truly, truly, I say to you, you are seeking me not because you saw signs, but because you ate of the loaves and were filled.
translation:
  language: vi
  text: 'Giê-su trả lời họ: “Thật, thật, tôi nói với các ông: các ông tìm tôi không phải vì đã thấy các dấu lạ, nhưng vì đã ăn bánh từ những ổ bánh ấy và được no.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη αὐτοῖς ὁ Ἰησοῦς καὶ εἶπεν
  choice: Đức Chúa Jêsus đáp lời họ
  rationale: Diễn đạt tự nhiên công thức kể chuyện Hy Lạp ‘đáp và nói’, không lặp rườm rà nhưng vẫn giữ đầy đủ chức năng dẫn lời.
- source_word: Ἀμὴν ἀμὴν λέγω ὑμῖν
  choice: Thật, thật, tôi nói với các ông
  rationale: Giữ nguyên sự lặp lại trang trọng, đặc trưng trong Giăng; ‘các ông’ phù hợp với nhóm người đang được nói trực tiếp.
- source_word: ζητεῖτέ με
  choice: các ông tìm tôi
  rationale: Động từ ‘tìm’ vừa tự nhiên vừa bảo toàn chủ đề tìm kiếm trong sách Giăng; hiện tại tiếng Việt đủ diễn tả hành động đang diễn ra theo ngữ cảnh.
- source_word: σημεῖα
  choice: các dấu lạ
  rationale: ‘Dấu lạ’ giữ ý nghĩa những việc quyền năng mang chức năng chỉ dấu, thay vì giản lược thành ‘phép lạ’.
- source_word: ἐφάγετε ἐκ τῶν ἄρτων
  choice: đã ăn bánh
  rationale: Tiếng Việt tự nhiên dùng danh từ khối ‘bánh’; ngữ cảnh trước đó xác định đây là những ổ bánh đã được phân phát. Cách dịch sát chữ ‘ăn từ những ổ bánh’ không tự nhiên.
- source_word: ἐχορτάσθητε
  choice: được no
  rationale: Thể hiện dạng bị động và nghĩa được ăn đến no; ngắn gọn, tự nhiên, không thêm ý thỏa mãn tinh thần.
theological_decisions:
- issue: Ý nghĩa của σημεῖα trong văn mạch Giăng
  choice: các dấu lạ
  alternative: các phép lạ
  rationale: ‘Dấu lạ’ bảo toàn chức năng mặc khải của các công việc Đức Chúa Jêsus, là những dấu hiệu hướng người xem đến ý nghĩa vượt quá chính biến cố.
- issue: Sự tương phản về động cơ tìm Đức Chúa Jêsus
  choice: không phải vì đã thấy các dấu lạ, nhưng vì đã ăn bánh và được no
  alternative: không phải vì hiểu ý nghĩa các dấu lạ, nhưng vì đã ăn bánh và được thỏa mãn
  rationale: Bản văn chỉ nói họ ‘đã thấy’, không nói rõ họ không ‘hiểu’; vì vậy không thêm cách giải thích thần học vào câu dịch. ‘Được no’ cũng giữ trọng tâm thể chất của động từ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng ‘Đức Chúa Jêsus’ theo lối gọi tôn kính phổ biến; giữ đại từ tự xưng ‘tôi’ vì lời nói trực tiếp trong ngữ cảnh. Không cần chú thích vì các nét nghĩa chính có thể chuyển đạt rõ trong câu chính.
