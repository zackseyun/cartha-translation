  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: thưa
  rationale: Thì hiện tại lịch sử trong tiếng Hy Lạp được chuyển theo lối kể chuyện tự nhiên của tiếng Việt; “thưa” diễn đạt hành động nói với Chúa Giê-su trong ngữ cảnh kính trọng.
- source_word: αὐτῷ
  choice: với Ngài
  rationale: Đại từ ở cách dữ liệu chỉ đối tượng được nói với; trong ngữ cảnh, đại từ này chỉ Chúa Giê-su.
- source_word: εἷς ἐκ τῶν μαθητῶν αὐτοῦ
  choice: Một trong các môn đồ của Ngài
  rationale: Diễn đạt tự nhiên cấu trúc bộ phận εἷς ἐκ cộng sở hữu cách số nhiều, đồng thời giữ quan hệ sở hữu của αὐτοῦ.
- source_word: μαθητῶν
  choice: môn đồ
  rationale: “Môn đồ” là cách gọi quen thuộc trong văn mạch Phúc Âm, thể hiện người theo học và gắn bó với một vị thầy.
- source_word: Ἀνδρέας
  choice: Anh-rê
  rationale: Phiên âm tên riêng theo quy ước Kinh Thánh tiếng Việt phổ biến.
- source_word: ὁ ἀδελφὸς Σίμωνος Πέτρου
  choice: em trai của Si-môn Phi-e-rơ
  rationale: Cụm đồng vị xác định Anh-rê qua quan hệ anh em với Si-môn Phi-e-rơ; “em trai” là cách diễn đạt tự nhiên và phù hợp với cách nhận diện nhân vật trong truyền thống văn bản tiếng Việt.
- source_word: Σίμωνος Πέτρου
  choice: Si-môn Phi-e-rơ
  rationale: Hai tên được giữ liền nhau như danh xưng quen thuộc của cùng một nhân vật.
