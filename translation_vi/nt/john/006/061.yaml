revisions:
- from: 'Nhưng Đức Giê-su tự biết rằng các môn đồ mình đang lằm bằm về điều ấy, nên nói với họ: “Điều này khiến anh em vấp ngã sao?”'
  to: 'Nhưng Đức Giê-su biết trong lòng rằng các môn đồ của Ngài đang lẩm bẩm về điều này, nên nói với họ: “Điều này khiến anh em vấp ngã sao?”'
  rationale: Chỉnh cách diễn đạt ἐν ἑαυτῷ thành “biết trong lòng” để nêu rõ nhận biết nội tâm; thay sở hữu ngữ không tự nhiên; và sửa chính tả. Câu hỏi cuối giữ “khiến anh em vấp ngã” để bảo toàn hình ảnh và độ rộng nghĩa của σκανδαλίζει.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T06:20:47Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch giữ đúng các thành phần chính của câu: Đức Giê-su nhận biết nội tâm việc các môn đồ đang than phiền về lời vừa nói và hỏi liệu điều đó có làm họ vấp ngã hay không. Tuy nhiên, “tự biết” có thể gợi ý Đức Giê-su biết về chính mình, chưa diễn đạt rõ sắc thái ἐν ἑαυτῷ là nhận biết trong nội tâm, không do báo tin.'
  naturalness: “Các môn đồ mình” không tự nhiên trong tiếng Việt hiện đại ở ngữ cảnh tường thuật trang trọng; “các môn đồ của Ngài” rõ và tự nhiên hơn. “Lằm bằm” là lỗi chính tả; dạng chuẩn là “lẩm bẩm.”
  terminology: “Đức Giê-su,” “môn đồ,” và “anh em” phù hợp với văn phong Kinh Thánh hiện đại. “Khiến anh em vấp ngã” bảo tồn tốt ẩn dụ của σκανδαλίζει và không cần làm yếu thành chỉ “làm phật ý.”
  issues:
  - severity: medium
    issue: “tự biết” chưa thể hiện rõ ἐν ἑαυτῷ
    rationale: Cụm này chỉ sự nhận biết nội tâm của Đức Giê-su. “Biết trong lòng” truyền đạt trực tiếp hơn mà không thêm thông tin.
  - severity: medium
    issue: “các môn đồ mình” không tự nhiên
    rationale: Trong văn tường thuật hiện đại, sở hữu ngữ này thiếu tự nhiên và hơi mơ hồ; “các môn đồ của Ngài” là cách diễn đạt chuẩn.
  - severity: low
    issue: “lằm bằm” sai chính tả
    rationale: Từ chuẩn là “lẩm bẩm.”
  revised_text: 'Nhưng Đức Giê-su biết trong lòng rằng các môn đồ của Ngài đang lẩm bẩm về điều này, nên nói với họ: “Điều này khiến anh em vấp ngã sao?”'
