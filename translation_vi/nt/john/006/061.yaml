source:
  edition: SBLGNT
  text: εἰδὼς δὲ ὁ Ἰησοῦς ἐν ἑαυτῷ ὅτι γογγύζουσιν περὶ τούτου οἱ μαθηταὶ αὐτοῦ εἶπεν αὐτοῖς· Τοῦτο ὑμᾶς σκανδαλίζει;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/061.yaml
  text: But Jesus[a], knowing in himself that his disciples were grumbling about this, said to them, “Does this offend you?"
translation:
  language: vi
  text: 'Nhưng Đức Giê-su biết trong lòng rằng các môn đồ của Ngài đang lẩm bẩm về điều này, nên nói với họ: “Điều này khiến anh em vấp ngã sao?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰδὼς
  choice: biết
  rationale: Phân từ diễn tả sự nhận biết đồng thời với hành động nói; cấu trúc “tự biết rằng” tự nhiên trong tiếng Việt và kết hợp phù hợp với ἐν ἑαυτῷ.
- source_word: ἐν ἑαυτῷ
  choice: tự
  rationale: Diễn đạt việc Đức Giê-su tự mình nhận biết, không cần được người khác báo; “tự biết” tự nhiên hơn cách dịch máy móc “biết trong chính mình”.
- source_word: γογγύζουσιν
  choice: đang lằm bằm
  rationale: “Lằm bằm” diễn tả lời bất mãn nói nhỏ, giữ được sắc thái tiêu cực và kín đáo của động từ Hy Lạp.
- source_word: περὶ τούτου
  choice: về điều ấy
  rationale: Chỉ ngược về lời dạy vừa nêu mà không thêm danh từ giải thích ngoài nguyên văn.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: các môn đồ mình
  rationale: Cách diễn đạt tự nhiên, trang trọng, chỉ nhóm môn đồ rộng hơn chứ không thu hẹp thành Nhóm Mười Hai.
- source_word: Τοῦτο
  choice: Điều này
  rationale: Giữ đại từ chỉ định ngắn gọn và không giải thích quá mức đối tượng được nhắc đến.
- source_word: σκανδαλίζει
  choice: khiến anh em vấp ngã
  rationale: Giữ hình ảnh gây vấp ngã và khả năng hàm ý bị đẩy đến chỗ từ bỏ hoặc không tin, thay vì thu hẹp nghĩa thành cảm giác bị xúc phạm.
theological_decisions:
- issue: Sắc thái của σκανδαλίζει trong bối cảnh các môn đồ có nguy cơ bác bỏ lời Đức Giê-su
  choice: Điều này khiến anh em vấp ngã sao?
  alternative: Điều này làm anh em khó chịu sao? / Điều này xúc phạm anh em sao?
  rationale: “Vấp ngã” bảo tồn ẩn dụ Hy Lạp và sức nặng thần học về trở ngại dẫn đến bất tín hoặc lìa bỏ, đồng thời vẫn có thể bao hàm phản ứng khó chấp nhận. Không cần chú thích vì cách diễn đạt chính vừa tự nhiên vừa giữ được độ rộng của nguyên ngữ.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “Đức Giê-su” và “môn đồ”; câu hỏi trực tiếp giữ sắc thái chất vấn của nguyên văn. Không thêm chú thích vì không có dấu chú thích cần thiết trong bản chính.
