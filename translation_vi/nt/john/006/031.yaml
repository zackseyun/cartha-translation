id: JHN.6.31
reference: John 6:31
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οἱ πατέρες ἡμῶν τὸ μάννα ἔφαγον ἐν τῇ ἐρήμῳ, καθώς ἐστιν γεγραμμένον· Ἄρτον ἐκ τοῦ οὐρανοῦ ἔδωκεν αὐτοῖς φαγεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/031.yaml
  text: 'Our fathers ate the manna in the wilderness[b][a], just as it is written: ‘He gave them bread from heaven to eat.’'
translation:
  language: vi
  text: 'Cha ông chúng ta đã ăn ma-na trong hoang mạc,[a][b] như có chép rằng: “Ngài đã ban cho họ bánh từ trời để ăn.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hoặc “tổ tiên chúng ta.” Tiếng Hy Lạp nói sát nghĩa là “các cha của chúng ta.”
    reason: lexical_alternative
  - marker: b
    text: “Hoang mạc” cũng có thể dịch là “sa mạc” hoặc “nơi hoang vắng.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ πατέρες ἡμῶν
  choice: Tổ phụ chúng ta
  rationale: Cụm này chỉ các bậc cha ông của dân Israel. “Tổ phụ” giữ được sắc thái nam tính và liên hệ lịch sử của πατέρες, đồng thời trang trọng, tự nhiên hơn cách dịch sát chữ “các cha của chúng ta” trong tiếng Việt.
- source_word: τὸ μάννα
  choice: ma-na
  rationale: Dùng cách phiên âm quen thuộc trong tiếng Việt cho thức ăn được ban trong thời kỳ Israel ở hoang mạc.
- source_word: ἔφαγον
  choice: đã ăn
  rationale: Thể aorist chỉ hành động trong quá khứ; “đã ăn” diễn đạt rõ ràng và tự nhiên trong tiếng Việt.
- source_word: ἐν τῇ ἐρήμῳ
  choice: trong hoang mạc
  rationale: ἔρημος có thể là vùng hoang vắng hoặc sa mạc. “Hoang mạc” phù hợp ngữ cảnh Xuất Hành và không thu hẹp địa hình chỉ thành vùng toàn cát.
- source_word: καθώς ἐστιν γεγραμμένον
  choice: như có lời chép rằng
  rationale: Đây là công thức dẫn Kinh Thánh. Cách dịch này tự nhiên trong văn phong Kinh Thánh tiếng Việt và giữ ý lời ấy đang được ghi chép làm chứng.
- source_word: Ἄρτον
  choice: bánh
  rationale: ἄρτος ở đây chỉ bánh nói chung, không nhất thiết là một ổ bánh; “bánh” là tương đương tự nhiên trong tiếng Việt.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: từ trời
  rationale: Giữ hình ảnh nguồn gốc từ trời của bánh mà không thêm phần giải nghĩa thần học.
- source_word: ἔδωκεν αὐτοῖς φαγεῖν
  choice: đã ban cho họ ... để ăn
  rationale: Giữ cấu trúc ban cho đối tượng một thứ để ăn; “ban” phù hợp với hành động cung cấp của Đức Chúa Trời trong lời trích dẫn.
theological_decisions:
- issue: Có nên diễn giải lời trích về ma-na theo ý nghĩa Cơ Đốc học được triển khai về sau trong bài giảng hay không
  choice: Giữ lời này như một khẳng định lịch sử và trích dẫn Kinh Thánh về bánh từ trời, không viết hoa hay mở rộng “bánh” theo hướng diễn giải.
  alternative: Dùng cách viết hoặc lời dịch báo trước rằng Chúa Giê-su là Bánh thật.
  rationale: Trong câu này, những người nói đang viện dẫn việc tổ phụ ăn ma-na. Bản dịch cần để ý nghĩa Cơ Đốc học xuất hiện theo tiến trình lập luận của sách Giăng, thay vì đưa ý ấy sớm vào lời của họ.
- issue: Chủ thể không được nêu rõ của ἔδωκεν
  choice: Dịch là “Ngài” và không nêu đích danh Đức Chúa Trời.
  alternative: Dịch rõ là “Đức Chúa Trời đã ban cho họ.”
  rationale: Tiếng Hy Lạp chỉ có động từ ngôi thứ ba số ít với chủ thể hàm ẩn. “Ngài” giữ cách nói tự nhiên trong tiếng Việt mà không bổ sung danh xưng không hiện diện trong văn bản.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “tổ phụ” để giữ sắc thái lịch sử của Israel; dùng “ma-na” theo lối phiên âm quen thuộc. Các dấu chú thích [a], [b] được đặt ngay sau cụm từ liên quan.
