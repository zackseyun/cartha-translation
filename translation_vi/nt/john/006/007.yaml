  source_fidelity: 'Bản nháp truyền đạt đúng ý chính: Phi-líp trả lời rằng số bánh trị giá hai trăm đơ-na-ri không đủ để mọi người nhận một ít. Tuy nhiên, “Hai trăm đơ-na-ri tiền bánh” là cấu trúc chưa tự nhiên và dễ gây hiểu nhầm rằng tiền là chủ thể; tiếng Hy Lạp nói về bánh có giá hai trăm đơ-na-ri. Từ “cũng” không có đối ứng rõ trong nguyên văn.'
  naturalness: '“Phi-líp thưa với Ngài” có thể hiểu được, nhưng “Phi-líp thưa: ...” tự nhiên hơn trong lời thoại tiếng Việt, đồng thời không làm thay đổi ý ông đáp lời Đức Chúa Jêsus theo ngữ cảnh. “Bánh mua bằng hai trăm đơ-na-ri” là cách diễn đạt hiện đại, rõ ràng và tự nhiên.'
  terminology: Giữ “Phi-líp” và “đơ-na-ri” là phù hợp. “Ngài” trong lời thưa được giữ như cách xưng hô kính trọng theo ngữ cảnh, không thêm nội dung thần học. Không cần chú thích quy đổi tiền tệ.
