  text: Philip answered him, “Two hundred denarii worth of bread is not enough for them, so that each one may receive a little.”
translation:
  language: vi
  text: 'Phi-líp thưa: “Bánh mua bằng hai trăm đơ-na-ri cũng không đủ để mỗi người nhận được một chút.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη αὐτῷ
  choice: thưa với Ngài
  rationale: Trong ngữ cảnh Phi-líp đáp lời Đức Chúa Jêsus, “thưa” diễn đạt tự nhiên và đúng sắc thái kính trọng; “với Ngài” giữ đại từ gián tiếp của bản Hy Lạp.
- source_word: Διακοσίων δηναρίων ἄρτοι
  choice: Hai trăm đơ-na-ri tiền bánh
  rationale: Giữ nguyên đơn vị tiền tệ cổ denarius bằng dạng phiên âm, đồng thời dùng cấu trúc tiếng Việt tự nhiên để chỉ số bánh trị giá khoản tiền ấy.
- source_word: οὐκ ἀρκοῦσιν
  choice: cũng không đủ
  rationale: Diễn đạt sự không đủ về số lượng; “cũng” phù hợp sắc thái nhấn mạnh trong lời ước tính của Phi-líp mà không thêm một kết luận thần học.
- source_word: ἵνα ἕκαστος βραχύ τι λάβῃ
  choice: để mỗi người nhận được một chút
  rationale: Giữ quan hệ mục đích/kết quả của ἵνα và ý nghĩa phân phối của ἕκαστος; βραχύ τι được chuyển tự nhiên là “một chút”.
