id: JHN.6.6
reference: John 6:6
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τοῦτο δὲ ἔλεγεν πειράζων αὐτόν, αὐτὸς γὰρ ᾔδει τί ἔμελλεν ποιεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/006.yaml
  text: But he was saying this to test him[a], for he himself knew what he was about to do.
translation:
  language: vi
  text: Nhưng Ngài nói điều này để thử ông[a], vì chính Ngài biết mình sắp làm gì.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “thử thách ông”; động từ này cũng có thể mang nghĩa “cám dỗ”, nhưng ở đây có nghĩa là thử hoặc kiểm nghiệm ông.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο
  choice: điều này
  rationale: Đại từ chỉ định ở đối cách, quy chiếu về câu hỏi vừa nêu của Đức Chúa Jêsus; “điều này” tự nhiên và rõ nghĩa trong tiếng Việt.
- source_word: δὲ
  choice: Nhưng
  rationale: Liên từ đánh dấu sự tương phản nhẹ và chuyển sang lời giải thích; “Nhưng” làm rõ rằng câu hỏi không phát xuất từ sự thiếu hiểu biết.
- source_word: ἔλεγεν
  choice: nói
  rationale: Thì chưa hoàn thành mô tả hành động nói trong diễn tiến câu chuyện. Tiếng Việt không bắt buộc đánh dấu thể tiếp diễn; “nói” là cách diễn đạt tự nhiên, không làm mất ý chính.
- source_word: πειράζων
  choice: để thử
  rationale: Phân từ nêu mục đích hoặc hoàn cảnh. Trong ngữ cảnh, hành động nhằm kiểm nghiệm Phi-líp chứ không phải dụ dỗ ông làm điều ác.
- source_word: αὐτόν
  choice: ông
  rationale: Tân ngữ chỉ Phi-líp trong văn cảnh trực tiếp; “ông” là đại từ tự nhiên, trang trọng.
- source_word: αὐτὸς
  choice: chính Ngài
  rationale: Đại từ được nêu tường minh mang tính nhấn mạnh; “chính Ngài” bảo toàn trọng âm của nguyên văn.
- source_word: γὰρ
  choice: vì
  rationale: Dẫn vào lý do giải thích tại sao Ngài hỏi như vậy.
- source_word: ᾔδει
  choice: biết
  rationale: Dạng hình thái hoàn thành quá khứ của οἶδα nhưng có nghĩa trạng thái quá khứ trong Hy Lạp Koinē; trong tiếng Việt, “biết” tự nhiên và phù hợp với mạch kể quá khứ.
- source_word: τί
  choice: gì
  rationale: Đại từ nghi vấn gián tiếp biểu thị nội dung điều Ngài biết; “làm gì” là cấu trúc tiếng Việt tự nhiên.
- source_word: ἔμελλεν ποιεῖν
  choice: sắp làm
  rationale: μέλλω với động từ nguyên mẫu biểu thị hành động sắp xảy ra hoặc đã được dự định; “sắp làm” giữ nét hướng tới hành động cận kề mà không diễn giải quá mức.
theological_decisions:
- issue: Ý nghĩa của πειράζων đối với hành động của Đức Chúa Jêsus dành cho Phi-líp
  choice: Dịch là “để thử”.
  alternative: “để cám dỗ” hoặc “để thử thách”
  rationale: Văn cảnh cho thấy Ngài kiểm nghiệm sự hiểu biết hay đáp ứng của Phi-líp, không dụ dỗ ông phạm điều ác. “Thử” giữ nghĩa rộng, trực tiếp của động từ trong ngữ cảnh.
- issue: Sự nhấn mạnh vào việc Đức Chúa Jêsus biết trước điều mình sẽ làm
  choice: Giữ nét nhấn mạnh bằng “chính Ngài biết”.
  alternative: “Ngài biết”
  rationale: Đại từ αὐτός được dùng tường minh để nhấn mạnh chủ thể. Bản dịch giữ sự nhấn mạnh ấy nhưng không thêm một khẳng định giáo lý vượt quá câu văn.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” cho Đức Chúa Jêsus và “ông” cho Phi-líp để phân biệt chủ thể rõ ràng; giữ nguyên sự nhấn mạnh của αὐτός và không diễn giải thêm động cơ hay kết quả của phép thử.
