id: JHN.6.51
reference: John 6:51
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐγώ εἰμι ὁ ἄρτος ὁ ζῶν ὁ ἐκ τοῦ οὐρανοῦ καταβάς· ἐάν τις φάγῃ ἐκ τούτου τοῦ ἄρτου ⸀ζήσει εἰς τὸν αἰῶνα, καὶ ὁ ἄρτος δὲ ὃν ἐγὼ δώσω ἡ σάρξ μού ⸀ἐστιν ὑπὲρ τῆς τοῦ κόσμου ζωῆς.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/051.yaml
  text: I am the living bread that came down from heaven[a]. If anyone eats of this bread, he will live forever[c][b]. And the bread that I will give for the life of the world is my flesh.
translation:
  language: vi
  text: Ta là bánh sống từ trời xuống. Nếu ai ăn bánh này, người ấy sẽ sống đời đời. Và bánh mà Ta sẽ ban cho sự sống của thế gian chính là thịt Ta.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hy Lạp dùng từ “thịt,” không phải “thân thể.” Cách nói này có chủ ý cụ thể.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἄρτος ὁ ζῶν
  choice: bánh sống
  rationale: Dịch trực tiếp tính từ phân từ ζῶν là “sống,” tránh đồng hóa với cụm “bánh sự sống” ở văn cảnh lân cận.
- source_word: ὁ ἐκ τοῦ οὐρανοῦ καταβάς
  choice: từ trời xuống
  rationale: Diễn đạt tự nhiên trong tiếng Việt và giữ nguyên tuyên bố về nguồn gốc cùng sự giáng xuống từ trời.
- source_word: ἐάν τις φάγῃ ἐκ τούτου τοῦ ἄρτου
  choice: Nếu ai ăn bánh này
  rationale: ἐάν với động từ giả định diễn tả điều kiện tổng quát; tiếng Việt không cần dịch riêng giới từ ἐκ bằng “từ” trong cấu trúc ăn bánh.
- source_word: ζήσει εἰς τὸν αἰῶνα
  choice: người ấy sẽ sống đời đời
  rationale: “Đời đời” truyền đạt tự nhiên thành ngữ chỉ sự kéo dài mãi mãi, đồng thời “người ấy” giữ số ít mà không giới hạn giới tính.
- source_word: ὁ ἄρτος δὲ ὃν ἐγὼ δώσω
  choice: Và bánh Ta sẽ ban
  rationale: δέ đánh dấu bước phát triển trong lời nói hơn là một sự tương phản mạnh; “ban” phù hợp với hành động tự nguyện trao ban.
- source_word: ἡ σάρξ μού ἐστιν
  choice: chính là thịt của Ta
  rationale: “Thịt” giữ tính cụ thể và sắc thái gây chú ý của σάρξ; “chính là” làm rõ cấu trúc vị ngữ tự nhiên trong tiếng Việt mà không đổi nội dung.
- source_word: ὑπὲρ τῆς τοῦ κόσμου ζωῆς
  choice: để thế gian được sống
  rationale: Diễn đạt tự nhiên quan hệ mục đích/lợi ích của ὑπέρ và danh từ ζωή, không thu hẹp phạm vi của κόσμος.
- source_word: κόσμος
  choice: thế gian
  rationale: “Thế gian” là cách dịch quen thuộc, trang trọng và đủ rộng của κόσμος trong văn mạch Giăng.
theological_decisions:
- issue: Ý nghĩa của σάρξ trong lời tự mô tả của Chúa Giê-su
  choice: giữ nghĩa cụ thể là “thịt” trong chính văn
  alternative: “thân thể”
  rationale: σάρξ ở đây cụ thể và gắn với sự tự hiến của Chúa Giê-su; “thân thể” sẽ làm nhẹ đi sức nặng từ vựng và có thể ngầm giải quyết một vấn đề diễn giải.
- issue: Phạm vi của κόσμος
  choice: giữ “thế gian” mà không thu hẹp
  alternative: “nhân loại” hoặc một nhóm người cụ thể
  rationale: Bản dịch bảo toàn cách nói rộng của câu Hy Lạp, không áp đặt trước một hệ thống thần học hẹp hơn.
- issue: Sức nặng Kitô học của cụm “từ trời xuống”
  choice: dịch thẳng như một sự xuống từ trời
  alternative: hiểu thuần túy là được Đức Chúa Trời sai phái theo nghĩa ẩn dụ
  rationale: Cách dịch giữ nguyên tuyên bố trong văn bản và sự căng thẳng thần học của nó mà không thêm lời giải thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng đại từ “Ta” phù hợp lời tự xưng của Chúa Giê-su trong văn phong Kinh Thánh tiếng Việt; “người ấy” biểu thị số ít chung, không hàm ý chỉ nam giới.
