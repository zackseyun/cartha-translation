  source_fidelity: 'Câu đầu và điều kiện được dịch trung thành: “bánh sống,” “từ trời xuống,” và “sống đời đời” phản ánh tốt tiếng Hy Lạp. Tuy nhiên, trong mệnh đề cuối, “để thế gian được sống” hiện bổ nghĩa tự nhiên cho hành động “Ta sẽ ban”; bản Hy Lạp đặt ὑπὲρ τῆς τοῦ κόσμου ζωῆς với “thịt Ta” trong lời đồng nhất của bánh với thịt. Chỉnh cấu trúc để phản ánh quan hệ này rõ hơn.'
