revisions:
- from: Vì thịt tôi thật là thức ăn,[a] và huyết tôi thật là thức uống.
  to: Vì thịt tôi là thức ăn đích thực,[a] và máu tôi là thức uống đích thực.
  rationale: Bản sửa làm rõ rằng ἀληθής mô tả “thức ăn” và “thức uống”, không chỉ nhấn mạnh động từ “là”. Cặp “thịt/máu” và “thức ăn/thức uống” được giữ nguyên, cùng với liên từ “Vì”; cách dịch không áp đặt cách hiểu giáo phái về lời tuyên bố này.
