  timestamp: '2026-07-17T06:20:38Z'
review_pass:
  verdict: revise
  source_fidelity: Bản nháp giữ đúng liên từ giải thích γάρ và cặp song song σάρξ/αἷμα với βρῶσις/πόσις. Tuy nhiên, “thật là thức ăn/thức uống” trong tiếng Việt chủ yếu có thể được hiểu là lời khẳng định rằng thịt và huyết “quả thật là” thức ăn, thay vì diễn đạt rõ tính từ ἀληθής bổ nghĩa cho “thức ăn/thức uống”.
  naturalness: “Thịt tôi thật là thức ăn” có sắc thái gượng và mơ hồ trong tiếng Việt hiện đại. Đặt tính từ sau danh từ (“thức ăn đích thực”, “thức uống đích thực”) tự nhiên hơn và phản ánh trực tiếp cấu trúc vị ngữ Hy Lạp. “Máu” là từ hiện đại, thông dụng hơn “huyết”, mà vẫn giữ nguyên nghĩa đen và tính trang trọng vừa phải của câu.
  terminology: Dùng “thịt” cho σάρξ và “máu” cho αἷμα giữ tính cụ thể của nguyên văn, không diễn giải thành “thân thể”. “Đích thực” cho ἀληθής nêu nghĩa genuine/real mà không phân xử hàm ý Tiệc Thánh; chú thích giữ phương án “thật”.
  issues:
  - severity: medium
    issue: Vị trí và chức năng của “thật”
    rationale: Trong “thịt tôi thật là thức ăn”, “thật” dễ hoạt động như phó từ bổ nghĩa cho toàn mệnh đề (“thực sự là”), trong khi ἀληθής là tính từ vị ngữ xác định βρῶσις và πόσις. Cần chuyển thành tính từ gắn rõ với hai danh từ này.
  - severity: low
    issue: “Huyết” ít tự nhiên trong tiếng Việt hiện đại
    rationale: “Huyết” không sai và có sắc thái Kinh Thánh truyền thống, nhưng “máu” là cách nói hiện đại, phổ thông hơn; không làm suy giảm nghĩa đen hay tính song song của nguyên văn.
  revised_text: Vì thịt tôi là thức ăn đích thực,[a] và máu tôi là thức uống đích thực.
  revised_footnotes:
