source:
  edition: SBLGNT
  text: ἡ γὰρ σάρξ μου ⸀ἀληθής ἐστι βρῶσις, καὶ τὸ αἷμά μου ⸁ἀληθής ἐστι πόσις.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/055.yaml
  text: For my flesh is true food[a], and my blood is true drink.
translation:
  language: vi
  text: Vì thịt tôi là thức ăn đích thực,[a] và máu tôi là thức uống đích thực.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “thức ăn thật” và “thức uống thật.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: Vì
  rationale: Giữ quan hệ giải thích với lời tuyên bố ngay trước đó; “Vì” tự nhiên và sát chức năng diễn ngôn của γάρ.
- source_word: σάρξ
  choice: thịt
  rationale: Dịch trực tiếp, đồng thời giữ nguyên cặp song song “thịt” và “huyết”; tránh diễn giải thành “thân thể”.
- source_word: ἀληθής
  choice: thật
  rationale: “Thật” diễn đạt trực tiếp ý nghĩa “chân thật/thực” và phù hợp tự nhiên trong cấu trúc vị ngữ tiếng Việt, nhưng không quyết định trước hàm ý thần học.
- source_word: βρῶσις
  choice: thức ăn
  rationale: Trong cấu trúc vị ngữ song song với πόσις, từ này chỉ thứ được ăn hơn là hành động ăn.
- source_word: αἷμα
  choice: huyết
  rationale: Giữ nghĩa trực tiếp và sắc thái trang trọng, phù hợp với ngữ cảnh Kinh Thánh cũng như cặp “thịt và huyết”.
- source_word: πόσις
  choice: thức uống
  rationale: Diễn đạt tự nhiên thứ được uống và giữ thế song song cân xứng với “thức ăn”.
theological_decisions:
- issue: Cách dịch ἀληθής trong bối cảnh có tranh luận về Tiệc Thánh
  choice: thật
  alternative: đích thực; thật sự
  rationale: “Thật” bảo toàn sức nặng của từ Hy Lạp mà không dùng cách diễn đạt có thể ngầm giải quyết bản chất của lời tuyên bố theo một lập trường thần học riêng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “thịt tôi” và “huyết tôi” để giữ sát cấu trúc Hy Lạp cùng sự căng thẳng thần học của câu; dấu [a] đặt sau cụm đầu nhưng chú thích áp dụng cho cả hai lần dùng ἀληθής.
