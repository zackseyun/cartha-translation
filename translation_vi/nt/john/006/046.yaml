  text: οὐχ ὅτι τὸν πατέρα ⸂ἑώρακέν τις⸃ εἰ μὴ ὁ ὢν παρὰ τοῦ θεοῦ, οὗτος ἑώρακεν τὸν πατέρα.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/046.yaml
  text: Not that anyone has seen the Father[a], except the one who is from God; he has seen the Father.
translation:
  language: vi
  text: Không phải là có ai đã thấy Cha, ngoại trừ Đấng đến từ Đức Chúa Trời[a]; chính Đấng ấy đã thấy Cha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “từ sự hiện diện của Đức Chúa Trời” hoặc “từ bên Đức Chúa Trời.” Cụm từ Hy Lạp có thể vừa chỉ nguồn gốc vừa gợi sự gần gũi cá vị.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχ ὅτι
  choice: Không phải là
  rationale: Mở đầu lời đính chính cho ý trước, chứ không nêu nguyên nhân; cách diễn đạt này tự nhiên và giữ được sắc thái phủ định–làm rõ.
- source_word: τὸν πατέρα
  choice: Cha
  rationale: Trong văn mạch Giăng, danh xưng này chỉ Đức Chúa Trời trong mối quan hệ với Con; viết hoa để thể hiện tính danh xưng.
- source_word: ἑώρακέν τις
  choice: đã có ai thấy
  rationale: Trong câu phủ định, τις mang nghĩa ‘ai’; ‘đã… thấy’ diễn đạt hành động đã xảy ra và vẫn có giá trị đối với lời khẳng định hiện tại.
- source_word: εἰ μὴ
  choice: ngoại trừ
  rationale: Cụm từ đánh dấu ngoại lệ chứ không đặt điều kiện.
- source_word: ὁ ὢν
  choice: Đấng
  rationale: Danh hóa phân từ để chỉ một nhân vật cụ thể; ‘Đấng’ là cách nói trang trọng, tự nhiên trong ngữ cảnh nói về Con, dù sắc thái ‘đang là/ở’ được chuyển chủ yếu sang cụm quan hệ theo sau.
- source_word: παρὰ τοῦ θεοῦ
  choice: đến từ Đức Chúa Trời
  rationale: παρά với sở hữu cách trước hết có thể chỉ nguồn gốc/xuất phát; ‘đến từ’ tự nhiên trong tiếng Việt và không loại bỏ sắc thái gần gũi cá vị, được ghi ở chú thích.
- source_word: οὗτος
  choice: chính Đấng ấy
  rationale: Giữ sức nhấn mạnh hồi chỉ của οὗτος rõ hơn một đại từ đơn thuần và vẫn trang trọng, dễ hiểu.
- source_word: ἑώρακεν
  choice: đã thấy
  rationale: Diễn đạt thể hoàn thành trong tiếng Việt bằng ‘đã’, nêu sự kiện nhìn thấy có ý nghĩa hiện tại.
theological_decisions:
- issue: Mối quan hệ của Đấng được nói đến với Đức Chúa Trời trong παρὰ τοῦ θεοῦ
  choice: đến từ Đức Chúa Trời
  alternative: ở nơi Đức Chúa Trời; từ bên Đức Chúa Trời
  rationale: Bản chính ưu tiên sắc thái nguồn gốc/xuất phát thường gặp của παρά với sở hữu cách, nhưng không giải thích quá mức bản thể hay sứ mạng. Chú thích bảo tồn khả năng cụm từ đồng thời gợi sự hiện diện và gần gũi cá vị.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng ‘Đức Chúa Trời’ cho θεός và ‘Cha’ như danh xưng trong văn mạch Giăng; cấu trúc được giữ gần nguyên văn nhưng tránh lối diễn đạt gượng.
