id: JHN.6.64
reference: John 6:64
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀλλὰ εἰσὶν ἐξ ὑμῶν τινες οἳ οὐ πιστεύουσιν. ᾔδει γὰρ ἐξ ἀρχῆς ὁ Ἰησοῦς τίνες εἰσὶν οἱ μὴ πιστεύοντες καὶ τίς ἐστιν ὁ παραδώσων αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/064.yaml
  text: But there are some among you who do not believe[a]. For Jesus knew from the beginning who those were who did not believe[b], and who it was who would betray him.
translation:
  language: vi
  text: Nhưng có một số người trong anh em không tin. Vì ngay từ đầu, Đức Giê-su đã biết những ai là người không tin và ai sẽ phản bội Ngài.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay dịch sát hơn: “sẽ giao nộp Ngài.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Nhưng
  rationale: Diễn tả sự tương phản với lời ngay trước đó một cách tự nhiên trong tiếng Việt.
- source_word: ἐξ ὑμῶν
  choice: trong các con
  rationale: Diễn tả những người thuộc nhóm đang được Đức Giê-su trực tiếp nói với; tự nhiên hơn cách dịch sát chữ 'từ các con'.
- source_word: τινες
  choice: một số người
  rationale: Chỉ một bộ phận không xác định trong nhóm người nghe.
- source_word: οἳ οὐ πιστεύουσιν
  choice: không tin
  rationale: Thì hiện tại Hy Lạp chỉ tình trạng không tin đang có; tiếng Việt không cần đánh dấu riêng thể tiếp diễn.
- source_word: ᾔδει
  choice: đã biết
  rationale: Diễn tả trạng thái biết trong quá khứ; kết hợp tự nhiên với 'ngay từ đầu'.
- source_word: ἐξ ἀρχῆς
  choice: ngay từ đầu
  rationale: Giữ nguyên ý thời gian mà không xác định quá mức 'đầu' là thời điểm nào.
- source_word: οἱ μὴ πιστεύοντες
  choice: những ai là người không tin
  rationale: Phản ánh cấu trúc danh hóa của phân từ hiện tại, đồng thời giữ câu tiếng Việt rõ ràng.
- source_word: παραδώσων
  choice: sẽ phản bội
  rationale: Trong ngữ cảnh nói về Giu-đa, động từ chỉ hành động giao nộp mang tính phản trắc; bản dịch sát hơn được ghi ở chú thích.
- source_word: αὐτόν
  choice: Ngài
  rationale: Đại từ làm tân ngữ, quy chiếu về Đức Giê-su; dùng lối xưng hô tôn kính, phổ thông trong văn phong Kinh Thánh tiếng Việt.
theological_decisions:
- issue: Cách dịch πιστεύω trong ngữ cảnh phản ứng của các môn đồ đối với Đức Giê-su
  choice: tin
  alternative: tin cậy
  rationale: '''Tin'' giữ được phạm vi nghĩa rộng của πιστεύω trong Gio-an, không thu hẹp thành riêng khía cạnh nhận thức hay tín thác.'
- issue: Cách dịch παραδίδωμι khi nói về Giu-đa
  choice: phản bội
  alternative: giao nộp
  rationale: '''Phản bội'' truyền đạt đúng tính chất phản trắc của hành động trong mạch truyện, còn nghĩa sát chữ ''giao nộp'' được bảo lưu trong chú thích.'
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Giê-su”, “các con” cho lời Đức Giê-su nói với các môn đồ/người nghe, và “Ngài” để quy chiếu tôn kính. Giữ sự mơ hồ của “ngay từ đầu”, không tự ý xác định đó là khởi điểm chức vụ, thời gian theo Chúa hay một mốc khác.
