revisions:
- from: Nhưng trong các con có một số người không tin. Vì ngay từ đầu, Đức Giê-su đã biết những ai là người không tin và ai là kẻ sẽ phản bội Ngài.[a]
  to: Nhưng có một số người trong anh em không tin. Vì ngay từ đầu, Đức Giê-su đã biết những ai là người không tin và ai sẽ phản bội Ngài.[a]
  rationale: Điều chỉnh cách xưng hô “các con” thành “anh em” để không thêm sắc thái cha–con vào ὑμῶν, và giản lược “ai là kẻ sẽ” thành “ai sẽ” để giữ ý nghĩa sát hơn mà vẫn tự nhiên. Không thay đổi nghĩa của câu hay mốc thời gian mơ hồ “ngay từ đầu.”
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T06:20:54Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch truyền đạt đúng tương phản của ἀλλά, nhóm người không tin ở giữa cử tọa, tri thức của Đức Giê-su “từ đầu,” và hai đối tượng tri thức: những người không tin cùng người sẽ phản bội/giao nộp Ngài. “Phản bội” phù hợp ngữ cảnh và chú thích bảo lưu lựa chọn sát chữ “giao nộp.” Tuy nhiên, “các con” thêm sắc thái quan hệ cha–con không được biểu thị trong đại từ số nhiều ὑμῶν; “anh em” trung tính và sát ngữ cảnh xưng hô nhóm người nghe hơn.'
  naturalness: Câu nhìn chung tự nhiên, trang trọng. Đảo nhẹ trật tự thành “có một số người trong anh em” tự nhiên hơn, và bỏ “là kẻ” tránh một sắc thái miệt thị thêm vào ngoài điều động từ “phản bội” đã diễn đạt.
  terminology: “Đức Giê-su,” “tin,” “Ngài,” và “phản bội” nhất quán với văn phong Kinh Thánh tiếng Việt hiện đại. “Anh em” là cách xưng hô số nhiều trang trọng, không áp đặt quan hệ gia tộc/cha–con không có trong nguyên văn.
  issues:
  - severity: low
    issue: “các con” cho ὑμῶν
    rationale: Đại từ Hy Lạp chỉ đơn thuần là “các anh em/các người” đang được nói với. “Các con” hàm ý quan hệ cha–con và có thể làm hẹp hoặc thêm sắc thái vào cử tọa; “anh em” là lựa chọn trung tính hơn.
  - severity: low
    issue: “ai là kẻ sẽ phản bội Ngài”
    rationale: “Kẻ” có sắc thái quy kết/miệt thị riêng. Dù sự phản trắc đã có trong “phản bội,” nguyên văn chỉ hỏi “ai” là người sẽ làm việc ấy; “ai sẽ phản bội Ngài” tự nhiên và tiết chế hơn.
  revised_text: Nhưng có một số người trong anh em không tin. Vì ngay từ đầu, Đức Giê-su đã biết những ai là người không tin và ai sẽ phản bội Ngài.[a]
