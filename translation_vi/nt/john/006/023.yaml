  text: ⸀ἀλλὰ ἦλθεν ⸀πλοιάρια ἐκ Τιβεριάδος ἐγγὺς τοῦ τόπου ὅπου ἔφαγον τὸν ἄρτον εὐχαριστήσαντος τοῦ κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/023.yaml
  text: But boats came from Tiberias near the place where they ate the bread after the Lord had given thanks[a].
translation:
  language: vi
  text: Nhưng có mấy chiếc thuyền từ Ti-bê-ri-a đã đến gần nơi họ đã ăn bánh, sau khi Chúa đã tạ ơn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch sát hơn: “những chiếc thuyền nhỏ”; πλοιάρια là dạng giảm nhỏ của từ Hy Lạp chỉ “thuyền”.'
    reason: Bảo lưu sắc thái hình thái học của danh từ Hy Lạp mà bản văn chính không nhất thiết phải diễn đạt.
lexical_decisions:
- source_word: ἀλλὰ
  choice: Nhưng
  rationale: Diễn đạt trực tiếp quan hệ tương phản với tình huống được kể ngay trước đó.
- source_word: ἦλθεν
  choice: đến
  rationale: Động từ aorist của ἔρχομαι ở đây thuật lại việc các thuyền từ Ti-bê-ri-a đến khu vực ấy.
- source_word: πλοιάρια
  choice: những chiếc thuyền
  rationale: Danh từ có hình thức giảm nhẹ, có thể hàm ý thuyền nhỏ; bản văn chính dùng cách gọi tự nhiên trong tiếng Việt, còn sắc thái này được ghi ở chú thích.
- source_word: ἐκ Τιβεριάδος
  choice: từ Ti-bê-ri-a
  rationale: Diễn đạt địa điểm xuất phát; tên riêng được phiên âm theo cách dễ đọc trong tiếng Việt.
- source_word: ἐγγὺς τοῦ τόπου
  choice: gần nơi
  rationale: Cách diễn đạt tự nhiên và sát nghĩa về vị trí ở gần một địa điểm.
- source_word: ὅπου ἔφαγον τὸν ἄρτον
  choice: nơi họ đã ăn bánh
  rationale: Chỉ lại địa điểm của sự kiện ăn bánh trước đó; “đã ăn” giúp thể hiện trình tự tường thuật mà không thêm ý nghĩa ngoài văn cảnh.
- source_word: εὐχαριστήσαντος
  choice: sau khi ... dâng lời tạ ơn
  rationale: Phân từ aorist trong kết cấu sở hữu cách biểu thị hành động tạ ơn xảy ra trước việc ăn bánh; cách dịch này rõ ràng và tự nhiên.
- source_word: τοῦ κυρίου
  choice: Chúa
  rationale: Giữ danh xưng tôn kính κύριος dành cho Đức Giê-su và sắc thái Kitô học của cách gọi này.
theological_decisions:
- issue: Cách dịch κύριος khi chỉ Đức Giê-su
  choice: Chúa
  alternative: chủ; thầy
  rationale: “Chúa” vừa là danh xưng tôn kính tự nhiên trong tiếng Việt vừa giữ được âm hưởng Kitô học, trong khi “chủ” hoặc “thầy” sẽ thu hẹp sắc thái của từ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu giữ trật tự thông tin của nguyên văn, đồng thời dùng “có những chiếc thuyền ... đến” để câu tiếng Việt tự nhiên hơn.
