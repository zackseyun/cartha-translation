  text: ἐὰν οὖν θεωρῆτε τὸν υἱὸν τοῦ ἀνθρώπου ἀναβαίνοντα ὅπου ἦν τὸ πρότερον;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/062.yaml
  text: Then what if you were to see the Son of Man ascending to where he was before?[a]
translation:
  language: vi
  text: Vậy, nếu các ông thấy Con Người lên nơi Người đã ở trước kia thì sao?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Vậy, nếu các ông thấy Con Người lên nơi Người đã ở trước kia?” Tiếng Hy Lạp dùng một câu hỏi điều kiện mang tính tu từ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν οὖν
  choice: Vậy, nếu ... thì sao?
  rationale: Cấu trúc này giữ cả ý suy luận của οὖν và điều kiện của ἐὰν, đồng thời diễn đạt tự nhiên sắc thái câu hỏi tu từ trong tiếng Việt.
- source_word: θεωρῆτε
  choice: các ông thấy
  rationale: Trong ngữ cảnh này, θεωρέω chỉ việc chứng kiến hoặc nhìn thấy. “Thấy” là cách nói tự nhiên, rõ ràng; chủ ngữ số nhiều được thể hiện bằng “các ông” theo đối tượng trực tiếp ở ngữ cảnh trước.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: Con Người
  rationale: Giữ nguyên danh xưng quen thuộc của Chúa Giê-su, cùng các âm hưởng Đa-ni-ên và Đấng Mê-si, thay vì diễn giải.
- source_word: ἀναβαίνοντα
  choice: lên
  rationale: Phân từ diễn tả chuyển động đi lên. “Lên” tự nhiên trong tiếng Việt và không thêm đích đến mà bản Hy Lạp không nói rõ.
- source_word: ὅπου ἦν τὸ πρότερον
  choice: nơi Người đã ở trước kia
  rationale: Giữ cả ý về địa điểm và sự có mặt từ trước, không tự ý xác định nơi ấy là trời hay bên Đức Chúa Cha.
theological_decisions:
- issue: Có nên nói rõ sự đi lên là về trời và là lời khẳng định sự hiện hữu từ trước hay không
  choice: Giữ nguyên “lên nơi Người đã ở trước kia” mà không thêm lời giải thích.
  alternative: “lên trời, nơi Người đã ở trước kia” hoặc “trở về với Cha, nơi Người đã ở trước kia”
  rationale: Câu Hy Lạp hàm ý mạnh mẽ về nguồn gốc và sự hiện hữu trước đó của Con Người, nhưng không trực tiếp nêu “trời” hay “Cha”; bản dịch để nguyên sức nặng thần học và sự hàm ẩn của câu.
- issue: Cách thể hiện câu hỏi điều kiện tu từ chưa có mệnh đề kết quả được nói rõ
  choice: Dùng khuôn tiếng Việt “nếu ... thì sao?”
  alternative: “Vậy nếu các ông thấy Con Người lên nơi Người đã ở trước kia?”
  rationale: “Thì sao?” làm rõ chức năng tu từ tự nhiên trong tiếng Việt mà không bổ sung một kết quả cụ thể vốn không được nêu trong bản Hy Lạp.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Người” được viết hoa khi thay cho Con Người để tránh mơ hồ về chủ thể; câu hỏi “thì sao?” truyền đạt tự nhiên sắc thái tu từ của nguyên văn.
