source:
  edition: SBLGNT
  text: ὅτι καταβέβηκα ⸀ἀπὸ τοῦ οὐρανοῦ οὐχ ἵνα ποιῶ τὸ θέλημα τὸ ἐμὸν ἀλλὰ τὸ θέλημα τοῦ πέμψαντός με·
base_translation:
  language: en
  yaml_path: translation/nt/john/006/038.yaml
  text: For I have come down from heaven, not to do my own will, but the will of the one who sent me.
translation:
  language: vi
  text: Vì tôi đã từ trời xuống, không phải để làm theo ý riêng mình, nhưng để làm theo ý của Đấng đã sai tôi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι
  choice: Vì
  rationale: Trong ngữ cảnh, liên từ này mở đầu lời giải thích cho câu trước; “Vì” giữ rõ quan hệ nguyên nhân và tự nhiên trong tiếng Việt.
- source_word: καταβέβηκα
  choice: tôi ... xuống
  rationale: Động từ hoàn thành chỉ hành động đi xuống đã xảy ra và còn liên hệ đến hiện tại. Tiếng Việt không đánh dấu thể hoàn thành như tiếng Hy Lạp; cách nói “tôi từ trời xuống” tự nhiên và không làm phát sinh một sắc thái thời gian quá mức.
- source_word: ἀπὸ τοῦ οὐρανοῦ
  choice: từ trời
  rationale: Giữ nguyên hình ảnh không gian và ý nghĩa về nguồn gốc từ trời; đây là cách diễn đạt tự nhiên, trang trọng trong tiếng Việt.
- source_word: οὐχ ἵνα
  choice: không phải để
  rationale: Diễn đạt rõ mục đích bị phủ định, đồng thời chuẩn bị cho cấu trúc tương phản “nhưng để”.
- source_word: ποιῶ
  choice: làm theo
  rationale: Trong tiếng Việt, “làm theo ý” là cách kết hợp tự nhiên để diễn đạt việc thực hiện ý muốn; từ “theo” được bổ sung vì yêu cầu cú pháp, không thêm nội dung mới.
- source_word: τὸ θέλημα
  choice: ý
  rationale: “Ý” trong cụm “làm theo ý” là cách nói hiện đại và tự nhiên, vẫn giữ được nghĩa về ý muốn hay chủ định và cho phép lặp lại cân xứng ở hai vế.
- source_word: τὸ ἐμὸν
  choice: ý riêng mình
  rationale: “Riêng” thể hiện tính nhấn mạnh của đại từ sở hữu và làm nổi bật sự tương phản với ý của Đấng sai Chúa Giê-su.
- source_word: ἀλλὰ
  choice: nhưng
  rationale: Giữ trực tiếp và mạnh mẽ sự đối lập giữa hai mục đích.
- source_word: τοῦ πέμψαντός με
  choice: Đấng đã sai tôi
  rationale: Phân từ có mạo từ được chuyển thành một danh ngữ chỉ ngôi vị. “Đấng” phù hợp với văn phong Kinh Thánh trang trọng mà không nêu đích danh chủ thể vượt quá câu Hy Lạp.
theological_decisions:
- issue: Việc Chúa Giê-su từ trời xuống và hàm ý Cơ Đốc học
  choice: Dịch trực tiếp là “tôi từ trời xuống”, giữ lời khẳng định về nguồn gốc từ trời.
  alternative: Hiểu và dịch thuần túy theo nghĩa ẩn dụ là được Đức Chúa Trời giao phó sứ mạng.
  rationale: Bản văn dùng ngôn ngữ không gian về việc từ trời xuống; bản dịch không nên làm yếu đi thành lời nói đơn thuần về sự sai phái, cũng không thêm lời giải thích tín lý ngoài câu.
- issue: Mối quan hệ giữa ý của Chúa Giê-su và ý của Đấng sai Ngài
  choice: Giữ hai lần cùng một danh từ “ý” và bảo toàn sự tương phản giữa “ý riêng mình” với “ý của Đấng đã sai tôi”.
  alternative: Diễn giải thành “điều tôi muốn” và “điều Ngài muốn”.
  rationale: Cách dịch này giữ cấu trúc song song và sự phân biệt thật trong bản văn mà không giải quyết thay người đọc mối căng thẳng thần học về ý muốn, sứ mạng và sự vâng phục.
translation_notes:
  register: Văn phong tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Đại từ “tôi” phản ánh ngôi thứ nhất trong lời trực tiếp và nhất quán với câu nguồn. Không dùng thuật ngữ giáo phái; không cần chú thích vì bản văn không có dị nghĩa thiết yếu cần trình bày ở đây.
