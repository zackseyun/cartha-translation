  text: ἔλεγεν δὲ τὸν Ἰούδαν Σίμωνος ⸀Ἰσκαριώτου· οὗτος γὰρ ἔμελλεν ⸂παραδιδόναι αὐτόν⸃, ⸀εἷς ἐκ τῶν δώδεκα.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/071.yaml
  text: He was speaking about Judas[a], the son of Simon Iscariot, for this one was about to betray him, being one of the Twelve.
translation:
  language: vi
  text: Ngài nói về Giu-đa[a], con của Si-môn Ích-ca-ri-ốt; vì chính người này sắp phản bội Ngài, là một trong Nhóm Mười Hai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay, sát nghĩa hơn: “giao nộp Ngài.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν δὲ τὸν Ἰούδαν
  choice: Ngài nói về Giu-đa
  rationale: Thì chưa hoàn thành mang sắc thái giải thích trong lời kể; tiếng Việt tự nhiên có thể dùng “nói về” mà không cần thêm một trạng từ thời gian không có trong nguyên văn. δέ chỉ là từ nối nhẹ và có thể được thể hiện bằng mạch văn.
- source_word: Σίμωνος Ἰσκαριώτου
  choice: con của Si-môn Ích-ca-ri-ốt
  rationale: Hai sở hữu cách được hiểu tự nhiên nhất là xác định Giu-đa theo quan hệ cha con, với “Ích-ca-ri-ốt” bổ nghĩa cho Si-môn.
- source_word: οὗτος γὰρ
  choice: vì chính người này
  rationale: “Vì” thể hiện chức năng giải thích của γάρ; “chính người này” giữ sắc thái chỉ định và nhấn nhẹ của οὗτος.
- source_word: ἔμελλεν παραδιδόναι αὐτόν
  choice: sắp phản bội Ngài
  rationale: μέλλω diễn tả hành động sắp xảy ra; trong bối cảnh cuộc thương khó, παραδίδωμι chỉ hành vi giao nộp mang tính phản bội. Cách dịch “phản bội” truyền đạt rõ lực nghĩa theo ngữ cảnh, còn nghĩa sát chữ được ghi ở chú thích.
- source_word: εἷς ἐκ τῶν δώδεκα
  choice: dù là một trong Nhóm Mười Hai
  rationale: Cụm đồng vị nhấn mạnh sự trớ trêu và đáng kinh ngạc rằng kẻ phản bội thuộc Nhóm Mười Hai. “Dù là” diễn đạt tự nhiên quan hệ nhượng bộ hàm ẩn mà không biến nó thành một mệnh đề thần học mới.
theological_decisions:
- issue: Cách dịch παραδιδόναι khi nói về hành động của Giu-đa
  choice: phản bội Ngài
  alternative: giao nộp Ngài
  rationale: Động từ có nghĩa cơ bản là “giao nộp”, nhưng trong ngữ cảnh này hành động của Giu-đa được trình bày như sự phản bội. Bản dịch chính ưu tiên ý nghĩa theo ngữ cảnh, đồng thời chú thích giữ lại nghĩa sát chữ.
- issue: Quan hệ của εἷς ἐκ τῶν δώδεκα với mệnh đề trước
  choice: dù là một trong Nhóm Mười Hai
  alternative: là một trong Nhóm Mười Hai
  rationale: Nguyên văn đặt cụm này ở cuối để nhấn mạnh căn tính gây sửng sốt của người sẽ phản bội Chúa. “Dù là” làm rõ sức căng hàm ẩn trong trật tự câu nhưng không giải thích thêm động cơ hay trách nhiệm thần học.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” cho đại từ chỉ Đức Giê-su trong câu này để tránh mơ hồ giữa Ngài và Giu-đa; “Nhóm Mười Hai” được viết hoa như tên gọi của nhóm môn đồ.
