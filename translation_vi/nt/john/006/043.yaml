base_translation:
  language: en
  yaml_path: translation/nt/john/006/043.yaml
  text: Jesus answered and said to them[b][a], “Do not grumble among yourselves.”
translation:
  language: vi
  text: 'Giê-su trả lời họ rằng: “Đừng than phiền với nhau.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hoặc “lẫn nhau”. Động từ được dịch là “than phiền” cũng có thể dịch là “lẩm bẩm” hoặc “cằn nhằn.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη … καὶ εἶπεν
  choice: đáp lời
  rationale: Công thức Hy Lạp theo sát chữ là “đáp và nói”, nhưng trong tiếng Việt hiện đại, “đáp lời” diễn đạt tự nhiên đầy đủ chức năng dẫn lời mà không lặp ý vụng về.
- source_word: Ἰησοῦς
  choice: Đức Chúa Jêsus
  rationale: Dùng cách gọi và phiên âm quen thuộc trong văn phong Kinh Thánh Tin Lành tiếng Việt, với sắc thái trang trọng.
- source_word: Μὴ γογγύζετε
  choice: Đừng xì xầm
  rationale: Mệnh lệnh hiện tại với μή có thể là lời cấm nói chung hoặc yêu cầu chấm dứt hành động đang diễn ra; “đừng” giữ nguyên sự mơ hồ ấy. “Xì xầm” diễn tả lời bất bình nói nhỏ và phù hợp ngữ cảnh đám đông đang bàn tán.
- source_word: μετ’ ἀλλήλων
  choice: với nhau
  rationale: Diễn đạt tự nhiên hành động qua lại trong chính nhóm người nghe; cũng có thể hiểu là “giữa anh em”.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Bản dịch gộp công thức dẫn lời Hy Lạp “đáp và nói” thành “đáp lời” để tránh lối lặp không tự nhiên trong tiếng Việt, nhưng không làm mất chức năng trần thuật. Dấu chú thích [a] được đặt ngay sau câu liên quan.
