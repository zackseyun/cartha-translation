source:
  edition: SBLGNT
  text: ὅτε οὖν εἶδεν ὁ ὄχλος ὅτι Ἰησοῦς οὐκ ἔστιν ἐκεῖ οὐδὲ οἱ μαθηταὶ αὐτοῦ, ἐνέβησαν αὐτοὶ εἰς τὰ ⸀πλοιάρια καὶ ἦλθον εἰς Καφαρναοὺμ ζητοῦντες τὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/024.yaml
  text: So when the crowd saw that Jesus was not there[a], nor his disciples, they themselves got into the boats and came to Capernaum, looking for Jesus.
translation:
  language: vi
  text: Vì vậy, khi đám đông thấy Đức Chúa Jêsus không ở đó, các môn đồ của Ngài cũng không ở đó, thì chính họ lên các thuyền nhỏ[a] và đến Ca-phác-na-um để tìm Đức Chúa Jêsus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “các thuyền”; từ Hy Lạp dùng dạng từ có thể chỉ những chiếc thuyền nhỏ, nhưng sắc thái “nhỏ” không nhất thiết được nhấn mạnh ở đây.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε οὖν
  choice: Vì vậy, khi
  rationale: Diễn đạt cả quan hệ tiếp nối/suy luận của οὖν lẫn ý thời gian của ὅτε bằng tiếng Việt tự nhiên.
- source_word: ὁ ὄχλος
  choice: đám đông
  rationale: Chỉ đoàn người đang tụ tập trong bối cảnh và là cách nói hiện đại, rõ nghĩa.
- source_word: εἶδεν
  choice: thấy
  rationale: Giữ nghĩa trực tiếp của động từ, không diễn giải quá mức thành “nhận ra”.
- source_word: οὐκ ἔστιν ἐκεῖ
  choice: không còn ở đó
  rationale: Dùng cách kể quá khứ tự nhiên trong tiếng Việt; “còn” làm rõ sự vắng mặt tại thời điểm đám đông kiểm tra mà không thay đổi ý chính.
- source_word: οὐδὲ οἱ μαθηταὶ αὐτοῦ
  choice: các môn đồ Ngài cũng không
  rationale: Bảo toàn phép phối hợp phủ định, đồng thời tránh lặp lại động từ một cách nặng nề.
- source_word: ἐνέβησαν
  choice: lên
  rationale: “Lên thuyền” là kết hợp từ tự nhiên trong tiếng Việt, tương ứng với hành động bước lên hoặc vào thuyền.
- source_word: αὐτοὶ
  choice: chính họ
  rationale: Giữ sắc thái nhấn mạnh của đại từ αὐτοί.
- source_word: τὰ πλοιάρια
  choice: các thuyền nhỏ
  rationale: Thể hiện trực tiếp dạng giảm nhẹ/diminutive πλοιάρια; chú thích ghi nhận khả năng sắc thái này không được nhấn mạnh trong ngữ cảnh.
- source_word: ἦλθον εἰς Καφαρναοὺμ
  choice: đến Ca-phác-na-um
  rationale: Diễn đạt tự nhiên chuyển động tới địa điểm, không áp đặt điểm nhìn bằng “đi” hay “đến đây”.
- source_word: ζητοῦντες τὸν Ἰησοῦν
  choice: để tìm Đức Chúa Jêsus
  rationale: Trong ngữ cảnh, phân từ diễn tả hành động/mục đích tìm kiếm; “tìm” rõ ràng và không mang thêm sắc thái tâm linh ngoài câu chuyện.
