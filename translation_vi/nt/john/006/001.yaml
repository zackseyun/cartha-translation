  text: Μετὰ ταῦτα ἀπῆλθεν ὁ Ἰησοῦς πέραν τῆς θαλάσσης τῆς Γαλιλαίας τῆς Τιβεριάδος.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/001.yaml
  text: After these things[a], Jesus went away to the other side of the Sea of Galilee[b], which is the Sea of Tiberias.
translation:
  language: vi
  text: Sau những việc ấy[a], Đức Giê-su đi sang bờ bên kia Biển Ga-li-lê, cũng gọi là Biển Ti-bê-ri-át[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch gọn là “Sau đó”. Nguyên văn dùng số nhiều: “Sau những việc ấy”.'
    reason: lexical_alternative
  - marker: b
    text: “Biển Ga-li-lê” cũng được gọi là “Biển Ti-bê-ri-át”; cả hai tên chỉ cùng một vùng nước.
    reason: cultural_note
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: Sau những việc ấy
  rationale: Giữ số nhiều của ταῦτα và lối chuyển ý đặc trưng của Giăng, đồng thời vẫn tự nhiên trong tiếng Việt hiện đại.
- source_word: ἀπῆλθεν
  choice: đi
  rationale: Trong ngữ cảnh có πέραν chỉ hướng sang bờ đối diện, động từ đơn giản “đi” diễn đạt tự nhiên; sắc thái rời khỏi nơi đang ở đã được toàn cụm chuyển động thể hiện.
- source_word: πέραν
  choice: sang bờ bên kia
  rationale: Đây là cách nói tự nhiên khi diễn tả việc vượt qua một vùng nước để đến bờ đối diện.
- source_word: τῆς θαλάσσης τῆς Γαλιλαίας
  choice: Biển Ga-li-lê
  rationale: Dù về địa lý là một hồ, θάλασσα được dịch là “Biển”, phù hợp tên gọi quen thuộc và giữ hình thức của nguyên văn.
- source_word: τῆς Τιβεριάδος
  choice: cũng gọi là Biển Ti-bê-ri-át
  rationale: Cụm sở hữu thứ hai đồng vị với “Biển Ga-li-lê”; cách dịch này làm rõ đây là tên khác của cùng một vùng nước mà không tạo chuỗi sở hữu gượng gạo trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong trang trọng, sáng rõ và tự nhiên đối với độc giả Việt Nam hiện đại. Dùng “Đức Chúa Jêsus” theo lối gọi kính trọng; phiên âm các địa danh bằng dấu gạch nối. Cấu trúc đồng vị của hai tên biển được diễn đạt rõ nghĩa nhưng không giải quyết quá mức ngoài điều nguyên văn hàm ý.
