- from: Sau những việc ấy[a], Đức Chúa Jêsus đi sang bờ bên kia Biển Ga-li-lê, cũng gọi là Biển Ti-bê-ri-át[b].
  to: Sau những việc ấy[a], Đức Giê-su đi sang bờ bên kia Biển Ga-li-lê, cũng gọi là Biển Ti-bê-ri-át[b].
  rationale: Chỉ điều chỉnh cách gọi tên Giê-su để tránh thêm danh xưng không hiện diện trong nguyên văn và để dùng chính tả hiện đại. Các lựa chọn còn lại cùng các chú thích đều phản ánh đúng văn bản Hy Lạp và không cần đổi.
