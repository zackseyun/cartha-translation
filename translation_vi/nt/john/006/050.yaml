id: JHN.6.50
reference: John 6:50
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οὗτός ἐστιν ὁ ἄρτος ὁ ἐκ τοῦ οὐρανοῦ καταβαίνων ἵνα τις ἐξ αὐτοῦ φάγῃ καὶ μὴ ἀποθάνῃ·
base_translation:
  language: en
  yaml_path: translation/nt/john/006/050.yaml
  text: This is the bread that comes down from heaven[b][a], so that anyone may eat from it and not die.
translation:
  language: vi
  text: Đây là bánh từ trời xuống[a], để ai ăn bánh ấy thì không chết[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Đây là bánh đang từ trời xuống.”'
    reason: lexical_alternative
  - marker: b
    text: Cụm từ “không chết” được giữ theo nghĩa rộng; trong ngữ cảnh, có người hiểu là không phải chịu sự chết sau cùng, sự chết thuộc linh hoặc sự hủy diệt vào thời cuối cùng.
    reason: alternative_reading
lexical_decisions:
- source_word: οὗτός
  choice: Đây là
  rationale: Đại từ chỉ định hướng đến bánh mà Đức Giê-su đang xác định; “Đây là” tự nhiên trong tiếng Việt và giữ được tính trực tiếp của câu Hy Lạp.
- source_word: ἄρτος
  choice: bánh
  rationale: “Bánh” là cách dịch thông dụng, dễ hiểu của ἄρτος trong ngữ cảnh này, đồng thời giữ được cả nghĩa cụ thể lẫn sức gợi ẩn dụ trong Giăng 6.
- source_word: ὁ ἐκ τοῦ οὐρανοῦ καταβαίνων
  choice: từ trời xuống
  rationale: Cụm này diễn đạt nguồn gốc từ trời và chuyển động đi xuống bằng tiếng Việt tự nhiên. Phân từ hiện tại καταβαίνων có thể nhấn mạnh hành động đang diễn ra; khả năng ấy được ghi ở chú thích.
- source_word: οὐρανός
  choice: trời
  rationale: Trong ngữ cảnh Giăng, từ này chỉ cõi trời thuộc về Đức Chúa Trời, không chỉ bầu trời vật lý.
- source_word: ἵνα
  choice: để
  rationale: “Để” diễn đạt tự nhiên ý mục đích hoặc kết quả của ἵνα mà không ép câu theo một sắc thái duy nhất.
- source_word: τις
  choice: ai
  rationale: “Ai” trong cấu trúc “để ai… thì…” truyền đạt ý bất định, khái quát của τις và tự nhiên đối với người đọc hiện đại.
- source_word: ἐξ αὐτοῦ
  choice: bánh ấy
  rationale: Tiếng Việt tự nhiên nói “ăn bánh ấy” thay vì dịch cứng giới từ ἐξ là “ăn từ bánh ấy”; “ấy” chỉ rõ về chiếc bánh vừa được nhắc đến.
- source_word: φάγῃ
  choice: ăn
  rationale: Động từ ở thể giả định nằm trong mệnh đề với ἵνα; cấu trúc tiếng Việt “để ai ăn… thì…” truyền đạt đúng tính khái quát mà không cần thêm trợ động từ.
- source_word: μὴ ἀποθάνῃ
  choice: không chết
  rationale: ἀποθνῄσκω có nghĩa cơ bản là “chết”. Cách dịch đơn giản này không tự ý thu hẹp thành chết thuộc linh hay hư mất đời đời.
theological_decisions:
- issue: Bản chất của sự chết trong cụm μὴ ἀποθάνῃ
  choice: Giữ cách nói rộng “không chết”.
  alternative: “không chết về phần tâm linh” hoặc “không bị hư mất đời đời”
  rationale: Diễn từ về Bánh Sự Sống đặt bánh thông thường bên cạnh sự sống Đức Giê-su ban, nhưng chính câu này không xác định rõ loại sự chết. Giữ nguyên cách nói rộng bảo toàn chiều sâu và sức căng thần học của bản văn.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Câu giữ hình ảnh “bánh” và lời khẳng định “không chết” mà không giải nghĩa giáo phái; cấu trúc “để ai… thì…” chuyển tải mạch mục đích/kết quả tự nhiên.
