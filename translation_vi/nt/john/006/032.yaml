source:
  edition: SBLGNT
  text: εἶπεν οὖν αὐτοῖς ὁ Ἰησοῦς· Ἀμὴν ἀμὴν λέγω ὑμῖν, οὐ Μωϋσῆς ⸀δέδωκεν ὑμῖν τὸν ἄρτον ἐκ τοῦ οὐρανοῦ, ἀλλ’ ὁ πατήρ μου δίδωσιν ὑμῖν τὸν ἄρτον ἐκ τοῦ οὐρανοῦ τὸν ἀληθινόν·
base_translation:
  language: en
  yaml_path: translation/nt/john/006/032.yaml
  text: So Jesus said to them[a], “Truly, truly, I say to you, Moses has not given you the bread from heaven[b], but my Father gives you the true bread from heaven.”
translation:
  language: vi
  text: 'Vì vậy, Giê-su nói với họ: “Thật vậy, thật vậy, tôi nói với anh em: Không phải Môi-se đã ban cho anh em bánh từ trời[a], nhưng Cha tôi ban cho anh em bánh thật[b] từ trời.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Môi-se đã không ban cho anh em bánh từ trời.” Tiếng Hy Lạp đặt từ phủ định trước “Môi-se”, đặc biệt nhấn mạnh sự tương phản về người ban.'
    reason: lexical_alternative
  - marker: b
    text: “Bánh thật” cũng có thể có nghĩa là bánh “đích thực” hay “chân chính”—bánh từ trời theo nghĩa trọn vẹn, chứ không chỉ là ma-na trước kia như một dấu chỉ.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Vì vậy
  rationale: Giữ lực nối tiếp và suy luận từ cuộc đối thoại ngay trước đó, đồng thời tự nhiên trong văn xuôi tiếng Việt.
- source_word: Ἀμὴν ἀμὴν
  choice: Thật, thật
  rationale: Bảo toàn công thức lặp đôi trang trọng và nhấn mạnh đặc trưng trong sách Giăng, thay vì rút gọn thành một từ.
- source_word: λέγω ὑμῖν
  choice: tôi nói với anh em
  rationale: Dịch trực tiếp, rõ ràng và phù hợp với công thức tuyên bố long trọng; đại từ số nhiều được thể hiện bằng “anh em”.
- source_word: οὐ Μωϋσῆς δέδωκεν ὑμῖν
  choice: Không phải Môi-se đã ban cho anh em
  rationale: Đặt phủ định trước chủ thể như tiếng Hy Lạp để làm nổi bật sự tương phản về tác nhân; “đã ban” diễn đạt hành động quá khứ có liên hệ đến cuộc bàn luận hiện tại.
- source_word: τὸν ἄρτον ἐκ τοῦ οὐρανοῦ
  choice: bánh từ trời
  rationale: Cách diễn đạt gọn, tự nhiên, giữ nguyên hình ảnh và ý chỉ nguồn gốc của bánh.
- source_word: ἀλλ’ ὁ πατήρ μου δίδωσιν ὑμῖν
  choice: nhưng Cha tôi đang ban cho anh em
  rationale: “Đang ban” làm rõ thì hiện tại δίδωσιν và duy trì sự tương phản với δέδωκεν, nhưng không xác định quá mức cách thức hay thời điểm hoàn tất việc ban.
- source_word: ὁ πατήρ μου
  choice: Cha tôi
  rationale: Cách sở hữu tự nhiên trong tiếng Việt, giữ nguyên lời xác nhận quan hệ làm Con của Đức Chúa Jêsus.
- source_word: τὸν ἀληθινόν
  choice: bánh thật
  rationale: “Thật” có thể bao hàm ý chân thật, đích thực và thực tại trọn vẹn, nhờ đó giữ được chiều sâu của ἀληθινός trong sách Giăng.
theological_decisions:
- issue: Sự tương phản giữa Môi-se và Cha như những tác nhân ban bánh
  choice: Dịch “Không phải Môi-se ... nhưng Cha tôi” để đặt trọng tâm phủ định nơi Môi-se.
  alternative: “Môi-se đã không ban ...”
  rationale: Trật tự οὐ Μωϋσῆς khiến sự tương phản về tác nhân đặc biệt nổi bật. Bản dịch được chọn giữ điều này mà không thêm cách giải nghĩa thần học.
- issue: Sự tương phản về thời giữa δέδωκεν và δίδωσιν
  choice: Dịch “đã ban” đối lập với “đang ban”.
  alternative: “đã không ban ... ban”
  rationale: Cách dịch giữ sự phân biệt giữa việc ban bánh gắn với quá khứ và hành động ban của Cha đang được trình bày trong diễn từ hiện tại, nhưng không suy diễn thêm về bản chất của hành động ấy.
- issue: Ý nghĩa của “bánh thật”
  choice: Giữ cách nói “bánh thật” trong chính văn.
  alternative: “bánh đích thực” hoặc “bánh chân chính”
  rationale: 'Cách dịch này bảo tồn độ mở của ἀληθινός: có thể chỉ điều chân thật, đích thực, hoặc thực tại tối hậu so với ma-na trước kia, thay vì giải quyết sẵn sự căng thẳng thần học.'
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ công thức lặp “Thật, thật” cùng hình ảnh “bánh từ trời”; dùng “Đức Chúa Jêsus”, “Môi-se” theo lối gọi quen thuộc trong truyền thống Kinh Thánh tiếng Việt. Các chú thích ghi nhận trọng tâm cú pháp và phạm vi nghĩa mà không áp đặt cách giải thích hệ phái.
