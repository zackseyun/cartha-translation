  yaml_path: translation/nt/john/006/020.yaml
  text: But he said to them[a], “It is I; do not be afraid.”
translation:
  language: vi
  text: 'Nhưng Đức Giê-su nói với họ: “Chính Ta đây[a], đừng sợ!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc, sát chữ: “Ta là.” Trong sách Giăng, cách nói này có thể chỉ đơn giản là lời tự nhận diện, đồng thời cũng có thể gợi những chủ đề thần học rộng hơn.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ δὲ
  choice: Nhưng Đức Giê-su
  rationale: δέ là liên từ nhẹ, đánh dấu bước chuyển có sắc thái tương phản; “nhưng” tự nhiên trong ngữ cảnh. Mạo từ ὁ được dùng như đại từ chỉ Đức Giê-su; nêu rõ tên giúp câu tiếng Việt sáng nghĩa mà không thêm một nhân vật mới.
- source_word: λέγει
  choice: nói
  rationale: Thì hiện tại lịch sử của tiếng Hy Lạp có thể được dịch tự nhiên bằng “nói” trong văn kể tiếng Việt; ngữ cảnh đã xác định thời điểm, nên không cần ép thành một dạng quá khứ.
- source_word: αὐτοῖς
  choice: với họ
  rationale: Giữ nguyên đại từ số nhiều của nguyên văn, để ngữ cảnh xác định đó là các môn đồ.
- source_word: Ἐγώ εἰμι
  choice: Chính là Ta
  rationale: Trong ngữ cảnh trực tiếp, câu này nhận diện người đang đến với các môn đồ. “Chính là Ta” là lời tự nhận diện tự nhiên, trang trọng trong tiếng Việt; bản dịch sát hơn “Ta là” được giữ ở chú thích vì có thể mang âm vang thần học trong sách Giăng.
- source_word: μὴ φοβεῖσθε
  choice: đừng sợ
  rationale: Đây là mệnh lệnh phủ định, và “đừng sợ” là cách diễn đạt ngắn gọn, tự nhiên, đúng với hoàn cảnh các môn đồ đang kinh hãi.
theological_decisions:
- issue: Nên dịch Ἐγώ εἰμι như lời tự nhận diện thông thường hay giữ dạng sát chữ có thể mang âm vang thần học
  choice: 'Bản văn chính: “Chính là Ta”'
  alternative: “Ta là”
  rationale: Ngữ cảnh trước hết cho thấy Đức Giê-su đang trấn an các môn đồ bằng cách cho họ biết chính Ngài đang đến. Tuy nhiên, cách nói ἐγώ εἰμι trong sách Giăng cũng có thể gợi những chủ đề thần học rộng hơn. Chú thích giữ lại dạng sát chữ để không xóa bỏ hoặc áp đặt cách hiểu ấy.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Đức Giê-su” để xác định rõ chủ thể; dùng đại từ tự xưng “Ta” phù hợp lời nói có thẩm quyền của Đức Giê-su trong văn phong Kinh Thánh, nhưng tránh lối diễn đạt cổ khó hiểu.
