  source_fidelity: 'Bản dịch truyền đạt đúng cấu trúc và ý chính của nguyên văn: Thánh Linh/thần khí là tác nhân ban sự sống; xác thịt hoàn toàn không đem lại ích lợi; các lời của Chúa Giê-su có phẩm tính thần khí và sự sống. Tuy nhiên, chú thích a gọi πνεῦμα là “điều ban sự sống,” làm suy yếu cách hiểu có ngôi vị đã được chọn trong bản văn và không phải là lựa chọn thay thế tự nhiên cần thiết.'
