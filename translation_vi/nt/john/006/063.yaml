  to: Chính Thánh Linh là Đấng ban sự sống[a]; xác thịt chẳng ích lợi gì[b]. Những lời tôi đã nói với anh em là thần khí[c] và là sự sống.
  rationale: 'Chỉ sửa chú thích a: thay “điều” bằng “Đấng” để phù hợp hơn với tác nhân “ban sự sống,” với bản dịch chính, và với khả năng quy chiếu đến Đức Thánh Linh mà chú thích đang trình bày. Bản văn chính và các chú thích còn lại được giữ nguyên vì phản ánh trung thành nguyên văn, giữ được sự mơ hồ hợp lý ở πνεῦμα trong mệnh đề cuối, và dùng tiếng Việt tự nhiên trong thanh ghi Kinh Thánh.'
