reference: John 6:63
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τὸ πνεῦμά ἐστιν τὸ ζῳοποιοῦν, ἡ σὰρξ οὐκ ὠφελεῖ οὐδέν· τὰ ῥήματα ἃ ἐγὼ ⸀λελάληκα ὑμῖν πνεῦμά ἐστιν καὶ ζωή ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/063.yaml
  text: It is the Spirit who gives life[a]; the flesh benefits nothing[c][b]. The words that I have spoken to you are spirit and are life.
translation:
  language: vi
  text: Chính Thánh Linh là Đấng ban sự sống[a]; xác thịt chẳng ích lợi gì[b]. Những lời tôi đã nói với anh em là thần khí[c] và là sự sống.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Thần khí là Đấng ban sự sống.” Từ Hy Lạp πνεῦμα có thể chỉ “Thánh Linh” hoặc “thần khí”; ở đây ngữ cảnh nghiêng về Đức Thánh Linh.'
    reason: alternative_reading
  - marker: b
    text: “Xác thịt” có thể chỉ rộng hơn đến những gì chỉ thuộc về con người; dịch là “bản tính tội lỗi” ở đây sẽ giải nghĩa nhiều hơn điều từ Hy Lạp tự nó đòi hỏi.
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể hiểu: “là Thánh Linh và là sự sống” hoặc “thuộc linh và ban sự sống.” Cách diễn đạt Hy Lạp cô đọng và có sắc thái định tính.'
    reason: alternative_reading
lexical_decisions:
- source_word: τὸ πνεῦμα
  choice: Thánh Linh
  rationale: Trong ngữ cảnh Giăng, danh từ có mạo từ này rất có thể chỉ Đức Thánh Linh, là Đấng ban sự sống. Cách dịch này làm rõ nghĩa được ngữ cảnh ưu tiên, còn khả năng hiểu là “thần khí” được ghi ở chú thích.
- source_word: ζῳοποιοῦν
  choice: Đấng ban sự sống
  rationale: Phân từ hiện tại mang nghĩa làm cho sống hoặc ban sự sống. “Đấng ban sự sống” tự nhiên trong tiếng Việt và phù hợp với chủ thể có ngôi vị.
- source_word: ἡ σὰρξ
  choice: xác thịt
  rationale: Giữ thuật ngữ rộng và sự đối lập nguyên văn với Thánh Linh, không thu hẹp thành “bản tính tội lỗi”, “nỗ lực con người” hay chỉ “thân thể”.
- source_word: οὐκ ὠφελεῖ οὐδέν
  choice: chẳng ích lợi gì
  rationale: Diễn đạt rõ phủ định tuyệt đối của tiếng Hy Lạp bằng lối nói tự nhiên, trang trọng trong tiếng Việt.
- source_word: τὰ ῥήματα
  choice: những lời
  rationale: Chỉ các lời đã được nói ra; đây là cách dịch trực tiếp và tự nhiên trong ngữ cảnh.
- source_word: λελάληκα
  choice: đã nói
  rationale: Thì hoàn thành chỉ hành động đã xảy ra với hiệu lực còn tồn tại. Tiếng Việt không mã hóa đầy đủ thể này, nhưng “đã nói” tự nhiên và để ngữ cảnh chuyển tải giá trị còn tiếp diễn.
- source_word: πνεῦμά ἐστιν
  choice: là thần khí
  rationale: Vị ngữ không có mạo từ có sắc thái định tính. “Là thần khí” giữ cách nói cô đọng và không đồng nhất trực tiếp các lời với Đức Thánh Linh; chú thích nêu các cách hiểu khả dĩ.
- source_word: ζωή
  choice: sự sống
  rationale: Thuật ngữ trực tiếp, quen thuộc và có thể giữ chiều sâu thần học đặc trưng trong Giăng.
theological_decisions:
- issue: Đối tượng của πνεῦμα trong mệnh đề đầu
  choice: Hiểu là Đức Thánh Linh và dịch “Thánh Linh”
  alternative: “thần khí” theo nghĩa một nguyên lý thuộc linh hoặc thần khí con người
  rationale: Ngữ cảnh Tin Mừng Giăng liên kết việc ban sự sống với Đức Thánh Linh, và cấu trúc có mạo từ hỗ trợ một đối tượng xác định. Chú thích vẫn bảo lưu sự đa nghĩa của từ Hy Lạp.
- issue: Ý nghĩa của σὰρξ khi đối lập với Thánh Linh
  choice: Giữ cách nói rộng “xác thịt”
  alternative: “bản tính tội lỗi”, “những gì chỉ thuộc về con người”, hoặc “thân thể”
  rationale: Nguyên văn không tự giới hạn từ này vào một hệ thống nhân học cụ thể. Giữ “xác thịt” bảo tồn sự căng thẳng thần học thay vì giải nghĩa quá mức.
- issue: Giá trị vị ngữ của πνεῦμά ἐστιν ở mệnh đề cuối
  choice: 'Dịch định tính: “là thần khí”'
  alternative: “là Thánh Linh” hoặc “thuộc linh và ban sự sống”
  rationale: Vị ngữ không có mạo từ thiên về phẩm tính. Cách dịch cô đọng bảo tồn hình thức mạnh của nguyên văn và tránh quyết định quá mức rằng các lời đồng nhất với Đức Thánh Linh.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “tôi/anh em” theo lời trực tiếp của Chúa Giê-su trong ngữ cảnh môn đồ; dùng “Thánh Linh” cho đối tượng có ngôi vị ở mệnh đề đầu, nhưng “thần khí” chữ thường trong mệnh đề định tính cuối để bảo tồn khác biệt ngữ pháp và sự mơ hồ có thật.
