  terminology: “Thánh Linh,” “xác thịt,” và “sự sống” nhất quán với các quyết định thuật ngữ. “Thần khí” ở mệnh đề cuối giúp tránh đồng nhất hóa quá mức với Đức Thánh Linh. Chú thích a nên dùng “Đấng ban sự sống” thay vì “điều ban sự sống,” để không tạo ra mâu thuẫn với cách dịch chính và lý do ngữ cảnh nêu trong chú thích.
