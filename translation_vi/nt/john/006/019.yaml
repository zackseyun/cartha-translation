id: JHN.6.19
reference: John 6:19
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐληλακότες οὖν ὡς σταδίους εἴκοσι πέντε ἢ τριάκοντα θεωροῦσιν τὸν Ἰησοῦν περιπατοῦντα ἐπὶ τῆς θαλάσσης καὶ ἐγγὺς τοῦ πλοίου γινόμενον, καὶ ἐφοβήθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/019.yaml
  text: So when they had rowed about twenty-five or thirty stadia[a], they saw Jesus walking on the sea and coming near the boat[b], and they were afraid.
translation:
  language: vi
  text: Vậy, sau khi đã chèo được khoảng hai mươi lăm hoặc ba mươi sta-đi-ôn[a], họ thấy Giê-su đi trên biển[b] và đến gần thuyền; họ sợ hãi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sta-đi-ôn là một đơn vị đo chiều dài thời xưa; hai mươi lăm hoặc ba mươi sta-đi-ôn tương đương khoảng năm đến sáu ki-lô-mét.
    reason: cultural_note
  - marker: b
    text: Cũng có thể dịch là “đi trên mặt nước”. Nguyên văn Hy Lạp nói sát nghĩa là “đi trên biển”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐληλακότες
  choice: sau khi chèo được
  rationale: Trong ngữ cảnh đi thuyền, ἐλαύνω chỉ việc dùng mái chèo đẩy thuyền đi. Phân từ hoàn thành diễn tả hành động đã xảy ra trước lúc họ nhìn thấy Chúa Giê-su.
- source_word: οὖν
  choice: Vậy
  rationale: Giữ chức năng liên kết và tiếp nối câu chuyện của οὖν bằng một từ nối tự nhiên trong tiếng Việt.
- source_word: ὡς
  choice: khoảng
  rationale: Khi đi với đơn vị đo, ὡς biểu thị con số ước chừng.
- source_word: σταδίους εἴκοσι πέντε ἢ τριάκοντα
  choice: hai mươi lăm hoặc ba mươi sta-đi-ôn
  rationale: Giữ đơn vị đo cổ của nguyên văn trong chính văn; chú thích cung cấp trị số tương đương hiện đại.
- source_word: θεωροῦσιν
  choice: họ thấy
  rationale: Động từ chỉ sự trông thấy; cách dịch này tự nhiên, rõ ràng và không làm câu văn trở nên cổ kính.
- source_word: περιπατοῦντα ἐπὶ τῆς θαλάσσης
  choice: đang đi trên biển
  rationale: Giữ danh từ θάλασσα là “biển” và ý nghĩa Chúa Giê-su đi trên bề mặt biển, đúng với ngữ cảnh các môn đồ đang ở ngoài khơi.
- source_word: ἐγγὺς τοῦ πλοίου γινόμενον
  choice: đến gần thuyền
  rationale: γίνομαι kết hợp với ἐγγύς diễn tả việc tiến vào vị trí gần, chứ không chỉ trạng thái đã ở gần.
- source_word: πλοίου
  choice: thuyền
  rationale: “Thuyền” phù hợp với loại phương tiện trên hồ Ga-li-lê hơn từ “tàu”.
- source_word: ἐφοβήθησαν
  choice: họ liền sợ hãi
  rationale: Diễn tả phản ứng sợ hãi xảy ra khi họ nhìn thấy Chúa Giê-su; “liền” làm rõ sự tiếp nối trong câu chuyện mà không thêm nguyên nhân ngoài văn cảnh.
theological_decisions:
- issue: Cách diễn đạt phép lạ mà không làm nhẹ nghĩa trực tiếp của câu
  choice: đang đi trên biển
  alternative: đang đi bên biển; đang đi trên mặt nước
  rationale: ἐπί với sở hữu cách trong văn cảnh này chỉ việc đi trên chính mặt biển. “Đi bên biển” không phù hợp vì các môn đồ đã chèo ra xa; “trên mặt nước” truyền đạt đúng sự kiện nhưng thay danh từ “biển” của nguyên văn bằng một cách diễn giải.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “Chúa Giê-su” theo cách gọi Kitô giáo phổ thông; giữ đơn vị cổ trong chính văn và giải thích bằng hệ mét trong chú thích.
