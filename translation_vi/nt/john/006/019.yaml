  verdict: revise
  source_fidelity: 'Bản nháp truyền đạt đúng trình tự và các ý chính của câu: các môn đồ đã chèo thuyền khoảng 25–30 sta-đi-ôn, thấy Giê-su đi trên biển và tiến gần thuyền, rồi sợ hãi. Tuy nhiên, «Chúa» không có trong nguyên văn, và «liền» thêm một sắc thái tức thời không được đánh dấu riêng bởi ἐφοβήθησαν.'
  naturalness: Câu nhìn chung tự nhiên và đúng văn phong tiếng Việt hiện đại. «Sau khi đã chèo được khoảng...» diễn đạt rõ giá trị hoàn thành của phân từ ἐληλακότες. Bỏ «liền» làm câu gọn và sát nghĩa hơn.
  terminology: Nên dùng «Giê-su» thay vì «Chúa Giê-su» trong câu này để không thêm tước hiệu vào tên riêng Ἰησοῦν. «Biển», «thuyền», và «sta-đi-ôn» đều phù hợp; chú thích về đơn vị đo và cách diễn đạt «mặt nước» hữu ích.
  issues:
  - severity: medium
    issue: Thêm tước hiệu «Chúa» trước «Giê-su»
    rationale: Nguyên văn chỉ có τὸν Ἰησοῦν, nghĩa là «Giê-su»; không có κύριος hay tước hiệu tương đương. Bản dịch nên không bổ sung tước hiệu không hiện diện trong câu nguồn.
  - severity: low
    issue: Từ «liền» thêm sắc thái thời gian
    rationale: Aorist ἐφοβήθησαν thuật lại phản ứng sợ hãi, nhưng không tự nó đòi hỏi trạng từ «liền». Bỏ từ này giữ đúng mức độ thông tin của nguyên văn.
