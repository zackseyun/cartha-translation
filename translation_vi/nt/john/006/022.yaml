revisions:
- from: Ngày hôm sau, đám đông vẫn còn ở bên kia biển thấy rằng tại đó không có chiếc thuyền nhỏ nào khác ngoài một chiếc[a], và Đức Chúa Jêsus đã không cùng các môn đồ lên thuyền[b], nhưng chỉ các môn đồ Ngài đi mà thôi.
  to: Ngày hôm sau, đám đông vẫn còn ở bên kia biển thấy rằng tại đó không có chiếc thuyền nhỏ nào khác ngoài một chiếc[a], và Đức Giê-su đã không cùng các môn đồ đi vào thuyền[b], nhưng các môn đồ của Ngài đã ra đi một mình.
