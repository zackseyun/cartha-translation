  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Τῇ ἐπαύριον ὁ ὄχλος ὁ ἑστηκὼς πέραν τῆς θαλάσσης ⸀εἶδον ὅτι πλοιάριον ἄλλο οὐκ ἦν ἐκεῖ εἰ μὴ ⸀ἕν, καὶ ὅτι οὐ συνεισῆλθεν τοῖς μαθηταῖς αὐτοῦ ὁ Ἰησοῦς εἰς τὸ ⸀πλοῖον ἀλλὰ μόνοι οἱ μαθηταὶ αὐτοῦ ἀπῆλθον·
base_translation:
  language: en
  yaml_path: translation/nt/john/006/022.yaml
  text: On the next day[a], the crowd that had been standing on the other side of the sea saw that no other small boat had been there except one, and that Jesus had not gone with his disciples into the boat[b], but that his disciples had gone away alone.
translation:
  language: vi
  text: Ngày hôm sau, đám đông vẫn còn ở bên kia biển thấy rằng tại đó không có chiếc thuyền nhỏ nào khác ngoài một chiếc[a], và Đức Giê-su đã không cùng các môn đồ đi vào thuyền[b], nhưng các môn đồ của Ngài đã ra đi một mình.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “thuyền”; πλοιάριον trong tiếng Hy Lạp có hình thức giảm nhẹ.
    reason: lexical_alternative
  - marker: b
    text: Một số thủ bản và ấn bản có cách đọc khác nhau giữa “thuyền nhỏ” (πλοιάριον) và “thuyền” (πλοῖον) trong câu này; bản dịch phản ánh cách đọc của bản văn Hy Lạp được in ở từng mệnh đề.
    reason: textual_variant
lexical_decisions:
- source_word: Τῇ ἐπαύριον
  choice: Ngày hôm sau
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt cho cụm chỉ thời gian mở đầu sự việc của ngày kế tiếp.
- source_word: ὁ ὄχλος ὁ ἑστηκὼς
  choice: đám đông vẫn còn ở
  rationale: Phân từ hoàn thành ἑστηκώς nhấn mạnh trạng thái tiếp diễn do hành động trước đó tạo nên; “vẫn còn ở” diễn đạt tự nhiên hơn “đã đứng” trong ngữ cảnh này.
- source_word: πέραν τῆς θαλάσσης
  choice: ở bên kia biển
  rationale: Phản ánh vị trí ở phía đối diện của biển và phù hợp với cách kể địa lý trong sách Giăng.
- source_word: εἶδον
  choice: thấy rằng
  rationale: Giữ nghĩa tri nhận trực tiếp của động từ; hai mệnh đề ὅτι sau đó nêu nội dung họ nhận thấy.
- source_word: πλοιάριον
  choice: chiếc thuyền nhỏ
  rationale: Giữ sắc thái hình thái giảm nhẹ của πλοιάριον mà vẫn tự nhiên trong tiếng Việt.
- source_word: ἄλλο οὐκ ἦν ἐκεῖ εἰ μὴ ἕν
  choice: tại đó không có chiếc thuyền nhỏ nào khác ngoài một chiếc
  rationale: Bảo toàn ý loại trừ và sự nhấn mạnh rằng chỉ có một chiếc hiện diện.
- source_word: οὐ συνεισῆλθεν ... εἰς τὸ πλοῖον
  choice: đã không cùng các môn đồ lên thuyền
  rationale: “Cùng ... lên thuyền” diễn đạt tự nhiên hành động đi vào thuyền với người khác, giữ yếu tố đồng hành của động từ ghép.
- source_word: μόνοι
  choice: chỉ các môn đồ Ngài ... mà thôi
  rationale: Cấu trúc “chỉ ... mà thôi” làm rõ rằng các môn đồ ra đi không có Đức Chúa Jêsus đi cùng.
- source_word: ἀπῆλθον
  choice: đi
  rationale: Trong kết cấu đối chiếu, “đi mà thôi” gọn và tự nhiên, truyền đạt việc họ rời khỏi nơi ấy.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “vẫn còn ở” để chuyển tải trạng thái của phân từ hoàn thành mà không tạo ấn tượng rằng đám đông chỉ đang đứng theo nghĩa tư thế. Giữ sự phân biệt giữa “thuyền nhỏ” và “thuyền” theo SBLGNT, đồng thời đưa thông tin dị bản vào chú thích.
