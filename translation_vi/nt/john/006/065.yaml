source:
  edition: SBLGNT
  text: καὶ ἔλεγεν· Διὰ τοῦτο εἴρηκα ὑμῖν ὅτι οὐδεὶς δύναται ἐλθεῖν πρός με ἐὰν μὴ ᾖ δεδομένον αὐτῷ ἐκ τοῦ ⸀πατρός.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/065.yaml
  text: And he was saying[b][a], “For this reason I have told you that no one is able to come to me unless it has been given to him from the Father.”
translation:
  language: vi
  text: 'Ngài nói: “Chính vì thế, tôi đã bảo anh em rằng không ai có thể đến với tôi, trừ khi điều ấy được ban cho người ấy từ Cha.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγεν
  choice: Ngài vẫn nói
  rationale: Thì chưa hoàn thành gợi hành động nói đang tiếp diễn trong mạch diễn từ; “vẫn nói” giữ sắc thái ấy mà tự nhiên trong tiếng Việt.
- source_word: Διὰ τοῦτο
  choice: Chính vì thế
  rationale: Cụm này quy chiếu về điều vừa được trình bày và dẫn vào lời giải thích; “chính vì thế” giữ rõ lực liên kết.
- source_word: εἴρηκα
  choice: tôi đã bảo
  rationale: Thì hoàn thành chỉ lời đã nói vẫn có hiệu lực trong hiện tại; “đã bảo” tự nhiên khi Chúa Giê-su trực tiếp nói với các môn đồ.
- source_word: οὐδεὶς δύναται
  choice: không ai có thể
  rationale: Diễn đạt sự bất khả hoặc thiếu khả năng, không chỉ là không được phép.
- source_word: ἐλθεῖν πρός με
  choice: đến với tôi
  rationale: Cách nói tự nhiên, đồng thời không giải nghĩa quá mức hàm ý quan hệ và đức tin trong văn mạch Giăng.
- source_word: ἐὰν μὴ ᾖ δεδομένον
  choice: nếu điều ấy không được ban cho
  rationale: Giữ cấu trúc bị động và ý nghĩa cơ bản của δίδωμι; “điều ấy” đại diện cho nội dung được ban mà nguyên văn không nói rõ hơn.
- source_word: αὐτῷ
  choice: người đó
  rationale: Đại từ giống đực số ít trong tiếng Hy Lạp có nghĩa khái quát; “người đó” giữ số ít và tính quy chiếu cá nhân mà không tạo giới tính không có tính bắt buộc trong tiếng Việt.
- source_word: ἐκ τοῦ πατρός
  choice: từ Cha
  rationale: “Từ” giữ nghĩa nguồn gốc của ἐκ tốt hơn cách diễn đạt thuần tác nhân; “Cha” trong văn mạch chỉ Đức Chúa Trời là Cha.
theological_decisions:
- issue: Sự ban cho từ Cha và khả năng đến với Chúa Giê-su
  choice: Khẳng định không ai có thể đến với Chúa Giê-su nếu điều ấy không được ban cho người đó từ Cha.
  alternative: Diễn giải sự ban cho là sự lôi kéo hữu hiệu, hoặc là ân điển đi trước dành cho mọi người.
  rationale: Câu Hy Lạp nêu một điều kiện cần thiết nhưng không tự giải quyết bản chất, phạm vi hay cách thức của sự ban cho; bản dịch giữ nguyên căng thẳng thần học.
- issue: Nội dung ngầm hiểu của δεδομένον
  choice: Dùng “điều ấy” mà không bổ sung cụ thể điều được ban là gì.
  alternative: Dịch diễn giải là “khả năng ấy”, “đặc ân ấy” hoặc “quyền ấy”.
  rationale: Nguyên văn dùng dạng trung tính số ít và để nội dung được ban phụ thuộc vào văn mạch; thêm một danh từ cụ thể sẽ thu hẹp sự mơ hồ chân thực.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Giữ đại từ tự xưng “tôi” trong lời Chúa Giê-su theo lối tiếng Việt tự nhiên; “Ngài” ở lời dẫn biểu thị sự kính trọng. Không thêm chú thích vì các sắc thái cần thiết đã có thể được thể hiện trực tiếp mà không gây nặng câu.
