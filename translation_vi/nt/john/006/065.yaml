revisions:
- from: 'Ngài vẫn nói: “Chính vì thế, tôi đã bảo anh em rằng không ai có thể đến với tôi nếu điều ấy không được ban cho người đó từ Cha.”'
  to: 'Ngài nói: “Chính vì thế, tôi đã bảo anh em rằng không ai có thể đến với tôi, trừ khi điều ấy được ban cho người ấy từ Cha.”'
  rationale: 'Bản sửa chỉ điều chỉnh hai điểm diễn đạt. “Ngài nói” tránh áp đặt ý ‘vẫn’ lên ἔλεγεν. “Trừ khi” tái hiện rõ điều kiện ἐὰν μή mà không thay đổi ý nghĩa thần học hay xác định thêm ‘điều ấy’ là gì. Không cần chú thích: tiếng Việt không đánh dấu giống đực của αὐτῷ, và cách dịch vẫn bảo toàn tính quy chiếu cá nhân, số ít, nhưng khái quát.'
  reviewer_model: gpt-5.6-terra
