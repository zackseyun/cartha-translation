source:
  edition: SBLGNT
  text: ἤθελον οὖν λαβεῖν αὐτὸν εἰς τὸ πλοῖον, καὶ εὐθέως ⸂ἐγένετο τὸ πλοῖον⸃ ἐπὶ τῆς γῆς εἰς ἣν ὑπῆγον.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/021.yaml
  text: So they were willing to take him into the boat[a], and immediately the boat was at the land to which they were going.
translation:
  language: vi
  text: Vì vậy, họ sẵn lòng đón Người lên thuyền, và ngay lập tức thuyền đã đến đất liền, nơi họ đang hướng tới.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “và ngay lập tức thuyền đã ở tại vùng đất họ đang hướng tới.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤθελον
  choice: họ sẵn lòng
  rationale: Thể chưa hoàn thành của θέλω ở đây tự nhiên diễn tả thái độ sẵn lòng hoặc sẵn sàng sau khi nỗi sợ lắng xuống, hơn là chỉ một ước muốn nhất thời.
- source_word: οὖν
  choice: Vì vậy
  rationale: οὖν nối câu này như hệ quả của diễn biến ngay trước đó; “Vì vậy” rõ ràng, tự nhiên và giữ được quan hệ suy luận.
- source_word: λαβεῖν αὐτὸν εἰς τὸ πλοῖον
  choice: đón Người vào thuyền
  rationale: λαμβάνω có thể mang nghĩa “cầm/lấy” hoặc “tiếp nhận”; trong bối cảnh đưa Chúa Giê-su lên thuyền, “đón Người vào thuyền” là cách nói tự nhiên và thể hiện sắc thái tiếp nhận.
- source_word: πλοῖον
  choice: thuyền
  rationale: Trong bối cảnh Biển Ga-li-lê, “thuyền” phù hợp với loại phương tiện và tự nhiên hơn “tàu”.
- source_word: εὐθέως
  choice: ngay lập tức
  rationale: Giữ nguyên tính tức thời và sự đột ngột của εὐθέως, kể cả hàm ý kỳ diệu có thể có trong trình thuật.
- source_word: ἐγένετο τὸ πλοῖον ἐπὶ τῆς γῆς
  choice: thuyền đã ở nơi đất liền
  rationale: Cách dịch này bám sát cấu trúc chỉ trạng thái/vị trí của tiếng Hy Lạp và không biến câu thành lời giải thích rằng thuyền chỉ đơn thuần cập bờ; “nơi đất liền” tránh gợi ý sai rằng thuyền nằm hẳn trên cạn.
- source_word: γῆς
  choice: đất liền
  rationale: γῆ ở đây chỉ phần đất tại điểm đến. “Đất liền” gần nghĩa gốc, còn “bờ” là cách hiểu theo ngữ cảnh được giữ trong chú thích.
- source_word: εἰς ἣν ὑπῆγον
  choice: mà họ đang đi đến
  rationale: Diễn đạt tự nhiên mệnh đề quan hệ và giữ nét tiếp diễn của ὑπῆγον, tức họ đang hướng về điểm đến ấy.
theological_decisions:
- issue: Có nên diễn đạt mệnh đề thứ hai theo cách giải thích hoặc làm nhẹ tính tức thời dường như mang tính phép lạ hay không
  choice: 'Giữ cách nói trực tiếp: “ngay lập tức thuyền đã ở nơi đất liền”'
  alternative: “ngay lập tức thuyền cập bờ” hoặc “chẳng bao lâu thuyền đến đất liền”
  rationale: Nguyên văn kể sự việc ngắn gọn và nhấn mạnh tính tức thời. Bản dịch giữ nguyên sức căng của trình thuật, không giải thích phép lạ cũng không làm giảm sự đột ngột.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Đại từ “Người” giữ sự tôn kính dành cho Chúa Giê-su mà không thêm tước hiệu không có trong nguyên văn. Dấu chú thích [a] được đặt sau toàn bộ mệnh đề có phương án dịch khác.
