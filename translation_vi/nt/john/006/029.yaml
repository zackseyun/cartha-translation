  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀπεκρίθη ⸀ὁ Ἰησοῦς καὶ εἶπεν αὐτοῖς· Τοῦτό ἐστιν τὸ ἔργον τοῦ θεοῦ ἵνα ⸀πιστεύητε εἰς ὃν ἀπέστειλεν ἐκεῖνος.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/029.yaml
  text: 'Jesus answered and said to them[b][a], “This is the work of God: that you believe in the one whom he has sent.”'
translation:
  language: vi
  text: 'Đức Giê-su đáp lời họ: “Đây là công việc của Đức Chúa Trời[a]: anh em tin vào[b] Đấng Ngài đã sai.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể hiểu là “công việc Đức Chúa Trời đòi hỏi” hoặc “công việc Đức Chúa Trời thực hiện”. Cụm từ Hy Lạp “công việc của Đức Chúa Trời” có thể được hiểu theo nhiều cách, nên chính văn giữ nguyên sự mơ hồ này.
    reason: alternative_reading
  - marker: b
    text: Hay “tin cậy nơi Đấng Ngài đã sai”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη ὁ Ἰησοῦς καὶ εἶπεν αὐτοῖς
  choice: Đức Giê-su đáp lời họ
  rationale: Tiếng Hy Lạp dùng hai động từ theo công thức kể chuyện, nghĩa đen là “đáp và nói với họ”. “Đáp lời họ” diễn đạt tự nhiên trong tiếng Việt mà vẫn giữ ý đây là lời đáp trực tiếp.
- source_word: Τοῦτό ἐστιν
  choice: Đây là
  rationale: Phản ánh trực tiếp đại từ chỉ định và động từ nối, đồng thời giữ sự nhấn mạnh ở đầu câu.
- source_word: τὸ ἔργον τοῦ θεοῦ
  choice: công việc của Đức Chúa Trời
  rationale: Cách dịch sát cấu trúc sở hữu trong nguyên văn và không tự ý quyết định đó là công việc Đức Chúa Trời đòi hỏi hay công việc chính Ngài thực hiện.
- source_word: ἵνα πιστεύητε
  choice: anh em tin
  rationale: Trong cấu trúc này, ἵνα giới thiệu nội dung của “công việc”. “Anh em tin” tự nhiên hơn lối dịch máy móc “để anh em có thể tin” và phù hợp với số nhiều của động từ.
- source_word: εἰς ὃν
  choice: vào Đấng
  rationale: πιστεύω εἰς thường có nghĩa là “tin vào”. “Đấng” diễn đạt trang trọng và tự nhiên đối với một nhân vật chưa được nêu tên trong mệnh đề.
- source_word: ἀπέστειλεν ἐκεῖνος
  choice: Ngài đã sai đến
  rationale: “Đã sai đến” thể hiện hành động sai phái trong quá khứ và đích đến ngầm là thế gian/nơi người nghe. “Ngài” quy chiếu tự nhiên về Đức Chúa Trời.
theological_decisions:
- issue: Ý nghĩa của sở hữu cách trong τὸ ἔργον τοῦ θεοῦ
  choice: Giữ cụm từ mơ hồ “công việc của Đức Chúa Trời” trong chính văn.
  alternative: “công việc Đức Chúa Trời đòi hỏi” hoặc “công việc Đức Chúa Trời thực hiện”
  rationale: Sở hữu cách Hy Lạp có thể chỉ công việc thuộc về/được thực hiện bởi Đức Chúa Trời, hoặc công việc Ngài đòi hỏi con người làm. Ngữ cảnh không buộc bản dịch phải loại bỏ một trong hai khả năng.
- issue: Sắc thái của πιστεύω εἰς
  choice: Dịch là “tin vào”.
  alternative: “tin cậy nơi”
  rationale: “Tin vào” là cách diễn đạt chuẩn, rõ và nhất quán cho cấu trúc này trong Giăng; “tin cậy nơi” làm nổi bật sắc thái phó thác nhưng không cần đưa vào chính văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Trời”, “Đức Giê-su”, “Ngài” và đại từ số nhiều “anh em”. Hai dấu chú thích đều xuất hiện trong chính văn; [a] gắn với cụm từ mơ hồ và [b] gắn với lựa chọn từ vựng “tin vào”.
