  text: πᾶν ὃ δίδωσίν μοι ὁ πατὴρ πρὸς ἐμὲ ἥξει, καὶ τὸν ἐρχόμενον πρός ⸀με οὐ μὴ ἐκβάλω ἔξω,
base_translation:
  language: en
  yaml_path: translation/nt/john/006/037.yaml
  text: All that the Father gives me will come to me[b][a], and the one who comes to me I will certainly not cast out.
translation:
  language: vi
  text: Tất cả những gì Cha ban cho tôi sẽ đến với tôi, và người đến với tôi, tôi nhất định sẽ không đuổi người ấy ra ngoài.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “tôi sẽ không bao giờ đuổi người ấy ra ngoài.” Cấu trúc Hy Lạp là một phủ định nhấn mạnh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶν ὃ
  choice: tất cả những gì
  rationale: Giữ sắc thái tập hợp của cụm trung tính số ít trong tiếng Hy Lạp, thay vì diễn giải trực tiếp thành “tất cả những người mà”.
- source_word: δίδωσίν μοι
  choice: ban cho tôi
  rationale: Thì hiện tại được chuyển bằng hiện tại đơn; “ban” tự nhiên và trang trọng khi nói về hành động của Cha.
- source_word: ὁ πατήρ
  choice: Cha
  rationale: Không thêm đại từ sở hữu vốn không có trong nguyên văn; cách gọi không mạo từ tự nhiên hơn trong tiếng Việt khi dùng như danh xưng.
- source_word: πρὸς ἐμὲ ἥξει
  choice: sẽ đến với tôi
  rationale: Diễn đạt tự nhiên động từ ἥκω và giữ mô-típ “đến với” Chúa Giê-su trong văn mạch.
- source_word: τὸν ἐρχόμενον πρός με
  choice: người đến với tôi
  rationale: Phản ánh phân từ hiện tại có mạo từ với nghĩa khái quát mà không thêm ý vượt quá nguyên văn.
- source_word: οὐ μὴ ἐκβάλω ἔξω
  choice: tôi chắc chắn sẽ không xua đuổi ra ngoài
  rationale: “Chắc chắn sẽ không” thể hiện phép phủ định nhấn mạnh οὐ μή; “xua đuổi ra ngoài” truyền đạt cả ἐκβάλλω lẫn trạng từ ἔξω.
theological_decisions:
- issue: Cụm trung tính tập hợp πᾶν ὃ trong mối liên hệ giữa việc Cha ban và việc đến với Chúa Giê-su
  choice: Dịch là “tất cả những gì Cha ban cho tôi”, giữ hình thức tập hợp.
  alternative: “tất cả những người Cha ban cho tôi”
  rationale: Nguyên văn dùng trung tính số ít tập hợp. Bản dịch không tự ý cá nhân hóa cụm từ, nhờ đó giữ nguyên sự căng thẳng thần học giữa tập thể và từng cá nhân.
- issue: Mức độ nhấn mạnh trong lời hứa οὐ μὴ ἐκβάλω ἔξω
  choice: “tôi chắc chắn sẽ không xua đuổi ra ngoài”
  alternative: “tôi sẽ không bao giờ xua đuổi ra ngoài”
  rationale: Cách dịch thể hiện rõ phép phủ định mạnh nhưng không mở rộng câu thành một công thức giáo lý về sự bền đỗ hay bội đạo.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “tôi” trong lời Chúa Giê-su để phù hợp văn phong phổ thông và tránh áp đặt truyền thống giáo phái; dấu chấm phẩy làm rõ hai vế song song. Dấu chú thích [a] được đặt ngay sau mệnh đề mà chú thích giải thích.
