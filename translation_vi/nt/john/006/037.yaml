revisions:
- from: Tất cả những gì Cha ban cho tôi sẽ đến với tôi; còn người đến với tôi, tôi chắc chắn sẽ không xua đuổi ra ngoài.[a]
  to: Tất cả những gì Cha ban cho tôi sẽ đến với tôi, và người đến với tôi, tôi nhất định sẽ không đuổi người ấy ra ngoài.[a]
  rationale: Sửa liên từ để phản ánh quan hệ nối kết thông thường của καὶ, và chỉnh vế sau thành tiếng Việt tự nhiên hơn. Bản sửa vẫn giữ cụm tập hợp trung tính ở vế đầu, nghĩa khái quát của phân từ ở vế sau, và sự nhấn mạnh mạnh mẽ của οὐ μὴ; không giải quyết thay bất cứ tranh luận thần học nào.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T06:20:16Z'
review_pass:
  verdict: revise
  source_fidelity: Bản dịch giữ đúng cụm trung tính tập hợp πᾶν ὃ bằng “Tất cả những gì”, thì hiện tại của δίδωσιν bằng “ban”, và tương lai của ἥξει bằng “sẽ đến”. Tuy nhiên, “còn” có thể gợi tương phản mạnh hơn liên từ καὶ, trong khi vế sau của câu Hy Lạp là sự bổ sung/đảm bảo song hành. Cách diễn đạt phủ định nhấn mạnh nên được điều chỉnh để vừa tự nhiên vừa giữ lực của οὐ μὴ ἐκβάλω ἔξω.
  naturalness: '“Người đến với tôi, tôi chắc chắn sẽ không xua đuổi ra ngoài” hiểu được nhưng hơi gượng: chủ ngữ được nêu lại mà không có đại từ quy chiếu ở tân ngữ, và “xua đuổi ra ngoài” kém tự nhiên hơn “đuổi người ấy ra ngoài”. “Tôi nhất định sẽ không đuổi người ấy ra ngoài” là tiếng Việt hiện đại, rõ ràng và vẫn trang trọng.'
  terminology: “Cha” là danh xưng phù hợp với cách dùng Giăng; “ban cho tôi” và “đến với tôi” đều phù hợp. Không cần cá nhân hóa cụm trung tính đầu câu. “Người ấy” ở vế sau chỉ làm rõ tân ngữ đã được nêu bằng phân từ có mạo từ, không thay đổi ý nghĩa hay áp đặt diễn giải thần học.
  issues:
  - severity: low
    issue: Liên từ “còn” diễn đạt καὶ
    rationale: καὶ ở đây nối hai khẳng định; “và” trung tính hơn, tránh gợi một đối lập không được đánh dấu trong nguyên văn.
  - severity: medium
    issue: Diễn đạt “tôi chắc chắn sẽ không xua đuổi ra ngoài”
    rationale: Câu tiếng Việt hơi thiếu tự nhiên và không nêu tân ngữ của hành động đuổi. Dùng “tôi nhất định sẽ không đuổi người ấy ra ngoài” truyền đạt rõ phân từ τὸν ἐρχόμενον và phủ định nhấn mạnh οὐ μή, đồng thời giữ lực của ἔξω.
  revised_text: Tất cả những gì Cha ban cho tôi sẽ đến với tôi, và người đến với tôi, tôi nhất định sẽ không đuổi người ấy ra ngoài.[a]
