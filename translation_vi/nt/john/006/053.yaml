revisions:
- from: 'Vì vậy, Đức Chúa Jêsus phán với họ: “Thật, thật, tôi nói với các ông: nếu các ông không ăn thịt của Con Người[a] và uống huyết Ngài, thì các ông không có sự sống trong chính mình[b].”'
  to: 'Vì thế, Giê-su nói với họ: “Quả thật, quả thật, tôi nói với các ông: nếu các ông không ăn thịt[a] của Con Người và uống máu của Người, thì các ông không có sự sống[b] trong các ông.”'
  rationale: Bản sửa bảo toàn tính cụ thể, không diễn giải của nguyên văn, đồng thời dùng chính tả và từ vựng tiếng Việt hiện đại. Danh xưng được giới hạn ở điều nguồn văn có, và các dấu neo chú thích được chuyển đúng đến từ/cụm từ mà mỗi chú thích giải thích.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T06:20:47Z'
review_pass:
  verdict: revise
  source_fidelity: Bản thảo giữ đúng cấu trúc điều kiện phủ định, các từ then chốt “ăn,” “thịt,” “uống,” “máu/huyết,” và “sự sống,” không thêm “đời đời” hay giải thích bí tích. Tuy nhiên, “Đức Chúa Jêsus” thêm tước hiệu không có trong ὁ Ἰησοῦς và lối chính tả “Jêsus” không phải chuẩn hiện đại; “trong chính mình” cũng kém sát số nhiều của ἐν ἑαυτοῖς.
  naturalness: 'Cần chỉnh nhẹ sang tiếng Việt chuẩn hiện đại: “Quả thật, quả thật” là công thức trang trọng tự nhiên hơn “Thật, thật”; “máu” tự nhiên hơn “huyết” khi đứng độc lập; và “trong các ông” diễn đạt rõ đối tượng số nhiều. Văn phong vẫn giữ được tính trang trọng của lời tuyên bố.'
  terminology: Giữ “Con Người” cho ὁ υἱὸς τοῦ ἀνθρώπου và “thịt” cho σάρξ. Dùng “Giê-su” theo chính tả hiện đại và không thêm danh hiệu “Đức Chúa”; dùng “máu” cho αἷμα trong bản văn hiện đại. Các chú thích cần được neo ngay sau “thịt” và “sự sống”, là các từ chúng giải thích.
  issues:
  - severity: medium
    issue: Danh xưng và chính tả “Đức Chúa Jêsus”
    rationale: Nguyên văn chỉ có ὁ Ἰησοῦς, không có τίτλος “Chúa”. Việc thêm danh hiệu làm tăng nội dung so với nguồn; “Giê-su” là chính tả hiện đại thông dụng hơn “Jêsus”.
  - severity: low
    issue: Công thức “Thật, thật” chưa tự nhiên
    rationale: Ἀμὴν ἀμὴν cần giữ lặp lại và sắc thái long trọng. “Quả thật, quả thật” là cách diễn đạt tiếng Việt Kinh Thánh tự nhiên hơn mà không giảm sự nhấn mạnh.
  - severity: low
    issue: Các dấu neo chú thích đặt sai cụm từ được chú giải
    rationale: Chú thích a giải thích σάρξ/thịt nhưng hiện neo sau “Con Người”; chú thích b giải thích ζωὴ/“sự sống” nhưng hiện neo cuối cụm “trong chính mình”. Cần đặt lại để người đọc nhận biết đúng phạm vi chú giải.
  - severity: low
    issue: “Trong chính mình” không phản ánh rõ số nhiều
    rationale: ἑαυτοῖς là phản thân số nhiều, quy về “các ông”. “Trong các ông” rõ và tự nhiên hơn trong tiếng Việt.
