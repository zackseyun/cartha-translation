id: JHN.6.53
reference: John 6:53
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἶπεν οὖν αὐτοῖς ὁ Ἰησοῦς· Ἀμὴν ἀμὴν λέγω ὑμῖν, ἐὰν μὴ φάγητε τὴν σάρκα τοῦ υἱοῦ τοῦ ἀνθρώπου καὶ πίητε αὐτοῦ τὸ αἷμα, οὐκ ἔχετε ζωὴν ἐν ἑαυτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/053.yaml
  text: So Jesus said to them[a], “Truly, truly, I say to you, unless you eat the flesh of the Son of Man and drink his blood[b], you do not have life in yourselves.”
translation:
  language: vi
  text: 'Vì thế, Giê-su nói với họ: “Quả thật, quả thật, tôi nói với các ông: nếu các ông không ăn thịt[a] của Con Người và uống máu của Người, thì các ông không có sự sống[b] trong các ông.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn Hy Lạp dùng từ “thịt” (σάρξ), không phải “thân thể”; cách nói này giữ nguyên tính cụ thể và mạnh mẽ của lời tuyên bố.
    reason: lexical_alternative
  - marker: b
    text: Câu này chỉ nói “sự sống”, không nói rõ “sự sống đời đời”, dù văn mạch rộng hơn trong sách Giăng thường liên kết sự sống này với sự sống đời đời.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Vì vậy
  rationale: Diễn đạt quan hệ hệ quả với lời bàn luận trước đó, đồng thời tự nhiên trong văn xuôi tiếng Việt.
- source_word: Ἀμὴν ἀμὴν
  choice: Thật, thật
  rationale: Giữ sự lặp lại trang trọng và nhấn mạnh đặc trưng trong các lời tuyên bố của Đức Chúa Jêsus ở sách Giăng.
- source_word: ἐὰν μὴ
  choice: nếu ... không
  rationale: Cấu trúc điều kiện phủ định tự nhiên trong tiếng Việt và sát nghĩa nguồn.
- source_word: φάγητε
  choice: ăn
  rationale: Giữ nghĩa cụ thể, trực tiếp và hình ảnh gây ấn tượng mạnh của động từ Hy Lạp.
- source_word: σάρκα
  choice: thịt
  rationale: σάρξ ở đây chỉ flesh theo nghĩa cụ thể; “thịt” giữ được sức nặng trực diện hơn “thân thể” và không đưa trước một cách hiểu bí tích.
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: của Con Người
  rationale: Giữ danh xưng quen thuộc của Đức Chúa Jêsus và âm hưởng Đa-ni-ên/cứu thế của nguyên văn.
- source_word: πίητε
  choice: uống
  rationale: Bản dịch trực tiếp, duy trì sự song hành cụ thể với “ăn”.
- source_word: αἷμα
  choice: huyết
  rationale: “Huyết” là từ Kinh Thánh trang trọng nhưng vẫn dễ hiểu, giữ nguyên hình ảnh mạnh mẽ của nguyên văn.
- source_word: ζωὴν
  choice: sự sống
  rationale: Nguyên văn chỉ nói “sự sống”, không có tính từ “đời đời”; không nên thêm ý dù văn mạch rộng hơn liên hệ đến sự sống đời đời.
- source_word: ἐν ἑαυτοῖς
  choice: trong chính mình
  rationale: Phản ánh trực tiếp cụm giới từ và nhấn mạnh việc không có sự sống nơi bản thân họ.
theological_decisions:
- issue: Nên dịch theo nghĩa đen hay diễn giải ngôn ngữ ăn thịt và uống huyết
  choice: Giữ cách nói cụ thể “ăn thịt ... và uống huyết”
  alternative: Diễn giải là “dự phần”, “tiếp nhận”, hoặc dùng ngôn ngữ minh nhiên về Tiệc Thánh
  rationale: Nguyên văn cố ý cụ thể và gây sửng sốt. Cách dịch này bảo tồn sự căng thẳng giữa các cách hiểu bí tích, ẩn dụ, hoặc kết hợp mà không quyết định thay cho người đọc.
- issue: Có nên mở rộng ζωὴν thành “sự sống đời đời” hay không
  choice: Dịch đơn giản là “sự sống”
  alternative: “sự sống đời đời”
  rationale: Tính từ “đời đời” không có trong câu này; thêm vào sẽ biến hàm ý theo văn mạch thành nội dung minh nhiên.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ “Đức Chúa Jêsus”, “phán” và “huyết” theo sắc thái Kinh Thánh trang nghiêm; dùng “các ông” phù hợp với đối tượng số nhiều trong cuộc đối thoại. Các dấu chú thích được đặt ngay sau những cụm từ mà chúng giải thích.
