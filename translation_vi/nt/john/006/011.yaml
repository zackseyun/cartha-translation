revisions:
- from: Vậy, Đức Chúa Jêsus cầm lấy những ổ bánh, tạ ơn rồi phân phát cho những người đang ngồi ăn[a]; Ngài cũng làm như vậy với cá[b], cho họ ăn bao nhiêu tùy thích.
  to: Vậy, Đức Giê-su lấy các ổ bánh, tạ ơn rồi phân phát cho những người đang ngả mình dùng bữa[a]; Ngài cũng phân phát cá cho họ, tùy họ muốn bao nhiêu[b].
  rationale: Bản sửa đưa tên riêng về chính tả Việt ngữ hiện đại và không thêm tước hiệu ngoài nguyên văn. Đồng thời, bản sửa giữ trong chính văn tư thế “ngả mình” của ἀνακειμένοις, lặp rõ hành động phân phát đối với cá, và diễn đạt ὅσον ἤθελον là lượng tùy theo điều người ăn muốn. Chú thích duy trì các phương án từ vựng và bối cảnh lịch sử cần thiết.
