id: JHN.6.11
reference: John 6:11
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἔλαβεν ⸀οὖν τοὺς ἄρτους ὁ Ἰησοῦς καὶ εὐχαριστήσας ⸀διέδωκεν τοῖς ἀνακειμένοις, ὁμοίως καὶ ἐκ τῶν ὀψαρίων ὅσον ἤθελον.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/011.yaml
  text: So Jesus took the loaves[a], and after giving thanks he distributed them to those who were reclining; likewise also from the fish[b], as much as they wanted.
translation:
  language: vi
  text: Vậy, Đức Giê-su lấy các ổ bánh, tạ ơn rồi phân phát cho những người đang ngả mình dùng bữa[a]; Ngài cũng phân phát cá cho họ, tùy họ muốn bao nhiêu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc dịch: “những người đang ngồi ăn.” Dịch sát là “những người đang ngả mình”; đây là tư thế thường thấy khi dùng bữa vào thời đó.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “cá nhỏ.” Từ Hy Lạp có thể chỉ cá dùng kèm với bánh, có lẽ là cá nhỏ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Vậy
  rationale: Đánh dấu bước tiếp diễn trong mạch tường thuật và có sắc thái hệ quả nhẹ; “Vậy” tự nhiên mà vẫn giữ lực liên kết.
- source_word: τοὺς ἄρτους
  choice: những ổ bánh
  rationale: Dạng số nhiều trong bối cảnh này chỉ các ổ bánh riêng biệt; cách diễn đạt cụ thể và tự nhiên hơn chỉ nói “bánh”.
- source_word: εὐχαριστήσας
  choice: tạ ơn rồi
  rationale: Giữ đúng ý tạ ơn và thể hiện hành động xảy ra trước việc phân phát, nhưng không thêm đối tượng “Đức Chúa Trời” vốn không được nêu trực tiếp.
- source_word: διέδωκεν
  choice: phân phát
  rationale: Diễn đạt rõ sắc thái chia và trao cho nhiều người của διαδίδωμι.
- source_word: τοῖς ἀνακειμένοις
  choice: cho những người đang ngồi ăn
  rationale: ἀνάκειμαι chỉ tư thế nằm tựa khi dùng bữa theo phong tục thời đó. “Ngồi ăn” chuyển tải chức năng trong ngữ cảnh bằng tiếng Việt tự nhiên; nghĩa đen được giữ ở chú thích.
- source_word: ὁμοίως καὶ
  choice: Ngài cũng làm như vậy
  rationale: Thể hiện đầy đủ sự song song có nhấn mạnh giữa việc phân phát bánh và cá, đồng thời tránh câu tiếng Việt gượng.
- source_word: ἐκ τῶν ὀψαρίων
  choice: với cá
  rationale: ὀψάριον có thể chỉ cá dùng kèm bánh, có lẽ là cá nhỏ; “cá” là cách dịch tự nhiên nhất và không xác định quá mức.
- source_word: ὅσον ἤθελον
  choice: cho họ ăn bao nhiêu tùy thích
  rationale: Diễn đạt rõ lượng thức ăn không bị giới hạn mà tùy theo ý muốn của những người ăn.
theological_decisions:
- issue: Khả năng εὐχαριστήσας gợi liên tưởng đến Tiệc Thánh trong trình thuật hóa bánh cho nhiều người ăn
  choice: Dịch là “tạ ơn” mà không khai triển ý nghĩa bí tích
  alternative: Dịch là “chúc phước” theo các trình thuật tương ứng hoặc làm rõ ý nghĩa Tiệc Thánh trong chính văn
  rationale: Động từ trực tiếp có nghĩa là “tạ ơn”. Dù văn mạch Giăng có thể gợi âm hưởng Tiệc Thánh, bản dịch không nên đưa cách giải thích bí tích vào chính văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Jêsus” và đại từ “Ngài” theo lối văn Kinh Thánh tiếng Việt quen thuộc; câu được tái cấu trúc nhẹ để giữ tự nhiên mà không làm mất quan hệ giữa các hành động.
