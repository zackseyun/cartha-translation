id: JHN.6.12
reference: John 6:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὡς δὲ ἐνεπλήσθησαν λέγει τοῖς μαθηταῖς αὐτοῦ· Συναγάγετε τὰ περισσεύσαντα κλάσματα, ἵνα μή τι ἀπόληται.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/012.yaml
  text: And when they were filled[a], he says to his disciples, “Gather up the leftover pieces[d][c][b], so that nothing may be lost.”
translation:
  language: vi
  text: 'Khi họ đã ăn no[a], Ngài nói[b] với các môn đồ: “Hãy thu gom những mẩu bánh còn thừa[c], để không thứ gì bị mất[d].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “họ đã được no thỏa” hoặc “họ đã ăn thỏa thích.”'
    reason: lexical_alternative
  - marker: b
    text: 'Bản Hy Lạp dùng thì hiện tại lịch sử: “Ngài nói.” Một số bản dịch làm trơn thành “Ngài đã nói.”'
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “những mảnh vụn.”'
    reason: lexical_alternative
  - marker: d
    text: 'Cũng có thể dịch theo ý trong văn cảnh: “để không thứ gì bị lãng phí.” Bản Hy Lạp sát hơn là “để không thứ gì bị mất.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ
  choice: Khi
  rationale: Diễn đạt tự nhiên quan hệ thời gian của ὡς; δέ chỉ nối tiếp nhẹ trong mạch kể nên không cần chuyển thành một từ riêng.
- source_word: ἐνεπλήσθησαν
  choice: họ đã ăn no
  rationale: Trong ngữ cảnh bữa ăn, cách nói này truyền đạt rõ nghĩa được ăn đến no của thể bị động, tự nhiên hơn lối dịch sát hình thức “được làm đầy”.
- source_word: λέγει
  choice: Ngài nói
  rationale: Giữ thì hiện tại lịch sử của bản Hy Lạp; tiếng Việt có thể dùng “nói” tự nhiên trong lối kể sống động mà không bắt buộc đánh dấu quá khứ.
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: với các môn đồ
  rationale: “Môn đồ” là cách gọi quen thuộc và chính xác trong văn cảnh Phúc Âm; đại từ sở hữu đã được hàm ý rõ qua chủ thể và không cần lặp “của Ngài”.
- source_word: Συναγάγετε
  choice: Hãy thu gom
  rationale: Thể hiện mệnh lệnh trực tiếp và hành động gom nhặt các phần thức ăn còn lại.
- source_word: τὰ περισσεύσαντα κλάσματα
  choice: những mẩu bánh còn thừa
  rationale: κλάσματα là các mẩu đã bẻ ra; ngữ cảnh cho thấy đó là bánh. “Mẩu bánh” tự nhiên, cụ thể, còn περισσεύσαντα được chuyển là “còn thừa”.
- source_word: ἵνα μή τι ἀπόληται
  choice: để không thứ gì bị mất
  rationale: Giữ tương đối sát nghĩa ἀπόλλυμι và đại từ bất định trung tính τι, đồng thời không thu hẹp nghĩa thành chỉ “bị lãng phí”.
theological_decisions:
- issue: Khả năng đọc hàm ý thần học trong ἀπόληται
  choice: bị mất
  alternative: bị lãng phí; bị hư mất
  rationale: Văn cảnh trực tiếp nói về những mẩu bánh còn lại. “Bị mất” bảo toàn phạm vi nghĩa và khả năng vang vọng cách dùng của Giăng mà không áp đặt nghĩa cứu rỗi; “bị lãng phí” quá thiên về diễn giải thực dụng, còn “bị hư mất” dễ làm sắc thái thần học nổi bật quá mức.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Ngài” cho Chúa Giê-su và “môn đồ” theo lối dùng Kinh Thánh phổ biến. Giữ hiện tại lịch sử ở “Ngài nói”; làm rõ κλάσματα là “mẩu bánh” theo văn cảnh.
