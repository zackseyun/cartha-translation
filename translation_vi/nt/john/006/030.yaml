  text: εἶπον οὖν αὐτῷ· Τί οὖν ποιεῖς σὺ σημεῖον, ἵνα ἴδωμεν καὶ πιστεύσωμέν σοι; τί ἐργάζῃ;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/030.yaml
  text: So they said to him[a], “Then what sign are you doing, so that we may see and believe you? What work are you doing?”
translation:
  language: vi
  text: 'Vì vậy, họ nói với Ngài: “Thế thì ông làm dấu lạ gì để chúng tôi thấy và tin ông[a]? Ông làm công việc gì?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể hiểu là “tin lời ông” hoặc “tin cậy ông”. Tiếng Hy Lạp sát nghĩa là “tin ông”, dùng đại từ ở cách gián cách (dative), thay vì cách diễn đạt thường gặp hơn trong sách Giăng là “tin vào [ai đó]”.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπον οὖν αὐτῷ
  choice: Vì vậy, họ nói với Ngài
  rationale: οὖν nối lời chất vấn này với lời tuyên bố trước đó của Chúa Giê-su; “Vì vậy” giữ quan hệ suy luận, còn “nói với Ngài” diễn đạt tự nhiên đại từ gián tiếp αὐτῷ.
- source_word: Τί οὖν
  choice: Thế thì ... gì
  rationale: Giữ lại οὖν lặp lần thứ hai và sắc thái thúc ép, chất vấn của đám đông bằng cách nói tự nhiên trong tiếng Việt.
- source_word: ποιεῖς σὺ σημεῖον
  choice: ông làm dấu lạ gì
  rationale: “Dấu lạ” truyền đạt σημεῖον như một hành động phi thường mang ý nghĩa chỉ dấu, vốn là thuật ngữ quan trọng trong Giăng. Đại từ σὺ được thể hiện bằng “ông” để giữ sự nhấn mạnh và phản ánh cách đám đông trực tiếp chất vấn Chúa Giê-su.
- source_word: ἵνα ἴδωμεν καὶ πιστεύσωμέν σοι
  choice: để chúng tôi thấy và tin lời ông
  rationale: Cấu trúc ἵνα với các động từ giả định chỉ mục đích. “Tin lời ông” diễn đạt πιστεύω với đại từ ở cách dữ liệu σοι, tức tin điều Ngài nói hoặc lời tuyên bố của Ngài, mà không đồng nhất nó với cách nói quen thuộc hơn πιστεύω εἰς, “tin vào”.
- source_word: τί ἐργάζῃ
  choice: Ông làm công việc gì?
  rationale: “Làm công việc” giữ sắc thái lao tác/hành động của ἐργάζομαι và sự song hành có chủ ý với ποιεῖς, dù tiếng Việt vẫn tự nhiên.
theological_decisions:
- issue: Ý nghĩa của πιστεύω với đại từ dữ liệu σοι
  choice: tin lời ông
  alternative: tin ông; tin vào ông; tin cậy ông
  rationale: Nguyên văn dùng σοι ở cách dữ liệu chứ không dùng εἰς với đối cách, là cách diễn đạt thường gặp trong Giăng cho “tin vào.” “Tin lời ông” làm rõ nghĩa tin điều Chúa Giê-su nói mà không áp đặt nghĩa thần học rộng hơn; chú thích bảo tồn các khả năng diễn đạt khác.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Trong lời thoại, “ông” phản ánh thái độ chất vấn của đám đông, còn lời dẫn dùng “Ngài” theo lối kể tôn kính. “Dấu lạ” được dùng nhất quán cho thuật ngữ đặc trưng σημεῖον trong sách Giăng.
