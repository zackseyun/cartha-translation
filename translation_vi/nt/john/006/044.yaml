  rationale: Bản sửa chỉ làm rõ quan hệ «Cha là Đấng đã sai tôi» và chỉnh chú thích từ vựng. Câu chính vẫn bảo toàn tính điều kiện, lực nghĩa mở của ἑλκύσῃ, tham chiếu số ít đại diện của αὐτόν, và lời hứa phục sinh vào ngày sau cùng, không giải quyết thay nguyên văn một vấn đề thần học đang được tranh luận.
