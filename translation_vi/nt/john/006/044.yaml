id: JHN.6.44
reference: John 6:44
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οὐδεὶς δύναται ἐλθεῖν πρός ⸀με ἐὰν μὴ ὁ πατὴρ ὁ πέμψας με ἑλκύσῃ αὐτόν, κἀγὼ ἀναστήσω αὐτὸν ἐν τῇ ἐσχάτῃ ἡμέρᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/044.yaml
  text: No one is able to come to me unless the Father who sent me draws him[b][a], and I will raise him up on the last day.
translation:
  language: vi
  text: Không ai có thể đến với tôi, nếu Cha là Đấng đã sai tôi không kéo người ấy đến; và tôi sẽ làm cho người ấy sống lại trong ngày sau cùng.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐδεὶς δύναται
  choice: Không ai có thể
  rationale: Giữ trọn phủ định phổ quát của οὐδεὶς và ý nghĩa rõ ràng về khả năng của δύναται, đồng thời tự nhiên trong tiếng Việt.
- source_word: ἐλθεῖν πρός με
  choice: đến với tôi
  rationale: Diễn đạt tự nhiên chuyển động hướng đến Chúa Giê-su và giữ được sắc thái quan hệ trong văn mạch, không diễn giải quá mức.
- source_word: ἐὰν μὴ
  choice: nếu ... không
  rationale: Cấu trúc điều kiện này phù hợp tự nhiên với cú pháp tiếng Việt; cách diễn đạt giữ nguyên điều kiện cần được câu Hy Lạp nêu ra.
- source_word: ὁ πατὴρ ὁ πέμψας με
  choice: Cha, Đấng đã sai tôi
  rationale: Dùng mệnh đề đồng vị trang trọng để chuyển tải phân từ có mạo từ, đồng thời giữ danh xưng προσωπικό 'Cha'.
- source_word: ἑλκύσῃ
  choice: kéo ... đến
  rationale: “Kéo” giữ hình ảnh gây ra chuyển động và có thể bao hàm lực tác động, nhưng không tự ý quyết định mức độ cưỡng bức. Thêm “đến” giúp câu tiếng Việt rõ đích đến đã hàm chứa trong văn mạch.
- source_word: αὐτόν
  choice: người ấy
  rationale: Tiếng Việt không có đại từ giống đực tương ứng bắt buộc ở đây. “Người ấy” giữ số ít, chỉ lại 'không ai' theo nghĩa đại diện và áp dụng cho mọi người, không thêm giới tính mà nguyên ngữ không nhằm nhấn mạnh.
- source_word: κἀγὼ
  choice: và tôi
  rationale: Giữ liên từ καί và chủ ngữ ἐγώ được nêu rõ; trật tự tiếng Việt truyền đạt đủ sự nhấn mạnh mà không cần thêm “chính”.
- source_word: ἀναστήσω αὐτόν
  choice: tôi sẽ làm cho người ấy sống lại
  rationale: Diễn đạt rõ nghĩa phục sinh của động từ trong văn mạch Giăng và giữ tương lai; cách nói này tự nhiên hơn “dựng người ấy dậy” trong tiếng Việt hiện đại.
- source_word: ἐν τῇ ἐσχάτῃ ἡμέρᾳ
  choice: trong ngày sau cùng
  rationale: Giữ cách gọi mang tính cánh chung của nguyên ngữ bằng lối diễn đạt trang trọng nhưng dễ hiểu.
theological_decisions:
- issue: Sắc thái của ἑλκύσῃ trong lời dạy về việc đến với Chúa Giê-su
  choice: kéo ... đến
  alternative: lôi; kéo đi
  rationale: Động từ có thể chỉ hành động kéo mạnh trong một số văn cảnh, nhưng chính câu này không giải thích cơ chế hay mức độ cưỡng bức. Bản chính giữ hình ảnh “kéo” và chú thích các khả năng mạnh hơn, tránh giải quyết thay cho nguyên văn cuộc tranh luận thần học về ân điển.
- issue: Đại từ giống đực số ít αὐτόν được dùng theo nghĩa đại diện
  choice: người ấy
  alternative: người đó; người ấy (nam giới)
  rationale: Giống ngữ pháp của đại từ Hy Lạp không cho thấy câu chỉ áp dụng cho nam giới. “Người ấy” giữ tham chiếu số ít và nghĩa đại diện mà không chèn một sự phân biệt giới tính không có vai trò ngữ nghĩa trong câu.
- issue: Ý nghĩa của ἀναστήσω trong văn mạch
  choice: làm cho người ấy sống lại
  alternative: dựng người ấy dậy
  rationale: Cụm từ chỉ sự phục sinh vào ngày sau cùng, không chỉ hành động đứng dậy thông thường. Bản dịch nêu đúng nghĩa trong văn mạch nhưng không bổ sung chi tiết cánh chung ngoài câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “tôi” theo lời trực tiếp của Chúa Giê-su, “Cha” như danh xưng, và “ngày sau cùng” để giữ âm hưởng cánh chung. Câu duy trì cấu trúc điều kiện và sự căng thẳng thần học của nguyên bản mà không du nhập thuật ngữ hệ phái.
