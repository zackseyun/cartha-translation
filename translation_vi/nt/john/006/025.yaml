  text: Καὶ εὑρόντες αὐτὸν πέραν τῆς θαλάσσης εἶπον αὐτῷ· Ῥαββί, πότε ὧδε γέγονας;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/025.yaml
  text: And when they found him on the other side of the sea[a], they said to him, “Rabbi, when did you get here?”
translation:
  language: vi
  text: 'Khi tìm thấy Ngài ở bên kia biển, họ nói với Ngài: “Ra-bi, Ngài đến đây khi nào?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch sát hơn: “Ngài đã đến đây khi nào?” Động từ Hy Lạp ở thể hoàn thành diễn tả việc Ngài đã đến và đang hiện diện tại đó.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὑρόντες
  choice: Khi tìm thấy
  rationale: Phân từ bất định đi trước động từ chính được diễn đạt theo nghĩa thời gian, giữ đúng trình tự sự việc và tự nhiên trong tiếng Việt.
- source_word: πέραν τῆς θαλάσσης
  choice: ở bên kia biển
  rationale: Diễn đạt vị trí ở phía đối diện bên kia biển, vừa sát nghĩa vừa tự nhiên.
- source_word: Ῥαββί
  choice: Ra-bi
  rationale: Giữ danh xưng Do Thái bằng lối phiên âm quen thuộc, thay vì giải nghĩa hoàn toàn là “Thầy”.
- source_word: πότε
  choice: khi nào
  rationale: Từ nghi vấn chỉ thời gian được chuyển sang cách hỏi thông dụng trong tiếng Việt.
- source_word: ὧδε
  choice: đây
  rationale: Phó từ chỉ nơi chốn được diễn đạt ngắn gọn, tự nhiên trong câu hỏi.
- source_word: γέγονας
  choice: Thầy đến
  rationale: Dạng hoàn thành của γίνομαι trong ngữ cảnh này chỉ việc đến và hiện diện tại một nơi; “đến đây” là cách diễn đạt tự nhiên, không hiểu theo nghĩa “trở thành”.
- source_word: Καὶ
  choice: Khi
  rationale: Quan hệ nối tiếp của καί được thể hiện qua cấu trúc thời gian mở đầu câu; tránh dùng thêm “và” gây nặng câu trong tiếng Việt.
- source_word: εἶπον αὐτῷ
  choice: họ nói với Ngài
  rationale: Giữ nghĩa trực tiếp của λέγω là “nói”, dù lời được nói mang hình thức câu hỏi.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” trong lời trần thuật và “Thầy” khi đám đông trực tiếp thưa với Đức Chúa Jêsus; phiên âm danh xưng Ῥαββί là “Ra-bi” để giữ bối cảnh Do Thái.
