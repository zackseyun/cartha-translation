  terminology: Nên giữ “Ra-bi” cho Ῥαββί, thay vì vừa phiên âm vừa thêm “Thầy”. “Ngài” nhất quán với lối xưng hô trang trọng đã dùng trong lời trần thuật và không bổ sung một tước hiệu thứ hai vào nguyên văn.
