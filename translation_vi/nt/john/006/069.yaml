id: JHN.6.69
reference: John 6:69
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἡμεῖς πεπιστεύκαμεν καὶ ἐγνώκαμεν ὅτι σὺ εἶ ὁ ⸀ἅγιος τοῦ ⸀θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/069.yaml
  text: And we have believed and have come to know that you are the Holy One of God[a][b].
translation:
  language: vi
  text: Còn chúng tôi đã tin và nhận biết rằng chính Thầy là Đấng Thánh của Đức Chúa Trời[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Một số thủ bản chép: “Đấng Christ, Con Đức Chúa Trời hằng sống.”'
    reason: textual_variant
  - marker: b
    text: 'Cũng có thể dịch: “Đấng Thánh đến từ Đức Chúa Trời.” Sở hữu cách trong tiếng Hy Lạp có thể diễn tả mối quan hệ hoặc nguồn gốc.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμεῖς
  choice: chúng tôi
  rationale: Đại từ được nêu rõ để tạo thế nhấn mạnh và đối chiếu; “còn chúng tôi” diễn đạt tự nhiên sắc thái ấy trong tiếng Việt.
- source_word: πεπιστεύκαμεν
  choice: đã tin
  rationale: Thì hoàn thành Hy Lạp chỉ hành động tin đã xảy ra với kết quả vẫn còn; “đã tin” là cách diễn đạt tiếng Việt tự nhiên trong cặp động từ này mà không thêm sắc thái khởi đầu.
- source_word: ἐγνώκαμεν
  choice: nhận biết
  rationale: Động từ ở thì hoàn thành nói đến sự nhận biết đã đạt được và vẫn được xác tín; “nhận biết” trang trọng, tự nhiên và phù hợp với văn cảnh.
- source_word: ὅτι
  choice: rằng
  rationale: Từ này giới thiệu nội dung của việc tin và nhận biết.
- source_word: ὁ ἅγιος
  choice: Đấng Thánh
  rationale: Cụm có mạo từ được dùng như một danh hiệu; “Đấng Thánh” giữ được tính danh xưng và ý nghĩa người được biệt riêng, thánh khiết.
- source_word: τοῦ θεοῦ
  choice: của Đức Chúa Trời
  rationale: Cách dịch bằng “của” bảo toàn phạm vi rộng của sở hữu cách Hy Lạp, có thể chỉ quan hệ, sự thuộc về hoặc nguồn gốc, thay vì buộc nó chỉ mang nghĩa nguồn gốc.
- source_word: σὺ
  choice: chính Thầy
  rationale: Đại từ chủ ngữ được nêu rõ trong tiếng Hy Lạp nên có sắc thái nhấn mạnh; “chính Thầy” chuyển tải sự nhấn mạnh ấy, đồng thời “Thầy” phù hợp cách các môn đồ thưa với Chúa Giê-su trong văn cảnh.
theological_decisions:
- issue: Danh hiệu Kitô học trong Giăng 6:69
  choice: Đấng Thánh của Đức Chúa Trời
  alternative: Đấng Thánh đến từ Đức Chúa Trời; Đấng Christ, Con Đức Chúa Trời hằng sống
  rationale: Bản SBLGNT đọc ὁ ἅγιος τοῦ θεοῦ. Bản dịch chuyển trực tiếp danh hiệu này, không hòa hợp với Ma-thi-ơ 16:16 hay bản đọc mở rộng trong một số thủ bản. “Của Đức Chúa Trời” giữ nguyên độ rộng của quan hệ sở hữu cách.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “chúng tôi” theo lời Phi-e-rơ đại diện nhóm môn đồ, “Thầy” làm lối xưng hô tự nhiên trong quan hệ môn đồ–thầy. Cấu trúc “đã tin và nhận biết” giữ sự song hành của hai động từ hoàn thành mà không làm câu tiếng Việt nặng nề.
