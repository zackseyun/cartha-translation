  text: εἶπον οὖν πρὸς αὐτόν· Κύριε, πάντοτε δὸς ἡμῖν τὸν ἄρτον τοῦτον.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/034.yaml
  text: So they said to him[a], “Lord, always give us this bread.”
translation:
  language: vi
  text: 'Vì vậy, họ nói với Ngài[a]: “Lạy Chúa, xin luôn ban cho chúng tôi bánh này.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Thưa Ngài, xin luôn ban cho chúng tôi bánh này.” Tước hiệu Hy Lạp ở đây có thể được dùng như một cách xưng hô kính trọng, cũng như mang nghĩa “Chúa”.'
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπον
  choice: họ nói
  rationale: Động từ aorist của λέγω trong lời thoại tự sự được chuyển tự nhiên là “họ nói”, không thêm sắc thái của “thưa” hay “bảo” vốn không nhất thiết có trong nguyên văn.
- source_word: οὖν
  choice: Vì vậy
  rationale: οὖν nối lời xin này với cuộc đối thoại trước đó và hàm ý phản ứng dựa trên điều vừa nghe; “Vì vậy” giữ rõ quan hệ suy luận.
- source_word: πρὸς αὐτόν
  choice: với Ngài
  rationale: Sau động từ nói, πρός với đối cách chỉ người được ngỏ lời. “Nói với Ngài” là cách diễn đạt tự nhiên trong tiếng Việt; viết hoa “Ngài” phù hợp lối văn Kinh Thánh trang trọng khi chỉ Chúa Giê-su.
- source_word: Κύριε
  choice: Lạy Chúa
  rationale: Dạng hô cách được diễn đạt tự nhiên bằng “Lạy Chúa”. Cách dịch này giữ khả năng mang ý nghĩa tôn xưng, trong khi chú thích bảo lưu khả năng đây chỉ là lời xưng hô kính trọng.
- source_word: πάντοτε
  choice: luôn
  rationale: “Luôn” diễn đạt gọn và tự nhiên ý nghĩa “luôn luôn, mọi lúc”, phù hợp với lời xin về sự chu cấp liên tục.
- source_word: δὸς
  choice: xin ... ban
  rationale: Mệnh lệnh cách aorist của δίδωμι là lời cầu xin trực tiếp. Hư từ “xin” tạo sắc thái thỉnh cầu tự nhiên; “ban” phù hợp khi người nói xin nhận sự cung cấp từ Chúa mà không làm thay đổi nội dung căn bản là “cho”.
- source_word: ἡμῖν
  choice: cho chúng tôi
  rationale: Đại từ số nhiều ở cách cho chỉ người nhận; “cho chúng tôi” là cách chuyển trực tiếp và rõ nghĩa.
- source_word: τὸν ἄρτον τοῦτον
  choice: bánh này
  rationale: ἄρτος chỉ bánh, còn τοῦτον trỏ về thứ bánh vừa được bàn đến. “Bánh này” giữ nguyên lực chỉ định và mối liên hệ với văn cảnh.
theological_decisions:
- issue: Cách dịch κύριος khi đám đông trực tiếp thưa với Chúa Giê-su
  choice: Lạy Chúa
  alternative: Thưa Ngài
  rationale: κύριος có thể là tước hiệu “Chúa” hoặc cách xưng hô kính trọng. Bản chính dùng “Lạy Chúa” để bảo toàn chiều kích tôn xưng và sự rộng nghĩa của từ Hy Lạp; chú thích nêu phương án lịch sự để không gán cho người nói một nhận thức Cơ Đốc học đầy đủ mà văn cảnh chưa xác quyết.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu giữ cấu trúc lời thoại ngắn gọn của nguyên văn; “Vì vậy” làm rõ liên kết diễn ngôn, còn chú thích bảo lưu sự nhập nhằng chân thực của Κύριε.
