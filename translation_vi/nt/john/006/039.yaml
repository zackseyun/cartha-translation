language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τοῦτο δέ ἐστιν τὸ θέλημα τοῦ πέμψαντός ⸀με ἵνα πᾶν ὃ δέδωκέν μοι μὴ ἀπολέσω ἐξ αὐτοῦ ἀλλὰ ἀναστήσω ⸀αὐτὸ τῇ ἐσχάτῃ ἡμέρᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/039.yaml
  text: 'And this is the will of the one who sent me: that I should lose nothing of all that he has given me[a], but should raise it up on the last day.'
translation:
  language: vi
  text: 'Đây là ý muốn của Đấng đã sai tôi: tôi không làm mất bất cứ điều gì trong tất cả những gì Ngài đã ban cho tôi[a], nhưng sẽ làm cho toàn thể ấy sống lại trong ngày cuối cùng.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể diễn đạt theo nghĩa chỉ người: “tất cả những người Ngài đã ban cho tôi ... làm cho họ sống lại.” Tiếng Hy Lạp dùng một cách nói tập hợp ở số ít, sát nghĩa là “tất cả những gì ... điều ấy.”'
    reason: Nêu cách diễn đạt thay thế mang tính cá nhân, đồng thời giải thích dạng trung tính số ít của nguyên văn.
lexical_decisions:
- source_word: θέλημα
  choice: ý muốn
  rationale: Cách diễn đạt tự nhiên và trang trọng, chỉ ý định hay mục đích của Đức Chúa Trời mà không thu hẹp thành mong ước đơn thuần hoặc một sắc thái thần học hệ thống.
- source_word: τοῦ πέμψαντός με
  choice: Đấng đã sai tôi
  rationale: Giữ lực động từ của phân từ danh từ hóa và diễn đạt tự nhiên trong văn phong Kinh Thánh tiếng Việt.
- source_word: ἵνα
  choice: ấy là
  rationale: Trong cấu trúc này, ἵνα trình bày nội dung đồng thời hàm ý mục đích của “ý muốn”; “ấy là” nối câu tự nhiên mà không loại bỏ sắc thái ấy.
- source_word: πᾶν ὃ δέδωκέν μοι
  choice: tất cả những gì Ngài đã ban cho tôi
  rationale: Giữ dạng trung tính số ít mang nghĩa tập hợp của πᾶν ὃ, thay vì sớm chuyển thành cách nói chỉ người.
- source_word: δέδωκέν
  choice: đã ban
  rationale: Thì hoàn thành Hy Lạp nói đến hành động đã hoàn tất với kết quả còn hiệu lực; “đã ban” truyền đạt điều này tự nhiên trong tiếng Việt.
- source_word: μὴ ἀπολέσω ἐξ αὐτοῦ
  choice: tôi không làm mất bất cứ điều gì trong tất cả những gì ấy
  rationale: ἀπόλλυμι trong ngữ cảnh mang nghĩa làm mất; cách diễn đạt này giữ ý không để mất một phần nào khỏi toàn thể được ban.
- source_word: ἀναστήσω αὐτὸ
  choice: sẽ khiến điều ấy sống lại
  rationale: Diễn đạt hành động làm cho sống lại trong ngày cuối cùng, đồng thời giữ đại từ số ít quy chiếu về toàn thể mang tính tập hợp.
- source_word: τῇ ἐσχάτῃ ἡμέρᾳ
  choice: trong ngày cuối cùng
  rationale: Cách nói tự nhiên trong tiếng Việt, giữ nguyên ý nghĩa cánh chung của cụm từ trong Giăng.
theological_decisions:
- issue: Nên diễn đạt đối tượng tập hợp theo hướng chỉ người hay giữ dạng trung tính số ít của tiếng Hy Lạp.
  choice: tất cả những gì Ngài đã ban cho tôi ... khiến điều ấy sống lại
  alternative: tất cả những người Ngài đã ban cho tôi ... khiến họ sống lại
  rationale: Bản Hy Lạp dùng các dạng trung tính số ít πᾶν, ὃ và αὐτό. Bản dịch chính giữ hình thức tập hợp này, trong khi chú thích nêu cách hiểu mang tính cá nhân vốn phù hợp với ngữ cảnh, để không âm thầm giải quyết sự căng thẳng của văn bản.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Đấng” cho phân từ chỉ Đức Chúa Cha và viết hoa “Ngài” theo quy chiếu trong ngữ cảnh. Giữ cách nói tập hợp số ít hơi khác thường để phản ánh nguyên văn, kèm chú thích làm rõ.
