  to: 'Đây là ý muốn của Đấng đã sai tôi: tôi không làm mất bất cứ điều gì trong tất cả những gì Ngài đã ban cho tôi[a], nhưng sẽ làm cho toàn thể ấy sống lại trong ngày cuối cùng.'
