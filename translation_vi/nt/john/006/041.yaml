id: JHN.6.41
reference: John 6:41
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἐγόγγυζον οὖν οἱ Ἰουδαῖοι περὶ αὐτοῦ ὅτι εἶπεν· Ἐγώ εἰμι ὁ ἄρτος ὁ καταβὰς ἐκ τοῦ οὐρανοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/john/006/041.yaml
  text: So the Jews were grumbling about him because he said[a], “I am the bread that came down from heaven.”
translation:
  language: vi
  text: 'Vì vậy, những người Do Thái[a] đang phàn nàn về Ngài vì Ngài đã nói: “Ta là bánh từ trời xuống.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “những người Giu-đê” hoặc, trong một số ngữ cảnh, “các lãnh đạo Do Thái.” Trong sách Giăng, cụm từ “những người Do Thái” có thể chỉ một nhóm cụ thể chống đối Chúa Giê-su, chứ không nhất thiết chỉ toàn thể dân Do Thái.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐγόγγυζον
  choice: lẩm bẩm
  rationale: Thì chưa hoàn thành diễn tả hành động đang tiếp diễn hoặc lặp lại trong quá khứ; “lẩm bẩm” truyền đạt lời than phiền nhỏ tiếng, tiêu cực, đồng thời gợi lại mô-típ dân chúng kêu ca trong hoang mạc.
- source_word: οὖν
  choice: Vì thế
  rationale: Diễn tả sự tiếp nối có tính hệ quả từ lời tuyên bố trước đó của Chúa Giê-su, nhưng không biến liên kết này thành một suy luận quá nặng tính hình thức.
- source_word: οἱ Ἰουδαῖοι
  choice: những người Do Thái
  rationale: Giữ cách gọi trực tiếp của bản Hy Lạp mà không tự ý thu hẹp thành giới lãnh đạo hay xác định theo địa lý; chú thích làm rõ rằng trong Giăng, cụm từ này có thể chỉ một nhóm cụ thể chống đối Chúa Giê-su.
- source_word: περὶ αὐτοῦ
  choice: về Ngài
  rationale: περί với sở hữu cách có nghĩa thông thường là “về, liên quan đến”; không tăng sắc thái thành “chống lại Ngài” vốn vượt quá ý nghĩa cơ bản của giới từ.
- source_word: ὅτι
  choice: vì
  rationale: Ở đây ὅτι giới thiệu nguyên nhân khiến họ lẩm bẩm, nên “vì” diễn đạt rõ quan hệ nhân quả.
- source_word: εἶπεν
  choice: đã nói
  rationale: Dịch động từ aorist bằng hành động quá khứ đơn; “đã nói” tự nhiên trong tiếng Việt và cho thấy lời nói xảy ra trước phản ứng đang được thuật lại.
- source_word: Ἐγώ εἰμι
  choice: Ta là
  rationale: Giữ nguyên cấu trúc tự xưng nhấn mạnh của tiếng Hy Lạp. “Ta” phù hợp với lời Chúa Giê-su trong văn phong Kinh Thánh trang trọng mà vẫn dễ hiểu.
- source_word: ὁ ἄρτος
  choice: bánh
  rationale: “Bánh” là cách gọi tự nhiên trong tiếng Việt đối với hình ảnh lương thực ở diễn từ này; tiếng Việt không có mạo từ tương đương để thể hiện trực tiếp mạo từ xác định của tiếng Hy Lạp.
- source_word: ὁ καταβὰς
  choice: từ trời xuống
  rationale: Phân từ aorist có mạo từ bổ nghĩa cho “bánh”; cấu trúc tiếng Việt rút gọn này rõ ràng, tự nhiên và vẫn diễn tả sự đi xuống đã xảy ra.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: từ trời
  rationale: “Từ trời” diễn đạt tự nhiên ý nguồn gốc của ἐκ với sở hữu cách trong ngữ cảnh thần học này.
theological_decisions:
- issue: Phạm vi chỉ định của οἱ Ἰουδαῖοι trong sách Giăng
  choice: Dịch là “những người Do Thái” trong chính văn, kèm chú thích giới hạn khả năng quy chiếu theo ngữ cảnh.
  alternative: “những người Giu-đê” hoặc “các lãnh đạo Do Thái”
  rationale: Câu này không nói rõ đó là giới lãnh đạo, cũng không buộc phải hiểu theo địa lý. Cách dịch trực tiếp bảo toàn độ rộng của nguyên văn, còn chú thích ngăn việc hiểu sai thành một lời khái quát về toàn thể dân Do Thái.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” trong lời trần thuật và “Ta” trong lời tự xưng của Chúa Giê-su. Câu giữ nhịp kể tự nhiên, đồng thời bảo toàn quan hệ nhân quả và sự mơ hồ thật sự về phạm vi của οἱ Ἰουδαῖοι.
