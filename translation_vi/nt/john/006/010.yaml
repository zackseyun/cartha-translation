revisions:
- from: 'Đức Chúa Jêsus phán: “Hãy bảo mọi người ngồi xuống.”[a] Nơi ấy có rất nhiều cỏ. Vậy, những người đàn ông ngồi xuống, số người khoảng năm ngàn.[b]'
  to: 'Chúa Giê-su nói: “Hãy bảo mọi người ngồi xuống.”[a] Nơi ấy có rất nhiều cỏ. Vậy, những người đàn ông ngồi xuống; số người vào khoảng năm ngàn.[b]'
  rationale: Bản sửa loại bỏ tước hiệu không có trong nguyên văn và thay chính tả tên bằng dạng tiếng Việt hiện đại “Giê-su”. Các lựa chọn “mọi người”, “ngồi xuống”, “rất nhiều cỏ”, và “những người đàn ông” được giữ vì phản ánh tốt nguyên văn và tiếng Việt tự nhiên. Chú thích được neo sau từ/cụm từ liên quan trực tiếp.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T06:19:42Z'
review_pass:
  verdict: revise
  source_fidelity: 'Cần sửa cách gọi “Đức Chúa Jêsus”: nguyên văn chỉ có “Đức Chúa Giê-su/Chúa Giê-su” không phải là một tước hiệu trong câu này, còn “Jêsus” không phù hợp chính tả tiếng Việt hiện đại chuẩn. Bản dịch giữ đúng sự phân biệt giữa ἀνθρώπους (“mọi người”) và ἄνδρες (“những người đàn ông”), cũng như tính ước lượng của ὡς (“khoảng/vào khoảng”).'
  naturalness: “Số người khoảng năm ngàn” có thể hiểu được nhưng hơi gượng. “Số người vào khoảng năm ngàn” tự nhiên hơn. “Nói” là cách kể chuyện hiện đại, tự nhiên hơn “phán”.
  terminology: 'Dùng “Chúa Giê-su” cho ὁ Ἰησοῦς: vừa là tên gọi Kinh Thánh quen thuộc trong tiếng Việt hiện đại vừa không thêm “Đức” ngoài nguyên văn. “Ngồi xuống” là lựa chọn tự nhiên cho ἀναπίπτω trong ngữ cảnh này; chú thích giữ phương án “ngả mình xuống”.'
  issues:
