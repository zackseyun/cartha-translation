  text: ⸀εἶπεν ὁ Ἰησοῦς· Ποιήσατε τοὺς ἀνθρώπους ἀναπεσεῖν. ἦν δὲ χόρτος πολὺς ἐν τῷ τόπῳ. ἀνέπεσαν οὖν οἱ ἄνδρες τὸν ἀριθμὸν ⸀ὡς πεντακισχίλιοι.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/010.yaml
  text: Jesus said, “Have the people sit down.” Now there was plenty of grass in the place. So the men sat down, about five thousand in number.
translation:
  language: vi
  text: 'Chúa Giê-su nói: “Hãy bảo mọi người ngồi xuống.”[a] Nơi ấy có rất nhiều cỏ. Vậy, những người đàn ông ngồi xuống; số người vào khoảng năm ngàn.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hoặc “ngả mình xuống.” Động từ Hy Lạp có thể chỉ tư thế ngả mình khi dùng bữa.
    reason: lexical_alternative
  - marker: b
    text: Tiếng Hy Lạp trước hết nói “mọi người” (ἀνθρώπους), rồi dùng “những người đàn ông” (ἄνδρες); vì vậy, con số khoảng năm ngàn trực tiếp chỉ những người đàn ông.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ποιήσατε τοὺς ἀνθρώπους ἀναπεσεῖν
  choice: Hãy bảo mọi người ngồi xuống
  rationale: Cấu trúc ποιέω với động từ nguyên mẫu diễn tả sự sai khiến. “Hãy bảo… ngồi xuống” tự nhiên trong tiếng Việt, giữ được lực mệnh lệnh và phạm vi bao quát của ἀνθρώπους.
- source_word: ἀναπεσεῖν / ἀνέπεσαν
  choice: ngồi xuống
  rationale: ἀναπίπτω có thể chỉ tư thế ngả mình khi dùng bữa, nhưng trong cảnh ngoài trời này, “ngồi xuống” là cách diễn đạt tự nhiên, không loại trừ sắc thái chuẩn bị dùng bữa; khả năng dịch khác được ghi ở chú thích.
- source_word: χόρτος πολὺς
  choice: rất nhiều cỏ
  rationale: χόρτος ở đây là cỏ, còn πολὺς diễn tả số lượng dồi dào. “Rất nhiều cỏ” vừa sát nghĩa vừa tự nhiên trong tiếng Việt hiện đại.
- source_word: οἱ ἄνδρες
  choice: những người đàn ông
  rationale: ἀνήρ chỉ nam giới, khác với từ ἄνθρωπος mang nghĩa bao quát được dùng trước đó. Bản dịch giữ rõ sự chuyển đổi từ vựng này.
- source_word: τὸν ἀριθμὸν ὡς πεντακισχίλιοι
  choice: số người khoảng năm ngàn
  rationale: ὡς biểu thị con số ước chừng, còn τὸν ἀριθμόν nêu rõ đây là số đếm. Cách dịch này giữ cả hai yếu tố mà vẫn dễ hiểu.
theological_decisions:
- issue: Đối tượng được bảo ngồi và nhóm được đếm
  choice: Dịch ἀνθρώπους là “mọi người”, nhưng ἄνδρες là “những người đàn ông”.
  alternative: Dịch cả hai từ một cách khái quát là “người” hoặc “mọi người”.
  rationale: Nguyên văn chuyển từ danh từ chỉ con người nói chung sang danh từ chỉ nam giới. Giữ sự phân biệt cho thấy con số khoảng năm ngàn trực tiếp nói đến những người đàn ông, mà không tự suy đoán tổng số đám đông.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Jêsus” theo lối gọi quen thuộc trong Kinh Thánh Tin Lành tiếng Việt; “phán” giữ sắc thái tôn kính. Câu cuối được diễn đạt rõ để tránh hiểu “khoảng năm ngàn” là khoảng cách hay con số của toàn bộ đám đông.
