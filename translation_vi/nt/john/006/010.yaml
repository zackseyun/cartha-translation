    issue: “Đức Chúa Jêsus” thêm tước hiệu và dùng dạng tên không chuẩn hiện đại.
    rationale: SBLGNT ghi ὁ Ἰησοῦς, nghĩa là “Chúa Giê-su/Giê-su” tùy quy ước dịch tên, không có từ tương ứng với “Đức”. Dạng “Jêsus” thuộc lối chính tả Kinh Thánh cũ, không phải tiếng Việt hiện đại chuẩn được yêu cầu.
  - severity: low
    issue: Vị trí chú thích a chưa neo trực tiếp vào động từ có phương án dịch khác.
    rationale: Chú thích về ἀναπεσεῖν nên đặt sau “ngồi xuống”, thay vì sau cả câu trích dẫn.
  - severity: low
