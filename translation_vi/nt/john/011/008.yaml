id: JHN.11.8
reference: John 11:8
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: λέγουσιν αὐτῷ οἱ μαθηταί· Ῥαββί, νῦν ἐζήτουν σε λιθάσαι οἱ Ἰουδαῖοι, καὶ πάλιν ὑπάγεις ἐκεῖ;
base_translation:
  language: en
  yaml_path: translation/nt/john/011/008.yaml
  text: The disciples said to him[a], “Rabbi, just now the Jews were seeking to stone you, and are you going there again?”
translation:
  language: vi
  text: 'Các môn đồ nói với Ngài: “Ra-bi, mới đây người Do Thái[a] còn tìm cách ném đá Ngài, thế mà Ngài lại đến đó sao?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “người Giu-đê” hoặc, theo ngữ cảnh, “các nhà lãnh đạo Do Thái”. Trong sách Giăng, cụm từ “người Do Thái” thường chỉ những người chống đối Đức Chúa Jêsus tại Giu-đê, chứ không phải toàn thể dân Do Thái.
    reason: alternative_reading
lexical_decisions:
- source_word: λέγουσιν
  choice: nói
  rationale: Thì hiện tại lịch sử của tiếng Hy Lạp được diễn đạt tự nhiên bằng dạng kể chuyện “nói” trong tiếng Việt; ngữ cảnh xác định đây là lời thuật về quá khứ.
- source_word: Ῥαββί
  choice: Ra-bi
  rationale: Giữ lại danh xưng gốc Semit được tiếng Hy Lạp phiên âm, thay vì diễn giải thành “Thầy”, nhằm bảo tồn cách xưng hô và văn phong của Giăng.
- source_word: νῦν
  choice: mới đây
  rationale: Trong ngữ cảnh, từ này nhấn mạnh biến cố vừa xảy ra gần đây, không chỉ thời điểm hiện tại.
- source_word: ἐζήτουν
  choice: còn tìm cách
  rationale: Thì chưa hoàn thành diễn tả nỗ lực đang diễn ra trong quá khứ; “tìm cách” tự nhiên trong tiếng Việt và không khẳng định hành động đã thành công.
- source_word: λιθάσαι
  choice: ném đá
  rationale: Dịch trực tiếp hành động được nêu; không thêm “cho chết” vì ý ấy không được nói rõ trong nguyên văn.
- source_word: οἱ Ἰουδαῖοι
  choice: người Do Thái
  rationale: Giữ nghĩa từ vựng trực tiếp, đồng thời chú thích khả năng chỉ người Giu-đê hoặc giới lãnh đạo Do Thái trong ngữ cảnh của sách Giăng.
- source_word: πάλιν
  choice: lại
  rationale: Cách diễn đạt tự nhiên và trực tiếp cho ý lặp lại.
- source_word: ὑπάγεις
  choice: đến
  rationale: Khi đi với ἐκεῖ, động từ chỉ việc đi đến nơi đã nhắc tới; “đến đó” tự nhiên hơn “đi đó” trong câu hỏi tiếng Việt.
- source_word: ἐκεῖ
  choice: đó
  rationale: Trạng từ nơi chốn chỉ trở lại Giu-đê, nơi có mối nguy vừa được nhắc đến.
theological_decisions:
- issue: Đối tượng được gọi là οἱ Ἰουδαῖοι trong sách Giăng
  choice: người Do Thái
  alternative: người Giu-đê; hoặc theo ngữ cảnh, các nhà lãnh đạo Do Thái
  rationale: Bản chính giữ nghĩa từ vựng phổ quát mà không tự ý thu hẹp đối tượng; chú thích bảo tồn sắc thái địa phương hoặc đối nghịch thường có trong cách dùng của Giăng và tránh khiến độc giả hiểu là toàn thể dân Do Thái.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Ngài” được dùng làm đại từ kính trọng dành cho Đức Chúa Jêsus; “Ra-bi” giữ nguyên danh xưng lịch sử. Cấu trúc “thế mà… sao?” truyền đạt sự ngạc nhiên và phản đối hàm chứa trong καὶ πάλιν…; dấu chú thích [a] xuất hiện ngay sau đối tượng cần giải thích.
