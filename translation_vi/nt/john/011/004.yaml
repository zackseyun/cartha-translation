revisions:
- from: 'Nhưng khi nghe tin ấy, Đức Chúa Jêsus phán: “Căn bệnh này không đưa đến cái chết[a], nhưng vì vinh quang của Đức Chúa Trời, để qua đó Con Đức Chúa Trời được tôn vinh.”'
  to: 'Nhưng khi Giê-su nghe tin ấy, ngài nói: “Bệnh này không dẫn đến sự chết[a], nhưng vì vinh quang của Đức Chúa Trời, để Con Đức Chúa Trời được tôn vinh qua bệnh này.”'
  rationale: Sửa tên riêng theo chính tả Việt hiện đại và bỏ danh xưng được thêm không có trong nguyên văn. Làm rõ đại từ chỉ phương tiện ở cuối câu. Các vế mục đích, thể bị động của “được tôn vinh,” và sự căng thẳng có chủ ý của “không dẫn đến sự chết” đều được giữ nguyên.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T06:23:38Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp truyền tải đúng cấu trúc và các quan hệ chính: bệnh không có sự chết làm kết cục, bệnh nhằm vinh quang của Đức Chúa Trời, và Con Đức Chúa Trời được tôn vinh qua bệnh ấy. Tuy nhiên, nguyên văn chỉ có tên ὁ Ἰησοῦς, không có danh xưng “Đức Chúa”; vì vậy, “Đức Chúa Jêsus” thêm một danh xưng không hiện diện trong câu. Bản sửa dùng “Giê-su” theo chính tả Việt hiện đại và không thêm danh xưng.'
  naturalness: Câu sửa vẫn giữ văn phong trang trọng, rõ ràng và hiện đại. “Qua bệnh này” làm rõ đại từ δι’ αὐτῆς quy chiếu về bệnh, thay vì để “qua đó” có thể bị hiểu mơ hồ là quy chiếu đến vinh quang hoặc toàn bộ mệnh đề trước.
  terminology: “Đức Chúa Trời,” “Con Đức Chúa Trời,” “vinh quang,” và “được tôn vinh” là các cách diễn đạt phù hợp với thuật ngữ của câu. “Giê-su” là dạng chính tả hiện đại, còn việc không thêm “Đức Chúa” trước tên bảo toàn sát hơn văn bản Hy Lạp.
  issues:
  - severity: medium
    issue: Danh xưng “Đức Chúa” được thêm trước tên Giê-su.
    rationale: SBLGNT chỉ viết ὁ Ἰησοῦς (“Giê-su”) trong câu này. Dù danh xưng này có thể thuộc truyền thống bản dịch, nó không được biểu thị trong nguyên văn và không cần thiết cho register trang trọng.
  - severity: low
    issue: “Qua đó” có tiền tố quy chiếu chưa thật rõ.
    rationale: δι’ αὐτῆς là giống cái và quy chiếu trực tiếp về ἡ ἀσθένεια (“bệnh”). Lặp lại “qua bệnh này” bảo đảm mối quy chiếu rõ ràng.
  revised_text: 'Nhưng khi Giê-su nghe tin ấy, ngài nói: “Bệnh này không dẫn đến sự chết[a], nhưng vì vinh quang của Đức Chúa Trời, để Con Đức Chúa Trời được tôn vinh qua bệnh này.”'
