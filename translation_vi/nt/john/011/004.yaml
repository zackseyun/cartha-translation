reference: John 11:4
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀκούσας δὲ ὁ Ἰησοῦς εἶπεν· Αὕτη ἡ ἀσθένεια οὐκ ἔστιν πρὸς θάνατον ἀλλ’ ὑπὲρ τῆς δόξης τοῦ θεοῦ ἵνα δοξασθῇ ὁ υἱὸς τοῦ θεοῦ δι’ αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/004.yaml
  text: But when Jesus heard it[a], he said, “This sickness is not unto death, but for the glory of God, so that the Son of God may be glorified through it.”
translation:
  language: vi
  text: 'Nhưng khi Giê-su nghe tin ấy, ngài nói: “Bệnh này không dẫn đến sự chết[a], nhưng vì vinh quang của Đức Chúa Trời, để Con Đức Chúa Trời được tôn vinh qua bệnh này.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “không nhằm đến cái chết.” Cụm từ Hy Lạp có thể hàm ý rằng cái chết không phải kết cục hay mục đích sau cùng của căn bệnh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσας δὲ ὁ Ἰησοῦς
  choice: Nhưng khi nghe tin ấy, Đức Chúa Jêsus phán
  rationale: Phân từ bất định quá khứ ἀκούσας nêu hoàn cảnh trước lời phán; “khi nghe tin ấy” tự nhiên trong tiếng Việt và làm rõ điều được nghe là tin báo về bệnh tình của La-xa-rơ. δέ được dịch là “nhưng” để giữ bước chuyển nhẹ trong mạch kể.
- source_word: ἀσθένεια
  choice: căn bệnh
  rationale: Diễn đạt tự nhiên tình trạng đau ốm cụ thể của La-xa-rơ mà không mang sắc thái y khoa quá chuyên biệt.
- source_word: οὐκ ἔστιν πρὸς θάνατον
  choice: không đưa đến cái chết
  rationale: πρός với đối cách có thể chỉ đích đến hay kết quả. Cách dịch này giữ ý rằng cái chết không phải kết cục sau cùng, đồng thời không phủ nhận diễn biến La-xa-rơ thực sự chết trong câu chuyện.
- source_word: ὑπὲρ τῆς δόξης τοῦ θεοῦ
  choice: nhưng vì vinh quang của Đức Chúa Trời
  rationale: ὑπέρ tại đây biểu thị mục đích hoặc điều được phục vụ; “vì vinh quang” vừa tự nhiên vừa giữ trọng lượng thần học của δόξα.
- source_word: ἵνα δοξασθῇ ὁ υἱὸς τοῦ θεοῦ
  choice: để ... Con Đức Chúa Trời được tôn vinh
  rationale: Giữ mệnh đề mục đích do ἵνα dẫn vào và thể bị động của δοξασθῇ; danh hiệu υἱὸς τοῦ θεοῦ được dịch trực tiếp.
- source_word: δι’ αὐτῆς
  choice: qua đó
  rationale: διά với sở hữu cách chỉ phương tiện. Đại từ giống cái quy chiếu về căn bệnh; “qua đó” gọn và tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Ý nghĩa của “không ... đến cái chết” khi La-xa-rơ thực sự chết sau đó
  choice: Dịch “không đưa đến cái chết” và chú thích rằng cái chết không phải kết cục sau cùng của căn bệnh.
  alternative: Dịch như một lời khẳng định tuyệt đối rằng La-xa-rơ sẽ không chết, hoặc chỉ nói bệnh này không nguy tử.
  rationale: Văn mạch cho biết La-xa-rơ có chết (11:14), nên cần giữ lực chỉ đích đến hoặc kết quả của πρὸς mà không xóa bỏ sự căng thẳng trong lời phán.
- issue: Mối liên hệ giữa vinh quang của Đức Chúa Trời và việc Con Đức Chúa Trời được tôn vinh
  choice: 'Giữ riêng cả hai vế: căn bệnh vì vinh quang của Đức Chúa Trời, để Con Đức Chúa Trời được tôn vinh qua đó.'
  alternative: Gộp hai vế thành một lời nói chung về vinh quang thần thượng.
  rationale: Bản Hy Lạp trình bày rõ cả vinh quang của Đức Chúa Trời lẫn sự tôn vinh Con; giữ cả hai bảo toàn cấu trúc và sức nặng Cơ Đốc học của câu mà không thêm diễn giải.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “phán” phù hợp với lời của Đức Chúa Jêsus; giữ các danh xưng truyền thống “Đức Chúa Jêsus,” “Đức Chúa Trời” và “Con Đức Chúa Trời.”
