  text: εἷς δέ τις ἐξ αὐτῶν Καϊάφας, ἀρχιερεὺς ὢν τοῦ ἐνιαυτοῦ ἐκείνου, εἶπεν αὐτοῖς· Ὑμεῖς οὐκ οἴδατε οὐδέν,
base_translation:
  language: en
  yaml_path: translation/nt/john/011/049.yaml
  text: But one of them[a], Caiaphas, who was high priest that year, said to them, “You know nothing at all.”
translation:
  language: vi
  text: 'Nhưng một người trong số họ là Cai-pha, thầy tế lễ thượng phẩm năm ấy, nói với họ: “Các ông chẳng biết gì cả.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἷς δέ τις ἐξ αὐτῶν
  choice: Nhưng một người trong số họ
  rationale: Cụm εἷς ... τις giới thiệu một cá nhân thuộc nhóm; cách diễn đạt này tự nhiên trong tiếng Việt và δέ được thể hiện bằng “Nhưng” để đánh dấu sự chuyển ý có sắc thái tương phản nhẹ.
- source_word: Καϊάφας
  choice: Cai-pha
  rationale: Phiên âm tên riêng theo cách gọi quen thuộc trong tiếng Việt.
- source_word: ἀρχιερεὺς
  choice: thầy tế lễ thượng phẩm
  rationale: Chỉ đúng chức vụ tư tế tối cao ở số ít, tránh nhầm với nhóm các trưởng tế.
- source_word: ὢν τοῦ ἐνιαυτοῦ ἐκείνου
  choice: thầy tế lễ thượng phẩm năm ấy
  rationale: Diễn đạt tự nhiên chức vụ của Cai-pha trong năm được nói đến, không thêm lời giải thích về nhiệm kỳ hay ý nghĩa thần học.
- source_word: εἶπεν αὐτοῖς
  choice: nói với họ
  rationale: Phản ánh trực tiếp động từ λέγω cùng bổ ngữ gián tiếp.
- source_word: Ὑμεῖς οὐκ οἴδατε οὐδέν
  choice: Các ông chẳng biết gì cả
  rationale: “Các ông” phù hợp với lời quở trách hướng đến những người trong hội đồng; “chẳng ... gì cả” chuyển tải tự nhiên sắc thái nhấn mạnh của cấu trúc phủ định Hy Lạp.
theological_decisions:
- issue: Ghi chú thời gian của Giăng về chức vụ của Cai-pha
  choice: thầy tế lễ thượng phẩm năm ấy
  alternative: đang làm thầy tế lễ thượng phẩm trong năm ấy
  rationale: Giữ nguyên chức năng mô tả lịch sử của cụm từ mà không giải thích thêm về chế độ thượng tế hoặc dụng ý mỉa mai trong trình thuật.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Lời “Các ông chẳng biết gì cả” giữ được giọng quở trách mạnh của nguyên văn mà vẫn tự nhiên trong tiếng Việt.
