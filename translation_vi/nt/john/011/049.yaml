  source_fidelity: 'Bản dịch chuyển đạt đầy đủ các thành phần của nguyên văn: sự chuyển ý nhẹ của δέ (“Nhưng”), việc giới thiệu một cá nhân trong nhóm, tên Cai-pha, chức vị thầy tế lễ thượng phẩm vào năm ấy, và lời quở trách nhấn mạnh “Các ông chẳng biết gì cả.” Cấu trúc phủ định nhấn mạnh οὐκ ... οὐδέν được diễn đạt tự nhiên, không bị hiểu như phủ định kép theo logic.'
