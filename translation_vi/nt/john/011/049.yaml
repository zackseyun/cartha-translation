  terminology: “Cai-pha” là dạng tên riêng quen thuộc trong tiếng Việt; “thầy tế lễ thượng phẩm” phân biệt rõ chức vị số ít ἀρχιερεύς với tập thể các thầy tế lễ/chức sắc tư tế. Cụm “năm ấy” phản ánh đúng ghi chú thời gian của bản văn mà không áp đặt diễn giải lịch sử hay thần học.
