id: JHN.11.38
reference: John 11:38
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἰησοῦς οὖν πάλιν ἐμβριμώμενος ἐν ἑαυτῷ ἔρχεται εἰς τὸ μνημεῖον· ἦν δὲ σπήλαιον, καὶ λίθος ἐπέκειτο ἐπ’ αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/038.yaml
  text: Jesus[a], then, again deeply moved within himself, came to the tomb. Now it was a cave, and a stone was lying against it.
translation:
  language: vi
  text: Vì vậy, Đức Giê-su lại xúc động mãnh liệt trong lòng[a] và đi đến mộ. Mộ là một hang đá, có một tảng đá chặn ở cửa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “phẫn nộ trong lòng” hoặc “vô cùng bối rối trong lòng”; động từ Hy Lạp ở đây có sắc thái đặc biệt mạnh và có thể diễn tả nhiều hơn nỗi buồn đơn thuần.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Vì vậy
  rationale: Giữ lực liên kết và suy diễn từ cảnh ngay trước đó; trong tiếng Việt, “Vì vậy” tự nhiên và rõ hơn cách dịch thuần trình tự.
- source_word: πάλιν
  choice: lại
  rationale: Diễn tả sự lặp lại phản ứng cảm xúc của Đức Giê-su đã được nói đến trước đó.
- source_word: ἐμβριμώμενος ἐν ἑαυτῷ
  choice: xúc động mãnh liệt trong lòng
  rationale: Giữ cường độ mạnh của động từ mà không xác định quá hẹp đó chỉ là đau buồn hay phẫn nộ; chú thích bảo lưu các sắc thái khả dĩ.
- source_word: ἔρχεται
  choice: đi đến
  rationale: Dịch hiện tại lịch sử bằng lối kể tự nhiên trong tiếng Việt; “đi đến” diễn tả sự chuyển động tới ngôi mộ.
- source_word: μνημεῖον
  choice: mộ
  rationale: Chỉ nơi mai táng; ngữ cảnh sau đó xác định đây là mộ trong hang đá.
- source_word: σπήλαιον
  choice: hang đá
  rationale: Cách nói tự nhiên, cụ thể trong tiếng Việt đối với một hang dùng làm mộ.
- source_word: λίθος
  choice: tảng đá
  rationale: “Tảng đá” phù hợp với vật lớn dùng để bịt cửa mộ hơn từ chung “đá”.
- source_word: ἐπέκειτο ἐπ’ αὐτῷ
  choice: chặn ở cửa
  rationale: Diễn đạt chức năng và vị trí thực tế của tảng đá đối với ngôi mộ dạng hang; “ở cửa” được hiểu từ hình ảnh kiến trúc và tránh gây ấn tượng tảng đá nằm trên nóc mộ.
theological_decisions:
- issue: Sắc thái cảm xúc của ἐμβριμώμενος khi nói về Đức Giê-su
  choice: xúc động mãnh liệt trong lòng
  alternative: phẫn nộ trong lòng; vô cùng bối rối trong lòng
  rationale: Từ Hy Lạp diễn tả một phản ứng cảm xúc rất mạnh và có thể hàm ý phẫn nộ, nhưng ngữ cảnh không buộc phải giới hạn cảm xúc vào một sắc thái duy nhất. Bản văn chính giữ cường độ mà bảo lưu sự căng thẳng diễn giải trong chú thích.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “Đức Giê-su” theo lối gọi kính trọng phổ biến; câu thứ hai được diễn đạt tự nhiên để người đọc hình dung mộ là hang đá có tảng đá chắn cửa.
