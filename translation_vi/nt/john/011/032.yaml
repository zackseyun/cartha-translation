  source_fidelity: Bản dịch phản ánh đúng mạch nối của οὖν, hoàn cảnh thời gian, hành động Ma-ri phủ phục dưới chân Đức Giê-su, và điều kiện phản thực quá khứ. Tuy nhiên, “anh con” có thể chỉ rõ La-xa-rơ là anh lớn, trong khi ἀδελφός chỉ nói là anh/em trai; “người anh em của con” tránh thêm thông tin về thứ bậc tuổi.
  naturalness: Câu đã rõ và trang trọng. Bỏ đại từ “cô” giúp giọng văn Kinh Thánh tự nhiên, nhất quán hơn và tránh sắc thái khẩu ngữ không cần thiết.
  terminology: “Đức Giê-su,” “Ngài,” và “Lạy Chúa” phù hợp với cách dùng tôn kính và quyết định dịch κύριε là “Lord.” Chú thích giữ đúng khả năng cách xưng hô kính trọng “Thưa ngài,” không khẳng định quá mức sắc thái của từ trong riêng câu này.
  issues:
