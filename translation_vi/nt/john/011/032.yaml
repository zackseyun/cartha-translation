reference: John 11:32
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἡ οὖν ⸀Μαριὰμ ὡς ἦλθεν ὅπου ⸀ἦν Ἰησοῦς ἰδοῦσα αὐτὸν ἔπεσεν αὐτοῦ ⸀πρὸς τοὺς πόδας, λέγουσα αὐτῷ· Κύριε, εἰ ἦς ὧδε οὐκ ἄν ⸂μου ἀπέθανεν⸃ ὁ ἀδελφός.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/032.yaml
  text: So when Mary came where Jesus was and saw him[a], she fell at his feet, saying to him, “Lord, if you had been here, my brother would not have died.”
translation:
  language: vi
  text: 'Vậy, khi Ma-ri đến nơi Đức Giê-su đang ở và thấy Ngài, Ma-ri sấp mình dưới chân Ngài và thưa: “Lạy Chúa,[a] nếu Ngài có mặt ở đây thì người anh em của con đã không chết.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Thưa ngài.” Từ Hy Lạp κύριε có thể là cách xưng hô kính trọng; ở đây dịch là “Lạy Chúa” theo cách dùng κύριος trong sách Giăng.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: Vậy
  rationale: Giữ chức năng liên kết và chuyển tiếp của câu chuyện với ngữ cảnh trước, đồng thời tự nhiên trong tiếng Việt.
- source_word: ὡς ἦλθεν
  choice: khi ... đến
  rationale: Diễn đạt rõ quan hệ thời gian của ὡς với động từ quá khứ.
- source_word: ὅπου ἦν Ἰησοῦς
  choice: nơi Đức Giê-su đang ở
  rationale: Giữ nguyên ý định vị; “đang ở” diễn đạt tự nhiên trạng thái tại thời điểm Ma-ri đến.
- source_word: ἰδοῦσα αὐτόν
  choice: và thấy Ngài
  rationale: Chuyển phân từ hoàn cảnh thành động từ phối hợp để câu tiếng Việt tự nhiên mà vẫn giữ trình tự hành động.
- source_word: ἔπεσεν αὐτοῦ πρὸς τοὺς πόδας
  choice: cô sấp mình dưới chân Ngài
  rationale: Diễn đạt tư thế phủ phục dưới chân một người; “sấp mình” trang trọng và rõ hơn cách dịch sát chữ “ngã” trong ngữ cảnh này.
- source_word: λέγουσα αὐτῷ
  choice: và thưa
  rationale: “Thưa” thể hiện lời nói trực tiếp với thái độ kính trọng; liên từ giữ sự nối tiếp với hành động trước.
- source_word: Κύριε
  choice: Lạy Chúa
  rationale: Giữ cách dịch mặc định mang trọng lượng thần học của κύριος; “Lạy” là lối xưng hô trực tiếp trang trọng, tự nhiên trong tiếng Việt.
- source_word: εἰ ἦς ὧδε
  choice: nếu Ngài có mặt ở đây
  rationale: Diễn đạt một điều kiện trái với sự thật trong quá khứ mà không làm câu nặng nề; thời quá khứ được xác định bởi mệnh đề kết quả “đã không chết”.
- source_word: οὐκ ἄν ... ἀπέθανεν
  choice: đã không chết
  rationale: Trong cấu trúc điều kiện, diễn đạt kết quả phản thực thuộc quá khứ một cách tự nhiên bằng tiếng Việt.
- source_word: μου ὁ ἀδελφός
  choice: anh con
  rationale: μου là sở hữu. Ngữ cảnh xác định La-xa-rơ là nam; “anh” tự nhiên hơn từ chung “anh/em trai”, nhưng tiếng Hy Lạp không tự xác định thứ bậc tuổi.
theological_decisions:
- issue: Cách dịch κύριε khi Ma-ri xưng hô với Đức Giê-su
  choice: Lạy Chúa
  alternative: Thưa ngài
  rationale: “Lạy Chúa” giữ danh xưng κύριος và chiều sâu trong cách sách Giăng trình bày Đức Giê-su, nhưng chú thích vẫn bảo tồn khả năng đây cũng là lời xưng hô kính trọng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Giê-su”, đại từ kính trọng “Ngài”, và “cô” cho Ma-ri. Câu điều kiện phản thực được diễn đạt tự nhiên trong tiếng Việt, không cố sao chép hình thái thì của tiếng Hy Lạp.
