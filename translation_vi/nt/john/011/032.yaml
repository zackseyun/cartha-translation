    rationale: Từ ἀδελφός xác định giới tính nam nhưng không cho biết tương quan tuổi tác. Dùng “người anh em của con” bảo toàn phạm vi nghĩa mà không thêm chi tiết.
  - severity: low
    issue: Đại từ “cô” không cần thiết.
    rationale: Bản văn Hy Lạp chỉ nêu chủ ngữ bằng tên riêng; lặp “cô” sau “Ma-ri” không sai, nhưng lược bỏ cho văn phong trang trọng và tự nhiên hơn.
