  rationale: Chỉnh sửa giới hạn ở việc tránh hàm ý thứ bậc tuổi không có trong ἀδελφός và làm câu văn trang trọng, mạch lạc hơn. Các yếu tố nghĩa chính, cách xưng hô, và chú thích phương án dịch đều được giữ nguyên.
