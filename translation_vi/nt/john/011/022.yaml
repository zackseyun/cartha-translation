  terminology: “Đức Chúa Trời” được dùng nhất quán cho cả hai lần θεός, không thêm “Đức Chúa Cha.” “Cầu xin” và “ban cho” phù hợp văn cảnh cầu nguyện và văn phong Kinh Thánh hiện đại. Không cần chú thích thêm cho cụm “cầu xin Đức Chúa Trời,” vì cấu trúc này tự nhiên trong tiếng Việt và không làm thay đổi nghĩa.
  issues:
