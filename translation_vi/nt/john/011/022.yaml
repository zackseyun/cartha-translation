base_translation:
  language: en
  yaml_path: translation/nt/john/011/022.yaml
  text: But even now I know that whatever you ask from God, God will give you.
translation:
  language: vi
  text: Nhưng ngay cả bây giờ, con biết rằng bất cứ điều gì Thầy cầu xin Đức Chúa Trời, Đức Chúa Trời sẽ ban cho Thầy.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Và bây giờ, con biết rằng…” Từ nối Hy Lạp có thể chỉ mang nghĩa “và”, nhưng trong ngữ cảnh cũng có thể biểu thị bước chuyển tương phản sau khi Ma-thê nói về cái chết của La-xa-rơ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ νῦν
  choice: Nhưng ngay cả bây giờ
  rationale: Trong ngữ cảnh, καί tạo bước chuyển tương phản sau lời Ma-thê nói về cái chết của La-xa-rơ, còn νῦν giữ ý thời gian; cách dịch này diễn đạt cả hai sắc thái.
- source_word: οἶδα
  choice: con biết
  rationale: οἶδα là dạng hoàn thành mang nghĩa hiện tại, nên dịch trực tiếp là “biết”; đại từ “con” phù hợp cách Ma-thê kính trọng thưa với Chúa Giê-su.
- source_word: ὅσα ἂν
  choice: bất cứ điều gì
  rationale: Đại từ quan hệ đi với ἄν diễn tả phạm vi bất định và khái quát.
- source_word: αἰτήσῃ τὸν θεόν
  choice: Thầy cầu xin Đức Chúa Trời
  rationale: αἰτέω với đối tượng là Đức Chúa Trời trong ngữ cảnh này mang nghĩa cầu xin; tiếng Việt dùng “cầu xin Đức Chúa Trời” tự nhiên mà vẫn giữ đúng quan hệ cú pháp.
- source_word: δώσει σοι ὁ θεός
  choice: Đức Chúa Trời cũng sẽ ban cho Thầy
  rationale: Giữ chủ thể được nêu rõ là Đức Chúa Trời và đối tượng gián tiếp là Chúa Giê-su; “ban” tự nhiên trong ngữ cảnh lời cầu xin, còn “cũng” nối tương ứng với mệnh đề “bất cứ điều gì”.
theological_decisions:
- issue: Lời Ma-thê nói Chúa Giê-su cầu xin Đức Chúa Trời có thể bị diễn giải quá mức theo hướng phủ nhận thần tính của Ngài.
  choice: 'Giữ nguyên quan hệ được trình bày trong lời Ma-thê: Chúa Giê-su cầu xin Đức Chúa Trời và Đức Chúa Trời ban cho Ngài.'
  alternative: Thêm “Đức Chúa Cha” hoặc diễn giải lại để tránh sắc thái lệ thuộc.
  rationale: Đây là lời nhân vật trong trình thuật; bản dịch cần bảo toàn sự căng thẳng thần học của sách Giăng, không thêm danh xưng hay giải quyết điều câu Hy Lạp không giải quyết.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng cặp xưng hô “con–Thầy” cho lời Ma-thê thưa với Chúa Giê-su; dùng “Đức Chúa Trời” nhất quán cho θεός. Giữ cấu trúc lặp lại “Đức Chúa Trời” của nguyên văn.
