review_pass:
  verdict: revise
  source_fidelity: Câu hỏi tu từ, hình ảnh đi trong ban ngày, động từ “vấp ngã,” và lý do “thấy ánh sáng của thế gian này” đều được chuyển tải đúng. Tuy nhiên, nguyên văn chỉ nêu tên Ἰησοῦς, không có tước hiệu “Đức Chúa”; việc thêm tước hiệu này vượt quá bản văn. Chú thích a hiện nói “Một ngày,” dễ làm người đọc hiểu là cả chu kỳ hai mươi bốn giờ, trong khi câu Hy Lạp nói về mười hai giờ của thời gian ban ngày.
  naturalness: Bản sửa dùng chính tả hiện đại “Giê-su” và giữ văn phong trang trọng, rõ ràng. “Vì người ấy thấy” làm chủ thể của động từ cuối câu minh bạch mà vẫn tự nhiên trong tiếng Việt.
  terminology: Dùng “Giê-su” cho tên riêng mà không thêm tước hiệu không có trong nguồn. “Ánh sáng của thế gian này” bảo toàn cách nói của Giăng và sức gợi của κόσμος mà không áp đặt diễn giải.
  issues:
  - severity: medium
    issue: Thêm tước hiệu “Đức Chúa” trước tên Giê-su
    rationale: SBLGNT chỉ có Ἰησοῦς (“Giê-su”) ở đây. Tước hiệu này không có trong câu nguồn và không nên được thêm vào chính văn.
  - severity: medium
    issue: Chú thích a dùng “Một ngày”
    rationale: Cách nói này có thể chỉ một ngày trọn vẹn; câu nguồn nói mười hai giờ thuộc thời gian ban ngày. Chú thích cần nêu biến thể diễn đạt mà không làm đổi khung nghĩa.
