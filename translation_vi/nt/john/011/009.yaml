id: JHN.11.9
reference: John 11:9
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς· Οὐχὶ δώδεκα ⸂ὧραί εἰσιν⸃ τῆς ἡμέρας; ἐάν τις περιπατῇ ἐν τῇ ἡμέρᾳ, οὐ προσκόπτει, ὅτι τὸ φῶς τοῦ κόσμου τούτου βλέπει·
base_translation:
  language: en
  yaml_path: translation/nt/john/011/009.yaml
  text: Jesus answered[a], “Are there not twelve hours in the day? If anyone walks in the day, he does not stumble[c][b], because he sees the light of this world.”
translation:
  language: vi
  text: 'Giê-su đáp: “Ban ngày chẳng phải có mười hai giờ sao?[a] Nếu ai đi trong ban ngày thì không vấp ngã, vì người ấy thấy ánh sáng của thế gian này.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Chẳng phải ban ngày có mười hai giờ sao?”'
    reason: lexical_alternative
  - marker: b
    text: Cụm từ “ánh sáng của thế gian này” có thể gợi âm hưởng rộng hơn về sự soi sáng trong sách Giăng, nhưng chính văn giữ nguyên cách diễn đạt của câu.
    reason: cross_reference
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: đáp
  rationale: Động từ tường thuật lời đáp thông dụng; cách dịch ngắn gọn, tự nhiên và không thêm sắc thái.
- source_word: Οὐχὶ
  choice: chẳng phải ... sao?
  rationale: Giữ hình thức câu hỏi tu từ mong đợi câu trả lời khẳng định.
- source_word: δώδεκα ὧραί εἰσιν τῆς ἡμέρας
  choice: ban ngày ... có mười hai giờ
  rationale: Diễn đạt tự nhiên quan niệm đương thời về khoảng thời gian có ánh sáng ban ngày được chia thành mười hai giờ, đồng thời giữ liên hệ với mệnh đề kế tiếp.
- source_word: ἐάν τις περιπατῇ
  choice: nếu ai đi
  rationale: τις mang nghĩa phiếm chỉ; “ai” tự nhiên trong tiếng Việt và không cần bổ sung giới tính vốn không được đánh dấu trong đại từ Hy Lạp này.
- source_word: ἐν τῇ ἡμέρᾳ
  choice: trong ban ngày
  rationale: Giữ hình ảnh đi lại vào khoảng thời gian có ánh sáng và sự đối ứng với câu hỏi mở đầu.
- source_word: προσκόπτει
  choice: vấp ngã
  rationale: Giữ được hình ảnh cụ thể về việc vấp khi đi đường cũng như khả năng gợi nghĩa rộng hơn trong văn mạch.
- source_word: τὸ φῶς
  choice: ánh sáng
  rationale: Nghĩa từ vựng trực tiếp, đồng thời không làm mất âm hưởng chủ đề ánh sáng trong sách Giăng.
- source_word: τοῦ κόσμου τούτου
  choice: của thế gian này
  rationale: Phản ánh sát cấu trúc sở hữu và lực chỉ định của τούτου mà không diễn giải thêm.
- source_word: βλέπει
  choice: thấy
  rationale: Dịch trực tiếp thì hiện tại của động từ; không thêm ý khả năng như “có thể thấy”.
theological_decisions:
- issue: Khả năng mang nghĩa biểu tượng của “ánh sáng” trong văn mạch sách Giăng
  choice: Giữ nguyên hình ảnh thông thường trong chính văn và không giải thích ánh sáng là Đức Chúa Jêsus hay sự soi dẫn của Đức Chúa Trời.
  alternative: Diễn giải rõ “ánh sáng” là Đức Chúa Jêsus hoặc sự soi dẫn thần thượng.
  rationale: Lời nói hoạt động trước hết như một hình ảnh về việc đi lại lúc có ánh sáng, nhưng cách dùng từ có thể đồng thời gợi chủ đề thần học rộng hơn của sách Giăng. Bản dịch giữ sự căng thẳng này thay vì quyết định thay người đọc.
- issue: Chủ thể phiếm chỉ trong τις ... βλέπει
  choice: Dùng “ai ... người ấy” theo lối phiếm chỉ tự nhiên của tiếng Việt.
  alternative: Dùng “một người ... người đó” hoặc thêm đại từ chỉ giới tính.
  rationale: τις là đại từ bất định không đánh dấu giới tính; động từ βλέπει cũng không chứa đại từ giống đực. “Ai ... người ấy” truyền đạt đúng số ít đại diện mà không đưa vào dấu hiệu giới tính không có trong nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Jêsus” theo lối gọi quen thuộc trong tiếng Việt Cơ Đốc; cấu trúc “chẳng phải ... sao?” bảo toàn sức mạnh tu từ. Các dấu chú thích [a], [b] đều được đặt trong chính văn.
