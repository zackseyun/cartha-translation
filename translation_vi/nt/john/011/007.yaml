source:
  edition: SBLGNT
  text: ἔπειτα μετὰ τοῦτο λέγει τοῖς μαθηταῖς· Ἄγωμεν εἰς τὴν Ἰουδαίαν πάλιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/007.yaml
  text: Then after this he says to the disciples[a], “Let us go into Judea again.”
translation:
  language: vi
  text: 'Rồi sau đó, Ngài nói với các môn đệ: “Chúng ta hãy trở lại xứ Giu-đê[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “đến Giu-đê lần nữa.” Giới từ Hy Lạp trong ngữ cảnh này có thể được dịch là “vào” hoặc “đến.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔπειτα μετὰ τοῦτο
  choice: Rồi sau đó
  rationale: Giữ cả ý nối tiếp của ἔπειτα lẫn mốc thời gian của μετὰ τοῦτο, đồng thời diễn đạt tự nhiên trong tiếng Việt hiện đại.
- source_word: λέγει
  choice: Ngài nói
  rationale: Giữ thì hiện tại lịch sử của nguyên bản, qua đó bảo tồn nét kể chuyện sinh động đặc trưng của Giăng.
- source_word: τοῖς μαθηταῖς
  choice: với các môn đồ
  rationale: Diễn đạt đối tượng tiếp nhận lời nói một cách tự nhiên; không thêm từ sở hữu “của Ngài” vì nguyên bản không có.
- source_word: Ἄγωμεν
  choice: Chúng ta hãy
  rationale: Thể hiện đúng lực thúc giục của động từ giả định ngôi thứ nhất số nhiều, bao gồm cả người nói và người nghe.
- source_word: εἰς τὴν Ἰουδαίαν πάλιν
  choice: trở lại Giu-đê
  rationale: “Trở lại” kết hợp tự nhiên ý hướng đến nơi chốn của εἰς với ý lặp lại/quay về của πάλιν; “Giu-đê” là địa danh quen thuộc trong văn phong Kinh Thánh tiếng Việt.
theological_decisions:
- issue: Thì hiện tại lịch sử trong lời kể của Giăng
  choice: 'Giữ ở hiện tại: “Ngài nói”'
  alternative: 'Làm trơn theo lối kể quá khứ: “Ngài đã nói” hoặc “Ngài bảo”'
  rationale: Cách chọn này phản ánh sát phong cách kể chuyện của nguyên bản mà không áp đặt một cách hiểu thần học riêng.
- issue: Chủ thể được hàm ý trong λέγει
  choice: Dùng “Ngài” để chỉ Đức Giê-su theo ngữ cảnh
  alternative: Dùng “ông” hoặc lược bỏ chủ ngữ
  rationale: Tiếng Việt cần chủ ngữ rõ ràng; “Ngài” là cách xưng hô trang trọng, dễ hiểu trong ngữ cảnh, dù đại từ không được viết tường minh trong động từ Hy Lạp.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “môn đồ” để giữ sắc thái thuật ngữ Kinh Thánh quen thuộc; câu nói dùng “chúng ta hãy” nhằm truyền đạt rõ lời thúc giục cùng đi.
