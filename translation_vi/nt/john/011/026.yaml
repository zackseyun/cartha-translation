source:
  edition: SBLGNT
  text: καὶ πᾶς ὁ ζῶν καὶ πιστεύων εἰς ἐμὲ οὐ μὴ ἀποθάνῃ εἰς τὸν αἰῶνα· πιστεύεις τοῦτο;
base_translation:
  language: en
  yaml_path: translation/nt/john/011/026.yaml
  text: And everyone who lives and believes in me will certainly never die forever. Do you believe this?
translation:
  language: vi
  text: Và tất cả những ai đang sống và tin nơi tôi sẽ không bao giờ chết. Bạn có tin điều này không?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πᾶς ὁ ζῶν
  choice: bất cứ ai đang sống
  rationale: Diễn đạt tự nhiên cấu trúc bao quát πᾶς ὁ và giữ nghĩa hiện tại của ζῶν.
- source_word: πιστεύων εἰς ἐμέ
  choice: tin nơi tôi
  rationale: Giữ sắc thái hướng đến và đặt lòng tin nơi một người của εἰς, thay vì chỉ công nhận một mệnh đề là đúng.
- source_word: οὐ μὴ ἀποθάνῃ
  choice: sẽ không ... chết
  rationale: οὐ μή với thức giả định là lời phủ định mạnh, nên được chuyển bằng cấu trúc tương lai dứt khoát.
- source_word: εἰς τὸν αἰῶνα
  choice: bao giờ
  rationale: Trong câu phủ định mạnh, cụm này kết hợp tự nhiên thành 'không bao giờ chết', nghĩa là không chết đến đời đời.
- source_word: πιστεύεις τοῦτο;
  choice: Bạn có tin điều này không?
  rationale: Giữ câu hỏi trực tiếp ở ngôi thứ hai số ít; 'bạn' là cách xưng hô hiện đại, rõ ràng và không tự thêm quan hệ thân sơ.
theological_decisions:
- issue: Lời hứa 'không bao giờ chết' trong bối cảnh mọi người vẫn trải qua cái chết thể xác
  choice: Giữ nguyên nghịch lý bằng 'sẽ không bao giờ chết'
  alternative: Diễn giải thành 'sẽ không chết đời đời' hoặc 'sẽ sống đời đời'
  rationale: Nguyên văn dùng động từ 'chết' cùng phủ định mạnh và εἰς τὸν αἰῶνα. Không nên tự giải quyết căng thẳng thần học bằng cách đổi sang một mệnh đề diễn giải khác.
- issue: Quan hệ giữa 'đang sống' và 'tin'
  choice: 'Giữ hai phân từ song song: ''đang sống và tin nơi tôi'''
  alternative: Hiểu 'sống' theo nghĩa đã nhận sự sống thuộc linh và diễn giải rõ trong bản văn
  rationale: Câu Hy Lạp cho phép chiều sâu thần học trong 'sống' nhưng không tự giải thích nghĩa đó; bản dịch nên bảo toàn tính hàm súc.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng 'Còn' để nối với lời phán ở câu trước; tránh thêm thuật ngữ giáo phái hoặc lời giải nghĩa vào chính văn.
