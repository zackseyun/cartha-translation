  source_fidelity: 'Bản dịch giữ đúng các thành phần chính: tính bao quát của πᾶς ὁ, hai phân từ hiện tại song song «đang sống» và «tin nơi tôi», phủ định nhấn mạnh οὐ μή, cùng câu hỏi trực tiếp số ít. «Không bao giờ chết» diễn đạt tự nhiên và đầy đủ οὐ μὴ ἀποθάνῃ εἰς τὸν αἰῶνα; không cần chuyển thành một lời giải thích về sự sống đời đời.'
  naturalness: «Còn» thường tạo sắc thái đối chiếu hoặc chuyển đề, trong khi καὶ ở đây đơn giản là liên từ nối tiếp lời phán trước đó. «Và» sát hơn và tự nhiên trong mạch văn. «Tất cả những ai» làm rõ giá trị bao quát của πᾶς ὁ hơn «bất cứ ai», mà không thay đổi nghĩa.
  terminology: «Tin nơi tôi» là cách diễn đạt phù hợp cho πιστεύων εἰς ἐμέ, bảo toàn hướng quy chiếu và sự tín thác vào Đức Giê-su. Giữ «tôi» và «bạn» không áp đặt một cách xưng hô quan hệ không được mã hóa trong tiếng Hy Lạp.
