- from: 'Ngài nói: “Các người đã đặt ông ấy ở đâu?” Họ thưa: “Lạy Chúa[a], xin đến xem.”'
  to: 'Ngài nói: “Các vị đã đặt ông ấy ở đâu?” Họ thưa: “Lạy Chúa[a], xin đến xem.”'
  rationale: Chỉ thay “Các người” bằng “Các vị” để loại bỏ sắc thái đối kháng không có trong nguyên văn, đồng thời vẫn biểu thị ngôi thứ hai số nhiều. Không thay đổi ý nghĩa, thuật ngữ thần học, hay chú thích.
