  text: καὶ εἶπεν· Ποῦ τεθείκατε αὐτόν; λέγουσιν αὐτῷ· Κύριε, ἔρχου καὶ ἴδε.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/034.yaml
  text: And he said[a], “Where have you laid him?” They said to him, “Lord, come and see.”
translation:
  language: vi
  text: 'Ngài nói: “Các vị đã đặt ông ấy ở đâu?” Họ thưa: “Lạy Chúa[a], xin đến xem.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Thưa ngài, xin đến xem.” Từ Hy Lạp κύριε có thể được dùng như một cách xưng hô kính trọng; bản dịch chính giữ “Chúa”.'
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπεν
  choice: nói
  rationale: Giữ nghĩa thông thường của λέγω thay vì diễn giải thành “hỏi”; dấu câu và nội dung lời nói đã cho thấy đây là một câu hỏi.
- source_word: Ποῦ τεθείκατε αὐτόν
  choice: Các người đã đặt ông ấy ở đâu?
  rationale: “Ở đâu” thể hiện trực tiếp Ποῦ; “đã đặt” chuyển tải hành động đã hoàn tất của τεθείκατε mà không diễn giải quá mức thành “đã an táng”; “ông ấy” chỉ La-xa-rơ.
- source_word: λέγουσιν αὐτῷ
  choice: Họ thưa
  rationale: Thì hiện tại lịch sử được chuyển tự nhiên sang lối kể quá khứ trong tiếng Việt; “thưa” phù hợp với lời đáp kính trọng trực tiếp dành cho Chúa Giê-su.
- source_word: Κύριε
  choice: Lạy Chúa
  rationale: “Chúa” giữ được cả sắc thái xưng hô kính trọng lẫn khả năng hàm chứa ý nghĩa Cơ Đốc học; “lạy” tạo lối hô cách tự nhiên, trang trọng trong tiếng Việt.
- source_word: ἔρχου καὶ ἴδε
  choice: xin đến xem
  rationale: Diễn đạt tự nhiên hai mệnh lệnh “đến” và “xem”; “xin” thể hiện sắc thái lời mời kính trọng trong văn cảnh, không biến câu thành mệnh lệnh cứng.
theological_decisions:
- issue: Cách dịch κύριε khi xưng hô với Chúa Giê-su
  choice: Lạy Chúa
  alternative: Thưa ngài
  rationale: κύριε có thể chỉ là lời xưng hô kính trọng, nhưng “Chúa” giữ được khả năng mang ý nghĩa thần học trong văn mạch Giăng mà không buộc người đọc phải hiểu duy nhất theo nghĩa ấy; chú thích bảo tồn cách hiểu xã giao.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Các người” thể hiện ngôi thứ hai số nhiều mà không thêm giới tính hay quan hệ không có trong nguyên văn; tuy hơi trực diện, cách này tránh các đại từ cổ hoặc suy diễn nhóm người nghe.
