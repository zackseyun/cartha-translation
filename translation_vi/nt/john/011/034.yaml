review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch giữ đúng cấu trúc đối thoại và các yếu tố chính của nguyên văn: động từ nói, câu hỏi về nơi đã đặt La-xa-rơ, và lời mời “đến xem”. “Đã đặt” phản ánh thích đáng thì hoàn thành τεθείκατε mà không thêm ý “an táng”. “Chúa” cho κύριε vẫn bảo toàn khả năng vừa là xưng hô kính trọng vừa có chiều kích thần học; chú thích nêu đúng phương án “ngài”.'
  naturalness: “Các người” tuy biểu thị số nhiều nhưng trong tiếng Việt hiện đại thường có sắc thái đối đầu, trách móc hoặc hạ thấp, không được ngữ cảnh hỗ trợ. “Các vị” là cách gọi số nhiều lịch sự, tự nhiên hơn và không áp đặt giới tính hay quan hệ xã hội của nhóm người nghe. Các phần còn lại trang trọng, rõ ràng và tự nhiên.
  terminology: “Ngài”, “Lạy Chúa”, và “thưa” phù hợp với văn phong Kinh Thánh tiếng Việt trang trọng. Giữ “Chúa” trong bản văn chính, cùng chú thích “Thưa ngài”, xử lý đúng tính mơ hồ ngữ nghĩa của κύριε mà không quyết định thay độc giả.
  issues:
