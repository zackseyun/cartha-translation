  source_fidelity: 'Bản dịch truyền đạt đúng các thành tố chính của nguyên văn: lời nói hướng đến một người nữ, lời tự đồng nhất trực tiếp “Ta là”, hai danh từ song hành “sự sống lại và sự sống”, mệnh đề khái quát về người tin, điều kiện nhượng bộ “dù có chết”, và lời hứa ở thì tương lai “sẽ sống”. “Người nào” diễn đạt thích đáng dạng số ít mang tính đại diện của ὁ πιστεύων mà không tạo vấn đề về giới trong tiếng Việt.'
