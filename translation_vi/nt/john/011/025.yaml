  terminology: “Sự sống lại”, “sự sống”, và “tin Ta” là các thuật ngữ vừa chính xác vừa quen thuộc. Không cần chú thích về giống đực số ít đại diện, vì “người nào” trong tiếng Việt vốn bao hàm tự nhiên. Không có điểm nào đòi hỏi diễn giải thêm về thần học.
