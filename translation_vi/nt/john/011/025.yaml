source:
  edition: SBLGNT
  text: εἶπεν αὐτῇ ὁ Ἰησοῦς· Ἐγώ εἰμι ἡ ἀνάστασις καὶ ἡ ζωή· ὁ πιστεύων εἰς ἐμὲ κἂν ἀποθάνῃ ζήσεται,
base_translation:
  language: en
  yaml_path: translation/nt/john/011/025.yaml
  text: Jesus said to her[a], “I am the resurrection and the life. The one who believes in me, even if he dies, will live,”
translation:
  language: vi
  text: 'Đức Giê-su nói với bà: “Ta là sự sống lại và sự sống. Người nào tin Ta, dù có chết, cũng sẽ sống.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπεν αὐτῇ ὁ Ἰησοῦς
  choice: Đức Giê-su phán với bà
  rationale: Trật tự tiếng Việt tự nhiên đặt chủ ngữ trước. “Phán” giữ sắc thái trang trọng cho lời tuyên bố của Đức Giê-su, còn “với bà” thể hiện đại từ gián tiếp giống cái số ít αὐτῇ, chỉ Ma-thê trong văn cảnh.
- source_word: Ἐγώ εἰμι
  choice: Ta là
  rationale: Giữ nguyên cấu trúc tự đồng nhất trực tiếp và sức nhấn mạnh của đại từ Ἐγώ. “Ta” phù hợp với lời tự xưng trang trọng của Đức Giê-su trong văn phong Kinh Thánh tiếng Việt.
- source_word: ἡ ἀνάστασις
  choice: sự sống lại
  rationale: Trong ngữ cảnh này, ἀνάστασις chỉ sự sống lại từ cõi chết. Cách nói này tự nhiên và quen thuộc hơn “sự phục sinh” đối với độc giả phổ thông mà vẫn chính xác.
- source_word: ἡ ζωή
  choice: sự sống
  rationale: “Sự sống” bảo toàn danh từ xác định song song với “sự sống lại”, thay vì diễn giải thành việc ban sự sống.
- source_word: ὁ πιστεύων εἰς ἐμὲ
  choice: Người nào tin Ta
  rationale: Phân từ hiện tại được danh từ hóa diễn tả bất cứ người nào có đặc điểm là tin. “Tin Ta” là tiếng Việt tự nhiên cho πιστεύω εἰς và vẫn chuyển tải lòng tin hướng đến Đức Giê-su.
- source_word: κἂν ἀποθάνῃ
  choice: dù có chết
  rationale: κἄν cùng động từ giả định tạo mệnh đề nhượng bộ; “dù có chết” diễn đạt tự nhiên mà không thêm sắc thái ngoài nguyên văn.
- source_word: ζήσεται
  choice: cũng sẽ sống
  rationale: Thì tương lai được giữ bằng “sẽ sống”; “cũng” kết nối tự nhiên với mệnh đề nhượng bộ. Không thêm “lại” vì ζήσεται tự nó chỉ nói “sẽ sống”, để ngỏ chiều rộng ý nghĩa về sự sống bên kia cái chết.
theological_decisions:
- issue: Phạm vi lời tự đồng nhất Ἐγώ εἰμι ἡ ἀνάστασις καὶ ἡ ζωή
  choice: Ta là sự sống lại và sự sống
  alternative: Ta ban sự sống lại và sự sống
  rationale: Giữ lời khẳng định trực tiếp về chính thân vị Đức Giê-su, không chuyển thành một phát biểu chỉ về chức năng hay quà tặng của Ngài.
- issue: Dạng giống đực số ít mang tính đại diện trong ὁ πιστεύων và các động từ theo sau
  choice: Người nào tin Ta, dù có chết, cũng sẽ sống
  alternative: Người tin Ta, dù người ấy chết, sẽ sống
  rationale: Tiếng Việt không bắt buộc đánh dấu giống ngữ pháp. “Người nào” giữ ý nghĩa số ít khái quát và bao gồm mọi người một cách tự nhiên, không cần đưa đại từ giống đực vào bản dịch.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Giê-su” trong lời dẫn và “Ta” trong lời tự xưng để duy trì phẩm cách của lời tuyên bố. Không cần chú thích về giống đực đại diện vì tiếng Việt truyền đạt ý khái quát mà không đánh dấu giới tính.
