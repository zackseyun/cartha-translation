revisions:
- from: Nhưng con biết Cha luôn nghe con. Song con nói điều này vì đám đông đang đứng chung quanh đây, để họ tin rằng chính Cha đã sai con đến.
  to: Con vốn biết rằng Cha luôn nghe con; nhưng con nói điều này vì đám đông đang đứng chung quanh, để họ tin rằng chính Cha đã sai con.
  rationale: Bản sửa bỏ chi tiết vị trí không có trong nguyên văn, tránh thêm nét nghĩa “đến” vào động từ “sai,” và làm trơn cấu trúc đối lập. “Vốn biết” duy trì ý thức đã có từ trước của ᾔδειν trong lời cầu nguyện, còn “chính Cha” tiếp tục phản ánh đại từ nhấn mạnh σύ.
