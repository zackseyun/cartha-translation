source:
  edition: SBLGNT
  text: ἐγὼ δὲ ᾔδειν ὅτι πάντοτέ μου ἀκούεις· ἀλλὰ διὰ τὸν ὄχλον τὸν περιεστῶτα εἶπον, ἵνα πιστεύσωσιν ὅτι σύ με ἀπέστειλας.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/042.yaml
  text: But I knew that you always hear me[a]. Yet I said this because of the crowd standing around[b], so that they may believe that you sent me.
translation:
  language: vi
  text: Con vốn biết rằng Cha luôn nghe con; nhưng con nói điều này vì đám đông đang đứng chung quanh, để họ tin rằng chính Cha đã sai con.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ᾔδειν
  choice: con biết
  rationale: Động từ οἶδα ở hình thức quá khứ, nhưng trong lời cầu nguyện trực tiếp với Cha, tiếng Việt tự nhiên dùng “con biết”; nội dung nói đến sự nhận biết vốn đã có và vẫn đúng.
- source_word: πάντοτέ μου ἀκούεις
  choice: Cha luôn nghe con
  rationale: Giữ nghĩa trực tiếp của πάντοτε và ἀκούω trong bối cảnh cầu nguyện. “Nghe” tự nhiên hơn “lắng nghe” và không diễn giải quá mức rằng lời cầu xin đã được đáp theo một cách cụ thể.
- source_word: ἀλλὰ διὰ τὸν ὄχλον
  choice: Song con nói điều này vì đám đông
  rationale: “Song” giữ lực tương phản của ἀλλά trong văn phong trang trọng, còn διά với đối cách được dịch theo nghĩa nguyên nhân “vì”; mệnh đề mục đích theo sau làm rõ điều lời nói ấy nhằm đạt tới.
- source_word: τὸν περιεστῶτα
  choice: đang đứng chung quanh đây
  rationale: Diễn tả tự nhiên đám đông hiện diện bao quanh Chúa Giê-su; “đây” làm rõ tính trực chỉ của tình huống mà không thêm nội dung thần học.
- source_word: εἶπον
  choice: con nói điều này
  rationale: “Điều này” nêu rõ đối tượng ngầm của động từ “nói”, tức lời cầu nguyện vừa được thốt ra, như tiếng Việt tự nhiên đòi hỏi.
- source_word: ἵνα πιστεύσωσιν
  choice: để họ tin
  rationale: Giữ rõ lực mục đích của ἵνα với thể giả định bằng cấu trúc tiếng Việt gọn và tự nhiên.
- source_word: ὅτι σύ με ἀπέστειλας
  choice: rằng chính Cha đã sai con đến
  rationale: “Chính Cha” bảo toàn sự nhấn mạnh của đại từ σύ; “đã sai con đến” diễn đạt tự nhiên động từ ἀποστέλλω ở thì aorist và giữ chủ đề sứ mạng trong Giăng.
theological_decisions:
- issue: Ý nghĩa việc Cha luôn nghe Chúa Giê-su
  choice: Giữ lời khẳng định trực tiếp rằng Cha luôn nghe Chúa Giê-su, đồng thời cho thấy lời ấy được nói công khai vì đám đông.
  alternative: Diễn giải “nghe” thành một công thức tổng quát về mọi lời cầu nguyện được đáp.
  rationale: Bản dịch duy trì sự thân mật trong tương quan Cha–Con và bối cảnh lời cầu nguyện trước khi La-xa-rơ sống lại, nhưng không thêm một hệ thống thần học vượt quá câu chữ.
- issue: Mục đích của lời cầu nguyện công khai
  choice: Lời nói công khai nhằm để đám đông tin rằng chính Cha đã sai Chúa Giê-su đến.
  alternative: Thu hẹp mục đích thành việc chỉ xác nhận phép lạ này, hoặc mở rộng thành một mệnh đề giáo lý chi tiết về sứ mạng của Chúa Giê-su.
  rationale: Mệnh đề ἵνα tập trung trực tiếp vào niềm tin “rằng chính Cha đã sai con”; bản dịch giữ nguyên trọng tâm ấy mà không thu hẹp hay mở rộng.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng cặp xưng hô “Cha–con” phù hợp lời Chúa Giê-su cầu nguyện với Đức Chúa Cha. Không cần chú thích vì sự nhấn mạnh của σύ đã được thể hiện ngay trong câu bằng “chính Cha”, còn nghĩa nguyên nhân của διά được dịch trực tiếp.
