    issue: Thêm từ “đây”
    rationale: περιεστῶτα mô tả đám đông đang đứng quanh/chung quanh, nhưng không có trạng từ chỉ nơi chốn tương ứng với “đây”.
  - severity: low
    issue: “Đã sai con đến” thêm nét nghĩa hướng-chuyển động
    rationale: ἀπέστειλας có nghĩa “đã sai/phái con”; “đến” không cần thiết và không được biểu thị riêng trong tiếng Hy Lạp.
  - severity: low
    issue: Liên từ “Nhưng ... Song ...”
    rationale: ἀλλὰ chỉ đánh dấu một đối lập sau mệnh đề đầu. Hai liên từ trong bản dịch làm câu kém tự nhiên hơn.
