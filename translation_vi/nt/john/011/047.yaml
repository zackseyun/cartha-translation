    issue: “Hội đồng” viết hoa và không có từ chỉ bất định
    rationale: συνέδριον xuất hiện không mạo từ. Dù ngữ cảnh có thể ám chỉ cơ quan thường gọi là Tòa Công Luận, “một hội đồng” trong chính văn bảo toàn cách diễn đạt của nguyên ngữ; tên truyền thống nên để ở chú thích.
  - severity: low
    issue: “nói với nhau” thêm sắc thái tương hỗ
    rationale: ἔλεγον chỉ nói rằng họ đang nói/phát biểu; nguyên văn không nêu rõ “với nhau”. “Họ nói” trung tính và sát hơn.
  - severity: low
