id: JHN.11.47
reference: John 11:47
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: συνήγαγον οὖν οἱ ἀρχιερεῖς καὶ οἱ Φαρισαῖοι συνέδριον, καὶ ἔλεγον· Τί ποιοῦμεν ὅτι οὗτος ὁ ἄνθρωπος πολλὰ ⸂ποιεῖ σημεῖα⸃;
base_translation:
  language: en
  yaml_path: translation/nt/john/011/047.yaml
  text: So the chief priests and the Pharisees gathered a council and were saying[a], “What are we doing? For this man is doing many signs.”
translation:
  language: vi
  text: 'Vì vậy, các thượng tế và người Pha-ri-si bèn triệu tập một hội đồng[a] và nói: “Chúng ta đang làm gì đây? Vì người này đang làm nhiều dấu lạ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “Tòa Công Luận”, tức hội đồng lãnh đạo của người Do Thái.
    reason: Nêu tên truyền thống và chức năng thể chế có thể được chỉ bởi συνέδριον.
lexical_decisions:
- source_word: συνήγαγον
  choice: triệu tập
  rationale: Động từ aorist chủ động với συνέδριον làm bổ ngữ; “triệu tập” tự nhiên trong tiếng Việt khi nói các nhà lãnh đạo gọi một hội đồng nhóm họp.
- source_word: οὖν
  choice: Vì vậy
  rationale: Diễn tả hệ quả về mặt tường thuật và lập luận từ việc La-xa-rơ được làm cho sống lại.
- source_word: ἀρχιερεῖς
  choice: các thượng tế
  rationale: Cách gọi quen thuộc dành cho giới lãnh đạo tư tế, không hàm ý cùng lúc có nhiều người giữ chức thượng tế tối cao.
- source_word: Φαρισαῖοι
  choice: những người Pha-ri-si
  rationale: Phiên âm tên nhóm Do Thái và diễn đạt tự nhiên trong tiếng Việt hiện đại.
- source_word: συνέδριον
  choice: Hội đồng
  rationale: Chỉ cơ quan nghị sự/lãnh đạo Do Thái trong ngữ cảnh; viết hoa để biểu thị cơ quan cụ thể nhưng không đưa tên vay mượn “Sanhedrin” vào chính văn.
- source_word: ἔλεγον
  choice: nói với nhau
  rationale: Thì chưa hoàn thành cho thấy lời bàn luận đang diễn ra; tiếng Việt không đánh dấu thể như tiếng Hy Lạp, nên “nói với nhau” truyền đạt tự nhiên khung cảnh nghị bàn.
- source_word: Τί ποιοῦμεν
  choice: Chúng ta đang làm gì đây?
  rationale: Giữ hình thức hiện tại chỉ định và sắc thái tự trách, khẩn cấp, thay vì chuyển thẳng thành câu hỏi “phải làm gì?”
- source_word: ὅτι
  choice: không dịch thành liên từ riêng
  rationale: Trong tiếng Việt, lý do tiếp nối câu hỏi đã rõ khi đặt câu kế ngay sau; thêm “vì” sẽ kém tự nhiên trong lời nói trực tiếp này.
- source_word: οὗτος ὁ ἄνθρωπος
  choice: Người này
  rationale: Giữ cách chỉ định có phần xa cách của người nói mà vẫn tự nhiên và trang trọng.
- source_word: πολλὰ ποιεῖ σημεῖα
  choice: đang thực hiện nhiều dấu lạ
  rationale: “Đang thực hiện” giữ khía cạnh tiếp diễn của hiện tại; “dấu lạ” bảo tồn ý nghĩa thần học của σημεῖα trong Giăng—những việc quyền năng chỉ về căn tính của Đức Chúa Jêsus—thay vì giản lược thành “phép lạ”.
theological_decisions:
- issue: Cách dịch σημεῖα trong văn mạch Giăng
  choice: dấu lạ
  alternative: phép lạ; dấu kỳ
  rationale: '“Dấu lạ” vừa dễ hiểu vừa giữ chức năng mặc khải của các việc làm này: chúng không chỉ kỳ diệu mà còn chỉ về căn tính của Đức Chúa Jêsus.'
- issue: Cách hiểu συνέδριον
  choice: Hội đồng trong chính văn, kèm chú thích nhận diện
  alternative: Tòa Công Luận; một hội đồng
  rationale: Ngữ cảnh rất có thể chỉ hội đồng lãnh đạo Do Thái tại Giê-ru-sa-lem. Cách dịch này truyền đạt cơ quan cụ thể mà không biến tên truyền thống thành nội dung hiển ngôn của từ Hy Lạp.
- issue: Sắc thái của Τί ποιοῦμεν
  choice: Chúng ta đang làm gì đây?
  alternative: Chúng ta phải làm gì?
  rationale: Giữ hình thức chỉ định của tiếng Hy Lạp và sự căng thẳng giữa lời tự trách với ý deliberative, không âm thầm giải quyết sự mơ hồ theo một phía.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Jêsus” theo lối gọi Tin Lành Việt ngữ trong phần giải trình, nhưng chính văn không thêm tên vốn không có trong câu Hy Lạp. Dấu chú thích [a] được đặt ngay sau “Hội đồng” là từ mà chú thích giải thích.
