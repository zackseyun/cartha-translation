review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng lời khẳng định về sự sống lại vào ngày cuối cùng và giữ được sự lặp lại giữa động từ ἀναστήσεται và danh từ ἀνάστασις. Tuy nhiên, “em con” xác định La-xa-rơ là em của Ma-thê, trong khi câu Hy Lạp chỉ dùng chủ ngữ ngầm (“người ấy/anh ấy”) và không cho biết thứ bậc tuổi tác. “Con” cũng thêm sắc thái xưng hô không được biểu thị trong câu nguồn.
  naturalness: “Trong sự sống lại” khá gượng trong tiếng Việt hiện đại. “Trong cuộc phục sinh vào ngày cuối cùng” vừa tự nhiên hơn vừa giữ được ý biến cố phục sinh cánh chung.
  terminology: “Phục sinh” là thuật ngữ hiện đại, chuẩn xác cho ἀνάστασις trong ngữ cảnh này. “Ngài”/“tôi” giữ sắc thái kính trọng phù hợp mà không thêm quan hệ gia tộc hay thân phận của người nói.
  issues:
  - severity: medium
    issue: “em con” thêm thông tin về tuổi thứ của La-xa-rơ
    rationale: Nguyên văn câu này không nói La-xa-rơ là em của Ma-thê. Dù văn mạch xác định ông là anh/em của Ma-thê, không có cơ sở để chọn “em”; nên dùng “anh ấy” để diễn đạt người nam đã được xác định trong ngữ cảnh mà không quyết định tuổi tác.
  - severity: low
    issue: “trong sự sống lại” chưa tự nhiên
    rationale: Cụm này bám sát hình thức nhưng không phải cách nói thông dụng. “Trong cuộc phục sinh” diễn đạt tự nhiên biến cố mà ἐν τῇ ἀναστάσει chỉ đến, đồng thời vẫn phân biệt với động từ “sống lại”.
  revised_text: 'Ma-thê nói với Ngài: “Tôi biết anh ấy sẽ sống lại trong cuộc phục sinh vào ngày cuối cùng.”'
