- from: 'Ma-thê nói với Ngài: “Con biết em con sẽ sống lại trong sự sống lại vào ngày cuối cùng.”'
  to: 'Ma-thê nói với Ngài: “Tôi biết anh ấy sẽ sống lại trong cuộc phục sinh vào ngày cuối cùng.”'
  rationale: 'Bản sửa loại bỏ suy diễn không có trong câu về thứ bậc của La-xa-rơ, dùng đại từ xưng hô hiện đại và kính trọng, và thay cụm danh từ gượng bằng thuật ngữ “cuộc phục sinh”. Cấu trúc vẫn bảo toàn ý: người ấy sẽ sống lại trong biến cố phục sinh vào ngày cuối cùng.'
  reviewer_model: gpt-5.6-terra
