  text: λέγει αὐτῷ ⸀ἡ Μάρθα· Οἶδα ὅτι ἀναστήσεται ἐν τῇ ἀναστάσει ἐν τῇ ἐσχάτῃ ἡμέρᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/024.yaml
  text: Martha said to him[a], “I know that he will rise again in the resurrection on the last day.”
translation:
  language: vi
  text: 'Ma-thê nói với Ngài: “Tôi biết anh ấy sẽ sống lại trong cuộc phục sinh vào ngày cuối cùng.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: nói
  rationale: Thì hiện tại lịch sử trong tiếng Hy Lạp được dịch bằng lối kể tự nhiên của tiếng Việt; “nói” không đánh dấu thì và phù hợp với lời dẫn hội thoại.
- source_word: αὐτῷ
  choice: với Ngài
  rationale: Đại từ gián tiếp chỉ Chúa Giê-su; “với Ngài” là cách diễn đạt tự nhiên, trang trọng trong tiếng Việt.
- source_word: ἡ Μάρθα
  choice: Ma-thê
  rationale: Dùng dạng tên riêng quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
- source_word: Οἶδα
  choice: Con biết
  rationale: Diễn đạt trực tiếp sự hiểu biết chắc chắn của Ma-thê; đại từ “con” tự nhiên trong lời bà thưa với Chúa Giê-su.
- source_word: ἀναστήσεται
  choice: em con sẽ sống lại
  rationale: Động từ tương lai trong ngữ cảnh phục sinh có nghĩa là trở lại sự sống. Chủ ngữ ngầm là La-xa-rơ; “em con” làm rõ quan hệ đã có trong ngữ cảnh mà không thêm nội dung thần học.
- source_word: ἐν τῇ ἀναστάσει
  choice: trong sự sống lại
  rationale: Giữ gần cấu trúc ἐν và danh từ ἀνάστασις, đồng thời phân biệt biến cố phục sinh chung với việc cá nhân La-xa-rơ sống lại.
- source_word: ἐν τῇ ἐσχάτῃ ἡμέρᾳ
  choice: vào ngày cuối cùng
  rationale: “Vào” là giới từ thời gian tự nhiên trong tiếng Việt; “ngày cuối cùng” giữ nguyên nét cánh chung của cụm từ.
theological_decisions:
- issue: Sự sống lại trong thời kỳ cuối cùng
  choice: Giữ lời Ma-thê nói về sự sống lại tương lai “vào ngày cuối cùng”.
  alternative: Hiểu theo nghĩa khái quát là sự sống sau khi chết.
  rationale: Sự lặp lại của ἀναστήσεται và ἀνάστασις cùng cụm “ngày cuối cùng” chỉ rõ niềm hy vọng về cuộc phục sinh cánh chung, nhưng bản dịch không bổ sung chi tiết giáo lý ngoài câu văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài/con” theo quan hệ xưng hô trong ngữ cảnh; giữ sự lặp ý có chủ đích giữa “sống lại” và “sự sống lại” của nguyên văn.
