source:
  edition: SBLGNT
  text: ἀπ’ ἐκείνης οὖν τῆς ἡμέρας ⸀ἐβουλεύσαντο ἵνα ἀποκτείνωσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/053.yaml
  text: So from that day on they planned to kill him.
translation:
  language: vi
  text: Vì vậy, từ ngày ấy, họ lập kế hoạch giết Ngài.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπ’ ἐκείνης ... τῆς ἡμέρας
  choice: từ ngày ấy
  rationale: Cụm giới từ chỉ mốc thời gian bắt đầu. Trong tiếng Việt, “từ ngày ấy” tự nhiên và trong ngữ cảnh đã hàm ý diễn tiến kể từ đó về sau.
- source_word: οὖν
  choice: Vì vậy
  rationale: Liên từ nêu hệ quả từ cuộc nghị bàn ngay trước đó; “Vì vậy” giữ rõ quan hệ suy luận và vẫn tự nhiên trong văn kể trang trọng.
- source_word: ἐβουλεύσαντο
  choice: họ lập kế hoạch
  rationale: Động từ chỉ sự bàn tính dẫn đến một kế hoạch có chủ ý. “Lập kế hoạch” truyền đạt tính chủ động và dứt khoát, mạnh hơn việc chỉ cân nhắc nhưng không thêm sắc thái pháp lý.
- source_word: ἵνα ἀποκτείνωσιν
  choice: giết
  rationale: Mệnh đề ἵνα nêu nội dung hoặc mục đích của việc lập kế hoạch. Cấu trúc “lập kế hoạch giết” là cách diễn đạt gọn, tự nhiên và giữ nghĩa thẳng của ἀποκτείνω.
- source_word: αὐτόν
  choice: Ngài
  rationale: Đại từ chỉ Đức Chúa Jêsus trong ngữ cảnh trực tiếp. “Ngài” là đại từ tôn kính tự nhiên trong văn Kinh Thánh tiếng Việt mà không thay đại từ nguồn bằng tên riêng.
theological_decisions:
- issue: Mức độ dứt khoát trong ý định của các nhà lãnh đạo đối với Đức Chúa Jêsus
  choice: Diễn đạt đây là một kế hoạch nhằm giết Ngài, không làm nhẹ thành việc chỉ thảo luận hay cân nhắc.
  alternative: “họ bàn về việc giết Ngài” hoặc “họ cân nhắc việc xử tử Ngài”
  rationale: Nguyên văn trình bày một bước ngoặt có chủ ý sau cuộc nghị bàn. “Lập kế hoạch giết” giữ nguyên sức nặng của ý định thù nghịch, đồng thời không đưa thêm hàm ý về một thủ tục xét xử chính thức.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Câu giữ liên từ hệ quả ở đầu và dùng cách diễn đạt trực tiếp, không cổ hóa. Không cần chú thích vì không có dị bản hay nét mơ hồ nào ảnh hưởng đáng kể đến bản dịch câu này.
