  text: εἶπεν οὖν ⸀ἡ Μάρθα πρὸς ⸀τὸν Ἰησοῦν· Κύριε, εἰ ἦς ὧδε ⸂οὐκ ἂν ἀπέθανεν ὁ ἀδελφός μου⸃·
base_translation:
  language: en
  yaml_path: translation/nt/john/011/021.yaml
  text: So Martha said to Jesus[a], “Lord, if you had been here, my brother would not have died.”
translation:
  language: vi
  text: 'Vì vậy, Ma-thê nói với Chúa Jêsus: “Lạy Chúa[a], nếu Chúa đã ở đây, thì người anh em của tôi đã không chết.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “Thưa ngài”; từ Hy Lạp κύριε có thể là cách xưng hô kính trọng, nhưng “Lạy Chúa” cũng giữ được sắc thái thần học có thể có trong Phúc Âm Giăng.
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: Vì vậy
  rationale: Liên từ này nối lời Ma-thê với diễn tiến và nguyên do trong câu chuyện; “Vì vậy” giữ được lực suy diễn mà vẫn tự nhiên trong tiếng Việt.
- source_word: εἶπεν ... πρὸς τὸν Ἰησοῦν
  choice: thưa với Đức Chúa Jêsus
  rationale: Động từ nói cùng giới từ πρός chỉ người được nói trực tiếp. “Thưa với” phù hợp với cách Ma-thê kính cẩn nói với Đức Chúa Jêsus.
- source_word: Κύριε
  choice: Lạy Chúa
  rationale: Cách dịch này vừa là lời xưng hô kính trọng vừa giữ được sức nặng thần học có thể có của κύριε trong Phúc Âm Giăng.
- source_word: εἰ ἦς ὧδε
  choice: nếu Chúa đã ở đây
  rationale: Thể chưa hoàn thành trong điều kiện trái với thực tế ở quá khứ được diễn đạt tự nhiên bằng “đã ở đây” trong tiếng Việt.
- source_word: οὐκ ἂν ἀπέθανεν
  choice: đã không chết
  rationale: Kết cấu οὐκ + ἄν + động từ chỉ kết quả trái với thực tế trong quá khứ; trong mệnh đề có “nếu ... thì”, tiếng Việt diễn đạt tự nhiên bằng “đã không chết”.
- source_word: ὁ ἀδελφός μου
  choice: người anh em trai của con
  rationale: ἀδελφός ở đây chỉ La-xa-rơ, người cùng cha mẹ hoặc cùng một gia đình với Ma-thê. Cách dịch này giữ giới tính nam mà không tự ý xác định ông là anh hay em của Ma-thê.
theological_decisions:
- issue: Cách dịch κύριε khi Ma-thê xưng hô với Đức Chúa Jêsus
  choice: Lạy Chúa
  alternative: Thưa ngài
  rationale: “Lạy Chúa” theo cách dịch mặc định của κύριος, đồng thời bảo toàn cả sắc thái kính trọng lẫn âm hưởng Cơ Đốc học có thể có, nhưng chú thích vẫn ghi nhận nghĩa xưng hô lịch sự.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Người anh em trai của con” hơi đầy đủ hơn khẩu ngữ nhưng tránh việc tự ý xác định La-xa-rơ là anh hay em của Ma-thê. Dấu chú thích được đặt ngay sau lời xưng hô tương ứng.
