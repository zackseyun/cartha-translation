- from: 'Vì vậy, Ma-thê thưa với Đức Chúa Jêsus: “Lạy Chúa[a], nếu Chúa đã ở đây thì người anh em trai của con đã không chết.”'
  to: 'Vì vậy, Ma-thê nói với Chúa Jêsus: “Lạy Chúa[a], nếu Chúa đã ở đây, thì người anh em của tôi đã không chết.”'
  rationale: Bản sửa loại bỏ đại từ “con” không có trong nguyên văn, dùng cách trần thuật hiện đại tự nhiên hơn, và giữ “Lạy Chúa” cùng chú thích để bảo toàn cả sắc thái kính trọng lẫn khả năng hàm ý thần học của κύριε. Dấu phẩy sau mệnh đề điều kiện giúp câu tiếng Việt rõ và tự nhiên hơn.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T06:24:41Z'
review_pass:
  verdict: revise
  source_fidelity: Bản nháp phản ánh đúng cấu trúc điều kiện trái thực tế trong quá khứ và giữ được lực xưng hô của κύριε. Tuy nhiên, “con” trong “người anh em trai của con” không có đối ứng trong ἀδελφός μου và thêm quan hệ xưng hô/ngôi thứ nhất với Chúa mà nguyên văn không nêu. Cụm “Đức Chúa Jêsus” cũng khiến tên riêng bị trình bày như một tước hiệu không có trong πρὸς τὸν Ἰησοῦν.
  naturalness: “Thưa với” kém tự nhiên hơn “nói với” trong trần thuật. “Người anh em trai của tôi” bảo toàn giới tính nhưng hơi nặng; “người anh em của tôi” là cách nói tự nhiên, trang trọng, và trong ngữ cảnh này chỉ La-xa-rơ, một nam giới.
  terminology: Giữ “Chúa” cho κύριε theo lựa chọn dự án, với chú thích nêu khả năng “Thưa ngài”. Dùng “Chúa Jêsus” trong lời trần thuật, thay vì thêm “Đức” vào tên riêng khi bản Hy Lạp chỉ có Ἰησοῦν.
  issues:
  - severity: medium
    issue: Thêm đại từ “con” trong “người anh em trai của con”.
    rationale: μου chỉ có nghĩa là “của tôi”. “Con” vừa thay đổi ngôi xưng hô vừa thêm sắc thái tự xưng là con trước Chúa, điều câu Hy Lạp không diễn đạt.
  - severity: low
    issue: “Thưa với Đức Chúa Jêsus” không tự nhiên và thêm yếu tố tước hiệu trong phần trần thuật.
    rationale: εἶπεν ... πρὸς τὸν Ἰησοῦν được dịch tự nhiên là “Ma-thê nói với Chúa Jêsus”; nguyên văn dùng tên Ἰησοῦν, không có κύριος tại đây.
  - severity: low
    issue: Cụm “người anh em trai” nặng về lối diễn đạt.
    rationale: “Người anh em của tôi” tự nhiên hơn trong văn phong trang trọng, không buộc phải quyết định La-xa-rơ là anh hay em của Ma-thê, và ngữ cảnh xác định người này là nam.
