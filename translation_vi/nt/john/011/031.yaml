  source_fidelity: 'Bản dịch chuyển tải đúng các thành phần chính: nhóm Ἰουδαῖοι ở cùng Ma-ri trong nhà và an ủi bà, thấy bà đứng dậy mau chóng đi ra, rồi theo bà vì cho rằng bà đến mộ để khóc. Tuy nhiên, “Vì vậy” có thể tạo một quan hệ nhân quả mạnh hơn sắc thái nối tiếp/suy luận của οὖν; “bấy giờ” tự nhiên hơn trong văn thuật. “Vì nghĩ rằng” có thể hiểu là lý do được người kể khẳng định, trong khi δόξαντες là sự phỏng đoán của họ; “vì tưởng rằng” phản ánh chính xác hơn.'
