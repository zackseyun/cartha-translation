id: JHN.11.31
reference: John 11:31
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οἱ οὖν Ἰουδαῖοι οἱ ὄντες μετ’ αὐτῆς ἐν τῇ οἰκίᾳ καὶ παραμυθούμενοι αὐτήν, ἰδόντες τὴν ⸀Μαριὰμ ὅτι ταχέως ἀνέστη καὶ ἐξῆλθεν, ἠκολούθησαν αὐτῇ ⸀δόξαντες ὅτι ὑπάγει εἰς τὸ μνημεῖον ἵνα κλαύσῃ ἐκεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/031.yaml
  text: So the Jews who were with her in the house and comforting her[a], when they saw that Mary got up quickly and went out, followed her, thinking that she was going to the tomb to weep there.
translation:
  language: vi
  text: Bấy giờ, những người Do Thái ở cùng bà trong nhà và đang an ủi bà[a], khi thấy Ma-ri vội đứng dậy rồi đi ra, thì đi theo bà, vì tưởng rằng bà đi đến mộ để khóc ở đó.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “những người Giu-đê”. Trong sách Giăng, Ἰουδαῖοι đôi khi có thể chỉ cụ thể hơn những người từ miền Giu-đê hoặc giới lãnh đạo Giu-đê; nhưng ở đây từ này chỉ nhóm người ở cùng Ma-ri và đang an ủi bà.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ οὖν Ἰουδαῖοι
  choice: Vì vậy, những người Do Thái
  rationale: οὖν nối tiếp diễn tiến câu chuyện; “Vì vậy” diễn đạt quan hệ tự nhiên với ngữ cảnh trước. Ἰουδαῖοι ở đây chỉ những người đang cùng Ma-ri chịu tang, không phải toàn thể dân Do Thái; phương án địa lý “người Giu-đê” được giữ trong chú thích.
- source_word: οἱ ὄντες μετ’ αὐτῆς ἐν τῇ οἰκίᾳ καὶ παραμυθούμενοι αὐτήν
  choice: đang ở cùng cô trong nhà và an ủi cô
  rationale: Cụm phân từ xác định nhóm người đang được nói đến. παραμυθέομαι mang nghĩa an ủi, khích lệ trong cảnh tang chế; “an ủi” tự nhiên và rõ ràng trong tiếng Việt hiện đại.
- source_word: ἰδόντες τὴν Μαριὰμ ὅτι ταχέως ἀνέστη καὶ ἐξῆλθεν
  choice: khi thấy Ma-ri vội đứng dậy đi ra
  rationale: Phân từ aorist ἰδόντες được diễn đạt bằng mệnh đề thời gian. ἀνέστη ở đây là đứng dậy khỏi chỗ ngồi, không hàm ý sống lại; “vội đứng dậy đi ra” giữ được sắc thái ταχέως và diễn tiến hành động.
- source_word: ἠκολούθησαν αὐτῇ
  choice: thì đi theo cô
  rationale: ἀκολουθέω ở đây chỉ hành động đi theo về mặt thể lý, không cần gán sắc thái môn đồ.
- source_word: δόξαντες ὅτι ὑπάγει
  choice: vì nghĩ rằng cô đi
  rationale: δόξαντες diễn tả suy đoán của họ. Thì hiện tại ὑπάγει nằm trong lời suy nghĩ gián tiếp và được giữ tự nhiên trong tiếng Việt là “cô đi”.
- source_word: εἰς τὸ μνημεῖον ἵνα κλαύσῃ ἐκεῖ
  choice: đến mộ để khóc ở đó
  rationale: μνημεῖον chỉ ngôi mộ chôn La-xa-rơ; “mộ” là cách gọi tự nhiên. ἵνα với giả định thức diễn tả mục đích, được chuyển thành “để khóc ở đó”.
theological_decisions:
- issue: Ý nghĩa của Ἰουδαῖοι trong văn thuật của Giăng
  choice: Dịch là “những người Do Thái”, nhưng ngữ cảnh giới hạn đối tượng vào nhóm người đang ở cùng và an ủi Ma-ri.
  alternative: những người Giu-đê
  rationale: Cách dùng Ἰουδαῖοι trong Giăng tùy thuộc ngữ cảnh và đôi khi có thể mang nghĩa địa lý hoặc chỉ giới lãnh đạo Giu-đê. Tại đây, mệnh đề theo sau xác định họ là những người chịu tang cùng Ma-ri; bản dịch trực tiếp được giữ trong chính văn, còn khả năng địa lý được nêu trong chú thích để không xóa bỏ độ rộng nghĩa.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “cô” để quy chiếu Ma-ri theo lối kể tự nhiên, tránh lặp tên; dùng “Ma-ri” và “mộ” theo cách gọi quen thuộc. Cấu trúc câu bám sát chuỗi hành động của nguyên văn nhưng được điều chỉnh vừa đủ để đọc trôi chảy.
