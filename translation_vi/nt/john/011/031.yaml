  terminology: “Những người Do Thái,” “Ma-ri,” “mộ,” và “an ủi” đều phù hợp. Chú thích về khả năng “người Giu-đê” nên tránh mô tả họ là cùng chịu tang, vì nguyên văn chỉ xác định họ ở cùng và đang an ủi Ma-ri.
