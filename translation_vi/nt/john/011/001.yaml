    rationale: Cách nói này kém tự nhiên trong tiếng Việt hiện đại; hơn nữa phân từ hiện tại mô tả tình trạng hiện có, không nhất thiết cần diễn giải bằng một cách dịch mang sắc thái tiếp diễn.
  revised_text: Có một người bị bệnh[a], là La-xa-rơ, ở Bê-tha-ni, ngôi làng của hai chị em Ma-ri và Ma-thê.
