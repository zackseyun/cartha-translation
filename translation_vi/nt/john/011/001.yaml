    rationale: “Quê” thường hàm ý quê quán/nơi gốc gác. ἀπὸ Βηθανίας trong cấu trúc này chỉ nhận diện La-xa-rơ theo Bê-tha-ni; không cần xác định quan hệ quê quán.
  - severity: low
