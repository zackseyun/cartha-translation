  text: Ἦν δέ τις ἀσθενῶν, Λάζαρος ἀπὸ Βηθανίας ἐκ τῆς κώμης Μαρίας καὶ Μάρθας τῆς ἀδελφῆς αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/001.yaml
  text: A certain man was sick[a], Lazarus from Bethany, from the village of Mary and her sister Martha.
translation:
  language: vi
  text: Có một người bị bệnh[a], là La-xa-rơ, ở Bê-tha-ni, ngôi làng của hai chị em Ma-ri và Ma-thê.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “Có một người đang bị bệnh.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἦν δέ
  choice: Có
  rationale: Cấu trúc hiện hữu mở đầu câu được diễn đạt tự nhiên bằng “Có”; lực nối nhẹ của δέ được để cho mạch văn đảm nhiệm, không thêm một từ chỉ thời gian như “bấy giờ”.
- source_word: τις
  choice: một người
  rationale: Giữ tính bất định nhưng cụ thể của τις; không cần thêm “nọ” hay “kia”, vốn có thể làm giọng kể nặng hơn.
- source_word: ἀσθενῶν
  choice: bị bệnh
  rationale: Trong ngữ cảnh này, từ này chỉ tình trạng đau ốm chứ không đơn thuần là yếu đuối. “Bị bệnh” là cách nói phổ thông, tự nhiên.
- source_word: Λάζαρος
  choice: La-xa-rơ
  rationale: Phiên âm tên riêng theo cách quen dùng và dễ đọc trong tiếng Việt.
- source_word: ἀπὸ Βηθανίας
  choice: quê ở Bê-tha-ni
  rationale: ἀπό chỉ nơi xuất thân. “Quê ở” chuyển tải tự nhiên quan hệ nguồn gốc trong tiếng Việt.
- source_word: ἐκ τῆς κώμης
  choice: ngôi làng
  rationale: κώμη là làng hoặc khu dân cư nhỏ, không phải một thành phố; tiếng Việt không cần lặp lại “từ” sau cụm “quê ở Bê-tha-ni”.
- source_word: Μαρίας καὶ Μάρθας τῆς ἀδελφῆς αὐτῆς
  choice: của hai chị em Ma-ri và Ma-thê
  rationale: Diễn đạt tự nhiên mối quan hệ chị em được nêu trong nguyên văn mà không quyết định ai lớn tuổi hơn; trật tự tên Ma-ri rồi Ma-thê vẫn được giữ nguyên.
theological_decisions: []
