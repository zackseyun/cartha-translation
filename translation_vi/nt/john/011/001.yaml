review_pass:
  verdict: revise
  source_fidelity: Bản dịch truyền đạt đúng tình trạng đau ốm, địa danh và quan hệ chị em. Tuy nhiên, “quê ở” cụ thể hóa ἀπό như quê quán/nơi xuất thân, trong khi câu Hy Lạp chỉ định vị La-xa-rơ là người “từ/ở Bê-tha-ni”; nên dùng cách diễn đạt trung tính hơn.
  naturalness: Câu nhìn chung tự nhiên. “Ở Bê-tha-ni” gọn và phù hợp hơn “quê ở Bê-tha-ni” trong mạch tiếp theo xác định đây là một ngôi làng. Cụm “là La-xa-rơ” giữ kiểu đồng vị của nguyên văn mà vẫn trôi chảy.
  terminology: La-xa-rơ, Bê-tha-ni, Ma-ri và Ma-thê nhất quán, dễ đọc. “Hai chị em” truyền đạt τῆς ἀδελφῆς αὐτῆς mà không suy đoán thứ bậc tuổi tác.
  issues:
