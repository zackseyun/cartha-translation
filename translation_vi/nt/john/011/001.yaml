revisions:
- from: Có một người bị bệnh[a], tên là La-xa-rơ, quê ở Bê-tha-ni, ngôi làng của hai chị em Ma-ri và Ma-thê.
  to: Có một người bị bệnh[a], là La-xa-rơ, ở Bê-tha-ni, ngôi làng của hai chị em Ma-ri và Ma-thê.
  rationale: Thay “quê ở” bằng “ở” để không thêm ý về quê quán mà vẫn diễn đạt tự nhiên quan hệ địa lý trong nguyên văn. Thay “tên là” bằng “là” để phản ánh gần hơn lối đồng vị “một người bệnh, La-xa-rơ”. Chú thích được chỉnh thành một phương án tiếng Việt tự nhiên hơn cho tình trạng được diễn tả bằng phân từ hiện tại.
