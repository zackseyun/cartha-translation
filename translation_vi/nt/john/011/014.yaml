  text: τότε οὖν εἶπεν αὐτοῖς ὁ Ἰησοῦς παρρησίᾳ· Λάζαρος ἀπέθανεν,
base_translation:
  language: en
  yaml_path: translation/nt/john/011/014.yaml
  text: So then Jesus told them plainly[a], “Lazarus has died.”
translation:
  language: vi
  text: 'Vậy nên, Giê-su nói thẳng với họ: “La-xa-rơ đã chết.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τότε οὖν
  choice: Bấy giờ
  rationale: Cụm từ này đánh dấu bước chuyển tiếp theo trình tự trong câu chuyện, đồng thời có sắc thái hệ quả. Trong tiếng Việt, “Bấy giờ” diễn đạt tự nhiên diễn tiến ấy mà không ghép các liên từ một cách gượng ép.
- source_word: εἶπεν αὐτοῖς
  choice: nói ... với họ
  rationale: Cách diễn đạt này sát cấu trúc Hy Lạp và tự nhiên trong tiếng Việt hiện đại.
- source_word: παρρησίᾳ
  choice: nói rõ
  rationale: Trong ngữ cảnh, từ này đối lập với cách nói bóng về giấc ngủ ở trước đó, nên “nói rõ” truyền đạt việc Chúa Jêsus phát biểu trực tiếp, không còn hàm ý.
- source_word: Λάζαρος
  choice: La-xa-rơ
  rationale: Dùng dạng phiên âm quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
- source_word: ἀπέθανεν
  choice: đã chết
  rationale: Thì bất định Hy Lạp nêu biến cố tử vong đã xảy ra; “đã chết” vừa tự nhiên vừa giữ sự liên hệ hiện tại của biến cố trong mạch truyện.
theological_decisions:
- issue: Tính chất lời xác nhận của Chúa Jêsus về tình trạng La-xa-rơ
  choice: Diễn đạt trực tiếp rằng La-xa-rơ đã chết về thể xác.
  alternative: Giữ lại hình ảnh ‘ngủ’.
  rationale: Chính câu Hy Lạp dùng ἀπέθανεν để giải nghĩa lời nói bóng trước đó; vì vậy bản dịch không nên duy trì sự mơ hồ mà nguyên văn đã tháo gỡ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Jêsus” và dạng tên “La-xa-rơ” theo lối phiên âm Kinh Thánh tiếng Việt quen thuộc; dấu hai chấm dẫn lời nói trực tiếp một cách tự nhiên.
