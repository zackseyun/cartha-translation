  text: ὡς οὖν ἤκουσεν ὅτι ἀσθενεῖ, τότε μὲν ἔμεινεν ἐν ᾧ ἦν τόπῳ δύο ἡμέρας·
base_translation:
  language: en
  yaml_path: translation/nt/john/011/006.yaml
  text: So when he heard that he was sick[a], he then stayed two days in the place where he was.
translation:
  language: vi
  text: Vì thế, khi nghe tin La-xa-rơ đang bị bệnh, Đức Giê-su vẫn ở lại nơi Ngài đang ở thêm hai ngày.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡς οὖν
  choice: Vì thế, khi
  rationale: Diễn đạt cả sức nối kết/suy luận của οὖν và ý thời gian của ὡς, đồng thời tự nhiên trong văn kể chuyện tiếng Việt.
- source_word: ἤκουσεν
  choice: nghe
  rationale: Giữ nghĩa thông thường của ἀκούω, không thêm hàm ý như “được báo tin”.
- source_word: ὅτι ἀσθενεῖ
  choice: rằng La-xa-rơ đang đau bệnh
  rationale: ἀσθενέω trong ngữ cảnh nói về bệnh thể xác. Thì hiện tại Hy Lạp được giữ bằng “đang”; tên La-xa-rơ được dùng thay đại từ để tránh sự mơ hồ không tự nhiên trong tiếng Việt.
- source_word: τότε μὲν
  choice: vẫn
  rationale: Trong mạch văn, μέν tạo nét nhấn và căng thẳng tương phản trước hành động lên đường sau đó. “Vẫn” truyền đạt tự nhiên việc Đức Giê-su tiếp tục ở lại sau khi nghe tin, còn τότε được thể hiện qua trình tự “khi... vẫn...” và cụm thời lượng.
- source_word: ἔμεινεν
  choice: ở lại
  rationale: Diễn đạt tự nhiên nghĩa của μένω là tiếp tục lưu lại tại một nơi.
- source_word: ἐν ᾧ ἦν τόπῳ
  choice: nơi mình đang ở
  rationale: Giữ ý địa điểm của nguyên văn nhưng tránh lối diễn đạt dư thừa, gượng gạo trong tiếng Việt.
- source_word: δύο ἡμέρας
  choice: thêm hai ngày
  rationale: “Hai ngày” là khoảng thời gian trực tiếp; “thêm” làm rõ rằng Ngài tiếp tục ở lại trong hai ngày, phù hợp với ἔμεινεν và mạch kể.
theological_decisions:
- issue: Hàm ý của việc Đức Giê-su trì hoãn sau khi nghe tin La-xa-rơ đau bệnh
  choice: Trình bày thẳng rằng Ngài vẫn ở lại thêm hai ngày, không giải thích động cơ.
  alternative: Diễn giải trong câu rằng sự trì hoãn là một chiến lược đầy lòng thương xót hoặc làm nhẹ sự căng thẳng.
  rationale: Nguyên văn cố ý duy trì sự căng thẳng giữa việc nghe tin bệnh và việc tiếp tục ở lại. Bản dịch không nên tự giải quyết sự căng thẳng thần học ấy.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Đức Giê-su” và “La-xa-rơ” để nhận diện rõ các nhân vật; cấu trúc câu giữ nhịp kể cùng sự căng thẳng của nguyên văn.
