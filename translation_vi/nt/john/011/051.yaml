id: JHN.11.51
reference: John 11:51
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τοῦτο δὲ ἀφ’ ἑαυτοῦ οὐκ εἶπεν, ἀλλὰ ἀρχιερεὺς ὢν τοῦ ἐνιαυτοῦ ἐκείνου ἐπροφήτευσεν ὅτι ἔμελλεν Ἰησοῦς ἀποθνῄσκειν ὑπὲρ τοῦ ἔθνους,
base_translation:
  language: en
  yaml_path: translation/nt/john/011/051.yaml
  text: He did not say this from himself[a], but being high priest that year, he prophesied that Jesus was going to die for the nation[c][b],
translation:
  language: vi
  text: Ông không tự ý nói điều đó[a]; nhưng vì là thượng tế trong năm ấy, ông đã nói tiên tri rằng Giê-su sẽ chết vì dân tộc[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “không tự mình nói điều đó.”'
    reason: lexical_alternative
  - marker: b
    text: 'Hoặc: “sắp chết” hay “được định là sẽ chết.”'
    reason: lexical_alternative
  - marker: c
    text: 'Hoặc: “vì lợi ích của dân tộc.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀφ’ ἑαυτοῦ
  choice: tự mình
  rationale: Diễn đạt tự nhiên ý lời nói không xuất phát từ chính Cai-phe hay sáng kiến riêng của ông, đồng thời không phủ nhận rằng chính ông đã nói.
- source_word: ἀρχιερεὺς ὢν τοῦ ἐνιαυτοῦ ἐκείνου
  choice: vì là thầy tế lễ thượng phẩm trong năm ấy
  rationale: Phân từ ὢν cung cấp hoàn cảnh có sắc thái nguyên nhân; “vì là” làm rõ quan hệ này bằng tiếng Việt tự nhiên mà không thêm một lý thuyết về chức vụ.
- source_word: ἐπροφήτευσεν
  choice: đã nói tiên tri
  rationale: Giữ nguyên sức nặng minh nhiên của động từ về lời tiên tri, nhưng không khẳng định thêm Cai-phe ý thức đầy đủ ý nghĩa lời mình nói.
- source_word: ἔμελλεν ... ἀποθνῄσκειν
  choice: sẽ chết
  rationale: Trong ngữ cảnh, μέλλω với động từ nguyên mẫu hướng đến biến cố sắp xảy ra hoặc đã được định trước trong diễn tiến câu chuyện; “sẽ chết” tự nhiên và không ép nghĩa thành sự cận kề tức thời hay tiền định tuyệt đối.
- source_word: ὑπὲρ τοῦ ἔθνους
  choice: vì dân tộc
  rationale: “Vì” bảo tồn phạm vi ý nghĩa lợi ích/đại diện của ὑπέρ mà không buộc câu này vào một công thức chuộc tội kỹ thuật; “dân tộc” giữ số ít và chỉ dân Do Thái trong ngữ cảnh.
theological_decisions:
- issue: Lời của Cai-phe có tính tiên tri
  choice: Nói rõ rằng ông “đã nói tiên tri” do là thầy tế lễ thượng phẩm trong năm ấy.
  alternative: Chỉ xem đây là lời mỉa mai, hoặc thêm rằng Cai-phe có ý thức đầy đủ về sự soi dẫn.
  rationale: Bản văn trực tiếp gọi lời ấy là tiên tri nhưng không mô tả mức độ nhận thức, tư cách đạo đức hay một học thuyết đầy đủ về sự soi dẫn của Cai-phe.
- issue: Ý nghĩa của ὑπὲρ đối với cái chết của Đức Chúa Jêsus
  choice: Dùng “vì dân tộc” trong chính văn.
  alternative: “thay cho dân tộc” hoặc “vì lợi ích của dân tộc.”
  rationale: Cách dịch rộng này giữ sắc thái đại diện/lợi ích và sức nặng thần học, nhưng không thu hẹp ὑπέρ thành một nghĩa thay thế kỹ thuật duy nhất.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “thầy tế lễ thượng phẩm” theo lối Kinh Thánh tiếng Việt quen thuộc; đại từ “ông” nối tự nhiên với Cai-phe trong ngữ cảnh. Các dấu chú thích đều xuất hiện trong chính văn, đặt [b] sau “sẽ chết” và [c] sau “dân tộc” để gắn đúng cụm từ.
