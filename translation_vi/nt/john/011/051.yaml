- from: Ông không tự mình nói điều đó[a]; nhưng vì là thầy tế lễ thượng phẩm trong năm ấy, ông đã nói tiên tri rằng Đức Chúa Jêsus sẽ chết vì dân tộc[b][c].
  to: Ông không tự ý nói điều đó[a]; nhưng vì là thượng tế trong năm ấy, ông đã nói tiên tri rằng Giê-su sẽ chết vì dân tộc[b][c].
  rationale: Bản sửa loại bỏ tước hiệu không có trong tiếng Hy Lạp, dùng tên Giê-su theo chính tả hiện đại, và điều chỉnh chú thích về ὑπέρ để tránh nghĩa “thay mặt” không phù hợp. Các neo chú thích vẫn gắn đúng với ἀφ’ ἑαυτοῦ, ἔμελλεν ... ἀποθνῄσκειν, và ὑπὲρ τοῦ ἔθνους.
