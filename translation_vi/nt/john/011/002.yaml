source:
  edition: SBLGNT
  text: ἦν δὲ ⸀Μαριὰμ ἡ ἀλείψασα τὸν κύριον μύρῳ καὶ ἐκμάξασα τοὺς πόδας αὐτοῦ ταῖς θριξὶν αὐτῆς, ἧς ὁ ἀδελφὸς Λάζαρος ἠσθένει.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/002.yaml
  text: It was Mary who had anointed the Lord with perfume and wiped his feet with her hair[a], whose brother Lazarus was sick.
translation:
  language: vi
  text: Đó là Ma-ri, người đã xức dầu thơm cho Chúa và lấy tóc mình lau chân Ngài[a]. La-xa-rơ, người anh em của Ma-ri, đang đau ốm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “thuốc xức thơm”; từ Hy Lạp chỉ dầu hoặc thuốc xức có hương thơm.
    reason: Nêu phạm vi nghĩa của μύρον mà không buộc từ này chỉ một dạng chế phẩm duy nhất.
lexical_decisions:
- source_word: ἦν δὲ Μαριὰμ
  choice: Đó là Ma-ri
  rationale: Diễn đạt tự nhiên chức năng nhận diện của ἦν và sắc thái chuyển ý nhẹ của δέ, không thêm một từ chỉ thời gian như “bấy giờ” vốn không có trong nguyên văn.
- source_word: ἡ ἀλείψασα
  choice: người đã xức
  rationale: Mạo từ đi với phân từ aorist dùng để nhận diện Ma-ri bằng một hành động; mệnh đề quan hệ với “đã” là cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: τὸν κύριον
  choice: Chúa
  rationale: Giữ danh xưng dành cho Đức Giê-su và sức nặng thần học, tường thuật của κύριος.
- source_word: μύρῳ
  choice: dầu thơm
  rationale: μύρον chỉ dầu hoặc thuốc xức có hương thơm; “dầu thơm” rõ nghĩa, tự nhiên và phù hợp hành động xức.
- source_word: καὶ ἐκμάξασα τοὺς πόδας αὐτοῦ ταῖς θριξὶν αὐτῆς
  choice: và lấy tóc mình lau chân Ngài
  rationale: Diễn đạt rõ phương tiện của cách dative ταῖς θριξὶν và nghĩa lau/lau khô của ἐκμάσσω bằng trật tự tiếng Việt tự nhiên.
- source_word: ἧς ὁ ἀδελφὸς Λάζαρος
  choice: La-xa-rơ, người anh em của bà
  rationale: Giữ quan hệ anh em mà không tự ý xác định La-xa-rơ lớn hay nhỏ tuổi hơn Ma-ri, điều tiếng Hy Lạp không cho biết.
- source_word: ἠσθένει
  choice: đang đau ốm
  rationale: Thể chưa hoàn thành mô tả tình trạng bệnh kéo dài tại thời điểm tường thuật; “đang đau ốm” tự nhiên và chính xác trong ngữ cảnh.
theological_decisions:
- issue: Cách dịch κύριος khi chỉ Đức Giê-su
  choice: Chúa
  alternative: chủ
  rationale: “Chúa” bảo tồn danh xưng và sức nặng thần học trong sách Giăng, thay vì thu hẹp κύριος thành một quan hệ xã hội đơn thuần.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Tách phần nói về La-xa-rơ thành câu thứ hai để tránh một câu quan hệ dài, đồng thời giữ nguyên mối liên hệ với Ma-ri. Dùng “người anh em” để không thêm thông tin về thứ bậc tuổi tác; tên La-xa-rơ trong ngữ cảnh xác định đây là người nam.
