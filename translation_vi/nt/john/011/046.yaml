  text: τινὲς δὲ ἐξ αὐτῶν ἀπῆλθον πρὸς τοὺς Φαρισαίους καὶ εἶπαν αὐτοῖς ἃ ⸀ἐποίησεν Ἰησοῦς.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/046.yaml
  text: But some of them went to the Pharisees and told them what Jesus had done[a].
translation:
  language: vi
  text: Nhưng một số người trong số họ đến gặp người Pha-ri-si và kể cho họ những việc Giê-su đã làm[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “báo cho họ biết những việc Giê-su đã làm.” Tiếng Hy Lạp không nói rõ động cơ của những người đến gặp người Pha-ri-si.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τινὲς δὲ ἐξ αὐτῶν
  choice: Nhưng một số người trong họ
  rationale: Cụm này chỉ một bộ phận trong nhóm vừa được nhắc đến; δέ mang sắc thái tương phản với phản ứng tin Đức Chúa Jêsus ở câu trước.
- source_word: ἀπῆλθον πρὸς τοὺς Φαρισαίους
  choice: đi đến gặp những người Pha-ri-si
  rationale: Diễn đạt tự nhiên sự rời nơi ấy và đi về phía một nhóm người; không thêm động cơ vào hành động.
- source_word: εἶπαν αὐτοῖς
  choice: kể cho họ
  rationale: Trong ngữ cảnh thuật lại sự việc, cách dịch này tự nhiên hơn lối dịch sát chữ 'nói với họ', đồng thời vẫn trung tính về ý định.
- source_word: ἃ ἐποίησεν Ἰησοῦς
  choice: những việc Đức Chúa Jêsus đã làm
  rationale: Đại từ quan hệ số nhiều ἃ quy chiếu đến các việc đã xảy ra; 'đã làm' thể hiện hành động hoàn tất trước lúc họ kể lại.
theological_decisions:
- issue: Động cơ của những người đến gặp người Pha-ri-si
  choice: Dùng lời kể trung tính, không quy kết động cơ
  alternative: tố cáo Đức Chúa Jêsus / báo tin để hại Ngài
  rationale: Bản Hy Lạp chỉ nói họ kể những việc Đức Chúa Jêsus đã làm, chứ không nói rõ họ có thiện ý hay ác ý. Bản dịch giữ nguyên sự mơ hồ này.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “những người Pha-ri-si” để chỉ nhóm người; giữ danh xưng “Đức Chúa Jêsus” theo lối gọi kính trọng quen thuộc trong Kinh Thánh tiếng Việt.
