revisions:
- from: Nhưng một số người trong họ đi đến gặp những người Pha-ri-si và kể cho họ những việc Đức Chúa Jêsus đã làm[a].
  to: Nhưng một số người trong số họ đến gặp người Pha-ri-si và kể cho họ những việc Giê-su đã làm[a].
  rationale: Bỏ tước hiệu không có trong nguyên văn để giữ trung thành với Ἰησοῦς; đồng thời điều chỉnh nhẹ cách diễn đạt “trong số họ” cho rõ nghĩa bộ phận. Phần còn lại giữ lời thuật trung tính, không suy diễn động cơ của những người đi gặp người Pha-ri-si.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T06:23:55Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản thảo truyền đạt đúng cấu trúc chính: một bộ phận trong nhóm đi đến người Pha-ri-si và thuật lại các việc Giê-su đã làm; cũng giữ trung tính về động cơ. Tuy nhiên, nguyên văn chỉ có tên Ἰησοῦς (“Giê-su”), không có tước hiệu “Đức Chúa”, nên tước hiệu này là phần bổ sung không được văn bản câu này nêu ra.'
  naturalness: Câu văn nhìn chung tự nhiên. “Một số người trong số họ” rõ quan hệ bộ phận hơn “một số người trong họ”; “đến gặp người Pha-ri-si” là cách diễn đạt Việt ngữ gọn và tự nhiên.
  terminology: Dùng “Giê-su” cho Ἰησοῦς, không thêm danh xưng. “Người Pha-ri-si” là tên nhóm tôn giáo phù hợp và nhất quán trong câu lẫn chú thích.
  issues:
  - severity: medium
    issue: Thêm tước hiệu “Đức Chúa” trước tên Giê-su
    rationale: SBLGNT chỉ viết Ἰησοῦς. Dù là lối xưng hô kính trọng quen thuộc trong một số truyền thống Việt ngữ, “Đức Chúa” không có trong câu này và làm bản dịch vượt quá dữ liệu nguồn.
  - severity: low
    issue: “trong họ” có thể hơi kém rõ về nghĩa bộ phận
    rationale: ἐξ αὐτῶν nhấn mạnh rằng những người này xuất phát từ trong nhóm vừa nhắc đến. “Trong số họ” diễn đạt rõ hơn mà không đổi nghĩa.
  revised_text: Nhưng một số người trong số họ đến gặp người Pha-ri-si và kể cho họ những việc Giê-su đã làm[a].
