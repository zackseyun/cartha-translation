  text: καὶ ταῦτα εἰπὼν φωνῇ μεγάλῃ ἐκραύγασεν· Λάζαρε, δεῦρο ἔξω.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/043.yaml
  text: And after saying these things[a], he cried out with a loud voice, “Lazarus, come out!”
translation:
  language: vi
  text: 'Sau khi nói những lời ấy, Đức Giê-su kêu lớn: “La-xa-rơ, hãy ra đây!”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταῦτα
  choice: những lời ấy
  rationale: Đại từ chỉ định trung tính số nhiều chỉ những điều Đức Giê-su vừa nói; trong ngữ cảnh phát ngôn, “những lời ấy” tự nhiên hơn “những điều ấy” mà vẫn giữ sắc thái số nhiều.
- source_word: εἰπὼν
  choice: sau khi nói
  rationale: Phân từ bất định quá khứ diễn tả hành động xảy ra trước động từ chính; cách dịch này thể hiện rõ trình tự thời gian bằng tiếng Việt tự nhiên.
- source_word: φωνῇ μεγάλῃ
  choice: kêu lớn
  rationale: Cụm cách ba chỉ cách thức, nhấn mạnh âm lượng. Kết hợp với ἐκραύγασεν thành “kêu lớn” tránh lặp nặng nề như “kêu lớn bằng tiếng lớn”.
- source_word: ἐκραύγασεν
  choice: kêu
  rationale: Động từ chỉ việc cất tiếng mạnh và lớn; “kêu lớn” trang trọng, tự nhiên và giữ được lực của nguyên văn.
- source_word: Λάζαρε
  choice: La-xa-rơ
  rationale: Dạng hô cách của tên riêng Λάζαρος, được phiên âm theo lối quen dùng trong tiếng Việt.
- source_word: δεῦρο ἔξω
  choice: hãy ra đây
  rationale: δεῦρο có nghĩa hướng về phía người nói (“đến đây”), còn ἔξω là “ra ngoài”; “hãy ra đây” chuyển tải tự nhiên lời triệu gọi người ở trong mộ bước ra phía Đức Giê-su.
theological_decisions:
- issue: Cách diễn đạt mệnh lệnh làm phép lạ mà không dùng lối văn cổ
  choice: hãy ra đây
  alternative: hãy bước ra; hãy ra ngoài
  rationale: “Hãy ra đây” giữ cả hướng chuyển động về phía người nói trong δεῦρο và ý đi ra trong ἔξω, đồng thời là tiếng Việt hiện đại, trang nghiêm, không thêm ý nghĩa giáo phái.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. Dùng “Đức Giê-su” theo cách gọi kính trọng phổ biến; dấu hai chấm dẫn lời trực tiếp và câu mệnh lệnh ngắn giữ sức mạnh của lời gọi.
