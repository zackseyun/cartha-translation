id: JHN.11.36
reference: John 11:36
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἔλεγον οὖν οἱ Ἰουδαῖοι· Ἴδε πῶς ἐφίλει αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/036.yaml
  text: So the Jews were saying[a], “See how he loved him!”
translation:
  language: vi
  text: 'Vì thế, những người Do Thái[a] nói: “Hãy xem ông ấy yêu La-xa-rơ biết bao!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “những người Giu-đê,” nếu hiểu đây là cách gọi cụ thể hơn theo vùng miền đối với những người Do Thái đang có mặt chứng kiến.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔλεγον
  choice: nói
  rationale: Thì chưa hoàn thành có thể diễn tả lời nói đang diễn ra hoặc được nhiều người nói; trong tiếng Việt, “nói” tự nhiên trong văn kể và không buộc phải thêm nét lặp lại vốn ngữ cảnh đã gợi rõ.
- source_word: οὖν
  choice: Vì thế
  rationale: Giữ quan hệ suy ra từ việc Đức Chúa Jêsus khóc ở câu trước, đồng thời vẫn tự nhiên trong tiếng Việt hiện đại.
- source_word: οἱ Ἰουδαῖοι
  choice: những người Do Thái
  rationale: Bám sát cách gọi của bản Hy Lạp; trong ngữ cảnh, cụm từ chỉ những người Do Thái đang có mặt chứng kiến, chứ không phải toàn thể dân tộc Do Thái.
- source_word: Ἴδε
  choice: Hãy xem
  rationale: Diễn đạt tự nhiên mệnh lệnh hướng sự chú ý của người nghe.
- source_word: πῶς
  choice: biết bao
  rationale: Trong câu cảm thán này, “biết bao” diễn đạt tự nhiên mức độ tình cảm; sắc thái cách thức vẫn nằm trong hành động yêu được quan sát.
- source_word: ἐφίλει
  choice: yêu
  rationale: φιλέω ở đây chỉ tình cảm yêu mến cá nhân; “yêu” vừa trực tiếp vừa trang trọng, không làm yếu nghĩa thành “quý mến” hay “quan tâm”.
- source_word: αὐτόν
  choice: La-xa-rơ
  rationale: Dùng tên của đối tượng được đại từ chỉ đến để tránh cách nói tiếng Việt dễ mơ hồ “ông ấy yêu ông ấy”, dù bản Hy Lạp dùng đại từ.
theological_decisions:
- issue: Cách dịch οἱ Ἰουδαῖοι trong sách Giăng
  choice: những người Do Thái
  alternative: những người Giu-đê
  rationale: Cách dịch chính giữ nghĩa dân tộc-tôn giáo thông thường của cụm từ, còn chú thích bảo lưu khả năng hiểu theo vùng miền. Ngữ cảnh giới hạn đối tượng vào những người đang chứng kiến tại đó, tránh hàm ý quy kết cho toàn thể người Do Thái.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ông ấy” cho Đức Chúa Jêsus trong lời của những người chứng kiến, phù hợp góc nhìn của người nói; thay đại từ αὐτόν bằng “La-xa-rơ” để câu tiếng Việt rõ nghĩa. Dấu [a] được đặt ngay sau cụm từ liên quan.
