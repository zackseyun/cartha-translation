  text: ἀπέστειλαν οὖν αἱ ἀδελφαὶ πρὸς αὐτὸν λέγουσαι· Κύριε, ἴδε ὃν φιλεῖς ἀσθενεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/003.yaml
  text: So the sisters sent word to him, saying, “Lord, look, the one you love is sick.”
translation:
  language: vi
  text: 'Vì vậy, hai chị em sai người đến thưa với Ngài: “Lạy Chúa, xin Chúa xem, người Chúa yêu đang đau bệnh.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπέστειλαν ... πρὸς αὐτόν λέγουσαι
  choice: sai người đến thưa với Ngài
  rationale: Diễn đạt tự nhiên hành động hai chị em gửi lời nhắn đến Đức Chúa Jêsus; “thưa” phù hợp với lời xưng hô kính trọng “Lạy Chúa”.
- source_word: Κύριε
  choice: Lạy Chúa
  rationale: Giữ cách xưng hô trực tiếp, kính trọng và có thể hàm chứa ý nghĩa thần học của κύριος, không thu hẹp thành một danh xưng thuần thế tục.
- source_word: ἴδε
  choice: '[hàm ý trong lời trình báo]'
  rationale: Trong ngữ cảnh này, ἴδε là từ thu hút sự chú ý. Tiếng Việt tự nhiên thường không cần dịch riêng bằng “hãy xem”; sắc thái khẩn thiết được truyền đạt qua lời báo trực tiếp.
- source_word: ὃν φιλεῖς
  choice: người Chúa yêu
  rationale: Giữ nguyên cách nói kín đáo của hai chị em, không tự ý nêu tên La-xa-rơ; “yêu” chuyển tải φιλέω tự nhiên mà không áp đặt sự phân biệt cứng nhắc với ἀγαπάω.
- source_word: ἀσθενεῖ
  choice: đang đau bệnh
  rationale: Diễn đạt tình trạng hiện tại và nghiêm trọng hơn cách nói khẩu ngữ “bị ốm”, đồng thời vẫn dễ hiểu.
theological_decisions:
- issue: Sắc thái của κύριε
  choice: Lạy Chúa
  alternative: Thưa Ngài
  rationale: “Lạy Chúa” bảo tồn tính đa nghĩa của κύριος trong Tin Mừng Giăng—vừa là lời xưng hô kính trọng, vừa có khả năng mang chiều kích Kitô học—mà không giải thích thêm vào câu.
- issue: Quan hệ giữa φιλέω và ἀγαπάω
  choice: Dịch φιλέω là “yêu”
  alternative: thương / quý mến
  rationale: Không dựng nên một khác biệt thần học bắt buộc giữa hai động từ yêu thương khi ngữ cảnh không đòi hỏi; tiếng Việt “yêu” tự nhiên và giữ sức nặng của lời nhắn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “hai chị em” để làm rõ số nhiều xác định của αἱ ἀδελφαί trong ngữ cảnh. Đại từ “Ngài/Chúa” giữ giọng kính trọng; không thêm tên nhân vật hay lời giải thích ngoài bản văn.
