  yaml_path: translation/nt/john/011/023.yaml
  text: Jesus says to her[a], “Your brother will rise again.”
translation:
  language: vi
  text: 'Giê-su nói với cô ấy: “Người anh em của cô sẽ sống lại.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: nói
  rationale: Giữ thì hiện tại lịch sử của lối kể chuyện trong Giăng; tiếng Việt dùng “nói” tự nhiên và sinh động ở đây.
- source_word: αὐτῇ
  choice: với cô
  rationale: Diễn đạt đại từ tặng cách như đối tượng tiếp nhận lời nói; “cô” phù hợp với Ma-thê trong ngữ cảnh.
- source_word: Ἀναστήσεται
  choice: sẽ sống lại
  rationale: Động từ tương lai trung động của ἀνίστημι trong bối cảnh La-xa-rơ đã chết chỉ việc trỗi dậy khỏi sự chết. “Sống lại” là cách nói tự nhiên trong tiếng Việt, không chuyển sang thể bị động để nhấn mạnh tác nhân mà nguyên văn không nêu rõ.
- source_word: ὁ ἀδελφός σου
  choice: anh của cô
  rationale: ἀδελφός chỉ người anh/em trai; La-xa-rơ thường được hiểu là anh hoặc em trai của Ma-thê, nhưng nguyên văn không xác định tuổi tương đối. Tiếng Việt buộc phải chọn cách xưng gọi; “anh” là cách diễn đạt tự nhiên, song có thể tạo thêm nét nghĩa không có trong tiếng Hy Lạp.
- source_word: ὁ Ἰησοῦς
  choice: Đức Giê-su
  rationale: Dùng dạng tên quen thuộc trong tiếng Việt với kính xưng trang trọng; mạo từ Hy Lạp không được dịch riêng.
theological_decisions:
- issue: Cách diễn đạt sự sống lại
  choice: sẽ sống lại
  alternative: sẽ trỗi dậy; sẽ được làm cho sống lại
  rationale: Câu này bảo đảm rằng người anh/em trai sẽ trỗi dậy khỏi sự chết nhưng chưa xác định đó là sự phục sinh ngay lập tức hay trong ngày sau cùng. “Sẽ sống lại” giữ được sức căng ấy và không thêm tác nhân thần linh bằng thể bị động.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu ngắn giữ tính trực tiếp của nguyên văn. Không thêm “một lần nữa” vì tiếng Việt “sống lại” đã thể hiện rõ ý phục sinh. Đại từ “cô” theo ngữ cảnh Ma-thê; lựa chọn “anh” là một sự cụ thể hóa do hệ thống thân tộc tiếng Việt, trong khi nguyên văn chỉ nói “người anh/em trai”.
