source:
  edition: SBLGNT
  text: ⸀ἐξῆλθεν ὁ τεθνηκὼς δεδεμένος τοὺς πόδας καὶ τὰς χεῖρας κειρίαις, καὶ ἡ ὄψις αὐτοῦ σουδαρίῳ περιεδέδετο. λέγει ⸂αὐτοῖς ὁ Ἰησοῦς⸃· Λύσατε αὐτὸν καὶ ἄφετε ⸀αὐτὸν ὑπάγειν.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/044.yaml
  text: The man who had died came out, his feet and hands bound with burial cloths, and his face wrapped with a cloth. Jesus says to them, “Unbind him and let him go.”
translation:
  language: vi
  text: 'Người đã chết bước ra, chân và tay còn bị quấn bằng những dải vải liệm, mặt cũng được quấn bằng một tấm khăn. Đức Giê-su nói với họ: “Hãy tháo các dải vải quấn người ấy và để người ấy đi.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ τεθνηκώς
  choice: Người đã chết
  rationale: Giữ sát phân từ hoàn thành, nhấn mạnh người bước ra chính là người đã chết, không thêm tên riêng vốn không có trong câu Hy Lạp.
- source_word: κειρίαις
  choice: những dải vải liệm
  rationale: Chỉ các dải vải dùng trong việc mai táng; cách dịch này rõ nghĩa và phù hợp ngữ cảnh.
- source_word: ἡ ὄψις αὐτοῦ
  choice: mặt
  rationale: Trong ngữ cảnh chiếc khăn quấn quanh, từ này tự nhiên nhất là chỉ khuôn mặt.
- source_word: σουδαρίῳ
  choice: một tấm khăn
  rationale: Chỉ một mảnh khăn hoặc khăn vải; tránh xác định quá mức hình dạng hay công dụng.
- source_word: λέγει
  choice: nói
  rationale: 'Giữ thì hiện tại lịch sử của bản Hy Lạp trong lối kể chuyện: “Đức Giê-su nói”.'
- source_word: Λύσατε αὐτόν
  choice: Hãy tháo cho anh ấy
  rationale: Diễn đạt tự nhiên hành động cởi bỏ những dải vải đang trói/quấn người ấy.
- source_word: ἄφετε αὐτὸν ὑπάγειν
  choice: để anh ấy đi
  rationale: 'Giữ độ mở của câu Hy Lạp: có thể là để người ấy tự do đi lại hoặc để người ấy rời đi, không giải thích thêm.'
theological_decisions:
- issue: Ý nghĩa của mệnh lệnh “để anh ấy đi”
  choice: Giữ nguyên cách diễn đạt ngắn gọn, không chú giải thần học trong chính văn.
  alternative: Diễn giải là “hãy để anh ấy được tự do” hoặc “hãy để anh ấy về.”
  rationale: Nguyên văn có thể gợi cả việc cho phép đi lại sau khi tháo vải lẫn việc để người ấy rời đi; bản dịch không nên tự ý thu hẹp nghĩa.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Đức Giê-su” theo lối viết tiếng Việt phổ biến; “anh ấy” phù hợp khi nói về một người nam trưởng thành, đồng thời tránh sắc thái xa cách của “người ấy” trong lời nói trực tiếp.
