revisions:
- from: 'Người đã chết bước ra, chân và tay còn bị quấn bằng những dải vải liệm, mặt cũng được quấn bằng một tấm khăn. Đức Giê-su nói với họ: “Hãy tháo cho anh ấy và để anh ấy đi.”'
  to: 'Người đã chết bước ra, chân và tay còn bị quấn bằng những dải vải liệm, mặt cũng được quấn bằng một tấm khăn. Đức Giê-su nói với họ: “Hãy tháo các dải vải quấn người ấy và để người ấy đi.”'
  rationale: Bản sửa chỉ làm rõ mệnh lệnh “λύσατε αὐτόν” theo chính ngữ cảnh các dải vải mai táng đã được nêu trong câu, đồng thời điều chỉnh đại từ cho phù hợp với văn phong tiếng Việt hiện đại, trang trọng. “Để người ấy đi” vẫn giữ độ mở của ἄφετε αὐτὸν ὑπάγειν, không quyết định trước là đi lại tự do hay rời đi.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T06:23:53Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch nhìn chung bám sát câu Hy Lạp: phân từ hoàn thành ὁ τεθνηκώς được giữ là “Người đã chết”; κειρίαις là các dải vải mai táng; và mệnh lệnh kép cuối câu được truyền đạt đầy đủ. Tuy nhiên, “Hãy tháo cho anh ấy” chưa nêu rõ đối tượng cần tháo và trong tiếng Việt có thể được hiểu là tháo một vật nào đó cho người ấy, thay vì cởi các lớp vải đang quấn/trói người ấy.'
  naturalness: Câu văn hiện đại, rõ và giữ được thì hiện tại lịch sử trong “Đức Giê-su nói”. Thay “anh ấy” bằng “người ấy” phù hợp hơn với văn phong Kinh Thánh trang trọng vừa phải, đồng thời tránh sắc thái hội thoại hiện đại không cần thiết trong lời truyền lệnh.
  terminology: “Đức Giê-su”, “vải liệm”, và “khăn” phù hợp. “Dải vải liệm” phản ánh κειρίαις tốt. Sửa mệnh lệnh đầu để diễn đạt rõ hành động λύσατε (“tháo/cởi trói”) trong ngữ cảnh các dải vải quấn xác.
  issues:
  - severity: medium
    issue: Cụm “Hãy tháo cho anh ấy” thiếu đối tượng trực tiếp.
    rationale: λύσατε αὐτόν có nghĩa là tháo/cởi trói người ấy. Trong ngữ cảnh trước đó, cần nói rõ là tháo các dải vải quấn người ấy để bản dịch không mơ hồ hoặc gượng trong tiếng Việt.
  - severity: low
    issue: “anh ấy” có sắc thái hội thoại hơn mức cần thiết.
    rationale: “Người ấy” tự nhiên trong văn xuôi Kinh Thánh hiện đại và nhất quán với lối gọi trang trọng của toàn câu, không làm thay đổi nghĩa.
  revised_text: 'Người đã chết bước ra, chân và tay còn bị quấn bằng những dải vải liệm, mặt cũng được quấn bằng một tấm khăn. Đức Giê-su nói với họ: “Hãy tháo các dải vải quấn người ấy và để người ấy đi.”'
