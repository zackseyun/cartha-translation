id: JHN.11.48
reference: John 11:48
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐὰν ἀφῶμεν αὐτὸν οὕτως, πάντες πιστεύσουσιν εἰς αὐτόν, καὶ ἐλεύσονται οἱ Ῥωμαῖοι καὶ ἀροῦσιν ἡμῶν καὶ τὸν τόπον καὶ τὸ ἔθνος.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/048.yaml
  text: If we let him go on like this[a], everyone will believe in him[b], and the Romans will come and take away both our place and our nation.
translation:
  language: vi
  text: Nếu chúng ta cứ để ông ấy tiếp tục như thế, mọi người sẽ tin vào ông ấy; thì người La Mã sẽ đến và lấy đi cả nơi chốn[a] lẫn dân tộc[b] của chúng ta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hoặc “đền thờ của chúng ta.” Từ Hy Lạp có nghĩa là “nơi” hoặc “chỗ,” có thể chỉ riêng đền thờ, hoặc rộng hơn là nơi chốn hay địa vị của chúng ta.
    reason: alternative_reading
  - marker: b
    text: Hoặc “dân ta.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφῶμεν αὐτὸν οὕτως
  choice: cứ để ông ấy tiếp tục như thế
  rationale: ἀφῶμεν mang nghĩa cho phép hoặc để mặc; kết hợp với οὕτως, cách diễn đạt này truyền đạt tự nhiên ý để tình trạng và hoạt động hiện tại tiếp diễn mà không xác định thêm đó là hoạt động nào.
- source_word: πάντες
  choice: mọi người
  rationale: Diễn đạt tự nhiên phạm vi bao quát của đại từ số nhiều trong ngữ cảnh.
- source_word: πιστεύσουσιν εἰς αὐτόν
  choice: sẽ tin vào ông ấy
  rationale: Giữ cách dùng đặc trưng trong sách Giăng của πιστεύω εἰς với nghĩa tin vào hoặc đặt lòng tin nơi một người.
- source_word: ἐλεύσονται οἱ Ῥωμαῖοι
  choice: người La Mã sẽ đến
  rationale: Bản dịch trực tiếp, tự nhiên của động từ tương lai ἐλεύσονται cùng chủ ngữ οἱ Ῥωμαῖοι.
- source_word: ἀροῦσιν
  choice: lấy đi
  rationale: Giữ nghĩa cốt lõi của αἴρω là lấy đi hoặc loại bỏ; không dùng 'tiêu diệt' vì từ đó mạnh hơn và giải thích hậu quả thay cho nguyên văn.
- source_word: τόπον
  choice: nơi chốn
  rationale: τόπος có nghĩa cơ bản là nơi hoặc chỗ. 'Nơi chốn' giữ được độ mở của từ Hy Lạp, dù trong ngữ cảnh từ này có thể chỉ đền thờ, lãnh địa hoặc địa vị của giới lãnh đạo.
- source_word: ἔθνος
  choice: dân tộc
  rationale: ἔθνος có thể chỉ một dân tộc hoặc một cộng đồng dân chúng. 'Dân tộc' phù hợp với nỗi lo mang tính chính trị, còn khả năng dịch là 'dân ta' được ghi ở chú thích.
- source_word: ἡμῶν ... καὶ τὸν τόπον καὶ τὸ ἔθνος
  choice: cả nơi chốn lẫn dân tộc của chúng ta
  rationale: Cấu trúc 'cả... lẫn...' phản ánh hai καί tương liên, đồng thời cho thấy ἡμῶν liên hệ với cả hai danh từ.
theological_decisions:
- issue: Đối tượng được nói đến bởi τόπον ('nơi chốn của chúng ta')
  choice: Giữ nghĩa rộng là 'nơi chốn' trong chính văn
  alternative: đền thờ; địa vị hoặc quyền lợi của giới lãnh đạo
  rationale: Ngữ cảnh có thể hướng đến đền thờ và cũng có thể bao hàm lãnh địa hoặc địa vị thể chế của các nhà lãnh đạo, nhưng bản thân từ Hy Lạp không giải quyết dứt khoát. Vì vậy chính văn giữ sự mơ hồ, còn chú thích nêu các khả năng cụ thể.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “ông ấy” để chỉ Đức Chúa Giê-su trong lời bàn bạc của các lãnh đạo, tránh sắc thái miệt thị của “ông ta” cũng như tránh thêm một tước xưng không có trong câu Hy Lạp. Dấu chấm phẩy giúp thể hiện rõ quan hệ giữa hành động được giả định và hậu quả họ lo sợ.
