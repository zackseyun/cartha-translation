  source_fidelity: 'Bản dịch chuyển đạt đầy đủ các thành tố của câu Hy Lạp: mốc thời gian Lễ Vượt Qua đã gần, cụm “của người Do Thái,” nhiều người đi lên Giê-ru-sa-lem từ vùng nông thôn, thời điểm trước lễ, và mục đích tự thanh tẩy. “Đi lên” bảo toàn sắc thái hành hương/địa thế của ἀνέβησαν; “để thanh tẩy mình” giữ đúng mục đích của ἵνα ἁγνίσωσιν ἑαυτούς mà không thêm nghĩa đạo đức hay giáo lý.'
  naturalness: Câu văn tự nhiên, rõ ràng và phù hợp văn phong Kinh Thánh tiếng Việt hiện đại. “Miền quê,” “đi lên Giê-ru-sa-lem,” và “thanh tẩy mình” đều dễ hiểu trong ngữ cảnh. Việc lược lặp “Lễ Vượt Qua” thành “trước lễ” không làm mơ hồ vì quy chiếu gần và rõ ràng.
