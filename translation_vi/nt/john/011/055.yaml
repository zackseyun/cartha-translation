source:
  edition: SBLGNT
  text: Ἦν δὲ ἐγγὺς τὸ πάσχα τῶν Ἰουδαίων, καὶ ἀνέβησαν πολλοὶ εἰς Ἱεροσόλυμα ἐκ τῆς χώρας πρὸ τοῦ πάσχα ἵνα ἁγνίσωσιν ἑαυτούς.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/055.yaml
  text: The Passover of the Jews was near[b][a], and many went up to Jerusalem from the countryside before the Passover to purify themselves.
translation:
  language: vi
  text: Lễ Vượt Qua của người Do Thái đã gần đến[a], và nhiều người từ miền quê đi lên Giê-ru-sa-lem trước lễ để thanh tẩy mình[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Lễ Vượt Qua của dân Do Thái.” Nguyên văn Hy Lạp sát nghĩa là “Lễ Vượt Qua của người Do Thái”, một cách diễn đạt xuất hiện nhiều lần trong sách Giăng.'
    reason: lexical_alternative
  - marker: b
    text: Tức là thực hiện việc thanh tẩy theo nghi lễ để chuẩn bị dự Lễ Vượt Qua.
    reason: cultural_note
lexical_decisions:
- source_word: Ἦν δὲ ἐγγὺς
  choice: đã gần đến
  rationale: Diễn đạt tự nhiên ý nghĩa thời gian của ἐγγύς; không thêm từ “bấy giờ” vì δέ chỉ là liên từ chuyển ý nhẹ và có thể được thể hiện qua mạch văn.
- source_word: τὸ πάσχα τῶν Ἰουδαίων
  choice: Lễ Vượt Qua của người Do Thái
  rationale: Giữ cấu trúc sở hữu của tiếng Hy Lạp và cách diễn đạt lặp lại trong sách Giăng, đồng thời dùng tên lễ quen thuộc trong tiếng Việt.
- source_word: ἀνέβησαν
  choice: đi lên
  rationale: Giữ sắc thái địa lý và tập quán hành hương lên Giê-ru-sa-lem.
- source_word: ἐκ τῆς χώρας
  choice: từ miền quê
  rationale: χώρα ở đây chỉ vùng bên ngoài thành phố; “miền quê” tự nhiên và làm rõ sự tương phản với Giê-ru-sa-lem.
- source_word: πρὸ τοῦ πάσχα
  choice: trước lễ
  rationale: Diễn đạt rõ quan hệ thời gian; “lễ” quy chiếu tự nhiên về Lễ Vượt Qua vừa nêu, tránh lặp nặng trong tiếng Việt.
- source_word: ἵνα ἁγνίσωσιν ἑαυτούς
  choice: để thanh tẩy mình
  rationale: Giữ ý mục đích của ἵνα và sắc thái thanh sạch theo nghi lễ của ἁγνίζω mà không giải thích quá mức trong chính văn.
theological_decisions:
- issue: Bản chất của việc thanh tẩy trước Lễ Vượt Qua
  choice: “để thanh tẩy mình”, được chú thích là sự thanh tẩy theo nghi lễ để chuẩn bị dự lễ
  alternative: “để tẩy sạch mình về mặt nghi lễ” hoặc “để biệt mình ra thánh”
  rationale: Bối cảnh nói đến sự chuẩn bị theo nghi lễ Do Thái trước cuộc hành hương dự Lễ Vượt Qua, không nhất thiết nói đến sự thanh tẩy đạo đức nội tâm hay một nghi thức Kitô giáo về sau.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Giê-ru-sa-lem” theo lối phiên âm Kinh Thánh quen thuộc; giữ cách nói “đi lên” và “thanh tẩy” để bảo toàn sắc thái hành hương và nghi lễ.
