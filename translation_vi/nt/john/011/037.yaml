  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τινὲς δὲ ἐξ αὐτῶν εἶπαν· Οὐκ ἐδύνατο οὗτος ὁ ἀνοίξας τοὺς ὀφθαλμοὺς τοῦ τυφλοῦ ποιῆσαι ἵνα καὶ οὗτος μὴ ἀποθάνῃ;
base_translation:
  language: en
  yaml_path: translation/nt/john/011/037.yaml
  text: But some of them said[a], “Could not this man, who opened the eyes of the blind man, also have made it so that this man would not die?”
translation:
  language: vi
  text: 'Nhưng một số người trong số họ nói: “Người đã mở mắt cho người mù kia chẳng lẽ cũng không thể làm cho người này khỏi chết sao?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τινὲς δὲ ἐξ αὐτῶν
  choice: Nhưng một số người trong họ
  rationale: Diễn đạt tự nhiên ý ‘một số người thuộc nhóm ấy’; ‘Nhưng’ thể hiện sắc thái tương phản của δέ với phản ứng trước đó.
- source_word: εἶπαν
  choice: nói
  rationale: Thì aorist trong lời kể được chuyển bằng động từ quá khứ theo ngữ cảnh; tiếng Việt không cần đánh dấu hình thái quá khứ.
- source_word: Οὐκ ἐδύνατο
  choice: chẳng lẽ không thể
  rationale: Giữ hình thức câu hỏi tu từ với sự ngờ vực và hàm ý rằng người ấy đáng lẽ có khả năng hành động.
- source_word: οὗτος ὁ ἀνοίξας τοὺς ὀφθαλμοὺς τοῦ τυφλοῦ
  choice: Người đã mở mắt cho người mù kia
  rationale: Mệnh đề quan hệ nhận diện Đức Giê-su qua dấu lạ trước đó; ‘kia’ gắn tự nhiên với người mù đã được biết đến trong câu chuyện.
- source_word: ποιῆσαι ἵνα
  choice: làm cho
  rationale: Diễn đạt quan hệ gây khiến của ποιῆσαι ἵνα bằng cấu trúc tiếng Việt ngắn gọn, tự nhiên.
- source_word: καὶ οὗτος μὴ ἀποθάνῃ
  choice: người này khỏi chết
  rationale: ‘Người này’ giữ đại từ chỉ định οὗτος chỉ La-xa-rơ; ‘khỏi chết’ truyền đạt tự nhiên ý ngăn không cho cái chết xảy ra. Ý bổ sung của καί được hàm chứa trong ngữ cảnh và cấu trúc ‘chẳng lẽ… sao’, tránh dùng ‘cũng’ gây vướng vì đối tượng trước đó không được cứu khỏi chết.
theological_decisions:
- issue: Sắc thái câu hỏi của những người đứng đó
  choice: 'Dịch thành câu hỏi tu từ mang sắc thái hoài nghi: ‘chẳng lẽ không thể… sao?’'
  alternative: 'Dịch trung tính hơn: ‘Người ấy không thể… sao?’'
  rationale: Οὐκ trong câu hỏi thường chờ một câu trả lời khẳng định, đồng thời ở đây hàm ý phê phán rằng Đức Giê-su có thể đã ngăn La-xa-rơ chết. Bản dịch giữ sự căng thẳng ấy mà không thêm lời buộc tội.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng ‘mở mắt cho người mù’ để giữ hình ảnh nguyên văn; dùng ‘khỏi chết’ thay cho cách diễn đạt dài và kém tự nhiên ‘làm sao để người này không chết’. Không cần chú thích vì phương án dịch thay thế trong bản tiếng Anh đã được thể hiện trực tiếp bằng lối nói tiếng Việt tự nhiên.
