    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδάκρυσεν
  choice: khóc
  rationale: Động từ aorist chủ động, ngôi thứ ba số ít của δακρύω, chỉ việc rơi nước mắt. “Khóc” là cách diễn đạt tự nhiên, ngắn gọn trong tiếng Việt và không áp đặt sắc thái khởi đầu mà hình thái động từ không nhất thiết đòi hỏi.
- source_word: ὁ Ἰησοῦς
  choice: Đức Chúa Jêsus
  rationale: Danh riêng có mạo từ và làm chủ ngữ. “Đức Chúa Jêsus” là cách gọi trang trọng, quen thuộc trong văn phong Kinh Thánh tiếng Việt.
theological_decisions:
- issue: Sự biểu lộ cảm xúc của Đức Chúa Jêsus
  choice: Đức Chúa Jêsus khóc
  alternative: Đức Chúa Jêsus rơi lệ
  rationale: Bản dịch trực tiếp giữ nguyên lời thuật ngắn gọn về cảm xúc thật của Đức Chúa Jêsus, không làm nhẹ đi cũng không khuếch đại thành tiếng than khóc lớn; đồng thời không thêm lời giải thích thần học vào chính văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và cô đọng. Giữ cấu trúc cực ngắn của nguyên văn; chú thích bảo tồn nét nghĩa cụ thể của động từ Hy Lạp.
