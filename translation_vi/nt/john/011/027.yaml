  source_fidelity: 'Bản dịch truyền đạt đúng cấu trúc lời tuyên xưng: lời đáp khẳng định, tước hiệu Đấng Mê-si, Con Đức Chúa Trời, và mệnh đề phân từ xác định Đấng ấy. Tuy nhiên, “Đấng phải đến” thêm sắc thái tất yếu/bắt buộc mà phân từ hiện tại ἐρχόμενος không trực tiếp biểu thị. Cần dùng cách diễn đạt trung tính hơn để giữ cả sắc thái hiện tại và chức năng tước hiệu của nguyên ngữ.'
