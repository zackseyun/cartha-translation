id: JHN.11.27
reference: John 11:27
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: λέγει αὐτῷ· Ναί, κύριε· ἐγὼ πεπίστευκα ὅτι σὺ εἶ ὁ χριστὸς ὁ υἱὸς τοῦ θεοῦ ὁ εἰς τὸν κόσμον ἐρχόμενος.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/027.yaml
  text: She said to him[a], “Yes, Lord; I have believed that you are the Messiah, the Son of God[b], the one coming into the world.”
translation:
  language: vi
  text: 'Bà thưa với Ngài: “Vâng, thưa Chúa, con đã tin rằng Ngài là Đấng Mê-si-a[a], Con Đức Chúa Trời, Đấng đến thế gian[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “Đấng Christ.” Từ Hy Lạp Χριστός (Christos) là một tước hiệu, có nghĩa là “Đấng được xức dầu.”
    reason: alternative_reading
  - marker: b
    text: Hay “Đấng đang đến thế gian” hoặc “Đấng là Đấng đến thế gian.” Cụm phân từ Hy Lạp có thể được dịch sát theo dạng phân từ; trong ngữ cảnh, cụm này cũng nhận diện Đức Giê-su là Đấng được mong đợi.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει αὐτῷ
  choice: Bà thưa với Ngài
  rationale: Động từ hiện tại lịch sử được chuyển theo lối kể tự nhiên của tiếng Việt; chủ ngữ nữ được bổ sung từ ngữ cảnh. “Thưa” phù hợp với lời đáp kính trọng, còn “Ngài” duy trì sắc thái tôn kính.
- source_word: Ναί, κύριε
  choice: Vâng, thưa Chúa
  rationale: “Vâng” là lời khẳng định tự nhiên trong lời đáp kính trọng. κύριε được dịch là “Chúa” vì ngữ cảnh là lời tuyên xưng trang trọng, không chỉ là cách xưng hô lịch sự.
- source_word: ἐγὼ πεπίστευκα
  choice: con đã tin
  rationale: “Con” phù hợp với tương quan xưng hô kính trọng trong tiếng Việt. “Đã tin” diễn đạt niềm tin đã hình thành và vẫn có hiệu lực, dù tiếng Việt không đánh dấu đầy đủ thể hoàn thành như tiếng Hy Lạp.
- source_word: ὁ χριστός
  choice: Đấng Mê-si
  rationale: Dịch tước hiệu Χριστός bằng “Đấng Mê-si” để làm rõ ý nghĩa về Đấng được xức dầu và duy trì bối cảnh kỳ vọng Do Thái.
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: Con Đức Chúa Trời
  rationale: Cách dịch trang trọng, rõ nghĩa và quen thuộc cho tước hiệu xác định này.
- source_word: ὁ εἰς τὸν κόσμον ἐρχόμενος
  choice: Đấng phải đến thế gian
  rationale: Cụm phân từ có mạo từ nhận diện Đức Giê-su là Đấng được mong đợi sẽ đến thế gian. “Phải đến” diễn đạt sắc thái Đấng được trông đợi, nhưng ghi chú bảo lưu cách dịch sát cấu trúc hơn.
theological_decisions:
- issue: Cách dịch Χριστός trong lời tuyên xưng
  choice: Đấng Mê-si
  alternative: Đấng Christ
  rationale: Đây là tước hiệu trong lời tuyên xưng căn tính của Đức Giê-su; “Đấng Mê-si” chuyển tải ý nghĩa của tước hiệu thay vì chỉ phiên âm truyền thống.
- issue: Sắc thái của κύριε
  choice: Chúa
  alternative: thưa ngài
  rationale: Lời xưng nhận ngay sau đó về Đấng Mê-si và Con Đức Chúa Trời ủng hộ sắc thái tôn kính và thần học của “Chúa”, dù từ này tự thân cũng có thể là cách xưng hô lịch sự.
- issue: Thể hoàn thành của πεπίστευκα
  choice: đã tin
  alternative: tin; đã đi đến chỗ tin
  rationale: “Đã tin” giữ được ý niềm tin đã được xác lập; ngữ cảnh và câu tiếng Việt cho thấy niềm xác tín ấy vẫn tiếp tục ở hiện tại mà không cần diễn giải dài.
- issue: Ý nghĩa của ὁ ἐρχόμενος
  choice: Đấng phải đến
  alternative: Đấng đang đến; Đấng đến
  rationale: Cách chọn nêu sắc thái kỳ vọng gắn với nhân vật phải đến, nhưng vì phân từ hiện tại có thể được thể hiện trực tiếp hơn nên phương án khác được bảo lưu trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng cặp xưng hô “con—Ngài” để lời của Ma-thê tự nhiên trong tiếng Việt và vẫn tôn kính. Các tước hiệu được viết hoa theo thông lệ tiếng Việt Cơ Đốc; không thêm tên Ma-thê vì bản Hy Lạp chỉ hàm ý chủ ngữ từ ngữ cảnh.
