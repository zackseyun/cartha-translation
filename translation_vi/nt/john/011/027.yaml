  terminology: Giữ “Chúa”, “Con Đức Chúa Trời”, và cách viết hoa các tước hiệu theo hệ thống thuật ngữ của bản thảo. “Đấng Mê-si-a” phản ánh Χριστός như một tước hiệu; chú thích vẫn nêu “Đấng Christ” là phương án thay thế. “Đấng đến thế gian” không áp đặt diễn giải “phải đến”.
