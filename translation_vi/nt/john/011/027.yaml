  to: 'Bà thưa với Ngài: “Vâng, thưa Chúa, con đã tin rằng Ngài là Đấng Mê-si-a[a], Con Đức Chúa Trời, Đấng đến thế gian[b].”'
  rationale: Bản sửa loại bỏ “phải”, vốn diễn giải quá mức lực của phân từ hiện tại, và thay bằng “Đấng đến thế gian” để bảo toàn tính nhận diện của cụm có mạo từ mà không quyết định một cách không cần thiết giữa nghĩa đang diễn tiến và danh hiệu quen thuộc. Đồng thời, “Mê-si-a” được chuẩn hóa theo cách dùng tiếng Việt hiện đại. Các yếu tố còn lại giữ nguyên vì vừa trung thành với nguyên ngữ vừa phù hợp văn phong trang trọng.
