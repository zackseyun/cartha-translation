  text: Πολλοὶ οὖν ἐκ τῶν Ἰουδαίων, οἱ ἐλθόντες πρὸς τὴν ⸀Μαριὰμ καὶ θεασάμενοι ⸀ἃ ⸀ἐποίησεν, ἐπίστευσαν εἰς αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/john/011/045.yaml
  text: Therefore many of the Jews who had come to Mary and had seen what he had done believed in him[a].
translation:
  language: vi
  text: Vì vậy, nhiều người trong số người Do Thái[a] đã đến với Ma-ri và đã thấy những việc Đức Chúa Jêsus đã làm thì tin Ngài.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “từ trong những người Do Thái”; trong một số văn cảnh của sách Giăng, Ἰουδαῖοι cũng có thể được dịch là “người Giu-đê”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πολλοὶ οὖν
  choice: Vì vậy, nhiều người
  rationale: “Vì vậy” giữ quan hệ kết quả với biến cố Đức Chúa Jêsus khiến La-xa-rơ sống lại; “nhiều người” diễn đạt tự nhiên số lượng đáng kể nhưng không xác định.
- source_word: ἐκ τῶν Ἰουδαίων
  choice: trong số những người Do Thái
  rationale: Giữ rõ sắc thái phân xuất của ἐκ và dùng cách gọi thông dụng, tự nhiên trong tiếng Việt.
- source_word: οἱ ἐλθόντες πρὸς τὴν Μαριὰμ
  choice: đã đến với Ma-ri
  rationale: Phân từ có mạo từ xác định nhóm người đang được nói đến; “đã đến” thể hiện hành động xảy ra trước động từ chính.
- source_word: θεασάμενοι ἃ ἐποίησεν
  choice: thấy việc Đức Chúa Jêsus làm
  rationale: Diễn đạt gọn và tự nhiên; “thấy” phù hợp ngữ cảnh chứng kiến hành động, còn việc nêu rõ Đức Chúa Jêsus tránh đại từ mơ hồ trong tiếng Việt.
- source_word: ἐπίστευσαν εἰς αὐτόν
  choice: tin Ngài
  rationale: Trong tiếng Việt Kinh Thánh, “tin Ngài” truyền đạt tự nhiên niềm tin hướng về một thân vị mà không thêm sắc thái thần học ngoài nguyên văn.
theological_decisions:
- issue: Cách dịch πιστεύω εἰς trong văn mạch đức tin nơi Đức Chúa Jêsus
  choice: tin Ngài
  alternative: đặt lòng tin nơi Ngài
  rationale: “Tin Ngài” vừa tự nhiên vừa giữ được hướng quy chiếu cá nhân của εἰς αὐτόν; phương án dài hơn có thể nhấn mạnh mức độ phó thác vượt quá điều câu này nói trực tiếp.
- issue: Phạm vi nghĩa của Ἰουδαῖοι trong sách Giăng
  choice: những người Do Thái
  alternative: những người Giu-đê
  rationale: Trong câu này, cách gọi dân tộc/tôn giáo thông dụng phù hợp nhất; tuy vậy, chú thích giữ lại khả năng hiểu theo địa vực vốn được tranh luận trong một số văn cảnh của sách Giăng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ma-ri” và “Đức Chúa Jêsus” theo lối gọi quen thuộc trong tiếng Việt Cơ Đốc; tránh cấu trúc phân từ nặng tính Hy Lạp. Dấu chú thích [a] được đặt ngay sau mệnh đề liên quan.
