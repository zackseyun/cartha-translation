  rationale: Loại bỏ bổ nghĩa “tối” để dịch sát νύξ là “đêm,” đồng thời duy trì tính tự nhiên của câu và không giải quyết trước chiều kích hình ảnh hay thần học của “ánh sáng không ở trong người ấy.” Chỉnh rất nhẹ cách diễn đạt chú thích để nêu đúng tính chất của phương án dịch.
