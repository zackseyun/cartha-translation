  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐὰν δέ τις περιπατῇ ἐν τῇ νυκτί, προσκόπτει, ὅτι τὸ φῶς οὐκ ἔστιν ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/010.yaml
  text: But if anyone walks in the night[a], he stumbles, because the light is not in him.
translation:
  language: vi
  text: Nhưng nếu ai đi trong đêm, người ấy vấp ngã, vì ánh sáng không ở trong người ấy.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “ánh sáng không ở cùng người ấy.” Nguyên văn Hy Lạp sát nghĩa hơn là “ở trong người ấy”, có thể gợi ý nhiều hơn việc chỉ thiếu ánh sáng bên ngoài.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐὰν δέ
  choice: Nhưng nếu
  rationale: Giữ cả sắc thái tương phản của δέ với câu trước và điều kiện do ἐὰν diễn tả.
- source_word: τις
  choice: ai
  rationale: Đại từ bất định mang nghĩa khái quát; cách nói tự nhiên trong tiếng Việt hiện đại.
- source_word: περιπατῇ
  choice: đi
  rationale: Giữ hình ảnh đi lại theo nghĩa trực tiếp, đồng thời không loại bỏ khả năng hàm ý đời sống thuộc linh.
- source_word: ἐν τῇ νυκτί
  choice: trong đêm tối
  rationale: Diễn đạt tự nhiên hình ảnh ban đêm và làm rõ hoàn cảnh thiếu ánh sáng, nhưng không thay νύξ bằng một thuật ngữ trừu tượng thuần túy.
- source_word: προσκόπτει
  choice: vấp ngã
  rationale: Diễn đạt rõ hành động vấp và vẫn giữ được khả năng dùng theo nghĩa ẩn dụ.
- source_word: ὅτι
  choice: vì
  rationale: Thể hiện trực tiếp quan hệ nguyên nhân.
- source_word: τὸ φῶς
  choice: ánh sáng
  rationale: Danh từ xác định trong mạch văn; tiếng Việt không cần mạo từ nhưng vẫn giữ hình ảnh ánh sáng cụ thể và thần học.
- source_word: οὐκ ἔστιν ἐν αὐτῷ
  choice: không ở trong người ấy
  rationale: Bám sát ἐν là “trong”, bảo toàn sự căng thẳng giữa hình ảnh thiếu ánh sáng bên ngoài và khả năng chỉ sự soi sáng nội tâm.
theological_decisions:
- issue: Ý nghĩa và sở chỉ của câu “ánh sáng không ở trong người ấy”
  choice: Giữ cách nói “ở trong người ấy”
  alternative: “không ở cùng người ấy”, chỉ hoàn cảnh không có ánh sáng bên ngoài
  rationale: Giới từ ἐν thông thường có nghĩa “trong”. Cách dịch này giữ nguyên chiều sâu tiềm tàng của ngôn ngữ ánh sáng trong sách Giăng mà không buộc câu chỉ mang nghĩa vật lý hoặc chỉ mang nghĩa thuộc linh.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Lặp “người ấy” để làm rõ chủ thể; giữ hình ảnh đi trong đêm, vấp ngã và ánh sáng. Dấu chú thích [a] đặt sau mệnh đề liên quan.
