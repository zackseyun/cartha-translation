- from: Vậy, khi Ma-thê nghe tin Đức Chúa Jêsus đang đến[a], bà đi đón Ngài; còn Ma-ri thì vẫn ngồi trong nhà.
  to: Vậy, khi Ma-thê nghe tin Giê-su đang đến[a], bà đi đón Ngài; còn Ma-ri đang ngồi trong nhà.
  rationale: Bản sửa loại bỏ tước hiệu không có trong nguyên văn, dùng cách viết tên theo tiếng Việt hiện đại, và thay «vẫn ngồi» bằng «đang ngồi» để phản ánh thì chưa hoàn thành mà không thêm hàm ý. Chú thích được chỉnh để nêu phương án dịch có cơ sở trực tiếp từ thì hiện tại Hy Lạp.
