  text: ἡ οὖν Μάρθα ὡς ἤκουσεν ὅτι Ἰησοῦς ἔρχεται ὑπήντησεν αὐτῷ· ⸀Μαρία δὲ ἐν τῷ οἴκῳ ἐκαθέζετο.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/020.yaml
  text: So when Martha heard that Jesus was coming[a], she went to meet him; but Mary was sitting in the house.
translation:
  language: vi
  text: Vậy, khi Ma-thê nghe tin Giê-su đang đến[a], bà đi đón Ngài; còn Ma-ri đang ngồi trong nhà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “Giê-su đến.” Động từ Hy Lạp ở thì hiện tại trong mệnh đề được thuật lại; cách dịch này có thể giữ sắc thái hiện tại sinh động.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Vậy
  rationale: Giữ chức năng nối tiếp và suy dẫn trong mạch kể, đồng thời tự nhiên trong tiếng Việt hiện đại.
- source_word: ὡς
  choice: khi
  rationale: Diễn đạt rõ quan hệ thời gian mà không nhấn mạnh quá mức tính tức thì như “ngay khi”.
- source_word: ἤκουσεν
  choice: nghe tin
  rationale: Trong ngữ cảnh, ἀκούω nói đến việc nhận được tin Đức Chúa Jêsus đang đến; “nghe tin” tự nhiên hơn “nghe” đơn độc mà vẫn sát nghĩa.
- source_word: ἔρχεται
  choice: đang đến
  rationale: Giữ sắc thái hiện tại tiếp diễn của động từ Hy Lạp trong lời tường thuật gián tiếp và diễn tả Đức Chúa Jêsus đang trên đường đến.
- source_word: ὑπήντησεν αὐτῷ
  choice: đi đón Ngài
  rationale: Thể hiện sắc thái chuyển động để gặp một người đang đến; “đón” tự nhiên và gọn trong tiếng Việt.
- source_word: δὲ
  choice: còn
  rationale: Nêu sự tương phản nhẹ giữa hành động của Ma-thê và tình trạng của Ma-ri, phù hợp hơn sắc thái đối chiếu tự nhiên trong tiếng Việt.
- source_word: ἐν τῷ οἴκῳ
  choice: trong nhà
  rationale: Bản dịch trực tiếp, rõ ràng của cụm giới từ.
- source_word: ἐκαθέζετο
  choice: vẫn ngồi
  rationale: Diễn đạt trạng thái kéo dài trong quá khứ của thì chưa hoàn thành; “vẫn” làm rõ sự đối chiếu theo ngữ cảnh mà không hàm ý thái độ hay động cơ.
- source_word: Μάρθα / Μαρία / Ἰησοῦς
  choice: Ma-thê / Ma-ri / Đức Chúa Jêsus
  rationale: Dùng dạng tên quen thuộc trong truyền thống Kinh Thánh Tin Lành tiếng Việt; tước xưng dành cho Đức Chúa Jêsus tạo giọng văn tôn kính và nhất quán.
theological_decisions: []
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Câu giữ sự đối chiếu giữa Ma-thê đi đón và Ma-ri ngồi trong nhà, đồng thời bảo lưu sắc thái hiện tại của ἔρχεται qua “đang đến”.
