source:
  edition: SBLGNT
  text: οὔπω δὲ ἐληλύθει ὁ Ἰησοῦς εἰς τὴν κώμην, ἀλλ’ ἦν ⸀ἔτι ἐν τῷ τόπῳ ὅπου ὑπήντησεν αὐτῷ ἡ Μάρθα.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/030.yaml
  text: Jesus had not yet come into the village[a], but was still in the place where Martha had met him.
translation:
  language: vi
  text: Đức Giê-su vẫn chưa vào làng, nhưng vẫn còn ở nơi Ma-tha đã ra gặp Ngài.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “nơi Ma-tha đã gặp Ngài.”'
    reason: Động từ ὑπαντάω có thể chỉ đơn giản là “gặp” hoặc cụ thể hơn là “đi ra gặp”; bản chính phản ánh sắc thái phù hợp với ngữ cảnh câu 20.
lexical_decisions:
- source_word: οὔπω
  choice: vẫn chưa
  rationale: Diễn đạt tự nhiên việc sự kiện chưa xảy ra cho đến thời điểm ấy; kết hợp với δέ tạo nhịp kể nhẹ mà không thêm một trạng từ chỉ thời gian không có trong nguyên văn.
- source_word: δὲ
  choice: không dịch riêng
  rationale: Tiểu từ này đánh dấu chuyển tiếp nhẹ trong lời kể; trật tự và nhịp câu tiếng Việt đã thể hiện chức năng ấy, nên không cần thêm “bấy giờ” hay “nhưng” ở đầu câu.
- source_word: ἐληλύθει
  choice: vào
  rationale: Trong ngữ cảnh với εἰς τὴν κώμην, “vào làng” diễn đạt tự nhiên việc Đức Giê-su chưa đi vào khu dân cư; sắc thái hoàn thành trước một mốc kể được thể hiện đủ qua “vẫn chưa”.
- source_word: κώμην
  choice: làng
  rationale: κώμη chỉ một khu dân cư nhỏ; “làng” là từ thông dụng và sát nghĩa.
- source_word: ἀλλ’
  choice: nhưng
  rationale: Thể hiện rõ sự tương phản giữa việc chưa vào làng và việc vẫn ở địa điểm trước đó.
- source_word: ἔτι
  choice: còn
  rationale: Diễn tả sự tiếp tục ở nguyên địa điểm, tự nhiên trong cấu trúc tiếng Việt “nhưng còn ở…”.
- source_word: τόπῳ
  choice: nơi
  rationale: Từ chỉ địa điểm chung; “nơi” tự nhiên hơn “địa điểm” trong câu kể.
- source_word: ὅπου
  choice: nơi
  rationale: Được gộp tự nhiên trong cấu trúc “tại nơi…”, tránh lặp “nơi mà” nhưng vẫn giữ quan hệ địa điểm.
- source_word: ὑπήντησεν
  choice: đã ra gặp
  rationale: Động từ có thể chỉ việc gặp hoặc đi ra đón/gặp. Ngữ cảnh câu 20 cho thấy Ma-tha đi ra gặp Đức Giê-su; “ra gặp” làm rõ sắc thái hướng đến mà không dùng từ trang trọng quá mức như “đón”.
- source_word: αὐτῷ
  choice: Ngài
  rationale: Đại từ chỉ Đức Giê-su; viết hoa theo quy ước tôn kính phổ biến trong bản dịch, nhưng không thêm nội dung thần học.
- source_word: Μάρθα
  choice: Ma-tha
  rationale: Phiên âm tên riêng theo cách quen thuộc, dễ đọc trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Đức Giê-su”, “cô Ma-tha” và “Ngài” để câu kể tự nhiên, có sự kính trọng. Dấu chú thích [a] được đặt ngay sau mệnh đề liên quan.
