- from: Đức Giê-su vẫn chưa vào làng, nhưng còn ở tại nơi cô Ma-tha đã ra gặp Ngài.[a]
  to: Đức Giê-su vẫn chưa vào làng, nhưng vẫn còn ở nơi Ma-tha đã ra gặp Ngài.[a]
  rationale: Bỏ tước xưng không có trong nguyên văn và chỉnh “ở tại nơi” thành “ở nơi” để câu tự nhiên hơn. Giữ “đã ra gặp” ở bản chính theo ngữ cảnh, đồng thời giữ nghĩa ít cụ thể hơn trong chú thích để bảo toàn độ mở của động từ Hy Lạp.
