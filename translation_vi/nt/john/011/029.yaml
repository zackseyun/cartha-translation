    rationale: “Jêsus” là lối phiên âm cũ, không phù hợp mục tiêu tiếng Việt chuẩn hiện đại. “Đi đến chỗ Chúa Giê-su” là cách diễn đạt tự nhiên hơn “đi đến với Đức Chúa Jêsus.”
