  verdict: revise
  source_fidelity: 'Bản nháp truyền đạt đúng trình tự chính: Ma-ri nghe lời nhắn, mau chóng đứng dậy, rồi đi về phía Đức Giê-su. Tuy nhiên, “nhanh chóng” ở vị trí hiện tại dễ được hiểu là chỉ bổ nghĩa cho việc đi, trong khi ταχὺ gắn trực tiếp với hành động đứng dậy. “Vừa… liền…” cũng hơi tăng sắc thái tức thì của ὡς, dù không nghiêm trọng.'
  naturalness: “Cô” không thật phù hợp với văn kể chuyện Kinh Thánh trang trọng và có thể áp đặt quan hệ/xưng hô không được văn cảnh câu này xác định. “Đi đến với” có thể hiểu được nhưng kém tự nhiên hơn “đi đến chỗ” khi nói về chuyển động đến gặp một người. Cách viết “Jêsus” không phải chính tả hiện hành của tiếng Việt hiện đại; “Giê-su” tự nhiên và chuẩn hơn.
  terminology: Dùng “Chúa Giê-su” là cách gọi hiện đại, trang trọng và quen thuộc trong tiếng Việt. Việc nêu tên Ma-ri trong câu chính làm rõ đại từ tiếng Việt mà không thay đổi quy chiếu của ἐκείνη; chú thích vẫn bảo lưu hình thức chỉ định và sắc thái chưa hoàn thành của ἤρχετο.
