  yaml_path: translation/nt/john/011/029.yaml
  text: And when she heard it[a], she got up quickly and went to him.
translation:
  language: vi
  text: Nghe vậy, Ma-ri vội đứng dậy và đi đến chỗ Chúa Giê-su.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát hơn: “Người ấy, khi nghe, đứng dậy nhanh chóng và đang đi về phía Người.”'
    reason: Bảo lưu hình thức chỉ định của ἐκείνη và sắc thái diễn tiến của động từ ἤρχετο.
lexical_decisions:
- source_word: ἐκείνη
  choice: cô
  rationale: Đại từ chỉ định này quy chiếu về Ma-ri trong ngữ cảnh ngay trước đó. Tiếng Việt tự nhiên dùng “cô” thay vì cách dịch cứng là “người ấy”; tên người được tránh ở đây để không thêm vào chính văn.
- source_word: δὲ
  choice: không dịch riêng
  rationale: δέ là liên từ nhẹ để tiếp nối diễn biến. Quan hệ kể chuyện đã được diễn đạt tự nhiên qua cấu trúc câu tiếng Việt, nên không cần gượng thêm “và” hay “nhưng” ở đầu câu.
- source_word: ὡς ἤκουσεν
  choice: vừa nghe vậy
  rationale: ὡς mang nghĩa thời gian, còn “vậy” bổ sung tân ngữ hàm ẩn, chỉ lời nhắn ở câu trước. “Vừa… liền…” diễn đạt tự nhiên sự tiếp nối mau chóng mà không buộc ὡς tự nó phải có nghĩa mạnh là “ngay khi”.
- source_word: ἠγέρθη
  choice: đứng dậy
  rationale: Dù hình thức là thụ động, động từ ở đây được dùng với nghĩa nội động là đứng lên, không hàm ý một tác nhân bên ngoài nâng cô dậy.
- source_word: ταχὺ
  choice: nhanh chóng
  rationale: Trạng từ này nhấn mạnh sự mau lẹ. “Nhanh chóng” rõ nghĩa và phù hợp văn kể chuyện trang trọng, hiện đại.
- source_word: ἤρχετο
  choice: đi đến
  rationale: Thì chưa hoàn thành mô tả chuyển động đang diễn ra. “Đi đến” tự nhiên trong tiếng Việt; sắc thái tiến hành được ghi nhận trong chú thích thay vì dịch cứng là “đang đi”.
- source_word: πρὸς αὐτόν
  choice: đến với Đức Chúa Jêsus
  rationale: πρός với đối cách chỉ sự chuyển động hướng đến một người. Đại từ “Ngài” có thể mơ hồ vì chủ thể gần nhất ở câu trước là Ma-ri, nên dùng tên của Đấng được nói đến trong ngữ cảnh để câu độc lập dễ hiểu; “đến với” cũng giữ được hướng chuyển động.
theological_decisions: []
translation_notes:
