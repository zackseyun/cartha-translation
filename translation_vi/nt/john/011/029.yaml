  - severity: medium
    issue: Vị trí của “nhanh chóng”
    rationale: ταχὺ đứng sau ἠγέρθη, nên trực tiếp nhấn mạnh việc đứng dậy. Bản nháp có thể khiến người đọc gắn “nhanh chóng” chủ yếu với “đi đến”.
  - severity: low
