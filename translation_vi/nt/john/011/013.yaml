source:
  edition: SBLGNT
  text: εἰρήκει δὲ ὁ Ἰησοῦς περὶ τοῦ θανάτου αὐτοῦ. ἐκεῖνοι δὲ ἔδοξαν ὅτι περὶ τῆς κοιμήσεως τοῦ ὕπνου λέγει.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/013.yaml
  text: Jesus had spoken about his death[a], but they thought that he was speaking about the sleep of rest.
translation:
  language: vi
  text: Đức Giê-su đã nói về cái chết của La-xa-rơ, nhưng các môn đệ lại tưởng Ngài đang nói về giấc ngủ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát nghĩa hơn: “giấc ngủ của giấc ngủ,” tức là giấc ngủ theo nghĩa đen, chứ không phải cái chết.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰρήκει
  choice: đã nói
  rationale: Thì quá khứ hoàn thành trong tiếng Hy Lạp chỉ lời Đức Giê-su đã nói trước khi các môn đệ hiểu lầm; tiếng Việt dùng “đã nói” là tự nhiên và đủ rõ theo mạch văn.
- source_word: δὲ ... δὲ
  choice: nhưng ... lại
  rationale: δέ thứ nhất là chuyển ý nhẹ nên không cần dịch riêng; δέ thứ hai diễn tả sự tương phản giữa ý Đức Giê-su và cách các môn đệ hiểu, được thể hiện tự nhiên bằng “nhưng ... lại”.
- source_word: περὶ τοῦ θανάτου αὐτοῦ
  choice: về cái chết của La-xa-rơ
  rationale: Đại từ αὐτοῦ chỉ La-xa-rơ trong ngữ cảnh. Nêu tên giúp tiếng Việt tránh khả năng hiểu nhầm là cái chết của Đức Giê-su mà không làm thay đổi đối tượng quy chiếu.
- source_word: ἐκεῖνοι
  choice: các môn đệ
  rationale: Đại từ chỉ những người đang đối thoại với Đức Giê-su, tức các môn đệ. Dùng danh từ chỉ đối tượng quy chiếu giúp câu tiếng Việt rõ ràng.
- source_word: ἔδοξαν
  choice: tưởng
  rationale: “Tưởng” diễn đạt tự nhiên một nhận định sau đó được xác định là sai.
- source_word: περὶ τῆς κοιμήσεως τοῦ ὕπνου
  choice: về giấc ngủ bình thường
  rationale: Cụm κοιμήσεως τοῦ ὕπνου nhấn mạnh việc ngủ theo nghĩa đen, đối lập với “ngủ” như cách nói về sự chết. “Giấc ngủ bình thường” truyền đạt rõ sự hiểu lầm ấy; cấu trúc sát chữ được giữ trong chú thích.
- source_word: λέγει
  choice: nói
  rationale: Dù ở thì hiện tại trong tiếng Hy Lạp, đây là hiện tại lịch sử nằm trong nội dung điều họ tưởng; tiếng Việt dùng “nói” tự nhiên.
theological_decisions:
- issue: Có nên diễn đạt hình ảnh ngủ và chết theo hướng hàm ý một giáo lý về tình trạng người chết hay không
  choice: Nói rõ Đức Giê-su đề cập đến cái chết của La-xa-rơ, còn các môn đệ hiểu là giấc ngủ theo nghĩa đen.
  alternative: Dịch sát hình thức “sự ngủ của giấc ngủ” hoặc thêm lời giải thích về trạng thái của người chết.
  rationale: Câu này giải thích sự hiểu lầm trong lời tường thuật, không trình bày một giáo lý chi tiết về trạng thái trung gian. Bản dịch giữ sự đối lập giữa cái chết và giấc ngủ theo nghĩa đen mà không thêm kết luận thần học.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Giê-su” và “Ngài” theo lối tôn kính phổ thông; nêu rõ La-xa-rơ và các môn đệ để tránh đại từ mơ hồ trong tiếng Việt.
