id: JHN.11.33
reference: John 11:33
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἰησοῦς οὖν ὡς εἶδεν αὐτὴν κλαίουσαν καὶ τοὺς συνελθόντας αὐτῇ Ἰουδαίους κλαίοντας ἐνεβριμήσατο τῷ πνεύματι καὶ ἐτάραξεν ἑαυτόν,
base_translation:
  language: en
  yaml_path: translation/nt/john/011/033.yaml
  text: Therefore[a], when Jesus saw her weeping, and the Jews who had come with her weeping[b], he was deeply moved in his spirit and troubled himself.
translation:
  language: vi
  text: Vì vậy, khi Đức Giê-su thấy cô khóc, và những người Do Thái[a] đã đến cùng cô cũng khóc, Ngài xúc động mãnh liệt trong tâm thần[b] và tự làm cho mình xao động.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “những người Giu-đê”. Ở đây, từ này chỉ những người Do Thái đến cùng Ma-ri để chia buồn, không phải toàn thể dân Do Thái.
    reason: lexical_alternative
  - marker: b
    text: Động từ được dịch là “xúc động mãnh liệt” cũng có thể mang nghĩa “phẫn nộ” hoặc “vô cùng xao động”, diễn tả một sự kích động mạnh trong nội tâm.
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: Vì vậy
  rationale: Giữ lực liên kết suy luận và tiếp nối của câu chuyện, đồng thời tự nhiên trong tiếng Việt.
- source_word: ὡς εἶδεν
  choice: khi ... thấy
  rationale: ὡς đi với động từ aorist mang nghĩa thời gian tại đây; cách dịch này diễn đạt rõ trình tự.
- source_word: κλαίουσαν / κλαίοντας
  choice: khóc
  rationale: κλαίω chỉ việc khóc thành tiếng; “khóc” trang trọng vừa đủ và không mặc nhiên biến hành động thành nghi thức than khóc.
- source_word: συνελθόντας αὐτῇ
  choice: đi cùng cô
  rationale: Diễn đạt tự nhiên những người đã cùng đến với Ma-ri trong ngữ cảnh.
- source_word: Ἰουδαίους
  choice: những người Do Thái
  rationale: Dịch trực tiếp danh từ, với chú thích xác định đây là những người Do Thái đến cùng Ma-ri chứ không phải toàn thể dân Do Thái.
- source_word: ἐνεβριμήσατο
  choice: xúc động mãnh liệt
  rationale: Giữ cường độ cảm xúc và sự xao động nội tâm mà không quyết định đó chủ yếu là đau buồn, phẫn nộ hay tức giận.
- source_word: τῷ πνεύματι
  choice: trong tâm thần
  rationale: Giữ ý nghĩa chỉ phạm vi nội tâm của cách dative trong nguyên văn và dùng lối diễn đạt trang trọng, dễ hiểu.
- source_word: ἐτάραξεν ἑαυτόν
  choice: tự làm mình bối rối
  rationale: Giữ nguyên nét phản thân rõ ràng của ἑαυτόν thay vì làm phẳng thành một trạng thái bị động.
theological_decisions:
- issue: Sắc thái cảm xúc của Đức Giê-su trong ἐνεβριμήσατο
  choice: xúc động mãnh liệt
  alternative: phẫn nộ; vô cùng xao động; tức giận
  rationale: Động từ diễn tả sự kích động mạnh và có thể hàm ý phẫn nộ, nhưng câu không nêu rõ đối tượng hay bản chất chính xác của cảm xúc; bản dịch chính giữ nguyên độ căng giải nghĩa.
- issue: Tính phản thân của ἐτάραξεν ἑαυτόν
  choice: tự làm mình bối rối
  alternative: trở nên bối rối; khiến mình xao động
  rationale: Nguyên văn dùng đại từ phản thân, nên bản dịch giữ vai trò chủ động của Đức Giê-su mà không giải thích thêm nguyên nhân thần học.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Đức Giê-su” và đại từ “Ngài” để duy trì phẩm cách; giữ các nét khó của nguyên văn, đặc biệt cường độ cảm xúc và cấu trúc phản thân, thay vì diễn giải theo một lập trường thần học cụ thể.
