  source_fidelity: 'Câu dự thảo truyền đạt đúng diễn tiến chính: khi Giê-su đến, ngài nhận ra La-da-rô đã ở trong mộ bốn ngày. Tuy nhiên, «Đức Chúa» thêm một tước hiệu không có trong ὁ Ἰησοῦς, vốn chỉ nêu tên «Giê-su». Bản sửa giữ liên từ οὖν, quan hệ thời gian của ἐλθών, ý nghĩa của εὗρεν, thời lượng do τέσσαρας ἤδη ἡμέρας ἔχοντα biểu thị, và «mộ» cho μνημείῳ.'
  naturalness: «Khi Giê-su đến nơi, Ngài thấy...» là lối kể tự nhiên, rõ ràng trong tiếng Việt hiện đại. «Đến nơi» diễn đạt idiomatically hành động đến trong ngữ cảnh, không thêm một địa điểm hay sự kiện mới. «Đã ở trong mộ được bốn ngày» tự nhiên và bảo toàn ý «đã/rồi» của ἤδη.
  terminology: Dùng «Giê-su» và «La-da-rô» theo chính tả tiếng Việt hiện đại, trung tính liên truyền thống hơn «Jêsus» và tránh thêm «Đức Chúa» vào tên riêng trong nguyên văn. Đại từ kính trọng «Ngài» là lựa chọn văn phong Việt ngữ và không biến thành một tước hiệu được dịch từ bản nguồn.
