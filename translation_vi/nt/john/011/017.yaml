source:
  edition: SBLGNT
  text: Ἐλθὼν οὖν ὁ Ἰησοῦς εὗρεν αὐτὸν τέσσαρας ⸂ἤδη ἡμέρας⸃ ἔχοντα ἐν τῷ μνημείῳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/017.yaml
  text: So when Jesus arrived, he found that Lazarus had already been in the tomb four days.
translation:
  language: vi
  text: Vậy, khi Giê-su đến nơi, Ngài thấy La-da-rô đã ở trong mộ được bốn ngày.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐλθὼν
  choice: khi Đức Chúa Jêsus đến
  rationale: Phân từ bất định Ἐλθὼν diễn tả hành động xảy ra trước hoặc gắn liền về thời gian với động từ chính εὗρεν. Cấu trúc “khi ... đến” tự nhiên trong lời kể tiếng Việt và không nặng tính mô phỏng hình thức Hy Lạp.
- source_word: οὖν
  choice: Vậy
  rationale: Ở đây οὖν nối sự việc này với diễn tiến ngay trước đó; “Vậy” giữ được mạch trần thuật mà không làm câu mang sắc thái suy luận quá mạnh như “vì thế”.
- source_word: εὗρεν
  choice: Ngài thấy
  rationale: Trong ngữ cảnh này, εὗρεν không nhất thiết có nghĩa là tình cờ phát hiện, nhưng là nhận biết tình trạng khi đến nơi. “Thấy” tự nhiên hơn “tìm thấy” trong tiếng Việt và vẫn chuyển tải đúng ý.
- source_word: αὐτὸν
  choice: La-xa-rơ
  rationale: Đại từ αὐτόν quy chiếu rõ đến La-xa-rơ trong ngữ cảnh. Nêu lại tên giúp câu tiếng Việt sáng nghĩa, không thêm thông tin ngoài văn cảnh.
- source_word: τέσσαρας ἤδη ἡμέρας ἔχοντα
  choice: đã ở ... được bốn ngày
  rationale: Cụm Hy Lạp theo nghĩa đen là “đã có bốn ngày”, diễn tả khoảng thời gian La-xa-rơ ở trong mộ. Cấu trúc “đã ở ... được bốn ngày” là cách nói tự nhiên, đồng thời bảo toàn ἤδη bằng “đã”.
- source_word: μνημείῳ
  choice: mộ
  rationale: μνημεῖον chỉ nơi chôn cất. “Mộ” là từ hiện đại, rõ ràng và phù hợp với ngữ cảnh tường thuật.
theological_decisions:
- issue: Nêu rõ đối tượng của αὐτόν
  choice: Dùng tên “La-xa-rơ” thay cho đại từ.
  alternative: 'Giữ đại từ: “Ngài thấy ông đã ở trong mộ được bốn ngày.”'
  rationale: Đại từ Hy Lạp có đối tượng rõ trong văn cảnh, nhưng nêu tên trong tiếng Việt giúp tránh việc “ông” có thể bị hiểu nhầm là nói về Đức Chúa Jêsus. Đây là quyết định về độ rõ nghĩa, không nhằm giải quyết một vấn đề giáo lý.
- issue: Ý nghĩa của khoảng thời gian bốn ngày
  choice: Chỉ diễn đạt sự kiện La-xa-rơ đã ở trong mộ được bốn ngày.
  alternative: Diễn giải thành “đã chết và được chôn bốn ngày”.
  rationale: Bản Hy Lạp trực tiếp nói về thời gian ở trong μνημεῖον. Không thêm lời giải thích thần học hay chi tiết tuy hợp văn cảnh nhưng không được phát biểu trong câu này.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Jêsus” và đại từ tôn kính “Ngài”; tên riêng “La-xa-rơ” theo lối phiên âm Kinh Thánh Việt ngữ quen thuộc. Không cần chú thích vì câu không có dị nghĩa quan trọng cần trình bày.
