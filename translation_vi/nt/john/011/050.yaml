source:
  edition: SBLGNT
  text: οὐδὲ ⸀λογίζεσθε ὅτι συμφέρει ⸀ὑμῖν ἵνα εἷς ἄνθρωπος ἀποθάνῃ ὑπὲρ τοῦ λαοῦ καὶ μὴ ὅλον τὸ ἔθνος ἀπόληται.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/050.yaml
  text: Nor do you consider that it is better for you that one man die for the people[a], and not that the whole nation perish.
translation:
  language: vi
  text: Các ông cũng không cân nhắc rằng một người chết vì dân thì có lợi cho các ông hơn là cả dân tộc bị diệt vong.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể hiểu: “vì lợi ích của dân” hoặc “thay cho dân.”'
    reason: 'Giữ các sắc thái khả hữu của ὑπέρ: vì lợi ích, đại diện, hoặc thay thế.'
lexical_decisions:
- source_word: οὐδὲ λογίζεσθε
  choice: Các ông cũng chẳng suy xét
  rationale: Diễn đạt tự nhiên sắc thái phủ định nối tiếp của οὐδέ và ý tính toán, cân nhắc của λογίζομαι trong cuộc nghị bàn.
- source_word: συμφέρει ὑμῖν
  choice: thà ... còn hơn
  rationale: Cấu trúc so sánh này truyền đạt rõ điều được xem là có lợi hơn cho những người nghe; lợi ích vị kỷ đã hiện rõ qua ngữ cảnh nên không cần thêm từ.
- source_word: εἷς ἄνθρωπος ἀποθάνῃ
  choice: một người chết
  rationale: Giữ sự đối lập giữa một cá nhân và toàn thể dân tộc, đồng thời phản ánh tự nhiên mệnh đề ἵνα trong tiếng Việt.
- source_word: ὑπὲρ τοῦ λαοῦ
  choice: vì dân
  rationale: “Vì” đủ rộng để chỉ lợi ích, đại diện, hoặc hàm ý chết thay, nhờ đó không thu hẹp sự đa nghĩa của ὑπέρ.
- source_word: ὅλον τὸ ἔθνος ἀπόληται
  choice: cả dân tộc bị diệt vong
  rationale: “Dân tộc” phù hợp với thực thể chính trị-dân tộc đang bị đe dọa; “bị diệt vong” diễn tả sự hủy diệt nghiêm trọng mà không ấn định phương thức.
theological_decisions:
- issue: Ý nghĩa của ὑπέρ liên quan đến cái chết của Chúa Giê-su
  choice: Dùng nghĩa rộng “vì dân” trong chính văn
  alternative: “thay cho dân” hoặc “vì lợi ích của dân”
  rationale: Cai-pha trực tiếp nói về lợi ích chính trị, nhưng người thuật chuyện tiếp đó xem lời ông là lời tiên tri ngoài ý muốn. Cách dịch rộng giữ được cả tầng nghĩa chính trị lẫn âm hưởng hy sinh hoặc thay thế.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Các ông” phù hợp lời quở trách nhắm đến nhiều thành viên hội đồng; “thà ... còn hơn” diễn đạt tự nhiên lập luận vụ lợi. Dùng “dân” cho λαός và “dân tộc” cho ἔθνος để bảo tồn sự phân biệt trong nguyên văn.
