  naturalness: Câu văn tự nhiên, trang trọng và phù hợp văn phong Kinh Thánh tiếng Việt hiện đại. Cụm “đánh thức anh ấy dậy” vẫn hiểu được, nhưng có tính lặp nhẹ vì “đánh thức” đã bao hàm ý làm cho dậy; “đánh thức người ấy” gọn và tự nhiên hơn trong ngữ cảnh này.
