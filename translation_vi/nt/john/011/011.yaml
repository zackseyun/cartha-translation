  text: ταῦτα εἶπεν, καὶ μετὰ τοῦτο λέγει αὐτοῖς· Λάζαρος ὁ φίλος ἡμῶν κεκοίμηται, ἀλλὰ πορεύομαι ἵνα ἐξυπνίσω αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/011.yaml
  text: After saying these things[a], he said to them, “Lazarus our friend has fallen asleep, but I am going so that I may wake him up.”
translation:
  language: vi
  text: 'Nói những điều ấy xong, Ngài bảo họ: “La-xa-rơ, bạn của chúng ta, đã ngủ rồi[a], nhưng Ta đi để đánh thức người ấy.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ở đây, “ngủ” là cách nói hình tượng chỉ sự chết. Trong những câu tiếp theo, các môn đồ lúc đầu hiểu lời này theo nghĩa đen.
    reason: Giải thích ẩn dụ mà không thay thế nó trong chính văn.
lexical_decisions:
- source_word: ταῦτα εἶπεν, καὶ μετὰ τοῦτο
  choice: Nói những điều ấy xong
  rationale: Diễn đạt tự nhiên trình tự của hai mệnh đề Hy Lạp, đồng thời giữ số nhiều của ταῦτα và hành động nói đã hoàn tất.
- source_word: λέγει αὐτοῖς
  choice: Ngài bảo họ
  rationale: Hiện tại lịch sử Hy Lạp được chuyển thành lối kể quá khứ tự nhiên trong tiếng Việt; “bảo” phù hợp khi dẫn lời trực tiếp.
- source_word: Λάζαρος
  choice: La-xa-rơ
  rationale: Phiên âm tên riêng theo cách quen dùng trong Kinh Thánh tiếng Việt.
- source_word: ὁ φίλος ἡμῶν
  choice: bạn của chúng ta
  rationale: Giữ quan hệ thân hữu và đại từ ngôi thứ nhất số nhiều, không thêm sắc thái ngoài nguyên văn.
- source_word: κεκοίμηται
  choice: đã ngủ rồi
  rationale: Giữ nguyên ẩn dụ “ngủ” chỉ sự chết và sắc thái trạng thái hiện tại phát sinh từ hành động đã xảy ra của thì hoàn thành.
- source_word: ἀλλὰ πορεύομαι
  choice: nhưng Ta đi
  rationale: Giữ liên từ tương phản và sắc thái hiện tại của hành động có chủ đích; “Ta” là cách tự xưng trang trọng của Chúa Giê-su trong văn mạch Kinh Thánh.
- source_word: ἵνα ἐξυπνίσω αὐτόν
  choice: để đánh thức anh ấy dậy
  rationale: “Để” thể hiện mục đích của ἵνα; “đánh thức… dậy” giữ hình ảnh ngủ-thức và là tiếng Việt hiện đại, dễ hiểu.
theological_decisions:
- issue: Có nên diễn giải κεκοίμηται thành “đã chết” trong chính văn hay giữ ẩn dụ ngủ
  choice: Giữ “đã ngủ rồi” trong chính văn
  alternative: đã chết
  rationale: Chúa Giê-su cố ý dùng hình ảnh ngủ, còn các môn đồ hiểu lầm trong những câu tiếp theo. Giữ ẩn dụ bảo toàn diễn tiến và sự căng thẳng thần học của trình thuật.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Giữ cấu trúc kể chuyện gọn, ẩn dụ ngủ-thức và sự mơ hồ có chủ ý của nguyên văn.
