  source_fidelity: 'Bản dịch trung thành với cấu trúc và ý chính Hy Lạp: ὑπὲρ được diễn đạt tự nhiên là “vì” trong mạch câu trước; thế đối chiếu “không chỉ … nhưng cũng để …” phản ánh οὐχ … μόνον, ἀλλ’ ἵνα καὶ; “con cái Đức Chúa Trời” giữ tính bao quát của τέκνα; “đang tản lạc” truyền đạt tình trạng của phân từ hoàn thành bị động διεσκορπισμένα; và “về làm một” không thêm nội dung vào εἰς ἕν. Chủ thể hàm ẩn của “quy tụ” được mạch văn trước xác định là Chúa Giê-su.'
  naturalness: Câu văn trang trọng, rõ ràng và tự nhiên trong tiếng Việt tiêu chuẩn hiện đại. “Dân tộc ấy” là cách đánh dấu tính xác định phù hợp trong ngữ cảnh và không đưa lời giải thích trực tiếp vào chính văn. Cụm “quy tụ … về làm một” lưu loát và phù hợp văn phong Kinh Thánh.
  terminology: “Dân tộc,” “con cái Đức Chúa Trời,” và “quy tụ” là các lựa chọn nhất quán, dễ hiểu, và không áp đặt cách giải thích hệ phái. Chú thích xác định “dân tộc ấy” là dân tộc Do Thái là chính xác về ngữ cảnh và được neo đúng tại cụm từ cần chú giải.
