id: JHN.11.52
reference: John 11:52
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ οὐχ ὑπὲρ τοῦ ἔθνους μόνον, ἀλλ’ ἵνα καὶ τὰ τέκνα τοῦ θεοῦ τὰ διεσκορπισμένα συναγάγῃ εἰς ἕν.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/052.yaml
  text: and not for the nation only[b][a], but also so that he might gather into one the scattered children of God.
translation:
  language: vi
  text: 'và không chỉ vì dân tộc ấy[a], nhưng cũng để quy tụ con cái Đức Chúa Trời đang tản lạc về làm một.


    [a] Trong ngữ cảnh, “dân tộc ấy” chỉ dân tộc Do Thái.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Trong ngữ cảnh, “dân tộc ấy” chỉ dân tộc Do Thái.
    reason: cultural_note
lexical_decisions:
- source_word: ἔθνους
  choice: dân tộc ấy
  rationale: Danh từ số ít có mạo từ, trong ngữ cảnh trực tiếp chỉ dân tộc Do Thái. “Dân tộc ấy” giữ nghĩa tập thể mà không đưa phần giải thích vào chính văn.
- source_word: ἵνα
  choice: để
  rationale: Diễn đạt tự nhiên sức chỉ mục đích của liên từ Hy Lạp, đồng thời vẫn để ngỏ sắc thái mục đích-kết quả vốn có trong ngữ cảnh.
- source_word: τέκνα τοῦ θεοῦ
  choice: con cái Đức Chúa Trời
  rationale: τέκνα bao gồm cả nam lẫn nữ; “con cái” chính xác hơn “các con trai” và không thu hẹp phạm vi của cụm từ.
- source_word: τὰ διεσκορπισμένα
  choice: đang tản lạc
  rationale: Phân từ hoàn thành bị động mô tả tình trạng đã bị phân tán và hiện vẫn ở trong tình trạng ấy; cách nói tiếng Việt này tự nhiên và giữ trọng tâm vào trạng thái tản lạc.
- source_word: συναγάγῃ
  choice: quy tụ
  rationale: Động từ mang nghĩa tập hợp những người đang phân tán; “quy tụ” trang trọng, tự nhiên và hàm ý đưa họ lại với nhau.
- source_word: εἰς ἕν
  choice: về làm một
  rationale: Giữ sự cô đọng và tính mở của tiếng Hy Lạp, không tự ý thêm “thân thể” hay giải nghĩa thành một hệ thống thần học cụ thể.
- source_word: ὑπὲρ
  choice: vì
  rationale: Tiếp nối ý ở câu trước rằng Chúa Giê-su chết vì dân; “vì” tự nhiên trong tiếng Việt và có thể mang nghĩa vì lợi ích hoặc thay cho mà không giải quyết quá mức sắc thái của giới từ.
theological_decisions:
- issue: Danh tính của “con cái Đức Chúa Trời”
  choice: Giữ nguyên cách gọi rộng và hướng về tương lai của bản văn, không xác định họ theo một hệ phái hay hệ thống thần học cụ thể.
  alternative: Chỉ những người Do Thái lưu tán; hoặc những người được chọn giữa cả người Do Thái lẫn dân ngoại.
  rationale: Câu này đối chiếu “dân tộc ấy” với một nhóm rộng hơn đang tản lạc. Bản dịch giữ nguyên sự căng thẳng và không thu hẹp phạm vi vượt quá điều tiếng Hy Lạp nói rõ.
- issue: Ý nghĩa của εἰς ἕν
  choice: “về làm một”
  alternative: “thành một thân thể” hoặc “trong sự hiệp nhất”
  rationale: Nguyên văn không có danh từ “thân thể” hay “sự hiệp nhất”; cách dịch được chọn bảo toàn tính hàm súc và chiều rộng thần học.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Cấu trúc “không chỉ… nhưng cũng…” giữ sát thế đối chiếu của nguyên văn; “quy tụ… về làm một” vừa tự nhiên vừa không giải thích quá mức.
