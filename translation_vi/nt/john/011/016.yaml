  rationale: Chỉ chỉnh những chỗ cần thiết để tiếng Việt hiện đại tự nhiên hơn và để chú thích giải nghĩa chính xác, thông dụng hơn. Bản sửa vẫn giữ tên gọi Hy Lạp trong thân bài, giữ liên kết suy luận của οὖν, lời khuyến giục “chúng ta ... hãy đi,” và sự mơ hồ về thái độ của Thô-ma.
