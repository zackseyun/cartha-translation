  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἶπεν οὖν Θωμᾶς ὁ λεγόμενος Δίδυμος τοῖς συμμαθηταῖς· Ἄγωμεν καὶ ἡμεῖς ἵνα ἀποθάνωμεν μετ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/016.yaml
  text: So Thomas[a], called Didymus, said to his fellow disciples, “Let us also go, so that we may die with him.”
translation:
  language: vi
  text: 'Vì vậy, Thô-ma, người được gọi là Đi-đim[a], nói với các môn đồ khác: “Chúng ta cũng hãy đi, để cùng chết với Ngài.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Đi-đim là một từ Hy Lạp, nghĩa là “sinh đôi.”
    reason: Giải thích ý nghĩa của tên gọi Δίδυμος, vốn sẽ không rõ đối với độc giả tiếng Việt.
lexical_decisions:
- source_word: οὖν
  choice: Vì vậy
  rationale: Diễn tả sự tiếp nối có tính suy luận từ lời trao đổi trước đó; tự nhiên và trang trọng trong tiếng Việt hiện đại.
- source_word: Θωμᾶς
  choice: Thô-ma
  rationale: Phiên âm tên riêng theo cách dùng quen thuộc trong tiếng Việt.
- source_word: ὁ λεγόμενος Δίδυμος
  choice: người được gọi là Đi-đim[a]
  rationale: Giữ lại tên gọi Hy Lạp dưới dạng phiên âm và giải nghĩa trong chú thích, nhờ đó vừa phản ánh hình thức nguyên văn vừa giúp độc giả hiểu ý nghĩa.
- source_word: τοῖς συμμαθηταῖς
  choice: với các môn đồ đồng bạn
  rationale: συμμαθητής chỉ những người cùng làm môn đồ; cách dịch này giữ sắc thái 'đồng môn' nhưng dễ hiểu hơn trong văn cảnh Kinh Thánh.
- source_word: Ἄγωμεν
  choice: Chúng ta ... hãy đi
  rationale: Thể giả định khuyến giục ngôi thứ nhất số nhiều được diễn đạt tự nhiên bằng cấu trúc 'chúng ta hãy'.
- source_word: καὶ ἡμεῖς
  choice: cũng
  rationale: Giữ ý nhấn mạnh rằng Thô-ma và các môn đồ khác sẽ cùng đi.
- source_word: ἵνα
  choice: để
  rationale: Có thể chỉ mục đích hoặc kết quả dự liệu; 'để' bảo tồn mối liên hệ mà không giải thích quá mức.
- source_word: ἀποθάνωμεν μετ’ αὐτοῦ
  choice: cùng chết với Ngài
  rationale: Diễn đạt ngắn gọn ý chết cùng người được nhắc đến; 'Ngài' chỉ Đức Chúa Jêsus theo văn cảnh, với lối xưng hô trang trọng quen thuộc.
theological_decisions:
- issue: Giọng điệu và dụng ý trong lời của Thô-ma
  choice: Dịch lời khuyến giục một cách trực tiếp, không thêm sắc thái diễn giải.
  alternative: Có thể hiểu là lòng trung thành can đảm, sự cam chịu bi quan, hoặc lời nói mang tính mỉa mai.
  rationale: Nguyên văn không xác định rõ tâm trạng của Thô-ma; bản dịch giữ nguyên sự mơ hồ ấy.
- issue: Đối tượng của μετ’ αὐτοῦ
  choice: Dịch là “với Ngài,” chỉ Đức Chúa Jêsus theo văn cảnh.
  alternative: “với người ấy” hoặc “với thầy”
  rationale: Đại từ Hy Lạp chỉ đơn giản là 'với ông ấy/người ấy'; cách xưng 'Ngài' tự nhiên trong văn phong Kinh Thánh tiếng Việt nhưng không thêm danh xưng thần học vào câu.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Câu giữ nhịp kể chuyện và không quyết định Thô-ma đang can đảm, bi quan hay mỉa mai.
