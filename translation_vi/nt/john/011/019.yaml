source:
  edition: SBLGNT
  text: ⸂πολλοὶ δὲ⸃ ἐκ τῶν Ἰουδαίων ἐληλύθεισαν πρὸς ⸀τὴν Μάρθαν καὶ ⸀Μαριὰμ ἵνα παραμυθήσωνται αὐτὰς περὶ τοῦ ⸀ἀδελφοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/019.yaml
  text: Many of the Jews had come to Martha and Mary to comfort them about their brother[a].
translation:
  language: vi
  text: Nhiều người Do Thái đã đến với Ma-thê và Ma-ri để an ủi hai chị em về người anh em của họ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Nhiều người trong số người Giu-đê đã đến với Ma-thê và Ma-ri.” Từ Hy Lạp này có thể chỉ người Do Thái nói chung hoặc, trong một số văn cảnh của sách Giăng, người Giu-đê nói riêng.'
    reason: alternative_reading
lexical_decisions:
- source_word: πολλοὶ δὲ
  choice: Nhiều
  rationale: πολλοί có nghĩa là “nhiều”; δέ là liên từ nhẹ nối tiếp mạch văn và không cần dịch riêng trong tiếng Việt ở đây, nhằm tránh tạo sắc thái tương phản hoặc thời gian không có trong nguyên văn.
- source_word: ἐκ τῶν Ἰουδαίων
  choice: người Do Thái
  rationale: Cụm từ mang nghĩa bộ phận, “nhiều người trong số những người Do Thái.” Trong ngữ cảnh này, từ ngữ chỉ những người đến chia buồn, không nhất thiết là giới lãnh đạo; cách dịch rộng “người Do Thái” phù hợp nhất, còn khả năng “người Giu-đê” được ghi ở chú thích.
- source_word: ἐληλύθεισαν
  choice: đã đến
  rationale: Thì quá khứ hoàn thành của ἔρχομαι diễn tả việc họ đã đến trước thời điểm đang được thuật lại.
- source_word: πρὸς τὴν Μάρθαν καὶ Μαριὰμ
  choice: đến với Ma-thê và Ma-ri
  rationale: πρός với đối cách ở đây chỉ việc đi đến để thăm hai người. Tên riêng được phiên âm theo cách quen thuộc, dễ nhận biết trong tiếng Việt.
- source_word: ἵνα παραμυθήσωνται αὐτὰς
  choice: để an ủi hai chị em
  rationale: ἵνα với thể giả định diễn tả mục đích; παραμυθέομαι là an ủi hoặc khích lệ người đang đau buồn. “Hai chị em” làm rõ đại từ giống cái số nhiều αὐτάς một cách tự nhiên trong tiếng Việt.
- source_word: περὶ τοῦ ἀδελφοῦ
  choice: về người em trai của họ
  rationale: περί với sở hữu cách mang nghĩa “về/liên quan đến.” Danh từ ἀδελφός không tự xác định anh hay em; ngữ cảnh Giăng 11:5 cho thấy La-xa-rơ được gọi là “em trai” của Ma-thê và Ma-ri, nên cách diễn đạt này tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Nghĩa của Ἰουδαίων trong văn cảnh sách Giăng
  choice: người Do Thái
  alternative: người Giu-đê
  rationale: Câu này có tính miêu tả, nói về những người đến an ủi Ma-thê và Ma-ri, chứ không phải một đoạn tranh luận. Nghĩa dân tộc-tôn giáo rộng là phù hợp nhất, nhưng nghĩa địa lý “người Giu-đê” vẫn là một khả năng thật sự trong cách dùng của Giăng và được bảo lưu trong chú thích.
- issue: Quan hệ tuổi tác trong τοῦ ἀδελφοῦ
  choice: người em trai
  alternative: người anh/em trai
  rationale: Bản thân ἀδελφός chỉ có nghĩa là anh hoặc em trai. Tuy nhiên, Giăng 11:5 dùng trật tự “Ma-thê, em gái bà và La-xa-rơ,” hỗ trợ cách hiểu La-xa-rơ là em trai của hai chị em; lựa chọn này cũng hợp với cách xưng hô tự nhiên trong tiếng Việt.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “an ủi” theo ngữ cảnh tang chế; “hai chị em” giúp câu tự nhiên và xác định rõ đối tượng của đại từ số nhiều. Dấu chú thích [a] xuất hiện ngay sau câu.
