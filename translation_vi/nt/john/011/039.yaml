revisions:
- from: 'Đức Chúa Jêsus phán: “Hãy dời tảng đá đi.” Ma-thê, chị/em của người đã chết[a], thưa với Ngài: “Lạy Chúa, đến giờ chắc đã bốc mùi rồi[b], vì người đã chết được bốn ngày rồi[c].”'
  to: 'Chúa Giê-su phán: “Hãy dời tảng đá đi.” Ma-thê, chị hoặc em gái của người đã chết[a], thưa với Ngài: “Lạy Chúa, đến giờ người ấy đã bốc mùi rồi[b], vì đã chết bốn ngày rồi[c].”'
  rationale: Bản sửa bỏ tình thái phỏng đoán không có trong nguyên văn, thay cách ghi tuổi tương đối không tự nhiên bằng một cụm từ tiếng Việt rõ ràng nhưng vẫn không quyết định Ma-thê là chị hay em, và chuẩn hóa tên riêng theo tiếng Việt hiện đại. Các mệnh đề, quan hệ nguyên nhân, và các điểm cần chú thích của nguyên văn đều được giữ nguyên.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T06:23:52Z'
review_pass:
  verdict: revise
  source_fidelity: Bản dịch truyền đạt đúng mệnh lệnh số nhiều «dời tảng đá», tình trạng người chết đã bốc mùi, và lý do là đã qua bốn ngày. Tuy nhiên, «chắc» thêm sắc thái phỏng đoán không có trong ἤδη ὄζει; câu Hy Lạp trình bày tình trạng như một sự thật. «chị/em» tuy nhằm giữ sự không xác định về tuổi tác, nhưng không phải là cách diễn đạt tự nhiên trong bản văn đọc liên tục.
  naturalness: Văn phong nhìn chung rõ và trang trọng. Cần thay «chị/em» bằng «chị hoặc em gái» để tiếng Việt hiện đại tự nhiên, dù vẫn giữ nguyên sự mơ hồ của tiếng Hy Lạp. Bỏ «chắc» cũng làm lời đối thoại trực tiếp và tự nhiên hơn.
  terminology: «Lạy Chúa» là cách chuyển ngữ phù hợp cho Κύριε trong văn cảnh này và giữ thanh giọng tôn kính. Dùng «Chúa Giê-su» là dạng chính tả/tên riêng phổ biến trong tiếng Việt hiện đại; «Đức Chúa Jêsus» mang phong cách hệ phái và chính tả cũ hơn, không phải lựa chọn trung tính tối ưu cho bản tiếng Việt chuẩn hiện đại.
  issues:
  - severity: medium
    issue: «chắc đã bốc mùi» thêm tình thái phỏng đoán.
    rationale: ἤδη ὄζει có nghĩa là «đã/đến giờ đã bốc mùi», không biểu thị sự không chắc chắn. Nên bỏ «chắc».
  - severity: medium
    issue: «chị/em» không tự nhiên trong văn xuôi tiếng Việt.
    rationale: ἀδελφή không xác định Ma-thê lớn hay nhỏ tuổi hơn người chết. «Chị hoặc em gái» bảo toàn mơ hồ này bằng một cấu trúc tiếng Việt có thể đọc hiểu được.
  - severity: low
    issue: Tên «Đức Chúa Jêsus» không tối ưu cho tiếng Việt chuẩn hiện đại và có sắc thái truyền thống hệ phái.
    rationale: «Chúa Giê-su» là dạng trung tính, hiện hành và tự nhiên hơn, đồng thời vẫn chuyển tải danh xưng tôn kính trong ngữ cảnh.
