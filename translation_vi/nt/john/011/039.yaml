source:
  edition: SBLGNT
  text: λέγει ὁ Ἰησοῦς· Ἄρατε τὸν λίθον. λέγει αὐτῷ ἡ ἀδελφὴ τοῦ ⸀τετελευτηκότος Μάρθα· Κύριε, ἤδη ὄζει, τεταρταῖος γάρ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/039.yaml
  text: Jesus said[a], “Take away the stone.” Martha, the sister of the dead man, said to him, “Lord, by now he smells[c][b], for he has been dead four days.”
translation:
  language: vi
  text: 'Chúa Giê-su phán: “Hãy dời tảng đá đi.” Ma-thê, chị hoặc em gái của người đã chết[a], thưa với Ngài: “Lạy Chúa, đến giờ người ấy đã bốc mùi rồi[b], vì đã chết bốn ngày rồi[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “người đã qua đời.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch mạnh hơn: “đã hôi thối rồi”; động từ Hy Lạp có nghĩa là “phát ra mùi.”'
    reason: lexical_alternative
  - marker: c
    text: 'Theo sát nguyên văn: “vì người ấy là người thuộc ngày thứ tư,” nghĩa là người ấy đã chết được bốn ngày.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄρατε τὸν λίθον
  choice: Hãy dời tảng đá đi
  rationale: Mệnh lệnh số nhiều của αἴρω yêu cầu những người có mặt chuyển hòn đá chắn mộ; “dời ... đi” tự nhiên trong tiếng Việt và phù hợp hơn cách dịch máy móc là “nhấc lên”.
- source_word: ἡ ἀδελφὴ
  choice: chị/em
  rationale: Danh từ Hy Lạp chỉ người nữ cùng cha mẹ nhưng không cho biết lớn hay nhỏ tuổi hơn; cách ghi “chị/em” giữ lại sự không xác định mà tiếng Việt thường buộc phải phân biệt.
- source_word: τοῦ τετελευτηκότος
  choice: người đã chết
  rationale: Phân từ hoàn thành của τελευτάω nói đến người đã chết và đang ở trong tình trạng ấy; cách dịch này rõ ràng, trang trọng và không thêm giới tính ngoài ngữ cảnh.
- source_word: Κύριε
  choice: Lạy Chúa
  rationale: Trong lời Ma-thê trực tiếp thưa với Đức Chúa Jêsus, “Lạy Chúa” vừa tự nhiên trong văn phong Kinh Thánh tiếng Việt vừa giữ được sức nặng của κύριος, thay vì hạ xuống thành lời xưng hô thuần xã giao.
- source_word: ἤδη ὄζει
  choice: đến giờ chắc đã bốc mùi rồi
  rationale: ἤδη mang nghĩa “đến lúc này/đã rồi,” còn ὄζει là phát ra mùi, trong ngữ cảnh rõ ràng là mùi khó chịu. “Chắc” diễn đạt hàm ý thực tế trong lời phản đối của Ma-thê nhưng không biến động từ thành một từ quá thô.
- source_word: τεταρταῖος γάρ ἐστιν
  choice: vì người đã chết được bốn ngày rồi
  rationale: Tính từ τεταρταῖος theo nghĩa đen mô tả người ấy là “người thuộc ngày thứ tư”; tiếng Việt cần khai triển thành thời gian đã chết để câu rõ và tự nhiên.
theological_decisions:
- issue: Cách dịch κύριος khi Ma-thê thưa với Đức Chúa Jêsus
  choice: Lạy Chúa
  alternative: Thưa ngài
  rationale: Ngữ cảnh Giăng cho phép lời xưng hô mang ý nghĩa vượt quá phép lịch sự đơn thuần. “Lạy Chúa” giữ được chiều sâu ấy nhưng không buộc câu này tự nó phải phát biểu trọn vẹn một tuyên tín thần học.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “chị/em” để không tự ý quyết định tuổi tương đối của Ma-thê với La-xa-rơ; dùng “bốc mùi” để truyền đạt sự phân hủy rõ ràng mà không quá khẩu ngữ. Danh xưng “Đức Chúa Jêsus” và đại từ “Ngài” duy trì văn phong Kinh Thánh tôn kính.
