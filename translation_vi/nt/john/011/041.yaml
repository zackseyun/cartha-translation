source:
  edition: SBLGNT
  text: ἦραν οὖν τὸν ⸀λίθον. ὁ δὲ Ἰησοῦς ἦρεν τοὺς ὀφθαλμοὺς ἄνω καὶ εἶπεν· Πάτερ, εὐχαριστῶ σοι ὅτι ἤκουσάς μου,
base_translation:
  language: en
  yaml_path: translation/nt/john/011/041.yaml
  text: So they took away the stone[a]. And Jesus lifted his eyes upward and said, “Father[b], I thank you that you have heard me,”
translation:
  language: vi
  text: 'Vậy, họ dời tảng đá đi. Giê-su ngước mắt lên[a] và nói: “Lạy Cha, con cảm tạ Cha vì Cha đã nghe con[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “nâng mắt hướng lên” hoặc tự nhiên hơn: “nhìn lên.”'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn dùng động từ ở thì aorist; cũng có thể diễn đạt: “vì Cha đã nghe con rồi.” Cách dịch “đã nghe con” diễn tả việc nghe đã xảy ra mà không xác định thêm Cha đã đáp lời theo cách nào.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦραν
  choice: dời ... đi
  rationale: Trong bối cảnh cửa mộ, động từ αἴρω chỉ việc đưa tảng đá khỏi vị trí; “dời ... đi” tự nhiên và không khiến người đọc chỉ nghĩ đến động tác nhấc lên.
- source_word: οὖν
  choice: Vậy
  rationale: Giữ quan hệ hệ quả với mệnh lệnh ở câu trước, đồng thời phù hợp với lối kể chuyện trang trọng, hiện đại.
- source_word: λίθον
  choice: tảng đá
  rationale: “Tảng đá” diễn đạt tự nhiên vật lớn dùng để che cửa mộ.
- source_word: ἦρεν τοὺς ὀφθαλμοὺς ἄνω
  choice: ngước mắt lên
  rationale: Giữ hình ảnh hướng mắt lên trên trong nguyên ngữ mà vẫn là cách nói tự nhiên trong tiếng Việt.
- source_word: δὲ
  choice: và
  rationale: Ở đây δέ là từ nối nhẹ trong mạch kể, không nhất thiết biểu thị sự tương phản.
- source_word: Πάτερ
  choice: Lạy Cha
  rationale: “Cha” giữ nguyên cách xưng hô thân thuộc; “lạy” đánh dấu lời trực tiếp thưa với Đức Chúa Trời theo cách trang trọng, tự nhiên trong lời cầu nguyện tiếng Việt.
- source_word: εὐχαριστῶ σοι
  choice: con cảm tạ Cha
  rationale: “Cảm tạ” trang trọng nhưng vẫn dễ hiểu; cặp đại từ “con–Cha” phù hợp với quan hệ được chính danh xưng Πάτερ biểu thị.
- source_word: ὅτι ἤκουσάς μου
  choice: vì Cha đã nghe con
  rationale: “Đã nghe” phản ánh hành động hoàn tất của động từ aorist mà không diễn giải thêm rằng lời cầu xin đã được đáp ứng theo cách nào.
theological_decisions:
- issue: Cách Giê-su xưng hô với Đức Chúa Trời trong lời cầu nguyện
  choice: Lạy Cha, con ... Cha
  alternative: Cha, tôi ... Ngài
  rationale: Cặp xưng hô “con–Cha” phát sinh trực tiếp từ cách gọi Πάτερ và tự nhiên trong tiếng Việt; không thêm một tước hiệu hay công thức thần học ngoài bản văn.
- issue: Hàm ý của ἤκουσάς μου trong bối cảnh cầu nguyện
  choice: Cha đã nghe con
  alternative: Cha đã nhậm lời con
  rationale: “Đã nghe con” bảo toàn cách diễn đạt của nguyên ngữ và tránh xác định quá mức rằng “nghe” nhất thiết có nghĩa là đã đáp lời theo một cách cụ thể.
translation_notes:
  register: Bản dịch dùng tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Không thêm tước hiệu vào tên Giê-su. “Lạy” phù hợp với lời khẩn nguyện trực tiếp, còn “cảm tạ” giữ sắc thái trang nghiêm của lời cầu nguyện. Các dấu chú thích được đặt ngay sau cụm từ mà chúng giải thích.
