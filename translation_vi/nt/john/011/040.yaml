base_translation:
  language: en
  yaml_path: translation/nt/john/011/040.yaml
  text: Jesus said to her, “Did I not tell you that if you believe, you will see the glory of God?”
translation:
  language: vi
  text: 'Đức Giê-su nói với bà: “Chẳng phải tôi đã nói với bà rằng nếu bà tin, bà sẽ thấy vinh quang của Đức Chúa Trời sao?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: nói
  rationale: Thì hiện tại lịch sử trong lời kể Hy Lạp được chuyển bằng dạng kể tự nhiên trong tiếng Việt; “nói” không biểu thị thì bằng biến tố và phù hợp với ngữ cảnh thuật chuyện.
- source_word: αὐτῇ
  choice: với cô
  rationale: Đại từ tặng cách chỉ Ma-thê trong ngữ cảnh. “Với cô” là cách diễn đạt tự nhiên, đồng thời giữ ngôi xưng hô trực tiếp.
- source_word: Οὐκ εἶπόν σοι
  choice: Chẳng phải tôi đã nói với cô ... sao?
  rationale: Giữ cấu trúc câu hỏi tu từ chờ đợi sự xác nhận. “Đã nói với cô” phản ánh động từ aorist và lời nhắc lại điều đã nói trước đó.
- source_word: ἐὰν πιστεύσῃς
  choice: nếu cô tin
  rationale: “Tin” là cách tương ứng trực tiếp, tự nhiên với πιστεύω và duy trì mạch từ vựng quan trọng trong sách Giăng mà không thu hẹp thành một cách giải thích giáo lý riêng.
- source_word: ὄψῃ
  choice: cô sẽ thấy
  rationale: Diễn đạt tự nhiên dạng tương lai của ὁράω, giữ lời hứa hướng về điều người nghe sẽ chứng kiến.
- source_word: τὴν δόξαν
  choice: vinh quang
  rationale: “Vinh quang” là cách dịch quen thuộc và thích hợp của δόξα, bảo toàn ý niệm về sự uy nghi và sự tự bày tỏ của Đức Chúa Trời.
- source_word: τοῦ θεοῦ
  choice: của Đức Chúa Trời
  rationale: Giữ quan hệ sở hữu/mô tả của sở hữu cách và dùng danh xưng trang trọng, phổ biến trong văn phong Kinh Thánh Tin Lành tiếng Việt.
theological_decisions:
- issue: Mối liên hệ giữa việc tin và việc thấy vinh quang của Đức Chúa Trời
  choice: Giữ nguyên lời hứa có điều kiện trực tiếp dành cho Ma-thê, không giải rộng hệ quả thần học.
  alternative: Hiểu như một nguyên tắc phổ quát về đức tin và phép lạ, hoặc như lời hứa chỉ giới hạn ở việc La-xa-rơ sống lại.
  rationale: Câu Hy Lạp trình bày trực tiếp điều kiện “nếu cô tin” và kết quả “cô sẽ thấy”; bản dịch không nên tự quyết định phạm vi áp dụng rộng hơn của lời ấy.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Giê-su” và “Đức Chúa Trời”; cặp xưng hô “tôi—cô” phù hợp lời Đức Giê-su nói trực tiếp với Ma-thê, tránh lối cổ “ngươi”. Không cần chú thích vì câu không có biến thể hay sự mơ hồ cần giải thích trong bản dịch.
