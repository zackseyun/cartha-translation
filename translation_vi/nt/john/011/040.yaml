review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng câu hỏi tu từ khẳng định, mệnh đề điều kiện «nếu ... tin», lời hứa tương lai «sẽ thấy», và «vinh quang của Đức Chúa Trời». Tuy nhiên, «cô» có thể gợi cách gọi một phụ nữ trẻ và kém phù hợp trong lời nói trang trọng với Ma-thê; nguyên ngữ chỉ đánh dấu ngôi số ít, không xác định sắc thái tuổi tác này.
  naturalness: Cấu trúc câu tự nhiên và rõ ràng trong tiếng Việt hiện đại. Thay «cô» bằng «bà» tạo cặp xưng hô «tôi—bà» lịch sự, nhất quán hơn cho cuộc đối thoại với một phụ nữ trưởng thành, mà không thêm thông tin vào bản văn.
  terminology: «Đức Giê-su», «tin», «vinh quang», và «Đức Chúa Trời» là những cách dùng Kinh Thánh Việt ngữ dễ hiểu và phù hợp với các thuật ngữ trọng yếu. Không cần chú thích.
