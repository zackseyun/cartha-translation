  source_fidelity: 'Bản dịch chuyển tải đúng mạch hệ quả của οὖν, ý chấm dứt của οὐκέτι, tính công khai của παρρησίᾳ, và việc Đức Giê-su lưu lại với các môn đệ. Tuy nhiên, cụm chỉ nơi chốn cần được chỉnh để phản ánh rõ hơn cấu trúc: Người đi đến một vùng gần nơi hoang vắng, rồi đến một thành mang tên Ép-ra-im. “Hoang mạc” trong tiếng Việt hiện đại thường gợi sa mạc, hẹp hơn ἔρημος là vùng hoang vắng/thưa người.'
  naturalness: 'Câu hiện tại có chỗ nối địa điểm chưa tự nhiên: “đến miền gần hoang mạc, vào một thành” khiến quan hệ giữa vùng và thành không rõ và “vào một thành” hơi gượng trong văn xuôi hiện đại. Bản sửa làm rõ các chặng di chuyển mà vẫn giữ nhịp kể trang trọng, tự nhiên.'
