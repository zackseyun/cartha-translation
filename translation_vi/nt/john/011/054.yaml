id: JHN.11.54
reference: John 11:54
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸂Ὁ οὖν Ἰησοῦς⸃ οὐκέτι παρρησίᾳ περιεπάτει ἐν τοῖς Ἰουδαίοις, ἀλλὰ ἀπῆλθεν ἐκεῖθεν εἰς τὴν χώραν ἐγγὺς τῆς ἐρήμου, εἰς Ἐφραὶμ λεγομένην πόλιν, κἀκεῖ ⸀ἔμεινεν μετὰ τῶν ⸀μαθητῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/054.yaml
  text: So Jesus no longer walked openly among the Jews[a], but departed from there to the region near the wilderness, to a city called Ephraim, and stayed there with the disciples.
translation:
  language: vi
  text: Vì vậy, Đức Giê-su không còn đi lại công khai giữa người Do Thái[a] nữa, nhưng rời khỏi đó, đi đến một vùng gần nơi hoang vắng, đến một thành gọi là Ép-ra-im, và ở lại đó với các môn đệ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “giữa người miền Giu-đê.” Trong sách Gio-an, “người Do Thái” đôi khi có thể chỉ cụ thể hơn người ở miền Giu-đê hoặc giới lãnh đạo Do Thái, tùy theo ngữ cảnh.'
    reason: Bảo lưu phạm vi nghĩa theo vùng miền của Ἰουδαῖοι và tránh thu hẹp hoặc mở rộng đối tượng quá mức.
lexical_decisions:
- source_word: οὖν
  choice: Vì vậy
  rationale: Diễn tả hệ quả của âm mưu chống Đức Giê-su trong câu trước, đồng thời nối mạch kể chuyện một cách tự nhiên.
- source_word: οὐκέτι
  choice: không còn... nữa
  rationale: Diễn tả sự chấm dứt một cách hành động trước đó.
- source_word: παρρησίᾳ
  choice: công khai
  rationale: Trong ngữ cảnh này, từ chỉ việc xuất hiện và hoạt động trước công chúng, không chủ yếu nói đến lòng can đảm.
- source_word: περιεπάτει
  choice: đi lại
  rationale: Giữ hình ảnh chuyển động của động từ Hy Lạp và tự nhiên trong tiếng Việt khi nói về hoạt động công khai.
- source_word: ἐν τοῖς Ἰουδαίοις
  choice: giữa người Do Thái
  rationale: Giữ cách hiểu quen thuộc nhưng không xác định quá mức; chú thích bảo lưu khả năng chỉ người Giu-đê trong cách dùng của Gio-an.
- source_word: ἀπῆλθεν ἐκεῖθεν
  choice: rời nơi đó
  rationale: Cách diễn đạt gọn và tự nhiên cho hành động đi khỏi địa điểm trước đó.
- source_word: χώραν
  choice: miền
  rationale: Chỉ một khu vực địa lý, không mang nghĩa quốc gia hiện đại.
- source_word: ἐγγὺς τῆς ἐρήμου
  choice: gần hoang mạc
  rationale: ἔρημος ở đây chỉ vùng hoang vắng, thưa dân; “hoang mạc” phù hợp văn phong Kinh Thánh và không nhất thiết hàm ý sa mạc cát.
- source_word: εἰς Ἐφραὶμ λεγομένην πόλιν
  choice: vào một thành gọi là Ép-ra-im
  rationale: πόλις có thể chỉ thành hoặc thị trấn; “thành” là cách tương đương trực tiếp, trang trọng và dễ hiểu.
- source_word: κἀκεῖ ἔμεινεν
  choice: và ở lại đó
  rationale: Diễn đạt tự nhiên ý lưu lại tại một nơi trong trình thuật di chuyển.
- source_word: μετὰ τῶν μαθητῶν
  choice: với các môn đệ
  rationale: Không thêm đại từ sở hữu vốn không có trong nguyên văn; ngữ cảnh đã xác định rõ các môn đệ của Đức Giê-su.
theological_decisions:
- issue: Phạm vi nghĩa của Ἰουδαῖοι trong Gio-an
  choice: giữa người Do Thái
  alternative: giữa người Giu-đê
  rationale: Trong Gio-an, từ này có thể mang nghĩa dân tộc, địa phương hoặc chỉ giới lãnh đạo tùy ngữ cảnh. Câu này nói đến việc Đức Giê-su không còn đi lại công khai trong môi trường ấy; bản dịch chính giữ cách gọi quen thuộc, còn chú thích bảo lưu sắc thái địa phương có thể có và tránh quy kết cho toàn thể người Do Thái.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Đức Giê-su,” “Ép-ra-im” theo lối phiên âm Kinh Thánh phổ biến; cấu trúc câu theo sát diễn tiến của nguyên văn nhưng tránh lối diễn đạt cứng.
