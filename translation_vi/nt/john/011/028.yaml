review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng chuỗi sự việc, lời gọi kín đáo, và danh xưng διδάσκαλος là “Thầy”. Tuy nhiên, ἀδελφή chỉ có nghĩa “chị/em gái”; nguyên ngữ không xác định Ma-ri là em hay chị của Mác-tha. Cụm “em gái mình” vì thế thu hẹp nghĩa không có trong câu này. “Cô đi gọi riêng em gái mình là Ma-ri” cũng làm quan hệ bổ nghĩa hơi mơ hồ và làm yếu nét ἀπῆλθεν (“rời đi”).
  naturalness: 'Bản sửa dùng câu kể hiện đại, rõ quan hệ các hành động: rời đi, gọi Ma-ri ra riêng, rồi nói. Cách ghi “chị/em gái” không phải lối nói hội thoại thông thường, nhưng là giải pháp ngắn gọn cần thiết trong bản dịch để không quyết định thứ bậc chị em mà tiếng Hy Lạp không nêu.'
  terminology: “Thầy” là tương đương tự nhiên và trung thành của Ὁ διδάσκαλος trong lời Mác-tha. “ra riêng” diễn đạt λάθρᾳ là ngoài sự nghe thấy của công chúng/người chung quanh mà không gán động cơ lén lút. “đang gọi em” giữ sắc thái hiện tại của φωνεῖ σε; đại từ “em” phù hợp trong lời nói hướng đến Ma-ri, nhưng không khẳng định Ma-ri là em của Mác-tha.
  issues:
  - severity: medium
    issue: “em gái mình” xác định thứ bậc chị em không có trong nguyên ngữ.
    rationale: τὴν ἀδελφὴν αὐτῆς chỉ xác định Ma-ri là chị/em gái của Mác-tha; không tự nó cho biết ai lớn tuổi hơn. Cần giữ sự mơ hồ này.
  - severity: low
    issue: Cấu trúc “đi gọi riêng em gái mình là Ma-ri” kém rõ về phạm vi của “riêng” và giảm nét “rời đi” của ἀπῆλθεν.
    rationale: Tách “rời đi” và “gọi ... ra riêng” phản ánh rõ hơn hai động từ chính và trạng từ λάθρᾳ.
  revised_text: 'Sau khi nói điều đó, cô rời đi, rồi gọi Ma-ri, chị/em gái mình, ra riêng và nói: “Thầy đang ở đây và đang gọi em.”'
