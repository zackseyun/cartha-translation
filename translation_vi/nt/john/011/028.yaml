revisions:
- from: 'Sau khi nói điều đó, cô đi gọi riêng em gái mình là Ma-ri và nói: “Thầy đang ở đây và đang gọi em.”'
  to: 'Sau khi nói điều đó, cô rời đi, rồi gọi Ma-ri, chị/em gái mình, ra riêng và nói: “Thầy đang ở đây và đang gọi em.”'
  rationale: Sửa duy nhất các điểm cần thiết để tránh thêm thông tin về thứ bậc của Ma-ri và để làm rõ cấu trúc hành động của bản văn. Không cần chú thích vì “chị/em gái” đã trực tiếp bảo toàn tính không xác định của ἀδελφή trong tiếng Việt.
  reviewer_model: gpt-5.6-terra
