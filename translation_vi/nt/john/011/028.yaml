source:
  edition: SBLGNT
  text: Καὶ ⸀τοῦτο εἰποῦσα ἀπῆλθεν καὶ ἐφώνησεν ⸀Μαριὰμ τὴν ἀδελφὴν αὐτῆς λάθρᾳ εἰποῦσα· Ὁ διδάσκαλος πάρεστιν καὶ φωνεῖ σε.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/028.yaml
  text: And after saying this[a], she went away and called Mary her sister privately, saying[c][b], “The Teacher is here and is calling for you.”
translation:
  language: vi
  text: 'Sau khi nói điều đó, cô rời đi, rồi gọi Ma-ri, chị/em gái mình, ra riêng và nói: “Thầy đang ở đây và đang gọi em.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦτο εἰποῦσα
  choice: Sau khi nói điều đó
  rationale: Chuyển phân từ bất định sang mệnh đề thời gian tự nhiên trong tiếng Việt, đồng thời giữ rõ trình tự hành động.
- source_word: ἀπῆλθεν
  choice: đi
  rationale: Trong chuỗi hành động này, “đi gọi” diễn đạt tự nhiên việc cô rời chỗ đang đứng để tìm Ma-ri, không cần thêm “đi khỏi” vốn dễ nặng câu.
- source_word: ἐφώνησεν Μαριὰμ
  choice: gọi ... Ma-ri
  rationale: φωνέω ở đây có nghĩa gọi hoặc mời một người đến; “gọi Ma-ri” là cách nói thông dụng và phù hợp ngữ cảnh.
- source_word: τὴν ἀδελφὴν αὐτῆς
  choice: em gái mình
  rationale: Ngữ cảnh Giăng 11:5 và trật tự gọi tên thường hiểu Ma-ri là em của Mác-tha; “mình” quy chiếu tự nhiên về chủ ngữ. Dù ἀδελφή tự nó chỉ có nghĩa “chị/em gái”, lựa chọn này phù hợp cách kể bằng tiếng Việt.
- source_word: λάθρᾳ
  choice: riêng
  rationale: Diễn đạt việc nói ngoài tầm nghe của người khác mà không hàm ý lén lút hay dối trá.
- source_word: εἰποῦσα
  choice: và nói
  rationale: Chuyển phân từ chỉ lời nói thành động từ hữu hạn giúp câu kể tự nhiên trong tiếng Việt mà vẫn giữ quan hệ giữa việc gọi và lời nhắn.
- source_word: Ὁ διδάσκαλος
  choice: Thầy
  rationale: “Thầy” là danh xưng tự nhiên, kính trọng dành cho người dạy trong tiếng Việt và giữ nghĩa cơ bản của διδάσκαλος.
- source_word: πάρεστιν
  choice: đang ở đây
  rationale: πάρεστιν chỉ sự hiện diện; “đang ở đây” tự nhiên trong lời nói trực tiếp và không biến thành ý “đã đến”.
- source_word: φωνεῖ σε
  choice: đang gọi em
  rationale: Thì hiện tại được thể hiện bằng “đang”; trong ngữ cảnh, cụm này truyền đạt rằng Đức Chúa Jêsus muốn Ma-ri đến gặp mình.
theological_decisions:
- issue: Danh xưng διδάσκαλος dành cho Đức Chúa Jêsus
  choice: Thầy
  alternative: Chủ / Tôn sư
  rationale: “Thầy” giữ nghĩa thông thường là người dạy và sắc thái kính trọng, không thêm ý niệm quyền sở hữu hoặc quyền thống trị vốn không nằm trực tiếp trong từ Hy Lạp.
- issue: Sắc thái của λάθρᾳ
  choice: gọi riêng
  alternative: gọi lén / bí mật gọi
  rationale: Bản văn cho biết lời gọi được thực hiện kín đáo, nhưng không nêu động cơ lừa dối hay sợ hãi; “riêng” giữ sự dè dặt ấy mà không diễn giải quá mức.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Lời trực tiếp dùng cách xưng hô “Thầy—em” tự nhiên giữa Mác-tha và Ma-ri; không thêm động cơ cho hành động kín đáo.
