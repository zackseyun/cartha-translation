  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: δεδώκεισαν ⸀δὲ οἱ ἀρχιερεῖς καὶ οἱ Φαρισαῖοι ⸀ἐντολὰς ἵνα ἐάν τις γνῷ ποῦ ἐστιν μηνύσῃ, ὅπως πιάσωσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/057.yaml
  text: The chief priests and the Pharisees had given orders that if anyone knew where he was[a], he should report it[b], so that they might seize him.
translation:
  language: vi
  text: 'Các thượng tế và những người Pha-ri-si đã ra lệnh: nếu ai biết Ngài ở đâu thì phải báo tin, để họ bắt Ngài.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δεδώκεισαν
  choice: đã truyền
  rationale: Thì quá khứ hoàn thành trong tiếng Hy Lạp chỉ hành động đã được thực hiện trước thời điểm tường thuật; tiếng Việt dùng “đã” theo cách tự nhiên, còn “truyền lệnh” kết hợp với ἐντολάς để diễn đạt một chỉ thị có thẩm quyền.
- source_word: δὲ
  choice: không dịch thành một từ riêng
  rationale: δέ đánh dấu bước phát triển nhẹ trong mạch kể, không nhất thiết biểu thị đối lập. Tiếng Việt ở đây chuyển mạch tự nhiên mà không cần thêm “bấy giờ” hay “nhưng”.
- source_word: οἱ ἀρχιερεῖς
  choice: các thượng tế
  rationale: Số nhiều chỉ giới lãnh đạo tư tế, không hàm ý có nhiều người đồng thời giữ chức thầy tế lễ thượng phẩm; “các thượng tế” là cách gọi quen thuộc và gọn.
- source_word: οἱ Φαρισαῖοι
  choice: những người Pha-ri-si
  rationale: Phiên âm tên nhóm Do Thái theo cách dùng Kinh Thánh tiếng Việt, đồng thời thêm “những người” để câu tự nhiên.
- source_word: ἐντολὰς
  choice: lệnh
  rationale: Trong bối cảnh hành chính và cưỡng chế, từ này chỉ những chỉ thị có thẩm quyền; “lệnh” mạnh và tự nhiên hơn “chỉ dẫn”.
- source_word: ἵνα ἐάν τις γνῷ
  choice: rằng nếu ai biết
  rationale: Diễn đạt nội dung của mệnh lệnh với một điều kiện tổng quát, giữ cấu trúc và ý nghĩa của tiếng Hy Lạp bằng tiếng Việt tự nhiên.
- source_word: ποῦ ἐστιν
  choice: Ngài ở đâu
  rationale: Giữ thì hiện tại của ἐστιν một cách tự nhiên trong tiếng Việt; tiếng Việt không buộc phải lùi thì trong lời gián tiếp như tiếng Anh.
- source_word: μηνύσῃ
  choice: phải báo lại
  rationale: Động từ có nghĩa báo tin hoặc trình báo cho nhà chức trách. “Phải” thể hiện nội dung mệnh lệnh, còn “báo lại” tự nhiên và không thêm một tân ngữ không có trong nguyên văn.
- source_word: ὅπως πιάσωσιν αὐτόν
  choice: để họ bắt Ngài
  rationale: ὅπως nêu mục đích; πιάζω trong ngữ cảnh này là bắt hoặc tóm giữ. “Bắt” vừa tự nhiên vừa phù hợp ý định khống chế Chúa Giê-su mà không bắt buộc xác định một thủ tục pháp lý chính thức.
theological_decisions:
- issue: Cách xưng gọi Chúa Giê-su qua đại từ αὐτόν và chủ ngữ hàm ẩn của ἐστιν
  choice: Ngài
  alternative: ông ấy / người
  rationale: “Ngài” là đại từ trang trọng, thông dụng trong văn phong Kinh Thánh tiếng Việt khi nói về Chúa Giê-su; lựa chọn này không làm thay đổi nội dung thần học của câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu giữ mạch kể súc tích; không thêm từ chuyển đoạn cho δέ vì tiếng Việt không cần một dấu hiệu riêng tại đây. Không cần chú thích vì “Ngài ở đâu” giữ nguyên thì hiện tại của tiếng Hy Lạp, còn “bắt” thể hiện đầy đủ nghĩa ngữ cảnh của πιάζω.
