review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch truyền đạt đúng các yếu tố chính: các thượng tế và người Pha-ri-si đã ban một chỉ thị; điều kiện là ai biết Chúa Giê-su ở đâu; người ấy phải báo tin; mục đích là để họ bắt Người. “Ngài ở đâu” giữ được thì hiện tại của ἐστιν một cách tự nhiên trong tiếng Việt. “Bắt” diễn đạt phù hợp πιάσωσιν mà không áp đặt sắc thái thủ tục pháp lý của “bắt giữ” hay “bắt giam.”'
  naturalness: '“Đã truyền lệnh rằng” hiểu được, nhưng “đã ra lệnh: nếu…” là kết hợp từ ngữ và cấu trúc câu tự nhiên, rõ ràng hơn trong tiếng Việt hiện đại. “Báo tin” cũng gọn và sát nghĩa μηνύσῃ hơn “báo lại,” vốn có thể gợi ý việc thuật lại một thông tin đã được báo trước.'
  terminology: '“Các thượng tế” là thuật ngữ thích hợp cho οἱ ἀρχιερεῖς số nhiều, chỉ giới lãnh đạo tư tế chứ không khẳng định nhiều đương kim thượng tế. “Pha-ri-si” và đại từ tôn kính “Ngài” phù hợp văn phong Kinh Thánh tiếng Việt hiện đại. Không cần chú thích: không có biến thể hoặc hàm nghĩa từ vựng nào cần thiết phải neo chú thích trong câu này.'
  issues:
  - severity: low
    issue: Cụm “đã truyền lệnh rằng” và “báo lại” kém tự nhiên hơn các tương đương thông dụng.
    rationale: 'Không làm sai nghĩa, nhưng “ra lệnh: nếu…” phản ánh rõ nội dung mệnh lệnh, còn “báo tin” diễn đạt trực tiếp hành động thông báo trong μηνύσῃ mà không thêm ý “lại.”'
  revised_text: 'Các thượng tế và những người Pha-ri-si đã ra lệnh: nếu ai biết Ngài ở đâu thì phải báo tin, để họ bắt Ngài.'
