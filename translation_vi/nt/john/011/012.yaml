    issue: Chính tả tên Jesus không theo chuẩn tiếng Việt hiện đại.
    rationale: “Jêsus” là dạng cũ/ít dùng; “Giê-su” là cách viết hiện đại phổ thông, phù hợp yêu cầu biến thể tiếng Việt chuẩn hiện đại.
  - severity: low
    issue: “Ông ấy” có sắc thái xa cách trong lời các môn đệ nói về La-xa-rơ.
    rationale: “Người ấy” giữ nguyên tham chiếu nam tính theo ngữ cảnh mà tự nhiên, trung tính và phù hợp văn phong tường thuật hơn.
  - severity: low
    issue: Tên La-xa-rơ trong chú thích cần đồng bộ với chuẩn chính tả tên riêng hiện đại.
    rationale: Giữ dạng “La-xa-rơ” phù hợp cách phiên âm có gạch nối đang dùng cho tên này trong tiếng Việt hiện đại.
