  text: εἶπαν οὖν οἱ μαθηταὶ ⸀αὐτῷ· Κύριε, εἰ κεκοίμηται σωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/012.yaml
  text: So the disciples said to him[a], “Lord, if he has fallen asleep[b], he will recover.”
translation:
  language: vi
  text: 'Vì vậy, các môn đệ nói với Ngài: “Thưa Chúa, nếu người ấy đã ngủ rồi[a], người ấy sẽ khỏi bệnh[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch sát hơn là “đã đi ngủ.” Trước đó, Đức Chúa Giê-su dùng giấc ngủ làm hình ảnh chỉ cái chết của La-xa-rơ, nhưng các môn đệ hiểu là giấc ngủ thông thường.
    reason: lexical_alternative
  - marker: b
    text: Động từ Hy Lạp cũng có thể được dịch là “sẽ được cứu,” nhưng trong văn cảnh bệnh tật ở đây, từ này có nghĩa là “sẽ khỏi bệnh” hoặc “sẽ khỏe lại.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Vì vậy
  rationale: Diễn tả sự suy luận của các môn đệ từ lời Đức Chúa Jêsus vừa nói, đồng thời nối kết tự nhiên với mạch kể chuyện.
- source_word: οἱ μαθηταὶ
  choice: các môn đệ
  rationale: Danh từ có mạo từ và chỉ nhóm môn đệ đã rõ trong văn cảnh; không thêm từ sở hữu vốn không có trong nguyên văn.
- source_word: αὐτῷ
  choice: với Ngài
  rationale: Giữ đại từ của nguyên văn thay vì thay bằng tên riêng; “Ngài” phù hợp với lối xưng hô trang trọng dành cho Đức Chúa Jêsus.
- source_word: Κύριε
  choice: Thưa Chúa
  rationale: “Chúa” giữ được nghĩa căn bản và chiều sâu Cơ Đốc học của κύριος; “thưa” khiến lời gọi trực tiếp tự nhiên trong tiếng Việt.
- source_word: εἰ
  choice: nếu
  rationale: Giữ nguyên cấu trúc điều kiện trực tiếp trong lập luận của các môn đệ.
- source_word: κεκοίμηται
  choice: đã ngủ rồi
  rationale: Thể hoàn thành chỉ tình trạng hiện tại phát sinh từ việc đi ngủ. Cách dịch này thể hiện đúng sự hiểu lầm của các môn đệ rằng La-xa-rơ đang ngủ theo nghĩa thông thường, trong khi vẫn để văn cảnh kế tiếp giải thích hình ảnh về cái chết.
- source_word: σωθήσεται
  choice: sẽ khỏi bệnh
  rationale: Trong văn cảnh bệnh tật, σῴζω có thể chỉ việc hồi phục sức khỏe. “Sẽ khỏi bệnh” truyền đạt rõ điều các môn đệ muốn nói mà không đưa nghĩa cứu rỗi vào chỗ này.
theological_decisions:
- issue: Cách dịch κύριος khi các môn đệ trực tiếp thưa với Đức Chúa Jêsus
  choice: Chúa
  alternative: Thầy; ngài
  rationale: “Chúa” vừa là cách xưng hô thích hợp, vừa bảo toàn sắc thái Cơ Đốc học có thể có trong sách Giăng mà không buộc câu này chỉ mang một tầng nghĩa.
- issue: Có nên làm rõ κεκοίμηται là cái chết trong chính văn hay không
  choice: Dùng ngôn ngữ chỉ giấc ngủ thông thường
  alternative: Dịch thành “đã an nghỉ” hoặc giải thích là “đã chết”
  rationale: Điểm tự sự nằm ở chỗ Đức Chúa Jêsus dùng giấc ngủ như hình ảnh về cái chết, còn các môn đệ hiểu theo nghĩa đen. Chính văn giữ sự hiểu lầm ấy để những câu sau tự làm sáng tỏ.
- issue: Nghĩa của σωθήσεται trong văn cảnh
  choice: sẽ khỏi bệnh
  alternative: sẽ được cứu; sẽ khỏe lại
  rationale: Ngữ cảnh nói đến sự hồi phục sau cơn bệnh. Cách dịch này tránh tạo một khẳng định cứu rỗi không phải trọng tâm của lời các môn đệ, còn nghĩa rộng hơn của động từ được ghi ở chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. Dùng “các môn đệ” cho μαθηταί và lối xưng hô “Ngài/Chúa” nhất quán với ngữ cảnh nói về Đức Chúa Jêsus. Hai dấu chú thích được đặt ngay sau các từ ngữ mà chúng giải thích.
