lexical_decisions:
- source_word: δὲ
  choice: không dịch riêng
  rationale: δέ là từ nối nhẹ, tiếp nối mạch kể chuyện chứ không biểu thị sự tương phản rõ; tiếng Việt tự nhiên không cần thêm một từ nối ở đầu câu.
- source_word: Βηθανία
  choice: Bê-tha-ni
  rationale: Phiên âm địa danh theo cách gọi quen thuộc trong tiếng Việt.
- source_word: ἐγγὺς τῶν Ἱεροσολύμων
  choice: ở gần Giê-ru-sa-lem
  rationale: Diễn đạt trực tiếp ý nghĩa không gian của ἐγγύς và dùng tên địa danh quen thuộc trong tiếng Việt.
- source_word: ὡς
  choice: khoảng
  rationale: Trong cụm chỉ khoảng cách, ὡς biểu thị con số ước lượng.
- source_word: ἀπὸ σταδίων δεκαπέντε
  choice: cách khoảng mười lăm sta-đi-ôn
  rationale: Giữ đơn vị đo cổ của nguyên bản và diễn đạt tự nhiên quan hệ khoảng cách do ἀπό hàm ý; đơn vị hiện đại được nêu trong chú thích.
