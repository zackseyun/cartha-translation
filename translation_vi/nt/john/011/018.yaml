base_translation:
  language: en
  yaml_path: translation/nt/john/011/018.yaml
  text: Bethany was near Jerusalem[a], about fifteen stadia away.
translation:
  language: vi
  text: Bê-tha-ni ở gần Giê-ru-sa-lem, cách khoảng mười lăm sta-đi-ôn[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Khoảng ba kilômét.
