  source_fidelity: Bản nháp chuyển đúng động từ ἠγάπα là “yêu” và có thể lược dịch δέ, vốn chỉ là liên từ nhẹ. Tuy nhiên, “em gái bà” thu hẹp ἀδελφή (“chị hoặc em gái”) thành em gái; bản văn Hy Lạp ở câu này không xác định thứ bậc tuổi. Ngoài ra, “Đức Chúa” không có trong ὁ Ἰησοῦς và thêm một tước xưng vượt quá bản văn nguồn.
  naturalness: Câu sửa giữ nhịp liệt kê tự nhiên của tiếng Việt. Cụm “chị/em gái” kèm chú thích là cách gọn để tránh áp đặt giới tính thứ bậc mà tiếng Việt thường buộc phải chọn.
  terminology: Dùng “Giê-su” theo chính tả Việt hiện đại; giữ các dạng tên Ma-thê và La-xa-rơ nhất quán với bản nháp. Không thêm tước xưng thần học không hiện diện trong câu nguồn.
