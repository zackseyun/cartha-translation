  text: ἠγάπα δὲ ὁ Ἰησοῦς τὴν Μάρθαν καὶ τὴν ἀδελφὴν αὐτῆς καὶ τὸν Λάζαρον.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/005.yaml
  text: Jesus loved Martha and her sister and Lazarus.
translation:
  language: vi
  text: Giê-su yêu Ma-thê, chị/em gái của bà ấy[a], và La-xa-rơ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tiếng Hy Lạp dùng từ có thể chỉ chị gái hoặc em gái; không xác định người này lớn hay nhỏ tuổi hơn Ma-thê.
    reason: Bảo toàn sự không xác định về thứ bậc tuổi trong ἀδελφή, trong khi tiếng Việt thường đòi hỏi chọn “chị” hoặc “em”.
lexical_decisions:
- source_word: ἠγάπα
  choice: yêu
  rationale: Động từ ἀγαπάω ở thì chưa hoàn thành diễn tả tình yêu bền liên tục trong quá khứ; tiếng Việt tự nhiên dùng “yêu” mà không cần thêm từ chỉ tiến trình.
- source_word: δὲ
  choice: không dịch thành từ riêng
  rationale: δέ là liên từ nhẹ, chuyển mạch hoặc tạo nền cho lời kể. Trong câu tiếng Việt này, quan hệ diễn ngôn được ngữ cảnh thể hiện tự nhiên; thêm “bấy giờ” hoặc “nhưng” sẽ dễ tạo sắc thái thời gian hay đối lập quá mức.
- source_word: τὴν Μάρθαν
  choice: Ma-thê
  rationale: Phiên âm tên riêng theo cách dùng Kinh Thánh tiếng Việt quen thuộc.
- source_word: τὴν ἀδελφὴν αὐτῆς
  choice: em gái bà
  rationale: ἀδελφή có thể chỉ chị hoặc em gái; ngữ cảnh Giăng 11:1 xác định Ma-ri là em của Ma-thê. Dùng “bà” làm đại từ sở hữu phù hợp văn phong trang trọng và tránh lặp tên.
- source_word: τὸν Λάζαρον
  choice: La-xa-rơ
  rationale: Phiên âm tên riêng theo cách dùng Kinh Thánh tiếng Việt quen thuộc.
- source_word: καὶ ... καὶ
  choice: …, … và …
  rationale: Chuỗi καί phối hợp ba người. Tiếng Việt liệt kê tự nhiên bằng dấu phẩy rồi “và”, vẫn bảo toàn ba đối tượng ngang hàng mà không tạo câu gượng.
theological_decisions:
- issue: Sắc thái của thì chưa hoàn thành trong ἠγάπα đối với tình yêu của Đức Chúa Jêsus
  choice: Một lời khẳng định đơn giản về tình yêu liên tục của Đức Chúa Jêsus dành cho cả ba người
  alternative: “đang yêu” hoặc “đã đem lòng yêu”
  rationale: Thì chưa hoàn thành ở đây tự nhiên nhất diễn tả một trạng thái tiếp diễn trong quá khứ, không hàm ý tình yêu mới bắt đầu và cũng không cần nhấn mạnh tiến trình bằng lối nói thiếu tự nhiên.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ tước xưng “Đức Chúa Jêsus” cùng lối phiên âm tên riêng quen thuộc trong truyền thống Kinh Thánh tiếng Việt; không thêm từ nối đầu câu vì δέ chỉ mang lực liên kết nhẹ.
