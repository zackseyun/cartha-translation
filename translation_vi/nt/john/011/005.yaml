revisions:
- from: Đức Chúa Jêsus yêu Ma-thê, em gái bà và La-xa-rơ.
  to: Giê-su yêu Ma-thê, chị/em gái của bà ấy[a], và La-xa-rơ.
  rationale: Sửa “em gái” thành “chị/em gái” để không thêm thông tin không có trong nguyên văn, và bỏ “Đức Chúa” vì câu Hy Lạp chỉ nêu tên Giê-su. Lược δέ và dùng thì quá khứ đơn “yêu” vẫn phản ánh tự nhiên trạng thái tiếp diễn của thì chưa hoàn thành trong ngữ cảnh.
