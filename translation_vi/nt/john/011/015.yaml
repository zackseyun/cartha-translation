source:
  edition: SBLGNT
  text: καὶ χαίρω δι’ ὑμᾶς, ἵνα πιστεύσητε, ὅτι οὐκ ἤμην ἐκεῖ· ἀλλὰ ἄγωμεν πρὸς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/015.yaml
  text: And I am glad for your sake that I was not there[a], so that you may believe. But let us go to him.
translation:
  language: vi
  text: Vì lợi ích của anh em, tôi mừng vì tôi đã không ở đó, để anh em tin.[a] Nhưng chúng ta hãy đi đến chỗ anh ấy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “để anh em bắt đầu tin.” Thức giả định aorist trong tiếng Hy Lạp có thể nhấn mạnh việc bước vào đức tin, nhưng “tin” trong bản chính có nghĩa rộng hơn và ít áp đặt cách giải thích hơn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: χαίρω
  choice: Tôi mừng
  rationale: Động từ hiện tại diễn tả niềm vui; “Tôi mừng” tự nhiên trong tiếng Việt hiện đại và phù hợp ngữ cảnh hơn “Tôi vui mừng”.
- source_word: δι’ ὑμᾶς
  choice: vì anh em
  rationale: διά với đối cách ở đây chỉ điều có lợi cho các môn đồ; trong tiếng Việt, “vì anh em” vừa tự nhiên vừa có thể truyền đạt ý “vì lợi ích của anh em” theo ngữ cảnh.
- source_word: ἵνα πιστεύσητε
  choice: để anh em tin
  rationale: ἵνα với giả định cách aorist diễn tả mục đích. “Tin” giữ cách diễn đạt rộng, không buộc phải hiểu rằng trước đó các môn đồ hoàn toàn chưa tin.
- source_word: ὅτι οὐκ ἤμην ἐκεῖ
  choice: mà tôi đã không có mặt ở đó
  rationale: ὅτι giới thiệu nội dung khiến Chúa Giê-su mừng. Cấu trúc “mừng ... mà” tự nhiên trong tiếng Việt; “đã không có mặt ở đó” chuyển tải rõ quá khứ của ἤμην.
- source_word: ἀλλὰ ἄγωμεν
  choice: Nhưng chúng ta hãy đi
  rationale: ἀλλά đánh dấu sự chuyển hướng tương phản sang hành động, còn ἄγωμεν là giả định cách ngôi thứ nhất số nhiều mang ý khích lệ; “chúng ta hãy đi” chuyển tải cả hai chức năng.
- source_word: πρὸς αὐτόν
  choice: đến với anh ấy
  rationale: πρός với đối cách chỉ sự di chuyển về phía một người. “Đến với anh ấy” tự nhiên và giữ đại từ chỉ La-xa-rơ; “anh ấy” phù hợp lời nói trực tiếp hiện đại.
theological_decisions:
- issue: Sắc thái của πιστεύσητε trong văn mạch Giăng
  choice: tin
  alternative: bắt đầu tin
  rationale: Giả định cách aorist có thể gợi sắc thái bước vào hoặc đạt đến đức tin, nhưng không nhất thiết khẳng định trước đó các môn đồ hoàn toàn không tin. Bản chính giữ “tin” để bảo toàn độ mở thần học của câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “anh em” cho số nhiều ὑμᾶς trong lời Chúa Giê-su nói với các môn đồ; dùng “anh ấy” cho La-xa-rơ để câu thoại tự nhiên. Dấu chú thích [a] đặt ngay sau mệnh đề mục đích mà chú thích giải thích.
