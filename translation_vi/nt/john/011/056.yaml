source:
  edition: SBLGNT
  text: ἐζήτουν οὖν τὸν Ἰησοῦν καὶ ἔλεγον μετ’ ἀλλήλων ἐν τῷ ἱερῷ ἑστηκότες· Τί δοκεῖ ὑμῖν; ὅτι οὐ μὴ ἔλθῃ εἰς τὴν ἑορτήν;
base_translation:
  language: en
  yaml_path: translation/nt/john/011/056.yaml
  text: So they were looking for Jesus and saying to one another as they stood in the temple courts[b][a], “What do you think? That he certainly will not come to the feast?”
translation:
  language: vi
  text: 'Vì vậy, họ cứ tìm Đức Chúa Jêsus và, khi đang đứng trong khuôn viên đền thờ[a], nói với nhau: “Các ông nghĩ sao? Ngài nhất định không đến dự lễ sao?”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hy Lạp ἱερόν chỉ toàn bộ khuôn viên đền thờ, chứ không riêng nơi thánh bên trong.
    reason: cultural_note
  - marker: b
    text: 'Cũng có thể dịch: “Ngài sẽ không hề đến dự lễ sao?” Tiếng Hy Lạp dùng phép phủ định nhấn mạnh (οὐ μή).'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐζήτουν
  choice: họ cứ tìm
  rationale: Thì chưa hoàn thành diễn tả hành động đang tiếp diễn hoặc lặp lại; “cứ tìm” tự nhiên trong tiếng Việt và giữ được sắc thái ấy.
- source_word: οὖν
  choice: Vì thế
  rationale: Nối câu này với diễn tiến và suy luận từ ngữ cảnh trước.
- source_word: ἔλεγον μετ’ ἀλλήλων
  choice: hỏi nhau
  rationale: Trong ngữ cảnh, điều họ nói với nhau là một câu hỏi; cách diễn đạt này tự nhiên, đồng thời giữ ý trao đổi qua lại.
- source_word: ἐν τῷ ἱερῷ
  choice: trong khuôn viên đền thờ
  rationale: ἱερόν chỉ toàn bộ khu đền thờ, không riêng nơi thánh bên trong.
- source_word: ἑστηκότες
  choice: đứng
  rationale: Giữ trạng thái đứng của phân từ hoàn thành nhưng đặt vào cấu trúc câu tiếng Việt tự nhiên.
- source_word: Τί δοκεῖ ὑμῖν;
  choice: Các ông nghĩ sao?
  rationale: Cách hỏi ý kiến tự nhiên, trang trọng vừa phải trong tiếng Việt hiện đại; đại từ số nhiều được thể hiện rõ.
- source_word: οὐ μὴ ἔλθῃ
  choice: Chắc chắn Ngài sẽ không đến ... chứ?
  rationale: “Chắc chắn” chuyển tải phép phủ định nhấn mạnh οὐ μή; “chứ?” giữ đây là lời phỏng đoán được đưa ra để hỏi ý kiến, thay vì biến nó thành lời khẳng định tuyệt đối.
- source_word: εἰς τὴν ἑορτήν
  choice: đến dự lễ
  rationale: Diễn đạt tự nhiên hành động đến tham dự kỳ lễ; ngữ cảnh trước xác định đây là lễ Vượt Qua.
theological_decisions:
- issue: Sắc thái câu hỏi với phủ định nhấn mạnh οὐ μή
  choice: “Chắc chắn Ngài sẽ không đến dự lễ chứ?”
  alternative: “Ngài nhất định sẽ không đến dự lễ sao?”
  rationale: Bản dịch chính giữ đồng thời sức nhấn mạnh của οὐ μή và tính chất dò hỏi ý kiến của cả câu, không tự quyết định người nói mong đợi câu trả lời khẳng định hay phủ định.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Jêsus” và đại từ kính trọng “Ngài”; “khuôn viên đền thờ” làm rõ sự phân biệt giữa ἱερόν và nơi thánh bên trong. Các dấu chú thích [a], [b] đều xuất hiện trong chính văn.
