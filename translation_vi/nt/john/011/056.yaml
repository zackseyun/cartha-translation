revisions:
- from: 'Vì thế, họ cứ tìm Đức Chúa Jêsus và đứng trong khuôn viên đền thờ[a], hỏi nhau: “Các ông nghĩ sao? Chắc chắn Ngài sẽ không đến dự lễ chứ?”[b]'
  to: 'Vì vậy, họ cứ tìm Đức Chúa Jêsus và, khi đang đứng trong khuôn viên đền thờ[a], nói với nhau: “Các ông nghĩ sao? Ngài nhất định không đến dự lễ sao?”[b]'
  rationale: Bản sửa gắn rõ trạng thái “đang đứng” với hành động nói chuyện, giữ sắc thái chưa hoàn thành của “cứ tìm” và “nói với nhau”, và diễn đạt phủ định nhấn mạnh trong một câu hỏi tiếng Việt tự nhiên. Các dấu chú thích vẫn được đặt đúng tại thuật ngữ và câu cần chú giải.
