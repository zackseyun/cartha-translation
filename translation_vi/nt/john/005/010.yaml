revisions:
- from: 'Vì thế, những người Do Thái[a] nói với người đã được chữa lành: “Hôm nay là ngày Sa-bát, anh không được phép vác chiếu[b][c].”'
  to: 'Vì thế, những người Do Thái[a] nói với người đã được chữa lành: “Hôm nay là ngày Sa-bát, anh không được phép mang chiếu[b][c].”'
  rationale: Đổi “vác” thành “mang” để truyền đạt αἴρω bao quát hơn mà vẫn tự nhiên trong tiếng Việt. Chỉnh chú thích văn hóa để giải thích κράβαττος rõ ràng, tự nhiên, và không thêm chi tiết không cần thiết. Các lựa chọn còn lại được giữ vì phù hợp với nguyên văn và giữ được sự mơ hồ có chủ ý về οἱ Ἰουδαῖοι.
  reviewer_model: gpt-5.6-terra
