  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἔλεγον οὖν οἱ Ἰουδαῖοι τῷ τεθεραπευμένῳ· Σάββατόν ἐστιν, ⸀καὶ οὐκ ἔξεστίν σοι ἆραι τὸν ⸀κράβαττον.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/010.yaml
  text: So the Jews were saying to the man who had been healed[a], “It is the Sabbath[c][b], and it is not lawful for you to carry your mat.”
translation:
  language: vi
  text: 'Vì thế, những người Do Thái[a] nói với người đã được chữa lành: “Hôm nay là ngày Sa-bát, anh không được phép mang chiếu[b][c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn Hy Lạp là “những người Do Thái.” Tùy cách Giăng dùng cụm từ này trong văn cảnh, cũng có thể hiểu là “các nhà lãnh đạo Do Thái” hoặc “những người Giu-đê.”
    reason: alternative_reading
  - marker: b
    text: Cũng có thể dịch là “nhấc chiếu lên” hoặc “mang chiếu đi.”
    reason: lexical_alternative
  - marker: c
    text: Từ được dịch là “chiếu” chỉ một tấm chiếu hoặc tấm đệm nằm có thể mang theo, không nhất thiết là một chiếc giường đầy đủ.
    reason: cultural_note
lexical_decisions:
- source_word: ἔλεγον
  choice: nói
  rationale: Thì chưa hoàn thành có thể gợi hành động đang diễn ra hoặc lặp lại; trong mạch kể này, “nói” là cách diễn đạt tự nhiên trong tiếng Việt mà không áp đặt sắc thái “cứ nói” khi văn cảnh chưa đòi hỏi.
- source_word: οὖν
  choice: Vì thế
  rationale: Giữ chức năng nối tiếp và suy luận từ sự việc vừa xảy ra, đồng thời phù hợp với văn kể hiện đại.
- source_word: οἱ Ἰουδαῖοι
  choice: những người Do Thái
  rationale: Giữ cách gọi trực tiếp của bản Hy Lạp, không tự ý thu hẹp thành giới lãnh đạo Do Thái hay người Giu-đê; các khả năng theo văn cảnh được nêu trong chú thích.
- source_word: τῷ τεθεραπευμένῳ
  choice: với người đã được chữa lành
  rationale: Diễn đạt phân từ hoàn thành bị động, chỉ việc chữa lành đã hoàn tất và kết quả vẫn còn.
- source_word: Σάββατόν ἐστιν
  choice: Hôm nay là ngày Sa-bát
  rationale: Cách nói tự nhiên trong tiếng Việt cho lời xác định ngày hiện tại là Sa-bát; “hôm nay” làm rõ ý thời gian vốn hàm chứa trong câu mà không thay đổi nội dung.
- source_word: οὐκ ἔξεστίν σοι
  choice: anh không được phép
  rationale: Giữ ý về điều được luật lệ cho phép trong cuộc tranh luận liên quan đến việc giữ ngày Sa-bát, đồng thời tự nhiên hơn “không hợp pháp cho anh” trong tiếng Việt.
- source_word: ἆραι
  choice: vác
  rationale: Động từ có thể nghĩa là nhấc lên, cầm lấy hoặc mang đi; tại đây lời phản đối nhắm đến việc mang vật dụng ấy trong ngày Sa-bát, nên “vác” truyền đạt rõ hành động.
- source_word: κράβαττον
  choice: chiếu
  rationale: Chỉ một tấm nằm hoặc giường xếp nhẹ có thể mang theo, thường là vật dụng đơn sơ; “chiếu” tránh gợi hình ảnh một chiếc giường lớn có khung.
theological_decisions:
- issue: Đối tượng được gọi là οἱ Ἰουδαῖοι trong sách Giăng
  choice: những người Do Thái
  alternative: các nhà lãnh đạo Do Thái; những người Giu-đê
  rationale: Câu này không trực tiếp xác định họ là giới lãnh đạo hay nhấn mạnh nguồn gốc địa lý. Vì vậy, bản chính giữ cách gọi rộng của tiếng Hy Lạp và dùng chú thích để bảo tồn sự mơ hồ thật sự trong cách Giăng sử dụng thuật ngữ.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Sa-bát” theo cách phiên âm quen thuộc; lời thoại dùng đại từ “anh” phù hợp với người đàn ông đã được chữa lành. Các dấu chú thích được đặt ngay sau những từ ngữ liên quan.
