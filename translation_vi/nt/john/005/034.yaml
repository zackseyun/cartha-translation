source:
  edition: SBLGNT
  text: ἐγὼ δὲ οὐ παρὰ ἀνθρώπου τὴν μαρτυρίαν λαμβάνω, ἀλλὰ ταῦτα λέγω ἵνα ὑμεῖς σωθῆτε.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/034.yaml
  text: But I do not receive testimony from man; rather, I say these things so that you may be saved.
translation:
  language: vi
  text: Nhưng tôi không nhận lời chứng từ con người; trái lại, tôi nói những điều này để các ông được cứu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρὰ ἀνθρώπου
  choice: từ con người
  rationale: παρά với sở hữu cách chỉ nguồn. Danh từ số ít ἄνθρωπος ở đây mang nghĩa khái quát về con người, đối lập lời chứng của loài người với thẩm quyền lớn hơn trong văn cảnh.
- source_word: μαρτυρίαν
  choice: lời chứng
  rationale: Cách dịch này tự nhiên trong tiếng Việt, đồng thời giữ sắc thái chứng cứ/pháp lý của μαρτυρία trong phân đoạn.
- source_word: λαμβάνω
  choice: nhận
  rationale: Giữ sát nghĩa cơ bản và thì hiện tại của động từ, không diễn giải mạnh hơn thành 'chấp nhận' hay 'cần đến'.
- source_word: ταῦτα
  choice: những điều này
  rationale: Phản ánh đại từ chỉ định trung tính số nhiều, thay vì làm phẳng thành dạng số ít.
- source_word: λέγω
  choice: tôi nói
  rationale: Thì hiện tại đơn tự nhiên trong tiếng Việt và phù hợp với tân ngữ 'những điều này'.
- source_word: ἵνα ὑμεῖς σωθῆτε
  choice: để anh em được cứu
  rationale: Diễn đạt mục đích của ἵνα và giữ thể bị động của σωθῆτε mà không thêm một mô hình thần học cụ thể.
- source_word: δὲ ... ἀλλὰ
  choice: Nhưng ... trái lại
  rationale: 'Giữ rõ cấu trúc tương phản: Chúa Giê-su phủ nhận việc nhận lời chứng từ con người, rồi nêu mục đích Ngài nói những điều ấy.'
theological_decisions:
- issue: Ý nghĩa của 'được cứu' trong văn cảnh
  choice: Giữ cách nói cứu rỗi rộng là 'được cứu'.
  alternative: được giải cứu; đạt đến sự cứu rỗi
  rationale: σωθῆτε có sức nặng cứu rỗi nhưng câu không xác định chi tiết cơ chế hay mô hình giáo lý; 'được cứu' bảo toàn cả thể bị động lẫn độ rộng thần học.
- issue: Sắc thái của 'không nhận lời chứng từ con người'
  choice: Dịch trực tiếp là 'không nhận', không diễn giải thành 'không cần'.
  alternative: không cần lời chứng của con người; không chấp nhận lời chứng từ con người
  rationale: λαμβάνω cho phép sắc thái 'nhận', còn 'không cần' có thể đúng với ý văn cảnh nhưng thêm một kết luận diễn giải không được nói trực tiếp trong câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng 'tôi/anh em' để thể hiện lời Chúa Giê-su nói trực tiếp với một nhóm người; 'anh em' là số nhiều theo ὑμεῖς. Không cần chú thích vì không có dị bản hay điểm mơ hồ nào đòi hỏi phải đưa vào bản văn xuất bản.
