base_translation:
  language: en
  yaml_path: translation/nt/john/005/003.yaml
  text: In these lay a multitude of the sick[a], blind, lame, and paralyzed.
translation:
  language: vi
  text: 'Trong các hành lang ấy có rất nhiều người bệnh nằm đó: người mù, người què và người có tay chân teo liệt.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “người có tay chân khô teo.” Từ Hy Lạp theo nghĩa đen là “khô” hoặc “teo,” có lẽ chỉ tay chân bị teo tóp và mất khả năng vận động.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ταύταις
  choice: Trong các hành lang ấy
  rationale: Đại từ chỉ định giống cái số nhiều quy chiếu về các hành lang có mái che ở câu trước. Nêu lại danh từ giúp tiếng Việt tự nhiên và rõ nghĩa, dù danh từ không được lặp lại trong câu Hy Lạp.
- source_word: κατέκειτο
  choice: nằm đó
  rationale: Thì chưa hoàn thành của κατάκειμαι diễn tả trạng thái đang nằm tại nơi ấy; cách nói này tự nhiên trong văn kể chuyện tiếng Việt.
- source_word: πλῆθος
  choice: có rất nhiều
  rationale: Diễn đạt tự nhiên ý nghĩa một số đông mà không khiến người đọc hình dung một đám đông đang tụ họp hay di chuyển.
- source_word: τῶν ἀσθενούντων
  choice: người bệnh
  rationale: Trong ngữ cảnh này, phân từ ἀσθενέω chỉ những người đau yếu về thể chất.
- source_word: τυφλῶν
  choice: người mù
  rationale: Tương đương trực tiếp, rõ ràng và hiện hành của từ chỉ người không nhìn thấy.
- source_word: χωλῶν
  choice: người què
  rationale: χωλός chỉ người bị suy giảm khả năng đi lại; “người què” ngắn gọn và quen thuộc trong văn phong Kinh Thánh tiếng Việt.
- source_word: ξηρῶν
  choice: người có tay chân teo liệt
  rationale: ξηρός theo nghĩa đen là “khô, teo,” và khi nói về cơ thể thường gợi các chi bị teo khiến mất hoặc suy giảm vận động. Cách dịch này giữ được cả hình ảnh “teo” lẫn hệ quả chức năng, thay vì chỉ diễn giải là “bại liệt”.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu dùng phép liệt kê rõ ràng; “các hành lang ấy” làm sáng tỏ sở chỉ từ câu trước. Giữ lại sắc thái cụ thể nhưng còn phần nào không xác định của ξηρῶν bằng “tay chân teo liệt” và chú thích nghĩa đen.
