  text: μὴ θαυμάζετε τοῦτο, ὅτι ἔρχεται ὥρα ἐν ᾗ πάντες οἱ ἐν τοῖς μνημείοις ⸀ἀκούσουσιν τῆς φωνῆς αὐτοῦ
base_translation:
  language: en
  yaml_path: translation/nt/john/005/028.yaml
  text: Do not marvel at this[a], because an hour is coming in which all who are in the tombs will hear his voice
translation:
  language: vi
  text: Đừng ngạc nhiên về điều này, vì sẽ đến giờ khi tất cả những người trong các mộ[a] sẽ nghe tiếng Người.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “các phần mộ” hoặc “các nơi an táng”. Từ Hy Lạp μνημεῖα chỉ những mộ hoặc nơi chôn cất; “các mộ” được chọn để giữ hình ảnh cụ thể.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ θαυμάζετε
  choice: Đừng ngạc nhiên
  rationale: Mệnh lệnh hiện tại đi với μή diễn đạt sự ngăn cấm. “Đừng ngạc nhiên” tự nhiên trong tiếng Việt hiện đại và giữ được ý kinh ngạc của θαυμάζω.
- source_word: τοῦτο
  choice: về điều này
  rationale: Đại từ chỉ định hướng về lời khẳng định ngay trước đó; thêm “về” phù hợp với cách dùng tự nhiên của động từ “ngạc nhiên” trong tiếng Việt.
- source_word: ὅτι
  choice: vì
  rationale: Ở đây ὅτι dẫn vào lý do cho mệnh lệnh, nên dịch theo nghĩa nhân quả.
- source_word: ἔρχεται ὥρα
  choice: giờ đang đến
  rationale: Giữ danh từ “giờ” vì ὥρα có sức nặng đặc trưng trong văn chương Giăng; dạng hiện tại ἔρχεται được thể hiện bằng “đang đến”, không đổi thành một cách nói chung chung như “sẽ có lúc”.
- source_word: ἐν ᾗ
  choice: khi ấy
  rationale: Diễn đạt tự nhiên quan hệ thời gian “trong giờ ấy” mà không làm câu tiếng Việt nặng nề.
- source_word: πάντες οἱ ἐν τοῖς μνημείοις
  choice: tất cả những người ở trong các mộ
  rationale: πάντες οἱ được hiểu theo nghĩa “tất cả những người”; μνημεῖον chỉ nơi chôn cất, nên “mộ” là từ hiện đại, cụ thể và phù hợp ngữ cảnh.
- source_word: ἀκούσουσιν
  choice: sẽ nghe
  rationale: Thể tương lai chủ động được chuyển trực tiếp; “nghe” là nghĩa thích hợp của ἀκούω trong ngữ cảnh này.
- source_word: τῆς φωνῆς αὐτοῦ
  choice: tiếng của Người
  rationale: φωνή ở đây là tiếng nói/tiếng gọi của một nhân vật. “Tiếng của Người” giữ quan hệ sở hữu và dùng đại từ tôn kính theo văn phong Kinh Thánh tiếng Việt.
theological_decisions:
- issue: Hình ảnh phục sinh được hàm ý qua việc những người trong mộ nghe tiếng Người
  choice: Giữ hình ảnh cụ thể “ở trong các mộ” mà không thêm lời giải thích tín lý vào câu.
  alternative: Diễn giải thành “những người đã chết” hoặc nói rõ “sẽ sống lại”.
  rationale: Nguyên văn gợi đến sự phục sinh qua hình ảnh nơi chôn cất, nhưng bản dịch nên bảo toàn cách diễn đạt và sức căng thần học của chính câu văn thay vì giải nghĩa thay cho tác giả.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Giữ “giờ” theo sắc thái văn chương Giăng; tránh lối diễn giải giáo lý. Dấu chân chú [a] được đặt ngay sau “mộ”.
