  naturalness: 'Cụm “vì giờ đang đến, khi ấy” chưa tự nhiên trong tiếng Việt hiện đại: “khi ấy” đứng sau một mệnh đề đã có “giờ” tạo nhịp câu gượng. “Vì sẽ đến giờ khi...” là cách diễn đạt trôi chảy, vẫn giữ được ὥρα và quan hệ thời gian của ἐν ᾗ. “Tiếng Người” tự nhiên và trang trọng hơn “tiếng của Người”.'
  terminology: “Các mộ” là lựa chọn chấp nhận được cho μνημεῖα. Chú thích nên mô tả từ này là các mộ/phần mộ/nơi an táng, thay vì “nơi đặt người chết”, vốn kém chính xác và kém tự nhiên hơn trong ngữ cảnh.
