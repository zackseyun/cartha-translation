id: JHN.5.1
reference: John 5:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Μετὰ ταῦτα ⸀ἦν ἑορτὴ τῶν Ἰουδαίων, καὶ ⸀ἀνέβη Ἰησοῦς εἰς Ἱεροσόλυμα.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/001.yaml
  text: After these things[a], there was a feast of the Jews[b], and Jesus went up to Jerusalem.
translation:
  language: vi
  text: Sau những việc ấy, có một kỳ lễ của người Do Thái[a], và Đức Giê-su đi lên Giê-ru-sa-lem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Trong một số ngữ cảnh khác của sách Giăng, từ Hy Lạp này cũng có thể được hiểu là “người Giu-đê”; tại đây, nó chỉ dân Do Thái trong mối liên hệ với kỳ lễ của họ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: Sau những việc ấy
  rationale: Giữ rõ đại từ số nhiều ταῦτα và công thức chuyển tiếp trong lời kể của Giăng, không làm trơn thành một trạng từ chung chung.
- source_word: ἦν
  choice: có
  rationale: Cách diễn đạt hiện hữu tự nhiên trong tiếng Việt khi giới thiệu một kỳ lễ, đồng thời phản ánh nghĩa của động từ εἰμί.
- source_word: ἑορτὴ
  choice: một kỳ lễ
  rationale: ἑορτή chỉ một dịp lễ hội tôn giáo; “kỳ lễ” vừa trang trọng, dễ hiểu, vừa tránh khiến người đọc nghĩ chủ yếu đến một bữa tiệc.
- source_word: τῶν Ἰουδαίων
  choice: của người Do Thái
  rationale: Trong ngữ cảnh này, sở hữu cách xác định đây là kỳ lễ do dân Do Thái cử hành, chứ không nhấn mạnh căn tính vùng miền Giu-đê.
- source_word: ἀνέβη
  choice: đi lên
  rationale: Giữ sắc thái đi lên Giê-ru-sa-lem, phù hợp cả địa thế lẫn cách nói quen thuộc về hành trình hành hương.
- source_word: Ἱεροσόλυμα
  choice: Giê-ru-sa-lem
  rationale: Dùng dạng tên địa danh quen thuộc trong tiếng Việt.
theological_decisions:
- issue: Phạm vi nghĩa của Ἰουδαίων trong văn chương Giăng
  choice: người Do Thái
  alternative: người Giu-đê
  rationale: Vì từ này bổ nghĩa cho “kỳ lễ”, nó chỉ một lễ nghi của dân Do Thái nói chung hơn là cư dân vùng Giu-đê. Chú thích vẫn ghi nhận khả năng dịch theo vùng miền trong những ngữ cảnh khác của sách Giăng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Sau những việc ấy” có sắc thái hơi sát nguyên ngữ để bảo tồn lối chuyển ý của Giăng; “kỳ lễ” tự nhiên hơn “yến tiệc” và nêu rõ tính chất tôn giáo. Mọi dấu chú thích trong bản văn đều có chú thích tương ứng.
