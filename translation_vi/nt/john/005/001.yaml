  terminology: “Đức Giê-su,” “người Do Thái,” và “Giê-ru-sa-lem” nhất quán với cách dùng Kinh Thánh tiếng Việt. Chú thích xử lý thích đáng khả năng nghĩa “người Giu-đê” của Ἰουδαῖοι trong các ngữ cảnh Johannine khác, đồng thời không áp đặt nghĩa ấy vào câu này.
