  source_fidelity: 'Bản dịch nhìn chung theo sát bản Robinson–Pierpont: thiên sứ đi xuống theo từng dịp, khuấy nước, và người vào đầu tiên sau đó được chữa khỏi bất cứ bệnh nào. Tuy nhiên, “người nào xuống trước tiên” có thể hiểu là bất kỳ người nào xuống trước, thay vì nhấn mạnh rõ ὁ πρῶτος, “người đầu tiên”. Bản sửa làm rõ điểm này và dùng “bước xuống” cho ἐμβὰς.'
  naturalness: 'Câu sửa giữ văn phong hiện đại, trang trọng, đồng thời tự nhiên hơn: “có một thiên sứ thỉnh thoảng xuống hồ nước” đặt trạng ngữ gần động từ; “người đầu tiên bước xuống” rõ và trôi chảy hơn. “Sẽ được lành” diễn đạt kết quả có tính thông lệ trong mệnh đề điều kiện, với sắc thái lặp lại đã được nêu bằng “thỉnh thoảng”.'
