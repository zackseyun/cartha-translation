  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: robinson-pierpont-2005-byzantine
  text: Ἄγγελος γὰρ κατὰ καιρὸν κατέβαινεν ἐν τῇ κολυμβήθρᾳ, καὶ ἐτάρασσεν τὸ ὕδωρ· ὁ οὖν πρῶτος ἐμβὰς μετὰ τὴν ταραχὴν τοῦ ὕδατος, ὑγιὴς ἐγίνετο, ᾧ δήποτε κατείχετο νοσήματι.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/john/005/004.yaml
  text: For an angel would go down into the pool from time to time and stir up the water. Therefore, the first one to step in after the stirring of the water would become well from whatever disease afflicted him.
translation:
  language: vi
  text: Vì có một thiên sứ thỉnh thoảng xuống hồ nước và khuấy động nước. Bởi vậy, người đầu tiên bước xuống sau khi nước bị khuấy động sẽ được lành, bất kể mắc bệnh gì.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Câu này (cùng với nửa sau câu 3) không có trong các bản giấy cói Hy Lạp sớm nhất, như Papyrus 66 và Papyrus 75 thuộc thế kỷ III, cũng như trong các thủ bản quan trọng thuộc thế kỷ IV là Sinaiticus và Vaticanus. Câu này có trong truyền thống đa số Byzantine, cũng như trong các bản dịch La-tinh và Sy-ri cổ. Nhiều học giả cho rằng đây là phần được người sao chép thêm vào từ sớm để giải thích vì sao những người bệnh tụ họp bên hồ nước.
    reason: textual_critical
lexical_decisions:
- source_word: κατὰ καιρὸν
  choice: thỉnh thoảng
  rationale: Cụm này diễn tả sự việc xảy ra theo từng dịp, không nhất thiết theo một lịch trình hay mùa cố định.
- source_word: κατέβαινεν
  choice: có một thiên sứ xuống
  rationale: Thì chưa hoàn thành diễn tả hành động lặp lại theo lệ trong quá khứ; tiếng Việt thể hiện tự nhiên bằng trạng ngữ “thỉnh thoảng” thay vì thêm một trợ từ riêng.
- source_word: ἐτάρασσεν
  choice: khuấy động
  rationale: Diễn đạt trực tiếp việc làm nước chuyển động mạnh mà không thêm cách thức không có trong nguyên văn.
- source_word: ὑγιὴς ἐγίνετο
  choice: được lành
  rationale: Cách nói tự nhiên, trang trọng trong văn cảnh chữa bệnh; thì chưa hoàn thành mang ý nghĩa kết quả thường xảy ra trong mô thức được kể.
- source_word: ᾧ δήποτε κατείχετο νοσήματι
  choice: bất kể mắc bệnh gì
  rationale: Chuyển đạt thành ngữ bị một căn bệnh chế ngự bằng lối nói tiếng Việt tự nhiên, đồng thời giữ sắc thái bao quát của δήποτε.
theological_decisions:
- issue: Tính xác thực văn bản của câu
  choice: Giữ câu trong phần chính vì nguồn được chỉ định là bản Byzantine Robinson–Pierpont 2005, đồng thời ghi chú chứng cứ dị bản.
  alternative: Đưa toàn câu vào chú thích hoặc đặt trong ngoặc vuông theo các bản văn phê bình hiện đại.
  rationale: Bản dịch phải theo nguồn Hy Lạp được cung cấp nhưng cũng cần minh bạch rằng câu này vắng mặt trong các chứng nhân Hy Lạp sớm nhất và thường được xem là phần bổ sung cổ.
- issue: Thiên sứ khuấy nước như một khẳng định của người kể
  choice: Dịch thẳng theo cú pháp của bản nguồn, không thêm các từ như “người ta tin rằng”.
  alternative: Diễn đạt như một niềm tin dân gian hoặc lời giải thích của người chép.
  rationale: Nguyên văn Byzantine trình bày điều này như lời trần thuật; chuyển nó thành lời đồn sẽ diễn giải vượt quá văn bản, dù chú thích nêu vấn đề văn bản học.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “thiên sứ” cho ἄγγελος, “hồ” cho κολυμβήθρα và “được lành” cho sự hồi phục khỏi bệnh. Trạng ngữ “thỉnh thoảng” gánh sắc thái hành động lặp lại của các động từ thì chưa hoàn thành.
