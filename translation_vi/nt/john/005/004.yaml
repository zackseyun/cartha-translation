revisions:
- from: Vì thỉnh thoảng có một thiên sứ xuống hồ và khuấy động nước. Bởi vậy, người nào xuống trước tiên sau khi nước bị khuấy động thì được lành, bất kể mắc bệnh gì.[a]
  to: Vì có một thiên sứ thỉnh thoảng xuống hồ nước và khuấy động nước. Bởi vậy, người đầu tiên bước xuống sau khi nước bị khuấy động sẽ được lành, bất kể mắc bệnh gì.[a]
  rationale: Sửa tối thiểu để biểu đạt rõ “người đầu tiên” (ὁ πρῶτος), dùng “bước xuống” cho hành động đi vào hồ nước, và làm cụ thể hơn thuật ngữ κολυμβήθρα. Chú thích được chuẩn hóa về cách gọi các chứng nhân và vẫn phản ánh rằng câu có trong truyền thống Byzantine nhưng vắng mặt ở các chứng nhân Hy Lạp rất sớm.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T05:37:35Z'
