  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ γὰρ πατὴρ φιλεῖ τὸν υἱὸν καὶ πάντα δείκνυσιν αὐτῷ ἃ αὐτὸς ποιεῖ, καὶ μείζονα τούτων δείξει αὐτῷ ἔργα, ἵνα ὑμεῖς θαυμάζητε.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/020.yaml
  text: For the Father loves the Son and shows him all that he himself is doing; and he will show him greater works than these[a], so that you may marvel.
translation:
  language: vi
  text: Vì Cha yêu Con và cho Con thấy mọi điều chính Ngài đang làm. Ngài cũng sẽ cho Con thấy những công việc lớn hơn các việc này[a], để anh em kinh ngạc.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đến nỗi anh em sẽ kinh ngạc.” Trong tiếng Hy Lạp, ἵνα đi với động từ ở thể giả định có thể diễn tả mục đích và, trong văn cảnh này, cũng có thể hàm ý kết quả là những người nghe Đức Giê-su sẽ kinh ngạc.'
    reason: alternative_reading
lexical_decisions:
- source_word: φιλεῖ
  choice: yêu
  rationale: Diễn đạt tự nhiên mối tương quan yêu thương giữa Cha và Con, không làm nhẹ nghĩa của φιλέω hoặc áp đặt sự phân biệt cứng nhắc với ἀγαπάω trong Giăng.
- source_word: δείκνυσιν ... δείξει
  choice: cho ... thấy ... sẽ cho ... thấy
  rationale: Giữ sự lặp từ của nguyên văn và thể hiện rõ thì hiện tại rồi thì tương lai.
- source_word: πάντα ἃ αὐτὸς ποιεῖ
  choice: mọi điều chính Ngài đang làm
  rationale: “Mọi điều” truyền đạt phạm vi bao quát của πάντα; “chính Ngài” giữ sắc thái nhấn mạnh của αὐτός; “đang làm” phản ánh hành động hiện tại.
- source_word: μείζονα τούτων ... ἔργα
  choice: những công việc lớn hơn những việc này
  rationale: “Công việc” phù hợp cách dùng ἔργον trong Giăng và giữ phép so sánh với những việc vừa được nhắc đến.
- source_word: ἵνα ὑμεῖς θαυμάζητε
  choice: để anh em phải kinh ngạc
  rationale: “Để” giữ cấu trúc mục đích/kết quả của ἵνα; “kinh ngạc” là cách nói hiện đại, tự nhiên cho θαυμάζω. “Anh em” thể hiện ngôi thứ hai số nhiều hướng đến những người đang nghe.
theological_decisions:
- issue: Sắc thái tình yêu của Cha dành cho Con trong φιλεῖ
  choice: Dịch đơn giản là “yêu”.
  alternative: “thương mến” hoặc “có lòng trìu mến với”
  rationale: Trong Giăng, φιλέω có thể chồng lấn nghĩa với ἀγαπάω; bản dịch không nên ngụ ý tình yêu thấp kém hơn hay chỉ thuần túy thuộc tình cảm con người.
- issue: Lực nghĩa của ἵνα ὑμεῖς θαυμάζητε
  choice: “để anh em phải kinh ngạc”
  alternative: “để anh em có thể kinh ngạc” hoặc “đến nỗi anh em sẽ kinh ngạc”
  rationale: Cách dịch chính giữ được khả năng chỉ mục đích và hàm ý kết quả mà không quyết định quá mức. Chú thích nêu rõ cách hiểu thiên về kết quả/dự báo.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Cha” và “Con” theo văn cảnh trực tiếp; “Ngài” chỉ Cha. Dấu chấm tách hai mệnh đề dài để câu tự nhiên hơn trong tiếng Việt.
