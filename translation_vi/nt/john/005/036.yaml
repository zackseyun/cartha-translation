  terminology: “Lời chứng,” “công việc,” “Cha,” “làm chứng,” và “đã sai tôi đến” đều phù hợp với cách dùng Kinh Thánh tiếng Việt hiện đại và không thu hẹp ý nghĩa của các thuật ngữ Gioan. Chú thích được chỉnh để nêu một phương án từ vựng thực sự khác, thay vì lặp lại gần nguyên văn cách dịch chính.
  issues:
