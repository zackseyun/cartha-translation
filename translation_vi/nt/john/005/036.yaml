id: JHN.5.36
reference: John 5:36
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐγὼ δὲ ἔχω τὴν μαρτυρίαν ⸀μείζω τοῦ Ἰωάννου, τὰ γὰρ ἔργα ἃ ⸀δέδωκέν μοι ὁ πατὴρ ἵνα τελειώσω αὐτά, αὐτὰ τὰ ἔργα ⸀ἃ ποιῶ, μαρτυρεῖ περὶ ἐμοῦ ὅτι ὁ πατήρ με ἀπέσταλκεν,
base_translation:
  language: en
  yaml_path: translation/nt/john/005/036.yaml
  text: But I have testimony greater than John's[a], for the works that the Father has given me to complete—these very works that I am doing—testify about me that the Father has sent me.
translation:
  language: vi
  text: Nhưng tôi có lời chứng lớn hơn lời chứng của Giăng[a], vì những công việc Cha đã ban cho tôi để tôi hoàn tất—chính những công việc mà tôi đang làm—làm chứng về tôi rằng Cha đã sai tôi đến.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “sự chứng thực lớn hơn sự chứng thực của Giăng.”'
    reason: Phương án từ vựng khác cho μαρτυρία, có thể chỉ lời chứng hoặc sự chứng thực.
lexical_decisions:
- source_word: μαρτυρίαν
  choice: lời chứng
  rationale: “Lời chứng” diễn đạt tự nhiên ý nghĩa chứng thực, làm bằng chứng trong văn mạch và kết hợp thuận với động từ “có”; đồng thời giữ mối liên hệ với động từ “làm chứng” ở cuối câu.
- source_word: μείζω τοῦ Ἰωάννου
  choice: lớn hơn lời chứng của Giăng
  rationale: 'Dịch rõ phép so sánh hàm ẩn trong tiếng Hy Lạp: lời chứng Chúa Giê-su có lớn hơn lời chứng của Giăng. “Lớn hơn” giữ nguyên mức độ so sánh, không tự ý thu hẹp thành “quan trọng hơn” hay “đáng tin hơn”.'
- source_word: ἔργα
  choice: những công việc
  rationale: “Những công việc” đủ rộng để chỉ toàn bộ hoạt động được Cha giao, kể cả các dấu lạ, mà không giới hạn từ này vào phép lạ בלבד.
- source_word: δέδωκέν μοι
  choice: đã giao cho tôi
  rationale: Trong mạch văn về những công việc phải hoàn tất, “giao cho” diễn đạt tự nhiên việc Cha trao nhiệm vụ cho Chúa Giê-su; “đã” thể hiện hành động đã xảy ra với hiệu lực còn tiếp tục.
- source_word: ὁ πατήρ
  choice: Cha
  rationale: Trong lời trực tiếp của Chúa Giê-su, “Cha” là cách gọi tự nhiên, trang trọng và giữ đúng tước hiệu chỉ Đức Chúa Trời trong quan hệ với Ngài, không thêm đại từ sở hữu không có trong nguyên văn.
- source_word: ἵνα τελειώσω αὐτά
  choice: để hoàn tất
  rationale: “Để” thể hiện mục đích của ἵνα; “hoàn tất” giữ ý đưa các công việc được giao đến chỗ trọn vẹn.
- source_word: αὐτὰ τὰ ἔργα ἃ ποιῶ
  choice: chính những công việc tôi đang làm
  rationale: “Chính” tái hiện sắc thái nhấn mạnh của αὐτά; “đang làm” diễn đạt hoạt động hiện thời của thì hiện tại ποιῶ.
- source_word: μαρτυρεῖ περὶ ἐμοῦ
  choice: làm chứng về tôi
  rationale: Cách diễn đạt rõ ràng, hiện đại, đồng thời giữ sắc thái chứng thực và sự lặp từ có chủ ý với “lời chứng” ở đầu câu.
- source_word: ἀπέσταλκεν
  choice: đã sai tôi đến
  rationale: “Sai … đến” diễn đạt rõ hành động phái đến theo sứ mạng; “đã” nêu hành động đã xảy ra, còn kết quả và thẩm quyền vẫn có hiệu lực.
theological_decisions:
- issue: Phạm vi của những công việc làm chứng cho Chúa Giê-su
  choice: Giữ từ rộng “những công việc” như trong nguyên văn.
  alternative: Dịch hẹp thành “những phép lạ” hoặc “các dấu lạ”.
  rationale: ἔργα không chỉ rõ riêng các phép lạ; câu này trình bày các công việc Cha giao như bằng chứng rằng Cha đã sai Chúa Giê-su đến. Bản dịch không thu hẹp phạm vi thần học của từ.
- issue: Danh xưng ὁ πατήρ
  choice: Dịch là “Cha”.
  alternative: “Đức Chúa Trời” hoặc “Cha tôi”.
  rationale: Nguyên văn dùng danh xưng “Cha”, không dùng “Đức Chúa Trời” và cũng không có đại từ sở hữu. Cách dịch này giữ nguyên quan hệ được văn bản nêu mà không thêm lời.
- issue: Bản chất của lời chứng vượt hơn lời chứng của Giăng
  choice: Nêu rõ các công việc được Cha giao làm chứng rằng Cha đã sai Chúa Giê-su đến.
  alternative: Hiểu các công việc chỉ là sự phô bày quyền năng hoặc chỉ là phép lạ xác nhận thẩm quyền.
  rationale: Chính câu văn xác định nội dung lời chứng là việc Cha đã sai Chúa Giê-su đến; bản dịch giữ lời khẳng định ấy mà không giải thích vượt quá nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Giăng” theo hình thức tên quen thuộc trong Kinh Thánh tiếng Việt. Dấu gạch ngang làm nổi bật cụm nhấn mạnh “chính những công việc tôi đang làm” theo cấu trúc nguyên văn.
