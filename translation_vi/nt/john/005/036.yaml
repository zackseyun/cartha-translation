  to: Nhưng tôi có lời chứng lớn hơn lời chứng của Giăng[a], vì những công việc Cha đã ban cho tôi để tôi hoàn tất—chính những công việc mà tôi đang làm—làm chứng về tôi rằng Cha đã sai tôi đến.
