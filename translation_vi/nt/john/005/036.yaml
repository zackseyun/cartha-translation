  - severity: low
    issue: Chú thích hiện tại không nêu rõ một phương án dịch khác biệt
    rationale: “sự làm chứng lớn hơn sự làm chứng của Giăng” chủ yếu chỉ thay “lời chứng” bằng một cụm ít tự nhiên hơn và lặp lại cách triển khai đã có trong câu chính. “Chứng thực” phản ánh một khả năng từ vựng khác của μαρτυρία rõ hơn.
