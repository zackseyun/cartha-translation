revisions:
- from: Vì như Cha có sự sống trong chính mình[a], thì cũng vậy, Ngài đã ban cho Con có sự sống trong chính mình.[b]
  to: Vì cũng như Cha có sự sống trong chính mình[a], thì Ngài cũng đã ban cho Con được có sự sống trong chính mình.[b]
  rationale: Bản sửa giới hạn ở việc làm tự nhiên cấu trúc tiếng Việt cho mệnh đề có nguyên mẫu, đồng thời chỉnh ghi chú tương ứng. Các yếu tố trọng yếu của nguyên văn—sự so sánh, hành động Cha ban, và sự lặp lại “sự sống trong chính mình”—đều được giữ nguyên.
