language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὥσπερ γὰρ ὁ πατὴρ ἔχει ζωὴν ἐν ἑαυτῷ, οὕτως ⸂καὶ τῷ υἱῷ ἔδωκεν⸃ ζωὴν ἔχειν ἐν ἑαυτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/john/005/026.yaml
  text: For just as the Father has life in himself[b][a], so he also granted the Son to have life in himself.
translation:
  language: vi
  text: Vì cũng như Cha có sự sống trong chính mình[a], thì Ngài cũng đã ban cho Con được có sự sống trong chính mình.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Sự sống trong chính mình” cũng có thể được hiểu là sự sống vốn có trong chính mình. Bản dịch giữ cách nói của tiếng Hy Lạp thay vì dùng thuật ngữ thần học “sự sống tự hữu”.
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “thì Ngài cũng đã cho Con được có sự sống trong chính mình.” Động từ Hy Lạp là từ thông thường có nghĩa là “cho”; “ban” trong bản văn chính là cách diễn đạt trang trọng, tự nhiên cho hành động trao ban trong ngữ cảnh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: Vì như
  rationale: “Vì” thể hiện chức năng giải thích của γάρ, còn “như” mở đầu cấu trúc so sánh tương ứng ὥσπερ… οὕτως.
- source_word: ὁ πατὴρ
  choice: Cha
  rationale: Danh xưng xác định chỉ Đức Chúa Trời trong ngữ cảnh Giăng; tiếng Việt tự nhiên có thể dùng “Cha” không kèm mạo từ.
- source_word: ἔχει ζωὴν
  choice: có sự sống
  rationale: Chuyển tải trực tiếp động từ hiện tại ἔχει và tân ngữ ζωὴν, không diễn giải quá mức thành thuật ngữ thần học.
- source_word: ζωὴν ἐν ἑαυτῷ
  choice: sự sống trong chính mình
  rationale: Giữ rõ giới từ ἐν và đại từ phản thân, đồng thời bảo toàn cách diễn đạt và sức nặng thần học của nguyên văn.
- source_word: οὕτως καὶ
  choice: thì cũng vậy
  rationale: Tái hiện vế tương ứng của cấu trúc “như… thì cũng vậy” và giữ sắc thái của καί.
- source_word: τῷ υἱῷ
  choice: cho Con
  rationale: Dịch cách tặng gián tiếp sau ἔδωκεν; “Con” là danh xưng trong ngữ cảnh.
- source_word: ἔδωκεν
  choice: đã ban
  rationale: “Ban” là cách diễn đạt trang trọng, tự nhiên cho hành động trao ban từ Cha cho Con; “đã” phản ánh động từ aorist mà không áp đặt sắc thái hoàn thành.
- source_word: ζωὴν ἔχειν
  choice: có sự sống
  rationale: Diễn đạt tự nhiên cấu trúc nguyên mẫu bổ sung sau ἔδωκεν.
- source_word: ἐν ἑαυτῷ
  choice: trong chính mình
  rationale: Lặp lại cùng cách dịch để giữ phép song hành chính xác giữa Cha và Con.
theological_decisions:
- issue: Có nên diễn giải ζωὴν ἐν ἑαυτῷ bằng thuật ngữ “sự sống tự hữu” hay không
  choice: Giữ “sự sống trong chính mình”.
  alternative: “sự sống tự hữu” hoặc “tự mình có sự sống”
  rationale: Nguyên văn nói ἐν ἑαυτῷ. Cách dịch sát này giữ nguyên hàm ý thần học mà không thay thế lời Kinh Thánh bằng thuật ngữ hệ thống hoặc thu hẹp nghĩa.
- issue: Cách thể hiện ἔδωκεν trong quan hệ giữa Cha và Con
  choice: Dịch là “đã ban cho”.
  alternative: “đã cho” hoặc diễn giải nhằm làm nhẹ ý trao ban
  rationale: Bản dịch phải giữ lời khẳng định rõ ràng rằng Cha đã ban cho Con có sự sống trong chính mình, đồng thời không thêm lời giải thích nhằm giải quyết căng thẳng thần học của câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc “như… thì cũng vậy” giữ phép song hành của nguyên văn; đại từ “Ngài” làm rõ chủ thể của “đã ban” trong tiếng Việt.
