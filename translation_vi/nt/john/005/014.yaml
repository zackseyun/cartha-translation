    rationale: Nguyên văn chỉ viết ὁ Ἰησοῦς (“Giê-su”), không có κύριος (“Chúa”). Bản dịch nên không thêm danh hiệu vào câu trần thuật này; “Giê-su” cũng là dạng hiện đại chuẩn hơn “Jêsus” cho bản dịch hướng đến tiếng Việt hiện đại.
