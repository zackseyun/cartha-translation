  verdict: revise
  source_fidelity: Bản dịch truyền đạt đúng trình tự, cuộc gặp tại khu đền thờ, tình trạng đã được lành, mệnh lệnh không phạm tội nữa, và lời cảnh báo về một hậu quả tồi tệ hơn. Tuy nhiên, “Đức Chúa Jêsus” thêm tước hiệu “Chúa” không có trong ὁ Ἰησοῦς; nên chỉ dùng tên riêng. “Sau những việc ấy” giữ được số nhiều của μετὰ ταῦτα chính xác hơn “Sau đó”.
  naturalness: Câu văn tự nhiên, trang trọng và dễ hiểu. “Khu đền thờ” là cách nói gọn, hiện đại, vẫn biểu đạt ἱερόν là toàn khu phức hợp đền thờ. Việc nêu rõ “nói với anh” phản ánh αὐτῷ mà không làm câu nặng nề.
  terminology: Dùng “Giê-su” là dạng chính tả hiện đại thông dụng và không thêm danh hiệu vào bản văn. “Đã được lành,” “phạm tội,” và “điều tồi tệ hơn xảy đến với anh” phù hợp ngữ cảnh, giữ được kết quả của thể hoàn thành, mệnh lệnh, và tính không xác định của τι.
  issues:
