id: JHN.5.14
reference: John 5:14
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: μετὰ ταῦτα εὑρίσκει αὐτὸν ὁ Ἰησοῦς ἐν τῷ ἱερῷ καὶ εἶπεν αὐτῷ· Ἴδε ὑγιὴς γέγονας· μηκέτι ἁμάρτανε, ἵνα μὴ χεῖρόν ⸂σοί τι⸃ γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/014.yaml
  text: After these things Jesus found him in the temple and said to him[a], “See, you have become well. Sin no more[c][b], so that something worse may not happen to you.”
translation:
  language: vi
  text: 'Sau những việc ấy, Giê-su gặp người ấy trong khu đền thờ và nói với anh: “Này, anh đã được lành. Đừng phạm tội nữa, kẻo có điều tồi tệ hơn xảy đến với anh.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Lời cảnh báo không nói rõ căn bệnh trước đó có phải do một tội cụ thể gây ra hay không, cũng không xác định “điều tồi tệ hơn” là đau khổ trong đời này, sự phán xét cuối cùng, hay cả hai.
    reason: alternative_reading
lexical_decisions:
- source_word: μετὰ ταῦτα
  choice: Sau đó
  rationale: Diễn đạt tự nhiên trình tự tường thuật của cụm số nhiều “sau những việc ấy”; sắc thái sát chữ được ghi ở chú thích.
- source_word: εὑρίσκει
  choice: gặp
  rationale: Thì hiện tại lịch sử Hy Lạp được chuyển sang lối kể quá khứ tự nhiên trong tiếng Việt; trong ngữ cảnh này, “gặp” tự nhiên hơn “tìm thấy” và không nhất thiết hàm ý một cuộc tìm kiếm.
- source_word: ἐν τῷ ἱερῷ
  choice: trong khuôn viên đền thờ
  rationale: ἱερόν chỉ toàn bộ khu đền thờ, không riêng nơi thánh bên trong; cách dịch này làm rõ phạm vi mà không đồng nhất với ναός.
- source_word: Ἴδε
  choice: Này
  rationale: Giữ chức năng thu hút sự chú ý của lời nói trực tiếp bằng cách diễn đạt trang trọng nhưng hiện đại.
- source_word: ὑγιὴς γέγονας
  choice: anh đã được lành
  rationale: Thể hoàn thành nhấn mạnh sự thay đổi đã xảy ra cùng tình trạng lành mạnh hiện tại. Dạng bị động tiếng Việt phù hợp ngữ cảnh chữa lành nhưng không nêu tác nhân trong chính mệnh đề.
- source_word: μηκέτι ἁμάρτανε
  choice: Đừng phạm tội nữa
  rationale: Giữ mệnh lệnh chấm dứt hành vi từ nay, nhưng không diễn giải quá mức thể hiện tại như thể bản văn nhất thiết nói đến việc liên tục phạm tội.
- source_word: ἵνα μὴ χεῖρόν σοί τι γένηται
  choice: kẻo có điều tồi tệ hơn xảy đến với anh
  rationale: “Kẻo” diễn đạt gọn và tự nhiên ý cảnh báo của ἵνα μή; “điều tồi tệ hơn” giữ tính bất định của τι và không xác định bản chất hậu quả.
theological_decisions:
- issue: Mối liên hệ giữa tội lỗi và đau khổ trong lời cảnh báo
  choice: Dịch thẳng lời cấm phạm tội và lời cảnh báo về một điều tồi tệ hơn, không khẳng định căn bệnh trước đó do một tội cụ thể gây ra và không xác định hậu quả ấy là đời này hay phán xét cuối cùng.
  alternative: Hiểu bệnh trước là hình phạt trực tiếp cho một tội cụ thể, hoặc giới hạn “điều tồi tệ hơn” vào đau khổ đời này hay sự phán xét cuối cùng.
  rationale: Bản Hy Lạp liên kết việc tiếp tục phạm tội với nguy cơ có điều tồi tệ hơn, nhưng không giải thích rõ nguyên nhân căn bệnh trước đó hoặc bản chất chính xác của hậu quả; bản dịch cần giữ nguyên độ mở thần học này.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Jêsus” theo lối gọi tôn kính quen thuộc; “anh” phù hợp lời nói với một người đàn ông trưởng thành. “Khuôn viên đền thờ” phân biệt ἱερόν với nơi thánh bên trong. Dấu chú thích [a] được đặt ngay sau toàn bộ lời cảnh báo mà nó giải thích.
