source:
  edition: SBLGNT
  text: καὶ διὰ τοῦτο ἐδίωκον ⸂οἱ Ἰουδαῖοι τὸν Ἰησοῦν⸃ ὅτι ταῦτα ἐποίει ἐν σαββάτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/016.yaml
  text: And because of this the Jews were persecuting Jesus[a], because he was doing these things on the Sabbath.
translation:
  language: vi
  text: Vì việc đó, người Do Thái bắt bớ Chúa Giê-su[a], vì Người làm những việc ấy vào ngày Sa-bát.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “người Giu-đê” hoặc, tùy ngữ cảnh, “các nhà lãnh đạo Do Thái”. Trong sách Giăng, cách gọi này thường có thể chỉ một nhóm cụ thể chống đối Chúa Giê-su, chứ không phải tất cả người Do Thái không phân biệt.
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Vì vậy
  rationale: Cụm từ chỉ nguyên nhân, quy chiếu về sự việc vừa xảy ra; “Vì vậy” diễn đạt tự nhiên cả quan hệ nguyên nhân lẫn kết quả trong tiếng Việt.
- source_word: ἐδίωκον
  choice: bắt bớ
  rationale: Thì vị hoàn biểu thị hành động đang tiếp diễn hoặc lặp lại; “bắt bớ” thể hiện sự chống đối có tính thù nghịch mà chưa đưa ý định giết của câu 18 vào câu này.
- source_word: οἱ Ἰουδαῖοι
  choice: người Do Thái
  rationale: Giữ cách dịch trực tiếp của danh xưng số nhiều trong bản Hy Lạp, không thu hẹp ngay thành “các lãnh đạo Do Thái”; chú thích nêu rõ phạm vi quy chiếu có thể hẹp hơn theo ngữ cảnh.
- source_word: ταῦτα
  choice: những việc ấy
  rationale: Giữ số nhiều của đại từ chỉ định và quy chiếu tự nhiên về các hành động vừa được thuật lại.
- source_word: ἐποίει
  choice: làm
  rationale: Trong kết cấu “bởi Ngài làm…”, tiếng Việt không cần hình thái riêng để biểu đạt vị hoàn; ngữ cảnh cùng động từ “bắt bớ” cho thấy đây là căn cứ của sự chống đối đang diễn ra.
- source_word: ἐν σαββάτῳ
  choice: trong ngày Sa-bát
  rationale: Diễn đạt tự nhiên thời điểm hành động xảy ra, đồng thời giữ danh xưng ngày Sa-bát.
theological_decisions:
- issue: Phạm vi quy chiếu và cách dịch οἱ Ἰουδαῖοι trong sách Giăng
  choice: người Do Thái
  alternative: các lãnh đạo Do Thái; người Giu-đê
  rationale: 'Bản văn chính giữ nghĩa từ vựng trực tiếp thay vì quyết định trước rằng đối tượng chỉ là giới lãnh đạo. Chú thích bảo tồn sắc thái ngữ cảnh: trong sách Giăng, cách gọi này thường có thể chỉ một nhóm cụ thể chống đối Đức Chúa Jêsus, chứ không phải mọi người Do Thái không phân biệt.'
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Jêsus” và “Ngài” theo lối Kinh Thánh Việt ngữ quen thuộc; giữ “Sa-bát” để phản ánh thuật ngữ tôn giáo-lịch sử. Dấu chú thích [a] xuất hiện ngay sau danh ngữ liên quan.
