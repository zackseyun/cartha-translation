  text: εἰ δὲ τοῖς ἐκείνου γράμμασιν οὐ πιστεύετε, πῶς τοῖς ἐμοῖς ῥήμασιν πιστεύσετε;
base_translation:
  language: en
  yaml_path: translation/nt/john/005/047.yaml
  text: But if you do not believe his writings[a], how will you believe my words?
translation:
  language: vi
  text: Nhưng nếu các ông không tin những điều người ấy đã viết[a], thì làm sao các ông sẽ tin lời tôi?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “các thư của người ấy.” Từ Hy Lạp có thể chỉ thư hoặc văn bản/tác phẩm viết; ở đây nói đến những điều Môi-se đã viết.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ
  choice: Nhưng nếu
  rationale: Diễn đạt điều kiện εἰ cùng sắc thái tương phản của δέ một cách tự nhiên trong tiếng Việt.
- source_word: τοῖς ἐκείνου γράμμασιν
  choice: những điều ông ấy đã viết
  rationale: γράμμασιν có thể chỉ chữ viết hoặc văn bản; trong ngữ cảnh này, cụm từ nói đến những gì Môi-se đã viết. Cách diễn đạt này tự nhiên và không đặc định quá mức thành “Kinh Thánh”.
- source_word: οὐ πιστεύετε
  choice: các ông không tin
  rationale: πιστεύω với bổ ngữ cách cho ở đây mang nghĩa tin, chấp nhận điều được viết là đáng tin và chân thật.
- source_word: πῶς ... πιστεύσετε
  choice: thì làm sao các ông sẽ tin
  rationale: Giữ câu hỏi tu từ và hướng tương lai của πιστεύσετε, thay vì diễn giải thành sự bất khả bằng “làm sao có thể”.
- source_word: τοῖς ἐμοῖς ῥήμασιν
  choice: lời tôi
  rationale: ῥήμασιν chỉ những lời được nói; “lời tôi” tự nhiên, trang trọng và duy trì sự đối chiếu với điều Môi-se đã viết.
theological_decisions:
- issue: Đối tượng mà ἐκείνου chỉ đến
  choice: “ông ấy” chỉ Môi-se trong ngữ cảnh trực tiếp
  alternative: Lặp lại rõ tên “Môi-se” trong câu
  rationale: Giăng 5:45–46 đã nêu đích danh Môi-se. Giữ đại từ bảo toàn tính liên kết và cách diễn đạt của nguyên văn mà vẫn rõ trong ngữ cảnh.
- issue: Sắc thái của πιστεύω
  choice: Dịch nhất quán là “tin”
  alternative: Dịch là “tin cậy”
  rationale: Ở đây trọng tâm là tin những điều Môi-se viết và lời Đức Chúa Jêsus; “tin” phù hợp cho cả hai vế và giữ phép song song.
- issue: Lực của thì tương lai trong πιστεύσετε
  choice: Giữ “sẽ tin”
  alternative: Dịch diễn giải là “có thể tin”
  rationale: “Sẽ tin” phản ánh trực tiếp thì tương lai và không âm thầm chuyển câu hỏi về diễn tiến thành một khẳng định rõ rệt về khả năng.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “các ông” để phản ánh số nhiều của động từ và đối tượng được Đức Chúa Jêsus trực tiếp chất vấn; dùng “ông ấy” cho Môi-se theo mạch văn. Duy trì sự đối chiếu giữa những điều Môi-se viết và lời Đức Chúa Jêsus.
