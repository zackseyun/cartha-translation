  text: Ἐὰν ἐγὼ μαρτυρῶ περὶ ἐμαυτοῦ, ἡ μαρτυρία μου οὐκ ἔστιν ἀληθής·
base_translation:
  language: en
  yaml_path: translation/nt/john/005/031.yaml
  text: If I testify about myself[a], my testimony is not true.
translation:
  language: vi
  text: Nếu chính tôi làm chứng về mình, thì lời chứng của tôi không thật[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “không có giá trị”, theo bối cảnh pháp lý về lời chứng.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐὰν
  choice: Nếu
  rationale: Diễn đạt tự nhiên mệnh đề điều kiện, không thêm sắc thái lặp lại như “mỗi khi”.
- source_word: ἐγὼ
  choice: chính tôi
  rationale: Đại từ Hy Lạp được nêu rõ và có sắc thái nhấn nhẹ; “chính tôi” thể hiện sự nhấn mạnh ấy trong tiếng Việt.
- source_word: μαρτυρῶ
  choice: làm chứng
  rationale: Cách nói tự nhiên, trang trọng vừa phải, đồng thời giữ được sắc thái chứng nhân và pháp lý của động từ.
- source_word: περὶ ἐμαυτοῦ
  choice: về mình
  rationale: Chuyển tải trực tiếp nghĩa “về/ch concerning chính mình” mà không thu hẹp thành “để bênh vực mình”.
- source_word: ἡ μαρτυρία μου
  choice: lời chứng của tôi
  rationale: Giữ quan hệ từ nguyên với “làm chứng” và phù hợp với ngữ cảnh chứng cứ hơn cách nói “nhân chứng của tôi”.
- source_word: οὐκ ἔστιν ἀληθής
  choice: không thật
  rationale: Phản ánh trực tiếp ἀληθής và bảo toàn sự căng thẳng với Giăng 8:14, thay vì mặc nhiên giải thích câu chỉ theo hiệu lực pháp lý.
theological_decisions:
- issue: Ý nghĩa lời Đức Chúa Jesus nói rằng lời chứng của Ngài “không thật”
  choice: Giữ cách diễn đạt trực tiếp “không thật”.
  alternative: “không có giá trị” hoặc “không được công nhận là hợp lệ”
  rationale: ἀληθής mang nghĩa “thật/chân thật”; bản dịch chính không nên âm thầm giải quyết sự căng thẳng thần học bằng cách giới hạn nghĩa vào thủ tục pháp lý. Tuy vậy, bối cảnh về lời chứng cho phép ghi nhận sắc thái hiệu lực pháp lý trong chú thích.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “làm chứng/lời chứng” để giữ sự lặp từ của nguyên văn; “chính tôi” thể hiện đại từ chủ ngữ được nhấn mạnh trong tiếng Hy Lạp.
