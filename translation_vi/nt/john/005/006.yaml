  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τοῦτον ἰδὼν ὁ Ἰησοῦς κατακείμενον, καὶ γνοὺς ὅτι πολὺν ἤδη χρόνον ἔχει, λέγει αὐτῷ· Θέλεις ὑγιὴς γενέσθαι;
base_translation:
  language: en
  yaml_path: translation/nt/john/005/006.yaml
  text: When Jesus saw this man lying there[a], and knew that he had already been there a long time, he said to him, “Do you want to become well?”
translation:
  language: vi
  text: 'Khi Đức Giê-su thấy người này đang nằm đó và biết ông đã ở trong tình trạng ấy từ lâu[a], Ngài hỏi ông: “Ông có muốn được lành không?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể hiểu: “ông đã nằm ở đó từ lâu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτον
  choice: người này
  rationale: Đại từ chỉ định hướng đến người bệnh cụ thể trong văn cảnh; “người này” vừa rõ nghĩa vừa tự nhiên trong tiếng Việt.
- source_word: ἰδὼν
  choice: Khi thấy
  rationale: Phân từ bất định diễn tả hành động đi trước động từ chính; mệnh đề thời gian truyền đạt trình tự tự nhiên.
- source_word: κατακείμενον
  choice: đang nằm đó
  rationale: Diễn tả tư thế nằm của người bệnh trong khung cảnh tại hồ, đồng thời giữ sắc thái địa điểm.
- source_word: γνοὺς
  choice: biết
  rationale: Truyền đạt sự nhận biết của Đức Chúa Jêsus mà không xác định Ngài biết bằng cách nào.
- source_word: πολὺν ἤδη χρόνον ἔχει
  choice: đã ở trong tình trạng ấy từ lâu
  rationale: Cụm Hy Lạp lược bỏ đối tượng của ἔχει và có thể nói đến tình trạng kéo dài; cách dịch này tự nhiên, phù hợp văn cảnh và không khẳng định ông đã nằm tại chính địa điểm đó suốt thời gian ấy.
- source_word: λέγει αὐτῷ
  choice: hỏi ông
  rationale: Dù nguyên văn là “nói với ông”, nội dung trực tiếp là một câu hỏi; “hỏi ông” tự nhiên trong lời kể tiếng Việt. Hiện tại lịch sử được chuyển thành thì kể chuyện theo văn phong tiếng Việt.
- source_word: Θέλεις
  choice: có muốn
  rationale: Diễn đạt trực tiếp ý muốn hoặc ước muốn bằng ngôn ngữ hiện đại, thông dụng.
- source_word: ὑγιὴς γενέσθαι
  choice: được lành
  rationale: Trong văn cảnh chữa lành, “được lành” diễn tả việc bước vào tình trạng khỏe mạnh; thể bị động trong tiếng Việt là cách nói tự nhiên, không nhằm xác định tác nhân trong chính câu hỏi.
theological_decisions:
- issue: Bản chất sự biết của Đức Chúa Jêsus trong γνοὺς
  choice: Chỉ nói Ngài “biết”, không xác định nguồn của sự biết ấy.
  alternative: Ngài biết bằng năng lực siêu nhiên; hoặc biết qua quan sát hay lời người khác.
  rationale: Nguyên văn không nói Đức Chúa Jêsus biết bằng cách nào, vì vậy bản dịch giữ sự dè dặt của văn bản.
- issue: Phạm vi thời gian trong πολὺν ἤδη χρόνον ἔχει
  choice: Hiểu là người ấy đã ở trong tình trạng đó từ lâu, đồng thời ghi chú khả năng nói đến việc nằm ở đó lâu.
  alternative: Ông đã nằm/ở tại địa điểm ấy từ lâu.
  rationale: Cấu trúc Hy Lạp có đối tượng được hiểu ngầm và hơi mơ hồ; văn cảnh rộng nhấn mạnh thời gian bệnh tật, nhưng văn cảnh gần cũng cho phép liên hệ với việc ông nằm tại đó.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Jêsus” theo lối gọi Tin Lành Việt ngữ quen thuộc; đại từ “ông” thể hiện sự tôn trọng tự nhiên. Câu hỏi ngắn gọn, trực tiếp, giữ sắc thái của nguyên văn.
