  text: δόξαν παρὰ ἀνθρώπων οὐ λαμβάνω,
base_translation:
  language: en
  yaml_path: translation/nt/john/005/041.yaml
  text: I do not receive glory from men[b][a],
translation:
  language: vi
  text: Tôi không nhận vinh quang từ loài người.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Vinh quang» ở đây cũng có thể hiểu là «sự tôn trọng», «lời ca ngợi» hoặc «sự trọng vọng».
    reason: lexical_alternative
lexical_decisions:
- source_word: δόξαν
  choice: vinh quang
  rationale: Giữ mối liên hệ từ vựng với chủ đề «vinh quang» trong Phúc Âm Giăng; trong ngữ cảnh này, từ này cũng bao hàm sự tôn trọng, ca ngợi hoặc trọng vọng do người khác dành cho.
- source_word: παρὰ ἀνθρώπων
  choice: từ loài người
  rationale: παρά với sở hữu cách chỉ nguồn gốc; ἀνθρώπων ở đây có nghĩa khái quát là con người, đối lập với Đức Chúa Trời, chứ không nhất thiết chỉ nam giới.
- source_word: οὐ λαμβάνω
  choice: Tôi không nhận
  rationale: Dịch trực tiếp thể hiện tại của λαμβάνω bằng cách nói tự nhiên trong tiếng Việt, đồng thời không thêm ý «tìm kiếm» vốn không có trong câu Hy Lạp.
theological_decisions:
- issue: Bản chất lời tuyên bố của Đức Chúa Jêsus về sự công nhận của con người
  choice: Giữ nguyên lời phủ định rằng Ngài không nhận vinh quang từ loài người
  alternative: Diễn giải rằng Ngài không tìm kiếm hoặc không lệ thuộc vào sự tán dương của con người
  rationale: Ngữ cảnh gợi đến nguồn xác nhận sứ mạng và thân phận của Ngài, nhưng bản dịch không thêm «tìm kiếm» hay «lệ thuộc», nhờ đó bảo toàn độ căng và phạm vi có thể hiểu của nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. «Loài người» diễn đạt nghĩa khái quát của ἀνθρώπων, tránh khiến độc giả hiểu câu này chỉ nói đến nam giới; dấu chấm được đặt trước ký hiệu chú thích theo quy ước trình bày.
