revisions:
- from: Vì vậy, người Do Thái[a] lại càng tìm cách giết Đức Giê-su, bởi Ngài không những vi phạm ngày Sa-bát mà còn gọi Đức Chúa Trời là Cha riêng của mình, tự đặt mình ngang hàng với Đức Chúa Trời.[b]
  to: Vì lẽ đó, người Do Thái[a] lại càng tìm cách giết Đức Giê-su, bởi Ngài không những vi phạm ngày Sa-bát mà còn gọi Đức Chúa Trời là Cha của chính mình, tự đặt mình ngang hàng với Đức Chúa Trời.[b]
  rationale: Chỉ sửa cụm từ có nguy cơ gây hiểu lầm trong tiếng Việt. “Cha của chính mình” phản ánh ἴδιον (“riêng/chính mình”) rõ hơn “Cha riêng,” đồng thời vẫn giữ sức nặng của mệnh đề tiếp theo về việc tự đặt mình ngang hàng với Đức Chúa Trời. Các yếu tố khác của bản dịch được giữ nguyên vì phù hợp nguyên ngữ và văn phong hiện đại.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T05:37:43Z'
