  terminology: “Đức Giê-su,” “Đức Chúa Trời,” “ngày Sa-bát,” và “người Do Thái” được dùng nhất quán. Giữ “người Do Thái” trong chính văn là sát nguyên ngữ; chú thích giúp ngăn việc khái quát hóa sai phạm vi chỉ định trong văn mạch Giăng.
  issues:
