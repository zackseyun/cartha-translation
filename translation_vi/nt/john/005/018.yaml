  source_fidelity: Bản dịch chuyển tải đúng mạch suy luận, sắc thái tăng tiến của μᾶλλον, hành động đang tiếp diễn của ἐζήτουν, và nội dung của hai cáo buộc. Tuy nhiên, “Cha riêng của mình” trong tiếng Việt hiện đại dễ bị hiểu là “cha riêng” theo nghĩa gia đình (cha kế/cha không chung), không diễn đạt an toàn ý πατέρα ἴδιον là “Cha của chính mình/Cha riêng theo nghĩa đặc thù.”
