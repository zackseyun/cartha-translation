id: JHN.5.18
reference: John 5:18
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: διὰ τοῦτο οὖν μᾶλλον ἐζήτουν αὐτὸν οἱ Ἰουδαῖοι ἀποκτεῖναι ὅτι οὐ μόνον ἔλυε τὸ σάββατον, ἀλλὰ καὶ πατέρα ἴδιον ἔλεγε τὸν θεόν, ἴσον ἑαυτὸν ποιῶν τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/018.yaml
  text: For this reason[a], therefore, the Jews were seeking all the more to kill him, because he was not only breaking the Sabbath, but was also calling God his own Father[b], making himself equal with God.
translation:
  language: vi
  text: Vì lẽ đó, người Do Thái[a] lại càng tìm cách giết Đức Giê-su, bởi Ngài không những vi phạm ngày Sa-bát mà còn gọi Đức Chúa Trời là Cha của chính mình, tự đặt mình ngang hàng với Đức Chúa Trời.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Trong sách Giăng, cụm từ “người Do Thái” thường chỉ cụ thể hơn những người Do Thái chống đối Đức Giê-su tại Giu-đê hoặc một số nhà chức trách Do Thái trong văn cảnh, chứ không phải mọi người Do Thái không phân biệt.
    reason: cultural_note
  - marker: b
    text: 'Cũng có thể dịch: “tự làm mình bình đẳng với Đức Chúa Trời.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο οὖν
  choice: Vì vậy
  rationale: Tiếng Việt tự nhiên dùng một liên từ kết quả để chuyển tải sức suy luận cộng dồn của cụm Hy Lạp; dịch tách thành hai từ nối sẽ nặng và thừa.
- source_word: μᾶλλον
  choice: lại càng
  rationale: Diễn đạt rõ sắc thái gia tăng so với ý định đã có trước đó.
- source_word: ἐζήτουν ... ἀποκτεῖναι
  choice: tìm cách giết
  rationale: Diễn tả nỗ lực hoặc ý định đang tiếp diễn của thì chưa hoàn thành, đồng thời giữ nguyên sức mạnh của ἀποκτεῖναι.
- source_word: οἱ Ἰουδαῖοι
  choice: người Do Thái
  rationale: Giữ cách gọi trực tiếp của bản Hy Lạp; chú thích làm rõ rằng trong văn cảnh Giăng, từ này không nhất thiết chỉ toàn thể dân Do Thái.
- source_word: ἔλυε τὸ σάββατον
  choice: vi phạm ngày Sa-bát
  rationale: λύω ở đây mang nghĩa phá bỏ hoặc vi phạm quy định về ngày Sa-bát; 'vi phạm' tự nhiên và tránh khiến lời buộc tội bị hiểu như lời trần thuật trung tính về hành động 'bẻ gãy'.
- source_word: πατέρα ἴδιον ἔλεγε τὸν θεόν
  choice: gọi Đức Chúa Trời là Cha riêng của mình
  rationale: Giữ động từ 'gọi' và nhấn mạnh ἴδιον, tức mối quan hệ làm Cha thuộc về chính Ngài theo một nghĩa đặc thù.
- source_word: ἴσον ἑαυτὸν ποιῶν τῷ θεῷ
  choice: tự đặt mình ngang hàng với Đức Chúa Trời
  rationale: Chuyển tải tự nhiên cấu trúc 'làm cho chính mình bằng với Đức Chúa Trời'; chú thích cung cấp cách dịch sát cấu trúc hơn.
theological_decisions:
- issue: Sức nặng Cơ Đốc luận của mệnh đề về sự bình đẳng với Đức Chúa Trời
  choice: tự đặt mình ngang hàng với Đức Chúa Trời
  alternative: làm cho mình bình đẳng với Đức Chúa Trời
  rationale: Không làm nhẹ tuyên bố về sự bình đẳng, nhưng cũng không đưa thuật ngữ tín điều hậu kỳ vào câu.
- issue: Phạm vi chỉ định của οἱ Ἰουδαῖοι trong sách Giăng
  choice: giữ 'người Do Thái' trong chính văn và giải thích bằng chú thích
  alternative: các nhà lãnh đạo Do Thái; người Giu-đê
  rationale: Giữ dữ liệu từ vựng của nguồn Hy Lạp, đồng thời ngăn cách hiểu quy chụp cho mọi người Do Thái trong mọi thời.
- issue: Góc nhìn của lời cáo buộc về ngày Sa-bát
  choice: vi phạm ngày Sa-bát
  alternative: phá bỏ ngày Sa-bát
  rationale: Câu nêu lý do những người chống đối muốn giết Đức Giê-su; bản dịch giữ nội dung lời cáo buộc mà không mở rộng để quyết định toàn bộ vấn đề thần học về ngày Sa-bát.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Giê-su” và “Đức Chúa Trời” theo lối gọi phổ biến trong tiếng Việt Cơ Đốc; câu giữ nhịp lập luận nguyên nhân–kết quả của bản Hy Lạp và tránh thu hẹp các điểm còn cần chú giải.
