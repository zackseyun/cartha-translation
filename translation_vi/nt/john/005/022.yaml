  text: οὐδὲ γὰρ ὁ πατὴρ κρίνει οὐδένα, ἀλλὰ τὴν κρίσιν πᾶσαν δέδωκεν τῷ υἱῷ,
base_translation:
  language: en
  yaml_path: translation/nt/john/005/022.yaml
  text: For the Father judges no one, but has given all judgment to the Son,
translation:
  language: vi
  text: Vì Cha không xét xử một ai, nhưng đã giao toàn bộ việc xét xử cho Con.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐδὲ γὰρ
  choice: Vì ... không
  rationale: γάρ nêu lý do giải thích cho ngữ cảnh trước; trong tiếng Việt, “Vì” diễn đạt tự nhiên chức năng ấy, còn sắc thái phủ định của οὐδέ được thể hiện trong “không ... một ai”.
- source_word: ὁ πατὴρ
  choice: Cha
  rationale: Trong văn mạch Giăng, đây là danh xưng chỉ Đức Chúa Trời trong tương quan với Con; “Cha” vừa tự nhiên vừa giữ tính danh xưng.
- source_word: κρίνει
  choice: xét xử
  rationale: Động từ ở thì hiện tại nêu một thực tại khái quát. “Xét xử” giữ nghĩa tư pháp mà không thu hẹp thành “kết án”, đồng thời liên kết rõ với κρίσιν.
- source_word: οὐδένα
  choice: không ... một ai
  rationale: Cách diễn đạt này truyền đạt trọn vẹn sự phủ định bao quát và phù hợp với văn phong trang trọng, hiện đại.
- source_word: ἀλλὰ
  choice: nhưng
  rationale: Thể hiện sự tương phản mạnh giữa việc Cha không xét xử ai và việc giao quyền xét xử cho Con.
- source_word: τὴν κρίσιν πᾶσαν
  choice: toàn quyền xét xử
  rationale: Trong tiếng Việt, “toàn quyền xét xử” diễn đạt tự nhiên toàn bộ chức năng xét xử được giao cho Con. Dù “quyền” không phải một danh từ riêng trong tiếng Hy Lạp, cách nói này tránh lối dịch gượng “toàn bộ sự xét xử” và phù hợp với ngữ cảnh hành động giao cho.
- source_word: δέδωκεν
  choice: đã giao
  rationale: Thì hoàn thành chỉ hành động đã được thực hiện với kết quả còn hiệu lực. “Đã giao” truyền đạt việc chuyển giao có hiệu lực lâu dài; tự nhiên hơn “đã ban” khi đi với chức năng xét xử.
- source_word: τῷ υἱῷ
  choice: cho Con
  rationale: Giữ nguyên danh xưng “Con” và không thêm đại từ sở hữu vốn không có trong nguyên văn.
theological_decisions:
- issue: Mối quan hệ giữa sự xét xử của Cha và sự xét xử của Con
  choice: Giữ nguyên lời khẳng định trực tiếp rằng Cha không xét xử một ai nhưng đã giao toàn quyền xét xử cho Con.
  alternative: Diễn giải rằng Cha không xét xử ai một cách độc lập với Con, hoặc giới hạn câu này vào sự phán xét chung cuộc.
  rationale: Nguyên văn không có các từ hạn định ấy; bản dịch giữ nguyên sức căng thần học thay vì âm thầm giải hòa hoặc thu hẹp phát biểu.
- issue: Danh xưng Kitô học “Con”
  choice: Dùng “Con” như một danh xưng.
  alternative: Dịch là “con của Ngài”.
  rationale: Nguyên văn có mạo từ nhưng không có đại từ sở hữu; “Con” bảo toàn danh xưng có trọng lượng trong văn mạch Giăng và tương quan Cha–Con.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Câu giữ cấu trúc giải thích và tương phản của nguyên văn. Không cần chú thích vì không có dị bản hay sự mơ hồ nào cần ghi ngay tại câu này.
