  source_fidelity: Bản dịch phản ánh đúng mệnh đề mục đích ἵνα, tính bao quát của πάντες, sự so sánh mạnh καθὼς, và sự lặp lại của τιμάω. Tuy nhiên, từ “cũng” trong “thì cũng không tôn kính Cha” không có yếu tố tương ứng trong câu Hy Lạp δεύτερο; nên bỏ để giữ đúng phép phủ định song song. Cụm “sai Con đến” thêm hướng chuyển động không được nêu rõ trong πέμψαντα αὐτόν; “đã sai Con” truyền đạt đầy đủ và chính xác hơn.
  naturalness: “Để mọi người tôn kính Con cũng như tôn kính Cha” tự nhiên, trang trọng và rõ nghĩa trong tiếng Việt hiện đại. Câu sau mạch lạc hơn khi dùng “thì không tôn kính Cha, Đấng đã sai Con.”
