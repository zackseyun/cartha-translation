id: JHN.5.23
reference: John 5:23
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἵνα πάντες τιμῶσι τὸν υἱὸν καθὼς τιμῶσι τὸν πατέρα. ὁ μὴ τιμῶν τὸν υἱὸν οὐ τιμᾷ τὸν πατέρα τὸν πέμψαντα αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/023.yaml
  text: so that all may honor the Son just as they honor the Father. The one who does not honor the Son does not honor the Father who sent him.
translation:
  language: vi
  text: để mọi người tôn kính Con cũng như tôn kính Cha. Ai không tôn kính Con thì không tôn kính Cha, Đấng đã sai Con.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἵνα
  choice: để
  rationale: Giữ lực chỉ mục đích hoặc kết quả của liên từ Hy Lạp, đồng thời tự nhiên trong tiếng Việt.
- source_word: πάντες
  choice: mọi người
  rationale: Diễn đạt rõ nghĩa chỉ toàn thể con người của dạng số nhiều, tự nhiên hơn cách dùng riêng từ “tất cả” tại đây.
- source_word: τιμῶσι / τιμῶν / τιμᾷ
  choice: tôn kính
  rationale: Giữ nhất quán động từ được lặp lại và diễn tả sự nhìn nhận, dành sự kính trọng xứng đáng; “tôn kính” phù hợp với đối tượng là Con và Cha.
- source_word: τὸν υἱὸν
  choice: Con
  rationale: Trong ngữ cảnh, đây là danh xưng chỉ Chúa Giê-su; viết hoa theo quy ước tiếng Việt đối với danh xưng thần học.
- source_word: καθὼς
  choice: cũng như
  rationale: Diễn đạt sự tương ứng mạnh giữa việc tôn kính Con và việc tôn kính Cha mà không thêm thuật ngữ thần học ngoài bản văn.
- source_word: τὸν πατέρα
  choice: Cha
  rationale: Đây là danh xưng chỉ Đức Chúa Trời trong ngữ cảnh; lược mạo từ là tự nhiên trong tiếng Việt.
- source_word: ὁ μὴ τιμῶν
  choice: Ai không tôn kính
  rationale: Chuyển phân từ có mạo từ mang nghĩa khái quát thành cấu trúc “Ai…” tự nhiên, súc tích trong tiếng Việt.
- source_word: τὸν πέμψαντα αὐτόν
  choice: Đấng đã sai Con đến
  rationale: Dùng mệnh đề đồng vị để chỉ rõ Cha là Đấng sai phái. Lặp lại “Con” thay cho đại từ giúp tránh sự mơ hồ về đối tượng của “sai” trong tiếng Việt; “đến” làm câu tự nhiên mà không thay đổi ý niệm sai phái.
theological_decisions:
- issue: Mức độ so sánh giữa việc tôn kính Con và tôn kính Cha
  choice: “cũng như”
  alternative: “như” hoặc “theo cách tôn kính”
  rationale: “Cũng như” bảo toàn sự tương ứng rõ rệt do καθὼς biểu thị, không làm nhẹ tuyên bố nhưng cũng không đưa thuật ngữ tín điều hậu kỳ vào câu.
- issue: Cách thể hiện các danh xưng Con và Cha
  choice: Viết hoa “Con” và “Cha”
  alternative: Viết thường “con” và “cha”
  rationale: Chữ Hy Lạp không tự quyết định cách viết hoa hiện đại, nhưng ngữ cảnh xác định đây là các danh xưng cá nhân dành cho Chúa Giê-su và Đức Chúa Trời; viết hoa giúp người đọc nhận diện mà không thêm nội dung mới.
- issue: Đại từ αὐτόν trong cụm nói về Đấng sai phái
  choice: Lặp lại “Con”
  alternative: “Ngài” hoặc “người”
  rationale: Tiếng Hy Lạp dùng đại từ chỉ Con, nhưng tiếng Việt dễ khiến đại từ bị hiểu nhầm là chỉ Cha. Lặp danh xưng làm rõ quy chiếu vốn rõ trong nguyên văn, không giải quyết thêm bất kỳ vấn đề thần học nào.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ phép song hành cùng sự lặp lại “tôn kính” của nguyên văn. Không cần chú thích vì câu không có dị bản hay độ mơ hồ nào cần đưa ra ngoài chính văn.
