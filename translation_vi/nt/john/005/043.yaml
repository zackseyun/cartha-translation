id: JHN.5.43
reference: John 5:43
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐγὼ ἐλήλυθα ἐν τῷ ὀνόματι τοῦ πατρός μου καὶ οὐ λαμβάνετέ με· ἐὰν ἄλλος ἔλθῃ ἐν τῷ ὀνόματι τῷ ἰδίῳ, ἐκεῖνον λήμψεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/043.yaml
  text: I have come in my Father's name[a], and you do not receive me. If another comes in his own name[b], you will receive him.
translation:
  language: vi
  text: Ta đã đến nhân danh Cha ta[a], và các ngươi không tiếp nhận ta. Nếu một người khác đến nhân danh chính mình[b], các ngươi sẽ tiếp nhận người ấy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “với thẩm quyền của Cha ta.” Thành ngữ Hy Lạp “nhân danh” có thể chỉ sự đại diện hoặc thẩm quyền, đồng thời vẫn gợi đến chính tên gọi ấy.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “dựa vào thẩm quyền của chính mình.” Cụm từ này tương phản mạnh với việc Chúa Giê-su đến “nhân danh Cha ta”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλήλυθα
  choice: đã đến
  rationale: Thì hoàn thành diễn tả việc đã đến với kết quả còn hiện hữu; tiếng Việt tự nhiên dùng “đã đến”, còn trạng thái hiện tại được ngữ cảnh làm rõ.
- source_word: ἐν τῷ ὀνόματι τοῦ πατρός μου
  choice: nhân danh Cha ta
  rationale: “Nhân danh” là cách diễn đạt tự nhiên, trang trọng, giữ được ý về danh, sự đại diện và thẩm quyền mà không thu hẹp thành riêng một nghĩa.
- source_word: οὐ λαμβάνετέ με
  choice: không tiếp nhận ta
  rationale: Trong ngữ cảnh này, λαμβάνω chỉ việc đón nhận hoặc chấp nhận Chúa Giê-su, không phải hành động cầm lấy; “tiếp nhận” cũng giữ được sắc thái văn chương Giăng.
- source_word: ἄλλος
  choice: một người khác
  rationale: Diễn đạt rõ chủ thể là người và giữ nguyên sự bất định của từ Hy Lạp, không gán cho nhân vật này một danh tính cụ thể.
- source_word: ἐν τῷ ὀνόματι τῷ ἰδίῳ
  choice: nhân danh chính mình
  rationale: Giữ cấu trúc song song và sự tương phản trực tiếp với “nhân danh Cha ta”, đồng thời để ngỏ sắc thái tự đại diện hay tự lấy thẩm quyền.
- source_word: ἐκεῖνον λήμψεσθε
  choice: các ngươi sẽ tiếp nhận người ấy
  rationale: Lặp lại “tiếp nhận” để bảo toàn phép đối chiếu tu từ; “người ấy” thể hiện lực chỉ định của ἐκεῖνον.
- source_word: πατρός μου
  choice: Cha ta
  rationale: “Cha” viết hoa cho thấy đối tượng là Đức Chúa Trời trong văn mạch Giăng, còn “ta” phù hợp với lời phán trang trọng và quan hệ sở hữu trong nguyên văn.
theological_decisions:
- issue: Có nên nói rõ “Cha ta” là Đức Chúa Trời hay không
  choice: Giữ “Cha ta” và viết hoa “Cha”.
  alternative: “Đức Chúa Trời là Cha ta” hoặc viết “cha” thường.
  rationale: Văn mạch xác định Đấng được nói đến là Đức Chúa Trời; viết hoa giúp nhận ra quy chiếu thần linh mà không thêm lời giải thích vào câu.
- issue: Có nên diễn giải “nhân danh” trực tiếp thành ngôn ngữ về thẩm quyền hay không
  choice: Giữ “nhân danh” ở cả hai vế.
  alternative: “với thẩm quyền của Cha ta” và “dựa vào thẩm quyền của chính mình”.
  rationale: Thành ngữ Hy Lạp bao hàm danh, sự đại diện và thẩm quyền. Giữ cùng một thành ngữ bảo toàn độ rộng nghĩa, phép song song và sự căng thẳng thần học của câu.
- issue: Có nên xác định “một người khác” là một nhân vật cánh chung cụ thể hay không
  choice: Không xác định danh tính; dịch là “một người khác”.
  alternative: Diễn giải là một kẻ mạo danh hoặc một nhân vật cánh chung cụ thể.
  rationale: Nguyên văn không nêu danh tính; việc cụ thể hóa sẽ đưa một cách giải nghĩa thần học vào bản văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ta/các ngươi” để phù hợp lời phán nghiêm nghị trực tiếp trong bối cảnh Kinh Thánh; giữ “nhân danh” vì đây là thành ngữ tiếng Việt tự nhiên và bảo toàn phép song song của nguyên văn.
