  source_fidelity: 'Bản dịch bảo toàn đúng các yếu tố chính của nguyên văn: thì hoàn thành của ἐλήλυθα qua “đã đến”, thành ngữ song song “nhân danh”, động từ λαμβάνω được lặp lại bằng “tiếp nhận”, tính bất định của ἄλλος, và tương lai của λήμψεσθε. Tuy nhiên, liên từ καί là liên kết đơn thuần (“và”); “nhưng” diễn giải quan hệ đối nghịch vốn có thể cảm nhận từ ngữ cảnh nhưng không được phát biểu bằng liên từ Hy Lạp.'
