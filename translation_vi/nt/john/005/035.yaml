id: JHN.5.35
reference: John 5:35
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐκεῖνος ἦν ὁ λύχνος ὁ καιόμενος καὶ φαίνων, ὑμεῖς δὲ ἠθελήσατε ἀγαλλιαθῆναι πρὸς ὥραν ἐν τῷ φωτὶ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/john/005/035.yaml
  text: He was the lamp that was burning and shining[a], and you were willing to rejoice for a time in his light.
translation:
  language: vi
  text: Người ấy là ngọn đèn đang cháy và tỏa sáng; còn các ông đã sẵn lòng vui mừng trong ánh sáng của người ấy một thời gian[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hoặc “trong chốc lát.” Cụm từ này chỉ một khoảng thời gian có giới hạn, không nhất thiết là đúng một giờ.
    reason: lexical_alternative
lexical_decisions:
- source_word: λύχνος
  choice: ngọn đèn
  rationale: Chỉ một ngọn đèn dùng để soi sáng, không phải ánh sáng theo nghĩa trừu tượng; cách dịch này giữ sự phân biệt giữa Giăng là ngọn đèn và Chúa Giê-su là ánh sáng trong văn mạch sách Giăng.
- source_word: καιόμενος καὶ φαίνων
  choice: đang cháy và tỏa sáng
  rationale: Hai phân từ hiện tại mô tả hoạt động liên tục của ngọn đèn; “tỏa sáng” diễn đạt việc phát ra ánh sáng, không phải chỉ xuất hiện.
- source_word: ἠθελήσατε
  choice: đã muốn
  rationale: Diễn đạt ý chí hoặc sự sẵn lòng của người nghe mà không hàm ý ước muốn ấy kéo dài.
- source_word: ἀγαλλιαθῆναι
  choice: vui mừng
  rationale: Diễn đạt niềm vui mạnh mẽ bằng ngôn ngữ tự nhiên, trang trọng và dễ hiểu.
- source_word: πρὸς ὥραν
  choice: một thời gian
  rationale: Thành ngữ chỉ một khoảng thời gian có giới hạn, không nhất thiết là đúng một giờ.
- source_word: ἐν τῷ φωτὶ αὐτοῦ
  choice: trong ánh sáng của người
  rationale: Giữ hình ảnh họ vui hưởng trong phạm vi ánh sáng do Giăng đem lại qua chức vụ làm chứng.
- source_word: ἐκεῖνος
  choice: Người
  rationale: Đại từ chỉ định nhấn mạnh Giăng trong văn mạch; “Người” là cách quy chiếu tự nhiên, có phẩm cách trong tiếng Việt.
theological_decisions:
- issue: Sự phân biệt ẩn dụ giữa Giăng và Chúa Giê-su trong hình ảnh ánh sáng
  choice: Dịch Giăng là “ngọn đèn”, không phải “ánh sáng”.
  alternative: Người là ánh sáng.
  rationale: Bản Hy Lạp dùng λύχνος chứ không dùng φῶς. Cách dịch giữ vai trò phụ thuộc của Giăng như người làm chứng và soi sáng, không đồng nhất ông với ánh sáng tối hậu.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “các ông” cho đại từ số nhiều ὑμεῖς theo lời Chúa Giê-su nói với các đối thủ trong văn mạch; dùng “người” để chỉ Giăng, tránh nhầm với Chúa Giê-su. Dấu chú thích [a] được đặt ngay sau cụm từ mà nó giải thích.
