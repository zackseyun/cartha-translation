  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἀμὴν ἀμὴν λέγω ὑμῖν ὅτι ὁ τὸν λόγον μου ἀκούων καὶ πιστεύων τῷ πέμψαντί με ἔχει ζωὴν αἰώνιον, καὶ εἰς κρίσιν οὐκ ἔρχεται ἀλλὰ μεταβέβηκεν ἐκ τοῦ θανάτου εἰς τὴν ζωήν.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/024.yaml
  text: Truly[a], truly, I say to you, whoever hears my word and believes him who sent me has eternal life, and does not come into judgment[b], but has passed from death into life.
translation:
  language: vi
  text: 'Quả thật, quả thật, tôi nói với các ông: Ai nghe lời tôi và tin Đấng đã sai tôi thì có sự sống đời đời; người ấy không đi vào sự phán xét[a], nhưng đã vượt từ sự chết sang sự sống[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “không đi vào sự kết án.” Từ Hy Lạp κρίσις có thể chỉ sự phán xét nói chung hoặc, trong văn cảnh này, một phán quyết bất lợi.'
    reason: lexical_alternative
  - marker: b
    text: 'Động từ Hy Lạp ở thể hoàn thành chỉ một bước chuyển đã hoàn tất và có kết quả còn tiếp diễn: người ấy đã “vượt qua” hoặc “bước qua” từ sự chết sang sự sống.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀμὴν ἀμὴν
  choice: Thật, thật
  rationale: Giữ nguyên sự lặp lại đầy nhấn mạnh trong công thức long trọng của Chúa Giê-su, đồng thời diễn đạt bằng tiếng Việt rõ ràng thay vì để nguyên từ vay mượn “A-men”.
- source_word: λέγω ὑμῖν
  choice: tôi nói với các ông
  rationale: Diễn đạt trực tiếp, tự nhiên; “các ông” phù hợp với nhóm người đang được Chúa Giê-su đối thoại trong ngữ cảnh mà không dùng đại từ cổ.
- source_word: ὁ τὸν λόγον μου ἀκούων καὶ πιστεύων
  choice: Ai nghe lời tôi và tin
  rationale: “Ai” truyền đạt tính khái quát của hai phân từ có mạo từ, không thêm sắc thái giới tính; các động từ hiện tại mô tả người có đặc điểm nghe và tin.
- source_word: τὸν λόγον μου
  choice: lời tôi
  rationale: Giữ được âm hưởng đặc trưng của λόγος trong Giăng, đồng thời có thể hiểu tự nhiên là lời nói hay sứ điệp của Chúa Giê-su.
- source_word: πιστεύων τῷ πέμψαντί με
  choice: tin Đấng đã sai tôi
  rationale: πιστεύω đi với tặng cách ở đây chỉ việc tin hoặc tín nhiệm một người. “Tin Đấng” vừa sát cấu trúc vừa tự nhiên trong tiếng Việt.
- source_word: ἔχει ζωὴν αἰώνιον
  choice: có sự sống đời đời
  rationale: Thì hiện tại của ἔχει cho thấy sự sở hữu ngay trong hiện tại; “sự sống đời đời” là cách diễn đạt rõ ràng và quen thuộc trong văn mạch Giăng.
- source_word: εἰς κρίσιν οὐκ ἔρχεται
  choice: không đi vào sự phán xét
  rationale: “Sự phán xét” giữ nghĩa rộng của κρίσις, còn “đi vào” bảo toàn hướng chuyển động của εἰς. Cách dịch này không tự động thu hẹp nghĩa thành kết án.
- source_word: μεταβέβηκεν
  choice: đã vượt khỏi ... mà vào
  rationale: Thể hoàn thành diễn tả một sự chuyển đổi đã xảy ra và còn hiệu lực. “Đã vượt khỏi” thể hiện cả chuyển động lẫn tình trạng mới hiện hữu.
- source_word: ἐκ τοῦ θανάτου εἰς τὴν ζωήν
  choice: khỏi sự chết mà vào sự sống
  rationale: Giữ sự tương phản mạnh giữa chết và sống, đồng thời thể hiện hướng đi từ phạm vi này vào phạm vi kia.
theological_decisions:
- issue: Ý nghĩa của κρίσις trong văn cảnh cứu rỗi
  choice: sự phán xét
  alternative: sự kết án
  rationale: Trong văn cảnh, đây có thể là sự phán xét dẫn đến kết án, nhưng danh từ κρίσις tự nó rộng hơn “kết án”. Bản dịch giữ nguyên độ mở ngữ nghĩa và để mệnh đề tiếp theo làm sáng tỏ kết quả cứu rỗi.
- issue: Giá trị của các động từ hiện tại và hoàn thành đối với sự sống
  choice: sự sống đời đời là sở hữu hiện tại, và việc chuyển từ chết sang sống đã hoàn tất với kết quả còn tiếp diễn
  alternative: chỉ nhận sự sống trong tương lai hoặc chỉ được tha tại cuộc phán xét tương lai
  rationale: ἔχει ở thì hiện tại và μεταβέβηκεν ở thể hoàn thành trực tiếp diễn tả thực tại hiện có và một bước chuyển đã hoàn tất. Bản dịch giữ các nét này mà không gắn chúng với một hệ phái thần học riêng.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Giữ công thức nhấn mạnh “Thật, thật” và các đối cực thần học “sự chết—sự sống”, đồng thời tránh lối xưng hô quá cổ. Dấu chấm phẩy làm rõ hai kết quả song song của việc nghe và tin.
