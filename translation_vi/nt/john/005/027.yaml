  text: καὶ ἐξουσίαν ἔδωκεν ⸀αὐτῷ κρίσιν ποιεῖν, ὅτι υἱὸς ἀνθρώπου ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/027.yaml
  text: And he gave him authority to execute judgment[a], because he is the Son of Man.
translation:
  language: vi
  text: Ngài cũng ban cho Con thẩm quyền thi hành việc xét xử, vì Con là Con Người.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “vì Ngài là một con người,” nghĩa là vì Ngài có chung bản tính loài người. Chính văn giữ cách hiểu có nhiều khả năng hơn rằng đây là danh hiệu “Con Người” trong Tin Mừng Giăng.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐξουσίαν
  choice: thẩm quyền
  rationale: Diễn tả quyền hạn chính đáng được trao để xét xử, chứ không chỉ là sức mạnh.
- source_word: ἔδωκεν αὐτῷ
  choice: ban cho Con
  rationale: Động từ có nghĩa trực tiếp là “ban/cho”; đại từ chỉ về Con trong văn cảnh. Dùng “Con” giúp câu tiếng Việt rõ chủ thể nhận quyền mà không thêm một danh xưng xa lạ với mạch văn.
- source_word: κρίσιν ποιεῖν
  choice: thi hành sự phán xét
  rationale: Giữ sắc thái tư pháp của thành ngữ “thực hiện sự xét xử/phán xét”, tự nhiên và trang trọng hơn cách dịch sát chữ.
- source_word: ὅτι
  choice: vì
  rationale: Liên từ ở đây nêu lý do của việc ban thẩm quyền.
- source_word: υἱὸς ἀνθρώπου
  choice: Con Người
  rationale: Trong Tin Mừng Giăng, cụm từ này nhiều khả năng là danh hiệu quen thuộc của Chúa Giê-su và gợi đến Đa-ni-ên 7. Tuy nhiên, do tiếng Hy Lạp không có mạo từ ở đây, khả năng hiểu theo nghĩa “một người phàm” được giữ trong chú thích.
theological_decisions:
- issue: Nên hiểu υἱὸς ἀνθρώπου là danh hiệu Cơ Đốc học hay cách nói chung về nhân tính
  choice: Dịch trong chính văn là danh hiệu “Con Người”.
  alternative: “một người phàm”, tức là Ngài mang bản tính loài người
  rationale: Cách dùng xuyên suốt Tin Mừng Giăng và văn cảnh về thẩm quyền xét xử ủng hộ danh hiệu có âm hưởng Đa-ni-ên 7. Chú thích vẫn bảo tồn sự mơ hồ thật sự do cấu trúc Hy Lạp không có mạo từ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Thẩm quyền” giữ sắc thái pháp lý; “thi hành sự phán xét” phản ánh thành ngữ Hy Lạp mà không quá cứng. Đại từ và danh xưng được viết hoa theo lối dùng phổ biến trong Kinh Thánh tiếng Việt.
