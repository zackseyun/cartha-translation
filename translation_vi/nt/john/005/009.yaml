  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ εὐθέως ἐγένετο ὑγιὴς ὁ ἄνθρωπος καὶ ἦρε τὸν κράβαττον αὐτοῦ καὶ περιεπάτει. Ἦν δὲ σάββατον ἐν ἐκείνῃ τῇ ἡμέρᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/009.yaml
  text: And immediately the man became well[a], and he picked up his mat and began to walk[c][b]. Now that day was a Sabbath.
translation:
  language: vi
  text: Ngay lập tức, người ấy khỏe lại; ông nhấc tấm đệm[a] của mình lên và bắt đầu bước đi.[b] Hôm ấy là ngày Sa-bát.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “tấm nằm” hoặc “chỗ nằm đơn sơ.” Từ Hy Lạp chỉ một tấm đệm hay chỗ nằm đơn giản có thể mang theo, không nhất thiết là một chiếc giường lớn.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “đang bước đi” hoặc “đi lại.” Động từ Hy Lạp ở thì chưa hoàn thành có thể nhấn mạnh hành động đang tiếp diễn; trong văn cảnh này, nó cũng có thể làm nổi bật việc người ấy bắt đầu bước đi sau khi được chữa lành.
    reason: lexical_alternative
  - marker: c
    text: 'Sát nguyên văn: “Vào ngày ấy là Sa-bát.” Cũng có thể diễn đạt: “Hôm ấy là một ngày Sa-bát.”'
    reason: alternative_reading
lexical_decisions:
- source_word: εὐθέως
  choice: ngay lập tức
  rationale: Diễn đạt rõ tính tức thời của sự chữa lành, đồng thời phù hợp với giọng kể trang trọng, tự nhiên.
- source_word: ἐγένετο ὑγιὴς
  choice: khỏe lại
  rationale: Diễn tả tự nhiên sự chuyển biến sang tình trạng khỏe mạnh mà không làm cho tác nhân bị động trở nên tường minh hơn nguyên văn.
- source_word: ὁ ἄνθρωπος
  choice: người ấy; ông
  rationale: Chỉ đúng người đàn ông đã được nhắc đến trong mạch văn; cách chuyển sang đại từ “ông” giúp câu tiếng Việt tự nhiên và tránh lặp.
- source_word: ἦρε
  choice: nhấc ... lên
  rationale: Diễn tả hành động cầm vật nằm dưới đất lên, phù hợp với một tấm đệm có thể mang theo.
- source_word: κράβαττον
  choice: tấm đệm
  rationale: Chỉ một tấm nằm, đệm mỏng hoặc giường xếp đơn sơ có thể mang đi; tránh gợi hình ảnh một chiếc giường lớn.
- source_word: περιεπάτει
  choice: đi lại
  rationale: Giữ được sắc thái hành động đang diễn tiến của thì chưa hoàn thành và trong tiếng Việt cũng tự nhiên chỉ khả năng đi đứng đã được phục hồi.
- source_word: Ἦν δὲ
  choice: Hôm ấy là
  rationale: δέ chuyển sang một lời ghi chú giải thích trong câu chuyện, không nhất thiết biểu thị tương phản; tiếng Việt không cần dịch thành một liên từ riêng.
- source_word: σάββατον
  choice: ngày Sa-bát
  rationale: Cách gọi tự nhiên trong tiếng Việt đối với ngày nghỉ thánh của người Do Thái và chuẩn bị cho cuộc tranh luận tiếp theo.
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: Hôm ấy
  rationale: Cách diễn đạt ngắn gọn, tự nhiên của cụm “trong/vào ngày ấy” trong tiếng Việt.
theological_decisions:
- issue: Cách dịch σάββατον trong lời ghi chú về thời gian
  choice: ngày Sa-bát
  alternative: một ngày Sa-bát; ngày ấy là Sa-bát
  rationale: Danh từ Hy Lạp không có mạo từ, nhưng tiếng Việt không buộc phải đánh dấu xác định hay bất định. “Ngày Sa-bát” tự nhiên, nhận diện đúng ngày thánh của người Do Thái mà không thêm một sắc thái thần học.
- issue: Sắc thái của ἐγένετο ὑγιὴς
  choice: khỏe lại
  alternative: được chữa lành; trở nên khỏe mạnh
  rationale: “Khỏe lại” bảo toàn sự chuyển biến được nguyên văn nêu ra mà không biến cấu trúc thành bị động và không xác định tác nhân bằng ngữ pháp.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng và dễ hiểu. Câu giữ nhịp nhanh của chuỗi hành động trong nguyên văn, còn các chú thích bảo toàn những khả năng về vật nằm, thể động từ và cách diễn đạt ngày Sa-bát.
