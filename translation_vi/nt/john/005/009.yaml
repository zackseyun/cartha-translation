revisions:
- from: Ngay lập tức, người ấy khỏe lại; ông nhấc tấm đệm[a] của mình lên và đi lại.[b] Hôm ấy là ngày Sa-bát.[c]
  to: Ngay lập tức, người ấy khỏe lại; ông nhấc tấm đệm[a] của mình lên và bắt đầu bước đi.[b] Hôm ấy là ngày Sa-bát.[c]
  rationale: Chỉnh chú thích về κράβαττον để loại bỏ hình ảnh không chính xác của “giường xếp,” thay bằng các cách diễn đạt sát nghĩa và tự nhiên hơn. Chỉnh “đi lại” thành “bắt đầu bước đi” để phản ánh hợp lý sắc thái khởi phát có thể có của περιεπάτει trong trình thuật, trong khi chú thích vẫn nêu khả năng hành động tiếp diễn. Không thay đổi ý nghĩa, cách gọi Sa-bát, hay mức độ mơ hồ của nguyên văn.
  reviewer_model: gpt-5.6-terra
