  text: ὑμεῖς ἀπεστάλκατε πρὸς Ἰωάννην, καὶ μεμαρτύρηκε τῇ ἀληθείᾳ·
base_translation:
  language: en
  yaml_path: translation/nt/john/005/033.yaml
  text: You have sent to John[a], and he has testified to the truth.
translation:
  language: vi
  text: 'Chính các ông đã sai người đến gặp Giăng, và ông ấy đã làm chứng về sự thật.[a]


    [a] Cũng có thể dịch: “đã làm chứng cho sự thật.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đã làm chứng cho sự thật.”'
    reason: Biến thể cách diễn đạt cho dữ cách τῇ ἀληθείᾳ sau động từ “làm chứng”; “về sự thật” là cách diễn đạt trực tiếp hơn trong tiếng Việt, còn “cho sự thật” nhấn mạnh việc xác nhận sự thật.
lexical_decisions:
- source_word: ὑμεῖς
  choice: Chính các ông
  rationale: Đại từ được nêu rõ dù hình thái động từ đã chỉ ngôi thứ hai, nên có sắc thái nhấn mạnh. “Chính các ông” diễn đạt sắc thái ấy tự nhiên trong tiếng Việt và phù hợp với những người Chúa Giê-su đang đối thoại.
- source_word: ἀπεστάλκατε
  choice: đã sai người
  rationale: Thì hoàn thành chỉ hành động sai phái đã xảy ra và vẫn liên quan đến lập luận hiện tại. Tiếng Việt dùng “đã”; thêm “người” để diễn đạt tự nhiên đối tượng được sai đi vốn được lược trong tiếng Hy Lạp và đã rõ từ ngữ cảnh.
- source_word: πρὸς Ἰωάννην
  choice: đến gặp Giăng
  rationale: πρός với một người làm đối tượng chỉ hướng đến người ấy. Trong cấu trúc “sai người”, “đến gặp Giăng” tự nhiên hơn lối dịch sát chữ “đến Giăng”, đồng thời không thêm tước hiệu không có trong nguyên văn.
- source_word: μεμαρτύρηκε
  choice: đã làm chứng
  rationale: Giữ hình ảnh nhân chứng và sắc thái pháp lý của μαρτυρέω. Thì hoàn thành nêu lời chứng đã được đưa ra và còn giá trị; trong tiếng Việt, “đã làm chứng” truyền đạt điều này tự nhiên trong ngữ cảnh.
- source_word: τῇ ἀληθείᾳ
  choice: cho sự thật
  rationale: Dữ cách sau μαρτυρέω có thể được hiểu là làm chứng cho hoặc về điều gì. “Cho sự thật” giữ cấu trúc và âm hưởng thần học của cụm có mạo từ, nhưng phương án “về sự thật” cũng được ghi nhận.
theological_decisions:
- issue: Cách hiểu cụm “sự thật” trong văn chương Giăng
  choice: sự thật
  alternative: lẽ thật
  rationale: Nguyên văn có mạo từ và cụm từ có thể mang âm hưởng thần học đặc trưng của Giăng. “Sự thật” vừa rõ với độc giả hiện đại vừa không thu hẹp ý nghĩa thành một khái niệm giáo lý cụ thể; “lẽ thật” là cách nói truyền thống nhưng kém thông dụng hơn.
- issue: Quan hệ của lời chứng với sự thật
  choice: làm chứng cho sự thật
  alternative: làm chứng về sự thật
  rationale: Dữ cách τῇ ἀληθείᾳ cho phép sắc thái hướng lời chứng đến việc xác nhận sự thật, trong khi “về sự thật” nhấn mạnh nội dung lời chứng. Bản chính giữ “cho”, còn chú thích bảo tồn khả năng kia.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Giăng” theo dạng tên Kinh Thánh quen thuộc trong tiếng Việt; “các ông” phù hợp với lời đối thoại trực tiếp và không tự ý xác định thêm chức danh của người nghe.
