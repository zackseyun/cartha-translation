  source_fidelity: Bản dịch phản ánh đúng nhấn mạnh của ὑμεῖς, thì hoàn thành của ἀπεστάλκατε và μεμαρτύρηκε, cũng như ý nghĩa của τῇ ἀληθείᾳ. Tuy nhiên, “đã làm chứng cho sự thật” dễ được hiểu là làm chứng bênh vực sự thật hơn là lời chứng có nội dung liên hệ đến sự thật. “Đã làm chứng về sự thật” là cách diễn đạt tiếng Việt trực tiếp và tự nhiên hơn cho dữ cách sau μαρτυρέω, mà không làm mất âm hưởng thần học của “sự thật”. Việc thêm “người” trong “sai người đến gặp” không trái ngữ cảnh, nhưng là một đối tượng không được nêu trong câu Hy Lạp; vẫn có thể giữ vì tiếng Việt cần một bổ ngữ tự nhiên cho “sai/phái”.
