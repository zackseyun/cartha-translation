revisions:
- from: '“Quả thật[a], quả thật, tôi nói với anh em: một giờ[b] đang đến, và nay đã hiện diện, khi những người chết[c] sẽ nghe tiếng của Con Đức Chúa Trời; những ai nghe[d] sẽ sống.”'
  to: '“Quả thật[a], quả thật, tôi nói với anh em: một giờ[b] đang đến, và hiện nay đã đến, khi những người chết[c] sẽ nghe tiếng nói của Con Đức Chúa Trời; những ai đã nghe[d] sẽ sống.”'
  rationale: Đã sửa cách dịch phân từ aorist để phản ánh rõ hơn trình tự nghe rồi sống; thay cụm hiện tại gượng bằng một cách nói Việt tự nhiên hơn trong ngữ cảnh «giờ»; và dùng «tiếng nói» cho φωνή. Các chú thích được giữ đủ bốn neo, đồng thời chú thích d đảo lại để nêu bản dịch hiện tại như một phương án thay thế.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T05:37:47Z'
review_pass:
  verdict: revise
  source_fidelity: Bản nháp phản ánh đúng cấu trúc chính của câu, danh hiệu «Con Đức Chúa Trời», và sự căng thẳng giữa «đang đến» với hiện tại. Tuy nhiên, «những ai nghe» làm mờ sắc thái phân từ aorist ἀκούσαντες («những ai đã nghe»), trong khi văn bản đặt việc nghe trước kết quả «sẽ sống».
  naturalness: Văn phong nhìn chung hiện đại và trang trọng. «Nay đã hiện diện» có thể hiểu được nhưng hơi gượng và thêm sắc thái hoàn tất; «hiện nay đã đến» tự nhiên hơn trong tiếng Việt và diễn đạt được ý giờ ấy hiện đã có mặt.
  terminology: «Quả thật, quả thật», «một giờ», «những người chết», và «Con Đức Chúa Trời» đều phù hợp. «Tiếng nói» rõ hơn «tiếng» trong việc dịch φωνή là tiếng/giọng của một nhân vật đang nói.
  issues:
  - severity: medium
    issue: Phân từ aorist οἱ ἀκούσαντες được dịch «những ai nghe».
    rationale: Cách dịch hiện tại này khả dĩ về mặt idiom trong một mệnh đề hướng tương lai, nhưng không giữ rõ quan hệ nghe trước rồi sống mà aorist participle biểu thị. «Những ai đã nghe sẽ sống» vừa tự nhiên vừa sát hơn.
  - severity: low
    issue: «Nay đã hiện diện» hơi gượng và có thêm sắc thái hoàn tất.
    rationale: καὶ νῦν ἐστιν nghĩa đen là «và nay là/đang hiện hữu». Trong ngữ cảnh nói về «giờ», «và hiện nay đã đến» là cách nói Việt tự nhiên, không giải quyết thay sự căng thẳng hiện tại–tương lai.
  - severity: low
    issue: «Tiếng của Con» kém cụ thể hơn «tiếng nói của Con».
    rationale: φωνή trong ngữ cảnh này là tiếng nói của một chủ thể có ngôi vị; «tiếng nói» truyền đạt rõ hơn mà không thêm ý đáp ứng.
