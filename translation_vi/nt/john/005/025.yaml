id: JHN.5.25
reference: John 5:25
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἀμὴν ἀμὴν λέγω ὑμῖν ὅτι ἔρχεται ὥρα καὶ νῦν ἐστιν ὅτε οἱ νεκροὶ ⸀ἀκούσουσιν τῆς φωνῆς τοῦ υἱοῦ τοῦ θεοῦ καὶ οἱ ἀκούσαντες ⸀ζήσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/025.yaml
  text: Truly[a], truly, I say to you that an hour is coming, and now is, when the dead will hear the voice of the Son of God[d][c][b], and those who hear will live.
translation:
  language: vi
  text: '“Quả thật[a], quả thật, tôi nói với anh em: một giờ[b] đang đến, và hiện nay đã đến, khi những người chết[c] sẽ nghe tiếng nói của Con Đức Chúa Trời; những ai đã nghe[d] sẽ sống.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát hơn: “A-men, a-men, tôi nói với anh em.”'
    reason: lexical_alternative
  - marker: b
    text: “Giờ” cũng có thể được hiểu rộng hơn là “thời điểm”, nhưng từ Hy Lạp dùng ở đây có nghĩa cụ thể là “giờ”.
    reason: lexical_alternative
  - marker: c
    text: Trong câu này, “những người chết” có thể bao gồm nghĩa thuộc linh ở hiện tại (xem “hiện nay đã đến”), đồng thời báo trước sự sống lại của thân thể trong văn cảnh xung quanh.
    reason: cross_reference
  - marker: d
    text: 'Cũng có thể dịch: “những ai nghe sẽ sống.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀμὴν ἀμὴν
  choice: Quả thật, quả thật
  rationale: Giữ nguyên lối lặp trang trọng, nhấn mạnh đặc trưng trong lời Đức Giê-su, đồng thời rõ nghĩa với độc giả Việt Nam hiện đại.
- source_word: λέγω ὑμῖν
  choice: tôi nói với anh em
  rationale: Phản ánh trực tiếp ngôi thứ nhất và đại từ số nhiều; “anh em” tự nhiên trong lời nói với một nhóm người và vẫn giữ sắc thái trang trọng.
- source_word: ἔρχεται ὥρα
  choice: một giờ đang đến
  rationale: Giữ danh từ cụ thể “giờ” và tính bất định của ὥρα không có mạo từ, thay vì khái quát hóa thành “thời điểm”.
- source_word: καὶ νῦν ἐστιν
  choice: và nay đã hiện diện
  rationale: Diễn đạt tự nhiên ý “và bây giờ là/có” mà không xóa bỏ sức căng giữa điều đang đến và điều đã hiện hữu trong hiện tại.
- source_word: οἱ νεκροὶ
  choice: những người chết
  rationale: Cách dịch trực tiếp, không tự ý giới hạn vào tình trạng chết thuộc linh hay chết thể xác.
- source_word: ἀκούσουσιν τῆς φωνῆς
  choice: sẽ nghe tiếng
  rationale: Trong ngữ cảnh một chủ thể có ngôi vị đang phán, φωνή là “tiếng/tiếng nói”; “nghe” không thêm ý đáp ứng vốn không được động từ nêu rõ.
- source_word: τοῦ υἱοῦ τοῦ θεοῦ
  choice: của Con Đức Chúa Trời
  rationale: Giữ trọn danh hiệu Kitô học của nguyên văn bằng cách diễn đạt quen thuộc và trang trọng.
- source_word: οἱ ἀκούσαντες
  choice: những ai nghe
  rationale: Phân từ aorist được diễn đạt tự nhiên trong tiếng Việt theo quan hệ nghe rồi sống; chú thích giữ lại khả năng dịch sát hình thái là “đã nghe”.
- source_word: ζήσουσιν
  choice: sẽ sống
  rationale: Dịch trực tiếp ζάω, không thu hẹp ý thành riêng việc sống lại về thể xác.
theological_decisions:
- issue: Ý chỉ của “những người chết”
  choice: Giữ nguyên “những người chết”, cho phép cả chiều kích hiện tại lẫn tương lai của câu.
  alternative: “những người chết về phần tâm linh” hoặc “những người đã chết về thể xác”
  rationale: Cụm “nay đã hiện diện” gợi một chiều kích hiện tại, trong khi văn cảnh tiếp theo nói đến sự sống lại của thân thể. Bản dịch không nên loại bỏ một trong hai âm hưởng.
- issue: Sức căng giữa tương lai và hiện tại
  choice: “một giờ đang đến, và nay đã hiện diện”
  alternative: “thời điểm ấy sắp đến, thật ra đã đến rồi”
  rationale: Cách chọn giữ sự đặt cạnh có chủ ý giữa ἔρχεται và νῦν ἐστιν, tránh giải thích quá mức mối liên hệ giữa hai vế.
- issue: Danh hiệu của Đức Giê-su
  choice: “Con Đức Chúa Trời”
  alternative: “Con của Đức Chúa Trời”
  rationale: Giữ trực tiếp danh hiệu τοῦ υἱοῦ τοῦ θεοῦ, không thêm nội dung thần học ngoài nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Duy trì nhịp lặp long trọng ở đầu câu, giữ thuật ngữ “giờ” cùng sức căng giữa hiện tại và tương lai, đồng thời tránh giải nghĩa “những người chết” theo riêng một lập trường thần học.
