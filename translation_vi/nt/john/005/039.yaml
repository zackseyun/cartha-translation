source:
  edition: SBLGNT
  text: Ἐραυνᾶτε τὰς γραφάς, ὅτι ὑμεῖς δοκεῖτε ἐν αὐταῖς ζωὴν αἰώνιον ἔχειν· καὶ ἐκεῖναί εἰσιν αἱ μαρτυροῦσαι περὶ ἐμοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/john/005/039.yaml
  text: You search the Scriptures because you think that in them you have eternal life[a]; and these are the ones that testify about me.
translation:
  language: vi
  text: Các ông tra cứu Kinh Thánh vì cho rằng trong đó các ông có sự sống đời đời; chính những sách ấy làm chứng về tôi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Hãy tra cứu Kinh Thánh, vì các ông cho rằng trong đó các ông có sự sống đời đời; chính những sách ấy làm chứng về tôi.” Dạng Ἐραυνᾶτε có thể được hiểu là mệnh lệnh thay vì trực thuyết.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐραυνᾶτε
  choice: Anh em tra cứu
  rationale: 'Hình thái Hy Lạp có thể là trực thuyết hoặc mệnh lệnh. Trong ngữ cảnh, trực thuyết tự nhiên hơn: Đức Chúa Jêsus mô tả việc những người đối thoại vẫn làm rồi chỉ ra điều họ bỏ lỡ. “Tra cứu” diễn đạt sự xem xét kỹ lưỡng, không chỉ đọc qua.'
- source_word: τὰς γραφάς
  choice: Kinh Thánh
  rationale: Trong ngữ cảnh Giăng, từ này chỉ các sách thánh của Israel; “Kinh Thánh” là cách gọi tự nhiên và quen thuộc trong tiếng Việt.
- source_word: ὅτι
  choice: vì
  rationale: Hiểu theo nghĩa nguyên nhân, nêu lý do họ tra cứu Kinh Thánh.
- source_word: δοκεῖτε
  choice: nghĩ rằng
  rationale: Diễn đạt niềm tin hay sự nhận định của họ, đồng thời giữ được sắc thái phê bình nhẹ trong câu.
- source_word: ἐν αὐταῖς
  choice: trong đó
  rationale: Giữ nghĩa trực tiếp của giới từ ἐν và quy chiếu về Kinh Thánh.
- source_word: ζωὴν αἰώνιον
  choice: sự sống đời đời
  rationale: Cụm từ chuẩn trong văn mạch Giăng và trong tiếng Việt Kinh Thánh.
- source_word: ἐκεῖναί εἰσιν αἱ μαρτυροῦσαι
  choice: chính Kinh Thánh làm chứng
  rationale: Đại từ giống cái số nhiều quy chiếu lại các sách thánh. “Chính” chuyển tải tính nhấn mạnh; lặp lại “Kinh Thánh” giúp tiếng Việt rõ nghĩa và tự nhiên.
- source_word: περὶ ἐμοῦ
  choice: về tôi
  rationale: Cách diễn đạt hiện đại, tự nhiên cho nghĩa “về/liên quan đến tôi”.
theological_decisions:
- issue: Thức của Ἐραυνᾶτε
  choice: 'Trực thuyết: “Anh em tra cứu Kinh Thánh”'
  alternative: 'Mệnh lệnh: “Hãy tra cứu Kinh Thánh”'
  rationale: 'Hình thái Hy Lạp cho phép cả hai cách hiểu. Mạch văn gần thiên về trực thuyết vì Đức Chúa Jêsus đang mô tả thói quen của những người đối thoại và phơi bày nghịch lý: họ tra cứu Kinh Thánh nhưng không đến với Đấng mà Kinh Thánh làm chứng. Cách đọc mệnh lệnh vẫn khả hữu nên được giữ trong chú thích.'
- issue: Mối liên hệ giữa Kinh Thánh và sự sống đời đời
  choice: Giữ nguyên lời mô tả rằng họ nghĩ mình có sự sống đời đời “trong” Kinh Thánh
  alternative: Diễn giải rằng họ nhận sự sống nhờ đọc hoặc tuân giữ Kinh Thánh
  rationale: Bản Hy Lạp dùng ἐν αὐταῖς và câu mang sắc thái phê bình nhận định của họ. Bản dịch không thêm một cơ chế thần học mà nguyên văn không nói rõ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” cho ngôi thứ hai số nhiều trong lời đối thoại, “tra cứu” cho hành động xem xét kỹ, và viết hoa “Kinh Thánh” theo quy ước tiếng Việt. Dấu chú thích được đặt cuối câu để chú thích toàn bộ cách đọc thay thế của mệnh đề mở đầu.
