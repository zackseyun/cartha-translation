  text: καὶ ἐκπορεύσονται οἱ τὰ ἀγαθὰ ποιήσαντες εἰς ἀνάστασιν ζωῆς, οἱ ⸀δὲ τὰ φαῦλα πράξαντες εἰς ἀνάστασιν κρίσεως.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/029.yaml
  text: and will come out—those who have done good to the resurrection of life[a], but those who have done evil to the resurrection of judgment.
translation:
  language: vi
  text: 'và họ sẽ ra khỏi mồ: những người đã làm điều lành sẽ sống lại để được sự sống, còn những người đã làm điều ác sẽ sống lại để chịu phán xét[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch “sống lại để bị kết án.” Tiếng Hy Lạp dùng từ “phán xét,” có nghĩa rộng hơn; “kết án” là cách hiểu thu hẹp được dùng trong một số bản dịch.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκπορεύσονται
  choice: sẽ ra khỏi mồ
  rationale: Động từ có nghĩa là đi hoặc ra; trong ngữ cảnh những người chết ở trong mồ (c. 28), thêm “khỏi mồ” giúp câu tiếng Việt tự nhiên và làm rõ ý đã có trong ngữ cảnh mà không đổi nội dung.
- source_word: τὰ ἀγαθὰ ποιήσαντες
  choice: những người đã làm điều lành
  rationale: Cấu trúc tính từ có mạo từ dùng như danh từ chỉ những điều tốt lành; “làm điều lành” là cách diễn đạt tự nhiên, trang trọng và giữ sắc thái đạo đức.
- source_word: ἀνάστασιν ζωῆς
  choice: sống lại để được sự sống
  rationale: Diễn đạt tự nhiên quan hệ giữa sự sống lại và sự sống trong tiếng Việt; không xác định thêm bản chất hay thời điểm của sự sống ấy.
- source_word: τὰ φαῦλα πράξαντες
  choice: những người đã làm điều ác
  rationale: φαῦλα trong ngữ cảnh phán xét mang nghĩa xấu về đạo đức. “Làm điều ác” rõ ràng và tự nhiên; không cố tạo một khác biệt thiếu tự nhiên giữa πράσσω và ποιέω.
- source_word: ἀνάστασιν κρίσεως
  choice: sống lại để chịu phán xét
  rationale: κρίσις căn bản là sự phán xét. “Chịu phán xét” truyền đạt đích đến/hệ quả của sự sống lại mà không thu hẹp nghĩa thành sự kết án.
- source_word: δὲ
  choice: còn
  rationale: “Còn” thể hiện rõ sự tương phản giữa hai nhóm và hai kết cục, đồng thời nối câu tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Nên dịch κρίσεως theo nghĩa rộng là “phán xét” hay thu hẹp thành “kết án”
  choice: phán xét
  alternative: kết án
  rationale: κρίσις tự nó có nghĩa rộng hơn “kết án”. Giữ “phán xét” bảo toàn sự căng thẳng thần học của nguyên văn và tránh đưa vào câu một kết luận hẹp hơn từ ngữ Hy Lạp.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dấu hai chấm làm rõ hai nhóm người bước ra khỏi mồ. Cấu trúc song song “sống lại để…” giữ nhịp đối chiếu của nguyên văn.
