  source_fidelity: 'Bản dịch truyền đạt đúng cấu trúc đối chiếu và ý nghĩa chính của câu: sự ra khỏi mồ/sự sống lại, hai nhóm người theo việc lành và điều ác, cùng hai kết cục “sự sống” và “phán xét”. “Sống lại để được sự sống” và “sống lại để chịu phán xét” là những cách diễn đạt Việt ngữ tự nhiên cho các cụm genitive ἀνάστασιν ζωῆς và ἀνάστασιν κρίσεως, không thu hẹp κρίσις thành “kết án”. Việc nói “ra khỏi mồ” dựa trực tiếp vào ngữ cảnh trước mắt ở câu 28, nơi các mồ được nêu rõ, và không làm thay đổi ý câu.'
