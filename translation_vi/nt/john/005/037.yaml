  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ὁ πέμψας με πατὴρ ⸀ἐκεῖνος μεμαρτύρηκεν περὶ ἐμοῦ. οὔτε φωνὴν αὐτοῦ ⸂πώποτε ἀκηκόατε⸃ οὔτε εἶδος αὐτοῦ ἑωράκατε,
base_translation:
  language: en
  yaml_path: translation/nt/john/005/037.yaml
  text: And the Father who sent me—that one has testified about me[a]. You have neither ever heard his voice nor seen his form[b],
translation:
  language: vi
  text: Và Cha, Đấng đã sai tôi, chính Ngài đã làm chứng về tôi.[a] Các ông chưa từng nghe tiếng Ngài, cũng chưa từng thấy hình dạng Ngài,[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Và chính Cha, Đấng đã sai tôi, đã làm chứng về tôi.” Từ chỉ định Hy Lạp ἐκεῖνος nhấn mạnh đến Cha.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “dáng vẻ Ngài” hoặc “diện mạo Ngài.” Từ Hy Lạp εἶδος có thể chỉ hình dạng hay vẻ bề ngoài có thể nhìn thấy.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ πέμψας με πατὴρ
  choice: Cha, Đấng đã sai tôi
  rationale: Phân từ aorist có mạo từ được diễn đạt tự nhiên bằng mệnh đề quan hệ, giữ chức năng xác định của cụm từ Hy Lạp.
- source_word: ἐκεῖνος
  choice: chính
  rationale: Từ chỉ định nhấn mạnh, quy chiếu lại về Cha; “chính” truyền đạt sự nhấn mạnh tự nhiên trong tiếng Việt mà không tạo lối nói cứng.
- source_word: μεμαρτύρηκεν
  choice: đã làm chứng
  rationale: Giữ nghĩa chứng nhận/làm chứng; tiếng Việt không bắt buộc biểu thị riêng thì hoàn thành, nhưng ngữ cảnh vẫn cho thấy lời chứng đã được ban và còn hiệu lực.
- source_word: περὶ ἐμοῦ
  choice: về tôi
  rationale: Cách diễn đạt hiện đại, trực tiếp cho περί với sở hữu cách.
- source_word: οὔτε ... οὔτε
  choice: chưa từng ... cũng chưa từng
  rationale: Diễn đạt tự nhiên cấu trúc phủ định tương liên, đồng thời kết hợp rõ ý πώποτε.
- source_word: φωνὴν αὐτοῦ
  choice: tiếng Ngài
  rationale: φωνή trong ngữ cảnh nghe được là “tiếng/tiếng nói”; “tiếng Ngài” tự nhiên và không thêm ý diễn giải.
- source_word: πώποτε ἀκηκόατε
  choice: chưa từng nghe
  rationale: Truyền đạt ý “chưa bao giờ, vào bất cứ lúc nào” của πώποτε dưới phủ định; không ép thì hoàn thành Hy Lạp vào một cấu trúc xa lạ trong tiếng Việt.
- source_word: εἶδος αὐτοῦ
  choice: hình dạng Ngài
  rationale: εἶδος chỉ hình thể hay diện mạo có thể thấy; “hình dạng” giữ độ rộng nghĩa và tránh diễn giải thần học quá mức.
- source_word: ἑωράκατε
  choice: chưa từng thấy
  rationale: Truyền đạt kinh nghiệm nhìn thấy bị phủ định cho đến hiện tại, song song tự nhiên với “chưa từng nghe”.
theological_decisions:
- issue: Sự nhấn mạnh của ἐκεῖνος khi nói về Cha
  choice: Diễn đạt bằng “chính Cha” trong câu chính.
  alternative: “Cha ấy” hoặc “chính Ngài” sau một dấu ngắt.
  rationale: Giữ trọng tâm rằng chính Cha là Đấng làm chứng về Đức Giê-su, nhưng dùng cú pháp tiếng Việt tự nhiên và không thêm khẳng định giáo lý ngoài văn bản.
- issue: Nghĩa của εἶδος αὐτοῦ
  choice: “hình dạng Ngài”
  alternative: “dáng vẻ Ngài” hoặc “diện mạo Ngài”
  rationale: Không quyết định quá mức liệu câu nói đến hình thể hữu hình, diện mạo hay sự biểu hiện có thể nhận biết; “hình dạng” giữ được độ căng và độ mở của nguyên văn.
- issue: Đối tượng được Đức Giê-su nói với trong động từ ngôi thứ hai số nhiều
  choice: “các ông”
  alternative: “anh em” hoặc đại từ số nhiều không biểu thị rõ trong tiếng Việt
  rationale: Ngữ cảnh tranh luận trong Giăng 5 phù hợp với cách xưng hô số nhiều “các ông”; lựa chọn này thể hiện ngôi thứ hai số nhiều mà không đồng nhất họ với một hệ phái hay nhóm rộng hơn ngoài ngữ cảnh.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “tôi” theo lời trực tiếp của Đức Giê-su và “Ngài” để quy chiếu tôn kính về Cha. Giữ hai dấu chú thích [a], [b] trong chính văn; kết câu bằng dấu chấm vì bản dịch được trình bày như một câu độc lập.
