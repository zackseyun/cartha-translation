id: JHN.5.13
reference: John 5:13
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ δὲ ἰαθεὶς οὐκ ᾔδει τίς ἐστιν, ὁ γὰρ Ἰησοῦς ἐξένευσεν ὄχλου ὄντος ἐν τῷ τόπῳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/013.yaml
  text: But the man who had been healed did not know who he was[a], for Jesus had withdrawn, since there was a crowd in the place.
translation:
  language: vi
  text: Nhưng người đã được chữa lành không biết người ấy là ai, vì Đức Giê-su đã lánh đi[a] giữa lúc nơi ấy có một đám đông.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “đã rút lui” hoặc “đã lẩn đi”. Động từ Hy Lạp gợi ý rằng Đức Giê-su rời đi mà không gây chú ý.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰαθεὶς
  choice: người đã được chữa lành
  rationale: Phân từ aorist bị động có mạo từ được dùng như danh từ. Cách dịch này giữ thể bị động và cho thấy việc chữa lành xảy ra trước động từ chính.
- source_word: οὐκ ᾔδει
  choice: không biết
  rationale: Cách diễn đạt tự nhiên, trực tiếp trong tiếng Việt cho ý nghĩa của οἶδα ở ngữ cảnh này.
- source_word: τίς ἐστιν
  choice: người ấy là ai
  rationale: Giữ tham chiếu cá nhân đến Đức Giê-su mà không thêm tước hiệu hay cách xưng hô mang hàm ý thần học.
- source_word: ἐξένευσεν
  choice: đã lánh đi
  rationale: Động từ ἐκνεύω gợi ý rời khỏi một cách kín đáo hoặc tránh khỏi sự chú ý. “Lánh đi” vừa trang trọng, tự nhiên, vừa giữ được sắc thái ấy.
- source_word: ὄχλου ὄντος
  choice: giữa lúc ... có một đám đông
  rationale: Kết cấu sở hữu cách tuyệt đối có thể diễn tả hoàn cảnh đi kèm và cũng hàm ý lý do. “Giữa lúc” giữ được độ mở ấy, không buộc câu chỉ mang nghĩa nguyên nhân.
- source_word: ἐν τῷ τόπῳ
  choice: nơi ấy
  rationale: Diễn đạt địa điểm rõ ràng, tự nhiên trong tiếng Việt và sát với cụm từ Hy Lạp.
theological_decisions: []
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Câu giữ quan hệ giải thích của γάρ, đồng thời không quyết định quá mức liệu kết cấu sở hữu cách tuyệt đối chỉ hoàn toàn cảnh hay nêu nguyên nhân.
