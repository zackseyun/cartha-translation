source:
  edition: SBLGNT
  text: ἄλλος ἐστὶν ὁ μαρτυρῶν περὶ ἐμοῦ, καὶ οἶδα ὅτι ἀληθής ἐστιν ἡ μαρτυρία ἣν μαρτυρεῖ περὶ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/032.yaml
  text: There is another who testifies about me[a], and I know that the testimony which he testifies about me is true.
translation:
  language: vi
  text: Có một người khác làm chứng về tôi, và tôi biết lời chứng người ấy đưa ra về tôi là thật.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄλλος
  choice: một Đấng khác
  rationale: ἄλλος chỉ một người khác, tương phản với chính Đức Giê-su trong mạch văn. “Một Đấng khác” tự nhiên trong văn phong Kinh Thánh tiếng Việt và không xác định cụ thể nhân vật ấy.
- source_word: ὁ μαρτυρῶν
  choice: làm chứng
  rationale: 'Phân từ hiện tại có mạo từ mang nghĩa danh từ: người đang làm chứng. “Làm chứng” là cách diễn đạt hiện đại, rõ ràng và giữ sắc thái pháp lý của đoạn văn.'
- source_word: περὶ ἐμοῦ
  choice: về tôi
  rationale: περί với sở hữu cách chỉ đối tượng hay nội dung được nói đến; “về tôi” là cách dịch trực tiếp và tự nhiên.
- source_word: οἶδα
  choice: tôi biết
  rationale: Cách tương đương thông dụng, trực tiếp của οἶδα.
- source_word: ἀληθής
  choice: thật
  rationale: Diễn tả lời chứng là đúng và đáng tin; “thật” giữ nguyên độ rộng nghĩa mà không diễn giải thêm thành “hợp lệ” hay “đáng tin cậy”.
- source_word: ἡ μαρτυρία
  choice: lời chứng
  rationale: “Lời chứng” là thuật ngữ tiếng Việt tự nhiên, giữ được sắc thái pháp lý và liên hệ từ vựng với động từ “làm chứng”.
- source_word: ἣν μαρτυρεῖ
  choice: mà Đấng ấy làm chứng
  rationale: Giữ mệnh đề quan hệ và sự lặp lại đặc trưng giữa danh từ “lời chứng” với động từ “làm chứng” trong nguyên văn.
theological_decisions:
- issue: Danh tính của ἄλλος (“Đấng khác”)
  choice: Không xác định danh tính trong bản dịch; dùng “một Đấng khác”.
  alternative: Giăng Báp-tít; Đức Chúa Cha; hoặc một nhân chứng khác theo nghĩa pháp lý.
  rationale: Câu này không nêu đích danh nhân vật, dù văn cảnh rộng hơn có thể định hướng cách hiểu. Bản dịch giữ nguyên mức độ không xác định của nguyên văn, không giải quyết thay người đọc.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Viết hoa “Đấng” và dùng “Đấng ấy” để chỉ một nhân vật có địa vị tôn kính mà không nêu danh tính. Giữ sự lặp “lời chứng… làm chứng” nhằm phản ánh cấu trúc và phong cách của nguyên văn.
