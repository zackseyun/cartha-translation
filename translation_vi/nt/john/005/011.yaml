source:
  edition: SBLGNT
  text: ⸂ὃς δὲ⸃ ἀπεκρίθη αὐτοῖς· Ὁ ποιήσας με ὑγιῆ ἐκεῖνός μοι εἶπεν Ἆρον τὸν κράβαττόν σου καὶ περιπάτει.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/011.yaml
  text: But he answered them[a], “The one who made me well—that one said to me[b], ‘Pick up your mat and walk.’”
translation:
  language: vi
  text: 'Nhưng ông trả lời họ: “Người đã làm cho tôi khỏe lại, chính người ấy đã bảo tôi: ‘Hãy nhấc tấm đệm của anh lên và bước đi.’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: trả lời
  rationale: Động từ tường thuật lời đáp; “trả lời” là cách diễn đạt trực tiếp và tự nhiên trong tiếng Việt hiện đại.
- source_word: Ὁ ποιήσας με ὑγιῆ
  choice: người đã chữa tôi lành
  rationale: Diễn đạt tự nhiên tác động khiến người bệnh trở lại tình trạng khỏe mạnh, đồng thời giữ trọng tâm vào sự chữa lành thể chất trong văn cảnh.
- source_word: ἐκεῖνός
  choice: chính người ... ấy
  rationale: Cấu trúc “chính ...” bảo lưu sắc thái nhấn mạnh của đại từ Hy Lạp mà không làm câu tiếng Việt gượng ép.
- source_word: Ἆρον
  choice: hãy nhấc ... lên
  rationale: Mệnh lệnh chỉ hành động cụ thể nâng vật đang nằm xuống; cách nói rõ ràng, tự nhiên.
- source_word: κράβαττόν
  choice: tấm đệm
  rationale: Chỉ tấm đệm nằm đơn sơ hoặc vật trải để ngủ, không nhất thiết là một chiếc giường có khung; “tấm đệm” dễ hiểu trong tiếng Việt hiện đại.
- source_word: περιπάτει
  choice: bước đi
  rationale: Bảo lưu mệnh lệnh đi lại trong bối cảnh người vừa được chữa lành; tự nhiên và trang trọng vừa phải.
- source_word: δὲ
  choice: Nhưng
  rationale: Thể hiện sự chuyển ý mang sắc thái đối lập nhẹ khi người được chữa lành đáp lại lời chất vấn.
theological_decisions:
- issue: Sắc thái của lời mô tả sự chữa lành
  choice: chữa tôi lành
  alternative: làm cho tôi được toàn vẹn
  rationale: Văn cảnh trực tiếp nói đến việc khỏi bệnh và có thể đi lại. “Chữa tôi lành” giữ ý cụ thể ấy, không thêm hàm ý về sự toàn vẹn thuộc linh mà câu Hy Lạp không nhất thiết khẳng định.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “ông” cho người đàn ông đã được chữa lành theo văn cảnh; câu trực tiếp giữ sắc thái nhấn mạnh của ἐκεῖνος bằng “chính”.
