    rationale: ἐν τῇ ἀσθενείᾳ αὐτοῦ nói người này ở trong tình trạng yếu/đau yếu của mình; tuy có thể là bệnh, câu này chưa xác định một bệnh cụ thể. “Đau yếu” bảo toàn sự mơ hồ đó tốt hơn.
  - severity: low
    issue: Cách diễn đạt chú thích “chịu cảnh đau yếu” không phải là phương án tương đương trực tiếp, tự nhiên nhất.
    rationale: Nên nêu các cách dịch trực tiếp như “trong tình trạng đau yếu,” “yếu nhược,” hoặc “bệnh tật” để làm rõ phạm vi nghĩa.
