- from: Có một người ở đó đã mang bệnh suốt ba mươi tám năm[a].
  to: Có một người ở đó đã bị đau yếu suốt ba mươi tám năm[a].
  rationale: Thay “đã mang bệnh” bằng “đã bị đau yếu” để phản ánh bao quát hơn ἀσθένεια, vẫn giữ tình trạng thể chất kéo dài và không xác định căn bệnh. Dấu phẩy không cần thiết vì mệnh đề quan hệ trong tiếng Việt có thể nối trực tiếp với “người”. Chú thích được chỉnh cho tự nhiên và bám sát các khả năng nghĩa của từ Hy Lạp.
