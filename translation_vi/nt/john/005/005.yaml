  source_fidelity: Bản nháp giữ đúng nhân vật không xác định, địa điểm, thời lượng ba mươi tám năm và tình trạng kéo dài. Tuy nhiên, “mang bệnh” thu hẹp ἀσθένεια hơi nhiều vào bệnh tật, trong khi từ này có thể chỉ rộng hơn là sự đau yếu/yếu nhược về thể chất.
  naturalness: “Có một người ở đó đã mang bệnh suốt...” dễ hiểu, nhưng “đã bị đau yếu suốt...” tự nhiên hơn trong văn xuôi hiện đại và phù hợp hơn với tình trạng được diễn tả.
  terminology: Dùng “đau yếu” ở bản văn chính giúp giữ độ bao quát của ἀσθένεια mà không suy đoán căn bệnh. Chú thích nêu các khả năng từ vựng còn lại một cách rõ ràng.
