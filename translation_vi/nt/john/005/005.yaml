base_translation:
  language: en
  yaml_path: translation/nt/john/005/005.yaml
  text: There was a man there who had been in his sickness for thirty-eight years[a].
translation:
  language: vi
  text: Có một người ở đó đã bị đau yếu suốt ba mươi tám năm[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “trong tình trạng yếu nhược” hoặc “bệnh tật”. Từ Hy Lạp ἀσθένεια có thể chỉ chung sự yếu đuối về thể chất hoặc bệnh tật.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν δέ
  choice: Có
  rationale: δέ là từ nối nhẹ để tiếp tục câu chuyện, không nhất thiết biểu thị sự tương phản; tiếng Việt tự nhiên có thể không diễn đạt riêng từ nối này.
- source_word: τις ἄνθρωπος
  choice: một người
  rationale: Cụm từ giới thiệu một nhân vật chưa xác định; “một người” tự nhiên và không thêm sắc thái cổ.
- source_word: ἐκεῖ
  choice: ở đó
  rationale: Giữ nguyên ý định vị nhân vật tại nơi vừa được nhắc đến trong ngữ cảnh.
- source_word: τριάκοντα ὀκτὼ ἔτη
  choice: ba mươi tám năm
  rationale: Cách diễn đạt số lượng thời gian chuẩn trong tiếng Việt hiện đại.
- source_word: ἔχων
  choice: đã mang ... suốt
  rationale: Phân từ hiện tại cùng khoảng thời gian chỉ tình trạng kéo dài đến thời điểm câu chuyện; “đã mang bệnh suốt” diễn đạt tự nhiên sắc thái liên tục ấy.
- source_word: ἐν τῇ ἀσθενείᾳ αὐτοῦ
  choice: mang bệnh
  rationale: ἀσθένεια có thể chỉ sự yếu đuối, đau yếu hoặc bệnh tật. Trong ngữ cảnh này, “mang bệnh” tự nhiên, giữ ý tình trạng thể chất kéo dài và không xác định cụ thể căn bệnh.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Cấu trúc “đã mang bệnh suốt” ưu tiên tiếng Việt tự nhiên nhưng vẫn giữ thời lượng và trạng thái kéo dài của nguyên văn; không suy diễn người này bị bại liệt hay mắc một bệnh cụ thể.
