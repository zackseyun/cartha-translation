id: JHN.5.21
reference: John 5:21
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὥσπερ γὰρ ὁ πατὴρ ἐγείρει τοὺς νεκροὺς καὶ ζῳοποιεῖ, οὕτως καὶ ὁ υἱὸς οὓς θέλει ζῳοποιεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/021.yaml
  text: For just as the Father raises the dead and gives life[b][a], so also the Son gives life to whom he wishes.
translation:
  language: vi
  text: Vì cũng như Cha khiến người chết sống lại và ban sự sống, thì Con cũng ban sự sống cho những ai Con muốn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch “làm cho sống” cho cả hai lần “ban sự sống”.
    reason: Nêu phương án từ vựng cho ζῳοποιεῖ, được dùng lặp lại trong cả hai vế của câu.
lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: Vì như
  rationale: Giữ γάρ với chức năng giải thích bằng “Vì” và mở đầu phép so sánh của ὥσπερ bằng “như”, tự nhiên trong tiếng Việt.
- source_word: ὁ πατὴρ
  choice: Cha
  rationale: Trong ngữ cảnh này, đây là danh xưng chỉ Đức Chúa Trời và đứng song song với “Con”; tiếng Việt không cần mạo từ.
- source_word: ἐγείρει τοὺς νεκρούς
  choice: khiến người chết sống lại
  rationale: Diễn đạt rõ nghĩa phục sinh của ἐγείρει trong ngữ cảnh, thay vì cách dịch sát chữ nhưng kém tự nhiên là “dựng người chết dậy”.
- source_word: ζῳοποιεῖ
  choice: ban sự sống
  rationale: Truyền đạt hành động làm cho sống hoặc ban sự sống, đồng thời có thể dùng nhất quán ở cả hai vế.
- source_word: οὕτως καὶ
  choice: thì ... cũng
  rationale: Cấu trúc tương ứng tự nhiên trong tiếng Việt, giữ phép song song “như… thì… cũng…” giữa Cha và Con.
- source_word: ὁ υἱὸς
  choice: Con
  rationale: Viết hoa như danh xưng trong quan hệ Cha–Con và giữ sức nặng Kitô học của câu.
- source_word: οὓς θέλει
  choice: cho những ai mình muốn
  rationale: Giữ nghĩa ý chí thực sự của θέλει bằng lối nói hiện đại; “mình” quy chiếu về chủ ngữ “Con” một cách tự nhiên.
theological_decisions:
- issue: Sự song song giữa Cha và Con trong việc ban sự sống
  choice: Giữ cấu trúc “như Cha… thì Con cũng…” và dùng cùng cụm “ban sự sống” cho hai lần ζῳοποιεῖ.
  alternative: Diễn ý lỏng hơn hoặc dùng hai động từ khác nhau, có thể làm yếu sự tương ứng trực tiếp.
  rationale: Cú pháp Hy Lạp chủ ý đặt hành động ban sự sống của Con song song với hành động của Cha; bản dịch giữ nguyên sức nặng ấy mà không thêm lời giải thích bản thể học.
- issue: Ý chí trong θέλει
  choice: mình muốn
  alternative: mình quyết định; mình muốn cho ai; tùy ý mình
  rationale: “Muốn” là từ hiện đại, rõ nghĩa và giữ yếu tố ý chí; không làm giảm quyền chủ động của Con cũng không diễn giải thêm phạm vi hay cơ sở của sự lựa chọn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc “Vì như… thì… cũng…” bảo toàn quan hệ giải thích và so sánh. Đại từ phản thân “mình” tự nhiên trong tiếng Việt; chú thích cung cấp phương án lặp lại “Con” nếu cần tránh khả năng quy chiếu mơ hồ.
