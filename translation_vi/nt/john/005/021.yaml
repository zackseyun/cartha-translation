  source_fidelity: Bản dịch giữ đúng cấu trúc so sánh–tương ứng của ὥσπερ γὰρ … οὕτως καὶ, phân biệt hành động “khiến người chết sống lại” (ἐγείρει) với “ban sự sống” (ζῳοποιεῖ), và bảo toàn ý chí chủ động trong οὓς θέλει. Tuy nhiên, đại từ “mình” trong “những ai mình muốn” tuy có thể quy chiếu về Con nhưng kém rõ trong văn phong trang trọng.
