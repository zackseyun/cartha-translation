  source_fidelity: Bản dịch giữ đúng mệnh đề phủ định khả năng, tương ứng giữa nghe và phán xét, tính công minh của sự phán xét, và sự đối lập giữa ý muốn của người nói với ý muốn của Đấng sai người nói. Tuy nhiên, “tự mình làm” chủ yếu gợi làm một mình/không có trợ giúp, trong khi ἀπ’ ἐμαυτοῦ trực tiếp nêu nguồn hay căn nguyên hành động. Nên đưa sắc thái này vào bản văn chính.
  naturalness: Câu văn hiện đại, rõ ràng và trang trọng. “Tôi nghe thế nào thì phán xét thế ấy” tự nhiên; “phán xét/sự phán xét” nhất quán. “Từ chính mình” hơi trang trọng nhưng tự nhiên trong văn cảnh Kinh Thánh và chính xác hơn ở đây.
  terminology: “Phán xét” phản ánh tốt κρίνω và liên kết với κρίσις; “công minh” phù hợp với δικαία trong bối cảnh xét xử. “Ý muốn” dịch θέλημα chính xác. “Đấng đã sai tôi” giữ cách quy chiếu phân từ của nguyên ngữ, không thêm danh xưng diễn giải.
