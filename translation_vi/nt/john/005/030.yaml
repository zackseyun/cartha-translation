id: JHN.5.30
reference: John 5:30
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Οὐ δύναμαι ἐγὼ ποιεῖν ἀπ’ ἐμαυτοῦ οὐδέν· καθὼς ἀκούω κρίνω, καὶ ἡ κρίσις ἡ ἐμὴ δικαία ἐστίν, ὅτι οὐ ζητῶ τὸ θέλημα τὸ ἐμὸν ἀλλὰ τὸ θέλημα τοῦ πέμψαντός ⸀με.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/030.yaml
  text: I am not able to do anything from myself. Just as I hear[a], I judge, and my judgment is just, because I do not seek my own will, but the will of the one who sent me.
translation:
  language: vi
  text: Tôi không thể làm bất cứ điều gì từ chính mình[a]. Tôi nghe thế nào thì phán xét thế ấy, và sự phán xét của tôi là công minh, vì tôi không tìm ý muốn riêng của mình, nhưng tìm ý muốn của Đấng đã sai tôi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “tự mình.” Cụm từ Hy Lạp nhấn mạnh rằng hành động không xuất phát từ chính Chúa Giê-su và không độc lập với Đấng đã sai Người.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐ δύναμαι ἐγὼ
  choice: Tôi không thể
  rationale: Diễn đạt trực tiếp khả năng bị phủ định của δύναμαι; đại từ “Tôi” giữ chủ thể được nêu rõ và nhấn mạnh trong tiếng Hy Lạp.
- source_word: ποιεῖν ἀπ’ ἐμαυτοῦ οὐδέν
  choice: tự mình làm bất cứ điều gì
  rationale: “Tự mình” là cách nói tự nhiên trong tiếng Việt về hành động độc lập; dưới cấu trúc phủ định, “bất cứ điều gì” truyền đạt οὐδέν rõ ràng. Chú thích giữ thêm sắc thái nguồn gốc của ἀπό.
- source_word: καθὼς ἀκούω
  choice: Tôi nghe thế nào thì ... thế ấy
  rationale: Cấu trúc tương liên “thế nào thì… thế ấy” diễn đạt rõ sự tương ứng do καθώς biểu thị, đồng thời giữ nghĩa hiện tại, khái quát của ἀκούω.
- source_word: κρίνω / ἡ κρίσις ἡ ἐμὴ
  choice: phán xét / sự phán xét của tôi
  rationale: Dùng cùng một gốc từ trong tiếng Việt để giữ liên hệ từ vựng giữa động từ κρίνω và danh từ κρίσις, cũng như sắc thái tư pháp trong ngữ cảnh.
- source_word: δικαία
  choice: công minh
  rationale: Khi bổ nghĩa cho “sự phán xét”, “công minh” là cách nói tự nhiên, nhấn mạnh sự đúng đắn và không thiên vị của việc xét xử.
- source_word: οὐ ζητῶ
  choice: tôi không tìm
  rationale: Giữ hình ảnh và nghĩa hướng tới, theo đuổi của ζητέω mà không diễn giải thành cảm xúc hay sở thích.
- source_word: τὸ θέλημα τὸ ἐμὸν
  choice: ý muốn riêng của mình
  rationale: “Riêng” phản ánh sắc thái nhấn mạnh của sở hữu từ ἐμόν, còn “ý muốn” giữ nội dung ý chí của θέλημα.
- source_word: ἀλλὰ τὸ θέλημα τοῦ πέμψαντός με
  choice: nhưng tìm ý muốn của Đấng đã sai tôi
  rationale: Lặp lại “tìm” để câu tiếng Việt rõ và cân đối; “Đấng đã sai tôi” giữ nguyên cách diễn tả bằng phân từ của bản Hy Lạp, không thay bằng danh xưng không có trong câu.
theological_decisions:
- issue: Mối liên hệ giữa hành động của Con và Đấng sai Con trong ἀπ’ ἐμαυτοῦ
  choice: “tự mình” với chú thích nêu sắc thái “từ chính mình”
  alternative: “từ chính mình” hoặc “theo ý riêng mình”
  rationale: Cách dịch chính tự nhiên trong tiếng Việt và biểu thị việc không hành động độc lập; chú thích bảo tồn khả năng nhấn mạnh nguồn gốc mà không giải thích quá mức hay biến câu thành lời phủ nhận năng lực tuyệt đối.
- issue: Sắc thái của δικαία khi đi với κρίσις
  choice: “công minh”
  alternative: “công chính” hoặc “đúng đắn”
  rationale: “Công minh” phù hợp trực tiếp với bối cảnh phán xét và truyền đạt tính công bằng, đúng đắn; lựa chọn này không loại trừ nội hàm đạo đức của δικαία.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc “thế nào thì… thế ấy” giúp câu tự nhiên trong tiếng Việt; “phán xét/sự phán xét” duy trì tính nhất quán từ vựng và sắc thái tư pháp.
