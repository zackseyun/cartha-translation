  to: Tôi không thể làm bất cứ điều gì từ chính mình[a]. Tôi nghe thế nào thì phán xét thế ấy, và sự phán xét của tôi là công minh, vì tôi không tìm ý muốn riêng của mình, nhưng tìm ý muốn của Đấng đã sai tôi.
