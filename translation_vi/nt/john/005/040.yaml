id: JHN.5.40
reference: John 5:40
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ οὐ θέλετε ἐλθεῖν πρός με ἵνα ζωὴν ἔχητε.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/040.yaml
  text: Yet you are not willing to come to me so that you may have life[a][b].
translation:
  language: vi
  text: Nhưng các ông không muốn đến với tôi để có sự sống[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Và các ông không muốn đến với tôi để có sự sống.” Liên từ Hy Lạp καί thường có nghĩa đơn giản là “và”, nhưng tại đây cũng có thể mang sắc thái tương phản.'
    reason: lexical_alternative
  - marker: b
    text: Trong sách Giăng, “sự sống” thường mang ý nghĩa đầy đủ hơn là sự sống đến từ Đức Chúa Trời, tức sự sống đời đời, dù từ “đời đời” không được nêu trong câu này.
    reason: cross_reference
lexical_decisions:
- source_word: καὶ
  choice: Nhưng
  rationale: καί thường có nghĩa là “và”, nhưng trong ngữ cảnh này mang sắc thái tương phản với lời vừa nói trước đó; “nhưng” diễn đạt tự nhiên sự đối lập ấy trong tiếng Việt.
- source_word: οὐ θέλετε
  choice: các ông không muốn
  rationale: θέλω chỉ ý muốn, sự mong muốn hoặc sẵn lòng. “Không muốn” giữ được trọng tâm ý chí mà không tăng mạnh thành “khước từ”.
- source_word: ἐλθεῖν πρός με
  choice: đến với tôi
  rationale: Cụm ἐλθεῖν với πρός và đối cách có nghĩa tự nhiên là “đến với” một người. Cách dịch này giữ nguyên hình ảnh của bản văn thay vì diễn giải thành “tin tôi”.
- source_word: ἵνα ζωὴν ἔχητε
  choice: để có sự sống
  rationale: ἵνα nêu mục đích, được diễn đạt gọn và tự nhiên bằng “để”. Trong tiếng Việt, chủ thể của “có” đã rõ từ mệnh đề chính nên không cần lặp lại “các ông”.
- source_word: ζωὴν
  choice: sự sống
  rationale: ζωή là “sự sống”. Trong Giăng, từ này thường có chiều sâu chỉ sự sống đến từ Đức Chúa Trời, nhưng câu này không có tính từ “đời đời”, nên không thêm vào chính văn.
theological_decisions:
- issue: Dịch ζωὴν là “sự sống” hay “sự sống đời đời”
  choice: sự sống
  alternative: sự sống đời đời
  rationale: Ngữ cảnh sách Giăng thường trao cho ζωή ý nghĩa cứu rỗi sâu rộng, nhưng αἰώνιος (“đời đời”) không xuất hiện trong câu này. Giữ “sự sống” tránh thêm một định ngữ đúng về thần học nhưng không được phát biểu ở đây.
- issue: Có nên diễn giải “đến với tôi” thành hành động tin hay không
  choice: đến với tôi
  alternative: tin tôi; đến với tôi bằng đức tin
  rationale: Trong sách Giăng, đến với Chúa Giê-xu gắn chặt với việc tin, nhưng nguyên văn vẫn dùng động từ cụ thể “đến”. Giữ cách nói này bảo toàn hình ảnh và không biến sự diễn giải thành chính văn.
- issue: Đại từ ngôi thứ hai số nhiều trong lời quở trách
  choice: các ông
  alternative: các ngươi; anh em
  rationale: “Các ông” biểu thị số nhiều, phù hợp lời Chúa Giê-xu nói với những người đối thoại và giữ giọng nghiêm mà không quá cổ hoặc hàm ý thân tình.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “các ông” để thể hiện ngôi thứ hai số nhiều trong bối cảnh tranh luận; giữ nguyên hình ảnh “đến với tôi” và không thêm “đời đời” vào chính văn.
