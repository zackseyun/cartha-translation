source:
  edition: SBLGNT
  text: ἀλλὰ ἔγνωκα ὑμᾶς ὅτι τὴν ἀγάπην τοῦ θεοῦ οὐκ ἔχετε ἐν ἑαυτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/042.yaml
  text: 'But I know you: you do not have the love of God in yourselves.'
translation:
  language: vi
  text: 'Nhưng tôi biết các ông: các ông không có tình yêu của Đức Chúa Trời trong chính các ông.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch rõ hơn: “các ông không có lòng yêu kính Đức Chúa Trời trong chính các ông.” Cụm Hy Lạp cũng có thể được hiểu rộng hơn là “tình yêu đến từ Đức Chúa Trời” hoặc “tình yêu của Ngài.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλὰ
  choice: Nhưng
  rationale: Đánh dấu sự tương phản rõ với ngữ cảnh trước và là cách diễn đạt đối lập tự nhiên, ngắn gọn trong tiếng Việt.
- source_word: ἔγνωκα
  choice: tôi biết
  rationale: Thì hoàn thành diễn tả sự hiểu biết đã được xác lập; hiện tại “tôi biết” truyền đạt tự nhiên giá trị trạng thái ấy.
- source_word: ὑμᾶς
  choice: các ông
  rationale: Đại từ số nhiều chỉ những người đang đối thoại với Đức Giê-su; “các ông” làm rõ số nhiều và phù hợp với lời quở trách trực tiếp.
- source_word: ὅτι
  choice: ':'
  rationale: Dấu hai chấm giới thiệu nội dung Đức Giê-su biết về họ một cách tự nhiên, tương ứng với mệnh đề do ὅτι dẫn vào.
- source_word: τὴν ἀγάπην τοῦ θεοῦ
  choice: tình yêu của Đức Chúa Trời
  rationale: Giữ cấu trúc sở hữu tương đối sát nguyên ngữ, không quyết định dứt khoát đó là tình yêu dành cho Đức Chúa Trời hay tình yêu đến từ/ngự nơi Đức Chúa Trời.
- source_word: οὐκ ἔχετε
  choice: không có
  rationale: Diễn đạt trực tiếp trạng thái phủ định ở hiện tại.
- source_word: ἐν ἑαυτοῖς
  choice: trong chính mình
  rationale: Thể hiện chiều hướng nội tại của giới từ ἐν với đại từ phản thân số nhiều; trong tiếng Việt, cụm này tự nhiên hơn “trong chính các ông” khi chủ ngữ đã là “các ông”.
theological_decisions:
- issue: Ý nghĩa của sở hữu cách trong τὴν ἀγάπην τοῦ θεοῦ
  choice: Giữ “tình yêu của Đức Chúa Trời” trong chính văn.
  alternative: “lòng yêu kính Đức Chúa Trời” hoặc “tình yêu đến từ Đức Chúa Trời/tình yêu của Ngài”
  rationale: Sở hữu cách Hy Lạp có thể chỉ tình yêu hướng về Đức Chúa Trời hoặc tình yêu bắt nguồn từ, thuộc về Ngài. Ngữ cảnh nghiêng về việc họ không yêu kính Đức Chúa Trời thật lòng, nhưng chính văn giữ độ mở thực có của nguyên ngữ và chú thích nêu các cách hiểu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Trời” cho θεός; “các ông” thể hiện rõ số nhiều của ὑμᾶς. Đưa “trong chính mình” lên trước để câu tiếng Việt bớt gượng, đồng thời vẫn giữ sắc thái nội tại của nguyên ngữ.
