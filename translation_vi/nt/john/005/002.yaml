id: JHN.5.2
reference: John 5:2
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἔστιν δὲ ἐν τοῖς Ἱεροσολύμοις ἐπὶ τῇ προβατικῇ κολυμβήθρα ἡ ἐπιλεγομένη Ἑβραϊστὶ ⸀Βηθεσδά, πέντε στοὰς ἔχουσα·
base_translation:
  language: en
  yaml_path: translation/nt/john/005/002.yaml
  text: There is in Jerusalem[a], by the Sheep Gate, a pool called Bethesda in Hebrew[c][b], having five porticoes.
translation:
  language: vi
  text: Tại Giê-ru-sa-lem, gần Cổng Chiên[c], có một hồ gọi theo tiếng Hê-bơ-rơ[a] là Bết-xê-đa[b], với năm hành lang có mái che.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể hiểu là “theo tiếng A-ram”; trong sách Giăng, cách nói “tiếng Hê-bơ-rơ” thường chỉ ngôn ngữ Semit địa phương tại Giu-đê, chứ không nhất thiết chỉ riêng tiếng Hê-bơ-rơ cổ điển.
    reason: lexical_alternative
  - marker: b
    text: Một số thủ bản chép “Bết-xa-tha” hoặc “Bết-sai-đa” thay cho “Bết-xê-đa.”
    reason: textual_variant
  - marker: c
    text: Tiếng Hy Lạp có lẽ chỉ khu vực Cổng Chiên (so sánh Nê-hê-mi 3:1; 12:39); danh từ “Cổng” được hiểu ngầm, chứ không xuất hiện rõ trong câu này.
    reason: cross_reference
lexical_decisions:
- source_word: ἔστιν δὲ
  choice: có
  rationale: Giữ thì hiện tại của ἔστιν; δέ là từ nối nhẹ và không cần dịch thành một trạng từ thời gian riêng trong tiếng Việt.
- source_word: ἐν τοῖς Ἱεροσολύμοις
  choice: tại Giê-ru-sa-lem
  rationale: Dùng địa danh quen thuộc ở dạng số ít tự nhiên trong tiếng Việt.
- source_word: ἐπὶ τῇ προβατικῇ
  choice: gần Cổng Chiên[c]
  rationale: Cụm Hy Lạp mang tính tỉnh lược; trong bối cảnh địa hình Giê-ru-sa-lem, nhiều khả năng chỉ khu vực Cổng Chiên. Chú thích nêu rõ danh từ “Cổng” được hiểu ngầm.
- source_word: κολυμβήθρα
  choice: một hồ
  rationale: “Hồ” là cách gọi ngắn gọn, tự nhiên cho một hồ chứa hoặc hồ nước trong bối cảnh này.
- source_word: ἡ ἐπιλεγομένη
  choice: gọi
  rationale: Diễn đạt tự nhiên chức năng của phân từ chỉ tên gọi.
- source_word: Ἑβραϊστὶ
  choice: theo tiếng Hê-bơ-rơ[a]
  rationale: Giữ cách gọi trực tiếp của nguyên văn, đồng thời chú thích khả năng từ này chỉ tiếng A-ram địa phương.
- source_word: Βηθεσδά
  choice: Bết-xê-đa[b]
  rationale: Phiên âm dạng Βηθεσδά của SBLGNT; các dị bản tên riêng được ghi ở chú thích.
- source_word: πέντε στοὰς ἔχουσα
  choice: với năm hành lang có mái che
  rationale: στοά chỉ hành lang có mái che, thường có hàng cột; cách diễn đạt này rõ nghĩa với độc giả phổ thông và vẫn giữ chi tiết kiến trúc.
theological_decisions: []
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Cấu trúc được sắp xếp tự nhiên theo tiếng Việt; dùng “hành lang có mái che” thay cho thuật ngữ kiến trúc ít quen thuộc. Mọi điểm không chắc chắn về ngôn ngữ, địa danh và dị bản đều được giữ trong chú thích.
