id: JHN.5.44
reference: John 5:44
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: πῶς δύνασθε ὑμεῖς πιστεῦσαι, δόξαν παρ’ ἀλλήλων λαμβάνοντες, καὶ τὴν δόξαν τὴν παρὰ τοῦ μόνου θεοῦ οὐ ζητεῖτε;
base_translation:
  language: en
  yaml_path: translation/nt/john/005/044.yaml
  text: How are you able to believe[c][b][a], receiving glory from one another and not seeking the glory that is from the only God?
translation:
  language: vi
  text: Làm sao các ông có thể tin được khi cứ nhận vinh quang từ nhau mà không tìm kiếm vinh quang đến từ Đức Chúa Trời duy nhất?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay “danh dự” ở cả hai chỗ có từ “vinh quang” (Hy Lạp: δόξα).'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “Làm sao các ông có thể tin…?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: πῶς δύνασθε ὑμεῖς πιστεῦσαι
  choice: Làm sao các ông có thể tin được
  rationale: Câu hỏi tu từ nói về khả năng tin. “Có thể… được” diễn đạt rõ δύνασθε, còn “các ông” chuyển tải đại từ số nhiều ὑμεῖς trong ngữ cảnh Chúa Giê-su đang chất vấn những người đối thoại.
- source_word: δόξαν
  choice: vinh quang
  rationale: Giữ cùng một từ ở cả hai lần xuất hiện để bảo toàn sự lặp lại và thế tương phản giữa điều đến từ con người với điều đến từ Đức Chúa Trời; “danh dự” cũng là một nghĩa phù hợp theo ngữ cảnh.
- source_word: παρ’ ἀλλήλων λαμβάνοντες
  choice: khi cứ nhận vinh quang từ nhau
  rationale: “Khi” nối tự nhiên phân từ λαμβάνοντες với động từ chính; “cứ nhận” thể hiện tư thế hoặc hành vi tiếp diễn, còn “từ nhau” giữ ý hỗ tương của ἀλλήλων.
- source_word: καὶ ... οὐ ζητεῖτε
  choice: mà không tìm kiếm
  rationale: Trong tiếng Việt, “mà” biểu đạt tự nhiên sự tương phản ngầm giữa việc nhận vinh quang từ nhau và không tìm kiếm vinh quang từ Đức Chúa Trời.
- source_word: τὴν δόξαν τὴν παρὰ τοῦ μόνου θεοῦ
  choice: vinh quang đến từ Đức Chúa Trời duy nhất
  rationale: “Đến từ” diễn đạt nguồn gốc do παρά chỉ ra; “Đức Chúa Trời duy nhất” chuyển tải trực tiếp tính độc nhất của μόνος mà không thêm nội dung thần học ngoài văn bản.
theological_decisions:
- issue: Ý nghĩa của πιστεῦσαι trong văn mạch Giăng
  choice: tin
  alternative: tin cậy
  rationale: “Tin” là cách dịch rộng, quen thuộc của πιστεύω và không thu hẹp từ này vào một sắc thái thần học riêng.
- issue: Cách dịch δόξα ở cả hai vế
  choice: vinh quang
  alternative: danh dự
  rationale: Dùng “vinh quang” nhất quán bảo toàn sự lặp từ và sức căng giữa vinh quang có nguồn từ con người với vinh quang có nguồn từ Đức Chúa Trời.
- issue: Cách dịch τοῦ μόνου θεοῦ
  choice: Đức Chúa Trời duy nhất
  alternative: Đức Chúa Trời, Đấng duy nhất
  rationale: Bản dịch trực tiếp khẳng định tính độc nhất của Đức Chúa Trời theo câu Hy Lạp, không suy diễn thêm theo hướng Kitô học hay phản Kitô học.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Các ông” phù hợp với lời chất vấn trực tiếp một nhóm nam giới trong văn mạch; cấu trúc “khi cứ… mà không…” tự nhiên trong tiếng Việt và giữ quan hệ lập luận của câu Hy Lạp.
