base_translation:
  language: en
  yaml_path: translation/nt/john/005/017.yaml
  text: But he answered them[a], “My Father is working until now, and I also am working.”
translation:
  language: vi
  text: 'Nhưng Ngài trả lời họ: “Cha Ta vẫn làm việc cho đến bây giờ, và Ta cũng làm việc.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: Nhưng
  rationale: Đánh dấu sự tương phản nhẹ với lời cáo buộc ở ngữ cảnh trước, đồng thời dẫn vào lời đáp của Chúa Giê-su.
- source_word: ἀπεκρίνατο αὐτοῖς
  choice: Ngài đáp lời họ
  rationale: Diễn đạt tự nhiên động từ trung gian hình thức cùng bổ ngữ gián tiếp, với đại từ tôn kính phù hợp văn phong Kinh Thánh tiếng Việt.
- source_word: Ὁ πατήρ μου
  choice: Cha Ta
  rationale: Giữ cách xưng hô trực tiếp, thân mật và hàm lực thần học của lời Chúa Giê-su nói về Đức Chúa Cha.
- source_word: ἕως ἄρτι
  choice: cho đến bây giờ
  rationale: Phản ánh trực tiếp ý nghĩa hành động tiếp diễn tới thời điểm hiện tại.
- source_word: ἐργάζεται
  choice: vẫn làm việc
  rationale: Từ “vẫn” thể hiện hành động liên tục đến hiện tại một cách tự nhiên trong tiếng Việt.
- source_word: κἀγὼ
  choice: và Ta cũng
  rationale: Bảo toàn sắc thái bổ sung và sự song song có chủ ý giữa hoạt động của Cha với hoạt động của Chúa Giê-su.
- source_word: ἐργάζομαι
  choice: làm việc
  rationale: Đi cùng “cũng” và mệnh đề trước để diễn đạt hành động hiện đang tiếp diễn mà không khiến câu tiếng Việt nặng nề.
theological_decisions:
- issue: Mối liên hệ giữa công việc của Chúa Giê-su và công việc của Cha trong ngày Sa-bát
  choice: 'Giữ nguyên sự song song trực tiếp: “Cha Ta vẫn làm việc cho đến bây giờ, và Ta cũng làm việc.”'
  alternative: Diễn giải thêm rằng Cha và Chúa Giê-su vẫn đang hành động trong ngày Sa-bát.
  rationale: Bản Hy Lạp đặt hai hoạt động song song có chủ ý. Bản dịch giữ nguyên sức căng thần học ấy, không thêm lời giải thích về đặc quyền thần linh, ngày Sa-bát hay sự bình đẳng.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “Ngài” trong lời dẫn và “Ta” trong lời trực tiếp để giữ sắc thái tôn kính; cấu trúc gọn và bảo toàn tính song song của nguyên văn.
