  verdict: revise
  source_fidelity: 'Bản dịch bảo toàn đầy đủ các thành tố chính của câu Hy Lạp: δέ được phản ánh bằng “Nhưng”; ἕως ἄρτι và hai động từ thì hiện tại được diễn đạt bằng “vẫn làm việc cho đến bây giờ” và “cũng làm việc”; κἀγώ được giữ bằng “và Ta cũng”. Sự song song giữa công việc của Cha và của Chúa Giê-su được duy trì, không thêm diễn giải thần học.'
  naturalness: Câu trích dẫn tự nhiên, trang trọng và rõ nghĩa trong tiếng Việt hiện đại. Tuy nhiên, “đáp lời họ” hơi kém tự nhiên trong lời dẫn hiện đại; “trả lời họ” là cách dùng thông dụng và trực tiếp hơn.
  terminology: “Ngài” trong lời dẫn, “Cha Ta” và “Ta” trong lời trực tiếp là nhất quán với văn phong Kinh Thánh trang trọng và giữ được quan hệ đặc biệt mà Ὁ πατήρ μου diễn đạt. “Làm việc” phản ánh đúng ἐργάζομαι/ἐργάζεται. Không cần chú thích tiếng Việt về lựa chọn thì, vì tiếng Việt không đối lập thì hiện tại đơn và hiện tại tiếp diễn theo cách tiếng Anh.
