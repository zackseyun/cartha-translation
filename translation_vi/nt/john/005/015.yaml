  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀπῆλθεν ὁ ἄνθρωπος καὶ ⸀ἀνήγγειλεν τοῖς Ἰουδαίοις ὅτι Ἰησοῦς ἐστιν ὁ ποιήσας αὐτὸν ὑγιῆ.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/015.yaml
  text: The man went away and reported to the Jews that Jesus was the one who had made him well[a].
translation:
  language: vi
  text: Người đàn ông ấy đi khỏi đó, rồi báo cho người Do Thái[a] biết rằng Giê-su chính là người đã làm cho ông được lành.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể hiểu là “các nhà lãnh đạo Do Thái” hoặc “người Giu-đê”, tùy theo cách hiểu về cách Giăng dùng cụm từ “người Do Thái” trong ngữ cảnh này.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπῆλθεν
  choice: đi khỏi đó
  rationale: Diễn đạt tự nhiên hành động rời khỏi nơi đang ở; “đó” được thêm theo ngữ cảnh, không làm thay đổi ý nghĩa.
- source_word: ὁ ἄνθρωπος
  choice: Người ấy
  rationale: Chỉ người đàn ông vừa được chữa lành đã được nhắc đến trong mạch truyện; cách nói này tự nhiên và tránh lặp nặng nề.
- source_word: ἀνήγγειλεν
  choice: báo cho ... biết
  rationale: Phù hợp nghĩa truyền đạt hay báo lại thông tin, không hàm ý một lời công bố rộng rãi như “loan báo”.
- source_word: τοῖς Ἰουδαίοις
  choice: cho người Do Thái
  rationale: Giữ cách gọi trực tiếp của bản Hy Lạp, không thu hẹp ngay trong chính văn thành giới lãnh đạo; sắc thái ngữ cảnh được nêu trong chú thích.
- source_word: ὅτι
  choice: rằng
  rationale: Liên từ tự nhiên để dẫn nội dung được báo lại.
- source_word: Ἰησοῦς
  choice: Đức Giê-su
  rationale: Dùng hình thức tên gọi trang trọng, quen thuộc trong văn phong Kinh Thánh tiếng Việt hiện đại.
- source_word: ἐστιν
  choice: chính là
  rationale: Giữ lực xác định của cấu trúc Hy Lạp và làm câu gián tiếp tự nhiên trong tiếng Việt; tiếng Việt không cần lùi thì như tiếng Anh.
- source_word: ὁ ποιήσας
  choice: người đã làm cho
  rationale: Phản ánh phân từ có mạo từ chỉ tác nhân và hành động xảy ra trước việc báo tin, không thay trực tiếp động từ ποιέω bằng “chữa lành”.
- source_word: αὐτὸν ὑγιῆ
  choice: ông được lành
  rationale: Diễn đạt tự nhiên tình trạng hồi phục sức khỏe; đại từ “ông” quy chiếu về người được chữa lành trong câu.
theological_decisions:
- issue: Đối tượng được gọi là τοῖς Ἰουδαίοις trong Tin Mừng Giăng
  choice: Giữ “người Do Thái” trong chính văn và đặt dấu chú thích.
  alternative: “các nhà lãnh đạo Do Thái” hoặc “người Giu-đê”
  rationale: Từ Hy Lạp có nghĩa trực tiếp là người Do Thái/người Giu-đê, nhưng trong một số ngữ cảnh của Giăng có thể đặc biệt chỉ giới lãnh đạo Do Thái. Chính văn giữ độ rộng của nguyên bản, còn chú thích bảo tồn các khả năng ngữ cảnh mà không quyết đoán quá mức.
translation_notes:
  register: Văn phong tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Cấu trúc “báo cho ... biết rằng” tự nhiên trong lời kể; “được lành” giữ sắc thái chữa lành của ngữ cảnh. Dấu chú thích [a] xuất hiện ngay sau mệnh đề liên quan.
