  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀπεκρίθη αὐτῷ ὁ ἀσθενῶν· Κύριε, ἄνθρωπον οὐκ ἔχω ἵνα ὅταν ταραχθῇ τὸ ὕδωρ βάλῃ με εἰς τὴν κολυμβήθραν· ἐν ᾧ δὲ ἔρχομαι ἐγὼ ἄλλος πρὸ ἐμοῦ καταβαίνει.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/007.yaml
  text: The sick man answered him, “Lord, I have no one to put me into the pool when the water is stirred up; but while I am coming, another goes down before me.”
translation:
  language: vi
  text: 'Người bệnh đáp lại Người: “Lạy Chúa, tôi không có ai đưa tôi vào bể nước khi nước bị khuấy động; nhưng mỗi khi tôi đang đến thì một người khác xuống trước tôi.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κύριε
  choice: Lạy Chúa
  rationale: Giữ cách xưng hô kính trọng và khả năng mang ý nghĩa thần học của κύριε trong văn mạch Gioan, không hạ xuống thành một cách gọi thuần túy xã giao.
- source_word: βάλῃ με εἰς τὴν κολυμβήθραν
  choice: đưa tôi xuống hồ
  rationale: Diễn đạt tự nhiên hành động giúp người bệnh vào hồ; tránh sắc thái thô hoặc gây hiểu lầm của cách dịch máy móc là “ném tôi vào hồ”.
- source_word: ὅταν ταραχθῇ τὸ ὕδωρ
  choice: khi nước khuấy động
  rationale: Giữ thể bị động và hiện tượng được mô tả, không bổ sung tác nhân gây khuấy nước vốn không có trong câu.
- source_word: ἐν ᾧ δὲ ἔρχομαι ἐγώ
  choice: trong lúc tôi đang đến
  rationale: Phản ánh tiến trình người bệnh tự tìm cách đến hồ, đồng thời giữ sự tương phản với người khác xuống trước.
- source_word: καταβαίνει
  choice: đã xuống
  rationale: Trong lời kể trực tiếp, tiếng Việt dùng “đã” tự nhiên để biểu thị người khác hoàn tất việc xuống trước ông; ý lặp lại theo hoàn cảnh vẫn được văn mạch bảo toàn.
theological_decisions:
- issue: Sắc thái của Κύριε khi người bệnh thưa với Đức Giê-su
  choice: Lạy Chúa
  alternative: Thưa ông
  rationale: Κύριε có thể là lời thưa kính trọng hoặc tước hiệu “Chúa”. Trong văn mạch thần học của Gioan và theo lớp tham khảo đã được duyệt, chọn “Lạy Chúa” nhưng không thêm lời giải thích nhằm ép người nói phải có sự nhận biết đầy đủ về căn tính Đức Giê-su.
- issue: Tác nhân làm nước khuấy động
  choice: Không nêu tác nhân
  alternative: Khi thiên sứ khuấy nước
  rationale: Bản SBLGNT của câu này chỉ nói nước được khuấy động; không đưa dị bản mở rộng của Giăng 5:3b–4 vào bản văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “người bệnh” thay cho cách gọi dễ mang sắc thái kỳ thị; câu thoại giữ nhịp tự nhiên của lời than bất lực.
