revisions:
- from: 'Người bệnh đáp: “Lạy Chúa, tôi không có ai đưa tôi xuống hồ khi nước khuấy động; trong lúc tôi đang đến thì người khác đã xuống trước tôi rồi.”'
  to: 'Người bệnh đáp lại Người: “Lạy Chúa, tôi không có ai đưa tôi vào bể nước khi nước bị khuấy động; nhưng mỗi khi tôi đang đến thì một người khác xuống trước tôi.”'
  rationale: Chỉnh tối thiểu để phục hồi αὐτῷ, diễn đạt đúng bị động của ταραχθῇ, dùng «bể nước» cho κολυμβήθρα, và tránh làm καταβαίνει thành một hành động quá khứ đã hoàn tất. Không bổ sung tác nhân khuấy nước hoặc bất kỳ nội dung nào từ dị bản Giăng 5:3b–4.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T05:37:36Z'
review_pass:
  verdict: revise
  source_fidelity: Bản dịch truyền đạt đúng tình cảnh người bệnh không có người giúp vào bể khi nước bị khuấy động và người khác xuống trước ông. Tuy nhiên, «đáp» bỏ mất đối tượng αὐτῷ («Người»), «khi nước khuấy động» chưa diễn đạt rõ bị động ταραχθῇ, và «đã xuống ... rồi» làm hiện tại καταβαίνει dễ bị hiểu là một sự kiện đã hoàn tất thay vì điều xảy ra lặp lại trong lúc ông đến.
  naturalness: Câu sửa dùng «bể nước», phù hợp với κολυμβήθρα hơn «hồ» trong ngữ cảnh này; «nước bị khuấy động» tự nhiên và rõ nghĩa. Cấu trúc «mỗi khi ... thì ...» diễn tả mạch lời than về hoàn cảnh tái diễn cách tự nhiên trong tiếng Việt.
  terminology: Giữ «Lạy Chúa» theo quyết định đối chiếu tiếng Anh, đồng thời không thêm diễn giải về mức độ nhận biết của người bệnh. «Bể nước» là cách gọi trung tính, hiện đại cho hồ/bể dùng để ngâm tắm.
  issues:
  - severity: medium
    issue: Thiếu đối tượng trong «Người bệnh đáp».
    rationale: Nguyên ngữ có ἀπεκρίθη αὐτῷ, nghĩa là «đáp Người/đáp lại Người». Cần phục hồi để giữ quan hệ đối thoại.
  - severity: low
    issue: «Nước khuấy động» không thể hiện rõ thể bị động.
    rationale: ταραχθῇ τὸ ὕδωρ nghĩa là «nước bị khuấy động», không nêu tác nhân.
  - severity: medium
    issue: «Đã xuống trước tôi rồi» dễ chuyển hiện tại καταβαίνει thành quá khứ hoàn tất.
    rationale: Câu Hy Lạp mô tả điều người khác xảy ra trước ông trong khi ông đang đến; cách nói hiện tại tổng quát trong tiếng Việt giữ sắc thái này tốt hơn.
  revised_text: 'Người bệnh đáp lại Người: “Lạy Chúa, tôi không có ai đưa tôi vào bể nước khi nước bị khuấy động; nhưng mỗi khi tôi đang đến thì một người khác xuống trước tôi.”'
