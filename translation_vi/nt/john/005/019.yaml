    rationale: Lặp lại «Cha» trong mệnh đề đối chiếu làm rõ quy chiếu và vẫn bảo toàn sự tương ứng Cha–Con; sắc thái nhấn của ἐκεῖνος không cần chuyển bằng một đại từ gượng ép.
