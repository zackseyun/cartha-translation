id: JHN.5.19
reference: John 5:19
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἀπεκρίνατο οὖν ὁ Ἰησοῦς καὶ ⸀ἔλεγεν αὐτοῖς· Ἀμὴν ἀμὴν λέγω ὑμῖν, οὐ δύναται ὁ υἱὸς ποιεῖν ἀφ’ ἑαυτοῦ οὐδὲν ⸀ἐὰν μή τι βλέπῃ τὸν πατέρα ποιοῦντα· ἃ γὰρ ἂν ἐκεῖνος ποιῇ, ταῦτα καὶ ὁ υἱὸς ὁμοίως ποιεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/019.yaml
  text: So Jesus answered and said to them[a], “Truly, truly, I say to you, the Son is not able to do anything from himself unless he sees the Father doing it; for whatever that one does[b], these things the Son also does likewise.”
translation:
  language: vi
  text: 'Vì vậy, Đức Giê-su đáp lời họ: “Thật, thật, tôi nói với các ông: Con không thể tự mình làm điều gì, trừ khi thấy Cha làm điều gì; vì bất cứ điều gì Cha làm, Con cũng làm y như vậy.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀπεκρίνατο οὖν ὁ Ἰησοῦς καὶ ἔλεγεν αὐτοῖς
  choice: Vì vậy, Đức Giê-su đáp lời họ
  rationale: “Vì vậy” giữ quan hệ nối kết/suy luận của οὖν. Cụm “đáp lời họ” chuyển tự nhiên thành ngữ kể chuyện; καὶ ἔλεγεν không cần tái hiện bằng một dạng tiếp diễn gượng gạo trong tiếng Việt.
- source_word: Ἀμὴν ἀμὴν λέγω ὑμῖν
  choice: Thật, tôi nói thật với các ông
  rationale: Giữ được sự lặp lại trang trọng và nhấn mạnh của Ἀμὴν ἀμὴν bằng cách diễn đạt tự nhiên, dễ hiểu trong tiếng Việt hiện đại.
- source_word: οὐ δύναται ὁ υἱὸς ποιεῖν ἀφ’ ἑαυτοῦ οὐδὲν
  choice: Con không thể tự mình làm điều gì
  rationale: “Không thể” thể hiện trực tiếp ý nghĩa về khả năng của οὐ δύναται; “tự mình” truyền đạt ἀφ’ ἑαυτοῦ mà không thêm ý “theo sáng kiến riêng” vốn không được nói rõ.
- source_word: ἐὰν μή τι βλέπῃ τὸν πατέρα ποιοῦντα
  choice: trừ khi thấy Cha làm
  rationale: Cấu trúc ngoại lệ được giữ bằng “trừ khi”; động từ “làm” không có bổ ngữ tường minh là tự nhiên trong tiếng Việt và không buộc τι thành một đối tượng quá cụ thể.
- source_word: ἃ γὰρ ἂν ἐκεῖνος ποιῇ
  choice: vì bất cứ điều gì Đấng ấy làm
  rationale: “Bất cứ điều gì” giữ tính khái quát của mệnh đề quan hệ đi với ἄν và thể giả định; “Đấng ấy” phản ánh đại từ nhấn mạnh ἐκεῖνος và quy chiếu trang trọng về Cha.
- source_word: ταῦτα καὶ ὁ υἱὸς ὁμοίως ποιεῖ
  choice: Con cũng làm như vậy
  rationale: Cách nói gọn, tự nhiên này vẫn giữ cả καί và ὁμοίως, nhấn mạnh sự tương ứng hoàn toàn trong hành động.
theological_decisions:
- issue: Diễn đạt sự bất khả và lệ thuộc của Con mà không tự ý giải quyết hàm ý bản thể học
  choice: Con không thể tự mình làm điều gì
  alternative: Con không làm điều gì theo ý riêng mình
  rationale: Bản dịch giữ nguyên lời khẳng định mạnh về οὐ δύναται và ἀφ’ ἑαυτοῦ. Không đổi “không thể” thành vấn đề ý muốn hoặc sáng kiến, cũng không thêm một kết luận thần học ngoài câu văn.
- issue: Danh xưng Con và Cha
  choice: Con / Cha
  alternative: người con / người cha; Con / Đức Chúa Cha
  rationale: Trong văn cảnh, hai từ này hoạt động như các danh xưng tương quan xác định. Viết hoa giúp nhận diện danh xưng, còn không thêm “Đức Chúa” vì nguyên văn chỉ có ὁ υἱός và ὁ πατήρ.
- issue: Mối tương ứng giữa hành động của Cha và Con
  choice: bất cứ điều gì Đấng ấy làm, Con cũng làm như vậy
  alternative: Con chỉ bắt chước những việc Cha làm
  rationale: “Cũng làm như vậy” bảo toàn ὁμοίως và sự tương ứng được nguyên văn khẳng định; “bắt chước” sẽ thêm sắc thái không có trong tiếng Hy Lạp.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ đọc. Dùng “Đức Giê-su” theo lối gọi kính trọng phổ biến; “các ông” phù hợp với nhóm người mà Đức Giê-su đang trực tiếp nói với trong văn cảnh. Không cần chú thích vì các điểm mơ hồ chính có thể được giữ ngay trong bản văn.
