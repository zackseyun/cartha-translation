review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp chuyển đạt đúng mệnh đề chính: Con không thể làm gì từ chính mình, trừ khi thấy Cha đang hành động, và Con làm tương ứng với điều Cha làm. Tuy nhiên, «Thật, tôi nói thật» vừa đảo vị trí sự lặp lại của Ἀμὴν ἀμὴν vừa kém tự nhiên. Mệnh đề «thấy Cha làm» cũng bỏ mất tính bất định của τι, dù không làm sai ý chính.'
  naturalness: Văn phong nhìn chung rõ và trang trọng vừa phải. «Đáp lời họ» dùng được, nhưng «Thật, tôi nói thật với các ông» không phải lối nói hiện đại tự nhiên; «Thật, thật, tôi nói với các ông» vừa tự nhiên hơn vừa giữ phép lặp nhấn mạnh. «Bất cứ điều gì Cha làm» tự nhiên và trực tiếp hơn «bất cứ điều gì Đấng ấy làm» trong cùng một câu đã xác định Cha.
  terminology: «Đức Giê-su», «Con» và «Cha» phù hợp văn cảnh Giăng và cách dùng tiếng Việt hiện đại. Không cần thêm diễn giải tín lý. «Y như vậy» chuyển đạt ὁμοίως cách rõ ràng, không gợi ý Con chỉ bắt chước Cha.
  issues:
  - severity: low
    issue: Cụm «Thật, tôi nói thật với các ông»
    rationale: Cụm này không phản ánh trực tiếp trật tự và phép lặp «Ἀμὴν ἀμὴν λέγω»; cách sửa «Thật, thật, tôi nói với các ông» giữ sự lặp nhấn mạnh và tự nhiên hơn.
  - severity: low
    issue: «trừ khi thấy Cha làm» không nêu rõ tính bất định của τι
    rationale: 'Thêm «điều gì» bảo toàn tính mở của «τι» mà vẫn tự nhiên: «trừ khi thấy Cha làm điều gì».'
  - severity: low
