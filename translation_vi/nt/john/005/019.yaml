  to: 'Vì vậy, Đức Giê-su đáp lời họ: “Thật, thật, tôi nói với các ông: Con không thể tự mình làm điều gì, trừ khi thấy Cha làm điều gì; vì bất cứ điều gì Cha làm, Con cũng làm y như vậy.”'
