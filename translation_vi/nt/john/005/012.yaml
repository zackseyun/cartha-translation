  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Giữ nguyên sự tỉnh lược tân ngữ của tiếng Hy Lạp trong lời trích dẫn; chú thích giải thích vật được ngầm hiểu từ văn cảnh.
