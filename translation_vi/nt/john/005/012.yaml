  yaml_path: translation/nt/john/005/012.yaml
  text: So they asked him[a], “Who is the man who said to you, ‘Pick it up and walk’?”
translation:
  language: vi
  text: 'Vậy, họ hỏi người ấy: “Người đã bảo anh: ‘Hãy nhấc nó lên và bước đi’ là ai?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hy Lạp: “Hãy nhấc lên và bước đi.” Tân ngữ “nó” không được nêu trong tiếng Hy Lạp nhưng được hiểu từ văn cảnh trước là tấm đệm người ấy đã nằm.'
    reason: Làm rõ tân ngữ được hàm ý trong nguyên văn, đồng thời cho bản dịch tiếng Việt một cấu trúc tự nhiên.
lexical_decisions:
- source_word: ἠρώτησαν
  choice: họ hỏi
  rationale: Động từ aorist chủ động, ngôi thứ ba số nhiều của ἐρωτάω; “hỏi” tự nhiên trong tiếng Việt hiện đại và không tự ý nhấn mạnh thái độ thù nghịch.
- source_word: οὖν
  choice: Vì thế
  rationale: Diễn tả sự tiếp nối mang tính suy luận từ câu trước; “Vì thế” giữ rõ quan hệ lô-gích trong văn cảnh.
- source_word: αὐτόν
  choice: người ấy
  rationale: Đại từ đối cách giống đực số ít, chỉ người vừa được chữa lành; “người ấy” giúp tránh chuỗi đại từ mơ hồ trong tiếng Việt.
- source_word: Τίς ἐστιν ὁ ἄνθρωπος
  choice: Người ... là ai?
  rationale: Chuyển cấu trúc nghi vấn sang trật tự tự nhiên của tiếng Việt, đồng thời giữ việc câu hỏi nhắm đến một người nam cụ thể.
- source_word: ὁ εἰπών σοι
  choice: đã bảo anh
  rationale: Phân từ aorist có mạo từ xác định người ấy bằng lời đã nói trước đó. “Bảo anh” tự nhiên hơn “nói với anh” trong câu truyền lệnh và vẫn giữ sắc thái trung tính.
- source_word: Ἆρον
  choice: Hãy nhấc lên
  rationale: Mệnh lệnh aorist của αἴρω. Hy Lạp không nêu tân ngữ trong câu này; bản dịch giữ sự tỉnh lược thay vì chèn “nó”, vì vật được nói đến đã rõ từ văn cảnh trước.
- source_word: καὶ περιπάτει
  choice: và đi
  rationale: Mệnh lệnh hiện tại của περιπατέω; “và đi” là cách nói gọn, tự nhiên, không diễn giải quá mức sắc thái thể của động từ.
