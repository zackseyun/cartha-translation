  rationale: 'Sửa tối thiểu để bản dịch tiếng Việt tự nhiên và rõ nghĩa: thay từ nối bằng “Vậy”, cung cấp đại từ tân ngữ được hàm ý trong lời mệnh lệnh, và dùng “bước đi” cho động từ περιπατέω. Chú thích được điều chỉnh để nói chính xác rằng tân ngữ không được nêu trong tiếng Hy Lạp.'
