    rationale: Nguyên văn εἰς ὃν chỉ Môi-se là đối tượng của hy vọng. Cách diễn đạt hiện tại có thể bị hiểu là các ông đặt hy vọng nơi chính mình, trái nghĩa câu gốc.
  - severity: low
    issue: Chú thích b đổi từ ngôi trực tiếp “các ông” sang ngôi thứ ba “họ”.
    rationale: Dù không đổi nội dung, sự thay đổi ngôi xưng làm chú thích kém nhất quán với lời nói trực tiếp trong câu.
  - severity: low
    issue: Chú thích a dùng “đưa lời buộc tội các ông ra trước mặt Cha”, thiếu giới từ chỉ đối tượng bị buộc tội.
