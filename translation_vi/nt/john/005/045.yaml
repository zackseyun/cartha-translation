revisions:
- from: Đừng tưởng rằng chính tôi sẽ tố cáo các ông trước mặt Cha[a]. Người tố cáo các ông chính là Môi-se[b], người mà các ông đã đặt hy vọng nơi mình.
  to: Đừng nghĩ rằng chính tôi sẽ tố cáo các ông trước mặt Cha[a]. Người tố cáo các ông chính là Môi-se[b], người các ông đã đặt hy vọng vào.
  rationale: Sửa duy nhất cần thiết trong chính văn là thay cụm có đại từ “mình” mơ hồ bằng “người các ông đã đặt hy vọng vào”, để Môi-se được xác định rõ là đối tượng của hy vọng theo εἰς ὃν. Đồng thời, các chú thích được chỉnh nhẹ để rõ nghĩa và nhất quán ngôi xưng, mà không thay đổi ý nghĩa câu.
