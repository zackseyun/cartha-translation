id: JHN.5.45
reference: John 5:45
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: μὴ δοκεῖτε ὅτι ἐγὼ κατηγορήσω ὑμῶν πρὸς τὸν πατέρα· ἔστιν ὁ κατηγορῶν ὑμῶν Μωϋσῆς, εἰς ὃν ὑμεῖς ἠλπίκατε.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/045.yaml
  text: 'Do not think that I will accuse you before the Father[a]; there is one who accuses you: Moses[b], in whom you have put your hope.'
translation:
  language: vi
  text: Đừng nghĩ rằng chính tôi sẽ tố cáo các ông trước mặt Cha[a]. Người tố cáo các ông chính là Môi-se[b], người các ông đã đặt hy vọng vào.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Đừng cho rằng tôi sẽ đưa lời buộc tội chống lại các ông trước mặt Cha.”'
    reason: lexical_alternative
  - marker: b
    text: Tức là, Môi-se—người mà các ông tin cậy, đặc biệt với tư cách người trung gian và nhân chứng của luật pháp—sẽ là người tố cáo các ông.
    reason: cross_reference
lexical_decisions:
- source_word: μὴ δοκεῖτε
  choice: Đừng tưởng rằng
  rationale: Diễn đạt tự nhiên mệnh lệnh phủ định, giữ sự trực tiếp trong lời cảnh báo của Chúa Giê-su; “tưởng” phù hợp với ý nghĩ hoặc giả định đang bị bác bỏ.
- source_word: κατηγορήσω
  choice: sẽ tố cáo
  rationale: Giữ đúng sắc thái pháp lý của κατηγορέω là cáo buộc hay đưa ra lời buộc tội, không đẩy nghĩa sang hành động kết án.
- source_word: πρὸς τὸν πατέρα
  choice: trước mặt Cha
  rationale: Trong ngữ cảnh tố cáo, cách nói này truyền đạt tự nhiên khung cảnh pháp đình hay sự trình diện trước Cha, đồng thời giữ tước hiệu đặc trưng trong Giăng.
- source_word: ἔστιν ὁ κατηγορῶν ὑμῶν
  choice: Người tố cáo các ông chính là
  rationale: Cấu trúc tiếng Việt tự nhiên, làm nổi bật sự tương phản giữa Chúa Giê-su và người đang giữ vai trò tố cáo; hiện tại phân từ được diễn đạt bằng “người tố cáo”.
- source_word: Μωϋσῆς
  choice: Môi-se
  rationale: Dạng tên riêng quen thuộc trong tiếng Việt.
- source_word: εἰς ὃν
  choice: người mà ... nơi mình
  rationale: Giữ đích trực tiếp của lòng hy vọng là chính Môi-se, không diễn giải thành luật pháp hay các sách của ông.
- source_word: ἠλπίκατε
  choice: đã đặt hy vọng
  rationale: 'Diễn đạt sắc thái hoàn thành của động từ: họ đã đặt hy vọng và vẫn ở trong tình trạng ấy.'
theological_decisions:
- issue: Sắc thái pháp lý của lời Chúa Giê-su
  choice: Dùng “tố cáo”, không dùng “kết án”.
  alternative: “kết án các ông trước mặt Cha”
  rationale: κατηγορέω nói đến việc cáo buộc, không phải phán quyết cuối cùng; bản dịch tránh thêm một khẳng định thần học mạnh hơn nguyên văn.
- issue: Đối tượng mà người nghe đặt hy vọng
  choice: Giữ Môi-se là đối tượng trực tiếp của hy vọng.
  alternative: “luật pháp của Môi-se” hoặc “các sách của Môi-se”
  rationale: Nguyên văn nêu đích danh Môi-se. Dù văn cảnh liên hệ đến những điều ông viết, không nên đưa phần giải thích ấy vào chính câu dịch.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “các ông” vì Chúa Giê-su đang trực tiếp nói với một nhóm đối lập trong văn cảnh; dùng “Cha” không kèm mạo từ theo lối xưng gọi tự nhiên trong tiếng Việt. Các dấu chú thích [a], [b] đều xuất hiện trong chính văn.
