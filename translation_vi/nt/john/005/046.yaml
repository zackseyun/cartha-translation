    rationale: Imperfect ở cả điều kiện và hệ quả cùng ἄν trong hệ quả cho thấy điều kiện trái với thực tế. “Thì các ông hẳn đã tin tôi” tự nhiên hơn và nêu rõ hệ quả giả định.
