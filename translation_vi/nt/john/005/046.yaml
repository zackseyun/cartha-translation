  to: Vì nếu các ông tin Môi-se[a], thì các ông hẳn đã tin tôi, vì chính người ấy đã viết về tôi.[b]
  rationale: Sửa mệnh đề hệ quả để phản ánh tự nhiên và rõ hơn cấu trúc điều kiện phản thực của nguyên văn, đồng thời bỏ “cũng” là sắc thái bổ sung không được nêu trong tiếng Hy Lạp. Đổi “ông ấy” thành “người ấy” trong câu chính và chú thích để duy trì lối quy chiếu trang trọng, trung tính, trong khi vẫn bảo toàn sắc thái nhấn mạnh của ἐκεῖνος. Các chú thích giữ đúng neo a và b, cũng như chức năng từ vựng của chúng.
