  source_fidelity: 'Bản dịch giữ đúng các yếu tố chính: γάρ được phản ánh bằng “Vì/bởi,” πιστεύω với tặng cách được dịch là “tin [ai],” và περί ἐμοῦ là “về tôi.” Tuy nhiên, “thì cũng đã tin tôi” thêm sắc thái “cũng” không có trong bản Hy Lạp và cách phối hợp này kém trực tiếp trong việc biểu đạt hệ quả phản thực của ἐπιστεύετε ἄν. “Thì các ông hẳn đã tin tôi” diễn đạt rõ điều kiện phản thực mà không thêm nội dung.'
  naturalness: “Vì nếu các ông tin Môi-se, thì các ông hẳn đã tin tôi” là văn phong tiếng Việt hiện đại, trang trọng, và tự nhiên. “Chính người ấy” giữ được sự quy chiếu nhấn mạnh về Môi-se mà tránh cảm giác hơi khẩu ngữ/đối lập không cần thiết của “chính ông ấy.”
