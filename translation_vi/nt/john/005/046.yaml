base_translation:
  language: en
  yaml_path: translation/nt/john/005/046.yaml
  text: For if you believed Moses[a], you would believe me[b], for he wrote about me.
translation:
  language: vi
  text: Vì nếu các ông tin Môi-se[a], thì các ông hẳn đã tin tôi, vì chính người ấy đã viết về tôi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cùng một động từ Hy Lạp được dùng cho “tin” ở cả hai vế; cũng có thể hiểu là “tin lời Môi-se”.
    reason: lexical_alternative
  - marker: b
    text: 'Theo sát hơn: “vì người ấy đã viết về tôi”; đại từ Hy Lạp ἐκεῖνος mang sắc thái nhấn mạnh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ γὰρ
  choice: Vì nếu
  rationale: Giữ γάρ để nối câu này với lập luận trước, còn εἰ mở đầu điều kiện trái với thực tế.
- source_word: ἐπιστεύετε Μωϋσεῖ
  choice: các ông tin Môi-se
  rationale: πιστεύω đi với tặng cách chỉ người được tin. Đại từ số nhiều được thể hiện bằng “các ông” theo ngữ cảnh Chúa Giê-su đang nói với những người chống đối; “tin” cũng duy trì sự lặp từ trong hai vế.
- source_word: ἐπιστεύετε ἂν ἐμοί
  choice: thì cũng đã tin tôi
  rationale: Thể chưa hoàn thành kết hợp với ἄν diễn tả hệ quả trái với thực tế. “Tin tôi” phản ánh trực tiếp tặng cách ἐμοί, không thêm ý “tin vào” vốn thường được diễn đạt bằng εἰς.
- source_word: περὶ γὰρ ἐμοῦ
  choice: bởi ... về tôi
  rationale: περί với sở hữu cách có nghĩa là “về” hoặc “liên quan đến”; “về tôi” tự nhiên và chính xác trong tiếng Việt hiện đại.
- source_word: ἐκεῖνος
  choice: chính ông ấy
  rationale: Đại từ chỉ định nhấn mạnh, quy chiếu về Môi-se; “chính ông ấy” giữ được sắc thái nhấn mạnh rõ hơn đại từ đơn thuần.
- source_word: ἔγραψεν
  choice: đã viết
  rationale: Thể bất định chỉ hành động viết trong quá khứ; “đã viết” là cách diễn đạt tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Bản chất lời chứng của Môi-se về Chúa Giê-su
  choice: đã viết về tôi
  alternative: đã viết liên quan đến tôi
  rationale: Cách dịch giữ nguyên khẳng định rằng các sách của Môi-se làm chứng về Chúa Giê-su, nhưng không tự ý xác định một phân đoạn riêng hay mở rộng thành một cách giải nghĩa thần học cụ thể.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Môi-se” theo cách gọi quen thuộc trong tiếng Việt. “Các ông” làm rõ chủ thể số nhiều theo ngữ cảnh mà không thêm danh xưng giáo phái; “chính ông ấy” bảo toàn sắc thái nhấn mạnh của đại từ Hy Lạp.
