id: JHN.5.38
reference: John 5:38
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ τὸν λόγον αὐτοῦ οὐκ ἔχετε ⸂ἐν ὑμῖν μένοντα⸃, ὅτι ὃν ἀπέστειλεν ἐκεῖνος τούτῳ ὑμεῖς οὐ πιστεύετε.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/038.yaml
  text: And you do not have his word abiding in you[a], because you do not believe the one whom he sent.
translation:
  language: vi
  text: Và các ông không có lời của Ngài ở lại trong các ông, vì các ông không tin Đấng Ngài đã sai.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λόγον
  choice: lời
  rationale: “Lời” diễn đạt lời phán hay sự mặc khải của Đức Chúa Trời, đồng thời giữ được cách dùng giàu ý nghĩa của λόγος trong Giăng mà không thu hẹp thành “thông điệp”.
- source_word: ἔχετε ... ἐν ὑμῖν μένοντα
  choice: không ở lại trong các ông
  rationale: Tiếng Việt tự nhiên diễn đạt cấu trúc “không có lời ấy đang ở lại trong mình” bằng “lời ấy không ở lại trong”; “ở lại” giữ sắc thái tiếp diễn của μένω và phù hợp với cách dùng lặp lại trong Giăng.
- source_word: ὅτι
  choice: vì
  rationale: Ở đây ὅτι nêu lý do, nên “vì” truyền đạt rõ quan hệ nhân quả.
- source_word: ὃν ἀπέστειλεν ἐκεῖνος
  choice: Đấng mà Ngài đã sai đến
  rationale: “Đấng” chỉ người được sai là Chúa Giê-su một cách trang trọng; “Ngài” chỉ Đức Chúa Cha theo ngữ cảnh. “Sai đến” tự nhiên trong tiếng Việt và biểu đạt hành động sai phái.
- source_word: τούτῳ ... οὐ πιστεύετε
  choice: các ông không tin Đấng
  rationale: Đại từ τούτῳ được đưa lên trước để nhấn mạnh người được sai. Cách diễn đạt này giữ đối tượng trực tiếp của lòng tin mà không thêm “tin vào”, vốn có thể làm câu mang sắc thái diễn giải hơn.
theological_decisions:
- issue: Mối liên hệ giữa lời Đức Chúa Trời ở lại trong người nghe và việc họ không tin Đấng được sai đến
  choice: 'Giữ quan hệ nhân quả của câu: lời của Đức Chúa Trời không ở lại trong họ vì họ không tin Chúa Giê-su, Đấng Ngài sai đến.'
  alternative: Có thể hiểu hẹp hơn rằng họ không lưu giữ hoặc không vâng theo lời Kinh Thánh trong lòng.
  rationale: Bản dịch không đồng nhất “ở lại” với một học thuyết riêng về sự tái sinh, sự ngự trị hay sự bền đỗ, nhờ đó bảo toàn sức căng thần học của nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “các ông” vì Chúa Giê-su đang trực tiếp nói với một nhóm đối nghịch trong ngữ cảnh; “Ngài” duy trì sự tôn kính và chỉ Đức Chúa Cha. Không cần chú thích vì “ở lại” là cách dịch trực tiếp, tự nhiên của μένω trong tiếng Việt.
