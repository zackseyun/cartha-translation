review_pass:
  verdict: revise
  source_fidelity: Bản thảo truyền đạt đúng ý chính và quan hệ nhân quả của câu. Tuy nhiên, cấu trúc “lời của Ngài không ở lại” làm mờ động từ chính ἔχετε (“có”), trong khi nguyên văn nói rõ rằng họ không có lời của Đức Chúa Cha đang ở lại trong họ. “Sai đến” có thể gợi thêm hướng chuyển động không được nêu trực tiếp trong ἀπέστειλεν.
  naturalness: “Các ông” phù hợp với lời đối thoại trực tiếp, trang trọng trong ngữ cảnh tranh luận. Câu sửa với trật tự “các ông không có...” tự nhiên hơn và phản ánh cấu trúc nguyên văn rõ hơn.
  terminology: “Lời,” “ở lại,” “Đấng,” và “Ngài” đều thích hợp với cách dùng Giăng và giữ sắc thái tôn kính. “Đấng Ngài đã sai” là cách diễn đạt gọn, tự nhiên, không thêm sắc thái của “đến.”
  issues:
  - severity: low
    issue: Động từ ἔχετε chưa được biểu đạt trực tiếp
    rationale: Cụm “lời của Ngài không ở lại trong các ông” gần nghĩa, nhưng nguyên văn nhấn mạnh “các ông không có” lời ấy đang ở lại trong họ. Nên giữ “không có” để phản ánh cú pháp và ý nghĩa đầy đủ hơn.
  - severity: low
    issue: “Sai đến” thêm một nét nghĩa hướng đến
    rationale: ἀπέστειλεν nghĩa là “đã sai/phái”; ngữ cảnh có thể hàm ý Đấng được sai đến thế gian, nhưng động từ trong câu không nêu rõ hướng đến. “Đấng Ngài đã sai” sát và tự nhiên hơn.
  revised_text: Và các ông không có lời của Ngài ở lại trong các ông, vì các ông không tin Đấng Ngài đã sai.
