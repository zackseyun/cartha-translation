  text: λέγει αὐτῷ ὁ Ἰησοῦς· ⸀Ἔγειρε ἆρον τὸν κράβαττόν σου καὶ περιπάτει.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/008.yaml
  text: Jesus says to him[a], “Get up, pick up your mat, and walk.”
translation:
  language: vi
  text: 'Đức Giê-su nói với người ấy: “Hãy đứng dậy, nhấc tấm chiếu[a] của anh lên và bước đi.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “tấm đệm” hoặc “giường”. Từ Hy Lạp chỉ một vật trải nằm đơn sơ, không nhất thiết là một chiếc giường đầy đủ.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: nói
  rationale: Thì hiện tại kể chuyện trong tiếng Hy Lạp được chuyển bằng động từ không đánh dấu thì trong tiếng Việt; cách này tự nhiên mà không buộc phải đổi thành quá khứ.
- source_word: αὐτῷ
  choice: với người ấy
  rationale: Diễn đạt trực tiếp tân ngữ gián tiếp, đồng thời chỉ rõ người Đức Giê-su đang nói với mà không thêm ý giải thích.
- source_word: Ἔγειρε
  choice: Hãy đứng dậy
  rationale: Mệnh lệnh yêu cầu người đang nằm phải trỗi dậy ngay; “đứng dậy” là cách nói hiện đại, tự nhiên và rõ nghĩa.
- source_word: ἆρον
  choice: nhấc ... lên
  rationale: Giữ hành động nâng hoặc lấy vật lên của αἴρω, không diễn giải quá mức thành việc mang đi.
- source_word: κράβαττόν
  choice: tấm chiếu
  rationale: Chỉ một vật trải nằm đơn sơ, nhẹ và có thể mang theo; “tấm chiếu” tránh gợi hình ảnh một chiếc giường đồ đạc nặng.
- source_word: περιπάτει
  choice: bước đi
  rationale: Chỉ hành động đi bộ theo nghĩa thể chất; “bước đi” tự nhiên trong chuỗi mệnh lệnh chữa lành và không thêm sắc thái kéo dài.
theological_decisions:
- issue: Tính chất mệnh lệnh của Đức Giê-su trong bối cảnh chữa lành
  choice: 'Giữ nguyên ba mệnh lệnh thể chất trực tiếp: đứng dậy, nhấc chiếu lên và bước đi.'
  alternative: Diễn giải thêm như “hãy đứng dậy và được chữa lành”.
  rationale: Bản Hy Lạp không nói trực tiếp “được chữa lành”; ý chữa lành hiện rõ từ ngữ cảnh nhưng không nên được thêm vào câu này.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Đức Giê-su” theo lối gọi kính trọng phổ biến; cấu trúc câu ngắn, trực tiếp, giữ sức mạnh của ba mệnh lệnh.
