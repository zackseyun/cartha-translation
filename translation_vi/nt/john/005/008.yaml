  source_fidelity: 'Bản dịch truyền đạt đúng các thành tố của câu Hy Lạp: động từ kể chuyện hiện tại λέγει được diễn đạt tự nhiên bằng “nói”; αὐτῷ là “với người ấy”; và ba mệnh lệnh Ἔγειρε, ἆρον, περιπάτει được giữ nguyên là các mệnh lệnh thể chất trực tiếp. “Tấm chiếu” là cách chuyển ngữ phù hợp cho κράβαττος trong ngữ cảnh một vật trải nằm có thể nhấc mang đi.'
