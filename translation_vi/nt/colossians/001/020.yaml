id: COL.1.20
reference: Colossians 1:20
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ δι’ αὐτοῦ ἀποκαταλλάξαι τὰ πάντα εἰς αὐτόν, εἰρηνοποιήσας διὰ τοῦ αἵματος τοῦ σταυροῦ αὐτοῦ, ⸂[δι’ αὐτοῦ]⸃ εἴτε τὰ ἐπὶ τῆς γῆς εἴτε τὰ ⸀ἐν τοῖς οὐρανοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/020.yaml
  text: and through him to reconcile all things to himself[d][c][b][a], having made peace through the blood of his cross—through him—whether the things on the earth or the things in the heavens.
translation:
  language: vi
  text: và qua Ngài mà hòa giải muôn vật với chính mình,[a][b] sau khi đã lập hòa bình nhờ huyết Ngài trên thập tự giá—qua Ngài[c]—dù là những gì trên đất hay những gì trong các tầng trời.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch “bởi Ngài” thay cho “qua Ngài” ở cả hai chỗ.
    reason: lexical_alternative
  - marker: b
    text: “Muôn vật” giữ phạm vi rộng của nguyên văn và của cụm tiếp theo “dù là những gì trên đất hay những gì trong các tầng trời”; riêng câu này không xác định sự hòa giải ấy liên hệ thế nào với sự cứu rỗi chung cuộc.
    reason: alternative_reading
  - marker: c
    text: Một số thủ bản không có cụm “qua Ngài” thứ hai.
    reason: textual_variant
  - marker: d
    text: 'Nguyên văn dùng dạng số nhiều: “các tầng trời.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: δι’ αὐτοῦ
  choice: qua Ngài
  rationale: διά với sở hữu cách diễn tả phương tiện hoặc tác nhân. “Qua Ngài” tự nhiên trong tiếng Việt và giữ được vai trò trung gian của Con trong mạch văn.
- source_word: ἀποκαταλλάξαι
  choice: hòa giải
  rationale: Động từ chỉ việc khôi phục quan hệ. Không thêm “hoàn toàn” vì sắc thái tăng cường của tiền tố ἀπο- không chắc đến mức cần diễn đạt riêng.
- source_word: τὰ πάντα
  choice: muôn vật
  rationale: Cụm trung tính số nhiều có phạm vi bao quát. “Muôn vật” vừa trang trọng, dễ hiểu, vừa phù hợp với phạm vi tạo thành trong câu 16–17 và cặp đất–trời theo sau.
- source_word: εἰς αὐτόν
  choice: với chính mình
  rationale: “Với” phù hợp tự nhiên với động từ “hòa giải”; “chính mình” giữ ý phản thân theo cú pháp, trong đó Đức Chúa Trời là chủ thể hàm ẩn từ câu 19.
- source_word: εἰρηνοποιήσας
  choice: sau khi đã lập hòa bình
  rationale: Phân từ bất định quá khứ có thể chỉ hành động đi trước hoặc phương cách liên hệ với việc hòa giải. Cách dịch này giữ quan hệ ấy mà không biến nó thành một mệnh đề độc lập.
- source_word: διὰ τοῦ αἵματος τοῦ σταυροῦ αὐτοῦ
  choice: nhờ huyết Ngài đổ ra trên thập tự giá
  rationale: “Nhờ” diễn tả phương tiện. Cách diễn đạt tự nhiên hóa quan hệ sở hữu trong tiếng Việt nhưng vẫn giữ cả “huyết” và “thập tự giá,” không giản lược thành chỉ “sự chết.”
- source_word: ⸂[δι’ αὐτοῦ]⸃
  choice: qua Ngài
  rationale: Giữ cụm được SBLGNT đặt trong ngoặc vuông và dùng gạch ngang để thể hiện sự lặp lại nhấn mạnh; dị bản được ghi chú.
- source_word: εἴτε ... εἴτε
  choice: dù là ... hay
  rationale: Cấu trúc tương liên tự nhiên trong tiếng Việt, bảo toàn hai vế bao quát.
- source_word: τὰ ἐπὶ τῆς γῆς
  choice: những vật ở dưới đất
  rationale: “Đất” được hiểu theo đối sánh vũ trụ với các tầng trời, không phải một vùng lãnh thổ; “những vật” duy trì dạng trung tính và không thu hẹp thành con người.
- source_word: τὰ ἐν τοῖς οὐρανοῖς
  choice: những vật ở trên các tầng trời
  rationale: Giữ số nhiều của οὐρανοῖς bằng “các tầng trời,” một cách nói Kinh Thánh dễ hiểu trong tiếng Việt.
theological_decisions:
- issue: Phạm vi hòa giải trong τὰ πάντα
  choice: Dịch rộng là “muôn vật,” không thu hẹp đối tượng và không khẳng định mọi hữu thể đều được cứu rỗi sau cùng.
  alternative: “mọi người” hoặc “toàn thể vũ trụ đều được cứu rỗi”
  rationale: Chính câu mở rộng phạm vi bằng “dưới đất” và “trên các tầng trời.” Bản dịch cần giữ tầm vóc vũ trụ nhưng không giải quyết thay cho văn bản mối liên hệ giữa sự hòa giải này và sự cứu rỗi chung cuộc.
- issue: Sở chỉ của εἰς αὐτόν
  choice: Hiểu là Đức Chúa Trời hòa giải muôn vật với chính mình qua Con.
  alternative: Đấng Christ hòa giải muôn vật với chính Ngài.
  rationale: Cú pháp tiếp nối câu 19, nơi chủ thể hàm ẩn là Đức Chúa Trời; tuy nhiên đại từ trong bản dịch không chèn danh xưng, tránh diễn giải quá mức.
- issue: Ý nghĩa của “huyết ... trên thập tự giá”
  choice: Giữ ngôn ngữ cụ thể về huyết và thập tự giá.
  alternative: “sự chết của Ngài trên thập tự giá”
  rationale: Nguyên văn nêu rõ cả huyết lẫn thập tự giá. Giữ hai hình ảnh bảo toàn chiều kích tế lễ và biến cố đóng đinh mà không áp đặt một học thuyết chuộc tội hẹp hơn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng “Ngài” cho đại từ chỉ Con, “muôn vật” để giữ phạm vi vũ trụ, và “huyết” thay vì diễn giải thành “sự chết” nhằm bảo toàn hình ảnh nguyên văn.
