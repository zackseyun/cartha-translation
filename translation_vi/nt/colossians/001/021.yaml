  source_fidelity: Bản dịch giữ đúng cấu trúc tiếp diễn của καὶ ὑμᾶς, tình trạng quá khứ do ποτε ὄντας, sự xa cách của ἀπηλλοτριωμένους, sự thù nghịch thuộc phạm vi tâm trí, và mối liên hệ không được xác định quá mức giữa sự thù nghịch với các việc làm xấu xa. “Thể hiện trong” là cách diễn đạt có tính giải nghĩa nhẹ nhưng không biến ἐν thành quan hệ nhân quả; chú thích đã bảo lưu cách đọc sát chữ và tính mơ hồ của cấu trúc.
  naturalness: “Còn anh chị em, trước kia vốn xa cách và có tâm trí thù nghịch, thể hiện trong những việc làm xấu xa—” là tiếng Việt hiện đại, trang trọng, và có thể đọc tự nhiên như một vế câu tiếp sang câu 22. Cách xưng hô “anh chị em” phù hợp với ngôi thứ hai số nhiều trong một thư tín gửi cộng đồng.
  terminology: “Xa cách,” “tâm trí thù nghịch,” và “những việc làm xấu xa” truyền đạt tốt các thuật ngữ Hy Lạp mà không thêm rõ đối tượng là Đức Chúa Trời hay áp đặt một quan hệ nhân quả. Chú thích dùng “kẻ thù nghịch” như phương án sát chữ hợp lệ và giải thích đúng vai trò có thể có của ἐν.
