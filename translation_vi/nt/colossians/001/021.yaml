id: COL.1.21
reference: Colossians 1:21
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ὑμᾶς ποτε ὄντας ἀπηλλοτριωμένους καὶ ἐχθροὺς τῇ διανοίᾳ ἐν τοῖς ἔργοις τοῖς πονηροῖς—
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/021.yaml
  text: And you[a], who once were alienated and hostile in mind in evil deeds—
translation:
  language: vi
  text: Còn anh chị em, trước kia vốn xa cách và có tâm trí thù nghịch, thể hiện trong những việc làm xấu xa[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát chữ hơn: “là những kẻ thù nghịch trong tâm trí, trong những việc làm xấu xa.” Cách diễn đạt Hy Lạp rất cô đọng; “trong những việc làm xấu xa” có thể nói đến phạm vi hoặc sự biểu hiện của thái độ thù nghịch, chứ không nhất thiết nêu nguyên nhân.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ὑμᾶς
  choice: Còn anh chị em
  rationale: Tiếp nối câu trước và đưa độc giả vào phạm vi công việc hòa giải của Đấng Christ. “Anh chị em” diễn đạt đại từ số nhiều theo lối xưng hô tự nhiên, trang trọng trong tiếng Việt.
- source_word: ποτε ὄντας
  choice: trước kia vốn
  rationale: Diễn tả tình trạng trước đây của độc giả, đồng thời chuyển cấu trúc phân từ Hy Lạp sang tiếng Việt tự nhiên.
- source_word: ἀπηλλοτριωμένους
  choice: xa cách
  rationale: Diễn tả tình trạng bị tách lìa, xa lạ về quan hệ mà không bổ sung tân ngữ “Đức Chúa Trời,” vốn không được nói rõ trong câu này.
- source_word: ἐχθροὺς τῇ διανοίᾳ
  choice: có tâm trí thù nghịch
  rationale: Giữ được nghĩa đối nghịch của ἐχθρούς và phạm vi nội tâm do τῇ διανοίᾳ biểu thị, nhưng tránh cách nói cứng “là kẻ thù trong tâm trí.”
- source_word: ἐν τοῖς ἔργοις τοῖς πονηροῖς
  choice: thể hiện trong những việc làm xấu xa
  rationale: Diễn đạt tự nhiên rằng sự thù nghịch có biểu hiện trong hành vi, nhưng dùng chú thích để lưu giữ tính cô đọng và sự mơ hồ của giới từ ἐν.
- source_word: ἔργοις
  choice: việc làm
  rationale: Từ phổ thông, tự nhiên, không gợi một nghĩa thần học chuyên biệt ngoài văn cảnh.
- source_word: πονηροῖς
  choice: xấu xa
  rationale: Giữ rõ sắc thái đạo đức tiêu cực, phù hợp văn phong hiện đại và trang trọng.
theological_decisions:
- issue: Mối liên hệ giữa tâm trí thù nghịch và những việc làm xấu xa
  choice: Dịch là “có tâm trí thù nghịch, thể hiện trong những việc làm xấu xa.”
  alternative: “là những kẻ thù nghịch trong tâm trí, trong những việc làm xấu xa” hoặc “có tâm trí thù nghịch vì những việc làm xấu xa.”
  rationale: Cấu trúc Hy Lạp có thể chỉ phạm vi hoặc sự biểu hiện, nhưng không buộc phải chỉ nguyên nhân. Bản dịch chính dùng cách nói tiếng Việt tự nhiên và tránh khẳng định quan hệ nhân quả; chú thích bảo lưu cấu trúc sát chữ.
- issue: Đối tượng của tình trạng xa cách và thù nghịch
  choice: Không thêm “với Đức Chúa Trời” vào chính văn.
  alternative: “xa cách Đức Chúa Trời và thù nghịch với Ngài trong tâm trí.”
  rationale: Văn mạch cho thấy quan hệ với Đức Chúa Trời, nhưng câu Hy Lạp này không nêu tân ngữ ấy. Không thêm vào giúp giữ tính hàm ẩn và tránh giải thích quá mức.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dấu gạch ngang được giữ lại vì câu tiếp tục sang câu 22. Cách xưng hô “anh chị em” thể hiện số nhiều và phù hợp lối diễn đạt cộng đồng, không thêm phân biệt giáo phái.
