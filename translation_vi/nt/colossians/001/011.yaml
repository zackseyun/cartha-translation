  text: ἐν πάσῃ δυνάμει δυναμούμενοι κατὰ τὸ κράτος τῆς δόξης αὐτοῦ εἰς πᾶσαν ὑπομονὴν καὶ μακροθυμίαν μετὰ χαρᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/011.yaml
  text: being strengthened with all power[a], according to the might of his glory, for all endurance and patience with joy,
translation:
  language: vi
  text: được thêm sức bằng mọi quyền năng, theo sức mạnh của vinh quang Ngài[a], để luôn bền chí và nhẫn nại với niềm vui,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “theo quyền năng vinh hiển của Ngài.” Tiếng Hy Lạp sát nghĩa hơn là “theo sức mạnh của vinh quang Ngài.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν πάσῃ δυνάμει δυναμούμενοι
  choice: được thêm sức bằng mọi quyền năng
  rationale: Diễn đạt phân từ bị động hiện tại như một tiến trình được ban sức, với Đức Chúa Trời là tác nhân được hàm ý. “Bằng” thể hiện sắc thái phương tiện của ἐν, còn “mọi quyền năng” giữ lực bao quát của πάσῃ.
- source_word: κατὰ τὸ κράτος τῆς δόξης αὐτοῦ
  choice: theo sức mạnh của vinh quang Ngài
  rationale: Giữ cấu trúc sở hữu đậm nét của tiếng Hy Lạp và phân biệt κράτος (“sức mạnh”) với δύναμις (“quyền năng”). “Theo” diễn tả chuẩn mực hoặc mức độ tương ứng.
- source_word: εἰς πᾶσαν ὑπομονὴν καὶ μακροθυμίαν
  choice: để có mọi sự bền chí và nhẫn nại
  rationale: “Để có” truyền đạt quan hệ mục đích/kết quả của εἰς. “Bền chí” nhấn mạnh sự kiên định trong nghịch cảnh, còn “nhẫn nại” diễn đạt μακροθυμία bằng ngôn ngữ hiện đại và dễ hiểu.
- source_word: μετὰ χαρᾶς
  choice: với niềm vui
  rationale: Giữ danh từ χαρά và không quyết định quá mức phạm vi cú pháp của cụm từ, dù tự nhiên nhất là gắn với sự bền chí và nhẫn nại.
theological_decisions:
- issue: Mối liên hệ giữa việc được ban sức và các thuộc tính của Đức Chúa Trời
  choice: Giữ cách nói “theo sức mạnh của vinh quang Ngài”.
  alternative: “theo quyền năng vinh hiển của Ngài”
  rationale: Cách chọn giữ nguyên cấu trúc Hy Lạp τὸ κράτος τῆς δόξης αὐτοῦ và sức căng thần học giữa “sức mạnh” với “vinh quang”, thay vì chuyển quan hệ sở hữu thành một tính từ giải thích.
- issue: Phạm vi cú pháp của μετὰ χαρᾶς
  choice: Đặt “với niềm vui” sau “bền chí và nhẫn nại”, đồng thời không diễn giải thêm.
  alternative: Gắn cụm từ với hành động cảm tạ ở câu kế tiếp.
  rationale: Dấu câu không có trong bản thảo sớm khiến cách gắn kết có mức độ mơ hồ nhất định. Bản dịch giữ trật tự nguồn và không loại trừ hoàn toàn khả năng cụm từ hướng về ý tiếp theo.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Được thêm sức” tự nhiên hơn lối dịch thuần hình thức “được làm cho mạnh”; “bền chí và nhẫn nại” duy trì hai sắc thái gần nhau nhưng khác biệt của ὑπομονή và μακροθυμία.
