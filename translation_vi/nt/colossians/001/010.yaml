id: COL.1.10
reference: Colossians 1:10
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸀περιπατῆσαι ἀξίως τοῦ κυρίου εἰς πᾶσαν ἀρεσκείαν ἐν παντὶ ἔργῳ ἀγαθῷ καρποφοροῦντες καὶ αὐξανόμενοι ⸂τῇ ἐπιγνώσει⸃ τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/010.yaml
  text: so as to walk worthily of the Lord[a], to all pleasing, bearing fruit in every good work and growing in the knowledge of God[b],
translation:
  language: vi
  text: để anh em sống một cách xứng đáng với Chúa, làm đẹp lòng Ngài trong mọi sự, sinh hoa trái trong mọi việc lành và tăng trưởng trong sự hiểu biết Đức Chúa Trời.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “tăng trưởng nhờ sự hiểu biết Đức Chúa Trời.” Tặng cách Hy Lạp có thể chỉ lĩnh vực của sự tăng trưởng hoặc phương tiện; “sự hiểu biết” cũng có thể hàm ý sự nhận biết đầy đủ hơn.'
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: περιπατῆσαι
  choice: sống
  rationale: Động từ theo nghĩa đen là “bước đi,” nhưng ở đây là ẩn dụ quen thuộc chỉ cách sống; “sống” truyền đạt tự nhiên và rõ nghĩa trong tiếng Việt hiện đại.
- source_word: ἀξίως τοῦ κυρίου
  choice: xứng đáng với Chúa
  rationale: Diễn đạt cách sống phù hợp với địa vị và ý muốn của Chúa, đồng thời giữ quan hệ trực tiếp của trạng từ ἀξίως với τοῦ κυρίου.
- source_word: εἰς πᾶσαν ἀρεσκείαν
  choice: và làm đẹp lòng Ngài trong mọi phương diện
  rationale: Cụm Hy Lạp mang nghĩa hướng đến mọi sự đẹp lòng; tiếng Việt cần nêu đối tượng được ngụ ý từ “Chúa” trong ngữ cảnh để câu tự nhiên và rõ ràng.
- source_word: ἐν παντὶ ἔργῳ ἀγαθῷ καρποφοροῦντες
  choice: sinh hoa trái trong mọi việc lành
  rationale: Giữ hình ảnh hữu cơ của καρποφοροῦντες và phạm vi phân phối của παντί.
- source_word: αὐξανόμενοι τῇ ἐπιγνώσει τοῦ θεοῦ
  choice: ngày càng hiểu biết Đức Chúa Trời sâu sắc hơn
  rationale: “Ngày càng” thể hiện tiến trình liên tục của phân từ; “hiểu biết ... sâu sắc hơn” chuyển tải sắc thái nhận biết đầy đủ của ἐπίγνωσις mà vẫn tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Đối tượng ngụ ý của ἀρεσκείαν
  choice: Nêu rõ “Ngài,” quy chiếu về Chúa
  alternative: “hướng đến mọi sự đẹp lòng” hoặc một cách diễn đạt không nêu đối tượng
  rationale: Hy Lạp không ghi một đại từ làm đối tượng, nhưng “Chúa” là đối tượng được ngữ cảnh chỉ rõ. Trong tiếng Việt, nêu “Ngài” tránh một cụm danh hóa gượng gạo mà không thay đổi ý nghĩa.
- issue: Sắc thái và quan hệ cú pháp của τῇ ἐπιγνώσει
  choice: “ngày càng hiểu biết Đức Chúa Trời sâu sắc hơn” trong chính văn, kèm chú thích về khả năng hiểu là phương tiện
  alternative: “lớn lên nhờ sự hiểu biết Đức Chúa Trời”
  rationale: Dạng tặng cách có thể chỉ phương diện/lĩnh vực hoặc phương tiện. Chính văn chọn cách hiểu theo sự tăng trưởng trong nhận biết nhưng chú thích bảo lưu khả năng cú pháp còn lại.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “sống” thay cho lối dịch sát “bước đi”; giữ hình ảnh “sinh hoa trái.” “Đức Chúa Trời” được dùng làm danh xưng truyền thống, còn “Chúa” dịch κύριος. Dấu phẩy cuối câu Hy Lạp cho thấy câu tiếp nối từ câu trước và sang phần sau; bản dịch này giữ cấu trúc mệnh đề mục đích của ngữ cảnh.
