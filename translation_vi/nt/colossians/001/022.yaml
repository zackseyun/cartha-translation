revisions:
- from: Nhưng nay, qua sự chết, ngài đã hòa giải anh chị em trong thân thể bằng xương bằng thịt của ngài,[a] để trình diện anh chị em trước mặt ngài như những người thánh khiết, không tì vết[b] và không thể bị cáo buộc,
  to: Nhưng nay, anh chị em đã được hòa giải trong thân thể bằng xương bằng thịt của ngài, qua sự chết,[a] để trình diện anh chị em trước mặt ngài, thánh khiết, không tì vết[b] và không bị cáo buộc,
  rationale: Sửa bản chính sang thể bị động để phản ánh hình thái ἀποκατηλλάγητε và không xác định tác nhân vượt quá câu Hy Lạp. Giữ “bằng xương bằng thịt” để biểu đạt nghĩa thân thể vật chất của cụm σώματι τῆς σαρκὸς, đồng thời giữ các thuật ngữ về sự thánh khiết, không tì vết và không bị cáo buộc. Dời chú thích a đến sau “sự chết” và đảo nội dung chú thích để nó thực sự nêu phương án chủ động.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T20:18:33Z'
review_pass:
  verdict: revise
  source_fidelity: 'Cần giữ thể bị động của ἀποκατηλλάγητε trong bản chính: nguyên văn không nêu rõ tác nhân trong chính mệnh đề này. Bản nháp chuyển sang chủ động với “ngài” và do đó giải quyết một điều mà tiếng Hy Lạp để hàm ẩn. Cụm ἐν τῷ σώματι τῆς σαρκὸς αὐτοῦ và διὰ τοῦ θανάτου được giữ bằng cách nói rõ thân thể vật chất và sự chết.'
  naturalness: Bản sửa dùng trật tự tiếng Việt tự nhiên, vẫn trang trọng. “Trình diện ... trước mặt ngài” diễn đạt tốt παραστῆσαι ... κατενώπιον αὐτοῦ; bỏ “như những người” để sát và gọn hơn.
  terminology: “Thân thể bằng xương bằng thịt” nhấn mạnh thân thể thực, không đưa nghĩa luân lý vào σάρξ. “Không tì vết” và “không bị cáo buộc” giữ sự phân biệt tương đối giữa ἀμώμους (có sắc thái tế lễ) và ἀνεγκλήτους (sắc thái pháp đình).
  issues:
  - severity: medium
    issue: Bản chính dùng “ngài đã hòa giải anh chị em” cho động từ bị động ἀποκατηλλάγητε.
    rationale: Dù ngữ cảnh rộng hơn có thể gợi tác nhân, hình thức của câu Hy Lạp là bị động và không nêu tác nhân. Bản dịch chính nên bảo lưu sự hàm ẩn này; cách chủ động có thể đặt ở chú thích như một cách diễn đạt theo ngữ cảnh.
  - severity: low
    issue: Dấu chú thích a hiện đặt sau cụm “thân thể ...”, trong khi nội dung chú thích nói về động từ hòa giải và cách diễn đạt qua sự chết.
    rationale: Đặt dấu sau “sự chết” phù hợp với cấu trúc câu và thông lệ của bản đối chiếu tiếng Anh, đồng thời tránh khiến người đọc tưởng chú thích giải thích riêng cụm “thân thể”.
