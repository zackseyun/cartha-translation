id: COL.1.22
reference: Colossians 1:22
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: νυνὶ δὲ ⸀ἀποκατηλλάγητε ἐν τῷ σώματι τῆς σαρκὸς αὐτοῦ διὰ τοῦ θανάτου— παραστῆσαι ὑμᾶς ἁγίους καὶ ἀμώμους καὶ ἀνεγκλήτους κατενώπιον αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/022.yaml
  text: But now he has reconciled you in his body of flesh through death[a], to present you holy and blameless and beyond reproach before him[b],
translation:
  language: vi
  text: Nhưng nay, anh chị em đã được hòa giải trong thân thể bằng xương bằng thịt của ngài, qua sự chết,[a] để trình diện anh chị em trước mặt ngài, thánh khiết, không tì vết[b] và không bị cáo buộc,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể diễn đạt: “Nhưng nay, ngài đã hòa giải anh chị em trong thân thể bằng xương bằng thịt của ngài, qua sự chết.” Động từ Hy Lạp ở thể bị động.'
    reason: alternative_reading
  - marker: b
    text: “Không tì vết” cũng có thể dịch là “không chỗ trách”; từ Hy Lạp có thể gợi đến lễ vật không có khuyết tật.
    reason: lexical_alternative
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: Nhưng nay
  rationale: Giữ cả ý tương phản với tình trạng trước kia ở câu 21 và ý chuyển sang thực tại hiện nay.
- source_word: ἀποκατηλλάγητε
  choice: ngài đã hòa giải anh chị em
  rationale: Động từ Hy Lạp ở thể bị động; cách diễn đạt chủ động này tự nhiên trong tiếng Việt và theo ngữ cảnh hiểu tác nhân là Đức Chúa Trời, đồng thời chú thích bảo lưu hình thức bị động của nguyên văn.
- source_word: ἐν τῷ σώματι τῆς σαρκὸς αὐτοῦ
  choice: trong thân thể bằng xương bằng thịt của ngài
  rationale: Diễn đạt tự nhiên ý về thân thể vật chất có thật, không biến σάρξ thành khái niệm 'bản tính tội lỗi'.
- source_word: διὰ τοῦ θανάτου
  choice: qua sự chết
  rationale: Bảo lưu cách diễn đạt cô đọng của διά với sở hữu cách về phương tiện; trong ngữ cảnh, đó là sự chết của Đấng Christ.
- source_word: παραστῆσαι
  choice: để trình diện
  rationale: Thể hiện mục đích hoặc kết quả của sự hòa giải và phù hợp với bối cảnh đứng trước mặt ngài.
- source_word: ἁγίους
  choice: thánh khiết
  rationale: Từ ngữ quen thuộc, giữ được cả ý biệt riêng và sự tinh sạch.
- source_word: ἀμώμους
  choice: không tì vết
  rationale: Giữ sắc thái tế lễ của từ Hy Lạp rõ hơn 'không chỗ trách', trong khi vẫn dễ hiểu đối với độc giả hiện đại.
- source_word: ἀνεγκλήτους
  choice: không thể bị cáo buộc
  rationale: 'Bảo lưu sắc thái pháp đình: không có cáo buộc nào có thể đứng vững, đồng thời phân biệt với ἀμώμους.'
- source_word: κατενώπιον αὐτοῦ
  choice: trước mặt ngài
  rationale: Giữ nguyên đại từ không xác định rõ hơn Đức Chúa Trời hay Đấng Christ, như văn bản Hy Lạp.
theological_decisions:
- issue: Tác nhân của động từ bị động ἀποκατηλλάγητε
  choice: Dùng câu chủ động 'ngài đã hòa giải anh chị em' và ghi chú dạng bị động.
  alternative: '''anh chị em đã được hòa giải'''
  rationale: Ngữ cảnh cho thấy sáng kiến hòa giải thuộc về Đức Chúa Trời, nhưng vì hình thái Hy Lạp là bị động nên ghi chú bảo tồn sự mơ hồ ngữ pháp chân thực.
- issue: Ý nghĩa của σάρξ trong cụm nói về thân thể
  choice: 'Hiểu theo nghĩa thân thể vật chất: ''bằng xương bằng thịt''.'
  alternative: '''xác thịt'' hoặc ''bản tính tội lỗi'''
  rationale: Cụm này nhấn mạnh nhân tính có thân thể thật và cái chết thật của Đấng Christ; nghĩa luân lý 'bản tính tội lỗi' không phù hợp.
- issue: Sự phân biệt giữa ἀμώμους và ἀνεγκλήτους
  choice: '''không tì vết'' và ''không thể bị cáo buộc'''
  alternative: '''không chỗ trách và không có gì đáng chê trách'''
  rationale: Cách dịch đã chọn bảo tồn sắc thái tế lễ của từ thứ nhất và sắc thái pháp đình của từ thứ hai, tránh làm hai từ trở thành đồng nghĩa.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” cho đại từ số nhiều ὑμᾶς; dùng “ngài” để không viết hoa đại từ theo một quy ước hệ phái. Trật tự 'qua sự chết' được đưa lên trước để tránh khiến tiếng Việt hiểu nhầm rằng thân thể được tạo nên qua sự chết.
