id: COL.1.29
reference: Colossians 1:29
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἰς ὃ καὶ κοπιῶ ἀγωνιζόμενος κατὰ τὴν ἐνέργειαν αὐτοῦ τὴν ἐνεργουμένην ἐν ἐμοὶ ἐν δυνάμει.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/029.yaml
  text: For this I also labor[a], striving according to his working[d][c][b], which is working in me in power.
translation:
  language: vi
  text: Vì điều ấy, tôi cũng lao nhọc, phấn đấu theo năng lực của Ngài,[a] tức là năng lực đang hoạt động mạnh mẽ trong tôi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn dùng đại từ “của Ngài”, không nói rõ tại đây là Đức Chúa Trời hay Đấng Christ.
    reason: alternative_reading
lexical_decisions:
- source_word: εἰς ὃ
  choice: Vì mục đích ấy
  rationale: Cụm từ quy chiếu về mục tiêu phục vụ ở câu trước; cách dịch này tự nhiên trong tiếng Việt và giữ sắc thái mục đích, trong khi không thu hẹp nội dung của mục tiêu ấy.
- source_word: καὶ
  choice: cũng
  rationale: 'Diễn tả ý bổ sung: chính Phao-lô cũng dốc sức hướng đến mục tiêu vừa nêu.'
- source_word: κοπιῶ
  choice: lao nhọc
  rationale: Diễn đạt sự làm việc vất vả, hao tổn sức lực; trang trọng nhưng vẫn dễ hiểu trong tiếng Việt hiện đại.
- source_word: ἀγωνιζόμενος
  choice: hết sức tranh đấu
  rationale: Giữ sắc thái nỗ lực mãnh liệt, như trong một cuộc thi đấu hoặc tranh chiến, đồng thời làm rõ cường độ của phân từ bổ nghĩa cho việc lao nhọc.
- source_word: κατὰ
  choice: theo
  rationale: 'Giữ quan hệ về chuẩn mực hoặc mức độ: sự tranh đấu của Phao-lô tương ứng với sự vận hành nơi Ngài, chứ không đơn thuần phát xuất từ sức riêng.'
- source_word: ἐνέργειαν
  choice: sự vận hành
  rationale: Chỉ quyền năng đang hoạt động và tạo hiệu quả; đồng thời cho phép giữ mối liên hệ từ nguyên với ἐνεργουμένην ở vế sau.
- source_word: αὐτοῦ
  choice: của Ngài
  rationale: Giữ đại từ nam số ít của nguyên văn mà không tự ý xác định rõ đó là Đức Chúa Trời hay Đấng Christ.
- source_word: τὴν ἐνεργουμένην
  choice: là sự đang vận hành
  rationale: Diễn tả hoạt động đang tiếp diễn và lặp lại có chủ ý từ 'vận hành' để phản ánh sự lặp từ cùng gốc trong tiếng Hy Lạp.
- source_word: ἐν ἐμοὶ
  choice: trong tôi
  rationale: Phản ánh trực tiếp ἐν và giữ ý quyền năng hoạt động bên trong Phao-lô, không chuyển thành nghĩa công cụ 'qua tôi'.
- source_word: ἐν δυνάμει
  choice: mạnh mẽ
  rationale: Dịch theo chức năng trạng ngữ tự nhiên trong tiếng Việt, truyền đạt rằng sự vận hành ấy diễn ra với quyền năng lớn.
theological_decisions:
- issue: Đối tượng được đại từ αὐτοῦ ('của Ngài') quy chiếu
  choice: Giữ đại từ 'của Ngài' và không nêu đích danh đối tượng.
  alternative: Dịch là 'sự vận hành của Đức Chúa Trời' hoặc 'sự vận hành của Đấng Christ'.
  rationale: Câu Hy Lạp chỉ dùng đại từ; văn mạch có thể dẫn người đọc đến Đức Chúa Trời hoặc Đấng Christ. Giữ đại từ bảo toàn độ mở của nguyên văn và tránh quyết định thay cho người đọc.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ đọc. 'Lao nhọc' cùng 'hết sức tranh đấu' giữ cường độ của hai từ Hy Lạp; 'sự vận hành ... vận hành' chủ ý phản ánh phép lặp từ cùng gốc trong nguyên văn. Dấu chú thích [a] đặt ngay sau cụm có đại từ chưa xác định.
