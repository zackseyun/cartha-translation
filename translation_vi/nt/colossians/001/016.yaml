id: COL.1.16
reference: Colossians 1:16
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὅτι ἐν αὐτῷ ἐκτίσθη τὰ ⸀πάντα ἐν τοῖς οὐρανοῖς ⸀καὶ ἐπὶ τῆς γῆς, τὰ ὁρατὰ καὶ τὰ ἀόρατα, εἴτε θρόνοι εἴτε κυριότητες εἴτε ἀρχαὶ εἴτε ἐξουσίαι· τὰ πάντα δι’ αὐτοῦ καὶ εἰς αὐτὸν ἔκτισται·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/016.yaml
  text: For in him all things were created[a], in the heavens and on the earth, the visible and the invisible, whether thrones or dominions or rulers or authorities[d][c][b]; all things have been created through him and for him.
translation:
  language: vi
  text: Vì trong Ngài, muôn vật đã được tạo dựng[a]—trong các tầng trời và trên đất[b], những gì hữu hình và vô hình, dù là ngai vị, quyền thống trị[c], quyền cai trị hay thẩm quyền—muôn vật đều đã được tạo dựng qua Ngài và cho Ngài.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch mở đầu là: “Bởi vì trong Ngài, muôn vật đã được tạo dựng.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “trên trời và trên đất”; tiếng Hy Lạp dùng dạng số nhiều, sát nghĩa là “trong các tầng trời”.'
    reason: lexical_alternative
  - marker: c
    text: “Quyền thống trị” cũng có thể dịch là “các quyền chủ trị”; các từ trong danh sách này có lẽ chỉ những cấp bậc quyền lực thuộc trật tự thọ tạo.
    reason: lexical_alternative
  - marker: d
    text: “Cho Ngài” diễn tả Ngài là mục tiêu của công trình sáng tạo; cũng có thể dịch sát hướng tính hơn là “hướng về Ngài”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Vì
  rationale: Diễn đạt tự nhiên quan hệ nguyên nhân với câu trước, tương ứng với nghĩa “vì/bởi vì” của liên từ.
- source_word: ἐν αὐτῷ
  choice: trong Ngài
  rationale: Giữ nguyên sắc thái của ἐν và phân biệt với δι’ αὐτοῦ (“qua Ngài”) ở vế sau, thay vì diễn giải cả hai như nhau.
- source_word: ἐκτίσθη / ἔκτισται
  choice: đã được tạo dựng
  rationale: Thể bị động được giữ rõ; “tạo dựng” phù hợp ngữ cảnh công trình sáng tạo. Tiếng Việt không bắt buộc phân biệt hình thái giữa aorist và perfect như tiếng Hy Lạp.
- source_word: τὰ πάντα
  choice: muôn vật
  rationale: Cách nói tự nhiên, trang trọng và bao quát trong tiếng Việt, không thu hẹp phạm vi của nguyên văn.
- source_word: ἐν τοῖς οὐρανοῖς
  choice: trong các tầng trời
  rationale: Giữ số nhiều của οὐρανοῖς và tránh biến cụm từ thành một khái niệm được diễn giải quá mức.
- source_word: ἐπὶ τῆς γῆς
  choice: trên đất
  rationale: Cách diễn đạt tự nhiên của ἐπί với sở hữu cách trong cặp đối ứng chỉ toàn thể vũ trụ.
- source_word: τὰ ὁρατὰ καὶ τὰ ἀόρατα
  choice: những gì hữu hình và vô hình
  rationale: Diễn đạt tự nhiên hai tính từ được dùng như danh từ, đồng thời giữ nguyên sự tương phản.
- source_word: θρόνοι
  choice: ngai vị
  rationale: Giữ hình ảnh nguyên văn nhưng dùng “ngai vị” để có thể chỉ địa vị hoặc cấp bậc quyền lực, không chỉ một đồ vật.
- source_word: κυριότητες
  choice: quyền thống trị
  rationale: Chuyển tải ý nghĩa quyền làm chủ hoặc thống trị mà không xác định đây nhất thiết là một phẩm trật thiên sứ.
- source_word: ἀρχαὶ
  choice: quyền cai trị
  rationale: Thể hiện ý niệm cai quản của từ này bằng tiếng Việt hiện đại và vẫn phân biệt với ἐξουσίαι.
- source_word: ἐξουσίαι
  choice: thẩm quyền
  rationale: Diễn đạt trực tiếp quyền hạn hợp pháp hoặc năng lực thực thi quyền lực, phân biệt với “quyền cai trị”.
- source_word: δι’ αὐτοῦ
  choice: qua Ngài
  rationale: Giữ vai trò trung gian hoặc tác nhân được diễn đạt bằng διά.
- source_word: εἰς αὐτόν
  choice: cho Ngài
  rationale: Diễn đạt đích đến hoặc mục tiêu của công trình sáng tạo bằng tiếng Việt tự nhiên; chú thích giữ phương án sát hướng tính hơn.
theological_decisions:
- issue: Mối liên hệ của Con với công trình sáng tạo qua ba cụm giới từ ἐν αὐτῷ / δι’ αὐτοῦ / εἰς αὐτόν
  choice: 'Giữ ba cách diễn đạt riêng biệt: “trong Ngài … qua Ngài … cho Ngài”.'
  alternative: “bởi Ngài … nhờ Ngài … vì Ngài” hoặc “trong sự hiệp nhất với Ngài … qua Ngài … hướng về Ngài”.
  rationale: Nguyên văn cố ý dùng ba giới từ khác nhau. Bản dịch không đồng nhất chúng thành một ý duy nhất, nhờ đó bảo toàn sự phong phú và độ căng thần học của câu.
- issue: Bản chất của “ngai vị, quyền thống trị, quyền cai trị hay thẩm quyền”
  choice: Dịch như những hạng mục hoặc cấp bậc quyền lực thuộc trật tự thọ tạo, không xác định cụ thể bản thể của chúng.
  alternative: Gọi rõ đây là các phẩm trật thiên sứ, các linh lực, hoặc các cơ cấu chính trị của loài người.
  rationale: Câu này không giới hạn các thuật ngữ ấy vào riêng thế giới thiên sứ, thế giới linh hoặc chính quyền trần thế; bản dịch tránh bổ sung điều nguyên văn không nói rõ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng “Ngài” để chỉ Đức Con theo ngữ cảnh. Dấu gạch ngang làm rõ phần liệt kê mà vẫn giữ toàn câu thống nhất; các thuật ngữ quyền lực được dịch đủ phân biệt nhưng không áp đặt một hệ thống phẩm trật cụ thể.
