  source_fidelity: Bản dịch giữ đúng quan hệ nhân quả của ὅτι, phân biệt nhất quán ba cụm giới từ “trong Ngài … qua Ngài … cho Ngài”, và diễn đạt đầy đủ phạm vi vũ trụ cùng chuỗi bốn hạng mục quyền lực. “Đã được tạo dựng” giữ được thể bị động; việc không ép các hạng mục quyền lực vào một bản thể cụ thể là phù hợp.
  naturalness: Văn phong trang trọng, hiện đại và dễ đọc. Cấu trúc với dấu gạch ngang giúp giữ câu thống nhất. Tuy nhiên, chú thích b dùng “dưới đất”, trong khi nguyên văn là “trên đất”; cách này có thể gợi một phạm vi khác với ἐπὶ τῆς γῆς.
