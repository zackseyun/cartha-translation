- from: Chính Ngài là Đấng chúng tôi rao truyền; chúng tôi cảnh tỉnh từng người và dạy dỗ từng người bằng mọi sự khôn ngoan, để có thể trình diện từng người là người trưởng thành trong Đấng Christ.
