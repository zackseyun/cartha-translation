language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὃν ἡμεῖς καταγγέλλομεν νουθετοῦντες πάντα ἄνθρωπον καὶ διδάσκοντες πάντα ἄνθρωπον ἐν πάσῃ σοφίᾳ, ἵνα παραστήσωμεν πάντα ἄνθρωπον τέλειον ἐν ⸀Χριστῷ·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/028.yaml
  text: Him we proclaim, warning every person and teaching every person with all wisdom, so that we may present every person mature in Messiah.
translation:
  language: vi
  text: Chính Ngài là Đấng chúng tôi rao truyền; chúng tôi cảnh báo từng người và dạy dỗ từng người với tất cả sự khôn ngoan, để chúng tôi có thể trình mỗi người ra là người trưởng thành trong Đấng Christ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὃν
  choice: Chính Ngài là Đấng
  rationale: Đại từ quan hệ chỉ về Đấng Christ ở câu trước; cách diễn đạt này giữ sự nhấn mạnh do ὃν được đặt đầu câu và tạo câu tiếng Việt tự nhiên.
- source_word: καταγγέλλομεν
  choice: rao truyền
  rationale: Diễn tả việc công khai công bố một sứ điệp, phù hợp ngữ cảnh truyền giảng về Đấng Christ.
- source_word: νουθετοῦντες
  choice: cảnh tỉnh
  rationale: Bao hàm việc dùng lời nói để khuyên bảo và cảnh báo nhằm sửa đổi nhận thức hoặc hành vi, không thu hẹp thành sự quở trách.
- source_word: πάντα ἄνθρωπον
  choice: từng người
  rationale: 'Giữ sắc thái phân phối của cụm từ được lặp ba lần: không một người nào bị loại trừ, đồng thời tự nhiên hơn việc lặp ''mọi người'' trong tiếng Việt.'
- source_word: ἐν πάσῃ σοφίᾳ
  choice: bằng mọi sự khôn ngoan
  rationale: Giữ phạm vi rộng của πάσῃ và hiểu ἐν theo nghĩa phương tiện/cách thức, nhưng không xác định nguồn của sự khôn ngoan ngoài điều văn bản nói.
- source_word: παραστήσωμεν
  choice: trình diện
  rationale: Giữ ý đưa một người ra đứng trước mặt ai đó để được nhìn nhận hoặc xét nhận, đồng thời không tự thêm đối tượng mà bản Hy Lạp không nêu rõ.
- source_word: τέλειον
  choice: người trưởng thành
  rationale: Trong ngữ cảnh môn đồ hóa, từ này chỉ sự trưởng thành hay trọn vẹn về thuộc linh hơn là sự hoàn hảo tuyệt đối.
- source_word: ἐν Χριστῷ
  choice: trong Đấng Christ
  rationale: Giữ nguyên ngôn ngữ kết hợp/vị thế của ἐν và tước hiệu Χριστός, không diễn giải thành một quan hệ cụ thể hơn.
theological_decisions:
- issue: Ý nghĩa của τέλειον
  choice: người trưởng thành
  alternative: trọn vẹn
  rationale: ‘Trưởng thành’ phù hợp với tiến trình cảnh tỉnh và dạy dỗ, đồng thời tránh gợi ý rằng tín hữu đã đạt sự vô tội tuyệt đối; tuy vậy, chiều kích trọn vẹn của từ vẫn được hàm chứa.
- issue: Đối tượng ngầm của παραστήσωμεν
  choice: không thêm ‘trước mặt Đức Chúa Trời’
  alternative: trình diện trước mặt Đức Chúa Trời
  rationale: Ngữ cảnh có thể hàm ý trình diện trước Đức Chúa Trời, nhưng câu Hy Lạp không nêu đối tượng; bản dịch giữ sự bỏ ngỏ ấy.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ nguyên ba lần lặp ‘từng người’ để bảo toàn nhấn mạnh tu từ của nguyên bản; dùng ‘Đấng Christ’ theo cách gọi quen thuộc trong tiếng Việt.
