  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὅτι ἐν αὐτῷ εὐδόκησεν πᾶν τὸ πλήρωμα κατοικῆσαι
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/019.yaml
  text: For in him all the fullness was pleased to dwell[c][b][a],
translation:
  language: vi
  text: Vì[a] trong Ngài, toàn thể sự viên mãn[c] đã vui lòng cư ngụ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “Bởi vì”; liên từ này có thể được hiểu theo hơn một sắc thái giải thích trong văn cảnh.
    reason: lexical_alternative
  - marker: b
    text: 'Nhiều bản dịch nêu rõ một chủ ngữ được hiểu ngầm: “Vì Đức Chúa Trời đã vui lòng cho toàn thể sự viên mãn của Ngài cư ngụ trong Ngài” hoặc “Vì Đức Chúa Cha đã vui lòng…”. Tiếng Hy Lạp không trực tiếp nêu “Đức Chúa Trời” hay “Đức Chúa Cha” làm chủ ngữ.'
    reason: alternative_reading
  - marker: c
    text: “Toàn thể sự viên mãn” thường được hiểu là sự viên mãn của Đức Chúa Trời; so sánh Cô-lô-se 2:9.
    reason: cross_reference
lexical_decisions:
- source_word: ὅτι
  choice: Vì
  rationale: Liên từ này nêu lý do hoặc cơ sở cho những lời khẳng định ngay trước đó về Người Con. “Vì” truyền đạt tự nhiên sắc thái giải thích, trong khi chú thích vẫn ghi nhận cách hiểu khác theo mạch văn.
- source_word: ἐν αὐτῷ
  choice: trong Ngài
  rationale: Đại từ chỉ về Người Con trong văn cảnh gần. Cách dịch này giữ nguyên đại từ của tiếng Hy Lạp, không tự ý thêm “Đấng Christ” hay “Đấng Mê-si-a” vào câu.
- source_word: εὐδόκησεν
  choice: đã vui lòng
  rationale: Động từ diễn tả sự ưng thuận hay niềm vui trong ý định. “Đã vui lòng” giữ được sắc thái tích cực và trang trọng, đồng thời không tự thêm “Đức Chúa Trời” hoặc “Đức Chúa Cha” làm chủ ngữ.
- source_word: πᾶν τὸ πλήρωμα
  choice: tất cả sự viên mãn
  rationale: Cụm từ có tính xác định và bao quát. “Tất cả sự viên mãn” giữ lực tổng quát của πᾶν và không thêm cụm “của Đức Chúa Trời,” vốn được suy ra từ văn cảnh nhưng không hiện diện trong câu Hy Lạp.
- source_word: κατοικῆσαι
  choice: ngự trị
  rationale: Động từ nguyên mẫu nói đến việc cư ngụ hay lập nơi ở lâu dài. “Ngự trị” tự nhiên trong văn phong thần học trang trọng và phù hợp với sự nhân cách hóa của “sự viên mãn,” dù “cư ngụ” cũng là một khả năng sát nghĩa.
theological_decisions:
- issue: Chủ ngữ của εὐδόκησεν
  choice: 'Giữ cấu trúc trong đó “tất cả sự viên mãn” có thể được hiểu là chủ ngữ: “tất cả sự viên mãn đã vui lòng ngự trị.”'
  alternative: “Vì Đức Chúa Trời đã vui lòng cho tất cả sự viên mãn của Ngài ngự trong Người” hoặc “Vì Đức Chúa Cha đã vui lòng…”
  rationale: Trong tiếng Hy Lạp, πᾶν τὸ πλήρωμα có thể là chủ ngữ trung tính số ít của εὐδόκησεν, còn nhiều cách dịch truyền thống hiểu Đức Chúa Trời hay Đức Chúa Cha là chủ ngữ được ngầm chỉ và hiểu cụm “sự viên mãn” theo một quan hệ cú pháp khác. Bản dịch chính không thêm một chủ ngữ thần học không được nêu trực tiếp; chú thích ghi nhận cách hiểu phổ biến kia.
- issue: Nội dung của “sự viên mãn”
  choice: Giữ nguyên “tất cả sự viên mãn,” không mở rộng thành “tất cả sự viên mãn của Đức Chúa Trời.”
  alternative: “tất cả sự viên mãn của Đức Chúa Trời” hoặc “tất cả sự viên mãn của Ngài”
  rationale: Cô-lô-se 2:9 hỗ trợ mạnh cho cách hiểu đây là sự viên mãn của thần tính, nhưng câu này không có thành phần sở hữu tương ứng. Giữ cụm từ không mở rộng vừa trung thành với nguồn vừa bảo toàn sức nặng và độ mở của lời văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Ngài” giữ cách xưng hô tôn kính dành cho Người Con trong văn cảnh. “Ngự trị” tạo sắc thái trang nghiêm phù hợp với mệnh đề thần học, nhưng không thêm một danh hiệu hay thành phần sở hữu không có trong nguyên văn.
