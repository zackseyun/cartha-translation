  source_fidelity: Bản nháp giữ đúng liên từ giải thích, đại từ quy chiếu về Người Con, và để ngỏ chủ ngữ của εὐδόκησεν, phù hợp với sự mơ hồ cú pháp của tiếng Hy Lạp. Tuy nhiên, “ngự trị” nghĩa là cai trị/thống trị, không phải κατοικῆσαι (“cư ngụ, ở lại, làm nơi ở”).
  naturalness: Cấu trúc “toàn thể sự viên mãn đã vui lòng cư ngụ” vẫn có độ lạ có chủ ý vì phản ánh cấu trúc nguồn và không tự thêm chủ ngữ. “Toàn thể sự viên mãn” tự nhiên và gọn hơn “tất cả sự viên mãn” trong văn phong trang trọng hiện đại.
  terminology: Dùng “Ngài” cho Người Con là nhất quán với văn thể tôn kính. “Sự viên mãn” giữ nguyên thuật ngữ then chốt mà không thêm “của Đức Chúa Trời”. “Cư ngụ” là tương đương đúng của κατοικῆσαι; không dùng “ngự trị”.
