- from: Vì[a] trong Ngài, tất cả sự viên mãn[c] đã vui lòng ngự trị.[b]
  to: Vì[a] trong Ngài, toàn thể sự viên mãn[c] đã vui lòng cư ngụ.[b]
  rationale: Thay “ngự trị” bằng “cư ngụ” để dịch đúng κατοικῆσαι. Điều chỉnh nhẹ “tất cả” thành “toàn thể” cho tự nhiên hơn, đồng thời vẫn giữ cụm danh từ không mở rộng và chủ ngữ của “đã vui lòng” không được nêu rõ. Chú thích b được cập nhật đồng bộ với cách dịch “cư ngụ” và đại từ tôn kính “Ngài”.
