id: COL.1.3
reference: Colossians 1:3
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Εὐχαριστοῦμεν τῷ ⸀θεῷ πατρὶ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ πάντοτε ⸀περὶ ὑμῶν προσευχόμενοι,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/003.yaml
  text: We always give thanks to God[a], the Father of our Lord Jesus the Messiah, when we pray for you,
translation:
  language: vi
  text: Chúng tôi luôn tạ ơn Đức Chúa Trời, là Cha của Chúa chúng ta—Chúa Giê-su, Đấng Mê-si—khi cầu nguyện cho anh chị em.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εὐχαριστοῦμεν
  choice: chúng tôi tạ ơn
  rationale: Diễn đạt tự nhiên hành động dâng lời cảm tạ trong phần mở đầu thư tín, đồng thời giữ ngôi thứ nhất số nhiều của động từ Hy Lạp.
- source_word: τῷ θεῷ πατρὶ
  choice: Đức Chúa Trời, là Cha
  rationale: Hai danh từ cách dữ cách được hiểu theo quan hệ đồng vị; từ “là” giúp quan hệ ấy rõ ràng và tự nhiên trong tiếng Việt.
- source_word: τοῦ κυρίου ἡμῶν
  choice: của Chúa chúng ta
  rationale: Giữ κύριος là tước hiệu “Chúa” và bảo toàn quan hệ sở hữu trong nguyên văn.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Chúa Giê-su, Đấng Mê-si
  rationale: Χριστός vẫn có sức nặng của một tước hiệu trong ngữ cảnh này; “Đấng Mê-si” truyền đạt ý nghĩa ấy thay vì biến từ này thành một họ riêng. “Chúa Giê-su” là thành phần đồng vị làm rõ “Chúa chúng ta”.
- source_word: πάντοτε
  choice: luôn
  rationale: Tương đương trực tiếp và tự nhiên với ý “luôn luôn”, được đặt gần động từ chính “tạ ơn” để phản ánh cách hiểu cú pháp có khả năng nhất.
- source_word: περὶ ὑμῶν
  choice: cho anh chị em
  rationale: Với động từ cầu nguyện, περί cộng sở hữu cách chỉ những người được cầu thay; “cho” là cách nói tự nhiên trong tiếng Việt. “Anh chị em” diễn đạt đại từ số nhiều và phù hợp lời xưng hô với cộng đồng tín hữu.
- source_word: προσευχόμενοι
  choice: mỗi khi cầu nguyện
  rationale: Phân từ hiện tại nêu hoàn cảnh đồng thời của việc tạ ơn. “Mỗi khi” liên kết tự nhiên với “luôn” mà không biến phân từ thành một mệnh đề độc lập.
theological_decisions:
- issue: Cách dịch Χριστός trong phần tạ ơn của thư Phao-lô
  choice: Đấng Mê-si
  alternative: Cơ Đốc
  rationale: Trong câu này, Χριστός có thể được nghe như tước hiệu chứ không chỉ là thành tố tên riêng. “Đấng Mê-si” làm rõ nghĩa của tước hiệu; cách gọi truyền thống “Cơ Đốc” được giữ trong chú thích.
- issue: Quan hệ giữa θεῷ và πατρὶ
  choice: Đức Chúa Trời, là Cha
  alternative: Đức Chúa Trời là Cha
  rationale: Cách dịch được chọn biểu thị quan hệ đồng vị và tránh hiểu hai từ như hai đối tượng phối hợp, nhưng không thêm một định thức thần học vượt quá cú pháp Hy Lạp.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. Dấu gạch ngang làm rõ “Chúa Giê-su, Đấng Mê-si” là thành phần đồng vị của “Chúa chúng ta”. Cấu trúc “luôn… mỗi khi…” giữ mối liên hệ giữa πάντοτε và phân từ προσευχόμενοι mà vẫn tự nhiên trong tiếng Việt.
