id: COL.1.13
reference: Colossians 1:13
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὃς ἐρρύσατο ἡμᾶς ἐκ τῆς ἐξουσίας τοῦ σκότους καὶ μετέστησεν εἰς τὴν βασιλείαν τοῦ υἱοῦ τῆς ἀγάπης αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/013.yaml
  text: who rescued us from the authority of darkness and transferred us into the kingdom of the Son of his love,[a]
translation:
  language: vi
  text: Ngài đã giải cứu chúng ta khỏi quyền lực của bóng tối và chuyển chúng ta vào vương quốc của Con yêu dấu của Ngài.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Con mà Ngài yêu thương”; sát chữ: “Con của tình yêu Ngài.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐρρύσατο
  choice: đã giải cứu
  rationale: Diễn đạt hành động can thiệp dứt khoát để cứu khỏi một quyền lực thù nghịch; tự nhiên và rõ nghĩa trong tiếng Việt hiện đại.
- source_word: ἐξουσίας
  choice: quyền lực
  rationale: Trong ngữ cảnh này, từ chỉ quyền cai trị hoặc thế lực đang thống trị; “quyền lực” vừa sát nghĩa vừa phù hợp với hình ảnh đối lập giữa hai vương quyền.
- source_word: σκότους
  choice: bóng tối
  rationale: Giữ nguyên hình ảnh bóng tối và để các hàm ý đạo đức, tâm linh được ngữ cảnh truyền đạt.
- source_word: μετέστησεν
  choice: chuyển
  rationale: Thể hiện việc đưa từ quyền cai trị này sang một vương quốc khác mà không thêm ý không có trong nguyên văn.
- source_word: βασιλείαν
  choice: vương quốc
  rationale: Phù hợp với chuyển động “vào” và bao hàm lĩnh vực nằm dưới quyền trị vì của Con.
- source_word: υἱοῦ
  choice: Con
  rationale: Dịch trực tiếp υἱός; viết hoa vì trong ngữ cảnh từ này chỉ về Con độc nhất của Đức Chúa Trời.
- source_word: τοῦ υἱοῦ τῆς ἀγάπης αὐτοῦ
  choice: Con yêu dấu Ngài
  rationale: Cấu trúc sát chữ “Con của tình yêu Ngài” không tự nhiên và dễ mơ hồ trong tiếng Việt. “Con yêu dấu Ngài” diễn đạt gọn, trang trọng ý nghĩa thành ngữ của sở hữu cách Hy Lạp, đồng thời chú thích giữ phương án minh giải khác.
theological_decisions:
- issue: Cách dịch τοῦ υἱοῦ τῆς ἀγάπης αὐτοῦ
  choice: Con yêu dấu Ngài
  alternative: 'Con mà Ngài yêu thương; sát chữ: Con của tình yêu Ngài'
  rationale: Cụm sở hữu cách có thể được hiểu là diễn tả tình yêu đặc biệt của Cha dành cho Con. Bản chính dùng cách nói tự nhiên trong tiếng Việt nhưng chú thích bảo tồn cấu trúc sát chữ và một cách diễn đạt minh nhiên hơn, không xác định quá mức sắc thái của sở hữu cách.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “Ngài” để nối đại từ quan hệ ὃς với Đức Chúa Cha trong câu trước; giữ hình ảnh “bóng tối,” “quyền lực” và “vương quốc.”
