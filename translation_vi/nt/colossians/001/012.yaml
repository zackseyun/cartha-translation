    issue: “hãy cảm tạ” dùng thức mệnh lệnh cho εὐχαριστοῦντες.
    rationale: εὐχαριστοῦντες là phân từ hiện tại, nối tiếp mạch khuyến exhortation của câu trước. Trong tiếng Việt, bỏ “hãy” giúp giữ câu như một vế tham gia của cấu trúc đang tiếp diễn, thay vì tạo một mệnh lệnh độc lập.
  - severity: low
    issue: “dự phần cơ nghiệp” không nêu rõ ý “phần” của μερίδα.
    rationale: Cách dịch này có thể hiểu là tham gia vào cơ nghiệp nói chung. Thêm “phần cơ nghiệp” bảo lưu rõ hơn quan hệ μερίδα τοῦ κλήρου mà vẫn tự nhiên.
