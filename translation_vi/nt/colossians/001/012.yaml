  verdict: revise
  source_fidelity: Bản dịch theo đúng các yếu tố chính của câu, gồm dị bản “anh chị em/chúng ta,” hình ảnh cơ nghiệp và cụm “trong ánh sáng.” Tuy nhiên, “hãy cảm tạ” biến phân từ hiện tại εὐχαριστοῦντες thành mệnh lệnh độc lập; trong mạch câu đang tiếp diễn, “cảm tạ” giữ chức năng và sắc thái của nguyên ngữ tốt hơn. “Dự phần cơ nghiệp” cũng chưa biểu lộ rõ μερίδα, tức phần được hưởng trong cơ nghiệp.
  naturalness: “Cảm tạ Cha, Đấng đã làm cho anh chị em đủ tư cách để được hưởng phần cơ nghiệp...” là tiếng Việt hiện đại, trang trọng, rõ nghĩa và phù hợp với một vế câu tiếp nối. Cụm “để được hưởng phần cơ nghiệp” diễn đạt tự nhiên hơn đồng thời bảo lưu cả ý “phần” lẫn “cơ nghiệp.”
  terminology: Giữ “Cha,” “anh chị em,” “cơ nghiệp,” “các thánh đồ,” và “trong ánh sáng.” “Các thánh đồ” là thuật ngữ truyền thống chấp nhận được trong văn phong Kinh Thánh hiện đại. Chú thích b được chỉnh để diễn đạt chính xác hơn hình ảnh phần cơ nghiệp được phân định, không áp đặt một cách giải nghĩa thần học.
  issues:
