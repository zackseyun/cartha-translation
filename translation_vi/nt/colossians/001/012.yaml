source:
  edition: SBLGNT
  text: εὐχαριστοῦντες τῷ πατρὶ τῷ ἱκανώσαντι ⸀ὑμᾶς εἰς τὴν μερίδα τοῦ κλήρου τῶν ἁγίων ἐν τῷ φωτί,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/012.yaml
  text: giving thanks to the Father[a], who has qualified you for the share of the inheritance of the saints in the light[b],
translation:
  language: vi
  text: cảm tạ Cha[a], Đấng đã làm cho anh chị em đủ tư cách để được hưởng phần cơ nghiệp của các thánh đồ trong ánh sáng[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Một số thủ bản chép “chúng ta” thay vì “anh chị em”.
    reason: textual_variant
  - marker: b
    text: 'Cũng có thể dịch: “phần cơ nghiệp được phân cho các thánh đồ trong ánh sáng”; tiếng Hy Lạp gợi hình ảnh một cơ nghiệp được phân chia.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐχαριστοῦντες
  choice: hãy cảm tạ
  rationale: Phân từ hiện tại chủ động, số nhiều, tiếp nối mạch khuyên bảo trước đó; cách dịch này tự nhiên trong tiếng Việt và diễn đạt hành động tiếp diễn trong chuỗi lời khuyên.
- source_word: τῷ πατρὶ
  choice: Cha
  rationale: Bản Hy Lạp nói trực tiếp đến “Cha”; không thêm “Đức Chúa Trời” vì điều đó không có trong câu này.
- source_word: ἱκανώσαντι
  choice: Đấng đã làm cho ... đủ tư cách
  rationale: ἱκανόω có nghĩa làm cho đủ khả năng, thích hợp hoặc đủ tư cách; cách dịch này giữ vai trò chủ động của Cha và không thu hẹp ý thành chỉ cho phép.
- source_word: ὑμᾶς
  choice: anh chị em
  rationale: Theo SBLGNT là ngôi thứ hai số nhiều; “anh chị em” diễn đạt tự nhiên lời Phao-lô nói với cả cộng đồng tín hữu. Dị bản “chúng ta” được ghi ở chú thích.
- source_word: εἰς τὴν μερίδα
  choice: dự phần
  rationale: μερίς chỉ phần hay phần được chia; kết hợp với εἰς, “dự phần” truyền đạt tự nhiên ý được đưa vào sự hưởng phần.
- source_word: τοῦ κλήρου
  choice: cơ nghiệp
  rationale: κλῆρος gợi cả phần được bắt thăm, phần được phân chia và cơ nghiệp; “cơ nghiệp” phù hợp bối cảnh cứu cánh và vẫn giữ âm hưởng về phần được ban.
- source_word: τῶν ἁγίων
  choice: của các thánh đồ
  rationale: Trong cách dùng của Phao-lô, từ này thường chỉ dân được biệt riêng cho Đức Chúa Trời; “các thánh đồ” ngắn gọn và duy trì liên hệ từ vựng truyền thống.
- source_word: ἐν τῷ φωτί
  choice: trong ánh sáng
  rationale: Giữ nguyên hình ảnh và sự mở rộng thần học của cụm từ, đồng thời để ngỏ phạm vi liên kết cú pháp như trong tiếng Hy Lạp.
theological_decisions:
- issue: Dị bản đại từ làm tân ngữ
  choice: anh chị em
  alternative: chúng ta
  rationale: Bản văn SBLGNT được cung cấp đọc ὑμᾶς, nên bản chính theo “anh chị em”; dị bản ἡμᾶς đáng chú ý được bảo tồn trong chú thích.
- issue: Mối liên hệ giữa phần được chia và cơ nghiệp
  choice: dự phần cơ nghiệp
  alternative: nhận phần được phân cho các thánh đồ
  rationale: Cách dịch chính tự nhiên và giữ ý tham dự vào cơ nghiệp, trong khi chú thích bảo tồn hình ảnh cụ thể về phần được phân chia mà không buộc một cách giải nghĩa duy nhất.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” cho đại từ số nhiều hướng đến toàn thể hội chúng; dùng “cơ nghiệp” để bảo tồn nền hình ảnh Kinh Thánh về phần được ban. Dấu phẩy cuối câu phản ánh đây là một phần của câu dài hơn trong ngữ cảnh.
