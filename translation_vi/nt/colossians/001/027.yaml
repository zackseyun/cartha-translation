  source_fidelity: 'Bản dịch truyền đạt đúng các thành tố chính của câu: ý định của Đức Chúa Trời, sự tỏ cho biết, huyền nhiệm giữa các dân ngoại, Đấng Mê-si-a trong/giữa cộng đồng người nhận, và niềm hy vọng về vinh quang. Tuy nhiên, cụm “sự phong phú của vinh quang trong huyền nhiệm này” làm thay đổi nhẹ quan hệ sở thuộc liên tiếp τὸ πλοῦτος τῆς δόξης τοῦ μυστηρίου τούτου: nguyên văn nói về “sự phong phú của vinh quang của huyền nhiệm này,” không phải chủ yếu là vinh quang ‘trong’ huyền nhiệm.'
