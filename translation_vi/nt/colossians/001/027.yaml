source:
  edition: SBLGNT
  text: οἷς ἠθέλησεν ὁ θεὸς γνωρίσαι τί τὸ πλοῦτος τῆς δόξης τοῦ μυστηρίου τούτου ἐν τοῖς ἔθνεσιν, ⸀ὅ ἐστιν Χριστὸς ἐν ὑμῖν, ἡ ἐλπὶς τῆς δόξης·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/027.yaml
  text: To them God chose to make known what is the riches of the glory of this mystery among the Gentiles[a], which is Messiah in you[b], the hope of glory.
translation:
  language: vi
  text: Đức Chúa Trời đã muốn cho họ biết sự phong phú vinh quang của huyền nhiệm này giữa các dân ngoại lớn lao thế nào; huyền nhiệm ấy chính là Đấng Mê-si-a ở trong anh chị em[a], niềm hy vọng về vinh quang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “ở giữa anh chị em.” Cụm từ Hy Lạp có thể chỉ Đấng Mê-si-a ở trong các tín hữu hoặc hiện diện giữa cộng đồng của họ.'
    reason: alternative_reading
lexical_decisions:
- source_word: οἷς
  choice: cho họ
  rationale: Đại từ quan hệ số nhiều cách dữ, chỉ về các thánh đồ ở câu trước và làm tân ngữ gián tiếp của γνωρίσαι; “cho họ biết” tự nhiên trong tiếng Việt.
- source_word: ἠθέλησεν
  choice: đã muốn
  rationale: Giữ trực tiếp ý muốn và chủ định của Đức Chúa Trời trong θέλω, không diễn giải mạnh hơn thành một quyết định tuyển chọn.
- source_word: γνωρίσαι
  choice: cho ... biết
  rationale: Phản ánh nghĩa thông dụng “làm cho biết” của γνωρίζω và tạo câu tiếng Việt tự nhiên.
- source_word: τί τὸ πλοῦτος τῆς δόξης
  choice: sự phong phú của vinh quang ... là thế nào
  rationale: Diễn đạt tự nhiên cấu trúc Hy Lạp cô đọng, trong đó τί hỏi về tính chất hoặc mức độ của sự phong phú, mà không giản lược “vinh quang” thành một tính từ.
- source_word: μυστηρίου
  choice: huyền nhiệm
  rationale: Trong văn mạch Phao-lô, từ này chỉ kế hoạch của Đức Chúa Trời từng được giấu kín nay được bày tỏ; “huyền nhiệm” trang trọng và tránh gợi ý đơn thuần về một câu đố khó hiểu.
- source_word: ἐν τοῖς ἔθνεσιν
  choice: giữa các dân ngoại
  rationale: Trong văn mạch này, ἔθνη chỉ những người không thuộc dân Do Thái; “các dân ngoại” giữ rõ sự phân biệt Do Thái–dân ngoại.
- source_word: ὅ ἐστιν
  choice: huyền nhiệm ấy chính là
  rationale: Làm rõ sở chỉ của đại từ quan hệ trung tính và giữ chức năng giải thích, đồng nhất của mệnh đề.
- source_word: Χριστὸς
  choice: Đấng Mê-si-a
  rationale: Ở đây Χριστός có sức nặng của một tước hiệu và xác định nội dung của huyền nhiệm.
- source_word: ἐν ὑμῖν
  choice: ở trong anh chị em
  rationale: Giữ cách hiểu trực tiếp “ở trong” cùng tính số nhiều của ὑμῖν; “anh chị em” phù hợp với lời nói cùng cộng đồng tín hữu. Nghĩa tập thể “ở giữa anh chị em” được ghi ở chú thích.
- source_word: ἡ ἐλπὶς τῆς δόξης
  choice: niềm hy vọng về vinh quang
  rationale: Giữ sự cô đọng của cụm sở hữu cách, đồng thời “về vinh quang” tự nhiên hơn trong tiếng Việt và không xác định quá mức quan hệ ngữ nghĩa.
theological_decisions:
- issue: Cách dịch Χριστός
  choice: Đấng Mê-si-a
  alternative: Đấng Christ
  rationale: Trong mệnh đề giải thích nội dung của huyền nhiệm, từ này mang chức năng tước hiệu rõ rệt; chọn “Đấng Mê-si-a” mà không thêm một lập trường hệ phái.
- issue: Ý nghĩa của ἐν ὑμῖν
  choice: ở trong anh chị em
  alternative: ở giữa anh chị em
  rationale: Cụm Hy Lạp có thể nói về sự hiện diện bên trong các tín hữu hoặc sự hiện diện giữa cộng đồng của họ. Bản chính giữ cách dịch trực tiếp, còn chú thích bảo tồn cách hiểu tập thể.
- issue: Quan hệ trong ἡ ἐλπὶς τῆς δόξης
  choice: niềm hy vọng về vinh quang
  alternative: niềm hy vọng được hưởng vinh quang
  rationale: Bản chính không giải nghĩa sở hữu cách thành một kết quả cụ thể, nhờ đó giữ độ hàm súc và căng thẳng thần học của nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng “Đức Chúa Trời,” “Đấng Mê-si-a,” “huyền nhiệm,” và cách xưng hô bao quát “anh chị em.” Dấu chấm phẩy giúp phân biệt lời mô tả huyền nhiệm với mệnh đề giải thích nội dung của huyền nhiệm.
