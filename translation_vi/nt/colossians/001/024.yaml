id: COL.1.24
reference: Colossians 1:24
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Νῦν χαίρω ἐν τοῖς παθήμασιν ὑπὲρ ὑμῶν, καὶ ἀνταναπληρῶ τὰ ὑστερήματα τῶν θλίψεων τοῦ Χριστοῦ ἐν τῇ σαρκί μου ὑπὲρ τοῦ σώματος αὐτοῦ, ὅ ἐστιν ἡ ἐκκλησία,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/024.yaml
  text: Now I rejoice in my sufferings for your sake[a], and in my flesh I am filling up what is lacking in the afflictions of the Messiah for the sake of his body, which is the church[b],
translation:
  language: vi
  text: Giờ đây, tôi vui mừng trong những đau khổ vì lợi ích của anh chị em, và trong xác thịt tôi, tôi đang làm đầy những gì còn thiếu trong các hoạn nạn của Đấng Mê-si[a], vì thân thể Ngài, tức là hội thánh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “tôi hoàn tất phần còn lại của các hoạn nạn của Đấng Christ.” Tiếng Hy Lạp dùng Χριστός, nghĩa là “Đấng Mê-si” hoặc “Đấng Christ.” Cách nói “những gì còn thiếu” giữ một diễn đạt khó và hàm súc; tự nó không hàm ý rằng công cuộc chuộc tội của Đấng Mê-si là thiếu sót. Câu có thể nói đến sự dự phần của Phao-lô trong những đau khổ gắn với Đấng Mê-si và thân thể Ngài, là hội thánh.'
    reason: Giữ cách diễn đạt khó của nguyên văn, nêu phương án dịch thay thế và giải thích giới hạn cần thiết mà không áp đặt một cách giải thích duy nhất cho cụm từ đang được tranh luận.
lexical_decisions:
- source_word: Νῦν
  choice: Giờ đây
  rationale: Dấu chỉ thời gian mở đầu lời trình bày về hoàn cảnh và thái độ hiện tại của Phao-lô; cách diễn đạt tự nhiên và trang trọng trong tiếng Việt.
- source_word: χαίρω ἐν τοῖς παθήμασιν
  choice: tôi vui mừng trong những đau khổ
  rationale: 'Giữ nghịch lý mạnh của nguyên văn: Phao-lô vui mừng ngay trong cảnh chịu khổ. ''Những đau khổ'' được hiểu là của ông theo ngữ cảnh ngôi thứ nhất mà không cần thêm đại từ sở hữu.'
- source_word: ὑπὲρ ὑμῶν
  choice: vì anh chị em
  rationale: 'Diễn đạt sắc thái thụ ích của ὑπέρ: những đau khổ ấy đem lại lợi ích cho cộng đồng người nhận thư. ''Anh chị em'' là cách gọi cộng đồng tín hữu tự nhiên, bao quát trong tiếng Việt.'
- source_word: ἀνταναπληρῶ τὰ ὑστερήματα
  choice: tôi đang bù đắp những gì còn thiếu
  rationale: Giữ hình ảnh gây căng thẳng của nguyên văn về việc làm đầy hoặc bù phần còn thiếu, thay vì diễn giải làm nhẹ ngay trong chính văn.
- source_word: τῶν θλίψεων
  choice: các hoạn nạn
  rationale: '''Hoạn nạn'' phân biệt θλίψεις với παθήματα (''đau khổ'') ở đầu câu và truyền đạt ý áp bức, khốn khó.'
- source_word: τοῦ Χριστοῦ
  choice: của Đấng Mê-si
  rationale: Χριστός tại đây mang lực danh hiệu; 'Đấng Mê-si' giữ rõ ý nghĩa danh hiệu cứu thế thay vì chỉ phiên âm.
- source_word: ἐν τῇ σαρκί μου
  choice: trong thân xác mình
  rationale: Trong ngữ cảnh này σάρξ chỉ sự hiện hữu thể chất nơi Phao-lô, không phải 'bản tính tội lỗi'. 'Thân xác' tự nhiên hơn 'xác thịt' và tránh hàm ý đạo đức không có trong câu.
- source_word: ὑπὲρ τοῦ σώματος αὐτοῦ
  choice: vì thân thể Ngài
  rationale: Giữ sắc thái thụ ích của ὑπέρ và nguyên vẹn ẩn dụ 'thân thể' về cộng đồng tín hữu.
- source_word: ὅ ἐστιν ἡ ἐκκλησία
  choice: tức là hội thánh
  rationale: Mệnh đề đồng nhất giải thích trực tiếp 'thân thể Ngài'; 'hội thánh' là cách gọi quen thuộc, trang trọng cho ἐκκλησία trong ngữ cảnh Phao-lô.
theological_decisions:
- issue: Ý nghĩa của 'những gì còn thiếu trong các hoạn nạn của Đấng Mê-si'
  choice: Giữ nguyên lời khẳng định mạnh rằng Phao-lô đang bù đắp phần còn thiếu trong các hoạn nạn của Đấng Mê-si, đồng thời chú thích rằng câu nói về sự dự phần của ông vào những đau khổ gắn với Đấng Mê-si và hội thánh.
  alternative: Diễn giải chính văn rằng Phao-lô chỉ hoàn tất một định lượng cố định về hoạn nạn thời cuối cùng, hoặc rằng ông bổ sung cho công cuộc chuộc tội còn thiếu của Đấng Mê-si.
  rationale: Cú pháp Hy Lạp đòi hỏi phải bảo tồn sự căng thẳng thực sự của câu. Tuy nhiên, θλίψεις ('hoạn nạn') và mục đích 'vì thân thể Ngài, tức là hội thánh' hướng đến sự dự phần trong đau khổ liên quan đến sứ vụ và cộng đồng, chứ không trực tiếp nói công cuộc chuộc tội của Đấng Mê-si bị khiếm khuyết.
- issue: Cách dịch Χριστοῦ
  choice: Đấng Mê-si
  alternative: Đấng Christ
  rationale: Ở đây từ này có chức năng danh hiệu. 'Đấng Mê-si' chuyển tải ý nghĩa danh hiệu và bối cảnh kỳ vọng cứu thế rõ hơn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Câu duy trì nghịch lý thần học cùng ẩn dụ thân thể của nguyên văn; dùng 'anh chị em' để chỉ toàn thể cộng đồng người nhận thư và viết hoa đại từ 'Ngài' theo quy ước kính trọng phổ biến.
