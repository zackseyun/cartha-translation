- from: Giờ đây, tôi vui mừng trong những đau khổ vì anh chị em, và trong thân xác mình, tôi đang bù đắp những gì còn thiếu trong các hoạn nạn của Đấng Mê-si[a], vì thân thể Ngài, tức là hội thánh.
  to: Giờ đây, tôi vui mừng trong những đau khổ vì lợi ích của anh chị em, và trong xác thịt tôi, tôi đang làm đầy những gì còn thiếu trong các hoạn nạn của Đấng Mê-si[a], vì thân thể Ngài, tức là hội thánh.
  rationale: Sửa tối thiểu để làm sát hơn động từ ἀνταναπληρῶ, duy trì phân biệt σάρξ/sōma trong tiếng Việt, và làm chú thích thận trọng hơn về một vấn đề diễn giải tranh luận. Ý nghĩa cơ bản, danh hiệu ‘Đấng Mê-si’, ẩn dụ thân thể, và văn phong hiện đại trang trọng đều được giữ nguyên.
