id: COL.1.23
reference: Colossians 1:23
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἴ γε ἐπιμένετε τῇ πίστει τεθεμελιωμένοι καὶ ἑδραῖοι καὶ μὴ μετακινούμενοι ἀπὸ τῆς ἐλπίδος τοῦ εὐαγγελίου οὗ ἠκούσατε, τοῦ κηρυχθέντος ἐν ⸀πάσῃ κτίσει τῇ ὑπὸ τὸν οὐρανόν, οὗ ἐγενόμην ἐγὼ Παῦλος διάκονος.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/023.yaml
  text: if indeed you continue in the faith[a], grounded and steadfast, and not moved away from the hope of the gospel that you heard, which has been proclaimed in all creation under heaven, of which I, Paul[b], became a servant.
translation:
  language: vi
  text: nếu quả thật anh chị em tiếp tục trong đức tin, đã được xây nền vững chắc và kiên định, không bị lay chuyển khỏi niềm hy vọng của Tin Mừng mà anh chị em đã nghe và đã được công bố trong toàn thể cõi sáng tạo dưới trời[a], thì tôi, Phao-lô, đã trở thành người phục vụ Tin Mừng ấy[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “trong toàn cõi sáng tạo dưới trời” hoặc “cho mọi loài thọ tạo dưới trời”; từ Hy Lạp κτίσις có thể chỉ “sự sáng tạo/cõi thọ tạo” hoặc, trong một số văn cảnh, “vật thọ tạo”.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “người phụng sự” hoặc “người thi hành chức vụ”; từ Hy Lạp διάκονος có thể chỉ người phục vụ hay người đảm nhiệm một sự phục vụ đặc biệt, tùy văn cảnh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴ γε
  choice: miễn là
  rationale: Giữ nguyên lực điều kiện thực sự của cụm từ mà không biến nó thành lời khẳng định chắc chắn hay hàm ý một kết luận thần học rộng hơn.
- source_word: ἐπιμένετε τῇ πίστει
  choice: anh chị em tiếp tục vững vàng trong đức tin
  rationale: ἐπιμένω diễn tả sự tiếp tục, bền đỗ; thêm “vững vàng” giúp câu tiếng Việt tự nhiên trong khi các từ tiếp theo làm rõ tính kiên định.
- source_word: τεθεμελιωμένοι καὶ ἑδραῖοι
  choice: được đặt trên nền móng chắc chắn, kiên định
  rationale: Giữ hình ảnh nền móng, lực bị động và kết quả còn tiếp diễn của phân từ hoàn thành τεθεμελιωμένοι; ἑδραῖοι được diễn đạt là “kiên định”.
- source_word: μὴ μετακινούμενοι
  choice: không lìa khỏi
  rationale: Diễn đạt tự nhiên hình ảnh không bị dịch chuyển khỏi một vị trí đã đứng vững, không làm nặng câu bằng cấu trúc bị động cứng.
- source_word: ἡ ἐλπὶς τοῦ εὐαγγελίου
  choice: niềm hy vọng của Tin Mừng
  rationale: Giữ quan hệ sở thuộc/liên hệ có chủ ý mơ hồ trong nguyên văn, thay vì giải thích thành niềm hy vọng do Tin Mừng ban ra.
- source_word: ἐν πάσῃ κτίσει τῇ ὑπὸ τὸν οὐρανόν
  choice: giữa toàn thể tạo vật dưới trời
  rationale: κτίσις có thể chỉ sự sáng tạo hoặc vật thọ tạo; “toàn thể tạo vật” phù hợp với số ít tập hợp và giữ sắc thái phổ quát.
- source_word: διάκονος
  choice: người phục vụ
  rationale: Phản ánh nghĩa căn bản là người phục vụ, tránh mặc nhiên gán một chức vụ giáo hội chuyên biệt.
theological_decisions:
- issue: Lực điều kiện của εἴ γε đối với sự bền đỗ
  choice: miễn là anh chị em tiếp tục vững vàng trong đức tin
  alternative: vì anh chị em quả thật tiếp tục trong đức tin; hoặc nếu anh chị em tiếp tục trong đức tin với hàm ý tất yếu mất sự cứu rỗi nếu không tiếp tục
  rationale: Nguyên văn nêu một điều kiện nhưng riêng câu này không giải quyết tranh luận về khả năng sa ngã hay sự bảo đảm bền đỗ; bản dịch giữ nguyên sức căng ấy.
- issue: Nghĩa của πίστις trong τῇ πίστει
  choice: đức tin
  alternative: lòng trung tín; sự tin cậy
  rationale: Trong cấu trúc và văn cảnh này, “đức tin” là cách hiểu tự nhiên nhất, có thể chỉ đức tin của tín hữu hoặc phạm vi niềm tin Cơ Đốc mà không cần chọn dứt khoát giữa hai sắc thái.
- issue: Phạm vi của lời công bố Tin Mừng
  choice: đã được công bố giữa toàn thể tạo vật dưới trời
  alternative: đã được công bố cho mọi loài thọ tạo dưới trời
  rationale: Giữ cách nói phổ quát của câu mà không biến nó thành một tuyên bố kỹ thuật về địa lý hay xác định đối tượng chỉ là con người.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” cho số nhiều ngôi thứ hai; viết hoa “Tin Mừng” theo quy ước tiếng Việt. Câu được tách làm hai để sáng nghĩa nhưng vẫn giữ các quan hệ cú pháp chính và sự mơ hồ thần học của nguyên văn.
