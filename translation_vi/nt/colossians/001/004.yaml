id: COL.1.4
reference: Colossians 1:4
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀκούσαντες τὴν πίστιν ὑμῶν ἐν Χριστῷ Ἰησοῦ καὶ τὴν ἀγάπην ⸂ἣν ἔχετε⸃ εἰς πάντας τοὺς ἁγίους
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/004.yaml
  text: having heard of your faith in Messiah Jesus and the love that you have for all the saints,[a]
translation:
  language: vi
  text: vì chúng tôi đã nghe về đức tin của anh chị em trong Đấng Mê-si-a Giê-su[a] và tình yêu thương anh chị em dành cho tất cả các thánh đồ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “lòng tin của anh chị em trong Đấng Mê-si-a Giê-su” hoặc “sự trung tín của anh chị em trong Đấng Mê-si-a Giê-su.” Danh từ Hy Lạp pistis có thể mang những nghĩa gần nhau này tùy theo văn cảnh.
    reason: Giữ lại phạm vi nghĩa thực sự của πίστις mà không quyết định quá mức giữa đức tin, lòng tin và sự trung tín.
lexical_decisions:
- source_word: ἀκούσαντες
  choice: vì chúng tôi đã nghe về
  rationale: Phân từ bất định quá khứ gắn với chủ thể ở câu trước và nêu cơ sở cho lời tạ ơn. Tiếng Việt cần nêu lại chủ thể “chúng tôi”; “vì… đã nghe về” diễn đạt tự nhiên quan hệ ngữ cảnh mà không biến hành động nghe thành một mệnh đề độc lập.
- source_word: πίστιν
  choice: đức tin
  rationale: “Đức tin” là cách dịch thông dụng và phù hợp nhất trong cấu trúc nói về mối liên hệ với Đấng Mê-si-a Giê-su; các sắc thái “lòng tin” và “sự trung tín” được giữ trong chú thích.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: trong Đấng Mê-si-a Giê-su
  rationale: Giữ giới từ ἐν bằng “trong” để bảo toàn sắc thái quan hệ/hiệp nhất đặc trưng của Phao-lô. Χριστός được dịch theo nghĩa tước hiệu là “Đấng Mê-si-a”, còn Ἰησοῦ được phiên âm là “Giê-su”.
- source_word: ἀγάπην
  choice: tình yêu thương
  rationale: Cách diễn đạt tự nhiên, trang trọng trong tiếng Việt, chỉ tình yêu được thể hiện đối với cộng đồng tín hữu.
- source_word: ἣν ἔχετε
  choice: anh chị em dành
  rationale: Trong tiếng Việt, “tình yêu thương anh chị em dành cho…” diễn đạt tự nhiên nội dung “tình yêu mà anh chị em có đối với…”, đồng thời giữ rõ chủ thể và đối tượng của tình yêu.
- source_word: εἰς πάντας τοὺς ἁγίους
  choice: cho tất cả các thánh đồ
  rationale: “Cho” diễn đạt tự nhiên hướng của tình yêu; “tất cả” giữ πάντας, và “các thánh đồ” giữ danh xưng quen dùng của Phao-lô dành cho những người thuộc về Đức Chúa Trời.
theological_decisions:
- issue: Cách dịch Χριστῷ như tước hiệu hay dạng tên gọi
  choice: Đấng Mê-si-a Giê-su
  alternative: Đấng Cơ Đốc Giê-su
  rationale: Trong cụm này, Χριστός vẫn mang sức nặng của tước hiệu và đi với tên riêng Ἰησοῦ; dịch “Đấng Mê-si-a” làm rõ nghĩa tước hiệu thay vì chỉ phiên âm.
- issue: Sắc thái của πίστις trong văn mạch Phao-lô
  choice: đức tin
  alternative: lòng tin; sự trung tín
  rationale: Văn mạch nhấn mạnh sự đáp ứng của người Cô-lô-se trong mối liên hệ với Đấng Mê-si-a Giê-su, nên “đức tin” phù hợp nhất; tuy vậy, phạm vi nghĩa của πίστις cho phép các sắc thái liên hệ và cần được ghi nhận.
translation_notes:
  register: Bản dịch dùng tiếng Việt hiện đại, trang trọng và dễ hiểu. Đại từ “anh chị em” biểu thị số nhiều một cách tự nhiên. Cấu trúc mở đầu bằng “vì chúng tôi đã nghe” nối câu này với lời tạ ơn ở câu trước; dấu phẩy cuối câu nguồn được chuyển thành dấu chấm vì bản trích dẫn được trình bày độc lập.
