  text: ἐν ᾧ ἔχομεν τὴν ἀπολύτρωσιν, τὴν ἄφεσιν τῶν ἁμαρτιῶν·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/014.yaml
  text: in whom we have redemption[a], the forgiveness of sins.
translation:
  language: vi
  text: trong Người Con ấy, chúng ta có sự cứu chuộc[a], tức là sự tha thứ tội lỗi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch cả hai từ là “sự giải thoát”. Có lẽ Phao-lô dùng “sự tha thứ tội lỗi” để nói rõ sự cứu chuộc này bao gồm điều gì.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ᾧ
  choice: trong Con ấy
  rationale: Đại từ quan hệ giống đực số ít quy chiếu về Người Con yêu dấu ở câu trước. “Trong Con ấy” giữ được ý nghĩa cá nhân và liên hệ của ἐν, đồng thời tự nhiên hơn lối dịch sát chữ “trong Đấng ấy” trong ngữ cảnh tiếng Việt.
- source_word: ἔχομεν
  choice: chúng ta có
  rationale: Thì hiện tại chủ động được chuyển dịch trực tiếp, diễn tả thực tại hiện có mà không thêm sắc thái sở hữu tuyệt đối.
- source_word: ἀπολύτρωσιν
  choice: sự cứu chuộc
  rationale: “Sự cứu chuộc” là cách dịch quen thuộc, trang trọng, giữ được ý giải thoát gắn với hành động chuộc; “sự giải thoát” là khả năng khác nhưng ít giữ được âm hưởng đặc trưng của cách dùng Phao-lô.
- source_word: ἄφεσιν
  choice: sự tha thứ
  rationale: Trong ngữ cảnh tội lỗi, “sự tha thứ” diễn đạt rõ nghĩa xóa bỏ hay miễn khỏi tội; từ Hy Lạp cũng có thể mang nghĩa “sự phóng thích,” tạo liên hệ từ vựng với sự cứu chuộc.
- source_word: τῶν ἁμαρτιῶν
  choice: tội lỗi
  rationale: Cụm sở hữu chỉ đối tượng của sự tha thứ. Tiếng Việt tự nhiên không cần biểu thị mạo từ hay số nhiều bằng một từ riêng.
theological_decisions:
- issue: Quan hệ giữa “sự cứu chuộc” và “sự tha thứ tội lỗi”
  choice: 'Dùng “tức là” để biểu thị cụm đồng vị: “sự cứu chuộc, tức là sự tha thứ tội lỗi.”'
  alternative: 'Giữ phép đặt cạnh bằng dấu phẩy: “sự cứu chuộc, sự tha thứ tội lỗi.”'
  rationale: τὴν ἄφεσιν τῶν ἁμαρτιῶν đứng đồng vị với τὴν ἀπολύτρωσιν, xác định sự cứu chuộc được nói đến ở đây là sự tha thứ tội lỗi. “Tức là” làm rõ quan hệ ngữ pháp trong tiếng Việt mà không mở rộng sự khẳng định vượt quá ngữ cảnh câu.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. “Con ấy” dựa vào tiền ngữ “Người Con yêu dấu” ở câu trước; cấu trúc “trong Con ấy” giữ cách diễn đạt thần học của nguyên văn mà không đổi thành nghĩa công cụ “nhờ Con ấy”.
