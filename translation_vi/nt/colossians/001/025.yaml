  text: ἧς ἐγενόμην ἐγὼ διάκονος κατὰ τὴν οἰκονομίαν τοῦ θεοῦ τὴν δοθεῖσάν μοι εἰς ὑμᾶς πληρῶσαι τὸν λόγον τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/025.yaml
  text: of which I became a servant according to the stewardship from God given to me for you[a], to fulfill the word of God[b],
translation:
  language: vi
  text: Tôi đã trở thành người phục vụ của hội thánh ấy, theo trách nhiệm quản lý do Đức Chúa Trời giao phó cho tôi vì anh chị em, để làm trọn lời Đức Chúa Trời[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “để rao truyền đầy đủ lời Đức Chúa Trời,” hoặc “để hoàn tất lời Đức Chúa Trời.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ἧς
  choice: hội thánh ấy
  rationale: Đại từ quan hệ giống cái số ít quy chiếu về ἐκκλησία ở câu trước; nêu lại “hội thánh ấy” giúp tiếng Việt tự nhiên và rõ nghĩa.
- source_word: ἐγενόμην ἐγὼ διάκονος
  choice: Tôi đã trở thành người phục vụ
  rationale: Diễn đạt việc Phao-lô bước vào vai trò phục vụ, không áp đặt nghĩa chức vụ giáo hội về sau.
- source_word: κατὰ τὴν οἰκονομίαν τοῦ θεοῦ τὴν δοθεῖσάν μοι
  choice: theo trách nhiệm quản lý mà Đức Chúa Trời giao cho tôi
  rationale: οἰκονομία chỉ trách nhiệm được ủy thác để quản lý hay thi hành; cách dịch này giữ hình ảnh ủy nhiệm mà vẫn tự nhiên trong tiếng Việt.
- source_word: εἰς ὑμᾶς
  choice: vì anh chị em
  rationale: Thể hiện hướng quy chiếu và lợi ích của sự ủy thác đối với các tín hữu Cô-lô-se.
- source_word: πληρῶσαι
  choice: để làm trọn
  rationale: Giữ độ rộng nghĩa của πληρόω, có thể hàm ý thực hiện đầy đủ, đưa đến chỗ trọn vẹn, hoặc công bố cách đầy đủ.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: lời Đức Chúa Trời
  rationale: Cách diễn đạt quen thuộc, bảo toàn sắc thái sứ điệp hay lời mặc khải đến từ Đức Chúa Trời.
theological_decisions:
- issue: Ý nghĩa của πληρῶσαι τὸν λόγον τοῦ θεοῦ
  choice: để làm trọn lời Đức Chúa Trời
  alternative: để rao truyền đầy đủ lời Đức Chúa Trời; để hoàn tất lời Đức Chúa Trời
  rationale: “Làm trọn” bảo tồn sự căng nghĩa giữa việc thi hành sứ mạng, công bố đầy đủ và đưa lời Đức Chúa Trời đến sự biểu lộ trọn vẹn, thay vì quyết định thay cho người đọc.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “người phục vụ” thay vì thuật ngữ chức phẩm; dùng “anh chị em” để diễn đạt số nhiều bao gồm cộng đồng tín hữu.
