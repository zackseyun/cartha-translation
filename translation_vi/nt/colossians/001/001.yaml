    reason: lexical_alternative
lexical_decisions:
- source_word: Παῦλος
  choice: Phao-lô
  rationale: Dùng dạng phiên âm quen thuộc trong truyền thống Kinh Thánh tiếng Việt cho tên riêng Παῦλος.
- source_word: ἀπόστολος
  choice: sứ đồ
  rationale: Trong lời tự giới thiệu của Phao-lô, từ này chỉ chức vụ được sai phái có thẩm quyền, không chỉ mang nghĩa chung là người đưa tin.
- source_word: Χριστοῦ Ἰησοῦ
  choice: của Đấng Mê-si-a là Đức Chúa Jêsus
  rationale: Giữ Χριστός như một tước hiệu có nghĩa là Đấng Mê-si-a, đồng thời dùng cấu trúc tiếng Việt tự nhiên để tránh khiến “Mê-si-a” bị hiểu như tên riêng.
- source_word: διὰ θελήματος θεοῦ
  choice: theo ý muốn của Đức Chúa Trời
  rationale: Trong ngữ cảnh này, διά với sở hữu cách diễn tả cơ sở hay sự định liệu khiến Phao-lô trở thành sứ đồ; “theo ý muốn” là cách diễn đạt tự nhiên và chính xác trong tiếng Việt.
- source_word: Τιμόθεος
  choice: Ti-mô-thê
  rationale: Dùng dạng phiên âm quen thuộc trong Kinh Thánh tiếng Việt.
- source_word: ὁ ἀδελφὸς
  choice: người anh em của chúng ta
  rationale: Mạo từ Hy Lạp đi với danh xưng cộng đồng; thêm “của chúng ta” làm rõ quan hệ hàm ẩn và tạo lời mở thư tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Cách dịch Χριστός
  choice: Đấng Mê-si-a
  alternative: Đấng Christ
  rationale: Tại đây Χριστός vẫn có sức nặng như tước hiệu của Đức Chúa Jêsus; dịch nghĩa giúp bảo tồn nội dung ấy, còn chú thích ghi nhận cách gọi truyền thống.
- issue: Quan hệ được diễn tả bởi ὁ ἀδελφός
  choice: người anh em của chúng ta
  alternative: người anh em
  rationale: Bản Hy Lạp có nghĩa đen là “người anh em”; đại từ “của chúng ta” diễn đạt tự nhiên mối quan hệ cộng đồng được hàm ý mà không biến từ này thành một chức danh khác.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Giữ cấu trúc lời mở đầu của thư; dùng các dạng tên riêng quen thuộc trong Kinh Thánh tiếng Việt và dịch Χριστός theo nghĩa tước hiệu.
