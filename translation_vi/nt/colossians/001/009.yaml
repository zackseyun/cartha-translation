id: COL.1.9
reference: Colossians 1:9
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Διὰ τοῦτο καὶ ἡμεῖς, ἀφ’ ἧς ἡμέρας ἠκούσαμεν, οὐ παυόμεθα ὑπὲρ ὑμῶν προσευχόμενοι καὶ αἰτούμενοι ἵνα πληρωθῆτε τὴν ἐπίγνωσιν τοῦ θελήματος αὐτοῦ ἐν πάσῃ σοφίᾳ καὶ συνέσει πνευματικῇ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/009.yaml
  text: For this reason[a], we also, from the day we heard, have not ceased praying for you and asking that you may be filled with the knowledge of his will in all spiritual wisdom and understanding[b],
translation:
  language: vi
  text: Vì lý do đó, từ ngày chúng tôi nghe tin, chúng tôi cũng không ngừng cầu nguyện cho anh chị em và xin để anh chị em được đầy dẫy sự hiểu biết[a] về ý muốn của Ngài, trong mọi sự khôn ngoan và thông hiểu thuộc linh[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “sự hiểu biết đầy đủ” hoặc “sự hiểu biết sâu sắc hơn.” Từ Hy Lạp có thể mang sắc thái hiểu biết trọn vẹn hoặc sâu xa hơn.
    reason: lexical_alternative
  - marker: b
    text: “Thuộc linh” có thể chỉ đặc tính thuộc linh, hoặc có thể mang nghĩa “do Đức Thánh Linh ban.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: Vì lý do đó
  rationale: Cụm διά với đối cách mang ý nghĩa nguyên nhân và quy chiếu về lời tường thuật trước đó; cách dịch này giữ được mối liên hệ ấy mà vẫn tự nhiên trong tiếng Việt.
- source_word: καὶ ἡμεῖς
  choice: chúng tôi cũng
  rationale: Giữ sắc thái bổ sung, nhấn mạnh rằng Phao-lô và các cộng sự cũng đáp lại tin đã nghe bằng sự cầu nguyện.
- source_word: ἀφ’ ἧς ἡμέρας ἠκούσαμεν
  choice: từ ngày nghe được tin ấy
  rationale: Diễn tả điểm khởi đầu của hành động cầu nguyện liên tục. “Tin ấy” giúp câu tiếng Việt đầy đủ, đồng thời chỉ quy chiếu khái quát về điều vừa được thuật lại trong văn cảnh.
- source_word: οὐ παυόμεθα
  choice: không ngừng
  rationale: Thể hiện hành động đang tiếp diễn cho đến hiện tại bằng một cách nói tự nhiên, gọn rõ trong tiếng Việt.
- source_word: ὑπὲρ ὑμῶν
  choice: cho anh chị em
  rationale: ὑπέρ chỉ đối tượng được hưởng lợi trong lời cầu nguyện; “cho” là cách diễn đạt tự nhiên nhất trong tiếng Việt.
- source_word: προσευχόμενοι καὶ αἰτούμενοι
  choice: cầu nguyện cho anh chị em và khẩn xin
  rationale: Giữ cả ý cầu nguyện nói chung lẫn lời thỉnh cầu cụ thể; “khẩn xin” truyền đạt sức nặng của lời cầu xin mà không cường điệu.
- source_word: ἵνα πληρωθῆτε
  choice: để anh chị em được đầy dẫy
  rationale: Giữ hình ảnh được làm cho đầy và dạng bị động, không xác định tường minh tác nhân dù trong văn cảnh Đức Chúa Trời là tác nhân được ngầm hiểu.
- source_word: τὴν ἐπίγνωσιν
  choice: sự hiểu biết
  rationale: ἐπίγνωσις có thể hàm ý sự hiểu biết đầy đủ hoặc sâu sắc hơn, nhưng “sự hiểu biết” tránh áp đặt mức độ không được cú pháp buộc phải nêu rõ; sắc thái mạnh hơn được ghi ở chú thích.
- source_word: τοῦ θελήματος αὐτοῦ
  choice: về ý muốn của Ngài
  rationale: Diễn đạt tự nhiên quan hệ sở hữu và nội dung trong tiếng Việt; “Ngài” quy chiếu về Đức Chúa Trời theo văn cảnh.
- source_word: ἐν πάσῃ σοφίᾳ καὶ συνέσει πνευματικῇ
  choice: trong mọi sự khôn ngoan và thông hiểu thuộc linh
  rationale: Giữ ἐν theo nghĩa phạm vi hoặc cách thức, πάσῃ là “mọi”, và để “thuộc linh” có thể bổ nghĩa chung cho cả sự khôn ngoan lẫn sự thông hiểu.
- source_word: σοφίᾳ
  choice: sự khôn ngoan
  rationale: Tương đương quen thuộc, bao gồm khả năng nhận biết và áp dụng điều đúng đắn.
- source_word: συνέσει
  choice: thông hiểu
  rationale: Diễn tả năng lực nắm bắt và liên kết các điều với nhau, đồng thời phân biệt vừa đủ với “sự khôn ngoan”.
theological_decisions:
- issue: Sắc thái của ἐπίγνωσις trong lời cầu nguyện
  choice: sự hiểu biết
  alternative: sự hiểu biết đầy đủ; sự hiểu biết sâu sắc
  rationale: Từ này có thể mang sắc thái tăng cường, nhưng bản văn không buộc phải diễn đạt mức độ ấy trong chính câu dịch. Chú thích bảo tồn khả năng này mà không biến nó thành cách hiểu duy nhất.
- issue: Phạm vi và nguồn gốc của πνευματικῇ
  choice: thuộc linh, bổ nghĩa cho cả sự khôn ngoan và thông hiểu mà không nêu đích danh Đức Thánh Linh
  alternative: sự khôn ngoan và thông hiểu do Đức Thánh Linh ban
  rationale: Tính từ Hy Lạp có thể mô tả đặc tính thuộc linh hoặc ngụ ý nguồn từ Đức Thánh Linh. Bản dịch chính giữ cách nói cô đọng và độ mở của nguyên văn; chú thích nêu khả năng liên hệ với Đức Thánh Linh.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh chị em” cho đại từ số nhiều ὑμῶν nhằm bao gồm cộng đồng tín hữu; giữ nhịp câu dài của lời cầu nguyện nhưng sắp xếp các thành phần theo cú pháp tự nhiên của tiếng Việt.
