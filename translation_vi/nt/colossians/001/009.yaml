  to: Vì lý do đó, từ ngày chúng tôi nghe tin, chúng tôi cũng không ngừng cầu nguyện cho anh chị em và xin để anh chị em được đầy dẫy sự hiểu biết[a] về ý muốn của Ngài, trong mọi sự khôn ngoan và thông hiểu thuộc linh[b].
