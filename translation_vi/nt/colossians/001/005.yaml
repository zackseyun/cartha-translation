  - severity: low
    issue: Tách mệnh đề quan hệ thành câu độc lập
    rationale: Dù vẫn hiểu được, “Anh chị em đã nghe...” sau dấu chấm làm liên kết ngữ pháp với “niềm hy vọng” kém chặt. Nối bằng “mà” tự nhiên và phản ánh trực tiếp cú pháp hơn.
