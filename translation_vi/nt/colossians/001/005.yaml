  to: vì niềm hy vọng được dành sẵn cho anh chị em trên trời[a], mà anh chị em đã nghe nói đến từ trước[b] trong lời chân lý, tức là Tin Lành[c].
  rationale: Thay “trên các tầng trời” bằng “trên trời” để tiếng Việt tự nhiên và không thêm ý về các tầng trời; chú thích vẫn minh thị số nhiều Hy Lạp. Nối mệnh đề quan hệ với tiền ngữ và dùng “nghe nói đến” để diễn đạt tự nhiên việc đã nghe về niềm hy vọng ấy, đồng thời giữ nghĩa prior của προηκούσατε.
  reviewer_model: gpt-5.6-terra
