id: COL.1.5
reference: Colossians 1:5
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: διὰ τὴν ἐλπίδα τὴν ἀποκειμένην ὑμῖν ἐν τοῖς οὐρανοῖς, ἣν προηκούσατε ἐν τῷ λόγῳ τῆς ἀληθείας τοῦ εὐαγγελίου
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/005.yaml
  text: because of the hope laid up for you in the heavens[a], which you heard before in the word of truth[d][c][b], the gospel
translation:
  language: vi
  text: vì niềm hy vọng được dành sẵn cho anh chị em trên trời[a], mà anh chị em đã nghe nói đến từ trước[b] trong lời chân lý, tức là Tin Lành[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “trên các trời”. Trong tiếng Hy Lạp, từ “trời” ở dạng số nhiều.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “đã nghe từ trước” hoặc “đã nghe trước đó”.'
    reason: lexical_alternative
  - marker: c
    text: “Lời chân lý” cũng có thể dịch là “sứ điệp chân lý”; “Tin Lành” đứng đồng vị để xác định lời hay sứ điệp ấy.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τὴν ἐλπίδα
  choice: vì niềm hy vọng
  rationale: διά với đối cách diễn tả nguyên nhân hoặc cơ sở; “vì” nối tự nhiên với mạch câu trước, còn “niềm hy vọng” giữ nghĩa thông thường của ἐλπίς.
- source_word: ἀποκειμένην ὑμῖν
  choice: được dành sẵn cho anh chị em
  rationale: ἀπόκειμαι chỉ điều được cất giữ hoặc dành lại; “được dành sẵn” vừa tự nhiên vừa giữ ý một điều đang được bảo lưu vì lợi ích của người nhận. “Anh chị em” biểu thị số nhiều của ὑμῖν trong tiếng Việt hiện đại.
- source_word: ἐν τοῖς οὐρανοῖς
  choice: trên các tầng trời
  rationale: Giữ dạng số nhiều của οὐρανοῖς và diễn đạt theo lối tiếng Việt dễ hiểu; chú thích nêu cách dịch quen thuộc ở số ít.
- source_word: ἣν προηκούσατε
  choice: Anh chị em đã nghe nói về niềm hy vọng ấy từ trước
  rationale: Đại từ giống cái số ít ἣν trực tiếp quy chiếu về ἐλπίδα. “Nghe nói về” phù hợp khi tân ngữ là niềm hy vọng, còn “từ trước” chuyển tải tiền tố προ- của προακούω.
- source_word: ἐν τῷ λόγῳ τῆς ἀληθείας
  choice: trong lời chân lý
  rationale: Giữ gần cấu trúc Hy Lạp và cách nói Kinh Thánh; λόγος cũng có thể mang nghĩa “sứ điệp”, nên phương án đó được ghi trong chú thích.
- source_word: τοῦ εὐαγγελίου
  choice: tức là Tin Lành
  rationale: Cụm này đồng vị với “lời chân lý”, xác định lời ấy là Tin Lành. “Tức là” làm quan hệ đồng vị rõ ràng và tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Sở chỉ của mệnh đề quan hệ ἣν προηκούσατε
  choice: Cho mệnh đề này quy chiếu trực tiếp về “niềm hy vọng”.
  alternative: Hiểu rộng hơn là họ đã nghe toàn bộ sứ điệp Tin Lành từ trước.
  rationale: ἣν ở giống cái số ít phù hợp trực tiếp với ἐλπίδα; bản dịch giữ quan hệ ngữ pháp này mà không đồng nhất niềm hy vọng với toàn bộ nội dung Tin Lành.
- issue: Dạng số nhiều của οὐρανοῖς
  choice: Dịch “các tầng trời” trong chính văn.
  alternative: Dịch theo lối quen thuộc là “trên trời”.
  rationale: Dạng số nhiều phản ánh trực tiếp nguồn Hy Lạp mà không buộc phải xây dựng một hệ thống vũ trụ học cụ thể; chú thích bảo lưu cách diễn đạt số ít tự nhiên hơn.
- issue: Quan hệ của τοῦ εὐαγγελίου với “lời chân lý”
  choice: 'Hiểu là đồng vị: “lời chân lý, tức là Tin Lành”.'
  alternative: 'Hiểu như sở hữu hoặc nguồn gốc: “lời chân lý của Tin Lành”.'
  rationale: Cách hiểu đồng vị phù hợp nhất với cú pháp và cho thấy “Tin Lành” nhận diện “lời chân lý”, nhưng không thêm nội dung giáo phái.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh chị em” để thể hiện đại từ số nhiều và giọng thư tín hướng đến cộng đồng. Tách thành hai câu để tránh một chuỗi bổ nghĩa nặng nề, nhưng vẫn giữ quan hệ nguyên nhân với câu trước bằng từ mở đầu “vì”.
