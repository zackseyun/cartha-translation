id: COL.1.18
reference: Colossians 1:18
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ αὐτός ἐστιν ἡ κεφαλὴ τοῦ σώματος τῆς ἐκκλησίας· ὅς ⸀ἐστιν ἀρχή, πρωτότοκος ἐκ τῶν νεκρῶν, ἵνα γένηται ἐν πᾶσιν αὐτὸς πρωτεύων,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/018.yaml
  text: And he is the head of the body[a], the church; he is the beginning, the firstborn from the dead, so that he himself might become preeminent in all things[b],
translation:
  language: vi
  text: Và Ngài là đầu của thân thể, tức là hội thánh. Ngài là khởi đầu[a], là con đầu lòng từ cõi chết, để trong mọi sự chính Ngài trở nên Đấng đứng đầu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Khởi đầu” cũng có thể được hiểu là “nguồn gốc” hoặc “đấng cai trị” (ἀρχή).
    reason: lexical_alternative
  - marker: b
    text: Hay “có địa vị thứ nhất trong mọi sự.”
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτός
  choice: Ngài / chính Ngài
  rationale: Dùng “Ngài” phù hợp với văn phong tôn kính khi nói về Đấng Christ; ở mệnh đề cuối, “chính Ngài” thể hiện sắc thái nhấn mạnh của đại từ.
- source_word: κεφαλή
  choice: đầu
  rationale: Giữ nguyên ẩn dụ đầu–thân thể, không thu hẹp nghĩa thành riêng quyền lãnh đạo hay nguồn gốc.
- source_word: σῶμα
  choice: thân thể
  rationale: Cách diễn đạt tự nhiên, trang trọng cho hình ảnh cộng đồng được ví như một thân thể, đồng thời kết hợp rõ với “đầu”.
- source_word: ἐκκλησία
  choice: hội thánh
  rationale: Thuật ngữ quen thuộc trong tiếng Việt để chỉ cộng đồng những người thuộc về Đấng Christ trong ngữ cảnh thư tín Phao-lô.
- source_word: ἀρχή
  choice: khởi đầu
  rationale: Phù hợp với sự song hành cùng “con đầu lòng từ cõi chết”, nhấn mạnh Đấng Christ mở đầu trật tự phục sinh; vẫn ghi nhận các nghĩa từ vựng khác trong chú thích.
- source_word: πρωτότοκος
  choice: con đầu lòng
  rationale: Giữ hình thức và âm hưởng Kinh Thánh của từ Hy Lạp, bao hàm cả thứ tự lẫn địa vị mà không diễn giải quá mức.
- source_word: ἐκ τῶν νεκρῶν
  choice: từ cõi chết
  rationale: Cách nói tự nhiên trong tiếng Việt về sự phục sinh, diễn đạt việc ra khỏi phạm vi của những người chết.
- source_word: ἵνα γένηται
  choice: để ... giữ địa vị
  rationale: “Để” thể hiện quan hệ mục đích/kết quả; kết hợp với phân từ tiếp theo thành câu tiếng Việt tự nhiên, thay vì dịch máy móc động từ “trở nên”.
- source_word: ἐν πᾶσιν
  choice: trong mọi sự
  rationale: Giữ phạm vi rộng của dạng trung tính số nhiều và phù hợp với ngữ cảnh mang tầm vóc vũ trụ.
- source_word: πρωτεύων
  choice: giữ địa vị hàng đầu
  rationale: Diễn đạt trực tiếp ý giữ vị trí thứ nhất, tự nhiên và dễ hiểu hơn một thuật ngữ trừu tượng.
theological_decisions:
- issue: Ý nghĩa của κεφαλή trong ẩn dụ Đấng Christ–thân thể
  choice: Giữ ẩn dụ “đầu” mà không giải thích là riêng “người cai trị” hay “nguồn gốc”.
  alternative: người lãnh đạo; nguồn gốc
  rationale: Từ Hy Lạp và hình ảnh trong câu có chiều sâu thần học; giữ nguyên ẩn dụ tránh quyết định thay cho độc giả một vấn đề còn được tranh luận.
- issue: Nghĩa của ἀρχή trong quan hệ với sự phục sinh
  choice: khởi đầu
  alternative: nguồn gốc; đấng cai trị
  rationale: Cụm kế tiếp “con đầu lòng từ cõi chết” ưu tiên sắc thái mở đầu trật tự phục sinh, nhưng các khả năng từ vựng khác được bảo tồn trong chú thích.
- issue: Sắc thái của πρωτότοκος ἐκ τῶν νεκρῶν
  choice: Giữ “con đầu lòng từ cõi chết” như ngôn ngữ về sự phục sinh và địa vị đứng đầu.
  alternative: người đầu tiên sống lại từ cõi chết
  rationale: Bản dịch giữ hình thức từ vựng và liên hệ Kinh Thánh, không giản lược thành chỉ thứ tự thời gian; mệnh đề sau làm rõ địa vị hàng đầu.
- issue: Sắc thái của γένηται trong mệnh đề mục đích/kết quả
  choice: Dịch tự nhiên là “để chính Ngài giữ địa vị hàng đầu”.
  alternative: để chính Ngài trở nên đứng đầu
  rationale: Tránh hàm ý thần học không cần thiết rằng trước đó Đấng Christ thiếu địa vị này, đồng thời vẫn chuyển tải chức năng của ἵνα và ý nghĩa của πρωτεύων.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “Ngài” cho Đấng Christ và “hội thánh” theo cách dùng Tin Lành quen thuộc; giữ các ẩn dụ chính của nguyên văn. Dấu chấm tách hai mệnh đề để câu tiếng Việt rõ và tự nhiên.
