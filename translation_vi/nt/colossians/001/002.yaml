id: COL.1.2
reference: Colossians 1:2
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τοῖς ἐν ⸀Κολοσσαῖς ἁγίοις καὶ πιστοῖς ἀδελφοῖς ἐν Χριστῷ· χάρις ὑμῖν καὶ εἰρήνη ἀπὸ θεοῦ πατρὸς ⸀ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/002.yaml
  text: 'To the holy and faithful brothers in Messiah at Colossae: grace to you and peace from God our Father[a][b][c].'
translation:
  language: vi
  text: 'Gửi các anh em[b] thánh khiết và trung tín[a] tại Cô-lô-se, trong Đấng Mê-si[c]: Nguyện ân điển và bình an từ Đức Chúa Trời, Cha chúng ta, đến với anh em.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “có đức tin”; từ Hy Lạp πιστοῖς có thể chỉ những người tin hoặc những người trung tín.
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn Hy Lạp dùng “anh em”; trong ngữ cảnh, Phao-lô có lẽ đang nói với toàn thể cộng đồng, kể cả phụ nữ.
    reason: lexical_alternative
  - marker: c
    text: 'Cách dịch truyền thống: “trong Đấng Christ.” Tước hiệu Hy Lạp Χριστός có nghĩa là “Đấng Mê-si.”'
    reason: alternative_reading
lexical_decisions:
- source_word: τοῖς ἐν Κολοσσαῖς
  choice: tại Cô-lô-se
  rationale: Cụm ἐν cộng địa danh xác định nơi ở của người nhận; “tại Cô-lô-se” tự nhiên trong lời đề gửi và giữ nghĩa chỉ địa điểm.
- source_word: ἁγίοις
  choice: thánh khiết
  rationale: Tính từ này bổ nghĩa cho “anh em”, diễn tả những người được biệt riêng cho Đức Chúa Trời; cách dịch tính từ tránh sắc thái danh hiệu hậu kỳ của “các thánh”.
- source_word: πιστοῖς
  choice: trung tín
  rationale: πιστός có thể chỉ sự trung tín hoặc việc tin; “trung tín” phù hợp như một phẩm chất trong lời đề gửi, còn khả năng “tin” được giữ trong chú thích.
- source_word: ἀδελφοῖς
  choice: các anh em
  rationale: Giữ hình thức số nhiều giống đực của tiếng Hy Lạp, đồng thời chú thích rằng trong ngữ cảnh từ này có thể bao gồm cả nữ giới trong cộng đồng.
- source_word: ἐν Χριστῷ
  choice: trong Đấng Mê-si
  rationale: Χριστός là tước hiệu có nghĩa là Đấng Mê-si; “trong” giữ nguyên ngôn ngữ thần học về sự hiệp nhất thuộc về Đấng ấy.
- source_word: χάρις ὑμῖν καὶ εἰρήνη
  choice: Cầu xin ân điển và bình an ... đến với anh em
  rationale: Chuyển công thức chào thăm sang cú pháp tiếng Việt tự nhiên, vẫn giữ cả ân điển lẫn bình an và đối tượng số nhiều.
- source_word: ἀπὸ θεοῦ πατρὸς ἡμῶν
  choice: từ Đức Chúa Trời, Cha chúng ta
  rationale: 'Hiểu πατρὸς ἡμῶν theo quan hệ đồng vị với θεοῦ: Đức Chúa Trời chính là Cha chúng ta, không thêm liên từ không có trong nguyên văn.'
theological_decisions:
- issue: Cách dịch Χριστῷ trong ἐν Χριστῷ
  choice: Đấng Mê-si
  alternative: Đấng Christ
  rationale: Giữ ý nghĩa tước hiệu của Χριστός thay vì coi đó như tên riêng; cách gọi truyền thống được ghi ở chú thích.
- issue: Phạm vi giới tính của ἀδελφοῖς
  choice: các anh em
  alternative: các anh chị em
  rationale: Bản chính phản ánh hình thức giống đực của nguyên văn, còn chú thích cho biết trong lời gửi của Phao-lô từ này có lẽ chỉ toàn thể cộng đồng, kể cả phụ nữ.
- issue: Sắc thái của πιστοῖς
  choice: trung tín
  alternative: tin / có đức tin
  rationale: Câu không buộc phải phân định dứt khoát giữa sự trung tín và việc tin; bản chính chọn nghĩa tự nhiên nhưng chú thích bảo tồn khả năng kia.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Giữ cấu trúc lời đề gửi của thư tín, dùng “Đức Chúa Trời” và “Đấng Mê-si” nhất quán; các chú thích bảo tồn những nét nhập nhằng có thật trong tiếng Hy Lạp.
