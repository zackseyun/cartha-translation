id: COL.1.7
reference: Colossians 1:7
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸀καθὼς ἐμάθετε ἀπὸ Ἐπαφρᾶ τοῦ ἀγαπητοῦ συνδούλου ἡμῶν, ὅς ἐστιν πιστὸς ὑπὲρ ⸀ἡμῶν διάκονος τοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/007.yaml
  text: just as you learned from Epaphras[a], our beloved fellow servant, who is a faithful minister of the Messiah on our behalf[c][b],
translation:
  language: vi
  text: đúng như anh chị em đã học từ Ê-pháp-ra, người đồng nô lệ yêu dấu của chúng tôi, là người phục vụ trung tín của Đấng Mê-si-a thay mặt chúng tôi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Một số thủ bản chép “thay mặt anh chị em” thay vì “thay mặt chúng tôi.”
    reason: textual_variant
lexical_decisions:
- source_word: καθὼς
  choice: đúng như
  rationale: Giữ lực liên kết và đối chiếu với lời ngay trước đó.
- source_word: ἐμάθετε ἀπὸ Ἐπαφρᾶ
  choice: anh chị em đã học từ Ê-pháp-ra
  rationale: Diễn đạt trực tiếp hành động tiếp nhận sự dạy dỗ từ Ê-pháp-ra; không thêm tân ngữ vốn không hiện diện trong tiếng Hy Lạp.
- source_word: τοῦ ἀγαπητοῦ συνδούλου ἡμῶν
  choice: người đồng nô lệ thân yêu của chúng tôi
  rationale: “Đồng nô lệ” giữ hình ảnh những người cùng thuộc về một chủ, thay vì làm nhẹ σύνδουλος thành một từ chỉ sự phục vụ nói chung; “thân yêu” tự nhiên trong tiếng Việt hiện đại.
- source_word: πιστὸς
  choice: trung tín
  rationale: Bao hàm sự đáng tin cậy và bền lòng trong việc phục vụ.
- source_word: διάκονος
  choice: người phục vụ
  rationale: Chỉ người thực hiện công việc phục vụ, không mặc nhiên biến từ này thành tên một chức vụ giáo hội.
- source_word: τοῦ Χριστοῦ
  choice: của Đấng Mê-si-a
  rationale: Χριστός mang nghĩa tước hiệu “Đấng được xức dầu”; “Đấng Mê-si-a” làm rõ nội dung tước hiệu trong ngữ cảnh này.
- source_word: ὑπὲρ ἡμῶν
  choice: thay mặt chúng tôi
  rationale: Giữ sắc thái đại diện của ὑπέρ với sở hữu cách, đồng thời không loại bỏ ý làm vì lợi ích của họ.
theological_decisions:
- issue: Sắc thái của σύνδουλος
  choice: người đồng nô lệ
  alternative: người bạn cùng phục vụ; người đồng tôi tớ
  rationale: Bản dịch chính giữ quan hệ cùng lệ thuộc một chủ được hàm chứa trong từ ghép, dù cách nói này mạnh hơn cách diễn đạt quen thuộc trong tiếng Việt.
- issue: Cách chuyển Χριστός
  choice: Đấng Mê-si-a
  alternative: Đấng Christ; Đấng Ki-tô
  rationale: Ở đây từ này chỉ Đấng mà Ê-pháp-ra phục vụ và vẫn có lực của một tước hiệu; lựa chọn này chuyển tải nghĩa thay vì chỉ phiên âm theo truyền thống.
- issue: Nghĩa của ὑπὲρ ἡμῶν
  choice: thay mặt chúng tôi
  alternative: vì chúng tôi
  rationale: “Thay mặt” thể hiện rõ sắc thái đại diện, trong khi “vì” có thể chỉ lợi ích nói chung.
- issue: Dị bản đại từ trong ὑπὲρ ἡμῶν
  choice: chúng tôi
  alternative: anh chị em
  rationale: Theo văn bản chính SBLGNT được cung cấp là ἡμῶν; dị bản ὑμῶν được ghi ở chú thích để không che khuất chứng cứ văn bản.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “anh chị em” diễn đạt số nhiều ngôi thứ hai một cách bao quát; “ông” giúp câu quan hệ chuyển sang tiếng Việt tự nhiên. Cụm “đồng nô lệ” được giữ có chủ ý để bảo toàn hình ảnh mạnh của nguyên văn.
