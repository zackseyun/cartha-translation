  verdict: revise
  source_fidelity: 'Bản nháp truyền đạt đúng cấu trúc chính: μυστήριον là điều từng bị che giấu, sự tương phản «nhưng nay», thể bị động của «được bày tỏ», và đối tượng nhận sự bày tỏ. Tuy nhiên, «giấu kín khỏi các thời đại và các thế hệ» không tự nhiên và có thể gợi rằng «thời đại» và «thế hệ» là các tác nhân mà điều này bị giấu khỏi. «Qua các thời đại và các thế hệ» diễn đạt rõ thời gian kéo dài của sự che giấu mà không thêm ý nghĩa.'
  naturalness: «Mầu nhiệm», «đã được giấu kín», và «đã được bày tỏ» phù hợp văn phong Kinh Thánh tiếng Việt hiện đại. «Các thánh của Ngài» là cách gọi thành ngữ và tự nhiên hơn «những người thánh của Ngài»; chú thích từ vựng có thể nêu phương án sát chữ «những người thánh».
  terminology: Giữ «mầu nhiệm» cho μυστήριον, vì trong ngữ cảnh Phao-lô đây là điều/ý định của Đức Chúa Trời từng kín giấu và nay được bày tỏ. Giữ «các thánh» cho ἅγιοι, không hàm ý một nhóm được phong thánh; phương án sát chữ được nêu trong chú thích. «Ngài» có tiền giả định từ ngữ cảnh rộng hơn và không cần xác định thêm trong câu này.
  issues:
  - severity: medium
    issue: Cụm «giấu kín khỏi các thời đại và các thế hệ» thiếu tự nhiên và dễ lệch quan hệ nghĩa.
    rationale: ἀπὸ τῶν αἰώνων καὶ ἀπὸ τῶν γενεῶν nói về khoảng thời gian/thời kỳ mà mầu nhiệm bị che giấu. Tiếng Việt dùng «qua các thời đại và các thế hệ» tự nhiên hơn, vẫn giữ hai thành tố song song và không thêm «muôn đời» hay «mọi».
  - severity: low
    issue: «Những người thánh của Ngài» không phải cách gọi thông dụng trong văn xuôi Kinh Thánh tiếng Việt.
    rationale: «Các thánh của Ngài» vừa tự nhiên vừa bảo toàn thuật ngữ ἅγιοι. Chú thích «những người thánh» duy trì phương án sát chữ mà không áp đặt diễn giải về phạm vi nhóm này.
