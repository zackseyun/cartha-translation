  yaml_path: translation/nt/colossians/001/026.yaml
  text: the mystery hidden from the ages and from the generations—but now revealed to his saints[b][a],
translation:
  language: vi
  text: là mầu nhiệm đã được giấu kín qua các thời đại và các thế hệ, nhưng nay đã được bày tỏ cho các thánh của Ngài.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “điều kín giấu.” Trong các thư của Phao-lô, “mầu nhiệm” thường là ý định của Đức Chúa Trời trước kia được giấu kín nhưng nay đã được bày tỏ.
    reason: lexical_alternative
  - marker: b
    text: Hay “những người thánh của Ngài.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μυστήριον
  choice: mầu nhiệm
  rationale: Trong cách dùng của Phao-lô, từ này chỉ ý định của Đức Chúa Trời trước kia được giấu kín nhưng nay được bày tỏ; “mầu nhiệm” giữ được sắc thái thần học ấy mà không hàm ý điều vĩnh viễn không thể biết.
- source_word: ἀποκεκρυμμένον
  choice: đã được giấu kín
  rationale: Diễn đạt thể hoàn thành bị động, nhấn mạnh tình trạng kín giấu do một hành động trước đó.
- source_word: ἀπὸ τῶν αἰώνων καὶ ἀπὸ τῶν γενεῶν
  choice: khỏi các thời đại và các thế hệ
  rationale: Giữ cấu trúc song song với hai lần ἀπό; “thời đại” chỉ các thời kỳ, còn “thế hệ” chỉ những lớp người nối tiếp nhau.
- source_word: νῦν δὲ
  choice: nhưng nay
  rationale: Thể hiện rõ sự tương phản giữa thời gian bị giấu kín trước kia và sự bày tỏ hiện nay.
- source_word: ἐφανερώθη
  choice: đã được bày tỏ
  rationale: Giữ nghĩa bị động của động từ và diễn đạt tự nhiên hành động làm cho điều từng bị che giấu trở nên được biết.
- source_word: τοῖς ἁγίοις αὐτοῦ
  choice: cho những người thánh của Ngài
  rationale: Giữ trực tiếp nghĩa “những người thánh/được biệt riêng” và tránh để “các thánh” bị hiểu theo nghĩa hẹp là một tầng lớp đặc biệt đã được tôn phong.
theological_decisions:
- issue: Ý nghĩa của “những người thánh của Ngài”
  choice: Chỉ cộng đồng những người thuộc về Đức Chúa Trời và được biệt riêng cho Ngài.
  alternative: các thánh; dân Ngài
  rationale: Trong cách dùng thông thường của Phao-lô, ἅγιοι chỉ các tín hữu nói chung, không giới hạn ở một nhóm ưu tú; bản dịch trực tiếp duy trì ý niệm thánh và tránh thêm nghĩa không có trong nguyên văn.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Dùng “mầu nhiệm” theo lối viết phổ biến trong tiếng Việt hiện đại; “những người thánh” hơi ít tính thuật ngữ hơn “các thánh” nhưng giảm nguy cơ hiểu sai theo nghĩa hậu kỳ. Các dấu chú thích đều được đặt trong chính văn.
