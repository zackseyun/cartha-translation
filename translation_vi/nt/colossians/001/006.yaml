- from: Tin Mừng ấy đã đến với anh chị em[a]. Cũng như trong khắp thế gian[b], Tin Mừng đang kết quả và tăng trưởng, thì giữa anh chị em[c] cũng vậy, kể từ ngày anh chị em nghe và nhận biết ân điển của Đức Chúa Trời trong chân lý[d].
