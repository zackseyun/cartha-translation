reference: Colossians 1:6
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τοῦ παρόντος εἰς ὑμᾶς, καθὼς καὶ ἐν παντὶ τῷ ⸀κόσμῳ ἐστὶν καρποφορούμενον καὶ αὐξανόμενον καθὼς καὶ ἐν ὑμῖν, ἀφ’ ἧς ἡμέρας ἠκούσατε καὶ ἐπέγνωτε τὴν χάριν τοῦ θεοῦ ἐν ἀληθείᾳ·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/006.yaml
  text: which has come to you[a], just as also in all the world it is bearing fruit and growing, just as also among you[d][c][b], from the day you heard and came to know the grace of God in truth.
translation:
  language: vi
  text: Tin Mừng ấy đã đến với anh chị em[a]. Tin Mừng ấy cũng đang sinh hoa kết quả và phát triển trong khắp thế gian[b], cũng như giữa anh chị em[c], kể từ ngày anh chị em nghe và nhận biết ân điển của Đức Chúa Trời trong chân lý[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đang hiện diện với anh chị em” hoặc “đã đến giữa anh chị em.”'
    reason: lexical_alternative
  - marker: b
    text: 'Hay: “trong toàn thế gian.”'
    reason: lexical_alternative
  - marker: c
    text: 'Hay: “trong anh chị em”; tiếng Hy Lạp có thể chỉ cộng đồng nói chung hoặc công việc của Tin Mừng bên trong họ.'
    reason: lexical_alternative
  - marker: d
    text: 'Cũng có thể hiểu: “một cách chân thật” hoặc “trong sự thật.”'
    reason: alternative_reading
lexical_decisions:
- source_word: τοῦ παρόντος εἰς ὑμᾶς
  choice: Tin Mừng ấy đã đến với anh chị em
  rationale: Phân từ có mạo từ tiếp nối đối tượng ở câu 5 là Tin Mừng. “Đã đến với” diễn đạt tự nhiên ý đến và hiện diện của πάρειμι, đồng thời giữ hướng chuyển động εἰς ὑμᾶς.
- source_word: ἐν παντὶ τῷ κόσμῳ
  choice: trong khắp thế gian
  rationale: Cách nói tự nhiên trong tiếng Việt, giữ phạm vi phổ quát mang tính tu từ của κόσμος mà không diễn giải thành từng nơi hay từng người.
- source_word: ἐστὶν καρποφορούμενον καὶ αὐξανόμενον
  choice: đang kết quả và tăng trưởng
  rationale: “Đang” phản ánh hành động tiếp diễn của kết cấu với hai phân từ hiện tại; “kết quả” giữ hình ảnh nông nghiệp, còn “tăng trưởng” diễn đạt sự phát triển liên tục.
- source_word: καθὼς καὶ ἐν ὑμῖν
  choice: thì giữa anh chị em cũng vậy
  rationale: “Giữa anh chị em” ưu tiên ý hoạt động trong cộng đồng, nhưng chú thích bảo lưu khả năng hiểu là “trong anh chị em” theo nghĩa tập thể hoặc nội tại.
- source_word: ἀφ’ ἧς ἡμέρας ἠκούσατε
  choice: kể từ ngày anh chị em nghe
  rationale: Giữ mốc thời gian bắt đầu mà nguyên văn nêu, không thêm ý “lần đầu” vốn chỉ do văn cảnh gợi ra.
- source_word: ἐπέγνωτε
  choice: nhận biết
  rationale: Diễn đạt sự nhận ra và hiểu biết thực sự mà không cường điệu thành “hiểu biết trọn vẹn”.
- source_word: τὴν χάριν τοῦ θεοῦ
  choice: ân điển của Đức Chúa Trời
  rationale: Giữ cấu trúc sở hữu và thuật ngữ thần học quen thuộc, trang trọng trong tiếng Việt.
- source_word: ἐν ἀληθείᾳ
  choice: trong chân lý
  rationale: Bản dịch sát cấu trúc giới từ, giữ mở sắc thái giữa cách thức “cách chân thật” và phạm vi hay nội dung “trong chân lý”.
theological_decisions:
- issue: Phạm vi của “khắp thế gian”
  choice: Giữ cách nói phổ quát của nguyên văn như một mô tả rộng về sự lan truyền của Tin Mừng.
  alternative: Hiểu là một khẳng định tuyệt đối rằng mọi vùng và mọi cá nhân trên toàn cầu đều đã được tiếp cận.
  rationale: Bản dịch không thu hẹp ngôn ngữ phổ quát, nhưng cũng không thêm lời giải thích khiến nó trở thành một tuyên bố địa lý tuyệt đối.
- issue: Sắc thái của ἐν ἀληθείᾳ
  choice: “trong chân lý”
  alternative: “một cách chân thật” hoặc “trong sự thật”
  rationale: Cách dịch chính bảo tồn sự nhập nhằng chân thực giữa cách thức nhận biết và phạm vi hoặc nội dung của điều được nhận biết.
- issue: Phạm vi của ἐν ὑμῖν
  choice: “giữa anh chị em” với chú thích nêu cách hiểu “trong anh chị em”
  alternative: Chỉ hiểu là hoạt động nội tâm trong từng cá nhân.
  rationale: Đại từ số nhiều có thể chỉ cộng đồng nói chung hoặc công việc của Tin Mừng bên trong họ; không nên loại bỏ một trong hai sắc thái.
translation_notes:
  register: 'Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” cho đại từ số nhiều nhằm thể hiện cộng đồng gồm cả nam lẫn nữ; lặp “Tin Mừng” thay cho đại từ để câu đứng độc lập vẫn rõ nghĩa. Cấu trúc so sánh được sắp xếp lại nhẹ theo cú pháp tiếng Việt nhưng vẫn giữ hai phạm vi song song: khắp thế gian và giữa cộng đồng Cô-lô-se.'
