  yaml_path: translation/nt/colossians/001/008.yaml
  text: and who also made known to us your love in the Spirit[a].
translation:
  language: vi
  text: người cũng đã cho chúng tôi biết tình yêu thương của anh chị em trong Thánh Linh[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “tình yêu thương thuộc linh của anh chị em.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ ... δηλώσας
  choice: người ... đã cho ... biết
  rationale: Mạo từ đi với phân từ quá khứ có chức năng danh từ hóa và quy chiếu về Ê-pháp-ra ở câu trước; tiếng Việt tự nhiên dùng mệnh đề quan hệ nối tiếp. δηλόω ở đây mang nghĩa cho biết hoặc báo lại.
- source_word: καὶ
  choice: cũng
  rationale: Diễn tả hành động bổ sung của Ê-pháp-ra so với điều vừa nói ở câu trước.
- source_word: ἡμῖν
  choice: cho chúng tôi
  rationale: 'Dạng tặng cách làm bổ ngữ gián tiếp: Ê-pháp-ra cho Phao-lô và những người cùng ông biết điều này.'
- source_word: τὴν ὑμῶν ἀγάπην
  choice: tình yêu thương của anh chị em
  rationale: ἀγάπη được dịch là “tình yêu thương”; ὑμῶν là đại từ số nhiều, được diễn đạt bằng “anh chị em” để tự nhiên và bao quát trong tiếng Việt.
- source_word: ἐν πνεύματι
  choice: trong Thánh Linh
  rationale: Cụm từ không có mạo từ vẫn có thể chỉ Thánh Linh trong cách dùng của Phao-lô. Bản chính giữ cấu trúc ngắn gọn và cách hiểu có khả năng cao nhất, còn nghĩa “trong tâm linh” hoặc phẩm chất thuộc linh được giữ ở chú thích.
theological_decisions:
- issue: Đối tượng quy chiếu của πνεύματι
  choice: Thánh Linh là đối tượng quy chiếu có khả năng cao nhất trong cụm “tình yêu thương ... trong Thánh Linh”
  alternative: “tình yêu thương trong tâm linh”, tức tình yêu thương thuộc linh
  rationale: Ngữ pháp cho phép cả cách hiểu chỉ Thánh Linh lẫn cách hiểu nói về bình diện hoặc phẩm chất thuộc linh. Bản chính chọn cách hiểu có vẻ phù hợp hơn với cách dùng của Phao-lô nhưng không xóa bỏ sự mơ hồ thật sự của nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Anh chị em” thể hiện số nhiều của ὑμῶν mà không mặc định giới tính; “Thánh Linh” phân biệt cách hiểu chính với phương án “tâm linh” trong chú thích.
