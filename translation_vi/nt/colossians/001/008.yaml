  verdict: revise
  source_fidelity: Bản chính chuyển đạt đúng cấu trúc quy chiếu về Ê-pháp-ra, sắc thái bổ sung của καὶ (“cũng”), người nhận tin ἡμῖν (“chúng tôi”), và nội dung được báo cho biết. “Trong Thánh Linh” là cách hiểu có cơ sở cho ἐν πνεύματι; chú thích cần giữ phương án không xác định rõ Thánh Linh mà không thêm sắc thái tâm lý không có trong nguyên văn.
  naturalness: Câu chính tự nhiên, trang trọng và phù hợp khi đọc nối với câu 7. Tuy nhiên, “trong tâm linh” trong chú thích không phải cách diễn đạt hiện đại tự nhiên cho nghĩa thay thế “in spirit/spiritual”; dễ bị hiểu là trạng thái nội tâm hơn là tính chất thuộc linh.
  terminology: “Thánh Linh,” “tình yêu thương,” và “anh chị em” nhất quán với văn phong Cơ Đốc hiện đại. Phương án thay thế nên dùng “thuộc linh” để phản ánh cách hiểu về bình diện/phẩm chất thiêng liêng mà không khẳng định πνεύματι là danh xưng Thánh Linh.
