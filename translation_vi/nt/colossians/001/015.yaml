source:
  edition: SBLGNT
  text: ὅς ἐστιν εἰκὼν τοῦ θεοῦ τοῦ ἀοράτου, πρωτότοκος πάσης κτίσεως,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/015.yaml
  text: He is the image of the invisible God[a], the firstborn of all creation.
translation:
  language: vi
  text: Ngài là hình ảnh của Đức Chúa Trời vô hình, là Đấng trưởng tử của toàn thể tạo vật.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cụm từ này cũng có thể được hiểu là “Đấng trưởng tử trên toàn thể tạo vật”. “Trưởng tử” ở đây có thể nhấn mạnh địa vị và quyền thừa kế, chứ không nhất thiết nói rằng Con thuộc về tạo vật; xin đối chiếu lời giải thích trong các câu tiếp theo.
    reason: Giữ nguyên sự mơ hồ của sở hữu cách Hy Lạp, đồng thời trình bày cách hiểu theo địa vị mà không áp đặt nó vào bản chính.
lexical_decisions:
- source_word: ὅς
  choice: Ngài
  rationale: Đại từ quan hệ chỉ về Con ở câu trước. Mở đầu bằng “Ngài” tạo thành một câu tiếng Việt tự nhiên, đồng thời giữ rõ chủ thể.
- source_word: ἐστιν
  choice: là
  rationale: Diễn đạt trực tiếp động từ liên kết ở thì hiện tại.
- source_word: εἰκὼν
  choice: hình ảnh
  rationale: Giữ được nghĩa biểu hiện và bày tỏ của từ Hy Lạp mà không thu hẹp thành chỉ “giống như” hay diễn giải sâu hơn về bản thể.
- source_word: τοῦ θεοῦ τοῦ ἀοράτου
  choice: của Đức Chúa Trời vô hình
  rationale: Cấu trúc sở hữu và tính chất không thể thấy được diễn đạt tự nhiên, trang trọng trong tiếng Việt.
- source_word: πρωτότοκος
  choice: Đấng trưởng tử
  rationale: “Trưởng tử” bảo tồn hình ảnh người con sinh đầu cùng nền nghĩa về địa vị và quyền thừa kế; thêm “Đấng” giúp cụm từ dùng cho một ngôi vị được tự nhiên và tôn kính hơn.
- source_word: πάσης κτίσεως
  choice: của toàn thể tạo vật
  rationale: Bám sát cấu trúc sở hữu cách của tiếng Hy Lạp và không tự quyết định rằng quan hệ này chỉ có nghĩa thời gian hay quyền cai trị.
theological_decisions:
- issue: Ý nghĩa của πρωτότοκος πάσης κτίσεως đối với quan hệ giữa Đấng Christ và tạo vật
  choice: Đấng trưởng tử của toàn thể tạo vật
  alternative: Đấng trưởng tử trên toàn thể công trình sáng tạo
  rationale: Bản chính giữ cấu trúc mơ hồ có thật của nguyên văn thay vì đưa nghĩa địa vị tối cao vào giới từ “trên”. Chú thích nêu rõ rằng “trưởng tử” trong ngữ cảnh Kinh Thánh có thể chỉ địa vị và quyền thừa kế, và các câu tiếp theo cần được dùng để hiểu cụm từ này.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ đọc. “Đấng trưởng tử” có sắc thái Kinh Thánh nhưng vẫn dễ hiểu; dấu chú thích được đặt ngay sau cụm từ mà chú thích giải thích.
