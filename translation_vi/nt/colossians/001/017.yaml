  edition: SBLGNT
  text: καὶ αὐτός ἐστιν πρὸ πάντων καὶ τὰ πάντα ἐν αὐτῷ συνέστηκεν,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/017.yaml
  text: And he is before all things[b][a], and in him all things hold together.
translation:
  language: vi
  text: Ngài có trước muôn vật[a], và trong Ngài, muôn vật đều gắn kết[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Có trước muôn vật” cũng có thể hàm ý Ngài cao hơn muôn vật, nhưng cách diễn đạt Hy Lạp trước hết nói đến sự có trước.
    reason: alternative_reading
  - marker: b
    text: 'Cũng có thể dịch: “muôn vật đều cố kết trong Ngài” hoặc “muôn vật đều hợp thành trong Ngài.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτός
  choice: Ngài
  rationale: Đại từ chỉ Đấng Christ và có sắc thái nhấn mạnh do vị trí trong câu. “Ngài” diễn đạt tự nhiên, trang trọng trong tiếng Việt; không thêm “chính” để tránh nhấn mạnh quá mức.
- source_word: πρὸ πάντων
  choice: có trước muôn vật
  rationale: πρό với sở hữu cách chủ yếu chỉ sự có trước. Thêm “có” giúp câu tiếng Việt tự nhiên và làm rõ ý hiện hữu trước, trong khi không chuyển thành ý thứ bậc đơn thuần.
- source_word: τὰ πάντα
  choice: muôn vật
  rationale: Cụm từ có phạm vi bao quát. “Muôn vật” tự nhiên trong văn phong Kinh Thánh hiện đại và giữ mối liên hệ với toàn thể công trình sáng tạo trong văn cảnh.
- source_word: ἐν αὐτῷ
  choice: trong Ngài
  rationale: Giữ nguyên nét nghĩa cơ bản của ἐν, không diễn giải thành “bởi Ngài” hay “nhờ Ngài”; qua đó bảo toàn quan hệ về phạm vi và sự duy trì mà câu văn gợi ra.
- source_word: συνέστηκεν
  choice: gắn kết với nhau
  rationale: 'Thì hoàn thành diễn tả một trạng thái hiện còn: muôn vật đã được kết hợp và vẫn duy trì sự cố kết. “Gắn kết với nhau” rõ nghĩa trong tiếng Việt hiện đại, đồng thời ít kỹ thuật hơn “cố kết” và chính xác hơn cách nói chỉ về sự tồn tại.'
theological_decisions:
- issue: Quan hệ của Đấng Christ với tạo vật trong πρὸ πάντων
  choice: Diễn đạt sự có trước về thời gian bằng “có trước muôn vật”
  alternative: “cao hơn muôn vật”, nhấn mạnh địa vị tối thượng
  rationale: Cấu trúc Hy Lạp trước hết diễn tả sự ưu tiên hay hiện hữu có trước. Trong văn cảnh, điều này góp phần trình bày địa vị cao cả của Đấng Christ, nhưng bản dịch không nên thay ý có trước bằng một diễn giải thuần túy về thứ bậc.
- issue: Sắc thái của συνέστηκεν
  choice: Muôn vật duy trì sự gắn kết trong Ngài
  alternative: “muôn vật tồn tại trong Ngài” hoặc “muôn vật cố kết trong Ngài”
  rationale: Động từ có thể nói đến sự cấu thành, cố kết hoặc tồn tại trong một trạng thái bền vững. Cách dịch chính làm nổi bật trật tự và sự cố kết đang được duy trì mà không xác định quá hẹp cơ chế thần học.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “Ngài” để chỉ Đấng Christ và “muôn vật” để giữ âm hưởng Kinh Thánh tự nhiên. Các chú thích được đặt ngay sau những cụm từ liên quan theo thứ tự xuất hiện.
