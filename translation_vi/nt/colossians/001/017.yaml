  source_fidelity: 'Bản dịch truyền đạt đúng hai mệnh đề chính: Đấng Christ có trước mọi sự (πρὸ πάντων) và muôn vật ở trong Ngài ở trong trạng thái cố kết/duy trì (ἐν αὐτῷ συνέστηκεν). Tuy nhiên, cụm “gắn kết với nhau” thêm sắc thái hỗ tương rõ rệt (“với nhau”) mà động từ συνέστηκεν không nêu trực tiếp; câu nguồn nhấn mạnh trạng thái muôn vật được cố kết trong Ngài.'
