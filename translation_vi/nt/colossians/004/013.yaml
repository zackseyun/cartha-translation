  to: Vì tôi làm chứng về người ấy rằng người ấy đang lao nhọc rất nhiều vì anh chị em, vì những người ở Lao-đi-xê và những người ở Hiê-ra-pô-li[a].
  rationale: Sửa thì của mệnh đề chính để phản ánh ἔχει ở hiện tại và dùng “đang lao nhọc rất nhiều” để diễn đạt tự nhiên πολὺν πόνον. Điều chỉnh chú thích cho nhất quán với bản chính, đồng thời giữ các sắc thái từ vựng có thể có mà không giải thích quá mức. Các thành tố khác, gồm tính song song của hai địa danh và điểm neo chú thích, được giữ nguyên.
