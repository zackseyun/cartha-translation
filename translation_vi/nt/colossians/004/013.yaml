source:
  edition: SBLGNT
  text: μαρτυρῶ γὰρ αὐτῷ ὅτι ἔχει ⸂πολὺν πόνον⸃ ὑπὲρ ὑμῶν καὶ τῶν ἐν Λαοδικείᾳ καὶ τῶν ἐν Ἱεραπόλει.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/013.yaml
  text: For I testify for him that he has great labor for you and for those in Laodicea and those in Hierapolis[a].
translation:
  language: vi
  text: Vì tôi làm chứng về người ấy rằng người ấy đang lao nhọc rất nhiều vì anh chị em, vì những người ở Lao-đi-xê và những người ở Hiê-ra-pô-li[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “có nhiều công khó”, “hết sức lo lắng” hoặc “chịu nhiều khổ tâm”. Từ Hy Lạp có thể chỉ sự lao nhọc vất vả và, theo ngữ cảnh, sự quan tâm sâu sắc.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μαρτυρῶ γὰρ αὐτῷ
  choice: Vì tôi làm chứng về anh ấy
  rationale: Giữ liên từ giải thích γὰρ và lời xác nhận trực tiếp của Phao-lô. Với μαρτυρέω, đại từ ở cách tặng có thể chỉ người được làm chứng về; cách diễn đạt này tự nhiên trong tiếng Việt và không biến câu thành lời làm chứng nói trực tiếp với Ê-pháp-ra.
- source_word: ὅτι ἔχει πολὺν πόνον
  choice: rằng anh ấy đã hết sức nhọc nhằn
  rationale: πόνος trước hết chỉ sự lao nhọc, vất vả hoặc khổ nhọc. Cách dịch bằng động từ tự nhiên hơn lối nói cứng 'có sự lao nhọc lớn', đồng thời vẫn để ngữ cảnh cầu nguyện ở câu trước soi sáng tính chất của sự nhọc nhằn.
- source_word: ὑπὲρ ὑμῶν
  choice: vì anh chị em
  rationale: ὑπέρ diễn tả hành động hướng đến lợi ích của người khác. 'Vì' ngắn gọn và tự nhiên; 'anh chị em' biểu đạt số nhiều của ὑμῶν và phù hợp lời văn gửi cộng đồng tín hữu.
- source_word: τῶν ἐν Λαοδικείᾳ
  choice: những người ở Lao-đi-xê
  rationale: Cụm mạo từ cùng giới từ chỉ những người tại thành Lao-đi-xê; bản dịch không thêm từ 'tín hữu' dù ngữ cảnh hàm ý như vậy.
- source_word: τῶν ἐν Ἱεραπόλει
  choice: những người ở Hiê-ra-pô-li
  rationale: Duy trì cấu trúc song song với Lao-đi-xê và phiên âm địa danh theo cách đọc dễ hiểu trong tiếng Việt.
theological_decisions:
- issue: Ý nghĩa của πόνος đối với chức vụ của Ê-pháp-ra
  choice: Dịch là 'đã hết sức nhọc nhằn', nhấn mạnh sự lao nhọc lớn nhưng không giới hạn vào một hoạt động duy nhất.
  alternative: hết sức lo lắng; chịu nhiều khổ tâm; lao nhọc rất nhiều
  rationale: Ngữ cảnh gần nói đến sự tranh đấu trong lời cầu nguyện, nên sắc thái quan tâm hoặc khổ tâm là khả dĩ. Tuy nhiên, nghĩa căn bản của πόνος là lao nhọc hay vất vả; bản chính giữ nghĩa rộng và chú thích ghi nhận các sắc thái khác.
- issue: Quan hệ của αὐτῷ với μαρτυρῶ
  choice: làm chứng về anh ấy
  alternative: làm chứng cho anh ấy; xác nhận thay cho anh ấy
  rationale: Cách tặng có thể biểu thị người được làm chứng về hoặc người được làm chứng có lợi cho. 'Về anh ấy' diễn đạt tự nhiên nội dung Phao-lô xác nhận về Ê-pháp-ra mà không nhấn quá mức sắc thái biện hộ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng 'anh chị em' để thể hiện đại từ số nhiều hướng đến cộng đồng; 'anh ấy' tránh lối gọi quá cổ. Địa danh được phiên âm Lao-đi-xê và Hiê-ra-pô-li. Dấu chú thích [a] được đặt ngay sau cụm từ mà chú thích giải nghĩa.
