  to: và Giê-su, người được gọi là Giúc-tu. Trong số những người thuộc giới cắt bì, chỉ những người này là bạn đồng công cho vương quốc Đức Chúa Trời[a], và họ đã trở thành niềm an ủi cho tôi.[b]
