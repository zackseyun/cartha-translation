id: COL.4.11
reference: Colossians 4:11
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ Ἰησοῦς ὁ λεγόμενος Ἰοῦστος, οἱ ὄντες ἐκ περιτομῆς, οὗτοι μόνοι συνεργοὶ εἰς τὴν βασιλείαν τοῦ θεοῦ, οἵτινες ἐγενήθησάν μοι παρηγορία.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/011.yaml
  text: and Jesus who is called Justus[a]. These are the only ones from the circumcision who are fellow workers for the kingdom of God[c][b], and they became a comfort to me.
translation:
  language: vi
  text: và Giê-su, người được gọi là Giúc-tu. Trong số những người thuộc giới cắt bì, chỉ những người này là bạn đồng công cho vương quốc Đức Chúa Trời[a], và họ đã trở thành niềm an ủi cho tôi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Chỉ những người này là bạn đồng công cho vương quốc Đức Chúa Trời trong số những người thuộc giới cắt bì.” Cụm “thuộc giới cắt bì” thường chỉ những người có căn tính Do Thái; cũng có thể được hiểu hẹp hơn là một nhóm gắn với phép cắt bì.'
    reason: Bảo lưu cách sắp xếp cú pháp khác có thể có và giữ sự không hoàn toàn xác định về phạm vi của thành ngữ Hy Lạp.
  - marker: b
    text: 'Cũng có thể dịch: “họ đã trở nên nguồn khích lệ cho tôi” hoặc “họ đã chứng tỏ là niềm an ủi cho tôi.”'
    reason: παρηγορία có thể mang nghĩa an ủi hoặc khích lệ, còn ἐγενήθησαν có thể được diễn đạt tự nhiên là “trở thành”, “trở nên” hay “chứng tỏ là” tùy ngữ cảnh.
lexical_decisions:
- source_word: Ἰησοῦς
  choice: Giê-su
  rationale: Dùng dạng tên quen thuộc trong Tân Ước tiếng Việt; dù tên này tương ứng với Giô-suê trong tiếng Hê-bơ-rơ, ngữ cảnh Hy Lạp gọi nhân vật là Ἰησοῦς.
- source_word: ὁ λεγόμενος Ἰοῦστος
  choice: người được gọi là Giúc-tu
  rationale: Giữ cấu trúc xác định tên gọi khác của nhân vật, đồng thời diễn đạt tự nhiên trong tiếng Việt.
- source_word: οἱ ὄντες ἐκ περιτομῆς
  choice: những người thuộc giới cắt bì
  rationale: Giữ hình ảnh và dấu hiệu căn tính Do Thái của nguyên văn, thay vì diễn giải thẳng thành “người Do Thái” hoặc thu hẹp thành một phe phái thần học.
- source_word: οὗτοι μόνοι
  choice: chỉ những người này
  rationale: Thể hiện rõ tính loại trừ trong μόνοι và đặt sự nhấn mạnh trong phạm vi nhóm vừa nêu.
- source_word: συνεργοὶ
  choice: bạn đồng công
  rationale: Thuật ngữ Kinh Thánh tiếng Việt tự nhiên, trang trọng, chỉ những người cùng cộng tác trong công việc phục vụ.
- source_word: εἰς τὴν βασιλείαν τοῦ θεοῦ
  choice: vì vương quốc Đức Chúa Trời
  rationale: Hiểu εἰς theo nghĩa mục đích hoặc sự phục vụ gắn với συνεργοί; “vì” diễn đạt rằng công việc chung hướng đến và phục vụ vương quốc Đức Chúa Trời.
- source_word: ἐγενήθησάν μοι παρηγορία
  choice: họ đã trở thành niềm an ủi cho tôi
  rationale: Phản ánh trực tiếp động từ ἐγενήθησαν và danh từ παρηγορία, đồng thời giữ sắc thái nâng đỡ trong quan hệ cá nhân.
theological_decisions:
- issue: Phạm vi của cụm “những người thuộc giới cắt bì”
  choice: Câu chính xác định đây là nhóm người có căn tính Do Thái, và chỉ những người vừa được kể tên trong nhóm ấy là bạn đồng công của Phao-lô.
  alternative: Có thể hiểu cụm này hẹp hơn là “phe cắt bì”, hoặc chuyển trực tiếp thành “người Do Thái”.
  rationale: 'Ngữ cảnh nói về những người cộng tác cho vương quốc Đức Chúa Trời, nhưng bản dịch không nên tự ý biến cụm căn tính của nguyên văn thành nhãn phe phái. Cấu trúc tiếng Việt cũng giữ phạm vi nhấn mạnh: trong số nhóm thuộc giới cắt bì, chỉ những người này là bạn đồng công.'
- issue: Quan hệ của εἰς với “bạn đồng công”
  choice: “bạn đồng công vì vương quốc Đức Chúa Trời”
  alternative: “bạn đồng công hướng đến vương quốc Đức Chúa Trời” hoặc “bạn đồng công cho vương quốc Đức Chúa Trời”
  rationale: “Vì” vừa tự nhiên vừa giữ ý mục đích/phục vụ, nhưng không xác định chi tiết hơn mức giới từ Hy Lạp cho phép.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “bạn đồng công” theo ngữ vực thư tín Cơ Đốc quen thuộc; giữ “giới cắt bì” để bảo toàn hình ảnh nguyên văn và sự căng thẳng thần học. Các dấu chú thích [a], [b] đều xuất hiện trong chính văn.
