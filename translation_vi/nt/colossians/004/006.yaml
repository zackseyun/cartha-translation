id: COL.4.6
reference: Colossians 4:6
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ λόγος ὑμῶν πάντοτε ἐν χάριτι, ἅλατι ἠρτυμένος, εἰδέναι πῶς δεῖ ὑμᾶς ἑνὶ ἑκάστῳ ἀποκρίνεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/006.yaml
  text: Let your speech always be with grace[a], seasoned with salt[b], so that you may know how you ought to answer each person.
translation:
  language: vi
  text: Lời nói của anh chị em phải luôn ân hậu[a], được nêm muối[b], để anh chị em biết phải trả lời mỗi người thế nào.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “ân cần.” Cụm từ này mô tả lời nói được đặc trưng bởi ân hậu, tử tế hoặc thiện cảm.'
    reason: lexical_alternative
  - marker: b
    text: “Được nêm muối” là hình ảnh ẩn dụ về lời nói thích hợp, cuốn hút và khôn ngoan, chứ không nhạt nhẽo hay gây hại.
    reason: cultural_note
lexical_decisions:
- source_word: ὁ λόγος ὑμῶν
  choice: Lời nói của anh chị em
  rationale: Trong lời khuyên thực hành này, λόγος chỉ cách các tín hữu nói năng, không phải một từ riêng lẻ hay một thông điệp trang trọng. “Lời nói” tự nhiên trong tiếng Việt và phù hợp với vế nói về việc trả lời người khác.
- source_word: πάντοτε ἐν χάριτι
  choice: phải luôn đầy ân hậu
  rationale: Cách diễn đạt này truyền đạt lời nói luôn mang đặc tính tử tế, nhã nhặn và đem ơn lành đến người nghe. “Ân hậu” giữ được sắc thái của χάρις mà không thu hẹp cụm từ chỉ còn phép lịch sự.
- source_word: ἅλατι ἠρτυμένος
  choice: như được nêm muối
  rationale: Giữ nguyên hình ảnh ẩn dụ về lời nói có sự thích hợp, đậm đà và khôn ngoan. “Được nêm muối” cũng phản ánh trạng thái kết quả của phân từ hoàn thành ἠρτυμένος; thêm “như” làm rõ đây là phép ví von trong tiếng Việt.
- source_word: εἰδέναι
  choice: để ... biết
  rationale: Động từ nguyên mẫu có quan hệ cú pháp không hoàn toàn rõ với lời khuyên phía trước. “Để ... biết” diễn đạt hợp lý ý mục đích hoặc kết quả mà không giải thích quá mức.
- source_word: δεῖ
  choice: nên
  rationale: δεῖ diễn tả điều cần thiết hoặc thích hợp. “Nên” thể hiện nghĩa vụ phù hợp với giọng khuyên bảo, tránh làm câu nặng hơn bằng “phải” ở vế này.
- source_word: ἑνὶ ἑκάστῳ
  choice: từng người
  rationale: Cụm phân phối này nhấn mạnh việc đáp lời thích hợp cho mỗi cá nhân. “Từng người” rõ ràng, tự nhiên và giữ được lực nhấn ấy.
- source_word: ἀποκρίνεσθαι
  choice: trả lời
  rationale: Đây là từ tương đương trực tiếp, tự nhiên cho hành động đáp lời trong bối cảnh giao tiếp.
theological_decisions:
- issue: Sắc thái của ἐν χάριτι
  choice: đầy ân hậu
  alternative: trong ân điển; cách ân cần
  rationale: Cụm Hy Lạp có thể gợi cả sự tử tế trong giao tiếp lẫn âm hưởng rộng hơn của χάρις trong thư Phao-lô. “Đầy ân hậu” ưu tiên ý đặc trưng của lời nói nhưng không đồng nhất cụm từ với một giáo thuyết chuyên biệt; chú thích bảo tồn phạm vi nghĩa.
- issue: Quan hệ của εἰδέναι với lời khuyên phía trước
  choice: để ... biết
  alternative: hãy biết; nhờ đó ... biết
  rationale: Cú pháp có thể được hiểu theo hướng mục đích hoặc kết quả. Bản dịch “để” giữ được mối liên hệ chặt chẽ và phần nào để ngỏ hai sắc thái ấy.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “anh chị em” để diễn đạt đại từ số nhiều ὑμῶν/ὑμᾶς trong lời khuyên dành cho cộng đồng. Giữ ẩn dụ nêm muối và đặt mọi dấu chú thích ngay trong câu chính.
