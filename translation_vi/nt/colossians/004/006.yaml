- from: Lời nói của anh chị em phải luôn đầy ân hậu[a], như được nêm muối[b], để anh chị em biết mình nên trả lời từng người thế nào.
  to: Lời nói của anh chị em phải luôn ân hậu[a], được nêm muối[b], để anh chị em biết phải trả lời mỗi người thế nào.
  rationale: 'Bản sửa giữ sát cấu trúc và hình ảnh của nguyên văn: ἐν χάριτι được diễn đạt tự nhiên bằng “luôn ân hậu”; ἅλατι ἠρτυμένος được giữ như một ẩn dụ trực tiếp; và δεῖ được phản ánh bằng “phải.” Không giải quyết theo hướng giáo phái bất cứ sắc thái rộng hơn nào của χάρις.'
  reviewer_model: gpt-5.6-terra
