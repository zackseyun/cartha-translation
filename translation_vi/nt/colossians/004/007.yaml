id: COL.4.7
reference: Colossians 4:7
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Τὰ κατ’ ἐμὲ πάντα γνωρίσει ὑμῖν Τυχικὸς ὁ ἀγαπητὸς ἀδελφὸς καὶ πιστὸς διάκονος καὶ σύνδουλος ἐν κυρίῳ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/007.yaml
  text: Tychicus[a], the beloved brother and faithful minister and fellow servant in the Lord[c][b], will make known to you everything about me.
translation:
  language: vi
  text: Ti-chi-cơ, người anh em yêu dấu, người phục vụ trung tín[a] và người đồng tôi tớ[b] trong Chúa, sẽ cho anh chị em biết mọi việc liên quan đến tôi.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “người hầu việc trung tín”; từ Hy Lạp διάκονος có thể chỉ người phục vụ, người thi hành thánh chức, hoặc trong một số ngữ cảnh là chấp sự.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “người đồng nô lệ”. Từ Hy Lạp σύνδουλος chỉ người cùng chia sẻ thân phận lệ thuộc và phục vụ dưới một chủ.
    reason: lexical_alternative
  - marker: c
    text: Cũng có thể dịch là “mọi điều về tôi” hoặc “toàn bộ tình hình của tôi”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τὰ κατ’ ἐμὲ πάντα
  choice: mọi việc liên quan đến tôi
  rationale: Thành ngữ này chỉ toàn bộ những việc, tình hình hoặc hoàn cảnh liên quan đến Phao-lô. Cách dịch này tự nhiên trong tiếng Việt, giữ được phạm vi rộng của πάντα và không thu hẹp nghĩa chỉ còn “hoàn cảnh”.
- source_word: γνωρίσει ὑμῖν
  choice: sẽ cho anh chị em biết
  rationale: γνωρίζω ở thì tương lai mang nghĩa làm cho biết hoặc báo cho biết; ὑμῖν là đại từ số nhiều chỉ cộng đồng người nhận thư. “Anh chị em” diễn đạt tự nhiên số nhiều trong ngữ cảnh hội thánh.
- source_word: Τυχικὸς
  choice: Ti-chi-cơ
  rationale: Tên riêng được phiên âm theo cách đọc quen thuộc trong tiếng Việt.
- source_word: ὁ ἀγαπητὸς ἀδελφὸς
  choice: người anh em yêu dấu
  rationale: Giữ được cả tình cảm ấm áp của ἀγαπητός lẫn cách gọi một nam tín hữu là ἀδελφός.
- source_word: πιστὸς διάκονος
  choice: người phục vụ trung tín
  rationale: διάκονος ở đây nói đến vai trò phục vụ nhưng không nhất thiết chỉ rõ chức vụ chấp sự; “người phục vụ” giữ được độ rộng nghĩa ấy. πιστός được dịch là “trung tín” để diễn đạt sự đáng tin cậy và bền lòng.
- source_word: σύνδουλος
  choice: người cùng làm tôi tớ
  rationale: Từ ghép này chỉ người cùng chia sẻ thân phận phục vụ dưới một chủ. “Người cùng làm tôi tớ” tự nhiên và trang trọng hơn “đồng nô lệ” trong tiếng Việt, còn sắc thái lệ thuộc của δοῦλος được nêu rõ trong chú thích.
- source_word: ἐν κυρίῳ
  choice: trong Chúa
  rationale: Giữ nguyên thành ngữ đặc trưng của Phao-lô, diễn tả phạm vi và mối liên hệ với Chúa mà không diễn giải quá mức.
theological_decisions:
- issue: Sắc thái của σύνδουλος / δοῦλος
  choice: người cùng làm tôi tớ
  alternative: người đồng nô lệ
  rationale: σύνδουλος diễn tả việc Ti-chi-cơ cùng Phao-lô thuộc về và phục vụ dưới quyền Chúa. Bản chính dùng cách nói tự nhiên, trang trọng trong tiếng Việt nhưng không che giấu sắc thái lệ thuộc; phương án sát nghĩa “người đồng nô lệ” được bảo lưu trong chú thích.
- issue: Phạm vi liên kết của ἐν κυρίῳ
  choice: đặt “trong Chúa” sau toàn bộ chuỗi danh xưng như nguyên bản
  alternative: diễn giải là chỉ bổ nghĩa cho “người cùng làm tôi tớ” hoặc cho cả vai trò phục vụ
  rationale: Cú pháp Hy Lạp cho phép cụm từ này gắn gần nhất với σύνδουλος nhưng cũng có thể phủ lên lời giới thiệu nói chung. Giữ nguyên vị trí giúp bảo toàn độ mở đó.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu giữ trật tự giới thiệu Ti-chi-cơ cùng ba danh xưng trước động từ chính, gần với cấu trúc Hy Lạp nhưng vẫn tự nhiên trong tiếng Việt. “Anh chị em” thể hiện đại từ số nhiều hướng đến cả cộng đồng.
