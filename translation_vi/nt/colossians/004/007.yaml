  terminology: “Ti-chi-cơ,” “Chúa,” “trung tín,” và “người phục vụ” đều phù hợp. “Người đồng tôi tớ” duy trì được quan hệ cùng thuộc về/cùng phục vụ vốn có trong σύνδουλος, còn chú thích nên nêu “đồng nô lệ” như một phương án sát từ nguyên mà không áp đặt nó vào câu chính.
