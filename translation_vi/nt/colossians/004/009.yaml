    rationale: “Là một người trong anh chị em” tự nhiên hơn trong tiếng Việt hiện đại, vẫn giữ ý Ô-nê-sim xuất thân/thuộc về cộng đồng người nhận mà không thêm dữ kiện từ Phi-lê-môn.
