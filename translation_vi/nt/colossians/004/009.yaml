source:
  edition: SBLGNT
  text: σὺν Ὀνησίμῳ τῷ πιστῷ καὶ ἀγαπητῷ ἀδελφῷ, ὅς ἐστιν ἐξ ὑμῶν· πάντα ὑμῖν γνωρίσουσιν τὰ ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/009.yaml
  text: together with Onesimus[a], the faithful and beloved brother, who is one of you[b]. They will make known to you everything here.
translation:
  language: vi
  text: cùng với Ô-nê-sim, người anh em trung tín và yêu dấu, là một người trong anh chị em. Họ sẽ cho anh chị em biết mọi việc ở đây[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Họ sẽ kể cho anh chị em mọi chuyện ở đây.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: σὺν
  choice: cùng với
  rationale: Diễn đạt tự nhiên ý đồng hành và nối Ô-nê-sim với Ty-chi-cơ ở câu trước.
- source_word: Ὀνησίμῳ
  choice: Ô-nê-sim
  rationale: Phiên âm tên riêng theo lối quen dùng và dễ đọc trong tiếng Việt.
- source_word: πιστῷ
  choice: trung tín
  rationale: Giữ được nghĩa đáng tin cậy, trung thành trong quan hệ và sự phục vụ Cơ Đốc.
- source_word: ἀγαπητῷ
  choice: yêu dấu
  rationale: Chuyển tải sắc thái trìu mến và trang trọng của thư tín Cơ Đốc.
- source_word: ἀδελφῷ
  choice: người anh em
  rationale: Danh từ số ít giống đực chỉ một tín hữu nam; cách dịch giữ nguyên hình ảnh gia đình thuộc cộng đồng đức tin.
- source_word: ὅς ἐστιν ἐξ ὑμῶν
  choice: là người trong số anh chị em
  rationale: Diễn đạt sự thuộc về cộng đồng Cô-lô-se, đồng thời không suy diễn thêm địa vị xã hội hay hoàn cảnh của Ô-nê-sim.
- source_word: πάντα
  choice: mọi việc
  rationale: Trong ngữ cảnh thông báo tình hình, 'mọi việc' tự nhiên hơn 'mọi sự' mà vẫn giữ tính bao quát.
- source_word: γνωρίσουσιν
  choice: sẽ cho ... biết
  rationale: Cách nói tiếng Việt tự nhiên, sát nghĩa làm cho biết hoặc thông báo.
- source_word: τὰ ὧδε
  choice: mọi việc ở đây
  rationale: Chỉ các sự việc hoặc tình hình tại nơi Phao-lô đang ở, không thu hẹp thành riêng những gì đang xảy ra.
theological_decisions:
- issue: Ý nghĩa cộng đồng đức tin của ἀδελφῷ
  choice: người anh em
  alternative: người anh em trong đức tin
  rationale: Bản dịch giữ nguyên ngôn ngữ gia đình của nguyên văn mà không thêm cụm giải thích không có trong câu.
- issue: Sắc thái của ἐξ ὑμῶν
  choice: là người trong số anh chị em
  alternative: là người từ giữa anh chị em
  rationale: Cách chọn nhấn mạnh Ô-nê-sim thuộc cộng đồng độc giả nhưng không nhập các dữ kiện hoặc kết luận từ thư Phi-lê-môn.
- issue: Cách xưng hô với cộng đồng qua ὑμῶν/ὑμῖν
  choice: anh chị em
  alternative: anh em
  rationale: Các đại từ số nhiều hướng đến toàn thể hội thánh; 'anh chị em' là cách gọi tự nhiên, bao quát trong tiếng Việt và không thay đổi giới tính nam của danh từ số ít chỉ Ô-nê-sim.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng 'anh chị em' cho cộng đồng độc giả, nhưng giữ 'người anh em' đối với Ô-nê-sim. Cấu trúc câu theo sát nguyên văn mà vẫn tự nhiên trong tiếng Việt.
