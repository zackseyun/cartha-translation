  text: Ὁ ἀσπασμὸς τῇ ἐμῇ χειρὶ Παύλου. μνημονεύετέ μου τῶν δεσμῶν. ἡ χάρις μεθ’ ⸀ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/018.yaml
  text: The greeting is in my own hand—Paul's[a]. Remember my chains[b]. Grace be with you.
translation:
  language: vi
  text: Tôi, Phao-lô, tự tay viết lời chào này.[a] Hãy nhớ đến xiềng xích của tôi.[b] Ân điển ở cùng anh chị em.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn có cấu trúc tỉnh lược: “Lời chào bằng chính tay tôi, Phao-lô,” chỉ lời chào kết thư do đích thân Phao-lô viết.'
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể hiểu là “việc tôi bị tù” hoặc “những dây trói của tôi.” Nguyên văn là “xiềng xích.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπασμός
  choice: Lời chào
  rationale: Trong ngữ cảnh thư tín, từ này chỉ lời chào kết thư; “lời chào” tự nhiên và dễ hiểu trong tiếng Việt hiện đại.
- source_word: τῇ ἐμῇ χειρὶ Παύλου
  choice: do chính tay tôi, Phao-lô, viết
  rationale: Cụm cách ba diễn tả lời chào được chính Phao-lô tự tay viết. Thêm “viết” để diễn đạt tự nhiên sự tỉnh lược của nguyên văn, đồng thời giữ sắc thái nhấn mạnh tính đích thân.
- source_word: μνημονεύετέ
  choice: Hãy nhớ đến
  rationale: Mệnh lệnh hiện tại kêu gọi người đọc ghi nhớ; cách dịch này tự nhiên, không diễn giải quá mức khía cạnh tiếp diễn.
- source_word: μου τῶν δεσμῶν
  choice: xiềng xích của tôi
  rationale: Giữ hình ảnh cụ thể của δεσμοί, đồng thời trong ngữ cảnh có thể được hiểu hoán dụ là cảnh tù đày.
- source_word: ἡ χάρις
  choice: Ân điển
  rationale: Thuật ngữ quen thuộc, trang trọng và rõ nghĩa trong lời chúc phước của Phao-lô; không thêm chủ thể sở hữu vốn không được nêu trong tiếng Hy Lạp.
- source_word: μεθ’ ὑμῶν
  choice: ở cùng anh chị em
  rationale: Diễn đạt trực tiếp μετά với sở hữu cách trong công thức chúc phước. “Anh chị em” thể hiện số nhiều và bao quát cộng đồng nhận thư mà không nhập giới tính vào đại từ Hy Lạp.
theological_decisions:
- issue: Lời chúc phước không có động từ trong nguyên văn
  choice: Ân điển ở cùng anh chị em
  alternative: Ân điển cùng anh chị em
  rationale: Bổ sung “ở” theo cú pháp tiếng Việt để lời chúc tự nhiên, nhưng không thêm nguồn của ân điển hay nội dung thần học không có trong nguyên văn.
- issue: Ý nghĩa của “xiềng xích”
  choice: Giữ hình ảnh cụ thể “xiềng xích” trong chính văn
  alternative: cảnh tù đày của tôi
  rationale: Nguyên văn dùng danh từ cụ thể δεσμοί; giữ hình ảnh này bảo tồn sức gợi và không thu hẹp lời kêu gọi chỉ còn một cách diễn giải trừu tượng.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “Phao-lô” theo lối phiên âm Kinh Thánh quen thuộc; dùng “anh chị em” cho đại từ số nhiều ὑμῶν nhằm diễn đạt tự nhiên và bao quát cộng đồng người nhận.
