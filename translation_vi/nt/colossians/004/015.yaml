- from: Hãy gửi lời chào đến các anh chị em ở Lao-đi-xê, cùng Nympha và hội thánh trong nhà bà.[a]
  to: Hãy gửi lời chào đến các anh chị em ở Lao-đi-xê, Nympha và hội thánh tại nhà của Nympha.[a]
  rationale: 'Bản sửa giữ bản văn SBLGNT: Nympha là nữ và hội thánh ở nhà của người này. Việc lặp lại tên Nympha thay cho “bà” tránh đưa vào bản dịch hàm ý về tuổi tác, đồng thời chú thích trình bày đầy đủ các biến thể về tên/đại từ.'
