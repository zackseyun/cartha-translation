    issue: Từ “bà” trong “nhà bà”
    rationale: “Bà” có thể hàm ý tuổi tác hoặc tôn xưng mà αὐτῆς chỉ đánh dấu giống cái, không nói gì về tuổi hay địa vị của Nympha.
  - severity: low
    issue: Chú thích về cách đọc số nhiều chưa nêu rõ tên đi kèm
    rationale: Cụm trích “trong nhà họ” có thể làm người đọc không rõ cách đọc này liên hệ với Nympha trong bản chính; nêu đầy đủ cụm thay thế sẽ minh bạch hơn.
