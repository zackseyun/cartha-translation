id: COL.4.15
reference: Colossians 4:15
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀσπάσασθε τοὺς ἐν Λαοδικείᾳ ἀδελφοὺς καὶ ⸂Νύμφαν καὶ τὴν κατ’ οἶκον αὐτῆς⸃ ἐκκλησίαν.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/015.yaml
  text: Greet the brothers in Laodicea[a], and Nympha and the church in her house.
translation:
  language: vi
  text: Hãy gửi lời chào đến các anh chị em ở Lao-đi-xê, Nympha và hội thánh tại nhà của Nympha.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Một số thủ bản hoặc cách đọc ủng hộ “Nymphas và hội thánh tại nhà của ông”; những bản khác ủng hộ “Nympha và hội thánh tại nhà của họ”.
    reason: textual_variant
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: Hãy gửi lời chào đến
  rationale: Mệnh lệnh aorist ngôi thứ hai số nhiều, truyền đạt yêu cầu chào thăm; cách diễn đạt này tự nhiên trong tiếng Việt hiện đại và giữ nguyên lực mệnh lệnh.
- source_word: τοὺς ἐν Λαοδικείᾳ ἀδελφοὺς
  choice: các anh chị em ở Lao-đi-xê
  rationale: ἀδελφοὺς có hình thức giống đực số nhiều nhưng trong cách dùng của Phao-lô thường chỉ toàn thể các tín hữu, gồm cả nam lẫn nữ; “các anh chị em” truyền đạt chính xác nghĩa bao hàm trong tiếng Việt tự nhiên.
- source_word: Νύμφαν
  choice: Nympha
  rationale: Bản SBLGNT in Νύμφαν, thường được hiểu là đối cách của tên nữ Nympha; dị bản hoặc cách hiểu Nymphas được ghi ở chú thích.
- source_word: τὴν κατ’ οἶκον αὐτῆς ἐκκλησίαν
  choice: hội thánh trong nhà bà
  rationale: Thành ngữ κατ’ οἶκον chỉ cộng đồng hội họp trong một tư gia. “Trong nhà bà” giữ sắc thái định vị và phản ánh đại từ giống cái αὐτῆς mà không thêm động từ giải thích.
- source_word: ἐκκλησίαν
  choice: hội thánh
  rationale: Trong thư Phao-lô, từ này chỉ cộng đồng tín hữu; “hội thánh” là cách gọi quen thuộc, trang trọng và phù hợp ngữ cảnh.
theological_decisions:
- issue: Giới tính của Νύμφαν và đại từ sở hữu tương ứng
  choice: Nympha … hội thánh trong nhà bà
  alternative: Nymphas … hội thánh trong nhà ông; hoặc Nympha … hội thánh trong nhà họ
  rationale: Bản văn SBLGNT có αὐτῆς, giống cái số ít, nên bản chính theo cách hiểu trực tiếp là Nympha và “nhà bà”. Các cách đọc giống đực và số nhiều có chứng cứ thủ bản nên được bảo tồn trong chú thích, không bị âm thầm loại bỏ.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “các anh chị em” để thể hiện nghĩa bao hàm của ἀδελφοὺς trong ngữ cảnh cộng đồng tín hữu; giữ tên Nympha theo dạng quốc tế và ghi rõ dị bản.
