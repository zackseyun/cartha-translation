review_pass:
  verdict: revise
  source_fidelity: Bản chính theo đúng mệnh lệnh số nhiều ἀσπάσασθε, địa điểm Lao-đi-xê, tên Nympha theo bản SBLGNT, và đại từ giống cái số ít αὐτῆς. Tuy nhiên, “bà” thêm một sắc thái tuổi tác/tôn xưng không có trong tiếng Hy Lạp. Dùng lại tên riêng trong cụm sở hữu chuyển tải rõ quan hệ “nhà của bà ấy” mà không thêm sắc thái này.
  naturalness: Câu được chỉnh nhẹ để liệt kê các đối tượng chào thăm rõ ràng và dùng cấu trúc sở hữu tự nhiên, trung tính về tuổi tác trong tiếng Việt hiện đại.
  terminology: “Các anh chị em” phù hợp cách chỉ cộng đồng tín hữu trong ngữ cảnh Phao-lô; “hội thánh” là thuật ngữ chuẩn. Chú thích được làm rõ để biến thể số nhiều không bị hiểu lầm là chỉ đổi đại từ tách rời tên Nympha.
  issues:
