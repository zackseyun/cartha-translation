id: COL.4.12
reference: Colossians 4:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀσπάζεται ὑμᾶς Ἐπαφρᾶς ὁ ἐξ ὑμῶν, δοῦλος ⸀Χριστοῦ, πάντοτε ἀγωνιζόμενος ὑπὲρ ὑμῶν ἐν ταῖς προσευχαῖς, ἵνα ⸀σταθῆτε τέλειοι καὶ ⸀πεπληροφορημένοι ἐν παντὶ θελήματι τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/012.yaml
  text: Epaphras[a], who is one of you, greets you—a servant of Messiah, always striving for you in his prayers[b], so that you may stand mature and fully assured in all the will of God.
translation:
  language: vi
  text: Ê-pháp-ra, một người trong anh chị em, gửi lời chào anh chị em—là một nô lệ của Đấng Mê-si[a], luôn hết sức tranh đấu cho anh chị em trong các lời cầu nguyện của mình, để anh chị em có thể đứng, trưởng thành và hoàn toàn xác tín[b] trong mọi điều Đức Chúa Trời muốn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “Đấng Christ.” Từ Hy Lạp Χριστός là một tước hiệu có nghĩa là “Đấng Mê-si”, tức Đấng được xức dầu.
    reason: alternative_rendering
  - marker: b
    text: “Hoàn toàn xác tín” cũng có thể hiểu là “được thiết lập hoàn toàn vững vàng.” Từ Hy Lạp có thể chỉ trạng thái tin chắc trọn vẹn hoặc trạng thái đã trở nên vững vàng.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπάζεται
  choice: gửi lời chào
  rationale: Diễn đạt tự nhiên nghĩa thư tín thông thường của động từ này.
- source_word: ὁ ἐξ ὑμῶν
  choice: một người trong anh chị em
  rationale: Cho biết Ê-pháp-ra thuộc chính cộng đồng Cô-lô-se, đồng thời tránh cách nói cứng 'từ giữa anh chị em'.
- source_word: δοῦλος
  choice: nô lệ
  rationale: Giữ sắc thái mạnh về sự thuộc về và quy phục hoàn toàn, thay vì làm nhẹ thành 'đầy tớ'.
- source_word: Χριστοῦ
  choice: Đấng Mê-si
  rationale: Dịch ý nghĩa tước hiệu Χριστός và không thêm tên 'Giê-su', vì bản Hy Lạp tại đây chỉ có Χριστοῦ.
- source_word: ἀγωνιζόμενος
  choice: hết sức tranh đấu
  rationale: Giữ sức nặng của hình ảnh nỗ lực, vật lộn mãnh liệt, nhưng vẫn tự nhiên trong ngữ cảnh cầu nguyện.
- source_word: ἐν ταῖς προσευχαῖς
  choice: trong những lời cầu nguyện
  rationale: Giữ dạng số nhiều, gợi những lần cầu nguyện và sự chuyển cầu liên tục của Ê-pháp-ra.
- source_word: ἵνα σταθῆτε
  choice: để anh chị em có thể đứng vững
  rationale: Giữ hình ảnh 'đứng' và diễn đạt hàm ý kiên định tự nhiên trong tiếng Việt.
- source_word: τέλειοι
  choice: trưởng thành
  rationale: Trong văn mạch Phao-lô, từ này phù hợp với sự trưởng thành, toàn vẹn hơn là sự hoàn hảo tuyệt đối không phạm tội.
- source_word: πεπληροφορημένοι
  choice: hoàn toàn xác tín
  rationale: Diễn đạt trạng thái tin chắc trọn vẹn; chú thích bảo lưu khả năng hiểu là được thiết lập vững vàng.
- source_word: ἐν παντὶ θελήματι τοῦ θεοῦ
  choice: trong mọi điều Đức Chúa Trời muốn
  rationale: Cách nói tự nhiên, dễ hiểu, bao quát toàn bộ ý muốn của Đức Chúa Trời mà không xác định quá mức quan hệ của giới từ ἐν.
theological_decisions:
- issue: Cách dịch Χριστοῦ trong δοῦλος Χριστοῦ
  choice: Đấng Mê-si
  alternative: Đấng Christ
  rationale: Bản chính giữ ý nghĩa tước hiệu của Χριστός; không thêm 'Giê-su' vì tên ấy không có trong câu này. Chú thích cung cấp cách gọi truyền thống quen thuộc.
- issue: Cách dịch δοῦλος
  choice: nô lệ
  alternative: đầy tớ
  rationale: Trong công thức chỉ căn tính và lòng trung thành tôn giáo, 'nô lệ' bảo toàn ý thuộc quyền sở hữu và quy phục hoàn toàn vốn mạnh hơn 'đầy tớ'.
- issue: Nghĩa của πεπληροφορημένοι
  choice: hoàn toàn xác tín
  alternative: được thiết lập hoàn toàn vững vàng
  rationale: Bản chính chọn nghĩa liên quan đến sự tin chắc, nhưng chú thích bảo lưu nghĩa trạng thái 'được làm cho vững vàng' vì từ Hy Lạp cho phép cách hiểu này.
- issue: Quan hệ cú pháp của τέλειοι và πεπληροφορημένοι với σταθῆτε
  choice: đứng vững, trưởng thành và hoàn toàn xác tín
  alternative: đứng vững như những người trưởng thành và hoàn toàn xác tín
  rationale: Cách dịch chính tự nhiên trong tiếng Việt và vẫn giữ cả hai phẩm chất gắn với việc đứng; phương án khác làm rõ hơn quan hệ vị ngữ nhưng có phần diễn giải.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” cho đại từ số nhiều ὑμᾶς; phiên âm tên riêng theo lối quen thuộc “Ê-pháp-ra”; giữ “nô lệ” vì sắc thái thần học mạnh của δοῦλος; dùng câu thứ hai để tránh một câu tiếng Việt quá dài.
