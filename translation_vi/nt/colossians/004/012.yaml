  source_fidelity: 'Bản dịch truyền đạt đúng các thành tố chính: Ê-pháp-ra thuộc cộng đồng người nhận, là nô lệ của Đấng Mê-si, kiên trì tranh đấu trong sự cầu nguyện cho họ, với mục đích họ đứng, trưởng thành và hoàn toàn xác tín. Tuy nhiên, “đứng vững” diễn giải thêm sắc thái kiên định vào σταθῆτε, trong khi “đứng” bảo lưu tốt hơn hình ảnh và độ mở của động từ. Cụm “trong những lời cầu nguyện” cũng kém tự nhiên hơn cách nói sở hữu rõ ràng trong tiếng Việt.'
