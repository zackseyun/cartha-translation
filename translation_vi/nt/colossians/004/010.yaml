    rationale: Cách gọi này không sai, nhưng “ông ấy/người ấy” phù hợp hơn với văn phong thư tín Kinh Thánh trang trọng vừa phải. Đại từ “người ấy” trong ngoặc cũng làm rõ Mác là đối tượng của các chỉ dẫn và của việc đón tiếp.
  - severity: low
    issue: Diễn đạt chú thích a
    rationale: “Bản dịch cổ” có thể gợi ý mọi bản dịch thời xưa và không phản ánh chính xác ghi chú đối chiếu tiếng Anh, vốn nói đến một số bản dịch tiếng Anh cũ. Sửa lại để nêu đây là truyền thống dịch thuật, không phải một nghĩa cạnh tranh ngang hàng trong tiếng Hy Lạp Koinē.
