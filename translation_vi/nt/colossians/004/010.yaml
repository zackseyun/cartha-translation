  to: 'A-ri-tạc, người bạn tù của tôi, gửi lời chào anh chị em; Mác, anh em họ của Ba-na-ba[a] (về người này, anh chị em đã nhận được chỉ dẫn: nếu ông ấy đến với anh chị em, hãy đón tiếp ông ấy[b]), cũng gửi lời chào.'
  rationale: Bản sửa giữ nguyên mọi ý nghĩa của nguyên văn, nhưng phục hồi vị trí của lời chỉ dẫn về Mác trong ngoặc ngay sau cụm xác định quan hệ của ông với Ba-na-ba. Đồng thời, bản sửa điều chỉnh đại từ và chú thích để văn phong nhất quán, tự nhiên, và chính xác hơn về truyền thống dịch thuật.
