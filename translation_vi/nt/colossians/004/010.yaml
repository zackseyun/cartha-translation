reference: Colossians 4:10
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἀσπάζεται ὑμᾶς Ἀρίσταρχος ὁ συναιχμάλωτός μου, καὶ Μᾶρκος ὁ ἀνεψιὸς Βαρναβᾶ (περὶ οὗ ἐλάβετε ἐντολάς, ἐὰν ἔλθῃ πρὸς ὑμᾶς δέξασθε αὐτόν),
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/010.yaml
  text: Aristarchus[a], my fellow prisoner, greets you, and Mark, the cousin of Barnabas (about whom you received instructions—if he comes to you, welcome him)[b],
translation:
  language: vi
  text: 'A-ri-tạc, người bạn tù của tôi, gửi lời chào anh chị em; Mác, anh em họ của Ba-na-ba[a] (về người này, anh chị em đã nhận được chỉ dẫn: nếu ông ấy đến với anh chị em, hãy đón tiếp ông ấy[b]), cũng gửi lời chào.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Một số bản dịch tiếng Anh cũ dịch là “cháu của Ba-na-ba,” nhưng từ Hy Lạp ở đây chính xác hơn là “anh em họ.”
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “hãy tiếp nhận ông ấy.” Trong bối cảnh này, động từ Hy Lạp có thể chỉ việc tiếp nhận và tiếp đãi một người.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀσπάζεται
  choice: gửi lời chào
  rationale: Đây là cách diễn đạt tự nhiên trong thư từ tiếng Việt, truyền đạt đúng chức năng của động từ ở thì hiện tại mà không thêm sắc thái “nồng nhiệt” vốn không được nói rõ.
- source_word: συναιχμάλωτός
  choice: người bạn tù
  rationale: Cách dịch này tự nhiên và minh bạch trong tiếng Việt, giữ nguyên ý người cùng chịu cảnh tù đày với Phao-lô mà không tự ý thêm “trong Chúa” hoặc quyết định đây là nghĩa bóng.
- source_word: ἀνεψιὸς
  choice: anh em họ
  rationale: Trong tiếng Hy Lạp Koinē, từ này chỉ người anh/chị/em họ. “Anh em họ” tránh phải đoán Mác lớn hay nhỏ tuổi hơn Ba-na-ba và chính xác hơn cách dịch truyền thống là “cháu”.
- source_word: ἐλάβετε ἐντολάς
  choice: đã nhận được chỉ dẫn
  rationale: “Chỉ dẫn” phù hợp với bối cảnh đón tiếp một người đang đi đường, đồng thời vẫn giữ sắc thái có thẩm quyền của ἐντολή mà không làm câu quá cứng như “mệnh lệnh”.
- source_word: ἐὰν ἔλθῃ πρὸς ὑμᾶς
  choice: nếu anh ấy đến với anh chị em
  rationale: Diễn đạt rõ điều kiện hướng về tương lai của ἐάν với động từ giả định, bằng tiếng Việt hiện đại và tự nhiên.
- source_word: δέξασθε αὐτόν
  choice: hãy đón tiếp anh ấy
  rationale: Trong bối cảnh tiếp nhận một người đến thăm, “đón tiếp” thể hiện rõ ý tiếp nhận với lòng hiếu khách hơn “tiếp nhận”, nhưng không thêm mức độ tình cảm không có trong nguyên văn.
theological_decisions:
- issue: Bản chất mối liên hệ giữa Phao-lô và A-ri-tạc trong συναιχμάλωτός μου
  choice: Dịch là “người bạn tù của tôi”, không xác định việc bị tù là theo nghĩa đen hay nghĩa bóng.
  alternative: “người cùng bị giam với tôi trong Chúa” hoặc “người cùng cộng tác với tôi giữa cảnh gian khổ”
  rationale: Nguyên văn chỉ dùng danh từ chỉ người cùng bị bắt hoặc bị giam. Bản dịch giữ nguyên sức căng của cách nói này và không thêm một lời giải thích thần học hay lịch sử mà câu Kinh Thánh không nêu.
translation_notes:
  register: 'Văn phong trang trọng vừa phải, sáng rõ và tự nhiên đối với độc giả Việt Nam hiện đại. Dùng “anh chị em” cho đại từ số nhiều ὑμᾶς trong thư gửi cộng đồng tín hữu; dùng tên riêng theo dạng phiên âm quen thuộc: A-ri-tạc, Mác, Ba-na-ba. Giữ dấu ngoặc của nguyên văn để tách lời chỉ dẫn liên quan đến Mác.'
