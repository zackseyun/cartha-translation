  naturalness: Câu văn nhìn chung tự nhiên và trang trọng. «Hãy kiên trì cầu nguyện» là cách diễn đạt hiện đại, rõ nghĩa hơn cho lời kêu gọi duy trì đều đặn; «trong đó» tránh lặp «sự cầu nguyện» mà quy chiếu vẫn rõ ràng.
  terminology: «Cầu nguyện», «tỉnh thức», và «lòng tạ ơn» phù hợp với cách dùng Kinh Thánh tiếng Việt hiện đại. Không có vấn đề về tên riêng hay thuật ngữ thần học.
