  text: Hãy kiên trì cầu nguyện, tỉnh thức trong đó với lòng tạ ơn.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τῇ προσευχῇ
  choice: cầu nguyện
  rationale: Mạo từ cùng danh từ ở cách tặng được dùng theo lối thành ngữ, chỉ việc cầu nguyện như một thực hành, không nhất thiết là một lời cầu nguyện cụ thể.
- source_word: προσκαρτερεῖτε
  choice: Hãy chuyên tâm
  rationale: Mệnh lệnh hiện tại diễn tả sự bền bỉ và gắn bó liên tục. “Hãy chuyên tâm” tự nhiên trong tiếng Việt và giữ được cả ý tận tụy lẫn kiên trì.
- source_word: γρηγοροῦντες
  choice: tỉnh thức
  rationale: 'Phân từ này nêu cách thức đi kèm mệnh lệnh cầu nguyện: luôn cảnh giác và chú tâm, chứ không đơn thuần là không ngủ.'
- source_word: ἐν αὐτῇ
  choice: trong sự cầu nguyện
  rationale: Đại từ giống cái số ít tự nhiên quy chiếu về προσευχῇ. Lặp lại “sự cầu nguyện” giúp câu tiếng Việt rõ ràng hơn so với “trong đó”.
- source_word: ἐν εὐχαριστίᾳ
  choice: với lòng tạ ơn
  rationale: Cụm giới từ diễn tả thái độ hoặc hoàn cảnh đi kèm sự tỉnh thức khi cầu nguyện. “Với lòng tạ ơn” là cách nói tự nhiên, trang trọng và sát nghĩa.
