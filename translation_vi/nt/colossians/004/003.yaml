    issue: “lời Ngài” thêm nội dung không có trong nguyên văn
    rationale: τοῦ λόγου là “của lời/sứ điệp,” không nêu đại từ sở hữu quy chiếu về Đức Chúa Trời. Việc thêm “Ngài” thu hẹp hoặc xác định quan hệ mà bản văn không nói rõ.
  - severity: low
    issue: “rao truyền” thu hẹp nghĩa của λαλῆσαι
    rationale: λαλέω có nghĩa cơ bản là “nói”; trong ngữ cảnh có thể hàm ý công bố, nhưng bản dịch chính nên tránh áp một sắc thái kỹ thuật mạnh hơn động từ.
  - severity: low
    issue: “về Đấng Mê-si” diễn giải quan hệ sở hữu cách
    rationale: Cách này có thể chấp nhận được, nhưng “của Đấng Mê-si” bảo lưu tốt hơn tính cô đọng và độ mở của τοῦ Χριστοῦ.
