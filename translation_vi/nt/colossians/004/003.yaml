id: COL.4.3
reference: Colossians 4:3
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: προσευχόμενοι ἅμα καὶ περὶ ἡμῶν, ἵνα ὁ θεὸς ἀνοίξῃ ἡμῖν θύραν τοῦ λόγου, λαλῆσαι τὸ μυστήριον τοῦ Χριστοῦ, δι’ ὃ καὶ δέδεμαι,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/003.yaml
  text: while also praying for us[a], that God may open to us a door for the word, to speak the mystery of Messiah, because of which I am also bound[d][c][b],
translation:
  language: vi
  text: Đồng thời cũng cầu nguyện cho chúng tôi, xin Đức Chúa Trời mở cho chúng tôi một cánh cửa để công bố lời, để chúng tôi nói về mầu nhiệm của Đấng Mê-si, vì điều ấy mà tôi cũng đang bị xiềng xích.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσευχόμενοι ἅμα καὶ περὶ ἡμῶν
  choice: đồng thời cũng cầu nguyện cho chúng tôi
  rationale: Giữ liên kết phân từ với lời khuyên cầu nguyện ở câu trước, đồng thời diễn đạt cả ý đồng thời của ἅμα và ý bổ sung của καί bằng tiếng Việt tự nhiên.
- source_word: ἵνα ὁ θεὸς ἀνοίξῃ ἡμῖν
  choice: xin Đức Chúa Trời mở cho chúng tôi
  rationale: ἵνα với động từ giả định nêu nội dung/mục đích của lời cầu nguyện; “xin” truyền đạt tự nhiên sắc thái khẩn nguyện.
- source_word: θύραν τοῦ λόγου
  choice: một cánh cửa để rao truyền lời Ngài
  rationale: Giữ hình ảnh ẩn dụ “cánh cửa”, đồng thời làm rõ quan hệ hàm ý giữa cánh cửa và việc công bố λόγος. “Ngài” được thêm để người đọc hiểu đây là sứ điệp của Đức Chúa Trời, không phải lời nói nói chung.
- source_word: λαλῆσαι
  choice: hầu chúng tôi nói ra
  rationale: Diễn đạt động từ nguyên mẫu chỉ mục đích, giữ nghĩa cơ bản của λαλέω là nói, không thu hẹp thành một hoạt động giảng thuyết chuyên biệt.
- source_word: τὸ μυστήριον τοῦ Χριστοῦ
  choice: sự mầu nhiệm về Đấng Mê-si
  rationale: “Sự mầu nhiệm” giữ cách dùng đặc trưng của Phao-lô về chương trình thần thượng từng được che giấu nhưng nay được bày tỏ. Cách hiểu sở hữu cách là “về Đấng Mê-si” phù hợp với nội dung được công bố; Χριστός được giữ như tước hiệu.
- source_word: δι’ ὃ καὶ δέδεμαι
  choice: là điều khiến tôi cũng bị xiềng xích
  rationale: διά với đối cách chỉ nguyên nhân; thể hoàn thành bị động δέδεμαι diễn tả tình trạng hiện tại do việc bị trói/bắt giữ trước đó. “Bị xiềng xích” làm rõ bối cảnh tù đày mà vẫn giữ hình ảnh của động từ.
theological_decisions:
- issue: Cách dịch Χριστοῦ
  choice: Đấng Mê-si
  alternative: Đấng Christ
  rationale: Trong cụm này Χριστός mang chức năng tước hiệu và là nội dung của sự mầu nhiệm được công bố; “Đấng Mê-si” bảo tồn ý nghĩa tước hiệu.
- issue: Quan hệ sở hữu cách trong τοῦ Χριστοῦ
  choice: về Đấng Mê-si
  alternative: của Đấng Mê-si
  rationale: Sở hữu cách có thể chỉ nội dung hoặc mối liên hệ. “Về” tự nhiên hơn trong tiếng Việt khi nói đến sự mầu nhiệm được truyền đạt, nhưng không loại trừ các sắc thái liên hệ khác.
- issue: Hình ảnh θύραν τοῦ λόγου
  choice: một cánh cửa để rao truyền lời Ngài
  alternative: một cánh cửa cho lời Ngài
  rationale: Giữ nguyên ẩn dụ “cánh cửa” nhưng diễn đạt công dụng theo tiếng Việt tự nhiên. Bản thay thế sát cấu trúc Hy Lạp hơn nhưng dễ gây khó hiểu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Câu được nối với lời khuyên cầu nguyện ở câu trước; dùng “Đức Chúa Trời” và “Đấng Mê-si” theo lối gọi quen thuộc trong văn Kinh Thánh tiếng Việt. Dấu phẩy cuối câu nguồn được chuyển thành dấu chấm vì đơn vị được yêu cầu là một câu riêng.
