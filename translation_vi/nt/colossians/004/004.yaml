review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng cấu trúc mục đích của ἵνα, đại từ αὐτό quy chiếu về “mầu nhiệm” ở câu trước, và sắc thái cần thiết/bổn phận của δεῖ. Tuy nhiên, “bày tỏ điều ấy rõ ràng” hơi nặng và kém gọn so với lực nghĩa “make it clear” của φανερώσω trong ngữ cảnh.
  naturalness: “Như tôi phải nói” có thể hiểu được, nhưng “theo cách tôi phải nói” diễn đạt rõ hơn chức năng cách thức/chuẩn mực của ὡς và tự nhiên hơn trong tiếng Việt hiện đại. “Làm sáng tỏ” là cách nói gọn, tự nhiên cho việc làm cho điều gì trở nên rõ ràng.
  terminology: “Điều ấy” giữ đúng tính chất đại từ của αὐτό và không đưa “mầu nhiệm” từ câu trước vào chính văn. Không có vấn đề về thuật ngữ thần học hay tên riêng trong câu này.
