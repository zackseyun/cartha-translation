  - severity: low
    issue: “Như tôi phải nói” chưa biểu đạt minh bạch quan hệ cách thức của ὡς.
    rationale: “Theo cách tôi phải nói” cho thấy rõ Phao-lô xin được làm sáng tỏ điều ấy theo cách ông phải nói, phù hợp với ὡς δεῖ με λαλῆσαι.
