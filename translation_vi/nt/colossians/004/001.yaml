  source_fidelity: Bản dịch phản ánh đúng đối tượng là những người làm chủ, các nô lệ, mệnh lệnh phải dành sự đối đãi đúng đắn/công bằng, và lý do là họ cũng có một Chúa ở trên trời. Tuy nhiên, τὸ δίκαιον và τὴν ἰσότητα là hai bổ ngữ được danh từ hóa của παρέχεσθε; cách diễn đạt hiện tại “đối xử ... một cách công chính và công bằng” chuyển chúng thành các trạng ngữ chỉ cách thức. Đây là cách hiểu khả dĩ, nhưng có thể giữ cấu trúc và sắc thái của nguyên văn rõ hơn trong tiếng Việt.
  naturalness: “Một cách công chính và công bằng” hơi nặng và lặp cấu trúc trạng ngữ. “Hãy dành cho ... những gì công chính và công bằng” tự nhiên, rõ nghĩa, và vẫn giữ được tính song đôi của cụm Hy Lạp.
  terminology: “Những người làm chủ,” và “nô lệ” phù hợp bối cảnh κύριοι/δοῦλοι, không làm nhẹ thân phận nô lệ. “Chúa” trong vế sau giữ được trọng lượng của κύριον và sự đối chiếu với các chủ nhân trần gian. Chú thích cần giữ khả năng đáng kể “bình đẳng” của ἰσότητα.
