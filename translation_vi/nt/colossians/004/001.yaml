revisions:
- from: Những người làm chủ, hãy đối xử với các nô lệ của mình một cách công chính và công bằng,[a] vì biết rằng chính anh em cũng có một Chúa ở trên trời.
  to: Những người làm chủ, hãy dành cho các nô lệ của mình những gì công chính và công bằng,[a] vì biết rằng chính anh em cũng có một Chúa ở trên trời.
  rationale: Sửa nhẹ để phản ánh trực tiếp hơn hai bổ ngữ danh từ hóa của động từ παρέχεσθε, đồng thời duy trì nghĩa ngữ cảnh của ἰσότης là sự công bằng/đối đãi công bằng. Chú thích bảo lưu nghĩa từ vựng “bình đẳng” mà không áp đặt một diễn giải hẹp trong bản văn chính.
  reviewer_model: gpt-5.6-terra
