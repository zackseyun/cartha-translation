id: COL.4.1
reference: Colossians 4:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οἱ κύριοι, τὸ δίκαιον καὶ τὴν ἰσότητα τοῖς δούλοις παρέχεσθε, εἰδότες ὅτι καὶ ὑμεῖς ἔχετε κύριον ἐν ⸀οὐρανῷ.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/001.yaml
  text: Masters[a], provide your servants with what is right and fair, knowing that you also have a Lord in heaven.
translation:
  language: vi
  text: Những người làm chủ, hãy dành cho các nô lệ của mình những gì công chính và công bằng,[a] vì biết rằng chính anh em cũng có một Chúa ở trên trời.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “điều công chính và sự bình đẳng.” Từ Hy Lạp được dịch là “công bằng” cũng có thể mang nghĩa “bình đẳng” hoặc “đối đãi tương xứng.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ κύριοι
  choice: những người làm chủ
  rationale: Trong quy tắc gia đình này, κύριοι chỉ những người có quyền làm chủ đối với các nô lệ. Cách dịch này tự nhiên hơn “các chúa” và không thu hẹp nghĩa như “các chủ nô”.
- source_word: τὸ δίκαιον
  choice: một cách công chính
  rationale: Tính từ được danh từ hóa chỉ điều đúng đắn, chính đáng; trong tiếng Việt, cụm này kết hợp tự nhiên với “công bằng” để diễn tả cách đối xử.
- source_word: τὴν ἰσότητα
  choice: công bằng
  rationale: ἰσότης có thể chỉ sự bình đẳng, công bằng hoặc sự đối đãi tương xứng. “Công bằng” phù hợp ngữ cảnh và dễ hiểu, còn khả năng dịch “bình đẳng” được giữ trong chú thích.
- source_word: τοῖς δούλοις
  choice: các nô lệ của mình
  rationale: Quan hệ lệ thuộc pháp lý-xã hội được nêu rõ bởi việc câu này trực tiếp nói với những người làm chủ; “nô lệ” không làm nhẹ đi thực trạng ấy như “đầy tớ” có thể làm.
- source_word: παρέχεσθε
  choice: hãy đối xử
  rationale: Động từ mang nghĩa cung cấp hoặc dành cho; với đối tượng là người và bổ ngữ chỉ chuẩn mực đạo đức, “hãy đối xử… một cách” là tiếng Việt tự nhiên và truyền đạt đúng mệnh lệnh.
- source_word: εἰδότες
  choice: vì biết rằng
  rationale: Phân từ nêu nhận thức làm cơ sở cho mệnh lệnh. “Vì biết rằng” diễn đạt rõ quan hệ lý do vốn có thể hàm chứa trong cấu trúc Hy Lạp.
- source_word: καὶ ὑμεῖς
  choice: chính anh em cũng
  rationale: “Cũng” giữ ý rằng người làm chủ trên đất vẫn ở dưới thẩm quyền, còn “chính” chuyển tải sắc thái nhấn mạnh của đại từ ὑμεῖς.
- source_word: κύριον
  choice: một Chúa
  rationale: “Chúa” giữ trọng lượng thần học của κύριος và tạo sự phân biệt thích hợp với những người làm chủ trên đất; mạo từ bất định không có trong tiếng Hy Lạp nhưng “một Chúa” diễn đạt tự nhiên ý họ cũng có Đấng làm Chủ.
- source_word: ἐν οὐρανῷ
  choice: ở trên trời
  rationale: Đây là cách diễn đạt tiếng Việt thông dụng, rõ ràng cho cụm giới từ chỉ nơi chốn.
theological_decisions:
- issue: Cách dịch δοῦλοι trong quy tắc gia đình
  choice: nô lệ
  alternative: đầy tớ; tôi tớ
  rationale: Bối cảnh nêu trực tiếp quan hệ giữa κύριοι và δοῦλοι, nên thân phận bị sở hữu hoặc lệ thuộc là điểm nổi bật. “Nô lệ” phản ánh trung thực thực tại xã hội mà không làm nhẹ nó.
- issue: Phạm vi nghĩa của ἰσότητα
  choice: công bằng
  alternative: bình đẳng; bình quyền; đối đãi tương xứng
  rationale: Từ này có thể nói đến bình đẳng hoặc sự đối đãi công bằng. Bản văn không tự giải quyết hoàn toàn sắc thái ấy; vì vậy bản chính dùng cách nói tự nhiên theo ngữ cảnh và chú thích giữ lại nghĩa “bình đẳng” đáng lưu ý.
- issue: Sự tương phản giữa κύριοι và κύριον
  choice: những người làm chủ … một Chúa
  alternative: các chủ … một Chủ
  rationale: Cách dịch này vừa thể hiện sự lặp từ có chủ ý ở mức ý nghĩa, vừa tránh gọi con người là “chúa” theo cách dễ gây hiểu lầm. “Chúa” ở vế sau giữ sắc thái tôn kính và thần học.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh em” để chỉ tập thể người được trực tiếp khuyên bảo, không nhằm xác định giới tính của toàn bộ độc giả. Cấu trúc “đối xử… một cách công chính và công bằng” ưu tiên tiếng Việt tự nhiên, đồng thời chú thích bảo tồn khả năng dịch sát danh từ của nguyên văn.
