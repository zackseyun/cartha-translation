  text: Ἐν σοφίᾳ περιπατεῖτε πρὸς τοὺς ἔξω, τὸν καιρὸν ἐξαγοραζόμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/005.yaml
  text: Walk in wisdom toward outsiders[b][a], making the most of the time.
translation:
  language: vi
  text: Hãy cư xử khôn ngoan đối với những người bên ngoài[a], tận dụng thời cơ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Những người bên ngoài” là những người không thuộc cộng đồng các tín hữu.
    reason: lexical_alternative
  - marker: b
    text: 'Dịch sát: “chuộc lấy thời cơ”; ý nói tận dụng tối đa dịp thuận tiện.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν σοφίᾳ
  choice: khôn ngoan
  rationale: Diễn đạt tự nhiên cách thức sống theo sự khôn ngoan, đồng thời giữ trọng lượng đạo đức của danh từ σοφία trong cụm “cư xử khôn ngoan”.
- source_word: περιπατεῖτε
  choice: hãy cư xử
  rationale: Động từ được dùng theo nghĩa ẩn dụ về nếp sống hay cách hành xử. “Cư xử” đặc biệt phù hợp với hướng quan hệ πρὸς τοὺς ἔξω và tự nhiên hơn “bước đi” trong tiếng Việt hiện đại.
- source_word: πρὸς τοὺς ἔξω
  choice: với những người ở bên ngoài
  rationale: πρός chỉ hướng quan hệ trong cách hành xử; “những người ở bên ngoài” giữ hình ảnh và sự quy chiếu của nguyên ngữ mà không dùng nhãn gọi miệt thị.
- source_word: τὸν καιρόν
  choice: mọi cơ hội
  rationale: Trong ngữ cảnh này, καιρός là thời điểm hoặc dịp thuận tiện, không phải thời gian nói chung. “Mọi cơ hội” truyền đạt rõ sắc thái ấy trong tiếng Việt.
- source_word: ἐξαγοραζόμενοι
  choice: tận dụng
  rationale: Phân từ mang nghĩa thành ngữ là nắm lấy và sử dụng đầy đủ dịp thuận tiện; “tận dụng” rõ nghĩa, tự nhiên và không gợi sai sang ý niệm cứu chuộc.
theological_decisions:
- issue: Khả năng đọc ἐξαγοραζόμενοι theo nghĩa cứu chuộc thần học
  choice: Lời khuyên phải tận dụng mọi cơ hội khi cư xử với người ngoài cộng đồng đức tin
  alternative: Dịch sát là “chuộc lại thời gian”
  rationale: Trong kết hợp với καιρός, động từ nói đến việc nắm lấy cơ hội chứ không nói về sự chuộc tội hay cứu chuộc. Chú thích bảo lưu hình ảnh sát chữ mà không đưa thêm một khẳng định giáo lý ngoài ngữ cảnh.
- issue: Phạm vi của τοὺς ἔξω
  choice: Những người ở ngoài cộng đồng các tín hữu
  alternative: Người ngoài nói chung, không xác định quan hệ với cộng đồng nào
  rationale: Cách nói này theo lối dùng xã hội của cụm Hy Lạp, nhưng bản chính vẫn giữ cách diễn đạt “ở bên ngoài” và chú thích mới giải thích quy chiếu.
translation_notes:
  register: Văn phong khuyên bảo trang trọng nhưng dễ hiểu. Dùng “cư xử khôn ngoan” thay cho “bước đi trong sự khôn ngoan” để diễn đạt tự nhiên nghĩa ẩn dụ của περιπατεῖτε trong tiếng Việt hiện đại; giữ “những người ở bên ngoài” nhằm bảo tồn hình ảnh nguyên ngữ và giải thích trong chú thích.
