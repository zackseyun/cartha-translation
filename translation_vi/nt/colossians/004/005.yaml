review_pass:
  verdict: revise
  source_fidelity: Bản dịch truyền đạt đúng lời khuyên về cách ứng xử khôn ngoan với những người ở ngoài cộng đồng và ý nghĩa thành ngữ của ἐξαγοραζόμενοι. Tuy nhiên, “mọi cơ hội” chuyển danh từ xác định số ít τὸν καιρόν thành ý khái quát số nhiều (“every opportunity”), làm rộng nghĩa hơn nguyên văn. “Thời cơ” giữ tốt sắc thái của καιρός là dịp/thời điểm thuận tiện.
  naturalness: “Hãy cư xử khôn ngoan đối với những người bên ngoài, tận dụng thời cơ” là tiếng Việt hiện đại, trang trọng và tự nhiên. “Đối với” diễn đạt rõ hướng quan hệ của πρός; bỏ từ “ở” trong bản chính giúp cụm chỉ người tự nhiên hơn mà vẫn giữ được ý nghĩa nhờ chú thích.
  terminology: “Cư xử khôn ngoan” chuyển tải cách dùng ẩn dụ của περιπατεῖτε phù hợp. “Những người bên ngoài” bảo lưu cách nói của nguyên ngữ; chú thích giải thích đây là những người ngoài cộng đồng tín hữu, không biến nó thành nhãn gọi miệt thị. “Tận dụng thời cơ” diễn đạt đúng ý thành ngữ của ἐξαγοραζόμενοι mà không áp ý nghĩa cứu chuộc thần học.
