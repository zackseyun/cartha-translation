id: COL.4.8
reference: Colossians 4:8
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὃν ἔπεμψα πρὸς ὑμᾶς εἰς αὐτὸ τοῦτο ἵνα ⸀γνῶτε τὰ περὶ ⸀ἡμῶν καὶ παρακαλέσῃ τὰς καρδίας ὑμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/008.yaml
  text: 'I sent him to you for this very purpose: that you may know how we are[a], and that he may encourage your hearts.'
translation:
  language: vi
  text: 'Tôi đã sai anh ấy đến với anh chị em chính vì mục đích này: để anh chị em biết tình hình của chúng tôi[a], và để anh ấy khích lệ lòng anh chị em.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Một số thủ bản chép: “để chúng tôi biết tình hình của anh chị em.”'
    reason: textual_variant
lexical_decisions:
- source_word: ὃν
  choice: anh ấy
  rationale: Đại từ quan hệ đối cách giống đực số ít chỉ Ti-chi-cơ ở câu trước; trong tiếng Việt, dùng đại từ hồi chỉ tự nhiên hơn là mô phỏng cấu trúc quan hệ của tiếng Hy Lạp.
- source_word: ἔπεμψα
  choice: Tôi đã sai
  rationale: Thì aorist được diễn đạt tự nhiên bằng hành động quá khứ đã xảy ra; “sai” phù hợp với việc giao cho Ti-chi-cơ một sứ mạng.
- source_word: πρὸς ὑμᾶς
  choice: đến với anh chị em
  rationale: Sau động từ sai phái, cụm này chỉ hướng đến những người nhận; cách diễn đạt này tự nhiên và mang sắc thái giao tiếp trực tiếp.
- source_word: εἰς αὐτὸ τοῦτο
  choice: chính vì mục đích này
  rationale: “Chính” thể hiện lực nhấn mạnh của αὐτὸ τοῦτο, còn “mục đích” làm rõ quan hệ mục đích với mệnh đề ἵνα tiếp theo.
- source_word: ἵνα γνῶτε
  choice: để anh chị em biết
  rationale: Giữ rõ ý nghĩa mục đích của ἵνα với động từ giả định, không thêm sắc thái vượt quá nguyên văn.
- source_word: τὰ περὶ ἡμῶν
  choice: tình hình của chúng tôi
  rationale: Thành ngữ Hy Lạp nói đến những điều liên quan đến Phao-lô và các bạn đồng hành; “tình hình” tự nhiên hơn bản dịch sát chữ nhưng vẫn giữ nội dung rộng.
- source_word: παρακαλέσῃ
  choice: khích lệ
  rationale: παρακαλέω có thể mang nghĩa khích lệ, an ủi hoặc khuyên nhủ; trong bối cảnh Ti-chi-cơ mang tin tức đến để củng cố cộng đồng, “khích lệ” giữ được độ rộng thích hợp.
- source_word: τὰς καρδίας ὑμῶν
  choice: lòng anh chị em
  rationale: “Lòng” là cách diễn đạt tiếng Việt tự nhiên cho καρδία khi chỉ đời sống nội tâm, đồng thời bảo tồn hình ảnh nhân học Kinh Thánh.
theological_decisions:
- issue: Dị bản về chủ thể và đối tượng của việc biết trong mệnh đề mục đích
  choice: 'Theo SBLGNT: “để anh chị em biết tình hình của chúng tôi.”'
  alternative: 'Một số thủ bản có ý: “để chúng tôi biết tình hình của anh chị em.”'
  rationale: Bản văn chính theo nguồn SBLGNT đã cung cấp. Dị bản đảo chiều việc trao đổi tin tức có ý nghĩa nên được ghi rõ trong chú thích mà không thay thế bản văn chính.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh chị em” cho đại từ số nhiều ὑμᾶς/ὑμῶν nhằm thể hiện cộng đồng người nhận và tránh hiểu là số ít; dùng “anh ấy” để hồi chỉ Ti-chi-cơ một cách tự nhiên.
