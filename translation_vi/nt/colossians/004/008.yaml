  source_fidelity: 'Bản dịch theo đúng bản văn SBLGNT: Tychicus được sai đến để người nhận biết tình hình của Phao-lô và những người cùng ông, và để ông khích lệ lòng họ. Cụm “chính vì mục đích này” phản ánh hợp lý lực nhấn của εἰς αὐτὸ τοῦτο; “tình hình của chúng tôi” diễn đạt tự nhiên τὰ περὶ ἡμῶν. Chú thích phản ánh đúng dị bản đảo chủ thể/đối tượng.'
