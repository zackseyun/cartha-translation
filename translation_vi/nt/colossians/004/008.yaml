  terminology: “Khích lệ” là lựa chọn phù hợp, không thu hẹp παρακαλέσῃ vào riêng nghĩa an ủi hoặc khuyên nhủ. “Lòng” bảo toàn cách nói nhân học quen thuộc tương ứng với καρδίας. Cách gọi “anh chị em” phù hợp với số nhiều và ngữ cảnh cộng đồng.
