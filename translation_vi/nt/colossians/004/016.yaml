id: COL.4.16
reference: Colossians 4:16
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ὅταν ἀναγνωσθῇ παρ’ ὑμῖν ἡ ἐπιστολή, ποιήσατε ἵνα καὶ ἐν τῇ ⸀Λαοδικέων ἐκκλησίᾳ ἀναγνωσθῇ, καὶ τὴν ἐκ Λαοδικείας ἵνα καὶ ὑμεῖς ἀναγνῶτε.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/016.yaml
  text: And when this letter has been read among you[a], see that it is also read in the church of the Laodiceans[b], and that you also read the one from Laodicea.
translation:
  language: vi
  text: Khi thư này được đọc[a] giữa anh chị em, hãy bảo đảm rằng thư ấy cũng được đọc tại hội thánh của người Lao-đi-xê, và anh chị em cũng hãy đọc thư từ Lao-đi-xê.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Trong bối cảnh hội thánh, động từ Hy Lạp này có thể hàm ý “được đọc công khai” hoặc “được đọc thành tiếng”.
    reason: lexical_alternative
  - marker: b
    text: Không rõ đây là thư nào. Cụm từ Hy Lạp có nghĩa đen là “thư từ Lao-đi-xê”; có thể chỉ một lá thư đang ở tại Lao-đi-xê, chứ không nhất thiết là thư ban đầu được gửi cho hội thánh tại đó.
    reason: cultural_note
lexical_decisions:
- source_word: ἀναγνωσθῇ / ἀναγνῶτε
  choice: được đọc / hãy đọc
  rationale: Động từ có nghĩa là “đọc” và trong bối cảnh hội thánh rất có thể chỉ việc đọc công khai. Bản văn chính giữ cách nói tự nhiên “đọc”, còn chú thích nêu sắc thái có thể có.
- source_word: παρ’ ὑμῖν
  choice: giữa anh chị em
  rationale: Cụm từ diễn tả việc lá thư được đọc trong cộng đồng tín hữu Cô-lô-se, không chỉ đơn thuần cho biết ai là người đọc.
- source_word: ἡ ἐπιστολή
  choice: thư này
  rationale: Mạo từ chỉ lá thư hiện đang được gửi cho tín hữu Cô-lô-se; “thư này” thể hiện rõ sở chỉ trong tiếng Việt hiện đại.
- source_word: ποιήσατε ἵνα
  choice: hãy lo sao cho
  rationale: Cách diễn đạt này truyền đạt mệnh lệnh phải bảo đảm một việc xảy ra, tự nhiên hơn lối dịch từng chữ “hãy làm để”.
- source_word: ἐν τῇ Λαοδικέων ἐκκλησίᾳ
  choice: trong hội thánh của người Lao-đi-xê
  rationale: 'Giữ quan hệ trong nguyên văn: hội thánh gồm những người Lao-đi-xê, thay vì mặc nhiên chỉ chuyển thành tên địa điểm.'
- source_word: τὴν ἐκ Λαοδικείας
  choice: bức thư từ Lao-đi-xê
  rationale: Danh từ “thư” được lược trong tiếng Hy Lạp nhưng được bổ sung trong tiếng Việt để câu rõ và tự nhiên. Giới từ ἐκ được giữ theo nghĩa thông thường là “từ”, không đổi thành “gửi cho”.
theological_decisions:
- issue: Danh tính của “bức thư từ Lao-đi-xê”
  choice: Không xác định đó là thư nào; chỉ dịch theo mối liên hệ xuất phát từ Lao-đi-xê.
  alternative: Thư Phao-lô gửi cho người Lao-đi-xê; một thư được chuyển từ Lao-đi-xê; hoặc một thư luân lưu, có thể là Ê-phê-sô.
  rationale: Nguyên văn chỉ nói “từ Lao-đi-xê” và không cho biết chính xác danh tính, nơi nhận ban đầu hay địa vị quy điển của lá thư.
translation_notes:
  register: Văn phong trang trọng vừa phải, rõ ràng và tự nhiên trong tiếng Việt hiện đại. “Anh chị em” diễn đạt số nhiều và tính cộng đồng của lời nhắn; “hội thánh” phù hợp ngữ cảnh các cộng đồng Cơ Đốc thời đầu. Địa danh được viết theo dạng phiên âm quen dùng trong Kinh Thánh tiếng Việt.
