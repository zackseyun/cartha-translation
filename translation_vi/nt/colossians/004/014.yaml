id: COL.4.14
reference: Colossians 4:14
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀσπάζεται ὑμᾶς Λουκᾶς ὁ ἰατρὸς ὁ ἀγαπητὸς καὶ Δημᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/014.yaml
  text: Luke, the beloved physician, and Demas greet you.
translation:
  language: vi
  text: Lu-ca, vị thầy thuốc yêu quý, và Đê-ma gửi lời chào anh chị em.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀσπάζεται
  choice: gửi lời chào
  rationale: Đây là công thức chào thăm thường dùng trong thư từ. Dù động từ Hy Lạp ở số ít và đứng trước các chủ thể được nối bằng καί, tiếng Việt tự nhiên dùng một vị ngữ chung cho Lu-ca và Đê-ma.
- source_word: ὑμᾶς
  choice: anh chị em
  rationale: Đại từ ngôi thứ hai số nhiều chỉ tập thể tín hữu nhận thư. “Anh chị em” diễn đạt rõ số nhiều và phù hợp với cách xưng hô cộng đồng Cơ Đốc trong tiếng Việt hiện đại.
- source_word: Λουκᾶς
  choice: Lu-ca
  rationale: Dùng dạng phiên âm tên riêng quen thuộc trong Kinh Thánh tiếng Việt.
- source_word: ἰατρὸς
  choice: thầy thuốc
  rationale: Diễn đạt nghề chữa bệnh của Lu-ca bằng một từ trang trọng, dễ hiểu và phù hợp với bối cảnh cổ đại hơn cách gọi chức danh hiện đại “bác sĩ”.
- source_word: ἀγαπητὸς
  choice: yêu quý
  rationale: Giữ sắc thái trìu mến và trân trọng của tính từ ἀγαπητός bằng cách diễn đạt tự nhiên trong tiếng Việt hiện đại.
- source_word: καὶ
  choice: và
  rationale: Liên từ đơn giản nối Đê-ma với Lu-ca như hai người cùng gửi lời chào.
- source_word: Δημᾶς
  choice: Đê-ma
  rationale: Dùng dạng phiên âm tên riêng quen thuộc trong Kinh Thánh tiếng Việt.
theological_decisions:
- issue: Phạm vi bổ nghĩa của cụm “vị thầy thuốc yêu quý”
  choice: Cả “thầy thuốc” và “yêu quý” đều mô tả Lu-ca, không mô tả Đê-ma.
  alternative: Để dấu câu tiếng Việt tạo cảm giác mơ hồ rằng “yêu quý” cũng có thể liên quan đến Đê-ma.
  rationale: Cấu trúc Hy Lạp Λουκᾶς ὁ ἰατρὸς ὁ ἀγαπητός đặt hai cụm có mạo từ đồng vị với Lu-ca; vì vậy bản dịch dùng dấu phẩy để xác định rõ toàn bộ cụm mô tả Lu-ca.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Vị thầy thuốc” giữ sắc thái kính trọng; “gửi lời chào anh chị em” truyền đạt tự nhiên công thức chào thăm trong thư từ. Không cần chú thích.
source_grounding:
  english_pob_role: consult_only
