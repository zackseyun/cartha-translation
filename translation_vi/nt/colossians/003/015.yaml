  - severity: low
    issue: Cụm “là sự bình an mà anh em đã được kêu gọi đến” hơi gượng trong tiếng Việt.
    rationale: Cấu trúc này làm mệnh đề quan hệ nặng và có thể khiến quan hệ đích hướng của εἰς ἣν kém rõ. “được kêu gọi đến sự bình an ấy” trực tiếp hơn mà không thêm diễn giải.
