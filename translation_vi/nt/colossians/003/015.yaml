language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἡ εἰρήνη τοῦ ⸀Χριστοῦ βραβευέτω ἐν ταῖς καρδίαις ὑμῶν, εἰς ἣν καὶ ἐκλήθητε ἐν ἑνὶ σώματι· καὶ εὐχάριστοι γίνεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/015.yaml
  text: And let the peace of Messiah rule in your hearts[a], to which indeed you were called in one body[c][b]. And be thankful.
translation:
  language: vi
  text: Hãy để sự bình an của Đấng Mê-si-a[a] ngự trị[b] trong lòng anh em, vì anh em cũng đã được kêu gọi đến sự bình an ấy trong một thân thể[c]. Và hãy biết ơn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “sự bình an của Đấng Christ” hoặc “của Đấng Ki-tô”. Tước hiệu Hy Lạp Χριστός có nghĩa là “Đấng được xức dầu”.
    reason: lexical_alternative
  - marker: b
    text: Động từ này cũng có thể mang nghĩa “phân xử” hoặc “làm trọng tài”, nhấn mạnh rằng sự bình an của Đấng Mê-si-a phải là yếu tố quyết định trong đời sống nội tâm của cộng đồng.
    reason: lexical_alternative
  - marker: c
    text: Cũng có thể hiểu là “vào trong một thân thể”, nhấn mạnh việc được kết hợp thành một thân thể duy nhất.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰρήνη
  choice: sự bình an
  rationale: Diễn đạt tự nhiên ý nghĩa về sự bình an trong mối quan hệ và cộng đồng, phù hợp với lời khuyên trong văn cảnh.
- source_word: τοῦ Χριστοῦ
  choice: của Đấng Mê-si-a
  rationale: Χριστός mang nghĩa tước hiệu “Đấng được xức dầu”; “Đấng Mê-si-a” giữ rõ sức nặng của tước hiệu thay vì coi đây chỉ như một tên riêng.
- source_word: βραβευέτω
  choice: hãy để ... ngự trị
  rationale: Cách nói tự nhiên trong tiếng Việt, truyền đạt mệnh lệnh rằng sự bình an phải giữ vai trò chi phối và quyết định; sắc thái “phân xử” được bảo lưu trong chú thích.
- source_word: ἐν ταῖς καρδίαις ὑμῶν
  choice: trong lòng anh em
  rationale: “Lòng” là cách diễn đạt tiếng Việt tự nhiên cho đời sống nội tâm, tình cảm và ý chí; “anh em” giữ chiều kích cộng đồng của đại từ số nhiều.
- source_word: εἰς ἣν
  choice: là sự bình an mà ... được kêu gọi đến
  rationale: Lặp lại “sự bình an” giúp mệnh đề quan hệ rõ nghĩa trong tiếng Việt, đồng thời giữ sự bình an là đích hướng tới của tiếng gọi.
- source_word: καὶ ἐκλήθητε
  choice: đã được kêu gọi
  rationale: Thể bị động được giữ nguyên; trong câu tiếng Việt, trọng tâm vốn đã được làm rõ nên không cần thêm một từ nhấn mạnh dễ gây gượng ép.
- source_word: ἐν ἑνὶ σώματι
  choice: trong một thân thể
  rationale: Bám sát giới từ và giữ nguyên hình ảnh “thân thể” của Phao-lô mà không giải thích trực tiếp thành hội thánh.
- source_word: εὐχάριστοι γίνεσθε
  choice: hãy biết ơn
  rationale: Cách khuyên bảo ngắn gọn, tự nhiên, diễn đạt trạng thái biết ơn mà người đọc phải có và vun đắp.
theological_decisions:
- issue: Cách dịch Χριστοῦ
  choice: Đấng Mê-si-a
  alternative: Đấng Christ / Đấng Ki-tô
  rationale: Bản chính dịch tước hiệu để giữ nghĩa “Đấng được xức dầu”; cách gọi truyền thống được nêu ở chú thích mà không áp đặt truyền thống hệ phái.
- issue: Ý nghĩa của “một thân thể”
  choice: Giữ nguyên hình ảnh cộng đồng “trong một thân thể”
  alternative: Giải thích trực tiếp là “trong Hội Thánh” hoặc hiểu là “vào trong một thân thể”
  rationale: Hình ảnh có hàm ý về sự hiệp nhất của cộng đồng nhưng bản dịch không mở rộng quá nguyên văn hay âm thầm giải quyết khả năng “trong/vào trong”.
- issue: Vai trò của sự bình an
  choice: ngự trị
  alternative: phân xử / làm trọng tài
  rationale: “Ngự trị” diễn đạt chức năng chi phối một cách tự nhiên, còn chú thích giữ lại hình ảnh xét định hoặc làm trọng tài của động từ Hy Lạp.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh em” cho đại từ số nhiều nhằm giữ sắc thái cộng đồng của thư tín; giữ nguyên ẩn dụ “một thân thể” và tránh thêm thuật ngữ hệ phái vào câu chính.
