  text: For the wrongdoer will be repaid for what he has done wrong[b][a], and there is no partiality.
translation:
  language: vi
  text: Vì người làm điều sai trái sẽ nhận lại điều sai trái mình đã làm[a], và không có sự thiên vị[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “sẽ nhận lại điều mình đã làm sai trái.”'
    reason: lexical_alternative
  - marker: b
    text: 'Hay: “không có sự ưu ái”; theo nghĩa đen, đây là thành ngữ Hy Lạp nói đến việc “nhận lấy khuôn mặt”, tức xét đoán theo địa vị hoặc vẻ bề ngoài.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ γὰρ ἀδικῶν
  choice: Vì người làm điều sai trái
  rationale: Phân từ hiện tại có mạo từ được dùng như danh từ, chỉ chung bất cứ người nào làm điều sai trái. “Vì” chuyển tải chức năng giải thích của γάρ.
- source_word: κομίσεται
  choice: sẽ nhận lại
  rationale: Động từ ở thì tương lai diễn tả việc nhận về điều tương ứng với hành vi của mình; “nhận lại” giữ được sắc thái hoàn trả mà không nói rõ thêm tác nhân hay thời điểm.
- source_word: ὃ ἠδίκησεν
  choice: điều mình đã làm sai
  rationale: Cách diễn đạt này giữ mối liên hệ từ vựng với ἀδικῶν/ἀδικέω, chỉ điều sai trái đã thực hiện, đồng thời tự nhiên trong tiếng Việt.
- source_word: οὐκ ἔστιν προσωπολημψία
  choice: không có sự thiên vị
  rationale: προσωπολημψία chỉ việc đối xử thiên vị dựa trên địa vị hay bề ngoài. “Sự thiên vị” trang trọng, rõ nghĩa và tự nhiên trong tiếng Việt hiện đại.
- source_word: implicit generic masculine in ὁ ... ἀδικῶν / ἠδίκησεν
  choice: người ... mình
  rationale: Tiếng Việt không bắt buộc đánh dấu giống ngữ pháp ở đại từ. “Người” và đại từ phản thân “mình” giữ số ít và ý nghĩa khái quát mà không đưa thêm giới tính không cần thiết.
theological_decisions:
- issue: Bản chất và phạm vi của sự báo trả không thiên vị
  choice: Câu này phát biểu nguyên tắc chung rằng người làm sai sẽ nhận lại điều tương ứng với việc mình đã làm, và không có sự thiên vị.
  alternative: Hiểu câu này chỉ nói về sự phán xét chung cuộc, hoặc chỉ giới hạn trong quan hệ giữa chủ và nô lệ.
  rationale: Bản văn không xác định rõ cơ chế, tác nhân hay thời điểm của sự báo trả. Bản dịch giữ nguyên lời cảnh báo rộng và sự căng thẳng thần học ấy, không thu hẹp quá mức.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Cấu trúc ngắn gọn giữ sắc thái cảnh báo của nguyên văn; tránh từ cổ và không xác định thêm ai là tác nhân báo trả.
