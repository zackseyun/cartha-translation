id: COL.3.17
reference: Colossians 3:17
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ πᾶν ⸂ὅ τι⸃ ⸀ἐὰν ποιῆτε ἐν λόγῳ ἢ ἐν ἔργῳ, πάντα ἐν ὀνόματι κυρίου Ἰησοῦ, εὐχαριστοῦντες τῷ ⸀θεῷ πατρὶ δι’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/017.yaml
  text: And whatever you do[a], in word or in deed, do everything in the name of the Lord Jesus[b], giving thanks to God the Father through him.
translation:
  language: vi
  text: Và bất cứ điều gì anh chị em làm, dù trong lời nói hay việc làm[a], thì hãy làm tất cả trong danh Chúa Giê-su[b], đồng thời cảm tạ Đức Chúa Trời là Cha qua Ngài.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “trong lời nói hay trong hành động.”'
    reason: lexical_alternative
  - marker: b
    text: “Trong danh” cũng có thể mang nghĩa “dưới thẩm quyền của” hoặc “với tư cách là người đại diện cho Chúa Giê-su.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶν ὅ τι ἐὰν ποιῆτε
  choice: bất cứ điều gì anh chị em làm
  rationale: Cách diễn đạt này chuyển tải tự nhiên ý nghĩa bất định nhưng bao quát của cụm Hy Lạp, đồng thời dùng đại từ số nhiều phù hợp với động từ ποιῆτε.
- source_word: ἐν λόγῳ ἢ ἐν ἔργῳ
  choice: dù bằng lời nói hay việc làm
  rationale: Cặp từ chỉ toàn bộ hành vi bằng lời và bằng hành động; cách dịch này rõ ràng, cân đối và tự nhiên trong tiếng Việt hiện đại.
- source_word: πάντα
  choice: hãy làm tất cả
  rationale: πάντα tóm lại và nhấn mạnh tính toàn diện của mệnh lệnh trước đó; thêm 'hãy làm' trong tiếng Việt để thể hiện rõ lực khuyên bảo vốn được hiểu từ ngữ cảnh Hy Lạp.
- source_word: ἐν ὀνόματι κυρίου Ἰησοῦ
  choice: trong danh Chúa Giê-su
  rationale: Giữ nguyên thành ngữ Kinh Thánh, không thu hẹp phạm vi nghĩa vốn có thể bao hàm thẩm quyền, tư cách đại diện và sự gắn bó với Chúa Giê-su.
- source_word: κυρίου
  choice: Chúa
  rationale: Đây là tước hiệu của Chúa Giê-su trong ngữ cảnh Kitô học, nên 'Chúa' vừa tự nhiên vừa giữ được sức nặng của κύριος.
- source_word: εὐχαριστοῦντες
  choice: cảm tạ
  rationale: Diễn tả hành động đồng thời đi kèm mọi lời nói và việc làm. Tiếng Việt không cần giữ nguyên hình thức phân từ để bảo toàn quan hệ ý nghĩa.
- source_word: τῷ θεῷ πατρὶ
  choice: Đức Chúa Trời là Cha
  rationale: πατρί đồng vị với θεῷ. Cách dịch này làm rõ quan hệ đồng vị trong tiếng Việt mà không biến thành hai đối tượng riêng biệt.
- source_word: δι’ αὐτοῦ
  choice: qua Ngài
  rationale: Đại từ quy chiếu tự nhiên về Chúa Giê-su vừa được nhắc đến và giữ nguyên ý nghĩa trung gian của διά.
theological_decisions:
- issue: Ý nghĩa của cụm 'trong danh Chúa Giê-su'
  choice: Giữ thành ngữ 'trong danh Chúa Giê-su' trong chính văn.
  alternative: dưới thẩm quyền của Chúa Giê-su; với tư cách đại diện Chúa Giê-su
  rationale: Thành ngữ Hy Lạp có phạm vi nghĩa rộng, bao gồm thẩm quyền, sự đại diện và sự gắn bó. Giữ thành ngữ tránh quyết định thay người đọc chỉ một sắc thái.
- issue: Đối tượng mà 'qua Ngài' quy chiếu
  choice: '''Ngài'' chỉ về Chúa Giê-su, là Đấng qua đó lời cảm tạ được dâng lên Đức Chúa Trời là Cha.'
  alternative: Hiểu đại từ theo nghĩa khái quát, không nhấn mạnh vai trò trung gian của Chúa Giê-su.
  rationale: Chúa Giê-su là tiền ngữ gần nhất, và cú pháp tự nhiên hỗ trợ cách quy chiếu này mà không cần thêm một công thức thần học ngoài câu.
- issue: Lực mệnh lệnh của câu không có động từ hữu hạn ở mệnh đề 'πάντα ἐν ὀνόματι'
  choice: Bổ sung 'hãy làm' để thể hiện mệnh lệnh được tỉnh lược nhưng được hiểu rõ trong tiếng Hy Lạp.
  alternative: 'Dịch rút gọn: ''tất cả trong danh Chúa Giê-su''.'
  rationale: Tiếng Việt cần động từ để câu đầy đủ và rõ nghĩa; việc bổ sung này không thêm nội dung mà chỉ biểu đạt lực cú pháp của lời khuyên bảo.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng 'anh chị em' để biểu đạt ngôi thứ hai số nhiều một cách bao quát; dùng 'Chúa Giê-su' và 'Đức Chúa Trời' theo lối gọi quen thuộc trong tiếng Việt Cơ Đốc. Nhịp câu giữ cấu trúc toàn diện của nguyên văn và đặt các chú thích ngay sau những cụm từ liên quan.
