source:
  edition: SBLGNT
  text: εἰδότες ὅτι ἀπὸ κυρίου ⸀ἀπολήμψεσθε τὴν ἀνταπόδοσιν τῆς κληρονομίας· ⸀τῷ κυρίῳ Χριστῷ δουλεύετε·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/024.yaml
  text: knowing that from the Lord you will receive the reward of the inheritance[b][a]. Serve the Lord Messiah.
translation:
  language: vi
  text: vì biết rằng anh em sẽ nhận từ Chúa phần thưởng của cơ nghiệp.[a] Anh em đang phục vụ Chúa, Đấng Mê-si.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn có cấu trúc cô đọng: “phần thưởng của cơ nghiệp”; cũng có thể hiểu là phần thưởng chính là cơ nghiệp, hoặc là phần thưởng gắn với cơ nghiệp.'
    reason: Bảo lưu độ mở của sở hữu cách τῆς κληρονομίας.
  - marker: b
    text: 'Động từ Hy Lạp ở lối trình bày: “anh em đang phục vụ”, chứ không phải hình thái mệnh lệnh trực tiếp “hãy phục vụ”. “Đấng Mê-si” cũng thường được dịch theo truyền thống là “Đấng Christ”.'
    reason: Làm rõ hình thái của δουλεύετε và ghi nhận cách dịch truyền thống của tước hiệu Χριστός.
lexical_decisions:
- source_word: εἰδότες
  choice: vì biết rằng
  rationale: Phân từ này nối với lời khuyên ở câu trước và trong ngữ cảnh có sắc thái nêu lý do. Cách dịch này tự nhiên trong tiếng Việt, đồng thời giữ mối liên hệ cú pháp với câu trước.
- source_word: ἀπὸ κυρίου
  choice: từ Chúa
  rationale: 'Giới từ ἀπό với sở hữu cách chỉ nguồn: phần thưởng đến từ Chúa. “Chúa” vừa tự nhiên vừa giữ được tước hiệu mang ý nghĩa Kitô học trong ngữ cảnh.'
- source_word: ἀπολήμψεσθε
  choice: anh em sẽ nhận
  rationale: Động từ ở thì tương lai, thể trung gian, lối trình bày. “Sẽ nhận” diễn đạt tự nhiên ý nhận được điều đáp lại.
- source_word: ἀνταπόδοσιν
  choice: phần thưởng
  rationale: Danh từ chỉ sự đền đáp hoặc phần được báo đáp. Trong ngữ cảnh tích cực này, “phần thưởng” rõ ràng và tự nhiên hơn “sự báo đáp” hay “sự hoàn trả”.
- source_word: τῆς κληρονομίας
  choice: là cơ nghiệp
  rationale: Sở hữu cách có thể cho biết phần thưởng chính là cơ nghiệp. Bản dịch chính diễn đạt quan hệ này tự nhiên; chú thích bảo lưu cách hiểu sát cấu trúc hơn là “phần thưởng của cơ nghiệp”.
- source_word: τῷ κυρίῳ Χριστῷ
  choice: Chúa là Đấng Mê-si
  rationale: Χριστός được dùng với giá trị tước hiệu, nên dịch là “Đấng Mê-si”; κύριος là “Chúa”. Cấu trúc tiếng Việt với “là” thể hiện quan hệ đồng vị một cách rõ ràng.
- source_word: δουλεύετε
  choice: anh em đang phục vụ
  rationale: Hình thái Hy Lạp là hiện tại chủ động lối trình bày, ngôi thứ hai số nhiều, không phải mệnh lệnh. “Đang phục vụ” giữ lời khẳng định nhắc người nghe ai mới thật sự là Chủ của họ.
theological_decisions:
- issue: Giá trị tước hiệu của Χριστῷ
  choice: Đấng Mê-si
  alternative: Đấng Christ / Chúa Cơ Đốc
  rationale: Ở đây Χριστός vẫn mang nghĩa tước hiệu “Đấng được xức dầu”, chứ không chỉ hoạt động như một tên riêng. “Đấng Mê-si” giữ rõ nghĩa tước hiệu mà không thêm một lập trường hệ phái.
- issue: Thức của δουλεύετε
  choice: 'lối trình bày: “anh em đang phục vụ”'
  alternative: 'lối mệnh lệnh trong bản dịch: “hãy phục vụ”'
  rationale: Hình thái của động từ là lối trình bày. Giữ lời khẳng định tránh biến hình thái này thành một mệnh lệnh, dù toàn đoạn mang tính khuyên bảo.
- issue: Quan hệ giữa phần thưởng và cơ nghiệp
  choice: phần thưởng là cơ nghiệp
  alternative: phần thưởng của cơ nghiệp
  rationale: Sở hữu cách có thể được hiểu theo nghĩa giải thích, tức cơ nghiệp chính là phần thưởng. Vì cấu trúc Hy Lạp cô đọng và có thể hiểu theo hơn một cách, phương án sát chữ hơn được ghi trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “anh em” cho ngôi thứ hai số nhiều trong lời khuyên cộng đồng; dùng “cơ nghiệp” để giữ sắc thái Kinh Thánh quen thuộc nhưng vẫn thông dụng. Câu đầu bắt đầu bằng “vì” nhằm nối tự nhiên với câu trước, đúng chức năng của phân từ Hy Lạp.
