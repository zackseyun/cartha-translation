id: COL.3.6
reference: Colossians 3:6
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: δι’ ἃ ἔρχεται ἡ ὀργὴ τοῦ θεοῦ ⸂ἐπὶ τοὺς υἱοὺς τῆς ἀπειθείας⸃·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/006.yaml
  text: Because of these things the wrath of God is coming upon the sons of disobedience[a].
translation:
  language: vi
  text: Vì những điều ấy, cơn thịnh nộ của Đức Chúa Trời đang giáng xuống trên những kẻ không vâng phục[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “các con trai của sự không vâng phục”, một thành ngữ chỉ những người có đặc điểm là không vâng phục.'
    reason: lexical_alternative
  - marker: b
    text: Một số thủ bản cổ không có cụm “trên những kẻ không vâng phục”.
    reason: textual_variant
lexical_decisions:
- source_word: δι’ ἃ
  choice: Vì những điều ấy
  rationale: διά với đại từ quan hệ ở đối cách diễn tả nguyên nhân. “Những điều ấy” quy chiếu tự nhiên đến các điều xấu vừa được nêu ở câu trước và giữ số nhiều của nguyên văn.
- source_word: ἔρχεται
  choice: đang giáng xuống
  rationale: Thì hiện tại của ἔρχομαι diễn tả cơn thịnh nộ đang đến hoặc chắc chắn sẽ đến. Trong ngữ cảnh phán xét, “đang giáng xuống” tự nhiên trong tiếng Việt và vẫn giữ hướng chuyển động cùng sức nặng cánh chung của động từ.
- source_word: ἡ ὀργὴ τοῦ θεοῦ
  choice: cơn thịnh nộ của Đức Chúa Trời
  rationale: ὀργή ở đây chỉ sự phẫn nộ mang tính xét xử của Đức Chúa Trời. “Cơn thịnh nộ” là cách diễn đạt trang trọng, rõ nghĩa và không làm nhẹ sắc thái thần học.
- source_word: ἐπὶ
  choice: trên
  rationale: ἐπί với đối cách chỉ đối tượng mà cơn thịnh nộ hướng đến. “Giáng xuống trên” thể hiện tự nhiên hướng và đích của hành động trong văn cảnh phán xét.
- source_word: τοὺς υἱοὺς τῆς ἀπειθείας
  choice: những kẻ không vâng phục
  rationale: Cụm sở hữu kiểu Sê-mít, theo nghĩa đen là “các con trai của sự không vâng phục”, chỉ những người mang đặc tính không vâng phục. Dịch theo nghĩa thành ngữ giúp người đọc tiếng Việt hiểu đúng, còn hình thức nguyên văn được ghi ở chú thích.
theological_decisions:
- issue: Nên giữ nguyên thành ngữ “các con trai của sự không vâng phục” hay diễn đạt ý nghĩa của thành ngữ
  choice: Dịch là “những kẻ không vâng phục” trong chính văn và ghi nghĩa đen ở chú thích
  alternative: Giữ “các con trai của sự không vâng phục” hoặc “con cái của sự không vâng phục” trong chính văn
  rationale: Trong tiếng Việt hiện đại, cách dịch sát hình thức dễ bị hiểu là quan hệ huyết thống hoặc nghe tối nghĩa. Bản dịch theo chức năng giữ đúng ý rằng đây là những người có đặc điểm là không vâng phục, không giới hạn ở nam giới, đồng thời chú thích bảo tồn hình ảnh của nguyên văn.
- issue: Tình trạng văn bản của cụm ἐπὶ τοὺς υἱοὺς τῆς ἀπειθείας
  choice: Giữ cụm từ trong chính văn và báo dị bản ở chú thích
  alternative: Lược bỏ cụm từ theo một số thủ bản cổ
  rationale: SBLGNT in cụm này trong dấu ngoặc chỉ sự bất định về văn bản. Giữ cụm từ phù hợp với văn bản trình bày của ấn bản nguồn, còn chú thích giúp người đọc biết rằng truyền thống thủ bản có khác biệt mà không che khuất vấn đề.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Đức Chúa Trời” được dùng làm danh xưng quen thuộc trong tiếng Việt; “cơn thịnh nộ” giữ sắc thái xét xử mạnh của nguyên văn. Cấu trúc “đang giáng xuống trên” vừa tự nhiên trong ngữ cảnh phán xét vừa tránh biến động từ hiện tại thành một lời khẳng định thuần túy ở tương lai.
