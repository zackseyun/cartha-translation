  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Τὰ τέκνα, ὑπακούετε τοῖς γονεῦσιν κατὰ πάντα, τοῦτο γὰρ ⸂εὐάρεστόν ἐστιν⸃ ἐν κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/020.yaml
  text: Children[a], obey your parents in everything[b], for this is pleasing in the Lord.
translation:
  language: vi
  text: Hỡi các con, hãy vâng lời cha mẹ trong mọi sự, vì điều này đẹp lòng[a] trong Chúa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “được chấp nhận trong Chúa”.'
    reason: lexical_alternative
  - marker: b
    text: “Trong Chúa” có thể chỉ điều đẹp lòng trong mối liên hệ với Chúa, chứ không nhất thiết chỉ có nghĩa là “đẹp lòng Chúa”.
    reason: alternative_reading
lexical_decisions:
- source_word: Τὰ τέκνα
  choice: Hỡi những người làm con
  rationale: τέκνα chỉ con cái nói chung, không riêng con trai. Cách diễn đạt này tự nhiên trong tiếng Việt, thể hiện lời gọi trực tiếp và vai trò của con cái trong gia đình mà không khiến người đọc hiểu người nói chính là cha mẹ.
- source_word: ὑπακούετε
  choice: hãy vâng lời
  rationale: Mệnh lệnh của ὑπακούω mang nghĩa nghe theo và tuân phục. “Hãy vâng lời” là cách nói rõ ràng, tự nhiên trong quan hệ con cái với cha mẹ.
- source_word: τοῖς γονεῦσιν
  choice: cha mẹ mình
  rationale: γονεῦσιν có nghĩa là cha mẹ. Đại từ “mình” được thêm theo lối nói tự nhiên của tiếng Việt và biểu thị quan hệ vốn đã hàm ý trong ngữ cảnh.
- source_word: κατὰ πάντα
  choice: trong mọi sự
  rationale: 'Cụm κατά với đối cách ở đây diễn tả phạm vi: trong mọi việc hay mọi sự. “Trong mọi sự” giữ được phạm vi rộng của nguyên văn và tránh biến cụm từ thành ý nghĩa thuần túy thời gian như “luôn luôn”.'
- source_word: τοῦτο
  choice: điều này
  rationale: Đại từ chỉ định τοῦτο quy chiếu về việc vâng lời vừa được truyền dạy. “Điều này” giữ nguyên cấu trúc và không diễn giải quá mức.
- source_word: γὰρ
  choice: vì
  rationale: γάρ nêu lý do cho mệnh lệnh trước đó; “vì” thể hiện tự nhiên mối liên hệ giải thích trong tiếng Việt.
- source_word: εὐάρεστόν ἐστιν
  choice: là điều đẹp lòng
  rationale: εὐάρεστος diễn tả điều làm hài lòng hoặc được chấp nhận. “Là điều đẹp lòng” tự nhiên trong văn phong Kinh Thánh tiếng Việt, đồng thời giữ sắc thái đánh giá tích cực.
- source_word: ἐν κυρίῳ
  choice: trong Chúa
  rationale: Bản dịch sát giới từ ἐν và giữ nguyên cách nói đặc trưng của Phao-lô về mối liên hệ hoặc phạm vi “trong Chúa”, thay vì thu hẹp thành “đẹp lòng Chúa”.
theological_decisions:
- issue: Phạm vi của “trong mọi sự” và mối liên hệ với “trong Chúa”
  choice: Giữ nguyên cả hai cụm từ mà không thêm ngoại lệ hoặc điều kiện.
  alternative: Hiểu “trong Chúa” là giới hạn trực tiếp mệnh lệnh vâng lời, hoặc dịch thành “vì điều này đẹp lòng Chúa”.
  rationale: Nguyên văn không nêu rõ một mệnh đề ngoại lệ sau “trong mọi sự”, và về ngữ pháp, “trong Chúa” gần với nhận định “là điều đẹp lòng” hơn là trực tiếp bổ nghĩa cho mệnh lệnh. Bản dịch vì thế bảo toàn phạm vi của lời dạy và sự mơ hồ thật có của cụm cuối, không tự ý giải quyết căng thẳng thần học.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. “Hỡi những người làm con” thể hiện lời gọi trực tiếp trong khuôn khổ gia đình; “trong Chúa” được giữ lại để bảo toàn cách diễn đạt và độ mở của nguyên văn Phao-lô.
