revisions:
- from: Hỡi những người làm con, hãy vâng lời cha mẹ mình trong mọi sự, vì điều này là điều đẹp lòng[a] trong Chúa.[b]
  to: Hỡi các con, hãy vâng lời cha mẹ trong mọi sự, vì điều này đẹp lòng[a] trong Chúa.[b]
  rationale: Sửa cách xưng hô cho tự nhiên hơn trong tiếng Việt hiện đại, bỏ sự lặp không có trong nguyên văn ở vị ngữ, và làm rõ phạm vi của phương án từ vựng trong chú thích. Bản sửa vẫn giữ “trong mọi sự” và “trong Chúa” mà không thêm ngoại lệ hay áp đặt cách giải thích thần học.
