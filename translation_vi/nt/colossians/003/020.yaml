    rationale: τέκνα là lời gọi trực tiếp đến con cái; “Hỡi các con” diễn đạt gọn, tự nhiên và không giới hạn giới tính.
  - severity: low
    issue: Cụm “điều này là điều đẹp lòng” thừa từ.
    rationale: εὐάρεστόν ἐστιν là vị ngữ tính từ, có thể dịch tự nhiên là “điều này đẹp lòng”; bản hiện tại lặp “điều” mà không có cơ sở trong nguyên văn.
  - severity: low
