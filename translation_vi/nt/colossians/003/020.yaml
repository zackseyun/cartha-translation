  terminology: “Vâng lời,” “trong mọi sự,” và “trong Chúa” đều phù hợp. Giữ “trong Chúa” là cần thiết để không thu hẹp ἐν κυρίῳ thành chỉ nghĩa “đẹp lòng Chúa.” Chú thích lựa chọn từ nên bao gồm cụm cuối để người đọc không hiểu “được chấp nhận” là một diễn giải tách khỏi “trong Chúa.”
