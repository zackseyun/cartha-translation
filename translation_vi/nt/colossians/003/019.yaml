    rationale: μὴ πικραίνεσθε πρὸς αὐτάς nói về thái độ cay đắng/khắc nghiệt hướng về các người vợ. “Đừng đối xử cay nghiệt với vợ mình” diễn đạt tự nhiên hệ quả quan hệ của động từ trong ngữ cảnh, đồng thời bảo toàn chú thích về nghĩa sát hơn.
