revisions:
- from: Hỡi những người chồng, hãy yêu thương vợ mình và đừng cay nghiệt với họ.[a]
  to: Người chồng, hãy yêu vợ mình và đừng đối xử cay nghiệt[a] với vợ.
  rationale: Bản sửa giữ nguyên quan hệ hôn nhân, lực mệnh lệnh và hướng của thái độ trong nguyên ngữ, nhưng dùng cú pháp Việt hiện đại tự nhiên hơn. Số ít “vợ mình/vợ” là số ít phân phối, tương ứng với các số nhiều trong lời dạy được ngỏ với từng người chồng. Chú thích tiếp tục bảo lưu khả năng nghĩa “trở nên cay đắng,” vốn là lựa chọn sát chữ hơn, trong khi câu chính phản ánh lực quan hệ của ngữ cảnh.
