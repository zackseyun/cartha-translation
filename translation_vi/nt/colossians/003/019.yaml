  source_fidelity: Bản nháp chuyển đạt đúng đối tượng hôn nhân (οἱ ἄνδρες / τὰς γυναῖκας), mệnh lệnh yêu thương (ἀγαπᾶτε), và lời cấm thái độ/hành vi cay đắng, khắc nghiệt đối với vợ (μὴ πικραίνεσθε πρὸς αὐτάς). Tuy nhiên, câu chính nên diễn đạt rõ hơn sắc thái hành xử hướng đến người vợ mà không thu hẹp động từ chỉ còn một tính từ rời.
  naturalness: “Đừng cay nghiệt với họ” có thể hiểu được, nhưng “cay nghiệt” tự nhiên hơn khi đi với “đối xử”; đồng thời “họ” sau “vợ mình” làm mối quy chiếu số ít phân phối/số nhiều kém gọn trong tiếng Việt. Dùng “vợ mình” ở cả hai vế là cách phân phối tự nhiên và rõ ràng.
  terminology: '“Người chồng,” “yêu,” và “vợ mình” là các lựa chọn hiện đại, đúng ngữ cảnh và vừa phải về văn thể. Không cần thêm “Hỡi”: tiếng Hy Lạp dùng danh từ xác định để gọi nhóm được nhắm đến, nhưng không có hạt từ tương đương bắt buộc phải dịch bằng một lối gọi mang sắc thái cổ. Chú thích nên giữ phương án “trở nên cay đắng” mà không khẳng định quá mức một cách giải thích.'
