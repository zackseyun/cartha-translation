  text: οἱ ἄνδρες, ἀγαπᾶτε τὰς γυναῖκας καὶ μὴ πικραίνεσθε πρὸς αὐτάς.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/019.yaml
  text: Husbands[a], love your wives, and do not be harsh toward them.
translation:
  language: vi
  text: Người chồng, hãy yêu vợ mình và đừng đối xử cay nghiệt[a] với vợ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đừng trở nên cay đắng với vợ mình.” Động từ Hy Lạp có thể chỉ việc trở nên cay đắng hoặc nuôi lòng cay đắng; trong ngữ cảnh này, từ này có lẽ nói đến thái độ và cách đối xử cay nghiệt, đầy oán giận đối với người vợ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ ἄνδρες
  choice: những người chồng
  rationale: Danh từ ἀνήρ có thể chỉ người đàn ông hoặc người chồng; trong lời dạy dành cho gia đình và với đối tượng là các bà vợ, nghĩa quan hệ hôn nhân là rõ ràng.
- source_word: ἀγαπᾶτε
  choice: hãy yêu thương
  rationale: Diễn đạt tự nhiên mệnh lệnh hiện tại của ἀγαπάω, đồng thời giữ rõ nội dung về tình yêu.
- source_word: τὰς γυναῖκας
  choice: vợ mình
  rationale: γυνή có thể là phụ nữ hoặc vợ; ngữ cảnh hôn nhân đòi hỏi nghĩa 'vợ'. Đại từ 'mình' được bổ sung theo cách nói tự nhiên của tiếng Việt để thể hiện quan hệ sở hữu hàm ẩn.
- source_word: μὴ πικραίνεσθε
  choice: đừng cay nghiệt
  rationale: Động từ πικραίνω gắn với ý cay đắng, trở nên cay đắng hoặc gây cay đắng. Trong cấu trúc hướng thái độ về phía người vợ, 'cay nghiệt' truyền đạt tự nhiên thái độ và cách đối xử khắc nghiệt bắt nguồn từ sự cay đắng, nhưng chú thích vẫn bảo lưu nghĩa sát chữ.
- source_word: πρὸς αὐτάς
  choice: với họ
  rationale: πρός với đối cách biểu thị hướng của thái độ hoặc hành vi. 'Với họ' tự nhiên trong tiếng Việt khi đi với 'cay nghiệt' và vẫn giữ đối tượng số nhiều theo câu Hy Lạp.
theological_decisions:
- issue: Lời dạy trong gia đình và cách xưng gọi theo giới tính
  choice: Giữ đối tượng cụ thể trong hôn nhân là 'những người chồng' và 'vợ mình'.
  alternative: Dùng các từ rộng hơn như 'đàn ông' và 'phụ nữ'.
  rationale: Bản Hy Lạp nói trực tiếp với những người nam trong tư cách người chồng và nói về vợ của họ; mở rộng thành đàn ông và phụ nữ nói chung sẽ làm mất quan hệ hôn nhân rõ ràng của câu.
- issue: Sắc thái của μὴ πικραίνεσθε
  choice: Dịch trong câu chính là 'đừng cay nghiệt với họ', kèm chú thích về khả năng 'đừng trở nên cay đắng đối với họ'.
  alternative: Chỉ dịch 'đừng trở nên cay đắng với họ'.
  rationale: Câu Hy Lạp có thể nhấn mạnh trạng thái cay đắng hoặc thái độ, cách cư xử cay nghiệt. Bản chính dùng cách nói tự nhiên theo ngữ cảnh quan hệ, còn chú thích bảo tồn độ rộng ngữ nghĩa và sự mơ hồ chân thực.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. 'Hỡi' làm rõ lời gọi trực tiếp của οἱ ἄνδρες; 'hãy... đừng...' giữ lực mệnh lệnh song song. Dùng 'họ' thay vì lặp lại 'các bà vợ' để câu gọn và tự nhiên.
