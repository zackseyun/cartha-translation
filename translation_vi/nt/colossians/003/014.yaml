id: COL.3.14
reference: Colossians 3:14
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐπὶ πᾶσιν δὲ τούτοις τὴν ἀγάπην, ⸀ὅ ἐστιν σύνδεσμος τῆς τελειότητος.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/014.yaml
  text: And above all these[a], put on love, which is the bond of perfection.
translation:
  language: vi
  text: Nhưng trên hết mọi điều ấy, hãy mặc lấy tình yêu thương; đó là mối dây của sự trọn vẹn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “mối dây của sự hoàn thiện” hoặc “mối dây của sự trưởng thành.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπὶ πᾶσιν δὲ τούτοις
  choice: Nhưng trên hết mọi điều ấy
  rationale: 'Giữ sắc thái nhấn mạnh và hình ảnh y phục trong văn cảnh: tình yêu thương được mặc bên ngoài, đồng thời đứng trên các phẩm chất vừa kể.'
- source_word: τὴν ἀγάπην
  choice: tình yêu thương
  rationale: Cách diễn đạt tự nhiên, trang trọng và rõ nghĩa trong tiếng Việt hiện đại cho ἀγάπη.
- source_word: '[động từ được hiểu ngầm từ ἐνδύσασθε ở câu 12]'
  choice: hãy mặc lấy
  rationale: Bổ sung động từ chi phối tân ngữ trong nguyên văn, qua đó duy trì phép ẩn dụ mặc y phục của cả đoạn.
- source_word: ὅ
  choice: đó
  rationale: Đại từ trung tính số ít có thể quy chiếu đến tình yêu thương như một ý niệm hoặc tóm lược lời khuyên vừa nêu; “đó” tự nhiên và không ép buộc cách xác định tiền ngữ.
- source_word: σύνδεσμος
  choice: mối dây
  rationale: Diễn đạt vật hoặc điều gắn kết, vừa súc tích vừa giữ hình ảnh liên kết mà không chuyển sang nghĩa giải phẫu.
- source_word: τῆς τελειότητος
  choice: của sự trọn vẹn
  rationale: “Sự trọn vẹn” bao quát ý niệm hoàn chỉnh, toàn vẹn hoặc trưởng thành của τελειότης, và tránh hàm ý tuyệt đối hóa dễ có ở từ “hoàn hảo”.
theological_decisions:
- issue: Ý nghĩa của σύνδεσμος τῆς τελειότητος
  choice: “mối dây của sự trọn vẹn”
  alternative: “mối dây đem lại sự trọn vẹn” hoặc “mối dây của sự trưởng thành”
  rationale: Cấu trúc sở hữu cách trong tiếng Hy Lạp có thể chỉ mối dây thuộc về, tạo nên hoặc dẫn đến sự trọn vẹn. Bản dịch cô đọng giữ nguyên độ mở thần học và ngữ pháp thay vì quyết định rằng tình yêu thương nhất thiết tạo ra hay chỉ biểu hiện sự trọn vẹn.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. “Mặc lấy” duy trì hình ảnh y phục xuyên suốt văn cảnh; “tình yêu thương” phù hợp văn phong Kinh Thánh phổ thông. Dấu chấm phẩy giúp thể hiện quan hệ giải thích giữa hai vế.
