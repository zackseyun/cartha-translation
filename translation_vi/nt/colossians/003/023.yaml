  source_fidelity: Bản dịch truyền đạt đúng mệnh lệnh phải làm với sự dốc lòng, hướng về Chúa thay vì con người. Tuy nhiên, “Dù làm việc gì” có thể mang sắc thái nhượng bộ (“mặc dù”) trong tiếng Việt và cụm “làm việc” thu hẹp nhẹ phạm vi của ὃ ἐὰν ποιῆτε (“bất cứ điều gì anh em làm”). “Bất cứ điều gì anh em làm” phản ánh chính xác hơn cấu trúc bất định, khái quát của tiếng Hy Lạp.
  naturalness: “Hãy hết lòng mà làm, như làm cho Chúa, chứ không phải cho người ta” là tiếng Việt hiện đại, tự nhiên, trang trọng vừa phải. Việc lặp “làm” sau mệnh đề mở đầu vẫn mạch lạc và nhấn rõ động từ mệnh lệnh ἐργάζεσθε.
  terminology: “Hết lòng” diễn đạt phù hợp ἐκ ψυχῆς trong ngữ cảnh này; không cần ép dịch sát là “từ linh hồn.” “Chúa” giữ đúng giá trị tước hiệu của τῷ κυρίῳ; chú thích nên nêu “Chủ” viết hoa như một sắc thái khả dĩ trong bối cảnh gia hộ. “Người ta” là cách chuyển ngữ tự nhiên cho ἀνθρώποις, chỉ con người nói chung.
