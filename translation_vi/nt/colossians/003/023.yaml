translation:
  language: vi
  text: Bất cứ điều gì anh em làm, hãy hết lòng mà làm, như làm cho Chúa, chứ không phải cho người ta.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Trong bối cảnh quan hệ chủ–nô lệ của đoạn văn, từ “Chúa” cũng có thể gợi sắc thái “Chủ”.
    reason: alternative_reading
lexical_decisions:
- source_word: ὃ ἐὰν ποιῆτε
  choice: Dù làm việc gì
  rationale: 'Đại từ quan hệ trung tính kết hợp với ἐάν diễn tả ý bất định, khái quát: bất cứ việc gì người đọc làm. Cách nói này tự nhiên và bao quát trong tiếng Việt.'
- source_word: ἐκ ψυχῆς
  choice: hết lòng
  rationale: Nghĩa đen là “từ linh hồn”, nhưng trong thành ngữ này chỉ sự chân thành và dốc toàn tâm sức. “Hết lòng” truyền đạt tự nhiên ý nghĩa ấy trong tiếng Việt mà không khiến người đọc hiểu sai là công việc phát xuất từ một bộ phận cấu thành của con người.
- source_word: ἐργάζεσθε
  choice: hãy ... mà làm
  rationale: Động từ mệnh lệnh hiện tại kêu gọi làm việc với nỗ lực liên tục. Kết cấu “hãy hết lòng mà làm” vừa rõ tính khuyên truyền vừa tự nhiên.
- source_word: ὡς τῷ κυρίῳ
  choice: như làm cho Chúa
  rationale: 'ὡς nêu cách nhìn hoặc định hướng của hành động: làm việc như là cho Chúa. κύριος được giữ là tước hiệu “Chúa”; sắc thái “chủ” vẫn có thể vang lên trong bối cảnh gia huấn.'
- source_word: καὶ οὐκ ἀνθρώποις
  choice: chứ không phải cho người ta
  rationale: καὶ οὐκ tạo thế tương phản nhấn mạnh. ἀνθρώποις nói chung về con người, không nhất thiết chỉ nam giới; “người ta” là cách diễn đạt tự nhiên, phù hợp với sự đối chiếu giữa Chúa và loài người.
theological_decisions:
- issue: Cách dịch κύριος trong bối cảnh nói với các nô lệ
  choice: Chúa
  alternative: chủ
  rationale: Trong mạch văn, κύριος chủ yếu chỉ Chúa Cứu Thế là Đấng người tin phục vụ, nhưng bối cảnh chủ–tớ cũng khiến sắc thái “chủ” trở nên đáng chú ý. Bản chính giữ tước hiệu “Chúa” và chú thích sắc thái khả dĩ này, không đồng nhất Ngài với người chủ trần thế.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Hết lòng” được ưu tiên hơn cách dịch sát chữ “từ linh hồn” vì đây là thành ngữ tự nhiên trong tiếng Việt và truyền đạt đúng ý dốc toàn tâm sức. “Người ta” giữ phạm vi chỉ con người nói chung, không giới hạn ở nam giới.
