- from: Dù làm việc gì, hãy hết lòng mà làm, như làm cho Chúa[a], chứ không phải cho người ta.
  to: Bất cứ điều gì anh em làm, hãy hết lòng mà làm, như làm cho Chúa, chứ không phải cho người ta.[a]
  rationale: Thay “Dù làm việc gì” bằng “Bất cứ điều gì anh em làm” để bảo toàn nghĩa bất định, tổng quát của ὃ ἐὰν ποιῆτε và tránh sắc thái nhượng bộ có thể có của “dù.” Câu còn lại được giữ vì vừa trung thành với ἐκ ψυχῆς, ὡς τῷ κυρίῳ καὶ οὐκ ἀνθρώποις vừa tự nhiên trong tiếng Việt hiện đại. Chú thích được chỉnh nhẹ để dùng thuật ngữ lịch sử rõ hơn và phân biệt sắc thái “Chủ” với tước hiệu “Chúa.”
  reviewer_model: gpt-5.6-terra
