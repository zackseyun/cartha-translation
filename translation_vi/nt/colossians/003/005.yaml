revisions:
- from: 'Vậy, hãy giết chết những chi thể ở trên đất[a]: sự vô luân về tình dục, sự ô uế, dục tình, ham muốn xấu xa và lòng tham[b], vốn là sự thờ thần tượng.'
  to: 'Vậy, hãy giết chết các chi thể thuộc về trần thế[a]: sự vô luân về tình dục, sự ô uế, dục tình, ham muốn xấu xa và lòng tham[b], vốn là sự thờ lạy hình tượng.'
  rationale: Điều chỉnh duy nhất về cấu trúc chính là thay “ở trên đất” bằng “thuộc về trần thế” để tiếng Việt không hiểu sai hình ảnh không gian của nguyên văn; chú thích vẫn nêu bản dịch sát nghĩa. Thay “sự thờ thần tượng” bằng “sự thờ lạy hình tượng” để dùng thuật ngữ tự nhiên và chính xác hơn cho εἰδωλολατρία. Mệnh đề “vốn là” vẫn gắn với “lòng tham” theo giống và số của đại từ quan hệ Hy Lạp.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T20:18:59Z'
review_pass:
  verdict: revise
  source_fidelity: Bản dịch giữ đúng mệnh lệnh dứt khoát của Νεκρώσατε, liên từ suy luận οὖν, danh sách năm điều theo nguyên văn, và hiểu đúng mệnh đề quan hệ số ít giống cái là quy về πλεονεξίαν (“lòng tham”). Tuy nhiên, “những chi thể ở trên đất” trong tiếng Việt dễ gợi nghĩa đen các bộ phận cơ thể đang nằm trên mặt đất, thay vì bình diện “thuộc về trần thế” của cụm τὰ ἐπὶ τῆς γῆς.
  naturalness: “Các chi thể thuộc về trần thế” giữ hình ảnh “chi thể” mà rõ và tự nhiên hơn trong tiếng Việt hiện đại. “Thờ lạy hình tượng” tránh nghĩa thông dụng hiện nay của “thần tượng” là người nổi tiếng và diễn đạt εἰδωλολατρία chính xác, tự nhiên.
  terminology: “Vô luân về tình dục,” “ô uế,” “dục tình,” “ham muốn xấu xa,” và “lòng tham” phù hợp với các thuật ngữ Hy Lạp và với văn phong trang trọng hiện đại. “Thờ lạy hình tượng” là tương đương chuẩn, không áp đặt diễn giải giáo phái.
