id: COL.3.5
reference: Colossians 3:5
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Νεκρώσατε οὖν τὰ ⸀μέλη τὰ ἐπὶ τῆς γῆς, πορνείαν, ἀκαθαρσίαν, πάθος, ἐπιθυμίαν κακήν, καὶ τὴν πλεονεξίαν ἥτις ἐστὶν εἰδωλολατρία,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/005.yaml
  text: 'Therefore[a], put to death the members that are on the earth: sexual immorality, impurity, passion, evil desire, and greed[b], which is idolatry.'
translation:
  language: vi
  text: 'Vậy, hãy giết chết các chi thể thuộc về trần thế[a]: sự vô luân về tình dục, sự ô uế, dục tình, ham muốn xấu xa và lòng tham[b], vốn là sự thờ lạy hình tượng.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể hiểu là “những gì trong anh em thuộc về trần thế”. Tiếng Hy Lạp sát nghĩa là “các chi thể trên đất”.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “lòng ham muốn chiếm hữu”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Νεκρώσατε
  choice: hãy giết chết
  rationale: Mệnh lệnh quá khứ bất định kêu gọi hành động dứt khoát. “Hãy giết chết” giữ nguyên sức mạnh của hình ảnh, tự nhiên hơn cách nói cổ “hãy làm cho chết”.
- source_word: οὖν
  choice: Vậy
  rationale: Nêu kết luận rút ra từ lập luận ngay trước đó; “Vậy” ngắn gọn và giữ được liên kết logic.
- source_word: μέλη
  choice: những chi thể
  rationale: Nghĩa đen là các bộ phận hay chi thể của thân thể. Giữ hình ảnh thân thể thay vì diễn giải thành “bản tính trần tục”.
- source_word: τὰ ἐπὶ τῆς γῆς
  choice: ở trên đất
  rationale: Giữ ẩn dụ không gian của nguyên văn và không vội biến cụm từ thành một tính từ trừu tượng như “thuộc trần gian”.
- source_word: πορνείαν
  choice: sự vô luân về tình dục
  rationale: Diễn đạt phạm vi rộng của πορνεία bằng tiếng Việt hiện đại, tránh giới hạn từ này vào một dạng hành vi tình dục cụ thể.
- source_word: ἀκαθαρσίαν
  choice: sự ô uế
  rationale: Giữ thuật ngữ đạo đức rộng quen thuộc trong văn mạch Phao-lô.
- source_word: πάθος
  choice: dục tình
  rationale: Trong danh sách thói xấu này, từ chỉ một đam mê mạnh mẽ và lệch lạc; “dục tình” vừa ngắn gọn vừa phân biệt được với “ham muốn xấu xa” kế tiếp.
- source_word: ἐπιθυμίαν κακήν
  choice: ham muốn xấu xa
  rationale: Dịch rõ cả danh từ “ham muốn” và tính từ đánh giá đạo đức κακήν.
- source_word: πλεονεξίαν
  choice: lòng tham
  rationale: Chỉ sự khao khát chiếm lấy nhiều hơn; “lòng tham” là cách nói hiện đại, rõ nghĩa và rộng hơn riêng lòng tham tiền bạc.
- source_word: ἥτις ἐστὶν εἰδωλολατρία
  choice: vốn là sự thờ thần tượng
  rationale: Giữ lời đồng nhất mạnh mẽ của Phao-lô và để mệnh đề quan hệ gắn tự nhiên với danh từ số ít đứng ngay trước là “lòng tham”.
theological_decisions:
- issue: Đối tượng được gọi là “sự thờ thần tượng”
  choice: Mệnh đề “vốn là sự thờ thần tượng” nói riêng về “lòng tham”.
  alternative: Mệnh đề này có thể được hiểu là lời tổng kết cho toàn bộ danh sách thói xấu.
  rationale: Đại từ quan hệ giống cái số ít ἥτις phù hợp tự nhiên nhất với danh từ giống cái số ít gần nhất là πλεονεξίαν. Cách dịch không làm nhẹ đi sự đồng nhất mạnh mẽ giữa lòng tham và sự thờ thần tượng.
- issue: Cách hiểu “những chi thể ở trên đất”
  choice: Giữ hình ảnh các chi thể trong câu chính.
  alternative: Diễn giải là “những gì thuộc về trần gian trong anh em” hoặc “bản tính trần tục của anh em”.
  rationale: Nguyên văn dùng μέλη, “chi thể”, và các danh từ theo sau có thể giải thích cụ thể những gì phải bị giết chết. Giữ ẩn dụ tránh đưa một khái niệm thần học trừu tượng không được nói thẳng trong câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu giữ mệnh lệnh mạnh, ẩn dụ “chi thể” và sự căng thẳng của cách diễn đạt nguyên văn; các cách hiểu diễn giải hơn được đưa vào chú thích.
