id: COL.3.21
reference: Colossians 3:21
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οἱ πατέρες, μὴ ἐρεθίζετε τὰ τέκνα ὑμῶν, ἵνα μὴ ἀθυμῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/021.yaml
  text: Fathers[a], do not provoke your children, so that they may not become discouraged.
translation:
  language: vi
  text: Hỡi những người cha, đừng chọc giận con cái mình, để chúng không nản lòng.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “mất tinh thần” hoặc “nhụt chí.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ πατέρες
  choice: Hỡi những người cha
  rationale: πατέρες chỉ cụ thể những người cha; cách dịch này giữ đúng đối tượng được trực tiếp nói đến trong các lời dạy về gia đình.
- source_word: μὴ ἐρεθίζετε
  choice: đừng chọc giận
  rationale: ἐρεθίζω ở đây nói đến việc kích động theo chiều hướng tiêu cực. “Chọc giận” tự nhiên trong tiếng Việt và diễn tả hành vi khiến con cái nổi giận hoặc bực tức.
- source_word: τὰ τέκνα ὑμῶν
  choice: con cái mình
  rationale: τέκνα là từ bao gồm các con, không phân biệt trai hay gái; “con cái mình” là cách diễn đạt tự nhiên và chính xác trong lời trực tiếp này.
- source_word: ἵνα μὴ
  choice: để ... không
  rationale: Giữ được sắc thái mục đích hoặc kết quả được nhắm tới của ἵνα μή bằng cấu trúc tiếng Việt rõ ràng, tự nhiên.
- source_word: ἀθυμῶσιν
  choice: nản lòng
  rationale: ἀθυμέω chỉ sự mất tinh thần, nhụt chí hay nản lòng; “nản lòng” ngắn gọn, dễ hiểu và giữ đúng trạng thái nội tâm được nói đến.
theological_decisions:
- issue: Phạm vi của πατέρες trong lời dạy về gia đình
  choice: Nói trực tiếp với những người cha
  alternative: Khái quát thành cha mẹ
  rationale: Bản Hy Lạp dùng danh từ chỉ “những người cha”. Dù nguyên tắc này có thể được áp dụng rộng hơn, bản dịch không nên thay đối tượng được nêu rõ bằng một đối tượng bao quát hơn.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Hỡi” đánh dấu rõ lời xưng gọi mà không quá cổ; “chọc giận” là cách nói thông dụng, còn “nản lòng” diễn đạt tự nhiên hậu quả tâm lý. Dấu chú thích [a] được đặt ngay sau cụm từ liên quan.
