id: COL.3.1
reference: Colossians 3:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Εἰ οὖν συνηγέρθητε τῷ Χριστῷ, τὰ ἄνω ζητεῖτε, οὗ ὁ Χριστός ἐστιν ἐν δεξιᾷ τοῦ θεοῦ καθήμενος·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/001.yaml
  text: If[a], then, you were raised with the Messiah, seek the things above[b], where the Messiah is, seated at the right hand of God.
translation:
  language: vi
  text: Vậy, nếu anh chị em đã được làm cho sống lại cùng Đấng Mê-si[a], hãy tìm kiếm những điều ở trên, là nơi Đấng Mê-si đang ngồi bên phải Đức Chúa Trời.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch phần đầu câu là: “Vậy, vì anh chị em đã được làm cho sống lại cùng Đấng Mê-si...” Trong tiếng Hy Lạp, câu giữ hình thức điều kiện (“nếu”), dù trong văn mạch điều này có lẽ được xem là đúng.'
    reason: alternative_reading
lexical_decisions:
- source_word: Εἰ οὖν
  choice: Vậy, nếu
  rationale: Giữ nguyên hình thức điều kiện của εἰ và sắc thái suy luận của οὖν; trong văn mạch, điều kiện này có vẻ được giả định là đúng nhưng không nên chuyển hẳn thành mệnh đề nguyên nhân.
- source_word: συνηγέρθητε
  choice: đã được làm cho sống lại cùng
  rationale: Động từ aorist bị động συνεγείρω chỉ việc được cùng làm cho trỗi dậy; cách diễn đạt này giữ thể bị động và ý liên hiệp với Đấng Mê-si, đồng thời tránh để 'được sống lại' bị hiểu đơn thuần là tự mình sống lại.
- source_word: τῷ Χριστῷ
  choice: cùng Đấng Mê-si
  rationale: Dữ cách diễn tả sự kết hợp/đồng hành. Χριστός vẫn mang ý nghĩa tước hiệu 'Đấng được xức dầu', nên dịch là 'Đấng Mê-si'.
- source_word: τὰ ἄνω
  choice: những điều ở trên
  rationale: Giữ dạng số nhiều của cụm trung tính dùng như danh từ và không diễn giải hẹp thành 'những điều thuộc thiên đàng'.
- source_word: ζητεῖτε
  choice: hãy tìm kiếm
  rationale: Mệnh lệnh hiện tại diễn tả sự hướng lòng và theo đuổi liên tục; 'hãy tìm kiếm' tự nhiên và giữ nghĩa căn bản của động từ.
- source_word: οὗ
  choice: là nơi
  rationale: Đại từ trạng ngữ chỉ nơi chốn quy chiếu về 'ở trên'; 'là nơi' nối mệnh đề quan hệ rõ ràng trong tiếng Việt.
- source_word: ὁ Χριστός
  choice: Đấng Mê-si
  rationale: Giữ nhất quán ý nghĩa tước hiệu của Χριστός trong câu.
- source_word: ἐν δεξιᾷ τοῦ θεοῦ
  choice: bên phải Đức Chúa Trời
  rationale: Cách nói tự nhiên trong tiếng Việt, bảo toàn hình ảnh về địa vị tôn quý và quyền trị vì mà không diễn giải thêm.
- source_word: καθήμενος
  choice: ngự, ngồi
  rationale: Phân từ hiện tại mô tả tư thế và địa vị hiện tại của Đấng Mê-si. 'Ngự, ngồi' vừa trang trọng vừa giữ hình ảnh cụ thể của động từ, không diễn giải quá mức thành 'ngự trên ngai'.
theological_decisions:
- issue: Sắc thái của mệnh đề điều kiện Εἰ
  choice: Giữ hình thức “Vậy, nếu”
  alternative: “Vậy, vì anh chị em đã...”
  rationale: Điều kiện trong văn mạch có khả năng giả định sự thật, nhưng bản Hy Lạp vẫn dùng hình thức điều kiện. Bản dịch giữ sự căng thẳng ấy thay vì âm thầm chuyển thành lời khẳng định nguyên nhân.
- issue: Cách dịch Χριστός
  choice: Đấng Mê-si
  alternative: Đấng Christ / Chúa Cứu Thế
  rationale: Ở đây tước hiệu của Đấng được xức dầu vẫn có ý nghĩa trong lời nói về sự liên hiệp với Đấng được tôn cao; 'Đấng Mê-si' bảo toàn chức năng tước hiệu mà không thêm ý nghĩa ngoài văn bản.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” cho ngôi thứ hai số nhiều nhằm diễn đạt cộng đồng tín hữu gồm cả nam lẫn nữ. Giữ “những điều ở trên” để bảo toàn độ rộng và tính gợi mở của nguyên văn.
