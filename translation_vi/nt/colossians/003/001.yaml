review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch nhìn chung bám sát câu Hy Lạp: giữ điều kiện εἰ οὖν, thể bị động của συνηγέρθητε, số nhiều của τὰ ἄνω, và hình ảnh Đấng Mê-si ngồi bên phải Đức Chúa Trời. Tuy nhiên, “ngự, ngồi” diễn đạt cùng một ý hai lần và dấu chân trang chưa đặt sát mệnh đề điều kiện mà chú thích giải thích.'
  naturalness: “Vậy, nếu anh chị em...” và “hãy tìm kiếm những điều ở trên” là tự nhiên, trang trọng. Cụm “ngự, ngồi” không tự nhiên vì phối hợp thừa hai động từ; “đang ngồi” diễn đạt rõ phân từ hiện tại καθήμενος.
  terminology: “Đấng Mê-si” nhất quán cho Χριστός với tư cách tước hiệu. “Đức Chúa Trời” và “bên phải” phù hợp văn phong Kinh Thánh tiếng Việt hiện đại. “Anh chị em” chuyển đạt đúng số nhiều cộng đồng mà không thêm nghĩa thần học.
  issues:
