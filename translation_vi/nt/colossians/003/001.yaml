    issue: Cụm “ngự, ngồi” bị lặp nghĩa và không trôi chảy.
    rationale: καθήμενος chỉ cần được diễn đạt bằng một động từ tư thế/trạng thái. “Đang ngồi” giữ nghĩa hiện tại của phân từ và tránh lối ghép từ thừa.
  - severity: low
    issue: Dấu chú thích [a] đang đặt ở cuối toàn câu thay vì gần mệnh đề điều kiện mà chú thích đề cập.
    rationale: Chú thích chỉ giải thích cách hiểu “nếu” ở đầu câu; đặt sau mệnh đề này giúp neo chú thích chính xác hơn.
