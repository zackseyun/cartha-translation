  to: Vậy, nếu anh chị em đã được làm cho sống lại cùng Đấng Mê-si[a], hãy tìm kiếm những điều ở trên, là nơi Đấng Mê-si đang ngồi bên phải Đức Chúa Trời.
  rationale: Sửa tối thiểu để loại bỏ sự trùng lặp “ngự, ngồi”, biểu đạt tự nhiên phân từ hiện tại bằng “đang ngồi”, và chuyển dấu chú thích đến đúng mệnh đề điều kiện. Các lựa chọn còn lại được giữ vì phản ánh trung thành nguyên văn và phù hợp tiếng Việt hiện đại.
