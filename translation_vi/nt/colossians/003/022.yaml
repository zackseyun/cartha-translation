id: COL.3.22
reference: Colossians 3:22
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οἱ δοῦλοι, ὑπακούετε κατὰ πάντα τοῖς κατὰ σάρκα κυρίοις, μὴ ἐν ⸀ὀφθαλμοδουλίαις, ὡς ἀνθρωπάρεσκοι, ἀλλ’ ἐν ἁπλότητι καρδίας, φοβούμενοι τὸν ⸀κύριον.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/022.yaml
  text: Servants[a], obey in everything those who are your masters according to the flesh, not with eye-service, as people-pleasers, but with sincerity of heart[b][c], fearing the Lord.
translation:
  language: vi
  text: Hỡi những người nô lệ[a], hãy vâng phục những người chủ theo xác thịt[b] của mình trong mọi sự, không theo lối chỉ làm khi người ta nhìn thấy[c], như những kẻ làm vừa lòng người ta, nhưng với tấm lòng chân thành, kính sợ Chúa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hy Lạp δοῦλοι chỉ những người nô lệ ở dưới quyền chủ; đôi khi cũng được dịch là “đầy tớ”, nhưng ở đây không nên hiểu như người làm thuê hiện đại.
    reason: lexical_alternative
  - marker: b
    text: “Theo xác thịt” có thể hiểu là “ở đời này”, nhấn mạnh rằng quyền của các chủ này chỉ thuộc phạm vi quan hệ con người, không phải quyền tối hậu.
    reason: lexical_alternative
  - marker: c
    text: Cụm từ này dịch thành ngữ Hy Lạp chỉ lối làm việc chỉ khi có người nhìn thấy hoặc giám sát.
    reason: cultural_note
lexical_decisions:
- source_word: οἱ δοῦλοι
  choice: những người nô lệ
  rationale: Trong quy tắc gia đình cổ đại này, δοῦλοι chỉ những người bị đặt dưới quyền sở hữu và cai quản của chủ; “nô lệ” diễn đạt thẳng thực trạng xã hội, không làm nhẹ thành quan hệ lao động hiện đại.
- source_word: ὑπακούετε κατὰ πάντα
  choice: hãy vâng phục ... trong mọi sự
  rationale: Giữ lực mệnh lệnh của ὑπακούετε và phạm vi rộng của κατὰ πάντα bằng cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: τοῖς κατὰ σάρκα κυρίοις
  choice: những người chủ theo xác thịt của mình
  rationale: “Người chủ” phù hợp với quan hệ chủ–nô; “theo xác thịt” giữ nguyên cách nói Phao-lô dùng để giới hạn và phân biệt quyền của chủ nhân loại với Chúa.
- source_word: μὴ ἐν ὀφθαλμοδουλίαις
  choice: không phải chỉ phục vụ trước mắt
  rationale: Diễn đạt ý phục vụ nhằm được thấy, tức chỉ làm khi bị quan sát, thay vì dùng một từ ghép vay mượn khó hiểu trong tiếng Việt.
- source_word: ὡς ἀνθρωπάρεσκοι
  choice: như những kẻ làm đẹp lòng người ta
  rationale: Giữ sắc thái chê trách của danh từ, đồng thời dùng lối nói tự nhiên và rõ nghĩa.
- source_word: ἀλλ’ ἐν ἁπλότητι καρδίας
  choice: nhưng với tấm lòng chân thành
  rationale: Trong ngữ cảnh đạo đức, ἁπλότης nói đến sự đơn nhất, không hai lòng và chân thật, chứ không phải sự đơn giản về trí tuệ.
- source_word: φοβούμενοι τὸν κύριον
  choice: kính sợ Chúa
  rationale: “Kính sợ” bảo tồn khái niệm Kinh Thánh về sự sợ Chúa gắn với lòng tôn kính; “Chúa” phân biệt Đấng có thẩm quyền tối hậu với những người chủ theo xác thịt.
theological_decisions:
- issue: Lời dạy đạo đức trong bối cảnh chế độ nô lệ
  choice: Dịch rõ là “những người nô lệ” và “những người chủ”, đồng thời giữ sự tương phản giữa các chủ theo xác thịt và Chúa.
  alternative: Dịch nhẹ thành “đầy tớ”, “người làm” hoặc hiểu các chủ như chủ lao động hiện đại.
  rationale: Bản Hy Lạp phản ánh quan hệ nô lệ thực sự trong thế giới cổ đại. Làm mềm thành quan hệ thuê mướn sẽ che khuất thực trạng lịch sử và căng thẳng đạo đức của câu, còn việc dịch đúng thực trạng không đồng nghĩa với tán thành thể chế ấy.
- issue: Ý nghĩa của κατὰ σάρκα
  choice: Giữ “theo xác thịt” trong chính văn và giải thích trong chú thích.
  alternative: Dịch trực tiếp là “ở đời này” hoặc “trên trần gian”.
  rationale: Cách dịch sát giữ thuật ngữ và sự tương phản thần học trong lời văn của Phao-lô, trong khi chú thích giúp độc giả hiện đại hiểu đây là thẩm quyền thuộc quan hệ con người ở đời này.
- issue: Đối tượng của τὸν κύριον
  choice: Hiểu là Chúa, đối lập với những người chủ loài người.
  alternative: Dịch là “Người Chủ” để khai thác lối chơi chữ chủ–Chúa.
  rationale: Mạo từ và ngữ cảnh của thư chỉ về Chúa là thẩm quyền tối hậu; “Chúa” là danh xưng thần linh tự nhiên hơn trong tiếng Việt và tránh đồng nhất Ngài với các chủ nô.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ “nô lệ” để phản ánh đúng bối cảnh lịch sử; giữ thành ngữ Phao-lô “theo xác thịt” nhưng bổ sung chú thích; dùng “phục vụ trước mắt” thay cho một từ ghép kỹ thuật xa lạ. Các dấu chú thích [a], [b], [c] đều được đặt ngay sau cụm từ tương ứng trong chính văn.
