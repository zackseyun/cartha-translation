  - severity: low
    issue: “làm đẹp lòng người ta” hơi kém tự nhiên trong văn phong hiện đại.
    rationale: “Làm vừa lòng người ta” là cách nói hiện đại, tự nhiên và vẫn diễn đạt đúng ý làm để được người khác hài lòng.
