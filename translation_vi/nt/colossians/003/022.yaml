revisions:
- from: Hỡi những người nô lệ[a], hãy vâng phục những người chủ theo xác thịt[b] của mình trong mọi sự, không phải chỉ phục vụ trước mắt[c] như những kẻ làm đẹp lòng người ta, nhưng với tấm lòng chân thành, kính sợ Chúa.
  to: Hỡi những người nô lệ[a], hãy vâng phục những người chủ theo xác thịt[b] của mình trong mọi sự, không theo lối chỉ làm khi người ta nhìn thấy[c], như những kẻ làm vừa lòng người ta, nhưng với tấm lòng chân thành, kính sợ Chúa.
  rationale: 'Bản sửa làm rõ nghĩa của ὀφθαλμοδουλίαις bằng một cách diễn đạt tiếng Việt hiện đại, đồng thời duy trì cấu trúc đối lập của câu: không làm để được người khác thấy và vừa lòng họ, nhưng hành động với lòng chân thành, kính sợ Chúa. Các chú thích vẫn đặt đúng sau những cụm từ được giải thích và giữ nguyên ý nghĩa lịch sử-thần học của bản văn.'
