id: COL.3.4
reference: Colossians 3:4
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὅταν ὁ Χριστὸς φανερωθῇ, ἡ ζωὴ ⸀ὑμῶν, τότε καὶ ὑμεῖς σὺν αὐτῷ φανερωθήσεσθε ἐν δόξῃ.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/004.yaml
  text: When Messiah[a], who is your life, is revealed[c][b], then you also will be revealed with him in glory.
translation:
  language: vi
  text: Khi Đấng Mê-si-a, là sự sống của anh chị em,[a] được bày tỏ, thì anh chị em cũng sẽ được bày tỏ cùng với Ngài trong vinh quang.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát nghĩa: “Đấng Mê-si-a, sự sống của anh chị em.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “thì anh chị em cũng sẽ xuất hiện cùng với Ngài trong vinh quang.” Động từ Hy Lạp ở đây cùng gốc với động từ được dịch là “được bày tỏ” trước đó.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν
  choice: Khi
  rationale: Dẫn vào một sự kiện tương lai được trông đợi; “khi” tự nhiên hơn “bất cứ khi nào” trong ngữ cảnh này.
- source_word: ὁ Χριστὸς
  choice: Đấng Mê-si-a
  rationale: Dịch Χριστός theo nghĩa tước hiệu, phù hợp với mạo từ và giữ rõ ý nghĩa “Đấng được xức dầu” thay vì chỉ dùng dạng phiên âm.
- source_word: φανερωθῇ
  choice: được bày tỏ
  rationale: Giữ thể bị động và ý trở nên công khai, hữu hình; đồng thời cho phép lặp cùng cách dịch ở động từ sau.
- source_word: ἡ ζωὴ ὑμῶν
  choice: là sự sống của anh chị em
  rationale: Diễn đạt tự nhiên cấu trúc đồng vị “Đấng Mê-si-a, sự sống của anh chị em” mà không làm suy yếu sự đồng nhất mạnh mẽ trong nguyên văn.
- source_word: τότε καὶ ὑμεῖς
  choice: thì anh chị em cũng
  rationale: “Thì” giữ quan hệ thời gian-hệ quả, “cũng” giữ sắc thái bao gồm, còn “anh chị em” diễn đạt đại từ số nhiều có nhấn mạnh.
- source_word: σὺν αὐτῷ
  choice: cùng với Ngài
  rationale: Giữ ý hiệp cùng và tham dự; “Ngài” là đại từ tôn kính tự nhiên khi chỉ Đấng Mê-si-a.
- source_word: φανερωθήσεσθε
  choice: sẽ ... được bày tỏ
  rationale: Giữ thì tương lai, thể bị động và sự song hành từ vựng với φανερωθῇ ở mệnh đề đầu.
- source_word: ἐν δόξῃ
  choice: trong vinh quang
  rationale: Giữ nguyên cấu trúc giới từ cùng sức nặng thần học, không thu hẹp thành một trạng từ chỉ cách thức.
theological_decisions:
- issue: Dịch Χριστός như tước hiệu hay dạng tên gọi
  choice: Đấng Mê-si-a
  alternative: Đấng Christ
  rationale: Nguyên văn có mạo từ và dùng Χριστός trong một tuyên bố mang tính tước hiệu; “Đấng Mê-si-a” chuyển tải nghĩa của tước hiệu rõ hơn.
- issue: Mối quan hệ đồng vị giữa Đấng Mê-si-a và sự sống của tín hữu
  choice: Đấng Mê-si-a, là sự sống của anh chị em
  alternative: Đấng Mê-si-a, sự sống của anh chị em
  rationale: Thêm “là” chỉ để câu tiếng Việt rõ và tự nhiên, vẫn giữ lời khẳng định trực tiếp rằng Đấng Mê-si-a chính là sự sống của họ.
- issue: Sự song hành giữa hai lần dùng φανερόω
  choice: Cả hai lần đều dịch là “được bày tỏ”
  alternative: Lần đầu “hiện ra”, lần sau “được bày tỏ”
  rationale: 'Giữ thể bị động và sự liên kết thần học trong nguyên văn: sự bày tỏ của tín hữu gắn với sự bày tỏ của Đấng Mê-si-a.'
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” cho đại từ số nhiều ὑμεῖς; dùng “Đấng Mê-si-a” như tước hiệu và “Ngài” làm đại từ tôn kính. Hai dấu chú thích [a], [b] đều xuất hiện trong chính văn.
