revisions:
- from: Khi Đấng Mê-si-a, là sự sống của anh chị em,[a] được bày tỏ, thì anh chị em cũng sẽ cùng với Ngài được bày tỏ trong vinh quang.[b]
  to: Khi Đấng Mê-si-a, là sự sống của anh chị em,[a] được bày tỏ, thì anh chị em cũng sẽ được bày tỏ cùng với Ngài trong vinh quang.[b]
  rationale: Chỉ điều chỉnh vị trí của cụm «cùng với Ngài» để câu tiếng Việt tự nhiên hơn. Bản sửa vẫn giữ song hành «được bày tỏ» ở cả hai động từ, ý đồng vị, thì tương lai, sắc thái bao gồm của «cũng», và cụm «trong vinh quang».
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T20:18:53Z'
