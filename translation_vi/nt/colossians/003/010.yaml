source:
  edition: SBLGNT
  text: καὶ ἐνδυσάμενοι τὸν νέον τὸν ἀνακαινούμενον εἰς ἐπίγνωσιν κατ’ εἰκόνα τοῦ κτίσαντος αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/010.yaml
  text: and have put on the new self[a], which is being renewed in knowledge according to the image of the one who created it[b],
translation:
  language: vi
  text: và đã mặc lấy con người mới[a], là con người đang được đổi mới trong sự nhận biết[b], theo hình ảnh của Đấng đã tạo dựng con người ấy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “bản thân mới.” Cụm từ Hy Lạp đối lập với “con người cũ” trong văn cảnh và có thể nhấn mạnh con người hay căn tính đã được đổi mới.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “sự nhận biết đầy đủ.” Từ Hy Lạp có thể mang nghĩa nhận biết đầy đủ hoặc sâu xa hơn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνδυσάμενοι
  choice: đã mặc lấy
  rationale: Phân từ bất định trung động tiếp nối mạch văn trước; cách dịch này giữ hình ảnh mặc áo và diễn tả hành động đã xảy ra.
- source_word: τὸν νέον
  choice: con người mới
  rationale: Tính từ được dùng như danh từ và đối lập với “con người cũ” trong văn cảnh. Tiếng Việt “con người” không nhất thiết chỉ nam giới, đồng thời giữ được sắc thái nhân học của nguyên văn.
- source_word: ἀνακαινούμενον
  choice: đang được đổi mới
  rationale: Phân từ hiện tại bị động diễn tả một tiến trình liên tục và giữ rõ tác nhân không được nêu trực tiếp.
- source_word: εἰς ἐπίγνωσιν
  choice: để đạt đến sự nhận biết
  rationale: “Để đạt đến” thể hiện hướng đi hoặc kết quả của εἰς trong tiến trình đổi mới; “sự nhận biết” không áp đặt sắc thái “đầy đủ” nhưng vẫn cho phép chú thích khả năng đó.
- source_word: κατ’ εἰκόνα
  choice: theo hình ảnh
  rationale: κατά với đối cách chỉ khuôn mẫu hay chuẩn mực; cách dịch này tự nhiên và giữ liên hệ có thể có với ngôn ngữ về hình ảnh trong Sáng Thế Ký.
- source_word: τοῦ κτίσαντος αὐτόν
  choice: của Đấng đã tạo dựng con người ấy
  rationale: Cụm phân từ sở hữu xác định Đấng Tạo Hóa làm khuôn mẫu. Lặp lại “con người ấy” giúp tiếng Việt rõ nghĩa và phù hợp với đại từ giống đực αὐτόν quy chiếu về τὸν νέον.
theological_decisions:
- issue: Ý nghĩa nhân học của τὸν νέον
  choice: con người mới
  alternative: bản thân mới
  rationale: “Con người mới” bám sát cấu trúc Hy Lạp, hòa hợp với sự đối lập “con người cũ/con người mới,” và không buộc câu chỉ nói về một nam giới. Chú thích giữ lại khả năng diễn đạt theo phương diện bản thân hay căn tính.
- issue: Mức độ nhấn mạnh của ἐπίγνωσις
  choice: sự nhận biết
  alternative: sự nhận biết đầy đủ
  rationale: Từ Hy Lạp có thể gợi sự nhận biết sâu xa hay đầy đủ, nhưng thêm “đầy đủ” vào chính văn có nguy cơ diễn giải quá mức; sắc thái ấy được giữ trong chú thích.
- issue: Sắc thái hướng đích của εἰς
  choice: để đạt đến
  alternative: trong
  rationale: Cách dịch chính giữ ý hướng tới kết quả của εἰς thay vì biến cụm từ đơn thuần thành phạm vi của sự đổi mới, dù “trong sự nhận biết” tự nhiên hơn trong một số cách hiểu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ ẩn dụ “mặc lấy,” thể bị động và tiến trình liên tục của nguyên văn. Dùng “Đấng” để biểu thị chủ thể thần linh trong văn cảnh mà không thêm danh xưng không có trong câu.
