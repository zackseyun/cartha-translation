  - severity: low
    issue: Lý do từ vựng cho τὰ ἐπὶ τῆς γῆς khẳng định “dưới đất” là tự nhiên
    rationale: Lý do này cần được điều chỉnh để phù hợp với nghĩa của giới từ ἐπί và bản dịch đã sửa.
