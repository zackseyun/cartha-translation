  text: Set your minds on the things above[b][a], not on the things on the earth.
translation:
  language: vi
  text: Hãy hướng tâm trí về những điều ở trên[a], không phải về những điều trên đất[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Hãy nghĩ đến những điều ở trên.” Động từ Hy Lạp không chỉ nói đến suy nghĩ, mà còn bao hàm việc hướng tâm trí, thái độ hoặc mối quan tâm vào một điều gì đó.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “những điều thuộc đất.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ἄνω
  choice: những điều ở trên
  rationale: Cụm mạo từ trung tính số nhiều đi với phó từ ἄνω được dùng như danh từ, chỉ những thực tại hay điều thuộc cõi trên; cách dịch này giữ số nhiều và thế đối lập không gian với những điều ở dưới đất.
- source_word: φρονεῖτε
  choice: Hãy hướng tâm trí vào
  rationale: φρονέω không chỉ nói đến việc suy nghĩ, mà còn đến định hướng tư tưởng, thái độ và mối quan tâm. Cách dịch này chuyển tải mệnh lệnh về một định hướng liên tục mà không thêm nội dung thần học ngoài nguyên văn.
- source_word: μὴ
  choice: chứ không phải
  rationale: μή phủ định đối tượng thứ hai trong một cấu trúc tương phản. “Chứ không phải” diễn đạt tự nhiên và rõ nét sự đối lập ấy trong tiếng Việt.
- source_word: τὰ ἐπὶ τῆς γῆς
  choice: những điều ở dưới đất
  rationale: Cách nói này giữ cấu trúc danh từ số nhiều và sự đối lập cụ thể giữa bên trên với mặt đất; “dưới đất” tự nhiên trong tiếng Việt khi đặt đối xứng với “ở trên”.
- source_word: γῆς
  choice: đất
  rationale: Trong thế đối lập mang tầm vũ trụ với “ở trên”, γῆ chỉ trái đất hay cõi đất, không phải một miền lãnh thổ riêng.
theological_decisions:
- issue: Ý nghĩa lời khuyên trong φρονεῖτε
  choice: Lời kêu gọi định hướng tâm trí, thái độ và mối quan tâm vào những thực tại ở trên
  alternative: Một mệnh lệnh hẹp hơn, chỉ yêu cầu suy nghĩ bằng trí óc về cõi trời
  rationale: Trường nghĩa của φρονέω bao gồm tư duy, thái độ và khuynh hướng nội tâm. “Hướng tâm trí vào” giữ được chiều rộng đạo đức và tâm linh của động từ mà không đồng nhất “ở trên” với một hệ giải thích giáo phái cụ thể.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Hướng tâm trí vào” tự nhiên hơn lối dịch sát chữ “tư tưởng những điều,” đồng thời giữ được sắc thái định hướng liên tục. “Ở dưới đất” làm rõ thế đối xứng với “ở trên”; chú thích bảo lưu cách diễn đạt ngắn và sát cấu trúc hơn là “trên đất.”
