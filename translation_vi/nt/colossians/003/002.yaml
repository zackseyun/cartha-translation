  to: Hãy hướng tâm trí về những điều ở trên[a], không phải về những điều trên đất[b].
  rationale: Sửa “ở dưới đất” thành “trên đất” để phản ánh chính xác τὰ ἐπὶ τῆς γῆς. Điều chỉnh nhẹ cách nối với “về” để tiếng Việt tự nhiên và làm rõ rằng cả hai cụm đều là đối tượng của φρονεῖτε. Chú thích b được thay bằng một phương án thành ngữ thực sự khác với cách dịch chính.
