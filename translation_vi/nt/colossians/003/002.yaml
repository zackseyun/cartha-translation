  source_fidelity: Bản dịch cần sửa cụm δεύτερο τὰ ἐπὶ τῆς γῆς. Cụm này nghĩa là “những điều trên đất,” đối lập với “những điều ở trên”; “ở dưới đất” thường chỉ ở bên dưới mặt đất/ngầm dưới đất trong tiếng Việt và không phản ánh nguyên văn.
  naturalness: “Hãy hướng tâm trí về” là cách diễn đạt hiện đại, tự nhiên, đồng thời truyền đạt sắc thái định hướng tâm trí và mối quan tâm của φρονεῖτε. Cấu trúc “không phải về” làm rõ đối tượng tương phản mà không thêm ý nghĩa.
  terminology: Giữ “những điều ở trên” và “những điều trên đất” để phản ánh hai cụm trung tính số nhiều được danh từ hóa và thế đối lập không gian của bản Hy Lạp. Không nên dùng “dưới đất,” vì từ này đổi quan hệ không gian thành “bên dưới đất.”
