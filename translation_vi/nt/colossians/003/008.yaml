- from: 'Nhưng bây giờ, chính anh chị em cũng phải loại bỏ tất cả những điều này: giận dữ, thịnh nộ, ác ý, lời phỉ báng và lời lẽ tục tĩu ra khỏi miệng mình.'
  to: 'Nhưng bây giờ, anh chị em cũng phải loại bỏ tất cả những điều ấy: giận dữ, thịnh nộ, ác ý, lời phỉ báng, và lời lẽ tục tĩu thốt ra từ miệng anh chị em.'
  rationale: Chỉ sửa phần cuối câu để phản ánh rõ hơn chức năng của ἐκ τοῦ στόματος ὑμῶν, đồng thời tránh chuyển số ngôi từ “anh chị em” sang cách nói có thể hiểu là số ít “mình”. Các lựa chọn từ vựng còn lại trung thành với văn bản Hy Lạp và phù hợp tiếng Việt hiện đại.
  reviewer_model: gpt-5.6-terra
