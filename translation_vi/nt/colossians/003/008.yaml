id: COL.3.8
reference: Colossians 3:8
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: νυνὶ δὲ ἀπόθεσθε καὶ ὑμεῖς τὰ πάντα, ὀργήν, θυμόν, κακίαν, βλασφημίαν, αἰσχρολογίαν ἐκ τοῦ στόματος ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/008.yaml
  text: 'But now you also must put away all these things: anger, rage, malice, slander, and filthy speech from your mouth.'
translation:
  language: vi
  text: 'Nhưng bây giờ, anh chị em cũng phải loại bỏ tất cả những điều ấy: giận dữ, thịnh nộ, ác ý, lời phỉ báng, và lời lẽ tục tĩu thốt ra từ miệng anh chị em.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπόθεσθε
  choice: phải loại bỏ
  rationale: Động từ mang hình ảnh cởi bỏ hoặc gạt bỏ; “loại bỏ” diễn đạt tự nhiên mệnh lệnh từ bỏ các thói xấu trong tiếng Việt hiện đại.
- source_word: ὀργήν
  choice: giận dữ
  rationale: Chỉ sự tức giận nói chung hoặc cơn giận dai dẳng; phân biệt với θυμός ở từ kế tiếp.
- source_word: θυμόν
  choice: thịnh nộ
  rationale: Diễn tả cơn nóng giận bùng phát hoặc mãnh liệt, giữ được nét khác với ὀργή.
- source_word: κακίαν
  choice: ác ý
  rationale: Trong chuỗi hành vi quan hệ và lời nói này, từ chỉ ý muốn gây hại hoặc tâm địa độc ác; “ác ý” phù hợp ngữ cảnh.
- source_word: βλασφημίαν
  choice: lời phỉ báng
  rationale: Ở đây từ có thể chỉ lời xúc phạm, bôi nhọ người khác, không nhất thiết chỉ sự phạm thượng đối với Đức Chúa Trời.
- source_word: αἰσχρολογίαν
  choice: lời lẽ tục tĩu
  rationale: Chỉ lời nói đáng hổ thẹn, thô tục hoặc bẩn thỉu; cách dịch này rõ nghĩa và tự nhiên.
- source_word: ἐκ τοῦ στόματος ὑμῶν
  choice: ra khỏi miệng mình
  rationale: Giữ hình ảnh cụ thể của nguyên văn và liên kết trực tiếp các tội về lời nói với miệng của người đọc.
theological_decisions:
- issue: Phạm vi của βλασφημία
  choice: lời phỉ báng
  alternative: lời phạm thượng
  rationale: Không có đối tượng thần linh được nêu, và vị trí giữa “ác ý” với “lời lẽ tục tĩu” thiên về lời xúc phạm hoặc bôi nhọ người khác; không thu hẹp nghĩa vào sự phạm thượng.
- issue: Sắc thái mệnh lệnh của ἀπόθεσθε
  choice: phải loại bỏ
  alternative: hãy cởi bỏ
  rationale: “Phải” truyền đạt lực mệnh lệnh rõ ràng; “loại bỏ” giữ ý từ bỏ hoàn toàn mà không ép người đọc phải hiểu hình ảnh quần áo vốn chỉ hàm ẩn trong động từ.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “anh chị em” cho số nhiều ὑμεῖς; “chính ... cũng” phản ánh καὶ ὑμεῖς. Danh sách được giữ ngắn gọn, có nhịp điệu và phân biệt hai sắc thái giận dữ.
