revisions:
- from: Ở đó không còn người Hy Lạp hay người Do Thái, người chịu cắt bì hay người không chịu cắt bì, người man di, người Scythia, nô lệ hay người tự do; nhưng Đấng Mê-si-a[a] là tất cả và ở trong tất cả.[b]
  to: Ở đó không có người Hy Lạp hay người Do Thái, người chịu cắt bì hay người không chịu cắt bì, người man di, người Scythia, nô lệ hay người tự do; nhưng Đấng Mê-si-a[a] là tất cả và ở trong tất cả.[b]
  rationale: Chỉ thay “không còn” bằng “không có.” Sửa đổi này khôi phục sắc thái phi thời gian của οὐκ ἔνι, đồng thời giữ nguyên ý nghĩa, cấu trúc liệt kê, thuật ngữ chủ chốt và các chú thích của bản dự thảo.
