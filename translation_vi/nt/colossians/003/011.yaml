id: COL.3.11
reference: Colossians 3:11
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὅπου οὐκ ἔνι Ἕλλην καὶ Ἰουδαῖος, περιτομὴ καὶ ἀκροβυστία, βάρβαρος, Σκύθης, δοῦλος, ἐλεύθερος, ἀλλὰ ⸀τὰ πάντα καὶ ἐν πᾶσιν Χριστός.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/011.yaml
  text: where there is no Greek and Jew[a], circumcision and uncircumcision, barbarian, Scythian, servant, free, but Messiah is all[c][b], and in all.
translation:
  language: vi
  text: Ở đó không có người Hy Lạp hay người Do Thái, người chịu cắt bì hay người không chịu cắt bì, người man di, người Scythia, nô lệ hay người tự do; nhưng Đấng Mê-si-a[a] là tất cả và ở trong tất cả.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hy Lạp là Christos, nghĩa là “Đấng Mê-si-a” hay “Đấng được xức dầu”; theo cách gọi truyền thống: “Đấng Christ.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể hiểu: “Đấng Mê-si-a là tất cả và ở trong mọi người.” Cụm Hy Lạp “ở trong tất cả” rất cô đọng; trong ngữ cảnh, nó có thể chỉ mọi thành viên của cộng đồng được đổi mới, nhưng cũng có thể được hiểu rộng hơn.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὅπου
  choice: Ở đó
  rationale: Chỉ phạm vi của con người mới được nói đến ở câu trước; cách diễn đạt này tự nhiên trong tiếng Việt và vẫn giữ sắc thái chỉ nơi/phạm vi.
- source_word: οὐκ ἔνι
  choice: không còn
  rationale: Trong ngữ cảnh cộng đồng được đổi mới, cụm từ nói rằng các phân biệt này không còn giữ địa vị chi phối; “không còn” là cách nói tiếng Việt tự nhiên mà không hàm ý các dân tộc hay địa vị xã hội đã biến mất theo nghĩa đen.
- source_word: Ἕλλην καὶ Ἰουδαῖος
  choice: người Hy Lạp hay người Do Thái
  rationale: Giữ đúng hai căn tính dân tộc-văn hóa cụ thể của bản Hy Lạp; “hay” phù hợp với chuỗi đối lập nằm dưới mệnh đề phủ định trong tiếng Việt.
- source_word: περιτομὴ καὶ ἀκροβυστία
  choice: người chịu cắt bì hay người không chịu cắt bì
  rationale: Các danh từ trừu tượng được dùng như dấu hiệu căn tính xã hội-tôn giáo; chuyển thành cách gọi người giúp câu văn rõ và tự nhiên trong tiếng Việt.
- source_word: βάρβαρος
  choice: người man di
  rationale: Giữ sức nặng của nhãn gọi cổ đại dành cho người bị thế giới Hy-La xem là ngoài văn minh; không làm nhẹ thành “người nước ngoài”.
- source_word: Σκύθης
  choice: người Scythia
  rationale: Đây là tên một dân tộc cụ thể, nên được phiên chuyển theo dạng tên địa-dân tộc quen dùng thay vì khái quát hóa.
- source_word: δοῦλος
  choice: nô lệ
  rationale: Sự đối lập trực tiếp với ἐλεύθερος làm nổi bật địa vị bị lệ thuộc pháp lý-xã hội; “nô lệ” chính xác hơn “đầy tớ” ở đây.
- source_word: ἐλεύθερος
  choice: người tự do
  rationale: Diễn đạt rõ địa vị xã hội đối lập với nô lệ.
- source_word: τὰ πάντα
  choice: là tất cả
  rationale: Giữ cách nói cô đọng và bao quát của nguyên văn, không bổ sung một cách giải thích siêu hình cụ thể.
- source_word: ἐν πᾶσιν
  choice: ở trong tất cả
  rationale: Giữ sự cô đọng và độ mở của nguyên văn, có thể được hiểu chủ yếu về mọi thành viên trong cộng đồng mới nhưng không bị thu hẹp ngay trong chính văn.
- source_word: Χριστός
  choice: Đấng Mê-si-a
  rationale: Dịch ý nghĩa tước hiệu Χριστός trong vị trí mang tính thần học này; chú thích cung cấp cách gọi truyền thống.
theological_decisions:
- issue: Phạm vi của ἐν πᾶσιν
  choice: ở trong tất cả
  alternative: ở trong mọi người; ở trong mọi sự
  rationale: Ngữ cảnh trước hết hướng đến mọi thành viên của cộng đồng được đổi mới, nhưng cụm Hy Lạp ngắn gọn và có thể mang phạm vi rộng hơn. Chính văn giữ độ mở, còn chú thích nêu các khả năng.
- issue: Cách dịch Χριστός
  choice: Đấng Mê-si-a
  alternative: Đấng Christ
  rationale: Ở đây Χριστός có chức năng tước hiệu; dịch nghĩa giúp độc giả nhận ra nội dung “Đấng được xức dầu,” trong khi cách gọi truyền thống được ghi ở chú thích.
- issue: Ý nghĩa của việc các phân biệt “không còn”
  choice: không còn
  alternative: không có
  rationale: Câu không nhất thiết phủ nhận sự tồn tại thực tế của các dân tộc và địa vị xã hội, mà tuyên bố chúng không còn định đoạt căn tính trong con người mới. “Không còn” truyền đạt điều này mà không thêm lời giải nghĩa vào câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng các cặp “hay” dưới mệnh đề phủ định để câu tự nhiên trong tiếng Việt; dùng dấu chấm phẩy trước mệnh đề tương phản nhằm làm rõ cấu trúc liệt kê. “Người man di” được giữ như một nhãn gọi thuộc bối cảnh cổ đại, không phải sự tán thành cách miệt thị đó.
