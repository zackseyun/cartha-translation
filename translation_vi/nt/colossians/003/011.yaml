    rationale: οὐκ ἔνι diễn tả sự vắng mặt/không có trong phạm vi được nêu bởi ὅπου, không tự nó hàm ý sự thay đổi theo thời gian. “Không có” giữ sát nguyên văn hơn và tránh diễn giải thêm.
