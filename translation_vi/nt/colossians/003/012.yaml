  to: Vậy, như những người được Đức Chúa Trời chọn, thánh khiết và được yêu thương, anh chị em hãy mặc lấy lòng thương xót sâu xa[a], lòng nhân từ, sự khiêm nhường, sự dịu dàng[b] và lòng kiên nhẫn[c].
