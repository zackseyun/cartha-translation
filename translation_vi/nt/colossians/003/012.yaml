id: COL.3.12
reference: Colossians 3:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἐνδύσασθε οὖν ὡς ἐκλεκτοὶ τοῦ θεοῦ, ἅγιοι καὶ ἠγαπημένοι, σπλάγχνα οἰκτιρμοῦ, χρηστότητα, ταπεινοφροσύνην, πραΰτητα, μακροθυμίαν,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/012.yaml
  text: Put on[a], then, as God’s chosen ones, holy and beloved, compassion, kindness, humility, gentleness[b], and patience[c],
translation:
  language: vi
  text: Vậy, như những người được Đức Chúa Trời chọn, thánh khiết và được yêu thương, anh chị em hãy mặc lấy lòng thương xót sâu xa[a], lòng nhân từ, sự khiêm nhường, sự dịu dàng[b] và lòng kiên nhẫn[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn Hy Lạp nói đến “những phần sâu bên trong của lòng thương xót,” một thành ngữ chỉ lòng thương xót sâu xa.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “sự nhu mì.”
    reason: lexical_alternative
  - marker: c
    text: Từ Hy Lạp nhấn mạnh sự nhẫn nại lâu dài, nhất là đối với người khác; cũng có thể dịch là “sự nhịn nhục.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐνδύσασθε
  choice: hãy mặc lấy
  rationale: Giữ nguyên ẩn dụ mặc áo của động từ ἐνδύω, đồng thời diễn đạt rõ sắc thái mệnh lệnh trong tiếng Việt tự nhiên.
- source_word: οὖν
  choice: Vậy
  rationale: Nối lời khuyên này với phần lập luận đi trước và biểu thị ý suy ra mà không quá trang trọng.
- source_word: ὡς
  choice: là
  rationale: Diễn đạt việc các độc giả phải sống phù hợp với căn tính thật của mình; không chuyển hẳn sang nghĩa nguyên nhân như “vì anh chị em là”.
- source_word: ἐκλεκτοὶ τοῦ θεοῦ
  choice: những người được Đức Chúa Trời chọn
  rationale: Nêu rõ Đức Chúa Trời là Đấng chọn, đồng thời tránh biến cụm từ này thành một thuật ngữ hệ thống thần học.
- source_word: ἅγιοι
  choice: thánh khiết
  rationale: Giữ dạng tính từ mô tả địa vị và căn tính của người đọc.
- source_word: ἠγαπημένοι
  choice: được yêu thương
  rationale: 'Phản ánh phân từ hoàn thành bị động: họ đã được yêu và vẫn ở trong tình trạng được yêu.'
- source_word: σπλάγχνα οἰκτιρμοῦ
  choice: lòng thương xót sâu xa
  rationale: Truyền đạt thành ngữ chỉ tình thương xót phát xuất từ nơi sâu thẳm bên trong, thay vì dịch sát theo bộ phận nội tạng vốn không tự nhiên trong tiếng Việt.
- source_word: χρηστότητα
  choice: lòng nhân từ
  rationale: Diễn đạt đức tính tử tế và thiện lành đối với người khác trong một danh sách phẩm chất đạo đức.
- source_word: ταπεινοφροσύνην
  choice: sự khiêm nhường
  rationale: Diễn đạt tự nhiên đức tính có tâm trí khiêm hạ.
- source_word: πραΰτητα
  choice: sự dịu dàng
  rationale: Dễ hiểu trong tiếng Việt hiện đại và không gợi sự yếu đuối; vẫn giữ sắc thái ôn hòa, không thô bạo.
- source_word: μακροθυμίαν
  choice: lòng kiên nhẫn
  rationale: Diễn đạt sự nhẫn nại lâu dài, đặc biệt trong cách đối xử với người khác.
theological_decisions:
- issue: Cách dịch ἐκλεκτοὶ τοῦ θεοῦ mà không áp đặt một hệ thống giáo lý về sự tuyển chọn
  choice: những người được Đức Chúa Trời chọn
  alternative: những người được tuyển chọn của Đức Chúa Trời
  rationale: Cách dịch được chọn giữ nguyên sáng kiến của Đức Chúa Trời nhưng không giải thích cơ chế, trình tự hay phạm vi của sự tuyển chọn ngoài điều câu này nói.
- issue: Cách thể hiện mối liên hệ của ἅγιοι καὶ ἠγαπημένοι với căn tính người đọc
  choice: thánh khiết và được yêu thương
  alternative: các thánh đồ yêu dấu
  rationale: Giữ hai mô tả song song ở dạng tính từ/phân từ, tránh chuyển “thánh khiết” thành một danh xưng mang sắc thái truyền thống.
- issue: Sắc thái đạo đức của πραΰτης
  choice: sự dịu dàng
  alternative: sự nhu mì
  rationale: “Sự dịu dàng” dễ hiểu với độc giả hiện đại; chú thích giữ lại phương án truyền thống “sự nhu mì” mà không đồng nhất đức tính này với sự yếu đuối.
translation_notes:
  register: Văn phong tiếng Việt chuẩn hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “anh chị em” để làm rõ chủ thể số nhiều hàm ẩn trong mệnh lệnh Hy Lạp. Cấu trúc được sắp xếp lại nhẹ theo cú pháp tiếng Việt nhưng vẫn giữ ẩn dụ “mặc lấy” và chuỗi các phẩm chất.
