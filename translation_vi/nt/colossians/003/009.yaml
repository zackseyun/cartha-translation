source:
  edition: SBLGNT
  text: μὴ ψεύδεσθε εἰς ἀλλήλους· ἀπεκδυσάμενοι τὸν παλαιὸν ἄνθρωπον σὺν ταῖς πράξεσιν αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/009.yaml
  text: Do not lie to one another[a], since you have stripped off the old man with his practices[b],
translation:
  language: vi
  text: Đừng nói dối nhau, vì anh chị em đã cởi bỏ con người cũ cùng với những hành vi của nó.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “sau khi đã cởi bỏ con người cũ cùng với những hành vi của nó.” Phân từ Hy Lạp không tự nó xác định dứt khoát quan hệ nguyên nhân hay thời gian.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ ψεύδεσθε
  choice: Đừng nói dối
  rationale: Mệnh lệnh hiện tại với μή diễn đạt lời cấm trực tiếp; cách dịch này tự nhiên và không buộc phải hiểu rằng hành động ấy đang tiếp diễn.
- source_word: εἰς ἀλλήλους
  choice: nhau
  rationale: 'Diễn đạt tự nhiên quan hệ tương hỗ trong tiếng Việt: không nói dối người này với người kia.'
- source_word: ἀπεκδυσάμενοι
  choice: vì anh chị em đã cởi bỏ
  rationale: Phân từ bất định trung cách chỉ hành động đã hoàn tất và trong văn cảnh có thể nêu cơ sở cho mệnh lệnh; “cởi bỏ” giữ hình ảnh thay áo.
- source_word: τὸν παλαιὸν ἄνθρωπον
  choice: con người cũ
  rationale: Giữ danh từ ἄνθρωπος và sự đối lập với “con người mới” ở câu kế tiếp, đồng thời tự nhiên hơn “người đàn ông cũ” trong tiếng Việt.
- source_word: σὺν ταῖς πράξεσιν αὐτοῦ
  choice: cùng với những việc nó làm
  rationale: σύν diễn đạt sự đi kèm; πράξεις chỉ các hành vi hay việc làm. Đại từ “nó” quy chiếu về “con người cũ” như một thực tại được nhân cách hóa, không hàm ý một cá nhân nam riêng biệt.
theological_decisions:
- issue: Ý nghĩa của “con người cũ”
  choice: con người cũ
  alternative: bản ngã cũ; nhân loại cũ
  rationale: Cách dịch chính giữ được hình ảnh nhân học và sự tương ứng với “con người mới” mà không thu hẹp thành tâm lý cá nhân hay giải thích dứt khoát theo hướng tập thể.
- issue: Quan hệ cú pháp của ἀπεκδυσάμενοι
  choice: 'quan hệ nguyên nhân/cơ sở: “vì ... đã cởi bỏ”'
  alternative: 'phân từ đồng hành: “sau khi đã cởi bỏ” hoặc “hãy ... khi đã cởi bỏ”'
  rationale: Trong mạch văn, việc cởi bỏ con người cũ có khả năng làm nền tảng cho lời cấm. Vì phân từ Hy Lạp cũng có thể được giữ gần hình thức hơn, phương án ấy được ghi chú thay vì bị loại bỏ.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “anh chị em” để thể hiện chủ thể số nhiều hàm ẩn trong động từ; “con người cũ” giữ mối liên hệ với câu 10. Dấu chú thích được đặt sau toàn bộ mệnh đề mà nó giải thích.
