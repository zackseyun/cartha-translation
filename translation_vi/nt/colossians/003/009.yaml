revisions:
- from: Đừng nói dối nhau, vì anh chị em đã cởi bỏ con người cũ cùng với những việc nó làm.[a]
  to: Đừng nói dối nhau, vì anh chị em đã cởi bỏ con người cũ cùng với những hành vi của nó.[a]
  rationale: Chỉ thay cụm diễn đạt ταῖς πράξεσιν αὐτοῦ để phản ánh đúng hơn phạm vi nghĩa của «hành vi/thực hành» và cải thiện độ tự nhiên. Giữ «con người cũ», hình ảnh cởi bỏ, cách diễn đạt nguyên nhân, và chú thích về tính không hoàn toàn xác định của quan hệ phân từ.
