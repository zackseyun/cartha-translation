review_pass:
  verdict: revise
  source_fidelity: Bản dịch truyền đạt đúng mệnh lệnh phủ định, tính tương hỗ của εἰς ἀλλήλους, hình ảnh «cởi bỏ», và đối lập «con người cũ». Tuy nhiên, «những việc nó làm» nghiêng về các việc mà chủ thể thực hiện trong một tình huống hơn là các πράξεις—lối sống, hành vi/thực hành—và cách quy chiếu bằng «nó» sau «con người» kém tự nhiên trong văn phong trang trọng.
  naturalness: «Đừng nói dối nhau» và «vì anh chị em đã cởi bỏ» là tự nhiên trong tiếng Việt hiện đại. Thay «những việc nó làm» bằng «những hành vi của nó» tạo được nghĩa đạo đức-hành vi của πράξεις và giữ tính nhất quán của hình ảnh nhân cách hóa mà không gượng ép.
  terminology: «Con người cũ» là cách dịch phù hợp, tự nhiên và bảo toàn liên hệ trực tiếp với «con người mới» ở câu kế. «Hành vi» phù hợp với πράξεις hơn «những việc nó làm». Quan hệ nhân quả của phân từ là khả dĩ trong ngữ cảnh; chú thích nêu đúng rằng quan hệ ấy không hoàn toàn do hình thức phân từ quyết định.
  issues:
  - severity: medium
    issue: «những việc nó làm» không phản ánh tối ưu ταῖς πράξεσιν αὐτοῦ
    rationale: πρᾶξις chỉ các hành vi, việc làm hay thực hành, đặc biệt theo nghĩa nếp sống/ứng xử. Cụm hiện tại có sắc thái sự việc mà «nó» thực hiện, lại hơi gượng trong tiếng Việt. «Những hành vi của nó» sát nghĩa và tự nhiên hơn.
  revised_text: Đừng nói dối nhau, vì anh chị em đã cởi bỏ con người cũ cùng với những hành vi của nó.[a]
