language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀνεχόμενοι ἀλλήλων καὶ χαριζόμενοι ἑαυτοῖς ἐάν τις πρός τινα ἔχῃ μομφήν· καθὼς καὶ ὁ ⸀κύριος ἐχαρίσατο ὑμῖν οὕτως καὶ ὑμεῖς·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/013.yaml
  text: bearing with one another and forgiving each other[a], if anyone has a complaint against anyone; just as the Lord also forgave you[b], so also you must do.
translation:
  language: vi
  text: Hãy nhẫn nhịn nhau và tha thứ cho nhau, nếu ai có điều gì bất bình với người khác[a]. Chúa đã tha thứ cho anh chị em thế nào, anh chị em cũng phải làm như vậy[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “nếu ai có lời khiếu trách người khác.”'
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn Hy Lạp lược động từ ở cuối câu; ý “làm như vậy” được hiểu từ ngữ cảnh, tức là cũng phải tha thứ.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνεχόμενοι
  choice: hãy nhẫn nhịn nhau
  rationale: Động từ phân từ hiện tại mang ý nghĩa tiếp diễn trong chuỗi lời khuyên. “Nhẫn nhịn nhau” diễn đạt việc kiên nhẫn chịu đựng những thiếu sót của nhau, tự nhiên hơn “dung chịu nhau” trong tiếng Việt hiện đại và bớt gay gắt hơn “chịu đựng nhau”.
- source_word: χαριζόμενοι ἑαυτοῖς
  choice: tha thứ cho nhau
  rationale: Trong ngữ cảnh xử lý sự bất bình giữa các tín hữu, χαρίζομαι chỉ hành động tha thứ; đại từ phản thân ἑαυτοῖς mang nghĩa tương hỗ trong cộng đồng.
- source_word: ἐάν τις πρός τινα ἔχῃ μομφήν
  choice: nếu ai có điều gì bất bình với người khác
  rationale: Giữ tính khái quát, bất định của câu điều kiện. “Có điều gì bất bình với” là cách nói tự nhiên, bao quát lý do trách cứ mà không biến nó thành một cáo buộc chính thức.
- source_word: καθὼς καὶ
  choice: thế nào ... cũng
  rationale: Cấu trúc tương liên tự nhiên trong tiếng Việt, giữ quan hệ so sánh giữa sự tha thứ của Chúa và sự tha thứ được đòi hỏi nơi cộng đồng.
- source_word: ὁ κύριος
  choice: Chúa
  rationale: Giữ nguyên tước hiệu κύριος mà không diễn giải thêm danh tính của Đấng được nói đến ngay trong chính văn.
- source_word: ἐχαρίσατο
  choice: đã tha thứ
  rationale: Thể bất định chỉ hành động đã xảy ra, đồng thời nối lại cùng trường nghĩa với χαριζόμενοι ở đầu câu.
- source_word: οὕτως καὶ ὑμεῖς
  choice: anh chị em cũng phải làm như vậy
  rationale: Tiếng Hy Lạp lược động từ, nhưng tiếng Việt cần bổ sung một vị ngữ để câu trọn nghĩa và tự nhiên. “Làm như vậy” quy chiếu rõ về hành động tha thứ mà không lặp từ không cần thiết.
theological_decisions:
- issue: Đối tượng được chỉ bởi ὁ κύριος
  choice: Dịch là “Chúa” và không nêu đích danh trong chính văn
  alternative: Diễn giải là “Chúa Cơ Đốc” hoặc hiểu rộng hơn là Đức Chúa Trời
  rationale: Trong văn mạch Cô-lô-se, tước hiệu này rất có thể chỉ về Đấng Christ, nhưng bản Hy Lạp chỉ viết “Chúa”. Giữ tước hiệu duy trì khả năng quy chiếu của nguyên bản mà không áp đặt phần diễn giải.
- issue: Động từ bị lược ở mệnh đề cuối
  choice: Bổ sung “phải làm như vậy”
  alternative: 'Giữ câu tỉnh lược: “anh chị em cũng vậy”, hoặc bổ sung trực tiếp “cũng phải tha thứ”'
  rationale: Bản Hy Lạp để hành động được hiểu ngầm từ ngữ cảnh. Cách dịch đã chọn tạo câu tiếng Việt tự nhiên, thể hiện lực khuyên truyền của văn mạch nhưng vẫn ghi chú rõ chỗ được bổ sung.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh chị em” cho đại từ số nhiều ὑμεῖς nhằm nói trực tiếp với toàn thể cộng đồng. “Nhẫn nhịn” giữ sắc thái quan hệ và tiếp diễn, còn cấu trúc câu thứ hai được điều chỉnh theo lối tương liên tự nhiên của tiếng Việt.
