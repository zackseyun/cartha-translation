  verdict: revise
  source_fidelity: 'Bản dịch phản ánh đúng các thành tố chính: ἐν οἷς quy chiếu về danh sách các điều/tật xấu trước đó; καὶ ὑμεῖς được nhấn bằng “anh chị em cũng”; περιεπατήσατε và ἐζῆτε được phân biệt; và ποτε được diễn đạt bằng “từng”. Tuy nhiên, “khi còn sống trong chúng” dùng “chúng” để thay cho các “điều” trừu tượng nghe gượng trong tiếng Việt, và “còn sống” có thể thoáng gợi nghĩa còn sống về mặt sinh học. Việc lặp lại rõ đối tượng quy chiếu là an toàn hơn và sát câu nguồn.'
  naturalness: “Bước đi trong những điều ấy” là hình ảnh có chủ ý, chấp nhận được trong văn phong Kinh Thánh hiện đại. Cần thay “trong chúng” bằng “trong những điều ấy” để tiếng Việt tự nhiên và rõ nghĩa hơn. Việc lặp lại này không phải là lỗi, vì tiếng Hy Lạp cũng lặp lại cụm chỉ phạm vi bằng ἐν τούτοις.
  terminology: “Anh chị em” phù hợp với cách xưng hô cộng đồng; “bước đi” bảo toàn ẩn dụ đạo đức của περιπατέω; “sống” giữ được sự phân biệt với động từ trước. Không có vấn đề về thuật ngữ thần học hay tên riêng.
  issues:
