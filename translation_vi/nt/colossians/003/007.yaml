  text: In these things you too once walked[a], when you were living in them.
translation:
  language: vi
  text: Anh chị em cũng từng bước đi trong những điều ấy[a], khi còn sống trong những điều ấy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch sát đại từ quan hệ tiếng Hy Lạp: “Trong đó anh chị em cũng từng bước đi, khi còn sống trong những điều ấy.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν οἷς
  choice: trong những điều ấy
  rationale: Cụm đại từ quan hệ số nhiều chỉ về các tội lỗi vừa được nêu. Cách dịch này tự nhiên trong tiếng Việt, giữ được giới từ ἐν và không làm mờ đối tượng quy chiếu.
- source_word: καὶ ὑμεῖς
  choice: anh chị em cũng
  rationale: καὶ đi với đại từ nhấn mạnh ὑμεῖς cho thấy chính các tín hữu Cô-lô-se trước kia cũng từng thuộc về lối sống ấy. “Anh chị em cũng” truyền đạt được nét nhấn mạnh này bằng tiếng Việt hiện đại.
- source_word: περιεπατήσατε
  choice: từng bước đi
  rationale: Động từ περιπατέω được dùng theo nghĩa ẩn dụ về cách sống. Giữ hình ảnh “bước đi” bảo tồn lối diễn đạt của Phao-lô và phân biệt động từ này với ἐζῆτε ở vế sau.
- source_word: ποτε
  choice: từng
  rationale: ποτε nói đến một thời điểm hay giai đoạn trước kia. “Từng” diễn đạt gọn và tự nhiên ý nghĩa quá khứ ấy.
- source_word: ὅτε
  choice: khi
  rationale: Liên từ chỉ thời gian này nối cách cư xử trước kia với tình trạng sống trước kia của họ.
- source_word: ἐζῆτε
  choice: còn sống
  rationale: Thì chưa hoàn thành diễn tả một tình trạng kéo dài trong quá khứ. “Còn sống” giữ nghĩa của ζάω và tránh đồng nhất nó với hình ảnh “bước đi” của περιπατέω.
- source_word: ἐν τούτοις
  choice: trong chúng
  rationale: Đại từ τούτοις lại chỉ về những tội lỗi hay thực hành vừa nêu. “Trong chúng” tránh lặp nặng nề mà vẫn giữ ý họ từng sống trong phạm vi của những điều ấy.
theological_decisions:
- issue: Mối liên hệ giữa “bước đi” và “sống” trong lời mô tả đạo đức của Phao-lô
  choice: Phân biệt cách cư xử trước kia (“bước đi”) với tình trạng hay phạm vi sống trước kia (“sống trong chúng”).
  alternative: Xem hai động từ gần như đồng nghĩa và dịch cả hai bằng “sống”.
  rationale: Giữ sự phân biệt giữa περιπατέω và ζάω phản ánh sát cấu trúc Hy Lạp, đồng thời bảo tồn hai lớp ý nghĩa trong lời mô tả mà không thêm một kết luận thần học ngoài văn bản.
translation_notes:
  register: Văn phong trang trọng nhưng dễ hiểu. “Anh chị em” được dùng để chỉ cộng đồng tín hữu gồm cả nam lẫn nữ. Hình ảnh “bước đi” được giữ lại dù hơi khác lối nói thông thường, vì đây là ẩn dụ quan trọng trong văn phong của Phao-lô.
