  rationale: Bản sửa chỉ làm rõ và làm tự nhiên cách quy chiếu của ἐν τούτοις, đồng thời chỉnh chú thích để phương án sát cấu trúc đại từ quan hệ ἐν οἷς có tiếng Việt tự nhiên. Bản dịch vẫn giữ sự phân biệt giữa “bước đi” (περιεπατήσατε) và “sống” (ἐζῆτε), cũng như sắc thái quá khứ của ποτε.
