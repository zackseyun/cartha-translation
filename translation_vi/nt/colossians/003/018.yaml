  text: Αἱ γυναῖκες, ὑποτάσσεσθε ⸀τοῖς ἀνδράσιν, ὡς ἀνῆκεν ἐν κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/018.yaml
  text: Wives[a], submit yourselves to your husbands[b], as is fitting in the Lord.
translation:
  language: vi
  text: Các người vợ, hãy thuận phục chồng mình,[a] như điều phải lẽ trong Chúa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “hãy phục tùng chồng mình.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “như điều đã là phải lẽ trong Chúa”; động từ Hy Lạp có hình thái quá khứ chưa hoàn thành, nhưng trong ngữ cảnh này có lẽ mang ý nghĩa khái quát hiện tại.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γυναῖκες
  choice: những người vợ
  rationale: Trong lời dạy về gia đình và khi đi đôi với ἀνδράσιν, từ này chỉ những phụ nữ đã kết hôn, không phải phụ nữ nói chung.
- source_word: ὑποτάσσεσθε
  choice: hãy thuận phục
  rationale: Mệnh lệnh hiện tại dạng trung động/thụ động diễn tả việc tự đặt mình dưới trật tự trong mối quan hệ; “thuận phục” giữ được sắc thái tự nguyện mà không hàm ý bị cưỡng ép.
- source_word: τοῖς ἀνδράσιν
  choice: chồng mình
  rationale: Trong ngữ cảnh gia đình, ἀνήρ mang nghĩa “chồng”; “mình” diễn đạt tự nhiên quan hệ sở thuộc trong tiếng Việt.
- source_word: ὡς
  choice: như
  rationale: Từ này nêu chuẩn mực hay tính tương hợp, không nhất thiết mang nghĩa nguyên nhân như “vì”.
- source_word: ἀνῆκεν
  choice: điều thích hợp
  rationale: 'Dù có hình thái quá khứ chưa hoàn thành, động từ ở đây có thể mang ý nghĩa khái quát hiện tại: điều thích hợp hoặc phải lẽ.'
- source_word: ἐν κυρίῳ
  choice: trong Chúa
  rationale: Giữ sát cụm từ Hy Lạp và đặt tính thích hợp của lời khuyên trong mối liên hệ với Chúa, thay vì biến nó thành một chuẩn mực xã hội vô điều kiện.
theological_decisions:
- issue: Phạm vi và nền tảng của lời khuyên
  choice: Giữ cụm “như điều thích hợp trong Chúa” để lời khuyên được đặt dưới sự quy chiếu về Chúa.
  alternative: Hiểu đây là một chuẩn mực văn hóa chung không có giới hạn thần học, hoặc gắn “trong Chúa” riêng với người vợ.
  rationale: Cấu trúc Hy Lạp liên kết ἐν κυρίῳ với nhận định về điều thích hợp. Bản dịch giữ nguyên sự giới định thần học mà không diễn giải vượt quá câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Hỡi” đánh dấu lời gọi trực tiếp; “thuận phục” giữ sắc thái quan hệ và chủ động hơn “bị đặt dưới quyền”. Mọi chú thích đều có ký hiệu tương ứng trong chính văn.
