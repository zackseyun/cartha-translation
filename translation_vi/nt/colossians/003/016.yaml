source:
  edition: SBLGNT
  text: ὁ λόγος τοῦ Χριστοῦ ἐνοικείτω ἐν ὑμῖν πλουσίως ἐν πάσῃ σοφίᾳ· διδάσκοντες καὶ νουθετοῦντες ἑαυτοὺς ⸀ψαλμοῖς, ⸀ὕμνοις, ᾠδαῖς πνευματικαῖς ⸀ἐν χάριτι, ᾄδοντες ἐν ⸂ταῖς καρδίαις⸃ ὑμῶν τῷ ⸀θεῷ·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/016.yaml
  text: Let the word of Messiah dwell in you richly in all wisdom[a], teaching and admonishing one another with psalms, hymns, and spiritual songs[b], singing with grace in your hearts to God.
translation:
  language: vi
  text: Hãy để lời của Đấng Mê-si-a cư ngụ cách dồi dào trong anh chị em, với mọi sự khôn ngoan; hãy dùng các thi thiên, thánh ca và những bài hát thuộc linh để dạy dỗ và khuyên bảo nhau, và hãy hát dâng lên Đức Chúa Trời với lòng biết ơn trong lòng anh chị em.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cụm “với mọi sự khôn ngoan” có thể gắn với việc lời của Đấng Mê-si-a cư ngụ trong anh chị em, với việc dạy dỗ và khuyên bảo, hoặc với cả hai. “Anh chị em” trong tiếng Hy Lạp là số nhiều nên cũng có thể nhấn mạnh lời ấy cư ngụ giữa cộng đồng.
    reason: syntactic_and_corporate_ambiguity
  - marker: b
    text: 'Cũng có thể dịch: “trong ân điển” hoặc “một cách đầy ân hậu.” Từ Hy Lạp χάρις có thể chỉ ân điển, sự ân hậu hoặc lòng biết ơn tùy ngữ cảnh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ λόγος τοῦ Χριστοῦ
  choice: lời của Đấng Mê-si-a
  rationale: “Lời” giữ được phạm vi nghĩa rộng của λόγος; kết cấu “của Đấng Mê-si-a” không quyết định dứt khoát đó là lời do Ngài phán hay sứ điệp nói về Ngài. Χριστός được hiểu là tước hiệu.
- source_word: ἐνοικείτω ἐν ὑμῖν πλουσίως
  choice: hãy để ... ở trong anh chị em cách dồi dào
  rationale: Giữ hình ảnh cư ngụ của ἐνοικέω, sắc thái tiếp diễn của mệnh lệnh hiện tại và cách diễn đạt trực tiếp của cụm số nhiều ἐν ὑμῖν.
- source_word: ἐν πάσῃ σοφίᾳ
  choice: trong mọi sự khôn ngoan
  rationale: Bám sát cấu trúc Hy Lạp và không khóa cụm từ này chỉ với việc lời cư ngụ hoặc chỉ với việc dạy dỗ, khuyên bảo.
- source_word: διδάσκοντες καὶ νουθετοῦντες ἑαυτούς
  choice: dạy dỗ và khuyên bảo nhau
  rationale: Trong ngữ cảnh số nhiều, đại từ phản thân diễn tả hành động hỗ tương. “Khuyên bảo” giữ cả sắc thái hướng dẫn lẫn sửa bảo của νουθετέω.
- source_word: ψαλμοῖς, ὕμνοις, ᾠδαῖς πνευματικαῖς
  choice: dùng các thi thiên, thánh ca và những bài hát thuộc linh
  rationale: Dịch cách dụng cụ của các danh từ ở dữ cách; duy trì ba loại ca khúc riêng biệt, với πνευματικαῖς bổ nghĩa trực tiếp cho “bài hát”.
- source_word: ἐν χάριτι
  choice: với lòng biết ơn
  rationale: Trong ngữ cảnh ca hát dâng lên Đức Chúa Trời, χάρις có thể mang nghĩa lòng biết ơn; chú thích giữ lại khả năng dịch gần hình thức hơn là “trong ân điển”.
- source_word: ἐν ταῖς καρδίαις ὑμῶν τῷ θεῷ
  choice: trong lòng anh chị em dâng lên Đức Chúa Trời
  rationale: Giữ chiều hướng nội tâm của lời ca và đối tượng tiếp nhận là Đức Chúa Trời, đồng thời dùng đại từ số nhiều bao hàm tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Ý nghĩa của Χριστοῦ
  choice: Đấng Mê-si-a
  alternative: Đấng Christ
  rationale: Ở đây Χριστός vẫn có thể được nghe như tước hiệu; “Đấng Mê-si-a” làm rõ nội dung tước hiệu mà không biến nó thành tên riêng thuần túy.
- issue: Chiều kích cộng đồng hay cá nhân của ἐν ὑμῖν
  choice: ở trong anh chị em
  alternative: ở giữa anh chị em
  rationale: Bản chính giữ cách diễn đạt trực tiếp “ở trong” và số nhiều của nguyên ngữ; chú thích nêu rõ cụm từ cũng có thể nhấn mạnh cộng đồng như một toàn thể.
- issue: Phạm vi bổ nghĩa của ἐν πάσῃ σοφίᾳ
  choice: đặt sau mệnh đề lời cư ngụ, trước việc dạy dỗ và khuyên bảo
  alternative: gắn rõ riêng với “dạy dỗ và khuyên bảo”
  rationale: 'Vị trí này bảo tồn sự mơ hồ cú pháp: sự khôn ngoan có thể liên hệ với việc lời cư ngụ và/hoặc với các hoạt động hỗ tương tiếp theo.'
- issue: Ý nghĩa của ἐν χάριτι
  choice: với lòng biết ơn
  alternative: trong ân điển; một cách đầy ân hậu
  rationale: Ngữ cảnh thờ phượng ủng hộ sắc thái biết ơn, nhưng trường nghĩa của χάρις rộng hơn; vì vậy phương án kia được bảo tồn trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” để diễn đạt ngôi thứ hai số nhiều theo hướng bao hàm; “thi thiên,” “thánh ca,” “thuộc linh” duy trì vốn từ Kinh Thánh quen thuộc nhưng vẫn tự nhiên. Dấu chấm phẩy làm rõ sự chuyển tiếp từ việc dạy dỗ lẫn nhau sang việc hát dâng lên Đức Chúa Trời.
