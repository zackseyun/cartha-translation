  text: ἀπεθάνετε γάρ, καὶ ἡ ζωὴ ὑμῶν κέκρυπται σὺν τῷ Χριστῷ ἐν τῷ θεῷ·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/003.yaml
  text: For you died, and your life has been hidden with the Messiah in God.
translation:
  language: vi
  text: Vì anh em đã chết, và sự sống của anh em đã được ẩn giấu[b] cùng với Đấng Mê-si[a] trong Đức Chúa Trời.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “Đấng Christ.” Tước hiệu Hy Lạp Χριστός có thể được dịch là “Đấng Mê-si” hoặc “Đấng Christ”; ở đây bản chính dịch theo ý nghĩa của tước hiệu.
    reason: alternative_reading
  - marker: b
    text: Cũng có thể dịch là “được ẩn giấu” hoặc “đang ẩn giấu.” Thể hoàn thành trong tiếng Hy Lạp có thể nhấn mạnh trạng thái hiện tại phát sinh từ một hành động đã hoàn tất.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεθάνετε
  choice: anh em đã chết
  rationale: Động từ aorist chỉ một sự kiện quyết định trong quá khứ; “đã chết” là cách diễn đạt tự nhiên và giữ nguyên hình ảnh thần học của câu.
- source_word: γάρ
  choice: Vì
  rationale: Từ nối nêu lý do hoặc nền tảng cho lời khuyên ở câu trước.
- source_word: ἡ ζωὴ ὑμῶν
  choice: sự sống của anh em
  rationale: Giữ nghĩa trực tiếp của ζωή và dạng số nhiều của đại từ ὑμῶν qua cách xưng hô tập thể “anh em”.
- source_word: κέκρυπται
  choice: đã được giấu kín
  rationale: Thể hoàn thành bị động diễn tả hành động đã xảy ra với kết quả còn tiếp diễn; “đã được giấu kín” giữ được cả hành động quá khứ lẫn sắc thái bị động.
- source_word: σὺν τῷ Χριστῷ
  choice: với Đấng Mê-si
  rationale: σύν diễn tả sự đồng hành hoặc kết hợp; Χριστός được hiểu như tước hiệu “Đấng Mê-si” trong văn cảnh này.
- source_word: ἐν τῷ θεῷ
  choice: trong Đức Chúa Trời
  rationale: Giữ ý nghĩa về vị trí hoặc phạm vi của ἐν, không diễn giải thành “với Đức Chúa Trời”.
theological_decisions:
- issue: Dịch Χριστῷ như một tước hiệu hay dạng tên riêng quen dùng
  choice: Đấng Mê-si
  alternative: Đấng Christ
  rationale: Văn cảnh nói đến Đấng được xức dầu và sự kết hợp của các tín hữu với Ngài; cách dịch theo tước hiệu bảo tồn nghĩa của từ Hy Lạp, đồng thời ghi nhận cách gọi truyền thống trong chú thích.
- issue: Sắc thái của thể hoàn thành trong κέκρυπται
  choice: đã được giấu kín
  alternative: được giấu kín; đang ẩn giấu
  rationale: Bản chính bảo tồn hành động đã hoàn tất, còn chú thích ghi nhận khả năng nhấn mạnh trạng thái hiện tại kéo dài từ hành động ấy.
translation_notes:
  register: Văn phong trang trọng, tự nhiên và dễ hiểu trong tiếng Việt hiện đại. “Anh em” thể hiện đối tượng số nhiều. Cấu trúc “trong Đức Chúa Trời” được giữ để bảo tồn hình ảnh và sức căng thần học của nguyên văn.
