  source_fidelity: 'Bản dịch giữ đúng các yếu tố chính của nguyên văn: γάρ là lời giải thích, ἀπεθάνετε là sự chết dứt khoát trong quá khứ, κέκρυπται là bị động hoàn thành, và hai cụm giới từ “với Đấng Mê-si” và “trong Đức Chúa Trời.” Tuy nhiên, cần thêm “cùng” để diễn đạt σύν tự nhiên, rõ quan hệ liên kết trong tiếng Việt.'
