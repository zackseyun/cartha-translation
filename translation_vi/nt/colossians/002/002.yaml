source:
  edition: SBLGNT
  text: ἵνα παρακληθῶσιν αἱ καρδίαι αὐτῶν, ⸀συμβιβασθέντες ἐν ἀγάπῃ καὶ εἰς ⸂πᾶν πλοῦτος⸃ τῆς πληροφορίας τῆς συνέσεως, εἰς ἐπίγνωσιν τοῦ μυστηρίου τοῦ ⸀θεοῦ, Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/002.yaml
  text: so that their hearts may be encouraged[a], having been knit together in love and unto all the riches of the full assurance of understanding, unto the knowledge of the mystery of God, Messiah[d][c][b],
translation:
  language: vi
  text: để lòng họ được khích lệ, và họ được gắn kết với nhau trong tình yêu thương, và đạt đến mọi sự phong phú của niềm xác tín trọn vẹn của sự hiểu biết, đạt đến sự nhận biết[b] mầu nhiệm của Đức Chúa Trời, Đấng Mê-si[c][d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Cũng có thể dịch là “sự nhận biết đầy đủ”; từ Hy Lạp có thể mang sắc thái tăng cường.
    reason: lexical_alternative
  - marker: c
    text: 'Cụm từ Hy Lạp ở đây rất cô đọng: “mầu nhiệm của Đức Chúa Trời, Đấng Mê-si.” Dấu phẩy giữ cách diễn đạt đồng vị có khả năng nhất, theo đó Đấng Mê-si được liên hệ với mầu nhiệm của Đức Chúa Trời, mà không thêm từ giải thích vào chính văn.'
    reason: alternative_reading
  - marker: d
    text: Một số thủ bản có cách đọc dài hơn, chẳng hạn “mầu nhiệm của Đức Chúa Trời, là Cha, và của Đấng Christ.” Bản dịch này theo cách đọc ngắn trong bản Hy Lạp được cung cấp.
    reason: textual_variant
lexical_decisions:
- source_word: παρακληθῶσιν
  choice: được khích lệ
  rationale: Trong văn cảnh này, động từ chỉ sự nâng đỡ và củng cố nội tâm; “được khích lệ” giữ được nghĩa rộng hơn “được an ủi”.
- source_word: αἱ καρδίαι αὐτῶν
  choice: tấm lòng họ
  rationale: Giữ hình ảnh nhân học của nguyên văn nhưng dùng cách nói tự nhiên trong tiếng Việt hiện đại.
- source_word: συμβιβασθέντες
  choice: được gắn kết với nhau
  rationale: Với cụm “trong tình yêu thương” theo sau, nghĩa liên kết thành một thể thống nhất phù hợp hơn nghĩa dạy bảo.
- source_word: ἐν ἀγάπῃ
  choice: trong tình yêu thương
  rationale: Diễn đạt phạm vi hoặc mối dây trong đó họ được gắn kết.
- source_word: εἰς πᾶν πλοῦτος
  choice: đạt đến mọi sự phong phú
  rationale: “Đạt đến” thể hiện hướng tới mục tiêu của εἰς, còn “mọi sự phong phú” giữ hình ảnh về sự giàu có, sung mãn.
- source_word: τῆς πληροφορίας τῆς συνέσεως
  choice: của niềm xác tín trọn vẹn trong sự hiểu biết
  rationale: Giữ mối liên hệ giữa sự xác tín đầy đủ và sự hiểu biết mà không diễn giải quá mức quan hệ sở hữu cách trong tiếng Hy Lạp.
- source_word: ἐπίγνωσιν
  choice: sự nhận biết
  rationale: “Nhận biết” tự nhiên trong văn phong Kinh Thánh tiếng Việt và có thể bao hàm sự hiểu biết sâu, đầy đủ hơn kiến thức đơn thuần.
- source_word: μυστηρίου
  choice: mầu nhiệm
  rationale: Chỉ ý định của Đức Chúa Trời từng được che giấu nhưng nay được bày tỏ; “mầu nhiệm” giữ sắc thái thần học của thuật ngữ Phao-lô.
- source_word: θεοῦ, Χριστοῦ
  choice: của Đức Chúa Trời—Đấng Mê-si
  rationale: Dấu gạch ngang giữ cấu trúc đồng vị cô đọng của nguyên văn, đồng thời “Đấng Mê-si” thể hiện Χριστός như một tước hiệu.
theological_decisions:
- issue: Quan hệ đồng vị trong τοῦ μυστηρίου τοῦ θεοῦ, Χριστοῦ
  choice: “mầu nhiệm của Đức Chúa Trời—Đấng Mê-si”
  alternative: “mầu nhiệm của Đức Chúa Trời, tức là Đấng Mê-si” hoặc cách đọc dài “mầu nhiệm của Đức Chúa Trời, là Cha, và của Đấng Christ”
  rationale: Bản Hy Lạp được cung cấp có lối diễn đạt ngắn và khó, trong đó Χριστοῦ nhiều khả năng là thành phần đồng vị. Dấu gạch ngang bảo tồn sự cô đọng và mức độ mơ hồ thật của cú pháp thay vì thêm hẳn từ “tức là” vào chính văn.
- issue: Sắc thái của ἐπίγνωσις
  choice: “sự nhận biết”
  alternative: “sự nhận biết đầy đủ”
  rationale: Không thêm “đầy đủ” vào chính văn vì cường độ của tiền tố trong từ này không phải lúc nào cũng cần được biểu thị riêng; khả năng ấy được ghi chú.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Cấu trúc lặp “đạt đến” phản ánh hai cụm εἰς chỉ hướng đích; câu vẫn giữ nhịp dài và sự dồn ý đặc trưng của Phao-lô.
