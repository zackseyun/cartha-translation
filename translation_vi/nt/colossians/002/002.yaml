    rationale: Hai danh từ sở hữu cách liên tiếp được dịch sát và rõ hơn là «niềm xác tín trọn vẹn của sự hiểu biết». Cách này không quyết định quá mức bản chất của quan hệ sở hữu cách.
  revised_text: để lòng họ được khích lệ, và họ được gắn kết với nhau trong tình yêu thương, và đạt đến mọi sự phong phú của niềm xác tín trọn vẹn của sự hiểu biết, đạt đến sự nhận biết[b] mầu nhiệm của Đức Chúa Trời, Đấng Mê-si[c][d].
