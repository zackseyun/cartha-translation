id: COL.2.15
reference: Colossians 2:15
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀπεκδυσάμενος τὰς ἀρχὰς καὶ τὰς ἐξουσίας ἐδειγμάτισεν ἐν παρρησίᾳ, θριαμβεύσας αὐτοὺς ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/015.yaml
  text: Having disarmed the rulers and the authorities, he made a public spectacle of them, triumphing over them in him.
translation:
  language: vi
  text: Ngài đã tước khí giới của các quyền thống trị và các thế lực, công khai bêu chúng ra làm trò, chiến thắng chúng trong Ngài.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cụm “trong Ngài” cũng có thể được hiểu là “nhờ thập tự giá ấy” hoặc “trên thập tự giá ấy”.
    reason: Đại từ Hy Lạp ἐν αὐτῷ có thể được liên hệ với Đấng Christ hoặc với thập tự giá được nhắc đến ở câu trước; chú thích bảo tồn sự mơ hồ về quy chiếu và sắc thái của giới từ.
lexical_decisions:
- source_word: ἀπεκδυσάμενος
  choice: đã tước khí giới của
  rationale: Trong ngữ cảnh chiến thắng, phân từ này có thể diễn tả việc tước bỏ vũ khí hoặc quyền lực của đối phương. Cách dịch này tự nhiên trong tiếng Việt và phù hợp với hình ảnh đoàn khải hoàn, dù nghĩa sát chữ cũng có thể là “lột bỏ”.
- source_word: τὰς ἀρχὰς καὶ τὰς ἐξουσίας
  choice: các quyền thống trị và các thế lực
  rationale: Giữ hai phạm trù quyền lực ở số nhiều và để ngữ cảnh cho thấy đây là các quyền lực siêu nhiên, không thu hẹp thành các nhà cầm quyền trần thế.
- source_word: ἐδειγμάτισεν ἐν παρρησίᾳ
  choice: phô bày chúng công khai
  rationale: Diễn đạt hành động đưa đối phương ra trước công chúng làm cảnh tượng, với sắc thái công khai rõ ràng.
- source_word: θριαμβεύσας αὐτοὺς
  choice: dẫn chúng đi trong đoàn khải hoàn
  rationale: Động từ gợi hình ảnh đoàn rước chiến thắng, trong đó kẻ bại trận bị dẫn đi; cách dịch giữ hình ảnh lịch sử thay vì chỉ nói chung là “chiến thắng”.
- source_word: ἐν αὐτῷ
  choice: trong Ngài
  rationale: Theo lớp tham khảo đã được duyệt, đại từ được hiểu là chỉ Đấng Christ. Tuy nhiên, cấu trúc Hy Lạp cho phép một cách hiểu khác liên hệ đến thập tự giá, nên ghi chú bảo tồn sự mơ hồ.
theological_decisions:
- issue: Chủ thể của các hành động trong câu
  choice: “Ngài” tiếp nối chủ thể là Đức Chúa Trời trong mạch văn trước
  alternative: Hiểu Đấng Christ là chủ thể trực tiếp
  rationale: Các động từ hữu hạn ở 2:13–15 tự nhiên tiếp tục nói về Đức Chúa Trời; tiếng Việt dùng “Ngài” để không chèn danh xưng không có trong chính câu này.
- issue: Đối tượng quy chiếu của ἐν αὐτῷ
  choice: “trong Ngài”, quy chiếu đến Đấng Christ
  alternative: “nhờ thập tự giá ấy” hoặc “trên thập tự giá ấy”
  rationale: Cách chính phù hợp với bản tham khảo đã được duyệt, còn chú thích giữ cách hiểu lâu đời và có cơ sở ngữ cảnh liên hệ đến thập tự giá ở câu 14.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Đoàn khải hoàn” giữ hình ảnh chiến thắng của nguyên văn; “các quyền thống trị và các thế lực” tránh áp đặt một hệ thống phân loại thiên sứ cụ thể.
