  source_fidelity: 'Bản dịch phản ánh đúng chuỗi hành động của nguyên văn: tước khí giới các ἀρχαί và ἐξουσίαι, bêu ra công khai, và chiến thắng chúng. Tuy nhiên, “dẫn chúng đi trong đoàn khải hoàn” diễn giải hình ảnh của θριαμβεύσας vượt quá mức cần thiết và cấu trúc “trong đoàn khải hoàn trong Ngài” thiếu tự nhiên, dễ làm mờ quan hệ của ἐν αὐτῷ.'
