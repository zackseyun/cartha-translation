  text: Μὴ ἅψῃ μηδὲ γεύσῃ μηδὲ θίγῃς,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/021.yaml
  text: “Do not handle[a], nor taste, nor touch,”
translation:
  language: vi
  text: “Đừng cầm[a], đừng nếm, cũng đừng chạm vào,”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “Đừng chạm vào, đừng nếm, cũng đừng chạm vào.” Động từ thứ nhất (ἅψῃ) cũng có thể nghĩa là “chạm vào” hoặc “nắm lấy”; ở đây dịch là “cầm” để phân biệt với θίγῃς (“chạm vào”) ở cuối câu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ
  choice: Đừng
  rationale: μή đi với động từ ở thể giả định aorist tạo thành lời cấm; “Đừng” là cách diễn đạt tự nhiên, trực tiếp trong tiếng Việt.
- source_word: ἅψῃ
  choice: cầm lấy
  rationale: ἅπτω ở dạng trung có thể mang nghĩa “chạm vào” hoặc “nắm/cầm lấy.” Chọn “cầm lấy” để vừa giữ phạm vi nghĩa vừa phân biệt với θίγῃς ở cuối câu.
- source_word: μηδὲ
  choice: đừng ... cũng đừng
  rationale: Liên từ phủ định lặp lại nối chuỗi ba điều cấm; cấu trúc này giữ sức dồn của nguyên văn mà vẫn tự nhiên trong tiếng Việt.
- source_word: γεύσῃ
  choice: nếm
  rationale: γεύομαι có nghĩa trực tiếp là “nếm”; không mở rộng thành “ăn” hay “dùng” khi nguyên văn không đòi hỏi.
- source_word: θίγῃς
  choice: chạm vào
  rationale: θιγγάνω thường có nghĩa “chạm vào”; cách dịch này phân biệt với “cầm lấy” ở đầu câu.
theological_decisions:
- issue: Bản chất của chuỗi điều cấm trong văn cảnh
  choice: Giữ nguyên chuỗi lời cấm ngắn gọn, có dáng dấp lời trích dẫn, không thêm đối tượng hay lời giải thích.
  alternative: Diễn giải thành “Đừng cầm thứ này, đừng nếm thứ kia...” hoặc gắn rõ với các quy định của loài người.
  rationale: Câu Hy Lạp chỉ gồm ba lời cấm rất cô đọng. Thêm đối tượng hoặc nguồn gốc của các quy định sẽ đưa nội dung từ văn cảnh vào chính câu này và làm mất tính đột ngột của nguyên văn.
translation_notes:
  register: Ngôn ngữ hiện đại, trang trọng vừa phải và dễ hiểu. Dùng ba mệnh lệnh phủ định ngắn để giữ nhịp dồn và sự cô đọng của nguyên văn; dấu ngoặc kép phản ánh dáng dấp một chuỗi quy tắc được dẫn lại.
