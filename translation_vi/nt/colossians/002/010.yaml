  text: καὶ ἐστὲ ἐν αὐτῷ πεπληρωμένοι, ὅς ἐστιν ἡ κεφαλὴ πάσης ἀρχῆς καὶ ἐξουσίας,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/010.yaml
  text: and in him you have been made full, who is the head of every ruler and authority.
translation:
  language: vi
  text: Và trong Ngài, anh em đã được làm cho đầy đủ[a]. Ngài là Đầu trên mọi quyền thống trị và thẩm quyền[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “được đầy dẫy” hoặc “được đưa đến sự đầy trọn.”'
    reason: lexical_alternative
  - marker: b
    text: “Đầu” giữ nguyên ẩn dụ trong tiếng Hy Lạp; ở đây ý nói Ngài là Đấng tối cao trên mọi quyền thống trị và thẩm quyền.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Và
  rationale: Giữ liên từ để nối câu này với lập luận ngay trước đó.
- source_word: ἐστὲ ... πεπληρωμένοι
  choice: anh em đã được làm cho đầy trọn
  rationale: Diễn đạt trạng thái hiện tại phát sinh từ hành động đã hoàn tất, đồng thời giữ thể bị động và mô-típ về sự đầy trọn nối với câu trước.
- source_word: ἐν αὐτῷ
  choice: trong Ngài
  rationale: Giữ cách diễn đạt cô đọng đặc trưng của Phao-lô về mối liên hiệp với Đấng Christ, không giải nghĩa quá mức.
- source_word: ὅς ἐστιν
  choice: Ngài là
  rationale: Chuyển đại từ quan hệ sang một câu độc lập tự nhiên trong tiếng Việt, với chủ thể vẫn rõ ràng là Đấng Christ.
- source_word: ἡ κεφαλή
  choice: đầu
  rationale: Giữ nguyên ẩn dụ Hy Lạp thay vì thay bằng từ giải nghĩa như “Đấng cai trị”; chú thích nêu rõ sắc thái tối cao trong ngữ cảnh.
- source_word: πάσης ἀρχῆς καὶ ἐξουσίας
  choice: mọi quyền cai trị và thẩm quyền
  rationale: Diễn đạt tính bao quát của πάσης và giữ cặp khái niệm chỉ các quyền lực cai trị; cách nói này tự nhiên hơn các thuật ngữ cổ như “chủ quyền” hay “chấp chính”.
theological_decisions:
- issue: Ý nghĩa sự đầy trọn của các tín hữu trong Đấng Christ
  choice: Khẳng định các tín hữu đã được làm cho đầy trọn trong Đấng Christ, nhưng không xác định sự đầy trọn ấy bằng một hệ thống giáo lý về sự hoàn hảo hay tình trạng vô tội.
  alternative: “Anh em được trọn vẹn trong Ngài” hoặc “anh em được đầy dẫy trong Ngài.”
  rationale: “Được làm cho đầy trọn” bảo toàn thể bị động, mối liên hệ với “sự đầy trọn” ở câu trước và độ rộng thần học của lời khẳng định.
- issue: Sắc thái của κεφαλή đối với các quyền lực
  choice: Giữ ẩn dụ “đầu,” trong ngữ cảnh hàm ý Đấng Christ tối cao trên mọi quyền cai trị và thẩm quyền.
  alternative: Dịch giải nghĩa là “Đấng cai trị” hoặc hiểu là “nguồn.”
  rationale: Ngữ cảnh về các quyền lực vũ trụ nghiêng mạnh về quyền tối thượng, nhưng bản văn chính vẫn nên giữ ẩn dụ thay vì âm thầm thay nó bằng lời giải nghĩa.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” theo lối xưng hô cộng đồng quen thuộc trong thư tín Tân Ước; viết hoa “Ngài” để tham chiếu rõ đến Đấng Christ. Tách mệnh đề quan hệ thành hai câu nhằm tránh cấu trúc tiếng Việt gượng mà không thay đổi quan hệ ngữ nghĩa.
