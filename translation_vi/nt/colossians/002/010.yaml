review_pass:
  verdict: revise
  source_fidelity: Bản nháp giữ được liên từ, thể hoàn thành bị động của πεπληρωμένοι, cụm “trong Ngài,” và ẩn dụ κεφαλή. Tuy nhiên, “đầu của mọi quyền...” có thể gợi Ngài là người đứng đầu của từng cơ cấu quyền lực, trong khi câu Hy Lạp xác nhận Ngài là đầu/tối cao trên toàn bộ các quyền thống trị và thẩm quyền. Thêm “trên” làm rõ quan hệ mà không giải nghĩa thay ẩn dụ.
  naturalness: “Đã được làm cho đầy trọn” có thể hiểu được nhưng không thật tự nhiên trong tiếng Việt hiện đại. “Đã được làm cho đầy đủ” tự nhiên hơn, vẫn giữ thể bị động và trạng thái kết quả; chú thích duy trì rõ các cách diễn đạt theo mô-típ “đầy trọn.” Cụm “đầu trên mọi...” cũng tự nhiên và rõ hơn “đầu của mọi...”.
  terminology: Giữ “Ngài,” “anh em,” và “Đầu” theo văn phong thư tín Cơ Đốc trang trọng. “Quyền thống trị và thẩm quyền” phản ánh cặp ἀρχή và ἐξουσία trong ngữ cảnh các quyền lực cai trị, tránh thuật ngữ cổ hoặc diễn giải giáo lý.
  issues:
  - severity: low
    issue: Cụm “đã được làm cho đầy trọn” hơi gượng trong tiếng Việt hiện đại.
    rationale: “Đầy trọn” thường xuất hiện tự nhiên hơn trong danh ngữ “sự đầy trọn”; “được làm cho đầy đủ” là cách diễn đạt hiện đại, rõ nghĩa hơn cho kết cấu bị động của πεπληρωμένοι.
  - severity: medium
    issue: “Ngài là đầu của mọi quyền cai trị và thẩm quyền” chưa diễn đạt rõ quan hệ tối cao của κεφαλή với các quyền lực.
    rationale: Giới từ “trên” phản ánh quan hệ Ngài là κεφαλή đối với/tối cao trên mọi ἀρχή và ἐξουσία, đồng thời vẫn giữ ẩn dụ “Đầu” trong bản văn chính.
