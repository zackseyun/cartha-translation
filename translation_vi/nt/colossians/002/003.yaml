reference: Colossians 2:3
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐν ᾧ εἰσιν πάντες οἱ θησαυροὶ τῆς σοφίας ⸀καὶ γνώσεως ἀπόκρυφοι.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/003.yaml
  text: in whom are hidden all the treasures of wisdom and knowledge[a][b].
translation:
  language: vi
  text: Trong Đấng ấy, mọi kho tàng của sự khôn ngoan và tri thức đều được ẩn giấu[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Trong đó,” nếu hiểu đại từ quan hệ này theo nghĩa rộng hơn là chỉ mầu nhiệm của Đức Chúa Trời, thay vì trực tiếp chỉ Đấng Christ.'
    reason: alternative_reading
  - marker: b
    text: 'Cũng có thể dịch: “được cất giữ”; tính từ Hy Lạp có thể gợi ý điều bị che giấu hoặc được cất giữ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ᾧ
  choice: Trong Đấng ấy
  rationale: Đại từ quan hệ ở cách dữ liệu số ít tự nhiên nhất quy chiếu về danh từ chỉ ngôi vị ở ngay trước đó là Đấng Christ (2:2). “Trong Đấng ấy” giữ được quan hệ quy chiếu cá nhân và ý nghĩa của ἐν; chú thích bảo lưu khả năng hiểu rộng hơn.
- source_word: πάντες οἱ θησαυροὶ
  choice: mọi kho tàng
  rationale: Cụm danh từ số nhiều có mạo từ diễn đạt tính toàn thể xác định. “Mọi kho tàng” tự nhiên trong tiếng Việt và giữ nguyên mức độ bao quát của lời khẳng định.
- source_word: τῆς σοφίας καὶ γνώσεως
  choice: của sự khôn ngoan và tri thức
  rationale: Giữ hai khái niệm liên hệ nhưng phân biệt là σοφία và γνῶσις, không nhập chúng thành một ý. “Tri thức” diễn đạt trực tiếp γνῶσις trong văn phong hiện đại.
- source_word: ἀπόκρυφοι
  choice: ẩn giấu
  rationale: Diễn đạt trung tính nghĩa “bị che khuất/được cất kín,” không quyết định quá mức rằng các kho tàng là bí truyền hay được dành sẵn an toàn.
- source_word: εἰσιν ... ἀπόκρυφοι
  choice: ẩn giấu
  rationale: Tiếng Việt có thể diễn đạt tự nhiên vị ngữ tính từ mà không cần một động từ tương đương “là”; trật tự “ẩn giấu mọi kho tàng” giữ rõ lời khẳng định của câu Hy Lạp.
theological_decisions:
- issue: Đại từ ᾧ quy chiếu trực tiếp về Đấng Christ hay rộng hơn về mầu nhiệm của Đức Chúa Trời
  choice: Bản văn chính dùng “Trong Đấng ấy,” quy chiếu về Đấng Christ là tiền ngữ gần nhất và mang tính ngôi vị.
  alternative: “Trong mầu nhiệm ấy,” nếu hiểu tiền ngữ rộng hơn là mầu nhiệm của Đức Chúa Trời.
  rationale: Cách quy chiếu về Đấng Christ là tự nhiên nhất theo cú pháp và ngữ cảnh gần, nhưng cấu trúc vẫn cho phép cách hiểu rộng hơn; chú thích bảo tồn sự mơ hồ thật sự.
- issue: ἀπόκρυφοι hàm ý sự bí truyền hay sự cất giữ an toàn trong Đấng Christ
  choice: Dịch trung tính là “ẩn giấu.”
  alternative: “được cất giữ” để nhấn mạnh sự dành sẵn hoặc bảo toàn; “được che giấu” để nhấn mạnh tính kín nhiệm.
  rationale: Tính từ Hy Lạp không tự nó giải quyết trọn vẹn sắc thái thần học. Bản dịch tránh áp đặt rằng sự khôn ngoan không thể tiếp cận, đồng thời cũng không thu hẹp nghĩa thành chỉ sự cất giữ.
translation_notes:
  register: Văn phong trang trọng, tự nhiên và dễ hiểu trong tiếng Việt hiện đại. “Đấng ấy” xác định rõ tiền ngữ mang tính ngôi vị; “mọi kho tàng,” “sự khôn ngoan” và “tri thức” giữ hình ảnh cùng các thuật ngữ phân biệt của nguyên văn. Các dấu chú thích [a], [b] đều xuất hiện trong chính văn.
