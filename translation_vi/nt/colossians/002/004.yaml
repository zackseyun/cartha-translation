  text: ⸀τοῦτο λέγω ἵνα ⸀μηδεὶς ὑμᾶς παραλογίζηται ἐν πιθανολογίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/004.yaml
  text: I say this so that no one may deceive you with persuasive argument.
translation:
  language: vi
  text: Tôi nói điều này để không ai đánh lừa anh chị em bằng lập luận thuyết phục.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “bằng lập luận có vẻ hợp lý” hay “bằng lời lẽ thuyết phục.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο λέγω
  choice: Tôi nói điều này
  rationale: Giữ đại từ chỉ định số ít và cách nói trực tiếp của nguyên văn; “điều này” tự nhiên trong tiếng Việt mà không xác định quá mức phạm vi quy chiếu.
- source_word: ἵνα μηδεὶς
  choice: để không ai
  rationale: Diễn đạt rõ ý mục đích của ἵνα và chủ thể phủ định μηδεὶς bằng tiếng Việt hiện đại, tự nhiên.
- source_word: ὑμᾶς
  choice: anh chị em
  rationale: Thể hiện đại từ ngôi thứ hai số nhiều chỉ cộng đồng tín hữu; cách xưng hô này rõ ràng, trang trọng vừa phải và dễ hiểu.
- source_word: παραλογίζηται
  choice: đánh lừa
  rationale: Động từ nói đến việc làm người khác lầm lạc hoặc bị lừa qua lập luận sai lệch; “đánh lừa” rõ nghĩa và không thu hẹp cảnh báo vào một hệ tư tưởng cụ thể.
- source_word: ἐν πιθανολογίᾳ
  choice: dùng lời lẽ nghe có vẻ thuyết phục
  rationale: ἐν diễn tả phương tiện hoặc cách thức; πιθανολογία chỉ lời nói hay lập luận có sức thuyết phục hoặc có vẻ hợp lý, nhưng không nhất thiết chân thật. Cách dịch này giữ sắc thái bề ngoài đáng tin mà vẫn tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Phạm vi lời cảnh báo trong παραλογίζηται ἐν πιθανολογίᾳ
  choice: Cảnh báo chung về việc bị đánh lừa bằng lời lẽ có vẻ thuyết phục.
  alternative: Cảnh báo riêng về triết học sai lạc hoặc chỉ về tài hùng biện.
  rationale: Câu Hy Lạp không nêu đích danh một hệ giáo lý hay triết học nào. Bản dịch không nên đưa đối tượng hẹp hơn vào câu, dù văn mạch rộng hơn có thể làm rõ mối đe dọa.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng gần gũi. Cấu trúc được sắp xếp tự nhiên theo tiếng Việt; “nghe có vẻ thuyết phục” bảo tồn sự nhập nhằng giữa sức thuyết phục thực tế và vẻ hợp lý bề ngoài.
