id: COL.2.1
reference: Colossians 2:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Θέλω γὰρ ὑμᾶς εἰδέναι ἡλίκον ἀγῶνα ἔχω ⸀ὑπὲρ ὑμῶν καὶ τῶν ἐν Λαοδικείᾳ καὶ ὅσοι οὐχ ἑόρακαν τὸ πρόσωπόν μου ἐν σαρκί,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/001.yaml
  text: For I want you to know how great a struggle I have for you and for those in Laodicea[a], and for all who have not seen my face in the flesh,
translation:
  language: vi
  text: Vì tôi muốn anh chị em biết cuộc tranh đấu lớn lao biết bao mà tôi đang chịu cho anh chị em, cho những người ở Lao-đi-xê, và cho tất cả những ai chưa từng gặp mặt tôi bằng xương bằng thịt[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “chưa từng trực tiếp gặp mặt tôi.” Tiếng Hy Lạp sát chữ là “chưa từng thấy mặt tôi trong xác thịt”; ở đây cụm này chỉ sự hiện diện thể chất.
    reason: lexical_alternative
lexical_decisions:
- source_word: Θέλω γὰρ ὑμᾶς εἰδέναι
  choice: Vì tôi muốn anh chị em biết
  rationale: “Vì” giữ chức năng nối kết của γάρ với lập luận trước; cấu trúc “tôi muốn anh chị em biết” diễn đạt tự nhiên và trực tiếp θέλω ... ὑμᾶς εἰδέναι.
- source_word: ἡλίκον ἀγῶνα ἔχω
  choice: tôi đang tranh đấu lớn lao biết bao
  rationale: ἡλίκον nhấn mạnh mức độ lớn lao, còn ἀγών chỉ sự nỗ lực, vật lộn quyết liệt. Cách diễn đạt này tự nhiên hơn lối dịch sát hình thức “tôi có một cuộc tranh đấu”.
- source_word: ὑπὲρ ὑμῶν
  choice: cho anh chị em
  rationale: ὑπέρ ở đây mang nghĩa vì lợi ích hoặc thay mặt cho người khác; “cho” giữ được nghĩa rộng ấy mà không thêm ý ngoài văn bản.
- source_word: τῶν ἐν Λαοδικείᾳ
  choice: những người ở Lao-đi-xê
  rationale: Mạo từ cùng cụm giới từ được dùng như danh từ, chỉ những người tại thành Lao-đi-xê.
- source_word: ὅσοι οὐχ ἑόρακαν
  choice: tất cả những ai chưa từng thấy
  rationale: “Tất cả những ai” giữ sắc thái bao quát của ὅσοι; “chưa từng thấy” chuyển tải kết quả còn hiệu lực của thì hoàn thành ἑόρακαν.
- source_word: τὸ πρόσωπόν μου ἐν σαρκί
  choice: mặt tôi bằng xương bằng thịt
  rationale: Giữ hình ảnh “mặt tôi” của πρόσωπον và diễn đạt ἐν σαρκί bằng thành ngữ Việt tự nhiên, chỉ việc trực tiếp gặp Phao-lô trong sự hiện diện thể chất.
theological_decisions:
- issue: Ý nghĩa của σάρξ trong cụm ἐν σαρκί
  choice: bằng xương bằng thịt
  alternative: trực tiếp; trong thân xác
  rationale: Ở đây σάρξ không nói về bản tính tội lỗi mà về sự hiện diện thể chất. “Bằng xương bằng thịt” vừa giữ hình ảnh thân xác vừa tránh gây hiểu lầm thần học.
- issue: Phạm vi của ὅσοι
  choice: tất cả những ai chưa từng thấy mặt tôi
  alternative: những người chưa từng thấy mặt tôi
  rationale: Giữ từ “tất cả” để phản ánh lực bao quát của ὅσοι, không giới hạn nhóm này chỉ vào người Lao-đi-xê.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” để chỉ cộng đồng tín hữu số nhiều; phiên âm địa danh theo cách quen thuộc trong Kinh Thánh tiếng Việt. Câu giữ dấu phẩy cuối vì nguyên văn là phần mở đầu của một câu tiếp diễn sang câu 2.
