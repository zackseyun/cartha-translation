  to: Vì tôi muốn anh chị em biết cuộc tranh đấu lớn lao biết bao mà tôi đang chịu cho anh chị em, cho những người ở Lao-đi-xê, và cho tất cả những ai chưa từng gặp mặt tôi bằng xương bằng thịt[a],
