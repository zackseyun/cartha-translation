id: COL.2.23
reference: Colossians 2:23
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἅτινά ἐστιν λόγον μὲν ἔχοντα σοφίας ἐν ἐθελοθρησκίᾳ καὶ ταπεινοφροσύνῃ καὶ ἀφειδίᾳ σώματος, οὐκ ἐν τιμῇ τινι πρὸς πλησμονὴν τῆς σαρκός.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/023.yaml
  text: These indeed have an appearance of wisdom in self-made religion and humility and harsh treatment of the body[d][c][b][a], but are of no value against the indulgence of the flesh.
translation:
  language: vi
  text: Những điều ấy quả có vẻ khôn ngoan trong sự thờ phượng do mình tự đặt ra[b], sự khiêm nhường và việc đối xử khắc khổ với thân thể; nhưng chẳng có giá trị gì để chống lại sự buông thả của xác thịt[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mệnh đề cuối trong tiếng Hy Lạp rất khó hiểu. Cũng có thể dịch: “không hề tôn trọng thân thể, mà chỉ làm thỏa mãn xác thịt,” hoặc: “chẳng có chút giá trị nào đối với sự thỏa mãn của xác thịt.” “Xác thịt” ở đây có thể chỉ những ham muốn sa ngã của con người.'
    reason: alternative_reading
  - marker: b
    text: 'Cũng có thể dịch: “sự thờ phượng do mình áp đặt”; theo lối dịch truyền thống: “sự thờ phượng theo ý riêng.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἅτινά
  choice: Những điều ấy
  rationale: Chỉ trở lại các quy định ở câu 21–22 và giữ lực hồi chỉ của đại từ Hy Lạp.
- source_word: λόγον μὲν ἔχοντα σοφίας
  choice: quả có vẻ khôn ngoan
  rationale: 'Diễn đạt tự nhiên sắc thái nhượng bộ: các thực hành này mang dáng vẻ hoặc tiếng là khôn ngoan, nhưng không có hiệu lực thật sự.'
- source_word: ἐθελοθρησκίᾳ
  choice: sự thờ phượng tự đặt ra
  rationale: Từ hiếm này chỉ sự thờ phượng phát sinh từ ý muốn con người; cách dịch tránh khái niệm tôn giáo quá rộng và giữ sắc thái tiêu cực theo ngữ cảnh.
- source_word: ταπεινοφροσύνῃ
  choice: sự khiêm nhường
  rationale: Giữ nghĩa từ vựng thông thường; ngữ cảnh cho thấy sắc thái mỉa mai hoặc khổ hạnh mà không cần thêm lời diễn giải vào chính văn.
- source_word: ἀφειδίᾳ σώματος
  choice: việc khắc khổ với thân thể
  rationale: Truyền đạt sự đối xử nghiêm khắc, không nương nhẹ với thân thể trong lối tu khổ hạnh bằng tiếng Việt tự nhiên.
- source_word: οὐκ ἐν τιμῇ τινι
  choice: chẳng có giá trị gì
  rationale: Hiểu τιμή theo nghĩa giá trị hoặc ích lợi trong mạch lập luận, đồng thời thừa nhận cấu trúc Hy Lạp khó xác định.
- source_word: πρὸς πλησμονὴν
  choice: trong việc kiềm chế sự thỏa mãn
  rationale: Diễn đạt cách hiểu theo ngữ cảnh rằng các quy định khổ hạnh không có hiệu lực chống lại hoặc kiềm chế sự thỏa mãn của xác thịt.
- source_word: τῆς σαρκός
  choice: của xác thịt
  rationale: Giữ thuật ngữ thần học có chủ ý của Phao-lô và không thu hẹp nó thành một cách giải thích như bản tính tội lỗi.
theological_decisions:
- issue: Ý nghĩa của mệnh đề khó οὐκ ἐν τιμῇ τινι πρὸς πλησμονὴν τῆς σαρκός
  choice: Các thực hành khổ hạnh chẳng có giá trị trong việc kiềm chế sự thỏa mãn của xác thịt.
  alternative: Chúng không dành chút tôn trọng nào cho thân thể và chỉ làm thỏa mãn xác thịt; hoặc chúng chẳng có danh giá gì đối với việc làm thỏa mãn xác thịt.
  rationale: Cú pháp Hy Lạp cô đọng và còn tranh luận. Cách chọn phù hợp nhất với sự tương phản giữa vẻ khôn ngoan bề ngoài và sự bất lực thực tế, nhưng chú thích vẫn bảo tồn các khả năng khác.
- issue: Nghĩa của σάρξ
  choice: xác thịt
  alternative: bản tính tội lỗi hoặc các ham muốn sa ngã
  rationale: Dịch sát thuật ngữ giúp bảo tồn độ rộng và sức căng thần học trong cách dùng của Phao-lô, thay vì quyết định sẵn một cách giải nghĩa.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Quả có vẻ” giữ sắc thái nhượng bộ của μέν; “khắc khổ với thân thể” diễn tả lối tu khổ hạnh tự nhiên hơn cách dịch từng chữ. Các dấu chú thích [a], [b] đều xuất hiện trong chính văn.
