  to: Những điều ấy quả có vẻ khôn ngoan trong sự thờ phượng do mình tự đặt ra[b], sự khiêm nhường và việc đối xử khắc khổ với thân thể; nhưng chẳng có giá trị gì để chống lại sự buông thả của xác thịt[a].
