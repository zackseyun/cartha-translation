  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἅ ἐστιν σκιὰ τῶν μελλόντων, τὸ δὲ σῶμα ⸀τοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/017.yaml
  text: These are a shadow of the things to come[b][a], but the body is Messiah's.
translation:
  language: vi
  text: Những điều ấy là bóng của những điều sắp đến; còn thân thể[a] là của Đấng Mê-si.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch “thực thể” hoặc “thực tại”: “còn thực thể/thực tại là của Đấng Mê-si.”'
    reason: Bảo lưu cách hiểu ẩn dụ của σῶμα trong thế đối lập với “bóng”, đồng thời giữ quan hệ sở hữu cách của τοῦ Χριστοῦ.
lexical_decisions:
- source_word: ἅ
  choice: Những điều ấy
  rationale: Đại từ quan hệ trung tính số nhiều quy chiếu về các vấn đề ăn uống, kỳ lễ, ngày trăng mới và ngày Sa-bát ở câu trước; cách diễn đạt này tự nhiên và giữ rõ quan hệ hồi chỉ.
- source_word: σκιὰ
  choice: bóng
  rationale: Giữ hình ảnh trực tiếp của nguyên văn và sự tương phản với σῶμα; tiếng Việt không cần mạo từ tương ứng với 'a'.
- source_word: τῶν μελλόντων
  choice: của những điều sắp đến
  rationale: Phân từ có mạo từ được hiểu như danh từ; cách dịch này giữ hướng tương lai mà không quyết định đó là các thực tại cánh chung, sự ứng nghiệm nơi Đấng Mê-si, hay cả hai.
- source_word: δὲ
  choice: còn
  rationale: Đánh dấu sự tương phản giữa 'bóng' và 'thân thể' một cách tự nhiên trong tiếng Việt, không làm sắc thái đối lập mạnh quá mức.
- source_word: σῶμα
  choice: thân thể
  rationale: Dịch trực tiếp nghĩa thông thường của σῶμα và bảo tồn ẩn dụ 'bóng–thân thể' cùng độ căng giải nghĩa của nguyên văn, thay vì diễn giải sẵn thành 'thực thể' hay 'thực tại'.
- source_word: τοῦ Χριστοῦ
  choice: thuộc về Đấng Mê-si
  rationale: Diễn đạt rõ quan hệ sở hữu của sở hữu cách Hy Lạp; Χριστός được hiểu theo nghĩa tước hiệu và dịch là 'Đấng Mê-si'.
theological_decisions:
- issue: Ý nghĩa của σῶμα trong thế đối lập với σκιά
  choice: Giữ cách dịch trang trọng, trực tiếp là 'thân thể'.
  alternative: Dịch theo nghĩa ẩn dụ là 'thực thể' hoặc 'thực tại'.
  rationale: Nguyên văn dùng chính từ 'thân thể' và phép đối chiếu với 'bóng'. Giữ hình ảnh này tránh âm thầm giải quyết một ẩn dụ có thể được hiểu là vật thể tạo bóng hoặc thực tại trọn vẹn.
- issue: Cách hiểu sở hữu cách τοῦ Χριστοῦ
  choice: Dịch là 'thuộc về Đấng Mê-si'.
  alternative: Có thể hiểu và dịch gọn là 'là thân thể của Đấng Mê-si', hoặc diễn giải 'thực tại thuộc về Đấng Mê-si'.
  rationale: Cụm Hy Lạp lược động từ và có thể mang sắc thái sở hữu. 'Thuộc về' làm câu tiếng Việt sáng nghĩa nhưng không xác định thêm bản chất của 'thân thể'.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “chỉ là” để làm rõ tính chất bóng so với thân thể mà không thêm một hệ thống thần học; dùng “Đấng Mê-si” cho Χριστός với tư cách tước hiệu. Dấu chú thích [a] được đặt ngay sau cụm từ có cách hiểu thay thế.
