revisions:
- from: Những điều ấy chỉ là bóng của những điều sắp đến, còn thân thể thì thuộc về Đấng Mê-si[a].
  to: Những điều ấy là bóng của những điều sắp đến; còn thân thể[a] là của Đấng Mê-si.
  rationale: Bỏ “chỉ” để tránh thêm sắc thái không được nêu trực tiếp; đổi “thuộc về” thành “là của” để phản ánh gọn và gần hơn vị ngữ sở hữu cách được lược động từ trong tiếng Hy Lạp. Sửa chú thích để không biến sở hữu cách thành quan hệ “ở nơi”.
