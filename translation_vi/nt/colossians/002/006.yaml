source:
  edition: SBLGNT
  text: Ὡς οὖν παρελάβετε τὸν Χριστὸν Ἰησοῦν τὸν κύριον, ἐν αὐτῷ περιπατεῖτε,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/006.yaml
  text: Therefore[a], just as you received Messiah Jesus the Lord, walk in him,
translation:
  language: vi
  text: Vậy, anh chị em đã tiếp nhận Đấng Mê-si-a Giê-su là Chúa thể nào, thì hãy bước đi trong Ngài thể ấy.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὡς οὖν
  choice: Vậy, như
  rationale: “Vậy” giữ quan hệ suy luận của οὖν với phần trước, còn “như” giữ lực so sánh của ὡς giữa việc đã tiếp nhận và cách tiếp tục sống.
- source_word: παρελάβετε
  choice: đã tiếp nhận
  rationale: Động từ aorist chỉ việc đã xảy ra; “tiếp nhận” đủ rộng để bao hàm cả việc đón nhận sứ điệp lẫn chính Đấng được rao truyền, không thu hẹp thành chỉ học biết hay đồng ý.
- source_word: τὸν Χριστὸν Ἰησοῦν
  choice: Đấng Mê-si-a Giê-su
  rationale: Χριστός ở đây mang lực của tước hiệu; “Đấng Mê-si-a” chuyển tải ý nghĩa của tước hiệu, còn Ἰησοῦν được phiên âm theo cách dùng tiếng Việt hiện đại.
- source_word: τὸν κύριον
  choice: là Chúa
  rationale: “Chúa” giữ tước hiệu Cơ Đốc học của κύριος. Từ “là” giúp chuỗi đồng vị trong tiếng Hy Lạp trở nên tự nhiên và rõ nghĩa trong tiếng Việt mà không thêm một chủ thể mới.
- source_word: ἐν αὐτῷ
  choice: trong Ngài
  rationale: Giữ nguyên cách nói cô đọng về sự ở trong hay gắn kết với Đấng Mê-si-a, thay vì diễn giải thành “hiệp nhất với Ngài” và làm mất độ mở của nguyên văn.
- source_word: περιπατεῖτε
  choice: hãy bước đi
  rationale: Thể mệnh lệnh hiện tại được diễn đạt bằng “hãy”; “bước đi” bảo tồn ẩn dụ quen thuộc của Phao-lô về nếp sống và cách cư xử, thay vì làm phẳng thành “hãy sống”.
theological_decisions:
- issue: Cách dịch Χριστός trong chuỗi tước hiệu của Phao-lô
  choice: Đấng Mê-si-a Giê-su
  alternative: Đấng Christ Giê-su
  rationale: Ngữ cảnh và cấu trúc có mạo từ cho phép hiểu Χριστός là tước hiệu. Bản chính chuyển tải nghĩa của tước hiệu, còn cách gọi truyền thống được ghi ở chú thích để người đọc dễ nhận biết.
- issue: Ngôn ngữ về sự kết hợp trong ἐν αὐτῷ
  choice: trong Ngài
  alternative: trong sự hiệp nhất với Ngài
  rationale: Nguyên văn ngắn gọn và có chiều sâu thần học nhưng không giải thích chính xác bản chất của mối liên hệ. “Trong Ngài” bảo tồn sự cô đọng và độ mở ấy.
- issue: Quan hệ giữa Ἰησοῦν và τὸν κύριον
  choice: Giê-su là Chúa
  alternative: Giê-su, Chúa
  rationale: Cụm Hy Lạp có cấu trúc đồng vị. Tiếng Việt cần từ nối “là” để câu tự nhiên; cách này nhận diện Giê-su bằng tước hiệu “Chúa” mà không biến câu thành một lời giải thích dài hơn nguyên văn.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại. “Anh chị em” biểu đạt rõ chủ thể số nhiều hàm ẩn trong động từ mà không giới hạn giới tính. “Bước đi” được giữ như một ẩn dụ dễ hiểu về nếp sống; “Ngài” là đại từ kính trọng tự nhiên trong ngữ cảnh nói về Chúa.
