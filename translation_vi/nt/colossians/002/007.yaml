id: COL.2.7
reference: Colossians 2:7
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐρριζωμένοι καὶ ἐποικοδομούμενοι ἐν αὐτῷ καὶ ⸀βεβαιούμενοι τῇ πίστει καθὼς ἐδιδάχθητε, ⸀περισσεύοντες ἐν εὐχαριστίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/007.yaml
  text: having been rooted and being built up in him[a], and being established in the faith just as you were taught, overflowing with thanksgiving.
translation:
  language: vi
  text: đã bén rễ và đang được xây dựng trong Ngài, được làm vững chắc trong đức tin[a] đúng như anh chị em đã được dạy, và chan chứa lòng cảm tạ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “trong lòng tin” hoặc “trong sự trung tín.” Từ Hy Lạp pistis có thể mang nghĩa đức tin, lòng tin cậy hoặc sự trung tín; tuy nhiên, tại đây “đức tin” có lẽ chỉ đức tin mà họ đã được dạy.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐρριζωμένοι
  choice: đã bén rễ
  rationale: Phân từ hoàn thành thụ động diễn tả việc đã xảy ra và còn kết quả hiện tại; “đã bén rễ” giữ nguyên hình ảnh cây cối và tự nhiên trong tiếng Việt.
- source_word: ἐποικοδομούμενοι
  choice: đang được xây dựng
  rationale: Phân từ hiện tại thụ động diễn tả tiến trình liên tục; cách dịch này giữ hình ảnh xây dựng và thể thụ động của nguyên văn.
- source_word: ἐν αὐτῷ
  choice: trong Ngài
  rationale: Đại từ chỉ về Đấng Christ trong văn cảnh gần; giữ đại từ thay vì thay bằng danh xưng.
- source_word: βεβαιούμενοι
  choice: được làm vững chắc
  rationale: Diễn đạt ý được khiến nên kiên cố, ổn định, đồng thời giữ thể thụ động mà không thu hẹp nghĩa thành chỉ được thêm sức.
- source_word: τῇ πίστει
  choice: trong đức tin
  rationale: Mạo từ và mệnh đề “đúng như anh chị em đã được dạy” cho thấy nhiều khả năng đây là đức tin hay nội dung đức tin họ đã tiếp nhận; bản dịch vẫn giữ độ rộng nghĩa của πίστις.
- source_word: καθὼς ἐδιδάχθητε
  choice: đúng như anh chị em đã được dạy
  rationale: Giữ lực so sánh của καθώς và thể thụ động; “anh chị em” là lối xưng hô số nhiều tự nhiên, bao hàm trong tiếng Việt hiện đại.
- source_word: περισσεύοντες
  choice: chan chứa
  rationale: Phân từ hiện tại chỉ sự dồi dào; “chan chứa” truyền đạt sinh động ý tràn đầy và kết hợp tự nhiên với lòng cảm tạ.
- source_word: ἐν εὐχαριστίᾳ
  choice: lòng cảm tạ
  rationale: Diễn đạt tự nhiên trạng thái hay phương diện mà sự dư dật được bày tỏ; “cảm tạ” phù hợp sắc thái hướng về Đấng được cảm tạ hơn từ “biết ơn” đơn thuần.
theological_decisions:
- issue: Nghĩa của τῇ πίστει
  choice: “trong đức tin,” có khả năng chỉ đức tin hay nội dung đức tin đã được dạy
  alternative: “bởi đức tin”; “trong lòng tin”; hoặc “trong sự trung tín”
  rationale: Mạo từ và phần tiếp theo nói đến điều họ đã được dạy nghiêng về một thực tại đức tin có nội dung, nhưng πίστις vẫn có thể mang nghĩa tin cậy hoặc trung tín. Bản văn chính không thêm lời giải thích mang tính hệ phái, còn chú thích bảo tồn các khả năng từ vựng.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. Giữ song song hai hình ảnh bén rễ và xây dựng, các sắc thái thời của phân từ, cùng thế thụ động trong nguyên văn. Dùng “anh chị em” để biểu đạt đại từ số nhiều bao hàm; viết hoa “Ngài” theo quy ước tiếng Việt trang trọng khi chỉ về Đấng Christ.
