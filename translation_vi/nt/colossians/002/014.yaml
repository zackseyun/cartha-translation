id: COL.2.14
reference: Colossians 2:14
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐξαλείψας τὸ καθ’ ἡμῶν χειρόγραφον τοῖς δόγμασιν ὃ ἦν ὑπεναντίον ἡμῖν, καὶ αὐτὸ ἦρκεν ἐκ τοῦ μέσου προσηλώσας αὐτὸ τῷ σταυρῷ·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/014.yaml
  text: having wiped out the record of debt against us in decrees[a], which was opposed to us, and he has taken it out of the way[b], having nailed it to the cross.
translation:
  language: vi
  text: Ngài đã xóa bỏ giấy ghi nợ chống lại chúng ta, gồm các điều lệ[a], vốn đối nghịch với chúng ta; Ngài đã dẹp nó đi[b], khi đóng đinh nó vào thập tự giá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “văn tự mắc nợ,” “giấy nợ,” hoặc “văn bản viết tay.” Cụm Hy Lạp này cũng có thể được hiểu là “trong các điều lệ” hoặc “liên quan đến các điều lệ.”'
    reason: lexical_and_syntactical_alternative
  - marker: b
    text: Thành ngữ Hy Lạp có nghĩa là loại bỏ, cất đi “khỏi giữa” hay “khỏi đường đi.”
    reason: idiomatic_alternative
lexical_decisions:
- source_word: ἐξαλείψας
  choice: đã xóa bỏ
  rationale: Diễn đạt hành động xóa sạch điều đã được viết, tự nhiên trong tiếng Việt hiện đại và phù hợp với phân từ bất định quá khứ.
- source_word: χειρόγραφον
  choice: văn tự ghi món nợ
  rationale: Giữ cả hình ảnh một văn bản viết tay có giá trị ràng buộc lẫn ý nghĩa nghĩa vụ mắc nợ, không thu hẹp thành một loại chứng từ pháp lý chuyên biệt.
- source_word: καθ’ ἡμῶν
  choice: chống lại chúng ta
  rationale: Truyền đạt trực tiếp chiều hướng bất lợi của văn tự đối với chúng ta.
- source_word: τοῖς δόγμασιν
  choice: bằng các điều lệ
  rationale: Giữ mối liên hệ khó xác định giữa văn tự và các quy định, đồng thời tránh đồng nhất rõ ràng các điều lệ này với riêng luật Môi-se.
- source_word: ὑπεναντίον
  choice: đối nghịch với chúng ta
  rationale: Bảo tồn sắc thái đối kháng mà không tăng cường thành sự thù địch mang tính cảm xúc.
- source_word: ἦρκεν ἐκ τοῦ μέσου
  choice: đã cất nó khỏi đường đi
  rationale: Phản ánh thể hoàn thành với kết quả còn hiệu lực và chuyển thành ngữ Hy Lạp sang cách nói tiếng Việt tự nhiên.
- source_word: προσηλώσας
  choice: bằng cách đóng đinh
  rationale: Hiểu phân từ là phương tiện qua đó văn tự được loại bỏ, phù hợp cú pháp và mạch ý.
- source_word: τῷ σταυρῷ
  choice: vào thập tự giá
  rationale: Cách gọi quen thuộc, trang trọng và rõ nghĩa trong văn cảnh Cơ Đốc.
theological_decisions:
- issue: Ý nghĩa của χειρόγραφον τοῖς δόγμασιν
  choice: một văn tự ghi món nợ có quan hệ với các điều lệ và chống lại chúng ta
  alternative: chính luật Môi-se; giấy nợ về các tội lỗi; bản cáo trạng pháp lý
  rationale: Bản dịch duy trì ẩn dụ về chứng từ mắc nợ và sự mơ hồ cú pháp của cụm chỉ các điều lệ, không ép câu vào một hệ thống thần học riêng.
- issue: Chủ thể của ἦρκεν
  choice: Ngài, tức chủ thể thần linh trong văn mạch, đã cất văn tự đi
  alternative: giữ chủ thể hoàn toàn hàm ẩn
  rationale: Tiếng Việt cần một chủ thể rõ hơn để câu tự nhiên; văn mạch trước đó chỉ về Đức Chúa Trời, nhưng đại từ “Ngài” tránh lặp lại hoặc diễn giải quá mức.
- issue: Quan hệ của προσηλώσας với động từ chính
  choice: đóng đinh là phương tiện cất văn tự khỏi đường đi
  alternative: 'một hành động đồng thời hoặc tiếp nối: sau khi đóng đinh'
  rationale: “Bằng cách” là cách hiểu cú pháp hợp lý, nhưng chú thích ghi nhận khả năng giữ cấu trúc phân từ ít xác định hơn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “văn tự” để giữ sắc thái chứng từ pháp lý nhưng bổ sung “ghi món nợ” nhằm làm rõ nghĩa; dùng dấu gạch ngang để giúp người đọc nhận ra mệnh đề quan hệ quy chiếu về văn tự.
