id: COL.2.5
reference: Colossians 2:5
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἰ γὰρ καὶ τῇ σαρκὶ ἄπειμι, ἀλλὰ τῷ πνεύματι σὺν ὑμῖν εἰμι, χαίρων καὶ βλέπων ὑμῶν τὴν τάξιν καὶ τὸ στερέωμα τῆς εἰς Χριστὸν πίστεως ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/005.yaml
  text: For even if I am absent in the flesh[a], yet I am with you in spirit[c][b], rejoicing and seeing your good order and the firmness of your faith in Messiah.
translation:
  language: vi
  text: Vì dù tôi vắng mặt về thân thể[a], nhưng tôi vẫn ở cùng anh em trong tinh thần[b], vui mừng khi thấy nề nếp của anh em và sự vững vàng của đức tin anh em nơi Đấng Mê-si[c][d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “về xác thịt”; ở đây có nghĩa là về thân thể hoặc thể chất.'
    reason: lexical_alternative
  - marker: b
    text: Có thể hiểu là tinh thần của Phao-lô; một cách hiểu khác là ông ở cùng họ trong hoặc nhờ Thánh Linh.
    reason: theological_ambiguity
  - marker: c
    text: 'Hy Lạp: Christos, một tước hiệu có nghĩa là “Đấng Được Xức Dầu”; theo cách gọi Hê-bơ-rơ là “Đấng Mê-si.”'
    reason: lexical_alternative
  - marker: d
    text: 'Cũng có thể hiểu: “sự vững vàng của lòng trung tín anh em đối với Đấng Mê-si.”'
    reason: alternative_reading
lexical_decisions:
- source_word: σαρκί
  choice: về thân thể
  rationale: Trong thế đối lập với πνεύματι, từ này chỉ sự vắng mặt về phương diện thể chất của Phao-lô, chứ không mang nghĩa đạo đức tiêu cực như “bản tính tội lỗi.”
- source_word: πνεύματι
  choice: về tâm linh
  rationale: Cách dịch này giữ thế đối lập với “về thân thể” và tự nhiên nhất là chỉ tâm linh của chính Phao-lô, đồng thời không tuyệt đối loại trừ cách hiểu liên quan đến Thánh Linh.
- source_word: χαίρων καὶ βλέπων
  choice: vui mừng khi thấy
  rationale: Diễn đạt tự nhiên trong tiếng Việt mối liên hệ đồng thời giữa hai phân từ, mà không xác định quá mức việc “thấy” là trực tiếp hay bằng nhận thức.
- source_word: τάξιν
  choice: nề nếp
  rationale: “Nề nếp” diễn đạt trật tự tốt đẹp, đáng khen trong đời sống cộng đồng mà không tạo sắc thái quân sự hoặc cứng nhắc quá mức.
- source_word: στερέωμα
  choice: sự vững vàng
  rationale: Danh từ này chỉ tính chắc chắn, ổn định; “sự vững vàng” giữ được hình ảnh về điều đứng vững và bền chắc.
- source_word: πίστεως
  choice: đức tin
  rationale: Trong kết cấu với εἰς Χριστόν, “đức tin” là nghĩa tự nhiên nhất, còn khả năng mang sắc thái “lòng trung tín” được giữ trong chú thích.
- source_word: εἰς Χριστόν
  choice: nơi Đấng Mê-si
  rationale: εἰς nêu đối tượng hoặc hướng của đức tin; Χριστός ở đây giữ chức năng tước hiệu, nên dịch là “Đấng Mê-si.”
theological_decisions:
- issue: Đối tượng quy chiếu của πνεύματι trong thế đối lập với σαρκί
  choice: 'Tâm linh của Phao-lô: ông vắng mặt về thể chất nhưng hiện diện với họ về tâm linh.'
  alternative: Phao-lô hiện diện với họ nhờ hoặc trong Thánh Linh.
  rationale: Thế đối lập trực tiếp với sự vắng mặt về thân thể nghiêng về tâm linh của chính Phao-lô. Chữ thường và chú thích giúp tránh khẳng định một cơ chế thần học mà câu văn không nói rõ.
- issue: Cách dịch Χριστόν
  choice: Đấng Mê-si
  alternative: Đấng Christ
  rationale: Trong cụm chỉ đối tượng của đức tin, Χριστός vẫn có sức nặng của một tước hiệu hơn là một tên riêng.
- issue: Ý nghĩa của πίστις
  choice: đức tin nơi Đấng Mê-si
  alternative: lòng trung tín đối với Đấng Mê-si
  rationale: “Đức tin” phù hợp nhất với kết cấu εἰς Χριστόν, nhưng trường nghĩa của πίστις cho phép sắc thái “lòng trung tín,” nên phương án đó được bảo lưu trong chú thích.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. “Nề nếp” chuyển tải sắc thái trật tự đáng khen của τάξις; “về tâm linh” giữ thế đối lập với “về thân thể” mà không viết hoa để tránh quyết định dứt khoát rằng πνεῦμα chỉ Thánh Linh.
