id: COL.2.18
reference: Colossians 2:18
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: μηδεὶς ὑμᾶς καταβραβευέτω θέλων ἐν ταπεινοφροσύνῃ καὶ θρησκείᾳ τῶν ἀγγέλων, ⸀ἃ ἑόρακεν ἐμβατεύων, εἰκῇ φυσιούμενος ὑπὸ τοῦ νοὸς τῆς σαρκὸς αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/018.yaml
  text: Let no one disqualify you[a], delighting in humility and the worship of angels, dwelling on what he has seen, vainly puffed up by the mind of his flesh[c][b],
translation:
  language: vi
  text: Đừng để bất cứ ai—kẻ ưa thích sự khiêm nhường và việc thờ phượng các thiên sứ[a], cứ đi sâu vào những điều mình đã thấy[b], và vô cớ tự cao do tâm trí xác thịt của mình—tước mất phần thưởng của anh chị em.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cụm Hy Lạp cũng có thể được hiểu là “sự thờ phượng của các thiên sứ” hoặc “thờ phượng cùng với các thiên sứ.”
    reason: alternative_reading
  - marker: b
    text: Động từ Hy Lạp ở đây hiếm gặp và khó xác định nghĩa; cũng có thể dịch là “chăm chú vào” hoặc “đi sâu vào những điều mình đã thấy.” Một số thủ bản chép “những điều mình chưa thấy.”
    reason: lexical_and_textual_variant
lexical_decisions:
- source_word: καταβραβευέτω
  choice: tước mất phần thưởng
  rationale: Động từ gợi hình ảnh trọng tài xử bất lợi khiến một người mất giải thưởng; cách dịch này giữ được hình ảnh và phù hợp với lời cảnh báo.
- source_word: θέλων
  choice: thích
  rationale: Trong cấu trúc này, phân từ có thể diễn tả sự ưa thích hoặc chủ tâm theo đuổi những thực hành được nêu, hơn là chỉ đơn thuần 'muốn'.
- source_word: ταπεινοφροσύνῃ
  choice: sự khiêm nhường
  rationale: Giữ nghĩa từ vựng thông thường, để văn cảnh cảnh báo cho thấy đây có thể là vẻ khiêm nhường phô trương hoặc khổ hạnh.
- source_word: θρησκείᾳ τῶν ἀγγέλων
  choice: việc thờ phượng các thiên sứ
  rationale: Hiểu sở hữu cách theo nghĩa khách thể là sự thờ phượng hướng đến các thiên sứ; các cách hiểu khác được giữ trong chú thích.
- source_word: ἃ ἑόρακεν ἐμβατεύων
  choice: cứ chăm chú vào những điều mình đã thấy
  rationale: ἐμβατεύω là động từ hiếm và khó; cách dịch này diễn đạt việc chuyên chú hoặc đi sâu vào các thị kiến mà không khẳng định quá mức một nghĩa duy nhất.
- source_word: εἰκῇ
  choice: vô cớ
  rationale: Diễn tả sự tự cao không có căn cứ, đồng thời tự nhiên hơn trong tiếng Việt hiện đại.
- source_word: φυσιούμενος
  choice: tự cao
  rationale: Truyền đạt ẩn dụ về sự phồng lên vì kiêu ngạo bằng một cách nói tự nhiên, trang trọng trong tiếng Việt.
- source_word: νοὸς
  choice: tâm trí
  rationale: Là từ tương đương tự nhiên, trực tiếp và giữ cấu trúc tư tưởng của câu.
- source_word: σαρκὸς
  choice: xác thịt
  rationale: Giữ thuật ngữ theo sát nguyên ngữ, tránh diễn giải thành một hệ thống thần học như 'bản tính tội lỗi'.
theological_decisions:
- issue: Ý nghĩa của θρησκείᾳ τῶν ἀγγέλων
  choice: sự thờ phượng hướng đến các thiên sứ
  alternative: sự thờ phượng của các thiên sứ; thờ phượng cùng với các thiên sứ
  rationale: Cụm sở hữu cách thực sự đa nghĩa. Bản văn chính dùng cách hiểu thông dụng và hợp văn cảnh, còn chú thích bảo tồn các khả năng khác.
- issue: Cách hiểu σάρξ trong τῆς σαρκὸς αὐτοῦ
  choice: xác thịt
  alternative: bản tính tội lỗi
  rationale: Dịch sát giữ nguyên sức căng trong nhân học của Phao-lô và tránh đưa một cách diễn giải giáo lý vào bản văn.
- issue: Dị bản ἃ ἑόρακεν / ἃ μὴ ἑόρακεν
  choice: những điều mình đã thấy
  alternative: những điều mình chưa thấy
  rationale: Theo bản văn SBLGNT được cung cấp; dị bản có μὴ làm thay đổi rõ nghĩa nên được ghi trong chú thích.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh chị em” cho đại từ số nhiều ὑμᾶς; giữ “xác thịt” để bảo toàn thuật ngữ và sức căng thần học của nguyên văn.
