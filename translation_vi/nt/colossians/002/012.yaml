    rationale: Tiếng Việt thường dùng “được sống lại” cho bị động của ἐγείρω trong ngữ cảnh phục sinh; mệnh đề tiếp theo đã xác định Đức Chúa Trời là tác nhân.
  - severity: low
    issue: Cụm “nơi sự hành động” hơi gượng trong văn phong hiện đại.
