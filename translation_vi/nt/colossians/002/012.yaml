reference: Colossians 2:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: συνταφέντες αὐτῷ ἐν τῷ ⸀βαπτισμῷ, ἐν ᾧ καὶ συνηγέρθητε διὰ τῆς πίστεως τῆς ἐνεργείας τοῦ θεοῦ τοῦ ἐγείραντος αὐτὸν ⸀ἐκ νεκρῶν·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/012.yaml
  text: having been buried with him in baptism[a], in which you also were raised with him through faith in the working of God[b], who raised him from the dead.
translation:
  language: vi
  text: Anh chị em đã được chôn cùng với Ngài trong phép báp-têm,[a] và trong đó anh chị em cũng đã được sống lại cùng với Ngài, nhờ đức tin vào hoạt động của Đức Chúa Trời,[b] Đấng đã làm Ngài sống lại từ cõi chết.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc có thể dịch: “trong Ngài”, nếu đại từ quan hệ được hiểu là quy chiếu về Đấng Christ thay vì phép báp-têm.'
    reason: alternative_reading
  - marker: b
    text: 'Hoặc: “nhờ lòng tin”. Từ Hy Lạp được dịch là “đức tin” trong một số ngữ cảnh cũng có thể mang nghĩa “sự trung tín”, nhưng ở đây “đức tin” là nghĩa phù hợp hơn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συνταφέντες αὐτῷ
  choice: đã được chôn cùng với Ngài
  rationale: Giữ thể bị động và ý nghĩa đồng tham dự của tiền tố συν-, đồng thời dùng cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: ἐν τῷ βαπτισμῷ
  choice: trong phép báp-têm
  rationale: Giữ giới từ “trong”, không thu hẹp sắc thái thành phương tiện thuần túy; “phép báp-têm” là cách gọi quen thuộc, trang trọng và dễ hiểu.
- source_word: ἐν ᾧ
  choice: và trong đó
  rationale: Đại từ quan hệ gần nhất quy chiếu về “phép báp-têm”; thêm “và” để thể hiện καί và giúp câu tiếng Việt liền mạch.
- source_word: συνηγέρθητε
  choice: anh chị em cũng đã được khiến sống lại cùng với Ngài
  rationale: Thể hiện thể bị động, số nhiều và tiền tố συν-; “anh chị em” biểu đạt ngôi thứ hai số nhiều bao quát, còn “được khiến sống lại” cho thấy Đức Chúa Trời là tác nhân.
- source_word: διὰ τῆς πίστεως
  choice: nhờ đức tin
  rationale: “Nhờ” diễn đạt phương tiện; “đức tin” là nghĩa phù hợp nhất trong cấu trúc và ngữ cảnh này, dù “lòng tin” cũng có thể dùng.
- source_word: τῆς ἐνεργείας τοῦ θεοῦ
  choice: nơi sự hành động của Đức Chúa Trời
  rationale: Cụm “đức tin nơi” cho thấy đối tượng của đức tin, còn “sự hành động” giữ ý về hoạt động hữu hiệu của Đức Chúa Trời mà không giản lược thành quyền năng trừu tượng.
- source_word: τοῦ ἐγείραντος αὐτὸν ἐκ νεκρῶν
  choice: Đấng đã khiến Ngài sống lại từ cõi chết
  rationale: Chuyển phân từ có mạo từ thành mệnh đề quan hệ trang trọng, tự nhiên; “từ cõi chết” là cách diễn đạt tiếng Việt rõ ràng cho ἐκ νεκρῶν.
theological_decisions:
- issue: Đối tượng quy chiếu của ἐν ᾧ
  choice: 'Hiểu là quy chiếu về phép báp-têm: “trong đó”'
  alternative: 'Có thể hiểu là quy chiếu về Đấng Christ: “trong Ngài”'
  rationale: Tiền ngữ gần nhất về mặt cú pháp là βαπτισμῷ. Tuy vậy, hình thức ᾧ có thể là giống đực hoặc trung, nên ghi chú bảo tồn khả năng quy chiếu về Đấng Christ.
- issue: Ý nghĩa của ngôn ngữ về phép báp-têm
  choice: Giữ nguyên mối liên hệ mạnh giữa phép báp-têm, việc được chôn và được sống lại cùng Đấng Christ
  alternative: Giải thích theo một quan điểm bí tích mạnh hoặc theo quan điểm hoàn toàn biểu tượng
  rationale: Câu Kinh Thánh liên kết các thực tại này với đức tin nhưng không tự mình phân xử các hệ thống giáo lý về hiệu lực của phép báp-têm; bản dịch không thêm cách giải thích hệ phái.
- issue: Quan hệ cú pháp của τῆς ἐνεργείας τοῦ θεοῦ
  choice: “đức tin nơi sự hành động của Đức Chúa Trời”
  alternative: “đức tin được tạo nên bởi sự hành động của Đức Chúa Trời” hoặc “nhờ đức tin vào quyền năng Đức Chúa Trời”
  rationale: Sở hữu cách sau πίστις có thể được hiểu theo hơn một quan hệ. Cách dịch chính phù hợp với ngữ cảnh Đức Chúa Trời khiến Đấng Christ sống lại, nhưng ghi chú bảo tồn sắc thái khác.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” cho đại từ chỉ Đấng Christ, “Đức Chúa Trời” cho θεός, và “anh chị em” để biểu đạt ngôi thứ hai số nhiều một cách bao quát. Giữ cấu trúc một câu nhằm phản ánh mạch lập luận Hy Lạp.
