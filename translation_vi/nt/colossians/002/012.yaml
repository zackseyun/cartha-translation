  source_fidelity: 'Bản nháp giữ đúng các yếu tố trọng yếu: được chôn cùng Đấng Christ trong phép báp-têm, được sống lại cùng Ngài, qua đức tin, và hành động của Đức Chúa Trời là Đấng đã làm Ngài sống lại. Tuy nhiên, ghi chú b đưa vào một cách hiểu cú pháp (“đức tin được tạo nên bởi...”) không được hậu thuẫn bởi mạch dịch tiếng Anh hay bởi cấu trúc tự nhiên của διὰ τῆς πίστεως τῆς ἐνεργείας τοῦ θεοῦ; nên thay bằng lựa chọn từ vựng thực sự có liên hệ đến πίστις.'
  naturalness: “Được khiến sống lại” không tự nhiên trong tiếng Việt hiện đại; “được sống lại” diễn đạt tốt thể bị động trong ngữ cảnh phục sinh. “Sự hành động” khá gượng; “hoạt động” tự nhiên hơn mà vẫn giữ ý ἐνέργεια. Việc nêu rõ chủ ngữ “Anh chị em” giúp câu tiếng Việt hoàn chỉnh mà không thay đổi ngôi số nhiều của nguyên văn.
  terminology: Giữ “phép báp-têm”, “đức tin”, “Đức Chúa Trời”, và “Ngài” là nhất quán với văn phong trang trọng hiện đại. “Đức tin vào hoạt động của Đức Chúa Trời” diễn đạt hợp lý quan hệ của cụm sở hữu cách, không áp đặt một giải thích bí tích hay hệ phái.
