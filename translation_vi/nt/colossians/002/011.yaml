  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐν ᾧ καὶ περιετμήθητε περιτομῇ ἀχειροποιήτῳ ἐν τῇ ἀπεκδύσει τοῦ ⸀σώματος τῆς σαρκός, ἐν τῇ περιτομῇ τοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/011.yaml
  text: In him you also were circumcised with a circumcision not made by hands[a], in the removal of the body of flesh, in the circumcision of Messiah[e][d][c][b],
translation:
  language: vi
  text: Trong Ngài, anh em cũng đã được cắt bì bằng một phép cắt bì không do tay người làm nên[a], qua việc cởi bỏ thân thể xác thịt[b], trong phép cắt bì của Đấng Mê-si-a[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “một phép cắt bì được thực hiện không bởi tay người.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “qua việc lột bỏ thân thể xác thịt.” “Xác thịt” đôi khi được hiểu theo nghĩa diễn giải là “bản tính tội lỗi,” nhưng ở đây bản dịch giữ cách nói sát tiếng Hy Lạp hơn.'
    reason: lexical_alternative
  - marker: c
    text: Cũng có thể hiểu là “bởi phép cắt bì do Đấng Mê-si-a thực hiện” hoặc “phép cắt bì của chính Đấng Mê-si-a.” Tiếng Hy Lạp có thể chỉ phép cắt bì do Ngài thực hiện, thuộc về Ngài, hoặc gắn với Ngài.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν ᾧ
  choice: Trong Ngài
  rationale: Đại từ quan hệ chỉ về Đấng Christ trong văn cảnh trước. Cách dịch này tự nhiên trong tiếng Việt và giữ ý nghĩa ở trong, hay hiệp nhất với, Ngài.
- source_word: περιετμήθητε
  choice: anh em cũng đã được cắt bì
  rationale: Động từ ở thể thụ động, thì aorist, chỉ một hành động đã xảy ra. Giữ hình ảnh cắt bì thay vì diễn giải thành một khái niệm thần học cụ thể.
- source_word: περιτομῇ ἀχειροποιήτῳ
  choice: bằng một phép cắt bì không do tay người làm nên
  rationale: “Bằng” diễn đạt chức năng phương tiện của cách dative; “không do tay người làm nên” giữ thành ngữ Kinh Thánh về điều không bắt nguồn từ hoạt động của con người.
- source_word: ἐν τῇ ἀπεκδύσει
  choice: qua việc cởi bỏ
  rationale: Danh từ ἀπέκδυσις mang nghĩa lột bỏ hoặc cởi bỏ hoàn toàn. “Qua việc” tự nhiên trong tiếng Việt mà vẫn giữ mối liên hệ với phép cắt bì được mô tả.
- source_word: τοῦ σώματος τῆς σαρκός
  choice: thân thể xác thịt
  rationale: Cách diễn đạt cô đọng này giữ mối liên hệ giữa σώμα và σάρξ, đồng thời tránh quyết định rằng cụm từ chỉ đơn thuần là thân thể vật chất hay hoàn toàn đồng nghĩa với bản tính tội lỗi.
- source_word: σαρκός
  choice: xác thịt
  rationale: Giữ thuật ngữ Phao-lô tương đối sát nguyên văn và tránh áp đặt cách giải nghĩa hẹp hơn như “bản tính tội lỗi”.
- source_word: ἐν τῇ περιτομῇ τοῦ Χριστοῦ
  choice: trong phép cắt bì của Đấng Mê-si-a
  rationale: “Trong” phản ánh giới từ ἐν được lặp lại; “của” giữ độ mở của sở hữu cách Hy Lạp, còn Χριστός được chuyển theo nghĩa tước hiệu là “Đấng Mê-si-a”.
theological_decisions:
- issue: Ý nghĩa của “phép cắt bì của Đấng Mê-si-a”
  choice: 'Giữ cấu trúc mở: “phép cắt bì của Đấng Mê-si-a”'
  alternative: “phép cắt bì do Đấng Mê-si-a thực hiện,” “phép cắt bì chính Đấng Mê-si-a chịu,” hoặc “phép cắt bì thuộc về Đấng Mê-si-a”
  rationale: Sở hữu cách τοῦ Χριστοῦ có thể được hiểu theo nhiều quan hệ. Bản dịch không chọn riêng một cách hiểu, nhờ đó giữ được sự mơ hồ và sức căng thần học của nguyên văn.
- issue: Ý nghĩa của “thân thể xác thịt”
  choice: Giữ cụm từ “thân thể xác thịt” mà không diễn giải thêm
  alternative: “thân thể thuộc xác thịt,” “thân thể tội lỗi,” hoặc “bản tính tội lỗi”
  rationale: Cụm Hy Lạp khó xác định dứt khoát. Cách dịch này tránh đưa phần bổ sung của các thủ bản muộn hoặc một quan niệm nhân học cụ thể vào bản văn SBLGNT.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Đại từ “anh em” phù hợp với lời gửi cho cộng đồng tín hữu. Cấu trúc hơi dày được giữ có chủ ý để phản ánh chuỗi bổ nghĩa và sự lặp lại của nguyên văn, trong khi các chú thích làm rõ những cách hiểu khác mà không áp đặt một lập trường hệ phái.
