  text: ὅτι ἐν αὐτῷ κατοικεῖ πᾶν τὸ πλήρωμα τῆς θεότητος σωματικῶς,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/009.yaml
  text: For in him all the fullness of deity dwells bodily,[a]
translation:
  language: vi
  text: Vì trong Ngài, toàn bộ sự viên mãn của thần tính cư ngụ cách có thân thể.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Vì toàn thể sự viên mãn của bản tính Đức Chúa Trời cư ngụ trong Ngài cách có thân thể.”'
    reason: Nêu cách diễn đạt khác cho πᾶν τὸ πλήρωμα τῆς θεότητος và σωματικῶς, đồng thời bảo tồn sức mạnh của θεότης.
lexical_decisions:
- source_word: ὅτι
  choice: Vì
  rationale: Diễn đạt tự nhiên quan hệ nguyên nhân với lời cảnh báo ở câu trước.
- source_word: ἐν αὐτῷ
  choice: trong Ngài
  rationale: Giữ nguyên ý vị trí/quy thuộc, chỉ Đấng Christ, không thêm ý loại trừ vốn không có trong tiếng Hy Lạp.
- source_word: κατοικεῖ
  choice: ngự trị
  rationale: Diễn tả sự hiện diện bền vững và trang trọng; tránh cách nói quá phẳng như “sống”.
- source_word: πᾶν τὸ πλήρωμα
  choice: toàn bộ sự viên mãn
  rationale: Giữ cả ý tổng thể của πᾶν lẫn khái niệm “sự viên mãn” của πλήρωμα.
- source_word: τῆς θεότητος
  choice: của thần tính
  rationale: θεότης nói mạnh về thực tại/bản tính là Đức Chúa Trời, không chỉ những phẩm chất mang tính thần linh.
- source_word: σωματικῶς
  choice: trong thân thể
  rationale: Chuyển trạng từ Hy Lạp thành cụm từ tự nhiên trong tiếng Việt, đồng thời giữ sức nặng về phương diện thân thể mà không giải thích quá mức.
theological_decisions:
- issue: Sức nặng Cơ Đốc học của θεότης và σωματικῶς
  choice: Câu này khẳng định toàn bộ thực tại của thần tính ngự trị trong Đấng Christ trong thân thể.
  alternative: Chỉ các phẩm chất thần linh hoặc sự hiện diện của Đức Chúa Trời ở trong Đấng Christ.
  rationale: θεότης mạnh hơn ý chung về phẩm chất thần linh, còn σωματικῶς nêu rõ phương diện thân thể. Bản dịch giữ nguyên lời khẳng định mạnh mẽ nhưng không xác định thêm cách hiểu vượt quá câu Hy Lạp.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Viết hoa “Ngài” để chỉ Đấng Christ theo thông lệ kính ngữ tiếng Việt; không thêm từ mang ý độc quyền. Cấu trúc tương đối sát nguyên văn nhưng được điều chỉnh cho tự nhiên.
