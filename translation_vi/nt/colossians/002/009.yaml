  rationale: Sửa động từ để phản ánh đúng κατοικεῖ là “cư ngụ” thay vì “ngự trị”. Điều chỉnh vị trí và cách diễn đạt của σωματικῶς thành “cách có thân thể”, giữ tính trạng từ và khẳng định Cơ Đốc học mạnh của nguyên văn mà không giải thích quá mức.
