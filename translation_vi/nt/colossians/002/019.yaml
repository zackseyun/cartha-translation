id: COL.2.19
reference: Colossians 2:19
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ οὐ κρατῶν τὴν κεφαλήν, ἐξ οὗ πᾶν τὸ σῶμα διὰ τῶν ἁφῶν καὶ συνδέσμων ἐπιχορηγούμενον καὶ συμβιβαζόμενον αὔξει τὴν αὔξησιν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/019.yaml
  text: and not holding fast to the Head[a], from whom the whole body, being supplied and held together through the joints and ligaments[c][b], grows with the growth of God.
translation:
  language: vi
  text: và không bám chặt lấy Đầu[a], từ Đầu ấy toàn thân được cung ứng và liên kết với nhau qua các khớp và dây chằng[b], và lớn lên bằng sự tăng trưởng đến từ Đức Chúa Trời[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “níu giữ lấy Đầu.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “được nuôi dưỡng và kết chặt với nhau qua các khớp và dây chằng.”'
    reason: lexical_alternative
  - marker: c
    text: 'Nguyên văn: “lớn lên sự tăng trưởng của Đức Chúa Trời”; cụm từ này có lẽ chỉ sự tăng trưởng đến từ Đức Chúa Trời.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κρατῶν
  choice: bám chặt lấy
  rationale: Diễn đạt việc giữ vững và gắn bó bền chặt, mạnh hơn nghĩa chỉ đơn thuần là “nắm giữ”.
- source_word: κεφαλήν
  choice: Đầu
  rationale: Giữ nguyên hình ảnh thân thể; viết hoa để cho thấy từ này chỉ về Đấng Christ trong văn cảnh.
- source_word: ἐξ οὗ
  choice: Từ Đầu ấy
  rationale: Đại từ quan hệ giống đực quy chiếu về “Đầu”; cách lặp danh từ tự nhiên hơn trong tiếng Việt và làm rõ nguồn cung ứng, liên kết và tăng trưởng.
- source_word: πᾶν τὸ σῶμα
  choice: toàn thân
  rationale: Cách nói tự nhiên, gọn và giữ hình ảnh Hội Thánh là một thân thể trọn vẹn.
- source_word: ἁφῶν
  choice: các khớp
  rationale: Trong ẩn dụ giải phẫu, từ này chỉ các điểm tiếp nối; “các khớp” là cách diễn đạt rõ ràng nhất.
- source_word: συνδέσμων
  choice: dây chằng
  rationale: Chỉ những bộ phận nối kết và giữ các phần của thân thể với nhau; phù hợp với hình ảnh giải phẫu.
- source_word: ἐπιχορηγούμενον
  choice: được cung ứng
  rationale: Giữ nghĩa rộng về việc được cung cấp điều cần thiết, không thu hẹp riêng thành sự nuôi dưỡng.
- source_word: συμβιβαζόμενον
  choice: liên kết với nhau
  rationale: Diễn tả các phần được kết hợp thành một thể thống nhất; tự nhiên hơn lối dịch sát “được giữ cùng nhau”.
- source_word: αὔξει
  choice: lớn lên
  rationale: Tiếp nối tự nhiên hình ảnh một thân thể sống và phát triển.
- source_word: τὴν αὔξησιν τοῦ θεοῦ
  choice: bằng sự tăng trưởng đến từ Đức Chúa Trời
  rationale: 'Hiểu sở hữu cách là chỉ nguồn: sự tăng trưởng do Đức Chúa Trời ban. Chú thích giữ lại cấu trúc sát chữ và sự mơ hồ của nguyên ngữ.'
theological_decisions:
- issue: Ý nghĩa của sở hữu cách trong τὴν αὔξησιν τοῦ θεοῦ
  choice: sự tăng trưởng đến từ Đức Chúa Trời
  alternative: sự tăng trưởng của Đức Chúa Trời
  rationale: Văn cảnh nói thân thể nhận nguồn sống và sự tăng trưởng từ Đầu; cách dịch chính tránh hàm ý rằng chính Đức Chúa Trời tăng trưởng, còn chú thích bảo tồn cách hiểu sát cấu trúc Hy Lạp.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Giữ ẩn dụ Đấng Christ là Đầu và Hội Thánh là thân thể; dùng “Đức Chúa Trời” theo văn phong Kinh Thánh phổ thông. Các phân từ bị động được diễn đạt gọn mà vẫn bảo toàn quan hệ ngữ pháp và tiến trình cung ứng, liên kết, tăng trưởng.
