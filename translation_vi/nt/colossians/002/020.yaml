id: COL.2.20
reference: Colossians 2:20
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Εἰ ἀπεθάνετε σὺν Χριστῷ ἀπὸ τῶν στοιχείων τοῦ κόσμου, τί ὡς ζῶντες ἐν κόσμῳ δογματίζεσθε·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/020.yaml
  text: 'If you died with the Messiah from the elemental principles of the world[a], why, as if living in the world[b], are you submitting yourselves to decrees:'
translation:
  language: vi
  text: 'Nếu anh chị em đã chết cùng với Đấng Christ, thoát khỏi các nguyên lý sơ đẳng của thế gian[a], thì tại sao, như thể đang sống trong thế gian, anh chị em lại chịu sự chi phối của các quy định[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “các linh lực sơ đẳng của thế gian”; hoặc: “các yếu tố cơ bản của thế gian.”'
    reason: alternative_reading
  - marker: b
    text: 'Cũng có thể dịch: “tuân theo các quy định” hoặc: “bị áp đặt các quy định.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰ
  choice: Nếu
  rationale: Giữ hình thức điều kiện của tiếng Hy Lạp, dù trong văn cảnh Phao-lô có lẽ xem điều kiện này là đúng đối với người tin.
- source_word: ἀπεθάνετε σὺν Χριστῷ
  choice: đã cùng Đấng Christ chết
  rationale: Diễn đạt biến cố đã xảy ra và sự hiệp nhất với Đấng Christ; dùng danh hiệu quen thuộc, trang trọng trong tiếng Việt.
- source_word: ἀπὸ τῶν στοιχείων τοῦ κόσμου
  choice: thoát khỏi các nguyên lý sơ đẳng của thế gian
  rationale: ἀπό chỉ sự phân cách; στοιχεῖα có thể nói đến các nguyên lý sơ đẳng, các yếu tố cơ bản hoặc các quyền lực linh giới. Cách dịch chính giữ phần nào độ rộng nghĩa, còn các khả năng khác được nêu trong chú thích.
- source_word: τί
  choice: thì tại sao
  rationale: Phù hợp với câu hỏi tu từ trong tiếng Việt.
- source_word: ὡς ζῶντες ἐν κόσμῳ
  choice: vẫn như đang sống theo thế gian
  rationale: Giữ sắc thái giả định/so sánh của ὡς; thêm “theo” để câu tiếng Việt tự nhiên và cho thấy lối sống thuộc trật tự thế gian, không đơn thuần là còn hiện hữu trong thế giới.
- source_word: δογματίζεσθε
  choice: để mình bị chi phối bởi các quy định
  rationale: 'Giữ được độ mở của hình thái trung gian/bị động: họ tham dự vào việc phục tùng nhưng đồng thời chịu sự áp đặt của các quy định.'
theological_decisions:
- issue: Ý nghĩa của στοιχεῖα trong cách dùng của Phao-lô
  choice: các nguyên lý sơ đẳng của thế gian
  alternative: các quyền lực sơ đẳng của thế gian; các yếu tố cơ bản của thế gian
  rationale: Thuật ngữ có thể bao hàm cả hệ thống sơ đẳng chi phối thế gian lẫn sắc thái quyền lực vũ trụ/linh giới. Bản dịch chính không xác quyết riêng một cách hiểu; chú thích bảo tồn các khả năng khác.
- issue: Sắc thái chủ động hay bị động của δογματίζεσθε
  choice: để mình bị chi phối bởi các quy định
  alternative: tuân theo các quy định; bị áp đặt các quy định
  rationale: Cách dịch chính phản ánh cả sự thuận phục của người nhận thư và tác động áp đặt từ các quy định, không giải quyết dứt khoát hình thái trung gian/bị động.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” cho ngôi thứ hai số nhiều và “Đấng Christ” như một danh hiệu quen thuộc. Dấu hai chấm cuối câu được giữ vì câu kế tiếp sẽ nêu nội dung các quy định.
