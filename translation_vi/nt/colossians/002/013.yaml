reference: Colossians 2:13
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ὑμᾶς νεκροὺς ὄντας ⸀ἐν τοῖς παραπτώμασιν καὶ τῇ ἀκροβυστίᾳ τῆς σαρκὸς ὑμῶν, συνεζωοποίησεν ὑμᾶς σὺν αὐτῷ· χαρισάμενος ἡμῖν πάντα τὰ παραπτώματα,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/013.yaml
  text: And you[a], being dead in your trespasses and the uncircumcision of your flesh, he made alive together with him, having forgiven us all our trespasses[c][b],
translation:
  language: vi
  text: 'Cô-lô-se 2:13


    Còn anh em, vốn đã chết trong những lỗi phạm[a] và tình trạng không cắt bì của thân thể anh em[b], thì Đức Chúa Trời đã làm cho anh em được sống cùng với Đấng Christ, và đã tha thứ cho chúng ta mọi lỗi phạm[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Lỗi phạm” cũng có thể dịch là “sự vi phạm” hoặc “sự quá phạm.” Giới từ Hy Lạp được dịch là “trong” có thể chỉ tình trạng hoặc phạm vi của các lỗi phạm, chứ không nhất thiết chỉ nguyên nhân.
    reason: lexical_alternative
  - marker: b
    text: Cụm “tình trạng không cắt bì của thân thể” trước hết nói đến tình trạng thân thể chưa được cắt bì, nhưng trong văn cảnh cũng mang ý nghĩa thuộc linh.
    reason: cultural_note
  - marker: c
    text: 'Tiếng Hy Lạp chuyển từ “anh em” sang “chúng ta”: Đức Chúa Trời làm cho “anh em” được sống cùng với Đấng Christ và tha thứ mọi lỗi phạm “cho chúng ta.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: νεκροὺς ὄντας
  choice: vốn đã chết
  rationale: Diễn đạt tự nhiên phân từ chỉ tình trạng đã có của người nhận thư, đồng thời giữ hình ảnh sự chết thuộc linh.
- source_word: ἐν τοῖς παραπτώμασιν
  choice: trong những sự vi phạm
  rationale: Giữ giới từ ἐν và ý niệm họ ở trong tình trạng hoặc phạm vi của các lỗi phạm, thay vì quyết định rằng cụm từ chỉ thuần túy nguyên nhân.
- source_word: ἀκροβυστίᾳ τῆς σαρκὸς ὑμῶν
  choice: tình trạng không cắt bì nơi thân thể mình
  rationale: ἀκροβυστία ở đây chỉ tình trạng không cắt bì; σάρξ trong cụm này trước hết mang nghĩa thân thể. Cách dịch tránh biến σάρξ thành “bản tính tội lỗi” nhưng vẫn để ngỏ ý nghĩa thuộc linh trong văn cảnh.
- source_word: συνεζωοποίησεν ὑμᾶς σὺν αὐτῷ
  choice: đã khiến anh em cùng sống lại với Đấng Christ
  rationale: Động từ ghép nhấn mạnh được ban sự sống cùng với một Đấng khác. Văn cảnh trực tiếp 2:12 xác định αὐτῷ là Đấng Christ; nêu danh xưng trong tiếng Việt tránh việc đại từ “Ngài” bị hiểu lầm là chủ thể Đức Chúa Trời.
- source_word: χαρισάμενος
  choice: đồng thời tha thứ
  rationale: Truyền đạt hành động tha thứ đi kèm với động từ chính mà không áp đặt quan hệ thời gian hay nguyên nhân quá chặt; động từ Hy Lạp hàm ý sự tha thứ được ban bởi ân huệ.
- source_word: ἡμῖν
  choice: của chúng ta
  rationale: Giữ nguyên sự chuyển đổi đáng chú ý từ ngôi thứ hai “anh em” sang ngôi thứ nhất số nhiều “chúng ta”, không đồng nhất hóa hai đại từ.
- source_word: πάντα τὰ παραπτώματα
  choice: mọi sự vi phạm
  rationale: Giữ sự lặp lại của παράπτωμα và nhấn mạnh tính toàn diện của sự tha thứ.
theological_decisions:
- issue: Ý nghĩa của σάρξ trong τῆς σαρκὸς ὑμῶν
  choice: thân thể, với khả năng mang âm hưởng thuộc linh trong văn cảnh
  alternative: bản tính tội lỗi
  rationale: Ngôn ngữ cắt bì trong 2:11–13 trước hết hướng đến tình trạng thân thể không cắt bì. Dịch là “bản tính tội lỗi” sẽ giải quyết theo một cách diễn giải mà bản văn không bắt buộc.
- issue: Chủ thể của συνεζωοποίησεν
  choice: Đức Chúa Trời
  alternative: không nêu rõ chủ thể bằng danh xưng
  rationale: Chủ thể được tiếp nối từ mệnh đề trước trong 2:12, nơi Đức Chúa Trời khiến Đấng Christ sống lại; việc nêu lại chủ thể giúp câu tiếng Việt rõ và tự nhiên.
- issue: Đối tượng được chỉ bởi αὐτῷ
  choice: Đấng Christ
  alternative: giữ đại từ “Ngài”
  rationale: Văn cảnh ngay trước nói về việc được chôn và cùng sống lại với Đấng Christ. Nêu rõ danh xưng trong tiếng Việt tránh sự mơ hồ do cả Đức Chúa Trời và Đấng Christ đều có thể được gọi là “Ngài”.
- issue: Sự chuyển đổi từ ὑμᾶς sang ἡμῖν
  choice: giữ “anh em” rồi chuyển sang “chúng ta”
  alternative: đồng nhất thành “anh em” hoặc “chúng ta” xuyên suốt
  rationale: Sự chuyển ngôi có thật trong tiếng Hy Lạp và có thể cho thấy Phao-lô mở rộng lời tuyên bố để bao gồm chính mình cùng các tín hữu khác; không nên âm thầm làm phẳng sự căng thẳng này.
- issue: Quan hệ của χαρισάμενος với động từ chính
  choice: đồng thời tha thứ
  alternative: sau khi đã tha thứ; bởi vì đã tha thứ
  rationale: Phân từ có thể diễn tả hành động đi kèm, phương cách hoặc quan hệ gần gũi với hành động chính. “Đồng thời” giữ liên hệ mà không áp đặt trình tự hay quan hệ nhân quả dứt khoát.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Dùng “anh em” theo lối xưng hô thư tín Tân Ước; “Đức Chúa Trời” và “Đấng Christ” làm rõ hai đối tượng trong câu. Cấu trúc “Còn anh em… thì…” phản ánh việc tân ngữ ὑμᾶς được đưa lên đầu câu để nhấn mạnh, đồng thời tạo câu tiếng Việt tự nhiên.
