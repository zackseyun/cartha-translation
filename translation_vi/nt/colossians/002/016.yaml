id: COL.2.16
reference: Colossians 2:16
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Μὴ οὖν τις ὑμᾶς κρινέτω ἐν βρώσει ⸀ἢ ἐν πόσει ἢ ἐν μέρει ἑορτῆς ἢ νουμηνίας ἢ σαββάτων,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/016.yaml
  text: Therefore[a], let no one judge you in food or in drink[c][b], or with regard to a festival or a new moon or Sabbaths.
translation:
  language: vi
  text: Vậy, đừng để ai xét đoán anh chị em[a] về đồ ăn hay thức uống[b], hoặc về lễ hội, ngày trăng mới hay các ngày Sa-bát[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đừng để ai phán xét anh chị em.”'
    reason: lexical_alternative
  - marker: b
    text: Tức là về những quy định hoặc thực hành liên quan đến đồ ăn và thức uống.
    reason: cultural_note
  - marker: c
    text: 'Chuỗi “lễ hội, ngày trăng mới, các ngày Sa-bát” gợi lại lịch lễ của người Do Thái: hằng năm, hằng tháng và hằng tuần.'
    reason: cross_reference
lexical_decisions:
- source_word: Μὴ οὖν τις
  choice: Vậy, đừng để ai
  rationale: οὖν nối câu này với lập luận trước bằng ý suy luận; cấu trúc phủ định với mệnh lệnh κρινέτω được diễn đạt tự nhiên trong tiếng Việt là “đừng để ai”.
- source_word: ὑμᾶς κρινέτω
  choice: xét đoán anh chị em
  rationale: κρίνω ở đây chỉ việc phán xét người khác dựa trên các thực hành được liệt kê. “Xét đoán” giữ được sắc thái đánh giá mang tính phán quyết, còn “anh chị em” diễn đạt đại từ số nhiều ὑμᾶς một cách tự nhiên và bao hàm.
- source_word: ἐν βρώσει ἢ ἐν πόσει
  choice: về đồ ăn hay thức uống
  rationale: βρῶσις và πόσις có thể chỉ hành vi ăn uống hoặc đồ ăn thức uống. Trong danh sách những phạm vi thực hành, nghĩa chỉ đối tượng/phạm vi phù hợp hơn; “về” chuyển tải tự nhiên chức năng của ἐν.
- source_word: ἐν μέρει ἑορτῆς
  choice: về lễ hội
  rationale: ἐν μέρει là thành ngữ mang nghĩa “liên quan đến, về phương diện”, không phải “một phần của”. ἑορτή ở đây là một kỳ lễ tôn giáo.
- source_word: νουμηνίας
  choice: ngày trăng mới
  rationale: Từ này chỉ ngày hoặc kỳ lễ đầu tháng theo trăng; “ngày trăng mới” vừa rõ nghĩa vừa giữ hình ảnh của nguyên ngữ.
- source_word: σαββάτων
  choice: các ngày Sa-bát
  rationale: Giữ dạng số nhiều của σαββάτων và làm rõ đây là các ngày Sa-bát trong chuỗi lịch thiêng liêng hằng năm, hằng tháng và hằng tuần.
theological_decisions:
- issue: Bản chất và hiệu lực của những thực hành được liệt kê
  choice: Câu dịch tập trung vào lệnh không để người khác xét đoán tín hữu về đồ ăn, thức uống và các ngày lễ.
  alternative: Diễn giải câu này như lời tuyệt đối bãi bỏ mọi thực hành ấy, hoặc như chỉ nói đến những luật lệ khổ hạnh do con người đặt ra.
  rationale: Bản văn Hy Lạp trực tiếp ngăn việc xét đoán “về” các vấn đề này nhưng riêng câu này không giải quyết đầy đủ địa vị thần học rộng hơn của từng thực hành. Vì vậy, bản dịch không thêm một kết luận giáo lý mạnh hơn câu chữ.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “anh chị em” cho đại từ số nhiều chỉ cộng đồng tín hữu; giữ “Sa-bát” là thuật ngữ quen thuộc. Trật tự danh sách và sự mơ hồ thần học của nguyên văn được bảo toàn.
