  text: ἅ ἐστιν πάντα εἰς φθορὰν τῇ ἀποχρήσει, κατὰ τὰ ἐντάλματα καὶ διδασκαλίας τῶν ἀνθρώπων;
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/022.yaml
  text: These all perish with use[c][b][a], according to the commandments and teachings of men.
translation:
  language: vi
  text: Tất cả những thứ ấy đều hư mất khi được sử dụng[a], theo các điều răn và lời dạy của loài người.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “tất cả những thứ ấy đều đi đến chỗ hư mất do việc sử dụng.” Tiếng Hy Lạp nhấn mạnh rằng chúng là những thứ bị dùng hết hoặc tiêu mất khi được sử dụng.'
    reason: lexical_alternative
  - marker: b
    text: Cụm “các điều răn và lời dạy của loài người” có lẽ gợi lại Ê-sai 29:13, nhấn mạnh nguồn gốc con người của các quy định này.
    reason: cross_reference
lexical_decisions:
- source_word: ἅ ἐστιν πάντα
  choice: Tất cả những thứ ấy đều
  rationale: Đại từ quan hệ trung tính số nhiều chỉ lại những thứ bị cấm ở câu trước; cách diễn đạt này tự nhiên trong tiếng Việt và giữ rõ đối tượng được nói đến.
- source_word: εἰς φθορὰν τῇ ἀποχρήσει
  choice: tiêu tan khi được dùng đến
  rationale: φθορά chỉ sự hư mất, tiêu hủy hay mục nát, còn ἀπόχρησις nói đến việc dùng hết hoặc tiêu dùng. Cách dịch này diễn đạt rằng các thứ ấy mất đi ngay trong quá trình sử dụng mà không thu hẹp nghĩa vào thức ăn.
- source_word: κατὰ
  choice: theo
  rationale: Giữ nghĩa chuẩn mực hoặc căn cứ mà các quy định này dựa vào.
- source_word: ἐντάλματα καὶ διδασκαλίας
  choice: các điều răn và lời dạy
  rationale: Giữ sắc thái quy định của ἐντάλματα và nghĩa phổ thông của διδασκαλίας, đồng thời phản ánh cách diễn đạt có khả năng gợi lại Ê-sai 29:13.
- source_word: τῶν ἀνθρώπων
  choice: của loài người
  rationale: ἀνθρώπων ở đây nhấn mạnh nguồn gốc con người, đối lập ngầm với nguồn gốc từ Đức Chúa Trời; “loài người” bao quát tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Quan hệ giữa mệnh đề giải thích và các luật lệ khổ hạnh
  choice: Mệnh đề nói rằng những thứ bị các lệnh cấm điều chỉnh đều tiêu tan khi sử dụng, rồi xác định các quy định ấy dựa trên điều răn và lời dạy của con người.
  alternative: Có thể hiểu trọng tâm mạnh hơn là bác bỏ chính các quy định vì chúng chỉ liên quan đến những thứ chóng tiêu tan.
  rationale: Ngữ pháp Hy Lạp tự nhiên nhất quy ἅ...πάντα về các đối tượng của lệnh cấm, nhưng câu vẫn hàm ý phê phán các quy định. Bản dịch không quyết định quá mức trọng tâm giữa đối tượng chóng hư mất và nguồn gốc con người của luật lệ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Tiêu tan khi được dùng đến” giữ ý về sự tiêu mất trong quá trình sử dụng; “loài người” truyền đạt nguồn gốc nhân loại mà không tạo hàm ý chỉ nam giới.
