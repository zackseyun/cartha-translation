id: COL.2.8
reference: Colossians 2:8
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Βλέπετε μή τις ὑμᾶς ἔσται ὁ συλαγωγῶν διὰ τῆς φιλοσοφίας καὶ κενῆς ἀπάτης κατὰ τὴν παράδοσιν τῶν ἀνθρώπων, κατὰ τὰ στοιχεῖα τοῦ κόσμου καὶ οὐ κατὰ Χριστόν·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/008.yaml
  text: See to it that no one takes you captive through philosophy and empty deceit[a], according to human tradition, according to the elemental principles of the world[b], and not according to Messiah.
translation:
  language: vi
  text: Hãy coi chừng kẻo có ai dùng triết lý và sự lừa dối rỗng tuếch mà bắt anh chị em làm tù binh, theo truyền thống của loài người, theo các yếu tố cơ bản của thế gian[a], chứ không theo Đấng Mê-si-a.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “các thần linh sơ đẳng của thế gian.” Cụm từ Hy Lạp có thể chỉ những yếu tố hoặc nguyên lý căn bản, hay các quyền lực thuộc linh trong vũ trụ.'
    reason: alternative_reading
  - marker: b
    text: 'Hy Lạp: “Christ”; đây là tước hiệu có nghĩa là “Đấng Mê-si-a” hay “Đấng Được Xức Dầu.”'
    reason: lexical_clarification
lexical_decisions:
- source_word: Βλέπετε μή τις
  choice: Hãy coi chừng, kẻo có ai
  rationale: Mệnh lệnh hiện tại mang sắc thái cảnh báo; cách diễn đạt này tự nhiên trong tiếng Việt và giữ được nguy cơ có thể xảy ra.
- source_word: ἔσται ὁ συλαγωγῶν
  choice: bắt anh chị em làm tù binh
  rationale: Động từ gợi hình ảnh bắt mang đi như chiến lợi phẩm; “bắt ... làm tù binh” truyền đạt rõ ẩn dụ ấy.
- source_word: διὰ τῆς φιλοσοφίας καὶ κενῆς ἀπάτης
  choice: dùng triết lý và sự lừa dối rỗng tuếch
  rationale: “Dùng” thể hiện phương tiện của διά; giữ hai danh từ liên kết mà không quyết định rằng “triết lý” đồng nhất với “sự lừa dối rỗng tuếch”.
- source_word: κατὰ τὴν παράδοσιν τῶν ἀνθρώπων
  choice: theo truyền thống của loài người
  rationale: Giữ ý về chuẩn mực hay nền tảng chi phối, đồng thời dùng cách nói bao quát, không giới hạn giới tính.
- source_word: κατὰ τὰ στοιχεῖα τοῦ κόσμου
  choice: theo các yếu tố cơ bản của thế gian
  rationale: στοιχεῖα có thể chỉ những thành tố hay nguyên lý sơ đẳng, nhưng cũng có thể chỉ các quyền lực linh giới; bản chính chọn cách dịch tương đối rộng và ghi cách hiểu kia ở chú thích.
- source_word: οὐ κατὰ Χριστόν
  choice: chứ không theo Đấng Christ
  rationale: “Chứ không” làm rõ sự tương phản; “Đấng Christ” giữ cách gọi quen thuộc trong tiếng Việt đồng thời bảo toàn sắc thái tước hiệu.
theological_decisions:
- issue: Ý nghĩa của στοιχεῖα τοῦ κόσμου
  choice: các yếu tố cơ bản của thế gian
  alternative: các thần linh sơ đẳng của thế gian
  rationale: Cụm từ có thể nói đến những yếu tố hay nguyên lý căn bản, hoặc các quyền lực linh giới. Bản chính không nên âm thầm quyết định hoàn toàn cho một cách hiểu; chú thích bảo lưu cách hiểu nhân cách hóa.
- issue: Sắc thái của Χριστός
  choice: Đấng Christ
  alternative: Đấng Mê-si-a
  rationale: Danh xưng Hy Lạp có nghĩa là Đấng Được Xức Dầu. “Đấng Christ” là cách gọi trang trọng, quen thuộc và sát hình thức Hy Lạp; chú thích nêu rõ nghĩa tước hiệu.
translation_notes:
  register: Văn phong cảnh báo, trang trọng nhưng dễ hiểu. Dùng “anh chị em” để diễn đạt đại từ số nhiều ὑμᾶς một cách tự nhiên và bao quát trong tiếng Việt hiện đại.
