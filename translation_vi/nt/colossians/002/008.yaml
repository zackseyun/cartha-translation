  source_fidelity: 'Bản dịch phản ánh đúng mệnh lệnh cảnh báo, nguy cơ bị bắt làm tù binh, phương tiện là triết lý và sự lừa dối rỗng tuếch, cùng các tiêu chuẩn đối lập: truyền thống loài người, στοιχεῖα của thế gian, và Đấng Christ. Tuy nhiên, Χριστόν ở đây là tước hiệu và vệt kiểm tra tiếng Anh đã nhất quán chọn “Messiah”; bản tiếng Việt nên dùng “Đấng Mê-si-a” thay vì phiên âm hình thức “Đấng Christ.”'
