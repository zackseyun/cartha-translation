  terminology: “Triết lý,” “truyền thống của loài người,” và “các yếu tố cơ bản của thế gian” đều chấp nhận được. Chú thích về στοιχεῖα giữ lại cách hiểu quan trọng về các quyền lực thuộc linh mà không áp đặt cách hiểu đó vào bản văn chính. “Đấng Mê-si-a” phù hợp hơn với quyết định dịch tước hiệu Χριστός trong hồ sơ tiếng Anh; chú thích cần nêu dạng Hy Lạp “Christ” và nghĩa tước hiệu.
