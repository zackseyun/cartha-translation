id: 1CO.9.1
reference: 1 Corinthians 9:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Οὐκ εἰμὶ ⸂ἐλεύθερος; οὐκ εἰμὶ ἀπόστολος⸃; οὐχὶ ⸀Ἰησοῦν τὸν κύριον ἡμῶν ἑόρακα; οὐ τὸ ἔργον μου ὑμεῖς ἐστε ἐν κυρίῳ;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/001.yaml
  text: Am I not free? Am I not an apostle? Have I not seen Jesus our Lord? Are you not my work in the Lord?[a]
translation:
  language: vi
  text: Tôi chẳng tự do sao? Tôi chẳng phải là sứ đồ sao? Tôi chẳng từng thấy Chúa Giê-su của chúng ta sao?[a] Anh chị em chẳng phải là công trình của tôi trong Chúa sao?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch theo sát trật tự từ Hy Lạp: “Giê-su, Chúa chúng ta.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλεύθερος
  choice: người tự do
  rationale: Diễn đạt trực tiếp địa vị tự do và quyền tự do mà Phao-lô đang khẳng định, đồng thời nối với mạch bàn luận trước đó.
- source_word: ἀπόστολος
  choice: sứ đồ
  rationale: Giữ nghĩa chức vụ chuyên biệt của Phao-lô trong ngữ cảnh Tân Ước, thay vì nghĩa khái quát là người được sai đi.
- source_word: Ἰησοῦν τὸν κύριον ἡμῶν
  choice: Chúa Giê-su của chúng ta
  rationale: Cách nói tự nhiên trong tiếng Việt, giữ cả danh Giê-su, tước hiệu Chúa và đại từ sở hữu số nhiều.
- source_word: ἑόρακα
  choice: chẳng từng thấy
  rationale: Thể hoàn thành chỉ một việc đã xảy ra nhưng vẫn có ý nghĩa hiện tại đối với tư cách sứ đồ của Phao-lô; “từng thấy” chuyển tải điều này tự nhiên mà không thêm chữ “phục sinh” vốn không có trong câu Hy Lạp.
- source_word: ἔργον
  choice: công việc
  rationale: Giữ hình ảnh người Cô-rinh-tô là thành quả của công lao phục vụ của Phao-lô, không thu hẹp nghĩa thành riêng “kết quả”.
- source_word: ἐν κυρίῳ
  choice: trong Chúa
  rationale: Giữ nguyên cụm từ đặc trưng của Phao-lô, chỉ phạm vi và mối liên hệ trong đó người Cô-rinh-tô là công việc của ông.
- source_word: οὐκ / οὐχὶ / οὐ
  choice: chẳng phải ... sao? / chẳng từng ... sao?
  rationale: Các từ phủ định mở đầu những câu hỏi tu từ vốn chờ câu trả lời khẳng định; cấu trúc “chẳng ... sao?” vừa rõ vừa tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Ý nghĩa lời Phao-lô khẳng định mình đã thấy Chúa Giê-su
  choice: Giữ lời khẳng định đơn giản rằng ông đã thấy Chúa Giê-su, trong ngữ cảnh dùng điều ấy để chứng minh tư cách sứ đồ.
  alternative: Nói rõ rằng ông đã thấy Chúa Giê-su phục sinh.
  rationale: Ngữ cảnh hướng đến lần Phao-lô thấy Chúa phục sinh và giá trị chứng nhận tư cách sứ đồ, nhưng bản Hy Lạp không nói rõ “phục sinh”; vì vậy bản dịch không bổ sung để tránh giải quyết thay cho nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Chuỗi bốn câu hỏi tu từ được giữ để bảo toàn nhịp điệu và sức biện luận. Dùng “anh chị em” cho đại từ số nhiều ὑμεῖς nhằm diễn đạt tự nhiên và bao gồm toàn thể cộng đồng tín hữu.
