revisions:
- from: Tôi chẳng phải là người tự do sao? Tôi chẳng phải là sứ đồ sao? Tôi chẳng từng thấy Chúa Giê-su của chúng ta sao?[a] Anh chị em chẳng phải là công việc của tôi trong Chúa sao?
  to: Tôi chẳng tự do sao? Tôi chẳng phải là sứ đồ sao? Tôi chẳng từng thấy Chúa Giê-su của chúng ta sao?[a] Anh chị em chẳng phải là công trình của tôi trong Chúa sao?
  rationale: Chỉnh hai từ ngữ để phản ánh chính xác hơn sắc thái của ἐλεύθερος và ἔργον trong tiếng Việt hiện đại. Các câu hỏi tu từ, thể hoàn thành được diễn đạt bằng “chẳng từng thấy,” trật tự và danh xưng của nguyên văn đều được bảo toàn; chú thích vẫn nêu phương án sát trật tự từ Hy Lạp.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T18:11:37Z'
review_pass:
  verdict: revise
  source_fidelity: Bản nháp giữ đúng bốn câu hỏi tu từ phủ định, danh xưng “sứ đồ,” lời chứng đã thấy Chúa Giê-su, và cụm “trong Chúa.” Tuy nhiên, “người tự do” thiên về một thân phận/xã hội hơn là sự tự do hay quyền tự do mà ἐλεύθερος nêu trong mạch văn. “Công việc của tôi” cũng có thể khiến độc giả hiểu cộng đồng Cô-rinh-tô là một nhiệm vụ, thay vì sản phẩm của lao tác sứ đồ.
  naturalness: “Tôi chẳng tự do sao?” là lối nói hiện đại, gọn và phù hợp hơn “Tôi chẳng phải là người tự do sao?”. “Công trình của tôi” diễn đạt tự nhiên việc các tín hữu là kết quả lao tác của Phao-lô, đồng thời vẫn giữ hình ảnh ἔργον.
  terminology: Giữ “sứ đồ,” “Chúa Giê-su,” và “trong Chúa,” là các cách dùng quen thuộc, trang trọng và dễ hiểu trong tiếng Việt Cơ Đốc hiện đại. Không thêm ý “phục sinh” vào lời Phao-lô đã thấy Chúa.
  issues:
  - severity: medium
    issue: “người tự do” cho ἐλεύθερος
    rationale: Cách dịch này dễ gợi địa vị một người tự do đối lập với nô lệ. Trong ngữ cảnh trực tiếp về quyền tự do, “tự do” giữ được khẳng định của Phao-lô mà không thu hẹp nghĩa.
  - severity: low
    issue: “công việc của tôi” cho ἔργον
    rationale: Tiếng Việt thường hiểu “công việc” là nhiệm vụ phải làm. “Công trình của tôi” tự nhiên hơn khi chỉ cộng đồng là thành quả lao tác của Phao-lô.
  revised_text: Tôi chẳng tự do sao? Tôi chẳng phải là sứ đồ sao? Tôi chẳng từng thấy Chúa Giê-su của chúng ta sao?[a] Anh chị em chẳng phải là công trình của tôi trong Chúa sao?
