  to: Anh em không biết rằng những người lo việc thánh thì ăn từ đền thờ[a], và những người phục vụ bên bàn thờ thì được chia phần từ bàn thờ[b] sao?
  rationale: Chỉ điều chỉnh cách diễn đạt tiếng Việt ở vế đầu và chú thích a. Bản sửa tiếp tục giữ “ăn,” không thay bằng ngôn ngữ về lương bổng; đồng thời giữ vế sau ở mức diễn đạt tự nhiên, với chú thích bảo lưu cách nói sát chữ và hàm ý phần sinh tế.
