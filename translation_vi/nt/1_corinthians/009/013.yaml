id: 1CO.9.13
reference: 1 Corinthians 9:13
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οὐκ οἴδατε ὅτι οἱ τὰ ἱερὰ ἐργαζόμενοι ⸀τὰ ἐκ τοῦ ἱεροῦ ἐσθίουσιν, οἱ τῷ θυσιαστηρίῳ ⸀παρεδρεύοντες τῷ θυσιαστηρίῳ συμμερίζονται;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/013.yaml
  text: Do you not know that those who work in the temple eat from the temple[b][a], and those who serve at the altar share in what is offered on the altar?
translation:
  language: vi
  text: Anh em không biết rằng những người lo việc thánh thì ăn từ đền thờ[a], và những người phục vụ bên bàn thờ thì được chia phần từ bàn thờ[b] sao?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát hơn: “những người làm việc với các việc/vật thánh thì ăn những gì từ đền thờ.”'
    reason: lexical_alternative
  - marker: b
    text: 'Dịch sát: “chia phần với bàn thờ,” nghĩa là họ nhận một phần từ các sinh tế được dâng tại đó.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὐκ οἴδατε
  choice: Anh em không biết ... sao?
  rationale: Giữ nguyên dạng câu hỏi tu từ quen thuộc của Phao-lô; thêm “anh em” theo chủ thể số nhiều hàm ẩn trong động từ Hy Lạp để câu tiếng Việt tự nhiên và rõ người được nói đến.
- source_word: οἱ τὰ ἱερὰ ἐργαζόμενοι
  choice: những người lo việc thánh
  rationale: τὰ ἱερά theo nghĩa sát là “những điều/vật thánh”; trong ngữ cảnh chỉ công việc phụng sự tại đền thờ. “Lo việc thánh” vừa tự nhiên vừa không thu hẹp hoàn toàn thành địa điểm.
- source_word: τὰ ἐκ τοῦ ἱεροῦ ἐσθίουσιν
  choice: ăn những thứ từ đền thờ
  rationale: Giữ động từ cụ thể “ăn” và nguồn cung ứng “từ đền thờ”, đồng thời phản ánh tân ngữ số nhiều τὰ mà không giải thích quá mức là tiền công hay lương thực.
- source_word: ἱεροῦ
  choice: đền thờ
  rationale: ἱερόν thường chỉ toàn thể khu đền thờ hay khu vực thánh, không riêng nơi chí thánh; “đền thờ” là cách gọi chuẩn, dễ hiểu.
- source_word: παρεδρεύοντες
  choice: phục vụ bên
  rationale: Từ này diễn tả việc ở bên cạnh để chuyên trách hay phục vụ. “Phục vụ bên” giữ được cả sắc thái vị trí lẫn chức năng tế tự.
- source_word: θυσιαστηρίῳ
  choice: bàn thờ
  rationale: Cách dịch tiếng Việt thông dụng và chính xác cho bàn thờ dâng sinh tế.
- source_word: συμμερίζονται
  choice: được chia phần từ
  rationale: Diễn đạt tự nhiên việc nhận một phần liên quan đến bàn thờ, nhưng không đưa cụm “lễ vật dâng” vào chính văn vì nguyên ngữ nói gọn là “chia phần với bàn thờ”.
theological_decisions:
- issue: Hình ảnh tế tự và nguồn nuôi sống người phụng sự
  choice: 'Giữ phép song đối: người lo việc thánh ăn từ đền thờ, người phục vụ bên bàn thờ được chia phần từ bàn thờ.'
  alternative: Có thể dịch diễn giải vế sau là “được chia phần trong những lễ vật dâng trên bàn thờ.”
  rationale: Cách chọn bảo tồn lập luận của Phao-lô về việc người làm công tác thánh nhận phần nuôi sống từ chính công tác ấy, nhưng không áp đặt cơ cấu giáo hội về sau hay thêm đối tượng “lễ vật” vốn chỉ được hàm ý.
- issue: Quan hệ ngữ nghĩa của συμμερίζονται với τῷ θυσιαστηρίῳ
  choice: được chia phần từ bàn thờ
  alternative: chia phần với bàn thờ
  rationale: “Chia phần với bàn thờ” sát cấu trúc Hy Lạp hơn nhưng khó hiểu trong tiếng Việt. “Từ bàn thờ” truyền đạt nguồn của phần được nhận; chú thích lưu lại cách nói sát chữ và hàm ý tế lễ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” cho chủ thể số nhiều hàm ẩn, phù hợp cách Phao-lô trực tiếp nói với cộng đoàn. Hai dấu chú thích [a], [b] được đặt ngay sau các cụm tương ứng trong chính văn.
