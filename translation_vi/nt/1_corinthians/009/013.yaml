  - severity: low
    issue: Chú thích a có cách diễn đạt “những điều hoặc vật thánh” không tự nhiên.
    rationale: Nên dùng “các việc/vật thánh” để bảo lưu phạm vi từ vựng của τὰ ἱερά và đọc thuận tiếng Việt.
