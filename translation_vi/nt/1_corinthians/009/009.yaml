revisions:
- from: 'Vì trong luật pháp Môi-se có chép: “Đừng khớp mõm con bò đang đạp lúa.” Đức Chúa Trời quan tâm đến bò sao?'
  to: 'Vì trong luật pháp Môi-se có chép: “Đừng bịt mõm con bò đang đạp lúa.”[a] Đức Chúa Trời quan tâm đến bò sao?'
  rationale: Chỉ sửa cách dịch động từ κημόω từ “khớp mõm” thành “bịt mõm”, vì đây là cách dùng tiếng Việt chuẩn, minh bạch và sát nghĩa. Câu hỏi tu từ được giữ nguyên, không thêm “chỉ” hay lời giải thích làm thu hẹp hoặc giải quyết trước ý nghĩa lập luận của Phao-lô. Chú thích ghi một cách diễn đạt thay thế tự nhiên cho hoạt động tuốt lúa.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T18:11:37Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch truyền đạt đúng cấu trúc và ý chính của nguyên văn: lời trích dẫn được giới thiệu là chép trong luật của Môi-se, mệnh lệnh cấm được giữ, phân từ hiện tại diễn tả hành động đạp lúa đang diễn ra, và câu hỏi với μή vẫn là câu hỏi tu từ. Tuy nhiên, “khớp mõm” không phải cách diễn đạt chuẩn hay rõ nghĩa cho κημόω (“bịt/rọ mõm”).'
  naturalness: “Luật pháp Môi-se”, “có chép”, và “đang đạp lúa” phù hợp văn phong Kinh Thánh hiện đại. Thay “khớp mõm” bằng “bịt mõm” giúp câu tự nhiên, rõ ràng và chính xác hơn.
  terminology: Giữ “Đức Chúa Trời” nhất quán với bản thảo và “Môi-se” theo chính tả đang dùng. “Bịt mõm” là từ ngữ chính xác cho hành động ngăn con vật ăn khi đang đạp lúa. Thêm chú thích cho cách diễn đạt thay thế về hoạt động đạp/giẫm lúa, tương ứng với dấu vết kiểm định tiếng Anh.
  issues:
  - severity: medium
    issue: “Khớp mõm” dịch κημόω
    rationale: “Khớp mõm” không phải lối nói Việt ngữ thông dụng với nghĩa bịt hoặc rọ mõm con vật. κημόω chỉ việc bịt/rọ mõm để ngăn ăn; “bịt mõm” diễn đạt trực tiếp và tự nhiên hơn.
  revised_text: 'Vì trong luật pháp Môi-se có chép: “Đừng bịt mõm con bò đang đạp lúa.”[a] Đức Chúa Trời quan tâm đến bò sao?'
