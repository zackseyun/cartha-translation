source:
  edition: SBLGNT
  text: ἐν γὰρ τῷ Μωϋσέως νόμῳ γέγραπται· Οὐ ⸀κημώσεις βοῦν ἀλοῶντα. μὴ τῶν βοῶν μέλει τῷ θεῷ,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/009.yaml
  text: For it is written in the law of Moses[a], “You shall not muzzle an ox while it is threshing.” Is God concerned about oxen?
translation:
  language: vi
  text: 'Vì trong luật pháp Môi-se có chép: “Đừng bịt mõm con bò đang đạp lúa.”[a] Đức Chúa Trời quan tâm đến bò sao?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hoặc “khi nó đang giẫm lúa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν γὰρ τῷ Μωϋσέως νόμῳ
  choice: Vì trong luật pháp Môi-se
  rationale: Giữ quan hệ sở hữu của cụm Hy Lạp và dùng lối nói Kinh Thánh tự nhiên, trang trọng trong tiếng Việt.
- source_word: γέγραπται
  choice: có chép
  rationale: Công thức quen thuộc để dẫn lời Kinh Thánh, truyền đạt giá trị hoàn thành của thể hoàn thành bị động mà vẫn tự nhiên trong tiếng Việt.
- source_word: Οὐ κημώσεις
  choice: Đừng khớp mõm
  rationale: Chuyển thì tương lai mang chức năng cấm đoán thành mệnh lệnh phủ định tự nhiên trong tiếng Việt; “khớp mõm” chỉ việc ngăn con vật ăn bằng dụng cụ bịt mõm.
- source_word: βοῦν
  choice: con bò
  rationale: Danh từ chỉ gia súc họ bò dùng làm vật kéo; “con bò” rõ ràng và tự nhiên hơn “bò đực thiến” khi nguyên văn không xác định chi tiết ấy.
- source_word: ἀλοῶντα
  choice: đang đạp lúa
  rationale: Phân từ hiện tại diễn tả hoạt động đang tiếp diễn. Trong bối cảnh cổ đại, bò giẫm đạp trên lúa để tách hạt; cách dịch này cụ thể, dễ hiểu và phù hợp nghĩa của động từ.
- source_word: μὴ τῶν βοῶν μέλει τῷ θεῷ
  choice: Đức Chúa Trời quan tâm đến bò sao?
  rationale: Giữ nguyên hình thức câu hỏi tu từ do μή dẫn nhập và không thêm “chỉ”, nhờ đó không giải quyết thay cho độc giả sự căng thẳng về phạm vi điều Phao-lô muốn nói.
theological_decisions:
- issue: Câu hỏi tu từ của Phao-lô về sự quan tâm của Đức Chúa Trời đối với loài bò
  choice: 'Dịch thẳng thành câu hỏi tu từ: “Đức Chúa Trời quan tâm đến bò sao?”'
  alternative: “Có phải Đức Chúa Trời chỉ quan tâm đến bò không?” hoặc “Chẳng lẽ Đức Chúa Trời quan tâm đến bò sao?”
  rationale: Nguyên văn có μή, hướng người nghe tới câu trả lời phủ định, nhưng không có từ tương đương với “chỉ”. Bản dịch giữ lực tu từ mà không thêm điều kiện để phủ nhận tuyệt đối hay biến thành sự quan tâm mang tính so sánh.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “luật pháp Môi-se” theo lối nói Kinh Thánh thông dụng; “đạp lúa” phản ánh phương thức tuốt lúa bằng chân gia súc. Không đặt chú thích vì phương án “đạp lúa” đã được chọn ngay trong chính văn và câu không cần giải thích thêm để hiểu.
