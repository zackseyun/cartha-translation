  text: This is my defense to those who examine me[a].
translation:
  language: vi
  text: Đây là lời biện hộ của tôi đối với những người xét hỏi tôi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Đây là lời biện hộ của tôi với những người đánh giá tôi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπολογία
  choice: lời biện hộ
  rationale: Diễn tả lời đáp nhằm tự bảo vệ trước sự chất vấn về tư cách và quyền sứ đồ; tránh nghĩa hiện đại của “xin lỗi”.
- source_word: ἀνακρίνουσίν
  choice: xét hỏi
  rationale: Bao quát cả việc chất vấn và xem xét có tính đánh giá, đồng thời chưa hàm ý một phán quyết chung cuộc như “xét xử”.
- source_word: Ἡ ἐμὴ
  choice: của tôi
  rationale: Thể hiện tự nhiên và đầy đủ ý sở hữu trong tiếng Việt, không cần thêm sắc thái nhấn mạnh “của chính tôi”.
- source_word: τοῖς ἐμὲ ἀνακρίνουσίν
  choice: trước những người xét hỏi tôi
  rationale: “Trước” phù hợp tự nhiên với ngữ cảnh biện hộ và giữ được khả năng hiểu đây là lời trình bày trước những người đang thẩm xét Phao-lô.
- source_word: ἐστιν αὕτη
  choice: Đây là
  rationale: Trật tự tự nhiên trong tiếng Việt để nhận diện điều được nói đến như lời biện hộ của Phao-lô.
