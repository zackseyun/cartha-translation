id: 1CO.9.8
reference: 1 Corinthians 9:8
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Μὴ κατὰ ἄνθρωπον ταῦτα λαλῶ ἢ ⸂καὶ ὁ νόμος ταῦτα οὐ⸃ λέγει;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/008.yaml
  text: Am I saying these things from a merely human perspective[a], or does not the Law also say these things?
translation:
  language: vi
  text: Chẳng lẽ tôi nói những điều này chỉ theo quan điểm của con người[a] sao? Hay Luật pháp cũng chẳng nói những điều này sao?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “theo con người” hoặc “theo cách nhìn của con người.”'
    reason: Nêu các cách dịch sát hơn của thành ngữ κατὰ ἄνθρωπον, vốn có thể chỉ quan điểm, tiêu chuẩn hoặc cơ sở thuần túy của con người.
lexical_decisions:
- source_word: Μὴ
  choice: Chẳng lẽ ... sao?
  rationale: Tiểu từ phủ định mở đầu câu hỏi tu từ và hướng người nghe đến câu trả lời phủ định; “chẳng lẽ” diễn đạt tự nhiên sắc thái ấy trong tiếng Việt.
- source_word: κατὰ ἄνθρωπον
  choice: chỉ theo cách nhìn của con người
  rationale: Thành ngữ chỉ cơ sở hoặc quan điểm thuần túy thuộc về con người, tương phản với lời chứng của Luật pháp; cách dịch này tránh hiểu đơn giản là “với tư cách một con người”.
- source_word: ταῦτα
  choice: những điều này
  rationale: Giữ số nhiều của đại từ chỉ định và liên kết với lập luận ngay trước đó của Phao-lô.
- source_word: λαλῶ
  choice: tôi nói
  rationale: Thì hiện tại nói đến điều Phao-lô đang trình bày trong lập luận; “tôi nói” tự nhiên và trực tiếp trong tiếng Việt.
- source_word: ἢ
  choice: Hay
  rationale: Giữ quan hệ lựa chọn, chuyển sang lời chứng bổ sung của Luật pháp.
- source_word: καὶ
  choice: cũng
  rationale: 'Diễn đạt ý bổ sung: Luật pháp cũng làm chứng cho cùng một điều.'
- source_word: ὁ νόμος
  choice: Luật pháp
  rationale: Ngữ cảnh kế tiếp trích Phục truyền luật lệ ký 25:4, nên đây là Luật pháp trong Kinh Thánh chứ không phải luật lệ nói chung.
- source_word: οὐ λέγει
  choice: chẳng nói như vậy sao
  rationale: Giữ nguyên hình thức câu hỏi phủ định có sức khẳng định, thay vì chuyển thành một câu trần thuật dứt khoát.
theological_decisions:
- issue: Đối tượng được gọi là “ὁ νόμος” trong lập luận của Phao-lô
  choice: “Luật pháp” chỉ Luật pháp Môi-se, tức phần luật trong Kinh Thánh
  alternative: luật theo nghĩa một nguyên tắc chung
  rationale: Câu kế tiếp dẫn trực tiếp Phục truyền luật lệ ký 25:4. “Luật pháp” bảo tồn quy chiếu Kinh Thánh mà không thêm một kết luận giáo lý ngoài văn bản.
- issue: Quan hệ giữa lý luận của con người và lời chứng của Luật pháp
  choice: Giữ hai câu hỏi tu từ nối bằng “hay”, không biến chúng thành sự đối lập tuyệt đối
  alternative: Diễn giải rằng lập luận của con người hoàn toàn vô giá trị và chỉ Luật pháp mới có thẩm quyền
  rationale: Cấu trúc Hy Lạp cho thấy Luật pháp cũng nói điều ấy, tức là bổ sung lời chứng; bản văn không nhất thiết phủ nhận mọi giá trị của nhận định thông thường.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cặp câu hỏi “Chẳng lẽ ... sao? Hay ... chẳng ... sao?” bảo tồn lực tu từ của nguyên văn; “chỉ ... thôi” làm rõ sắc thái thuần túy thuộc quan điểm con người mà không giải nghĩa quá mức.
