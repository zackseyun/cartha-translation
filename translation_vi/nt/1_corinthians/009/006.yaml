- from: Hay chỉ có tôi và Ba-na-ba là không có quyền không làm việc sao?[a]
  to: Hay chỉ có tôi và Ba-na-ba là không có quyền được miễn làm việc sao?[a]
  rationale: Thay thế phủ định kép bằng thành ngữ tự nhiên «quyền được miễn làm việc». Bản sửa bảo toàn ý nghĩa của nguyên văn—quyền được không lao động—mà không khẳng định một cơ chế hỗ trợ cụ thể trong bản văn chính. Chú thích được thu gọn để phân biệt rõ điều câu nói trực tiếp với hàm ý từ văn cảnh gần.
