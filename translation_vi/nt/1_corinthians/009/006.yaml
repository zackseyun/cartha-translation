translation:
  language: vi
  text: Hay chỉ có tôi và Ba-na-ba là không có quyền được miễn làm việc sao?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “quyền không phải làm việc” hoặc “quyền không lao động”. Trong văn cảnh, đây là quyền không phải tự lao động để nuôi sống mình, nhưng được chu cấp khi thi hành chức vụ.'
    reason: Nêu các cách diễn đạt khác cho ἐξουσίαν μὴ ἐργάζεσθαι và giải thích hàm ý văn cảnh mà không đưa thêm ý vào bản văn chính.
lexical_decisions:
- source_word: ἢ
  choice: Hay
  rationale: Mở đầu một khả năng khác trong chuỗi câu hỏi tu từ của Phao-lô; “Hay” giữ tự nhiên mạch lập luận tiếng Việt.
- source_word: μόνος
  choice: chỉ có
  rationale: Nhấn mạnh tính loại trừ đối với chủ ngữ phối hợp “tôi và Ba-na-ba”.
- source_word: ἐγὼ καὶ Βαρναβᾶς
  choice: tôi và Ba-na-ba
  rationale: Giữ thứ tự của nguyên văn Hy Lạp và dùng cách phiên âm tên riêng quen thuộc trong tiếng Việt.
- source_word: οὐκ ἔχομεν
  choice: không có
  rationale: Diễn đạt trực tiếp thể phủ định hiện tại trong câu hỏi tu từ.
- source_word: ἐξουσίαν
  choice: quyền
  rationale: Trong văn cảnh, từ này chỉ quyền chính đáng của sứ đồ được nhận sự chu cấp, chứ không chủ yếu nói đến quyền cai trị.
- source_word: μὴ ἐργάζεσθαι
  choice: không làm việc
  rationale: Giữ sát nội dung của động từ nguyên mẫu phủ định và không đưa phần giải thích về lao động tự nuôi sống vào chính câu.
theological_decisions:
- issue: Ý nghĩa của ἐξουσία trong văn cảnh
  choice: Quyền không phải làm việc để tự nuôi sống, nhưng được cộng đồng chu cấp khi thi hành chức vụ
  alternative: Quyền hay sự tự do nói chung, không nhất thiết liên quan đến sự chu cấp vật chất
  rationale: Văn cảnh gần của 1 Cô-rinh-tô 9 bàn về quyền của các sứ đồ được nhận thức ăn và sự chu cấp. Bản dịch chính giữ cách nói gọn và phần chú thích nêu rõ hàm ý văn cảnh mà không thêm ý vào câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu hỏi tu từ được giữ nguyên; cụm “quyền không làm việc” cố ý bảo toàn cấu trúc và độ mở của nguyên văn, còn chú thích ngăn cách hiểu lầm rằng Phao-lô đề cao sự lười biếng.
