  rationale: Bản sửa thay phủ định kép bằng cách diễn đạt hiện đại, trực tiếp hơn, giữ tính mơ hồ từ vựng của ἀδήλως qua chú thích, và dùng thuật ngữ thể thao phổ thông “đấm bốc.” Cấu trúc lặp “như thế này” và sự đối lập với chạy/đấm vô ích vẫn được duy trì.
