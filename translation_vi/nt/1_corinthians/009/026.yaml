    text: 'Hoặc: “không chắc chắn.” Trạng từ Hy Lạp có thể nhấn mạnh sự thiếu rõ ràng hoặc thiếu một mục tiêu xác định; trong hình ảnh chạy đua, “vô định” diễn đạt ý chạy không hướng đến một đích rõ ràng.'
