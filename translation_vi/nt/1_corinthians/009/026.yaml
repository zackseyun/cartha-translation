base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/026.yaml
  text: 'So then[a], I run in this way: not aimlessly; in this way I box: not beating the air.'
translation:
  language: vi
  text: 'Vậy thì, tôi chạy như thế này: không chạy vô định; tôi đấm bốc như thế này: không đấm vào không khí.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοίνυν
  choice: Vậy
  rationale: Đánh dấu kết luận suy ra từ hình ảnh thi đấu ở phần trước, đồng thời chuyển sang việc Phao-lô áp dụng cho chính mình; “Vậy” tự nhiên và gọn trong tiếng Việt.
- source_word: οὕτως
  choice: như thế này
  rationale: Giữ cả hai lần lặp để nhấn mạnh cách thức hành động, tương ứng với cấu trúc Hy Lạp.
- source_word: τρέχω
  choice: tôi chạy
  rationale: Giữ nguyên ẩn dụ điền kinh và sắc thái hiện tại, diễn tả hành động có tính liên tục.
- source_word: ἀδήλως
  choice: không có mục tiêu
  rationale: Trong hình ảnh cuộc chạy đua, cách dịch này làm rõ ý không chạy thiếu định hướng, nhưng vẫn ghi nhận nghĩa khác là “không chắc chắn” trong chú thích.
- source_word: πυκτεύω
  choice: tôi đấu quyền
  rationale: Động từ chỉ cụ thể môn quyền anh; “đấu quyền” trang trọng, dễ hiểu và giữ đúng hình ảnh thi đấu.
- source_word: ἀέρα
  choice: không khí
  rationale: Giữ nguyên đối tượng theo nghĩa đen trong hình ảnh tung những cú đấm không trúng đích.
- source_word: δέρων
  choice: đấm vào
  rationale: Trong ngữ cảnh quyền anh, “đấm vào không khí” tự nhiên và cụ thể hơn cách dịch chung là “đánh” hay “đập”.
