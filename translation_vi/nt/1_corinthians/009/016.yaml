source:
  edition: SBLGNT
  text: ἐὰν γὰρ εὐαγγελίζωμαι, οὐκ ἔστιν μοι καύχημα, ἀνάγκη γάρ μοι ἐπίκειται· οὐαὶ ⸀γάρ μοί ἐστιν ἐὰν μὴ ⸀εὐαγγελίσωμαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/016.yaml
  text: For if I preach the gospel[a], I have no ground for boasting, for necessity is laid upon me[b]. For woe is me if I do not preach the gospel.
translation:
  language: vi
  text: Vì nếu tôi công bố Tin Mừng[a], tôi không có cơ sở để tự hào, vì một sự bắt buộc đang đặt trên tôi[b]. Khốn cho tôi nếu tôi không công bố Tin Mừng!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “loan báo tin mừng” hoặc “rao giảng Phúc Âm”; áp dụng cho cả hai lần xuất hiện trong câu.'
    reason: lexical_alternative
  - marker: b
    text: 'Hoặc: “vì tôi bị thúc bách.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐαγγελίζωμαι / εὐαγγελίσωμαι
  choice: rao truyền tin mừng
  rationale: Động từ chỉ việc công bố một tin vui; trong ngữ cảnh của Phao-lô, nội dung được hiểu là sứ điệp Tin Mừng dù tân ngữ không được nói ra. Cách dịch này giữ được cả ý nghĩa từ vựng lẫn tính chất công khai của hành động, và được dùng nhất quán ở cả hai lần xuất hiện.
- source_word: καύχημα
  choice: có gì để tự hào
  rationale: Danh từ nói đến điều hoặc cơ sở để khoe mình. Cách diễn đạt này tự nhiên trong tiếng Việt và cho thấy Phao-lô không xem việc rao truyền tin mừng là căn cứ để tự tôn.
- source_word: ἀνάγκη ... ἐπίκειται
  choice: tôi buộc phải làm điều đó
  rationale: Cụm từ diễn tả một sự bắt buộc đang đặt trên Phao-lô. Lối dịch này rõ ràng, tự nhiên, nhưng không xác định nguồn của sự bắt buộc; hình ảnh sát chữ được giữ trong chú thích.
- source_word: οὐαί
  choice: khốn cho tôi
  rationale: Cách nói trang trọng và mạnh, diễn tả tai họa hoặc cảnh ngộ nghiêm trọng, phù hợp với sắc thái lời cảm thán trong nguyên văn.
- source_word: ἐὰν μὴ
  choice: nếu tôi không
  rationale: Diễn đạt trực tiếp điều kiện phủ định của nguyên văn và nối tự nhiên với lời cảm thán.
theological_decisions:
- issue: Nguồn gốc và bản chất của sự bắt buộc phải rao truyền tin mừng
  choice: Diễn đạt rằng Phao-lô bị buộc phải làm, nhưng không nói rõ ai hoặc điều gì đặt sự bắt buộc ấy trên ông.
  alternative: Diễn giải rõ thành mệnh lệnh của Đức Chúa Trời, sự thôi thúc nội tâm, hoặc một chức vụ được giao.
  rationale: Câu Hy Lạp khẳng định sự bắt buộc đang đặt trên Phao-lô nhưng không trực tiếp nêu nguồn gốc. Bản dịch giữ nguyên độ mở và sức căng thần học ấy.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Rao truyền tin mừng” tránh thuật ngữ quá chuyên biệt theo hệ phái, còn “Thật khốn cho tôi” giữ được sức nặng tu từ của lời cảm thán.
