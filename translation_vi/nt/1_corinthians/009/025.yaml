id: 1CO.9.25
reference: 1 Corinthians 9:25
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: πᾶς δὲ ὁ ἀγωνιζόμενος πάντα ἐγκρατεύεται, ἐκεῖνοι μὲν οὖν ἵνα φθαρτὸν στέφανον λάβωσιν, ἡμεῖς δὲ ἄφθαρτον.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/025.yaml
  text: Everyone who competes exercises self-control in all things. They do so in order to receive a perishable crown[a], but we an imperishable one.
translation:
  language: vi
  text: Mỗi người thi đấu đều tự kiềm chế trong mọi sự. Họ làm thế để nhận một vòng hoa hay hư nát[a], còn chúng ta thì một vòng hoa không hư nát.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “vương miện”; từ Hy Lạp chỉ vòng hoa của người chiến thắng được trao trong các cuộc thi đấu thể thao.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς
  choice: Mỗi người
  rationale: Diễn đạt tự nhiên lực khái quát của số ít trong tiếng Hy Lạp và không thêm sắc thái giới tính.
- source_word: ἀγωνιζόμενος
  choice: tham gia thi đấu
  rationale: Ngữ cảnh trực tiếp là hình ảnh thi đấu thể thao; cách dịch này rõ nghĩa hơn từ khái quát như “tranh đấu”.
- source_word: πάντα
  choice: trong mọi sự
  rationale: Giữ phạm vi rộng của sự tiết chế, không thu hẹp vào ăn uống hoặc luyện tập.
- source_word: ἐγκρατεύεται
  choice: tự chủ
  rationale: Diễn tả việc thường xuyên kiềm chế bản thân trong bối cảnh rèn luyện thể thao.
- source_word: ἐκεῖνοι μὲν οὖν
  choice: Họ làm vậy
  rationale: Quy chiếu tự nhiên về những người thi đấu vừa nói đến và bổ sung hành động được hàm ý trong tiếng Hy Lạp.
- source_word: ἵνα
  choice: để
  rationale: Đánh dấu mục đích một cách ngắn gọn, tự nhiên trong tiếng Việt.
- source_word: φθαρτὸν
  choice: hay hư nát
  rationale: Tạo thế đối xứng trực tiếp với ἄφθαρτον, đồng thời bao hàm tính chóng tàn của vòng thưởng bằng thực vật.
- source_word: στέφανον
  choice: vòng nguyệt quế
  rationale: Trong bối cảnh thi đấu, từ này chỉ vòng hoa trao cho người chiến thắng; “vòng nguyệt quế” truyền đạt hình ảnh thể thao rõ hơn “vương miện”.
- source_word: λάβωσιν
  choice: nhận
  rationale: Phù hợp với hình ảnh phần thưởng được trao cho người thắng cuộc.
- source_word: ἡμεῖς δὲ ἄφθαρτον
  choice: còn chúng ta thì nhận vòng nguyệt quế không hư nát
  rationale: Giữ sự tương phản mạnh; lặp lại danh từ và động từ được tỉnh lược trong tiếng Hy Lạp để câu tiếng Việt đầy đủ, dễ hiểu.
theological_decisions:
- issue: Bản chất của phần thưởng trong ẩn dụ
  choice: Giữ hình ảnh phần thưởng thi đấu là “vòng nguyệt quế”, không xác định thêm phần thưởng ấy là gì về mặt giáo lý.
  alternative: Giải thích trực tiếp là sự sống đời đời hoặc các phần thưởng trên trời.
  rationale: Câu này không định nghĩa chính xác đối tượng thần học của phần thưởng; giữ nguyên ẩn dụ tránh áp đặt một hệ giải thích hẹp hơn văn bản.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Cấu trúc tương phản “Họ... còn chúng ta...” phản ánh μέν...δέ; không thêm từ nối mang nghĩa “bây giờ” vì nguyên văn không có trạng từ thời gian tương ứng.
