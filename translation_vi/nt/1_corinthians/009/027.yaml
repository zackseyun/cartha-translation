  verdict: approve
  source_fidelity: 'Bản dịch giữ đúng các yếu tố chính của câu Hy Lạp: tương phản «Nhưng», sự rèn luyện nghiêm khắc đối với «thân thể», động từ mạnh về việc đặt thân thể vào sự phục tùng, mệnh đề lo ngại «kẻo», hành động rao giảng có trước, và kết quả đáng sợ là «bị loại». «Bị loại» diễn đạt thích đáng ἀδόκιμος trong khung ẩn dụ thi đấu mà không quyết định tranh luận thần học.'
  naturalness: Câu văn tự nhiên, hiện đại, trang trọng và rõ nghĩa. «Nghiêm khắc rèn luyện thân thể mình» và «bắt nó phải phục vụ tôi» đọc trôi chảy trong tiếng Việt. «Kẻo sau khi rao giảng cho người khác» biểu thị rõ quan hệ thời gian và ý ngại sợ của nguyên văn.
  terminology: «Thân thể» bảo lưu tính cụ thể của σῶμα. Cách diễn đạt chính «bắt nó phải phục vụ tôi» tự nhiên, trong khi chú thích a bảo lưu chính xác sắc thái mạnh «làm nô lệ» của δουλαγωγῶ. Chú thích b nêu các khả năng của ἀδόκιμος và giải thích hợp lý lựa chọn «bị loại», không áp đặt cách hiểu về sự cứu rỗi hay phần thưởng.
