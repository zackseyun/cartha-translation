id: 1CO.9.27
reference: 1 Corinthians 9:27
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀλλὰ ὑπωπιάζω μου τὸ σῶμα καὶ δουλαγωγῶ, μή πως ἄλλοις κηρύξας αὐτὸς ἀδόκιμος γένωμαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/027.yaml
  text: But I discipline my body and make it my servant[a], lest somehow, after preaching to others[c][b], I myself should become disqualified.
translation:
  language: vi
  text: Nhưng tôi nghiêm khắc rèn luyện thân thể mình và bắt nó phải phục vụ tôi,[a] kẻo sau khi rao giảng cho người khác, chính tôi lại bị loại.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “bắt nó làm nô lệ cho tôi.” Động từ Hy Lạp mang nghĩa đưa vào cảnh nô lệ hoặc bắt phải phục tùng.
    reason: lexical_alternative
  - marker: b
    text: Hay “không được chấp nhận”, “không vượt qua thử nghiệm”. “Bị loại” phù hợp với hình ảnh thi đấu trong văn cảnh.
    reason: alternative_reading
lexical_decisions:
- source_word: ὑπωπιάζω
  choice: nghiêm khắc rèn luyện
  rationale: Động từ vốn có thể chỉ việc đánh vào vùng dưới mắt, nhưng trong ngữ cảnh thi đấu được dùng theo nghĩa ẩn dụ về sự khổ luyện và tự kỷ luật nghiêm khắc. Cách dịch này tự nhiên trong tiếng Việt và vẫn giữ được sức nặng của hình ảnh.
- source_word: σῶμα
  choice: thân thể
  rationale: Giữ danh từ cụ thể của nguyên văn, không khái quát thành “bản thân”.
- source_word: δουλαγωγῶ
  choice: bắt nó phải phục vụ tôi
  rationale: Động từ có nghĩa mạnh là bắt làm nô lệ hoặc đưa vào cảnh nô lệ. Câu chính dùng cách diễn đạt tự nhiên, còn chú thích bảo lưu hình ảnh nô lệ rõ nét của tiếng Hy Lạp.
- source_word: μή πως
  choice: kẻo
  rationale: Diễn đạt tự nhiên mệnh đề chỉ điều lo ngại cần tránh, đồng thời giữ sắc thái cảnh giác.
- source_word: ἄλλοις
  choice: cho người khác
  rationale: Diễn đạt tự nhiên đối tượng tiếp nhận lời rao giảng.
- source_word: κηρύξας
  choice: sau khi rao giảng
  rationale: Phân từ bất định chỉ hành động có trước động từ chính; “sau khi” thể hiện rõ quan hệ thời gian.
- source_word: ἀδόκιμος
  choice: bị loại
  rationale: Phù hợp hình ảnh thi đấu trong văn cảnh và giữ ý không vượt qua sự thử nghiệm, nhưng không ấn định đó là mất sự cứu rỗi hay chỉ mất phần thưởng hoặc tư cách phục vụ.
- source_word: γένωμαι
  choice: lại bị
  rationale: Trong tiếng Việt, kết cấu này diễn đạt tự nhiên kết quả mà Phao-lô lo ngại; sắc thái trở thành hoặc rơi vào tình trạng ấy được hàm chứa trong “lại bị loại”.
- source_word: ἀλλὰ
  choice: Nhưng
  rationale: Đánh dấu sự tương phản mạnh với phần trước một cách tự nhiên.
theological_decisions:
- issue: Ý nghĩa của việc Phao-lô có thể trở thành ἀδόκιμος
  choice: Dịch là “bị loại” theo hình ảnh thi đấu, không xác định cụ thể hậu quả thần học.
  alternative: Bị Đức Chúa Trời khước từ theo nghĩa mất sự cứu rỗi; hoặc chỉ mất phần thưởng hay tư cách phục vụ.
  rationale: Văn cảnh trực tiếp nói về cuộc chạy đua, sự tự chủ và phần thưởng. “Bị loại” giữ nguyên tính nghiêm trọng và sự căng thẳng thần học mà không giải quyết thay cho nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Nghiêm khắc rèn luyện” tránh gợi ý hành vi tự gây thương tích nhưng chú thích vẫn bảo lưu nghĩa đen mạnh của ὑπωπιάζω; “bắt nó phải phục vụ tôi” dễ hiểu trong câu chính, còn hình ảnh nô lệ của δουλαγωγῶ được nêu rõ ở chú thích.
