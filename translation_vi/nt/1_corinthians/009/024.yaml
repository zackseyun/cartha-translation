reference: 1 Corinthians 9:24
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Οὐκ οἴδατε ὅτι οἱ ἐν σταδίῳ τρέχοντες πάντες μὲν τρέχουσιν, εἷς δὲ λαμβάνει τὸ βραβεῖον; οὕτως τρέχετε ἵνα καταλάβητε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/024.yaml
  text: Do you not know that those who run in a stadium all run[a], but one receives the prize? Run in this way[b], so that you may obtain it.
translation:
  language: vi
  text: Anh chị em không biết rằng trong sân vận động[a], tất cả những người chạy đều chạy, nhưng chỉ một người nhận được giải thưởng sao? Hãy chạy như thế[b] để anh chị em đạt được giải thưởng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “trên đường chạy.” Từ Hy Lạp στάδιον chỉ nơi diễn ra cuộc thi chạy, tức sân vận động hoặc đường chạy.
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “Hãy chạy sao cho anh chị em thắng được giải” hoặc “để anh chị em nắm lấy nó.” Từ Hy Lạp καταλάβητε có thể mang nghĩa “đạt được,” “nắm lấy” hoặc “chiếm lấy.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐκ οἴδατε
  choice: Anh chị em không biết ... sao?
  rationale: Giữ công thức câu hỏi tu từ quen thuộc của Phao-lô và nghĩa trực tiếp của οἶδα, đồng thời dùng cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: ἐν σταδίῳ
  choice: trong sân vận động
  rationale: Giữ hình ảnh cụ thể về địa điểm thi chạy; chú thích nêu nghĩa gần hơn là đường chạy.
- source_word: τρέχοντες ... τρέχουσιν
  choice: những người chạy đều chạy
  rationale: Giữ sự lặp lại có chủ ý của τρέχω và hình ảnh thể thao sống động trong nguyên văn.
- source_word: πάντες μὲν ... εἷς δὲ
  choice: tất cả ... nhưng chỉ một người
  rationale: Thể hiện rõ sự tương phản μέν...δέ; thêm 'chỉ' để diễn đạt tự nhiên lực giới hạn của εἷς trong ngữ cảnh.
- source_word: λαμβάνει
  choice: nhận được
  rationale: Phản ánh nghĩa trực tiếp của động từ, không diễn giải thành 'chiến thắng'.
- source_word: βραβεῖον
  choice: giải thưởng
  rationale: Cách gọi tự nhiên, rõ ràng cho phần thưởng dành cho người thắng cuộc trong thi đấu.
- source_word: οὕτως
  choice: như thế
  rationale: Liên kết mệnh lệnh với hình ảnh cuộc đua vừa nêu mà không giải thích quá mức cách thức chạy.
- source_word: τρέχετε
  choice: Hãy chạy
  rationale: Mệnh lệnh hiện tại được chuyển bằng lối thúc giục mạnh, tự nhiên; tiếng Việt không cần đánh dấu riêng tính tiếp diễn.
- source_word: ἵνα καταλάβητε
  choice: để anh chị em đạt được giải thưởng
  rationale: καταλαμβάνω có thể mang nghĩa đạt được, nắm lấy hoặc chiếm lấy. 'Đạt được' phù hợp ẩn dụ cuộc đua; lặp lại 'giải thưởng' giúp tiếng Việt rõ nghĩa hơn đại từ.
theological_decisions:
- issue: Ẩn dụ thi chạy áp dụng cho sự bền chí của người tin
  choice: Giữ nguyên hình ảnh cuộc đua mang tính cạnh tranh và lời thúc giục đạt giải, không xác định giải thưởng là sự cứu rỗi hay một phần thưởng giáo lý cụ thể.
  alternative: Diễn giải thành 'hãy chạy để chiến thắng' hoặc xác định rõ bản chất của giải thưởng.
  rationale: Câu Hy Lạp thúc giục sự theo đuổi có kỷ luật nhưng không tự nó giải quyết các tranh luận về công trạng, sự bền chí, sự cứu rỗi hay phần thưởng.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “anh chị em” cho ngôi thứ hai số nhiều nhằm phản ánh đối tượng cộng đồng; giữ nhịp câu hỏi tu từ và mệnh lệnh mạnh của nguyên văn.
