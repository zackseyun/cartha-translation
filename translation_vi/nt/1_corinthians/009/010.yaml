  source_fidelity: 'Bản nháp giữ đúng cấu trúc và các yếu tố chính của câu Hy Lạp: lời nói/điều được chép «vì chúng ta», người cày cày «trong/với hy vọng», và người đập lúa làm việc với hy vọng được dự phần. Tuy nhiên, “hoàn toàn vì chúng ta” dễ được hiểu là loại trừ mọi đối tượng khác, trong khi πάντως ở đây có thể mang sắc thái xác quyết (“chắc chắn/thật sự”) và phạm vi của nó vẫn được tranh luận. “Thật sự vì chúng ta” tránh khẳng định tính độc quyền mà vẫn phản ánh lực nhấn của trạng từ.'
  naturalness: “Hay Ngài nói điều ấy thật sự vì chúng ta sao?” là tiếng Việt hiện đại, rõ nghĩa trong một câu hỏi tu từ. Các vế nông nghiệp giữ được nhịp song hành tự nhiên. “Được hưởng phần” không thêm đối tượng vốn được để ngầm trong tiếng Hy Lạp.
