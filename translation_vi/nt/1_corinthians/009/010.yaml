  to: 'Hay Ngài nói điều ấy thật sự vì chúng ta[a]? Thật vậy, điều ấy đã được chép vì chúng ta: người cày phải cày với niềm hy vọng[b], và người đập lúa phải đập với niềm hy vọng được hưởng phần.'
  rationale: Chỉ điều chỉnh cách dịch πάντως từ “hoàn toàn” thành “thật sự” để biểu đạt lực nhấn xác quyết mà không tạo hàm ý độc quyền không cần thiết. Chú thích a nêu “hoàn toàn” như một khả năng, nhờ đó bảo toàn sự mơ hồ ngữ nghĩa. Các phần còn lại được giữ nguyên vì trung thành với cấu trúc, sự lặp lại, và đối tượng ngầm của nguyên ngữ.
