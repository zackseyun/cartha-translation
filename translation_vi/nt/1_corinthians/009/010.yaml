reference: 1 Corinthians 9:10
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἢ δι’ ἡμᾶς πάντως λέγει; δι’ ἡμᾶς γὰρ ἐγράφη, ὅτι ⸂ὀφείλει ἐπ’ ἐλπίδι⸃ ὁ ἀροτριῶν ἀροτριᾶν, καὶ ὁ ἀλοῶν ⸂ἐπ’ ἐλπίδι τοῦ μετέχειν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/010.yaml
  text: Or is he speaking entirely for our sake? Yes[a], it was written for our sake, because the one who plows ought to plow in hope[b], and the one who threshes ought to thresh in hope of sharing.
translation:
  language: vi
  text: 'Hay Ngài nói điều ấy thật sự vì chúng ta[a]? Thật vậy, điều ấy đã được chép vì chúng ta: người cày phải cày với niềm hy vọng[b], và người đập lúa phải đập với niềm hy vọng được hưởng phần.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hy Lạp ở đây cũng có thể mang nghĩa “hoàn toàn,” “chắc chắn” hoặc “quả thật”; từ này nhấn mạnh câu hỏi tu từ.
    reason: lexical_alternative
  - marker: b
    text: Cùng một cụm từ “với niềm hy vọng” được lặp lại ở vế sau; bản Hy Lạp nói người đập lúa hy vọng “được hưởng phần” nhưng không nêu rõ đối tượng được hưởng.
    reason: source_clarification
lexical_decisions:
- source_word: πάντως
  choice: hoàn toàn
  rationale: Trong câu hỏi tu từ, trạng từ này nhấn mạnh mức độ lời Kinh Thánh hướng đến lợi ích của con người. “Hoàn toàn” giữ được nghĩa “toàn thể/hoàn toàn,” đồng thời chú thích ghi nhận khả năng hiểu theo sắc thái xác quyết.
- source_word: δι’ ἡμᾶς
  choice: vì chúng ta
  rationale: διά với đối cách ở đây diễn tả lý do hoặc lợi ích; “vì chúng ta” tự nhiên trong tiếng Việt và giữ được cả sắc thái mục đích lẫn lợi ích.
- source_word: ἐγράφη
  choice: đã được chép
  rationale: Dạng aorist bị động được chuyển thành cách diễn đạt tự nhiên thường dùng khi dẫn Kinh Thánh, không cần nêu tác nhân viết.
- source_word: ὀφείλει
  choice: phải
  rationale: Từ này biểu thị nghĩa vụ hoặc điều chính đáng phải có. “Phải” ngắn gọn, phù hợp với tính nguyên tắc của hình ảnh lao động mà không thêm một cơ chế cưỡng ép.
- source_word: ἐπ’ ἐλπίδι
  choice: với niềm hy vọng
  rationale: Cụm giới từ diễn tả tâm thế và sự trông đợi thúc đẩy công việc. Cách dịch này tự nhiên và cho phép giữ sự lặp lại giữa hai vế.
- source_word: ὁ ἀροτριῶν ἀροτριᾶν
  choice: người cày phải cày
  rationale: Giữ cấu trúc người làm công việc và chính hành động ấy, đồng thời dùng cách gọi chung không nhấn mạnh giới tính.
- source_word: ὁ ἀλοῶν
  choice: người đập lúa
  rationale: “Đập lúa” là cách nói phổ thông, dễ hiểu cho hành động tách hạt, và giữ được sự song hành với “người cày.”
- source_word: τοῦ μετέχειν
  choice: được hưởng phần
  rationale: μετέχω có nghĩa tham dự hoặc nhận phần. “Được hưởng phần” diễn đạt tự nhiên quyền trông đợi lợi ích từ lao động, nhưng không tự ý nêu rõ đối tượng mà bản Hy Lạp để ngầm.
theological_decisions:
- issue: Chủ ngữ ngầm của λέγει
  choice: Ngài
  alternative: Đức Chúa Trời
  rationale: Chủ ngữ được hiểu từ “Đức Chúa Trời” trong ngữ cảnh ngay trước đó. “Ngài” duy trì liên kết ấy mà không lặp lại danh xưng không có trong câu này.
- issue: Đối tượng ngầm của μετέχειν
  choice: 'Không nêu đối tượng: “được hưởng phần”'
  alternative: được hưởng phần hoa lợi / được chia phần trong mùa gặt
  rationale: Bản Hy Lạp không nói rõ người đập lúa được hưởng phần trong vật gì. Ngữ cảnh nông nghiệp gợi đến hoa lợi, nhưng để ngỏ đối tượng bảo toàn mức độ hàm ẩn và khả năng áp dụng rộng hơn trong lập luận của Phao-lô.
- issue: Sức nhấn của πάντως trong câu hỏi tu từ
  choice: hoàn toàn
  alternative: chắc chắn / quả thật
  rationale: “Hoàn toàn” giữ trực tiếp sắc thái toàn thể có thể có của trạng từ. Chú thích ghi nhận cách hiểu xác quyết để không xóa bỏ sự mơ hồ thực sự của câu Hy Lạp.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng phổ thông. Giữ cấu trúc song hành “người cày… người đập lúa,” dùng “được chép” theo văn phong dẫn Kinh Thánh quen thuộc, và không bổ sung “mùa gặt” hay “hoa lợi” vào chính văn vì đối tượng không được nêu trong nguyên bản.
