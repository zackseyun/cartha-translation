id: 1CO.9.2
reference: 1 Corinthians 9:2
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἰ ἄλλοις οὐκ εἰμὶ ἀπόστολος, ἀλλά γε ὑμῖν εἰμι, ἡ γὰρ σφραγίς ⸂μου τῆς⸃ ἀποστολῆς ὑμεῖς ἐστε ἐν κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/002.yaml
  text: If I am not an apostle to others[a], yet I certainly am to you, for you are the seal of my apostleship in the Lord.
translation:
  language: vi
  text: Nếu tôi không phải là sứ đồ đối với những người khác, thì ít nhất đối với anh chị em, tôi là sứ đồ; vì anh chị em là con dấu[a] xác nhận chức vụ sứ đồ của tôi trong Chúa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “bằng chứng” hoặc “sự xác nhận”. Tiếng Hy Lạp dùng từ “con dấu”, giữ hình ảnh một vật chứng thực điều gì đó là thật.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπόστολος
  choice: sứ đồ
  rationale: Trong lời Phao-lô tự nói về mình, từ này chỉ chức vụ và sự ủy nhiệm được công nhận, chứ không chỉ có nghĩa chung là người đưa tin.
- source_word: ἀλλά γε
  choice: thì ít nhất ... tôi vẫn là
  rationale: Cách diễn đạt này truyền đạt cả sự tương phản của ἀλλά và sắc thái nhấn mạnh, giới hạn tối thiểu của γε bằng tiếng Việt tự nhiên.
- source_word: σφραγίς
  choice: con dấu
  rationale: Giữ nguyên hình ảnh Hy Lạp về con dấu chứng thực tính xác thực; động từ bổ nghĩa “xác nhận” làm rõ chức năng của hình ảnh trong ngữ cảnh.
- source_word: ἀποστολή
  choice: chức vụ sứ đồ
  rationale: Ở đây danh từ chỉ địa vị và sự ủy nhiệm làm sứ đồ của Phao-lô; “chức vụ sứ đồ” rõ nghĩa và tự nhiên hơn một danh từ trừu tượng ít thông dụng.
- source_word: ἐν κυρίῳ
  choice: trong Chúa
  rationale: Giữ cách nói đặc trưng của Phao-lô và không thu hẹp nghĩa thành tác nhân “bởi Chúa”; cụm từ có thể chỉ thực tại thuộc linh trong mối liên hệ với Chúa.
- source_word: ἄλλοις
  choice: đối với những người khác
  rationale: Diễn đạt tự nhiên quan hệ của cách dữ cách với việc Phao-lô là sứ đồ, đồng thời giữ sắc thái “trong mối liên hệ với người khác”.
theological_decisions:
- issue: Phạm vi lời khẳng định của Phao-lô về chức sứ đồ
  choice: Câu điều kiện nhượng bộ việc chức sứ đồ của Phao-lô có thể không được nhìn nhận đối với những người khác, rồi nhấn mạnh rằng ít nhất người Cô-rinh-tô phải công nhận điều ấy vì chính họ là bằng chứng xác nhận.
  alternative: Phao-lô thực sự giới hạn chức sứ đồ của mình chỉ trong phạm vi hội thánh Cô-rinh-tô.
  rationale: Mạch văn mang tính biện hộ và tu từ; sự hiện hữu của cộng đồng Cô-rinh-tô trong Chúa được nêu làm chứng cứ cho sự ủy nhiệm của ông, chứ không nhằm phủ nhận chức sứ đồ của ông ở nơi khác.
- issue: Phạm vi bổ nghĩa của ἐν κυρίῳ
  choice: Giữ cụm “trong Chúa” ở cuối câu để bảo tồn khả năng nó mô tả việc người Cô-rinh-tô là con dấu xác nhận trong phạm vi quan hệ với Chúa.
  alternative: Dịch là “bởi Chúa”, hiểu cụm từ chỉ Chúa là tác nhân trực tiếp xác nhận chức sứ đồ.
  rationale: Giới từ ἐν không buộc phải mang nghĩa tác nhân; cách dịch sát giữ được sự cô đọng và độ mở thần học của câu Hy Lạp.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh chị em” để diễn đạt số nhiều ὑμεῖς theo lối xưng hô tự nhiên; giữ các thuật ngữ quen thuộc “sứ đồ” và “trong Chúa”. Dấu chú thích được đặt ngay sau “con dấu”, là từ mà chú thích giải thích.
