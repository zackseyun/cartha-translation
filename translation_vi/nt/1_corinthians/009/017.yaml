source:
  edition: SBLGNT
  text: εἰ γὰρ ἑκὼν τοῦτο πράσσω, μισθὸν ἔχω· εἰ δὲ ἄκων, οἰκονομίαν πεπίστευμαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/017.yaml
  text: For if I do this willingly[a], I have a reward; but if unwillingly, I have been entrusted with a stewardship.
translation:
  language: vi
  text: Vì nếu tôi tự nguyện làm điều này, tôi có phần thưởng; nhưng nếu không tự nguyện, thì tôi đã được giao phó một trách nhiệm quản lý.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “tôi đã được giao phó một nhiệm vụ.”'
    reason: Nêu cách diễn đạt thay thế cho οἰκονομίαν πεπίστευμαι, nhấn mạnh trách nhiệm được ủy thác thay vì hình ảnh quản lý.
lexical_decisions:
- source_word: ἑκὼν
  choice: tự nguyện
  rationale: Diễn đạt hành động xuất phát từ ý muốn của chính mình và giữ được thế đối lập trực tiếp với ἄκων.
- source_word: τοῦτο πράσσω
  choice: làm việc này
  rationale: Cách nói tự nhiên, đủ rộng để chỉ việc rao giảng Tin Mừng đang được bàn đến trong ngữ cảnh mà không thêm ý ngoài nguyên văn.
- source_word: μισθὸν
  choice: phần thưởng
  rationale: Trong ngữ cảnh này, từ này chỉ sự đền đáp cho việc phục vụ tự nguyện, rộng hơn nghĩa tiền công hay tiền lương.
- source_word: ἄκων
  choice: không tự nguyện
  rationale: Giữ sự đối xứng với ἑκὼν và không thêm sắc thái miễn cưỡng hoặc bất mãn mạnh hơn nguyên văn.
- source_word: οἰκονομίαν
  choice: một phận sự quản gia
  rationale: Giữ hình ảnh về trách nhiệm quản lý điều được chủ giao phó, đồng thời tự nhiên hơn lối dịch danh từ trừu tượng “sự quản trị” trong tiếng Việt.
- source_word: πεπίστευμαι
  choice: tôi vẫn được giao phó
  rationale: Thể hoàn thành bị động diễn tả việc đã được trao trách nhiệm và hiện vẫn ở trong tình trạng mang trách nhiệm ấy; “vẫn” làm rõ quan hệ tương phản trong câu nhưng không phủ nhận tiếng gọi hay trách nhiệm.
theological_decisions:
- issue: Bản chất chức vụ của Phao-lô trong vế thứ hai
  choice: Ngay cả khi không làm một cách tự nguyện, Phao-lô vẫn ở dưới trách nhiệm quản gia đã được giao phó.
  alternative: Nếu làm không tự nguyện, Phao-lô chỉ thi hành một nhiệm vụ bắt buộc và không có phần thưởng.
  rationale: Nguyên văn đối chiếu “có phần thưởng” với “được giao phó một phận sự quản gia.” Bản dịch giữ nguyên sức căng giữa sự tự nguyện và nghĩa vụ, không biến vế sau thành lời phủ nhận sự kêu gọi hoặc giải quyết dứt khoát vấn đề phần thưởng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Phận sự quản gia” bảo tồn hình ảnh ủy thác trong nguyên văn; cấu trúc hai vế song song giữ rõ sự tương phản giữa “tự nguyện” và “không tự nguyện”.
