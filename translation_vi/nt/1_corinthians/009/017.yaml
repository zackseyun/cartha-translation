revisions:
- from: Vì nếu tôi tự nguyện làm việc này, tôi có phần thưởng; còn nếu không tự nguyện, tôi vẫn được giao phó một phận sự quản gia.[a]
  to: Vì nếu tôi tự nguyện làm điều này, tôi có phần thưởng; nhưng nếu không tự nguyện, thì tôi đã được giao phó một trách nhiệm quản lý.[a]
  rationale: Bản sửa loại bỏ cách nói không tự nhiên “phận sự quản gia” và từ diễn giải “vẫn,” đồng thời duy trì sự đối lập giữa hành động tự nguyện có phần thưởng và trách nhiệm quản lý đã được giao phó. “Đã được giao phó” phản ánh thể hoàn thành bị động mà không suy diễn thêm về phần thưởng hay bản chất chức vụ.
  reviewer_model: gpt-5.6-terra
