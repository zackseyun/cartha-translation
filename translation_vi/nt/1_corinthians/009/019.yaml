  source_fidelity: 'Bản dịch giữ đúng cấu trúc và đối lập trọng tâm của nguyên văn: Phao-lô vốn tự do/không lệ thuộc ai nhưng tự hạ mình làm nô lệ cho mọi người. Tuy nhiên, “chinh phục” thường gợi chinh phạt hoặc áp đảo trong tiếng Việt hiện đại, mạnh và lệch hướng so với κερδήσω (“thu phục/giành được”). “Thêm nhiều người” cũng không biểu thị rõ sắc thái so sánh của τοὺς πλείονας (“nhiều người hơn”).'
