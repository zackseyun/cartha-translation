id: 1CO.9.19
reference: 1 Corinthians 9:19
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἐλεύθερος γὰρ ὢν ἐκ πάντων πᾶσιν ἐμαυτὸν ἐδούλωσα, ἵνα τοὺς πλείονας κερδήσω·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/019.yaml
  text: For though I am free from all[a], I made myself a servant to all, so that I might win more of them.
translation:
  language: vi
  text: Vì dù là người tự do, không lệ thuộc vào bất cứ ai, tôi đã tự biến mình thành nô lệ[a] cho mọi người, để thu phục được nhiều người hơn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch nhẹ hơn là “người phục vụ cho mọi người”; tuy nhiên, nguyên văn Hy Lạp dùng động từ mang nghĩa “biến thành nô lệ”, đối lập trực tiếp với “người tự do” ở đầu câu.
    reason: Giải thích hình ảnh nô lệ trong nguyên văn và ghi nhận cách dịch nhẹ hơn.
lexical_decisions:
- source_word: Ἐλεύθερος ... ἐκ πάντων
  choice: là người tự do, không lệ thuộc vào bất cứ ai
  rationale: Cách diễn đạt này chuyển tải cả tính từ “tự do” lẫn quan hệ được diễn tả bằng ἐκ πάντων. Tiếng Việt tự nhiên khó nói sát chữ là “tự do khỏi mọi người”, nên “không lệ thuộc vào bất cứ ai” làm rõ ý mà vẫn giữ sự đối lập với hình ảnh nô lệ ở vế sau.
- source_word: πᾶσιν
  choice: cho mọi người
  rationale: Giữ sự song hành phổ quát giữa việc Phao-lô không lệ thuộc vào ai và việc ông tự nguyện đặt mình dưới mọi người.
- source_word: ἐμαυτὸν ἐδούλωσα
  choice: tôi đã tự biến mình thành nô lệ
  rationale: Động từ δουλόω mang nghĩa biến thành nô lệ hoặc bắt làm nô lệ. Đại từ phản thân cho thấy đây là sự tự nguyện hạ mình; “nô lệ” giữ nguyên sức mạnh tu từ trong thế đối lập với “người tự do”.
- source_word: ἵνα
  choice: để có thể
  rationale: Diễn tả mục đích của hành động tự nguyện phục vụ; “có thể” phù hợp với sắc thái động từ giả định κερδήσω mà không biến mục đích thành kết quả chắc chắn.
- source_word: τοὺς πλείονας
  choice: thêm nhiều người
  rationale: Diễn tả số người nhiều hơn mà không đẩy nghĩa đến mức “càng nhiều càng tốt”, vốn mạnh hơn nguyên văn.
- source_word: κερδήσω
  choice: chinh phục
  rationale: Giữ phép ẩn dụ “thu được/giành được” người khác trong bối cảnh sứ vụ. Ở đây “chinh phục” được hiểu là thuyết phục và đưa họ đến với Tin Mừng, không phải cưỡng ép.
theological_decisions:
- issue: Cách dịch ngôn ngữ nô lệ của δουλόω
  choice: nô lệ
  alternative: đầy tớ; người phục vụ
  rationale: Sự đối lập giữa Ἐλεύθερος (“người tự do”) và ἐδούλωσα (“tự biến mình thành nô lệ”) là trọng tâm lập luận. Dịch nhẹ thành “đầy tớ” hoặc “người phục vụ” sẽ làm suy yếu nghịch lý về việc Phao-lô tự nguyện từ bỏ quyền tự chủ vì lợi ích của người khác.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cụm “là người tự do, không lệ thuộc vào bất cứ ai” tránh lối dịch sát chữ thiếu tự nhiên, đồng thời giữ rõ thế đối lập tu từ với “nô lệ”. “Chinh phục” bảo toàn phép ẩn dụ của κερδαίνω nhưng không được hiểu theo nghĩa dùng vũ lực.
