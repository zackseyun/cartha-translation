  terminology: “Người tự do” và “nô lệ” là lựa chọn phù hợp, bảo toàn thế đối lập Ἐλεύθερος/ἐδούλωσα. “Thu phục” ở đây diễn tả việc đạt được hoặc đưa người khác đến với Tin Mừng, không hàm ý cưỡng ép như “chinh phục” dễ gợi ra.
