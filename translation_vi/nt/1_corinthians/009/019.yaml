  - severity: low
    issue: “thêm nhiều người” dịch τοὺς πλείονας
    rationale: Tính từ so sánh πλείονας nói đến “nhiều người hơn”; “thêm nhiều người” có thể hiểu là một số lượng bổ sung lớn mà không nêu rõ quan hệ so sánh.
