id: 1CO.9.12
reference: 1 Corinthians 9:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἰ ἄλλοι τῆς ⸂ὑμῶν ἐξουσίας⸃ μετέχουσιν, οὐ μᾶλλον ἡμεῖς; Ἀλλ’ οὐκ ἐχρησάμεθα τῇ ἐξουσίᾳ ταύτῃ, ἀλλὰ πάντα στέγομεν ἵνα μή ⸂τινα ἐγκοπὴν⸃ δῶμεν τῷ εὐαγγελίῳ τοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/012.yaml
  text: If others share in this right over you[a], do not we even more? But we have not made use of this right; instead[b], we endure everything so that we may give no hindrance to the gospel of the Messiah.
translation:
  language: vi
  text: Nếu những người khác được hưởng quyền đòi hỏi nơi anh chị em[a], chẳng phải chúng tôi càng có quyền hơn sao? Nhưng chúng tôi đã không sử dụng quyền ấy; trái lại, chúng tôi chịu đựng mọi sự để không gây bất cứ trở ngại nào cho Tin Mừng của Đấng Mê-si.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “quyền này đối với anh chị em.” Cụm Hy Lạp có lẽ nói đến quyền của các sứ đồ được người Cô-rinh-tô chu cấp vật chất.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξουσίας / ἐξουσίᾳ
  choice: quyền
  rationale: Trong văn cảnh, từ này chỉ quyền chính đáng của các sứ đồ được Hội Thánh chu cấp vật chất; “quyền” tự nhiên và chính xác hơn “thẩm quyền” trong tiếng Việt.
- source_word: τῆς ὑμῶν ἐξουσίας
  choice: quyền này nơi anh chị em
  rationale: Cách diễn đạt này giữ được quan hệ của quyền ấy đối với người Cô-rinh-tô mà không gây hiểu lầm rằng chính họ là người sở hữu quyền.
- source_word: μετέχουσιν
  choice: được hưởng
  rationale: Trong ngữ cảnh quyền nhận sự chu cấp, động từ mang nghĩa dự phần vào lợi ích hay được hưởng quyền đó.
- source_word: οὐ μᾶλλον ἡμεῖς;
  choice: chẳng phải chúng tôi càng có quyền hơn sao?
  rationale: Giữ nguyên câu hỏi tu từ và lực so sánh của μᾶλλον, đồng thời diễn đạt tự nhiên bằng tiếng Việt.
- source_word: ἐχρησάμεθα
  choice: đã không sử dụng
  rationale: Diễn tả trực tiếp việc không vận dụng hay không tận dụng quyền đang nói đến.
- source_word: πάντα στέγομεν
  choice: chịu đựng mọi sự
  rationale: στέγω ở đây chỉ việc chịu đựng khó khăn, không phải che giấu; cách dịch giữ được phạm vi rộng của πάντα.
- source_word: τινα ἐγκοπὴν
  choice: bất cứ trở ngại nào
  rationale: ἐγκοπή chỉ điều cản trở hay chướng ngại; cụm này cũng phản ánh sắc thái bất định của τινα dưới sự phủ định.
- source_word: εὐαγγελίῳ
  choice: Tin Mừng
  rationale: “Tin Mừng” là cách gọi đã quen thuộc, trang trọng và dễ hiểu trong tiếng Việt hiện đại.
- source_word: Χριστοῦ
  choice: Đấng Mê-si
  rationale: Χριστός tại đây có chức năng tước hiệu; “Đấng Mê-si” giữ rõ ý nghĩa về Đấng được xức dầu.
theological_decisions:
- issue: Cách dịch Χριστοῦ
  choice: của Đấng Mê-si
  alternative: của Đấng Christ / của Chúa Kitô
  rationale: Trong cụm εὐαγγελίῳ τοῦ Χριστοῦ, Χριστός vẫn có thể được nghe như một tước hiệu. Bản dịch chính giữ nghĩa Mê-si mà không buộc cụm sở hữu phải chỉ là Tin Mừng “thuộc về” hay “nói về” Ngài.
- issue: Quan hệ của τῆς ὑμῶν ἐξουσίας
  choice: quyền này nơi anh chị em
  alternative: quyền đòi hỏi nơi anh chị em / quyền đối với anh chị em
  rationale: Cụm Hy Lạp có thể diễn tả quyền hay yêu sách trong quan hệ với người Cô-rinh-tô, cụ thể là quyền nhận chu cấp. Cách dịch chính tránh sắc thái thống trị quá mạnh của “đối với” hay “trên”.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” để gọi cộng đồng tín hữu; giữ câu hỏi tu từ của nguyên bản. “Trái lại” làm rõ thế tương phản của ἀλλά, còn “Tin Mừng của Đấng Mê-si” duy trì độ mở của sở hữu cách Hy Lạp.
