  text: μὴ οὐκ ἔχομεν ἐξουσίαν φαγεῖν καὶ ⸀πεῖν;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/004.yaml
  text: Do we not have the right to eat and drink?[a]
translation:
  language: vi
  text: Chẳng phải chúng tôi có quyền ăn và uống sao?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “thẩm quyền ăn và uống.” Ở đây, “quyền” nói đến một đòi hỏi chính đáng hoặc sự tự do được phép; trong lập luận của Phao-lô, có lẽ từ này chỉ quyền nhận sự chu cấp vật chất.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ οὐκ
  choice: Chẳng phải ... sao?
  rationale: Cụm phủ định kép mở đầu một câu hỏi tu từ, chờ đợi câu trả lời khẳng định. Cấu trúc này tự nhiên trong tiếng Việt và giữ nguyên sức chất vấn.
- source_word: ἔχομεν
  choice: chúng tôi có
  rationale: Thì hiện tại được chuyển trực tiếp bằng “có”; đại từ “chúng tôi” phù hợp với ngôi thứ nhất số nhiều và mạch lập luận của Phao-lô.
- source_word: ἐξουσίαν
  choice: quyền
  rationale: Trong ngữ cảnh này, từ chỉ quyền chính đáng hay sự tự do được phép, không nhất thiết là quyền cai trị hoặc sức mạnh. “Quyền” ngắn gọn và giữ được phạm vi nghĩa.
- source_word: φαγεῖν καὶ πεῖν
  choice: ăn và uống
  rationale: Hai động từ nguyên mẫu chỉ các hoạt động thuộc phạm vi quyền được nói đến; tiếng Việt diễn đạt tự nhiên bằng “ăn và uống” mà không cần thêm từ chức năng.
theological_decisions:
- issue: Phạm vi quyền của các sứ đồ trong ngữ cảnh
  choice: Giữ câu chính ở mức “quyền ăn và uống,” đồng thời chú thích rằng trong lập luận này có lẽ đó là quyền nhận sự chu cấp vật chất.
  alternative: Hiểu như một phát biểu chung về tự do ăn uống của con người.
  rationale: Ngữ cảnh 1 Cô-rinh-tô 9 bàn về quyền của sứ đồ và sự chu cấp cho người phục vụ. Tuy nhiên, câu Hy Lạp không nói rõ “nhận sự chu cấp,” nên không đưa phần diễn giải ấy vào câu chính.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Cấu trúc câu hỏi tu từ bảo toàn kỳ vọng về câu trả lời khẳng định; không diễn giải quá mức ý niệm chu cấp trong câu chính.
