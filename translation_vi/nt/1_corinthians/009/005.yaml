revisions:
- from: Chẳng phải chúng tôi có quyền đưa theo một người chị em làm vợ[a], như các sứ đồ khác, các anh em của Chúa và Kê-pha cũng làm sao?
  to: Chẳng phải chúng tôi có quyền đưa theo một người vợ là chị em cùng đức tin[a], như các sứ đồ còn lại, các anh em của Chúa và Kê-pha cũng làm vậy sao?
  rationale: 'Bản sửa giữ nguyên nghĩa của câu và các thuật ngữ chính, nhưng thay cấu trúc Việt ngữ dễ gây hiểu lầm bằng một cách nói hiện đại, rõ ràng: người được đưa theo là vợ, đồng thời là chị em trong đức tin. Chú thích bảo lưu hình thức nguyên văn và giải thích thành ngữ mà không giải quyết các tranh luận giáo phái về “các anh em của Chúa”.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T18:11:35Z'
review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng câu hỏi tu từ, “có quyền” cho ἐξουσίαν, ý đưa người đi cùng của περιάγειν, các nhóm được liệt kê, và giữ tên Kê-pha. Tuy nhiên, “một người chị em làm vợ” trong tiếng Việt có thể bị hiểu là một chị/em gái được cưới làm vợ, thay vì thành ngữ Hy Lạp chỉ một người vợ đồng đức tin.
  naturalness: Cần chỉnh cụm danh từ trung tâm và phần so sánh để câu tiếng Việt hiện đại rõ, tự nhiên hơn. “Một người vợ là chị em cùng đức tin” biểu đạt quan hệ bổ nghĩa đúng hướng và tránh nghĩa huyết thống ngoài ý muốn.
  terminology: Giữ “có quyền”, “đưa theo”, “các anh em của Chúa”, và “Kê-pha”. “Các sứ đồ còn lại” phản ánh λοιποί chính xác hơn “các sứ đồ khác”, dù cả hai đều khả dĩ.
  issues:
  - severity: medium
    issue: Cụm “một người chị em làm vợ” mơ hồ và không tự nhiên.
    rationale: Trong tiếng Việt, “chị/em làm vợ” dễ gợi quan hệ chị em ruột hoặc hành động lấy một người chị/em làm vợ. ἀδελφὴν γυναῖκα tự nhiên chỉ một người vợ cũng là chị em trong cộng đồng đức tin; cấu trúc tiếng Việt cần đảo để biểu đạt điều này mà không áp đặt thêm tín lý.
  - severity: low
    issue: “Các sứ đồ khác” giảm nhẹ sắc thái λοιποί.
    rationale: λοιποί nghĩa là phần còn lại/những người còn lại của nhóm; “các sứ đồ còn lại” sát hơn trong ngữ cảnh Phao-lô và Ba-na-ba được ngầm đối chiếu với các vị khác.
