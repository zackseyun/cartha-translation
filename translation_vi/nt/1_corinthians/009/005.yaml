  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: μὴ οὐκ ἔχομεν ἐξουσίαν ἀδελφὴν γυναῖκα περιάγειν, ὡς καὶ οἱ λοιποὶ ἀπόστολοι καὶ οἱ ἀδελφοὶ τοῦ κυρίου καὶ Κηφᾶς;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/005.yaml
  text: Do we not have the right to take along a sister as a wife[a], as also the rest of the apostles and the brothers of the Lord and Cephas?
translation:
  language: vi
  text: Chẳng phải chúng tôi có quyền đưa theo một người vợ là chị em cùng đức tin[a], như các sứ đồ còn lại, các anh em của Chúa và Kê-pha cũng làm vậy sao?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “một chị em, một vợ”; tức là một người vợ cùng đức tin.'
    reason: Giải thích cấu trúc Hy Lạp khác thường và nghĩa “chị em” trong cộng đồng đức tin.
lexical_decisions:
- source_word: ἐξουσίαν
  choice: có quyền
  rationale: Trong mạch lập luận, từ này chỉ quyền chính đáng của người làm sứ đồ, không phải thẩm quyền trừu tượng.
- source_word: ἀδελφὴν γυναῖκα
  choice: một người chị em làm vợ
  rationale: 'Giữ lại cả hai thành tố của cụm Hy Lạp: người vợ đồng thời là chị em trong đức tin; chú thích làm rõ cách hiểu tự nhiên của cụm từ.'
- source_word: περιάγειν
  choice: đưa theo
  rationale: Diễn đạt tự nhiên việc cho người ấy cùng đi trong các hành trình phục vụ.
- source_word: ὡς καὶ
  choice: như ... cũng làm
  rationale: Thể hiện cả ý so sánh lẫn ý bổ sung, đồng thời tạo câu hỏi tu từ tự nhiên trong tiếng Việt.
- source_word: οἱ λοιποὶ ἀπόστολοι
  choice: các sứ đồ khác
  rationale: Truyền đạt tự nhiên sự phân biệt giữa những người đang được nói đến và phần còn lại của nhóm sứ đồ.
- source_word: οἱ ἀδελφοὶ τοῦ κυρίου
  choice: các anh em của Chúa
  rationale: Theo sát cấu trúc Hy Lạp và không quyết định bản chất chính xác của mối quan hệ gia đình.
- source_word: Κηφᾶς
  choice: Kê-pha
  rationale: Giữ dạng tên được bản Hy Lạp dùng tại đây thay vì thay bằng Phi-e-rơ.
theological_decisions:
- issue: Ý nghĩa của “các anh em của Chúa”
  choice: Dịch trực tiếp là “các anh em của Chúa”.
  alternative: Các em trai ruột, anh em kế, hoặc bà con gần của Chúa.
  rationale: Cụm Hy Lạp không tự nó giải quyết các cách hiểu thần học về quan hệ huyết thống; bản dịch giữ nguyên độ mở của câu.
- issue: Ý nghĩa của ἀδελφὴν γυναῖκα
  choice: Dịch “một người chị em làm vợ”, kèm chú thích rằng đó là người vợ cùng đức tin.
  alternative: “một người vợ có đức tin” hoặc “một nữ tín hữu làm vợ”.
  rationale: Cách dịch chính giữ rõ cả ἀδελφή và γυνή, tránh xóa cấu trúc khác thường của nguyên văn, trong khi chú thích ngăn cách hiểu sai là chị em ruột.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Cấu trúc câu hỏi tu từ được giữ; “Kê-pha” bảo tồn dạng tên trong nguyên văn.
