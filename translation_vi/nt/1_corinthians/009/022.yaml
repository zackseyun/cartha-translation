  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐγενόμην τοῖς ⸀ἀσθενέσιν ἀσθενής, ἵνα τοὺς ἀσθενεῖς κερδήσω· τοῖς πᾶσιν ⸀γέγονα πάντα, ἵνα πάντως τινὰς σώσω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/022.yaml
  text: To the weak I became weak[a], so that I might win the weak. I have become all things to all people[b], so that by all means I might save some.
translation:
  language: vi
  text: Đối với những người yếu đuối, tôi đã trở nên yếu đuối[a], để thu phục những người yếu đuối. Tôi đã trở nên mọi sự cho mọi người, để bằng mọi cách[b] tôi có thể cứu được một số người.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể hiểu là “yếu đuối trong lương tâm”; trong 1 Cô-rinh-tô, cách gọi này có thể đặc biệt chỉ những người có lương tâm dễ bị tổn thương.
    reason: lexical_alternative
  - marker: b
    text: Hay “bằng mọi phương cách”; cụm từ này nói đến việc dùng mọi phương cách có thể để theo đuổi mục tiêu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγενόμην
  choice: tôi đã trở nên
  rationale: Diễn đạt hành động thích nghi của Phao-lô trong những hoàn cảnh phục vụ trước đây, đồng thời giữ ý bước vào một tình trạng hay vị thế.
- source_word: ἀσθενέσιν / ἀσθενής / ἀσθενεῖς
  choice: những người yếu đuối / yếu đuối
  rationale: Giữ nguyên sự lặp lại có chủ ý trong tiếng Hy Lạp và không thu hẹp nghĩa ngay trong chính văn; trong văn mạch 1 Cô-rinh-tô, từ này có thể đặc biệt chỉ người có lương tâm dễ bị tổn thương.
- source_word: κερδήσω
  choice: chinh phục
  rationale: Trong văn mạch truyền giáo, động từ nói đến việc thu phục người khác, chứ không phải giành lợi ích vật chất; “chinh phục” diễn đạt tự nhiên mục tiêu đưa họ đến với Tin Lành.
- source_word: τοῖς πᾶσιν
  choice: cho mọi người
  rationale: Cụm tặng cách trong tiếng Hy Lạp được dùng tỉnh lược; thêm “người” làm rõ đối tượng mà không mở rộng quá mức.
- source_word: γέγονα
  choice: tôi đã trở nên
  rationale: Thì hoàn thành chỉ một nếp sống đã hình thành và còn có hiệu lực; cách dịch này tự nhiên trong tiếng Việt và giữ được kết quả hiện tại.
- source_word: πάντα
  choice: mọi sự
  rationale: Giữ bề rộng và kết cấu cô đọng của thành ngữ “mọi sự cho mọi người”.
- source_word: πάντως
  choice: bằng mọi cách
  rationale: Diễn đạt việc dùng mọi phương cách có thể để theo đuổi mục tiêu, nhưng không mặc nhiên hàm ý thỏa hiệp phi đạo đức.
- source_word: τινὰς
  choice: một số người
  rationale: 'Giữ tính bất định và sự dè dặt của đại từ Hy Lạp: Phao-lô không tuyên bố rằng tất cả đều sẽ được cứu qua công việc của ông.'
- source_word: σώσω
  choice: có thể cứu được
  rationale: Giữ nguyên sức nặng cứu rỗi của động từ, đồng thời cấu trúc chỉ mục đích không biến kết quả thành điều chắc chắn.
theological_decisions:
- issue: Ý nghĩa của “những người yếu đuối” trong văn mạch
  choice: Dịch rộng là “những người yếu đuối” trong chính văn.
  alternative: những người có lương tâm yếu đuối; những người không có thế lực
  rationale: Trong 1 Cô-rinh-tô, từ này thường có thể chỉ người có lương tâm dễ bị tổn thương, nhất là trong các chương 8–10, nhưng câu này vẫn dùng cách gọi khái quát và song song với các nhóm chung quanh. Thu hẹp nghĩa trong chính văn sẽ giải quyết điều mà tiếng Hy Lạp còn để ngỏ.
- issue: Sức nặng của động từ “cứu”
  choice: Giữ “cứu” để diễn đạt mục tiêu truyền giáo của Phao-lô.
  alternative: đưa đến sự cứu rỗi; góp phần cứu
  rationale: σώζω thật sự là ngôn ngữ cứu rỗi ở đây. Dịch nhẹ hơn sẽ làm suy giảm sức nặng của câu; tuy nhiên, câu chỉ mục đích và văn mạch cho phép hiểu Phao-lô là tác nhân phục vụ, không nhất thiết là nguồn tối hậu của sự cứu rỗi.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Giữ ba lần lặp “yếu đuối” và cấu trúc giàu tính tu từ của nguyên văn. “Mọi sự cho mọi người” được giữ vì cô đọng và dễ hiểu trong văn mạch; các chú thích bảo tồn những khả năng từ vựng chân thực mà không làm nặng chính văn.
