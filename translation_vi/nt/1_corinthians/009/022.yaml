- from: Đối với những người yếu đuối, tôi đã trở nên yếu đuối[a], để chinh phục những người yếu đuối. Tôi đã trở nên mọi sự cho mọi người, để bằng mọi cách[b] có thể cứu được một số người.
  to: Đối với những người yếu đuối, tôi đã trở nên yếu đuối[a], để thu phục những người yếu đuối. Tôi đã trở nên mọi sự cho mọi người, để bằng mọi cách[b] tôi có thể cứu được một số người.
