    issue: “chinh phục” dịch κερδήσω
    rationale: Trong tiếng Việt hiện đại, “chinh phục” thường mang sắc thái chiếm lấy, khuất phục, hoặc chiến thắng. κερδήσω ở đây nói về việc giành được/thu phục người khác trong mục tiêu truyền giáo; “thu phục” sát ngữ cảnh hơn và tránh hàm ý áp đặt.
  - severity: low
    issue: Cách nói ở chú thích a chưa thật tự nhiên
    rationale: “Yếu đuối về lương tâm” có thể hiểu được, nhưng “yếu đuối trong lương tâm” tự nhiên hơn trong tiếng Việt và diễn đạt đúng khả năng nghĩa chuyên biệt của ἀσθενής trong thư này.
