  rationale: Bản sửa chỉ cải thiện cách diễn đạt tiếng Việt và làm rõ hơn lực của câu hỏi tu từ, không thay đổi nghĩa hay thêm chi tiết về loài vật trong đàn. Chú thích được giữ để ghi nhận nghĩa từ vựng của ὀψώνια và cách dùng nghĩa đen của ἐσθίει với sữa.
