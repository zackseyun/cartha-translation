revisions:
- from: Có ai từng đi lính mà phải tự trả chi phí cho mình không?[a] Có ai trồng vườn nho mà không ăn trái của vườn ấy? Hay có ai chăn một bầy mà không uống sữa từ bầy ấy?[b]
