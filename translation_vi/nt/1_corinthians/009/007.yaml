id: 1CO.9.7
reference: 1 Corinthians 9:7
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τίς στρατεύεται ἰδίοις ὀψωνίοις ποτέ; τίς φυτεύει ἀμπελῶνα καὶ ⸂τὸν καρπὸν⸃ αὐτοῦ οὐκ ἐσθίει; ⸀τίς ποιμαίνει ποίμνην καὶ ἐκ τοῦ γάλακτος τῆς ποίμνης οὐκ ἐσθίει;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/007.yaml
  text: Who ever serves as a soldier at his own expense? Who plants a vineyard and does not eat its fruit? Or who shepherds a flock and does not drink from the milk of the flock?[a][b]
translation:
  language: vi
  text: Có ai bao giờ đi lính bằng tiền của chính mình không?[a] Có ai trồng vườn nho mà không ăn trái của vườn ấy? Hay có ai chăn một đàn mà không uống sữa của đàn ấy?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể hiểu: “bằng quân lương/tiền công của chính mình.” Từ Hy Lạp chỉ tiền công hoặc khẩu phần của người lính; ý của câu là người lính không tự gánh chi phí phục vụ.'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “không ăn từ sữa của đàn ấy.” Tiếng Việt thông thường nói “uống” sữa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: στρατεύεται
  choice: đi lính
  rationale: Diễn đạt tự nhiên hành động phục vụ với tư cách người lính, không giới hạn nghĩa vào việc trực tiếp tham chiến.
- source_word: ἰδίοις ὀψωνίοις
  choice: tự trả chi phí cho mình
  rationale: ὀψώνιον có thể chỉ quân lương, khẩu phần hoặc tiền công của người lính; trong câu hỏi tu từ này, ý chính là người lính không tự gánh chi phí phục vụ. Chú thích giữ lại sắc thái từ vựng cụ thể.
- source_word: ποτέ
  choice: từng
  rationale: Trong câu hỏi tu từ, ποτέ mang nghĩa “bao giờ/từng”, được diễn đạt gọn và tự nhiên bằng “từng”.
- source_word: φυτεύει ἀμπελῶνα
  choice: trồng vườn nho
  rationale: Chuyển tải trực tiếp hình ảnh nông nghiệp của nguyên ngữ bằng cách nói thông dụng trong tiếng Việt.
- source_word: τὸν καρπὸν αὐτοῦ
  choice: trái của vườn ấy
  rationale: καρπός là trái hoặc hoa lợi do vườn nho sinh ra; cách dịch này vừa sát nghĩa vừa rõ sở thuộc.
- source_word: ποιμαίνει ποίμνην
  choice: chăn một bầy
  rationale: Giữ hình ảnh chăm nom đàn vật nuôi mà không tự ý xác định đó là bầy chiên, vì ποίμνην ở đây chỉ nói “bầy/đàn”.
- source_word: ἐκ τοῦ γάλακτος τῆς ποίμνης
  choice: sữa từ bầy ấy
  rationale: Giữ quan hệ nguồn gốc/phân lượng của ἐκ và không bổ sung một loài vật mà bản văn không nêu.
- source_word: ἐσθίει
  choice: ăn / uống
  rationale: Động từ nguyên ngữ là “ăn” trong cả hai câu; tiếng Việt tự nhiên dùng “uống” với sữa, nên điều chỉnh theo ngữ cảnh và ghi rõ nghĩa đen trong chú thích.
theological_decisions:
- issue: Các ví dụ tu từ ở dạng số ít giống đực
  choice: Dùng “ai” và “mình”, không thêm đại từ mang giới tính
  alternative: Dùng “người nào... chính người ấy” hoặc một đại từ nam giới
  rationale: Tiếng Việt tự nhiên có thể giữ đầy đủ tính chất đại diện, số ít của τίς và ἰδίοις mà không cần chỉ rõ giới tính; điều này không làm thay đổi phạm vi chung của các ví dụ.
- issue: Loài vật trong ποίμνην
  choice: Dịch khái quát là “một bầy”
  alternative: “một bầy chiên”
  rationale: Nguyên ngữ không nêu danh từ “chiên”; việc giữ cách gọi khái quát tránh thêm chi tiết và bảo toàn hình ảnh một bầy vật nuôi cho sữa.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Ba câu hỏi tu từ được giữ song song; “Có ai từng...”, “Có ai...”, “Hay có ai...” tái hiện nhịp lập luận. Không xác định ποίμνη là bầy chiên khi nguyên ngữ chỉ nói một bầy.
