  text: ⸀πάντα δὲ ποιῶ διὰ τὸ εὐαγγέλιον, ἵνα συγκοινωνὸς αὐτοῦ γένωμαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/023.yaml
  text: But I do all things for the sake of the good news[b][a], so that I may become a fellow participant in it.
translation:
  language: vi
  text: Nhưng tôi làm mọi điều vì Tin Mừng, để tôi trở nên người cùng dự phần trong Tin Mừng ấy.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “để tôi cũng được dự phần trong Tin Mừng ấy” hoặc “để tôi trở thành người cùng chia sẻ Tin Mừng ấy.”'
    reason: alternative_reading
lexical_decisions:
- source_word: πάντα
  choice: mọi điều
  rationale: Cụm từ bao quát toàn bộ những cách Phao-lô tự nguyện thích nghi trong ngữ cảnh; “mọi điều” tự nhiên và trang trọng trong tiếng Việt.
- source_word: δὲ
  choice: Nhưng
  rationale: Thể hiện sắc thái chuyển ý có phần tương phản với phần trình bày trước đó.
- source_word: ποιῶ
  choice: tôi làm
  rationale: Thì hiện tại diễn tả hành động thường xuyên; cách nói này ngắn gọn và tự nhiên.
- source_word: διὰ τὸ εὐαγγέλιον
  choice: vì Tin Mừng
  rationale: διά với đối cách ở đây chỉ lý do hoặc mục đích hướng đến; “vì” giữ được độ rộng ấy. “Tin Mừng” là cách gọi quen thuộc, rõ nghĩa trong tiếng Việt hiện đại.
- source_word: ἵνα
  choice: để
  rationale: Diễn đạt tự nhiên mệnh đề mục đích trong tiếng Việt.
- source_word: συγκοινωνὸς
  choice: cũng được dự phần
  rationale: Diễn đạt việc cùng chia sẻ hoặc cùng tham dự với những người khác; “cũng” truyền đạt yếu tố đồng tham dự của tiền tố συν- mà không làm câu nặng nề.
- source_word: αὐτοῦ
  choice: trong Tin Mừng ấy
  rationale: Đại từ quy chiếu tự nhiên nhất về εὐαγγέλιον; lặp lại danh từ giúp tiếng Việt rõ nghĩa hơn đại từ “nó”.
- source_word: γένωμαι
  choice: được dự phần
  rationale: Động từ γίνομαι ở thể giả định sau ἵνα có nghĩa đạt đến hoặc trở nên ở trong tình trạng ấy. Tiếng Việt tự nhiên gộp ý này với “dự phần”; “được” không nhằm khẳng định thể bị động mà diễn tả việc đi đến chỗ có phần.
theological_decisions:
- issue: Phạm vi ý nghĩa của việc dự phần trong Tin Mừng
  choice: Giữ cách nói rộng “dự phần trong Tin Mừng ấy”
  alternative: dự phần các phước lành của Tin Mừng; góp phần truyền bá Tin Mừng; trở thành người đồng công trong chức vụ Tin Mừng
  rationale: συγκοινωνός không tự xác định sự dự phần là hưởng phước lành, tham gia sứ mạng hay đồng công trong chức vụ. Bản dịch không thu hẹp sự căng thẳng thần học này.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Viết hoa “Tin Mừng” theo cách dùng phổ biến trong tiếng Việt Cơ Đốc; câu chính giữ nhịp ngắn gọn. Dấu chú thích được đặt ngay sau cụm từ mà chú thích giải thích.
