- from: Nhưng tôi làm mọi điều vì Tin Mừng, để tôi cũng được dự phần trong Tin Mừng ấy.[a]
  to: Nhưng tôi làm mọi điều vì Tin Mừng, để tôi trở nên người cùng dự phần trong Tin Mừng ấy.[a]
  rationale: Bản sửa giữ nguyên ý nghĩa rộng của câu, đồng thời biểu đạt rõ γένωμαι (“trở nên”) và συγκοινωνός (“người cùng dự phần/cùng chia sẻ”). Chú thích được chỉnh để nêu các cách diễn đạt hợp lệ mà không diễn giải nội dung sự dự phần thành riêng các ích lợi của Tin Mừng.
  reviewer_model: gpt-5.6-terra
