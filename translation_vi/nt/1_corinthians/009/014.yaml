id: 1CO.9.14
reference: 1 Corinthians 9:14
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οὕτως καὶ ὁ κύριος διέταξεν τοῖς τὸ εὐαγγέλιον καταγγέλλουσιν ἐκ τοῦ εὐαγγελίου ζῆν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/014.yaml
  text: In the same way[b][a], the Lord also commanded that those who proclaim the gospel should live from the gospel.
translation:
  language: vi
  text: Cũng vậy, Chúa đã truyền rằng những người rao truyền Tin Lành[a] phải sống nhờ Tin Lành[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “công bố Tin Lành.”
    reason: lexical_alternative
  - marker: b
    text: Hay “kiếm sống nhờ việc rao truyền Tin Lành.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: Cũng vậy
  rationale: Diễn tả sự tương ứng với các ví dụ ngay trước đó, tự nhiên và rõ nghĩa trong tiếng Việt.
- source_word: καὶ
  choice: đã (hàm ý bổ sung trong “Cũng vậy, Chúa…”)
  rationale: Ý bổ sung được chuyển tải tự nhiên qua cấu trúc toàn câu; tránh dùng “cũng” hai lần gây nặng lời.
- source_word: ὁ κύριος
  choice: Chúa
  rationale: Cách gọi trang trọng, quen thuộc; giữ nguyên mức độ xác định của bản Hy Lạp mà không tự ý thêm “Giê-su”.
- source_word: διέταξεν
  choice: đã truyền
  rationale: Thể hiện mệnh lệnh có thẩm quyền, đồng thời tự nhiên và trang trọng hơn “đã ra lệnh” trong văn cảnh này.
- source_word: τοῖς ... καταγγέλλουσιν
  choice: những người rao truyền
  rationale: Chuyển phân từ có mạo từ thành cụm danh từ và giữ sắc thái công bố rộng rãi của καταγγέλλω.
- source_word: τὸ εὐαγγέλιον
  choice: Tin Lành
  rationale: Thuật ngữ Kinh Thánh quen thuộc trong tiếng Việt hiện đại, chỉ tin mừng được công bố.
- source_word: ἐκ τοῦ εὐαγγελίου
  choice: nhờ Tin Lành
  rationale: ἐκ chỉ nguồn cung ứng sinh kế; “nhờ” diễn đạt tự nhiên hơn “từ” trong tiếng Việt mà vẫn giữ cách nói cô đọng của nguyên văn.
- source_word: ζῆν
  choice: phải sống
  rationale: Động từ nguyên mẫu phụ thuộc vào “đã truyền”; “phải” biểu đạt lực chuẩn định của mệnh lệnh.
theological_decisions:
- issue: Đối tượng được gọi là “Chúa”
  choice: Giữ nguyên “Chúa”; trong văn cảnh nhiều khả năng chỉ Chúa Giê-su
  alternative: Hiểu như một cách gọi Đức Chúa Trời nói chung
  rationale: Văn mạch thư và lập luận của Phao-lô nhiều khả năng viện dẫn lời dạy của Chúa Giê-su, nhưng bản dịch không thêm tên riêng mà nguyên văn không có.
- issue: Ý nghĩa của “sống nhờ Tin Lành”
  choice: Chỉ việc nhận sự chu cấp vật chất để sinh sống khi rao truyền Tin Lành
  alternative: Chỉ sự sống thuộc linh đến từ Tin Lành
  rationale: Văn cảnh đang bàn về quyền được hỗ trợ vật chất của người phục vụ; vẫn giữ cách diễn đạt cô đọng để không diễn giải quá mức.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Câu giữ cấu trúc và sức nặng mệnh lệnh của nguyên văn, đồng thời dùng “sống nhờ” để diễn đạt tự nhiên ý nguồn sinh kế.
