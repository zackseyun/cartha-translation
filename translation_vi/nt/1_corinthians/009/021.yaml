id: 1CO.9.21
reference: 1 Corinthians 9:21
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τοῖς ἀνόμοις ὡς ἄνομος, μὴ ὢν ἄνομος ⸀θεοῦ ἀλλ’ ἔννομος ⸀Χριστοῦ, ἵνα ⸀κερδάνω ⸀τοὺς ἀνόμους·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/021.yaml
  text: To those outside the law[b][a], as one outside the law—though not being outside God’s law but under Messiah’s law—so that I might win those outside the law.
translation:
  language: vi
  text: Với những người không ở dưới luật pháp[a], tôi trở nên như người không ở dưới luật pháp—dù tôi không ở ngoài luật pháp của Đức Chúa Trời, nhưng ở dưới luật pháp của Đấng Mê-si[b]—để tôi có thể thu phục những người không ở dưới luật pháp.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “không có luật pháp”; ở đây cụm từ chỉ những người không ở dưới luật Môi-se, chứ không nhất thiết là những người sống vô luật pháp.
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn cũng có thể hiểu là “ở trong luật pháp của Đấng Mê-si.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνόμοις / ἄνομος / ἀνόμους
  choice: những người không ở dưới luật pháp / người không ở dưới luật pháp
  rationale: Trong mạch văn đối lập với những người ở dưới luật pháp (c. 20), từ này chỉ những người không thuộc phạm vi giao ước của luật Môi-se, chứ không nhất thiết là người vô đạo hay phạm pháp. Cách dịch này vừa rõ nghĩa vừa giữ được sự lặp lại của nguyên văn.
- source_word: ὡς
  choice: như
  rationale: Diễn tả cách Phao-lô thích nghi với nhóm người này, chứ không khẳng định ông tuyệt đối trở thành người không có luật pháp.
- source_word: μὴ ὢν
  choice: dù tôi không
  rationale: Phân từ mang sắc thái nhượng bộ, dùng để giới hạn và làm rõ mệnh đề đứng trước.
- source_word: ἄνομος θεοῦ
  choice: ở ngoài luật pháp của Đức Chúa Trời
  rationale: Cách nói tự nhiên bằng tiếng Việt, giữ quan hệ sở hữu và sự đối lập không ở dưới/ở ngoài với việc ở dưới luật pháp của Đấng Mê-si.
- source_word: ἔννομος Χριστοῦ
  choice: ở dưới luật pháp của Đấng Mê-si
  rationale: ἔννομος diễn tả việc ở trong phạm vi hoặc chịu sự ràng buộc của luật; Χριστοῦ mang chức danh nên được dịch là Đấng Mê-si.
- source_word: ἵνα
  choice: để
  rationale: Giới thiệu mục đích một cách tự nhiên và chính xác trong tiếng Việt.
- source_word: κερδάνω
  choice: tôi có thể chinh phục
  rationale: Trong ngữ cảnh truyền giáo, động từ mang nghĩa thu phục hay chinh phục người khác, không phải đạt lợi ích tài chính; cách dịch này cũng giữ sắc thái khả năng của thức giả định.
theological_decisions:
- issue: Ý nghĩa của ἄνομος trong mạch văn
  choice: Những người không ở dưới luật Môi-se, chủ yếu là dân ngoại
  alternative: Những người vô luật pháp theo nghĩa gian ác hoặc nổi loạn
  rationale: Mạch văn 1 Cô-rinh-tô 9:20–21 đối chiếu những người ở dưới luật pháp với những người không ở dưới luật pháp. Lời giải thích tiếp theo của Phao-lô cho thấy vấn đề là vị trí trong quan hệ với luật, không phải sự vô luân.
- issue: Ý nghĩa của ἔννομος Χριστοῦ
  choice: Phao-lô ở dưới luật pháp của Đấng Mê-si
  alternative: Phao-lô ở trong luật pháp đối với Đấng Mê-si
  rationale: Cụm từ khẳng định Phao-lô vẫn chịu sự ràng buộc đạo đức trong quan hệ với Đấng Mê-si, nhưng không tự động đồng nhất điều ấy với việc ở dưới luật Môi-se.
- issue: Cách dịch Χριστοῦ
  choice: của Đấng Mê-si
  alternative: của Đấng Christ
  rationale: Tại đây Χριστός có chức năng danh hiệu trong cụm nói về luật pháp thuộc về Đấng được xức dầu; “Đấng Mê-si” làm rõ chức danh ấy.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ cấu trúc đối lập cùng sự lặp lại có chủ ý của nguyên văn; dùng “Đấng Mê-si” như một danh hiệu.
