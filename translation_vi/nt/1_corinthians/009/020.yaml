id: 1CO.9.20
reference: 1 Corinthians 9:20
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἐγενόμην τοῖς Ἰουδαίοις ὡς Ἰουδαῖος, ἵνα Ἰουδαίους κερδήσω· τοῖς ὑπὸ νόμον ὡς ὑπὸ νόμον, ⸂μὴ ὢν αὐτὸς ὑπὸ νόμον⸃, ἵνα τοὺς ὑπὸ νόμον κερδήσω·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/020.yaml
  text: And to the Jews I became as a Jew[a], so that I might win Jews; to those under the law[b], as under the law—though I myself am not under the law—so that I might win those under the law.
translation:
  language: vi
  text: Đối với người Do Thái, tôi đã trở nên như một người Do Thái, để thu phục người Do Thái[a]; đối với những người ở dưới luật pháp[b], tôi đã trở nên như người ở dưới luật pháp—dù chính tôi không ở dưới luật pháp—để thu phục những người ở dưới luật pháp.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “được” hoặc “chinh phục”; động từ này có thể mang nghĩa thu được, và trong ngữ cảnh này là thu phục người khác.
    reason: lexical_alternative
  - marker: b
    text: “Luật pháp” ở đây rất có thể chỉ Luật pháp Môi-se.
    reason: cultural_note
lexical_decisions:
- source_word: ἐγενόμην
  choice: tôi đã trở nên
  rationale: Động từ aorist của γίνομαι diễn tả việc Phao-lô thích ứng cách cư xử hay vị thế của mình đối với từng nhóm. “Đã trở nên” vừa gần nguyên văn vừa tự nhiên trong tiếng Việt.
- source_word: τοῖς Ἰουδαίοις ... ὡς Ἰουδαῖος
  choice: Đối với người Do Thái ... như một người Do Thái
  rationale: Cách dịch này giữ quan hệ hướng đến nhóm người và sắc thái so sánh của ὡς, không hàm ý Phao-lô thôi là người Do Thái về phương diện dân tộc.
- source_word: ἵνα ... κερδήσω
  choice: để chinh phục
  rationale: κερδαίνω có nghĩa đen là “thu được” và trong ngữ cảnh truyền giáo mang nghĩa thu phục hay chinh phục con người. “Chinh phục” diễn đạt rõ mục tiêu khiến họ được thuyết phục, còn chú thích bảo lưu nghĩa từ vựng khác.
- source_word: τοῖς ὑπὸ νόμον
  choice: đối với những người ở dưới luật pháp
  rationale: Cụm giới từ có mạo từ được dùng như danh từ chỉ một nhóm người. “Ở dưới luật pháp” giữ nguyên hình ảnh về sự lệ thuộc hoặc chịu quyền chi phối.
- source_word: ὡς ὑπὸ νόμον
  choice: như người ở dưới luật pháp
  rationale: Cách diễn đạt này tự nhiên hơn trong tiếng Việt nhưng vẫn song song với “như một người Do Thái” và không khẳng định Phao-lô thật sự chịu luật pháp.
- source_word: μὴ ὢν αὐτὸς ὑπὸ νόμον
  choice: dù chính tôi không ở dưới luật pháp
  rationale: Phân từ hiện tại với μή là lời chen vào nêu điều kiện tương phản đồng thời. “Dù” thể hiện rõ sự nhượng bộ, còn thì hiện tại tiếng Việt giữ đây là địa vị của Phao-lô chứ không chỉ là hoàn cảnh quá khứ.
- source_word: αὐτὸς
  choice: chính tôi
  rationale: Giữ sự nhấn mạnh của αὐτός vào bản thân Phao-lô.
- source_word: νόμος
  choice: luật pháp
  rationale: Trong bối cảnh nói đến người Do Thái, từ này nhiều khả năng chỉ Luật pháp Môi-se. Bản văn chính vẫn dùng cụm rộng hơn “luật pháp” để không diễn giải quá mức.
theological_decisions:
- issue: Ý nghĩa lời Phao-lô nói chính ông “không ở dưới luật pháp”
  choice: Dịch trực tiếp là “dù chính tôi không ở dưới luật pháp”, không thêm lời hạn định.
  alternative: “Dù chính tôi không ở dưới Luật pháp Môi-se” hoặc bổ sung ý từ câu 21 rằng ông ở dưới luật của Đấng Christ.
  rationale: Tiếng Hy Lạp trong câu này chỉ nói Phao-lô không ở dưới luật pháp. Không nên thu hẹp nghĩa hay dung hòa câu này bằng cách đưa nội dung của câu kế tiếp vào, nhờ đó giữ nguyên sự tương phản và căng thẳng thần học của bản văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ cấu trúc lặp có chủ ý của câu Hy Lạp; dùng dấu gạch ngang cho lời giải thích chen vào. Mọi ký hiệu chú thích đều được đặt trong bản văn chính.
