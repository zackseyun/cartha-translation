id: 1CO.9.11
reference: 1 Corinthians 9:11
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἰ ἡμεῖς ὑμῖν τὰ πνευματικὰ ἐσπείραμεν, μέγα εἰ ἡμεῖς ὑμῶν τὰ σαρκικὰ θερίσομεν;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/011.yaml
  text: If we have sown spiritual things among you[a], is it too much if we reap material things from you?
translation:
  language: vi
  text: Nếu chúng tôi đã gieo cho anh em những điều thuộc linh, thì có gì là quá đáng nếu chúng tôi gặt từ anh em những điều vật chất[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “những điều thuộc đời sống thân thể.” Tiếng Hy Lạp đối lập “những điều thuộc linh” với những điều thuộc đời sống thân thể hoặc vật chất thông thường.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ πνευματικὰ
  choice: những điều thuộc linh
  rationale: Tính từ trung tính số nhiều được dùng như danh từ, chỉ rộng rãi những lợi ích hay sự phục vụ thuộc lĩnh vực tâm linh; cách dịch này giữ độ rộng của nguyên ngữ và sự đối lập trong câu.
- source_word: ἐσπείραμεν
  choice: đã gieo
  rationale: Thì aorist nói đến công việc phục vụ đã được thực hiện trước đó; “đã gieo” tự nhiên trong tiếng Việt và giữ nguyên ẩn dụ nông nghiệp.
- source_word: μέγα
  choice: có gì là quá đáng
  rationale: Trong câu hỏi tu từ, từ này hỏi liệu việc ấy có lớn lao hoặc quá mức hợp lý hay không; cách diễn đạt này truyền đạt đúng lực tu từ trong tiếng Việt hiện đại.
- source_word: τὰ σαρκικὰ
  choice: những điều vật chất
  rationale: Trong ngữ cảnh, từ này chỉ sự chu cấp thuộc đời sống thân thể, vật chất hay tạm thời, đối lập với “những điều thuộc linh”; không mang nghĩa hành vi xác thịt tội lỗi.
- source_word: θερίσομεν
  choice: gặt
  rationale: Động từ thì tương lai tiếp nối hình ảnh gieo và gặt. Trong cấu trúc “nếu... thì...” của tiếng Việt, “gặt” diễn đạt tự nhiên mà không cần thêm “sẽ”.
- source_word: ὑμῶν
  choice: từ anh em
  rationale: Sở hữu cách sau động từ “gặt” được diễn đạt tự nhiên như nguồn mà sự chu cấp đến từ đó.
- source_word: ἡμεῖς
  choice: chúng tôi
  rationale: Đại từ được nêu rõ trong tiếng Hy Lạp để nhấn mạnh những người làm công tác phục vụ; “chúng tôi” phù hợp với lời Phao-lô nói với cộng đồng Cô-rinh-tô.
theological_decisions:
- issue: Ý nghĩa của σαρκικὰ khi đối lập với πνευματικὰ
  choice: Chỉ sự chu cấp vật chất hoặc thuộc đời sống thân thể dành cho người phục vụ.
  alternative: Những điều xác thịt theo nghĩa đạo đức tiêu cực.
  rationale: Mạch văn biện hộ cho quyền được nhận sự chu cấp của các sứ đồ. Sự đối lập ở đây là giữa công tác phục vụ thuộc linh và sự hỗ trợ vật chất, chứ không phải giữa thánh khiết và tội lỗi.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ nguyên câu hỏi tu từ cùng ẩn dụ gieo–gặt; dùng “anh em” theo lối xưng hô cộng đồng trong thư tín, không giới hạn về giới tính.
