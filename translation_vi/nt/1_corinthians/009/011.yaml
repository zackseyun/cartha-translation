revisions:
- from: Nếu chúng tôi đã gieo những điều thuộc linh giữa anh em, thì có gì là quá đáng nếu chúng tôi gặt từ anh em những điều vật chất[a]?
  to: Nếu chúng tôi đã gieo cho anh em những điều thuộc linh, thì có gì là quá đáng nếu chúng tôi gặt từ anh em những điều vật chất[a]?
  rationale: Chỉ điều chỉnh giới từ để phản ánh sát hơn quan hệ ὑμῖν trong nguyên ngữ, đồng thời giữ nguyên ý nghĩa, phép ẩn dụ, lực của câu hỏi tu từ và chú thích từ vựng.
