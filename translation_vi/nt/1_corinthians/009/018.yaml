revisions:
- from: Vậy phần thưởng của tôi là gì? Ấy là khi rao giảng Tin Mừng[a], tôi rao truyền Tin Mừng mà không lấy tiền, để không tận dụng hết quyền của mình trong việc rao giảng Tin Mừng.[b]
  to: 'Vậy, phần thưởng của tôi là gì? Đó là: khi rao giảng Tin Mừng[a], tôi rao truyền Tin Mừng mà không lấy tiền, để không sử dụng trọn vẹn quyền của mình trong công việc Tin Mừng.[b]'
  rationale: Bản sửa thay một cách nói có thể gợi sắc thái bất lợi (“tận dụng”) bằng “sử dụng trọn vẹn,” phù hợp hơn với quyền chính đáng mà Phao-lô tự nguyện không thực hiện đầy đủ. “Trong công việc Tin Mừng” làm rõ cách hiểu ngữ cảnh của ἐν τῷ εὐαγγελίῳ, đồng thời chú thích bảo lưu cách dịch ngắn gọn và mơ hồ hơn của cụm Hy Lạp. Các lựa chọn còn lại được giữ vì trung thành với nguyên văn và tự nhiên trong tiếng Việt hiện đại.
  reviewer_model: gpt-5.6-terra
