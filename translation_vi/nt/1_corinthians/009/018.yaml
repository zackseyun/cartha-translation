source:
  edition: SBLGNT
  text: τίς οὖν ⸀μού ἐστιν ὁ μισθός; ἵνα εὐαγγελιζόμενος ἀδάπανον θήσω τὸ ⸀εὐαγγέλιον, εἰς τὸ μὴ καταχρήσασθαι τῇ ἐξουσίᾳ μου ἐν τῷ εὐαγγελίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/018.yaml
  text: What then is my reward? That in preaching the good news I may present the good news free of charge[b][a], so as not to make full use of my right in the good news.
translation:
  language: vi
  text: 'Vậy, phần thưởng của tôi là gì? Đó là: khi rao giảng Tin Mừng[a], tôi rao truyền Tin Mừng mà không lấy tiền, để không sử dụng trọn vẹn quyền của mình trong công việc Tin Mừng.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “Phúc Âm”; tương tự ở những chỗ còn lại trong câu này.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “quyền của mình trong Tin Mừng.”'
    reason: source_ambiguity
lexical_decisions:
- source_word: μισθός
  choice: phần thưởng
  rationale: 'Trong câu hỏi tu từ này, từ này chỉ điều Phao-lô nhận được từ chức vụ, không chỉ riêng tiền công. “Phần thưởng” giữ được nét nghịch lý: phần thưởng của ông là được rao truyền mà không lấy tiền.'
- source_word: εὐαγγελιζόμενος
  choice: khi rao giảng Tin Mừng
  rationale: Phân từ diễn tả hành động đồng thời với động từ chính. Cách dịch này tự nhiên trong tiếng Việt và giữ rõ nghĩa hành động.
- source_word: ἀδάπανον
  choice: mà không lấy tiền
  rationale: Tính từ có nghĩa là không gây phí tổn hoặc miễn phí. Trong ngữ cảnh quyền được chu cấp của Phao-lô, “không lấy tiền” diễn đạt rõ rằng ông không đòi người nghe trả phí.
- source_word: θήσω τὸ εὐαγγέλιον
  choice: rao truyền Tin Mừng
  rationale: Nghĩa đen là “đặt/để Tin Mừng”, nhưng trong ngữ cảnh mang nghĩa đưa ra hoặc trình bày Tin Mừng. “Rao truyền” là tiếng Việt tự nhiên và phù hợp với hoạt động được nói đến.
- source_word: εὐαγγέλιον
  choice: Tin Mừng
  rationale: Danh từ có nghĩa là tin vui hoặc tin mừng. “Tin Mừng” vừa rõ nghĩa đối với độc giả hiện đại vừa có sắc thái trang trọng; chú thích giữ phương án truyền thống khác.
- source_word: καταχρήσασθαι
  choice: tận dụng hết
  rationale: Động từ có thể chỉ việc dùng trọn vẹn hoặc sử dụng hết mức, đôi khi mang sắc thái tiêu cực. Ở đây Phao-lô tự nguyện không thực thi đầy đủ một quyền chính đáng, nên cách dịch này không hàm ý ông lạm quyền.
- source_word: ἐξουσίᾳ
  choice: quyền
  rationale: Trong toàn chương, từ này chỉ quyền chính đáng của sứ đồ, đặc biệt là quyền được chu cấp vật chất. “Quyền” chính xác hơn “thẩm quyền” trong mạch văn này.
- source_word: ἐν τῷ εὐαγγελίῳ
  choice: trong việc rao giảng Tin Mừng
  rationale: Cụm Hy Lạp có thể hiểu là “trong/liên quan đến Tin Mừng”, tức trong công việc phục vụ Tin Mừng. Bản dịch làm rõ quan hệ này bằng tiếng Việt tự nhiên, còn chú thích bảo lưu cách diễn đạt sát mặt chữ hơn.
theological_decisions:
- issue: Bản chất của ἐξουσία trong ngữ cảnh
  choice: Quyền chính đáng được nhận sự chu cấp trong việc rao giảng Tin Mừng, là quyền Phao-lô tự nguyện không tận dụng hết.
  alternative: Thẩm quyền sứ đồ nói chung, hoặc việc lạm dụng quyền lực.
  rationale: Mạch văn 1 Cô-rinh-tô 9 nhiều lần bàn đến quyền được chu cấp của người phục vụ. Vì vậy, bản dịch dùng “quyền” và “tận dụng hết”, không dùng từ ngữ hàm ý quyền ấy bất chính hay bị lạm dụng.
- issue: Cách hiểu ἐν τῷ εὐαγγελίῳ
  choice: Trong việc rao giảng Tin Mừng.
  alternative: 'Sát mặt chữ: trong Tin Mừng.'
  rationale: Giới từ ἐν để ngỏ một quan hệ khá rộng, nhưng trong ngữ cảnh có thể chỉ hoạt động phục vụ hoặc rao giảng Tin Mừng. Chú thích giữ lại hình thức ngắn gọn và phần nào mơ hồ của nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “không lấy tiền” thay cho “miễn phí” để hợp với lời nói về quyền được chu cấp và tránh sắc thái thương mại quá mạnh. Sự lặp lại “Tin Mừng” phản ánh phép lặp của nguyên văn.
