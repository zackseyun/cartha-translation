id: 1CO.9.15
reference: 1 Corinthians 9:15
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἐγὼ δὲ ⸂οὐ κέχρημαι οὐδενὶ⸃ τούτων. οὐκ ἔγραψα δὲ ταῦτα ἵνα οὕτως γένηται ἐν ἐμοί, καλὸν γάρ μοι μᾶλλον ἀποθανεῖν ἤ— τὸ καύχημά μου ⸂οὐδεὶς κενώσει⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/015.yaml
  text: But I have made use of none of these things[a]. Yet I did not write these things so that it should be done this way for me[b], for I would rather die than—no one will nullify my boasting.
translation:
  language: vi
  text: Nhưng tôi chưa hề sử dụng điều nào trong số ấy[a]. Tuy vậy, tôi viết những lời này không phải để điều ấy xảy ra như vậy đối với tôi, vì tôi thà chết còn hơn—không ai sẽ làm cho niềm tự hào của tôi trở nên vô nghĩa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch rõ hơn theo ngữ cảnh: “Tôi chưa hề sử dụng quyền nào trong số ấy.”'
    reason: lexical_alternative
  - marker: b
    text: 'Câu Hy Lạp bị ngắt sau từ “hơn—”, rồi tiếp tục: “niềm tự hào của tôi, không ai sẽ làm cho trở nên vô nghĩa.” Nhiều bản dịch làm câu trôi chảy hơn: “thà chết còn hơn để bất cứ ai làm cho niềm tự hào của tôi trở nên vô nghĩa.”'
    reason: alternative_reading
lexical_decisions:
- source_word: κέχρημαι
  choice: chưa hề sử dụng
  rationale: Thì hoàn thành diễn tả việc Phao-lô cho đến nay không dùng đến những điều ông vừa nêu; “chưa hề sử dụng” tự nhiên trong tiếng Việt và không hàm ý lạm dụng.
- source_word: οὐδενὶ τούτων
  choice: điều nào trong số ấy
  rationale: Giữ cách nói khái quát của nguyên văn, đồng thời để ngữ cảnh trước đó xác định đây là các quyền liên quan đến sự chu cấp.
- source_word: ἵνα οὕτως γένηται ἐν ἐμοί
  choice: để người ta làm như vậy cho tôi
  rationale: 'Diễn đạt tự nhiên mục đích mà Phao-lô phủ nhận: ông không viết để được đối xử theo cách vừa trình bày.'
- source_word: καλὸν γάρ μοι μᾶλλον ἀποθανεῖν
  choice: vì tôi thà chết còn hơn
  rationale: Cách nói “thà… còn hơn” chuyển tải tự nhiên sự lựa chọn đầy nhấn mạnh trong câu Hy Lạp.
- source_word: τὸ καύχημά μου
  choice: niềm tự hào của tôi
  rationale: καύχημα ở đây có thể chỉ điều hoặc cơ sở khiến Phao-lô tự hào, tức việc rao giảng mà không nhận thù lao; “niềm tự hào” giữ được độ rộng nghĩa mà không thêm lời giải thích vào chính văn.
- source_word: κενώσει
  choice: làm cho … trở nên vô nghĩa
  rationale: Chuyển tải nghĩa ẩn dụ “làm rỗng, làm mất hiệu lực” bằng lối diễn đạt rõ và tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Cú pháp bị ngắt đột ngột sau ἤ (“hơn—”)
  choice: Giữ dấu gạch ngang và để câu chuyển đột ngột sang “không ai sẽ…”
  alternative: “vì tôi thà chết còn hơn để bất cứ ai làm cho niềm tự hào của tôi trở nên vô nghĩa”
  rationale: Nguyên văn bỏ dở vế so sánh rồi chuyển sang một lời khẳng định mạnh. Giữ sự đứt đoạn bảo toàn cường độ tu từ và không tự ý bổ sung phần bị lược.
- issue: Ý nghĩa của καύχημα
  choice: niềm tự hào của tôi
  alternative: lý do để tôi tự hào
  rationale: Từ Hy Lạp có thể nói đến chính niềm tự hào hoặc cơ sở của nó. Bản dịch chính giữ độ hàm súc, không quyết định quá mức giữa hai sắc thái.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu đầu dùng “trong số ấy” để tránh nặng nề; câu sau giữ nguyên sự ngắt quãng đầy cảm xúc của nguyên văn thay vì làm phẳng cú pháp.
