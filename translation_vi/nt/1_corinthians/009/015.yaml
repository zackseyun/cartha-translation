revisions:
- from: Nhưng tôi chưa hề sử dụng điều nào trong số ấy[a]. Tôi viết những lời này không phải để người ta làm như vậy cho tôi, vì tôi thà chết còn hơn—không ai sẽ làm cho niềm tự hào của tôi trở nên vô nghĩa.[b]
  to: Nhưng tôi chưa hề sử dụng điều nào trong số ấy[a]. Tuy vậy, tôi viết những lời này không phải để điều ấy xảy ra như vậy đối với tôi, vì tôi thà chết còn hơn—không ai sẽ làm cho niềm tự hào của tôi trở nên vô nghĩa.[b]
  rationale: Thay “để người ta làm như vậy cho tôi” bằng “để điều ấy xảy ra như vậy đối với tôi” để không thêm tác nhân vào mệnh đề Hy Lạp nén ý. Thay “Tôi” bằng “Tuy vậy, tôi” ở đầu câu hai để phản ánh chuyển ý δέ và tạo mạch văn tự nhiên. Giữ nguyên dấu gạch ngang và chú thích, vì sự bỏ dở cú pháp sau ἤ là đặc điểm quan trọng của nguyên văn.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T18:11:45Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch giữ đúng ý chính: Phao-lô không sử dụng các điều/quyền vừa nói, không viết nhằm nhận chúng, và giữ cú pháp đứt đoạn sau ἤ. Tuy nhiên, “để người ta làm như vậy cho tôi” thêm chủ thể “người ta” không có trong nguyên văn và diễn giải γένηται ἐν ἐμοί quá cụ thể. Cách nói trung tính “để điều ấy xảy ra như vậy đối với tôi” sát hơn với cấu trúc Hy Lạp mà vẫn tự nhiên.'
