  terminology: “Chưa hề sử dụng,” “điều nào trong số ấy,” và “làm cho ... trở nên vô nghĩa” chuyển tải thỏa đáng κέχρημαι, οὐδενὶ τούτων, và κενώσει. “Niềm tự hào của tôi” giữ được độ mở của καύχημα, không áp đặt cách hiểu hẹp là chỉ hành vi hay chỉ cơ sở tự hào.
