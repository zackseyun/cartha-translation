id: 1CO.10.20
reference: 1 Corinthians 10:20
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀλλ’ ὅτι ἃ ⸀θύουσιν, δαιμονίοις ⸂καὶ οὐ θεῷ θύουσιν⸃, οὐ θέλω δὲ ὑμᾶς κοινωνοὺς τῶν δαιμονίων γίνεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/020.yaml
  text: No[a], but what they sacrifice, they sacrifice to demons and not to God, and I do not want you to become sharers with demons.
translation:
  language: vi
  text: Không, nhưng những gì họ dâng làm sinh tế thì họ dâng cho các quỷ, chứ không phải cho Đức Chúa Trời; và tôi không muốn anh chị em trở thành những người dự phần với các quỷ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “những người thông phần với các quỷ” hoặc “những người cùng chia phần với các quỷ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’ ὅτι
  choice: Không, nhưng
  rationale: Trong mạch văn, cụm từ này đính chính một cách hiểu sai có thể nảy sinh từ câu trước; cách dịch này giữ được sắc thái bác bỏ rồi đối lập.
- source_word: ἃ θύουσιν
  choice: những gì họ dâng làm sinh tế
  rationale: Đại từ quan hệ trung tính chỉ chung các lễ vật được dâng; cách diễn đạt này tự nhiên trong tiếng Việt và giữ rõ bối cảnh tế lễ.
- source_word: δαιμονίοις
  choice: cho các quỷ
  rationale: Trong cách dùng của Tân Ước, δαιμόνιον chỉ các hữu thể ma quỷ, không phải những tiểu thần trung tính.
- source_word: καὶ οὐ θεῷ
  choice: chứ không phải cho Đức Chúa Trời
  rationale: Cụm từ tạo sự tương phản trực tiếp giữa các quỷ và Đức Chúa Trời; “chứ không phải” chuyển tải rõ lực tương phản.
- source_word: οὐ θέλω δὲ
  choice: và tôi không muốn
  rationale: δέ ở đây nhẹ nhàng chuyển sang hệ quả mục vụ; “và” phù hợp với dòng lập luận tự nhiên trong tiếng Việt.
- source_word: κοινωνοὺς
  choice: những người dự phần
  rationale: Cách dịch này giữ ý nghĩa tham dự và có phần chung, đồng thời liên kết tự nhiên với lập luận về sự dự phần ở các câu 16–18.
- source_word: τῶν δαιμονίων
  choice: với các quỷ
  rationale: Sau κοινωνούς, sở hữu cách diễn tả đối tượng cùng tham dự hay liên kết; “với” là cách thể hiện tự nhiên trong tiếng Việt.
- source_word: γίνεσθαι
  choice: trở thành
  rationale: Động từ nhấn mạnh việc đi vào một tình trạng, chứ không chỉ đơn thuần đang ở trong tình trạng ấy.
theological_decisions:
- issue: Bản chất của việc tế lễ ngoại giáo
  choice: Các sinh tế ấy được dâng cho các quỷ, không phải cho Đức Chúa Trời.
  alternative: Chỉ mô tả ý nghĩa xã hội của tiệc cúng thần tượng, hoặc dùng “quỷ” theo nghĩa thuần ẩn dụ.
  rationale: Lời đối chiếu minh nhiên trong nguyên văn phải được giữ nguyên, không làm nhẹ đi cũng không thêm suy đoán vượt quá câu.
- issue: Sắc thái của κοινωνοὺς τῶν δαιμονίων
  choice: Sự dự phần thực sự với các quỷ.
  alternative: Chỉ giao thiệp xã hội với người thờ thần tượng, hoặc hoàn toàn quy phục các quỷ trong việc thờ phượng.
  rationale: Mạch văn nói về sự dự phần có thật, nhưng câu không đồng nhất điều đó với sự quy phục hoàn toàn; “dự phần với” giữ được sức nặng và giới hạn của lời văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” cho đại từ số nhiều ὑμᾶς; “Đức Chúa Trời” làm danh xưng chỉ Đức Chúa Trời duy nhất; “dâng làm sinh tế” giữ rõ sắc thái nghi lễ của θύω.
