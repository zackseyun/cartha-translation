  terminology: «Dâng làm sinh tế» diễn đạt đúng ngữ cảnh nghi lễ của θύω. «Các quỷ» phản ánh δαιμόνια trong cách dùng Tân Ước. «Dự phần với» truyền đạt phù hợp ý tham dự/liên đới của κοινωνούς τῶν δαιμονίων mà không cường điệu thành sự quy phục hoàn toàn. «Đức Chúa Trời» thích hợp cho θεῷ trong thế đối lập với các quỷ.
