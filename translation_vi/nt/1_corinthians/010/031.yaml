  terminology: “Đức Chúa Trời” và “vinh quang của Đức Chúa Trời” là thuật ngữ quen thuộc, trang trọng, và nhất quán với ngữ vực Kinh Thánh tiếng Việt. “Mọi sự” giữ được tính toàn diện của πάντα.
