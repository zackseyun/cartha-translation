id: 1CO.10.31
reference: 1 Corinthians 10:31
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Εἴτε οὖν ἐσθίετε εἴτε πίνετε εἴτε τι ποιεῖτε, πάντα εἰς δόξαν θεοῦ ποιεῖτε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/031.yaml
  text: Therefore, whether you eat or drink, or whatever you do, do everything for the glory of God.
translation:
  language: vi
  text: Vậy, dù anh chị em ăn hay uống, hay làm bất cứ việc gì, hãy làm mọi sự vì vinh quang của Đức Chúa Trời.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἴτε ... εἴτε ... εἴτε
  choice: dù ... hay ... hay
  rationale: Cấu trúc tương liên nêu các trường hợp khác nhau; “dù... hay...” tự nhiên trong tiếng Việt và giữ được nhịp tu từ của câu Hy Lạp.
- source_word: οὖν
  choice: Vậy
  rationale: Từ này đánh dấu kết luận rút ra từ phần bàn luận trước; “Vậy” rõ nghĩa, tự nhiên và phù hợp với lời khuyên ở đây.
- source_word: ἐσθίετε / πίνετε
  choice: anh chị em ăn / uống
  rationale: Hai động từ hiện tại có ý nghĩa khái quát, chỉ những hành động thông thường chứ không nhất thiết đang diễn ra. “Anh chị em” diễn đạt ngôi thứ hai số nhiều theo lối hiện đại, trang trọng và bao quát.
- source_word: τι ποιεῖτε
  choice: làm bất cứ việc gì
  rationale: Đại từ bất định τι trong cấu trúc này mở rộng phạm vi ra ngoài việc ăn uống; cách dịch này truyền đạt tự nhiên tính bao quát.
- source_word: πάντα ... ποιεῖτε
  choice: hãy làm mọi sự
  rationale: πάντα có phạm vi toàn diện, còn ποιεῖτε trong mệnh đề chính mang lực khuyên bảo/mệnh lệnh theo văn cảnh. “Mọi sự” giữ sắc thái trang trọng mà vẫn dễ hiểu.
- source_word: εἰς δόξαν θεοῦ
  choice: vì vinh quang của Đức Chúa Trời
  rationale: εἰς chỉ mục đích hoặc hướng đến kết quả. “Vì vinh quang của Đức Chúa Trời” diễn đạt rõ rằng mọi việc phải hướng tới việc Đức Chúa Trời được tôn vinh, đồng thời giữ quan hệ sở hữu của θεοῦ.
theological_decisions:
- issue: Phạm vi của lời khuyên
  choice: Lời khuyên bao quát mọi hành động thường ngày, phát sinh từ vấn đề cụ thể về ăn uống.
  alternative: Chỉ giới hạn trong các vấn đề ăn và uống.
  rationale: Câu chuyển từ các ví dụ cụ thể “ăn” và “uống” sang “làm bất cứ việc gì” và “mọi sự”, cho thấy nguyên tắc rộng hơn mà không tách nó khỏi văn cảnh trực tiếp.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh chị em” cho ngôi thứ hai số nhiều nhằm bao quát cộng đồng độc giả; giữ cụm “vinh quang của Đức Chúa Trời” vì vừa tự nhiên trong văn phong Kinh Thánh vừa sát cấu trúc nguồn.
