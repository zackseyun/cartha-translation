revisions:
- from: Chúng ta cũng đừng phạm tội gian dâm, như một số người trong họ đã phạm, và trong một ngày có hai mươi ba ngàn người ngã xuống.[a][b]
  to: Chúng ta cũng đừng phạm tội vô luân về tình dục, như một số người trong họ đã phạm tội vô luân về tình dục, và trong một ngày, hai mươi ba ngàn người đã ngã xuống.[a][b]
  rationale: Sửa để phục hồi nội dung và sự lặp lại của động từ Hy Lạp ở cả hai vế, đồng thời dùng thuật ngữ tiếng Việt bao quát hơn cho πορνεύω. Cấu trúc cuối câu được chỉnh để phản ánh trực tiếp hơn chủ ngữ và động từ của nguyên văn. Các dấu chú thích tiếp tục được neo sau “ngã xuống,” đối tượng của chú thích từ vựng, và chú thích đối chiếu con số.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T18:11:58Z'
review_pass:
  verdict: revise
  source_fidelity: Bản nháp giữ đúng cấu trúc khuyên ngăn của μηδέ với thức giả định khuyến dụ, giữ con số “hai mươi ba ngàn” và mốc “trong một ngày,” không điều hòa với Dân Số Ký 25:9. Tuy nhiên, lần xuất hiện thứ hai của ἐπόρνευσαν bị lược thành “đã phạm,” làm mờ sự lặp lại có chủ ý của động từ trong tiếng Hy Lạp và khiến nội dung của hành vi kém rõ. Cụm “và trong một ngày có...” cũng yếu hơn cấu trúc trực tiếp “hai mươi ba ngàn người đã ngã xuống.”
  naturalness: Bản sửa vẫn dùng tiếng Việt tiêu chuẩn hiện đại, trang trọng và rõ nghĩa. “Tội vô luân về tình dục” truyền đạt phạm vi rộng của πορνεία/πορνεύω tốt hơn “gian dâm,” vốn trong cách dùng hiện đại thường dễ gợi riêng ngoại tình. Việc lặp lại đầy đủ tuy trang trọng hơn nhưng tự nhiên trong một lời cảnh cáo có chủ ý nhấn mạnh.
  terminology: Dùng nhất quán “tội vô luân về tình dục” cho cả hai dạng của πορνεύω, không thu hẹp thuật ngữ vào một loại vi phạm cụ thể. Giữ “ngã xuống” cho ἔπεσαν; chú thích giải thích hàm ý chết trong bối cảnh phán xét mà không thay thế cách nói của nguyên ngữ trong chính văn.
  issues:
  - severity: medium
    issue: Lần thứ hai của động từ ἐπόρνευσαν bị lược quá mức.
    rationale: “như một số người trong họ đã phạm” không còn nêu rõ hành vi tình dục vô luân và không bảo toàn sự lặp lại của πορνεύω/ἐπόρνευσαν trong nguyên văn.
  - severity: low
    issue: Cách diễn đạt “trong một ngày có hai mươi ba ngàn người ngã xuống” kém trực tiếp.
    rationale: Nguyên văn đặt “hai mươi ba ngàn” làm chủ ngữ của ἔπεσαν. Đưa chủ ngữ trực tiếp lên sau trạng ngữ thời gian cho câu tiếng Việt rõ và sát hơn.
