id: 1CO.10.8
reference: 1 Corinthians 10:8
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: μηδὲ πορνεύωμεν, καθώς τινες αὐτῶν ἐπόρνευσαν, καὶ ἔπεσαν μιᾷ ἡμέρᾳ εἴκοσι τρεῖς χιλιάδες.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/008.yaml
  text: Nor should we commit sexual immorality[a], as some of them committed sexual immorality[b], and twenty-three thousand fell in one day.
translation:
  language: vi
  text: Chúng ta cũng đừng phạm tội vô luân về tình dục, như một số người trong họ đã phạm tội vô luân về tình dục, và trong một ngày, hai mươi ba ngàn người đã ngã xuống.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “chết” hoặc “bị đánh ngã”; nguyên văn Hy Lạp là “ngã xuống”, một cách nói thường chỉ cái chết dưới sự phán xét.
    reason: lexical_alternative
  - marker: b
    text: Dân Số Ký 25:9 ghi hai mươi bốn ngàn người. Ở đây Phao-lô nói hai mươi ba ngàn người ngã xuống “trong một ngày”; điều này có thể phân biệt số người chết trong ngày ấy với tổng số lớn hơn, nhưng bản dịch giữ nguyên lời của Phao-lô mà không điều hòa hai con số.
    reason: cross_reference
lexical_decisions:
- source_word: μηδὲ πορνεύωμεν
  choice: Chúng ta cũng đừng phạm tội gian dâm
  rationale: Cách diễn đạt khuyên ngăn tự nhiên trong tiếng Việt, đồng thời giữ lực nối tiếp của μηδέ với chuỗi cảnh báo trước đó. “Phạm tội gian dâm” truyền đạt πορνεύω theo nghĩa rộng về hành vi tình dục trái luân lý, không dùng từ cổ.
- source_word: καθώς τινες αὐτῶν ἐπόρνευσαν
  choice: như một số người trong họ đã phạm
  rationale: Giữ phép so sánh và sự lặp lại ý của động từ cùng gốc; lược lại bổ ngữ “tội gian dâm” ở lần thứ hai để câu tiếng Việt tự nhiên mà nghĩa vẫn rõ.
- source_word: ἔπεσαν
  choice: ngã xuống
  rationale: Giữ hình ảnh trực tiếp của πίπτω và không âm thầm thay bằng cách giải nghĩa “chết”; trong ngữ cảnh phán xét, cụm này hàm ý họ đã chết.
- source_word: μιᾷ ἡμέρᾳ
  choice: trong một ngày
  rationale: Diễn đạt tự nhiên giá trị thời gian của cách dữ cách, nhấn mạnh sự việc xảy ra trong phạm vi một ngày.
- source_word: εἴκοσι τρεῖς χιλιάδες
  choice: hai mươi ba ngàn người
  rationale: Dịch trực tiếp con số trong bản Hy Lạp; thêm “người” theo cú pháp tự nhiên của tiếng Việt.
theological_decisions:
- issue: Quan hệ với con số trong Dân Số Ký 25:9
  choice: Giữ “hai mươi ba ngàn” đúng theo 1 Cô-rinh-tô 10:8, không điều hòa trong chính văn.
  alternative: Đổi thành “hai mươi bốn ngàn” theo Dân Số Ký 25:9, hoặc khẳng định một con số là tổng phụ và con số kia là tổng cộng.
  rationale: Bản Hy Lạp tại đây ghi rõ hai mươi ba ngàn. Bản dịch cần bảo toàn lời văn của Phao-lô và để nguyên sự căng thẳng về con số; khả năng giải thích chỉ được nêu thận trọng trong chú thích.
- issue: Phạm vi nghĩa của πορνεύω
  choice: phạm tội gian dâm
  alternative: phạm tội tà dâm; có hành vi vô luân về tình dục
  rationale: “Gian dâm” là cách nói trang trọng, quen thuộc trong văn phong Kinh Thánh tiếng Việt và có thể chỉ sự vô luân tình dục nói chung trong ngữ cảnh này; không thu hẹp câu vào một loại vi phạm cụ thể.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “chúng ta cũng đừng” cho lời khuyên ngăn liên kết với văn mạch; dùng “ngã xuống” để bảo toàn hình ảnh và sự hàm súc của nguyên ngữ. Các dấu chú thích [a], [b] đều xuất hiện trong chính văn.
