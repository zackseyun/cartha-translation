base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/010.yaml
  text: And do not grumble[a], just as some of them grumbled and were destroyed by the destroyer.
translation:
  language: vi
  text: Cũng đừng càu nhàu như một số người trong số họ đã càu nhàu và bị kẻ hủy diệt giết chết.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “bởi thiên sứ hủy diệt.” Tiếng Hy Lạp viết “kẻ hủy diệt”, có thể gợi đến tác nhân thi hành sự phán xét đối với Israel khi họ ở hoang mạc.'
    reason: alternative_reading
lexical_decisions:
- source_word: μηδὲ
  choice: Cũng đừng
  rationale: Nối lời cấm này với chuỗi cảnh báo trước đó, đồng thời diễn đạt tự nhiên trong tiếng Việt.
- source_word: γογγύζετε / ἐγόγγυσαν
  choice: càu nhàu / đã càu nhàu
  rationale: Diễn tả lời than phiền bất mãn trong bối cảnh dân Israel nơi hoang mạc và giữ nhất quán giữa hai dạng động từ.
- source_word: καθάπερ
  choice: như
  rationale: Đánh dấu rõ sự so sánh với gương cảnh báo của Israel mà không làm câu nặng nề.
- source_word: τινὲς αὐτῶν
  choice: một số người trong họ
  rationale: Giữ quan hệ bộ phận của cụm Hy Lạp, chỉ một số người thuộc cộng đồng Israel đã được nhắc đến.
- source_word: ἀπώλοντο
  choice: bị ... tiêu diệt
  rationale: Dạng bị động cùng cụm chỉ tác nhân theo sau được thể hiện rõ hơn bằng cấu trúc này.
- source_word: ὑπὸ τοῦ ὀλοθρευτοῦ
  choice: bị đấng hủy diệt tiêu diệt
  rationale: Giữ danh xưng thực thể hóa trong tiếng Hy Lạp và không tự ý xác định tác nhân ấy là thiên sứ.
theological_decisions:
- issue: Danh tính của ὁ ὀλοθρευτής
  choice: đấng hủy diệt
  alternative: thiên sứ hủy diệt
  rationale: Bản Hy Lạp chỉ gọi tác nhân bằng danh xưng “đấng hủy diệt”, không xác định rõ hơn; bản chính giữ sự mơ hồ ấy, còn cách hiểu cụ thể hơn được nêu trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Càu nhàu” truyền đạt sắc thái bất mãn của động từ Hy Lạp; “đấng hủy diệt” giữ nguyên mức độ xác định của nguyên văn.
