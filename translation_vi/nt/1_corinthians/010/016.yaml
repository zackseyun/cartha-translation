  source_fidelity: 'Bản dịch truyền đạt đúng cấu trúc hai câu hỏi tu từ của οὐχί, sự lặp lại giữa εὐλογία / εὐλογοῦμεν, và ý nghĩa tham dự của κοινωνία. “Đấng Mê-si” giữ được chức năng tước hiệu của Χριστός. Tuy nhiên, phương án chú thích “sự hiệp thông với” có thể làm đổi quan hệ ngữ pháp: κοινωνία ở đây là sự dự phần/tham dự vào huyết và thân thể, không phải đơn thuần hiệp thông ‘với’ huyết hoặc thân thể.'
