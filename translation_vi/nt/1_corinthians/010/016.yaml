  terminology: “Sự dự phần vào” diễn tả tốt κοινωνία mà không áp đặt cách hiểu hệ phái. Giữ “Đấng Mê-si” nhất quán với chính sách dịch Χριστός như một tước hiệu; chú thích nêu “Đấng Christ” là cách gọi truyền thống.
