id: 1CO.10.16
reference: 1 Corinthians 10:16
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τὸ ποτήριον τῆς εὐλογίας ὃ εὐλογοῦμεν, οὐχὶ κοινωνία ⸂ἐστὶν τοῦ αἵματος τοῦ Χριστοῦ⸃; τὸν ἄρτον ὃν κλῶμεν, οὐχὶ κοινωνία τοῦ σώματος τοῦ Χριστοῦ ἐστιν;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/016.yaml
  text: The cup of blessing that we bless—is it not a sharing in the blood of Messiah? The bread that we break—is it not a sharing in the body of Messiah?[a][b]
translation:
  language: vi
  text: Chén phước lành mà chúng ta chúc phước, chẳng phải là sự dự phần vào huyết của Đấng Mê-si sao? Bánh mà chúng ta bẻ, chẳng phải là sự dự phần vào thân thể của Đấng Mê-si sao?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “sự tham dự vào” hoặc “sự thông phần vào.”
    reason: lexical_alternative
  - marker: b
    text: 'Tiếng Hy Lạp là Christou; theo cách gọi truyền thống: “Đấng Christ.”'
    reason: alternative_reading
lexical_decisions:
- source_word: τὸ ποτήριον
  choice: chén
  rationale: “Chén” là cách diễn đạt tự nhiên, trang trọng vừa phải trong tiếng Việt và không đưa thêm sắc thái nghi lễ về sau.
- source_word: τῆς εὐλογίας
  choice: phước lành
  rationale: Giữ nghĩa trực tiếp của εὐλογία và mối liên hệ từ vựng với động từ εὐλογοῦμεν, đồng thời không thu hẹp ý nghĩa thành việc tạ ơn בלבד.
- source_word: ὃ εὐλογοῦμεν
  choice: mà chúng ta chúc phước
  rationale: Bảo toàn sự lặp lại giữa danh từ “phước lành” và động từ “chúc phước”, không giải thích quá mức hành động nghi lễ.
- source_word: οὐχὶ
  choice: chẳng phải ... sao?
  rationale: Thể hiện câu hỏi tu từ mong đợi câu trả lời khẳng định.
- source_word: κοινωνία
  choice: sự dự phần vào
  rationale: Diễn đạt sự tham dự thực sự vào huyết và thân thể, nhưng không định đoạt các tranh luận hệ phái về cách thức hiện diện trong Tiệc Thánh.
- source_word: τοῦ αἵματος
  choice: huyết
  rationale: “Huyết” giữ sắc thái trang trọng, Kinh Thánh và ý nghĩa giao ước, tế lễ của αἷμα trong ngữ cảnh này.
- source_word: τοῦ Χριστοῦ
  choice: của Đấng Mê-si
  rationale: Ở đây Χριστός vẫn mang ý nghĩa tước hiệu, nên dịch là “Đấng Mê-si”; cách gọi truyền thống “Đấng Christ” được ghi ở chú thích.
- source_word: τὸν ἄρτον
  choice: bánh
  rationale: “Bánh” là cách dịch tự nhiên và không xác định quá mức rằng đây là một ổ bánh.
- source_word: ὃν κλῶμεν
  choice: mà chúng ta bẻ
  rationale: Giữ nguyên hành động cụ thể trong bản Hy Lạp mà không thêm diễn giải nghi lễ.
- source_word: τοῦ σώματος
  choice: thân thể
  rationale: Dịch trực tiếp, bảo toàn sức nặng thần học mà không thu hẹp nghĩa theo một lập trường giáo phái.
theological_decisions:
- issue: Cách dịch κοινωνία trong ngữ cảnh Tiệc Thánh
  choice: sự dự phần vào
  alternative: sự thông công với; sự hiệp thông với; cùng chia sẻ trong
  rationale: “Sự dự phần vào” giữ được ý nghĩa tham dự của κοινωνία, không giản lược thành quan hệ xã hội và cũng không áp đặt một lý thuyết riêng về bản chất Tiệc Thánh.
- issue: Cách dịch Χριστός
  choice: Đấng Mê-si
  alternative: Đấng Christ
  rationale: Χριστός ở đây chỉ Đấng Được Xức Dầu và vẫn hoạt động như một tước hiệu; chú thích giữ cách gọi đã quen thuộc trong truyền thống tiếng Việt.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng cấu trúc câu hỏi tu từ “chẳng phải ... sao?” để giữ lực của οὐχί; dùng “chén”, “huyết” và “thân thể” nhằm duy trì sắc thái Kinh Thánh mà không quá cổ.
