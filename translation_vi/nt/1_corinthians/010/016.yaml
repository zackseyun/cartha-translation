revisions:
- from: Chén phước lành mà chúng ta chúc phước, chẳng phải là sự dự phần vào huyết của Đấng Mê-si sao? Bánh mà chúng ta bẻ, chẳng phải là sự dự phần vào thân thể của Đấng Mê-si sao?[a][b]
  to: Chén phước lành mà chúng ta chúc phước, chẳng phải là sự dự phần vào huyết của Đấng Mê-si sao? Bánh mà chúng ta bẻ, chẳng phải là sự dự phần vào thân thể của Đấng Mê-si sao?[a][b]
  rationale: Chỉ sửa chú thích từ vựng để các phương án thay thế cho κοινωνία đều giữ đúng quan hệ “dự phần vào” huyết và thân thể. Nội dung bản dịch chính được giữ nguyên vì sát nguyên văn và tự nhiên trong văn phong Kinh Thánh tiếng Việt hiện đại.
