id: 1CO.10.6
reference: 1 Corinthians 10:6
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ταῦτα δὲ τύποι ἡμῶν ἐγενήθησαν, εἰς τὸ μὴ εἶναι ἡμᾶς ἐπιθυμητὰς κακῶν, καθὼς κἀκεῖνοι ἐπεθύμησαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/006.yaml
  text: These things became examples for us[a], so that we might not be people who desire evil things, just as they also desired them.
translation:
  language: vi
  text: Những điều ấy đã trở thành những bài học cho chúng ta[a], để chúng ta không thèm muốn những điều xấu xa như họ đã từng thèm muốn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “những hình mẫu cho chúng ta” hoặc “những kiểu mẫu cho chúng ta”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταῦτα δὲ
  choice: Những điều ấy
  rationale: Ταῦτα chỉ các sự việc trong hoang mạc vừa được thuật lại. Đại từ “ấy” nối tự nhiên với ngữ cảnh trước; δὲ có chức năng chuyển ý nhẹ nên không cần dịch thành một từ riêng.
- source_word: τύποι ἡμῶν
  choice: những bài học cho chúng ta
  rationale: Trong ngữ cảnh khuyên răn, τύποι chỉ các trường hợp quá khứ có giá trị làm mẫu và cảnh báo. “Những bài học” diễn đạt tự nhiên chức năng giáo huấn, còn các nghĩa sát hơn được giữ trong chú thích.
- source_word: ἐγενήθησαν
  choice: đã trở thành
  rationale: 'Giữ sắc thái của γίνομαι: các sự việc ấy đã trở nên hoặc có chức năng như những bài học cho cộng đồng.'
- source_word: εἰς τὸ μὴ εἶναι ἡμᾶς
  choice: để chúng ta không
  rationale: Kết cấu này diễn tả mục đích hoặc kết quả. Tiếng Việt tự nhiên không cần dịch riêng động từ “là” trong lối nói “những người thèm muốn”.
- source_word: ἐπιθυμητὰς κακῶν
  choice: thèm muốn những điều xấu xa
  rationale: Danh từ ἐπιθυμητάς chỉ người ham muốn, nhưng chuyển thành động từ trong tiếng Việt giúp câu tự nhiên mà vẫn giữ ý. “Thèm muốn” thể hiện ham muốn mạnh, không thu hẹp vào dục vọng tình dục; κακῶν là những điều có tính xấu xa về đạo đức.
- source_word: καθὼς κἀκεῖνοι ἐπεθύμησαν
  choice: như họ đã từng thèm muốn
  rationale: Giữ phép so sánh và sự lặp lại cùng gốc từ chỉ ham muốn. “Họ” chỉ thế hệ Israel trong hoang mạc; “đã từng” diễn đạt hành động quá khứ và làm rõ đối chiếu.
theological_decisions:
- issue: Ý nghĩa của τύποι đối với các biến cố của Israel trong hoang mạc
  choice: Dịch là “những bài học” theo chức năng nêu gương và cảnh báo về đạo đức.
  alternative: “những hình mẫu” hoặc “những kiểu mẫu”
  rationale: Ngữ cảnh trực tiếp nhấn mạnh việc răn dạy cộng đồng, không buộc người đọc vào một hệ thống giải nghĩa hình bóng chuyên biệt. Chú thích vẫn bảo tồn phạm vi nghĩa của từ Hy Lạp.
- issue: Mức độ mạnh và phạm vi của ngôn ngữ ἐπιθυμέω
  choice: Dịch là “thèm muốn”.
  alternative: “ham muốn”, “khao khát” hoặc “dục vọng”
  rationale: “Thèm muốn” truyền đạt sự khao khát sai trái mà không giới hạn ý nghĩa vào phương diện tình dục; đối tượng “những điều xấu xa” giữ rõ tính chất đạo đức của lời cảnh báo.
- issue: Cấu trúc danh từ ἐπιθυμητάς
  choice: Chuyển tự nhiên thành mệnh đề động từ “chúng ta không thèm muốn”.
  alternative: “chúng ta không trở thành những người thèm muốn”
  rationale: Bản thay thế sát hình thức hơn nhưng nặng nề trong tiếng Việt. Cách chọn giữ nguyên nội dung lời cảnh báo mà không giải quyết thêm bất kỳ vấn đề thần học nào.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Câu văn ưu tiên sự tự nhiên, giữ sắc thái cảnh báo và sự lặp lại của trường nghĩa ham muốn; không dùng thuật ngữ thần học chuyên biệt trong chính văn.
