  text: ἀπρόσκοποι ⸂καὶ Ἰουδαίοις γίνεσθε⸃ καὶ Ἕλλησιν καὶ τῇ ἐκκλησίᾳ τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/032.yaml
  text: Give no offense either to Jews or to Greeks or to the church of God[b][a],
translation:
  language: vi
  text: Đừng gây vấp phạm[a] cho người Do Thái, người Hy Lạp[b], hay Hội Thánh của Đức Chúa Trời.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “không làm cớ vấp phạm” hoặc “không đáng chê trách.”'
    reason: lexical_alternative
  - marker: b
    text: “Người Hy Lạp” ở đây có lẽ được dùng rộng để chỉ những người không phải Do Thái trong bối cảnh của Phao-lô; nguyên văn Hy Lạp nói cụ thể là “người Hy Lạp.”
    reason: cultural_note
lexical_decisions:
- source_word: ἀπρόσκοποι
  choice: Đừng làm cớ vấp phạm
  rationale: Tính từ này trong ngữ cảnh chỉ việc không gây vấp phạm hay trở ngại cho người khác. Cách diễn đạt bằng lời khuyên phủ định tự nhiên trong tiếng Việt và phù hợp với mạch văn về lợi ích của người khác.
- source_word: γίνεσθε
  choice: Đừng ...
  rationale: Mệnh lệnh hiện tại diễn tả một nếp sống liên tục; tiếng Việt chuyển tự nhiên thành lời khuyên phủ định khi kết hợp với ἀπρόσκοποι.
- source_word: Ἰουδαίοις
  choice: người Do Thái
  rationale: Chỉ cộng đồng dân tộc-tôn giáo Do Thái, không riêng cư dân miền Giu-đê.
- source_word: Ἕλλησιν
  choice: người Hy Lạp
  rationale: Giữ nghĩa trực tiếp của từ Hy Lạp; trong bối cảnh của Phao-lô, từ này có thể được dùng rộng hơn để chỉ những người không phải Do Thái.
- source_word: ἐκκλησίᾳ τοῦ θεοῦ
  choice: Hội Thánh của Đức Chúa Trời
  rationale: Diễn đạt cộng đồng những người tin thuộc về Đức Chúa Trời, đồng thời giữ cấu trúc sở hữu của nguyên văn.
theological_decisions:
- issue: Ba nhóm trong lời khuyên đạo đức của Phao-lô
  choice: 'Giữ nguyên ba nhóm: người Do Thái, người Hy Lạp và Hội Thánh của Đức Chúa Trời.'
  alternative: Hiểu “người Hy Lạp” như cách gọi khái quát mọi dân ngoại, hoặc xem lời khuyên chủ yếu là chiến lược truyền giáo.
  rationale: Câu văn nêu rõ ba nhóm. Bản dịch không thu hẹp hay mở rộng các nhóm ấy và không quyết định thay cho độc giả phạm vi thần học rộng hơn của lời khuyên.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Làm cớ vấp phạm” giữ sắc thái đạo đức của ngữ cảnh; “Hội Thánh” là cách gọi quen thuộc trong tiếng Việt Cơ Đốc.
