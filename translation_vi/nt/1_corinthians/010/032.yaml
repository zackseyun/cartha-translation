  verdict: revise
  source_fidelity: 'Bản nháp giữ đúng mệnh lệnh συνεχ diễn của γίνεσθε và ba nhóm được nêu rõ: người Do Thái, người Hy Lạp, và Hội Thánh của Đức Chúa Trời. Tuy nhiên, “Đừng gây vấp phạm” trực tiếp và tự nhiên hơn “Đừng làm cớ vấp phạm,” đồng thời diễn đạt rõ chức năng quan hệ của ἀπρόσκοποι trong ngữ cảnh này.'
  naturalness: “Đừng gây vấp phạm cho …” là cách nói hiện đại, trang trọng và dễ hiểu trong tiếng Việt. Đưa ký hiệu chú thích từ vựng sát cụm từ nó giải thích giúp liên kết chú thích rõ ràng hơn.
