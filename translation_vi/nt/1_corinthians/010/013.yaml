  terminology: “Đức Chúa Trời,” “thành tín,” “sự cám dỗ,” “lối thoát,” và “chịu đựng” phù hợp với văn cảnh và thông dụng trong bản dịch Kinh Thánh tiếng Việt. Chú thích giữ đúng độ rộng từ vựng của πειρασμός/πειρασθῆναι và ἔκβασις mà không áp đặt diễn giải thần học.
