id: 1CO.10.13
reference: 1 Corinthians 10:13
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: πειρασμὸς ὑμᾶς οὐκ εἴληφεν εἰ μὴ ἀνθρώπινος· πιστὸς δὲ ὁ θεός, ὃς οὐκ ἐάσει ὑμᾶς πειρασθῆναι ὑπὲρ ὃ δύνασθε, ἀλλὰ ποιήσει σὺν τῷ πειρασμῷ καὶ τὴν ἔκβασιν τοῦ ⸀δύνασθαι ὑπενεγκεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/013.yaml
  text: No temptation has overtaken you except what is common to man[a]. But God is faithful, who will not allow you to be tempted beyond what you are able, but with the temptation will also provide the way out[c][b], so that you may be able to endure it.
translation:
  language: vi
  text: Không có sự cám dỗ nào đã xảy đến với anh chị em ngoài những điều con người thường gặp.[a][c] Nhưng Đức Chúa Trời là thành tín; Ngài sẽ không để anh chị em bị cám dỗ quá sức mình, nhưng cùng với sự cám dỗ, Ngài cũng sẽ mở lối thoát,[b] để anh chị em có thể chịu đựng được.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “mà không mang tính con người” hoặc “ngoài những điều loài người thường gặp.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “đường ra” hoặc “kết cuộc.” Từ Hy Lạp nhấn mạnh việc Đức Chúa Trời cung ứng điều giúp người ta chịu đựng.'
    reason: lexical_alternative
  - marker: c
    text: Các từ được dịch là “sự cám dỗ” và “bị cám dỗ” cũng có thể được dịch là “sự thử thách” và “bị thử thách” trong câu này.
    reason: lexical_alternative
lexical_decisions:
- source_word: πειρασμός / πειρασθῆναι
  choice: sự cám dỗ / bị cám dỗ
  rationale: Trong văn cảnh cảnh báo về ham muốn xấu và thờ thần tượng, nghĩa luân lý là nổi bật; tuy vậy, từ Hy Lạp cũng có thể chỉ sự thử thách, nên phương án ấy được giữ trong chú thích.
- source_word: εἴληφεν
  choice: xảy đến
  rationale: Diễn đạt tự nhiên trong tiếng Việt về một sự cám dỗ đã đến với hoặc tác động đến người đọc, đồng thời không làm câu nặng nề như cách dịch sát 'nắm bắt'.
- source_word: εἰ μὴ ἀνθρώπινος
  choice: mà không phải là điều con người thường gặp
  rationale: ἀνθρώπινος chỉ điều thuộc về con người hoặc nằm trong kinh nghiệm chung của loài người; cách dịch này rõ nghĩa và tự nhiên.
- source_word: πιστός
  choice: thành tín
  rationale: Cách gọi trang trọng, quen thuộc đối với sự đáng tin cậy và trung tín của Đức Chúa Trời.
- source_word: οὐκ ἐάσει
  choice: sẽ không để
  rationale: Truyền đạt trực tiếp ý cho phép hay để cho xảy ra, bằng tiếng Việt hiện đại.
- source_word: ὑπὲρ ὃ δύνασθε
  choice: quá sức mình
  rationale: Cách nói gọn, tự nhiên, diễn đạt đúng giới hạn vượt quá khả năng của người chịu cám dỗ.
- source_word: ποιήσει ... τὴν ἔκβασιν
  choice: sẽ mở lối thoát
  rationale: ποιέω kết hợp với ἔκβασις chỉ hành động của Đức Chúa Trời tạo nên hoặc cung ứng một lối ra; 'mở lối thoát' tự nhiên trong tiếng Việt mà vẫn giữ tính chủ động của Ngài.
- source_word: σὺν τῷ πειρασμῷ
  choice: cùng với sự cám dỗ
  rationale: Giữ rõ ý lối thoát được ban cùng với hoàn cảnh cám dỗ, chứ câu không hứa rằng cám dỗ lập tức bị loại bỏ.
- source_word: τοῦ δύνασθαι ὑπενεγκεῖν
  choice: để anh chị em có thể chịu đựng được
  rationale: 'Thể hiện mục đích hoặc kết quả của lối thoát: người tin có khả năng đứng vững và chịu đựng trong hoàn cảnh ấy.'
theological_decisions:
- issue: Phạm vi nghĩa của πειρασμός và πειρασθῆναι
  choice: Dùng 'cám dỗ' trong chính văn.
  alternative: Có thể dịch là 'thử thách' hoặc 'bị thử thách'.
  rationale: Văn cảnh gần nhấn mạnh nguy cơ phạm tội, nhưng từ Hy Lạp vẫn bao hàm thử thách. Chú thích bảo tồn độ rộng này mà không khẳng định Đức Chúa Trời là tác nhân dụ dỗ con người làm ác.
- issue: Ý nghĩa của ἔκβασις đối với sự chịu đựng
  choice: Dịch là 'lối thoát', rồi giữ mệnh đề mục đích 'để ... chịu đựng được'.
  alternative: Có thể hiểu là 'đường ra' hoặc 'kết cuộc'.
  rationale: Cấu trúc câu nhấn mạnh sự cung ứng của Đức Chúa Trời giúp người tin chịu đựng; không nên diễn giải thành lời hứa rằng mọi thử thách sẽ được loại bỏ ngay.
- issue: Ý nghĩa của ἀνθρώπινος
  choice: Dịch theo kinh nghiệm chung của con người.
  alternative: Có thể dịch sát hơn là 'mang tính con người' hoặc 'thuộc về con người'.
  rationale: Cụm từ khẳng định sự cám dỗ họ gặp không phải là điều vượt khỏi phạm vi trải nghiệm của loài người, không nhằm giới hạn vào nam giới.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh chị em” cho đại từ số nhiều ὑμᾶς, “Đức Chúa Trời” theo lối gọi Tin Lành phổ biến, và giữ nhịp đối lập của câu Hy Lạp. Các chú thích bảo tồn những khả năng từ vựng thật sự mà không áp đặt cách giải nghĩa hệ phái.
