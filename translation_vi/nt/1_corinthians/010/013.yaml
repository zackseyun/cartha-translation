  to: Không có sự cám dỗ nào đã xảy đến với anh chị em ngoài những điều con người thường gặp.[a][c] Nhưng Đức Chúa Trời là thành tín; Ngài sẽ không để anh chị em bị cám dỗ quá sức mình, nhưng cùng với sự cám dỗ, Ngài cũng sẽ mở lối thoát,[b] để anh chị em có thể chịu đựng được.
  rationale: Sửa câu đầu sang cấu trúc “ngoài những điều...” để phản ánh trực tiếp ngoại trừ εἰ μὴ ἀνθρώπινος, tránh phủ định kép, và vẫn giữ ý rằng kinh nghiệm ấy thuộc phạm vi con người. Chỉnh một cụm trong chú thích b cho tự nhiên. Đưa chú thích về phạm vi nghĩa của πειρασμός/πειρασθῆναι sát lần xuất hiện đầu tiên để mỏ neo chú thích rõ ràng hơn. Các thay đổi không làm thu hẹp hay mở rộng nghĩa của câu.
