  source_fidelity: 'Bản dịch truyền đạt đúng các yếu tố chính của câu Hy Lạp: πειρασμός được hiểu theo nghĩa “cám dỗ” trong văn cảnh, ἀνθρώπινος là điều thuộc kinh nghiệm chung của con người, sự thành tín của Đức Chúa Trời, giới hạn “quá sức” (ὑπὲρ ὃ δύνασθε), và mục đích là có thể chịu đựng. Tuy nhiên, cấu trúc phủ định kép “Không có ... mà không phải ...” kém sáng rõ hơn cấu trúc loại trừ của εἰ μὴ và nên được sửa để diễn đạt trực tiếp hơn.'
