  source_fidelity: Bản dịch truyền đạt đúng mệnh lệnh số nhiều, phạm vi bao quát của πᾶν τὸ ... πωλούμενον, địa điểm chuyên biệt μακέλλῳ, và không xác định chủ thể của “lương tâm.” Tuy nhiên, “bất cứ thứ gì bán” thiếu bị động từ tự nhiên cần thiết trong tiếng Việt; nguyên văn nói những thứ “được bán.”
  naturalness: “Bất cứ thứ gì bán” chưa tự nhiên trong văn xuôi tiếng Việt chuẩn. “Không cần tra hỏi gì” khá dễ hiểu, nhưng “tra hỏi” thường gợi việc chất vấn một người; trong ngữ cảnh mua thịt, “hỏi han” tự nhiên hơn cho ý không truy hỏi nguồn gốc. “Vì cớ lương tâm” phù hợp văn phong Kinh Thánh vừa phải và giữ được tính không xác định của nguyên văn.
  terminology: “Chợ thịt” là lựa chọn chính xác cho μακέλλῳ. Giữ “lương tâm” không có sở hữu cách là cần thiết, vì câu Hy Lạp chưa xác định đó là lương tâm của người mua hay của người khác.
