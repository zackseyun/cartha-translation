base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/025.yaml
  text: Eat whatever is sold in the meat market[a], asking no questions for the sake of conscience,
translation:
  language: vi
  text: Hãy ăn mọi thứ được bán ở chợ thịt, không hỏi han gì vì cớ lương tâm,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “không tìm hiểu gì” hoặc “không xem xét gì”; ý là đừng tìm hiểu nguồn gốc của thịt.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶν τὸ ... πωλούμενον
  choice: bất cứ thứ gì bán
  rationale: Cụm danh từ hóa giống trung diễn tả toàn bộ những gì đang được bán. “Bất cứ thứ gì bán” tự nhiên trong tiếng Việt và giữ được ý nghĩa bao quát.
- source_word: ἐν μακέλλῳ
  choice: ở chợ thịt
  rationale: μάκελλον chỉ nơi bán thịt, không phải chợ nói chung. “Chợ thịt” giữ đúng bối cảnh thực phẩm có thể liên quan đến việc hiến tế thần tượng.
- source_word: ἐσθίετε
  choice: Hãy ăn
  rationale: Động từ mệnh lệnh hiện tại, ngôi thứ hai số nhiều. “Hãy ăn” truyền đạt trực tiếp mệnh lệnh; ngữ cảnh cho thấy đây là nguyên tắc thực hành thông thường.
- source_word: μηδὲν ἀνακρίνοντες
  choice: không cần tra hỏi gì
  rationale: ἀνακρίνω có thể mang nghĩa tra hỏi, xem xét hoặc điều tra. Trong ngữ cảnh này, ý là không điều tra lai lịch của thịt; “không cần tra hỏi gì” vừa rõ nghĩa vừa tự nhiên.
- source_word: διὰ τὴν συνείδησιν
  choice: vì cớ lương tâm
  rationale: διά với đối cách ở đây nêu lý do hoặc sự cân nhắc thúc đẩy hành động. “Vì cớ lương tâm” giữ sắc thái đạo đức mà không xác định trước đó là lương tâm của ai.
theological_decisions:
- issue: Đối tượng quy chiếu của “lương tâm”
  choice: Dịch chung là “lương tâm”, không thêm đại từ sở hữu
  alternative: “lương tâm của anh chị em” hoặc “lương tâm của người khác”
  rationale: Bản Hy Lạp chỉ dùng “lương tâm” với mạo từ mà không nói rõ thuộc về ai trong câu này. Không thêm chủ sở hữu giúp bảo tồn sự mơ hồ để văn cảnh tiếp theo làm sáng tỏ.
translation_notes:
  register: Văn phong hiện đại, rõ ràng và trang trọng vừa phải. “Chợ thịt” cụ thể hơn “chợ”; “vì cớ lương tâm” giữ được nét trang nghiêm và sự mơ hồ của nguyên văn.
