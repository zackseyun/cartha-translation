    rationale: ἀνακρίνοντες tại đây nói đến việc hỏi hoặc tìm hiểu nguồn gốc của thực phẩm. “Không hỏi han gì” diễn đạt hành động này tự nhiên hơn trong bối cảnh chợ, mà không thu hẹp hay thêm thông tin.
