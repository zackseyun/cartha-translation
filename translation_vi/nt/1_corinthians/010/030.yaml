  source_fidelity: Bản dịch nhận đúng cấu trúc câu điều kiện–câu hỏi tu từ, nghĩa của χάριτι là lòng biết ơn trong ngữ cảnh, và quan hệ nguyên nhân của ὑπὲρ οὗ. Tuy nhiên, “dự phần” không thật tự nhiên khi không nêu đối tượng trong tiếng Việt; ngữ cảnh trực tiếp là việc ăn thức ăn, nên “ăn” truyền đạt μετέχω rõ và tự nhiên hơn mà không thêm ý nghĩa thực chất.
  naturalness: “Nếu tôi dự phần với lòng biết ơn” hơi thiếu đối tượng và có thể gợi sắc thái nghi lễ trong tiếng Việt hiện đại. “Bị nói xấu” khá khẩu ngữ và có thể chỉ lời nói sau lưng, trong khi βλασφημοῦμαι nói đến việc bị phỉ báng/gièm pha. “Bị gièm pha” phù hợp hơn với sắc thái bị công kích bằng lời lẽ.
  terminology: “Lòng biết ơn” và “tạ ơn” giữ được liên hệ từ vựng và ý nghĩa giữa χάριτι với εὐχαριστῶ. Không nên thêm “Đức Chúa Trời” làm đối tượng của lời tạ ơn. Chú thích giữ phương án từ vựng “nhờ ân điển” nhưng cần diễn đạt tự nhiên hơn, không biến phương án này thành cách hiểu thần học bắt buộc.
