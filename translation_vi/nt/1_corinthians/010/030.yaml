  text: εἰ ἐγὼ χάριτι μετέχω, τί βλασφημοῦμαι ὑπὲρ οὗ ἐγὼ εὐχαριστῶ;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/030.yaml
  text: If I partake with thankfulness[a], why am I denounced for that for which I give thanks?
translation:
  language: vi
  text: Nếu tôi ăn với lòng biết ơn[a], tại sao tôi lại bị gièm pha vì điều tôi tạ ơn?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Nếu tôi ăn nhờ ân điển, tại sao tôi lại bị gièm pha vì điều tôi tạ ơn?” Từ Hy Lạp χάριτι có thể có nghĩa là “nhờ ân điển”; nhưng trong ngữ cảnh này, nhiều người hiểu là “với lòng biết ơn” vì tiếp theo là “tôi tạ ơn”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: χάριτι
  choice: với lòng biết ơn
  rationale: Trong ngữ cảnh ăn uống và ngay trước động từ εὐχαριστῶ, cụm này tự nhiên chỉ thái độ biết ơn đi kèm việc dự phần; cách dịch cũng tránh áp đặt nghĩa cứu rỗi của “ân điển”.
- source_word: μετέχω
  choice: dự phần
  rationale: Diễn đạt hành động cùng hưởng hoặc dùng thức ăn, đồng thời giữ được sắc thái trang trọng và ý niệm tham dự của động từ Hy Lạp.
- source_word: βλασφημοῦμαι
  choice: bị nói xấu
  rationale: Ở đây đối tượng là người nói, nên động từ chỉ việc bị gièm pha hoặc nói xúc phạm, không phải sự phạm thượng trực tiếp đối với Đức Chúa Trời.
- source_word: ὑπὲρ οὗ
  choice: vì điều mà
  rationale: 'Giữ quan hệ nguyên nhân: chính điều người nói tạ ơn lại trở thành căn cứ để người ấy bị nói xấu.'
- source_word: εὐχαριστῶ
  choice: tôi tạ ơn
  rationale: Dịch trực tiếp hành động dâng lời cảm tạ; không thêm đối tượng “Đức Chúa Trời” vì nguyên văn để ngầm hiểu.
- source_word: τί
  choice: tại sao
  rationale: Trong câu hỏi tu từ này, τί có nghĩa tự nhiên là hỏi lý do.
- source_word: ἐγὼ ... ἐγὼ
  choice: tôi ... tôi
  rationale: Giữ ngôi thứ nhất được lặp lại; từ “lại” trong vế hỏi góp phần truyền đạt sắc thái đối chiếu tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Nghĩa của χάριτι trong mối liên hệ với việc ăn và tạ ơn
  choice: với lòng biết ơn
  alternative: nhờ ân điển
  rationale: Mệnh đề kế tiếp, “điều mà tôi tạ ơn”, nghiêng mạnh về nghĩa lòng biết ơn. Tuy vậy, nghĩa công cụ “nhờ ân điển” vẫn có thể có về mặt từ vựng nên được bảo lưu trong chú thích.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. “Dự phần” giữ sắc thái tham dự của nguyên văn; “bị nói xấu” tự nhiên hơn “bị phạm thượng” khi đối tượng là con người. Câu hỏi tu từ và sự căng thẳng giữa tự do tạ ơn với lời gièm pha được giữ nguyên.
