  source_fidelity: 'Bản nháp truyền đạt đúng các yếu tố chính: πάντες («tất cả»), cách dùng loại hình của ἐβαπτίσαντο («được báp-têm»), và hai cụm ἐν song song («trong đám mây» / «trong biển»). Tuy nhiên, «vào trong Môi-se» thêm một sắc thái định vị kép không cần thiết trong tiếng Việt và dễ gợi hình ảnh không chủ ý. «Vào Môi-se» giữ tính khác thường, tính mở, và sự tương ứng với εἰς τὸν Μωϋσῆν tốt hơn.'
  naturalness: «Được báp-têm vào Môi-se» vẫn cố ý lạ như nguyên văn nhưng đọc tự nhiên hơn «được báp-têm vào trong Môi-se». Các chú thích được chỉnh cho tiếng Việt hiện đại, tránh cách nói không tự nhiên «đi vào sự quy phục Môi-se».
  terminology: Giữ «báp-têm», «Môi-se», và «Phao-lô» nhất quán. «Liên kết với Môi-se» là một phương án diễn giải trong chú thích, không thay thế cách dịch chính. «Dưới quyền lãnh đạo của Môi-se» được nêu như một khả năng diễn giải có điều kiện, không áp đặt một lập trường thần học.
