lexical_decisions:
- source_word: πάντες
  choice: tất cả
  rationale: Diễn tả toàn thể dân Y-sơ-ra-ên đang được nói đến và giữ sự nhấn mạnh lặp lại của Phao-lô trong văn cảnh.
- source_word: εἰς τὸν Μωϋσῆν
  choice: vào trong Môi-se
  rationale: Giữ nguyên cách nói khác thường của tiếng Hy Lạp và sự song song loại hình với ngôn ngữ báp-têm, không giải nghĩa quá mức thành sự đồng nhất hay lòng trung thành.
- source_word: ἐβαπτίσαντο
  choice: được báp-têm
  rationale: Truyền đạt tự nhiên dạng trung gian aorist trong ngữ cảnh này, đồng thời giữ thuật ngữ báp-têm và cách dùng loại hình của Phao-lô.
- source_word: ἐν τῇ νεφέλῃ
  choice: trong đám mây
  rationale: Giữ giới từ ἐν cùng hình ảnh Xuất Hành và không thu hẹp sắc thái thành phương tiện hay tác nhân.
- source_word: ἐν τῇ θαλάσσῃ
  choice: trong biển
  rationale: Phản ánh ἐν thay vì đổi thành “qua biển”, đồng thời giữ sự song song với “trong đám mây”.
theological_decisions:
- issue: Ý nghĩa của việc dân Y-sơ-ra-ên được báp-têm “vào trong Môi-se”
  choice: 'Giữ nguyên ngôn ngữ loại hình và đại diện: “vào trong Môi-se”.'
  alternative: “được đồng nhất với Môi-se” hoặc “đi vào sự quy phục Môi-se”.
  rationale: Phao-lô đặt kinh nghiệm Xuất Hành song song với phép báp-têm; bản dịch giữ sức căng thần học ấy thay vì ấn định một cách giải thích duy nhất.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ “báp-têm” là thuật ngữ quen dùng; giữ cách nói cố ý khác thường “vào trong Môi-se” và giải thích các cách hiểu khả dĩ trong chú thích.
