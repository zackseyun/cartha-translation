  text: và tất cả đều được báp-têm vào Môi-se, trong đám mây và trong biển[a][b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “được liên kết với Môi-se” hoặc, theo cách hiểu, “được đặt dưới quyền lãnh đạo của Môi-se”. Tiếng Hy Lạp nói theo nghĩa đen là “vào Môi-se”, giữ sự song song loại hình mà Phao-lô lập với phép báp-têm.
    reason: alternative_reading
  - marker: b
