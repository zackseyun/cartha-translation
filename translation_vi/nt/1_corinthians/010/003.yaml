  text: and all ate the same spiritual food[a]
translation:
  language: vi
  text: Và tất cả đều ăn cùng một thức ăn thuộc linh[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “thức ăn siêu nhiên”; cụm từ này có lẽ ám chỉ ma-na trong hoang mạc và trong văn mạch có thể mang ý nghĩa loại hình.
    reason: Nêu phương án từ vựng chính đáng và làm rõ sự ám chỉ có khả năng xảy ra mà không đưa cách giải thích ấy vào chính văn.
lexical_decisions:
- source_word: καὶ
  choice: và
  rationale: Liên từ nối câu này với ý trước một cách trực tiếp và tự nhiên.
- source_word: πάντες
  choice: tất cả đều
  rationale: Chỉ toàn thể nhóm người Israel trong ví dụ của Phao-lô và giữ sắc thái bao quát, nhấn mạnh.
- source_word: τὸ αὐτὸ
  choice: cùng một
  rationale: Diễn đạt tự nhiên ý đồng nhất của cụm có mạo từ với αὐτός.
- source_word: πνευματικὸν
  choice: thuộc linh
  rationale: Giữ thuật ngữ quen thuộc trong văn mạch Phao-lô và không thu hẹp nghĩa thành 'do Thánh Linh ban' hay chỉ diễn giải là 'siêu nhiên'.
- source_word: βρῶμα
  choice: thức ăn
  rationale: Tương đương trực tiếp, trang trọng vừa phải và dễ hiểu đối với danh từ chỉ đồ ăn nói chung.
- source_word: ἔφαγον
  choice: ăn
  rationale: Trong cấu trúc tiếng Việt với văn mạch tường thuật quá khứ, động từ đơn 'ăn' diễn đạt tự nhiên hành động được kể lại.
theological_decisions:
- issue: Ý nghĩa của cụm 'thức ăn thuộc linh' trong phép loại hình về thời kỳ hoang mạc
  choice: Giữ 'thức ăn thuộc linh' trong chính văn, không xác định rõ là ma-na hoặc Tiệc Thánh.
  alternative: thức ăn siêu nhiên; ma-na do Đức Chúa Trời ban; thức ăn do Thánh Linh ban
  rationale: Cụm từ có thể ám chỉ ma-na và mang sức nặng loại hình trong văn mạch, nhưng chính câu không nói rõ hơn. Cách dịch này bảo tồn sự hàm súc và căng thẳng thần học của nguyên văn.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. 'Thuộc linh' được giữ vì vừa ngắn gọn vừa bảo tồn thuật ngữ và tính hàm súc của πνευματικός; dấu chú thích [a] xuất hiện ngay sau cụm liên quan.
