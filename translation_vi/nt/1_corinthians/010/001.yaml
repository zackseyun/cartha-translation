revisions:
- from: Vì tôi không muốn anh em không biết[a] rằng tổ phụ chúng ta đều đã ở dưới đám mây, và tất cả đều đã đi qua biển.
  to: Vì, thưa anh em, tôi không muốn anh em không biết rằng tổ phụ chúng ta đều ở dưới đám mây, và tất cả đều đã đi qua biển.
  rationale: Bổ sung “thưa anh em” để dịch rõ hô ngữ ἀδελφοί, đồng thời vẫn giữ “anh em” trong thành ngữ “không muốn anh em không biết.” Đổi “đều đã ở” thành “đều ở” để phản ánh tốt hơn động từ ἦσαν (quá khứ tiếp diễn/mô tả bối cảnh), còn “đã đi qua” giữ hành động hoàn thành của διῆλθον. Không thay đổi ý nghĩa hay thêm diễn giải.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T18:11:45Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch giữ đúng các yếu tố chính: γάρ (“Vì”), thành ngữ phủ định “không muốn ... không biết,” hai lần nhấn mạnh πάντες (“đều ... tất cả đều”), hình ảnh “dưới đám mây,” và hành động đi qua biển. Tuy nhiên, ἀδελφοί là hô ngữ trong nguyên văn, không phải thành phần của mệnh đề bổ ngữ; bản hiện tại không đánh dấu rõ chức năng hô ngữ này.'
  naturalness: Cần thêm “thưa” và dấu phẩy để câu tiếng Việt phân biệt rõ lời gọi hội chúng với đại từ làm bổ ngữ của “không muốn ... không biết.” Cách này cũng giữ văn phong Kinh Thánh trang trọng, hiện đại và dễ hiểu.
  terminology: “Anh em,” “tổ phụ chúng ta,” “đám mây,” và “biển” đều phù hợp. Chú thích về phạm vi đại diện của “anh em” là đúng chỗ và diễn đạt rõ.
  issues:
  - severity: medium
    issue: Chức năng hô ngữ của ἀδελφοί chưa được thể hiện rõ.
    rationale: Trong “Vì tôi không muốn anh em không biết rằng,” “anh em” dễ chỉ được hiểu là bổ ngữ của động từ, trong khi nguyên văn còn có lời gọi trực tiếp ἀδελφοί. Thêm “thưa anh em” bảo toàn chức năng ngữ pháp và sắc thái mục vụ của nguyên văn.
  revised_text: Vì, thưa anh em, tôi không muốn anh em không biết rằng tổ phụ chúng ta đều ở dưới đám mây, và tất cả đều đã đi qua biển.
  revised_footnotes:
  - marker: a
    text: Hay “anh chị em”; từ Hy Lạp được dịch là “anh em” có thể dùng để gọi một hội chúng gồm cả nam lẫn nữ.
    reason: lexical_alternative
