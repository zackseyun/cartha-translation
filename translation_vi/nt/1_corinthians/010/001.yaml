id: 1CO.10.1
reference: 1 Corinthians 10:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Οὐ θέλω ⸀γὰρ ὑμᾶς ἀγνοεῖν, ἀδελφοί, ὅτι οἱ πατέρες ἡμῶν πάντες ὑπὸ τὴν νεφέλην ἦσαν καὶ πάντες διὰ τῆς θαλάσσης διῆλθον,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/001.yaml
  text: For I do not want you to be unaware[a], brothers, that our fathers were all under the cloud, and all passed through the sea,
translation:
  language: vi
  text: Vì, thưa anh em, tôi không muốn anh em không biết rằng tổ phụ chúng ta đều ở dưới đám mây, và tất cả đều đã đi qua biển.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οὐ θέλω ... ἀγνοεῖν
  choice: tôi không muốn anh em không biết
  rationale: Giữ cấu trúc phủ định có chủ ý trong thành ngữ của Phao-lô, thay vì làm phẳng thành “tôi muốn anh em biết”; cách nói này vẫn tự nhiên và rõ trong tiếng Việt.
- source_word: γὰρ
  choice: Vì
  rationale: Giữ chức năng giải thích và liên kết với lập luận ngay trước đó.
- source_word: ἀδελφοί
  choice: anh em
  rationale: “Anh em” là cách xưng hô hội chúng tự nhiên, trang trọng trong tiếng Việt và giữ hình thức giống đực số nhiều của nguyên văn; chú thích nêu rõ phạm vi có thể gồm cả nam lẫn nữ.
- source_word: οἱ πατέρες ἡμῶν
  choice: tổ phụ chúng ta
  rationale: Giữ sắc thái gia tộc và lịch sử của πατέρες, đồng thời thể hiện việc Phao-lô nối cộng đồng tín hữu với câu chuyện của Israel.
- source_word: πάντες
  choice: đều ... tất cả đều
  rationale: Giữ cả hai lần lặp của πάντες, vốn quan trọng cho sức nhấn tu từ của đoạn văn.
- source_word: ὑπὸ τὴν νεφέλην ἦσαν
  choice: đều đã ở dưới đám mây
  rationale: Dịch sát hình ảnh đám mây trong cuộc xuất hành mà không diễn giải thêm về ý nghĩa thần học của nó.
- source_word: διὰ τῆς θαλάσσης διῆλθον
  choice: đều đã đi qua biển
  rationale: Diễn đạt đúng chuyển động xuyên qua biển, tự nhiên trong tiếng Việt và không đặc tả quá mức.
theological_decisions:
- issue: Phạm vi của lời gọi ἀδελφοί khi nói với một hội chúng gồm cả nam lẫn nữ
  choice: anh em
  alternative: anh chị em
  rationale: Bản chính giữ hình thức giống đực của nguyên văn bằng cách xưng hô truyền thống “anh em”, còn nghĩa đại diện có thể bao gồm toàn thể hội chúng được nêu trong chú thích.
- issue: Sự đồng nhất mang tính cộng đồng với Israel trong οἱ πατέρες ἡμῶν
  choice: tổ phụ chúng ta
  alternative: tổ tiên chúng ta
  rationale: “Tổ phụ” giữ rõ hơn sắc thái phụ hệ và sức nặng lịch sử-giao ước của cách nói, không làm mờ việc Phao-lô đưa hội chúng Cô-rinh-tô vào câu chuyện của Israel.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Giữ cấu trúc phủ định và sự lặp lại của nguyên văn; dùng “tổ phụ” để bảo toàn sắc thái Kinh Thánh và liên hệ gia tộc mà không thêm diễn giải.
