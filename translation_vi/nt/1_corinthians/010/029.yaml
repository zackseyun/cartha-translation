id: 1CO.10.29
reference: 1 Corinthians 10:29
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: συνείδησιν δὲ λέγω οὐχὶ τὴν ἑαυτοῦ ἀλλὰ τὴν τοῦ ἑτέρου· ἱνατί γὰρ ἡ ἐλευθερία μου κρίνεται ὑπὸ ἄλλης συνειδήσεως;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/029.yaml
  text: I mean the other person's conscience[a], not your own[b]. For why is my freedom judged by another conscience?
translation:
  language: vi
  text: Tôi muốn nói đến lương tâm của người kia[a], chứ không phải lương tâm của chính anh chị em. Vì sao sự tự do của tôi lại bị lương tâm của người khác xét đoán?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát hơn: “không phải lương tâm của chính người ấy, nhưng là của người kia.” Văn cảnh hỗ trợ cách hiểu “không phải lương tâm của chính anh chị em, nhưng là của người kia.”'
    reason: lexical_alternative
  - marker: b
    text: Câu hỏi tu từ này có thể được hiểu là lời chất vấn của chính Phao-lô, hoặc là một lời phản biện ông nêu lên; tiếng Hy Lạp không có dấu hiệu trích dẫn rõ ràng.
    reason: alternative_reading
lexical_decisions:
- source_word: συνείδησιν
  choice: lương tâm
  rationale: Trong văn cảnh này, từ này chỉ ý thức đạo đức dùng để đánh giá hành động; “lương tâm” là cách diễn đạt tự nhiên và chính xác trong tiếng Việt hiện đại.
- source_word: δὲ λέγω
  choice: Tôi muốn nói đến
  rationale: Cụm từ làm rõ ý của câu trước hơn là mở ra một khẳng định mới. Cách dịch này truyền đạt chức năng giải thích mà không thêm một từ chỉ thời gian như “bây giờ”.
- source_word: οὐχὶ τὴν ἑαυτοῦ ἀλλὰ τὴν τοῦ ἑτέρου
  choice: lương tâm của người kia, chứ không phải lương tâm của chính anh chị em
  rationale: Bản dịch nêu lại “lương tâm” để câu tiếng Việt rõ ràng, đồng thời theo văn cảnh hiểu sự tương phản là giữa lương tâm người được nói đến và lương tâm của độc giả.
- source_word: ἱνατί γὰρ
  choice: Vì sao
  rationale: “Vì sao” giữ được tính chất câu hỏi tu từ; vị trí nối tiếp vẫn thể hiện quan hệ giải thích của γάρ mà không tạo câu tiếng Việt gượng ép.
- source_word: ἐλευθερία
  choice: sự tự do
  rationale: Đây là từ tương đương rõ ràng, hiện đại, phù hợp với cuộc bàn luận về quyền tự do hành động.
- source_word: κρίνεται
  choice: bị ... xét đoán
  rationale: “Xét đoán” giữ phạm vi nghĩa rộng của động từ bị động, không thu hẹp thành “kết án”.
- source_word: ὑπὸ ἄλλης συνειδήσεως
  choice: bị lương tâm của người khác xét đoán
  rationale: Cách dịch xác định lương tâm khác là tác nhân của việc xét đoán và tự nhiên hơn trật tự bám sát tiếng Hy Lạp.
theological_decisions:
- issue: Sở chỉ của đại từ sở hữu trong vế tương phản
  choice: Theo văn cảnh, dịch là lương tâm của người kia chứ không phải lương tâm của chính độc giả.
  alternative: 'Dịch sát hình thức: “không phải lương tâm của chính người ấy, nhưng là của người kia.”'
  rationale: ἑαυτοῦ có hình thức ngôi thứ ba số ít, nhưng lời khuyên trong văn cảnh đang trực tiếp hướng đến người Cô-rinh-tô. Chú thích giữ lại hình thức sát chữ để không che khuất nét nhập nhằng.
- issue: Người phát ngôn và dụng ý của câu hỏi tu từ
  choice: Giữ nguyên dưới dạng câu hỏi tu từ, không đánh dấu đổi người nói.
  alternative: Hiểu đây là lời phản biện của một người Cô-rinh-tô mà Phao-lô nêu lại; hoặc hiểu là câu hỏi của chính Phao-lô.
  rationale: Tiếng Hy Lạp không có dấu hiệu trích dẫn hay đổi người nói, nên bản chính không quyết định thay cho người đọc; chú thích trình bày hai khả năng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” để diễn đạt lời hướng đến cộng đồng tín hữu; giữ “lương tâm”, “sự tự do” và “xét đoán” nhằm bảo toàn các khái niệm cùng độ mở của nguyên văn.
