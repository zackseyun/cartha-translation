source:
  edition: SBLGNT
  text: βλέπετε τὸν Ἰσραὴλ κατὰ σάρκα· ⸀οὐχ οἱ ἐσθίοντες τὰς θυσίας κοινωνοὶ τοῦ θυσιαστηρίου εἰσίν;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/018.yaml
  text: 'Consider Israel according to the flesh: are not those who eat the sacrifices participants in the altar?[a][b][c]'
translation:
  language: vi
  text: 'Hãy xem dân Y-sơ-ra-ên theo xác thịt[a]: chẳng phải những người ăn các tế vật là những người có phần với bàn thờ[b] sao?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “dân Y-sơ-ra-ên theo huyết thống” hoặc “dân Y-sơ-ra-ên về phần thể xác.”'
    reason: lexical_alternative
  - marker: b
    text: 'Hay: “thông phần với bàn thờ” hoặc “có phần về bàn thờ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: βλέπετε
  choice: Hãy xem
  rationale: Động từ mệnh lệnh số nhiều kêu gọi người đọc chú ý và suy xét; “Hãy xem” tự nhiên trong lập luận và vẫn giữ sắc thái trực tiếp của nguyên ngữ.
- source_word: Ἰσραὴλ κατὰ σάρκα
  choice: dân Y-sơ-ra-ên theo xác thịt
  rationale: Giữ hình ảnh đặc trưng của cụm κατὰ σάρκα, đồng thời “dân” làm rõ rằng đây là cộng đồng Y-sơ-ra-ên; trong ngữ cảnh, cụm này nói đến Y-sơ-ra-ên theo dòng dõi tự nhiên chứ không mang nghĩa “bản tính tội lỗi”.
- source_word: οὐχ ... εἰσίν;
  choice: chẳng phải ... sao?
  rationale: Diễn đạt tự nhiên câu hỏi tu từ mà οὐχ mở đầu và vốn chờ đợi câu trả lời khẳng định.
- source_word: οἱ ἐσθίοντες
  choice: những người ăn
  rationale: Thể hiện cụ thể hành động ăn của phân từ hiện tại được dùng như danh từ, không diễn giải trước thành “dự phần”.
- source_word: τὰς θυσίας
  choice: các lễ vật hiến tế
  rationale: Diễn đạt rõ các vật được dâng làm tế lễ; tự nhiên và dễ hiểu hơn nếu chỉ nói “các tế lễ” trong tiếng Việt.
- source_word: κοινωνοὶ τοῦ θυσιαστηρίου
  choice: dự phần nơi bàn thờ
  rationale: κοινωνοί chỉ việc có phần, thông phần hay tham dự thực sự; “nơi bàn thờ” diễn đạt mối liên hệ với bàn thờ và phạm vi thờ phượng hiến tế mà không gợi rằng người ta ở bên trong một vật thể.
theological_decisions:
- issue: Ý nghĩa của “Y-sơ-ra-ên theo xác thịt”
  choice: Giữ cụm “theo xác thịt” trong chính văn, hiểu trong ngữ cảnh là dân Y-sơ-ra-ên theo dòng dõi tự nhiên.
  alternative: “dân Y-sơ-ra-ên theo huyết thống” hoặc “dân Y-sơ-ra-ên về phần thể xác”
  rationale: Cách dịch này bảo tồn ngôn ngữ và sự căng thẳng trong cách dùng của Phao-lô, không biến σάρξ thành “bản tính tội lỗi” và cũng không đưa vào một kết luận giáo lý rộng hơn về Y-sơ-ra-ên và Hội Thánh.
- issue: Quan hệ được diễn tả bởi κοινωνοὶ τοῦ θυσιαστηρίου
  choice: “dự phần nơi bàn thờ”
  alternative: “thông phần với bàn thờ” hoặc “có phần trong bàn thờ”
  rationale: Nguyên ngữ nói đến sự tham dự thực sự liên quan đến bàn thờ. Bản dịch chọn cách nói tự nhiên trong tiếng Việt nhưng không giải quyết quá mức chính xác bản chất của quan hệ ấy.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ cách nói “theo xác thịt” vì đây là cụm từ thần học có chủ ý của Phao-lô, nhưng thêm chú thích để tránh hiểu là “bản tính tội lỗi.” Dùng “dự phần nơi bàn thờ” để vừa tự nhiên trong tiếng Việt vừa bảo tồn ý niệm κοινωνία.
