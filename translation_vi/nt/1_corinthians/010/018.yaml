  source_fidelity: 'Bản dịch phản ánh đúng cấu trúc lập luận: mệnh lệnh kêu gọi suy xét, cụm “Y-sơ-ra-ên theo xác thịt,” câu hỏi tu từ đòi câu trả lời khẳng định, việc ăn các của tế, và sự συμμε dự/liên hệ với bàn thờ. Tuy nhiên, “dự phần nơi bàn thờ” thiên về địa điểm diễn ra hành động; κοινωνοὶ τοῦ θυσιαστηρίου nói trực tiếp hơn về việc có phần/thông phần với bàn thờ. “Tế vật” cũng là từ gọn, chính xác cho τὰς θυσίας trong văn phong Kinh Thánh hiện đại.'
