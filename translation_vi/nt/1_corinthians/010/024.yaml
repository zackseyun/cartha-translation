id: 1CO.10.24
reference: 1 Corinthians 10:24
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: μηδεὶς τὸ ἑαυτοῦ ζητείτω ἀλλὰ τὸ τοῦ ⸀ἑτέρου.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/024.yaml
  text: Let no one seek his own good[a], but that of the other person.
translation:
  language: vi
  text: Đừng ai tìm lợi ích cho riêng mình, nhưng hãy tìm lợi ích cho người khác.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay sát nghĩa hơn: “Đừng ai tìm điều thuộc về mình, nhưng hãy tìm điều thuộc về người khác.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδεὶς
  choice: Đừng ai
  rationale: Kết hợp tự nhiên với mệnh lệnh ngôi thứ ba ζητείτω để diễn đạt một lệnh cấm chung trong tiếng Việt hiện đại.
- source_word: ζητείτω
  choice: tìm
  rationale: Giữ nghĩa rộng và đơn giản của ζητέω là tìm kiếm hoặc theo đuổi, không thu hẹp vào một loại lợi ích cụ thể.
- source_word: τὸ ἑαυτοῦ
  choice: lợi ích cho riêng mình
  rationale: Cụm Hy Lạp là lối nói tỉnh lược, sát nghĩa là “điều thuộc về chính mình”. Trong ngữ cảnh 10:23–33, “lợi ích” diễn đạt rõ ý đối lập giữa mưu cầu cho mình và cho người khác, đồng thời “cho riêng mình” giữ sắc thái tự quy hướng.
- source_word: ἀλλὰ
  choice: nhưng
  rationale: Diễn đạt trực tiếp sự tương phản giữa việc tìm lợi ích riêng và tìm lợi ích cho người khác.
- source_word: τὸ τοῦ ἑτέρου
  choice: lợi ích cho người khác
  rationale: Bổ sung cùng một danh từ ngầm hiểu như ở vế trước để câu tiếng Việt rõ ràng và cân đối; ἕτερος chỉ người khác đối lập với chính mình.
theological_decisions:
- issue: Bổ sung đối tượng bị tỉnh lược trong τὸ ἑαυτοῦ / τὸ τοῦ ἑτέρου
  choice: Diễn đạt là “lợi ích cho riêng mình” và “lợi ích cho người khác”
  alternative: “điều thuộc về mình” và “điều thuộc về người khác”
  rationale: Nguyên văn không nêu danh từ cụ thể, nhưng ngữ cảnh nói đến việc hành động nhằm ích lợi và sự cứu rỗi của người khác (10:23–33). “Lợi ích” truyền đạt ý đạo đức mà không giới hạn vào lợi ích vật chất; chú thích bảo tồn cách hiểu sát cấu trúc tỉnh lược.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Cấu trúc “Đừng ai... nhưng hãy...” tái hiện rõ lực mệnh lệnh và sự tương phản của nguyên văn.
