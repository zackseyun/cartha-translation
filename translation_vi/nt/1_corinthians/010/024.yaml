  verdict: approve
  source_fidelity: Bản dịch truyền đạt đúng mệnh lệnh phủ định tổng quát của μηδείς ... ζητείτω và thế đối lập với ἀλλά. Việc bổ sung “lợi ích” cho hai cụm tỉnh lược τὸ ἑαυτοῦ / τὸ τοῦ ἑτέρου phù hợp với mạch văn 1 Cô-rinh-tô 10:23–33 mà không thu hẹp nghĩa vào lợi ích vật chất.
  naturalness: “Đừng ai tìm lợi ích cho riêng mình, nhưng hãy tìm lợi ích cho người khác” là tiếng Việt hiện đại, rõ ràng, cân đối và giữ được sắc thái khuyên răn/mệnh lệnh của câu gốc.
  terminology: “Lợi ích” là lựa chọn trung tính, phù hợp cho đối tượng ngầm hiểu trong ngữ cảnh và tương ứng hợp lý với “good/interests” trong bản tiếng Anh. “Người khác” diễn đạt tự nhiên ἑτέρου trong thế đối chiếu với bản thân. Chú thích bảo tồn cách diễn đạt sát cấu trúc tỉnh lược của nguyên văn.
