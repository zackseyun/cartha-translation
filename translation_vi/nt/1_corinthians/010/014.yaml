  text: Διόπερ, ἀγαπητοί μου, φεύγετε ἀπὸ τῆς εἰδωλολατρίας.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/014.yaml
  text: Therefore[a], my beloved, flee from idolatry.
translation:
  language: vi
  text: Vì vậy, những người yêu dấu của tôi, hãy tránh xa việc thờ thần tượng.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “sự thờ hình tượng.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Διόπερ
  choice: Vì vậy
  rationale: Liên từ suy luận, rút ra lời khuyên trực tiếp từ lập luận trước đó; “Vì vậy” tự nhiên và giữ rõ quan hệ lô-gích.
- source_word: ἀγαπητοί μου
  choice: thưa những người tôi yêu dấu
  rationale: Lối xưng hô trực tiếp, trìu mến. Cách dịch này giữ cả đại từ sở hữu “tôi” lẫn sắc thái yêu thương, đồng thời phù hợp với văn phong trang trọng, hiện đại.
- source_word: φεύγετε ἀπὸ
  choice: hãy tránh xa
  rationale: Động từ mệnh lệnh hiện tại số nhiều diễn tả sự khẩn thiết phải lánh khỏi một mối nguy. “Hãy tránh xa” tự nhiên trong tiếng Việt và truyền đạt cả ý chạy khỏi lẫn không dính líu.
- source_word: τῆς εἰδωλολατρίας
  choice: sự thờ thần tượng
  rationale: Danh từ chỉ việc thờ phụng hoặc phụng sự các thần tượng. Cách diễn đạt này rõ nghĩa đối với độc giả hiện đại và không thu hẹp điều cấm chỉ còn thái độ nội tâm.
theological_decisions:
- issue: Phạm vi của điều bị cấm
  choice: Mệnh lệnh trực tiếp phải tránh xa việc thờ thần tượng và sự tham dự vào những thực hành gắn với nó
  alternative: Chỉ cảnh báo hẹp hơn về lòng sùng kính thần tượng ở bên trong
  rationale: Trong văn cảnh gần, Phao-lô cảnh báo về việc dự phần vào các bữa ăn và nghi lễ ngoại giáo. Thuật ngữ Hy Lạp chỉ sự thờ phụng thần tượng nói chung, nên bản dịch không thu hẹp thành một thái độ nội tâm.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “thưa” để lời gọi trìu mến không trở nên gượng; mệnh lệnh “hãy tránh xa” giữ sắc thái khẩn thiết và tự nhiên.
