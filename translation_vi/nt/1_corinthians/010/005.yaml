id: 1CO.10.5
reference: 1 Corinthians 10:5
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀλλ’ οὐκ ἐν τοῖς πλείοσιν αὐτῶν ηὐδόκησεν ὁ θεός, κατεστρώθησαν γὰρ ἐν τῇ ἐρήμῳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/005.yaml
  text: Nevertheless[a], God was not pleased with most of them, for they were struck down in the wilderness.
translation:
  language: vi
  text: Tuy vậy, Đức Chúa Trời đã không hài lòng với phần đông trong số họ, vì họ đã bị quật ngã[a] trong hoang mạc.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “bị đánh gục”, “nằm la liệt” hoặc “bị lật đổ”.'
    reason: Động từ Hy Lạp κατεστρώθησαν có thể gợi hình ảnh bị đánh ngã, bị lật đổ, hoặc thi thể nằm rải ra trong hoang mạc.
lexical_decisions:
- source_word: ἀλλ’
  choice: Tuy vậy
  rationale: Diễn tả rõ sự tương phản mạnh với những đặc ân của dân Y-sơ-ra-ên vừa được kể ở các câu trước, đồng thời tự nhiên trong tiếng Việt hiện đại.
- source_word: οὐκ ἐν τοῖς πλείοσιν αὐτῶν
  choice: không hài lòng với phần đông trong số họ
  rationale: Kết hợp thành ngữ với ηὐδόκησεν được chuyển sang cách nói tự nhiên trong tiếng Việt; “phần đông” giữ nguyên ý nghĩa định lượng của τοῖς πλείοσιν.
- source_word: ηὐδόκησεν
  choice: đã không hài lòng
  rationale: Giữ nghĩa căn bản là không vui lòng hay không lấy làm thỏa lòng; “đã” phản ánh hành động trong quá khứ mà không diễn giải thêm bản chất sự phán xét.
- source_word: ὁ θεός
  choice: Đức Chúa Trời
  rationale: Danh xưng tiếng Việt trang trọng, quen thuộc và tương ứng trực tiếp với chủ ngữ ὁ θεός.
- source_word: κατεστρώθησαν
  choice: đã bị quật ngã
  rationale: Truyền đạt hình ảnh họ bị đánh ngã và chết trong hoang mạc, phù hợp sắc thái thụ động và bối cảnh cảnh báo về sự phán xét, nhưng không thêm tác nhân vốn không được nêu trực tiếp trong mệnh đề.
- source_word: γὰρ
  choice: vì
  rationale: Giới thiệu lý do giải thích cho việc Đức Chúa Trời không hài lòng với phần đông trong số họ.
- source_word: ἐν τῇ ἐρήμῳ
  choice: trong hoang mạc
  rationale: “Hoang mạc” diễn tả vùng hoang vu của hành trình Xuất Ai Cập và giữ sắc thái Kinh Thánh mà không nhất thiết thu hẹp thành sa mạc cát.
theological_decisions:
- issue: Bản chất sự phán xét được diễn tả bởi κατεστρώθησαν
  choice: Diễn tả họ “bị quật ngã” trong hoang mạc, hàm ý cái chết dưới sự phán xét.
  alternative: Dịch trung tính hơn là “nằm rải rác” hoặc “nằm la liệt” trong hoang mạc.
  rationale: Văn cảnh dùng số phận của dân Y-sơ-ra-ên để cảnh báo tín hữu Cô-rinh-tô. “Bị quật ngã” giữ sức nặng cảnh báo và thể thụ động của động từ, nhưng không nói rõ tác nhân hơn mức bản văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu giữ cấu trúc tương phản rồi giải thích của nguyên văn; dấu chú thích được đặt ngay sau cụm từ có phương án dịch khác.
