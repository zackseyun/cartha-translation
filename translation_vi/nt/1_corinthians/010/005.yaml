  terminology: “Đức Chúa Trời” và “hoang mạc” nhất quán với văn phong Kinh Thánh tiếng Việt. Thuật ngữ không áp đặt diễn giải giáo phái; chú thích nêu các phương án dịch một cách cân bằng.
