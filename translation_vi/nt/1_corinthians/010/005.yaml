  source_fidelity: Bản dịch chuyển đạt đúng đối lập của ἀλλ’, ý Đức Chúa Trời không đẹp lòng với đa số dân ấy, và hệ quả được diễn tả bằng κατεστρώθησαν trong hoang mạc. “Bị quật ngã” là cách dịch phù hợp văn cảnh phán xét, đồng thời chú thích bảo lưu các sắc thái hình ảnh khả dĩ hơn của động từ.
