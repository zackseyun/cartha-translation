id: 1CO.10.27
reference: 1 Corinthians 10:27
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸀εἴ τις καλεῖ ὑμᾶς τῶν ἀπίστων καὶ θέλετε πορεύεσθαι, πᾶν τὸ παρατιθέμενον ὑμῖν ἐσθίετε μηδὲν ἀνακρίνοντες διὰ τὴν συνείδησιν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/027.yaml
  text: If one of the unbelievers invites you and you want to go[a], eat whatever is set before you[b], asking no questions for the sake of conscience.
translation:
  language: vi
  text: Nếu một người không tin mời anh chị em và anh chị em muốn đi, hãy ăn bất cứ món gì được dọn ra trước mặt, đừng dò hỏi gì[a] vì lương tâm[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “không xem xét điều gì” hoặc “không tra hỏi gì.” Ý ở đây là không truy xét nguồn gốc của thức ăn.'
    reason: lexical_alternative
  - marker: b
    text: “Lương tâm” được làm rõ ở câu tiếp theo, nơi Phao-lô phân biệt lương tâm của người khác với lương tâm của chính mình.
    reason: cross_reference
lexical_decisions:
- source_word: ἀπίστων
  choice: người không tin
  rationale: Cụm này chỉ những người được đặc trưng là không tin, trong ngữ cảnh có lẽ là chủ nhà không thuộc cộng đồng Cơ Đốc. Cách dịch này rõ ràng, tự nhiên và không thêm sắc thái thù địch.
- source_word: καλεῖ
  choice: mời
  rationale: Trong bối cảnh dùng bữa, động từ này mang nghĩa tự nhiên là mời đến dự, chứ không đơn thuần là gọi.
- source_word: θέλετε πορεύεσθαι
  choice: anh chị em muốn đi
  rationale: Diễn đạt ý muốn hoặc sự sẵn lòng nhận lời mời, đồng thời giữ nguyên tính điều kiện của câu.
- source_word: πᾶν τὸ παρατιθέμενον ὑμῖν
  choice: bất cứ món gì được dọn ra trước mặt
  rationale: Phân từ có mạo từ chỉ thức ăn được đem ra trong bữa ăn; cách dịch này tự nhiên trong tiếng Việt và giữ phạm vi bao quát của πᾶν.
- source_word: ἐσθίετε
  choice: hãy ăn
  rationale: Thể mệnh lệnh hiện tại đưa ra một chỉ dẫn chung; “hãy ăn” truyền đạt mệnh lệnh rõ ràng mà không diễn giải quá mức về thể động từ.
- source_word: μηδὲν ἀνακρίνοντες
  choice: đừng dò hỏi gì
  rationale: ἀνακρίνω có thể mang nghĩa xem xét, điều tra hoặc tra hỏi. Trong ngữ cảnh thức ăn có thể liên quan đến việc cúng thần tượng, ý chính là không truy xét nguồn gốc của món ăn.
- source_word: διὰ τὴν συνείδησιν
  choice: vì lương tâm
  rationale: διά với đối cách biểu thị lý do hoặc điều cần cân nhắc. Cách dịch ngắn gọn này giữ nguyên sự chưa xác định ở câu này về lương tâm của ai.
theological_decisions:
- issue: Ý nghĩa của συνείδησις trong ngữ cảnh
  choice: Giữ cách nói chung “vì lương tâm,” không xác định ngay đó là lương tâm của người tin hay của người khác.
  alternative: Dịch rõ là “vì lương tâm của chính mình” hoặc “vì lương tâm của người kia.”
  rationale: Nguyên văn ở câu này cố ý ngắn gọn; câu tiếp theo mới phân biệt lương tâm của người khác với lương tâm của người nói. Bản dịch không giải quyết trước sự căng thẳng thần học và ngữ cảnh ấy.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” cho đại từ số nhiều ὑμᾶς/ὑμῖν; dùng “món gì được dọn ra” để làm rõ ngữ cảnh bữa ăn mà không thêm thông tin ngoài nguyên văn. Các dấu chú thích được đặt đúng tại cụm từ mà mỗi chú thích giải thích.
