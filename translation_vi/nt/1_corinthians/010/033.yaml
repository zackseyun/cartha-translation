  source_fidelity: 'Bản dịch truyền đạt đúng cấu trúc so sánh, sự đối lập giữa lợi ích riêng và lợi ích của nhiều người, cùng mệnh đề mục đích «để họ được cứu». Tuy nhiên, «cố làm đẹp lòng» thêm sắc thái ‘cố gắng/thử làm’ không có trong ἀρέσκω, vốn ở đây là động từ hiện tại trực tiếp: «làm đẹp lòng».'
