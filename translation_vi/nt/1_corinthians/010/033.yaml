  text: καθὼς κἀγὼ πάντα πᾶσιν ἀρέσκω, μὴ ζητῶν τὸ ἐμαυτοῦ ⸀σύμφορον ἀλλὰ τὸ τῶν πολλῶν, ἵνα σωθῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/033.yaml
  text: just as I also please everyone in everything[a], not seeking my own advantage but that of the many[b], so that they may be saved.
translation:
  language: vi
  text: cũng như tôi làm đẹp lòng mọi người trong mọi việc[a], không tìm lợi ích cho riêng mình, nhưng tìm lợi ích cho nhiều người[b], để họ được cứu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch sát hơn: “mọi điều cho mọi người.” Tiếng Hy Lạp diễn đạt theo nghĩa đen là “mọi sự đối với mọi người,” nói đến sự thích nghi rộng rãi vì lợi ích của người khác.'
    reason: lexical_alternative
  - marker: b
    text: 'Hay: “điều có lợi cho riêng mình, nhưng điều có lợi cho nhiều người.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς κἀγὼ
  choice: cũng như tôi
  rationale: Giữ lực so sánh với lời khuyên ở câu trước và nêu chính Phao-lô làm gương.
- source_word: πάντα πᾶσιν ἀρέσκω
  choice: cố làm đẹp lòng mọi người trong mọi việc
  rationale: Diễn đạt tự nhiên ý rộng của nguyên văn, đồng thời “cố” cho thấy đây là chủ ý thích nghi vì lợi ích người khác, không phải lúc nào cũng thực sự khiến mọi người hài lòng.
- source_word: μὴ ζητῶν τὸ ἐμαυτοῦ σύμφορον
  choice: không tìm lợi ích cho riêng mình
  rationale: Giữ dạng phân từ chỉ cách thức hoặc động cơ và nghĩa của σύμφορον là điều có lợi.
- source_word: ἀλλὰ τὸ τῶν πολλῶν
  choice: nhưng tìm lợi ích cho nhiều người
  rationale: Bổ sung động từ và danh từ bị lược trong tiếng Hy Lạp để câu tiếng Việt rõ ràng, nhưng vẫn giữ đối lập với lợi ích riêng của Phao-lô.
- source_word: ἵνα σωθῶσιν
  choice: để họ được cứu
  rationale: Giữ quan hệ mục đích và thể bị động của động từ σῴζω, không xác định thêm tác nhân trong bản dịch.
theological_decisions:
- issue: Phạm vi và nghĩa của σωθῶσιν
  choice: để họ được cứu
  alternative: để họ được giúp đỡ; để họ được bảo toàn
  rationale: Trong văn cảnh truyền giáo và cách dùng thông thường của Phao-lô, động từ mang nghĩa cứu rỗi; cách dịch vẫn giữ thể bị động và không nói rõ hơn điều nguyên văn không nói.
- issue: Ý nghĩa của việc Phao-lô “làm đẹp lòng” người khác
  choice: cố làm đẹp lòng mọi người
  alternative: chiều theo mọi người; tìm sự tán thành của mọi người
  rationale: Mệnh đề tiếp theo xác định động cơ là lợi ích và sự cứu rỗi của người khác, chứ không phải xu nịnh hay thỏa hiệp để được họ chấp thuận.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Cấu trúc lặp “tìm lợi ích” làm sáng tỏ phép tỉnh lược trong nguyên văn. Các dấu chú thích [a], [b] đều được đặt trong chính văn.
