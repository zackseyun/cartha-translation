  naturalness: Chính văn nhìn chung tự nhiên, trang trọng và rõ nghĩa. Thêm “điều đó” sau “đã báo” giúp tiếng Việt trọn ý và làm rõ nội dung được thông báo mà không thêm nghĩa.
  terminology: “Lương tâm” là cách dịch chuẩn cho συνείδησις. “Đã được dâng làm lễ tế” bảo toàn nghĩa hiến tế của ἱερόθυτος mà không áp đặt đối tượng thờ cúng. Chú thích b xử lý đúng việc câu kế tiếp xác định lương tâm của người khác.
