    rationale: Cụm này có thể diễn tả thức ăn phục vụ một nghi lễ nói chung, trong khi ἱερόθυτος chỉ vật đã được dâng trong lễ hiến tế. Nên sửa để giữ rõ sắc thái “đã được dâng.”
  - severity: low
