id: 1CO.10.28
reference: 1 Corinthians 10:28
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐὰν δέ τις ὑμῖν εἴπῃ· Τοῦτο ⸀ἱερόθυτόν ἐστιν, μὴ ἐσθίετε δι’ ἐκεῖνον τὸν μηνύσαντα καὶ τὴν ⸀συνείδησιν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/028.yaml
  text: But if someone says to you, “This has been offered in sacrifice,” do not eat it, for the sake of the one who informed you and for conscience’ sake.
translation:
  language: vi
  text: 'Nhưng nếu có người nói với anh chị em: “Thứ này đã được dâng làm lễ tế”[a], thì đừng ăn, vì người đã báo điều đó cho anh chị em và vì lương tâm[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Đây là thức ăn đã được dâng làm lễ tế.” Tính từ Hy Lạp chỉ vật đã được dâng trong một nghi lễ hiến tế.'
    reason: lexical_alternative
  - marker: b
    text: Tức là lương tâm của người kia, không phải lương tâm của chính anh chị em; xem câu kế tiếp.
    reason: cross_reference
lexical_decisions:
- source_word: ἐὰν δέ τις ὑμῖν εἴπῃ
  choice: Nhưng nếu có người nói với anh chị em
  rationale: ἐὰν với động từ giả định giới thiệu một tình huống có điều kiện; τις mang nghĩa bất định, được diễn đạt tự nhiên là “có người.” δέ đánh dấu sự tương phản với trường hợp vừa nêu trước đó. “Anh chị em” truyền đạt số nhiều ὑμῖν bằng lối xưng hô cộng đồng tự nhiên và trang trọng trong tiếng Việt.
- source_word: Τοῦτο ἱερόθυτόν ἐστιν
  choice: Thứ này đã được dâng làm lễ tế
  rationale: ἱερόθυτος chỉ vật đã được dâng trong một nghi lễ hiến tế, đặc biệt là thức ăn hoặc thịt. Cách dịch này giữ phạm vi nghĩa của từ mà không tự thêm “thần tượng,” vốn không hiện diện trong chính từ ngữ của câu này.
- source_word: μὴ ἐσθίετε
  choice: thì đừng ăn
  rationale: Mệnh lệnh hiện tại đi với μή tạo lời cấm. Tiếng Việt có thể lược tân ngữ vì thức ăn vừa được nhắc đến đã rõ trong ngữ cảnh.
- source_word: δι’ ἐκεῖνον τὸν μηνύσαντα
  choice: vì người đã báo cho anh chị em
  rationale: διά với đối cách nêu lý do hoặc sự lưu tâm đến người kia; μηνύσαντα có nghĩa là báo, cho biết hoặc tiết lộ. “Vì” giữ được sự cô đọng và có thể bao hàm ý hành động vì lưu tâm đến người đã báo.
- source_word: καὶ τὴν συνείδησιν
  choice: và vì lương tâm
  rationale: συνείδησις là “lương tâm.” Cụm từ Hy Lạp cô đọng và không nói ngay trong câu này lương tâm của ai, nên bản dịch giữ nguyên độ mở đó; câu kế tiếp sẽ làm rõ.
theological_decisions:
- issue: “Lương tâm” trong τὴν συνείδησιν là của ai
  choice: 'Giữ câu chính ở dạng không xác định: “vì lương tâm,” đồng thời chú thích rằng mạch văn kế tiếp cho thấy đó là lương tâm của người kia.'
  alternative: Dịch thẳng là “vì lương tâm của người ấy” hoặc hiểu là lương tâm của người ăn.
  rationale: Bản thân câu 28 không gắn đại từ sở hữu với “lương tâm,” còn câu kế tiếp giải thích rằng Phao-lô không nói đến lương tâm của người ăn mà của người khác. Giữ cách nói cô đọng trong chính văn bảo toàn diễn tiến lập luận và tránh giải quyết sớm điều tác giả làm rõ ở câu sau.
- issue: ἱερόθυτος có nên được dịch là “đã cúng cho thần tượng” hay không
  choice: Dịch “đã được dâng làm lễ tế.”
  alternative: “thịt đã cúng cho thần tượng.”
  rationale: Ngữ cảnh rộng liên quan đến thần tượng, nhưng chính ἱερόθυτος nói đến vật được dâng làm lễ tế mà không chứa danh từ “thần tượng.” Cách chọn giữ sát bằng chứng từ vựng và không đưa phần diễn giải ngữ cảnh vào chính văn.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh chị em” để diễn đạt đại từ số nhiều trong lời nói với cộng đồng. Câu văn giữ sự cô đọng của nguyên bản, còn hai chú thích giải thích phương án từ vựng và quy chiếu của “lương tâm.”
