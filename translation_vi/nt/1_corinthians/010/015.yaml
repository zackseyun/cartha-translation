  text: ὡς φρονίμοις λέγω· κρίνατε ὑμεῖς ὅ φημι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/015.yaml
  text: I speak as to sensible people[b][a]; judge for yourselves what I say.
translation:
  language: vi
  text: Tôi nói với anh chị em như nói với những người khôn ngoan[a]; chính anh chị em hãy xét điều tôi nói.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “những người sáng suốt” hoặc “những người thận trọng.”'
    reason: lexical_alternative
  - marker: b
    text: 'Hoặc: “anh chị em hãy tự mình xét điều tôi nói.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς
  choice: như với
  rationale: Diễn tả cách Phao-lô nói với người nghe, tức ông xem họ là những người có khả năng suy xét.
- source_word: φρονίμοις
  choice: những người hiểu biết
  rationale: Từ này chỉ sự khôn ngoan thực tiễn, thận trọng và biết suy xét. “Hiểu biết” tự nhiên trong tiếng Việt hiện đại, không cường điệu thành lời khen tuyệt đối.
- source_word: λέγω
  choice: Tôi nói
  rationale: Cách dịch trực tiếp, tự nhiên, đồng thời giữ được sự lặp ý nhẹ với φημι ở cuối câu.
- source_word: κρίνατε
  choice: hãy xét
  rationale: Động từ mệnh lệnh kêu gọi người nghe tự đánh giá điều được nói. “Xét” giữ sắc thái phán đoán mà không gợi chủ yếu đến việc kết án.
- source_word: ὑμεῖς
  choice: chính anh chị em
  rationale: Đại từ được nêu rõ trong nguyên văn để nhấn mạnh chủ thể; “chính” bảo toàn sự nhấn mạnh ấy.
- source_word: ὅ
  choice: điều
  rationale: Đại từ quan hệ trung tính làm tân ngữ; tiếng Việt diễn đạt tự nhiên là “điều …”.
- source_word: φημι
  choice: tôi nói
  rationale: Bảo toàn nghĩa cơ bản “nói/khẳng định” và cách diễn đạt ngắn gọn của nguyên văn.
theological_decisions:
- issue: Cách Phao-lô mô tả người nghe về mặt tu từ
  choice: Dịch tích cực nhưng vừa phải là “những người hiểu biết,” cho thấy họ có khả năng suy xét mà không hàm ý tán thành mọi hành vi của họ.
  alternative: Có thể hiểu là “những người khôn ngoan” theo nghĩa khen thẳng hoặc mang sắc thái mỉa mai.
  rationale: Nguyên văn không xác định rõ có ý mỉa mai hay không. Bản dịch duy trì độ mở ấy và không áp đặt một cách giải thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Anh chị em” diễn đạt đại từ số nhiều chỉ cộng đồng được thư gửi đến; “chính” tái hiện sự nhấn mạnh của ὑμεῖς. Các dấu chú thích [a], [b] đều được đặt trong chính văn.
