- from: Tôi nói với anh chị em như với những người hiểu biết[a]; chính anh chị em hãy xét điều tôi nói.[b]
  to: Tôi nói với anh chị em như nói với những người khôn ngoan[a]; chính anh chị em hãy xét điều tôi nói.[b]
  rationale: Sửa “những người hiểu biết” thành “những người khôn ngoan” để chuyển tải φρονίμοις sát hơn, đồng thời giữ tính mở về sắc thái tu từ (khen ngợi hay mỉa mai). Điều chỉnh chú thích a theo các lựa chọn từ vựng thực sự gần nghĩa với φρονίμοις. Chính văn vẫn bảo toàn mệnh lệnh κρίνατε và sự nhấn mạnh của ὑμεῖς.
  reviewer_model: gpt-5.6-terra
