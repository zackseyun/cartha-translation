  language: vi
  text: Hay chúng ta khơi dậy lòng ghen của Chúa sao? Chẳng lẽ chúng ta mạnh hơn Ngài?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἢ
  choice: Hay
  rationale: Giữ chức năng nối với lập luận và nêu một khả năng thay thế mang tính chất vấn.
- source_word: παραζηλοῦμεν
  choice: muốn khiến ... ghen
  rationale: Động từ mang nghĩa khơi dậy lòng ghen; cách diễn đạt này tự nhiên trong tiếng Việt và giữ sắc thái cố ý thách thức hàm chứa trong câu hỏi.
- source_word: τὸν κύριον
  choice: Chúa
  rationale: Cách tương đương chuẩn, trang trọng và phù hợp văn mạch Tân Ước.
- source_word: μὴ
  choice: Chẳng lẽ
  rationale: Biểu thị câu hỏi tu từ mong đợi câu trả lời phủ định.
- source_word: ἰσχυρότεροι αὐτοῦ
  choice: mạnh hơn Ngài
  rationale: Giữ nguyên phép so sánh và đại từ chỉ Chúa, không thêm cách giải thích thần học.
theological_decisions:
- issue: Sắc thái về lòng ghen của Chúa
  choice: khiến Chúa ghen
  alternative: chọc giận Chúa
  rationale: Giữ trực tiếp trường nghĩa của παραζηλόω và sự liên hệ với lòng ghen thánh trong văn mạch thờ thần tượng, thay vì thu hẹp thành cơn giận nói chung.
- issue: Lực của câu hỏi thứ hai
  choice: Chẳng lẽ chúng ta mạnh hơn Ngài?
  alternative: Chắc chắn chúng ta không mạnh hơn Ngài, phải không?
  rationale: Câu hỏi ngắn gọn phản ánh μὴ, tự nhiên trong tiếng Việt và vẫn rõ rằng câu trả lời được mong đợi là không.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu; giữ hai câu hỏi tu từ súc tích của nguyên bản.
