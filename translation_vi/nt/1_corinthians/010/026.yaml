id: 1CO.10.26
reference: 1 Corinthians 10:26
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τοῦ ⸂κυρίου γὰρ⸃ ἡ γῆ καὶ τὸ πλήρωμα αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/026.yaml
  text: For the earth is the Lord’s[a], and all that fills it.
translation:
  language: vi
  text: Vì trái đất và mọi vật trong đó đều thuộc về Chúa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Trích Thi Thiên 24:1. Dịch sát hơn: “trái đất và sự đầy dẫy của nó đều thuộc về Chúa.”'
    reason: cross_reference
lexical_decisions:
- source_word: κυρίου
  choice: thuộc về Chúa
  rationale: Cấu trúc sở hữu τοῦ κυρίου được diễn đạt tự nhiên trong tiếng Việt bằng “thuộc về Chúa”, giữ nguyên tước hiệu κύριος là “Chúa” và sức nặng của lời trích dẫn Kinh Thánh.
- source_word: γάρ
  choice: Vì
  rationale: γάρ nêu cơ sở Kinh Thánh cho lập luận ngay trước đó; “Vì” diễn đạt rõ quan hệ giải thích/nguyên nhân.
- source_word: γῆ
  choice: trái đất
  rationale: Trong lời trích Thi Thiên 24:1, γῆ mang nghĩa bao quát về toàn thể trái đất hơn là một vùng đất riêng biệt.
- source_word: πλήρωμα
  choice: mọi vật trong đó
  rationale: τὸ πλήρωμα αὐτῆς chỉ toàn bộ những gì làm đầy hoặc chứa trong trái đất. “Mọi vật trong đó” tự nhiên, dễ hiểu và truyền đạt đúng ý hơn lối dịch sát nhưng gượng là “sự đầy dẫy của nó”.
- source_word: αὐτῆς
  choice: trong đó
  rationale: Đại từ giống cái αὐτῆς quy chiếu về γῆ; trong cụm tiếng Việt này, “trong đó” diễn đạt tự nhiên mối liên hệ với trái đất.
theological_decisions:
- issue: Cách dịch κύριος trong lời trích dẫn có sức nặng thần học
  choice: Chúa
  alternative: CHÚA; Chủ
  rationale: Bản Hy Lạp của Phao-lô dùng κύριος. “Chúa” giữ đúng cách dùng Tân Ước và ý nghĩa của lời trích mà không áp đặt quy ước chữ hoa dành riêng cho danh YHWH trong văn bản Hê-bơ-rơ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu được tái cấu trúc theo cú pháp tiếng Việt để biểu đạt tự nhiên quan hệ sở hữu, đồng thời giữ “Vì” nhằm nối câu này với lập luận trước đó.
