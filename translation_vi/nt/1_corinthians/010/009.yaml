source:
  edition: SBLGNT
  text: μηδὲ ἐκπειράζωμεν τὸν ⸀Χριστόν, ⸀καθώς τινες αὐτῶν ἐπείρασαν, καὶ ὑπὸ τῶν ὄφεων ⸀ἀπώλλυντο.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/009.yaml
  text: Nor should we put Messiah to the test[b][a], as some of them tested him and were being destroyed by the snakes.
translation:
  language: vi
  text: Chúng ta cũng đừng thử thách Đấng Mê-si-a[a], như một số người trong họ đã thử thách Ngài và đã bị rắn[b] tiêu diệt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Một số bản chép tay ghi “Chúa” thay cho “Đấng Mê-si-a” (hay “Đấng Ki-tô”).
    reason: textual_variant
  - marker: b
    text: Cũng có thể dịch là “xà”.
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδὲ
  choice: Chúng ta cũng đừng
  rationale: Nối tiếp chuỗi lời cảnh báo trong đoạn văn, đồng thời giữ lực khuyên răn của thể giả định ngôi thứ nhất số nhiều.
- source_word: ἐκπειράζωμεν
  choice: thử thách
  rationale: Diễn tả việc đặt một người vào phép thử không chính đáng; tự nhiên hơn trong tiếng Việt so với cách hiểu là dụ dỗ phạm tội.
- source_word: τὸν Χριστόν
  choice: Đấng Mê-si
  rationale: Χριστός được dùng như tước hiệu; “Đấng Mê-si” truyền đạt nghĩa của tước hiệu thay vì coi đây như một tên riêng.
- source_word: καθώς
  choice: như
  rationale: Giới thiệu sự so sánh với hành động của một số người Ít-ra-ên trong hoang mạc.
- source_word: τινες αὐτῶν
  choice: một số người trong họ
  rationale: Giữ nguyên phạm vi không xác định và chỉ một bộ phận trong thế hệ hoang mạc.
- source_word: ἐπείρασαν
  choice: đã thử thách Ngài
  rationale: Động từ chỉ hành động lịch sử; bổ sung đại từ làm tân ngữ theo đối tượng được hàm ý từ mệnh đề trước.
- source_word: ὑπὸ τῶν ὄφεων
  choice: bị rắn
  rationale: “Rắn” là từ hiện đại, thông dụng cho ὄφις; thể bị động giữ vai trò tác nhân của loài rắn.
- source_word: ἀπώλλυντο
  choice: đang bị ... tiêu diệt
  rationale: Thể chưa hoàn thành trình bày sự tiêu diệt như một diễn tiến, thay vì chỉ tóm lược kết quả.
theological_decisions:
- issue: Đối tượng được thử thách và dị bản của τὸν Χριστόν
  choice: Đấng Mê-si
  alternative: Chúa; Đấng Ki-tô
  rationale: Bản SBLGNT đọc Χριστόν, tạo nên sự liên hệ mạnh giữa Đấng Mê-si và Đấng mà dân Ít-ra-ên đã thử thách trong hoang mạc. Dị bản “Chúa” được nêu trong chú thích để không che khuất vấn đề văn bản.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc “Chúng ta cũng đừng” giữ sắc thái khuyên răn chung; “đang bị ... tiêu diệt” chủ ý phản ánh diễn tiến của động từ thể chưa hoàn thành.
