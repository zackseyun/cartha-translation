revisions:
- from: Vậy, tôi đang nói gì? Rằng thức ăn đã cúng cho thần tượng có nghĩa lý gì[a], hay rằng thần tượng có nghĩa lý gì?
  to: Vậy thì tôi muốn nói gì? Có phải thức ăn cúng cho thần tượng có là gì không, hay thần tượng có là gì không?
  rationale: Đổi cách diễn đạt của hai lần τί ἐστιν thành “có là gì không” để bảo toàn tính tu từ và sự mơ hồ có chủ ý của nguyên văn. Cũng điều chỉnh lời dẫn câu hỏi cho tự nhiên hơn trong tiếng Việt, không thay đổi nội dung.
