source:
  edition: SBLGNT
  text: τί οὖν φημι; ὅτι ⸂εἰδωλόθυτόν τί ἐστιν, ἢ ὅτι εἴδωλόν⸃ τί ἐστιν;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/019.yaml
  text: What then am I saying? That food sacrificed to idols is anything[b][a], or that an idol is anything?
translation:
  language: vi
  text: Vậy thì tôi muốn nói gì? Có phải thức ăn cúng cho thần tượng có là gì không, hay thần tượng có là gì không?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τί οὖν φημι
  choice: Vậy, tôi đang nói gì?
  rationale: Giữ câu hỏi tu từ, ngôi thứ nhất và sắc thái hiện tại của φημί, đồng thời diễn đạt tự nhiên trong tiếng Việt hiện đại.
- source_word: ὅτι
  choice: Rằng
  rationale: Dẫn vào nội dung mà lời của Phao-lô có thể bị hiểu là đang khẳng định, sát với cấu trúc Hy Lạp.
- source_word: εἰδωλόθυτόν
  choice: thức ăn đã cúng cho thần tượng
  rationale: Trong mạch văn về việc ăn, từ này chỉ thức ăn, đặc biệt là thịt, liên quan đến lễ tế ngoại giáo; cách dịch này rõ ràng mà không thu hẹp thành chỉ thịt.
- source_word: τί ἐστιν
  choice: có nghĩa lý gì
  rationale: Truyền đạt thành ngữ hỏi liệu sự vật có thực chất hay tầm quan trọng nào trong phương diện đang bàn, đồng thời duy trì lực tu từ của câu.
- source_word: ἢ
  choice: hay
  rationale: Giữ liên từ lựa chọn nối hai vế song song.
- source_word: εἴδωλον
  choice: thần tượng
  rationale: Trong ngữ cảnh, từ này chỉ vật được thờ như thần; “thần tượng” là cách gọi quen thuộc và trang trọng trong tiếng Việt Kinh Thánh.
theological_decisions:
- issue: Câu hỏi của Phao-lô có khẳng định thức ăn cúng thần tượng hoặc thần tượng có thực hữu hay ý nghĩa thiêng liêng nào không
  choice: Giữ hai câu hỏi tu từ bằng cụm “có nghĩa lý gì” mà không thêm lời giải thích thần học vào chính văn.
  alternative: Dịch rõ hơn là “có thực chất gì” hoặc “thực sự tồn tại”.
  rationale: τί ἐστιν để ngỏ phương diện chính xác—sự hiện hữu, thực chất hay tầm quan trọng. Bản dịch nên giữ độ căng và mơ hồ này, không biến lời Phao-lô thành một mệnh đề triết học cụ thể.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. “Có nghĩa lý gì” tự nhiên hơn cách dịch sát chữ “là gì đó”, đồng thời không quyết định dứt khoát rằng τί ἐστιν chỉ nói về sự tồn tại hay chỉ nói về tầm quan trọng.
