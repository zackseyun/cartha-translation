id: 1CO.10.21
reference: 1 Corinthians 10:21
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οὐ δύνασθε ποτήριον κυρίου πίνειν καὶ ποτήριον δαιμονίων· οὐ δύνασθε τραπέζης κυρίου μετέχειν καὶ τραπέζης δαιμονίων.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/021.yaml
  text: You cannot drink the cup of the Lord and the cup of demons[a]; you cannot partake of the table of the Lord and the table of demons.
translation:
  language: vi
  text: Anh chị em không thể vừa uống chén của Chúa vừa uống chén của các quỷ; anh chị em không thể vừa dự phần nơi bàn của Chúa vừa dự phần nơi bàn của các quỷ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐ δύνασθε
  choice: anh chị em không thể
  rationale: Diễn đạt trực tiếp sự bất khả dung hợp mang tính dứt khoát; đại từ số nhiều bao hàm cộng đồng tín hữu được Phao-lô ngỏ lời.
- source_word: ποτήριον
  choice: chén
  rationale: Tương đương tự nhiên và trang trọng trong tiếng Việt, đồng thời giữ nguyên hình ảnh nghi lễ và sự dự phần.
- source_word: κυρίου
  choice: của Chúa
  rationale: Giữ quan hệ sở hữu của sở cách và thế song song với “của các quỷ”.
- source_word: πίνειν
  choice: uống
  rationale: Động từ nguyên mẫu sau δύνασθε được diễn đạt tự nhiên bằng “uống”, không cần thêm sắc thái tiếp diễn.
- source_word: δαιμονίων
  choice: các quỷ
  rationale: Giữ rõ ý về các thực thể tà linh mang tính ngôi vị, thay vì diễn giải rộng thành “tà thần” hay “thần dữ”.
- source_word: τραπέζης
  choice: bàn
  rationale: Là tương đương trực tiếp, giữ được hình ảnh bàn ăn mang ý nghĩa thờ phượng và cộng đồng mà không diễn giải thành “bàn thờ”.
- source_word: μετέχειν
  choice: dự phần nơi
  rationale: Diễn đạt sự tham dự và chia sẻ thực sự, phù hợp văn phong Kinh Thánh hiện đại mà không quá khẩu ngữ.
- source_word: καὶ
  choice: vừa… vừa…
  rationale: Cấu trúc tương liên tự nhiên trong tiếng Việt làm nổi bật hai sự dự phần đối nghịch, đồng thời giữ lực tu từ của καὶ trong hai mệnh đề song song.
theological_decisions:
- issue: Tính chất của lời phủ định đối với việc dự phần bàn của Chúa và sự thờ phượng các quỷ
  choice: Một sự bất khả dung hợp dứt khoát giữa hai hình thức dự phần
  alternative: Chỉ là lời khuyên nên tránh hoặc một lời cường điệu tu từ
  rationale: Hai lần οὐ δύνασθε tạo nên lời khẳng định song song và tuyệt đối. Bản dịch giữ nguyên sức căng này bằng “không thể” mà không giải thích thêm bản chất bí tích hay cơ chế của sự dự phần.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh chị em” để thể hiện ngôi thứ hai số nhiều trong lời Phao-lô nói với cả cộng đồng; lặp lại đầy đủ hai vế nhằm giữ nhịp điệu và sức nhấn mạnh của nguyên văn.
