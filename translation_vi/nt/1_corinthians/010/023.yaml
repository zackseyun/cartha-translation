base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/023.yaml
  text: “All things are permitted,” but not all things are beneficial[a]. “All things are permitted,” but not all things build up.
translation:
  language: vi
  text: “Mọi sự đều được phép,” nhưng không phải mọi sự đều có ích.[a] “Mọi sự đều được phép,” nhưng không phải mọi sự đều gây dựng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Mọi sự đều hợp pháp.” Cụm từ Hy Lạp có thể nói về điều được phép hoặc điều hợp pháp. Ngoặc kép phản ánh cách hiểu có khả năng cao rằng đây là khẩu hiệu của người Cô-rinh-tô được Phao-lô nhắc lại để nêu giới hạn; bản Hy Lạp không đánh dấu lời trích dẫn bằng ngoặc kép.'
    reason: lexical_alternative_and_interpretive_punctuation
lexical_decisions:
- source_word: Πάντα
  choice: Mọi sự
  rationale: Tính từ trung tính số nhiều được dùng như danh từ, mang phạm vi khái quát. “Mọi sự” giữ được cấu trúc ngắn gọn, lặp lại như một khẩu hiệu và có sắc thái trang trọng tự nhiên trong tiếng Việt.
- source_word: ἔξεστιν
  choice: đều được phép
  rationale: Động từ chỉ điều được phép hoặc hợp lệ. “Được phép” rõ nghĩa trong tiếng Việt hiện đại và tránh giới hạn câu vào sắc thái pháp lý của “hợp pháp”.
- source_word: ἀλλ’
  choice: nhưng
  rationale: Liên từ đối lập đơn giản; “nhưng” tái hiện trực tiếp hai vế tương phản cô đọng.
- source_word: συμφέρει
  choice: đều có ích
  rationale: Từ này chỉ điều có lợi, hữu ích hoặc đem lại lợi ích. “Có ích” tự nhiên, dễ hiểu và không mang sắc thái thương mại như “sinh lợi”.
- source_word: οἰκοδομεῖ
  choice: đều xây dựng
  rationale: Giữ hình ảnh ẩn dụ “xây dựng” mà Phao-lô thường dùng về việc làm cho người khác hoặc cộng đồng được vững mạnh. Ngữ cảnh kế tiếp làm rõ chiều kích hướng đến tha nhân.
theological_decisions:
- issue: Có nên đánh dấu Πάντα ἔξεστιν là lời trích dẫn một khẩu hiệu của người Cô-rinh-tô hay không
  choice: Đặt cụm “Mọi sự đều được phép” trong ngoặc kép ở cả hai lần xuất hiện.
  alternative: Không dùng ngoặc kép và hiểu đây là lời tuyên bố trực tiếp, không được đánh dấu, của Phao-lô.
  rationale: Nhiều bằng chứng tu từ cho thấy Phao-lô đang nhắc lại một khẩu hiệu rồi giới hạn nó bằng hai mệnh đề đối lập. Tuy nhiên, bản Hy Lạp cổ không có ngoặc kép hiện đại, nên đây là quyết định diễn giải về dấu câu chứ không phải một dị bản; chú thích bảo lưu khả năng khác.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Giữ nguyên phép lặp cân xứng cùng ẩn dụ “xây dựng”; tránh từ “gây dựng” vì có thể mang sắc thái biệt ngữ tôn giáo. Dùng “mọi sự” thay vì “tất cả mọi thứ” để bảo toàn nhịp câu cô đọng.
