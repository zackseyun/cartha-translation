reference: 1 Corinthians 10:4
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ πάντες τὸ αὐτὸ ⸂πνευματικὸν ἔπιον πόμα⸃, ἔπινον γὰρ ἐκ πνευματικῆς ἀκολουθούσης πέτρας, ἡ ⸂πέτρα δὲ⸃ ἦν ὁ Χριστός·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/004.yaml
  text: and all drank the same spiritual drink[a], for they were drinking from a spiritual rock that followed them[b], and the rock was the Messiah.
translation:
  language: vi
  text: và tất cả đều uống cùng một thức uống thuộc linh, vì họ vẫn uống từ một tảng đá thuộc linh đi theo họ; và tảng đá ấy chính là Đấng Ki-tô.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “Đấng Mê-si-a.” Từ Hy Lạp Χριστός là một tước hiệu có nghĩa là “Đấng Được Xức Dầu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πνευματικὸν ... πόμα
  choice: thức uống thuộc linh
  rationale: Giữ nguyên thuật ngữ giàu sức nặng thần học của Phao-lô và sự song hành với “thức ăn thuộc linh” ở câu trước, thay vì thu hẹp thành “siêu nhiên” hay “tượng trưng”.
- source_word: ἔπιον
  choice: đều uống
  rationale: Động từ aorist tóm lược kinh nghiệm chung của toàn thể thế hệ trong hoang mạc; “đều” đồng thời chuyển tải πάντες một cách tự nhiên.
- source_word: ἔπινον
  choice: vẫn uống
  rationale: Thể imperfect diễn tả hành động tiếp diễn hoặc lặp lại trong quá khứ; “vẫn uống” phân biệt sắc thái này với ἔπιον ở mệnh đề trước.
- source_word: ἐκ πνευματικῆς ἀκολουθούσης πέτρας
  choice: từ một vầng đá thuộc linh đi theo họ
  rationale: Danh từ không có mạo từ được dịch là “một vầng đá”; phân từ hiện tại ἀκολουθούσης được giữ bằng “đi theo”, biểu đạt tính tiếp diễn mà không làm câu tiếng Việt nặng nề.
- source_word: πέτρα
  choice: vầng đá
  rationale: πέτρα chỉ khối đá hoặc vách đá, không phải viên đá nhỏ; “vầng đá” vừa tự nhiên trong văn phong Kinh Thánh vừa bảo toàn hình ảnh loại hình học.
- source_word: ἡ πέτρα δὲ ἦν
  choice: và vầng đá ấy chính là
  rationale: “Và” thể hiện sắc thái nối kết nhẹ của δέ; “ấy” phản ánh mạo từ xác định và hồi chỉ về vầng đá vừa nói, còn “chính là” truyền đạt rõ cấu trúc đồng nhất mà không giải nghĩa thêm.
- source_word: ὁ Χριστός
  choice: Đấng Ki-tô
  rationale: Χριστός ở đây mang chức năng tước hiệu trong mệnh đề đồng nhất. “Đấng Ki-tô” là cách diễn đạt tiếng Việt quen thuộc, trang trọng, và giữ liên hệ trực tiếp với thuật ngữ Hy Lạp; chú thích nêu nghĩa “Đấng Mê-si-a”.
- source_word: πάντες τὸ αὐτὸ
  choice: tất cả đều ... cùng một
  rationale: Bảo toàn sự nhấn mạnh của Phao-lô rằng cả đoàn dân cùng chia sẻ một kinh nghiệm.
theological_decisions:
- issue: Mệnh đề đồng nhất “vầng đá ấy chính là Đấng Ki-tô”
  choice: Giữ nguyên lời đồng nhất trực tiếp, có sức nặng loại hình học và thần học.
  alternative: “vầng đá tượng trưng cho Đấng Ki-tô”
  rationale: Hy Lạp dùng mệnh đề hệ từ trực tiếp, ἡ πέτρα δὲ ἦν ὁ Χριστός. Dịch thành “tượng trưng cho” sẽ âm thầm giải quyết sự căng thẳng thần học mà nguyên văn để ngỏ.
- issue: Ý nghĩa của πνευματικός đối với thức uống và vầng đá
  choice: Giữ “thuộc linh”.
  alternative: “tượng trưng” hoặc “siêu nhiên”
  rationale: “Thuộc linh” bảo toàn cách gọi lặp lại của Phao-lô về sự chu cấp đến từ Đức Chúa Trời và có ý nghĩa thần học, thay vì thu hẹp thuật ngữ vào một cách giải thích.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Cấu trúc câu bám sát lập luận Hy Lạp; dùng “vẫn uống” để thể hiện sắc thái tiếp diễn của imperfect và “đi theo họ” để giữ tính tiếp diễn của phân từ hiện tại. Dấu chú thích [a] được đặt ngay sau “Đấng Ki-tô”, là từ mà chú thích giải thích.
