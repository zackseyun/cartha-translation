review_pass:
  verdict: revise
  source_fidelity: Bản dịch phản ánh đúng mệnh lệnh συνεχ diễn với μηδέ, sắc thái trở thành của γίνεσθε, sự đối chiếu với một số người trong dân, và nhịp trích dẫn từ Xuất Ai Cập 32:6. Tuy nhiên, “ăn uống” gộp hai động từ φαγεῖν καὶ πεῖν; trong một bản theo tương đương tối ưu, “để ăn và uống” giữ rõ từng thành tố hơn. “Thờ hình tượng” là cách gọi tôn giáo chuẩn xác và ít dễ liên tưởng đến nghĩa hiện đại phổ biến của “thần tượng” (người nổi tiếng).
  naturalness: Câu văn tự nhiên, trang trọng, và nhịp “ngồi xuống ... rồi đứng dậy ...” phù hợp tiếng Việt hiện đại. Bản chỉnh sửa vẫn giữ nhịp này, đồng thời làm rõ quan hệ mục đích bằng “để ăn và uống.”
  terminology: Đề nghị dùng “những kẻ thờ hình tượng” cho εἰδωλολάτραι. Đây là thuật ngữ Kinh Thánh tự nhiên trong tiếng Việt, chỉ việc thờ các thần tượng/hình tượng, không áp đặt diễn giải thêm. “Vui chơi” bảo lưu độ rộng của παίζειν; chú thích chỉ nêu hàm ý liên hoan trong ngữ cảnh thay vì biến nó thành nghĩa xác định của chính văn.
  issues:
  - severity: low
    issue: “ăn uống” gộp hai động từ trong câu trích dẫn.
    rationale: φαγεῖν καὶ πεῖν là “ăn và uống.” Cách “để ăn và uống” phản ánh minh bạch hơn hai động từ nguyên ngữ và quan hệ mục đích sau “ngồi xuống.”
  - severity: low
    issue: “thần tượng” có một nghĩa hiện đại nổi bật ngoài phạm vi tôn giáo.
    rationale: Dù “thờ thần tượng” vẫn hiểu được trong văn cảnh, “thờ hình tượng” là thuật ngữ tôn giáo/Kinh Thánh ổn định hơn cho εἰδωλολάτραι và tránh liên tưởng không cần thiết đến người nổi tiếng.
