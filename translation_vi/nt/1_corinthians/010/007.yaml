id: 1CO.10.7
reference: 1 Corinthians 10:7
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: μηδὲ εἰδωλολάτραι γίνεσθε, καθώς τινες αὐτῶν· ὥσπερ γέγραπται· Ἐκάθισεν ὁ λαὸς φαγεῖν καὶ πεῖν, καὶ ἀνέστησαν παίζειν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/007.yaml
  text: Do not become idolaters[a], as some of them were; just as it is written, “The people sat down to eat and drink, and rose up to play.”
translation:
  language: vi
  text: 'Đừng trở thành những kẻ thờ hình tượng, như một số người trong họ; đúng như lời đã chép: “Dân chúng ngồi xuống để ăn và uống, rồi đứng dậy vui chơi.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể hiểu là “đứng dậy mở hội” hoặc “đứng dậy ăn chơi.” Đây là lời trích từ Xuất Ai Cập 32:6; trong bối cảnh ấy, việc “vui chơi” gắn với lễ thờ bò con vàng của dân Y-sơ-ra-ên.
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδὲ
  choice: Đừng
  rationale: Trong mạch văn, từ này tiếp nối một loạt lời ngăn cấm; “Đừng” là cách diễn đạt tự nhiên, trực tiếp trong tiếng Việt.
- source_word: εἰδωλολάτραι
  choice: những kẻ thờ thần tượng
  rationale: Diễn đạt rõ người tham gia việc thờ lạy các thần tượng; tự nhiên và dễ hiểu hơn một danh từ Hán-Việt cô đọng.
- source_word: γίνεσθε
  choice: trở thành
  rationale: Giữ sắc thái chuyển biến của γίνομαι, cảnh báo người đọc đừng đi vào lối sống ấy, thay vì chỉ diễn đạt trạng thái “là”.
- source_word: καθώς τινες αὐτῶν
  choice: như một số người trong họ
  rationale: Giữ phép so sánh và quy chiếu đến một bộ phận dân Y-sơ-ra-ên trong hoang mạc mà không lặp lại động từ một cách nặng nề.
- source_word: ὥσπερ γέγραπται
  choice: đúng như lời đã chép
  rationale: Công thức trích dẫn Kinh Thánh quen thuộc; “đúng như” giữ lực so sánh của ὥσπερ và “đã chép” phản ánh tình trạng văn bản vẫn có hiệu lực.
- source_word: Ἐκάθισεν ὁ λαὸς φαγεῖν καὶ πεῖν
  choice: Dân chúng ngồi xuống ăn uống
  rationale: Dịch tự nhiên cấu trúc chỉ mục đích của hai động từ nguyên mẫu, đồng thời giữ chủ thể tập thể ὁ λαός.
- source_word: ἀνέστησαν
  choice: đứng dậy
  rationale: Giữ chuyển động kể chuyện đối lập với “ngồi xuống” và phù hợp cách nói tự nhiên trong tiếng Việt.
- source_word: παίζειν
  choice: vui chơi
  rationale: Giữ nghĩa từ vựng rộng của động từ và âm vang câu trích Xuất Ai Cập 32:6, không đưa cách hiểu “chè chén trác táng” vào chính văn.
theological_decisions:
- issue: Mức độ diễn giải hàm ý của παίζειν trong bối cảnh Xuất Ai Cập 32
  choice: Giữ “vui chơi” trong chính văn và giải thích sắc thái liên hoan phóng túng trong chú thích.
  alternative: mở hội; chè chén vui chơi; vui chơi phóng túng
  rationale: Bối cảnh là lễ hội thờ bò con vàng, nên động từ có thể hàm ý cuộc vui liên quan đến thờ thần tượng. Tuy nhiên, bản thân từ ngữ vẫn rộng; chính văn giữ sự mơ hồ có thật, còn chú thích cho biết lực văn cảnh.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Thần tượng” được dùng theo nghĩa tôn giáo là hình tượng hay thần giả được thờ lạy. Câu trích giữ nhịp đối xứng “ngồi xuống… rồi đứng dậy…” của nguyên văn.
