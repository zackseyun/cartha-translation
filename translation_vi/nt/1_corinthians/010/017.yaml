  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὅτι εἷς ἄρτος, ἓν σῶμα οἱ πολλοί ἐσμεν, οἱ γὰρ πάντες ἐκ τοῦ ἑνὸς ἄρτου μετέχομεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/017.yaml
  text: Because there is one bread[a], we who are many are one body, for we all partake of the one bread.
translation:
  language: vi
  text: Vì có một bánh[a], nên chúng ta tuy nhiều nhưng là một thân thể, vì tất cả chúng ta đều dự phần một bánh ấy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “một ổ bánh” ở cả hai chỗ nói đến “một bánh”. Từ Hy Lạp ἄρτος có thể chỉ một ổ bánh như một đơn vị cụ thể, làm nổi bật hình ảnh nhiều người cùng dự phần một nguồn duy nhất.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Vì
  rationale: Giữ sắc thái nguyên nhân/giải thích, nối câu này với lời ngay trước đó một cách tự nhiên trong tiếng Việt.
- source_word: εἷς ἄρτος
  choice: chỉ có một bánh
  rationale: ἄρτος có thể chỉ bánh nói chung hoặc một ổ bánh. Cách diễn đạt này làm rõ tính duy nhất trong tiếng Việt, còn phương án cụ thể hơn “một ổ bánh” được ghi ở chú thích.
- source_word: ἓν σῶμα
  choice: một thân thể
  rationale: Giữ nguyên hình ảnh cộng đồng và chiều sâu thần học của σῶμα mà không giải thích theo một lập trường giáo phái.
- source_word: οἱ πολλοί ἐσμεν
  choice: chúng ta tuy nhiều nhưng là
  rationale: Diễn đạt tự nhiên sự tương phản giữa số đông và sự hiệp nhất, đồng thời giữ đại từ ngôi thứ nhất số nhiều hàm chứa trong ἐσμεν.
- source_word: γὰρ
  choice: bởi
  rationale: Đánh dấu mệnh đề sau là căn cứ giải thích cho việc nhiều người là một thân thể.
- source_word: οἱ πάντες
  choice: tất cả chúng ta
  rationale: Làm rõ chủ thể được hàm chứa trong động từ ngôi thứ nhất số nhiều và giữ sự nhấn mạnh về toàn thể cộng đồng.
- source_word: ἐκ τοῦ ἑνὸς ἄρτου
  choice: từ một bánh ấy
  rationale: Giữ sắc thái nguồn chung của giới từ ἐκ và sự xác định của mạo từ, đồng thời tạo câu tiếng Việt tự nhiên.
- source_word: μετέχομεν
  choice: đều cùng ăn
  rationale: Trong ngữ cảnh bánh và chén, cụm này truyền đạt hành động cùng dự phần bằng việc ăn; “cùng” cũng giữ ý chia sẻ chung mà không áp đặt cách giải thích bí tích riêng.
theological_decisions:
- issue: Mối liên hệ giữa một bánh và một thân thể
  choice: Giữ trực tiếp lập luận rằng cộng đồng tuy nhiều nhưng là một thân thể vì mọi người cùng ăn từ một bánh.
  alternative: Có thể diễn giải theo hướng bánh chỉ tượng trưng cho sự hiệp nhất, hoặc theo hướng việc dự phần bí tích tạo nên sự hiệp nhất.
  rationale: Bản Hy Lạp liên kết chặt chẽ việc cùng dự phần một bánh với sự hiệp nhất của các tín hữu, nhưng không tự nó phân định các tranh luận thần học về bản thể hay hiệu lực của Tiệc Thánh.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “thân thể” để giữ hình ảnh ẩn dụ; dùng “đều cùng ăn” thay cho từ Hán-Việt nặng hơn như “dự phần”, nhưng chú trọng bảo toàn ý tham dự chung.
