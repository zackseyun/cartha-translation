revisions:
- from: Vì chỉ có một bánh[a], nên chúng ta tuy nhiều nhưng là một thân thể, bởi tất cả chúng ta đều cùng ăn từ một bánh ấy.
  to: Vì có một bánh[a], nên chúng ta tuy nhiều nhưng là một thân thể, vì tất cả chúng ta đều dự phần một bánh ấy.
  rationale: Thay «chỉ có một bánh» bằng «có một bánh» để không thêm sắc thái loại trừ; thay «đều cùng ăn từ một bánh ấy» bằng «đều dự phần một bánh ấy» để phản ánh chính xác μετέχομεν và giữ tính mở thần học của câu. Lặp lại «một bánh ấy» duy trì sự xác định và tính duy nhất của τοῦ ἑνὸς ἄρτου.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T18:11:52Z'
review_pass:
  verdict: revise
  source_fidelity: Bản dịch giữ đúng mạch lập luận nhân quả và hình ảnh «một bánh—một thân thể». Tuy nhiên, «đều cùng ăn từ một bánh ấy» thu hẹp μετέχομεν thành hành vi ăn và khiến ἐκ nghe như vị trí/vật chứa («ăn từ»), trong khi động từ này nhấn mạnh sự cùng dự phần. «Chỉ có một bánh» cũng thêm sắc thái loại trừ không cần thiết so với εἷς ἄρτος.
  naturalness: Câu sửa vẫn là tiếng Việt hiện đại, trang trọng và rõ nghĩa. «Dự phần» là cách dùng tự nhiên trong văn cảnh bữa ăn/Tiệc Thánh và diễn đạt chính xác sự tham gia chung mà không giải thích quá mức.
  terminology: Giữ «bánh» và «thân thể», bảo toàn độ vang cộng đồng và bí tích của ἄρτος và σῶμα mà không áp đặt cách hiểu giáo phái. Chú thích «ổ bánh» được giữ như một phương án từ vựng hợp lệ.
  issues:
  - severity: medium
    issue: «đều cùng ăn từ một bánh ấy» dịch hẹp μετέχομεν và chưa tự nhiên với ἐκ.
    rationale: μετέχω có nghĩa là dự phần/chia phần, không chỉ là ăn. Cấu trúc «ăn từ một bánh» trong tiếng Việt dễ gợi việc ăn lấy từ một vật, trong khi câu Hy Lạp nhấn mạnh mọi người cùng tham dự vào một bánh chung.
  - severity: low
    issue: «chỉ có một bánh» thêm sắc thái loại trừ.
    rationale: εἷς ἄρτος khẳng định «một bánh»; từ «chỉ có» có thể gợi rằng không tồn tại bánh nào khác, điều không cần thiết cho lập luận của câu.
