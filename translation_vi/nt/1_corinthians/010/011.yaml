id: 1CO.10.11
reference: 1 Corinthians 10:11
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ταῦτα ⸀δὲ ⸂τυπικῶς συνέβαινεν⸃ ἐκείνοις, ἐγράφη δὲ πρὸς νουθεσίαν ἡμῶν, εἰς οὓς τὰ τέλη τῶν αἰώνων ⸀κατήντηκεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/011.yaml
  text: These things happened to them as examples[a], but they were written for our instruction[c][b], on whom the ends of the ages have come.
translation:
  language: vi
  text: Những điều ấy đã xảy đến với họ như những tấm gương[a], và đã được chép lại để răn dạy chúng ta[b], là những người mà các thời kỳ cuối của các thời đại đã đến với[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “như những hình bóng” hoặc “theo nghĩa hình bóng”; Phao-lô trình bày các biến cố này như những khuôn mẫu có ý nghĩa chỉ dẫn cho các tín hữu về sau.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “để khuyên răn chúng ta” hoặc “để cảnh báo chúng ta”; từ Hy Lạp bao gồm cả sự chỉ dạy có tính sửa trị lẫn lời cảnh báo.'
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “thời kỳ cuối cùng đã đến với chúng ta.” Nguyên văn dùng số nhiều: “các thời kỳ cuối của các thời đại,” nên bản dịch chính giữ cách nói lịch sử-cứu chuộc của Phao-lô.'
    reason: alternative_reading
lexical_decisions:
- source_word: τυπικῶς
  choice: như những hình mẫu
  rationale: Diễn đạt các biến cố như những khuôn mẫu mang ý nghĩa chỉ dẫn cho các tín hữu về sau; tự nhiên hơn lối nói chuyên môn “theo nghĩa hình bóng”, đồng thời giữ được chiều sâu hơn từ “ví dụ” đơn thuần.
- source_word: συνέβαινεν
  choice: đã xảy ra
  rationale: Chuyển tải tự nhiên hành động trong quá khứ; sắc thái lặp lại hoặc tiếp diễn của thì chưa hoàn thành được ngữ cảnh và chủ ngữ số nhiều hỗ trợ.
- source_word: ἐκείνοις
  choice: cho họ
  rationale: Chỉ thế hệ dân Y-sơ-ra-ên trong hoang mạc đã được nói đến ở phần trước.
- source_word: ἐγράφη
  choice: đã được chép lại
  rationale: Thể bị động chỉ việc các biến cố ấy được ghi thành văn; “chép lại” là cách nói rõ ràng, tự nhiên trong tiếng Việt.
- source_word: πρὸς νουθεσίαν
  choice: để răn dạy chúng ta
  rationale: “Răn dạy” bao hàm cả sự chỉ bảo có tính sửa trị lẫn cảnh báo, phù hợp với phạm vi nghĩa của νουθεσία và văn mạch.
- source_word: εἰς οὓς
  choice: là những người mà ... đã đến trên mình
  rationale: Giữ sắc thái hướng đến hoặc giáng trên những người đang sống trong thực tại cánh chung, dù cấu trúc này trang trọng hơn cách nói thông thường.
- source_word: τὰ τέλη τῶν αἰώνων
  choice: các hồi kết của các thời đại
  rationale: Giữ cả hai dạng số nhiều trong nguyên văn và không thu gọn cách diễn đạt lịch sử-cứu chuộc của Phao-lô thành một “thời kỳ cuối” duy nhất.
- source_word: κατήντηκεν
  choice: đã đến
  rationale: Thì hoàn thành diễn tả sự kiện đã xảy đến và vẫn có ý nghĩa trong hiện tại; “đã đến” là cách diễn đạt gọn và tự nhiên.
theological_decisions:
- issue: Cách diễn đạt lịch sử-cứu chuộc τὰ τέλη τῶν αἰώνων của Phao-lô
  choice: các hồi kết của các thời đại đã đến
  alternative: thời kỳ cuối cùng đã đến; sự hoàn tất của các thời đại đã đến
  rationale: Giữ dạng số nhiều và sức căng cánh chung của nguyên văn, không âm thầm biến nó thành một khái niệm số ít hoặc giải thích nó hoàn toàn là “sự hoàn tất”.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. “Hình mẫu” tránh thuật ngữ thần học quá chuyên biệt; “răn dạy” giữ đồng thời sắc thái giáo huấn và cảnh báo. Cụm cuối cố ý trang trọng và hơi khác khẩu ngữ để bảo toàn hai dạng số nhiều cùng sức căng cánh chung trong nguyên văn.
