  text: ὥστε ὁ δοκῶν ἑστάναι βλεπέτω μὴ πέσῃ,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/012.yaml
  text: Therefore[a], let the one who thinks he stands watch out lest he fall.
translation:
  language: vi
  text: Vậy nên, ai tưởng mình đang đứng thì phải coi chừng, kẻo ngã.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὥστε
  choice: Vậy nên
  rationale: Liên từ chỉ kết luận rút ra từ các gương cảnh báo ở phần trước; “Vậy nên” tự nhiên trong tiếng Việt và giữ rõ lực suy luận.
- source_word: ὁ δοκῶν
  choice: ai tưởng
  rationale: Phân từ hiện tại có mạo từ được dùng như danh từ, chỉ một người mang tính đại diện. “Ai tưởng” diễn đạt gọn, tự nhiên, đồng thời “tưởng” giữ khả năng nhận định ấy có thể là quá tự tin hoặc không đúng.
- source_word: ἑστάναι
  choice: mình đang đứng
  rationale: Động từ nguyên mẫu hoàn thành của ἵστημι diễn tả trạng thái đang đứng vững từ trước đến nay. “Đang đứng” giữ hình ảnh đứng mà không thêm nghĩa “vững vàng” vốn không được nói rõ.
- source_word: βλεπέτω
  choice: phải coi chừng
  rationale: Mệnh lệnh hiện tại kêu gọi sự cảnh giác liên tục. “Phải coi chừng” là cách cảnh báo rõ ràng, hiện đại và tự nhiên.
- source_word: μὴ πέσῃ
  choice: kẻo ngã
  rationale: μή với động từ giả định quá khứ đơn sau mệnh lệnh diễn tả điều cần đề phòng. “Kẻo ngã” ngắn gọn, giữ nguyên hình ảnh đối lập giữa đứng và ngã.
theological_decisions:
- issue: Bản chất của việc “ngã” trong lời cảnh báo của Phao-lô
  choice: Giữ lời cảnh báo khái quát “ngã”, không xác định đó là bội đạo, sa vào tội lỗi hay chịu phán xét vì thờ thần tượng.
  alternative: “sa vào tội lỗi”; “sa ngã khỏi đức tin”; “chịu phán xét”
  rationale: Ngữ cảnh gần cảnh báo về sự quá tự tin qua những thất bại của Israel, nhưng πέσῃ không tự nó xác định một loại sa ngã cụ thể. Cách dịch rộng bảo tồn sự căng thẳng thần học của câu.
- issue: Cách diễn đạt giống đực số ít mang tính đại diện
  choice: Dùng “ai ... mình” để thể hiện một cá nhân đại diện mà không biến câu thành số nhiều.
  alternative: “người nào tưởng người ấy đang đứng thì người ấy phải coi chừng”; dùng đại từ số nhiều
  rationale: Tiếng Hy Lạp dùng giống đực số ít theo nghĩa đại diện. Trong tiếng Việt, “ai ... mình” là số ít tự nhiên và không cần áp đặt đại từ mang giới tính nơi cấu trúc tiếng Việt không đòi hỏi.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Cấu trúc “đang đứng ... kẻo ngã” bảo tồn phép đối hình ảnh của nguyên văn; “coi chừng” truyền đạt sắc thái mệnh lệnh cảnh giác mà không cổ kính.
