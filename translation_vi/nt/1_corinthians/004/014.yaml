id: 1CO.4.14
reference: 1 Corinthians 4:14
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Οὐκ ἐντρέπων ὑμᾶς γράφω ταῦτα, ἀλλ’ ὡς τέκνα μου ἀγαπητὰ ⸀νουθετῶν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/014.yaml
  text: I am not writing these things to shame you[b][a], but admonishing you as my beloved children.
translation:
  language: vi
  text: Tôi viết những điều này không phải để làm anh chị em xấu hổ, nhưng để khuyên bảo anh chị em như những người con yêu dấu của tôi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐντρέπων
  choice: để làm anh chị em xấu hổ
  rationale: Phân từ đi với οὐκ diễn tả điều Phao-lô phủ nhận là mục đích hoặc cách thức ông viết. Cách dịch này giữ sắc thái hổ thẹn trong bối cảnh danh dự–hổ thẹn, thay vì làm nhẹ thành “ngượng ngùng”.
- source_word: γράφω ταῦτα
  choice: Tôi viết những điều này
  rationale: Giữ thì hiện tại mang tính thư tín của γράφω và số nhiều của ταῦτα bằng lối diễn đạt tự nhiên trong tiếng Việt.
- source_word: ἀλλ’
  choice: nhưng
  rationale: Diễn tả rõ sự tương phản giữa mục đích bị phủ nhận và hành động tích cực của Phao-lô.
- source_word: ὡς
  choice: như
  rationale: Giữ nguyên cách diễn đạt về mối quan hệ làm nền tảng cho lời khuyên bảo mà không giải thích thêm.
- source_word: τέκνα μου ἀγαπητὰ
  choice: những người con yêu dấu của tôi
  rationale: τέκνα bao gồm cả nam lẫn nữ và nhấn mạnh quan hệ con cái; “yêu dấu” giữ được sự trìu mến và sắc thái trang trọng của ἀγαπητά.
- source_word: νουθετῶν
  choice: để khuyên bảo anh chị em
  rationale: “Khuyên bảo” hàm ý chỉ dẫn mang tính sửa dạy và cảnh tỉnh nhưng không quá nặng tính trừng phạt. Cụm “để” làm rõ mục đích tích cực tương phản với mệnh đề trước, phù hợp tự nhiên với tiếng Việt.
theological_decisions:
- issue: Giọng điệu mục vụ trong lời sửa dạy của Phao-lô
  choice: khuyên bảo anh chị em như những người con yêu dấu của tôi
  alternative: cảnh cáo anh chị em như những người con yêu dấu của tôi
  rationale: νουθετέω có thể bao hàm cảnh báo, chỉ dẫn và sửa dạy. “Khuyên bảo” giữ lực sửa dạy nhưng cũng phản ánh tình cảm phụ tử được diễn tả bằng τέκνα μου ἀγαπητά, không biến lời này thành sự lên án gay gắt.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” cho ὑμᾶς để diễn đạt tự nhiên một cộng đồng gồm cả nam lẫn nữ; dùng “những người con” cho τέκνα nhằm giữ hình ảnh quan hệ phụ tử thuộc linh. Không thêm chú thích vì các sắc thái chính có thể được thể hiện đầy đủ trong bản văn.
source_grounding:
  english_pob_role: consult_only
