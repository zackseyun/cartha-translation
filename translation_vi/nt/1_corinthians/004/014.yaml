  source_fidelity: 'Bản dịch truyền đạt đúng sự đối lập trong câu: Phao-lô không viết nhằm làm người nhận hổ thẹn, nhưng đưa ra lời khuyên bảo/sửa dạy trên cơ sở họ là những người con yêu dấu của ông. “Những điều này” giữ được số nhiều của ταῦτα; “anh chị em” diễn đạt tự nhiên đối tượng số nhiều gồm cả nam lẫn nữ. Lối “không phải để …, nhưng để …” chuyển hai phân từ Hy Lạp thành cấu trúc mục đích tương phản tự nhiên trong tiếng Việt mà không đổi ý nghĩa thực chất.'
