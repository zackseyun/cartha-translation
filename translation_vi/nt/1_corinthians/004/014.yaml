  terminology: “Anh chị em” phù hợp khi ngỏ với một cộng đồng tín hữu; “những người con yêu dấu của tôi” phản ánh đúng τέκνα μου ἀγαπητά, bao hàm cả nam lẫn nữ và duy trì tình cảm phụ tử của văn mạch. “Khuyên bảo” là lựa chọn an toàn cho νουθετῶν, không làm mạnh thành kết án hay thu hẹp thành chỉ dạy thông thường.
