  text: ὡς μὴ ἐρχομένου δέ μου πρὸς ὑμᾶς ἐφυσιώθησάν τινες·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/018.yaml
  text: Some have become puffed up[b][a], as though I were not coming to you.
translation:
  language: vi
  text: Có một số người đã trở nên tự cao[a][b], như thể tôi sẽ không đến với anh chị em.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Có một số người đã lên mặt, như thể tôi sẽ không đến với anh chị em.”'
    reason: lexical_alternative
  - marker: b
    text: Nguyên ngữ dùng hình ảnh “được làm phồng lên” để nói về lòng tự cao. Phao-lô lặp lại hình ảnh này trong 1 Cô-rinh-tô 4:6, 4:19; 5:2; 8:1; 13:4.
    reason: cross_reference
lexical_decisions:
- source_word: ὡς
  choice: tưởng rằng
  rationale: Diễn đạt tự nhiên giả định sai làm nền cho thái độ của một số người, đồng thời giữ sắc thái của ὡς trong cấu trúc này.
- source_word: μὴ ἐρχομένου ... μου πρὸς ὑμᾶς
  choice: tôi sẽ không đến với anh chị em
  rationale: Cụm phân từ sở hữu cách phụ thuộc vào ὡς, chỉ tình huống họ giả định chứ không phải lời Phao-lô trực tiếp khẳng định; thì tương lai phù hợp với việc ông dự định đến.
- source_word: δέ
  choice: —
  rationale: Tiểu từ nối nhẹ; mạch chuyển ý từ câu trước đã rõ nên không cần dịch thành một từ riêng.
- source_word: ἐφυσιώθησάν
  choice: đã lên mặt
  rationale: Thành ngữ tiếng Việt hiện đại diễn tả sự tự cao, tự đắc một cách sinh động. Chú thích giữ hình ảnh nguyên ngữ là bị làm phồng lên và liên hệ cách dùng lặp lại của Phao-lô.
- source_word: τινες
  choice: Có mấy người
  rationale: Chỉ một nhóm không xác định trong hội thánh; cách nói tự nhiên và không hàm ý toàn thể.
theological_decisions:
- issue: Cách diễn đạt lời quở trách của Phao-lô về tính kiêu ngạo
  choice: Dùng thành ngữ “lên mặt” trong câu chính và nêu hình ảnh “phồng lên” ở chú thích.
  alternative: Có mấy người đã trở nên kiêu ngạo, như thể tôi sẽ không đến với anh chị em.
  rationale: “Lên mặt” dễ hiểu, có sức gợi và truyền đạt đúng sự tự cao; chú thích giúp độc giả nhận ra ẩn dụ lặp lại trong thư mà không biến câu chính thành một cách nói gượng gạo.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng vừa phải và dễ hiểu. “Anh chị em” diễn đạt đại từ số nhiều ὑμᾶς theo cách bao hàm cộng đồng hội thánh; “lên mặt” là thành ngữ thông dụng nhưng vẫn phù hợp với giọng quở trách trực diện.
