revisions:
- from: Có mấy người đã lên mặt[a][b], tưởng rằng tôi sẽ không đến với anh chị em.
  to: Có một số người đã trở nên tự cao[a][b], như thể tôi sẽ không đến với anh chị em.
  rationale: Thay “đã lên mặt” bằng “đã trở nên tự cao” để biểu đạt trực tiếp hơn ý của φυσιόω mà vẫn tự nhiên trong tiếng Việt hiện đại; chú thích bảo tồn hình ảnh ẩn dụ nguyên ngữ và các chỗ lặp lại. Thay “có mấy người” bằng “có một số người” để không suy diễn số lượng. Giữ “như thể tôi sẽ không đến” vì cấu trúc ὡς với phân từ phủ định diễn tả giả định sai liên quan đến chuyến thăm dự định của Phao-lô.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T18:10:51Z'
