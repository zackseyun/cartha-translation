id: 1CO.4.5
reference: 1 Corinthians 4:5
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὥστε μὴ πρὸ καιροῦ τι κρίνετε, ἕως ἂν ἔλθῃ ὁ κύριος, ὃς καὶ φωτίσει τὰ κρυπτὰ τοῦ σκότους καὶ φανερώσει τὰς βουλὰς τῶν καρδιῶν, καὶ τότε ὁ ἔπαινος γενήσεται ἑκάστῳ ἀπὸ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/005.yaml
  text: Therefore[a], do not judge anything before the time, until the Lord comes, who will also bring to light the hidden things of darkness and reveal the purposes of the hearts[c][b]. Then each one’s praise will come from God.
translation:
  language: vi
  text: Vì thế, đừng xét đoán bất cứ điều gì khi chưa đến lúc[a], cho đến khi Chúa đến. Ngài cũng sẽ đưa những điều kín giấu của bóng tối ra ánh sáng và phơi bày những ý định trong lòng người[b][c]. Bấy giờ, lời khen dành cho mỗi người sẽ đến từ Đức Chúa Trời.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “trước thời điểm” hoặc “quá sớm”; cụm từ Hy Lạp chỉ việc hành động trước thời điểm thích hợp.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “những dự tính trong lòng” hoặc “những động cơ trong lòng”.'
    reason: lexical_alternative
  - marker: c
    text: Tức là khi Chúa đến, Ngài sẽ bày tỏ những điều kín giấu.
    reason: cross_reference
lexical_decisions:
- source_word: ὥστε
  choice: Vì thế
  rationale: Diễn tả kết luận suy ra từ lập luận ngay trước đó bằng một liên từ tự nhiên trong tiếng Việt.
- source_word: μὴ πρὸ καιροῦ τι κρίνετε
  choice: đừng xét đoán bất cứ điều gì khi chưa đến lúc
  rationale: Giữ phạm vi rộng của τι và diễn đạt πρὸ καιροῦ tự nhiên, không thêm từ ngữ khẳng định rõ rằng thời điểm đã được ấn định.
- source_word: ἕως ἂν ἔλθῃ ὁ κύριος
  choice: cho đến khi Chúa đến
  rationale: Giữ nguyên giới hạn thời gian của mệnh lệnh và tước hiệu κύριος; trong ngữ cảnh này, tước hiệu chỉ về Chúa Giê-su khi Ngài đến.
- source_word: φωτίσει τὰ κρυπτὰ τοῦ σκότους
  choice: sẽ đưa ra ánh sáng những điều ẩn giấu trong bóng tối
  rationale: Truyền đạt hình ảnh ẩn dụ về việc làm cho điều kín giấu được thấy rõ, đồng thời giữ mối liên hệ với bóng tối.
- source_word: φανερώσει τὰς βουλὰς τῶν καρδιῶν
  choice: phơi bày những ý định trong lòng người
  rationale: βουλαί có thể là ý định, dự tính hoặc động cơ; “ý định” giữ được nghĩa rộng, còn “lòng người” là cách diễn đạt tự nhiên cho nội tâm của các cá nhân.
- source_word: ὁ ἔπαινος γενήσεται ἑκάστῳ ἀπὸ τοῦ θεοῦ
  choice: lời khen dành cho mỗi người sẽ đến từ Đức Chúa Trời
  rationale: Giữ danh từ ἔπαινος, ý phân phối của ἑκάστῳ và nguồn phát xuất được nêu bằng ἀπὸ τοῦ θεοῦ, không biến câu thành một lời bảo đảm rằng mọi hành vi đều đáng khen.
theological_decisions:
- issue: Phạm vi và thời điểm của việc xét đoán
  choice: Câu cấm sự xét đoán trước thời điểm Chúa đến và bày tỏ điều kín giấu.
  alternative: Hiểu câu này như lệnh cấm tuyệt đối mọi hình thức phân định hoặc xét đoán.
  rationale: Cụm “khi chưa đến lúc, cho đến khi Chúa đến” giới hạn lời cấm theo thời gian và đặt nó trong bối cảnh cuộc đánh giá sau cùng; bản dịch không thu hẹp “bất cứ điều gì” nhưng cũng không xóa giới hạn ấy.
- issue: Đấng được gọi là “Chúa”
  choice: Giữ tước hiệu “Chúa”, trong ngữ cảnh chỉ về Chúa Giê-su khi Ngài đến xét đoán.
  alternative: Mở rộng ngay trong câu thành “Chúa Giê-su” hoặc hiểu như một cách gọi chung về Đức Chúa Trời.
  rationale: Cách dùng của Phao-lô và bối cảnh về sự hiện đến trong tương lai ủng hộ quy chiếu đến Chúa Giê-su, nhưng nguyên văn chỉ dùng tước hiệu nên bản dịch không diễn giải thêm trong chính câu.
- issue: “Lời khen” dành cho mỗi người
  choice: Giữ phát biểu rằng lời khen dành cho mỗi người đến từ Đức Chúa Trời.
  alternative: Diễn giải thành mỗi người chắc chắn sẽ được khen về mọi việc, hoặc thay “lời khen” bằng “phán quyết”.
  rationale: Nguyên văn dùng ἔπαινος, nghĩa là lời khen hay sự khen ngợi. Bản dịch giữ nguyên sức căng của lời tuyên bố mà không thêm điều kiện hoặc đổi nó thành thuật ngữ rộng hơn.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại và dễ hiểu. “Xét đoán” phù hợp với ngữ cảnh đánh giá mang tính phán quyết; “khi chưa đến lúc” tự nhiên hơn lối dịch cứng “trước thời gian”. Hai động từ “đưa ra ánh sáng” và “phơi bày” giữ phép song song của nguyên văn.
