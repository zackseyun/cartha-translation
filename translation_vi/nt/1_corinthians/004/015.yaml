id: 1CO.4.15
reference: 1 Corinthians 4:15
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐὰν γὰρ μυρίους παιδαγωγοὺς ἔχητε ἐν Χριστῷ, ἀλλ’ οὐ πολλοὺς πατέρας, ἐν γὰρ Χριστῷ Ἰησοῦ διὰ τοῦ εὐαγγελίου ἐγὼ ὑμᾶς ἐγέννησα.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/015.yaml
  text: For even if you have countless guardians in Messiah[a], yet not many fathers; for in Messiah Jesus, through the gospel[d][c][b], I became your father.
translation:
  language: vi
  text: 'Vì dù anh chị em có vô số người giám hộ trong Đấng Mê-si[a], anh chị em cũng không có nhiều người cha; vì trong Đấng Mê-si Giê-su, qua Tin Mừng, chính tôi đã sinh ra anh chị em[b].


    [a] Hy Lạp μυρίους, nghĩa đen là “mười ngàn”, thường được dùng để chỉ một số lượng vô cùng lớn. Từ παιδαγωγούς chỉ những người giám hộ, trông nom và uốn nắn trẻ em, chứ không chủ yếu là giáo viên đứng lớp.


    [b] Hy Lạp nói sát nghĩa: “tôi đã sinh ra anh chị em”. Đây là hình ảnh ẩn dụ nói về vai trò của Phao-lô trong việc đưa họ đến đức tin qua Tin Mừng.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hy Lạp μυρίους, nghĩa đen là “mười ngàn”, thường được dùng để chỉ một số lượng vô cùng lớn. Từ παιδαγωγούς chỉ những người giám hộ, trông nom và uốn nắn trẻ em, chứ không chủ yếu là giáo viên đứng lớp.
    reason: lexical_alternative_and_cultural_note
  - marker: b
    text: 'Hy Lạp nói sát nghĩa: “tôi đã sinh ra anh chị em”. Đây là hình ảnh ẩn dụ nói về vai trò của Phao-lô trong việc đưa họ đến đức tin qua Tin Mừng.'
    reason: metaphorical_language
lexical_decisions:
- source_word: μυρίους
  choice: vô số
  rationale: Truyền đạt cách dùng thành ngữ chỉ số lượng cực lớn, đồng thời giữ được thế đối lập với “không có nhiều người cha”; nghĩa đen được ghi ở chú thích.
- source_word: παιδαγωγοὺς
  choice: người giám hộ
  rationale: Trong bối cảnh Hy-La, từ này chỉ người trông nom, giám sát và uốn nắn một đứa trẻ, không chủ yếu chỉ giáo viên.
- source_word: ἐν Χριστῷ / ἐν Χριστῷ Ἰησοῦ
  choice: trong Đấng Mê-si / trong Đấng Mê-si Giê-su
  rationale: Giữ giới từ và cách diễn đạt đặc trưng của Phao-lô, đồng thời thể hiện Χριστός là tước hiệu.
- source_word: πατέρας
  choice: người cha
  rationale: Giữ nguyên hình ảnh người cha trong tiếng Hy Lạp, không diễn giải thêm thành “cha thuộc linh” trong chính văn.
- source_word: διὰ τοῦ εὐαγγελίου
  choice: qua Tin Mừng
  rationale: διά với sở hữu cách diễn tả phương tiện; “qua Tin Mừng” tự nhiên và sát ý trong tiếng Việt.
- source_word: ἐγέννησα
  choice: tôi đã sinh anh chị em
  rationale: Giữ hình ảnh sinh thành mạnh và trực tiếp của động từ Hy Lạp; chú thích làm rõ tính ẩn dụ để tránh hiểu theo nghĩa sinh học.
theological_decisions:
- issue: Hình ảnh Phao-lô sinh ra các tín hữu Cô-rinh-tô
  choice: Giữ cách nói “tôi đã sinh anh chị em” như một ẩn dụ về vai trò độc đáo của Phao-lô qua Tin Mừng.
  alternative: “Tôi đã trở thành cha của anh chị em” hoặc “tôi đã sinh anh chị em về phần thuộc linh”.
  rationale: Cách chọn giữ sát lực của ἐγέννησα và mối liên hệ với “người cha”, nhưng không đưa thuật ngữ giáo phái hay một lối giải thích thần học cụ thể vào chính văn.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh chị em” cho đại từ số nhiều ὑμᾶς; dùng “Đấng Mê-si” để thể hiện tước hiệu Χριστός; giữ hình ảnh sinh thành trong chính văn và giải thích ngắn gọn ở chú thích.
