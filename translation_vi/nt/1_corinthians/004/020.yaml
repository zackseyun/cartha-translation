id: 1CO.4.20
reference: 1 Corinthians 4:20
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οὐ γὰρ ἐν λόγῳ ἡ βασιλεία τοῦ θεοῦ ἀλλ’ ἐν δυνάμει.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/020.yaml
  text: For the kingdom of God is not in word[a], but in power.
translation:
  language: vi
  text: Vì vương quốc của Đức Chúa Trời không cốt ở lời nói[a], nhưng ở quyền năng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “lời lẽ” hoặc “những lời nói suông”; sự tương phản ở đây là giữa lời nói đơn thuần với quyền năng hữu hiệu.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ γὰρ
  choice: Vì ... không
  rationale: γάρ nối câu này với ý trước như một lời giải thích, nên “Vì” vừa tự nhiên vừa giữ quan hệ lập luận; οὐ được diễn đạt bằng “không”.
- source_word: ἐν λόγῳ
  choice: cốt ở lời nói
  rationale: λόγος ở đây có thể chỉ lời nói, diễn từ hoặc ngôn từ. Cụm “cốt ở” diễn đạt tự nhiên thành ngữ ἐν trong sự đối lập với quyền năng, còn “lời nói” giữ được độ rộng nghĩa mà không tự ý thu hẹp thành tài hùng biện hay lời nói suông.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: vương quốc của Đức Chúa Trời
  rationale: “Vương quốc” là cách diễn đạt rõ ràng, trang trọng và quen thuộc, có thể bao hàm cả quyền trị vì lẫn lĩnh vực chịu sự cai trị của Đức Chúa Trời mà không buộc chọn riêng một nét nghĩa.
- source_word: ἀλλ’ ἐν δυνάμει
  choice: nhưng ở quyền năng
  rationale: δύναμις có nghĩa rộng là quyền năng hoặc sức mạnh hữu hiệu. “Quyền năng” giữ sự đối lập sắc nét với lời nói và không xác định quá mức quyền năng ấy là phép lạ, sự biến đổi đạo đức hay thẩm quyền sứ đồ.
theological_decisions:
- issue: Bản chất của sự tương phản giữa “lời nói” và “quyền năng”
  choice: Giữ sự tương phản rộng giữa lời nói đơn thuần và quyền năng hữu hiệu biểu hiện vương quốc Đức Chúa Trời.
  alternative: Hiểu quyền năng riêng là phép lạ, đời sống được biến đổi và kỷ luật Hội Thánh, thẩm quyền sứ đồ, hoặc công việc của Thánh Linh theo một nghĩa hẹp.
  rationale: Bản văn Hy Lạp không xác định cụ thể loại quyền năng nào, nên bản dịch không thu hẹp điều mà câu này để ngỏ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Cốt ở” làm cho cấu trúc tiếng Việt tự nhiên mà vẫn bảo toàn phép đối xứng “không... nhưng...”; “Đức Chúa Trời” được dùng theo cách gọi Tin Lành phổ biến trong ngữ cảnh bản dịch này.
