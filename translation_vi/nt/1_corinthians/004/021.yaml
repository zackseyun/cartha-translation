  to: Anh chị em muốn điều gì? Tôi nên cầm roi đến với anh chị em, hay đến trong tình yêu thương và với tinh thần[b] dịu dàng[a]?
  rationale: Sửa chú thích a để loại bỏ lỗi từ tiếng Anh còn sót lại. Điều chỉnh trật tự câu để “cầm roi đến” diễn đạt tự nhiên hơn hình ảnh ἐν ῥάβδῳ và giữ thế đối lập với việc đến trong tình yêu thương và tinh thần dịu dàng. Không thay đổi ý nghĩa hay áp đặt cách hiểu giáo phái về πνεῦμα.
