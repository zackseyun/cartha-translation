id: 1CO.4.21
reference: 1 Corinthians 4:21
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τί θέλετε; ἐν ῥάβδῳ ἔλθω πρὸς ὑμᾶς, ἢ ἐν ἀγάπῃ πνεύματί τε πραΰτητος;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/021.yaml
  text: What do you want? Should I come to you with a rod[b][a], or with love and a spirit of gentleness?
translation:
  language: vi
  text: Anh chị em muốn điều gì? Tôi nên cầm roi đến với anh chị em, hay đến trong tình yêu thương và với tinh thần[b] dịu dàng[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “trong tình yêu thương và sự dịu dàng trong tinh thần.”'
    reason: lexical_alternative
  - marker: b
    text: “Tinh thần dịu dàng” có thể chỉ tâm thế dịu dàng của Phao-lô; một số người hiểu “Thần” ở đây là sự ám chỉ ngầm đến công việc của Thánh Linh.
    reason: alternative_reading
lexical_decisions:
- source_word: τί θέλετε
  choice: Anh chị em muốn điều gì?
  rationale: Câu hỏi trực tiếp giữ nguyên sức chất vấn của tiếng Hy Lạp; “muốn điều gì” tự nhiên trong tiếng Việt hiện đại mà không làm nhẹ giọng điệu.
- source_word: ἐν ῥάβδῳ
  choice: cầm roi
  rationale: ῥάβδος chỉ cây roi hoặc gậy. “Cầm roi” giữ hình ảnh kỷ luật cụ thể và sắc bén, đồng thời tự nhiên hơn “bằng roi” trong tiếng Việt; dịch thành “kỷ luật” sẽ giải nghĩa quá mức.
- source_word: ἔλθω πρὸς ὑμᾶς
  choice: Tôi nên đến với anh chị em
  rationale: Cách diễn đạt này thể hiện câu hỏi cân nhắc của động từ ở thể giả định, đồng thời giữ hướng chuyển động “đến với” cộng đồng.
- source_word: ἢ
  choice: hay
  rationale: “Hay” diễn đạt rõ sự lựa chọn tương phản giữa hai cách Phao-lô có thể đến.
- source_word: ἐν ἀγάπῃ
  choice: với tình yêu thương
  rationale: “Với” chỉ cách thức Phao-lô đến và cân đối với hình ảnh “cầm roi”; “tình yêu thương” là cách diễn đạt rõ ràng, phổ thông cho ἀγάπη.
- source_word: πνεύματί τε πραΰτητος
  choice: và một tinh thần dịu dàng
  rationale: Cách dịch này giữ rõ danh từ πνεῦμα và phẩm chất πραΰτης, đồng thời diễn đạt tự nhiên thái độ đi cùng tình yêu thương. Chú thích bảo lưu khả năng dịch theo cấu trúc khác và khả năng hiểu πνεῦμα theo nghĩa thần học.
theological_decisions:
- issue: Ý nghĩa của πνεύματι trong πνεύματί τε πραΰτητος
  choice: “một tinh thần dịu dàng”, chủ yếu chỉ tâm thế hoặc cách cư xử của Phao-lô
  alternative: “Thánh Linh của sự dịu dàng” hoặc sự dịu dàng do Thánh Linh tác động
  rationale: 'Văn cảnh trực tiếp đối chiếu hai cách Phao-lô đến: nghiêm khắc để sửa trị hoặc yêu thương và dịu dàng. Danh từ πνεῦμα không có mạo từ nên không buộc phải hiểu là Thánh Linh. Viết thường và thêm chú thích vừa phản ánh cách hiểu phù hợp nhất với văn cảnh, vừa không loại bỏ khả năng sự dịu dàng ấy đến từ công việc của Thánh Linh.'
translation_notes:
  register: Văn phong hiện đại, trang trọng và trực tiếp. “Anh chị em” diễn đạt số nhiều của ὑμᾶς theo lối xưng hô cộng đồng tự nhiên; “cầm roi” giữ nguyên hình ảnh kỷ luật mà không biến ẩn dụ thành lời giải thích.
