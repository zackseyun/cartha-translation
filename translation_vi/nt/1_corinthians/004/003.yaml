source:
  edition: SBLGNT
  text: ἐμοὶ δὲ εἰς ἐλάχιστόν ἐστιν, ἵνα ὑφ’ ὑμῶν ἀνακριθῶ ἢ ὑπὸ ἀνθρωπίνης ἡμέρας· ἀλλ’ οὐδὲ ἐμαυτὸν ἀνακρίνω·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/003.yaml
  text: But to me it is a very small thing that I should be examined by you or by any human court; in fact[a], I do not even examine myself.
translation:
  language: vi
  text: Còn đối với tôi, việc bị anh em hoặc người đời[a] xem xét chỉ là điều rất nhỏ; nhưng ngay cả chính mình tôi cũng không xem xét.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tiếng Hy Lạp dịch sát là “ngày của loài người”, một cách nói chỉ sự đánh giá hoặc xét đoán của con người.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμοὶ δὲ
  choice: Còn đối với tôi
  rationale: Diễn đạt tự nhiên sở chỉ định của dữ cách ἐμοὶ, đồng thời giữ sắc thái chuyển ý của δέ.
- source_word: εἰς ἐλάχιστόν ἐστιν
  choice: chỉ là chuyện rất nhỏ
  rationale: Truyền đạt thành ngữ chỉ mức độ quan trọng tối thiểu, với lối nói hiện đại và dễ hiểu.
- source_word: ἵνα ὑφ’ ὑμῶν ἀνακριθῶ
  choice: việc bị anh em xem xét
  rationale: ἵνα ở đây dẫn nội dung của điều Phao-lô coi là rất nhỏ; thể bị động và tác nhân số nhiều được giữ rõ. Đại từ 'anh em' phù hợp cách xưng hô với cộng đồng tín hữu trong ngữ cảnh.
- source_word: ἀνακριθῶ / ἀνακρίνω
  choice: bị xem xét / xem xét
  rationale: Giữ liên kết từ vựng giữa hai lần xuất hiện và sắc thái khảo xét, thẩm tra, không đẩy nghĩa sang phán quyết chung cuộc như 'kết án'.
- source_word: ἢ ὑπὸ ἀνθρωπίνης ἡμέρας
  choice: hay bị một tòa án loài người[a] xem xét
  rationale: ἀνθρωπίνης ἡμέρας có nghĩa đen là 'ngày của loài người' nhưng trong ngữ cảnh là thành ngữ về sự khảo xét hoặc phiên xét xử của con người. 'Một tòa án loài người' truyền đạt nghĩa ngữ cảnh, còn chú thích bảo tồn hình thức Hy Lạp khác thường.
- source_word: ἀλλ’ οὐδὲ ἐμαυτὸν ἀνακρίνω
  choice: thật ra, ngay cả chính mình tôi cũng không xem xét
  rationale: Giữ bước tăng tiến nhấn mạnh của ἀλλ’ οὐδέ và đại từ phản thân ἐμαυτόν, đồng thời dùng câu Việt tự nhiên.
theological_decisions:
- issue: Ý nghĩa của ἀνθρωπίνης ἡμέρας
  choice: Dịch theo nghĩa thành ngữ là 'một tòa án loài người', kèm chú thích nghĩa đen.
  alternative: '''ngày của loài người'' hoặc ''sự phán xét của loài người'''
  rationale: Cụm từ đối lập sự khảo xét hiện thời của con người với sự xét đoán của Chúa trong mạch văn, chứ không chủ yếu nói về thời gian theo lịch. Cách dịch này dễ hiểu nhưng chú thích vẫn bảo tồn hình ảnh nguyên ngữ và mức độ bất thường của cụm từ.
- issue: Phạm vi nghĩa của ἀνακρίνω
  choice: Dùng 'xem xét' thay vì 'phán xét'.
  alternative: '''xét đoán'', ''thẩm tra'''
  rationale: Động từ có sắc thái khảo sát hoặc thẩm tra cẩn thận và khác với ngôn ngữ về phán quyết chung cuộc trong mạch văn. 'Xem xét' không khiến lời Phao-lô thành lời phủ nhận mọi tự kiểm điểm, đồng thời vẫn giữ được sự căng thẳng của phát biểu.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng 'anh em' cho số nhiều ὑμεῖς theo cách xưng hô cộng đồng quen thuộc trong thư tín; tránh từ pháp lý quá chuyên môn. Lặp 'xem xét' nhằm bảo tồn sự lặp từ của nguyên văn.
