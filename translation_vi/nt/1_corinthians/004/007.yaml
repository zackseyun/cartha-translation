id: 1CO.4.7
reference: 1 Corinthians 4:7
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τίς γάρ σε διακρίνει; τί δὲ ἔχεις ὃ οὐκ ἔλαβες; εἰ δὲ καὶ ἔλαβες, τί καυχᾶσαι ὡς μὴ λαβών;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/007.yaml
  text: For who makes you different? And what do you have that you did not receive? And if you did receive it[a], why do you boast as if you had not received it?
translation:
  language: vi
  text: Vì ai khiến bạn khác biệt?[a] Bạn có gì mà không nhận được? Nếu quả thật đã nhận được, sao bạn lại khoe khoang như thể mình không nhận được?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Vì ai phân biệt bạn?” Động từ Hy Lạp có thể mang nghĩa “phân biệt”, “làm cho khác nhau” hoặc “khiến nên khác biệt”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τίς γάρ σε διακρίνει
  choice: Vì ai khiến bạn khác biệt?
  rationale: “Khiến bạn khác biệt” diễn đạt tự nhiên nghĩa ngoại động của διακρίνω trong ngữ cảnh nói về sự hơn kém và lòng kiêu ngạo, nhưng không xác định ai tạo nên sự khác biệt hay sự khác biệt ấy thuộc loại nào. “Vì” phản ánh γάρ, nối câu hỏi này với lời quở trách trước đó.
- source_word: τί δὲ ἔχεις ὃ οὐκ ἔλαβες
  choice: Bạn có gì mà không nhận được?
  rationale: Câu hỏi ngắn gọn giữ nguyên sức mạnh tu từ của tiếng Hy Lạp. δέ chỉ chuyển nhẹ sang câu hỏi tiếp theo nên không cần dịch thành một từ nối đối lập; ἔλαβες được diễn đạt bằng “nhận được”, nhấn mạnh rằng điều đang có là điều đã được ban nhận chứ không tự mình tạo ra.
- source_word: εἰ δὲ καὶ ἔλαβες
  choice: Nếu quả thật đã nhận được
  rationale: Trong kết cấu này, καί tăng sức nhấn mạnh; “quả thật” truyền đạt ý ấy tự nhiên hơn là dịch theo nghĩa cộng thêm. Tân ngữ được để ngầm như trong tiếng Hy Lạp và vẫn rõ nhờ câu hỏi ngay trước.
- source_word: τί καυχᾶσαι
  choice: sao bạn lại khoe khoang
  rationale: “Khoe khoang” là cách diễn đạt tự nhiên, rõ ràng cho καυχάομαι và giữ được sắc thái quở trách một thái độ đang diễn ra.
- source_word: ὡς μὴ λαβών
  choice: như thể mình không nhận được
  rationale: “Như thể” giữ sắc thái giả định trái với thực tế của cụm phân từ; “mình” quy chiếu tự nhiên về người đang được chất vấn, còn điều đã nhận vẫn được để ngầm theo nguyên văn.
theological_decisions:
- issue: Phạm vi của điều con người đã nhận và căn cứ của sự khác biệt
  choice: 'Giữ cách nói khái quát: mọi điều người được hỏi đang có và mọi sự khác biệt làm nền cho việc khoe khoang đều là điều đã nhận.'
  alternative: Giới hạn câu này riêng vào ân tứ thuộc linh, vai trò phục vụ, hoặc mở rộng minh nhiên thành mọi khả năng và phước lành.
  rationale: Ngữ cảnh trực tiếp liên quan đến chức vụ, phe phái và sự khoe khoang, nhưng chính câu Hy Lạp dùng ngôn ngữ rộng. Bản dịch không thu hẹp hoặc mở rộng phạm vi vượt quá điều văn bản nói.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng đại từ số ít “bạn” để phản ánh σε trong tiếng Hy Lạp và giữ tính chất chất vấn trực tiếp; không tự ý đổi thành số nhiều. Chuỗi ba câu hỏi ngắn được giữ để bảo toàn nhịp điệu và sức mạnh tu từ.
