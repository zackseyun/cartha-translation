id: 1CO.4.17
reference: 1 Corinthians 4:17
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: διὰ τοῦτο ἔπεμψα ὑμῖν Τιμόθεον, ὅς ἐστίν ⸂μου τέκνον⸃ ἀγαπητὸν καὶ πιστὸν ἐν κυρίῳ, ὃς ὑμᾶς ἀναμνήσει τὰς ὁδούς μου τὰς ἐν Χριστῷ ⸀Ἰησοῦ, καθὼς πανταχοῦ ἐν πάσῃ ἐκκλησίᾳ διδάσκω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/017.yaml
  text: For this reason I sent Timothy to you[a], who is my beloved and faithful child in the Lord. He will remind you of my ways in Messiah Jesus[b], just as I teach everywhere in every church.
translation:
  language: vi
  text: Vì lý do đó, tôi đã sai Ti-mô-thê đến với anh chị em. Anh ấy là con yêu dấu và trung tín của tôi trong Chúa[a]. Anh ấy sẽ nhắc anh chị em nhớ lại những đường lối của tôi trong Đấng Mê-si-a Giê-su[b], đúng như tôi vẫn dạy trong mọi hội thánh ở khắp nơi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Con” dịch từ τέκνον, nghĩa đen là “đứa con”; vì Ti-mô-thê là nam giới, cũng có thể diễn đạt là “người con trai yêu dấu và trung tín của tôi trong Chúa.”
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “trong Đấng Christ Giê-su.” Từ Hy Lạp Χριστός là tước hiệu có nghĩa là “Đấng Mê-si-a,” tức Đấng được xức dầu.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Vì lý do đó
  rationale: Giữ rõ quan hệ nguyên nhân với lập luận ngay trước đó và diễn đạt tự nhiên trong tiếng Việt.
- source_word: ἔπεμψα
  choice: tôi đã sai
  rationale: Thì aorist được diễn đạt bằng một hành động quá khứ đơn; “sai” phù hợp với việc cử một người thi hành nhiệm vụ.
- source_word: Τιμόθεον
  choice: Ti-mô-thê
  rationale: Dùng dạng phiên âm quen thuộc của tên riêng này trong tiếng Việt.
- source_word: τέκνον
  choice: con
  rationale: “Con” giữ được ẩn dụ gia đình và không thu hẹp nghĩa thành một thuật ngữ chỉ riêng quan hệ sinh học; trong ngữ cảnh, từ này nói về Ti-mô-thê là nam giới.
- source_word: ἀγαπητὸν καὶ πιστὸν
  choice: yêu dấu và trung tín
  rationale: Giữ đồng thời tình cảm của Phao-lô và sự đáng tin cậy, bền lòng của Ti-mô-thê trong sự phục vụ.
- source_word: ἐν κυρίῳ
  choice: trong Chúa
  rationale: Bảo tồn cách nói đặc trưng của Phao-lô về mối quan hệ và phạm vi đời sống thuộc về Chúa.
- source_word: ἀναμνήσει
  choice: sẽ nhắc ... nhớ lại
  rationale: Diễn đạt tự nhiên động từ tương lai mang nghĩa làm cho người nghe nhớ lại điều đã biết.
- source_word: τὰς ὁδούς μου
  choice: những đường lối của tôi
  rationale: Giữ ẩn dụ “đường lối” cùng phạm vi nghĩa rộng, bao gồm nếp sống, cách hành xử và thực hành chức vụ của Phao-lô.
- source_word: τὰς ἐν Χριστῷ Ἰησοῦ
  choice: trong Đấng Mê-si-a Giê-su
  rationale: Cụm từ bổ nghĩa cho “những đường lối”, xác định chúng trong mối liên hệ với Đấng Mê-si-a Giê-su; “Đấng Mê-si-a” làm rõ giá trị tước hiệu của Χριστός.
- source_word: καθὼς πανταχοῦ ἐν πάσῃ ἐκκλησίᾳ διδάσκω
  choice: đúng như tôi vẫn dạy trong mọi hội thánh ở khắp nơi
  rationale: Giữ sự tương ứng do καθὼς biểu thị và nhấn mạnh phạm vi phổ quát của việc giảng dạy, đồng thời dùng trật tự từ tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Cách dịch Χριστός trong cụm ἐν Χριστῷ Ἰησοῦ
  choice: Đấng Mê-si-a Giê-su
  alternative: Đấng Christ Giê-su
  rationale: Ở đây Χριστός vẫn mang giá trị tước hiệu. “Đấng Mê-si-a” chuyển tải ý nghĩa của tước hiệu thay vì chỉ phiên âm, nhưng chú thích giữ cách gọi quen thuộc khác.
- issue: Phạm vi nghĩa của “những đường lối của tôi”
  choice: Giữ nguyên ẩn dụ, để bao gồm nếp sống, cách hành xử và thực hành giảng dạy của Phao-lô trong Đấng Mê-si-a
  alternative: cách sống của tôi; cách hành xử của tôi
  rationale: ὁδοί được dùng theo nghĩa ẩn dụ chứ không chỉ các tuyến đường đi lại. Bản dịch không thu hẹp cụm từ vào riêng đạo đức cá nhân hay giáo lý.
- issue: Ý nghĩa của πιστός
  choice: trung tín
  alternative: đáng tin cậy
  rationale: “Trung tín” phù hợp với bối cảnh đời sống và sự phục vụ trong Chúa, đồng thời vẫn hàm ý Ti-mô-thê là người đáng tin.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh chị em” cho đại từ số nhiều ὑμῖν/ὑμᾶς; dùng “hội thánh” cho ἐκκλησία. Đại từ “Người” giúp nối rõ Ti-mô-thê với hai mệnh đề tiếp theo mà không lặp tên quá nhiều.
