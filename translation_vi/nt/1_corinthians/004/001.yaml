review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp truyền đạt đúng các thành phần chính: mệnh lệnh nhìn nhận, “chúng tôi,” vai trò người phục vụ của Đấng Mê-si-a, và vai trò quản gia đối với các mầu nhiệm của Đức Chúa Trời. Tuy nhiên, “Mỗi người” có sắc thái phân phối (“từng người”) mạnh hơn danh từ khái quát ἄνθρωπος, và cấu trúc hiện tại không biểu đạt rõ lực chỉ cách của Οὕτως. Tên tước hiệu cũng cần chính tả chuẩn là “Mê-si-a.”'
  naturalness: “Người ta phải nhìn nhận chúng tôi theo cách này” là lối diễn đạt hiện đại, tự nhiên, vừa giữ được tính khái quát của ἄνθρωπος vừa phản ánh mệnh lệnh ngôi ba số ít. “Quản gia các mầu nhiệm” giữ phép ẩn dụ ngắn gọn hơn “quản gia được giao coi sóc,” vốn thêm lời giải thích vào chính văn.
  terminology: Giữ “Đấng Mê-si-a” cho Χριστοῦ theo quyết định thuật ngữ của dự án; chú thích nêu “Đấng Christ” như cách dịch thay thế. Giữ “mầu nhiệm” cho μυστήρια như một thuật ngữ Phao-lô, không diễn giải rằng các điều ấy đã được bày tỏ.
