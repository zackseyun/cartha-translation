id: 1CO.4.1
reference: 1 Corinthians 4:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Οὕτως ἡμᾶς λογιζέσθω ἄνθρωπος ὡς ὑπηρέτας Χριστοῦ καὶ οἰκονόμους μυστηρίων θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/001.yaml
  text: 'This is how a person should regard us: as servants of Messiah and stewards of the mysteries of God[a][b].'
translation:
  language: vi
  text: 'Người ta phải nhìn nhận chúng tôi theo cách này: là những người phục vụ Đấng Mê-si-a[a] và là những quản gia các mầu nhiệm của Đức Chúa Trời.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “Đấng Christ.” Từ Hy Lạp Χριστός là một tước hiệu, nghĩa là “Đấng được xức dầu.”'
    reason: lexical_alternative
  - marker: b
    text: “Quản gia” là người được chủ giao trách nhiệm coi sóc và phân phối những gì thuộc về chủ.
    reason: cultural_note
lexical_decisions:
- source_word: Οὕτως
  choice: Mỗi người hãy xem ... như
  rationale: Ý chỉ cách thức được thể hiện tự nhiên trong cấu trúc tiếng Việt; nội dung theo sau ὡς cho biết phải nhìn nhận họ như thế nào.
- source_word: ἡμᾶς
  choice: chúng tôi
  rationale: Đại từ ngôi thứ nhất số nhiều chỉ Phao-lô cùng các cộng sự/người phục vụ được nói đến trong ngữ cảnh.
- source_word: λογιζέσθω
  choice: hãy xem
  rationale: Giữ lực mệnh lệnh của động từ hiện tại, đồng thời diễn đạt tự nhiên hành động đánh giá hoặc nhìn nhận.
- source_word: ἄνθρωπος
  choice: mỗi người
  rationale: Danh từ số ít có nghĩa khái quát, không chỉ riêng nam giới; “mỗi người” vừa giữ nét số ít vừa rõ nghĩa phổ quát trong tiếng Việt.
- source_word: ὑπηρέτας
  choice: những người phục vụ
  rationale: Diễn tả người phục vụ dưới quyền, không mang hàm ý thân phận nô lệ như δοῦλος.
- source_word: Χριστοῦ
  choice: Đấng Mê-si
  rationale: Χριστός ở đây vẫn có sức nặng của một tước hiệu, chỉ Đấng được xức dầu mà họ phụng sự.
- source_word: οἰκονόμους
  choice: những quản gia được giao coi sóc
  rationale: “Quản gia” giữ hình ảnh người được chủ giao trách nhiệm quản lý; cụm “được giao coi sóc” làm rõ nét ủy thác mà không biến ẩn dụ thành lời giải thích dài.
- source_word: μυστηρίων
  choice: các mầu nhiệm
  rationale: Giữ thuật ngữ của Phao-lô về những điều thuộc chương trình của Đức Chúa Trời, vốn kín giấu và do Ngài bày tỏ, thay vì diễn giải ngay trong chính văn.
- source_word: θεοῦ
  choice: của Đức Chúa Trời
  rationale: 'Giữ quan hệ sở hữu/nguồn gốc tự nhiên của sở hữu cách: các mầu nhiệm thuộc về và đến từ Đức Chúa Trời.'
theological_decisions:
- issue: Cách dịch Χριστοῦ
  choice: Đấng Mê-si
  alternative: Đấng Christ
  rationale: Trong câu này từ này chỉ tước hiệu của Đấng mà các sứ đồ phục vụ. Chính văn dùng “Đấng Mê-si” để làm rõ ý “Đấng được xức dầu”; chú thích bảo lưu cách gọi quen thuộc “Đấng Christ”.
- issue: Nghĩa khái quát của ἄνθρωπος
  choice: mỗi người
  alternative: người ta; một người
  rationale: Ngữ pháp Hy Lạp dùng số ít nhưng ý nghĩa là bất cứ người nào. “Mỗi người” truyền đạt đúng phạm vi khái quát mà không gán câu này riêng cho nam giới.
- issue: Nội dung của μυστηρίων θεοῦ
  choice: các mầu nhiệm của Đức Chúa Trời
  alternative: những điều kín nhiệm của Đức Chúa Trời
  rationale: Không thêm vào chính văn rằng các mầu nhiệm đã được bày tỏ, vì câu này tự nó không nói rõ điều đó; cách dịch giữ nguyên độ hàm súc và chiều sâu thần học của từ Hy Lạp.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Mỗi người hãy xem” truyền đạt mệnh lệnh mang tính chuẩn mực; “người phục vụ” tránh nhầm với nô lệ; “quản gia” giữ nguyên hình ảnh ủy thác trong nguyên văn. Các dấu chú thích [a], [b] đều có mặt trong chính văn.
