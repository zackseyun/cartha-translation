  - severity: medium
    issue: “Đấng Mê-si” thiếu âm tiết cuối trong cách viết tiếng Việt chuẩn của Messiah.
    rationale: Dạng thông dụng và đầy đủ trong tiếng Việt hiện đại là “Đấng Mê-si-a.”
