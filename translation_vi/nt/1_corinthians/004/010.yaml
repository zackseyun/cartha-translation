revisions:
- from: Chúng tôi là những kẻ dại vì Đấng Mê-si[a], còn anh chị em là những người khôn ngoan trong Đấng Mê-si[b]; chúng tôi yếu đuối, còn anh chị em mạnh mẽ; anh chị em được trọng vọng[c], còn chúng tôi bị khinh rẻ.
  to: Chúng tôi là những kẻ dại vì Đấng Mê-si[a], còn anh chị em là những người khôn ngoan trong Đấng Mê-si[b]; chúng tôi yếu đuối, còn anh chị em mạnh mẽ; anh chị em được trọng vọng[c], còn chúng tôi bị coi thường.
  rationale: Chỉ điều chỉnh cách dịch ἄτιμοι và chú thích liên quan để phản ánh chính xác hơn sự đối lập về danh dự công khai trong nguyên ngữ; đồng thời loại bỏ phần diễn giải thêm khỏi chú thích a. Cấu trúc, đại từ nhấn mạnh, tước hiệu «Đấng Mê-si», và độ mở của ἐν Χριστῷ được giữ nguyên.
