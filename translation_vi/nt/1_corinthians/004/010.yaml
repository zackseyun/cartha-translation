id: 1CO.4.10
reference: 1 Corinthians 4:10
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἡμεῖς μωροὶ διὰ Χριστόν, ὑμεῖς δὲ φρόνιμοι ἐν Χριστῷ· ἡμεῖς ἀσθενεῖς, ὑμεῖς δὲ ἰσχυροί· ὑμεῖς ἔνδοξοι, ἡμεῖς δὲ ἄτιμοι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/010.yaml
  text: We are fools for Messiah[a], but you are wise in Messiah; we are weak, but you are strong; you are honored[c][b], but we are dishonored.
translation:
  language: vi
  text: Chúng tôi là những kẻ dại vì Đấng Mê-si[a], còn anh chị em là những người khôn ngoan trong Đấng Mê-si[b]; chúng tôi yếu đuối, còn anh chị em mạnh mẽ; anh chị em được trọng vọng[c], còn chúng tôi bị coi thường.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “vì cớ Đấng Mê-si.” Cụm từ Hy Lạp διὰ Χριστόν có thể diễn tả nguyên nhân hoặc mục đích.'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “trong Đấng Mê-si,” một cách nói quen thuộc trong các thư của Phao-lô; cũng thường được dịch là “trong Đấng Christ.”'
    reason: lexical_alternative
  - marker: c
    text: “Được trọng vọng” và “bị coi thường” ở đây chủ yếu nói đến danh dự và địa vị trước mắt người khác, chứ không chỉ nói đến cảm xúc bên trong.
    reason: cultural_note
lexical_decisions:
- source_word: μωροὶ
  choice: những kẻ dại
  rationale: Giữ sắc thái châm biếm mạnh của danh từ vị ngữ và tạo thế đối xứng trực tiếp với “những người khôn ngoan”.
- source_word: διὰ Χριστόν
  choice: vì Đấng Mê-si
  rationale: διά với đối cách ở đây có thể chỉ nguyên nhân hoặc mục đích; “vì” tự nhiên trong tiếng Việt và không loại bỏ hoàn toàn độ mở ấy.
- source_word: φρόνιμοι
  choice: những người khôn ngoan
  rationale: Diễn đạt trực tiếp vế đối lập mang tính mỉa mai với μωροὶ.
- source_word: ἐν Χριστῷ
  choice: trong Đấng Mê-si
  rationale: Bảo lưu cách nói đặc trưng của Phao-lô với ἐν, thay vì diễn giải thần học cụ thể hơn.
- source_word: ἀσθενεῖς / ἰσχυροί
  choice: yếu đuối / mạnh mẽ
  rationale: Giữ nguyên cặp tương phản rộng, không thu hẹp vào sức khỏe thể chất hay quyền lực xã hội.
- source_word: ἔνδοξοι / ἄτιμοι
  choice: được trọng vọng / bị khinh rẻ
  rationale: Truyền đạt sự đối lập về danh dự và địa vị công khai trong ngữ cảnh, bằng cách nói tự nhiên trong tiếng Việt.
- source_word: ἡμεῖς / ὑμεῖς
  choice: chúng tôi / anh chị em
  rationale: Giữ các đại từ được nhấn mạnh trong tiếng Hy Lạp; “anh chị em” phù hợp lời xưng hô với toàn thể cộng đoàn.
theological_decisions:
- issue: Cách dịch Χριστός
  choice: Đấng Mê-si
  alternative: Đấng Christ / Chúa Cứu Thế
  rationale: Dùng tước hiệu “Đấng Mê-si” để giữ lực tước hiệu của Χριστός mà không biến nó thành tên riêng hay đưa thêm cách diễn giải.
- issue: Ý nghĩa của ἐν Χριστῷ
  choice: trong Đấng Mê-si
  alternative: nhờ Đấng Mê-si / thuộc về Đấng Mê-si
  rationale: Giữ nguyên sự cô đọng và độ mở thần học của thành ngữ Phao-lô, không quyết định thay người đọc quan hệ chính xác được hàm ý.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. Giữ ba cặp đối lập cân xứng và giọng mỉa mai sắc bén của Phao-lô; dùng “còn” để thể hiện δὲ tự nhiên hơn việc lặp “nhưng” trong tiếng Việt.
