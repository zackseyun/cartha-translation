id: 1CO.4.13
reference: 1 Corinthians 4:13
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸀δυσφημούμενοι παρακαλοῦμεν· ὡς περικαθάρματα τοῦ κόσμου ἐγενήθημεν, πάντων περίψημα ἕως ἄρτι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/013.yaml
  text: When slandered[a], we appeal; we have become like the world's refuse, the scum of all things[b], until now.
translation:
  language: vi
  text: Khi bị phỉ báng[a], chúng tôi khẩn nài; chúng tôi đã trở nên như rác rưởi của thế gian, cặn bã của muôn vật[b], cho đến bây giờ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Khi bị bôi nhọ.” Động từ Hy Lạp tiếp theo có thể mang nghĩa “kêu gọi”, “khuyên bảo” hoặc “nài xin”; trong ngữ cảnh này, “khẩn nài” hoặc “kêu gọi” phù hợp với lời đáp trước sự phỉ báng.'
    reason: lexical_alternative
  - marker: b
    text: Hai từ được dịch là “rác rưởi” và “cặn bã” đều hiếm gặp và rất mạnh. Chúng có thể gợi đến những thứ bị quét, cạo hoặc lau bỏ trong lúc làm sạch, qua đó nhấn mạnh mức độ khinh miệt tột cùng mà các sứ đồ phải chịu.
    reason: cultural_note
lexical_decisions:
- source_word: δυσφημούμενοι
  choice: Khi bị vu khống
  rationale: Phân từ bị động chỉ việc bị nói xấu hoặc bôi nhọ; cách diễn đạt theo thời gian tự nhiên trong tiếng Việt và giữ được ý tổn hại danh dự.
- source_word: παρακαλοῦμεν
  choice: chúng tôi khuyên nhủ
  rationale: Động từ có thể mang nghĩa khuyên, kêu gọi hoặc nài xin. Trong chuỗi tương phản về cách các sứ đồ đáp lại sự ngược đãi, “khuyên nhủ” giữ được sắc thái ôn hòa mà không thêm trạng từ không có trong nguyên văn.
- source_word: ὡς
  choice: như
  rationale: Giới thiệu một sự so sánh, không nhất thiết khẳng định đồng nhất tuyệt đối.
- source_word: περικαθάρματα
  choice: rác rưởi
  rationale: Chỉ thứ bị loại bỏ khi làm sạch và hàm ý điều bị xem là hèn hạ; “rác rưởi” hiện đại, dễ hiểu và đủ mạnh.
- source_word: τοῦ κόσμου
  choice: của thế gian
  rationale: Giữ quan hệ sở thuộc/liên hệ của sở hữu cách và dùng cách nói quen thuộc trong văn phong Kinh Thánh tiếng Việt.
- source_word: ἐγενήθημεν
  choice: chúng tôi đã trở nên
  rationale: Diễn tả việc các sứ đồ đi vào tình trạng bị khinh miệt vẫn kéo dài đến thời điểm viết.
- source_word: πάντων
  choice: của muôn vật
  rationale: Giữ phạm vi bao quát của từ Hy Lạp mà không tự ý thu hẹp thành “mọi người”; “muôn vật” tự nhiên và trang trọng.
- source_word: περίψημα
  choice: cặn bã
  rationale: Từ hiếm chỉ phần bị lau hoặc cạo bỏ và theo nghĩa bóng là thứ bị coi rẻ; “cặn bã” truyền đạt sức nặng tu từ trong tiếng Việt hiện đại.
- source_word: ἕως ἄρτι
  choice: cho đến tận bây giờ
  rationale: Diễn tả tình trạng tiếp diễn tới chính thời điểm viết; “tận” nhấn đúng sắc thái hiện tại của cụm từ.
theological_decisions:
- issue: Cách dịch cặp từ hạ nhục περικαθάρματα / περίψημα
  choice: 'Dùng ngôn ngữ mạnh về sự khinh miệt xã hội: “rác rưởi” / “cặn bã”.'
  alternative: Dịch theo hình ảnh vật bị quét, cạo hoặc lau bỏ; hoặc đưa cách hiểu về vật/người dùng trong nghi thức thanh tẩy vào chính văn.
  rationale: Trọng tâm trực tiếp là tình trạng các sứ đồ bị thế gian coi là hèn hạ. Các liên hệ thanh tẩy hoặc nghi lễ còn gây tranh luận nên không được biến thành một khẳng định thần học trong chính văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ hình ảnh thô mạnh của nguyên văn nhưng tránh từ quá cổ; bảo tồn tính mơ hồ của παρακαλοῦμεν trong chú thích và không đưa cách hiểu nghi lễ còn tranh luận vào chính văn.
