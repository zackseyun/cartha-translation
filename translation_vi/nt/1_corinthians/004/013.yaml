revisions:
- from: Khi bị vu khống[a], chúng tôi khuyên nhủ; chúng tôi đã trở nên như rác rưởi của thế gian, cặn bã của muôn vật[b], cho đến tận bây giờ.
  to: Khi bị phỉ báng[a], chúng tôi khẩn nài; chúng tôi đã trở nên như rác rưởi của thế gian, cặn bã của muôn vật[b], cho đến bây giờ.
  rationale: 'Sửa hai lựa chọn từ vựng để tránh thu hẹp hoặc đổi hướng nghĩa của nguyên văn: δυσφημούμενοι được dịch bao quát là “bị phỉ báng”, và παρακαλοῦμεν là “chúng tôi khẩn nài” theo chức năng đối đáp trong ngữ cảnh. Giữ nguyên cặp hình ảnh “rác rưởi” / “cặn bã” và chú thích về khả năng liên hệ với việc làm sạch, nhưng không đưa diễn giải nghi lễ vào chính văn.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T18:10:49Z'
review_pass:
  verdict: revise
  source_fidelity: Cần sửa “khuyên nhủ” cho παρακαλοῦμεν. Trong chuỗi đáp lại sự ngược đãi, động từ này phù hợp hơn với hành động khẩn nài/kêu gọi đối phương, không phải chủ yếu là khuyên dạy hay khích lệ người khác. “Vu khống” cũng đặc thù hơn δυσφημούμενοι, vốn bao quát việc bị phỉ báng hay bôi nhọ.
  naturalness: Bản sửa dùng “bị phỉ báng” và “khẩn nài”, vừa tự nhiên trong văn phong Kinh Thánh tiếng Việt hiện đại vừa giữ được sự tương phản mạnh của câu. “Cho đến bây giờ” đủ diễn đạt ἕως ἄρτι, không cần thêm nét nhấn “tận”.
  terminology: “Rác rưởi của thế gian” / “cặn bã của muôn vật” bảo toàn hai hình ảnh hạ nhục mạnh, phân biệt được hai thuật ngữ gần nghĩa mà không áp đặt cách hiểu nghi lễ gây tranh luận. Không cần chú thích về nghĩa “ôn hòa”, vì đó là suy luận ngữ cảnh hơn là nghĩa được phát biểu trực tiếp.
  issues:
  - severity: medium
    issue: “chúng tôi khuyên nhủ” có thể bị hiểu là các sứ đồ khuyên dạy người khác.
    rationale: παρακαλοῦμεν trong ngữ cảnh đối lập với việc bị phỉ báng có sắc thái kêu gọi/khẩn nài đáp lại đối phương; “khẩn nài” phản ánh hướng nghĩa này tốt hơn.
  - severity: low
    issue: “bị vu khống” thu hẹp nghĩa của δυσφημούμενοι.
    rationale: Động từ chỉ việc bị nói xấu, phỉ báng hoặc bôi nhọ; nguyên văn không nhất thiết xác định một lời cáo buộc sai cụ thể như “vu khống” thường hàm ý.
  - severity: low
    issue: Chú thích a nói “lời đáp ôn hòa, không trả đũa” như thể là nội dung từ vựng trực tiếp.
    rationale: Đó là nhận định hợp lý từ ngữ cảnh, nhưng không phải nghĩa bắt buộc của riêng động từ; nên trình bày dè dặt hơn.
