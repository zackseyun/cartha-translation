id: 1CO.4.16
reference: 1 Corinthians 4:16
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: παρακαλῶ οὖν ὑμᾶς, μιμηταί μου γίνεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/016.yaml
  text: 'Therefore I urge you: become imitators of me[a][b].'
translation:
  language: vi
  text: 'Vì vậy, tôi khuyên anh chị em: hãy trở nên những người noi gương tôi.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “hãy là những người noi gương tôi.”'
    reason: lexical_alternative
  - marker: b
    text: 'Ở chỗ khác, Phao-lô nói rõ: “Hãy noi gương tôi, như tôi noi gương Đấng Christ” (1 Cô-rinh-tô 11:1).'
    reason: cross_reference
lexical_decisions:
- source_word: παρακαλῶ
  choice: tôi khuyên
  rationale: Trong ngữ cảnh này, động từ diễn tả lời khuyên nhủ tha thiết. “Tôi khuyên” tự nhiên trong tiếng Việt hiện đại mà vẫn giữ sức nặng của lời kêu gọi.
- source_word: οὖν
  choice: Vì vậy
  rationale: Từ này nối lời khuyên với lập luận ngay trước đó và biểu thị kết luận suy ra; “Vì vậy” thể hiện rõ quan hệ logic.
- source_word: ὑμᾶς
  choice: anh chị em
  rationale: Đại từ ngôi thứ hai số nhiều chỉ cộng đồng tín hữu. “Anh chị em” vừa rõ số nhiều, vừa phù hợp lối xưng hô cộng đồng trong thư tín.
- source_word: μιμηταί
  choice: những người noi gương
  rationale: Danh từ chỉ người bắt chước hoặc lấy một người khác làm mẫu. “Những người noi gương” tự nhiên và trang trọng hơn “những người bắt chước”, đồng thời vẫn giữ ý nghĩa chủ động mô phỏng mẫu mực.
- source_word: μου
  choice: tôi
  rationale: Đại từ sở hữu phụ thuộc vào μιμηταί, xác định chính Phao-lô là người được noi theo; cấu trúc “noi gương tôi” là tiếng Việt tự nhiên.
- source_word: γίνεσθε
  choice: hãy trở nên
  rationale: Mệnh lệnh hiện tại của γίνομαι có sắc thái bước vào hoặc nhận lấy một tư cách, nên “hãy trở nên” chính xác hơn việc chỉ dùng “hãy là”.
theological_decisions:
- issue: Lời Phao-lô kêu gọi tín hữu noi gương chính ông có thể bị làm nhẹ đi hoặc được giải thích ngay theo bối cảnh quy hướng về Đấng Christ.
  choice: 'Giữ lời kêu gọi trực tiếp: “hãy trở nên những người noi gương tôi.”'
  alternative: “hãy noi theo gương của tôi” hoặc thêm điều kiện quy hướng về Đấng Christ vào chính câu văn.
  rationale: Bản Hy Lạp nêu Phao-lô trực tiếp làm mẫu mực trong câu này. Bản dịch không làm dịu lời ấy; mối liên hệ với 1 Cô-rinh-tô 11:1 được nêu trong chú thích thay vì đưa vào chính văn.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh chị em” để thể hiện đối tượng số nhiều trong cộng đồng; giữ cấu trúc “hãy trở nên” nhằm phản ánh γίνεσθε, dù cách nói này có chủ ý trang trọng hơn khẩu ngữ.
