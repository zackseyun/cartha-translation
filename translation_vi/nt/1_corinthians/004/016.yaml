  source_fidelity: 'Bản dịch chuyển tải đầy đủ các thành tố của παρακαλῶ οὖν ὑμᾶς, μιμηταί μου γίνεσθε: quan hệ suy luận (“Vì vậy”), lời khuyên nhủ trực tiếp đến số nhiều (“tôi khuyên anh chị em”), và mệnh lệnh trở nên người noi gương Phao-lô. “Hãy trở nên” phản ánh hợp lý sắc thái γίνεσθε mà không thêm nội dung.'
  naturalness: Câu văn chuẩn tiếng Việt hiện đại, rõ ràng và có sắc thái thư tín trang trọng phù hợp. Cụm “những người noi gương tôi” tự nhiên hơn cách dịch sát nhưng kém Việt ngữ như “những kẻ bắt chước tôi.”
  terminology: “Anh chị em” phù hợp cách xưng hô cộng đồng của thư tín; “noi gương” chuyển đạt chính xác μιμηταί. Cách viết Phao-lô, Cô-rinh-tô và Đấng Christ nhất quán trong bản dịch. Chú thích a nêu đúng phương án diễn đạt khác; chú thích b được neo đúng chỗ và không đưa điều kiện từ 1 Cô-rinh-tô 11:1 vào chính văn.
