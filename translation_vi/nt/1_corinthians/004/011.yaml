base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/011.yaml
  text: Up to this present hour we are hungry and thirsty[a], and poorly clothed, and beaten[c][b], and homeless.
translation:
  language: vi
  text: Cho đến tận giờ này, chúng tôi vẫn đói, vẫn khát, thiếu áo che thân[a], bị đánh đập và không có chỗ ở cố định[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “trần truồng”; từ Hy Lạp có thể chỉ tình trạng không đủ quần áo chứ không nhất thiết hoàn toàn không mặc gì.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “sống phiêu bạt” hoặc “không có nơi ở ổn định.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄχρι τῆς ἄρτι ὥρας
  choice: Cho đến chính giờ này
  rationale: Diễn đạt tự nhiên ý kéo dài tới thời điểm hiện tại, đồng thời giữ sắc thái nhấn mạnh của ἄρτι và hình ảnh cụ thể của ὥρα.
- source_word: πεινῶμεν
  choice: chúng tôi vẫn đói
  rationale: Thì hiện tại mô tả tình trạng đang tiếp diễn; “vẫn” làm rõ sự kéo dài được nêu ở đầu câu mà không tăng mức độ.
- source_word: διψῶμεν
  choice: vẫn khát
  rationale: Giữ song hành với “vẫn đói” và diễn đạt tự nhiên tình trạng thiếu thốn liên tục.
- source_word: γυμνιτεύομεν
  choice: thiếu áo che thân
  rationale: Động từ có thể chỉ tình trạng không đủ quần áo, không nhất thiết hoàn toàn trần truồng. Cách dịch này giữ được sự thiếu thốn mà không nói quá nghĩa.
- source_word: κολαφιζόμεθα
  choice: bị đánh đập
  rationale: Dạng hiện tại bị động chỉ việc chịu bạo hành; “đánh đập” tự nhiên và có thể hàm ý sự lặp lại, không thu hẹp vào một kiểu đánh cụ thể.
- source_word: ἀστατοῦμεν
  choice: không có chỗ ở cố định
  rationale: Giữ ý bất ổn và không có nơi cư trú ổn định; tránh để “vô gia cư” bị hiểu quá hẹp theo phạm trù xã hội hiện đại.
- source_word: καὶ ... καὶ ... καὶ ...
  choice: vẫn ... vẫn ..., ..., ... và ...
  rationale: Tiếng Việt không cần lặp “và” ở mọi vế; việc lặp “vẫn” ở hai tình trạng đầu và giữ chuỗi liệt kê bảo toàn cảm giác dồn dập trong khi câu vẫn tự nhiên.
theological_decisions:
- issue: Tính chất lời tự thuật của Phao-lô
  choice: Một danh mục cụ thể về sự thiếu thốn và ngược đãi mà các sứ đồ đang chịu
  alternative: Một mô tả chủ yếu mang tính khoa trương tu từ
  rationale: Các động từ hiện tại trình bày những gian khổ đang tiếp diễn bằng ngôn ngữ trực tiếp. Bản dịch không làm nhẹ cũng không cường điệu các khổ nạn ấy.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Chúng tôi” phù hợp lời tự thuật của Phao-lô cùng các cộng sự. Các từ “thiếu áo che thân,” “bị đánh đập” và “không có chỗ ở cố định” diễn tả trực tiếp sự thiếu thốn mà không dùng lối nói cổ hoặc thuật ngữ giáo phái.
