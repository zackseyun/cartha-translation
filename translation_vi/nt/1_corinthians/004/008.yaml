id: 1CO.4.8
reference: 1 Corinthians 4:8
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἤδη κεκορεσμένοι ἐστέ, ἤδη ἐπλουτήσατε, χωρὶς ἡμῶν ἐβασιλεύσατε· καὶ ὄφελόν γε ἐβασιλεύσατε, ἵνα καὶ ἡμεῖς ὑμῖν συμβασιλεύσωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/008.yaml
  text: Already you have had your fill[a]; already you have become rich; apart from us you have become kings. And I wish indeed that you had become kings[c][b], so that we also might reign with you.
translation:
  language: vi
  text: Anh chị em đã no đủ rồi; anh chị em đã trở nên giàu có rồi; không có chúng tôi, anh chị em đã trị vì rồi. Ước gì anh chị em quả thật đã trị vì[a], để chúng tôi cũng trị vì với anh chị em.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Ước gì anh chị em quả thật làm vua.”'
    reason: lexical_alternative
  - marker: b
    text: 'Phao-lô nói với giọng mỉa mai: người Cô-rinh-tô hành xử như thể họ đã hoàn toàn no đủ, giàu có và đang trị vì.'
    reason: rhetorical_note
lexical_decisions:
- source_word: ἤδη
  choice: đã... rồi
  rationale: Lặp lại ý thời gian trong hai vế đầu bằng cấu trúc tự nhiên của tiếng Việt, đồng thời giữ sức nhấn mỉa mai.
- source_word: κεκορεσμένοι ἐστέ
  choice: đã no đủ rồi
  rationale: Diễn đạt trạng thái no thỏa do một hành động đã hoàn tất; giữ hình ảnh về sự no đủ và sắc thái mỉa mai.
- source_word: ἐπλουτήσατε
  choice: đã trở nên giàu có rồi
  rationale: Giữ động thái 'trở nên giàu' thay vì chỉ mô tả trạng thái 'giàu', đồng thời phản ánh kết quả hiện tại.
- source_word: χωρὶς ἡμῶν
  choice: không cần đến chúng tôi
  rationale: Trong ngữ cảnh lời trách mang tính mỉa mai, cách nói này diễn đạt tự nhiên ý người Cô-rinh-tô tự xem mình đạt địa vị ấy độc lập với các sứ đồ; một khả năng sát hình thức hơn là 'không có chúng tôi'.
- source_word: ἐβασιλεύσατε
  choice: đã làm vua rồi / thực sự làm vua
  rationale: Giữ nguyên hình ảnh vương quyền của động từ βασιλεύω, không thêm sắc thái khởi đầu vốn không được động từ biểu thị rõ.
- source_word: ὄφελόν γε
  choice: Tôi thật ước ao
  rationale: Diễn đạt một lời ước mạnh, vừa tiếp nối giọng mỉa mai vừa có thể chứa mong muốn chân thành.
- source_word: ἵνα
  choice: để
  rationale: Biểu thị mục đích hoặc kết quả mong muốn một cách tự nhiên trong tiếng Việt.
- source_word: συμβασιλεύσωμεν
  choice: cũng được cùng trị vì với anh chị em
  rationale: Giữ rõ ý đồng trị vì của tiền tố συν- và hình ảnh vương quyền.
theological_decisions:
- issue: Giọng điệu của ba lời khẳng định đầu
  choice: Giữ chúng như những lời khẳng định mỉa mai, được tăng cường bằng 'rồi' và dấu chấm than.
  alternative: Hiểu như lời khen hoặc mô tả hoàn toàn theo nghĩa đen.
  rationale: Ngữ cảnh 1 Cô-rinh-tô 4:7–13 đối chiếu sự tự mãn của người Cô-rinh-tô với cảnh chịu khổ của các sứ đồ.
- issue: Ý nghĩa của hình ảnh làm vua
  choice: Giữ ngôn ngữ 'làm vua' và 'trị vì'.
  alternative: Làm phẳng thành 'thành công', 'có quyền' hoặc 'ở địa vị cao'.
  rationale: Các động từ βασιλεύω và συμβασιλεύω mang hình ảnh vương quyền rõ rệt và có thể chứa âm hưởng cánh chung; bản dịch không nên tự giải quyết hàm ý ấy.
- issue: Quan hệ giữa lời mỉa mai và lời ước
  choice: Dùng 'thực sự' để phân biệt việc họ tự cho mình đã làm vua với sự trị vì chân thật mà Phao-lô ước ao.
  alternative: Lặp nguyên 'đã làm vua' mà không đánh dấu sự tương phản.
  rationale: Cách này truyền đạt sự chuyển hướng của ὄφελόν γε mà không loại bỏ căng thẳng giữa mỉa mai và mong ước chân thành.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “anh chị em” để gọi cộng đồng tín hữu; lặp “rồi” nhằm tái hiện nhịp điệu nhấn mạnh của ἤδη và sắc thái mỉa mai.
