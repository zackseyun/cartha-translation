revisions:
- from: Anh chị em đã no đủ rồi; anh chị em đã trở nên giàu có rồi; không cần đến chúng tôi, anh chị em đã làm vua rồi! Tôi thật ước ao anh chị em thực sự làm vua[a], để chúng tôi cũng được cùng trị vì với anh chị em.[b]
  to: Anh chị em đã no đủ rồi; anh chị em đã trở nên giàu có rồi; không có chúng tôi, anh chị em đã trị vì rồi. Ước gì anh chị em quả thật đã trị vì[a], để chúng tôi cũng trị vì với anh chị em.[b]
  rationale: Bản sửa thay cách diễn giải mạnh “không cần đến” bằng “không có” để giữ phạm vi nghĩa của χωρὶς, dùng “trị vì” nhất quán cho hai động từ vương quyền, và bỏ “được” để không thêm hàm ý. Dấu chân chú thích được giữ và nội dung chú thích được chỉnh cho khớp với bản văn.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T18:10:50Z'
review_pass:
  verdict: revise
  source_fidelity: Bản nháp giữ đúng chuỗi nhấn mạnh của ἤδη, hình ảnh no đủ/giàu có/vương quyền, và nhận ra giọng mỉa mai. Tuy nhiên, “không cần đến chúng tôi” diễn giải χωρὶς ἡμῶν mạnh hơn nghĩa cơ bản “không có/tách khỏi chúng tôi”; nên dùng cách diễn đạt trung tính hơn. Ở lời ước, “thực sự” là một diễn giải hợp lý về chuyển hướng tu từ, nhưng “Ước gì ... quả thật đã trị vì” phản ánh trực tiếp hơn ὄφελόν γε ἐβασιλεύσατε mà không thêm sắc thái.
  naturalness: “Đã trị vì rồi” và “Ước gì ... quả thật đã trị vì” tự nhiên trong văn phong Kinh Thánh tiếng Việt hiện đại. Bỏ “được” trước “cùng trị vì” tránh hàm ý được cho phép vốn không có trong nguyên ngữ.
  terminology: “Anh chị em,” “no đủ,” “giàu có,” và “trị vì” phù hợp, nhất quán và giữ hình ảnh βασιλεύω/συμβασιλεύω. “Trị vì” chính xác hơn “làm vua” vì động từ Hy Lạp diễn tả việc cai trị/reign.
  issues:
  - severity: medium
    issue: “không cần đến chúng tôi” ở vế χωρὶς ἡμῶν
    rationale: Cụm này có thể hàm ý thái độ chủ động coi thường các sứ đồ. Nguyên ngữ nói tối thiểu là “không có/tách khỏi chúng tôi”; ý mỉa mai đã đủ rõ trong toàn câu, nên không cần thêm diễn giải.
  - severity: low
    issue: “cũng được cùng trị vì”
    rationale: “Được” có thể gợi ý sự cho phép hoặc khả năng được ban, không được biểu thị trong συμβασιλεύσωμεν. “Cũng trị vì với” giữ rõ ý đồng trị vì hơn.
  revised_text: Anh chị em đã no đủ rồi; anh chị em đã trở nên giàu có rồi; không có chúng tôi, anh chị em đã trị vì rồi. Ước gì anh chị em quả thật đã trị vì[a], để chúng tôi cũng trị vì với anh chị em.[b]
