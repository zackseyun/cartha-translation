  source_fidelity: 'Bản dịch giữ đúng các thành tố chính: số nhiều của «những điều này», việc Phao-lô chuyển dụng lập luận vào bản thân ông và A-bô-lô, mục đích dạy dỗ, câu châm ngôn tỉnh lược, và sự tự cao mang tính phe phái. Tuy nhiên, «áp dụng ... vào chính tôi và A-bô-lô» không phản ánh tự nhiên hành động μετασχηματίζω trong ngữ cảnh; cách nói về việc chuyển cách trình bày sang hai người này sát ý hơn.'
  naturalness: Câu nhìn chung trang trọng, dễ hiểu. Cần chỉnh «vào chính tôi» thành «sang bản thân tôi» và diễn đạt cả cụm động từ tự nhiên hơn. «Đứng về phía người này» truyền đạt rõ nét quan hệ ủng hộ/chống đối trong tiếng Việt hiện đại.
  terminology: «Thưa anh em», «A-bô-lô», và «đã được chép» phù hợp đăng ký văn phong và thông lệ. Chú thích về «anh em» và tính tỉnh lược của câu trích dẫn vẫn cần được giữ nguyên về nội dung.
  issues:
