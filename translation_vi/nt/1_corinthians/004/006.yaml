id: 1CO.4.6
reference: 1 Corinthians 4:6
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ταῦτα δέ, ἀδελφοί, μετεσχημάτισα εἰς ἐμαυτὸν καὶ ⸀Ἀπολλῶν δι’ ὑμᾶς, ἵνα ἐν ἡμῖν μάθητε τό· Μὴ ὑπὲρ ⸀ἃ ⸀γέγραπται, ἵνα μὴ εἷς ὑπὲρ τοῦ ἑνὸς φυσιοῦσθε κατὰ τοῦ ἑτέρου.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/006.yaml
  text: 'These things, brothers, I have applied to myself and Apollos for your sake, so that in us you may learn this: “Do not go beyond what is written,” so that none of you may be puffed up in favor of one against another.'
translation:
  language: vi
  text: 'Thưa anh em[a], vì anh em, tôi đã chuyển cách trình bày những điều này sang bản thân tôi và A-bô-lô, để qua chúng tôi, anh em học được điều này: “Đừng vượt quá những gì đã được chép,”[b] hầu cho không ai trong anh em tự cao, đứng về phía người này mà chống lại người kia.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hy Lạp được dịch là “anh em” có thể dùng để gọi một nhóm gồm cả nam lẫn nữ.
    reason: cultural_note
  - marker: b
    text: 'Nguyên văn Hy Lạp tỉnh lược, sát nghĩa là: “không vượt quá những gì đã được chép.” Cụm này có thể là một câu châm ngôn hoặc khẩu hiệu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταῦτα
  choice: những điều này
  rationale: Giữ số nhiều của đại từ chỉ định và quy chiếu rộng đến phần lập luận trước đó.
- source_word: ἀδελφοί
  choice: anh em
  rationale: Cách xưng hô tự nhiên, trang trọng trong tiếng Việt; có thể bao gồm toàn thể cộng đồng tín hữu, như chú thích nêu rõ.
- source_word: μετεσχημάτισα εἰς ἐμαυτὸν καὶ Ἀπολλῶν
  choice: tôi đã áp dụng ... vào chính tôi và A-bô-lô
  rationale: Diễn đạt sự chuyển dụng mang tính minh họa của phần bàn luận trước sang Phao-lô và A-bô-lô, đồng thời không thêm ý ngoài văn bản.
- source_word: δι’ ὑμᾶς
  choice: vì anh em
  rationale: Trong ngữ cảnh, διά với đối cách chỉ mục đích hay lợi ích dành cho người Cô-rinh-tô.
- source_word: ἵνα ἐν ἡμῖν μάθητε
  choice: để qua chúng tôi, anh em học được
  rationale: “Qua chúng tôi” là tiếng Việt tự nhiên và vẫn giữ ý Phao-lô cùng A-bô-lô là trường hợp minh họa để cộng đồng học bài học này.
- source_word: τό· Μὴ ὑπὲρ ἃ γέγραπται
  choice: 'điều này: “Đừng vượt quá những gì đã được chép”'
  rationale: Cụm Hy Lạp tỉnh lược; bản dịch bổ sung lực khuyên ngăn vốn được ngữ cảnh hàm ý, nhưng chú thích bảo tồn cấu trúc sát chữ và khả năng đây là một châm ngôn.
- source_word: φυσιοῦσθε
  choice: sinh lòng kiêu căng
  rationale: Truyền đạt rõ ẩn dụ về sự tự cao trong tiếng Việt hiện đại; “lên mặt” hoặc “phồng lên” sẽ kém trang trọng hay khó hiểu hơn ở đây.
- source_word: ὑπὲρ τοῦ ἑνὸς ... κατὰ τοῦ ἑτέρου
  choice: thiên vị người này mà chống lại người kia
  rationale: Làm rõ sự đối lập phe phái trong ngữ cảnh mà vẫn giữ hai hướng quan hệ “ủng hộ” và “chống lại” của nguyên văn.
theological_decisions:
- issue: Ý nghĩa của mệnh đề tỉnh lược τό· Μὴ ὑπὲρ ἃ γέγραπται
  choice: 'Dịch như lời khuyên ngăn: “Đừng vượt quá những gì đã được chép.”'
  alternative: 'Dịch sát cấu trúc hơn: “Không vượt quá những gì đã được chép,” hoặc xem đây là một khẩu hiệu/châm ngôn.'
  rationale: Nguyên văn không có động từ mệnh lệnh hiện rõ, nhưng mệnh đề μὴ và mục đích “để ... học” tự nhiên mang lực khuyên ngăn. Chú thích ghi nhận tính tỉnh lược và không khẳng định quá mức nguồn gốc của câu nói.
- issue: Phạm vi của “những gì đã được chép”
  choice: Không xác định cụ thể đó là toàn bộ Kinh Thánh hay chỉ các câu đã được trích trong ngữ cảnh.
  alternative: Giải thích minh nhiên là “Kinh Thánh” hoặc là những trích dẫn trước đó.
  rationale: Công thức γέγραπται thường liên quan đến lời Kinh Thánh, nhưng câu này không tự xác định chính xác phạm vi; bản dịch bảo tồn độ mở ấy.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Thưa anh em” cho lời gọi trực tiếp; giữ tên “A-bô-lô” theo dạng phiên âm quen thuộc. Cấu trúc câu được làm tự nhiên nhưng vẫn bảo tồn hai mệnh đề mục đích và sự mơ hồ thực sự của câu trích dẫn.
