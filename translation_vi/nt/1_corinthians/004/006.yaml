  to: 'Thưa anh em[a], vì anh em, tôi đã chuyển cách trình bày những điều này sang bản thân tôi và A-bô-lô, để qua chúng tôi, anh em học được điều này: “Đừng vượt quá những gì đã được chép,”[b] hầu cho không ai trong anh em tự cao, đứng về phía người này mà chống lại người kia.'
