    rationale: Cấu trúc này bám sát bị động εὑρεθῇ nhưng không phải lối diễn đạt tự nhiên. “Mỗi người phải tỏ ra trung tín” truyền đạt đúng kết quả được đòi hỏi nơi người quản gia, đồng thời vẫn phù hợp với ý được nhận ra khi xem xét.
  - severity: low
    issue: “Những người quản gia” có thể rút gọn thành “các quản gia.”
    rationale: “Các” biểu thị nhóm người xác định theo ngữ cảnh và tạo nhịp câu tự nhiên hơn, không thay đổi nghĩa của ἐν τοῖς οἰκονόμοις.
