language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸀ὧδε λοιπὸν ζητεῖται ἐν τοῖς οἰκονόμοις ἵνα πιστός τις εὑρεθῇ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/002.yaml
  text: In this case[a], moreover[c][b], it is required of stewards that one be found faithful.
translation:
  language: vi
  text: Vậy, trong việc này,[a] điều người ta đòi hỏi nơi các quản gia[b] là mỗi người phải tỏ ra trung tín.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Vả lại, ở đây” hoặc “Vậy, trong vấn đề này.”'
    reason: lexical_alternative
  - marker: b
    text: “Quản gia” là người được chủ giao trách nhiệm trông coi nhà cửa, tài sản và công việc.
    reason: cultural_clarification
  - marker: c
    text: 'Theo sát chữ: “được tìm thấy là trung tín”; tức là khi được xem xét, người ấy được nhận ra là đáng tin cậy.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὧδε λοιπὸν
  choice: Vậy, trong việc này
  rationale: Cụm này chuyển tiếp từ lời mô tả các sứ đồ là quản gia sang điều được mong đợi nơi họ. Cách dịch giữ sắc thái suy luận của λοιπὸν và nghĩa theo văn mạch của ὧδε, đồng thời tự nhiên hơn việc chồng hai từ nối trong tiếng Việt.
- source_word: ζητεῖται
  choice: điều người ta đòi hỏi
  rationale: Động từ có nghĩa gốc là “tìm kiếm”, nhưng trong kết cấu này chỉ điều được yêu cầu hay mong đợi nơi quản gia. Cách diễn đạt vô nhân xưng giữ được thể bị động của nguyên văn mà vẫn rõ nghĩa.
- source_word: ἐν τοῖς οἰκονόμοις
  choice: nơi những người quản gia
  rationale: ἐν nêu phạm vi hay nhóm người mà yêu cầu này áp dụng. “Nơi” giữ gần cấu trúc nguồn, còn “những người quản gia” bảo toàn hình ảnh người được giao trông coi gia sản.
- source_word: πιστός
  choice: trung tín
  rationale: Trong ngữ cảnh quản lý điều được giao phó, πιστός nói đến sự đáng tin cậy và bền lòng làm trọn trách nhiệm. “Trung tín” giữ được cả sức nặng đạo đức lẫn sắc thái tín nhiệm.
- source_word: τις εὑρεθῇ
  choice: mỗi người phải được nhận thấy
  rationale: τις là số ít phiếm chỉ, còn εὑρεθῇ diễn tả việc một người được nhận ra hoặc được xác nhận có phẩm chất ấy khi xem xét. “Mỗi người” truyền đạt tự nhiên sức đại diện và phân phối của số ít trong tiếng Việt, không giới hạn phát biểu vào nam giới.
theological_decisions:
- issue: Số ít đại diện và tính chính xác về giới
  choice: mỗi người phải được nhận thấy là trung tín
  alternative: một người phải được nhận thấy là trung tín
  rationale: τις và πιστός ở số ít giống đực theo ngữ pháp, nhưng phát biểu mang tính khái quát chứ không chỉ riêng nam giới. “Mỗi người” giữ ý rằng từng quản gia phải đáp ứng yêu cầu, không đưa thêm sự giới hạn về giới tính.
- issue: Ý nghĩa của πιστός trong trách nhiệm quản gia
  choice: trung tín
  alternative: đáng tin cậy
  rationale: “Trung tín” bao gồm sự đáng tin cậy khi thi hành điều được giao, nhưng không thu hẹp từ này thành năng lực quản trị đơn thuần. Bản dịch không quyết định vượt quá văn cảnh rằng từ này phải mang một nghĩa tín lý chuyên biệt.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Quản gia” được giữ để bảo toàn ẩn dụ về trách nhiệm quản lý điều được giao phó; chú thích giải nghĩa cho độc giả không quen chức vụ cổ đại này. Câu dùng “điều người ta đòi hỏi” thay cho lối bị động cứng, nhưng vẫn phản ánh kết cấu vô nhân xưng của tiếng Hy Lạp.
