id: 1CO.4.19
reference: 1 Corinthians 4:19
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐλεύσομαι δὲ ταχέως πρὸς ὑμᾶς, ἐὰν ὁ κύριος θελήσῃ, καὶ γνώσομαι οὐ τὸν λόγον τῶν πεφυσιωμένων ἀλλὰ τὴν δύναμιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/019.yaml
  text: But I will come to you soon[a], if the Lord wills, and I will find out not the speech of those who are puffed up[b], but the power.
translation:
  language: vi
  text: Nhưng tôi sẽ sớm đến với anh em, nếu Chúa muốn, và tôi sẽ biết rõ, không phải lời nói của những kẻ tự cao[a], mà là quyền năng của họ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên ngữ dùng một từ gợi hình ảnh bị làm cho phồng lên, chỉ tình trạng kiêu căng hoặc tự phụ; Phao-lô dùng từ này nhiều lần trong thư.
    reason: cross_reference
lexical_decisions:
- source_word: ἐλεύσομαι δὲ ταχέως πρὸς ὑμᾶς
  choice: Nhưng tôi sẽ sớm đến với anh em
  rationale: Dịch thể tương lai ἐλεύσομαι bằng “sẽ đến”; ταχέως trong ngữ cảnh chỉ thời điểm gần nên là “sớm”; δέ nối với ý trước bằng sắc thái tương phản nhẹ nên dùng “Nhưng”.
- source_word: ἐὰν ὁ κύριος θελήσῃ
  choice: nếu Chúa muốn
  rationale: Cách nói tự nhiên, trang trọng trong tiếng Việt, giữ nguyên tính điều kiện và sự lệ thuộc vào ý muốn của Chúa.
- source_word: γνώσομαι
  choice: tôi sẽ biết
  rationale: Giữ sát động từ Hy Lạp, đồng thời trong ngữ cảnh có nghĩa là trực tiếp xác định hay nhận biết thực chất khi Phao-lô đến.
- source_word: οὐ τὸν λόγον
  choice: không phải lời nói
  rationale: λόγος ở đây tương phản với δύναμις; “lời nói” giữ được phạm vi nghĩa rộng hơn “lời khoe khoang” và không diễn giải quá mức.
- source_word: τῶν πεφυσιωμένων
  choice: của những kẻ tự cao
  rationale: Phân từ hoàn thành diễn tả những người đang ở trong tình trạng kiêu căng. “Tự cao” tự nhiên trong tiếng Việt, dù không tái hiện hoàn toàn hình ảnh phồng lên của nguyên ngữ.
- source_word: ἀλλὰ τὴν δύναμιν
  choice: mà là quyền năng
  rationale: Giữ cấu trúc đối lập súc tích giữa λόγος và δύναμις, không tự ý xác định đây là phép lạ, thẩm quyền hay một biểu hiện cụ thể nào khác.
theological_decisions:
- issue: Chủ thể được gọi là ὁ κύριος
  choice: Chúa
  alternative: Chúa Jêsus; Đức Chúa Trời
  rationale: Nguyên văn chỉ nói “Chúa”; không thêm định danh để tránh giải quyết điều câu này không nói rõ.
- issue: Ý nghĩa của sự tương phản giữa λόγος và δύναμις
  choice: lời nói đối lập với quyền năng
  alternative: tài hùng biện đối lập với phép lạ; lời tuyên bố đối lập với thẩm quyền sứ đồ
  rationale: Bản dịch giữ độ rộng thần học của nguyên văn, không thu hẹp “quyền năng” vào một biểu hiện riêng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” theo cách xưng hô cộng đồng trong thư tín, có tính bao quát theo ngữ cảnh. Cấu trúc “không phải… mà là…” làm rõ phép đối lập của nguyên văn mà không thêm cách giải nghĩa thần học.
