revisions:
- from: Nhưng tôi sẽ sớm đến với anh em, nếu Chúa muốn, và tôi sẽ biết không phải lời nói của những kẻ tự cao[a], mà là quyền năng.
  to: Nhưng tôi sẽ sớm đến với anh em, nếu Chúa muốn, và tôi sẽ biết rõ, không phải lời nói của những kẻ tự cao[a], mà là quyền năng của họ.
  rationale: Chỉnh nhẹ để câu tiếng Việt tự nhiên và minh bạch hơn. “Biết rõ” phản ánh sắc thái Phao-lô sẽ xác định thực chất khi đến; “của họ” là sở hữu được hàm ý trong phép đối lập của nguyên văn. Không xác định thêm “Chúa” là ai, cũng không giải thích hẹp “quyền năng” thành phép lạ hay thẩm quyền.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T18:10:50Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch phản ánh đúng các yếu tố chính: tương lai “sẽ đến”, thời điểm “sớm”, điều kiện “nếu Chúa muốn”, và đối lập giữa λόγος với δύναμις. Tuy nhiên, cụm “tôi sẽ biết không phải lời nói … mà là quyền năng” chưa diễn đạt tự nhiên quan hệ bổ ngữ đối lập của γνώσομαι trong tiếng Việt. Thêm “của họ” ở vế sau chỉ làm rõ sở hữu được hàm ý bởi nguyên văn, không thu hẹp nghĩa của δύναμις.'
  naturalness: Câu hiện tại hơi gượng vì “biết lời nói” và “biết quyền năng” đặt ngay sau “không phải … mà là” không tự nhiên trong văn phong tiếng Việt hiện đại. “Tôi sẽ biết rõ, không phải … mà là …” tạo nhịp câu rõ và tự nhiên hơn.
  terminology: “Chúa” giữ đúng tính không xác định hơn của ὁ κύριος; không nên định danh thêm. “Quyền năng” phù hợp với δύναμις và bảo toàn độ mở của câu. “Những kẻ tự cao” là cách dịch tự nhiên của πεφυσιωμένων; chú thích duy trì hình ảnh “phồng lên” và việc Phao-lô lặp lại từ này.
  issues:
  - severity: medium
    issue: Cấu trúc “tôi sẽ biết không phải lời nói … mà là quyền năng” chưa tự nhiên và chưa rõ về mặt cú pháp tiếng Việt.
    rationale: γνώσομαι chi phối hai đối tượng được đặt đối lập. Trong tiếng Việt, thêm “rõ” sau động từ và nêu rõ sở hữu hàm ý ở “quyền năng của họ” giúp người đọc hiểu Phao-lô sẽ trực tiếp xác định thực chất của những người này, chứ không chỉ nghe lời họ nói.
