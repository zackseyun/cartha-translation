  source_fidelity: 'Bản dịch phản ánh sát cấu trúc và ý nghĩa nguyên ngữ: κοπιῶμεν là “lao nhọc”; phân từ ἐργαζόμενοι được giữ là “làm việc”; ταῖς ἰδίαις χερσίν nhấn mạnh “bằng chính đôi tay mình.” Hai cặp phân từ bị động và động từ chính cũng được chuyển đúng: bị nhục mạ/chúc lành; bị bắt bớ/chịu đựng. Không thêm tân ngữ cho ἀνεχόμεθα, phù hợp với nguyên văn.'
  naturalness: Câu văn tự nhiên trong tiếng Việt tiêu chuẩn hiện đại, với giọng trang trọng phù hợp văn mạch thư tín. “Lao nhọc, làm việc bằng chính đôi tay mình” diễn đạt rõ ý làm lụng vất vả và lao động thủ công. Dấu chấm phẩy cuối được giữ hợp lý vì câu là một phần của chuỗi liệt kê tiếp diễn.
  terminology: “Chúc lành” bảo toàn thuật ngữ εὐλογοῦμεν và phù hợp cách dùng Kinh Thánh tiếng Việt hiện đại. “Nhục mạ,” “bắt bớ,” và “chịu đựng” đều đúng ngữ cảnh và không áp đặt diễn giải giáo phái.
