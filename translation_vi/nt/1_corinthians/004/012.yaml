id: 1CO.4.12
reference: 1 Corinthians 4:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ κοπιῶμεν ἐργαζόμενοι ταῖς ἰδίαις χερσίν· λοιδορούμενοι εὐλογοῦμεν, διωκόμενοι ἀνεχόμεθα,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/012.yaml
  text: and we labor[a], working with our own hands. When insulted, we bless; when persecuted, we endure;
translation:
  language: vi
  text: và chúng tôi lao nhọc, làm việc bằng chính đôi tay mình. Khi bị nhục mạ, chúng tôi chúc lành; khi bị bắt bớ, chúng tôi chịu đựng;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κοπιῶμεν
  choice: chúng tôi lao nhọc
  rationale: Diễn đạt sự làm lụng vất vả đến mệt nhọc, mạnh hơn ý chỉ đơn thuần làm việc.
- source_word: ἐργαζόμενοι
  choice: làm việc
  rationale: Phân từ giải thích cách họ lao nhọc; cách dịch này tự nhiên và không thêm mục đích kiếm sống vốn không được nói rõ trong câu.
- source_word: ταῖς ἰδίαις χερσίν
  choice: bằng chính đôi tay mình
  rationale: Giữ sắc thái nhấn mạnh của ἰδίαις và ý lao động chân tay do chính họ thực hiện.
- source_word: λοιδορούμενοι
  choice: khi bị nhục mạ
  rationale: Giữ thể bị động và diễn đạt rõ hành vi lăng mạ bằng ngôn ngữ Việt hiện đại, trang trọng.
- source_word: εὐλογοῦμεν
  choice: chúng tôi chúc lành
  rationale: Giữ thuật ngữ Kinh Thánh then chốt và sự tương phản giữa việc bị nhục mạ với lời đáp đem điều lành.
- source_word: διωκόμενοι
  choice: khi bị bắt bớ
  rationale: Trong ngữ cảnh Phao-lô, từ này chỉ sự ngược đãi có chủ ý chứ không chỉ việc bị đuổi theo.
- source_word: ἀνεχόμεθα
  choice: chúng tôi chịu đựng
  rationale: Diễn đạt việc nhẫn chịu sự đối xử thù nghịch mà không thêm một tân ngữ không có trong tiếng Hy Lạp.
theological_decisions:
- issue: Cách đáp lại sự ngược đãi
  choice: 'Trình bày hành xử của các sứ đồ: đáp lại lời nhục mạ bằng lời chúc lành và chịu đựng khi bị bắt bớ.'
  alternative: Chuyển lời mô tả thành một mệnh lệnh luân lý trực tiếp cho mọi tín hữu.
  rationale: Nguyên văn mô tả thực hành của các sứ đồ bằng những vế đối lập ngắn gọn; bản dịch giữ sức nặng đạo đức nhưng không biến câu kể thành mệnh lệnh.
translation_notes:
  register: 'Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Giữ liên từ mở đầu “và” cùng dấu chấm phẩy cuối câu vì đây là một phần của chuỗi mô tả tiếp diễn. Không giữ chú thích [a] của lớp tham khảo tiếng Anh vì vị trí và nội dung chú thích không tương ứng: “when reviled” là phương án cho λοιδορούμενοι, không phải cho κοπιῶμεν; bản tiếng Việt đã dịch trực tiếp cả hai từ mà không cần chú thích.'
