revisions:
- from: Vì tôi nghĩ rằng Đức Chúa Trời đã đem chúng tôi, là các sứ đồ, ra trình diện sau cùng, như những người bị kết án tử hình[a], bởi chúng tôi đã trở thành một cảnh tượng[b] cho cả thế gian, cho cả thiên sứ lẫn loài người.
  to: Vì tôi nghĩ rằng Đức Chúa Trời đã đưa chúng tôi, là các sứ đồ, ra trình diện ở hàng cuối cùng, như những người bị định phải chết[a], vì chúng tôi đã trở thành một cảnh tượng[b] cho thế gian, cho các thiên sứ và loài người.
  rationale: Bản sửa tránh gán chắc sắc thái pháp lý hẹp cho ἐπιθανατίους, làm rõ ἐσχάτους là vị thế cuối cùng trong hành động phô bày, và cải thiện liên kết nhân quả bằng tiếng Việt tự nhiên. Các chú thích giữ hình ảnh đấu trường ở mức dè dặt (“có lẽ”), không áp đặt cách giải thích.
  reviewer_model: gpt-5.6-terra
