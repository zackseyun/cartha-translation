id: 1CO.4.9
reference: 1 Corinthians 4:9
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: δοκῶ ⸀γάρ, ὁ θεὸς ἡμᾶς τοὺς ἀποστόλους ἐσχάτους ἀπέδειξεν ὡς ἐπιθανατίους, ὅτι θέατρον ἐγενήθημεν τῷ κόσμῳ καὶ ἀγγέλοις καὶ ἀνθρώποις.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/009.yaml
  text: For it seems to me that God has displayed us[a], the apostles, last of all, like men sentenced to death, because we have become a spectacle to the world[c][b], both to angels and to men.
translation:
  language: vi
  text: Vì tôi nghĩ rằng Đức Chúa Trời đã đưa chúng tôi, là các sứ đồ, ra trình diện ở hàng cuối cùng, như những người bị định phải chết[a], vì chúng tôi đã trở thành một cảnh tượng[b] cho thế gian, cho các thiên sứ và loài người.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “như những người bị kết án tử hình.” Từ Hy Lạp chỉ những người được dành hoặc định cho cái chết, có lẽ gợi hình ảnh những người bị đưa ra đấu trường.'
    reason: lexical_alternative
  - marker: b
    text: 'Sát nghĩa hơn: “một sân khấu”; ở đây chỉ một cảnh tượng công khai cho người ta nhìn xem.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δοκῶ γάρ
  choice: Vì tôi nghĩ rằng
  rationale: Diễn đạt tự nhiên nhận định riêng của Phao-lô và giữ liên từ giải thích γάρ nối với mạch văn trước.
- source_word: ἡμᾶς τοὺς ἀποστόλους
  choice: chúng tôi, là các sứ đồ
  rationale: Giữ quan hệ đồng vị trong tiếng Hy Lạp, xác định nhóm mà Phao-lô nói đến là các sứ đồ.
- source_word: ἐσχάτους ἀπέδειξεν
  choice: đã đem ... ra trình diện sau cùng
  rationale: ἀπέδειξεν gợi việc đưa ra công khai; ἐσχάτους vừa chỉ vị trí cuối cùng vừa góp phần tạo hình ảnh đoàn người bị đưa vào đấu trường sau chót.
- source_word: ὡς ἐπιθανατίους
  choice: như những người bị kết án tử hình
  rationale: Diễn đạt những người đã bị định phải chết, phù hợp với hình ảnh công khai hoặc đấu trường trong câu.
- source_word: θέατρον ἐγενήθημεν
  choice: chúng tôi đã trở thành một cảnh tượng
  rationale: 'Chuyển nghĩa ẩn dụ của θέατρον sang tiếng Việt tự nhiên: điều được đưa ra cho công chúng nhìn xem, chứ không phải tòa nhà sân khấu.'
- source_word: τῷ κόσμῳ καὶ ἀγγέλοις καὶ ἀνθρώποις
  choice: cho cả thế gian, cho cả thiên sứ lẫn loài người
  rationale: Giữ thế gian là phạm vi khán giả bao quát và làm rõ hai nhóm được nêu tiếp theo là thiên sứ và con người.
theological_decisions:
- issue: Nghĩa của ἀγγέλοις
  choice: thiên sứ, tức các hữu thể thuộc trời đang chứng kiến cảnh các sứ đồ bị hạ nhục công khai
  alternative: các sứ giả nói chung
  rationale: Trong sự kết hợp với κόσμος và ἀνθρώποις, cách hiểu tự nhiên nhất là các hữu thể thiên giới, đối lập với loài người; bản dịch không thêm chi tiết giáo lý ngoài câu.
- issue: Tác nhân và sắc thái của ἀπέδειξεν
  choice: Đức Chúa Trời chủ động đem các sứ đồ ra trình diện công khai
  alternative: Đức Chúa Trời chỉ định các sứ đồ vào địa vị cuối cùng
  rationale: Động từ có sắc thái phô bày hoặc trình diện; bản dịch giữ hành động của Đức Chúa Trời mà không giải thích mục đích thần học của hành động ấy.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “Đức Chúa Trời,” “sứ đồ” và “thiên sứ” theo thuật ngữ Kinh Thánh phổ thông; dùng “loài người” để biểu đạt ἀνθρώποις theo nghĩa nhân loại nói chung, không riêng nam giới.
