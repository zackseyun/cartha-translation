  source_fidelity: 'Bản dịch giữ đúng cấu trúc lập luận và sắc thái pháp lý của nguyên văn: Phao-lô không biết điều gì bất lợi cho mình, nhưng sự tự nhận thức ấy không phải là cơ sở để ông được δικαιόω; Chúa là Đấng thẩm xét ông. Tuy nhiên, “được kể là công chính” có thể gợi một cách diễn đạt chuyên biệt về sự quy kể hơn là trực tiếp phản ánh bị động pháp lý của δεδικαίωμαι. “Được xưng là công chính” vừa sát thuật ngữ vừa nhất quán với chú thích.'
  naturalness: Câu văn nhìn chung tự nhiên và trang trọng. “Không tự biết mình có điều gì sai trái” có thể đổi thành “không tự biết mình có điều gì đáng trách” để diễn đạt rõ hơn thành ngữ σύνοιδα ἐμαυτῷ trong ngữ cảnh tự kiểm xét. Cần dời ký hiệu chú thích [c] đến cụm “xem xét tôi”, vì chú thích này giải thích ἀνακρίνων, không phải κύριος.
