id: 1CO.4.4
reference: 1 Corinthians 4:4
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οὐδὲν γὰρ ἐμαυτῷ σύνοιδα, ἀλλ’ οὐκ ἐν τούτῳ δεδικαίωμαι, ὁ δὲ ἀνακρίνων με κύριός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/004.yaml
  text: For I am aware of nothing against myself[a], but I am not justified by this[c][b]; the one who examines me is the Lord.
translation:
  language: vi
  text: Vì tôi không tự biết mình có điều gì đáng trách[a]; nhưng không phải nhờ điều đó mà tôi được xưng là công chính[b]. Đấng xem xét tôi[c] chính là Chúa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “tôi không ý thức mình có điều gì đáng trách” hoặc “lương tâm tôi không cáo trách tôi điều gì.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “tôi không được tuyên trắng án nhờ đó” hoặc “tôi không được minh oan bởi điều ấy.” Từ Hy Lạp là một thuật ngữ pháp lý, cũng được Phao-lô dùng ở những nơi khác với nghĩa “được xưng là công chính.”'
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “Đấng xét xử tôi.” Động từ Hy Lạp có thể mang nghĩa xem xét, thẩm tra hoặc đánh giá trong một bối cảnh tư pháp.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲν γὰρ ἐμαυτῷ σύνοιδα
  choice: Vì tôi không tự biết mình có điều gì sai trái
  rationale: Cụm σύνοιδα với đại từ phản thân ở cách dữ liệu diễn tả việc ý thức trong lương tâm về điều bất lợi cho chính mình. Cách dịch này tự nhiên trong tiếng Việt và giữ sắc thái đạo đức–pháp lý của ngữ cảnh.
- source_word: ἀλλ’ οὐκ ἐν τούτῳ
  choice: nhưng không phải nhờ đó mà
  rationale: 'ἐν τούτῳ chỉ căn cứ hoặc phương diện: việc Phao-lô không ý thức mình có lỗi không phải là cơ sở quyết định cho phán quyết.'
- source_word: δεδικαίωμαι
  choice: tôi được kể là công chính
  rationale: Thể hoàn thành bị động của δικαιόω mang sắc thái pháp lý. Cách dịch giữ mối liên hệ với thuật ngữ 'công chính' trong Phao-lô mà không biến câu này thành một tuyên bố hệ thống rộng hơn ngữ cảnh.
- source_word: ὁ δὲ ἀνακρίνων με
  choice: Đấng xem xét tôi
  rationale: ἀνακρίνω có thể chỉ việc xem xét, thẩm tra hoặc đánh giá trong bối cảnh tư pháp. 'Xem xét' giữ được tiến trình khảo xét mà không diễn đạt quá mức thành bản án cuối cùng.
- source_word: κύριός
  choice: Chúa
  rationale: κύριος được dịch là 'Chúa'; không thêm 'Giê-su' vì câu Hy Lạp không nêu rõ danh xưng ấy.
theological_decisions:
- issue: Sắc thái pháp lý của δεδικαίωμαι trong mối liên hệ với sự tự đánh giá của Phao-lô
  choice: được kể là công chính
  alternative: được tuyên trắng án; được minh oan
  rationale: Ngữ cảnh nói về việc đánh giá và phán xét người phục vụ. Bản dịch giữ thuật ngữ pháp lý–thần học của Phao-lô, đồng thời chú thích các cách hiểu pháp đình gần hơn trong ngữ cảnh.
- issue: Danh tính của κύριος
  choice: Chúa
  alternative: Chúa Giê-su
  rationale: Không mở rộng danh xưng vượt quá điều văn bản câu này nói rõ, dù trong văn mạch Phao-lô, từ này có thể chỉ Đấng Christ.
translation_notes:
  register: 'Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng ''tôi'' phù hợp lời tự thuật của Phao-lô; ''Đấng'' biểu thị chủ thể thần linh xác định. Trật tự câu giữ mạch lập luận: lương tâm không cáo trách không đồng nghĩa với một phán quyết công chính, vì quyền xem xét thuộc về Chúa.'
