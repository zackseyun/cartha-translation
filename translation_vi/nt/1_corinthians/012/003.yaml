revisions:
- from: 'Vì vậy, tôi cho anh chị em biết rằng không ai đang nói bởi Thánh Linh của Đức Chúa Trời lại nói: “Đức Chúa Jêsus đáng bị nguyền rủa,”[a] và cũng không ai có thể nói: “Đức Chúa Jêsus là Chúa,”[b] nếu không bởi Đức Thánh Linh.'
  to: 'Vì vậy, tôi cho anh chị em biết rằng không ai, khi nói nhờ Thần của Đức Chúa Trời, mà nói: “Giê-su bị nguyền rủa,”[a] và cũng không ai có thể nói: “Giê-su là Chúa,”[b] nếu không nhờ Đức Thánh Linh.'
  rationale: Bản sửa loại bỏ tước hiệu không có trong Ἰησοῦς để bảo toàn sự phân biệt nguyên ngữ giữa lời nguyền rủa và lời tuyên xưng κύριος. Đồng thời, “bị nguyền rủa” tránh hàm ý ‘đáng’ chịu lời nguyền, còn chú thích giữ khả năng lực cầu khiến của cụm Hy Lạp không có động từ. Cấu trúc câu được làm tự nhiên hơn mà không thu hẹp ý nghĩa về sự nói nhờ Thần.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T18:12:25Z'
