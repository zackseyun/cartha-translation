  source_fidelity: Bản nháp giữ được lập luận của διό, hai mệnh đề phủ định phổ quát, và vai trò tác nhân/phương tiện của Thần. Tuy nhiên, dùng “Đức Chúa Jêsus” ngay cả khi nguyên ngữ chỉ có Ἰησοῦς đã thêm tước hiệu vào cả hai lời phát biểu và làm mờ tương phản quan trọng với Κύριος Ἰησοῦς. “Đáng bị nguyền rủa” cũng có thể gợi nghĩa ‘xứng đáng bị nguyền rủa’, khác với lời tuyên bố/nguyền rủa Ἀνάθεμα Ἰησοῦς.
  naturalness: Cấu trúc “đang nói ... lại nói” nặng và lặp không cần thiết trong tiếng Việt hiện đại. “Khi nói nhờ ... mà nói” tự nhiên hơn, vẫn phản ánh phân từ λαλῶν và động từ λέγει. “Nếu không nhờ” là cách tự nhiên để diễn tả ngoại lệ duy nhất ở cuối câu.
  terminology: Dùng “Giê-su” cho Ἰησοῦς để không thêm ‘Đức Chúa’ trước khi cụm xưng nhận “Chúa Giê-su”/“Giê-su là Chúa” xuất hiện. “Chúa” giữ κύριος. “Thần của Đức Chúa Trời” và “Đức Thánh Linh” phản ánh lần lượt πνεύματι θεοῦ và πνεύματι ἁγίῳ mà không đồng nhất hóa từ ngữ bề mặt.
