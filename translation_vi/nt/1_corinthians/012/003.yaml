reference: 1 Corinthians 12:3
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: διὸ γνωρίζω ὑμῖν ὅτι οὐδεὶς ἐν πνεύματι θεοῦ λαλῶν λέγει· Ἀνάθεμα ⸀Ἰησοῦς, καὶ οὐδεὶς δύναται εἰπεῖν· ⸂Κύριος Ἰησοῦς⸃ εἰ μὴ ἐν πνεύματι ἁγίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/003.yaml
  text: Therefore I make known to you that no one speaking by the Spirit of God says[a], “Jesus is accursed,” and no one is able to say[b], “Jesus is Lord,” except by the Holy Spirit.
translation:
  language: vi
  text: 'Vì vậy, tôi cho anh chị em biết rằng không ai, khi nói nhờ Thần của Đức Chúa Trời, mà nói: “Giê-su bị nguyền rủa,”[a] và cũng không ai có thể nói: “Giê-su là Chúa,”[b] nếu không nhờ Đức Thánh Linh.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Giê-su hãy bị nguyền rủa,” phản ánh lực của tiếng kêu Hy Lạp Ἀνάθεμα Ἰησοῦς.'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn Hy Lạp: “Chúa Giê-su”; trong văn cảnh, đây là lời tuyên xưng: “Giê-su là Chúa.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: Vì vậy
  rationale: Diễn tả sự suy luận và liên kết với phần bàn luận ngay trước đó một cách tự nhiên trong tiếng Việt.
- source_word: γνωρίζω ὑμῖν
  choice: tôi cho anh chị em biết
  rationale: Giữ sắc thái khiến điều gì đó được biết đến, đồng thời dùng cách nói tự nhiên và trang trọng vừa phải.
- source_word: ἐν πνεύματι θεοῦ
  choice: bởi Thánh Linh của Đức Chúa Trời
  rationale: “Bởi” truyền đạt tác nhân hoặc phương tiện của lời nói được linh ứng; “Thánh Linh của Đức Chúa Trời” giữ cách gọi phân biệt với cụm πνεύματι ἁγίῳ cuối câu.
- source_word: λαλῶν λέγει
  choice: đang nói ... lại nói
  rationale: Giữ cả phân từ chỉ hành động nói và động từ dẫn nội dung phát ngôn, dù tiếng Việt có sự lặp nhẹ tương ứng với cấu trúc Hy Lạp.
- source_word: Ἀνάθεμα Ἰησοῦς
  choice: Đức Chúa Jêsus đáng bị nguyền rủa
  rationale: Cụm không có động từ được diễn đạt thành một mệnh đề tiếng Việt. “Đáng bị nguyền rủa” bảo toàn lực của ἀνάθεμα mà không biến nó thành một mệnh lệnh minh nhiên.
- source_word: δύναται εἰπεῖν
  choice: có thể nói
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt, giữ ý khả năng.
- source_word: Κύριος Ἰησοῦς
  choice: Đức Chúa Jêsus là Chúa
  rationale: Bổ sung hệ từ cần thiết trong tiếng Việt để thể hiện nội dung tuyên xưng, thay vì hiểu là cách xưng hô hoặc một danh hiệu ghép.
- source_word: εἰ μὴ ἐν πνεύματι ἁγίῳ
  choice: nếu không bởi Đức Thánh Linh
  rationale: Trong cấu trúc phủ định này, “nếu không bởi” diễn tả ngoại lệ duy nhất và bảo toàn sắc thái tác nhân của ἐν.
theological_decisions:
- issue: Ý nghĩa của κύριος trong lời tuyên xưng Κύριος Ἰησοῦς
  choice: Chúa
  alternative: Chủ
  rationale: “Chúa” vừa tự nhiên trong lời tuyên xưng Cơ Đốc vừa giữ trọng lượng thần học cao của κύριος trong văn cảnh Phao-lô, nhưng không diễn giải thêm những hàm ý ngoài câu.
- issue: Phạm vi của lời khẳng định rằng không ai có thể nói “Đức Chúa Jêsus là Chúa” nếu không bởi Đức Thánh Linh
  choice: Giữ nguyên lời khẳng định về khả năng tuyên xưng nhờ Đức Thánh Linh
  alternative: Giới hạn vào việc chỉ phát âm bằng miệng, hoặc mở rộng thành một hệ thống đầy đủ về sự tái sinh
  rationale: Bản dịch bảo toàn mối liên hệ mà câu văn đặt ra giữa lời tuyên xưng và tác động của Đức Thánh Linh, không tự ý thu hẹp hay hệ thống hóa thêm.
- issue: Sắc thái của Ἀνάθεμα Ἰησοῦς
  choice: 'Một lời khẳng định: “Đức Chúa Jêsus đáng bị nguyền rủa”'
  alternative: 'Một lời cầu khiến: “Đức Chúa Jêsus hãy bị nguyền rủa”'
  rationale: Câu Hy Lạp không có động từ và có thể mang lực của một tiếng kêu nguyền rủa; bản chính dùng mệnh đề khẳng định, còn khả năng cầu khiến được ghi chú để giữ sự mơ hồ chân thực.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” cho đại từ số nhiều ὑμῖν, “Đức Chúa Jêsus” và “Đức Thánh Linh” theo văn phong Kinh Thánh Tin Lành Việt ngữ quen thuộc. Dấu chú thích [a], [b] đều được đặt ngay sau nội dung liên quan.
