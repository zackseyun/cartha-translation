id: 1CO.12.20
reference: 1 Corinthians 12:20
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: νῦν δὲ πολλὰ ⸀μὲν μέλη, ἓν δὲ σῶμα.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/020.yaml
  text: But as it is[a], there are many parts, yet one body.
translation:
  language: vi
  text: Nhưng thực tế là có nhiều bộ phận, mà chỉ có một thân thể.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νῦν
  choice: thực tế là
  rationale: Trong mạch lập luận đối lập với giả định ở câu trước, νῦν chỉ thực trạng hiện hữu hơn là thời điểm đơn thuần; “thực tế là” diễn đạt tự nhiên chức năng này trong tiếng Việt.
- source_word: δὲ
  choice: Nhưng
  rationale: δέ đánh dấu sự tương phản nhẹ và tiếp nối lập luận từ câu trước; “Nhưng” giữ rõ bước chuyển ấy.
- source_word: πολλὰ ... μέλη
  choice: có nhiều bộ phận
  rationale: μέλη trong phép ẩn dụ về thân thể chỉ các bộ phận cấu thành. “Bộ phận” rõ nghĩa giải phẫu và tự nhiên trong tiếng Việt hiện đại.
- source_word: μὲν ... δὲ
  choice: nhiều ... mà chỉ có một
  rationale: Cặp tiểu từ tương liên cân đối sự đa dạng của các bộ phận với sự duy nhất của thân thể. Cấu trúc tiếng Việt này truyền đạt sự tương phản mà không dịch máy móc từng tiểu từ.
- source_word: ἓν
  choice: một
  rationale: Giữ nguyên sự nhấn mạnh vào tính duy nhất đối lập với số nhiều.
- source_word: σῶμα
  choice: thân thể
  rationale: “Thân thể” bảo toàn hình ảnh giải phẫu và sức nặng thần học của sự hiệp nhất giữa tính đa dạng.
theological_decisions:
- issue: Cách dịch μέλη trong phép ẩn dụ về thân thể
  choice: bộ phận
  alternative: chi thể
  rationale: “Bộ phận” rõ ràng, hiện đại và trực tiếp gợi các phần của thân thể, không khiến độc giả mặc nhiên hiểu theo thuật ngữ tổ chức hoặc giáo hội. “Chi thể” có tính truyền thống nhưng ít thông dụng hơn; trong tiếng Việt, sự khác biệt này chủ yếu thuộc văn phong chứ không tạo ra một cách hiểu thần học riêng cần áp đặt.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Câu giữ phép ẩn dụ về thân thể cùng thế tương phản giữa nhiều bộ phận và một thân thể; không thêm chú thích vì không có dị nghĩa đáng kể cần thiết cho độc giả tiếng Việt.
