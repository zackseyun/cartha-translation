id: 1CO.12.1
reference: 1 Corinthians 12:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Περὶ δὲ τῶν πνευματικῶν, ἀδελφοί, οὐ θέλω ὑμᾶς ἀγνοεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/001.yaml
  text: Concerning spiritual gifts, brothers, I do not want you to be uninformed.
translation:
  language: vi
  text: Về các ân tứ thuộc linh[a], thưa anh chị em[b], tôi không muốn anh chị em thiếu hiểu biết.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “những điều thuộc linh”; cụm từ Hy Lạp rộng hơn “các ân tứ,” dù ngữ cảnh chương này tập trung vào những ân tứ do Thánh Linh ban.
    reason: alternative_reading
  - marker: b
    text: Nguyên văn là “anh em,” một cách Phao-lô gọi hội chúng và nhiều khả năng bao gồm cả phụ nữ.
    reason: cultural_note
lexical_decisions:
- source_word: Περὶ δὲ
  choice: Về
  rationale: Mở sang một chủ đề mới. “Về” chuyển tải tự nhiên περί; sắc thái chuyển tiếp nhẹ của δέ được thể hiện qua cấu trúc mở đầu mà không thêm một từ chỉ thời gian như “bây giờ”.
- source_word: τῶν πνευματικῶν
  choice: các ân tứ thuộc linh
  rationale: Tính từ được danh từ hóa nên có thể chỉ “những điều thuộc linh” hoặc, ít thích hợp hơn trong ngữ cảnh này, “những người thuộc linh.” Vì phần tiếp theo tập trung vào các sự ban cho và sự biểu hiện của Thánh Linh, “các ân tứ thuộc linh” diễn đạt rõ quy chiếu theo ngữ cảnh; chú thích giữ lại nghĩa rộng hơn.
- source_word: ἀδελφοί
  choice: thưa anh chị em
  rationale: Trong cách xưng hô của Phao-lô với hội chúng, dạng số nhiều giống đực thường bao gồm cả nam lẫn nữ. Tiếng Việt tự nhiên dùng “anh chị em” để truyền đạt phạm vi người nghe, còn “thưa” thể hiện chức năng hô cách.
- source_word: οὐ θέλω ὑμᾶς ἀγνοεῖν
  choice: tôi không muốn anh chị em thiếu hiểu biết
  rationale: Đây là cách nói Phao-lô thường dùng để dẫn vào lời chỉ dạy quan trọng. “Thiếu hiểu biết” diễn đạt tự nhiên trạng thái không biết hoặc chưa được thông tin, không mang sắc thái miệt thị.
theological_decisions:
- issue: Cách hiểu τῶν πνευματικῶν
  choice: Dịch là “các ân tứ thuộc linh” trong chính văn
  alternative: “những điều thuộc linh”; cũng có thể hiểu về “những người thuộc linh”
  rationale: Cụm Hy Lạp tỉnh lược và rộng hơn từ “ân tứ,” nhưng 12:4–11 tập trung vào các ân ban và sự biểu hiện do Thánh Linh ban. Vì vậy, cách dịch chính văn theo ngữ cảnh là tự nhiên nhất, đồng thời chú thích bảo tồn sự mơ hồ thật sự của nguyên văn.
- issue: Phạm vi của ἀδελφοί
  choice: Dịch theo nghĩa dụng học là “anh chị em”
  alternative: “anh em” theo hình thức giống đực của nguyên văn
  rationale: Đây là lời gọi cả hội chúng, nhiều khả năng bao gồm phụ nữ. “Anh chị em” trong tiếng Việt truyền đạt chính xác phạm vi giao tiếp mà không khẳng định rằng hình thái Hy Lạp gồm cả hai giống.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “thuộc linh” vì đây là thuật ngữ quen thuộc trong văn cảnh Cơ Đốc, nhưng kèm chú thích để tránh thu hẹp sự mơ hồ của nguyên văn. Cặp “thưa anh chị em” tự nhiên hơn lối gọi chỉ giống đực trong tiếng Việt hiện đại.
