  text: εἰ ὅλον τὸ σῶμα ὀφθαλμός, ποῦ ἡ ἀκοή; εἰ ὅλον ἀκοή, ποῦ ἡ ὄσφρησις;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/017.yaml
  text: If the whole body were an eye[a], where would the hearing be? If the whole were hearing, where would the sense of smell be?
translation:
  language: vi
  text: Nếu cả thân thể đều là mắt[a], thì thính giác ở đâu? Nếu tất cả đều là thính giác, thì khứu giác ở đâu?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể diễn ý: “thì tai ở đâu? ... thì mũi ở đâu?” Tiếng Hy Lạp nói sát hơn về khả năng nghe và ngửi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅλον τὸ σῶμα
  choice: cả thân thể
  rationale: Diễn đạt tự nhiên trong tiếng Việt, đồng thời giữ nguyên hình ảnh giả định về toàn thân thể.
- source_word: ὀφθαλμός
  choice: mắt
  rationale: Giữ danh từ số ít chỉ bộ phận cơ thể trong vị ngữ; tiếng Việt không cần mạo từ bất định.
- source_word: ποῦ
  choice: ở đâu?
  rationale: Câu hỏi trực tiếp của tiếng Hy Lạp đã nằm trong điều kiện giả định; cấu trúc “thì ... ở đâu?” chuyển tải tự nhiên lực giả định ấy trong tiếng Việt.
- source_word: ἀκοή
  choice: thính giác
  rationale: Danh từ này chỉ khả năng nghe hơn là cơ quan tai. “Thính giác” chính xác, gọn và dùng được ở cả hai vị trí trong câu.
- source_word: ὅλον
  choice: tất cả
  rationale: Giữ sự tỉnh lược danh từ “thân thể” ở vế thứ hai mà vẫn rõ nghĩa và tự nhiên trong tiếng Việt.
- source_word: ὄσφρησις
  choice: khứu giác
  rationale: Danh từ chỉ khả năng ngửi; “khứu giác” tương ứng tự nhiên với “thính giác” và không đổi thành cơ quan “mũi”.
theological_decisions:
- issue: Ẩn dụ thân thể được diễn đạt bằng giác quan hay cơ quan vật lý
  choice: Dịch ἀκοή và ὄσφρησις là “thính giác” và “khứu giác”.
  alternative: Dịch thành “tai” và “mũi” để tạo hình ảnh các bộ phận cơ thể cụ thể hơn.
  rationale: Nguyên văn dùng các danh từ chỉ khả năng nghe và ngửi, không dùng từ chỉ tai và mũi. Bản dịch giữ sự phân biệt ấy, không cụ thể hóa quá mức hình ảnh của Phao-lô.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “thân thể” phù hợp với ngữ cảnh ẩn dụ của chương; “thính giác/khứu giác” giữ chính xác ngôn ngữ về chức năng cảm giác trong nguyên văn.
