source:
  edition: SBLGNT
  text: ἑκάστῳ δὲ δίδοται ἡ φανέρωσις τοῦ πνεύματος πρὸς τὸ συμφέρον.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/007.yaml
  text: But to each one the manifestation of the Spirit is given for the common good[a].
translation:
  language: vi
  text: Nhưng mỗi người được ban cho sự bày tỏ của Thánh Linh vì ích chung[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “vì điều có ích” hoặc “vì lợi ích của mọi người.”'
    reason: Giữ lại các khả năng diễn đạt của πρὸς τὸ συμφέρον, vốn có thể chỉ điều có lợi nói chung, dù ngữ cảnh nghiêng về lợi ích chung.
lexical_decisions:
- source_word: ἑκάστῳ
  choice: mỗi người
  rationale: Dạng tặng cách số ít mang ý phân phối, nhấn mạnh rằng từng người trong thân thể đều nhận được.
- source_word: δὲ
  choice: Nhưng
  rationale: Diễn đạt sự chuyển ý có sắc thái tương phản nhẹ với phần bàn luận trước đó, nhưng không cường điệu mối tương phản.
- source_word: δίδοται
  choice: được ban cho
  rationale: Giữ thể bị động của động từ Hy Lạp và sắc thái đây là điều được ban tặng.
- source_word: ἡ φανέρωσις
  choice: sự bày tỏ
  rationale: Diễn đạt điều được làm cho thấy rõ hoặc trở nên hiển hiện; tự nhiên hơn “sự biểu hiện” trong tiếng Việt mà vẫn sát nghĩa.
- source_word: τοῦ πνεύματος
  choice: của Thánh Linh
  rationale: Ngữ cảnh 1 Cô-rinh-tô 12 xác định πνεῦμα là Thánh Linh. Cách dịch này làm rõ đối tượng trong tiếng Việt mà không thêm tước hiệu “Đức” vốn không có trong nguyên văn.
- source_word: πρὸς τὸ συμφέρον
  choice: vì ích chung
  rationale: Cụm từ chỉ điều có lợi; trong ngữ cảnh thân thể và các ân tứ phục vụ lẫn nhau, “ích chung” truyền đạt đúng hướng cộng đồng, đồng thời chú thích giữ lại nghĩa rộng hơn.
theological_decisions:
- issue: Đối tượng được nói đến trong τοῦ πνεύματος
  choice: Thánh Linh
  alternative: thần linh; linh
  rationale: Các câu 4 và 8–11 trong cùng phân đoạn nhiều lần nói đến một Thánh Linh là nguồn ban các ân tứ, nên đây là đối tượng rõ ràng theo ngữ cảnh.
- issue: Phạm vi của συμφέρον
  choice: ích chung
  alternative: điều có ích; lợi ích của mọi người
  rationale: Từ này tự nó có thể chỉ lợi ích nói chung, nhưng lập luận của chương nhấn mạnh thân thể và sự gây dựng lẫn nhau. Bản chính thể hiện hướng cộng đồng, còn chú thích bảo tồn phạm vi từ vựng rộng hơn.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. “Sự bày tỏ” truyền đạt rõ hoạt động của Thánh Linh qua mỗi người; “ích chung” ngắn gọn và phù hợp với ngữ cảnh cộng đồng. Dấu chú thích [a] được đặt ngay sau cụm từ liên quan.
