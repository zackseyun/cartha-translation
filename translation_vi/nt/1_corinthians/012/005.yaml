  text: And there are varieties of ministries[a], and the same Lord.
translation:
  language: vi
  text: Có nhiều cách phục vụ[a], và cùng một Chúa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “các sự phục vụ”, “các chức vụ” hoặc “các hình thức phục vụ”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διαιρέσεις
  choice: nhiều cách
  rationale: Trong mạch song song của các câu 4–6, từ này chỉ sự đa dạng hay khác biệt, không phải chia rẽ. “Nhiều cách” diễn đạt tự nhiên các dạng khác nhau trong sự hiệp nhất.
- source_word: διακονιῶν
  choice: phục vụ
  rationale: Danh từ có thể chỉ sự phục vụ, chức vụ phục vụ, hoặc các công tác phục vụ. “Phục vụ” rộng, tự nhiên và không mặc nhiên giới hạn vào chức vụ chính thức.
- source_word: ὁ αὐτὸς
  choice: cùng một
  rationale: Giữ trọng tâm về sự đồng nhất và hiệp nhất giữa các cách phục vụ khác nhau, đồng thời phù hợp với điệp thức ở các câu 4–6.
- source_word: κύριος
  choice: Chúa
  rationale: Đây là cách dịch chuẩn, trang trọng của tước hiệu κύριος; trong ngữ cảnh nhiều khả năng chỉ Chúa Giê-su nhưng bản dịch không thêm lời giải thích vào câu.
- source_word: καὶ
  choice: nhưng
  rationale: Về hình thức, καὶ là liên từ nối thêm; trong tiếng Việt, “nhưng” làm rõ sự tương phản ngầm giữa nhiều dạng phục vụ và cùng một Chúa, tạo câu tự nhiên mà vẫn giữ cấu trúc tư tưởng.
- source_word: εἰσιν
  choice: có
  rationale: “Có” là cách diễn đạt hiện hữu tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Đối tượng được gọi là “Chúa” trong công thức ba vế ở 1 Cô-rinh-tô 12:4–6
  choice: Giữ nguyên tước hiệu “Chúa” mà không thêm “Giê-su” trong chính văn; theo ngữ cảnh, danh xưng này nhiều khả năng chỉ Chúa Giê-su.
  alternative: Hiểu theo nghĩa chung hơn là Chúa/Đức Chúa Trời.
  rationale: Ngữ cảnh lần lượt nói đến cùng một Thánh Linh, cùng một Chúa và cùng một Đức Chúa Trời. Cách dịch giữ nguyên sự phân biệt và mức độ hàm ẩn trong lời Phao-lô, không giải quyết thay cho nguyên văn.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. “Nhiều cách phục vụ” tránh sắc thái bè phái của “phân chia” và tránh thu hẹp διακονία thành chức vụ giáo hội chính thức.
