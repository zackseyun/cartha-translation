- from: Trái lại, những bộ phận của thân thể tưởng là yếu hơn lại càng cần thiết hơn.[a]
  to: Trái lại, những bộ phận của thân thể có vẻ yếu hơn lại càng cần thiết.[a]
  rationale: Thay «tưởng là» bằng «có vẻ» để diễn đạt chính xác và tự nhiên hơn sắc thái nhận định/vẻ bề ngoài của δοκοῦντα. Giữ «lại càng» để chuyển đạt πολλῷ μᾶλλον và giữ «cần thiết» cho ἀναγκαῖα.
