  text: ἀλλὰ πολλῷ μᾶλλον τὰ δοκοῦντα μέλη τοῦ σώματος ἀσθενέστερα ὑπάρχειν ἀναγκαῖά ἐστιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/022.yaml
  text: On the contrary[a], the parts of the body that seem to be weaker are necessary[c][b],
translation:
  language: vi
  text: Trái lại, những bộ phận của thân thể có vẻ yếu hơn lại càng cần thiết.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc dịch: “Trái lại, những bộ phận của thân thể có vẻ yếu hơn lại càng không thể thiếu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Trái lại
  rationale: Diễn đạt rõ sức tương phản và đính chính mạnh với ý ở câu trước.
- source_word: πολλῷ μᾶλλον
  choice: lại càng ... hơn
  rationale: Giữ lại từ tăng cường so sánh hiển ngôn trong tiếng Hy Lạp, đồng thời đặt tự nhiên trong cú pháp tiếng Việt.
- source_word: τὰ δοκοῦντα
  choice: những ... tưởng là
  rationale: Diễn tả sự đánh giá hoặc vẻ bề ngoài, không khẳng định đó là tình trạng thật.
- source_word: μέλη τοῦ σώματος
  choice: những bộ phận của thân thể
  rationale: Giữ nguyên hình ảnh cụ thể về thân thể; “bộ phận” tự nhiên hơn “chi thể” trong tiếng Việt hiện đại.
- source_word: ἀσθενέστερα ὑπάρχειν
  choice: yếu hơn
  rationale: Giữ nghĩa so sánh của ἀσθενέστερα; động từ ὑπάρχειν được thể hiện tự nhiên trong kết cấu “tưởng là”.
- source_word: ἀναγκαῖά ἐστιν
  choice: cần thiết
  rationale: Là cách dịch gần nghĩa và tự nhiên; trong văn cảnh cũng có thể hiểu mạnh là “không thể thiếu”.
theological_decisions:
- issue: Sức mạnh của hình ảnh thân thể trong văn cảnh hội thánh
  choice: Giữ cách nói cụ thể “những bộ phận của thân thể”
  alternative: Diễn giải thành “các thành viên trong hội thánh”
  rationale: Câu Hy Lạp tiếp tục dùng hình ảnh thân thể. Không đưa lời giải thích về hội thánh vào chính câu dịch, nhờ đó bảo toàn hình ảnh và sự triển khai lập luận của Phao-lô.
- issue: Địa vị thật hay sự đánh giá bề ngoài của các bộ phận yếu hơn
  choice: “tưởng là yếu hơn”
  alternative: “được coi là yếu hơn”
  rationale: δοκοῦντα để ngỏ việc đây là vẻ bề ngoài hoặc nhận định của người quan sát, chứ không xác nhận các bộ phận ấy thực sự yếu hơn.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “thân thể” để duy trì hình ảnh xuyên suốt; tránh “chi thể” vì dễ mang sắc thái thuật ngữ giáo hội. Đưa πολλῷ μᾶλλον vào câu bằng “lại càng ... hơn” thay vì lược bỏ từ tăng cường.
