  source_fidelity: Bản dịch giữ đúng hình ảnh «các bộ phận của thân thể», nghĩa so sánh của «yếu hơn», và lực tăng cường của πολλῷ μᾶλλον qua «lại càng». Tuy nhiên, «tưởng là» có thể gợi chủ thể tự tưởng mình yếu; δοκοῦντα ở đây nói điều có vẻ/được nhìn nhận là như vậy.
  naturalness: «Có vẻ yếu hơn» là cách nói tự nhiên, rõ nghĩa hơn trong tiếng Việt hiện đại. «Lại càng cần thiết» giữ được sắc thái nhấn mạnh mà không cần thêm một so sánh «hơn» dễ gây cảm giác trùng lặp.
  terminology: «Bộ phận của thân thể» phù hợp với μέλη τοῦ σώματος và bảo toàn phép ẩn dụ thân thể. «Cần thiết» dịch sát ἀναγκαῖα; «không thể thiếu» thích hợp làm phương án chú thích.
