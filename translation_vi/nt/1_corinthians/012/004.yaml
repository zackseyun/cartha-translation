source:
  edition: SBLGNT
  text: Διαιρέσεις δὲ χαρισμάτων εἰσίν, τὸ δὲ αὐτὸ πνεῦμα·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/004.yaml
  text: There are varieties of gifts[a], but the same Spirit.
translation:
  language: vi
  text: Có nhiều loại ân tứ, nhưng vẫn là cùng một Thánh Linh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “các sự khác biệt” hoặc “sự phân phối các ân tứ.” Tiếng Hy Lạp nhấn mạnh sự đa dạng giữa các ân tứ, không phải sự chia rẽ trong hội thánh.
    reason: Nêu các khả năng từ vựng của Διαιρέσεις, đồng thời làm rõ rằng ngữ cảnh nói về sự đa dạng chứ không phải phe phái.
lexical_decisions:
- source_word: Διαιρέσεις
  choice: nhiều loại
  rationale: Diễn đạt những sự phân biệt hay nhiều dạng trong một toàn thể, nhấn mạnh tính đa dạng của các ân tứ chứ không gợi ý sự chia rẽ trong hội thánh.
- source_word: δὲ ... δὲ
  choice: nhưng
  rationale: Tiếng Việt không cần thể hiện riêng δὲ thứ nhất khi mở mệnh đề; δὲ thứ hai được dịch là “nhưng” để giữ sự tương phản giữa tính đa dạng của ân tứ và sự đồng nhất của Thánh Linh.
- source_word: χαρισμάτων
  choice: ân tứ
  rationale: “Ân tứ” là cách nói tự nhiên trong ngữ cảnh Cơ Đốc, vừa chỉ những món quà hay khả năng được ban, vừa giữ được sắc thái ân điển của χάρισμα.
- source_word: τὸ ... αὐτὸ
  choice: cùng một
  rationale: Giữ sự nhấn mạnh rằng dù các ân tứ đa dạng, nguồn ban vẫn là một và không thay đổi.
- source_word: πνεῦμα
  choice: Thánh Linh
  rationale: Ngữ cảnh 1 Cô-rinh-tô 12:3–11 xác định đây là Thánh Linh, Đấng ban và phân phối các ân tứ; cách dịch này rõ nghĩa và tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Đối tượng được πνεῦμα chỉ đến
  choice: Thánh Linh
  alternative: linh của con người hoặc một năng lực thiêng liêng
  rationale: Ngữ cảnh gần nhiều lần trình bày Thánh Linh là nguồn và Đấng phân phối các ân tứ. Bản dịch gọi rõ là “Thánh Linh” nhưng không thêm lời giải thích thần học vào câu.
- issue: Mối quan hệ giữa sự đa dạng và sự hiệp nhất
  choice: Các ân tứ có nhiều loại nhưng Thánh Linh là cùng một Đấng
  alternative: Các ân tứ bị phân chia theo nghĩa gây chia rẽ
  rationale: Διαιρέσεις tại đây nói đến những dạng khác nhau trong một toàn thể; vế tương phản nhấn mạnh sự hiệp nhất về nguồn ban, không mô tả phe phái trong hội thánh.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Có nhiều loại” tự nhiên trong tiếng Việt; “ân tứ” phù hợp ngữ cảnh Kinh Thánh và ngắn gọn. Thêm “chỉ có” để diễn đạt tự nhiên sức tương phản của cấu trúc Hy Lạp mà không thay đổi nội dung.
