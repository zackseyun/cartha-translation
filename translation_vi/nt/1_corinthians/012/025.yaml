  text: so that there may be no division in the body[b][a], but that the members may have the same concern for one another.
translation:
  language: vi
  text: để không có sự chia rẽ[a] trong thân thể, nhưng các chi thể đều quan tâm đến nhau như nhau[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “phân rẽ” hoặc “rạn nứt.” Từ Hy Lạp có thể chỉ một sự tách hoặc vết rách; ở đây nói về sự chia rẽ trong thân thể.'
    reason: lexical_alternative
  - marker: b
    text: 'Hoặc: “cùng một sự quan tâm đến nhau.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: để
  rationale: Diễn đạt tự nhiên ý mục đích hoặc kết quả của liên từ Hy Lạp trong mạch văn.
- source_word: σχίσμα
  choice: sự chia rẽ
  rationale: Từ này chỉ sự tách, rách hoặc phân chia. “Chia rẽ” vừa rõ nghĩa trong tiếng Việt hiện đại, vừa phù hợp với hình ảnh thân thể và cộng đồng Hội Thánh.
- source_word: σῶμα
  choice: thân thể
  rationale: Giữ nguyên hình ảnh thân thể mà Phao-lô đang dùng; “thân thể” tự nhiên hơn “cơ thể” trong văn cảnh ẩn dụ này.
- source_word: τὸ αὐτό
  choice: cùng
  rationale: Kết hợp với động từ để diễn tả các chi thể có chung một sự quan tâm; cách dịch này tự nhiên nhưng vẫn để ngỏ sắc thái quan tâm như nhau.
- source_word: ὑπὲρ ἀλλήλων
  choice: đến nhau
  rationale: Trong kết cấu với μεριμνάω, cụm từ chỉ đối tượng của sự quan tâm và mang nghĩa tương hỗ.
- source_word: μεριμνῶσι
  choice: quan tâm
  rationale: Ở đây động từ mang nghĩa tích cực là chăm lo, lưu tâm, không phải lo âu tiêu cực.
- source_word: μέλη
  choice: các chi thể
  rationale: “Chi thể” giữ rõ hình ảnh các bộ phận thuộc cùng một thân thể và cũng phù hợp với cách dùng mở rộng về các thành viên của Hội Thánh.
theological_decisions:
- issue: Cách diễn đạt σχίσμα trong hình ảnh Hội Thánh như một thân thể
  choice: chia rẽ
  alternative: phân rẽ; rạn nứt
  rationale: “Chia rẽ” truyền đạt đúng sự phân ly trong thân thể mà không biến từ này thành một thuật ngữ giáo hội học chuyên biệt về sau.
- issue: Sắc thái của τὸ αὐτό với μεριμνῶσι
  choice: cùng quan tâm đến nhau
  alternative: quan tâm đến nhau như nhau
  rationale: Nguyên văn nhấn mạnh “cùng một điều/cùng một sự quan tâm” nhưng có thể được hiểu là sự quan tâm chung hoặc bình đẳng. Bản chính giữ cách nói tự nhiên; chú thích bảo tồn sắc thái bình đẳng có thể có.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. “Thân thể” và “các chi thể” duy trì nhất quán phép ẩn dụ của đoạn văn; cấu trúc câu ngắn gọn, phù hợp để đọc công khai.
