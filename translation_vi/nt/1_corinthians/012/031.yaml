id: 1CO.12.31
reference: 1 Corinthians 12:31
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ζηλοῦτε δὲ τὰ χαρίσματα τὰ ⸀μείζονα. καὶ ἔτι καθ’ ὑπερβολὴν ὁδὸν ὑμῖν δείκνυμι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/031.yaml
  text: But earnestly desire the greater gifts[b][a]. And I will show you a still more surpassing way.
translation:
  language: vi
  text: Nhưng hãy tha thiết mong muốn những ân tứ lớn hơn.[a] Và tôi còn chỉ cho anh chị em một con đường vượt trội hơn nữa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Nhưng anh chị em đang tha thiết mong muốn những ân tứ lớn hơn.” Trong ngữ cảnh này, hình thức Hy Lạp ζηλοῦτε có thể được hiểu là mệnh lệnh hoặc chỉ định.'
    reason: alternative_reading
  - marker: b
    text: 'Theo cách dịch truyền thống: “một con đường tuyệt hảo hơn nữa.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ζηλοῦτε
  choice: hãy tha thiết mong muốn
  rationale: Diễn đạt cường độ của ζηλόω bằng tiếng Việt tự nhiên và giữ cách hiểu mệnh lệnh trong câu chính; cách hiểu chỉ định được ghi ở chú thích.
- source_word: χαρίσματα
  choice: những ân tứ
  rationale: “Ân tứ” chuyển tải ý món quà do ân điển ban và đã quen thuộc trong ngữ cảnh 1 Cô-rinh-tô 12, không cần thêm “thuộc linh” vốn không có trong mệnh đề này.
- source_word: μείζονα
  choice: lớn hơn
  rationale: Giữ nguyên sức so sánh của tính từ và không giải thích quá mức rằng đó là lớn hơn về tầm quan trọng.
- source_word: καὶ ἔτι
  choice: Và ... còn ... nữa
  rationale: Thể hiện cả sự tiếp nối lẫn mức tăng tiến so với phần bàn luận trước.
- source_word: καθ’ ὑπερβολὴν
  choice: vượt trội hơn
  rationale: Diễn đạt ý vượt quá mức hay ưu việt đặc biệt bằng lối nói tự nhiên trong tiếng Việt hiện đại.
- source_word: ὁδὸν
  choice: một con đường
  rationale: Giữ hình ảnh ẩn dụ về lối sống hay cách hành xử dẫn vào chương nói về tình yêu thương.
- source_word: δείκνυμι
  choice: tôi ... chỉ cho
  rationale: Giữ thì hiện tại của động từ Hy Lạp; trong tiếng Việt, “tôi còn chỉ cho” tự nhiên khi người viết sắp trình bày điều ấy ngay sau đây.
theological_decisions:
- issue: Lực ngữ pháp của ζηλοῦτε
  choice: 'Mệnh lệnh: “hãy tha thiết mong muốn”'
  alternative: 'Chỉ định: “anh chị em đang tha thiết mong muốn”'
  rationale: Hình thức Hy Lạp có thể được hiểu là mệnh lệnh hoặc chỉ định. Mệnh lệnh phù hợp với mạch khuyên dạy, nhưng chú thích bảo tồn cách hiểu còn lại để không xóa bỏ sự nhập nhằng thật sự.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, dùng “anh chị em” để chỉ cộng đồng tín hữu. Câu giữ hình ảnh “con đường” và sự tăng tiến của καθ’ ὑπερβολὴν, đồng thời tránh thêm các từ không có trực tiếp trong nguyên văn.
