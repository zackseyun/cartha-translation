  terminology: Các thuật ngữ và hình ảnh then chốt được giữ sát nguồn, không diễn giải ẩn dụ thân thể thành hội thánh trong chính văn. “Cần đến” truyền đạt tự nhiên ý χρείαν ... ἔχω mà không thêm sắc thái khinh miệt. Chú thích đúng vị trí và hữu ích, dù sự phân biệt số đã được phản ánh trong bản dịch.
