id: 1CO.12.21
reference: 1 Corinthians 12:21
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οὐ δύναται δὲ ὁ ὀφθαλμὸς εἰπεῖν τῇ χειρί· Χρείαν σου οὐκ ἔχω, ἢ πάλιν ἡ κεφαλὴ τοῖς ποσίν· Χρείαν ὑμῶν οὐκ ἔχω·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/021.yaml
  text: But the eye cannot say to the hand[a], ‘I have no need of you,’ or again the head to the feet, ‘I have no need of you.’
translation:
  language: vi
  text: 'Nhưng mắt không thể nói với tay: “Tôi không cần đến bạn,” hoặc đầu cũng không thể nói với đôi chân: “Tôi không cần đến các bạn.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Trong tiếng Hy Lạp, “bạn” ở lời nói với tay là số ít, còn “các bạn” ở lời nói với đôi chân là số nhiều.
    reason: Làm rõ sự tương phản về số của hai đại từ trong nguyên văn; bản dịch tiếng Việt đã thể hiện sự khác biệt này.
lexical_decisions:
- source_word: οὐ δύναται
  choice: không thể
  rationale: Diễn đạt tự nhiên ý bất khả năng, chứ không chỉ nói rằng hành động ấy là không thích hợp.
- source_word: δὲ
  choice: Nhưng
  rationale: Giữ sắc thái tương phản với phần trình bày trước đó về sự nương tựa lẫn nhau giữa các bộ phận trong thân thể.
- source_word: ὁ ὀφθαλμός / τῇ χειρί
  choice: mắt / với tay
  rationale: Giữ nguyên hình ảnh cụ thể về các bộ phận thân thể trong ẩn dụ của Phao-lô.
- source_word: Χρείαν σου οὐκ ἔχω
  choice: Tôi không cần đến bạn
  rationale: Cách nói hiện đại, tự nhiên, giữ đúng ý về sự không cần đến mà không tăng sắc thái khinh miệt như cách nói “không có ích gì đối với tôi.”
- source_word: ἢ πάλιν
  choice: hoặc ... cũng
  rationale: Giới thiệu ví dụ tương ứng thứ hai bằng cấu trúc tiếng Việt tự nhiên; ý lặp lại của πάλιν được thể hiện qua “cũng.”
- source_word: ἡ κεφαλὴ / τοῖς ποσίν
  choice: đầu / với đôi chân
  rationale: Giữ hình ảnh thân thể; “đôi chân” diễn đạt tự nhiên số nhiều của ποσίν trong ngữ cảnh cơ thể người.
- source_word: σου / ὑμῶν
  choice: bạn / các bạn
  rationale: Tiếng Việt có thể thể hiện rõ sự chuyển từ đại từ số ít ở lời nói với tay sang đại từ số nhiều ở lời nói với hai chân.
theological_decisions:
- issue: Hình ảnh thân thể nói về sự nương tựa lẫn nhau trong hội thánh
  choice: Giữ nguyên các bộ phận thân thể mà không diễn giải trực tiếp thành các thành viên hội thánh
  alternative: Thêm lời giải thích ngay trong câu rằng các bộ phận tượng trưng cho tín hữu
  rationale: Lập luận thần học của Phao-lô vận hành qua chính ẩn dụ thân thể; diễn giải trong chính văn sẽ vượt quá điều bản văn nói.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “tôi,” “bạn” và “các bạn” để tránh đại từ cổ hoặc mang sắc thái miệt thị, đồng thời giữ rõ lời đối thoại trực tiếp giữa các bộ phận thân thể.
