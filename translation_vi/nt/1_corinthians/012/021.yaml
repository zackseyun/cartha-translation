  source_fidelity: 'Bản dịch giữ đúng cấu trúc đối chiếu của nguyên văn: mắt nói với tay (số ít), rồi đầu nói với đôi chân (số nhiều). “Không thể” diễn đạt đúng δύναται phủ định, và việc lặp lại “không thể” ở mệnh đề thứ hai làm rõ động từ được lược trong tiếng Hy Lạp mà không thêm nghĩa.'
