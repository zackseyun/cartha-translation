translation:
  language: vi
  text: Nếu tất cả đều là một bộ phận, thì thân thể ở đâu?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰ
  choice: Nếu
  rationale: Dẫn vào một giả định trong lập luận; “nếu” là cách diễn đạt trực tiếp và tự nhiên trong tiếng Việt.
- source_word: δὲ
  choice: thì
  rationale: δέ là từ nối nhẹ trong mạch lập luận. Không cần dịch bằng một liên từ đối lập riêng; cấu trúc “nếu… thì…” diễn đạt tự nhiên quan hệ của câu trong tiếng Việt.
- source_word: ἦν
  choice: là
  rationale: Động từ ở thì chưa hoàn thành nằm trong điều kiện giả định. Tiếng Việt không biến đổi động từ theo thì hay thức; ngữ nghĩa giả định đã được thể hiện qua cấu trúc “nếu… thì…”.
- source_word: τὰ πάντα
  choice: tất cả
  rationale: Trong ngữ cảnh ẩn dụ về thân thể, cụm này chỉ toàn thể các bộ phận được nói đến, không phải mọi sự vật nói chung.
- source_word: ἓν μέλος
  choice: chỉ là một bộ phận
  rationale: “Một bộ phận” truyền đạt tự nhiên μέλος trong hình ảnh thân thể; thêm “chỉ” làm rõ ý giả định rằng toàn thể bị thu lại thành duy nhất một bộ phận, phù hợp sức nhấn của ἓν trong ngữ cảnh.
- source_word: ποῦ
  choice: ở đâu?
  rationale: Giữ nguyên dạng câu hỏi tu từ về sự hiện hữu của thân thể trong tình huống giả định, không diễn giải thêm.
- source_word: τὸ σῶμα
  choice: thân thể
  rationale: “Thân thể” giữ rõ hình ảnh cơ thể và phù hợp với ẩn dụ xuyên suốt đoạn văn, đồng thời không thêm cụm “của Đấng Christ” vốn không có trong câu này.
theological_decisions:
- issue: Phạm vi của ẩn dụ thân thể
  choice: Giữ nguyên “thân thể” mà không xác định thêm.
  alternative: “thân thể của Đấng Christ” hoặc một cách dịch giải thích rõ là hội thánh.
  rationale: Dù văn mạch rộng hơn nói về cộng đồng tín hữu như thân thể của Đấng Christ, chính câu này chỉ có τὸ σῶμα. Bản dịch giữ nguyên mức độ xác định của nguyên văn và không đưa phần giải nghĩa thần học vào câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Bộ phận” tự nhiên hơn “chi thể” trong tiếng Việt phổ thông hiện nay, trong khi vẫn duy trì nhất quán hình ảnh thân thể. Câu hỏi tu từ ngắn gọn giữ được lực lập luận của nguyên văn.
