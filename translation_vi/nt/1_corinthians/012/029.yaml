source:
  edition: SBLGNT
  text: μὴ πάντες ἀπόστολοι; μὴ πάντες προφῆται; μὴ πάντες διδάσκαλοι; μὴ πάντες δυνάμεις;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/029.yaml
  text: Not all are apostles[a], are they? Not all are prophets, are they? Not all are teachers, are they? Not all work miracles, do they?
translation:
  language: vi
  text: Có phải tất cả đều là sứ đồ không? Có phải tất cả đều là nhà tiên tri không? Có phải tất cả đều là người dạy không? Có phải tất cả đều làm phép lạ[a] không?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “đều có các quyền năng.” Nguyên văn dùng “các quyền năng”, một cách nói tắt trong ngữ cảnh này về những việc kỳ diệu hoặc việc thực hiện những việc ấy.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ
  choice: Có phải ... không?
  rationale: 'Trong câu hỏi, μή hướng người nghe đến câu trả lời phủ định. Cấu trúc tiếng Việt này tự nhiên, đồng thời nhờ ngữ cảnh và sự lặp lại vẫn truyền đạt rõ ý: không phải tất cả đều như vậy.'
- source_word: πάντες
  choice: tất cả
  rationale: Giữ nguyên sự lặp lại có tính tu từ và nhấn mạnh rằng toàn thể thân thể không cùng đảm nhiệm một vai trò hay thi hành một ân tứ.
- source_word: ἀπόστολοι
  choice: sứ đồ
  rationale: Đây là thuật ngữ quen thuộc chỉ vai trò được nhìn nhận trong cộng đồng Cơ Đốc thời Phao-lô, chứ không chỉ có nghĩa chung là người đưa tin.
- source_word: προφῆται
  choice: nhà tiên tri
  rationale: Cách dịch chuẩn, tự nhiên cho những người nói tiên tri trong danh sách vai trò và ân tứ này.
- source_word: διδάσκαλοι
  choice: người dạy dỗ
  rationale: Diễn đạt rõ những người thực hiện chức năng giảng dạy, phù hợp với chuỗi danh từ chỉ người.
- source_word: δυνάμεις
  choice: làm các việc quyền năng
  rationale: Danh từ số nhiều theo nghĩa đen là “các quyền năng”, nhưng ở đây được dùng hoán dụ cho những việc quyền năng hoặc việc thực hiện chúng. Cách dịch bằng động từ tự nhiên trong tiếng Việt mà vẫn giữ sắc thái rộng hơn từ “phép lạ”.
theological_decisions:
- issue: Cách dịch δυνάμεις trong danh sách vai trò và ân tứ
  choice: đều làm các việc quyền năng
  alternative: đều làm phép lạ; đều có quyền năng
  rationale: Nguyên văn rút gọn bằng danh từ “các quyền năng” giữa một chuỗi vai trò và hoạt động. Dịch theo chức năng giúp câu tiếng Việt dễ hiểu mà không nói rằng con người chính là “các quyền năng”; “việc quyền năng” cũng bảo tồn sắc thái từ vựng và tránh thu hẹp không cần thiết.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ bốn câu hỏi song song cùng nhịp điệu lặp lại của nguyên văn; cấu trúc câu hỏi được hiểu là chờ câu trả lời phủ định.
