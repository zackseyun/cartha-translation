id: 1CO.12.15
reference: 1 Corinthians 12:15
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐὰν εἴπῃ ὁ πούς· Ὅτι οὐκ εἰμὶ χείρ, οὐκ εἰμὶ ἐκ τοῦ σώματος, οὐ παρὰ τοῦτο οὐκ ἔστιν ἐκ τοῦ σώματος;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/015.yaml
  text: If the foot says[a], “Because I am not a hand, I am not of the body,” it is not for this reason not of the body, is it?
translation:
  language: vi
  text: 'Nếu chân nói: “Vì tôi không phải là tay nên tôi không thuộc về thân thể,” thì có phải vì thế mà chân không thuộc về thân thể đâu?'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐὰν εἴπῃ
  choice: Nếu ... nói
  rationale: Cấu trúc ἐὰν với động từ ở lối giả định nêu một tình huống giả định có tính khái quát; cách dịch này tự nhiên và giữ nguyên lực điều kiện.
- source_word: ὁ πούς
  choice: chân
  rationale: Giữ hình ảnh bộ phận cơ thể cụ thể, vốn thiết yếu cho ẩn dụ của Phao-lô.
- source_word: Ὅτι
  choice: Vì
  rationale: Trong lời của chân, ὅτι mang sắc thái nguyên nhân, nêu lý do cho kết luận tiếp theo.
- source_word: χείρ
  choice: tay
  rationale: Giữ nguyên sự tương phản cụ thể giữa chân và tay trong ẩn dụ thân thể.
- source_word: ἐκ τοῦ σώματος
  choice: thuộc về thân thể
  rationale: Trong ngữ cảnh chỉ tư cách là một bộ phận của thân thể, cách nói này truyền đạt tự nhiên ý nghĩa của ἐκ mà không làm mất sự lặp lại của cụm từ.
- source_word: οὐ παρὰ τοῦτο
  choice: chẳng phải vì thế mà
  rationale: Diễn đạt quan hệ lý do bị bác bỏ và dẫn tự nhiên vào câu hỏi tu từ phủ định kép.
- source_word: οὐκ ἔστιν ἐκ τοῦ σώματος
  choice: nó không thuộc về thân thể, phải không?
  rationale: Giữ câu hỏi tu từ và mô thức phủ định của tiếng Hy Lạp, đồng thời dùng cú pháp tiếng Việt rõ ràng.
theological_decisions:
- issue: Mức độ làm trôi chảy phép ẩn dụ về thân thể và phủ định kép
  choice: 'Lặp lại “thuộc về thân thể” và giữ câu hỏi tu từ phủ định: “chẳng phải vì thế mà nó không thuộc về thân thể, phải không?”'
  alternative: “điều đó không khiến chân kém phần là một bộ phận của thân thể”
  rationale: Bản chọn giữ sát lập luận và sức căng tu từ của nguyên văn, nhưng tránh lối nói gượng “từ thân thể” trong tiếng Việt; không bổ sung một kết luận thần học ngoài câu.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Đại từ “tôi” nhân hóa chân một cách tự nhiên; “nó” ở mệnh đề kết luận quy chiếu rõ về chân. Không cần chú thích vì cách dịch chính vừa truyền đạt đúng nghĩa vừa giữ được sự lặp lại và câu hỏi tu từ.
