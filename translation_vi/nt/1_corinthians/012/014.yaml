reference: 1 Corinthians 12:14
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ γὰρ τὸ σῶμα οὐκ ἔστιν ἓν μέλος ἀλλὰ πολλά.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/014.yaml
  text: For the body is not one member, but many.
translation:
  language: vi
  text: Vì thân thể không phải chỉ có một chi thể, nhưng có nhiều chi thể.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ γὰρ
  choice: Vì
  rationale: Cụm liên từ mang chức năng giải thích cho lập luận ngay trước đó. “Vì” diễn đạt tự nhiên quan hệ này trong tiếng Việt mà không cần tách riêng cả hai tiểu từ.
- source_word: τὸ σῶμα
  choice: thân thể
  rationale: Giữ nguyên hình ảnh thân thể mà Phao-lô sử dụng; không diễn giải ngay trong câu thành “thân thể của Đấng Christ” hay “Hội Thánh”.
- source_word: οὐκ ἔστιν
  choice: không phải chỉ có
  rationale: Cách diễn đạt tiếng Việt tự nhiên cho cấu trúc đối lập giữa một chi thể và nhiều chi thể. Từ “chỉ” làm rõ ý một thành phần duy nhất mà không thay đổi luận điểm.
- source_word: ἓν μέλος
  choice: một chi thể
  rationale: “Chi thể” duy trì phép ẩn dụ về thân thể và phù hợp với thuật ngữ được lặp lại trong phân đoạn, dù “bộ phận” thông dụng hơn trong khẩu ngữ.
- source_word: ἀλλὰ πολλά
  choice: nhưng có nhiều chi thể
  rationale: πολλά được dùng như danh từ, với μέλη được hiểu ngầm. Tiếng Việt cần khôi phục “chi thể” để câu rõ nghĩa và tự nhiên.
theological_decisions:
- issue: Ý nghĩa ẩn dụ của “thân thể”
  choice: Giữ nguyên “thân thể” như trong câu Hy Lạp, không mở rộng thành “thân thể của Đấng Christ”.
  alternative: thân thể của Đấng Christ; Hội Thánh
  rationale: Dù văn cảnh nói về Hội Thánh như thân thể của Đấng Christ, câu này chỉ dùng “thân thể”. Giữ nguyên hình ảnh tránh đưa phần diễn giải theo văn cảnh vào chính bản dịch.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Chi thể” được chọn để giữ nhất quán phép ẩn dụ cơ thể trong toàn phân đoạn; cấu trúc “không phải chỉ có… nhưng có…” tự nhiên hơn trong tiếng Việt so với bản dịch từng chữ.
