id: 1CO.12.30
reference: 1 Corinthians 12:30
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: μὴ πάντες χαρίσματα ἔχουσιν ἰαμάτων; μὴ πάντες γλώσσαις λαλοῦσιν; μὴ πάντες διερμηνεύουσιν;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/030.yaml
  text: Not all have gifts of healings[a], do they? Not all speak in tongues, do they? Not all interpret[b], do they?
translation:
  language: vi
  text: Đâu phải tất cả đều có các ân tứ chữa lành[a]? Đâu phải tất cả đều nói tiếng lạ[b]? Đâu phải tất cả đều giải nghĩa?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hy Lạp dùng số nhiều cho cả “ân tứ” lẫn “chữa lành”: “các ân tứ về những sự chữa lành.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “nói bằng các thứ tiếng.” Trong ngữ cảnh này, từ ấy chỉ ân tứ thường được gọi là “nói tiếng lạ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ πάντες
  choice: Có phải tất cả đều ... đâu?
  rationale: Cấu trúc câu hỏi với μή chờ đợi câu trả lời phủ định. Cách diễn đạt này tự nhiên trong tiếng Việt và giữ được sự nhấn mạnh của Phao-lô rằng không phải ai cũng có mọi ân tứ.
- source_word: χαρίσματα
  choice: những ân tứ
  rationale: “Ân tứ” diễn đạt một sự ban cho bởi ân điển và đã rõ nghĩa trong ngữ cảnh các sự ban cho của Thánh Linh; từ chỉ số nhiều được giữ lại bằng “những”.
- source_word: ἰαμάτων
  choice: chữa lành
  rationale: Cụm “ân tứ chữa lành” tự nhiên hơn trong tiếng Việt; chú thích ghi nhận rằng danh từ Hy Lạp ở số nhiều, tránh che khuất đặc điểm nguyên bản.
- source_word: γλώσσαις λαλοῦσιν
  choice: nói tiếng lạ
  rationale: Trong ngữ cảnh 1 Cô-rinh-tô 12–14, đây là hiện tượng thuộc linh thường được gọi trong tiếng Việt là “nói tiếng lạ”. Chú thích giữ lại nghĩa từ vựng rộng hơn là nói bằng các thứ tiếng/ngôn ngữ.
- source_word: διερμηνεύουσιν
  choice: giải nghĩa
  rationale: Trong ngữ cảnh này, động từ nói đến việc làm cho lời nói tiếng lạ trở nên dễ hiểu. “Giải nghĩa” là cách nói tự nhiên, không buộc phải xác định đó là phiên dịch một ngôn ngữ thông thường.
theological_decisions:
- issue: Tính chất của các câu hỏi tu từ mở đầu bằng μή
  choice: Diễn đạt thành câu hỏi chờ đợi câu trả lời phủ định
  alternative: Diễn đạt như câu hỏi trung tính, không cho thấy câu trả lời được chờ đợi
  rationale: 'Cú pháp Hy Lạp cho thấy câu trả lời dự kiến là “không”. Bản dịch vì thế giữ trọng tâm thần học của đoạn văn: các ân tứ được phân bổ đa dạng trong một thân thể, chứ không phải mọi tín hữu đều có mọi ân tứ.'
- issue: Bổ ngữ ngầm hiểu của διερμηνεύουσιν
  choice: Giữ cách nói tuyệt đối “giải nghĩa”
  alternative: Bổ sung “giải nghĩa tiếng lạ”
  rationale: Bản Hy Lạp không nêu bổ ngữ ở đây, dù ngữ cảnh cho thấy việc giải nghĩa có liên hệ với tiếng lạ. Giữ lối nói không có bổ ngữ vừa trung thành với hình thức nguyên văn vừa không thu hẹp nghĩa hơn mức cần thiết.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc lặp “Có phải tất cả đều ... đâu?” giữ nhịp điệu của ba câu hỏi tu từ. “Ân tứ”, “chữa lành”, “nói tiếng lạ” và “giải nghĩa” phù hợp ngữ cảnh nhưng không đưa thêm lập trường hệ phái.
