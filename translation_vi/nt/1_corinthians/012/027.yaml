  text: Ὑμεῖς δέ ἐστε σῶμα Χριστοῦ καὶ μέλη ἐκ μέρους.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/027.yaml
  text: You are the body of Messiah[c][b][a], and members individually.
translation:
  language: vi
  text: Còn anh chị em là thân thể của Đấng Mê-si-a[a], và từng người là một chi thể.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “Đấng Christ.” Từ Hy Lạp Χριστός là một tước hiệu, có thể được chuyển dịch là “Đấng Mê-si-a” hoặc “Đấng Christ.”
    reason: alternative_reading
  - marker: b
    text: Theo sát chữ, cụm từ Hy Lạp là “các chi thể theo phần”; trong ngữ cảnh, ý nói mỗi người là một chi thể trong toàn thân.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑμεῖς
  choice: anh chị em
  rationale: Đại từ ngôi thứ hai số nhiều được nói rõ để nhấn mạnh những người nhận thư. “Anh chị em” là cách xưng hô tự nhiên, bao hàm cộng đồng tín hữu trong tiếng Việt hiện đại.
- source_word: δέ
  choice: còn
  rationale: δέ đánh dấu bước chuyển từ hình ảnh một thân thể sang việc áp dụng trực tiếp cho cộng đồng Cô-rinh-tô. “Còn” giữ được chức năng chuyển ý mà không làm câu mang sắc thái đối lập quá mạnh.
- source_word: σῶμα Χριστοῦ
  choice: thân thể của Đấng Mê-si
  rationale: “Thân thể” duy trì trực tiếp ẩn dụ cơ thể; kết cấu sở hữu diễn đạt việc cộng đồng được nhận diện là thân thể thuộc về Đấng Mê-si.
- source_word: Χριστοῦ
  choice: Đấng Mê-si
  rationale: Χριστός ở đây mang nội dung tước hiệu, nên “Đấng Mê-si” biểu đạt ý nghĩa ấy rõ hơn; cách gọi “Đấng Christ” được ghi nhận trong chú thích.
- source_word: μέλη
  choice: chi thể
  rationale: Trong ẩn dụ về thân thể, “chi thể” vừa chỉ bộ phận của cơ thể vừa diễn đạt vai trò của mỗi người trong toàn thể cộng đồng.
- source_word: ἐκ μέρους
  choice: từng người
  rationale: 'Trong ngữ cảnh một thân thể có nhiều chi thể, cụm này mang sắc thái phân phối: mỗi người, xét về phần mình, là một chi thể. “Từng người” tránh cách hiểu sai rằng họ chỉ là chi thể một cách không trọn vẹn.'
theological_decisions:
- issue: Cách chuyển dịch Χριστοῦ trong tuyên bố về Hội Thánh
  choice: Đấng Mê-si
  alternative: Đấng Christ
  rationale: Bản dịch chính giữ nội dung tước hiệu của Χριστός mà không thay đổi khẳng định của Phao-lô rằng cộng đồng tín hữu là thân thể của Ngài.
- issue: Ý nghĩa của ἐκ μέρους
  choice: 'nghĩa phân phối: từng người là một chi thể'
  alternative: theo phần mình; xét riêng từng phần
  rationale: 'Ngữ cảnh duy trì đồng thời hai mặt: cả cộng đồng là một thân thể, còn mỗi người có vị trí như một chi thể. Cách dịch không biến cụm từ thành ý nói về sự thiếu hụt hay chỉ có một phần.'
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Anh chị em” thể hiện số nhiều và bao hàm cộng đồng; “thân thể” và “chi thể” giữ nhất quán ẩn dụ cơ thể. Câu không thêm từ chỉ thời gian như “bây giờ”; “còn” chỉ đảm nhiệm chức năng chuyển ý của δέ.
