source:
  edition: SBLGNT
  text: ⸀νυνὶ δὲ ὁ θεὸς ἔθετο τὰ μέλη, ἓν ἕκαστον αὐτῶν, ἐν τῷ σώματι καθὼς ἠθέλησεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/018.yaml
  text: But as it is[a], God arranged the members, each one of them[b], in the body just as he desired.
translation:
  language: vi
  text: Nhưng thực tế, Đức Chúa Trời đã sắp đặt các bộ phận, từng bộ phận một, trong thân thể theo như Ngài muốn.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: Nhưng thực tế
  rationale: Cụm từ chuyển từ những giả định ở các câu trước trở lại tình trạng thực tế, đồng thời giữ sắc thái tương phản; cách diễn đạt này tự nhiên hơn việc hiểu νυνὶ chỉ theo nghĩa thời gian là “nhưng bây giờ”.
- source_word: ὁ θεὸς
  choice: Đức Chúa Trời
  rationale: Cách gọi thông dụng, trang trọng và rõ nghĩa trong tiếng Việt hiện đại.
- source_word: ἔθετο
  choice: đã sắp đặt
  rationale: Động từ τίθημι có thể mang nghĩa đặt, để hoặc bố trí. Trong ẩn dụ thân thể, “sắp đặt” diễn đạt việc chủ ý đặt mỗi bộ phận vào vị trí của nó mà không thêm ý tưởng ngoài văn cảnh.
- source_word: τὰ μέλη
  choice: các bộ phận
  rationale: Trong ngữ cảnh thân thể, μέλη chỉ những phần cấu thành thân thể. “Các bộ phận” rõ ràng và tự nhiên hơn “các chi thể” đối với độc giả phổ thông, còn “tay chân” thì quá hẹp.
- source_word: ἓν ἕκαστον αὐτῶν
  choice: từng bộ phận một
  rationale: 'Giữ được sức nhấn mạnh phân phối của cách nói Hy Lạp: không bộ phận nào bị bỏ ngoài sự sắp đặt của Đức Chúa Trời.'
- source_word: ἐν τῷ σώματι
  choice: trong thân thể
  rationale: Bản dịch trực tiếp, tự nhiên; trước hết tiếp tục hình ảnh thân thể trong đoạn văn, đồng thời để ngỏ sự áp dụng vào hội thánh.
- source_word: καθὼς ἠθέλησεν
  choice: theo như Ngài muốn
  rationale: Diễn đạt tự nhiên sức mạnh ý chí của ἠθέλησεν và sự tương ứng do καθὼς nêu lên, không dùng lối nói quá kỹ thuật như “theo ý chí Ngài”.
theological_decisions:
- issue: Chủ ý của Đức Chúa Trời trong việc đặt các bộ phận vào thân thể
  choice: Câu văn trình bày Đức Chúa Trời chủ ý sắp đặt từng bộ phận trong thân thể theo điều Ngài muốn.
  alternative: Hiểu động từ chỉ đơn thuần là đặt các bộ phận, không nhấn mạnh trật tự có chủ ý.
  rationale: Sự kết hợp giữa ἔθετο, cách nhấn mạnh “từng bộ phận một,” và καθὼς ἠθέλησεν cho thấy tính chủ ý trong hành động của Đức Chúa Trời; bản dịch giữ điều này nhưng không mở rộng thành một khẳng định giáo lý vượt quá câu.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “các bộ phận” thay cho thuật ngữ tôn giáo “các chi thể” để hình ảnh thân thể được nhận ra ngay; “Ngài” duy trì lối quy chiếu kính trọng đến Đức Chúa Trời. Không cần chú thích vì các khả năng từ vựng chính đã được diễn đạt tự nhiên mà không có khác biệt nghĩa đáng kể cần đưa vào bản văn.
