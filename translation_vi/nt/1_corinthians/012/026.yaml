id: 1CO.12.26
reference: 1 Corinthians 12:26
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ⸀εἴτε πάσχει ἓν μέλος, συμπάσχει πάντα τὰ μέλη· εἴτε δοξάζεται ⸀μέλος, συγχαίρει πάντα τὰ μέλη.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/026.yaml
  text: And if one member suffers[a], all the members suffer with it; if a member is honored, all the members rejoice with it.
translation:
  language: vi
  text: Nếu một bộ phận chịu đau đớn, tất cả các bộ phận cùng chịu đau đớn với nó; nếu một bộ phận được tôn trọng[a], tất cả các bộ phận cùng vui mừng với nó.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “được tôn vinh” hoặc “được làm cho vẻ vang.” Trong ngữ cảnh này, ý chính có lẽ là một bộ phận nhận được sự coi trọng, và cả thân thể cùng chia sẻ niềm vui.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴτε ... εἴτε
  choice: nếu ... nếu
  rationale: Cấu trúc tương liên nêu hai tình huống. Lặp lại “nếu” vừa tự nhiên trong tiếng Việt vừa giữ được thế song song của câu Hy Lạp.
- source_word: πάσχει
  choice: chịu đau đớn
  rationale: Diễn đạt nghĩa rộng của việc chịu khổ hoặc đau trong hình ảnh thân thể mà không giới hạn vào một loại đau cụ thể.
- source_word: ἓν μέλος / μέλος
  choice: một bộ phận
  rationale: “Bộ phận” giữ rõ hình ảnh một phần của thân thể và cũng có thể chỉ một thành phần trong toàn thể. Ở vế thứ hai, bản văn không có số từ ἕν, nhưng tiếng Việt vẫn dùng “một” tự nhiên theo nghĩa bất định.
- source_word: συμπάσχει
  choice: cùng chịu đau đớn với nó
  rationale: Giữ rõ tiền tố συν- mang ý nghĩa cùng chia sẻ sự đau đớn với bộ phận đang chịu đau.
- source_word: πάντα τὰ μέλη
  choice: tất cả các bộ phận
  rationale: Giữ nguyên sự lặp lại có chủ ý và hình ảnh toàn thân trong cả hai vế.
- source_word: δοξάζεται
  choice: được tôn trọng
  rationale: Trong ngữ cảnh các bộ phận của một thân thể quan tâm lẫn nhau, cụm này tự nhiên chỉ việc nhận được sự coi trọng hay danh dự; cách dịch không áp đặt nghĩa thần học chuyên biệt hơn.
- source_word: συγχαίρει
  choice: cùng vui mừng với nó
  rationale: Diễn đạt cả niềm vui và ý nghĩa cùng chia sẻ niềm vui với bộ phận được tôn trọng.
theological_decisions:
- issue: Ý nghĩa của δοξάζεται trong ẩn dụ về thân thể của hội thánh
  choice: được tôn trọng
  alternative: được tôn vinh; được làm cho vẻ vang
  rationale: Mạch văn nhấn mạnh sự quan tâm và liên đới giữa các bộ phận. “Được tôn trọng” phù hợp với danh dự trong quan hệ cộng đồng, còn chú thích bảo lưu sắc thái rộng hơn của động từ Hy Lạp.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. Dùng “bộ phận” thay vì thuật ngữ mang sắc thái giáo hội rõ hơn như “chi thể,” nhằm làm nổi bật hình ảnh thân thể đối với độc giả phổ thông. Giữ cấu trúc song song và sự lặp lại của nguyên văn.
