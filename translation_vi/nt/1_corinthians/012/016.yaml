id: 1CO.12.16
reference: 1 Corinthians 12:16
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἐὰν εἴπῃ τὸ οὖς· Ὅτι οὐκ εἰμὶ ὀφθαλμός, οὐκ εἰμὶ ἐκ τοῦ σώματος, οὐ παρὰ τοῦτο οὐκ ἔστιν ἐκ τοῦ σώματος·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/016.yaml
  text: And if the ear says[a], ‘Because I am not an eye, I am not of the body,’ it is not for this reason not of the body.
translation:
  language: vi
  text: 'Và nếu tai nói[a]: “Vì tôi không phải là mắt nên tôi không thuộc về thân thể,” thì đâu phải vì thế mà nó không thuộc về thân thể.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể diễn đạt tự nhiên hơn: “Vì tôi không phải là mắt nên tôi không phải là một phần của thân thể” ... “điều đó không khiến nó thôi là một phần của thân thể.” Tiếng Hy Lạp lặp lại cùng một cụm từ, theo sát nghĩa đen là “từ thân thể”, để tạo hiệu quả tu từ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Và
  rationale: Giữ liên từ nối ví dụ này với ví dụ về các bộ phận thân thể ở câu trước.
- source_word: ἐὰν εἴπῃ
  choice: nếu ... nói
  rationale: Diễn đạt tự nhiên điều kiện giả định khái quát do ἐὰν với động từ ở thể giả định tạo nên.
- source_word: τὸ οὖς
  choice: tai
  rationale: Giữ nguyên danh từ chỉ bộ phận cơ thể và phép nhân hóa trong hình ảnh của Phao-lô.
- source_word: Ὅτι
  choice: Vì
  rationale: 'Trong lời nói trực tiếp, từ này nêu lý do cho kết luận của tai: vì không phải là mắt nên cho rằng mình không thuộc về thân thể.'
- source_word: ὀφθαλμός
  choice: mắt
  rationale: Cách gọi giải phẫu thông dụng, tự nhiên trong cấu trúc vị ngữ tiếng Việt.
- source_word: ἐκ τοῦ σώματος
  choice: thuộc về thân thể
  rationale: Trong ngữ cảnh tư cách thành phần, ἐκ τοῦ σώματος chỉ sự thuộc về thân thể; cách dịch này tự nhiên trong tiếng Việt và được lặp lại để phản ánh phép lặp của nguyên văn.
- source_word: οὐ παρὰ τοῦτο
  choice: đâu phải vì thế mà
  rationale: Diễn đạt rõ sự bác bỏ kết luận dựa trên lý do vừa nêu, đồng thời giữ giọng lập luận mạnh của câu Hy Lạp.
- source_word: οὐκ ἔστιν ἐκ τοῦ σώματος
  choice: nó không thuộc về thân thể
  rationale: Giữ mệnh đề phủ định và phép lặp của ἐκ τοῦ σώματος; kết hợp với 'đâu phải' tạo câu tiếng Việt tự nhiên mà không làm mất logic phủ định của nguyên văn.
theological_decisions:
- issue: Mức độ làm trơn hình ảnh về sự thuộc về thân thể
  choice: Dịch lặp cả hai lần là 'thuộc về thân thể', giữ nguyên lập luận rằng lời tự nhận của một bộ phận không xóa bỏ sự thuộc về của nó.
  alternative: Dịch giải nghĩa là 'không phải là một phần của thân thể' và 'không vì thế mà kém phần thuộc về thân thể'.
  rationale: Nguyên văn dùng cùng một cụm ἐκ τοῦ σώματος hai lần. Giữ phép lặp bảo toàn hình thức tu từ và không thêm một kết luận giáo hội học vượt quá lời văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. Cụm 'thuộc về thân thể' cân bằng giữa tính tự nhiên của tiếng Việt và việc giữ phép lặp của nguyên văn; 'đâu phải vì thế mà' tránh một chuỗi phủ định gượng gạo nhưng vẫn bảo toàn sức bác bỏ.
