source:
  edition: SBLGNT
  text: οἴδατε ὅτι ὅτε ἔθνη ἦτε πρὸς τὰ εἴδωλα τὰ ἄφωνα ὡς ἂν ἤγεσθε ἀπαγόμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/002.yaml
  text: You know that when you were Gentiles[a], you were led away to the mute idols[b], however you were led.
translation:
  language: vi
  text: Anh chị em biết rằng khi còn là dân ngoại, anh chị em đã bị lôi kéo đến với những thần tượng câm[a], bị dẫn dắt theo đủ mọi cách.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “những thần tượng không có tiếng nói” hoặc “những thần tượng không thể nói được.”
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “anh chị em đã bị lôi kéo đến với những thần tượng câm, theo bất cứ cách nào người ta dẫn dắt anh chị em.” Nguyên văn nhấn mạnh rằng họ bị động chịu sự dẫn dắt và bị đưa đi dưới ảnh hưởng trước kia.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἴδατε
  choice: Anh chị em biết
  rationale: Dịch trực tiếp lời Phao-lô nhắc đến điều các tín hữu cùng biết; đại từ “anh chị em” diễn đạt tự nhiên ngôi thứ hai số nhiều trong tiếng Việt hiện đại.
- source_word: ἔθνη
  choice: dân ngoại
  rationale: Giữ sắc thái vừa dân tộc vừa tôn giáo của từ này trong cách dùng của Phao-lô, đồng thời tránh sắc thái miệt thị hoặc sự diễn giải quá mạnh của “dân ngoại đạo”.
- source_word: πρὸς τὰ εἴδωλα τὰ ἄφωνα
  choice: đến với những thần tượng câm
  rationale: “Đến với” giữ hướng chuyển động của πρός, còn “thần tượng câm” giữ cách diễn đạt cô đọng và sự tương phản với lời nói được Thánh Linh cảm thúc trong văn cảnh.
- source_word: ὡς ἂν ἤγεσθε
  choice: cứ bị dẫn dắt thế nào thì … thế ấy
  rationale: Diễn đạt sắc thái bất định về cách thức của ὡς ἂν và vẫn giữ thể bị động của ἤγεσθε.
- source_word: ἀπαγόμενοι
  choice: bị cuốn đi
  rationale: Giữ ý chuyển động thụ động và tăng cường của phân từ, đồng thời tạo câu tiếng Việt tự nhiên hơn việc lặp lại hoàn toàn động từ “dẫn”.
theological_decisions:
- issue: Ý nghĩa của ἔθνη khi nói về đời sống trước kia của tín hữu Cô-rinh-tô
  choice: dân ngoại
  alternative: người ngoại giáo; các dân
  rationale: “Dân ngoại” bảo tồn căn tính dân tộc–tôn giáo trong nguyên văn mà không tự thêm lời phán xét đạo đức mạnh hơn.
- issue: Sự tương phản giữa các thần tượng không thể nói và lời nói do Thánh Linh tác động trong văn cảnh
  choice: thần tượng câm
  alternative: thần tượng không thể nói được; thần tượng không có tiếng nói
  rationale: Cách dịch ngắn gọn này giữ nguyên sức tu từ của ἄφωνα mà không giải thích thêm điều câu Kinh Thánh không nói rõ.
- issue: Tính thụ động được nhấn mạnh bởi ἤγεσθε và ἀπαγόμενοι
  choice: bị dẫn đi… bị dẫn dắt… bị cuốn đi
  alternative: đi theo các thần tượng; thờ lạy các thần tượng
  rationale: Giữ sự lặp lại và sức căng của các hình thức bị động trong tiếng Hy Lạp, thay vì biến câu thành hành động chủ động hoặc thu hẹp chuyển động ẩn dụ thành việc thờ lạy.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cụm “anh chị em” thể hiện số nhiều và giọng mục vụ; “dân ngoại” là cách gọi quen thuộc trong ngôn ngữ Kinh Thánh tiếng Việt. Sự lặp lại các cấu trúc bị động được giữ có chủ ý để phản ánh nét nhấn mạnh của nguyên văn, dù câu vì thế mang nhịp điệu hơi khác khẩu ngữ thông thường.
