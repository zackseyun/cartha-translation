id: 1CO.12.28
reference: 1 Corinthians 12:28
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ οὓς μὲν ἔθετο ὁ θεὸς ἐν τῇ ἐκκλησίᾳ πρῶτον ἀποστόλους, δεύτερον προφήτας, τρίτον διδασκάλους, ἔπειτα δυνάμεις, ⸀ἔπειτα χαρίσματα ἰαμάτων, ἀντιλήμψεις, κυβερνήσεις, γένη γλωσσῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/028.yaml
  text: And God has appointed in the church first apostles[a], second prophets, third teachers, then miracles, then gifts of healings, helps, administrations[c][b], kinds of tongues.
translation:
  language: vi
  text: 'Và trong hội thánh, Đức Chúa Trời đã đặt: thứ nhất là các sứ đồ, thứ hai là các nhà tiên tri, thứ ba là những người dạy dỗ; kế đến là các phép lạ[a], rồi các ân tứ chữa lành, việc giúp đỡ, việc điều hành[b], và các loại tiếng lạ[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “những việc quyền năng”.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “việc hướng dẫn” hoặc “các hình thức lãnh đạo”.
    reason: lexical_alternative
  - marker: c
    text: Cũng có thể dịch là “các loại ngôn ngữ”. Từ Hy Lạp có thể chỉ “tiếng lạ” hoặc “ngôn ngữ”; chính văn giữ cách diễn đạt không khép lại sự mơ hồ trong ngữ cảnh này.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔθετο
  choice: đã đặt
  rationale: Giữ hình ảnh Đức Chúa Trời chủ động đặt hoặc chỉ định các vai trò và hoạt động trong hội thánh; cách diễn đạt này áp dụng tự nhiên cho cả người lẫn các ân tứ được liệt kê.
- source_word: ἐν τῇ ἐκκλησίᾳ
  choice: trong hội thánh
  rationale: ἐκκλησία ở đây chỉ cộng đồng dân Chúa, phù hợp với ngữ cảnh về thân thể và sự phân phát các vai trò, ân tứ.
- source_word: πρῶτον ... δεύτερον ... τρίτον
  choice: thứ nhất ... thứ hai ... thứ ba
  rationale: Phản ánh trực tiếp trình tự của nguyên văn mà không xác định đó là thứ bậc, niên đại hay mức độ quan trọng.
- source_word: ἀποστόλους
  choice: các sứ đồ
  rationale: Thuật ngữ quen thuộc và chính xác cho vai trò sứ đồ trong hội thánh, thay vì nghĩa chung là người được sai đi.
- source_word: προφήτας
  choice: các nhà tiên tri
  rationale: Cách gọi tự nhiên trong tiếng Việt đối với những người thực hiện chức năng nói tiên tri.
- source_word: διδασκάλους
  choice: các giáo sư
  rationale: Cách dịch Kinh Thánh quen thuộc cho những người dạy dỗ trong hội thánh; ở đây không mang nghĩa chức danh học thuật hiện đại.
- source_word: δυνάμεις
  choice: các phép lạ
  rationale: Trong danh sách ân tứ này, từ số nhiều chỉ những biểu hiện hoặc việc làm quyền năng. “Các phép lạ” truyền đạt ý nghĩa rõ ràng cho độc giả hiện đại; chú thích giữ lại cách dịch sát hơn.
- source_word: χαρίσματα ἰαμάτων
  choice: các ân tứ chữa lành
  rationale: Diễn đạt tự nhiên trong tiếng Việt, đồng thời giữ χαρίσματα ở số nhiều và ý niệm chữa lành của ἰαμάτων.
- source_word: ἀντιλήμψεις
  choice: việc giúp đỡ
  rationale: Chỉ các hoạt động hoặc khả năng trợ giúp, nâng đỡ; danh hóa bằng “việc” phù hợp với tiếng Việt và không biến nó thành một chức vụ cố định.
- source_word: κυβερνήσεις
  choice: việc điều hành
  rationale: Truyền đạt chức năng hướng dẫn, quản trị hoặc lèo lái cộng đồng mà không mặc nhiên xác lập một phẩm trật chức vụ.
- source_word: γένη γλωσσῶν
  choice: các loại tiếng lạ
  rationale: Giữ thuật ngữ quen thuộc trong mạch văn 1 Cô-rinh-tô 12–14 và không khẳng định dứt khoát hiện tượng này chỉ là các ngôn ngữ nhân loại; chú thích nêu phương án “các loại ngôn ngữ”.
theological_decisions:
- issue: Trình tự “thứ nhất, thứ hai, thứ ba, kế đến” biểu thị thứ bậc, thời gian hay tầm quan trọng
  choice: Giữ nguyên trình tự mà không thêm lời giải thích vào câu dịch.
  alternative: Diễn giải đây là phẩm trật thẩm quyền, trình tự xuất hiện theo thời gian, hoặc thứ tự về tầm quan trọng.
  rationale: Nguyên văn nêu một thứ tự rõ ràng nhưng không nói rõ tiêu chí của thứ tự ấy; câu dịch vì thế không nên giải quyết thay sự căng thẳng diễn giải này.
- issue: Ý nghĩa của γλῶσσαι trong ngữ cảnh
  choice: Dùng “tiếng lạ” trong chính văn.
  alternative: Các ngôn ngữ.
  rationale: “Tiếng lạ” giữ thuật ngữ quen thuộc về hiện tượng Phao-lô đang bàn đến mà không thu hẹp nó thành một cách hiểu duy nhất; phương án “ngôn ngữ” được ghi ở chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dấu hai chấm cùng các từ chỉ thứ tự làm rõ cấu trúc liệt kê dài. “Giáo sư” được dùng theo nghĩa Kinh Thánh truyền thống là người dạy dỗ, không phải học hàm hiện đại. Các danh ngữ “việc giúp đỡ, việc điều hành” tránh áp đặt rằng đây nhất thiết là những chức vụ chính thức.
