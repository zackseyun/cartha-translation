id: 1CO.12.6
reference: 1 Corinthians 12:6
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ διαιρέσεις ἐνεργημάτων εἰσίν, ⸂ὁ δὲ⸃ ⸀αὐτὸς θεός, ὁ ἐνεργῶν τὰ πάντα ἐν πᾶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/006.yaml
  text: And there are varieties of workings[b][a], but it is the same God who works all things in all people.
translation:
  language: vi
  text: Có nhiều cách hoạt động khác nhau, nhưng vẫn là cùng một Đức Chúa Trời, Đấng thực hiện mọi sự trong mọi người.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát hơn: “trong tất cả.” Tiếng Hy Lạp không nói rõ danh từ; văn cảnh cho thấy có lẽ chỉ mọi người, tức mọi thành viên mà trong họ Đức Chúa Trời thực hiện những hoạt động này.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διαιρέσεις
  choice: nhiều ... khác nhau
  rationale: Diễn đạt tự nhiên ý về nhiều dạng hay nhiều loại, phù hợp với cấu trúc song song trong các câu 4–6 mà không gợi sự chia rẽ.
- source_word: ἐνεργημάτων
  choice: cách hoạt động
  rationale: Chỉ những hoạt động hay sự vận hành được biểu hiện; cách dịch này dễ hiểu trong tiếng Việt và duy trì liên hệ ý nghĩa với ἐνεργῶν ở vế sau.
- source_word: ὁ δὲ αὐτὸς θεός
  choice: nhưng vẫn là cùng một Đức Chúa Trời
  rationale: '“Nhưng” thể hiện sắc thái tương phản nhẹ của δέ: hoạt động đa dạng nhưng nguồn hành động vẫn đồng nhất. “Vẫn là” bổ sung hệ từ cần thiết để câu tiếng Việt tự nhiên.'
- source_word: ὁ ἐνεργῶν
  choice: Đấng thực hiện
  rationale: Chuyển phân từ hiện tại thành mệnh đề quan hệ trang trọng và tự nhiên, đồng thời diễn tả Đức Chúa Trời là chủ thể tích cực khiến các hoạt động xảy ra.
- source_word: τὰ πάντα
  choice: mọi sự
  rationale: Giữ phạm vi rộng của cụm từ Hy Lạp, không tự ý thu hẹp thành riêng các ân tứ hay biểu hiện đang được bàn đến.
- source_word: ἐν πᾶσιν
  choice: trong mọi người
  rationale: Ngữ cảnh về các thành viên trong cộng đồng cho thấy danh từ được hiểu ngầm là người; chú thích giữ lại cách dịch sát chữ “trong tất cả” vì nguyên văn không nêu danh từ.
theological_decisions:
- issue: Phạm vi hành động của Đức Chúa Trời trong τὰ πάντα ἐν πᾶσιν
  choice: “thực hiện mọi sự trong mọi người”
  alternative: “thực hiện mọi sự trong tất cả” hoặc “thực hiện tất cả những điều ấy trong mọi người”
  rationale: Bản dịch giữ độ rộng của “mọi sự” nhưng theo ngữ cảnh hiểu “mọi” là những người trong cộng đồng. Không thu hẹp τὰ πάντα thành riêng các biểu hiện thuộc linh, cũng không biến câu thành một khẳng định giáo lý phổ quát tách khỏi văn cảnh.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ đọc. “Đức Chúa Trời” phù hợp lối gọi phổ biến trong bản dịch Kinh Thánh Tin Lành tiếng Việt; câu vẫn tránh thêm cách giải thích mang tính hệ phái. Dùng “Đấng” để mệnh đề quan hệ rõ và trang nghiêm.
