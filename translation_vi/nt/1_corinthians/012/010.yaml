language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸀ἄλλῳ ἐνεργήματα δυνάμεων, ⸁ἄλλῳ προφητεία, ⸀1ἄλλῳ διακρίσεις πνευμάτων, ⸀ἑτέρῳ γένη γλωσσῶν, ⸀2ἄλλῳ ἑρμηνεία γλωσσῶν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/010.yaml
  text: to another[a], workings of miracles; to another, prophecy; to another, discernments of spirits; to another, kinds of tongues; to another[b], interpretation of tongues.
translation:
  language: vi
  text: người khác được ban việc làm các phép lạ[a]; người khác, lời tiên tri; người khác, việc phân định các thần linh; người khác, các thứ tiếng[b]; người khác, việc giải nghĩa các thứ tiếng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “những hoạt động quyền năng” hoặc “những việc phi thường”.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “các loại ngôn ngữ” và “giải nghĩa các ngôn ngữ”. Từ Hy Lạp có thể chỉ “tiếng” hoặc “ngôn ngữ”; ở đây dùng “các thứ tiếng” để bảo lưu tính đa nghĩa trong phần Phao-lô bàn về các ân tứ thuộc linh.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐνεργήματα δυνάμεων
  choice: việc thực hiện các phép lạ
  rationale: Diễn đạt tự nhiên ý về những hoạt động hay hiệu quả của quyền năng; trong danh sách các ân tứ này, δυνάμεις thường chỉ các việc kỳ diệu. Chú thích vẫn bảo lưu cách dịch sát chữ hơn.
- source_word: προφητεία
  choice: lời tiên tri
  rationale: Cách nói tự nhiên trong tiếng Việt cho ân tứ phát ngôn mang tính tiên tri, không giới hạn nội dung vào việc báo trước tương lai.
- source_word: διακρίσεις πνευμάτων
  choice: việc phân định các thần
  rationale: “Phân định” diễn tả hành động nhận biết và phân biệt; “các thần” giữ nguyên sự không xác định của πνευμάτων, không tự ý quy về thần tốt, thần xấu, tâm linh con người hay nguồn đứng sau lời nói.
- source_word: γένη γλωσσῶν
  choice: các loại tiếng nói
  rationale: “Các loại” phản ánh γένη; “tiếng nói” có độ rộng cần thiết để không quyết định hiện tượng này chỉ là các ngôn ngữ nhân loại đã biết hay một dạng lời nói khác.
- source_word: ἑρμηνεία γλωσσῶν
  choice: việc giải nghĩa các tiếng nói ấy
  rationale: “Giải nghĩa” diễn tả việc làm cho nội dung trở nên hiểu được mà không buộc phải hiểu đây chỉ là dịch thuật giữa các ngôn ngữ.
- source_word: ἄλλῳ / ἑτέρῳ
  choice: người khác
  rationale: Hai từ đều đánh dấu sự phân phối các ân tứ cho những người khác nhau; dịch đồng nhất giúp câu tiếng Việt trôi chảy và không cường điệu khác biệt từ vựng nhỏ trong ngữ cảnh.
theological_decisions:
- issue: Ý nghĩa của δυνάμεων trong danh sách ân tứ
  choice: Dịch là “các phép lạ”.
  alternative: “những hoạt động quyền năng” hoặc “những việc phi thường”
  rationale: Trong ngữ cảnh các biểu hiện của Thánh Linh, từ này thường chỉ các việc kỳ diệu do quyền năng tạo nên. Chú thích nêu cách hiểu sát chữ để không che khuất sắc thái nguồn.
- issue: Ý nghĩa của γλωσσῶν
  choice: Dịch là “tiếng nói”.
  alternative: “ngôn ngữ” hoặc theo thuật ngữ truyền thống là “tiếng lạ”
  rationale: Từ Hy Lạp có thể chỉ lưỡi, tiếng nói hoặc ngôn ngữ. “Tiếng nói” cùng chú thích bảo lưu tranh luận về bản chất của ân tứ, thay vì xác định đó nhất thiết là ngôn ngữ nhân loại hay lời nói xuất thần.
- issue: Đối tượng của πνευμάτων
  choice: Giữ rộng là “các thần”.
  alternative: “các lời nói thuộc linh”, “các thần đứng sau lời nói”, “tâm linh con người” hoặc “các tà thần”
  rationale: Bản Hy Lạp không xác định chính xác đối tượng; cách dịch rộng tránh đưa một kết luận thần học vào bản văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc lược bỏ cụm “được ban” sau lần đầu để tránh lặp nặng nề nhưng vẫn giữ rõ sự phân phối các ân tứ từ ngữ cảnh. Tránh thuật ngữ “tiếng lạ” vì có thể khiến người đọc mặc nhiên chọn trước một cách hiểu về hiện tượng.
