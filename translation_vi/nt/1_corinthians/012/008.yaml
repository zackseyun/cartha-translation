language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ᾧ μὲν γὰρ διὰ τοῦ πνεύματος δίδοται λόγος σοφίας, ἄλλῳ δὲ λόγος γνώσεως κατὰ τὸ αὐτὸ πνεῦμα,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/008.yaml
  text: For to one is given through the Spirit a message of wisdom[a], and to another a message of knowledge according to the same Spirit[c][b],
translation:
  language: vi
  text: Vì người này được ban cho, nhờ Thánh Linh, một sứ điệp về sự khôn ngoan[a]; còn người khác được ban cho một sứ điệp về sự hiểu biết[b], theo cùng một Thánh Linh[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “một lời khôn ngoan” hoặc “một lời phát biểu về sự khôn ngoan.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “một lời tri thức” hoặc “một lời phát biểu về sự hiểu biết.”'
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “bởi cùng một Thánh Linh.” Tiếng Hy Lạp dùng một giới từ khác với giới từ trong cụm “nhờ Thánh Linh” ở vế trước; điều này có thể nhấn mạnh sự phù hợp với cùng một Thánh Linh, là nguồn chung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾧ μὲν ... ἄλλῳ δὲ
  choice: người này ... còn người khác
  rationale: Diễn đạt tự nhiên cấu trúc phân phối và đối chiếu trong tiếng Hy Lạp, đồng thời cho thấy các ân ban được trao cho những người khác nhau.
- source_word: διὰ τοῦ πνεύματος
  choice: qua Thánh Linh
  rationale: διά với sở hữu cách diễn tả phương tiện hoặc tác nhân; “qua” giữ được sắc thái trung gian và phân biệt với κατά ở vế sau.
- source_word: δίδοται
  choice: được ban cho
  rationale: Giữ thể bị động của động từ hiện tại, nhấn mạnh rằng điều này được ban chứ không do người nhận tự tạo ra.
- source_word: λόγος σοφίας
  choice: lời truyền đạt sự khôn ngoan
  rationale: λόγος ở đây có thể chỉ lời nói, sự phát biểu hoặc nội dung được truyền đạt; cách dịch này tự nhiên và không giới hạn vào một từ đơn lẻ.
- source_word: λόγος γνώσεως
  choice: lời truyền đạt sự hiểu biết
  rationale: Dịch song song với λόγος σοφίας; “sự hiểu biết” diễn đạt γνώσεως bằng tiếng Việt hiện đại, dễ hiểu.
- source_word: κατὰ τὸ αὐτὸ πνεῦμα
  choice: theo cùng một Thánh Linh
  rationale: Giữ nét nghĩa phù hợp hoặc quy chiếu theo của κατά và bảo tồn sự khác biệt giới từ so với διά ở vế đầu.
theological_decisions:
- issue: Đối tượng được πνεῦμα chỉ đến
  choice: Thánh Linh
  alternative: tinh thần của con người
  rationale: Ngữ cảnh 1 Cô-rinh-tô 12 nói về cùng một Thánh Linh phân phát các ân ban; viết “Thánh Linh” làm rõ đối tượng theo ngữ cảnh mà không thêm nội dung ngoài câu.
- issue: Ý nghĩa của λόγος trong các cụm λόγος σοφίας và λόγος γνώσεως
  choice: lời truyền đạt
  alternative: lời; lời phát biểu; sứ điệp
  rationale: Nguyên ngữ không xác định chính xác hình thức của lời nói này. “Lời truyền đạt” giữ được độ rộng nghĩa, còn các cách hiểu quen thuộc được ghi ở chú thích.
- issue: Quan hệ được κατά diễn tả
  choice: theo cùng một Thánh Linh
  alternative: bởi cùng một Thánh Linh
  rationale: Cách dịch đã chọn bảo tồn khả năng κατά nhấn mạnh sự phù hợp hoặc quy chiếu theo Thánh Linh, thay vì đồng nhất hoàn toàn với διά ở vế trước.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Giữ cấu trúc song song của hai vế, dùng “Thánh Linh” theo cách gọi phổ biến trong tiếng Việt Cơ Đốc, đồng thời bảo tồn sự khác biệt giữa hai giới từ Hy Lạp.
