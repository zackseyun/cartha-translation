    issue: Cụm «lời truyền đạt sự khôn ngoan/sự hiểu biết» thiếu tự nhiên và mơ hồ về quan hệ ngữ nghĩa.
    rationale: Trong tiếng Việt hiện đại, «truyền đạt» thường là động từ hoặc danh từ chỉ hành vi; ghép trực tiếp với «sự khôn ngoan» khiến câu nặng và có thể chuyển trọng tâm từ λόγος (lời nói/sứ điệp) sang việc truyền đạt. Cách sửa vẫn để ngỏ các sắc thái «lời», «sứ điệp», hay «lời phát biểu» của λόγος.
