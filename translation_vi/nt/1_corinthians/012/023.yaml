revisions:
- from: Còn những bộ phận của thân thể mà chúng ta cho là kém đáng trọng hơn, thì chúng ta lại dành cho chúng sự tôn trọng nhiều hơn; và những bộ phận không tiện phô bày[a] của chúng ta lại có vẻ đoan trang hơn[b].
  to: Và những bộ phận của thân thể mà chúng ta cho là kém đáng trọng hơn, thì chúng ta lại dành cho chúng sự tôn trọng lớn hơn; và những bộ phận không tiện phô bày[a] của chúng ta lại có vẻ ngoài tươm tất hơn[b].
