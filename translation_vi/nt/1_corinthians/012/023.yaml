  text: καὶ ἃ δοκοῦμεν ἀτιμότερα εἶναι τοῦ σώματος, τούτοις τιμὴν περισσοτέραν περιτίθεμεν, καὶ τὰ ἀσχήμονα ἡμῶν εὐσχημοσύνην περισσοτέραν ἔχει,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/023.yaml
  text: and those parts of the body that we think to be less honorable[a], on these we bestow greater honor, and our unpresentable parts have greater decorum[b],
translation:
  language: vi
  text: Và những bộ phận của thân thể mà chúng ta cho là kém đáng trọng hơn, thì chúng ta lại dành cho chúng sự tôn trọng lớn hơn; và những bộ phận không tiện phô bày[a] của chúng ta lại có vẻ ngoài tươm tất hơn[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “khó coi” hoặc “không chỉnh tề.” Từ Hy Lạp chỉ điều bị xem là không thích hợp hoặc không tiện để phô bày.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “có sự chỉnh tề hơn” hoặc “có vẻ ngoài thích hợp hơn.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἃ δοκοῦμεν
  choice: mà chúng ta cho là
  rationale: Diễn đạt sự đánh giá chủ quan của con người, không khẳng định rằng các bộ phận ấy thật sự có giá trị thấp hơn.
- source_word: ἀτιμότερα
  choice: kém đáng trọng hơn
  rationale: Giữ nghĩa so sánh và sự đối ứng trực tiếp với τιμή, đồng thời tránh sắc thái quá nặng của cách nói “đáng hổ thẹn hơn”.
- source_word: τοῦ σώματος
  choice: của thân thể
  rationale: Giữ nguyên hình ảnh cụ thể về thân thể, vốn là nền tảng cho phép so sánh của Phao-lô trong phân đoạn này.
- source_word: τιμὴν περισσοτέραν περιτίθεμεν
  choice: chúng ta lại dành cho chúng sự tôn trọng nhiều hơn
  rationale: Chuyển thành lối nói tự nhiên trong tiếng Việt nhưng vẫn giữ hành động chủ động trao sự tôn trọng lớn hơn cho các bộ phận ấy.
- source_word: τὰ ἀσχήμονα ἡμῶν
  choice: những bộ phận không tiện phô bày của chúng ta
  rationale: Thể hiện điều không thích hợp để bày ra trước công chúng mà không gán cho các bộ phận ấy ý nghĩa vô đạo đức.
- source_word: εὐσχημοσύνην περισσοτέραν ἔχει
  choice: lại có vẻ đoan trang hơn
  rationale: Diễn đạt tự nhiên ý về sự chỉnh tề, thích hợp và đáng trình diện hơn, đồng thời giữ dạng phát biểu “có” của nguyên văn thay vì giải thích rõ hành động che phủ.
theological_decisions:
- issue: Hình ảnh các bộ phận thân thể và sự tôn trọng trong cộng đồng
  choice: Giữ ngôn ngữ cụ thể về các bộ phận thân thể và cách con người đối xử với chúng.
  alternative: Diễn giải trực tiếp thành những thành viên bị xem là yếu thế trong hội thánh.
  rationale: Lập luận thần học của Phao-lô phát triển từ thân thể thật sang cộng đồng. Bản dịch không nên thay hình ảnh bằng phần áp dụng trước khi chính văn thực hiện bước chuyển ấy.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “thân thể” để giữ hình ảnh xuyên suốt phân đoạn; cặp “kém đáng trọng hơn / sự tôn trọng nhiều hơn” giữ rõ thế đối chiếu về danh dự, còn “không tiện phô bày / đoan trang hơn” truyền đạt sự tương phản về cách trình diện mà không thô tục hóa câu văn.
