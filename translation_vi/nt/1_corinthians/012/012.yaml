  rationale: Chỉ chuẩn hóa cách phiên âm danh hiệu Messiah từ “Mê-si” thành “Mê-si-a” và chỉnh nhịp câu cho tự nhiên. Bản dịch vẫn giữ nguyên sự mơ hồ/cô đọng có chủ ý của câu Hy Lạp.
