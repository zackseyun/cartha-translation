id: 1CO.12.12
reference: 1 Corinthians 12:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καθάπερ γὰρ τὸ σῶμα ἕν ἐστιν καὶ μέλη ⸂πολλὰ ἔχει⸃, πάντα δὲ τὰ μέλη τοῦ ⸀σώματος πολλὰ ὄντα ἕν ἐστιν σῶμα, οὕτως καὶ ὁ Χριστός·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/012.yaml
  text: For just as the body is one and has many members[a], and all the members of the body, though they are many, are one body[b], so also is Messiah.
translation:
  language: vi
  text: Vì cũng như thân thể là một và có nhiều chi thể[a], còn mọi chi thể của thân thể, tuy nhiều, vẫn là một thân thể; Đấng Mê-si-a cũng vậy.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Chi thể” ở đây chỉ các bộ phận của thân thể; trong văn cảnh tiếp theo, cùng từ này cũng được dùng cho những người hợp thành một thân thể.
    reason: lexical_clarification
  - marker: b
    text: 'Nguyên văn nói cô đọng: “Đấng Mê-si-a cũng vậy.” Các câu tiếp theo triển khai hình ảnh nhiều chi thể hợp thành một thân thể.'
    reason: theological_tension
lexical_decisions:
- source_word: Καθάπερ γὰρ
  choice: Vì cũng như
  rationale: “Cũng như” diễn đạt phép so sánh của καθάπερ, còn “vì” giữ chức năng giải thích và liên kết lập luận của γάρ.
- source_word: τὸ σῶμα
  choice: thân thể
  rationale: Cách gọi tự nhiên và trang trọng cho thân thể con người, đồng thời duy trì hình ảnh trung tâm trong lập luận của Phao-lô.
- source_word: ἕν
  choice: một
  rationale: Giữ nguyên ý nghĩa số lượng và sự hiệp nhất mà câu nhấn mạnh.
- source_word: μέλη
  choice: chi thể
  rationale: “Chi thể” vừa chỉ các bộ phận của thân thể vừa có thể được dùng cho những người thuộc về một cộng đồng, phù hợp với sự chuyển tiếp của ẩn dụ trong văn cảnh.
- source_word: πολλὰ ὄντα
  choice: tuy nhiều
  rationale: 'Diễn đạt tự nhiên sắc thái nhượng bộ của phân từ: dù các chi thể có số lượng nhiều, chúng vẫn hợp thành một thân thể.'
- source_word: ἕν ἐστιν σῶμα
  choice: vẫn là một thân thể
  rationale: “Vẫn” làm rõ quan hệ nhượng bộ trong tiếng Việt mà không thêm nội dung giải nghĩa ngoài câu Hy Lạp.
- source_word: οὕτως καὶ ὁ Χριστός
  choice: thì Đấng Mê-si cũng vậy
  rationale: Giữ cấu trúc so sánh cô đọng và sắc thái danh hiệu của Χριστός, không tự ý mở rộng thành “thân thể của Đấng Mê-si” hay “Hội Thánh”.
theological_decisions:
- issue: Cách dịch ὁ Χριστός
  choice: Đấng Mê-si
  alternative: Đấng Christ; Chúa Cứu Thế
  rationale: Χριστός ở đây mang hình thức danh hiệu có mạo từ. “Đấng Mê-si” bảo toàn ý nghĩa “Đấng được xức dầu” và tránh biến danh hiệu thành một tên riêng đơn thuần.
- issue: Ý nghĩa của câu cô đọng “οὕτως καὶ ὁ Χριστός”
  choice: Giữ nguyên cách nói “Đấng Mê-si cũng vậy”
  alternative: thân thể của Đấng Mê-si cũng vậy; Hội Thánh cũng vậy
  rationale: Nguyên văn cố ý dùng cách diễn đạt cô đọng, và các câu sau mới triển khai mối liên hệ giữa nhiều chi thể, một thân thể và Đấng Mê-si. Việc thêm “thân thể của” hoặc thay bằng “Hội Thánh” sẽ giải nghĩa ngay trong bản văn điều tác giả chưa nói rõ tại đây.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Câu giữ nhịp lập luận so sánh của nguyên văn; “chi thể” được chọn để bảo toàn sự nối kết giữa hình ảnh thân thể và cộng đồng, còn “Đấng Mê-si cũng vậy” giữ nguyên sức nén thần học của câu.
