reference: 1 Corinthians 12:11
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: πάντα δὲ ταῦτα ἐνεργεῖ τὸ ἓν καὶ τὸ αὐτὸ πνεῦμα, διαιροῦν ἰδίᾳ ἑκάστῳ καθὼς βούλεται.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/011.yaml
  text: But one and the same Spirit works all these things[d][c][b][a], distributing to each one individually just as he wills.
translation:
  language: vi
  text: Nhưng tất cả những điều này đều do cùng một Đức Thánh Linh thực hiện,[a][b] phân phát cách riêng cho mỗi người theo ý Ngài.[c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “tạo nên” hoặc “làm ra” tất cả những điều này.
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “một và cùng một Thánh Linh”, nhấn mạnh rằng các ân tứ đa dạng đều đến từ một nguồn duy nhất.'
    reason: cross_reference
  - marker: c
    text: Cũng có thể dịch là “phân bổ” hoặc “ban phát” cho mỗi người.
    reason: lexical_alternative
  - marker: d
    text: Cũng có thể dịch là “theo như Ngài muốn” hoặc “theo như Ngài lựa chọn”. Động từ Hy Lạp có thể chỉ việc muốn, lựa chọn hoặc mong muốn.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα δὲ ταῦτα
  choice: Nhưng ... tất cả những điều này
  rationale: Giữ sắc thái chuyển ý nhẹ của δέ và sự nhấn mạnh toàn thể của πάντα ... ταῦτα, quy chiếu về các biểu hiện ân tứ vừa được kể.
- source_word: ἐνεργεῖ
  choice: thực hiện
  rationale: Diễn đạt hoạt động có hiệu lực và tính tác thành của động từ mà không xác định quá mức cơ chế; chú thích bảo lưu các khả năng 'tạo nên' và 'làm ra'.
- source_word: τὸ ἓν καὶ τὸ αὐτὸ πνεῦμα
  choice: chính một Đức Thánh Linh ấy
  rationale: Cách nói tự nhiên trong tiếng Việt, đồng thời nhấn mạnh rằng mọi ân tứ đa dạng đều đến từ cùng một Đức Thánh Linh.
- source_word: διαιροῦν
  choice: phân chia
  rationale: Bảo lưu hình ảnh phân bổ theo phần của nguyên ngữ; trong ngữ cảnh, cụm 'cho từng người' làm rõ đây là sự ban phát chứ không phải chia rẽ.
- source_word: ἰδίᾳ ἑκάστῳ
  choice: cho từng người
  rationale: Truyền đạt đầy đủ ý phân phối riêng biệt đến mỗi cá nhân mà không cần thêm trạng từ nặng nề.
- source_word: καθὼς βούλεται
  choice: tùy theo ý Ngài
  rationale: Diễn đạt tự nhiên ý muốn, lựa chọn hay chủ định của Đức Thánh Linh, đồng thời giữ rõ tác nhân có ý chí.
theological_decisions:
- issue: Đối tượng quy chiếu và tư cách tác nhân của πνεῦμα / βούλεται
  choice: Dùng 'Đức Thánh Linh' và đại từ kính trọng 'Ngài', trình bày Thánh Linh như tác nhân có ý chí.
  alternative: 'Dịch phi nhân xưng hoặc tránh đại từ: ''tùy theo ý muốn''.'
  rationale: Dù πνεῦμα có giống trung trong ngữ pháp Hy Lạp, βούλεται trực tiếp gán ý chí cho Thánh Linh. 'Ngài' thể hiện tác nhân cá vị trong văn cảnh mà không dựa vào giống ngữ pháp.
- issue: Mức độ chủ quyền được hàm ý trong καθὼς βούλεται
  choice: Dịch 'tùy theo ý Ngài'.
  alternative: Dịch 'theo như Ngài muốn' hoặc 'theo như Ngài lựa chọn'.
  rationale: Bản dịch giữ sự tự do chủ ý của Thánh Linh nhưng không thêm thuật ngữ thần học như 'toàn quyền' vốn không có trực tiếp trong câu.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại và dễ hiểu. 'Chính một ... ấy' tái hiện nét nhấn mạnh của nguyên ngữ; 'Đức Thánh Linh' và 'Ngài' phù hợp cách dùng tiếng Việt Cơ Đốc phổ thông. Các dấu chú thích được đặt ngay sau cụm từ liên quan.
