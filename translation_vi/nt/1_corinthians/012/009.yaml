  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸀ἑτέρῳ πίστις ἐν τῷ αὐτῷ πνεύματι, ⸀ἄλλῳ χαρίσματα ἰαμάτων ἐν τῷ ⸀ἑνὶ πνεύματι,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/009.yaml
  text: to another[a], faith by the same Spirit; to another, gifts of healings by the one Spirit[b],
translation:
  language: vi
  text: người khác được ban cho đức tin[a] nhờ cùng một Thánh Linh; người khác nữa được ban cho các ân tứ về những sự chữa lành[b] nhờ một Thánh Linh duy nhất,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “lòng trung tín” hoặc “sự tin cậy”.
    reason: lexical_alternative
  - marker: b
    text: Tiếng Hy Lạp dùng số nhiều cho cả “ân tứ” lẫn “sự chữa lành”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑτέρῳ
  choice: người khác được
  rationale: Dạng tặng cách tiếp nối cấu trúc phân phát từ câu trước. Cách diễn đạt này tự nhiên trong tiếng Việt và không nhấn quá mức sự khác biệt giữa ἕτερος với ἄλλος.
- source_word: πίστις
  choice: đức tin
  rationale: Đây là cách dịch quen thuộc và phù hợp nhất với cách dùng của Phao-lô. Trong ngữ cảnh các ân tứ, từ này chỉ đức tin được Thánh Linh ban cho, nhưng bản dịch không áp đặt một hệ thống thần học riêng về bản chất của ân tứ ấy.
- source_word: ἐν τῷ αὐτῷ πνεύματι
  choice: bởi cùng một Thánh Linh
  rationale: Dịch ἐν theo nghĩa phương tiện hoặc tác nhân, phù hợp với công thức phân phát ân tứ trong văn cảnh; “cùng một” giữ nguyên αὐτῷ.
- source_word: ἄλλῳ
  choice: người khác nữa được
  rationale: Tiếp tục ý phân phát cho từng người. “Nữa” giúp câu tiếng Việt trôi chảy mà không tạo ra sự phân biệt quá mức với ἑτέρῳ.
- source_word: χαρίσματα
  choice: các ân tứ
  rationale: “Ân tứ” diễn đạt những món quà được ban bởi ân điển và là thuật ngữ tự nhiên trong văn cảnh 1 Cô-rinh-tô 12; “các” giữ số nhiều.
- source_word: ἰαμάτων
  choice: về những sự chữa lành
  rationale: Giữ số nhiều của danh từ Hy Lạp, dù cách nói này kém gọn hơn “chữa lành”; cấu trúc cũng cho thấy đây là các ân tứ liên quan đến những sự chữa lành.
- source_word: ἐν τῷ ἑνὶ πνεύματι
  choice: bởi một Thánh Linh ấy
  rationale: “Bởi” thể hiện vai trò tác nhân; “một ... ấy” vừa giữ ἑνί vừa quy chiếu về chính Thánh Linh đã được nhắc đến, qua đó bảo toàn trọng tâm về sự hiệp nhất.
theological_decisions:
- issue: Sắc thái của πίστις trong ngữ cảnh các ân tứ
  choice: đức tin
  alternative: lòng trung tín; sự tin cậy
  rationale: “Đức tin” là cách dịch mặc định phù hợp nhất, nhưng chú thích bảo lưu các nghĩa từ vựng có thể có. Không thêm định nghĩa mang tính hệ phái về một loại “đức tin đặc biệt”.
- issue: Đối tượng được πνεύματι chỉ đến
  choice: Thánh Linh
  alternative: linh
  rationale: Toàn bộ văn cảnh 1 Cô-rinh-tô 12 xác định đây là Thánh Linh ban phát các ân tứ; viết hoa và dùng “Thánh Linh” làm rõ đối tượng mà không thêm nội dung ngoài văn cảnh.
- issue: Số nhiều trong χαρίσματα ἰαμάτων
  choice: các ân tứ về những sự chữa lành
  alternative: ân tứ chữa lành
  rationale: Giữ số nhiều ở cả hai danh từ để bảo toàn nét đáng chú ý của nguyên văn, thay vì quy chúng thành một ân tứ chữa lành đơn nhất.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu giữ dạng nối tiếp vì đây là một phần của danh sách bắt đầu ở câu trước. Dùng “Thánh Linh” theo cách gọi phổ thông trong tiếng Việt; giữ sự biến đổi có chủ ý giữa “cùng một” và “một ... ấy” trong hai vế.
