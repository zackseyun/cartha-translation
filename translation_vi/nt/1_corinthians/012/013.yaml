revisions:
- from: Vì thật vậy, trong cùng một Thánh Linh[a], tất cả chúng ta đều đã chịu phép báp-têm để trở nên một thân thể—dù là người Do Thái hay người Hy Lạp, dù là nô lệ hay người tự do—và tất cả chúng ta đều được ban cho cùng một Thánh Linh để uống[b].
  to: Vì thật vậy, trong một Thánh Linh[a], tất cả chúng ta đều đã chịu phép báp-têm vào trong một thân thể—dù là người Do Thái hay người Hy Lạp, dù là nô lệ hay người tự do—và tất cả chúng ta đều được cho uống một Thánh Linh[b][c].
  rationale: Sửa “để trở nên” thành “vào trong” để chuyển đạt εἰς sát hơn mà không áp đặt cách giải thích về tiến trình hay mục đích. Đổi “cùng một” thành “một” để giữ mức nhấn mạnh của ἕν. Thêm chú thích [c] ở lần xuất hiện thứ hai của πνεῦμα nhằm bảo lưu mơ hồ diễn giải vốn có của nguyên văn và hồ sơ kiểm tra tiếng Anh. Các sửa đổi không thay đổi ý nghĩa câu.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T18:16:13Z'
review_pass:
  verdict: revise
  source_fidelity: Bản dịch phản ánh đúng các đối lập Do Thái/Hy Lạp và nô lệ/tự do, thể bị động của hai động từ, và hình ảnh uống. Tuy nhiên, “để trở nên một thân thể” làm yếu hướng nhập vào của εἰς (“vào trong”), và “cùng một” thêm sắc thái “cùng/same” rõ hơn mức cần thiết của ἕν (“một”).
  naturalness: Văn phong nhìn chung hiện đại, trang trọng và tự nhiên. “Được cho uống một Thánh Linh” là cách diễn đạt hơi lạ nhưng cần thiết để giữ hình ảnh và thể bị động của nguyên văn; chú thích cung cấp một cách diễn đạt trôi chảy hơn.
  terminology: “Thánh Linh,” “chịu phép báp-têm,” “người Do Thái,” “người Hy Lạp,” “nô lệ,” và “người tự do” phù hợp với văn cảnh và cách dùng tiếng Việt Kinh Thánh hiện đại. Cần thêm chú thích cho khả năng viết thường của πνεῦμα ở vế sau, theo tính mơ hồ được lưu trong hồ sơ tiếng Anh.
  issues:
  - severity: medium
    issue: “để trở nên một thân thể” cho εἰς ἓν σῶμα
    rationale: Cụm này có thể bị hiểu là mục đích hoặc biến đổi bản thể. εἰς biểu thị sự đi vào/được nhập vào một thân thể; “vào trong một thân thể” giữ hướng của giới từ sát hơn.
  - severity: low
    issue: “cùng một Thánh Linh” cho ἕν πνεῦμα
    rationale: “Cùng một” tự nhiên, nhưng thêm rõ nét ý “same/cùng” thay vì chỉ “một.” “Một Thánh Linh” phản ánh trực tiếp hơn sự nhấn mạnh của ἕν và vẫn rõ ý hiệp nhất.
  - severity: medium
    issue: Thiếu chú thích về cách hiểu/viết thường của πνεῦμα ở vế sau
    rationale: Nguyên văn không phân biệt chữ hoa/chữ thường; hồ sơ đối chiếu tiếng Anh bảo lưu khả năng hiểu là “một tinh thần.” Chú thích cần được neo tại từ “Thánh Linh” ở vế sau.
