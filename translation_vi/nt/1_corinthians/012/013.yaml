reference: 1 Corinthians 12:13
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ γὰρ ἐν ἑνὶ πνεύματι ἡμεῖς πάντες εἰς ἓν σῶμα ἐβαπτίσθημεν, εἴτε Ἰουδαῖοι εἴτε Ἕλληνες, εἴτε δοῦλοι εἴτε ἐλεύθεροι, καὶ ⸀πάντες ἓν πνεῦμα ἐποτίσθημεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/013.yaml
  text: For indeed[a], in one Spirit we all were baptized into one body—whether Jews or Greeks[c][b], whether servants or free—and we all were given to drink one Spirit.
translation:
  language: vi
  text: Vì thật vậy, trong một Thánh Linh[a], tất cả chúng ta đều đã chịu phép báp-têm vào trong một thân thể—dù là người Do Thái hay người Hy Lạp, dù là nô lệ hay người tự do—và tất cả chúng ta đều được cho uống một Thánh Linh[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “bởi một Thánh Linh” hoặc “nhờ một Thánh Linh”; giới từ Hy Lạp có thể chỉ phạm vi, phương tiện hoặc tác nhân.'
    reason: alternative_reading
  - marker: b
    text: 'Cũng có thể dịch: “tất cả chúng ta đều được ban một Thánh Linh để uống.”'
    reason: lexical_alternative
  - marker: c
    text: Cũng có thể hiểu là “một tinh thần”; tuy nhiên, văn mạch mạnh mẽ hướng đến Thánh Linh.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν ἑνὶ πνεύματι
  choice: trong cùng một Thánh Linh
  rationale: Giữ sắc thái phạm vi của ἐν và ý nhấn mạnh về sự hiệp nhất; cách hiểu phương tiện hoặc tác nhân được ghi ở chú thích vì tiếng Hy Lạp cho phép cả hai.
- source_word: ἐβαπτίσθημεν
  choice: đã chịu phép báp-têm
  rationale: Đây là cách diễn đạt quen thuộc, trang trọng trong ngữ cảnh Hội Thánh, đồng thời giữ thể bị động mà không áp đặt một phương thức thực hiện.
- source_word: εἰς ἓν σῶμα
  choice: để trở nên một thân thể
  rationale: Diễn đạt tự nhiên trong tiếng Việt ý hướng đến hoặc kết quả là được kết hợp thành một thân thể.
- source_word: Ἰουδαῖοι ... Ἕλληνες
  choice: người Do Thái ... người Hy Lạp
  rationale: Giữ nguyên cặp đối chiếu sắc tộc-tôn giáo cụ thể của bản Hy Lạp.
- source_word: δοῦλοι ... ἐλεύθεροι
  choice: nô lệ ... người tự do
  rationale: Cặp từ nói rõ địa vị xã hội-pháp lý đối lập; “nô lệ” chính xác hơn “đầy tớ” trong ngữ cảnh này.
- source_word: ἓν πνεῦμα
  choice: cùng một Thánh Linh
  rationale: Văn cảnh chỉ mạnh đến Thánh Linh là Đấng hiệp nhất mọi người; “cùng một” chuyển đạt tự nhiên giá trị nhấn mạnh của ἓν trong tiếng Việt.
- source_word: ἐποτίσθημεν
  choice: được ban cho ... để uống
  rationale: Giữ thể bị động và hình ảnh cùng dự phần qua việc uống; chú thích nêu cách diễn đạt sát cấu trúc khác.
- source_word: καὶ γὰρ
  choice: Vì thật vậy
  rationale: Giữ cả chức năng giải thích của γάρ lẫn sắc thái nhấn mạnh của καί.
- source_word: ἡμεῖς πάντες ... πάντες
  choice: tất cả chúng ta ... tất cả chúng ta
  rationale: Tái hiện sự nhấn mạnh hai lần vào tính bao quát của cộng đồng.
theological_decisions:
- issue: ἐν ἑνὶ πνεύματι chỉ phạm vi hay phương tiện/tác nhân
  choice: trong cùng một Thánh Linh
  alternative: bởi cùng một Thánh Linh; nhờ cùng một Thánh Linh
  rationale: “Trong” bám gần hình thức Hy Lạp và không loại bỏ vai trò tác động của Thánh Linh; các nghĩa phương tiện/tác nhân được bảo lưu trong chú thích.
- issue: πνεῦμα có chỉ Thánh Linh hay một thực tại tinh thần chung
  choice: Thánh Linh
  alternative: thần linh; một tinh thần
  rationale: Sự song song giữa hai vế và toàn bộ văn cảnh 1 Cô-rinh-tô 12 mạnh mẽ ủng hộ quy chiếu đến Thánh Linh, dù bản Hy Lạp không có quy ước viết hoa để tự nó quyết định điều này.
- issue: Cách hiểu hình ảnh ἐποτίσθημεν
  choice: được ban cho cùng một Thánh Linh để uống
  alternative: được cho uống cùng một Thánh Linh
  rationale: Cách chọn giữ hình ảnh uống và thể bị động nhưng tránh giải thích thêm về nghi lễ hay kinh nghiệm riêng biệt mà câu không nêu rõ.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “phép báp-têm” theo lối diễn đạt Kinh Thánh phổ biến; giữ “nô lệ” để phản ánh đúng địa vị bị lệ thuộc. Các dấu chú thích [a], [b] đều được đặt ngay tại nội dung liên quan.
