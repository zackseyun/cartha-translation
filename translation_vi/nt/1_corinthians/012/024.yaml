source:
  edition: SBLGNT
  text: τὰ δὲ εὐσχήμονα ἡμῶν οὐ χρείαν ⸀ἔχει. ἀλλὰ ὁ θεὸς συνεκέρασεν τὸ σῶμα, τῷ ⸀ὑστεροῦντι περισσοτέραν δοὺς τιμήν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/024.yaml
  text: but our presentable parts have no need. Instead[a], God has composed the body, giving greater honor to the part that lacked it,
translation:
  language: vi
  text: còn những phần trang nhã của chúng ta thì không cần điều đó. Nhưng Đức Chúa Trời đã phối hợp thân thể, ban sự tôn trọng lớn hơn cho phần còn thiếu sự tôn trọng,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đã hòa trộn thân thể thành một.” Động từ Hy Lạp có thể nhấn mạnh việc hòa trộn hoặc kết hợp các phần thành một toàn thể thống nhất.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐσχήμονα
  choice: những phần trang nhã
  rationale: Trong hình ảnh thân thể và thế đối lập với các phần được xem là kém trang nhã ở câu trước, cách dịch này diễn đạt sự đoan trang, thích hợp để phô bày; danh từ “phần” được bổ sung theo ngữ cảnh cho tính từ trung tính số nhiều.
- source_word: χρείαν ἔχει
  choice: không cần như vậy
  rationale: Giữ nghĩa trực tiếp của thành ngữ “có nhu cầu/cần”; “như vậy” liên kết tự nhiên với việc che phủ và dành sự tôn trọng đặc biệt trong câu trước mà không diễn giải quá mức.
- source_word: συνεκέρασεν
  choice: đã kết hợp ... lại
  rationale: Động từ chỉ việc hòa trộn hoặc kết hợp các thành phần thành một toàn thể thống nhất. Cách dịch này giữ trọng tâm vào hành động chủ ý của Đức Chúa Trời mà không làm hình ảnh trở nên máy móc.
- source_word: σῶμα
  choice: thân thể
  rationale: Giữ nguyên hình ảnh trung tâm của Phao-lô; trong mạch văn, hình ảnh này vừa nói về thân thể tự nhiên vừa phục vụ phép loại suy về cộng đồng tín hữu.
- source_word: τῷ ὑστεροῦντι
  choice: cho phần còn thiếu sự tôn trọng
  rationale: Phân từ mang nghĩa thiếu hoặc ở tình trạng thua kém. Cụm “sự tôn trọng” được nêu rõ từ danh từ τιμήν theo sau, tránh hàm ý rằng bản thân phần ấy kém giá trị.
- source_word: περισσοτέραν τιμήν
  choice: sự tôn trọng lớn hơn
  rationale: Diễn đạt rõ lực so sánh của περισσοτέραν và nghĩa vinh dự, sự coi trọng của τιμήν bằng tiếng Việt hiện đại.
- source_word: δοὺς
  choice: ban
  rationale: 'Phân từ aorist có thể diễn tả phương cách hoặc hành động đi kèm: Đức Chúa Trời kết hợp thân thể bằng việc ban sự tôn trọng lớn hơn.'
theological_decisions:
- issue: Ý nghĩa hành động của Đức Chúa Trời khi kết hợp thân thể
  choice: Giữ hình ảnh Đức Chúa Trời chủ ý kết hợp các phần thành một thân thể và ban sự tôn trọng lớn hơn cho phần thiếu sự tôn trọng.
  alternative: Hiểu động từ chỉ đơn thuần là sự pha trộn về mặt thể chất, hoặc giới hạn câu này hoàn toàn vào giải phẫu tự nhiên.
  rationale: Mạch văn triển khai phép loại suy giữa thân thể và cộng đồng tín hữu. Bản dịch giữ cả hình ảnh thân thể lẫn dụng ý thần học mà không xác định độc nhất một tầng quy chiếu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Trang nhã” duy trì sự liên kết với ý niệm đoan trang ở câu trước; “sự tôn trọng” tránh sắc thái quá trừu tượng hoặc mang tính phẩm hàm của “vinh dự”. Dấu phẩy đặt ký hiệu chú thích ngay sau mệnh đề liên quan.
