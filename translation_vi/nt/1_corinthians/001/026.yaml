revisions:
- from: 'Vì thưa anh chị em[a], hãy xét xem anh chị em đã được kêu gọi thế nào: trong anh chị em, không có nhiều người khôn ngoan theo tiêu chuẩn loài người, không có nhiều người quyền thế, cũng không có nhiều người xuất thân quyền quý.'
  to: 'Vì, anh chị em[a], hãy xem xét sự kêu gọi của anh chị em: không có nhiều người khôn ngoan theo tiêu chuẩn loài người, không có nhiều người quyền thế, cũng không có nhiều người xuất thân quyền quý.'
  rationale: Sửa “đã được kêu gọi thế nào” thành “sự kêu gọi của anh chị em” để phản ánh trực tiếp τὴν κλῆσιν ὑμῶν và duy trì thuật ngữ nhất quán trong lập luận của Phao-lô. Điều chỉnh dấu câu và vị trí chú thích để câu mở đầu tự nhiên hơn, không thay đổi ý nghĩa.
