id: 1CO.1.26
reference: 1 Corinthians 1:26
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Βλέπετε γὰρ τὴν κλῆσιν ὑμῶν, ἀδελφοί, ὅτι οὐ πολλοὶ σοφοὶ κατὰ σάρκα, οὐ πολλοὶ δυνατοί, οὐ πολλοὶ εὐγενεῖς·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/026.yaml
  text: 'For consider your calling, brothers: not many of you were wise by human standards, not many were powerful, not many were of noble birth.'
translation:
  language: vi
  text: 'Vì, anh chị em[a], hãy xem xét sự kêu gọi của anh chị em: không có nhiều người khôn ngoan theo tiêu chuẩn loài người, không có nhiều người quyền thế, cũng không có nhiều người xuất thân quyền quý.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn là “anh em”, một cách xưng hô ở dạng giống đực nhưng tại đây chỉ toàn thể hội chúng, gồm cả phụ nữ lẫn nam giới.
    reason: cultural_note
lexical_decisions:
- source_word: Βλέπετε
  choice: hãy xét xem
  rationale: Dạng này có thể được hiểu là mệnh lệnh hoặc chỉ định; trong ngữ cảnh, Phao-lô kêu gọi độc giả suy ngẫm về chính hoàn cảnh của họ. “Hãy xét xem” giữ được sức nặng tu từ và tự nhiên trong tiếng Việt.
- source_word: κλῆσιν ὑμῶν
  choice: anh chị em đã được kêu gọi thế nào
  rationale: Danh từ κλῆσις chỉ sự kêu gọi của Đức Chúa Trời, không phải nghề nghiệp. Cách diễn đạt bằng mệnh đề bị động tự nhiên trong tiếng Việt và liên kết rõ với thực trạng của hội chúng được nêu tiếp theo.
- source_word: ἀδελφοί
  choice: anh chị em
  rationale: Từ Hy Lạp ở dạng giống đực số nhiều nhưng trong văn cảnh được dùng để gọi toàn thể hội chúng, gồm cả nam lẫn nữ. “Anh chị em” truyền đạt trực tiếp phạm vi bao hàm ấy trong tiếng Việt hiện đại.
- source_word: οὐ πολλοὶ σοφοὶ κατὰ σάρκα
  choice: không có nhiều người khôn ngoan theo tiêu chuẩn loài người
  rationale: κατὰ σάρκα ở đây nói đến sự đánh giá theo bình diện con người, chứ không chỉ thịt thể theo nghĩa đen hay một bản tính tội lỗi. Cách dịch này rõ nghĩa mà không giải thích quá mức.
- source_word: δυνατοί
  choice: người quyền thế
  rationale: Trong chuỗi mô tả địa vị xã hội, từ này chỉ những người có quyền lực hoặc ảnh hưởng. “Quyền thế” phù hợp văn cảnh hơn nghĩa sức mạnh thể chất.
- source_word: εὐγενεῖς
  choice: người xuất thân quyền quý
  rationale: Từ này nhấn mạnh dòng dõi và địa vị cao do sinh ra; “xuất thân quyền quý” diễn đạt chính xác và tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Phạm vi của κλῆσις
  choice: Hiểu là sự kêu gọi của Đức Chúa Trời đối với tín hữu
  alternative: Hiểu là nghề nghiệp hoặc địa vị xã hội của họ
  rationale: Cách dùng của Phao-lô và lập luận trong 1 Cô-rinh-tô 1:18–31 cho thấy đây là hành động Đức Chúa Trời kêu gọi dân Ngài; câu sau mô tả địa vị của họ khi được gọi.
- issue: Ý nghĩa của κατὰ σάρκα
  choice: theo tiêu chuẩn loài người
  alternative: theo xác thịt
  rationale: Trong cấu trúc này, cụm từ bổ nghĩa cho sự khôn ngoan theo cách đánh giá của con người. Dịch sát hình thức là “theo xác thịt” có thể khiến độc giả Việt hiểu lầm thành hành vi tội lỗi hoặc thân thể vật chất.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “thưa anh chị em” để thể hiện lời gọi trực tiếp; giữ ba vế “không có nhiều…” nhằm bảo toàn nhịp điệu và sự nhấn mạnh của nguyên văn.
