review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng ba nhóm địa vị xã hội trong nguyên văn và diễn giải κατὰ σάρκα là tiêu chuẩn/đánh giá của loài người một cách thích đáng. Tuy nhiên, τὴν κλῆσιν ὑμῶν là “sự kêu gọi của anh chị em,” không phải trực tiếp là “anh chị em đã được kêu gọi thế nào.” Mệnh đề “thế nào” có thể chuyển trọng tâm sang cách thức hoặc hoàn cảnh được gọi, trong khi nguyên văn nêu chính sự kêu gọi ấy.
  naturalness: Cấu trúc “Vì thưa anh chị em” thiếu dấu ngắt và hơi gượng trong văn xuôi hiện đại. “Anh chị em, hãy xem xét...” tự nhiên, trang trọng và vẫn giữ lời xưng hô trực tiếp. Việc lặp “không có nhiều người” bảo toàn nhịp điệu nhấn mạnh của tiếng Hy Lạp.
  terminology: “Theo tiêu chuẩn loài người,” “quyền thế,” và “xuất thân quyền quý” phù hợp ngữ cảnh. “Sự kêu gọi của anh chị em” giữ thuật ngữ Phao-lô cho κλῆσις mà không áp đặt một cách hiểu giáo phái cụ thể.
  issues:
  - severity: medium
    issue: κλῆσιν ὑμῶν được dịch thành “anh chị em đã được kêu gọi thế nào.”
    rationale: Nguyên văn yêu cầu độc giả xem xét “sự kêu gọi” của họ. Cách dịch bằng mệnh đề nghi vấn gián tiếp thêm sắc thái về cách thức/hoàn cảnh được gọi và làm mờ danh từ thần học κλῆσις.
  - severity: low
    issue: Cú pháp mở đầu “Vì thưa anh chị em” chưa tự nhiên.
    rationale: Cần có ngắt câu sau từ nối hoặc dùng lời mở đầu trôi chảy hơn trong tiếng Việt hiện đại.
