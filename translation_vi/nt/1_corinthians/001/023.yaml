id: 1CO.1.23
reference: 1 Corinthians 1:23
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἡμεῖς δὲ κηρύσσομεν Χριστὸν ἐσταυρωμένον, Ἰουδαίοις μὲν σκάνδαλον ⸀ἔθνεσιν δὲ μωρίαν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/023.yaml
  text: but we preach the Messiah crucified[a], to Jews a stumbling block and to Gentiles foolishness[b],
translation:
  language: vi
  text: còn chúng tôi rao giảng Đấng Mê-si-a chịu đóng đinh[a]—đối với người Do Thái là chướng ngại khiến họ vấp ngã, còn đối với các dân ngoại là điều ngu dại[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “Đấng Christ chịu đóng đinh.”
    reason: alternative_reading
  - marker: b
    text: Nguyên văn Hy Lạp là “các dân”; ở đây có lẽ chỉ các dân ngoại, đối lập với người Do Thái.
    reason: lexical_alternative
lexical_decisions:
- source_word: κηρύσσομεν
  choice: rao giảng
  rationale: Diễn đạt tự nhiên hành động công khai công bố sứ điệp, đồng thời giữ sắc thái truyền giảng của động từ Hy Lạp.
- source_word: Χριστὸν
  choice: Đấng Mê-si-a
  rationale: Trong ngữ cảnh này, từ này nhấn mạnh tước hiệu và căn tính của Đấng được rao giảng hơn là được dùng như một tên riêng.
- source_word: ἐσταυρωμένον
  choice: chịu đóng đinh
  rationale: Chuyển thể phân từ hoàn thành bị động theo cách tự nhiên trong tiếng Việt, giữ rõ việc Đấng Mê-si-a đã bị đóng đinh và căn tính ấy vẫn là trọng tâm lời rao giảng.
- source_word: Ἰουδαίοις
  choice: đối với người Do Thái
  rationale: Phù hợp với thế đối lập dân tộc-tôn giáo giữa người Do Thái và các dân ngoại trong câu.
- source_word: σκάνδαλον
  choice: chướng ngại khiến họ vấp ngã
  rationale: Giữ hình ảnh một vật cản gây vấp ngã, thay vì làm phẳng nghĩa thành chỉ sự xúc phạm.
- source_word: ἔθνεσιν
  choice: các dân ngoại
  rationale: Nghĩa gốc có thể là “các dân”, nhưng trong thế đối lập với người Do Thái, cụm này chỉ những người không thuộc dân Do Thái.
- source_word: μωρίαν
  choice: điều ngu dại
  rationale: Giữ liên kết từ vựng với chủ đề về sự ngu dại trong lập luận chung của chương, đồng thời diễn đạt tự nhiên bằng tiếng Việt.
theological_decisions:
- issue: Dịch Χριστός như tước hiệu hay dạng gần với tên riêng
  choice: Đấng Mê-si-a
  alternative: Đấng Christ
  rationale: Ngữ cảnh tập trung vào nội dung lời công bố và nghịch lý rằng chính Đấng được xức dầu lại chịu đóng đinh; vì vậy cách dịch theo tước hiệu làm rõ ý nghĩa mà không giải quyết thay độc giả sự căng thẳng thần học.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “còn” để thể hiện δέ nối với mạch văn trước; dấu gạch ngang giúp câu tiếng Việt tự nhiên mà vẫn bảo toàn quan hệ giữa nội dung được rao giảng và hai cách đánh giá đối lập.
