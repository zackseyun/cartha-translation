source:
  edition: SBLGNT
  text: λέγω δὲ τοῦτο ὅτι ἕκαστος ὑμῶν λέγει· Ἐγὼ μέν εἰμι Παύλου, Ἐγὼ δὲ Ἀπολλῶ, Ἐγὼ δὲ Κηφᾶ, Ἐγὼ δὲ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/012.yaml
  text: 'What I mean is this: each of you says[a], “I belong to Paul,” or “I belong to Apollos,” or “I belong to Cephas,” or “I belong to Messiah.”'
translation:
  language: vi
  text: 'Ý tôi muốn nói là thế này: mỗi người trong anh chị em đều nói: “Tôi thuộc về Phao-lô,” hoặc “Tôi thuộc về A-pô-lô,” hoặc “Tôi thuộc về Kê-pha,” hoặc “Tôi thuộc về Đấng Mê-si[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “Đấng Ki-tô.”'
    reason: Cách dịch truyền thống khác của tước hiệu Χριστός.
lexical_decisions:
- source_word: λέγω δὲ τοῦτο
  choice: Ý tôi muốn nói là thế này
  rationale: Diễn đạt tự nhiên trong tiếng Việt hiện đại, đồng thời giữ chức năng giải thích và làm rõ của mệnh đề Hy Lạp.
- source_word: ἕκαστος ὑμῶν λέγει
  choice: mỗi người trong anh chị em đều nói
  rationale: “Mỗi người” giữ sắc thái phân phối của ἕκαστος; “đều” làm câu tiếng Việt tự nhiên và nhấn mạnh tình trạng phổ biến trong cộng đồng.
- source_word: Ἐγὼ … εἰμι Παύλου / Ἀπολλῶ / Κηφᾶ / Χριστοῦ
  choice: Tôi thuộc về Phao-lô / A-pô-lô / Kê-pha / Đấng Mê-si
  rationale: “Thuộc về” truyền đạt quan hệ quy thuộc hoặc đứng về một phe được biểu thị bằng εἰμί với sở hữu cách, mà không diễn giải quá mức thành quan hệ môn đồ chính thức.
- source_word: Κηφᾶ
  choice: Kê-pha
  rationale: Phiên âm đúng tên Κηφᾶς mà Phao-lô dùng tại đây, thay vì đổi thành Phê-rơ.
- source_word: Χριστοῦ
  choice: Đấng Mê-si
  rationale: Χριστός là tước hiệu; “Đấng Mê-si” chuyển tải ý nghĩa tước hiệu trong cách dùng tiếng Việt quen thuộc, thay vì chỉ coi đây như một tên riêng.
theological_decisions:
- issue: Cách dịch Χριστοῦ trong khẩu hiệu phe nhóm
  choice: Đấng Mê-si
  alternative: Đấng Ki-tô
  rationale: Giữ Χριστός như một tước hiệu và không làm mất nền nghĩa “Đấng được xức dầu”; cách gọi truyền thống “Đấng Ki-tô” được ghi ở chú thích.
- issue: Bản chất lời nói “Tôi thuộc về…”
  choice: Giữ nguyên cả bốn lời tuyên bố như các khẩu hiệu được Phao-lô thuật lại
  alternative: Giải thích lời “Tôi thuộc về Đấng Mê-si” là đúng hoặc là một phe phái riêng
  rationale: Câu Hy Lạp liệt kê bốn lời tuyên bố nhưng chưa tự giải quyết động cơ hay giá trị thần học của lời cuối; bản dịch không áp đặt cách giải thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” cho đại từ số nhiều ὑμῶν trong ngữ cảnh cộng đồng; phiên âm tên riêng theo hình thức quen dùng trong tiếng Việt. Dấu hai chấm và các câu trích dẫn riêng làm rõ cấu trúc liệt kê của nguyên văn.
