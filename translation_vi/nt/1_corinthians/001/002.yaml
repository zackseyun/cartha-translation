- from: 'Gửi hội thánh của Đức Chúa Trời tại Cô-rinh-tô, tức là những người đã được thánh hóa trong Đấng Christ Jesus, được kêu gọi làm dân thánh[a], cùng với tất cả những ai ở khắp mọi nơi kêu cầu danh Chúa chúng ta là Jesus Christ—Chúa của họ và của chúng ta[b]:'
  to: 'Gửi hội thánh của Đức Chúa Trời tại Cô-rinh-tô, tức là những người đã được thánh hóa trong Đấng Mê-si-a Giê-su, được kêu gọi làm dân thánh[a], cùng với tất cả những ai ở mọi nơi kêu cầu danh Chúa chúng ta là Giê-su, Đấng Mê-si-a—của họ và của chúng ta[b]:'
  rationale: Bản sửa phục hồi độ mơ hồ của cụm αὐτῶν καὶ ἡμῶν bằng cách đặt “của họ và của chúng ta” ở cuối câu, sau “ở mọi nơi”, thay vì biến nó thành một vị ngữ rõ ràng về Chúa. Đồng thời, dịch nhất quán Χριστός là “Đấng Mê-si-a”, giữ thứ tự và lực tước hiệu của hai danh xưng Hy Lạp, và chuẩn hóa “Giê-su”. Chú thích b tiếp tục nêu hai cách hiểu mà không áp đặt một cách hiểu trong thân văn bản.
  reviewer_model: gpt-5.6-terra
