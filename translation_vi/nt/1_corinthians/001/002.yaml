id: 1CO.1.2
reference: 1 Corinthians 1:2
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τῇ ἐκκλησίᾳ τοῦ θεοῦ, ⸂ἡγιασμένοις ἐν Χριστῷ Ἰησοῦ, τῇ οὔσῃ ἐν Κορίνθῳ,⸃ κλητοῖς ἁγίοις, σὺν πᾶσιν τοῖς ἐπικαλουμένοις τὸ ὄνομα τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ ἐν παντὶ τόπῳ ⸀αὐτῶν καὶ ἡμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/002.yaml
  text: 'To the church of God that is in Corinth[a], to those sanctified in Messiah Jesus, called to be saints, together with all those who call on the name of our Lord Jesus the Messiah in every place[d][c][b], theirs and ours:'
translation:
  language: vi
  text: 'Gửi hội thánh của Đức Chúa Trời tại Cô-rinh-tô, tức là những người đã được thánh hóa trong Đấng Mê-si-a Giê-su, được kêu gọi làm dân thánh[a], cùng với tất cả những ai ở mọi nơi kêu cầu danh Chúa chúng ta là Giê-su, Đấng Mê-si-a—của họ và của chúng ta[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “được gọi là những người thánh”; theo cách gọi truyền thống: “được gọi làm thánh đồ.”'
    reason: lexical_alternative
  - marker: b
    text: Cụm “ở mọi nơi—của họ và của chúng ta” rất cô đọng trong nguyên văn. Nó có thể nói đến mọi nơi thuộc về họ và chúng ta; cũng có thể được hiểu là nhấn mạnh rằng Chúa là Chúa của cả họ lẫn chúng ta.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκκλησίᾳ
  choice: hội thánh
  rationale: “Hội thánh” là cách diễn đạt quen thuộc, trang trọng và tự nhiên trong tiếng Việt cho cộng đồng thuộc về Đức Chúa Trời; ở đây từ này chỉ con người chứ không phải một tòa nhà.
- source_word: ἡγιασμένοις
  choice: những người đã được thánh hóa
  rationale: Cấu trúc bị động cùng thể hoàn thành trong tiếng Hy Lạp diễn tả hành động đã xảy ra và còn kết quả; “đã được thánh hóa” giữ được cả sắc thái bị động lẫn ý nghĩa thần học.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: trong Đấng Christ Jesus
  rationale: “Trong” giữ nguyên công thức liên kết đặc trưng của Phao-lô; “Đấng Christ” thể hiện Χριστός như tước hiệu của Đấng được xức dầu mà vẫn phù hợp với văn phong Kinh Thánh tiếng Việt.
- source_word: κλητοῖς ἁγίοις
  choice: được kêu gọi làm dân thánh
  rationale: Cách dịch này tự nhiên trong tiếng Việt, giữ mối liên hệ giữa sự kêu gọi và địa vị thánh, đồng thời tránh khiến độc giả hiểu “thánh đồ” là một cấp bậc đặc biệt chỉ dành cho một số tín hữu.
- source_word: ἐπικαλουμένοις τὸ ὄνομα
  choice: kêu cầu danh
  rationale: “Kêu cầu danh” là thành ngữ Kinh Thánh tự nhiên, bao hàm việc cầu xin, thờ phượng và tuyên xưng, sát hơn cách nói đơn thuần “gọi tên”.
- source_word: κυρίου
  choice: Chúa
  rationale: “Chúa” là từ tương đương tự nhiên và đã được xác lập trong tiếng Việt cho κύριος trong lời tuyên xưng về Jesus.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesus Christ
  rationale: Giữ trật tự tên rồi đến tước hiệu như tiếng Hy Lạp; “Christ” được viết hoa để biểu thị tước hiệu gắn với Jesus.
- source_word: ἐν παντὶ τόπῳ αὐτῶν καὶ ἡμῶν
  choice: ở khắp mọi nơi… của họ và của chúng ta
  rationale: Giữ cách diễn đạt cô đọng và độ mơ hồ thật sự của các sở hữu cách trong nguyên văn; dấu gạch ngang giúp câu tiếng Việt dễ theo dõi mà không quyết định dứt khoát “của họ và của chúng ta” bổ nghĩa cho điều gì.
theological_decisions:
- issue: Cách dịch Χριστός
  choice: Đấng Christ / Christ
  alternative: Đấng Mê-si-a
  rationale: Trong tiếng Việt Kinh Thánh hiện đại, “Đấng Christ” vẫn là tước hiệu quen thuộc, không nhất thiết là họ riêng. Ở lần xuất hiện sau, “Jesus Christ” thuận hơn trong cụm danh xưng đầy đủ; cả hai đều chỉ cùng tước hiệu Χριστός, không tạo ra khác biệt thần học.
- issue: Ý nghĩa của κλητοῖς ἁγίοις
  choice: được kêu gọi làm dân thánh
  alternative: được gọi là thánh đồ
  rationale: Nguyên văn đặt hai tính từ cạnh nhau và có thể hiểu là “những người được gọi, là những người thánh.” Bản dịch chọn câu tiếng Việt tự nhiên nhưng không hàm ý rằng họ tự đạt đến sự thánh thiện; sự kêu gọi và thánh hóa đều được trình bày như điều họ nhận lãnh.
- issue: Quan hệ cú pháp của αὐτῶν καὶ ἡμῶν
  choice: giữ cách nói “của họ và của chúng ta” cùng chú thích về độ mơ hồ
  alternative: diễn giải là mọi nơi thuộc về cả họ lẫn chúng ta, hoặc Chúa của cả họ lẫn chúng ta
  rationale: Cụm sở hữu cách ở cuối câu có thể gắn với “nơi” theo cấu trúc gần nhất, nhưng độc giả cũng có thể nghe nó liên hệ với “Chúa.” Không nên âm thầm loại bỏ sự căng cú pháp này.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, dùng câu gửi thư tự nhiên. “Tức là” làm rõ rằng những người được thánh hóa chính là hội thánh tại Cô-rinh-tô. Giữ các thuật ngữ quen thuộc “hội thánh,” “thánh hóa,” “kêu cầu danh” nhưng dùng “dân thánh” để người đọc phổ thông không hiểu sai “thánh đồ” theo nghĩa một tầng lớp đặc biệt.
