id: 1CO.1.18
reference: 1 Corinthians 1:18
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ὁ λόγος γὰρ ὁ τοῦ σταυροῦ τοῖς μὲν ἀπολλυμένοις μωρία ἐστίν, τοῖς δὲ σῳζομένοις ἡμῖν δύναμις θεοῦ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/018.yaml
  text: For the message of the cross is foolishness to those who are perishing[b][a], but to us who are being saved it is the power of God.
translation:
  language: vi
  text: Vì sứ điệp về thập tự giá[a] là điều ngu dại đối với những người đang hư mất, nhưng đối với chúng ta là những người đang được cứu, thì đó là quyền năng của Đức Chúa Trời.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “lời về thập tự giá.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λόγος
  choice: sứ điệp
  rationale: Trong ngữ cảnh này, λόγος chỉ nội dung được công bố về thập tự giá; “sứ điệp” tự nhiên và rõ nghĩa trong tiếng Việt hơn “lời”, trong khi chú thích vẫn bảo lưu cách dịch sát chữ.
- source_word: σταυροῦ
  choice: thập tự giá
  rationale: Giữ hình ảnh cô đọng của nguyên văn và cách diễn đạt quen thuộc trong tiếng Việt, thay vì diễn giải thành “sự đóng đinh”.
- source_word: ἀπολλυμένοις
  choice: những người đang hư mất
  rationale: Phân từ hiện tại được thể hiện bằng “đang”, bảo lưu sắc thái tiến triển hoặc tình trạng đang diễn ra; “hư mất” cũng giữ được chiều kích mạnh hơn “lạc mất”.
- source_word: μωρία
  choice: điều ngu dại
  rationale: Cách nói tự nhiên trong tiếng Việt, diễn đạt sự đánh giá rằng sứ điệp ấy là ngu dại, đồng thời làm nổi bật thế tương phản với quyền năng của Đức Chúa Trời.
- source_word: σῳζομένοις
  choice: những người đang được cứu
  rationale: Dạng phân từ hiện tại bị động được giữ rõ bằng “đang được cứu”, không thu hẹp sự cứu rỗi thành một biến cố chỉ thuộc quá khứ.
- source_word: δύναμις θεοῦ
  choice: quyền năng của Đức Chúa Trời
  rationale: Cách dịch sát cấu trúc Hy Lạp, trang trọng và tự nhiên trong văn phong Kinh Thánh tiếng Việt.
theological_decisions:
- issue: Thể hiện phương diện của sự cứu rỗi trong σῳζομένοις
  choice: chúng ta là những người đang được cứu
  alternative: chúng ta là những người được cứu
  rationale: “Đang được cứu” phản ánh phân từ hiện tại và bảo lưu cách Phao-lô trình bày sự cứu rỗi như một thực tại đang diễn ra, không giải quyết thay cho nguyên văn mối căng thẳng thần học giữa các phương diện của sự cứu rỗi.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “sứ điệp” để truyền đạt nội dung được công bố; giữ các cụm “đang hư mất” và “đang được cứu” nhằm phản ánh sát phương diện đang diễn ra của hai phân từ Hy Lạp.
