  text: γέγραπται γάρ· Ἀπολῶ τὴν σοφίαν τῶν σοφῶν, καὶ τὴν σύνεσιν τῶν συνετῶν ἀθετήσω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/019.yaml
  text: 'For it is written: “I will destroy the wisdom of the wise[a], and I will set aside the understanding of the intelligent.”'
translation:
  language: vi
  text: 'Vì có lời chép rằng: “Ta sẽ hủy diệt sự khôn ngoan của những người khôn ngoan, và sẽ bác bỏ sự thông hiểu của những người thông sáng.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch vế sau: “Ta sẽ gạt bỏ sự thông hiểu của những người sáng suốt” hoặc “Ta sẽ làm cho vô hiệu sự thông hiểu của những người thông sáng.”'
    reason: Nêu các sắc thái có thể có của ἀθετήσω (“bác bỏ”, “gạt bỏ”, “làm cho vô hiệu”) và συνετῶν (“thông sáng”, “sáng suốt”) mà không quyết định quá mức một sắc thái.
lexical_decisions:
- source_word: γέγραπται
  choice: có lời chép rằng
  rationale: 'Cách diễn đạt tự nhiên và trang trọng trong tiếng Việt để giới thiệu lời Kinh Thánh, đồng thời giữ ý nghĩa hiện tại của thể hoàn thành bị động: lời ấy đã được chép và vẫn có hiệu lực.'
- source_word: γάρ
  choice: Vì
  rationale: Giữ quan hệ giải thích hoặc làm căn cứ cho mệnh đề trước.
- source_word: Ἀπολῶ
  choice: Ta sẽ hủy diệt
  rationale: Diễn đạt trực tiếp động từ tương lai ἀπόλλυμι với nghĩa phá hủy hoặc làm cho tiêu tan; đại từ “Ta” phù hợp với lời phán của Đức Chúa Trời trong câu trích dẫn.
- source_word: τὴν σοφίαν τῶν σοφῶν
  choice: sự khôn ngoan của những người khôn ngoan
  rationale: Giữ phép lặp cùng gốc từ σοφία/σοφῶν và cấu trúc sở hữu, tạo sức nặng tu từ như nguyên văn.
- source_word: τὴν σύνεσιν τῶν συνετῶν
  choice: sự hiểu biết của những người hiểu biết
  rationale: Giữ sự tương ứng cùng gốc giữa σύνεσις và συνετός, cũng như thế song song với vế đầu; tiếng Việt hiện đại vẫn rõ nghĩa.
- source_word: ἀθετήσω
  choice: sẽ loại bỏ
  rationale: Truyền đạt hành động bác bỏ hoặc làm cho không còn hiệu lực bằng cách nói phổ thông, không thu hẹp nghĩa vào một sắc thái duy nhất.
theological_decisions:
- issue: Cách chuyển lời trích dẫn Ê-sai để giữ sự đối lập tu từ của Phao-lô
  choice: 'Dùng hai động từ tương lai trực tiếp: “sẽ hủy diệt” và “sẽ loại bỏ”'
  alternative: “sẽ làm tiêu tan” và “sẽ bác bỏ/làm cho vô hiệu”
  rationale: Giữ sức mạnh của lời Đức Chúa Trời tuyên bố đối với sự khôn ngoan và hiểu biết của con người, nhưng không thêm cách giải thích giáo lý ngoài nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “có lời chép rằng” theo lối dẫn Kinh Thánh quen thuộc; duy trì phép song hành và lặp từ của nguyên văn Hy Lạp. Dấu chú thích [a] được đặt sau toàn bộ câu trích dẫn vì chú thích giải thích vế sau.
