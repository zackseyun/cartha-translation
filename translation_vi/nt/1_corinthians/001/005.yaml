source:
  edition: SBLGNT
  text: ὅτι ἐν παντὶ ἐπλουτίσθητε ἐν αὐτῷ, ἐν παντὶ λόγῳ καὶ πάσῃ γνώσει,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/005.yaml
  text: because in him you were enriched in every way, in all speech and all knowledge,
translation:
  language: vi
  text: vì trong Ngài, anh chị em đã được làm cho phong phú về mọi phương diện, cả về mọi lời nói lẫn mọi sự hiểu biết,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι
  choice: vì
  rationale: Trong ngữ cảnh, mệnh đề này nêu lý do cho lời tạ ơn của Phao-lô ở câu trước; “vì” diễn đạt rõ quan hệ nguyên nhân.
- source_word: ἐν παντὶ
  choice: về mọi phương diện
  rationale: Cụm trung tính số ít mang nghĩa bao quát; cách dịch này tự nhiên trong tiếng Việt và dẫn vào hai phương diện cụ thể được nêu sau đó.
- source_word: ἐπλουτίσθητε
  choice: đã được làm cho phong phú
  rationale: Giữ thể thụ động của động từ và hình ảnh về sự phong phú, đồng thời tránh khiến người đọc chỉ liên tưởng đến giàu có vật chất.
- source_word: ἐν αὐτῷ
  choice: trong Ngài
  rationale: Giữ nghĩa chỉ phạm vi hay sự hiệp nhất của ἐν và ngôn ngữ đặc trưng của Phao-lô về đời sống trong Đấng Christ, thay vì chuyển thành “bởi Ngài” hay “nhờ Ngài”.
- source_word: ἐν παντὶ λόγῳ
  choice: về mọi lời nói
  rationale: Trong cặp với γνώσει, λόγῳ nhiều khả năng chỉ khả năng diễn đạt bằng lời; “mọi lời nói” ngắn gọn và giữ được độ rộng của từ gốc.
- source_word: πάσῃ γνώσει
  choice: mọi sự hiểu biết
  rationale: Diễn đạt γνώσει theo nghĩa rộng, đồng thời duy trì cấu trúc song song với “mọi lời nói” bằng tiếng Việt tự nhiên.
theological_decisions:
- issue: Ý nghĩa của ἐν αὐτῷ
  choice: trong Ngài
  alternative: bởi Ngài; nhờ Ngài
  rationale: Bản dịch giữ nguyên khả năng chỉ phạm vi hay sự hiệp nhất với Đấng Christ, không thu hẹp cụm từ thành tác nhân hoặc phương tiện.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” cho đại từ số nhiều chỉ cộng đồng tín hữu; viết hoa “Ngài” để chỉ Đấng Christ. Cấu trúc “cả… lẫn…” làm rõ hai phương diện song song mà không xóa sắc thái bao quát của câu Hy Lạp.
