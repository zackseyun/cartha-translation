revisions:
- from: Vì trong sự khôn ngoan của Đức Chúa Trời, thế gian đã không nhờ sự khôn ngoan mà nhận biết Đức Chúa Trời, nên Đức Chúa Trời vui lòng dùng điều bị xem là ngu dại trong lời được rao giảng[a] để cứu những người tin.
  to: Vì trong sự khôn ngoan của Đức Chúa Trời, thế gian đã không nhận biết Đức Chúa Trời nhờ sự khôn ngoan, nên Đức Chúa Trời vui lòng qua sự ngu dại của lời rao giảng[a] để cứu những người tin.
  rationale: Sửa cụm then chốt để phản ánh sát hơn μωρία τοῦ κηρύγματος, đồng thời đặt sắc thái “bị xem là ngu dại” trong chú thích thay vì thêm vào chính văn. Các thành phần khác của bản dịch được giữ vì truyền đạt tốt cú pháp, thuật ngữ và quan hệ lập luận của câu Hy Lạp.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T18:10:19Z'
review_pass:
  verdict: revise
  source_fidelity: 'Cấu trúc nhân quả “Vì … nên …” truyền đạt tốt ἐπειδὴ γὰρ và εὐδόκησεν. Tuy nhiên, “dùng điều bị xem là ngu dại trong lời được rao giảng” không phản ánh trực tiếp cấu trúc διὰ τῆς μωρίας τοῦ κηρύγματος: nguyên ngữ nói “qua sự ngu dại của lời/sứ điệp được rao giảng,” không phải một “điều” ngu dại nằm trong lời ấy. Cụm “bị xem là” là diễn giải hợp văn mạch nhưng không cần đưa vào chính văn.'
  naturalness: Bản sửa giữ văn phong hiện đại, trang trọng và mạch lạc hơn bằng trật tự tự nhiên “đã không nhận biết Đức Chúa Trời nhờ sự khôn ngoan.” “Lời rao giảng” là cách nói tự nhiên trong tiếng Việt.
  terminology: “Đức Chúa Trời,” “thế gian,” “sự khôn ngoan,” “cứu,” và “những người tin” đều phù hợp. “Sự ngu dại của lời rao giảng” giữ phép nghịch lý có chủ ý của Phao-lô; chú thích nêu cách hiểu “việc rao giảng” mà không buộc một cách giải thích.
  issues:
  - severity: medium
    issue: Cấu trúc của διὰ τῆς μωρίας τοῦ κηρύγματος bị chuyển thành “điều ... trong lời được rao giảng.”
    rationale: Cách này thay đổi quan hệ sở hữu trong nguyên ngữ và làm mờ việc toàn bộ lời/sứ điệp công bố bị gọi là “ngu dại” theo phép nghịch lý của văn mạch.
  - severity: low
    issue: “Bị xem là” đưa diễn giải văn mạch vào chính văn.
    rationale: Ý này thích hợp trong chú thích, nhưng nguyên văn trực tiếp dùng μωρία (“sự ngu dại”), nên chính văn nên giữ cách nói đó để bảo toàn sắc thái tu từ.
  revised_text: Vì trong sự khôn ngoan của Đức Chúa Trời, thế gian đã không nhận biết Đức Chúa Trời nhờ sự khôn ngoan, nên Đức Chúa Trời vui lòng qua sự ngu dại của lời rao giảng[a] để cứu những người tin.
