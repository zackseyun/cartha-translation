id: 1CO.1.21
reference: 1 Corinthians 1:21
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐπειδὴ γὰρ ἐν τῇ σοφίᾳ τοῦ θεοῦ οὐκ ἔγνω ὁ κόσμος διὰ τῆς σοφίας τὸν θεόν, εὐδόκησεν ὁ θεὸς διὰ τῆς μωρίας τοῦ κηρύγματος σῶσαι τοὺς πιστεύοντας.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/021.yaml
  text: For since[a], in the wisdom of God, the world did not know God through wisdom[b], God was pleased through the foolishness of the proclamation to save those who believe.
translation:
  language: vi
  text: Vì trong sự khôn ngoan của Đức Chúa Trời, thế gian đã không nhận biết Đức Chúa Trời nhờ sự khôn ngoan, nên Đức Chúa Trời vui lòng qua sự ngu dại của lời rao giảng[a] để cứu những người tin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “qua sự ngu dại của việc rao giảng.” Cụm từ này có thể chỉ lời được công bố, hành vi rao giảng, hoặc gợi cả hai.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπειδὴ γὰρ
  choice: Vì ... nên
  rationale: Diễn đạt tự nhiên quan hệ giải thích và nguyên nhân–kết quả trong tiếng Việt; γάρ nối với lập luận trước, còn ἐπειδή nêu căn cứ cho mệnh đề chính.
- source_word: ἐν τῇ σοφίᾳ τοῦ θεοῦ
  choice: trong sự khôn ngoan của Đức Chúa Trời
  rationale: Giữ cách diễn đạt tương đối sát nguyên văn và không quyết định ἐν chỉ phương tiện hay phạm vi/sự sắp đặt.
- source_word: οὐκ ἔγνω
  choice: đã không ... nhận biết
  rationale: “Nhận biết” giữ được cả chiều kích nhận thức lẫn quan hệ của γινώσκω, đồng thời phù hợp với thể quá khứ trong ngữ cảnh.
- source_word: ὁ κόσμος
  choice: thế gian
  rationale: Cách dịch quen thuộc trong văn mạch Phao-lô, có thể chỉ nhân loại trong trật tự xa cách Đức Chúa Trời mà không thêm lời giải nghĩa vào chính văn.
- source_word: διὰ τῆς σοφίας
  choice: nhờ sự khôn ngoan
  rationale: “Nhờ” diễn đạt διά với sở hữu cách như phương tiện, nhưng không tự ý thêm rằng đó là sự khôn ngoan riêng của thế gian.
- source_word: εὐδόκησεν ὁ θεὸς
  choice: Đức Chúa Trời vui lòng
  rationale: Giữ ý về sự hài lòng và ý muốn tốt lành của Đức Chúa Trời, thay vì làm phẳng thành “quyết định”.
- source_word: διὰ τῆς μωρίας τοῦ κηρύγματος
  choice: dùng điều bị xem là ngu dại trong lời được rao giảng
  rationale: 'Làm rõ tính mỉa mai theo văn cảnh: lời rao giảng bị thế gian xem là ngu dại, chứ không khẳng định lời ấy vốn ngu dại. “Lời được rao giảng” ưu tiên nội dung của κήρυγμα nhưng vẫn gợi đến hành vi công bố.'
- source_word: σῶσαι
  choice: để cứu
  rationale: “Cứu” là từ tự nhiên và giữ nguyên chiều kích cứu rỗi của σῴζω.
- source_word: τοὺς πιστεύοντας
  choice: những người tin
  rationale: Diễn đạt rõ phân từ hiện tại dùng như danh từ mà không thêm một sắc thái giáo lý vượt quá nguyên văn.
theological_decisions:
- issue: Ý nghĩa của διὰ τῆς μωρίας τοῦ κηρύγματος
  choice: Chủ yếu chỉ nội dung được rao giảng mà thế gian xem là ngu dại
  alternative: Chỉ hành vi/phương cách rao giảng bị xem là ngu dại, hoặc cố ý bao gồm cả nội dung lẫn hành vi
  rationale: κήρυγμα thường chỉ điều được công bố, nhưng ở đây cũng có thể gợi đến việc công bố công khai. Chính văn dùng “lời được rao giảng” để giữ cả hai phương diện, còn chú thích ghi nhận cách hiểu thiên về hành vi rao giảng.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Cấu trúc “Vì ... nên ...” làm rõ dòng lập luận dài của câu Hy Lạp. Danh xưng “Đức Chúa Trời” được dùng nhất quán. Cụm “bị xem là” chuyển tải sự đánh giá của thế gian trong văn cảnh, tránh quy sự ngu dại thật sự cho sứ điệp của Đức Chúa Trời.
