    rationale: SBLGNT được cung cấp đọc εὐχαριστῶ mà không có θεῷ. Chú thích về một số thủ bản không khắc phục việc thân văn bản đã chọn cách đọc không phải là văn bản cơ sở.
  - severity: low
    issue: “làm phép báp-têm” diễn giải rộng hơn động từ ἐβάπτισα.
    rationale: Dù có thể hiểu được, “báp-têm cho” trực tiếp hơn, tự nhiên hơn và không thêm yếu tố “phép.”
  - severity: low
    issue: Tên “Cơ-ríp” không phải dạng phiên âm Việt ngữ thông dụng của Κρίσπον.
    rationale: “Cơ-rít” là dạng quen dùng trong tiếng Việt Kinh Thánh và phản ánh tên Crispus rõ hơn.
  revised_text: Tôi tạ ơn vì tôi đã không báp-têm cho ai trong anh em, ngoại trừ Cơ-rít và Gai-út,
