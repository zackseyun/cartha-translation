revisions:
- from: Tôi cảm tạ Đức Chúa Trời[a] vì tôi đã không làm phép báp-têm cho ai trong anh em, ngoại trừ Cơ-ríp và Gai-út,
  to: Tôi tạ ơn vì tôi đã không báp-têm cho ai trong anh em, ngoại trừ Cơ-rít và Gai-út,
  rationale: 'Sửa để tuân theo văn bản SBLGNT làm cơ sở: không thêm đối tượng cho động từ “tạ ơn.” Không cần chú thích dị bản trong câu này, vì dị bản không được chọn không xuất hiện trong bản dịch; việc thêm chú thích cũng không được neo vào một từ trong thân văn bản sau khi bỏ “Đức Chúa Trời.” Các lựa chọn còn lại giữ sắc thái thư tín trang trọng, thuật ngữ trung tính về phương thức báp-têm, và cấu trúc loại trừ của nguyên ngữ.'
  reviewer_model: gpt-5.6-terra
