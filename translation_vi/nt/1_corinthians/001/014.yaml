source:
  edition: SBLGNT
  text: ⸀εὐχαριστῶ ὅτι οὐδένα ὑμῶν ἐβάπτισα εἰ μὴ Κρίσπον καὶ Γάϊον,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/014.yaml
  text: I am thankful that I baptized none of you except Crispus and Gaius,
translation:
  language: vi
  text: Tôi tạ ơn vì tôi đã không báp-têm cho ai trong anh em, ngoại trừ Cơ-rít và Gai-út,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐχαριστῶ
  choice: Tôi cảm tạ Đức Chúa Trời
  rationale: “Cảm tạ” diễn đạt tự nhiên hành động tạ ơn ở thì hiện tại. Bổ ngữ “Đức Chúa Trời” dựa trên biến thể văn bản được nhiều thủ bản chứng thực và được ghi chú vì SBLGNT đánh dấu vị trí này có dị bản.
- source_word: ὅτι
  choice: vì
  rationale: Trong tiếng Việt, “vì” nối tự nhiên lời cảm tạ với lý do/nội dung khiến Phao-lô tạ ơn; không làm thay đổi quan hệ ý nghĩa của mệnh đề.
- source_word: οὐδένα ὑμῶν
  choice: không ... cho ai trong anh em
  rationale: Giữ đầy đủ ý phủ định và đối tượng số nhiều, đồng thời dùng cách xưng hô cộng đồng quen thuộc, trang trọng trong tiếng Việt.
- source_word: ἐβάπτισα
  choice: làm phép báp-têm
  rationale: Dùng thuật ngữ Tân Ước quen thuộc trong tiếng Việt, không quyết định phương thức thực hiện nghi lễ.
- source_word: εἰ μὴ
  choice: ngoại trừ
  rationale: Diễn đạt rõ cấu trúc loại trừ trong ngữ cảnh này.
- source_word: Κρίσπον
  choice: Cơ-ríp
  rationale: Phiên âm tên riêng theo cách đọc rõ ràng và quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
- source_word: Γάϊον
  choice: Gai-út
  rationale: Phiên âm tên riêng theo cách đọc rõ ràng và quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
theological_decisions:
- issue: Đối tượng được Phao-lô cảm tạ trong biến thể văn bản đầu câu
  choice: Đức Chúa Trời được đặt trong câu và có chú thích dị bản
  alternative: 'Không nêu đối tượng: “Tôi cảm tạ vì...”'
  rationale: Dấu ⸀ trong SBLGNT báo hiệu dị bản tại vị trí này. Việc nêu “Đức Chúa Trời” phù hợp với chứng cứ thủ bản được thừa nhận rộng rãi và lối nói thông thường của Phao-lô, nhưng chú thích bảo tồn cách đọc ngắn hơn thay vì che giấu sự không chắc chắn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Anh em” được dùng theo lối xưng hô cộng đồng của thư tín; “làm phép báp-têm” tránh áp đặt một quan điểm hệ phái về phương thức báp-têm.
source_grounding:
  english_pob_role: consult_only
