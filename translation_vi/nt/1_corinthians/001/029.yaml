  text: so that no flesh may boast before God[a].
translation:
  language: vi
  text: để không một xác thịt nào khoe khoang trước mặt Đức Chúa Trời.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “để không một người nào khoe khoang trước mặt Đức Chúa Trời.” Theo nghĩa đen: “không một xác thịt nào.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπως
  choice: để
  rationale: Diễn tả mục đích hoặc kết quả; “để” tự nhiên trong tiếng Việt và giữ được lực hướng đích của mệnh đề.
- source_word: μὴ
  choice: không một… nào
  rationale: Kết hợp với động từ ở thể giả định để phủ định toàn thể; cấu trúc này chuyển tải tự nhiên ý không có bất cứ ai được loại trừ khỏi sự phủ định.
- source_word: καυχήσηται
  choice: có thể khoe mình
  rationale: Giữ sắc thái của thể giả định trong mệnh đề mục đích; “khoe mình” diễn tả việc tự hào hoặc tự tôn về chính mình.
- source_word: πᾶσα σὰρξ
  choice: không một xác thịt nào
  rationale: Nguyên văn là “mọi xác thịt”; dưới tác động của phủ định, cụm từ mang nghĩa loại trừ phổ quát. Giữ “xác thịt” để bảo tồn hình ảnh và sự căng thẳng trong cách nói của Phao-lô.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: trước mặt Đức Chúa Trời
  rationale: Cách diễn đạt tự nhiên, trang trọng, chỉ việc ở trước sự hiện diện và phán xét của Đức Chúa Trời.
theological_decisions:
- issue: Cách dịch σάρξ trong văn cảnh của Phao-lô
  choice: xác thịt
  alternative: con người; loài người; bản tính tội lỗi
  rationale: Ở đây σάρξ chỉ loài người trong thân phận thọ tạo và yếu đuối trước Đức Chúa Trời, chứ không chủ yếu nói đến một nguyên lý đạo đức nội tại. “Xác thịt” giữ được hình ảnh tu từ của nguyên bản và không áp đặt cách hiểu “bản tính tội lỗi” lên câu.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Giữ cách nói “xác thịt” trong chính văn vì giá trị tu từ và thần học; chú thích cung cấp cách diễn đạt rõ nghĩa hơn.
