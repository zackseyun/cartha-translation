  - severity: low
    issue: Cụm “nóng lòng chờ đợi”
    rationale: Cụm này có thể gợi sự sốt ruột/khó chờ trong tiếng Việt. “Đang tha thiết trông đợi” vẫn giữ sắc thái trông chờ mãnh liệt của ἀπεκδεχομένους, đồng thời phù hợp hơn với văn phong trang trọng.
