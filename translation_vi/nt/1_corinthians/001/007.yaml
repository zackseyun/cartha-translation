reference: 1 Corinthians 1:7
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὥστε ὑμᾶς μὴ ὑστερεῖσθαι ἐν μηδενὶ χαρίσματι, ἀπεκδεχομένους τὴν ἀποκάλυψιν τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/007.yaml
  text: so that you do not lack any gift as you eagerly await the revelation of our Lord Jesus the Messiah[a][b][c].
translation:
  language: vi
  text: Do đó, anh chị em không thiếu bất cứ ân tứ nào, đang tha thiết trông đợi sự mặc khải của Chúa chúng ta là Đức Giê-su Ki-tô.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “bất cứ ân tứ thuộc linh nào” hoặc “bất cứ quà tặng nào bởi ân điển ban cho.”'
    reason: lexical_alternative
  - marker: b
    text: “Sự mặc khải” cũng có thể dịch là “sự hiện ra”; “Đức Giê-su Ki-tô” cũng có thể diễn đạt là “Chúa Giê-su, Đấng Mê-si-a.”
    reason: lexical_and_title_alternative
lexical_decisions:
- source_word: ὥστε
  choice: vì thế
  rationale: Diễn tả kết quả của ân điển Đức Chúa Trời được nói đến trong ngữ cảnh trước, đồng thời nối câu tự nhiên trong tiếng Việt.
- source_word: ὑμᾶς μὴ ὑστερεῖσθαι
  choice: anh chị em không thiếu
  rationale: Truyền đạt trực tiếp ý không bị thiếu hụt; “anh chị em” biểu đạt số nhiều bao gồm toàn thể hội thánh một cách tự nhiên.
- source_word: ἐν μηδενὶ χαρίσματι
  choice: bất cứ ân tứ nào
  rationale: “Ân tứ” vừa giữ được ý món quà do ân điển ban cho trong χάρισμα, vừa là cách nói quen thuộc và gọn trong tiếng Việt Cơ Đốc.
- source_word: ἀπεκδεχομένους
  choice: trong khi nóng lòng chờ đợi
  rationale: Giữ cả tính liên tục của phân từ lẫn sắc thái mong đợi tha thiết của động từ tăng cường.
- source_word: ἀποκάλυψιν
  choice: sự mặc khải
  rationale: Là từ tương đương trực tiếp với ἀποκάλυψις và giữ được ngôn ngữ cánh chung của Phao-lô; “sự hiện ra” là khả năng theo ngữ cảnh.
- source_word: τοῦ κυρίου ἡμῶν
  choice: của Chúa chúng ta
  rationale: Giữ quan hệ sở hữu và cách xưng κύριος theo lối trang trọng, tự nhiên.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Đức Giê-su Ki-tô
  rationale: Trong cụm cố định này, Χριστός vận hành gần như thành phần của danh xưng; cách chuyển tự truyền thống “Ki-tô” giữ được điều đó mà không nhấn mạnh thêm nghĩa tước hiệu.
theological_decisions:
- issue: Cách dịch Χριστοῦ trong Ἰησοῦ Χριστοῦ
  choice: Đức Giê-su Ki-tô
  alternative: Chúa Giê-su, Đấng Mê-si-a
  rationale: Ngữ cảnh dùng cụm tên gọi quen thuộc, không đặc biệt làm nổi bật tước hiệu Mê-si-a. Chuyển tự “Ki-tô” bảo tồn tính chất tên gọi; chú thích nêu cách dịch minh thị tước hiệu.
- issue: Quan hệ của ἀπεκδεχομένους với mệnh đề chính
  choice: trong khi nóng lòng chờ đợi
  alternative: là những người nóng lòng chờ đợi
  rationale: Phân từ có thể mô tả hoàn cảnh đồng thời hoặc đặc điểm của người Cô-rinh-tô. Bản dịch giữ quan hệ thời gian rộng, không biến sự chờ đợi thành nguyên nhân của việc có ân tứ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” cho đại từ số nhiều ὑμᾶς; “ân tứ” để giữ liên hệ với ân điển; “nóng lòng chờ đợi” diễn đạt sức nặng của ἀπεκδέχομαι. Mọi dấu chú thích đều xuất hiện trong chính văn.
