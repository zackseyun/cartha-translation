revisions:
- from: Đức Chúa Trời là thành tín; bởi Ngài, anh chị em đã được kêu gọi bước vào sự hiệp thông[a] với Con Ngài là Chúa Giê-su, Đấng Mê-si, Chúa chúng ta.
  to: Đức Chúa Trời là thành tín; chính bởi Ngài mà anh chị em đã được kêu gọi vào sự hiệp thông[a] với Con Ngài, là Giê-su, Đấng Mê-si, Chúa chúng ta.
  rationale: Sửa vị trí và chức năng cú pháp của “Chúa” để phản ánh đúng chuỗi “Giê-su, Đấng Mê-si, Chúa chúng ta” trong tiếng Hy Lạp; đồng thời làm trơn cách diễn đạt về tác nhân và sự kêu gọi. Chú thích hiện có vẫn gắn đúng với “sự hiệp thông” và bảo lưu các lựa chọn từ vựng thích hợp.
