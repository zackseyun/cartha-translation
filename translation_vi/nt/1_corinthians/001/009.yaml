id: 1CO.1.9
reference: 1 Corinthians 1:9
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: πιστὸς ὁ θεὸς δι’ οὗ ἐκλήθητε εἰς κοινωνίαν τοῦ υἱοῦ αὐτοῦ Ἰησοῦ Χριστοῦ τοῦ κυρίου ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/009.yaml
  text: God is faithful[a], by whom you were called into fellowship with his Son[c][b], Jesus the Messiah our Lord.
translation:
  language: vi
  text: Đức Chúa Trời là thành tín; chính bởi Ngài mà anh chị em đã được kêu gọi vào sự hiệp thông[a] với Con Ngài, là Giê-su, Đấng Mê-si, Chúa chúng ta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “sự cùng dự phần” hoặc “sự chia sẻ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: πιστὸς
  choice: thành tín
  rationale: Diễn tả phẩm tính đáng tin cậy và trước sau như một của Đức Chúa Trời; đây là cách nói tự nhiên, trang trọng trong tiếng Việt Kinh Thánh.
- source_word: δι’ οὗ
  choice: bởi Ngài
  rationale: διά với sở hữu cách chỉ tác nhân trung gian hoặc tác nhân thực hiện; “bởi Ngài” giữ được sắc thái tác nhân trong câu và phù hợp tiếng Việt.
- source_word: ἐκλήθητε
  choice: anh chị em đã được kêu gọi
  rationale: Giữ thể bị động và ý nghĩa lời kêu gọi của Đức Chúa Trời trong cách dùng của Phao-lô; “anh chị em” biểu đạt số nhiều của ngôi thứ hai mà không giới hạn giới tính.
- source_word: κοινωνίαν
  choice: sự hiệp thông
  rationale: Bao hàm cả mối quan hệ gắn bó lẫn sự cùng dự phần; “hiệp thông” trang trọng nhưng vẫn quen thuộc, không tự giới hạn vào một nghi thức.
- source_word: τοῦ υἱοῦ αὐτοῦ
  choice: với Con Ngài
  rationale: Sở hữu cách phụ thuộc vào κοινωνία; tiếng Việt diễn đạt tự nhiên quan hệ này bằng “hiệp thông với”.
- source_word: Χριστοῦ
  choice: Đấng Mê-si
  rationale: Dịch Χριστός như một tước hiệu thay vì phiên âm; thêm “Đấng” để tước hiệu đứng tự nhiên sau tên Giê-su trong tiếng Việt.
- source_word: κυρίου
  choice: Chúa
  rationale: Cách dịch chuẩn, tự nhiên của κύριος trong tước hiệu chỉ Chúa Giê-su.
theological_decisions:
- issue: Χριστοῦ nên được thể hiện như thành phần gần với tên riêng hay như tước hiệu được dịch nghĩa.
  choice: Đấng Mê-si
  alternative: Đấng Christ; Ki-tô
  rationale: Trong chuỗi đồng vị này, Χριστός vẫn mang nội dung tước hiệu “Đấng được xức dầu.” “Đấng Mê-si” vừa dịch tước hiệu vừa phân biệt nó với tên riêng, không áp đặt một truyền thống hệ phái.
- issue: Quan hệ do κοινωνίαν τοῦ υἱοῦ αὐτοῦ biểu đạt.
  choice: sự hiệp thông với Con Ngài
  alternative: sự dự phần vào Con Ngài; sự hiệp thông của Con Ngài
  rationale: Cụm sở hữu cách có thể nhấn mạnh sự cùng dự phần hoặc quan hệ hiệp thông. Bản dịch chính dùng cách nói tự nhiên “với,” còn chú thích bảo lưu chiều nghĩa tham dự/chia sẻ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Trời,” “Chúa Giê-su” và “Đấng Mê-si” theo lối gọi quen thuộc; dùng “anh chị em” để thể hiện ngôi thứ hai số nhiều bao hàm cộng đồng. Dấu chấm phẩy làm rõ rằng sự thành tín của Đức Chúa Trời là nền tảng cho lời khẳng định tiếp theo.
