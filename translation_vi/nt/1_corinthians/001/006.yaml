id: 1CO.1.6
reference: 1 Corinthians 1:6
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καθὼς τὸ μαρτύριον τοῦ Χριστοῦ ἐβεβαιώθη ἐν ὑμῖν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/006.yaml
  text: just as the testimony about Messiah was confirmed among you[b][a],
translation:
  language: vi
  text: đúng như lời chứng về Đấng Mê-si đã được xác nhận giữa anh chị em[b][a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “lời chứng của Đấng Mê-si.”'
    reason: alternative_reading
  - marker: b
    text: 'Cũng có thể dịch: “đã được xác nhận trong anh chị em.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς
  choice: đúng như
  rationale: Diễn đạt tự nhiên quan hệ tương ứng với ý đi trước, đồng thời giữ sắc thái nhấn mạnh của καθὼς.
- source_word: μαρτύριον
  choice: lời chứng
  rationale: Giữ được cả ý nghĩa làm chứng và nội dung được công bố, không diễn giải rộng thành “sứ điệp”.
- source_word: τοῦ Χριστοῦ
  choice: về Đấng Mê-si
  rationale: 'Hiểu sở hữu cách theo nghĩa khách thể trong mạch văn: lời chứng có Đấng Mê-si làm nội dung. Cách hiểu “của Đấng Mê-si” vẫn được ghi ở chú thích vì cấu trúc Hy Lạp có thể mang nghĩa ấy.'
- source_word: ἐβεβαιώθη
  choice: đã được xác nhận
  rationale: Thể bị động chỉ việc lời chứng được làm cho vững chắc hoặc được chứng thực; “được xác nhận” vừa sát nghĩa vừa tự nhiên.
- source_word: ἐν ὑμῖν
  choice: giữa anh chị em
  rationale: Với đại từ số nhiều chỉ cộng đồng Cô-rinh-tô, cụm này tự nhiên có thể nói đến điều được xác nhận giữa cộng đồng; nghĩa sát chữ “trong anh chị em” được bảo lưu trong chú thích.
theological_decisions:
- issue: Quan hệ sở hữu cách trong τοῦ Χριστοῦ
  choice: lời chứng về Đấng Mê-si
  alternative: lời chứng của Đấng Mê-si
  rationale: Mạch văn phù hợp với lời chứng được rao giảng về Đấng Mê-si và được chứng thực nơi cộng đồng, nhưng ngữ pháp không loại trừ cách hiểu Đấng Mê-si là nguồn hoặc chủ thể của lời chứng.
- issue: Phạm vi của ἐν ὑμῖν
  choice: giữa anh chị em
  alternative: trong anh chị em
  rationale: Bản dịch chính làm rõ chiều kích cộng đồng của đại từ số nhiều mà không phủ nhận khả năng cụm từ nói đến tác động ở trong họ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đấng Mê-si” để thể hiện Χριστός như một tước hiệu; dùng “anh chị em” cho đại từ số nhiều nhằm nói tự nhiên với cả cộng đồng. Trật tự dấu chú thích [b][a] được giữ theo văn bản tham khảo và mọi dấu đều xuất hiện trong câu chính.
