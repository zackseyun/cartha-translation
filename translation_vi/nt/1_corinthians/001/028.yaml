id: 1CO.1.28
reference: 1 Corinthians 1:28
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ τὰ ἀγενῆ τοῦ κόσμου καὶ τὰ ἐξουθενημένα ἐξελέξατο ὁ θεός, ⸀τὰ μὴ ὄντα, ἵνα τὰ ὄντα καταργήσῃ,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/028.yaml
  text: And God chose the lowborn things of the world and the despised things[a], the things that are not, to nullify the things that are[b],
translation:
  language: vi
  text: Đức Chúa Trời đã chọn những gì thấp kém trong thế gian và những gì bị khinh miệt[a], những gì không hiện hữu, để làm cho những gì hiện hữu trở nên vô hiệu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hoặc “những gì bị xem là không ra gì.”
    reason: lexical_alternative
  - marker: b
    text: Hoặc “làm cho những gì hiện hữu thành ra không.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγενῆ
  choice: những gì thấp kém
  rationale: Từ này chỉ những gì không có xuất thân cao quý hoặc địa vị xã hội; cách dịch này tự nhiên trong tiếng Việt và giữ trọng tâm về địa vị thấp.
- source_word: ἐξουθενημένα
  choice: những gì bị khinh miệt
  rationale: Phân từ hoàn thành diễn tả những gì đã bị coi thường, xem là không đáng kể; dạng bị động giữ được sắc thái ấy.
- source_word: τὰ μὴ ὄντα
  choice: những gì không hiện hữu
  rationale: Giữ cách nói táo bạo và rộng của Phao-lô, đồng thời duy trì thế đối lập cân xứng với τὰ ὄντα; ngữ cảnh cũng cho phép hiểu là những người bị xem như không đáng kể.
- source_word: τὰ ὄντα
  choice: những gì hiện hữu
  rationale: Dịch sát để giữ phép đối lập với “những gì không hiện hữu”, thay vì thu hẹp ngay thành một phạm trù địa vị xã hội.
- source_word: καταργήσῃ
  choice: làm cho ... trở nên vô hiệu
  rationale: Diễn đạt ý khiến điều gì mất hiệu lực hoặc tác dụng, không hàm ý nhất thiết bị tiêu diệt hoàn toàn.
- source_word: ἐξελέξατο
  choice: đã chọn
  rationale: Cách dịch thông dụng, tự nhiên, thể hiện hành động chủ ý của Đức Chúa Trời và phù hợp với sự lặp lại trong văn mạch.
theological_decisions:
- issue: Nên hiểu τὰ μὴ ὄντα / τὰ ὄντα như các phạm trù xã hội hay như lời nói về sự hiện hữu.
  choice: 'Giữ đối lập theo hình thức: “những gì không hiện hữu” / “những gì hiện hữu”.'
  alternative: Diễn ý là “những người bị xem là không ra gì” / “những người được xem là có địa vị”.
  rationale: Văn mạch nói về địa vị theo đánh giá của thế gian, nhưng cách diễn đạt Hy Lạp rộng và gây ấn tượng hơn. Giữ nguyên thế đối lập bảo tồn cả sức tu từ lẫn sự căng thẳng về ý nghĩa, không áp đặt một cách giải thích hẹp vào chính văn.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Dùng “những gì” xuyên suốt để phản ánh các dạng trung tính số nhiều trong tiếng Hy Lạp và duy trì nhịp đối xứng; “hiện hữu” được chọn để bảo tồn phép đối lập có tính tu từ, dù hơi trang trọng hơn khẩu ngữ.
