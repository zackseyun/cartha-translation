  source_fidelity: 'Bản dịch phản ánh đúng cấu trúc và các lựa chọn từ vựng chủ đạo của tiếng Hy Lạp: ἀγενῆ là các đối tượng thuộc hạng thấp kém, ἐξουθενημένα là các đối tượng bị khinh miệt, và ἐξελέξατο là hành động chủ ý của Đức Chúa Trời. Đối lập tu từ τὰ μὴ ὄντα / τὰ ὄντα được giữ nguyên bằng “những gì không hiện hữu” / “những gì hiện hữu”, không thu hẹp trái phép thành địa vị xã hội. “Làm cho ... trở nên vô hiệu” diễn đạt chính xác καταργήσῃ là khiến mất hiệu lực, không nhất thiết hủy diệt theo nghĩa vật chất.'
  naturalness: Câu văn trang trọng, sáng rõ và tự nhiên trong tiếng Việt hiện đại. Việc lặp “những gì” giữ được nhịp song hành của nguyên văn; “hiện hữu” tuy có sắc thái trang trọng nhưng phù hợp với thế đối lập tu từ có chủ ý của câu.
  terminology: “Đức Chúa Trời,” “đã chọn,” “bị khinh miệt,” và “trở nên vô hiệu” nhất quán với ngữ vực Kinh Thánh hiện đại. “Những gì thấp kém” truyền đạt đủ ý hạng thấp/không có địa vị cao mà không áp đặt cách giải thích hẹp về đối tượng.
