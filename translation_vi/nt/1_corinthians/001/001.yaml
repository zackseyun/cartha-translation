  to: Phao-lô, được kêu gọi làm sứ đồ của Giê-su, Đấng Mê-si-a[a], theo ý muốn của Đức Chúa Trời, và Sốt-then, người anh em của chúng ta,
  rationale: Chỉnh cách trình bày danh xưng để tiếng Việt hiện đại tự nhiên, rõ tước hiệu «Mê-si-a» của Giê-su, đồng thời dùng «và» sát với καὶ. Thêm «của» trong «theo ý muốn của Đức Chúa Trời» là cách diễn đạt tiếng Việt chuẩn; không thay đổi quan hệ nguyên nhân/phương tiện của διὰ θελήματος θεοῦ. Dấu phẩy cuối được giữ vì câu thư tín tiếp tục ở câu sau.
