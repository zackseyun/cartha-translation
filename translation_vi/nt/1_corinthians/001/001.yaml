  text: Παῦλος κλητὸς ἀπόστολος ⸂Χριστοῦ Ἰησοῦ⸃ διὰ θελήματος θεοῦ καὶ Σωσθένης ὁ ἀδελφὸς
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/001.yaml
  text: Paul[a], a called apostle of Messiah Jesus by the will of God, and Sosthenes our brother,
translation:
  language: vi
  text: Phao-lô, được kêu gọi làm sứ đồ của Giê-su, Đấng Mê-si-a[a], theo ý muốn của Đức Chúa Trời, và Sốt-then, người anh em của chúng ta,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: Đấng Christ Giê-su.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Παῦλος
  choice: Phao-lô
  rationale: Dạng phiên âm quen thuộc và dễ nhận biết của tên riêng Paulos trong tiếng Việt.
- source_word: κλητὸς ἀπόστολος
  choice: được kêu gọi làm sứ đồ
  rationale: Diễn đạt tự nhiên trong tiếng Việt rằng địa vị sứ đồ của Phao-lô bắt nguồn từ sự kêu gọi, đồng thời không thêm ý ông chỉ mới được mời gọi nhưng chưa thực sự là sứ đồ.
- source_word: Χριστοῦ Ἰησοῦ
  choice: của Đấng Mê-si-a Jêsus
  rationale: Giữ thứ tự của nguyên văn và thể hiện Χριστός như tước hiệu chỉ Đấng được xức dầu, thay vì coi đó đơn thuần là một phần của tên riêng.
- source_word: διὰ θελήματος θεοῦ
  choice: theo ý muốn Đức Chúa Trời
  rationale: Cách nói tự nhiên trong tiếng Việt, diễn đạt ý chức vụ của Phao-lô có nền tảng và nguyên nhân nơi ý muốn của Đức Chúa Trời.
- source_word: Σωσθένης
  choice: Sốt-then
  rationale: Phiên âm tên riêng theo lối quen thuộc, rõ ràng đối với độc giả Việt ngữ.
- source_word: ὁ ἀδελφὸς
  choice: người anh em của chúng ta
  rationale: Trong lời mở đầu thư tín, danh xưng có mạo từ này tự nhiên được hiểu là người anh em cùng đức tin mà người viết và độc giả cùng nhìn nhận; cách dịch này rõ nghĩa và phù hợp tiếng Việt.
theological_decisions:
- issue: Cách dịch Χριστός trong danh xưng Χριστοῦ Ἰησοῦ
  choice: Đấng Mê-si-a Jêsus
  alternative: Đấng Christ Jêsus
  rationale: Ở đây Χριστός vẫn nêu địa vị của Jêsus là Đấng được xức dầu. Bản chính dùng “Đấng Mê-si-a” để làm rõ tước hiệu, còn chú thích bảo lưu cách gọi truyền thống “Đấng Christ”.
- issue: Ý nghĩa của κλητὸς đối với chức vụ sứ đồ
  choice: được kêu gọi làm sứ đồ
  alternative: một sứ đồ được kêu gọi
  rationale: Cách chọn này nối sự kêu gọi với chức vụ sứ đồ mà không xác định thêm thời điểm hay điều kiện của sự kêu gọi.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, phù hợp phần mở đầu thư tín. Dùng “cùng với” để cho thấy Sốt-then được nêu chung trong lời chào nhưng không nhất thiết đồng nghĩa với việc ông có cùng chức danh sứ đồ. Câu giữ dấu phẩy cuối vì câu chào tiếp tục sang câu kế tiếp.
