  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐδηλώθη γάρ μοι περὶ ὑμῶν, ἀδελφοί μου, ὑπὸ τῶν Χλόης ὅτι ἔριδες ἐν ὑμῖν εἰσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/011.yaml
  text: For it has been reported to me about you[a], my brothers, by Chloe’s people, that there are quarrels among you.
translation:
  language: vi
  text: Vì, thưa anh em của tôi[a], tôi được những người của Cơ-lô-ê cho biết rằng giữa anh em có những cuộc tranh cãi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “anh chị em của tôi.” Tiếng Hy Lạp dùng từ “anh em” ở giống đực số nhiều, nhưng trong ngữ cảnh này có thể chỉ toàn thể cộng đồng tín hữu, gồm cả nam lẫn nữ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδηλώθη
  choice: đã cho tôi biết
  rationale: Động từ ở thể bị động diễn tả việc thông tin được làm cho Phao-lô biết. Tiếng Việt tự nhiên hơn khi chuyển sang cấu trúc chủ động với tác nhân được nêu rõ, mà vẫn giữ nguyên nội dung.
- source_word: γάρ
  choice: Vì
  rationale: Giữ mối liên kết giải thích với lời khuyên ở câu trước.
- source_word: περὶ ὑμῶν
  choice: rằng giữa anh em có…
  rationale: Nội dung được báo cáo là điều xảy ra giữa những người nhận thư; cách lồng ý này tránh lặp vụng về “về anh em… giữa anh em” trong tiếng Việt mà vẫn truyền đạt đầy đủ ý nghĩa.
- source_word: ἀδελφοί μου
  choice: thưa anh em của tôi
  rationale: Giữ cả từ xưng hô ἀδελφοί và đại từ sở hữu μου. “Thưa” đánh dấu lời gọi trực tiếp một cách tự nhiên, trang trọng trong tiếng Việt hiện đại.
- source_word: ὑπὸ τῶν Χλόης
  choice: những người của Cơ-lô-ê
  rationale: Cụm Hy Lạp chỉ những người có liên hệ với Cơ-lô-ê. Cách dịch này không xác quyết quá mức rằng họ nhất thiết là người trong gia đình hay gia nhân của bà.
- source_word: ἔριδες
  choice: những cuộc tranh cãi
  rationale: Danh từ số nhiều chỉ các xung đột hay tranh chấp giữa người với người; “những cuộc tranh cãi” rõ nghĩa và tự nhiên hơn các từ cổ hoặc quá rộng như “chia rẽ”.
- source_word: ἐν ὑμῖν εἰσιν
  choice: giữa anh em có
  rationale: Đây là cấu trúc hiện hữu tự nhiên trong tiếng Việt và thể hiện đúng ý “có ở giữa/giữa vòng anh em”.
theological_decisions:
- issue: Cách dịch ἀδελφοί khi cộng đồng được nói đến có thể gồm cả nam lẫn nữ
  choice: anh em của tôi
  alternative: anh chị em của tôi
  rationale: Bản văn Hy Lạp dùng danh từ giống đực số nhiều “anh em”, nhưng từ này có thể được dùng theo nghĩa bao gồm toàn thể cộng đồng tín hữu. Bản chính giữ hình thức của nguyên ngữ; chú thích nêu rõ khả năng bao hàm cả nam và nữ.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. Dùng “thưa” để thể hiện lời gọi trực tiếp; tên Χλόη được phiên âm là “Cơ-lô-ê”. Cấu trúc chủ động được chọn để câu tiếng Việt tự nhiên, trong khi tác nhân và nội dung của lời báo vẫn được bảo toàn.
