id: 1CO.1.13
reference: 1 Corinthians 1:13
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: μεμέρισται ὁ Χριστός; μὴ Παῦλος ἐσταυρώθη ὑπὲρ ὑμῶν, ἢ εἰς τὸ ὄνομα Παύλου ἐβαπτίσθητε;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/013.yaml
  text: Has Messiah been divided? Was Paul crucified for you? Or were you baptized into the name of Paul?[a][b]
translation:
  language: vi
  text: Đấng Mê-si-a đã bị phân chia sao? Có phải Phao-lô đã bị đóng đinh vì anh chị em không? Hay anh chị em đã được báp-têm nhân danh Phao-lô sao?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hoặc “Đấng Ki-tô đã bị phân chia sao?”
    reason: lexical_alternative
  - marker: b
    text: Hoặc “anh chị em đã được báp-têm vào danh Phao-lô sao?”
    reason: lexical_alternative
lexical_decisions:
- source_word: μεμέρισται
  choice: đã bị phân chia
  rationale: Thể hoàn thành bị động được chuyển bằng “đã bị,” diễn tả sự phân chia như một việc đã xảy ra với kết quả còn hiện hữu; “phân chia” giữ trực tiếp hình ảnh Phao-lô dùng để quở trách sự bè phái.
- source_word: ὁ Χριστός
  choice: Đấng Mê-si-a
  rationale: Mạo từ cùng danh hiệu Χριστός làm nổi bật nghĩa tước hiệu; “Đấng Mê-si-a” chuyển tải nghĩa “Đấng được xức dầu,” còn cách gọi truyền thống “Đấng Ki-tô” được ghi ở chú thích.
- source_word: μὴ
  choice: có phải … không?
  rationale: Cấu trúc nghi vấn này trong tiếng Việt tự nhiên biểu thị câu hỏi tu từ chờ đợi câu trả lời phủ định, không cần thêm lời giải nghĩa như “chắc chắn là không.”
- source_word: ἐσταυρώθη
  choice: đã chịu đóng đinh vào thập tự giá
  rationale: Cách diễn đạt hiện đại, rõ nghĩa, giữ thể bị động của động từ Hy Lạp.
- source_word: ὑπὲρ ὑμῶν
  choice: vì anh chị em
  rationale: “Vì” diễn đạt tự nhiên việc hành động được thực hiện cho lợi ích hoặc thay mặt người khác mà không buộc câu văn vào một cách giải thích thần học hẹp hơn.
- source_word: ἐβαπτίσθητε
  choice: anh chị em đã được báp-têm
  rationale: Giữ thể bị động và hướng câu hỏi trực tiếp đến cộng đồng; “anh chị em” là cách xưng hô số nhiều, bao gồm cả nam lẫn nữ.
- source_word: εἰς τὸ ὄνομα
  choice: vào danh
  rationale: “Vào” phản ánh hướng nghĩa của εἰς và giữ khả năng hàm ý bước vào mối liên hệ hoặc sự quy thuộc, thay vì đồng nhất ngay với công thức “nhân danh.”
theological_decisions:
- issue: Cách dịch Χριστός trong câu hỏi tu từ của Phao-lô
  choice: Đấng Mê-si-a
  alternative: Đấng Ki-tô
  rationale: Có mạo từ và chức năng tước hiệu trong ngữ cảnh này; bản dịch chính nêu nghĩa tước hiệu, đồng thời chú thích giữ cách gọi quen thuộc trong truyền thống Việt ngữ.
- issue: Sắc thái của εἰς τὸ ὄνομα trong phép báp-têm
  choice: vào danh Phao-lô
  alternative: nhân danh Phao-lô
  rationale: “Vào danh” giữ nét hướng đến, kết hợp hay quy thuộc của εἰς mà không giải quyết thay cho độc giả; “nhân danh” tự nhiên hơn nhưng có thể được hiểu chủ yếu như công thức hoặc thẩm quyền thực hiện nghi lễ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và trực tiếp. Ba câu hỏi tu từ được giữ nguyên để truyền tải sức quở trách. “Báp-têm” được dùng vì ngắn gọn và quen thuộc trong ngữ cảnh Kinh Thánh; “anh chị em” biểu thị rõ số nhiều và bao gồm toàn thể cộng đồng.
