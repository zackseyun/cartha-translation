revisions:
- from: Đấng Mê-si-a đã bị phân chia sao? Có phải Phao-lô đã chịu đóng đinh vào thập tự giá vì anh chị em không? Hay anh chị em đã được báp-têm vào danh Phao-lô sao?[a][b]
  to: Đấng Mê-si-a đã bị phân chia sao? Có phải Phao-lô đã bị đóng đinh vì anh chị em không? Hay anh chị em đã được báp-têm nhân danh Phao-lô sao?[a][b]
  rationale: Bản sửa thay cụm diễn đạt nặng và có phần mở rộng ở câu thứ hai bằng bị động trực tiếp, đồng thời dùng kết hợp từ Việt ngữ tự nhiên “báp-têm nhân danh” ở câu thứ ba. Chú thích b giữ phương án “vào danh” để người đọc thấy cách dịch sát hơn của εἰς τὸ ὄνομα, không áp đặt một giải thích thần học về sắc thái quy thuộc hay thẩm quyền.
