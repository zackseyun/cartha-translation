  text: ἵνα μή τις εἴπῃ ὅτι εἰς τὸ ἐμὸν ὄνομα ⸀ἐβαπτίσθητε·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/015.yaml
  text: so that no one may say that you were baptized into my name[a].
translation:
  language: vi
  text: để không ai nói rằng anh chị em đã được báp-têm vào danh tôi[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “nhân danh tôi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: để
  rationale: Diễn đạt tự nhiên chức năng chỉ mục đích hoặc kết quả của mệnh đề mà không xác định quá mức sắc thái giữa hai ý này.
- source_word: μή τις
  choice: không ai
  rationale: Cách diễn đạt rõ ràng, tự nhiên trong tiếng Việt cho chủ thể bất định bị phủ định.
- source_word: εἴπῃ
  choice: nói
  rationale: Sau «để không ai», tiếng Việt không cần đánh dấu riêng thức giả định; cấu trúc vẫn giữ được ý hướng đến một phát biểu có thể xảy ra.
- source_word: εἰς
  choice: vào
  rationale: Giữ nghĩa hướng đích cơ bản của giới từ và sắc thái liên kết trong công thức báp-têm, thay vì làm phẳng ngay thành «nhân danh».
- source_word: τὸ ἐμὸν ὄνομα
  choice: danh tôi
  rationale: «Danh» là cách dùng trang trọng, dễ hiểu và phù hợp ngữ cảnh nói về báp-têm; đại từ sở hữu được diễn đạt tự nhiên bằng «tôi» đặt sau danh từ.
- source_word: ἐβαπτίσθητε
  choice: anh chị em đã được báp-têm
  rationale: Giữ thể bị động và đối tượng số nhiều; «báp-têm» là thuật ngữ quen thuộc, không tự quy định phương thức thực hành.
theological_decisions:
- issue: Cách dịch εἰς τὸ ἐμὸν ὄνομα trong ngữ cảnh báp-têm
  choice: vào danh tôi
  alternative: nhân danh tôi
  rationale: «Vào» phản ánh trực tiếp εἰς và giữ sắc thái về sự quy thuộc hoặc đồng nhất liên hệ với một danh mà không giải thích thay cho bản văn. «Nhân danh tôi» tự nhiên và khả dĩ trong tiếng Việt nhưng có thể nhấn mạnh thẩm quyền hoặc tư cách hành động, nên được giữ ở chú thích.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Dùng «anh chị em» để biểu đạt ngôi thứ hai số nhiều bao gồm cộng đồng; giữ «báp-têm» nhằm tránh áp đặt một phương thức nghi lễ cụ thể.
