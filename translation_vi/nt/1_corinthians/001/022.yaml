  terminology: «Người Do Thái», «người Hy Lạp», «dấu lạ», và «sự khôn ngoan» đều phù hợp với thuật ngữ Kinh Thánh tiếng Việt và giữ được khung văn hóa cụ thể của Ἕλληνες. Chú thích nên trình bày «dấu hiệu» như phương án sát nghĩa từ vựng, đồng thời ghi nhận sắc thái kỳ diệu do văn cảnh.
