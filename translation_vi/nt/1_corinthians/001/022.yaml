  text: ἐπειδὴ καὶ Ἰουδαῖοι ⸀σημεῖα αἰτοῦσιν καὶ Ἕλληνες σοφίαν ζητοῦσιν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/022.yaml
  text: For Jews ask for signs[c][b][a], and Greeks seek wisdom.
translation:
  language: vi
  text: Vì người Do Thái xin các dấu lạ[a], còn người Hy Lạp tìm kiếm sự khôn ngoan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Dấu lạ” cũng có thể dịch là “dấu hiệu”; trong văn cảnh, từ này có thể hàm ý những dấu hiệu kỳ diệu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπειδή
  choice: Vì
  rationale: Liên từ này nêu lý do cho lập luận trong văn cảnh; “Vì” tự nhiên trong tiếng Việt và giữ rõ sắc thái nguyên nhân.
- source_word: Ἰουδαῖοι
  choice: người Do Thái
  rationale: Trong câu này, từ ngữ chỉ cộng đồng Do Thái, được đặt tương phản với người Hy Lạp như hai nhóm văn hóa-tôn giáo.
- source_word: σημεῖα
  choice: các dấu lạ
  rationale: “Dấu lạ” giữ ý nghĩa dấu hiệu mang tính siêu nhiên trong văn cảnh Kinh Thánh mà không giải thích quá mức thành một loại phép lạ cụ thể.
- source_word: αἰτοῦσιν
  choice: đòi hỏi
  rationale: Trong mạch lập luận, động từ diễn tả việc muốn có dấu lạ làm cơ sở xác nhận; “đòi hỏi” truyền đạt sức nặng tu từ tốt hơn “xin”, dù không nhất thiết hàm ý cưỡng ép.
- source_word: Ἕλληνες
  choice: người Hy Lạp
  rationale: Cách dịch này bảo toàn khung văn hóa Hy Lạp cụ thể của nguyên văn, nhất là khi đi liền với việc tìm kiếm sự khôn ngoan, thay vì mở rộng thành toàn thể dân ngoại.
- source_word: σοφίαν
  choice: sự khôn ngoan
  rationale: Đây là từ tương đương trực tiếp, giữ được phạm vi ý nghĩa rộng của từ Hy Lạp và không thu hẹp nó chỉ còn triết học.
- source_word: ζητοῦσιν
  choice: tìm kiếm
  rationale: Cách diễn đạt tự nhiên, sát nghĩa và giữ được sắc thái hành động đang tiếp diễn của thì hiện tại.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ cấu trúc đối xứng giữa người Do Thái và người Hy Lạp; dùng “còn” để thể hiện sự tương phản song song. Dấu phẩy được dùng thay cho việc lặp lại liên từ Hy Lạp καί một cách máy móc.
