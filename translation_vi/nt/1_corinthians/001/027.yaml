  to: Nhưng Đức Chúa Trời đã chọn những điều dại dột của thế gian[a] để làm cho những người khôn ngoan phải hổ thẹn[b], và Đức Chúa Trời đã chọn những điều yếu đuối của thế gian[c] để làm cho những điều mạnh mẽ phải hổ thẹn.
