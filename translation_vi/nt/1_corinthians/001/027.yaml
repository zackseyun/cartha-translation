reference: 1 Corinthians 1:27
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀλλὰ τὰ μωρὰ τοῦ κόσμου ἐξελέξατο ὁ θεός, ἵνα ⸂καταισχύνῃ τοὺς σοφούς⸃, καὶ τὰ ἀσθενῆ τοῦ κόσμου ἐξελέξατο ὁ θεός, ἵνα καταισχύνῃ τὰ ἰσχυρά,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/027.yaml
  text: But God chose the foolish things of the world so that he might shame the wise[c][b][a], and God chose the weak things of the world so that he might shame the strong.
translation:
  language: vi
  text: Nhưng Đức Chúa Trời đã chọn những điều dại dột của thế gian[a] để làm cho những người khôn ngoan phải hổ thẹn[b], và Đức Chúa Trời đã chọn những điều yếu đuối của thế gian[c] để làm cho những điều mạnh mẽ phải hổ thẹn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “những gì dại dột trong thế gian”; tiếng Hy Lạp dùng một tính từ trung tính số nhiều như danh từ.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “làm cho ... bị mất mặt” hoặc “làm nhục”.'
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “những gì yếu đuối trong thế gian”; ở đây tiếng Hy Lạp cũng dùng một tính từ trung tính số nhiều như danh từ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Nhưng
  rationale: Diễn tả sự tương phản mạnh với ý trước đó bằng liên từ tự nhiên và trang trọng trong tiếng Việt.
- source_word: τὰ μωρὰ τοῦ κόσμου
  choice: những gì thế gian cho là dại dột
  rationale: Tính từ trung tính số nhiều được dùng như danh từ; cách dịch này giữ phạm vi quy chiếu rộng, không giới hạn vào người, đồng thời diễn đạt tự nhiên góc nhìn của thế gian trong tiếng Việt.
- source_word: ἐξελέξατο
  choice: đã chọn
  rationale: Diễn đạt rõ hành động lựa chọn có chủ ý của Đức Chúa Trời và phản ánh thể aorist trong mạch văn.
- source_word: ἵνα καταισχύνῃ
  choice: để làm cho ... phải hổ thẹn
  rationale: “Để” giữ lực chỉ mục đích của ἵνα; cách diễn đạt này chuyển tải sắc thái khiến đối tượng bị hổ thẹn của καταισχύνω.
- source_word: τοὺς σοφούς
  choice: những người khôn ngoan
  rationale: Tính từ giống đực số nhiều dùng như danh từ chỉ người, nên được nói rõ là “những người” trong tiếng Việt.
- source_word: τὰ ἀσθενῆ τοῦ κόσμου
  choice: những gì thế gian cho là yếu đuối
  rationale: Giữ tính trung tính và phạm vi rộng của cấu trúc Hy Lạp, song vẫn tự nhiên và dễ hiểu.
- source_word: τὰ ἰσχυρά
  choice: những gì mạnh mẽ
  rationale: Giữ dạng trung tính số nhiều và sự đối xứng với “những gì ... yếu đuối”, không tự ý thu hẹp đối tượng thành người.
theological_decisions:
- issue: Phạm vi của các tính từ trung tính số nhiều τὰ μωρά, τὰ ἀσθενῆ và τὰ ἰσχυρά
  choice: Dịch là “những gì...” để không giới hạn vào người hay vật.
  alternative: Dịch là “những người dại dột/yếu đuối/mạnh mẽ”.
  rationale: Nguyên văn dùng dạng trung tính số nhiều, trong khi τοὺς σοφούς rõ ràng là giống đực chỉ người. Bản dịch giữ sự khác biệt ngữ pháp và tính mơ hồ có chủ ý.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cụm “thế gian cho là” làm rõ góc nhìn hàm chứa trong thành ngữ Hy Lạp mà không biến nó thành một khẳng định tuyệt đối rằng chính các đối tượng ấy vốn dại dột hay yếu đuối. Các vế lặp lại “Đức Chúa Trời đã chọn” nhằm giữ nhịp điệu và sự nhấn mạnh của nguyên văn.
