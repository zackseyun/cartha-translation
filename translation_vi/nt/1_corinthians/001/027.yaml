  terminology: “Đức Chúa Trời,” “đã chọn,” “khôn ngoan,” “yếu đuối,” và “hổ thẹn” nhất quán, dễ hiểu, và không áp đặt cách hiểu hệ phái. Các chú thích được điều chỉnh để không lặp lại chính cách dịch chính như một phương án thay thế.
