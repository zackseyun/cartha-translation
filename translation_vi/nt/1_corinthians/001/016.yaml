base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/016.yaml
  text: I also baptized the household of Stephanas[a]; beyond that[b], I do not know if I baptized anyone else.
translation:
  language: vi
  text: Tôi cũng đã làm phép báp-têm cho cả nhà Sê-pha-na[a]. Ngoài những người ấy ra, tôi không biết mình có làm phép báp-têm cho ai khác nữa hay không.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “gia hộ của Sê-pha-na.” Từ Hy Lạp có thể chỉ toàn thể những người thuộc nhà ấy, chứ không chỉ một tòa nhà.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐβάπτισα
  choice: đã làm phép báp-têm cho
  rationale: Động từ chỉ việc cử hành phép báp-têm; cách dịch này quen thuộc, rõ nghĩa trong tiếng Việt và không quy định riêng phương thức thực hiện.
- source_word: δὲ καὶ
  choice: cũng ... cả
  rationale: Hai từ nối cùng bổ sung gia đình Sê-pha-na vào danh sách vừa nêu; cấu trúc tiếng Việt này truyền đạt tự nhiên sắc thái bổ sung nhẹ.
- source_word: τὸν Στεφανᾶ οἶκον
  choice: cả gia đình Sê-pha-na
  rationale: οἶκος ở đây chỉ đơn vị gia hộ gồm những người thuộc nhà Sê-pha-na, chứ không đơn thuần là tòa nhà; “gia đình” là cách diễn đạt phổ thông, còn chú thích giữ nghĩa rộng hơn của “gia hộ”.
- source_word: λοιπὸν
  choice: Ngoài ra
  rationale: Từ này chuyển sang phần còn lại ngoài trường hợp vừa nhắc đến; “Ngoài ra” ngắn gọn và tự nhiên trong mạch hồi tưởng.
- source_word: οὐκ οἶδα
  choice: tôi không biết
  rationale: Giữ sát phát biểu trực tiếp về việc không biết, thay vì diễn giải theo ngữ cảnh thành “không nhớ”.
- source_word: εἴ τινα ἄλλον ἐβάπτισα
  choice: mình có làm phép báp-têm cho ai khác nữa hay không
  rationale: Cấu trúc “có ... hay không” diễn đạt tự nhiên mệnh đề nghi vấn gián tiếp và giữ sự bất định của εἴ.
theological_decisions:
- issue: Phạm vi của οἶκος trong việc cả nhà nhận phép báp-têm
  choice: Không xác định thành phần hay độ tuổi của những người thuộc gia hộ
  alternative: Diễn giải “gia đình” là chỉ gồm những người có khả năng tự tuyên xưng đức tin, hoặc khẳng định có trẻ nhỏ
  rationale: Câu Hy Lạp chỉ nói đến οἶκος của Sê-pha-na, không nêu thành phần cụ thể; bản dịch không nên dùng câu này để giải quyết một tranh luận giáo phái về đối tượng nhận phép báp-têm.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “làm phép báp-têm cho” để diễn đạt hành động rõ ràng; tên riêng được phiên âm theo lối quen dùng trong Kinh Thánh tiếng Việt. Đại từ “mình” trong mệnh đề phụ giúp câu tự nhiên mà vẫn quy chiếu rõ về Phao-lô.
