  to: Tôi cũng đã làm phép báp-têm cho cả nhà Sê-pha-na[a]. Ngoài những người ấy ra, tôi không biết mình có làm phép báp-têm cho ai khác nữa hay không.
  rationale: Thay “gia đình” bằng “cả nhà” để bảo toàn phạm vi xã hội rộng của οἶκος mà không đưa vào kết luận về thành phần hoặc độ tuổi của người trong gia hộ. Điều chỉnh “Ngoài ra” thành “Ngoài những người ấy ra” để phản ánh rõ hơn λοιπὸν. Không cần chú thích riêng cho mệnh đề “có ... hay không”, vì cấu trúc tiếng Việt đã diễn đạt trực tiếp và tự nhiên sắc thái bất định của εἴ.
