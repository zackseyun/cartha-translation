id: 1CO.1.25
reference: 1 Corinthians 1:25
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὅτι τὸ μωρὸν τοῦ θεοῦ σοφώτερον τῶν ἀνθρώπων ἐστίν, καὶ τὸ ἀσθενὲς τοῦ θεοῦ ἰσχυρότερον τῶν ⸀ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/025.yaml
  text: Because the foolishness of God is wiser than people, and the weakness of God is stronger than people.
translation:
  language: vi
  text: Vì sự ngu dại của Đức Chúa Trời khôn ngoan hơn loài người, và sự yếu đuối của Đức Chúa Trời mạnh mẽ hơn loài người.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι
  choice: Vì
  rationale: Nối câu này với lập luận ở câu trước bằng quan hệ nguyên nhân, phù hợp ngữ cảnh và tự nhiên trong tiếng Việt.
- source_word: τὸ μωρὸν τοῦ θεοῦ
  choice: sự ngu dại của Đức Chúa Trời
  rationale: Giữ nguyên nghịch lý tu từ của nguyên bản, không diễn giải thành điều 'bị xem là' ngu dại, dù đó là hàm ý trong ngữ cảnh.
- source_word: σοφώτερον τῶν ἀνθρώπων
  choice: khôn ngoan hơn loài người
  rationale: Dùng 'loài người' để diễn đạt ἀνθρώπων theo nghĩa bao quát toàn thể con người và giữ cấu trúc so sánh cô đọng.
- source_word: τὸ ἀσθενὲς τοῦ θεοῦ
  choice: sự yếu đuối của Đức Chúa Trời
  rationale: Bảo toàn cấu trúc song song và sức căng thần học của cách nói nghịch lý trong tiếng Hy Lạp.
- source_word: ἰσχυρότερον τῶν ἀνθρώπων
  choice: mạnh mẽ hơn loài người
  rationale: Diễn đạt phép so sánh rõ ràng, tự nhiên, đồng thời duy trì thế đối xứng với 'khôn ngoan hơn loài người'.
theological_decisions:
- issue: Cách hiểu các cụm 'sự ngu dại của Đức Chúa Trời' và 'sự yếu đuối của Đức Chúa Trời'
  choice: Giữ cách nói trực tiếp và nghịch lý của nguyên bản.
  alternative: Những gì thuộc về Đức Chúa Trời mà người ta cho là ngu dại/yếu đuối.
  rationale: Bản dịch không nên âm thầm giải quyết nghịch lý bằng cách thêm chủ thể đánh giá không có mặt trực tiếp trong câu; ngữ cảnh giúp độc giả hiểu tính tu từ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Hai vế song song được giữ cân đối; 'Đức Chúa Trời' phù hợp cách gọi phổ biến trong truyền thống Kinh Thánh tiếng Việt, còn 'loài người' tránh sắc thái chỉ nam giới.
