  to: Vì Đấng Mê-si đã sai tôi không phải để làm phép báp-têm, nhưng để công bố tin mừng—không dùng lời lẽ khôn ngoan[a]—để thập tự giá của Đấng Mê-si không bị làm cho mất hiệu lực[b].
