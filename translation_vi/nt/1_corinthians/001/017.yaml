id: 1CO.1.17
reference: 1 Corinthians 1:17
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οὐ γὰρ ἀπέστειλέν με Χριστὸς βαπτίζειν ἀλλὰ εὐαγγελίζεσθαι, οὐκ ἐν σοφίᾳ λόγου, ἵνα μὴ κενωθῇ ὁ σταυρὸς τοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/017.yaml
  text: For Messiah did not send me to baptize[a], but to proclaim the good news—not in wisdom of speech[c][b], so that the cross of Messiah might not be emptied.
translation:
  language: vi
  text: Vì Đấng Mê-si đã sai tôi không phải để làm phép báp-têm, nhưng để công bố tin mừng—không dùng lời lẽ khôn ngoan[a]—để thập tự giá của Đấng Mê-si không bị làm cho mất hiệu lực[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “không bằng tài hùng biện khôn khéo”; sát chữ: “không trong sự khôn ngoan của lời nói.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “không trở nên trống rỗng” hoặc “không bị tước mất hiệu lực.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Χριστὸς / τοῦ Χριστοῦ
  choice: Đấng Mê-si / của Đấng Mê-si
  rationale: Dịch Χριστός như một tước hiệu có ý nghĩa, đồng thời dùng cách gọi tự nhiên và trang trọng trong tiếng Việt; giữ nhất quán ở cả hai lần xuất hiện.
- source_word: βαπτίζειν
  choice: làm phép báp-têm
  rationale: Thuật ngữ đã quen thuộc trong tiếng Việt Cơ Đốc, diễn đạt chính xác hành động trong ngữ cảnh mà không thu hẹp nghĩa thành một phương thức nghi lễ riêng.
- source_word: εὐαγγελίζεσθαι
  choice: công bố tin mừng
  rationale: Diễn đạt rõ ý loan báo tin mừng, tự nhiên với độc giả hiện đại và giữ sắc thái chủ động của động từ Hy Lạp.
- source_word: σοφίᾳ λόγου
  choice: bằng sự khôn ngoan trong lời nói
  rationale: Giữ gần cấu trúc Hy Lạp, để ngỏ sắc thái giữa tài hùng biện, cách lập luận khôn khéo và sự khôn ngoan được biểu hiện qua lời nói.
- source_word: κενωθῇ
  choice: bị làm cho ra vô hiệu
  rationale: Trong ngữ cảnh, động từ mang nghĩa khiến điều gì mất hiệu lực hoặc trở nên rỗng không; cách dịch này tự nhiên hơn lối dịch từng chữ nhưng không thêm rõ 'quyền năng' vốn không hiện diện trong nguyên văn.
- source_word: σταυρὸς
  choice: thập tự giá
  rationale: Cách gọi chuẩn, trang trọng và dễ hiểu trong tiếng Việt đối với σταυρός trong văn mạch Phao-lô.
theological_decisions:
- issue: Dịch Χριστός như tước hiệu hay giữ dạng truyền thống 'Christ/Đấng Christ'.
  choice: Đấng Mê-si
  alternative: Đấng Christ
  rationale: Χριστός là tước hiệu tương ứng với 'Đấng được xức dầu'; 'Đấng Mê-si' giúp người đọc nhận ra ý nghĩa tước hiệu thay vì coi đây chỉ như một tên riêng.
- issue: Ý nghĩa của κενωθῇ đối với thập tự giá.
  choice: không bị làm cho ra vô hiệu
  alternative: không bị làm cho trống rỗng / không bị tước mất quyền năng
  rationale: Giữ thể bị động và hệ quả thần học mạnh của câu mà không đưa cụm 'quyền năng' vào chính văn, vì nguyên bản không nói thẳng điều đó.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đấng Mê-si” như tước hiệu; dùng “làm phép báp-têm” và “thập tự giá” là các thuật ngữ Cơ Đốc quen thuộc. Dấu gạch ngang làm rõ cụm bổ nghĩa mà vẫn giữ mạch lập luận của câu Hy Lạp.
