  text: ἵνα καθὼς γέγραπται· Ὁ καυχώμενος ἐν κυρίῳ καυχάσθω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/031.yaml
  text: 'so that[a], just as it is written: “The one who boasts must boast in the Lord.”'
translation:
  language: vi
  text: 'Để đúng như lời đã chép: “Ai khoe mình thì hãy khoe mình trong Chúa.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἵνα
  choice: để
  rationale: Diễn tả mục đích hoặc kết quả nối tiếp ý của câu trước; cách nói ngắn gọn, tự nhiên trong tiếng Việt.
- source_word: καθὼς γέγραπται
  choice: như có lời chép rằng
  rationale: Công thức dẫn Kinh Thánh quen thuộc, tự nhiên, đồng thời phản ánh καθὼς và thể hoàn thành bị động γέγραπται.
- source_word: Ὁ καυχώμενος
  choice: Ai khoe mình
  rationale: Chuyển phân từ có mạo từ thành cấu trúc phiếm chỉ tự nhiên trong tiếng Việt, không giới hạn giới tính; καυχάομαι ở đây chỉ việc tự hào hoặc khoe khoang.
- source_word: ἐν κυρίῳ
  choice: trong Chúa
  rationale: Giữ giới từ ἐν và cách gọi κύριος; cụm này bảo tồn độ mở giữa phạm vi, nền tảng và đối tượng của sự khoe mình.
- source_word: καυχάσθω
  choice: hãy khoe mình
  rationale: Thể mệnh lệnh ngôi ba được diễn đạt tự nhiên bằng “hãy”, giữ nguyên sức khuyên truyền mà không biến thành lời mô tả hay nghĩa vụ theo lối diễn giải.
theological_decisions:
- issue: Sức mệnh lệnh của καυχάσθω
  choice: hãy khoe mình
  alternative: phải khoe mình
  rationale: “Hãy” trực tiếp phản ánh thể mệnh lệnh và tự nhiên trong lời trích dẫn Kinh Thánh; “phải” có thể nhấn mạnh nghĩa vụ mạnh hơn sắc thái hình thức của nguyên văn.
- issue: Ý nghĩa của ἐν κυρίῳ
  choice: trong Chúa
  alternative: về Chúa
  rationale: Giữ cách diễn đạt của Hy Lạp và sự căng nghĩa thần học về Chúa là đối tượng, nền tảng hoặc phạm vi của sự khoe mình, thay vì âm thầm thu hẹp thành chỉ “khoe về Chúa”.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Giữ công thức dẫn Kinh Thánh quen thuộc và cấu trúc mệnh lệnh súc tích; không thêm chú thích vì bản dịch chính đã thể hiện trực tiếp phương án từ vựng tự nhiên nhất.
