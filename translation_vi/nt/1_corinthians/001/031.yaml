  terminology: “Chúa” là cách chuyển phù hợp, thông dụng và nhất quán cho κυρίῳ trong ngữ cảnh Phao-lô. Lặp lại “khoe mình” phản ánh sự lặp lại có chủ ý của cùng gốc καυχάομαι trong tiếng Hy Lạp; không cần thay bằng những từ khác nhau. Không cần chú thích vì không có vấn đề văn bản hay nghĩa từ vựng nào đòi hỏi neo chú thích trong bản tiếng Việt.
