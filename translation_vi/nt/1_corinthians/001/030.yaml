id: 1CO.1.30
reference: 1 Corinthians 1:30
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐξ αὐτοῦ δὲ ὑμεῖς ἐστε ἐν Χριστῷ Ἰησοῦ, ὃς ἐγενήθη ⸂σοφία ἡμῖν⸃ ἀπὸ θεοῦ, δικαιοσύνη τε καὶ ἁγιασμὸς καὶ ἀπολύτρωσις,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/030.yaml
  text: And it is from him that you are in Messiah Jesus[a], who became for us wisdom from God, and righteousness and sanctification and redemption,
translation:
  language: vi
  text: Nhưng chính do Đức Chúa Trời mà anh em ở trong Đấng Mê-si-a Giê-su, Đấng đã trở nên cho chúng ta sự khôn ngoan từ Đức Chúa Trời, cùng sự công chính[a], sự thánh hóa và sự cứu chuộc.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “sự công lý.”'
    reason: Giữ lại nghĩa từ vựng khả hữu của δικαιοσύνη mà không thay thế cách hiểu phù hợp nhất với mạch văn chính.
lexical_decisions:
- source_word: ἐξ αὐτοῦ
  choice: chính nhờ Ngài
  rationale: Diễn đạt Đức Chúa Trời là nguồn gốc và căn nguyên của địa vị người tin ở trong Đấng Mê-si-a, đồng thời giữ câu văn tự nhiên trong tiếng Việt.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: ở trong Đấng Mê-si-a Giê-su
  rationale: Giữ nguyên cách nói đặc trưng của Phao-lô về mối liên hệ với Đấng Mê-si-a, không diễn giải quá mức thành ‘hiệp nhất với’.
- source_word: ἐγενήθη
  choice: đã trở nên
  rationale: Phản ánh trực tiếp động từ γίνομαι và điều Đấng Mê-si-a trở nên cho các tín hữu theo hành động của Đức Chúa Trời.
- source_word: σοφία
  choice: sự khôn ngoan
  rationale: Phù hợp với mạch văn chương 1, nơi sự khôn ngoan của Đức Chúa Trời tương phản với sự khôn ngoan của thế gian.
- source_word: ἀπὸ θεοῦ
  choice: từ Đức Chúa Trời
  rationale: Giữ ý nguồn gốc của giới từ ἀπό mà không thêm ý ‘được ban cho’ vốn không được nói rõ trong nguyên văn.
- source_word: δικαιοσύνη
  choice: sự công chính
  rationale: Là cách dịch tự nhiên và quen thuộc trong mạch cứu chuộc của Phao-lô; khả năng mang nghĩa ‘công lý’ được giữ trong chú thích.
- source_word: ἁγιασμός
  choice: sự thánh hóa
  rationale: Diễn đạt tiến trình hoặc tình trạng được làm nên thánh mà không thu hẹp thành phẩm chất đạo đức đơn thuần.
- source_word: ἀπολύτρωσις
  choice: sự cứu chuộc
  rationale: Giữ sắc thái giải thoát gắn với giá chuộc và là thuật ngữ thần học rõ ràng trong tiếng Việt hiện đại.
theological_decisions:
- issue: Quan hệ giữa ‘sự khôn ngoan từ Đức Chúa Trời’ và ba danh từ tiếp theo
  choice: Giữ chuỗi danh từ nối tiếp bằng dấu phẩy và liên từ, để ba danh từ sau có thể được hiểu là triển khai ý nghĩa của sự khôn ngoan hoặc là các thành phần song song.
  alternative: Dùng dấu gạch ngang hoặc thêm ‘tức là’ để xác định ba danh từ sau là phần giải thích cho ‘sự khôn ngoan’.
  rationale: Cú pháp Hy Lạp cho phép nhiều cách nhận định về quan hệ giữa các thành phần; bản dịch không nên loại bỏ sự căng thẳng này bằng một lời giải thích không có trong nguyên văn.
- issue: Sắc thái của ἐξ αὐτοῦ đối với việc người tin ở trong Đấng Mê-si-a
  choice: Dịch ‘chính nhờ Ngài’ để nêu Đức Chúa Trời là căn nguyên của địa vị ấy.
  alternative: ‘từ Ngài’ hoặc ‘bởi Ngài’.
  rationale: ‘Từ Ngài’ sát hình thức hơn nhưng gượng trong tiếng Việt, còn ‘bởi Ngài’ dễ bị hiểu thuần túy là tác nhân; ‘nhờ Ngài’ truyền đạt tự nhiên cả nguồn gốc lẫn căn nguyên trong ngữ cảnh.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Dùng ‘anh em’ cho số nhiều ὑμεῖς theo lối xưng hô thư tín của Phao-lô; dùng ‘Đấng Mê-si-a’ để giữ chức danh của Χριστός. Phép lặp ‘sự’ giúp bốn danh từ trừu tượng rõ ràng và cân xứng trong tiếng Việt.
