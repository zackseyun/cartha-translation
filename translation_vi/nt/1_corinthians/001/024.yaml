id: 1CO.1.24
reference: 1 Corinthians 1:24
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: αὐτοῖς δὲ τοῖς κλητοῖς, Ἰουδαίοις τε καὶ Ἕλλησιν, Χριστὸν θεοῦ δύναμιν καὶ θεοῦ σοφίαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/024.yaml
  text: But to those who are called[a], both Jews and Greeks, Messiah is the power of God and the wisdom of God.
translation:
  language: vi
  text: Nhưng đối với những người được gọi, cả người Do Thái lẫn người Hy Lạp, Đấng Mê-si-a[a] là quyền năng của Đức Chúa Trời và sự khôn ngoan của Đức Chúa Trời.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: Đấng Christ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κλητοῖς
  choice: những người được gọi
  rationale: Tính từ được dùng như danh từ để chỉ nhóm người được nhận diện bởi sự kêu gọi. Cách dịch này giữ sắc thái động của từ Hy Lạp mà không thêm rõ chủ thể vốn không được nêu trực tiếp.
- source_word: Ἰουδαίοις
  choice: người Do Thái
  rationale: Trong cặp đối chiếu với người Hy Lạp ở thư Phao-lô, từ này chủ yếu mang nghĩa sắc tộc–tôn giáo; “người Do Thái” là cách diễn đạt rõ ràng và quen thuộc.
- source_word: Ἕλλησιν
  choice: người Hy Lạp
  rationale: Dịch sát danh xưng trong nguyên văn, thay vì mở rộng theo lối diễn giải thành “dân ngoại”.
- source_word: Χριστόν
  choice: Đấng Mê-si-a
  rationale: Ở đây Χριστός mang chức năng tước hiệu, nên dịch nghĩa là “Đấng Mê-si-a”; chú thích giữ cách gọi truyền thống “Đấng Christ” như một phương án từ vựng.
- source_word: θεοῦ δύναμιν
  choice: quyền năng của Đức Chúa Trời
  rationale: Giữ cấu trúc sở thuộc và sắc thái trang trọng của cụm Hy Lạp, đồng thời tự nhiên trong văn phong Kinh Thánh tiếng Việt.
- source_word: θεοῦ σοφίαν
  choice: sự khôn ngoan của Đức Chúa Trời
  rationale: Giữ sự lặp lại có chủ ý của θεοῦ và cấu trúc song song với “quyền năng của Đức Chúa Trời”.
- source_word: implicit copula / verbless predicate relation
  choice: Đấng Mê-si-a là quyền năng của Đức Chúa Trời và sự khôn ngoan của Đức Chúa Trời
  rationale: Nguyên văn Hy Lạp không có hệ từ và tiếp nối cú pháp câu trước; thêm “là” giúp câu tiếng Việt đứng độc lập, đồng thời thể hiện đúng quan hệ vị ngữ.
theological_decisions:
- issue: Cách dịch Χριστός như một tước hiệu về Đấng được xức dầu
  choice: Đấng Mê-si-a
  alternative: Đấng Christ
  rationale: “Đấng Mê-si-a” chuyển tải nội dung của tước hiệu Hy Lạp thay vì chỉ phiên âm, không bổ sung diễn giải giáo phái; phương án truyền thống được ghi ở chú thích.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Giữ phép song song “quyền năng của Đức Chúa Trời” và “sự khôn ngoan của Đức Chúa Trời”, cũng như phạm vi bao quát của cặp “người Do Thái… người Hy Lạp”.
