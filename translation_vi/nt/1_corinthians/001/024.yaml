  source_fidelity: 'Bản dịch chuyển tải đúng cấu trúc và ý nghĩa của câu Hy Lạp: nhóm “những người được gọi,” gồm người Do Thái và người Hy Lạp; với họ, Đấng Mê-si-a là quyền năng và sự khôn ngoan của Đức Chúa Trời. Việc thêm hệ từ “là” là cần thiết, tự nhiên trong tiếng Việt và phù hợp với quan hệ vị ngữ hàm ẩn của nguyên văn.'
