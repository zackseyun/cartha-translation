  terminology: Giữ “ân điển”, “bình an”, “Đức Chúa Trời”, và “Chúa” là phù hợp với văn cảnh Phao-lô và đăng ký trang trọng. Dịch Χριστός là “Đấng Mê-si-a” bảo toàn chức năng danh hiệu; chú thích giữ dạng truyền thống “Christ” như một phương án đọc.
