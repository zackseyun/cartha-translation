base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/003.yaml
  text: Grace to you and peace from God our Father and the Lord Jesus the Messiah[a].
translation:
  language: vi
  text: 'Nguyện ân điển và bình an từ Đức Chúa Trời là Cha chúng ta và Chúa Giê-su, Đấng Mê-si-a, đến với anh chị em.


    [a] Hay: “Chúa Giê-su Christ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “Chúa Giê-su Christ.”'
    reason: Nêu cách gọi truyền thống dùng “Christ” thay cho việc dịch danh hiệu Χριστός là “Đấng Mê-si-a” trong bản chính.
lexical_decisions:
- source_word: χάρις
  choice: ân điển
  rationale: Cách dịch trang trọng và quen thuộc, giữ được cả ý nghĩa về ân huệ lẫn chiều sâu thần học của lời chào Phao-lô.
- source_word: ὑμῖν
  choice: đến với anh chị em
  rationale: Đại từ số nhiều chỉ cộng đồng tín hữu; cách diễn đạt này tự nhiên trong lời chúc bằng tiếng Việt và không giới hạn vào một giới.
- source_word: εἰρήνη
  choice: bình an
  rationale: Giữ được ý nghĩa hòa thuận, yên ổn và âm hưởng giao ước của từ Hy Lạp.
- source_word: ἀπὸ
  choice: từ
  rationale: Diễn đạt trực tiếp nguồn của cả ân điển lẫn bình an.
- source_word: θεοῦ πατρὸς ἡμῶν
  choice: Đức Chúa Trời, Cha chúng ta
  rationale: 'Giữ quan hệ đồng vị của nguyên văn: Đức Chúa Trời chính là Cha của chúng ta, thay vì tạo ra hai danh xưng tách biệt.'
- source_word: κυρίου
  choice: Chúa
  rationale: Danh xưng tự nhiên, trang trọng, giữ được sức nặng của κύριος trong ngữ cảnh.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jêsus, Đấng Mê-si
  rationale: Dịch Χριστός theo nghĩa danh hiệu 'Đấng Mê-si', đồng thời dùng dấu phẩy để câu tiếng Việt thể hiện rõ đây là danh hiệu của Jêsus.
theological_decisions:
- issue: Mối quan hệ về nguồn của ân điển và bình an đối với Đức Chúa Trời là Cha và Chúa Jêsus
  choice: Dùng một giới từ “từ” chi phối cả hai danh xưng được nối bằng “và”.
  alternative: Lặp lại “từ” trước “Chúa Jêsus” hoặc tái cấu trúc câu.
  rationale: Nguyên văn chỉ dùng một ἀπό cho hai đối tượng phối hợp; bản dịch giữ nguyên cấu trúc này mà không giải thích thêm về thần học.
- issue: Cách chuyển dịch Χριστός
  choice: Đấng Mê-si
  alternative: Christ
  rationale: Trong công thức chào này, Χριστός vẫn có thể được nghe như một danh hiệu. Bản chính chuyển nghĩa danh hiệu, còn chú thích giữ cách gọi truyền thống để người đọc nhận biết phương án tương đương.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Cấu trúc “Nguyện … đến với anh chị em” làm rõ tính chất lời chúc vốn được hàm ý trong câu Hy Lạp không có động từ. “Anh chị em” thể hiện số nhiều và tính cộng đồng của ὑμῖν.
