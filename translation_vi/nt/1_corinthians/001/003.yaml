    rationale: Dạng “Giê-su” được dùng rộng rãi trong tiếng Việt hiện đại và tránh gắn bản dịch với một chính tả hệ phái cũ.
  - severity: medium
    issue: “Mê-si” là dạng rút gọn không chuẩn của danh hiệu Messiah trong tiếng Việt hiện đại.
    rationale: “Mê-si-a” là dạng phiên âm đầy đủ, dễ nhận diện và thích hợp hơn trong một bản dịch phổ thông hiện đại.
  - severity: low
    issue: Dấu phẩy trong “Đức Chúa Trời, Cha chúng ta” có thể làm quan hệ đồng vị kém trực tiếp hơn cần thiết.
    rationale: “Đức Chúa Trời là Cha chúng ta” diễn đạt rõ ràng cấu trúc θεοῦ πατρὸς ἡμῶν mà không biến thành hai danh xưng độc lập.
