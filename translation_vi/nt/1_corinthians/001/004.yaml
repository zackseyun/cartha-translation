  source_fidelity: 'Bản dịch chuyển tải đầy đủ các thành phần của nguyên văn: lời cảm tạ hiện tại, tính liên tục của πάντοτε, quan hệ quy chiếu của περὶ ὑμῶν, căn cứ của ἐπὶ τῇ χάριτι, ân điển thuộc về Đức Chúa Trời đã được ban cho người nhận, và cụm ἐν Χριστῷ Ἰησοῦ. “Trong” giữ được độ mở nghĩa của ἐν mà không diễn giải thành phương tiện.'
