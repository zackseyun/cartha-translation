  terminology: “Đức Chúa Trời,” “ân điển,” “anh chị em,” và “Đấng Mê-si-a Giê-su” nhất quán, dễ hiểu trong phạm vi bản dịch, và “Mê-si-a” giữ lực nghĩa danh hiệu của Χριστός theo định hướng dự án. Chú thích b cung cấp lựa chọn thông dụng “Đấng Ki-tô Giê-su” mà không thay thế bản văn chính.
