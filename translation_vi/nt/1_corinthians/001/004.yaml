id: 1CO.1.4
reference: 1 Corinthians 1:4
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Εὐχαριστῶ τῷ θεῷ ⸀μου πάντοτε περὶ ὑμῶν ἐπὶ τῇ χάριτι τοῦ θεοῦ τῇ δοθείσῃ ὑμῖν ἐν Χριστῷ Ἰησοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/004.yaml
  text: I thank my God always for you because of the grace of God given to you in Messiah Jesus[b][a],
translation:
  language: vi
  text: Tôi luôn cảm tạ Đức Chúa Trời của tôi về anh chị em[a], vì ân điển của Đức Chúa Trời đã được ban cho anh chị em trong Đấng Mê-si-a Giê-su[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “liên quan đến anh chị em.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “trong Đấng Ki-tô Giê-su.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὐχαριστῶ
  choice: Tôi cảm tạ
  rationale: Động từ hiện tại diễn tả sự cảm tạ đang tiếp diễn; “cảm tạ” tự nhiên, trang trọng và phù hợp với lời cầu nguyện.
- source_word: τῷ θεῷ μου
  choice: Đức Chúa Trời của tôi
  rationale: Giữ đại từ sở hữu μου và diễn đạt cách tự nhiên trong tiếng Việt sau động từ “cảm tạ”.
- source_word: πάντοτε
  choice: luôn
  rationale: Chuyển tải trực tiếp phạm vi thời gian rộng của trạng từ mà không làm câu nặng nề.
- source_word: περὶ ὑμῶν
  choice: về anh chị em
  rationale: Giữ sắc thái “liên quan đến/về” của περί với sở hữu cách; “anh chị em” thể hiện rõ đại từ số nhiều và phù hợp với cộng đồng tín hữu.
- source_word: ἐπὶ τῇ χάριτι
  choice: vì ân điển
  rationale: ἐπί với tặng cách ở đây nêu căn cứ hoặc nguyên do của lời cảm tạ; “vì” diễn đạt quan hệ ấy tự nhiên.
- source_word: χάριτι
  choice: ân điển
  rationale: “Ân điển” là thuật ngữ tiếng Việt quen thuộc cho χάρις trong văn mạch Phao-lô, chỉ sự ban ơn nhưng không của Đức Chúa Trời.
- source_word: τοῦ θεοῦ
  choice: của Đức Chúa Trời
  rationale: Giữ cấu trúc sở hữu cách, không thu hẹp sắc thái có thể bao gồm cả nguồn gốc lẫn sự thuộc về Đức Chúa Trời.
- source_word: τῇ δοθείσῃ ὑμῖν
  choice: đã được ban cho anh chị em
  rationale: Giữ thể bị động của phân từ aorist và Đức Chúa Trời là tác nhân được hàm ý; “đã” phản ánh hành động ban cho đã xảy ra.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: trong Đấng Mê-si-a Giê-su
  rationale: Giữ giới từ ἐν cùng trật tự danh hiệu–tên riêng của nguyên văn; “Đấng Mê-si-a” làm rõ ý nghĩa danh hiệu của Χριστός.
theological_decisions:
- issue: Sắc thái của ἐν trong ἐν Χριστῷ Ἰησοῦ
  choice: trong Đấng Mê-si-a Giê-su
  alternative: nhờ Đấng Mê-si-a Giê-su
  rationale: Giữ cách nói “trong” để bảo toàn chiều kích liên hiệp, phạm vi hoặc mối liên hệ mà câu Hy Lạp có thể gợi ra, thay vì chỉ xác định phương tiện.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” để biểu đạt đại từ số nhiều chỉ toàn thể cộng đồng; giữ thuật ngữ “ân điển” và cách nói đặc trưng của Phao-lô “trong Đấng Mê-si-a Giê-su” nhằm tránh diễn giải quá mức.
