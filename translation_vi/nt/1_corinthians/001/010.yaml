id: 1CO.1.10
reference: 1 Corinthians 1:10
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Παρακαλῶ δὲ ὑμᾶς, ἀδελφοί, διὰ τοῦ ὀνόματος τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ ἵνα τὸ αὐτὸ λέγητε πάντες, καὶ μὴ ᾖ ἐν ὑμῖν σχίσματα, ἦτε δὲ κατηρτισμένοι ἐν τῷ αὐτῷ νοῒ καὶ ἐν τῇ αὐτῇ γνώμῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/010.yaml
  text: I urge you[a], brothers, by the name of our Lord Jesus the Messiah, that you all say the same thing, and that there be no divisions among you[e][d][c][b], but that you be joined together in the same mind and in the same judgment.
translation:
  language: vi
  text: 'Thưa anh em[a], nhân danh Chúa chúng ta là Đức Chúa Giê-su, Đấng Mê-si-a[b], tôi khẩn thiết khuyên anh em: tất cả anh em hãy nói cùng một điều[c], đừng để có sự chia rẽ giữa anh em[d], nhưng hãy được gắn kết trọn vẹn trong cùng một tâm trí và cùng một nhận định[e].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Anh em” ở đây có thể bao gồm cả anh chị em trong toàn thể cộng đồng tín hữu.
    reason: cultural_note
  - marker: b
    text: Hay “Đấng Christ.” “Mê-si-a” và “Christ” đều có nghĩa là Đấng được xức dầu.
    reason: lexical_alternative
  - marker: c
    text: Hay “hãy đồng lòng với nhau.”
    reason: lexical_alternative
  - marker: d
    text: Hay “đừng có những phe phái giữa anh em” hoặc “đừng có những sự phân rẽ giữa anh em.”
    reason: lexical_alternative
  - marker: e
    text: Hay “cùng một quan điểm” hoặc “cùng một sự xác tín.” “Được gắn kết trọn vẹn” cũng có thể hiểu là “được chỉnh đốn” hoặc “được hàn gắn lại.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Παρακαλῶ
  choice: tôi khuyên
  rationale: Diễn tả lời kêu gọi tha thiết mang tính mục vụ, không làm câu thành một mệnh lệnh khô cứng.
- source_word: ἀδελφοί
  choice: anh em
  rationale: Giữ hình thức giống đực số nhiều của tiếng Hy Lạp; trong ngữ cảnh, cách gọi này hướng đến toàn thể cộng đồng tín hữu, được làm rõ trong chú thích.
- source_word: διὰ τοῦ ὀνόματος
  choice: nhân danh
  rationale: Cách nói tự nhiên trong tiếng Việt, diễn tả lời kêu gọi dựa trên danh và thẩm quyền của Chúa Giê-su.
- source_word: κυρίου
  choice: Chúa
  rationale: Tước hiệu tự nhiên và quen thuộc trong tiếng Việt, thể hiện thẩm quyền của Đức Chúa Giê-su.
- source_word: Χριστοῦ
  choice: Đấng Mê-si-a
  rationale: Chuyển nghĩa tước hiệu Χριστός thay vì chỉ phiên âm theo truyền thống; phương án quen thuộc hơn được ghi ở chú thích.
- source_word: τὸ αὐτὸ λέγητε πάντες
  choice: hãy đồng lòng với nhau
  rationale: Thành ngữ Hy Lạp theo nghĩa đen là 'tất cả cùng nói một điều'; cách dịch này truyền đạt tự nhiên lời kêu gọi cùng chung tiếng nói mà không hàm ý phải giống nhau trong mọi chi tiết.
- source_word: σχίσματα
  choice: sự chia rẽ
  rationale: Từ hiện đại, dễ hiểu, diễn tả những rạn nứt và phe phái trong cộng đồng.
- source_word: κατηρτισμένοι
  choice: hãy hiệp nhất
  rationale: Trong bối cảnh chia rẽ, động từ mang ý được chỉnh đốn, nối kết hay hàn gắn thành một thể; 'hiệp nhất' diễn đạt kết quả ấy tự nhiên trong tiếng Việt.
- source_word: νοῒ
  choice: tâm trí
  rationale: Chỉ cách suy nghĩ hay sự hiểu biết, đồng thời vẫn phân biệt với γνώμη.
- source_word: γνώμῃ
  choice: nhận định
  rationale: Giữ sắc thái phán đoán, quan điểm hay sự xác tín thực tiễn và phân biệt với 'tâm trí'.
theological_decisions:
- issue: Cách dịch tước hiệu Χριστός
  choice: Đấng Mê-si-a
  alternative: Đấng Christ
  rationale: Giữ rõ nghĩa tước hiệu 'Đấng được xức dầu' mà không thay đổi đối tượng được nói đến; cách gọi truyền thống được bảo lưu trong chú thích.
- issue: Phạm vi của cách xưng hô ἀδελφοί
  choice: '''anh em'' trong chính văn, kèm chú thích về nghĩa bao quát'
  alternative: anh chị em
  rationale: Chính văn phản ánh hình thức giống đực của nguyên ngữ, trong khi chú thích cho biết trong ngữ cảnh Phao-lô đang nói với toàn thể hội chúng.
- issue: Mức độ đồng nhất trong τὸ αὐτὸ λέγητε πάντες
  choice: đồng lòng với nhau
  alternative: tất cả hãy nói cùng một điều
  rationale: Cách dịch tránh hiểu lời kêu gọi như đòi hỏi đồng nhất tuyệt đối về lời nói, nhưng vẫn giữ trọng tâm là sự nhất trí và hiệp một giữa các tín hữu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Cấu trúc được sắp xếp tự nhiên theo tiếng Việt, mở đầu bằng lời xưng hô. “Đức Chúa Giê-su” được dùng như cách gọi tôn kính và rõ nghĩa; các thuật ngữ trừu tượng được giữ vừa đủ để bảo toàn sự phân biệt giữa νοῦς và γνώμη.
