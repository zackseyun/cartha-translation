    rationale: Cụm Hy Lạp nói trực tiếp rằng mọi người “hãy nói cùng một điều.” “Đồng lòng” là diễn giải hợp ngữ cảnh nhưng làm mờ hình ảnh và sự nhấn mạnh từ ngữ của nguyên văn; nên giữ trong chính văn, còn có thể giải thích bằng chú thích.
  - severity: medium
    issue: κατηρτισμένοι được dịch là “hãy hiệp nhất.”
    rationale: “Hiệp nhất” diễn đạt mục tiêu chung nhưng không biểu lộ rõ nét nghĩa “được gắn kết/chỉnh đốn cho trọn vẹn” của phân từ hoàn thành bị động. Cách dịch có yếu tố bị động và sự hàn gắn giữ sát nguyên văn hơn.
