id: 1CO.1.20
reference: 1 Corinthians 1:20
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ποῦ σοφός; ποῦ γραμματεύς; ποῦ συζητητὴς τοῦ αἰῶνος τούτου; οὐχὶ ἐμώρανεν ὁ θεὸς τὴν σοφίαν τοῦ ⸀κόσμου;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/020.yaml
  text: Where is the wise man? Where is the scribe? Where is the debater of this age? Has not God made the wisdom of the world foolish?[a][b][c]
translation:
  language: vi
  text: Người khôn ngoan ở đâu? Kinh sư ở đâu? Người tranh biện của thời đại này ở đâu?[a] Chẳng phải Đức Chúa Trời đã làm cho sự khôn ngoan của thế gian trở nên ngu dại sao?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Thời đại này” dịch một từ Hy Lạp khác với từ được dịch là “thế gian” ở phần sau của câu.
    reason: cross_reference
  - marker: b
    text: 'Cũng có thể dịch: “Chẳng phải Đức Chúa Trời đã cho thấy sự khôn ngoan của thế gian là ngu dại sao?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ποῦ
  choice: ở đâu?
  rationale: Giữ hình thức thách vấn tu từ lặp lại của nguyên văn, tự nhiên trong tiếng Việt.
- source_word: σοφός
  choice: người khôn ngoan
  rationale: Danh từ hóa tính từ theo nghĩa đại diện, không cần đánh dấu giống đực vốn không tự nhiên trong tiếng Việt.
- source_word: γραμματεύς
  choice: kinh sư
  rationale: Thuật ngữ quen thuộc trong văn cảnh Kinh Thánh, giữ sắc thái lịch sử cụ thể hơn từ khái quát như ‘học giả’.
- source_word: συζητητής
  choice: người tranh biện
  rationale: Diễn đạt rõ người chuyên tranh luận hoặc biện luận, phù hợp với chuỗi thách vấn tu từ.
- source_word: τοῦ αἰῶνος τούτου
  choice: của thời đại này
  rationale: Phân biệt αἰών (‘thời đại’) với κόσμος (‘thế gian’) ở cuối câu.
- source_word: οὐχὶ
  choice: Chẳng phải ... sao?
  rationale: Thể hiện câu hỏi tu từ mong đợi câu trả lời khẳng định.
- source_word: ἐμώρανεν
  choice: đã làm cho ... trở nên ngu dại
  rationale: Giữ lực gây khiến của động từ, đồng thời là cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: σοφίαν
  choice: sự khôn ngoan
  rationale: Tương đương chuẩn, giữ sự đối lập giữa điều thế gian cho là khôn ngoan và sự ngu dại.
- source_word: κόσμου
  choice: thế gian
  rationale: Cách dịch Kinh Thánh tự nhiên của κόσμος trong ngữ cảnh này và giúp phân biệt với αἰών.
theological_decisions:
- issue: Phân biệt αἰών và κόσμος trong cùng câu
  choice: Dịch αἰών là ‘thời đại’ và κόσμος là ‘thế gian’
  alternative: Dịch cả hai bằng ‘thế gian’ hoặc ‘đời’ để câu trôi chảy hơn
  rationale: Nguyên văn dùng hai danh từ khác nhau; giữ sự phân biệt phản ánh chính xác sự tương phản giữa thời đại hiện tại và sự khôn ngoan thuộc thế gian.
- issue: Sắc thái của ἐμώρανεν
  choice: 'Giữ nghĩa gây khiến: ‘làm cho ... trở nên ngu dại’'
  alternative: ‘Cho thấy ... là ngu dại’
  rationale: Nghĩa thay thế có thể nhấn mạnh sự phơi bày hay chứng minh, nhưng bản dịch chính giữ trực tiếp lực gây khiến của động từ mà không giải quyết thêm hàm ý thần học.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Duy trì ba câu hỏi ngắn song song và câu hỏi tu từ kết thúc. ‘Kinh sư’ giữ sắc thái lịch sử; ‘người tranh biện’ rõ nghĩa với độc giả phổ thông.
