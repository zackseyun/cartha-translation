  source_fidelity: 'Bản dịch truyền đạt đúng các thành tố chính: Chúa Giê-su, Đấng Mê-si, là chủ thể sẽ làm cộng đồng tín hữu vững vàng cho đến tận cùng; ἀνεγκλήτους được đặt trong viễn tượng “ngày của Chúa chúng ta”. Tuy nhiên, “không chỗ trách được” không phải cách nói tự nhiên trong tiếng Việt hiện đại và có thể khiến quan hệ vị ngữ với “anh chị em” kém rõ.'
  naturalness: Nên dùng chính tả và cách gọi hiện đại “Giê-su” thay cho “Jêsus”. “Không có gì đáng trách” tự nhiên, rõ nghĩa trong văn phong trang trọng, đồng thời vẫn có thể chú thích sắc thái pháp lý của từ Hy Lạp.
  terminology: “Chúa”, “Đấng Mê-si”, và “anh chị em” đều thích hợp. Cấu trúc “Chúa chúng ta, là Chúa Giê-su, Đấng Mê-si” làm rõ chuỗi danh xưng trong cách viết tiếng Việt hiện đại mà không thay đổi ý nghĩa.
  issues:
