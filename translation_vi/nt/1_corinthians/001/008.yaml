    rationale: Cụm này là lối diễn đạt ít dùng; người đọc có thể không nhận rõ đây là phẩm tính của “anh chị em”. “Không có gì đáng trách” diễn đạt tự nhiên hơn ἀνεγκλήτους, còn sắc thái ‘không thể bị cáo buộc’ được giữ trong chú thích.
  - severity: low
    issue: “Đức Chúa Jêsus” dùng chính tả và lối gọi mang tính truyền thống hơn là chuẩn hiện đại trung tính.
    rationale: “Chúa Giê-su” là cách viết hiện đại, dễ hiểu rộng rãi. Việc chuyển đổi này không tác động đến danh xưng κύριος hay tước hiệu Χριστός.
