source:
  edition: SBLGNT
  text: ὃς καὶ βεβαιώσει ὑμᾶς ἕως τέλους ἀνεγκλήτους ἐν τῇ ἡμέρᾳ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/008.yaml
  text: who will also establish you to the end[c][b][a], blameless in the day of our Lord Jesus the Messiah.
translation:
  language: vi
  text: Ngài cũng sẽ làm cho anh chị em vững vàng cho đến cuối cùng, không có gì đáng trách[a] trong ngày của Chúa chúng ta, là Chúa Giê-su, Đấng Mê-si.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “không thể bị cáo buộc” hoặc “không đáng bị trách cứ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: βεβαιώσει
  choice: sẽ làm cho anh chị em vững vàng
  rationale: Động từ chỉ việc làm cho vững chắc hoặc củng cố. Cách diễn đạt này tự nhiên trong tiếng Việt và giữ được sắc thái khiến người nhận đứng vững.
- source_word: ὑμᾶς
  choice: anh chị em
  rationale: Đại từ số nhiều chỉ toàn thể cộng đồng tín hữu; “anh chị em” truyền đạt rõ số nhiều và phù hợp văn phong thư tín.
- source_word: ἕως τέλους
  choice: đến cuối cùng
  rationale: Giữ ý nghĩa thời gian kéo dài tới điểm cuối, đồng thời tự nhiên trong tiếng Việt.
- source_word: ἀνεγκλήτους
  choice: không chỗ trách được
  rationale: Từ này diễn tả tình trạng không thể bị cáo buộc hay quy trách chính đáng; cách dịch giữ được cả sắc thái đạo đức lẫn pháp lý.
- source_word: ἐν τῇ ἡμέρᾳ
  choice: trong ngày
  rationale: Giữ thành ngữ Kinh Thánh về ngày chung cuộc mà vẫn rõ nghĩa trong tiếng Việt.
- source_word: κυρίου
  choice: Chúa
  rationale: Danh xưng thông dụng, trang trọng và phù hợp cho κύριος trong ngữ cảnh này.
- source_word: Χριστοῦ
  choice: Đấng Mê-si
  rationale: Truyền đạt ý nghĩa tước hiệu của Χριστός thay vì để người đọc hiện đại hiểu như một tên riêng.
theological_decisions:
- issue: Sở chỉ của đại từ quan hệ ὃς (“Đấng/người mà”)
  choice: Diễn đạt bằng “Ngài”, nối tự nhiên với Chúa Jêsus, Đấng Mê-si ở câu trước.
  alternative: Hiểu đại từ này quy chiếu rộng hơn về Đức Chúa Trời trong ngữ cảnh trước đó.
  rationale: Tiền ngữ giống đực số ít gần nhất ở cuối câu 7 là “Chúa chúng ta là Đức Chúa Jêsus, Đấng Mê-si”. Tiếng Việt cần dùng đại từ để câu độc lập dễ đọc, nhưng không thêm danh xưng nhằm tránh giải thích quá mức.
- issue: Sắc thái của ἀνεγκλήτους
  choice: không chỗ trách được
  alternative: không thể bị cáo buộc
  rationale: Cách chọn chính giữ được kết quả được nhìn nhận là không có căn cứ để quy trách, mà không khẳng định sự hoàn hảo tuyệt đối theo một hệ phái.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Anh chị em” thể hiện rõ đại từ số nhiều; “Đức Chúa Jêsus, Đấng Mê-si” giữ tước hiệu Χριστός và phù hợp cách nói tiếng Việt. Dấu chân chú [a] được đặt ngay sau cụm từ liên quan.
