  to: Ngài cũng sẽ làm cho anh chị em vững vàng cho đến cuối cùng, không có gì đáng trách[a] trong ngày của Chúa chúng ta, là Chúa Giê-su, Đấng Mê-si.
  rationale: Chỉnh “không chỗ trách được” thành “không có gì đáng trách” để câu tự nhiên và rõ hơn trong tiếng Việt hiện đại, nhưng giữ chú thích về sắc thái không bị buộc tội/cáo buộc của ἀνεγκλήτους. Chuẩn hóa “Jêsus” thành “Giê-su” và dùng dấu phẩy để làm rõ “Chúa Giê-su, Đấng Mê-si” là phần đồng vị với “Chúa chúng ta”.
