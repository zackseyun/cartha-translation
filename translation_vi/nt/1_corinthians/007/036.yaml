id: 1CO.7.36
reference: 1 Corinthians 7:36
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Εἰ δέ τις ἀσχημονεῖν ἐπὶ τὴν παρθένον αὐτοῦ νομίζει ἐὰν ᾖ ὑπέρακμος, καὶ οὕτως ὀφείλει γίνεσθαι, ὃ θέλει ποιείτω· οὐχ ἁμαρτάνει· γαμείτωσαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/036.yaml
  text: But if anyone thinks he is behaving improperly toward his virgin[a], if she is past her youth and it ought to be so, let him do what he wants; he is not sinning. Let them marry.
translation:
  language: vi
  text: Nhưng nếu ai cho rằng mình đang cư xử không đúng mực với người trinh nữ của mình[a], nếu nàng đã qua tuổi xuân và sự việc nên diễn ra như vậy, thì người ấy cứ làm điều mình muốn; người ấy không phạm tội. Hai người hãy kết hôn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “với hôn thê (người nữ đồng trinh đã đính hôn) của mình”; theo một cách hiểu truyền thống khác: “với con gái đồng trinh của mình.” Cụm Hy Lạp có thể được hiểu theo cả hai cách.'
    reason: Nêu các cách hiểu chính của cụm từ Hy Lạp mơ hồ παρθένον αὐτοῦ.
lexical_decisions:
- source_word: ἀσχημονεῖν
  choice: cư xử không phải
  rationale: Diễn đạt tự nhiên hành vi không thích hợp hoặc không đúng mực, nhưng không cường điệu thành hành vi đồi bại hay vô luân.
- source_word: ἐπὶ τὴν παρθένον αὐτοῦ
  choice: với người trinh nữ của mình
  rationale: Giữ nghĩa căn bản của παρθένος là “trinh nữ” và không quyết định αὐτοῦ chỉ hôn thê hay con gái; các cách hiểu chính được nêu trong chú thích.
- source_word: ὑπέρακμος
  choice: đã qua tuổi xuân
  rationale: Chuyển tải ý đã vượt qua thời kỳ sung mãn của tuổi trẻ, đồng thời tránh ấn định một độ tuổi kết hôn cụ thể mà nguyên văn không nêu.
- source_word: καὶ οὕτως ὀφείλει γίνεσθαι
  choice: và sự việc nên diễn ra như vậy
  rationale: Giữ tính khái quát của γίνεσθαι và sắc thái cần thiết, thích đáng của ὀφείλει, không tự ý xác định nguyên nhân là ham muốn hay áp lực xã hội.
- source_word: ὃ θέλει ποιείτω
  choice: người ấy cứ làm điều mình muốn
  rationale: “Cứ” thể hiện tự nhiên lực cho phép của mệnh lệnh ngôi thứ ba mà không biến câu thành một mệnh lệnh bắt buộc.
- source_word: οὐχ ἁμαρτάνει
  choice: người ấy không phạm tội
  rationale: Diễn đạt trực tiếp nhận định luân lý của nguyên văn.
- source_word: γαμείτωσαν
  choice: Hai người hãy kết hôn
  rationale: Giữ số nhiều và lực mệnh lệnh của động từ, đồng thời làm rõ chủ thể là hai người bước vào hôn nhân mà không quyết định quan hệ trước đó của họ.
theological_decisions:
- issue: Danh tính của “người trinh nữ của mình” (παρθένον αὐτοῦ)
  choice: Bản văn chính giữ cách nói có thể chỉ người đàn ông và hôn thê của ông, hoặc người cha/người giám hộ và con gái đồng trinh thuộc sự chăm nom của ông.
  alternative: Dịch rõ thành “hôn thê của mình” hoặc “con gái đồng trinh của mình”.
  rationale: Cụm từ Hy Lạp thực sự có thể được hiểu theo cả hai hướng, và văn cảnh đã được giải thích theo cả hai cách. Chọn một cách ngay trong chính văn sẽ giải quyết sự căng thẳng diễn giải mà nguyên văn vẫn để ngỏ.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. “Người trinh nữ của mình” hơi khác lối nói thường ngày nhưng cần thiết để giữ sự mơ hồ thật sự của nguyên văn; chú thích giúp người đọc nhận ra hai cách hiểu chính. Đại từ “nàng” tránh lặp nặng nề và vẫn phù hợp với giọng văn Kinh Thánh hiện đại.
