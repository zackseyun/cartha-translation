  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: περιτετμημένος τις ἐκλήθη; μὴ ἐπισπάσθω· ἐν ἀκροβυστίᾳ ⸂κέκληταί τις⸃; μὴ περιτεμνέσθω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/018.yaml
  text: Was anyone called while circumcised? He should not try to reverse it[a]. Was anyone called while uncircumcised? He should not be circumcised.
translation:
  language: vi
  text: Có ai được gọi khi đã chịu phép cắt bì không? Người ấy đừng tìm cách xóa dấu vết đó[a]. Có ai được gọi khi chưa chịu phép cắt bì không? Người ấy đừng chịu phép cắt bì.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “đừng trở thành người không cắt bì”—nghĩa là đừng tìm cách che giấu hoặc làm mất dấu vết của phép cắt bì.'
    reason: lexical_alternative
lexical_decisions:
- source_word: περιτετμημένος
  choice: khi đang chịu phép cắt bì
  rationale: Phân từ hoàn thành diễn tả tình trạng đã chịu cắt bì còn kéo dài vào lúc người ấy được gọi; cách dịch này tự nhiên và giữ thế song song với vế sau.
- source_word: ἐκλήθη / κέκληταί
  choice: đã được gọi
  rationale: Dạng bị động giữ nguyên ngôn ngữ 'được gọi' của Phao-lô, nhiều khả năng chỉ sự kêu gọi của Đức Chúa Trời, nhưng không diễn giải quá mức thành 'tin Chúa' hay 'cải đạo'.
- source_word: ἐπισπάσθω
  choice: đừng tìm cách xóa dấu vết đó
  rationale: Động từ chỉ việc kéo da che phủ hoặc tìm cách làm mất dấu cắt bì. Cách dịch chính truyền đạt rõ hành động trong tiếng Việt hiện đại; nghĩa sát chữ được ghi ở chú thích.
- source_word: ἐν ἀκροβυστίᾳ
  choice: khi chưa chịu phép cắt bì
  rationale: Cụm từ chỉ tình trạng không cắt bì vào lúc được gọi; cách diễn đạt này tự nhiên hơn lối dịch sát chữ 'trong sự không cắt bì'.
- source_word: περιτεμνέσθω
  choice: đừng chịu phép cắt bì
  rationale: Mệnh lệnh hiện tại có μή mang ý cấm; 'đừng chịu phép cắt bì' rõ ràng, trang trọng và không thêm sắc thái ngoài nguyên văn.
theological_decisions:
- issue: Ý nghĩa của 'được gọi' trong cả hai vế
  choice: Giữ nguyên cách nói 'được gọi', hàm ý sự kêu gọi của Đức Chúa Trời trong tình trạng xã hội–tôn giáo lúc ấy
  alternative: Diễn giải thành 'được Đức Chúa Trời gọi đến với đời sống Cơ Đốc' hoặc 'tin Chúa'
  rationale: Văn cảnh 1 Cô-rinh-tô 7 hướng đến sự kêu gọi của Đức Chúa Trời, nhưng nguyên văn không nêu chủ thể và không dùng từ 'cải đạo'; giữ cách nói này bảo toàn hàm ý và độ mở của câu.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng 'phép cắt bì' theo thuật ngữ Kinh Thánh quen thuộc; cấu trúc hai câu hỏi song song phản ánh hình thức tu từ của nguyên văn.
