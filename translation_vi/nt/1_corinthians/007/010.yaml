  rationale: Chỉ điều chỉnh vị trí ký hiệu chú thích để neo trực tiếp vào cụm diễn đạt sự phân ly hôn nhân. Nội dung bản dịch và chú thích được giữ nguyên vì chúng trung thành với nguyên văn và bảo toàn sự mơ hồ có chủ ý giữa ly thân và ly dị.
