source:
  edition: SBLGNT
  text: Τοῖς δὲ γεγαμηκόσιν παραγγέλλω, οὐκ ἐγὼ ἀλλὰ ὁ κύριος, γυναῖκα ἀπὸ ἀνδρὸς μὴ χωρισθῆναι—
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/010.yaml
  text: 'To the married I give this command—not I[a], but the Lord: a wife must not separate from her husband—'
translation:
  language: vi
  text: 'Còn với những người đã kết hôn, tôi truyền lệnh này—không phải tôi, nhưng là Chúa: người vợ không được lìa chồng mình[a]—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “không được ly dị chồng mình.” Động từ Hy Lạp có thể chỉ sự phân ly trong hôn nhân, và trong ngữ cảnh có thể bao gồm cả ly dị.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῖς δὲ γεγαμηκόσιν
  choice: Còn với những người đã kết hôn
  rationale: Cụm phân từ hoàn thành chỉ những người đang ở trong tình trạng hôn nhân; “còn với” thể hiện tự nhiên sự chuyển ý nhẹ của δέ và quan hệ hướng đến người nhận lệnh.
- source_word: παραγγέλλω
  choice: tôi truyền lệnh này
  rationale: Diễn đạt tính chất chỉ thị có thẩm quyền của động từ, đồng thời tự nhiên trong tiếng Việt hiện đại.
- source_word: οὐκ ἐγὼ ἀλλὰ ὁ κύριος
  choice: không phải tôi, nhưng là Chúa
  rationale: Giữ nguyên sự tương phản nhấn mạnh trong nguyên văn mà không diễn giải thêm bản chất thẩm quyền của lời Phao-lô.
- source_word: γυναῖκα ἀπὸ ἀνδρὸς
  choice: người vợ ... chồng mình
  rationale: Trong ngữ cảnh hôn nhân, γυνή và ἀνήρ lần lượt có nghĩa là vợ và chồng; “mình” làm rõ quan hệ sở hữu một cách tự nhiên.
- source_word: μὴ χωρισθῆναι
  choice: không được lìa
  rationale: “Lìa” bảo toàn phạm vi nghĩa về sự phân ly trong hôn nhân mà chưa thu hẹp thành thủ tục ly hôn pháp lý; cấu trúc “không được” truyền đạt nội dung mệnh lệnh.
theological_decisions:
- issue: Ý nghĩa của “không phải tôi, nhưng là Chúa”
  choice: Giữ nguyên đối lập giữa Phao-lô và Chúa, không chú giải ngay trong câu.
  alternative: Diễn giải rằng đây là lệnh Chúa Jesus đã truyền trước đó, đối lập với sự áp dụng của Phao-lô.
  rationale: Nguyên văn để sự đối lập đứng trực tiếp; bản dịch không nên biến nó thành lời phủ nhận thẩm quyền của Phao-lô cũng không nên đưa một cách giải thích cụ thể vào chính văn.
- issue: Phạm vi nghĩa của χωρισθῆναι
  choice: lìa
  alternative: ly dị
  rationale: “Lìa” duy trì độ rộng của từ Hy Lạp, có thể nói đến sự ly thân và trong ngữ cảnh có thể bao gồm ly dị.
translation_notes:
  register: Văn phong trang trọng vừa phải, hiện đại và dễ hiểu. Dấu gạch ngang cuối câu được giữ lại vì câu tiếp tục sang câu 11. Dấu chú thích [a] đặt ngay sau mệnh đề liên quan.
