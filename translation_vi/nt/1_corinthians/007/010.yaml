  terminology: «Chúa», «vợ», «chồng», và «lìa» đều phù hợp ngữ cảnh và cách dùng Kinh Thánh tiếng Việt hiện đại. Không cần diễn giải «không phải tôi, nhưng là Chúa» theo một lập trường thần học cụ thể.
