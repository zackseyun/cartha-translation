revisions:
- from: Còn với những người khác, tôi nói—chính tôi, không phải Chúa—rằng nếu một anh em có vợ là người không tin, và nàng đồng ý sống chung với anh ấy, thì anh ấy không được ly dị nàng.[a]
  to: Còn với những người còn lại, tôi nói—chính tôi, không phải Chúa—rằng nếu một anh em có vợ là người không tin, và người vợ ấy đồng ý sống với người chồng, thì người chồng không được ly dị vợ mình.[a]
  rationale: Sửa chú thích để phản ánh đúng phạm vi nghĩa của ἀφίημι trong ngữ cảnh hôn nhân. Điều chỉnh “những người khác” thành “những người còn lại” để gần hơn với λοιποί, và thay các đại từ không đồng nhất về phong cách bằng danh ngữ rõ ràng. Bản sửa vẫn giữ sự phân biệt trong câu “chính tôi, không phải Chúa” mà không diễn giải thêm về thẩm quyền.
