source:
  edition: SBLGNT
  text: Τοῖς δὲ λοιποῖς ⸂λέγω ἐγώ⸃, οὐχ ὁ κύριος· εἴ τις ἀδελφὸς γυναῖκα ἔχει ἄπιστον, καὶ αὕτη συνευδοκεῖ οἰκεῖν μετ’ αὐτοῦ, μὴ ἀφιέτω αὐτήν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/012.yaml
  text: But to the rest I say—I[a], not the Lord—if any brother has an unbelieving wife, and she consents to live with him, he must not divorce her.
translation:
  language: vi
  text: Còn với những người còn lại, tôi nói—chính tôi, không phải Chúa—rằng nếu một anh em có vợ là người không tin, và người vợ ấy đồng ý sống với người chồng, thì người chồng không được ly dị vợ mình.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “không được bỏ vợ” hoặc “không được đuổi vợ đi.” Động từ Hy Lạp có nghĩa sát hơn là “bỏ” hoặc “đuổi đi,” nhưng trong ngữ cảnh này chỉ việc chấm dứt hôn nhân.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῖς δὲ λοιποῖς
  choice: Còn với những người khác
  rationale: Diễn đạt nhóm còn lại chưa được đề cập trong chỉ dẫn trước; “còn” thể hiện δέ như một chuyển ý nhẹ, tự nhiên trong tiếng Việt.
- source_word: λέγω ἐγώ, οὐχ ὁ κύριος
  choice: tôi nói—chính tôi, không phải Chúa—
  rationale: “Chính tôi” giữ sắc thái nhấn mạnh của ἐγώ; dấu gạch ngang bảo toàn tính xen giữa và không diễn giải câu này như sự phủ nhận thẩm quyền sứ đồ.
- source_word: ἀδελφὸς
  choice: một anh em
  rationale: Danh từ số ít giống đực ở đây chỉ cụ thể một người nam có vợ; “anh em” là cách gọi quen thuộc trong cộng đồng tín hữu và giữ đúng giới tính của ngữ cảnh.
- source_word: γυναῖκα ἔχει ἄπιστον
  choice: có vợ là người không tin
  rationale: ἔχει γυναῖκα là cách nói về quan hệ hôn nhân; cấu trúc này tự nhiên hơn “có một người vợ không tin” và làm rõ ἄπιστον nói đến đức tin, không phải sự bất trung trong hôn nhân.
- source_word: καὶ αὕτη συνευδοκεῖ
  choice: và nàng đồng ý
  rationale: “Đồng ý” truyền đạt sự tự nguyện chấp thuận của συνευδοκέω bằng ngôn ngữ hiện đại, dễ hiểu; “nàng” duy trì tham chiếu số ít giống cái trong văn phong trang trọng.
- source_word: οἰκεῖν μετ’ αὐτοῦ
  choice: sống chung với anh ấy
  rationale: Chỉ đời sống chung trong cùng một gia đình; “sống chung” tự nhiên trong tiếng Việt hiện đại, còn “anh ấy” làm rõ người chồng được nói đến.
- source_word: μὴ ἀφιέτω αὐτήν
  choice: anh ấy không được ly dị nàng
  rationale: Trong ngữ cảnh hôn nhân, ἀφίημι chỉ việc rời bỏ hoặc cho người phối ngẫu đi, tức chấm dứt hôn nhân; “ly dị” làm rõ ý chính, còn các nghĩa sát chữ được ghi ở chú thích.
theological_decisions:
- issue: 'Lời của Phao-lô: “chính tôi, không phải Chúa”'
  choice: Giữ nguyên sự phân biệt giữa lời chỉ dẫn của Phao-lô và một lời trực tiếp của Chúa Giê-su về trường hợp này.
  alternative: Hiểu đây chỉ là ý kiến riêng, không có thẩm quyền.
  rationale: Mạch văn phân biệt lời dạy trực tiếp của Chúa được nhắc trước đó với sự áp dụng của vị sứ đồ cho một trường hợp chưa được Chúa trực tiếp đề cập; bản dịch không tự ý giải quyết căng thẳng bằng cách thêm rằng lời này kém thẩm quyền.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Giữ cấu trúc nhấn mạnh và tính xen giữa của câu Hy Lạp; dùng “người không tin” để tránh khả năng hiểu ἄπιστος là không chung thủy. Dấu chú thích [a] được đặt ngay sau mệnh đề liên quan.
