    issue: Chú thích ghi “cho đi” là nghĩa sát của ἀφίημι.
    rationale: Trong mệnh lệnh μὴ ἀφιέτω αὐτήν và bối cảnh hôn nhân, động từ này mang ý bỏ/rời bỏ hoặc đuổi đi, dẫn đến chấm dứt quan hệ hôn nhân; “cho đi” không phải cách diễn đạt phù hợp ở đây.
  - severity: low
    issue: Đại từ “nàng” và “anh ấy” không đồng nhất về văn phong.
    rationale: “Nàng” có sắc thái văn chương cũ, còn “anh ấy” thiên về hội thoại hiện đại. Thay bằng “người vợ ấy” và “người chồng” giữ văn phong hiện đại, trang trọng và tránh mơ hồ.
