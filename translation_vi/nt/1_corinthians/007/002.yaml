source:
  edition: SBLGNT
  text: διὰ δὲ τὰς πορνείας ἕκαστος τὴν ἑαυτοῦ γυναῖκα ἐχέτω, καὶ ἑκάστη τὸν ἴδιον ἄνδρα ἐχέτω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/002.yaml
  text: But because of sexual immoralities[a], let each man have his own wife, and let each woman have her own husband.
translation:
  language: vi
  text: Nhưng vì các hành vi tình dục vô luân[a], mỗi người nam hãy có vợ của mình, và mỗi người nữ hãy có chồng của mình.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “hành vi tình dục vô luân” (số ít). Tiếng Hy Lạp dùng số nhiều: “các hành vi tình dục vô luân”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ δὲ
  choice: Nhưng vì
  rationale: διά với đối cách nêu nguyên nhân, còn δέ đánh dấu sự tương phản hoặc chuyển ý nhẹ; “Nhưng vì” giữ được cả hai sắc thái.
- source_word: τὰς πορνείας
  choice: những sự gian dâm
  rationale: πορνεία chỉ hành vi tình dục trái luân lý; dạng số nhiều trong Hy Lạp được giữ lại bằng “những sự gian dâm”. Cách nói này trang trọng và không thu hẹp nghĩa vào một hành vi duy nhất.
- source_word: ἕκαστος
  choice: mỗi người nam
  rationale: Dạng giống đực số ít, đặt song song với ἑκάστη và cặp γυναῖκα/ἄνδρα, chỉ từng người nam chứ không phải “mỗi người” theo nghĩa chung.
- source_word: τὴν ἑαυτοῦ γυναῖκα
  choice: vợ riêng của mình
  rationale: Trong cặp hôn nhân với ἄνδρα, γυνή mang nghĩa “vợ”; ἑαυτοῦ nhấn mạnh người phối ngẫu thuộc về chính người ấy.
- source_word: ἐχέτω
  choice: hãy có
  rationale: Mệnh lệnh cách hiện tại ngôi ba được diễn đạt tự nhiên bằng “hãy có”, giữ nguyên lực mệnh lệnh mà không đổi thành động từ “kết hôn” hoặc ý về nghĩa vụ chăn gối.
- source_word: καὶ ἑκάστη
  choice: và mỗi người nữ hãy
  rationale: Giữ cấu trúc phân phối song song và tính đối xứng rõ ràng giữa người nam và người nữ.
- source_word: τὸν ἴδιον ἄνδρα
  choice: chồng riêng của mình
  rationale: Trong ngữ cảnh hôn nhân, ἀνήρ có nghĩa là “chồng”; ἴδιον nhấn mạnh “của chính mình”, được diễn đạt tự nhiên là “riêng của mình”.
theological_decisions:
- issue: Câu này là lời khuyên kết hôn để tránh tội lỗi tình dục hay là mệnh lệnh về quan hệ vợ chồng
  choice: Dịch trực tiếp ἐχέτω là “hãy có” và giữ lời chỉ dẫn rằng mỗi người nam, người nữ có người phối ngẫu riêng vì những sự gian dâm.
  alternative: Diễn giải thành “nên kết hôn” hoặc “hãy làm tròn bổn phận vợ chồng”.
  rationale: Bản Hy Lạp không dùng động từ cụ thể cho việc kết hôn hay quan hệ chăn gối. Cách dịch này giữ nguyên độ mở và sức căng của câu, không đưa thêm kết luận thần học vượt quá văn bản.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Người nam/người nữ” giữ sự đối xứng của nguyên văn; “vợ/chồng” thể hiện đúng ngữ cảnh hôn nhân. “Gian dâm” được dùng theo nghĩa rộng của hành vi tình dục trái luân lý, không giới hạn vào ngoại tình.
