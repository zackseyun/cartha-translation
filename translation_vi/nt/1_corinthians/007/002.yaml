review_pass:
  verdict: revise
  source_fidelity: Bản nháp giữ đúng quan hệ nhân quả của διὰ δέ, cấu trúc phân phối đối xứng (ἕκαστος/ἑκάστη), nghĩa hôn nhân của γυνή/ἀνήρ, và sắc thái mệnh lệnh của ἐχέτω. Tuy nhiên, “vợ riêng/chồng riêng” không phải cách diễn đạt an toàn cho sở hữu phản thân ἑαυτοῦ/ἴδιον trong tiếng Việt, vì có thể gợi một người phối ngẫu tách biệt hay không chính thức. “Những sự gian dâm” cũng quá gượng và có thể thu hẹp πορνείας vào ngoại tình.
  naturalness: “Các hành vi tình dục vô luân” là lối nói hiện đại, rõ nghĩa và tự nhiên hơn “những sự gian dâm,” đồng thời vẫn giữ được số nhiều Hy Lạp. “Vợ của mình/chồng của mình” tự nhiên trong văn phong Kinh Thánh hiện đại và diễn đạt đúng ý “riêng của mình.”
  terminology: Dùng “hành vi tình dục vô luân” cho πορνεία để không đồng nhất thuật ngữ rộng này với chỉ “gian dâm” theo cách hiểu hiện đại thường hẹp hơn. Giữ “hãy có” vì nguyên văn không nói rõ “kết hôn” hay “làm tròn bổn phận vợ chồng.”
  issues:
  - severity: medium
    issue: “những sự gian dâm” thiếu tự nhiên và có nguy cơ thu hẹp nghĩa của πορνείας.
    rationale: Danh từ “gian dâm” trong tiếng Việt hiện đại thường gợi ngoại tình hoặc một phạm vi hẹp; thêm “những sự” tạo cấu trúc không tự nhiên. πορνείας là số nhiều và chỉ các hành vi tình dục trái chuẩn mực luân lý nói chung.
  - severity: medium
    issue: “vợ riêng của mình/chồng riêng của mình” mơ hồ trong tiếng Việt.
    rationale: “Riêng” có thể gợi vợ/chồng không chính thức, biệt lập, hoặc đối lập với người khác. Sở hữu phản thân trong nguyên văn được chuyển trung thành và tự nhiên bằng “vợ của mình/chồng của mình.”
