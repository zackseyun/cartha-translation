    rationale: καλὸν αὐτοῖς có nghĩa là “tốt cho họ.” Cụm “thì tốt” có thể được hiểu là đánh giá chung về tình trạng ấy, nhưng không biểu đạt rõ người được hưởng/được áp dụng là “họ.”
  - severity: low
    issue: Cú pháp mở đầu hơi gượng và cụm “cứ ở vậy” kém trang trọng.
    rationale: Đảo thành “Tôi nói với ... rằng” tự nhiên hơn; “tiếp tục sống độc thân” làm rõ hành động tiếp diễn mà μένω diễn tả trong ngữ cảnh hôn nhân.
  - severity: low
    issue: Chú thích b thêm sắc thái “chính” không có trong κἀγώ.
    rationale: κἀγώ = καὶ ἐγώ, nghĩa là “tôi cũng,” không nhất thiết nhấn mạnh phản thân bằng “chính tôi.”
