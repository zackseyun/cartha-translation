base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/008.yaml
  text: 'I say to the unmarried and to the widows: it is good for them if they remain as I am[a][b].'
translation:
  language: vi
  text: 'Tôi nói với những người chưa kết hôn[a] và các góa phụ rằng: tốt cho họ nếu họ tiếp tục sống độc thân như tôi[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “những người đàn ông chưa kết hôn”, vì từ Hy Lạp ở đây có hình thức giống đực số nhiều; tuy nhiên, giống đực cũng có thể được dùng theo nghĩa đại diện.'
    reason: lexical_alternative
  - marker: b
    text: 'Sát nghĩa: “như tôi cũng vậy”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Λέγω δὲ
  choice: Còn ... tôi nói rằng
  rationale: δέ đánh dấu sự chuyển ý nhẹ; “Còn” thể hiện tự nhiên mối liên hệ diễn ngôn mà không biến nó thành một từ chỉ thời gian.
- source_word: τοῖς ἀγάμοις
  choice: với những người chưa kết hôn
  rationale: ἄγαμος chỉ người không có hôn phối. Cách dịch này giữ phạm vi tương đối rộng của từ, trong khi chú thích ghi nhận hình thái giống đực số nhiều.
- source_word: καὶ ταῖς χήραις
  choice: và các góa phụ
  rationale: χήρα chỉ cụ thể người phụ nữ có chồng đã qua đời; cần giữ đây là nhóm được nêu riêng.
- source_word: καλὸν αὐτοῖς
  choice: thì tốt
  rationale: καλόν diễn tả điều tốt hoặc thích hợp, không tự nó mang nghĩa so sánh “tốt hơn”; chủ thể ngầm là việc họ tiếp tục ở trong tình trạng ấy.
- source_word: ἐὰν μείνωσιν
  choice: nếu họ cứ ở vậy
  rationale: μένω có nghĩa là tiếp tục hoặc duy trì; trong ngữ cảnh này, “cứ ở vậy” tự nhiên trong tiếng Việt và chỉ việc tiếp tục không kết hôn.
- source_word: ὡς κἀγώ
  choice: như tôi
  rationale: κἀγώ là dạng rút gọn của καὶ ἐγώ, sát nghĩa là “như chính tôi cũng vậy”; câu chính dùng cách nói tự nhiên, còn sắc thái bổ sung được ghi ở chú thích.
theological_decisions:
- issue: Phạm vi của ἀγάμοις so với “các góa phụ”
  choice: Dịch là “những người chưa kết hôn”, đồng thời giữ “các góa phụ” là nhóm được nêu riêng.
  alternative: “những người đàn ông chưa kết hôn”
  rationale: Hình thái Hy Lạp là giống đực số nhiều và có thể được hiểu riêng về nam giới, nhưng cũng có thể được dùng theo nghĩa đại diện. Bản dịch chính giữ sự rộng nghĩa này, không quyết định thay cho độc giả.
- issue: Sắc thái của καλὸν
  choice: Dịch là “tốt”.
  alternative: “tốt hơn” hoặc “phải lẽ”
  rationale: Tính từ Hy Lạp không mang hình thức so sánh, vì vậy “tốt hơn” sẽ đưa thêm một sự so sánh không được nói rõ trong câu.
- issue: Tình trạng của Phao-lô trong ὡς κἀγώ
  choice: Giữ lời tự quy chiếu là “như tôi”, không xác định ông chưa từng kết hôn hay đã góa vợ.
  alternative: Giải thích cụ thể Phao-lô là người độc thân chưa từng kết hôn hoặc là người góa vợ.
  rationale: Câu chỉ nói đến tình trạng hiện tại của Phao-lô, không xác định lịch sử hôn nhân của ông.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Cứ ở vậy” là cách nói tiếng Việt tự nhiên về việc tiếp tục không kết hôn; câu không suy diễn tình trạng hôn nhân trước đây của Phao-lô. Mọi dấu chú thích đều xuất hiện trong bản văn chính.
