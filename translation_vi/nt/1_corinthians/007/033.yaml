id: 1CO.7.33
reference: 1 Corinthians 7:33
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ δὲ γαμήσας μεριμνᾷ τὰ τοῦ κόσμου, πῶς ⸀ἀρέσῃ τῇ γυναικί,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/033.yaml
  text: But the married man is concerned with the things of the world[a], how he may please his wife,
translation:
  language: vi
  text: Nhưng người đã cưới vợ thì lo những việc thuộc về thế gian[a], làm sao để đẹp lòng vợ mình,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “những việc đời” hoặc “các công việc của thế gian”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ γαμήσας
  choice: Nhưng người đã cưới vợ
  rationale: Phân từ aorist có mạo từ được dùng như danh từ, chỉ người nam đã kết hôn, đối lập với người chưa cưới trong văn cảnh. Cách diễn đạt này giữ được sắc thái giống đực số ít của tiếng Hy Lạp và tự nhiên trong tiếng Việt.
- source_word: μεριμνᾷ
  choice: thì lo
  rationale: Động từ có thể chỉ lo lắng, quan tâm hoặc chăm lo. Ở đây, từ này nói đến những mối bận tâm và trách nhiệm của đời sống hôn nhân, không nhất thiết là sự lo âu có tính tội lỗi.
- source_word: τὰ τοῦ κόσμου
  choice: những việc thuộc về thế gian
  rationale: Cụm sở hữu cách chỉ những việc thuộc đời sống bình thường trong thế gian. Cách dịch này giữ hình thức số nhiều và không mặc nhiên gán nghĩa xấu về đạo đức cho κόσμος.
- source_word: πῶς ἀρέσῃ
  choice: làm sao để đẹp lòng
  rationale: 'πῶς cùng động từ ở thức giả định diễn tả nội dung của mối bận tâm: làm cách nào để làm hài lòng vợ. “Làm sao để đẹp lòng” vừa tự nhiên vừa giữ sắc thái hướng đến mục tiêu.'
- source_word: τῇ γυναικί
  choice: vợ mình
  rationale: Trong văn cảnh hôn nhân, γυνή rõ ràng có nghĩa là “vợ”. “Mình” diễn đạt tự nhiên quan hệ sở hữu vốn được hàm ý trong tiếng Hy Lạp.
theological_decisions:
- issue: Có nên hiểu κόσμος ở đây theo nghĩa tiêu cực về đạo đức hay không
  choice: Dịch trung tính là “thế gian” trong cụm “những việc thuộc về thế gian”
  alternative: Dịch là “những việc thế tục” với hàm ý chê trách
  rationale: Trong văn cảnh, Phao-lô đối chiếu những trách nhiệm thực tế của đời sống hôn nhân với sự chuyên tâm không phân chia dành cho Chúa; ông không nhất thiết lên án hôn nhân hay các trách nhiệm bình thường. Cách dịch trung tính bảo toàn sự căng thẳng thần học mà không áp đặt phán xét khổ hạnh.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Người đã cưới vợ” giữ rõ đối tượng là người nam; “lo” ngắn gọn, tự nhiên nhưng không cường điệu thành lo âu; “đẹp lòng” phù hợp văn phong Kinh Thánh mà vẫn thông dụng.
