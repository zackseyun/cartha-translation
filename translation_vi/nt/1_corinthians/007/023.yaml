review_pass:
  verdict: revise
  source_fidelity: Bản dịch bảo toàn đúng thể bị động quá khứ của ἠγοράσθητε, mệnh lệnh συνεχ diễn tả ý «đừng trở thành» của μὴ γίνεσθε, và ý lệ thuộc/chủ quyền trong δοῦλοι. Tuy nhiên, chú thích đưa «với giá cao» như một khả năng dịch trực tiếp dù τιμῆς không tự nó nêu giá cao; cần bỏ để không thêm sắc thái không được phát biểu trong câu.
  naturalness: «Nô lệ của con người» tự nhiên và trực tiếp hơn «nô lệ của loài người», vì «loài người» thường chỉ toàn thể nhân loại như một tập thể hoặc một loài. «Bằng một giá» có thể hiểu được trong văn phong Kinh Thánh hiện đại.
  terminology: «Anh chị em», «nô lệ», và «con người» phù hợp với tiếng Việt hiện đại, giữ ngôi số nhiều cộng đồng, ý sở hữu của δοῦλοι, và nghĩa bao quát giới tính của ἀνθρώπων. Không nên dịch là «giá cao» khi không có tính từ hay yếu tố nào tương ứng trong nguyên ngữ.
  issues:
  - severity: medium
    issue: Chú thích nêu «đã được mua với giá cao» như một phương án.
    rationale: τιμῆς chỉ giá mua/cái giá, không xác định giá cao. Dù ý về giá trị lớn có thể được suy ra từ thần học hay ngữ cảnh rộng hơn, nó không phải là phương án dịch trực tiếp an toàn cho riêng câu này.
  - severity: low
    issue: «Nô lệ của loài người» kém tự nhiên trong ngữ cảnh quan hệ chủ–tớ.
    rationale: «Loài người» dễ gợi nhân loại nói chung; «con người» diễn đạt tự nhiên hơn các chủ thể là người đối lập với chủ quyền của Chúa, mà không giới hạn ở nam giới.
  revised_text: Anh chị em đã được mua bằng một giá[a]; đừng trở thành nô lệ của con người.
