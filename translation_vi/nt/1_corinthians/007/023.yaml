- from: Anh chị em đã được mua bằng một giá[a]; đừng trở thành nô lệ của loài người.
  to: Anh chị em đã được mua bằng một giá[a]; đừng trở thành nô lệ của con người.
  rationale: Chỉ điều chỉnh cách gọi các chủ thể con người cho tự nhiên hơn và sửa chú thích để bảo toàn tính không xác định của τιμῆς. Các thành phần còn lại của bản dịch giữ đúng ẩn dụ mua chuộc và mệnh lệnh không tự đặt mình dưới sự lệ thuộc của con người.
