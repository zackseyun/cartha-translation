  text: You were bought with a price[a]; do not become servants of men.
translation:
  language: vi
  text: Anh chị em đã được mua bằng một giá[a]; đừng trở thành nô lệ của con người.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đã được mua với một giá.” Nguyên văn không nói rõ giá ấy là bao nhiêu hay là gì.'
    reason: Giải thích cấu trúc chỉ giá mua, đồng thời không thêm ý «giá cao» mà nguyên văn không nêu.
lexical_decisions:
- source_word: τιμῆς
  choice: bằng một giá
  rationale: Sở hữu cách đi với ἀγοράζω diễn tả giá mua. Cách dịch này giữ nguyên ẩn dụ mua chuộc và không xác định giá ấy là gì.
- source_word: ἠγοράσθητε
  choice: anh chị em đã được mua
  rationale: Động từ ở thể thụ động, thì aorist, ngôi thứ hai số nhiều. “Đã được mua” chuyển tải tự nhiên hành động đã xảy ra và giữ nguyên ẩn dụ thương mại–cứu chuộc.
- source_word: μὴ γίνεσθε
  choice: đừng trở thành
  rationale: γίνομαι mang nghĩa “trở thành”; μή với mệnh lệnh hiện tại cấm bước vào hoặc tiếp tục đi vào tình trạng ấy. “Đừng trở thành” bảo toàn sắc thái này hơn “đừng làm” hay “đừng là”.
- source_word: δοῦλοι
  choice: nô lệ
  rationale: Trong ngữ cảnh về việc được mua và thuộc quyền một chủ, thân phận lệ thuộc là trọng tâm; “nô lệ” chính xác hơn từ nhẹ nghĩa như “đầy tớ”.
- source_word: ἀνθρώπων
  choice: của loài người
  rationale: Sở hữu cách phụ thuộc vào δοῦλοι. ἀνθρώπων chỉ con người nói chung, tương phản với Chúa, chứ không riêng nam giới; “loài người” vừa chính xác vừa trang trọng trong tiếng Việt.
theological_decisions:
- issue: Cách dịch δοῦλοι ἀνθρώπων trong ẩn dụ về quyền sở hữu và lòng trung thành
  choice: nô lệ của loài người
  alternative: đầy tớ của người ta; nô lệ của con người
  rationale: “Nô lệ” giữ rõ ý về quyền sở hữu và sự lệ thuộc vốn liên kết trực tiếp với mệnh đề “đã được mua.” “Loài người” bảo toàn sự tương phản giữa chủ nhân phàm nhân và Chúa mà không giới hạn đối tượng vào nam giới.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” để biểu đạt ngôi thứ hai số nhiều trong lời nói với cả cộng đồng; dùng “loài người” theo nghĩa đại diện, bao gồm mọi người.
