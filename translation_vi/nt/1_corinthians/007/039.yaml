revisions:
- from: Người vợ bị ràng buộc bao lâu chồng mình còn sống; nhưng nếu chồng đã an nghỉ[a], nàng được tự do kết hôn với người mình muốn, miễn là trong Chúa[b].
  to: Người vợ bị ràng buộc chừng nào chồng mình còn sống; nhưng nếu chồng qua đời[a], người vợ ấy được tự do kết hôn với người mình muốn, miễn là trong Chúa[b].
  rationale: Chỉnh nhẹ để dùng tiếng Việt hiện đại, tự nhiên hơn và làm rõ nghĩa chết trong chính văn, trong khi chú thích bảo tồn uyển ngữ của tiếng Hy Lạp. Không thay đổi ý nghĩa, phạm vi điều kiện, hoặc sự hàm súc của cụm “trong Chúa”.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T18:11:28Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch truyền đạt đúng cấu trúc và ý chính của câu: tình trạng ràng buộc hôn nhân kéo dài khi người chồng còn sống, sự tự do tái hôn sau khi chồng chết, và điều kiện “chỉ/trong Chúa”. Tuy nhiên, “đã an nghỉ” không phản ánh trực tiếp hình ảnh κοιμηθῇ (“ngủ”), đồng thời là một lối nói có thể gợi thêm sắc thái an nghỉ sau chết. Dùng “qua đời” trong chính văn là tự nhiên, rõ nghĩa trong tiếng Việt hiện đại; chú thích giữ lại cách nói giảm “ngủ” của tiếng Hy Lạp.'
  naturalness: “Nàng” mang sắc thái văn chương cổ và không phù hợp nhất với tiếng Việt chuẩn hiện đại của câu này. Thay bằng “người vợ ấy” giúp quy chiếu rõ ràng, nhất quán với chủ ngữ, và giữ văn phong trang trọng, dễ hiểu.
  terminology: Giữ “bị ràng buộc”, “được tự do”, và “trong Chúa”. Cụm “trong Chúa” cần được giữ cô đọng trong chính văn để không quyết định trước giữa cách hiểu về người phối ngẫu cùng đức tin và cách hiểu rộng hơn về sự trung thành với Chúa. Chú thích nêu cách hiểu phổ biến mà không biến nó thành nghĩa duy nhất.
  issues:
  - severity: low
    issue: “nàng” không phù hợp tối ưu với đăng ký tiếng Việt hiện đại.
    rationale: Từ này có sắc thái cổ/văn chương; “người vợ ấy” tự nhiên hơn và quy chiếu rõ chủ thể vừa được nói đến.
  - severity: low
    issue: “đã an nghỉ” diễn đạt κοιμηθῇ khá gián tiếp.
    rationale: Từ Hy Lạp dùng uyển ngữ “ngủ” để nói về chết. “Qua đời” là cách nói giảm tự nhiên và rõ nghĩa trong tiếng Việt hiện đại; chú thích có thể bảo tồn hình ảnh từ nguyên.
