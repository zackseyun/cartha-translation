id: 1CO.7.39
reference: 1 Corinthians 7:39
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Γυνὴ ⸀δέδεται ἐφ’ ὅσον χρόνον ζῇ ὁ ἀνὴρ αὐτῆς· ἐὰν ⸀δὲ κοιμηθῇ ὁ ἀνήρ, ἐλευθέρα ἐστὶν ᾧ θέλει γαμηθῆναι, μόνον ἐν κυρίῳ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/039.yaml
  text: A wife is bound for as long as her husband lives[a]; but if her husband dies, she is free to be married to whom she wishes[b], only in the Lord.
translation:
  language: vi
  text: Người vợ bị ràng buộc chừng nào chồng mình còn sống; nhưng nếu chồng qua đời[a], người vợ ấy được tự do kết hôn với người mình muốn, miễn là trong Chúa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “đã ngủ.” Tiếng Hy Lạp dùng động từ “ngủ” như một cách nói giảm thông dụng về sự chết.'
    reason: lexical_alternative
  - marker: b
    text: “Trong Chúa” thường được hiểu là chỉ kết hôn với người thuộc về Chúa, tức là một người cùng đức tin.
    reason: alternative_reading
lexical_decisions:
- source_word: Γυνή
  choice: Người vợ
  rationale: Trong ngữ cảnh hôn nhân, từ này chỉ người vợ chứ không mang nghĩa chung là “người phụ nữ”.
- source_word: δέδεται
  choice: bị ràng buộc
  rationale: Thể hoàn thành bị động diễn tả một tình trạng ràng buộc vẫn tiếp diễn; cách dịch này giữ sắc thái pháp lý và quan hệ của động từ.
- source_word: ἐφ’ ὅσον χρόνον ζῇ
  choice: bao lâu ... còn sống
  rationale: Diễn đạt tự nhiên trong tiếng Việt về toàn bộ khoảng thời gian người chồng sống.
- source_word: ὁ ἀνὴρ αὐτῆς
  choice: chồng mình
  rationale: Trong ngữ cảnh này ἀνήρ có nghĩa là “chồng”; “mình” quy chiếu tự nhiên về người vợ là chủ thể câu.
- source_word: κοιμηθῇ
  choice: đã an nghỉ
  rationale: Động từ Hy Lạp có nghĩa đen là “ngủ” và được dùng như một cách nói giảm về cái chết. “An nghỉ” vừa tự nhiên, trang trọng trong tiếng Việt vừa giữ được phần nào hình ảnh nguồn.
- source_word: ἐλευθέρα ἐστίν
  choice: nàng được tự do
  rationale: Diễn tả việc người vợ không còn chịu sự ràng buộc hôn nhân trước đó; “nàng” giúp tránh lặp lại “người vợ” mà vẫn giữ văn phong trang trọng.
- source_word: ᾧ θέλει γαμηθῆναι
  choice: kết hôn với người mình muốn
  rationale: Chuyển đạt tự nhiên quyền lựa chọn người phối ngẫu; tiếng Việt không cần sao chép hình thức bị động của động từ nguyên mẫu Hy Lạp.
- source_word: μόνον ἐν κυρίῳ
  choice: miễn là trong Chúa
  rationale: “Miễn là” thể hiện rõ sức hạn định của μόνον, còn “trong Chúa” bảo tồn cách nói cô đọng và giàu ý nghĩa thần học của Phao-lô.
theological_decisions:
- issue: Ý nghĩa của “trong Chúa” trong chỉ dẫn tái hôn
  choice: Giữ nguyên cách nói “miễn là trong Chúa” trong chính văn.
  alternative: Chỉ kết hôn với một người cùng đức tin; hoặc kết hôn theo cách phù hợp với lòng trung thành đối với Chúa.
  rationale: Cụm ἐν κυρίῳ có tính cô đọng và có thể nhấn mạnh người phối ngẫu thuộc về Chúa hoặc việc kết hôn diễn ra trong phạm vi trung thành với Chúa. Không khai triển trong chính văn để tránh thu hẹp sự hàm nghĩa của câu.
- issue: Cách nói giảm về sự chết
  choice: Dùng “an nghỉ” để giữ hình ảnh ngủ trong một cách diễn đạt tự nhiên.
  alternative: qua đời; chết; ngủ
  rationale: “An nghỉ” truyền đạt rõ đây là cái chết mà vẫn bảo tồn sắc thái nói giảm của κοιμηθῇ; chú thích nêu nghĩa trực tiếp.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Câu giữ cấu trúc đối lập và tính ràng buộc của nguyên văn, đồng thời dùng “an nghỉ” thay vì cách nói quá thô hoặc hình ảnh “ngủ” có thể gây hiểu lầm trong tiếng Việt.
