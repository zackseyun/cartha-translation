id: 1CO.7.38
reference: 1 Corinthians 7:38
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὥστε καὶ ὁ ⸀γαμίζων ⸂τὴν παρθένον ἑαυτοῦ⸃ καλῶς ποιεῖ, ⸂καὶ ὁ⸃ μὴ ⸁γαμίζων κρεῖσσον ⸀ποιήσει.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/038.yaml
  text: So then[a], the one who gives his own virgin in marriage does well, and the one who does not give her in marriage will do better.
translation:
  language: vi
  text: Vậy nên, người nào gả người trinh nữ của mình thì làm điều tốt; còn người nào không gả nàng thì sẽ làm điều tốt hơn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “người nào cưới vị hôn thê còn trinh của mình thì làm điều tốt; còn người nào không cưới nàng thì sẽ làm điều tốt hơn.” Một cách hiểu phổ biến khác cho rằng “người trinh nữ của mình” là con gái của người ấy. Tuy nhiên, động từ Hy Lạp ở đây tự nhiên hơn với nghĩa “gả”, nên bản văn chính giữ nghĩa đó mà không xác định cụ thể mối quan hệ.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὥστε
  choice: Vậy nên
  rationale: Diễn đạt tự nhiên kết luận suy ra từ lập luận ngay trước đó.
- source_word: γαμίζων
  choice: gả
  rationale: Giữ nghĩa tác khiến của γαμίζω là cho một người kết hôn, thay vì đồng nhất với γαμέω, “kết hôn”.
- source_word: τὴν παρθένον ἑαυτοῦ
  choice: người trinh nữ của mình
  rationale: Giữ cách gọi và mối liên hệ sở thuộc trong tiếng Hy Lạp mà không tự ý xác định đó là con gái, người được giám hộ hay vị hôn thê.
- source_word: καλῶς ποιεῖ
  choice: làm điều tốt
  rationale: Chuyển tải sự đánh giá tích cực nhưng không tuyệt đối của cụm từ Hy Lạp bằng lối nói rõ ràng, tự nhiên.
- source_word: μὴ γαμίζων
  choice: không gả nàng
  rationale: Nhất quán với nghĩa tác khiến ở vế trước; “nàng” làm rõ tân ngữ đã được ngầm hiểu.
- source_word: κρεῖσσον ποιήσει
  choice: sẽ làm điều tốt hơn
  rationale: Giữ đúng dạng so sánh hơn của κρεῖσσον, không biến thành so sánh nhất.
theological_decisions:
- issue: Đối tượng của cụm “người trinh nữ của mình” và nghĩa của γαμίζω
  choice: Bản văn chính giữ nghĩa “gả” và không xác định cụ thể quan hệ của người trinh nữ với chủ thể.
  alternative: Có thể hiểu là “người cưới vị hôn thê còn trinh của mình”; một cách hiểu phổ biến khác xác định người trinh nữ là con gái của người ấy.
  rationale: γामίζω tự nhiên hơn với nghĩa tác khiến “gả”, nhưng căn tính xã hội chính xác của người trinh nữ vẫn là vấn đề còn tranh luận. Cách dịch này không áp đặt một sự tái dựng cụ thể lên câu Hy Lạp.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. “Người trinh nữ của mình” hơi khác khẩu ngữ, nhưng cần thiết để bảo toàn sự mơ hồ có thật của nguyên văn; chú thích trình bày các cách hiểu chính.
