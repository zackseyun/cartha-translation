id: 1CO.7.30
reference: 1 Corinthians 7:30
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ οἱ κλαίοντες ὡς μὴ κλαίοντες, καὶ οἱ χαίροντες ὡς μὴ χαίροντες, καὶ οἱ ἀγοράζοντες ὡς μὴ κατέχοντες,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/030.yaml
  text: and those who weep as not weeping[a], and those who rejoice as not rejoicing, and those who buy as not possessing,
translation:
  language: vi
  text: và những người đang khóc thì như thể không khóc[a], những người vui mừng thì như thể không vui mừng, và những người mua thì như thể không sở hữu;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch sát: “như không khóc… như không vui mừng… như không sở hữu.” Tiếng Hy Lạp lặp lại cách nói này để diễn tả thái độ hay cách sống, chứ không phủ nhận rằng những trải nghiệm ấy thực sự xảy ra.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κλαίοντες
  choice: những người khóc
  rationale: Phân từ hiện tại có mạo từ được dùng như danh từ, chỉ những người đang khóc. “Khóc” trực tiếp và cụ thể hơn “than khóc” hay “đau buồn”.
- source_word: ὡς μὴ κλαίοντες
  choice: hãy sống như không khóc
  rationale: ὡς μή với phân từ diễn tả cách sống hoặc thái độ, chứ không phủ nhận việc khóc thực sự xảy ra. Thêm “hãy sống” làm rõ chức năng khuyên bảo vốn được hiểu từ ngữ cảnh, đồng thời giữ cấu trúc cô đọng “như không”.
- source_word: χαίροντες
  choice: những người vui mừng
  rationale: χαίρω thường mang nghĩa vui mừng; cách dịch này tự nhiên, trang trọng vừa phải và song song với “khóc”.
- source_word: ὡς μὴ χαίροντες
  choice: như không vui mừng
  rationale: Giữ cùng cấu trúc “như không” để bảo toàn nhịp điệu và sự căng thẳng tu từ của nguyên văn.
- source_word: ἀγοράζοντες
  choice: những người mua sắm
  rationale: Động từ chỉ hành vi mua nói chung. “Mua sắm” tự nhiên trong tiếng Việt và phù hợp với hoạt động giao dịch thông thường, không nhất thiết hàm ý tiêu dùng xa xỉ.
- source_word: κατέχοντες
  choice: sở hữu
  rationale: Trong thế đối lập với việc mua, κατέχω nói đến việc nắm giữ hay coi vật đã mua là tài sản thuộc quyền mình. “Sở hữu” diễn đạt rõ sắc thái ấy hơn “cầm giữ”.
- source_word: καὶ
  choice: và; những
  rationale: καί lặp lại để nối các nhóm song song. Tiếng Việt giữ “và” ở đầu câu theo mạch văn, rồi dùng dấu chấm phẩy giữa các vế để duy trì nhịp liệt kê mà không gây nặng nề.
theological_decisions:
- issue: Ý nghĩa của cấu trúc lặp lại ὡς μή (“như không”)
  choice: Diễn tả cách sống không bị những kinh nghiệm cảm xúc và tài sản chi phối, chứ không phủ nhận hay tuyệt đối cấm khóc, vui mừng hoặc mua sắm.
  alternative: Hiểu theo nghĩa khổ hạnh mạnh hơn, như thể các hoạt động này tự thân là không thích hợp; hoặc chỉ hiểu theo tâm lý mà bỏ qua bối cảnh cánh chung.
  rationale: Ngữ cảnh gần nói đến hoàn cảnh hiện tại và hình dạng thế gian đang qua đi (1 Cô-rinh-tô 7:26,31). Cấu trúc ὡς μή + phân từ nói về tư thế hay cách hành xử, nên bản dịch giữ sự căng thẳng của lời khuyên mà không biến nó thành lệnh cấm.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Cụm “hãy sống” được nêu một lần để câu tự nhiên và làm rõ lực khuyên bảo; các vế sau lược đi theo phép song song. Dấu chấm phẩy giữ nhịp liệt kê của nguyên văn.
