review_pass:
  verdict: revise
  source_fidelity: Bản nháp giữ đúng ba nhóm phân từ và ý đối lập của ὡς μή. Tuy nhiên, việc thêm “hãy sống” vào vế đầu không có từ tương ứng trong nguyên văn và làm cấu trúc song song của ba vế bị lệch. “Mua sắm” cũng dễ gợi hoạt động tiêu dùng hơn là hành vi mua nói chung của ἀγοράζοντες.
  naturalness: Cấu trúc “như thể không...” lặp lại nghe tự nhiên, sáng nghĩa trong tiếng Việt hiện đại, đồng thời diễn đạt đúng sắc thái thái độ/cách thức. Thêm “thì” làm các nhóm danh ngữ và phần so sánh liên kết rõ mà không thêm nội dung đáng kể.
  terminology: “Đang khóc” phản ánh phân từ hiện tại một cách tự nhiên; “vui mừng,” “mua,” và “sở hữu” phù hợp với χαίροντες, ἀγοράζοντες, và κατέχοντες. Không cần áp đặt cách hiểu khổ hạnh hay giáo phái.
  issues:
  - severity: medium
    issue: Thêm “hãy sống” chỉ ở vế đầu
    rationale: Nguyên văn chỉ có chuỗi các phân từ với ὡς μή, không có động từ mệnh lệnh “hãy sống”. Dù ý hướng khuyên bảo có trong văn mạch, sự thêm này vừa diễn giải vừa phá tính đối xứng của ba vế.
  - severity: low
    issue: “Mua sắm” hẹp sắc thái hơn ἀγοράζοντες
    rationale: Từ Hy Lạp nói chung về những người mua; “mua sắm” trong tiếng Việt hiện đại thường gợi việc shopping/tiêu dùng. “Mua” trực tiếp và bao quát hơn.
