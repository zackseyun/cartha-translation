id: 1CO.7.29
reference: 1 Corinthians 7:29
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τοῦτο δέ φημι, ἀδελφοί, ὁ καιρὸς συνεσταλμένος ⸂ἐστίν· τὸ λοιπὸν⸃ ἵνα καὶ οἱ ἔχοντες γυναῖκας ὡς μὴ ἔχοντες ὦσιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/029.yaml
  text: 'This is what I mean[a], brothers: the time has been shortened, so that from now on even those who have wives should be as though they had none[b],'
translation:
  language: vi
  text: 'Nhưng tôi nói điều này, thưa anh chị em[a]: thời kỳ đã bị rút ngắn[b]; từ nay, cả những người có vợ cũng nên như không có vợ,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn là “anh em”, một dạng số nhiều giống đực trong tiếng Hy Lạp có thể dùng để gọi chung một nhóm tín hữu gồm cả nam lẫn nữ.
    reason: cultural_note
  - marker: b
    text: 'Cũng có thể dịch: “thời điểm đã trở nên ngắn ngủi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο δέ φημι
  choice: điều tôi muốn nói là
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt cho công thức chuyển ý của Phao-lô, giới thiệu lời giải thích mà không biến nó thành một phát biểu khô cứng.
- source_word: ἀδελφοί
  choice: anh chị em
  rationale: Trong ngữ cảnh cộng đồng tín hữu, danh từ số nhiều giống đực có thể dùng để gọi một nhóm gồm cả nam lẫn nữ; “anh chị em” truyền đạt chức năng xưng hô ấy tự nhiên trong tiếng Việt.
- source_word: ὁ καιρός
  choice: thời kỳ
  rationale: καιρός chỉ một thời điểm hoặc thời kỳ mang tính quyết định, không đơn thuần là khoảng thời gian theo niên lịch.
- source_word: συνεσταλμένος ἐστίν
  choice: đã bị rút ngắn
  rationale: 'Giữ sắc thái của cấu trúc hoàn thành quanh co: việc rút ngắn đã xảy ra và tình trạng ấy vẫn còn; thể bị động cũng không tự ý xác định tác nhân.'
- source_word: τὸ λοιπὸν
  choice: từ nay
  rationale: Diễn đạt rõ ý nghĩa thời gian của phần còn lại và dẫn vào hệ quả thực hành tiếp theo.
- source_word: ἵνα
  choice: '[nối bằng dấu chấm rồi mệnh lệnh khuyên nhủ]'
  rationale: Trong mạch câu khó và nén chặt này, tiếng Việt tự nhiên hơn khi thể hiện hệ quả thực hành bằng câu mới; không áp đặt quá mức rằng ἵνα chỉ mục đích hay chỉ kết quả.
- source_word: οἱ ἔχοντες γυναῖκας
  choice: những người có vợ
  rationale: Bám sát cách nói Hy Lạp và xác định γυναῖκας theo ngữ cảnh là “vợ”, thay vì diễn giải rộng thành mọi người đã kết hôn.
- source_word: ὡς μὴ ἔχοντες
  choice: như thể không có
  rationale: Giữ nguyên nét mạnh và gây căng thẳng của phép so sánh, đồng thời tránh lặp lại từ “vợ” một cách nặng nề.
theological_decisions:
- issue: Ý nghĩa mục vụ và thần học của lời dạy về hôn nhân
  choice: Dịch thẳng lời khuyên rằng người có vợ hãy sống như thể không có, không làm nhẹ thành sự xa cách về cảm xúc và cũng không giải thích là hủy bỏ bổn phận hôn nhân.
  alternative: Diễn giải thành “đừng để hôn nhân chi phối” hoặc “hãy sống không quyến luyến hôn nhân”.
  rationale: Câu này đặt các hoàn cảnh xã hội thông thường dưới tính khẩn cấp của thời kỳ đã bị rút ngắn. Bản dịch cần giữ sự căng thẳng ấy; việc dung hòa với các lời dạy khác về hôn nhân thuộc phần giải nghĩa.
- issue: Quan hệ logic của ἵνα với mệnh đề trước
  choice: Thể hiện như hệ quả/lời thúc giục phát sinh từ thời kỳ bị rút ngắn, nhưng không xác quyết riêng nghĩa mục đích hay kết quả.
  alternative: Dịch rõ là “để” theo mục đích hoặc “đến nỗi” theo kết quả.
  rationale: ἵνα có thể mang sắc thái mục đích hoặc hệ quả trong cấu trúc này; cách ngắt câu tiếng Việt bảo tồn độ mở mà vẫn rõ nghĩa.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Thưa anh chị em” giữ sắc thái xưng hô cộng đồng; “thời kỳ” chuyển tải tính chất quyết định của καιρός. Dấu hai chấm và câu tách ngắn làm rõ cú pháp Hy Lạp nén chặt mà không giải nghĩa quá mức.
