revisions:
- from: 'Thưa anh chị em[a], điều tôi muốn nói là: thời kỳ đã bị rút ngắn. Từ nay, ngay cả những người có vợ cũng hãy sống như thể không có[b],'
  to: 'Nhưng tôi nói điều này, thưa anh chị em[a]: thời kỳ đã bị rút ngắn[b]; từ nay, cả những người có vợ cũng nên như không có vợ,'
  rationale: Bản sửa giữ liên kết của δέ, sắc thái hoàn thành của συνεσταλμένος ἐστίν, và lực nối mở của ἵνα mà không biến mệnh đề thành một mệnh lệnh trực tiếp hay giải thích nó thành thái độ cảm xúc. Chú thích từ vựng được sửa cả nội dung lẫn vị trí neo.
  reviewer_model: gpt-5.6-terra
