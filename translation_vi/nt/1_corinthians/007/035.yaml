source:
  edition: SBLGNT
  text: τοῦτο δὲ πρὸς τὸ ὑμῶν αὐτῶν ⸀σύμφορον λέγω, οὐχ ἵνα βρόχον ὑμῖν ἐπιβάλω, ἀλλὰ πρὸς τὸ εὔσχημον καὶ ⸀εὐπάρεδρον τῷ κυρίῳ ἀπερισπάστως.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/035.yaml
  text: I say this for your own benefit, not to put a noose on you, but for what is proper and for undistracted devotion to the Lord.
translation:
  language: vi
  text: Tôi nói điều này vì lợi ích của chính anh chị em, không phải để tròng thòng lọng lên anh chị em[a], nhưng vì điều phải lẽ và để anh chị em chuyên tâm với Chúa, không bị phân tâm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nghĩa đen là “đặt một cái thòng lọng lên”; đây là hình ảnh về việc áp đặt sự ràng buộc hoặc cưỡng ép.
    reason: Giữ hình ảnh cụ thể của βρόχος trong chính văn, đồng thời giải thích nghĩa ẩn dụ cho độc giả hiện đại.
lexical_decisions:
- source_word: σύμφορον
  choice: lợi ích
  rationale: Diễn đạt tự nhiên ý điều có lợi, có ích cho chính người nhận.
- source_word: βρόχον
  choice: dây thòng lọng
  rationale: Giữ nguyên hình ảnh mạnh và cụ thể của từ Hy Lạp thay vì làm nhạt thành một từ trừu tượng như “sự hạn chế”.
- source_word: εὔσχημον
  choice: sống cách phải lẽ
  rationale: Trong ngữ cảnh này, từ chỉ cách cư xử thích hợp, đáng trọng; thêm “sống cách” để câu tiếng Việt tự nhiên mà không thu hẹp nghĩa vào lễ nghi hay thể diện.
- source_word: εὐπάρεδρον
  choice: chuyên tâm với
  rationale: Chuyển tải ý kiên trì ở bên, dành sự chú tâm cho Chúa; tránh diễn giải quá mức thành một hình thức phục vụ cụ thể.
- source_word: ἀπερισπάστως
  choice: không bị phân tâm
  rationale: Phản ánh trực tiếp ý không bị kéo theo nhiều hướng hay xao lãng.
theological_decisions:
- issue: Mục đích lời khuyên của Phao-lô
  choice: “để anh chị em sống cách phải lẽ và chuyên tâm với Chúa”
  alternative: “để đặt quy định kiêng cưới lên anh chị em”
  rationale: Bản văn minh nhiên phủ nhận ý áp đặt một sự trói buộc; lời khuyên hướng đến lợi ích, cách sống thích hợp và sự chuyên tâm, chứ không thiết lập một lệnh cấm hôn nhân.
- issue: Sắc thái của εὐπάρεδρον τῷ κυρίῳ
  choice: “chuyên tâm với Chúa”
  alternative: “phụng sự Chúa”
  rationale: Giữ phạm vi nghĩa rộng của việc bền lòng hướng về và ở bên Chúa, không mặc nhiên đồng nhất với chức vụ hay hoạt động phụng sự cụ thể.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “anh chị em” cho số nhiều ὑμῖν/ὑμῶν; giữ hình ảnh “dây thòng lọng” của nguyên văn, đồng thời sắp xếp mệnh đề mục đích theo cú pháp tiếng Việt tự nhiên.
