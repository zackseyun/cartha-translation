  - severity: low
    issue: “quàng dây thòng lọng vào” không phải cách diễn đạt tự nhiên nhất.
    rationale: βρόχον ἐπιβάλω là hình ảnh đặt hoặc tròng một thòng lọng lên ai đó. “Tròng thòng lọng lên” vừa rõ vừa giữ hình ảnh nguyên văn.
