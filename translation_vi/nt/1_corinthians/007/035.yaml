  verdict: revise
  source_fidelity: 'Bản dịch truyền đạt đúng mạch chính: Phao-lô nói vì lợi ích của người nhận, không nhằm áp đặt một sự trói buộc, nhưng nhằm điều phải lẽ và sự chuyên tâm không bị phân tâm đối với Chúa. Tuy nhiên, “sống cách phải lẽ” chuyển danh ngữ τὸ εὔσχημον (“điều phải lẽ/thích đáng”) thành một mệnh đề về lối sống, và “quàng dây thòng lọng vào” chưa tự nhiên bằng cách diễn đạt sát hình ảnh “đặt/tròng thòng lọng lên”.'
