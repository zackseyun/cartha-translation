  terminology: “lợi ích,” “thòng lọng,” “điều phải lẽ,” “chuyên tâm,” và “Chúa” đều phù hợp với ngữ cảnh và văn phong Kinh Thánh tiếng Việt hiện đại. “Chuyên tâm với Chúa, không bị phân tâm” bảo toàn εὐπάρεδρον ... ἀπερισπάστως mà không áp đặt nghĩa chức vụ chuyên biệt.
  issues:
  - severity: low
    issue: “sống cách phải lẽ” diễn giải τὸ εὔσχημον.
