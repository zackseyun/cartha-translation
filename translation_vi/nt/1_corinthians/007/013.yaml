  text: καὶ γυνὴ ⸂εἴ τις⸃ ἔχει ἄνδρα ἄπιστον, καὶ ⸀οὗτος συνευδοκεῖ οἰκεῖν μετ’ αὐτῆς, μὴ ἀφιέτω ⸂τὸν ἄνδρα⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/013.yaml
  text: And if a woman has an unbelieving husband[a], and he consents to live with her, she must not leave her husband.
translation:
  language: vi
  text: Còn nếu một phụ nữ có chồng không tin Chúa, và người chồng ấy bằng lòng chung sống với người ấy, thì người ấy không được lìa bỏ chồng mình.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “không được ly dị chồng mình.” Động từ Hy Lạp theo nghĩa đen là “rời bỏ” hoặc “đuổi đi”; trong ngữ cảnh này, động từ ấy chỉ việc chấm dứt quan hệ hôn nhân.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γυνὴ εἴ τις
  choice: nếu một người nữ
  rationale: Cụm điều kiện bất định nêu một trường hợp chung. “Một người nữ” giữ được nghĩa cơ bản của γυνή, còn “có chồng” ngay sau đó làm rõ đây là người đã kết hôn.
- source_word: ἔχει ἄνδρα ἄπιστον
  choice: có chồng không tin Chúa
  rationale: Trong ngữ cảnh hôn nhân, ἀνήρ là “chồng.” ἄπιστος chỉ người không cùng đức tin Cơ Đốc; “không tin Chúa” tự nhiên và tránh để “bất tín” bị hiểu là không chung thủy trong hôn nhân.
- source_word: οὗτος
  choice: người chồng ấy
  rationale: Đại từ chỉ định quy chiếu rõ về người chồng vừa được nhắc đến; cách diễn đạt này tự nhiên và tránh mơ hồ trong tiếng Việt.
- source_word: συνευδοκεῖ
  choice: bằng lòng
  rationale: Động từ diễn tả sự đồng thuận tự nguyện. “Bằng lòng” là cách nói hiện đại, rõ ràng và phù hợp với quan hệ hôn nhân.
- source_word: οἰκεῖν μετ’ αὐτῆς
  choice: chung sống với chị
  rationale: Cụm từ nói đến việc tiếp tục đời sống chung trong gia đình. “Chung sống” tự nhiên hơn “cư ngụ” và mang sắc thái hôn nhân thích hợp.
- source_word: μὴ ἀφιέτω τὸν ἄνδρα
  choice: chị không được lìa bỏ chồng mình
  rationale: Trong ngữ cảnh hôn nhân, ἀφίημι có thể chỉ việc rời bỏ hoặc chấm dứt quan hệ. “Lìa bỏ” giữ gần hình ảnh của từ Hy Lạp mà không thu hẹp nghĩa hoàn toàn vào thủ tục ly hôn pháp lý.
theological_decisions:
- issue: Phạm vi nghĩa của ἀφιέτω trong lời dạy về hôn nhân khác niềm tin
  choice: dịch là “không được lìa bỏ chồng mình”
  alternative: “không được ly dị chồng mình”
  rationale: “Lìa bỏ” bảo tồn độ rộng nghĩa của động từ Hy Lạp, vốn có thể nói đến việc rời bỏ hay chấm dứt quan hệ hôn nhân. “Ly dị” truyền đạt hệ quả hôn nhân rõ hơn nhưng có thể khiến người đọc chỉ nghĩ đến một thủ tục pháp lý hiện đại.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “chị” để quy chiếu tự nhiên về người nữ đã được nêu, đồng thời tránh sắc thái xa cách của việc lặp lại “người nữ.”
