id: 1CO.7.40
reference: 1 Corinthians 7:40
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: μακαριωτέρα δέ ἐστιν ἐὰν οὕτως μείνῃ, κατὰ τὴν ἐμὴν γνώμην, δοκῶ ⸀δὲ κἀγὼ πνεῦμα θεοῦ ἔχειν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/040.yaml
  text: But she is happier if she remains as she is[a], according to my judgment—and I think that I also have the Spirit of God.
translation:
  language: vi
  text: Nhưng bà sẽ hạnh phúc hơn nếu cứ ở vậy[a], theo nhận định của tôi; và tôi nghĩ rằng tôi cũng có Thần Khí của Đức Chúa Trời.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “được phước hơn.” Từ Hy Lạp μακαριωτέρα có thể chỉ tình trạng được phước hơn cũng như hạnh phúc hơn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μακαριωτέρα
  choice: hạnh phúc hơn
  rationale: Dạng so sánh của μακάριος. Trong lời khuyên mục vụ thực tiễn ở đây, “hạnh phúc hơn” tự nhiên và rõ nghĩa trong tiếng Việt hiện đại; tuy vậy, từ Hy Lạp cũng có thể mang sắc thái “được phước hơn,” nên ghi chú bảo lưu khả năng này.
- source_word: ἐὰν οὕτως μείνῃ
  choice: nếu cứ ở vậy
  rationale: μένω là “ở lại, tiếp tục ở trong một tình trạng,” còn οὕτως quy chiếu về tình trạng không tái hôn đang được bàn đến. “Cứ ở vậy” tự nhiên, gọn và không diễn giải quá mức.
- source_word: κατὰ τὴν ἐμὴν γνώμην
  choice: theo nhận định của tôi
  rationale: γνώμη chỉ một sự đánh giá hay phán đoán đã cân nhắc. “Nhận định” trang trọng vừa phải, tránh sắc thái quá tùy tiện của “ý kiến” nhưng vẫn phân biệt lời khuyên này với một mệnh lệnh trực tiếp của Chúa.
- source_word: δοκῶ
  choice: tôi nghĩ rằng
  rationale: Giữ cách khẳng định khiêm nhường về mặt tu từ của Phao-lô mà không biến câu thành sự hoài nghi thật sự.
- source_word: κἀγὼ
  choice: tôi cũng
  rationale: Bảo toàn ý bổ sung của κἀγώ (“và tôi cũng/tôi cũng vậy”), có thể hàm ý đối chiếu với những người khác tự nhận có thẩm quyền thuộc linh.
- source_word: πνεῦμα θεοῦ
  choice: Thần Khí của Đức Chúa Trời
  rationale: Trong cách dùng của Phao-lô tại đây, cụm từ chỉ Thần Khí của Đức Chúa Trời chứ không đơn thuần là tâm thế thuộc linh. Viết hoa “Thần Khí” thể hiện sở chỉ ngôi vị mà không thêm chữ “Thánh” vốn không có trong nguyên văn.
- source_word: ἔχειν
  choice: có
  rationale: Cách dịch trực tiếp, tự nhiên của động từ nguyên mẫu bổ nghĩa cho δοκῶ; không cần dùng từ trang trọng hơn như “sở hữu”.
theological_decisions:
- issue: πνεῦμα θεοῦ chỉ Thánh Linh hay một tâm thế/khả năng nhận biết thuộc linh nói chung
  choice: Dịch là “Thần Khí của Đức Chúa Trời,” hiểu là Thánh Linh.
  alternative: “một thần khí từ Đức Chúa Trời” hoặc “sự soi dẫn thuộc linh từ Đức Chúa Trời”
  rationale: Cách dùng thông thường của cụm πνεῦμα θεοῦ trong thư Phao-lô và chức năng của câu trong ngữ cảnh đều hướng đến Thần Khí của Đức Chúa Trời. Câu khẳng định tính chính đáng thuộc linh của nhận định, nhưng không biến nhận định ấy thành lời truyền trực tiếp của Chúa.
- issue: Sức nặng của δοκῶ trong lời tự quy chiếu của Phao-lô
  choice: 'Giữ một lời khẳng định có thật nhưng được diễn đạt khiêm nhường: “tôi nghĩ rằng tôi cũng có...”'
  alternative: Diễn đạt như Phao-lô thật sự không chắc mình có Thần Khí, hoặc như một lời mỉa mai công khai
  rationale: δοκῶ tạo sắc thái khiêm nhường hay dè dặt về tu từ, nhưng ngữ cảnh không đòi hỏi hiểu là nghi ngờ thực sự. Bản dịch bảo lưu cả sự khiêm nhường lẫn thẩm quyền được Thần Khí hướng dẫn.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. “Bà” duy trì sở chỉ nữ giới trong ngữ cảnh người góa chồng; “cứ ở vậy” liên kết tự nhiên với tình trạng không tái hôn mà không đưa phần giải thích đó vào chính văn. Dấu chấm phẩy giữ hai vế nhận định và lời xác quyết liên hệ chặt chẽ.
