  to: Nhưng dù anh em có kết hôn[a], anh em cũng không phạm tội; và nếu trinh nữ kết hôn, người ấy cũng không phạm tội. Tuy nhiên, những người như thế sẽ gặp gian truân trong xác thịt[b], còn tôi muốn anh em được miễn khỏi điều đó.
  rationale: Chỉnh cụm cuối để diễn đạt φείδομαι sát hơn và tự nhiên hơn trong tiếng Việt, nhưng vẫn giữ ý mục vụ rằng Phao-lô nêu cảnh báo này nhằm giúp người đọc được miễn khỏi gian truân. Đổi “người nữ đồng trinh” thành “trinh nữ” để câu gọn, hiện đại, mà không khái quát hóa παρθένος thành chỉ “người chưa kết hôn.” Các chú thích được giữ nguyên nội dung thiết yếu và đúng vị trí neo.
