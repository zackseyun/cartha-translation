    issue: Sắc thái của φείδομαι chưa được phản ánh sát trong “còn tôi muốn tránh cho anh em điều đó.”
    rationale: φείδομαι là động từ hiện tại, nghĩa là “tha/miễn/spare.” Bản nháp biến nó thành “muốn” và thêm một cách diễn đạt hơi gượng (“tránh cho ... điều đó”). “Tôi muốn anh em được miễn khỏi điều đó” là tiếng Việt tự nhiên hơn, đồng thời diễn đạt đúng ý Phao-lô nêu mục đích khi cảnh báo về gian truân.
  - severity: low
    issue: “Người nữ đồng trinh” hơi nặng trong văn phong hiện đại.
    rationale: “Trinh nữ” giữ trọn nghĩa của παρθένος và phù hợp hơn với cách nói tiếng Việt trang trọng, hiện đại.
