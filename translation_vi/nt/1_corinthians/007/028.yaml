id: 1CO.7.28
reference: 1 Corinthians 7:28
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐὰν δὲ καὶ ⸀γαμήσῃς, οὐχ ἥμαρτες. καὶ ἐὰν γήμῃ ἡ παρθένος, οὐχ ἥμαρτεν. θλῖψιν δὲ τῇ σαρκὶ ἕξουσιν οἱ τοιοῦτοι, ἐγὼ δὲ ὑμῶν φείδομαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/028.yaml
  text: But even if you marry[a], you have not sinned; and if the virgin marries, she has not sinned. Yet such people will have tribulation in the flesh[b], and I am sparing you.
translation:
  language: vi
  text: Nhưng dù anh em có kết hôn[a], anh em cũng không phạm tội; và nếu trinh nữ kết hôn, người ấy cũng không phạm tội. Tuy nhiên, những người như thế sẽ gặp gian truân trong xác thịt[b], còn tôi muốn anh em được miễn khỏi điều đó.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “nếu anh em kết hôn.” Từ “dù” làm nổi bật rằng ngay cả khi họ kết hôn, việc ấy vẫn không phải là tội.'
    reason: discourse_alternative
  - marker: b
    text: “Gian truân trong xác thịt” có thể chỉ những khó khăn, đau khổ trong đời sống thân xác hoặc trần thế gắn với hôn nhân, chứ không nhất thiết nói đến “bản tính tội lỗi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: γαμήσῃς
  choice: anh em có kết hôn
  rationale: Mệnh đề điều kiện với ἐάν và động từ giả định aorist được diễn đạt tự nhiên bằng “nếu/dù… có kết hôn”, giữ hướng tương lai mà không hàm ý đây là điều nên làm.
- source_word: ἥμαρτες / ἥμαρτεν
  choice: không phạm tội
  rationale: Trong tiếng Việt, “không phạm tội” diễn đạt tự nhiên phán định đạo đức rằng việc kết hôn không cấu thành tội lỗi; không cần mô phỏng cứng nhắc thì aorist.
- source_word: ἡ παρθένος
  choice: người nữ đồng trinh
  rationale: Giữ nghĩa cụ thể của παρθένος thay vì khái quát thành “người phụ nữ chưa kết hôn”; “người nữ đồng trinh” trang trọng và rõ nghĩa trong văn cảnh.
- source_word: θλῖψιν
  choice: gian truân
  rationale: “Gian truân” bao quát áp lực, khốn khó và đau khổ, đồng thời tự nhiên hơn “hoạn nạn” trong lời cảnh báo về đời sống hôn nhân.
- source_word: τῇ σαρκὶ
  choice: trong xác thịt
  rationale: Giữ hình thức và tính mở nghĩa của cụm Hy Lạp, không diễn giải thành “bản tính tội lỗi”; chú thích làm rõ khả năng chỉ những khó khăn thuộc đời sống thân xác, trần thế.
- source_word: οἱ τοιοῦτοι
  choice: những người như thế
  rationale: Giữ cách quy chiếu khái quát của nguyên văn đến những người kết hôn.
- source_word: φείδομαι
  choice: tôi muốn tránh cho anh em điều đó
  rationale: Diễn đạt tự nhiên mục đích quan tâm của Phao-lô là muốn miễn cho họ khỏi gian truân vừa nói, trong khi tránh hàm ý chắc chắn rằng ông đã làm được điều ấy.
theological_decisions:
- issue: Ý nghĩa của σάρξ trong τῇ σαρκί
  choice: “trong xác thịt”, chỉ những gian truân trong đời sống thân xác/trần thế
  alternative: “trong bản tính tội lỗi” hoặc “trong đời này”
  rationale: Văn cảnh nói về khó khăn mà người kết hôn sẽ gặp, không phải đưa ra một nhận định về bản tính tội lỗi. Bản dịch chính giữ hình ảnh của nguyên văn, còn chú thích nêu nghĩa có khả năng nhất.
- issue: Sắc thái của φείδομαι
  choice: “tôi muốn tránh cho anh em điều đó”
  alternative: “tôi đang tránh cho anh em” hoặc “tôi miễn cho anh em”
  rationale: Dạng hiện tại có thể được hiểu là lời bày tỏ ý hướng mục vụ. Cách dịch được chọn tự nhiên trong tiếng Việt và không khẳng định quá mức kết quả của hành động.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” theo lối xưng hô cộng đồng trong thư tín Tân Ước; “cô ấy” giúp tránh lặp nặng nhưng vẫn xác định rõ chủ thể nữ. Giữ “xác thịt” trong câu chính để bảo toàn hình ảnh và độ mở thần học của nguyên văn.
