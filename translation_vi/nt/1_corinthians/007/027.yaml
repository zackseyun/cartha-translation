  naturalness: «Bạn đang bị ràng buộc với vợ sao?» hiểu được, nhưng «đang» không cần thiết cho thể hoàn thành diễn tả tình trạng hiện tại. «Đừng tìm cách tháo gỡ» tự nhiên, gọn hơn, và vẫn phù hợp với tính không xác định của nguyên văn. Thêm «một» trong mệnh lệnh cuối giúp tiếng Việt biểu đạt rõ nghĩa tìm một người vợ mà không làm thay đổi ý câu.
