base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/027.yaml
  text: Are you bound to a wife? Do not seek release[a]. Are you released from a wife? Do not seek a wife.
translation:
  language: vi
  text: Bạn bị ràng buộc với vợ sao? Đừng tìm cách tháo gỡ.[a] Bạn đã được tháo gỡ khỏi vợ sao? Đừng tìm một người vợ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc, dịch theo nghĩa diễn giải hơn: “Bạn đã kết hôn sao? Đừng tìm cách ly dị. Bạn đã ly dị sao? Đừng tìm một người vợ.” Tiếng Hy Lạp nói sát nghĩa hơn về việc “bị ràng buộc” và “được tháo gỡ”.'
    reason: alternative_reading
lexical_decisions:
- source_word: δέδεσαι
  choice: đang bị ràng buộc
  rationale: Thể hoàn thành của δέω diễn tả tình trạng hiện tại do một hành động đã xảy ra; cách dịch này giữ nguyên hình ảnh “buộc/ràng buộc” và tạo thế đối ứng với λύσιν/λέλυσαι.
- source_word: γυναικί
  choice: với vợ
  rationale: Trong văn cảnh hôn nhân, γυνή chỉ người vợ; giới từ “với” diễn đạt tự nhiên quan hệ đi cùng động từ “ràng buộc” trong tiếng Việt.
- source_word: μὴ ζήτει
  choice: đừng tìm cách
  rationale: ζητέω có nghĩa là tìm kiếm hoặc theo đuổi; “đừng tìm cách” tự nhiên trong mệnh lệnh phủ định và phù hợp khi bổ ngữ là một tình trạng được tháo gỡ.
- source_word: λύσιν
  choice: được tháo gỡ
  rationale: λύσις chỉ sự nới ra hoặc giải thoát. Cách dịch này bảo tồn liên hệ từ vựng với λέλυσαι mà không thu hẹp nghĩa thành “ly dị”.
- source_word: λέλυσαι
  choice: đã được tháo gỡ
  rationale: Thể hoàn thành của λύω nhấn mạnh tình trạng đã được tháo khỏi mối ràng buộc; cách dịch giữ sự tương ứng với λύσιν và không quyết định quá mức rằng đây chỉ là ly dị.
- source_word: ἀπὸ γυναικός
  choice: khỏi vợ
  rationale: ἀπό diễn tả sự tách khỏi; γυνή trong văn cảnh này là “vợ”. “Khỏi vợ” giữ nét khác thường nhưng rõ của hình ảnh nguồn.
- source_word: γυναῖκα
  choice: vợ
  rationale: Trong lời khuyên về tình trạng hôn nhân, γυνή mang nghĩa “vợ”; tiếng Việt không cần mạo từ tương ứng với tiếng Hy Lạp.
theological_decisions:
- issue: Nên dùng thuật ngữ hôn nhân minh nhiên hay giữ hình ảnh ràng buộc/tháo gỡ của câu Hy Lạp
  choice: Giữ hình ảnh “bị ràng buộc” và “được tháo gỡ” trong chính văn.
  alternative: “Bạn đã kết hôn sao? Đừng tìm cách ly dị. Bạn đã ly dị sao? Đừng tìm vợ.”
  rationale: Bản Hy Lạp dùng nhóm từ δέω/λύω chứ không dùng từ ngữ minh nhiên về kết hôn và ly dị. Giữ hình ảnh nguồn bảo toàn tính mơ hồ thật sự—có thể liên quan đến ly dị, góa bụa, hoặc tình trạng không còn bị ràng buộc—mà không áp đặt một phạm vi pháp lý hẹp hơn.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Cấu trúc câu hỏi ngắn đi với “sao?” giữ nhịp khuyên bảo trực tiếp. “Tháo gỡ” được dùng nhất quán để bảo tồn phép đối xứng từ vựng của nguyên bản; chú thích cung cấp cách hiểu hôn nhân minh nhiên hơn.
