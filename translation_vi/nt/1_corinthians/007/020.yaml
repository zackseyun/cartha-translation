  rationale: Bổ sung “vào” sau “được gọi” để làm rõ rằng người ấy được gọi trong/vào sự kêu gọi hay hoàn cảnh được nói đến, thay vì để cụm danh từ trước đó có thể bị hiểu là tác nhân gọi. Bản sửa vẫn giữ được lối lặp từ và độ mở nghĩa của κλῆσις.
