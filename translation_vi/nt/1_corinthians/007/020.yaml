  text: ἕκαστος ἐν τῇ κλήσει ᾗ ἐκλήθη ἐν ταύτῃ μενέτω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/020.yaml
  text: Each one should remain in the calling in which he was called[a][b].
translation:
  language: vi
  text: Mỗi người hãy cứ ở trong sự kêu gọi mà mình đã được gọi vào.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Sự kêu gọi” cũng có thể được hiểu là “hoàn cảnh,” “tình trạng” hoặc “địa vị trong đời sống.” Tiếng Hy Lạp dùng danh từ “sự kêu gọi” bên cạnh động từ “được gọi,” tạo nên sự lặp từ có chủ ý.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕκαστος
  choice: Mỗi người
  rationale: Giữ sắc thái phân phối ở số ít, nhấn mạnh lời chỉ dẫn áp dụng cho từng tín hữu.
- source_word: κλήσει
  choice: sự kêu gọi
  rationale: Giữ nghĩa trực tiếp là “sự kêu gọi” và duy trì sự lặp từ có chủ ý với ἐκλήθη; trong văn cảnh, từ này đồng thời gợi đến hoàn cảnh hay địa vị của một người khi được kêu gọi.
- source_word: ᾗ ἐκλήθη
  choice: mà mình đã được gọi
  rationale: Giữ thể bị động không nêu rõ tác nhân, đồng thời dùng “mình” tự nhiên trong tiếng Việt để quy chiếu về “mỗi người” mà không áp đặt giới tính.
- source_word: μενέτω
  choice: hãy cứ ở
  rationale: Diễn đạt mệnh lệnh hiện tại với ý tiếp tục ở trong tình trạng đang nói đến; “hãy cứ” có lực khuyên truyền rõ ràng nhưng không biến câu thành một mệnh lệnh tuyệt đối cứng nhắc.
theological_decisions:
- issue: Ý nghĩa của κλῆσις trong văn cảnh
  choice: Giữ “sự kêu gọi” trong chính văn và giải thích nghĩa hoàn cảnh, tình trạng trong chú thích.
  alternative: hoàn cảnh; tình trạng; địa vị trong đời sống
  rationale: Văn cảnh nói đến những tình trạng cụ thể như chịu cắt bì hay làm nô lệ, nhưng Phao-lô cố ý đặt κλήσει cạnh ἐκλήθη. Cách dịch này không thu hẹp từ ngữ thành ý nghĩa xã hội đơn thuần, mà giữ nguyên mối căng giữa sự kêu gọi của Đức Chúa Trời và hoàn cảnh khi một người được gọi.
- issue: Thể bị động của ἐκλήθη
  choice: Dịch là “đã được gọi” mà không thêm chủ thể.
  alternative: đã được Đức Chúa Trời gọi
  rationale: Văn cảnh có thể cho thấy Đức Chúa Trời là Đấng gọi, nhưng bản Hy Lạp không nêu tác nhân ngay trong câu này; vì vậy không bổ sung vào chính văn.
- issue: Giống ngữ pháp của hình thức số ít
  choice: Dùng “mỗi người” và đại từ phản thân “mình”.
  alternative: người ấy; người đó
  rationale: Tiếng Việt không bắt buộc đánh dấu giống ở đây. “Mình” giữ quy chiếu số ít, tự nhiên và áp dụng cho từng tín hữu mà không làm thay đổi phạm vi của câu.
translation_notes:
  register: Văn phong trang trọng, hiện đại. Cụm “sự kêu gọi mà mình đã được gọi” hơi lặp theo cách nói tiếng Việt, nhưng sự lặp này được giữ có chủ ý để phản ánh lối chơi chữ và sức căng ý nghĩa trong nguyên bản Hy Lạp.
