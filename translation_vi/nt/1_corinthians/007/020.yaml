  verdict: revise
  source_fidelity: Bản nháp giữ được tính phân phối của ἕκαστος, mệnh lệnh tiếp diễn của μενέτω, thể bị động không nêu tác nhân của ἐκλήθη, và chủ ý lặp lại giữa κλήσις / ἐκλήθη. Tuy nhiên, “sự kêu gọi mà mình đã được gọi” trong tiếng Việt dễ được hiểu là ‘sự kêu gọi đã gọi mình’, thay vì phản ánh quan hệ ‘trong/vào sự kêu gọi ấy mà người ấy đã được gọi’ (ἐν ᾗ ἐκλήθη). Thêm “vào” làm rõ quan hệ này mà không giải quyết trước sự mơ hồ ngữ nghĩa của κλῆσις.
  naturalness: “Mỗi người hãy cứ ở trong...” là văn phong hiện đại, trang trọng và diễn đạt tự nhiên ý tiếp tục duy trì. Cụm có lặp từ vẫn hơi nặng, nhưng đây là sự lặp có cơ sở trong nguyên ngữ và được chú thích; thêm “vào” khiến cú pháp tiếng Việt rõ và tự nhiên hơn.
  terminology: Giữ “sự kêu gọi” là phù hợp để bảo toàn liên hệ từ vựng với “được gọi” và không thu hẹp κλῆσις thành địa vị xã hội. Chú thích nêu các khả năng “hoàn cảnh,” “tình trạng,” và “địa vị trong đời sống” một cách cân bằng, không áp đặt cách giải thích thần học nào.
