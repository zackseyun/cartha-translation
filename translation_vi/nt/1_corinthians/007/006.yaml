  text: τοῦτο δὲ λέγω κατὰ συγγνώμην, οὐ κατ’ ἐπιταγήν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/006.yaml
  text: But I say this as a concession[a], not as a command.
translation:
  language: vi
  text: Nhưng tôi nói điều này như một sự nhượng bộ[a], chứ không phải như một mệnh lệnh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “theo cách nhượng bộ” hoặc “như một sự cho phép.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο
  choice: điều này
  rationale: Đại từ chỉ định hướng đến lời đang được bàn trong văn cảnh mà không xác định quá mức là câu trước hay câu sau.
- source_word: δὲ
  choice: Nhưng
  rationale: Diễn đạt sắc thái chuyển ý và đối lập nhẹ giữa sự nhượng bộ với mệnh lệnh.
- source_word: λέγω
  choice: tôi nói
  rationale: Cách dịch hiện tại chỉ định tự nhiên, trực tiếp trong tiếng Việt.
- source_word: κατὰ συγγνώμην
  choice: như một sự nhượng bộ
  rationale: Trong văn cảnh, cụm từ chỉ một điều được cho phép chứ không bắt buộc; cách dịch này giữ rõ thế đối lập với κατ’ ἐπιταγήν.
- source_word: οὐ κατ’ ἐπιταγήν
  choice: chứ không phải như một mệnh lệnh
  rationale: Diễn đạt rõ sự phủ định và tính chất không bắt buộc của lời nói, đồng thời bảo toàn cấu trúc đối lập của nguyên văn.
theological_decisions:
- issue: Lời của Phao-lô là sự cho phép mang tính cá nhân hay một mệnh lệnh thần thượng ở mức thấp hơn
  choice: Phao-lô minh nhiên trình bày điều này như một sự nhượng bộ, không phải mệnh lệnh bắt buộc.
  alternative: Đây là lời khuyên vẫn có thể mang thẩm quyền sứ đồ theo nghĩa gián tiếp.
  rationale: Bản dịch giữ nguyên sự phân biệt mà câu Hy Lạp nêu ra, không suy giảm thẩm quyền sứ đồ của Phao-lô và cũng không biến sự nhượng bộ thành mệnh lệnh.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Sự nhượng bộ” giữ được sắc thái cho phép nhưng không bắt buộc; chú thích cung cấp các cách diễn đạt tự nhiên khác nhằm phản ánh phạm vi nghĩa của συγγνώμη.
