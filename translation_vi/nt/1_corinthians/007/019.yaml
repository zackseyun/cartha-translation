id: 1CO.7.19
reference: 1 Corinthians 7:19
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἡ περιτομὴ οὐδέν ἐστιν, καὶ ἡ ἀκροβυστία οὐδέν ἐστιν, ἀλλὰ τήρησις ἐντολῶν θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/019.yaml
  text: Circumcision is nothing[a], and uncircumcision is nothing, but keeping the commandments of God.
translation:
  language: vi
  text: Phép cắt bì chẳng là gì[a], và tình trạng không cắt bì cũng chẳng là gì; điều quan trọng là vâng giữ các điều răn của Đức Chúa Trời.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “không đáng kể”; cách hiểu này áp dụng cho cả hai lần dùng cụm “chẳng là gì”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: περιτομή
  choice: phép cắt bì
  rationale: Danh từ thông dụng và trang trọng trong tiếng Việt, giữ trọng tâm vào dấu hiệu căn tính giao ước hơn là riêng hành động thực hiện nghi thức.
- source_word: οὐδέν ἐστιν
  choice: chẳng là gì
  rationale: Giữ cách nói mạnh, ngắn gọn và cấu trúc lặp lại của tiếng Hy Lạp; chú thích nêu cách hiểu tự nhiên hơn theo nghĩa đánh giá.
- source_word: ἀκροβυστία
  choice: tình trạng không cắt bì
  rationale: Diễn đạt rõ nghĩa danh từ Hy Lạp trong tiếng Việt hiện đại, đồng thời duy trì sự đối xứng với “phép cắt bì”.
- source_word: ἀλλά
  choice: điều quan trọng là
  rationale: Trong mệnh đề không có động từ, cách chuyển ý này thể hiện tự nhiên sự tương phản mạnh giữa hai điều không đáng kể và điều thực sự đáng kể, mà không bổ sung một kết luận thần học rộng hơn.
- source_word: τήρησις
  choice: vâng giữ
  rationale: Bao hàm cả việc tuân theo và gìn giữ, phù hợp tự nhiên với “các điều răn” và phản ánh ý nghĩa tuân thủ của danh từ Hy Lạp.
- source_word: ἐντολῶν θεοῦ
  choice: các điều răn của Đức Chúa Trời
  rationale: Giữ danh từ số nhiều cụ thể và quan hệ sở hữu của nguyên văn; “Đức Chúa Trời” phù hợp văn phong Kinh Thánh tiếng Việt trang trọng.
theological_decisions:
- issue: Cách Phao-lô đánh giá phép cắt bì và tình trạng không cắt bì
  choice: Cả hai đều “chẳng là gì” khi được đặt tương phản với việc vâng giữ các điều răn của Đức Chúa Trời.
  alternative: Câu này tuyên bố phép cắt bì hoàn toàn không có bất kỳ ý nghĩa đạo đức nào trong mọi phương diện.
  rationale: Bản dịch giữ nguyên lời khẳng định mạnh và sự căng thẳng trong câu, nhưng không mở rộng nó thành kết luận thần học vượt quá lập luận trực tiếp của phân đoạn.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dấu chấm phẩy giúp làm rõ bước chuyển sang điều được nhấn mạnh. Cấu trúc lặp lại được duy trì, còn “điều quan trọng là” làm cho mệnh đề danh từ cuối câu tự nhiên trong tiếng Việt.
