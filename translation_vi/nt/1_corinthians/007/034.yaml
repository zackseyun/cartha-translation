id: 1CO.7.34
reference: 1 Corinthians 7:34
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸀καὶ μεμέρισται. καὶ ἡ γυνὴ ⸂ἡ ἄγαμος⸃ καὶ ἡ ⸀παρθένος μεριμνᾷ τὰ τοῦ κυρίου, ἵνα ᾖ ἁγία καὶ ⸀τῷ σώματι καὶ ⸁τῷ πνεύματι· ἡ δὲ γαμήσασα μεριμνᾷ τὰ τοῦ κόσμου, πῶς ⸀ἀρέσῃ τῷ ἀνδρί.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/034.yaml
  text: And she is divided. And the unmarried woman[a], that is, the virgin, is concerned about the things of the Lord, so that she may be holy both in body and in spirit. But the married woman is concerned about the things of the world, how she may please her husband.
translation:
  language: vi
  text: Và người nữ ấy bị phân tâm. Còn người nữ chưa kết hôn, tức là người nữ đồng trinh,[a] thì quan tâm đến những việc của Chúa, để thánh khiết cả về thân thể lẫn tâm linh. Nhưng người nữ đã kết hôn thì quan tâm đến những việc của thế gian, làm sao để đẹp lòng chồng mình.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Còn người nữ chưa kết hôn và người nữ đồng trinh thì quan tâm đến những việc của Chúa.” Tiếng Hy Lạp có thể được hiểu là liệt kê hai hạng người, thay vì xem “người nữ đồng trinh” là lời giải thích cho “người nữ chưa kết hôn”.'
    reason: alternative_reading
lexical_decisions:
- source_word: μεμέρισται
  choice: bị phân tâm
  rationale: Diễn đạt trạng thái có những mối quan tâm bị chia ra, đồng thời giữ liên hệ với ý ở câu trước; tự nhiên hơn lối dịch sát chữ “bị phân chia” trong tiếng Việt.
- source_word: γυνὴ ἡ ἄγαμος
  choice: người nữ chưa kết hôn
  rationale: γυνή ở đây chỉ người nữ, còn ἄγαμος xác định tình trạng chưa kết hôn; cách dịch này rõ ràng trong thế đối lập với người nữ đã kết hôn.
- source_word: παρθένος
  choice: người nữ đồng trinh
  rationale: Giữ nét nghĩa cụ thể của παρθένος thay vì làm nhạt thành một từ chỉ chung người con gái chưa chồng.
- source_word: γυνὴ ἡ ἄγαμος καὶ ἡ παρθένος
  choice: người nữ chưa kết hôn, tức là người nữ đồng trinh
  rationale: Hiểu cụm từ theo quan hệ đồng vị/giải thích, phù hợp với động từ số ít μεριμνᾷ; cách hiểu liệt kê hai hạng người vẫn được ghi ở chú thích.
- source_word: μεριμνᾷ
  choice: quan tâm đến
  rationale: Trong văn cảnh, từ này nói đến sự chú tâm hoặc bận lòng, không nhất thiết là lo âu có tính tiêu cực.
- source_word: τὰ τοῦ κυρίου
  choice: những việc của Chúa
  rationale: Giữ cấu trúc đối xứng với “những việc của thế gian” và sắc thái rộng của cụm Hy Lạp.
- source_word: ἵνα ᾖ ἁγία
  choice: để được thánh khiết
  rationale: Diễn đạt mục đích của ἵνα với thể giả định và giữ nguyên ngôn ngữ về sự thánh khiết.
- source_word: τῷ σώματι καὶ τῷ πνεύματι
  choice: cả về thân thể lẫn tâm linh
  rationale: Thể hiện hai phương diện mà sự thánh khiết được nói đến, không suy diễn thêm một hệ nhân học cụ thể.
- source_word: ἡ δὲ γαμήσασα
  choice: người nữ đã kết hôn
  rationale: Phân từ aorist được dùng như danh từ để chỉ người nữ trong tình trạng hôn nhân; cách dịch tự nhiên và đối xứng trong tiếng Việt.
- source_word: τὰ τοῦ κόσμου
  choice: những việc của thế gian
  rationale: Giữ sự song hành với “những việc của Chúa” mà không tự động gán sắc thái tội lỗi cho các trách nhiệm đời sống.
- source_word: πῶς ἀρέσῃ τῷ ἀνδρί
  choice: làm sao để đẹp lòng chồng mình
  rationale: Trong văn cảnh hôn nhân, ἀνήρ mang nghĩa “chồng”; “đẹp lòng” là cách diễn đạt tự nhiên cho ἀρέσκω.
theological_decisions:
- issue: Cụm “người nữ chưa kết hôn và người nữ đồng trinh” chỉ hai hạng người hay là một cụm đồng vị giải thích?
  choice: 'Dịch theo quan hệ đồng vị: “người nữ chưa kết hôn, tức là người nữ đồng trinh”.'
  alternative: 'Dịch theo quan hệ phối hợp: “người nữ chưa kết hôn và người nữ đồng trinh”.'
  rationale: Cú pháp Hy Lạp cô đọng và động từ số ít hỗ trợ cách hiểu chủ ngữ thống nhất, nhưng cách hiểu hai hạng người vẫn khả hữu nên được bảo lưu trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Người nữ” được dùng để duy trì sự rõ ràng trong lập luận đối chiếu; “đẹp lòng chồng mình” là cách nói tự nhiên nhưng vẫn dignified. Câu mở đầu giữ sự đột ngột và mối liên kết với câu trước của bản Hy Lạp.
