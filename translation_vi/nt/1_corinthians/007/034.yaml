review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch theo sát các đối lập chính của câu: người nữ chưa kết hôn/người nữ đã kết hôn, việc của Chúa/việc của thế gian, và thân thể/tâm linh. Chú thích bảo lưu đúng khả năng đọc phối hợp của cụm γυνὴ ἡ ἄγαμος καὶ ἡ παρθένος. Tuy nhiên, đại từ mở đầu “người ấy” làm mất giống cái được hàm chứa trong μεμέρισται và không rõ quy chiếu trong tiếng Việt khi đứng riêng.'
  naturalness: Văn phong nhìn chung hiện đại và tự nhiên. “Người nữ ấy” ở câu mở đầu rõ và liên kết tốt hơn “người ấy”. “Để thánh khiết” phản ánh trực tiếp hơn mệnh đề ἵνα ᾖ ἁγία so với “để được thánh khiết”, vốn có thể gợi một sắc thái bị động không có trong nguyên ngữ.
  terminology: “Người nữ đồng trinh,” “Chúa,” “thánh khiết,” “thân thể,” “tâm linh,” và “đẹp lòng chồng mình” phù hợp ngữ cảnh và cách dùng Kinh Thánh tiếng Việt hiện đại. “Tâm linh” ở đây được giữ như thuật ngữ quen dùng cho πνεύματι, không nhằm áp đặt một phân chia nhân học.
  issues:
  - severity: medium
    issue: “người ấy” ở câu mở đầu không biểu thị giống cái và thiếu rõ ràng về quy chiếu.
    rationale: Động từ μεμέρισται là số ít giống cái, tiếp nối nhân vật nữ trong mạch lập luận. Trong tiếng Việt, “người ấy” có thể chỉ bất cứ giới nào và khi tách khỏi câu trước dễ gây mơ hồ; “người nữ ấy” giữ được thông tin của bản nguồn.
  - severity: low
    issue: “để được thánh khiết” thêm sắc thái bị động/đạt được.
    rationale: ἵνα ᾖ ἁγία nghĩa là “để [người ấy] được/là thánh khiết,” với động từ “là” ở thể chủ động. “Để thánh khiết” gọn, tự nhiên và sát cấu trúc hơn.
  revised_text: Và người nữ ấy bị phân tâm. Còn người nữ chưa kết hôn, tức là người nữ đồng trinh,[a] thì quan tâm đến những việc của Chúa, để thánh khiết cả về thân thể lẫn tâm linh. Nhưng người nữ đã kết hôn thì quan tâm đến những việc của thế gian, làm sao để đẹp lòng chồng mình.
