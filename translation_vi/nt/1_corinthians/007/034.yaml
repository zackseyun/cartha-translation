revisions:
- from: Và người ấy bị phân tâm. Còn người nữ chưa kết hôn, tức là người nữ đồng trinh,[a] thì quan tâm đến những việc của Chúa, để được thánh khiết cả về thân thể lẫn tâm linh. Nhưng người nữ đã kết hôn thì quan tâm đến những việc của thế gian, làm sao để đẹp lòng chồng mình.
  to: Và người nữ ấy bị phân tâm. Còn người nữ chưa kết hôn, tức là người nữ đồng trinh,[a] thì quan tâm đến những việc của Chúa, để thánh khiết cả về thân thể lẫn tâm linh. Nhưng người nữ đã kết hôn thì quan tâm đến những việc của thế gian, làm sao để đẹp lòng chồng mình.
  rationale: Sửa tối thiểu để làm rõ chủ ngữ nữ tính ở câu mở đầu và tránh thêm sắc thái bị động vào mệnh đề chỉ mục đích. Giữ nguyên cách hiểu đồng vị có chú thích về cách đọc thay thế, cùng các thuật ngữ và cấu trúc đối chiếu của bản nguồn.
