  naturalness: Câu sửa dùng văn phong Việt hiện đại, trang trọng và mạch lạc. «Lại đến với nhau» là cách nói uyển ngữ tự nhiên trong ngữ cảnh hôn nhân; tránh hàm ý không cần thiết rằng đôi vợ chồng đã ngừng sống cùng một nhà.
  terminology: «Sa-tan», «cám dỗ», «cầu nguyện» và «thiếu tự chủ» đều phù hợp. «Anh chị em» có thể giữ cho ngôi thứ hai số nhiều, theo lối xưng hô quen thuộc trong thư tín Tân Ước.
