id: 1CO.7.5
reference: 1 Corinthians 7:5
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: μὴ ἀποστερεῖτε ἀλλήλους, εἰ μήτι ἂν ἐκ συμφώνου πρὸς καιρὸν ἵνα ⸀σχολάσητε ⸀τῇ προσευχῇ καὶ πάλιν ἐπὶ τὸ αὐτὸ ⸀ἦτε, ἵνα μὴ πειράζῃ ὑμᾶς ὁ Σατανᾶς διὰ τὴν ἀκρασίαν ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/005.yaml
  text: Do not deprive one another[a], except perhaps by mutual agreement for a time, so that you may devote yourselves to prayer, and then come together again[b], so that Satan may not tempt you because of your lack of self-control.
translation:
  language: vi
  text: Đừng từ chối nhau, trừ khi có lẽ cả hai cùng đồng ý tạm thời để chuyên tâm cầu nguyện; rồi hãy lại đến với nhau, để Sa-tan không cám dỗ anh chị em vì sự thiếu tự chủ của anh chị em.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποστερεῖτε
  choice: từ chối
  rationale: Trong ngữ cảnh vợ chồng, động từ nói đến việc không đáp ứng điều chính đáng dành cho người phối ngẫu. “Từ chối nhau” tự nhiên, kín đáo và vẫn giữ sức nặng của lời khuyên.
- source_word: ἀλλήλους
  choice: nhau
  rationale: Đại từ tương hỗ tự nhiên trong tiếng Việt, thể hiện nghĩa vụ hỗ tương giữa cả hai người phối ngẫu.
- source_word: εἰ μήτι ἂν ἐκ συμφώνου
  choice: trừ khi hai người cùng đồng ý
  rationale: Diễn đạt ngoại lệ có điều kiện và nhấn mạnh sự đồng thuận của cả hai. Tiếng Việt không cần tái hiện máy móc sắc thái “có lẽ” khi cấu trúc “trừ khi” đã cho thấy đây là ngoại lệ hạn chế.
- source_word: πρὸς καιρόν
  choice: tạm ngưng một thời gian
  rationale: Thể hiện rõ tính tạm thời, có giới hạn của sự kiêng cữ trong ngữ cảnh.
- source_word: σχολάσητε τῇ προσευχῇ
  choice: chuyên tâm cầu nguyện
  rationale: Cách nói tự nhiên, trang trọng, diễn đạt việc dành thời gian và sự chú tâm cho cầu nguyện.
- source_word: πάλιν ἐπὶ τὸ αὐτὸ ἦτε
  choice: lại chung sống với nhau
  rationale: Giữ lối nói kín đáo của nguyên văn, đồng thời trong ngữ cảnh hôn nhân gợi rõ việc nối lại đời sống vợ chồng mà không diễn giải quá mức.
- source_word: πειράζῃ
  choice: cám dỗ
  rationale: Với Sa-tan làm chủ thể, nghĩa thích hợp là lôi kéo phạm tội chứ không phải thử nghiệm trung tính.
- source_word: Σατανᾶς
  choice: Sa-tan
  rationale: Phiên âm tên riêng theo cách dùng quen thuộc trong tiếng Việt.
- source_word: ἀκρασίαν
  choice: thiếu tự chủ
  rationale: Diễn đạt rõ sự thiếu khả năng kiềm chế bản thân, phù hợp với ngữ cảnh tình dục và dễ hiểu trong tiếng Việt hiện đại.
theological_decisions:
- issue: Mức độ minh thị của cụm πάλιν ἐπὶ τὸ αὐτὸ ἦτε về việc nối lại quan hệ tình dục
  choice: Dùng “lại chung sống với nhau” và thêm chú thích giải thích hàm ý đời sống vợ chồng.
  alternative: “lại quan hệ vợ chồng” hoặc “lại ở bên nhau”
  rationale: Nguyên văn dùng cách nói gián tiếp, có thể bao hàm sự đoàn tụ nói chung nhưng trong mạch văn đặc biệt hướng đến việc nối lại quan hệ vợ chồng. Bản dịch giữ sự kín đáo và không thu hẹp cụm từ quá mức.
- issue: Tư cách cá nhân của ὁ Σατανᾶς
  choice: Dịch là tên riêng “Sa-tan”.
  alternative: “kẻ chống nghịch”
  rationale: Trong ngữ cảnh thư Phao-lô, từ này chỉ một tác nhân cá nhân cám dỗ con người; phiên âm tên riêng giữ đúng cách quy chiếu của câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Anh chị em” được dùng cho đại từ số nhiều ὑμᾶς nhằm nói với toàn thể cộng đồng gồm cả nam lẫn nữ. Cách diễn đạt về quan hệ vợ chồng được giữ kín đáo như nguyên văn.
