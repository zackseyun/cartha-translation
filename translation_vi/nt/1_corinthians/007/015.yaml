id: 1CO.7.15
reference: 1 Corinthians 7:15
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἰ δὲ ὁ ἄπιστος χωρίζεται, χωριζέσθω· οὐ δεδούλωται ὁ ἀδελφὸς ἢ ἡ ἀδελφὴ ἐν τοῖς τοιούτοις, ἐν δὲ εἰρήνῃ κέκληκεν ⸀ἡμᾶς ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/015.yaml
  text: But if the unbeliever separates[a], let him separate. The brother or the sister is not enslaved in such cases[c][b], but God has called us in peace.
translation:
  language: vi
  text: Nhưng nếu người không tin lìa bỏ, thì cứ để người ấy lìa bỏ. Trong những trường hợp như vậy, người anh em hay người chị em không bị làm nô lệ[b]. Nhưng Đức Chúa Trời đã kêu gọi chúng ta[c] sống trong sự bình an.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Cũng có thể dịch là “không bị ràng buộc.” Động từ Hy Lạp ở đây bắt nguồn từ δουλόω, nghĩa là “làm nô lệ,” chứ không phải động từ thường dùng với nghĩa “ràng buộc.”
    reason: lexical_alternative
  - marker: c
    text: Một số thủ bản chép “anh chị em” (ngôi thứ hai số nhiều) thay cho “chúng ta.”
    reason: textual_variant
lexical_decisions:
- source_word: ὁ ἄπιστος
  choice: người không tin
  rationale: Cụm danh từ hóa chỉ người phối ngẫu không tin trong văn cảnh, nhưng không thêm từ “vợ/chồng” vốn chỉ là hàm ý theo ngữ cảnh.
- source_word: χωρίζεται / χωριζέσθω
  choice: lìa bỏ / cứ để người ấy lìa bỏ
  rationale: Giữ sự lặp từ của nguyên văn và diễn đạt việc chấp nhận sự ra đi, không biến câu thành mệnh lệnh phải ly hôn.
- source_word: οὐ δεδούλωται
  choice: không bị làm nô lệ
  rationale: Bám sát δουλόω, nghĩa là làm nô lệ, thay vì dùng “không bị ràng buộc,” vốn có thể gợi một kết luận giáo lý rộng hơn câu chữ.
- source_word: ὁ ἀδελφὸς ἢ ἡ ἀδελφὴ
  choice: người anh em hay người chị em
  rationale: Giữ nguyên ngôn ngữ chỉ anh chị em cùng đức tin và nêu rõ cả hai giới như tiếng Hy Lạp.
- source_word: ἐν τοῖς τοιούτοις
  choice: trong những trường hợp như vậy
  rationale: Cách diễn đạt tự nhiên, chỉ những hoàn cảnh thuộc loại vừa được nói đến.
- source_word: ἐν δὲ εἰρήνῃ κέκληκεν ἡμᾶς ὁ θεός
  choice: Nhưng Đức Chúa Trời đã kêu gọi chúng ta sống trong sự bình an
  rationale: “Đã kêu gọi” phản ánh thể hoàn thành; thêm “sống” để diễn đạt tự nhiên phạm vi đời sống được hàm chứa trong ἐν εἰρήνῃ.
theological_decisions:
- issue: Phạm vi ý nghĩa của οὐ δεδούλωται đối với việc chấm dứt hôn nhân hoặc tái hôn
  choice: Dịch sát là “không bị làm nô lệ,” không xác định toàn bộ hệ quả đối với việc tái hôn.
  alternative: “Không bị ràng buộc” như một tuyên bố kỹ thuật cho phép tái hôn, hoặc chỉ nói người tin không phải cưỡng ép người ra đi ở lại.
  rationale: Câu này không giải thích rõ toàn bộ phạm vi của sự tự do ấy; cách dịch giữ nguyên sức căng thần học mà không áp đặt kết luận hệ phái.
- issue: Đối tượng của ὁ ἄπιστος
  choice: “người không tin,” với ngữ cảnh cho biết đó là người phối ngẫu không tin.
  alternative: “người vợ hoặc chồng không tin.”
  rationale: Bản dịch không thêm danh từ mà nguyên văn chỉ hàm ý, đồng thời ngữ cảnh hôn nhân vẫn làm đối tượng đủ rõ.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “lìa bỏ” để phù hợp văn cảnh hôn nhân mà không quy định đây là thủ tục ly hôn pháp lý. Không đặt chú thích [a] vì phương án “người không tin” đã được dùng trực tiếp trong chính văn và dữ liệu chú thích tiếng Anh cho [a] không tương ứng rõ với vị trí đánh dấu.
