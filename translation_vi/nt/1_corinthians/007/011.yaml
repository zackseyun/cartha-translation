    issue: “chị ấy” là lựa chọn đại từ không trung tính.
    rationale: Tiếng Việt dùng “chị” theo quan hệ xã hội/tuổi tác của người nói; nguyên văn chỉ dựa vào người vợ trong ngữ cảnh trước, không cung cấp cơ sở cho sắc thái này.
  - severity: low
    issue: “hòa giải với chồng mình” chưa phản ánh rõ thể bị động của καταλλαγήτω.
    rationale: Có thể hiểu như mệnh lệnh người vợ phải chủ động hòa giải. “Được làm hòa lại với chồng mình” giữ sự mở bỏ về tác nhân và tính tương hỗ của việc hòa giải.
