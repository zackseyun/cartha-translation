source:
  edition: SBLGNT
  text: ἐὰν δὲ καὶ χωρισθῇ, μενέτω ἄγαμος ἢ τῷ ἀνδρὶ καταλλαγήτω— καὶ ἄνδρα γυναῖκα μὴ ἀφιέναι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/011.yaml
  text: But if she does separate[a], let her remain unmarried[b], or else be reconciled to her husband—and a husband must not divorce his wife.
translation:
  language: vi
  text: Nhưng nếu người vợ ly thân[a], thì hãy cứ ở vậy hoặc được làm hòa lại với chồng mình; và người chồng không được ly dị[b] vợ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Nhưng ngay cả nếu người vợ ly thân.” Từ καί trong cụm Hy Lạp có thể tạo sắc thái nhượng bộ nhẹ.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch sát hơn: “bỏ vợ.” Trong bối cảnh hôn nhân, động từ này thường chỉ việc ly dị hoặc đuổi người phối ngẫu đi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν δὲ καὶ
  choice: Nhưng nếu
  rationale: Cụm từ mở đầu một điều kiện có sắc thái nhượng bộ. “Nhưng nếu” tự nhiên trong tiếng Việt; sắc thái “ngay cả nếu” được giữ trong chú thích.
- source_word: χωρισθῇ
  choice: ly thân
  rationale: χωρίζω ở đây chỉ việc vợ chồng phân cách. “Ly thân” giữ được sự phân biệt với động từ ἀφίημι ở cuối câu và không mặc nhiên đồng nhất hành động này với ly dị về mặt pháp lý.
- source_word: μενέτω ἄγαμος
  choice: hãy cứ sống không chồng
  rationale: Cách dịch này truyền đạt mệnh lệnh tiếp tục ở trong tình trạng không có chồng, thay vì dùng “độc thân,” một từ có thể gợi một phạm vi xã hội rộng hơn.
- source_word: καταλλαγήτω
  choice: hòa giải
  rationale: Động từ ở thể bị động mang nghĩa được hòa giải hay làm hòa lại. Tiếng Việt tự nhiên dùng “hòa giải với chồng mình” mà không cần diễn đạt hình thức bị động.
- source_word: τῷ ἀνδρί
  choice: với chồng mình
  rationale: ἀνήρ có thể là “người đàn ông” hoặc “chồng”; ngữ cảnh hôn nhân xác định nghĩa “chồng.” “Mình” làm rõ quan hệ sở hữu một cách tự nhiên.
- source_word: ἄνδρα
  choice: người chồng
  rationale: Trong ngữ cảnh này, ἀνήρ chỉ người chồng. Cách nói có tính khái quát, phù hợp với lời chỉ dẫn song song dành cho chồng.
- source_word: γυναῖκα
  choice: vợ
  rationale: γυνή có thể là “người phụ nữ” hoặc “vợ”; ngữ cảnh xác định nghĩa “vợ.”
- source_word: μὴ ἀφιέναι
  choice: không được ly dị
  rationale: Cấu trúc diễn đạt lời cấm. Trong bối cảnh hôn nhân, ἀφίημι có thể chỉ việc bỏ hoặc cho người phối ngẫu đi; “ly dị” truyền đạt rõ sức nặng hôn nhân của từ này cho độc giả hiện đại, còn nghĩa sát hơn được nêu trong chú thích.
theological_decisions:
- issue: Có nên dịch χωρισθῇ và ἀφιέναι bằng cùng một thuật ngữ hay không
  choice: Dịch χωρισθῇ là “ly thân” và ἀφιέναι là “ly dị”
  alternative: Dịch cả hai là “ly dị,” hoặc dịch cả hai bằng những từ khái quát như “rời bỏ/phân cách”
  rationale: Nguyên văn dùng hai động từ khác nhau. Giữ sự phân biệt này tránh áp đặt cùng một phạm trù pháp lý lên cả hai và bảo tồn khả năng Phao-lô phân biệt việc phân cách với việc bỏ hay ly dị người phối ngẫu.
- issue: Cách thể hiện chủ thể nữ không được nêu thành danh từ trong mệnh đề đầu
  choice: Dùng “chị ấy”
  alternative: Lặp lại “người vợ”
  rationale: Ngữ cảnh ngay trước đó đang nói với người vợ. Tiếng Việt cần một chủ thể rõ ràng; “chị ấy” phản ánh mạch diễn ngôn mà không thêm một danh xưng không có trong chính mệnh đề.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Ly thân” và “ly dị” được dùng có chủ ý để bảo tồn hai động từ khác nhau trong nguyên văn. Dấu chấm phẩy làm rõ sự chuyển từ lời chỉ dẫn cho người vợ sang lời chỉ dẫn song song cho người chồng.
