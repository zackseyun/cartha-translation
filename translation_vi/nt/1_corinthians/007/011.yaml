review_pass:
  verdict: revise
  source_fidelity: 'Bản thảo giữ đúng sự phân biệt quan trọng giữa χωρισθῇ (ly thân/phân cách) và ἀφιέναι (ly dị/bỏ vợ), cũng như hai lựa chọn dành cho người vợ: ở không kết hôn hoặc được hòa giải với chồng. Tuy nhiên, “chị ấy” không phải là đại từ trung tính trong tiếng Việt: nó mặc định một quan hệ xưng hô và tuổi tác tương đối không có trong nguyên văn. “Hòa giải với chồng mình” có thể hiểu người vợ là bên chủ động hòa giải, trong khi καταλλαγήτω là mệnh lệnh bị động.'
  naturalness: “Chị ấy” tạo sắc thái hội thoại và ngôi xưng không phù hợp với văn phong Kinh Thánh trang trọng. “Người vợ” theo mạch văn vừa tự nhiên vừa rõ chủ thể. “Hãy cứ ở vậy” là cách nói hiện đại, gọn và thông dụng để chỉ việc tiếp tục không kết hôn; “được làm hòa lại” diễn đạt tự nhiên hơn sắc thái bị động của động từ Hy Lạp.
  terminology: “Ly thân” và “ly dị” được dùng nhất quán và có cơ sở ngữ nghĩa, không đồng nhất hai động từ Hy Lạp. “Người chồng/vợ” phù hợp ngữ cảnh hôn nhân. “Ở vậy” trong văn cảnh này truyền đạt ἄγαμος mà không áp đặt một tình trạng pháp lý cụ thể hơn.
