- from: Nhưng nếu chị ấy ly thân[a], thì hãy cứ sống không chồng, hoặc hòa giải với chồng mình; còn người chồng không được ly dị[b] vợ.
  to: Nhưng nếu người vợ ly thân[a], thì hãy cứ ở vậy hoặc được làm hòa lại với chồng mình; và người chồng không được ly dị[b] vợ.
