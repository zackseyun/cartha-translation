- from: 'Chỉ có điều này: mỗi người hãy sống[a] theo phần Chúa đã phân cho mình, và theo hoàn cảnh Đức Chúa Trời đã gọi mình[b]. Tôi cũng truyền dạy như vậy trong tất cả các hội thánh.'
  to: Tuy vậy, mỗi người hãy sống[a] theo phần Chúa đã phân cho mình, như Đức Chúa Trời đã gọi người ấy[b]. Và tôi chỉ thị như vậy trong mọi hội thánh.
  rationale: 'Bản sửa loại bỏ nội dung được thêm vào ở đầu câu và không đặt diễn giải “hoàn cảnh” trong chính văn. Cấu trúc mới vẫn truyền đạt hai vế song song: phần Chúa đã phân và sự kêu gọi của Đức Chúa Trời, nhưng không quyết định trước quan hệ chính xác giữa chúng. Chú thích b bảo lưu cách hiểu theo tình trạng/hoàn cảnh như một khả năng, thay vì áp đặt nó.'
