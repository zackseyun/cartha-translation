id: 1CO.7.17
reference: 1 Corinthians 7:17
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Εἰ μὴ ἑκάστῳ ὡς ⸀ἐμέρισεν ὁ ⸀κύριος, ἕκαστον ὡς κέκληκεν ὁ ⸀θεός, οὕτως περιπατείτω· καὶ οὕτως ἐν ταῖς ἐκκλησίαις πάσαις διατάσσομαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/017.yaml
  text: Only[a], as the Lord has assigned to each one, as God has called each one, so let him walk[b]. And so I direct in all the churches.
translation:
  language: vi
  text: Tuy vậy, mỗi người hãy sống[a] theo phần Chúa đã phân cho mình, như Đức Chúa Trời đã gọi người ấy[b]. Và tôi chỉ thị như vậy trong mọi hội thánh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “hãy bước đi”, một ẩn dụ Kinh Thánh quen thuộc chỉ cách một người sống hoặc cư xử.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể diễn đạt: “trong tình trạng mà Đức Chúa Trời đã gọi người ấy.” Tiếng Hy Lạp dùng “như Đức Chúa Trời đã gọi”, không nêu rõ danh từ “hoàn cảnh” hay “tình trạng”.'
    reason: ambiguity
lexical_decisions:
- source_word: Εἰ μὴ
  choice: Chỉ có điều này
  rationale: Cụm này mở đầu một nguyên tắc chi phối với sắc thái chuyển ý/giới hạn, chứ không phải điều kiện theo nghĩa đen “nếu không”.
- source_word: ἐμέρισεν
  choice: đã phân cho
  rationale: Giữ ý Chúa phân định hoặc ban phần cho từng người, đồng thời là cách nói tự nhiên trong tiếng Việt.
- source_word: ἑκάστῳ / ἕκαστον
  choice: mỗi người ... mình
  rationale: Duy trì sức nhấn phân phối cho từng cá nhân; đại từ “mình” giúp câu tiếng Việt tự nhiên mà không áp đặt giới tính.
- source_word: κέκληκεν
  choice: đã gọi
  rationale: Chuyển tải hành động kêu gọi đã xảy ra và còn hiệu lực; trong tiếng Việt, “đã gọi” là tự nhiên và không cần diễn đạt quá mức thể hoàn thành Hy Lạp.
- source_word: περιπατείτω
  choice: hãy sống
  rationale: Trong ngữ cảnh, động từ “bước đi” là ẩn dụ chỉ cách sống. “Hãy sống” truyền đạt rõ nghĩa cho độc giả hiện đại; ẩn dụ nguyên ngữ được ghi ở chú thích.
- source_word: διατάσσομαι
  choice: Tôi ... truyền dạy
  rationale: Thể hiện lời chỉ thị có thẩm quyền của Phao-lô mà không tạo sắc thái gay gắt quá mức.
- source_word: ἐν ταῖς ἐκκλησίαις πάσαις
  choice: trong tất cả các hội thánh
  rationale: Cách gọi rõ ràng, thông dụng cho các cộng đồng tín hữu địa phương trong văn cảnh Phao-lô.
theological_decisions:
- issue: Sự phân biệt giữa “Chúa” và “Đức Chúa Trời”
  choice: Giữ hai danh xưng riêng biệt
  alternative: Xem cả hai chỉ là biến thể văn phong cho cùng một chủ thể và gộp lại
  rationale: Bản Hy Lạp cố ý dùng ὁ κύριος và ὁ θεός trong hai vế song song; bản dịch không nên tự ý xóa sự phân biệt.
- issue: Quan hệ giữa phần được Chúa phân và sự kêu gọi của Đức Chúa Trời
  choice: Diễn đạt “theo phần ... và theo hoàn cảnh ...” nhưng không đồng nhất hoàn toàn hai ý
  alternative: Hiểu cả hai vế chỉ cùng một hành động hoặc một địa vị duy nhất
  rationale: Hai vế song song có liên hệ chặt chẽ nhưng bản văn không buộc phải coi chúng hoàn toàn đồng nghĩa; cách dịch giữ được độ căng và tính khái quát.
- issue: Ẩn dụ đạo đức trong περιπατείτω
  choice: Dịch nghĩa chính là “hãy sống” và bảo lưu ẩn dụ trong chú thích
  alternative: Dịch sát “hãy bước đi” ngay trong chính văn
  rationale: “Hãy sống” tự nhiên, rõ nghĩa trong tiếng Việt hiện đại, còn chú thích giúp người đọc nhận biết hình ảnh của nguyên ngữ.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Câu được tái cấu trúc nhẹ để quan hệ giữa mệnh lệnh và hai vế ὡς rõ ràng hơn. “Hội thánh” được dùng theo cách gọi Tin Lành quen thuộc nhưng ở đây chỉ cộng đồng tín hữu địa phương, không hàm ý một hệ phái cụ thể.
