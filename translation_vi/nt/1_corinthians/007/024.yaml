id: 1CO.7.24
reference: 1 Corinthians 7:24
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἕκαστος ἐν ᾧ ἐκλήθη, ἀδελφοί, ἐν τούτῳ μενέτω παρὰ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/024.yaml
  text: Brothers[b][a], let each one remain with God in that condition in which he was called.
translation:
  language: vi
  text: Thưa anh em[a], mỗi người hãy cứ ở trong chính hoàn cảnh mà mình đã được kêu gọi, trước mặt Đức Chúa Trời[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Anh em” ở đây là lời xưng hô với toàn thể hội chúng, gồm cả phụ nữ.
    reason: cultural_note
  - marker: b
    text: Cũng có thể dịch là “với Đức Chúa Trời” hoặc “trong sự hiện diện của Đức Chúa Trời.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕκαστος
  choice: mỗi người
  rationale: 'Giữ rõ ý phân phối ở số ít: lời chỉ dẫn áp dụng riêng cho từng người.'
- source_word: ἐν ᾧ ... ἐν τούτῳ
  choice: trong hoàn cảnh mình ... ấy
  rationale: Cặp giới từ cùng đại từ quan hệ và đại từ chỉ định nói đến hoàn cảnh hay địa vị sống; “ấy” bảo lưu sắc thái hồi chỉ của ἐν τούτῳ mà vẫn tự nhiên trong tiếng Việt.
- source_word: ἐκλήθη
  choice: đã được kêu gọi
  rationale: Giữ thể bị động và không thêm tác nhân “bởi Đức Chúa Trời,” dù văn cảnh Phao-lô ngụ ý Ngài là Đấng kêu gọi.
- source_word: ἀδελφοί
  choice: anh em
  rationale: Giữ hình thức xưng hô giống đực của nguyên văn; chú thích làm rõ đây là cách gọi đại diện cho toàn thể hội chúng, gồm cả phụ nữ.
- source_word: μενέτω
  choice: hãy cứ ở
  rationale: Diễn đạt mệnh lệnh tiếp tục duy trì hoàn cảnh hiện tại; “cứ” thể hiện ý kéo dài của μένω.
- source_word: παρὰ θεῷ
  choice: trước mặt Đức Chúa Trời
  rationale: Cách diễn đạt tự nhiên, trang trọng cho ý sống trong sự hiện diện và quy hướng về Đức Chúa Trời; cụm Hy Lạp cũng có thể hiểu là “với Đức Chúa Trời.”
theological_decisions:
- issue: Có nên nêu rõ Đức Chúa Trời là tác nhân của việc kêu gọi hay không
  choice: Giữ thể bị động “được kêu gọi,” không thêm “bởi Đức Chúa Trời”
  alternative: được Đức Chúa Trời kêu gọi
  rationale: Văn cảnh thần học của Phao-lô mạnh mẽ hàm ý sự kêu gọi của Đức Chúa Trời, nhưng câu Hy Lạp không nêu tác nhân; bản dịch không nên làm điều hàm ý thành lời minh thị.
- issue: Cách dịch ἀδελφοί khi lời xưng hô hướng đến hội chúng gồm cả nam và nữ
  choice: anh em, kèm chú thích về nghĩa đại diện
  alternative: anh chị em
  rationale: “Anh em” phản ánh hình thức giống đực của nguyên văn, còn chú thích bảo đảm độc giả hiện đại hiểu phạm vi bao gồm toàn thể hội chúng.
- issue: Quan hệ của παρὰ θεῷ với mệnh lệnh tiếp tục ở trong hoàn cảnh được gọi
  choice: trước mặt Đức Chúa Trời
  alternative: với Đức Chúa Trời
  rationale: Không biến lời dạy thành việc đơn thuần bảo toàn địa vị xã hội; cụm từ cuối câu đặt việc tiếp tục sống trong hoàn cảnh ấy dưới sự hiện diện và trong mối liên hệ với Đức Chúa Trời, đồng thời chú thích giữ cách hiểu từ vựng khác.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. “Thưa anh em” tạo lời xưng hô tự nhiên; “hãy cứ ở” diễn đạt mệnh lệnh tiếp diễn; trật tự câu giữ gần cấu trúc Hy Lạp nhưng tránh lối diễn đạt gượng ép.
