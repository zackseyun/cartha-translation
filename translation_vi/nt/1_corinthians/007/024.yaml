  to: Thưa anh em[a], mỗi người hãy cứ ở trong chính hoàn cảnh mà mình đã được kêu gọi, trước mặt Đức Chúa Trời[b].
  rationale: Bản sửa chỉ làm rõ cú pháp tiếng Việt và chỉnh vị trí neo chú thích. “Chính hoàn cảnh” biểu đạt cách tự nhiên sự quy chiếu trở lại của ἐν τούτῳ; thể bị động “đã được kêu gọi” vẫn không nêu thêm tác nhân. Cách dịch “trước mặt Đức Chúa Trời” được giữ như một lựa chọn khả dĩ của παρὰ θεῷ, còn những cách hiểu khác được bảo lưu trong chú thích.
  reviewer_model: gpt-5.6-terra
