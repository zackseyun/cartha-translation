  text: Περὶ δὲ ὧν ⸀ἐγράψατε, καλὸν ἀνθρώπῳ γυναικὸς μὴ ἅπτεσθαι·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/001.yaml
  text: 'Concerning the matters you wrote about: it is good for a man not to touch a woman.[a]'
translation:
  language: vi
  text: 'Còn về những điều anh chị em đã viết: người nam không chạm đến người nữ là điều tốt.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Chạm đến người nữ” có lẽ là cách nói tránh chỉ việc quan hệ tình dục. Từ Hy Lạp được dịch là “người nữ” cũng có thể có nghĩa là “vợ”. Bản Hy Lạp không cho biết chắc đây là lời Phao-lô khẳng định hay là lời trong thư của người Cô-rinh-tô mà ông đang nhắc lại.
    reason: Giải thích thành ngữ, bảo lưu nghĩa có thể là “người nữ/vợ”, và không quyết định trong chính văn vấn đề mệnh đề này có phải câu trích dẫn hay không.
lexical_decisions:
- source_word: Περὶ δὲ ὧν ἐγράψατε
  choice: Còn về những điều anh chị em đã viết
  rationale: “Còn về” thể hiện sự chuyển sang chủ đề mới của περὶ δέ; đại từ số nhiều được diễn đạt bằng “anh chị em” để tự nhiên trong tiếng Việt.
- source_word: καλὸν
  choice: là điều tốt
  rationale: Giữ nguyên nhận định ngắn gọn và không thêm ý như “tốt hơn” hay “nên”.
- source_word: ἀνθρώπῳ
  choice: đàn ông
  rationale: Dù ἄνθρωπος thường có thể nghĩa là “người”, sự đối ứng với γυνή và ngữ cảnh quan hệ nam nữ khiến “đàn ông” phù hợp ở đây.
- source_word: γυναικὸς μὴ ἅπτεσθαι
  choice: không đụng đến đàn bà
  rationale: Giữ hình ảnh “đụng/chạm” của ἅπτομαι và khả năng đây là cách nói tránh về quan hệ tình dục, thay vì giải nghĩa thẳng ngay trong câu.
theological_decisions:
- issue: Đây là lời của Phao-lô hay câu trích từ thư của người Cô-rinh-tô
  choice: Đặt mệnh đề trong ngoặc kép nhưng giải thích tính bất định trong chú thích
  alternative: Không dùng ngoặc kép, hiểu toàn bộ là lời khẳng định trực tiếp của Phao-lô
  rationale: Cấu trúc “về những điều anh chị em đã viết” cho phép hiểu mệnh đề sau là nội dung họ nêu ra, nhưng bản Hy Lạp không có dấu câu và không quyết định dứt khoát vấn đề này.
- issue: Nghĩa của “đụng đến đàn bà”
  choice: Giữ cách nói hình ảnh trong chính văn
  alternative: Dịch thẳng là “không quan hệ tình dục với phụ nữ”
  rationale: Cách dịch hình ảnh bảo tồn lối nói của nguyên văn và không thu hẹp quá mức sắc thái; chú thích cung cấp nghĩa hàm ẩn có khả năng cao.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Đàn bà” được dùng thay cho “phụ nữ” để câu nói có cấu trúc đối xứng, gọn, và gần sắc thái nam–nữ của nguyên văn; “anh chị em” làm rõ đối tượng số nhiều mà không dùng cách xưng hô cổ.
