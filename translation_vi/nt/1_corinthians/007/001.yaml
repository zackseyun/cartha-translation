  naturalness: “Còn về những điều anh chị em đã viết” là tự nhiên trong tiếng Việt hiện đại. “Người nam không chạm đến người nữ là điều tốt” vừa trang trọng, rõ nghĩa hơn, vừa bảo lưu hình ảnh của động từ Hy Lạp mà không dùng “đàn bà” theo sắc thái có thể kém phù hợp trong văn phong Kinh Thánh hiện đại.
