id: 1CO.7.14
reference: 1 Corinthians 7:14
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἡγίασται γὰρ ὁ ἀνὴρ ὁ ἄπιστος ἐν τῇ γυναικί, καὶ ἡγίασται ἡ γυνὴ ἡ ἄπιστος ἐν τῷ ⸀ἀδελφῷ· ἐπεὶ ἄρα τὰ τέκνα ὑμῶν ἀκάθαρτά ἐστιν, νῦν δὲ ἅγιά ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/014.yaml
  text: For the unbelieving husband has been made holy through his wife[a], and the unbelieving wife has been made holy through the brother; otherwise your children are unclean, but as it is[b], they are holy.
translation:
  language: vi
  text: Vì người chồng không tin đã được thánh hóa nhờ người vợ, và người vợ không tin đã được thánh hóa nhờ người anh em[a]; nếu không, con cái anh chị em là ô uế, nhưng nay chúng là thánh[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “nhờ người chồng tin Chúa.” Tiếng Hy Lạp chép “nhờ người anh em”; Phao-lô thường dùng “anh em” để chỉ người đồng đức tin.'
    reason: lexical_alternative
  - marker: b
    text: “Đã được thánh hóa” và “là thánh” ở đây nói đến một địa vị được biệt riêng trong mối liên hệ với người phối ngẫu tin Chúa và gia đình; các cách nói này không nhất thiết có nghĩa là người ấy đã được cứu.
    reason: cultural_note
lexical_decisions:
- source_word: ἡγίασται
  choice: đã được thánh hóa
  rationale: Thể hoàn thành bị động diễn tả một hành động đã xảy ra với kết quả còn hiệu lực. Cách dịch này giữ liên hệ từ vựng với ἅγιά mà không tự đồng nhất với sự cứu rỗi cá nhân.
- source_word: ὁ ἀνὴρ ὁ ἄπιστος / ἡ γυνὴ ἡ ἄπιστος
  choice: người chồng không tin / người vợ không tin
  rationale: Trong ngữ cảnh hôn nhân, ἀνήρ và γυνή chỉ chồng và vợ; ἄπιστος ở đây chỉ người không tin, chứ không chủ yếu mang nghĩa không đáng tin.
- source_word: ἐν
  choice: nhờ
  rationale: 'Giới từ này ở đây có sắc thái quan hệ hoặc phương tiện: tình trạng được thánh hóa của người không tin gắn với người phối ngẫu tin Chúa. “Nhờ” tự nhiên trong tiếng Việt, nhưng không giải thích quá mức bản chất của mối liên hệ ấy.'
- source_word: ἀδελφῷ
  choice: người anh em
  rationale: Giữ cách gọi cụ thể của bản Hy Lạp thay vì đổi thành “người chồng”; trong cách dùng của Phao-lô, từ này thường chỉ một người đồng đức tin. Chú thích nêu rõ nghĩa có khả năng nhất trong ngữ cảnh.
- source_word: ἐπεὶ ἄρα
  choice: nếu không
  rationale: Diễn đạt tự nhiên hệ quả giả định được nêu ra nếu mệnh đề trước không đúng.
- source_word: ἀκάθαρτα
  choice: ô uế
  rationale: Giữ sắc thái thanh sạch–ô uế mang tính tôn giáo và giao ước, thay vì làm nhạt thành “không trong sạch”.
- source_word: νῦν δὲ
  choice: nhưng nay
  rationale: Bám sát sự tương phản giữa hệ quả giả định và tình trạng thực tế hiện nay.
- source_word: ἅγιά
  choice: là thánh
  rationale: Giữ nguyên trường từ vựng của ἡγίασται và sự đối lập trực tiếp với “ô uế”; không diễn giải thành một học thuyết cụ thể.
theological_decisions:
- issue: Ý nghĩa của việc người phối ngẫu không tin “đã được thánh hóa”
  choice: Giữ nguyên ngôn ngữ thánh hóa và giải thích thận trọng rằng câu nói đến một địa vị được biệt riêng trong mối liên hệ gia đình, không tất yếu khẳng định sự cứu rỗi cá nhân.
  alternative: Hiểu rằng người phối ngẫu không tin tự động được cứu nhờ hôn nhân, hoặc chỉ đơn thuần rằng quan hệ vợ chồng là hợp pháp.
  rationale: Lập luận của câu gắn tình trạng của người phối ngẫu với tình trạng của con cái, nhưng không nói rõ mọi phương diện thần học của sự thánh hóa. Vì vậy bản dịch giữ nguyên sức căng và không áp đặt kết luận vượt quá văn bản.
- issue: Từ chỉ người chồng tin Chúa trong ἀδελφῷ
  choice: Dịch sát là “người anh em” trong chính văn và giải thích trong chú thích rằng rất có thể đó là người chồng tin Chúa.
  alternative: Dịch trực tiếp là “người chồng tin Chúa” để tạo sự đối xứng với vế trước.
  rationale: Bản Hy Lạp dùng ἀδελφός chứ không lặp lại ἀνήρ. Giữ khác biệt này giúp minh bạch với nguồn, còn chú thích bảo đảm người đọc hiểu ngữ cảnh.
- issue: Tình trạng “thánh” của con cái
  choice: Giữ cách nói “chúng là thánh” và không xác định câu này là lời bảo đảm về sự cứu rỗi cá nhân.
  alternative: Diễn giải thành “được cứu”, “thuộc giao ước” hoặc chỉ “hợp pháp”.
  rationale: Văn bản đối lập ἅγια với ἀκάθαρτα nhưng không tự giải thích đầy đủ bản chất của địa vị này; bản dịch cần bảo tồn sự rộng nghĩa đó.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh chị em” cho đại từ số nhiều ὑμῶν; giữ các thuật ngữ “thánh hóa”, “ô uế”, “thánh” để bảo tồn mối liên hệ từ vựng và sắc thái thần học của nguyên văn.
