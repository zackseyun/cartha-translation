  terminology: Các thuật ngữ “thánh hóa”, “ô uế”, và “thánh” được dùng nhất quán, giữ được sắc thái tôn giáo của bản nguồn mà không đồng nhất hóa với sự cứu rỗi cá nhân. Chú thích a xử lý “người anh em” minh bạch; chú thích b nêu cách hiểu hạn chế, thận trọng của ngôn ngữ thánh hóa và không áp đặt giáo lý.
