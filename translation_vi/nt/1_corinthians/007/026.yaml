source:
  edition: SBLGNT
  text: νομίζω οὖν τοῦτο καλὸν ὑπάρχειν διὰ τὴν ἐνεστῶσαν ἀνάγκην, ὅτι καλὸν ἀνθρώπῳ τὸ οὕτως εἶναι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/026.yaml
  text: 'Therefore I think this is good because of the present distress: that it is good for a man to remain as he is[a][b][c].'
translation:
  language: vi
  text: 'Vậy, vì cảnh khốn khó hiện tại[a], tôi cho rằng điều này là tốt: một người cứ ở như vậy thì tốt[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “vì sự cấp thiết hiện tại” hoặc “vì cảnh khủng hoảng hiện tại.”'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “một người ở như vậy thì tốt.” “Một người” dịch từ một từ Hy Lạp có thể dùng theo nghĩa khái quát; ngữ cảnh gần cũng bàn đến những người nam.'
    reason: lexical_alternative
lexical_decisions:
- source_word: νομίζω
  choice: tôi cho rằng
  rationale: Diễn tả nhận định có cân nhắc của Phao-lô, không biến lời này thành một mệnh lệnh tuyệt đối.
- source_word: οὖν
  choice: Vậy
  rationale: Nối câu này như một kết luận rút ra từ phần bàn luận trước, đồng thời tự nhiên trong tiếng Việt hiện đại.
- source_word: τοῦτο καλὸν ὑπάρχειν
  choice: điều này là tốt
  rationale: Chuyển cấu trúc nguyên mẫu sang mệnh đề tiếng Việt tự nhiên và giữ từ καλόν theo nghĩa tốt, thích hợp.
- source_word: διὰ τὴν ἐνεστῶσαν ἀνάγκην
  choice: vì cảnh khốn khó hiện tại
  rationale: ἀνάγκη có thể chỉ sự cấp thiết, cảnh bức bách hoặc khốn khó; trong ngữ cảnh này, cách dịch nêu một hoàn cảnh gây sức ép mà không xem đó là lệnh cấm hôn nhân. ἐνεστῶσαν được giữ là hiện tại.
- source_word: ὅτι
  choice: ':'
  rationale: Hiểu là từ giới thiệu nội dung cụ thể của nhận định; dấu hai chấm diễn đạt quan hệ ấy tự nhiên hơn việc lặp từ 'rằng' trong tiếng Việt.
- source_word: καλὸν
  choice: là tốt
  rationale: Giữ sự lặp lại có chủ ý của καλόν trong nguyên văn và không thêm ý 'có lợi' hay 'tốt hơn về đạo đức'.
- source_word: ἀνθρώπῳ
  choice: một người
  rationale: ἄνθρωπος ở đây có thể dùng theo nghĩa khái quát. 'Một người' tự nhiên trong tiếng Việt và giữ phạm vi mở của từ nguồn, dù ngữ cảnh gần có thể hướng đến người nam.
- source_word: τὸ οὕτως εἶναι
  choice: cứ ở trong tình trạng hiện nay của mình
  rationale: Nghĩa đen là 'ở như vậy'; cách diễn đạt này làm rõ ý tiếp tục trong hoàn cảnh hiện có theo ngữ cảnh mà không xác định quá mức đó là tình trạng nào.
theological_decisions:
- issue: Tính chất lời nhận định của Phao-lô
  choice: Giữ đây là nhận định mục vụ gắn với cảnh khốn khó hiện tại.
  alternative: Hiểu đây là sự ưu tiên vượt thời gian chống lại hôn nhân.
  rationale: Cụm 'tôi cho rằng' và lý do 'vì cảnh khốn khó hiện tại' cho thấy lời khuyên phụ thuộc hoàn cảnh; câu dịch không biến nó thành lệnh cấm hôn nhân phổ quát.
- issue: Phạm vi của ἀνθρώπῳ
  choice: Dịch là 'một người', giữ khả năng dùng khái quát.
  alternative: Dịch là 'một người nam' để bảo toàn hình thức nam tính theo ngữ cảnh gần.
  rationale: ἄνθρωπος có thể chỉ con người nói chung; bản dịch chính tránh thu hẹp điều nguyên văn chưa dứt khoát, còn chú thích ghi nhận khả năng hiểu theo nam giới.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, dùng câu ngắn và rõ. Giữ hai lần từ 'tốt' để phản ánh sự lặp lại trong tiếng Hy Lạp; dùng 'cứ ở' để diễn tả sự tiếp tục hàm ý trong ngữ cảnh, nhưng kèm chú thích về nghĩa đen.
