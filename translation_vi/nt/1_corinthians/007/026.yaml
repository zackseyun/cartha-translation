    issue: Diễn giải quá cụ thể τὸ οὕτως εἶναι
    rationale: Cụm “ở trong tình trạng hiện nay của mình” thêm “hiện nay” và “của mình” vào mệnh đề mà tiếng Hy Lạp chỉ nói “ở như vậy.” Ý tiếp tục có thể được diễn đạt bằng “cứ ở,” nhưng tình trạng cụ thể nên để ngữ cảnh xác định.
  - severity: low
    issue: Chú thích b diễn đạt không chính xác sắc thái từ vựng của ἀνθρώπῳ
    rationale: ἀνθρώπῳ thường có nghĩa “một người/con người” và mang dạng giống đực về ngữ pháp; nói rằng bản thân từ này “cũng có thể được hiểu là một người nam” dễ khiến người đọc hiểu đó là nghĩa từ vựng tương đương. Cần nêu tính khái quát của từ và, nếu thích hợp, ảnh hưởng của ngữ cảnh.
