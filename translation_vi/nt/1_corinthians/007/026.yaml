revisions:
- from: 'Vậy, tôi cho rằng vì cảnh khốn khó hiện tại[a], điều này là tốt: một người cứ ở trong tình trạng hiện nay của mình là tốt[b].'
  to: 'Vậy, vì cảnh khốn khó hiện tại[a], tôi cho rằng điều này là tốt: một người cứ ở như vậy thì tốt[b].'
  rationale: Bản sửa giữ “tôi cho rằng” như một nhận định mục vụ, giữ quan hệ nguyên nhân do hoàn cảnh hiện tại, và bảo tồn hai lần “tốt” tương ứng với sự lặp lại của καλόν. “Cứ ở như vậy” diễn đạt ý tiếp tục trong ngữ cảnh mà không xác định quá mức điều kiện hay hoàn cảnh được nói đến. Chú thích được điều chỉnh để trình bày chính xác hơn tính khái quát của ἀνθρώπῳ và các khả năng của ἀνάγκη.
