revisions:
- from: Người vợ không có quyền trên thân thể mình, nhưng chồng có quyền ấy; cũng vậy, người chồng không có quyền trên thân thể mình, nhưng vợ có quyền ấy.[a]
  to: Người vợ không có quyền đối với chính thân thể mình, nhưng người chồng có quyền ấy; cũng vậy, người chồng không có quyền đối với chính thân thể mình, nhưng người vợ có quyền ấy.[a]
  rationale: Điều chỉnh giới từ để câu tiếng Việt tự nhiên hơn và thêm “chính” để phản ánh sự nhấn mạnh của ἰδίος. Chú thích được sửa để nêu một phương án từ vựng sát nghĩa với ἐξουσιάζει, không diễn giải thành quyền tự quyết.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T18:11:10Z'
review_pass:
  verdict: revise
  source_fidelity: Bản dịch giữ đúng cấu trúc đối xứng, tương hỗ của ἐξουσιάζει trong cả hai vế; γυνή/ἀνήρ được hiểu đúng là vợ/chồng trong ngữ cảnh hôn nhân. Tuy nhiên, “có quyền trên thân thể” không phải là kết hợp từ tự nhiên nhất trong tiếng Việt hiện đại. “Có quyền đối với chính thân thể mình” diễn đạt rõ và sát hơn quan hệ thẩm quyền mà động từ Hy Lạp nêu ra, đồng thời giữ sự nhấn mạnh của ἰδίου.
  naturalness: “Có quyền đối với” tự nhiên, trang trọng và rõ nghĩa hơn “có quyền trên.” Lặp lại “người vợ/người chồng” ở cả hai vế giúp sự song hành nguyên ngữ được minh bạch, không gây nặng câu đáng kể.
  terminology: Giữ “thân thể” phù hợp văn cảnh trang trọng và “quyền” phù hợp ἐξουσιάζει. Chú thích nên đưa ra lựa chọn từ vựng gần với động từ gốc (“thực thi quyền”) thay vì “tự quyết định,” vì cách sau chuyển trọng tâm sang quyền tự quyết và làm yếu sắc thái quyền tương hỗ trong bản văn.
  issues:
  - severity: low
    issue: Cụm “có quyền trên thân thể” hơi gượng trong tiếng Việt hiện đại.
    rationale: Tiếng Việt chuẩn thường dùng “có quyền đối với” khi nói về quyền/thẩm quyền liên quan đến một đối tượng.
  - severity: medium
    issue: Chú thích “không tự quyết định về thân thể mình” không phải là lựa chọn tương đương sát với ἐξουσιάζει.
    rationale: Cụm này diễn giải thành quyền tự quyết, trong khi động từ gốc nói đến việc có/thực thi quyền đối với; cần giữ quan hệ quyền tương hỗ giữa hai người phối ngẫu.
  revised_text: Người vợ không có quyền đối với chính thân thể mình, nhưng người chồng có quyền ấy; cũng vậy, người chồng không có quyền đối với chính thân thể mình, nhưng người vợ có quyền ấy.[a]
