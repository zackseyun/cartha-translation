  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἡ γυνὴ τοῦ ἰδίου σώματος οὐκ ἐξουσιάζει ἀλλὰ ὁ ἀνήρ· ὁμοίως δὲ καὶ ὁ ἀνὴρ τοῦ ἰδίου σώματος οὐκ ἐξουσιάζει ἀλλὰ ἡ γυνή.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/004.yaml
  text: The wife does not have authority over her own body[a], but the husband does; likewise also the husband does not have authority over his own body, but the wife does.
translation:
  language: vi
  text: Người vợ không có quyền đối với chính thân thể mình, nhưng người chồng có quyền ấy; cũng vậy, người chồng không có quyền đối với chính thân thể mình, nhưng người vợ có quyền ấy.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “thực thi quyền đối với.” Động từ Hy Lạp có thể chỉ việc có quyền hoặc thực thi quyền; tại đây, quyền ấy được trình bày là tương hỗ giữa vợ và chồng.
    reason: lexical_alternative
lexical_decisions:
- source_word: γυνή
  choice: người vợ / vợ
  rationale: Trong ngữ cảnh hôn nhân trực tiếp của 1 Cô-rinh-tô 7 và khi đi đôi với ἀνήρ, từ này chỉ người vợ, không phải phụ nữ nói chung.
- source_word: ἀνήρ
  choice: người chồng / chồng
  rationale: Khi được đặt đối xứng với γυνή trong ngữ cảnh nghĩa vụ vợ chồng, từ này có nghĩa là người chồng.
- source_word: ἰδίου σώματος
  choice: thân thể mình
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt, đồng thời giữ được sự nhấn mạnh của ἴδιος vào chính thân thể của mỗi người.
- source_word: ἐξουσιάζει
  choice: có quyền trên
  rationale: Diễn đạt trực tiếp ý có hoặc thực thi thẩm quyền đối với một điều gì, đồng thời tránh gia tăng sắc thái cưỡng chế như 'kiểm soát' hay 'chi phối'.
- source_word: ἀλλά
  choice: nhưng
  rationale: Giữ rõ sự tương phản giữa bản thân mỗi người phối ngẫu và người kia.
- source_word: ὁμοίως δὲ καὶ
  choice: cũng vậy
  rationale: Cách nói tiếng Việt tự nhiên và trang trọng, bảo toàn sự đối xứng và tính tương hỗ của hai vế.
theological_decisions:
- issue: Bản chất của quyền trong hôn nhân ở câu này
  choice: Giữ nguyên lời khẳng định về quyền tương hỗ của vợ và chồng đối với thân thể nhau.
  alternative: Diễn đạt yếu hơn theo nghĩa thân thể 'không thuộc về mình', hoặc mạnh hơn theo nghĩa người kia 'kiểm soát' thân thể mình.
  rationale: 'Cấu trúc Hy Lạp cân xứng tuyệt đối: điều được nói về vợ cũng được nói về chồng. Bản dịch không biến quyền này thành thứ bậc một chiều, cũng không làm mờ ngôn ngữ về quyền mà bản văn thực sự dùng.'
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng cặp “người vợ/người chồng” ở lần đầu rồi “vợ/chồng” ở vế đối xứng để câu tự nhiên mà vẫn rõ nghĩa. Cụm “có quyền ấy” tránh lặp nặng nề nhưng không lược bỏ nội dung của động từ Hy Lạp.
