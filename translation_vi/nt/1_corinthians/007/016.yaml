id: 1CO.7.16
reference: 1 Corinthians 7:16
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τί γὰρ οἶδας, γύναι, εἰ τὸν ἄνδρα σώσεις; ἢ τί οἶδας, ἄνερ, εἰ τὴν γυναῖκα σώσεις;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/016.yaml
  text: For how do you know[a], wife, whether you will save your husband? Or how do you know, husband, whether you will save your wife?
translation:
  language: vi
  text: Vì, hỡi người vợ, làm sao chị biết được liệu chị sẽ cứu chồng mình hay không? Hay, hỡi người chồng, làm sao anh biết được liệu anh sẽ cứu vợ mình hay không?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể diễn đạt tự nhiên hơn: “làm sao chị biết được liệu chị có thể cứu chồng mình hay không? ... làm sao anh biết được liệu anh có thể cứu vợ mình hay không?” Tiếng Hy Lạp dùng động từ ở thì tương lai (“sẽ cứu”) trong câu hỏi gián tiếp.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τί γὰρ οἶδας
  choice: Vì ... làm sao ... biết được
  rationale: Cách diễn đạt này chuyển tự nhiên thành ngữ τί + οἶδα trong câu hỏi tu từ, đồng thời giữ lực giải thích của γάρ bằng “Vì”.
- source_word: γύναι
  choice: hỡi người vợ
  rationale: Trong ngữ cảnh hôn nhân, γυνή chỉ người vợ; “hỡi” thể hiện lời gọi trực tiếp mà vẫn giữ giọng trang trọng.
- source_word: ἄνερ
  choice: hỡi người chồng
  rationale: Trong ngữ cảnh hôn nhân, dạng hô cách của ἀνήρ chỉ người chồng; cách dịch giữ sự song song với vế đầu.
- source_word: σώσεις
  choice: sẽ cứu
  rationale: Giữ dạng tương lai của động từ Hy Lạp và nghĩa rộng mang sức nặng cứu rỗi, không thu hẹp thành “đưa đến đức tin” hay “giữ gìn hôn nhân”.
- source_word: τὸν ἄνδρα
  choice: chồng mình
  rationale: Trong tiếng Việt, “chồng mình” diễn đạt tự nhiên quan hệ sở hữu được ngữ cảnh xác định.
- source_word: τὴν γυναῖκα
  choice: vợ mình
  rationale: Trong tiếng Việt, “vợ mình” diễn đạt tự nhiên quan hệ sở hữu được ngữ cảnh xác định.
- source_word: ἢ
  choice: Hay
  rationale: “Hay” nối hai câu hỏi tu từ song song một cách tự nhiên và giữ quan hệ lựa chọn của ἢ.
theological_decisions:
- issue: Ý nghĩa của “cứu” trong bối cảnh hôn nhân
  choice: Giữ nguyên từ “cứu”, để sức nặng liên quan đến sự cứu rỗi vẫn hiện diện mà không giải nghĩa quá mức.
  alternative: “đưa đến đức tin”, “cứu vãn hôn nhân”, hoặc “giúp được cứu”
  rationale: σῴζω thường mang nghĩa cứu rỗi trong thư Phao-lô. Bản dịch không nên thu hẹp nghĩa từ này hoặc ngầm xác định người phối ngẫu là tác nhân tối hậu của sự cứu rỗi; cấu trúc câu hỏi tự nó duy trì sự căng thẳng thần học.
- issue: Sắc thái của câu hỏi với εἰ và động từ tương lai
  choice: Dịch “liệu mình sẽ cứu” để giữ hình thức tương lai trong câu hỏi gián tiếp.
  alternative: “liệu mình có thể cứu” hoặc “biết đâu mình cứu được”
  rationale: Cách dịch chính bám sát σώσεις ở thì tương lai, trong khi chú thích nêu cách diễn đạt Việt ngữ giàu sắc thái khả năng hơn mà không biến câu thành lời tiên báo chắc chắn.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Đại từ “chị/anh” làm rõ người được gọi trong hai vế; “mình” tránh lặp nặng và chỉ người phối ngẫu của chủ thể tương ứng. Dấu chú thích [a] được đặt sau toàn câu vì áp dụng cho cả hai vế song song.
