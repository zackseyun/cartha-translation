  rationale: Bản sửa chỉ hoàn chỉnh cú pháp nghi vấn tiếng Việt và loại bỏ khả năng mơ hồ của “mình”. Vẫn giữ “sẽ cứu” để phản ánh thì tương lai Hy Lạp trong câu hỏi gián tiếp; chú thích nêu phương án Việt ngữ thiên về khả năng mà không biến câu thành lời dự báo.
