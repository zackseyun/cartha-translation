review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng cấu trúc hai câu hỏi tu từ song song, giữ được γάρ (“Vì”), cách gọi trực tiếp người vợ/người chồng, và σώσεις ở tương lai (“sẽ cứu”). Tuy nhiên, cụm “liệu mình sẽ cứu ...?” thiếu phần kết nghi vấn tự nhiên trong tiếng Việt và đại từ “mình” có thể tạo độ mơ hồ không cần thiết.
  naturalness: Cần thêm “hay không” sau mệnh đề với “liệu” và dùng lại “chị/anh” làm chủ ngữ để câu rõ ràng, tự nhiên hơn trong tiếng Việt chuẩn hiện đại. Cách xưng hô “hỡi người vợ/người chồng” phù hợp với giọng văn Kinh Thánh trang trọng.
  terminology: “Cứu” là lựa chọn đúng cho σώσεις, giữ mở chiều kích cứu rỗi mà không diễn giải thành việc cải đạo hay cứu vãn hôn nhân. “Chồng mình/vợ mình” diễn đạt đúng quan hệ hôn nhân theo ngữ cảnh.
  issues:
