id: 1CO.7.37
reference: 1 Corinthians 7:37
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὃς δὲ ἕστηκεν ⸂ἐν τῇ καρδίᾳ αὐτοῦ ἑδραῖος⸃ μὴ ἔχων ἀνάγκην, ἐξουσίαν δὲ ἔχει περὶ τοῦ ἰδίου θελήματος, καὶ τοῦτο κέκρικεν ἐν τῇ ⸂ἰδίᾳ καρδίᾳ⸃, ⸀τηρεῖν τὴν ἑαυτοῦ παρθένον, καλῶς ⸀ποιήσει·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/037.yaml
  text: But whoever stands firm in his heart[a], having no necessity, but has authority over his own will[b], and has decided this in his own heart—to keep his own virgin—he will do well.
translation:
  language: vi
  text: 'Nhưng người nào kiên định trong lòng mình, không có điều gì bắt buộc, lại có quyền tự quyết về ý muốn của mình, và đã quyết định điều này trong lòng: giữ người trinh nữ của mình[a], thì người ấy sẽ làm điều tốt.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Người trinh nữ của mình” có thể chỉ người con gái còn trinh của người ấy hoặc vị hôn thê còn trinh của người ấy; cách hiểu cụm từ Hy Lạp này vẫn còn được tranh luận.
    reason: alternative_reading
lexical_decisions:
- source_word: ἕστηκεν ... ἑδραῖος
  choice: giữ vững lập trường
  rationale: Diễn đạt tự nhiên trạng thái kiên định và quyết tâm đã ổn định mà thể hoàn thành của ἵστημι kết hợp với ἑδραῖος biểu thị.
- source_word: ἐν τῇ καρδίᾳ αὐτοῦ
  choice: trong lòng mình
  rationale: Giữ hình ảnh Kinh Thánh về lòng như nơi của ý chí và quyết định, đồng thời phù hợp với cách nói tiếng Việt hiện đại.
- source_word: μὴ ἔχων ἀνάγκην
  choice: không bị ép buộc
  rationale: ἀνάγκη có thể chỉ sự cần thiết, cưỡng ép hoặc áp lực; trong thế đối lập với quyền tự quyết, 'không bị ép buộc' truyền đạt ý nghĩa rõ ràng mà không xác định nguồn ép buộc.
- source_word: ἐξουσίαν δὲ ἔχει περὶ τοῦ ἰδίου θελήματος
  choice: lại có quyền tự quyết về ý muốn của mình
  rationale: ἐξουσία biểu thị quyền hoặc thẩm quyền, còn θέλημα là ý muốn; cách dịch này cho thấy người ấy có quyền quyết định mà không biến cụm từ thành một khẳng định chuyên biệt về dục vọng.
- source_word: κέκρικεν
  choice: đã quyết định
  rationale: Thể hoàn thành diễn tả một quyết định đã được đưa ra và vẫn có hiệu lực.
- source_word: τηρεῖν
  choice: giữ
  rationale: Giữ sát nghĩa cơ bản của τηρέω là giữ hoặc duy trì, không thêm trực tiếp ý 'không kết hôn' vốn chỉ được suy ra từ văn cảnh.
- source_word: τὴν ἑαυτοῦ παρθένον
  choice: người trinh nữ của mình
  rationale: Giữ mức độ mơ hồ thật sự của tiếng Hy Lạp về việc người này là con gái còn trinh hay vị hôn thê; chú thích nêu hai khả năng.
- source_word: καλῶς ποιήσει
  choice: thì người ấy làm điều tốt
  rationale: Diễn đạt thành ngữ Hy Lạp chỉ một hành động đúng đắn hoặc đáng khen; tiếng Việt hiện tại tự nhiên hơn dạng tương lai cứng nhắc.
theological_decisions:
- issue: Đối tượng của cụm τὴν ἑαυτοῦ παρθένον
  choice: Giữ cách nói tương đối sát và mơ hồ 'người trinh nữ của mình' trong chính văn.
  alternative: Có thể hiểu là 'người con gái còn trinh của mình' hoặc 'vị hôn thê còn trinh của mình'.
  rationale: Cấu trúc Hy Lạp và văn cảnh không giải quyết dứt khoát người đàn ông đang quyết định về con gái dưới quyền mình hay về người phụ nữ đã đính hôn với mình. Việc giữ sự mơ hồ tránh áp đặt một cách giải thích đang còn tranh luận.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng 'người ấy' để tránh lặp đại từ gây nặng câu; giữ 'trong lòng' theo thành ngữ Kinh Thánh. Chính văn bảo toàn sự mơ hồ của παρθένος và không thêm 'chưa kết hôn'.
