  text: θέλω ⸀δὲ πάντας ἀνθρώπους εἶναι ὡς καὶ ἐμαυτόν· ἀλλὰ ἕκαστος ἴδιον ⸂ἔχει χάρισμα⸃ ἐκ θεοῦ, ⸀ὁ μὲν οὕτως, ⸁ὁ δὲ οὕτως.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/007.yaml
  text: But I want all men to be as I myself am. Yet each has his own gift from God, one in this way and another in that way.
translation:
  language: vi
  text: Nhưng tôi muốn mọi người đều như chính tôi. Tuy nhiên, mỗi người có ân tứ riêng từ Đức Chúa Trời, người thì thế này, người thì thế khác.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θέλω
  choice: tôi muốn
  rationale: Diễn đạt trực tiếp ý muốn của Phao-lô mà không nâng thành mệnh lệnh.
- source_word: πάντας ἀνθρώπους
  choice: mọi người
  rationale: Trong ngữ cảnh, ἄνθρωπος chỉ con người nói chung; cách dịch này tự nhiên và không thu hẹp không cần thiết vào nam giới.
- source_word: ὡς καὶ ἐμαυτόν
  choice: như chính tôi
  rationale: Giữ sự nhấn mạnh của đại từ phản thân và không giải thích thêm tình trạng của Phao-lô vốn được suy ra từ ngữ cảnh.
- source_word: χάρισμα
  choice: ân tứ
  rationale: Thuật ngữ quen thuộc, diễn đạt một sự ban cho bởi ân điển từ Đức Chúa Trời.
- source_word: ὁ μὲν οὕτως, ὁ δὲ οὕτως
  choice: người thì thế này, người thì thế khác
  rationale: Giữ cấu trúc đối ứng và sự khái quát có chủ ý của nguyên văn.
theological_decisions:
- issue: Điều Phao-lô muốn mọi người giống mình ở điểm nào
  choice: Không chú giải ngay trong câu; giữ 'như chính tôi'
  alternative: Thêm 'sống độc thân' hoặc 'không kết hôn'
  rationale: Nguyên văn không nêu rõ ngay trong câu; ngữ cảnh liên hệ đến tình trạng hôn nhân nhưng việc thêm lời giải thích sẽ loại bỏ mức độ hàm hồ vốn có.
- issue: Bản chất của ân tứ riêng
  choice: Giữ khái quát là 'ân tứ riêng từ Đức Chúa Trời'
  alternative: Xác định cụ thể là ân tứ độc thân và ân tứ kết hôn
  rationale: Cụm cuối đối chiếu các cách khác nhau nhưng không định danh từng ân tứ; bản dịch không nên áp đặt một hệ thống thần học chi tiết hơn nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng 'Đức Chúa Trời' theo lối dịch Kinh Thánh Tin Lành Việt ngữ; câu văn giữ phép đối xứng ngắn gọn của tiếng Hy Lạp.
