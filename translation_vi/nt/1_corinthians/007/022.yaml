  source_fidelity: Bản dịch giữ đúng cấu trúc đối xứng, ý nghĩa bị động của κληθείς, và sự đối lập κοινων–thần học giữa δοῦλος và ἐλεύθερος. Tuy nhiên, “của Đấng Christ” không nhất quán với quyết định audit là dịch Χριστός như một danh hiệu là “Messiah/Mê-si-a”. Cụm “người được Chúa giải phóng” là cách diễn đạt tự nhiên, nhưng chú thích nên nói rõ đây là cách dịch ý của ἀπελεύθερος κυρίου, vốn nhấn mạnh thân phận người từng là nô lệ đã được tự do trong quan hệ với Chúa.
  naturalness: Câu Việt tự nhiên và trang trọng. Bỏ “người nào đang là/đang tự do” làm câu gọn hơn mà vẫn giữ ý địa vị xã hội lúc được kêu gọi nhờ cấu trúc “nô lệ được kêu gọi” / “người tự do được kêu gọi”.
