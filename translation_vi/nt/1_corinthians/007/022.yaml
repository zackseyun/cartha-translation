- from: Vì người nào đang là nô lệ khi được kêu gọi trong Chúa thì là người được Chúa giải phóng[a]; cũng vậy, người nào đang tự do khi được kêu gọi thì là nô lệ của Đấng Christ.
  to: Vì người nô lệ được kêu gọi trong Chúa là người được Chúa giải phóng[a]; cũng vậy, người tự do được kêu gọi là nô lệ của Đấng Mê-si-a.
  rationale: Bản sửa giữ nghịch lý nô lệ–tự do và cấu trúc song hành của nguyên văn, đồng thời dùng “Đấng Mê-si-a” để phản ánh nhất quán Χριστός như một danh hiệu. Chú thích được điều chỉnh để bảo lưu quan hệ sở hữu trong ἀπελεύθερος κυρίου mà không khẳng định quá mức một cách phân tích ngữ pháp duy nhất.
