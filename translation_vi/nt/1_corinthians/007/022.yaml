id: 1CO.7.22
reference: 1 Corinthians 7:22
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ γὰρ ἐν κυρίῳ κληθεὶς δοῦλος ἀπελεύθερος κυρίου ἐστίν· ⸀ὁμοίως ὁ ἐλεύθερος κληθεὶς δοῦλός ἐστιν Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/022.yaml
  text: For the servant who was called in the Lord is the Lord’s freedman[a]; likewise[b], the free man who was called is Messiah’s servant.
translation:
  language: vi
  text: Vì người nô lệ được kêu gọi trong Chúa là người được Chúa giải phóng[a]; cũng vậy, người tự do được kêu gọi là nô lệ của Đấng Mê-si-a.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát nguyên văn: “người được tự do của Chúa.” Từ Hy Lạp chỉ người từng là nô lệ nhưng đã được trả tự do; cách dịch trong câu cũng diễn tả người ấy thuộc về Chúa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δοῦλος
  choice: nô lệ
  rationale: Giữ nghĩa về thân phận bị lệ thuộc, vì sự tương phản giữa nô lệ và tự do là trọng tâm trong nghịch lý của câu này; “đầy tớ” sẽ làm nhẹ sắc thái ấy.
- source_word: ἐν κυρίῳ
  choice: trong Chúa
  rationale: Giữ cách diễn đạt quen thuộc của Phao-lô về phạm vi hoặc sự liên hiệp với Chúa, không thu hẹp thành “bởi Chúa”.
- source_word: κληθεὶς
  choice: khi được kêu gọi
  rationale: Thể hiện dạng bị động và làm rõ hoàn cảnh của mỗi người vào lúc nhận sự kêu gọi, đồng thời giữ cấu trúc song song của hai vế.
- source_word: ἀπελεύθερος
  choice: người được giải phóng
  rationale: Từ này chỉ người từng ở thân phận nô lệ nhưng đã được trả tự do, chứ không đơn thuần là người vốn tự do.
- source_word: κυρίου
  choice: được Chúa giải phóng
  rationale: Diễn đạt tự nhiên trong tiếng Việt mối liên hệ của người được giải phóng với Chúa; chú thích bảo lưu cách hiểu sát hình thức sở hữu “người được giải phóng của Chúa”.
- source_word: ὁμοίως
  choice: cũng vậy
  rationale: Tái hiện ngắn gọn sự cân xứng tu từ giữa hai vế.
- source_word: ἐλεύθερος
  choice: người đang tự do
  rationale: Chỉ địa vị xã hội đối lập với nô lệ vào thời điểm được kêu gọi; tiếng Việt không cần đánh dấu giống đực ngữ pháp.
- source_word: Χριστοῦ
  choice: của Đấng Christ
  rationale: Dùng danh hiệu “Đấng Christ” theo cách quen thuộc, trang trọng trong tiếng Việt, thể hiện quan hệ thuộc về.
- source_word: κύριος
  choice: Chúa
  rationale: Giữ danh hiệu thần học của Đức Chúa Jesus, thay vì thu hẹp thành quan hệ xã hội “chủ”.
theological_decisions:
- issue: Nghịch lý giữa địa vị xã hội và sự thuộc về Chúa
  choice: 'Giữ đối lập mạnh: người đang là nô lệ trở thành người được Chúa giải phóng, còn người đang tự do trở thành nô lệ của Đấng Christ.'
  alternative: Dùng “đầy tớ” hoặc diễn đạt chung là “người tự do”.
  rationale: Phao-lô cố ý đảo ngược hai địa vị để cho thấy địa vị xã hội bị tương đối hóa bởi mối liên hệ với Chúa; làm nhẹ một trong hai thuật ngữ sẽ giảm sức nặng của lập luận.
- issue: Ý nghĩa của Χριστοῦ
  choice: của Đấng Christ
  alternative: của Đấng Mê-si-a
  rationale: Χριστός vẫn mang giá trị danh hiệu, nhưng “Đấng Christ” là cách diễn đạt tự nhiên và được nhận biết rộng rãi trong văn phong Kinh Thánh tiếng Việt; không biến từ này thành tên riêng thuần túy.
- issue: Quan hệ sở hữu trong ἀπελεύθερος κυρίου
  choice: người được Chúa giải phóng
  alternative: người được giải phóng của Chúa
  rationale: Bản chính ưu tiên tiếng Việt tự nhiên và đúng ý giải phóng khỏi ách nô lệ; chú thích bảo lưu hình thức sở hữu của nguyên văn, vốn cũng có thể nhấn mạnh người ấy thuộc về Chúa.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc “người nào… thì…” giúp câu Hy Lạp có hai vế song song trở nên tự nhiên trong tiếng Việt, đồng thời vẫn giữ các thuật ngữ thần học “trong Chúa”, “Đấng Christ” và nghịch lý nô lệ–tự do.
