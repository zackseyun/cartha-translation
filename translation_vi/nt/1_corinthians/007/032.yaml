revisions:
- from: Nhưng tôi muốn anh chị em không phải lo lắng. Người nam không có vợ[a] thì quan tâm đến những việc của Chúa, làm thế nào để đẹp lòng Chúa;
  to: Nhưng tôi muốn anh chị em không vướng bận lo âu. Người nam độc thân[a] thì quan tâm đến những việc thuộc về Chúa, làm thế nào để đẹp lòng Chúa;
  rationale: Sửa cách diễn đạt về sự không lo âu để phản ánh đúng trạng thái được nói đến trong nguyên ngữ, và thay “không có vợ” bằng “độc thân” để truyền đạt ἄγαμος chính xác, tự nhiên hơn. Giữ dạng nam tính số ít trong chính văn và bảo lưu khả năng diễn đạt rộng hơn trong chú thích.
  reviewer_model: gpt-5.6-terra
