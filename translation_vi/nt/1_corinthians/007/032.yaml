id: 1CO.7.32
reference: 1 Corinthians 7:32
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Θέλω δὲ ὑμᾶς ἀμερίμνους εἶναι. ὁ ἄγαμος μεριμνᾷ τὰ τοῦ κυρίου, πῶς ⸀ἀρέσῃ τῷ κυρίῳ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/032.yaml
  text: But I want you to be free from anxieties. The unmarried man is concerned with the things of the Lord[a], how he may please the Lord;
translation:
  language: vi
  text: Nhưng tôi muốn anh chị em không vướng bận lo âu. Người nam độc thân[a] thì quan tâm đến những việc thuộc về Chúa, làm thế nào để đẹp lòng Chúa;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Người chưa kết hôn.” Tiếng Hy Lạp dùng dạng giống đực số ít (“người nam độc thân”), dù trong mạch văn chung Phao-lô bàn đến cả nam lẫn nữ, đã kết hôn lẫn chưa kết hôn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Θέλω δὲ
  choice: Nhưng tôi muốn
  rationale: θέλω diễn tả ý muốn; δέ mang sắc thái chuyển ý hoặc tương phản nhẹ. “Nhưng” nối tự nhiên với phần bàn luận trước đó.
- source_word: ὑμᾶς ἀμερίμνους εἶναι
  choice: anh chị em không phải lo lắng
  rationale: ἀμέριμνος chỉ tình trạng không bị nỗi lo hoặc sự bận tâm chi phối; cách diễn đạt này tự nhiên trong tiếng Việt và không hàm ý thờ ơ.
- source_word: ὁ ἄγαμος
  choice: Người nam không có vợ
  rationale: Danh từ hóa ở giống đực số ít; trong mạch văn gần, Phao-lô lần lượt phân biệt trường hợp người nam và người nữ. Cách dịch này giữ giới tính và số của nguyên văn.
- source_word: μεριμνᾷ
  choice: quan tâm đến
  rationale: μεριμνάω có thể mang nghĩa lo lắng hoặc quan tâm. Ở đây đối tượng là việc của Chúa, nên “quan tâm đến” truyền đạt sắc thái tích cực, đồng thời vẫn giữ liên hệ ý nghĩa với ἀμέριμνος ở câu trước.
- source_word: τὰ τοῦ κυρίου
  choice: những việc của Chúa
  rationale: Thành ngữ chỉ rộng rãi những điều hoặc công việc thuộc về Chúa; “những việc của Chúa” rõ ràng và tự nhiên.
- source_word: κυρίου / κυρίῳ
  choice: Chúa
  rationale: κύριος ở đây là tước hiệu trong ngữ cảnh Cơ Đốc, nên dịch nhất quán là “Chúa”.
- source_word: πῶς ἀρέσῃ τῷ κυρίῳ
  choice: làm thế nào để đẹp lòng Chúa
  rationale: πῶς nêu cách thức hoặc mục tiêu; cấu trúc với thể giả định ἀρέσῃ được diễn đạt tự nhiên bằng “làm thế nào để”, không biến hành động được dự tính thành điều chắc chắn.
theological_decisions:
- issue: Cách diễn đạt giống đực số ít trong sự đối chiếu giữa tình trạng không kết hôn và đã kết hôn
  choice: 'Giữ giống đực số ít trong chính văn: “Người nam không có vợ”'
  alternative: “Người chưa kết hôn” hoặc “Người độc thân”
  rationale: ὁ ἄγαμος là giống đực số ít, và các câu kế tiếp lần lượt bàn riêng về người nam và người nữ. Giữ dạng giống đực tránh trung tính hóa nguyên văn; chú thích cho biết phạm vi bàn luận rộng hơn của cả đoạn.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “anh chị em” cho đại từ số nhiều ὑμᾶς; “không có vợ” giữ nét giống đực của ὁ ἄγαμος, còn chú thích bảo tồn khả năng hiểu rộng theo mạch văn.
