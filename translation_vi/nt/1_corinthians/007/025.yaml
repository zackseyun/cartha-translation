id: 1CO.7.25
reference: 1 Corinthians 7:25
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Περὶ δὲ τῶν παρθένων ἐπιταγὴν κυρίου οὐκ ἔχω, γνώμην δὲ δίδωμι ὡς ἠλεημένος ὑπὸ κυρίου πιστὸς εἶναι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/025.yaml
  text: Concerning virgins[a], I have no command from the Lord[c][b], but I give my judgment as one who by the Lord’s mercy is trustworthy.
translation:
  language: vi
  text: Về các trinh nữ[a], tôi không có mệnh lệnh nào từ Chúa, nhưng tôi đưa ra nhận định của mình[b], với tư cách là người đã được Chúa thương xót để trở nên đáng tin cậy[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “những phụ nữ chưa kết hôn”, hoặc theo một số cách hiểu văn cảnh là “các con gái còn đồng trinh”. Tiếng Hy Lạp nói là “các trinh nữ”.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “ý kiến của mình” hoặc “lời khuyên của mình”. Ở đây Phao-lô phân biệt nhận định đã cân nhắc của ông với một “mệnh lệnh từ Chúa” trực tiếp.
    reason: alternative_reading
  - marker: c
    text: Cũng có thể dịch là “trung tín”. Từ Hy Lạp có thể mang nghĩa “trung tín” hoặc “đáng tin cậy”; trong văn cảnh này, nghĩa có khả năng hơn là Phao-lô, là người đã được Chúa thương xót, là người hướng dẫn đáng tin cậy.
    reason: lexical_alternative
lexical_decisions:
- source_word: Περὶ δὲ
  choice: Về
  rationale: Đây là công thức chuyển sang một chủ đề mới. “Về” tự nhiên trong tiếng Việt và không thêm ý thời gian vốn không có trong nguyên văn.
- source_word: τῶν παρθένων
  choice: các trinh nữ
  rationale: παρθένος về cơ bản chỉ người nữ đồng trinh, thường là phụ nữ trẻ chưa kết hôn. Cách dịch này giữ nguyên cách gọi của tiếng Hy Lạp và không quyết định hẹp hơn về đối tượng trong văn cảnh.
- source_word: ἐπιταγὴν κυρίου
  choice: mệnh lệnh nào từ Chúa
  rationale: ἐπιταγή là mệnh lệnh hoặc chỉ thị có thẩm quyền. “Từ Chúa” diễn đạt rõ nguồn của mệnh lệnh; “nào” phù hợp với câu phủ định tiếng Việt.
- source_word: γνώμην δὲ δίδωμι
  choice: nhưng tôi đưa ra nhận định của mình
  rationale: γνώμη chỉ nhận định hoặc ý kiến đã được cân nhắc, đối lập với một mệnh lệnh trực tiếp; δίδωμι được diễn đạt tự nhiên bằng “đưa ra”.
- source_word: ὡς ἠλεημένος ὑπὸ κυρίου
  choice: với tư cách là người nhờ lòng thương xót của Chúa
  rationale: ὡς nêu tư cách mà Phao-lô đưa ra nhận định; phân từ hoàn thành bị động ἠλεημένος cho biết ông là người đã nhận lòng thương xót từ Chúa. Cách diễn đạt này tự nhiên mà vẫn quy địa vị ấy cho lòng thương xót của Chúa.
- source_word: πιστὸς εἶναι
  choice: đáng tin cậy
  rationale: πιστός có thể là “trung tín” hoặc “đáng tin cậy”. Trong mạch lập luận về giá trị nhận định của Phao-lô, “đáng tin cậy” diễn đạt rõ nét nghĩa về độ khả tín nhưng chú thích vẫn bảo lưu khả năng kia.
theological_decisions:
- issue: Thẩm quyền của nhận định Phao-lô khi không có mệnh lệnh trực tiếp từ Chúa
  choice: Bản dịch phân biệt rõ việc không có mệnh lệnh từ Chúa với việc Phao-lô vẫn đưa ra một nhận định trong tư cách người được Chúa thương xót và đáng tin cậy.
  alternative: Có thể hiểu lời này chỉ là ý kiến riêng không có thẩm quyền, hoặc cho rằng Phao-lô đang gián tiếp dẫn một mệnh lệnh chưa được ghi lại của Chúa Giê-su.
  rationale: Sự đối lập giữa ἐπιταγή và γνώμη cho thấy Phao-lô không viện dẫn một mệnh lệnh trực tiếp của Chúa về vấn đề này, nhưng ông cũng không hạ nhận định của mình thành một ý kiến tùy tiện. Bản dịch giữ nguyên sức căng đó.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “trinh nữ” để sát danh từ Hy Lạp và tránh diễn giải quá mức; cấu trúc câu giữ rõ sự tương phản giữa “mệnh lệnh” và “nhận định”.
