  naturalness: “Thà kết hôn còn hơn bị thiêu đốt” là lối so sánh tự nhiên, gọn và phù hợp văn phong Kinh Thánh tiếng Việt hiện đại. Cách này cũng tránh làm cho “dục vọng” nghe quá tiêu cực hoặc quá cụ thể trong bản văn chính.
  terminology: Giữ “tự chủ được” cho ἐγκρατεύονται và “kết hôn” cho γαμέω là chuẩn xác, phổ thông. “Bị thiêu đốt” bảo lưu ẩn dụ của πυροῦσθαι; chú thích giải thích nghĩa theo văn cảnh mà không biến nó thành nội dung minh nhiên của câu.
