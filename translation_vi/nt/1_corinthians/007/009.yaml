id: 1CO.7.9
reference: 1 Corinthians 7:9
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἰ δὲ οὐκ ἐγκρατεύονται, γαμησάτωσαν, κρεῖττον γάρ ἐστιν ⸀γαμῆσαι ἢ πυροῦσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/009.yaml
  text: But if they do not have self-control[a], let them marry; for it is better to marry than to burn.
translation:
  language: vi
  text: Nhưng nếu họ không tự chủ được, thì hãy kết hôn; vì thà kết hôn còn hơn bị thiêu đốt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay đơn giản là “bị thiêu đốt”. Tiếng Hy Lạp để nghĩa này hàm ẩn hơn; trong văn cảnh này, rất có thể nói đến việc bị ham muốn tình dục thiêu đốt.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγκρατεύονται
  choice: tự chủ được
  rationale: Diễn đạt tự nhiên khả năng kiềm chế bản thân trong bối cảnh ham muốn tình dục; giữ sắc thái của thể trung động mà không diễn giải quá mức.
- source_word: γαμησάτωσαν
  choice: hãy kết hôn
  rationale: Giữ nguyên lực mệnh lệnh của động từ mệnh lệnh cách ngôi ba số nhiều, đồng thời tự nhiên trong tiếng Việt hiện đại.
- source_word: κρεῖττον
  choice: còn hơn
  rationale: Trong cấu trúc so sánh này, “còn hơn” truyền đạt tự nhiên ý nghĩa “tốt hơn” mà không hàm ý rằng hôn nhân chỉ là điều miễn cưỡng.
- source_word: γαμῆσαι
  choice: kết hôn
  rationale: Tương đương trực tiếp, trang trọng và phổ thông của động từ nguyên mẫu Hy Lạp.
- source_word: πυροῦσθαι
  choice: bị dục vọng thiêu đốt
  rationale: Giữ hình ảnh “thiêu đốt” của tiếng Hy Lạp và làm rõ nghĩa được văn cảnh về hôn nhân cùng sự tự chủ gợi ra mạnh mẽ; chú thích bảo lưu cách dịch hàm ẩn hơn.
- source_word: δὲ
  choice: Nhưng
  rationale: Thể hiện sự tương phản nhẹ với lời khuyên ở câu trước.
theological_decisions:
- issue: Ý nghĩa của πυροῦσθαι trong văn cảnh
  choice: bị dục vọng thiêu đốt
  alternative: bị thiêu đốt; chịu lửa phán xét
  rationale: Sự đối chiếu trực tiếp giữa không tự chủ được và kết hôn khiến ham muốn tình dục là nghĩa có khả năng cao nhất. Tuy nhiên, vì danh từ “dục vọng” không hiện diện minh nhiên trong tiếng Hy Lạp, cách dịch sát hơn được giữ trong chú thích.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Cấu trúc ngắn gọn giữ nhịp lập luận và tính mệnh lệnh của nguyên văn; hình ảnh lửa được bảo tồn.
