  text: τῇ γυναικὶ ὁ ἀνὴρ τὴν ⸀ὀφειλὴν ἀποδιδότω, ὁμοίως δὲ καὶ ἡ γυνὴ τῷ ἀνδρί.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/003.yaml
  text: The husband must give to his wife her marital duty, and likewise the wife to her husband.
translation:
  language: vi
  text: Người chồng phải làm tròn bổn phận vợ chồng đối với vợ mình[a]; người vợ đối với chồng mình cũng vậy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “trao cho vợ điều phải trả cho vợ”; sát nghĩa hơn là “nghĩa vụ phải làm tròn”. Trong ngữ cảnh, từ này nói đến nghĩa vụ chăn gối mà vợ chồng có đối với nhau.
    reason: lexical_alternative
lexical_decisions:
- source_word: γυναικί
  choice: vợ mình
  rationale: Trong ngữ cảnh hôn nhân, γυνή chỉ người vợ; đại từ “mình” làm rõ quan hệ vợ chồng một cách tự nhiên trong tiếng Việt.
- source_word: ἀνήρ / ἀνδρί
  choice: người chồng / chồng mình
  rationale: Trong cấu trúc song song nói về hôn nhân, ἀνήρ mang nghĩa “chồng”, không phải nghĩa rộng là “người đàn ông”.
- source_word: ὀφειλήν
  choice: bổn phận vợ chồng
  rationale: Danh từ này chỉ điều mắc nợ hay nghĩa vụ phải thực hiện. Ngữ cảnh các câu 2, 4–5 cho thấy đây là nghĩa vụ chăn gối giữa hai vợ chồng; cách dịch này rõ nghĩa nhưng không cụ thể hóa quá mức.
- source_word: ἀποδιδότω
  choice: phải làm tròn
  rationale: Thể mệnh lệnh hiện tại diễn tả nghĩa vụ cần được thực hiện. “Phải làm tròn” kết hợp tự nhiên với “bổn phận” và giữ được sắc thái bắt buộc.
- source_word: ὁμοίως δὲ καὶ
  choice: cũng vậy
  rationale: Cụm từ thiết lập sự tương ứng và tính hỗ tương đầy đủ giữa nghĩa vụ của chồng và vợ.
theological_decisions:
- issue: Mức độ nói rõ nghĩa vụ được обознач bằng ὀφειλή
  choice: Dùng “bổn phận vợ chồng” trong chính văn.
  alternative: “điều phải trao cho vợ/chồng” hoặc sát chữ hơn là “món nợ/nghĩa vụ”
  rationale: Ngữ cảnh xác định đây là nghĩa vụ chăn gối, nhưng bản thân danh từ có nghĩa rộng là điều phải trả hay nghĩa vụ. “Bổn phận vợ chồng” truyền đạt ý theo ngữ cảnh mà không biến câu thành một cách diễn đạt thuần pháp lý hoặc giải thích quá chi tiết.
- issue: Tính hỗ tương của mệnh lệnh
  choice: Giữ cấu trúc cân xứng, áp dụng cùng một bổn phận cho cả chồng lẫn vợ.
  alternative: Diễn đạt câu thứ hai như một bổ sung thứ yếu
  rationale: ὁμοίως δὲ καὶ nhấn mạnh rằng người vợ có nghĩa vụ tương ứng đối với chồng, nên bản dịch không được tạo ra sự bất cân xứng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Bổn phận vợ chồng” là cách nói quen thuộc, kín đáo nhưng vẫn đủ rõ nhờ ngữ cảnh; dấu chấm phẩy bảo toàn cấu trúc song song và tính hỗ tương của nguyên văn.
