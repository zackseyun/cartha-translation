source:
  edition: SBLGNT
  text: καὶ οἱ χρώμενοι ⸂τὸν κόσμον⸃ ὡς μὴ καταχρώμενοι· παράγει γὰρ τὸ σχῆμα τοῦ κόσμου τούτου.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/031.yaml
  text: and those who use the world as not making full use of it[b][a]; for the present form of this world is passing away.
translation:
  language: vi
  text: còn những người sử dụng những điều thuộc thế gian thì như không sử dụng chúng đến mức tối đa; vì diện mạo[b] của thế gian này đang qua đi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Hay: “hình thức”, “hình trạng” của thế gian này.'
    reason: lexical_alternative
lexical_decisions:
- source_word: χρώμενοι τὸν κόσμον
  choice: dùng những gì thuộc về thế gian
  rationale: Trong ngữ cảnh, cụm từ nói đến việc sử dụng và giao tiếp với những thực tại của thế gian. Cách diễn đạt này tự nhiên hơn trong tiếng Việt so với “dùng thế gian”, đồng thời không thu hẹp ý nghĩa vào một lĩnh vực cụ thể.
- source_word: ὡς μὴ καταχρώμενοι
  choice: thì như không tận dụng hết
  rationale: καταχράομαι ở đây có thể nhấn mạnh việc dùng hết mức, tận dụng triệt để, hoặc mang sắc thái lạm dụng. “Không tận dụng hết” giữ được sự đối ứng với χρώμενοι mà không mặc nhiên biến lời này thành lời lên án sự lạm dụng về đạo đức.
- source_word: παράγει
  choice: đang qua đi
  rationale: Thì hiện tại diễn tả tiến trình đang diễn ra; “đang qua đi” vừa sát nghĩa vừa nhấn mạnh tính tạm thời.
- source_word: σχῆμα
  choice: hình trạng
  rationale: σχῆμα chỉ hình thức, diện mạo hoặc trạng thái biểu hiện hiện thời, chứ không nhất thiết là bản chất. “Hình trạng” trang trọng, khá dễ hiểu và giữ được độ mở của từ gốc.
- source_word: τοῦ κόσμου τούτου
  choice: của thế gian này
  rationale: Giữ đại từ chỉ định τούτου, nhấn mạnh trật tự thế gian hiện tại đang qua đi.
theological_decisions:
- issue: Ý nghĩa của καταχρώμενοι trong quan hệ với χρώμενοι
  choice: Dùng những gì thuộc về thế gian nhưng như không tận dụng chúng đến mức trọn vẹn hay triệt để.
  alternative: Không lạm dụng thế gian; hoặc như thể không dùng thế gian.
  rationale: Cặp χρώμενοι/καταχρώμενοι tạo lối chơi chữ giữa “dùng” và “dùng hết mức”. Bản dịch giữ sự căng thẳng này, không thu hẹp thành lời cấm lạm dụng và cũng không phủ nhận mọi sự sử dụng.
- issue: Ý nghĩa của σχῆμα
  choice: Hình thức hay trạng thái biểu hiện hiện thời của thế gian.
  alternative: Chỉ vẻ bề ngoài của thế gian; hoặc bản chất của thế gian.
  rationale: Từ này nói đến cấu hình hay diện mạo hiện tại đang qua đi, không khẳng định rằng bản chất của công trình sáng tạo đang mất đi.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. “Những gì thuộc về thế gian” làm rõ đối tượng sử dụng theo ngữ cảnh tiếng Việt; “hình trạng” giữ sắc thái về hình thức hiện thời mà không đồng nhất với bản chất.
