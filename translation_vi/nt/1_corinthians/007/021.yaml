  to: Bạn được kêu gọi khi đang là nô lệ sao? Đừng bận tâm về điều đó. Nhưng nếu quả thật bạn có thể trở thành người tự do, thì càng nên tận dụng cơ hội ấy[a].
  rationale: Sửa câu hỏi mở đầu để quan hệ “được kêu gọi khi đang là nô lệ” rõ hơn, và thêm “càng nên” để phản ánh μᾶλλον. Bản văn chính vẫn theo cách hiểu tân ngữ hàm ẩn là cơ hội được tự do; chú thích bảo tồn cách hiểu truyền thống thay thế mà không áp đặt cách giải thích đó.
