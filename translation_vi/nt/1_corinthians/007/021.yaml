  text: Δοῦλος ἐκλήθης; μή σοι μελέτω· ἀλλ’ εἰ καὶ δύνασαι ἐλεύθερος γενέσθαι, μᾶλλον χρῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/021.yaml
  text: Were you called as a servant? Do not let it trouble you. But if indeed you are able to become free[a], rather make use of it.
translation:
  language: vi
  text: Bạn được kêu gọi khi đang là nô lệ sao? Đừng bận tâm về điều đó. Nhưng nếu quả thật bạn có thể trở thành người tự do, thì càng nên tận dụng cơ hội ấy[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể hiểu: “thì càng nên tận dụng hoàn cảnh hiện tại,” tức là cứ ở trong thân phận ấy. Cụm từ Hy Lạp được dịch là “càng nên tận dụng” không nêu rõ tân ngữ, nên đã được hiểu theo cả hai cách.'
    reason: alternative_reading
lexical_decisions:
- source_word: Δοῦλος
  choice: nô lệ
  rationale: Chỉ thân phận bị ràng buộc, phù hợp với sự đối lập trực tiếp với việc trở thành người tự do; “đầy tớ” sẽ làm nhẹ đi nét nghĩa xã hội-pháp lý trong ngữ cảnh.
- source_word: ἐκλήθης
  choice: khi được kêu gọi
  rationale: Giữ cách nói thụ động và không thêm chủ thể hay lời giải thích như “được Đức Chúa Trời kêu gọi”; trật tự câu tiếng Việt làm rõ đây là thân phận lúc nhận sự kêu gọi.
- source_word: μή σοι μελέτω
  choice: đừng bận tâm về điều đó
  rationale: Diễn đạt tự nhiên sắc thái đừng lo lắng hay quá bận lòng, đồng thời giữ giọng mục vụ của câu.
- source_word: ἐλεύθερος γενέσθαι
  choice: trở thành người tự do
  rationale: Phản ánh trực tiếp sự thay đổi thân phận từ nô lệ sang tự do.
- source_word: μᾶλλον χρῆσαι
  choice: thì hãy tận dụng cơ hội ấy
  rationale: Hiểu tân ngữ bị lược là cơ hội trở thành người tự do vừa nêu. Cách dịch tự nhiên trong tiếng Việt nhưng sự mơ hồ thật sự của nguyên văn được giữ lại trong chú thích.
theological_decisions:
- issue: Sự mơ hồ trong μᾶλλον χρῆσαι
  choice: Phao-lô khuyên tận dụng cơ hội được tự do nếu có.
  alternative: Phao-lô khuyên tận dụng chính hoàn cảnh hiện tại, tức tiếp tục ở thân phận nô lệ.
  rationale: Cú pháp gần nhất cho phép hiểu cơ hội được tự do là tân ngữ ngầm của χρῆσαι. Tuy nhiên, vì nguyên văn không nêu tân ngữ và cách hiểu còn lại có cơ sở lâu đời, chú thích trình bày cả hai thay vì xóa bỏ sự căng thẳng diễn giải.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “bạn” số ít để phản ánh động từ ngôi thứ hai số ít và lời nói trực tiếp; dùng “nô lệ” vì thân phận bị ràng buộc là điểm nổi bật trong ngữ cảnh.
