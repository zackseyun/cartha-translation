review_pass:
  verdict: revise
  source_fidelity: Bản dịch phản ánh đúng lời mệnh lệnh βλέπετε, ý đề phòng của μή πως, ἐξουσία là “quyền”, và hình ảnh πρόσκομμα là “cớ vấp ngã”. Tuy nhiên, “lại trở thành” có thể gợi ý sự tái diễn (“trở thành lần nữa”), một nét nghĩa không có trong γένηται; nên bỏ “lại” để giữ lời cảnh báo về một khả năng xảy ra.
  naturalness: Câu văn rõ ràng, tự nhiên và phù hợp văn phong Kinh Thánh tiếng Việt hiện đại. “Hãy cẩn thận, kẻo ... trở thành ...” là cấu trúc mạch lạc hơn khi không có “lại”.
  terminology: “Quyền”, “cớ vấp ngã”, và “những người yếu đuối” phù hợp ngữ cảnh 1 Cô-rinh-tô 8. Chú thích giải thích đúng “yếu” là yếu về lương tâm trong vấn đề đang bàn, không áp đặt cách hiểu giáo phái.
  issues:
  - severity: low
    issue: Từ “lại” trong “lại trở thành”
    rationale: γένηται chỉ diễn tả “trở thành/đến thành”, không hàm ý lặp lại. Trong tiếng Việt, “lại” có thể bị hiểu là một lần nữa; bỏ từ này giúp bản dịch sát nguồn hơn mà vẫn tự nhiên.
  revised_text: Nhưng hãy cẩn thận, kẻo quyền này của anh chị em trở thành cớ vấp ngã cho những người yếu đuối.[a][b]
