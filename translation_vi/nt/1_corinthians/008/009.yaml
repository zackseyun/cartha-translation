revisions:
- from: Nhưng hãy cẩn thận, kẻo quyền này của anh chị em lại trở thành cớ vấp ngã cho những người yếu đuối.[a][b]
  to: Nhưng hãy cẩn thận, kẻo quyền này của anh chị em trở thành cớ vấp ngã cho những người yếu đuối.[a][b]
  rationale: Chỉ bỏ “lại” để tránh thêm sắc thái tái diễn không được nêu trong nguyên văn. Các lựa chọn còn lại giữ đúng ý nghĩa, thuật ngữ và mức độ trang trọng của bản văn.
