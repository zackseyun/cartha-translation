id: 1CO.8.9
reference: 1 Corinthians 8:9
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: βλέπετε δὲ μή πως ἡ ἐξουσία ὑμῶν αὕτη πρόσκομμα γένηται τοῖς ⸀ἀσθενέσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/009.yaml
  text: But take care that this right of yours does not somehow become a stumbling block to the weak[a][b].
translation:
  language: vi
  text: Nhưng hãy cẩn thận, kẻo quyền này của anh chị em trở thành cớ vấp ngã cho những người yếu đuối.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “sự tự do này của anh chị em.” Từ Hy Lạp có thể mang nghĩa “thẩm quyền”, “quyền” hoặc “sự tự do”; ở đây, từ này nói đến sự tự do mà một số tín hữu cho rằng mình có trong việc ăn thức ăn liên quan đến thần tượng.'
    reason: lexical_alternative
  - marker: b
    text: “Những người yếu đuối” ở đây là những người có lương tâm yếu trong vấn đề này.
    reason: cultural_note
lexical_decisions:
- source_word: βλέπετε
  choice: hãy cẩn thận
  rationale: Động từ ở thể mệnh lệnh kêu gọi cảnh giác; cách diễn đạt này tự nhiên trong tiếng Việt hiện đại và giữ được sắc thái cảnh báo.
- source_word: δὲ
  choice: Nhưng
  rationale: Đánh dấu sự chuyển ý có tính tương phản nhẹ từ phần bàn luận trước sang lời cảnh báo.
- source_word: μή πως
  choice: kẻo ... lại
  rationale: Diễn đạt tự nhiên một lời đề phòng nhằm tránh một kết quả có thể xảy ra.
- source_word: ἡ ἐξουσία ὑμῶν αὕτη
  choice: quyền này của anh chị em
  rationale: Trong ngữ cảnh, ἐξουσία nói đến quyền hoặc sự tự do mà một số tín hữu cho rằng mình có trong việc ăn thức ăn liên quan đến thần tượng. “Quyền” giữ được tính cụ thể của điều họ tự nhận là chính đáng.
- source_word: πρόσκομμα
  choice: cớ vấp ngã
  rationale: Giữ hình ảnh ẩn dụ về một điều khiến người khác sa ngã về mặt lương tâm hoặc thuộc linh, đồng thời là cách nói quen thuộc và dễ hiểu trong tiếng Việt.
- source_word: γένηται
  choice: trở thành
  rationale: Phản ánh trực tiếp ý nghĩa ‘trở nên, trở thành’ của động từ trong mệnh đề đề phòng.
- source_word: τοῖς ἀσθενέσιν
  choice: cho những người yếu đuối
  rationale: Giữ cách nói ngắn gọn của nguyên văn; ngữ cảnh chương 8 xác định đây là những người có lương tâm yếu trong vấn đề này.
theological_decisions:
- issue: Ý nghĩa của ἐξουσία trong ngữ cảnh
  choice: Chỉ quyền mà các tín hữu Cô-rinh-tô tự nhận có liên quan đến thức ăn đã cúng cho thần tượng.
  alternative: Chỉ thẩm quyền hoặc năng lực theo nghĩa rộng hơn.
  rationale: Ngữ cảnh trực tiếp của 1 Cô-rinh-tô 8 bàn về sự tự do ăn thức ăn liên quan đến thần tượng. Dùng “quyền” nêu đúng vấn đề đạo đức thực tế mà không đưa vào ý niệm về thẩm quyền chức vụ.
- issue: Ý nghĩa của τοῖς ἀσθενέσιν
  choice: Chỉ những anh chị em cùng đức tin có lương tâm yếu hoặc dễ bị tổn thương trong vấn đề này.
  alternative: Chỉ người yếu nói chung hoặc yếu về thể chất.
  rationale: Trong cả chương, “yếu” gắn với lương tâm. Bản văn chính vẫn giữ cách gọi cô đọng “những người yếu đuối”, còn chú thích làm rõ nghĩa theo ngữ cảnh mà không diễn giải quá mức.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “anh chị em” để chuyển đại từ số nhiều ὑμῶν theo lối xưng hô cộng đồng, không thu hẹp giới tính. Cấu trúc “hãy cẩn thận, kẻo ... lại” giữ rõ sức cảnh báo của câu Hy Lạp.
