id: 1CO.8.5
reference: 1 Corinthians 8:5
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ γὰρ εἴπερ εἰσὶν λεγόμενοι θεοὶ εἴτε ἐν οὐρανῷ εἴτε ἐπὶ γῆς, ὥσπερ εἰσὶν θεοὶ πολλοὶ καὶ κύριοι πολλοί,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/005.yaml
  text: For even if there are so-called gods[b][a], whether in heaven or on earth—as indeed there are many gods and many lords—
translation:
  language: vi
  text: Vì dù có những vị được gọi là thần[a], dù ở trên trời hay trên đất—như thật có nhiều thần và nhiều chúa[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “các thần được gọi là thần.” Phân từ Hy Lạp có nghĩa là “được gọi”; trong ngữ cảnh, cách nói này nêu danh xưng được gán cho họ và không nhất thiết xác nhận họ thật sự là thần.'
    reason: lexical_alternative
  - marker: b
    text: “Chúa” ở đây dịch dạng số nhiều của cùng từ Hy Lạp thường được dịch là “Chúa.” Tại đây, từ này nói đến nhiều hữu thể hoặc quyền lực được người ta nhìn nhận bằng danh xưng ấy, không phải Chúa duy nhất ở câu 6.
    reason: cross_reference
lexical_decisions:
- source_word: καὶ γὰρ
  choice: Vì dù
  rationale: “Vì” giữ chức năng giải thích của γάρ, còn sắc thái nhấn mạnh của καί được thể hiện tự nhiên trong cả mệnh đề nhượng bộ.
- source_word: εἴπερ
  choice: dù có
  rationale: Trong ngữ cảnh, từ này nêu một điều được tạm chấp nhận để lập luận; “dù có” diễn đạt tự nhiên sắc thái nhượng bộ mà không biến câu thành lời khẳng định tuyệt đối.
- source_word: λεγόμενοι θεοὶ
  choice: những kẻ được gọi là các thần
  rationale: Cách dịch này giữ nghĩa trực tiếp “được gọi” và không buộc tiếng Hy Lạp phải mang sắc thái mỉa mai; ngữ cảnh vẫn cho thấy Phao-lô không nhìn nhận họ là thần theo cùng nghĩa với Đức Chúa Trời duy nhất.
- source_word: εἴτε ἐν οὐρανῷ εἴτε ἐπὶ γῆς
  choice: hoặc ở trên trời, hoặc ở dưới đất
  rationale: Giữ cấu trúc song hành và phạm vi vũ trụ luận của nguyên văn bằng cách diễn đạt Việt ngữ rõ ràng, tự nhiên.
- source_word: ὥσπερ
  choice: quả thật
  rationale: 'Diễn đạt sắc thái xác nhận của ὥσπερ trong lời nhận xét chen vào: trên thực tế có nhiều đối tượng được người ta nhìn nhận bằng các danh xưng ấy.'
- source_word: θεοὶ πολλοὶ
  choice: nhiều thần
  rationale: Giữ danh từ số nhiều và không viết hoa, phù hợp với các hữu thể hoặc đối tượng được xem là thần chứ không phải Đức Chúa Trời duy nhất.
- source_word: κύριοι πολλοί
  choice: nhiều chúa
  rationale: “Chúa” duy trì liên hệ từ vựng với κύριος ở câu 6; viết thường và dùng số nhiều phân biệt các chủ thể được người ta gọi bằng tước hiệu này với Chúa duy nhất.
theological_decisions:
- issue: Khoảng cách tu từ của Phao-lô đối với các thần ngoại giáo
  choice: Dịch λεγόμενοι θεοὶ là “những kẻ được gọi là các thần”, kèm chú thích về khả năng “những kẻ gọi là thần”.
  alternative: các thần gọi là; những kẻ gọi là thần
  rationale: Phân từ λεγόμενοι trước hết chỉ sự gọi tên; bản dịch chính bảo tồn sự mơ hồ chính đáng thay vì đưa sắc thái hoài nghi mạnh hơn trực tiếp vào câu. Mạch văn câu 4–6 vẫn đặt các thần này trong thế tương phản với Đức Chúa Trời duy nhất.
- issue: κύριοι số nhiều đối lập với κύριος duy nhất ở câu 6
  choice: Dùng “các chúa/nhiều chúa” viết thường.
  alternative: các chủ; các bậc chủ tể
  rationale: Giữ sự lặp từ có ý nghĩa giữa κύριοι ở câu 5 và κύριος ở câu 6, đồng thời chữ thường và số nhiều cho thấy đây không phải là Chúa duy nhất được tuyên xưng ở câu sau.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ cấu trúc câu chưa kết thúc bằng dấu gạch ngang để nối sang lời tương phản ở câu 6. Cặp “trên trời/dưới đất” có sắc thái Kinh Thánh quen thuộc nhưng vẫn tự nhiên trong tiếng Việt hiện đại.
