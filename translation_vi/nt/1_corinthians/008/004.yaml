reference: 1 Corinthians 8:4
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Περὶ τῆς βρώσεως οὖν τῶν εἰδωλοθύτων οἴδαμεν ὅτι οὐδὲν εἴδωλον ἐν κόσμῳ, καὶ ὅτι οὐδεὶς ⸀θεὸς εἰ μὴ εἷς.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/004.yaml
  text: Therefore[a], concerning the eating of food sacrificed to idols, we know that an idol is nothing in the world[b], and that there is no God except one.
translation:
  language: vi
  text: 'Vậy, về việc ăn thức ăn đã cúng tế cho thần tượng, chúng ta biết rằng thần tượng chẳng là gì trong thế gian[a], và không có thần nào khác ngoài một Đức Chúa Trời.[b]


    [a] Cũng có thể dịch: “thần tượng không thực sự hiện hữu trong thế gian.”


    [b] Cũng có thể dịch: “không có thần nào ngoài một.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “thần tượng không thực sự hiện hữu trong thế gian.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “không có thần nào ngoài một.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: βρώσεως
  choice: việc ăn
  rationale: Danh từ chỉ hành động ăn; cách dịch này giữ được nghĩa động tác trong kết cấu với περὶ và vẫn tự nhiên trong tiếng Việt.
- source_word: εἰδωλοθύτων
  choice: thức ăn đã cúng cho thần tượng
  rationale: Từ này chỉ đồ ăn liên quan đến lễ cúng thần ngoại giáo. “Thức ăn” không thu hẹp nghĩa vào thịt, còn “đã cúng cho thần tượng” diễn đạt rõ mối liên hệ tế lễ.
- source_word: οἴδαμεν
  choice: chúng ta biết
  rationale: Giữ nghĩa trực tiếp của động từ có hình thức hoàn thành nhưng mang nghĩa hiện tại, đồng thời phản ánh lời kêu gọi đến sự hiểu biết chung của Phao-lô và độc giả.
- source_word: οὐδὲν εἴδωλον
  choice: thần tượng chẳng là gì
  rationale: Giữ tính cô đọng và mạnh của vị ngữ Hy Lạp; câu nói đến tính hư không hoặc không có thực thể thần linh của thần tượng, chứ không chỉ nói rằng nó không quan trọng.
- source_word: ἐν κόσμῳ
  choice: trong thế gian
  rationale: κόσμος ở đây chỉ phạm vi thực tại được tạo dựng; “trong thế gian” là cách diễn đạt trang trọng, quen thuộc và phù hợp với lập luận.
- source_word: οὐδεὶς θεὸς εἰ μὴ εἷς
  choice: không có Đức Chúa Trời nào ngoài một Đấng duy nhất
  rationale: Diễn đạt rõ lời khẳng định độc thần mà không thêm một công thức thần học về sau. Viết hoa “Đức Chúa Trời” thể hiện cách hiểu θεός là Đức Chúa Trời thật; bản dịch khác dùng “thần” được giữ trong chú thích để phản ánh khả năng từ vựng.
- source_word: οὖν
  choice: Vậy
  rationale: “Vậy” đánh dấu sự chuyển ý có tính suy luận từ phần trước, tự nhiên hơn “vì vậy” trong câu mở đầu chủ đề này mà vẫn giữ liên kết lô-gích.
theological_decisions:
- issue: Lời khẳng định của Phao-lô về thần tượng và chỉ một Đức Chúa Trời
  choice: Dịch thành lời khẳng định mạnh rằng thần tượng chẳng là gì và không có Đức Chúa Trời nào ngoài một Đấng duy nhất.
  alternative: Có thể diễn đạt rằng thần tượng “không thực sự hiện hữu” và dịch θεός bằng danh từ chung “thần”.
  rationale: Bản chính giữ đồng thời tính hư không của thần tượng và tính duy nhất của Đức Chúa Trời, nhưng không giải thích quá mức thần tượng “chẳng là gì” theo một hệ thống siêu hình cụ thể. Các khả năng có thật trong nguyên văn được nêu ở chú thích.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “Vậy” làm từ nối tự nhiên; “việc ăn thức ăn đã cúng” giữ rõ hành động ăn và không thu hẹp đồ cúng vào thịt. “Thần tượng” là thuật ngữ thông dụng trong văn cảnh Kinh Thánh; “Đấng duy nhất” giữ sắc thái nhân vị của εἷς mà không bổ sung danh xưng ngoài nguyên văn.
