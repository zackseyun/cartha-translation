  to: 'Vậy, về việc ăn thức ăn đã cúng tế cho thần tượng, chúng ta biết rằng thần tượng chẳng là gì trong thế gian[a], và không có thần nào khác ngoài một Đức Chúa Trời.[b]


    [a] Cũng có thể dịch: “thần tượng không thực sự hiện hữu trong thế gian.”


