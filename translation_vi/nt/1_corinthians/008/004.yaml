  rationale: Sửa vế δεύτερη để loại bỏ cách nói dư thừa “một Đấng duy nhất”, phục hồi rõ hơn sự tương phản giữa các thần bị phủ định và một Đức Chúa Trời, đồng thời vẫn tránh khẳng định siêu hình vượt quá nguyên văn. Thay “đã cúng cho” bằng “đã cúng tế cho” để diễn đạt rõ hơn tính chất đồ tế lễ của εἰδωλόθυτα. Các ký hiệu chú thích vẫn được gắn đúng sau mệnh đề mà chúng giải thích.
  reviewer_model: gpt-5.6-terra
