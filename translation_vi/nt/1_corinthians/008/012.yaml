id: 1CO.8.12
reference: 1 Corinthians 8:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οὕτως δὲ ἁμαρτάνοντες εἰς τοὺς ἀδελφοὺς καὶ τύπτοντες αὐτῶν τὴν συνείδησιν ἀσθενοῦσαν εἰς Χριστὸν ἁμαρτάνετε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/012.yaml
  text: And so[a], by sinning against the brothers in this way and wounding their weak conscience[c][b], you are sinning against Messiah.
translation:
  language: vi
  text: Như vậy, khi phạm tội chống lại anh em theo cách ấy và làm tổn thương lương tâm yếu đuối của họ, anh chị em phạm tội chống lại Đấng Mê-si-a.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Anh em” ở đây chỉ những người cùng đức tin; theo văn cảnh, từ này có thể bao gồm cả nam lẫn nữ.
    reason: lexical_alternative
  - marker: b
    text: Hay “Đấng Christ.” Từ Hy Lạp là Χριστός (Christos), một tước hiệu nghĩa là “Đấng được xức dầu.”
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως δὲ
  choice: Như vậy
  rationale: Diễn đạt tự nhiên mối liên kết nhẹ và ý quy chiếu về cách hành xử vừa được mô tả trong văn cảnh.
- source_word: ἁμαρτάνοντες εἰς τοὺς ἀδελφοὺς
  choice: khi phạm tội với anh em mình
  rationale: Phân từ hiện tại nêu hoàn cảnh/cách thức đi kèm động từ chính; εἰς sau ἁμαρτάνω chỉ đối tượng bị xúc phạm. “Anh em mình” giữ hình thức nam số nhiều nhưng vẫn tự nhiên trong văn phong thư tín tiếng Việt.
- source_word: τύπτοντες
  choice: làm tổn thương
  rationale: Trong ngữ cảnh ẩn dụ về lương tâm, cách dịch này tự nhiên và truyền đạt tác động gây thương tổn của động từ τύπτω mà không gợi một cú đánh thể chất theo nghĩa đen.
- source_word: αὐτῶν τὴν συνείδησιν ἀσθενοῦσαν
  choice: lương tâm yếu đuối của họ
  rationale: Giữ danh từ số ít của tiếng Hy Lạp theo nghĩa phân phối; “yếu đuối” diễn đạt phân từ bổ nghĩa ἀσθενοῦσαν một cách tự nhiên.
- source_word: εἰς Χριστὸν ἁμαρτάνετε
  choice: anh chị em đang phạm tội với Đấng Mê-si-a
  rationale: Thì hiện tại được thể hiện bằng “đang”; εἰς nêu đối tượng bị xúc phạm. Χριστός được giữ theo nghĩa tước hiệu là “Đấng Mê-si-a”.
theological_decisions:
- issue: Phạm vi chỉ người của ἀδελφοὺς
  choice: anh em mình
  alternative: anh chị em cùng đức tin
  rationale: Bản chính giữ hình thức nam số nhiều của nguyên ngữ; chú thích làm rõ rằng trong văn cảnh cộng đồng tín hữu, từ này có thể bao gồm cả nam lẫn nữ.
- issue: Cách dịch Χριστόν
  choice: Đấng Mê-si-a
  alternative: Đấng Christ
  rationale: Giữ rõ sắc thái tước hiệu “Đấng được xức dầu” mà không biến nó thành tên riêng; cách gọi truyền thống được ghi ở chú thích.
- issue: Chủ ngữ số nhiều ngôi thứ hai
  choice: anh chị em
  alternative: các bạn
  rationale: Tiếng Hy Lạp chỉ đại từ ngôi thứ hai số nhiều qua hình thái động từ và không xác định giới; “anh chị em” phù hợp lời gửi cộng đồng tín hữu và tránh thu hẹp đối tượng.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Câu giữ cấu trúc lập luận từ hành vi đối với người cùng đức tin đến hệ quả là phạm tội với Đấng Mê-si-a; không làm mất sức nặng thần học của mối liên hệ ấy.
