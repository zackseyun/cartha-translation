    rationale: “Đấng Mê-si-a” bảo toàn tước hiệu Messiah rõ ràng hơn và tránh cảm giác viết tắt.
  - severity: medium
    issue: 'Chú thích c ghi “Hy Lạp: ‘Christ’.”'
    rationale: Christ không phải là dạng từ Hy Lạp; nguyên ngữ là Χριστός. Chú thích phải mô tả chính xác dữ liệu ngôn ngữ nguồn.
  - severity: low
