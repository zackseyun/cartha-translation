revisions:
- from: Vì do kiến thức của bạn mà người yếu đuối bị hủy hoại[a]—người anh em[b] mà Đấng Mê-si[c] đã chết vì người ấy.
  to: Vì bởi kiến thức của bạn mà người yếu đuối—người anh em mà Đấng Mê-si-a đã chết vì người ấy—bị hủy hoại[a].
  rationale: Sửa dạng phiên chuyển tước hiệu thành “Đấng Mê-si-a,” chỉnh chú thích c theo đúng nguyên ngữ Hy Lạp, và làm trơn chú thích b. Câu chính được sắp lại để cụm đồng vị “người anh em” bổ nghĩa rõ cho “người yếu đuối,” trong khi vẫn giữ quan hệ nguyên nhân/phương tiện của “kiến thức của bạn” và không giải quyết thay người đọc nghĩa thần học đang được tranh luận của ἀπόλλυται.
  reviewer_model: gpt-5.6-terra
