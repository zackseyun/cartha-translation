reference: 1 Corinthians 8:11
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸂ἀπόλλυται γὰρ⸃ ὁ ἀσθενῶν ⸀ἐν τῇ σῇ γνώσει, ⸂ὁ ἀδελφὸς⸃ δι’ ὃν Χριστὸς ἀπέθανεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/011.yaml
  text: For the weak one is destroyed by your knowledge—the brother for whom Messiah died[a][b][c].
translation:
  language: vi
  text: Vì bởi kiến thức của bạn mà người yếu đuối—người anh em mà Đấng Mê-si-a đã chết vì người ấy—bị hủy hoại[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “bị diệt mất” hoặc “bị tiêu diệt.” Từ Hy Lạp có thể chỉ sự hủy hoại hoặc diệt vong nghiêm trọng; bản chính không quyết định thay người đọc rằng Phao-lô chỉ nói đến tổn hại thuộc linh trong đời này, sự hư mất sau cùng, hay cả hai.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπόλλυται
  choice: bị hủy hoại
  rationale: Động từ hiện tại ở thể bị động/trung gian diễn tả sự hủy hoại nghiêm trọng đang xảy ra hoặc dẫn đến một kết quả tai hại. “Bị hủy hoại” giữ được sức nặng của từ mà không tự ý giới hạn ý nghĩa vào tổn hại thuộc linh trong đời này hay sự diệt vong sau cùng.
- source_word: γάρ
  choice: Vì
  rationale: Giới thiệu lời giải thích cho cảnh báo ở câu trước; “Vì” là liên từ tự nhiên và súc tích trong tiếng Việt.
- source_word: ὁ ἀσθενῶν
  choice: người yếu đuối
  rationale: Phân từ được dùng như danh từ, chỉ “người đang yếu đuối.” Cách dịch này giữ số ít và không đưa “anh em” vào sớm hơn vị trí của từ ấy trong nguyên văn.
- source_word: ἐν τῇ σῇ γνώσει
  choice: do kiến thức của bạn
  rationale: 'ἐν ở đây có thể chỉ phương tiện hoặc phạm vi nguyên nhân: việc người kia vận dụng “kiến thức” gây nên sự hủy hoại cho người yếu đuối. “Do” truyền đạt quan hệ ấy tự nhiên trong tiếng Việt.'
- source_word: γνῶσις
  choice: kiến thức
  rationale: 'Giữ thuật ngữ xuyên suốt ngữ cảnh 1 Cô-rinh-tô 8 và nét mỉa mai: điều được gọi là “kiến thức” lại gây hại cho một người cùng đức tin.'
- source_word: ὁ ἀδελφός
  choice: người anh em
  rationale: Giữ hình thức giống đực số ít của nguyên văn; trong ngữ cảnh, từ này chỉ một người cùng đức tin. Chú thích nêu rõ phạm vi áp dụng có thể bao gồm cả anh chị em trong đức tin.
- source_word: δι’ ὃν
  choice: mà ... đã chết vì người ấy
  rationale: διά với đối cách ở đây chỉ người mà cái chết của Đấng Mê-si hướng đến hoặc vì lợi ích của người ấy. “Chết vì người ấy” giữ quan hệ này mà không áp đặt thêm một mô hình thần học cụ thể.
- source_word: Χριστός
  choice: Đấng Mê-si
  rationale: Χριστός ở đây hoạt động như một tước hiệu. “Đấng Mê-si” thể hiện ý nghĩa tước hiệu, thay vì chỉ phiên âm thành một dạng gần như tên riêng.
- source_word: ἀπέθανεν
  choice: đã chết
  rationale: Thì aorist chỉ sự kiện đã xảy ra; “đã chết” là cách diễn đạt trực tiếp, tự nhiên trong tiếng Việt.
theological_decisions:
- issue: ἀπόλλυται có nhất thiết chỉ sự hư mất đời đời của một tín hữu thật hay không
  choice: bị hủy hoại
  alternative: bị diệt mất; bị tiêu diệt
  rationale: Ngữ cảnh nhấn mạnh hậu quả thuộc linh nghiêm trọng do việc vận dụng kiến thức thiếu tình yêu gây ra, nhưng động từ có thể mang nghĩa hủy diệt mạnh hơn. Bản chính giữ sự căng thẳng này thay vì giải quyết trước cuộc tranh luận về sự bội đạo hoặc bền đỗ.
- issue: Có nên chuyển ἀδελφός thành cách gọi trung tính về giới trong bản chính hay không
  choice: người anh em
  alternative: người cùng đức tin; anh chị em trong đức tin
  rationale: Nguyên văn dùng danh từ giống đực số ít, nên bản chính phản ánh hình thức đó; chú thích làm rõ nghĩa quan hệ và phạm vi áp dụng rộng hơn.
- issue: Cách thể hiện Χριστός như tước hiệu
  choice: Đấng Mê-si
  alternative: Đấng Christ; Chúa Cứu Thế
  rationale: Ở đây Χριστός nêu căn tính và vai trò của Đấng chịu chết vì người anh em. “Đấng Mê-si” bảo toàn chức năng tước hiệu mà không thêm sắc thái giải nghĩa ngoài nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Trật tự câu làm nổi bật quan hệ nguyên nhân giữa “kiến thức của bạn” và sự hủy hoại người yếu đuối, đồng thời giữ cấu trúc đồng vị “người yếu đuối—người anh em” của nguyên văn. Dấu gạch ngang bảo toàn sức nhấn mạnh mà không thêm diễn giải giáo phái.
