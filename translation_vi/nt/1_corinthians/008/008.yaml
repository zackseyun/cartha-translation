id: 1CO.8.8
reference: 1 Corinthians 8:8
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: βρῶμα δὲ ἡμᾶς οὐ ⸀παραστήσει τῷ θεῷ· οὔτε ⸂γὰρ ἐὰν φάγωμεν, περισσεύομεν, οὔτε ἐὰν μὴ φάγωμεν, ὑστερούμεθα⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/008.yaml
  text: But food will not commend us to God[a]; for neither if we eat do we abound[b], nor if we do not eat do we lack.
translation:
  language: vi
  text: Nhưng thức ăn không đưa chúng ta đến gần Đức Chúa Trời[a]; vì dù chúng ta ăn, cũng chẳng hơn gì, và dù không ăn, cũng chẳng kém gì.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “Thức ăn không khiến chúng ta được Đức Chúa Trời chấp nhận.”'
    reason: lexical_alternative
  - marker: b
    text: 'Dịch sát hơn: “dù chúng ta ăn, chúng ta không có thêm; dù không ăn, chúng ta không thiếu hụt.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: βρῶμα
  choice: thức ăn
  rationale: Danh từ có nghĩa rộng là thức ăn, không riêng thịt hay một bữa ăn cụ thể; cách dịch này tự nhiên và phù hợp với nguyên tắc chung Phao-lô nêu ra.
- source_word: παραστήσει τῷ θεῷ
  choice: làm cho chúng ta được đẹp lòng Đức Chúa Trời
  rationale: Trong ngữ cảnh, động từ chỉ việc thức ăn không đem lại địa vị hay sự chấp thuận tốt hơn trước Đức Chúa Trời. Cách diễn đạt này tự nhiên trong tiếng Việt, đồng thời chú thích giữ lại nghĩa sát hơn là ‘đưa chúng ta đến trước’.
- source_word: περισσεύομεν
  choice: chẳng hơn gì
  rationale: Ở đây động từ diễn tả có thêm lợi thế hay được lợi, chứ không nhất thiết là dư dật vật chất; ‘chẳng hơn gì’ truyền đạt tự nhiên sự đối lập trong câu.
- source_word: ὑστερούμεθα
  choice: chẳng kém gì
  rationale: Động từ có nghĩa thiếu hụt hoặc ở thế bất lợi. ‘Chẳng kém gì’ tạo thế đối xứng tự nhiên với ‘chẳng hơn gì’ mà không giới hạn ý vào thiếu thốn vật chất.
- source_word: δὲ ... γὰρ
  choice: Nhưng ... vì
  rationale: ‘Nhưng’ đánh dấu sự tương phản nhẹ với phần trước, còn ‘vì’ dẫn vào lời giải thích cho mệnh đề chính.
theological_decisions:
- issue: Câu này nói về sự chấp thuận trước Đức Chúa Trời hay một lợi thế thuộc linh nói chung
  choice: Thức ăn tự nó không khiến một người được đẹp lòng Đức Chúa Trời hơn; ăn hay không ăn đều không tạo lợi thế hoặc bất lợi.
  alternative: Thức ăn không đưa chúng ta đến trước Đức Chúa Trời; nếu ăn, chúng ta không có thêm, và nếu không ăn, chúng ta không thiếu hụt.
  rationale: Ngữ cảnh trực tiếp liên quan đến thức ăn đã cúng thần tượng và lương tâm, nhưng lời khẳng định của câu mang tính khái quát. Bản dịch tránh biến việc ăn hoặc kiêng ăn thành tiêu chuẩn thay đổi địa vị của một người trước Đức Chúa Trời, đồng thời chú thích bảo tồn sắc thái từ vựng khác.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng cặp ‘chẳng hơn gì / chẳng kém gì’ để thể hiện tự nhiên thế đối xứng của hai mệnh đề Hy Lạp; các chú thích giữ lại những khả năng dịch sát hơn và sự mơ hồ về việc được trình diện, đến gần hay được chấp thuận trước Đức Chúa Trời.
