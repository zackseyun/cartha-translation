- from: Nếu ai nghĩ mình biết điều gì[a], thì người ấy vẫn chưa biết như mình cần phải biết.
  to: Nếu ai cho rằng mình biết điều gì[a], thì người ấy vẫn chưa biết theo lẽ phải biết.
  rationale: Thay «nghĩ» bằng «cho rằng» để làm rõ sắc thái tự đánh giá của δοκεῖ, và thay «như mình cần phải biết» bằng «theo lẽ phải biết» để diễn đạt tự nhiên, sát nghĩa chuẩn mực/cách thức của καθὼς δεῖ γνῶναι. Chú thích được điều chỉnh tương ứng, không áp đặt một cách hiểu thần học nào.
