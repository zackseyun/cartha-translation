  naturalness: Cụm «theo lẽ phải biết» là lối nói tiếng Việt hiện đại, trang trọng vừa phải, tự nhiên hơn; nó diễn đạt chuẩn mực của việc biết mà không thêm diễn giải.
  terminology: «Cho rằng mình biết» phản ánh sát δοκεῖ ἐγνωκέναι và phù hợp giọng văn của thư tín. «Người ấy» giữ quy chiếu số ít khái quát, không giới hạn giới tính.
