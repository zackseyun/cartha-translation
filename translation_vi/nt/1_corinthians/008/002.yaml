source:
  edition: SBLGNT
  text: ⸀εἴ τις δοκεῖ ⸀ἐγνωκέναι τι, ⸀οὔπω ⸀ἔγνω καθὼς δεῖ γνῶναι·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/002.yaml
  text: If anyone thinks he knows something[a], he does not yet know as he ought to know.
translation:
  language: vi
  text: Nếu ai cho rằng mình biết điều gì[a], thì người ấy vẫn chưa biết theo lẽ phải biết.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Nếu ai cho rằng mình đã đạt đến chỗ biết điều gì, thì người ấy vẫn chưa biết theo cách phải biết.”'
    reason: Bảo tồn sắc thái của thể hoàn thành ἐγνωκέναι («đã đạt đến chỗ biết») và làm rõ ότι καθὼς có thể chỉ cách thức biết.
lexical_decisions:
- source_word: εἴ τις
  choice: Nếu ai
  rationale: Diễn đạt tự nhiên điều kiện cùng đại từ bất định mang nghĩa khái quát, không giới hạn ở nam giới.
- source_word: δοκεῖ
  choice: nghĩ
  rationale: Trong ngữ cảnh, động từ nói đến sự tự đánh giá hay cho rằng, chứ không chỉ vẻ bề ngoài.
- source_word: ἐγνωκέναι τι
  choice: mình biết điều gì
  rationale: Cách nói tiếng Việt tự nhiên cho động từ nguyên mẫu hoàn thành, vẫn biểu đạt việc người ấy tự cho rằng mình đã đạt được tri thức nào đó.
- source_word: οὔπω ἔγνω
  choice: vẫn chưa biết
  rationale: Giữ sắc thái trạng thái hiểu biết còn thiếu hụt; “vẫn chưa” phù hợp với lời phê bình đang tiếp diễn.
- source_word: καθὼς δεῖ γνῶναι
  choice: như mình cần phải biết
  rationale: Giữ cả ý về cách thức hoặc chuẩn mực của việc biết và sức nặng cần thiết của δεῖ, đồng thời tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Phạm vi của đại từ bất định
  choice: ai… mình… người ấy
  alternative: ai… người đó
  rationale: τις là số ít nhưng mang nghĩa khái quát. Cách dịch này giữ số ít mà không biến câu thành lời chỉ dành cho nam giới.
- issue: Bản chất lời phê bình của Phao-lô
  choice: chưa biết như mình cần phải biết
  alternative: hoàn toàn không biết gì
  rationale: Câu Hy Lạp phê bình sự tự tin vào tri thức và sự thiếu hụt trong cách biết, chứ không nhất thiết phủ nhận tuyệt đối mọi tri thức.
- issue: Sắc thái thể hoàn thành của ἐγνωκέναι
  choice: biết
  alternative: đã đạt đến chỗ biết
  rationale: “Biết” tự nhiên hơn trong câu chính; chú thích bảo tồn cách hiểu nhấn mạnh trạng thái đạt được do thể hoàn thành.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “mình” để quy chiếu tự nhiên về chủ thể khái quát “ai”, còn “người ấy” giúp câu rõ ràng và tránh đại từ giống đực.
