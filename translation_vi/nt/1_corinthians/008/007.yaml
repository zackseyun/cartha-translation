id: 1CO.8.7
reference: 1 Corinthians 8:7
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἀλλ’ οὐκ ἐν πᾶσιν ἡ γνῶσις· τινὲς δὲ τῇ ⸀συνηθείᾳ ⸂ἕως ἄρτι τοῦ εἰδώλου⸃ ὡς εἰδωλόθυτον ἐσθίουσιν, καὶ ἡ συνείδησις αὐτῶν ἀσθενὴς οὖσα μολύνεται.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/007.yaml
  text: But not everyone has this knowledge[a]. Some, through familiarity with the idol until now, eat it as food sacrificed to an idol, and their conscience, being weak[b], is defiled.
translation:
  language: vi
  text: Nhưng không phải ai cũng có sự hiểu biết ấy. Một số người, vì đến nay vẫn còn quen với việc thờ thần tượng[a], ăn thức ăn ấy như đồ cúng thần tượng; lương tâm[b] của họ, vốn yếu đuối, bị ô uế.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cụm từ Hy Lạp này khó hiểu; sát hơn có thể là “do thói quen với thần tượng cho đến nay.” Ý nói một số người vẫn chịu ảnh hưởng của mối liên hệ trước đây với việc thờ thần tượng.
    reason: lexical_alternative
  - marker: b
    text: Một số bản chép tay đọc là “lương tâm đối với thần tượng” hoặc có những dị bản liên quan trong cụm này; phần chính dịch theo bản văn SBLGNT.
    reason: textual_variant
lexical_decisions:
- source_word: γνῶσις
  choice: sự hiểu biết
  rationale: Diễn đạt nhận thức được nhắc đến trong mạch văn ngay trước đó, đồng thời giữ sự liên kết với chủ đề “biết” trong chương này.
- source_word: συνήθεια
  choice: quen với
  rationale: Từ này chỉ thói quen hoặc sự quen thuộc hình thành do mối liên hệ trước đây; trong ngữ cảnh, đó là ảnh hưởng còn tiếp diễn của việc thờ thần tượng.
- source_word: ἕως ἄρτι τοῦ εἰδώλου
  choice: đến nay vẫn còn ... với thần tượng
  rationale: Giữ rõ yếu tố thời gian ἕως ἄρτι (“cho đến nay”) và mối liên hệ với thần tượng, nhưng diễn đạt theo cú pháp tự nhiên của tiếng Việt.
- source_word: εἰδωλόθυτον
  choice: đồ đã cúng cho thần tượng
  rationale: Chỉ thức ăn có liên hệ với việc dâng cúng thần tượng; cách dịch này tự nhiên trong tiếng Việt và vẫn giữ sắc thái nghi lễ.
- source_word: συνείδησις
  choice: lương tâm
  rationale: Tương đương thông dụng trong ngôn ngữ đạo đức của Phao-lô, chỉ khả năng nhận biết và đánh giá về mặt luân lý.
- source_word: ἀσθενής
  choice: yếu đuối
  rationale: Giữ thuật ngữ chủ đạo của Phao-lô trong chương này, nói về lương tâm chưa vững vàng trong vấn đề thức ăn cúng thần tượng.
- source_word: μολύνεται
  choice: bị ô uế
  rationale: Thể bị động và sắc thái nhiễm ô về luân lý được giữ lại bằng cách diễn đạt trang trọng, dễ hiểu.
theological_decisions:
- issue: Cách diễn đạt địa vị của thức ăn cúng thần tượng mà không hàm ý thần tượng là thần có thật
  choice: ăn thức ăn ấy như đồ đã cúng cho thần tượng
  alternative: ăn thức ăn đã cúng thần tượng
  rationale: 'Từ “như” giữ trọng tâm ở cách những người này nhận thức ý nghĩa nghi lễ của thức ăn, chứ không xác nhận thần tượng là thần có thật. Cách dịch duy trì sự căng thẳng trong lập luận của Phao-lô: thần tượng vốn không là gì, nhưng việc ăn vẫn có thể làm lương tâm yếu đuối bị ô uế.'
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Cấu trúc “do đến nay vẫn còn quen với thần tượng” cố ý giữ yếu tố thời gian và sự mơ hồ của câu Hy Lạp, thay vì giải thích quá mức thành một kinh nghiệm cải đạo cụ thể.
