    issue: Cụm “do đến nay vẫn còn quen với thần tượng” gượng và mơ hồ không tự nhiên trong tiếng Việt.
    rationale: Cấu trúc “do ... quen với” không trôi chảy; hơn nữa “quen với thần tượng” dễ được hiểu là quen thuộc với một vật tượng, không phải ảnh hưởng còn lại từ tập quán thờ thần tượng. Bản sửa bảo toàn yếu tố “cho đến nay” mà không diễn giải thành một tiểu sử cải đạo chi tiết.
  - severity: low
    issue: Ký hiệu chú thích dị bản [b] đặt sau “yếu đuối” không sát nhất với cụm có dị bản.
    rationale: Chú thích nói đến các dị bản liên quan đến “lương tâm ... thần tượng”; đặt ký hiệu ngay sau “lương tâm” sẽ minh bạch hơn mà không thay đổi ý nghĩa.
