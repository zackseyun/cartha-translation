id: 1CO.8.13
reference: 1 Corinthians 8:13
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: διόπερ εἰ βρῶμα σκανδαλίζει τὸν ἀδελφόν μου, οὐ μὴ φάγω κρέα εἰς τὸν αἰῶνα, ἵνα μὴ τὸν ἀδελφόν μου σκανδαλίσω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/013.yaml
  text: Therefore, if food causes my brother to stumble, I will certainly never eat meat forever, so that I may not cause my brother to stumble.
translation:
  language: vi
  text: Vì vậy, nếu thức ăn làm người anh chị em của tôi vấp ngã, tôi nhất quyết sẽ không bao giờ ăn thịt nữa, để không làm người anh chị em của tôi vấp ngã.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βρῶμα
  choice: thức ăn
  rationale: Từ này chỉ thức ăn nói chung; giữ phạm vi rộng của mệnh đề điều kiện.
- source_word: σκανδαλίζει / σκανδαλίσω
  choice: làm ... vấp ngã
  rationale: Diễn đạt ẩn dụ về việc khiến một người sa vào điều gây tổn hại về lương tâm hoặc đức tin, đồng thời giữ cùng một cách dịch cho hai lần xuất hiện.
- source_word: τὸν ἀδελφόν μου
  choice: anh chị em tôi
  rationale: Trong ngữ cảnh cộng đồng tín hữu, danh từ giống đực số ít có thể dùng theo nghĩa bao quát một người cùng đức tin; cách dịch này tự nhiên và không giới hạn không cần thiết vào nam giới.
- source_word: οὐ μὴ φάγω
  choice: tôi quyết sẽ không ... ăn
  rationale: Kết cấu phủ định mạnh οὐ μή được thể hiện bằng lời cam kết dứt khoát, thay vì chỉ nói 'tôi sẽ không'.
- source_word: κρέα
  choice: thịt
  rationale: Chỉ thịt dùng làm thức ăn, phù hợp với sự phân biệt giữa 'thức ăn' ở vế điều kiện và 'thịt' trong lời cam kết.
- source_word: εἰς τὸν αἰῶνα
  choice: không bao giờ ... nữa
  rationale: Trong câu phủ định, thành ngữ này có nghĩa tự nhiên là 'không bao giờ'; cách đặt 'nữa' cho thấy sự từ bỏ từ nay về sau mà không tạo câu tiếng Việt gượng như 'không ăn thịt mãi mãi'.
theological_decisions:
- issue: Phạm vi lời cam kết không ăn thịt
  choice: Giữ cách nói tuyệt đối 'không bao giờ ăn thịt nữa' nếu việc ấy khiến người cùng đức tin vấp ngã.
  alternative: Diễn giải thành chỉ kiêng thịt khi có mặt người ấy hoặc trong hoàn cảnh cụ thể.
  rationale: Bản văn dùng phủ định mạnh cùng εἰς τὸν αἰῶνα; không nên tự giới hạn lời nói theo một cách giải thích thực hành dù ngữ cảnh có thể gợi ý tính tu từ.
- issue: Ý nghĩa của 'vấp ngã'
  choice: Giữ hình ảnh 'vấp ngã' mà không giải thích cụ thể hậu quả.
  alternative: Dịch rõ thành 'phạm tội', 'mất đức tin' hoặc 'trái lương tâm'.
  rationale: σκανδαλίζω có sức gợi và phạm vi nghĩa rộng; bản văn không xác định duy nhất một hậu quả, nên cần giữ độ mở thần học.
translation_notes:
  register: Văn phong hiện đại, trang trọng và trực tiếp. Dùng 'anh chị em tôi' theo nghĩa người cùng đức tin, dễ hiểu trong tiếng Việt hiện nay; giữ phép lặp 'vấp ngã' của nguyên văn để nhấn mạnh trách nhiệm đối với người khác.
