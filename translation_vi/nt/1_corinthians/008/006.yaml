reference: 1 Corinthians 8:6
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀλλ’ ἡμῖν εἷς θεὸς ὁ πατήρ, ἐξ οὗ τὰ πάντα καὶ ἡμεῖς εἰς αὐτόν, καὶ εἷς κύριος Ἰησοῦς Χριστός, δι’ οὗ τὰ πάντα καὶ ἡμεῖς δι’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/006.yaml
  text: yet for us there is one God[a], the Father, from whom are all things and we for him, and one Lord, Jesus the Messiah[c][b], through whom are all things and we through him.
translation:
  language: vi
  text: Nhưng đối với chúng ta, chỉ có một Đức Chúa Trời, là Cha, từ Ngài muôn vật mà có, và chúng ta hướng về Ngài; và chỉ có một Chúa, là Chúa Giê-su, Đấng Mê-si-a,[a] nhờ Ngài muôn vật mà có, và chúng ta cũng nhờ Ngài mà có.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Chúa Giê-su Christ.” Từ Hy Lạp Χριστός có thể là chức danh “Đấng Mê-si-a” hoặc, trong một số ngữ cảnh, được dùng gần như một tên riêng là “Christ.”'
    reason: alternative_reading
  - marker: b
    text: 'Nguyên văn nói ngắn gọn: “và chúng ta nhờ Ngài.” Cụm từ có thể nói đến sự hiện hữu, sự sống hoặc sự cứu rỗi của chúng ta qua Ngài; bản dịch thêm “mà có” để câu tiếng Việt được rõ mà không thu hẹp vào một phương diện duy nhất.'
    reason: ellipsis
lexical_decisions:
- source_word: ἀλλ’ ἡμῖν
  choice: nhưng đối với chúng ta
  rationale: Diễn đạt tự nhiên sắc thái tương phản của ἀλλά và cách dùng sở chỉ của ἡμῖν, đặt lời tuyên xưng của tín hữu đối lập với các thần và chúa được gọi như vậy ở câu trước.
- source_word: εἷς θεὸς ὁ πατήρ
  choice: chỉ có một Đức Chúa Trời là Cha
  rationale: Giữ sức nặng độc thần và xác định Đấng duy nhất ấy là Cha; “chỉ có” là cách diễn đạt tự nhiên trong tiếng Việt cho cấu trúc hiện hữu được tỉnh lược.
- source_word: ἐξ οὗ τὰ πάντα
  choice: muôn vật đều từ Ngài mà có
  rationale: ἐξ chỉ nguồn gốc; “muôn vật” trang trọng nhưng dễ hiểu và giữ phạm vi bao quát của τὰ πάντα.
- source_word: καὶ ἡμεῖς εἰς αὐτόν
  choice: và chúng ta sống cho Ngài
  rationale: εἰς có thể chỉ hướng đến, đích đến hoặc mục đích. “Sống cho Ngài” truyền đạt sự quy hướng về Đức Chúa Trời như cứu cánh, đồng thời bổ sung động từ tự nhiên mà mệnh đề Hy Lạp tỉnh lược.
- source_word: εἷς κύριος
  choice: chỉ có một Chúa
  rationale: Giữ cấu trúc song song với “một Đức Chúa Trời” và sức nặng thần học của κύριος.
- source_word: Ἰησοῦς Χριστός
  choice: Đức Chúa Jesus, Đấng Messiah
  rationale: “Đức Chúa Jesus” là lối gọi trang trọng, dễ nhận biết trong tiếng Việt; “Đấng Messiah” giữ chức danh Χριστός thay vì mặc nhiên biến nó thành tên riêng.
- source_word: δι’ οὗ τὰ πάντα
  choice: muôn vật đều nhờ Ngài mà có
  rationale: διά với sở hữu cách chỉ tác nhân trung gian; “nhờ Ngài mà có” giữ sự phân biệt với “từ Ngài mà có” ở mệnh đề nói về Cha.
- source_word: καὶ ἡμεῖς δι’ αὐτοῦ
  choice: và chúng ta cũng nhờ Ngài mà có
  rationale: Làm rõ động từ hiện hữu được tỉnh lược nhưng không ấn định cụ thể đây chỉ là sự sáng tạo, sự cứu rỗi hay sự sống mới.
theological_decisions:
- issue: Mối liên hệ giữa “một Đức Chúa Trời” và “một Chúa” trong lời tuyên xưng độc thần
  choice: 'Giữ nguyên hai vế song song: một Đức Chúa Trời là Cha và một Chúa là Jesus, Đấng Messiah.'
  alternative: Làm nhẹ danh xưng “Chúa”, hoặc diễn giải câu theo một công thức tín điều hậu kỳ rõ hơn chính bản văn.
  rationale: Bản văn vừa đặt Jesus trong một lời tuyên xưng có sức nặng độc thần, vừa phân biệt Ngài với Cha. Bản dịch không làm suy yếu vế nào và cũng không giải quyết thay sự căng thẳng thần học của câu.
- issue: Vai trò được biểu thị bởi các giới từ ἐξ, εἰς và διά
  choice: Dịch phân biệt là “từ Ngài”, “cho Ngài” và “nhờ Ngài”.
  alternative: Dùng cùng một cách diễn đạt cho nguồn gốc và tác nhân trung gian, hoặc dịch εἰς đơn thuần là “đến với Ngài”.
  rationale: Sự phân biệt này bảo toàn Cha là nguồn và đích quy hướng, còn Jesus Messiah là tác nhân trung gian, đúng theo cấu trúc Hy Lạp.
- issue: Phạm vi của mệnh đề “chúng ta nhờ Ngài mà có”
  choice: Giữ cách nói khái quát về sự hiện hữu của “chúng ta”.
  alternative: Cụ thể hóa thành “được tạo dựng”, “được cứu” hoặc “được sống”.
  rationale: Động từ được tỉnh lược trong nguyên văn, nên việc chọn riêng một phương diện sẽ thu hẹp tính đa nghĩa mà câu có thể chủ ý duy trì.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng “Đức Chúa Trời”, “Chúa”, “Ngài” theo quy ước tôn kính phổ biến; giữ “Messiah” để thể hiện chức danh trong nguyên ngữ. Hai vế được cân đối nhằm bảo toàn nhịp điệu tuyên xưng của câu.
