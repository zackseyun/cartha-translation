  to: Nhưng đối với chúng ta, chỉ có một Đức Chúa Trời, là Cha, từ Ngài muôn vật mà có, và chúng ta hướng về Ngài; và chỉ có một Chúa, là Chúa Giê-su, Đấng Mê-si-a,[a] nhờ Ngài muôn vật mà có, và chúng ta cũng nhờ Ngài mà có.[b]
