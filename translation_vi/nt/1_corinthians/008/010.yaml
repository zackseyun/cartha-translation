id: 1CO.8.10
reference: 1 Corinthians 8:10
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐὰν γάρ τις ἴδῃ σὲ τὸν ἔχοντα γνῶσιν ἐν εἰδωλείῳ κατακείμενον, οὐχὶ ἡ συνείδησις αὐτοῦ ἀσθενοῦς ὄντος οἰκοδομηθήσεται εἰς τὸ τὰ εἰδωλόθυτα ἐσθίειν;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/010.yaml
  text: For if someone sees you[a], who have knowledge, reclining in an idol’s temple, will not his conscience, being weak, be built up to eat food sacrificed to idols?
translation:
  language: vi
  text: Vì nếu có người thấy bạn, người có hiểu biết, đang dự tiệc trong đền thờ thần tượng, thì lương tâm của người ấy, vốn yếu đuối, chẳng phải sẽ được xây dựng để ăn đồ đã cúng cho thần tượng sao?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “sẽ được khích lệ” hoặc “sẽ mạnh dạn ăn”. Nguyên văn là “được xây dựng”, dùng từ Phao-lô thường dùng về sự gây dựng, có lẽ với sắc thái mỉa mai.
    reason: lexical_alternative
lexical_decisions:
- source_word: γάρ
  choice: Vì
  rationale: Nối câu này với lời cảnh báo trước đó bằng cách nêu lý do hoặc tình huống minh họa.
- source_word: τις
  choice: có người
  rationale: Giữ tính bất định và giả định của câu điều kiện, đồng thời tự nhiên trong tiếng Việt.
- source_word: ἴδῃ
  choice: thấy
  rationale: Đi với ἐὰν để tạo điều kiện có khả năng xảy ra; cấu trúc “nếu… thấy” là tự nhiên.
- source_word: σὲ τὸν ἔχοντα γνῶσιν
  choice: bạn, là người có sự hiểu biết
  rationale: Giữ lời nhấn trực tiếp vào người tự nhận hoặc được xem là có hiểu biết, mà không làm mất thuật ngữ chủ đề γνῶσις.
- source_word: ἐν εἰδωλείῳ
  choice: trong đền thờ thần tượng
  rationale: Chỉ nơi thờ tự gắn với thần tượng; cách diễn đạt rõ ràng và tự nhiên trong tiếng Việt.
- source_word: κατακείμενον
  choice: đang dùng bữa
  rationale: Động từ theo nghĩa đen là nằm/ngả mình tại bàn ăn; tiếng Việt hiện đại thường diễn đạt hành động thực tế là dùng bữa, tránh gây hiểu lầm về tư thế.
- source_word: οὐχὶ
  choice: chẳng phải… sao?
  rationale: Giữ câu hỏi tu từ mong đợi câu trả lời khẳng định.
- source_word: ἡ συνείδησις αὐτοῦ ἀσθενοῦς ὄντος
  choice: lương tâm yếu đuối của người ấy
  rationale: Quy tình trạng yếu đuối cho người quan sát qua lương tâm của người ấy, phù hợp ngữ cảnh và tự nhiên hơn cấu trúc phân từ sát chữ.
- source_word: οἰκοδομηθήσεται
  choice: sẽ được xây dựng
  rationale: Giữ hình ảnh “xây dựng” quen thuộc của Phao-lô và sắc thái mỉa mai có chủ ý, thay vì giải nghĩa hoàn toàn ngay trong câu.
- source_word: εἰς τὸ τὰ εἰδωλόθυτα ἐσθίειν
  choice: để ăn đồ đã cúng cho thần tượng
  rationale: Diễn tả kết quả hoặc khuynh hướng dẫn đến việc ăn đồ đã được hiến cúng cho thần tượng.
theological_decisions:
- issue: Cách dịch οἰκοδομηθήσεται trong bối cảnh sự bắt chước gây hại
  choice: sẽ được xây dựng
  alternative: sẽ được mạnh dạn / được khuyến khích
  rationale: 'Nguyên văn dùng chính động từ thường mang nghĩa gây dựng, dường như với sắc thái mỉa mai: điều được “xây dựng” ở đây lại dẫn người có lương tâm yếu đến hành động có hại. Giữ hình ảnh này bảo toàn căng thẳng tu từ; chú thích nêu nghĩa theo ngữ cảnh.'
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “bạn” cho đại từ số ít σέ nhằm giữ lời chất vấn trực tiếp; “dùng bữa” chuyển tải hành động của κατακείμενον tự nhiên hơn cách mô tả tư thế nằm/ngả tại bàn. Dấu chú thích đặt ngay sau toàn bộ câu có cụm cần giải thích.
