id: 1CO.8.1
reference: 1 Corinthians 8:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Περὶ δὲ τῶν εἰδωλοθύτων, οἴδαμεν ὅτι πάντες γνῶσιν ἔχομεν. ἡ γνῶσις φυσιοῖ, ἡ δὲ ἀγάπη οἰκοδομεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/001.yaml
  text: 'Concerning food sacrificed to idols: we know that we all have knowledge[a]. Knowledge puffs up[b], but love builds up.'
translation:
  language: vi
  text: 'Còn về thức ăn đã cúng cho thần tượng: chúng ta biết rằng tất cả chúng ta đều có sự hiểu biết.[a][b] Sự hiểu biết khiến người ta tự cao, còn tình yêu thương thì xây dựng.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Những thứ đã cúng cho thần tượng” hoặc “thịt đã cúng cho thần tượng.”
    reason: lexical_alternative
  - marker: b
    text: Phao-lô có thể đang nhắc lại một khẩu hiệu của người Cô-rinh-tô trong câu “tất cả chúng ta đều có sự hiểu biết.”
    reason: alternative_reading
lexical_decisions:
- source_word: Περὶ δὲ
  choice: Còn về
  rationale: Diễn đạt tự nhiên sự chuyển sang một chủ đề mới trong thư, không thêm ý thời gian vốn không có trong nguyên văn.
- source_word: τῶν εἰδωλοθύτων
  choice: thức ăn đã cúng cho thần tượng
  rationale: Chỉ những thứ được dâng trong việc thờ thần tượng, đặc biệt là thực phẩm trong ngữ cảnh này; cách dịch không thu hẹp nghĩa chỉ còn thịt.
- source_word: οἴδαμεν ὅτι πάντες γνῶσιν ἔχομεν
  choice: chúng ta biết rằng tất cả chúng ta đều có sự hiểu biết
  rationale: Giữ nguyên lời khẳng định không kèm điều kiện của tiếng Hy Lạp và sự lặp lại bao quát của πάντες, đồng thời để ngữ cảnh quyết định liệu đây có phải là khẩu hiệu của người Cô-rinh-tô hay không.
- source_word: ἡ γνῶσις
  choice: Sự hiểu biết
  rationale: Giữ liên hệ từ vựng với γνῶσιν ở mệnh đề trước; danh từ trừu tượng này tự nhiên và dễ hiểu trong tiếng Việt hiện đại.
- source_word: φυσιοῖ
  choice: khiến người ta tự cao
  rationale: Truyền đạt hình ảnh bị thổi phồng theo nghĩa kiêu căng bằng lối nói tự nhiên; tránh cách dịch sát chữ nhưng khó hiểu như 'làm phồng lên'.
- source_word: ἡ δὲ ἀγάπη
  choice: còn tình yêu thương thì
  rationale: Thể hiện rõ thế tương phản; 'tình yêu thương' là cách nói trang trọng, quen thuộc và không mang sắc thái tình ái.
- source_word: οἰκοδομεῖ
  choice: xây dựng
  rationale: Giữ ẩn dụ kiến thiết của Phao-lô thay vì giải nghĩa hẹp thành 'gây dựng người khác' hay 'làm cho mạnh mẽ'.
theological_decisions:
- issue: Phạm vi và sắc thái tu từ của πάντες trong câu 'tất cả chúng ta đều có sự hiểu biết'
  choice: Giữ lời khẳng định không giới hạn trong chính văn
  alternative: Đánh dấu trực tiếp đây là lời trích dẫn hoặc khẩu hiệu của người Cô-rinh-tô
  rationale: Nguyên văn không có dấu hiệu trích dẫn minh nhiên. Chính văn giữ sự mơ hồ, còn chú thích nêu khả năng Phao-lô đang nhắc lại một khẩu hiệu.
- issue: Đối tượng được tình yêu thương 'xây dựng'
  choice: Không bổ sung tân ngữ
  alternative: tình yêu thương xây dựng người khác/cộng đồng
  rationale: Động từ Hy Lạp đứng tuyệt đối, không nêu rõ đối tượng; giữ nguyên độ mở của hình ảnh và lập luận.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “thần tượng” theo nghĩa các thần được thờ, “tự cao” để chuyển tải tự nhiên ẩn dụ φυσιοῖ, và giữ ẩn dụ “xây dựng” của οἰκοδομεῖ.
