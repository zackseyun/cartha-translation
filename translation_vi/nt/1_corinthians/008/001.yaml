    issue: Vị trí ký hiệu chú thích b không khớp với nội dung chú thích.
    rationale: Chú thích b giải thích khả năng cụm “tất cả chúng ta đều có sự hiểu biết” là khẩu hiệu của người Cô-rinh-tô, nhưng hiện được neo sau mệnh đề “tình yêu thương thì xây dựng.” Dời ký hiệu về ngay sau cụm được bàn đến sẽ làm rõ phạm vi chú thích mà không thay đổi nghĩa.
