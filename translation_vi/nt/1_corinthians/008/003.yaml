  text: εἰ δέ τις ἀγαπᾷ τὸν θεόν, οὗτος ἔγνωσται ὑπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/003.yaml
  text: But if anyone loves God[a], this one is known by him.
translation:
  language: vi
  text: Nhưng nếu ai yêu mến Đức Chúa Trời, thì người ấy được Ngài biết đến.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “được Ngài công nhận” hoặc “đã được Ngài biết đến.” Thể hoàn thành bị động trong tiếng Hy Lạp có thể gợi ý một trạng thái bền vững: người ấy là người được Đức Chúa Trời biết đến.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δέ
  choice: Nhưng nếu
  rationale: Giữ cả ý điều kiện của εἰ và sắc thái tương phản nhẹ của δέ với lời bàn trước đó về tri thức và tình yêu.
- source_word: τις
  choice: ai
  rationale: Đại từ bất định có nghĩa khái quát; “ai” tự nhiên, bao quát và không thêm hàm ý giới tính.
- source_word: ἀγαπᾷ
  choice: yêu kính
  rationale: Diễn đạt tự nhiên hành động yêu hướng về Đức Chúa Trời, đồng thời giữ sắc thái tôn kính phù hợp trong tiếng Việt mà không thu hẹp nội dung của ἀγαπάω.
- source_word: τὸν θεόν
  choice: Đức Chúa Trời
  rationale: Cách gọi trang trọng, rõ nghĩa và quen thuộc trong văn phong Kinh Thánh tiếng Việt.
- source_word: οὗτος
  choice: người ấy
  rationale: Giữ lực quy chiếu tương đối nhấn mạnh của đại từ chỉ định, đồng thời tự nhiên hơn lối dịch sát “người này” trong câu tiếng Việt.
- source_word: ἔγνωσται
  choice: được ... biết đến
  rationale: Thể hoàn thành bị động diễn tả một trạng thái hiện hữu do hành động trước đó; cách dịch này giữ nghĩa bị động và không giới hạn việc Đức Chúa Trời “biết” vào nhận thức thuần túy.
- source_word: ὑπ’ αὐτοῦ
  choice: được Ngài
  rationale: Đại từ chỉ về Đức Chúa Trời; viết hoa “Ngài” giúp quy chiếu rõ ràng và phù hợp văn phong tôn kính.
theological_decisions:
- issue: Ý nghĩa của việc được Đức Chúa Trời biết
  choice: được Ngài biết đến
  alternative: được Ngài công nhận; đã được Ngài biết
  rationale: γινώσκω khi Đức Chúa Trời là chủ thể có thể bao hàm sự nhìn nhận và mối quan hệ, chứ không chỉ nhận biết thông tin. Bản dịch giữ độ rộng thần học của câu và không tự ý xác định đó là sự chấp thuận hay sự biết trong ý nghĩa cứu rỗi.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “người ấy” để giữ nét nhấn của οὗτος; cấu trúc “được Ngài biết đến” bảo toàn thể bị động và sự hàm súc thần học của nguyên văn.
