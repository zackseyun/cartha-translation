revisions:
- from: Vì Ngài đã đặt muôn vật dưới chân Người. Nhưng khi lời Kinh Thánh nói rằng muôn vật đã được đặt dưới quyền Người, thì rõ ràng Đấng đã đặt muôn vật dưới quyền Người không nằm trong số đó.[a]
  to: Vì Ngài đã đặt muôn vật dưới chân Người. Nhưng khi lời Kinh Thánh nói rằng muôn vật đã được đặt dưới quyền Người, thì rõ ràng là điều đó không bao gồm Đấng đã đặt muôn vật dưới quyền Người.[a]
  rationale: Chỉnh nhẹ cách nêu ngoại lệ để sở chỉ của phạm vi «muôn vật» rõ ràng hơn, đồng thời sửa chú thích thành một phương án tiếng Việt hoàn chỉnh. Không thay đổi ý nghĩa, phạm vi của «muôn vật», hay sự phân biệt mà câu nêu giữa Đấng đặt muôn vật dưới quyền và Người nhận sự quy phục.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T19:24:16Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch phản ánh đúng cấu trúc và lập luận của nguyên văn: hành động chủ động «đã đặt» (ὑπέταξεν), hình ảnh «dưới chân Người», trạng thái bị động hoàn thành «đã được đặt dưới quyền», và ngoại lệ dành cho Đấng đã đặt muôn vật dưới quyền Người. Việc hiểu εἴπῃ theo lối phi nhân xưng là hợp lý trong văn cảnh dẫn lời Kinh Thánh.'
  naturalness: Chính văn nhìn chung tự nhiên, trang trọng, và dễ hiểu. Tuy nhiên, «không nằm trong số đó» hơi quy chiếu mơ hồ; «không bao gồm Đấng...» trực tiếp nối với phạm vi «muôn vật» hơn. Chú thích hiện có cũng chưa thành câu tiếng Việt trọn vẹn sau «ngoại trừ».
  terminology: «Muôn vật», «dưới chân», và «dưới quyền» phù hợp văn phong Kinh Thánh tiếng Việt hiện đại và bảo toàn phạm vi rộng của πάντα. Sự phân biệt Ngài/Người giúp theo dõi Đấng đặt mọi sự dưới quyền và Đấng nhận sự quy phục, mà không thêm diễn giải thần học.
  issues:
  - severity: low
    issue: Cách diễn đạt ngoại lệ trong chính văn hơi mơ hồ.
    rationale: «Không nằm trong số đó» có thể khiến người đọc phải suy ra «đó» là phạm vi «muôn vật». «Không bao gồm Đấng...» diễn đạt trực tiếp hơn chức năng loại trừ của ἐκτός.
  - severity: medium
    issue: Nội dung chú thích [a] chưa là một phương án dịch hoàn chỉnh, tự nhiên.
    rationale: Cụm «thì rõ ràng là ngoại trừ Đấng...» thiếu cấu trúc hoàn chỉnh trong tiếng Việt. Cần viết lại thành một câu biểu thị rõ Đấng ấy là ngoại lệ.
  revised_text: Vì Ngài đã đặt muôn vật dưới chân Người. Nhưng khi lời Kinh Thánh nói rằng muôn vật đã được đặt dưới quyền Người, thì rõ ràng là điều đó không bao gồm Đấng đã đặt muôn vật dưới quyền Người.[a]
