id: 1CO.15.27
reference: 1 Corinthians 15:27
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: πάντα γὰρ ὑπέταξεν ὑπὸ τοὺς πόδας αὐτοῦ. ὅταν δὲ εἴπῃ ὅτι πάντα ὑποτέτακται, δῆλον ὅτι ἐκτὸς τοῦ ὑποτάξαντος αὐτῷ τὰ πάντα.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/027.yaml
  text: For he has subjected all things under his feet. But when it says that all things have been subjected[a], it is clear that this excludes the one who subjected all things to him.
translation:
  language: vi
  text: Vì Ngài đã đặt muôn vật dưới chân Người. Nhưng khi lời Kinh Thánh nói rằng muôn vật đã được đặt dưới quyền Người, thì rõ ràng là điều đó không bao gồm Đấng đã đặt muôn vật dưới quyền Người.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “thì rõ ràng là Đấng đã đặt muôn vật dưới quyền Người là ngoại lệ.”'
    reason: Giữ cách diễn đạt trực tiếp hơn của cụm ngoại trừ ἐκτός, thay cho lối diễn đạt giải thích «điều đó không bao gồm» trong chính văn.
lexical_decisions:
- source_word: πάντα / τὰ πάντα
  choice: muôn vật
  rationale: Giống trung số nhiều chỉ toàn thể mọi sự, không riêng con người. “Muôn vật” tự nhiên, trang trọng và giữ phạm vi bao quát cũng như âm hưởng Thi Thiên 8.
- source_word: ὑπέταξεν / ὑποτέτακται
  choice: đã đặt / đã được đặt dưới quyền
  rationale: Diễn đạt quan hệ quy phục bằng tiếng Việt tự nhiên; dạng chủ động rồi bị động phản ánh sự chuyển đổi của nguyên văn, còn “đã được đặt” truyền đạt hành động hoàn tất với tình trạng vẫn tiếp diễn của thì hoàn thành.
- source_word: ὑπὸ τοὺς πόδας αὐτοῦ
  choice: dưới chân Người
  rationale: Giữ nguyên hình ảnh Kinh Thánh quen thuộc về quyền thống trị và sự quy phục.
- source_word: ὅταν δὲ εἴπῃ
  choice: Nhưng khi lời Kinh Thánh nói
  rationale: Chủ ngữ không được nêu trong tiếng Hy Lạp. Cách dịch này theo lối hiểu phi nhân xưng, quy về lời trích Kinh Thánh, nhưng không đồng nhất trực tiếp chủ thể của động từ với Đức Chúa Trời.
- source_word: δῆλον
  choice: thì rõ ràng
  rationale: Truyền đạt kết luận hiển nhiên mà Phao-lô mong người đọc nhận ra.
- source_word: ἐκτὸς τοῦ ὑποτάξαντος αὐτῷ τὰ πάντα
  choice: Đấng đã đặt muôn vật dưới quyền Người không nằm trong số đó
  rationale: Diễn đạt rõ chức năng ngoại trừ của ἐκτός và mối liên hệ của nó với “muôn vật”, bằng cú pháp tiếng Việt tự nhiên.
- source_word: αὐτοῦ / αὐτῷ
  choice: Người / dưới quyền Người
  rationale: Các đại từ chỉ Đấng Christ trong ngữ cảnh. Viết hoa “Người” giúp nhận diện sở chỉ trong tiếng Việt mà không thêm danh xưng không có trong câu.
theological_decisions:
- issue: Quan hệ giữa Con và Đấng đặt muôn vật dưới quyền Con
  choice: Nêu rõ Đấng đặt muôn vật dưới quyền Người không thuộc phạm vi “muôn vật” bị đặt dưới quyền.
  alternative: “ngoại trừ Đấng đã đặt muôn vật dưới quyền Người”
  rationale: Giữ nguyên ngoại lệ lô-gích của câu và sự phân biệt giữa Đấng Christ với Đấng làm cho muôn vật quy phục Người, nhưng không giải thích thêm về bản thể hay quan hệ nội tại giữa hai Đấng.
- issue: Chủ ngữ của εἴπῃ
  choice: “lời Kinh Thánh nói”
  alternative: “Ngài phán” hoặc “khi có lời rằng”
  rationale: Nguyên văn không nêu chủ ngữ rõ ràng. Cách chọn này phản ánh lối dẫn Kinh Thánh trong văn cảnh và tránh quyết định rằng chính Đức Chúa Trời là chủ ngữ ngữ pháp trực tiếp.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “muôn vật” để duy trì âm hưởng Kinh Thánh; “dưới chân” bảo tồn hình ảnh của lời trích, còn “dưới quyền” diễn đạt tự nhiên các lần dùng ὑποτάσσω. Dấu chú thích [a] xuất hiện trong chính văn.
