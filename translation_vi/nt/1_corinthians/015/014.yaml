source:
  edition: SBLGNT
  text: εἰ δὲ Χριστὸς οὐκ ἐγήγερται, κενὸν ⸀ἄρα τὸ κήρυγμα ἡμῶν, ⸀κενὴ καὶ ἡ πίστις ⸀ὑμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/014.yaml
  text: And if Messiah has not been raised[a], then our proclamation is empty[c][b], and your faith is empty.
translation:
  language: vi
  text: Và nếu Đấng Mê-si[a] đã không được làm cho sống lại, thì lời rao truyền của chúng tôi là trống rỗng[b], và đức tin[c] của anh chị em cũng trống rỗng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Đấng Christ” hoặc “Đấng Ki-tô” (Hy Lạp: Christos).'
    reason: alternative_reading
  - marker: b
    text: “Trống rỗng” cũng có thể dịch là “vô ích” ở cả hai lần xuất hiện trong câu.
    reason: lexical_alternative
  - marker: c
    text: “Đức tin” cũng có thể dịch là “sự tin cậy.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Χριστὸς
  choice: Đấng Mê-si
  rationale: Giữ nghĩa tước hiệu của Χριστός trong lập luận về thân phận và sự phục sinh của Đấng Mê-si; cách gọi này tự nhiên và rõ nghĩa trong tiếng Việt hiện đại.
- source_word: ἐγήγερται
  choice: được làm cho sống lại
  rationale: Phản ánh thể hoàn thành bị động của ἐγείρω trong ngữ cảnh phục sinh, đồng thời giữ sắc thái kết quả vẫn còn hiệu lực và không xóa đi tác nhân hàm ẩn.
- source_word: ἄρα
  choice: thì
  rationale: Diễn đạt tự nhiên hệ quả logic trong cấu trúc điều kiện “nếu… thì…”.
- source_word: κήρυγμα
  choice: lời rao truyền
  rationale: Thể hiện nội dung được công bố công khai, không thu hẹp vào riêng hành vi giảng thuyết.
- source_word: κενὸν / κενὴ
  choice: trống rỗng
  rationale: Giữ cùng một cách dịch ở cả hai lần xuất hiện để bảo toàn phép song hành tu từ; từ này diễn tả sự thiếu thực chất hoặc giá trị xác thực.
- source_word: πίστις
  choice: đức tin
  rationale: Trong ngữ cảnh này, πίστις chỉ sự tin nhận của các tín hữu Cô-rinh-tô; “đức tin” là cách diễn đạt chuẩn, tự nhiên và không áp đặt nghĩa “sự trung tín” vốn ít thích hợp hơn.
theological_decisions:
- issue: Cách diễn đạt sự phục sinh và tác nhân
  choice: chưa được làm cho sống lại
  alternative: chưa sống lại
  rationale: Bảo toàn thể bị động của nguyên văn, qua đó giữ nguyên sắc thái thần học về tác nhân làm cho sống lại mà không xác định thêm điều câu này chỉ hàm ý.
- issue: Tước hiệu Χριστός
  choice: Đấng Mê-si
  alternative: Đấng Christ / Chúa Kitô
  rationale: Dịch theo nghĩa tước hiệu thay vì dùng một dạng đã trở thành tên riêng trong một số truyền thống, đồng thời tránh thiên lệch hệ phái.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” cho đại từ số nhiều ὑμῶν nhằm diễn đạt cộng đồng người nhận thư một cách tự nhiên và bao quát. Thêm “cũng” để thể hiện καὶ và làm rõ phép song hành giữa lời rao truyền với đức tin.
