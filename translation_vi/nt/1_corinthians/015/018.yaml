  yaml_path: translation/nt/1_corinthians/015/018.yaml
  text: Then those also who have fallen asleep in Messiah have perished[a][b].
translation:
  language: vi
  text: Vậy thì những người đã an giấc trong Đấng Mê-si cũng đã hư mất[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “trong Đấng Christ.” “An giấc” là cách nói uyển ngữ trong tiếng Hy Lạp chỉ việc qua đời, đặc biệt khi nói về các tín hữu.'
    reason: Nêu cách dịch truyền thống của Χριστός và giải thích hình ảnh uyển ngữ được giữ lại từ nguyên văn.
lexical_decisions:
- source_word: ἄρα
  choice: Vậy thì
  rationale: Tiểu từ suy luận, rút ra hệ quả từ lập luận giả định ngay trước đó; “Vậy thì” tự nhiên trong tiếng Việt và giữ được mạch lập luận phản chứng.
- source_word: καὶ
  choice: cả ... cũng
  rationale: 'Cấu trúc tương liên này diễn đạt rõ sức cộng thêm của καὶ: những người đã chết trong Đấng Mê-si cũng nằm trong hệ quả vừa nêu.'
- source_word: οἱ κοιμηθέντες
  choice: những người đã an giấc
  rationale: Giữ hình ảnh uyển ngữ về cái chết trong động từ κοιμάομαι, đồng thời “an giấc” là cách nói trang trọng, dễ hiểu trong tiếng Việt.
- source_word: ἐν Χριστῷ
  choice: trong Đấng Mê-si
  rationale: Χριστός mang nghĩa tước hiệu “Đấng Mê-si/Đấng được xức dầu”; “trong” giữ nguyên ngôn ngữ hiệp nhất thuộc về Đấng ấy của Phao-lô.
- source_word: ἀπώλοντο
  choice: đã hư mất
  rationale: Diễn đạt sự diệt vong hay mất mát chung cuộc được suy ra trong giả định không có sự sống lại; thể hoàn thành với “đã” phù hợp với động từ aorist và tình trạng kết quả trong lập luận.
theological_decisions:
- issue: Cách dịch Χριστῷ trong công thức hiệp nhất của Phao-lô
  choice: Đấng Mê-si
  alternative: Đấng Christ
  rationale: Dịch tước hiệu thay vì coi như tên riêng, đồng thời không làm mất công thức thần học “trong Đấng Mê-si”; cách quen thuộc “Đấng Christ” được ghi ở chú thích.
- issue: Sắc thái của ἀπώλοντο trong lập luận về sự sống lại
  choice: đã hư mất
  alternative: đã bị diệt vong
  rationale: “Hư mất” giữ được sức nặng thần học và phạm vi nghĩa về sự mất mát chung cuộc mà không xác định thêm cách thức hay thời điểm.
translation_notes:
  register: Văn phong hiện đại, trang trọng và gọn. Cấu trúc “cả ... cũng” làm rõ quan hệ suy luận-cộng thêm; “an giấc” giữ phép ẩn dụ mà vẫn dễ hiểu đối với độc giả phổ thông.
