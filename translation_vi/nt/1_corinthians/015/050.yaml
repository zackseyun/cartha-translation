revisions:
- from: 'Thưa anh em[a], tôi nói điều này: thịt và máu không thể thừa hưởng vương quốc Đức Chúa Trời[b], và cái hay hư nát cũng không thừa hưởng sự không hư nát.'
  to: 'Thưa anh em[a], tôi nói điều này: thịt và máu không thể thừa hưởng vương quốc Đức Chúa Trời[b], và điều hư nát cũng không thừa hưởng sự không hư nát.'
  rationale: Chỉ sửa một cụm từ không tự nhiên. «Điều hư nát» giữ ἡ φθορά như một thực tại được nhân cách hóa trong vế song song và không thêm khái niệm về vật chất, thân xác, hay sự bất tử mà nguyên văn không nêu tại đây. Các dấu chú thích vẫn đặt đúng tại «anh em» và «Đức Chúa Trời».
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T19:24:27Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch chuyển tải đúng cấu trúc và ý chính của câu: lời giải thích ngỏ với ἀδελφοί, thành ngữ «thịt và máu», sự bất khả thừa hưởng vương quốc Đức Chúa Trời, và thế đối lập φθορά/ἀφθαρσία. Chú thích b giải thích thành ngữ phù hợp với mạch văn phục sinh và không áp đặt cách hiểu phủ nhận thân thể. Tuy nhiên, «cái hay hư nát» chưa diễn đạt tự nhiên và rõ ràng chức năng danh hóa của ἡ φθορά trong tiếng Việt.'
  naturalness: «Thưa anh em, tôi nói điều này» là lối xưng hô trang trọng, tự nhiên. «Thịt và máu» và «vương quốc Đức Chúa Trời» phù hợp văn phong Kinh Thánh tiếng Việt. Thay «cái hay hư nát» bằng «điều hư nát» tạo một đối ứng danh hóa tự nhiên hơn với «sự không hư nát», vẫn giữ được phép nhân cách hóa và tính song song của nguyên văn.
  terminology: Giữ «anh em» với chú thích về phạm vi bao gồm, «thịt và máu», «Đức Chúa Trời», «thừa hưởng», và cặp «hư nát/không hư nát». Cặp thuật ngữ cuối phản ánh sát φθορά/ἀφθαρσία hơn việc thay bằng «bất tử».
  issues:
  - severity: medium
    issue: Cụm «cái hay hư nát» không tự nhiên trong tiếng Việt hiện đại.
    rationale: «Hay hư nát» là vị ngữ/tính chất, nhưng «cái hay hư nát» nghe gượng và không xác định rõ đối tượng được danh hóa. «Điều hư nát» diễn đạt tự nhiên hơn ý cái thuộc về/tình trạng có thể hư nát, đồng thời bảo toàn sự đối lập với «sự không hư nát».
