id: 1CO.15.50
reference: 1 Corinthians 15:50
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Τοῦτο δέ φημι, ἀδελφοί, ὅτι σὰρξ καὶ αἷμα βασιλείαν θεοῦ κληρονομῆσαι οὐ ⸀δύναται, οὐδὲ ἡ φθορὰ τὴν ἀφθαρσίαν κληρονομεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/050.yaml
  text: 'I say this[a], brothers: flesh and blood cannot inherit the kingdom of God[b], nor does the perishable inherit the imperishable.'
translation:
  language: vi
  text: 'Thưa anh em[a], tôi nói điều này: thịt và máu không thể thừa hưởng vương quốc Đức Chúa Trời[b], và điều hư nát cũng không thừa hưởng sự không hư nát.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể hiểu là “anh chị em”; tiếng Hy Lạp nói “anh em” và trong ngữ cảnh có thể dùng để gọi toàn thể hội chúng, gồm cả nam lẫn nữ.
    reason: lexical_alternative
  - marker: b
    text: “Thịt và máu” là thành ngữ chỉ đời sống con người hữu tử trong tình trạng hiện tại, chứ không phủ nhận sự phục sinh của thân thể.
    reason: cultural_note
lexical_decisions:
- source_word: Τοῦτο δέ φημι
  choice: tôi nói điều này
  rationale: Giữ lối trình bày trực tiếp của Phao-lô; δέ được thể hiện tự nhiên qua trật tự và dấu câu, không thêm một từ chỉ thời gian vốn không có trong nguyên văn.
- source_word: ἀδελφοί
  choice: thưa anh em
  rationale: Giữ hình thức giống đực số nhiều của tiếng Hy Lạp trong lời xưng hô trang trọng, đồng thời chú thích rằng trong ngữ cảnh từ này có thể bao gồm cả hội chúng.
- source_word: σὰρξ καὶ αἷμα
  choice: thịt và máu
  rationale: Bảo tồn thành ngữ cụ thể của nguyên văn, chỉ đời sống con người hữu tử trong tình trạng hiện tại; ý nghĩa được làm rõ bằng chú thích để tránh diễn giải thành sự phủ nhận thân thể phục sinh.
- source_word: βασιλείαν θεοῦ
  choice: vương quốc Đức Chúa Trời
  rationale: Cách dịch rõ ràng và quen thuộc, giữ cấu trúc sở hữu cùng sức nặng thần học của cụm từ.
- source_word: κληρονομῆσαι / κληρονομεῖ
  choice: thừa hưởng
  rationale: Diễn đạt tự nhiên ý nhận phần gia nghiệp, đồng thời duy trì sự lặp lại và tính song song của hai vế.
- source_word: οὐ δύναται
  choice: không thể
  rationale: Diễn đạt ngắn gọn, chính xác ý không có khả năng.
- source_word: ἡ φθορά
  choice: cái hay hư nát
  rationale: Giữ dạng danh hóa và nhấn mạnh tình trạng phải chịu hư hoại trong thế đối lập với ἀφθαρσία.
- source_word: τὴν ἀφθαρσίαν
  choice: sự không hư nát
  rationale: Giữ sắc thái trừu tượng của danh từ và sự đối xứng từ vựng với φθορά; không đồng nhất với 'sự bất tử', vốn là một khái niệm gần gũi nhưng không hoàn toàn tương đương.
theological_decisions:
- issue: Ý nghĩa của “thịt và máu” trong mối liên hệ với sự phục sinh
  choice: Giữ thành ngữ để chỉ đời sống con người hữu tử, hay hư nát, trong tình trạng hiện tại.
  alternative: Hiểu rằng vật chất hay thân thể tự nó không thể vào vương quốc Đức Chúa Trời.
  rationale: Mạch văn gần nói đến việc thân thể phải được biến đổi từ hay hư nát sang không hư nát, chứ không nói phải từ bỏ thân thể. Bản dịch giữ nguyên sức căng của thành ngữ và giải thích giới hạn của nó trong chú thích.
- issue: Phạm vi người nghe của ἀδελφοί
  choice: Dịch “anh em” trong chính văn và ghi nhận nghĩa bao gồm cả hội chúng trong chú thích.
  alternative: Dịch trực tiếp “anh chị em”.
  rationale: Cách chọn này bảo tồn hình thức giống đực của nguyên văn nhưng không che khuất khả năng Phao-lô đang ngỏ lời với toàn thể hội chúng.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Đảo lời xưng hô “Thưa anh em” lên đầu để câu tự nhiên, vẫn giữ đầy đủ nội dung và quan hệ diễn ngôn của nguyên văn. Dùng “hay hư nát / không hư nát” để bảo tồn thế đối lập trong lập luận về sự phục sinh.
