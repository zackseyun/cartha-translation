  text: καὶ ὅτι ἐτάφη, καὶ ὅτι ἐγήγερται τῇ ⸂ἡμέρᾳ τῇ τρίτῃ⸃ κατὰ τὰς γραφάς,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/004.yaml
  text: and that he was buried[a], and that he has been raised on the third day according to the Scriptures[b],
translation:
  language: vi
  text: và rằng Ngài đã được chôn cất, và rằng Ngài đã được làm cho sống lại[a] vào ngày thứ ba, theo lời Kinh Thánh,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể diễn đạt gọn là “đã sống lại.” Động từ Hy Lạp ở thể hoàn thành bị động, nói về một hành động đã xảy ra với kết quả vẫn còn.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐτάφη
  choice: đã được chôn cất
  rationale: Động từ aorist bị động của θάπτω nói thẳng về việc mai táng. “Đã được chôn cất” tự nhiên trong tiếng Việt và giữ thể bị động mà không thêm chi tiết về mộ.
- source_word: ἐγήγερται
  choice: đã được làm cho sống lại
  rationale: Đây là dạng hoàn thành, bị động, chỉ định của ἐγείρω. Cách dịch này giữ thể bị động và trình bày sự sống lại như một biến cố đã hoàn tất với hiệu lực còn tiếp diễn.
- source_word: τῇ ἡμέρᾳ τῇ τρίτῃ
  choice: vào ngày thứ ba
  rationale: Cụm tặng cách chỉ thời gian có nghĩa tự nhiên là “vào ngày thứ ba”; không thêm “sau” vì từ ấy không có trong nguyên văn.
- source_word: κατὰ τὰς γραφάς
  choice: theo lời Kinh Thánh
  rationale: Cụm này diễn tả sự phù hợp với chứng ngôn của Kinh Thánh. “Theo lời Kinh Thánh” là cách nói tự nhiên, trang trọng trong tiếng Việt và không xác định thêm những đoạn Kinh Thánh mà Phao-lô không nêu rõ.
- source_word: ὅτι
  choice: rằng
  rationale: Giữ từ dẫn nhập mệnh đề nội dung và nhịp điệu tuyên xưng được lặp lại trong nguyên văn.
- source_word: καὶ
  choice: và
  rationale: Giữ liên từ đơn giản được lặp lại trong chuỗi công thức của Phao-lô.
theological_decisions:
- issue: Thể và sắc thái của động từ chỉ sự sống lại
  choice: đã được làm cho sống lại
  alternative: đã sống lại
  rationale: Nguyên văn dùng thể hoàn thành bị động, trình bày sự sống lại là hành động đã xảy ra với kết quả còn hiệu lực. Bản dịch chính giữ thể bị động, không chỉ rõ tác nhân vốn không được nêu trong câu; phương án “đã sống lại” tự nhiên hơn nhưng làm mờ thể bị động.
- issue: Phạm vi quy chiếu của γραφάς
  choice: Kinh Thánh
  alternative: các sách thánh
  rationale: Trong cách dùng của Phao-lô, từ này chỉ bộ sách thánh được thừa nhận. Không thêm “Do Thái” hay liệt kê các đoạn cụ thể, vì nguyên văn không làm vậy.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Ngài” cung cấp chủ ngữ tự nhiên trong tiếng Việt cho động từ ngôi thứ ba vốn được hàm ý trong tiếng Hy Lạp. Dấu phẩy cuối câu được giữ vì câu này tiếp nối cấu trúc liệt kê của phân đoạn.
