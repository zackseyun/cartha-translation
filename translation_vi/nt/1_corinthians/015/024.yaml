revisions:
- from: Rồi sẽ đến thời điểm cuối cùng[a], khi Đấng Christ trao vương quốc cho Đức Chúa Trời là Cha[b], sau khi Ngài đã vô hiệu hóa mọi quyền cai trị, mọi thẩm quyền và quyền lực.[c]
  to: Rồi sẽ đến sự kết thúc[a], khi Đấng Christ trao vương quốc cho Đức Chúa Trời là Cha[b], khi Ngài vô hiệu hóa mọi quyền cai trị, mọi thẩm quyền và quyền lực.[c]
  rationale: Sửa “sau khi Ngài đã” thành “khi Ngài” để phản ánh hai mệnh đề ὅταν song hành và không giải quyết quá mức quan hệ thời gian. Sửa “thời điểm cuối cùng” thành “sự kết thúc” để sát τὸ τέλος hơn. Chú thích c được chỉnh để không lặp lại nguyên văn bản chính, đồng thời vẫn bảo lưu các khả năng ngữ nghĩa của καταργέω và ἀρχή.
