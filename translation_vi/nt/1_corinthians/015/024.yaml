id: 1CO.15.24
reference: 1 Corinthians 15:24
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἶτα τὸ τέλος, ὅταν ⸀παραδιδῷ τὴν βασιλείαν τῷ θεῷ καὶ πατρί, ὅταν καταργήσῃ πᾶσαν ἀρχὴν καὶ πᾶσαν ἐξουσίαν καὶ δύναμιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/024.yaml
  text: Then comes the end[a], when he hands over the kingdom to God the Father[c][b], when he abolishes every rule and every authority and power.
translation:
  language: vi
  text: Rồi sẽ đến sự kết thúc[a], khi Đấng Christ trao vương quốc cho Đức Chúa Trời là Cha[b], khi Ngài vô hiệu hóa mọi quyền cai trị, mọi thẩm quyền và quyền lực.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “sự hoàn tất” hoặc “đích điểm.” Từ Hy Lạp τέλος có thể chỉ sự kết thúc, đích điểm hoặc sự hoàn tất.
    reason: lexical_alternative
  - marker: b
    text: 'Dịch sát hơn: “cho Đức Chúa Trời và Cha.”'
    reason: lexical_alternative
  - marker: c
    text: Hay “bãi bỏ” hoặc “làm cho mất hiệu lực” mọi quyền cai trị, mọi thẩm quyền và quyền lực. “Quyền cai trị” cũng có thể chỉ các thế lực hoặc những kẻ cai trị.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶτα
  choice: Rồi sẽ đến
  rationale: Diễn tả bước kế tiếp trong trình tự phục sinh mà Phao-lô đang trình bày, đồng thời tạo câu tiếng Việt tự nhiên.
- source_word: τὸ τέλος
  choice: thời điểm cuối cùng
  rationale: Giữ nghĩa thời gian trực tiếp của τέλος trong trình tự cánh chung; chú thích bảo lưu khả năng hiểu là sự hoàn tất hay đích điểm.
- source_word: ὅταν παραδιδῷ
  choice: khi ... trao
  rationale: 'Diễn đạt một biến cố tương lai: Đấng Christ chuyển giao vương quyền cho Cha.'
- source_word: τὴν βασιλείαν
  choice: vương quốc
  rationale: Là cách dịch tự nhiên của βασιλεία, đồng thời hình ảnh trao vương quốc vẫn hàm chứa ý niệm quyền trị vì.
- source_word: τῷ θεῷ καὶ πατρί
  choice: cho Đức Chúa Trời là Cha
  rationale: 'Hiểu καί theo quan hệ đồng vị: Đức Chúa Trời, tức là Cha; cách diễn đạt này rõ ràng mà vẫn giữ được cấu trúc Hy Lạp qua chú thích.'
- source_word: ὅταν καταργήσῃ
  choice: sau khi Ngài đã vô hiệu hóa
  rationale: Thì aorist subjunctive trong mệnh đề ὅταν có thể biểu thị hành động hoàn tất trước việc trao vương quốc. 'Vô hiệu hóa' diễn tả việc chấm dứt hiệu lực mà không mặc nhiên khẳng định sự tiêu diệt bản thể.
- source_word: πᾶσαν ἀρχὴν
  choice: mọi quyền cai trị
  rationale: Trong chuỗi ἀρχή, ἐξουσία, δύναμις, cách dịch này bảo lưu sắc thái quyền lực cai trị mà không buộc danh từ phải chỉ riêng các cá thể cầm quyền.
- source_word: πᾶσαν ἐξουσίαν
  choice: mọi thẩm quyền
  rationale: Diễn đạt quyền được nắm giữ hoặc thi hành một cách rõ ràng trong tiếng Việt hiện đại.
- source_word: δύναμιν
  choice: quyền lực
  rationale: Phù hợp với danh sách các thế lực và tránh lặp từ 'quyền' đơn độc một cách khó hiểu.
theological_decisions:
- issue: Quan hệ giữa θεῷ và πατρί trong τῷ θεῷ καὶ πατρί
  choice: 'Hiểu theo quan hệ đồng vị: “Đức Chúa Trời là Cha”'
  alternative: “Đức Chúa Trời và Cha”
  rationale: Cấu trúc Hy Lạp có thể được phản ánh sát hơn bằng liên từ, nhưng trong ngữ cảnh, 'Cha' xác định Đấng được gọi là Đức Chúa Trời. Chú thích giữ lại cách dịch sát cấu trúc hơn.
- issue: Quan hệ thời gian giữa việc vô hiệu hóa các quyền lực và việc trao vương quốc
  choice: “sau khi Ngài đã vô hiệu hóa”
  alternative: “khi Ngài vô hiệu hóa”
  rationale: Aorist subjunctive καταργήσῃ có thể hàm ý việc vô hiệu hóa được hoàn tất khi vương quốc được trao; tuy vậy, cú pháp ὅταν lặp lại cũng cho phép cách diễn đạt đồng thời hơn, nên ghi nhận phương án ấy trong chú thích.
- issue: Mức độ tác động của καταργέω đối với các quyền lực chống nghịch
  choice: “vô hiệu hóa”
  alternative: “bãi bỏ”, “tiêu diệt” hoặc “làm cho ra không”
  rationale: Động từ nói đến việc làm mất hiệu lực hoặc chấm dứt hoạt động; bản dịch tránh quyết định rằng các quyền lực nhất thiết bị tiêu diệt về bản thể.
- issue: ἀρχή là quyền cai trị hay người cai trị
  choice: “quyền cai trị”
  alternative: “kẻ cai trị” hoặc “thế lực thống trị”
  rationale: Trong bộ ba với ἐξουσία và δύναμις, nghĩa về quyền lực hay phạm vi cai trị nổi bật, nhưng cách hiểu các chủ thể cầm quyền vẫn có thể có.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại. Chủ ngữ “Đấng Christ” được nêu rõ vì tiếng Việt không thể dựa tự nhiên vào đại từ không có tiền ngữ ngay trong câu trích riêng. Dùng “Ngài” nhất quán để chỉ Đấng Christ. Các chú thích bảo lưu độ mở của τέλος, cấu trúc θεῷ καὶ πατρί, giá trị thời gian của mệnh đề ὅταν và phạm vi nghĩa của καταργέω cùng ἀρχή.
