  to: Nhưng nhờ ân điển của Đức Chúa Trời, tôi là con người như hiện nay; và ân điển Ngài dành cho tôi đã không trở nên vô ích.[a] Trái lại, tôi đã lao nhọc nhiều hơn tất cả họ—nhưng không phải tôi, mà là ân điển của Đức Chúa Trời ở cùng tôi.
  rationale: Chỉnh câu đầu để phản ánh trực tiếp hơn εἰμι ὅ εἰμι như một khẳng định về con người/hiện trạng của Phao-lô, thay vì cách nói “được như hiện nay.” Chỉnh câu chú thích để lựa chọn thay thế hoàn chỉnh về ngữ pháp, đồng thời giữ được sắc thái “trở nên” của ἐγενήθη. Các phần còn lại trung thành với nguyên văn và giữ đúng sức căng thần học của câu.
