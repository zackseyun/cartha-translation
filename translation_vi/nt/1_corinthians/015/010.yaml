id: 1CO.15.10
reference: 1 Corinthians 15:10
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: χάριτι δὲ θεοῦ εἰμι ὅ εἰμι, καὶ ἡ χάρις αὐτοῦ ἡ εἰς ἐμὲ οὐ κενὴ ἐγενήθη, ἀλλὰ περισσότερον αὐτῶν πάντων ἐκοπίασα, οὐκ ἐγὼ δὲ ἀλλὰ ἡ χάρις τοῦ θεοῦ ⸀ἡ σὺν ἐμοί.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/010.yaml
  text: But by the grace of God I am what I am[a], and his grace toward me did not prove empty. On the contrary, I labored more than all of them—yet not I, but the grace of God that was with me.
translation:
  language: vi
  text: Nhưng nhờ ân điển của Đức Chúa Trời, tôi là con người như hiện nay; và ân điển Ngài dành cho tôi đã không trở nên vô ích.[a] Trái lại, tôi đã lao nhọc nhiều hơn tất cả họ—nhưng không phải tôi, mà là ân điển của Đức Chúa Trời ở cùng tôi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát chữ: “đã không trở nên trống rỗng”; cũng có thể dịch: “đã không trở nên vô ích.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: χάριτι δὲ θεοῦ
  choice: Nhưng nhờ ân điển của Đức Chúa Trời
  rationale: Dùng “nhờ” để diễn đạt cách dùng công cụ của χάριτι; “nhưng” thể hiện sự tương phản nhẹ của δέ với mạch văn trước. “Ân điển” giữ thuật ngữ trọng tâm của Phao-lô.
- source_word: εἰμι ὅ εἰμι
  choice: tôi được như hiện nay
  rationale: Diễn đạt tự nhiên trong tiếng Việt rằng địa vị và con người hiện tại của Phao-lô là nhờ ân điển, đồng thời giữ ý của lối lặp Hy Lạp “tôi là điều tôi là” mà không tạo câu gượng.
- source_word: ἡ χάρις αὐτοῦ ἡ εἰς ἐμὲ
  choice: ân điển Ngài dành cho tôi
  rationale: “Dành cho tôi” thể hiện hướng nhắm đến Phao-lô của εἰς ἐμέ bằng tiếng Việt tự nhiên.
- source_word: οὐ κενὴ ἐγενήθη
  choice: đã không trở nên vô ích
  rationale: Giữ sắc thái của ἐγενήθη là “trở nên” và chuyển κενή theo nghĩa không thiếu kết quả; chú thích bảo lưu hình ảnh sát chữ “trống rỗng”.
- source_word: ἀλλὰ περισσότερον αὐτῶν πάντων ἐκοπίασα
  choice: Trái lại, tôi đã lao nhọc nhiều hơn tất cả họ
  rationale: “Lao nhọc” truyền đạt sức lực vất vả hàm chứa trong κοπιάω; “tất cả họ” giữ phép so sánh của αὐτῶν πάντων.
- source_word: οὐκ ἐγὼ δὲ ἀλλὰ ἡ χάρις τοῦ θεοῦ
  choice: nhưng không phải tôi, mà là ân điển của Đức Chúa Trời
  rationale: Giữ nguyên sự đối lập mạnh, vừa thừa nhận công lao động thật của Phao-lô vừa quy hiệu lực cho ân điển Đức Chúa Trời.
- source_word: ἡ σὺν ἐμοί
  choice: ở cùng tôi
  rationale: Dịch σύν với cách cho theo nghĩa “cùng với”; cụm từ bổ nghĩa cho ân điển của Đức Chúa Trời mà không thêm ý cộng tác vốn không được nói rõ.
theological_decisions:
- issue: Mối quan hệ giữa sự lao nhọc của Phao-lô và ân điển Đức Chúa Trời
  choice: Giữ đồng thời lời khẳng định Phao-lô thật sự lao nhọc và ân điển Đức Chúa Trời là tác nhân hữu hiệu.
  alternative: Diễn giải thành Đức Chúa Trời và Phao-lô cùng làm việc, hoặc diễn giải theo hướng giảm nhẹ sự lao nhọc thực sự của Phao-lô.
  rationale: 'Bản Hy Lạp đặt hai lời khẳng định cạnh nhau: “tôi đã lao nhọc” và “không phải tôi, mà là ân điển.” Bản dịch không giải quyết sức căng này theo một hệ thống thần học về sau.'
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ân điển” để duy trì thuật ngữ thần học quen thuộc của Phao-lô; “lao nhọc” giữ sắc thái nỗ lực vất vả. Đại từ “tôi” phù hợp lời tự thuật của Phao-lô, còn “họ” liên hệ tự nhiên với các sứ đồ được nhắc đến trong ngữ cảnh.
