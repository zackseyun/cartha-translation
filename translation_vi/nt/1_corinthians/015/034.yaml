source:
  edition: SBLGNT
  text: ἐκνήψατε δικαίως καὶ μὴ ἁμαρτάνετε, ἀγνωσίαν γὰρ θεοῦ τινες ἔχουσιν· πρὸς ἐντροπὴν ὑμῖν ⸀λαλῶ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/034.yaml
  text: Come to your senses rightly[a], and do not go on sinning; for some have ignorance of God[b]. I say this to your shame.
translation:
  language: vi
  text: Hãy tỉnh táo lại cho phải lẽ[a] và đừng tiếp tục phạm tội, vì có người thiếu hiểu biết về Đức Chúa Trời. Tôi nói điều này để anh chị em phải hổ thẹn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Hãy tỉnh ngộ cho phải lẽ.” Động từ theo nghĩa đen gợi việc tỉnh rượu, nhưng ở đây có lẽ được dùng theo nghĩa ẩn dụ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκνήψατε
  choice: Hãy tỉnh lại
  rationale: Động từ mệnh lệnh aorist kêu gọi một sự thay đổi dứt khoát. Nghĩa đen gợi việc tỉnh rượu, nhưng trong ngữ cảnh này được dùng theo nghĩa ẩn dụ là trở lại trạng thái nhận thức sáng suốt.
- source_word: δικαίως
  choice: cho đúng đắn
  rationale: Trạng từ bổ nghĩa cho mệnh lệnh ἐκνήψατε, diễn tả việc tỉnh lại theo cách đúng phải. Cách dịch này tự nhiên trong tiếng Việt và không làm nặng thêm sắc thái thần học của từ.
- source_word: μὴ ἁμαρτάνετε
  choice: đừng tiếp tục phạm tội
  rationale: Mệnh lệnh hiện tại với μή có thể hàm ý ngăn chặn hành động đang tiếp diễn hoặc có tính thường xuyên; “đừng tiếp tục” bảo toàn sắc thái ấy mà không khẳng định quá mức rằng tất cả độc giả đều đang phạm cùng một tội cụ thể.
- source_word: ἀγνωσίαν ... θεοῦ
  choice: không biết Đức Chúa Trời
  rationale: Cụm danh từ chỉ tình trạng thiếu hiểu biết về Đức Chúa Trời. Chuyển thành cấu trúc động từ là cách diễn đạt tự nhiên, rõ nghĩa trong tiếng Việt hiện đại.
- source_word: τινες
  choice: một số người
  rationale: Chỉ một bộ phận không xác định trong hoặc có liên hệ với cộng đồng người nghe.
- source_word: πρὸς ἐντροπὴν ὑμῖν λαλῶ
  choice: Tôi nói điều này để anh chị em phải hổ thẹn
  rationale: Diễn đạt lực quở trách và hiệu quả nhắm đến nơi người nghe. “Anh chị em” thể hiện số nhiều của ὑμῖν và phù hợp lối xưng hô cộng đồng trong thư tín.
theological_decisions:
- issue: Sắc thái đạo đức của δικαίως
  choice: cho đúng đắn
  alternative: một cách công chính; theo lẽ phải
  rationale: “Cho đúng đắn” giữ ý hành động một cách phải lẽ, nhưng không nhập vào câu một nghĩa kỹ thuật về sự công chính mà hình thức trạng từ này không nhất thiết mang.
- issue: Tính chất của việc không biết Đức Chúa Trời
  choice: không biết Đức Chúa Trời
  alternative: thiếu hiểu biết về Đức Chúa Trời
  rationale: Cách dịch chính tự nhiên và trực tiếp; phương án danh từ làm nổi bật trạng thái “sự thiếu hiểu biết” nhưng nặng văn hơn. Không thêm phán đoán về việc họ hoàn toàn không có tri thức hay chỉ thiếu tri thức đúng đắn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và trực tiếp. “Hãy tỉnh lại” giữ hình ảnh tỉnh rượu ở mức dễ hiểu; “anh chị em” làm rõ đại từ số nhiều và tránh lối xưng hô quá cổ.
