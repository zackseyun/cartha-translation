  source_fidelity: 'Bản nháp giữ đúng trật tự và sự đối lập của nguyên văn: σπείρεται/ἐγείρεται, σῶμα ψυχικόν/σῶμα πνευματικόν, và mệnh đề điều kiện với καὶ. Tuy nhiên, cấu trúc “Gieo xuống là ...; sống lại là ...” lược mất rõ rệt sắc thái bị động của hai động từ Hy Lạp và có thể khiến “sống lại” được hiểu là chủ động. Dùng “được gieo xuống ...; được sống lại ...” phản ánh nguyên văn rõ hơn mà vẫn tự nhiên.'
