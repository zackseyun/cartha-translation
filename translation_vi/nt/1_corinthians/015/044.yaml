id: 1CO.15.44
reference: 1 Corinthians 15:44
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: σπείρεται σῶμα ψυχικόν, ἐγείρεται σῶμα πνευματικόν. ⸀Εἰ ἔστιν σῶμα ψυχικόν, ⸂ἔστιν καὶ⸃ πνευματικόν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/044.yaml
  text: It is sown a natural body; it is raised a spiritual body. If there is a natural body[a], there is also a spiritual body.
translation:
  language: vi
  text: Được gieo xuống là một thân thể tự nhiên; được sống lại là một thân thể thuộc linh. Nếu có thân thể tự nhiên[a], thì cũng có thân thể thuộc linh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Thân thể tự nhiên” cũng có thể dịch là “thân thể thuộc hồn”; thuật ngữ đối lập là “thân thể thuộc linh.” Sự tương phản ở đây không phải giữa thân thể vật chất và thân thể phi vật chất, nhưng giữa thân thể được duy trì bởi sự sống tự nhiên của con người và thân thể được Thánh Linh ban sự sống và chi phối.
    reason: lexical_alternative
lexical_decisions:
- source_word: σπείρεται
  choice: Gieo xuống
  rationale: Giữ hình ảnh gieo hạt trong văn cảnh và sắc thái bị động phiếm chỉ tự nhiên của tiếng Việt.
- source_word: σῶμα
  choice: thân thể
  rationale: Cách dịch trực tiếp, trang trọng và thông dụng, chỉ con người có thân thể trong sự chết và sự sống lại.
- source_word: ψυχικόν
  choice: tự nhiên
  rationale: Diễn tả thân thể được đặc trưng bởi sự sống thuộc trật tự con người hiện tại; tránh từ “thể chất” vì dễ tạo thế đối lập vật chất–phi vật chất.
- source_word: ἐγείρεται
  choice: sống lại
  rationale: Trong văn cảnh phục sinh, đây là cách diễn đạt tự nhiên nhất trong tiếng Việt; truyền đạt nghĩa được khiến trỗi dậy mà không làm câu văn gượng ép.
- source_word: πνευματικόν
  choice: thuộc linh
  rationale: Giữ sự đối xứng thuật ngữ của Phao-lô và không tự nó phủ nhận tính thân thể; ghi chú làm rõ đây không phải là “phi vật chất”.
- source_word: Εἰ
  choice: Nếu
  rationale: Bảo toàn hình thức điều kiện của nguyên văn, không chuyển thành một lời khẳng định giải thích.
- source_word: καὶ
  choice: cũng
  rationale: Thể hiện rõ quan hệ bổ sung trong mệnh đề thứ hai.
theological_decisions:
- issue: Ý nghĩa của sự tương phản giữa σῶμα ψυχικόν và σῶμα πνευματικόν
  choice: “thân thể tự nhiên” đối lập với “thân thể thuộc linh,” tức hai cách thân thể được đặc trưng bởi nguồn sự sống khác nhau
  alternative: “thân thể vật chất” đối lập với “thân thể phi vật chất,” hoặc “thân thể thuộc hồn” đối lập với “thân thể thuộc linh”
  rationale: Nguyên văn vẫn gọi cả hai là σῶμα, nên không nên biến sự tương phản thành vật chất đối lập với phi vật chất. Bản dịch giữ căng thẳng trong thuật ngữ của Phao-lô, còn chú thích ngăn cách hiểu sai.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng cấu trúc lược chủ ngữ “Gieo xuống ...; sống lại ...” để phản ánh hai động từ bị động của Hy Lạp mà vẫn tự nhiên trong tiếng Việt; “thuộc linh” được giữ vì tính chính xác thuật ngữ và được giải thích bằng chú thích.
