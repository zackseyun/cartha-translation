  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐν ἀτόμῳ, ἐν ῥιπῇ ὀφθαλμοῦ, ἐν τῇ ἐσχάτῃ σάλπιγγι· σαλπίσει γάρ, καὶ οἱ νεκροὶ ἐγερθήσονται ἄφθαρτοι, καὶ ἡμεῖς ἀλλαγησόμεθα.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/052.yaml
  text: in an instant[a], in the blink of an eye, at the last trumpet. For the trumpet will sound, and the dead will be raised imperishable, and we will be changed.
translation:
  language: vi
  text: trong khoảnh khắc[a], trong chớp mắt, vào lúc tiếng kèn cuối cùng. Vì kèn sẽ vang, người chết sẽ được làm cho sống lại, không hư nát, và chúng ta sẽ được biến đổi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Theo nghĩa đen: “trong điều không thể chia nhỏ”; thành ngữ này chỉ một thời gian cực ngắn, tức thời.'
    reason: Giải thích sắc thái từ nguyên của ἀτόμῳ mà không biến cách giải thích thành nội dung chính của bản dịch.
lexical_decisions:
- source_word: ἐν ἀτόμῳ
  choice: trong khoảnh khắc
  rationale: ἄτομος chỉ một điểm thời gian không thể chia nhỏ, tức một khoảng cực ngắn. “Trong khoảnh khắc” truyền đạt tự nhiên ý đột ngột và tức thời trong tiếng Việt hiện đại.
- source_word: ἐν ῥιπῇ ὀφθαλμοῦ
  choice: trong chớp mắt
  rationale: Thành ngữ Hy Lạp diễn tả sự việc xảy ra cực nhanh; “trong chớp mắt” là thành ngữ tiếng Việt tự nhiên và sát nghĩa.
- source_word: ἐν τῇ ἐσχάτῃ σάλπιγγι
  choice: khi tiếng kèn cuối cùng vang lên
  rationale: Cách dịch này thể hiện giá trị thời gian của ἐν trong ngữ cảnh và giữ nguyên hình ảnh cánh chung của “tiếng kèn cuối cùng” mà không gắn vào một hệ thống thời kỳ tận thế cụ thể.
- source_word: σαλπίσει
  choice: kèn sẽ vang
  rationale: Động từ có nghĩa là thổi kèn hoặc kèn vang lên. Danh từ σάλπιγξ ngay trước đó cung cấp chủ thể được hiểu ngầm, nên “kèn sẽ vang” vừa tự nhiên vừa bám sát ngữ cảnh.
- source_word: οἱ νεκροὶ
  choice: người chết
  rationale: Tính từ được danh từ hóa chỉ tập thể những người đã chết. “Người chết” là cách diễn đạt rõ ràng, thông dụng trong tiếng Việt.
- source_word: ἐγερθήσονται
  choice: sẽ được làm cho sống lại
  rationale: Thể bị động tương lai của ἐγείρω trong ngữ cảnh phục sinh. Cách dịch này giữ sắc thái bị động và nêu rõ nghĩa phục sinh.
- source_word: ἄφθαρτοι
  choice: không còn hư nát
  rationale: ἄφθαρτος nói đến tình trạng không chịu sự mục nát hoặc suy hoại. “Không còn hư nát” dễ hiểu và phù hợp với lập luận về thân thể phục sinh trong chương này.
- source_word: ἡμεῖς
  choice: chúng ta
  rationale: Đại từ được nêu rõ trong tiếng Hy Lạp để nhấn mạnh và đối chiếu với “người chết”; vì vậy cần được giữ lại, không diễn giải thêm là những người còn sống.
- source_word: ἀλλαγησόμεθα
  choice: sẽ được biến đổi
  rationale: Thể bị động tương lai của ἀλλάσσω có nghĩa là được thay đổi. “Sẽ được biến đổi” giữ được thể bị động và phù hợp tự nhiên với sự biến đổi thân thể trong văn mạch.
theological_decisions:
- issue: Cụm từ về tiếng kèn cuối cùng và các hệ thống cánh chung
  choice: khi tiếng kèn cuối cùng vang lên
  alternative: với tiếng kèn cuối cùng
  rationale: Bản văn xác định đây là tiếng kèn cuối cùng nhưng không trình bày tại đây một lịch trình cánh chung chi tiết. Cách dịch được chọn giữ nguyên hình ảnh và để ngỏ những vấn đề mà câu không giải quyết.
- issue: Ý nghĩa của “chúng ta” trong quan hệ với người chết sống lại
  choice: chúng ta sẽ được biến đổi
  alternative: những người trong chúng ta còn sống sẽ được biến đổi
  rationale: Giữ nguyên đại từ ngôi thứ nhất số nhiều của Phao-lô, không thêm lời giải thích mà riêng câu này không nêu rõ. Sự đối chiếu với “người chết” vẫn được bảo toàn.
- issue: Tác nhân làm cho người chết sống lại và biến đổi người sống
  choice: 'giữ thể bị động: “sẽ được làm cho sống lại” và “sẽ được biến đổi”'
  alternative: Đức Chúa Trời sẽ làm cho người chết sống lại và biến đổi chúng ta
  rationale: Ngữ pháp Hy Lạp dùng thể bị động nhưng không nêu tác nhân trong câu. Không thêm danh xưng tác nhân giúp bản dịch trung thành với hình thức và mức độ minh định của nguồn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ cấu trúc dồn dập gồm hai cụm chỉ tốc độ, đồng thời giữ sự lặp lại của hình ảnh tiếng kèn trong nguyên văn. Dấu [a] xuất hiện ngay sau cụm từ được chú thích.
