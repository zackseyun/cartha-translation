revisions:
- from: Thưa anh em[a], tôi xin nói rõ cho anh em biết Tin Lành mà tôi đã rao truyền cho anh em, là điều anh em cũng đã tiếp nhận và hiện đang đứng vững trong đó.
  to: 'Thưa anh em[a], tôi cho anh em biết tin mừng mà tôi đã công bố cho anh em, tin mừng mà anh em cũng đã tiếp nhận và đang đứng vững trong đó:'
  rationale: Bản sửa thay “xin nói rõ cho ... biết” bằng “cho ... biết” để phản ánh sát Γνωρίζω mà không thêm sắc thái thỉnh cầu hoặc giải thích. “Tin mừng” dịch trực tiếp εὐαγγέλιον; “công bố” dịch εὐηγγελισάμην. Dấu hai chấm giữ câu mở, vì mệnh đề quan hệ về tin mừng tiếp tục sang câu 2 trong nguyên văn. Chú thích về ἀδελφοί được giữ nguyên về nội dung và vị trí neo.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T18:13:31Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản thảo truyền đạt đúng các thành phần chính của câu: Phao-lô làm cho độc giả biết về tin mừng ông đã công bố, họ đã tiếp nhận, và họ đứng trong tin mừng ấy. Tuy nhiên, “xin nói rõ” thêm sắc thái lịch sự và ý làm sáng tỏ không được Γνωρίζω nêu rõ; “hiện đang” cũng diễn giải trạng thái hoàn thành mạnh hơn mức cần thiết.'
  naturalness: Câu hiện có thể hiểu tốt, nhưng “tôi xin nói rõ cho anh em biết” hơi dài và lặp ý trong tiếng Việt hiện đại. Cách diễn đạt sửa lại ngắn gọn, trang trọng, và giữ được nhịp xưng hô tự nhiên.
  terminology: “Tin Lành” là thuật ngữ quen thuộc, nhưng “tin mừng” phản ánh trực tiếp nghĩa minh bạch của εὐαγγέλιον và tránh biến danh từ thông thường thành một nhãn hiệu giáo phái. “Anh em” cùng chú thích vẫn bảo toàn hình thức giống đực của ἀδελφοί và phạm vi cộng đồng của lối xưng hô này.
  issues:
  - severity: medium
    issue: “xin nói rõ” diễn giải Γνωρίζω quá mức.
    rationale: Γνωρίζω có nghĩa cơ bản là “làm cho biết/thông báo”; nguyên văn không có từ tương ứng với “xin” hay “rõ.”
  - severity: low
    issue: “hiện đang” không cần thiết trong cách chuyển ἑστήκατε.
    rationale: Thể hoàn thành biểu thị trạng thái hiện tại, nhưng “đang đứng vững” đã diễn đạt tự nhiên trạng thái ấy mà không nhấn mạnh thêm sắc thái tiến hành.
  revised_text: 'Thưa anh em[a], tôi cho anh em biết tin mừng mà tôi đã công bố cho anh em, tin mừng mà anh em cũng đã tiếp nhận và đang đứng vững trong đó:'
