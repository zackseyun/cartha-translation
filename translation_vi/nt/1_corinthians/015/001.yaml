id: 1CO.15.1
reference: 1 Corinthians 15:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Γνωρίζω δὲ ὑμῖν, ἀδελφοί, τὸ εὐαγγέλιον ὃ εὐηγγελισάμην ὑμῖν, ὃ καὶ παρελάβετε, ἐν ᾧ καὶ ἑστήκατε,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/001.yaml
  text: I make known to you[a], brothers, the good news that I proclaimed to you, which you also received, in which you also stand,
translation:
  language: vi
  text: 'Thưa anh em[a], tôi cho anh em biết tin mừng mà tôi đã công bố cho anh em, tin mừng mà anh em cũng đã tiếp nhận và đang đứng vững trong đó:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể diễn đạt là “anh chị em.” Từ Hy Lạp viết là “anh em” và thường dùng hình thức giống đực để gọi toàn thể cộng đồng tín hữu, gồm cả nam lẫn nữ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Γνωρίζω
  choice: tôi xin nói rõ cho anh em biết
  rationale: Động từ hiện tại chủ động mang nghĩa trực tiếp là làm cho biết hoặc thông báo. Cách dịch này tự nhiên trong tiếng Việt và không đổi thành ý “nhắc lại,” dù trong ngữ cảnh Phao-lô đang trình bày lại điều họ đã biết.
- source_word: δὲ
  choice: không dịch thành một từ riêng
  rationale: δέ đánh dấu một chuyển ý nhẹ. Trật tự và cách mở câu tiếng Việt đã thể hiện sự chuyển đoạn; thêm “bây giờ” sẽ dễ tạo sắc thái thời gian không có trong nguyên văn.
- source_word: ἀδελφοί
  choice: anh em[a]
  rationale: Giữ hình thức xưng hô giống đực của nguyên văn và lối gọi quen thuộc, trang trọng trong tiếng Việt; chú thích cho biết từ này trong thư Phao-lô thường hướng đến toàn thể cộng đồng tín hữu, gồm cả nam lẫn nữ.
- source_word: τὸ εὐαγγέλιον
  choice: Tin Lành
  rationale: Diễn đạt tự nhiên và dễ hiểu trong tiếng Việt hiện đại, chỉ tin mừng được Phao-lô công bố; viết hoa để nhận diện nội dung sứ điệp trong ngữ cảnh Cơ Đốc.
- source_word: εὐηγγελισάμην
  choice: đã rao truyền
  rationale: Thể bất định chỉ hành động công bố đã diễn ra. “Rao truyền” tự nhiên hơn việc lặp gượng “rao Tin Lành” ngay sau danh từ và vẫn giữ nghĩa công bố rộng rãi.
- source_word: παρελάβετε
  choice: đã tiếp nhận
  rationale: παραλαμβάνω ở đây nói đến việc nhận lấy sứ điệp hoặc truyền thống; “tiếp nhận” giữ nghĩa rộng mà không nhấn quá mức vào một quyết định chủ quan.
- source_word: ἐν ᾧ
  choice: trong đó
  rationale: Giữ hình ảnh không gian của ἐν và nối trực tiếp với Tin Lành như phạm vi hoặc nền tảng họ đang đứng vững, thay vì dự báo ý “nhờ đó” của câu kế tiếp.
- source_word: ἑστήκατε
  choice: hiện đang đứng vững
  rationale: Thể hoàn thành diễn tả trạng thái hiện tại phát sinh từ hành động trước đó. “Hiện đang đứng vững” làm rõ trạng thái tiếp diễn mà không biến câu thành lời khuyên.
theological_decisions:
- issue: Phạm vi người được gọi bằng ἀδελφοί
  choice: Dùng “anh em” trong chính văn và thêm chú thích về phạm vi bao gồm cả cộng đồng.
  alternative: “Anh chị em” hoặc “các anh chị em trong đức tin.”
  rationale: Cách chọn giữ hình thức của nguyên văn nhưng không khiến độc giả hiểu rằng Phao-lô nhất thiết chỉ nói với nam giới.
- issue: Quan hệ của tín hữu với Tin Lành trong ἐν ᾧ καὶ ἑστήκατε
  choice: “hiện đang đứng vững trong đó.”
  alternative: “nhờ đó anh em đứng vững” hoặc “trên đó anh em đứng vững.”
  rationale: “Trong đó” phản ánh trực tiếp ἐν ᾧ và bảo tồn khả năng hiểu Tin Lành là phạm vi hoặc nền tảng của trạng thái đứng vững, không đồng nhất trước với mệnh đề về sự cứu rỗi ở câu 2.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu được sắp lại để lời xưng hô “Thưa anh em” tự nhiên trong tiếng Việt. “Tôi xin nói rõ ... biết” chuyển tải Γνωρίζω mà không áp đặt nghĩa “nhắc lại.” Dùng dấu chấm kết câu theo quy ước tiếng Việt dù đây là phần mở đầu của một câu dài hơn trong ngữ cảnh Hy Lạp.
