reference: 1 Corinthians 15:31
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καθ’ ἡμέραν ἀποθνῄσκω, νὴ τὴν ὑμετέραν ⸀καύχησιν, ἣν ἔχω ἐν Χριστῷ Ἰησοῦ τῷ κυρίῳ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/031.yaml
  text: I die every day—by the boasting in you that I have in Messiah Jesus our Lord[a][b][c].
translation:
  language: vi
  text: Mỗi ngày tôi đều chết[a]—tôi lấy niềm hãnh diện về anh chị em mà tôi có[b] trong Đấng Mê-si-a Giê-su[c], Chúa chúng ta, để quả quyết điều đó.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát nghĩa hơn: “hằng ngày tôi chết.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cụm từ Hy Lạp mang tính chất một lời thề hoặc lời xác quyết; cũng có thể dịch: “điều ấy chắc chắn như niềm hãnh diện mà tôi có về anh chị em” hoặc “tôi thề bởi niềm hãnh diện...”. Cụm từ chỉ sự hãnh diện cũng có thể được hiểu là “sự khoe mình của anh chị em” hoặc “niềm hãnh diện tôi đặt nơi anh chị em.”'
    reason: alternative_reading
  - marker: c
    text: 'Cách dịch truyền thống: “trong Đấng Christ Giê-su.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθ’ ἡμέραν
  choice: mỗi ngày… đều
  rationale: Diễn đạt tự nhiên trong tiếng Việt ý lặp lại “mỗi ngày, hằng ngày” của thành ngữ Hy Lạp, đồng thời giữ sắc thái nhấn mạnh.
- source_word: ἀποθνῄσκω
  choice: tôi… chết
  rationale: Giữ nguyên hình ảnh tu từ mạnh và thì hiện tại của Phao-lô; “tôi đối diện với cái chết” tuy có thể diễn giải đúng ý nhưng giải thích nhiều hơn nguyên văn.
- source_word: νὴ
  choice: tôi quả quyết điều ấy bởi
  rationale: νὴ là tiểu từ dùng trong lời xác quyết mang tính thề nguyện. Cách dịch này truyền đạt chức năng của nó bằng tiếng Việt hiện đại mà không biến câu thành một lời thề có công thức xa lạ.
- source_word: τὴν ὑμετέραν καύχησιν
  choice: niềm hãnh diện về anh chị em
  rationale: καύχησις có thể chỉ sự khoe mình, niềm hãnh diện hoặc lý do để hãnh diện. Mệnh đề quan hệ “mà tôi có” nghiêng về niềm hãnh diện của Phao-lô liên quan đến người Cô-rinh-tô. “Hãnh diện” tự nhiên hơn “khoe mình” trong công thức xác quyết này, còn sự mơ hồ cú pháp được ghi ở chú thích.
- source_word: ἣν ἔχω
  choice: mà tôi có
  rationale: Bản dịch trực tiếp, tự nhiên của mệnh đề quan hệ, với đại từ quan hệ quy chiếu về niềm hãnh diện.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: trong Đấng Mê-si-a Giê-su
  rationale: Giữ giới từ “trong”, vốn quan trọng trong ngôn ngữ thần học của Phao-lô, và dịch Χριστός theo nghĩa tước hiệu là “Đấng Mê-si-a”.
- source_word: τῷ κυρίῳ ἡμῶν
  choice: Chúa chúng ta
  rationale: Cách dịch trang trọng, tự nhiên của tước hiệu κύριος cùng đại từ sở hữu ἡμῶν.
theological_decisions:
- issue: Χριστός được hiểu là tước hiệu hay dạng gần như tên riêng
  choice: Đấng Mê-si-a Giê-su
  alternative: Đấng Christ Giê-su / Chúa Cứu Thế Giê-su
  rationale: Cụm từ vẫn có sức nặng của một tước hiệu trong cách dùng của Phao-lô. “Đấng Mê-si-a” làm rõ tước hiệu mà không gắn thêm cách giải thích hệ phái; cách dịch truyền thống được bảo lưu trong chú thích.
- issue: Chủ thể và đối tượng của καύχησις với ὑμετέραν
  choice: niềm hãnh diện của Phao-lô về các tín hữu Cô-rinh-tô
  alternative: sự khoe mình của chính người Cô-rinh-tô / niềm hãnh diện đặt nơi họ
  rationale: Mệnh đề “mà tôi có” ủng hộ cách hiểu đây là điều Phao-lô có liên quan đến họ. Tuy nhiên, cấu trúc Hy Lạp có thể được hiểu theo hơn một cách, nên không loại bỏ các cách đọc khác mà ghi rõ trong chú thích.
- issue: Mối liên hệ giữa lời xác quyết và niềm hãnh diện
  choice: diễn đạt νὴ như lời quả quyết được bảo chứng bởi niềm hãnh diện
  alternative: “điều ấy chắc chắn như niềm hãnh diện…”
  rationale: νὴ với đối cách tạo một công thức xác quyết gần với lời thề. Bản chính giữ mối liên hệ “bởi” nhưng dùng cấu trúc tiếng Việt dễ hiểu; chú thích bảo lưu lối đọc so sánh thường được dùng để chuyển nghĩa công thức này.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. “Anh chị em” truyền đạt số nhiều ὑμετέραν theo lối xưng hô cộng đồng tự nhiên trong tiếng Việt. Dấu gạch ngang giữ nhịp chuyển mạnh từ lời tuyên bố sang lời xác quyết. Các chú thích bảo lưu độ sát chữ, tính chất thề nguyện và sự mơ hồ cú pháp của nguyên văn.
