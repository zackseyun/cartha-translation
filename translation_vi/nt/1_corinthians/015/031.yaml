    rationale: Giới từ “bởi” thường biểu thị nguyên nhân hoặc căn cứ trong tiếng Việt. Nguyên văn dùng νὴ với đối cách theo công thức thề/xác quyết; cần một cấu trúc cho thấy Phao-lô lấy “niềm hãnh diện” làm điều bảo chứng cho lời khẳng định.
