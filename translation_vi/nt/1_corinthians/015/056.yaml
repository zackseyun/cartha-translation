base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/056.yaml
  text: The sting of death is sin[b][a], and the power of sin is the law.
translation:
  language: vi
  text: Ngòi chích của sự chết là tội lỗi, còn sức mạnh[a] của tội lỗi là luật pháp[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch là “quyền lực”: “quyền lực của tội lỗi là luật pháp.”'
    reason: lexical_alternative
  - marker: b
    text: “Luật pháp” ở đây có lẽ đặc biệt chỉ luật Môi-se trong lập luận của Phao-lô, dù cách diễn đạt cũng cho phép hiểu rộng hơn về vai trò của luật pháp trong việc phơi bày và làm tội lỗi gia tăng.
    reason: alternative_reading
lexical_decisions:
- source_word: κέντρον
  choice: nọc độc
  rationale: Danh từ này có thể chỉ mũi nhọn, ngòi chích hoặc gậy thúc. Trong hình ảnh sự chết gây hại, “nọc độc” diễn đạt tự nhiên tác nhân gây chết người mà sự chết dùng, đồng thời nối với lời thách thức về “nọc” ở câu trước.
- source_word: θανάτου
  choice: của sự chết
  rationale: 'Giữ quan hệ sở hữu/liên hệ của sở hữu cách: nọc độc thuộc về sự chết.'
- source_word: ἁμαρτία
  choice: tội lỗi
  rationale: Giữ dạng số ít và sắc thái Phao-lô nói về tội lỗi như một quyền lực hoặc nguyên lý, không chỉ về từng hành vi phạm tội.
- source_word: δύναμις
  choice: sức mạnh
  rationale: “Sức mạnh” là cách nói tự nhiên, dễ hiểu về năng lực khiến tội lỗi phát huy tác động; “quyền lực” cũng có thể dùng nhưng dễ gợi đến thẩm quyền cai trị.
- source_word: νόμος
  choice: luật pháp
  rationale: Cách dịch này giữ được khả năng ám chỉ đặc biệt đến luật Môi-se trong lập luận của Phao-lô, nhưng không thu hẹp câu chỉ còn một cách hiểu.
- source_word: δὲ
  choice: còn
  rationale: Hai lần δέ tổ chức và đối chiếu nhẹ hai vế giải thích. Tiếng Việt không cần thêm một từ nối ở đầu câu; “còn” thể hiện tự nhiên quan hệ ở vế thứ hai.
theological_decisions:
- issue: “Luật pháp” là sức mạnh của tội lỗi theo nghĩa nào
  choice: Dịch là “luật pháp” và không thêm “Môi-se” vào chính văn.
  alternative: Dịch rõ là “Luật Môi-se”, hoặc hiểu rộng hơn như luật nói chung.
  rationale: Trong lập luận của Phao-lô, luật Môi-se rất có thể được đặc biệt nhắm đến; tuy nhiên, nguyên văn νόμος không tự nó buộc phải ghi rõ tên ấy. Cách dịch giữ nguyên độ mở và sự căng thẳng thần học của câu.
- issue: Sắc thái của δύναμις
  choice: Dùng “sức mạnh”.
  alternative: “Quyền lực” hoặc “quyền năng”.
  rationale: “Sức mạnh” diễn đạt khả năng làm cho tội lỗi có tác động mà không ngầm xác định luật pháp là xấu hay là nguồn gốc của tội lỗi.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Nọc độc” duy trì hình ảnh sinh động của κέντρον; “còn” tạo thế cân xứng giữa hai mệnh đề. Không thêm từ chuyển ý tương đương “bây giờ/vả” vì nguyên văn không có trạng từ thời gian.
