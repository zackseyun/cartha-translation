revisions:
- from: Nọc độc của sự chết là tội lỗi, còn sức mạnh[a] của tội lỗi là luật pháp[b].
  to: Ngòi chích của sự chết là tội lỗi, còn sức mạnh[a] của tội lỗi là luật pháp[b].
  rationale: Chỉ thay “nọc độc” bằng “ngòi chích” để dịch sát κέντρον là cái ngòi/sự chích gây thương tổn, thay vì chất độc. Giữ nguyên cấu trúc, các thuật ngữ thần học, và các chú thích vì chúng bảo tồn độ mở của nguyên văn.
