id: 1CO.15.6
reference: 1 Corinthians 15:6
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἔπειτα ὤφθη ἐπάνω πεντακοσίοις ἀδελφοῖς ἐφάπαξ, ἐξ ὧν οἱ ⸀πλείονες μένουσιν ἕως ἄρτι, τινὲς ⸀δὲ ἐκοιμήθησαν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/006.yaml
  text: Then he appeared to more than five hundred brothers at one time[a], most of whom remain until now[b], though some have fallen asleep.
translation:
  language: vi
  text: Sau đó, Ngài đã hiện ra với hơn năm trăm anh em cùng một lúc[a], phần đông trong số ấy vẫn còn sống cho đến nay, nhưng một số đã an giấc[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể hiểu là “anh chị em”; tiếng Hy Lạp viết “anh em”, nhưng trong cách dùng của cộng đồng Cơ Đốc ban đầu, từ này đôi khi có thể chỉ cộng đồng tín hữu rộng hơn.
    reason: lexical_alternative
  - marker: b
    text: Tức là đã qua đời. Phao-lô dùng hình ảnh “an giấc”, một cách nói quen thuộc của các Cơ Đốc nhân ban đầu về cái chết trong ánh sáng của niềm hy vọng phục sinh.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔπειτα
  choice: Sau đó
  rationale: Đánh dấu bước tiếp theo trong chuỗi các lần Đấng Christ hiện ra; tự nhiên và rõ ràng trong tiếng Việt.
- source_word: ὤφθη
  choice: Ngài hiện ra
  rationale: Trong các trình thuật phục sinh, dạng này thường diễn tả việc một người hiện ra. Đại từ “Ngài” có chủ thể được hiểu là Đấng Christ từ ngữ cảnh trước.
- source_word: ἐπάνω πεντακοσίοις
  choice: cho hơn năm trăm
  rationale: ἐπάνω đi với số từ mang nghĩa “hơn”; “cho” diễn đạt tự nhiên đối tượng được Ngài hiện ra.
- source_word: ἀδελφοῖς
  choice: anh em
  rationale: Giữ hình thức giống đực số nhiều của nguyên bản; trong cách dùng Cơ Đốc giáo ban đầu, từ này đôi khi có thể chỉ cộng đồng tín hữu rộng hơn.
- source_word: ἐφάπαξ
  choice: cùng lúc
  rationale: Ở đây nhấn mạnh rằng hơn năm trăm người cùng chứng kiến trong một dịp, chứ không chỉ nói sự việc xảy ra một lần.
- source_word: ἐξ ὧν οἱ πλείονες
  choice: phần đông trong số ấy
  rationale: Diễn đạt tự nhiên quan hệ bộ phận và ý nghĩa “đa số” của οἱ πλείονες.
- source_word: μένουσιν ἕως ἄρτι
  choice: vẫn còn sống cho đến nay
  rationale: μένω có nghĩa cơ bản là “còn lại/tiếp tục ở”; trong thế đối lập với những người đã an giấc, ý nghĩa là họ vẫn còn sống. Cách dịch này làm rõ hàm ý ngữ cảnh mà không thay đổi nội dung.
- source_word: τινὲς δὲ
  choice: nhưng một số
  rationale: δέ biểu thị sự tương phản nhẹ giữa phần đông còn sống và một số đã qua đời.
- source_word: ἐκοιμήθησαν
  choice: đã an giấc
  rationale: Giữ hình ảnh giấc ngủ dùng để nói về cái chết trong bối cảnh niềm hy vọng phục sinh; “an giấc” là cách nói trang trọng, tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Cách dịch ἀδελφοῖς khi nhóm được nói đến có thể gồm cả nam lẫn nữ
  choice: anh em
  alternative: anh chị em
  rationale: Nguyên bản dùng danh từ giống đực số nhiều. Bản chính giữ hình thức ấy, còn chú thích nêu khả năng từ này được dùng rộng hơn để chỉ cộng đồng tín hữu.
- issue: Cách dịch ἐκοιμήθησαν trong bối cảnh phục sinh
  choice: đã an giấc
  alternative: đã qua đời
  rationale: Hình ảnh giấc ngủ có ý nghĩa trong lập luận về sự phục sinh ở 1 Cô-rinh-tô 15; giữ hình ảnh tránh làm phẳng cách diễn đạt của Phao-lô.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “Ngài” theo ngữ cảnh chỉ Đấng Christ; “cùng lúc” làm rõ tính đồng thời; “an giấc” giữ ẩn dụ của nguyên bản.
