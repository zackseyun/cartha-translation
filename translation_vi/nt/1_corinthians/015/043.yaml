  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: σπείρεται ἐν ἀτιμίᾳ, ἐγείρεται ἐν δόξῃ· σπείρεται ἐν ἀσθενείᾳ, ἐγείρεται ἐν δυνάμει·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/043.yaml
  text: It is sown in dishonor; it is raised in glory. It is sown in weakness; it is raised in power.
translation:
  language: vi
  text: Được gieo trong nhục nhã, được sống lại trong vinh quang; được gieo trong yếu đuối, được sống lại trong quyền năng.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σπείρεται
  choice: được gieo
  rationale: Giữ thể bị động và hình ảnh gieo hạt mà Phao-lô dùng cho thân thể trong văn cảnh liền trước; không thêm chủ thể vốn được hiểu ngầm.
- source_word: ἀτιμίᾳ
  choice: nhục nhã
  rationale: Diễn đạt tình trạng thiếu danh dự và giữ thế đối lập rõ với “vinh quang”, nhưng không thu hẹp nghĩa vào cảm xúc xấu hổ.
- source_word: ἐγείρεται
  choice: được sống lại
  rationale: Trong văn cảnh sự sống lại của thân thể, cách dịch này tự nhiên và rõ nghĩa trong tiếng Việt, đồng thời giữ thể bị động và không nói rõ Đức Chúa Trời là tác nhân.
- source_word: δόξῃ
  choice: vinh quang
  rationale: Là cách dịch quen thuộc, trang trọng của δόξα, phù hợp với văn cảnh phục sinh và thế đối lập với ἀτιμία.
- source_word: ἀσθενείᾳ
  choice: yếu đuối
  rationale: Giữ nghĩa rộng của sự yếu đuối, bao gồm sự mong manh của thân thể, và đối xứng tự nhiên với “quyền năng”.
- source_word: δυνάμει
  choice: quyền năng
  rationale: Phản ánh δύναμις theo cách dùng phổ biến của Phao-lô và không giới hạn ý nghĩa vào sức mạnh thể chất.
theological_decisions:
- issue: Thể và tác nhân trong ngôn ngữ phục sinh
  choice: Dùng thể bị động “được sống lại” mà không nêu tác nhân.
  alternative: Đức Chúa Trời làm cho sống lại.
  rationale: Bản Hy Lạp dùng thể bị động; giữ cách diễn đạt ấy bảo toàn tác nhân thần linh được hàm ý nhưng không được nói ra.
- issue: Chủ thể được hiểu ngầm
  choice: Không lặp lại “thân thể” trong từng vế.
  alternative: Thân thể được gieo… thân thể được sống lại…
  rationale: Động từ Hy Lạp không nêu chủ thể, còn văn cảnh đã xác định đó là thân thể. Tiếng Việt cho phép lược chủ thể, nhờ đó giữ nhịp song hành cô đọng.
- issue: Sắc thái của ἐγείρεται
  choice: Dịch theo nghĩa phục sinh là “được sống lại”.
  alternative: Được dựng dậy; trỗi dậy.
  rationale: “Được sống lại” truyền đạt rõ nghĩa trong văn cảnh mà không biến thể bị động thành chủ động; tuy vậy, từ Hy Lạp cũng mang hình ảnh được đánh thức hoặc dựng dậy.
translation_notes:
  register: Văn phong hiện đại, trang trọng và cô đọng. Giữ hai cặp đối lập cân xứng cùng nhịp điệu lặp lại của nguyên văn; dấu chấm phẩy phân cách hai cặp tương phản.
