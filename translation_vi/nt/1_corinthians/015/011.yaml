reference: 1 Corinthians 15:11
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἴτε οὖν ἐγὼ εἴτε ἐκεῖνοι, οὕτως κηρύσσομεν καὶ οὕτως ἐπιστεύσατε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/011.yaml
  text: Whether then it was I or they[a], so we proclaim and so you believed.
translation:
  language: vi
  text: Vậy, dù là tôi hay là họ, chúng tôi đều rao giảng như thế, và anh chị em đã tin như thế.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἴτε ... εἴτε
  choice: dù ... hay
  rationale: Diễn đạt tự nhiên cấu trúc tương liên nêu hai khả năng, đồng thời giữ nguyên thế đối chiếu giữa Phao-lô và các sứ đồ khác.
- source_word: οὖν
  choice: vậy
  rationale: Đánh dấu kết luận rút ra từ phần trình bày trước về các nhân chứng của sự sống lại; “vậy” vừa rõ nghĩa suy luận vừa tự nhiên trong tiếng Việt.
- source_word: ἐγὼ ... ἐκεῖνοι
  choice: tôi ... họ
  rationale: Giữ trực tiếp sự đối chiếu giữa Phao-lô và những người đã được nhắc đến trước đó, tức các sứ đồ hay nhân chứng khác.
- source_word: οὕτως ... οὕτως
  choice: như thế ... như thế
  rationale: Giữ sự lặp lại có chủ ý trong nguyên văn, liên kết cùng một sứ điệp vừa được tóm lược với cả việc rao giảng lẫn việc người Cô-rinh-tô tin.
- source_word: κηρύσσομεν
  choice: chúng tôi đều rao giảng
  rationale: “Rao giảng” diễn đạt hành động công bố công khai; “đều” làm rõ rằng bất kể người rao giảng là Phao-lô hay các sứ đồ khác, lời công bố vẫn thống nhất, nhưng không thêm một đối tượng hay nội dung ngoài văn cảnh.
- source_word: ἐπιστεύσατε
  choice: anh chị em đã tin
  rationale: Thể hiện hành động tin trong quá khứ của cộng đồng Cô-rinh-tô. “Anh chị em” là cách xưng hô số nhiều tự nhiên, bao gồm cả nam lẫn nữ.
theological_decisions:
- issue: Phạm vi thống nhất trong lời rao giảng của các sứ đồ
  choice: Câu này nói rằng dù người rao giảng là Phao-lô hay các sứ đồ khác, họ rao giảng cùng sứ điệp vừa được trình bày, và người Cô-rinh-tô đã tin sứ điệp ấy.
  alternative: 'Có thể hiểu οὕτως thiên về cách thức: “chúng tôi rao giảng theo cách ấy, và anh chị em đã tin theo cách ấy.”'
  rationale: Giữ nguyên tính khái quát của οὕτως và sự song song trong câu, không mở rộng thành một khẳng định giáo hội học vượt quá điều bản văn nói.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Giữ cấu trúc ngắn gọn cùng sự lặp lại “như thế ... như thế” của nguyên văn. Không dùng chú thích vì bản dịch chính đã bảo toàn được khả năng οὕτως chỉ nội dung hoặc cách thức.
