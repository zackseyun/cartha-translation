id: 1CO.15.23
reference: 1 Corinthians 15:23
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἕκαστος δὲ ἐν τῷ ἰδίῳ τάγματι· ἀπαρχὴ Χριστός, ἔπειτα οἱ τοῦ Χριστοῦ ἐν τῇ παρουσίᾳ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/023.yaml
  text: 'But each in his own order: Messiah the firstfruits[b][a], then those who belong to Messiah at his coming.'
translation:
  language: vi
  text: 'Nhưng mỗi người theo thứ tự riêng của mình: Đấng Mê-si là trái đầu mùa, rồi đến những người thuộc về Đấng Mê-si khi Ngài quang lâm.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Quang lâm” dịch từ παρουσία, cũng có thể dịch là “sự đến” hoặc “sự hiện diện”; trong văn cảnh này, từ ấy chỉ lần Đấng Mê-si đến trong tương lai.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕκαστος
  choice: mỗi người
  rationale: Diễn đạt ý phân phối của ἕκαστος, chỉ từng người trong trình tự sống lại được nói đến ở văn cảnh trước.
- source_word: ἐν τῷ ἰδίῳ τάγματι
  choice: theo thứ tự riêng của mình
  rationale: τάγμα có thể chỉ thứ tự, hàng ngũ hoặc sự sắp đặt. Trong văn cảnh này, trọng tâm là trình tự sống lại; cách dịch này giữ được ý mỗi người ở vị trí đã định mà không làm hình ảnh mang tính quân sự quá mức.
- source_word: ἀπαρχὴ
  choice: trái đầu mùa
  rationale: Giữ hình ảnh nông nghiệp và sắc thái dâng hiến của phần thu hoạch đầu tiên, đồng thời hàm ý phần thu hoạch tiếp theo sẽ đến.
- source_word: Χριστός
  choice: Đấng Mê-si
  rationale: Ở đây Χριστός nổi bật như một tước hiệu trong sự đối chiếu giữa Đấng Mê-si và những người thuộc về Ngài; “Đấng Mê-si” truyền đạt nghĩa “Đấng Được Xức Dầu” tự nhiên trong tiếng Việt.
- source_word: οἱ τοῦ Χριστοῦ
  choice: những người thuộc về Đấng Mê-si
  rationale: Diễn đạt rõ quan hệ thuộc về được biểu thị bằng sở hữu cách, không thêm nội dung giáo lý ngoài nguyên văn.
- source_word: ἐν τῇ παρουσίᾳ αὐτοῦ
  choice: khi Ngài quang lâm
  rationale: παρουσία có nghĩa cơ bản là sự hiện diện hoặc việc đến; trong ngữ cảnh cánh chung này, “quang lâm” là cách diễn đạt trang trọng, quen thuộc về lần Ngài đến trong tương lai.
theological_decisions:
- issue: Cách dịch Χριστός khi từ này mang chức năng tước hiệu
  choice: Đấng Mê-si
  alternative: Đấng Christ
  rationale: Cấu trúc đặt Đấng Mê-si làm “trái đầu mùa” rồi nói đến những người thuộc về Ngài khiến sắc thái tước hiệu nổi bật. Lựa chọn này không biến tước hiệu thành tên riêng.
- issue: Cách thể hiện παρουσία trong ngữ cảnh cánh chung
  choice: quang lâm
  alternative: đến; hiện diện
  rationale: Văn cảnh nói đến biến cố tương lai gắn với sự sống lại của những người thuộc về Đấng Mê-si. “Quang lâm” truyền đạt rõ biến cố ấy, còn chú thích bảo lưu phạm vi nghĩa “đến” và “hiện diện” của từ Hy Lạp.
- issue: Quan hệ giữa Đấng Mê-si và “trái đầu mùa”
  choice: Đấng Mê-si là trái đầu mùa
  alternative: Đấng Mê-si như trái đầu mùa
  rationale: Nguyên văn là một cấu trúc đồng vị cô đọng, không có từ tương đương với “như”. Thêm “là” giúp câu tiếng Việt tự nhiên mà không làm yếu sự đồng nhất mang tính hình ảnh.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đấng Mê-si” nhất quán cho Χριστός trong câu này; “trái đầu mùa” bảo tồn hình ảnh Kinh Thánh. Đại từ “Ngài” giúp quy chiếu rõ về Đấng Mê-si.
