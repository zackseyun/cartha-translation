  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng trình tự εἶτα, tên Κηφᾷ theo dạng phiên âm, và danh xưng tập thể τοῖς δώδεκα. Tuy nhiên, καὶ ὅτι tiếp tục mệnh đề nội dung của truyền thống ở các câu trước; thêm “rằng” là một hiệu chỉnh an toàn để phản ánh đầy đủ cấu trúc này. “Đã hiện ra” là cách dịch thành ngữ phù hợp cho ὤφθη trong ngữ cảnh này, đồng thời chú thích giữ lựa chọn sát hình thức thụ động.
