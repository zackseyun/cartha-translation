  text: and that he appeared to Cephas[c][b][a], then to the twelve.
translation:
  language: vi
  text: và rằng Ngài đã hiện ra[a] với Kê-pha[b], rồi với Nhóm Mười Hai[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Ngài đã được Kê-pha nhìn thấy.” Động từ Hy Lạp có hình thức thụ động, nhưng trong các ngữ cảnh về sự hiện ra sau khi sống lại, từ này thường được dịch là “hiện ra.”'
    reason: lexical_alternative
  - marker: b
    text: Kê-pha là tên A-ram tương ứng với Phi-e-rơ.
    reason: cross_reference
  - marker: c
    text: “Nhóm Mười Hai” là danh xưng đã được xác lập cho nhóm sứ đồ của Chúa Giê-su, dù không phải lúc nào nhóm cũng có đúng mười hai người.
    reason: cultural_note
lexical_decisions:
- source_word: καὶ ὅτι
  choice: và
  rationale: Tiếp nối chuỗi mệnh đề nội dung trong các câu 3–4. Trong tiếng Việt, lặp lại “rằng” ở đây không cần thiết và kém tự nhiên, còn “và” vẫn giữ rõ mạch liệt kê.
- source_word: ὤφθη
  choice: đã hiện ra với
  rationale: Động từ aorist thụ động của ὁράω thường mang nghĩa “hiện ra” trong các trình thuật về sự phục sinh. Cách dịch này tự nhiên trong tiếng Việt và không xác định thêm thể thức của lần hiện thấy.
- source_word: Κηφᾷ
  choice: Kê-pha
  rationale: Phiên âm tên riêng Κηφᾶς theo dạng xuất hiện trong bản Hy Lạp, thay vì đồng nhất ngay trong chính văn với tên quen thuộc hơn là Phi-e-rơ.
- source_word: εἶτα
  choice: rồi
  rationale: Diễn tả trình tự trong truyền thống Phao-lô đang thuật lại; “rồi” ngắn gọn và tự nhiên trong câu.
- source_word: τοῖς δώδεκα
  choice: Nhóm Mười Hai
  rationale: Giữ nguyên danh xưng tập thể truyền thống dành cho nhóm sứ đồ thân cận của Chúa Giê-su, thay vì đổi thành “mười một người” hoặc diễn giải là “các sứ đồ”.
theological_decisions:
- issue: Ngôn ngữ về sự hiện ra sau khi phục sinh
  choice: Ngài đã hiện ra với
  alternative: Ngài đã được Kê-pha nhìn thấy
  rationale: Bản Hy Lạp dùng hình thức thụ động nhưng trong ngữ cảnh hiện ra sau phục sinh thường được hiểu theo nghĩa thành ngữ là “hiện ra”. Cách dịch chính không nói thêm sự hiện ra diễn ra bằng phương thức nào; chú thích bảo tồn hình thức thay thế sát ngữ pháp hơn.
- issue: Danh xưng “Nhóm Mười Hai” dù Giu-đa vắng mặt
  choice: Nhóm Mười Hai
  alternative: Nhóm Mười Một; các sứ đồ
  rationale: τοῖς δώδεκα là danh xưng đã được xác lập cho tập thể sứ đồ. Giữ nguyên danh xưng tránh việc hòa hợp câu này với những tường thuật khác hoặc âm thầm sửa con số theo một tái dựng lịch sử.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “Ngài” để chỉ Chúa Giê-su theo mạch văn; viết hoa “Nhóm Mười Hai” để giúp người đọc nhận ra đây là danh xưng tập thể, không chỉ là con số thống kê. Các dấu chú thích được đặt ngay sau thành phần liên quan.
