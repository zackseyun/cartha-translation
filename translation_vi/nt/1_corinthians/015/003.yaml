id: 1CO.15.3
reference: 1 Corinthians 15:3
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Παρέδωκα γὰρ ὑμῖν ἐν πρώτοις, ὃ καὶ παρέλαβον, ὅτι Χριστὸς ἀπέθανεν ὑπὲρ τῶν ἁμαρτιῶν ἡμῶν κατὰ τὰς γραφάς,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/003.yaml
  text: 'For I delivered to you as of first importance what I also received: that Messiah died for our sins according to the Scriptures[b][a],'
translation:
  language: vi
  text: 'Vì tôi đã truyền lại cho anh chị em, như điều quan trọng hàng đầu, điều mà chính tôi cũng đã tiếp nhận: Đấng Mê-si[a] đã chết vì tội lỗi của chúng ta, theo Kinh Thánh[b],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “Đấng Christ”. Tước hiệu Hy Lạp Χριστός có nghĩa là “Đấng Mê-si”, tức Đấng được xức dầu.
    reason: alternative_reading
  - marker: b
    text: Cũng có thể dịch “phù hợp với Kinh Thánh”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Παρέδωκα
  choice: tôi đã truyền lại
  rationale: Động từ chỉ việc chuyển giao giáo huấn hoặc truyền thống đã được tiếp nhận; “truyền lại” tự nhiên trong tiếng Việt và giữ được ý về sự truyền đạt có thẩm quyền.
- source_word: γὰρ
  choice: Vì
  rationale: Liên từ mở đầu lời giải thích cho phát biểu trước đó; “Vì” giữ rõ chức năng nối kết.
- source_word: ἐν πρώτοις
  choice: điều quan trọng hàng đầu
  rationale: Trong ngữ cảnh này, cụm từ tự nhiên nhất là nói đến mức độ ưu tiên về tầm quan trọng, dù nguyên ngữ cũng có thể gợi thứ tự trước sau.
- source_word: ὃ καὶ παρέλαβον
  choice: cũng chính là điều tôi đã tiếp nhận
  rationale: Giữ sự song song giữa điều Phao-lô tiếp nhận và điều ông truyền lại, đồng thời diễn đạt tự nhiên bằng tiếng Việt.
- source_word: Χριστὸς
  choice: Đấng Mê-si
  rationale: Tại đây Χριστός mang sắc thái tước hiệu nổi bật trong bản tóm lược tuyên tín; “Đấng Mê-si” bảo tồn bối cảnh Do Thái và ý nghĩa của tước hiệu.
- source_word: ἀπέθανεν
  choice: đã chết
  rationale: Thì aorist trình bày một biến cố đã xảy ra; “đã chết” là cách diễn đạt tiếng Việt rõ ràng và tự nhiên.
- source_word: ὑπὲρ τῶν ἁμαρτιῶν ἡμῶν
  choice: vì tội lỗi của chúng ta
  rationale: Cách dịch này giữ lời khẳng định cứu chuộc của câu nhưng không áp đặt một mô hình chuộc tội cụ thể hơn điều nguyên ngữ nói.
- source_word: κατὰ τὰς γραφάς
  choice: theo lời Kinh Thánh
  rationale: κατά diễn tả sự phù hợp hoặc tương ứng với Kinh Thánh; cách dịch này trang trọng, dễ hiểu và tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Cách dịch Χριστός
  choice: Đấng Mê-si
  alternative: Đấng Christ
  rationale: Trong bản tóm lược tuyên tín này, từ ngữ vẫn có chức năng tước hiệu rõ rệt. Bản dịch chính dùng “Đấng Mê-si”, còn chú thích bảo tồn cách gọi quen thuộc “Đấng Christ”.
- issue: Ý nghĩa của ὑπὲρ τῶν ἁμαρτιῶν ἡμῶν
  choice: vì tội lỗi của chúng ta
  alternative: thay cho chúng ta vì tội lỗi của chúng ta
  rationale: Nguyên ngữ khẳng định cái chết của Đấng Mê-si có liên hệ cứu chuộc với tội lỗi chúng ta nhưng không tự nó xác định đầy đủ một lý thuyết chuộc tội; cách dịch chính giữ nguyên độ rộng thần học ấy.
- issue: Quan hệ của κατὰ τὰς γραφάς
  choice: theo lời Kinh Thánh
  alternative: phù hợp với Kinh Thánh
  rationale: Cả hai đều có thể diễn tả sự tương ứng với Kinh Thánh. Bản chính dùng cách nói cô đọng, truyền thống và dễ hiểu, không xác định câu Kinh Thánh cụ thể nào.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng “anh chị em” để diễn đạt số nhiều ὑμῖν theo lối bao quát tự nhiên; giữ cấu trúc truyền lại–tiếp nhận của nguyên văn và sắc thái tuyên tín của mệnh đề cuối.
