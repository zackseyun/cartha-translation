reference: 1 Corinthians 15:45
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οὕτως καὶ γέγραπται· Ἐγένετο ὁ πρῶτος ἄνθρωπος Ἀδὰμ εἰς ψυχὴν ζῶσαν· ὁ ἔσχατος Ἀδὰμ εἰς πνεῦμα ζῳοποιοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/045.yaml
  text: 'So also it is written: “The first man[a], Adam, became a living being”[b]; the last Adam became a life-giving spirit.'
translation:
  language: vi
  text: 'Cũng vậy, có chép rằng: “Con người đầu tiên, A-đam, đã trở nên một sinh thể sống”[a]; còn A-đam cuối cùng đã trở nên một linh thể ban sự sống[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “một linh hồn sống”, theo cách dịch truyền thống của Sáng Thế Ký 2:7.
    reason: lexical_alternative
  - marker: b
    text: Hoặc “một linh thể đem lại sự sống”. Cụm từ mô tả A-đam cuối cùng trong thế tương phản với A-đam đầu tiên; tiếng Hy Lạp mang tính định tính và không nhất thiết trực tiếp đồng nhất Đấng Christ với Đức Thánh Linh như một ngôi vị riêng biệt.
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως καὶ γέγραπται
  choice: Cũng vậy, có lời chép rằng
  rationale: Giữ mối liên kết suy luận với lập luận trước đó, đồng thời dùng công thức dẫn Kinh Thánh tự nhiên và trang trọng trong tiếng Việt.
- source_word: Ἐγένετο
  choice: đã trở nên
  rationale: Diễn đạt sự đi vào một trạng thái hay kết quả, phù hợp với lời trích dẫn Sáng Thế Ký 2:7 hơn các cách dịch mang nghĩa bị tạo thành.
- source_word: ὁ πρῶτος ἄνθρωπος Ἀδὰμ
  choice: Người đầu tiên là A-đam
  rationale: “Người” vừa tự nhiên trong tiếng Việt vừa giữ được ý nghĩa A-đam là người nam đầu tiên và nhân vật đại diện trong phép đối chiếu của Phao-lô.
- source_word: εἰς ψυχὴν ζῶσαν
  choice: một sinh thể sống
  rationale: Trong tiếng vọng lại Sáng Thế Ký 2:7, ψυχή chỉ toàn thể hữu thể sống chứ không nhất thiết riêng một phần phi vật chất. “Sinh thể sống” rõ nghĩa trong tiếng Việt hiện đại và tránh xác định quá mức quan niệm nhân học.
- source_word: ὁ ἔσχατος Ἀδὰμ
  choice: A-đam cuối cùng
  rationale: Giữ nguyên danh xưng mang tính biểu tượng và cánh chung trong phép đối chiếu A-đam–Đấng Christ.
- source_word: εἰς πνεῦμα ζῳοποιοῦν
  choice: thần linh ban sự sống
  rationale: πνεῦμα không có mạo từ và cụm từ mang tính phẩm chất; “thần linh ban sự sống” giữ được sự tương phản với “sinh thể sống” mà không mặc nhiên đồng nhất Đấng Christ với Đức Thánh Linh như một ngôi vị riêng biệt.
theological_decisions:
- issue: Ý nghĩa nhân học của ψυχή trong lời dẫn Sáng Thế Ký
  choice: Dịch ψυχὴν ζῶσαν là “một sinh thể sống”.
  alternative: “một linh hồn sống”
  rationale: Ngữ cảnh sáng tạo nói về A-đam như một hữu thể sống toàn vẹn, không chủ yếu xác định một linh hồn phi vật chất có thể tách rời. Chú thích giữ lại cách dịch truyền thống.
- issue: Ý nghĩa của câu “A-đam cuối cùng đã trở nên thần linh ban sự sống”
  choice: Giữ nguyên phép đối chiếu biểu tượng bằng một cụm từ mang tính phẩm chất.
  alternative: “A-đam cuối cùng đã trở nên Thánh Linh ban sự sống” hoặc “một thần linh là Đấng ban sự sống”
  rationale: Cấu trúc Hy Lạp không có mạo từ trước πνεῦμα, nên không buộc người đọc hiểu đây là lời đồng nhất trực tiếp Đấng Christ với Đức Thánh Linh như một ngôi vị riêng biệt. Bản dịch không giải nghĩa giáo lý vượt quá điều câu văn khẳng định.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “A-đam” theo lối phiên âm quen thuộc trong Kinh Thánh tiếng Việt; viết “thần linh” bằng chữ thường để bảo toàn tính chất định tính và sự mơ hồ chân thực của nguyên văn.
