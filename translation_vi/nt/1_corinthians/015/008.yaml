  rationale: Thay “một người sinh không đúng kỳ” bằng “một người sinh non” để phản ánh chính xác và tự nhiên hơn phép ví von ὡσπερεὶ τῷ ἐκτρώματι. Thêm “đã” là cách diễn đạt tự nhiên của sự kiện quá khứ trong chuỗi các lần hiện ra và không thay đổi nghĩa. Chú thích giữ nguyên các khả năng nghĩa đen, kể cả độ gay gắt và sự mơ hồ của nguyên ngữ.
