    issue: “sinh không đúng kỳ” làm mờ nghĩa của ἐκτρώματι.
    rationale: Cụm này không tự nhiên và không xác định được nét “sinh non/bất thường” cùng sắc thái gay gắt, tự hạ mình của từ Hy Lạp. “Sinh non” là cách diễn đạt chính văn rõ hơn, còn các nghĩa đen mạnh hơn được bảo tồn trong chú thích.
  revised_text: Sau hết, Ngài cũng đã hiện ra với tôi, như với một người sinh non[a].
