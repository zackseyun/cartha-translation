base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/008.yaml
  text: And last of all[a], as to one untimely born, he appeared also to me.
translation:
  language: vi
  text: Sau hết, Ngài cũng đã hiện ra với tôi, như với một người sinh non[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát hơn: “như với một thai sẩy” hoặc “như với một thai bị phá.” Phao-lô dùng một hình ảnh gay gắt để tự hạ mình.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔσχατον δὲ πάντων
  choice: Sau hết
  rationale: Cụm này đánh dấu lần hiện ra cuối cùng trong danh sách các nhân chứng; “Sau hết” tự nhiên, trang trọng và giữ ý trình tự thời gian.
- source_word: ὡσπερεὶ
  choice: như với
  rationale: Giữ lực so sánh và nối tự nhiên với bổ ngữ gián tiếp τῷ ἐκτρώματι, không biến phép ví von thành một khẳng định giải nghĩa.
- source_word: τῷ ἐκτρώματι
  choice: một người sinh không đúng kỳ
  rationale: Diễn đạt hình ảnh tự hạ mình về một sự sinh ra bất thường hoặc sai thời điểm, đồng thời tránh thu hẹp nghĩa khó của từ Hy Lạp; nghĩa đen mạnh hơn được nêu trong chú thích.
- source_word: ὤφθη
  choice: Ngài hiện ra
  rationale: Trong mạch các lần Đấng Christ phục sinh hiện ra, thể bị động của ὁράω được diễn đạt tự nhiên là “hiện ra”. Đại từ tôn kính phù hợp với văn phong Kinh Thánh tiếng Việt.
- source_word: κἀμοί
  choice: cũng hiện ra với tôi
  rationale: 'Giữ rõ lực bổ sung của καί: Phao-lô cũng thuộc chuỗi người được Đấng Christ hiện ra.'
theological_decisions:
- issue: Hình ảnh tự mô tả ἐκτρώματι của Phao-lô
  choice: Giữ phép ví von “như với một người sinh không đúng kỳ” trong chính văn và ghi nghĩa đen mạnh hơn ở chú thích.
  alternative: “như với một thai sẩy” hoặc “như với một thai bị phá”
  rationale: Từ Hy Lạp là một hình ảnh gay gắt, có thể chỉ thai sẩy hoặc thai bị phá. Chính văn cần dễ hiểu nhưng không được xóa ý bất thường và tự hạ mình; chú thích bảo tồn độ mạnh cùng sự mơ hồ của nguyên ngữ, không áp đặt một cách giải thích thần học cụ thể về chức vụ sứ đồ của Phao-lô.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Câu giữ nhịp ngắn của nguyên văn và không giải thích quá mức hình ảnh khó.
