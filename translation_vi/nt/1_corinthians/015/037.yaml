id: 1CO.15.37
reference: 1 Corinthians 15:37
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ὃ σπείρεις, οὐ τὸ σῶμα τὸ γενησόμενον σπείρεις ἀλλὰ γυμνὸν κόκκον εἰ τύχοι σίτου ἤ τινος τῶν λοιπῶν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/037.yaml
  text: And what you sow[a], you do not sow the body that will be, but a bare kernel[c][b], perhaps of wheat or of some other kind.
translation:
  language: vi
  text: Còn điều bạn gieo, bạn không gieo thân thể sẽ hình thành, nhưng là một hạt trơ[a], có thể là hạt lúa mì hoặc một loại hạt nào khác.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “một hạt trần trụi” hoặc “một hạt không được bao bọc.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: σπείρεις
  choice: gieo
  rationale: “Gieo” là từ nông nghiệp trực tiếp, tự nhiên trong tiếng Việt và duy trì hình ảnh hạt giống xuyên suốt lập luận.
- source_word: σῶμα
  choice: thân thể
  rationale: “Thân thể” giữ nguyên thuật ngữ quan trọng trong lập luận của Phao-lô về sự sống lại, thay vì thu hẹp nghĩa thành “cây” hay làm loãng thành “hình dạng”.
- source_word: τὸ γενησόμενον
  choice: sẽ hình thành
  rationale: Cách dịch này diễn đạt ý một thân thể sẽ trở thành hiện thực, đồng thời tự nhiên hơn lối dịch sát chữ “sẽ trở nên” và không giới hạn câu vào sự tăng trưởng thực vật.
- source_word: γυμνὸν κόκκον
  choice: một hạt trần trụi
  rationale: “Hạt” phù hợp với ví dụ lúa mì; “trần trụi” giữ hình ảnh mạnh của γυμνός và làm nổi bật sự tương phản với thân thể về sau.
- source_word: εἰ τύχοι
  choice: có thể là
  rationale: Cụm này nêu một khả năng hay ví dụ, không phải điều kiện chặt chẽ; “có thể là” tự nhiên và vẫn giữ sắc thái chưa xác định.
- source_word: σίτου ἤ τινος τῶν λοιπῶν
  choice: hạt lúa mì hoặc một loại hạt nào khác
  rationale: σίτου được hiểu cụ thể là lúa mì; việc lặp “hạt” ở vế sau làm rõ rằng τῶν λοιπῶν chỉ các loại hạt còn lại.
theological_decisions:
- issue: Mối liên hệ giữa hạt được gieo và thân thể phục sinh
  choice: Giữ từ “thân thể” cùng cách diễn đạt hướng đến tương lai “sẽ hình thành”, không giải nghĩa thêm phép ví von.
  alternative: Dịch diễn ý thành “cây sẽ mọc lên”.
  rationale: Câu dùng hình ảnh nông nghiệp để nói về tính liên tục và sự biến đổi, nhưng không tự giải thích đầy đủ bản chất của thân thể phục sinh. Bản dịch vì thế không đồng nhất “thân thể” với cây và cũng không đưa một hệ thống thần học vào câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Đại từ “bạn” phản ánh ngôi thứ hai số ít mang tính khái quát trong nguyên văn; cấu trúc lặp “gieo” giữ nhịp lập luận và làm rõ sự tương phản.
