review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp giữ đúng các yếu tố chính: động từ «gieo», thuật ngữ «thân thể», tương lai của τὸ γενησόμενον, hạt «trần/trơ», ví dụ lúa mì, và sắc thái không xác định của εἰ τύχοι. Tuy nhiên, «mà chỉ gieo» thêm động từ và sắc thái «chỉ» không cần thiết; nguyên văn đối lập trực tiếp điều được gieo với «một hạt trơ».'
  naturalness: «Hạt trần trụi» có thể hiểu được nhưng không tự nhiên trong văn cảnh nông nghiệp tiếng Việt hiện đại và dễ gợi liên tưởng không phù hợp. «Hạt trơ» là cách nói gọn, tự nhiên hơn cho hạt chưa có hình thể phát triển. Cấu trúc câu cũng trôi chảy hơn khi dùng «nhưng là một hạt trơ».
  terminology: Giữ «thân thể» là cần thiết cho liên kết với lập luận phục sinh của Phao-lô. «Sẽ hình thành» diễn đạt được tương lai của γενησόμενον mà không đồng nhất thân thể với cây mọc. «Lúa mì» và «một loại hạt nào khác» truyền đạt đúng ví dụ mở của cụm σίτου ἤ τινος τῶν λοιπῶν.
  issues:
  - severity: medium
    issue: «mà chỉ gieo một hạt trần trụi» không phản ánh gọn cấu trúc đối lập của nguyên văn và dùng cách kết hợp từ thiếu tự nhiên.
    rationale: ἀλλὰ γυμνὸν κόκκον đối lập với «thân thể sẽ hình thành»; không cần lặp «gieo» với «chỉ». «Trần trụi» tuy sát nghĩa đen của γυμνός nhưng không phải lựa chọn tự nhiên nhất khi bổ nghĩa cho «hạt» trong tiếng Việt.
  revised_text: Còn điều bạn gieo, bạn không gieo thân thể sẽ hình thành, nhưng là một hạt trơ[a], có thể là hạt lúa mì hoặc một loại hạt nào khác.
