revisions:
- from: Còn điều bạn gieo, bạn không gieo thân thể sẽ hình thành, mà chỉ gieo một hạt trần trụi[a], có thể là hạt lúa mì hoặc một loại hạt nào khác.
  to: Còn điều bạn gieo, bạn không gieo thân thể sẽ hình thành, nhưng là một hạt trơ[a], có thể là hạt lúa mì hoặc một loại hạt nào khác.
  rationale: Đổi «mà chỉ gieo một hạt trần trụi» thành «nhưng là một hạt trơ» để phản ánh trực tiếp hơn cấu trúc ἀλλὰ γυμνὸν κόκκον, đồng thời dùng lối diễn đạt nông nghiệp tự nhiên trong tiếng Việt. Các thành tố ngữ nghĩa và mức độ dè dặt của câu vẫn được giữ nguyên.
