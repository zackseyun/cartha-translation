id: 1CO.15.58
reference: 1 Corinthians 15:58
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ὥστε, ἀδελφοί μου ἀγαπητοί, ἑδραῖοι γίνεσθε, ἀμετακίνητοι, περισσεύοντες ἐν τῷ ἔργῳ τοῦ κυρίου πάντοτε, εἰδότες ὅτι ὁ κόπος ὑμῶν οὐκ ἔστιν κενὸς ἐν κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/058.yaml
  text: Therefore[a], my beloved brothers, become steadfast, immovable, always abounding in the work of the Lord, knowing that your labor in the Lord is not in vain.
translation:
  language: vi
  text: Vậy nên, anh chị em yêu dấu của tôi[a], hãy trở nên vững vàng, không lay chuyển, luôn dồi dào trong công việc của Chúa, vì biết rằng sự khó nhọc của anh chị em trong Chúa không phải là vô ích.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tiếng Hy Lạp dùng từ ở dạng giống đực số nhiều, thường dịch sát là “anh em”; trong ngữ cảnh này, từ ấy chỉ chung các tín hữu, gồm cả nam lẫn nữ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὥστε
  choice: Vậy nên
  rationale: Diễn đạt tự nhiên quan hệ suy luận, nối lời khuyên này với lập luận về sự sống lại ở phần trước.
- source_word: ἀδελφοί μου ἀγαπητοί
  choice: thưa anh chị em yêu dấu của tôi
  rationale: Trong ngữ cảnh thư gửi toàn thể hội thánh, ἀδελφοί chỉ chung các tín hữu, gồm cả nam lẫn nữ; “yêu dấu” giữ sắc thái của ἀγαπητοί.
- source_word: ἑδραῖοι γίνεσθε
  choice: hãy trở nên vững vàng
  rationale: Giữ lực của mệnh lệnh γίνεσθε là “trở nên”, đồng thời “vững vàng” truyền đạt trạng thái được thiết lập chắc chắn.
- source_word: ἀμετακίνητοι
  choice: không lay chuyển
  rationale: Cách nói tự nhiên trong tiếng Việt cho ý không bị xê dịch khỏi lập trường.
- source_word: περισσεύοντες ... πάντοτε
  choice: luôn dồi dào
  rationale: Giữ ý tiếp diễn và sung mãn của phân từ περισσεύοντες cùng trạng từ πάντοτε.
- source_word: ἐν τῷ ἔργῳ τοῦ κυρίου
  choice: trong công việc của Chúa
  rationale: Giữ phạm vi rộng của ἔργον và cấu trúc sở hữu, không thu hẹp thành một loại chức vụ cụ thể.
- source_word: εἰδότες
  choice: vì biết rằng
  rationale: Phân từ mang sắc thái nền tảng hoặc nguyên nhân cho lời khuyên; “vì biết rằng” tự nhiên trong tiếng Việt mà không làm thay đổi nội dung.
- source_word: ὁ κόπος ὑμῶν
  choice: công lao khó nhọc của anh chị em
  rationale: κόπος nhấn mạnh nỗ lực vất vả; cụm này vừa tự nhiên vừa giữ được sức nặng ấy.
- source_word: οὐκ ἔστιν κενὸς
  choice: không phải là vô ích
  rationale: Thành ngữ tiếng Việt diễn đạt đúng ý không trống rỗng, không uổng công hay thiếu kết quả.
- source_word: ἐν κυρίῳ
  choice: trong Chúa
  rationale: Giữ nguyên bề rộng thần học của thành ngữ Phao-lô, không thu hẹp thành một cách giải thích duy nhất.
theological_decisions:
- issue: Phạm vi giới tính của ἀδελφοί
  choice: Dịch “anh chị em” trong chính văn và có chú thích về hình thức Hy Lạp.
  alternative: anh em
  rationale: Danh từ Hy Lạp ở dạng giống đực số nhiều nhưng trong lời gửi toàn thể hội thánh có thể chỉ cộng đồng tín hữu gồm cả nam lẫn nữ. Tiếng Việt hiện đại cần diễn đạt rõ phạm vi thực tế ấy.
- issue: Quan hệ của ἐν κυρίῳ ở cuối câu
  choice: 'Gắn với “công lao khó nhọc”: “công lao khó nhọc ... trong Chúa”.'
  alternative: công lao không vô ích nhờ Chúa
  rationale: Cách này bảo tồn cấu trúc và độ rộng của thành ngữ Phao-lô, thay vì xác định nó chỉ mang nghĩa nguyên nhân.
- issue: Cách dịch κύριος
  choice: Chúa
  alternative: Chủ
  rationale: “Chúa” là cách gọi tự nhiên, trang trọng và phù hợp ngữ cảnh Tân Ước trong tiếng Việt.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Giữ nhịp khích lệ của câu, đồng thời tránh thuật ngữ giáo phái và không giải nghĩa quá mức thành ngữ “trong Chúa”.
