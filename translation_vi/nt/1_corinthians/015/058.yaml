  - severity: low
    issue: “thưa” thêm một sắc thái xưng hô không được biểu thị riêng trong nguyên ngữ.
    rationale: Câu vẫn là lời gọi trực tiếp; bỏ từ này giúp giữ giọng thư tín đơn giản và sát cấu trúc hơn.
