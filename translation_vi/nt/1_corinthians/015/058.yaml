  to: Vậy nên, anh chị em yêu dấu của tôi[a], hãy trở nên vững vàng, không lay chuyển, luôn dồi dào trong công việc của Chúa, vì biết rằng sự khó nhọc của anh chị em trong Chúa không phải là vô ích.
