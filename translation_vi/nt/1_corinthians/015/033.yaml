  text: 'Do not be deceived: bad company corrupts good morals[a].'
translation:
  language: vi
  text: 'Đừng bị lừa dối: “Bạn bè xấu làm hư thói nết tốt.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Những cuộc chuyện trò xấu làm hư thói nết tốt.” Từ Hy Lạp có thể chỉ sự giao du hoặc chuyện trò.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ πλανᾶσθε
  choice: Đừng để mình bị lừa dối
  rationale: Giữ sắc thái cảnh báo của mệnh lệnh hiện tại với μή và không quyết đoán rằng sự lừa dối chỉ do bản thân hay do người khác gây ra.
- source_word: φθείρουσιν
  choice: làm hư
  rationale: Diễn đạt tự nhiên quá trình gây suy đồi về đạo đức; nhẹ hơn 'hủy diệt' nhưng rõ hơn 'làm hỏng' trong ngữ cảnh này.
- source_word: ἤθη χρηστά
  choice: phẩm hạnh tốt
  rationale: ἤθη chỉ nếp tính và phẩm chất đạo đức, còn χρηστά mang nghĩa tốt lành; 'phẩm hạnh tốt' vừa tự nhiên vừa giữ trọng tâm luân lý.
- source_word: ὁμιλίαι κακαί
  choice: bạn bè xấu
  rationale: ὁμιλίαι có thể nói đến sự giao du, kết giao hoặc chuyện trò. Trong câu cách ngôn này, 'bạn bè xấu' truyền đạt tự nhiên ý về những mối giao du gây hại, đồng thời cách hiểu thiên về lời nói được giữ trong chú thích.
