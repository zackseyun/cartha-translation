  verdict: revise
  source_fidelity: Bản dịch chuyển tải đúng lời cảnh báo μὴ πλανᾶσθε và ý suy đồi đạo đức của φθείρουσιν ἤθη χρηστά. Tuy nhiên, “Đừng để mình bị lừa dối” thêm cấu trúc khiến tác thể tự thân nổi bật hơn bản Hy Lạp cần thiết; “Đừng bị lừa dối” giữ được tính mơ hồ chủ động/trung động của πλανᾶσθε cách gọn hơn. “Bạn bè xấu” là cách diễn đạt thành ngữ, phù hợp cách hiểu ὁμιλίαι là sự giao du/đám bạn, còn nghĩa “chuyện trò” được giữ trong chú thích.
  naturalness: “Thói nết tốt” tự nhiên và có tính cách ngôn trong tiếng Việt hiện đại hơn “phẩm hạnh tốt”; cụm sau đúng nghĩa nhưng hơi trừu tượng và lặp ý “tốt” theo cách kém thành ngữ. Câu sửa giữ văn phong ngắn, rõ và trang trọng vừa phải.
  terminology: “Làm hư” diễn đạt chính xác φθείρουσιν trong ngữ cảnh đạo đức. “Thói nết” bao quát nếp tính, tập quán đạo đức của ἤθη mà không thu hẹp vào phép lịch sự. Không có thuật ngữ thần học hoặc tên riêng cần chuẩn hóa.
  issues:
  - severity: low
    issue: “Đừng để mình bị lừa dối”
    rationale: Cách nói này tự nhiên, nhưng “để mình” có thể gợi ý sự cho phép hay trách nhiệm của chính người nghe rõ hơn điều μορφ thức trung/ bị động πλανᾶσθε xác định. “Đừng bị lừa dối” ngắn hơn và bảo toàn độ mở của nguyên ngữ.
  - severity: low
    issue: “phẩm hạnh tốt”
    rationale: Đúng về mặt nghĩa nhưng kém tự nhiên trong một câu châm ngôn. “Thói nết tốt” là lối nói hiện đại, thông dụng, và phản ánh tốt ἤθη.
