language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὅταν δὲ τὸ ⸂φθαρτὸν τοῦτο ἐνδύσηται ἀφθαρσίαν καὶ τὸ⸃ θνητὸν τοῦτο ἐνδύσηται ⸀ἀθανασίαν, τότε γενήσεται ὁ λόγος ὁ γεγραμμένος· Κατεπόθη ὁ θάνατος εἰς νῖκος.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/054.yaml
  text: 'But when this perishable puts on imperishability[a], and this mortal puts on immortality[d][c][b], then the written word will come to pass: “Death has been swallowed up in victory.”'
translation:
  language: vi
  text: 'Nhưng khi thân thể dễ hư nát này mặc lấy sự không thể hư nát, và thân thể phải chết này mặc lấy sự bất tử, thì lời đã chép sẽ thành hiện thực: “Sự chết đã bị nuốt chửng trong chiến thắng.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Trích Ê-sai 25:8, với cách diễn đạt phản ánh truyền thống bản Hy Lạp mà Phao-lô sử dụng.
    reason: cross_reference
lexical_decisions:
- source_word: φθαρτὸν
  choice: thân thể hay hư nát
  rationale: Tính từ được danh từ hóa, trong mạch văn chỉ thân thể hiện tại vốn chịu sự hư nát; thêm “thân thể” để tiếng Việt rõ và tự nhiên.
- source_word: ἐνδύσηται
  choice: mặc lấy
  rationale: Giữ nguyên ẩn dụ mặc áo của động từ thể trung, đồng thời là cách diễn đạt trang trọng và dễ hiểu.
- source_word: ἀφθαρσίαν
  choice: sự không hư nát
  rationale: Giữ sự đối xứng trực tiếp với φθαρτόν mà không gợi nghĩa luân lý như “không bại hoại” có thể gợi ra trong tiếng Việt hiện đại.
- source_word: θνητὸν
  choice: thân thể phải chết
  rationale: Diễn đạt tình trạng hữu tử một cách tự nhiên; trong ngữ cảnh, từ được danh từ hóa và chỉ thân thể.
- source_word: ἀθανασίαν
  choice: sự bất tử
  rationale: Tương đương trực tiếp, quen thuộc và súc tích cho trạng thái không còn chịu sự chết.
- source_word: γενήσεται
  choice: sẽ thành hiện thực
  rationale: Diễn đạt tự nhiên ý “sẽ xảy ra/trở thành sự thật” của γίνομαι trong quan hệ với lời đã chép, nhưng không dùng công thức mạnh hơn là “được ứng nghiệm”.
- source_word: ὁ λόγος ὁ γεγραμμένος
  choice: lời đã chép
  rationale: “Lời” sát với λόγος, còn “đã chép” phản ánh phân từ hoàn thành và là lối nói Kinh Thánh tự nhiên trong tiếng Việt.
- source_word: Κατεπόθη
  choice: đã bị ... nuốt chửng
  rationale: Giữ thể bị động và hình ảnh mạnh của động từ; “đã” thích hợp với lời tuyên bố được xem là hoàn tất tại thời điểm tương lai đang nói tới.
- source_word: εἰς νῖκος
  choice: bị chiến thắng nuốt chửng
  rationale: Hiểu εἰς νῖκος theo kết quả là sự chiến thắng hoàn toàn; cấu trúc này tự nhiên hơn “nuốt chửng trong chiến thắng” trong tiếng Việt và giữ được hình ảnh sự chết bị đánh bại.
theological_decisions:
- issue: Cách diễn đạt γενήσεται đối với lời Kinh Thánh được trích dẫn
  choice: “sẽ thành hiện thực”
  alternative: “sẽ được ứng nghiệm” hoặc “sẽ xảy ra”
  rationale: Cách chọn giữ ý lời đã chép trở thành sự thật mà không đưa vào một thuật ngữ ứng nghiệm mạnh hơn điều γίνομαι tự nó biểu đạt.
- issue: Thể và thời của Κατεπόθη trong lời trích dẫn hướng về tương lai
  choice: “đã bị ... nuốt chửng”
  alternative: “bị ... nuốt chửng” hoặc “sẽ bị ... nuốt chửng”
  rationale: Thì quá khứ trong lời trích dẫn được giữ bằng “đã”, trình bày biến cố như đã hoàn tất tại thời điểm cánh chung mà Phao-lô đang hướng tới, thay vì đổi thành thì tương lai.
- issue: Quan hệ giữa sự chết và chiến thắng trong εἰς νῖκος
  choice: “Sự chết đã bị chiến thắng nuốt chửng”
  alternative: “Sự chết đã bị nuốt chửng trong chiến thắng”
  rationale: Bản dịch chọn lối diễn đạt tự nhiên, trong đó chiến thắng hoàn toàn áp đảo sự chết, nhưng không xác định thêm tác nhân thần học ngoài hình ảnh của câu trích dẫn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Hai lần thêm “thân thể” làm rõ các tính từ được danh từ hóa trong tiếng Hy Lạp; cấu trúc lặp “mặc lấy” được giữ để bảo toàn nhịp điệu và ẩn dụ của nguyên văn.
