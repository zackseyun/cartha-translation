revisions:
- from: 'Nhưng khi thân thể hay hư nát này mặc lấy sự không hư nát, và thân thể phải chết này mặc lấy sự bất tử, thì lời đã chép sẽ thành hiện thực: “Sự chết đã bị chiến thắng nuốt chửng.”[a]'
  to: 'Nhưng khi thân thể dễ hư nát này mặc lấy sự không thể hư nát, và thân thể phải chết này mặc lấy sự bất tử, thì lời đã chép sẽ thành hiện thực: “Sự chết đã bị nuốt chửng trong chiến thắng.”[a]'
  rationale: Chỉnh câu trích dẫn để bảo toàn thể bị động của Κατεπόθη và quan hệ thành ngữ của εἰς νῖκος, không biến “chiến thắng” thành tác nhân được xác định. Đồng thời làm mượt hai cụm diễn tả tính hư nát/không hư nát và cập nhật chú thích để không lặp lại bản văn chính.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T19:24:27Z'
review_pass:
  verdict: revise
  source_fidelity: Bản dịch giữ đúng cấu trúc chính của câu, ẩn dụ “mặc lấy,” và sắc thái hoàn tất của Κατεπόθη. Tuy nhiên, “Sự chết đã bị chiến thắng nuốt chửng” đảo cách biểu đạt của câu bị động Hy Lạp và khiến “chiến thắng” trở thành tác nhân được nhân cách hóa quá rõ. Cách này kém sát với Κατεπόθη ... εἰς νῖκος.
  naturalness: “Thân thể hay hư nát” và “sự không hư nát” hơi gượng trong tiếng Việt hiện đại. “Thân thể dễ hư nát” và “sự không thể hư nát” tự nhiên hơn, đồng thời vẫn duy trì tương quan từ vựng. “Sự chết đã bị nuốt chửng trong chiến thắng” giữ hình ảnh nguyên văn và đọc tự nhiên.
  terminology: “Mặc lấy,” “bất tử,” “lời đã chép,” và “thành hiện thực” phù hợp với văn phong Kinh Thánh tiếng Việt hiện đại. Không cần dùng “ứng nghiệm,” vì động từ γενήσεται không buộc phải mang công thức đó.
  issues:
  - severity: medium
    issue: Cụm “Sự chết đã bị chiến thắng nuốt chửng” biến “chiến thắng” thành chủ thể trực tiếp nuốt chửng.
    rationale: Nguyên văn dùng bị động Κατεπόθη (“đã bị nuốt chửng”) với εἰς νῖκος diễn tả kết quả/lĩnh vực chiến thắng. Nên giữ cấu trúc bị động mà không xác định hoặc nhân cách hóa tác nhân.
  - severity: low
    issue: “Thân thể hay hư nát” và “sự không hư nát” chưa thật tự nhiên.
    rationale: “Hay hư nát” có thể gợi khuynh hướng hoặc tần suất, còn “sự không hư nát” là phủ định danh từ hơi nặng. “Dễ hư nát” và “không thể hư nát” diễn đạt rõ tình trạng chịu hư nát và sự đối lập của ἀφθαρσία.
  - severity: low
    issue: Chú thích hiện nêu chính cách dịch sẽ được dùng làm bản văn chính như một phương án thay thế.
    rationale: Sau khi chỉnh câu trích dẫn theo cấu trúc bị động, chú thích nên chỉ giữ thông tin về nguồn trích dẫn để tránh trùng lặp và gây nhiễu.
