  text: εἰ γὰρ νεκροὶ οὐκ ἐγείρονται, οὐδὲ Χριστὸς ἐγήγερται·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/016.yaml
  text: For if the dead are not raised[a], not even Messiah has been raised.
translation:
  language: vi
  text: Vì nếu người chết không được làm cho sống lại, thì ngay cả Đấng Mê-si-a[a] cũng đã không được làm cho sống lại.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “Đấng Christ.” Tước hiệu Hy Lạp Χριστός có thể được dịch là “Đấng Mê-si-a” hoặc, theo cách gọi truyền thống lâu đời, “Đấng Christ.”'
    reason: alternative_reading
lexical_decisions:
- source_word: εἰ γὰρ
  choice: Vì nếu
  rationale: Giữ cả quan hệ giải thích của γάρ và điều kiện của εἰ, đồng thời nối tự nhiên với lập luận ở câu trước.
- source_word: νεκροὶ
  choice: người chết
  rationale: Tính từ số nhiều được dùng như danh từ, chỉ những người đã chết nói chung; cách dịch này tự nhiên và có tính khái quát trong tiếng Việt.
- source_word: ἐγείρονται
  choice: không được làm cho sống lại
  rationale: Giữ thể bị động của động từ và ý nghĩa phục sinh trong ngữ cảnh, thay vì chuyển thành cách nói chủ động hoặc nội động từ.
- source_word: οὐδὲ
  choice: thì ngay cả… cũng… không
  rationale: 'Diễn đạt sức nhấn mạnh của οὐδὲ: hệ quả này áp dụng ngay cả đối với Đấng Mê-si.'
- source_word: Χριστὸς
  choice: Đấng Mê-si
  rationale: Dịch tước hiệu Χριστός theo nghĩa 'Đấng được xức dầu', thay vì mặc nhiên dùng dạng phiên âm truyền thống như một tên riêng.
- source_word: ἐγήγερται
  choice: đã không được làm cho sống lại
  rationale: Từ ở thể hoàn thành bị động; 'đã… được làm cho sống lại' giữ hành động đã hoàn tất cùng kết quả còn hiệu lực và duy trì liên hệ từ vựng với ἐγείρονται.
theological_decisions:
- issue: Cách dịch Χριστός trong lập luận về sự phục sinh
  choice: Đấng Mê-si
  alternative: Đấng Christ
  rationale: Trong câu này, Χριστός vẫn có giá trị tước hiệu rõ ràng. 'Đấng Mê-si' truyền đạt ý nghĩa ấy minh bạch, còn chú thích bảo tồn cách gọi truyền thống quen thuộc.
- issue: Tác nhân làm cho sống lại không được nêu rõ trong câu Hy Lạp
  choice: Giữ cấu trúc bị động 'được làm cho sống lại' mà không thêm tác nhân
  alternative: Đức Chúa Trời làm cho sống lại
  rationale: Thể bị động gợi đến hành động của Đức Chúa Trời trong ngữ cảnh, nhưng câu này không nêu tác nhân; không nên bổ sung điều bản văn để ngỏ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc lặp lại 'được làm cho sống lại' chủ ý phản ánh phép suy luận và sự lặp từ của nguyên văn; 'ngay cả… cũng… không' thể hiện rõ sắc thái nhấn mạnh.
