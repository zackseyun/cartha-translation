source:
  edition: SBLGNT
  text: ὁ δὲ θεὸς ⸂δίδωσιν αὐτῷ⸃ σῶμα καθὼς ἠθέλησεν, καὶ ἑκάστῳ τῶν σπερμάτων ⸀ἴδιον σῶμα.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/038.yaml
  text: But God gives it a body as he willed[a], and to each of the seeds its own body.
translation:
  language: vi
  text: Nhưng Đức Chúa Trời ban cho nó một thân thể như Ngài đã muốn, và cho mỗi hạt giống một thân thể riêng.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hy Lạp: “cho mỗi một trong các hạt giống một thân thể riêng”; cách nói này có thể hiểu theo nghĩa phân phối: “cho mỗi hạt giống một thân thể riêng.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: δίδωσιν αὐτῷ
  choice: ban cho nó
  rationale: Động từ hiện tại δίδωσιν được diễn đạt tự nhiên là “ban”, còn đại từ tặng cách αὐτῷ quy về hạt giống trong ngữ cảnh trước. Cách nói này giữ rõ vai trò chủ động của Đức Chúa Trời.
- source_word: σῶμα
  choice: thân thể
  rationale: “Thân thể” giữ liên kết từ vựng với chủ đề thân thể và sự sống lại xuyên suốt chương, thay vì thu hẹp thành “hình dạng” hay “hình thể”.
- source_word: καθὼς ἠθέλησεν
  choice: theo như Ngài đã muốn
  rationale: Cách dịch này phản ánh động từ aorist ἠθέλησεν và giữ trọng tâm nơi ý muốn của Đức Chúa Trời mà không thêm diễn giải thần học.
- source_word: ἑκάστῳ τῶν σπερμάτων
  choice: mỗi hạt giống
  rationale: Trong tiếng Việt, “mỗi hạt giống” diễn đạt tự nhiên giá trị phân phối của ἑκάστῳ với sở hữu cách bộ phận τῶν σπερμάτων; không thêm ý “mỗi loại”, vốn không được nói minh nhiên.
- source_word: ἴδιον σῶμα
  choice: thân thể riêng của nó
  rationale: “Riêng của nó” thể hiện lực cá biệt hóa và sở thuộc của ἴδιον, đồng thời dùng đại từ số ít phù hợp với “mỗi hạt giống”.
theological_decisions:
- issue: Vai trò chủ động và ý muốn của Đức Chúa Trời trong hình ảnh hạt giống và thân thể
  choice: Giữ rõ rằng Đức Chúa Trời ban thân thể cho hạt giống theo ý Ngài, và mỗi hạt có thân thể riêng.
  alternative: Có thể diễn giải thành Đức Chúa Trời ban cho “mỗi loại hạt giống một hình thể riêng”.
  rationale: Bản dịch bảo tồn sự nhấn mạnh của câu Hy Lạp về hành động và ý muốn của Đức Chúa Trời, nhưng không đưa thêm khái niệm “loại” hay một hệ thống giáo lý rộng hơn vào câu.
translation_notes:
  register: Văn phong trang trọng, tự nhiên và dễ hiểu trong tiếng Việt hiện đại. Dùng “Đức Chúa Trời” và đại từ tôn kính “Ngài”; lặp “ban cho” ở vế sau để câu tiếng Việt rõ quan hệ ngữ pháp, dù động từ được tỉnh lược trong nguyên văn Hy Lạp.
