    rationale: Chú thích hiện neo sau «Ê-phê-sô» và gộp cả κατὰ ἄνθρωπον lẫn «chiến đấu với thú dữ». Cần neo riêng chú thích của cụm κατὰ ἄνθρωπον tại cụm ấy, và chú thích về nghĩa đen/nghĩa bóng tại «chiến đấu với thú dữ», để phản ánh rõ các điểm bất định của nguyên văn.
