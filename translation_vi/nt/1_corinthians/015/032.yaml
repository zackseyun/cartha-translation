revisions:
- from: Nếu, nói theo cách của loài người, tôi đã chiến đấu với thú dữ tại Ê-phê-sô[a], thì tôi được ích gì? Nếu người chết không được sống lại, thì “chúng ta hãy ăn và uống, vì ngày mai chúng ta sẽ chết.”[b]
  to: Nếu, nói theo cách của con người[a], tôi đã chiến đấu với thú dữ[b] ở Ê-phê-sô, thì điều đó có ích gì cho tôi? Nếu người chết không được sống lại, thì “chúng ta hãy ăn và uống, vì ngày mai chúng ta sẽ chết.”[c]
  rationale: Bản sửa chỉ điều chỉnh cách diễn đạt cho tự nhiên hơn và tách các chú thích để mỗi chú thích được neo đúng vào cụm từ Hy Lạp liên quan. Chính văn vẫn giữ hình ảnh «thú dữ», sự mơ hồ lịch sử của ἐθηριομάχησα, và hình thức bị động «được sống lại».
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T19:24:17Z'
