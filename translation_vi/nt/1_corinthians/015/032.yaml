id: 1CO.15.32
reference: 1 Corinthians 15:32
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἰ κατὰ ἄνθρωπον ἐθηριομάχησα ἐν Ἐφέσῳ, τί μοι τὸ ὄφελος; εἰ νεκροὶ οὐκ ἐγείρονται, Φάγωμεν καὶ πίωμεν, αὔριον γὰρ ἀποθνῄσκομεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/032.yaml
  text: If[a], speaking in merely human terms, I fought with wild beasts in Ephesus, what does it profit me? If the dead are not raised[b], “Let us eat and drink[c], for tomorrow we die.”
translation:
  language: vi
  text: Nếu, nói theo cách của con người[a], tôi đã chiến đấu với thú dữ[b] ở Ê-phê-sô, thì điều đó có ích gì cho tôi? Nếu người chết không được sống lại, thì “chúng ta hãy ăn và uống, vì ngày mai chúng ta sẽ chết.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Nếu, xét theo quan điểm của con người, tôi đã chiến đấu với thú dữ ở Ê-phê-sô…” Cụm từ này có thể bổ nghĩa cho cách nói hoặc góc nhìn của Phao-lô.'
    reason: lexical_alternative
  - marker: b
    text: “Chiến đấu với thú dữ” có thể được hiểu theo nghĩa đen hoặc như một hình ảnh về sự chống đối hung bạo của con người; nguyên văn Hy Lạp không giải quyết rõ điều này.
    reason: alternative_reading
  - marker: c
    text: Trích dẫn hoặc ám chỉ Ê-sai 22:13.
    reason: cross_reference
lexical_decisions:
- source_word: κατὰ ἄνθρωπον
  choice: nói theo cách của loài người
  rationale: Diễn đạt tự nhiên thành ngữ Hy Lạp như một cách nói hoặc góc nhìn thuần túy của con người, đồng thời không loại trừ khả năng cụm từ nêu phương diện hay động cơ.
- source_word: ἐθηριομάχησα
  choice: tôi đã chiến đấu với thú dữ
  rationale: Giữ nguyên hình ảnh cụ thể của động từ Hy Lạp, không quyết định trong chính văn rằng Phao-lô nói theo nghĩa đen hay nghĩa bóng.
- source_word: ἐν Ἐφέσῳ
  choice: tại Ê-phê-sô
  rationale: Dùng dạng địa danh quen thuộc trong tiếng Việt.
- source_word: τί μοι τὸ ὄφελος
  choice: thì tôi được ích gì?
  rationale: Câu hỏi tu từ tự nhiên trong tiếng Việt, giữ ý về lợi ích dành cho người nói.
- source_word: νεκροὶ οὐκ ἐγείρονται
  choice: người chết không được sống lại
  rationale: Giữ thể bị động của động từ Hy Lạp và diễn đạt rõ ý phục sinh bằng tiếng Việt tự nhiên.
- source_word: Φάγωμεν καὶ πίωμεν
  choice: chúng ta hãy ăn và uống
  rationale: Thể hiện đúng lực thúc giục của hai động từ giả định khuyến dụ.
- source_word: αὔριον γὰρ ἀποθνῄσκομεν
  choice: vì ngày mai chúng ta sẽ chết
  rationale: Dùng thì tương lai tự nhiên trong tiếng Việt cho phát biểu hướng đến ngày mai, đồng thời giữ âm hưởng lời trích dẫn.
theological_decisions:
- issue: ἐθηριομάχησα là cuộc chiến với thú thật hay ẩn dụ về những đối thủ hung bạo
  choice: Giữ cách dịch theo nghĩa từ vựng là “chiến đấu với thú dữ” trong chính văn.
  alternative: Diễn giải là “đương đầu với những kẻ hung bạo”.
  rationale: Nguyên văn duy trì hình ảnh thú dữ nhưng không tự nó buộc người dịch phải giải quyết câu hỏi lịch sử; giữ hình ảnh bảo toàn sự mơ hồ và sức gợi của câu.
- issue: Phạm vi ý nghĩa của κατὰ ἄνθρωπον
  choice: 'Hiểu là bổ nghĩa cho cách Phao-lô trình bày: “nói theo cách của loài người”.'
  alternative: “Xét theo quan điểm của loài người” hoặc “vì những động cơ của loài người”.
  rationale: Cụm từ có thể chỉ cách nói hoặc góc nhìn của con người; chính văn chọn cách diễn đạt tự nhiên nhất, còn chú thích ghi nhận khả năng khác.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Giữ câu hỏi tu từ, hình ảnh “thú dữ,” thể bị động của sự sống lại và nhịp ngắn gọn của lời trích dẫn.
