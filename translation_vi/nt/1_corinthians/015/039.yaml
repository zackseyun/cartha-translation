  source_fidelity: Bản dịch phản ánh đúng mệnh đề phủ định phân loại của οὐ πᾶσα σὰρξ ἡ αὐτὴ σάρξ và chuỗi đối chiếu ἄλλη… ἄλλη… ἄλλη… ἄλλη. “Xác thịt” giữ nghĩa đen của σάρξ trong ngữ cảnh các dạng sinh thể, không chuyển sang nghĩa đạo đức hoặc “bản tính”. Các nhóm loài người, thú vật, chim và cá đều được chuyển đạt đầy đủ. Chú thích a bảo lưu hợp lý sự lặp lại của “xác thịt” trong nguyên ngữ.
  naturalness: Câu tiếng Việt hiện đại, trang trọng và dễ hiểu. Cấu trúc “một loại… một loại khác” tạo nhịp liệt kê song song tự nhiên mà không làm câu nặng vì lặp “xác thịt” quá mức. “Chim chóc” phù hợp văn cảnh liệt kê phổ thông và không gây đổi nghĩa đáng kể.
  terminology: “Xác thịt” là lựa chọn nhất quán và thích hợp cho σάρξ theo nghĩa vật chất. “Loài người”, “thú vật”, “chim chóc”, và “cá” diễn đạt rõ các phạm trù của câu. Không có vấn đề về thuật ngữ thần học, tên riêng, hoặc neo chú thích.
