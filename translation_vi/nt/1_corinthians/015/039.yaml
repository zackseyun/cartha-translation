id: 1CO.15.39
reference: 1 Corinthians 15:39
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οὐ πᾶσα σὰρξ ἡ αὐτὴ σάρξ, ἀλλὰ ἄλλη μὲν ἀνθρώπων, ἄλλη δὲ σὰρξ κτηνῶν, ἄλλη δὲ ⸂σὰρξ πτηνῶν⸃, ἄλλη δὲ ⸀ἰχθύων.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/039.yaml
  text: Not all flesh is the same flesh[a], but one kind is of humans, another flesh of animals, another of birds[b], and another of fish.
translation:
  language: vi
  text: Không phải mọi xác thịt đều cùng một loại[a]; nhưng xác thịt của loài người là một loại, của thú vật là một loại khác, của chim chóc là một loại khác, và của cá là một loại khác.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát hơn: “Không phải mọi xác thịt đều là cùng một xác thịt.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: σὰρξ
  choice: xác thịt
  rationale: Trong ngữ cảnh bàn về sự sống lại và các dạng thân thể của những loài thọ tạo, từ này mang nghĩa vật chất, không phải nghĩa ẩn dụ về bản tính tội lỗi. “Xác thịt” giữ được thuật ngữ và sự lặp lại có chủ ý của Phao-lô.
- source_word: οὐ πᾶσα σὰρξ ἡ αὐτὴ σάρξ
  choice: Không phải mọi xác thịt đều cùng một loại
  rationale: Cách diễn đạt này truyền đạt sự phân biệt theo loại trong câu Hy Lạp và tự nhiên hơn trong tiếng Việt so với việc lặp nguyên dạng “cùng một xác thịt”; chú thích bảo lưu cách dịch sát cấu trúc hơn.
- source_word: ἄλλη
  choice: một loại khác
  rationale: ἄλλη đánh dấu sự khác biệt giữa các hạng loại. Lặp “một loại khác” duy trì nhịp liệt kê và làm rõ sự đối chiếu.
- source_word: ἀνθρώπων
  choice: loài người
  rationale: Chỉ con người nói chung, không riêng nam giới; “loài người” cũng phù hợp với danh sách đối chiếu các nhóm sinh vật.
- source_word: κτηνῶν
  choice: thú vật
  rationale: κτῆνος có thể chỉ gia súc hoặc thú vật rộng hơn. Trong danh sách này, “thú vật” phân biệt tự nhiên với loài người, chim và cá mà không thu hẹp hẳn vào gia súc.
- source_word: πτηνῶν
  choice: chim chóc
  rationale: Diễn đạt tự nhiên nhóm sinh vật bay được nêu trong ngữ cảnh; không cần mở rộng thành mọi sinh vật có cánh.
- source_word: ἰχθύων
  choice: cá
  rationale: Từ thông dụng, chính xác cho nhóm sinh vật được nói đến.
theological_decisions:
- issue: Nghĩa của σάρξ trong đoạn văn của Phao-lô
  choice: Dịch theo nghĩa vật chất là “xác thịt”
  alternative: “thân thể” hoặc “bản tính”
  rationale: Mạch văn nói về các dạng sống thọ tạo và sự sống lại, nên σάρξ ở đây là phần xác vật chất chứ không phải “bản tính tội lỗi”. Giữ “xác thịt” cũng bảo toàn mối căng thẳng giữa câu này và thuật ngữ “thân thể” trong mạch văn rộng hơn.
- issue: Quan hệ giữa các loại xác thịt
  choice: Nêu rõ “một loại… một loại khác”
  alternative: Lặp sát chữ “xác thịt này… xác thịt khác”
  rationale: Câu Hy Lạp phân loại xác thịt của người, thú vật, chim và cá; cách dịch này làm rõ phép phân loại mà không giải thích thêm bản chất thần học của sự khác biệt.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng cấu trúc song song để giữ nhịp liệt kê của nguyên văn; “xác thịt” được giữ như thuật ngữ cụ thể, còn “một loại” giúp câu tiếng Việt tự nhiên.
