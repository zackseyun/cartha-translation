  text: τῷ δὲ θεῷ χάρις τῷ διδόντι ἡμῖν τὸ νῖκος διὰ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/057.yaml
  text: But thanks be to God[a], who gives us the victory through our Lord Jesus the Messiah.
translation:
  language: vi
  text: Nhưng tạ ơn Đức Chúa Trời, Đấng ban cho chúng ta chiến thắng qua Chúa chúng ta, là Đức Giê-su, Đấng Mê-si-a.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cách gọi truyền thống: “Đức Giê-su Christ.” Tước hiệu Hy Lạp Χριστός có nghĩa là “Đấng Mê-si-a.”'
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: Nhưng
  rationale: Đánh dấu sự chuyển ý có sắc thái tương phản từ quyền lực của tội lỗi và sự chết sang lời tạ ơn về chiến thắng Đức Chúa Trời ban.
- source_word: τῷ θεῷ χάρις
  choice: tạ ơn Đức Chúa Trời
  rationale: Trong công thức này, χάρις diễn tả lời cảm tạ chứ không mang nghĩa thông thường là ân điển; cách nói tiếng Việt tự nhiên vẫn giữ được sắc thái tôn vinh.
- source_word: τῷ διδόντι
  choice: Đấng ban
  rationale: Phân từ hiện tại có mạo từ chỉ Đức Chúa Trời là Đấng ban chiến thắng; “ban” phù hợp với văn phong trang trọng và hàm ý ân huệ.
- source_word: ἡμῖν τὸ νῖκος
  choice: cho chúng ta chiến thắng
  rationale: Diễn đạt rõ đối tượng tiếp nhận và chiến thắng cụ thể vừa được nói đến trong ngữ cảnh, tức chiến thắng trên sự chết.
- source_word: διὰ τοῦ κυρίου ἡμῶν
  choice: qua Chúa chúng ta
  rationale: διά với sở hữu cách chỉ phương tiện hoặc trung gian; “qua” giữ nguyên cấu trúc thần học mà không giải thích quá mức.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Đức Giê-su, Đấng Mê-si-a
  rationale: Giữ tên Giê-su và chuyển nghĩa tước hiệu Χριστός là Mê-si-a; thêm “Đấng” giúp tước hiệu tự nhiên, rõ nghĩa trong tiếng Việt.
theological_decisions:
- issue: Cách dịch Χριστοῦ trong cụm Ἰησοῦ Χριστοῦ
  choice: Đấng Mê-si-a trong chính văn
  alternative: Đấng Christ
  rationale: Χριστός là tước hiệu tương ứng với Mê-si-a. Chính văn làm rõ ý nghĩa tước hiệu, còn cách gọi truyền thống quen thuộc trong tiếng Việt được ghi ở chú thích.
- issue: Tính chất của chiến thắng
  choice: Không bổ sung “trên sự chết” vào chính văn
  alternative: chiến thắng trên sự chết
  rationale: Ngữ cảnh xác định đó là chiến thắng trên sự chết, nhưng câu Hy Lạp chỉ nói τὸ νῖκος; không nên đưa phần giải thích ngữ cảnh vào chính văn.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Trời” và “Đức Giê-su” theo lối Kinh Thánh Việt ngữ quen thuộc; câu giữ nhịp tạ ơn ngắn gọn của nguyên tác.
