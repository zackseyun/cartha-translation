id: 1CO.15.19
reference: 1 Corinthians 15:19
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἰ ἐν τῇ ζωῇ ταύτῃ ⸂ἐν Χριστῷ ἠλπικότες ἐσμὲν⸃ μόνον, ἐλεεινότεροι πάντων ἀνθρώπων ἐσμέν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/019.yaml
  text: If we have hoped in Messiah for this life only[c][b][a], we are more pitiable than all people.
translation:
  language: vi
  text: Nếu chúng ta đã đặt hy vọng nơi Đấng Mê-si chỉ cho đời này, thì chúng ta đáng thương hơn bất cứ ai.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “nơi Đấng Christ.” Từ Hy Lạp Χριστός là một tước hiệu, có thể dịch là “Đấng Mê-si” hoặc gọi theo truyền thống là “Đấng Christ.”
    reason: alternative_reading
  - marker: b
    text: 'Cũng có thể dịch: “đáng thương nhất trong mọi người.” Dạng so sánh trong tiếng Hy Lạp có thể được diễn đạt tự nhiên bằng ý cao nhất trong nhóm.'
    reason: lexical_alternative
  - marker: c
    text: 'Sát trật tự câu Hy Lạp hơn: “Nếu chỉ trong đời này chúng ta đã đặt hy vọng nơi Đấng Mê-si.”'
    reason: previous_rendering
lexical_decisions:
- source_word: εἰ
  choice: nếu… thì
  rationale: Diễn đạt tự nhiên cấu trúc điều kiện trong tiếng Việt, với “thì” làm rõ mệnh đề kết quả.
- source_word: ἐν τῇ ζωῇ ταύτῃ
  choice: cho đời này
  rationale: Trong quan hệ với μόνον, cách diễn đạt này cho thấy niềm hy vọng bị giới hạn vào đời sống hiện tại, đồng thời tránh cách hiểu rằng họ chỉ thực hiện hành động hy vọng mà không làm gì khác.
- source_word: ἐν Χριστῷ
  choice: nơi Đấng Mê-si
  rationale: “Nơi” giữ được sắc thái liên kết của công thức Phao-lô ἐν Χριστῷ; “Đấng Mê-si” chuyển tải Χριστός như một tước hiệu.
- source_word: ἠλπικότες ἐσμὲν
  choice: chúng ta đã đặt hy vọng
  rationale: '“Đã đặt hy vọng” diễn đạt thể hoàn thành vòng quanh trong tiếng Hy Lạp: một niềm hy vọng đã được đặt và vẫn có hiệu lực.'
- source_word: μόνον
  choice: chỉ… thôi
  rationale: Cặp từ tự nhiên trong tiếng Việt, nhấn mạnh rằng phạm vi của niềm hy vọng chỉ giới hạn ở đời này.
- source_word: ἐλεεινότεροι
  choice: đáng thương hơn
  rationale: Giữ hình thức so sánh hơn của tính từ Hy Lạp và ý nghĩa là đáng được thương xót, thay vì chuyển sang “khốn khổ hơn”.
- source_word: πάντων ἀνθρώπων
  choice: tất cả mọi người
  rationale: Chỉ toàn thể loài người chứ không riêng nam giới, đồng thời giữ phạm vi phổ quát của phép so sánh.
theological_decisions:
- issue: Cách dịch Χριστῷ trong công thức ἐν Χριστῷ của Phao-lô
  choice: nơi Đấng Mê-si
  alternative: trong Đấng Christ
  rationale: Bản chính giữ ý nghĩa tước hiệu của Χριστός và sắc thái liên kết của giới từ ἐν; chú thích bảo lưu cách gọi truyền thống.
- issue: Phạm vi của μόνον trong mệnh đề điều kiện
  choice: niềm hy vọng nơi Đấng Mê-si bị giới hạn vào đời này
  alternative: Nếu chỉ trong đời này chúng ta đã đặt hy vọng nơi Đấng Mê-si
  rationale: Cách dịch chính làm rõ trọng tâm tu từ mà không thêm kết luận thần học ngoài câu; chú thích bảo lưu trật tự gần nguyên văn hơn.
- issue: Giá trị của dạng so sánh ἐλεεινότεροι
  choice: đáng thương hơn tất cả mọi người
  alternative: đáng thương nhất trong mọi người
  rationale: Giữ nguyên hình thức so sánh của tiếng Hy Lạp, trong khi ghi nhận rằng tiếng Việt có thể diễn đạt thành ý cao nhất trong nhóm.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc “nếu… thì” rõ ràng; “chỉ… thôi” tạo nhấn mạnh tự nhiên. “Đấng Mê-si” được dùng như tước hiệu, còn cách gọi “Đấng Christ” được bảo lưu trong chú thích.
