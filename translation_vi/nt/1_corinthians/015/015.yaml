revisions:
- from: Thế thì, chúng tôi còn bị chứng tỏ là những người làm chứng gian về Đức Chúa Trời[a], vì chúng tôi đã làm chứng chống lại Đức Chúa Trời rằng Ngài đã khiến Đấng Mê-si-a[b] sống lại—Đấng mà Ngài đã không khiến sống lại, nếu quả thật người chết không được sống lại.
  to: Thế thì, hóa ra chúng tôi lại là những người làm chứng gian về Đức Chúa Trời[a], vì chúng tôi đã làm chứng chống lại Đức Chúa Trời rằng Ngài đã khiến Đấng Mê-si-a[b] sống lại—Đấng mà Ngài đã không khiến sống lại, nếu quả thật người chết không được sống lại.
  rationale: Chỉ thay «bị chứng tỏ là» bằng «hóa ra ... là» để câu văn hiện đại và trôi chảy hơn. Bản sửa không thay đổi quan hệ cú pháp, chủ thể hành động, tính điều kiện, hay sắc thái của các thuật ngữ then chốt trong nguyên văn.
