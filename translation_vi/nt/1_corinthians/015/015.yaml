id: 1CO.15.15
reference: 1 Corinthians 15:15
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εὑρισκόμεθα δὲ καὶ ψευδομάρτυρες τοῦ θεοῦ, ὅτι ἐμαρτυρήσαμεν κατὰ τοῦ θεοῦ ὅτι ἤγειρεν τὸν Χριστόν, ὃν οὐκ ἤγειρεν εἴπερ ἄρα νεκροὶ οὐκ ἐγείρονται.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/015.yaml
  text: Then we are even found to be false witnesses about God[a], because we testified about God that he raised the Messiah[b], whom he did not raise if in fact the dead are not raised.
translation:
  language: vi
  text: Thế thì, hóa ra chúng tôi lại là những người làm chứng gian về Đức Chúa Trời[a], vì chúng tôi đã làm chứng chống lại Đức Chúa Trời rằng Ngài đã khiến Đấng Mê-si-a[b] sống lại—Đấng mà Ngài đã không khiến sống lại, nếu quả thật người chết không được sống lại.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể hiểu là “những người làm chứng gian chống lại Đức Chúa Trời”. Cấu trúc sở hữu cách Hy Lạp có thể chỉ lời chứng liên quan đến Đức Chúa Trời; cụm “chống lại Đức Chúa Trời” ngay sau đó ủng hộ sắc thái mạnh hơn.
    reason: lexical_alternative
  - marker: b
    text: Tiếng Hy Lạp là Christos, nghĩa là “Đấng Mê-si-a” hay “Đấng được xức dầu”; ở đây từ này được dùng như một tước hiệu.
    reason: alternative_reading
lexical_decisions:
- source_word: εὑρισκόμεθα
  choice: chúng tôi ... bị chứng tỏ là
  rationale: Dạng hiện tại bị động diễn tả việc họ bị xác định hoặc bị phơi bày là như thế; cách dịch này tự nhiên hơn lối dịch sát chữ “được tìm thấy là” trong tiếng Việt.
- source_word: δὲ καὶ
  choice: Thế thì ... còn
  rationale: “Thế thì” thể hiện kết luận suy ra từ lập luận trước đó, còn “còn” giữ sắc thái tăng tiến của καί.
- source_word: ψευδομάρτυρες τοῦ θεοῦ
  choice: những người làm chứng gian về Đức Chúa Trời
  rationale: “Làm chứng gian” giữ sắc thái pháp lý của ψευδομάρτυρες; “về Đức Chúa Trời” hiểu sở hữu cách là đối tượng/nội dung của lời chứng nhưng không che khuất khả năng hiểu mạnh hơn, được ghi ở chú thích.
- source_word: ἐμαρτυρήσαμεν κατὰ τοῦ θεοῦ
  choice: chúng tôi đã làm chứng chống lại Đức Chúa Trời
  rationale: κατά với sở hữu cách thường mang nghĩa “chống lại”. Trong giả định của Phao-lô, việc gán cho Đức Chúa Trời một hành động Ngài không làm khiến lời chứng ấy chống lại chính Ngài.
- source_word: ἤγειρεν
  choice: đã khiến ... sống lại
  rationale: 'Diễn đạt tác động ngoại tại của động từ chủ động: Đức Chúa Trời làm cho Đấng Mê-si-a sống lại; thì quá khứ phù hợp với hành động được tuyên xưng.'
- source_word: τὸν Χριστόν
  choice: Đấng Mê-si-a
  rationale: Mạo từ và ngữ cảnh lập luận về sự phục sinh cho thấy Χριστός mang chức năng tước hiệu; “Đấng Mê-si-a” chuyển tải nghĩa ấy thay vì dùng dạng tên riêng.
- source_word: εἴπερ ἄρα
  choice: nếu quả thật
  rationale: Giữ lực của một tiền đề có điều kiện được nêu ra để lập luận, đồng thời tự nhiên trong tiếng Việt.
- source_word: νεκροὶ οὐκ ἐγείρονται
  choice: người chết không được sống lại
  rationale: “Người chết” chỉ những người đã chết nói chung; dạng bị động giữ trọng tâm rằng sự sống lại là điều được thực hiện cho họ.
theological_decisions:
- issue: Cách dịch Χριστός
  choice: Đấng Mê-si-a
  alternative: Đấng Christ
  rationale: Ở đây từ này hoạt động như một tước hiệu trong lập luận về việc Đức Chúa Trời khiến Đấng được xức dầu sống lại; bản dịch nghĩa làm rõ chức năng ấy mà không thêm lập trường giáo phái.
- issue: Sắc thái của κατὰ τοῦ θεοῦ
  choice: chống lại Đức Chúa Trời
  alternative: về Đức Chúa Trời
  rationale: 'κατά với sở hữu cách có nghĩa thông thường là “chống lại”. Cách dịch này bảo tồn mức độ nghiêm trọng và sự căng thẳng trong lập luận: nếu không có sự sống lại, các sứ đồ đã gán cho Đức Chúa Trời điều Ngài không làm.'
- issue: Chủ thể làm cho sống lại
  choice: Ngài đã khiến Đấng Mê-si-a sống lại
  alternative: Đấng Mê-si-a đã sống lại
  rationale: Nguyên văn đặt Đức Chúa Trời làm chủ thể của ἤγειρεν; bản dịch giữ cấu trúc ấy thay vì chuyển sang cách nói nội động có thể làm mờ tác nhân.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Dùng “Đức Chúa Trời” và đại từ “Ngài” theo lối kính trọng phổ biến; giữ phép lặp “khiến ... sống lại” của nguyên văn để bảo toàn sức nặng lập luận. Dấu gạch ngang giúp câu dài sáng rõ mà không thay đổi quan hệ cú pháp.
