  text: ἐπειδὴ γὰρ δι’ ἀνθρώπου ⸀θάνατος, καὶ δι’ ἀνθρώπου ἀνάστασις νεκρῶν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/021.yaml
  text: For since death came through a man[b][a], the resurrection of the dead also came through a man.
translation:
  language: vi
  text: Vì sự chết đã bởi một người mà đến, thì sự sống lại của người chết cũng bởi một người mà đến.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch “qua một người” ở cả hai vế; giới từ Hy Lạp có thể chỉ tác nhân hoặc phương tiện trung gian.
    reason: lexical_alternative
  - marker: b
    text: Văn cảnh xác định hai người này là A-đam và Đấng Christ (xem 15:22, 45).
    reason: cross_reference
lexical_decisions:
- source_word: ἐπειδὴ γὰρ
  choice: Vì ... thì
  rationale: ἐπειδή cùng γάρ nêu nền tảng giải thích cho lập luận trước. Cấu trúc “Vì ... thì cũng ...” diễn đạt tự nhiên quan hệ lý do và sự tương ứng giữa hai vế.
- source_word: δι’ ἀνθρώπου
  choice: bởi một người
  rationale: διά với sở hữu cách có thể chỉ tác nhân hoặc phương tiện trung gian. “Bởi một người” giữ nguyên số ít không có mạo từ và phù hợp với sự đối chiếu A-đam—Đấng Christ trong văn cảnh.
- source_word: θάνατος
  choice: có sự chết
  rationale: Nguyên văn không có động từ. Thêm “có” để câu tiếng Việt hoàn chỉnh mà không xác định quá mức sắc thái xuất hiện hay nguồn gốc.
- source_word: καὶ
  choice: cũng
  rationale: “Cũng” làm rõ sự tương ứng của vế thứ hai với vế thứ nhất.
- source_word: ἀνάστασις νεκρῶν
  choice: sự sống lại của những người chết
  rationale: Cách dịch này giữ nghĩa cụ thể về sự sống lại của người chết trong lập luận của Phao-lô, không làm mờ thành một ý niệm chung về đời sau.
theological_decisions:
- issue: Sự đối chiếu mang tính đại diện giữa A-đam và Đấng Christ
  choice: Giữ “một người” trong cả hai vế, không đưa tên hai nhân vật vào chính văn.
  alternative: Dịch “một người là A-đam ... một người là Đấng Christ” hoặc “một người duy nhất”.
  rationale: Câu này phát biểu nguyên tắc bằng hai vế song song; văn cảnh xác định hai người là A-đam và Đấng Christ. Không thêm tên hoặc từ “duy nhất” giúp giữ sát wording và tính hàm súc của nguyên văn.
- issue: Bản chất của sự sống lại
  choice: Dịch ἀνάστασις νεκρῶν là “sự sống lại của những người chết”.
  alternative: Dịch thành “sự sống thuộc linh” hoặc “đời sống sau khi chết”.
  rationale: Lập luận trong 1 Cô-rinh-tô 15 nói về sự sống lại thực sự của người chết; bản dịch không nên thuộc linh hóa hoặc làm mơ hồ khẳng định này.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Hai vế được giữ cân xứng để phản ánh cấu trúc lập luận của Phao-lô; “sự chết” và “sự sống lại” duy trì sắc thái thần học quen thuộc mà không mang nét riêng của một hệ phái.
