  text: Why are we also in danger every hour?[a]
translation:
  language: vi
  text: Tại sao chúng tôi cũng gặp hiểm nguy mỗi giờ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc, sát cấu trúc: “Vậy chúng tôi thì sao mà mỗi giờ đều gặp hiểm nguy?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: τί
  choice: Tại sao
  rationale: 'Trong câu hỏi tu từ này, τί hỏi về lý do hoặc mục đích của việc hành động trong mạch lập luận: nếu người chết không sống lại, tại sao các sứ đồ lại chịu hiểm nguy?'
- source_word: καὶ
  choice: cũng
  rationale: 'Diễn đạt ý bổ sung: Phao-lô và những người cùng ông được kể thêm vào các trường hợp vừa nêu.'
- source_word: ἡμεῖς
  choice: chính chúng tôi
  rationale: Đại từ được nêu rõ trong tiếng Hy Lạp có sắc thái nhấn mạnh; “chính chúng tôi” giữ được nét ấy và phân biệt nhóm của Phao-lô với các trường hợp trước.
- source_word: κινδυνεύομεν
  choice: phải đối mặt với hiểm nguy
  rationale: Diễn đạt tự nhiên ý đang ở trong tình trạng nguy hiểm mà không thu hẹp thành riêng nguy cơ mất mạng.
- source_word: πᾶσαν ὥραν
  choice: luôn
  rationale: Cụm chỉ thời gian có nghĩa đen là “mỗi giờ”, được dùng theo nghĩa liên tục. “Luôn” tự nhiên trong tiếng Việt; nghĩa sát chữ được ghi ở chú thích.
theological_decisions:
- issue: Sức nặng tu từ trong lập luận về sự sống lại
  choice: Giữ câu hỏi tu từ, nêu sự phi lý của việc các sứ đồ liên tục chịu hiểm nguy nếu người chết không sống lại.
  alternative: Đọc như một câu hỏi đơn thuần nhằm xin thông tin.
  rationale: Cú pháp Hy Lạp và văn cảnh trực tiếp của 1 Cô-rinh-tô 15 cho thấy đây là câu hỏi tu từ; bản dịch không thêm kết luận tín lý ngoài điều mạch văn hàm ý.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “đối mặt với hiểm nguy” để giữ nghĩa rộng của κινδυνεύομεν; dùng “luôn” cho thành ngữ thời gian πᾶσαν ὥραν, đồng thời bảo tồn cách nói sát chữ trong chú thích.
