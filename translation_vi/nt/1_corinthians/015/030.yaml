- from: Tại sao chính chúng tôi cũng luôn phải đối mặt với hiểm nguy?[a]
  to: Tại sao chúng tôi cũng gặp hiểm nguy mỗi giờ?[a]
  rationale: Bản sửa giữ nguyên câu hỏi tu từ, ý “cũng” của καὶ, và đại từ chỉ nhóm Phao-lô, đồng thời dịch κινδυνεύομεν và πᾶσαν ὥραν trực tiếp hơn. Chú thích bảo tồn khả năng diễn đạt cấu trúc có τί theo hướng “Vậy chúng tôi thì sao?” mà không thay đổi ý trong văn mạch.
