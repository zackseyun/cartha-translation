id: 1CO.15.41
reference: 1 Corinthians 15:41
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἄλλη δόξα ἡλίου, καὶ ἄλλη δόξα σελήνης, καὶ ἄλλη δόξα ἀστέρων, ἀστὴρ γὰρ ἀστέρος διαφέρει ἐν δόξῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/041.yaml
  text: There is one glory of the sun[a], and another glory of the moon, and another glory of the stars; for star differs from star in glory.
translation:
  language: vi
  text: 'Vinh quang của mặt trời khác, vinh quang của mặt trăng khác, và vinh quang của các ngôi sao cũng khác; vì ngôi sao này khác ngôi sao kia về vinh quang.[a]


    [a] Cũng có thể dịch “vẻ huy hoàng” hoặc “ánh sáng rực rỡ” ở mọi chỗ trong câu này. Từ Hy Lạp δόξα tại đây có thể chỉ ánh sáng thấy được, nhưng “vinh quang” giữ nguyên từ ngữ được Phao-lô lặp lại trong lập luận xung quanh.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch “vẻ huy hoàng” hoặc “ánh sáng rực rỡ” ở mọi chỗ trong câu này. Từ Hy Lạp δόξα tại đây có thể chỉ ánh sáng thấy được, nhưng “vinh quang” giữ nguyên từ ngữ được Phao-lô lặp lại trong lập luận xung quanh.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλη
  choice: khác
  rationale: Từ được lặp lại để phân biệt vinh quang của mặt trời, mặt trăng và các ngôi sao; cấu trúc “... khác” tự nhiên trong tiếng Việt và giữ rõ sự tương phản.
- source_word: δόξα
  choice: vinh quang
  rationale: Trong hình ảnh thiên thể, từ này bao hàm vẻ huy hoàng hay ánh sáng rực rỡ; “vinh quang” đồng thời giữ mối liên hệ từ vựng với lập luận về thân thể phục sinh.
- source_word: ἡλίου / σελήνης / ἀστέρων
  choice: của mặt trời / của mặt trăng / của các ngôi sao
  rationale: Giữ quan hệ sở hữu/phụ thuộc của các danh từ thuộc cách với δόξα và ba vế song song của nguyên văn.
- source_word: ἀστὴρ ... ἀστέρος
  choice: ngôi sao này ... ngôi sao kia
  rationale: Diễn đạt tự nhiên phép so sánh giữa hai cá thể cùng loại, không biến nó thành nhận định về các loại sao.
- source_word: γὰρ
  choice: vì
  rationale: Đánh dấu lời giải thích cho vế trước một cách gọn và tự nhiên.
- source_word: διαφέρει
  choice: khác
  rationale: Diễn tả sự khác biệt mà không áp đặt ý mạnh hơn là ngôi sao này vượt trội ngôi sao kia.
- source_word: ἐν δόξῃ
  choice: về vinh quang
  rationale: Nêu phương diện mà ngôi sao này khác ngôi sao kia và giữ nguyên từ khóa δόξα.
theological_decisions:
- issue: Cách dịch δόξα trong phép so sánh thiên thể thuộc lập luận về sự phục sinh
  choice: vinh quang
  alternative: vẻ huy hoàng; ánh sáng rực rỡ
  rationale: Ngữ cảnh trực tiếp gợi đến độ rực sáng khác nhau của các thiên thể, nhưng “vinh quang” bảo toàn sự lặp từ và mối liên hệ thần học với thân thể phục sinh mà không thu hẹp nghĩa chỉ còn độ sáng vật lý.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng cấu trúc song song để phản ánh nhịp điệu nguyên văn; “ngôi sao này ... ngôi sao kia” là cách diễn đạt tự nhiên cho phép so sánh từng sao.
