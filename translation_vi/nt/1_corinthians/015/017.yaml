id: 1CO.15.17
reference: 1 Corinthians 15:17
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἰ δὲ Χριστὸς οὐκ ἐγήγερται, ματαία ἡ πίστις ⸀ὑμῶν, ἔτι ἐστὲ ἐν ταῖς ἁμαρτίαις ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/017.yaml
  text: But if Messiah has not been raised[a], your faith is futile[b]; you are still in your sins.
translation:
  language: vi
  text: Nhưng nếu Đấng Mê-si đã không được làm cho sống lại[a], thì đức tin của anh chị em là vô ích[b]; anh chị em vẫn còn ở trong tội lỗi của mình.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “Đấng Christ đã không được làm cho sống lại.”'
    reason: alternative_reading
  - marker: b
    text: 'Cũng có thể dịch: “hão huyền.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Χριστὸς
  choice: Đấng Mê-si
  rationale: Giữ nghĩa tước hiệu của Χριστός là Đấng được xức dầu, đồng thời dùng cách gọi dễ nhận biết trong tiếng Việt hiện đại.
- source_word: ἐγήγερται
  choice: đã không được làm cho sống lại
  rationale: Dạng hoàn thành thụ động được giữ lại nhằm diễn tả một biến cố đã xảy ra với hệ quả hiện tại và không nói rõ tác nhân, như nguyên văn.
- source_word: ματαία
  choice: vô ích
  rationale: Diễn đạt rõ rằng đức tin ấy không đạt được kết quả và không có giá trị nếu Đấng Mê-si không được làm cho sống lại.
- source_word: πίστις
  choice: đức tin
  rationale: Trong ngữ cảnh này, từ này chỉ sự tin của các tín hữu Cô-rinh-tô, chứ không chủ yếu nói đến lòng trung tín.
- source_word: ἔτι
  choice: vẫn còn
  rationale: Diễn tả tự nhiên trạng thái tiếp tục tồn tại do giả thiết Đấng Mê-si không được làm cho sống lại.
- source_word: ἐν ταῖς ἁμαρτίαις ὑμῶν
  choice: ở trong tội lỗi của mình
  rationale: Giữ hình ảnh và cấu trúc của nguyên văn về tình trạng họ vẫn bị gắn chặt với tội lỗi.
- source_word: δὲ
  choice: Nhưng
  rationale: Thể hiện quan hệ tương phản với lập luận ngay trước đó.
theological_decisions:
- issue: Cách diễn đạt sự sống lại và tác nhân
  choice: đã không được làm cho sống lại
  alternative: đã không tự sống lại
  rationale: Cách dịch thụ động bảo toàn lối nói của Phao-lô và không thêm danh tính của tác nhân mà tiếng Hy Lạp không nêu rõ.
- issue: Cách dịch Χριστός
  choice: Đấng Mê-si
  alternative: Đấng Christ
  rationale: Ở đây Χριστός mang giá trị tước hiệu trong một khẳng định thần học về Đấng được xức dầu; cách dịch này làm rõ nghĩa ấy thay vì mặc nhiên coi từ này là tên riêng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “anh chị em” diễn đạt số nhiều ὑμῶν một cách tự nhiên; cấu trúc điều kiện và dấu chấm phẩy giữ nhịp lập luận mạnh, cô đọng của câu Hy Lạp.
