  source_fidelity: 'Bản dịch phản ánh đúng cấu trúc điều kiện và ý nghĩa của nguyên văn: δὲ được chuyển là “Nhưng”; ἐγήγερται được giữ ở thể bị động với sắc thái biến cố đã xảy ra; ματαία là “vô ích”; và ἔτι ... ἐν ταῖς ἁμαρτίαις ὑμῶν là tình trạng vẫn còn trong tội lỗi của chính người nghe. “Đấng Mê-si” bảo toàn giá trị tước hiệu của Χριστός mà không biến thành tên riêng.'
  naturalness: Văn bản rõ ràng, trang trọng và tự nhiên trong tiếng Việt hiện đại. “Anh chị em” phù hợp với ngôi số nhiều mục vụ của thư tín. Cụm “được làm cho sống lại” hơi tường minh theo hướng bị động/nhân quả, nhưng là cách diễn đạt Việt ngữ chấp nhận được và bảo toàn dụng ý không nêu tác nhân của nguyên văn.
  terminology: '“Đấng Mê-si,” “đức tin,” “vô ích,” và “tội lỗi” nhất quán với các thuật ngữ thần học và không áp đặt diễn giải giáo phái. Các chú thích được neo đúng vị trí: [a] nêu phương án “Đấng Christ,” [b] nêu phương án từ vựng cho ματαία.'
