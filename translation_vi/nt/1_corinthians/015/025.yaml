- from: Vì Đấng Christ phải trị vì cho đến khi Đức Chúa Trời đặt mọi kẻ thù dưới chân Ngài.[a][b]
  to: Vì Đấng Christ phải trị vì cho đến khi Ngài đặt mọi kẻ thù dưới chân mình.[a][b]
  rationale: 'Sửa chủ ngữ của “đặt” để theo mạch cú pháp của nguyên văn: Đấng Christ phải trị vì cho đến khi chính Ngài đặt mọi kẻ thù dưới chân mình. Điều này không giải quyết vượt quá văn bản bất cứ vấn đề thần học nào về thời điểm hoặc sự tiếp diễn của sự trị vì. Chú thích a được thay để ghi nhận lựa chọn thời-thể tương ứng với ghi chú kiểm tra tiếng Anh; chú thích b được giữ nguyên nội dung và mỏ neo.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T19:24:17Z'
review_pass:
  verdict: revise
  source_fidelity: Bản nháp đã dịch đúng ý chính của δεῖ γὰρ αὐτὸν βασιλεύειν là Đấng Christ phải trị vì và giữ đúng hình ảnh “dưới chân.” Tuy nhiên, việc đưa “Đức Chúa Trời” vào làm chủ ngữ của θῇ vượt quá điều văn bản Hy Lạp nêu ra. Trong mạch cú pháp, chủ ngữ ngầm tự nhiên của θῇ là Đấng Christ, tức chủ thể của βασιλεύειν; bản dịch không nên thay bằng một chủ thể khác.
  naturalness: “Vì Đấng Christ phải trị vì cho đến khi Ngài đặt mọi kẻ thù dưới chân mình” là tiếng Việt hiện đại, trang trọng, rõ quy chiếu và giữ phép ẩn dụ của nguyên văn. “Mình” quy chiếu tự nhiên về Đấng Christ trong cùng mệnh đề.
  terminology: Giữ “Đấng Christ,” “trị vì,” và “mọi kẻ thù” là phù hợp với văn cảnh và thuật ngữ Kinh Thánh tiếng Việt. Không cần thêm “Đức Chúa Trời” vào câu. Chú thích về biến thể cách diễn đạt thời-thể nên phản ánh rằng tiếng Hy Lạp không buộc phải chọn giữa “đặt” và “đã đặt.”
  issues:
  - severity: high
    issue: Bản dịch thêm “Đức Chúa Trời” làm chủ ngữ của động từ θῇ.
    rationale: Nguyên văn không nêu chủ ngữ riêng cho θῇ, nhưng mạch cú pháp liên kết động từ này với Đấng Christ, là chủ thể của “phải trị vì.” Gán Đức Chúa Trời làm chủ ngữ trong bản văn chính làm thay đổi tác nhân được biểu đạt tự nhiên nhất và đưa một cách giải thích vào bản dịch.
  - severity: high
    issue: Chú thích a khẳng định sai rằng tiếng Hy Lạp không nêu rõ chủ thể và rằng có thể hiểu ngang nhau là Đức Chúa Trời hoặc Đấng Christ.
    rationale: Dù θῇ không có đại từ chủ ngữ được viết ra, cú pháp và ngữ cảnh trực tiếp ưu tiên Đấng Christ. Chú thích nên nói về lựa chọn diễn đạt thời-thể (“đặt”/“đã đặt”), theo dấu vết kiểm tra tiếng Anh, thay vì tạo một mơ hồ tác nhân không được văn cảnh hỗ trợ.
  revised_text: Vì Đấng Christ phải trị vì cho đến khi Ngài đặt mọi kẻ thù dưới chân mình.[a][b]
