source:
  edition: SBLGNT
  text: δεῖ γὰρ αὐτὸν βασιλεύειν ἄχρι ⸀οὗ θῇ πάντας τοὺς ἐχθροὺς ὑπὸ τοὺς πόδας αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/025.yaml
  text: For he must reign until he has put all his enemies under his feet[a][b].
translation:
  language: vi
  text: Vì Đấng Christ phải trị vì cho đến khi Ngài đặt mọi kẻ thù dưới chân mình.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “cho đến khi Ngài đã đặt mọi kẻ thù dưới chân mình.” Cách diễn đạt Hy Lạp không tự nó buộc phải phân biệt giữa hai cách thể hiện thời-thể này trong tiếng Việt.'
    reason: lexical_alternative
  - marker: b
    text: Hình ảnh đặt kẻ thù “dưới chân” biểu thị sự khuất phục hoàn toàn; xem Thi Thiên 110:1.
    reason: cross_reference
lexical_decisions:
- source_word: δεῖ
  choice: phải
  rationale: Diễn tả tính tất yếu, phù hợp với ý về sự cần thiết hoặc điều chắc chắn theo chương trình của Đức Chúa Trời.
- source_word: γὰρ
  choice: Vì
  rationale: Giữ mối liên kết giải thích với câu trước bằng một từ nối tự nhiên và trang trọng trong tiếng Việt.
- source_word: αὐτὸν
  choice: Đấng Christ
  rationale: Đại từ Hy Lạp chỉ Đấng Christ theo ngữ cảnh gần (câu 22–24). Nêu rõ chủ thể giúp tiếng Việt tránh đại từ mơ hồ.
- source_word: βασιλεύειν
  choice: trị vì
  rationale: Diễn đạt chính xác quyền cai trị của một vị vua, đồng thời giữ sắc thái vương quyền.
- source_word: ἄχρι οὗ
  choice: cho đến khi
  rationale: Đánh dấu một mốc thời gian nhưng tự nó không khẳng định sự trị vì chấm dứt sau mốc ấy.
- source_word: θῇ
  choice: Đức Chúa Trời đặt
  rationale: Động từ aorist subjunctive của τίθημι không nêu chủ thể riêng; chủ thể ngầm có thể được hiểu là Đức Chúa Trời, phù hợp với tiếng vọng Thi Thiên 110:1 và sự phân biệt chủ thể trong câu 27. Bản dịch làm rõ cách hiểu này nhưng ghi nhận khả năng khác trong chú thích.
- source_word: πάντας τοὺς ἐχθροὺς
  choice: mọi kẻ thù
  rationale: Giữ trọn ý bao quát của πάντας và diễn đạt tự nhiên trong tiếng Việt; quan hệ với Đấng Christ đã rõ từ ngữ cảnh.
- source_word: ὑπὸ τοὺς πόδας αὐτοῦ
  choice: dưới chân Ngài
  rationale: Giữ nguyên hình ảnh Kinh Thánh về sự khuất phục hoàn toàn; “Ngài” quy chiếu về Đấng Christ.
theological_decisions:
- issue: Chủ thể của θῇ (“đặt”)
  choice: Hiểu Đức Chúa Trời là chủ thể đặt các kẻ thù dưới chân Đấng Christ.
  alternative: 'Hiểu Đấng Christ là chủ thể: “cho đến khi Ngài đặt mọi kẻ thù dưới chân mình.”'
  rationale: Bản Hy Lạp không có chủ ngữ được viết rõ cho θῇ. Thi Thiên 110:1, nền tảng của hình ảnh này, và lập luận trong câu 27 ủng hộ việc hiểu Đức Chúa Trời là chủ thể; tuy nhiên, ngữ pháp cũng cho phép lấy Đấng Christ làm chủ thể, nên chú thích bảo tồn sự mơ hồ.
- issue: Lực thời gian của ἄχρι οὗ (“cho đến khi”)
  choice: Dịch trực tiếp là “cho đến khi” mà không hàm ý sự trị vì của Đấng Christ chấm dứt sau đó.
  alternative: Hiểu rằng sự trị vì của Đấng Christ kết thúc khi mọi kẻ thù đã bị khuất phục.
  rationale: Cụm từ Hy Lạp xác định mốc mà hành động đang được nhấn mạnh hướng tới, nhưng tự nó không khẳng định điều gì xảy ra với sự trị vì sau mốc đó.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Đấng Christ” để xác định rõ chủ thể theo ngữ cảnh, “trị vì” để giữ sắc thái vương quyền, và bảo tồn hình ảnh “dưới chân” thay vì diễn giải thành một mệnh đề trừu tượng.
