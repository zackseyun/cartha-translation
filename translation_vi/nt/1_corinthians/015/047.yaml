  source_fidelity: 'Bản dịch giữ đúng cấu trúc đối chiếu của tiếng Hy Lạp: “người thứ nhất … người thứ hai,” cùng hai nguồn gốc “từ đất” và “từ trời.” “Được làm bằng bụi đất” là cách diễn đạt rõ ràng, phù hợp cho χοϊκός trong mạch văn A-đam/Đấng Christ; chú thích cũng bảo lưu các sắc thái từ vựng khác. Không thêm tên Đấng Christ vào bản văn.'
