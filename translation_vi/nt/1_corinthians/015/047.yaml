id: 1CO.15.47
reference: 1 Corinthians 15:47
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ πρῶτος ἄνθρωπος ἐκ γῆς χοϊκός, ὁ δεύτερος ⸀ἄνθρωπος ἐξ οὐρανοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/047.yaml
  text: The first man was from the earth[a], made of dust; the second man is from heaven.
translation:
  language: vi
  text: Người thứ nhất đến từ đất, được làm bằng bụi đất[a]; người thứ hai đến từ trời.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “thuộc về đất” hoặc “bằng bụi đất”. Tính từ Hy Lạp χοϊκός gợi lại việc A-đam được tạo nên từ bụi đất.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πρῶτος
  choice: thứ nhất
  rationale: Giữ nghĩa số thứ tự và sự đối chiếu song song giữa A-đam với người thứ hai.
- source_word: ἄνθρωπος
  choice: người
  rationale: Trong ngữ cảnh này, danh từ chỉ lần lượt A-đam và Đấng Christ với tư cách những con người đại diện; “người” tự nhiên trong tiếng Việt và vẫn giữ được kiểu hình A-đam/Đấng Christ.
- source_word: ἐκ γῆς
  choice: đến từ đất
  rationale: Diễn đạt nguồn gốc theo ἐκ và giữ liên hệ với trình thuật con người được dựng nên từ đất.
- source_word: χοϊκός
  choice: được làm bằng bụi đất
  rationale: Truyền đạt nghĩa thuộc về hoặc làm từ bụi đất, đồng thời làm rõ tiếng vọng của trình thuật sáng tạo mà không thu hẹp từ này chỉ còn một tính chất trừu tượng.
- source_word: δεύτερος
  choice: thứ hai
  rationale: Giữ nguyên sự tương ứng hình thức với “thứ nhất” trong phép đối chiếu của Phao-lô.
- source_word: ἄνθρωπος
  choice: người
  rationale: 'Lặp lại “người” để bảo toàn cấu trúc song song có chủ ý: “người thứ nhất… người thứ hai”.'
- source_word: ἐξ οὐρανοῦ
  choice: đến từ trời
  rationale: Diễn đạt nguồn gốc thiên thượng; “trời” phù hợp với nghĩa thần học trong ngữ cảnh hơn “bầu trời”.
theological_decisions:
- issue: Ý nghĩa Cơ Đốc học của “người thứ hai”
  choice: Giữ “người thứ hai” mà không thêm tên “Đấng Christ”.
  alternative: Người thứ hai, là Đấng Christ, đến từ trời.
  rationale: Ngữ cảnh xác định người thứ hai là Đấng Christ, nhưng câu Hy Lạp không nêu tên ngài; không thêm lời giải thích giúp giữ nguyên cách diễn đạt và sức căng thần học của bản văn.
- issue: Thì của mệnh đề thứ hai
  choice: Dùng “đến từ trời” không thêm “đã”.
  alternative: Người thứ hai đã đến từ trời.
  rationale: Tiếng Hy Lạp lược bỏ động từ nối. Cách dịch không thêm dấu hiệu quá khứ giữ được cách hiểu như một khẳng định hiện tại hoặc thường tồn về nguồn gốc thiên thượng, thay vì ép mệnh đề theo thì quá khứ của vế đầu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc đối xứng “người thứ nhất… người thứ hai” được giữ lại; “bụi đất” tạo liên hệ tự nhiên với ngôn ngữ sáng tạo trong tiếng Việt.
