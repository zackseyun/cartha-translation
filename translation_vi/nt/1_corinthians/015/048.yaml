reference: 1 Corinthians 15:48
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οἷος ὁ χοϊκός, τοιοῦτοι καὶ οἱ χοϊκοί, καὶ οἷος ὁ ἐπουράνιος, τοιοῦτοι καὶ οἱ ἐπουράνιοι·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/048.yaml
  text: As is the man of dust[a], so also are those of dust; and as is the heavenly man, so also are those who are heavenly.
translation:
  language: vi
  text: Người làm bằng bụi đất[a] thế nào thì những người làm bằng bụi đất cũng thế ấy; người thuộc trời thế nào thì những người thuộc trời cũng thế ấy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “người từ bụi đất.”'
    reason: Nêu một cách diễn đạt khác nhấn mạnh nguồn gốc từ bụi đất của tính từ χοϊκός; bản văn chính dùng “làm bằng bụi đất” để giữ rõ ý chất liệu/bản chất trong đối chiếu với “thuộc trời.”
lexical_decisions:
- source_word: οἷος ... τοιοῦτοι
  choice: thể nào thì ... cũng thể ấy
  rationale: Cặp tương liên này diễn tả sự tương ứng giữa người đại diện và những người cùng thuộc về trật tự ấy. Cách diễn đạt này tự nhiên trong tiếng Việt, đồng thời giữ được cấu trúc song song của nguyên văn.
- source_word: χοϊκός
  choice: bởi bụi đất
  rationale: Tính từ chỉ điều được tạo nên từ hoặc mang đặc tính của bụi đất, gợi lại nguồn gốc của A-đam trong Sáng Thế Ký và trong câu trước. “Bởi bụi đất” giữ được ý nguồn gốc mà không giản lược thành “thuộc đất” theo nghĩa trần tục.
- source_word: ὁ χοϊκός
  choice: người bởi bụi đất
  rationale: Danh từ hóa giống đực số ít chỉ A-đam như người đại diện trong ngữ cảnh câu 45–49. Thêm “người” làm câu tiếng Việt rõ nghĩa và duy trì sự đối chiếu mang tính cá nhân.
- source_word: οἱ χοϊκοί
  choice: những người bởi bụi đất
  rationale: Số nhiều chỉ những con người cùng chia sẻ đặc tính của người bởi bụi đất. Cách dịch lặp lại cùng một cụm từ để giữ liên kết từ vựng của nguyên văn.
- source_word: ἐπουράνιος
  choice: thuộc trời
  rationale: Tính từ có nghĩa là thuộc về trời hoặc mang đặc tính của trời. “Thuộc trời” giữ sắc thái tính từ và không nhập cách nói “từ trời” của câu 47 vào câu này.
- source_word: ὁ ἐπουράνιος
  choice: người thuộc trời
  rationale: Trong ngữ cảnh, số ít chỉ Đấng Christ đối lập với A-đam. “Người thuộc trời” giữ rõ sự đối chiếu giữa hai người đại diện mà không thêm tên riêng vốn không có trong câu.
- source_word: οἱ ἐπουράνιοι
  choice: những người thuộc trời
  rationale: Số nhiều nói về những con người tương ứng với người thuộc trời. Cách dịch này tránh khiến độc giả hiểu là các thiên sứ, nhưng không giải thích quá mức về đặc tính hay số phận của họ.
theological_decisions:
- issue: Có nên làm rõ sự đối chiếu A-đam/Đấng Christ bằng danh từ “người” trong hai vế số ít hay không
  choice: Dùng “người bởi bụi đất” và “người thuộc trời”
  alternative: Dùng “đấng bởi bụi đất” và “đấng thuộc trời”, hoặc chỉ dùng các cụm danh từ hóa không có “người”
  rationale: Ngữ cảnh gần (câu 45–49) đối chiếu A-đam và Đấng Christ như hai người đại diện. “Người” làm rõ sở chỉ trong tiếng Việt mà không biến điều ngữ cảnh hàm ý thành một lời giải thích giáo lý thêm vào.
- issue: οἱ ἐπουράνιοι chỉ các hữu thể trên trời hay những con người tương ứng với người thuộc trời
  choice: 'Dịch với sở chỉ là con người: “những người thuộc trời”'
  alternative: “những đấng thuộc trời” hoặc “các hữu thể trên trời”
  rationale: Toàn đoạn đang bàn về loài người, sự sống lại và việc mang hình ảnh của người thuộc trời, chứ không bàn về thiên sứ. Bản dịch giữ trọng tâm nhân học của ngữ cảnh mà không xác định quá mức cách thức hoặc thời điểm họ trở nên thuộc trời.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc “thể nào thì ... cũng thể ấy” giữ nhịp đối xứng của câu Hy Lạp; việc lặp lại “bởi bụi đất” và “thuộc trời” có chủ ý để bảo toàn phép song hành và liên kết từ vựng.
