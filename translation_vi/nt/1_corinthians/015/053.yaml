id: 1CO.15.53
reference: 1 Corinthians 15:53
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: δεῖ γὰρ τὸ φθαρτὸν τοῦτο ἐνδύσασθαι ἀφθαρσίαν καὶ τὸ θνητὸν τοῦτο ἐνδύσασθαι ἀθανασίαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/053.yaml
  text: For this perishable body must put on imperishability[a], and this mortal body must put on immortality.
translation:
  language: vi
  text: Vì thân thể hay hư nát này phải mặc lấy sự không hư nát[a], và thân thể phải chết này phải mặc lấy sự bất tử.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát hình thức hơn: “cái hay hư nát này phải mặc lấy sự không hư nát, và cái phải chết này phải mặc lấy sự bất tử.” Trong câu này, tiếng Hy Lạp không nêu rõ từ “thân thể”, dù ngữ cảnh cho thấy đối tượng được nói đến là thân thể.'
    reason: Nêu rõ từ được bổ sung theo ngữ cảnh và bảo lưu cấu trúc nguyên văn.
lexical_decisions:
- source_word: δεῖ
  choice: phải
  rationale: Diễn đạt rõ tính tất yếu trong lập luận của Phao-lô, tự nhiên và mạnh trong tiếng Việt hiện đại.
- source_word: γὰρ
  choice: Vì
  rationale: Giữ quan hệ giải thích với câu trước.
- source_word: τὸ φθαρτὸν τοῦτο
  choice: thân thể hay hư nát này
  rationale: Tính từ được dùng như danh từ chỉ điều chịu hư hoại; thêm “thân thể” theo ngữ cảnh trực tiếp về sự sống lại của thân thể, còn “hay hư nát” diễn đạt trạng thái dễ bị suy tàn.
- source_word: ἐνδύσασθαι
  choice: mặc lấy
  rationale: Giữ nguyên ẩn dụ mặc áo của nguyên văn, đồng thời phù hợp với văn phong Kinh Thánh trang trọng và dễ hiểu.
- source_word: ἀφθαρσίαν
  choice: sự không hư nát
  rationale: Giữ đối xứng từ vựng với φθαρτόν và diễn đạt trạng thái không còn chịu hư hoại.
- source_word: καὶ
  choice: và
  rationale: Nối hai vế song song một cách trực tiếp.
- source_word: τὸ θνητὸν τοῦτο
  choice: thân thể phải chết này
  rationale: Diễn đạt θνητός là ở trong tình trạng phải chết; thêm “thân thể” theo ngữ cảnh và để hai vế cân xứng.
- source_word: ἀθανασίαν
  choice: sự bất tử
  rationale: Cách nói chuẩn, gọn và chính xác về trạng thái không còn chịu sự chết.
theological_decisions:
- issue: Bổ sung “thân thể” dù σώμα không xuất hiện trong câu này
  choice: Dùng “thân thể hay hư nát này” và “thân thể phải chết này” trong chính văn
  alternative: 'Dịch sát hình thức hơn: “cái hay hư nát này… cái phải chết này…”'
  rationale: Ngữ cảnh 1 Cô-rinh-tô 15:42–54 cho thấy đối tượng là thân thể trong sự sống lại. Việc bổ sung làm rõ sở chỉ mà không quyết định thêm một vấn đề thần học; chú thích bảo lưu hình thức cô đọng của tiếng Hy Lạp.
- issue: Ẩn dụ ἐνδύσασθαι
  choice: Giữ hình ảnh “mặc lấy”
  alternative: Diễn giải là “trở nên không hư nát… trở nên bất tử”
  rationale: Nguyên văn trình bày sự biến đổi bằng ẩn dụ mặc áo. Giữ ẩn dụ bảo toàn hình ảnh và sự căng thẳng trong cách diễn đạt của Phao-lô.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. “Mặc lấy” được giữ để bảo toàn ẩn dụ; “hay hư nát/phải chết” tự nhiên hơn các danh hóa quá trừu tượng, trong khi chú thích cung cấp cách dịch sát hình thức.
