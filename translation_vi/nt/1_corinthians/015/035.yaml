  yaml_path: translation/nt/1_corinthians/015/035.yaml
  text: But someone will say[a], “How are the dead raised, and with what kind of body do they come?”
translation:
  language: vi
  text: 'Nhưng sẽ có người nói: “Người chết được sống lại[a] thế nào, và họ đến với loại thân thể nào?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “Người chết sống lại thế nào?” Động từ Hy Lạp ở thể bị động, nghĩa đen là “được làm cho sống lại”; cách dùng này có thể hàm ý một tác nhân thần linh.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀλλὰ
  choice: Nhưng
  rationale: Đánh dấu sự chuyển ý tương phản sang câu hỏi hoặc sự phản bác được dự liệu.
- source_word: ἐρεῖ τις
  choice: sẽ có người hỏi
  rationale: Giữ sắc thái tương lai của ἐρεῖ với chủ thể bất định; trong ngữ cảnh, động từ ‘hỏi’ tự nhiên vì ngay sau đó là hai câu hỏi trực tiếp.
- source_word: Πῶς ἐγείρονται οἱ νεκροί
  choice: Người chết được sống lại cách nào
  rationale: Giữ thể bị động của ἐγείρονται, qua đó không xóa đi hàm ý về tác nhân làm cho sống lại, đồng thời diễn đạt tự nhiên trong tiếng Việt.
- source_word: ποίῳ δὲ σώματι
  choice: và ... với loại thân thể nào
  rationale: ‘Loại ... nào’ bảo toàn ý nghĩa định tính của ποίῳ; ‘với’ phản ánh cách dùng cách cho của σώματι mà không diễn giải quá mức.
- source_word: ἔρχονται
  choice: họ sẽ đến
  rationale: Dịch trực tiếp động từ ἔρχομαι và tránh đồng nhất nó với ἐγείρονται; thêm ‘họ’ để câu tiếng Việt rõ chủ thể.
theological_decisions:
- issue: Cách nói về sự sống lại và tác nhân
  choice: Người chết được sống lại cách nào
  alternative: Người chết sống lại cách nào
  rationale: Bản dịch giữ thể bị động rõ ràng của ἐγείρονται, vốn có thể hàm ý tác nhân thần linh nhưng không nêu tác nhân ấy rõ hơn nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng ‘thân thể’ thay vì ‘thân xác’ để diễn đạt σῶμα một cách trung tính; giữ hai câu hỏi liên kết thành một lời chất vấn.
