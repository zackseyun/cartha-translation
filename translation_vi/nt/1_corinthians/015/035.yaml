    issue: “hỏi” thay cho ἐρεῖ (“sẽ nói”)
    rationale: Dù lời nói tiếp theo có dạng câu hỏi, nguyên văn dùng động từ “nói”; nên “sẽ có người nói” sát nguồn hơn và vẫn tự nhiên.
  - severity: medium
    issue: “sẽ đến” thay cho ἔρχονται
    rationale: Động từ ἔρχονται là thì hiện tại. Bản dịch nên tránh thêm tương lai một cách không cần thiết; “họ đến” bảo toàn hình thức và sắc thái của nguyên văn.
