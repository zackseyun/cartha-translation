  verdict: revise
  source_fidelity: Bản thảo truyền đạt đúng hai câu hỏi về sự sống lại và loại thân thể. Tuy nhiên, ἐρεῖ τις nghĩa sát là “sẽ có người nói,” không nhất thiết là “hỏi”; và ἔρχονται là thì hiện tại, nên “họ sẽ đến” thêm sắc thái tương lai không có trong nguyên văn. “Được sống lại” diễn đạt hợp lý thể bị động của ἐγείρονται.
  naturalness: Câu sửa giữ văn phong tiếng Việt hiện đại, trang trọng và tự nhiên. “Thế nào” gọn và phù hợp trong câu hỏi; “họ đến với loại thân thể nào” giữ cách nói của nguyên văn mà vẫn dễ hiểu trong ngữ cảnh.
  terminology: “Người chết,” “được sống lại,” và “thân thể” là những thuật ngữ trung tính, phù hợp. Chú thích làm rõ thể bị động mà không khẳng định tác nhân thần linh vượt quá điều câu này nói.
  issues:
