  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Νυνὶ δὲ Χριστὸς ἐγήγερται ἐκ νεκρῶν, ἀπαρχὴ τῶν ⸀κεκοιμημένων.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/020.yaml
  text: But now Messiah has been raised from the dead[c][b][a], the firstfruits of those who have fallen asleep.
translation:
  language: vi
  text: Nhưng nay, Đấng Mê-si-a[a] đã được làm cho sống lại từ cõi chết, là phần đầu mùa[b] của những người đã an giấc[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Đấng Mê-si-a” cũng thường được gọi là “Đấng Christ”; cả hai đều có nghĩa là “Đấng được xức dầu.”
    reason: alternative_reading
  - marker: b
    text: “Phần đầu mùa” là phần đầu tiên của mùa thu hoạch được dâng lên Đức Chúa Trời; hình ảnh này hàm ý cả sự đi trước lẫn sự bảo đảm rằng mùa thu hoạch trọn vẹn sẽ đến.
    reason: cultural_note
  - marker: c
    text: “An giấc” là hình ảnh chỉ những người đã chết, đặc biệt trong bối cảnh nói về sự sống lại.
    reason: lexical_alternative
lexical_decisions:
- source_word: Νυνὶ δὲ
  choice: Nhưng nay
  rationale: Giữ bước chuyển tương phản mạnh từ giả định ở phần trước sang lời khẳng định thực tại hiện nay.
- source_word: Χριστὸς
  choice: Đấng Mê-si-a
  rationale: Dịch Χριστός theo nghĩa tước hiệu ‘Đấng được xức dầu’, đồng thời dùng cách gọi quen thuộc và trang trọng trong tiếng Việt.
- source_word: ἐγήγερται
  choice: đã được làm cho sống lại
  rationale: 'Giữ thể hoàn thành bị động: sự sống lại đã xảy ra và kết quả vẫn còn, nhưng không tự ý nêu rõ tác nhân.'
- source_word: ἐκ νεκρῶν
  choice: từ cõi chết
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt cho ngôn ngữ phục sinh; truyền đạt việc ra khỏi tình trạng và phạm vi của người chết.
- source_word: ἀπαρχὴ
  choice: phần đầu mùa
  rationale: Giữ hình ảnh phần sản vật đầu tiên của mùa gặt được dâng lên, đồng thời gợi đến mùa thu hoạch đầy đủ sẽ đến.
- source_word: τῶν κεκοιμημένων
  choice: của những người đã an giấc
  rationale: Giữ ẩn dụ ‘ngủ’ chỉ cái chết trong bối cảnh phục sinh, với lối diễn đạt tự nhiên và trang trọng bằng tiếng Việt.
theological_decisions:
- issue: Thể và tác nhân của sự phục sinh
  choice: đã được làm cho sống lại
  alternative: đã sống lại
  rationale: Giữ thể bị động của tiếng Hy Lạp và không chỉ rõ tác nhân khi câu gốc không nêu tác nhân.
- issue: Cách chuyển dịch tước hiệu Χριστός
  choice: Đấng Mê-si-a
  alternative: Đấng Christ
  rationale: Chuyển tải chức năng tước hiệu thay vì chỉ phiên âm, nhưng ghi nhận cách gọi truyền thống trong chú thích.
- issue: Ý nghĩa đại diện của ἀπαρχή
  choice: phần đầu mùa
  alternative: hoa quả đầu mùa
  rationale: ‘Phần đầu mùa’ bao quát hơn và phản ánh phần đầu tiên của mùa gặt, không giới hạn hình ảnh vào trái cây.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dấu chấm phẩy làm rõ rằng vế sau giải thích vai trò của Đấng Mê-si-a. Giữ các hình ảnh ‘đầu mùa’ và ‘an giấc’ thay vì diễn giải mất ẩn dụ.
