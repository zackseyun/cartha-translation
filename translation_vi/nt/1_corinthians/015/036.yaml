  to: Người dại dột![a] Điều bạn gieo không được ban sự sống nếu nó không chết.[b]
  rationale: Chỉnh nhẹ lời gọi để phù hợp tiếng Việt tiêu chuẩn hiện đại; thay cách diễn đạt bị động bằng “được ban sự sống” cho tự nhiên mà vẫn trung thành với ζῳοποιεῖται; và sửa chú thích để loại bỏ phương án “sống lại,” vốn thu hẹp hoặc diễn giải thêm nghĩa của động từ Hy Lạp. Đại từ “bạn” bảo lưu sự nhấn mạnh ngôi thứ hai của σὺ trong một cách xưng hô hiện đại, trung tính.
