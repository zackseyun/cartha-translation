  text: Foolish one[b][a], what you sow is not made alive unless it dies.
translation:
  language: vi
  text: Người dại dột![a] Điều bạn gieo không được ban sự sống nếu nó không chết.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Đồ dại!” hoặc “Người thiếu hiểu biết!”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “không được làm cho sống” hoặc “không nhận được sự sống.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄφρων
  choice: Hỡi kẻ dại dột!
  rationale: Giữ lời quở trách trực tiếp ở hô cách, sắc nhưng không dùng lối nói quá cổ; dấu chấm than giúp câu gọi tự nhiên trong tiếng Việt.
- source_word: σὺ
  choice: bạn
  rationale: Đại từ Hy Lạp được nêu rõ để nhấn mạnh người đối thoại; “bạn” bảo toàn ngôi thứ hai và phù hợp văn phong hiện đại mà không quá suồng sã.
- source_word: ὃ σπείρεις
  choice: Điều bạn gieo
  rationale: Diễn đạt tự nhiên, đồng thời giữ nguyên hình ảnh nông nghiệp của động từ “gieo”.
- source_word: ζῳοποιεῖται
  choice: không được làm cho sống
  rationale: Giữ thể bị động của nguyên văn và sắc thái được ban sự sống; cách nói này cũng duy trì mối liên hệ với chủ đề sự sống lại.
- source_word: ἐὰν μὴ
  choice: nếu ... không
  rationale: Trong cấu trúc này, cách dịch sát “nếu ... không” tự nhiên hơn “trừ khi” khi chủ ngữ của mệnh đề điều kiện là hạt giống.
- source_word: ἀποθάνῃ
  choice: nó không chết
  rationale: Dùng hiện tại trong mệnh đề điều kiện để diễn đạt aorist subjunctive mà không thêm ý “trước hết” vốn chỉ được hàm ý.
theological_decisions:
- issue: Quan hệ ẩn dụ giữa cái chết của hạt giống và sự sống lại
  choice: Giữ nguyên hình ảnh gieo hạt và chết mà không diễn giải thêm thành một công thức giáo lý.
  alternative: Nói rõ đây là sự chết và sự sống lại của thân thể.
  rationale: Phao-lô dùng phép ví von về hạt giống để trả lời sự hoài nghi về sự sống lại; bản dịch không nên thêm lời giải thích thần học không có trong câu.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Lời quở trách được giữ rõ; cấu trúc bị động và hình ảnh gieo hạt của nguyên văn được bảo toàn. Các dấu chú thích [a], [b] đều xuất hiện trong chính văn.
