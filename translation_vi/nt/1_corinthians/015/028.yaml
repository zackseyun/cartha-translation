revisions:
- from: Nhưng khi muôn vật đã phục dưới quyền Con[a], thì chính Con cũng sẽ phục dưới quyền Đấng đã khiến muôn vật phục dưới quyền mình, để Đức Chúa Trời là tất cả trong tất cả[b].
  to: Nhưng khi mọi sự đã được đặt dưới quyền Con[a], thì chính Con cũng sẽ được đặt dưới quyền Đấng đã đặt mọi sự dưới quyền Con, để Đức Chúa Trời là tất cả trong tất cả[b].
  rationale: Sửa quy chiếu đại từ để “mọi sự” được đặt dưới quyền Con, đúng với αὐτῷ trong nguyên văn. Thay “muôn vật” bằng “mọi sự” để không thu hẹp τὰ πάντα, và dùng “được đặt dưới quyền” cho cả hai hình thức bị động của ὑποτάσσω. Cách dịch vẫn để nguyên sự căng thẳng thần học của câu và không diễn giải thêm.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T19:24:19Z'
review_pass:
  verdict: revise
  source_fidelity: 'Cần sửa một điểm quy chiếu quan trọng: trong mệnh đề “τῷ ὑποτάξαντι αὐτῷ τὰ πάντα”, αὐτῷ chỉ về Con. Cụm “dưới quyền mình” trong bản nháp tiếng Việt tự nhiên sẽ hồi chỉ về “Đấng” làm chủ ngữ, do đó làm đổi nghĩa. “Muôn vật” cũng có thể gợi riêng các loài thụ tạo/vật thể, hẹp hơn τὰ πάντα; “mọi sự” giữ phạm vi trung tính và bao quát hơn. Bản sửa giữ thể bị động lặp lại của ὑποτάσσω bằng “được đặt dưới quyền”.'
  naturalness: 'Bản sửa dùng cấu trúc hiện đại, rõ quy chiếu: “Đấng đã đặt mọi sự dưới quyền Con.” Sự lặp lại “đặt dưới quyền” phản ánh dụng ý lặp từ của nguyên văn và vẫn tự nhiên trong văn phong Kinh Thánh trang trọng. “Tất cả trong tất cả” được giữ nguyên vì cô đọng và không thu hẹp phạm vi của πᾶσιν.'
  terminology: Giữ “Con” cho ὁ υἱός, “Đấng” cho phân từ có mạo từ, và “Đức Chúa Trời” cho ὁ θεός. Không thêm diễn giải về bản thể hay chức năng trong quan hệ quy phục. “Mọi sự” được dùng nhất quán cho τὰ πάντα; “tất cả trong tất cả” bảo toàn cách nói cô đọng πάντα ἐν πᾶσιν.
  issues:
  - severity: high
    issue: Đại từ “mình” trong “Đấng đã khiến muôn vật phục dưới quyền mình” đổi quy chiếu của αὐτῷ.
    rationale: Trong tiếng Việt, “mình” thông thường hồi chỉ về chủ ngữ gần nhất là “Đấng”; nhưng αὐτῷ trong tiếng Hy Lạp chỉ về Con. Cần nêu rõ “dưới quyền Con.”
  - severity: medium
    issue: “Muôn vật” có thể thu hẹp τὰ πάντα.
    rationale: τὰ πάντα là cụm trung tính bao quát, “mọi sự” truyền đạt tốt hơn phạm vi vũ trụ/toàn thể mà không giới hạn vào các vật hay sinh vật.
  - severity: low
    issue: Các dạng “phục dưới quyền” không biểu thị rõ thể bị động của hai động từ ὑποτάσσω.
    rationale: “Được đặt dưới quyền” diễn đạt rõ việc mọi sự và Con là đối tượng của hành động bị động, đồng thời giữ sự lặp lại của nguyên văn.
