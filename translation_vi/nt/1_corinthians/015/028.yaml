reference: 1 Corinthians 15:28
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὅταν δὲ ὑποταγῇ αὐτῷ τὰ πάντα, ⸀τότε αὐτὸς ὁ υἱὸς ὑποταγήσεται τῷ ὑποτάξαντι αὐτῷ τὰ πάντα, ἵνα ᾖ ὁ θεὸς ⸀πάντα ἐν πᾶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/028.yaml
  text: But when all things are subjected to him[a], then the Son himself will also be subjected to the one who subjected all things to him[b], so that God may be all in all.
translation:
  language: vi
  text: Nhưng khi mọi sự đã được đặt dưới quyền Con[a], thì chính Con cũng sẽ được đặt dưới quyền Đấng đã đặt mọi sự dưới quyền Con, để Đức Chúa Trời là tất cả trong tất cả[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “tất cả mọi sự”. Nguyên văn Hy Lạp lặp lại cụm “mọi sự” (τὰ πάντα), nhấn mạnh phạm vi bao quát của lập luận.
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “Đức Chúa Trời là mọi sự trong mọi người.” Nguyên văn là một cách nói cô đọng, sát chữ: “tất cả trong tất cả”.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὅταν δὲ
  choice: Nhưng khi
  rationale: ὅταν mở đầu mệnh đề thời gian, còn δέ đánh dấu bước chuyển nhẹ trong lập luận; “Nhưng khi” tự nhiên và giữ được cả hai sắc thái.
- source_word: ὑποταγῇ / ὑποταγήσεται / ὑποτάξαντι
  choice: đã phục dưới quyền / sẽ phục dưới quyền / đã khiến ... phục dưới quyền
  rationale: Giữ nhất quán trường nghĩa của ὑποτάσσω, đồng thời diễn đạt thể bị động và chủ động bằng tiếng Việt tự nhiên, trang trọng. “Phục dưới quyền” tránh sắc thái cưỡng bức quá mức của “bị khuất phục”.
- source_word: αὐτῷ
  choice: dưới quyền Con
  rationale: Đại từ chỉ về Con trong văn cảnh. Nêu rõ “Con” giúp tiếng Việt tránh đại từ mơ hồ mà không thêm một chủ thể mới.
- source_word: τὰ πάντα
  choice: muôn vật
  rationale: Cụm trung tính số nhiều có phạm vi bao quát toàn thể thụ tạo/sự vật trong lập luận mang tầm vũ trụ của Phao-lô. “Muôn vật” trang trọng, tự nhiên và giữ được sự lặp lại.
- source_word: αὐτὸς ὁ υἱὸς
  choice: chính Con
  rationale: “Chính” thể hiện sắc thái nhấn mạnh của αὐτός; “Con” viết hoa phù hợp văn cảnh chỉ về Đức Kitô mà không chèn thêm danh xưng không có trong câu.
- source_word: τῷ ὑποτάξαντι αὐτῷ τὰ πάντα
  choice: Đấng đã khiến muôn vật phục dưới quyền mình
  rationale: Phân từ có mạo từ được diễn đạt bằng “Đấng”; “mình” hồi chỉ về Con, là chủ thể được muôn vật đặt dưới quyền, và giữ cấu trúc quan hệ của nguyên văn.
- source_word: ἵνα ᾖ
  choice: để ... là
  rationale: “Để” truyền đạt mục đích/kết quả của ἵνα với thức giả định; tiếng Việt không cần đánh dấu hình thái tương đương với “may be”.
- source_word: ὁ θεὸς
  choice: Đức Chúa Trời
  rationale: Cách gọi trang trọng, phổ thông trong truyền thống Kinh Thánh tiếng Việt và phân biệt rõ danh xưng của Đức Chúa Trời.
- source_word: πάντα ἐν πᾶσιν
  choice: tất cả trong tất cả
  rationale: Giữ sự cô đọng, lặp từ và tính bao quát của thành ngữ Hy Lạp thay vì tự ý giới hạn πᾶσιν vào “mọi người”.
theological_decisions:
- issue: Sự quy phục của Con đối với Đấng đã đặt muôn vật dưới quyền Con
  choice: Dịch thẳng rằng chính Con sẽ phục dưới quyền Đấng ấy.
  alternative: Diễn giải thêm đây chỉ là sự quy phục về chức năng hoặc né tránh ngôn ngữ quy phục.
  rationale: Nguyên văn khẳng định sự quy phục trong trình tự cánh chung. Bản dịch giữ nguyên sức căng thần học, không suy ra sự thấp kém về bản thể cũng không chèn lời giải thích giáo lý vào chính văn.
- issue: Phạm vi của τὰ πάντα và πάντα ἐν πᾶσιν
  choice: Dùng “muôn vật” và “tất cả trong tất cả” để giữ phạm vi phổ quát và cách nói cô đọng.
  alternative: “mọi sự” và “mọi sự trong mọi người.”
  rationale: πᾶσιν có thể được hiểu theo nhiều phạm vi tùy văn cảnh; không nên âm thầm thu hẹp thành chỉ con người. Cách dịch chính giữ sự mơ hồ chân thực, còn chú thích nêu phương án khác.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “muôn vật” để thể hiện phạm vi vũ trụ; dùng “phục dưới quyền” nhất quán cho họ từ ὑποτάσσω. Đại từ được làm rõ vừa đủ nhằm tránh nhập nhằng trong tiếng Việt, nhưng không thêm diễn giải thần học.
