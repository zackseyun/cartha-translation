id: 1CO.15.9
reference: 1 Corinthians 15:9
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐγὼ γάρ εἰμι ὁ ἐλάχιστος τῶν ἀποστόλων, ὃς οὐκ εἰμὶ ἱκανὸς καλεῖσθαι ἀπόστολος, διότι ἐδίωξα τὴν ἐκκλησίαν τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/009.yaml
  text: For I am the least of the apostles[a], who am not worthy to be called an apostle, because I persecuted the church of God.
translation:
  language: vi
  text: Vì tôi là người thấp kém nhất trong các sứ đồ, không xứng đáng được gọi là sứ đồ, bởi vì tôi đã bắt bớ Hội Thánh của Đức Chúa Trời.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Xứng đáng” cũng có thể dịch là “đủ tư cách” hoặc “thích hợp”.
    reason: lexical_alternative
lexical_decisions:
- source_word: γάρ
  choice: Vì
  rationale: Giữ mối liên hệ giải thích với câu trước, đồng thời diễn đạt tự nhiên trong tiếng Việt.
- source_word: ἐλάχιστος
  choice: người nhỏ bé nhất
  rationale: Chỉ địa vị tự hạ của Phao-lô giữa các sứ đồ, không nói về vóc dáng; cách nói này tự nhiên và trang trọng hơn việc dịch máy móc là “nhỏ nhất”.
- source_word: ἀπόστολος / ἀποστόλων
  choice: sứ đồ
  rationale: Trong ngữ cảnh này, từ chỉ nhóm và vai trò sứ đồ được công nhận, chứ không chỉ một người đưa tin nói chung.
- source_word: ἱκανός
  choice: xứng đáng
  rationale: Trong mạch văn tự hạ vì từng bắt bớ Hội Thánh, cách dịch này truyền đạt sắc thái không xứng đáng; chú thích bảo lưu nghĩa khả dĩ về sự đủ tư cách hoặc thích hợp.
- source_word: καλεῖσθαι
  choice: được gọi là
  rationale: Phản ánh trực tiếp cấu trúc nguyên mẫu bị động và tự nhiên trong tiếng Việt.
- source_word: διότι
  choice: bởi
  rationale: Nêu rõ lý do Phao-lô tự nhận không xứng đáng, đồng thời tránh lặp “vì” trong cùng câu.
- source_word: ἐδίωξα
  choice: tôi đã bắt bớ
  rationale: Diễn đạt đúng hành động thù nghịch trước đây của Phao-lô đối với cộng đồng tín hữu.
- source_word: ἐκκλησίαν τοῦ θεοῦ
  choice: Hội Thánh của Đức Chúa Trời
  rationale: Diễn đạt cộng đồng thuộc về Đức Chúa Trời, giữ quan hệ sở hữu của nguyên văn và dùng thuật ngữ Kinh Thánh quen thuộc trong tiếng Việt.
- source_word: ὃς
  choice: lược đại từ quan hệ, nối trực tiếp bằng “không”
  rationale: Tiếng Hy Lạp dùng đại từ quan hệ, nhưng tiếng Việt tự nhiên có thể tiếp nối cùng chủ ngữ mà không cần “là người”; ý nghĩa và quan hệ cú pháp vẫn rõ.
theological_decisions:
- issue: Bản chất lời Phao-lô nói về chức sứ đồ của mình
  choice: Giữ đồng thời lời khẳng định ông thuộc hàng sứ đồ và lời tự nhận không xứng đáng mang danh ấy.
  alternative: Hiểu rằng Phao-lô phủ nhận hoàn toàn chức sứ đồ của mình, hoặc chỉ nói mình có địa vị xã hội thấp hơn.
  rationale: Cụm “tôi là người nhỏ bé nhất trong các sứ đồ” đặt ông trong nhóm ấy, còn “không xứng đáng được gọi là sứ đồ” bày tỏ sự tự hạ dựa trên quá khứ bắt bớ. Bản dịch không xóa bỏ sức căng này.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “sứ đồ” và “Hội Thánh của Đức Chúa Trời” theo lối diễn đạt Kinh Thánh quen thuộc; tránh cấu trúc quan hệ nặng theo tiếng Hy Lạp. Dấu chú thích được đặt sau câu vì liên quan đến lựa chọn từ trong câu.
