id: 1CO.15.22
reference: 1 Corinthians 15:22
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὥσπερ γὰρ ἐν τῷ Ἀδὰμ πάντες ἀποθνῄσκουσιν, οὕτως καὶ ἐν τῷ Χριστῷ πάντες ζῳοποιηθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/022.yaml
  text: For just as in Adam all die[a], so also in Messiah all will be made alive.
translation:
  language: vi
  text: Vì như trong A-đam, mọi người đều chết, thì cũng vậy, trong Đấng Mê-si-a[a], mọi người đều sẽ được làm cho sống.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “trong Đấng Christ.” Tước hiệu Hy Lạp Χριστός có thể được phiên âm là “Christ” hoặc dịch là “Đấng Mê-si-a”; ở đây được dịch theo nghĩa.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: Vì như
  rationale: “Vì” giữ chức năng giải thích và liên kết của γάρ với mạch lập luận trước đó; “như” diễn đạt lực so sánh của ὥσπερ một cách tự nhiên trong tiếng Việt.
- source_word: ἐν τῷ Ἀδὰμ
  choice: trong A-đam
  rationale: Giữ cách nói cô đọng về tính đại diện/liên đới của ἐν, không chuyển sang nghĩa công cụ như “qua A-đam” hay giải thích quá mức thành “hiệp nhất với A-đam”.
- source_word: πάντες
  choice: mọi người đều
  rationale: Diễn đạt phạm vi không kèm hạn định của πάντες và giữ cấu trúc song song ở cả hai vế. Từ “đều” làm rõ tính phân bố tự nhiên trong tiếng Việt mà không thu hẹp phạm vi.
- source_word: ἀποθνῄσκουσιν
  choice: chết
  rationale: Thì hiện tại ở đây nêu một thực tại phổ quát; hiện tại đơn “chết” chuyển tải sắc thái khái quát tự nhiên.
- source_word: οὕτως καὶ
  choice: thì cũng vậy
  rationale: Giữ tương quan so sánh với ὥσπερ và sắc thái bổ sung của καί, đồng thời tạo câu đối xứng, tự nhiên trong tiếng Việt.
- source_word: ἐν τῷ Χριστῷ
  choice: trong Đấng Mê-si
  rationale: Χριστός ở đây là tước hiệu và song song với “trong A-đam”; “Đấng Mê-si” chuyển tải ý nghĩa của tước hiệu, còn “trong” giữ nguyên tính cô đọng và độ mở của ἐν.
- source_word: ζῳοποιηθήσονται
  choice: sẽ được làm cho sống
  rationale: Giữ cả ý tương lai và thể bị động của động từ, qua đó không xóa mờ hành động ban sự sống do một tác nhân thực hiện.
theological_decisions:
- issue: Phạm vi của “mọi người” trong hai vế
  choice: Giữ “mọi người đều” không kèm hạn định ở cả hai vế.
  alternative: Giới hạn lần thứ hai vào mọi tín hữu, hoặc tuyên bố rõ rằng cả hai lần chỉ toàn thể nhân loại theo đúng cùng một nghĩa.
  rationale: Bản Hy Lạp đặt πάντες song song với πάντες nhưng câu này tự nó không giải thích đầy đủ cơ chế hay phạm vi thần học của sự tương ứng. Bản dịch vì thế bảo toàn sự căng thẳng của câu thay vì giải quyết theo một lập trường hệ phái.
- issue: Sắc thái của ἐν trong “trong A-đam” và “trong Đấng Mê-si”
  choice: Giữ giới từ “trong” ở cả hai vế.
  alternative: Dịch là “qua” hoặc giải thích thành “hiệp nhất với”.
  rationale: “Trong” bảo toàn cấu trúc song song và tính đa nghĩa có chủ ý của nguyên văn, không áp đặt riêng sắc thái công cụ hay sự hiệp nhất.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “A-đam” và “Đấng Mê-si” theo dạng quen thuộc trong tiếng Việt; giữ nhịp đối xứng của hai vế và không thêm chú giải giáo lý vào chính câu.
