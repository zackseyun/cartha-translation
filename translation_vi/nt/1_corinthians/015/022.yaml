  source_fidelity: Bản dịch giữ đúng cấu trúc so sánh–đối ứng của ὥσπερ γὰρ ... οὕτως καί, giữ giới từ “trong” ở cả hai vế, và diễn đạt đúng thì hiện tại khái quát của “chết” cùng thể bị động tương lai của “sẽ được làm cho sống.” Phạm vi không hạn định của πάντες được bảo toàn song song bằng “mọi người đều.”
  naturalness: Câu nhìn chung tự nhiên trong văn phong Kinh Thánh hiện đại. Cần sửa “Mê-si” thành dạng tiếng Việt đầy đủ, thông dụng hơn là “Mê-si-a”; đồng thời dấu phẩy giúp nhận rõ hai vế song hành.
  terminology: “A-đam” phù hợp. Vì Χριστός đang được dịch theo nghĩa thay vì dùng dạng truyền thống “Christ,” tước hiệu nên là “Đấng Mê-si-a,” không phải dạng rút gọn “Đấng Mê-si.” Chú thích nêu phương án “Đấng Christ” cũng duy trì minh bạch với lựa chọn thuật ngữ và audit trail tiếng Anh.
  issues:
