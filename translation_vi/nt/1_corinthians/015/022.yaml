revisions:
- from: Vì như trong A-đam mọi người đều chết, thì cũng vậy, trong Đấng Mê-si mọi người đều sẽ được làm cho sống.
  to: Vì như trong A-đam, mọi người đều chết, thì cũng vậy, trong Đấng Mê-si-a[a], mọi người đều sẽ được làm cho sống.
  rationale: Chỉ sửa dạng phiên chuyển của “Messiah” thành “Mê-si-a,” thêm chú thích thuật ngữ tương ứng với audit trail, và điều chỉnh dấu câu. Không thay đổi quan hệ mở của “trong,” tính song song của “mọi người đều,” hoặc sự căng thẳng thần học về phạm vi của “tất cả.”
