  text: ἰδοὺ μυστήριον ὑμῖν λέγω· ⸀πάντες οὐ κοιμηθησόμεθα πάντες δὲ ἀλλαγησόμεθα,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/051.yaml
  text: 'Behold[a], I tell you a mystery: we will not all sleep, but we will all be changed[b],'
translation:
  language: vi
  text: 'Này, tôi nói cho anh chị em biết một mầu nhiệm: không phải tất cả chúng ta đều sẽ ngủ[a], nhưng tất cả chúng ta đều sẽ được biến đổi[b],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc, theo lối diễn giải: “không phải tất cả chúng ta đều sẽ chết.” Tiếng Hy Lạp dùng “ngủ”, một ẩn dụ thường gặp trong Tân Ước về sự chết khi được nhìn trong ánh sáng của sự sống lại.'
    reason: lexical_alternative
  - marker: b
    text: 'Một dị bản đáng chú ý mang nghĩa: “Tất cả chúng ta đều sẽ ngủ, nhưng không phải tất cả đều sẽ được biến đổi.” Chính văn ở đây theo bản SBLGNT.'
    reason: textual_variant
lexical_decisions:
- source_word: ἰδοὺ
  choice: Này
  rationale: Giữ chức năng thu hút sự chú ý và sắc thái trang trọng của lời công bố, đồng thời tự nhiên trong tiếng Việt hiện đại.
- source_word: μυστήριον
  choice: mầu nhiệm
  rationale: Trong cách dùng của Phao-lô, từ này chỉ chân lý của Đức Chúa Trời trước kia kín giấu nhưng nay được bày tỏ, chứ không chỉ một điều khó hiểu.
- source_word: ὑμῖν λέγω
  choice: tôi nói cho anh chị em
  rationale: Diễn đạt tự nhiên lời tuyên bố trực tiếp với cộng đồng; đại từ số nhiều được thể hiện rõ.
- source_word: πάντες οὐ κοιμηθησόμεθα
  choice: Không phải tất cả chúng ta đều sẽ ngủ
  rationale: Giữ đúng phạm vi phủ định của tiếng Hy Lạp và bảo tồn ẩn dụ 'ngủ' chỉ sự chết trong ánh sáng của sự sống lại.
- source_word: πάντες δὲ ἀλλαγησόμεθα
  choice: nhưng tất cả chúng ta đều sẽ được biến đổi
  rationale: Thể hiện sự tương phản của δέ và ý nghĩa bị động về cuộc biến đổi cánh chung.
theological_decisions:
- issue: Ý nghĩa của 'ngủ' trong bối cảnh sự sống lại
  choice: Giữ 'ngủ' làm ẩn dụ cho sự chết thể xác trước sự sống lại.
  alternative: Dịch giải nghĩa là 'chết'.
  rationale: Cách dịch này bảo tồn hình ảnh và mối liên hệ trong lập luận của Phao-lô mà không áp đặt một học thuyết riêng về trạng thái linh hồn.
- issue: Dị bản đảo ngược ý nghĩa hai mệnh đề
  choice: 'Bản văn chính theo SBLGNT: ''Không phải tất cả chúng ta đều sẽ ngủ, nhưng tất cả chúng ta đều sẽ được biến đổi.'''
  alternative: 'Một dị bản đáng chú ý mang nghĩa: ''Tất cả chúng ta đều sẽ ngủ, nhưng không phải tất cả đều sẽ được biến đổi.'''
  rationale: Dịch trực tiếp bản văn Hy Lạp được cung cấp; ghi nhận dị bản có ý nghĩa giải thích trong chú thích thay vì đưa vào chính văn.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh chị em” để chỉ cộng đồng được xưng hô; giữ ẩn dụ “ngủ” và thuật ngữ “mầu nhiệm” nhằm bảo toàn ngôn ngữ thần học của nguyên bản.
