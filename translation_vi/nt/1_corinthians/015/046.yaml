source:
  edition: SBLGNT
  text: ἀλλ’ οὐ πρῶτον τὸ πνευματικὸν ἀλλὰ τὸ ψυχικόν, ἔπειτα τὸ πνευματικόν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/046.yaml
  text: But the spiritual is not first[a], but the natural[b]; afterward the spiritual.
translation:
  language: vi
  text: Nhưng không phải điều thuộc linh đến trước[a], mà là điều tự nhiên[b]; sau đó mới là điều thuộc linh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc, theo văn cảnh: “Không phải thân thể thuộc linh đến trước, mà là thân thể tự nhiên; sau đó mới là thân thể thuộc linh.” Phao-lô không nhắc lại từ “thân thể” trong câu này, dù từ ấy xuất hiện rõ trong văn cảnh xung quanh.'
    reason: alternative_reading
  - marker: b
    text: “Tự nhiên” dịch từ Hy Lạp psychikon, chỉ điều thuộc về sự sống hữu sinh thông thường; nếu dịch sát chữ hơn, có thể là “thuộc hồn”.
    reason: lexical_alternative
lexical_decisions:
- source_word: πρῶτον
  choice: đến trước
  rationale: Dùng theo nghĩa trạng từ để chỉ thứ tự. Trong tiếng Việt, “đến trước” diễn đạt tự nhiên sự nối tiếp giữa hai điều được Phao-lô đối chiếu.
- source_word: πνευματικόν
  choice: điều thuộc linh
  rationale: Tính từ giống trung số ít có mạo từ được dùng như danh từ. Cách dịch này giữ sự cô đọng và không tự ý thêm “thân thể”, dù văn cảnh nói về thân thể.
- source_word: ψυχικόν
  choice: điều tự nhiên
  rationale: Chỉ điều thuộc về sự sống hữu sinh thông thường, đối lập với điều thuộc về Thánh Linh trong lập luận về sự sống lại. “Tự nhiên” dễ hiểu hơn cách dịch sát chữ “thuộc hồn” và không mang sắc thái phán xét đạo đức như “không thuộc linh”.
- source_word: ἔπειτα
  choice: sau đó mới đến
  rationale: Diễn tả bước kế tiếp trong trình tự; từ “mới” làm rõ sự tương phản về thứ tự mà không thêm một nội dung thần học khác.
- source_word: ἀλλ’ οὐ ... ἀλλὰ
  choice: Nhưng ... không ... mà ...
  rationale: Cấu trúc “không... mà...” tái hiện tự nhiên trong tiếng Việt phép đối lập và đính chính của nguyên văn.
theological_decisions:
- issue: Ý nghĩa của sự đối lập giữa ψυχικόν và πνευματικόν
  choice: Giữ đây là sự đối lập theo trình tự giữa điều tự nhiên và điều thuộc linh trong lập luận của Phao-lô về sự sống lại.
  alternative: Hiểu cụ thể là “thân thể tự nhiên” và “thân thể thuộc linh”, hoặc là sự đối lập giữa người không thuộc linh và người thuộc linh.
  rationale: Câu 44 nêu rõ “thân thể”, nhưng chính câu 46 lược danh từ ấy và dùng hai tính từ như danh từ. Bản dịch không thêm “thân thể” vào chính văn, nhờ đó giữ được phạm vi và độ cô đọng của tiếng Hy Lạp, đồng thời chú thích nêu cách hiểu theo văn cảnh.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Cấu trúc đối lập được giữ rõ; “điều thuộc linh” và “điều tự nhiên” bảo toàn cách dùng tính từ như danh từ trong nguyên văn, còn các khả năng cụ thể hơn được đưa vào chú thích.
