  source_fidelity: Bản dịch xác định đúng “kẻ thù cuối cùng” và phép nhân hóa sự chết. Tuy nhiên, “bị vô hiệu hóa” trong tiếng Việt hiện đại thường chỉ việc làm cho không còn tác dụng tạm thời hay chức năng, chưa diễn tả đầy đủ καταργέω là bị làm cho chấm dứt/mất hiệu lực dứt khoát. “Bị xóa bỏ” phản ánh sát hơn mà không áp đặt nghĩa hủy diệt theo siêu hình học.
