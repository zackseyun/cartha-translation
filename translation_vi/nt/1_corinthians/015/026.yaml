  text: The last enemy to be abolished is death[a].
translation:
  language: vi
  text: Kẻ thù cuối cùng bị xóa bỏ là sự chết.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Kẻ thù cuối cùng bị tiêu diệt là sự chết.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔσχατος
  choice: cuối cùng
  rationale: Diễn tả vị trí cuối trong trình tự các thế lực bị khuất phục, đồng thời giữ sắc thái cánh chung trong lập luận của Phao-lô.
- source_word: ἐχθρὸς
  choice: kẻ thù
  rationale: Cách nói tự nhiên, rõ nghĩa và giữ phép nhân hóa sự chết như một thế lực đối nghịch.
- source_word: καταργεῖται
  choice: bị vô hiệu hóa
  rationale: Động từ hiện tại bị động có nghĩa bị làm cho mất hiệu lực hoặc bị chấm dứt quyền năng; lựa chọn này không hàm ý quá mức rằng sự chết bị hủy diệt theo một nghĩa siêu hình cụ thể.
- source_word: ὁ θάνατος
  choice: sự chết
  rationale: Danh từ có mạo từ xác định và được nhân hóa; “sự chết” là cách diễn đạt trang trọng, quen thuộc trong văn cảnh Kinh Thánh tiếng Việt.
theological_decisions:
- issue: Ý nghĩa của καταργεῖται đối với sự thất bại của sự chết
  choice: bị vô hiệu hóa
  alternative: bị tiêu diệt
  rationale: “Bị vô hiệu hóa” giữ được ý sự chết bị tước bỏ quyền lực và đưa đến chỗ chấm dứt, mà không tự ý xác định bản chất siêu hình của sự chấm dứt ấy. Cách dịch truyền thống “bị tiêu diệt” vẫn có thể chấp nhận và được giữ trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc câu bám sát trật tự nhấn mạnh của tiếng Hy Lạp, với “sự chết” được đặt cuối câu như lời xác định kẻ thù cuối cùng.
