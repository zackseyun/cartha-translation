id: 1CO.15.29
reference: 1 Corinthians 15:29
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἐπεὶ τί ποιήσουσιν οἱ βαπτιζόμενοι ὑπὲρ τῶν νεκρῶν; εἰ ὅλως νεκροὶ οὐκ ἐγείρονται, τί καὶ βαπτίζονται ὑπὲρ ⸀αὐτῶν;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/029.yaml
  text: Otherwise[a], what will those do who are being baptized on behalf of the dead? If the dead are not raised at all, why then are they being baptized on their behalf?
translation:
  language: vi
  text: Nếu không phải vậy[a], những người chịu phép báp-têm vì người chết sẽ làm gì? Nếu người chết hoàn toàn không được sống lại, tại sao họ còn chịu phép báp-têm vì những người ấy?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “thay mặt cho người chết”, “do người chết”, hoặc, ít có khả năng hơn, “trên người chết”. Giới từ Hy Lạp có thể được hiểu theo nhiều cách, và tập tục chính xác mà Phao-lô nhắc đến vẫn chưa rõ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐπεὶ
  choice: Nếu không thì
  rationale: Trong mạch lập luận, từ này dẫn vào hệ quả nếu phủ nhận sự sống lại; cách dịch này tự nhiên trong tiếng Việt và giữ sức đẩy của câu hỏi tu từ.
- source_word: τί ποιήσουσιν
  choice: sẽ làm gì
  rationale: Giữ nghĩa rộng của ποιέω, không thu hẹp thành “đạt được gì” hay áp đặt một kết quả cụ thể.
- source_word: οἱ βαπτιζόμενοι
  choice: những người chịu phép báp-têm
  rationale: Diễn đạt phân từ hiện tại bị động một cách tự nhiên, chỉ một việc đang diễn ra hoặc được thực hành, nhưng không xác nhận tính chính đáng của việc ấy.
- source_word: ὑπὲρ τῶν νεκρῶν
  choice: thay cho người chết
  rationale: “Thay cho” thể hiện nghĩa đại diện thường gặp của ὑπέρ với sở hữu cách, đồng thời chú thích các khả năng khác vì ý nghĩa và tập tục cụ thể vẫn chưa chắc chắn.
- source_word: εἰ ὅλως
  choice: Nếu ... hoàn toàn không
  rationale: “Hoàn toàn” giữ sắc thái nhấn mạnh của ὅλως trong điều kiện phủ định.
- source_word: νεκροὶ οὐκ ἐγείρονται
  choice: người chết ... không được sống lại
  rationale: Giữ thể bị động của ἐγείρονται, phù hợp với ngôn ngữ phục sinh của Phao-lô và không xóa đi tác nhân hàm ẩn.
- source_word: τί καὶ
  choice: tại sao ... còn
  rationale: Cách diễn đạt thành ngữ này truyền đạt lực lập luận của câu hỏi lặp lại; “còn” phản ánh chức năng nhấn mạnh của καί trong văn cảnh.
- source_word: βαπτίζονται
  choice: họ ... chịu phép báp-têm
  rationale: Giữ thể bị động và sự song song với phân từ ở vế trước bằng cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: ὑπὲρ αὐτῶν
  choice: thay cho những người ấy
  rationale: Đại từ chỉ lại người chết; cách dịch duy trì sự song song từ vựng với vế đầu mà không giải thích tập tục.
theological_decisions:
- issue: Ý nghĩa của phép báp-têm “thay cho người chết”
  choice: Giữ cách nói ít diễn giải là “chịu phép báp-têm thay cho người chết”, không xác nhận một tập tục lịch sử hay giáo lý cụ thể.
  alternative: Có thể hiểu là “vì người chết”, “do người chết”, hoặc ít có khả năng hơn là “trên người chết”.
  rationale: Câu này nổi tiếng khó hiểu và có nhiều cách giải thích. Bản dịch cần bảo toàn tính mơ hồ của giới từ Hy Lạp và cách Phao-lô dùng tập tục ấy trong lập luận về sự sống lại, thay vì đưa vào một lập trường hệ phái.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “phép báp-têm” để diễn đạt danh xưng nghi lễ quen thuộc; tránh giải thích hoặc hợp thức hóa tập tục khó xác định được nhắc đến trong câu.
