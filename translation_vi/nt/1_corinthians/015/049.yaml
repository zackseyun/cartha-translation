reference: 1 Corinthians 15:49
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ καθὼς ἐφορέσαμεν τὴν εἰκόνα τοῦ χοϊκοῦ, ⸀φορέσομεν καὶ τὴν εἰκόνα τοῦ ἐπουρανίου.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/049.yaml
  text: And just as we have borne the image of the man of dust[a], we will also bear the image of the heavenly man.
translation:
  language: vi
  text: Và như chúng ta đã mang hình ảnh của người thuộc bụi đất thế nào, chúng ta cũng sẽ mang hình ảnh của Đấng thuộc trời như thế.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Một số thủ bản chép: “chúng ta cũng hãy mang hình ảnh của Đấng thuộc trời.”'
    reason: textual_variant
lexical_decisions:
- source_word: καθὼς
  choice: như... thế nào, thì... thể ấy
  rationale: Diễn đạt rõ cấu trúc so sánh tương ứng trong tiếng Việt tự nhiên, nối tình trạng thuộc A-đam với sự biến đổi tương lai.
- source_word: ἐφορέσαμεν
  choice: đã mang
  rationale: Giữ nghĩa mang, mang lấy hình ảnh; thì quá khứ phù hợp với động từ aorist và vẫn bao hàm kinh nghiệm chung của nhân loại.
- source_word: εἰκόνα
  choice: hình ảnh
  rationale: Tương đương thông dụng của εἰκών, bảo toàn mối liên hệ kiểu mẫu A-đam/Đấng Christ mà không diễn giải quá mức.
- source_word: τοῦ χοϊκοῦ
  choice: của người từ bụi đất
  rationale: Nêu rõ đối tượng được hàm ý và giữ tiếng vọng Sáng Thế Ký về con người bởi bụi đất, đồng thời tự nhiên hơn cách dịch sát chữ 'người bụi đất'.
- source_word: φορέσομεν
  choice: chúng ta cũng sẽ mang
  rationale: Theo bản văn SBLGNT với động từ tương lai chỉ định, diễn tả sự biến đổi tương lai; καί được thể hiện bằng 'cũng'.
- source_word: τοῦ ἐπουρανίου
  choice: của Đấng từ trời
  rationale: Giữ sự song song với 'người từ bụi đất' và dựa vào ngữ cảnh gần về người thứ hai từ trời; viết hoa 'Đấng' cho thấy đối tượng là Đấng Christ mà không chèn tên vào câu.
theological_decisions:
- issue: Động từ tương lai chỉ định hay động từ giả định mang ý khuyên nhủ
  choice: chúng ta cũng sẽ mang
  alternative: chúng ta cũng hãy mang
  rationale: Bản văn chính SBLGNT đọc φορέσομεν, là tương lai chỉ định và phù hợp với lập luận về sự biến đổi khi sống lại. Dị bản khuyên nhủ có ý nghĩa được giữ trong chú thích.
- issue: Cách xác định hai danh từ hóa χοϊκός và ἐπουράνιος
  choice: người từ bụi đất / Đấng từ trời
  alternative: kẻ thuộc bụi đất / Đấng thuộc trời
  rationale: Ngữ cảnh trực tiếp ở câu 47 đối chiếu người thứ nhất với người thứ hai. Cách dịch này bảo toàn sự đối xứng A-đam–Đấng Christ nhưng không thêm tên riêng vào bản văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc 'như... thế nào, thì... thể ấy' giữ phép đối xứng của nguyên văn; 'bụi đất' gợi rõ nền tảng Sáng Thế Ký. Dấu chú thích [a] được đặt ngay sau câu có dị bản.
