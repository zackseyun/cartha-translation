  text: Then he appeared to James[a], then to all the apostles.
translation:
  language: vi
  text: Sau đó, Ngài hiện ra cho Gia-cơ[a], rồi cho tất cả các sứ đồ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc dịch sát chữ hơn: “Ngài được Gia-cơ nhìn thấy, rồi được tất cả các sứ đồ nhìn thấy.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔπειτα
  choice: Sau đó
  rationale: Trạng từ chỉ trình tự, đánh dấu lần hiện ra tiếp theo trong danh sách; “Sau đó” tự nhiên trong tiếng Việt và giữ rõ mạch thời gian.
- source_word: ὤφθη
  choice: Ngài hiện ra
  rationale: Dạng thụ động aorist của ὁράω được dùng theo lối quen thuộc về những lần Đấng Christ phục sinh hiện ra. “Hiện ra” tự nhiên hơn cách dịch sát chữ “được nhìn thấy” mà vẫn giữ đúng ý nghĩa sự kiện.
- source_word: Ἰακώβῳ
  choice: với Gia-cơ
  rationale: Danh từ ở cách dữ liệu đi với ὤφθη, chỉ người được chứng kiến sự hiện ra. “Gia-cơ” là dạng tên gọi đã quen thuộc trong Kinh Thánh tiếng Việt.
- source_word: εἶτα
  choice: rồi
  rationale: Trạng từ tuần tự thứ hai; “rồi” thể hiện bước kế tiếp một cách tự nhiên, đồng thời tránh câu tiếng Việt nặng nề mà không làm mất trình tự của Phao-lô.
- source_word: ἀποστόλοις
  choice: các sứ đồ
  rationale: Trong ngữ cảnh này, từ ngữ chỉ những chứng nhân được sai phái với tư cách sứ đồ, không đơn thuần là các sứ giả nói chung. “Sứ đồ” giữ nghĩa chuyên biệt đã quen thuộc.
- source_word: πᾶσιν
  choice: tất cả
  rationale: Từ này bổ nghĩa cho “các sứ đồ” và nhấn mạnh toàn thể nhóm; “tất cả các sứ đồ” là cách diễn đạt trực tiếp và tự nhiên.
theological_decisions:
- issue: Danh tính và phạm vi của “tất cả các sứ đồ” trong tương quan với Gia-cơ
  choice: Giữ nguyên cách nói rộng “tất cả các sứ đồ”, không xác định hẹp nhóm này là ai.
  alternative: Hiểu riêng là Nhóm Mười Hai, hoặc là một nhóm chứng nhân được sai phái rộng hơn và khác với Nhóm Mười Hai.
  rationale: Bản Hy Lạp không xác định chính xác thành viên của nhóm. Bản dịch không nên đưa vào một cách dung hòa, nhưng cần giữ sự phân biệt mà Phao-lô nêu giữa lần hiện ra với Gia-cơ và lần kế tiếp với “tất cả các sứ đồ”.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” để chỉ Đấng Christ theo ngữ cảnh gần, dù chủ ngữ không được nêu lại trong câu Hy Lạp. Các liên từ “Sau đó... rồi...” giữ trình tự mà vẫn tự nhiên trong tiếng Việt.
