- from: Sau đó, Ngài hiện ra với Gia-cơ[a], rồi với tất cả các sứ đồ.
  to: Sau đó, Ngài hiện ra cho Gia-cơ[a], rồi cho tất cả các sứ đồ.
  rationale: Đổi «với» thành «cho» để diễn đạt đúng và không mơ hồ người nhận sự hiện ra trong cấu trúc ὤφθη + cách dữ liệu. Chỉnh chú thích để trình bày trọn vẹn cách dịch sát theo thể bị động và giữ rõ hai mốc tuần tự. Không thay đổi ý nghĩa, phạm vi của «tất cả các sứ đồ», hay sắc thái thần học của bản văn.
