  text: Where[a], O death, is your victory? Where, O death, is your sting?
translation:
  language: vi
  text: “Hỡi sự chết, chiến thắng[a] của ngươi ở đâu? Hỡi sự chết, ngòi chích của ngươi ở đâu?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Một số bản chép ghi ở mệnh đề thứ nhất: “Hỡi sự chết, ngòi chích của ngươi ở đâu?” Cách đọc này được phản ánh trong KJV và một số bản dịch truyền thống khác.'
    reason: textual_variant
lexical_decisions:
- source_word: ποῦ
  choice: ở đâu
  rationale: Trạng từ nghi vấn mở đầu câu hỏi tu từ mang tính thách thức; “ở đâu” diễn đạt trực tiếp và tự nhiên trong tiếng Việt, không thêm sắc thái ngoài nguyên văn.
- source_word: σου
  choice: của ngươi
  rationale: Đại từ sở hữu ngôi thứ hai số ít; “của ngươi” phù hợp với việc nhân cách hóa và trực tiếp thách thức sự chết.
- source_word: θάνατε
  choice: Hỡi sự chết
  rationale: Danh từ ở hô cách, trực tiếp gọi sự chết như một nhân vật; “Hỡi sự chết” giữ được sắc thái thi ca, trang trọng và mạnh mẽ.
- source_word: νῖκος
  choice: chiến thắng
  rationale: Từ này chỉ chiến thắng hay sự đắc thắng. “Chiến thắng” rõ nghĩa, tự nhiên và nối kết với ý sự chết bị nuốt mất trong chiến thắng ở câu 54.
- source_word: κέντρον
  choice: nọc độc
  rationale: κέντρον có thể chỉ ngòi chích hoặc vật nhọn thúc giục. Trong hình ảnh sự chết gây hại và theo lời giải thích ở câu 56, “nọc độc” là cách diễn đạt tự nhiên, dễ hiểu trong tiếng Việt, bao hàm sức gây chết của cú chích.
theological_decisions:
- issue: Dị bản ở mệnh đề thứ nhất
  choice: Theo SBLGNT, dịch νῖκος là “chiến thắng” trong chính văn.
  alternative: 'Một số bản chép dùng “nọc độc” ở mệnh đề thứ nhất, tạo thành: “Hỡi sự chết, nọc độc của ngươi ở đâu?”'
  rationale: Nguồn Hy Lạp được chỉ định là SBLGNT có νῖκος, đồng thời phù hợp với mạch văn ngay trước đó về sự chết bị nuốt mất trong chiến thắng. Dị bản truyền thống vẫn được ghi chú vì có ảnh hưởng đáng kể trong lịch sử bản văn và các bản dịch.
translation_notes:
  register: Văn phong thi ca, trang trọng nhưng hiện đại. Cấu trúc gọi trực tiếp “Hỡi sự chết” bảo tồn phép nhân cách hóa và giọng chế nhạo đầy thách thức của hai câu hỏi tu từ. Dùng “ngươi” vì đối tượng được nhân cách hóa là sự chết, không phải lời xưng hô thông thường với một người.
