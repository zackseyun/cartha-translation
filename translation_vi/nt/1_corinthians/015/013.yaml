  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἰ δὲ ἀνάστασις νεκρῶν οὐκ ἔστιν, οὐδὲ Χριστὸς ἐγήγερται·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/013.yaml
  text: But if there is no resurrection of the dead[b][a], then not even Messiah has been raised.
translation:
  language: vi
  text: Nhưng nếu không có sự sống lại của người chết, thì ngay cả Đấng Mê-si cũng chưa được làm cho sống lại.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Đấng Christ cũng chưa được làm cho sống lại.” “Đấng Mê-si” và “Đấng Christ” đều chuyển tải tước hiệu Hy Lạp Χριστός, nghĩa là “Đấng được xức dầu.”'
    reason: alternative_reading
lexical_decisions:
- source_word: εἰ δὲ
  choice: Nhưng nếu
  rationale: εἰ mở đầu mệnh đề điều kiện, còn δέ đánh dấu bước chuyển mang tính đối chiếu nhẹ trong lập luận; “Nhưng nếu” tự nhiên và sát mạch văn.
- source_word: ἀνάστασις νεκρῶν
  choice: sự sống lại của người chết
  rationale: Giữ danh từ ἀνάστασις và quan hệ sở hữu/phạm vi của νεκρῶν, chỉ những người chết như một nhóm, thay vì chuyển thành “từ cõi chết”.
- source_word: οὐκ ἔστιν
  choice: không có
  rationale: Diễn đạt tự nhiên sắc thái phủ định sự hiện hữu hay thực tại của sự sống lại.
- source_word: οὐδὲ
  choice: thì ngay cả ... cũng
  rationale: Thể hiện hệ quả logic của mệnh đề điều kiện đồng thời giữ sức nhấn mạnh “không ngay cả” của οὐδέ.
- source_word: Χριστὸς
  choice: Đấng Mê-si
  rationale: Χριστός ở đây mang giá trị tước hiệu, nghĩa là Đấng được xức dầu; “Đấng Mê-si” vừa giữ ý nghĩa tước hiệu vừa phù hợp cách dùng tiếng Việt hiện đại.
- source_word: ἐγήγερται
  choice: đã được làm cho sống lại
  rationale: Động từ hoàn thành bị động được giữ ở thể bị động, diễn tả một hành động đã hoàn tất với hệ quả hiện tại mà không nêu tác nhân.
theological_decisions:
- issue: Cách dịch Χριστός
  choice: Đấng Mê-si
  alternative: Đấng Christ
  rationale: Trong lập luận về sự sống lại, từ này vẫn có sức nặng của một tước hiệu. Bản dịch chính nêu rõ nghĩa “Đấng được xức dầu” mà không biến tước hiệu thành tên riêng.
- issue: Thể của ἐγήγερται
  choice: đã được làm cho sống lại
  alternative: đã sống lại
  rationale: Giữ thể bị động của nguyên văn và không tự ý nêu Đức Chúa Trời là tác nhân, nhờ đó bảo toàn hàm ý thần học mà câu Hy Lạp để ngỏ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Được làm cho sống lại” được chọn thay cho cách nói gọn “sống lại” để bảo toàn thể bị động của tiếng Hy Lạp; “chưa” diễn đạt tự nhiên trong tiếng Việt trạng thái kết quả bị phủ định của thì hoàn thành.
