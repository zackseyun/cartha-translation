id: 1CO.15.2
reference: 1 Corinthians 15:2
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: δι’ οὗ καὶ σῴζεσθε, τίνι λόγῳ εὐηγγελισάμην ὑμῖν, εἰ κατέχετε, ἐκτὸς εἰ μὴ εἰκῇ ἐπιστεύσατε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/002.yaml
  text: through which you also are being saved, if you hold firmly to the message I proclaimed as good news to you—unless you believed in vain.
translation:
  language: vi
  text: Nhờ Tin Lành ấy, anh chị em cũng đang được cứu, nếu anh chị em giữ vững sứ điệp mà tôi đã rao truyền cho anh chị em—trừ khi anh chị em đã tin cách vô ích.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “được cứu.” Thì hiện tại trong tiếng Hy Lạp có thể diễn tả tiến trình đang tiếp diễn (“đang được cứu”) hoặc một thực tại được nêu cách tổng quát (“được cứu”).'
    reason: lexical_alternative
lexical_decisions:
- source_word: δι’ οὗ
  choice: nhờ Tin Lành ấy
  rationale: διά với sở hữu cách diễn tả phương tiện; đại từ quan hệ quy chiếu về Tin Lành ở câu 1. Cách diễn đạt này tự nhiên trong tiếng Việt và giữ nghĩa 'nhờ đó'.
- source_word: σῴζεσθε
  choice: đang được cứu
  rationale: Thì hiện tại, thể bị động có thể gợi tiến trình đang tiếp diễn; bản dịch giữ sắc thái ấy mà không áp đặt một hệ thống thần học.
- source_word: τίνι λόγῳ
  choice: sứ điệp
  rationale: λόγος ở đây chỉ nội dung/lời được công bố và gắn với κατέχετε. 'Sứ điệp' rõ nghĩa, tự nhiên hơn cách dịch sát chữ 'lời nào' trong cấu trúc tiếng Việt.
- source_word: εὐηγγελισάμην
  choice: đã rao truyền ... như tin mừng
  rationale: Động từ mang nghĩa loan báo tin mừng; cách dịch này làm rõ sắc thái phúc âm của từ thay vì chỉ dùng 'rao giảng'.
- source_word: κατέχετε
  choice: giữ vững
  rationale: Diễn tả sự tiếp tục nắm giữ, gắn bó hoặc duy trì; 'giữ vững' ngắn gọn và phù hợp với mệnh đề điều kiện.
- source_word: ἐκτὸς εἰ μὴ
  choice: trừ khi
  rationale: Thành ngữ mở đầu một ngoại lệ; 'trừ khi' là cách diễn đạt tự nhiên và chính xác.
- source_word: εἰκῇ
  choice: cách vô ích
  rationale: Trong ngữ cảnh, từ này chỉ điều vô hiệu, không đạt kết quả hoặc uổng công; cách dịch giữ nguyên lời cảnh báo của Phao-lô.
- source_word: ἐπιστεύσατε
  choice: anh chị em đã tin
  rationale: Thì bất định quy chiếu đến hành động tin của các tín hữu khi tiếp nhận Tin Lành; 'đã tin' diễn đạt rõ trong tiếng Việt.
theological_decisions:
- issue: Thể của sự cứu rỗi trong σῴζεσθε
  choice: đang được cứu
  alternative: được cứu
  rationale: Dạng hiện tại bị động có thể được hiểu theo tiến trình hoặc theo hiện tại tổng quát. Chính văn chọn sắc thái tiếp diễn, còn chú thích ghi nhận cách hiểu tổng quát, không giải quyết thay tranh luận thần học.
- issue: Mệnh đề điều kiện εἰ κατέχετε
  choice: nếu anh chị em giữ vững
  alternative: diễn giải đây chỉ là bằng chứng của đức tin thật hoặc là điều kiện mặc nhiên đã được đáp ứng
  rationale: Giữ nguyên hình thức điều kiện của câu Hy Lạp, không đưa vào bản dịch một quan điểm hệ phái về sự bền đỗ hay bảo đảm cứu rỗi.
- issue: Ý nghĩa của εἰκῇ
  choice: đã tin cách vô ích
  alternative: đã tin mà không có lý do hoặc đã tin hời hợt
  rationale: Giữ sự căng thẳng và mức độ khái quát của lời cảnh báo, không xác định cụ thể vì sao đức tin có thể trở nên vô ích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” cho số nhiều ὑμῖν, “Tin Lành” để nối rõ với câu 1, và giữ nguyên điều kiện cùng lời cảnh báo của nguyên văn.
