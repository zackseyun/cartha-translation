source:
  edition: SBLGNT
  text: καὶ σώματα ἐπουράνια, καὶ σώματα ἐπίγεια· ἀλλὰ ἑτέρα μὲν ἡ τῶν ἐπουρανίων δόξα, ἑτέρα δὲ ἡ τῶν ἐπιγείων.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/040.yaml
  text: And there are heavenly bodies and earthly bodies; but the glory of the heavenly is one kind[a], and the glory of the earthly is another.
translation:
  language: vi
  text: Cũng có những thân thể thuộc trời và những thân thể thuộc đất[a]; nhưng vinh quang của những thân thể thuộc trời khác với vinh quang của những thân thể thuộc đất.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “các thiên thể và các thể trên đất.”'
    reason: Nêu phương án từ vựng mang sắc thái thiên văn/không gian cho cặp ἐπουράνια và ἐπίγεια, nhưng không thu hẹp nghĩa của chính văn.
lexical_decisions:
- source_word: σώματα
  choice: thân thể
  rationale: Dịch sát nghĩa cơ bản là “thân thể”, đồng thời giữ phạm vi quy chiếu rộng trong phép so sánh của Phao-lô, không giới hạn vào thiên thể hay một loại hữu thể cụ thể.
- source_word: ἐπουράνια
  choice: thuộc trời
  rationale: Diễn đạt tự nhiên ý “thuộc về trời/thiên giới” và không thu hẹp từ này vào nghĩa thiên văn như “thiên thể”.
- source_word: ἐπίγεια
  choice: thuộc đất
  rationale: Tạo thế đối xứng với “thuộc trời”, truyền đạt nghĩa ở trên đất hay thuộc về đất mà không dùng thuật ngữ kỹ thuật.
- source_word: δόξα
  choice: vinh quang
  rationale: Giữ từ vựng thần học của Phao-lô, đồng thời trong ngữ cảnh vẫn có thể bao hàm vẻ huy hoàng hay rực rỡ đặc trưng.
- source_word: ἑτέρα μὲν ... ἑτέρα δὲ
  choice: là một thể ... là một thể khác
  rationale: Làm rõ sự khác biệt về loại hay tính chất, thay vì chỉ nói chung rằng hai bên “khác nhau”; cấu trúc “còn” thể hiện thế đối chiếu của μὲν...δὲ.
- source_word: ἀλλὰ
  choice: nhưng
  rationale: Phản ánh trực tiếp quan hệ tương phản đơn giản do ἀλλά biểu thị.
theological_decisions:
- issue: Đối tượng được gọi là “những thân thể thuộc trời” và “những thân thể thuộc đất”
  choice: Giữ cách diễn đạt khái quát, không xác định chúng chỉ là thiên thể, thiên sứ hay thân thể phục sinh.
  alternative: “các thiên thể và các vật thể trên đất” hoặc “các hữu thể trên trời và các hữu thể dưới đất”
  rationale: Bản Hy Lạp dùng σώματα, nghĩa là “thân thể”, và ngữ cảnh nói đến các dạng hiện hữu có thân thể cùng vinh quang khác nhau. Cách dịch khái quát bảo toàn độ mở và sức căng thần học của câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “thuộc trời/thuộc đất” để giữ thế đối xứng và độ mở của nguyên văn; lặp lại “những thân thể” ở vế sau nhằm tránh sự mơ hồ hoặc lối nói gượng trong tiếng Việt.
