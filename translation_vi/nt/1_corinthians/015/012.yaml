id: 1CO.15.12
reference: 1 Corinthians 15:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Εἰ δὲ Χριστὸς κηρύσσεται ὅτι ἐκ νεκρῶν ἐγήγερται, πῶς λέγουσιν ⸂ἐν ὑμῖν τινες⸃ ὅτι ἀνάστασις νεκρῶν οὐκ ἔστιν;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/012.yaml
  text: If the Messiah is proclaimed as having been raised from the dead[a], how can some among you say that there is no resurrection of the dead?
translation:
  language: vi
  text: Nếu Đấng Mê-si được rao giảng rằng đã được làm cho sống lại từ cõi chết,[a] thì làm sao một số người trong anh chị em lại nói rằng không có sự sống lại của người chết?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “Đấng Christ.” Từ Hy Lạp Χριστός có thể được chuyển âm là “Christ” hoặc dịch theo nghĩa tước hiệu là “Đấng Mê-si”; bản văn chính giữ nghĩa tước hiệu.'
    reason: alternative_reading
lexical_decisions:
- source_word: Χριστὸς
  choice: Đấng Mê-si
  rationale: Giữ nghĩa tước hiệu của Χριστός trong lập luận của Phao-lô; cách gọi này tự nhiên, trang trọng và không biến tước hiệu thành tên riêng thuần túy.
- source_word: κηρύσσεται
  choice: được rao giảng
  rationale: Diễn đạt thể bị động hiện tại và ý nghĩa công khai công bố của κηρύσσω.
- source_word: ἐκ νεκρῶν
  choice: từ cõi chết
  rationale: Cách nói tiếng Việt tự nhiên cho sự sống lại, đồng thời phản ánh ἐκ và phạm vi của những người chết.
- source_word: ἐγήγερται
  choice: đã được khiến sống lại
  rationale: 'Giữ thể hoàn thành bị động: hành động đã xảy ra và kết quả vẫn còn; tránh chuyển thành chủ động như ''đã sống lại''.'
- source_word: πῶς λέγουσιν
  choice: thì sao ... lại nói
  rationale: Truyền đạt sức nặng tu từ và sự phi lý mà câu hỏi nêu ra bằng một cấu trúc tiếng Việt tự nhiên.
- source_word: ἐν ὑμῖν τινες
  choice: một số người trong anh chị em
  rationale: Xác định một nhóm người ở ngay trong cộng đồng được Phao-lô viết thư cho; 'anh chị em' làm rõ đại từ số nhiều mà không giới hạn giới tính.
- source_word: ἀνάστασις νεκρῶν
  choice: sự sống lại của người chết
  rationale: Giữ cấu trúc sở hữu rộng chỉ sự sống lại chung của những người chết, thay vì chỉ một biến cố cá biệt.
- source_word: οὐκ ἔστιν
  choice: không có
  rationale: Diễn đạt tự nhiên nghĩa hiện hữu của εἰμί trong cấu trúc này.
theological_decisions:
- issue: Cách dịch Χριστός trong văn mạch của Phao-lô
  choice: Đấng Mê-si
  alternative: Đấng Christ
  rationale: Ở đây từ này mang sức nặng của một tước hiệu trong lời công bố về sự sống lại; dịch nghĩa giúp độc giả nhận ra vai trò ấy mà không áp đặt một cách hiểu hệ phái.
- issue: Thể bị động của ἐγήγερται
  choice: đã được khiến sống lại
  alternative: đã sống lại
  rationale: Giữ thể bị động thần học của nguyên văn mà không nêu đích danh tác nhân; nhờ vậy không làm mất hàm ý về hành động của Đức Chúa Trời nhưng cũng không bổ sung điều câu này không nói rõ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc “thì sao ... lại nói” giữ tính chất chất vấn mạnh của câu Hy Lạp. Dùng “anh chị em” để diễn đạt cộng đồng hỗn hợp được đại từ ὑμῖν chỉ đến; dấu chú thích [a] xuất hiện ngay trong bản văn.
