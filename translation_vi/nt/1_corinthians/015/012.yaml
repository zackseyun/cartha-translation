revisions:
- from: Nếu Đấng Mê-si được rao giảng là đã được khiến sống lại từ cõi chết,[a] thì sao một số người trong anh chị em lại nói rằng không có sự sống lại của người chết?
  to: Nếu Đấng Mê-si được rao giảng rằng đã được làm cho sống lại từ cõi chết,[a] thì làm sao một số người trong anh chị em lại nói rằng không có sự sống lại của người chết?
  rationale: Sửa cú pháp để phản ánh tự nhiên cấu trúc “được rao giảng rằng” của κηρύσσεται ὅτι, thay “được khiến sống lại” bằng “được làm cho sống lại” để giữ bị động mà dùng tiếng Việt chuẩn hơn, và dùng “thì làm sao” cho lực chất vấn của πῶς. Chú thích được rút gọn để nêu đúng biến thể dịch của Χριστός mà không tạo cảm giác đây là một mệnh đề thay thế độc lập.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T19:24:16Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch truyền đạt đúng mạch lập luận: Đấng Mê-si được công bố là đã được làm cho sống lại từ cõi chết, đối lập với lời phủ nhận sự sống lại chung của người chết. Bản sửa giữ thể bị động hoàn thành của ἐγήγερται mà không thêm tác nhân.'
  naturalness: Cụm “được rao giảng là đã được khiến sống lại” chưa tự nhiên trong tiếng Việt hiện đại; đặc biệt “khiến sống lại” có sắc thái gượng. “được rao giảng rằng ... đã được làm cho sống lại” rõ và tự nhiên hơn, vẫn giữ được quan hệ mệnh đề và thể bị động. “Thì làm sao” cũng diễn đạt trực tiếp hơn câu hỏi tu từ πῶς.
  terminology: “Đấng Mê-si,” “rao giảng,” và “sự sống lại của người chết” phù hợp với tước hiệu, ý nghĩa công bố công khai, và thuật ngữ phục sinh chung trong nguyên văn. “Đã được làm cho sống lại” là cách diễn đạt Việt ngữ tự nhiên hơn để bảo tồn bị động của động từ Hy Lạp.
  issues:
  - severity: medium
    issue: Cú pháp “Đấng Mê-si được rao giảng là đã được khiến sống lại” gượng và “khiến sống lại” không phải cách dùng tự nhiên trong văn phong Kinh Thánh Việt ngữ hiện đại.
    rationale: κήρυσσεται ὅτι dẫn vào nội dung được rao giảng. Đổi thành “được rao giảng rằng ... đã được làm cho sống lại” biểu đạt minh bạch cấu trúc này và vẫn bảo toàn bị động hoàn thành của ἐγήγερται.
