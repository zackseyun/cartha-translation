revisions:
- from: 'Sự sống lại của những người đã chết cũng vậy: được gieo trong sự hư nát[a], được làm cho sống lại trong sự không hư nát.'
  to: 'Sự sống lại của người chết cũng vậy: được gieo trong tình trạng hư hoại[a], được làm cho sống lại trong tình trạng không hư hoại.'
  rationale: Điều chỉnh từ ngữ về φθορά/ἀφθαρσία để phản ánh chính xác hơn sự đối lập về tính hư hoại và không hư hoại, đồng thời làm câu gọn, tự nhiên hơn. Không thêm «thân thể», «chôn», hoặc một tác nhân cho hành động làm sống lại, vì các yếu tố ấy không được nêu trực tiếp trong câu Hy Lạp.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T19:24:25Z'
review_pass:
  verdict: revise
  source_fidelity: Bản dịch giữ đúng cấu trúc so sánh của Οὕτως καὶ, hình ảnh bị động «được gieo ... được làm cho sống lại», và sự tương phản giữa φθορά với ἀφθαρσία. Tuy nhiên, «sự hư nát» thiên về quá trình hoặc kết quả phân rã, trong khi φθορά ở đây nhấn mạnh tình trạng có thể hư hoại/phải hư hoại; «sự hư hoại» bao quát và sát hơn trong ngữ cảnh đối chiếu với tình trạng phục sinh.
  naturalness: «Sự sống lại của những người đã chết» hiểu được, nhưng «của người chết» gọn và tự nhiên hơn trong văn phong Kinh Thánh hiện đại. Cặp «tình trạng hư hoại / tình trạng không hư hoại» rõ nghĩa, song hành và tự nhiên hơn «sự hư nát / sự không hư nát».
  terminology: Giữ «sự sống lại», «được gieo», và «được làm cho sống lại» là thích hợp. Cách cuối bảo toàn thể bị động của ἐγείρεται mà không chuyển thành động từ chủ động; cũng không thêm chủ thể tác động mà nguyên văn không nêu. «Hư hoại / không hư hoại» duy trì đối lập thuật ngữ giữa φθορά và ἀφθαρσία.
  issues:
  - severity: low
    issue: «sự hư nát» có thể thu hẹp φθορά vào sự phân rã.
    rationale: Trong 1 Cô-rinh-tô 15, φθορά đối lập với ἀφθαρσία chủ yếu chỉ tính phải hư hoại/không thể hư hoại của thân thể, không chỉ tiến trình mục nát.
  - severity: low
    issue: «những người đã chết» hơi dài.
    rationale: «Người chết» diễn đạt tự nhiên và vẫn phản ánh τῶν νεκρῶν mà không đổi sang cấu trúc «từ cõi chết».
