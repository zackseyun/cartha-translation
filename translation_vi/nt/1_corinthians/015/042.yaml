base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/042.yaml
  text: 'So also is the resurrection of the dead: it is sown in corruption[a]; it is raised in incorruption.'
translation:
  language: vi
  text: 'Sự sống lại của người chết cũng vậy: được gieo trong tình trạng hư hoại[a], được làm cho sống lại trong tình trạng không hư hoại.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “được gieo trong tình trạng có thể hư hoại; được làm cho sống lại trong tình trạng không thể hư hoại.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὕτως καὶ
  choice: cũng vậy
  rationale: Nối trực tiếp với hình ảnh hạt giống ở phần trước, giữ sắc thái so sánh và kết luận bằng cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: ἡ ἀνάστασις τῶν νεκρῶν
  choice: sự sống lại của những người đã chết
  rationale: Giữ cấu trúc sở hữu của tiếng Hy Lạp và diễn đạt rõ rằng đối tượng sống lại là những người đã chết, không đổi thành 'từ cõi chết'.
- source_word: σπείρεται
  choice: được gieo
  rationale: Giữ thể bị động và hình ảnh gieo hạt; không diễn giải thành 'được chôn' hay thêm danh từ 'thân thể' dù ngữ cảnh hàm ý điều đó.
- source_word: ἐν φθορᾷ
  choice: trong sự hư nát
  rationale: Diễn đạt tình trạng chịu hư hoại và duy trì thế đối xứng từ vựng với ἀφθαρσία; không thu hẹp nghĩa chỉ còn quá trình phân rã.
- source_word: ἐγείρεται
  choice: được làm cho sống lại
  rationale: Trong ngữ cảnh phục sinh, cách dịch này giữ thể bị động và nói rõ hành động làm sống lại, thay vì dùng 'trỗi dậy' có thể bị hiểu là chủ động.
- source_word: ἐν ἀφθαρσίᾳ
  choice: trong sự không hư nát
  rationale: Giữ sự đối lập trực tiếp với 'sự hư nát' và hàm ý trạng thái không còn chịu hư hoại.
theological_decisions:
- issue: Bản chất của sự sống lại trong phép ví von gieo hạt
  choice: Giữ nguyên hai động từ bị động 'được gieo' và 'được làm cho sống lại', không biến phép ví von thành lời giải thích tường minh về việc chôn thân thể.
  alternative: 'Dịch diễn ý: ''thân thể được chôn xuống trong tình trạng dễ hư nát, nhưng được sống lại với thân thể không thể hư nát.'''
  rationale: Ngữ cảnh nói về sự sống lại của thân thể, nhưng câu Hy Lạp không nêu trực tiếp 'thân thể' hay 'chôn'. Bản dịch giữ cả tính liên tục lẫn biến đổi mà phép ví von của Phao-lô tạo ra, tránh giải quyết quá mức điều văn bản để hàm ẩn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cụm 'sự hư nát / sự không hư nát' được chọn để bảo toàn phép đối xứng của nguyên văn; chú thích nêu cách diễn đạt tự nhiên hơn về khả năng hư hoại.
