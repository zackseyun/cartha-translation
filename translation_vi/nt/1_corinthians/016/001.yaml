id: 1CO.16.1
reference: 1 Corinthians 16:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Περὶ δὲ τῆς λογείας τῆς εἰς τοὺς ἁγίους, ὥσπερ διέταξα ταῖς ἐκκλησίαις τῆς Γαλατίας, οὕτως καὶ ὑμεῖς ποιήσατε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/001.yaml
  text: Concerning the collection for the saints[a], as I directed the churches of Galatia, so you also are to do.
translation:
  language: vi
  text: Về việc quyên góp cho các thánh đồ[a], như tôi đã chỉ thị cho các hội thánh tại Ga-la-ti, anh em cũng hãy làm như vậy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “dân Chúa”.
    reason: Nêu cách diễn đạt tự nhiên khác cho οἱ ἅγιοι, tức cộng đồng những người thuộc về Đức Chúa Trời.
lexical_decisions:
- source_word: Περὶ δὲ
  choice: Về việc
  rationale: Mở đầu một chủ đề mới trong thư bằng cách diễn đạt tự nhiên trong tiếng Việt; không thêm từ chỉ thời gian vì nguyên ngữ không có từ “bây giờ”.
- source_word: λογείας
  choice: quyên góp
  rationale: Chỉ việc thu góp tiền; “quyên góp” rõ nghĩa trong tiếng Việt hiện đại và không mặc nhiên biến khoản tiền này thành một lễ vật phụng tự.
- source_word: τῆς εἰς τοὺς ἁγίους
  choice: cho các thánh đồ
  rationale: Diễn tả đối tượng thụ hưởng và giữ thuật ngữ quen thuộc của Phao-lô dành cho cộng đồng tín hữu.
- source_word: διέταξα
  choice: tôi đã chỉ thị
  rationale: Giữ sắc thái có thẩm quyền của động từ mà không tạo cảm giác gay gắt quá mức như “ra lệnh”.
- source_word: ἐκκλησίαις
  choice: các hội thánh
  rationale: Chỉ các cộng đồng Cơ Đốc địa phương trong cách dùng của Phao-lô.
- source_word: Γαλατίας
  choice: Ga-la-ti
  rationale: Dạng phiên âm quen thuộc trong tiếng Việt cho địa danh Galatia.
- source_word: οὕτως καὶ ὑμεῖς ποιήσατε
  choice: anh em cũng hãy làm như vậy
  rationale: Truyền đạt mệnh lệnh trực tiếp cùng ý nghĩa tương ứng với điều đã được chỉ thị cho các hội thánh Ga-la-ti.
theological_decisions:
- issue: Cách dịch ἅγιοι trong bối cảnh cứu trợ tài chính
  choice: các thánh đồ
  alternative: dân Chúa
  rationale: “Các thánh đồ” giữ sự nhất quán với cách Phao-lô gọi các tín hữu và không giới hạn từ này vào những người được phong thánh về sau; chú thích cung cấp cách nói dễ hiểu hơn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc “như… cũng… như vậy” bảo toàn phép so sánh của nguyên ngữ; đại từ “anh em” phù hợp với lời Phao-lô nói với toàn thể hội thánh.
source_grounding:
  english_pob_role: consult_only
