  - marker: b
    text: “Cùng cộng tác” cũng có thể dịch là “đồng công” hoặc “cùng làm việc.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: thì ... hãy
  rationale: Trong mạch lời kêu gọi bắt đầu ở câu trước, ἵνα dẫn vào nội dung điều Phao-lô khuyên; cách diễn đạt này nối tự nhiên với câu 15 trong tiếng Việt mà vẫn giữ lực khuyến exhortative.
- source_word: καὶ ὑμεῖς
  choice: anh chị em cũng
  rationale: 'Giữ sắc thái bao gồm và nhấn mạnh của καὶ: chính các tín hữu Cô-rinh-tô cũng cần đáp ứng như vậy.'
- source_word: ὑποτάσσησθε
  choice: hãy thuận phục
  rationale: Diễn đạt việc tự nguyện đặt mình dưới sự hướng dẫn hoặc trật tự được nhìn nhận, mạnh hơn 'tôn trọng' nhưng không tự động hàm ý vâng phục tuyệt đối.
- source_word: τοῖς τοιούτοις
  choice: những người như thế
  rationale: Chỉ hạng người giống gia đình Sê-pha-na vừa được nhắc đến, không thu hẹp không cần thiết về giới tính.
- source_word: παντὶ τῷ συνεργοῦντι
  choice: mọi người đồng công
  rationale: συνεργέω nói đến cùng cộng tác trong công việc; 'đồng công' ngắn gọn, quen thuộc trong văn phong Cơ Đốc và giữ sắc thái cộng tác.
- source_word: καὶ κοπιῶντι
  choice: và nhọc nhằn làm việc
  rationale: Giữ ý lao nhọc, gắng sức của κοπιάω, đồng thời tự nhiên và rõ nghĩa hơn nếu chỉ dùng 'lao nhọc'.
theological_decisions:
- issue: Tính chất của sự thuận phục được truyền dạy
  choice: Lời kêu gọi tự nguyện thuận phục những người phục vụ được nhìn nhận như những người vừa nêu
  alternative: Một mệnh lệnh rộng hơn về sự vâng phục theo phẩm trật
  rationale: Ngữ cảnh gần nói về gia đình Sê-pha-na và tất cả những người cùng góp sức, lao nhọc. Bản dịch giữ nguyên sức nặng của ὑποτάσσησθε nhưng không thêm ý vâng phục tuyệt đối hoặc một cơ cấu chức vụ mà câu này không nói rõ.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” cho đại từ số nhiều hướng đến toàn thể hội thánh; “thuận phục” giữ sắc thái thần học của động từ Hy Lạp mà không biến thành sự vâng phục tuyệt đối. Các dấu chú thích [a], [b] đều xuất hiện đúng tại từ ngữ liên quan trong chính văn.
