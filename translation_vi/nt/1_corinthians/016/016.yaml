- from: thì anh chị em cũng hãy thuận phục những người như thế[a], cùng mọi người đồng công[b] và nhọc nhằn làm việc.
  to: để anh chị em cũng hãy thuận phục những người như thế[a], cùng mọi người cùng cộng tác[b] và lao nhọc.
  rationale: Thay “thì” bằng “để” để phản ánh rõ hơn liên từ ἵνα trong quan hệ với lời nài khuyên ở câu trước. Thay “đồng công” bằng “cùng cộng tác” để giữ hình thức và nghĩa động từ của συνεργοῦντι. “Lao nhọc” đã tự mang ý làm việc vất vả của κοπιάω, nên không cần lặp thêm “làm việc.” Các điểm còn lại được giữ nguyên vì trung thành với nguyên văn và phù hợp văn phong Kinh Thánh Việt ngữ hiện đại.
