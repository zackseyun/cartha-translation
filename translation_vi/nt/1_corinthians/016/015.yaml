source:
  edition: SBLGNT
  text: Παρακαλῶ δὲ ὑμᾶς, ἀδελφοί· οἴδατε τὴν οἰκίαν Στεφανᾶ, ὅτι ἐστὶν ἀπαρχὴ τῆς Ἀχαΐας καὶ εἰς διακονίαν τοῖς ἁγίοις ἔταξαν ἑαυτούς·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/015.yaml
  text: 'I urge you[a], brothers: you know the household of Stephanas, that they are the firstfruits of Achaia[b], and they devoted themselves to the service of the saints.'
translation:
  language: vi
  text: 'Thưa anh chị em[a], tôi khuyên nhủ anh chị em: anh chị em biết gia hộ của Sê-pha-na, là trái đầu mùa của A-chai[b], và họ đã tự nguyện dấn thân vào việc phục vụ các thánh đồ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tiếng Hy Lạp viết “anh em”, một cách xưng hô thông dụng có thể bao gồm toàn thể hội chúng, cả nam lẫn nữ.
    reason: lexical_alternative
  - marker: b
    text: “Trái đầu mùa” có lẽ chỉ những người tin Chúa sớm nhất tại A-chai, đồng thời vẫn giữ hình ảnh phần hoa lợi đầu tiên được biệt riêng cho Đức Chúa Trời.
    reason: lexical_alternative
lexical_decisions:
- source_word: Παρακαλῶ
  choice: tôi khuyên
  rationale: Diễn đạt một lời kêu gọi tha thiết, có sức nặng nhưng vẫn tự nhiên trong tiếng Việt hiện đại.
- source_word: δὲ
  choice: không dịch thành một từ riêng
  rationale: δέ đánh dấu sự chuyển ý nhẹ; trong tiếng Việt, mạch chuyển được thể hiện tự nhiên qua lời xưng hô mở đầu, tránh thêm một từ thời gian không có trong nguồn.
- source_word: ἀδελφοί
  choice: anh chị em
  rationale: Trong lời gọi hội chúng, dạng số nhiều giống đực này thường bao gồm cả cộng đồng nam nữ; “anh chị em” truyền đạt đúng phạm vi người nghe bằng tiếng Việt tự nhiên.
- source_word: οἴδατε
  choice: anh chị em biết
  rationale: Dạng hoàn thành mang nghĩa hiện tại ở đây; “biết” là cách diễn đạt trực tiếp và tự nhiên.
- source_word: οἰκίαν Στεφανᾶ
  choice: gia đình Sê-pha-na
  rationale: οἰκία chỉ toàn thể gia hộ chứ không phải căn nhà vật chất; “gia đình” dễ hiểu, dù có thể bao gồm phạm vi rộng hơn quan hệ huyết thống.
- source_word: ἀπαρχὴ τῆς Ἀχαΐας
  choice: trái đầu mùa của miền A-chai
  rationale: Giữ nguyên ẩn dụ về phần hoa lợi đầu tiên, đồng thời không thu hẹp nghĩa chỉ còn “những người tin đầu tiên”.
- source_word: εἰς διακονίαν τοῖς ἁγίοις
  choice: phục vụ các thánh đồ
  rationale: Cách nói gọn và tự nhiên, diễn đạt việc phục vụ hướng đến các tín hữu mà không hàm ý một chức vụ giáo hội chính thức.
- source_word: ἔταξαν ἑαυτούς
  choice: đã tận tâm
  rationale: Diễn đạt hành động tự nguyện đặt mình vào một công việc và bền lòng với công việc ấy, thay vì sự bổ nhiệm chính thức.
theological_decisions:
- issue: Phạm vi của ἀδελφοί trong lời gọi hội chúng
  choice: anh chị em
  alternative: anh em
  rationale: Ngữ cảnh là lời nói với toàn hội chúng; tiếng Việt dùng “anh chị em” tự nhiên để biểu thị tập thể gồm cả nam và nữ, trong khi chú thích vẫn nêu rõ hình thức Hy Lạp.
- issue: Ý nghĩa của ἀπαρχὴ τῆς Ἀχαΐας
  choice: trái đầu mùa của miền A-chai
  alternative: những người đầu tiên tin Chúa tại miền A-chai
  rationale: Giữ hình ảnh nguyên tác và sắc thái có thể liên quan đến sự biệt riêng cho Đức Chúa Trời, thay vì giải quyết hoàn toàn ẩn dụ theo nghĩa thời gian.
- issue: Danh xưng τοῖς ἁγίοις
  choice: các thánh đồ
  alternative: dân thánh của Đức Chúa Trời
  rationale: “Các thánh đồ” giữ cách gọi thần học quen thuộc của Phao-lô dành cho các tín hữu mà không gán cho họ địa vị do một thể chế phong thánh.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Lời xưng hô được đưa lên đầu câu để câu tiếng Việt tự nhiên; tên riêng được phiên âm theo cách đọc quen thuộc. Giữ ẩn dụ “trái đầu mùa” và giải thích trong chú thích.
