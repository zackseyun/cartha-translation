- from: 'Thưa anh chị em[a], tôi khuyên anh chị em: anh chị em biết gia đình Sê-pha-na là trái đầu mùa của miền A-chai[b], và họ đã tận tâm phục vụ các thánh đồ.'
  to: 'Thưa anh chị em[a], tôi khuyên nhủ anh chị em: anh chị em biết gia hộ của Sê-pha-na, là trái đầu mùa của A-chai[b], và họ đã tự nguyện dấn thân vào việc phục vụ các thánh đồ.'
