base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/020.yaml
  text: All the brothers greet you[b][a]. Greet one another with a holy kiss.
translation:
  language: vi
  text: Tất cả anh chị em đều gửi lời chào thăm anh chị em.[a] Hãy chào nhau bằng một nụ hôn thánh.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Anh chị em” dịch một từ Hy Lạp có hình thức giống đực số nhiều. Khi dùng cho cộng đoàn tín hữu, từ này có thể chỉ chung các tín hữu nam và nữ.
    reason: lexical_alternative
  - marker: b
    text: “Nụ hôn thánh” là một cách chào hỏi quen thuộc giữa các tín hữu, biểu thị sự thánh khiết và sự thông công với nhau.
    reason: cultural_note
lexical_decisions:
- source_word: ἀσπάζονται
  choice: gửi lời chào
  rationale: Trong ngữ cảnh thư tín, động từ diễn tả việc chuyển lời chào đến người nhận; cách nói này tự nhiên trong tiếng Việt khi chủ thể không hiện diện tại nơi người nhận.
- source_word: οἱ ἀδελφοὶ πάντες
  choice: tất cả anh chị em
  rationale: Danh từ số nhiều giống đực có thể chỉ chung các tín hữu trong hội chúng gồm cả nam lẫn nữ. “Anh chị em” truyền đạt nghĩa cộng đồng thân thuộc một cách tự nhiên và chính xác trong tiếng Việt.
- source_word: ὑμᾶς
  choice: đến anh chị em
  rationale: Đại từ ngôi thứ hai số nhiều chỉ toàn thể cộng đoàn nhận thư; “anh chị em” giữ sắc thái thân thuộc của lời nói với các tín hữu.
- source_word: ἀσπάσασθε ἀλλήλους
  choice: hãy chào nhau
  rationale: Mệnh lệnh và đại từ tương hỗ được diễn đạt ngắn gọn, tự nhiên, đồng thời giữ sự liên hệ từ vựng với lời chào ở mệnh đề trước.
- source_word: ἐν φιλήματι ἁγίῳ
  choice: bằng một nụ hôn thánh
  rationale: Giữ hình ảnh cụ thể của φίλημα và phẩm tính ἅγιος; giới từ ἐν ở đây diễn tả phương thức chào hỏi.
theological_decisions:
- issue: Phạm vi nghĩa của ἀδελφοί trong cộng đoàn
  choice: anh chị em
  alternative: anh em
  rationale: Dù hình thức Hy Lạp là giống đực số nhiều, trong cách Paul gọi cộng đoàn, từ này thường bao gồm các tín hữu nam và nữ. Tiếng Việt hiện đại cần nêu cả hai để không khiến người đọc hiểu sai rằng chỉ có nam giới.
- issue: Tính chất của “nụ hôn thánh”
  choice: giữ nguyên hình thức chào hỏi cụ thể trong chính văn
  alternative: chào nhau cách thánh thiện
  rationale: Cụm Hy Lạp nói rõ đến một nụ hôn, không chỉ một lời chào chung chung. Bản dịch giữ hành động cụ thể và dùng chú thích để cung cấp bối cảnh văn hóa, không quyết định thay độc giả cách áp dụng hiện nay.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “anh chị em” cho cộng đoàn tín hữu; “gửi lời chào” phù hợp ngữ cảnh thư tín, còn “hãy chào nhau” giữ mệnh lệnh trực tiếp. Các dấu chú thích được đặt ngay sau phần chính văn liên quan.
