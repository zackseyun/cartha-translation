id: 1CO.16.22
reference: 1 Corinthians 16:22
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἴ τις οὐ φιλεῖ τὸν ⸀κύριον, ἤτω ἀνάθεμα. ⸂Μαράνα θά⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/022.yaml
  text: If anyone does not love the Lord[a], let him be accursed[b]. Marana tha.
translation:
  language: vi
  text: Nếu ai không yêu mến Chúa, người ấy phải bị nguyền rủa[a]. Ma-ra-na tha[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dùng thuật ngữ truyền thống: “a-na-tem”; nghĩa là ở dưới sự nguyền rủa.'
    reason: lexical_alternative
  - marker: b
    text: 'Tiếng A-ram. Có thể có nghĩa: “Lạy Chúa chúng con, xin ngự đến!” hoặc “Chúa chúng ta đã đến.”'
    reason: alternative_reading
lexical_decisions:
- source_word: φιλεῖ
  choice: yêu mến
  rationale: Động từ φιλέω ở đây chỉ tình yêu và sự gắn bó đối với Chúa. “Yêu mến” tự nhiên, trang trọng và diễn đạt sắc thái tình cảm rõ hơn “yêu” đơn thuần mà không thu hẹp nghĩa thành tình bạn.
- source_word: κύριον
  choice: Chúa
  rationale: Trong văn cảnh của Phao-lô, κύριος là tước hiệu chỉ Chúa Giê-su. “Chúa” bảo tồn trọng lượng Cơ Đốc học và phù hợp với cách dùng Tân Ước quen thuộc trong tiếng Việt.
- source_word: ἤτω
  choice: phải bị
  rationale: Dạng mệnh lệnh hiện tại của εἰμί có lực cầu khiến hoặc tuyên án. “Phải bị” tạo câu tiếng Việt tự nhiên và giữ được tính nghiêm trọng, dứt khoát của lời tuyên bố.
- source_word: ἀνάθεμα
  choice: bị nguyền rủa
  rationale: ἀνάθεμα chỉ tình trạng ở dưới sự nguyền rủa hoặc bị dành cho sự hủy diệt. “Bị nguyền rủa” rõ nghĩa với độc giả hiện đại; thuật ngữ phiên âm truyền thống được ghi ở chú thích.
- source_word: Μαράνα θά
  choice: Ma-ra-na tha
  rationale: Đây là một thành ngữ A-ram được bảo tồn bằng chữ Hy Lạp. Giữ dạng phiên âm trong chính văn nhằm bảo tồn tính chất nguyên ngữ và không quyết định thay cho độc giả giữa các cách phân chia, giải nghĩa còn được tranh luận.
theological_decisions:
- issue: Ý nghĩa của thành ngữ A-ram Μαράνα θά
  choice: Giữ dạng phiên âm “Ma-ra-na tha” trong chính văn.
  alternative: “Lạy Chúa chúng con, xin ngự đến!” hoặc “Chúa chúng ta đã đến.”
  rationale: Cách phân chia và hiểu thành ngữ A-ram này không hoàn toàn chắc chắn. Phiên âm bảo tồn sự mơ hồ có thật của nguồn, còn chú thích trình bày hai cách hiểu chính mà không âm thầm lựa chọn một cách.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Người ấy” dùng thay cho đại từ mang dấu giới tính vì εἴ τις có nghĩa khái quát là “nếu ai”. Các dấu chú thích được đặt ngay sau những cụm từ tương ứng; cách đặt này cũng sửa sự lệch dấu trong lớp tham khảo tiếng Anh.
