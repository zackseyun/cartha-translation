  text: ἡ χάρις τοῦ κυρίου ⸀Ἰησοῦ μεθ’ ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/023.yaml
  text: The grace of the Lord Jesus be with you.
translation:
  language: vi
  text: Nguyện ân điển của Chúa Giê-su ở cùng anh chị em.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χάρις
  choice: ân điển
  rationale: Trong lời chúc phước của Phao-lô, từ này chỉ ân huệ và phước lành nhưng không của Chúa. “Ân điển” là cách diễn đạt quen thuộc, trang trọng và giữ được sức nặng thần học của thuật ngữ.
- source_word: κύριος
  choice: Chúa
  rationale: “Chúa” vừa tự nhiên trong tiếng Việt vừa thể hiện đúng tước hiệu dành cho Đức Giê-su trong Tân Ước; “chủ” không thích hợp với lời chúc phước này.
- source_word: Ἰησοῦ
  choice: Giê-su
  rationale: Dùng dạng tên riêng đã được Việt hóa và phổ biến trong tiếng Việt hiện đại.
- source_word: μεθ’ ὑμῶν
  choice: ở cùng anh chị em
  rationale: Cụm Hy Lạp có nghĩa đen là “cùng với anh chị em”. Trong công thức chúc phước, thêm “Nguyện” và động từ “ở” diễn đạt tự nhiên ý cầu chúc vốn được hàm ẩn.
- source_word: τοῦ κυρίου Ἰησοῦ
  choice: của Chúa Giê-su
  rationale: Giữ quan hệ sở hữu/nguồn gốc của cấu trúc sở hữu cách Hy Lạp mà không buộc phải giải nghĩa rõ hơn thành “đến từ”.
theological_decisions:
- issue: Công thức chúc phước tỉnh lược, không có động từ rõ ràng
  choice: Dùng “Nguyện ... ở cùng ...”
  alternative: “Ân điển của Chúa Giê-su cùng với anh chị em.”
  rationale: Nguyên văn không có động từ, nhưng công thức này mang lực cầu chúc. “Nguyện ... ở cùng ...” chuyển tải lực ấy bằng tiếng Việt tự nhiên mà không thêm nội dung thần học.
- issue: Số nhiều của ὑμῶν không biểu thị giới tính
  choice: “anh chị em”
  alternative: “các bạn” hoặc “anh em”
  rationale: “Anh chị em” diễn đạt cộng đồng tín hữu gồm cả nam lẫn nữ, giữ sắc thái thân thuộc và trang trọng; không biến đại từ số nhiều thành một cách gọi chỉ nam giới.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu; giữ cấu trúc lời chúc phước ngắn gọn. Không cần chú thích vì câu không có dị bản hoặc độ mơ hồ nào cần trình bày trong bản dịch.
