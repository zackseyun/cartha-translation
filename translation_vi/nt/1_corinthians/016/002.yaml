language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: κατὰ μίαν ⸀σαββάτου ἕκαστος ὑμῶν παρ’ ἑαυτῷ τιθέτω θησαυρίζων ὅ τι ⸀ἐὰν εὐοδῶται, ἵνα μὴ ὅταν ἔλθω τότε λογεῖαι γίνωνται.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/002.yaml
  text: On the first day of every week[a], each of you is to set something aside, storing up whatever he may prosper in[c][b], so that collections will not be made when I come.
translation:
  language: vi
  text: Vào ngày đầu tiên mỗi tuần[a], mỗi người trong anh em hãy để riêng cho mình một phần, tích góp tùy theo mức độ mình được thịnh vượng[c], để khi tôi đến thì không cần phải quyên góp.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Vào ngày đầu tiên trong tuần.” Cách nói Hy Lạp ở đây mang ý phân phối, chỉ một việc được thực hiện đều đặn mỗi tuần.'
    reason: lexical_alternative
  - marker: b
    text: 'Nghĩa đen: “bên mình” hoặc “ở chỗ mình.” Cụm từ này có thể chỉ việc mỗi người tự dành riêng một phần, có lẽ là giữ tại nhà.'
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “tùy theo mức độ mình được hanh thông.” Ý nói mỗi người dành ra một phần tương ứng với mức độ thịnh vượng mình nhận được.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ μίαν σαββάτου
  choice: Vào ngày thứ nhất mỗi tuần
  rationale: Cấu trúc κατά với đối cách mang ý phân phối, diễn tả một việc được thực hiện đều đặn hằng tuần. Cách dịch này tự nhiên trong tiếng Việt và giữ rõ tính lặp lại.
- source_word: ἕκαστος ὑμῶν
  choice: mỗi người trong anh em
  rationale: Diễn đạt rõ mệnh lệnh được áp dụng riêng cho từng người trong cộng đồng; “anh em” phù hợp với lối xưng hô của thư nhưng vẫn bao gồm cả cộng đồng.
- source_word: παρ’ ἑαυτῷ
  choice: để riêng ra cho mình
  rationale: Cụm từ có nghĩa đen là “bên mình/ở chỗ mình” và đi với τιθέτω để chỉ việc mỗi người tự dành riêng một khoản. Cách dịch không quyết đoán rằng tiền nhất thiết phải được giữ tại nhà.
- source_word: τιθέτω θησαυρίζων
  choice: hãy để riêng ra ... và tích lại
  rationale: τιθέτω là mệnh lệnh hiện tại, còn θησαυρίζων bổ sung ý tích góp qua thời gian. Hai động từ tiếng Việt truyền đạt cả việc dành riêng và tích lũy đều đặn.
- source_word: ὅ τι ἐὰν εὐοδῶται
  choice: một khoản tùy theo mức mình được thuận lợi
  rationale: Mệnh đề bất định liên hệ số tiền dành ra với mức độ thuận lợi hay thịnh đạt của mỗi người. “Được thuận lợi” giữ phần nào sắc thái của dạng động từ Hy Lạp và không thu hẹp ý nghĩa chỉ còn tiền lương hay thu nhập.
- source_word: ἵνα μὴ ὅταν ἔλθω τότε λογεῖαι γίνωνται
  choice: để khi tôi đến thì không phải tổ chức quyên góp nữa
  rationale: 'Diễn đạt tự nhiên mệnh đề mục đích: việc dành tiền đều đặn nhằm tránh phải tiến hành quyên góp vào lúc Phao-lô đến.'
theological_decisions:
- issue: Địa điểm và tính chất của việc để riêng tiền
  choice: Không xác định dứt khoát rằng khoản tiền phải được giữ tại nhà hay nộp vào quỹ chung mỗi tuần.
  alternative: Dịch rõ là “để riêng tại nhà”.
  rationale: παρ’ ἑαυτῷ có thể được hiểu là “ở chỗ mình/tại nhà” hoặc nhấn mạnh việc mỗi cá nhân tự dành riêng. Bản dịch chính giữ sự mơ hồ thật sự của nguyên văn, còn chú thích nêu khả năng cụ thể hơn.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “hãy” để thể hiện lực mệnh lệnh; tránh từ cổ. “Một khoản” được dùng vì ngữ cảnh rõ là tiền quyên góp, dù nguyên văn chỉ nói điều gì đó được dành ra. Các chú thích bảo lưu những điểm có thể hiểu khác nhau về nhịp hằng tuần, nơi giữ tiền và mức độ thịnh đạt.
