revisions:
- from: Vào ngày thứ nhất mỗi tuần[a], mỗi người trong anh em hãy để riêng ra cho mình[b] và tích lại một khoản tùy theo mức mình được thuận lợi[c], để khi tôi đến thì không phải tổ chức quyên góp nữa.
  to: Vào ngày đầu tiên mỗi tuần[a], mỗi người trong anh em hãy để riêng cho mình một phần, tích góp tùy theo mức độ mình được thịnh vượng[c], để khi tôi đến thì không cần phải quyên góp.[b]
  rationale: Bản sửa giữ nguyên mơ hồ của παρ’ ἑαυτῷ bằng “cho mình” và chú thích, diễn đạt tự nhiên hơn mệnh đề về sự thịnh vượng, đồng thời tránh thu hẹp nghĩa vào việc kinh doanh. “Một phần” là cách nói tiếng Việt tự nhiên cho điều được để riêng trong ngữ cảnh quyên góp mà không quy định một số tiền cụ thể. Các ký hiệu chú thích được đặt lại đúng ngay sau yếu tố chúng giải thích.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T19:24:34Z'
review_pass:
  verdict: revise
  source_fidelity: Bản dịch phản ánh đúng tính lặp lại hằng tuần, tính áp dụng cho từng người, việc để dành/tích góp, và mục đích tránh quyên góp khi Phao-lô đến. Tuy nhiên, “tùy theo mức mình được thuận lợi” là một lối diễn đạt gượng và chú thích c thu hẹp nghĩa vào hoạt động “làm ăn”.
  naturalness: 'Cần chỉnh nhẹ để tiếng Việt hiện đại tự nhiên hơn: “ngày đầu tiên mỗi tuần” trôi chảy hơn, và “không cần phải quyên góp” diễn đạt mục đích của câu rõ hơn “không phải tổ chức quyên góp nữa”.'
  terminology: “Anh em” phù hợp văn phong thư tín Tân Ước và bao hàm cộng đồng người nhận. “Thịnh vượng” truyền đạt εὐοδῶται tự nhiên hơn “được thuận lợi”, mà không giới hạn vào thu nhập hay kinh doanh. Giữ “cho mình” cùng chú thích để không quyết định tranh luận về địa điểm cất giữ.
  issues:
  - severity: medium
    issue: Cụm “tùy theo mức mình được thuận lợi” không tự nhiên trong tiếng Việt.
    rationale: Cụm này bám sát hình thức bị động của εὐοδῶται nhưng tạo ra cách nói gượng. “Tùy theo mức độ mình được thịnh vượng” giữ nghĩa nhận được sự hanh thông/thịnh vượng mà đọc tự nhiên hơn.
  - severity: medium
    issue: Chú thích c dùng “mình làm ăn thịnh đạt đến đâu”.
    rationale: “Làm ăn” thu hẹp εὐοδῶται vào thành công kinh doanh, trong khi động từ chỉ sự thịnh vượng/hanh thông nói chung.
  - severity: low
    issue: “Không phải tổ chức quyên góp nữa” có sắc thái tổ chức và “nữa” không được nêu rõ trong nguyên văn.
    rationale: λογεῖαι γίνωνται nói các cuộc quyên góp không cần diễn ra khi Phao-lô đến. Cách diễn đạt sửa đổi giữ mục đích này mà không thêm sắc thái dư thừa.
