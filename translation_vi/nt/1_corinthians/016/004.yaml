translation:
  language: vi
  text: Còn nếu việc tôi đi cũng là thích hợp[a], thì họ sẽ đi cùng tôi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “nếu tôi cũng nên đi.” Cụm từ Hy Lạp có thể chỉ điều thích hợp, phải lẽ hoặc đáng làm trong hoàn cảnh ấy.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν δὲ
  choice: Còn nếu
  rationale: ἐάν mở đầu mệnh đề điều kiện, còn δέ là từ nối nhẹ. “Còn nếu” nối tự nhiên với câu trước mà không nhấn mạnh sự tương phản quá mức.
- source_word: ἄξιον ᾖ
  choice: là thích hợp
  rationale: Tính từ trung tính ἄξιον đi với ᾖ tạo thành cách diễn đạt vô nhân xưng, chỉ điều phù hợp hoặc đáng thực hiện trong hoàn cảnh này; không nói về phẩm giá đạo đức của Phao-lô.
- source_word: τοῦ κἀμὲ πορεύεσθαι
  choice: việc tôi cũng đi
  rationale: Cụm động từ nguyên mẫu có mạo từ nêu nội dung của điều được xem là thích hợp; κἀμέ giữ ý bổ sung “tôi cũng”.
- source_word: σὺν ἐμοὶ
  choice: cùng tôi
  rationale: σύν với tặng cách diễn tả sự đồng hành; “cùng tôi” là cách nói tự nhiên và chính xác.
- source_word: πορεύσονται
  choice: họ sẽ đi
  rationale: Động từ tương lai nói về việc các đại biểu lên đường; “sẽ đi” giữ được sự lặp lại với πορεύεσθαι mà không thêm sắc thái không có trong nguyên văn.
theological_decisions:
- issue: Ý nghĩa lời nói có điều kiện của Phao-lô về việc cùng phái đoàn lên đường
  choice: Phao-lô nói rằng nếu việc chính ông cũng đi được xem là thích hợp, thì các đại biểu sẽ đi cùng ông.
  alternative: Món quà phải đủ quan trọng để Phao-lô đi; hoặc Phao-lô phải xứng đáng mới được đi.
  rationale: ἄξιον được dùng theo lối vô nhân xưng, còn cụm động từ nguyên mẫu xác định hành động đang được cân nhắc. Bối cảnh nói về sự sắp xếp thực tế cho việc chuyển khoản quyên góp, chứ không đánh giá phẩm giá đạo đức của Phao-lô.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Việc tôi cũng đi là thích hợp” giữ cách diễn đạt vô nhân xưng cùng độ mở nghĩa của ἄξιον; dấu chú thích [a] được đặt ngay sau cụm từ liên quan.
