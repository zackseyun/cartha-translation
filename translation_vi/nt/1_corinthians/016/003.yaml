source:
  edition: SBLGNT
  text: ὅταν δὲ παραγένωμαι, οὓς ⸀ἐὰν δοκιμάσητε δι’ ἐπιστολῶν, τούτους πέμψω ἀπενεγκεῖν τὴν χάριν ὑμῶν εἰς Ἰερουσαλήμ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/003.yaml
  text: And when I arrive[b][a], I will send with letters those whom you approve to carry your gift to Jerusalem.
translation:
  language: vi
  text: Khi tôi đến, tôi sẽ cử những người được anh chị em chấp thuận, cùng với các thư, để mang món quà[a] của anh chị em đến Giê-ru-sa-lem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “món quà đầy ân tình.” Từ Hy Lạp này cũng có nghĩa là “ân điển,” nhưng ở đây chỉ khoản đóng góp được gửi đến Giê-ru-sa-lem.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν δὲ παραγένωμαι
  choice: Khi tôi đến
  rationale: ὅταν đi với động từ giả định quá khứ hướng đến một thời điểm tương lai; “khi tôi đến” diễn đạt tự nhiên mà vẫn giữ tính chưa xảy ra. δέ chỉ nối nhẹ trong văn cảnh nên không cần dịch thành một từ đối lập mạnh.
- source_word: οὓς ἐὰν δοκιμάσητε
  choice: những người anh chị em chấp thuận
  rationale: δοκιμάζω có thể bao hàm việc xem xét rồi công nhận là thích hợp. Trong bối cảnh chọn người đại diện, “chấp thuận” rõ ràng và tự nhiên; “anh chị em” thể hiện đại từ số nhiều chỉ cả hội thánh.
- source_word: δι’ ἐπιστολῶν
  choice: kèm theo các thư
  rationale: διά với sở hữu cách diễn tả phương tiện hoặc điều đi kèm. Cách dịch này giữ số nhiều của ἐπιστολαί và cho thấy những người được cử sẽ mang theo thư, nhưng không tự ý xác định đó là thư giới thiệu.
- source_word: τούτους πέμψω
  choice: tôi sẽ cử những người ấy
  rationale: πέμπω là sai hoặc phái đi; trong việc chỉ định đại diện, “cử” tự nhiên hơn “sai”. Đại từ hồi chỉ τούτους được thể hiện qua cụm “những người anh chị em chấp thuận” mà không cần lặp lại nặng nề.
- source_word: ἀπενεγκεῖν
  choice: để mang
  rationale: Động từ nguyên mẫu nêu mục đích của việc cử người đi. “Mang” phù hợp với việc vận chuyển khoản quyên góp từ Cô-rinh-tô đến Giê-ru-sa-lem.
- source_word: τὴν χάριν ὑμῶν
  choice: món quà của anh chị em
  rationale: Trong văn cảnh quyên góp cho các thánh đồ, χάρις chỉ món quà hay khoản đóng góp cụ thể, đồng thời vẫn có sắc thái của lòng rộng rãi. “Món quà” dễ hiểu và tránh biến từ này thành khái niệm ân điển trừu tượng.
- source_word: εἰς Ἰερουσαλήμ
  choice: đến Giê-ru-sa-lem
  rationale: εἰς với địa danh chỉ đích đến; “đến Giê-ru-sa-lem” là cách nói tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Ý nghĩa của χάρις trong bối cảnh cuộc quyên góp
  choice: Món quà vật chất dành cho các tín hữu tại Giê-ru-sa-lem
  alternative: ân điển theo nghĩa trừu tượng; hoặc hành động hào phóng
  rationale: Mạch văn 1 Cô-rinh-tô 16 nói trực tiếp về việc thu góp cho các thánh đồ. Vì vậy, χάρις ở đây chỉ khoản tặng cụ thể, dù từ này vẫn gợi sắc thái ân hậu và rộng rãi.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Anh chị em” được dùng cho đại từ số nhiều của cả hội thánh; “cử” phù hợp với việc hội thánh chọn các đại diện. Dấu phẩy đặt “kèm theo các thư” như thành phần phụ để tránh hiểu rằng thư là phương tiện hội thánh dùng để phê chuẩn họ.
