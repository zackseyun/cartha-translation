  - severity: low
    issue: “hãy liệu sao để” hơi gượng trong tiếng Việt hiện đại.
    rationale: “Hãy liệu để” diễn đạt mệnh lệnh “hãy lo liệu/bảo đảm rằng” tự nhiên hơn, đồng thời giữ lực của βλέπετε ἵνα.
