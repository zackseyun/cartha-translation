  text: Ἐὰν δὲ ἔλθῃ Τιμόθεος, βλέπετε ἵνα ἀφόβως γένηται πρὸς ὑμᾶς, τὸ γὰρ ἔργον κυρίου ἐργάζεται ὡς ⸀κἀγώ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/010.yaml
  text: If Timothy comes[a], see that he may be with you without fear, for he is doing the Lord’s work[b], as I also am.
translation:
  language: vi
  text: Nếu Ti-mô-thê đến[a], hãy liệu để Ti-mô-thê ở với anh chị em mà không sợ hãi, vì anh ấy làm công việc của Chúa[b], cũng như tôi vậy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “hãy liệu để anh ấy ở giữa anh chị em mà không sợ hãi.” Cách diễn đạt Hy Lạp có thể nhấn mạnh việc Ti-mô-thê hiện diện giữa cộng đoàn trong tình trạng không sợ hãi.'
    reason: lexical_alternative
  - marker: b
    text: 'Hoặc: “vì anh ấy làm công việc của Chúa, cũng như tôi cũng làm.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐὰν δὲ
  choice: Nếu
  rationale: Diễn đạt tự nhiên điều kiện hướng đến tương lai; δέ chỉ chuyển ý nhẹ và không nhất thiết phải biểu đạt bằng một liên từ riêng trong tiếng Việt.
- source_word: ἔλθῃ Τιμόθεος
  choice: Ti-mô-thê đến
  rationale: Thể giả định aorist sau ἐάν diễn tả một khả năng trong tương lai; “đến” là cách nói tự nhiên và sát nghĩa.
- source_word: βλέπετε ἵνα
  choice: hãy liệu sao để
  rationale: Thể hiện mệnh lệnh đòi hỏi cộng đồng chủ động quan tâm và bảo đảm điều được nói trong mệnh đề ἵνα.
- source_word: ἀφόβως γένηται πρὸς ὑμᾶς
  choice: anh ấy ở giữa anh chị em mà không sợ hãi
  rationale: Giữ cả ý về sự hiện diện/trạng thái của Ti-mô-thê trong quan hệ với cộng đồng lẫn nghĩa trực tiếp của ἀφόβως, không thu hẹp thành cảm giác an toàn chủ quan.
- source_word: τὸ ἔργον κυρίου ἐργάζεται
  choice: anh ấy đang làm công việc của Chúa
  rationale: Lối diễn đạt tự nhiên trong tiếng Việt, đồng thời phản ánh hoạt động đang tiếp diễn và cấu trúc “công việc của Chúa”.
- source_word: ὡς κἀγώ
  choice: cũng như tôi vậy
  rationale: κἀγώ mang nghĩa “cả tôi nữa”; câu tiếng Việt giữ phép tỉnh lược tự nhiên và đặt công việc của Ti-mô-thê song song với công việc của Phao-lô.
theological_decisions:
- issue: Đối tượng được gọi là κύριος
  choice: giữ là “Chúa” mà không xác định thêm trong bản văn
  alternative: dịch rõ là “Chúa Giê-su”
  rationale: Trong văn chương Phao-lô, từ này rất có thể chỉ Chúa Giê-su, nhưng nguyên văn chỉ dùng κύριος; bản dịch không thêm sự xác định mà câu Hy Lạp không nói rõ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” cho số nhiều ὑμᾶς và “anh ấy” cho Ti-mô-thê nhằm làm rõ các đại từ trong tiếng Việt mà không thêm nội dung thần học.
