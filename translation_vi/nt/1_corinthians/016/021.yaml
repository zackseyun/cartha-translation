- source_word: Ὁ ἀσπασμός
  choice: Lời chào này
  rationale: Danh từ có mạo từ chỉ lời chào đang được viết; thêm “này” giúp tiếng Việt tự nhiên và tương ứng với giá trị xác định trong ngữ cảnh.
- source_word: τῇ ἐμῇ χειρί
  choice: do chính tay tôi ... viết
  rationale: Thành ngữ chỉ việc Phao-lô tự tay viết, có lẽ để phân biệt với phần thư do người chép ghi; diễn đạt bằng động từ “viết” vốn được hàm ý trong câu Hy Lạp không động từ.
- source_word: Παύλου
  choice: Phao-lô
  rationale: Dạng sở hữu/đồng vị xác nhận người viết bằng chính tay là Phao-lô; đưa tên vào giữa hai dấu phẩy để câu tiếng Việt rõ và tự nhiên.
