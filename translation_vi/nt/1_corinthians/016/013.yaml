id: 1CO.16.13
reference: 1 Corinthians 16:13
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Γρηγορεῖτε, στήκετε ἐν τῇ πίστει, ἀνδρίζεσθε, κραταιοῦσθε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/013.yaml
  text: Stay alert[a], stand firm in the faith, act courageously[b], be strong.
translation:
  language: vi
  text: Hãy tỉnh thức, đứng vững trong đức tin, hãy can đảm[a], hãy mạnh mẽ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn dùng một động từ bắt nguồn từ từ “người nam”, theo nghĩa đen là “hãy hành động như những người nam”; trong lối nói này, động từ có nghĩa là hãy can đảm hoặc dũng cảm.
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “hãy được làm cho mạnh mẽ” hoặc “hãy trở nên mạnh mẽ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Γρηγορεῖτε
  choice: Hãy tỉnh thức
  rationale: Mệnh lệnh hiện tại số nhiều của γρηγορέω kêu gọi sự cảnh giác liên tục. “Tỉnh thức” là cách diễn đạt tự nhiên, trang trọng và quen thuộc trong văn cảnh Tân Ước.
- source_word: στήκετε
  choice: đứng vững
  rationale: στήκω ở đây mang nghĩa ẩn dụ về sự kiên định, không chỉ tư thế đứng theo nghĩa đen.
- source_word: ἐν τῇ πίστει
  choice: trong đức tin
  rationale: Mạo từ cùng văn cảnh nâng đỡ cách hiểu về phạm vi hoặc nội dung của đức tin Cơ Đốc; tiếng Việt tự nhiên dùng “đức tin” mà không cần thêm từ định danh.
- source_word: ἀνδρίζεσθε
  choice: hãy can đảm
  rationale: Động từ bắt nguồn từ ἀνήρ (“người nam”) và theo nghĩa đen gợi hình ảnh hành động như một người nam, nhưng trong lối dùng thành ngữ có nghĩa là tỏ ra can đảm. Bản chính truyền đạt ý nghĩa thành ngữ tự nhiên, còn chú thích giữ sắc thái hình ảnh nguyên ngữ.
- source_word: κραταιοῦσθε
  choice: hãy mạnh mẽ
  rationale: Hình thức mệnh lệnh hiện tại trung động/thụ động có thể kêu gọi trở nên hoặc được làm cho mạnh. “Hãy mạnh mẽ” giữ nhịp của chuỗi mệnh lệnh và là tiếng Việt tự nhiên; chú thích bảo lưu khả năng thụ động.
theological_decisions:
- issue: Ý nghĩa của πίστις
  choice: đức tin
  alternative: niềm tin; đạo đức tin
  rationale: Cụm có mạo từ có thể chỉ đức tin được tuyên xưng hoặc lĩnh vực sống trong đức tin. “Đức tin” đủ rộng để giữ cả chiều kích tin cậy lẫn nội dung đức tin, không áp đặt một hệ phái.
- issue: Sắc thái giới tính của ἀνδρίζεσθε
  choice: hãy can đảm
  alternative: hãy hành động như những người nam
  rationale: Trong câu này, động từ mang nghĩa thành ngữ là can đảm. Dịch sát hình thái giới tính trong bản chính dễ khiến độc giả hiện đại hiểu sai rằng lời khuyên chỉ dành cho nam giới; chú thích bảo lưu hình ảnh nguyên ngữ.
- issue: Thể của κραταιοῦσθε
  choice: hãy mạnh mẽ
  alternative: hãy được làm cho mạnh mẽ
  rationale: Hình thức có thể được hiểu theo sắc thái thụ động, nhưng tiếng Việt tự nhiên ưu tiên lời thúc giục “hãy mạnh mẽ”; chú thích nêu rõ cách hiểu thay thế mà không xác định tác nhân ngoài điều bản văn nói.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Chuỗi mệnh lệnh ngắn được giữ để tái hiện nhịp mạnh của nguyên văn; lặp “hãy” ở các vế giúp câu rõ và tự nhiên.
