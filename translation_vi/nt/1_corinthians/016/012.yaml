id: 1CO.16.12
reference: 1 Corinthians 16:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Περὶ δὲ Ἀπολλῶ τοῦ ἀδελφοῦ, πολλὰ παρεκάλεσα αὐτὸν ἵνα ἔλθῃ πρὸς ὑμᾶς μετὰ τῶν ἀδελφῶν· καὶ πάντως οὐκ ἦν θέλημα ἵνα νῦν ἔλθῃ, ἐλεύσεται δὲ ὅταν εὐκαιρήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/012.yaml
  text: Concerning Apollos our brother[a], I strongly urged him to come to you with the brothers; but it was not at all his will to come now[b]. Yet he will come when he has opportunity.
translation:
  language: vi
  text: Còn về A-pô-lô, người anh em[a], tôi đã hết sức khuyên ông nên cùng các anh em đến với anh chị em; nhưng hiện giờ ông hoàn toàn không muốn đến[b]. Tuy vậy, ông sẽ đến khi có dịp thuận tiện.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “A-pô-lô, người anh em”; không có đại từ sở hữu “của chúng ta”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hay, sát chữ: “nhưng hiện giờ việc ông đến hoàn toàn không phải là ý muốn của ông.” Tiếng Hy Lạp dùng danh từ “ý muốn”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Περὶ δὲ
  choice: Còn về
  rationale: Cách chuyển đề tài tự nhiên trong thư tín, không nhập νῦν vào đầu câu.
- source_word: Ἀπολλῶ
  choice: A-pô-lô
  rationale: Phiên âm tên riêng theo cách dùng quen thuộc trong tiếng Việt.
- source_word: τοῦ ἀδελφοῦ
  choice: anh A-pô-lô
  rationale: Dùng 'anh' để thể hiện quan hệ anh em trong đức tin một cách tự nhiên; tiếng Hy Lạp có mạo từ nhưng không có đại từ sở hữu rõ ràng, nên không thêm 'của chúng ta' vào chính văn.
- source_word: πολλὰ παρεκάλεσα
  choice: tôi đã hết sức khuyên
  rationale: Diễn đạt tự nhiên sắc thái nhấn mạnh của πολλὰ đi với παρεκάλεσα.
- source_word: ἵνα ἔλθῃ πρὸς ὑμᾶς
  choice: đến với anh chị em
  rationale: Thể hiện chuyển động hướng tới người Cô-rinh-tô; 'anh chị em' phù hợp với số nhiều và cộng đồng hội thánh.
- source_word: μετὰ τῶν ἀδελφῶν
  choice: cùng các anh em
  rationale: Ngữ cảnh nhiều khả năng chỉ những người nam cụ thể đang đi công tác, nên giữ giống đực của danh từ Hy Lạp.
- source_word: καὶ πάντως οὐκ ἦν θέλημα
  choice: nhưng ... hoàn toàn không muốn
  rationale: Chuyển cấu trúc danh từ 'không phải là ý muốn' sang lối nói Việt tự nhiên, đồng thời giữ sức nhấn mạnh của πάντως.
- source_word: νῦν
  choice: lúc này
  rationale: Chỉ thời điểm hiện tại và đọc tự nhiên trong tiếng Việt.
- source_word: ἐλεύσεται δὲ
  choice: Tuy vậy ... sẽ đi
  rationale: Giữ sự tương phản nhẹ của δέ với việc hiện tại A-pô-lô chưa muốn đi.
- source_word: ὅταν εὐκαιρήσῃ
  choice: khi có dịp thuận tiện
  rationale: Diễn đạt một cơ hội hoặc thời điểm thích hợp, không làm câu mang nghĩa chỉ vì tiện lợi cá nhân.
theological_decisions:
- issue: Chủ thể và ý nghĩa của οὐκ ἦν θέλημα
  choice: Hiểu là chính A-pô-lô hiện không muốn đi.
  alternative: Hiểu là Đức Chúa Trời không muốn A-pô-lô đi vào lúc này.
  rationale: A-pô-lô là đối tượng gần nhất và tự nhiên nhất của mạch câu; văn cảnh không nêu Đức Chúa Trời hay một sự ngăn cấm từ Ngài, nên không thêm nội dung thần học không được nói rõ.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng 'anh chị em' cho cộng đồng Cô-rinh-tô và 'các anh em' cho nhóm người nam cụ thể đồng hành.
