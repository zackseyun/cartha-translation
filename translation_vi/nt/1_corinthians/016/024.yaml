- from: Tình yêu của tôi ở với tất cả anh chị em trong Đấng Mê-si-a là Chúa Giê-su.[a]
  to: Tình yêu của tôi ở với tất cả anh chị em trong Đấng Mê-si-a Giê-su.[a]
  rationale: Bỏ “là Chúa” để bản dịch chỉ phản ánh các từ hiện diện trong ἐν Χριστῷ Ἰησοῦ. Giữ “tình yêu của tôi ở với,” vốn bảo toàn được tính súc tích và phần nào mơ hồ giữa lời khẳng định với lời chúc của câu không có động từ, đồng thời giữ “trong” cho ἐν.
