  yaml_path: translation/nt/1_corinthians/016/024.yaml
  text: My love be with all of you in Messiah Jesus[a].
translation:
  language: vi
  text: Tình yêu của tôi ở với tất cả anh chị em trong Đấng Mê-si-a Giê-su.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “trong Đấng Christ Giê-su.” Từ Hy Lạp Χριστός là một tước hiệu, có nghĩa là “Đấng Mê-si-a” hoặc “Đấng được xức dầu.”'
    reason: Nêu cách dịch truyền thống thay thế của Χριστός và giải thích nghĩa tước hiệu, không thêm danh hiệu không có trong nguyên văn.
lexical_decisions:
- source_word: ἡ ἀγάπη μου
  choice: Tình yêu của tôi
  rationale: Diễn đạt trực tiếp tình yêu thương mang tính cá nhân của Phao-lô; “tình yêu” tự nhiên và rõ nghĩa trong tiếng Việt hiện đại.
- source_word: μετὰ πάντων ὑμῶν
  choice: ở với tất cả anh chị em
  rationale: Câu Hy Lạp không có động từ; “ở với” bổ sung động từ theo cách tự nhiên mà vẫn giữ sắc thái lời chúc cuối thư. “Tất cả anh chị em” thể hiện rõ số nhiều và phạm vi bao gồm toàn thể cộng đồng.
- source_word: ἐν
  choice: trong
  rationale: Giữ nguyên cách nói đặc trưng của Phao-lô về mối liên hệ hay phạm vi hiện hữu, không thu hẹp thành “nhờ” hoặc giải thích quá mức.
- source_word: Χριστῷ Ἰησοῦ
  choice: Đấng Mê-si-a là Chúa Giê-su
  rationale: Dịch Χριστός như một tước hiệu và phiên âm tên Ἰησοῦ; thêm “là Chúa” theo lối diễn đạt tiếng Việt để cụm tước hiệu đứng trước tên được tự nhiên, đồng thời không đồng nhất “Chúa” với nghĩa từ vựng của Χριστός.
theological_decisions:
- issue: Sắc thái của câu không có động từ ở lời kết thư
  choice: Tình yêu của tôi ở với tất cả anh chị em
  alternative: Nguyện tình yêu của tôi ở với tất cả anh chị em
  rationale: Nguyên văn không có động từ hay tiểu từ chỉ lời cầu chúc. “Ở với” giữ được sắc thái chúc lành có thể có trong ngữ cảnh mà không thêm rõ chữ “nguyện,” nhờ đó bảo toàn phần nào sự mơ hồ giữa lời khẳng định và lời chúc.
- issue: Cách dịch Χριστός trong ἐν Χριστῷ Ἰησοῦ
  choice: Đấng Mê-si-a là Chúa Giê-su
  alternative: Đấng Christ Giê-su
  rationale: Χριστός vẫn mang ý nghĩa tước hiệu “Đấng Mê-si-a/Đấng được xức dầu.” Bản chính dịch tước hiệu để ý nghĩa ấy minh bạch; chú thích nêu cách gọi truyền thống.
translation_notes:
  register: Văn phong hiện đại, trang trọng và gần gũi. Dùng “anh chị em” để truyền đạt đại từ số nhiều chỉ toàn thể hội chúng; tránh lối cổ “anh em” dễ bị hiểu là chỉ nam giới. Giữ “trong” để bảo toàn cách nói thần học súc tích của nguyên văn.
