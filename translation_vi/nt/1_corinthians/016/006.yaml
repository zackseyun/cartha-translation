  terminology: “Anh chị em” phù hợp cho ὑμεῖς khi ngỏ cùng toàn thể cộng đồng. “Tiễn tôi đi tiếp” giữ nghĩa cốt lõi của προπέμπω mà không khẳng định quá mức rằng họ phải hộ tống hoặc chu cấp; chú thích từ vựng bảo lưu các sắc thái này.
