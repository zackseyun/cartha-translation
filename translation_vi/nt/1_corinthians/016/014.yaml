  text: Let all that you do be done in love[a].
translation:
  language: vi
  text: Mọi việc anh chị em làm, hãy làm trong tình yêu thương.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát nghĩa hơn: “Mọi điều của anh chị em, hãy diễn ra trong tình yêu thương.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα
  choice: mọi việc
  rationale: Dạng trung tính số nhiều được dùng với phạm vi bao quát. “Mọi việc” tự nhiên trong tiếng Việt và phù hợp với ý nói đến toàn bộ hành động của người nhận thư.
- source_word: ὑμῶν
  choice: anh chị em làm
  rationale: Đại từ sở hữu trong cụm πάντα ὑμῶν có tính tỉnh lược, sát chữ là “mọi điều của anh chị em”. Bổ sung “làm” diễn đạt tự nhiên điều thuộc về hoặc phát xuất từ cộng đồng Cô-rinh-tô mà không thu hẹp đáng kể ý nghĩa.
- source_word: ἐν ἀγάπῃ
  choice: trong tình yêu thương
  rationale: Giữ hình ảnh về phạm vi hoặc cách thức của giới từ ἐν. “Tình yêu thương” là cách nói hiện đại, trang trọng và rõ nghĩa cho ἀγάπη trong ngữ cảnh này.
- source_word: γινέσθω
  choice: đều phải được thực hiện
  rationale: 'Mệnh lệnh ngôi thứ ba số ít của γίνομαι mang sức khuyên truyền: mọi việc phải diễn ra hoặc được làm theo cách ấy. Cách dịch này tự nhiên trong tiếng Việt và giữ lực mệnh lệnh, dù diễn đạt rõ hơn sắc thái hành động vốn hàm ẩn.'
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” để diễn đạt đại từ số nhiều ὑμῶν; dùng “đều phải” để chuyển mệnh lệnh ngôi thứ ba thành lời khuyên truyền tự nhiên trong tiếng Việt.
