  yaml_path: translation/nt/1_corinthians/016/008.yaml
  text: But I will stay in Ephesus until Pentecost[a].
translation:
  language: vi
  text: Nhưng tôi sẽ ở lại Ê-phê-sô cho đến lễ Ngũ Tuần.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “tôi sẽ ở lại Ê-phê-sô cho đến Lễ Các Tuần.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιμενῶ
  choice: tôi sẽ ở lại
  rationale: Thể tương lai chủ động của ἐπιμένω, trong ngữ cảnh kế hoạch hành trình, diễn tả việc tiếp tục lưu lại một nơi trong một khoảng thời gian. “Ở lại” tự nhiên và rõ nghĩa trong tiếng Việt hiện đại.
- source_word: δὲ
  choice: Nhưng
  rationale: δέ đánh dấu sự chuyển ý có sắc thái tương phản nhẹ với phần bàn về hành trình ngay trước đó; “Nhưng” giữ được sắc thái này.
- source_word: ἐν Ἐφέσῳ
  choice: ở Ê-phê-sô
  rationale: ἐν với cách tặng mang nghĩa chỉ địa điểm. Tên thành được phiên âm theo cách dùng quen thuộc trong tiếng Việt.
- source_word: ἕως τῆς πεντηκοστῆς
  choice: cho đến lễ Ngũ Tuần
  rationale: ἕως với sở hữu cách chỉ thời gian kéo dài tới một mốc. πεντηκοστή là tên lễ Do Thái thường được gọi là “lễ Ngũ Tuần” trong ngữ cảnh Tân Ước.
