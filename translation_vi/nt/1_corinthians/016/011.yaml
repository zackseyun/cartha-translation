revisions:
- from: Vậy, đừng ai coi thường người. Nhưng hãy giúp người lên đường bình an để đến với tôi, vì tôi đang chờ đợi người cùng với các anh em.[a]
  to: Vậy, đừng ai coi thường anh ấy. Nhưng hãy tiễn anh ấy lên đường bình an, để anh ấy đến với tôi, vì tôi đang chờ đợi anh ấy cùng với các anh em.[a]
  rationale: Sửa đại từ để bản văn tự nhiên và rõ ràng hơn trong tiếng Việt hiện đại; dùng “tiễn… lên đường” để biểu đạt trực tiếp hơn sắc thái hỗ trợ cho chuyến đi của προπέμψατε. Chú thích được viết lại để bảo lưu khả năng bao gồm của ἀδελφῶν mà không quyết định một quan hệ cú pháp còn có thể hiểu theo nhiều cách.
