source:
  edition: SBLGNT
  text: μή τις οὖν αὐτὸν ἐξουθενήσῃ. προπέμψατε δὲ αὐτὸν ἐν εἰρήνῃ, ἵνα ἔλθῃ πρός ⸀με, ἐκδέχομαι γὰρ αὐτὸν μετὰ τῶν ἀδελφῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/011.yaml
  text: So then[a], let no one despise him. But send him on his way in peace, so that he may come to me, for I am expecting him with the brothers.
translation:
  language: vi
  text: Vậy, đừng ai coi thường anh ấy. Nhưng hãy tiễn anh ấy lên đường bình an, để anh ấy đến với tôi, vì tôi đang chờ đợi anh ấy cùng với các anh em.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “cùng với các anh chị em,” nếu “các anh em” ở đây chỉ chung một nhóm tín hữu hoặc cộng sự gồm cả nam lẫn nữ.
    reason: lexical_alternative
lexical_decisions:
- source_word: μή τις οὖν
  choice: Vậy, đừng ai
  rationale: μή với động từ giả định aorist tạo thành lời cấm; οὖν được chuyển là “vậy” để giữ mối liên hệ suy luận với câu trước.
- source_word: ἐξουθενήσῃ
  choice: coi thường
  rationale: Diễn đạt tự nhiên ý xem một người là không đáng kể hoặc khinh rẻ, phù hợp với mối lo Ti-mô-thê bị xem nhẹ.
- source_word: προπέμψατε
  choice: hãy giúp người lên đường
  rationale: Động từ có thể chỉ việc tiễn đưa và hỗ trợ cho chặng đường tiếp theo; cách dịch này giữ sắc thái trợ giúp hành trình thay vì chỉ đơn thuần sai đi.
- source_word: ἐν εἰρήνῃ
  choice: bình an
  rationale: Giữ cách nói Kinh Thánh trang trọng, đồng thời gợi một cuộc ra đi yên ổn, không bị cản trở hay gây khó dễ.
- source_word: ἵνα ἔλθῃ πρός με
  choice: để đến với tôi
  rationale: ἵνα với động từ giả định biểu thị mục đích; tiếng Việt không cần lặp chủ ngữ mà vẫn rõ người đến là Ti-mô-thê.
- source_word: ἐκδέχομαι
  choice: tôi đang chờ đợi
  rationale: Thì hiện tại diễn tả sự trông chờ đang tiếp diễn; “đang chờ đợi” tự nhiên và giữ sắc thái mong đợi.
- source_word: μετὰ τῶν ἀδελφῶν
  choice: cùng với các anh em
  rationale: Giữ dạng giống đực số nhiều của ἀδελφῶν trong chính văn; chú thích bảo lưu khả năng từ này chỉ một nhóm tín hữu hoặc cộng sự gồm cả nam lẫn nữ.
theological_decisions:
- issue: Phạm vi chỉ người của ἀδελφῶν trong một nhóm Cơ Đốc nhân có thể gồm cả hai giới
  choice: các anh em
  alternative: các anh chị em
  rationale: Nguyên văn dùng danh từ giống đực số nhiều. Chính văn không giải quyết dứt khoát phạm vi đại diện của từ, còn khả năng chỉ nhóm tín hữu hoặc cộng sự gồm cả nam lẫn nữ được nêu trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “người” để chỉ Ti-mô-thê nhằm tránh lặp đại từ và giữ sắc thái tôn trọng; “giúp người lên đường bình an” truyền đạt cả sự tiễn đưa, hỗ trợ và bảo đảm một cuộc ra đi không bị gây khó dễ.
