source:
  edition: SBLGNT
  text: ἀνέπαυσαν γὰρ τὸ ἐμὸν πνεῦμα καὶ τὸ ὑμῶν. ἐπιγινώσκετε οὖν τοὺς τοιούτους.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/018.yaml
  text: For they refreshed my spirit and yours[a]. Therefore acknowledge such men.
translation:
  language: vi
  text: Vì họ đã làm cho tinh thần của tôi và của anh chị em được phấn chấn. Vậy, hãy ghi nhận những người như thế.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “hãy nhìn nhận” hoặc “hãy biết trân trọng những người như thế.” Trong tiếng Hy Lạp, cụm từ này ở giống đực và tại đây chỉ cụ thể những người nam vừa được nhắc đến.'
    reason: Nêu các khả năng về sắc thái của ἐπιγινώσκετε và bảo toàn thông tin giống cùng đối tượng quy chiếu của τοὺς τοιούτους.
lexical_decisions:
- source_word: ἀνέπαυσαν
  choice: đã làm ... được tươi mới
  rationale: Động từ được dùng theo nghĩa ẩn dụ về sự hồi phục, nhẹ nhõm và khích lệ trong nội tâm, không phải nghỉ ngơi theo nghĩa thể chất.
- source_word: γὰρ
  choice: Vì
  rationale: Giữ rõ chức năng nêu lý do của γάρ đối với lời khuyên ở câu trước.
- source_word: πνεῦμα
  choice: tinh thần
  rationale: Trong ngữ cảnh này, từ này chỉ trạng thái nội tâm của con người chứ không chỉ Đức Thánh Linh; “tinh thần” tự nhiên và vẫn giữ được cách diễn đạt của Phao-lô.
- source_word: τὸ ἐμὸν πνεῦμα καὶ τὸ ὑμῶν
  choice: tinh thần tôi và tinh thần anh chị em
  rationale: Nói rõ danh từ “tinh thần” vốn được tỉnh lược ở vế thứ hai trong tiếng Hy Lạp, đồng thời giữ hai đối tượng song song.
- source_word: ἐπιγινώσκετε
  choice: hãy quý trọng
  rationale: Ở đây động từ không chỉ nói đến nhận diện mà kêu gọi dành cho họ sự nhìn nhận thích đáng; “quý trọng” truyền đạt sắc thái ghi nhận và trân trọng mà không nâng thành một nghi thức tôn kính.
- source_word: οὖν
  choice: Vậy
  rationale: Đánh dấu kết luận khuyên bảo rút ra từ lý do vừa nêu, bằng một liên từ tự nhiên trong tiếng Việt.
- source_word: τοὺς τοιούτους
  choice: những người như thế
  rationale: Cụm từ chỉ những người vừa được nhắc đến. Tiếng Việt không bắt buộc đánh dấu giống ngữ pháp; chú thích làm rõ rằng trong ngữ cảnh cụ thể đây là các người nam.
theological_decisions:
- issue: Cách thể hiện giống của τοὺς τοιούτους
  choice: những người như thế, kèm chú thích rằng cụm từ chỉ các người nam vừa được nêu tên
  alternative: những người nam như thế
  rationale: Hình thức Hy Lạp giống đực và ngữ cảnh chỉ Sê-pha-na, Phốt-tu-na và A-chai-cơ. Tuy nhiên, “những người như thế” là cách nói tiếng Việt tự nhiên và không làm thay đổi đối tượng quy chiếu; chú thích bảo toàn chi tiết giới tính và ngăn cách hiểu hoàn toàn khái quát.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “anh chị em” để diễn đạt đại từ số nhiều chỉ cộng đồng Cô-rinh-tô; lặp lại “tinh thần” nhằm tránh sự mơ hồ hoặc cách nói gượng trong tiếng Việt.
