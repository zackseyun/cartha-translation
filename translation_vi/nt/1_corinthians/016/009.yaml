source:
  edition: SBLGNT
  text: θύρα γάρ μοι ἀνέῳγεν μεγάλη καὶ ἐνεργής, καὶ ἀντικείμενοι πολλοί.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/009.yaml
  text: For a great and effective door has opened to me[a], and there are many opponents.
translation:
  language: vi
  text: Vì một cánh cửa lớn và hữu hiệu đã mở ra cho tôi[a], và có nhiều kẻ chống đối.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “một cơ hội lớn và hữu hiệu đã mở ra cho tôi.” Phao-lô dùng “cánh cửa” theo nghĩa ẩn dụ để nói về một lối mở cho công việc phục vụ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: θύρα
  choice: cánh cửa
  rationale: Giữ nguyên hình ảnh ẩn dụ của nguyên bản; trong ngữ cảnh, “cánh cửa” chỉ một lối mở cho công việc phục vụ.
- source_word: γάρ
  choice: vì
  rationale: Nối câu này với kế hoạch được nêu trước đó và đưa ra lý do Phao-lô ở lại.
- source_word: μοι
  choice: cho tôi
  rationale: Diễn đạt tự nhiên sắc thái quy chiếu/lợi ích của cách dữ cách trong tiếng Việt.
- source_word: ἀνέῳγεν
  choice: đã mở ra
  rationale: Thể hiện hành động mở dẫn đến tình trạng hiện đang rộng mở, đồng thời không xác định thêm tác nhân.
- source_word: μεγάλη
  choice: lớn
  rationale: Bổ nghĩa trực tiếp cho “cánh cửa” và có thể gợi cả quy mô lẫn tầm quan trọng của cơ hội.
- source_word: ἐνεργής
  choice: đầy hiệu quả
  rationale: Diễn đạt một lối mở có khả năng đem lại kết quả; cách nói này giữ được ý nghĩa mà vẫn phù hợp với ẩn dụ “cánh cửa”.
- source_word: ἀντικείμενοι
  choice: kẻ chống đối
  rationale: Danh từ hóa phân từ để chỉ những người đang chống lại Phao-lô và công việc của ông, không cường điệu mức độ thù địch.
- source_word: πολλοί
  choice: nhiều
  rationale: Chuyển tải trực tiếp số lượng lớn được nguyên bản nêu.
theological_decisions:
- issue: Ẩn dụ “cánh cửa” chỉ cơ hội phục vụ
  choice: Giữ hình ảnh “một cánh cửa lớn và đầy hiệu quả”.
  alternative: “Một cơ hội lớn và hiệu quả đã mở ra cho tôi.”
  rationale: Nguyên bản dùng θύρα, một hình ảnh ẩn dụ quen thuộc của Phao-lô. Giữ ẩn dụ bảo toàn hình tượng và không biến phần giải nghĩa theo ngữ cảnh thành chính văn.
- issue: Quan hệ giữa cơ hội và sự chống đối
  choice: Dùng “nhưng cũng” để diễn đạt sự tương phản tự nhiên trong tiếng Việt.
  alternative: Dùng liên từ sát hình thức “và”.
  rationale: 'καί về hình thức là “và”, nhưng trong ngữ cảnh hai vế có sức tương phản: một lối mở hiệu quả hiện hữu đồng thời với nhiều người chống đối. “Nhưng cũng” làm rõ quan hệ diễn ngôn mà không xóa sự đồng thời ấy.'
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Giữ ẩn dụ nguồn; dùng “kẻ chống đối” ngắn gọn và tự nhiên. Dấu [a] được đặt ngay sau cụm từ mà chú thích giải thích.
