revisions:
- from: Vì một cánh cửa lớn và đầy hiệu quả đã mở ra cho tôi[a], nhưng cũng có nhiều kẻ chống đối.
  to: Vì một cánh cửa lớn và hữu hiệu đã mở ra cho tôi[a], và có nhiều kẻ chống đối.
  rationale: Đổi “nhưng cũng” thành “và” để không áp đặt quan hệ đối nghịch vượt quá καί trong nguyên văn. Đổi “đầy hiệu quả” thành “hữu hiệu” để tiếng Việt tự nhiên hơn, đồng thời vẫn chuyển tải ἐνεργής và bảo toàn ẩn dụ θύρα.
