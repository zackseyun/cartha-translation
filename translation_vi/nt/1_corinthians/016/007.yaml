id: 1CO.16.7
reference: 1 Corinthians 16:7
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οὐ θέλω γὰρ ὑμᾶς ἄρτι ἐν παρόδῳ ἰδεῖν, ἐλπίζω ⸀γὰρ χρόνον τινὰ ἐπιμεῖναι πρὸς ὑμᾶς, ἐὰν ὁ κύριος ⸀ἐπιτρέψῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/007.yaml
  text: For I do not want to see you now in passing[a], for I hope to remain with you for some time, if the Lord permits.
translation:
  language: vi
  text: Vì tôi không muốn lúc này gặp anh chị em chỉ trong lúc đi ngang qua[a]; tôi hy vọng sẽ ở lại với anh chị em một thời gian, nếu Chúa cho phép.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “trong khi đi qua” hoặc “nhân tiện trên đường đi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ θέλω
  choice: tôi không muốn
  rationale: Diễn tả mong muốn hoặc dự định cá nhân của Phao-lô; cách nói tự nhiên và trực tiếp trong tiếng Việt hiện đại.
- source_word: ἄρτι
  choice: lúc này
  rationale: Chỉ hoàn cảnh hiện tại; tự nhiên hơn nhưng vẫn giữ đúng sắc thái thời gian của nguyên ngữ.
- source_word: ἐν παρόδῳ
  choice: chỉ ghé thăm ... trên đường đi
  rationale: Diễn đạt một chuyến ghé ngắn khi đang đi qua; từ “chỉ” làm rõ sự tương phản với mong muốn ở lại lâu hơn.
- source_word: ἰδεῖν
  choice: ghé thăm
  rationale: Nghĩa đen là “thấy/gặp”, nhưng trong ngữ cảnh hành trình, tiếng Việt tự nhiên dùng “ghé thăm”; không làm thay đổi ý về cuộc gặp trực tiếp.
- source_word: ἐλπίζω
  choice: tôi hy vọng
  rationale: Giữ sắc thái trông mong nhưng không chắc chắn.
- source_word: χρόνον τινά
  choice: một thời gian
  rationale: Chỉ một khoảng thời gian không xác định nhưng đáng kể.
- source_word: ἐπιμεῖναι
  choice: ở lại
  rationale: Truyền đạt rõ ý tiếp tục hiện diện tại nơi của người nhận thư.
- source_word: πρὸς ὑμᾶς
  choice: với anh chị em
  rationale: Với động từ “ở lại”, cụm này tự nhiên mang nghĩa ở trong sự hiện diện và đồng hành với họ.
- source_word: ἐὰν ὁ κύριος ἐπιτρέψῃ
  choice: nếu Chúa cho phép
  rationale: Giữ nguyên điều kiện lệ thuộc vào ý muốn và quyền quyết định của Chúa.
- source_word: κύριος
  choice: Chúa
  rationale: Cách tương đương thông dụng, trang trọng của κύριος trong ngữ cảnh thần học; không xác định thêm đối tượng quy chiếu.
theological_decisions:
- issue: Đối tượng được gọi là “Chúa”
  choice: Chỉ dịch là “Chúa”, không xác định thêm.
  alternative: “Chúa Giê-xu” hoặc “Đức Chúa Trời”
  rationale: Nguyên văn chỉ dùng κύριος, không nói rõ là Chúa Giê-xu hay Đức Chúa Trời; bản dịch giữ sự mở về thần học của câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “anh chị em” cho đại từ số nhiều ὑμᾶς nhằm biểu đạt cộng đồng tín hữu gồm cả nam lẫn nữ. Dấu chấm phẩy làm rõ quan hệ giữa việc không muốn chỉ ghé qua và hy vọng ở lại lâu hơn.
