id: 1CO.16.19
reference: 1 Corinthians 16:19
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἀσπάζονται ὑμᾶς αἱ ἐκκλησίαι τῆς Ἀσίας. ⸀ἀσπάζεται ὑμᾶς ἐν κυρίῳ πολλὰ Ἀκύλας καὶ ⸀Πρίσκα σὺν τῇ κατ’ οἶκον αὐτῶν ἐκκλησίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/019.yaml
  text: The churches of Asia greet you[a]. Aquila and Prisca, together with the church in their house[b], greet you warmly in the Lord.
translation:
  language: vi
  text: Các hội thánh tại tỉnh A-si-a gửi lời chào anh chị em[a]. A-qui-la và Pơ-rít-ca, cùng với hội thánh trong nhà họ, gửi lời chào nồng nhiệt đến anh chị em trong Chúa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “A-si-a” ở đây là tên một tỉnh của Đế quốc La Mã ở phía tây Tiểu Á, không phải châu Á ngày nay.
    reason: cultural_note
  - marker: b
    text: Nguyên văn dùng tên “Pơ-rít-ca”; bà cũng được gọi bằng dạng tên dài hơn là “Pơ-rít-xi-la” ở những chỗ khác (chẳng hạn Công Vụ 18:2, 18, 26; Rô-ma 16:3).
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀσπάζονται / ἀσπάζεται
  choice: gửi lời chào
  rationale: Động từ ἀσπάζομαι ở đây chỉ việc chuyển lời chào. “Gửi lời chào” tự nhiên trong tiếng Việt và phù hợp với một bức thư.
- source_word: αἱ ἐκκλησίαι
  choice: các hội thánh
  rationale: Trong cách dùng của Phao-lô, ἐκκλησία thường chỉ các cộng đồng tín hữu địa phương; “hội thánh” rõ nghĩa và trang trọng.
- source_word: τῆς Ἀσίας
  choice: tại tỉnh A-si-a
  rationale: Ἀσία ở đây là tỉnh A-si-a thuộc La Mã, không phải châu Á ngày nay. Thêm “tỉnh” trong chính văn giúp độc giả hiện đại tránh hiểu lầm địa lý mà không làm thay đổi sở thuộc của các hội thánh.
- source_word: ἐν κυρίῳ
  choice: trong Chúa
  rationale: Giữ nguyên thành ngữ thần học và quan hệ đặc trưng của Phao-lô, không diễn giải quá mức.
- source_word: πολλὰ
  choice: nồng nhiệt
  rationale: πολλὰ dùng theo chức năng trạng từ để nhấn mạnh lời chào; “nồng nhiệt” chuyển tải tự nhiên sắc thái tăng cường này.
- source_word: Ἀκύλας καὶ Πρίσκα
  choice: A-qui-la và Pơ-rít-ca
  rationale: Phiên âm tên riêng theo dạng Hy Lạp trong câu; Πρίσκα là dạng ngắn, tương ứng Prisca, chứ không phải trực tiếp là dạng Πρίσκιλλα.
- source_word: σὺν τῇ κατ’ οἶκον αὐτῶν ἐκκλησίᾳ
  choice: cùng với hội thánh trong nhà họ
  rationale: Cách dịch sát và tự nhiên, giữ cấu trúc của nguyên văn, đồng thời chỉ cộng đồng tín hữu gắn với nhà của họ mà không thêm động từ “nhóm lại” vào chính văn.
theological_decisions:
- issue: Nghĩa của ἐκκλησία trong bối cảnh một tư gia
  choice: “hội thánh trong nhà họ” chỉ cộng đồng tín hữu địa phương gắn với tư gia của A-qui-la và Pơ-rít-ca
  alternative: hiểu đơn thuần là gia đình của họ hoặc dùng nhãn “hội thánh tư gia”
  rationale: Cách dùng thông thường của Phao-lô và cấu trúc κατ’ οἶκον cho thấy đây là một cộng đồng hội thánh trong tư gia, không chỉ là những người thuộc gia đình.
- issue: Cách dịch κύριος
  choice: Chúa
  alternative: Chủ
  rationale: “Chúa” giữ được sức nặng tuyên xưng và sắc thái quan hệ của thành ngữ Phao-lô “trong Chúa” mà không thu hẹp ý nghĩa.
- issue: Phạm vi của ἐν κυρίῳ
  choice: gắn “trong Chúa” với hành động gửi lời chào nồng nhiệt
  alternative: diễn giải là “vì cùng tin Chúa” hoặc “nhân danh Chúa”
  rationale: Nguyên văn cho phép sắc thái về phạm vi hiệp thông hoặc tính chất của lời chào; bản dịch giữ nguyên độ mở thay vì chọn một lối giải thích.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” cho đại từ số nhiều ὑμᾶς nhằm diễn đạt tự nhiên lời gửi đến toàn thể hội thánh; dùng “hội thánh” nhất quán cho ἐκκλησία. Các dấu chú thích [a], [b] đều xuất hiện trong chính văn.
