  source_fidelity: 'Bản dịch phản ánh đúng hai lời chào trong nguyên văn: số nhiều «Các hội thánh» ở mệnh đề đầu và chủ ngữ ghép A-qui-la và Pơ-rít-ca cùng hội thánh tại nhà họ ở mệnh đề sau. «tỉnh A-si-a» làm rõ chính xác quy chiếu lịch sử của τῆς Ἀσίας; «trong Chúa» giữ được độ mở của ἐν κυρίῳ; và «nồng nhiệt» chuyển tải hợp lý lực nhấn trạng từ của πολλὰ.'
