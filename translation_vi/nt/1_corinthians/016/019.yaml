  terminology: «Hội thánh» nhất quán cho ἐκκλησία, «Chúa» phù hợp cho κύριος, và các dạng tên A-qui-la, Pơ-rít-ca nhất quán với chính sách phiên âm của bản thảo. Chú thích b phân biệt đúng Πρίσκα với dạng dài hơn Pơ-rít-xi-la; chú thích a có neo và nội dung phù hợp.
