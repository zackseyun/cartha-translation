lexical_decisions:
- source_word: Ἐλεύσομαι δὲ πρὸς ὑμᾶς
  choice: Nhưng tôi sẽ đến với anh chị em
  rationale: Dùng thì tương lai cho Ἐλεύσομαι và giữ hướng chuyển động về phía người Cô-rinh-tô của πρὸς ὑμᾶς. “Nhưng” diễn đạt sự chuyển ý nhẹ của δέ trong mạch nói về kế hoạch hành trình.
- source_word: ὅταν Μακεδονίαν διέλθω
  choice: sau khi đã đi qua Ma-xê-đô-ni-a
  rationale: Cấu trúc ὅταν với động từ aorist subjunctive chỉ một sự việc tương lai xảy ra trước chuyến viếng thăm. “Sau khi đã đi qua” truyền đạt rõ quan hệ trước–sau mà không biến điều này thành một lời khẳng định tuyệt đối không có tính dự kiến.
- source_word: Μακεδονίαν
  choice: Ma-xê-đô-ni-a
  rationale: Phiên âm địa danh quen dùng trong tiếng Việt, chỉ vùng Ma-xê-đô-ni-a.
- source_word: γὰρ
  choice: vì
  rationale: γάρ đưa ra lý do cho thời điểm Phao-lô sẽ đến với người Cô-rinh-tô.
- source_word: διέρχομαι
  choice: tôi định đi qua
  rationale: Thì hiện tại Hy Lạp trong ngữ cảnh kế hoạch hành trình có thể diễn đạt một lộ trình đã được dự tính. Tiếng Việt tự nhiên dùng “định đi qua”, tránh gây ấn tượng sai rằng Phao-lô đang ở giữa hành trình qua Ma-xê-đô-ni-a ngay lúc viết.
