  source_fidelity: 'Bản nháp truyền đạt đúng ý chính: Phao-lô sẽ đến thăm tín hữu Cô-rinh-tô sau chặng đường qua Ma-xê-đô-ni-a, và mệnh đề γάρ giải thích lộ trình ấy. Tuy nhiên, “sau khi” diễn giải ὅταν (“khi”) thành một liên từ hậu thời rõ nét hơn nguyên văn. “Khi đã đi qua” vừa giữ sắc thái hoàn tất của aorist subjunctive διέλθω, vừa sát cấu trúc nguồn hơn. Ở mệnh đề cuối, “tôi định đi qua” là cách diễn giải hợp lý về hiện tại có tính kế hoạch, nhưng “tôi sẽ đi qua” trực tiếp và tự nhiên hơn trong tiếng Việt đối với hành trình sắp tới được trình bày như kế hoạch chắc chắn.'
