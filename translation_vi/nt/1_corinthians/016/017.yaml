    rationale: παρουσία có thể chỉ sự hiện diện, nhưng với các nhân vật vừa đến gặp Phao-lô, danh từ này nhấn vào sự đến/việc đến. Cách dịch hiện tại biến trọng tâm thành một trạng thái và làm câu tiếng Việt kém tự nhiên.
