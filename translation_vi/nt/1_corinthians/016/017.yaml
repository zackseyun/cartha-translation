source:
  edition: SBLGNT
  text: χαίρω δὲ ἐπὶ τῇ παρουσίᾳ Στεφανᾶ καὶ Φορτουνάτου καὶ Ἀχαϊκοῦ, ὅτι τὸ ⸀ὑμέτερον ὑστέρημα οὗτοι ἀνεπλήρωσαν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/017.yaml
  text: And I rejoice at the coming of Stephanas and Fortunatus and Achaicus[a], because these men have made up for your absence.
translation:
  language: vi
  text: Tôi vui mừng về sự đến của Sê-pha-na, Phọt-tu-na và A-khai-cơ[a], vì chính những người này đã bù đắp cho điều còn thiếu từ phía anh chị em.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể hiểu phần cuối câu là: “vì những người này đã bù cho sự vắng mặt của anh chị em.” Theo cách hiểu này, Phao-lô nói đến việc các tín hữu Cô-rinh-tô không thể đích thân ở bên ông, chứ không nhất thiết trách họ có thiếu sót về đạo đức.'
    reason: lexical_alternative
lexical_decisions:
- source_word: χαίρω
  choice: Tôi vui mừng
  rationale: Giữ nguyên sắc thái vui mừng trực tiếp của động từ hiện tại ngôi thứ nhất, phù hợp với giọng thư tín của Phao-lô.
- source_word: δὲ
  choice: (không dịch riêng)
  rationale: Đây là liên từ chuyển ý nhẹ; tiếng Việt tự nhiên không nhất thiết cần một từ nối ở vị trí này.
- source_word: ἐπὶ τῇ παρουσίᾳ
  choice: vì có sự hiện diện
  rationale: παρουσία ở đây chỉ việc ba người đã đến và hiện diện bên Phao-lô, không mang nghĩa cánh chung. Cách dịch này giữ được cả ý đến lẫn trạng thái có mặt.
- source_word: Στεφανᾶ καὶ Φορτουνάτου καὶ Ἀχαϊκοῦ
  choice: Sê-pha-na, Phọt-tu-na và A-khai-cơ
  rationale: Phiên âm các tên riêng Hy Lạp theo cách đọc dễ tiếp nhận trong tiếng Việt hiện đại.
- source_word: ὅτι
  choice: bởi
  rationale: Nêu lý do khiến Phao-lô vui mừng.
- source_word: τὸ ὑμέτερον ὑστέρημα
  choice: điều còn thiếu từ phía anh chị em
  rationale: Giữ độ mở của cụm Hy Lạp, vốn nói đến một sự thiếu hụt liên quan đến người Cô-rinh-tô mà không tự nó xác định đó chỉ là sự vắng mặt.
- source_word: οὗτοι
  choice: chính những người này
  rationale: Tái hiện tính nhấn mạnh của đại từ chỉ định, quy chiếu rõ đến ba người vừa được nêu tên.
- source_word: ἀνεπλήρωσαν
  choice: đã bù đắp
  rationale: Diễn đạt tự nhiên hành động làm đầy hay cung ứng phần còn thiếu, đồng thời phù hợp với tân ngữ trừu tượng trong câu.
theological_decisions:
- issue: Bản chất của τὸ ὑμέτερον ὑστέρημα
  choice: 'Giữ cách nói rộng: “điều còn thiếu từ phía anh chị em”'
  alternative: “sự vắng mặt của anh chị em”
  rationale: Ngữ cảnh có thể hàm ý rằng ba người đại diện đã bù cho việc cộng đồng không thể hiện diện bên Phao-lô, nhưng cụm Hy Lạp không nói rõ “sự vắng mặt.” Bản dịch chính giữ sự mơ hồ thật của nguyên văn và chú thích nêu cách hiểu theo ngữ cảnh.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “anh chị em” để diễn đạt đại từ số nhiều chỉ cộng đồng tín hữu; tránh biến một cụm từ còn rộng nghĩa trong nguyên văn thành lời quy lỗi đạo đức.
