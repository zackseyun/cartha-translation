  source_fidelity: Bản dịch giữ đúng quan hệ chính của câu và đáng khen là không thu hẹp τὸ ὑμέτερον ὑστέρημα thành một thiếu sót đạo đức. Tuy nhiên, “vì có sự hiện diện của” thiên về trạng thái hiện diện, trong khi ἐπὶ τῇ παρουσίᾳ ở đây nói trực tiếp về việc những người này đến. Cần diễn đạt rõ sự đến/việc đến.
  naturalness: “Tôi vui mừng về sự đến của ...” là cách nói tự nhiên, trang trọng vừa phải trong văn thư tín. Cụm “bù đắp cho điều còn thiếu từ phía anh chị em” cũng trôi chảy hơn “bù đắp điều...”.
  terminology: Giữ “anh chị em” phù hợp với lời gọi cả cộng đồng tín hữu. Giữ tên riêng và chú thích hiện có; chú thích phân biệt hợp lý giữa cách dịch rộng của bản văn và cách hiểu theo ngữ cảnh, không áp đặt diễn giải.
