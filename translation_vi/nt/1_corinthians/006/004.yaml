  verdict: revise
  source_fidelity: Bản dịch truyền đạt đúng cấu trúc điều kiện và câu hỏi tu từ của câu Hy Lạp, cũng như sắc thái mỉa mai/quở trách của τούτους καθίζετε. “Những vụ việc thuộc đời này cần phân xử” là một cách hiểu có thể chấp nhận được của βιωτικὰ κριτήρια trong ngữ cảnh tranh tụng, dù danh từ Hy Lạp cũng có thể nhấn đến cơ quan/phiên xét xử. Cách dịch “những người bị xem là không đáng kể trong hội thánh” giữ được sự mơ hồ về đối tượng bị khinh thường.
  naturalness: Văn câu tự nhiên, rõ nghĩa và phù hợp văn phong Kinh Thánh tiếng Việt hiện đại. Tuy nhiên, cách diễn đạt trong chú thích b, “theo cách hội thánh đánh giá,” hơi gượng và chưa diễn tả trực tiếp phương án nghĩa “theo quan điểm của hội thánh.”
  terminology: “Hội thánh,” “phân xử,” và “người xét xử” phù hợp ngữ cảnh. Không có vấn đề về tên riêng hay thuật ngữ thần học. Cần chỉnh chú thích b để trình bày phương án nghĩa một cách idiomatic hơn mà không thu hẹp sự mơ hồ của ἐν τῇ ἐκκλησίᾳ.
  issues:
