id: 1CO.6.4
reference: 1 Corinthians 6:4
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: βιωτικὰ μὲν οὖν κριτήρια ἐὰν ἔχητε, τοὺς ἐξουθενημένους ἐν τῇ ἐκκλησίᾳ, τούτους καθίζετε;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/004.yaml
  text: So if you have courts for matters of this life[c][b][a], do you appoint as judges those who are of no standing in the church?
translation:
  language: vi
  text: Vậy, nếu anh chị em có những vụ việc thuộc đời này cần phân xử,[a] anh chị em lại đặt chính những người bị xem là không đáng kể trong hội thánh[b] làm người xét xử sao?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “những việc trong đời sống thường ngày”; tiếng Hy Lạp chỉ những việc thuộc đời sống trần thế, thường nhật hoặc dân sự.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “những người bị khinh thường trong hội thánh.” Cụm từ Hy Lạp có thể chỉ những người bị coi là không quan trọng trong hội thánh, hoặc những người bị hội thánh xem là không có địa vị.
    reason: alternative_reading
  - marker: c
    text: 'Một số người hiểu mệnh đề này là một mệnh lệnh mỉa mai: “hãy đặt những người bị xem là không đáng kể trong hội thánh làm người xét xử.”'
    reason: alternative_reading
lexical_decisions:
- source_word: βιωτικὰ
  choice: thuộc đời này
  rationale: Chỉ những việc thuộc đời sống trần thế, thường nhật hoặc dân sự; cách dịch này tránh sắc thái đạo đức tiêu cực mà từ “thế tục” có thể gợi ra.
- source_word: κριτήρια
  choice: những vụ việc ... cần phân xử
  rationale: Danh từ có thể chỉ tòa xét xử, việc xét xử hoặc vụ việc được đưa ra xét xử. Trong câu này, cách diễn đạt này tự nhiên trong tiếng Việt và phù hợp với mạch nói về tranh chấp giữa các tín hữu.
- source_word: ἐὰν ἔχητε
  choice: nếu anh chị em có
  rationale: Giữ nguyên cấu trúc điều kiện của tiếng Hy Lạp; “anh chị em” làm rõ chủ ngữ số nhiều hàm ẩn trong động từ.
- source_word: τοὺς ἐξουθενημένους
  choice: những người bị xem là không đáng kể
  rationale: Phân từ này chỉ những người bị coi thường, bị xem như chẳng có giá trị hoặc địa vị. Cách dịch giữ được sắc thái đánh giá xã hội mà không xác định quá hẹp họ là người trong hay ngoài hội thánh.
- source_word: ἐν τῇ ἐκκλησίᾳ
  choice: trong hội thánh
  rationale: 'Dịch trực tiếp cụm giới từ, đồng thời để ngỏ hai sắc thái: những người không được coi trọng ở trong cộng đồng, hoặc những người không có vị thế theo cách hội thánh đánh giá.'
- source_word: τούτους καθίζετε
  choice: lại đặt chính ... làm người xét xử sao?
  rationale: καθίζω có nghĩa đen là “cho ngồi”, nhưng trong bối cảnh tư pháp mang nghĩa đặt hoặc chỉ định vào vị trí xét xử. “Chính” phản ánh đại từ nhấn mạnh τούτους, còn “lại ... sao?” truyền đạt sức nặng của câu hỏi quở trách.
theological_decisions:
- issue: Câu này là câu hỏi tu từ hay mệnh lệnh mỉa mai
  choice: 'Dịch thành câu hỏi tu từ: “anh chị em lại đặt ... làm người xét xử sao?”'
  alternative: 'Dịch thành mệnh lệnh mỉa mai: “hãy đặt những người bị xem là không đáng kể trong hội thánh làm người xét xử.”'
  rationale: Dấu câu của SBLGNT và mạch quở trách trong 1 Cô-rinh-tô 6:1–6 hỗ trợ cách hiểu nghi vấn. Chú thích vẫn ghi nhận cách phân tích cú pháp khác.
- issue: “Những người bị xem là không đáng kể” là ai
  choice: Giữ cách diễn đạt không xác định họ là người trong hội thánh hay người ngoài bị hội thánh coi là không có địa vị
  alternative: Xác định rõ họ là người ngoài hội thánh, hoặc xác định họ là những thành viên thấp kém trong hội thánh
  rationale: Cụm tiếng Hy Lạp có thể được hiểu theo nhiều cách; không nên giải quyết thay cho độc giả một sự mơ hồ có thật trong nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh chị em” cho ngôi thứ hai số nhiều trong cộng đồng tín hữu; dùng “hội thánh” cho ἐκκλησία. Câu hỏi tu từ giữ giọng quở trách của đoạn văn mà không làm mất phương án hiểu như mệnh lệnh mỉa mai.
