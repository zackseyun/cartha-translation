source:
  edition: SBLGNT
  text: Πάντα μοι ἔξεστιν· ἀλλ’ οὐ πάντα συμφέρει. πάντα μοι ἔξεστιν· ἀλλ’ οὐκ ἐγὼ ἐξουσιασθήσομαι ὑπό τινος.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/012.yaml
  text: “All things are lawful for me,” but not all things are beneficial[c][b][a]. “All things are lawful for me,” but I will not be mastered by anything.
translation:
  language: vi
  text: “Tôi được phép làm mọi sự,”[a] nhưng không phải mọi sự đều có ích.[b] “Tôi được phép làm mọi sự,” nhưng tôi sẽ không bị bất cứ điều gì chế ngự.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể không dùng ngoặc kép: Tôi được phép làm mọi sự. Nhiều người hiểu mệnh đề này là khẩu hiệu của người Cô-rinh-tô mà Phao-lô trích dẫn rồi giới hạn ý nghĩa.'
    reason: alternative_reading
  - marker: b
    text: “Có ích” cũng có thể dịch là “có lợi” hoặc “hữu ích.”
    reason: lexical_alternative
  - marker: c
    text: 'Hay: “nhưng tôi sẽ không bị đặt dưới quyền của bất cứ điều gì.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάντα μοι ἔξεστιν
  choice: Mọi sự tôi đều được phép làm
  rationale: Diễn đạt tự nhiên ý điều gì được phép đối với người nói, đồng thời giữ phạm vi bao quát và cấu trúc lặp mang dáng dấp khẩu hiệu của tiếng Hy Lạp.
- source_word: ἀλλ’ οὐ πάντα συμφέρει
  choice: nhưng không phải mọi sự đều có ích
  rationale: συμφέρει chỉ điều có lợi, hữu ích hoặc đem lại ích lợi; “có ích” là cách nói hiện đại, rộng nghĩa và không thiên về lợi nhuận thương mại.
- source_word: οὐκ ἐγὼ ἐξουσιασθήσομαι ὑπό τινος
  choice: nhưng tôi sẽ không để bất cứ điều gì chế ngự mình
  rationale: Giữ sắc thái nhấn mạnh vào “tôi” và ý bị đặt dưới quyền hay bị kiểm soát. “Chế ngự” diễn đạt gọn sức mạnh quyền lực của ἐξουσιασθήσομαι; “bất cứ điều gì” phù hợp ngữ cảnh hành vi và ham muốn mà không thu hẹp nguyên tắc.
theological_decisions:
- issue: Có nên đánh dấu Πάντα μοι ἔξεστιν là khẩu hiệu của người Cô-rinh-tô hay không
  choice: Đặt mệnh đề được lặp lại trong ngoặc kép như lời khẩu hiệu mà Phao-lô trích dẫn rồi giới hạn.
  alternative: Không dùng ngoặc kép, hiểu đây là lời khẳng định của chính Phao-lô và được các mệnh đề sau bổ nghĩa.
  rationale: Bản văn Hy Lạp cổ không có dấu ngoặc kép, nên việc xác định lời trích dẫn là một quyết định diễn giải chứ không phải biến thể văn bản. Cách đặt ngoặc kép làm rõ lối lập luận rất có thể có ở đây, còn chú thích bảo tồn cách hiểu khác.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Giữ phép lặp cân xứng của nguyên văn; dùng “được phép làm” thay cho lối nói pháp lý cứng, và “chế ngự mình” để truyền đạt hình ảnh bị quyền lực kiểm soát.
