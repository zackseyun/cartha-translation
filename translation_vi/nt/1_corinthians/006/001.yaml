id: 1CO.6.1
reference: 1 Corinthians 6:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Τολμᾷ τις ὑμῶν πρᾶγμα ἔχων πρὸς τὸν ἕτερον κρίνεσθαι ἐπὶ τῶν ἀδίκων, καὶ οὐχὶ ἐπὶ τῶν ἁγίων;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/001.yaml
  text: Does any one of you dare[a], when he has a case against another[b], to be judged before the unrighteous and not before the saints?
translation:
  language: vi
  text: Có ai trong anh em, khi có việc tranh chấp với người khác, lại dám đem việc ấy ra cho những người bất chính[a] xét xử, thay vì cho các thánh đồ[b] không?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “những người không công chính” hoặc “những kẻ bất công”. Một số bản dịch diễn giải là “người không tin”, nhưng tiếng Hy Lạp nói “những người bất chính”.
    reason: lexical_alternative
  - marker: b
    text: “Các thánh đồ” ở đây chỉ dân thánh của Đức Chúa Trời, tức là các tín hữu.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τολμᾷ
  choice: có ai ... dám ... không?
  rationale: Giữ hình thức câu hỏi tu từ và sắc thái táo bạo đến mức đáng trách của động từ τολμάω, đồng thời diễn đạt tự nhiên trong tiếng Việt.
- source_word: τις ὑμῶν
  choice: có ai trong anh em
  rationale: Thể hiện đại từ bất định số ít τις cùng cấu trúc chỉ thành phần ὑμῶν và giữ lời trực tiếp hướng đến cộng đoàn Cô-rinh-tô.
- source_word: πρᾶγμα ἔχων
  choice: khi có vụ kiện
  rationale: Trong ngữ cảnh pháp lý, πρᾶγμα chỉ một vụ việc hay vụ tranh chấp cần được phân xử. “Vụ kiện” truyền đạt rõ bối cảnh mà không xác định quá mức bản chất của tranh chấp.
- source_word: πρὸς τὸν ἕτερον
  choice: với người khác
  rationale: Trong ngữ cảnh tranh tụng, πρός diễn tả quan hệ đối kháng; tiếng Việt tự nhiên nói “có vụ kiện với người khác”.
- source_word: κρίνεσθαι
  choice: để ... xét xử
  rationale: Giữ ý nghĩa tư pháp và sắc thái bị động của κρίνεσθαι, thay vì thu hẹp thành hành động đơn thuần là đi đến tòa án.
- source_word: ἐπὶ τῶν ἀδίκων
  choice: những người bất chính
  rationale: ἀδίκων có nghĩa trực tiếp là những người bất chính hoặc không công chính. Cách dịch này giữ nguyên sự đánh giá về đạo đức và thần học của Phao-lô, không diễn giải thành “người không tin”.
- source_word: καὶ οὐχὶ
  choice: chứ không phải
  rationale: Diễn đạt rõ thế tương phản mạnh trong câu hỏi tu từ bằng tiếng Việt tự nhiên mà không thêm ý ngoài nguyên văn.
- source_word: ἐπὶ τῶν ἁγίων
  choice: các thánh đồ
  rationale: ἅγιοι là cách gọi quen thuộc của Phao-lô dành cho dân thánh của Đức Chúa Trời. “Các thánh đồ” duy trì thuật ngữ thần học và thế đối lập với “những người bất chính”.
theological_decisions:
- issue: Cách dịch ἀδίκων đối lập với ἁγίων
  choice: những người bất chính ... các thánh đồ
  alternative: người không tin ... tín hữu
  rationale: Nguyên văn dùng những từ mang nội dung đạo đức và thần học, chứ không trực tiếp nói “người không tin” và “tín hữu”. Bản dịch giữ cách gọi của Phao-lô và không tự ý giải quyết hàm ý theo lối diễn giải.
- issue: Chủ thể đại diện ở số ít trong τις ... ἔχων
  choice: có ai trong anh em ... khi có
  alternative: khi anh em có
  rationale: Cách diễn đạt này bảo toàn trọng tâm vào một người bất kỳ trong cộng đoàn mà vẫn tự nhiên trong tiếng Việt, không cần thêm đại từ mang giới tính vốn không bắt buộc trong ngôn ngữ đích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc câu hỏi tu từ được đặt theo trật tự tự nhiên của tiếng Việt; thuật ngữ pháp lý “vụ kiện” và “xét xử” làm rõ bối cảnh, còn “bất chính” và “thánh đồ” giữ nguyên sức nặng đạo đức–thần học của nguyên văn.
