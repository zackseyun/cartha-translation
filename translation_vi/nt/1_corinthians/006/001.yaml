revisions:
- from: Khi có vụ kiện với người khác, có ai trong anh em dám để những người bất chính[a] xét xử, chứ không phải các thánh đồ[b] không?
  to: Có ai trong anh em, khi có việc tranh chấp với người khác, lại dám đem việc ấy ra cho những người bất chính[a] xét xử, thay vì cho các thánh đồ[b] không?
  rationale: Bản sửa thay «vụ kiện» bằng «việc tranh chấp» để không thu hẹp πρᾶγμα quá mức. Đồng thời, «đem việc ấy ra cho ... xét xử, thay vì cho ...» diễn đạt rõ hành động đưa tranh chấp đến nơi phân xử và giữ được thế đối lập ἐπὶ τῶν ἀδίκων ... καὶ οὐχὶ ἐπὶ τῶν ἁγίων. Các chú thích và neo chú thích được giữ nguyên, vì chúng phù hợp với nguyên ngữ.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T18:10:59Z'
review_pass:
  verdict: revise
  source_fidelity: Bản nháp giữ được câu hỏi tu từ, thế đối lập giữa «những người bất chính» và «các thánh đồ», cùng bối cảnh phân xử. Tuy nhiên, «Khi có vụ kiện với người khác» làm πρᾶγμα ἔχων hơi quá cụ thể, và cấu trúc «dám để những người bất chính xét xử» không nêu rõ «vụ việc» là điều được xét xử, nên phản ánh κρίνεσθαι chưa thật sáng rõ.
  naturalness: Câu hiện tại có thể hiểu được nhưng trật tự và kết cấu «để những người ... xét xử, chứ không phải các thánh đồ không?» hơi gượng trong tiếng Việt hiện đại. Dùng «đem việc ấy ra cho ... xét xử, thay vì cho ...» tự nhiên hơn và làm rõ hai nơi/nhóm được đặt đối chiếu.
  terminology: «Những người bất chính» bảo toàn sắc thái đánh giá của ἀδίκων, không diễn giải thành «người không tin». «Các thánh đồ» là thuật ngữ phù hợp trong văn mạch Phao-lô và được giải thích bằng chú thích.
  issues:
  - severity: medium
    issue: Chủ thể/đối tượng của việc xét xử chưa rõ
    rationale: 'κρίνεσθαι là bất định từ bị động: người có tranh chấp đưa vụ việc ra để được phân xử trước một nhóm. «để những người bất chính xét xử» có thể được hiểu là họ xét xử một người, nhưng không nói rõ vụ việc đang được đưa ra xét xử.'
  - severity: low
    issue: «vụ kiện» có phần chuyên biệt hóa πρᾶγμα
    rationale: πρᾶγμα là «việc, vấn đề, tranh chấp»; dù ngữ cảnh là tư pháp, «việc tranh chấp» giữ phạm vi từ vựng rộng hơn mà vẫn biểu đạt rõ bối cảnh.
