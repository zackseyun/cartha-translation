id: 1CO.6.8
reference: 1 Corinthians 6:8
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀλλὰ ὑμεῖς ἀδικεῖτε καὶ ἀποστερεῖτε, καὶ ⸀τοῦτο ἀδελφούς.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/008.yaml
  text: But you yourselves do wrong and defraud—and this to your brothers[a].
translation:
  language: vi
  text: Nhưng chính anh chị em lại làm điều bất công và gian lận—mà lại làm như thế với anh chị em mình.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn là “các anh em”; từ Hy Lạp này cũng có thể chỉ rộng hơn đến những người cùng đức tin, gồm cả nam lẫn nữ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Nhưng
  rationale: Đánh dấu sự tương phản mạnh với ý trước đó, đồng thời tự nhiên trong tiếng Việt hiện đại.
- source_word: ὑμεῖς
  choice: chính anh chị em
  rationale: Đại từ được nêu rõ trong tiếng Hy Lạp mang sắc thái nhấn mạnh; “chính” giữ được trọng tâm đặt vào hành vi của người Cô-rinh-tô.
- source_word: ἀδικεῖτε
  choice: làm điều bất công
  rationale: Giữ nghĩa rộng là hành xử bất chính hoặc gây thiệt hại, mà không xác định quá mức đối tượng hay hình thức sai phạm.
- source_word: ἀποστερεῖτε
  choice: gian lận
  rationale: Trong bối cảnh tranh tụng và tài sản, từ này chỉ việc lừa hoặc tước đoạt điều thuộc về người khác; “gian lận” trang trọng và chính xác hơn “lừa gạt”, nhưng không mạnh quá mức như “cướp đoạt”.
- source_word: καὶ τοῦτο
  choice: —mà lại làm như thế
  rationale: 'Thể hiện sức nhấn tu từ: điều đáng trách hơn nữa là họ đối xử như vậy với chính những người cùng cộng đồng đức tin.'
- source_word: ἀδελφούς
  choice: anh chị em mình
  rationale: Danh từ Hy Lạp ở giống đực số nhiều có nghĩa đen là “các anh em”, nhưng trong cách dùng của Phao-lô thường chỉ những người cùng đức tin nói chung. Cách dịch này tự nhiên trong tiếng Việt và truyền đạt phạm vi cộng đồng, còn chú thích bảo lưu hình thức của nguyên văn.
theological_decisions:
- issue: Phạm vi chỉ người của ἀδελφούς trong cộng đồng tín hữu gồm cả nam và nữ
  choice: anh chị em mình
  alternative: các anh em mình
  rationale: Nguyên ngữ dùng danh từ giống đực số nhiều, nhưng trong ngữ cảnh thư tín của Phao-lô từ này có thể bao gồm toàn thể những người cùng đức tin. Tiếng Việt dùng “anh chị em” tự nhiên để diễn đạt cộng đồng hỗn hợp; chú thích nêu rõ hình thức nguyên văn nhằm bảo tồn dữ kiện ngôn ngữ và sự rộng nghĩa theo ngữ cảnh.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dấu gạch ngang giữ sức nhấn tu từ của καὶ τοῦτο. “Anh chị em mình” diễn đạt quan hệ trong cộng đồng đức tin tự nhiên hơn cách thêm đại từ sở hữu cứng nhắc.
