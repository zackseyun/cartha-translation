source:
  edition: SBLGNT
  text: Ἢ οὐκ οἴδατε ὅτι ἄδικοι ⸂θεοῦ βασιλείαν⸃ οὐ κληρονομήσουσιν; μὴ πλανᾶσθε· οὔτε πόρνοι οὔτε εἰδωλολάτραι οὔτε μοιχοὶ οὔτε μαλακοὶ οὔτε ἀρσενοκοῖται
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/009.yaml
  text: 'Or do you not know that the unrighteous will not inherit the kingdom of God? Do not be deceived: neither the sexually immoral[a], nor idolaters, nor adulterers, nor effeminate men[b], nor men who have sex with men'
translation:
  language: vi
  text: 'Hay anh em không biết rằng những kẻ bất chính sẽ không thừa hưởng vương quốc Đức Chúa Trời sao? Đừng bị lừa dối: chẳng kẻ nào trong số những kẻ gian dâm, những kẻ thờ hình tượng, những kẻ ngoại tình, những người đàn ông mềm yếu[a], hay những người nam quan hệ tình dục với người nam[b]—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hy Lạp μαλακοί có nghĩa đen là “mềm”; từ này có thể chỉ những người đàn ông ẻo lả hoặc yếu đuối về đạo đức, và trong văn cảnh này có thể chỉ người bán dâm nam hoặc người giữ vai trò thụ động trong quan hệ tình dục giữa nam giới.
    reason: lexical_alternative
  - marker: b
    text: Từ Hy Lạp ἀρσενοκοῖται hiếm gặp và nghĩa chính xác còn được tranh luận. Có thể dịch là “những người đàn ông quan hệ tình dục với đàn ông” hoặc, theo nghĩa rộng hơn, “những người đàn ông có hành vi tình dục trái phép với người nam.” Nhiều học giả liên hệ từ này với cách diễn đạt trong bản Hy Lạp của sách Lê-vi Ký.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἢ
  choice: Hay
  rationale: Giữ liên từ chuyển ý có tính chất chất vấn, nối câu này với lập luận ngay trước đó.
- source_word: οὐκ οἴδατε
  choice: anh em không biết ... sao?
  rationale: Tái hiện công thức câu hỏi tu từ quen thuộc của Phao-lô, đồng thời dùng đại từ số nhiều tự nhiên trong tiếng Việt.
- source_word: ἄδικοι
  choice: những kẻ bất chính
  rationale: Giữ nghĩa rộng về người không ngay chính, thay vì thu hẹp vào một loại hành vi sai trái cụ thể.
- source_word: θεοῦ βασιλείαν
  choice: vương quốc của Đức Chúa Trời
  rationale: Cách dịch minh bạch của cấu trúc sở hữu, giữ hình ảnh về quyền trị vì và vương quốc.
- source_word: κληρονομήσουσιν
  choice: sẽ không được thừa hưởng
  rationale: Giữ hình ảnh thừa kế cùng sắc thái giao ước và cánh chung của động từ κληρονομέω.
- source_word: μὴ πλανᾶσθε
  choice: Đừng để mình bị lừa dối
  rationale: Giữ hình thức bị động của lời cảnh báo nhưng vẫn tự nhiên trong tiếng Việt; không quyết định rằng sự lừa dối chỉ đến từ bản thân hay từ người khác.
- source_word: πόρνοι
  choice: những kẻ gian dâm
  rationale: Diễn đạt hạng người phạm tội tình dục theo nghĩa rộng trong văn cảnh, bằng một thuật ngữ quen thuộc trong tiếng Việt.
- source_word: εἰδωλολάτραι
  choice: những kẻ thờ thần tượng
  rationale: Diễn đạt trực tiếp, dễ hiểu hành vi thờ các thần tượng.
- source_word: μοιχοὶ
  choice: những kẻ ngoại tình
  rationale: Giữ nghĩa chuyên biệt về sự vi phạm lòng chung thủy trong hôn nhân.
- source_word: μαλακοὶ
  choice: những người đàn ông mềm yếu[a]
  rationale: Giữ gần nghĩa đen 'mềm' và không âm thầm quyết định nghĩa tình dục đang còn tranh luận; chú thích nêu các khả năng theo văn cảnh.
- source_word: ἀρσενοκοῖται
  choice: những người nam ăn nằm với người nam[b]
  rationale: Cách diễn đạt mô tả hành vi, tránh áp đặt phạm trù bản sắc hiện đại và gợi lại lối nói có thể đứng sau từ ghép Hy Lạp.
theological_decisions:
- issue: Ý nghĩa của μαλακοὶ và ἀρσενοκοῖται trong danh sách thói xấu
  choice: Dịch phân biệt là “những người đàn ông mềm yếu” và “những người nam ăn nằm với người nam”, kèm chú thích cho cả hai từ.
  alternative: Có thể hiểu μαλακοὶ là đàn ông ẻo lả, người yếu đuối về đạo đức, người bán dâm nam, hoặc người giữ vai trò thụ động trong quan hệ tình dục nam-nam; ἀρσενοκοῖται có thể được dịch bằng những nhãn truyền thống hoặc hiểu rộng hơn là nam giới có hành vi tình dục trái phép với người nam.
  rationale: Hai thuật ngữ này bị tranh luận về phạm vi nghĩa. Bản dịch chính tránh ngôn ngữ bản sắc hiện đại, giữ sự phân biệt giữa hai từ và không tuyên bố chắc chắn hơn chứng cứ từ vựng cho phép.
translation_notes:
  register: Văn phong hiện đại, trang trọng và trực tiếp. “Anh em” biểu thị đối tượng số nhiều của câu hỏi tu từ. Dấu gạch ngang cuối câu cho biết danh sách οὔτε còn tiếp tục sang câu 10, tránh tự ý khép lại cú pháp ở ranh giới câu 9.
