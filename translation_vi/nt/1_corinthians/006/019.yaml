id: 1CO.6.19
reference: 1 Corinthians 6:19
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἢ οὐκ οἴδατε ὅτι τὸ σῶμα ὑμῶν ναὸς τοῦ ἐν ὑμῖν ἁγίου πνεύματός ἐστιν, οὗ ἔχετε ἀπὸ θεοῦ; καὶ οὐκ ἐστὲ ἑαυτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/019.yaml
  text: Or do you not know that your body is a temple of the Holy Spirit within you[a], whom you have from God? And you are not your own[b],
translation:
  language: vi
  text: Hay anh chị em không biết rằng thân thể của anh chị em là đền thờ của Đức Thánh Linh ở trong anh chị em[a], Đấng anh chị em có từ Đức Chúa Trời sao? Và anh chị em không thuộc về chính mình[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “của Đức Thánh Linh là Đấng ở trong anh chị em.”'
    reason: lexical_alternative
  - marker: b
    text: Tiếng Hy Lạp dùng “thân thể” ở số ít nhưng “của anh chị em” ở số nhiều; câu này có thể nói về thân thể của mỗi người hoặc dùng số ít theo nghĩa đại diện.
    reason: alternative_reading
lexical_decisions:
- source_word: ἢ
  choice: Hay
  rationale: Giữ sự chuyển ý mang tính chất vấn và nối tiếp lập luận trước đó của Phao-lô.
- source_word: οὐκ οἴδατε
  choice: anh chị em không biết ... sao?
  rationale: Diễn đạt tự nhiên công thức câu hỏi tu từ quen thuộc của Phao-lô, đồng thời bám sát nghĩa của οἶδα.
- source_word: τὸ σῶμα ὑμῶν
  choice: thân thể mình
  rationale: Giữ danh từ số ít σῶμα cùng đối tượng số nhiều ὑμῶν qua cách nói tập thể tự nhiên trong tiếng Việt, không buộc câu theo nghĩa hoàn toàn cá thể hay hoàn toàn đại diện.
- source_word: ναὸς
  choice: đền thờ
  rationale: Truyền đạt nơi thánh/điện thờ theo nghĩa cụ thể của ναός và giữ sức nặng thiêng liêng của hình ảnh.
- source_word: τοῦ ἐν ὑμῖν ἁγίου πνεύματός
  choice: của Đức Thánh Linh đang ngự trong anh chị em
  rationale: Cho thấy cụm sở hữu bổ nghĩa cho 'đền thờ', còn ἐν ὑμῖν mô tả Đức Thánh Linh ở trong cộng đồng/tín hữu; 'ngự' là cách nói trang trọng, tự nhiên trong ngữ cảnh đền thờ.
- source_word: οὗ
  choice: Đấng mà
  rationale: Đại từ quan hệ quy chiếu về Đức Thánh Linh; cách gọi 'Đấng' thể hiện quy chiếu hữu vị mà không thêm mệnh đề thần học ngoài văn bản.
- source_word: ἔχετε ἀπὸ θεοῦ
  choice: anh chị em có từ Đức Chúa Trời
  rationale: Giữ thì hiện tại và nghĩa trực tiếp 'có từ'; không chuyển thành 'đã nhận' dù ý tiếp nhận được hàm chứa.
- source_word: καὶ οὐκ ἐστὲ ἑαυτῶν
  choice: Anh chị em không thuộc về chính mình
  rationale: 'Diễn đạt rõ và tự nhiên thành ngữ sở hữu trong tiếng Hy Lạp: họ không thuộc quyền sở hữu của bản thân.'
theological_decisions:
- issue: Đối tượng quy chiếu và tính hữu vị của οὗ
  choice: Hiểu οὗ là quy chiếu về Đức Thánh Linh và dịch bằng cách gọi hữu vị 'Đấng mà'.
  alternative: Dịch phi nhân xưng hoặc tái cấu trúc câu để tránh đại từ quan hệ.
  rationale: Ngữ pháp liên kết οὗ với ἁγίου πνεύματός. Cách dịch hữu vị phản ánh đối tượng quy chiếu mà không bổ sung định thức giáo lý.
- issue: Danh từ 'thân thể' số ít với đại từ sở hữu chỉ nhiều người
  choice: Giữ 'thân thể' ở số ít qua cụm 'thân thể mình'.
  alternative: Dịch rõ thành 'thân thể của mỗi người trong anh chị em' hoặc số nhiều 'thân thể của anh chị em'.
  rationale: Nguyên văn có τὸ σῶμα số ít và ὑμῶν số nhiều. Cách dịch được chọn bảo tồn khả năng hiểu theo nghĩa phân phối cho từng người hoặc theo nghĩa đại diện/tập thể.
- issue: Phạm vi của ἐν ὑμῖν
  choice: Dịch 'trong anh chị em', không xác quyết riêng nghĩa cá nhân hay cộng đồng.
  alternative: Dịch 'trong mỗi người' hoặc 'giữa anh chị em'.
  rationale: Đại từ số nhiều có thể được hiểu theo phương diện các cá nhân hoặc toàn cộng đồng; bản dịch giữ độ mở của nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” cho đối tượng số nhiều, “Đức Thánh Linh” và “Đức Chúa Trời” theo cách gọi Tin Lành Việt ngữ phổ biến; “đang ngự” phù hợp hình ảnh đền thờ nhưng phần chú thích vẫn nêu cách cấu trúc sát chữ hơn.
