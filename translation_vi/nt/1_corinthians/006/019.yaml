revisions:
- from: Hay anh chị em không biết rằng thân thể mình là đền thờ của Đức Thánh Linh đang ngự trong anh chị em[a], Đấng mà anh chị em có từ Đức Chúa Trời sao? Anh chị em không thuộc về chính mình[b],
  to: Hay anh chị em không biết rằng thân thể của anh chị em là đền thờ của Đức Thánh Linh ở trong anh chị em[a], Đấng anh chị em có từ Đức Chúa Trời sao? Và anh chị em không thuộc về chính mình[b],
  rationale: Bản sửa giữ câu hỏi tu từ, “thân thể” số ít, và tính mơ hồ giữa cách hiểu phân phối với đại diện. Các thay đổi chỉ làm rõ sở hữu cách số nhiều, tái hiện liên từ, và dùng “ở trong” sát với ἐν mà không thêm diễn giải.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T18:11:13Z'
review_pass:
  verdict: revise
  source_fidelity: Cần sửa nhẹ để phản ánh rõ hơn sở hữu cách số nhiều của ὑμῶν và liên từ καὶ. Cụm “ở trong” bám sát ἐν hơn “đang ngự”, vốn thêm sắc thái cư ngụ/trang trọng không được phát biểu trực tiếp trong câu.
  naturalness: “Thân thể của anh chị em” tự nhiên, rõ sở hữu cách, và vẫn không buộc số ít Hy Lạp theo nghĩa cá thể hay tập thể. Cấu trúc “Đấng anh chị em có từ Đức Chúa Trời” giữ thì hiện tại của ἔχετε và tránh lối nói “Đấng mà ... có” hơi gượng.
  terminology: “Đền thờ,” “Đức Thánh Linh,” và “Đức Chúa Trời” phù hợp văn phong Cơ Đốc giáo Việt ngữ trang trọng, hiện đại. Không cần áp đặt diễn giải giáo phái nào.
  issues:
  - severity: low
    issue: “thân thể mình” làm mờ sở hữu cách số nhiều ὑμῶν.
    rationale: Trong tiếng Việt, “mình” có thể hiểu phản thân hoặc khái quát; “của anh chị em” phản ánh trực tiếp hơn quan hệ giữa danh từ số ít σῶμα và đại từ số nhiều ὑμῶν, đồng thời vẫn giữ độ mở của nguyên văn.
  - severity: low
    issue: “đang ngự” diễn giải ἐν bằng một động từ có sắc thái thêm.
    rationale: Nguyên văn chỉ nói Đức Thánh Linh “ở trong” người nhận; “ở trong” vừa tự nhiên vừa sát chữ hơn. Hình ảnh đền thờ đã có trong ναός, nên không cần bổ sung sắc thái này.
  - severity: low
    issue: Liên từ καὶ ở đầu mệnh đề cuối không được thể hiện.
    rationale: Thêm “Và” duy trì sự nối tiếp lập luận của nguyên văn mà vẫn tự nhiên trong tiếng Việt.
