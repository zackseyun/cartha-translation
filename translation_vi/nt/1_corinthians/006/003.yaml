  yaml_path: translation/nt/1_corinthians/006/003.yaml
  text: Do you not know that we will judge angels? How much more[a], the things of this life!
translation:
  language: vi
  text: Anh chị em không biết rằng chúng ta sẽ xét xử các thiên sứ, huống chi là những việc thuộc đời này sao?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐκ οἴδατε
  choice: Anh chị em không biết... sao?
  rationale: Giữ câu hỏi tu từ quen thuộc của Phao-lô, đồng thời diễn đạt tự nhiên trong tiếng Việt; chủ ngữ được làm rõ theo số nhiều của động từ và đối tượng độc giả trong ngữ cảnh.
- source_word: ὅτι
  choice: rằng
  rationale: Dẫn vào mệnh đề nội dung theo cách trực tiếp và tự nhiên.
- source_word: ἀγγέλους
  choice: các thiên sứ
  rationale: Trong bối cảnh xét xử mang tính cánh chung, từ này chỉ các hữu thể trên trời chứ không phải sứ giả loài người.
- source_word: κρινοῦμεν
  choice: chúng ta sẽ xét xử
  rationale: Thì tương lai được giữ bằng “sẽ”; “xét xử” bảo toàn sắc thái tư pháp của κρίνω mà không diễn giải thành cai trị.
- source_word: μήτιγε
  choice: huống chi
  rationale: Diễn tả lập luận từ việc lớn hơn đến việc nhỏ hơn một cách gọn và tự nhiên, nhưng vẫn có thể được hiểu theo các cách diễn đạt gần nghĩa được ghi ở chú thích.
- source_word: βιωτικά
  choice: những việc thuộc đời này
  rationale: Tính từ được dùng như danh từ, chỉ những việc thuộc đời sống trần thế thông thường; cách dịch đủ rộng để bao gồm các vụ tranh chấp trong ngữ cảnh mà không thu hẹp quá mức.
theological_decisions:
- issue: Bản chất việc các tín hữu “xét xử các thiên sứ”
  choice: Giữ nguyên cách nói trực tiếp “chúng ta sẽ xét xử các thiên sứ”.
  alternative: “chúng ta sẽ cai trị các thiên sứ” hoặc “chúng ta sẽ xét xử các thiên sứ sa ngã”
  rationale: Câu Hy Lạp không xác định cách thức, phạm vi hay loại thiên sứ nào; không thêm lời giải thích nhằm tránh áp đặt một hệ thống cánh chung cụ thể.
- issue: Sắc thái của μήτιγε
  choice: Dịch trong chính văn là “huống chi” và ghi nhận các cách hiểu gần nghĩa trong chú thích.
  alternative: “nói gì đến” hoặc “phương chi”
  rationale: Tiểu từ nhấn mạnh phép suy luận từ điều lớn hơn đến điều nhỏ hơn. “Huống chi” phù hợp nhất trong mạch lập luận, còn chú thích bảo tồn phạm vi diễn đạt của cấu trúc.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Anh chị em” biểu đạt số nhiều của οἴδατε và phù hợp lối xưng hô cộng đồng; “thiên sứ” giữ thuật ngữ Kinh Thánh quen thuộc; “những việc thuộc đời này” tránh thu hẹp βιωτικά thành riêng các vụ kiện tụng.
