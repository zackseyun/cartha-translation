id: 1CO.6.7
reference: 1 Corinthians 6:7
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἤδη μὲν ⸀οὖν ὅλως ἥττημα ὑμῖν ἐστιν ὅτι κρίματα ἔχετε μεθ’ ἑαυτῶν· διὰ τί οὐχὶ μᾶλλον ἀδικεῖσθε; διὰ τί οὐχὶ μᾶλλον ἀποστερεῖσθε;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/007.yaml
  text: Indeed[a], then, it is already altogether a defeat for you that you have lawsuits among yourselves[c][b]. Why not rather be wronged? Why not rather be defrauded?
translation:
  language: vi
  text: Thật vậy, việc anh em kiện tụng nhau[b] đã hoàn toàn là một thất bại[a] đối với anh em rồi. Sao anh em chẳng thà chịu bất công? Sao anh em chẳng thà chịu thiệt[c]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Thất bại” cũng có thể dịch là “tổn thất” hoặc “sự thua thiệt.”
    reason: lexical_alternative
  - marker: b
    text: Hay “có những vụ kiện giữa anh em.”
    reason: lexical_alternative
  - marker: c
    text: “Chịu thiệt” cũng có thể dịch là “bị lừa gạt,” “bị chiếm đoạt” hoặc “bị tước mất.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤδη μὲν οὖν ὅλως
  choice: Thật vậy, ... đã hoàn toàn ... rồi
  rationale: 'Cụm từ chuyển ý và nhấn mạnh được diễn đạt tự nhiên trong tiếng Việt: μὲν οὖν nêu kết luận có sắc thái nhấn mạnh, ἤδη là “đã... rồi,” còn ὅλως tăng cường mức độ đánh giá.'
- source_word: ἥττημα
  choice: một thất bại
  rationale: 'Giữ sức nặng tu từ của lời Phao-lô: chỉ riêng việc có kiện tụng đã là thất bại, bất kể kết quả pháp lý; từ này cũng có thể mang nghĩa “tổn thất” hoặc “sự thua thiệt.”'
- source_word: ὑμῖν ἐστιν
  choice: đối với anh em
  rationale: Giữ sắc thái sở chỉ của cách dữ cách mà không thêm ý “đáng xấu hổ,” vốn không được nói trực tiếp trong nguyên văn.
- source_word: κρίματα ἔχετε μεθ’ ἑαυτῶν
  choice: anh em kiện tụng nhau
  rationale: Diễn đạt cụ thể và tự nhiên bối cảnh các vụ tranh chấp được đưa ra tòa; “nhau” thể hiện tính tương hỗ trong cộng đồng.
- source_word: διὰ τί οὐχὶ μᾶλλον
  choice: Sao anh em chẳng thà
  rationale: Giữ câu hỏi tu từ cùng ý so sánh/lựa chọn của μᾶλλον, đồng thời phù hợp văn phong tiếng Việt trang trọng, dễ hiểu.
- source_word: ἀδικεῖσθε
  choice: chịu bất công
  rationale: Giữ thể bị động và bình diện đạo đức của việc bị đối xử trái lẽ; tự nhiên hơn cách nói “bị làm điều bất công.”
- source_word: ἀποστερεῖσθε
  choice: chịu thiệt
  rationale: Bao quát ý bị tước đoạt, bị lừa hoặc bị chiếm phần thuộc về mình mà không giới hạn quá mức vào một hình thức gian lận pháp lý.
theological_decisions:
- issue: Bản chất lời đánh giá của Phao-lô về việc tín hữu kiện tụng nhau
  choice: Dịch ἥττημα là “thất bại,” nhấn mạnh rằng chính sự hiện hữu của việc kiện tụng đã là thất bại của cộng đồng.
  alternative: “tổn thất” hoặc “sự thua thiệt”
  rationale: “Thất bại” truyền đạt sức mạnh của lời quở trách nhưng không bổ sung một phạm trù giáo lý hay xác định cụ thể thất bại ấy là pháp lý, thuộc linh hoặc đạo đức.
- issue: Phạm vi nghĩa của ἀποστερεῖσθε
  choice: Dịch là “chịu thiệt,” giữ nghĩa tương đối rộng.
  alternative: “bị lừa gạt,” “bị chiếm đoạt” hoặc “bị tước mất”
  rationale: Nguyên ngữ có thể chỉ việc bị tước đoạt hay gian lận. “Chịu thiệt” bảo tồn độ mở trong khi vẫn phù hợp với sự đối lập giữa chấp nhận mất mát và kiện tụng nhau.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh em” để phản ánh lối xưng hô cộng đồng trong thư; cấu trúc “chẳng thà” giữ sức mạnh của hai câu hỏi tu từ. Các dấu chú thích [a], [b], [c] đều xuất hiện trong chính văn và đặt sát từ/cụm từ liên quan.
