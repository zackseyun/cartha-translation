language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: πρὸς ἐντροπὴν ὑμῖν λέγω. οὕτως οὐκ ἔνι ἐν ὑμῖν ⸂οὐδεὶς σοφὸς⸃ ὃς δυνήσεται διακρῖναι ἀνὰ μέσον τοῦ ⸀ἀδελφοῦ αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/005.yaml
  text: I say this to your shame[a]. Is it really so[b], that there is not among you even one wise man who will be able to judge between his brothers?
translation:
  language: vi
  text: Tôi nói điều này để làm anh chị em hổ thẹn. Chẳng lẽ trong anh chị em không có lấy một người khôn ngoan nào có thể phân xử giữa anh chị em mình sao?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn có tính tỉnh lược: “phân xử giữa người anh em của mình,” với “người anh em” ở số ít. Trong ngữ cảnh, “anh em” chỉ người cùng đức tin và có thể bao gồm cả nam lẫn nữ trong hội thánh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸς ἐντροπὴν ὑμῖν λέγω
  choice: Tôi nói điều này để anh chị em phải hổ thẹn
  rationale: Diễn đạt tự nhiên sắc thái mục đích hoặc kết quả của πρὸς ἐντροπὴν, đồng thời giữ nguyên giọng quở trách trực tiếp của Phao-lô.
- source_word: οὕτως
  choice: thật sự ... sao?
  rationale: Trong ngữ cảnh, từ này dẫn vào một câu hỏi tu từ đầy kinh ngạc và trách cứ; cấu trúc tiếng Việt này truyền đạt lực dụng học ấy tự nhiên.
- source_word: οὐκ ἔνι ἐν ὑμῖν οὐδεὶς σοφὸς
  choice: Trong anh chị em thật sự không có lấy một người khôn ngoan
  rationale: “Không có lấy một” thể hiện sức nhấn mạnh của phủ định οὐδεὶς, còn “trong anh chị em” giữ rõ bối cảnh cộng đồng.
- source_word: δυνήσεται διακρῖναι
  choice: có thể phân xử
  rationale: Dù δυνήσεται mang hình thức tương lai, trong câu hỏi về năng lực nó được diễn đạt tự nhiên bằng “có thể”; “phân xử” phù hợp với ngữ cảnh tranh chấp pháp lý mà không nhất thiết hàm ý một chức vụ thẩm phán chính thức.
- source_word: ἀνὰ μέσον τοῦ ἀδελφοῦ αὐτοῦ
  choice: giữa anh chị em mình
  rationale: Cụm Hy Lạp có tính tỉnh lược sau “giữa”. Bản dịch giữ sự tỉnh lược ở mức tiếng Việt vẫn hiểu được, không tự ý thêm một bên tranh chấp không được nêu minh nhiên. “Anh chị em” truyền đạt ngôn ngữ thân tộc dành cho các tín hữu trong hội thánh hỗn hợp nam nữ.
theological_decisions:
- issue: Ngôn ngữ giống đực số ít trong lời nói với toàn thể hội thánh
  choice: một người khôn ngoan ... anh chị em mình
  alternative: một người nam khôn ngoan ... người anh em của mình
  rationale: Các dạng Hy Lạp là giống đực số ít nhưng trong ngữ cảnh có chức năng đại diện cho thành viên hội thánh nói chung. Tiếng Việt không buộc phải đánh dấu giống ở “người khôn ngoan”; “anh chị em” giữ ý thân thuộc trong đức tin và tránh giới hạn đối tượng vào nam giới.
- issue: Tính tỉnh lược của ἀνὰ μέσον τοῦ ἀδελφοῦ αὐτοῦ
  choice: giữa anh chị em mình
  alternative: giữa một anh em mình với một người khác
  rationale: Nguyên văn chỉ nêu một thành tố sau “giữa”, dù ngữ cảnh tranh chấp hàm ý nhiều bên. Bản chính không thêm “với một người khác”, nhờ đó bảo toàn nét tỉnh lược và sự căng thẳng của nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “anh chị em” để xưng gọi cộng đồng, “hổ thẹn” để giữ sức nặng của lời quở trách, và “phân xử” cho bối cảnh giải quyết tranh chấp.
