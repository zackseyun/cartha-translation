  naturalness: “Chẳng lẽ ... sao?” là cấu trúc tu từ tự nhiên trong tiếng Việt hiện đại. “Phân xử giữa anh chị em mình” giữ được tính tỉnh lược khó xử của nguyên văn mà vẫn có thể hiểu trong ngữ cảnh.
  terminology: “Người khôn ngoan,” “phân xử,” và “anh chị em” phù hợp với văn phong hội thánh hiện đại. Chú thích cần nói rõ rằng nguyên văn dùng số ít “người anh em của mình,” trong khi cách diễn đạt tiếng Việt mang tính bao quát theo ngữ cảnh.
