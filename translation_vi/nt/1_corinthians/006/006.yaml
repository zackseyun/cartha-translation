source:
  edition: SBLGNT
  text: ἀλλὰ ἀδελφὸς μετὰ ἀδελφοῦ κρίνεται, καὶ τοῦτο ἐπὶ ἀπίστων;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/006.yaml
  text: But brother goes to court against brother[b][a], and this before unbelievers?
translation:
  language: vi
  text: Nhưng một người anh em[b] lại kiện một người anh em khác, và việc này diễn ra trước những người không tin[a] sao?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “trước những người không tin.” Cụm từ này có lẽ chỉ việc đưa vụ kiện ra tòa án bên ngoài hội thánh, nhưng nguyên văn chỉ nói “trước những người không tin.”'
    reason: lexical_alternative
  - marker: b
    text: Cụm từ lặp lại “người anh em” chỉ các thành viên cùng thuộc cộng đồng đức tin.
    reason: cultural_note
lexical_decisions:
- source_word: ἀλλὰ
  choice: Nhưng
  rationale: Diễn tả sự tương phản mạnh với điều đáng lẽ cộng đồng phải làm ở câu trước.
- source_word: ἀδελφὸς μετὰ ἀδελφοῦ
  choice: anh em lại kiện nhau
  rationale: Trong tiếng Việt, “anh em” tự nhiên giữ được ngôn ngữ gia đình dành cho các thành viên trong cộng đồng đức tin; “kiện nhau” truyền đạt quan hệ đối tụng của μετά trong văn cảnh pháp lý mà không cần lặp cứng nhắc danh từ số ít.
- source_word: κρίνεται
  choice: kiện nhau
  rationale: Động từ ở đây mang nghĩa pháp lý trong mạch văn về tranh tụng; cách dịch này tự nhiên và rõ hơn lối dịch sát hình thức “bị xét xử”.
- source_word: καὶ τοῦτο
  choice: mà còn
  rationale: 'Tái hiện sức nhấn tu từ và sự kinh ngạc: không chỉ kiện nhau, họ còn làm vậy trong một bối cảnh đáng trách hơn.'
- source_word: ἐπὶ ἀπίστων
  choice: trước mặt những người không tin
  rationale: Giữ phạm vi rộng của tiếng Hy Lạp, chỉ những người ngoài cộng đồng đức tin, đồng thời không tự ý thêm ý “quan tòa” dù văn cảnh pháp đình gợi đến điều đó.
theological_decisions:
- issue: Cách thể hiện ἀδελφός như một từ chỉ thành viên cộng đồng đức tin
  choice: anh em
  alternative: một người anh em kiện một người anh em khác
  rationale: “Anh em” là cách gọi tự nhiên, trang trọng trong tiếng Việt đối với các thành viên của cộng đồng và vẫn bảo tồn hình ảnh gia đình của nguyên văn; câu không bị giới hạn thành quan hệ anh em ruột.
- issue: Phạm vi của ἀπίστων
  choice: những người không tin
  alternative: các quan tòa không tin / người ngoại
  rationale: Nguyên văn chỉ nói “những người không tin”; không thu hẹp đối tượng thành quan tòa hay gắn một nhãn văn hóa-tôn giáo cụ thể hơn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc “lại… mà còn…” giữ sắc thái trách cứ và kinh ngạc của câu hỏi tu từ; “anh em” dùng theo nghĩa cộng đồng đức tin.
