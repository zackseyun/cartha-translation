revisions:
- from: Nhưng anh em lại kiện nhau, mà còn kiện trước mặt những người không tin[a] sao?
  to: Nhưng một người anh em[b] lại kiện một người anh em khác, và việc này diễn ra trước những người không tin[a] sao?
  rationale: Chỉnh sửa khôi phục cấu trúc “một người anh em ... một người anh em khác” của tiếng Hy Lạp, diễn đạt rõ quan hệ đối tụng, và giữ sức nhấn của “và việc này” trước cụm “trước những người không tin.” Chú thích được bổ sung để bảo toàn thông tin giải thích có liên quan trong dấu vết kiểm tra tiếng Anh.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T18:11:03Z'
review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng ý pháp lý và tính chất trách cứ của câu. Tuy nhiên, “anh em lại kiện nhau” chuyển cặp số ít ἀδελφὸς ... ἀδελφοῦ thành một diễn đạt số nhiều khái quát, làm mờ việc Phao-lô nhấn vào một người anh em kiện một người anh em khác. “Trước mặt” không sai, nhưng “trước” sát và tự nhiên hơn cho ἐπὶ ἀπίστων trong ngữ cảnh này.
  naturalness: Câu hiện tại tự nhiên. Bản chỉnh sửa vẫn dùng tiếng Việt hiện đại, nhưng làm rõ hai bên tranh tụng và liên kết “và việc này” để phản ánh καὶ τοῦτο mà không trở nên gượng.
  terminology: “Người anh em” bảo tồn ngôn ngữ gia đình của ἀδελφός; chú thích giải thích đây là thành viên cộng đồng đức tin, không phải nhất thiết anh em ruột. “Những người không tin” giữ phạm vi của ἀπίστων, không tự thêm nghĩa “quan tòa” hay “người ngoại.”
  issues:
  - severity: medium
    issue: Cặp số ít “anh em ... anh em” bị khái quát hóa thành “anh em ... nhau.”
    rationale: Nguyên văn nêu rõ một người anh em tranh tụng với một người anh em khác. Cách dịch khái quát không đổi ý chính, nhưng giảm sắc thái và cấu trúc lặp có chủ ý của bản nguồn.
  - severity: low
    issue: Chú thích văn hóa về cách dùng “brother” trong cộng đồng đức tin bị bỏ.
    rationale: Vì “anh em” trong tiếng Việt có thể gợi quan hệ huyết thống, một chú thích ngắn giúp người đọc hiểu đúng phạm vi cộng đồng của thuật ngữ trong câu này.
