reference: 1 Corinthians 6:13
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τὰ βρώματα τῇ κοιλίᾳ, καὶ ἡ κοιλία τοῖς βρώμασιν· ὁ δὲ θεὸς καὶ ταύτην καὶ ταῦτα καταργήσει. τὸ δὲ σῶμα οὐ τῇ πορνείᾳ ἀλλὰ τῷ κυρίῳ, καὶ ὁ κύριος τῷ σώματι·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/013.yaml
  text: Food is for the stomach[a], and the stomach for food—but God will do away with both it and them. But the body is not for sexual immorality, but for the Lord[c][b], and the Lord for the body.
translation:
  language: vi
  text: Thức ăn dành cho dạ dày, và dạ dày dành cho thức ăn[a][b]—nhưng Đức Chúa Trời sẽ làm cho cả dạ dày lẫn thức ăn không còn nữa.[c] Còn thân thể không dành cho sự vô luân tình dục, mà dành cho Chúa, và Chúa dành cho thân thể.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “Các thức ăn dành cho dạ dày, và dạ dày dành cho các thức ăn.” Tiếng Hy Lạp dùng số nhiều; bản dịch chính diễn đạt tự nhiên theo cách dùng danh từ chỉ loại trong tiếng Việt.'
    reason: lexical_alternative
  - marker: b
    text: Nhiều người hiểu câu “Thức ăn dành cho dạ dày, và dạ dày dành cho thức ăn” là một khẩu hiệu của người Cô-rinh-tô mà Phao-lô nhắc lại trước khi điều chỉnh nó.
    reason: alternative_reading
  - marker: c
    text: 'Cũng có thể dịch: “Đức Chúa Trời sẽ hủy diệt cả dạ dày lẫn thức ăn.” Động từ Hy Lạp cũng có thể mang nghĩa “bãi bỏ” hoặc “làm cho mất hiệu lực”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ βρώματα
  choice: thức ăn
  rationale: Danh từ Hy Lạp ở số nhiều, nhưng tiếng Việt thường dùng “thức ăn” như một danh từ chỉ loại trong một mệnh đề khái quát; cách này tự nhiên mà vẫn giữ nghĩa chung.
- source_word: κοιλίᾳ / κοιλία
  choice: dạ dày
  rationale: Trong ngữ cảnh nói về thức ăn và chức năng tiêu hóa, “dạ dày” rõ nghĩa và chính xác hơn “bụng”.
- source_word: καταργήσει
  choice: sẽ làm cho ... không còn nữa
  rationale: Động từ chỉ việc chấm dứt hoặc làm mất hiệu lực/chức năng. Cách dịch này diễn đạt sự chấm dứt trong tương lai mà không nhất thiết khẳng định sự hủy diệt vật chất.
- source_word: ταύτην καὶ ταῦτα
  choice: cả dạ dày lẫn thức ăn
  rationale: Lặp lại các danh từ quy chiếu giúp câu tiếng Việt rõ ràng, tương ứng với đại từ giống cái số ít chỉ dạ dày và đại từ trung tính số nhiều chỉ các thức ăn.
- source_word: τὸ σῶμα
  choice: thân thể
  rationale: Đây là cách dịch tự nhiên, trang trọng cho thân thể cụ thể của con người, đồng thời giữ được sức nặng thần học trong lập luận của Phao-lô.
- source_word: πορνείᾳ
  choice: sự vô luân về tình dục
  rationale: Cụm từ hiện đại và đủ rộng để chuyển tải loại hành vi tình dục trái đạo đức được πορνεία chỉ đến, không thu hẹp vào riêng ngoại tình hay quan hệ trước hôn nhân.
- source_word: κυρίῳ / κύριος
  choice: Chúa
  rationale: Giữ danh xưng quen thuộc và sức nặng Cơ Đốc học của κύριος; trong ngữ cảnh này từ ấy chỉ về Chúa Giê-su.
- source_word: δὲ
  choice: nhưng / còn
  rationale: “Nhưng” nêu sự tương phản trong mệnh đề về hành động tương lai của Đức Chúa Trời; “còn” mở phần đối chiếu về thân thể một cách tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Mệnh đề mở đầu là khẩu hiệu của người Cô-rinh-tô hay lời trực tiếp của Phao-lô
  choice: Trình bày không có dấu ngoặc kép hay công thức dẫn nhập, đồng thời dùng dấu gạch ngang để thể hiện bước chuyển tương phản.
  alternative: Đặt mệnh đề trong ngoặc kép như một khẩu hiệu, hoặc thêm “anh em nói rằng”.
  rationale: Bản Hy Lạp không đánh dấu lời trích dẫn. Cách trình bày này giữ nguyên khả năng đó là khẩu hiệu được Phao-lô nhắc lại mà không biến một cách giải thích thành nội dung hiển ngôn.
- issue: Ý nghĩa của καταργήσει đối với dạ dày và thức ăn
  choice: 'Diễn đạt sự chấm dứt: “sẽ làm cho ... không còn nữa”.'
  alternative: “sẽ hủy diệt cả hai” hoặc “sẽ bãi bỏ cả hai”.
  rationale: Cách chọn giữ trọng tâm rằng mối quan hệ giữa thức ăn và dạ dày chỉ là tạm thời, nhưng không quyết định động từ phải mang nghĩa hủy diệt vật chất.
- issue: Sức nghĩa của câu “Chúa dành cho thân thể”
  choice: Giữ nguyên cấu trúc đối ứng ngắn gọn.
  alternative: Mở rộng thành “Chúa chăm sóc thân thể” hoặc “Chúa vì lợi ích của thân thể”.
  rationale: Nguyên văn cô đọng và song song với “thân thể ... dành cho Chúa”. Việc giải thích cụ thể hơn sẽ thu hẹp quan hệ thần học mà câu Hy Lạp để ngỏ.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Cấu trúc đối ứng của nguyên văn được giữ lại; thuật ngữ về đạo đức tình dục được diễn đạt đủ rộng và không cổ hóa. Không dùng dấu ngoặc kép cho mệnh đề đầu nhằm bảo toàn tính mơ hồ của nguyên văn.
