revisions:
- from: 'Hay anh chị em không biết rằng người kết hợp với gái mại dâm thì trở nên một thân thể với người ấy sao? Vì, như lời chép rằng[a]: “Hai người sẽ trở nên một thịt.”'
  to: 'Hay anh chị em không biết rằng người kết hợp với gái mại dâm là một thân thể với cô ấy sao? Vì có lời chép rằng[a]: “Hai người sẽ trở nên một thịt.”'
  rationale: Sửa «trở nên» thành «là» để phản ánh chính xác ἐστιν, và chỉnh công thức dẫn trích cho tự nhiên. Chú thích vẫn bảo tồn sự mơ hồ của chủ thể φησίν và xác định nguồn trích dẫn, không áp đặt một cách hiểu giáo lý.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T18:11:06Z'
review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng lập luận và trích dẫn Sáng Thế Ký, nhưng «trở nên một thân thể» làm động từ hiện tại ἐστιν (“là”) thành một quá trình/kết quả. Cần giữ «là một thân thể»; ý kết hợp đã được diễn tả bởi phân từ κολλώμενος và câu trích tiếp theo.
  naturalness: «Vì, như lời chép rằng» không tự nhiên vì chồng hai công thức dẫn trích và dấu phẩy sau «Vì» không cần thiết. «Vì có lời chép:» là văn phong Kinh Thánh hiện đại, tự nhiên, đồng thời không xác định quá mức chủ thể của φησίν.
  terminology: «Gái mại dâm» phản ánh chính xác πόρνη; «một thân thể» và «một thịt» giữ được sự phân biệt từ vựng có chủ ý giữa σῶμα và σάρξ. Dùng «cô ấy» ở lần quy chiếu sau tự nhiên và rõ ràng trong tiếng Việt.
  issues:
  - severity: medium
    issue: Thì của ἓν σῶμά ἐστιν bị chuyển từ hiện tại sang diễn tiến/kết quả.
    rationale: Hy Lạp nói người kết hợp «là một thân thể», không dùng động từ “trở nên” ở mệnh đề này. «Sẽ trở nên» thuộc riêng lời trích Ἔσονται ... εἰς σάρκα μίαν.
  - severity: low
    issue: Công thức dẫn trích «Vì, như lời chép rằng» gượng và lặp chức năng.
    rationale: φησίν nghĩa là “nói”; cách «có lời chép» là tương đương chức năng tự nhiên trong ngữ cảnh trích dẫn, và chú thích có thể nêu dạng Hy Lạp sát hơn mà không gán chủ thể.
  revised_text: 'Hay anh chị em không biết rằng người kết hợp với gái mại dâm là một thân thể với cô ấy sao? Vì có lời chép rằng[a]: “Hai người sẽ trở nên một thịt.”'
