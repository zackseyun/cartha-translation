id: 1CO.6.16
reference: 1 Corinthians 6:16
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸀ἢ οὐκ οἴδατε ὅτι ὁ κολλώμενος τῇ πόρνῃ ἓν σῶμά ἐστιν; Ἔσονται γάρ, φησίν, οἱ δύο εἰς σάρκα μίαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/016.yaml
  text: Or do you not know that the one who joins himself to a prostitute is one body with her? For[a], as he says[b], “The two will become one flesh.”
translation:
  language: vi
  text: 'Hay anh chị em không biết rằng người kết hợp với gái mại dâm là một thân thể với cô ấy sao? Vì có lời chép rằng[a]: “Hai người sẽ trở nên một thịt.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hy Lạp: “vì người ấy nói”; đây là lời trích từ Sáng Thế Ký 2:24.'
    reason: cross_reference_and_lexical_alternative
lexical_decisions:
- source_word: ἢ
  choice: Hay
  rationale: Nối tiếp lập luận bằng một câu hỏi tu từ, tự nhiên trong tiếng Việt và giữ được sắc thái lựa chọn/tiếp diễn của ἢ.
- source_word: οὐκ οἴδατε
  choice: anh chị em không biết ... sao?
  rationale: Giữ công thức câu hỏi tu từ quen thuộc của Phao-lô; thêm đại từ xưng hô số nhiều theo chủ thể hàm ẩn của động từ.
- source_word: ὁ κολλώμενος
  choice: người kết hợp
  rationale: κολλάομαι có nghĩa gắn bó, kết hợp hay liên hiệp; trong ngữ cảnh quan hệ tình dục, “kết hợp” rõ nghĩa mà không thêm sắc thái hôn nhân.
- source_word: τῇ πόρνῃ
  choice: với gái mại dâm
  rationale: πόρνη chỉ cụ thể một phụ nữ hành nghề mại dâm; mạo từ được hiểu theo nghĩa loại, phù hợp với cách diễn đạt không xác định trong tiếng Việt.
- source_word: ἓν σῶμά ἐστιν
  choice: trở nên một thân thể với người ấy
  rationale: Diễn đạt kết quả của sự kết hợp và làm rõ quan hệ vốn hàm ẩn trong tiếng Hy Lạp; “người ấy” tránh cách gọi thiếu trang trọng.
- source_word: Ἔσονται γάρ
  choice: Vì ... sẽ trở nên
  rationale: γάρ nêu căn cứ cho mệnh đề trước; động từ tương lai εἰμί đi với εἰς trong lời trích dẫn mang nghĩa trở thành.
- source_word: φησίν
  choice: như lời chép rằng
  rationale: φησίν nguyên văn là “ngài/người ấy phán/nói”; do chủ thể không được nêu rõ, cách dịch này tự nhiên trong tiếng Việt và nhận diện đây là lời Kinh Thánh mà không quyết định chủ thể là Đức Chúa Trời hay chính bản văn.
- source_word: οἱ δύο
  choice: Hai người
  rationale: Phản ánh trực tiếp “hai [người]” trong lời trích dẫn và tự nhiên hơn “cả hai” khi đứng độc lập.
- source_word: εἰς σάρκα μίαν
  choice: một thịt
  rationale: Giữ thuật ngữ truyền thống và sự liên kết từ vựng với Sáng Thế Ký 2:24; ở đây σάρξ chỉ sự hiệp nhất thể lý và quan hệ, không mang nghĩa “bản tính tội lỗi”.
theological_decisions:
- issue: Hàm ý của lời trích Sáng Thế Ký đối với quan hệ tình dục ngoài hôn nhân
  choice: Dịch thẳng lời trích như cơ sở cho khẳng định rằng quan hệ với gái mại dâm tạo nên sự hiệp nhất “một thân thể/một thịt”.
  alternative: Giới hạn lời trích chỉ cho hôn nhân, hoặc thêm vào bản dịch các kết luận đạo đức và giáo lý không được câu này nói rõ.
  rationale: Phao-lô áp dụng Sáng Thế Ký 2:24 theo phép tương ứng vào việc quan hệ với gái mại dâm. Bản dịch phải giữ sức nặng thần học ấy nhưng không mở rộng thành một tuyên bố đầy đủ về hôn nhân.
- issue: Chủ thể không được nêu của φησίν
  choice: Dùng “như lời chép rằng” và ghi nguồn trích dẫn trong chú thích.
  alternative: Dịch sát “vì ngài nói” hoặc diễn giải “như Kinh Thánh nói”.
  rationale: Tiếng Hy Lạp có động từ ngôi thứ ba số ít nhưng không nêu chủ thể. Cách dịch chính giữ chức năng dẫn nhập lời trích mà không áp đặt việc chủ thể là Đức Chúa Trời, Kinh Thánh hay tác giả Sáng Thế Ký.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Anh chị em” thể hiện chủ thể số nhiều hàm ẩn mà không dùng đại từ thuần nam giới. “Gái mại dâm” là cách gọi thông dụng, chính xác; “một thịt” được giữ để bảo toàn hình ảnh Kinh Thánh và mối liên hệ với Sáng Thế Ký.
