id: 1CO.6.14
reference: 1 Corinthians 6:14
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ δὲ θεὸς καὶ τὸν κύριον ἤγειρεν καὶ ἡμᾶς ἐξεγερεῖ διὰ τῆς δυνάμεως αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/014.yaml
  text: And God raised the Lord and will also raise us by his power.
translation:
  language: vi
  text: Đức Chúa Trời đã khiến Chúa sống lại, và Ngài cũng sẽ khiến chúng ta sống lại bởi quyền năng của Ngài.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: và
  rationale: Ở đây δέ là từ nối nhẹ, tiếp tục lập luận chứ không biểu thị sự tương phản mạnh; “và” tạo mạch văn tự nhiên trong tiếng Việt.
- source_word: θεὸς
  choice: Đức Chúa Trời
  rationale: Cách gọi trang trọng, quen thuộc và rõ nghĩa trong tiếng Việt dành cho θεός; Ngài là chủ thể thực hiện việc làm cho sống lại.
- source_word: τὸν κύριον
  choice: Chúa
  rationale: Giữ tước hiệu Cơ Đốc học κύριος, trong ngữ cảnh này chỉ về Chúa Giê-su; tiếng Việt không cần mạo từ tương ứng với τόν.
- source_word: ἤγειρεν
  choice: đã khiến ... sống lại
  rationale: Diễn đạt rõ hành động trong quá khứ của Đức Chúa Trời khi làm Chúa sống lại từ cõi chết, đồng thời tự nhiên hơn lối dịch sát hình thức “đã vực dậy” trong ngữ cảnh này.
- source_word: ἡμᾶς
  choice: chúng ta
  rationale: Đại từ ngôi thứ nhất số nhiều mang tính bao gồm, chỉ Phao-lô cùng các tín hữu.
- source_word: ἐξεγερεῖ
  choice: sẽ khiến ... sống lại
  rationale: Giữ thì tương lai và sự song song với ἤγειρεν; tiền tố ἐξ- không đòi hỏi một cách diễn đạt khác biệt trong tiếng Việt ở đây.
- source_word: διὰ τῆς δυνάμεως αὐτοῦ
  choice: bởi quyền năng của Ngài
  rationale: διά với sở hữu cách diễn tả phương tiện; “bởi quyền năng của Ngài” vừa tự nhiên vừa cho thấy quyền năng Đức Chúa Trời là phương tiện của sự sống lại.
theological_decisions:
- issue: Ý nghĩa của mệnh đề nói về việc sống lại trong tương lai
  choice: Giữ cách diễn đạt chỉ sự sống lại thực sự của các tín hữu trong tương lai
  alternative: Sự minh oan nói chung bởi Đức Chúa Trời hoặc việc được nâng dậy theo nghĩa thuộc linh
  rationale: Ngữ cảnh gần nói về thân thể (1 Cô-rinh-tô 6:13–20), và sự song song với việc Đức Chúa Trời làm Chúa sống lại ủng hộ mạnh mẽ ý nghĩa phục sinh trong tương lai. Bản dịch không thêm từ “thân thể,” vì nguyên văn không nêu trực tiếp tại câu này.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Trời” và đại từ tôn kính “Ngài”; lặp “khiến ... sống lại” để giữ thế song song có chủ ý của hai động từ phục sinh trong nguyên văn.
source_grounding:
  english_pob_role: consult_only
