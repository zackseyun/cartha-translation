revisions:
- from: Hãy tránh xa sự gian dâm. Mọi tội một người có thể phạm đều ở ngoài thân thể[a], nhưng người gian dâm phạm tội nghịch với chính thân thể mình.
  to: Hãy tránh xa sự gian dâm. Mọi tội một người có thể phạm đều ở ngoài thân thể[a], nhưng người phạm sự gian dâm thì phạm tội đối với chính thân thể mình.
  rationale: Chỉ điều chỉnh hai chỗ để tiếng Việt hiện đại tự nhiên hơn và để phản ánh rõ hơn lực hành động của phân từ Hy Lạp. Giữ nguyên thuật ngữ chủ đạo, cấu trúc đối lập, tính khái quát của «một người», và chú thích tại đúng mỏ neo.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T18:11:09Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch giữ đúng cấu trúc và các nét nghĩa chính của Hy Lạp: mệnh lệnh số nhiều φεύγετε, tính khái quát của πᾶν ἁμάρτημα và ἄνθρωπος, thế đối lập «ở ngoài thân thể», cùng sự nhấn mạnh «chính thân thể mình». Cách dịch không giải quyết thay cho nguyên văn mệnh đề khó «mọi tội ... ở ngoài thân thể».'
  naturalness: «Hãy tránh xa» là tự nhiên và truyền đạt tốt sắc thái khẩn thiết của φεύγετε. Tuy nhiên, «phạm tội nghịch với chính thân thể mình» không phải là cách kết hợp tự nhiên, thông dụng trong tiếng Việt hiện đại. «Phạm tội đối với chính thân thể mình» diễn đạt rõ hướng quy chiếu của εἰς mà không diễn giải thêm.
  terminology: «Sự gian dâm» được dùng nhất quán cho πορνεία và, trong văn phong Kinh Thánh tiếng Việt, có thể giữ phạm vi rộng của từ này hơn là chỉ một quan hệ cụ thể. Để làm rõ phân từ ὁ πορνεύων là người thực hiện hành vi, «người phạm sự gian dâm» chính xác hơn «người gian dâm», vốn có thể thiên về một nhãn gọi con người. «Thân thể» là lựa chọn phù hợp và nhất quán.
  issues:
  - severity: low
    issue: Cụm «phạm tội nghịch với chính thân thể mình» không tự nhiên trong tiếng Việt hiện đại.
    rationale: «Nghịch với» ở đây có sắc thái cổ hoặc gượng. «Phạm tội đối với chính thân thể mình» giữ sự hướng đến thân thể trong εἰς τὸ ἴδιον σῶμα mà không áp đặt một lời giải thích về bản chất của tội lỗi.
  - severity: low
    issue: «Người gian dâm» có thể ít rõ tính hành động của phân từ hiện tại ὁ πορνεύων.
    rationale: «Người phạm sự gian dâm» liên kết minh thị với πορνεία ở đầu câu và phản ánh người đang thực hiện hành vi, không chỉ là một định danh.
