id: 1CO.6.18
reference: 1 Corinthians 6:18
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: φεύγετε τὴν πορνείαν· πᾶν ἁμάρτημα ὃ ἐὰν ποιήσῃ ἄνθρωπος ἐκτὸς τοῦ σώματός ἐστιν, ὁ δὲ πορνεύων εἰς τὸ ἴδιον σῶμα ἁμαρτάνει.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/018.yaml
  text: Flee sexual immorality. Every sin that a person may commit is outside the body[a], but the one who commits sexual immorality sins against his own body.
translation:
  language: vi
  text: Hãy tránh xa sự gian dâm. Mọi tội một người có thể phạm đều ở ngoài thân thể[a], nhưng người phạm sự gian dâm thì phạm tội đối với chính thân thể mình.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “tách biệt với thân thể.” Câu này trong nguyên văn có ý nghĩa đang được tranh luận; bản dịch giữ nguyên cách diễn đạt trực tiếp của Hy Lạp.'
    reason: Bảo tồn một khả năng diễn đạt từ vựng và báo cho độc giả biết mệnh đề khó hiểu mà không quyết định thay cho nguyên văn.
lexical_decisions:
- source_word: φεύγετε
  choice: Hãy tránh xa
  rationale: Mệnh lệnh hiện tại số nhiều diễn tả lời kêu gọi mạnh mẽ và có tính liên tục; “hãy tránh xa” tự nhiên trong tiếng Việt và giữ ý chủ động lánh khỏi.
- source_word: πορνείαν
  choice: sự gian dâm
  rationale: πορνεία chỉ rộng đến hành vi tình dục trái phép hoặc vô luân; “sự gian dâm” là cách diễn đạt Kinh Thánh trang trọng, tương đối bao quát và dễ hiểu.
- source_word: πᾶν ἁμάρτημα
  choice: Mọi tội
  rationale: Giữ tính khái quát, bao quát của πᾶν và diễn đạt gọn, tự nhiên.
- source_word: ὃ ἐὰν ποιήσῃ ἄνθρωπος
  choice: một người có thể phạm
  rationale: ἄνθρωπος ở đây có nghĩa đại diện, chỉ con người nói chung; tiếng Việt “một người” truyền đạt tự nhiên nghĩa khái quát, còn “có thể phạm” phản ánh sắc thái bất định của ἐὰν với lối giả định.
- source_word: ἐκτὸς τοῦ σώματός ἐστιν
  choice: đều ở ngoài thân thể
  rationale: Giữ nguyên hình ảnh không gian và sự tương phản khó giải thích trong nguyên văn, không tự ý làm nhẹ hay hài hòa hóa.
- source_word: ὁ δὲ πορνεύων
  choice: nhưng người gian dâm
  rationale: Danh hóa phân từ hiện tại chỉ người thực hiện hành vi; cách dịch này ngắn gọn và nối rõ với “sự gian dâm” ở đầu câu.
- source_word: εἰς τὸ ἴδιον σῶμα ἁμαρτάνει
  choice: phạm tội nghịch với chính thân thể mình
  rationale: “Nghịch với” truyền đạt hướng tác động của εἰς trong ngữ cảnh, còn “chính… mình” giữ sự nhấn mạnh phản thân của ἴδιον.
theological_decisions:
- issue: Ý nghĩa đại diện của ἄνθρωπος
  choice: một người
  alternative: một người nam; con người
  rationale: Danh từ số ít giống đực mang nghĩa khái quát chứ không giới hạn giới tính. “Một người” là tiếng Việt hiện đại, tự nhiên và không làm mất nghĩa đại diện.
- issue: Mệnh đề “mọi tội… đều ở ngoài thân thể”
  choice: Dịch trực tiếp và giữ nguyên sự căng thẳng trong câu
  alternative: Xem đây là khẩu hiệu được trích dẫn hoặc thêm lời giải thích để giới hạn tính tuyệt đối
  rationale: Nguyên văn trình bày mệnh đề trực tiếp; bản dịch không nên áp đặt cách giải kinh đang còn tranh luận hay tự ý hài hòa hóa.
- issue: Phạm vi nghĩa của πορνεία
  choice: sự gian dâm
  alternative: sự vô luân về tình dục; tội tình dục
  rationale: Cụm được chọn giữ sắc thái đạo đức nghiêm trang và có thể chỉ hành vi tình dục bất chính nói chung, không thu hẹp câu vào một loại quan hệ duy nhất.
translation_notes:
  register: Văn phong hiện đại, trang trọng và trực tiếp. Dùng “thân thể” thay vì “thân xác” để tránh hàm ý hạ thấp thân thể; lặp lại từ ngữ then chốt nhằm giữ cấu trúc đối lập của câu Hy Lạp.
