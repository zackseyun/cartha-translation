id: 1CO.6.15
reference: 1 Corinthians 6:15
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οὐκ οἴδατε ὅτι τὰ σώματα ὑμῶν μέλη Χριστοῦ ἐστιν; ἄρας οὖν τὰ μέλη τοῦ Χριστοῦ ποιήσω πόρνης μέλη; μὴ γένοιτο.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/015.yaml
  text: Do you not know that your bodies are members of Messiah? Shall I then take the members of Messiah and make them members of a prostitute? May it never be[a][b].
translation:
  language: vi
  text: Anh chị em không biết rằng thân thể của anh chị em đều là những chi thể của Đấng Mê-si[a] sao? Vậy, lẽ nào tôi lấy các chi thể của Đấng Mê-si mà làm chúng thành những chi thể của một gái mại dâm? Tuyệt đối không![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “Đấng Christ” hoặc “Đức Kitô.” Tước hiệu Hy Lạp Χριστός có thể được hiểu theo nghĩa đã dịch là “Đấng Mê-si,” hoặc được dùng gần như một tên gọi.'
    reason: alternative_reading
  - marker: b
    text: 'Cũng có thể dịch: “Không thể nào!” Cụm từ Hy Lạp μὴ γένοιτο là lời bác bỏ hết sức mạnh mẽ; sát hình thức hơn là: “Mong đừng bao giờ có chuyện ấy!”'
    reason: lexical_alternative
lexical_decisions:
- source_word: σώματα
  choice: thân thể
  rationale: Chỉ chính thân thể hữu hình của các tín hữu trong lập luận về sự gian dâm. Tiếng Việt thường không cần đánh dấu số nhiều trên danh từ; từ “đều” giúp thể hiện số nhiều của nguyên ngữ một cách tự nhiên.
- source_word: μέλη
  choice: chi thể
  rationale: Giữ hình ảnh các bộ phận thuộc về một thân thể lớn hơn và phù hợp với cách dùng thần học của Phao-lô; “bộ phận” kém trang trọng và làm yếu phép ẩn dụ.
- source_word: Χριστοῦ
  choice: của Đấng Mê-si
  rationale: Ở đây Χριστός chỉ Đấng được xức dầu mà các tín hữu thuộc về. “Đấng Mê-si” chuyển tải ý nghĩa tước hiệu, còn dạng quen dùng “Đấng Christ/Đức Kitô” được ghi ở chú thích để bảo tồn khả năng hiểu như tên gọi.
- source_word: ἄρας
  choice: lấy
  rationale: 'Diễn đạt tự nhiên hành động được nêu ra trong câu hỏi tu từ: lấy các chi thể của Đấng Mê-si để đưa vào một sự kết hợp khác.'
- source_word: ποιήσω
  choice: làm thành
  rationale: Theo sát nghĩa gây nên hoặc biến thành, đồng thời giữ sức gây sốc của câu hỏi tu từ.
- source_word: πόρνης
  choice: của một gái mại dâm
  rationale: πόρνη ở đây chỉ cụ thể một phụ nữ hành nghề mại dâm, chứ không chỉ một người gian dâm nói chung.
- source_word: μὴ γένοιτο
  choice: Tuyệt đối không!
  rationale: Một lời bác bỏ mạnh mẽ. Cách nói này tự nhiên trong tiếng Việt hiện đại và giữ được cường độ tu từ, dù không tái tạo nguyên dạng cầu khiến của lối nói Hy Lạp.
- source_word: οὐκ οἴδατε
  choice: Anh chị em không biết ... sao?
  rationale: Giữ nguyên câu hỏi tu từ, qua đó Phao-lô nhắc đến điều người nghe đáng lẽ đã biết.
theological_decisions:
- issue: Cách dịch Χριστός trong lời khẳng định thân thể tín hữu là chi thể của Ngài
  choice: Đấng Mê-si
  alternative: Đấng Christ; Đức Kitô
  rationale: Bản chính giữ nghĩa tước hiệu “Đấng được xức dầu” mà không giải thích thêm bản chất của sự hiệp nhất. Chú thích bảo tồn cách đọc quen thuộc khi Χριστός hoạt động gần như một tên riêng.
- issue: Mức độ mạnh của μὴ γένοιτο
  choice: Tuyệt đối không!
  alternative: Không thể nào!; Mong đừng bao giờ có chuyện ấy!
  rationale: Cụm từ là lời dứt khoát bác bỏ một hệ luận đáng ghê sợ, chứ không phải lời phủ định trung tính. Bản dịch giữ sức mạnh ấy mà không thêm nội dung giáo lý.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Anh chị em” biểu đạt ngôi thứ hai số nhiều theo lối bao quát; “chi thể” được giữ vì là thuật ngữ tự nhiên nhất để bảo toàn hình ảnh thân thể của Phao-lô. Câu hỏi thứ hai dùng “lẽ nào” để thể hiện sức nặng phản vấn của οὖν mà không biến câu thành một lời khẳng định.
