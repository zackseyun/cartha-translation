  source_fidelity: 'Bản dịch truyền đạt đúng các yếu tố chính của câu Hy Lạp: câu hỏi tu từ οὐκ οἴδατε, số nhiều σώματα, hình ảnh μέλη, tước hiệu Χριστός là “Đấng Mê-si,” đối tượng cụ thể πόρνη, và lời phủ định quyết liệt μὴ γένοιτο. Tuy nhiên, “làm thành các chi thể” không biểu đạt rõ cấu trúc ποιήσω ... μέλη (“làm ... thành những chi thể”) và có thể bị hiểu là “tạo ra các chi thể.”'
  naturalness: Câu đầu và câu kết tự nhiên, phù hợp văn phong hiện đại trang trọng. Câu thứ hai cần đảo lại thành “làm ... thành những chi thể” để tiếng Việt rõ nghĩa và mạch lạc hơn, đồng thời giữ nguyên sức mạnh phản vấn.
  terminology: “Thân thể,” “chi thể,” “Đấng Mê-si,” và “gái mại dâm” phù hợp với nguyên ngữ và nhất quán với định hướng thuật ngữ. Chú thích về Χριστός và μὴ γένοιτο hữu ích, không áp đặt diễn giải giáo phái.
  issues:
