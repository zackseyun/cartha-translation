  source_fidelity: 'Bản dịch lần lượt phản ánh đầy đủ năm hạng người trong bản Hy Lạp: κλέπται (kẻ trộm cắp), πλεονέκται (kẻ tham lam), μέθυσοι (kẻ say sưa), λοίδοροι (kẻ lăng mạ), và ἅρπαγες (kẻ cướp đoạt). Cụm “đều sẽ không được thừa hưởng” diễn đạt đúng phủ định οὔτε…οὔτε… βασιλείαν θεοῦ κληρονομήσουσιν và bảo toàn hình ảnh “thừa hưởng”. Không thêm điều kiện thần học như “không ăn năn” vào chính văn.'
