  terminology: “Vương quốc của Đức Chúa Trời” và “thừa hưởng” nhất quán với sắc thái trang trọng, cánh chung và gia nghiệp của nguyên ngữ. “Kẻ lăng mạ” truyền đạt λοίδοροι rộng hơn “kẻ vu khống”. Chú thích a nêu các khả năng “kẻ tống tiền” và “kẻ bóc lột” hữu ích; chú thích b làm sáng tỏ mà không thay thế hình ảnh thừa hưởng trong chính văn.
