id: 1CO.6.10
reference: 1 Corinthians 6:10
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οὔτε ⸂κλέπται οὔτε πλεονέκται⸃, ⸀οὐ μέθυσοι, οὐ λοίδοροι, οὐχ ἅρπαγες βασιλείαν ⸀θεοῦ κληρονομήσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/010.yaml
  text: nor thieves[a], nor the greedy, nor drunkards, nor revilers[c][b], nor swindlers will inherit the kingdom of God.
translation:
  language: vi
  text: kẻ trộm cắp, kẻ tham lam, kẻ say sưa, kẻ lăng mạ, kẻ cướp đoạt[a] đều sẽ không được thừa hưởng vương quốc của Đức Chúa Trời.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “kẻ tống tiền” hoặc “kẻ bóc lột”.
    reason: lexical_alternative
  - marker: b
    text: Nghĩa là họ sẽ không được nhận phần trong vương quốc của Đức Chúa Trời.
    reason: clarification
lexical_decisions:
- source_word: κλέπται
  choice: kẻ trộm cắp
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt, chỉ những người có hành vi lấy trộm tài sản; phù hợp với danh sách các hạng người.
- source_word: πλεονέκται
  choice: kẻ tham lam
  rationale: Diễn đạt rõ người bị đặc trưng bởi lòng ham muốn có thêm, nhất là của cải, mà không dùng từ cổ hoặc quá chuyên biệt.
- source_word: μέθυσοι
  choice: kẻ say sưa
  rationale: Chỉ người có nếp sống nghiện ngập hoặc thường xuyên say rượu, thay vì bất cứ ai từng có một lần say.
- source_word: λοίδοροι
  choice: kẻ lăng mạ
  rationale: Bao quát lời nói sỉ nhục, chửi rủa hoặc nhục mạ; không thu hẹp nghĩa vào việc vu khống.
- source_word: ἅρπαγες
  choice: kẻ cướp đoạt
  rationale: Giữ sắc thái chiếm lấy bằng bạo lực, áp chế hoặc bóc lột; rộng hơn hành vi trộm cắp và gần với sức mạnh của từ Hy Lạp.
- source_word: βασιλείαν θεοῦ
  choice: vương quốc của Đức Chúa Trời
  rationale: Cách dịch quen thuộc, trang trọng, bảo toàn hình ảnh về quyền trị vì và cõi cai trị của Đức Chúa Trời.
- source_word: κληρονομήσουσιν
  choice: sẽ không được thừa hưởng
  rationale: Bảo toàn hình ảnh nhận phần gia nghiệp trong động từ Hy Lạp, đồng thời tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Sức nặng của danh sách thói xấu và ngôn ngữ thừa hưởng
  choice: Giữ nguyên các danh từ chỉ hạng người và không thêm cụm giải thích như “không ăn năn” vào chính văn.
  alternative: Diễn đạt thành những người làm các việc này, hoặc nói rõ đây là nếp sống không ăn năn.
  rationale: Các danh từ số nhiều trong danh sách tự nhiên nói đến những người được đặc trưng bởi các thói xấu ấy, nhưng bản văn không trực tiếp nêu điều kiện “không ăn năn”; vì vậy không nên giải quyết căng thẳng thần học bằng cách thêm từ.
- issue: Ý nghĩa của việc thừa hưởng vương quốc
  choice: Giữ hình ảnh “thừa hưởng vương quốc của Đức Chúa Trời”.
  alternative: Diễn giải là “được nhận một phần trong vương quốc của Đức Chúa Trời”.
  rationale: Cách dịch trực tiếp bảo toàn ẩn dụ gia nghiệp và sắc thái cánh chung của câu, còn chú thích giúp độc giả hiểu ý mà không thay thế hình ảnh nguyên bản.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Lặp “kẻ” để giữ nhịp của danh sách và cho thấy đây là các hạng người được mô tả bằng những thói xấu. Câu này tiếp nối cấu trúc “không phải… cũng không phải…” từ câu trước, nên không thêm một liên từ mở đầu vốn sẽ thiếu tự nhiên khi trích riêng.
