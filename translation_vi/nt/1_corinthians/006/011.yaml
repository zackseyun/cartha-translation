id: 1CO.6.11
reference: 1 Corinthians 6:11
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ταῦτά τινες ἦτε· ἀλλὰ ἀπελούσασθε, ἀλλὰ ἡγιάσθητε, ἀλλὰ ἐδικαιώθητε ἐν τῷ ὀνόματι τοῦ κυρίου ⸀Ἰησοῦ καὶ ἐν τῷ πνεύματι τοῦ θεοῦ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/011.yaml
  text: And such were some of you[a]. But you washed yourselves, but you were sanctified[c][b], but you were justified in the name of the Lord Jesus and in the Spirit of our God.
translation:
  language: vi
  text: Trước kia, một số người trong anh chị em cũng là những người như thế. Nhưng anh chị em đã được rửa sạch,[a] nhưng đã được thánh hóa, nhưng đã được xưng công chính trong danh Chúa Giê-su và trong Thánh Linh của Đức Chúa Trời chúng ta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dạng Hy Lạp cũng có thể được hiểu là “anh chị em đã rửa sạch mình.”
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ ταῦτά τινες ἦτε
  choice: Trước kia, một số người trong anh chị em cũng là những người như thế
  rationale: Diễn đạt tự nhiên trong tiếng Việt, đồng thời giữ ý ταῦτα quy chiếu về các hạng người vừa được liệt kê và ἦτε nói đến tình trạng trước đây.
- source_word: ἀλλὰ
  choice: nhưng
  rationale: Lặp lại “nhưng” ba lần để giữ nhịp điệu tương phản mạnh và sự đảo ngược đầy nhấn mạnh trong câu Hy Lạp.
- source_word: ἀπελούσασθε
  choice: anh chị em đã được rửa sạch
  rationale: Dạng trung động có thể mang sắc thái phản thân, nhưng trong chuỗi với hai động từ bị động tiếp theo, cách dịch bị động phù hợp với hành động cứu độ; khả năng phản thân được giữ trong chú thích.
- source_word: ἡγιάσθητε
  choice: đã được thánh hóa
  rationale: Thuật ngữ quen thuộc, chính xác, giữ được mối liên hệ từ vựng với ngôn ngữ về sự thánh khiết của Phao-lô.
- source_word: ἐδικαιώθητε
  choice: đã được xưng công chính
  rationale: Diễn đạt chiều kích tuyên nhận/pháp đình của δικαιόω bằng thuật ngữ thần học tiếng Việt tương đối rõ và thông dụng.
- source_word: ἐν τῷ ὀνόματι
  choice: trong danh
  rationale: Giữ cách nói trang trọng, tự nhiên trong văn Kinh Thánh và bảo tồn độ mở của ἐν về phạm vi, thẩm quyền hoặc phương tiện.
- source_word: τοῦ κυρίου Ἰησοῦ
  choice: Chúa Giê-su
  rationale: Dùng danh xưng “Chúa” và dạng phiên âm tiếng Việt hiện hành “Giê-su”.
- source_word: ἐν τῷ πνεύματι τοῦ θεοῦ ἡμῶν
  choice: trong Thánh Linh của Đức Chúa Trời chúng ta
  rationale: Giữ “trong” để phản ánh ἐν và không thu hẹp vào riêng nghĩa phương tiện; “Thánh Linh” biểu thị đối tượng nhiều khả năng là Thánh Linh của Đức Chúa Trời.
theological_decisions:
- issue: Thể và tác nhân của ἀπελούσασθε
  choice: 'Dịch theo nghĩa bị động: “đã được rửa sạch”'
  alternative: “đã tự rửa sạch” hoặc “đã rửa sạch mình”
  rationale: Hình thái trung động cho phép cách hiểu phản thân, nhưng hai động từ bị động song song và văn cảnh về sự biến đổi cứu độ ủng hộ cách diễn đạt bị động. Chú thích bảo tồn khả năng khác thay vì xóa bỏ căng thẳng.
- issue: Ý nghĩa của ἐν trong hai cụm cuối
  choice: Giữ “trong” ở cả “trong danh” và “trong Thánh Linh”
  alternative: “nhờ danh” và/hoặc “bởi Thánh Linh”
  rationale: Cách dịch này bảo tồn sự song song và độ mơ hồ thật của giới từ Hy Lạp về phạm vi, cơ sở và phương tiện.
- issue: Đối tượng của πνεύματι
  choice: Hiểu là Thánh Linh
  alternative: một phạm vi thuộc linh nói chung
  rationale: Cụm “Thánh Linh của Đức Chúa Trời chúng ta” trong văn mạch Phao-lô tự nhiên nhất là chỉ Thánh Linh, nhưng bản dịch không thêm danh hiệu “Đức Thánh Linh” vốn không xuất hiện nguyên dạng tại đây.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” cho ngôi thứ hai số nhiều nhằm nói trực tiếp với toàn thể cộng đồng. Giữ ba lần “nhưng” dù hơi nhấn mạnh hơn văn xuôi thông thường để bảo tồn phép lặp tu từ của nguyên văn.
