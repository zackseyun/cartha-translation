translation:
  language: vi
  text: Nhưng người gắn bó với Chúa[a] thì là một tâm linh với Ngài[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “được gắn kết với Chúa.” Dạng động từ Hy Lạp có thể được hiểu theo nghĩa chủ động phản thân (“gắn bó với”) hoặc theo nghĩa gần như bị động (“được gắn kết với”).'
    reason: lexical_alternative
  - marker: b
    text: 'Theo sát nguyên văn: “thì là một tâm linh.” Cụm “với Ngài” được ngầm hiểu trong tiếng Hy Lạp và được thêm vào để câu tiếng Việt rõ nghĩa.'
    reason: lexical_alternative
  - marker: c
    text: Một số người hiểu “tâm linh” ở đây là quy chiếu đến Đức Thánh Linh. Tuy nhiên, cụm từ này có lẽ tự nhiên hơn khi nói rằng người tin Chúa được hiệp nhất với Chúa trong một tâm linh. Bản văn Hy Lạp không phân biệt chữ hoa và chữ thường.
    reason: alternative_reading
lexical_decisions:
- source_word: κολλώμενος (κολλάομαι)
  choice: gắn bó với
  rationale: Động từ chỉ sự gắn kết chặt chẽ. “Gắn bó với” tự nhiên trong tiếng Việt, giữ được sắc thái quan hệ mật thiết và sự đối chiếu với sự kết hợp thân xác ở câu trước mà không hàm ý hòa tan hai bên thành một.
- source_word: τῷ κυρίῳ (κύριος)
  choice: với Chúa
  rationale: Trong văn mạch Phao-lô, κύριος chỉ Chúa Giê-su phục sinh; “Chúa” giữ được sức nặng thần học và là cách gọi tự nhiên trong tiếng Việt.
- source_word: ἓν
  choice: một
  rationale: Giữ nguyên ý nghĩa trực tiếp của từ chỉ số lượng, diễn tả sự hiệp nhất thật sự chứ không chỉ là đồng thuận hay cùng mục đích.
- source_word: πνεῦμα
  choice: tâm linh
  rationale: “Tâm linh” ở dạng chữ thường phù hợp nhất với ý người tin Chúa hiệp nhất với Chúa trong phương diện thuộc linh, đồng thời tránh mặc nhiên đồng nhất người ấy với Đức Thánh Linh.
- source_word: ὁ δὲ ... ἐστιν
  choice: Nhưng người ... thì hiệp làm
  rationale: Cấu trúc mạo từ cộng phân từ được chuyển thành “người...”; “hiệp làm” là lối diễn đạt tiếng Việt tự nhiên cho vị ngữ “là một” trong quan hệ với một bên khác, dù động từ Hy Lạp theo nghĩa đen là “là”.
theological_decisions:
- issue: Bản chất của sự hiệp nhất trong cụm “một tâm linh”
  choice: Diễn tả sự hiệp nhất thuộc linh thật sự giữa người tin Chúa và Chúa, nhưng vẫn duy trì sự phân biệt giữa hai bên.
  alternative: Hiểu là sự đồng nhất mang tính huyền nhiệm mạnh hơn, hoặc chỉ là cùng thái độ và mục đích.
  rationale: Văn mạch đối chiếu sự kết hợp thân xác với gái mại dâm ở câu 16 và sự hiệp nhất với Chúa ở câu 17. “Hiệp làm một tâm linh với Ngài” giữ sức mạnh của ngôn ngữ hiệp nhất nhưng không gợi ý sự hòa tan bản thể.
- issue: Làm rõ đối tượng trong quan hệ “một tâm linh”
  choice: Thêm “với Ngài” để diễn đạt quan hệ vốn được ngầm hiểu trong tiếng Hy Lạp.
  alternative: Dịch sát hơn là “thì là một tâm linh”, không thêm đại từ.
  rationale: Tiếng Hy Lạp có thể để quan hệ này hàm ẩn, nhưng tiếng Việt cần “với Ngài” để câu rõ nghĩa và tự nhiên. Chú thích vẫn bảo lưu hình thức ngắn gọn của nguyên văn.
- issue: Viết hoa hay viết thường πνεῦμα
  choice: Viết “tâm linh” bằng chữ thường.
  alternative: Viết “Thần Linh” và hiểu là quy chiếu trực tiếp đến Đức Thánh Linh.
  rationale: Chữ Hy Lạp cổ không giải quyết vấn đề viết hoa. Trong văn mạch, cụm từ tự nhiên nhất mô tả người tin Chúa hiệp với Chúa thành “một tâm linh”, chứ không đồng nhất người ấy với chính Đức Thánh Linh.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Người” mang nghĩa đại diện, bao gồm bất cứ ai gắn bó với Chúa. Cụm “hiệp làm một” giữ âm hưởng Kinh Thánh nhưng vẫn thông dụng; “tâm linh” phân biệt bình diện thuộc linh với sự kết hợp thân xác được nhắc đến ngay trước đó.
