revisions:
- from: Vì anh chị em đã được mua bằng một giá[a]; vậy, hãy tôn vinh Đức Chúa Trời trong thân thể mình.[b]
  to: Vì anh chị em đã được mua với một giá[a]; vậy thì, hãy tôn vinh Đức Chúa Trời trong thân thể anh chị em.[b]
  rationale: Sửa “bằng một giá” thành “với một giá” để tiếng Việt tự nhiên hơn mà vẫn sát τιμῆς. Dùng “thân thể anh chị em” để làm rõ sở hữu số nhiều với danh từ số ít. Đặt sắc thái của δή vào bản dịch bằng “vậy thì” và chỉnh chú thích b để vừa giải thích tiểu từ này vừa ghi nhận chính xác dị bản phần thêm, không làm thay đổi văn bản SBLGNT.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T18:11:08Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch chuyển tải đúng các yếu tố chính của SBLGNT: γάρ (“Vì”), ἠγοράσθητε τιμῆς (đã được mua với/cho một giá), mệnh lệnh δοξάσατε, và phạm vi cụ thể “trong thân thể anh chị em.” Tuy nhiên, chú thích b gắn vào “thân thể mình” lại nêu một dị bản văn bản không được bản dịch đánh dấu tại vị trí phần thêm, đồng thời bỏ sót chức năng của δή; vì vậy hệ thống chú thích chưa phản ánh đúng văn bản được dịch và các điểm cần minh giải.'
  naturalness: “Được mua bằng một giá” hiểu được, nhưng “được mua với một giá” tự nhiên hơn trong tiếng Việt hiện đại khi nói về giá mua. “Trong thân thể mình” có thể được hiểu là một thân thể chung hoặc phản thân không rõ chủ thể; “trong thân thể anh chị em” rõ ràng, tự nhiên và vẫn giữ số ít phân phối của tiếng Hy Lạp.
  terminology: “Tôn vinh Đức Chúa Trời” là cách dùng trang trọng, phù hợp với δοξάσατε và văn phong Kinh Thánh. “Thân thể” bảo toàn tính cụ thể của σῶμα. Giữ ẩn dụ mua bán, không thay bằng thuật ngữ “cứu chuộc,” là phù hợp.
  issues:
  - severity: medium
    issue: Chú thích b không phù hợp với điểm neo và không giải thích δή.
    rationale: Trong SBLGNT, δή hiện diện sau δοξάσατε và có sắc thái thúc giục/suy kết. Chú thích b hiện lại nói về một phần văn bản dài không có trong bản văn dịch và được neo sau “thân thể mình,” khiến người đọc không biết phần nào của câu có dị bản. Dù có thể ghi nhận dị bản, không nên dùng chú thích này thay cho việc giải thích δή tại điểm neo thích hợp.
  - severity: low
    issue: “bằng một giá” hơi gượng trong ngữ cảnh mua bán.
    rationale: Τιμῆς diễn tả giá phải trả. “Với một giá” là lối nói Việt ngữ tự nhiên hơn và vẫn giữ hình ảnh thương mại cũng như tính không xác định của nguyên văn.
  - severity: low
    issue: “trong thân thể mình” kém rõ về đại từ và số ít phân phối.
    rationale: ἐν τῷ σώματι ὑμῶν dùng danh từ số ít với sở hữu số nhiều. “Trong thân thể anh chị em” diễn đạt rõ đối tượng được gọi, không áp đặt cách hiểu thân thể tập thể hay đổi sang số nhiều.
