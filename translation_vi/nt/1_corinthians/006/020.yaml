  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἠγοράσθητε γὰρ τιμῆς· δοξάσατε δὴ τὸν θεὸν ἐν τῷ σώματι ⸀ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/020.yaml
  text: For you were bought with a price[b][a]; therefore glorify God in your body.
translation:
  language: vi
  text: Vì anh chị em đã được mua với một giá[a]; vậy thì, hãy tôn vinh Đức Chúa Trời trong thân thể anh chị em.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đã được mua cho một giá.” Tiếng Hy Lạp giữ hình ảnh mua bán và giá phải trả.'
    reason: lexical_alternative
  - marker: b
    text: '“Vậy thì” dịch tiểu từ Hy Lạp δή, thêm sắc thái thúc giục cho mệnh lệnh. Một số bản chép về sau thêm: “và trong tâm linh anh chị em, là những điều thuộc về Đức Chúa Trời”; phần thêm này không có trong các bản chép Hy Lạp sớm và đáng tin cậy nhất.'
    reason: lexical_alternative; textual_variant
lexical_decisions:
- source_word: ἠγοράσθητε
  choice: đã được mua
  rationale: Giữ nguyên hình ảnh mua chuộc/thương mại của động từ aorist bị động ἀγοράζω, đồng thời diễn đạt tự nhiên trong tiếng Việt.
- source_word: γὰρ
  choice: Vì
  rationale: Nêu lý do cho lời khuyên ở câu trước và bảo toàn mạch lập luận.
- source_word: τιμῆς
  choice: bằng một giá
  rationale: Diễn đạt giá được trả trong hình ảnh mua bán; cách nói hơi cô đọng nhưng giữ sát cấu trúc và ẩn dụ của nguyên văn.
- source_word: δοξάσατε
  choice: hãy tôn vinh
  rationale: Chuyển tải mệnh lệnh aorist và ý nghĩa dành sự vinh hiển cho Đức Chúa Trời bằng cách nói trang trọng, dễ hiểu.
- source_word: δὴ
  choice: vậy
  rationale: Thể hiện sắc thái suy kết và thúc giục của tiểu từ δή mà không làm câu nặng nề.
- source_word: ἐν τῷ σώματι ὑμῶν
  choice: trong thân thể mình
  rationale: Giữ giới từ ἐν và ý nghĩa cụ thể của σῶμα; “mình” quy chiếu tự nhiên đến từng người trong cộng đồng được gọi bằng số nhiều.
theological_decisions:
- issue: Hình ảnh mua chuộc mang tính thương mại
  choice: Giữ cách nói “đã được mua bằng một giá”
  alternative: đã được cứu chuộc với một cái giá
  rationale: Nguyên văn dùng trực tiếp ngôn ngữ mua bán. Giữ ẩn dụ này tránh đưa thêm thuật ngữ thần học hẹp hơn hoặc xác định điều câu này không nói rõ.
- issue: Đạo đức gắn với thân thể
  choice: Dịch σῶμα cụ thể là “thân thể”
  alternative: con người; đời sống
  rationale: Văn cảnh trực tiếp nói đến hành vi tính dục nơi thân thể; cách dịch cụ thể bảo toàn lập luận của Phao-lô.
- issue: Số ít σῶμα đi với đại từ số nhiều ὑμῶν
  choice: “thân thể mình” theo nghĩa thân thể của mỗi người
  alternative: thân thể của anh chị em; các thân thể của anh chị em
  rationale: Giữ được nét số ít phân phối của nguyên văn và diễn đạt tự nhiên trong tiếng Việt, không biến nó thành một thân thể tập thể.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” để gọi cộng đồng; “Đức Chúa Trời” theo văn phong Kinh Thánh Tin Lành phổ biến. Cấu trúc ngắn gọn giữ lực suy kết và mệnh lệnh của nguyên văn.
