  source_fidelity: 'Bản dịch giữ đúng cấu trúc lập luận và các nét nghĩa chính của Hy Lạp: câu hỏi tu từ mở đầu (ἢ οὐκ οἴδατε), chủ ngữ tập thể οἱ ἅγιοι, thì tương lai của κρινοῦσιν, thế gian là đối tượng xét xử, và sự đối chiếu với những κριτήρια ἐλάχιστα. “Được anh chị em xét xử” là cách diễn đạt ngữ cảnh hợp lý cho ἐν ὑμῖν, đồng thời chú thích đã bảo lưu cách đọc sát chữ “trong/giữa anh chị em.”'
  naturalness: Tiếng Việt hiện đại, rõ ràng và có sắc thái chất vấn phù hợp. “Hay anh chị em không biết rằng... sao?” và “thì anh chị em lại không đủ tư cách... sao?” tự nhiên trong văn phong thư tín trang trọng. “Những vụ việc nhỏ nhất” làm rõ cách hiểu theo ngữ cảnh tranh chấp mà không làm câu văn nặng nề.
  terminology: “Dân thánh” diễn đạt οἱ ἅγιοι phù hợp trong tiếng Việt Cơ Đốc, tránh hàm ý phong thánh cho một nhóm tinh hoa. “Thế gian” và “xét xử” phù hợp với κόσμος và κρίνω trong câu này. Chú thích b thích đáng khi ghi nhận nghĩa thay thế của κριτήρια là “tòa xét xử.”
