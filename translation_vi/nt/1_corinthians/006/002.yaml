id: 1CO.6.2
reference: 1 Corinthians 6:2
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸀ἢ οὐκ οἴδατε ὅτι οἱ ἅγιοι τὸν κόσμον κρινοῦσιν; καὶ εἰ ἐν ὑμῖν κρίνεται ὁ κόσμος, ἀνάξιοί ἐστε κριτηρίων ἐλαχίστων;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/002.yaml
  text: Or do you not know that the saints will judge the world? And if the world is judged by you[b][a], are you unworthy of the smallest courts?
translation:
  language: vi
  text: Hay anh chị em không biết rằng dân thánh sẽ xét xử thế gian sao? Nếu thế gian được anh chị em xét xử[a], thì anh chị em lại không đủ tư cách xét xử những vụ việc nhỏ nhất sao?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch sát hơn: “Nếu thế gian được xét xử giữa anh chị em.” Cụm Hy Lạp có thể mang nghĩa “trong/giữa anh chị em,” nhưng trong ngữ cảnh, ý chính là anh chị em tham dự vào việc xét xử thế gian.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “những tòa xét xử nhỏ nhất” hoặc “những vụ việc ít quan trọng nhất.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἢ
  choice: Hay
  rationale: Mở đầu một câu hỏi tu từ tiếp nối và đẩy mạnh lập luận ở câu trước.
- source_word: οὐκ οἴδατε
  choice: anh chị em không biết… sao?
  rationale: Giữ công thức câu hỏi tu từ quen thuộc của Phao-lô, đồng thời diễn đạt tự nhiên trong tiếng Việt.
- source_word: οἱ ἅγιοι
  choice: dân thánh
  rationale: Chỉ cộng đồng những người thuộc về Đức Chúa Trời, không hàm ý một tầng lớp tín hữu ưu tú hay những người đã được phong thánh.
- source_word: τὸν κόσμον
  choice: thế gian
  rationale: Diễn đạt κόσμος theo nghĩa rộng là thế giới loài người nằm dưới sự phán xét.
- source_word: κρινοῦσιν
  choice: sẽ xét xử
  rationale: Giữ thì tương lai và nghĩa tư pháp/phán xét của động từ κρίνω mà không xác định cụ thể cách dân thánh tham dự.
- source_word: ἐν ὑμῖν
  choice: được anh chị em xét xử
  rationale: Diễn đạt nghĩa công cụ hoặc liên đới phù hợp với mạch lập luận; chú thích giữ cách hiểu sát chữ là “giữa anh chị em”.
- source_word: ἀνάξιοί ἐστε
  choice: không đủ tư cách
  rationale: Trong ngữ cảnh xét xử, cách nói này tự nhiên hơn “không xứng đáng” và truyền đạt ý không thích hợp hoặc không đủ khả năng đảm nhiệm.
- source_word: κριτηρίων ἐλαχίστων
  choice: xét xử những vụ việc nhỏ nhất
  rationale: Hiểu κριτήρια là các vụ việc cần phân xử, phù hợp với ngữ cảnh tranh chấp; vẫn ghi nhận nghĩa “tòa xét xử” trong chú thích.
theological_decisions:
- issue: Danh tính của οἱ ἅγιοι
  choice: toàn thể dân thánh, tức cộng đồng những người thuộc về Đức Chúa Trời
  alternative: một nhóm hẹp gồm những tín hữu đặc biệt thánh thiện
  rationale: Trong cách dùng thông thường của Phao-lô, từ này chỉ các tín hữu nói chung chứ không phải một tầng lớp ưu tú.
- issue: Dân thánh xét xử thế gian
  choice: dân thánh thật sự tham dự vào sự xét xử trong tương lai, nhưng bản văn không nói rõ phương thức
  alternative: chỉ là sự đánh giá đạo đức mang tính ẩn dụ, hoặc là quyền xét xử hoàn toàn độc lập
  rationale: Bản văn khẳng định sự tham dự nhưng không giải thích cơ chế hay mức độ thẩm quyền; bản dịch không thêm chi tiết thần học ngoài câu chữ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” cho đại từ số nhiều ὑμεῖς; dùng “dân thánh” thay cho thuật ngữ dễ gây hiểu lầm về việc phong thánh. Câu hỏi tu từ và sắc thái khiển trách của Phao-lô được giữ nguyên.
