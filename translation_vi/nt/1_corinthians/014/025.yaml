id: 1CO.14.25
reference: 1 Corinthians 14:25
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸀τὰ κρυπτὰ τῆς καρδίας αὐτοῦ φανερὰ γίνεται, καὶ οὕτως πεσὼν ἐπὶ πρόσωπον προσκυνήσει τῷ θεῷ, ἀπαγγέλλων ὅτι ⸂Ὄντως ὁ θεὸς⸃ ἐν ὑμῖν ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/025.yaml
  text: the secrets of his heart become evident[a], and so, falling on his face, he will worship God, declaring that God truly is among you.
translation:
  language: vi
  text: 'những điều kín giấu trong lòng người ấy trở nên rõ ràng, và như thế, người ấy sẽ ngã sấp mặt xuống và thờ phượng Đức Chúa Trời, tuyên bố rằng: “Đức Chúa Trời thật sự ở giữa anh chị em[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Đức Chúa Trời thật sự ở trong anh chị em.”'
    reason: Giữ nghĩa thay thế khả dĩ của ἐν ὑμῖν.
lexical_decisions:
- source_word: τὰ κρυπτὰ
  choice: những điều kín giấu
  rationale: Cụm tính từ trung tính số nhiều được dùng như danh từ, chỉ những điều ẩn kín bên trong con người. “Những điều kín giấu” tự nhiên và giữ được phạm vi nghĩa rộng hơn “bí mật”.
- source_word: τῆς καρδίας αὐτοῦ
  choice: trong lòng người ấy
  rationale: “Lòng” là cách diễn đạt Kinh Thánh quen thuộc cho trung tâm tư tưởng và động cơ. Dùng “người ấy” để diễn đạt đại từ giống đực theo cách tự nhiên mà không nhất thiết giới hạn đối tượng vào nam giới.
- source_word: φανερὰ γίνεται
  choice: trở nên rõ ràng
  rationale: 'Giữ sắc thái chuyển biến của γίνεται: những điều vốn kín giấu nay trở nên hiển nhiên, thay vì diễn giải trực tiếp là “được tiết lộ”.'
- source_word: καὶ οὕτως
  choice: và như thế
  rationale: Giữ mối liên hệ kết quả giữa việc lòng bị phơi bày và phản ứng tiếp theo.
- source_word: πεσὼν ἐπὶ πρόσωπον
  choice: sấp mặt xuống
  rationale: Diễn đạt tự nhiên tư thế phủ phục, đồng thời giữ hình ảnh thân thể sinh động của nguyên văn.
- source_word: προσκυνήσει τῷ θεῷ
  choice: thờ phượng Đức Chúa Trời
  rationale: Trong ngữ cảnh này, động từ chỉ hành vi thờ phượng hướng về Đức Chúa Trời; tư thế phủ phục đã được thể hiện trong mệnh đề trước.
- source_word: ἀπαγγέλλων
  choice: tuyên bố
  rationale: Diễn tả lời xác nhận công khai và trang trọng của người ấy mà không cường điệu thành một hoạt động rao giảng.
- source_word: Ὄντως
  choice: thật sự
  rationale: Truyền đạt sự nhấn mạnh rằng kết luận này là chân thật và chắc chắn bằng cách nói tự nhiên trong tiếng Việt hiện đại.
- source_word: ἐν ὑμῖν
  choice: ở giữa anh chị em
  rationale: Ngữ cảnh nói về hội chúng đang nhóm lại, nên cách dịch này diễn đạt rõ sự hiện diện của Đức Chúa Trời giữa cộng đồng. Nghĩa “ở trong anh chị em” vẫn khả dĩ và được giữ trong chú thích.
theological_decisions:
- issue: Nghĩa của ἐν ὑμῖν trong lời xác nhận kết thúc
  choice: ở giữa anh chị em
  alternative: ở trong anh chị em
  rationale: Ngữ cảnh trực tiếp là buổi nhóm của hội thánh và việc người ngoài nhận biết sự hiện diện của Đức Chúa Trời qua hoạt động nói tiên tri. Tuy vậy, giới từ Hy Lạp cũng có thể diễn tả sự hiện diện ở trong cộng đồng, nên phương án ấy được bảo tồn trong chú thích thay vì bị loại bỏ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Trời” cho θεός và “anh chị em” để thể hiện số nhiều của ὑμῖν theo lối xưng hô cộng đồng tự nhiên. Dấu ngoặc kép làm rõ nội dung lời tuyên bố; dấu chú thích [a] đặt ngay sau lời liên quan.
