source:
  edition: SBLGNT
  text: οὐ γάρ ἐστιν ἀκαταστασίας ὁ θεὸς ἀλλὰ εἰρήνης), ὡς ἐν πάσαις ταῖς ἐκκλησίαις τῶν ἁγίων.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/033.yaml
  text: For God is not a God of disorder but of peace[b][a], as in all the churches of the saints.
translation:
  language: vi
  text: Vì Đức Chúa Trời không phải là Đức Chúa Trời của sự hỗn loạn, nhưng của sự bình an,[a] như trong mọi hội thánh của các thánh.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Vì Đức Chúa Trời không phải là Đức Chúa Trời của sự rối loạn, nhưng của sự bình an.”'
    reason: lexical_alternative
  - marker: b
    text: 'Hay: “như trong mọi hội thánh của dân thánh của Đức Chúa Trời.” Một số người nối cụm từ này với câu kế tiếp thay vì với câu này.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀκαταστασίας
  choice: sự hỗn loạn
  rationale: Diễn đạt tình trạng thiếu trật tự trong buổi nhóm, phù hợp với ngữ cảnh trực tiếp; đồng thời vẫn giữ được nét nghĩa rộng của từ Hy Lạp hơn là chỉ nói đến sự bối rối trong tâm trí.
- source_word: εἰρήνης
  choice: sự bình an
  rationale: Cách dịch quen thuộc và trang trọng của εἰρήνη; tại đây đối lập với sự hỗn loạn và hàm ý trạng thái hòa thuận, có trật tự.
- source_word: ὁ θεὸς
  choice: Đức Chúa Trời
  rationale: Danh xưng phổ thông, trang trọng trong tiếng Việt dành cho Đức Chúa Trời duy nhất; mạo từ Hy Lạp không cần được biểu thị riêng.
- source_word: ὡς
  choice: như trong
  rationale: Giữ cách nối ngắn gọn và sự gắn kết có khả năng nhất với câu hiện tại, nhưng không diễn giải quá mức quan hệ so sánh.
- source_word: ἐκκλησίαις
  choice: các hội thánh
  rationale: Cách gọi tự nhiên và đã được xác lập cho các cộng đồng Cơ Đốc địa phương trong văn cảnh thư Phao-lô.
- source_word: τῶν ἁγίων
  choice: của các thánh đồ
  rationale: Giữ thuật ngữ quen thuộc của Phao-lô dành cho các tín hữu; chú thích cung cấp cách diễn đạt minh giải dễ hiểu hơn.
- source_word: γάρ
  choice: Vì
  rationale: Nêu lý do cho những chỉ dẫn ngay trước đó về việc phát biểu có trật tự trong hội thánh.
theological_decisions:
- issue: Phạm vi liên kết của cụm ὡς ἐν πάσαις ταῖς ἐκκλησίαις τῶν ἁγίων
  choice: Gắn với câu 33 như một sự so sánh hoặc viện dẫn thực hành trong tất cả các hội thánh
  alternative: Gắn với câu kế tiếp, mở đầu phát biểu về cách hành xử trong các hội thánh
  rationale: Dấu câu của SBLGNT được cung cấp nghiêng về việc gắn cụm này với câu 33, nhưng cú pháp có thể được ngắt theo cách khác. Chú thích bảo tồn sự không chắc chắn này thay vì âm thầm quyết định vấn đề.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Cấu trúc “Đức Chúa Trời của…” được giữ để phản ánh phép đối xứng của nguyên văn; các thuật ngữ “hội thánh” và “thánh đồ” duy trì văn phong Kinh Thánh quen thuộc mà không thêm nét nghĩa hệ phái.
