revisions:
- from: Vì quả thật, anh em cảm tạ rất tốt, nhưng người khác không được gây dựng.[a]
  to: Quả thật, bạn cảm tạ cách tốt đẹp, nhưng người kia không được gây dựng.[a]
  rationale: Sửa đại từ số ít, làm rõ người được nói đến là “người kia,” và thay cụm trạng từ không tự nhiên bằng “cách tốt đẹp.” Bản sửa vẫn giữ sự thừa nhận ở vế đầu, thế tương phản ở vế sau, và ẩn dụ “gây dựng,” không thêm diễn giải giáo phái.
