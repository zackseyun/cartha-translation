  text: σὺ μὲν γὰρ καλῶς εὐχαριστεῖς, ἀλλ’ ὁ ἕτερος οὐκ οἰκοδομεῖται.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/017.yaml
  text: For you are indeed giving thanks well[a], but the other person is not built up.
translation:
  language: vi
  text: Quả thật, bạn cảm tạ cách tốt đẹp, nhưng người kia không được gây dựng.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “người kia không được xây dựng.”'
    reason: Phương án từ vựng cho ẩn dụ bị động οἰκοδομεῖται; chính văn giữ cách nói “được gây dựng” quen thuộc trong tiếng Việt Kinh Thánh.
lexical_decisions:
- source_word: σὺ
  choice: anh em
  rationale: Đại từ ngôi thứ hai số ít chỉ người đang nói trong hội thánh; “anh em” là cách xưng hô trực tiếp tự nhiên, trang trọng trong văn cảnh thư tín, dù tiếng Việt không biểu thị số ít rõ như tiếng Hy Lạp.
- source_word: μὲν γὰρ
  choice: vì quả thật
  rationale: “Vì” giữ chức năng giải thích của γάρ, còn “quả thật” thể hiện sự thừa nhận dẫn vào thế tương phản μέν ... ἀλλά.
- source_word: καλῶς
  choice: rất tốt
  rationale: Diễn đạt sự đánh giá tích cực của καλῶς theo tiếng Việt tự nhiên; không hàm ý rằng việc cảm tạ tự nó sai.
- source_word: εὐχαριστεῖς
  choice: cảm tạ
  rationale: Trong văn cảnh lời cầu nguyện giữa hội thánh, động từ chỉ việc dâng lời tạ ơn lên Đức Chúa Trời; “cảm tạ” vừa rõ nghĩa vừa phù hợp văn phong Kinh Thánh hiện đại.
- source_word: ἀλλ’
  choice: nhưng
  rationale: Giữ trực tiếp quan hệ tương phản với mệnh đề trước.
- source_word: ὁ ἕτερος
  choice: người khác
  rationale: Chỉ người còn lại, tức người nghe hoặc người tham dự khác, mà không xác định quá mức vai trò của người ấy.
- source_word: οὐκ οἰκοδομεῖται
  choice: không được gây dựng
  rationale: Giữ thể bị động và ẩn dụ xây dựng quen thuộc của Phao-lô về việc được củng cố, ích lợi về mặt thuộc linh.
theological_decisions:
- issue: Ẩn dụ οἰκοδομέω trong bối cảnh hội thánh
  choice: không được gây dựng
  alternative: không được ích lợi / không được củng cố
  rationale: “Được gây dựng” bảo tồn hình ảnh xây dựng của nguyên văn và chiều kích tăng trưởng thuộc linh, nhưng không thu hẹp nó vào một giáo lý riêng.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng và dễ hiểu. Câu giữ sự thừa nhận tích cực ở vế đầu rồi chuyển sang hậu quả bất lợi cho người khác; không biến động từ chỉ định thành khả năng.
