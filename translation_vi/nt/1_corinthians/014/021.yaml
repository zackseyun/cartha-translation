  to: 'Trong Luật có chép rằng: “Bằng những thứ tiếng khác và qua môi miệng của những người khác[a], Ta sẽ nói với dân này; dù vậy, họ vẫn sẽ không nghe lời Ta[b],” Chúa phán[c][d].'
