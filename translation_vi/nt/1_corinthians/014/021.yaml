    issue: “những người ngoại quốc” cho ἑτέρων
    rationale: ἑτέρων nghĩa cơ bản là “những người khác”; ý “ngoại quốc” có thể phù hợp với nền cảnh lời trích nhưng là sự cụ thể hóa không được nêu rõ bởi từ Hy Lạp. Nên giữ “những người khác” trong bản chính và bảo lưu cách hiểu “người ngoại quốc” ở chú thích.
  - severity: low
    issue: Cụm “dùng ... môi miệng ... mà phán”
    rationale: Cách kết hợp này gượng trong tiếng Việt. Đổi sang “bằng ... và qua môi miệng ... mà Ta sẽ nói” giữ nguyên phương tiện cách và hình ảnh “môi” của χείλεσιν.
