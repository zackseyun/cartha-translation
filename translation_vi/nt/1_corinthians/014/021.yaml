id: 1CO.14.21
reference: 1 Corinthians 14:21
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐν τῷ νόμῳ γέγραπται ὅτι Ἐν ἑτερογλώσσοις καὶ ἐν χείλεσιν ⸀ἑτέρων λαλήσω τῷ λαῷ τούτῳ, καὶ οὐδ’ οὕτως εἰσακούσονταί μου, λέγει κύριος.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/021.yaml
  text: 'In the Law it is written: “By people of other tongues and by the lips of foreigners I will speak to this people[d][c][b][a], and not even in this way will they listen to me,” says the Lord.'
translation:
  language: vi
  text: 'Trong Luật có chép rằng: “Bằng những thứ tiếng khác và qua môi miệng của những người khác[a], Ta sẽ nói với dân này; dù vậy, họ vẫn sẽ không nghe lời Ta[b],” Chúa phán[c][d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “bằng những tiếng khác và bằng môi miệng của những người ngoại quốc.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “họ cũng sẽ không chịu nghe Ta.”'
    reason: lexical_alternative
  - marker: c
    text: Lời trích này gợi lại Ê-sai 28:11–12.
    reason: cross_reference
  - marker: d
    text: Vì đây là lời Đức Chúa Trời của Israel phán trong Kinh Thánh, một số bản dịch dùng “ĐỨC CHÚA phán” để phản ánh hậu cảnh tiếng Hê-bơ-rơ.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν τῷ νόμῳ
  choice: Trong Luật
  rationale: Giữ cách gọi quy ước của Phao-lô đối với Kinh Thánh Do Thái, dù lời trích dẫn đến từ sách Ê-sai chứ không phải Ngũ Kinh.
- source_word: γέγραπται
  choice: có chép rằng
  rationale: Công thức dẫn Kinh Thánh tự nhiên, trang trọng và sát với thể hoàn thành bị động của tiếng Hy Lạp.
- source_word: ἐν ἑτερογλώσσοις
  choice: dùng những thứ tiếng khác
  rationale: Diễn đạt phương tiện của lời nói và giữ liên hệ từ vựng với chủ đề các thứ tiếng trong văn cảnh; chú thích bảo lưu cách hiểu gắn trực tiếp với người nói.
- source_word: ἐν χείλεσιν ἑτέρων
  choice: môi miệng của những người ngoại quốc
  rationale: Giữ hình ảnh đôi môi, đồng thời làm rõ rằng ἑτέρων trong ngữ cảnh chỉ những người khác về dân tộc hoặc ngôn ngữ.
- source_word: λαλήσω
  choice: Ta sẽ ... phán
  rationale: Vì chủ thể là Đức Chúa Trời, “phán” là cách diễn đạt tiếng Việt tự nhiên và trang trọng cho hành động nói của Ngài.
- source_word: τῷ λαῷ τούτῳ
  choice: với dân này
  rationale: λαός trong lời trích Kinh Thánh chỉ dân chúng, đặc biệt là dân giao ước; “dân này” tự nhiên hơn “quốc gia này”.
- source_word: οὐδ’ οὕτως
  choice: nhưng ngay cả như vậy ... cũng sẽ không
  rationale: 'Bảo toàn sắc thái nhấn mạnh: dù Đức Chúa Trời dùng phương cách này, họ vẫn không đáp lại.'
- source_word: εἰσακούσονταί μου
  choice: họ cũng sẽ không nghe lời Ta
  rationale: “Nghe lời” vừa tự nhiên trong tiếng Việt vừa bao hàm sắc thái lắng nghe và vâng theo; “chịu nghe Ta” được ghi ở chú thích như một khả năng gần hơn về mặt biểu đạt.
- source_word: λέγει κύριος
  choice: Chúa phán
  rationale: Dịch κύριος là “Chúa” theo văn bản Hy Lạp và dùng trật tự từ tự nhiên trong công thức lời phán.
theological_decisions:
- issue: Cách dịch κύριος trong lời trích dẫn lời Đức Chúa Trời của Israel
  choice: Chúa
  alternative: ĐỨC CHÚA
  rationale: Văn bản Hy Lạp có κύριος nên bản chính dịch là “Chúa”; tuy nhiên, lời trích dựa trên Ê-sai và có hậu cảnh danh giao ước trong tiếng Hê-bơ-rơ, vì thế ghi nhận cách dịch “ĐỨC CHÚA” trong chú thích.
- issue: Sắc thái của εἰσακούσονταί μου
  choice: nghe lời Ta
  alternative: chịu nghe Ta
  rationale: Không thu hẹp động từ vào việc nghe âm thanh đơn thuần; “nghe lời” giữ được sức căng giữa lắng nghe và đáp ứng/vâng theo.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “Ta” trong lời phán trực tiếp của Đức Chúa Trời; giữ hình ảnh “môi miệng” và thuật ngữ “những thứ tiếng khác” để nối với văn cảnh 1 Cô-rinh-tô 14. Các dấu chú thích đều xuất hiện trong bản văn chính.
