  terminology: Các thuật ngữ then chốt được dùng nhất quán và thận trọng. “Phụ nữ” không áp đặt cách hiểu “vợ”; “luật pháp” giữ được sự không xác định của ὁ νόμος. Các chú thích giải thích đúng những điểm ngữ nghĩa và diễn giải còn tranh luận, không biến chúng thành nghĩa của bản văn chính.
