id: 1CO.14.34
reference: 1 Corinthians 14:34
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Αἱ ⸀γυναῖκες ἐν ταῖς ἐκκλησίαις σιγάτωσαν, οὐ γὰρ ⸀ἐπιτρέπεται αὐταῖς λαλεῖν· ἀλλὰ ⸀ὑποτασσέσθωσαν, καθὼς καὶ ὁ νόμος λέγει.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/034.yaml
  text: The women should keep silent in the churches[a], for they are not permitted to speak, but should be in submission[c][b], just as the law also says.
translation:
  language: vi
  text: Phụ nữ trong các hội thánh phải giữ im lặng[a], vì họ không được phép nói[b], nhưng phải thuận phục, như luật pháp cũng dạy[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Những người vợ trong các hội thánh phải giữ im lặng”; từ Hy Lạp có thể có nghĩa là “phụ nữ” hoặc “vợ”, tùy văn cảnh.'
    reason: alternative_reading
  - marker: b
    text: Câu này không tự xác định loại lời nói nào được đề cập; một số người hiểu lệnh này theo nghĩa hẹp hơn dựa vào văn cảnh chung quanh.
    reason: lexical_alternative
  - marker: c
    text: “Luật pháp” ở đây có thể chỉ Luật Môi-se nói riêng hoặc Kinh Thánh theo nghĩa rộng hơn.
    reason: alternative_reading
lexical_decisions:
- source_word: γυναῖκες
  choice: phụ nữ
  rationale: γυνή có thể có nghĩa là “phụ nữ” hoặc “vợ”. Trong câu này không nhắc rõ đến chồng, nên bản chính giữ nghĩa rộng hơn là “phụ nữ”; nghĩa “những người vợ” được ghi ở chú thích.
- source_word: ἐκκλησίαις
  choice: các hội thánh
  rationale: Trong cách dùng của Phao-lô, ἐκκλησία thường chỉ cộng đồng tín hữu, nhất là khi nhóm họp. “Các hội thánh” là cách diễn đạt tự nhiên, trang trọng trong tiếng Việt và không loại trừ sắc thái hội chúng đang nhóm lại.
- source_word: σιγάτωσαν
  choice: phải giữ im lặng
  rationale: Động từ mệnh lệnh hiện tại diễn tả việc giữ im lặng hoặc tự kiềm chế trong hoàn cảnh được nói đến. “Phải giữ im lặng” bảo toàn lực mệnh lệnh và tương ứng với cách dùng cùng động từ trong chương này.
- source_word: ἐπιτρέπεται
  choice: không được phép
  rationale: Thể bị động diễn tả sự không cho phép. Cách dịch này rõ ràng, tự nhiên và không thêm chủ thể ban hành sự cho phép.
- source_word: λαλεῖν
  choice: nói
  rationale: λαλέω là động từ có nghĩa rộng là nói. Bản dịch không thu hẹp thành một loại phát biểu cụ thể vì chính câu này không nêu rõ.
- source_word: ὑποτασσέσθωσαν
  choice: phải thuận phục
  rationale: Động từ mệnh lệnh trung/bị động diễn tả tư thế đặt mình dưới trật tự hay thuận phục. “Thuận phục” vừa gọn, trang trọng, vừa tránh thêm một đối tượng không được nêu trong câu.
- source_word: νόμος
  choice: luật pháp
  rationale: νόμος có thể chỉ Luật Môi-se nói riêng hoặc lời Kinh Thánh theo nghĩa rộng hơn trong lập luận này. “Luật pháp” giữ được cách gọi quen thuộc mà không xác định quá mức nguồn tham chiếu.
- source_word: καθὼς καὶ ὁ νόμος λέγει
  choice: như luật pháp cũng dạy
  rationale: καθὼς ... καί mang ý so sánh và bổ sung chứng cứ. Tiếng Hy Lạp dùng “nói”; trong tiếng Việt, “luật pháp dạy” tự nhiên hơn nhưng vẫn giữ ý luật pháp làm chứng cho điều vừa nêu.
theological_decisions:
- issue: Đối tượng của γυναῖκες
  choice: phụ nữ trong các hội thánh
  alternative: những người vợ trong các hội thánh
  rationale: Danh từ Hy Lạp có thể mang cả hai nghĩa. Vì câu này không nói rõ đến chồng, bản chính dùng nghĩa rộng, đồng thời ghi nghĩa hẹp hơn trong chú thích.
- issue: Phạm vi của lệnh không được nói
  choice: dịch trực tiếp là “không được phép nói”, không xác định loại lời nói
  alternative: chỉ lời nói gây rối hoặc việc thẩm định lời tiên tri
  rationale: Bản thân câu Hy Lạp chỉ dùng động từ rộng nghĩa “nói”. Những cách thu hẹp dựa trên việc giải thích văn cảnh đang còn tranh luận, nên không được đưa vào bản chính.
- issue: Điều được ὁ νόμος quy chiếu
  choice: luật pháp, không xác định cụ thể hơn
  alternative: Luật Môi-se nói riêng hoặc Kinh Thánh nói chung
  rationale: Câu không trích dẫn cụ thể và phạm vi của từ này vẫn được tranh luận. Bản dịch cùng chú thích bảo toàn sự mơ hồ đó.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “hội thánh” theo văn phong Kinh Thánh phổ biến; giữ lực mệnh lệnh của các động từ Hy Lạp. Các dấu chú thích [a], [b], [c] đều được đặt ngay tại nội dung liên quan trong câu chính.
