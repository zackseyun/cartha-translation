  source_fidelity: 'Bản dịch chuyển tải trung thành các thành phần chính của câu Hy Lạp: γυναῖκες là “Phụ nữ” (với phương án “những người vợ” được giữ trong chú thích), ἐν ταῖς ἐκκλησίαις là “trong các hội thánh,” σιγάτωσαν là mệnh lệnh “phải giữ im lặng,” và ἐπιτρέπεται αὐταῖς λαλεῖν là “họ không được phép nói.” “Phải thuận phục” diễn đạt phù hợp ὑποτασσέσθωσαν mà không tự thêm đối tượng. “Như luật pháp cũng dạy” là cách Việt hóa tự nhiên cho καθὼς καὶ ὁ νόμος λέγει, vẫn giữ ý luật pháp được viện dẫn làm chứng cứ.'
