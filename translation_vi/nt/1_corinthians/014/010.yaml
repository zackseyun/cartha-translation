id: 1CO.14.10
reference: 1 Corinthians 14:10
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τοσαῦτα εἰ τύχοι γένη φωνῶν ⸀εἰσιν ἐν κόσμῳ, καὶ ⸀οὐδὲν ἄφωνον·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/010.yaml
  text: There are perhaps many kinds of languages in the world[a], and none is without meaning.
translation:
  language: vi
  text: Có lẽ trên thế gian có rất nhiều loại ngôn ngữ[a], và không loại nào là không có ý nghĩa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Có lẽ trên thế gian có rất nhiều loại âm thanh, và không loại nào là không có tiếng.”'
    reason: Giữ khả năng φωνῶν mang nghĩa “âm thanh/tiếng” và ἄφωνον mang nghĩa sát chữ là “không có tiếng”.
lexical_decisions:
- source_word: τοσαῦτα
  choice: rất nhiều
  rationale: Diễn đạt tự nhiên số lượng lớn mà τοσαῦτα chỉ đến, không ấn định một con số cụ thể.
- source_word: εἰ τύχοι
  choice: có lẽ
  rationale: Giữ sắc thái dè dặt, ước lệ của thành ngữ Hy Lạp.
- source_word: γένη
  choice: loại
  rationale: Tương ứng tự nhiên với nghĩa các loại hay các hạng.
- source_word: φωνῶν
  choice: ngôn ngữ
  rationale: Trong mạch văn về lời nói có thể hiểu được, 'ngôn ngữ' truyền đạt rõ nghĩa theo ngữ cảnh; nghĩa rộng hơn là 'âm thanh/tiếng' được giữ trong chú thích.
- source_word: ἐν κόσμῳ
  choice: trên thế gian
  rationale: Cách nói tiếng Việt tự nhiên, trang trọng cho phạm vi toàn thế giới.
- source_word: οὐδὲν ἄφωνον
  choice: không loại nào là không có ý nghĩa
  rationale: Theo ngữ cảnh, ἄφωνον nói đến điều không truyền đạt ý nghĩa; cấu trúc phủ định được giữ, còn nghĩa sát chữ liên quan đến âm thanh được nêu trong chú thích.
theological_decisions: []
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, rõ ràng và trang trọng vừa phải. Bản chính ưu tiên nghĩa theo mạch văn nhưng chú thích bảo lưu tính đa nghĩa của φωνή và ἄφωνος.
