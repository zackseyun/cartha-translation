source:
  edition: SBLGNT
  text: οὕτως καὶ ὑμεῖς διὰ τῆς γλώσσης ἐὰν μὴ εὔσημον λόγον δῶτε, πῶς γνωσθήσεται τὸ λαλούμενον; ἔσεσθε γὰρ εἰς ἀέρα λαλοῦντες.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/009.yaml
  text: 'So also with you: if through the tongue you do not give intelligible speech[a], how will what is spoken be understood? For you will be speaking into the air.'
translation:
  language: vi
  text: 'Anh chị em cũng vậy: nếu dùng lưỡi mà không nói ra lời dễ hiểu[a], thì làm sao người ta hiểu được điều đang được nói? Vì anh chị em sẽ nói vào không khí.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “lời rõ ràng” hoặc “thông điệp rõ nghĩa.” Từ Hy Lạp nhấn mạnh lời nói mà người nghe có thể nhận biết và hiểu được.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως καὶ ὑμεῖς
  choice: Anh chị em cũng vậy
  rationale: Giữ mối so sánh với minh họa ngay trước đó và trực tiếp áp dụng cho cộng đồng Cô-rinh-tô; cách xưng hô bao hàm, tự nhiên trong tiếng Việt hiện đại.
- source_word: διὰ τῆς γλώσσης
  choice: dùng lưỡi
  rationale: Giữ hình ảnh cụ thể của γλῶσσα, đồng thời diễn đạt tự nhiên ý phương tiện; không vội giải nghĩa thành một ngôn ngữ cụ thể.
- source_word: εὔσημον λόγον
  choice: lời dễ hiểu
  rationale: εὔσημος chỉ điều rõ ràng, có thể nhận biết; lựa chọn này nhấn mạnh khả năng người nghe hiểu được mà không thu hẹp λόγος thành một từ đơn lẻ.
- source_word: δῶτε
  choice: nói ra
  rationale: Dịch theo chức năng trong ngữ cảnh phát ngôn. Cách dịch sát hình thức là “đưa ra”, nhưng “nói ra lời” tự nhiên hơn trong tiếng Việt và vẫn bảo toàn ý tạo ra một phát ngôn cho người nghe.
- source_word: πῶς γνωσθήσεται
  choice: thì làm sao người ta hiểu được
  rationale: Thể bị động của γινώσκω trong ngữ cảnh này nói đến việc nội dung được người nghe nhận biết hoặc lĩnh hội; thêm chủ thể phiếm chỉ “người ta” tạo câu tiếng Việt tự nhiên mà không xác định một nhóm mới.
- source_word: τὸ λαλούμενον
  choice: điều đang được nói
  rationale: Giữ cấu trúc danh hóa và sắc thái bị động, đồng thời biểu đạt thể hiện tại của phân từ.
- source_word: ἔσεσθε γὰρ εἰς ἀέρα λαλοῦντες
  choice: Vì anh chị em sẽ chỉ nói vào không khí
  rationale: Giữ ẩn dụ nói vào không khí về lời nói không đến được với người nghe; “chỉ” làm rõ hàm ý vô ích của thành ngữ trong tiếng Việt mà không thay đổi luận điểm.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “anh chị em” để chỉ số nhiều trực tiếp mà không mang sắc thái giới tính riêng; giữ hình ảnh “lưỡi” và “nói vào không khí” của nguyên bản.
