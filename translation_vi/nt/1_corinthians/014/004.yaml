id: 1CO.14.4
reference: 1 Corinthians 14:4
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ λαλῶν γλώσσῃ ἑαυτὸν οἰκοδομεῖ· ὁ δὲ προφητεύων ἐκκλησίαν οἰκοδομεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/004.yaml
  text: The one who speaks in a tongue builds up himself[c][b][a], but the one who prophesies builds up the church.
translation:
  language: vi
  text: Người nói bằng tiếng lạ[a] thì gây dựng chính mình[b], còn người nói lời tiên tri thì gây dựng hội thánh[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “bằng một ngôn ngữ.” Tuy nhiên, trong chương này, từ ấy có lẽ chỉ ân tứ nói các thứ tiếng; bản chất chính xác của lời nói này vẫn còn được tranh luận.'
    reason: lexical_alternative
  - marker: b
    text: Tiếng Hy Lạp dùng đại từ phản thân giống đực số ít, nghĩa đen là “chính người ấy”; hình thức số ít này có ý nghĩa đại diện.
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “hội chúng” hoặc “cộng đồng tụ họp.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ λαλῶν
  choice: Người nói
  rationale: Mạo từ đi với phân từ hiện tại tạo thành danh ngữ, chỉ một người tiêu biểu được nhận diện qua hành động; cách dịch này cũng giữ cấu trúc song song với ὁ προφητεύων.
- source_word: γλώσσῃ
  choice: bằng tiếng lạ
  rationale: Danh từ số ít ở cách dữ cách chỉ phương tiện hoặc phạm vi của lời nói. Trong văn cảnh 1 Cô-rinh-tô 12–14, từ này nói đến hiện tượng ân tứ nói các thứ tiếng; “tiếng lạ” là cách nói tự nhiên, quen thuộc trong tiếng Việt, còn chú thích giữ lại khả năng hiểu là “một ngôn ngữ” và không xác định cứng bản chất của hiện tượng.
- source_word: ἑαυτὸν
  choice: chính mình
  rationale: Đại từ phản thân nhấn mạnh người nói là đối tượng nhận được sự gây dựng. Tiếng Việt không đánh dấu giống ngữ pháp ở đây, nhưng vẫn giữ số ít và ý phản thân.
- source_word: οἰκοδομεῖ
  choice: gây dựng
  rationale: Động từ được dùng theo nghĩa ẩn dụ về việc làm cho vững mạnh hoặc ích lợi về mặt thuộc linh. “Gây dựng” tự nhiên trong văn cảnh cộng đồng đức tin và vẫn giữ hình ảnh xây dựng.
- source_word: ὁ δὲ προφητεύων
  choice: còn người nói lời tiên tri
  rationale: Phân từ dùng như danh từ được dịch song song với vế đầu. “Còn” diễn đạt sự tương phản nhẹ của δέ mà không làm hai hoạt động thành đối nghịch tuyệt đối.
- source_word: ἐκκλησίαν
  choice: hội thánh
  rationale: Trong văn cảnh này, từ chỉ cộng đồng tín hữu tụ họp. “Hội thánh” là cách gọi hiện đại và tự nhiên trong tiếng Việt; các nghĩa gần như “hội chúng” được ghi nhận trong chú thích.
theological_decisions:
- issue: Ý nghĩa của γλώσσῃ trong 1 Cô-rinh-tô 12–14
  choice: Dịch là “bằng tiếng lạ,” chỉ hiện tượng nói tiếng do ân tứ ban cho nhưng không xác định cụ thể bản chất của lời nói ấy
  alternative: “bằng một ngôn ngữ,” hiểu là một ngoại ngữ thông thường hoặc xác định đây là lời nói xuất thần
  rationale: Văn mạch bàn về ân tứ nói các thứ tiếng trong sự thờ phượng chung. Bản dịch dùng thuật ngữ quen thuộc nhưng chú thích bảo lưu sự mơ hồ thực sự về bản chất của hiện tượng, tránh áp đặt một cách giải thích hệ phái.
- issue: Hình thức giống đực số ít có ý nghĩa đại diện
  choice: Dùng “người” và “chính mình,” là các hình thức số ít không đánh dấu giới tính tự nhiên trong tiếng Việt
  alternative: Thêm đại từ giống đực như “người ấy tự gây dựng bản thân anh ta”
  rationale: Tiếng Hy Lạp dùng hình thức giống đực số ít theo nghĩa đại diện. Tiếng Việt không cần đánh dấu giống để giữ số ít hoặc ý khái quát; thêm đại từ nam giới sẽ gượng ép và dễ khiến người đọc hiểu sai rằng nguyên tắc chỉ áp dụng cho nam giới.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Hai vế được giữ song song; “còn” biểu đạt sự tương phản nhẹ giữa lợi ích dành cho chính người nói và lợi ích dành cho cộng đồng. Không dùng thuật ngữ quá chuyên môn và không xác định hiện tượng nói tiếng lạ theo một lập trường hệ phái cụ thể.
