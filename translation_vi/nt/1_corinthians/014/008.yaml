id: 1CO.14.8
reference: 1 Corinthians 14:8
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ γὰρ ἐὰν ἄδηλον ⸂φωνὴν σάλπιγξ⸃ δῷ, τίς παρασκευάσεται εἰς πόλεμον;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/008.yaml
  text: For if the trumpet gives an unclear sound[b][a], who will prepare for battle?
translation:
  language: vi
  text: Vì nếu kèn phát ra âm thanh không rõ[a], ai sẽ chuẩn bị ra trận[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hoặc “âm thanh không phân biệt được”.
    reason: lexical_alternative
  - marker: b
    text: 'Sát nghĩa: “cho chiến tranh”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: Vì
  rationale: Cụm từ nối này nêu lý do và tiếp tục lập luận; “Vì” diễn đạt tự nhiên chức năng giải thích trong tiếng Việt.
- source_word: ἐὰν
  choice: nếu
  rationale: Dẫn vào mệnh đề điều kiện với động từ ở thể giả định; “nếu” là cách diễn đạt trực tiếp và tự nhiên.
- source_word: ἄδηλον
  choice: không rõ
  rationale: Diễn tả điều không rõ ràng hoặc khó phân biệt; cách dịch này tự nhiên và giữ đúng trọng tâm về tín hiệu không thể nhận biết.
- source_word: φωνὴν
  choice: âm thanh
  rationale: Trong ngữ cảnh chiếc kèn, φωνή chỉ âm thanh phát ra chứ không phải giọng nói.
- source_word: σάλπιγξ
  choice: kèn
  rationale: Chỉ loại kèn dùng làm tín hiệu, đặc biệt trong quân sự. Tiếng Việt có thể dùng danh từ không kèm từ chỉ loại để diễn đạt ý khái quát.
- source_word: δῷ
  choice: phát ra
  rationale: Nghĩa đen là “cho”, nhưng khi nói về nhạc cụ phát âm, “phát ra” là kết hợp từ tự nhiên trong tiếng Việt và vẫn giữ hình ảnh của nguyên văn.
- source_word: τίς
  choice: ai
  rationale: Đại từ nghi vấn mở đầu câu hỏi tu từ; “ai” là tương đương trực tiếp.
- source_word: παρασκευάσεται
  choice: sẽ chuẩn bị
  rationale: Động từ thể trung gian hàm ý tự sửa soạn. Trong tiếng Việt, “chuẩn bị” ở đây tự nhiên bao hàm việc chính người ấy sẵn sàng.
- source_word: εἰς πόλεμον
  choice: ra trận
  rationale: Nghĩa sát là “cho chiến tranh”, nhưng trong bối cảnh tín hiệu quân sự, “ra trận” tự nhiên hơn và diễn đạt mục đích chuẩn bị chiến đấu.
