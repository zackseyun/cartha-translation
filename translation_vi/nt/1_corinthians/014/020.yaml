id: 1CO.14.20
reference: 1 Corinthians 14:20
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἀδελφοί, μὴ παιδία γίνεσθε ταῖς φρεσίν, ἀλλὰ τῇ κακίᾳ νηπιάζετε, ταῖς δὲ φρεσὶν τέλειοι γίνεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/020.yaml
  text: Brothers[a], do not become children in your thinking, but be infants in evil[b]; yet in your thinking become mature.
translation:
  language: vi
  text: Thưa anh em[a], đừng trở nên trẻ con trong cách suy nghĩ. Về điều ác[b], hãy nên như trẻ thơ; nhưng trong cách suy nghĩ, hãy trở nên trưởng thành.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Thưa anh chị em”; từ Hy Lạp dùng hình thức số nhiều giống đực “anh em” để xưng hô với hội chúng.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “về ác ý”; từ Hy Lạp κακία có thể chỉ điều ác, sự xấu xa hoặc ác ý.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀδελφοί
  choice: Thưa anh em
  rationale: Giữ hình thức hô cách số nhiều giống đực của nguyên ngữ, đồng thời chú thích rằng trong ngữ cảnh hội thánh, lời gọi này bao gồm cả nam lẫn nữ.
- source_word: παιδία
  choice: trẻ con
  rationale: Chỉ trẻ em nói chung và giữ được sự đối lập tu từ với νηπιάζετε và τέλειοι mà không ấn định một độ tuổi quá cụ thể.
- source_word: γίνεσθε
  choice: trở nên / hãy trở nên
  rationale: Diễn đạt ý nghĩa 'trở thành' của γίνομαι, thay vì làm thành một mệnh đề trạng thái đơn thuần; cách dùng được giữ ở cả hai lần xuất hiện.
- source_word: ταῖς φρεσίν / ταῖς δὲ φρεσὶν
  choice: trong cách suy nghĩ
  rationale: φρήν ở đây nói đến năng lực hiểu biết hay tư duy. Cụm này tự nhiên trong tiếng Việt và phù hợp với cách dùng tặng cách chỉ phương diện.
- source_word: τῇ κακίᾳ
  choice: về điều ác
  rationale: κακία có phạm vi nghĩa gồm điều ác, sự xấu xa và ác ý. 'Điều ác' giữ nghĩa đạo đức rộng, còn khả năng hiểu là 'ác ý' được nêu trong chú thích.
- source_word: νηπιάζετε
  choice: hãy nên như trẻ thơ
  rationale: Truyền đạt mệnh lệnh 'hãy là/hành xử như trẻ nhỏ' bằng tiếng Việt tự nhiên, đồng thời giữ hình ảnh đối lập với sự trưởng thành.
- source_word: τέλειοι
  choice: trưởng thành
  rationale: Trong ngữ cảnh này, τέλειος nói đến sự chín chắn hay trưởng thành trong tư duy, không nhất thiết là hoàn hảo tuyệt đối.
- source_word: ἀλλὰ ... δὲ
  choice: Về ...; nhưng
  rationale: 'Giữ hai bước tương phản: non trẻ đối với điều ác nhưng trưởng thành trong tư duy, đồng thời sắp xếp câu cho tự nhiên trong tiếng Việt.'
theological_decisions:
- issue: Lời xưng hô giống đực dành cho hội chúng
  choice: Giữ 'anh em' trong chính văn và ghi chú phạm vi bao gồm cả nam lẫn nữ.
  alternative: Thưa anh chị em
  rationale: Ἀδελφοί mang hình thức giống đực số nhiều nhưng trong ngữ cảnh có thể gọi toàn thể hội thánh. Bản dịch giữ dấu vết hình thái của nguyên ngữ mà không phủ nhận phạm vi quy chiếu bao quát.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Câu được ngắt sau mệnh lệnh đầu để làm rõ thế đối lập. 'Trẻ con' và 'trẻ thơ' phân biệt παιδία với động từ νηπιάζετε mà vẫn giữ mạch hình ảnh về các mức độ trưởng thành.
