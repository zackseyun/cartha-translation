  text: ὅμως τὰ ἄψυχα φωνὴν διδόντα, εἴτε αὐλὸς εἴτε κιθάρα, ἐὰν διαστολὴν τοῖς φθόγγοις μὴ ⸀δῷ, πῶς γνωσθήσεται τὸ αὐλούμενον ἢ τὸ κιθαριζόμενον;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/007.yaml
  text: Even lifeless things that produce sound—whether flute or harp—if they do not give a distinction in the notes[a], how will what is played on the flute or on the harp be recognized?
translation:
  language: vi
  text: Ngay cả những vật vô tri phát ra âm thanh—dù là sáo hay đàn lia[a]—nếu không phân biệt các nốt, thì làm sao người ta nhận biết được khúc nhạc được thổi bằng sáo hay được gảy trên đàn lia?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “sáo hay đàn hạc.” Từ Hy Lạp κιθάρα chỉ một nhạc cụ dây cổ, gần với đàn lia hơn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅμως
  choice: Ngay cả
  rationale: Diễn tả sức nhấn khi Phao-lô chuyển sang các nhạc cụ vô tri như một ví dụ minh họa; cách nói này tự nhiên trong tiếng Việt.
- source_word: τὰ ἄψυχα
  choice: những vật vô tri
  rationale: Chỉ những vật không có sự sống, trong ngữ cảnh là các nhạc cụ; cách dịch trang trọng, dễ hiểu và giữ được sự tương phản với người nói.
- source_word: φωνὴν διδόντα
  choice: phát ra âm thanh
  rationale: Chuyển thành ngữ Hy Lạp 'cho âm thanh/tiếng' sang cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: εἴτε αὐλὸς εἴτε κιθάρα
  choice: dù là sáo hay đàn lia
  rationale: αὐλός là nhạc cụ hơi, có thể gọi là sáo; κιθάρα là nhạc cụ dây cổ gần với đàn lia hơn đàn hạc. Giữ tên gọi chính xác về lịch sử và chú thích lựa chọn quen thuộc khác.
- source_word: ἐὰν διαστολὴν τοῖς φθόγγοις μὴ δῷ
  choice: nếu không tạo ra các nốt phân biệt
  rationale: διαστολή nói đến sự phân biệt, còn φθόγγοι là các âm hoặc nốt nhạc; câu dịch truyền đạt điều kiện để giai điệu có thể được nhận ra.
- source_word: πῶς γνωσθήσεται
  choice: thì làm sao người ta nhận biết được
  rationale: Diễn đạt tự nhiên dạng bị động của γινώσκω trong tiếng Việt mà vẫn giữ ý một khúc nhạc phải có thể được nhận diện.
- source_word: τὸ αὐλούμενον ἢ τὸ κιθαριζόμενον
  choice: khúc nhạc đang được thổi bằng sáo hay gảy bằng đàn
  rationale: Hai phân từ được danh từ hóa nói đến điều đang được trình diễn; 'thổi' và 'gảy' làm rõ cách chơi tương ứng của hai nhạc cụ mà không thay đổi ý.
