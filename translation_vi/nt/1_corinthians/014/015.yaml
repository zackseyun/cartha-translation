id: 1CO.14.15
reference: 1 Corinthians 14:15
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τί οὖν ἐστιν; προσεύξομαι τῷ πνεύματι, προσεύξομαι δὲ καὶ τῷ νοΐ· ψαλῶ τῷ πνεύματι, ψαλῶ δὲ καὶ τῷ νοΐ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/015.yaml
  text: What then is to be done? I will pray with the spirit[a], but I will also pray with the mind; I will sing praise with the spirit[c][b], but I will also sing praise with the mind.
translation:
  language: vi
  text: Vậy thì phải làm sao? Tôi sẽ cầu nguyện bằng thần trí[a], nhưng tôi cũng sẽ cầu nguyện bằng tâm trí[b]; tôi sẽ hát ngợi ca[c] bằng thần trí, nhưng tôi cũng sẽ hát ngợi ca bằng tâm trí.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “trong thần trí” hoặc “nhờ thần trí”. Tiếng Hy Lạp không nói rõ “thần trí” ở đây chỉ Đức Thánh Linh, thần trí của người nói, hay sự bày tỏ thuộc linh.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “sự hiểu biết” hoặc “bằng sự hiểu biết”.'
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “hát” hoặc “cất tiếng ca”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τί οὖν ἐστιν;
  choice: Vậy phải làm sao?
  rationale: Cụm từ mang chức năng tu từ, hỏi kết luận thực tiễn của lập luận. Cách dịch này tự nhiên trong tiếng Việt hiện đại hơn lối dịch sát chữ “Vậy là gì?”, đồng thời không thêm một mệnh lệnh cụ thể.
- source_word: προσεύξομαι
  choice: tôi sẽ cầu nguyện
  rationale: Thì tương lai của προσεύχομαι được chuyển trực tiếp; thể trung không đòi hỏi một cách diễn đạt phản thân riêng trong tiếng Việt.
- source_word: τῷ πνεύματι
  choice: bằng tâm linh
  rationale: “Bằng” thể hiện khả năng công cụ/phương cách của cách ở dữ cách và giữ thế song song với “bằng tâm trí”. “Tâm linh” không viết hoa nhằm tránh xác định πνεῦμα là Đức Thánh Linh, nhưng cũng không buộc nghĩa chỉ là tinh thần con người.
- source_word: τῷ νοΐ
  choice: bằng tâm trí
  rationale: νοῦς chỉ năng lực suy nghĩ và hiểu biết có ý thức. “Tâm trí” giữ được sự đối xứng từ vựng với “tâm linh” và tự nhiên trong tiếng Việt.
- source_word: ψαλῶ
  choice: tôi sẽ hát ca ngợi
  rationale: Trong bối cảnh thờ phượng, ψάλλω chỉ việc hát lời ca ngợi. Cách dịch này rõ hơn “hát” đơn thuần mà không thêm nhạc cụ vốn không được câu này nêu rõ.
- source_word: δὲ καὶ
  choice: nhưng cũng sẽ
  rationale: 'Diễn đạt phép bổ sung có sắc thái tương phản nhẹ: không chỉ phương cách thứ nhất mà còn cả phương cách thứ hai.'
theological_decisions:
- issue: Nghĩa của πνεῦμα trong sự tương phản giữa tâm linh và tâm trí
  choice: Dịch là “tâm linh” và không xác định rõ là Đức Thánh Linh hay tâm linh của người nói.
  alternative: “Đức Thánh Linh”, “tinh thần tôi”, hoặc “trong tâm linh”
  rationale: Ngữ cảnh bàn về lời nói không được người nghe hiểu và sự hiểu biết trong sự thờ phượng. Bản Hy Lạp không nói rõ πνεῦμα ở đây chỉ riêng Đức Thánh Linh, tâm linh con người, hay lời nói thuộc linh; vì vậy bản dịch giữ nguyên độ mở thần học ấy.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Giữ nhịp song song của bốn mệnh đề và sắc thái đối chiếu giữa tâm linh với tâm trí. Dùng “tâm linh” ở chữ thường để không âm thầm giải quyết sự mơ hồ của πνεῦμα.
