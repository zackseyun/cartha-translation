    rationale: Bản nháp có chú thích về πνεῦμα và ψαλῶ nhưng bỏ khả năng “sự hiểu biết/hiểu biết” của νοΐ, vốn là một lựa chọn từ vựng đáng kể và đã được nêu trong audit trail tiếng Anh.
  - severity: low
    issue: “hát ca ngợi” hơi gượng
    rationale: “Hát ngợi ca” là kết hợp từ tự nhiên hơn, vẫn truyền đạt ψαλῶ trong ngữ cảnh thờ phượng mà không thêm chi tiết về nhạc cụ.
