  text: εἴτε γλώσσῃ τις λαλεῖ, κατὰ δύο ἢ τὸ πλεῖστον τρεῖς, καὶ ἀνὰ μέρος, καὶ εἷς διερμηνευέτω·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/027.yaml
  text: If anyone speaks in a tongue[a], let there be two, or at most three, and each in turn, and let one interpret.
translation:
  language: vi
  text: Nếu có ai nói tiếng lạ[a], thì chỉ cho phép hai người, hoặc nhiều nhất ba người, nói; mỗi người lần lượt, và phải có một người thông giải.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “một ngôn ngữ”. Từ Hy Lạp có thể chỉ cái lưỡi hoặc một ngôn ngữ; ở đây, “tiếng lạ” giữ cách gọi đã được dùng xuyên suốt chương này mà không quyết định bản chất của ân tứ ấy.
    reason: lexical_alternative
lexical_decisions:
- source_word: γλώσσῃ
  choice: tiếng lạ
  rationale: Trong 1 Cô-rinh-tô 12–14, đây là cách gọi quen thuộc và tự nhiên trong tiếng Việt cho hiện tượng ân tứ đang được bàn đến. Chú thích giữ lại nghĩa từ vựng khác là “một ngôn ngữ” và không quyết định bản chất của hiện tượng này.
- source_word: τις
  choice: có ai
  rationale: Đại từ bất định mang nghĩa khái quát trong mệnh đề điều kiện; “có ai” tự nhiên trong tiếng Việt hiện đại.
- source_word: λαλεῖ
  choice: nói
  rationale: Thì hiện tại trong điều kiện tổng quát được diễn đạt tự nhiên bằng động từ “nói”.
- source_word: κατὰ δύο ἢ τὸ πλεῖστον τρεῖς
  choice: chỉ nên có hai người, hoặc nhiều nhất là ba người
  rationale: Cụm từ giới hạn số người được nói; cách diễn đạt này làm rõ lực quy định của câu mà không thêm ý ngoài nguyên văn.
- source_word: ἀνὰ μέρος
  choice: lần lượt từng người nói
  rationale: Cụm từ có nghĩa là theo phần, lần lượt, từng người một, trái với nói đồng thời.
- source_word: εἷς
  choice: một người
  rationale: Số từ được dùng như danh từ, chỉ một người đảm nhiệm việc thông giải.
- source_word: διερμηνευέτω
  choice: phải thông giải
  rationale: Mệnh lệnh yêu cầu chuyển đạt lời nói thành điều hội chúng có thể hiểu. “Thông giải” là thuật ngữ phù hợp với văn cảnh và không thu hẹp ý nghĩa chỉ còn dịch thuật hay giải thích.
theological_decisions:
- issue: Ý nghĩa của γλώσσῃ trong bối cảnh các ân tứ thuộc linh
  choice: Dùng “tiếng lạ” trong chính văn để chỉ hiện tượng được bàn đến trong 1 Cô-rinh-tô 12–14, nhưng không xác định đó là tiếng của loài người hay tiếng thiên thượng.
  alternative: Có thể dịch là “một ngôn ngữ”, hoặc hiểu cụ thể là lời nói xuất thần hay ngoại ngữ của loài người.
  rationale: Bản thân câu này không giải quyết cuộc tranh luận rộng hơn về bản chất của ân tứ. Cách dịch cùng chú thích duy trì sự mở ngỏ của nguyên văn.
translation_notes:
  register: 'Văn phong hiện đại, trang trọng và dễ hiểu. “Chỉ nên có” truyền đạt quy định về số lượng; dấu chấm phẩy làm rõ hai yêu cầu liên tiếp: nói lần lượt và có một người thông giải.'
