  verdict: approve
  source_fidelity: Bản dịch phản ánh chính xác các mệnh lệnh hiện tại Διώκετε và ζηλοῦτε bằng “Hãy theo đuổi” và “tha thiết mong muốn”. “Những điều thuộc về Thánh Linh” giữ được phạm vi rộng, trung tính số nhiều của τὰ πνευματικά mà không tự động thu hẹp thành “ân tứ”. “Nhất là để anh chị em nói tiên tri” diễn đạt hợp lý sắc thái ưu tiên của μᾶλλον δὲ và mệnh đề ἵνα προφητεύητε.
  naturalness: Câu văn rõ ràng, hiện đại và có nhịp điệu tự nhiên trong văn phong Kinh Thánh tiếng Việt. “Anh chị em” là cách xưng hô cộng đồng phù hợp với ngôi thứ hai số nhiều. “Nói tiên tri” là thuật ngữ quen thuộc và dễ hiểu trong ngữ cảnh này.
  terminology: “Tình yêu thương”, “Thánh Linh”, và “nói tiên tri” nhất quán với thuật ngữ Kinh Thánh tiếng Việt hiện đại. Chú thích phân biệt đúng giữa độ rộng từ vựng của τὰ πνευματικά và trọng tâm ngữ cảnh về các biểu hiện do Thánh Linh ban, không áp đặt diễn giải giáo phái.
