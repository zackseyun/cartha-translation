id: 1CO.14.1
reference: 1 Corinthians 14:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Διώκετε τὴν ἀγάπην, ζηλοῦτε δὲ τὰ πνευματικά, μᾶλλον δὲ ἵνα προφητεύητε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/001.yaml
  text: Pursue love[a], and earnestly desire the spiritual things[c][b], but especially that you may prophesy.
translation:
  language: vi
  text: Hãy theo đuổi tình yêu thương và tha thiết mong muốn những điều thuộc về Thánh Linh[a], nhất là để anh chị em nói tiên tri.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “các ân tứ thuộc linh” hoặc “những điều thiêng liêng”. Cụm từ Hy Lạp có nghĩa rộng hơn “ân tứ”, nhưng trong ngữ cảnh này trọng tâm là những biểu hiện do Thánh Linh ban trong hội thánh.
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “nhưng đúng hơn là để anh chị em nói tiên tri.”'
    reason: alternative_reading
lexical_decisions:
- source_word: Διώκετε
  choice: Hãy theo đuổi
  rationale: Giữ sắc thái chủ động, bền bỉ của động từ διώκω, mạnh hơn cách nói đơn thuần là “tìm kiếm”.
- source_word: τὴν ἀγάπην
  choice: tình yêu thương
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt hiện đại, đồng thời nối rõ với chủ đề của chương 13.
- source_word: ζηλοῦτε
  choice: tha thiết mong muốn
  rationale: Truyền đạt mệnh lệnh mang ý nhiệt thành và khao khát mạnh mẽ mà không dùng lối dịch cứng.
- source_word: τὰ πνευματικά
  choice: những điều thuộc về Thánh Linh
  rationale: Giữ phạm vi rộng của tính từ trung tính số nhiều trong tiếng Hy Lạp, thay vì thu hẹp ngay thành “các ân tứ”, trong khi ngữ cảnh vẫn chỉ về những biểu hiện do Thánh Linh ban trong hội thánh.
- source_word: μᾶλλον δὲ
  choice: nhất là
  rationale: Diễn đạt tự nhiên sự ưu tiên và nhấn mạnh so sánh trong tiếng Việt; không nhất thiết biến δὲ thành một từ đối lập riêng.
- source_word: ἵνα προφητεύητε
  choice: để anh chị em nói tiên tri
  rationale: “Để” giữ được sắc thái nội dung hoặc mục đích của ἵνα với thức giả định; “anh chị em” làm rõ chủ thể số nhiều được hàm chứa trong động từ.
theological_decisions:
- issue: Phạm vi của τὰ πνευματικά
  choice: những điều thuộc về Thánh Linh
  alternative: các ân tứ thuộc linh; những điều thiêng liêng
  rationale: Cụm Hy Lạp rộng hơn riêng “ân tứ”, nhưng ngữ cảnh 1 Cô-rinh-tô 12–14 hướng đến các biểu hiện do Thánh Linh ban. Bản dịch giữ độ rộng nguyên văn và để chú thích giải thích trọng tâm ngữ cảnh.
- issue: Mức độ ưu tiên dành cho việc nói tiên tri
  choice: nhất là để anh chị em nói tiên tri
  alternative: nhưng đúng hơn là để anh chị em nói tiên tri
  rationale: Giữ lực so sánh của μᾶλλον và sự ưu tiên dành cho lời tiên tri, nhưng không hàm ý phủ nhận mọi biểu hiện thuộc linh khác.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” để biểu đạt ngôi thứ hai số nhiều bao gồm cả cộng đồng; giữ thuật ngữ Kinh Thánh quen thuộc “nói tiên tri”, đồng thời tránh thu hẹp τὰ πνευματικά ngay trong chính văn.
