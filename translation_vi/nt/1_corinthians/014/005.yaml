id: 1CO.14.5
reference: 1 Corinthians 14:5
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: θέλω δὲ πάντας ὑμᾶς λαλεῖν γλώσσαις, μᾶλλον δὲ ἵνα προφητεύητε· μείζων ⸀δὲ ὁ προφητεύων ἢ ὁ λαλῶν γλώσσαις, ἐκτὸς εἰ μὴ ⸀διερμηνεύῃ, ἵνα ἡ ἐκκλησία οἰκοδομὴν λάβῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/005.yaml
  text: I want all of you to speak in tongues[a], but even more that you would prophesy. The one who prophesies is greater than the one who speaks in tongues, unless he interprets[b], so that the church may receive edification.
translation:
  language: vi
  text: Tôi muốn tất cả anh chị em đều nói tiếng lạ[a], nhưng tôi còn muốn anh chị em nói lời tiên tri hơn. Người nói lời tiên tri thì lớn hơn người nói tiếng lạ, trừ khi người ấy giải nghĩa[b], để hội thánh được gây dựng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “nói các thứ tiếng.” Từ Hy Lạp có nghĩa đen là “những lưỡi” và cũng có thể chỉ các ngôn ngữ.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể hiểu: “trừ khi có người giải nghĩa.” Động từ Hy Lạp ở số ít có thể chỉ người nói tiếng lạ hoặc, xét theo văn cảnh rộng hơn, chỉ việc có người cung cấp lời giải nghĩa.'
    reason: alternative_reading
lexical_decisions:
- source_word: θέλω
  choice: Tôi muốn
  rationale: Diễn đạt trực tiếp ý muốn của Phao-lô bằng tiếng Việt hiện đại, không thêm trạng từ chỉ thời gian vốn không có trong nguồn.
- source_word: πάντας ὑμᾶς
  choice: tất cả anh chị em đều
  rationale: Thể hiện rõ số nhiều và tính bao quát của lời nói với toàn thể cộng đồng.
- source_word: λαλεῖν γλώσσαις
  choice: nói các thứ tiếng
  rationale: Giữ cách gọi γλῶσσαι trong mạch văn 1 Cô-rinh-tô 12–14 mà không tự quyết định đó là ngoại ngữ tự nhiên hay lời nói do Thánh Linh ban.
- source_word: μᾶλλον δὲ
  choice: nhưng càng ... hơn
  rationale: Biểu thị sự ưu tiên theo mức độ, không biến lời này thành sự bác bỏ việc nói các thứ tiếng.
- source_word: ἵνα προφητεύητε
  choice: anh chị em nói lời tiên tri
  rationale: Cách nói tự nhiên, dễ hiểu trong tiếng Việt, diễn đạt nội dung điều Phao-lô mong muốn.
- source_word: μείζων
  choice: lớn hơn
  rationale: Giữ nguyên phép so sánh của bản Hy Lạp, để mục đích gây dựng hội thánh trong chính câu xác định giá trị theo chức năng, thay vì đổi thành một phẩm trật thuộc linh.
- source_word: ὁ προφητεύων
  choice: người nói lời tiên tri
  rationale: Diễn đạt phân từ được danh từ hóa theo cách tự nhiên và giữ cấu trúc song song.
- source_word: ὁ λαλῶν γλώσσαις
  choice: người nói các thứ tiếng
  rationale: Giữ cấu trúc song song với 'người nói lời tiên tri'.
- source_word: ἐκτὸς εἰ μὴ
  choice: trừ khi
  rationale: Cách diễn đạt ngoại lệ tự nhiên trong tiếng Việt.
- source_word: διερμηνεύῃ
  choice: chính người ấy giải nghĩa
  rationale: Chủ ngữ số ít gần nhất tự nhiên chỉ người đang nói các thứ tiếng; từ 'chính' làm rõ liên hệ đại từ trong tiếng Việt, còn khả năng có người khác giải nghĩa được lưu trong chú thích.
- source_word: ἡ ἐκκλησία
  choice: hội thánh
  rationale: Thuật ngữ tiếng Việt quen thuộc cho cộng đồng Cơ Đốc đang nhóm họp trong văn cảnh này.
- source_word: οἰκοδομὴν λάβῃ
  choice: được gây dựng
  rationale: Chuyển hình ảnh 'nhận sự xây dựng' sang cách nói tiếng Việt tự nhiên, đồng thời giữ ý cộng đồng được củng cố và ích lợi.
theological_decisions:
- issue: Sự lớn hơn của người nói lời tiên tri so với người nói các thứ tiếng
  choice: Giữ 'lớn hơn' trong chính văn và để mệnh đề mục đích 'để hội thánh được gây dựng' định hướng ý nghĩa theo ích lợi đối với cộng đồng.
  alternative: Diễn giải thành 'quan trọng hơn', hoặc hiểu là cao hơn về địa vị hay sự thánh thiện.
  rationale: Bản văn dùng tính từ so sánh μείζων nhưng đặt sự so sánh trong mục tiêu gây dựng hội thánh; không nên nhập vào câu một hệ thống phẩm trật thuộc linh.
- issue: Chủ thể của διερμηνεύῃ
  choice: Hiểu tự nhiên nhất là chính người nói các thứ tiếng giải nghĩa.
  alternative: Một người khác giải nghĩa, hoặc đơn giản là có sự giải nghĩa.
  rationale: Động từ số ít không nêu chủ ngữ mới nên tự nhiên tiếp nối người nói các thứ tiếng; tuy nhiên, văn cảnh rộng hơn cho phép người khác giải nghĩa, vì vậy giữ khả năng ấy trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng 'anh chị em' để chuyển đại từ số nhiều bao quát; dùng 'hội thánh' theo cách gọi phổ biến trong tiếng Việt Cơ Đốc. Chính văn giữ phép so sánh và sự mơ hồ thần học cần thiết, còn các khả năng từ vựng và chủ thể giải nghĩa được nêu trong chú thích.
