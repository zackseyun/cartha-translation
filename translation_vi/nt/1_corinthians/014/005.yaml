revisions:
- from: Tôi muốn tất cả anh chị em đều nói các thứ tiếng[a], nhưng càng muốn anh chị em nói lời tiên tri hơn. Người nói lời tiên tri thì lớn hơn người nói các thứ tiếng, trừ khi chính người ấy giải nghĩa[b], để hội thánh được gây dựng.
  to: Tôi muốn tất cả anh chị em đều nói tiếng lạ[a], nhưng tôi còn muốn anh chị em nói lời tiên tri hơn. Người nói lời tiên tri thì lớn hơn người nói tiếng lạ, trừ khi người ấy giải nghĩa[b], để hội thánh được gây dựng.
  rationale: Sửa “các thứ tiếng” thành “tiếng lạ” để phù hợp cách dùng Việt ngữ hiện đại trong mạch văn này, nhưng chú thích bảo lưu khả năng từ vựng “các thứ tiếng/ngôn ngữ.” Bỏ “chính” trước “người ấy giải nghĩa” để không biến cách quy chiếu tự nhiên của động từ số ít thành một giới hạn loại trừ khả năng người khác giải nghĩa. Các yếu tố còn lại giữ nguyên ý nghĩa và phép so sánh của nguyên văn.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T18:12:55Z'
review_pass:
  verdict: revise
  source_fidelity: Bản dịch truyền đạt đúng cấu trúc chính của câu, gồm sự ưu tiên dành cho việc nói tiên tri, phép so sánh μείζων, ngoại lệ liên quan đến việc giải nghĩa, và mục đích gây dựng hội thánh. Tuy nhiên, từ “chính” trong “trừ khi chính người ấy giải nghĩa” nhấn mạnh chủ thể là người nói tiếng lạ mạnh hơn bản Hy Lạp đòi hỏi; dù cách quy chiếu này là tự nhiên, khả năng có người khác giải nghĩa cần được để ngỏ trong chính văn.
  naturalness: Văn phong nhìn chung tự nhiên và trang trọng vừa phải. “Nói tiếng lạ” là cách gọi Việt ngữ Cơ Đốc hiện hành, tự nhiên hơn “nói các thứ tiếng” trong mạch văn 1 Cô-rinh-tô 12–14, đồng thời không tự quyết câu hỏi về bản chất của γλῶσσαι.
  terminology: Giữ “nói lời tiên tri,” “giải nghĩa,” “hội thánh,” và “được gây dựng” là phù hợp. “Tiếng lạ” nên được dùng trong chính văn như thuật ngữ thông dụng; chú thích cần nêu nghĩa đen và phương án “các thứ tiếng/ngôn ngữ” để không áp đặt một cách hiểu về hiện tượng này.
  issues:
  - severity: medium
    issue: “chính người ấy giải nghĩa” làm hẹp tham chiếu của διερμηνεύῃ.
    rationale: Động từ số ít không có chủ ngữ mới và có thể tự nhiên quy về người nói tiếng lạ, nhưng văn cảnh cũng cho phép việc giải nghĩa do người khác thực hiện. Từ “chính” loại trừ khả năng này mạnh hơn nguyên văn; bỏ từ này và giữ chú thích thay thế sẽ bảo toàn sự mơ hồ.
  - severity: low
    issue: “Nói các thứ tiếng” kém tự nhiên như một thuật ngữ trong tiếng Việt Cơ Đốc hiện đại.
    rationale: Trong ngữ cảnh 1 Cô-rinh-tô 12–14, “nói tiếng lạ” là cách dùng thông dụng hơn. Chú thích có thể bảo lưu nghĩa từ vựng là “các lưỡi/ngôn ngữ” và phương án dịch khác.
