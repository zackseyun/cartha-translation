id: 1CO.14.38
reference: 1 Corinthians 14:38
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἰ δέ τις ἀγνοεῖ, ⸀ἀγνοεῖται.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/038.yaml
  text: But if anyone does not recognize this[b][a], he is not recognized.
translation:
  language: vi
  text: Nhưng nếu ai không nhìn nhận điều này[b], thì người ấy không được nhìn nhận.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Một số thủ bản chép: “nếu ai không biết, thì cứ để người ấy không biết.” Bản văn được dùng ở đây chép: “nếu ai không nhìn nhận, thì người ấy không được nhìn nhận.”'
    reason: textual_variant
  - marker: b
    text: 'Cũng có thể dịch: “không thừa nhận… không được thừa nhận” hoặc “không biết… không được biết đến.” Trong tiếng Hy Lạp, cùng một động từ được dùng ở thể chủ động rồi thể bị động để tạo hiệu quả đối ứng.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ
  choice: nếu
  rationale: Tiểu từ điều kiện được chuyển tự nhiên bằng “nếu”, không thêm hàm ý về tính xác thực của điều kiện.
- source_word: δέ
  choice: nhưng
  rationale: Diễn tả nét tương phản với lời khẳng định và lời kêu gọi nhìn nhận ở câu trước.
- source_word: τις
  choice: ai
  rationale: Đại từ bất định số ít mang nghĩa khái quát; “ai” là cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: ἀγνοεῖ
  choice: không nhìn nhận
  rationale: Trong ngữ cảnh câu 37, động từ chỉ việc không nhận biết hoặc không thừa nhận điều Phao-lô vừa nói. Cách dịch này giữ được độ mở giữa thiếu nhận biết và từ chối thừa nhận.
- source_word: ἀγνοεῖται
  choice: không được nhìn nhận
  rationale: Giữ thể bị động và lặp lại cùng cụm từ để phản ánh phép đối ứng tu từ giữa ἀγνοεῖ và ἀγνοεῖται, đồng thời không xác định thêm tác nhân.
theological_decisions:
- issue: Ý nghĩa của thể bị động ἀγνοεῖται
  choice: “người ấy không được nhìn nhận”, theo nghĩa đối ứng hoặc mang tính phán xét
  alternative: “hãy cứ để người ấy không biết” theo dị bản; hoặc “người ấy không được biết đến”
  rationale: Bản SBLGNT có động từ bị động, trực thuyết ἀγνοεῖται chứ không phải mệnh lệnh. Bản dịch giữ nguyên thể bị động và không nói rõ người không nhìn nhận người ấy là Đức Chúa Trời hay cộng đồng, nhờ đó tránh giải quyết quá mức sự mơ hồ của câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cụm “không nhìn nhận… không được nhìn nhận” bảo toàn sự lặp từ của nguyên văn, còn “điều này” nối tự nhiên với nội dung ở câu trước. Các dấu chú thích đều xuất hiện trong chính văn.
