  text: ἐὰν δὲ ἄλλῳ ἀποκαλυφθῇ καθημένῳ, ὁ πρῶτος σιγάτω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/030.yaml
  text: But if a revelation is given to another who is seated[b][a], let the first be silent.
translation:
  language: vi
  text: Nhưng nếu có điều gì được mặc khải cho một người khác đang ngồi[a], thì người đang nói trước phải im lặng[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “nếu một người khác đang ngồi nhận được sự mặc khải.”'
    reason: lexical_alternative
  - marker: b
    text: Nghĩa là người đang nói trước phải ngừng nói để người kia có thể nói.
    reason: cross_reference
lexical_decisions:
- source_word: ἐὰν δὲ
  choice: Nhưng nếu
  rationale: ἐὰν mở đầu điều kiện, còn δὲ đánh dấu sự chuyển ý hoặc tương phản nhẹ trong chuỗi chỉ dẫn.
- source_word: ἄλλῳ
  choice: một người khác
  rationale: Dạng tặng cách số ít chỉ một người tham dự khác với người đang nói; cách diễn đạt này tự nhiên và rõ trong tiếng Việt.
- source_word: ἀποκαλυφθῇ
  choice: được ban cho một sự mặc khải
  rationale: Dạng thụ động giả định của ἀποκαλύπτω diễn tả điều được bày tỏ. Cách dịch này giữ thể thụ động và ý về một thông điệp mặc khải trong ngữ cảnh, nhưng không nêu rõ tác nhân vốn không xuất hiện trong câu Hy Lạp.
- source_word: καθημένῳ
  choice: đang ngồi
  rationale: Phân từ hiện tại bổ nghĩa cho ἄλλῳ, giữ nguyên hình ảnh người kia đang ngồi trong hội chúng.
- source_word: ὁ πρῶτος
  choice: người thứ nhất
  rationale: Giữ cách nói ngắn gọn của nguyên văn; trong ngữ cảnh, đây là người đang nói trước.
- source_word: σιγάτω
  choice: phải ngừng nói
  rationale: Mệnh lệnh ngôi ba của σιγάω trong ngữ cảnh luân phiên phát biểu có nghĩa người nói trước cần thôi nói để nhường lời; cách dịch này truyền đạt tự nhiên lực mệnh lệnh.
theological_decisions:
- issue: Bản chất và tác nhân của sự mặc khải trong lời tiên tri giữa hội chúng
  choice: Dùng thể thụ động “được ban cho một sự mặc khải” mà không nêu tác nhân.
  alternative: “có điều gì được mặc khải cho một người khác” hoặc “một người khác nhận được sự mặc khải từ Đức Chúa Trời”
  rationale: Ngữ cảnh cho thấy đây là sự mặc khải, nhưng câu Hy Lạp không nêu đích danh tác nhân. Bản dịch không thêm “từ Đức Chúa Trời,” đồng thời chú thích bảo tồn cách hiểu sát cấu trúc động từ hơn.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Sự mặc khải” giữ thuật ngữ thần học quen thuộc; “phải ngừng nói” tự nhiên hơn lối dịch sát chữ “hãy im lặng” trong ngữ cảnh điều phối việc phát biểu.
