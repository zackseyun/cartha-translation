revisions:
- from: Nhưng nếu một người khác đang ngồi được ban cho một sự mặc khải[a], thì người thứ nhất phải ngừng nói[b].
  to: Nhưng nếu có điều gì được mặc khải cho một người khác đang ngồi[a], thì người đang nói trước phải im lặng[b].
  rationale: Sửa bản văn để diễn đạt trực tiếp động từ thụ động Hy Lạp mà không danh từ hóa quá mức, đồng thời thay cách gọi dễ mơ hồ “người thứ nhất” bằng quy chiếu ngữ cảnh rõ ràng. Các chú thích giữ đúng vị trí neo và bảo tồn phương án diễn đạt theo cách hiểu “một sự mặc khải”.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T18:13:53Z'
review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng điều kiện, người nhận khác đang ngồi, và yêu cầu người nói trước ngừng phát biểu. Tuy nhiên, “được ban cho một sự mặc khải” vừa thêm danh từ “một sự mặc khải” không hiện diện minh nhiên trong câu Hy Lạp, vừa khiến câu tiếng Việt hơi gượng. Cấu trúc “có điều gì được mặc khải cho...” sát với ἀποκαλυφθῇ hơn và bảo toàn tính không nêu rõ nội dung/tác nhân của nguyên văn.
  naturalness: “Một sự mặc khải” không phải kết hợp từ tự nhiên trong văn phong tiếng Việt hiện đại; “có điều gì được mặc khải” tự nhiên hơn. “Người đang nói trước” làm rõ cách quy chiếu theo ngữ cảnh của ὁ πρῶτος mà không thêm nội dung thần học.
  terminology: Giữ “mặc khải” là thuật ngữ phù hợp. “Phải im lặng” phản ánh trực tiếp mệnh lệnh σιγάτω; chú thích giải thích đúng hệ quả thực hành là người nói trước nhường lời.
  issues:
  - severity: medium
    issue: Cụm “được ban cho một sự mặc khải” gượng và cụ thể hóa cấu trúc nguyên ngữ.
    rationale: ἀποκαλυφθῇ là động từ thụ động “được mặc khải/được bày tỏ”; câu không có danh từ tương đương “một sự mặc khải”. Dù ngữ cảnh hỗ trợ ý một lời mặc khải, cách “có điều gì được mặc khải” sát cấu trúc và tự nhiên hơn.
  - severity: low
    issue: “Người thứ nhất” thiếu rõ ràng trong tiếng Việt khi đứng riêng.
    rationale: Trong ngữ cảnh, ὁ πρῶτος chỉ người đang phát biểu trước đó. “Người đang nói trước” chuyển tải chính xác quy chiếu ngữ cảnh này.
