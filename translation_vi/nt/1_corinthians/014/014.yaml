id: 1CO.14.14
reference: 1 Corinthians 14:14
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐὰν γὰρ προσεύχωμαι γλώσσῃ, τὸ πνεῦμά μου προσεύχεται, ὁ δὲ νοῦς μου ἄκαρπός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/014.yaml
  text: For if I pray in a tongue[a], my spirit prays[b], but my mind is unfruitful.
translation:
  language: vi
  text: Vì nếu tôi cầu nguyện bằng tiếng lạ[a], thần trí tôi cầu nguyện, nhưng tâm trí tôi thì không kết quả[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “bằng một ngôn ngữ.” Từ Hy Lạp có thể chỉ một ngôn ngữ của loài người hoặc “tiếng lạ” theo nghĩa được dùng xuyên suốt chương này về lời nói được Thánh Linh ban khả năng.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “nhưng sự hiểu biết của tôi không sinh hoa trái.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν γὰρ
  choice: Vì nếu
  rationale: “Vì” giữ chức năng giải thích của γάρ trong mạch lập luận, còn “nếu” thể hiện điều kiện do ἐάν đưa vào.
- source_word: προσεύχωμαι
  choice: tôi cầu nguyện
  rationale: Thì hiện tại giả định sau ἐάν được chuyển tự nhiên sang tiếng Việt bằng động từ hiện tại trong mệnh đề điều kiện.
- source_word: γλώσσῃ
  choice: bằng tiếng lạ
  rationale: Cách nói này phù hợp với ngữ cảnh về hiện tượng nói tiếng lạ trong chương 14, đồng thời chú thích giữ lại khả năng từ Hy Lạp chỉ một ngôn ngữ.
- source_word: τὸ πνεῦμά μου
  choice: tâm linh tôi
  rationale: Giữ đại từ sở hữu và sự đối lập với “tâm trí tôi”, không đồng nhất rõ ràng πνεῦμα với Đức Thánh Linh.
- source_word: προσεύχεται
  choice: cầu nguyện
  rationale: Thể hiện tự nhiên hành động ở hiện tại và giữ phép lặp có chủ ý với động từ trong mệnh đề đầu.
- source_word: ὁ δὲ νοῦς μου
  choice: nhưng tâm trí tôi
  rationale: “Tâm trí” là cách tương đương rộng và trang trọng cho νοῦς, giữ được sự đối lập với “tâm linh” mà không thu hẹp nghĩa chỉ còn trí năng.
- source_word: ἄκαρπός ἐστιν
  choice: không sinh hoa trái
  rationale: Giữ nguyên hình ảnh ẩn dụ về hoa trái của ἄκαρπος, đồng thời diễn đạt tự nhiên hơn một tính từ ghép cứng trong tiếng Việt.
theological_decisions:
- issue: Đối tượng được chỉ bởi “tâm linh tôi” (τὸ πνεῦμά μου)
  choice: Tâm linh của chính người cầu nguyện
  alternative: Đức Thánh Linh ở trong người cầu nguyện
  rationale: Đại từ sở hữu “tôi” và sự đối lập song song với “tâm trí tôi” nghiêng về hai phương diện nơi người nói. Bản dịch vẫn dùng cách diễn đạt sát văn bản, không thêm lời giải thích nhằm loại bỏ hoàn toàn khả năng thần học khác.
- issue: Bản chất của γλώσσῃ
  choice: “Tiếng lạ” theo cách gọi quen thuộc trong ngữ cảnh chương này
  alternative: Một ngôn ngữ của loài người
  rationale: Từ Hy Lạp có thể chỉ ngôn ngữ, còn ngữ cảnh nói đến lời nói được Thánh Linh ban khả năng. Chú thích nêu khả năng từ vựng thay vì buộc câu chính phải giải quyết bản chất của hiện tượng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Tâm linh” và “tâm trí” giữ sự đối lập trong nguyên văn; “không sinh hoa trái” bảo tồn ẩn dụ của Phao-lô. Các chú thích duy trì những khả năng nghĩa quan trọng mà không áp đặt cách giải thích giáo phái.
