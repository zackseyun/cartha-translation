base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/029.yaml
  text: Let two or three prophets speak[a], and let the others weigh what is said.
translation:
  language: vi
  text: Hai hoặc ba nhà tiên tri hãy nói; còn những người khác hãy phân định điều được nói ra.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “phán xét” hoặc “đánh giá”. Động từ Hy Lạp ở đây có thể chỉ việc thẩm định lời tiên tri.
    reason: lexical_alternative
lexical_decisions:
- source_word: προφῆται
  choice: các nhà tiên tri
  rationale: Danh từ chỉ các nhà tiên tri hoặc những người phát ngôn lời tiên tri; cách dịch trực tiếp này phù hợp với quy định của Phao-lô về việc phát biểu trong hội chúng.
- source_word: δὲ
  choice: còn
  rationale: Tiểu từ này đánh dấu một bước chuyển nhẹ trong chuỗi chỉ dẫn; “còn” tạo sự nối tiếp tự nhiên mà không nhấn mạnh sự tương phản quá mức.
- source_word: δύο ἢ τρεῖς
  choice: hai hoặc ba
  rationale: Giữ nguyên cách diễn đạt số lượng rõ ràng của nguyên văn.
- source_word: λαλείτωσαν
  choice: hãy để ... nói
  rationale: Thể mệnh lệnh ngôi thứ ba số nhiều được chuyển thành một lời chỉ dẫn tự nhiên trong tiếng Việt, đồng thời giữ lực mệnh lệnh.
- source_word: οἱ ἄλλοι
  choice: những người khác
  rationale: Giữ nguyên sự không xác định của nguyên văn về việc đây là các nhà tiên tri khác, những người có trách nhiệm, hay những người khác trong hội chúng.
- source_word: διακρινέτωσαν
  choice: hãy xem xét điều được nói ra
  rationale: Trong ngữ cảnh này, động từ nói đến việc phân định hoặc đánh giá lời tiên tri, chứ không nhất thiết là kết án. “Xem xét” diễn đạt sự thẩm định cẩn trọng bằng tiếng Việt tự nhiên; bổ ngữ được nêu rõ theo ngữ cảnh.
theological_decisions:
- issue: Danh tính của “những người khác” trong hội chúng
  choice: Giữ cách gọi chung là “những người khác”.
  alternative: “các nhà tiên tri khác” hoặc “những người còn lại trong hội chúng”
  rationale: Nguyên văn không xác định rõ nhóm này. Bản dịch không quyết định thay cho văn bản một vấn đề về cơ cấu hoặc thẩm quyền trong hội chúng.
- issue: Đối tượng của hành động διακρίνω
  choice: Diễn đạt là xem xét “điều được nói ra”.
  alternative: Dịch tuyệt đối là “hãy phân định” hoặc “hãy phán xét”.
  rationale: Đối tượng không được nói thành lời trong tiếng Hy Lạp nhưng được hiểu từ ngữ cảnh là lời tiên tri vừa được phát biểu. Cách dịch này làm rõ nghĩa hàm ẩn mà không xác định trước kết quả của việc đánh giá.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc mệnh lệnh được giữ rõ; “những người khác” bảo toàn sự mơ hồ có chủ ý của nguyên văn.
