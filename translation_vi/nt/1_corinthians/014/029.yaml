- from: Hãy để hai hoặc ba nhà tiên tri nói, còn những người khác hãy xem xét điều được nói ra.[a]
  to: Hai hoặc ba nhà tiên tri hãy nói; còn những người khác hãy phân định điều được nói ra.[a]
  rationale: Điều chỉnh cấu trúc mệnh lệnh để tránh hàm ý một người điều phối phải «cho phép» các nhà tiên tri nói, đồng thời dùng «phân định» để diễn đạt sát hơn hành động đánh giá lời tiên tri. Bản sửa vẫn giữ mở danh tính của «những người khác» và không áp đặt cách hiểu về cơ cấu hội chúng.
