id: 1CO.14.2
reference: 1 Corinthians 14:2
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ γὰρ λαλῶν γλώσσῃ οὐκ ἀνθρώποις λαλεῖ ⸀ἀλλὰ θεῷ, οὐδεὶς γὰρ ἀκούει, πνεύματι δὲ λαλεῖ μυστήρια·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/002.yaml
  text: For the one speaking in a tongue does not speak to people but to God, for no one understands; rather, he speaks mysteries in the Spirit.
translation:
  language: vi
  text: Vì người nói bằng một thứ tiếng lạ không nói với người ta, mà nói với Đức Chúa Trời, bởi không ai hiểu được[a]; nhưng người ấy nói những điều mầu nhiệm trong Thánh Linh[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hoặc “không ai nghe”. Động từ Hy Lạp có thể mang nghĩa “nghe”, hoặc trong ngữ cảnh này hàm ý “hiểu”.
    reason: lexical_alternative
  - marker: b
    text: Hoặc “trong tâm thần của người nói”. Cụm từ Hy Lạp có thể chỉ Thánh Linh hoặc tâm thần của người nói.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ λαλῶν
  choice: người nói
  rationale: Mạo từ đi với phân từ hiện tại tạo thành danh từ chỉ một người nói nói chung; cách dịch này tự nhiên và không thêm giới tính.
- source_word: γλώσσῃ
  choice: bằng một thứ tiếng lạ
  rationale: Danh từ số ít chỉ hiện tượng nói tiếng lạ trong ngữ cảnh chương 14. Thêm “lạ” giúp tiếng Việt hiện đại nhận ra nghĩa ngữ cảnh mà không đồng nhất rõ ràng hiện tượng này với một ngoại ngữ cụ thể.
- source_word: ἀνθρώποις
  choice: với người ta
  rationale: Dạng số nhiều mang nghĩa khái quát về con người, không riêng nam giới; “người ta” tự nhiên trong thế đối lập với Đức Chúa Trời.
- source_word: θεῷ
  choice: với Đức Chúa Trời
  rationale: Dịch trực tiếp đối tượng gián tiếp của động từ “nói”, theo lối xưng gọi trang trọng và quen thuộc trong Kinh Thánh tiếng Việt.
- source_word: ἀκούει
  choice: hiểu được
  rationale: Động từ có nghĩa cơ bản là “nghe”, nhưng trong mạch văn về lời nói không truyền đạt được ý nghĩa, hàm ý “nghe hiểu”. Nghĩa sát chữ được giữ trong chú thích.
- source_word: πνεύματι
  choice: trong Thánh Linh
  rationale: Cách dịch này thể hiện một cách hiểu hợp lý về πνεῦμα trong văn chương Phao-lô, nhưng giới từ “trong” tránh diễn giải mạnh như “bởi”; khả năng nói về tâm linh của người nói được nêu trong chú thích.
- source_word: μυστήρια
  choice: những điều mầu nhiệm
  rationale: Giữ sắc thái thần học của μυστήριον và tự nhiên hơn danh từ trừu tượng “các mầu nhiệm” trong câu tiếng Việt.
- source_word: δὲ
  choice: nhưng
  rationale: Liên từ này đánh dấu sự tương phản với việc không ai hiểu; “nhưng” vừa sát nghĩa vừa tự nhiên.
theological_decisions:
- issue: Đối tượng chỉ bởi πνεύματι
  choice: Dịch “trong Thánh Linh” ở chính văn
  alternative: “trong tâm linh” hoặc “bởi Thánh Linh”
  rationale: Dạng tặng cách Hy Lạp không tự xác định đây là Thánh Linh hay tâm linh của người nói, cũng có thể được hiểu theo sắc thái phương tiện. Chính văn chọn một cách đọc hợp lý nhưng chú thích giữ lại sự mơ hồ thần học có thật.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Trời” và “Thánh Linh” theo lối gọi Kinh Thánh phổ biến; giữ cấu trúc lập luận của nguyên văn và đánh dấu đầy đủ các chú thích [a], [b] trong chính văn.
