  to: Bằng không, nếu bạn chúc tụng bằng tâm thần[b], thì người ở vào vị trí của người không am hiểu[a] làm sao có thể đáp “A-men” cho lời cảm tạ[c] của bạn, vì người ấy không biết bạn đang nói gì?
  rationale: Sửa “trong tâm linh” thành “bằng tâm thần” để tiếng Việt tự nhiên hơn và phù hợp mạch văn, mà vẫn bảo lưu tính không xác định của πνεύματι. Sửa cách gọi người nghe và cụm chỉ vị trí để phản ánh rõ hơn ὁ ἀναπληρῶν τὸν τόπον τοῦ ἰδιώτου. Đổi “lời tạ ơn” thành “lời cảm tạ” và “với” thành “cho” chỉ nhằm tăng độ tự nhiên, không đổi nghĩa.
