reference: 1 Corinthians 14:16
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐπεὶ ἐὰν ⸀εὐλογῇς ⸀πνεύματι, ὁ ἀναπληρῶν τὸν τόπον τοῦ ἰδιώτου πῶς ἐρεῖ τὸ Ἀμήν ἐπὶ τῇ σῇ εὐχαριστίᾳ; ἐπειδὴ τί λέγεις οὐκ οἶδεν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/016.yaml
  text: Otherwise[a], if you bless in the spirit, how will the one filling the place of the uninstructed say the Amen at your thanksgiving[c][b], since he does not know what you are saying?
translation:
  language: vi
  text: Bằng không, nếu bạn chúc tụng bằng tâm thần[b], thì người ở vào vị trí của người không am hiểu[a] làm sao có thể đáp “A-men” cho lời cảm tạ[c] của bạn, vì người ấy không biết bạn đang nói gì?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “người ngoài cuộc”, “người bình thường” hoặc “người không có kiến thức chuyên biệt”.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “trong tâm thần”; tiếng Hy Lạp ở đây không buộc phải hiểu theo một nghĩa cụ thể hơn.
    reason: alternative_reading
  - marker: c
    text: “Lời cảm tạ” ở đây chỉ việc dâng lời cảm tạ, không nhất thiết là thuật ngữ kỹ thuật “Thánh Thể” xuất hiện về sau.
    reason: cultural_note
lexical_decisions:
- source_word: ἐπεὶ ἐὰν
  choice: Bằng không, nếu
  rationale: Cụm từ mở ra một tình huống có điều kiện, đồng thời nêu hệ quả thực tế từ lập luận ngay trước đó. “Bằng không, nếu” giữ được cả sắc thái hiệu chỉnh lẫn điều kiện.
- source_word: εὐλογῇς
  choice: bạn chúc tụng
  rationale: Động từ chỉ hành động nói lời tốt lành, chúc phước hoặc ca ngợi. Trong ngữ cảnh thờ phượng và tạ ơn, “chúc tụng” là cách diễn đạt tự nhiên và trang trọng.
- source_word: πνεύματι
  choice: trong tâm linh
  rationale: Cách dịch này giữ tương đối rộng nghĩa của cách dữ cách, không ấn định đó là phương tiện hay phạm vi, cũng không xác quyết đang nói đến tâm linh con người hay hoạt động do Thánh Linh ban năng lực.
- source_word: ὁ ἀναπληρῶν τὸν τόπον
  choice: người ở vị trí
  rationale: Diễn đạt tự nhiên thành ngữ chỉ người đang chiếm hoặc đảm nhận một vị trí trong buổi nhóm, đồng thời vẫn giữ hình ảnh về vị trí có trong nguyên văn.
- source_word: τοῦ ἰδιώτου
  choice: của người chưa được chỉ dẫn
  rationale: Trong văn cảnh, điểm nhấn là người ấy không có sự hiểu biết cần thiết để hiểu lời đang được nói. Cách dịch này tránh mặc nhiên coi người ấy là người ngoài cộng đồng; các khả năng khác được ghi ở chú thích.
- source_word: πῶς ἐρεῖ τὸ Ἀμήν
  choice: làm sao có thể đáp “A-men”
  rationale: “Đáp” làm rõ đây là lời hưởng ứng công khai của người nghe, còn “A-men” giữ nguyên từ dùng trong sinh hoạt thờ phượng và ý nghĩa xác nhận.
- source_word: ἐπὶ τῇ σῇ εὐχαριστίᾳ
  choice: với lời tạ ơn của bạn
  rationale: “Lời tạ ơn” chỉ hành động hay lời nói cảm tạ trong buổi nhóm. Giới từ được diễn đạt bằng “với” để câu tiếng Việt tự nhiên và thể hiện rằng lời A-men hưởng ứng lời tạ ơn ấy.
- source_word: ἐπειδὴ τί λέγεις οὐκ οἶδεν
  choice: vì người ấy không biết bạn đang nói gì
  rationale: Bám sát cấu trúc nguyên văn và nêu rõ lý do người nghe không thể hưởng ứng bằng A-men, mà không thay “biết” bằng một cách giải nghĩa mạnh hơn.
theological_decisions:
- issue: Ý nghĩa của πνεύματι trong bối cảnh thờ phượng có ân tứ
  choice: Dịch là “trong tâm linh” mà không xác định rõ đối tượng quy chiếu.
  alternative: “bằng tâm linh”; “bởi Thánh Linh”
  rationale: Nguyên văn có thể được hiểu theo nghĩa phương tiện hoặc phạm vi, và câu này không buộc phải xác định đó là tâm linh người nói hay lời nói do Thánh Linh ban năng lực. Cách dịch rộng giữ nguyên độ mở thần học.
- issue: Ý nghĩa của εὐχαριστίᾳ
  choice: Dịch là “lời tạ ơn”, không dùng một thuật ngữ bí tích chuyên biệt.
  alternative: “Thánh Thể”
  rationale: Văn cảnh trực tiếp nói về lời cảm tạ có thể hiểu được trong buổi nhóm. Dùng thuật ngữ kỹ thuật hình thành về sau sẽ đưa vào câu một mức độ chuyên biệt mà tiếng Hy Lạp ở đây không đòi hỏi.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. “Chúc tụng”, “lời tạ ơn” và “A-men” phù hợp bối cảnh thờ phượng; cấu trúc câu giữ mạch lập luận hỏi tu từ của nguyên văn.
