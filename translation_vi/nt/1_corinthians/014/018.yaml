  text: I thank God that I speak in tongues more than all of you[a].
translation:
  language: vi
  text: 'Tôi cảm tạ Đức Chúa Trời: tôi nói các thứ tiếng lạ nhiều hơn tất cả anh chị em[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “tôi nói các ngôn ngữ nhiều hơn tất cả anh chị em.” Từ Hy Lạp có thể có nghĩa là “các ngôn ngữ”, nhưng trong văn cảnh này, từ ấy chỉ hiện tượng được bàn luận xuyên suốt 1 Cô-rinh-tô 12–14 và theo truyền thống được dịch là “các thứ tiếng lạ”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐχαριστῶ
  choice: Tôi cảm tạ
  rationale: Động từ hiện tại chủ động, ngôi thứ nhất số ít. “Cảm tạ” là cách diễn đạt tự nhiên, trang trọng vừa phải trong văn cảnh hướng về Đức Chúa Trời.
- source_word: τῷ θεῷ
  choice: Đức Chúa Trời
  rationale: Danh từ ở cách tặng làm bổ ngữ cho εὐχαριστέω; tiếng Việt diễn đạt tự nhiên là “cảm tạ Đức Chúa Trời”.
- source_word: πάντων ὑμῶν μᾶλλον
  choice: nhiều hơn tất cả anh chị em
  rationale: Cấu trúc so sánh với μᾶλλον và sở hữu cách số nhiều πάντων ὑμῶν được thể hiện rõ bằng “nhiều hơn tất cả anh chị em”; không buộc phải hiểu là từng cá nhân riêng lẻ.
- source_word: γλώσσαις
  choice: các thứ tiếng lạ
  rationale: Trong 1 Cô-rinh-tô 12–14, từ này chỉ hiện tượng thuộc linh đang được bàn luận. Cách dịch truyền thống “các thứ tiếng lạ” giữ được thuật ngữ theo văn cảnh mà không xác định đó nhất thiết là ngôn ngữ nhân loại hay lời nói xuất thần.
- source_word: λαλῶ
  choice: tôi nói
  rationale: Hiện tại chủ động, ngôi thứ nhất số ít; “tôi nói” truyền đạt tự nhiên sắc thái khẳng định của động từ.
theological_decisions:
- issue: Cách dịch γλώσσαις trong văn cảnh bàn về ân tứ
  choice: các thứ tiếng lạ
  alternative: các ngôn ngữ
  rationale: “Các thứ tiếng lạ” nhận diện hiện tượng được bàn xuyên suốt các chương 12–14 nhưng không phân xử bản chất đang gây tranh luận của hiện tượng ấy. “Các ngôn ngữ” khả dĩ về mặt từ vựng, song có thể khiến người đọc hiểu hẹp rằng đây nhất thiết là các ngôn ngữ nhân loại.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh chị em” để diễn đạt đại từ số nhiều ὑμῶν theo lối xưng hô tự nhiên với cộng đồng tín hữu; không thêm “rằng” vì mệnh đề Hy Lạp không có ὅτι và quan hệ ý nghĩa có thể được diễn đạt gọn bằng “vì”.
