id: 1CO.14.24
reference: 1 Corinthians 14:24
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐὰν δὲ πάντες προφητεύωσιν, εἰσέλθῃ δέ τις ἄπιστος ἢ ἰδιώτης, ἐλέγχεται ὑπὸ πάντων, ἀνακρίνεται ὑπὸ πάντων,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/024.yaml
  text: But if all prophesy[a], and some unbeliever or uninstructed person enters, he is convicted by all; he is examined by all.
translation:
  language: vi
  text: Nhưng nếu tất cả đều nói tiên tri, và một người không tin hay chưa hiểu biết[a] bước vào, người ấy sẽ bị mọi người vạch ra, bị mọi người khảo xét.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “người ngoài”. Từ Hy Lạp có thể chỉ người không am hiểu, chưa được hướng dẫn, hoặc không thuộc nhóm đang tham gia.
    reason: Giữ một cách hiểu hợp lý khác của ἰδιώτης mà không buộc người đọc phải xem người này hoàn toàn ở ngoài hội chúng.
lexical_decisions:
- source_word: πάντες
  choice: tất cả / mọi người
  rationale: Giữ nghĩa bao quát của lượng từ và thể hiện tự nhiên trong tiếng Việt; lần đầu chỉ những người đang nói tiên tri, hai lần sau nằm trong cụm tác nhân 'bị mọi người...'.
- source_word: προφητεύωσιν
  choice: nói tiên tri
  rationale: Giữ thuật ngữ quen thuộc của Phao-lô trong chương này, không thu hẹp thành dự báo tương lai hay giải thích quá mức là lời được soi dẫn.
- source_word: ἄπιστος
  choice: người không tin
  rationale: Trong ngữ cảnh này, từ này chỉ người chưa tin, thay vì mang nghĩa người bất trung.
- source_word: ἰδιώτης
  choice: người chưa hiểu biết
  rationale: Diễn đạt người thiếu hiểu biết hoặc chưa quen với điều đang diễn ra trong hội chúng, không áp đặt phạm trù giáo hội hiện đại; khả năng hiểu là 'người ngoài' được giữ trong chú thích.
- source_word: ἐλέγχεται
  choice: bị thuyết phục về tội lỗi
  rationale: Truyền đạt việc lời nói khiến tình trạng sai trái của người ấy bị phơi bày và người ấy nhận biết mình có tội; tự nhiên hơn cách dịch pháp lý 'bị kết tội' trong tiếng Việt.
- source_word: ἀνακρίνεται
  choice: bị xem xét
  rationale: Giữ nghĩa khảo xét hoặc thẩm định mà không nâng thành sự phán xét chung cuộc.
- source_word: ὑπὸ πάντων
  choice: bị mọi người
  rationale: Giữ nguyên sự lặp lại có chủ ý của cụm từ Hy Lạp ở cả hai vế.
- source_word: δέ
  choice: nhưng / và
  rationale: δέ thứ nhất đánh dấu sự tương phản với tình huống trước; δέ thứ hai được diễn đạt bằng 'và' để câu điều kiện tự nhiên trong tiếng Việt.
- source_word: τις
  choice: một người
  rationale: Diễn đạt đại từ bất định tự nhiên trước hai mô tả thay thế.
theological_decisions:
- issue: Ý nghĩa của ἰδιώτης trong bối cảnh hội chúng
  choice: người chưa hiểu biết
  alternative: người ngoài; người không am hiểu
  rationale: Bối cảnh trực tiếp nhấn mạnh tính dễ hiểu và tác động của lời nói trong hội chúng đối với người thiếu hiểu biết. Cách dịch này không quyết định rằng người ấy nhất thiết hoàn toàn ở ngoài cộng đồng; nghĩa 'người ngoài' vẫn được ghi nhận trong chú thích.
- issue: Sắc thái của ἐλέγχεται
  choice: bị thuyết phục về tội lỗi
  alternative: bị vạch lỗi; bị cáo trách; bị kết tội
  rationale: Động từ bao gồm sự phơi bày và xác chứng lỗi lầm. Trong mạch văn dẫn đến việc các điều kín giấu trong lòng bị bày tỏ, cách dịch đã chọn nêu rõ sự cáo trách đạo đức nhưng không hàm ý bản án pháp lý hay sự kết án chung cuộc.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ cấu trúc điều kiện, cặp 'người không tin hoặc một người chưa hiểu biết', cùng sự lặp lại 'bị mọi người' của nguyên văn.
