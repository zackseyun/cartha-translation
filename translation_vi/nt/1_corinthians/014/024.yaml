revisions:
- from: Nhưng nếu tất cả đều nói tiên tri, và có một người không tin hoặc một người chưa hiểu biết[a] bước vào, người ấy sẽ bị mọi người thuyết phục về tội lỗi, bị mọi người xem xét.
  to: Nhưng nếu tất cả đều nói tiên tri, và một người không tin hay chưa hiểu biết[a] bước vào, người ấy sẽ bị mọi người vạch ra, bị mọi người khảo xét.
  rationale: Sửa “bị thuyết phục về tội lỗi” thành “bị ... vạch ra” để tránh thêm đối tượng “tội lỗi” không được nêu trong câu, đồng thời vẫn phản ánh tác động cáo trách/phơi bày của ἐλέγχεται. Dùng “khảo xét” cho ἀνακρίνεται và làm gọn danh ngữ bất định để tiếng Việt tự nhiên hơn. Chú thích được chỉnh cho sát phạm vi nghĩa của ἰδιώτης.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T18:13:10Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch giữ đúng cấu trúc điều kiện, sự đối lập với bối cảnh trước, nghĩa bao quát của πάντες, và sự lặp lại của ὑπὸ πάντων. Tuy nhiên, thêm “về tội lỗi” vào ἐλέγχεται giải thích/hẹp nghĩa hơn nguyên văn: động từ diễn tả bị vạch ra, bị cáo trách hoặc bị thuyết phục về lỗi lầm, nhưng câu này không nêu trực tiếp “tội lỗi”.'
  naturalness: 'Câu văn hiện đại và dễ đọc. Dùng “một người không tin hoặc một người chưa hiểu biết” hơi nặng và có thể tự nhiên hơn với một danh ngữ chung: “một người không tin hay chưa hiểu biết”. “Bị mọi người xem xét” dễ gợi cảnh người ấy bị các cá nhân trong hội chúng trực tiếp xét hỏi; “bị mọi người khảo xét” phản ánh tốt hơn sắc thái xem xét/scrutinize mà vẫn giữ cấu trúc bị động của nguyên văn.'
  terminology: “Nói tiên tri” phù hợp và nhất quán với thuật ngữ của chương. “Người không tin” phù hợp cho ἄπιστος. “Người chưa hiểu biết” là một lựa chọn khả dĩ cho ἰδιώτης, với chú thích bảo lưu “người ngoài”; tuy nhiên nên diễn đạt chú thích chính xác hơn là thiếu hiểu biết/kinh nghiệm liên quan hoặc không thuộc nhóm, không khẳng định quá cụ thể “nhóm đang nói”.
  issues:
  - severity: medium
    issue: “về tội lỗi” được thêm vào bản văn chính.
    rationale: ἐλέγχεται có thể mang sắc thái cáo trách, vạch lỗi, thuyết phục về lỗi lầm hay phơi bày; nhưng “tội lỗi” không xuất hiện trong câu Hy Lạp. Thêm cụm này làm bản dịch diễn giải hơn và có thể đi trước sự triển khai ở câu 25.
  - severity: low
    issue: Cấu trúc “một người không tin hoặc một người chưa hiểu biết” không cần lặp “một người”.
    rationale: τις là một người bất định được mô tả bằng hai khả năng. “Một người không tin hay chưa hiểu biết” tự nhiên hơn mà vẫn giữ nguyên quan hệ lựa chọn.
  - severity: low
    issue: “Bị mọi người xem xét” có thể gây hiểu là việc người nghe bị hội chúng xét hỏi trực tiếp.
    rationale: ἀνακρίνεται chủ yếu là được khảo xét/scrutinized. “Khảo xét” giữ sắc thái đánh giá kỹ hơn và phù hợp hơn trong văn phong Kinh Thánh hiện đại.
  revised_text: Nhưng nếu tất cả đều nói tiên tri, và một người không tin hay chưa hiểu biết[a] bước vào, người ấy sẽ bị mọi người vạch ra, bị mọi người khảo xét.
