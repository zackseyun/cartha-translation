reference: 1 Corinthians 14:19
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀλλὰ ἐν ἐκκλησίᾳ θέλω πέντε λόγους ⸂τῷ νοΐ⸃ μου λαλῆσαι, ἵνα καὶ ἄλλους κατηχήσω, ἢ μυρίους λόγους ἐν γλώσσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/019.yaml
  text: But in the church I would rather speak five words with my mind[a], so that I may also instruct others, than ten thousand words in a tongue.
translation:
  language: vi
  text: Nhưng trong hội thánh, tôi thà nói năm lời với sự hiểu biết của mình để cũng chỉ dạy người khác, còn hơn nói mười ngàn lời bằng một thứ tiếng[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hy Lạp γλῶσσα có thể có nghĩa là “lưỡi” hoặc “ngôn ngữ”; ở đây, từ này chỉ loại lời nói được bàn đến xuyên suốt 1 Cô-rinh-tô 12–14.
    reason: Giữ lại tính đa nghĩa của γλῶσσα mà không xác định quá mức bản chất của hiện tượng.
lexical_decisions:
- source_word: ἐν ἐκκλησίᾳ
  choice: trong hội thánh
  rationale: Trong ngữ cảnh này, từ này chỉ cộng đồng tín hữu đang nhóm lại. “Hội thánh” là cách diễn đạt quen thuộc, trang trọng và tự nhiên trong tiếng Việt.
- source_word: θέλω ... ἢ
  choice: tôi thà ... còn hơn
  rationale: Dù θέλω có nghĩa cơ bản là “muốn”, cấu trúc tương phản với ἢ biểu thị sự lựa chọn rõ rệt; “thà ... còn hơn” truyền đạt tự nhiên sắc thái ấy.
- source_word: πέντε λόγους / μυρίους λόγους
  choice: năm lời / mười ngàn lời
  rationale: Giữ nguyên hai con số và lặp lại “lời” để bảo toàn phép đối lập mạnh mẽ trong câu Hy Lạp.
- source_word: τῷ νοΐ μου
  choice: bằng tâm trí mình
  rationale: Giữ ý niệm về tâm trí và sự hiểu biết, đồng thời tránh diễn giải quá mức thành một mệnh đề như “mà tôi hiểu được”.
- source_word: κατηχήσω
  choice: chỉ dạy
  rationale: Diễn đạt việc truyền đạt sự hướng dẫn bằng lời, nhưng không đưa vào nghĩa kỹ thuật về giáo lý hoặc nghi thức về sau.
- source_word: ἐν γλώσσῃ
  choice: bằng một thứ tiếng
  rationale: Cách dịch này tự nhiên hơn “bằng một cái lưỡi” trong tiếng Việt và không tự động xác định hiện tượng này là ngoại ngữ thông thường hay lời nói xuất thần; chú thích giữ lại phạm vi nghĩa của từ Hy Lạp.
theological_decisions:
- issue: Cách dịch γλῶσσα trong bối cảnh 1 Cô-rinh-tô 12–14
  choice: bằng một thứ tiếng
  alternative: bằng tiếng lạ; bằng một ngôn ngữ; bằng lưỡi
  rationale: Bản dịch chính tránh thêm tính từ “lạ”, vốn không có trong nguyên văn, nhưng cũng không giải quyết bản chất của hiện tượng đang được nói đến. Chú thích nêu rõ nghĩa từ vựng và giữ nguyên sự căng thẳng thần học của đoạn văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc “thà ... còn hơn” làm rõ sự so sánh; “tâm trí” giữ sát thuật ngữ Hy Lạp, còn “một thứ tiếng” tránh cách nói không tự nhiên và tránh áp đặt một cách hiểu hệ phái.
