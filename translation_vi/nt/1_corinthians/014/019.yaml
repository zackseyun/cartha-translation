  to: Nhưng trong hội thánh, tôi thà nói năm lời với sự hiểu biết của mình để cũng chỉ dạy người khác, còn hơn nói mười ngàn lời bằng một thứ tiếng[a].
  rationale: Chỉ điều chỉnh cách diễn đạt τῷ νοΐ μου để tiếng Việt tự nhiên hơn và phản ánh rõ hơn sự đối lập ngữ cảnh giữa lời nói có hiểu biết và lời nói “bằng một thứ tiếng”. Các con số, phép đối lập, mục đích chỉ dạy, và sự mơ hồ có chủ ý của γλῶσσα đều được giữ nguyên.
