revisions:
- from: Vì tất cả anh chị em đều có thể lần lượt nói tiên tri,[a] để mọi người đều được học hỏi và được khích lệ.[b]
  to: Vì tất cả đều có thể lần lượt nói tiên tri,[a] để mọi người đều học hỏi và đều được khích lệ.[b]
  rationale: Chỉ thay “được học hỏi” bằng “học hỏi” để phản ánh thể chủ động của μανθάνωσιν. Đồng thời lược “anh chị em” ở mệnh đề đầu để không xác định nhóm “tất cả” cụ thể hơn mức tiếng Hy Lạp; ngôi thứ hai số nhiều và ngữ cảnh vẫn được giữ qua cấu trúc câu. Các chú thích giữ nguyên, với vị trí neo chính xác.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T18:16:09Z'
review_pass:
  verdict: revise
  source_fidelity: Bản dịch truyền đạt đúng quan hệ giải thích của γάρ, khả năng của δύνασθε, trật tự của καθ’ ἕνα, và sắc thái rộng của παρακαλέω. Tuy nhiên, μανθάνωσιν là chủ động (“mọi người ... học”), trong khi “được học hỏi” chuyển thành cách diễn đạt bị động/tiếp nhận và làm lệch nhẹ vai trò cú pháp của nhóm “mọi người”.
  naturalness: “Lần lượt nói tiên tri” và “được khích lệ” tự nhiên, phù hợp văn phong Kinh Thánh Việt hiện đại. “Mọi người đều học hỏi” là cách nói tự nhiên hơn và phản ánh đúng động từ chủ động.
  terminology: “Nói tiên tri” giữ được thuật ngữ προφητεύειν mà không diễn giải theo lập trường giáo phái. “Khích lệ” là lựa chọn bao quát, thích hợp cho παρακαλῶνται; chú thích nêu các sắc thái thay thế hữu ích. Dùng “tất cả” ở lần đầu và “mọi người” ở hai lần sau vẫn bảo toàn sự lặp lại và không xác định quá mức nhóm quy chiếu.
  issues:
  - severity: medium
    issue: “được học hỏi” dịch μανθάνωσιν theo cấu trúc bị động/tiếp nhận
    rationale: 'μανθάνωσιν là hiện tại chủ động, giả định cách, số nhiều: “để mọi người ... học hỏi.” Dạng “được học hỏi” có thể hiểu là được người khác dạy dỗ và không phản ánh trực tiếp hành động học của chủ thể.'
