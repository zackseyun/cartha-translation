language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: δύνασθε γὰρ καθ’ ἕνα πάντες προφητεύειν, ἵνα πάντες μανθάνωσιν καὶ πάντες παρακαλῶνται
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/031.yaml
  text: For you can all prophesy one by one[b][a], so that all may learn and all may be encouraged.
translation:
  language: vi
  text: Vì tất cả đều có thể lần lượt nói tiên tri,[a] để mọi người đều học hỏi và đều được khích lệ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “từng người một” hoặc “mỗi lần một người.”
    reason: lexical_alternative
  - marker: b
    text: Động từ Hy Lạp cũng có thể mang nghĩa “được khuyên bảo” hoặc “được an ủi,” tùy ngữ cảnh.
    reason: lexical_alternative
lexical_decisions:
- source_word: δύνασθε
  choice: có thể
  rationale: Động từ ở ngôi thứ hai số nhiều diễn tả khả năng; “có thể” là cách nói tự nhiên và phù hợp với lời chỉ dẫn thực tiễn của Phao-lô.
- source_word: γὰρ
  choice: Vì
  rationale: Giữ chức năng giải thích, nêu cơ sở cho lời chỉ dẫn ngay trước đó.
- source_word: καθ’ ἕνα
  choice: lần lượt
  rationale: Diễn tả việc từng người nói theo thứ tự, mỗi lần một người; cách dịch này tự nhiên trong ngữ cảnh giữ trật tự khi hội thánh nhóm lại.
- source_word: πάντες
  choice: tất cả / mọi người đều
  rationale: Giữ phạm vi rộng và sự nhấn mạnh do từ này được lặp lại ba lần, nhưng dùng cách diễn đạt tự nhiên theo từng vị trí trong tiếng Việt.
- source_word: προφητεύειν
  choice: nói tiên tri
  rationale: Giữ nguyên phạm trù quen thuộc trong thư Phao-lô, không thu hẹp thành giảng dạy, dự báo hay một lối nói cụ thể nào khác.
- source_word: ἵνα
  choice: để
  rationale: Diễn đạt tự nhiên quan hệ mục đích hoặc kết quả của mệnh đề.
- source_word: μανθάνωσιν
  choice: được học hỏi
  rationale: Thể chủ động trong tiếng Hy Lạp nhưng tiếng Việt tự nhiên có thể dùng “được học hỏi” để nói về lợi ích mà mọi người nhận qua lời tiên tri.
- source_word: παρακαλῶνται
  choice: được khích lệ
  rationale: Động từ παρακαλέω có thể bao hàm khích lệ, khuyên bảo hoặc an ủi. “Được khích lệ” thích hợp với tác dụng gây dựng chung trong ngữ cảnh mà không giới hạn nghĩa vào sự răn bảo hay an ủi.
theological_decisions:
- issue: Phạm vi của πάντες (“tất cả/mọi người”) trong lời chỉ dẫn dành cho hội thánh
  choice: Dịch lần đầu là “tất cả anh chị em” và hai lần sau là “mọi người đều,” không thêm “các nhà tiên tri” hay một nhóm xác định khác.
  alternative: “tất cả các nhà tiên tri” hoặc hiểu cả ba lần đều chỉ cùng một nhóm người
  rationale: Lần xuất hiện đầu có thể chỉ những người có thể nói tiên tri trong hội chúng, còn hai lần sau chỉ những người được học hỏi và khích lệ. Bản dịch giữ độ rộng của tiếng Hy Lạp và không xác định phạm vi hẹp hơn văn bản.
- issue: Ý nghĩa của προφητεύειν
  choice: “nói tiên tri”
  alternative: “rao truyền lời Chúa,” “giảng dạy” hoặc “nói lời được linh hứng”
  rationale: Văn bản gọi hoạt động này là nói tiên tri nhưng không định nghĩa chi tiết tại đây; giữ thuật ngữ tránh áp đặt một cách hiểu giáo phái.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Anh chị em” làm rõ ngôi thứ hai số nhiều trong bối cảnh hội thánh mà không dùng đại từ chỉ nam giới; “lần lượt” nhấn mạnh trật tự. Các dấu chú thích đều xuất hiện trong chính văn.
