id: 1CO.14.37
reference: 1 Corinthians 14:37
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Εἴ τις δοκεῖ προφήτης εἶναι ἢ πνευματικός, ἐπιγινωσκέτω ἃ γράφω ὑμῖν ὅτι κυρίου ⸀ἐστίν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/037.yaml
  text: If anyone thinks he is a prophet or spiritual[a], let him recognize that what I am writing to you is a command of the Lord.
translation:
  language: vi
  text: Nếu ai cho rằng mình là nhà tiên tri hoặc là người thuộc linh, người ấy phải nhìn nhận rằng những điều tôi viết cho anh chị em là mệnh lệnh của Chúa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch sát chữ: “là của Chúa” hoặc “thuộc về Chúa.” Tiếng Hy Lạp không có danh từ “mệnh lệnh”; từ này được bổ sung để làm rõ ý trong văn cảnh.'
    reason: alternative_reading
lexical_decisions:
- source_word: δοκεῖ
  choice: cho rằng mình
  rationale: Diễn tả sự tự đánh giá hoặc tự nhận của một người, đồng thời giữ được sắc thái có thể mang tính sửa dạy trong văn cảnh.
- source_word: προφήτης
  choice: nhà tiên tri
  rationale: Cách dịch thông dụng, rõ nghĩa trong văn cảnh bàn về các ân tứ và lời tiên tri.
- source_word: πνευματικός
  choice: người thuộc linh
  rationale: 'Danh từ hóa tính từ để câu tiếng Việt tự nhiên, nhưng vẫn giữ phạm vi nghĩa rộng: người tự xem mình là người có tính thuộc linh hoặc được Thánh Linh ban năng lực, hướng dẫn.'
- source_word: ἐπιγινωσκέτω
  choice: phải nhìn nhận
  rationale: Mệnh lệnh ngôi thứ ba đòi hỏi sự công nhận, thừa nhận thẩm quyền của điều Phao-lô viết; “phải” truyền đạt lực mệnh lệnh tự nhiên trong tiếng Việt.
- source_word: ἃ γράφω ὑμῖν
  choice: những điều tôi viết cho anh chị em
  rationale: Phản ánh đại từ quan hệ số nhiều và thì hiện tại, đồng thời tự nhiên trong văn phong thư tín tiếng Việt.
- source_word: κυρίου ἐστίν
  choice: là mệnh lệnh của Chúa
  rationale: Cụm Hy Lạp tỉnh lược, sát chữ là “là của Chúa”. Văn cảnh cho thấy Phao-lô khẳng định thẩm quyền ràng buộc của lời chỉ dẫn; thêm “mệnh lệnh” làm rõ nghĩa được hàm ý, còn chú thích bảo tồn cách diễn đạt nguyên văn.
theological_decisions:
- issue: Lực nghĩa tỉnh lược của κυρίου ἐστίν
  choice: “là mệnh lệnh của Chúa”
  alternative: “là của Chúa” hoặc “thuộc về Chúa”
  rationale: Bản dịch chính diễn đạt rõ lực thẩm quyền trong văn cảnh, nhưng chú thích nêu cách đọc sát chữ để không che khuất tính tỉnh lược và độ mở ngữ pháp của nguyên văn.
- issue: Giống trong τις ... προφήτης ... πνευματικός
  choice: Dùng “ai”, “mình”, “người ấy”
  alternative: Dùng đại từ giống đực như “ông ấy”
  rationale: Tiếng Hy Lạp dùng dạng giống đực số ít theo nghĩa khái quát. Tiếng Việt tự nhiên biểu đạt cá nhân bất định bằng “ai/người ấy” mà không cần gán giới tính, không làm thay đổi phạm vi quy chiếu.
- issue: Cách xưng hô của ὑμῖν
  choice: “anh chị em”
  alternative: “các bạn” hoặc “các anh em”
  rationale: “Anh chị em” là lối xưng hô cộng đồng trang trọng, dễ hiểu và bao quát hội chúng, không thêm một khẳng định thần học ngoài văn bản.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Nhà tiên tri” và “người thuộc linh” giữ thuật ngữ quen thuộc; “phải nhìn nhận” thể hiện đúng lực mệnh lệnh. Dấu chú thích [a] được đặt ngay sau mệnh đề có cách dịch tỉnh lược.
