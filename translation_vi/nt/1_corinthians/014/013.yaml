  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸀Διὸ ὁ λαλῶν γλώσσῃ προσευχέσθω ἵνα διερμηνεύῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/013.yaml
  text: Therefore[b][a], the one who speaks in a tongue should pray that he may interpret.
translation:
  language: vi
  text: Vì thế, người nói tiếng lạ[a] hãy cầu nguyện để có thể thông giải.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “nói bằng một ngôn ngữ” hoặc “nói bằng một thứ tiếng”. Từ Hy Lạp γλῶσσα nghĩa đen là “lưỡi”; trong chương này, từ này thường dùng về lời nói cần được thông giải.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể hiểu là “hãy cầu xin để có thể thông giải”. Động từ Hy Lạp ở số ít tiếp tục quy về người đang nói tiếng lạ; cách dùng số ít này mang tính đại diện, không giới hạn ở nam giới.
    reason: ambiguity_and_grammar
lexical_decisions:
- source_word: Διὸ
  choice: Vì thế
  rationale: Liên từ suy luận, nối lời khuyên này với lập luận ngay trước đó; “Vì thế” tự nhiên và giữ rõ quan hệ kết luận.
- source_word: ὁ λαλῶν
  choice: người nói
  rationale: Phân từ hiện tại có mạo từ được dùng như danh từ, chỉ một người bất kỳ đang nói; cách dịch này giữ số ít đại diện mà không gán giới tính trong tiếng Việt.
- source_word: γλώσσῃ
  choice: tiếng lạ
  rationale: Danh từ số ít ở cách tặng cách đi với “nói”. “Tiếng lạ” là cách diễn đạt quen thuộc trong tiếng Việt cho hiện tượng lời nói cần được thông giải trong chương này, nhưng chú thích vẫn giữ sự rộng nghĩa của từ Hy Lạp.
- source_word: προσευχέσθω
  choice: hãy cầu nguyện
  rationale: Mệnh lệnh cách ngôi thứ ba, hiện tại; “hãy cầu nguyện” truyền đạt trực tiếp sắc thái khuyên truyền mà vẫn tự nhiên trong tiếng Việt hiện đại.
- source_word: ἵνα
  choice: để
  rationale: Giới thiệu mục đích hoặc nội dung hướng đến của lời cầu nguyện. “Để” giữ sắc thái mục đích nổi bật mà không diễn giải dài dòng.
- source_word: διερμηνεύῃ
  choice: có thể thông giải
  rationale: Động từ chỉ việc làm cho lời nói trở nên dễ hiểu đối với người khác. “Thông giải” phù hợp với mạch văn về lời nói bằng tiếng lạ, đồng thời không thu hẹp nghĩa thành việc dịch giữa hai ngôn ngữ thông thường.
theological_decisions:
- issue: Ý nghĩa của γλώσσῃ trong 1 Cô-rinh-tô 12–14
  choice: tiếng lạ
  alternative: một ngôn ngữ; một thứ tiếng
  rationale: Mạch văn nói đến một dạng lời nói cần được thông giải trong buổi nhóm. “Tiếng lạ” giữ liên hệ văn chương và thuật ngữ xuyên suốt phân đoạn, còn chú thích tránh quyết định trước đó nhất thiết là ngôn ngữ loài người hay lời nói xuất thần.
- issue: Chủ thể của διερμηνεύῃ
  choice: chính mình có thể thông giải
  alternative: có sự thông giải; một người có thể thông giải
  rationale: Dạng động từ số ít theo sau chủ thể số ít tự nhiên nhất là tiếp tục chỉ chính người nói. “Chính mình” làm rõ sự liên tục ấy nhưng không giới hạn theo giới tính, vì tiếng Việt không bắt buộc đánh dấu giống ngữ pháp.
- issue: Quan hệ do ἵνα diễn đạt
  choice: 'mục đích: “để”'
  alternative: 'nội dung lời cầu nguyện: “cầu xin cho”'
  rationale: ἵνα có thể được nghe như mục đích hoặc nội dung mong muốn của lời cầu nguyện. Bản chính dùng “để” theo sắc thái mục đích, còn chú thích ghi nhận cách hiểu theo nội dung mà không loại bỏ nó.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “tiếng lạ” và “thông giải” để duy trì thuật ngữ nhất quán trong chương, đồng thời chú thích các khả năng “ngôn ngữ/thứ tiếng” và sắc thái mục đích hoặc nội dung của lời cầu nguyện.
