  naturalness: “Tâm linh của các nhà tiên tri” không thật tự nhiên khi được dùng như một danh từ đếm được, số nhiều. “Thần trí” là cách dùng trang trọng, phù hợp văn cảnh Kinh Thánh và có thể chỉ chiều kích tinh thần của con người mà không biến chính văn thành “lời nói” hay “ân tứ”.
