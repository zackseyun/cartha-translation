  text: And the spirits of prophets are subject to prophets,[a]
translation:
  language: vi
  text: Và thần trí của các nhà tiên tri phục tùng các nhà tiên tri.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “các thần trí thuộc về các nhà tiên tri phục tùng các nhà tiên tri.” “Thần trí” có thể chỉ sự thôi thúc nói tiên tri hoặc hoạt động thuộc linh gắn với các nhà tiên tri; câu này nhấn mạnh rằng việc nói tiên tri không loại trừ sự tự chủ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Và
  rationale: Giữ liên từ nối câu này với lập luận ngay trước đó một cách tự nhiên.
- source_word: πνεύματα
  choice: tâm linh
  rationale: Giữ danh từ số nhiều theo nguyên ngữ và tránh diễn giải quá mức thành “lời nói tiên tri” hay “ân tứ”; trong tiếng Việt, “tâm linh” ở đây có thể chỉ hoạt động hoặc sự thôi thúc thuộc linh gắn với các nhà tiên tri.
- source_word: προφητῶν
  choice: của các nhà tiên tri
  rationale: Truyền đạt trực tiếp cấu trúc sở hữu của thuộc cách số nhiều, đồng thời giữ độ mở về mối liên hệ chính xác giữa “tâm linh” và “các nhà tiên tri”.
- source_word: προφήταις
  choice: các nhà tiên tri
  rationale: Sau động từ “phục tùng”, tiếng Việt không cần giới từ; cách dịch này thể hiện đối tượng mà các tâm linh chịu sự chi phối.
- source_word: ὑποτάσσεται
  choice: phục tùng
  rationale: Diễn đạt ý ở dưới quyền hoặc sự kiểm soát, phù hợp với ngữ cảnh về trật tự và khả năng tự chủ khi nói tiên tri.
theological_decisions:
- issue: Ý nghĩa của “tâm linh của các nhà tiên tri” liên quan đến sự tự chủ khi nói tiên tri
  choice: Giữ cách diễn đạt sát nguyên ngữ, hàm ý rằng hoạt động hay sự thôi thúc thuộc linh gắn với nhà tiên tri không loại bỏ trách nhiệm tự chủ của họ.
  alternative: Hiểu là tâm linh con người của các nhà tiên tri phục tùng những nhà tiên tri khác, hoặc là các sứ điệp tiên tri chịu sự thẩm định của các nhà tiên tri.
  rationale: Ngữ cảnh 1 Cô-rinh-tô 14:29–33 nhấn mạnh trật tự trong hội chúng, nhưng chính câu này vẫn có độ mơ hồ về quy chiếu của πνεύματα. Bản dịch chính không đồng nhất rõ ràng từ này với “sự thôi thúc”, “sứ điệp” hay “ân tứ”.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Chọn “nhà tiên tri” theo cách dùng Kinh Thánh phổ thông; giữ “tâm linh” để bảo tồn độ mơ hồ của πνεύματα thay vì diễn giải ngay trong chính văn.
