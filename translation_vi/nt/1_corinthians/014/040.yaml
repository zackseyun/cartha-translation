  text: But let everything be done decently and in order[a].
translation:
  language: vi
  text: Nhưng mọi sự phải được thực hiện một cách thích hợp[a] và có trật tự.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “một cách đúng mực”; từ Hy Lạp chỉ điều phù hợp hoặc phải lẽ.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα
  choice: mọi sự
  rationale: Đại từ trung tính số nhiều có phạm vi bao quát; “mọi sự” tự nhiên và giữ được tính toàn diện của lời chỉ dẫn.
- source_word: δὲ
  choice: Nhưng
  rationale: Đánh dấu sự chuyển ý có sắc thái tương phản nhẹ, đưa phần bàn luận trước đó đến một chỉ thị tổng kết.
- source_word: εὐσχημόνως
  choice: cách thích hợp
  rationale: Diễn tả điều phù hợp, phải lẽ và đúng mực trong bối cảnh hội chúng; lựa chọn này rõ nghĩa trong tiếng Việt hiện đại mà không thu hẹp vào phép lịch sự bề ngoài.
- source_word: κατὰ τάξιν
  choice: có trật tự
  rationale: Diễn tả sự phù hợp với một cách sắp xếp hay trình tự đúng đắn; “có trật tự” tự nhiên và không hàm ý một nghi thức cố định.
- source_word: γινέσθω
  choice: phải được thực hiện
  rationale: Thể mệnh lệnh ngôi thứ ba truyền đạt một chỉ thị chung. Cách dịch này giữ lực mệnh lệnh và phù hợp với các hoạt động trong hội chúng.
theological_decisions:
- issue: Phạm vi mệnh lệnh của Phao-lô trong bối cảnh thờ phượng
  choice: Một chỉ thị chung rằng mọi hoạt động trong hội chúng phải thích hợp và có trật tự.
  alternative: Một quy định phụng vụ hẹp, ấn định một trình tự buổi lễ cố định; hoặc một nguyên tắc được mở rộng trực tiếp đến mọi thực hành của hội thánh ngoài bối cảnh trước mắt.
  rationale: Câu này tổng kết phần bàn luận trực tiếp về việc phát biểu và giữ trật tự khi hội chúng nhóm lại. Bản dịch giữ tính khái quát của tiếng Hy Lạp nhưng không đưa vào một mô hình phụng vụ hay cơ cấu giáo hội riêng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Mọi sự” duy trì sắc thái Kinh Thánh vừa phải; “cách thích hợp” và “có trật tự” tránh cổ ngữ cũng như tránh áp đặt một mô hình nghi lễ cụ thể.
