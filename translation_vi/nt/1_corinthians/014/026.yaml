id: 1CO.14.26
reference: 1 Corinthians 14:26
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Τί οὖν ἐστιν, ἀδελφοί; ὅταν συνέρχησθε, ⸀ἕκαστος ψαλμὸν ἔχει, διδαχὴν ἔχει, ⸂ἀποκάλυψιν ἔχει, γλῶσσαν⸃ ἔχει, ἑρμηνείαν ἔχει· πάντα πρὸς οἰκοδομὴν γινέσθω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/026.yaml
  text: What then is it[a], brothers? When you come together, each one has a psalm, has a teaching, has a revelation, has a tongue, has an interpretation[b]. Let all things be done for building up.
translation:
  language: vi
  text: Vậy thì phải thế nào, anh em[a]? Khi anh em họp lại, mỗi người có một bài thánh vịnh, có lời dạy, có lời mặc khải, có một thứ tiếng[b], có lời giải nghĩa. Mọi sự hãy nhằm gây dựng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Anh em” ở đây là cách gọi đại diện cho cả hội chúng, gồm cả nam lẫn nữ.
    reason: lexical_alternative
  - marker: b
    text: Từ Hy Lạp cũng có thể dịch là “một ngôn ngữ” hoặc “một thứ tiếng”; cách diễn đạt ở đây không xác định đó là ngôn ngữ loài người đã biết hay một dạng lời nói khác.
    reason: alternative_reading
lexical_decisions:
- source_word: Τί οὖν ἐστιν
  choice: Vậy thì sao
  rationale: Giữ dạng câu hỏi tu từ chuyển sang kết luận thực hành, đồng thời diễn đạt tự nhiên trong tiếng Việt hiện đại.
- source_word: ἀδελφοί
  choice: anh em
  rationale: Giữ hình thức xưng hô số nhiều giống đực của tiếng Hy Lạp; chú thích nêu rõ trong ngữ cảnh từ này đại diện cho toàn thể hội chúng, gồm cả nam lẫn nữ.
- source_word: ὅταν συνέρχησθε
  choice: Khi anh em họp lại
  rationale: Diễn đạt tự nhiên việc hội chúng cùng nhóm họp, đồng thời giữ sắc thái mỗi khi tình huống ấy xảy ra.
- source_word: ἕκαστος
  choice: mỗi người
  rationale: Thể hiện rõ ý phân phối của từ Hy Lạp mà không xác định quá mức mỗi người có một hay tất cả các đóng góp được liệt kê.
- source_word: ψαλμὸν
  choice: một bài thánh thi
  rationale: Chỉ một bài hát tôn giáo dùng trong buổi nhóm; cách dịch này tự nhiên hơn “một thi thiên” và không buộc phải hiểu đó là một bài thuộc sách Thi Thiên.
- source_word: διδαχὴν
  choice: lời dạy
  rationale: Phù hợp với một phần đóng góp để hướng dẫn hội chúng và tránh sắc thái hệ thống hóa của “giáo lý”.
- source_word: ἀποκάλυψιν
  choice: lời mặc khải
  rationale: Giữ khái niệm về điều được bày tỏ trong buổi nhóm, với cách nói quen thuộc nhưng không giải thích thêm nguồn hay phương thức.
- source_word: γλῶσσαν
  choice: lời nói bằng một thứ tiếng
  rationale: Diễn đạt tự nhiên một đóng góp bằng lời nói, đồng thời giữ ngỏ việc γλῶσσα là một ngôn ngữ có thể nhận biết hay dạng lời nói khác.
- source_word: ἑρμηνείαν
  choice: lời giải nghĩa
  rationale: Phù hợp với ngữ cảnh làm cho lời nói bằng một thứ tiếng trở nên hiểu được đối với hội chúng; không thu hẹp hoàn toàn thành hoạt động phiên dịch thông thường.
- source_word: πάντα πρὸς οἰκοδομὴν γινέσθω
  choice: Mọi việc hãy được thực hiện nhằm gây dựng
  rationale: Giữ phạm vi bao quát và lực mệnh lệnh của câu, đồng thời bảo tồn hình ảnh xây dựng theo cách nói tiếng Việt tự nhiên trong bối cảnh cộng đồng.
theological_decisions:
- issue: Lối xưng hô giống đực mang tính đại diện trong hội chúng
  choice: Dùng “anh em” trong chính văn và giải thích phạm vi bao gồm cả nam lẫn nữ ở chú thích.
  alternative: Dịch trực tiếp là “anh chị em”.
  rationale: Cách chọn giữ đặc điểm hình thức của ἀδελφοί nhưng không để độc giả hiểu sai rằng lời dạy chỉ hướng đến nam giới.
- issue: Ý nghĩa của γλῶσσα trong 1 Cô-rinh-tô 12–14
  choice: Dịch “lời nói bằng một thứ tiếng” và thêm chú thích về khoảng nghĩa.
  alternative: “tiếng lạ” hoặc “một ngôn ngữ”.
  rationale: Tránh quyết định vượt quá văn bản rằng hiện tượng này nhất thiết là ngoại ngữ loài người, lời nói xuất thần, hay một loại lời nói cụ thể khác.
- issue: Đối tượng của sự gây dựng
  choice: 'Giữ cách nói không nêu tân ngữ: “nhằm gây dựng”.'
  alternative: “nhằm gây dựng hội thánh”.
  rationale: Ngữ cảnh cho thấy sự gây dựng hướng đến hội chúng, nhưng câu Hy Lạp không nêu đối tượng; bản dịch không thêm “hội thánh” vào chính văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và thích hợp để đọc công khai. Dùng “họp lại”, “lời dạy” và “lời giải nghĩa” để người đọc phổ thông dễ hiểu; giữ “mặc khải” và “gây dựng” vì đây là những thuật ngữ ngắn gọn, đã quen dùng trong ngữ cảnh Kinh Thánh. Các dấu chú thích [a], [b] đều xuất hiện trong chính văn.
