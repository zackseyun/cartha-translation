  terminology: “Người thông giải” phù hợp với διερμηνευτής trong ngữ cảnh nói tiếng lạ và không thu hẹp quá mức thành dịch giả ngôn ngữ. “Hội thánh” là lựa chọn thông dụng cho ἐκκλησία; chú thích đã ghi nhận phương án nhấn mạnh cuộc nhóm họp. “Đức Chúa Trời” nhất quán với đăng ký thuật ngữ Cơ Đốc tiếng Việt.
