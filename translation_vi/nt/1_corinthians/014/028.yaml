id: 1CO.14.28
reference: 1 Corinthians 14:28
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐὰν δὲ μὴ ᾖ ⸀διερμηνευτής, σιγάτω ἐν ἐκκλησίᾳ, ἑαυτῷ δὲ λαλείτω καὶ τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/028.yaml
  text: But if there is no interpreter[a], he must keep silent in the church and speak to himself and to God.
translation:
  language: vi
  text: Nhưng nếu không có người thông giải, người ấy phải im lặng trong hội thánh[a], nhưng người ấy hãy nói với chính mình và với Đức Chúa Trời.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “giữa hội chúng.”'
    reason: Ghi nhận nghĩa “cộng đồng đang nhóm lại” của ἐκκλησία trong ngữ cảnh này.
lexical_decisions:
- source_word: διερμηνευτής
  choice: người thông giải
  rationale: Chỉ người làm cho lời nói bằng tiếng lạ trở nên dễ hiểu đối với người khác. “Người thông giải” phù hợp với ngữ cảnh thờ phượng và không giới hạn hành động này vào việc dịch giữa các ngôn ngữ theo nghĩa thông thường.
- source_word: σιγάτω
  choice: phải im lặng
  rationale: Động từ mệnh lệnh hiện tại ngôi thứ ba số ít diễn tả một chỉ thị rõ ràng; “phải im lặng” giữ được sức nặng ấy bằng tiếng Việt tự nhiên.
- source_word: ἐν ἐκκλησίᾳ
  choice: trong hội thánh
  rationale: Trong ngữ cảnh 1 Cô-rinh-tô 14, từ này nói đến cộng đồng tín hữu đang nhóm lại. “Trong hội thánh” là cách diễn đạt quen thuộc, còn “giữa hội chúng” được ghi nhận trong chú thích để làm rõ khía cạnh hội họp.
- source_word: ἑαυτῷ
  choice: với chính mình
  rationale: Đại từ phản thân chỉ lời nói không hướng đến toàn thể cộng đồng; bản dịch không thêm các ý như “âm thầm” hoặc “một mình” vốn không được nói rõ trong nguyên văn.
- source_word: λαλείτω
  choice: nói
  rationale: Động từ mệnh lệnh tiếp tục chỉ dẫn về việc nói; “nói” là cách dịch trung tính, tự nhiên và trang trọng vừa phải.
- source_word: τῷ θεῷ
  choice: với Đức Chúa Trời
  rationale: Túc từ gián tiếp của động từ “nói”, cho thấy lời ấy hướng đến Đức Chúa Trời thay vì công khai hướng đến hội chúng.
- source_word: ἐὰν δὲ μὴ ᾖ
  choice: Nhưng nếu không có
  rationale: Giữ quan hệ tương phản và điều kiện của nguyên văn, đồng thời diễn đạt tự nhiên sự vắng mặt của người thông giải.
theological_decisions:
- issue: Phạm vi của mệnh lệnh im lặng trong buổi nhóm
  choice: Mệnh lệnh ngăn việc nói công khai giữa hội thánh khi không có người thông giải, nhưng vẫn để nguyên lời chỉ dẫn nói với chính mình và với Đức Chúa Trời.
  alternative: Hiểu là người ấy phải ngừng mọi hình thức nói; hoặc có thể tiếp tục nói thành tiếng hướng đến hội chúng.
  rationale: Sự đối lập giữa “im lặng trong hội thánh” và “nói với chính mình và với Đức Chúa Trời” cho thấy mệnh lệnh liên quan đến lời nói công khai trong cộng đồng, chứ không tuyên bố một lệnh cấm tuyệt đối đối với mọi lời nói. Bản dịch giữ nguyên sự căng thẳng này mà không áp đặt một lập trường hệ phái về các ân tứ thuộc linh.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “người ấy” để thể hiện chủ thể số ít hàm ẩn trong các động từ mệnh lệnh; dùng “còn” để giữ phép đối lập giữa im lặng trước hội chúng và nói với chính mình cùng Đức Chúa Trời.
