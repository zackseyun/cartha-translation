  source_fidelity: Bản dịch giữ đúng quan hệ suy luận–điều kiện của ἐὰν οὖν, ý nghĩa ngữ cảnh của τὴν δύναμιν τῆς φωνῆς là điều/ý nghĩa được phát ra, thì tương lai của ἔσομαι, và tính đối ứng của hai mệnh đề. “Người ngoại quốc” diễn đạt βάρβαρος theo nghĩa xa lạ, không thông hiểu ngôn ngữ, thay vì nghĩa miệt thị hiện đại.
