  terminology: “Ý nghĩa của âm thanh” phù hợp với ngữ cảnh các âm/thanh phát ra trong đoạn văn và không áp đặt cách hiểu hẹp là một ngôn ngữ. Chú thích b giải thích chính xác sắc thái ngữ cảnh của βάρβαρος; “người man di” chỉ được nêu như hình thức nguyên văn, không được dùng làm bản dịch chính.
