id: 1CO.14.11
reference: 1 Corinthians 14:11
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐὰν οὖν μὴ εἰδῶ τὴν δύναμιν τῆς φωνῆς, ἔσομαι τῷ λαλοῦντι βάρβαρος καὶ ὁ λαλῶν ἐν ἐμοὶ βάρβαρος.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/011.yaml
  text: Therefore[a], if I do not know the meaning of the voice, I will be a foreigner to the one speaking[b], and the one speaking will be a foreigner to me.
translation:
  language: vi
  text: Vậy, nếu tôi không biết ý nghĩa của âm thanh[a], thì đối với người đang nói, tôi sẽ là người ngoại quốc[b], và người đang nói cũng sẽ là người ngoại quốc đối với tôi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “hiệu lực của tiếng nói”; tức là ý nghĩa hoặc nội dung được âm thanh truyền đạt.
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn Hy Lạp là “người man di”; ở đây chỉ người có lời nói xa lạ hoặc không thể hiểu được, không nhất thiết có nghĩa là người không văn minh.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν οὖν
  choice: Vậy, nếu
  rationale: Diễn đạt tự nhiên quan hệ suy luận của οὖν cùng điều kiện của ἐὰν, đồng thời giữ mạch lập luận từ các ví dụ trước.
- source_word: μὴ εἰδῶ
  choice: tôi không biết
  rationale: Giữ nghĩa cơ bản của οἶδα là “biết”; trong ngữ cảnh, cụm này cũng hàm ý không hiểu được.
- source_word: τὴν δύναμιν τῆς φωνῆς
  choice: ý nghĩa của âm thanh
  rationale: δύναμις theo nghĩa đen là “sức mạnh/hiệu lực”, nhưng trong kết hợp này chỉ ý nghĩa hay nội dung mà âm thanh truyền đạt. φωνή có thể là “tiếng”, “giọng nói” hoặc “âm thanh”; “âm thanh” phù hợp với mạch ví dụ rộng hơn về các tiếng phát ra mà không đồng nhất ngay với một ngôn ngữ.
- source_word: τῷ λαλοῦντι
  choice: đối với người đang nói
  rationale: Giữ sắc thái hiện tại của phân từ và diễn đạt quan hệ hướng đến người nói một cách tự nhiên trong tiếng Việt.
- source_word: βάρβαρος
  choice: người ngoại quốc
  rationale: Trong ngữ cảnh này, từ này nói đến một người có lời nói xa lạ hoặc không thể hiểu được, chứ không nhất thiết mang nghĩa miệt thị là “man rợ”.
- source_word: ἐν ἐμοὶ
  choice: đối với tôi
  rationale: 'Diễn đạt thành ngữ chỉ quan hệ hay góc nhìn trong cấu trúc đối ứng: người kia trở nên xa lạ về ngôn ngữ đối với tôi.'
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Cấu trúc đối ứng của câu Hy Lạp được giữ lại để làm nổi bật việc hai bên trở nên xa lạ với nhau khi lời nói không có ý nghĩa mà bên kia nhận biết được.
