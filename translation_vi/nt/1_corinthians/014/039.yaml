  terminology: “Nói tiên tri” là thuật ngữ phù hợp. “Các thứ tiếng” giữ số nhiều và không quyết định trước bản chất hiện tượng của γλώσσαις. Chú thích về “anh em” xử lý thích hợp khả năng lời xưng hô bao gồm toàn hội chúng mà vẫn giữ hình thức nguồn trong bản văn chính.
