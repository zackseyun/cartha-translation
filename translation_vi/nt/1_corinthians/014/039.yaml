  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὥστε, ἀδελφοί ⸀μου, ζηλοῦτε τὸ προφητεύειν, καὶ τὸ λαλεῖν ⸂μὴ κωλύετε γλώσσαις⸃·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/039.yaml
  text: So then[a], my brothers, be eager to prophesy, and do not forbid speaking in tongues.
translation:
  language: vi
  text: Vậy, thưa anh em của tôi[a], hãy tha thiết mong nói tiên tri, và đừng cấm việc nói các thứ tiếng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “anh chị em của tôi”; từ Hy Lạp có nghĩa đen là “anh em” nhưng ở đây có thể chỉ toàn thể hội chúng, gồm cả nam lẫn nữ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: Vậy
  rationale: Liên từ suy luận kết lại phần bàn luận trước; “Vậy” tự nhiên trong tiếng Việt và giữ được sức tổng kết.
- source_word: ἀδελφοί μου
  choice: thưa anh em của tôi
  rationale: Giữ lời xưng hô số nhiều giống đực cùng đại từ sở hữu μου; trong ngữ cảnh, cách gọi này có thể bao gồm cả hội chúng.
- source_word: ζηλοῦτε
  choice: hãy tha thiết mong
  rationale: Động từ mệnh lệnh hiện tại diễn tả sự nhiệt thành và theo đuổi liên tục; “tha thiết mong” rõ nghĩa, tự nhiên và phù hợp sắc thái tích cực.
- source_word: τὸ προφητεύειν
  choice: được nói tiên tri
  rationale: Danh động từ có mạo từ là đối tượng của ζηλοῦτε; cách diễn đạt này tự nhiên trong tiếng Việt và không biến hành động thành một danh từ trừu tượng.
- source_word: μὴ κωλύετε
  choice: đừng cấm
  rationale: Mệnh lệnh phủ định trực tiếp; “đừng cấm” thể hiện rõ việc không được ngăn cấm thực hành đang được nói đến.
- source_word: τὸ λαλεῖν γλώσσαις
  choice: việc nói các thứ tiếng
  rationale: Giữ dạng số nhiều γλώσσαις và cách nói đặc thù của đoạn văn, đồng thời tránh tự ý xác định đó là ngôn ngữ nhân loại hay lời nói siêu nhiên.
theological_decisions:
- issue: Phạm vi của lời xưng hô ἀδελφοί trong hội chúng gồm cả nam và nữ
  choice: anh em của tôi, kèm chú thích về khả năng bao gồm toàn thể hội chúng
  alternative: anh chị em của tôi
  rationale: Nguyên văn dùng danh từ giống đực số nhiều nhưng trong ngữ cảnh có thể được dùng theo nghĩa đại diện. Bản chính giữ hình thức nguồn, còn chú thích làm rõ khả năng bao gồm cả nam lẫn nữ.
- issue: Ý nghĩa của γλώσσαις
  choice: các thứ tiếng
  alternative: tiếng lạ; các ngôn ngữ
  rationale: “Các thứ tiếng” giữ được tính đa nghĩa của γλώσσαις trong cuộc bàn luận mà không âm thầm quyết định bản chất hiện tượng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và trực tiếp. Dùng “nói tiên tri” theo thuật ngữ Kinh Thánh quen thuộc; dùng “các thứ tiếng” để giữ độ mở nghĩa của nguyên văn.
