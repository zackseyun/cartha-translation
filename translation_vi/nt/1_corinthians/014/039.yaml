  source_fidelity: Bản dịch truyền đạt đúng cấu trúc kết luận của ὥστε, lời gọi ἀδελφοί μου, mệnh lệnh khích lệ ζηλοῦτε, và mệnh lệnh phủ định μὴ κωλύετε. Tuy nhiên, từ “được” trong “mong được nói tiên tri” thêm sắc thái được cho phép/có cơ hội mà nguyên văn không nói; τὸ προφητεύειν là hành động “nói tiên tri” được nhiệt thành mong muốn/theo đuổi.
