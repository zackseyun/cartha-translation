  text: οὕτως καὶ ὑμεῖς, ἐπεὶ ζηλωταί ἐστε πνευμάτων, πρὸς τὴν οἰκοδομὴν τῆς ἐκκλησίας ζητεῖτε ἵνα περισσεύητε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/012.yaml
  text: So also you[a], since you are eager for spiritual gifts, seek to abound for the building up of the church.
translation:
  language: vi
  text: 'Anh chị em cũng vậy: vì anh chị em nhiệt thành theo đuổi các ân tứ thuộc linh[a], hãy tìm cách ngày càng dồi dào hơn trong việc xây dựng Hội Thánh.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn Hy Lạp có thể dịch là “các linh thể” hoặc “những điều thuộc linh”; ngữ cảnh cho thấy có lẽ nói đến các ân tứ hay những biểu hiện của Thánh Linh.
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως καὶ ὑμεῖς
  choice: Anh chị em cũng vậy
  rationale: Nối lời khuyên với phép so sánh ở phần trước; cách nói tự nhiên trong tiếng Việt và vẫn giữ ý suy luận.
- source_word: ἐπεὶ
  choice: vì
  rationale: Biểu thị căn cứ cho lời khuyên, ngắn gọn và tự nhiên.
- source_word: ζηλωταί ἐστε
  choice: nhiệt thành theo đuổi
  rationale: Diễn đạt đặc tính sốt sắng, tha thiết đối với đối tượng theo sau mà không dùng từ quá cổ.
- source_word: πνευμάτων
  choice: các ân tứ thuộc linh
  rationale: Ngữ cảnh 1 Cô-rinh-tô 12–14 nói về các sự ban cho hoặc biểu hiện thuộc linh. Tuy nhiên, nguyên ngữ chỉ viết cô đọng là “các thần linh” hoặc “những điều thuộc linh”, nên giữ các khả năng ấy trong chú thích.
- source_word: πρὸς τὴν οἰκοδομὴν τῆς ἐκκλησίας
  choice: nhằm xây dựng Hội Thánh
  rationale: Giữ hình ảnh xây dựng của οἰκοδομή, đồng thời diễn đạt mục tiêu/hướng đến được hàm ý bởi πρὸς.
- source_word: ζητεῖτε
  choice: hãy tìm cách
  rationale: Mệnh lệnh kêu gọi sự chủ động theo đuổi; “tìm cách” tự nhiên hơn “hãy tìm kiếm” trong cấu trúc này.
- source_word: ἵνα περισσεύητε
  choice: được dư dật
  rationale: Giữ sắc thái phong phú, dồi dào của περισσεύω và không tự ý thêm đối tượng “trong các ân tứ”, vốn không xuất hiện rõ trong tiếng Hy Lạp.
theological_decisions:
- issue: Ý nghĩa của πνευμάτων
  choice: các ân tứ thuộc linh
  alternative: các thần linh; những điều thuộc linh
  rationale: Ngữ cảnh ưu tiên cách hiểu về các ân tứ hoặc biểu hiện thuộc linh, nhưng chú thích bảo tồn độ cô đọng và sự mơ hồ thật sự của nguyên ngữ.
- issue: Đối tượng ngầm của περισσεύητε
  choice: không thêm “trong các ân tứ”
  alternative: được dư dật trong các ân tứ ấy
  rationale: Nguyên văn không nêu một bổ ngữ trực tiếp cho động từ; câu nhấn mạnh sự dư dật hướng đến việc xây dựng Hội Thánh. Không thêm đối tượng giúp tránh giải quyết quá mức cấu trúc mở của câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” cho đại từ số nhiều ὑμεῖς, “Hội Thánh” cho cộng đồng tín hữu, và giữ hình ảnh “xây dựng” của nguyên ngữ.
