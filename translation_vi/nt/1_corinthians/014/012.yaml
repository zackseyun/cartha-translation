- from: 'Anh chị em cũng vậy: vì anh chị em nhiệt thành theo đuổi các ân tứ thuộc linh[a], hãy tìm cách được dư dật nhằm xây dựng Hội Thánh.'
  to: 'Anh chị em cũng vậy: vì anh chị em nhiệt thành theo đuổi các ân tứ thuộc linh[a], hãy tìm cách ngày càng dồi dào hơn trong việc xây dựng Hội Thánh.'
  rationale: Bản sửa giữ cách hiểu theo ngữ cảnh của πνευμάτων và bảo tồn các cách hiểu từ vựng thay thế trong chú thích. “Ngày càng dồi dào hơn trong việc xây dựng Hội Thánh” diễn đạt tự nhiên mục đích ἵνα περισσεύητε cùng hướng πρὸς τὴν οἰκοδομὴν τῆς ἐκκλησίας, không thêm cụm “trong các ân tứ ấy” làm bổ ngữ cho περισσεύητε.
