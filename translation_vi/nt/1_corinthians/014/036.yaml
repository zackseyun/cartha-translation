- from: Hay là lời của Đức Chúa Trời đã phát ra từ anh chị em[a], hoặc chỉ đến với riêng anh chị em[b] sao?
  to: Hay là lời của Đức Chúa Trời đã phát ra từ anh chị em[a], hay chỉ đến với anh chị em[b] thôi sao?
  rationale: Chỉnh nhẹ để câu hỏi lựa chọn tu từ song hành và tự nhiên hơn trong tiếng Việt, đồng thời giữ nguyên nghĩa nguồn gốc, sự đến nơi, và ý «chỉ riêng» của nguyên văn. Các chú thích vẫn được neo đúng vào cụm từ tương ứng.
