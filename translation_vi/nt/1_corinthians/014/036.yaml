source:
  edition: SBLGNT
  text: ἢ ἀφ’ ὑμῶν ὁ λόγος τοῦ θεοῦ ἐξῆλθεν, ἢ εἰς ὑμᾶς μόνους κατήντησεν;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/036.yaml
  text: Or did the word of God go out from you[b][a], or has it reached only you?
translation:
  language: vi
  text: Hay là lời của Đức Chúa Trời đã phát ra từ anh chị em[a], hay chỉ đến với anh chị em[b] thôi sao?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “đã bắt nguồn từ anh chị em”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hay: “đã đến với riêng anh chị em”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἢ
  choice: Hay là
  rationale: Giữ liên từ lựa chọn mở đầu câu hỏi tu từ; sắc thái quở trách được thể hiện qua toàn bộ cấu trúc câu hỏi thay vì thêm một thán từ không có trực tiếp trong tiếng Hy Lạp.
- source_word: ἀφ’ ὑμῶν
  choice: từ anh chị em
  rationale: ἀπό với sở hữu cách chỉ nguồn gốc. Cách dịch này trực tiếp, tự nhiên và không giới hạn nghĩa thành 'từ giữa cộng đồng anh chị em'.
- source_word: ὁ λόγος τοῦ θεοῦ
  choice: lời của Đức Chúa Trời
  rationale: Giữ cách diễn đạt rộng và trang trọng của Phao-lô, không thu hẹp đối tượng chỉ còn Tin Lành hay lời tiên tri trong buổi nhóm.
- source_word: ἐξῆλθεν
  choice: đã phát ra
  rationale: Giữ hình ảnh đi ra/phát ra từ một nguồn, đồng thời tự nhiên trong tiếng Việt khi nói về lời hay sứ điệp. Nghĩa hàm ý 'bắt nguồn' được nêu ở chú thích.
- source_word: εἰς ὑμᾶς μόνους
  choice: chỉ đến với riêng anh chị em
  rationale: Diễn đạt rõ sự độc quyền mà câu hỏi tu từ phủ nhận; 'riêng' làm nổi bật μόνους mà vẫn tự nhiên.
- source_word: κατήντησεν
  choice: đến với
  rationale: Thể hiện ý đến nơi/đạt tới của καταντάω bằng lối nói tiếng Việt tự nhiên, không diễn giải quá mức.
theological_decisions:
- issue: Đối tượng quy chiếu của ὁ λόγος τοῦ θεοῦ
  choice: Giữ là 'lời của Đức Chúa Trời' với phạm vi nghĩa rộng.
  alternative: Thu hẹp thành 'sứ điệp Tin Lành' hoặc 'lời tiên tri trong hội chúng'.
  rationale: Trong văn cảnh, Phao-lô bác bỏ thái độ xem cộng đồng Cô-rinh-tô như nguồn gốc hoặc đối tượng duy nhất của lời có thẩm quyền từ Đức Chúa Trời. Nguyên văn không buộc phải chọn riêng một trong các đối tượng quy chiếu cụ thể.
- issue: Sắc thái của hai câu hỏi phối hợp bằng ἢ ... ἢ
  choice: Giữ dạng câu hỏi lựa chọn mang tính quở trách.
  alternative: Mở đầu bằng một thán từ như 'Sao!' hoặc 'Cái gì!' để làm sắc thái gay gắt hơn.
  rationale: Các tiểu từ Hy Lạp trực tiếp biểu thị sự lựa chọn; lực quở trách đã hiện diện trong nội dung phi lý của hai khả năng được nêu ra, nên không cần thêm từ không có trong nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” cho đại từ số nhiều ὑμῶν/ὑμᾶς nhằm thể hiện cộng đồng tín hữu được nói trực tiếp, không hàm ý chỉ nam giới. Hai dấu chú thích [a], [b] đều được đặt ngay sau cụm từ tương ứng trong chính văn.
