revisions:
- from: Giờ đây, thưa anh em[a], nếu tôi đến với anh em mà nói các thứ tiếng[b], thì tôi sẽ ích lợi gì cho anh em, trừ khi tôi nói với anh em bằng sự mặc khải, bằng tri thức, bằng lời tiên tri hoặc bằng sự dạy dỗ?
  to: Giờ đây, thưa anh em[a], nếu tôi đến với anh em mà nói bằng các thứ tiếng[b], thì tôi sẽ giúp ích gì cho anh em, trừ khi tôi nói với anh em bằng sự mặc khải, bằng tri thức, bằng lời tiên tri hoặc bằng sự dạy dỗ?
  rationale: Sửa cách diễn đạt lợi ích để phản ánh chính xác và tự nhiên động từ ὠφελέω với “anh em” là đối tượng. Điều chỉnh nhẹ cụm nói các thứ tiếng và chú thích để tiếng Việt trôi chảy hơn, đồng thời vẫn giữ sự mơ hồ có chủ ý về bản chất của γλώσσαις.
