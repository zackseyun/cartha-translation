id: 1CO.14.6
reference: 1 Corinthians 14:6
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸀Νῦν δέ, ἀδελφοί, ἐὰν ἔλθω πρὸς ὑμᾶς γλώσσαις λαλῶν, τί ὑμᾶς ὠφελήσω, ἐὰν μὴ ὑμῖν λαλήσω ἢ ἐν ἀποκαλύψει ἢ ἐν γνώσει ἢ ἐν προφητείᾳ ἢ ἐν διδαχῇ;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/006.yaml
  text: Now[a], brothers, if I come to you speaking in tongues[b], what will I benefit you unless I speak to you either by revelation or by knowledge or by prophecy or by teaching?
translation:
  language: vi
  text: Giờ đây, thưa anh em[a], nếu tôi đến với anh em mà nói bằng các thứ tiếng[b], thì tôi sẽ giúp ích gì cho anh em, trừ khi tôi nói với anh em bằng sự mặc khải, bằng tri thức, bằng lời tiên tri hoặc bằng sự dạy dỗ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “anh chị em”; từ Hy Lạp “anh em” có thể được dùng để gọi một hội chúng gồm cả nam lẫn nữ.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “nói các ngôn ngữ” hoặc “nói tiếng lạ”; từ Hy Lạp có thể nghĩa là “các ngôn ngữ”, nhưng trong văn cảnh này chỉ hiện tượng được bàn xuyên suốt 1 Cô-rinh-tô 12–14.
    reason: lexical_alternative
lexical_decisions:
- source_word: Νῦν δέ
  choice: Giờ đây
  rationale: Đánh dấu bước chuyển sang điểm đang được Phao-lô áp dụng trực tiếp; cách nói này tự nhiên và không nhấn quá mức sắc thái tương phản của δέ.
- source_word: ἀδελφοί
  choice: anh em
  rationale: Giữ hình thức hô gọi giống đực số nhiều của tiếng Hy Lạp và lối xưng hô quen thuộc, trang trọng trong tiếng Việt; chú thích cho biết từ này có thể chỉ cả hội chúng gồm nam lẫn nữ.
- source_word: γλώσσαις λαλῶν
  choice: nói các thứ tiếng
  rationale: γλῶσσα có thể mang nghĩa ngôn ngữ hoặc hiện tượng phát ngôn thuộc linh được bàn trong 1 Cô-rinh-tô 12–14. Cách dịch này giữ được độ mở từ vựng, còn chú thích làm rõ bối cảnh mà không xác định bản chất của hiện tượng.
- source_word: τί ὑμᾶς ὠφελήσω
  choice: tôi sẽ ích lợi gì cho anh em
  rationale: Diễn đạt tự nhiên trong tiếng Việt ý nghĩa giúp ích hay đem lợi ích của ὠφελέω, đồng thời giữ trọng tâm của câu hỏi ở lợi ích dành cho người nghe.
- source_word: ἐὰν μὴ
  choice: trừ khi
  rationale: Cách diễn đạt tự nhiên của điều kiện phủ định, phù hợp với cấu trúc câu hỏi tiếng Việt.
- source_word: ἐν ἀποκαλύψει
  choice: bằng sự mặc khải
  rationale: Hiểu ἐν theo sắc thái phương tiện hoặc cách thức; “bằng” cho thấy lời nói đem lại ích lợi qua sự mặc khải mà không diễn giải thêm nguồn hay hình thức của mặc khải.
- source_word: ἐν γνώσει
  choice: bằng tri thức
  rationale: Giữ cấu trúc song song và nghĩa phương tiện/cách thức của ἐν; “tri thức” diễn đạt γνώσις như nội dung hoặc sự hiểu biết được truyền đạt.
- source_word: ἐν προφητείᾳ
  choice: bằng lời tiên tri
  rationale: Trong tiếng Việt, “lời tiên tri” tự nhiên hơn “sự tiên tri” khi nói về lời nói có thể nghe và hiểu, nhưng không thu hẹp thuật ngữ vào việc tiên đoán tương lai.
- source_word: ἐν διδαχῇ
  choice: bằng sự dạy dỗ
  rationale: Diễn đạt δίδαχή là hoạt động hoặc nội dung chỉ dạy, đồng thời duy trì nhịp song song của bốn cụm từ.
theological_decisions:
- issue: Phạm vi người được gọi bằng ἀδελφοί
  choice: anh em
  alternative: anh chị em
  rationale: Bản chính giữ hình thức giống đực của từ Hy Lạp, trong khi chú thích thừa nhận lối dùng này có thể bao gồm cả nam và nữ trong hội chúng.
- issue: Ý nghĩa của γλώσσαις trong 1 Cô-rinh-tô 12–14
  choice: các thứ tiếng
  alternative: các ngôn ngữ; tiếng lạ
  rationale: Lựa chọn này phản ánh nghĩa từ vựng của γλῶσσα và hiện tượng đang được bàn, nhưng không quyết định đó là ngôn ngữ tự nhiên hay một dạng phát ngôn thuộc linh khác.
- issue: Quan hệ của bốn cụm ἐν
  choice: bằng
  alternative: trong; với
  rationale: '“Bằng” thể hiện hợp lý sắc thái phương tiện/cách thức trong ngữ cảnh: lời nói chỉ giúp ích khi truyền đạt qua một trong các hình thức có thể gây dựng này. Cách dịch không áp đặt rằng bốn mục là những ân tứ hoàn toàn tách biệt.'
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và phù hợp với lời chất vấn trực tiếp gửi hội chúng. Dùng “thưa anh em” để lời hô gọi tự nhiên trong tiếng Việt; lặp “bằng” nhằm giữ nhịp liệt kê của nguyên văn. “Mặc khải”, “tri thức”, “lời tiên tri” và “sự dạy dỗ” là các thuật ngữ rõ nghĩa trong văn cảnh Kinh Thánh mà không gắn với cách giải thích riêng của một hệ phái.
