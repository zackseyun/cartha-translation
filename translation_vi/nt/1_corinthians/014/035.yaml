id: 1CO.14.35
reference: 1 Corinthians 14:35
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἰ δέ τι ⸀μαθεῖν θέλουσιν, ἐν οἴκῳ τοὺς ἰδίους ἄνδρας ἐπερωτάτωσαν, αἰσχρὸν γάρ ἐστιν γυναικὶ ⸂λαλεῖν ἐν ἐκκλησίᾳ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/035.yaml
  text: But if they want to learn anything[a], let them ask their own husbands at home[b], for it is shameful for a woman to speak in the assembly.
translation:
  language: vi
  text: Nhưng nếu họ muốn biết điều gì, thì hãy hỏi chồng mình ở nhà; vì thật đáng hổ thẹn khi một phụ nữ[a] nói trong hội chúng[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “một người vợ”. Từ Hy Lạp có thể có nghĩa là “phụ nữ” hoặc “vợ”, tùy theo văn cảnh.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “trong hội thánh” hoặc “trong cộng đoàn”; từ Hy Lạp ở đây chỉ cộng đồng đang nhóm họp.
    reason: lexical_alternative
lexical_decisions:
- source_word: μαθεῖν
  choice: học hỏi
  rationale: Diễn đạt trực tiếp ý học hay muốn biết thêm, đồng thời tự nhiên trong ngữ cảnh họ đặt câu hỏi để hiểu điều gì đó.
- source_word: ἐν οἴκῳ
  choice: ở nhà
  rationale: Đây là cách diễn đạt tự nhiên trong tiếng Việt và giữ được sự đối lập giữa khung cảnh gia đình với buổi nhóm họp.
- source_word: τοὺς ἰδίους ἄνδρας
  choice: chồng của mình
  rationale: Danh từ ἀνήρ có thể chỉ người đàn ông hoặc người chồng; đi cùng ἰδίους và trong bối cảnh gia đình, nghĩa 'chồng' là phù hợp nhất.
- source_word: ἐπερωτάτωσαν
  choice: họ hãy hỏi
  rationale: Giữ rõ sắc thái mệnh lệnh của động từ mà vẫn tự nhiên, trang trọng trong tiếng Việt hiện đại.
- source_word: αἰσχρὸν
  choice: đáng hổ thẹn
  rationale: Giữ được sức nặng đạo đức-xã hội của từ Hy Lạp, mạnh hơn cách dịch giảm nhẹ như 'không thích hợp'.
- source_word: γυναικὶ
  choice: một phụ nữ
  rationale: γυνή có thể là 'phụ nữ' hoặc 'vợ'. Bản văn dùng số ít theo nghĩa khái quát, nên chọn 'một phụ nữ' trong chính văn và ghi nhận nghĩa 'người vợ' ở chú thích.
- source_word: λαλεῖν
  choice: nói
  rationale: Cách dịch rộng và trực tiếp, không tự ý giới hạn lời nói ở đây thành việc chất vấn, gây rối hay một loại phát biểu cụ thể.
- source_word: ἐν ἐκκλησίᾳ
  choice: trong hội chúng
  rationale: Chỉ cộng đồng đang nhóm họp; 'hội chúng' tránh khiến người đọc chỉ nghĩ đến một tòa nhà hoặc cơ chế giáo hội.
theological_decisions:
- issue: Phạm vi của lời nói bị xem là đáng hổ thẹn
  choice: Dịch đơn giản là 'nói', không giới hạn loại lời nói trong chính văn.
  alternative: Hiểu riêng là việc đặt câu hỏi gây rối, thẩm định lời tiên tri, hoặc là lời trích dẫn quan điểm của người Cô-rinh-tô.
  rationale: Bản văn Hy Lạp tại câu này không tự xác định loại lời nói; bản dịch vì thế giữ nguyên sức căng và không đưa một kết luận chú giải vào chính văn.
- issue: Nên hiểu γυνή/ἀνήρ là phụ nữ/người đàn ông hay vợ/chồng
  choice: Dịch ἄνδρας là 'chồng' và γυναικί là 'một phụ nữ', đồng thời chú thích khả năng 'người vợ'.
  alternative: Dịch nhất quán là 'vợ/chồng' hoặc 'phụ nữ/người đàn ông'.
  rationale: Cụm 'chồng của mình' trong bối cảnh gia đình hỗ trợ rõ nghĩa hôn nhân của ἀνήρ, còn γυνή ở mệnh đề sau vẫn có thể mang nghĩa khái quát hoặc nghĩa 'vợ'; chú thích bảo tồn sự nhập nhằng đó.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu dịch giữ cấu trúc lập luận của nguyên bản, dùng 'họ hãy hỏi' để thể hiện mệnh lệnh, và không thu hẹp nghĩa của 'nói' bằng một cách giải thích giáo phái.
