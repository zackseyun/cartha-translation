revisions:
- from: Nhưng nếu họ muốn học hỏi điều gì, họ hãy hỏi chồng của mình ở nhà, vì việc một phụ nữ[a] nói trong hội chúng[b] là điều đáng hổ thẹn.
  to: Nhưng nếu họ muốn biết điều gì, thì hãy hỏi chồng mình ở nhà; vì thật đáng hổ thẹn khi một phụ nữ[a] nói trong hội chúng[b].
  rationale: Đổi «học hỏi» thành «biết» để diễn đạt tự nhiên mục tiêu trực tiếp của μαθεῖν trong cấu trúc «muốn ... điều gì»; bỏ sự lặp lại không cần thiết của «họ» nhưng vẫn giữ mệnh lệnh ngôi thứ ba số nhiều qua ngữ cảnh. Đổi mệnh đề cuối thành «thật đáng hổ thẹn khi...» để phản ánh trực tiếp αἰσχρὸν ... γυναικὶ λαλεῖν và tạo văn phong Việt tự nhiên. Không giới hạn «nói» vào một dạng phát biểu cụ thể.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T18:13:21Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch truyền đạt đúng các thành tố chính của câu Hy Lạp: điều kiện «nếu họ muốn biết điều gì», mệnh lệnh hỏi chồng mình ở nhà, và lý do về điều bị xem là đáng hổ thẹn trong hội chúng. «Chồng mình» phù hợp với τοὺς ἰδίους ἄνδρας trong bối cảnh này; chú thích bảo lưu đúng khả năng «vợ» của γυνή.'
  naturalness: Câu hiện tại nhìn chung dễ hiểu, nhưng «họ muốn học hỏi điều gì, họ hãy hỏi» hơi lặp chủ ngữ và «vì việc một phụ nữ ... là điều» nặng, chưa tự nhiên trong văn Việt hiện đại. Chỉnh nhẹ để giữ lực mệnh lệnh và làm câu mạch lạc hơn.
  terminology: «Hội chúng» là lựa chọn tốt cho ἐκκλησίᾳ, nhấn mạnh cuộc nhóm họp thay vì một thiết chế hay tòa nhà. «Đáng hổ thẹn» phản ánh thích đáng αἰσχρόν; «nói» vẫn để mở loại lời nói, đúng với sự không xác định của nguyên văn.
  issues:
