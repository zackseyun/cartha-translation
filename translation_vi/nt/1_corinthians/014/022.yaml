id: 1CO.14.22
reference: 1 Corinthians 14:22
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὥστε αἱ γλῶσσαι εἰς σημεῖόν εἰσιν οὐ τοῖς πιστεύουσιν ἀλλὰ τοῖς ἀπίστοις, ἡ δὲ προφητεία οὐ τοῖς ἀπίστοις ἀλλὰ τοῖς πιστεύουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/022.yaml
  text: So then[a], tongues are for a sign not to those who believe but to unbelievers[b], while prophecy is not to unbelievers but to those who believe.
translation:
  language: vi
  text: Vậy, việc nói các thứ tiếng[a] là một dấu hiệu, không phải cho những người tin mà cho những người không tin[b]; còn lời tiên tri không phải cho những người không tin mà cho những người tin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “các ngôn ngữ” hoặc “tiếng lạ”. Từ Hy Lạp có thể chỉ các ngôn ngữ, nhưng trong 1 Cô-rinh-tô 12–14, cách diễn đạt này không tự quyết định đó là ngoại ngữ hay lời nói xuất thần.
    reason: lexical_alternative
  - marker: b
    text: Dựa vào lời trích dẫn Ê-sai 28:11–12 ngay trước đó, một số người hiểu “dấu hiệu” ở đây là dấu hiệu của sự phán xét.
    reason: cross_reference
lexical_decisions:
- source_word: ὥστε
  choice: Vậy
  rationale: Diễn tả kết luận được rút ra từ lập luận và lời trích dẫn ngay trước đó; tự nhiên, gọn và giữ được sức suy luận.
- source_word: αἱ γλῶσσαι
  choice: việc nói các thứ tiếng
  rationale: Trong ngữ cảnh 1 Cô-rinh-tô 12–14, cụm này chỉ ân tứ hoặc hoạt động nói bằng γλῶσσαι. Cách dịch này tự nhiên trong tiếng Việt và không quyết định đó là ngoại ngữ hay lời nói xuất thần.
- source_word: εἰς σημεῖόν
  choice: là một dấu hiệu
  rationale: Giữ cách nói cô đọng và trung tính của tiếng Hy Lạp, không tự ý xác định dấu hiệu này mang ý nghĩa chứng thực hay phán xét.
- source_word: τοῖς πιστεύουσιν
  choice: cho những người tin
  rationale: Phản ánh phân từ được dùng như danh từ và giữ rõ ý nghĩa hành động 'tin'.
- source_word: τοῖς ἀπίστοις
  choice: cho những người không tin
  rationale: Tạo thế đối xứng trực tiếp với 'những người tin' và tránh sắc thái miệt thị có thể có của một số danh từ chỉ người.
- source_word: ἡ δὲ προφητεία
  choice: còn lời tiên tri
  rationale: δέ nêu sự tương phản; 'còn' tự nhiên trong tiếng Việt. 'Lời tiên tri' diễn đạt hoạt động/lời nói tiên tri trong chương này rõ hơn danh từ trừu tượng đơn thuần.
theological_decisions:
- issue: Ý nghĩa của γλῶσσαι trong bối cảnh các ân tứ
  choice: Dịch là 'việc nói các thứ tiếng', không xác định hiện tượng cụ thể.
  alternative: các ngoại ngữ; tiếng lạ; lời nói xuất thần
  rationale: γλῶσσαι có thể chỉ ngôn ngữ, nhưng hiện tượng chính xác trong 1 Cô-rinh-tô 12–14 vẫn gây tranh luận. Bản dịch không áp đặt kết luận hệ phái.
- issue: Ý nghĩa của σημεῖον đối với những người không tin
  choice: Giữ trung tính là 'một dấu hiệu'.
  alternative: một dấu hiệu xác chứng; một dấu hiệu phán xét
  rationale: Mạch văn và Ê-sai 28:11–12 có thể gợi ý sự phán xét, nhưng chính câu Hy Lạp chỉ nói 'dấu hiệu'; vì vậy không giải quyết tranh luận ngay trong chính văn.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Cấu trúc đối xứng 'không phải... mà...' được giữ để phản ánh lập luận chặt chẽ của nguyên văn; dấu chấm phẩy làm rõ hai vế tương phản.
