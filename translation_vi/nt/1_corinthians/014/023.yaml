  - severity: low
    issue: “những người chưa được chỉ dẫn” chưa tự nhiên.
    rationale: ἰδιῶται chỉ người không am hiểu/chưa được khai tâm về thực hành liên quan; “những người không am hiểu” diễn đạt tự nhiên hơn mà vẫn không đồng nhất họ với “người chưa tin”.
