revisions:
- from: Vậy, nếu toàn thể hội thánh tụ họp tại một nơi và mọi người đều nói các thứ tiếng[a], mà những người chưa được chỉ dẫn hoặc những người chưa tin bước vào[b], chẳng phải họ sẽ nói rằng anh chị em mất trí sao?
  to: Vậy, nếu toàn thể hội thánh tụ họp tại một nơi và mọi người đều nói tiếng lạ[a], mà những người không am hiểu hoặc những người chưa tin bước vào[b], chẳng phải họ sẽ nói rằng anh chị em mất trí sao?
  rationale: Đổi thuật ngữ chính văn về “nói tiếng lạ” để phản ánh cách dùng quen thuộc cho γλώσσαι trong mạch văn mà không quyết định hiện tượng này nhất thiết là ngôn ngữ loài người hay lời nói xuất thần. Chú thích giữ rõ phương án “các thứ tiếng/ngôn ngữ”. Đổi cách diễn đạt ἰδιῶται sang tiếng Việt tự nhiên hơn, đồng thời chú thích bảo toàn sắc thái người chưa am hiểu/chưa được khai tâm và sự phân biệt với ἄπιστοι.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T18:13:09Z'
review_pass:
  verdict: revise
  source_fidelity: Bản dịch giữ đúng cấu trúc điều kiện, ý toàn thể hội thánh nhóm lại, hai nhóm người được phân biệt bằng “hoặc”, và câu hỏi tu từ tương lai. Tuy nhiên, “nói các thứ tiếng” trong chính văn tiếng Việt dễ được hiểu là nói nhiều ngôn ngữ khác nhau, nên có nguy cơ thu hẹp/giải quyết hiện tượng γλώσσαι hơn nguyên văn và hơn lựa chọn “tongues” của audit trail.
  naturalness: Câu nhìn chung tự nhiên, nhưng “những người chưa được chỉ dẫn” hơi máy móc và không rõ họ được chỉ dẫn về điều gì. “Những người không am hiểu” tự nhiên hơn trong văn cảnh, đồng thời chú thích có thể làm rõ phạm vi am hiểu.
  terminology: Nên dùng “nói tiếng lạ” trong chính văn như cách gọi thông dụng của hiện tượng được bàn trong 1 Cô-rinh-tô 12–14, với chú thích bảo lưu khả năng “nói các thứ tiếng/ngôn ngữ”. “Hội thánh”, “người chưa tin”, và “mất trí” phù hợp ngữ vực và nội dung.
  issues:
  - severity: medium
    issue: “nói các thứ tiếng” có thể định hướng γλώσσαι thành các ngôn ngữ phân biệt.
