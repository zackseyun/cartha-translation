id: 1CO.14.23
reference: 1 Corinthians 14:23
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐὰν οὖν συνέλθῃ ἡ ἐκκλησία ὅλη ἐπὶ τὸ αὐτὸ καὶ πάντες ⸂λαλῶσιν γλώσσαις⸃, εἰσέλθωσιν δὲ ἰδιῶται ἢ ἄπιστοι, οὐκ ἐροῦσιν ὅτι μαίνεσθε;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/023.yaml
  text: Therefore[a], if the whole church comes together in one place and all speak in tongues, and uninstructed people or unbelievers enter[b], will they not say that you are out of your minds?
translation:
  language: vi
  text: Vậy, nếu toàn thể hội thánh tụ họp tại một nơi và mọi người đều nói tiếng lạ[a], mà những người không am hiểu hoặc những người chưa tin bước vào[b], chẳng phải họ sẽ nói rằng anh chị em mất trí sao?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “nói các thứ tiếng” hay “nói các ngôn ngữ.” Từ Hy Lạp có thể chỉ ngôn ngữ; trong văn cảnh này, nó là cách gọi hiện tượng ân tứ đang được bàn đến, nhưng câu này không tự xác định bản chất của hiện tượng ấy.'
    reason: alternative_reading
  - marker: b
    text: “Những người không am hiểu” cũng có thể hiểu là “người ngoài”, tức những người chưa am hiểu sinh hoạt của hội thánh; tại đây họ được phân biệt với “những người chưa tin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Vậy
  rationale: Diễn tả kết luận suy ra từ lập luận trước đó một cách tự nhiên trong tiếng Việt hiện đại.
- source_word: συνέλθῃ ἡ ἐκκλησία ὅλη ἐπὶ τὸ αὐτό
  choice: toàn thể hội thánh tụ họp tại một nơi
  rationale: Giữ ý toàn thể cộng đồng Cơ Đốc cùng nhóm lại tại một địa điểm, đồng thời tránh lặp từ không tự nhiên.
- source_word: λαλῶσιν γλώσσαις
  choice: nói các thứ tiếng
  rationale: “Thứ tiếng” là cách nói tự nhiên trong tiếng Việt và vẫn có thể chỉ hiện tượng ân tứ đang được bàn đến; chú thích bảo lưu cách gọi truyền thống “nói tiếng lạ” cùng tính chưa ngã ngũ của hiện tượng.
- source_word: ἰδιῶται
  choice: những người chưa được chỉ dẫn
  rationale: Chỉ những người chưa am hiểu hoặc chưa được khai tâm về sinh hoạt của hội thánh, và duy trì sự phân biệt với ἄπιστοι.
- source_word: ἄπιστοι
  choice: những người chưa tin
  rationale: Diễn đạt rõ những người không có đức tin, phù hợp với sự đối chiếu trong câu.
- source_word: μαίνεσθε
  choice: anh chị em mất trí
  rationale: Truyền đạt tự nhiên lời đánh giá rằng cả cộng đồng đang điên loạn; “anh chị em” thể hiện ngôi thứ hai số nhiều mà không mang sắc thái quá suồng sã.
- source_word: οὐκ ἐροῦσιν ὅτι
  choice: chẳng phải họ sẽ nói rằng
  rationale: Giữ thì tương lai và cấu trúc câu hỏi tu từ mong đợi câu trả lời khẳng định.
theological_decisions:
- issue: Bản chất của γλώσσαι trong 1 Cô-rinh-tô 14
  choice: Dịch “các thứ tiếng” trong chính văn và chú thích cách gọi “tiếng lạ”.
  alternative: Dịch thẳng “tiếng lạ” trong chính văn.
  rationale: γλῶσσαι có thể chỉ các ngôn ngữ, nhưng trong chương này cũng là thuật ngữ cho hiện tượng ân tứ đang được tranh luận. Chính văn và chú thích cùng nhau tránh quyết định hiện tượng đó nhất thiết là ngôn ngữ loài người hay lời nói xuất thần.
- issue: Quan hệ giữa ἰδιῶται và ἄπιστοι
  choice: 'Giữ thành hai nhóm được nối bằng “hoặc”: người chưa được chỉ dẫn và người chưa tin.'
  alternative: Gộp cả hai thành “người ngoài”.
  rationale: Nguyên văn phân biệt hai danh từ; không nên làm phẳng sự phân biệt có thể có giữa người thiếu hiểu biết về buổi nhóm và người không tin.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “hội thánh” cho ἐκκλησία, “anh chị em” để thể hiện ngôi thứ hai số nhiều, và giữ câu hỏi tu từ của nguyên văn. Mọi dấu chú thích đều xuất hiện trong chính văn.
