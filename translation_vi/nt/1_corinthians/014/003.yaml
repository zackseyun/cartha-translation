id: 1CO.14.3
reference: 1 Corinthians 14:3
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ δὲ προφητεύων ἀνθρώποις λαλεῖ οἰκοδομὴν καὶ παράκλησιν καὶ παραμυθίαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/003.yaml
  text: But the one who prophesies speaks to people for edification and encouragement and consolation[a][b][c].
translation:
  language: vi
  text: Nhưng người nói tiên tri thì nói với người ta để xây dựng, khích lệ và an ủi.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “để gây dựng” hoặc “để làm cho vững mạnh”.
    reason: lexical_alternative
  - marker: b
    text: “Khích lệ” dịch παράκλησις; từ này cũng có thể có nghĩa là “khuyên nhủ”, hoặc trong một số văn cảnh là “an ủi”.
    reason: lexical_alternative
  - marker: c
    text: “An ủi” dịch παραμυθία; cũng có thể hiểu là “vỗ về”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ προφητεύων
  choice: Nhưng người nói tiên tri
  rationale: Mạo từ đi với phân từ hiện tại được dùng như danh từ, chỉ người thực hiện hành động. “Nhưng” diễn đạt sắc thái tương phản nhẹ của δέ với câu trước; “nói tiên tri” giữ nguyên độ rộng ý nghĩa của προφητεύω.
- source_word: ἀνθρώποις
  choice: với người ta
  rationale: Dạng tặng cách số nhiều chỉ những người tiếp nhận lời nói và mang nghĩa chung, không riêng nam giới. Cách nói này tự nhiên trong tiếng Việt hiện đại.
- source_word: λαλεῖ
  choice: nói
  rationale: Diễn đạt trực tiếp động từ hiện tại λαλεῖ; kết hợp với “với người ta” để thể hiện đối tượng tiếp nhận.
- source_word: οἰκοδομὴν
  choice: để xây dựng
  rationale: οἰκοδομή được dùng theo nghĩa ẩn dụ là gây dựng hoặc làm vững mạnh cộng đồng. “Xây dựng” vừa dễ hiểu vừa giữ được hình ảnh gốc; “để” thể hiện công dụng hoặc kết quả của lời nói.
- source_word: παράκλησιν
  choice: khích lệ
  rationale: παράκλησις có thể chỉ sự khích lệ, khuyên nhủ hoặc an ủi. Trong chuỗi ba danh từ, “khích lệ” giúp phân biệt với sắc thái xoa dịu rõ hơn của παραμυθία.
- source_word: παραμυθίαν
  choice: an ủi
  rationale: παραμυθία chỉ lời đem lại sự an ủi, vỗ về hoặc nâng đỡ. “An ủi” là cách diễn đạt tự nhiên, rõ ràng và vẫn phân biệt được với “khích lệ”.
theological_decisions:
- issue: Ý nghĩa của “nói tiên tri” trong bối cảnh hội chúng
  choice: Giữ cách dịch “nói tiên tri”, không thu hẹp thành “giảng đạo” hoặc chỉ hiểu là báo trước tương lai.
  alternative: giảng đạo; nói lời mặc khải; báo trước tương lai
  rationale: Câu này đối chiếu việc nói tiên tri với việc nói các thứ tiếng trong hội chúng và mô tả tác dụng của lời tiên tri. Giữ thuật ngữ “nói tiên tri” bảo toàn độ rộng và sự căng thẳng thần học của nguyên ngữ mà không áp đặt cách hiểu riêng của một hệ phái.
translation_notes:
  register: Văn phong tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Cấu trúc ba vế được giữ rõ ràng; dùng “xây dựng” thay cho thuật ngữ Hán-Việt “kiến tạo” hoặc lối nói chuyên biệt “gây dựng thuộc linh” để tránh thêm ý không có trực tiếp trong câu.
