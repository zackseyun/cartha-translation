  source_fidelity: 'Bản dịch phản ánh đúng cấu trúc và ý nghĩa của câu Hy Lạp: δέ được diễn đạt bằng “Nhưng”; phân từ thực thể hóa ὁ ... προφητεύων được giữ là “người nói tiên tri”; ἀνθρώποις là đối tượng chung “người ta”; và ba danh từ οἰκοδομήν, παράκλησιν, παραμυθίαν được phân biệt hợp lý là “xây dựng, khích lệ và an ủi”. Cách diễn đạt không thu hẹp “nói tiên tri” thành giảng dạy hay tiên đoán.'
  naturalness: Câu văn tự nhiên trong tiếng Việt tiêu chuẩn hiện đại, mạch lạc và giữ nhịp liệt kê ba vế của nguyên văn. “Nói với người ta” và “để xây dựng, khích lệ và an ủi” đều dễ hiểu trong văn cảnh trang trọng của bản dịch Kinh Thánh.
