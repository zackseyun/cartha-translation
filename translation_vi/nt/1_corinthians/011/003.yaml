id: 1CO.11.3
reference: 1 Corinthians 11:3
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: θέλω δὲ ὑμᾶς εἰδέναι ὅτι παντὸς ἀνδρὸς ἡ κεφαλὴ ὁ Χριστός ἐστιν, κεφαλὴ δὲ γυναικὸς ὁ ἀνήρ, κεφαλὴ δὲ ⸀τοῦ Χριστοῦ ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/003.yaml
  text: But I want you to know that the head of every man is Messiah[a], and the head of a woman is the man[b], and the head of Messiah is God.
translation:
  language: vi
  text: Nhưng tôi muốn anh chị em biết rằng đầu[a] của mỗi người nam là Đấng Christ, đầu của người nữ[b] là người nam, và đầu của Đấng Christ là Đức Chúa Trời.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ “đầu” cũng có thể được hiểu là “nguồn” hoặc “thẩm quyền đối với”; bản chính giữ nguyên ẩn dụ trong tiếng Hy Lạp.
    reason: lexical_alternative
  - marker: b
    text: “Người nữ” và “người nam” ở đây cũng có thể được hiểu là “vợ” và “chồng”.
    reason: alternative_reading
lexical_decisions:
- source_word: θέλω δὲ ὑμᾶς εἰδέναι
  choice: Nhưng tôi muốn anh chị em biết
  rationale: Diễn đạt tự nhiên ý định hiện tại của Phao-lô; δέ đánh dấu một chuyển ý nhẹ, còn đại từ số nhiều ὑμᾶς được thể hiện bằng cách xưng hô cộng đồng quen thuộc trong tiếng Việt.
- source_word: παντὸς ἀνδρός
  choice: mỗi người nam
  rationale: ἀνήρ ở đây có thể là người nam hoặc người chồng. Cách dịch 'mỗi người nam' phù hợp với phạm vi khái quát của πᾶς và giữ sự phân biệt giới tính trong câu.
- source_word: κεφαλή
  choice: đầu
  rationale: Giữ nguyên ẩn dụ Hy Lạp thay vì quyết định thay người đọc rằng từ này nhất thiết có nghĩa là 'nguồn' hay 'người có thẩm quyền trên'.
- source_word: ὁ Χριστός / τοῦ Χριστοῦ
  choice: Đấng Christ
  rationale: Χριστός mang nghĩa tước hiệu 'Đấng được xức dầu'. 'Đấng Christ' là cách gọi trang trọng, quen thuộc trong tiếng Việt và giữ sắc thái tước hiệu.
- source_word: γυναικός
  choice: người nữ
  rationale: γυνή có thể chỉ người nữ hoặc người vợ. 'Người nữ' giữ cách đọc khái quát trong câu chính, còn khả năng chỉ quan hệ hôn nhân được nêu ở chú thích.
- source_word: ὁ ἀνήρ
  choice: người nam
  rationale: Trong cấu trúc song song với γυνή, ἀνήρ có thể là người nam hoặc người chồng. Bản chính giữ nghĩa khái quát và chú thích ghi nhận nghĩa hôn nhân.
- source_word: ὁ θεός
  choice: Đức Chúa Trời
  rationale: Cách dịch chuẩn, trang trọng và quen thuộc của θεός trong văn phong Kinh Thánh tiếng Việt.
theological_decisions:
- issue: Ý nghĩa của κεφαλή trong ba mệnh đề song song
  choice: Giữ ẩn dụ là 'đầu' trong bản chính.
  alternative: nguồn; người có thẩm quyền trên
  rationale: Ẩn dụ này có nhiều cách giải thích và mang ý nghĩa thần học gây tranh luận. Dịch trực tiếp giúp bảo toàn sự mơ hồ thực sự của nguyên văn mà không áp đặt một kết luận.
- issue: ἀνήρ và γυνή nên được hiểu là người nam/người nữ hay chồng/vợ
  choice: Dùng 'người nam' và 'người nữ' trong bản chính.
  alternative: chồng và vợ
  rationale: Cấu trúc khái quát và song song của câu ủng hộ cách dịch người nam/người nữ, nhưng ngữ nghĩa của các danh từ và văn cảnh rộng hơn vẫn cho phép cách hiểu chồng/vợ.
- issue: Mệnh đề 'đầu của Đấng Christ là Đức Chúa Trời'
  choice: Dịch sát nguyên văn, không thêm lời giải thích về bản thể hay vai trò.
  alternative: Diễn giải mệnh đề như chỉ nói đến trật tự chức năng.
  rationale: Bản dịch cần giữ nguyên phát biểu và sức căng thần học của câu, không làm suy yếu cũng không mở rộng nó bằng một hệ thống giải thích riêng.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng 'anh chị em' để xưng hô cộng đồng; giữ nhịp ba mệnh đề song song của nguyên văn và dùng nhất quán 'đầu' để bảo toàn ẩn dụ.
