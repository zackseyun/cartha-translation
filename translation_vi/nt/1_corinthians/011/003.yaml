- from: Nhưng tôi muốn anh chị em biết rằng đầu của mỗi người nam là Đấng Christ[a], đầu của người nữ là người nam[b], và đầu của Đấng Christ là Đức Chúa Trời.
  to: Nhưng tôi muốn anh chị em biết rằng đầu[a] của mỗi người nam là Đấng Christ, đầu của người nữ[b] là người nam, và đầu của Đấng Christ là Đức Chúa Trời.
