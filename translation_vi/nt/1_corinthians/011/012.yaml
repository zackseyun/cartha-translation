id: 1CO.11.12
reference: 1 Corinthians 11:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὥσπερ γὰρ ἡ γυνὴ ἐκ τοῦ ἀνδρός, οὕτως καὶ ὁ ἀνὴρ διὰ τῆς γυναικός· τὰ δὲ πάντα ἐκ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/012.yaml
  text: For just as the woman is from the man[a], so also the man is through the woman; but all things are from God.
translation:
  language: vi
  text: Vì như người nữ ra từ người nam[a], thì người nam cũng qua người nữ mà ra; nhưng mọi sự đều ra từ Đức Chúa Trời.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hoặc “người vợ” và “người chồng”, nếu hiểu văn cảnh theo nghĩa hẹp là quan hệ hôn nhân thay vì quan hệ nam nữ nói chung.
    reason: alternative_reading
lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: Vì như
  rationale: Giữ cả chức năng giải thích của γάρ và cấu trúc so sánh của ὥσπερ, đồng thời tự nhiên trong tiếng Việt.
- source_word: ἡ γυνή
  choice: người nữ
  rationale: γυνή có thể là “người nữ” hoặc “vợ”; mạch lập luận về sự sáng tạo và sinh thành nghiêng về nghĩa khái quát “người nữ”.
- source_word: ἐκ τοῦ ἀνδρός
  choice: ra từ người nam
  rationale: ἐκ chỉ nguồn gốc; cách dịch này giữ liên tưởng đến việc người nữ được tạo nên từ người nam.
- source_word: ὁ ἀνήρ
  choice: người nam
  rationale: ἀνήρ có thể là “người nam” hoặc “chồng”; ở đây nghĩa khái quát tương ứng với γυνή phù hợp hơn.
- source_word: διὰ τῆς γυναικός
  choice: qua người nữ mà ra
  rationale: διά với sở hữu cách diễn tả trung gian hoặc phương tiện, nói đến việc người nam được sinh ra qua người nữ; “mà ra” làm câu tiếng Việt rõ nghĩa nhưng vẫn phân biệt với ἐκ.
- source_word: τὰ δὲ πάντα
  choice: nhưng muôn vật đều
  rationale: δέ đánh dấu một sự chuyển ý có sắc thái tương phản nhẹ; “muôn vật” diễn đạt tự nhiên toàn thể vạn vật trong tiếng Việt Kinh Thánh trang trọng.
- source_word: ἐκ τοῦ θεοῦ
  choice: ra từ Đức Chúa Trời
  rationale: ἐκ tiếp tục chỉ nguồn gốc tối hậu; “Đức Chúa Trời” là cách gọi trang trọng, phổ thông trong truyền thống Tin Lành tiếng Việt.
theological_decisions:
- issue: Nghĩa của γυνή và ἀνήρ
  choice: người nữ và người nam theo nghĩa khái quát
  alternative: vợ và chồng
  rationale: Lời nhắc đến sự sáng tạo và sự sinh thành mở rộng phạm vi vượt quá quan hệ hôn nhân; cách dịch khái quát giữ được sự đối ứng giữa hai giới mà không thu hẹp ý.
- issue: Quan hệ giữa hai nguồn gốc được nêu
  choice: phân biệt “ra từ” (ἐκ) với “qua ... mà ra” (διά)
  alternative: dịch cả hai bằng “từ”
  rationale: Phao-lô phân biệt nguồn gốc của người nữ từ người nam trong trình thuật sáng tạo với việc người nam được sinh ra qua người nữ; giữ hai giới từ bảo toàn tính tương hỗ và sức căng của lập luận.
- issue: Phạm vi của τὰ πάντα
  choice: muôn vật
  alternative: mọi sự
  rationale: Cụm từ có thể được hiểu rộng là mọi sự hoặc mọi vật; “muôn vật” diễn đạt lời khẳng định cao điểm rằng nguồn gốc tối hậu của tất cả là Đức Chúa Trời mà không giới hạn vào riêng loài người.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “người nữ/người nam” để giữ nghĩa khái quát; giữ rõ sự khác biệt giữa ἐκ và διά. Dấu chấm phẩy bảo toàn hai vế lập luận và phần kết luận cao điểm.
