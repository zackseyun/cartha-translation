source:
  edition: SBLGNT
  text: πρῶτον μὲν γὰρ συνερχομένων ὑμῶν ἐν ἐκκλησίᾳ ἀκούω σχίσματα ἐν ὑμῖν ὑπάρχειν, καὶ μέρος τι πιστεύω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/018.yaml
  text: For[a], in the first place, when you come together in assembly, I hear that divisions exist among you, and in part I believe it.
translation:
  language: vi
  text: Trước hết, tôi nghe rằng khi anh chị em tụ họp với tư cách là hội chúng[a], giữa anh chị em có chia rẽ; và tôi phần nào tin điều đó.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “trong hội chúng” hoặc “trong Hội Thánh”; từ Hy Lạp ở đây chỉ cộng đồng tín hữu đang tụ họp, không nhất thiết chỉ một tòa nhà.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πρῶτον μὲν
  choice: Trước hết
  rationale: Giữ chức năng diễn ngôn của thành ngữ Hy Lạp, mở đầu điểm thứ nhất dù không có cặp μέν...δέ hoàn chỉnh.
- source_word: συνερχομένων ὑμῶν
  choice: khi anh chị em họp lại
  rationale: Diễn đạt kết cấu sở hữu cách tuyệt đối theo nghĩa thời gian; “họp lại” tự nhiên và phù hợp bối cảnh cộng đồng.
- source_word: ἐν ἐκκλησίᾳ
  choice: thành hội chúng
  rationale: Trong ngữ cảnh này, ἐκκλησία chỉ cộng đồng tín hữu đang tụ họp, không nhất thiết là tòa nhà. Cụm “họp lại thành hội chúng” truyền đạt nghĩa tập thể của cách nói Hy Lạp.
- source_word: ἀκούω
  choice: tôi nghe
  rationale: Giữ thì hiện tại và tính chất thông tin được thuật lại.
- source_word: σχίσματα
  choice: những sự chia rẽ
  rationale: Thể hiện các vết rạn nứt hoặc phân chia trong cộng đồng mà không mặc nhiên biến chúng thành các phe phái có tổ chức.
- source_word: ὑπάρχειν
  choice: có
  rationale: Tiếng Việt tự nhiên dùng “có” để diễn đạt sự hiện hữu của những chia rẽ giữa họ.
- source_word: καὶ μέρος τι
  choice: và ... phần nào
  rationale: 'Giữ sắc thái dè dặt: Phao-lô chỉ chấp nhận bản tin đến một mức độ nào đó.'
- source_word: πιστεύω
  choice: tôi ... tin điều đó
  rationale: Bổ sung tân ngữ đã được ngữ cảnh hàm ý, giúp câu tiếng Việt rõ ràng mà không thêm nội dung.
theological_decisions:
- issue: Nghĩa của ἐκκλησία trong ngữ cảnh
  choice: hội chúng đang tụ họp
  alternative: trong nhà thờ; trong Hội Thánh
  rationale: Ngữ cảnh nói đến hành động tín hữu Cô-rinh-tô cùng tụ họp, đặc biệt liên quan đến Bữa Ăn của Chúa. Cách dịch này tránh khiến người đọc hiểu chủ yếu về một tòa nhà, đồng thời không làm mất ý nghĩa cộng đồng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” để chỉ cộng đồng tín hữu gồm cả nam lẫn nữ; giữ sắc thái dè dặt của “phần nào tin” và tránh giải thích quá mức bản chất của các sự chia rẽ.
