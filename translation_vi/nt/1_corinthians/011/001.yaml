id: 1CO.11.1
reference: 1 Corinthians 11:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: μιμηταί μου γίνεσθε, καθὼς κἀγὼ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/001.yaml
  text: Become imitators of me[b][a], just as I also am of the Messiah.
translation:
  language: vi
  text: Hãy trở thành những người noi gương tôi, như chính tôi cũng noi gương Đấng Mê-si[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “Đấng Christ”.
    reason: alternative_reading
lexical_decisions:
- source_word: μιμηταί
  choice: những người noi gương
  rationale: Danh từ chỉ những người bắt chước hoặc làm theo gương của người khác. “Noi gương” tự nhiên và trang trọng trong tiếng Việt, đồng thời giữ rõ ý bắt chước mẫu mực hơn “đi theo”.
- source_word: μου
  choice: tôi
  rationale: Sở hữu cách phụ thuộc vào μιμηταί, nên cụm “những người noi gương tôi” truyền đạt tự nhiên quan hệ “imitators of me” trong tiếng Việt.
- source_word: γίνεσθε
  choice: Hãy trở thành
  rationale: Mệnh lệnh hiện tại của γίνομαι mang ý “trở nên/trở thành”, không chỉ đơn thuần là “hãy là”. Cách dịch này giữ được lực chuyển biến của động từ.
- source_word: καθὼς
  choice: như
  rationale: Từ nối nêu sự so sánh giữa việc các tín hữu noi gương Phao-lô và việc chính ông noi gương Đấng Mê-si. “Như” là cách diễn đạt tự nhiên, đủ rõ trong tiếng Việt.
- source_word: κἀγὼ
  choice: chính tôi cũng
  rationale: Dạng rút gọn καί + ἐγώ có sắc thái bổ sung “tôi cũng”; thêm “chính” làm nổi bật chủ thể mà không thay đổi nội dung.
- source_word: Χριστοῦ
  choice: Đấng Mê-si
  rationale: Χριστός ở đây chỉ tước hiệu của Chúa Giê-su. “Đấng Mê-si” giữ nghĩa “Đấng được xức dầu” và phân biệt tước hiệu với tên riêng.
theological_decisions:
- issue: Cách dịch Χριστοῦ
  choice: Đấng Mê-si
  alternative: Đấng Christ
  rationale: Ngữ cảnh dùng Χριστός như tước hiệu và mẫu mực mà Phao-lô noi theo. Bản dịch chính dùng “Đấng Mê-si”; cách gọi truyền thống “Đấng Christ” được giữ trong chú thích.
- issue: Phép tỉnh lược trong κἀγὼ Χριστοῦ
  choice: lặp lại “noi gương” trong tiếng Việt
  alternative: “như chính tôi cũng là người noi gương Đấng Mê-si”
  rationale: 'Tiếng Hy Lạp tỉnh lược danh từ μιμητής ở vế sau: theo sát cấu trúc là “như tôi cũng [là người noi gương] Đấng Christ”. Lặp lại động từ “noi gương” diễn đạt đúng thành phần được hiểu ngầm và tạo câu tiếng Việt sáng rõ, không hàm ý Phao-lô thuộc về Đấng Mê-si theo nghĩa sở hữu.'
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. “Hãy trở thành những người noi gương” giữ sắc thái của γίνεσθε; vế sau giải tỏa phép tỉnh lược Hy Lạp bằng cách lặp lại “noi gương” để câu tự nhiên và không mơ hồ sai hướng.
