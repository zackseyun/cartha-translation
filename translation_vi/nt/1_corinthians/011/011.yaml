id: 1CO.11.11
reference: 1 Corinthians 11:11
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: πλὴν οὔτε ⸂γυνὴ χωρὶς ἀνδρὸς οὔτε ἀνὴρ χωρὶς γυναικὸς⸃ ἐν κυρίῳ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/011.yaml
  text: Nevertheless[a], in the Lord woman is not apart from man, nor man apart from woman.
translation:
  language: vi
  text: Tuy nhiên, trong Chúa, người nữ không tách biệt khỏi người nam, và người nam cũng không tách biệt khỏi người nữ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “vợ không tách biệt khỏi chồng, và chồng cũng không tách biệt khỏi vợ.” Các từ Hy Lạp có thể chỉ người nữ/người nam hoặc vợ/chồng; ở đây chọn nghĩa rộng hơn vì lời khẳng định dường như mang tính tổng quát, không chỉ giới hạn trong hôn nhân.'
    reason: alternative_reading
lexical_decisions:
- source_word: πλὴν
  choice: Tuy nhiên
  rationale: Diễn tả bước chuyển mang tính nhượng bộ và cân bằng lại lập luận trước đó; cách nói tự nhiên, trang trọng trong tiếng Việt hiện đại.
- source_word: γυνή
  choice: người nữ
  rationale: Từ Hy Lạp có thể chỉ người nữ hoặc người vợ; ngữ cảnh là một khẳng định tổng quát về quan hệ tương hỗ nên chọn nghĩa rộng hơn.
- source_word: ἀνήρ
  choice: người nam
  rationale: Từ Hy Lạp có thể chỉ người nam hoặc người chồng; sự đối xứng với γυνή trong khẳng định tổng quát này phù hợp với nghĩa rộng.
- source_word: χωρίς
  choice: tách biệt khỏi
  rationale: Giữ ý về sự phân cách hoặc tồn tại độc lập, đồng thời tránh diễn giải quá mức thành một mệnh đề hoàn toàn về sự lệ thuộc.
- source_word: οὔτε ... οὔτε
  choice: không ... và ... cũng không
  rationale: Tái hiện hai vế phủ định tương ứng bằng cấu trúc tự nhiên trong tiếng Việt và giữ sự cân xứng của câu.
- source_word: ἐν κυρίῳ
  choice: trong Chúa
  rationale: Giữ nguyên cách diễn đạt đặc trưng của Phao-lô, có thể chỉ phạm vi hay mối liên hệ được xác định bởi Chúa mà không thu hẹp thêm.
theological_decisions:
- issue: Nên dịch γυνή / ἀνήρ là “người nữ/người nam” hay “vợ/chồng”
  choice: người nữ/người nam
  alternative: vợ/chồng
  rationale: Ngữ cảnh gần nói về người nam và người nữ trong sự sáng tạo và thờ phượng; câu này có vẻ là lời khẳng định cân bằng mang tính tổng quát. Chú thích vẫn bảo lưu nghĩa hôn nhân vốn có thể có trong từ Hy Lạp.
- issue: Sắc thái của χωρίς trong quan hệ giữa người nữ và người nam
  choice: không tách biệt khỏi
  alternative: không thể thiếu / không độc lập với
  rationale: “Không tách biệt khỏi” bám sát hình ảnh phân cách trong nguyên văn và bảo toàn độ mở của câu, thay vì xác định rõ đây là sự cần thiết hay lệ thuộc.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc hai vế được giữ cân xứng; “trong Chúa” bảo lưu cách nói thần học cô đọng của nguyên văn.
