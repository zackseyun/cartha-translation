- from: 'Anh chị em hãy tự mình phán xét: một người phụ nữ cầu nguyện với Đức Chúa Trời mà không che đầu thì có thích hợp không?[a]'
  to: 'Anh chị em hãy tự xét: một người phụ nữ cầu nguyện với Đức Chúa Trời mà không che đầu thì có thích hợp không?[a]'
  rationale: Chỉ thay “tự mình phán xét” bằng “tự xét” để phản ánh chính xác hơn lời kêu gọi tự đánh giá trong ngữ cảnh và tránh sắc thái xét đoán hiện nay của “phán xét.” Chú thích và các lựa chọn ngữ nghĩa khác được giữ nguyên.
