  source_fidelity: 'Bản dịch truyền đạt đúng cấu trúc tu từ và các thành tố chính của câu: lời kêu gọi cộng đồng tự đánh giá, câu hỏi về tính thích hợp, nghĩa khái quát của γυναῖκα, và việc cầu nguyện khi đầu không che. Tuy nhiên, “phán xét” trong tiếng Việt hiện đại thường gợi hành vi xét đoán/kết án người khác hơn là tự cân nhắc, đánh giá điều phải lẽ như κρίνατε trong ngữ cảnh này.'
  naturalness: “Anh chị em hãy tự xét” tự nhiên, gọn, và phù hợp hơn với lời kêu gọi người nghe tự đánh giá. Phần còn lại của câu rõ ràng, trang trọng vừa phải và dễ hiểu. Cách nói “cầu nguyện với Đức Chúa Trời” là cách dùng Việt ngữ Cơ Đốc thông dụng để chỉ Đấng được cầu nguyện cùng.
  terminology: “Người phụ nữ” bảo toàn nghĩa mặc định, không hạn hẹp γυναῖκα thành “vợ”; chú thích giữ đúng khả năng nghĩa hôn nhân. “Đức Chúa Trời,” “cầu nguyện,” và “che đầu” nhất quán với ngữ vực Kinh Thánh Việt ngữ hiện đại.
  issues:
