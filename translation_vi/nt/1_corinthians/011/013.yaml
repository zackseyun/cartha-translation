base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/013.yaml
  text: 'Judge for yourselves: is it proper for a woman to pray to God with her head uncovered?[a]'
translation:
  language: vi
  text: 'Anh chị em hãy tự xét: một người phụ nữ cầu nguyện với Đức Chúa Trời mà không che đầu thì có thích hợp không?[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hoặc “một người vợ,” nếu hiểu γυνή theo nghĩa hôn nhân trong văn mạch rộng hơn của phân đoạn này.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν ὑμῖν αὐτοῖς
  choice: Anh chị em hãy tự mình
  rationale: Diễn đạt tự nhiên sức nhấn mạnh phản thân của cụm từ, kêu gọi chính các tín hữu Cô-rinh-tô tự đánh giá.
- source_word: κρίνατε
  choice: phán xét
  rationale: Giữ lực trực tiếp của mệnh lệnh aorist, ở đây mang nghĩa xem xét và đưa ra nhận định.
- source_word: πρέπον ἐστὶν
  choice: có thích hợp không
  rationale: Truyền đạt câu hỏi về điều phù hợp hoặc phải lẽ trong hoàn cảnh này bằng tiếng Việt hiện đại, tự nhiên.
- source_word: γυναῖκα
  choice: một người phụ nữ
  rationale: γυνή có thể là “phụ nữ” hoặc “vợ”; câu này không nhắc rõ đến chồng nên nghĩa khái quát được dùng trong chính văn, còn nghĩa hôn nhân được giữ ở chú thích.
- source_word: ἀκατακάλυπτον
  choice: mà không che đầu
  rationale: Tính từ có nghĩa là “không được che”; ngữ cảnh trực tiếp cho thấy phần được nói đến là đầu, nên làm rõ điều hàm ẩn này.
- source_word: τῷ θεῷ
  choice: với Đức Chúa Trời
  rationale: Sau động từ cầu nguyện, cách diễn đạt này xác định Đức Chúa Trời là Đấng được hướng lời cầu nguyện đến và tự nhiên trong tiếng Việt.
- source_word: προσεύχεσθαι
  choice: cầu nguyện
  rationale: Tương đương trực tiếp và thông dụng của động từ nguyên mẫu, phụ thuộc vào câu hỏi điều ấy có thích hợp hay không.
theological_decisions:
- issue: Nghĩa của γυνή trong phần bàn về việc che đầu
  choice: một người phụ nữ
  alternative: một người vợ
  rationale: Bản thân câu này không nói rõ đến người chồng và đặt câu hỏi theo cách khái quát. Chính văn vì thế không thu hẹp nghĩa vào quan hệ hôn nhân, nhưng chú thích vẫn bảo tồn khả năng ấy trong văn mạch rộng hơn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Anh chị em” làm rõ đối tượng số nhiều của mệnh lệnh mà không làm thay đổi nội dung. Câu hỏi tu từ và sự mơ hồ thực sự của γυνή được bảo tồn; dấu chú thích [a] có mặt trong chính văn.
