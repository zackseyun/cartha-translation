  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οὐ γάρ ἐστιν ἀνὴρ ἐκ γυναικός, ἀλλὰ γυνὴ ἐξ ἀνδρός·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/008.yaml
  text: For man is not from woman[a], but woman from man.
translation:
  language: vi
  text: Vì người nam không ra từ người nữ,[a] nhưng người nữ ra từ người nam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Vì chồng không ra từ vợ, nhưng vợ ra từ chồng.” Các từ Hy Lạp có thể mang nghĩa “người nam/người nữ” hoặc “chồng/vợ”; ở đây ưu tiên nghĩa rộng trong bối cảnh sáng tạo.'
    reason: alternative_reading
lexical_decisions:
- source_word: γάρ
  choice: Vì
  rationale: Dẫn vào lý do giải thích cho lời khẳng định trước đó; “Vì” tự nhiên và giữ rõ quan hệ lập luận.
- source_word: ἀνὴρ / ἀνδρός
  choice: người nam
  rationale: Trong lập luận về nguồn gốc khi sáng tạo, cặp từ này đối ứng với γυνή và chỉ người nam nói chung; cách dịch này cũng tránh việc “người” bị hiểu là toàn thể nhân loại.
- source_word: ἐκ / ἐξ
  choice: ra từ
  rationale: Chỉ nguồn gốc hoặc sự phát xuất. “Ra từ” tự nhiên trong tiếng Việt và làm rõ ý về nguồn gốc trong trình thuật sáng tạo.
- source_word: γυναικός / γυνὴ
  choice: người nữ
  rationale: Đối ứng với ἀνήρ trong bối cảnh sáng tạo và chỉ người nữ nói chung, dù từ Hy Lạp cũng có thể mang nghĩa “vợ” tùy ngữ cảnh.
- source_word: ἀλλὰ
  choice: nhưng
  rationale: Diễn đạt sự tương phản mạnh giữa hai vế một cách rõ ràng, tự nhiên.
- source_word: ἐστιν
  choice: không ra từ
  rationale: Động từ nối kết hợp với cụm ἐκ γυναικός tạo thành lời khẳng định về nguồn gốc; tiếng Việt tự nhiên không cần dịch riêng động từ “là”.
theological_decisions:
- issue: Nên hiểu ἀνήρ/γυνή là “người nam/người nữ” hay “chồng/vợ”
  choice: người nam/người nữ
  alternative: chồng/vợ
  rationale: Việc Phao-lô nói đến nguồn gốc “ra từ” gợi trực tiếp đến trình thuật sáng tạo, nên nghĩa rộng về người nam và người nữ phù hợp hơn. Chú thích vẫn bảo tồn nghĩa hôn nhân vốn có thể có của các từ Hy Lạp.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “người nam/người nữ” để thể hiện rõ sự đối ứng giới tính và giữ phạm vi sáng tạo của câu; lặp lại cấu trúc “ra từ” nhằm bảo toàn thế tương phản của nguyên văn.
