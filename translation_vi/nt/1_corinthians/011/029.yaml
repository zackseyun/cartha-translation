  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ γὰρ ἐσθίων καὶ ⸀πίνων κρίμα ἑαυτῷ ἐσθίει καὶ πίνει μὴ διακρίνων τὸ ⸀σῶμα.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/029.yaml
  text: For the one who eats and drinks eats and drinks judgment on himself[b][a], not discerning the body.
translation:
  language: vi
  text: Vì người nào ăn và uống mà không phân định thân thể[a][b] thì tự chuốc lấy sự phán xét cho chính mình.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Một số thủ bản chép “thân thể của Chúa” thay cho “thân thể”.
    reason: textual_variant
  - marker: b
    text: Cũng có thể dịch là “phân biệt thân thể”. Cụm từ này có thể nói đến việc nhận biết ý nghĩa của Bữa Tiệc của Chúa, cộng đồng tín hữu đang nhóm họp, hoặc cả hai.
    reason: alternative_reading
lexical_decisions:
- source_word: κρίμα
  choice: sự phán xét
  rationale: Từ này chỉ sự xét xử hoặc phán quyết. “Sự phán xét” giữ nghĩa rộng và phù hợp với văn cảnh nói đến sự sửa phạt của Đức Chúa Trời, không hàm ý chắc chắn về sự kết án đời đời.
- source_word: ἑαυτῷ
  choice: cho chính mình
  rationale: Dạng đại từ phản thân ở tặng cách cho thấy chính người ăn uống phải nhận lấy sự phán xét; cách diễn đạt này tự nhiên trong tiếng Việt và không thêm sắc thái vượt quá nguyên văn.
- source_word: διακρίνων
  choice: phân định
  rationale: Động từ có thể chỉ việc phân biệt, nhận định hoặc đánh giá đúng. “Phân định” giữ được cả ý nhận biết lẫn phân biệt mà không xác quyết đối tượng phải được hiểu theo một cách duy nhất.
- source_word: τὸ σῶμα
  choice: thân thể
  rationale: Nguyên văn khả tín nhất chỉ viết “thân thể”, không có “của Chúa”. Cách dịch ngắn gọn này bảo toàn khả năng nói đến thân thể Đấng Christ trong bữa ăn, thân thể là cộng đồng tín hữu, hoặc cả hai.
- source_word: ὁ ... ἐσθίων καὶ πίνων
  choice: người nào ăn và uống
  rationale: Phân từ có mạo từ diễn tả một người bất kỳ. “Người nào” truyền đạt ý khái quát tự nhiên trong tiếng Việt.
- source_word: μὴ διακρίνων
  choice: mà không phân định
  rationale: Cấu trúc này diễn đạt rõ sự thiếu phân định gắn với người ăn uống, đồng thời giữ quan hệ logic của phân từ phủ định mà không phải thêm một lời giải thích thần học.
theological_decisions:
- issue: Ý nghĩa của “thân thể” trong bối cảnh Tiệc Thánh
  choice: Giữ nguyên cách nói mơ hồ “thân thể” trong chính văn.
  alternative: “thân thể của Chúa” hoặc “thân thể là cộng đồng tín hữu”
  rationale: Tiếng Hy Lạp chỉ nói “thân thể”. Văn cảnh liên quan cả ý nghĩa bữa ăn của Chúa lẫn cách tín hữu đối xử với nhau, nên bản dịch không thu hẹp câu vào một cách giải thích duy nhất.
- issue: Sắc thái của κρίμα
  choice: “sự phán xét” thay vì “sự kết án”
  alternative: “sự kết án” hoặc “án phạt”
  rationale: Câu 32 phân biệt việc Chúa sửa phạt tín hữu với việc bị kết án cùng thế gian. Vì vậy, “sự phán xét” phản ánh chính xác hơn phạm vi nghĩa tại đây và không mặc nhiên biến nó thành sự kết án cuối cùng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Phép lặp “ăn và uống” được giữ lại vì có chủ ý trong nguyên văn. Cấu trúc “mà không… thì…” giúp câu tiếng Việt sáng rõ, còn “thân thể” được giữ không giải nghĩa trong chính văn để bảo toàn sự căng thẳng thần học của câu.
