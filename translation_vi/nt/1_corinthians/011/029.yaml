revisions:
- from: Vì người nào ăn và uống mà không phân định thân thể[a][b] thì ăn và uống sự phán xét cho chính mình.
  to: Vì người nào ăn và uống mà không phân định thân thể[a][b] thì tự chuốc lấy sự phán xét cho chính mình.
  rationale: Sửa duy nhất trong chính văn là thay cách kết hợp từ ngữ gượng “ăn và uống sự phán xét cho chính mình” bằng cách nói tiếng Việt tự nhiên “tự chuốc lấy sự phán xét cho chính mình.” Điều này giữ ý một người tự gây nên/phải nhận lấy κρίμα, không đồng nhất κρίμα với sự kết án chung cuộc. “Thân thể” vẫn không có bổ ngữ. Chú thích b được chỉnh cho tự nhiên, đồng thời vẫn nêu hai hướng đọc chính mà không quyết định một hướng.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T18:12:19Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch truyền đạt đúng các yếu tố cốt lõi của câu Hy Lạp: tính khái quát của phân từ có mạo từ, sự lặp lại của “ăn và uống,” κρίμα là “sự phán xét,” đại từ phản thân, và τὸ σῶμα không được thêm “của Chúa.” Cấu trúc “mà không phân định ... thì” diễn đạt hợp lý phân từ phủ định μὴ διακρίνων. Tuy nhiên, “ăn và uống sự phán xét cho chính mình” là một kết hợp từ ngữ hơi gượng trong tiếng Việt hiện đại; “tự chuốc lấy sự phán xét” truyền đạt rõ hậu quả phản thân mà không xác định quá mức bản chất của κρίμα.'
  naturalness: 'Câu được chỉnh nhẹ để trôi chảy hơn trong tiếng Việt hiện đại, vẫn giữ phép lặp “ăn và uống” ở vế đầu và không biến “thân thể” thành một diễn giải thần học. Chú thích b cũng được diễn đạt lại cho rõ hơn: cộng đồng tín hữu đang nhóm họp được nêu như một khả năng quy chiếu, không phải là nghĩa duy nhất.'
  terminology: Giữ “thân thể” theo τὸ σῶμα và biến thể “thân thể của Chúa” trong chú thích. Giữ “sự phán xét” cho κρίμα, tránh “sự kết án.” “Bữa Tiệc của Chúa” trong chú thích là cách gọi trung tính, gần với văn cảnh và không áp đặt một truyền thống giáo phái.
  issues:
