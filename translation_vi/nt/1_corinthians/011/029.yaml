    rationale: Tiếng Việt thường diễn đạt hậu quả phản thân này tự nhiên hơn bằng “tự chuốc lấy sự phán xét.” Cách sửa không biến κρίμα thành “kết án” và không giải quyết trước ý nghĩa của “thân thể.”
  - severity: low
    issue: Chú thích b có cụm “cộng đồng tín hữu nhóm họp là thân thể” chưa thật tự nhiên và dễ gây lẫn chủ-vị.
    rationale: Đổi thành “cộng đồng tín hữu đang nhóm họp, là thân thể [Đấng Christ]”/“cộng đồng tín hữu đang nhóm họp” sẽ rõ cú pháp hơn. Để tránh thêm danh xưng không có trong câu, bản sửa chỉ nói đây là một khả năng quy chiếu.
