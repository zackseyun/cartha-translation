id: 1CO.11.17
reference: 1 Corinthians 11:17
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Τοῦτο δὲ ⸂παραγγέλλων οὐκ ἐπαινῶ⸃ ὅτι οὐκ εἰς τὸ κρεῖσσον ἀλλὰ εἰς τὸ ἧσσον συνέρχεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/017.yaml
  text: But in giving this instruction[a], I do not praise you, because you come together not for the better but for the worse.
translation:
  language: vi
  text: Nhưng khi đưa ra chỉ dẫn này[a], tôi không khen anh chị em, vì việc anh chị em tụ họp không đem lại điều tốt hơn mà lại đem đến điều tệ hơn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc dịch: “khi ra lệnh về điều này” hoặc “khi dặn bảo điều này.” Động từ Hy Lạp có thể mang nghĩa chỉ dẫn, dặn bảo hoặc ra lệnh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῦτο
  choice: điều này
  rationale: Đại từ chỉ định trung tính hướng đến lời chỉ dẫn Phao-lô sắp trình bày; cách dịch này tự nhiên và không diễn giải quá mức.
- source_word: δὲ
  choice: Nhưng
  rationale: Đánh dấu sự chuyển ý có tính tương phản nhẹ, từ lời bàn trước đó sang lời quở trách.
- source_word: παραγγέλλων
  choice: khi truyền dạy
  rationale: Phân từ của παραγγέλλω có thể chỉ việc dặn bảo, chỉ dẫn hoặc ra lệnh. “Truyền dạy” giữ được thẩm quyền của lời nói mà không làm giọng văn gay gắt quá mức.
- source_word: οὐκ ἐπαινῶ
  choice: tôi không khen anh chị em
  rationale: Diễn đạt trực tiếp nghĩa khen ngợi hoặc tán dương, đồng thời gợi lại sự tương phản với lời khen ở câu 2. Bổ sung đối tượng theo ngữ cảnh tiếng Việt.
- source_word: ὅτι
  choice: vì
  rationale: 'Thể hiện quan hệ nguyên nhân: điều theo sau giải thích tại sao Phao-lô không khen họ.'
- source_word: οὐκ εἰς τὸ κρεῖσσον ἀλλὰ εἰς τὸ ἧσσον
  choice: kết quả không tốt hơn mà còn tệ hơn
  rationale: Cấu trúc εἰς với tính từ so sánh được hiểu tự nhiên là hướng đến hoặc dẫn tới một kết quả. Cách dịch giữ nguyên thế đối lập so sánh giữa “tốt hơn” và “tệ hơn”.
- source_word: συνέρχεσθε
  choice: anh chị em nhóm lại
  rationale: Động từ chỉ việc tụ họp; “nhóm lại” phù hợp với bối cảnh cộng đồng tín hữu cùng hội họp và là tiếng Việt tự nhiên.
theological_decisions:
- issue: Sắc thái thẩm quyền của παραγγέλλων
  choice: truyền dạy
  alternative: ra lệnh; dặn bảo; chỉ dẫn
  rationale: Động từ có thể mang lực mạnh là “ra lệnh”, nhưng tại đây nó dẫn vào lời uốn nắn có thẩm quyền của sứ đồ về buổi nhóm. “Truyền dạy” giữ được thẩm quyền mà không quyết định quá mức sắc thái vốn có thể dao động của từ Hy Lạp.
- issue: Ý nghĩa của εἰς τὸ κρεῖσσον / εἰς τὸ ἧσσον
  choice: kết quả không tốt hơn mà còn tệ hơn
  alternative: không nhằm điều tốt hơn mà nhằm điều tệ hơn
  rationale: Giới từ εἰς có thể gợi mục đích hoặc kết quả. Trong ngữ cảnh quở trách hậu quả thực tế của việc hội họp, bản dịch chính diễn đạt kết quả, nhưng không thêm một hậu quả cụ thể hay cách hiểu giáo phái nào.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” để diễn đạt số nhiều ngôi thứ hai trong cộng đồng tín hữu; “nhóm lại” phù hợp bối cảnh hội họp. Câu giữ giọng quở trách rõ ràng nhưng không cường điệu.
