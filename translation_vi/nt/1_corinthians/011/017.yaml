  rationale: Bản sửa thay “truyền dạy” bằng “đưa ra chỉ dẫn” để phản ánh sát và tự nhiên hơn phân từ παραγγέλλων. Vế cuối được điều chỉnh để bảo toàn thế đối lập của εἰς τὸ κρεῖσσον / εἰς τὸ ἧσσον, tránh thêm từ “còn” và tránh trình bày “kết quả” như một yếu tố minh thị trong nguyên văn. Chú thích được đồng bộ với bản văn sửa.
