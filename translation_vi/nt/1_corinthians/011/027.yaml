source:
  edition: SBLGNT
  text: Ὥστε ὃς ἂν ἐσθίῃ τὸν ⸀ἄρτον ἢ πίνῃ τὸ ποτήριον τοῦ κυρίου ⸀ἀναξίως, ἔνοχος ἔσται τοῦ σώματος καὶ τοῦ αἵματος τοῦ κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/027.yaml
  text: Therefore[b][a], whoever eats the bread or drinks the cup of the Lord in an unworthy manner will be guilty concerning the body and blood of the Lord.
translation:
  language: vi
  text: Vì thế, bất cứ ai ăn bánh hoặc uống chén của Chúa một cách bất xứng[a] thì sẽ có tội về thân thể và huyết của Chúa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Một cách bất xứng” dịch một trạng từ, mô tả cách người ta ăn hoặc uống, chứ không nói về giá trị hay phẩm giá nội tại của người ấy.
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch theo lối truyền thống hơn: “sẽ phạm đến thân thể và huyết của Chúa.” Cấu trúc Hy Lạp nói đến việc có lỗi hoặc phải chịu trách nhiệm liên quan đến thân thể và huyết của Chúa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὥστε
  choice: Vì thế
  rationale: Diễn tả kết luận suy ra từ phần bàn luận ngay trước đó về Tiệc của Chúa, tự nhiên và rõ ràng trong tiếng Việt hiện đại.
- source_word: ὃς ἂν
  choice: bất cứ ai
  rationale: Đại từ quan hệ đi với ἄν mang ý nghĩa bất định, khái quát; “bất cứ ai” giữ được phạm vi mở ấy.
- source_word: ἐσθίῃ τὸν ἄρτον
  choice: ăn bánh
  rationale: Thì hiện tại giả định trong mệnh đề khái quát được chuyển tự nhiên bằng hiện tại tiếng Việt; “bánh” đã xác định nhờ ngữ cảnh, không cần thêm “này” vốn không có trong tiếng Hy Lạp.
- source_word: ἢ
  choice: hoặc
  rationale: Giữ đúng liên từ phân cách của bản Hy Lạp, cho thấy lời cảnh báo áp dụng khi một trong hai hành động được thực hiện cách bất xứng.
- source_word: πίνῃ τὸ ποτήριον
  choice: uống chén
  rationale: 'Giữ phép hoán dụ của nguyên văn: vật chứa chỉ thức uống; đây là cách nói ngắn gọn, trang trọng và quen thuộc trong ngữ cảnh Tiệc của Chúa.'
- source_word: τοῦ κυρίου
  choice: của Chúa
  rationale: Diễn đạt sở hữu hoặc liên hệ; “Chúa” là cách chuyển ngữ tự nhiên của tước hiệu κύριος trong ngữ cảnh chỉ về Chúa Giê-su.
- source_word: ἀναξίως
  choice: một cách bất xứng
  rationale: Đây là trạng từ bổ nghĩa cho cách ăn hoặc uống, chứ không trực tiếp quy định phẩm giá nội tại của người dự phần.
- source_word: ἔνοχος ἔσται
  choice: sẽ mắc tội
  rationale: Diễn tả tình trạng có lỗi và phải chịu trách nhiệm; “mắc tội” giữ được sắc thái nghiêm trọng mà vẫn dễ hiểu.
- source_word: τοῦ σώματος καὶ τοῦ αἵματος τοῦ κυρίου
  choice: đối với thân thể và huyết của Chúa
  rationale: Cấu trúc sở hữu cách đi với ἔνοχος chỉ điều mà người ấy có lỗi hoặc phải chịu trách nhiệm liên quan đến; “đối với” giữ được độ mở của sắc thái pháp lý mà không giải nghĩa quá mức.
theological_decisions:
- issue: Ý nghĩa của ἀναξίως khi dự Tiệc của Chúa
  choice: Lời cảnh báo nhắm đến việc ăn hoặc uống một cách bất xứng.
  alternative: Hiểu câu này là nói người dự phần tự thân không xứng đáng.
  rationale: ἀναξίως là trạng từ bổ nghĩa cho các động từ “ăn” và “uống”; bản dịch không nên biến nó thành tính từ mô tả phẩm giá của người dự phần.
- issue: Lực nghĩa của ἢ giữa hành động ăn và uống
  choice: Dịch là “hoặc”, để lời cảnh báo áp dụng cho một trong hai hành động.
  alternative: Đổi thành “và”, xem hai hành động như một cặp cố định.
  rationale: Nguyên văn dùng liên từ phân cách ἢ; cần giữ cách diễn đạt ấy thay vì điều chỉnh theo truyền thống phụng vụ.
- issue: Sắc thái của sở hữu cách sau ἔνοχος
  choice: “mắc tội đối với thân thể và huyết của Chúa”
  alternative: “phạm đến thân thể và huyết của Chúa” hoặc sát chữ hơn là “mắc tội về thân thể và huyết của Chúa”
  rationale: Cấu trúc Hy Lạp có thể chỉ trách nhiệm hoặc tội lỗi liên quan đến thân thể và huyết của Chúa. “Đối với” tránh xác định quá hẹp bản chất chính xác của trách nhiệm ấy.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Giữ thuật ngữ quen thuộc “chén”, “thân thể và huyết của Chúa”; dùng “một cách bất xứng” để làm rõ chức năng trạng từ và “hoặc” để bảo toàn liên từ của nguyên văn.
