  source_fidelity: 'Bản dịch truyền đạt chính xác các yếu tố chính của nguyên văn: γάρ qua “Vì”; δεῖ qua “phải có” mà không quy định bản chất của tính tất yếu; αἱρέσεις qua “những phe phái” trong nghĩa các nhóm gây phân rẽ; hai lần ἐν ὑμῖν qua “giữa anh chị em”; và ἵνα cùng φανεροὶ γένωνται qua “để ... trở nên rõ ràng.” Cụm “đã được thử nghiệm và công nhận” diễn đạt hợp lý δόκιμοι là những người đã được thử luyện và được xác nhận là đạt chuẩn. Từ “cũng” giữ được καί thứ hai.'
