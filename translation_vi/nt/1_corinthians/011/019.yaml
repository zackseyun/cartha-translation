id: 1CO.11.19
reference: 1 Corinthians 11:19
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: δεῖ γὰρ καὶ αἱρέσεις ἐν ὑμῖν εἶναι, ἵνα ⸀καὶ οἱ δόκιμοι φανεροὶ γένωνται ἐν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/019.yaml
  text: For there must also be factions among you[b][a], so that those who are approved may also become evident among you.
translation:
  language: vi
  text: Vì giữa anh chị em cũng phải có những phe phái[a], để những người đã được thử nghiệm và công nhận[b] cũng trở nên rõ ràng giữa anh chị em.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “sự chia rẽ,” “bè phái” hoặc “giáo phái”; trong cách dùng về sau, từ này có thể mang nghĩa “tà giáo.” Ở đây, nghĩa có khả năng nhất là các phe nhóm trong hội chúng.
    reason: lexical_alternative
  - marker: b
    text: Cụm này cũng có thể dịch là “những người chân thật” hoặc “những người đã đứng vững qua thử thách.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δεῖ
  choice: phải có
  rationale: Giữ nguyên sắc thái tất yếu mạnh của câu Hy Lạp nhưng không xác định đó là sự tất yếu do ý định thần thượng hay do hoàn cảnh.
- source_word: γὰρ
  choice: Vì
  rationale: Duy trì quan hệ giải thích với câu trước.
- source_word: καὶ αἱρέσεις
  choice: cũng ... những phe phái
  rationale: Trong ngữ cảnh bữa ăn của Chúa và sự chia rẽ trong hội chúng, từ này chỉ các nhóm đối nghịch hơn là tà giáo theo nghĩa giáo lý phát triển về sau.
- source_word: ἐν ὑμῖν
  choice: giữa anh chị em
  rationale: Cách nói tự nhiên, trang trọng và mang tính cộng đồng trong tiếng Việt; đồng thời tránh dùng đại từ chỉ một giới.
- source_word: ἵνα
  choice: để
  rationale: Giữ được độ mở giữa sắc thái mục đích và kết quả, không cưỡng ép phân biệt.
- source_word: καὶ οἱ δόκιμοι
  choice: những người đã được thử nghiệm và công nhận ... cũng
  rationale: Diễn đạt ý về những người đã qua thử nghiệm và được nhận là đạt phẩm chất; giữ từ καί thứ hai bằng “cũng”.
- source_word: φανεροὶ γένωνται
  choice: trở nên rõ ràng
  rationale: Bảo tồn sắc thái tiến đến chỗ được nhận biết công khai của γένωνται kết hợp với φανεροί.
- source_word: ἐν ὑμῖν
  choice: giữa anh chị em
  rationale: Lặp lại khung cảnh cộng đồng như nguyên văn và tạo thế đóng khung cho câu.
theological_decisions:
- issue: Cách dịch αἱρέσεις
  choice: phe phái
  alternative: sự chia rẽ; bè phái; giáo phái; tà giáo
  rationale: Ngữ cảnh trực tiếp nói đến những nhóm phân rẽ trong hội chúng. “Phe phái” không đưa nghĩa “tà giáo” thuộc giai đoạn phát triển muộn hơn vào câu.
- issue: Sức nặng của δεῖ
  choice: phải có
  alternative: ắt sẽ có; điều cần thiết là phải có
  rationale: Bảo tồn lời khẳng định về tính tất yếu mà không quyết định liệu đây là sự tất yếu theo ý định quan phòng, một thực tế không tránh khỏi, hay cả hai.
- issue: Quan hệ do ἵνα biểu thị
  choice: để
  alternative: nhờ đó; với kết quả là
  rationale: “Để” giữ được sự căng giữa mục đích và kết quả, thay vì giải thích dứt khoát nguyên nhân thần học của các phe phái.
translation_notes:
  register: 'Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh chị em” cho ἐν ὑμῖν nhằm thể hiện toàn thể cộng đồng. Trật tự hai chú thích được đặt theo vị trí thực tế trong câu: [a] cho αἱρέσεις và [b] cho οἱ δόκιμοι.'
