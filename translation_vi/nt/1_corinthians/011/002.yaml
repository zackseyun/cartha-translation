language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἐπαινῶ δὲ ⸀ὑμᾶς ὅτι πάντα μου μέμνησθε καὶ καθὼς παρέδωκα ὑμῖν τὰς παραδόσεις κατέχετε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/002.yaml
  text: I praise you because you remember me in everything and hold firmly to the traditions just as I delivered them to you[a].
translation:
  language: vi
  text: Tôi khen ngợi anh chị em vì trong mọi điều anh chị em nhớ đến tôi và giữ vững các truyền thống, đúng như tôi đã truyền lại cho anh chị em.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “những lời dạy” hoặc “những chỉ dẫn”; từ Hy Lạp là “các truyền thống”, nghĩa là những điều đã được truyền lại.
    reason: Nêu rõ phạm vi nghĩa của παραδόσεις và bảo toàn khả năng hiểu từ này là điều được truyền lại, không áp đặt sắc thái giáo phái.
lexical_decisions:
- source_word: Ἐπαινῶ
  choice: Tôi khen
  rationale: Diễn đạt trực tiếp ý khen ngợi hoặc biểu dương, với giọng tích cực mở đầu phần này.
- source_word: δὲ
  choice: không dịch thành một từ riêng
  rationale: Ở đây δέ chỉ đánh dấu sự chuyển ý nhẹ. Tiếng Việt không cần thêm “nay” hay “nhưng”, vì như vậy dễ tạo sắc thái thời gian hoặc tương phản không có trong câu Hy Lạp.
- source_word: ὑμᾶς
  choice: anh chị em
  rationale: Đại từ số nhiều chỉ toàn thể cộng đồng; “anh chị em” tự nhiên, trang trọng và thể hiện rõ số nhiều trong văn cảnh hội thánh.
- source_word: ὅτι
  choice: vì
  rationale: Giới thiệu lý do Phao-lô khen người Cô-rinh-tô.
- source_word: πάντα
  choice: trong mọi sự
  rationale: Giữ phạm vi rộng của từ Hy Lạp mà không thu hẹp thành một số công việc cụ thể.
- source_word: μου μέμνησθε
  choice: anh chị em nhớ đến tôi
  rationale: Diễn đạt tự nhiên hành động tiếp tục ghi nhớ Phao-lô; “nhớ đến” phù hợp hơn “nhớ tôi” trong văn phong này.
- source_word: καθὼς
  choice: đúng như
  rationale: Làm rõ sự tương ứng giữa cách Phao-lô đã truyền và cách người đọc đang gìn giữ.
- source_word: παρέδωκα
  choice: tôi đã truyền
  rationale: Trong văn cảnh, động từ nói đến việc trao truyền nội dung có thẩm quyền. “Đã truyền” gọn, tự nhiên và liên kết với ý “được truyền lại”.
- source_word: τὰς παραδόσεις
  choice: những điều được truyền lại
  rationale: Bảo toàn nghĩa căn bản là những gì đã được trao truyền, đồng thời tránh để “truyền thống” trong tiếng Việt bị hiểu đơn thuần là phong tục lâu đời.
- source_word: κατέχετε
  choice: giữ vững
  rationale: Thể hiện sự tiếp tục nắm giữ và trung thành với điều đã nhận, mạnh hơn từ “giữ” đơn thuần.
theological_decisions:
- issue: Cách dịch παραδόσεις trong bối cảnh hội thánh
  choice: những điều được truyền lại
  alternative: các truyền thống; những lời dạy; những chỉ dẫn
  rationale: Cách dịch chính giữ được ý trao truyền của từ Hy Lạp mà không đồng nhất câu này với bất kỳ quan niệm giáo phái nào về “Truyền thống”. Câu chỉ xác nhận rằng người Cô-rinh-tô đang giữ điều chính Phao-lô đã trao truyền.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh chị em” để biểu thị đại từ số nhiều dành cho cộng đồng. Cấu trúc câu bám sát lập luận Hy Lạp nhưng tránh lặp từ nặng nề và tránh thêm một từ chuyển ý mang sắc thái thời gian.
