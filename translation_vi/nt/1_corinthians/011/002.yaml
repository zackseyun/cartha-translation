  source_fidelity: 'Bản nháp truyền đạt đúng cấu trúc và ý chính của câu: Phao-lô khen cộng đoàn vì họ nhớ đến ông trong mọi điều và tiếp tục nắm giữ điều ông đã truyền. Tuy nhiên, “những điều được truyền lại” làm mờ danh từ số nhiều có tính thuật ngữ παραδόσεις (“các truyền thống”), trong khi câu kế đã dùng cùng trường nghĩa của παραδίδωμι. Dùng “các truyền thống” trong bản văn chính, kèm chú thích, giữ được liên hệ từ vựng của nguyên ngữ mà không áp đặt cách hiểu giáo phái.'
  naturalness: “Tôi khen ngợi” tự nhiên và trang trọng hơn “Tôi khen” trong văn phong Kinh Thánh hiện đại. “Trong mọi điều” tự nhiên hơn “trong mọi sự” trong tiếng Việt đương đại mà vẫn giữ phạm vi rộng của πάντα. Câu sửa vẫn rõ ràng, nhịp nhàng và phù hợp với cách xưng hô “anh chị em.”
  terminology: Nên dịch παραδόσεις là “các truyền thống” để phản ánh trực tiếp điều được truyền lại và duy trì liên hệ với “tôi đã truyền lại.” Chú thích nêu các khả năng “những lời dạy,” “những chỉ dẫn,” và giải thích nghĩa đen, nên đủ để ngăn độc giả hiểu từ này như một khẳng định về các hệ thống truyền thống giáo phái về sau.
