revisions:
- from: 'Sau khi tạ ơn, Ngài bẻ bánh và nói: “Đây là thân thể Ta, vì các con[a]. Hãy tiếp tục làm điều này để tưởng nhớ Ta.”[b]'
  to: 'Sau khi tạ ơn, Ngài bẻ bánh và nói: “Đây là thân thể Ta, cho các con[a]. Hãy tiếp tục làm điều này để tưởng nhớ Ta.”[b]'
  rationale: Chỉ sửa cách chuyển ngữ ὑπὲρ ὑμῶν từ "vì các con" thành "cho các con" để tránh cách hiểu nhân quả không chủ ý và phản ánh rõ nghĩa vị lợi của giới từ. Chú thích được điều chỉnh đồng bộ với bản văn và vẫn bảo lưu sắc thái đại diện của phương án "thay cho các con".
