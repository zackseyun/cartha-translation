source:
  edition: SBLGNT
  text: καὶ εὐχαριστήσας ἔκλασεν καὶ ⸀εἶπεν· Τοῦτό μού ἐστιν τὸ σῶμα τὸ ὑπὲρ ⸀ὑμῶν· τοῦτο ποιεῖτε εἰς τὴν ἐμὴν ἀνάμνησιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/024.yaml
  text: And after giving thanks[a], he broke it and said, “This is my body, which is for you[b]. Keep doing this in remembrance of me.”
translation:
  language: vi
  text: 'Sau khi tạ ơn, Ngài bẻ bánh và nói: “Đây là thân thể Ta, cho các con[a]. Hãy tiếp tục làm điều này để tưởng nhớ Ta.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “vì các con” hoặc “thay cho các con.”'
    reason: lexical_alternative
  - marker: b
    text: 'Một số thủ bản thêm từ “bị bẻ ra” sau “cho các con”: “Đây là thân thể Ta, bị bẻ ra cho các con.”'
    reason: textual_variant
lexical_decisions:
- source_word: εὐχαριστήσας
  choice: Sau khi tạ ơn
  rationale: Phân từ bất định quá khứ diễn tả hành động xảy ra trước động từ chính; cách dịch này tự nhiên và giữ rõ trình tự.
- source_word: ἔκλασεν
  choice: Ngài bẻ bánh
  rationale: Động từ có nghĩa là “bẻ”; bổ sung “bánh” từ ngữ cảnh để câu tiếng Việt rõ nghĩa và tự nhiên.
- source_word: Τοῦτό μού ἐστιν τὸ σῶμα
  choice: Đây là thân thể Ta
  rationale: Giữ nguyên cấu trúc hệ từ trực tiếp của tiếng Hy Lạp, không diễn giải thành “tượng trưng cho” hay giải quyết tranh luận thần học về Tiệc Thánh.
- source_word: τὸ ὑπὲρ ὑμῶν
  choice: vì các con
  rationale: Ὑπέρ với sở hữu cách mang nghĩa vì lợi ích hoặc thay mặt cho người khác. “Vì các con” ngắn gọn, tự nhiên và vẫn để ngỏ sắc thái “cho các con” hay “thay cho các con”.
- source_word: τοῦτο ποιεῖτε
  choice: Hãy tiếp tục làm điều này
  rationale: Mệnh lệnh cách hiện tại trong bối cảnh thiết lập nghi thức có sắc thái tiếp diễn hoặc lặp lại; “hãy tiếp tục” làm rõ lực này.
- source_word: εἰς τὴν ἐμὴν ἀνάμνησιν
  choice: để tưởng nhớ Ta
  rationale: Diễn đạt hành động ghi nhớ và tưởng niệm một cách tự nhiên trong tiếng Việt hiện đại.
theological_decisions:
- issue: Ý nghĩa của “Đây là thân thể Ta” trong bối cảnh Tiệc Thánh
  choice: Dịch trực tiếp là “Đây là thân thể Ta” mà không thêm lời giải thích.
  alternative: “Điều này tượng trưng cho thân thể Ta” hoặc cách diễn đạt khẳng định một cơ chế hiện diện bí tích cụ thể.
  rationale: Bản dịch giữ nguyên lời Hy Lạp và không tự ý giải quyết những cách hiểu thần học về sự hiện diện của Đấng Christ.
- issue: Sắc thái của ὑπὲρ ὑμῶν
  choice: “vì các con”
  alternative: “cho các con” hoặc “thay cho các con”
  rationale: Cụm từ chỉ sự hướng đến lợi ích hoặc thay mặt người nhận, nhưng nguyên văn không buộc bản dịch phải chọn riêng một lý thuyết chuộc tội.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “Ngài/Ta/các con” để phân biệt lời tường thuật và lời trực tiếp của Chúa Giê-su. Dấu chú thích [a] đặt ngay sau cụm từ liên quan; [b] đặt cuối câu để ghi nhận dị bản của toàn mệnh đề.
