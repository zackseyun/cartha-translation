    issue: Cụm “vinh quang của người ấy” diễn đạt quan hệ sở hữu thay vì quan hệ quy chiếu/lợi ích trong δόξα αὐτῇ ἐστιν.
    rationale: 'Đại từ αὐτῇ ở cách dative: theo sát hơn, tóc dài “là vinh quang cho người ấy.” Cách sửa không thay đổi ý chính nhưng phản ánh chính xác hơn cú pháp Hy Lạp.'
