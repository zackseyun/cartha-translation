language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: γυνὴ δὲ ἐὰν κομᾷ, δόξα αὐτῇ ἐστιν; ὅτι ἡ κόμη ἀντὶ περιβολαίου ⸀δέδοται.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/015.yaml
  text: But if a woman has long hair[a], it is her glory[b], because her hair has been given to her instead of a covering.
translation:
  language: vi
  text: Nhưng nếu một phụ nữ[a] để tóc dài, thì đó là vinh quang cho người ấy, vì mái tóc đã được ban cho người ấy thay cho vật che phủ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hy Lạp có thể có nghĩa là “phụ nữ” hoặc “vợ”, tùy theo văn cảnh.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể hiểu là “làm vật che phủ”. Giới từ Hy Lạp có thể diễn tả sự tương ứng hoặc sự thay thế; riêng cụm từ này không quyết định dứt khoát rằng mái tóc chính là vật che phủ hay được ban trong mối tương ứng với một vật che phủ.
    reason: lexical_alternative
lexical_decisions:
- source_word: γυνή
  choice: một phụ nữ
  rationale: Từ này có thể chỉ “phụ nữ” hoặc “vợ” tùy văn cảnh. Ở đây, câu được trình bày như một nhận định khái quát, nên “một phụ nữ” phù hợp hơn mà không loại bỏ bối cảnh rộng hơn của phân đoạn.
- source_word: κομᾷ
  choice: để tóc dài
  rationale: Động từ này nói đến việc mang hoặc nuôi tóc dài, chứ không chỉ đơn thuần là có tóc. “Để tóc dài” tự nhiên trong tiếng Việt và diễn đạt rõ sắc thái ấy.
- source_word: δόξα
  choice: vinh quang
  rationale: Từ này chỉ điều đem lại danh dự, vẻ đẹp hoặc sự vẻ vang. “Vinh quang” giữ được sức nặng tu từ và mối liên hệ từ vựng của nguyên văn.
- source_word: κόμη
  choice: mái tóc
  rationale: Danh từ chỉ tóc trên đầu, thường hàm ý tóc được nuôi dài. Vì động từ trước đó đã diễn đạt ý tóc dài, “mái tóc” tránh lặp không cần thiết.
- source_word: ἀντί
  choice: thay cho
  rationale: Giới từ này có thể diễn tả sự thay thế hoặc sự tương ứng. “Thay cho” phản ánh nghĩa thông thường trực tiếp nhất, còn chú thích ghi nhận khả năng hiểu theo nghĩa tương ứng.
- source_word: περιβολαίου
  choice: vật che phủ
  rationale: Danh từ này nói chung về thứ được quấn quanh hoặc dùng để che phủ. “Vật che phủ” không thu hẹp nghĩa thành một loại khăn hay mạng che cụ thể.
- source_word: δέδοται
  choice: đã được ban cho
  rationale: Thể hoàn thành bị động diễn tả một hành động đã xảy ra với kết quả còn hiệu lực. Cách dịch này giữ cả thể bị động lẫn sắc thái trạng thái kết quả.
theological_decisions:
- issue: Mái tóc có được xác định chính là vật che phủ được đòi hỏi trong toàn phân đoạn hay không.
  choice: Dịch περιβόλαιον theo nghĩa rộng là “vật che phủ” và ἀντί là “thay cho”, đồng thời ghi nhận trong chú thích khả năng diễn tả sự tương ứng.
  alternative: Dịch cụ thể là “mạng che” hoặc hiểu câu là “được ban làm vật che phủ”.
  rationale: Nguyên văn không buộc danh từ περιβόλαιον phải chỉ một loại mạng che cụ thể, còn ἀντί có thể diễn tả sự thay thế hoặc tương ứng. Bản dịch vì thế không nên tự giải quyết cuộc tranh luận rộng hơn về quan hệ giữa tóc tự nhiên và vật che đầu.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “người ấy” để tránh lặp “phụ nữ” mà không tạo sắc thái quá thân mật; giữ “vinh quang” nhằm bảo toàn sức nặng tu từ của δόξα.
