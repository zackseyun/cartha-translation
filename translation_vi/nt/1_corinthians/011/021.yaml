revisions:
- from: Vì khi ăn, mỗi người cứ ăn trước bữa riêng của mình[a], thành ra người thì đói, người lại say rượu.[b]
  to: Vì khi ăn, mỗi người cứ dùng bữa ăn riêng của mình trước[a], nên người thì đói, người lại say rượu.[b]
  rationale: Chuyển “trước” xuống sau “bữa ăn riêng của mình” để tiếng Việt diễn đạt đúng hơn việc một người dùng phần ăn riêng của mình trước hoặc không chờ người khác. Chú thích b được điều chỉnh để bảo lưu phương án diễn đạt mà không thêm bị động hoặc thì hoàn thành.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T18:12:11Z'
review_pass:
  verdict: revise
  source_fidelity: Bản dịch truyền đạt đúng mạch giải thích của γάρ, tính phân phối của ἕκαστος, sự đối lập giữa phần ăn riêng và tình trạng đói/say. Tuy nhiên, cụm “ăn trước bữa riêng của mình” trong tiếng Việt có thể bị hiểu là ăn trước khi đến bữa riêng của mình, thay vì dùng bữa riêng trước người khác/không chờ người khác; vì thế chưa diễn đạt rõ quan hệ ngữ nghĩa của προλαμβάνει với τὸ ἴδιον δεῖπνον.
  naturalness: “Vì khi ăn” và cấu trúc “người thì …, người lại …” đều tự nhiên. Đổi vị trí “trước” sau tân ngữ giúp câu rõ ràng và tự nhiên hơn. “Nên” liên kết hợp lý kết quả được nêu trong vế sau mà không thêm chi tiết lịch sử hay giáo lý.
  terminology: “Bữa ăn riêng của mình” phản ánh tốt τὸ ἴδιον δεῖπνον; “say rượu” phản ánh thẳng μεθύει. Không cần đánh dấu giới tính trong tiếng Việt. Chú thích b nên tránh “bị đói” (thêm sắc thái bị động) và “đã say” (thêm sắc thái hoàn thành) không có trong nguyên văn.
  issues:
  - severity: medium
    issue: Trật tự từ trong “cứ ăn trước bữa riêng của mình” mơ hồ.
    rationale: Trong tiếng Việt, “ăn trước bữa…” thường gợi thời điểm trước một bữa ăn. Nguyên văn nói mỗi người tiến hành/dùng phần bữa ăn riêng của mình trước, với hàm ý không chờ người khác.
  - severity: low
    issue: Chú thích b thêm sắc thái không có trong nguyên văn.
    rationale: “Bị đói” có thể gợi bị động, còn “đã say” là sắc thái hoàn thành; πεινᾷ và μεθύει là hiện tại đơn giản.
  revised_text: Vì khi ăn, mỗi người cứ dùng bữa ăn riêng của mình trước[a], nên người thì đói, người lại say rượu.[b]
