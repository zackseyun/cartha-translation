id: 1CO.11.21
reference: 1 Corinthians 11:21
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἕκαστος γὰρ τὸ ἴδιον δεῖπνον προλαμβάνει ἐν τῷ φαγεῖν, καὶ ὃς μὲν πεινᾷ, ὃς δὲ μεθύει.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/021.yaml
  text: For each one goes ahead with his own supper when it is time to eat, and one is hungry while another gets drunk.
translation:
  language: vi
  text: Vì khi ăn, mỗi người cứ dùng bữa ăn riêng của mình trước[a], nên người thì đói, người lại say rượu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “mỗi người lấy bữa ăn riêng của mình trước người khác”; động từ Hy Lạp có thể nhấn mạnh việc lấy hoặc ăn trước, hay cứ tiến hành mà không chờ người khác.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “người thì nhịn đói, người thì say rượu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕκαστος
  choice: mỗi người
  rationale: Giữ sắc thái phân phối từng cá nhân của đại từ số ít, đồng thời tự nhiên trong tiếng Việt.
- source_word: γὰρ
  choice: Vì
  rationale: Nối câu này với lời quở trách ở câu trước như một lời giải thích nguyên nhân.
- source_word: τὸ ἴδιον δεῖπνον
  choice: bữa riêng của mình
  rationale: δεῖπνον là bữa ăn, còn ἴδιον nhấn mạnh đó là phần ăn riêng, đối lập với tính chung của bữa ăn của Chúa; tiếng Việt không cần đánh dấu giới tính ở đại từ phản thân.
- source_word: προλαμβάνει
  choice: cứ ăn trước
  rationale: Trong ngữ cảnh ăn uống, cách dịch này truyền đạt việc dùng phần ăn của mình trước hoặc không chờ người khác, nhưng vẫn để chú thích bảo lưu phạm vi nghĩa của động từ.
- source_word: ἐν τῷ φαγεῖν
  choice: khi ăn
  rationale: Kết cấu giới từ với động từ nguyên mẫu có giá trị thời gian; 'khi ăn' vừa sát nghĩa vừa tự nhiên, không thêm ý 'đến giờ ăn' vốn không được nói rõ.
- source_word: ὃς μὲν ... ὃς δὲ
  choice: người thì ... người lại
  rationale: Diễn đạt tự nhiên thế đối chiếu giữa các thành viên trong cộng đồng.
- source_word: πεινᾷ
  choice: đói
  rationale: Giữ trực tiếp trạng thái hiện tại do cách hành xử bất bình đẳng gây nên.
- source_word: μεθύει
  choice: say rượu
  rationale: Truyền đạt thẳng nghĩa say do uống rượu, không làm nhẹ thành chỉ ăn uống quá độ.
theological_decisions:
- issue: Tính riêng tư đối lập với bữa ăn chung của Chúa
  choice: bữa riêng của mình
  alternative: bữa ăn của mình
  rationale: Giữ lực nhấn mạnh của ἴδιον mà không suy diễn thêm cơ cấu cụ thể của bữa nhóm.
- issue: Bản chất của sự lạm dụng trong bữa ăn của Chúa
  choice: say rượu
  alternative: uống quá chén
  rationale: μεθύει thực sự chỉ tình trạng say; không nên giảm nhẹ lời tố cáo của Phao-lô.
- issue: Giới tính trong cấu trúc phân phối số ít
  choice: mỗi người ... của mình
  alternative: mỗi người ... của người ấy
  rationale: Tiếng Việt không đánh dấu giống trong đại từ phản thân; cách dịch giữ số ít phân phối mà không đưa thêm giới tính không thể hiện tự nhiên trong ngôn ngữ đích.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Cấu trúc “người thì ... người lại ...” giữ thế tương phản mạnh của nguyên văn; “thành ra” làm rõ kết quả hàm chứa trong mạch câu mà không giải quyết thay sự căng thẳng của bản văn.
