source:
  edition: SBLGNT
  text: ⸀οὐδὲ ⸂ἡ φύσις αὐτὴ⸃ διδάσκει ὑμᾶς ὅτι ἀνὴρ μὲν ἐὰν κομᾷ, ἀτιμία αὐτῷ ἐστιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/014.yaml
  text: Does not even nature itself teach you that if a man wears long hair[a], it is a dishonor to him[b],
translation:
  language: vi
  text: Chẳng phải ngay cả tự nhiên[b] cũng dạy anh chị em rằng nếu một người đàn ông để tóc dài[a] thì đó là một sự ô nhục đối với người ấy sao?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “nuôi tóc dài” hoặc “có tóc dài”. Động từ Hy Lạp nói đến việc để hoặc mang tóc dài.'
    reason: lexical_alternative
  - marker: b
    text: “Tự nhiên” có thể chỉ trật tự được tạo dựng, nhận thức chung của con người, hoặc điều một nền văn hóa xem là hợp lẽ tự nhiên; tiếng Hy Lạp ở đây không xác định hẹp hơn.
    reason: alternative_reading
lexical_decisions:
- source_word: οὐδὲ
  choice: Chẳng phải ... cũng ... sao?
  rationale: Diễn đạt tự nhiên câu hỏi tu từ phủ định, đồng thời giữ ý nối tiếp và sắc thái nhấn mạnh của οὐδὲ.
- source_word: ἡ φύσις αὐτὴ
  choice: chính tự nhiên
  rationale: “Chính” bảo toàn sắc thái nhấn mạnh của αὐτή; “tự nhiên” giữ rộng phạm vi nghĩa của φύσις, không thu hẹp thành sinh học hay tập tục.
- source_word: διδάσκει ὑμᾶς
  choice: dạy anh chị em
  rationale: Diễn đạt trực tiếp động từ “dạy”; “anh chị em” là cách xưng hô tự nhiên với cộng đồng tín hữu được nói đến bằng đại từ số nhiều.
- source_word: ἀνὴρ
  choice: một người đàn ông
  rationale: Ngữ cảnh đối chiếu nam và nữ, không buộc phải hiểu là “người chồng”.
- source_word: ἐὰν κομᾷ
  choice: nếu một người đàn ông để tóc dài
  rationale: κομάω chỉ việc để hoặc mang tóc dài; “để tóc dài” vừa tự nhiên trong tiếng Việt vừa không hàm ý đơn thuần là có tóc.
- source_word: ἀτιμία αὐτῷ ἐστιν
  choice: thì đó là điều ô nhục cho người ấy
  rationale: Giữ ý về sự mất danh dự/xấu hổ của ἀτιμία và thể hiện tự nhiên cấu trúc vị ngữ với αὐτῷ.
theological_decisions:
- issue: Ý nghĩa của φύσις trong lập luận của Phao-lô
  choice: Dịch rộng là “chính tự nhiên”, không xác định cụ thể tự nhiên ở đây là trật tự sáng tạo, nhận thức thông thường hay quan niệm văn hóa về điều hợp lẽ tự nhiên.
  alternative: “bản tính tự nhiên”, “trật tự tự nhiên”, hoặc “lẽ tự nhiên” theo một cách hiểu hẹp hơn
  rationale: Từ Hy Lạp và ngữ cảnh không tự chúng phân định dứt khoát giữa các cách hiểu này; bản dịch giữ nguyên độ mở và căng thẳng diễn giải.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng cấu trúc câu hỏi tu từ tự nhiên trong tiếng Việt; giữ “tự nhiên” ở nghĩa rộng và đặt đầy đủ các ký hiệu chú thích trong chính văn.
