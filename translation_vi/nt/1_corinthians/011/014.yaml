  source_fidelity: Bản dịch truyền đạt đúng câu hỏi tu từ phủ định, sự nhấn mạnh của ἡ φύσις αὐτή, mệnh đề điều kiện ἐὰν κομᾷ, và ý “sự ô nhục” của ἀτιμία. Cách hiểu rộng của φύσις được giữ nguyên, không áp đặt một cách giải thích thần học hay văn hóa cụ thể.
  naturalness: Câu hiện tại hiểu được, nhưng “chính tự nhiên cũng” kém tự nhiên hơn “ngay cả tự nhiên cũng” trong cấu trúc câu hỏi tu từ này. “Là một sự ô nhục đối với người ấy” cũng trôi chảy và sát sắc thái danh dự hơn “là điều ô nhục cho người ấy”.
