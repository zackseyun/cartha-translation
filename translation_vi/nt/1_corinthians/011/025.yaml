id: 1CO.11.25
reference: 1 Corinthians 11:25
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὡσαύτως καὶ τὸ ποτήριον μετὰ τὸ δειπνῆσαι, λέγων· Τοῦτο τὸ ποτήριον ἡ καινὴ διαθήκη ἐστὶν ἐν τῷ ἐμῷ αἵματι· τοῦτο ποιεῖτε, ὁσάκις ⸀ἐὰν πίνητε, εἰς τὴν ἐμὴν ἀνάμνησιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/025.yaml
  text: In the same way also[a], after supper, he took the cup, saying, “This cup is the new covenant in my blood. Keep doing this, whenever you drink it[b], in remembrance of me.”
translation:
  language: vi
  text: 'Cũng vậy, sau bữa ăn, Ngài cầm chén và nói: “Chén này là giao ước mới[a] trong huyết Ta. Hãy tiếp tục làm điều này, mỗi khi các con uống chén này[b], để nhớ đến Ta.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “di chúc mới.” Từ Hy Lạp có thể có nghĩa là “giao ước” hoặc “di chúc”; trong bối cảnh này, “giao ước” phù hợp hơn với nền tảng Kinh Thánh.'
    reason: alternative_reading
  - marker: b
    text: 'Hoặc: “mỗi khi các con uống.” Cách nói Hy Lạp chỉ những dịp được lặp lại.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡσαύτως καὶ
  choice: Cũng vậy
  rationale: Diễn đạt tự nhiên sự tương ứng với hành động về bánh ở câu trước, đồng thời thể hiện cả ý ‘tương tự’ và ý nối tiếp.
- source_word: τὸ ποτήριον
  choice: chén
  rationale: ‘Chén’ là cách gọi thông dụng, trang trọng vừa phải trong tiếng Việt Kinh Thánh, không đưa thêm sắc thái nghi lễ như ‘chén thánh’.
- source_word: μετὰ τὸ δειπνῆσαι
  choice: sau bữa ăn
  rationale: Cấu trúc chỉ thời gian, nghĩa sát là ‘sau khi ăn’; ‘sau bữa ăn’ tự nhiên và không buộc bữa đó vào một cách gọi văn hóa cụ thể.
- source_word: λέγων
  choice: Ngài cầm chén và nói
  rationale: Động từ phân từ có nghĩa ‘nói’; hành động ‘cầm chén’ được lược hiểu từ cấu trúc song song với câu trước. Bổ sung này giúp câu tiếng Việt hoàn chỉnh và rõ nghĩa.
- source_word: ἡ καινὴ διαθήκη
  choice: giao ước mới
  rationale: διαθήκη ở đây gợi nền tảng giao ước trong Cựu Ước; ‘giao ước’ phù hợp hơn ‘di chúc’ trong tiếng Việt hiện đại.
- source_word: ἐν τῷ ἐμῷ αἵματι
  choice: trong huyết ta
  rationale: Giữ sát giới từ ἐν và cách nói giao ước–huyết, không diễn giải thành ‘được lập bởi’ hoặc ‘nhờ’.
- source_word: τοῦτο ποιεῖτε
  choice: Hãy tiếp tục làm điều này
  rationale: Thể mệnh lệnh hiện tại cùng mệnh đề kế tiếp cho thấy một thực hành được lặp lại; ‘tiếp tục’ làm rõ sắc thái ấy.
- source_word: ὁσάκις ἐὰν πίνητε
  choice: mỗi khi các con uống
  rationale: 'Diễn đạt những dịp lặp lại, có tính tùy thời: ‘mỗi khi’. Không thêm đại từ ‘chén ấy/nó’ vì tiếng Việt có thể để tân ngữ được hiểu ngầm một cách tự nhiên như tiếng Hy Lạp.'
- source_word: εἰς τὴν ἐμὴν ἀνάμνησιν
  choice: để tưởng nhớ ta
  rationale: Diễn đạt mục đích tưởng niệm bằng tiếng Việt hiện đại, tự nhiên, giữ trọng tâm là hành động nhớ đến Chúa Giê-su.
theological_decisions:
- issue: Nghĩa của διαθήκη trong lời thiết lập về chén
  choice: giao ước
  alternative: di chúc
  rationale: Bối cảnh huyết lập giao ước và nền tảng Kinh Thánh Do Thái ủng hộ ‘giao ước’; ‘di chúc’ dễ gợi một văn kiện phân chia tài sản sau khi chết.
- issue: Quan hệ giữa chén và giao ước
  choice: 'Giữ nguyên lời xác định trực tiếp: ‘Chén này là giao ước mới trong huyết ta’'
  alternative: ‘Chén này tượng trưng cho giao ước mới’ hoặc ‘Chén này là giao ước mới được lập bởi huyết ta’
  rationale: Nguyên văn không giải thích ‘là’ theo nghĩa biểu tượng hay bản thể, cũng không xác định cách hiểu giới từ bằng một diễn giải thần học. Bản dịch giữ nguyên sức căng và sự mơ hồ chân thực của câu.
- issue: Sắc thái tiếp diễn của ποιεῖτε
  choice: Hãy tiếp tục làm điều này
  alternative: Hãy làm điều này
  rationale: Thể mệnh lệnh hiện tại, kết hợp với ‘mỗi khi’, hỗ trợ ý thực hành lặp lại mà không quy định tần suất cụ thể.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng ‘Ngài’ trong lời dẫn và ‘ta/các con’ trong lời trực tiếp để giữ sắc thái tôn kính, gần gũi. Không thêm ‘thánh’ vào ‘chén’ và không giải thích câu theo một lập trường Tiệc Thánh riêng biệt.
