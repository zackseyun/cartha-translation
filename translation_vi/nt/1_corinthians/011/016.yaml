id: 1CO.11.16
reference: 1 Corinthians 11:16
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἰ δέ τις δοκεῖ φιλόνεικος εἶναι, ἡμεῖς τοιαύτην συνήθειαν οὐκ ἔχομεν, οὐδὲ αἱ ἐκκλησίαι τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/016.yaml
  text: But if anyone seems to be contentious[a], we have no such custom[b], nor do the churches of God.
translation:
  language: vi
  text: Nhưng nếu có ai tỏ ra thích tranh cãi[a], thì chúng tôi không có thông lệ như thế[b], các hội thánh của Đức Chúa Trời cũng không.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “ưa gây gổ” hoặc “ưa tranh chấp”.'
    reason: lexical_alternative
  - marker: b
    text: “Thông lệ như thế” có thể chỉ thói thích tranh cãi, hoặc chỉ thực hành đang được bàn đến trong các câu trước.
    reason: alternative_reading
lexical_decisions:
- source_word: δοκεῖ
  choice: tỏ ra
  rationale: Trong kết cấu với động từ nguyên mẫu, từ này có thể diễn đạt điều có vẻ là hoặc biểu hiện ra. “Tỏ ra” tự nhiên trong tiếng Việt và không khẳng định quá mức về động cơ bên trong.
- source_word: φιλόνεικος
  choice: thích tranh cãi
  rationale: Diễn tả khuynh hướng ưa tranh chấp hoặc gây gổ. Cách dịch này rõ nghĩa với độc giả hiện đại mà vẫn giữ sắc thái về một khuynh hướng, không chỉ một hành vi đơn lẻ.
- source_word: τοιαύτην
  choice: như thế
  rationale: Giữ sự quy chiếu ngược nhưng không xác định quá mức đối tượng được nói đến.
- source_word: συνήθειαν
  choice: thông lệ
  rationale: Chỉ một tập quán hay cách làm được cộng đồng thừa nhận. “Thông lệ” tự nhiên và đủ rộng để giữ nguyên sự mơ hồ trong văn cảnh.
- source_word: οὐκ ἔχομεν
  choice: chúng tôi không có
  rationale: Dịch trực tiếp cách diễn đạt Hy Lạp, tránh thêm ý mạnh hơn như “không cho phép” hoặc “không làm theo”.
- source_word: ἐκκλησίαι τοῦ θεοῦ
  choice: các hội thánh của Đức Chúa Trời
  rationale: Giữ cấu trúc sở hữu của nguyên văn và cách gọi trang trọng, quen thuộc trong tiếng Việt Cơ Đốc.
theological_decisions:
- issue: Đối tượng được quy chiếu bởi “không có thông lệ như thế”
  choice: Giữ cách nói khái quát “không có thông lệ như thế”, không xác định thông lệ ấy là gì.
  alternative: Có thể hiểu là không có thói quen tranh cãi, hoặc không có thông lệ liên quan đến thực hành đang được bàn trong các câu trước.
  rationale: Cụm τοιαύτην συνήθειαν ngắn gọn và có đối tượng quy chiếu còn được tranh luận. Bản dịch giữ sự mơ hồ thực sự của nguyên văn thay vì âm thầm quyết định một cách hiểu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “hội thánh” cho ἐκκλησία và “Đức Chúa Trời” cho θεός theo lối diễn đạt Kinh Thánh tiếng Việt quen thuộc; cấu trúc câu vẫn giữ sự đối xứng và sức nặng của lời kết luận trong nguyên văn.
