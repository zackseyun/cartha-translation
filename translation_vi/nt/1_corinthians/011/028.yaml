  source_fidelity: 'Bản dịch chuyển tải chính xác cấu trúc mệnh lệnh: κάθε cá nhân phải tự xét mình, và “theo cách ấy” thì ăn bánh và uống chén. “Mỗi người” diễn đạt ἄνθρωπος theo nghĩa khái quát, không áp đặt giới tính. “Theo cách ấy” giữ được lực chỉ cách thức của οὕτως; không biến câu thành điều kiện loại trừ. Cụm “ăn bánh và uống chén” bảo toàn phép hoán dụ của ποτήριον và phù hợp với lối nói Kinh Thánh tiếng Việt.'
