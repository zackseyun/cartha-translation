id: 1CO.11.28
reference: 1 Corinthians 11:28
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: δοκιμαζέτω δὲ ἄνθρωπος ἑαυτόν, καὶ οὕτως ἐκ τοῦ ἄρτου ἐσθιέτω καὶ ἐκ τοῦ ποτηρίου πινέτω·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/028.yaml
  text: But let a man examine himself, and in this way let him eat from the bread and drink from the cup.
translation:
  language: vi
  text: Nhưng mỗi người hãy tự xét mình, rồi theo cách ấy hãy ăn bánh và uống chén.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δοκιμαζέτω
  choice: hãy tự xét
  rationale: Động từ mang nghĩa xem xét, thử nghiệm để nhận định; “tự xét mình” diễn đạt tự nhiên hành động hướng vào chính mình mà không thêm ý kết án.
- source_word: ἄνθρωπος
  choice: mỗi người
  rationale: Ở đây danh từ chỉ con người nói chung, không nhất thiết giới hạn ở nam giới; “mỗi người” phù hợp với đại từ phản thân và lời kêu gọi áp dụng cho từng cá nhân.
- source_word: οὕτως
  choice: theo cách ấy
  rationale: Giữ nghĩa chỉ cách thức của trạng từ, tránh thu hẹp thành một trình tự thời gian đơn thuần.
- source_word: ἐκ τοῦ ἄρτου … ἐκ τοῦ ποτηρίου
  choice: ăn bánh và uống chén
  rationale: Đây là cách diễn đạt tự nhiên trong tiếng Việt; “uống chén” giữ phép hoán dụ của nguyên văn, tức uống phần chứa trong chén.
theological_decisions:
- issue: Mối liên hệ giữa việc tự xét mình và việc dự phần
  choice: rồi theo cách ấy hãy ăn bánh và uống chén
  alternative: rồi mới được ăn bánh và uống chén
  rationale: Nguyên văn truyền lệnh tự xét và sau đó dự phần theo cách ấy; không nói rõ đây là điều kiện để được phép dự phần, nên bản dịch tránh thêm sắc thái cấm đoán.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ các mệnh lệnh ở ngôi khuyến cáo rõ ràng; dùng “mỗi người” theo nghĩa bao quát của ἄνθρωπος.
