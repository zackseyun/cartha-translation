id: 1CO.11.32
reference: 1 Corinthians 11:32
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: κρινόμενοι δὲ ⸀ὑπὸ κυρίου παιδευόμεθα, ἵνα μὴ σὺν τῷ κόσμῳ κατακριθῶμεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/032.yaml
  text: But when we are judged by the Lord[a], we are disciplined, so that we may not be condemned along with the world.
translation:
  language: vi
  text: Nhưng khi bị Chúa xét đoán,[a] chúng ta được sửa dạy, để không bị kết án cùng với thế gian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Nhưng đang khi bị Chúa xét đoán, chúng ta đang được sửa dạy.” Các dạng hiện tại trong tiếng Hy Lạp có thể nhấn mạnh hành động đang tiếp diễn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κρινόμενοι
  choice: khi bị ... xét đoán
  rationale: Phân từ hiện tại bị động được hiểu theo nghĩa thời gian trong ngữ cảnh. “Xét đoán” giữ sắc thái tư pháp nhưng chưa đồng nhất với sự kết án ở cuối câu.
- source_word: δὲ
  choice: Nhưng
  rationale: Biểu thị sự tương phản nhẹ với lời cảnh báo ở câu trước; “nhưng” thể hiện rõ mối liên hệ này trong tiếng Việt.
- source_word: ὑπὸ κυρίου
  choice: bị Chúa
  rationale: ὑπό với sở hữu cách chỉ tác nhân. “Chúa” tự nhiên, trang trọng và không thêm tên riêng mà nguyên văn không có.
- source_word: παιδευόμεθα
  choice: chúng ta được sửa dạy
  rationale: Diễn tả sự uốn nắn mang tính giáo dục và sửa trị. “Được sửa dạy” nhấn mạnh mục đích phục hồi hơn là chỉ trừng phạt.
- source_word: ἵνα μὴ
  choice: để không
  rationale: Giữ lực chỉ mục đích hoặc kết quả của mệnh đề Hy Lạp bằng cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: σὺν τῷ κόσμῳ
  choice: cùng với thế gian
  rationale: Giữ ý cùng chung số phận; “thế gian” ở đây chỉ thế giới tập thể đối diện với sự kết án.
- source_word: κατακριθῶμεν
  choice: bị kết án
  rationale: Giữ sắc thái phán quyết bất lợi mạnh hơn κρινόμενοι, qua đó duy trì sự phân biệt giữa việc được Chúa xét đoán để sửa dạy và sự kết án.
theological_decisions:
- issue: Mối quan hệ giữa sự xét đoán hiện tại của Chúa và sự kết án sau cùng
  choice: Bản dịch phân biệt sự xét đoán có tính sửa dạy của Chúa đối với “chúng ta” với việc bị kết án cùng thế gian.
  alternative: Có thể hiểu rộng hơn là hình phạt trong đời này, không nhất thiết hàm ý sự phân biệt giữa người tin và người không tin.
  rationale: Sự tương phản từ vựng giữa κρινόμενοι và κατακριθῶμεν, cùng với παιδευόμεθα và mệnh đề mục đích ἵνα μὴ, cho thấy việc sửa dạy hiện tại nhằm tránh sự kết án. Bản dịch không mở rộng thành một hệ thống giáo lý về sự bền đỗ hay hiệu lực bí tích.
translation_notes:
  register: Tiếng Việt phổ thông hiện đại, trang trọng nhưng dễ hiểu. Dùng “xét đoán” và “kết án” để giữ sự phân biệt chủ ý giữa κρίνω và κατακρίνω; dấu chú thích [a] được đặt ngay sau cụm từ liên quan.
