id: 1CO.11.22
reference: 1 Corinthians 11:22
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: μὴ γὰρ οἰκίας οὐκ ἔχετε εἰς τὸ ἐσθίειν καὶ πίνειν; ἢ τῆς ἐκκλησίας τοῦ θεοῦ καταφρονεῖτε, καὶ καταισχύνετε τοὺς μὴ ἔχοντας; τί ⸂εἴπω ὑμῖν⸃; ἐπαινέσω ὑμᾶς; ἐν τούτῳ οὐκ ἐπαινῶ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/022.yaml
  text: For do you not have houses for eating and drinking? Or do you despise the church of God and shame those who have nothing? What should I say to you? Should I praise you? In this I do not praise you[a].
translation:
  language: vi
  text: Vì anh chị em chẳng có nhà để ăn uống sao? Hay anh chị em khinh thường Hội Thánh của Đức Chúa Trời và làm nhục những người không có gì[a]? Tôi phải nói gì với anh chị em đây? Tôi có nên khen anh chị em không? Về việc này, tôi không khen anh chị em.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “người nghèo” hoặc “những người không có thức ăn”; nguyên văn Hy Lạp dịch sát là “những người không có.”'
    reason: Nêu các khả năng từ vựng theo ngữ cảnh mà không thu hẹp cách nói rộng của nguyên văn trong chính văn.
lexical_decisions:
- source_word: οἰκίας
  choice: nhà
  rationale: Chỉ không gian gia đình riêng, đối lập với cộng đồng đang nhóm họp; “nhà” tự nhiên và sát nghĩa trong tiếng Việt.
- source_word: εἰς τὸ ἐσθίειν καὶ πίνειν
  choice: để ăn uống
  rationale: Diễn đạt tự nhiên ý nghĩa mục đích của giới từ đi với động từ nguyên mẫu có mạo từ.
- source_word: ἐκκλησίας τοῦ θεοῦ
  choice: Hội Thánh của Đức Chúa Trời
  rationale: Diễn đạt cách dùng quen thuộc của Phao-lô về cộng đồng thuộc về Đức Chúa Trời, không nhấn quá mức khía cạnh cơ chế.
- source_word: καταφρονεῖτε
  choice: khinh thường
  rationale: Giữ được sắc thái xem nhẹ và tính gay gắt về đạo đức trong lời quở trách.
- source_word: καταισχύνετε
  choice: làm nhục
  rationale: Diễn tả trực tiếp hành động khiến người khác phải hổ thẹn; mạnh và tự nhiên trong ngữ cảnh.
- source_word: τοὺς μὴ ἔχοντας
  choice: những người không có gì
  rationale: Giữ cách nói rộng và lược của Hy Lạp, không tự ý thu hẹp thành “người nghèo” hoặc “người không có thức ăn”.
- source_word: τί εἴπω ὑμῖν;
  choice: Tôi phải nói gì với anh chị em đây?
  rationale: Truyền đạt câu hỏi cân nhắc mang tính tu từ bằng tiếng Việt hiện đại; “đây” thể hiện sự bối rối và quở trách mà không thêm nội dung.
- source_word: ἐπαινέσω ὑμᾶς;
  choice: Tôi có nên khen anh chị em không?
  rationale: Giữ câu hỏi tu từ và đáp án phủ định được ngầm chờ đợi.
- source_word: ἐν τούτῳ
  choice: Về việc này
  rationale: Chỉ rõ tự nhiên rằng đại từ quy chiếu đến vấn đề vừa được nêu, không giải thích quá mức.
- source_word: οὐκ ἐπαινῶ
  choice: tôi không khen anh chị em
  rationale: Lặp lại “khen” để phản ánh sự lặp từ ἐπαινέσω/ἐπαινῶ trong nguyên văn.
theological_decisions:
- issue: Đối tượng của cụm “những người không có gì” trong bối cảnh Tiệc Thánh
  choice: Giữ cách diễn đạt khái quát “những người không có gì” trong chính văn.
  alternative: “người nghèo” hoặc “những người không có thức ăn”
  rationale: Ngữ cảnh cho thấy đây rất có thể là các tín hữu thiếu thốn vật chất, nhưng nguyên văn chỉ nói theo nghĩa rộng là “những người không có”; chính văn giữ độ mở ấy và chú thích nêu các khả năng theo ngữ cảnh.
translation_notes:
  register: Văn phong hiện đại, trang trọng và trực tiếp. Dùng “anh chị em” cho đại từ số nhiều nhằm biểu đạt cộng đồng tín hữu một cách tự nhiên; viết hoa “Hội Thánh” theo quy ước Kinh Thánh tiếng Việt. Chuỗi câu hỏi được giữ lại để bảo toàn nhịp điệu và sức nặng lời quở trách của Phao-lô.
