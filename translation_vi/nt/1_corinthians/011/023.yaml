id: 1CO.11.23
reference: 1 Corinthians 11:23
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἐγὼ γὰρ παρέλαβον ἀπὸ τοῦ κυρίου, ὃ καὶ παρέδωκα ὑμῖν, ὅτι ὁ κύριος Ἰησοῦς ἐν τῇ νυκτὶ ᾗ ⸀παρεδίδετο ἔλαβεν ἄρτον
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/023.yaml
  text: 'For I received from the Lord what I also delivered to you: that the Lord Jesus[a], on the night when he was being handed over, took bread'
translation:
  language: vi
  text: 'Vì điều tôi đã nhận từ Chúa, tôi cũng truyền lại cho anh chị em, ấy là: Chúa Giê-su, trong đêm Ngài bị trao nộp[a], đã cầm lấy bánh.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc theo cách dịch truyền thống: “Ngài bị phản bội”.'
    reason: Nêu nghĩa theo ngữ cảnh có thể có của παρεδίδετο mà không thu hẹp nghĩa trong chính văn.
lexical_decisions:
- source_word: παρέλαβον
  choice: đã nhận
  rationale: Diễn tả việc Phao-lô tiếp nhận truyền thống hoặc lời dạy, đồng thời giữ mối tương ứng với παρέδωκα.
- source_word: ἀπὸ τοῦ κυρίου
  choice: từ Chúa
  rationale: Giữ nguyên ý chỉ nguồn và không tự ý mở rộng thành “từ Chúa Giê-su”; mệnh đề sau xác định danh xưng này.
- source_word: παρέδωκα
  choice: truyền lại
  rationale: Là cách nói tự nhiên trong tiếng Việt về việc chuyển giao truyền thống đã tiếp nhận, đồng thời tránh lặp “trao nộp” dùng cho παρεδίδετο.
- source_word: ὅτι
  choice: ấy là
  rationale: Giới thiệu rõ nội dung điều Phao-lô đã truyền lại; tự nhiên hơn cấu trúc dùng “rằng” sau mệnh đề mở đầu này.
- source_word: κύριος
  choice: Chúa
  rationale: Giữ sắc thái tôn kính và ý nghĩa Cơ Đốc học quen thuộc của κύριος.
- source_word: ἐν τῇ νυκτὶ ᾗ
  choice: trong đêm
  rationale: Cách diễn đạt gọn, tự nhiên, vẫn giữ quan hệ thời gian với hành động bị trao nộp.
- source_word: παρεδίδετο
  choice: bị trao nộp
  rationale: 'Giữ nghĩa rộng của thể bị động chưa hoàn thành: bị giao, trao nộp hoặc phản bội; không thu hẹp tác nhân chỉ còn Giu-đa.'
- source_word: ἔλαβεν ἄρτον
  choice: đã cầm lấy bánh
  rationale: “Cầm lấy bánh” diễn đạt tự nhiên hành động chủ ý trong trình thuật thiết lập, không buộc danh từ không có mạo từ phải thành “một ổ bánh”.
theological_decisions:
- issue: Cách dịch παρεδίδετο trong trình thuật thiết lập Tiệc Thánh
  choice: bị trao nộp
  alternative: bị phản bội
  rationale: Động từ có thể chỉ việc trao nộp, giao vào tay người khác, hoặc phản bội. Bản chính giữ độ rộng và thế căng thần học của nguyên văn; cách hiểu truyền thống “bị phản bội” được nêu trong chú thích.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” cho ὑμῖν nhằm diễn đạt cộng đồng gồm cả nam lẫn nữ; viết hoa đại từ “Ngài” theo lối tôn kính thông dụng. Nhịp câu giữ sắc thái truyền trao trang trọng của lời Phao-lô.
