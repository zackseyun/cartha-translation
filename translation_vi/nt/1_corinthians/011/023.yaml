  terminology: “Chúa,” “Chúa Giê-su,” “anh chị em,” và “trao nộp” nhất quán với sắc thái tôn kính và với thuật ngữ của bản văn. Chú thích cung cấp cách dịch truyền thống mà không thay thế nghĩa rộng hơn của chính văn.
