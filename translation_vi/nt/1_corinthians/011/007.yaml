id: 1CO.11.7
reference: 1 Corinthians 11:7
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀνὴρ μὲν γὰρ οὐκ ὀφείλει κατακαλύπτεσθαι τὴν κεφαλήν, εἰκὼν καὶ δόξα θεοῦ ὑπάρχων· ⸀ἡ γυνὴ δὲ δόξα ἀνδρός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/007.yaml
  text: For a man ought not to cover his head[a], since he is the image and glory of God[b]; but the woman is the glory of man.
translation:
  language: vi
  text: Quả vậy, người nam[a] không nên che đầu[b], vì người ấy là hình ảnh và vinh quang của Đức Chúa Trời; còn người nữ là vinh quang của người nam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Các từ Hy Lạp được dịch là “người nam” và “người nữ” trong suốt câu này cũng có thể có nghĩa là “chồng” và “vợ”, tùy văn cảnh.
    reason: alternative_reading
  - marker: b
    text: Hoặc “trùm khăn che đầu”; nguyên văn nói khái quát là “che đầu”, không xác định loại vật che.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνὴρ
  choice: người nam
  rationale: Trong mạch lập luận về nam và nữ khi thờ phượng, từ này được hiểu theo nghĩa đại diện chung là “người nam”; nghĩa “chồng” vẫn có thể có tùy cách hiểu văn cảnh.
- source_word: ὀφείλει
  choice: nên
  rationale: Diễn đạt nghĩa vụ chuẩn mực một cách tự nhiên trong tiếng Việt mà không làm sắc thái mạnh hơn nguyên văn.
- source_word: κατακαλύπτεσθαι τὴν κεφαλήν
  choice: che đầu mình
  rationale: Giữ cách nói khái quát của tiếng Hy Lạp, không thu hẹp thành một kiểu khăn hoặc mạng che cụ thể.
- source_word: εἰκὼν
  choice: hình ảnh
  rationale: Cách dịch quen thuộc, giữ được tiếng vọng của ngôn ngữ sáng tạo trong Sáng Thế Ký.
- source_word: δόξα
  choice: vinh quang
  rationale: Giữ cùng một từ ở cả hai lần xuất hiện, bảo toàn sức nặng thần học và quan hệ của câu.
- source_word: ὑπάρχων
  choice: bởi người là
  rationale: Diễn đạt tự nhiên giá trị nêu nguyên do của phân từ trong văn cảnh.
- source_word: ἡ γυνὴ
  choice: người nữ
  rationale: Giữ thế đối lập đại diện giữa nam và nữ; nghĩa “vợ” vẫn khả hữu về mặt từ vựng.
- source_word: ἀνδρός
  choice: của người nam
  rationale: Phù hợp với nghĩa đại diện chung đã chọn cho ἀνήρ và không tự ý giới hạn quan hệ vào hôn nhân.
theological_decisions:
- issue: Nên hiểu ἀνήρ/γυνή là người nam/người nữ hay chồng/vợ
  choice: người nam/người nữ
  alternative: chồng/vợ
  rationale: Văn cảnh trực tiếp đặt nam và nữ trong lập luận về việc che đầu và trật tự sáng tạo, nên cách dịch chung bảo toàn phạm vi đại diện; chú thích ghi nhận cách hiểu theo quan hệ hôn nhân.
- issue: Cách chuyển lời khẳng định bất đối xứng về δόξα
  choice: giữ nguyên “người nữ là vinh quang của người nam”
  alternative: “người nữ phản chiếu vinh quang của người nam” hoặc “người nữ là niềm vinh dự của người nam”
  rationale: Nguyên văn dùng trực tiếp động từ “là” và danh từ “vinh quang”; không nên làm nhẹ hoặc giải nghĩa thay cho bản văn.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Trời” cho θεός, “người nam/người nữ” để giữ nét phân biệt giới tính rõ ràng, và giữ nguyên sự căng thẳng thần học của mệnh đề cuối.
