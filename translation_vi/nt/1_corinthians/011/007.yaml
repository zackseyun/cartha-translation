    rationale: Phân từ ὑπάρχων nêu cơ sở cho mệnh đề trước. “Vì người ấy là” truyền đạt quan hệ này trong tiếng Việt tự nhiên hơn.
  - severity: low
    issue: Một chú thích đang gộp hai vấn đề từ vựng khác nhau và chỉ neo tại “che đầu”.
    rationale: Khả năng dịch ἀνήρ/γυνή là “chồng/vợ” nên được neo tại “người nam” (và nêu rõ áp dụng xuyên suốt câu); lựa chọn “che đầu/trùm khăn che đầu” nên neo trực tiếp tại cụm “che đầu”.
