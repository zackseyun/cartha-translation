source:
  edition: SBLGNT
  text: συνερχομένων οὖν ὑμῶν ἐπὶ τὸ αὐτὸ οὐκ ἔστιν κυριακὸν δεῖπνον φαγεῖν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/020.yaml
  text: Therefore[a], when you come together in the same place, it is not to eat the Lord’s supper,
translation:
  language: vi
  text: Vậy, khi anh chị em nhóm lại tại cùng một nơi, thì không phải là anh chị em ăn bữa ăn của Chúa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “anh chị em không ăn bữa ăn của Chúa,” nhấn mạnh rằng cách cư xử của họ khiến bữa ăn ấy không còn đúng là bữa ăn của Chúa.'
    reason: alternative_reading
lexical_decisions:
- source_word: συνερχομένων
  choice: khi anh chị em nhóm lại
  rationale: Phân từ sở hữu cách cùng với ὑμῶν tạo thành mệnh đề chỉ thời gian. “Nhóm lại” diễn đạt tự nhiên việc cộng đồng tín hữu quy tụ.
- source_word: οὖν
  choice: Vậy
  rationale: Từ này nêu kết luận rút ra từ lời quở trách trước đó về sự chia rẽ; “Vậy” giữ được quan hệ suy luận mà vẫn tự nhiên trong tiếng Việt.
- source_word: ἐπὶ τὸ αὐτό
  choice: cùng một nơi
  rationale: Thành ngữ này chỉ việc quy tụ tại cùng một địa điểm hay trong cùng một cuộc nhóm họp; cách dịch giữ sắc thái không gian và tránh chỉ lặp lại ý “nhóm lại”.
- source_word: οὐκ ἔστιν ... φαγεῖν
  choice: thì đó không phải là ăn
  rationale: 'Cấu trúc Hy Lạp cô đọng và có thể hiểu theo sắc thái đánh giá: việc họ làm không thực sự kể là ăn bữa ăn của Chúa. Cách dịch này giữ cấu trúc phủ định với động từ nguyên mẫu mà không biến nó thành một sự bất khả tuyệt đối.'
- source_word: κυριακὸν
  choice: của Chúa
  rationale: Tính từ này có nghĩa là thuộc về Chúa; cấu trúc sở hữu là cách diễn đạt rõ ràng và tự nhiên trong tiếng Việt.
- source_word: δεῖπνον
  choice: bữa ăn
  rationale: Danh từ chỉ bữa ăn chính, thường là bữa chiều hoặc tối. Trong văn cảnh này, “bữa ăn” rõ nghĩa và không gắn cách gọi với một giờ ăn cụ thể của văn hóa hiện đại.
- source_word: κυριακὸν δεῖπνον
  choice: bữa ăn của Chúa
  rationale: Cách dịch sát nghĩa cụm tính từ–danh từ, dễ hiểu với độc giả hiện đại và không đưa thuật ngữ giáo phái vào bản văn.
theological_decisions:
- issue: Phao-lô phủ nhận khả năng ăn bữa ấy hay phủ nhận rằng cách thực hành của họ xứng đáng được gọi là bữa ăn của Chúa
  choice: Cách họ nhóm họp và cư xử khiến điều họ làm không thực sự là ăn bữa ăn của Chúa.
  alternative: Anh chị em không ăn bữa ăn của Chúa.
  rationale: Văn cảnh ngay sau đó cho thấy Phao-lô quở trách cách họ dùng bữa trong chia rẽ, chứ không khẳng định một sự bất khả mang tính tuyệt đối. Bản dịch chính giữ lối nói cô đọng và sắc thái đánh giá của câu Hy Lạp; chú thích bảo tồn cách hiểu trực tiếp hơn.
translation_notes:
  register: Dùng tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. “Anh chị em” truyền đạt số nhiều ὑμῶν theo lối xưng hô cộng đồng và bao quát giới tính. Không dùng thuật ngữ giáo hội mang sắc thái hệ phái như “Tiệc Thánh”.
