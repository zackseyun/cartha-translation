source:
  edition: SBLGNT
  text: καὶ γὰρ οὐκ ἐκτίσθη ἀνὴρ διὰ τὴν γυναῖκα, ἀλλὰ γυνὴ διὰ τὸν ἄνδρα.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/009.yaml
  text: For indeed[a], man was not created for the woman, but woman for the man.
translation:
  language: vi
  text: Vì thật vậy, người nam không được dựng nên vì người nữ, nhưng người nữ vì người nam.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “do người nữ / do người nam” hoặc “cho người nữ / cho người nam.” Giới từ Hy Lạp có thể chỉ nguyên nhân hoặc mục đích; ở đây “vì” giữ được cả hai khả năng trong lập luận dựa trên sự sáng tạo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: Thật vậy
  rationale: Cụm từ nối mang sắc thái giải thích và nhấn mạnh cho lập luận trước; “Thật vậy” tự nhiên trong tiếng Việt và giữ được sức nhấn, dù quan hệ giải thích phần nào được hàm trong văn mạch.
- source_word: ἐκτίσθη
  choice: được dựng nên
  rationale: Thể bị động aorist của κτίζω chỉ hành động tạo dựng. “Được dựng nên” trang trọng, dễ hiểu và phù hợp với lời quy chiếu đến trình thuật sáng tạo.
- source_word: ἀνὴρ / γυνὴ
  choice: người nam / người nữ
  rationale: Trong lời quy chiếu đến sáng tạo, hai danh từ mang nghĩa giới tính rộng hơn là riêng quan hệ hôn nhân; cách dịch này tránh thu hẹp thành “chồng/vợ”.
- source_word: διὰ τὴν γυναῖκα / διὰ τὸν ἄνδρα
  choice: vì người nữ / vì người nam
  rationale: διά với đối cách có thể chỉ nguyên nhân, mục đích hoặc điều hướng đến lợi ích. “Vì” giữ được độ mở của tiếng Hy Lạp tốt hơn các cách diễn đạt xác định hẳn là nguyên nhân hay mục đích.
- source_word: ἀλλὰ
  choice: nhưng
  rationale: Diễn đạt trực tiếp thế tương phản cân xứng giữa hai mệnh đề.
theological_decisions:
- issue: Nên hiểu ἀνήρ/γυνή là người nam/người nữ hay chồng/vợ
  choice: người nam/người nữ
  alternative: chồng/vợ
  rationale: Động từ “được dựng nên” đặt câu trong bối cảnh sáng tạo của Sáng Thế Ký, nên nghĩa rộng về người nam và người nữ thích hợp hơn; cách dịch không giới hạn lời này chỉ trong hôn nhân.
- issue: διά với đối cách diễn tả nguyên nhân hay mục đích
  choice: giữ cách diễn đạt rộng bằng “vì”
  alternative: “do/bởi người…” hoặc “cho người…”
  rationale: Nguyên văn cho phép sắc thái nguyên nhân hoặc mục đích/lợi ích. Dịch “vì” bảo tồn sự căng nghĩa ấy thay vì quyết định dứt khoát theo một hướng.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Cấu trúc đối xứng được giữ nguyên để bảo toàn sức lập luận; “người nam/người nữ” rõ nghĩa hơn “đàn ông/đàn bà” trong văn mạch thần học và không thu hẹp thành quan hệ vợ chồng.
