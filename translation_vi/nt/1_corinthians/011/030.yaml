- from: Vì lý do đó, trong anh em có nhiều người yếu đuối và đau ốm, và khá nhiều người đã an nghỉ.[a]
  to: Vì thế, giữa anh em có nhiều người yếu và đau ốm, và cũng có khá nhiều người đã ngủ.[a]
  rationale: Chỉnh “trong” thành “giữa” để phản ánh phạm vi cộng đồng của ἐν ὑμῖν. Đổi “yếu đuối” thành “yếu” để câu gọn và hạn chế sắc thái yếu đuối về đạo đức; giữ đối ứng với “đau ốm”. Đổi “đã an nghỉ” thành “đã ngủ” để bảo tồn hình ảnh của κοιμῶνται, còn nghĩa chỉ sự chết được làm rõ trong chú thích. Các lượng từ và quan hệ nhân quả được giữ nguyên ý.
