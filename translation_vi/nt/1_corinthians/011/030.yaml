  yaml_path: translation/nt/1_corinthians/011/030.yaml
  text: For this reason many among you are weak and sick[a], and a good number have fallen asleep.
translation:
  language: vi
  text: Vì thế, giữa anh em có nhiều người yếu và đau ốm, và cũng có khá nhiều người đã ngủ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay nói rõ hơn: “đã chết.” Phao-lô có lẽ dùng “đã ngủ” như một ẩn dụ quen thuộc của các tín hữu thời ấy về cái chết.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Vì lý do đó
  rationale: Giữ rõ quan hệ nguyên nhân với việc lạm dụng Bữa Ăn của Chúa đã nói ở phần trước; tự nhiên hơn cách dịch thuần suy luận như “vì vậy”.
- source_word: ἐν ὑμῖν
  choice: trong anh em
  rationale: Chỉ tình trạng hiện diện giữa vòng cộng đồng Cô-rinh-tô, không phải trạng thái ở bên trong từng cá nhân.
- source_word: πολλοὶ
  choice: nhiều người
  rationale: Diễn đạt trực tiếp tính từ chỉ số lượng được dùng như danh từ.
- source_word: ἀσθενεῖς
  choice: yếu đuối
  rationale: Giữ nghĩa suy yếu về thể chất và phân biệt với từ mạnh hơn chỉ bệnh tật ngay sau đó.
- source_word: ἄρρωστοι
  choice: đau ốm
  rationale: Diễn đạt tình trạng bệnh tật bằng ngôn ngữ hiện đại, dễ hiểu, đồng thời duy trì sự phân biệt với “yếu đuối”.
- source_word: κοιμῶνται
  choice: đã an nghỉ
  rationale: Trong mạch văn, đây là cách nói ẩn dụ về cái chết. “Đã an nghỉ” giữ sắc thái uyển ngữ trang trọng và tự nhiên trong tiếng Việt, thay vì giải nghĩa thẳng trong chính văn.
- source_word: ἱκανοί
  choice: khá nhiều người
  rationale: Chuyển tải ý một số lượng đáng kể, đồng thời tránh lặp máy móc từ “nhiều” ở đầu câu.
theological_decisions:
- issue: κοιμῶνται nên được hiểu theo nghĩa ngủ hay là ẩn dụ về cái chết
  choice: Giữ ẩn dụ chỉ cái chết bằng “đã an nghỉ” trong chính văn
  alternative: “đã chết” hoặc “đang ngủ” theo nghĩa đen
  rationale: Chuỗi tăng tiến yếu đuối—đau ốm—an nghỉ trong bối cảnh sự phán xét cho thấy từ này chỉ cái chết. Giữ cách nói ẩn dụ bảo tồn giọng điệu và sức căng thần học của nguyên văn mà không diễn giải quá mức.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Cách xưng gọi “anh em” phù hợp với lời nói hướng đến cộng đồng và không làm cho câu quá nặng; “an nghỉ” bảo tồn uyển ngữ của nguyên văn.
