  yaml_path: translation/nt/1_corinthians/011/031.yaml
  text: But if we judged ourselves[a], we would not be judged.
translation:
  language: vi
  text: Nhưng nếu chúng ta tự xét mình[a], thì chúng ta đã không bị phán xét.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “tự kiểm tra mình” hoặc “tự phân định mình”. Động từ Hy Lạp có thể mang nghĩa đánh giá hoặc phân biệt; ở đây dùng “tự xét” để giữ mối liên hệ với “bị phán xét” trong mệnh đề kế tiếp.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ
  choice: Nhưng nếu
  rationale: εἰ mở đầu mệnh đề điều kiện, còn δέ biểu thị sự tương phản nhẹ với ý trước; “Nhưng nếu” chuyển tải tự nhiên cả hai sắc thái.
- source_word: ἑαυτοὺς
  choice: mình
  rationale: Đại từ phản thân số nhiều làm tân ngữ; trong cụm “chúng ta tự xét mình”, “mình” là cách diễn đạt tự nhiên trong tiếng Việt hiện đại.
- source_word: διεκρίνομεν
  choice: tự xét
  rationale: διακρίνω ở đây chỉ việc phân định và đánh giá chính mình. “Tự xét” phù hợp ngữ cảnh Bữa Ăn của Chúa, đồng thời duy trì mối liên hệ ý nghĩa với “bị xét xử” ở mệnh đề sau.
- source_word: οὐκ ἂν
  choice: đã không
  rationale: Kết hợp với thì chưa hoàn thành trong mệnh đề kết quả của điều kiện trái với thực tế; cấu trúc “thì ... đã không” diễn đạt tự nhiên sắc thái này trong tiếng Việt.
- source_word: ἐκρινόμεθα
  choice: bị xét xử
  rationale: κρίνω chỉ việc chịu sự phán xét; “bị xét xử” giữ được liên hệ từ vựng với “tự xét” mà không đẩy nghĩa thành sự kết án chung cuộc.
theological_decisions:
- issue: Mệnh đề thứ hai nói đến sự kết án chung cuộc hay sự phán xét mang tính sửa dạy của Chúa
  choice: Giữ cách nói khái quát “bị xét xử”, để ngữ cảnh cho thấy đây là sự phán xét/sửa dạy của Chúa
  alternative: “bị kết án”, hiểu là sự kết án chung cuộc
  rationale: Câu 32 phân biệt việc Chúa xét xử và sửa dạy các tín hữu với việc bị kết án cùng thế gian. Vì vậy, không nên tăng cường ἐκρινόμεθα thành “bị kết án” ngay trong câu này.
translation_notes:
  register: Văn phong trang trọng, tự nhiên và dễ hiểu. Cấu trúc điều kiện “nếu ... thì ... đã không” thể hiện điều kiện trái với thực tế; “tự xét mình” là cách nói quen thuộc nhưng vẫn giữ chiều sâu phân định của nguyên ngữ.
