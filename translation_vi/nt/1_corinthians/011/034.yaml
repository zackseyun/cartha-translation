id: 1CO.11.34
reference: 1 Corinthians 11:34
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸀εἴ τις πεινᾷ, ἐν οἴκῳ ἐσθιέτω, ἵνα μὴ εἰς κρίμα συνέρχησθε. Τὰ δὲ λοιπὰ ὡς ἂν ἔλθω διατάξομαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/034.yaml
  text: If anyone is hungry[a], let him eat at home, so that you may not come together for judgment. And I will give directions about the rest when I come.
translation:
  language: vi
  text: Nếu ai đói thì hãy ăn ở nhà, để khi anh chị em nhóm lại, anh chị em không chịu sự phán xét.[a] Còn những việc khác, khi đến, tôi sẽ đưa ra chỉ dẫn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “sự kết án”. Từ Hy Lạp κρίμα có thể có nghĩa là “sự phán xét” hoặc “sự kết án”; tại đây, “sự phán xét” phù hợp hơn với văn cảnh gần, nơi Phao-lô nói về sự xét đoán và sửa trị hiện tại của Chúa (các câu 29–32), thay vì nhất thiết nói đến sự kết án cuối cùng.
    reason: lexical_alternative
lexical_decisions:
- source_word: πεινᾷ
  choice: đói
  rationale: Diễn tả tình trạng hiện tại một cách ngắn gọn, tự nhiên trong tiếng Việt hiện đại.
- source_word: ἐν οἴκῳ
  choice: ở nhà
  rationale: Chỉ việc ăn trong khung cảnh gia đình thay vì tại buổi nhóm của hội thánh; đây là cách nói tự nhiên nhất trong tiếng Việt.
- source_word: ἐσθιέτω
  choice: hãy ăn
  rationale: Giữ rõ sắc thái mệnh lệnh ngôi thứ ba của động từ Hy Lạp.
- source_word: εἰς κρίμα
  choice: chuốc lấy sự phán xét
  rationale: Diễn đạt tự nhiên hướng đến kết quả bất lợi của εἰς, đồng thời giữ nghĩa rộng của κρίμα mà không mặc nhiên xác định đó là sự kết án cuối cùng.
- source_word: συνέρχησθε
  choice: nhóm lại
  rationale: Phù hợp với ngữ cảnh cộng đồng tín hữu hội họp và duy trì mối liên hệ từ vựng với phần trước của đoạn văn.
- source_word: Τὰ δὲ λοιπὰ
  choice: Còn những việc khác
  rationale: Là cách chuyển ý tự nhiên, chỉ các vấn đề còn lại mà Phao-lô sẽ xử lý sau.
- source_word: ὡς ἂν ἔλθω
  choice: khi đến
  rationale: Diễn đạt thời điểm tương lai gắn với chuyến thăm dự kiến của người viết; chủ ngữ “tôi” được hiểu rõ từ mệnh đề tiếp theo.
- source_word: διατάξομαι
  choice: tôi sẽ đưa ra chỉ dẫn
  rationale: Truyền đạt ý ban hành hướng dẫn hay quy định thực hành, rõ ràng và tự nhiên trong tiếng Việt hiện đại.
theological_decisions:
- issue: Nghĩa của κρίμα trong lời cảnh báo về việc nhóm lại dự Tiệc Thánh
  choice: sự phán xét, được để mở về tính chất nhưng trong văn cảnh có thể chỉ sự sửa trị hiện tại của Chúa
  alternative: sự kết án
  rationale: Các câu 29–32 phân biệt việc Chúa xét đoán và sửa trị dân Ngài với việc bị kết án cùng thế gian. “Sự phán xét” giữ được phạm vi nghĩa của từ Hy Lạp và không áp đặt kết luận thần học mạnh hơn bản văn.
- issue: Đại từ bất định số ít τις đi với mệnh lệnh
  choice: ai ... hãy ăn
  alternative: người ấy hãy ăn
  rationale: Tiếng Việt dùng “ai” tự nhiên cho một cá nhân bất định và không cần bổ sung giới tính mà nguyên văn không xác định.
translation_notes:
  register: Văn phong trang trọng vừa phải, hiện đại và dễ hiểu. “Anh chị em” biểu đạt số nhiều ngôi thứ hai của cộng đồng được Phao-lô trực tiếp nói với; “nhóm lại” phù hợp ngữ cảnh hội họp của hội thánh. Cấu trúc “không vì nhóm lại mà chuốc lấy” tránh khiến người đọc hiểu rằng mục đích của buổi nhóm là để chịu phán xét.
