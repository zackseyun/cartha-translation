revisions:
- from: Nếu ai đói thì hãy ăn ở nhà, để anh chị em không vì nhóm lại mà chuốc lấy sự phán xét.[a] Còn những việc khác, khi đến, tôi sẽ đưa ra chỉ dẫn.
  to: Nếu ai đói thì hãy ăn ở nhà, để khi anh chị em nhóm lại, anh chị em không chịu sự phán xét.[a] Còn những việc khác, khi đến, tôi sẽ đưa ra chỉ dẫn.
  rationale: Bản sửa đổi bỏ cách diễn giải “vì nhóm lại mà chuốc lấy”, thay bằng một cấu trúc tiếng Việt trực tiếp, rõ nghĩa và gần với mục đích từ ἵνα cùng cụm εἰς κρίμα συνέρχησθε. Chú thích được điều chỉnh để giữ sắc thái của κρίμα và không khép lại một nghĩa thần học vượt quá điều bản văn nói rõ.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T18:12:18Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch truyền đạt đúng các thành phần chính của câu: tình trạng đói, mệnh lệnh ăn ở nhà, lời cảnh báo liên quan đến việc nhóm họp, và việc Phao-lô sẽ sắp đặt các vấn đề còn lại khi ông đến. Tuy nhiên, cụm “không vì nhóm lại mà chuốc lấy” thêm sắc thái nhân quả và tự chuốc lấy không được diễn đạt trực tiếp trong εἰς κρίμα συνέρχησθε. Cần diễn đạt trực tiếp hơn quan hệ giữa việc nhóm lại và sự phán xét.'
  naturalness: “Nếu ai đói thì hãy ăn ở nhà” và câu sau đều tự nhiên, trang trọng vừa phải. “Để khi anh chị em nhóm lại, anh chị em không chịu sự phán xét” tự nhiên hơn và tránh cấu trúc dễ gây hiểu lầm “không vì nhóm lại mà chuốc lấy”.
  terminology: “Nhóm lại”, “sự phán xét”, và “đưa ra chỉ dẫn” phù hợp văn cảnh và tiếng Việt hiện đại. Chú thích nên tránh khẳng định κρίμα chắc chắn không phải là sự kết án cuối cùng; bản văn và văn cảnh hỗ trợ “sự phán xét”, nhưng nghĩa thay thế vẫn cần được để mở.
  issues:
  - severity: medium
    issue: “không vì nhóm lại mà chuốc lấy sự phán xét” diễn giải thêm quan hệ nhân quả và sắc thái tự gây ra hậu quả.
    rationale: Nguyên văn nói theo nghĩa đen là “để anh chị em không nhóm lại nhằm/đến sự phán xét”. Cách dịch hiện tại có thể hiểu rằng chính việc nhóm lại tự nó là nguyên nhân khiến họ “chuốc lấy” phán xét, trong khi lời cảnh báo hướng đến kết quả của sự nhóm họp không đúng đắn trong văn cảnh.
  - severity: low
    issue: Chú thích nói “chứ không phải sự kết án cuối cùng” quá dứt khoát.
    rationale: Văn cảnh câu 29–32 nghiêng về sự xét đoán/sửa trị hiện tại, nhưng κρίμα tự thân vẫn có thể mang nghĩa phán quyết hoặc kết án. Chú thích nên nêu khuynh hướng văn cảnh mà không loại trừ tuyệt đối nghĩa thay thế.
