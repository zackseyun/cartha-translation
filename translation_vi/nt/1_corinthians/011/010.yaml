reference: 1 Corinthians 11:10
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: διὰ τοῦτο ὀφείλει ἡ γυνὴ ἐξουσίαν ἔχειν ἐπὶ τῆς κεφαλῆς διὰ τοὺς ἀγγέλους.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/010.yaml
  text: For this reason the woman ought to have authority on her head[b][a], because of the angels.
translation:
  language: vi
  text: Vì lý do đó, người nữ phải có quyền trên đầu mình[a], vì các thiên sứ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc, theo cách diễn giải rõ hơn: “phải mang một dấu hiệu của thẩm quyền trên đầu mình.” Nguyên văn Hy Lạp nói “quyền” và không có các từ “dấu hiệu” hay “khăn che.”'
    reason: alternative_reading
  - marker: b
    text: Cũng có thể dịch là “các sứ giả,” nhưng “các thiên sứ” có khả năng đúng hơn ở đây.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Vì lý do đó
  rationale: Giữ rõ quan hệ nguyên nhân–hệ quả với lập luận ngay trước đó, đồng thời tự nhiên trong tiếng Việt hiện đại.
- source_word: ὀφείλει
  choice: phải
  rationale: Diễn đạt nghĩa vụ hoặc điều thích hợp phải làm; trong tiếng Việt, “phải” tự nhiên và không nhất thiết mang sắc thái mệnh lệnh pháp lý tuyệt đối.
- source_word: ἡ γυνὴ
  choice: người nữ
  rationale: Giữ nghĩa khái quát số ít và không thu hẹp thành “người vợ,” vì văn cảnh đang bàn rộng hơn về nam và nữ.
- source_word: ἐξουσίαν
  choice: quyền
  rationale: Dịch trực tiếp danh từ chỉ quyền/quyền hạn, không tự ý thêm “dấu hiệu” hay “khăn che,” là những yếu tố không hiện diện minh nhiên trong nguyên văn.
- source_word: ἔχειν
  choice: có
  rationale: Giữ nghĩa thông thường của động từ; tránh chuyển thành “đội” hoặc “mang” theo một cách giải thích cụ thể.
- source_word: ἐπὶ τῆς κεφαλῆς
  choice: trên đầu mình
  rationale: Diễn đạt tự nhiên quan hệ không gian và dùng “mình” để chỉ rõ đầu của người nữ mà không thêm nội dung diễn giải.
- source_word: διὰ τοὺς ἀγγέλους
  choice: vì các thiên sứ
  rationale: διά với đối cách nêu lý do; “thiên sứ” là nghĩa có khả năng cao hơn của ἄγγελοι trong ngữ cảnh này.
theological_decisions:
- issue: Ý nghĩa của ἐξουσίαν ἔχειν ἐπὶ τῆς κεφαλῆς
  choice: Giữ cách nói “có quyền trên đầu mình.”
  alternative: “mang một dấu hiệu của thẩm quyền trên đầu” hoặc “đội khăn che đầu như dấu hiệu của thẩm quyền”
  rationale: Nguyên văn chỉ nói “quyền,” không có từ chỉ “dấu hiệu” hay “khăn che.” Cách dịch chính giữ nguyên sự khó hiểu và căng thẳng diễn giải thay vì giải quyết thay tác giả.
- issue: Đối tượng được gọi là ἀγγέλους
  choice: các thiên sứ
  alternative: các sứ giả
  rationale: ἄγγελος có thể chỉ sứ giả, nhưng dạng số nhiều không kèm định ngữ trong cách dùng của Phao-lô có khả năng cao hơn là chỉ các hữu thể thiên giới; bản dịch không thêm giả thuyết về lý do họ được nhắc đến.
- issue: Phạm vi nghĩa của γυνή
  choice: người nữ
  alternative: người vợ
  rationale: Mạch văn bàn về nam và nữ theo nghĩa đại diện, nên không nên thu hẹp câu này vào quan hệ hôn nhân.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Cấu trúc hơi khác thường “có quyền trên đầu mình” được chủ ý giữ lại vì chính nguyên văn cũng khó và đa nghĩa; chú thích cung cấp cách hiểu diễn giải phổ biến mà không đưa nó vào chính văn.
