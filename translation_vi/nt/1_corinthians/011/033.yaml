id: 1CO.11.33
reference: 1 Corinthians 11:33
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ὥστε, ἀδελφοί μου, συνερχόμενοι εἰς τὸ φαγεῖν ἀλλήλους ἐκδέχεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/033.yaml
  text: So then[a], my brothers, when you come together to eat, wait for one another.
translation:
  language: vi
  text: Vậy nên, anh em[a] của tôi, khi anh em họp lại để ăn, hãy chờ nhau[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn là “anh em”; trong tiếng Hy Lạp, hình thức giống đực này thường được dùng để gọi một hội chúng gồm cả nam lẫn nữ.
    reason: lexical_alternative
  - marker: b
    text: Từ Hy Lạp cũng có thể mang nghĩa “đón nhận” hoặc “tiếp nhận”; trong ngữ cảnh này, “chờ nhau” phù hợp nhất.
    reason: lexical_ambiguity
lexical_decisions:
- source_word: Ὥστε
  choice: Vậy nên
  rationale: Liên từ chỉ kết luận, nối lời chỉ dẫn này với phần sửa dạy ngay trước đó; “vậy nên” tự nhiên và giữ rõ quan hệ suy luận.
- source_word: ἀδελφοί μου
  choice: anh em của tôi
  rationale: Giữ cách xưng hô số nhiều giống đực cùng đại từ sở hữu trong tiếng Hy Lạp, đồng thời chú thích rằng trong ngữ cảnh hội thánh, cách gọi này có thể bao gồm cả nam lẫn nữ.
- source_word: συνερχόμενοι
  choice: khi anh em họp lại
  rationale: Phân từ hiện tại được dùng theo chức năng trạng ngữ, nêu hoàn cảnh áp dụng mệnh lệnh; cách diễn đạt này cũng nhất quán với chủ đề hội thánh nhóm họp trong chương.
- source_word: εἰς τὸ φαγεῖν
  choice: để ăn
  rationale: Cụm giới từ với động từ nguyên mẫu có mạo từ diễn tả mục đích; “để ăn” ngắn gọn, tự nhiên và không xác định quá mức tính chất của bữa ăn.
- source_word: ἀλλήλους
  choice: nhau
  rationale: Đại từ tương hỗ được chuyển thành “nhau”, cách nói tự nhiên trong tiếng Việt khi đi với “chờ”.
- source_word: ἐκδέχεσθε
  choice: hãy chờ nhau
  rationale: Trong bối cảnh một số người ăn trước những người khác (c. 21), nghĩa “chờ” phù hợp nhất với lời sửa dạy thực tiễn của Phao-lô; chú thích vẫn ghi nhận khả năng hiểu là “đón nhận” hoặc “tiếp nhận”.
theological_decisions:
- issue: Phạm vi của cách xưng hô giống đực ἀδελφοί
  choice: Giữ “anh em” trong chính văn và giải thích phạm vi bao gồm cả nam lẫn nữ trong chú thích.
  alternative: anh chị em
  rationale: Danh từ Hy Lạp có hình thức giống đực nhưng thường được dùng để gọi toàn thể hội chúng. Cách dịch này giữ hình thức của nguyên bản mà không phủ nhận phạm vi đại diện của lời xưng hô.
- issue: Sắc thái của ἐκδέχεσθε trong bữa ăn chung
  choice: hãy chờ nhau
  alternative: hãy đón nhận nhau / hãy tiếp nhận nhau
  rationale: Mạch văn về việc có người ăn trước và người khác bị đói khiến nghĩa “chờ nhau” có xác suất cao nhất, nhưng trường nghĩa rộng hơn của động từ không bị loại bỏ hoàn toàn nên được ghi nhận trong chú thích.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. “Họp lại” giữ sắc thái cộng đồng của συνερχόμενοι; tránh lối văn cổ như “hỡi”. Đại từ “anh em” được lặp lại để câu rõ chủ thể và tự nhiên trong lời khuyên trực tiếp.
