source:
  edition: SBLGNT
  text: πᾶσα δὲ γυνὴ προσευχομένη ἢ προφητεύουσα ἀκατακαλύπτῳ τῇ κεφαλῇ καταισχύνει τὴν κεφαλὴν ⸀αὐτῆς, ἓν γάρ ἐστιν καὶ τὸ αὐτὸ τῇ ἐξυρημένῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/005.yaml
  text: But every woman who prays or prophesies with her head uncovered dishonors her head[b][a], for that is one and the same as having been shaved.
translation:
  language: vi
  text: Nhưng mọi phụ nữ cầu nguyện hoặc nói tiên tri với đầu không che[b] thì làm nhục đầu mình[a], vì như thế cũng chẳng khác nào đã bị cạo đầu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể hiểu: “mọi người vợ … làm nhục chồng/đầu của mình.” Từ Hy Lạp gynē có thể nghĩa là “phụ nữ” hoặc “vợ”; trong ngữ cảnh này, “đầu” có thể chỉ phần đầu trên thân thể hoặc được hiểu theo nghĩa ẩn dụ là chồng/người nam có vị trí làm đầu.'
    reason: alternative_reading
  - marker: b
    text: Từ được dịch là “không che” không tự nó cho biết chính xác dùng vật gì để che. Có cách hiểu cho rằng Phao-lô nói cụ thể đến khăn hoặc màn che; cách khác hiểu tổng quát là đầu không được che.
    reason: lexical_alternative
lexical_decisions:
- source_word: γυνή
  choice: phụ nữ
  rationale: Danh từ này có thể chỉ “phụ nữ” hoặc “vợ”. Trong câu này, cách nói khái quát “mọi phụ nữ cầu nguyện hoặc nói tiên tri” phù hợp với nghĩa bề mặt và không giới hạn đối tượng vào người đã kết hôn; nghĩa “vợ” được giữ trong chú thích.
- source_word: προσευχομένη ἢ προφητεύουσα
  choice: cầu nguyện hoặc nói tiên tri
  rationale: Hai phân từ hiện tại diễn tả những hoạt động đang được thực hiện. Cách dịch này tự nhiên trong tiếng Việt và giữ nguyên hai hành động riêng biệt.
- source_word: ἀκατακαλύπτῳ τῇ κεφαλῇ
  choice: mà không che đầu
  rationale: Cụm từ mô tả tình trạng đầu không được che. Bản dịch không xác định vật che là khăn, màn che hay một hình thức nào khác.
- source_word: καταισχύνει
  choice: làm nhục
  rationale: Động từ diễn tả việc gây hổ thẹn hoặc làm mất danh dự trong bối cảnh danh dự xã hội. “Làm nhục” truyền đạt sắc thái mạnh này rõ ràng và tự nhiên.
- source_word: τὴν κεφαλὴν αὐτῆς
  choice: đầu mình
  rationale: Cách dịch sát cụm từ Hy Lạp và giữ được khả năng “đầu” chỉ phần đầu trên thân thể hoặc được dùng theo nghĩa quan hệ trong lập luận của đoạn văn.
- source_word: ἓν γάρ ἐστιν καὶ τὸ αὐτό
  choice: vì như thế cũng chẳng khác nào
  rationale: Thành ngữ Hy Lạp nhấn mạnh sự tương đương. Cách diễn đạt tiếng Việt này tự nhiên mà vẫn truyền đạt lực nhấn mạnh ấy.
- source_word: τῇ ἐξυρημένῃ
  choice: đã bị cạo đầu
  rationale: Phân từ hoàn thành bị động chỉ một người ở trong tình trạng do việc cạo gây nên. Từ “đã” giữ được sắc thái kết quả của hành động đã hoàn tất.
theological_decisions:
- issue: Ý nghĩa của lần xuất hiện thứ hai của κεφαλή trong cụm “làm nhục đầu mình”
  choice: Giữ cách nói mơ hồ “đầu mình” trong chính văn, không xác định đó là đầu trên thân thể hay “đầu” theo nghĩa quan hệ.
  alternative: Dịch rõ là đầu trên thân thể; hoặc hiểu là chồng/người nam giữ vị trí “đầu” trong lập luận của đoạn văn.
  rationale: Câu Hy Lạp cho phép hiểu theo nghĩa đen, trong khi ngữ cảnh rộng hơn gợi ra khả năng ẩn dụ. Không nên tự ý giải quyết sự căng thẳng giải nghĩa mà nguyên văn vẫn để ngỏ.
- issue: Bản chất của vật che đầu
  choice: Dịch khái quát là “không che đầu”.
  alternative: Không đội khăn che đầu; không mang màn che; hoặc để tóc theo một cách cụ thể.
  rationale: Tính từ Hy Lạp nói rằng đầu không được che nhưng không tự nó xác định vật che hay kiểu che cụ thể. Việc nêu đích danh khăn hoặc màn che trong chính văn sẽ vượt quá điều từ ngữ này khẳng định.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Phụ nữ”, “nói tiên tri”, “làm nhục” và “cạo đầu” là những cách diễn đạt phổ thông nhưng vẫn phù hợp với văn bản Kinh Thánh. Chính văn giữ ngắn gọn và bảo toàn các điểm mơ hồ thật sự của nguyên ngữ; chú thích trình bày các khả năng chính mà không áp đặt một lập trường hệ phái.
