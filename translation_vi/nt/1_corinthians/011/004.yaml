  text: πᾶς ἀνὴρ προσευχόμενος ἢ προφητεύων κατὰ κεφαλῆς ἔχων καταισχύνει τὴν κεφαλὴν αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/004.yaml
  text: Every man who prays or prophesies with something on his head dishonors his head[a][b].
translation:
  language: vi
  text: Bất cứ người nam nào cầu nguyện hoặc nói tiên tri mà có vật gì trên đầu đều làm ô nhục đầu mình[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch theo cách truyền thống: “mà đầu bị che phủ.” Nguyên văn Hy Lạp nói sát nghĩa là “có [vật gì] từ đầu phủ xuống” và không nêu rõ vật che là gì.'
    reason: lexical_alternative
  - marker: b
    text: “Đầu mình” có thể chỉ cái đầu thể lý của người ấy, đồng thời cũng có thể gợi lại cách dùng từ “đầu” theo nghĩa quan hệ trong văn cảnh xung quanh.
    reason: alternative_reading
lexical_decisions:
- source_word: πᾶς ἀνὴρ
  choice: Mỗi người nam
  rationale: ἀνήρ có thể chỉ người nam hoặc người chồng; ở đây cách nói khái quát và sự đối ứng với người nữ trong câu kế tiếp khiến “mỗi người nam” là lựa chọn ít áp đặt cách hiểu nhất.
- source_word: προσευχόμενος ἢ προφητεύων
  choice: khi cầu nguyện hoặc nói tiên tri
  rationale: Hai phân từ hiện tại diễn tả người ấy đang tham gia hai hoạt động; “khi” tự nhiên trong tiếng Việt và giữ được tính đồng thời.
- source_word: κατὰ κεφαλῆς ἔχων
  choice: mà có vật gì trên đầu
  rationale: Cụm Hy Lạp theo sát mặt chữ là “có [vật gì] ở/trùm xuống từ đầu” nhưng không nêu rõ loại vật che; cách dịch này giữ sự không xác định ấy mà vẫn dễ hiểu.
- source_word: καταισχύνει
  choice: làm nhục
  rationale: Động từ chỉ việc gây hổ thẹn hoặc làm mất danh dự; “làm nhục” phù hợp với ngữ cảnh danh dự–hổ thẹn và kết hợp tự nhiên với “đầu mình”.
- source_word: τὴν κεφαλὴν αὐτοῦ
  choice: đầu mình
  rationale: Cách dịch giữ nguyên từ “đầu” và đại từ quy chiếu về chủ thể, không quyết định đó chỉ là đầu thể lý hay đồng thời gợi đến nghĩa quan hệ trong câu 3.
theological_decisions:
- issue: κεφαλή ở mệnh đề cuối là đầu thể lý hay “đầu” theo nghĩa quan hệ
  choice: Giữ sự hàm hồ bằng “đầu mình”
  alternative: “cái đầu của chính mình” hoặc “người làm đầu mình”
  rationale: Lời văn có thể tạo sự chồng nghĩa giữa cái đầu thể lý và cách dùng “đầu” trong văn cảnh gần; bản dịch chính không nên loại bỏ sự căng thẳng này.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “người nam” để thể hiện chính xác giới tính mà không mặc nhiên thu hẹp thành “người chồng”; dùng “nói tiên tri” là cách diễn đạt quen thuộc và minh bạch trong văn phong Kinh Thánh.
