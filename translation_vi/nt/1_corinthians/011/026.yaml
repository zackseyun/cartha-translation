id: 1CO.11.26
reference: 1 Corinthians 11:26
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁσάκις γὰρ ⸀ἐὰν ἐσθίητε τὸν ἄρτον τοῦτον καὶ τὸ ⸀ποτήριον πίνητε, τὸν θάνατον τοῦ κυρίου καταγγέλλετε, ἄχρι ⸀οὗ ἔλθῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/026.yaml
  text: For as often as you eat this bread and drink the cup[b][a], you proclaim the Lord’s death until he comes.
translation:
  language: vi
  text: Vì mỗi khi[a] anh chị em ăn bánh này và uống chén[b], anh chị em loan báo sự chết của Chúa cho đến khi Ngài đến.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “hễ khi nào”.'
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn là “chén”, không phải “chén này” trong câu này, dù văn mạch ngay trước đó cho biết đó là chén nào.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁσάκις ... ἐὰν
  choice: mỗi khi
  rationale: 'Cụm này diễn tả một sự việc lặp lại nhưng không xác định: mỗi lần hành động ấy xảy ra. “Mỗi khi” tự nhiên trong tiếng Việt và giữ được sắc thái lặp lại.'
- source_word: γὰρ
  choice: vì
  rationale: Liên từ này đưa ra lời giải thích hỗ trợ cho chỉ dẫn ngay trước đó; “vì” thể hiện trực tiếp quan hệ giải thích.
- source_word: ἐσθίητε
  choice: anh chị em ăn
  rationale: Thể giả định hiện tại trong mệnh đề thời gian không xác định được diễn đạt tự nhiên bằng thì hiện tại trong tiếng Việt. “Anh chị em” làm rõ chủ thể số nhiều.
- source_word: ἄρτον τοῦτον
  choice: bánh này
  rationale: ἄρτος ở đây chỉ bánh dùng trong bữa ăn; “bánh” là cách dịch phổ thông và τοῦτον được thể hiện bằng “này”.
- source_word: τὸ ποτήριον
  choice: chén
  rationale: Nguyên văn có mạo từ xác định nhưng không có đại từ chỉ định “này”. Tiếng Việt không có mạo từ tương ứng; “uống chén” giữ được hình ảnh hoán dụ của nguyên văn mà không tự ý thêm “này”.
- source_word: καταγγέλλετε
  choice: loan báo
  rationale: Động từ này chỉ việc công bố hay truyền báo công khai. “Loan báo” vừa trang trọng, vừa dễ hiểu, và không giải thích thêm bản chất thần học của hành động.
- source_word: τὸν θάνατον τοῦ κυρίου
  choice: sự chết của Chúa
  rationale: Cách diễn đạt này giữ cấu trúc trang trọng và trọng tâm của nguyên văn, trong đó đối tượng được loan báo là sự chết của Chúa.
- source_word: κυρίου
  choice: Chúa
  rationale: “Chúa” là từ tương ứng tự nhiên với κύριος trong ngữ cảnh Phao-lô nói về Đức Chúa Jêsus.
- source_word: ἄχρι οὗ ἔλθῃ
  choice: cho đến khi Ngài đến
  rationale: Cụm từ xác định giới hạn thời gian của việc loan báo. “Ngài” thể hiện chủ thể được hiểu ngầm từ ngữ cảnh mà không thêm tên riêng vào câu.
theological_decisions:
- issue: Chủ thể được hiểu ngầm của ἔλθῃ
  choice: “Ngài” chỉ về Chúa Jêsus
  alternative: 'Lặp lại “Chúa”: “cho đến khi Chúa đến”'
  rationale: Danh từ đứng trước và là tiền ngữ tự nhiên nhất là “Chúa”. Đại từ “Ngài” giữ liên kết ấy và phù hợp với kỳ vọng về việc Chúa trở lại trong văn mạch Phao-lô.
- issue: Ý nghĩa thần học của việc ăn bánh và uống chén
  choice: Trình bày trực tiếp rằng hành động ấy loan báo sự chết của Chúa
  alternative: Diễn giải theo một quan niệm bí tích hoặc thuần túy tưởng niệm
  rationale: Câu này khẳng định chức năng loan báo nhưng không trình bày một học thuyết đầy đủ về Tiệc Thánh. Bản dịch không thêm cách giải thích riêng của bất kỳ hệ phái nào.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. “Anh chị em” thể hiện ngôi thứ hai số nhiều theo lối dùng tiếng Việt hiện nay; “loan báo” giữ sắc thái công khai, long trọng mà không quá cổ. Hai chú thích bảo tồn sắc thái lặp lại của mệnh đề thời gian và sự khác biệt giữa “bánh này” với “chén” trong nguyên văn.
