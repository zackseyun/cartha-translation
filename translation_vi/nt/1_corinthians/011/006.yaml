id: 1CO.11.6
reference: 1 Corinthians 11:6
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἰ γὰρ οὐ κατακαλύπτεται γυνή, καὶ κειράσθω· εἰ δὲ αἰσχρὸν γυναικὶ τὸ κείρασθαι ἢ ξυρᾶσθαι, κατακαλυπτέσθω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/006.yaml
  text: For if a woman does not cover her head[a], she should also have her hair cut off; but if it is disgraceful for a woman to have her hair cut off or to be shaved[b], she should cover her head.
translation:
  language: vi
  text: Vì nếu một người phụ nữ[a] không che đầu[b], thì cũng hãy cắt tóc ngắn đi; nhưng nếu việc cắt tóc ngắn hoặc cạo đầu là điều đáng hổ thẹn đối với một người phụ nữ, thì hãy che đầu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hy Lạp gynē cũng có thể được dịch là “vợ”, tùy theo ngữ cảnh.
    reason: alternative_reading
  - marker: b
    text: Động từ Hy Lạp có thể được dịch là “được che phủ” hoặc “được trùm che”; “đầu” được hàm ý trong ngữ cảnh. Bản văn không xác định một loại vật che cụ thể.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατακαλύπτεται / κατακαλυπτέσθω
  choice: không che đầu / hãy che đầu
  rationale: Động từ có nghĩa là che phủ hoặc trùm khăn. Tân ngữ “đầu” được hàm ý bởi ngữ cảnh và được nêu rõ trong tiếng Việt để câu tự nhiên, nhưng không xác định một loại khăn hay trang phục cụ thể.
- source_word: γυνή
  choice: người nữ
  rationale: Từ này có thể chỉ “người nữ” hoặc “vợ”. Câu này không nhắc rõ đến chồng, nên “người nữ” giữ phạm vi rộng hơn; khả năng “vợ” được bảo lưu trong chú thích.
- source_word: κειράσθω / τὸ κείρασθαι
  choice: hãy cắt tóc ngắn đi / việc cắt tóc ngắn
  rationale: Động từ chỉ việc xén hoặc cắt ngắn tóc, mạnh hơn cách nói chung chung “cắt tóc”, nhưng vẫn phân biệt với việc cạo đầu ở vế kế tiếp.
- source_word: ξυρᾶσθαι
  choice: cạo đầu
  rationale: Động từ chỉ việc cạo tóc. “Cạo đầu” là cách diễn đạt tự nhiên trong tiếng Việt và duy trì sự phân biệt với cắt tóc ngắn.
- source_word: αἰσχρόν
  choice: đáng hổ thẹn
  rationale: Cách dịch này giữ sắc thái xấu hổ và ô nhục trong bối cảnh danh dự xã hội, đồng thời tự nhiên trong tiếng Việt hiện đại.
- source_word: καί
  choice: cũng
  rationale: 'Từ nối nhấn mạnh bước hệ quả trong lập luận: nếu không che đầu thì cũng hãy chấp nhận việc cắt tóc ngắn.'
- source_word: γὰρ ... δὲ
  choice: Vì ... nhưng
  rationale: Giữ rõ quan hệ giải thích và tương phản trong lập luận của câu.
theological_decisions:
- issue: Nên hiểu γυνή là “người nữ” hay “vợ”
  choice: người nữ
  alternative: vợ
  rationale: Ngữ cảnh trực tiếp không nêu người chồng, vì vậy “người nữ” tránh thu hẹp đối tượng một cách không cần thiết. Tuy nhiên, nghĩa “vợ” vẫn khả hữu trong ngữ cảnh rộng hơn và được ghi ở chú thích.
- issue: Hình thức che phủ được nói đến có phải một loại khăn cụ thể hay không
  choice: che đầu
  alternative: trùm khăn hoặc được che phủ
  rationale: Nguyên văn dùng động từ “che phủ” mà không nêu một loại vật che cụ thể. “Che đầu” làm rõ đối tượng được ngữ cảnh hàm ý nhưng không áp đặt kiểu khăn hay trang phục.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “người nữ” thay vì “đàn bà” để giữ sắc thái trung tính; dùng “cắt tóc ngắn” để phân biệt rõ với “cạo đầu” mà không dùng từ cổ như “xén tóc”.
