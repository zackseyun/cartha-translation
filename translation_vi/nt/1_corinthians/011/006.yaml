  to: Vì nếu một người phụ nữ[a] không che đầu[b], thì cũng hãy cắt tóc ngắn đi; nhưng nếu việc cắt tóc ngắn hoặc cạo đầu là điều đáng hổ thẹn đối với một người phụ nữ, thì hãy che đầu.
