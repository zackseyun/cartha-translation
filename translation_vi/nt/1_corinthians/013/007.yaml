  text: It bears all things[a], believes all things, hopes all things[b], endures all things.
translation:
  language: vi
  text: Tình yêu chịu đựng mọi sự[a], tin mọi sự[b], hy vọng mọi sự, bền bỉ chịu đựng mọi sự.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “che phủ mọi sự” hoặc “bảo vệ mọi sự”; στέγει có thể mang nghĩa che phủ, bảo vệ, cũng như chịu đựng.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “tin cậy mọi sự”. Ý ở đây không phải tình yêu cả tin, nhưng tình yêu có khuynh hướng tin cậy.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα
  choice: mọi sự
  rationale: Cụm từ này được lặp lại bốn lần, diễn tả tính bao quát với từng động từ. “Mọi sự” giữ được nhịp điệu tu từ và không xác định đối tượng quá mức.
- source_word: στέγει
  choice: chịu đựng
  rationale: Động từ này có thể mang nghĩa “che phủ, bảo bọc” hoặc nghĩa mở rộng là “chịu đựng”. Trong chuỗi mô tả sự kiên trì của tình yêu, “chịu đựng” tự nhiên và phù hợp, còn sắc thái “che phủ” được giữ trong chú thích.
- source_word: πιστεύει
  choice: tin
  rationale: πιστεύω thường có nghĩa “tin” hoặc “tin cậy”. “Tin” giữ cách diễn đạt ngắn gọn và trực tiếp; trong văn cảnh, từ này nói đến khuynh hướng tin cậy chứ không hàm ý cả tin.
- source_word: ἐλπίζει
  choice: hy vọng
  rationale: Cách dịch trực tiếp này diễn tả hành động đặc trưng và giữ cấu trúc song hành súc tích.
- source_word: ὑπομένει
  choice: bền lòng
  rationale: ὑπομένω diễn tả việc đứng vững và kiên trì dưới áp lực. “Bền lòng” phân biệt động từ kết thúc với στέγει đã dịch là “chịu đựng”, đồng thời tạo cao trào tự nhiên cho chuỗi.
theological_decisions:
- issue: Ý nghĩa của bốn cụm πάντα lặp lại
  choice: Giữ nguyên ngôn ngữ bao quát nhằm mô tả sự bền vững toàn diện của tình yêu.
  alternative: Hiểu như một khẳng định tuyệt đối rằng tình yêu chấp nhận, tán thành hoặc cả tin trước bất cứ điều gì.
  rationale: Văn cảnh trực tiếp là lời mô tả giàu tính thi ca về phẩm chất của tình yêu. “Mọi sự” bảo toàn sức căng trong lời của Phao-lô mà không thêm ý rằng tình yêu thiếu sự phân định về đạo đức.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ bốn vế song hành cùng sự lặp lại của “mọi sự”; dùng “bền lòng” ở vế cuối để tránh lặp “chịu đựng” và chuyển tải sắc thái kiên trì của ὑπομένει.
