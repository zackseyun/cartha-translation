  source_fidelity: Bản nháp giữ đúng bốn mệnh đề phủ định và không thêm “dễ” vào παροξύνεται. Tuy nhiên, “ghi nhớ” làm yếu đáng kể hình ảnh tính toán/ghi sổ của λογίζεται. “Khiếm nhã” có thể bị hiểu hẹp là thiếu lịch sự, trong khi ἀσχημονεῖ bao quát hành vi không đứng đắn hoặc không thích đáng hơn.
  naturalness: Câu song song, ngắn gọn và tự nhiên. “Không tính điều ác” có sắc thái văn chương vừa phải nhưng vẫn rõ nghĩa trong văn cảnh và bảo toàn phép ẩn dụ kế toán tốt hơn “không ghi nhớ điều ác.”
  terminology: “Tìm lợi riêng cho mình” diễn đạt đúng ý tự tìm lợi/tư lợi của ζητεῖ τὰ ἑαυτῆς. “Nổi giận” là cách nói tự nhiên cho παροξύνεται, không hàm ý trạng từ “dễ.” Đổi “khiếm nhã” thành “thiếu đứng đắn” tránh thu hẹp nghĩa; đổi “ghi nhớ” thành “tính” phản ánh λογίζεται chính xác hơn.
