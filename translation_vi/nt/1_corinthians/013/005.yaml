base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/005.yaml
  text: it does not behave disgracefully[a], it does not seek its own, it is not provoked[e][d][c][b], it does not count the wrong.
translation:
  language: vi
  text: không cư xử thiếu đứng đắn[a], không tìm lợi riêng cho mình[b], không nổi giận[c], không tính điều ác[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “không hành động không thích đáng” hoặc “không cư xử thô lỗ.”'
    reason: lexical_alternative
  - marker: b
    text: 'Sát nghĩa: “không tìm những gì thuộc về mình”; tức là không vị kỷ.'
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “không bị kích động” hoặc “không bực tức.” Nguyên văn không có từ “dễ.”'
    reason: alternative_reading
  - marker: d
    text: 'Cũng có thể dịch: “không kể điều ác” hoặc, theo nghĩa thành ngữ, “không giữ sổ những điều sai trái.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀσχημονεῖ
  choice: cư xử khiếm nhã
  rationale: Động từ chỉ cách hành xử không đúng mực, đáng hổ thẹn hoặc thiếu đoan trang. “Cư xử khiếm nhã” tự nhiên trong tiếng Việt và giữ được sắc thái xã hội–đạo đức mà không thu hẹp thành sự bất lịch sự đơn thuần.
- source_word: ζητεῖ τὰ ἑαυτῆς
  choice: tìm lợi riêng cho mình
  rationale: Cụm Hy Lạp sát nghĩa là “tìm những gì thuộc về mình,” một thành ngữ diễn tả thái độ vị kỷ. Bản dịch nêu rõ ý thành ngữ nhưng không thêm sắc thái “khăng khăng theo ý mình” vốn không được nói trực tiếp.
- source_word: παροξύνεται
  choice: nổi giận
  rationale: Dạng động từ diễn tả việc bị kích động đến bực tức hoặc giận dữ. “Nổi giận” là cách nói tự nhiên, không thêm trạng từ “dễ” vốn không có trong nguyên văn.
- source_word: λογίζεται
  choice: ghi nhớ
  rationale: Động từ có nghĩa tính, kể, quy vào sổ hoặc lưu tâm. Trong ngữ cảnh quan hệ giữa người với người, “ghi nhớ” truyền đạt hình ảnh giữ điều sai trái trong sổ tính mà vẫn tự nhiên trong tiếng Việt.
- source_word: τὸ κακόν
  choice: điều ác
  rationale: Cụm danh từ số ít có thể chỉ điều ác, điều xấu hoặc điều sai trái. “Điều ác” giữ nguyên tính khái quát và số ít của tiếng Hy Lạp, không tự ý giới hạn thành những lỗi người khác đã làm với mình.
- source_word: ἀγάπη (chủ ngữ ngầm từ văn cảnh)
  choice: lược chủ ngữ
  rationale: Chủ ngữ “tình yêu thương” được tiếp nối từ câu trước. Tiếng Việt tự nhiên cho phép lược chủ ngữ trong chuỗi vị ngữ song song.
theological_decisions:
- issue: Có nên tăng cường παροξύνεται thành “dễ nổi giận” hay không
  choice: không nổi giận
  alternative: không dễ nổi giận
  rationale: Nguyên văn không có trạng từ tương đương với “dễ.” Bản dịch tránh thêm mức độ, nhờ đó giữ nguyên sức tuyệt đối và sự căng thẳng của lời mô tả.
- issue: Có nên giải thích λογίζεται τὸ κακόν là “không ghi sổ những điều sai trái người khác làm” hay không
  choice: không ghi nhớ điều ác
  alternative: không kể lại những điều sai trái; không giữ sổ những lỗi lầm
  rationale: Cách chọn giữ phạm vi rộng và số ít của τὸ κακόν, đồng thời phản ánh nét nghĩa tính toán/lưu vào sổ của λογίζεται mà không xác định rõ tác nhân hay người chịu thiệt vốn không xuất hiện trong câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Các vế song song đều dùng “không” để giữ nhịp tu từ của nguyên văn. Câu không lặp lại “tình yêu thương” vì chủ ngữ đã rõ từ văn cảnh.
