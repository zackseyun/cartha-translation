id: 1CO.13.12
reference: 1 Corinthians 13:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: βλέπομεν γὰρ ἄρτι δι’ ἐσόπτρου ἐν αἰνίγματι, τότε δὲ πρόσωπον πρὸς πρόσωπον· ἄρτι γινώσκω ἐκ μέρους, τότε δὲ ἐπιγνώσομαι καθὼς καὶ ἐπεγνώσθην.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/012.yaml
  text: For now we see in a mirror[a], dimly, but then face to face. Now I know in part, but then I will know fully, just as I also have been fully known.
translation:
  language: vi
  text: Vì hiện nay chúng ta nhìn qua một tấm gương, một cách bí ẩn[a]; nhưng bấy giờ chúng ta sẽ thấy mặt đối mặt. Hiện nay tôi biết một phần, nhưng bấy giờ tôi sẽ biết đầy đủ, như chính tôi cũng đã được biết đầy đủ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “một cách mơ hồ.” Tiếng Hy Lạp dịch sát là “trong một câu đố,” nhấn mạnh việc nhìn biết một cách gián tiếp và khó hiểu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: βλέπομεν
  choice: chúng ta nhìn
  rationale: Giữ nguyên hình ảnh thị giác của động từ và diễn đạt tự nhiên trong tiếng Việt.
- source_word: ἄρτι
  choice: hiện nay
  rationale: Đánh dấu tình trạng hiện tại, tương phản rõ với τότε, “bấy giờ”.
- source_word: δι’ ἐσόπτρου
  choice: qua một tấm gương
  rationale: Giữ ý trung gian của διά với sở hữu cách và hình ảnh chiếc gương trong nguyên văn.
- source_word: ἐν αἰνίγματι
  choice: như trong một câu đố
  rationale: Bảo tồn danh từ αἴνιγμα và ý nhận biết gián tiếp, khó hiểu, thay vì chỉ diễn giải là “mơ hồ”.
- source_word: τότε δὲ
  choice: nhưng bấy giờ
  rationale: Thể hiện cả mốc thời gian tương lai lẫn sự tương phản với hiện tại.
- source_word: πρόσωπον πρὸς πρόσωπον
  choice: mặt đối mặt
  rationale: Thành ngữ tiếng Việt tự nhiên, diễn tả sự gặp gỡ trực tiếp.
- source_word: γινώσκω ἐκ μέρους
  choice: tôi biết một phần
  rationale: Dịch sát thành ngữ chỉ sự hiểu biết có giới hạn và giữ phép đối song song của câu.
- source_word: ἐπιγνώσομαι
  choice: tôi sẽ biết đầy đủ
  rationale: Diễn tả mức độ nhận biết đầy đủ hơn, tương phản với “biết một phần”, nhưng không hàm ý toàn tri.
- source_word: καθὼς καὶ ἐπεγνώσθην
  choice: như chính tôi cũng đã được biết đầy đủ
  rationale: Giữ thể bị động, không nêu rõ chủ thể biết, đồng thời duy trì sự tương ứng từ vựng với ἐπιγνώσομαι.
theological_decisions:
- issue: Mức độ hiểu biết trong tương lai được diễn tả bởi ἐπιγνώσομαι
  choice: tôi sẽ biết đầy đủ
  alternative: tôi sẽ biết mọi sự; tôi sẽ biết hoàn toàn
  rationale: Cách dịch này giữ sự tương phản giữa hiểu biết từng phần và hiểu biết đầy đủ hơn, nhưng không biến lời văn thành tuyên bố rằng con người sẽ có sự toàn tri ngang bằng với Đức Chúa Trời.
- issue: Chủ thể của động từ bị động ἐπεγνώσθην
  choice: không nêu chủ thể trong bản văn chính
  alternative: như Đức Chúa Trời đã biết tôi đầy đủ
  rationale: Nguyên văn để chủ thể hàm ẩn; bản dịch giữ sự hàm ẩn ấy thay vì bổ sung một xác định thần học không được nói ra trực tiếp.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cặp “hiện nay/bấy giờ” cùng cấu trúc lặp “biết một phần/biết đầy đủ” bảo tồn nhịp đối chiếu của nguyên văn; dấu chấm phẩy giúp hai vế thị giác và tri thức liên kết mà vẫn rõ ràng.
