revisions:
- from: Vì hiện nay chúng ta nhìn qua một tấm gương, như trong một câu đố[a]; nhưng bấy giờ sẽ thấy mặt đối mặt. Hiện nay tôi biết một phần, nhưng bấy giờ tôi sẽ biết đầy đủ, như chính tôi cũng đã được biết đầy đủ.
  to: Vì hiện nay chúng ta nhìn qua một tấm gương, một cách bí ẩn[a]; nhưng bấy giờ chúng ta sẽ thấy mặt đối mặt. Hiện nay tôi biết một phần, nhưng bấy giờ tôi sẽ biết đầy đủ, như chính tôi cũng đã được biết đầy đủ.
  rationale: Sửa cách diễn đạt của ἐν αἰνίγματι để không thêm phép so sánh và để tiếng Việt tự nhiên hơn, đồng thời phục hồi chủ ngữ số nhiều trong vế «bấy giờ». Các lựa chọn khác được giữ nguyên vì trung thành với nguyên văn và không áp đặt diễn giải thần học.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T18:12:43Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch giữ được các đối chiếu chính: ἄρτι/τότε («hiện nay/bấy giờ»), βλέπομεν/γινώσκω («nhìn/biết»), γνώση từng phần và πλήρης hơn, cũng như thể bị động không nêu tác nhân ở cuối câu. Tuy nhiên, «như trong một câu đố» thêm sắc thái so sánh không có trong ἐν αἰνίγματι và không tự nhiên trong tiếng Việt; đồng thời vế «bấy giờ sẽ thấy» lược mất chủ ngữ số nhiều của βλέπομεν.'
  naturalness: «Qua một tấm gương, một cách bí ẩn» là cách diễn đạt hiện đại, rõ nghĩa hơn, vẫn giữ hình ảnh trung gian và tính bí ẩn/khó giải của nguyên ngữ. Thêm «chúng ta» ở vế đối lập giúp cấu trúc song song và tránh lối nói vô nhân xưng.
  terminology: «mặt đối mặt», «biết một phần», «biết đầy đủ» phù hợp văn phong Kinh Thánh hiện đại và duy trì tương ứng từ vựng giữa ἐπιγνώσομαι và ἐπεγνώσθην. Không nên xác định người biết hàm ẩn là Đức Chúa Trời trong bản văn chính.
  issues:
  - severity: medium
    issue: «như trong một câu đố» đối xử ἐν αἰνίγματι như một phép so sánh.
    rationale: Nguyên ngữ dùng cụm giới từ, không có từ «như». Cách nói này cũng gượng trong tiếng Việt và dễ khiến độc giả hiểu là đang nhìn vào một câu đố.
  - severity: medium
    issue: Vế «nhưng bấy giờ sẽ thấy mặt đối mặt» không nêu chủ ngữ «chúng ta».
    rationale: Động từ βλέπομεν là ngôi thứ nhất số nhiều và câu tiếng Việt hiện tại tạo sự lệch song song với «chúng ta nhìn» ở vế đầu.
  revised_text: Vì hiện nay chúng ta nhìn qua một tấm gương, một cách bí ẩn[a]; nhưng bấy giờ chúng ta sẽ thấy mặt đối mặt. Hiện nay tôi biết một phần, nhưng bấy giờ tôi sẽ biết đầy đủ, như chính tôi cũng đã được biết đầy đủ.
