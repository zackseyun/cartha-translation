  text: For we know in part[a], and we prophesy in part.
translation:
  language: vi
  text: Vì chúng ta biết một phần[a] và nói tiên tri một phần.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “không trọn vẹn”. Thành ngữ Hy Lạp theo nghĩa đen là “từ một phần” và được lặp lại để nhấn mạnh trong cả hai vế.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ μέρους
  choice: một phần
  rationale: Thành ngữ Hy Lạp có nghĩa là “một phần” hoặc “cách phần nào”. Lặp lại “một phần” trong cả hai vế giữ được cấu trúc song song và chuẩn bị cho sự tương phản với điều trọn vẹn ở câu kế tiếp.
- source_word: γὰρ
  choice: Vì
  rationale: Liên từ này nêu lời giải thích cho ý trước đó; “Vì” thể hiện tự nhiên mối liên hệ lập luận trong tiếng Việt.
- source_word: γινώσκομεν
  choice: chúng ta biết
  rationale: Đây là cách dịch trực tiếp, giữ nguyên ý nhận biết mà không diễn giải quá mức thành sự hiểu biết sâu sắc.
- source_word: καὶ
  choice: và
  rationale: Liên từ đơn giản nối hai vế song song; “và” giữ được sự cân xứng của câu.
- source_word: προφητεύομεν
  choice: nói tiên tri
  rationale: Trong ngữ cảnh các ân tứ thuộc linh, cụm này diễn đạt hoạt động phát ngôn mang tính tiên tri mà không giới hạn vào việc dự báo tương lai hay đồng nhất với giảng đạo.
theological_decisions:
- issue: Ý nghĩa của hoạt động tiên tri trong hội thánh
  choice: Dịch προφητεύομεν là “nói tiên tri”, không thu hẹp thành dự báo tương lai hoặc giảng đạo nói chung.
  alternative: “tiên đoán các biến cố tương lai” hoặc “rao giảng”
  rationale: Ngữ cảnh trực tiếp bàn về các ân tứ thuộc linh, còn từ Hy Lạp có thể chỉ lời nói tiên tri được soi dẫn theo nghĩa rộng hơn việc dự báo. Cách dịch trung tính giữ nguyên phạm vi và sự căng thẳng thần học của nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ phép lặp “một phần” để phản ánh cấu trúc Hy Lạp; dùng “nói tiên tri” theo cách gọi quen thuộc nhưng không áp đặt một cách hiểu giáo phái.
