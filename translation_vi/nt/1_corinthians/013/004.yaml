id: 1CO.13.4
reference: 1 Corinthians 13:4
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἡ ἀγάπη μακροθυμεῖ, χρηστεύεται ἡ ἀγάπη, οὐ ζηλοῖ ⸂ἡ ἀγάπη⸃, οὐ περπερεύεται, οὐ φυσιοῦται,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/004.yaml
  text: Love is patient[a], love is kind. It does not envy, it does not boast[b], it is not puffed up.
translation:
  language: vi
  text: Tình yêu thương nhẫn nại, tình yêu thương nhân hậu; không ganh tị[a][c], không khoe khoang, không tự cao[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “không ghen”. Động từ Hy Lạp có thể chỉ lòng sốt sắng theo nghĩa tích cực hoặc sự ghen ghét, ganh tị theo nghĩa tiêu cực; văn cảnh phủ định ở đây nghiêng về “ganh tị”.
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn dùng hình ảnh “bị thổi phồng”, tức trở nên kiêu căng hoặc tự phụ.
    reason: metaphor
  - marker: c
    text: 'Một số chứng cứ bản thảo lặp lại “tình yêu thương” tại đây: “tình yêu thương không ganh tị”.'
    reason: textual_variant
lexical_decisions:
- source_word: ἀγάπη
  choice: tình yêu thương
  rationale: “Tình yêu thương” diễn đạt tự nhiên ý nghĩa rộng của ἀγάπη trong tiếng Việt hiện đại, tránh thu hẹp thành lòng từ thiện hay chỉ tình cảm lãng mạn.
- source_word: μακροθυμεῖ
  choice: thì nhẫn nại
  rationale: Động từ chỉ sự kiên nhẫn, chịu đựng lâu dài đối với người khác; “nhẫn nại” vừa rõ nghĩa vừa trang trọng.
- source_word: χρηστεύεται
  choice: thì nhân từ
  rationale: Động từ hiếm này nói đến việc đối xử tử tế và có lòng tốt; “nhân từ” giữ được sắc thái phẩm chất lẫn cách hành xử.
- source_word: ζηλοῖ
  choice: ganh tị
  rationale: Trong chuỗi phủ định này, động từ mang nghĩa tiêu cực là ganh tị hoặc ghen; “ganh tị” diễn đạt rõ lòng khó chịu trước điều tốt người khác có.
- source_word: περπερεύεται
  choice: khoe khoang
  rationale: Động từ nói đến việc phô trương và tự khoe mình; “khoe khoang” là cách nói hiện đại, rõ ràng và phù hợp văn phong.
- source_word: φυσιοῦται
  choice: tự cao
  rationale: Từ Hy Lạp dùng hình ảnh bị thổi phồng để nói về lòng kiêu ngạo. “Tự cao” tự nhiên trong tiếng Việt, còn hình ảnh nguyên văn được ghi ở chú thích.
- source_word: οὐ
  choice: không
  rationale: “Không” diễn đạt trực tiếp và tự nhiên sự phủ định lặp lại trong các mệnh đề Hy Lạp.
theological_decisions:
- issue: Cách dịch ἀγάπη trong đoạn mô tả phẩm chất đạo đức và thần học
  choice: tình yêu thương
  alternative: tình yêu; bác ái
  rationale: “Tình yêu thương” giữ phạm vi rộng của ἀγάπη, phù hợp tiếng Việt phổ thông và không giới hạn nghĩa vào việc cứu trợ hay bố thí.
- issue: Sắc thái của ζηλοῖ
  choice: ganh tị
  alternative: ghen; sốt sắng
  rationale: Bản thân động từ có thể chỉ nhiệt tâm theo nghĩa tích cực hoặc lòng ghen/ganh tị theo nghĩa tiêu cực; cấu trúc phủ định giữa các thói xấu khiến nghĩa “ganh tị” thích hợp hơn, nhưng chú thích vẫn bảo lưu khả năng diễn đạt “ghen”.
- issue: Ẩn dụ trong φυσιοῦται
  choice: tự cao
  alternative: phồng lên vì kiêu ngạo; kiêu căng
  rationale: Bản chính ưu tiên cách nói Việt tự nhiên, còn chú thích bảo lưu hình ảnh bị thổi phồng vốn đặc trưng trong cách dùng của Phao-lô.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ phép lặp “tình yêu thương” trong hai mệnh đề đầu để phản ánh nhịp điệu Hy Lạp; các mệnh đề phủ định sau lược chủ ngữ theo cách nói tự nhiên của tiếng Việt. Dấu chấm phẩy làm rõ bước chuyển từ hai khẳng định sang chuỗi phủ định.
