base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/013.yaml
  text: 'And now these three remain: faith[a], hope, and love[c][b]. But the greatest of these is love.'
translation:
  language: vi
  text: Còn bây giờ, đức tin[a], hy vọng và tình yêu thương—ba điều này vẫn còn[b]; nhưng trong ba điều ấy, tình yêu thương là lớn hơn hết.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Đức tin” cũng có thể được hiểu rộng hơn là “sự tin cậy”.
    reason: alternative_reading
  - marker: b
    text: Hay “vẫn tồn tại” hoặc “bền vững”; động từ Hy Lạp có thể chỉ việc tiếp tục tồn tại hay bền lâu.
    reason: lexical_alternative
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: Còn bây giờ
  rationale: νυνί chỉ thời điểm hoặc tình trạng hiện tại, còn δέ tạo sự chuyển ý nhẹ, có thể mang sắc thái nối tiếp hoặc tương phản. “Còn bây giờ” tự nhiên trong tiếng Việt và giữ được cả hai nét này.
- source_word: μένει
  choice: vẫn tồn tại
  rationale: μένω ở đây nói đến việc tiếp tục còn lại hoặc bền vững, đối lập với những ân tứ sẽ chấm dứt. “Vẫn tồn tại” rõ nghĩa trong tiếng Việt hiện đại; chú thích giữ phương án “vẫn còn/bền vững”.
- source_word: πίστις
  choice: đức tin
  rationale: Trong bộ ba cùng với hy vọng và tình yêu thương, πίστις tự nhiên nhất là “đức tin”. Từ này cũng có thể mang nghĩa “sự tin cậy”, nên phương án ấy được ghi nhận trong chú thích.
- source_word: ἐλπίς
  choice: niềm hy vọng
  rationale: ἐλπίς thường chỉ hy vọng trong cách dùng của Phao-lô. “Niềm hy vọng” tự nhiên, dễ hiểu và giữ sắc thái tích cực của danh từ.
- source_word: ἀγάπη
  choice: tình yêu thương
  rationale: “Tình yêu thương” diễn đạt rõ ἀγάπη trong tiếng Việt hiện đại và tránh để “tình yêu” bị hiểu quá hẹp theo nghĩa lãng mạn.
- source_word: τὰ τρία ταῦτα
  choice: cả ba điều ấy
  rationale: Cụm từ quy chiếu trực tiếp về ba điều vừa nêu. “Cả ba điều ấy” tái hiện rõ lực chỉ định và cấu trúc nhấn mạnh của nguyên văn.
- source_word: μείζων δὲ τούτων
  choice: nhưng lớn hơn cả trong số đó
  rationale: μείζων có hình thức so sánh hơn, nhưng khi so sánh trong một nhóm ba điều, tiếng Việt diễn đạt tự nhiên bằng “lớn hơn cả”. Cách dịch này giữ ý xếp tình yêu thương ở vị trí cao nhất mà không thêm lý giải thần học.
theological_decisions:
- issue: Nghĩa của πίστις trong bộ ba thần học
  choice: đức tin
  alternative: sự tin cậy; lòng trung tín
  rationale: Ngữ cảnh “đức tin, niềm hy vọng và tình yêu thương” nghiêng mạnh về “đức tin”. “Sự tin cậy” vẫn có thể phản ánh phạm vi nghĩa của từ, còn “lòng trung tín” ít có khả năng hơn trong câu này.
- issue: Lực so sánh của μείζων
  choice: lớn hơn cả trong số đó
  alternative: lớn hơn những điều ấy
  rationale: Nguyên văn dùng dạng so sánh hơn, nhưng cấu trúc đối chiếu một thành viên với nhóm ba thành viên có ý nghĩa cao nhất trong nhóm. “Lớn hơn cả” là cách diễn đạt tiếng Việt tự nhiên, đồng thời không giải thích vì sao tình yêu thương lớn hơn.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, phù hợp độc giả phổ thông. Dùng “tình yêu thương” để tránh nghĩa lãng mạn quá hẹp; giữ nhịp câu gần với cấu trúc Hy Lạp và dùng dấu gạch ngang để làm rõ phần đồng vị “cả ba điều ấy”.
