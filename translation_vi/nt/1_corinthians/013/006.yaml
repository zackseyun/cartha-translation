  - severity: low
    issue: Cách nêu phương án trong chú thích
    rationale: “Sự không công chính” tự nhiên hơn “điều không công chính”; “vui mừng về sự thật” phản ánh trực tiếp hơn khả năng nghĩa ‘rejoice over the truth’ của συγχαίρει.
