  text: it does not rejoice in unrighteousness, but rejoices with the truth.
translation:
  language: vi
  text: Tình yêu không vui mừng về điều bất chính[a], nhưng cùng vui với sự thật[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “việc sai trái”, “sự bất công” hoặc “sự không công chính”.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “vui mừng về sự thật”. Động từ ghép trong tiếng Hy Lạp có thể mang nghĩa cùng chia sẻ niềm vui hoặc vui mừng về sự thật.
    reason: lexical_alternative
lexical_decisions:
- source_word: χαίρει
  choice: vui mừng
  rationale: Diễn đạt niềm vui hay sự hân hoan, giữ được sắc thái trang trọng và sự song hành với συγχαίρει.
- source_word: ἐπὶ τῇ ἀδικίᾳ
  choice: trước điều bất chính
  rationale: Với χαίρει, ἐπί + tặng cách chỉ nguyên do hay đối tượng gây vui mừng. “Trước” tự nhiên trong tiếng Việt và tránh gợi ý rằng tình yêu ở bên trong sự bất chính. ἀδικία có nghĩa rộng về điều sai trái, bất công hoặc không công chính.
- source_word: συγχαίρει
  choice: cùng vui
  rationale: Giữ rõ sắc thái cùng chia sẻ niềm vui của tiền tố συν-, đồng thời vẫn tự nhiên và cân đối với “vui mừng” ở vế trước.
- source_word: δὲ
  choice: nhưng
  rationale: Thể hiện rõ quan hệ tương phản giữa điều tình yêu không làm và điều tình yêu làm.
- source_word: τῇ ἀληθείᾳ
  choice: với sự thật
  rationale: Giữ mạo từ và phạm vi nghĩa rộng của ἀλήθεια, không thu hẹp vào lời nói thật, hành vi chân thật hay chân lý Tin Mừng.
theological_decisions:
- issue: Cách dịch ἀδικία trong thế đối lập đạo đức với ἀλήθεια
  choice: điều bất chính
  alternative: việc sai trái; sự bất công; điều không công chính
  rationale: “Điều bất chính” giữ được chiều kích đạo đức rộng của từ Hy Lạp mà không giới hạn vào bất công xã hội hoặc phạm pháp; chú thích bảo lưu các khả năng từ vựng khác.
- issue: Sắc thái của συγχαίρει trong quan hệ với τῇ ἀληθείᾳ
  choice: cùng vui với sự thật
  alternative: vui mừng vì sự thật
  rationale: Bản chính giữ sắc thái đồng vui của động từ ghép, nhưng chú thích thừa nhận rằng trong ngữ cảnh này động từ cũng có thể diễn tả vui mừng về sự thật.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. “Tình yêu” được nêu lại làm chủ ngữ theo mạch văn 1 Cô-rinh-tô 13:4–7, dù trong chính câu Hy Lạp chủ ngữ được lược bỏ. Cấu trúc đối xứng “không… nhưng…” và nét nhân cách hóa “cùng vui với sự thật” được giữ nguyên.
