id: 1CO.13.10
reference: 1 Corinthians 13:10
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὅταν δὲ ἔλθῃ τὸ τέλειον, ⸀τὸ ἐκ μέρους καταργηθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/010.yaml
  text: But when the perfect comes[b][a], the partial will be set aside.
translation:
  language: vi
  text: Nhưng khi điều trọn vẹn[a] đến, điều chỉ có một phần sẽ bị loại bỏ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “điều hoàn tất” hoặc “điều trưởng thành.” Cụm từ này (Hy Lạp: to teleion) còn được tranh luận; nó có thể nói đến sự trọn vẹn, sự trưởng thành hoặc trạng thái viên mãn trong thời cuối cùng, đối lập với tình trạng hiện nay chỉ có một phần.'
    reason: alternative_reading
  - marker: b
    text: 'Cũng có thể dịch: “sẽ bị làm cho chấm dứt”, “sẽ qua đi” hoặc “sẽ bị bãi bỏ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν
  choice: khi
  rationale: Dẫn vào một mệnh đề thời gian có tính tương lai; “khi” tự nhiên trong tiếng Việt và phù hợp hơn “bất cứ khi nào” trong ngữ cảnh này.
- source_word: δὲ
  choice: Nhưng
  rationale: Đánh dấu sự tương phản nhẹ với tình trạng hiểu biết và nói tiên tri chỉ có một phần ở câu trước.
- source_word: ἔλθῃ
  choice: đến
  rationale: Thể giả định aorist sau ὅταν hướng đến một biến cố tương lai; “đến” diễn đạt tự nhiên mà không thêm sắc thái ngoài nguyên văn.
- source_word: τὸ τέλειον
  choice: điều trọn vẹn
  rationale: τέλειος có thể chỉ sự trọn vẹn, hoàn tất hoặc trưởng thành. Cách dịch trung tính này giữ dạng danh từ hóa giống nguyên văn và không xác định trước đối tượng được nói đến.
- source_word: τὸ ἐκ μέρους
  choice: điều chỉ có một phần
  rationale: Cụm giới từ có mạo từ được dùng như danh từ; cách dịch này rõ nghĩa, tự nhiên và giữ sự đối lập trực tiếp với “điều trọn vẹn”.
- source_word: καταργηθήσεται
  choice: sẽ bị loại bỏ
  rationale: Thể tương lai bị động nói rằng điều chỉ có một phần sẽ bị làm cho mất hiệu lực hoặc chấm dứt. “Bị loại bỏ” giữ nghĩa chấm dứt mà không nhất thiết hàm ý bị tiêu diệt.
theological_decisions:
- issue: Đối tượng mà τὸ τέλειον chỉ đến
  choice: Dịch khái quát là “điều trọn vẹn”, không xác định đối tượng.
  alternative: “điều hoàn tất”, “sự trưởng thành”, hoặc trạng thái viên mãn trong thời cuối cùng; một số người cũng hiểu là quy điển Kinh Thánh hoàn tất.
  rationale: Bản thân câu Hy Lạp không nêu rõ đối tượng. Dạng trung tính có thể gợi một ý niệm trừu tượng hoặc toàn thể nhưng không quyết định cách hiểu; vì vậy bản dịch cần giữ sự mơ hồ và căng thẳng thần học của nguyên văn.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Trật tự câu giữ rõ thế tương phản giữa “điều trọn vẹn” và “điều chỉ có một phần”; các chú thích được đặt theo đúng vị trí từ ngữ liên quan.
