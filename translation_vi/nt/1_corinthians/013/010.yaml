  source_fidelity: 'Bản dịch phản ánh chính xác cấu trúc và ý nghĩa của câu Hy Lạp: ὅταν δὲ được chuyển tự nhiên là “Nhưng khi”; ἔλθῃ giữ nét hướng tới tương lai qua “đến”; τὸ τέλειον và τὸ ἐκ μέρους đều được danh từ hóa và đặt trong thế đối lập rõ ràng. “Sẽ bị loại bỏ” diễn đạt phù hợp thì tương lai bị động của καταργηθήσεται, với ý bị làm cho chấm dứt hay mất hiệu lực.'
  naturalness: “Nhưng khi điều trọn vẹn đến, điều chỉ có một phần sẽ bị loại bỏ” là tiếng Việt tiêu chuẩn hiện đại, trang trọng và dễ hiểu. Cách lặp “điều” giúp duy trì tính khái quát, trung tính của hai cụm danh từ Hy Lạp mà không làm câu nặng nề.
  terminology: “Điều trọn vẹn” là lựa chọn phù hợp cho τὸ τέλειον, vừa tự nhiên vừa không áp đặt một cách giải thích thần học về đối tượng được nói đến. Chú thích a nêu các khả năng từ vựng và cách hiểu liên quan mà vẫn xác nhận tính tranh luận của cụm từ. Chú thích b bảo tồn các sắc thái thay thế của καταργηθήσεται. Các neo chú thích đặt đúng tại từ ngữ liên hệ.
