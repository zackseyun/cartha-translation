id: 1CO.13.8
reference: 1 Corinthians 13:8
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἡ ἀγάπη οὐδέποτε ⸀πίπτει. εἴτε δὲ προφητεῖαι, καταργηθήσονται· εἴτε γλῶσσαι, παύσονται· εἴτε γνῶσις, καταργηθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/008.yaml
  text: Love never fails[a]. But whether there are prophecies, they will be set aside; whether tongues, they will cease; whether knowledge[c][b], it will be set aside.
translation:
  language: vi
  text: Tình yêu thương không bao giờ thất bại[a]. Còn các lời tiên tri thì sẽ bị bãi bỏ; các tiếng lạ thì sẽ chấm dứt; sự hiểu biết thì sẽ bị bãi bỏ[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Tình yêu thương không bao giờ suy tàn” hoặc “Tình yêu thương không bao giờ chấm dứt.”'
    reason: lexical_alternative
  - marker: c
    text: Động từ được dịch là “sẽ bị bãi bỏ” ở đây cũng chính là động từ được dùng trong vế nói về “các lời tiên tri.”
    reason: cross_reference
lexical_decisions:
- source_word: ἀγάπη
  choice: tình yêu thương
  rationale: Diễn đạt tự nhiên nội dung rộng của từ Hy Lạp, không thu hẹp vào lòng từ thiện hay một dạng tình cảm riêng biệt.
- source_word: οὐδέποτε πίπτει
  choice: không bao giờ thất bại
  rationale: Giữ sắc thái thành ngữ về tính bền vững và đáng tin cậy của tình yêu thương, đồng thời không đồng nhất πίπτει với các động từ chỉ sự chấm dứt ở phần sau.
- source_word: προφητεῖαι
  choice: các lời tiên tri
  rationale: Trong ngữ cảnh các ân tứ, số nhiều chỉ những lời hay sứ điệp mang tính tiên tri; cách dịch này quen thuộc và dễ hiểu.
- source_word: καταργηθήσονται / καταργηθήσεται
  choice: sẽ bị loại bỏ
  rationale: Dùng cùng một cách dịch cho hai dạng của cùng động từ, diễn tả việc không còn được duy trì hay vận hành mà không nhất thiết hàm ý bị tiêu diệt.
- source_word: γλῶσσαι
  choice: các tiếng lạ
  rationale: Trong 1 Cô-rinh-tô 12–14, từ này chỉ hiện tượng ân tứ đang được bàn đến. “Các tiếng lạ” giữ được ngữ cảnh ấy mà không quyết định chúng nhất thiết thuộc loại ngôn ngữ nào.
- source_word: παύσονται
  choice: sẽ ngưng
  rationale: Phản ánh trực tiếp ý nghĩa chấm dứt của động từ và giữ sự phân biệt với καταργέω trong hai vế bên cạnh.
- source_word: γνῶσις
  choice: sự hiểu biết
  rationale: Phù hợp với cách dùng của Phao-lô và với phần tiếp theo nói về sự hiểu biết chỉ có một phần.
theological_decisions:
- issue: Ý nghĩa của πίπτει khi nói về tình yêu thương
  choice: Tình yêu thương không bao giờ thất bại
  alternative: Tình yêu thương không bao giờ sa ngã / không bao giờ chấm dứt
  rationale: “Thất bại” diễn tả tính bền vững của tình yêu thương mà không xóa nhòa sự khác nhau giữa πίπτει và các động từ καταργέω, παύω ở các vế sau.
- issue: Ý nghĩa của γλῶσσαι trong phân đoạn
  choice: các tiếng lạ
  alternative: các ngôn ngữ
  rationale: Cách dịch chính giữ thuật ngữ quen thuộc cho ân tứ trong 1 Cô-rinh-tô 12–14, còn chú thích bảo lưu khả năng hiểu theo nghĩa “các ngôn ngữ” mà không giải quyết thay cuộc tranh luận.
translation_notes:
  register: Văn phong tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Cấu trúc ba vế song song được giữ rõ; “sẽ ngưng” được phân biệt với “sẽ bị loại bỏ” để phản ánh hai động từ Hy Lạp khác nhau.
