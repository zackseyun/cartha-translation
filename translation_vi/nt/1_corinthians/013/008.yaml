revisions:
- from: Tình yêu thương không bao giờ thất bại[a]. Còn các lời tiên tri sẽ bị loại bỏ; các tiếng lạ[b] sẽ ngưng; sự hiểu biết sẽ bị loại bỏ[c].
  to: Tình yêu thương không bao giờ thất bại[a]. Còn các lời tiên tri thì sẽ bị bãi bỏ; các tiếng lạ thì sẽ chấm dứt; sự hiểu biết thì sẽ bị bãi bỏ[c].
  rationale: 'Bản sửa giữ nguyên nghĩa và các bất định cần bảo lưu của câu Hy Lạp: tình yêu không thất bại; lời tiên tri và sự hiểu biết cùng chịu tác động của καταργέω; còn các tiếng lạ được mô tả bằng παύω. Sửa chú thích a để tránh hàm ý đạo đức không có trong nguyên ngữ, và điều chỉnh hai động từ cho tiếng Việt chuẩn, tự nhiên hơn.'
  reviewer_model: gpt-5.6-terra
