id: 1CO.13.3
reference: 1 Corinthians 13:3
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸂καὶ ἐὰν⸃ ψωμίσω πάντα τὰ ὑπάρχοντά μου, ⸄καὶ ἐὰν⸃ παραδῶ τὸ σῶμά μου, ἵνα ⸀καυθήσομαι, ἀγάπην δὲ μὴ ἔχω, οὐδὲν ὠφελοῦμαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/003.yaml
  text: And if I give away all my possessions[a], and if I hand over my body so that I may be burned, but do not have love, I gain nothing.
translation:
  language: vi
  text: Dù tôi đem phân phát tất cả tài sản mình có, dù tôi nộp thân thể mình để bị thiêu[a], nhưng không có tình yêu thương, thì tôi chẳng được ích lợi gì.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Một số thủ bản chép: “để tôi có thể khoe mình” thay vì “để bị thiêu.”'
    reason: textual_variant
lexical_decisions:
- source_word: ψωμίσω
  choice: đem phân phát
  rationale: Động từ chỉ việc phân phát từng phần, trong ngữ cảnh này là đem của cải ban cho người khác. “Đem phân phát” tự nhiên và giữ được sắc thái chủ động phân chia toàn bộ tài sản.
- source_word: πάντα τὰ ὑπάρχοντά μου
  choice: tất cả tài sản mình có
  rationale: Cụm từ chỉ toàn bộ của cải hay vật sở hữu. Cách dịch này rõ ràng, hiện đại và cụ thể.
- source_word: παραδῶ
  choice: nộp
  rationale: “Nộp” giữ ý trao thân mình vào quyền lực hay sự xử lý của người khác, mà không diễn giải thêm thành “hy sinh”.
- source_word: τὸ σῶμά μου
  choice: thân thể mình
  rationale: Dịch trực tiếp danh ngữ cụ thể, với đại từ phản thân tự nhiên trong tiếng Việt.
- source_word: ἵνα καυθήσομαι
  choice: để bị thiêu
  rationale: Theo bản SBLGNT, động từ ở thể bị động thuộc καίω, nghĩa là bị đốt hoặc bị thiêu. Cách dịch gọn này giữ quan hệ mục đích/kết quả của ἵνα.
- source_word: ἀγάπην
  choice: tình yêu thương
  rationale: “Tình yêu thương” là cách diễn đạt tự nhiên, trang trọng trong tiếng Việt và phù hợp với phạm vi ý nghĩa của ἀγάπη trong đoạn này.
- source_word: οὐδὲν ὠφελοῦμαι
  choice: tôi chẳng được ích lợi gì
  rationale: 'Giữ sắc thái thụ hưởng của động từ: người nói không nhận được bất cứ lợi ích nào.'
- source_word: καὶ ἐὰν ... καὶ ἐὰν
  choice: Dù ... dù
  rationale: Cấu trúc lặp lại bảo toàn hai giả định tăng tiến của Phao-lô; “dù” diễn đạt tự nhiên lực nhượng bộ của các mệnh đề giả định trong văn cảnh.
theological_decisions:
- issue: Dị bản trong mệnh đề chỉ mục đích/kết quả
  choice: Theo καυθήσομαι của SBLGNT và dịch “để bị thiêu” trong chính văn.
  alternative: καυχήσωμαι — “để tôi có thể khoe mình”
  rationale: Bản nguồn được chỉ định là SBLGNT nên chính văn theo cách đọc của bản này. Dị bản làm thay đổi đáng kể ý nghĩa, từ chịu thiêu đốt sang khoe mình, vì vậy được ghi minh bạch trong chú thích.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Giữ nhịp tăng tiến của hai mệnh đề giả định và tránh diễn giải hành động nộp thân thể thành một học thuyết cụ thể.
