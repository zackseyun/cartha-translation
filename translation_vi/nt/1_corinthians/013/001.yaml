  source_fidelity: 'Bản nháp truyền đạt đúng đối chiếu giữa tiếng của loài người và thiên sứ, điều kiện thiếu ἀγάπη, và kết quả trở nên âm thanh vô nghĩa. Tuy nhiên, “Dù ... nói được” nghiêng về nhượng bộ và khả năng, trong khi Ἐὰν ... λαλῶ là điều kiện giả định đơn giản: “Nếu ... nói”. “Đồng vang tiếng” bám chữ nhưng không tự nhiên và chưa diễn đạt rõ hình ảnh vật bằng đồng đang phát âm thanh.'
