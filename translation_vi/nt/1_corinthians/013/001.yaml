id: 1CO.13.1
reference: 1 Corinthians 13:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἐὰν ταῖς γλώσσαις τῶν ἀνθρώπων λαλῶ καὶ τῶν ἀγγέλων, ἀγάπην δὲ μὴ ἔχω, γέγονα χαλκὸς ἠχῶν ἢ κύμβαλον ἀλαλάζον.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/001.yaml
  text: If I speak in the tongues of men and of angels[a], but do not have love[c][b], I have become sounding bronze or a clashing cymbal.
translation:
  language: vi
  text: Nếu tôi nói bằng các thứ tiếng của loài người và của các thiên sứ[a], nhưng không có tình yêu thương, thì tôi đã trở thành một miếng đồng vang lên hoặc một chiếc chũm chọe inh ỏi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Các thứ tiếng” cũng có thể dịch là “các ngôn ngữ.” Câu này không xác định tiếng của thiên sứ là ngôn ngữ thiên giới theo nghĩa đen hay là cách nói cường điệu.
    reason: lexical_and_interpretive_ambiguity
lexical_decisions:
- source_word: Ἐὰν
  choice: Dù
  rationale: Trong chuỗi giả định cường điệu của đoạn văn, “dù” diễn đạt tự nhiên sắc thái giả thiết nhượng bộ (“dù cho”), phù hợp với lối lập luận của Phao-lô.
- source_word: ταῖς γλώσσαις
  choice: các thứ tiếng
  rationale: γλῶσσα có thể chỉ lưỡi hoặc ngôn ngữ/tiếng nói. “Các thứ tiếng” tự nhiên trong tiếng Việt, đồng thời vẫn giữ được liên hệ với cuộc bàn luận về hiện tượng nói các thứ tiếng tại Cô-rinh-tô.
- source_word: τῶν ἀνθρώπων
  choice: của loài người
  rationale: Ở đây ἄνθρωποι chỉ toàn thể con người, đối lập với các thiên sứ, chứ không riêng nam giới.
- source_word: λαλῶ
  choice: tôi nói được
  rationale: Cách diễn đạt này tự nhiên trong tiếng Việt khi nói về khả năng sử dụng các thứ tiếng; không hàm ý giải quyết bản chất của hiện tượng ấy.
- source_word: τῶν ἀγγέλων
  choice: của các thiên sứ
  rationale: Sự đối lập với loài người và cấp độ tăng tiến của câu cho thấy ἄγγελοι ở đây là các hữu thể thiên giới, không phải sứ giả loài người.
- source_word: ἀγάπην
  choice: tình yêu thương
  rationale: “Tình yêu thương” là cách nói hiện đại, trang trọng và dễ hiểu cho ἀγάπη trong văn cảnh này.
- source_word: δὲ μὴ ἔχω
  choice: nhưng không có
  rationale: Giữ rõ sự tương phản do δέ tạo nên và ý sở hữu của ἔχω.
- source_word: γέγονα
  choice: tôi đã trở thành
  rationale: Giữ sắc thái hoàn thành-kết quả của thì hoàn thành Hy Lạp thay vì giản lược thành “tôi chỉ là”.
- source_word: χαλκὸς ἠχῶν
  choice: đồng vang tiếng
  rationale: Bám sát hình ảnh kim loại phát ra âm thanh mà không tự xác định đó là một nhạc cụ cụ thể; “đồng” phù hợp với phạm vi nghĩa của χαλκός.
- source_word: κύμβαλον ἀλαλάζον
  choice: chũm chọe inh ỏi
  rationale: κύμβαλον là chũm chọe; “inh ỏi” truyền đạt âm thanh lớn, chói và ồn ào của ἀλαλάζον.
theological_decisions:
- issue: Ý nghĩa của “các thứ tiếng của loài người và của các thiên sứ”
  choice: Giữ nguyên sự đối chiếu tu từ giữa tiếng của loài người và tiếng của thiên sứ.
  alternative: Hiểu là các ngôn ngữ thiên giới có thật, hoặc là cách nói cường điệu về khả năng diễn đạt cao nhất.
  rationale: Bản văn không buộc người dịch quyết định đây là ngôn ngữ thiên giới theo nghĩa đen hay phép cường điệu; bản dịch giữ nguyên độ mở ấy.
- issue: Phạm vi của ἀνθρώπων
  choice: loài người
  alternative: đàn ông; người ta
  rationale: Trong câu này, từ này chỉ nhân loại đối lập với thiên sứ, không xác định giới tính.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “loài người” để thể hiện nghĩa bao quát; giữ hình ảnh “đồng vang tiếng” thay vì thêm một nhạc cụ không có trong nguyên văn.
