  terminology: “Các thứ tiếng”, “loài người”, “các thiên sứ”, và “tình yêu thương” đều phù hợp ngữ vực Kinh Thánh tiếng Việt hiện đại. “Chũm chọe inh ỏi” diễn đạt tốt κύμβαλον ἀλαλάζον. Chú thích cần tiếp tục bảo lưu việc không quyết định “tiếng của thiên sứ” là nghĩa đen hay cường điệu.
