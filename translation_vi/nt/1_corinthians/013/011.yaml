id: 1CO.13.11
reference: 1 Corinthians 13:11
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὅτε ἤμην νήπιος, ⸂ἐλάλουν ὡς νήπιος, ἐφρόνουν ὡς νήπιος, ἐλογιζόμην ὡς νήπιος⸃· ⸀ὅτε γέγονα ἀνήρ, κατήργηκα τὰ τοῦ νηπίου.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/011.yaml
  text: When I was a child[a], I spoke like a child, I thought like a child, I reasoned like a child. When I became a man, I put away the things of the child.
translation:
  language: vi
  text: Khi còn là trẻ thơ, tôi nói như trẻ thơ, suy nghĩ như trẻ thơ, lý luận như trẻ thơ. Khi đã trở thành người đàn ông, tôi từ bỏ những điều thuộc về trẻ thơ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cụm “những điều thuộc về trẻ thơ” dịch sát cụm Hy Lạp, nghĩa là “những điều của một đứa trẻ.” Cũng có thể dịch là “những điều trẻ thơ” hoặc “cách thức của trẻ thơ.”
    reason: Bảo lưu các khả năng diễn đạt của τὰ τοῦ νηπίου mà không thêm một cách dịch tiếng Việt không tự nhiên.
lexical_decisions:
- source_word: νήπιος
  choice: trẻ thơ
  rationale: Chỉ một đứa trẻ còn nhỏ và có thể hàm ý sự non nớt; “trẻ thơ” tự nhiên trong tiếng Việt và giữ được sự đối lập với người trưởng thành.
- source_word: ἐλάλουν
  choice: tôi nói
  rationale: Diễn đạt trực tiếp hành động nói năng và giữ nhịp điệp cấu trúc của nguyên văn.
- source_word: ἐφρόνουν
  choice: suy nghĩ
  rationale: Trong chuỗi ba động từ, từ này diễn tả cách suy nghĩ hoặc tâm thức; “suy nghĩ” ngắn gọn và tự nhiên.
- source_word: ἐλογιζόμην
  choice: lý luận
  rationale: Phân biệt với ἐφρόνουν bằng sắc thái cân nhắc, suy luận có lý lẽ.
- source_word: γέγονα
  choice: đã trở thành
  rationale: Thể hoàn thành nhấn mạnh việc bước vào trạng thái trưởng thành; “đã trở thành” vừa tự nhiên vừa giữ sắc thái kết quả.
- source_word: ἀνήρ
  choice: người trưởng thành
  rationale: Trong thế đối lập với νήπιος, trọng tâm là sự trưởng thành. Cách dịch này truyền đạt phép so sánh tự nhiên trong tiếng Việt mà không biến giới tính nam thành điểm nhấn thần học.
- source_word: κατήργηκα
  choice: tôi từ bỏ
  rationale: Trong hình ảnh trưởng thành, động từ mang nghĩa làm cho những điều trẻ thơ không còn chi phối hay được tiếp tục; “từ bỏ” rõ ràng và tự nhiên.
- source_word: τὰ τοῦ νηπίου
  choice: những điều thuộc về trẻ thơ
  rationale: Giữ cấu trúc khái quát, gần nghĩa đen “những điều của trẻ thơ,” mà không thu hẹp vào một loại hành vi cụ thể.
theological_decisions:
- issue: Sự đối lập có giới tính trong ἀνήρ
  choice: người trưởng thành
  alternative: người đàn ông
  rationale: ἀνήρ có thể chỉ người đàn ông, nhưng tại đây nó đứng đối lập với νήπιος trong phép minh họa về quá trình từ non nớt đến trưởng thành. “Người trưởng thành” giữ trọng tâm ngữ cảnh; chú thích bảo lưu cách hiểu sát hình thức là “người đàn ông.”
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Phép lặp “như trẻ thơ” được giữ để tái hiện nhịp tu từ của câu Hy Lạp; “suy nghĩ” và “lý luận” được phân biệt để phản ánh hai động từ gần nghĩa.
