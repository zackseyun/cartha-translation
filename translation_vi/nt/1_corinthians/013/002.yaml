id: 1CO.13.2
reference: 1 Corinthians 13:2
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸂καὶ ἐὰν⸃ ἔχω προφητείαν καὶ εἰδῶ τὰ μυστήρια πάντα καὶ πᾶσαν τὴν γνῶσιν, ⸄καὶ ἐὰν⸅ ἔχω πᾶσαν τὴν πίστιν ὥστε ὄρη ⸀μεθιστάναι, ἀγάπην δὲ μὴ ἔχω, οὐθέν εἰμι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/002.yaml
  text: And if I have prophecy and understand all mysteries and all knowledge[a], and if I have all faith so as to move mountains, but do not have love, I am nothing.
translation:
  language: vi
  text: Dù tôi có ơn nói tiên tri, hiểu biết mọi mầu nhiệm và mọi tri thức, dù tôi có trọn cả đức tin[a] đến nỗi dời được núi, nhưng không có tình yêu thương, thì tôi chẳng là gì cả.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch “lòng tin”; ít có khả năng hơn: “sự trung tín”. Từ Hy Lạp có nhiều nét nghĩa, nhưng ở đây có lẽ chỉ đức tin phi thường.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προφητείαν
  choice: ơn nói tiên tri
  rationale: Trong mạch văn về các ân tứ, cách diễn đạt này tự nhiên trong tiếng Việt và chỉ rõ đây là khả năng nói lời tiên tri, nhưng không biến nó thành một chức vụ.
- source_word: εἰδῶ
  choice: hiểu biết
  rationale: Diễn đạt sự lĩnh hội các mầu nhiệm, đồng thời tránh lặp nguyên dạng danh từ “tri thức” dùng cho γνῶσις.
- source_word: μυστήρια
  choice: mầu nhiệm
  rationale: Giữ sắc thái thần học của thuật ngữ Phao-lô về những điều kín giấu thuộc Đức Chúa Trời, thay vì giản lược thành các bí mật thông thường.
- source_word: γνῶσιν
  choice: tri thức
  rationale: Giữ danh từ riêng biệt với động từ εἰδῶ và truyền đạt phạm vi hiểu biết được nhấn mạnh bằng πᾶσαν.
- source_word: πᾶσαν τὴν πίστιν
  choice: trọn cả đức tin
  rationale: Giữ nghĩa “đức tin” của πίστις và sức nhấn mạnh toàn diện của πᾶσαν; trong ngữ cảnh, đây là đức tin phi thường có thể thực hiện điều kỳ diệu, không nhất thiết là thuật ngữ kỹ thuật chỉ đức tin cứu rỗi.
- source_word: ὥστε ὄρη μεθιστάναι
  choice: đến nỗi dời được núi
  rationale: Giữ nguyên hình ảnh cường điệu và quan hệ kết quả của cấu trúc Hy Lạp bằng lối nói tự nhiên trong tiếng Việt.
- source_word: ἀγάπην
  choice: tình yêu thương
  rationale: Diễn đạt ἀγάπη bằng cách nói phổ thông, trang trọng, không thu hẹp nghĩa vào lòng từ thiện.
- source_word: οὐθέν εἰμι
  choice: tôi chẳng là gì cả
  rationale: Giữ sự phủ định mạnh và trực tiếp của Phao-lô mà không thêm cách giải thích như “không có giá trị”.
theological_decisions:
- issue: Nghĩa của πίστις trong bối cảnh khả năng dời núi
  choice: đức tin
  alternative: lòng tin; sự trung tín
  rationale: Cú pháp và hình ảnh dời núi nghiêng về một đức tin phi thường. “Sự trung tín” thuộc phạm vi nghĩa có thể có của πίστις nói chung nhưng ít phù hợp hơn tại đây.
- issue: Ý nghĩa của οὐθέν εἰμι
  choice: tôi chẳng là gì cả
  alternative: tôi không có giá trị gì; tôi chẳng đáng kể gì
  rationale: Bản dịch trực tiếp bảo toàn lời tự phủ định quyết liệt mà không giải quyết thay người đọc liệu câu này nói về giá trị, địa vị hay hiệu quả thuộc linh.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Cấu trúc hai vế “dù… dù… nhưng…” giữ nhịp điệu và thế tương phản của câu Hy Lạp. Dùng “ơn nói tiên tri” theo ngữ cảnh ân tứ, “mầu nhiệm” theo văn phong thần học quen thuộc, và “tình yêu thương” để tránh sắc thái lãng mạn quá hẹp.
