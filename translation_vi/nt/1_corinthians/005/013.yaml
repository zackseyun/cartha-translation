  terminology: “Đức Chúa Trời,” “xét đoán,” và “anh em” nhất quán với văn phong Kinh Thánh Tin Lành phổ biến. Bản dịch không thêm thuật ngữ thủ tục như “khai trừ,” nên giữ được mức độ diễn đạt của nguyên văn.
