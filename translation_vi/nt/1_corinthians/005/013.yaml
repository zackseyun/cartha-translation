id: 1CO.5.13
reference: 1 Corinthians 5:13
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τοὺς δὲ ἔξω ὁ θεὸς ⸀κρίνει; ⸀ἐξάρατε τὸν πονηρὸν ἐξ ὑμῶν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/013.yaml
  text: But God judges those outside[c][b][a]. Remove the evil person from among yourselves.
translation:
  language: vi
  text: Nhưng Đức Chúa Trời xét đoán những người ở ngoài.[a][b] Hãy loại bỏ kẻ gian ác khỏi giữa anh em.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “những người ngoài cộng đồng.”'
    reason: lexical_alternative
  - marker: b
    text: Động từ Hy Lạp ở thì hiện tại (“xét đoán”), dù theo ngữ cảnh một số bản dịch dùng “sẽ xét đoán.”
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “Hãy đuổi kẻ gian ác ra khỏi giữa anh em.” Cách diễn đạt này vang vọng những công thức thanh trừ điều ác trong Phục Truyền Luật Lệ Ký.'
    reason: cross_reference
lexical_decisions:
- source_word: τοὺς ... ἔξω
  choice: những người ở ngoài
  rationale: Cụm trạng từ có mạo từ được dùng như danh từ, chỉ những người ở ngoài cộng đồng Hội Thánh. Cách dịch này tự nhiên và giữ nguyên ý nghĩa tương quan mà không diễn giải quá mức.
- source_word: δὲ
  choice: Nhưng
  rationale: δέ biểu thị sự tương phản nhẹ với việc xét đoán những người ở trong cộng đồng ở câu trước.
- source_word: κρίνει
  choice: xét đoán
  rationale: Động từ ở thì hiện tại, thích hợp với một phát biểu mang tính khái quát về hành động của Đức Chúa Trời; không chuyển thành thì tương lai khi văn bản Hy Lạp không bắt buộc.
- source_word: ἐξάρατε
  choice: Hãy loại bỏ
  rationale: Mệnh lệnh aorist đòi hỏi hành động dứt khoát. 'Loại bỏ' rõ ràng, tự nhiên, và không thêm thủ tục kỷ luật không có trong câu.
- source_word: τὸν πονηρὸν
  choice: kẻ gian ác
  rationale: Cụm danh từ hóa số ít chỉ người phạm lỗi cụ thể trong ngữ cảnh, đồng thời vang vọng công thức thanh trừ trong Phục Truyền Luật Lệ Ký. 'Kẻ gian ác' giữ sắc thái đạo đức và không buộc tiếng Việt phải nêu giới tính dù ngữ cảnh nói đến một người nam.
- source_word: ἐξ ὑμῶν αὐτῶν
  choice: khỏi giữa anh em
  rationale: Thành ngữ chỉ việc loại một người ra khỏi cộng đồng. 'Khỏi giữa anh em' rõ nghĩa, trang trọng và phù hợp với cách xưng hô cộng đồng trong thư.
theological_decisions:
- issue: Bản chất của mệnh lệnh về kỷ luật trong cộng đồng
  choice: Câu này truyền cho cộng đồng loại người phạm tội khỏi giữa họ, còn việc xét đoán người ngoài thuộc về Đức Chúa Trời.
  alternative: Có thể hiểu rộng hơn là loại bỏ điều ác khỏi cộng đồng mà không xác định một hình thức khai trừ chính thức.
  rationale: Ngữ cảnh 1 Cô-rinh-tô 5 nói đến một người cụ thể trong Hội Thánh và đối chiếu trách nhiệm của cộng đồng đối với người ở trong với quyền xét đoán của Đức Chúa Trời đối với người ở ngoài. Bản dịch không đưa vào thuật ngữ giáo hội học về thủ tục mà nguyên văn không có.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “Đức Chúa Trời” theo văn phong Kinh Thánh Tin Lành phổ biến; “anh em” biểu thị cộng đồng người nhận thư. Trật tự dấu chú thích được đặt ngay sau phần văn bản liên quan.
