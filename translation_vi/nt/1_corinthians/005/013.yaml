  source_fidelity: 'Bản dịch phản ánh sát cấu trúc và ý nghĩa của nguyên văn: δέ được chuyển là “Nhưng”; τοὺς ἔξω là “những người ở ngoài”; κρίνει giữ thì hiện tại qua “xét đoán”; và mệnh lệnh aorist ἐξάρατε được diễn đạt dứt khoát bằng “Hãy loại bỏ.” “Kẻ gian ác” chuyển đúng τὸν πονηρόν, vừa chỉ người cụ thể trong ngữ cảnh vừa không áp đặt giới tính bằng ngữ pháp tiếng Việt.'
