review_pass:
  verdict: revise
  source_fidelity: Bản dịch giữ được mạch suy luận của ὥστε, lời khích lệ ở thể giả định («chúng ta hãy»), và hình ảnh men/bánh không men trong ngữ cảnh lễ Vượt Qua. Tuy nhiên, «không với men cũ» không tự nhiên trong tiếng Việt; «không dùng men cũ» diễn đạt rõ quan hệ ἐν trong ẩn dụ mà không thêm ý. «Ác ý» là cách tương đương trực tiếp, tự nhiên hơn cho κακία trong cặp với πονηρία.
  naturalness: Cấu trúc đối lập «không dùng... cũng không dùng... nhưng dùng...» tự nhiên, rõ ràng và vẫn phản chiếu ba vế của nguyên văn. «Lòng chân thành và lẽ thật» là một cặp từ quen thuộc, trang trọng vừa phải, và tránh sắc thái quá trừu tượng của «chân lý» trong hình ảnh đạo đức của câu.
  terminology: Giữ «men», «bánh không men» và «giữ lễ» để bảo toàn hình ảnh lễ Vượt Qua. Đổi «sự hiểm độc» thành «ác ý» để phản ánh κακία (malice/ill will) rõ hơn; giữ «gian ác» cho πονηρία. Chuyển vị trí chú thích b đến ngay sau «bánh không men», là cụm được chú thích; bản nháp hiện đặt neo ở cuối câu dù nội dung chú thích giải thích từ «bánh» được bổ sung.
  issues:
  - severity: medium
    issue: Cụm «không với men cũ» chưa tự nhiên trong tiếng Việt chuẩn hiện đại.
    rationale: Tuy có thể nhận ra cấu trúc sát chữ từ ἐν, cách nói này thiếu động từ chi phối rõ ràng. «Không dùng men cũ» giữ nguyên ẩn dụ và ý loại trừ của nguyên văn.
  - severity: low
    issue: «Sự hiểm độc» không phải là lựa chọn tự nhiên và trực tiếp nhất cho κακία trong ngữ cảnh này.
    rationale: κακία ở đây chỉ ác ý/tính xấu; «ác ý» phân biệt gọn và rõ với «gian ác» cho πονηρία.
  - severity: medium
    issue: Neo chú thích b chưa gắn với cụm từ mà chú thích giải thích.
    rationale: Chú thích b nói về việc bổ sung «bánh», nên cần đặt ngay sau «bánh không men», thay vì ở cuối câu.
