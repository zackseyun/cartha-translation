id: 1CO.5.8
reference: 1 Corinthians 5:8
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὥστε ἑορτάζωμεν, μὴ ἐν ζύμῃ παλαιᾷ μηδὲ ἐν ζύμῃ κακίας καὶ πονηρίας, ἀλλ’ ἐν ἀζύμοις εἰλικρινείας καὶ ἀληθείας.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/008.yaml
  text: Therefore let us keep the feast[a], not with old leaven, nor with the leaven of malice and wickedness[b], but with the unleavened bread of sincerity and truth.
translation:
  language: vi
  text: Vậy, chúng ta hãy giữ lễ[a], không dùng men cũ, cũng không dùng men của ác ý và gian ác, nhưng dùng bánh không men[b] của lòng chân thành và lẽ thật.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “chúng ta hãy ăn mừng” hoặc “chúng ta hãy cử hành lễ.” Tiếng Hy Lạp tiếp tục hình ảnh lễ Vượt Qua từ câu trước.'
    reason: lexical_alternative
  - marker: b
    text: 'Tiếng Hy Lạp nói sát nghĩa: “với những thứ không men của lòng chân thành và lẽ thật”; từ “bánh” được bổ sung để làm rõ hình ảnh lễ Vượt Qua.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: Vậy
  rationale: Đánh dấu kết luận suy ra từ lập luận trước đó; “Vậy” tự nhiên và giữ được lực suy luận.
- source_word: ἑορτάζωμεν
  choice: chúng ta hãy giữ lễ
  rationale: Thể giả định hiện tại mang ý khích lệ chung, “chúng ta hãy...”; “giữ lễ” bảo toàn hình ảnh lễ Vượt Qua từ câu trước.
- source_word: ζύμῃ παλαιᾷ
  choice: với men cũ
  rationale: “Men” là cách gọi tự nhiên trong tiếng Việt và giữ nguyên ẩn dụ Kinh Thánh; giới từ ἐν được diễn đạt bằng “với” cho phù hợp ngữ cảnh.
- source_word: κακίας
  choice: sự hiểm độc
  rationale: Diễn tả tính xấu hoặc ác ý hướng đến người khác, đồng thời phân biệt với πονηρίας.
- source_word: πονηρίας
  choice: gian ác
  rationale: Diễn tả sự xấu xa về đạo đức; kết hợp tự nhiên với “hiểm độc” mà không đồng nhất hai danh từ.
- source_word: ἀλλ’ ἐν ἀζύμοις
  choice: nhưng với bánh không men
  rationale: ἀζύμοις có nghĩa sát là “những thứ không men”; bổ sung “bánh” theo ngữ cảnh lễ Vượt Qua để hình ảnh rõ ràng trong tiếng Việt.
- source_word: εἰλικρινείας
  choice: lòng chân thành
  rationale: Chuyển tải sự thuần nhất, không giả dối; thêm “lòng” giúp cụm danh từ tự nhiên trong tiếng Việt.
- source_word: ἀληθείας
  choice: chân lý
  rationale: Giữ ý nghĩa rộng của ἀλήθεια và tạo cặp danh từ tự nhiên với “lòng chân thành”.
theological_decisions:
- issue: Hình ảnh lễ Vượt Qua trong lời khích lệ của Phao-lô
  choice: Dịch ἑορτάζωμεν là “hãy giữ lễ” và ἀζύμοις là “bánh không men”.
  alternative: “hãy ăn mừng” hoặc “hãy cử hành lễ”; “những điều không men”
  rationale: Ngữ cảnh ngay trước đó gọi Đấng Christ là sinh tế Vượt Qua, nên cách dịch này giữ mạch hình ảnh lễ hội và bánh không men thay vì biến câu thành một lời khuyên đạo đức chung chung.
- issue: ἀζύμοις là tính từ được dùng như danh từ
  choice: Bổ sung danh từ “bánh” trong câu chính và ghi chú nghĩa sát.
  alternative: Dịch sát là “những thứ không men”
  rationale: “Bánh không men” được ngữ cảnh lễ Vượt Qua gợi rõ, nhưng vì từ “bánh” không hiện diện trực tiếp trong tiếng Hy Lạp nên cần minh bạch bằng chú thích.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “men” và “bánh không men” để duy trì hình ảnh xuyên suốt; cấu trúc lặp “không với... cũng không với... nhưng với...” phản ánh sự đối lập của nguyên văn.
