  rationale: Bản sửa chỉ điều chỉnh cách diễn đạt tiếng Việt, lựa chọn từ cho hai danh từ đạo đức, và vị trí neo chú thích. Không thay đổi ý nghĩa, lực khích lệ, hay hình ảnh lễ Vượt Qua/bánh không men của nguyên văn.
