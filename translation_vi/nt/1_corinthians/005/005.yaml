source:
  edition: SBLGNT
  text: παραδοῦναι τὸν τοιοῦτον τῷ Σατανᾷ εἰς ὄλεθρον τῆς σαρκός, ἵνα τὸ πνεῦμα σωθῇ ἐν τῇ ἡμέρᾳ τοῦ ⸀κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/005.yaml
  text: to hand such a man over to Satan for the destruction of the flesh[b][a], so that the spirit may be saved in the day of the Lord.
translation:
  language: vi
  text: giao một người như thế cho Sa-tan, nhằm hủy diệt xác thịt, hầu cho linh hồn được cứu trong ngày của Chúa.[b][a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “nhằm sự hủy hoại xác thịt.” Cụm từ này có thể chỉ sự đoán phạt nghiêm khắc trên thân thể, hoặc, theo nghĩa hình tượng hơn, sự tiêu diệt khuynh hướng tội lỗi thuộc xác thịt của người ấy.'
    reason: lexical_alternative
  - marker: b
    text: Một số thủ bản chép “của Chúa chúng ta là Đức Chúa Giê-xu” hoặc “của Chúa Giê-xu” thay vì chỉ chép “của Chúa”.
    reason: textual_variant
lexical_decisions:
- source_word: παραδοῦναι
  choice: giao ... cho
  rationale: Động từ nguyên mẫu aorist diễn tả hành động Phao-lô chỉ dẫn hội chúng thực hiện. “Giao ... cho” tự nhiên trong tiếng Việt và giữ được sắc thái trao một người vào quyền xử lý của bên khác.
- source_word: τὸν τοιοῦτον
  choice: một người như thế
  rationale: Cụm từ chỉ chính người phạm tội đã được nói đến, đồng thời vẫn mang sắc thái phân loại; cách dịch này giữ số ít và không làm câu quá cổ.
- source_word: Σατανᾷ
  choice: Sa-tan
  rationale: Phiên âm tên riêng theo cách dùng Kinh Thánh quen thuộc trong tiếng Việt.
- source_word: εἰς ὄλεθρον τῆς σαρκός
  choice: để xác thịt bị hủy diệt
  rationale: ὄλεθρος có thể chỉ sự hủy diệt hoặc suy tàn, còn σάρξ ở đây có thể được hiểu theo nghĩa thân thể hoặc khuynh hướng thuộc xác thịt. Cách dịch chính giữ sức nặng và sự mơ hồ của nguyên ngữ mà không xác định cơ chế hay phạm vi của sự phán xét.
- source_word: ἵνα
  choice: hầu cho
  rationale: Diễn đạt mục đích hoặc kết quả dự kiến của mệnh đề, với văn phong trang trọng nhưng vẫn dễ hiểu.
- source_word: τὸ πνεῦμα
  choice: tâm linh
  rationale: Giữ danh từ không kèm đại từ sở hữu vì tiếng Hy Lạp không nói rõ “tâm linh của người ấy”. “Tâm linh” phân biệt với thân thể và phù hợp với ngữ cảnh cứu rỗi.
- source_word: σωθῇ
  choice: được cứu
  rationale: Giữ thể bị động và sắc thái cứu rỗi của động từ aorist subjunctive, không giải thích thêm phương cách được cứu.
- source_word: ἐν τῇ ἡμέρᾳ τοῦ κυρίου
  choice: trong ngày của Chúa
  rationale: Dịch sát cụm từ chỉ thời điểm cánh chung và không mở rộng κύριος thành “Chúa Giê-xu” khi bản SBLGNT chỉ có “Chúa”.
theological_decisions:
- issue: Ý nghĩa của “xác thịt bị hủy diệt”
  choice: Giữ cụm từ mơ hồ trong chính văn.
  alternative: Sự đoán phạt nghiêm khắc trên thân thể, thậm chí cái chết; hoặc sự tiêu diệt khuynh hướng tội lỗi thuộc xác thịt.
  rationale: Nguyên ngữ không buộc phải chọn duy nhất nghĩa thể chất hay nghĩa đạo đức–tâm linh. Chính văn vì thế không âm thầm giải quyết sự căng thẳng này.
- issue: Đối tượng được gọi là “tâm linh”
  choice: Dịch “tâm linh” mà không thêm “của người ấy”.
  alternative: “tâm linh của người ấy”
  rationale: Ngữ cảnh nhiều khả năng nói đến sự cứu rỗi cuối cùng của người phạm tội, nhưng nguyên văn không có đại từ sở hữu; bản dịch giữ sự dè dặt ấy.
- issue: Cụm từ cánh chung “ngày của Chúa”
  choice: Dịch đúng bản văn SBLGNT là “ngày của Chúa”.
  alternative: “ngày của Chúa Giê-xu” hoặc “ngày của Chúa chúng ta là Đức Chúa Giê-xu”
  rationale: Các cách đọc dài hơn có chứng cứ thủ bản, nhưng không thuộc chính văn nguồn được cung cấp; chúng được nêu trong chú thích thay vì đưa vào chính văn.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Bản dịch tránh thêm đại từ sở hữu không có trong nguyên văn, giữ thuật ngữ “xác thịt” để bảo toàn sự mơ hồ thần học, và dùng “Sa-tan”, “Chúa” theo lối gọi quen thuộc trong Kinh Thánh tiếng Việt.
