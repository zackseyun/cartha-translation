revisions:
- from: giao một người như thế cho Sa-tan để xác thịt bị hủy diệt[a], hầu cho tâm linh được cứu trong ngày của Chúa.[b]
  to: giao một người như thế cho Sa-tan, nhằm hủy diệt xác thịt, hầu cho linh hồn được cứu trong ngày của Chúa.[b][a]
  rationale: Sửa duy nhất thuật ngữ «tâm linh» thành «linh hồn» vì đây là cách gọi tự nhiên hơn cho điều được cứu trong tiếng Việt. Điều này không thêm đại từ sở hữu và không nhằm phân xử chi tiết nhân học mà câu Hy Lạp để mở. Điều chỉnh «để xác thịt bị hủy diệt» thành «nhằm hủy diệt xác thịt» phản ánh trực tiếp hơn εἰς ὄλεθρον, vẫn không quyết định ai là tác nhân hay đó là hủy hoại thể chất hay đạo đức. Chú thích a được chỉnh cho nhất quán với chính văn; chú thích b giữ nguyên nội dung biến thể.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T18:11:00Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch giữ đúng các yếu tố chính: giao người phạm lỗi cho Sa-tan, ὄλεθρος τῆς σαρκός, mục đích cứu rỗi, và cách đọc ngắn «ngày của Chúa». Tuy nhiên, «tâm linh» trong tiếng Việt hiện đại thường chỉ lĩnh vực/đời sống thuộc linh hơn là thực thể hay phương diện của một người có thể «được cứu»; vì vậy nó không chuyển đạt tự nhiên τὸ πνεῦμα trong thế đối lập với σάρξ. «Linh hồn» là cách diễn đạt tự nhiên và dễ hiểu hơn trong ngữ cảnh này, dù không thêm sở hữu từ không có trong tiếng Hy Lạp.'
  naturalness: «Giao một người như thế cho Sa-tan» và «trong ngày của Chúa» đều rõ ràng, trang trọng, và phù hợp tiếng Việt Kinh Thánh hiện đại. Thay «tâm linh» bằng «linh hồn» làm mệnh đề mục đích tự nhiên hơn. «Nhằm hủy diệt xác thịt» diễn đạt trực tiếp cấu trúc εἰς ὄλεθρον mà không xác định bản chất của sự hủy diệt.
  terminology: Giữ «Sa-tan», «xác thịt», và «Chúa». «Xác thịt» bảo toàn sự mơ hồ giữa cách hiểu thân thể và khuynh hướng xác thịt. «Linh hồn» ở đây là quy ước tiếng Việt tự nhiên để chỉ πνεῦμα trong một câu nói về sự cứu rỗi; không thêm «của người ấy».
