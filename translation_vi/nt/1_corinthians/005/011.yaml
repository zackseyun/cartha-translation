id: 1CO.5.11
reference: 1 Corinthians 5:11
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: νῦν δὲ ἔγραψα ὑμῖν μὴ συναναμίγνυσθαι ἐάν τις ἀδελφὸς ὀνομαζόμενος ᾖ πόρνος ἢ πλεονέκτης ἢ εἰδωλολάτρης ἢ λοίδορος ἢ μέθυσος ἢ ἅρπαξ, τῷ τοιούτῳ μηδὲ συνεσθίειν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/011.yaml
  text: But now I wrote to you not to associate with anyone who is called a brother if he is sexually immoral or greedy or an idolater or abusive or a drunkard or a swindler—not even to eat with such a person.
translation:
  language: vi
  text: Nhưng nay tôi đã viết cho anh chị em rằng đừng giao du với bất cứ ai mang danh là anh em mà lại là người gian dâm, tham lam, thờ hình tượng, lăng mạ người khác, say sưa hoặc là kẻ cướp bóc; với người như thế, thậm chí cũng đừng ăn chung.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νῦν δὲ ἔγραψα
  choice: Nhưng nay tôi đã viết
  rationale: Giữ thể aorist của ἔγραψα theo nghĩa hành động viết đang được thực hiện trong thư, đồng thời diễn đạt tự nhiên trong tiếng Việt.
- source_word: μὴ συναναμίγνυσθαι
  choice: đừng giao du
  rationale: Diễn tả việc không kết giao hay duy trì quan hệ xã hội gần gũi, không nhất thiết là tuyệt đối tránh mọi tiếp xúc.
- source_word: ἀδελφὸς ὀνομαζόμενος
  choice: mang danh là anh em
  rationale: Giữ sắc thái người ấy được gọi hoặc tự nhận thuộc cộng đồng tín hữu, không quyết định thay văn bản tính chân thực của lời xưng nhận.
- source_word: πόρνος
  choice: gian dâm
  rationale: Chỉ người có hành vi vô luân về tình dục; cách nói ngắn gọn, trang trọng và quen thuộc trong văn cảnh Kinh Thánh.
- source_word: πλεονέκτης
  choice: tham lam
  rationale: Nêu lòng ham chiếm hữu quá mức, phù hợp nghĩa rộng của từ.
- source_word: λοίδορος
  choice: lăng mạ người khác
  rationale: Chỉ người thường xuyên sỉ nhục, chửi rủa hay phỉ báng; rõ nghĩa hơn từ đơn thuần 'ngược đãi'.
- source_word: μέθυσος
  choice: say sưa
  rationale: Chỉ người quen sống trong tình trạng say rượu, không chỉ một lần uống quá mức.
- source_word: ἅρπαξ
  choice: cướp đoạt
  rationale: Giữ ý người chiếm lấy tài sản của người khác bằng bóc lột, cưỡng đoạt hoặc thủ đoạn; không thu hẹp thành một loại gian lận cụ thể.
- source_word: μηδὲ συνεσθίειν
  choice: thậm chí cũng đừng ăn chung
  rationale: Bảo tồn lực nhấn mạnh của μηδέ và nghĩa trực tiếp của việc cùng ăn.
theological_decisions:
- issue: Địa vị của người được gọi là 'anh em'
  choice: mang danh là anh em
  alternative: được gọi là anh em
  rationale: Không khẳng định hoặc phủ nhận người ấy thật sự là tín hữu; giữ nguyên sự dè dặt của ὀνομαζόμενος.
- issue: Phạm vi của lệnh không ăn chung
  choice: Dịch trực tiếp, không chú giải là chỉ Tiệc Thánh hay mọi bữa ăn
  alternative: đừng dùng Tiệc Thánh với người như thế
  rationale: Nguyên văn nói συνεσθίειν, 'ăn cùng', và không tự nó giải quyết phạm vi nghi lễ hay xã hội; bản dịch giữ sự căng thẳng này.
- issue: Thời điểm của động từ 'viết'
  choice: tôi đã viết
  alternative: tôi đang viết
  rationale: Theo hình thức aorist ἔγραψα và lớp tham khảo tiếng Anh đã được thẩm định, trong khi vẫn có thể hiểu đây là aorist thư tín chỉ chính bức thư hiện tại.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng 'anh chị em' khi Phao-lô trực tiếp nói với toàn thể cộng đồng, nhưng giữ 'anh em' trong danh xưng ἀδελφός vì đây là thuật ngữ cộng đồng ở số ít. Chuỗi tội lỗi được trình bày song song, không thêm cách giải thích mang tính hệ phái.
