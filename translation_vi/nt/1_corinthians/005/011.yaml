revisions:
- from: Nhưng nay tôi đã viết cho anh chị em rằng đừng giao du với bất cứ ai mang danh là anh em mà lại gian dâm, tham lam, thờ thần tượng, lăng mạ người khác, say sưa hoặc cướp đoạt; với người như thế, thậm chí cũng đừng ăn chung.
  to: Nhưng nay tôi đã viết cho anh chị em rằng đừng giao du với bất cứ ai mang danh là anh em mà lại là người gian dâm, tham lam, thờ hình tượng, lăng mạ người khác, say sưa hoặc là kẻ cướp bóc; với người như thế, thậm chí cũng đừng ăn chung.
  rationale: Chỉ điều chỉnh hai mục trong danh sách để phản ánh chính xác hơn các danh từ chỉ người trong nguyên văn và để tiếng Việt hiện đại rõ, song song hơn. Không thay đổi phạm vi của lệnh, ý nghĩa “mang danh là anh em”, hay tính không xác định của việc “ăn chung”.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T18:10:58Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch theo sát cấu trúc và nội dung câu Hy Lạp: mệnh lệnh không giao du áp dụng cho người “mang danh là anh em”; danh sách sáu hạng người và mệnh lệnh nhấn mạnh “ngay cả không ăn cùng” đều được giữ. Tuy nhiên, “cướp đoạt” là động từ, trong khi ἅρπαξ là danh từ chỉ người; cần điều chỉnh để chuỗi mô tả con người song song và rõ nghĩa hơn.'
  naturalness: Văn phong nhìn chung tự nhiên, trang trọng, và “đừng giao du” phù hợp với μὴ συναναμίγνυσθαι. Việc dùng các danh ngữ chỉ người trong danh sách giúp câu tiếng Việt cân đối hơn.
  terminology: “Mang danh là anh em” bảo tồn sự dè dặt của ὀνομαζόμενος. “Thờ hình tượng” là cách gọi Kinh Thánh tiếng Việt rõ nghĩa hơn “thờ thần tượng”, vốn trong cách dùng hiện đại cũng có thể gợi việc hâm mộ người nổi tiếng. “Kẻ cướp bóc” diễn đạt ἅρπαξ như một người có đặc tính chiếm đoạt tài sản cách bất chính, không giới hạn vào một phương thức cụ thể.
  issues:
  - severity: low
    issue: “cướp đoạt” không song song về ngữ pháp với các mục khác trong danh sách.
    rationale: ἅρπαξ chỉ một người cướp bóc/chiếm đoạt, chứ không chỉ hành vi “cướp đoạt”; dùng danh ngữ chỉ người làm rõ đối tượng được mô tả.
  - severity: low
    issue: “thờ thần tượng” có thể mơ hồ trong tiếng Việt hiện đại.
    rationale: εἰδωλολάτρης là người thờ hình tượng/thờ ngẫu tượng; “thờ hình tượng” tránh liên tưởng hiện đại đến việc thần tượng hóa một nhân vật.
  revised_text: Nhưng nay tôi đã viết cho anh chị em rằng đừng giao du với bất cứ ai mang danh là anh em mà lại là người gian dâm, tham lam, thờ hình tượng, lăng mạ người khác, say sưa hoặc là kẻ cướp bóc; với người như thế, thậm chí cũng đừng ăn chung.
  revised_footnotes: []
