id: 1CO.5.10
reference: 1 Corinthians 5:10
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸀οὐ πάντως τοῖς πόρνοις τοῦ κόσμου τούτου ἢ τοῖς πλεονέκταις ⸀καὶ ἅρπαξιν ἢ εἰδωλολάτραις, ἐπεὶ ⸀ὠφείλετε ἄρα ἐκ τοῦ κόσμου ἐξελθεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/010.yaml
  text: not at all meaning the sexually immoral of this world[a], or the greedy and swindlers, or idolaters[b], since then you would have to go out of the world.
translation:
  language: vi
  text: Ý tôi không phải là nói đến việc tránh giao thiệp với những người vô luân về tình dục thuộc thế gian này, hoặc với những người tham lam, bóc lột, hay thờ thần tượng[a]; vì nếu vậy, anh em ắt phải ra khỏi thế gian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Bóc lột» cũng có thể dịch là «cướp» hoặc «tống tiền»; từ Hy Lạp ἅρπαξ có thể chỉ người chiếm đoạt của người khác bằng vũ lực hoặc bằng cách bóc lột.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ πάντως
  choice: không phải là hoàn toàn
  rationale: Cụm từ phủ định cách hiểu tuyệt đối về lời dặn trước đó. Cách dịch này giữ sắc thái đính chính, còn nội dung “tránh giao thiệp” được hiểu tiếp từ câu 9.
- source_word: πόρνοις
  choice: những người vô luân về tình dục
  rationale: Diễn đạt rõ nghĩa vô luân có tính chất tình dục của πόρνος, đồng thời tránh từ cổ hoặc cách nói có thể bị hiểu quá hẹp.
- source_word: τοῦ κόσμου τούτου
  choice: thuộc thế gian này
  rationale: κόσμος ở đây chỉ xã hội loài người bên ngoài cộng đồng Hội Thánh; “thế gian này” vừa sát nguyên ngữ vừa tự nhiên trong văn phong Kinh Thánh tiếng Việt.
- source_word: πλεονέκταις
  choice: những kẻ tham lam
  rationale: Từ này chỉ người luôn muốn chiếm hữu thêm, thường hàm ý trục lợi; “tham lam” là cách diễn đạt hiện đại và dễ hiểu.
- source_word: ἅρπαξιν
  choice: cướp đoạt
  rationale: ἅρπαξ chỉ người chiếm lấy của người khác bằng bạo lực hoặc bóc lột. “Cướp đoạt” giữ được độ rộng đó hơn một từ chỉ riêng hành vi lừa đảo.
- source_word: εἰδωλολάτραις
  choice: những kẻ thờ thần tượng
  rationale: Diễn đạt trực tiếp hành vi thờ các thần tượng, rõ nghĩa hơn danh từ Hán–Việt ít thông dụng.
- source_word: ἐπεὶ
  choice: vì nếu vậy
  rationale: Trong lập luận này, ἐπεί dẫn vào hệ quả phi thực tế nếu lời dặn bị hiểu theo nghĩa tuyệt đối.
- source_word: ὠφείλετε
  choice: anh em ắt phải
  rationale: Dạng động từ diễn tả sự bắt buộc thực tế trong kết luận giả định; “ắt phải” truyền đạt cả tính tất yếu lẫn sắc thái lập luận.
- source_word: ἐκ τοῦ κόσμου ἐξελθεῖν
  choice: ra khỏi thế gian
  rationale: 'Giữ hình ảnh mạnh và có chủ ý của nguyên văn: muốn tránh mọi người như thế thì phải rời khỏi chính thế gian.'
theological_decisions:
- issue: Phạm vi của việc tránh giao thiệp trong văn mạch
  choice: Phao-lô phủ nhận rằng lời dặn trước đó đòi tín hữu hoàn toàn tách khỏi những người phạm các tội này ở ngoài Hội Thánh.
  alternative: Phao-lô truyền phải rút khỏi mọi tiếp xúc xã hội với tất cả những người vô luân.
  rationale: Mệnh đề hệ quả “anh em ắt phải ra khỏi thế gian” cho thấy ông đang bác bỏ cách hiểu tuyệt đối. Bản dịch giữ nguyên giới hạn ấy mà không mở rộng thành một chủ trương biệt lập.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu giữ cấu trúc nối tiếp câu 9 bằng chữ thường ở đầu, đồng thời bổ sung cụm “tránh giao thiệp” vốn được tỉnh lược trong câu Hy Lạp nhưng được kế thừa trực tiếp từ văn mạch. Các từ “vô luân về tình dục”, “tham lam”, “cướp đoạt” tránh lối diễn đạt cổ mà vẫn giữ tính cụ thể của danh sách thói xấu.
