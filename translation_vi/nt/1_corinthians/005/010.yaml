revisions:
- from: không phải là hoàn toàn tránh giao thiệp với những người vô luân về tình dục thuộc thế gian này, hay những kẻ tham lam và cướp đoạt[a], hoặc những kẻ thờ thần tượng[b], vì nếu vậy, anh em ắt phải ra khỏi thế gian.
  to: Ý tôi không phải là nói đến việc tránh giao thiệp với những người vô luân về tình dục thuộc thế gian này, hoặc với những người tham lam, bóc lột, hay thờ thần tượng[a]; vì nếu vậy, anh em ắt phải ra khỏi thế gian.
  rationale: 'Sửa mệnh đề đầu để phản ánh rõ chức năng đính chính của οὐ πάντως trong văn mạch câu 9: Phao-lô không nói về những người thuộc xã hội bên ngoài Hội Thánh. Thay «những kẻ cướp đoạt» bằng «những người ... bóc lột» để tiếng Việt tự nhiên và vẫn giữ phạm vi ngữ nghĩa của ἅρπαξ. Chú thích b được giữ trong bộ chú thích vì vẫn hữu ích cho mạch văn, nhưng không gắn ký hiệu vào bản văn vì đó là chú thích diễn giải văn mạch chứ không phải lựa chọn từ vựng tại một từ riêng lẻ.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T18:11:02Z'
review_pass:
  verdict: revise
  source_fidelity: 'Câu dự thảo nhận đúng quan hệ với câu 9 và giữ đủ các nhóm người cùng hệ quả «ra khỏi thế gian». Tuy nhiên, «không phải là hoàn toàn tránh giao thiệp với» đặt «hoàn toàn» vào mức độ tránh giao thiệp, dễ gợi ý rằng Phao-lô chỉ cấm tránh hoàn toàn nhưng vẫn đang nói về việc tránh những người ngoài Hội Thánh. οὐ πάντως trong mạch văn đính chính đối tượng mà lời dặn ở câu 9 nhắm tới: không phải những người như vậy «thuộc thế gian này».'
  naturalness: «Những kẻ cướp đoạt» không tự nhiên vì «cướp đoạt» chủ yếu là động từ. Cấu trúc được sửa theo lối văn hiện đại, vẫn trang trọng, và làm rõ phần được tỉnh lược nhưng kế thừa từ câu 9.
  terminology: «Vô luân về tình dục», «tham lam», «thờ thần tượng», «thế gian» đều phù hợp. «Bóc lột» là danh từ/chỉ loại người tự nhiên trong danh sách, diễn tả thích đáng nét chiếm lấy, trục lợi của ἅρπαξ mà không giới hạn từ này vào trộm cướp bằng bạo lực.
