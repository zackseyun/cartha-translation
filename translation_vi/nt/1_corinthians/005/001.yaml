  to: 'Quả thật, người ta nghe nói rằng giữa anh em có sự vô luân về tình dục, một sự vô luân đến mức ngay cả giữa các dân ngoại cũng không có: có người ăn ở với vợ của cha mình.[a]'
  rationale: Bản sửa thay thuật ngữ có nguy cơ bị hiểu hẹp bằng một cách diễn đạt bao quát hơn cho πορνεία, làm tự nhiên cấu trúc nhấn mạnh τοιαύτη...ἥτις, và giữ nguyên tính không xác định của “vợ của cha mình”. Chú thích được bổ sung để làm rõ uyển ngữ của ἔχειν mà không áp đặt nhận định rằng người phụ nữ chắc chắn là mẹ kế.
