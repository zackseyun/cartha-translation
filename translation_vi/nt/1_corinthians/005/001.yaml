    issue: “Sự gian dâm” có thể bị hiểu hẹp là ngoại tình.
    rationale: πορνεία chỉ rộng hành vi tình dục trái luân lý; trong tiếng Việt hiện đại, “gian dâm” thường có liên tưởng hẹp hơn. “Sự vô luân về tình dục” bao quát hơn mà vẫn giữ văn phong trang trọng.
  - severity: low
    issue: Cụm “mà là sự gian dâm đến mức” chưa tự nhiên.
    rationale: τοιαύτη πορνεία ἥτις giới thiệu một loại/trường hợp có tính chất đặc biệt. “Một sự vô luân đến mức...” diễn đạt liên kết này rõ và tự nhiên hơn.
  - severity: low
    issue: Chú thích hiện chỉ nêu nghĩa đen và khả năng mẹ kế, chưa giải thích đầy đủ cách dùng ἔχειν.
    rationale: Động từ “có” trong nguyên văn là lối nói hàm ý một quan hệ tình dục; nêu điều này giúp người đọc hiểu vì sao bản văn dùng “ăn ở với”.
