language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ὅλως ἀκούεται ἐν ὑμῖν πορνεία, καὶ τοιαύτη πορνεία ἥτις οὐδὲ ἐν τοῖς ⸀ἔθνεσιν, ὥστε γυναῖκά τινα τοῦ πατρὸς ἔχειν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/001.yaml
  text: 'It is actually reported that there is sexual immorality among you, and sexual immorality of such a kind as is not even found among the Gentiles: a man has his father’s wife.'
translation:
  language: vi
  text: 'Quả thật, người ta nghe nói rằng giữa anh em có sự vô luân về tình dục, một sự vô luân đến mức ngay cả giữa các dân ngoại cũng không có: có người ăn ở với vợ của cha mình.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “có vợ của cha mình”; động từ “có” ở đây là lối nói hàm ý một quan hệ tình dục. Có thể người phụ nữ này là mẹ kế của người ấy.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅλως
  choice: Quả thật
  rationale: Diễn đạt sắc thái nhấn mạnh và kinh ngạc của Phao-lô, thay vì hiểu theo nghĩa định lượng như “hoàn toàn”.
- source_word: ἀκούεται
  choice: người ta nghe nói
  rationale: Thể bị động mang nghĩa một sự việc đang được truyền tin hoặc tường trình; cách nói này tự nhiên trong tiếng Việt và vẫn gần hình thức Hy Lạp.
- source_word: ἐν ὑμῖν
  choice: giữa anh em
  rationale: Chỉ sự việc xảy ra trong cộng đồng tín hữu Cô-rinh-tô; “anh em” phù hợp với cách xưng hô cộng đồng trong thư.
- source_word: πορνεία
  choice: sự gian dâm
  rationale: Chỉ hành vi tình dục trái phép; trong ngữ cảnh này, “gian dâm” là từ trang trọng, dễ hiểu và đủ rộng.
- source_word: τοιαύτη πορνεία
  choice: sự gian dâm đến mức
  rationale: Tái hiện sức nhấn mạnh định tính của τοιαύτη và dẫn tự nhiên vào mức độ gây chấn động của hành vi.
- source_word: οὐδὲ ἐν τοῖς ἔθνεσιν
  choice: ngay cả giữa các dân ngoại cũng không có
  rationale: “Các dân ngoại” giữ nguyên sự đối lập Do Thái–ngoại bang của ἔθνη mà không thêm sắc thái miệt thị; “có” bổ sung tự nhiên cho cấu trúc tỉnh lược.
- source_word: ὥστε
  choice: ':'
  rationale: Dấu hai chấm giới thiệu nội dung cụ thể của vụ việc một cách tự nhiên, tránh ép ὥστε thành quan hệ kết quả không phù hợp ở đây.
- source_word: γυναῖκά τινα τοῦ πατρὸς
  choice: vợ của cha mình
  rationale: Giữ cách gọi của nguyên văn và không xác quyết thêm rằng người phụ nữ là mẹ kế.
- source_word: ἔχειν
  choice: ăn ở với
  rationale: Trong ngữ cảnh, ἔχειν là lối nói hàm ý có quan hệ vợ chồng hoặc tình dục. “Ăn ở với” làm rõ nghĩa thành ngữ mà không dùng cách diễn đạt thô tục.
theological_decisions:
- issue: Cách dịch ἔθνεσιν
  choice: các dân ngoại
  alternative: các dân; dân ngoại đạo
  rationale: “Các dân ngoại” là thuật ngữ mô tả người ngoài dân Do Thái trong khung tư tưởng của Phao-lô, không áp thêm phán xét tôn giáo như “ngoại đạo”.
- issue: Có gọi người phụ nữ là mẹ kế hay không
  choice: vợ của cha mình
  alternative: mẹ kế của mình
  rationale: Nguyên văn chỉ nói “vợ của cha”; “mẹ kế” có thể đúng theo hoàn cảnh nhưng là một suy luận không được phát biểu trực tiếp.
- issue: Mức độ minh giải ἔχειν
  choice: ăn ở với
  alternative: có; chung sống với
  rationale: Chỉ dịch là “có” dễ tối nghĩa trong tiếng Việt, còn “chung sống” có thể thu hẹp nghĩa vào việc ở cùng nhà. “Ăn ở với” bảo toàn hàm ý quan hệ tình dục/vợ chồng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và trực tiếp. Giữ giọng kinh ngạc, khiển trách của câu Hy Lạp; tránh từ ngữ thô tục và không xác định quá mức quan hệ gia đình.
