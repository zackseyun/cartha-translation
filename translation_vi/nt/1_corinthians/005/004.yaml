language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐν τῷ ὀνόματι τοῦ κυρίου ἡμῶν ⸀Ἰησοῦ, συναχθέντων ὑμῶν καὶ τοῦ ἐμοῦ πνεύματος σὺν τῇ δυνάμει τοῦ κυρίου ἡμῶν ⸁Ἰησοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/004.yaml
  text: In the name of our Lord Jesus[a], when you are assembled, and my spirit is with you, with the power of our Lord Jesus,
translation:
  language: vi
  text: nhân danh Chúa Giê-su của chúng ta, khi anh em đã nhóm họp và thần trí tôi ở với anh em, cùng với quyền năng của Chúa Giê-su chúng ta,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Câu Hy Lạp tiếp tục sang câu 5 và có cấu trúc cô đọng. Cũng có thể dịch: “khi anh em nhóm họp, và thần trí tôi hiện diện với anh em.”'
    reason: Nêu tính cô đọng của cấu trúc sở hữu cách tuyệt đối và giữ khả năng diễn đạt thời điểm khác nhau mà không áp đặt cách giải thích về bản chất sự hiện diện của Phao-lô.
lexical_decisions:
- source_word: ἐν τῷ ὀνόματι
  choice: nhân danh
  rationale: Thành ngữ tiếng Việt tự nhiên, giữ hình ảnh nguyên ngữ và hàm ý hành động dưới danh nghĩa, thẩm quyền của Đức Chúa Jêsus.
- source_word: κυρίου
  choice: Chúa
  rationale: Giữ tước hiệu Tân Ước trang trọng và sức nặng Cơ Đốc luận của κύριος.
- source_word: Ἰησοῦ
  choice: Đức Chúa Jêsus
  rationale: Dùng dạng tên gọi trang trọng, quen thuộc trong văn phong Kinh Thánh tiếng Việt hiện đại.
- source_word: συναχθέντων ὑμῶν
  choice: khi anh em nhóm lại
  rationale: Chuyển kết cấu sở hữu cách tuyệt đối với phân từ aorist bị động thành mệnh đề thời gian tự nhiên, không nhấn quá mức vào tác thể hay trạng thái hoàn tất.
- source_word: τοῦ ἐμοῦ πνεύματος
  choice: tâm linh tôi cũng ở với anh em
  rationale: Bổ sung động từ và cụm chỉ sự hiện diện vốn được hàm ý trong kết cấu cô đọng, đồng thời giữ nguyên tuyên bố về sự tham dự phi thể chất của Phao-lô mà không giải thích cơ chế.
- source_word: σὺν τῇ δυνάμει
  choice: cùng với quyền năng
  rationale: Giữ nghĩa đồng hành của σύν và nghĩa năng lực hữu hiệu của δύναμις, thay vì thu hẹp thành thẩm quyền pháp lý.
- source_word: τοῦ κυρίου ἡμῶν Ἰησοῦ
  choice: của Chúa chúng ta là Đức Chúa Jêsus
  rationale: Giữ quan hệ sở hữu cách đủ rộng, không quyết định đó chỉ là nguồn phát hay quyền sở hữu.
theological_decisions:
- issue: Bản chất sự hiện diện của Phao-lô trong buổi nhóm
  choice: Diễn đạt rằng tâm linh Phao-lô ở với hội chúng theo nghĩa có thật nhưng không thuộc thể xác.
  alternative: Hiểu “tâm linh tôi” chỉ là thái độ, ý hướng của Phao-lô; hoặc hiểu là một sự hiện diện huyền nhiệm mạnh hơn.
  rationale: Nguyên văn xác nhận sự tham dự phi thể chất nhưng không định nghĩa cơ chế; bản dịch duy trì sự căng thẳng ấy.
- issue: Quan hệ cú pháp của “nhân danh” và “cùng với quyền năng”
  choice: Giữ chuỗi mệnh đề và cụm giới từ cô đọng để câu 4 tiếp tục hướng sang hành động được nêu ở câu 5.
  alternative: Gắn cả hai cụm một cách dứt khoát với “nhóm lại” hoặc với động từ hành động ở câu kế tiếp.
  rationale: Cú pháp Hy Lạp trải sang câu tiếp theo và có thể được phân tích theo hơn một cách; không nên âm thầm giải quyết sự mơ hồ trong một câu trích riêng lẻ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Anh em” thể hiện số nhiều của ὑμῶν trong lời nói với hội chúng. Dấu phẩy cuối câu được giữ vì câu Hy Lạp chưa hoàn tất ở câu 4.
