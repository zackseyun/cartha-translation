id: 1CO.5.7
reference: 1 Corinthians 5:7
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐκκαθάρατε τὴν παλαιὰν ζύμην, ἵνα ἦτε νέον φύραμα, καθώς ἐστε ἄζυμοι. καὶ γὰρ τὸ πάσχα ⸀ἡμῶν ἐτύθη Χριστός·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/007.yaml
  text: Clean out the old leaven[a], so that you may be a new batch, just as you are unleavened. For Messiah, our Passover lamb[b], has been sacrificed.
translation:
  language: vi
  text: Hãy loại bỏ men cũ cho sạch, để anh chị em trở thành một mẻ bột mới, như anh chị em vốn không men. Vì Đấng Mê-si-a[b], chiên con Vượt Qua của chúng ta[a], đã được hiến tế.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “lễ Vượt Qua của chúng ta.” Cụm từ này có thể được hiểu là cách nói tắt chỉ chiên con hoặc sinh tế Vượt Qua.'
    reason: lexical_alternative
  - marker: b
    text: “Đấng Mê-si-a” dịch từ tiếng Hy Lạp Christos; cũng thường được dịch là “Đấng Christ.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκκαθάρατε
  choice: Hãy loại bỏ ... cho sạch
  rationale: Động từ mệnh lệnh số nhiều mang ý loại bỏ hoàn toàn; cách diễn đạt này tự nhiên trong tiếng Việt và giữ được sức mạnh của mệnh lệnh.
- source_word: παλαιὰν ζύμην
  choice: men cũ
  rationale: “Men” vừa là cách gọi thông dụng vừa duy trì hình ảnh bánh không men của lễ Vượt Qua và phép ẩn dụ về ảnh hưởng làm hư hỏng.
- source_word: ἵνα ἦτε
  choice: để anh chị em trở thành
  rationale: Diễn đạt mục đích hoặc kết quả được nhắm đến, đồng thời không xóa đi sự căng thẳng với căn tính hiện có trong mệnh đề kế tiếp.
- source_word: νέον φύραμα
  choice: một mẻ bột mới
  rationale: φύραμα chỉ một khối hay mẻ bột đã nhào; “mẻ bột” tự nhiên và giữ nguyên trường hình ảnh làm bánh.
- source_word: καθώς ἐστε ἄζυμοι
  choice: như anh chị em vốn không men
  rationale: Giữ phép so sánh của καθώς và lời khẳng định hiện tại ἐστε, không diễn giải căn tính này theo một hệ thần học riêng.
- source_word: τὸ πάσχα ἡμῶν
  choice: chiên con Vượt Qua của chúng ta
  rationale: Nguyên văn là “lễ Vượt Qua của chúng ta”; vì động từ θύω nói đến việc hiến tế, “chiên con Vượt Qua” làm rõ vật hiến tế được hàm ý mà vẫn ghi nhận cách nói sát chữ trong chú thích.
- source_word: ἐτύθη
  choice: đã được hiến tế
  rationale: Thể bị động của θύω chỉ hành động giết làm sinh tế; “đã được hiến tế” giữ rõ ý nghĩa tế lễ.
- source_word: Χριστός
  choice: Đấng Mê-si-a
  rationale: Trong ngữ cảnh lễ Vượt Qua, Χριστός nổi bật như một tước hiệu; “Đấng Mê-si-a” truyền đạt chức danh này rõ ràng hơn dạng tên riêng “Christ”.
theological_decisions:
- issue: Cách hiểu πάσχα khi chỉ về Đấng Mê-si-a
  choice: chiên con Vượt Qua của chúng ta
  alternative: lễ Vượt Qua của chúng ta; sinh tế Vượt Qua của chúng ta
  rationale: Nguyên văn giữ cách nói cô đọng “lễ Vượt Qua của chúng ta”, nhưng ἐτύθη cho thấy đối tượng hiến tế được hàm ý. Bản dịch làm rõ “chiên con” và dùng chú thích để bảo tồn hình thức cùng độ rộng nghĩa của tiếng Hy Lạp.
- issue: Cách dịch Χριστός
  choice: Đấng Mê-si-a
  alternative: Đấng Christ; Christ
  rationale: Ngữ cảnh cứu chuộc gắn với lễ Vượt Qua làm nổi bật giá trị tước hiệu, nên “Đấng Mê-si-a” thích hợp hơn cách phiên âm dễ được hiểu như tên riêng.
- issue: Sự căng thẳng giữa mệnh lệnh và căn tính hiện có
  choice: “để ... trở thành” nhưng “vốn không men”
  alternative: diễn giải cả hai vế như chỉ nói về tiến trình đạo đức hoặc chỉ nói về địa vị
  rationale: Câu Hy Lạp vừa kêu gọi cộng đoàn trở nên một mẻ bột mới, vừa khẳng định họ đang không men. Bản dịch giữ cả hai vế mà không tự ý giải quyết sự căng thẳng thần học.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” để thể hiện ngôi thứ hai số nhiều hướng đến cả cộng đoàn; duy trì nhất quán các hình ảnh men, mẻ bột và lễ Vượt Qua.
