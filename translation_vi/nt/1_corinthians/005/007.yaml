  source_fidelity: Bản dịch truyền đạt đúng mệnh lệnh số nhiều ἐκκαθάρατε, hình ảnh men/bột, đối ứng giữa lời kêu gọi trở nên mới và tình trạng hiện có “không men,” cùng ý tế lễ của ἐτύθη. Việc làm rõ τὸ πάσχα ἡμῶν là “chiên con Vượt Qua của chúng ta” có thể chấp nhận được trong ngữ cảnh, miễn chú thích giữ cách nói nguyên văn rộng hơn.
  naturalness: Tiếng Việt hiện đại, rõ ràng và phù hợp văn phong Kinh Thánh. “Hãy loại bỏ men cũ cho sạch” và “một mẻ bột mới” tự nhiên. Cần đặt ký hiệu chú thích về Χριστός ngay sau “Đấng Mê-si-a,” thay vì ở cuối câu sau động từ “đã được hiến tế,” để mỏ neo chú thích khớp chính xác với từ được chú giải.
  terminology: “Men,” “mẻ bột,” “Vượt Qua,” “hiến tế,” và “Đấng Mê-si-a” nhất quán với trường nghĩa Hy Lạp và với tước hiệu Χριστός. Chú thích a bảo tồn khả năng hiểu sát chữ “lễ Vượt Qua của chúng ta”/sinh tế Vượt Qua mà không áp đặt một cách giải thích duy nhất.
