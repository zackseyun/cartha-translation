  terminology: “Sự khoe khoang” phù hợp với καύχημα; “men” và “làm dậy” bảo toàn hình ảnh liên kết ζύμη/ζυμοῖ; “khối bột” diễn đạt chính xác φύραμα. Không cần đưa cách hiểu đạo đức của ẩn dụ vào bản văn.
