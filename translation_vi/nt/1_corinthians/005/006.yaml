  text: Οὐ καλὸν τὸ καύχημα ὑμῶν. οὐκ οἴδατε ὅτι μικρὰ ζύμη ὅλον τὸ φύραμα ζυμοῖ;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/006.yaml
  text: Your boasting is not good[a]. Do you not know that a little leaven leavens the whole batch of dough?
translation:
  language: vi
  text: Sự khoe khoang của anh chị em không tốt. Anh chị em không biết rằng một chút men làm dậy cả khối bột sao?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καλὸν
  choice: tốt đẹp
  rationale: Trong ngữ cảnh, καλός đánh giá sự khoe khoang là không đúng đắn và không đáng khen; “tốt đẹp” tự nhiên, rõ nghĩa và giữ được sắc thái đánh giá.
- source_word: καύχημα
  choice: sự khoe khoang
  rationale: Danh từ chỉ việc hoặc điều được đem ra khoe; “sự khoe khoang” phù hợp với giọng quở trách của Phao-lô.
- source_word: οὐκ οἴδατε
  choice: anh chị em không biết ... sao?
  rationale: Giữ cấu trúc câu hỏi tu từ quen thuộc của Phao-lô, đồng thời diễn đạt tự nhiên trong tiếng Việt.
- source_word: μικρὰ ζύμη
  choice: chỉ một chút men
  rationale: “Men” truyền đạt rõ hình ảnh làm bánh trong tiếng Việt; “chỉ một chút” làm nổi bật lượng nhỏ mà không diễn giải thêm ẩn dụ.
- source_word: ὅλον τὸ φύραμα
  choice: cả khối bột
  rationale: φύραμα là khối bột đã nhào/trộn; “cả khối bột” gọn, dễ hiểu và giữ sự nhấn mạnh vào toàn thể của ὅλον.
- source_word: ζυμοῖ
  choice: làm dậy
  rationale: Trong ngữ cảnh làm bánh, “làm dậy” là cách nói tự nhiên về tác dụng của men lên bột và bảo toàn quan hệ hình ảnh giữa ζύμη và động từ ζυμόω.
theological_decisions:
- issue: Hình ảnh ẩn dụ về men
  choice: Giữ nguyên hình ảnh một chút men làm dậy cả khối bột, không giải thích trực tiếp đối tượng đạo đức mà hình ảnh ám chỉ.
  alternative: Diễn giải thành “một chút tội lỗi làm hư hỏng cả hội thánh.”
  rationale: Bản Hy Lạp nêu một câu mang tính tục ngữ; văn cảnh cho thấy cách áp dụng, nhưng chính câu này không giải nghĩa ẩn dụ. Giữ hình ảnh bảo toàn độ mở và sức gợi của nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” cho đại từ số nhiều ὑμῶν và chủ ngữ hàm ẩn của οἴδατε, thể hiện lời nói với cả cộng đồng. Không thêm chú thích vì phương án “cả khối bột” đã truyền đạt trực tiếp nghĩa của φύραμα; chú thích tiếng Anh được cung cấp dường như gắn nhầm vào mệnh đề đầu.
