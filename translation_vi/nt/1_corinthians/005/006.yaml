  to: Sự khoe khoang của anh chị em không tốt. Anh chị em không biết rằng một chút men làm dậy cả khối bột sao?
  rationale: 'Chỉ điều chỉnh cách diễn đạt của mệnh đề đầu để phản ánh trực tiếp và tự nhiên hơn Οὐ καλὸν, không thay đổi nghĩa, hình ảnh ẩn dụ, hay mức độ hàm súc của nguyên văn. Không cần chú thích: “khối bột” đã diễn đạt rõ φύραμα; chú thích tiếng Anh về “lump” không tạo ra một biến thể nghĩa cần thiết trong tiếng Việt.'
