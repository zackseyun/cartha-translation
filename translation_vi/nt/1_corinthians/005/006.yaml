  source_fidelity: 'Bản dịch truyền đạt đúng các thành tố chính của câu Hy Lạp: lời đánh giá phủ định về sự khoe khoang, câu hỏi tu từ, lượng men nhỏ, toàn thể khối bột, và tác động làm bột dậy. Tuy nhiên, “chẳng tốt đẹp gì” thêm sắc thái nhấn mạnh “gì” không có trong nguyên văn và không tự nhiên bằng cách nói đánh giá trực tiếp.'
