id: 1CO.5.3
reference: 1 Corinthians 5:3
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἐγὼ μὲν γάρ, ⸀ἀπὼν τῷ σώματι παρὼν δὲ τῷ πνεύματι, ἤδη κέκρικα ὡς παρὼν τὸν οὕτως τοῦτο κατεργασάμενον
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/003.yaml
  text: For I[a], though absent in body but present in spirit, have already judged, as though present[b], the one who has done this thing.
translation:
  language: vi
  text: Vì tôi, dù vắng mặt về thân thể nhưng hiện diện trong tinh thần[b], đã phán xét[a], như thể đang có mặt, người đã làm việc này theo cách ấy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “đã tuyên phán quyết.”'
    reason: lexical_alternative
  - marker: b
    text: “Tinh thần” ở đây rất có thể chỉ tinh thần của chính Phao-lô, chứ không phải Đức Thánh Linh.
    reason: lexical_alternative
lexical_decisions:
- source_word: γάρ
  choice: Vì
  rationale: Giữ quan hệ giải thích với câu trước; cách nối câu tự nhiên và trang trọng trong tiếng Việt.
- source_word: ἀπὼν τῷ σώματι
  choice: vắng mặt về thân thể
  rationale: Diễn đạt cách tự nhiên ý nghĩa xét về phương diện thân thể, không gợi rằng Phao-lô đã lìa khỏi thân xác hay đã chết.
- source_word: παρὼν δὲ τῷ πνεύματι
  choice: nhưng hiện diện về tâm linh
  rationale: Giữ sự đối lập cân xứng giữa thân thể và tâm linh, đồng thời không diễn giải cụ thể bản chất của sự hiện diện này.
- source_word: ἤδη κέκρικα
  choice: đã phán xét
  rationale: Thì hoàn thành chỉ một sự phán xét đã được đưa ra và vẫn có hiệu lực; “phán xét” bám sát κρίνω trong bối cảnh kỷ luật hội thánh.
- source_word: ὡς παρὼν
  choice: như thể tôi đang có mặt
  rationale: Truyền đạt rõ lực so sánh của ὡς và cho thấy Phao-lô đưa ra sự phán xét như khi ông có mặt tại chỗ.
- source_word: τὸν ... κατεργασάμενον
  choice: người làm
  rationale: Phân từ được dùng như danh từ để chỉ người phạm việc ấy; “người” không thêm đặc điểm giới tính ngoài điều văn cảnh đòi hỏi.
- source_word: οὕτως τοῦτο
  choice: một việc như thế
  rationale: Cách nói tự nhiên trong tiếng Việt, kết hợp ý chỉ định của τοῦτο với tính chất gây sốc được οὕτως nhấn mạnh, tránh lối dịch máy móc “làm điều này theo cách như vậy”.
theological_decisions:
- issue: Ý nghĩa của “hiện diện về tâm linh”
  choice: Giữ nguyên cách nói để chỉ sự hiện diện không thuộc thân thể của Phao-lô với hội thánh trong mối quan tâm và sự phán xét.
  alternative: Hiểu πνεύματι là sự hiện diện hay sự soi dẫn của Đức Thánh Linh, hoặc là một hình thức hiện diện huyền nhiệm mạnh hơn.
  rationale: Sự đối lập trực tiếp giữa σώματι và πνεύματι tự nhiên nhất nói về thân thể và tâm linh của chính Phao-lô. Bản dịch không áp đặt một lý thuyết cụ thể về cách ông hiện diện.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Cấu trúc tương phản “vắng mặt về thân thể nhưng hiện diện về tâm linh” được giữ gần với nguyên văn; trật tự cuối câu được điều chỉnh để câu tiếng Việt trôi chảy.
