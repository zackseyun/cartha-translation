- from: Vì dù vắng mặt về thân thể nhưng hiện diện về tâm linh[b], tôi đã phán xét[a] người làm một việc như thế, như thể tôi đang có mặt.
  to: Vì tôi, dù vắng mặt về thân thể nhưng hiện diện trong tinh thần[b], đã phán xét[a], như thể đang có mặt, người đã làm việc này theo cách ấy.
  rationale: Bản sửa làm rõ cách hiểu tự nhiên nhất của πνεύματι trong thế đối lập với σώματι, đồng thời bảo toàn hai thành tố của οὕτως τοῦτο. Không xác định bản chất sự hiện diện của Phao-lô vượt quá điều câu văn nói.
