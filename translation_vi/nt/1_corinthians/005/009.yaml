  source_fidelity: 'Bản dịch phản ánh đúng các thành phần chính: aorist Ἔγραψα là quá khứ, ὑμῖν là người nhận số nhiều, ἐν τῇ ἐπιστολῇ được giữ không xác định, và μὴ συναναμίγνυσθαι diễn tả sự không kết giao/qua lại. Tuy nhiên, “những người gian dâm” trong tiếng Việt thường dễ gợi một hành vi quan hệ bất chính cụ thể và có thể hẹp hơn πόρνοις, vốn chỉ người được đặc trưng bởi sự vô luân về tình dục nói chung.'
  naturalness: Câu chính nhìn chung tự nhiên, trang trọng và phù hợp tiếng Việt hiện đại. “Đừng hòa mình với” ở chú thích không phải là một cách thay thế tự nhiên hoặc chính xác cho quan hệ giao du/kết giao giữa người với người. Chú thích a cũng có thể được diễn đạt trôi chảy hơn.
