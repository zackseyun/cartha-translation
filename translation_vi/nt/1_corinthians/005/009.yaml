  text: Tôi đã viết cho anh chị em trong thư rằng đừng giao du với những người sống vô luân về tình dục.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “trong thư của tôi.” Tiếng Hy Lạp có thể chỉ một thư trước đó Phao-lô đã gửi, hoặc chính thư này, ở một đoạn trước đó.'
    reason: alternative_reading
  - marker: b
    text: 'Cũng có thể dịch: “đừng kết giao với” hoặc “đừng qua lại với.”'
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “những người vô luân về tình dục.” Từ Hy Lạp πόρνοις chỉ những người có đặc trưng là sự vô luân về tình dục.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔγραψα
  choice: Tôi đã viết
  rationale: Thể aorist chỉ định được diễn đạt tự nhiên bằng quá khứ trong tiếng Việt; cách dịch này không tự quyết định đó là một thư trước hay phần đã viết trong thư hiện tại.
- source_word: ὑμῖν
  choice: cho anh chị em
  rationale: Đại từ số nhiều ở cách cho, chỉ người nhận; “anh chị em” phù hợp lối xưng hô cộng đồng Cơ Đốc và tiếng Việt hiện đại.
- source_word: ἐν τῇ ἐπιστολῇ
  choice: trong thư
  rationale: Giữ ý về một bức thư xác định mà người nhận biết, đồng thời không ép cách hiểu là thư thất lạc trước đó hay chính thư này.
- source_word: μὴ συναναμίγνυσθαι
  choice: đừng giao du với
  rationale: Diễn đạt tự nhiên ý không hòa mình, kết giao hay giữ quan hệ gần gũi; không hàm ý tuyệt đối tránh mọi tiếp xúc.
- source_word: πόρνοις
  choice: những người gian dâm
  rationale: Danh từ số nhiều chỉ những người có đặc trưng là hành vi vô luân về tình dục; “gian dâm” trang trọng, quen thuộc và không thu hẹp từ này vào một hành vi duy nhất.
theological_decisions:
- issue: “Thư” này là thư nào
  choice: Giữ cách nói “trong thư” mà không xác định đó là một thư trước hay thư hiện tại.
  alternative: Dịch “trong thư trước của tôi” hoặc hiểu là một phần trước đó của 1 Cô-rinh-tô.
  rationale: Cụm ἐν τῇ ἐπιστολῇ có mạo từ xác định nhưng bản thân nó không giải quyết câu hỏi lịch sử; bản dịch cần giữ sự mơ hồ thực sự.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh chị em” cho cộng đồng người nhận; giữ cấu trúc gọn và bảo toàn sự mơ hồ về bức thư được nhắc đến.
