- from: Thế mà anh chị em lại tự cao tự đại! Lẽ ra anh chị em chẳng phải đau buồn, để người đã làm việc ấy bị loại khỏi giữa anh chị em[a] sao?
  to: Thế mà anh chị em lại tự cao tự đại! Lẽ ra anh chị em phải than khóc, để người đã làm việc ấy bị loại khỏi giữa anh chị em[a], sao?
  rationale: Bản sửa thay «đau buồn» bằng «than khóc» để phản ánh sát hơn ἐπενθήσατε, đồng thời đơn giản hóa cấu trúc câu hỏi tu từ. Giữ «bị loại» và chú thích thay thế «bị cất» để không quyết định quá mức về tác nhân của thể bị động ἀρθῇ.
  reviewer_model: gpt-5.6-terra
