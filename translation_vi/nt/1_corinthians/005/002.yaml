    issue: Cường độ của ἐπενθήσατε
    rationale: «Đau buồn» có thể chỉ sự buồn bã chung, trong khi ἐπενθέω thường chỉ than khóc, để tang. «Than khóc» truyền đạt sát hơn sắc thái mạnh của nguyên ngữ.
  - severity: low
    issue: Cú pháp câu hỏi tu từ
    rationale: Cụm «Lẽ ra ... chẳng phải đau buồn ... sao?» có thể dùng được, nhưng «lẽ ra ... phải than khóc ... sao?» tự nhiên và rõ hơn trong tiếng Việt hiện đại, đồng thời vẫn giữ lực quở trách của οὐχὶ μᾶλλον.
