source:
  edition: SBLGNT
  text: καὶ ὑμεῖς πεφυσιωμένοι ἐστέ, καὶ οὐχὶ μᾶλλον ἐπενθήσατε, ἵνα ⸀ἀρθῇ ἐκ μέσου ὑμῶν ὁ τὸ ἔργον τοῦτο ⸀ποιήσας;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/002.yaml
  text: And you are puffed up[a], and should you not rather have mourned, so that the one who did this deed might be removed from among you?
translation:
  language: vi
  text: Thế mà anh chị em lại tự cao tự đại! Lẽ ra anh chị em phải than khóc, để người đã làm việc ấy bị loại khỏi giữa anh chị em[a], sao?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “bị cất khỏi giữa anh chị em.” Trong ngữ cảnh, điều này có lẽ nói đến việc người ấy bị loại khỏi cộng đồng qua sự kỷ luật.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πεφυσιωμένοι
  choice: tự cao tự đại
  rationale: Diễn đạt tự nhiên trạng thái kiêu căng đã ăn sâu mà hình ảnh ‘phồng lên’ hàm ý; tránh cách dịch sát chữ nhưng khó hiểu trong tiếng Việt hiện đại.
- source_word: οὐχὶ μᾶλλον
  choice: lẽ ra ... chẳng phải ... sao?
  rationale: Giữ sức nặng của câu hỏi tu từ mang ý quở trách và làm nổi bật sự tương phản giữa thái độ thực tế với phản ứng đáng phải có.
- source_word: ἐπενθήσατε
  choice: đau buồn
  rationale: Truyền đạt nỗi đau sâu sắc mang sắc thái tang chế hoặc than khóc, nhưng vẫn tự nhiên trong ngữ cảnh cộng đồng.
- source_word: ἵνα ἀρθῇ
  choice: để ... bị loại
  rationale: Giữ cấu trúc mục đích/kết quả và thể bị động của nguyên văn, đồng thời không xác định quá mức tác nhân thực hiện việc loại bỏ.
- source_word: ἐκ μέσου ὑμῶν
  choice: khỏi giữa anh chị em
  rationale: Giữ ý nghĩa cộng đồng của thành ngữ Hy Lạp mà không thêm rõ ‘hội thánh’ vào chính văn.
- source_word: ὁ τὸ ἔργον τοῦτο ποιήσας
  choice: người đã làm việc ấy
  rationale: Diễn đạt tự nhiên, trang trọng, nhận diện người phạm lỗi mà không thêm chi tiết ngoài nguyên văn.
theological_decisions:
- issue: Bản chất của hành động được yêu cầu đối với người phạm lỗi
  choice: bị loại khỏi giữa anh chị em
  alternative: bị Đức Chúa Trời cất đi hoặc chết
  rationale: Thể bị động ἀρθῇ không nêu tác nhân và tự nó có thể rộng nghĩa. Mạch văn gần nói đến kỷ luật cộng đồng, nên ‘bị loại’ phù hợp hơn, nhưng chú thích vẫn bảo lưu độ mở của nguyên văn thay vì đồng nhất hoàn toàn với một thuật ngữ giáo luật.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh chị em” để xưng hô với cộng đồng tín hữu; câu cảm thán đầu câu và câu hỏi tu từ sau đó giữ giọng quở trách mạnh của Phao-lô.
