    issue: “Phải xét đoán” thu hẹp độ mở của κρίνετε
    rationale: Hiện tại chỉ định trong câu hỏi tu từ có thể mang lực trách nhiệm theo văn cảnh, nhưng cũng có thể dịch hình thức hơn là “xét đoán.” Bỏ “phải” bảo tồn sự mơ hồ ngữ pháp, trong khi câu hỏi tu từ vẫn cho thấy điều được kỳ vọng.
