  text: τί γάρ ⸀μοι τοὺς ἔξω κρίνειν; οὐχὶ τοὺς ἔσω ὑμεῖς κρίνετε,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/012.yaml
  text: For what is it to me to judge outsiders? Is it not those inside that you are to judge?[a][b]
translation:
  language: vi
  text: Vì tôi có liên quan gì đến việc xét đoán những người ở ngoài? Chẳng phải anh chị em xét đoán những người ở trong sao?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Vì việc xét đoán những người ở ngoài có can hệ gì với tôi?”'
    reason: lexical_alternative
  - marker: b
    text: '“Những người ở trong” chỉ những người thuộc cộng đồng Hội Thánh. Động từ “xét đoán” có thể được hiểu theo nghĩa trách nhiệm trong câu hỏi tu từ, nên cũng có thể dịch: “anh chị em phải xét đoán.”'
    reason: cultural_and_grammatical_note
lexical_decisions:
- source_word: τί γάρ μοι ... κρίνειν
  choice: Vì tôi có phận sự gì mà xét đoán
  rationale: Cách diễn đạt này chuyển tải thành ngữ hỏi việc ấy có liên quan gì đến người nói, đồng thời giữ liên từ giải thích γάρ và sắc thái câu hỏi tu từ.
- source_word: τοὺς ἔξω
  choice: những người ở ngoài
  rationale: Cụm tính từ dùng như danh từ, chỉ những người ngoài cộng đồng Hội Thánh; cách dịch này giữ rõ hình ảnh đối lập ngoài–trong của nguyên văn.
- source_word: κρίνειν / κρίνετε
  choice: xét đoán / phải xét đoán
  rationale: “Xét đoán” phù hợp với việc đưa ra phán xét trong bối cảnh kỷ luật cộng đồng. Ở vế sau, “phải” thể hiện lực trách nhiệm được hàm ý trong câu hỏi tu từ, nhưng ghi chú vẫn bảo tồn khả năng hiểu dạng chỉ định theo nghĩa mô tả.
- source_word: οὐχὶ
  choice: Chẳng phải ... sao?
  rationale: Giữ nguyên hình thức câu hỏi tu từ mong đợi câu trả lời khẳng định và có giọng trang trọng, tự nhiên trong tiếng Việt.
- source_word: τοὺς ἔσω
  choice: những người ở trong
  rationale: Giữ trực tiếp thế đối lập với “những người ở ngoài” và không giải thích quá mức ngay trong câu.
- source_word: ὑμεῖς
  choice: anh chị em
  rationale: Đại từ số nhiều chỉ các tín hữu Cô-rinh-tô; “anh chị em” là cách xưng hô cộng đồng tự nhiên, bao quát giới tính và phù hợp văn phong thư tín.
theological_decisions:
- issue: Phạm vi của việc xét đoán trong câu
  choice: Giữ sự tương phản giữa người ngoài và người trong cộng đồng Hội Thánh, trong bối cảnh kỷ luật nội bộ.
  alternative: Hiểu câu này như một tuyên bố tổng quát về mọi hình thức phán đoán đạo đức.
  rationale: Mạch văn 1 Cô-rinh-tô 5:9–13 nói về trách nhiệm kỷ luật của cộng đồng. Bản dịch giữ nguyên đối lập trong–ngoài mà không mở rộng thành một khẳng định giáo lý vượt quá câu.
- issue: Sắc thái của ὑμεῖς κρίνετε
  choice: “anh chị em phải xét đoán,” diễn đạt trách nhiệm được hàm ý bởi câu hỏi tu từ.
  alternative: “anh chị em xét đoán,” hiểu động từ hiện tại theo nghĩa mô tả trực tiếp.
  rationale: Ngữ pháp cho phép nghe như một lời mô tả, còn văn cảnh nhấn mạnh bổn phận của cộng đồng. Ghi chú nêu phương án sát hình thức để bảo tồn độ mở của nguyên văn.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng cặp “ở ngoài/ở trong” để bảo tồn hình ảnh và sự đối xứng của tiếng Hy Lạp; dùng “anh chị em” cho đại từ số nhiều chỉ cộng đồng tín hữu.
