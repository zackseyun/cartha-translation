revisions:
- from: Vì tôi có phận sự gì mà xét đoán những người ở ngoài? Chẳng phải anh chị em phải xét đoán những người ở trong sao?[a][b]
  to: Vì tôi có liên quan gì đến việc xét đoán những người ở ngoài? Chẳng phải anh chị em xét đoán những người ở trong sao?[a][b]
  rationale: Thay “có phận sự gì mà” bằng cách diễn đạt ý “có liên quan gì” để phản ánh chính xác thành ngữ τί γάρ μοι mà không thêm ý nghĩa. Dịch κρίνετε là “xét đoán” nhằm giữ hình thức chỉ định và độ mở của nguyên văn; chú thích ghi nhận cách hiểu mang tính bổn phận trong văn cảnh. Các dấu chú thích được giữ nguyên và mỗi chú thích vẫn có điểm neo rõ ràng.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T18:10:57Z'
review_pass:
  verdict: revise
  source_fidelity: Câu đầu trong bản thảo, “tôi có phận sự gì mà,” chuyển thành ngữ τί γάρ μοι theo hướng “bổn phận,” không phải là ý trực tiếp của tiếng Hy Lạp, vốn hỏi việc đó có can hệ/liên quan gì đến Phao-lô. Ở vế sau, “phải xét đoán” là một cách hiểu có thể có trong văn cảnh, nhưng thêm sắc thái nghĩa vụ rõ hơn hình thức hiện tại κρίνετε; câu hỏi tu từ tiếng Việt vẫn có thể truyền đạt lực thúc giục mà không cần thêm “phải.”
  naturalness: “Tôi có liên quan gì đến việc xét đoán những người ở ngoài?” là cách nói hiện đại, tự nhiên và sát thành ngữ hơn. Cặp “những người ở ngoài / những người ở trong” giữ được cấu trúc đối xứng của nguyên văn; “anh chị em” phù hợp với lối xưng hô thư tín hiện đại.
  terminology: Giữ “xét đoán” nhất quán cho κρίνειν/κρίνετε trong ngữ cảnh kỷ luật cộng đồng. “Hội Thánh” chỉ xuất hiện trong chú thích để giải thích quy chiếu cộng đồng, không diễn giải thêm vào thân văn.
