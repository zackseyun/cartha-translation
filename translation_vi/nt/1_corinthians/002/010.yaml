  to: Vì Đức Chúa Trời đã bày tỏ những điều ấy cho chúng ta qua Thánh Linh[a]; bởi lẽ Thánh Linh dò xét mọi sự, ngay cả những điều sâu thẳm của Đức Chúa Trời[b].
  rationale: Bản sửa giữ tân ngữ hàm ẩn và cách hiểu “Thánh Linh” theo ngữ cảnh, nhưng thay cách diễn giải “sâu nhiệm” bằng “sâu thẳm” để phản ánh trung thành hơn τὰ βάθη (“các chiều sâu”). Liên từ cũng được chỉnh nhẹ cho lưu loát.
