id: 1CO.2.10
reference: 1 Corinthians 2:10
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἡμῖν ⸀γὰρ ⸂ἀπεκάλυψεν ὁ θεὸς⸃ διὰ τοῦ ⸀πνεύματος, τὸ γὰρ πνεῦμα πάντα ἐραυνᾷ, καὶ τὰ βάθη τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/010.yaml
  text: For God has revealed these things to us through the Spirit[a], for the Spirit searches all things[b], even the depths of God.
translation:
  language: vi
  text: Vì Đức Chúa Trời đã bày tỏ những điều ấy cho chúng ta qua Thánh Linh[a]; bởi lẽ Thánh Linh dò xét mọi sự, ngay cả những điều sâu thẳm của Đức Chúa Trời[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đã bày tỏ chúng cho chúng ta”; tiếng Hy Lạp không nêu rõ tân ngữ, nhưng tân ngữ được hiểu từ ngữ cảnh trước đó.'
    reason: alternative_reading
  - marker: b
    text: 'Sát nghĩa hơn: “những chiều sâu của Đức Chúa Trời.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκάλυψεν
  choice: đã bày tỏ
  rationale: Thì quá khứ với “đã” diễn đạt hành động mặc khải đã xảy ra; “bày tỏ” tự nhiên, trang trọng và phù hợp với việc Đức Chúa Trời khiến điều vốn kín nhiệm được biết đến.
- source_word: ἡμῖν
  choice: cho chúng ta
  rationale: Diễn đạt cách tự nhiên vai trò tiếp nhận của đại từ ở cách dữ cách.
- source_word: '[implicit object of ἀπεκάλυψεν]'
  choice: những điều ấy
  rationale: Tân ngữ không được nói rõ trong tiếng Hy Lạp nhưng được suy ra từ ngữ cảnh ngay trước đó; “những điều ấy” giữ liên kết hồi chỉ mà không thêm nội dung diễn giải.
- source_word: διὰ τοῦ πνεύματος
  choice: qua Thánh Linh
  rationale: διά với sở hữu cách chỉ phương tiện hoặc tác nhân; “qua” giữ sắc thái trung gian và tự nhiên trong tiếng Việt.
- source_word: πνεῦμα
  choice: Thánh Linh
  rationale: Ngữ cảnh nói đến tác nhân mặc khải của Đức Chúa Trời và Đấng dò xét cả những điều sâu nhiệm của Ngài, nên đây là Thánh Linh.
- source_word: ἐραυνᾷ
  choice: dò xét
  rationale: Giữ lực nghĩa chủ động, thấu đáo của động từ, đồng thời phù hợp với văn phong trang trọng hiện đại.
- source_word: πάντα
  choice: mọi sự
  rationale: Truyền đạt phạm vi bao quát của từ Hy Lạp bằng một cách nói gọn và quen thuộc.
- source_word: καὶ
  choice: ngay cả
  rationale: 'Hiểu καί theo nghĩa nhấn mạnh, đưa mệnh đề đến cao điểm: Thánh Linh dò xét cả những điều sâu nhiệm của Đức Chúa Trời.'
- source_word: τὰ βάθη τοῦ θεοῦ
  choice: những điều sâu nhiệm của Đức Chúa Trời
  rationale: Diễn đạt số nhiều danh từ hóa bằng tiếng Việt tự nhiên, vẫn bảo toàn hình ảnh về chiều sâu và không xác định cụ thể nội dung ấy.
theological_decisions:
- issue: πνεῦμα chỉ Thánh Linh hay tâm linh con người
  choice: Thánh Linh trong cả hai lần xuất hiện
  alternative: tâm linh theo nghĩa tổng quát
  rationale: Ngữ cảnh quy việc mặc khải thần thượng cho πνεῦμα và nói πνεῦμα dò xét những điều sâu nhiệm của Đức Chúa Trời, nên cách hiểu chỉ Thánh Linh có cơ sở mạnh nhất.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “Đức Chúa Trời” và “Thánh Linh” nhất quán; giữ cấu trúc lập luận nguyên nhân bằng “Vì…; bởi…”, đồng thời tránh giải thích quá mức nội dung của “những điều sâu nhiệm”.
