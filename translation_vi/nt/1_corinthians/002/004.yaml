revisions:
- from: Lời nói và lời rao giảng của tôi không dựa vào sự khôn ngoan đầy sức thuyết phục,[a] nhưng dựa vào sự bày tỏ của Thánh Linh[b] và quyền năng,
  to: Lời nói và lời rao giảng của tôi không phải bằng những lời lẽ khôn ngoan thuyết phục,[a] nhưng bằng sự chứng tỏ của Thánh Linh và quyền năng,[b]
  rationale: Bản sửa chuyển πειθοῖ σοφίας thành lối nói/phương tiện thuyết phục, phù hợp hơn với cú pháp và đối chiếu tu từ của câu, đồng thời duy trì khả năng dịch không thêm danh từ “lời” trong chú thích. “Sự chứng tỏ” phản ánh sát hơn ἀπόδειξις. Cách hiểu “Thánh Linh” được giữ ở bản chính và phương án viết thường được bảo lưu ở chú thích.
