  text: καὶ ὁ λόγος μου καὶ τὸ κήρυγμά μου οὐκ ἐν ⸂πειθοῖ σοφίας⸃ ἀλλ’ ἐν ἀποδείξει πνεύματος καὶ δυνάμεως,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/004.yaml
  text: And my speech and my proclamation were not with persuasive wisdom, but with a demonstration of the Spirit and of power,
translation:
  language: vi
  text: Lời nói và lời rao giảng của tôi không phải bằng những lời lẽ khôn ngoan thuyết phục,[a] nhưng bằng sự chứng tỏ của Thánh Linh và quyền năng,[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “bằng sự khôn ngoan có sức thuyết phục.”'
    reason: lexical_alternative
  - marker: b
    text: 'Hoặc: “thần khí” hoặc “linh.”'
    reason: alternative_reading
lexical_decisions:
- source_word: λόγος
  choice: lời nói
  rationale: Trong ngữ cảnh này, từ này chỉ lời nói/cách nói của Phao-lô và tạo sự phân biệt tự nhiên với κήρυγμα.
- source_word: κήρυγμα
  choice: lời rao giảng
  rationale: Diễn đạt hành vi hoặc nội dung được công bố công khai, giữ sắc thái truyền rao và dễ hiểu trong tiếng Việt hiện đại.
- source_word: πειθοῖ σοφίας
  choice: sự khôn ngoan đầy sức thuyết phục
  rationale: Bản Hy Lạp không có danh từ 'lời'; cách dịch này tránh tự ý thêm từ ấy và giữ mối tương phản giữa sức thuyết phục của sự khôn ngoan với sự bày tỏ của Thánh Linh và quyền năng.
- source_word: ἀποδείξει
  choice: sự bày tỏ
  rationale: Thể hiện ý nghĩa một sự biểu lộ/chứng tỏ rõ ràng, đối lập với việc chỉ dùng sức thuyết phục tu từ; tự nhiên hơn 'sự chứng minh' trong tiếng Việt ở đây.
- source_word: πνεύματος
  choice: Thánh Linh
  rationale: Mạch văn nói đến tác động đến từ Đức Chúa Trời và sau đó nêu rõ Thánh Linh của Đức Chúa Trời; cách hiểu không viết hoa vẫn được giữ trong chú thích.
- source_word: δυνάμεως
  choice: quyền năng
  rationale: Là cách diễn đạt trang trọng, quen thuộc và phù hợp cho sức mạnh mang tính thần linh trong văn cảnh Phao-lô.
theological_decisions:
- issue: πνεύματος chỉ Thánh Linh hay linh/thần khí
  choice: Thánh Linh
  alternative: linh hoặc thần khí
  rationale: Văn mạch rộng hơn của chương 2 nói rõ về Thánh Linh của Đức Chúa Trời, nên đây là cách hiểu có xác suất cao hơn; tuy nhiên, hình thức Hy Lạp tự nó không viết hoa và vẫn cho phép cách hiểu khác, vì vậy phương án ấy được ghi chú.
- issue: Quan hệ của πειθοῖ σοφίας
  choice: sự khôn ngoan đầy sức thuyết phục
  alternative: những lời thuyết phục của sự khôn ngoan
  rationale: Cấu trúc Hy Lạp cô đọng và có vấn đề dị bản/cách phân tích; bản chính không thêm 'lời', còn cách hiểu có 'những lời' được bảo lưu trong chú thích để không xóa bỏ sự nhập nhằng.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng cấu trúc song song “không dựa vào... nhưng dựa vào...” để chuyển tải hai cụm ἐν tương phản một cách tự nhiên. Dấu phẩy cuối câu được giữ theo phần câu do người dùng cung cấp.
