source:
  edition: SBLGNT
  text: ἀλλὰ λαλοῦμεν ⸂θεοῦ σοφίαν⸃ ἐν μυστηρίῳ, τὴν ἀποκεκρυμμένην, ἣν προώρισεν ὁ θεὸς πρὸ τῶν αἰώνων εἰς δόξαν ἡμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/007.yaml
  text: But we speak God's wisdom in a mystery[c][b][a], the hidden wisdom that God predestined before the ages for our glory.
translation:
  language: vi
  text: 'Nhưng chúng tôi nói về sự khôn ngoan của Đức Chúa Trời: một huyền nhiệm[a], tức là sự khôn ngoan đã được che giấu, mà Đức Chúa Trời đã định trước[b] từ trước muôn đời[c] cho vinh quang của chúng ta.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “một điều kín giấu.” Từ Hy Lạp ở đây là “huyền nhiệm,” một từ Phao-lô thường dùng để chỉ kế hoạch của Đức Chúa Trời trước kia bị che giấu nhưng nay được bày tỏ.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “đã tiền định” hoặc “đã quyết định từ trước.”'
    reason: lexical_alternative
  - marker: c
    text: 'Nguyên văn: “trước các thời đại”; cũng có thể dịch: “trước mọi thời đại.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: λαλοῦμεν
  choice: chúng tôi nói
  rationale: “Nói” diễn đạt nghĩa thông thường của động từ và giữ được tính đối chiếu trong mạch văn, không cường điệu thành một lời công bố chính thức.
- source_word: θεοῦ σοφίαν
  choice: sự khôn ngoan của Đức Chúa Trời
  rationale: Cách dịch sở hữu tự nhiên trong tiếng Việt, cho thấy sự khôn ngoan này thuộc về và đến từ Đức Chúa Trời.
- source_word: ἐν μυστηρίῳ
  choice: trong một huyền nhiệm
  rationale: '“Huyền nhiệm” giữ được sắc thái Phao-lô thường dùng: ý định của Đức Chúa Trời từng bị che giấu nhưng nay được bày tỏ; cách dịch này tránh nghĩa một điều khó hiểu đơn thuần.'
- source_word: τὴν ἀποκεκρυμμένην
  choice: tức là sự khôn ngoan đã được giấu kín
  rationale: Phân từ giống cái quy chiếu về “sự khôn ngoan”; lặp lại danh từ giúp tiếng Việt rõ nghĩa, còn “tức là” thể hiện quan hệ đồng vị.
- source_word: προώρισεν
  choice: đã định trước
  rationale: Diễn đạt trực tiếp hành động quyết định từ trước của Đức Chúa Trời, đồng thời không tự động gắn câu này với một hệ thống thần học riêng.
- source_word: πρὸ τῶν αἰώνων
  choice: từ trước muôn đời
  rationale: 'Cách nói tự nhiên và trang trọng trong tiếng Việt, giữ ý nghĩa thời gian-vũ trụ của αἰῶνες: trước mọi thời đại.'
- source_word: εἰς δόξαν ἡμῶν
  choice: để chúng ta được vinh quang
  rationale: Diễn đạt tự nhiên hướng đích của εἰς và bảo toàn sức nặng thần học của δόξα mà không thu hẹp thành “danh dự”.
theological_decisions:
- issue: Sắc thái thần học của προώρισεν trong văn mạch Phao-lô
  choice: đã định trước
  alternative: đã tiền định; đã quyết định từ trước
  rationale: “Đã định trước” giữ nguyên ý về quyết định có trước của Đức Chúa Trời nhưng không nhập vào câu một nội hàm hệ phái vượt quá điều động từ tự nó khẳng định.
- issue: Ý nghĩa của ἐν μυστηρίῳ
  choice: trong một huyền nhiệm
  alternative: trong điều kín giấu; như một huyền nhiệm
  rationale: Giữ thuật ngữ mang sắc thái thần học về kế hoạch từng được giấu kín của Đức Chúa Trời, thay vì giải thích nó chỉ như bí mật hoặc điều khó hiểu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Trời” nhất quán; “huyền nhiệm” bảo toàn thuật ngữ thần học của Phao-lô, còn chú thích làm rõ nghĩa. Cấu trúc đồng vị được thể hiện bằng “tức là” để câu tiếng Việt mạch lạc.
