revisions:
- from: Nhưng chúng tôi nói sự khôn ngoan của Đức Chúa Trời trong một huyền nhiệm[a], tức là sự khôn ngoan đã được giấu kín, mà Đức Chúa Trời đã định trước[b] từ trước muôn đời[c] để chúng ta được vinh quang.
  to: 'Nhưng chúng tôi nói về sự khôn ngoan của Đức Chúa Trời: một huyền nhiệm[a], tức là sự khôn ngoan đã được che giấu, mà Đức Chúa Trời đã định trước[b] từ trước muôn đời[c] cho vinh quang của chúng ta.'
  rationale: Bản sửa thay cấu trúc calque “trong một huyền nhiệm” bằng cách nói đồng vị tự nhiên, nhưng vẫn bảo toàn sự liên kết của μυστήριον với “sự khôn ngoan đã được che giấu.” Chú thích a được điều chỉnh để khớp với vị trí và cách dịch mới. Phần kết được sửa thành “cho vinh quang của chúng ta” để phản ánh sát εἰς δόξαν ἡμῶν hơn và đọc tự nhiên hơn.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T18:10:37Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp chuyển tải đúng các thành tố chính của câu Hy Lạp: sự khôn ngoan thuộc về Đức Chúa Trời, χαρακτήρ huyền nhiệm/ẩn giấu, việc Đức Chúa Trời định trước trước các thời đại, và mục đích hướng đến vinh quang của chúng ta. Tuy nhiên, “nói ... trong một huyền nhiệm” là lối bám sát cấu trúc tiếng Hy Lạp nhưng chưa tự nhiên trong tiếng Việt; “để chúng ta được vinh quang” cũng diễn đạt εἰς δόξαν ἡμῶν chưa gọn và hơi bất thường.'
  naturalness: 'Đổi sang cấu trúc đồng vị tự nhiên hơn trong tiếng Việt: “nói về ...: một huyền nhiệm, tức là ...”. “Cho vinh quang của chúng ta” giữ được cấu trúc hướng đích của εἰς mà không thêm một diễn giải cụ thể về cách con người nhận vinh quang đó.'
  terminology: Giữ “Đức Chúa Trời”, “huyền nhiệm”, và “đã định trước”. “Huyền nhiệm” thích hợp với μυστήριον trong cách dùng của Phao-lô và phần chú thích giải thích nghĩa kế hoạch từng bị che giấu nay được bày tỏ. “Đã định trước” phản ánh προώρισεν mà không áp đặt một hệ thống thần học.
  issues:
  - severity: medium
    issue: Cụm “trong một huyền nhiệm” không tự nhiên trong tiếng Việt hiện đại.
    rationale: Dù gần với ἐν μυστηρίῳ về hình thức, cụm này nghe như một bản dịch theo từng từ. Cấu trúc đồng vị “một huyền nhiệm” diễn đạt tự nhiên hơn đặc tính huyền nhiệm của sự khôn ngoan mà câu tiếp theo xác định là đã bị che giấu.
  - severity: low
    issue: “để chúng ta được vinh quang” chưa phải cách diễn đạt tự nhiên cho εἰς δόξαν ἡμῶν.
    rationale: Cụm này dễ gây cảm giác lược bỏ động từ cần thiết trong tiếng Việt. “Cho vinh quang của chúng ta” bảo toàn trực tiếp quan hệ mục đích của nguyên ngữ, đồng thời không diễn giải quá mức.
