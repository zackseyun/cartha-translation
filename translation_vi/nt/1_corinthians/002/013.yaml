  rationale: Giữ nguyên bản dịch chính vì nó là một cách hiểu có cơ sở của cú pháp khó ở mệnh đề cuối và phù hợp với mạch đối chiếu về lời lẽ. Chỉ sửa chú thích để loại bỏ sai sót về giống ngữ pháp của λόγοις, đồng thời bảo tồn trung thực hai cách hiểu khả dĩ của πνευματικοῖς.
