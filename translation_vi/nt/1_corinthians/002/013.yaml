reference: 1 Corinthians 2:13
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἃ καὶ λαλοῦμεν οὐκ ἐν διδακτοῖς ἀνθρωπίνης σοφίας λόγοις, ἀλλ’ ἐν διδακτοῖς ⸀πνεύματος, πνευματικοῖς πνευματικὰ συγκρίνοντες.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/013.yaml
  text: These things we also speak[a], not in words taught by human wisdom, but in those taught by the Spirit, interpreting spiritual things to spiritual people.
translation:
  language: vi
  text: Những điều ấy, chúng tôi cũng nói ra, không bằng lời lẽ do sự khôn ngoan của loài người dạy, nhưng bằng lời lẽ do Thánh Linh dạy, diễn giải những điều thuộc linh bằng những lời thuộc linh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “giải thích những điều thuộc linh cho những người thuộc linh.” Từ Hy Lạp πνευματικοῖς có thể được hiểu là chỉ “những người thuộc linh,” thay vì bổ nghĩa cho danh từ “lời” (được ngầm hiểu) trong cách dịch “bằng những lời thuộc linh.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ἃ καὶ λαλοῦμεν
  choice: Những điều ấy, chúng tôi cũng nói ra
  rationale: “Những điều ấy” chỉ về các chân lý vừa được nhắc đến; “nói ra” giữ sắc thái truyền đạt bằng lời của λαλοῦμεν và diễn đạt tự nhiên trong tiếng Việt.
- source_word: οὐκ ἐν διδακτοῖς ἀνθρωπίνης σοφίας λόγοις
  choice: không bằng lời lẽ do sự khôn ngoan của loài người dạy
  rationale: “Bằng” thể hiện giá trị phương tiện của ἐν; “lời lẽ” phù hợp với λόγοις trong sự đối chiếu về cách diễn đạt, còn “loài người” làm rõ nguồn gốc thuần túy con người của sự khôn ngoan này.
- source_word: ἀλλ’ ἐν διδακτοῖς πνεύματος
  choice: nhưng bằng lời lẽ do Thánh Linh dạy
  rationale: “Lời lẽ” được bổ sung từ λόγοις ở vế trước theo phép tỉnh lược của tiếng Hy Lạp. Văn cảnh nói rõ πνεύματος là Thánh Linh của Đức Chúa Trời.
- source_word: πνευματικοῖς πνευματικὰ συγκρίνοντες
  choice: diễn giải những điều thuộc linh bằng những lời thuộc linh
  rationale: Cách dịch này hiểu πνευματικοῖς là giống trung, với “lời” được ngầm hiểu, và nối tự nhiên với sự đối chiếu ngay trước đó giữa các loại lời lẽ. “Diễn giải” phản ánh nghĩa giải thích/diễn đạt của συγκρίνοντες mà không loại bỏ cách phân tích cú pháp khác, được ghi ở chú thích.
theological_decisions:
- issue: Chủ thể được nói đến bởi πνεύματος
  choice: Thánh Linh
  alternative: linh hoặc một nguồn thuộc linh nói chung
  rationale: Toàn bộ lập luận gần kề trong 1 Cô-rinh-tô 2 nhiều lần nói đến Thánh Linh của Đức Chúa Trời và đối chiếu sự mặc khải của Ngài với sự khôn ngoan của loài người.
- issue: Cách hiểu πνευματικοῖς trong mệnh đề cuối
  choice: 'giống trung: bằng những lời thuộc linh'
  alternative: 'giống đực: cho những người thuộc linh'
  rationale: Cả hai cách phân tích đều có thể có về mặt hình thái. Bản chính ưu tiên giống trung vì mạch văn đang đối chiếu lời lẽ do sự khôn ngoan loài người dạy với lời lẽ do Thánh Linh dạy; cách hiểu giống đực được giữ trong chú thích để bảo tồn tính mơ hồ thật của nguyên văn.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, dùng “lời lẽ” để làm rõ sự đối chiếu về phương tiện diễn đạt. “Thuộc linh” được giữ vì vừa ngắn gọn vừa bảo tồn mối liên hệ lặp lại với Thánh Linh trong nguyên văn.
