id: 1CO.2.5
reference: 1 Corinthians 2:5
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἵνα ἡ πίστις ὑμῶν μὴ ᾖ ἐν σοφίᾳ ἀνθρώπων ἀλλ’ ἐν δυνάμει θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/005.yaml
  text: so that your faith might not be in the wisdom of men[a], but in the power of God.
translation:
  language: vi
  text: để đức tin của anh chị em không dựa vào sự khôn ngoan của loài người, nhưng dựa vào quyền năng của Đức Chúa Trời.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἵνα
  choice: để
  rationale: Diễn đạt tự nhiên mệnh đề chỉ mục đích trong tiếng Việt, đồng thời giữ lực hướng đích của ἵνα.
- source_word: ἡ πίστις ὑμῶν
  choice: đức tin của anh chị em
  rationale: πίστις ở đây nói đến sự tin cậy, đáp ứng bằng đức tin của các tín hữu Cô-rinh-tô; ὑμῶν là số nhiều. “Anh chị em” truyền đạt trực tiếp và bao quát cộng đồng được مخاط đến.
- source_word: μὴ ᾖ ἐν
  choice: không dựa vào
  rationale: Trong sự đối lập giữa σοφία và δύναμις, ἐν diễn tả nền tảng hoặc chỗ nương dựa của đức tin. “Dựa vào” tự nhiên hơn lối dịch máy móc “ở trong” và vẫn giữ phép song song.
- source_word: σοφίᾳ ἀνθρώπων
  choice: sự khôn ngoan của loài người
  rationale: ἀνθρώπων chỉ con người nói chung, không riêng nam giới. “Loài người” giữ sắc thái đối lập giữa nhân loại và Đức Chúa Trời mà không tạo hàm ý giới tính không có trong ngữ cảnh.
- source_word: δυνάμει θεοῦ
  choice: quyền năng của Đức Chúa Trời
  rationale: Giữ nguyên sự đối lập cân xứng với “sự khôn ngoan của loài người”; “quyền năng” là cách diễn đạt trang trọng, quen thuộc cho δύναμις.
theological_decisions:
- issue: Ý nghĩa của giới từ ἐν trong hai cụm đối lập
  choice: Dịch là “dựa vào” ở cả hai vế
  alternative: “ở trong” hoặc “đặt nơi”
  rationale: Câu nói về nền tảng mà đức tin nương dựa, nhưng không cần xác định sâu hơn cơ chế thần học. Lặp lại “dựa vào” làm rõ sự đối lập và giữ tính cân xứng của nguyên văn.
- issue: Phạm vi giới tính của ἀνθρώπων
  choice: “loài người”
  alternative: “người ta”, “con người”, hoặc “những người nam”
  rationale: Dạng số nhiều ἀνθρώπων ở đây chỉ nhân loại nói chung trong thế đối lập với Đức Chúa Trời. “Loài người” bảo toàn ý nghĩa phổ quát và không thu hẹp thành nam giới.
- issue: Sắc thái của πίστις
  choice: “đức tin”
  alternative: “lòng tin” hoặc “sự trung tín”
  rationale: Trong ngữ cảnh, từ này chỉ sự tin cậy của người Cô-rinh-tô, không phải phẩm chất trung tín. “Đức tin” vừa chính xác vừa phù hợp văn phong Kinh Thánh hiện đại.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc hai vế song song được giữ bằng cách lặp lại “dựa vào”; “anh chị em” thể hiện rõ đại từ số nhiều và cộng đồng gồm cả nam lẫn nữ.
