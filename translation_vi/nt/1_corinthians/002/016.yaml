  source_fidelity: 'Bản dịch giữ đúng cấu trúc và ý chính của nguyên văn: γάρ được phản ánh bằng “Vì”; câu hỏi tu từ về việc biết tâm trí của Chúa và chỉ dạy Ngài được giữ nguyên; và sự đối lập δέ dẫn đến lời khẳng định “chúng ta có tâm trí của Đấng Mê-si” được truyền đạt rõ. “mà có thể chỉ dạy Ngài” diễn đạt tự nhiên giá trị tu từ/hệ quả của mệnh đề quan hệ ὃς συμβιβάσει αὐτόν, không khẳng định rằng ai thực sự có thể làm điều ấy.'
