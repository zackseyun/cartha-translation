id: 1CO.2.16
reference: 1 Corinthians 2:16
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τίς γὰρ ἔγνω νοῦν κυρίου, ὃς συμβιβάσει αὐτόν; ἡμεῖς δὲ νοῦν Χριστοῦ ἔχομεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/016.yaml
  text: For who has known the mind of the Lord[b][a], that he may instruct him? But we have the mind of Messiah.
translation:
  language: vi
  text: Vì ai đã biết tâm trí của Chúa[b] mà có thể chỉ dạy Ngài? Nhưng chúng ta có tâm trí của Đấng Mê-si[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “tâm trí của Đấng Ki-tô.”'
    reason: lexical_alternative
  - marker: b
    text: Phao-lô gợi lại Ê-sai 40:13.
    reason: cross_reference
lexical_decisions:
- source_word: τίς
  choice: ai
  rationale: Mở đầu câu hỏi tu từ một cách trực tiếp và tự nhiên trong tiếng Việt.
- source_word: γὰρ
  choice: vì
  rationale: Giữ mối liên kết giải thích với lập luận ngay trước đó.
- source_word: ἔγνω
  choice: đã biết
  rationale: Diễn đạt thể aorist trong câu trích dẫn tu từ, nói đến việc biết được tâm trí của Chúa.
- source_word: νοῦν
  choice: tâm trí
  rationale: Bao quát cả tư tưởng, sự hiểu biết và khuynh hướng nội tâm, đồng thời tự nhiên hơn cách dùng đơn độc từ “trí” trong tiếng Việt hiện đại.
- source_word: κυρίου
  choice: Chúa
  rationale: Giữ danh xưng quen thuộc và âm hưởng Kinh Thánh của lời trích từ Ê-sai.
- source_word: ὃς συμβιβάσει αὐτόν
  choice: mà có thể chỉ dạy Ngài
  rationale: Chuyển câu quan hệ Hy Lạp thành lối hỏi tu từ tự nhiên trong tiếng Việt; “chỉ dạy” truyền đạt nghĩa hướng dẫn hoặc dạy bảo mà không hàm ý chỉ cung cấp thông tin.
- source_word: ἡμεῖς δὲ
  choice: Nhưng chúng ta
  rationale: Thể hiện rõ sự tương phản mạnh giữa việc không ai có thể chỉ dạy Chúa và lời khẳng định tiếp theo của Phao-lô.
- source_word: Χριστοῦ
  choice: của Đấng Mê-si
  rationale: Giữ sắc thái tước hiệu của Χριστός và mối liên hệ với niềm mong đợi về Đấng được xức dầu.
- source_word: ἔχομεν
  choice: có
  rationale: Động từ hiện tại đơn giản phù hợp với lời khẳng định trực tiếp của nguyên văn.
theological_decisions:
- issue: Cách dịch Χριστοῦ trong cụm νοῦν Χριστοῦ
  choice: tâm trí của Đấng Mê-si
  alternative: tâm trí của Đấng Ki-tô
  rationale: Dịch Χριστός như một tước hiệu để giữ sắc thái “Đấng được xức dầu”; chú thích cung cấp cách gọi truyền thống quen thuộc mà không thay đổi nội dung thần học.
- issue: Chủ thể của đại từ αὐτόν
  choice: Ngài, chỉ về Chúa
  alternative: ông ấy/người ấy
  rationale: Trong câu trích dẫn, đại từ chỉ về “Chúa”; viết hoa “Ngài” giúp tiếng Việt rõ nghĩa nhưng không bổ sung một chủ thể mới.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, dùng câu hỏi tu từ tự nhiên. “Tâm trí” được lặp lại để giữ liên kết từ vựng νοῦν…νοῦν của nguyên văn; “chỉ dạy Ngài” giữ nghịch lý thần học của câu trích dẫn.
source_grounding:
  english_pob_role: consult_only
