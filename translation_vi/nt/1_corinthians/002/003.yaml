  text: κἀγὼ ἐν ἀσθενείᾳ καὶ ἐν φόβῳ καὶ ἐν τρόμῳ πολλῷ ἐγενόμην πρὸς ὑμᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/003.yaml
  text: And I was with you in weakness[a], in fear, and in great trembling,
translation:
  language: vi
  text: Còn tôi đã ở với anh chị em trong sự yếu đuối, sợ hãi và hết sức run rẩy.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Còn tôi đã đến với anh chị em trong sự yếu đuối, sợ hãi và hết sức run rẩy.”'
    reason: Giữ cách hiểu khả hữu của ἐγενόμην πρὸς ὑμᾶς theo hướng việc Phao-lô đến với người Cô-rinh-tô, thay vì chỉ tình trạng ông ở giữa họ.
lexical_decisions:
- source_word: κἀγώ
  choice: Còn tôi
  rationale: Giữ lực nối tiếp và tương phản nhẹ với câu trước, đồng thời nêu rõ chủ thể là Phao-lô mà không thêm sắc thái nhấn mạnh quá mức.
- source_word: ἐν ἀσθενείᾳ
  choice: trong sự yếu đuối
  rationale: Giữ phạm vi nghĩa rộng của ἀσθένεια, có thể chỉ tình trạng yếu đuối hoặc mong manh, mà không tự ý quy thành bệnh tật hay thiếu năng lực.
- source_word: ἐν φόβῳ
  choice: trong nỗi sợ hãi
  rationale: Diễn đạt trực tiếp φόβος như một trạng thái sợ hãi, không làm nhẹ thành sự kính sợ hoặc thận trọng.
- source_word: ἐν τρόμῳ πολλῷ
  choice: run rẩy rất nhiều
  rationale: Giữ danh ý của τρόμος và sức nhấn của πολλῷ bằng một cách nói tự nhiên, dễ hiểu trong tiếng Việt hiện đại.
- source_word: ἐγενόμην πρὸς ὑμᾶς
  choice: đã ở với anh chị em
  rationale: Trong mạch văn, cụm này có thể mô tả tình trạng của Phao-lô khi hiện diện giữa người Cô-rinh-tô; cách hiểu theo hướng ông đến với họ vẫn khả hữu và được giữ trong chú thích.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “anh chị em” để chỉ cộng đồng tín hữu; giữ ba trạng thái song song của nguyên văn và không giải thích nguyên nhân của sự sợ hãi hay run rẩy.
