id: 1CO.2.2
reference: 1 Corinthians 2:2
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οὐ γὰρ ἔκρινά ⸂τι εἰδέναι⸃ ἐν ὑμῖν εἰ μὴ Ἰησοῦν Χριστὸν καὶ τοῦτον ἐσταυρωμένον·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/002.yaml
  text: For I decided to know nothing among you except Jesus the Messiah—and him crucified[a].
translation:
  language: vi
  text: Vì tôi đã quyết định không biết gì khi ở giữa anh chị em, ngoài Giê-su, Đấng Mê-si-a—và chính Ngài đã bị đóng đinh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch là “Giê-su Christ.” Tiếng Hy Lạp: “Giê-su, Đấng Mê-si-a.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔκρινά
  choice: đã quyết định
  rationale: Trong ngữ cảnh này, động từ diễn tả một chủ ý đã được xác lập, không phải sự phán xét theo nghĩa tư pháp.
- source_word: τι εἰδέναι
  choice: không biết gì
  rationale: 'Kết hợp với οὐ và εἰ μὴ, cụm từ tạo thành cấu trúc hạn định: không biết gì ngoài đối tượng được nêu.'
- source_word: ἐν ὑμῖν
  choice: khi ở giữa anh chị em
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt, chỉ hoàn cảnh Phao-lô hiện diện và thi hành chức vụ giữa cộng đồng Cô-rinh-tô.
- source_word: εἰ μὴ
  choice: ngoài
  rationale: Truyền đạt rõ nghĩa ngoại trừ của cấu trúc Hy Lạp.
- source_word: Χριστόν
  choice: Đấng Mê-si-a
  rationale: Ở đây Χριστός mang sức nặng của tước hiệu dành cho Chúa Giê-su; cách dịch này làm rõ chức vị mà không biến nó thành tên riêng thuần túy.
- source_word: τοῦτον ἐσταυρωμένον
  choice: chính Ngài là Đấng đã bị đóng đinh trên thập tự giá
  rationale: “Chính Ngài” giữ sự nhấn mạnh của đại từ τοῦτον; “đã bị đóng đinh” phản ánh phân từ hoàn thành bị động, còn “trên thập tự giá” giúp câu tiếng Việt rõ và tự nhiên.
theological_decisions:
- issue: Cách dịch Χριστός
  choice: Đấng Mê-si-a
  alternative: Đấng Christ
  rationale: Ngữ cảnh nhấn mạnh căn tính và chức vị cứu thế của Chúa Giê-su, nên dịch tước hiệu; cách gọi truyền thống được giữ trong chú thích.
- issue: Sức nhấn mạnh của τοῦτον ἐσταυρωμένον
  choice: chính Ngài là Đấng đã bị đóng đinh trên thập tự giá
  alternative: Ngài đã bị đóng đinh trên thập tự giá
  rationale: Giữ sự nhấn mạnh vào chính Chúa Giê-su và tình trạng Ngài là Đấng đã chịu đóng đinh, thay vì làm mờ đại từ chỉ định.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” cho số nhiều ὑμῖν và viết hoa đại từ “Ngài” theo lối văn Cơ Đốc phổ biến. Dấu gạch ngang bảo lưu nhịp nhấn mạnh của mệnh đề cuối.
