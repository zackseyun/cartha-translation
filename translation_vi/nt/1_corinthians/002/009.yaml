id: 1CO.2.9
reference: 1 Corinthians 2:9
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀλλὰ καθὼς γέγραπται· Ἃ ὀφθαλμὸς οὐκ εἶδεν καὶ οὖς οὐκ ἤκουσεν καὶ ἐπὶ καρδίαν ἀνθρώπου οὐκ ἀνέβη, ⸀ὅσα ἡτοίμασεν ὁ θεὸς τοῖς ἀγαπῶσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/009.yaml
  text: But just as it is written[a], “What no eye has seen, and no ear has heard[b], and what has not entered into the heart of man—what God has prepared for those who love him.”
translation:
  language: vi
  text: 'Nhưng như có lời chép rằng:


    “Điều mắt chưa thấy,

    tai chưa nghe,

    và lòng người chưa hề nghĩ tới—[a]

    đó là những điều Đức Chúa Trời đã chuẩn bị cho những người yêu mến Ngài.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “chưa hề nảy lên trong lòng người” hoặc “chưa hề đi vào lòng người.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Nhưng
  rationale: Diễn tả sự tương phản với ý đi trước một cách ngắn gọn và tự nhiên.
- source_word: καθὼς γέγραπται
  choice: như có lời chép rằng
  rationale: Giữ công thức dẫn Kinh Thánh và sắc thái một lời đã được ghi chép, đồng thời phù hợp văn phong Kinh Thánh tiếng Việt hiện đại.
- source_word: Ἃ ... ὅσα
  choice: Điều ... đó là những điều
  rationale: Thể hiện cấu trúc tương liên rồi lặp lại để xác định nội dung trong tiếng Hy Lạp; cách diễn đạt này rõ ràng và vẫn giữ nhịp thơ.
- source_word: ὀφθαλμὸς ... οὖς
  choice: mắt ... tai
  rationale: Giữ danh từ số ít mang nghĩa khái quát và phép song hành của nguyên văn.
- source_word: ἐπὶ καρδίαν ἀνθρώπου οὐκ ἀνέβη
  choice: lòng người chưa hề nghĩ tới
  rationale: Trong thành ngữ này, hình ảnh điều gì đó ‘đi lên trên lòng’ diễn tả điều chưa nảy sinh trong nội tâm hay ý nghĩ. ‘Lòng người chưa hề nghĩ tới’ tự nhiên trong tiếng Việt, vẫn giữ ‘lòng’ và không thu hẹp ἀνθρώπου vào riêng nam giới.
- source_word: ἡτοίμασεν
  choice: đã chuẩn bị
  rationale: Thể hiện hành động hoàn tất của động từ aorist mà không áp đặt thêm sắc thái thời gian ngoài ngữ cảnh.
- source_word: τοῖς ἀγαπῶσιν αὐτόν
  choice: cho những người yêu mến Ngài
  rationale: Diễn đạt tự nhiên phân từ hiện tại như một đặc điểm đang tiếp diễn; ‘yêu mến’ phù hợp văn phong trang trọng, còn ‘Ngài’ có quy chiếu rõ đến Đức Chúa Trời.
theological_decisions:
- issue: Cách hiểu καρδία và ἀνέβη trong thành ngữ
  choice: lòng người chưa hề nghĩ tới
  alternative: chưa hề nảy lên trong lòng người; chưa hề đi vào lòng người
  rationale: Giữ phạm vi nội tâm của καρδία nhưng diễn đạt chức năng thành ngữ của οὐκ ἀνέβη bằng tiếng Việt dễ hiểu, không biến ‘lòng’ thành thuật ngữ thuần lý trí.
- issue: Phạm vi của ἀνθρώπου
  choice: người
  alternative: con người; một người
  rationale: ἀνθρώπου ở đây là số ít khái quát, chỉ loài người nói chung; ‘người’ vừa chính xác vừa tự nhiên và không hàm ý chỉ nam giới.
- issue: Đối tượng được Đức Chúa Trời chuẩn bị
  choice: những điều
  alternative: điều
  rationale: ὅσα là đại từ quan hệ trung tính số nhiều, chỉ toàn bộ những điều Đức Chúa Trời đã chuẩn bị; giữ số nhiều mà không xác định cụ thể bản chất của chúng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu; giữ bố cục thơ của câu trích dẫn. Dùng ‘Đức Chúa Trời’ và đại từ kính trọng ‘Ngài’ theo lối Tin Lành tiếng Việt quen thuộc, nhưng không thêm diễn giải giáo phái. Dấu gạch ngang thể hiện phần ὅσα lặp lại và tổng kết ba mệnh đề trước.
