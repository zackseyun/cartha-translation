id: 1CO.2.11
reference: 1 Corinthians 2:11
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τίς γὰρ οἶδεν ἀνθρώπων τὰ τοῦ ἀνθρώπου εἰ μὴ τὸ πνεῦμα τοῦ ἀνθρώπου τὸ ἐν αὐτῷ; οὕτως καὶ τὰ τοῦ θεοῦ οὐδεὶς ⸀ἔγνωκεν εἰ μὴ τὸ πνεῦμα τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/011.yaml
  text: For who among people knows the things of a person except the spirit of the person that is in him? In the same way[b][a], no one has known the things of God except the Spirit of God.
translation:
  language: vi
  text: Vì ai trong loài người biết những điều thuộc về một người, nếu không phải là thần trí của người ấy ở trong người ấy? Cũng vậy, không ai biết những điều thuộc về Đức Chúa Trời, nếu không phải là Thánh Linh của Đức Chúa Trời.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνθρώπων / ἀνθρώπου
  choice: trong loài người / một người
  rationale: Các danh từ ở đây chỉ con người nói chung, không mang nghĩa riêng về nam giới. Cách dịch này tự nhiên trong tiếng Việt và giữ được sự chuyển đổi giữa tập thể và cá thể của câu Hy Lạp.
- source_word: τὰ τοῦ ἀνθρώπου
  choice: những điều thuộc về một người
  rationale: Cụm từ có phạm vi rộng, chỉ những gì ở bên trong hoặc liên quan sâu xa đến một người, chứ không chỉ riêng các ý nghĩ; cách dịch này cũng giữ được cấu trúc song song với τὰ τοῦ θεοῦ.
- source_word: πνεῦμα τοῦ ἀνθρώπου
  choice: tâm linh của người ấy
  rationale: “Tâm linh” phân biệt πνεῦμα với “tâm trí” hay “ý nghĩ,” đồng thời duy trì sự đối chiếu với Thánh Linh của Đức Chúa Trời.
- source_word: τὸ ἐν αὐτῷ
  choice: ở trong người ấy
  rationale: Dịch sát cụm chỉ vị trí bên trong mà không diễn giải thêm thành một thuật ngữ nhân học chuyên biệt.
- source_word: οὕτως καὶ
  choice: Cũng vậy
  rationale: Diễn đạt tự nhiên phép so sánh tương ứng chặt chẽ giữa sự hiểu biết của con người và sự hiểu biết của Thánh Linh.
- source_word: ἔγνωκεν
  choice: biết
  rationale: Thì hoàn thành Hy Lạp có kết quả hiện tại trong văn cảnh. Tiếng Việt không biến đổi thì; “biết” diễn đạt tự nhiên trạng thái nhận biết hiện hành và tương ứng với οἶδεν ở vế trước.
- source_word: τὰ τοῦ θεοῦ
  choice: những điều thuộc về Đức Chúa Trời
  rationale: Giữ phạm vi rộng có chủ ý và sự song song với “những điều thuộc về một người,” không thu hẹp thành “ý tưởng” hay “tư tưởng.”
- source_word: πνεῦμα τοῦ θεοῦ
  choice: Thánh Linh của Đức Chúa Trời
  rationale: Trong văn cảnh gần, cụm từ chỉ chính Thần Linh của Đức Chúa Trời, Đấng dò xét và bày tỏ những điều sâu nhiệm của Ngài. “Thánh Linh” là cách gọi tự nhiên, trang trọng trong tiếng Việt.
theological_decisions:
- issue: πνεῦμα τοῦ θεοῦ là danh xưng chỉ Thánh Linh có ngôi vị hay chỉ “thần linh của Đức Chúa Trời” theo nghĩa không danh xưng.
  choice: Thánh Linh của Đức Chúa Trời
  alternative: thần linh của Đức Chúa Trời
  rationale: Văn cảnh 1 Cô-rinh-tô 2 nói đến Thần Linh dò xét và mặc khải những điều của Đức Chúa Trời. Cách viết hoa và từ “Thánh Linh” nhận diện sở chỉ theo văn cảnh mà không thêm chi tiết tín lý ngoài câu.
- issue: Có nên thu hẹp τὰ τοῦ ἀνθρώπου và τὰ τοῦ θεοῦ thành “tư tưởng” hay không.
  choice: 'Giữ nghĩa rộng: “những điều thuộc về…”'
  alternative: “tư tưởng của…”
  rationale: Nguyên văn dùng một kết cấu sở hữu rộng, không có danh từ “tư tưởng.” Giữ nghĩa rộng bảo toàn sự mơ hồ và phép song song thần học của câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Trời” và “Thánh Linh” nhất quán với lối diễn đạt Kinh Thánh Tin Lành phổ biến, nhưng không thêm thuật ngữ giáo phái. Lặp “người ấy” để phản ánh rõ đại từ số ít αὐτῷ và tránh đại từ mang giới tính.
