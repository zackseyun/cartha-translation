  terminology: Dùng “người thuộc linh” cho πνευματικός phù hợp cách dùng Kinh Thánh tiếng Việt và không áp đặt cách hiểu “thuộc về” theo nghĩa sở hữu. “Xem xét” được lặp lại nhất quán cho hai dạng chủ động/bị động của ἀνακρίνω; các phương án “khảo xét”, “phân định”, “đánh giá” nên được giữ trong chú thích.
