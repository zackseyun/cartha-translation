  source_fidelity: Bản nháp bảo toàn cấu trúc đối lập, tính bao quát của τὰ πάντα (“mọi sự”), sự nhấn mạnh của αὐτός (“chính người ấy”), phủ định tuyệt đối của ὑπ’ οὐδενός, và sự lặp lại của ἀνακρίνω. Tuy nhiên, “thuộc về Thánh Linh” diễn giải πνευματικός hẹp hơn cách diễn đạt tính từ của nguyên ngữ; “thuộc linh” là thuật ngữ tiếng Việt chuẩn, giữ được tính từ nguyên bản và vẫn được văn cảnh xác định liên hệ với Thánh Linh.
