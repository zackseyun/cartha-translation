source:
  edition: SBLGNT
  text: ὁ δὲ πνευματικὸς ἀνακρίνει ⸀τὰ πάντα, αὐτὸς δὲ ὑπ’ οὐδενὸς ἀνακρίνεται.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/015.yaml
  text: But the spiritual person evaluates all things[b][a], yet he himself is evaluated by no one.
translation:
  language: vi
  text: Nhưng người thuộc linh[a] xem xét[b] mọi sự, còn chính người ấy thì không bị ai xem xét.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Người thuộc linh” dịch một tính từ giống đực số ít được dùng như danh từ, chỉ chung một người được đặc trưng bởi Thánh Linh, chứ không chỉ riêng nam giới.
    reason: cultural_note
  - marker: b
    text: Cũng có thể dịch động từ này trong cả hai lần xuất hiện là “khảo xét”, “phân định” hoặc “đánh giá”.
    reason: lexical_alternative
lexical_decisions:
- source_word: πνευματικὸς
  choice: người thuộc về Thánh Linh
  rationale: Tính từ số ít giống đực được dùng như danh từ và chỉ chung một người có đặc tính do Thánh Linh. Cách dịch này tự nhiên trong tiếng Việt, không giới hạn vào nam giới, đồng thời làm rõ nét tương phản trong văn cảnh với người không có Thánh Linh.
- source_word: ἀνακρίνει
  choice: xem xét
  rationale: Động từ ở đây diễn tả việc khảo xét, đánh giá hoặc phân định. “Xem xét” giữ được sắc thái thận trọng mà không mặc nhiên mang nghĩa kết án.
- source_word: τὰ πάντα
  choice: mọi sự
  rationale: Giữ nguyên cách diễn đạt bao quát của tiếng Hy Lạp, không tự ý giới hạn vào các vấn đề thuộc linh trong chính văn.
- source_word: αὐτὸς
  choice: chính người ấy
  rationale: “Chính” thể hiện sự nhấn mạnh của đại từ αὐτός; “người ấy” quy chiếu tự nhiên về người thuộc về Thánh Linh mà không tạo hàm ý chỉ nam giới.
- source_word: ὑπ’ οὐδενὸς
  choice: không bị ai
  rationale: Kết hợp tự nhiên với thể bị động trong tiếng Việt và bảo toàn ý phủ định tuyệt đối “bởi không một ai”.
- source_word: ἀνακρίνεται
  choice: bị ... xem xét
  rationale: Lặp lại “xem xét” để giữ sự lặp từ của ἀνακρίνω trong cả hai mệnh đề; thể bị động được bảo toàn.
theological_decisions:
- issue: Phạm vi lời khẳng định về người thuộc về Thánh Linh
  choice: Giữ nguyên lời văn không hạn định “mọi sự” và “không bị ai xem xét”.
  alternative: Thêm rõ trong chính văn rằng lời này chỉ giới hạn ở những sự thuộc linh.
  rationale: Câu Hy Lạp phát biểu theo hình thức tuyệt đối, còn văn cảnh trực tiếp định hướng cách hiểu. Thêm giới hạn vào chính văn sẽ giải quyết một căng thẳng mà nguyên bản vẫn để ngỏ.
- issue: Ý nghĩa của πνευματικός
  choice: Dịch là “người thuộc về Thánh Linh”.
  alternative: Dịch là “người thiêng liêng” hoặc “người thuộc linh”.
  rationale: Trong văn cảnh 1 Cô-rinh-tô 2, πνευματικός đối lập với ψυχικός và gắn với việc nhận lãnh Thánh Linh từ Đức Chúa Trời. Cách dịch đã chọn làm rõ mối liên hệ ấy nhưng không đưa thêm một đặc điểm hệ phái.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Thánh Linh” để thể hiện rõ πνευματικός trong văn cảnh; dùng “người ấy” thay cho đại từ mang giới tính. Hai lần xuất hiện của cùng một động từ Hy Lạp được dịch nhất quán là “xem xét”.
