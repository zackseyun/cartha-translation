id: 1CO.2.14
reference: 1 Corinthians 2:14
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ψυχικὸς δὲ ἄνθρωπος οὐ δέχεται τὰ τοῦ πνεύματος τοῦ θεοῦ, μωρία γὰρ αὐτῷ ἐστίν, καὶ οὐ δύναται γνῶναι, ὅτι πνευματικῶς ἀνακρίνεται·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/014.yaml
  text: But the natural person does not accept the things of the Spirit of God[a], for they are foolishness to him, and he is not able to know them[b], because they are spiritually discerned.
translation:
  language: vi
  text: Nhưng người sống theo bản tính tự nhiên[a] không tiếp nhận những điều thuộc về Thánh Linh của Đức Chúa Trời, vì những điều ấy là sự điên rồ đối với người ấy; người ấy cũng không thể hiểu được, bởi những điều ấy được phân định theo cách thuộc linh[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “người không thuộc linh.”'
    reason: lexical_alternative
  - marker: b
    text: Từ Hy Lạp cũng có thể mang nghĩa “nhận định”, “đánh giá” hoặc “xem xét.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ψυχικὸς
  choice: sống theo bản tính tự nhiên
  rationale: Diễn đạt người bị giới hạn trong bình diện sự sống tự nhiên của con người, tương phản với πνευματικός, nhưng không giải thích quá mức rằng người ấy có hay không có Thánh Linh.
- source_word: ἄνθρωπος
  choice: người
  rationale: Giữ nghĩa đại diện chung của danh từ, không giới hạn vào nam giới.
- source_word: δέχεται
  choice: tiếp nhận
  rationale: Bao hàm ý đón nhận và thừa nhận, phù hợp với lập luận về thái độ đối với những điều thuộc về Thánh Linh.
- source_word: τὰ τοῦ πνεύματος τοῦ θεοῦ
  choice: những điều thuộc về Thánh Linh của Đức Chúa Trời
  rationale: Giữ cấu trúc rộng của nguyên ngữ, không thu hẹp thành riêng lời dạy, sự mặc khải hay ân tứ.
- source_word: μωρία
  choice: ngu dại
  rationale: Phù hợp với sự tương phản lặp lại trong 1 Cô-rinh-tô giữa sự khôn ngoan của Đức Chúa Trời và phán đoán của con người.
- source_word: γνῶναι
  choice: hiểu được
  rationale: Trong văn cảnh, động từ chỉ khả năng nhận biết và nắm bắt đúng bản chất của những điều ấy hơn là chỉ biết dữ kiện.
- source_word: πνευματικῶς
  choice: theo cách thuộc linh
  rationale: Giữ trực tiếp sắc thái chỉ phương thức hoặc bình diện của trạng từ, không tự động đồng nhất với cách diễn đạt rõ hơn là “bởi Thánh Linh”.
- source_word: ἀνακρίνεται
  choice: được nhận định
  rationale: Thể hiện phạm vi nghĩa xem xét, đánh giá và phân định; cách dịch này giữ được độ mở của từ trong văn cảnh.
theological_decisions:
- issue: Cách diễn đạt ψυχικὸς ἄνθρωπος trong thế tương phản với sự nhận định thuộc linh
  choice: người sống theo bản tính tự nhiên
  alternative: người không thuộc linh; người không có Thánh Linh
  rationale: Cách chọn giữ sự tương phản giữa bình diện tự nhiên và thuộc linh nhưng tránh xác quyết rõ hơn nguyên ngữ về tình trạng sở hữu Thánh Linh.
- issue: Tác nhân hay phương thức trong πνευματικῶς
  choice: theo cách thuộc linh
  alternative: bởi Thánh Linh
  rationale: Nguyên ngữ dùng trạng từ và có thể gợi đến hoạt động của Thánh Linh trong văn cảnh, nhưng không nêu tác nhân một cách minh thị; bản dịch giữ sự mơ hồ này.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Thánh Linh” và “Đức Chúa Trời” theo lối gọi Tin Lành Việt ngữ quen thuộc; câu vẫn giữ đối lập và sức nặng lập luận của nguyên văn mà không thêm diễn giải hệ phái.
