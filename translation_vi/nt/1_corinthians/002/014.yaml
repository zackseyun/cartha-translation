revisions:
- from: Nhưng người sống theo bản tính tự nhiên[a] không tiếp nhận những điều thuộc về Thánh Linh của Đức Chúa Trời, vì đối với người ấy, những điều đó là ngu dại; người ấy cũng không thể hiểu được[b], bởi chúng phải được nhận định theo cách thuộc linh.
  to: Nhưng người sống theo bản tính tự nhiên[a] không tiếp nhận những điều thuộc về Thánh Linh của Đức Chúa Trời, vì những điều ấy là sự điên rồ đối với người ấy; người ấy cũng không thể hiểu được, bởi những điều ấy được phân định theo cách thuộc linh[b].
  rationale: Bản sửa loại bỏ sắc thái “phải” không có trong nguyên văn, dùng “được phân định” cho ἀνακρίνεται, chỉnh cách diễn đạt μωρία cho tự nhiên, và đặt lại chú thích b đúng tại đơn vị từ vựng mà chú thích giải thích. Không thay đổi ý nghĩa hay giải quyết theo hướng hệ phái một sự mơ hồ mà nguyên văn để mở.
  reviewer_model: gpt-5.6-terra
