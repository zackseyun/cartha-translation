id: 1CO.2.1
reference: 1 Corinthians 2:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Κἀγὼ ἐλθὼν πρὸς ὑμᾶς, ἀδελφοί, ἦλθον οὐ καθ’ ὑπεροχὴν λόγου ἢ σοφίας καταγγέλλων ὑμῖν τὸ ⸀μαρτύριον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/001.yaml
  text: And I[a], when I came to you, brothers, did not come with lofty speech or wisdom[b], proclaiming to you the testimony of God.
translation:
  language: vi
  text: Về phần tôi, thưa anh chị em[a], khi đến với anh chị em, tôi đã không đến với lời lẽ cao siêu hay sự khôn ngoan, khi công bố cho anh chị em lời chứng của Đức Chúa Trời.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Anh chị em” dịch một từ Hy Lạp ở giống đực số nhiều, nhưng trong ngữ cảnh này có thể chỉ chung các tín hữu, gồm cả phụ nữ trong hội thánh.
    reason: cultural_note
  - marker: b
    text: Một số bản chép tay ghi “mầu nhiệm của Đức Chúa Trời.”
    reason: textual_variant
lexical_decisions:
- source_word: Κἀγὼ
  choice: khi tôi … tôi
  rationale: Liên từ καί nối câu này với mạch trước, nhưng trong tiếng Việt không nhất thiết phải dịch thành “Và”; đại từ ἐγώ được thể hiện rõ bằng “tôi” mà không cường điệu sắc thái nhấn mạnh.
- source_word: ἐλθὼν … ἦλθον
  choice: khi tôi đến … tôi đã không dùng
  rationale: Chuyển kết cấu phân từ đi với động từ chính thành mệnh đề thời gian tự nhiên trong tiếng Việt; “dùng” giúp diễn đạt thành ngữ καθ’ ὑπεροχήν trong ngữ cảnh phương thức công bố.
- source_word: ἀδελφοί
  choice: anh chị em
  rationale: Trong lời gọi cộng đồng tín hữu hỗn hợp, cách xưng hô tiếng Việt “anh chị em” truyền đạt tự nhiên ý nghĩa bao hàm của từ số nhiều giống đực mà vẫn giữ sắc thái gia đình.
- source_word: καθ’ ὑπεροχὴν λόγου ἢ σοφίας
  choice: dùng lời lẽ cao siêu hay sự khôn ngoan
  rationale: “Lời lẽ cao siêu” diễn đạt sự vượt trội, gây ấn tượng của diễn ngôn; “sự khôn ngoan” giữ danh từ trừu tượng và phép đối của Phao-lô.
- source_word: καταγγέλλων
  choice: để công bố
  rationale: Diễn đạt tự nhiên quan hệ hoàn cảnh/mục đích của phân từ với việc Phao-lô đến, đồng thời giữ nghĩa loan báo công khai; không hàm ý nội dung bị giảm nhẹ.
- source_word: μαρτύριον
  choice: lời chứng
  rationale: Theo bản văn SBLGNT, μαρτύριον là “lời chứng”; lựa chọn này giữ sắc thái chứng nhận/công bố và không thay bằng dị bản “mầu nhiệm”.
- source_word: τοῦ θεοῦ
  choice: của Đức Chúa Trời
  rationale: Giữ cấu trúc sở hữu rộng của thuộc cách Hy Lạp, không quyết định đó là lời chứng đến từ Đức Chúa Trời hay lời chứng nói về Ngài.
theological_decisions:
- issue: Dị bản tại μαρτύριον
  choice: lời chứng của Đức Chúa Trời
  alternative: mầu nhiệm của Đức Chúa Trời
  rationale: Bản văn chính SBLGNT đọc μαρτύριον (“lời chứng”); dị bản μυστήριον (“mầu nhiệm”) có ý nghĩa nên được ghi ở chú thích.
- issue: Ý nghĩa của thuộc cách τοῦ θεοῦ
  choice: của Đức Chúa Trời
  alternative: từ Đức Chúa Trời / về Đức Chúa Trời
  rationale: Cách dịch “của Đức Chúa Trời” bảo toàn khả năng hiểu theo nguồn gốc hoặc nội dung, thay vì âm thầm chọn một cách giải thích.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Dùng “thưa anh chị em” như lời gọi tự nhiên trong tiếng Việt; dùng “Đức Chúa Trời” nhất quán cho θεός. Dấu chú thích [a] đặt ngay sau cụm liên quan đến cách gọi, và [b] sau toàn bộ cụm có dị bản.
