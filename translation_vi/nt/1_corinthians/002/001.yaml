revisions:
- from: Thưa anh chị em[a], khi tôi đến với anh chị em, tôi đã không dùng lời lẽ cao siêu hay sự khôn ngoan để công bố cho anh chị em lời chứng của Đức Chúa Trời.[b]
  to: Về phần tôi, thưa anh chị em[a], khi đến với anh chị em, tôi đã không đến với lời lẽ cao siêu hay sự khôn ngoan, khi công bố cho anh chị em lời chứng của Đức Chúa Trời.[b]
  rationale: Bản sửa giữ nguyên cách dịch các thuật ngữ chính và các chú thích cần thiết, đồng thời thay quan hệ mục đích do “để công bố” tạo ra bằng quan hệ hoàn cảnh trung tính hơn. “Về phần tôi” phản ánh cách thận trọng lực nối và nét nổi bật của Κἀγὼ.
