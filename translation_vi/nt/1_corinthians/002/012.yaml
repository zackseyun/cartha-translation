revisions:
- from: Còn chúng ta đã không nhận lấy tinh thần của thế gian, nhưng nhận lấy Thánh Linh đến từ Đức Chúa Trời, để chúng ta biết những điều Đức Chúa Trời đã ban cho chúng ta bởi ân điển.[a]
  to: Còn chúng ta đã không nhận lấy tinh thần của thế gian, nhưng đã nhận lấy Thánh Linh đến từ Đức Chúa Trời, để chúng ta biết những điều Đức Chúa Trời đã ân ban cho chúng ta.[a]
  rationale: Bản sửa chỉ làm rõ cách diễn đạt sắc thái ân huệ của χαρισθέντα và thay chú thích có cách dùng từ không tự nhiên. Việc thêm «đã» ở vế thứ hai làm cân đối phép đối chiếu của aorist ἐλάβομεν mà không thay đổi nghĩa.
  reviewer_model: gpt-5.6-terra
