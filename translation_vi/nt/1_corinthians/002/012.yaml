  text: ἡμεῖς δὲ οὐ τὸ πνεῦμα τοῦ κόσμου ἐλάβομεν ἀλλὰ τὸ πνεῦμα τὸ ἐκ τοῦ θεοῦ, ἵνα εἰδῶμεν τὰ ὑπὸ τοῦ θεοῦ χαρισθέντα ἡμῖν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/012.yaml
  text: But we have not received the spirit of the world[a], but the Spirit from God[b], so that we may know the things graciously given to us by God.
translation:
  language: vi
  text: Còn chúng ta đã không nhận lấy tinh thần của thế gian, nhưng đã nhận lấy Thánh Linh đến từ Đức Chúa Trời, để chúng ta biết những điều Đức Chúa Trời đã ân ban cho chúng ta.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “những điều Đức Chúa Trời đã ban tặng cho chúng ta.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: πνεῦμα τοῦ κόσμου
  choice: tinh thần của thế gian
  rationale: “Tinh thần” diễn đạt ảnh hưởng hay khuynh hướng chi phối trật tự thế gian; chữ thường giúp phân biệt với Thánh Linh trong vế sau.
- source_word: ἐλάβομεν
  choice: đã ... nhận lấy
  rationale: Thì aorist chỉ hành động đã xảy ra; “nhận lấy” tự nhiên trong tiếng Việt và giữ ý tiếp nhận.
- source_word: πνεῦμα τὸ ἐκ τοῦ θεοῦ
  choice: Thánh Linh đến từ Đức Chúa Trời
  rationale: Trong ngữ cảnh, cụm này hợp lý nhất chỉ Thánh Linh do Đức Chúa Trời ban; “đến từ” giữ rõ quan hệ nguồn gốc của ἐκ.
- source_word: ἵνα εἰδῶμεν
  choice: để chúng ta biết
  rationale: Giữ rõ mệnh đề mục đích và nghĩa nhận biết của οἶδα, không diễn giải quá mức thành “hiểu”.
- source_word: τὰ ... χαρισθέντα ἡμῖν
  choice: những điều ... đã ban cho chúng ta bởi ân điển
  rationale: “Những điều” giữ phạm vi rộng của dạng trung tính số nhiều; “bởi ân điển” truyền đạt sắc thái ban tặng cách nhân từ của χαρίζομαι mà không giới hạn vào các ân tứ cụ thể.
- source_word: κόσμου
  choice: thế gian
  rationale: “Thế gian” là cách diễn đạt Kinh Thánh quen thuộc nhưng vẫn dễ hiểu, chỉ trật tự loài người hiện tại đối nghịch với Đức Chúa Trời.
theological_decisions:
- issue: πνεῦμα τὸ ἐκ τοῦ θεοῦ có chỉ đích danh Đức Thánh Linh hay không
  choice: Viết “Thánh Linh”
  alternative: “thần linh đến từ Đức Chúa Trời” hoặc “tinh thần đến từ Đức Chúa Trời”
  rationale: Sự tương phản trong văn mạch và việc Thần Linh được ban để người tin nhận biết các ân ban của Đức Chúa Trời khiến cách hiểu chỉ Đức Thánh Linh là tự nhiên nhất; cách dịch vẫn giữ cụm “đến từ Đức Chúa Trời” của nguyên văn.
- issue: Sắc thái của χαρισθέντα
  choice: “đã ban ... bởi ân điển”
  alternative: “đã ban không cho” hoặc “đã ban như một món quà”
  rationale: Cách chọn giữ mối liên hệ với ân điển và tránh làm người đọc tưởng nguyên văn chỉ nói đến một nhóm ân tứ thuộc linh riêng biệt.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Trời” và “Thánh Linh” nhất quán; cấu trúc tương phản “không ... nhưng ...” bám sát nguyên văn. Đặt chú thích ngay sau cụm từ có phương án dịch khác.
