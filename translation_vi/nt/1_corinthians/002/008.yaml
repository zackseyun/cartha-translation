  text: ἣν οὐδεὶς τῶν ἀρχόντων τοῦ αἰῶνος τούτου ἔγνωκεν, εἰ γὰρ ἔγνωσαν, οὐκ ἂν τὸν κύριον τῆς δόξης ἐσταύρωσαν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/008.yaml
  text: which none of the rulers of this age has known[a], for if they had known it, they would not have crucified the Lord of glory.
translation:
  language: vi
  text: là điều mà không một ai trong những người cai trị của thời đại này đã biết[a]; vì nếu họ đã biết, họ đã chẳng đóng đinh Chúa của vinh quang vào thập tự giá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Những người cai trị của thời đại này” có thể chỉ các nhà cầm quyền loài người, các quyền lực thuộc linh, hoặc cả hai.
    reason: Giữ nguyên sự mơ hồ thực sự về đối tượng được nói đến.
lexical_decisions:
- source_word: ἣν
  choice: là điều
  rationale: Đại từ quan hệ giống cái số ít quy chiếu về “sự khôn ngoan” ở câu trước; “là điều” nối tự nhiên trong tiếng Việt mà vẫn giữ quan hệ ấy.
- source_word: ἀρχόντων
  choice: những người cai trị
  rationale: Diễn đạt những kẻ nắm quyền, đồng thời không giới hạn đối tượng ở nhà lãnh đạo loài người hay các quyền lực thuộc linh.
- source_word: τοῦ αἰῶνος τούτου
  choice: của thời đại này
  rationale: Giữ nghĩa thời kỳ/trật tự hiện tại của αἰών, thay vì chuyển thành “thế gian”.
- source_word: ἔγνωκεν / ἔγνωσαν
  choice: đã biết
  rationale: Dịch trực tiếp γινώσκω và giữ sự lặp từ của nguyên văn; trong ngữ cảnh, “biết” có thể bao hàm việc nhận biết bản chất và ý nghĩa của sự khôn ngoan ấy.
- source_word: κύριον τῆς δόξης
  choice: Chúa vinh hiển
  rationale: Cách nói tự nhiên, trang trọng trong tiếng Việt, biểu đạt tước hiệu gắn Chúa với vinh quang mà không làm giảm sức nặng thần học.
- source_word: ἐσταύρωσαν
  choice: đóng đinh ... trên thập tự giá
  rationale: Diễn đạt rõ hình thức hành quyết lịch sử được động từ σταυρόω chỉ đến.
theological_decisions:
- issue: Danh tính của “những người cai trị của thời đại này”
  choice: Giữ cách gọi trung tính “những người cai trị ... của thời đại này”.
  alternative: Có thể hiểu là giới cầm quyền chính trị/tôn giáo của loài người, các quyền lực thuộc linh, hoặc cả hai.
  rationale: Cụm từ Hy Lạp cho phép nhiều cách quy chiếu; bản dịch không xác định điều câu này chưa xác định.
- issue: Quan hệ trong κύριον τῆς δόξης
  choice: Dịch “Chúa vinh hiển”.
  alternative: “Chúa của vinh quang”.
  rationale: “Chúa vinh hiển” tự nhiên hơn trong tiếng Việt và có thể truyền đạt phẩm tính/tước hiệu; phương án sát cấu trúc hơn được ghi nhận như một khả năng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ liên kết với câu trước bằng “là điều”; dùng dấu chấm phẩy để thể hiện hai vế lập luận gắn chặt. “Thập tự giá” là thuật ngữ quen thuộc và rõ nghĩa.
