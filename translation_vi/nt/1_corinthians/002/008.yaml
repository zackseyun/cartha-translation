  verdict: revise
  source_fidelity: Bản nháp giữ đúng cấu trúc lập luận và sự mơ hồ của ἀρχόντων τοῦ αἰῶνος τούτου. Tuy nhiên, “Chúa vinh hiển” chuyển cụm κύριον τῆς δόξης từ tước hiệu sở hữu/thuộc cách (“Chúa của vinh quang”) thành phẩm tính, nên chưa phản ánh đầy đủ cấu trúc và sức nặng của nguyên văn. Cách nói “đóng đinh ... trên thập tự giá” cũng kém chính xác hơn cách diễn đạt hành động đóng đinh vào thập tự giá.
  naturalness: “Không một người cai trị nào” có thể hiểu được nhưng không tự nhiên bằng “không một ai trong những người cai trị”. Bản sửa dùng “mà không một ai trong những người cai trị của thời đại này đã biết” để liên kết rõ với “sự khôn ngoan” ở câu trước, đồng thời vẫn trang trọng và hiện đại.
  terminology: “Thời đại này” giữ tốt αἰών; “những người cai trị” cùng chú thích giữ được khả năng chỉ quyền lực loài người, thuộc linh, hoặc cả hai. “Chúa của vinh quang” bảo toàn κύριον τῆς δόξης. “Thập tự giá” là thuật ngữ phù hợp, và “đóng đinh ... vào thập tự giá” diễn đạt chính xác σταυρόω.
