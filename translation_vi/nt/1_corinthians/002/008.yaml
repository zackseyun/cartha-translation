  - severity: low
    issue: “Đóng đinh ... trên thập tự giá” là kết hợp từ chưa chuẩn xác.
    rationale: Trong tiếng Việt, người bị đóng đinh “vào thập tự giá”; “trên thập tự giá” thích hợp hơn để chỉ vị trí chung, không phải trực tiếp hành động đóng đinh.
