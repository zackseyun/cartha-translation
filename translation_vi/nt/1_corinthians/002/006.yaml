reference: 1 Corinthians 2:6
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Σοφίαν δὲ λαλοῦμεν ἐν τοῖς τελείοις, σοφίαν δὲ οὐ τοῦ αἰῶνος τούτου οὐδὲ τῶν ἀρχόντων τοῦ αἰῶνος τούτου τῶν καταργουμένων·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/006.yaml
  text: Yet we do speak wisdom among the mature[a], but not a wisdom of this age or of the rulers of this age[c][b], who are being brought to nothing.
translation:
  language: vi
  text: Tuy vậy, chúng tôi nói sự khôn ngoan giữa những người trưởng thành[a], nhưng không phải là sự khôn ngoan của thời đại này, cũng không phải là sự khôn ngoan của những người cầm quyền thời đại này[b]—những kẻ đang bị làm cho trở nên vô hiệu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “những người hoàn thiện” hoặc “những người trọn vẹn”; ở đây có lẽ chỉ những người trưởng thành về thuộc linh.'
    reason: lexical_alternative
  - marker: b
    text: “Những người cầm quyền thời đại này” có thể chỉ các nhà cầm quyền loài người, các quyền lực thuộc linh, hoặc cả hai.
    reason: alternative_reading
  - marker: c
    text: 'Cũng có thể dịch: “đang qua đi”, “đang bị bãi bỏ” hoặc “đang bị vô hiệu hóa”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Σοφίαν
  choice: sự khôn ngoan
  rationale: Cách dịch trực tiếp và tự nhiên của σοφία; được lặp lại để giữ sự nhấn mạnh của nguyên văn.
- source_word: δὲ
  choice: Tuy vậy
  rationale: Diễn đạt quan hệ tương phản với mạch văn ngay trước đó mà vẫn tự nhiên trong tiếng Việt.
- source_word: λαλοῦμεν
  choice: chúng tôi nói
  rationale: Giữ nghĩa cơ bản của λαλέω là “nói”, không chuyển thành “rao giảng” vốn chuyên biệt hơn.
- source_word: ἐν τοῖς τελείοις
  choice: giữa những người trưởng thành
  rationale: ἐν mang nghĩa “giữa/trong số”; τέλειος trong ngữ cảnh nhiều khả năng chỉ sự trưởng thành, nhưng chú thích vẫn bảo lưu nghĩa sát chữ “hoàn thiện”.
- source_word: οὐ τοῦ αἰῶνος τούτου
  choice: không phải sự khôn ngoan của thời đại này
  rationale: Dịch αἰών là “thời đại” để giữ sắc thái thời kỳ hiện tại, thay vì đồng nhất với κόσμος là “thế gian”.
- source_word: ἀρχόντων
  choice: những nhà cai trị
  rationale: Cách gọi đủ rộng để không quyết định đây là giới cầm quyền loài người, các quyền lực thuộc linh, hay cả hai.
- source_word: τῶν καταργουμένων
  choice: những kẻ đang bị làm cho ra hư không
  rationale: Giữ thể bị động và tiến trình hiện tại của phân từ, đồng thời phản ánh nghĩa bị vô hiệu hóa hoặc đưa đến chỗ không còn hiệu lực.
theological_decisions:
- issue: Đối tượng của cụm “những nhà cai trị thời đại này”
  choice: Giữ cách gọi rộng, không xác định bản chất của họ trong chính văn.
  alternative: Các nhà cầm quyền loài người; các quyền lực thuộc linh; hoặc cả hai.
  rationale: Cụm từ Hy Lạp không buộc phải chọn riêng một đối tượng; giữ sự mơ hồ tránh áp đặt một cách giải thích thần học đang còn tranh luận.
- issue: Ý nghĩa của τοῖς τελείοις
  choice: Dịch là “những người trưởng thành”.
  alternative: “những người hoàn thiện” hoặc “những người trọn vẹn”.
  rationale: Trong ngữ cảnh, nghĩa trưởng thành có vẻ tự nhiên hơn, nhưng chú thích bảo lưu khả năng nghĩa sát chữ.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Giữ phép lặp “sự khôn ngoan” của nguyên văn, bảo lưu sự mơ hồ về các nhà cai trị, đồng thời dùng chú thích để nêu các khả năng từ vựng chính.
