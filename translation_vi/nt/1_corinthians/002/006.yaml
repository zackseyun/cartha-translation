  source_fidelity: Bản dịch giữ đúng cấu trúc đối lập và sự lặp lại của σοφίαν, dịch αἰών là “thời đại,” và không thu hẹp tham chiếu còn đang tranh luận của ἀρχόντων. Tuy nhiên, cụm “không phải sự khôn ngoan ... cũng không phải của những nhà cai trị” lược mất danh từ “sự khôn ngoan” ở vế hai, khiến quan hệ cú pháp với nguyên văn kém rõ. “Bị làm cho ra hư không” quá gượng trong tiếng Việt hiện đại.
  naturalness: Cần thêm “là” sau “không phải” và lặp “sự khôn ngoan” ở vế thứ hai để câu rõ và cân xứng. “Những người cầm quyền” tự nhiên hơn “những nhà cai trị” và vẫn đủ rộng cho chú thích. “Đang bị làm cho trở nên vô hiệu” diễn đạt được sắc thái bị động, đang tiếp diễn của καταργουμένων mà tự nhiên hơn.
  terminology: “Sự khôn ngoan,” “thời đại này,” và “những người trưởng thành” phù hợp. Giữ “những người cầm quyền” trong chính văn để không quyết định họ chỉ là nhân vật loài người hay quyền lực thuộc linh. Các chú thích bảo lưu đúng những lựa chọn từ vựng và cách hiểu thay thế quan trọng.
  issues:
