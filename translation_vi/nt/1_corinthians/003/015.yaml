source:
  edition: SBLGNT
  text: εἴ τινος τὸ ἔργον κατακαήσεται, ζημιωθήσεται, αὐτὸς δὲ σωθήσεται, οὕτως δὲ ὡς διὰ πυρός.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/015.yaml
  text: If anyone’s work is burned up[a], he will suffer loss, but he himself will be saved—yet as through fire.
translation:
  language: vi
  text: Nếu công việc của ai bị thiêu rụi, người ấy sẽ chịu mất mát; còn chính người ấy sẽ được cứu, nhưng như qua lửa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “nhưng chỉ như qua lửa,” hoặc “nhưng như một người thoát qua lửa.”'
    reason: Ghi nhận các khả năng diễn đạt của οὕτως δὲ ὡς διὰ πυρός mà không quyết định hình ảnh này chỉ sự thoát nạn trong gang tấc, sự thanh luyện, hay một sắc thái cụ thể khác.
lexical_decisions:
- source_word: εἴ τινος
  choice: Nếu ... của ai
  rationale: Diễn đạt tự nhiên một điều kiện áp dụng cho bất cứ người nào, không thêm sắc thái nhấn mạnh ngoài nguyên văn.
- source_word: τὸ ἔργον
  choice: công việc
  rationale: Giữ nghĩa rộng của ἔργον và phù hợp với hình ảnh xây dựng trong văn cảnh, không thu hẹp thành một hành động hay một loại chức vụ cụ thể.
- source_word: κατακαήσεται
  choice: bị thiêu rụi
  rationale: Truyền đạt sức mạnh của động từ chỉ việc bị lửa đốt đến mức hủy hoại hoàn toàn.
- source_word: ζημιωθήσεται
  choice: sẽ chịu mất mát
  rationale: Giữ nghĩa chịu thiệt hại hoặc mất phần đáng có mà không xác định đó là hình phạt hay phần thưởng bị mất.
- source_word: αὐτὸς δὲ
  choice: nhưng chính người ấy
  rationale: Bảo toàn sắc thái nhấn mạnh và sự tương phản giữa công việc bị mất với bản thân người làm được cứu.
- source_word: σωθήσεται
  choice: sẽ được cứu
  rationale: Phản ánh nghĩa thông thường và sức nặng thần học của σῴζω trong cách dùng của Phao-lô.
- source_word: οὕτως δὲ ὡς διὰ πυρός
  choice: tuy nhiên như thể đi qua lửa
  rationale: Giữ hình ảnh súc tích về việc qua lửa và không giải thích quá mức bản chất chính xác của sự cứu thoát.
theological_decisions:
- issue: Có nên diễn giải mệnh đề cuối theo một giáo lý cụ thể về sự thanh luyện hoặc theo nghĩa thoát nạn trong gang tấc hay không.
  choice: 'Giữ cách nói hình tượng: “tuy nhiên như thể đi qua lửa.”'
  alternative: “nhưng chỉ như người thoát qua lửa” hoặc “nhưng qua ngọn lửa thanh luyện.”
  rationale: Nguyên văn để ngỏ sắc thái chính xác của hình ảnh; bản dịch không nên biến hình ảnh ấy thành một khẳng định giáo phái cụ thể.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. “Thiêu rụi” giữ sức mạnh của hình ảnh lửa; “chịu mất mát” tránh thêm đối tượng mất mát không được nói rõ; đại từ “người ấy” tự nhiên và không áp đặt giới tính trong tiếng Việt.
