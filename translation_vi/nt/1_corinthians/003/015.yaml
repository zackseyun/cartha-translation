revisions:
- from: Nếu công việc của ai bị thiêu rụi, người ấy sẽ chịu mất mát, nhưng chính người ấy sẽ được cứu, tuy nhiên như thể đi qua lửa.[a]
  to: Nếu công việc của ai bị thiêu rụi, người ấy sẽ chịu mất mát; còn chính người ấy sẽ được cứu, nhưng như qua lửa.[a]
  rationale: 'Thay «tuy nhiên như thể đi qua lửa» bằng «nhưng như qua lửa» để dịch sát hơn οὕτως δὲ ὡς διὰ πυρός, tránh thêm sắc thái giả định và diễn giải hành động. Dấu chấm phẩy làm rõ hai vế: hậu quả cho công việc và sự cứu của chính người ấy.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T18:10:40Z'
review_pass:
  verdict: revise
  source_fidelity: Bản dịch phản ánh đúng cấu trúc điều kiện, sự đối lập giữa «công việc» và bản thân người làm, nghĩa «chịu mất mát», cùng động từ «được cứu». Tuy nhiên, «như thể đi qua lửa» thêm sắc thái giả định của «như thể» và chuyển hình ảnh ngắn gọn, còn để ngỏ của ὡς διὰ πυρός thành hành động «đi qua» rõ hơn nguyên văn.
  naturalness: «Công việc của ai», «bị thiêu rụi», và «chịu mất mát» đều tự nhiên trong tiếng Việt hiện đại, với giọng văn trang trọng phù hợp. «Nhưng như qua lửa» tuy cô đọng nhưng là cách diễn đạt Kinh Thánh tự nhiên, giữ được tính hình tượng của câu.
  terminology: «Được cứu» là thuật ngữ thích hợp cho σωθήσεται. «Công việc» giữ phạm vi rộng của τὸ ἔργον; «thiêu rụi» phản ánh lực tăng cường của κατακαήσεται. Không cần xác định mất phần thưởng hay áp đặt cách hiểu về lửa thanh luyện.
  issues:
  - severity: medium
    issue: Mệnh đề cuối «tuy nhiên như thể đi qua lửa» diễn giải vượt quá mức cần thiết.
    rationale: ὡς διὰ πυρός có nghĩa đen sát là «như qua lửa»/«như qua một ngọn lửa». «Như thể» gợi một sự so sánh không thực, còn «đi qua» cụ thể hóa hình ảnh theo một hướng. Cách «nhưng như qua lửa» bảo tồn tính cô đọng và sự mơ hồ có chủ ý của nguyên văn.
  revised_text: Nếu công việc của ai bị thiêu rụi, người ấy sẽ chịu mất mát; còn chính người ấy sẽ được cứu, nhưng như qua lửa.[a]
