  text: εἰ δέ τις ἐποικοδομεῖ ἐπὶ τὸν ⸀θεμέλιον ⸂χρυσόν, ἄργυρον⸃, λίθους τιμίους, ξύλα, χόρτον, καλάμην,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/012.yaml
  text: If anyone builds on the foundation with gold, silver, precious stones, wood, hay, straw,
translation:
  language: vi
  text: Nếu có ai xây trên nền ấy bằng vàng, bạc, đá quý, gỗ, cỏ khô hay rơm rạ,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰ δέ τις
  choice: Nếu có ai
  rationale: Diễn đạt tự nhiên mệnh đề điều kiện và chủ thể bất định; δέ chỉ chuyển nhẹ sang bước tiếp theo của lập luận nên không cần thêm một từ nối riêng trong tiếng Việt.
- source_word: ἐποικοδομεῖ ἐπὶ τὸν θεμέλιον
  choice: xây trên nền ấy
  rationale: Giữ nguyên hình ảnh xây dựng; “ấy” quy chiếu tự nhiên về nền đã được nói đến trong câu trước.
- source_word: χρυσόν, ἄργυρον
  choice: vàng, bạc
  rationale: Các tên vật liệu trực tiếp, thông dụng và tương ứng sát với nguyên ngữ.
- source_word: λίθους τιμίους
  choice: đá quý
  rationale: Giữ được nghĩa những loại đá có giá trị; trong ngữ cảnh xây dựng, cụm từ vẫn có thể chỉ đá xây quý giá chứ không nhất thiết chỉ đá trang sức.
- source_word: ξύλα
  choice: gỗ
  rationale: Danh từ chỉ vật liệu tự nhiên trong tiếng Việt.
- source_word: χόρτον
  choice: cỏ khô
  rationale: Trong danh sách vật liệu dễ cháy, “cỏ khô” truyền đạt rõ hơn “cỏ” và phù hợp với sự tương phản của đoạn văn.
- source_word: καλάμην
  choice: rơm rạ
  rationale: Cách gọi tự nhiên trong tiếng Việt cho thân cây khô còn lại sau thu hoạch, phù hợp với vật liệu xây dựng kém bền và dễ cháy.
