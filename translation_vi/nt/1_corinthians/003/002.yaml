  text: γάλα ὑμᾶς ἐπότισα, ⸀οὐ βρῶμα, οὔπω γὰρ ἐδύνασθε. ἀλλ’ ⸀οὐδὲ ἔτι νῦν δύνασθε,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/002.yaml
  text: I fed you milk[a], not solid food, for you were not yet able. But even now you are still not able[b],
translation:
  language: vi
  text: Tôi đã cho anh chị em uống sữa[a], chứ không cho ăn thức ăn, vì lúc ấy anh chị em chưa thể tiếp nhận. Nhưng ngay cả bây giờ, anh chị em vẫn chưa thể tiếp nhận,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Tôi đã nuôi anh chị em bằng sữa, không phải bằng thức ăn.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: γάλα
  choice: sữa
  rationale: Tương đương trực tiếp và tự nhiên trong tiếng Việt, giữ nguyên hình ảnh nuôi dưỡng của Phao-lô.
- source_word: ἐπότισα
  choice: đã cho ... uống
  rationale: Động từ chỉ hành động cho uống; cách diễn đạt này tự nhiên trong tiếng Việt với tân ngữ “sữa” và sát nghĩa hơn cách nói chung là “nuôi”.
- source_word: βρῶμα
  choice: thức ăn
  rationale: Từ Hy Lạp chỉ thức ăn nói chung. Không thêm “đặc” vào chính văn để tránh thu hẹp nghĩa, dù sự tương phản với sữa hàm ý thức ăn có độ rắn hơn.
- source_word: οὔπω γὰρ ἐδύνασθε
  choice: vì lúc ấy anh chị em chưa có khả năng tiếp nhận
  rationale: Thể chưa hoàn thành diễn tả tình trạng thiếu khả năng trong thời điểm trước. Bổ sung “tiếp nhận” theo ngữ cảnh để câu tiếng Việt không bị cụt, nhưng không xác định cụ thể điều được tiếp nhận.
- source_word: ἀλλ’ οὐδὲ ἔτι νῦν δύνασθε
  choice: Nhưng ngay cả bây giờ, anh chị em vẫn chưa có khả năng
  rationale: “Ngay cả bây giờ” thể hiện οὐδὲ ... νῦν, còn “vẫn chưa” diễn đạt tình trạng tiếp diễn của ἔτι cùng phủ định; giữ sự song song với mệnh đề trước.
theological_decisions:
- issue: Ý nghĩa của hình ảnh sữa và thức ăn
  choice: Giữ nguyên hình ảnh nuôi dưỡng mà không diễn giải thành giáo lý căn bản và giáo lý cao sâu.
  alternative: Diễn ý là “Tôi chỉ dạy anh chị em những điều căn bản, không dạy những điều sâu nhiệm.”
  rationale: Nguyên văn trình bày bằng ẩn dụ và không nêu rõ nội dung tương ứng; giữ ẩn dụ bảo toàn tính mở và tránh đưa cách giải thích thần học vào chính văn.
- issue: Đối tượng của khả năng
  choice: Dùng “khả năng tiếp nhận” nhưng không xác định rõ họ không thể tiếp nhận thức ăn, lời dạy hay điều gì khác.
  alternative: Dịch cụ thể là “anh chị em chưa thể ăn thức ăn đặc” hoặc “chưa thể hiểu giáo lý sâu nhiệm.”
  rationale: Động từ δύναμαι không có bổ ngữ được nêu minh nhiên. “Tiếp nhận” làm câu tiếng Việt tự nhiên mà vẫn để ngỏ đối tượng theo văn cảnh.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” cho đại từ số nhiều ὑμᾶς. Giữ nguyên ẩn dụ và nhịp đối chiếu giữa tình trạng trước đây với hiện tại; dấu phẩy cuối câu được giữ vì câu Hy Lạp tiếp tục sang câu kế.
