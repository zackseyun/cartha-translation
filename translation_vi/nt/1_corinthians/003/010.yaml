revisions:
- from: Theo ân điển Đức Chúa Trời đã ban cho tôi, như một thợ cả xây dựng khôn ngoan[a], tôi đã đặt nền móng, còn người khác xây trên đó. Nhưng mỗi người phải cẩn thận xem mình xây dựng thế nào.[b]
  to: Theo ân điển Đức Chúa Trời đã ban cho tôi, như một người thợ cả khôn ngoan[a], tôi đã đặt nền móng, còn người khác xây trên đó. Nhưng mỗi người phải cẩn thận xem mình xây dựng thế nào.[b]
