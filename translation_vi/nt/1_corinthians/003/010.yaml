    rationale: Cụm này không phải một danh ngữ nghề nghiệp tự nhiên. Đổi thành “người thợ cả” sửa độ tự nhiên mà không làm thay đổi vai trò người thợ chính/phụ trách công trình được hàm ý bởi ἀρχιτέκτων.
