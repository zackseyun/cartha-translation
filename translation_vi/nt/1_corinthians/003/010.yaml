id: 1CO.3.10
reference: 1 Corinthians 3:10
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Κατὰ τὴν χάριν τοῦ θεοῦ τὴν δοθεῖσάν μοι ὡς σοφὸς ἀρχιτέκτων θεμέλιον ⸀ἔθηκα, ἄλλος δὲ ἐποικοδομεῖ. ἕκαστος δὲ βλεπέτω πῶς ἐποικοδομεῖ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/010.yaml
  text: According to the grace of God given to me[a], like a wise master builder I laid a foundation, and another builds on it[c][b]. But let each one be careful how he builds.
translation:
  language: vi
  text: Theo ân điển Đức Chúa Trời đã ban cho tôi, như một người thợ cả khôn ngoan[a], tôi đã đặt nền móng, còn người khác xây trên đó. Nhưng mỗi người phải cẩn thận xem mình xây dựng thế nào.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “kiến trúc sư” hoặc “người thợ xây trưởng”; từ Hy Lạp chỉ người thợ chính phụ trách công việc xây dựng.
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “mình xây trên nền ấy thế nào.”'
    reason: previous_rendering
lexical_decisions:
- source_word: Κατὰ
  choice: Theo
  rationale: Diễn đạt sự phù hợp với ân điển đã được ban, thay vì chỉ phương tiện hành động.
- source_word: χάριν
  choice: ân điển
  rationale: Giữ được ý nghĩa về ân huệ và năng lực Đức Chúa Trời ban trong cách dùng của Phao-lô.
- source_word: τὴν δοθεῖσάν μοι
  choice: đã ban cho tôi
  rationale: Diễn đạt trực tiếp rằng ân điển ấy là điều Phao-lô nhận được từ Đức Chúa Trời.
- source_word: σοφὸς ἀρχιτέκτων
  choice: một thợ cả xây dựng khôn ngoan
  rationale: ἀρχιτέκτων trong bối cảnh cổ đại chỉ người thợ chính hoặc người phụ trách công trình; cách dịch này giữ cả vai trò chỉ đạo lẫn phẩm chất σοφός.
- source_word: θεμέλιον ἔθηκα
  choice: tôi đã đặt nền móng
  rationale: Là cách kết hợp từ tự nhiên trong tiếng Việt và bám sát hình ảnh xây dựng của nguyên văn.
- source_word: ἄλλος δὲ ἐποικοδομεῖ
  choice: còn người khác xây trên đó
  rationale: Động từ ghép nói đến việc xây tiếp trên nền đã đặt; “trên đó” làm rõ đối tượng được hàm ý trong tiếng Hy Lạp.
- source_word: ἕκαστος δὲ βλεπέτω
  choice: Nhưng mỗi người phải cẩn thận xem
  rationale: Giữ ý phân phối của ἕκαστος và sức cảnh báo của mệnh lệnh βλεπέτω bằng tiếng Việt tự nhiên.
- source_word: πῶς ἐποικοδομεῖ
  choice: mình xây dựng thế nào
  rationale: Đại từ “mình” giữ số ít theo từng cá nhân mà không giới hạn giới tính; không lặp “trên đó” vì nền móng đã rõ trong ngữ cảnh.
theological_decisions:
- issue: Phạm vi đại diện của giống đực số ít trong ἕκαστος
  choice: mỗi người… mình
  alternative: mỗi người nam… người ấy
  rationale: Giống đực số ít ở đây có lực đại diện, không giới hạn lời cảnh báo cho nam giới; “mỗi người… mình” vừa bao quát vừa giữ trọng tâm trách nhiệm cá nhân.
- issue: Sắc thái của χάρις
  choice: ân điển
  alternative: ân huệ
  rationale: “Ân điển” bảo tồn sức nặng thần học quen thuộc trong văn mạch Phao-lô mà không diễn giải cụ thể đó chỉ là chức vụ, tài năng hay quyền hạn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Hình ảnh xây dựng được giữ nhất quán; câu cuối tránh lặp nặng nề nhưng chú thích vẫn nêu cách diễn đạt đầy đủ hơn.
