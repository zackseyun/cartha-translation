id: 1CO.3.1
reference: 1 Corinthians 3:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Κἀγώ, ἀδελφοί, οὐκ ἠδυνήθην ⸂λαλῆσαι ὑμῖν⸃ ὡς πνευματικοῖς ἀλλ’ ὡς ⸀σαρκίνοις, ὡς νηπίοις ἐν Χριστῷ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/001.yaml
  text: And I[a], brothers, was not able to speak to you as spiritual people, but as fleshly people[b], as infants in Messiah.
translation:
  language: vi
  text: Còn tôi, thưa anh em[a], đã không thể nói với anh em như với những người thuộc linh, nhưng như với những người xác thịt, như với những trẻ sơ sinh trong Đấng Mê-si-a[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hy Lạp được dịch là “anh em” ở dạng giống đực số nhiều, nhưng trong ngữ cảnh có thể chỉ cả các anh chị em trong cộng đồng.
    reason: lexical_alternative
  - marker: b
    text: Hay “trong Đấng Christ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Κἀγώ
  choice: Còn tôi
  rationale: Diễn đạt liên từ καί cùng đại từ nhấn mạnh ἐγώ, nối với phần trước và làm rõ sự chuyển sang kinh nghiệm của chính Phao-lô mà không cường điệu.
- source_word: ἀδελφοί
  choice: thưa anh em
  rationale: Giữ hình thức hô cách số nhiều giống đực của tiếng Hy Lạp; cách gọi này tự nhiên và trang trọng trong tiếng Việt. Phạm vi có thể bao gồm cả nam lẫn nữ được ghi chú.
- source_word: οὐκ ἠδυνήθην
  choice: đã không thể
  rationale: Giữ ý nghĩa về sự bất lực trong dạng quá khứ aorist, thay vì làm yếu thành ý không muốn hay không tiện.
- source_word: λαλῆσαι ὑμῖν
  choice: nói với anh em
  rationale: Chuyển trực tiếp động từ nguyên mẫu và bổ ngữ gián tiếp bằng cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: πνευματικοῖς
  choice: những người thuộc linh
  rationale: Tính từ được dùng như danh từ; thêm “những người” để câu rõ nghĩa, còn “thuộc linh” giữ sự đối lập trực tiếp với σαρκίνοις.
- source_word: σαρκίνοις
  choice: những người xác thịt
  rationale: Giữ liên hệ từ vựng với σάρξ và sự đối lập với “thuộc linh”, không diễn giải mạnh hơn thành “trần tục” hoặc “tội lỗi”.
- source_word: νηπίοις
  choice: những trẻ sơ sinh
  rationale: Giữ hình ảnh ẩn dụ về tình trạng non nớt; “trẻ sơ sinh” chính xác và trang trọng hơn “con nít” trong ngữ cảnh này.
- source_word: ἐν Χριστῷ
  choice: trong Đấng Christ
  rationale: Giữ công thức Phao-lô “trong Đấng Christ” và danh xưng Χριστός theo cách dùng quen thuộc, tự nhiên trong tiếng Việt Cơ Đốc.
theological_decisions:
- issue: Ý nghĩa của σαρκίνοις trong sự đối lập với πνευματικοῖς
  choice: những người xác thịt
  alternative: những người trần tục
  rationale: “Xác thịt” bảo tồn ẩn dụ và sự căng thẳng thần học của nguyên văn, không tự ý đồng nhất từ này với tính trần tục hay một bản tính tội lỗi được hệ thống hóa.
- issue: Cách dịch Χριστῷ
  choice: trong Đấng Christ
  alternative: trong Đấng Mê-si-a
  rationale: Trong công thức ἐν Χριστῷ thường gặp ở Phao-lô, “Đấng Christ” vừa giữ được danh hiệu vừa phản ánh cách cụm từ vận hành gần như một tên riêng, không buộc câu này phải nhấn mạnh riêng chức danh Mê-si-a.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “thuộc linh” và “xác thịt” để giữ cặp đối lập thần học của nguyên văn; dùng “thưa anh em” cho lời xưng hô trực tiếp. Tất cả dấu chú thích đều có mặt trong chính văn.
