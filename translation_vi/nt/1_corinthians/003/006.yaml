id: 1CO.3.6
reference: 1 Corinthians 3:6
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐγὼ ἐφύτευσα, Ἀπολλῶς ἐπότισεν, ἀλλὰ ὁ θεὸς ηὔξανεν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/006.yaml
  text: I planted[a], Apollos watered, but God gave the growth.
translation:
  language: vi
  text: Tôi đã trồng, A-pô-lô đã tưới, nhưng Đức Chúa Trời làm cho nó lớn lên.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “nhưng Đức Chúa Trời ban sự tăng trưởng” hoặc “nhưng Đức Chúa Trời khiến nó lớn lên.”'
    reason: Nêu các cách diễn đạt tự nhiên khác của ηὔξανεν mà không thay đổi điểm nhấn về tác động của Đức Chúa Trời.
lexical_decisions:
- source_word: ἐγὼ
  choice: Tôi
  rationale: Đại từ được nêu rõ trong tiếng Hy Lạp, tạo thế đối chiếu giữa Phao-lô, A-pô-lô và Đức Chúa Trời; “Tôi” giữ được chủ thể rõ ràng mà không làm câu nặng nề.
- source_word: ἐφύτευσα
  choice: đã trồng
  rationale: Giữ nguyên hình ảnh nông nghiệp và diễn đạt tự nhiên hành động đã xảy ra của thì aorist.
- source_word: Ἀπολλῶς
  choice: A-pô-lô
  rationale: Phiên âm tên riêng theo cách dùng quen thuộc trong tiếng Việt.
- source_word: ἐπότισεν
  choice: đã tưới
  rationale: Giữ hình ảnh chăm sóc cây trồng và đối xứng tự nhiên với “đã trồng”.
- source_word: ἀλλὰ
  choice: nhưng
  rationale: Thể hiện rõ sự tương phản mạnh giữa công việc của con người và tác động quyết định của Đức Chúa Trời.
- source_word: ὁ θεὸς
  choice: Đức Chúa Trời
  rationale: Cách gọi trang trọng, phổ thông trong văn bản Kinh Thánh tiếng Việt; chủ thể được đặt rõ trong thế tương phản với Phao-lô và A-pô-lô.
- source_word: ηὔξανεν
  choice: làm cho lớn lên
  rationale: Diễn đạt trực tiếp nghĩa gây nên sự tăng trưởng. Không thêm một tân ngữ cụ thể vốn không có trong câu Hy Lạp, đồng thời để ngữ cảnh xác định điều đang lớn lên; hình thức này cũng không buộc hành động của Đức Chúa Trời thành một biến cố đơn lẻ.
theological_decisions:
- issue: Vai trò của Đức Chúa Trời so với công việc của những người phục vụ
  choice: Giữ ba mệnh đề song song nhưng dùng “nhưng” để nhấn mạnh rằng Đức Chúa Trời là Đấng làm cho lớn lên.
  alternative: “Đức Chúa Trời ban sự tăng trưởng”
  rationale: Bản dịch giữ cả thực tại công việc của Phao-lô và A-pô-lô lẫn vai trò quyết định của Đức Chúa Trời, không biến sự tương phản của câu thành một giải thích giáo lý rộng hơn.
- issue: Giá trị thể của ηὔξανεν
  choice: “làm cho lớn lên” không kèm “đã”, để tiếng Việt tự nhiên và để ngỏ sắc thái diễn tiến của thì chưa hoàn thành.
  alternative: “đã làm cho lớn lên” hoặc “vẫn đang làm cho lớn lên”
  rationale: “Đã” dễ làm hành động thành một biến cố hoàn tất, còn “vẫn đang” có thể xác định quá mức thời điểm và sắc thái. Cách dịch chính bảo tồn sự khác biệt có thể cảm nhận được so với hai động từ aorist trước đó.
translation_notes:
  register: Văn phong hiện đại, trang trọng và ngắn gọn. Cấu trúc ba vế giữ nhịp của nguyên văn. Dấu chú thích được đặt sau cụm từ mà chú thích giải thích, thay vì sau “đã trồng” như vị trí không tương ứng trong lớp tham khảo tiếng Anh.
