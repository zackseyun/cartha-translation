revisions:
- from: Tôi đã trồng, A-pô-lô đã tưới, nhưng Đức Chúa Trời làm cho lớn lên.[a]
  to: Tôi đã trồng, A-pô-lô đã tưới, nhưng Đức Chúa Trời làm cho nó lớn lên.[a]
  rationale: Thêm “nó” để hoàn chỉnh cấu trúc cú pháp tiếng Việt của “làm cho ... lớn lên”. Đại từ này được ngữ cảnh ẩn dụ nông nghiệp cung cấp và bảo tồn sự không nêu danh từ trực tiếp của nguyên ngữ. Việc không thêm “đã” ở mệnh đề cuối vẫn tránh đồng nhất sắc thái của ηὔξανεν với hai động từ aorist đứng trước.
