  text: καὶ πάλιν· Κύριος γινώσκει τοὺς διαλογισμοὺς τῶν σοφῶν ὅτι εἰσὶν μάταιοι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/020.yaml
  text: And again[a], “The Lord knows the thoughts of the wise[c][b], that they are futile.”
translation:
  language: vi
  text: 'Và lại: “Chúa biết rằng những ý nghĩ[a] của những người khôn ngoan là hư không.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “những lý luận”.
    reason: lexical_alternative
  - marker: b
    text: Trích Thi Thiên 94:11 (93:11 trong bản Bảy Mươi).
    reason: cross_reference
lexical_decisions:
- source_word: καὶ πάλιν
  choice: Và lại có lời chép rằng
  rationale: Cụm này giới thiệu một trích dẫn Kinh Thánh thứ hai. Thêm “có lời chép rằng” làm rõ chức năng trích dẫn trong tiếng Việt mà không thay đổi nội dung.
- source_word: Κύριος
  choice: Chúa
  rationale: Cách dịch tự nhiên, trang trọng và quen thuộc của κύριος trong ngữ cảnh chỉ về Đức Chúa Trời.
- source_word: γινώσκει
  choice: biết
  rationale: Tương đương trực tiếp và tự nhiên, giữ nguyên sức khẳng định của câu.
- source_word: διαλογισμοὺς
  choice: những suy tưởng
  rationale: Diễn đạt hoạt động tư duy, lập luận trong tâm trí; tự nhiên hơn “những lý luận” trong câu trích dẫn này, trong khi vẫn để ngỏ sắc thái lý luận qua chú thích.
- source_word: τῶν σοφῶν
  choice: của những người khôn ngoan
  rationale: Chuyển tính từ được danh từ hóa sang cách nói tự nhiên trong tiếng Việt, đồng thời giữ liên hệ với chủ đề sự khôn ngoan trong văn cảnh.
- source_word: ὅτι
  choice: đều là
  rationale: Trong tiếng Việt, cấu trúc “biết ... đều là ...” truyền đạt tự nhiên rằng mệnh đề sau là nội dung điều Chúa biết.
- source_word: μάταιοι
  choice: hư không
  rationale: Giữ sắc thái trống rỗng, vô giá trị và không đem lại kết quả của μάταιος; đây cũng là lối diễn đạt trang trọng nhưng vẫn dễ hiểu.
theological_decisions: []
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ đọc. Dùng “những người khôn ngoan” thay vì lối gọi mang sắc thái giới tính. Trật tự câu được điều chỉnh nhẹ cho tự nhiên trong tiếng Việt; không giải thích “khôn ngoan” theo một hệ phái hay cách diễn giải riêng.
