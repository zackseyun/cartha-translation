review_pass:
  verdict: revise
  source_fidelity: Bản dịch truyền đạt đúng cấu trúc điều kiện, tính số ít của «đền thờ», số nhiều của người nhận thư, và lời cảnh cáo nghiêm khắc. Tuy nhiên, φθείρει / φθερεῖ là cùng một động từ được lặp lại trong tiếng Hy Lạp; việc dùng «hủy hoại» rồi «hủy diệt» làm mờ sự lặp lại có chủ ý này.
  naturalness: Văn phong trang trọng, hiện đại và dễ hiểu. «Anh chị em» là cách xưng hô cộng đồng tự nhiên; «người ấy» trung tính về giới. Lặp «hủy hoại» trong cả hai vế vẫn tự nhiên và sát với lối chơi lặp từ của nguyên văn.
  terminology: «Đền thờ của Đức Chúa Trời» phù hợp với ναός trong văn cảnh. «Thánh» phù hợp với ἅγιος. Chú thích về số nhiều và ý nghĩa cộng đồng được đặt đúng trọng tâm, không áp đặt cách giải thích cá nhân.
  issues:
