id: 1CO.3.17
reference: 1 Corinthians 3:17
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἴ τις τὸν ναὸν τοῦ θεοῦ φθείρει, φθερεῖ τοῦτον ὁ θεός· ὁ γὰρ ναὸς τοῦ θεοῦ ἅγιός ἐστιν, οἵτινές ἐστε ὑμεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/017.yaml
  text: If anyone destroys God's temple[a], God will destroy him; for God's temple is holy[b], and you are that temple.
translation:
  language: vi
  text: Nếu ai hủy hoại đền thờ của Đức Chúa Trời[a], Đức Chúa Trời sẽ hủy hoại người ấy; vì đền thờ của Đức Chúa Trời là thánh, và chính anh chị em là đền thờ ấy.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Động từ Hy Lạp được dùng ở cả hai vế cũng có thể mang nghĩa “làm hư hỏng” hoặc “làm ô uế”.
    reason: lexical_alternative
  - marker: b
    text: “Anh chị em” là số nhiều; Phao-lô đồng nhất cả hội chúng với một đền thờ của Đức Chúa Trời.
    reason: cultural_note
lexical_decisions:
- source_word: ναός
  choice: đền thờ
  rationale: Cách dịch tự nhiên và quen thuộc trong tiếng Việt, chỉ nơi ngự thánh của Đức Chúa Trời; trong văn cảnh này danh từ số ít chỉ cả cộng đồng.
- source_word: φθείρει / φθερεῖ
  choice: hủy hoại / sẽ hủy diệt
  rationale: Giữ sắc thái nghiêm trọng và mối liên hệ từ vựng giữa hai vế, đồng thời dùng cách kết hợp từ tự nhiên trong tiếng Việt. Động từ Hy Lạp có thể bao hàm làm hư hỏng, làm ô uế hoặc tiêu diệt.
- source_word: τοῦτον
  choice: người ấy
  rationale: Chỉ lại người bất định ở đầu câu bằng lối diễn đạt trung tính về giới và tự nhiên trong tiếng Việt.
- source_word: ἅγιος
  choice: là thánh
  rationale: Giữ cách diễn đạt thần học quen thuộc, bao hàm ý nghĩa thuộc riêng về Đức Chúa Trời và có tính linh thiêng.
- source_word: οἵτινές ἐστε ὑμεῖς
  choice: và chính anh chị em là đền thờ ấy
  rationale: Diễn đạt rõ sự đồng nhất giữa đền thờ số ít và những người nhận thư số nhiều; từ “chính” phản ánh đại từ ὑμεῖς được nêu tường minh để nhấn mạnh.
- source_word: ὑμεῖς
  choice: anh chị em
  rationale: Thể hiện rõ số nhiều và cách xưng hô cộng đồng trong tiếng Việt hiện đại.
theological_decisions:
- issue: Đền thờ chỉ cá nhân tín hữu hay toàn thể hội chúng
  choice: 'Câu chính thể hiện nghĩa cộng đồng: “đền thờ” ở số ít được đồng nhất với “anh chị em” ở số nhiều.'
  alternative: Có thể áp dụng theo nghĩa rộng hơn cho từng cá nhân tín hữu.
  rationale: Ngữ pháp Hy Lạp kết hợp ναός số ít với ὑμεῖς số nhiều, và văn cảnh 1 Cô-rinh-tô 3 nói về cộng đồng được cùng nhau xây dựng.
- issue: Sắc thái của φθείρω trong hai mệnh đề
  choice: Dịch “hủy hoại” ở hành động của con người và “hủy diệt” ở sự đáp trả của Đức Chúa Trời, đồng thời chú thích phạm vi nghĩa.
  alternative: Lặp nguyên một động từ như “phá hủy… phá hủy” hoặc dùng “làm ô uế… sẽ trừng phạt/hủy diệt”.
  rationale: Một từ Hy Lạp được lặp lại tạo sự tương ứng nghiêm khắc, nhưng hai cách kết hợp từ khác nhau giúp câu tiếng Việt tự nhiên mà không làm nhẹ lời cảnh báo hoặc xác định quá hẹp kiểu tổn hại.
translation_notes:
  register: Văn phong trang trọng, rõ ràng và hiện đại. “Anh chị em” biểu thị số nhiều một cách tự nhiên; “người ấy” tránh áp đặt giới tính. Hai dấu chú thích [a], [b] đều xuất hiện trong chính văn.
