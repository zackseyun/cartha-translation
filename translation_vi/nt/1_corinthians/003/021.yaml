- from: Vậy, đừng ai khoe mình về con người[a], vì mọi sự đều thuộc về anh chị em.
  to: Vậy, đừng ai khoe khoang về con người, vì mọi sự đều thuộc về anh chị em.
  rationale: Sửa động từ để diễn đạt tự nhiên và chính xác hơn ý cấm khoe khoang liên quan đến con người, đồng thời chỉnh văn phong chú thích. Bản chính vẫn giữ nghĩa khái quát của ἀνθρώποις và không biến cách hiểu theo ngữ cảnh thành nghĩa duy nhất.
