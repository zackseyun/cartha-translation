source:
  edition: SBLGNT
  text: ὥστε μηδεὶς καυχάσθω ἐν ἀνθρώποις· πάντα γὰρ ὑμῶν ἐστιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/021.yaml
  text: So then[a], let no one boast in people[b], for all things are yours.
translation:
  language: vi
  text: Vậy, đừng ai khoe khoang về con người, vì mọi sự đều thuộc về anh chị em.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὥστε
  choice: Vậy
  rationale: Đánh dấu kết luận suy ra từ lập luận trước đó; “Vậy” tự nhiên và giữ được quan hệ suy luận.
- source_word: μηδεὶς καυχάσθω
  choice: đừng ai khoe mình
  rationale: Diễn đạt mệnh lệnh cấm mang tính khái quát; “khoe mình” giữ sắc thái tự hào, khoe khoang của động từ mà không giải thích quá mức.
- source_word: ἐν ἀνθρώποις
  choice: về con người
  rationale: ἐν với καυχάομαι chỉ căn cứ hoặc đối tượng của sự khoe mình. “Con người” giữ nghĩa khái quát của ἀνθρώποις, không giới hạn ở nam giới hay tự động đồng nhất với các lãnh đạo.
- source_word: πάντα
  choice: mọi sự
  rationale: Giữ phạm vi bao quát của dạng trung tính số nhiều và phù hợp với lối diễn đạt trang trọng, tự nhiên trong tiếng Việt.
- source_word: γὰρ
  choice: vì
  rationale: Nêu lý do cho mệnh lệnh cấm ở mệnh đề trước.
- source_word: ὑμῶν ἐστιν
  choice: đều thuộc về anh chị em
  rationale: Diễn đạt rõ quan hệ sở hữu; “anh chị em” thể hiện đại từ số nhiều chỉ toàn thể cộng đồng tín hữu.
theological_decisions:
- issue: Đối tượng của việc khoe mình trong cụm ἐν ἀνθρώποις
  choice: con người
  alternative: các lãnh đạo loài người
  rationale: Ngữ cảnh nói đến việc phe phái quanh Phao-lô, A-bô-lô và Sê-pha nên có thể hàm ý các lãnh đạo; tuy nhiên, nguyên văn dùng từ khái quát “con người”, vì vậy bản chính không thu hẹp nghĩa.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh chị em” để biểu đạt đại từ số nhiều ὑμῶν hướng đến cả cộng đồng; tránh cách gọi chỉ mang giống nam.
