source:
  edition: SBLGNT
  text: θεοῦ γάρ ἐσμεν συνεργοί· θεοῦ γεώργιον, θεοῦ οἰκοδομή ἐστε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/009.yaml
  text: For we are God’s fellow workers; you are God’s field[a], God’s building.
translation:
  language: vi
  text: Vì chúng tôi là những người cùng làm việc cho Đức Chúa Trời[a]; anh chị em là cánh đồng của Đức Chúa Trời, là công trình của Đức Chúa Trời.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “những người cùng làm việc với Đức Chúa Trời.”'
    reason: Giữ cách hiểu khác có cơ sở của cụm θεοῦ συνεργοί.
lexical_decisions:
- source_word: γάρ
  choice: Vì
  rationale: Giữ chức năng giải thích và nối kết câu này với lập luận ngay trước đó.
- source_word: συνεργοί
  choice: những người cùng làm việc
  rationale: Diễn đạt tự nhiên trong tiếng Việt hiện đại, giữ ý nhiều người chia sẻ cùng một công việc mà không dùng thuật ngữ tôn giáo chuyên biệt.
- source_word: θεοῦ (với συνεργοί)
  choice: cho Đức Chúa Trời
  rationale: Trong ngữ cảnh, cách dịch này diễn tả những người phục vụ Đức Chúa Trời và tránh mặc nhiên đặt họ ngang hàng với Ngài; cách hiểu “với Đức Chúa Trời” vẫn được giữ trong chú thích vì ngữ pháp Hy Lạp cho phép tranh luận.
- source_word: γεώργιον
  choice: cánh đồng
  rationale: Rõ ràng, tự nhiên và giữ nguyên hình ảnh canh tác.
- source_word: οἰκοδομή
  choice: công trình xây dựng
  rationale: Giữ hình ảnh kiến thiết được triển khai trong các câu tiếp theo, đồng thời tự nhiên hơn “tòa nhà” khi nói về cộng đồng tín hữu.
- source_word: ἐστε
  choice: anh chị em là
  rationale: Thể hiện trực tiếp ngôi thứ hai số nhiều và nói với toàn thể cộng đồng bằng tiếng Việt hiện đại, bao quát.
theological_decisions:
- issue: θεοῦ συνεργοί có nghĩa là những người cùng làm việc cho Đức Chúa Trời hay những người cùng làm việc với Đức Chúa Trời
  choice: những người cùng làm việc cho Đức Chúa Trời
  alternative: những người cùng làm việc với Đức Chúa Trời
  rationale: Ngữ cảnh nhấn mạnh các người phục vụ thuộc về Đức Chúa Trời và làm công việc dưới quyền Ngài, còn hội chúng là cánh đồng và công trình của Ngài. Tuy nhiên, sở hữu cách trong tiếng Hy Lạp thực sự có thể được hiểu là “với Đức Chúa Trời”, nên cách hiểu ấy được bảo tồn trong chú thích.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh chị em” để thể hiện số nhiều bao quát; tránh từ “đồng công” vì dễ mang sắc thái thuật ngữ tôn giáo.
