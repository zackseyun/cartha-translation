id: 1CO.3.11
reference: 1 Corinthians 3:11
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: θεμέλιον γὰρ ἄλλον οὐδεὶς δύναται θεῖναι παρὰ τὸν κείμενον, ὅς ἐστιν Ἰησοῦς Χριστός·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/011.yaml
  text: For no one can lay another foundation besides the one already laid[a], which is Jesus the Messiah.
translation:
  language: vi
  text: Vì không ai có thể đặt một nền móng nào khác ngoài nền móng đã được đặt, là Giê-su, Đấng Mê-si-a.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “là Giê-su Christ.”'
    reason: Giữ cách phiên âm truyền thống của Χριστός như một phương án quen thuộc, trong khi bản chính dịch từ này theo ý nghĩa tước hiệu.
lexical_decisions:
- source_word: θεμέλιον
  choice: nền móng
  rationale: Danh từ chỉ nền của một công trình và tiếp nối trực tiếp hình ảnh xây dựng trong văn cảnh; “nền móng” tự nhiên và rõ nghĩa trong tiếng Việt hiện đại.
- source_word: γὰρ
  choice: Vì
  rationale: Liên từ đưa ra lý do hoặc lời giải thích cho mệnh đề trước, nên “Vì” giữ được quan hệ lập luận.
- source_word: ἄλλον οὐδεὶς
  choice: không ai ... một ... nào khác
  rationale: Cấu trúc phủ định tiếng Việt này diễn đạt tự nhiên tính phổ quát của οὐδεὶς và ý nghĩa khác biệt/bổ sung của ἄλλον.
- source_word: δύναται θεῖναι
  choice: có thể đặt
  rationale: “Có thể” diễn đạt khả năng; “đặt nền móng” là kết hợp từ tự nhiên, tương ứng với hình ảnh kiến trúc của τίθημι.
- source_word: παρὰ τὸν κείμενον
  choice: ngoài nền móng đã được đặt
  rationale: παρά mang lực loại trừ, còn phân từ κείμενον mô tả nền móng đang ở trạng thái đã được đặt sẵn; cách dịch giữ cả hai nét nghĩa mà không thêm chủ thể hành động.
- source_word: ὅς ἐστιν
  choice: là
  rationale: Đại từ quan hệ quy chiếu về “nền móng”; tiếng Việt có thể dùng “là” tự nhiên để giữ sự đồng nhất hóa trực tiếp.
- source_word: Ἰησοῦς Χριστός
  choice: Đức Chúa Jêsus, Đấng Mê-si-a
  rationale: Giữ tên gọi quen thuộc trong tiếng Việt và dịch Χριστός như một tước hiệu, làm rõ ý nghĩa “Đấng Mê-si-a” thay vì coi đó như họ riêng.
theological_decisions:
- issue: Cách dịch Χριστός trong Ἰησοῦς Χριστός
  choice: Đức Chúa Jêsus, Đấng Mê-si-a
  alternative: Đức Chúa Jêsus Christ
  rationale: Χριστός có ý nghĩa tước hiệu “Đấng được xức dầu/Mê-si-a.” Bản chính biểu đạt tước hiệu ấy bằng tiếng Việt; chú thích giữ cách gọi truyền thống quen thuộc mà không phủ nhận sắc thái tước hiệu.
- issue: Nền móng “đã được đặt”
  choice: Giữ dạng bị động, không nêu ai đã đặt
  alternative: nền móng đã có sẵn
  rationale: κείμενον nhấn mạnh trạng thái nền móng đã được đặt nhưng không chỉ rõ tác nhân. Dạng bị động bảo toàn sự không xác định này, tránh tự ý quyết định đó là Đức Chúa Trời, Phao-lô hay một tác nhân khác.
translation_notes:
  register: Văn phong trang trọng, sáng rõ và hiện đại. “Đặt một nền móng” duy trì hình ảnh kiến trúc của đoạn văn. Dùng “Đức Chúa Jêsus” theo lối gọi Kinh Thánh tiếng Việt quen thuộc; “Đấng Mê-si-a” làm rõ tước hiệu. Dấu chú thích [a] được đặt ngay sau cụm từ liên quan.
