  verdict: revise
  source_fidelity: 'Bản dịch theo sát mệnh đề Hy Lạp: σοφία τοῦ κόσμου τούτου, μωρία, và ý đánh giá trong παρὰ τῷ θεῷ đều được chuyển tải đúng. Câu trích dẫn giữ đúng chủ thể quy chiếu là Đức Chúa Trời và đối tượng là “những người khôn ngoan.” Tuy nhiên, “ngay trong” thêm sắc thái nhấn mạnh không có trong ἐν, và “mưu mô” hơi thiên về các kế hoạch/mưu đồ hơn là phẩm chất xảo quyệt của πανουργία.'
