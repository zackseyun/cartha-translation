  to: 'Vì sự khôn ngoan của thế gian này là sự ngu dại trước mặt Đức Chúa Trời[a]. Vì có lời chép rằng: “Ngài bắt những người khôn ngoan trong sự xảo quyệt của họ[b].”'
  rationale: Chỉnh nhẹ để loại bỏ sắc thái nhấn mạnh được thêm vào bởi “ngay,” dùng “sự xảo quyệt” cho πανουργία, và phục hồi thế đối lập trực tiếp giữa “sự khôn ngoan” và “sự ngu dại.” Các chú thích vẫn được neo đúng vào cụm từ liên quan.
