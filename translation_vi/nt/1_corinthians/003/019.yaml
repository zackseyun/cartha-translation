    issue: “điều ngu dại”
    rationale: Dù không sai nghĩa, cách này làm lệch đối xứng danh từ trừu tượng với “sự khôn ngoan.” “Sự ngu dại” trực tiếp và tự nhiên hơn trong đối lập của Phao-lô.
