id: 1CO.3.19
reference: 1 Corinthians 3:19
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἡ γὰρ σοφία τοῦ κόσμου τούτου μωρία παρὰ τῷ θεῷ ἐστιν· γέγραπται γάρ· Ὁ δρασσόμενος τοὺς σοφοὺς ἐν τῇ πανουργίᾳ αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/019.yaml
  text: For the wisdom of this world is foolishness with God[a]. For it is written[b], “He catches the wise in their craftiness.”
translation:
  language: vi
  text: 'Vì sự khôn ngoan của thế gian này là sự ngu dại trước mặt Đức Chúa Trời[a]. Vì có lời chép rằng: “Ngài bắt những người khôn ngoan trong sự xảo quyệt của họ[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát chữ: “bên Đức Chúa Trời”; nghĩa là theo cách nhìn hoặc sự phán định của Ngài.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “trong mưu mô của họ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: σοφία
  choice: sự khôn ngoan
  rationale: Cách dịch thông dụng, giữ được sự tương phản của Phao-lô giữa điều thế gian coi là khôn ngoan và sự đánh giá của Đức Chúa Trời.
- source_word: κόσμου τούτου
  choice: của thế gian này
  rationale: κόσμος ở đây chỉ trật tự thế gian hiện tại; “thế gian này” tự nhiên và sát nghĩa hơn cách hiểu theo thời đại.
- source_word: μωρία
  choice: điều ngu dại
  rationale: Diễn đạt tự nhiên trong tiếng Việt, đồng thời giữ sự đối lập trực tiếp với “sự khôn ngoan”.
- source_word: παρὰ τῷ θεῷ
  choice: trước mặt Đức Chúa Trời
  rationale: παρά với cách dữ cách diễn tả quan điểm hay sự phán định của Đức Chúa Trời; cách dịch này rõ nghĩa trong tiếng Việt, còn nghĩa sát chữ được ghi ở chú thích.
- source_word: γέγραπται
  choice: có lời chép rằng
  rationale: Công thức tiếng Việt trang trọng và quen thuộc để dẫn lời Kinh Thánh, phản ánh thể hoàn thành bị động của động từ Hy Lạp.
- source_word: δρασσόμενος
  choice: bắt
  rationale: Động từ diễn tả hành động chộp lấy hoặc bắt được; “bắt” ngắn gọn, tự nhiên và phù hợp với sức nặng của câu trích dẫn.
- source_word: σοφοὺς
  choice: những người khôn ngoan
  rationale: Chỉ những người được xem là khôn ngoan mà không thêm giới tính vốn không cần thiết trong ngữ cảnh.
- source_word: πανουργίᾳ
  choice: mưu mô
  rationale: Từ này mang sắc thái tiêu cực về sự khôn khéo gian xảo; “mưu mô” truyền đạt rõ sắc thái ấy trong tiếng Việt hiện đại.
theological_decisions:
- issue: Cách diễn đạt chủ thể thần linh trong lời trích Gióp 5:13
  choice: Ngài bắt những người khôn ngoan ngay trong mưu mô của họ
  alternative: Đấng bắt những người khôn ngoan trong sự xảo quyệt của họ
  rationale: Mạo từ kèm phân từ Hy Lạp chỉ Đức Chúa Trời. Dùng “Ngài” làm chủ ngữ giúp câu trích tự nhiên mà không thêm một khẳng định thần học mới; “ngay trong” giữ ý rằng mưu mô của họ chính là hoàn cảnh họ bị bắt, thay vì giải thích mưu mô như công cụ Đức Chúa Trời sử dụng.
translation_notes:
  register: Văn phong trang trọng vừa phải, hiện đại và dễ hiểu. Giữ hai mệnh đề mở đầu bằng “Vì” để phản ánh hai lần γάρ và mạch lập luận của câu. Các dấu chú thích [a], [b] đều được đặt đúng tại phần văn bản liên quan.
