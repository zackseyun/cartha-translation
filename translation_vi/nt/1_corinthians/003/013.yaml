revisions:
- from: Công việc của mỗi người sẽ trở nên rõ ràng, vì Ngày ấy[a] sẽ phơi bày nó, bởi điều đó được tỏ lộ trong lửa[b]; và chính lửa sẽ thử xem công việc của mỗi người thuộc loại nào.
  to: Công việc của mỗi người sẽ trở nên rõ ràng, vì Ngày ấy[a] sẽ phơi bày nó, vì Ngày ấy được tỏ lộ trong lửa[b]; và chính lửa sẽ thử nghiệm công việc của mỗi người, xem nó thuộc loại nào.
  rationale: Thay “bởi điều đó được tỏ lộ trong lửa” bằng “vì Ngày ấy được tỏ lộ trong lửa” để câu tiếng Việt tự nhiên, đồng thời làm rõ chủ ngữ được hàm ý trong mệnh đề Hy Lạp theo mạch văn. Dùng “thử nghiệm” làm rõ δοκιμάσει là sự kiểm tra phẩm chất; cấu trúc “xem nó thuộc loại nào” giữ ý ὁποῖόν ἐστιν. Các chú thích vẫn được neo ngay tại “Ngày ấy” và “lửa,” phù hợp nội dung của chúng.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T18:10:39Z'
