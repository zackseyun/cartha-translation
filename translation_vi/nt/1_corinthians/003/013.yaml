reference: 1 Corinthians 3:13
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἑκάστου τὸ ἔργον φανερὸν γενήσεται, ἡ γὰρ ἡμέρα δηλώσει· ὅτι ἐν πυρὶ ἀποκαλύπτεται, καὶ ἑκάστου τὸ ἔργον ὁποῖόν ἐστιν τὸ πῦρ ⸀αὐτὸ δοκιμάσει.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/013.yaml
  text: each one’s work will become evident[a], for the Day will disclose it, because it is revealed in fire[b], and the fire itself will test what sort of work each one has.
translation:
  language: vi
  text: Công việc của mỗi người sẽ trở nên rõ ràng, vì Ngày ấy[a] sẽ phơi bày nó, vì Ngày ấy được tỏ lộ trong lửa[b]; và chính lửa sẽ thử nghiệm công việc của mỗi người, xem nó thuộc loại nào.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ngày ấy” có lẽ chỉ ngày tương lai khi Đức Chúa Trời đánh giá hoặc phán xét.
    reason: cross_reference
  - marker: b
    text: Cũng có thể dịch là “bởi lửa”. Cụm Hy Lạp ἐν πυρί có thể được hiểu là “trong lửa” hoặc theo nghĩa phương tiện là “bởi lửa”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑκάστου τὸ ἔργον
  choice: công việc của mỗi người
  rationale: Giữ sắc thái phân phối, nhấn mạnh từng cá nhân, đồng thời dùng “công việc” theo nghĩa rộng phù hợp với hình ảnh những người xây dựng trong văn mạch.
- source_word: φανερὸν γενήσεται
  choice: sẽ trở nên rõ ràng
  rationale: Diễn đạt tự nhiên kết quả tương lai của việc bị đưa ra ánh sáng, không thêm tác nhân vốn không được nêu trong nguyên văn.
- source_word: ἡ ἡμέρα
  choice: Ngày ấy
  rationale: Chỉ một ngày xác định trong tương lai; “ấy” truyền đạt tính xác định tự nhiên hơn trong tiếng Việt mà không phải dựa vào quy ước viết hoa đơn thuần.
- source_word: δηλώσει
  choice: sẽ phơi bày
  rationale: Thể hiện việc làm cho bản chất công việc trở nên rõ, đồng thời phân biệt với động từ ἀποκαλύπτεται ở mệnh đề kế tiếp.
- source_word: ἐν πυρὶ
  choice: trong lửa
  rationale: Giữ cách diễn đạt gần với giới từ Hy Lạp và bảo tồn khả năng hiểu theo nghĩa vị trí hoặc phương tiện; cách hiểu “bởi lửa” được ghi ở chú thích.
- source_word: ἀποκαλύπτεται
  choice: được tỏ lộ
  rationale: Giữ thể bị động và ý niệm vén mở. Cụm “điều đó” không xác định quá mức đối tượng quy chiếu của chủ ngữ hàm ẩn.
- source_word: ὁποῖόν ἐστιν
  choice: thuộc loại nào
  rationale: Diễn đạt tự nhiên câu hỏi về tính chất hay phẩm chất của công việc, thay vì chỉ hỏi công việc tồn tại hay không.
- source_word: τὸ πῦρ αὐτὸ δοκιμάσει
  choice: chính lửa sẽ thử
  rationale: “Chính” bảo tồn sắc thái nhấn mạnh của αὐτό; “thử” thể hiện sự kiểm nghiệm nhằm xác định tính chất hoặc phẩm chất.
theological_decisions:
- issue: “Ngày” có chỉ một ngày thông thường hay ngày tương lai của sự đánh giá thần thượng hay không
  choice: Ngày ấy
  alternative: ngày đó / ngày
  rationale: Mạo từ và văn mạch hướng đến một ngày cánh chung xác định, khi công việc của mỗi người được đánh giá; bản dịch không thêm trực tiếp từ “phán xét” vốn không có trong câu.
- issue: Chủ ngữ hàm ẩn của ἀποκαλύπτεται
  choice: điều đó được tỏ lộ
  alternative: Ngày ấy được tỏ lộ / công việc được tỏ lộ
  rationale: Nguyên văn không lặp lại danh từ làm chủ ngữ, và quan hệ quy chiếu có thể được hiểu theo hơn một cách. “Điều đó” bảo tồn phần nào sự mở này thay vì âm thầm ấn định chủ ngữ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngày ấy” để thể hiện một ngày xác định; tránh thêm thuật ngữ hệ phái. Dấu chấm phẩy giúp giữ hai vế liên kết chặt chẽ như nguyên văn.
