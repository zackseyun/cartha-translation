  text: ὥστε οὔτε ὁ φυτεύων ἐστίν τι οὔτε ὁ ποτίζων, ἀλλ’ ὁ αὐξάνων θεός.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/007.yaml
  text: So neither the one planting is anything[a], nor the one watering, but God who causes the growth.
translation:
  language: vi
  text: Vậy, người trồng chẳng là gì, người tưới cũng chẳng là gì, nhưng Đức Chúa Trời là Đấng làm cho tăng trưởng.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “nhưng Đức Chúa Trời là Đấng ban sự tăng trưởng.”'
    reason: Nêu một cách diễn đạt tự nhiên khác cho ὁ αὐξάνων, vẫn giữ Đức Chúa Trời là tác nhân làm phát triển.
lexical_decisions:
- source_word: ὥστε
  choice: Vậy
  rationale: Diễn tả kết luận suy ra từ lập luận trước đó một cách tự nhiên và gọn trong tiếng Việt.
- source_word: ὁ φυτεύων
  choice: người trồng
  rationale: Giữ hình ảnh gieo trồng và cấu trúc song song của hai phân từ được dùng như danh từ.
- source_word: ἐστίν τι
  choice: không là gì
  rationale: Bám sát thành ngữ Hy Lạp, nhấn mạnh rằng người phục vụ không có vai trò quyết định, chứ không phủ nhận giá trị con người của họ.
- source_word: ὁ ποτίζων
  choice: người tưới
  rationale: Tự nhiên trong tiếng Việt và song song rõ với “người trồng”.
- source_word: ἀλλ’
  choice: nhưng
  rationale: Giữ phép tương phản mạnh giữa những người phục vụ và Đức Chúa Trời.
- source_word: ὁ αὐξάνων
  choice: Đấng làm cho lớn lên
  rationale: 'Diễn đạt nghĩa tác động của αὐξάνω: Đức Chúa Trời khiến cây tăng trưởng; đồng thời không thêm một tân ngữ không có trong câu Hy Lạp.'
- source_word: θεός
  choice: Đức Chúa Trời
  rationale: Danh xưng phổ thông, trang trọng trong tiếng Việt; vị trí trong vế tương phản làm nổi bật Đức Chúa Trời là tác nhân quyết định.
theological_decisions:
- issue: Ý nghĩa của “người trồng không là gì, người tưới cũng không”
  choice: Giữ nguyên lối nói tuyệt đối “không là gì”
  alternative: “không đáng kể” hoặc “không phải là điều quan trọng”
  rationale: Bản Hy Lạp dùng lối nói mạnh để đối chiếu công việc của con người với quyền năng làm tăng trưởng của Đức Chúa Trời. Không nên làm nhẹ sức căng tu từ bằng một cách diễn giải thần học.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Giữ nhịp đối xứng “người trồng… người tưới…” cùng sự tương phản dứt khoát ở cuối câu.
