  rationale: Sửa cú pháp tiếng Việt tại “làm cho lớn lên” và hoàn chỉnh phép đối xứng phủ định, không thay đổi ý nghĩa hay mức độ nhấn mạnh của bản Hy Lạp. Chú thích được điều chỉnh để khớp với bản văn đã sửa.
