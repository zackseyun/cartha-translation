revisions:
- from: Anh chị em không biết rằng anh chị em là đền thờ[a] của Đức Chúa Trời và Thánh Linh của Đức Chúa Trời ngự trong anh chị em[b][c] sao?
  to: Anh chị em không biết rằng anh chị em là đền thờ[a] của Đức Chúa Trời và Thần Linh của Đức Chúa Trời ngự trong anh chị em[b][c] sao?
  rationale: Chỉ thay “Thánh Linh” bằng “Thần Linh” để phản ánh chính xác πνεῦμα τοῦ θεοῦ, không thêm tính từ “thánh” vốn không có trong câu Hy Lạp. Những phần khác đã truyền đạt trung thành số nhiều, câu hỏi tu từ, hình ảnh đền thờ, và độ mở giữa nghĩa “trong” với “giữa” của ἐν ὑμῖν.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T18:10:43Z'
review_pass:
  verdict: revise
  source_fidelity: Bản dịch giữ đúng câu hỏi tu từ, số nhiều của người được nói đến, hình ảnh ναός là “đền thờ”, và sắc thái thường trực của οἰκεῖ qua “ngự”. Tuy nhiên, “Thánh Linh” thêm tính từ “thánh”, trong khi bản Hy Lạp ở câu này viết τὸ πνεῦμα τοῦ θεοῦ (“Thần Linh của Đức Chúa Trời”), không có ἅγιον. Nên tránh thêm yếu tố này vào chính văn.
  naturalness: Cấu trúc “Anh chị em không biết rằng … sao?” rõ ràng, trang trọng và tự nhiên trong văn phong Kinh Thánh tiếng Việt hiện đại. “Ngự trong anh chị em” phù hợp với ẩn dụ đền thờ. Việc lặp “anh chị em” giúp biểu thị số nhiều, dù có tính trang trọng.
  terminology: “Đền thờ của Đức Chúa Trời” diễn đạt chính xác ναὸς θεοῦ; chú thích “nơi thánh” là một phương án từ vựng thích hợp. “Thần Linh của Đức Chúa Trời” giữ nguyên cụm πνεῦμα τοῦ θεοῦ mà không đồng nhất hóa bằng một tính từ không có trong câu nguồn. Các chú thích về số nhiều và khả năng “giữa anh chị em” được đặt đúng neo.
  issues:
  - severity: medium
    issue: “Thánh Linh” thêm yếu tố “thánh” không hiện diện trong τὸ πνεῦμα τοῦ θεοῦ.
    rationale: Dù “Thánh Linh” là một cách gọi quen thuộc trong truyền thống Kitô giáo Việt ngữ, câu nguồn chỉ nói “Thần/Thần Linh của Đức Chúa Trời”. Bản dịch theo tương đương tối ưu nên bảo toàn cách gọi của câu nguồn, không thêm tính từ ἅγιον.
