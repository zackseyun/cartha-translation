id: 1CO.3.16
reference: 1 Corinthians 3:16
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Οὐκ οἴδατε ὅτι ναὸς θεοῦ ἐστε καὶ τὸ πνεῦμα τοῦ θεοῦ ⸂οἰκεῖ ἐν ὑμῖν⸃;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/016.yaml
  text: Do you not know that you are God’s temple and that God’s Spirit dwells in you?[a][b][c]
translation:
  language: vi
  text: Anh chị em không biết rằng anh chị em là đền thờ[a] của Đức Chúa Trời và Thần Linh của Đức Chúa Trời ngự trong anh chị em[b][c] sao?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “nơi thánh”.'
    reason: lexical_alternative
  - marker: b
    text: “Anh chị em” ở đây là số nhiều; Phao-lô đang nói với cả cộng đồng tín hữu.
    reason: cultural_note
  - marker: c
    text: 'Cũng có thể dịch: “ngự giữa anh chị em”.'
    reason: alternative_reading
lexical_decisions:
- source_word: Οὐκ οἴδατε
  choice: Anh chị em không biết ... sao?
  rationale: Giữ nguyên sức nặng của câu hỏi tu từ, đồng thời dùng cách diễn đạt tự nhiên và trang trọng trong tiếng Việt hiện đại.
- source_word: ναὸς
  choice: đền thờ
  rationale: ναός chỉ chính nơi thánh/đền thờ, không phải toàn bộ khuôn viên; “đền thờ” rõ nghĩa và giữ được hình ảnh không gian thánh.
- source_word: θεοῦ
  choice: của Đức Chúa Trời
  rationale: Diễn đạt quan hệ sở thuộc của sở hữu cách Hy Lạp một cách rõ ràng, tự nhiên trong văn phong Kinh Thánh tiếng Việt.
- source_word: ἐστε
  choice: anh chị em là
  rationale: Động từ ở ngôi thứ hai số nhiều. “Anh chị em” làm rõ số nhiều và phù hợp với lời Phao-lô nói với cả cộng đồng.
- source_word: τὸ πνεῦμα τοῦ θεοῦ
  choice: Thánh Linh của Đức Chúa Trời
  rationale: “Thánh Linh” là cách gọi tự nhiên, trang trọng trong tiếng Việt đối với πνεῦμα khi chỉ Thần của Đức Chúa Trời; cụm “của Đức Chúa Trời” bảo toàn quan hệ sở hữu cách.
- source_word: οἰκεῖ
  choice: ngự
  rationale: Diễn tả sự hiện diện thường xuyên và phù hợp với hình ảnh đền thờ; trang trọng mà vẫn quen thuộc với độc giả Việt.
- source_word: ἐν ὑμῖν
  choice: trong anh chị em
  rationale: Giữ nghĩa trực tiếp “trong” và số nhiều của đại từ, đồng thời không loại trừ sắc thái “ở giữa” cộng đồng.
theological_decisions:
- issue: Câu này chủ yếu nói về từng tín hữu hay về hội chúng như một cộng đồng
  choice: Dùng “anh chị em” ở số nhiều, không thêm “mỗi người” hay “hợp lại”.
  alternative: “Mỗi người trong anh chị em là đền thờ” hoặc “anh chị em hợp lại là đền thờ”.
  rationale: Bản Hy Lạp nói với đối tượng số nhiều và văn cảnh nhấn mạnh cộng đồng, nhưng không có từ tương đương với “mỗi người” hay “hợp lại”. Bản dịch giữ nguyên độ mở và sức căng của câu nguồn.
- issue: ἐν ὑμῖν mang nghĩa “trong anh chị em” hay “ở giữa anh chị em”
  choice: Dùng “trong anh chị em” trong chính văn.
  alternative: “Ở giữa anh chị em”.
  rationale: “Trong” là nghĩa trực tiếp, nhưng do đại từ ở số nhiều nên cụm từ cũng có thể mang sắc thái hiện diện giữa cộng đồng; phương án ấy được ghi ở chú thích thay vì bị loại bỏ.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh chị em” để thể hiện rõ đại từ số nhiều và tính cộng đồng; giữ cấu trúc câu hỏi tu từ. Các dấu chú thích [a], [b], [c] đều xuất hiện trong chính văn.
