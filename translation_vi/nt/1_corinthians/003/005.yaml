    rationale: Nguyên văn chỉ có mệnh đề tỉnh lược “và cho mỗi người như Chúa đã ban”; không nói rõ hành động “làm theo”. Chú thích thay thế không nên giải quyết tỉnh lược bằng một hành động không được nêu.
  - severity: low
    issue: Phiên âm “A-pô-lô” không phải dạng thông dụng nhất trong tiếng Việt Kinh Thánh hiện đại.
    rationale: “A-bô-lô” là cách phiên âm quen thuộc hơn cho Ἀπολλῶς; việc thống nhất tên riêng hỗ trợ khả năng nhận diện mà không ảnh hưởng nghĩa.
