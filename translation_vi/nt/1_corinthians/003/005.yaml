reference: 1 Corinthians 3:5
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸀Τί οὖν ἐστιν ⸂Ἀπολλῶς; τί δέ ἐστιν Παῦλος⸃; ⸀διάκονοι δι’ ὧν ἐπιστεύσατε, καὶ ἑκάστῳ ὡς ὁ κύριος ἔδωκεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/005.yaml
  text: What then is Apollos? And what is Paul? Servants through whom you believed[c][b][a], as the Lord gave to each one.
translation:
  language: vi
  text: Vậy, A-bô-lô là gì? Phao-lô là gì? Họ là những người phục vụ, qua họ anh chị em đã tin, mỗi người theo phần Chúa đã ban cho.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mệnh đề tiếng Hy Lạp ở cuối câu được tỉnh lược: có thể hiểu là “mỗi người theo như Chúa đã ban cho.” Bản văn không nói rõ Chúa đã ban điều gì.'
    reason: alternative_reading
  - marker: b
    text: “Những người phục vụ” cũng có thể dịch là “những người hầu việc”; từ Hy Lạp ở đây không nhất thiết chỉ chức vụ chấp sự trong hội thánh.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί
  choice: là gì
  rationale: Đại từ nghi vấn trung tính nhấn mạnh vai trò hoặc địa vị của A-pô-lô và Phao-lô, thay vì hỏi về danh tính; cách nói này cũng tự nhiên trong tiếng Việt.
- source_word: οὖν
  choice: Vậy
  rationale: Diễn đạt sức chuyển tiếp và suy luận của οὖν một cách tự nhiên, không làm quan hệ lô-gic trở nên quá mạnh.
- source_word: δέ
  choice: Phao-lô là gì?
  rationale: Trong cặp câu hỏi tu từ này, δέ chỉ sự tiếp nối hoặc đối chiếu nhẹ; tiếng Việt tự nhiên có thể không cần dịch bằng một liên từ riêng.
- source_word: διάκονοι
  choice: những người phục vụ
  rationale: Chỉ những người làm công việc phục vụ hay tác nhân phục vụ trong ngữ cảnh này, không nhất thiết là chức vụ chấp sự chính thức.
- source_word: δι’ ὧν
  choice: qua họ
  rationale: Giữ ý nghĩa phương tiện hoặc trung gian của διά với sở hữu cách.
- source_word: ἐπιστεύσατε
  choice: anh chị em đã tin
  rationale: Diễn đạt trực tiếp hành động tin trong quá khứ; đại từ số nhiều phù hợp lời Phao-lô nói với cả cộng đồng tín hữu.
- source_word: καὶ ἑκάστῳ ὡς ὁ κύριος ἔδωκεν
  choice: theo phần Chúa ban cho mỗi người
  rationale: Tiếng Hy Lạp tỉnh lược đối tượng được ban. Cụm “theo phần” tạo câu tiếng Việt rõ nghĩa nhưng không xác định đó là nhiệm vụ, vai trò hay ân tứ.
- source_word: κύριος
  choice: Chúa
  rationale: Cách dịch chuẩn, trang trọng của κύριος; bản văn chính không xác định thêm danh tính của Đấng được nói đến.
theological_decisions:
- issue: Đối tượng được κύριος chỉ đến
  choice: Giữ là “Chúa” trong bản văn, không nói rõ thêm.
  alternative: Nêu rõ là Chúa Giê-su, hoặc hiểu rộng là Đức Chúa Trời.
  rationale: Ngữ cảnh có thể hướng đến Chúa Giê-su là Đấng phân chia công việc phục vụ, nhưng câu này không nêu danh hiệu đầy đủ; bản dịch giữ nguyên mức độ xác định của nguồn.
- issue: Sự tỉnh lược trong mệnh đề “như Chúa đã ban cho mỗi người”
  choice: Dịch “theo phần Chúa ban cho mỗi người,” không định danh điều được ban.
  alternative: “theo nhiệm vụ Chúa giao cho mỗi người” hoặc “theo vai trò Chúa ban cho mỗi người.”
  rationale: Không thêm “nhiệm vụ,” “vai trò” hay “ân tứ,” vì những từ ấy giải quyết một điều mà tiếng Hy Lạp để ngỏ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ câu hỏi “là gì?” để làm nổi bật vai trò thấp bé của các lãnh đạo. Dùng “anh chị em” cho ngôi thứ hai số nhiều trong lời nói với cả cộng đồng. Tên riêng được phiên âm theo cách dùng Kinh Thánh tiếng Việt quen thuộc.
