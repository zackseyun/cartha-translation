id: 1CO.3.4
reference: 1 Corinthians 3:4
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὅταν γὰρ λέγῃ τις· Ἐγὼ μέν εἰμι Παύλου, ἕτερος δέ· Ἐγὼ Ἀπολλῶ, ⸂οὐκ ἄνθρωποί⸃ ἐστε;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/004.yaml
  text: For whenever someone says[a], “I am of Paul,” and another, “I am of Apollos,” are you not merely human?
translation:
  language: vi
  text: 'Vì mỗi khi người này nói: “Tôi thuộc về Phao-lô,” còn người khác nói: “Tôi thuộc về A-pô-lô,” thì chẳng phải anh chị em chỉ là người phàm sao?[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát: “chẳng phải anh chị em là người sao?” Cũng có thể hiểu: “chẳng phải anh chị em đang hành xử như người đời sao?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν
  choice: mỗi khi
  rationale: Diễn tả một hoàn cảnh không xác định có tính lặp lại, phù hợp hơn với sắc thái của ὅταν so với một lần duy nhất.
- source_word: γὰρ
  choice: vì
  rationale: Giữ mối liên kết giải thích với lập luận ngay trước đó của Phao-lô.
- source_word: λέγῃ τις
  choice: người này nói
  rationale: Diễn đạt tự nhiên chủ thể bất định trong thế đối ứng với ἕτερος, đồng thời không giới hạn vào một cá nhân cụ thể.
- source_word: Ἐγὼ μέν εἰμι Παύλου
  choice: Tôi thuộc về Phao-lô
  rationale: Truyền đạt sở thuộc cách dùng để chỉ sự quy phục hoặc đứng về một phe; tự nhiên hơn trong tiếng Việt mà không xác định sâu hơn bản chất quan hệ.
- source_word: ἕτερος δέ
  choice: còn người khác nói
  rationale: Thể hiện rõ thế tương phản μέν…δέ; động từ “nói” được bổ sung theo phép tỉnh lược của nguyên văn.
- source_word: Ἐγὼ Ἀπολλῶ
  choice: Tôi thuộc về A-pô-lô
  rationale: Bổ sung ý “thuộc về” từ mệnh đề song song trước, giữ nguyên công thức bày tỏ sự đứng về một lãnh đạo.
- source_word: οὐκ ἄνθρωποί ἐστε;
  choice: chẳng phải anh chị em chỉ là người phàm sao?
  rationale: Giữ hình thức câu hỏi tu từ và danh từ “người”; “chỉ là người phàm” chuyển tải sắc thái quở trách trong ngữ cảnh rằng họ đang sống theo lối thuần túy con người.
theological_decisions:
- issue: Sắc thái của ἄνθρωποι trong câu hỏi tu từ
  choice: chỉ là người phàm
  alternative: là người; đang hành xử như người đời
  rationale: Nguyên văn gọi họ là “người” nhưng ngữ cảnh dùng từ này như lời quở trách về cách hành xử thuần túy con người. Bản chính thể hiện lực dụng học ấy, còn chú thích giữ cách dịch sát chữ và cách diễn ý khác.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” để gọi chung cộng đồng tín hữu; phiên âm tên riêng theo lối quen dùng trong Kinh Thánh tiếng Việt. Cấu trúc “người này… còn người khác…” tái hiện sự đối lập giữa hai khẩu hiệu phe phái.
