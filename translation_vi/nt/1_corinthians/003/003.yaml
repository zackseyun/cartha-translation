id: 1CO.3.3
reference: 1 Corinthians 3:3
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἔτι γὰρ σαρκικοί ἐστε. ὅπου γὰρ ἐν ὑμῖν ζῆλος καὶ ⸀ἔρις, οὐχὶ σαρκικοί ἐστε καὶ κατὰ ἄνθρωπον περιπατεῖτε;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/003.yaml
  text: For you are still fleshly. For where there is jealousy and strife among you[a], are you not fleshly and walking according to man?
translation:
  language: vi
  text: Vì anh em vẫn còn thuộc về xác thịt. Vì giữa anh em có lòng ghen tị và sự tranh chấp, chẳng phải anh em thuộc về xác thịt và bước đi theo cách con người[a] sao?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “theo cách thuần túy của con người.”'
    reason: Nêu cách diễn đạt rõ nghĩa hơn cho κατὰ ἄνθρωπον, trong khi bản văn chính giữ sắc thái cô đọng và hình ảnh bước đi.
lexical_decisions:
- source_word: ἔτι
  choice: vẫn còn
  rationale: Diễn tả tình trạng đang tiếp diễn và giữ nguyên sắc thái quở trách của Phao-lô.
- source_word: γὰρ
  choice: vì / bởi
  rationale: Giữ chức năng giải thích của tiểu từ trong cả hai mệnh đề, đồng thời dùng cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: σαρκικοί
  choice: thuộc về xác thịt
  rationale: Giữ mối liên hệ trực tiếp với σάρξ và hình ảnh thần học của Phao-lô, thay vì diễn giải thành “tội lỗi”, “thế tục” hay “bị bản tính tội lỗi chi phối”.
- source_word: ὅπου
  choice: khi
  rationale: Trong câu này, ὅπου chỉ hoàn cảnh mà lòng ghen tị và tranh chấp hiện diện. “Khi” tự nhiên hơn trong tiếng Việt mà không làm thay đổi quan hệ lập luận; “nơi nào” tuy sát hình thức hơn nhưng kém tự nhiên trong văn cảnh.
- source_word: ζῆλος
  choice: lòng ghen tị
  rationale: Trong ngữ cảnh tiêu cực bên cạnh ἔρις, từ này nói đến sự ghen tị chứ không phải lòng sốt sắng tích cực.
- source_word: ἔρις
  choice: sự tranh chấp
  rationale: Bao quát tình trạng bất hòa và xung đột, không thu hẹp nghĩa vào riêng việc cãi vã bằng lời.
- source_word: οὐχὶ
  choice: chẳng phải ... sao?
  rationale: Giữ câu hỏi tu từ hướng người nghe đến câu trả lời khẳng định, theo lối diễn đạt tự nhiên của tiếng Việt.
- source_word: κατὰ ἄνθρωπον
  choice: theo lối người phàm
  rationale: Diễn đạt lối hành xử theo khuôn mẫu thuần túy của con người, đồng thời giữ sắc thái đối lập với đời sống do Thánh Linh định hướng.
- source_word: περιπατεῖτε
  choice: bước đi
  rationale: Giữ ẩn dụ quen thuộc của Phao-lô về cách sống và cách cư xử, thay vì làm phẳng thành “sống” trong bản văn chính.
theological_decisions:
- issue: Cách dịch ngôn ngữ liên quan đến σάρξ trong σαρκικοί
  choice: thuộc về xác thịt
  alternative: thế tục; sống theo bản tính tội lỗi
  rationale: Bản dịch giữ hình ảnh “xác thịt” và sự căng thẳng trong lời Phao-lô quở trách các tín hữu, không đưa một hệ thống giải nghĩa thần học vào chính câu văn.
- issue: Cách dịch κατὰ ἄνθρωπον
  choice: theo lối người phàm
  alternative: theo cách thuần túy của con người
  rationale: “Người phàm” truyền đạt sắc thái về lối hành xử chỉ theo khuôn mẫu con người nhưng không khẳng định nhiều hơn điều câu Hy Lạp nói; cách diễn đạt rõ hơn được ghi ở chú thích.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Cấu trúc câu hỏi tu từ được giữ lại; “bước đi” bảo tồn ẩn dụ đạo đức của nguyên văn, còn “theo lối người phàm” giúp cụm từ tự nhiên hơn so với cách dịch từng chữ.
