  to: Nếu công việc mà ai đó đã xây trên nền vẫn còn[a], thì người ấy sẽ nhận phần thưởng[b].
  rationale: Chỉ sửa cấu trúc cú pháp để loại bỏ sự lặp lại và làm câu tự nhiên hơn. “Vẫn còn” diễn đạt μενεῖ một cách trung tính; “đã xây trên nền” bảo lưu sắc thái xây trên nền có sẵn của ἐποικοδόμησεν trong ngữ cảnh, không bổ sung định danh thần học nào cho nền. Các neo chú thích được giữ đúng ngay sau từ/cụm từ liên quan.
