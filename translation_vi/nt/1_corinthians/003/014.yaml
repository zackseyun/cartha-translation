  yaml_path: translation/nt/1_corinthians/003/014.yaml
  text: If anyone’s work that he built on remains[b][a], he will receive a reward.
translation:
  language: vi
  text: Nếu công việc mà ai đó đã xây trên nền vẫn còn[a], thì người ấy sẽ nhận phần thưởng[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “đứng vững” hoặc “tồn tại”.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “tiền công” hoặc “sự đền đáp”.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴ
  choice: Nếu
  rationale: Dẫn vào một mệnh đề điều kiện đơn giản; “nếu” là cách diễn đạt tự nhiên và chính xác trong tiếng Việt.
- source_word: τινος τὸ ἔργον
  choice: công việc của ai
  rationale: Giữ đại từ bất định ở dạng sở hữu mà không quy định giới tính; “công việc” phù hợp với hình ảnh xây dựng và không thu hẹp ý nghĩa.
- source_word: μενεῖ
  choice: còn lại
  rationale: Diễn đạt nghĩa cơ bản của động từ μένω là còn lại hoặc tiếp tục tồn tại; tránh diễn giải quá mức theo hình ảnh lửa thử nghiệm ở câu trước.
- source_word: ὃ ἐποικοδόμησεν
  choice: là công việc người ấy đã xây trên nền
  rationale: Làm rõ quan hệ của mệnh đề quan hệ với “công việc” và bảo toàn sắc thái xây thêm trên một nền có sẵn trong động từ ghép ἐποικοδομέω. “Nền” được hàm ý bởi động từ và đã được nêu rõ trong ngữ cảnh gần.
- source_word: μισθὸν
  choice: phần thưởng
  rationale: Trong ngữ cảnh công việc được Đức Chúa Trời đánh giá, “phần thưởng” tự nhiên hơn nghĩa kinh tế hẹp của “tiền công”, đồng thời vẫn giữ ý được đền đáp.
- source_word: λήμψεται
  choice: sẽ nhận
  rationale: Phản ánh chính xác thì tương lai và tạo lối diễn đạt trang trọng, tự nhiên.
theological_decisions:
- issue: Tính chất của μισθός
  choice: phần thưởng
  alternative: tiền công; sự đền đáp
  rationale: Không xác định phần thưởng là sự cứu rỗi hay một loại phần thưởng cụ thể; bản dịch giữ nguyên sự khái quát của câu Hy Lạp.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “người ấy” để quy chiếu tự nhiên đến đại từ bất định τινος mà không áp đặt giới tính, vì tiếng Hy Lạp không có đại từ nhân xưng giống đực tách biệt trong mệnh đề chính; hình thái động từ không biểu thị giới.
