id: 1CO.3.18
reference: 1 Corinthians 3:18
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Μηδεὶς ἑαυτὸν ἐξαπατάτω· εἴ τις δοκεῖ σοφὸς εἶναι ἐν ὑμῖν ἐν τῷ αἰῶνι τούτῳ, μωρὸς γενέσθω, ἵνα γένηται σοφός,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/018.yaml
  text: Let no one deceive himself[a]. If anyone among you thinks he is wise in this age, let him become foolish[b], so that he may become wise.
translation:
  language: vi
  text: Đừng ai tự lừa dối mình. Nếu có ai trong anh em cho rằng mình khôn ngoan trong thời đại này[a], thì người ấy hãy trở nên dại[b], để trở nên khôn ngoan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể hiểu: “khôn ngoan theo tiêu chuẩn của thời đại này.”'
    reason: lexical_alternative
  - marker: b
    text: 'Hay: “trở nên một kẻ dại.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μηδεὶς ἑαυτὸν ἐξαπατάτω
  choice: Đừng ai tự lừa dối mình
  rationale: Diễn đạt tự nhiên mệnh lệnh phủ định phổ quát, đồng thời giữ rõ đối tượng phản thân của động từ.
- source_word: δοκεῖ σοφὸς εἶναι
  choice: cho rằng mình khôn ngoan
  rationale: Trong ngữ cảnh này, δοκεῖ nói đến sự tự đánh giá; “cho rằng” truyền đạt ý ấy rõ hơn “có vẻ”.
- source_word: ἐν ὑμῖν
  choice: trong anh em
  rationale: Chỉ một người thuộc cộng đồng tín hữu mà Phao-lô đang ngỏ lời; cách nói này tự nhiên và trang trọng trong văn cảnh thư tín.
- source_word: ἐν τῷ αἰῶνι τούτῳ
  choice: trong thời đại này
  rationale: Giữ sắc thái thời gian–thần học của αἰών và sự tương phản giữa sự khôn ngoan của thời đại hiện tại với sự khôn ngoan thật.
- source_word: μωρὸς γενέσθω
  choice: hãy trở nên dại dột
  rationale: Giữ dạng tính từ vị ngữ và nghịch lý của lời khuyên, không biến nó thành một nhãn căn tính cố định.
- source_word: ἵνα γένηται σοφός
  choice: để có thể trở nên khôn ngoan
  rationale: Bảo toàn mệnh đề mục đích do ἵνα dẫn vào và sự lặp lại có chủ ý của động từ “trở nên”.
theological_decisions:
- issue: Ý nghĩa của αἰών trong sự tương phản của Phao-lô
  choice: thời đại này
  alternative: thế gian này; theo tiêu chuẩn của thời đại này
  rationale: “Thời đại” giữ được sắc thái thời gian của αἰών mà không đồng nhất từ này với thế giới thụ tạo; chú thích bảo lưu cách hiểu về tiêu chuẩn giá trị của thời đại hiện tại.
- issue: Nghịch lý giữa dại dột và khôn ngoan
  choice: giữ nguyên “trở nên dại dột… trở nên khôn ngoan”
  alternative: diễn giải rằng người ấy phải từ bỏ sự khôn ngoan đời này để nhận sự khôn ngoan của Đức Chúa Trời
  rationale: Nguyên văn cố ý để nghịch lý cô đọng; bản dịch không bổ sung lời giải thích thần học vốn không xuất hiện trong câu.
- issue: Chủ thể giống đực số ít trong tiếng Hy Lạp
  choice: người ấy… mình
  alternative: anh ta… chính mình
  rationale: Tiếng Việt không bắt buộc đánh dấu giống ở đại từ. “Người ấy” giữ số ít và tính đại diện của câu Hy Lạp mà không thêm giới tính vào chỗ tiếng Việt không cần.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc mệnh lệnh cùng nghịch lý của nguyên văn được giữ rõ; “trong anh em” phù hợp lối xưng hô cộng đồng trong thư tín Tân Ước.
