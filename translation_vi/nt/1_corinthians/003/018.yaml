  - severity: low
    issue: Cú pháp và lựa chọn “dại dột” có thể tự nhiên hơn
    rationale: “Nếu có ai trong anh em” là trật tự thông dụng hơn. Với μωρός là vị ngữ tương phản trực tiếp với σοφός, “trở nên dại” gọn và sát cấu trúc nghịch lý hơn “trở nên dại dột.”
