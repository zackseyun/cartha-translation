id: 1CO.3.22
reference: 1 Corinthians 3:22
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἴτε Παῦλος εἴτε Ἀπολλῶς εἴτε Κηφᾶς εἴτε κόσμος εἴτε ζωὴ εἴτε θάνατος εἴτε ἐνεστῶτα εἴτε μέλλοντα, πάντα ⸀ὑμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/022.yaml
  text: whether Paul or Apollos or Cephas or the world or life or death or things present or things to come—all are yours,
translation:
  language: vi
  text: dù là Phao-lô, A-pô-lô, Kê-pha, thế gian, sự sống, sự chết, những điều hiện tại hay những điều sắp đến—tất cả đều thuộc về anh chị em,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἴτε … εἴτε
  choice: dù là … hay
  rationale: Chuỗi liên từ nêu hàng loạt đối tượng và thực tại khác nhau; “dù là … hay” giữ được nhịp liệt kê và dẫn tự nhiên đến kết luận bao quát.
- source_word: Παῦλος
  choice: Phao-lô
  rationale: Dùng dạng tên riêng đã quen thuộc trong tiếng Việt.
- source_word: Ἀπολλῶς
  choice: A-pô-lô
  rationale: Phiên âm tên riêng theo cách dùng Kinh Thánh tiếng Việt quen thuộc.
- source_word: Κηφᾶς
  choice: Kê-pha
  rationale: Giữ đúng tên dạng Semit mà bản Hy Lạp dùng, thay vì đổi thành tên tương đương là Phi-e-rơ.
- source_word: κόσμος
  choice: thế gian
  rationale: Cách dịch tự nhiên, có phạm vi đủ rộng để chỉ thế giới hay trật tự thế giới trong lập luận của Phao-lô.
- source_word: ζωή
  choice: sự sống
  rationale: Tương đương trực tiếp và trang trọng, phù hợp với thế đối xứng cùng “sự chết”.
- source_word: θάνατος
  choice: sự chết
  rationale: Tương đương trực tiếp, giữ danh từ trừu tượng song song với “sự sống”.
- source_word: ἐνεστῶτα
  choice: những điều hiện tại
  rationale: Phân từ được danh từ hóa chỉ các thực tại đang hiện hữu; cách dịch này rõ nghĩa và cân xứng với vế kế tiếp.
- source_word: μέλλοντα
  choice: những điều sắp đến
  rationale: Phân từ được danh từ hóa chỉ các thực tại tương lai; “sắp đến” tự nhiên và không xác định khoảng thời gian.
- source_word: πάντα
  choice: tất cả
  rationale: Bao quát toàn bộ danh sách gồm cả con người lẫn sự vật, tránh thu hẹp thành chỉ “mọi vật”.
- source_word: ὑμῶν
  choice: đều thuộc về anh chị em
  rationale: Diễn đạt quan hệ sở hữu của sở hữu cách một cách tự nhiên; “anh chị em” thể hiện ngôi số nhiều và phù hợp khi nói với cả cộng đồng.
theological_decisions:
- issue: Phạm vi và ý nghĩa của mệnh đề πάντα ὑμῶν
  choice: tất cả đều thuộc về anh chị em
  alternative: tất cả đều là của anh chị em
  rationale: Giữ nguyên lời khẳng định sở hữu rộng và đầy căng thẳng tu từ của Phao-lô, không diễn giải thêm rằng các thực tại ấy phục vụ lợi ích tín hữu hay họ có quyền thống trị chúng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ cấu trúc liệt kê dồn dập của nguyên văn; dùng dấu gạch ngang trước kết luận cao trào. Câu là phần tiếp nối cú pháp từ câu trước nên kết thúc bằng dấu phẩy theo văn bản được cung cấp.
