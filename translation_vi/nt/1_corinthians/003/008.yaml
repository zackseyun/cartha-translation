id: 1CO.3.8
reference: 1 Corinthians 3:8
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ φυτεύων δὲ καὶ ὁ ποτίζων ἕν εἰσιν, ἕκαστος δὲ τὸν ἴδιον μισθὸν λήμψεται κατὰ τὸν ἴδιον κόπον,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/008.yaml
  text: The one who plants and the one who waters are one[a], and each will receive his own reward according to his own labor.
translation:
  language: vi
  text: Người trồng và người tưới là một[a], và mỗi người sẽ nhận phần thưởng riêng tùy theo công khó của mình.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “hiệp nhất” hoặc “cùng một mục đích.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: φυτεύων
  choice: người trồng
  rationale: Mạo từ đi với phân từ hiện tại tạo thành danh từ chỉ người; cách dịch này tự nhiên và giữ nguyên hình ảnh nông nghiệp.
- source_word: ποτίζων
  choice: người tưới
  rationale: Cấu trúc song song với φυτεύων; cách dịch ngắn gọn, dễ hiểu và giữ nguyên ẩn dụ.
- source_word: ἕν
  choice: là một
  rationale: Giữ cách diễn đạt cô đọng và phần nào mơ hồ của nguyên văn; dạng trung tính số ít nhấn mạnh sự hiệp nhất chứ không đồng nhất hai người.
- source_word: μισθὸν
  choice: phần thưởng
  rationale: Phù hợp với ngữ cảnh phục vụ và bao quát ý được đền đáp, không giới hạn vào tiền công.
- source_word: λήμψεται
  choice: sẽ nhận
  rationale: Diễn đạt tự nhiên thì tương lai của động từ Hy Lạp.
- source_word: κατὰ
  choice: tùy theo
  rationale: Truyền đạt mối tương ứng giữa phần thưởng và mức công khó một cách tự nhiên trong tiếng Việt.
- source_word: κόπον
  choice: công khó
  rationale: Thể hiện công việc có sự nhọc nhằn và nỗ lực, mạnh hơn từ 'công việc' nhưng vẫn trang trọng, quen thuộc.
- source_word: ἴδιον
  choice: riêng / của mình
  rationale: 'Hai cách diễn đạt trong câu tái hiện sự nhấn mạnh lặp lại của ἴδιον: mỗi người có phần thưởng riêng tương ứng với chính công khó của mình.'
theological_decisions:
- issue: Ý nghĩa của “là một” (ἕν εἰσιν)
  choice: Giữ nguyên “là một”, hàm ý người trồng và người tưới hiệp nhất trong mục đích và công việc.
  alternative: “hiệp nhất” hoặc “cùng một mục đích”
  rationale: Dạng trung tính ἕν nói đến sự hiệp nhất, không phải họ là cùng một người. Bản dịch chính giữ độ cô đọng và sức căng của nguyên văn, còn chú thích làm rõ các khả năng diễn ý trong bối cảnh Phao-lô chống tinh thần phe phái.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Giữ phép ẩn dụ nông nghiệp và cấu trúc đối chiếu; dùng “công khó” để thể hiện sắc thái lao nhọc của κόπος.
