  text: ὑμεῖς δὲ Χριστοῦ, Χριστὸς δὲ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/023.yaml
  text: and you are Messiah's[b][a], and Messiah is God's.
translation:
  language: vi
  text: Còn anh chị em là của Đấng Mê-si-a[a], và Đấng Mê-si-a là của Đức Chúa Trời.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Theo cách gọi truyền thống, “Đấng Christ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς
  choice: anh chị em
  rationale: Đại từ ngôi thứ hai số nhiều chỉ toàn thể cộng đồng tín hữu; “anh chị em” diễn đạt tự nhiên, trang trọng và rõ số nhiều trong tiếng Việt hiện đại.
- source_word: δὲ
  choice: còn … và
  rationale: Ở vế đầu, “còn” thể hiện bước chuyển có sắc thái đối chiếu trong chuỗi lập luận; ở vế sau, “và” duy trì sự nối tiếp và cấu trúc song song mà không nhấn mạnh sự tương phản quá mức.
- source_word: Χριστοῦ / Χριστός
  choice: Đấng Mê-si-a
  rationale: Giữ nghĩa tước hiệu của Χριστός và lặp lại cùng một cách gọi để bảo toàn tính cân xứng tu từ của câu Hy Lạp.
- source_word: θεοῦ
  choice: Đức Chúa Trời
  rationale: Cách gọi trang trọng, quen thuộc trong tiếng Việt, chỉ θεός ở dạng sở hữu trong mệnh đề “là của Đức Chúa Trời”.
theological_decisions:
- issue: Cách diễn đạt hai cấu trúc sở hữu Χριστοῦ và θεοῦ mà không giải thích quá mức mối quan hệ thần học.
  choice: “anh chị em là của Đấng Mê-si-a, và Đấng Mê-si-a là của Đức Chúa Trời”
  alternative: “anh chị em thuộc về Đấng Mê-si-a, và Đấng Mê-si-a thuộc về Đức Chúa Trời”
  rationale: “Là của” bám sát hai sở hữu cách cô đọng và giữ nguyên cấu trúc song song cũng như sức căng thần học của nguyên văn; không tự ý xác định cụ thể bản chất của sự thuộc về.
translation_notes:
  register: Văn phong ngắn gọn, trang trọng và dễ hiểu. Cấu trúc “là của” được giữ ở cả hai vế để phản ánh sự súc tích và đối xứng của nguyên văn; “anh chị em” làm rõ đối tượng số nhiều.
