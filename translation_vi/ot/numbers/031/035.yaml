revisions:
- from: Còn số người trong các phụ nữ chưa từng ăn nằm với đàn ông[a], tổng cộng là ba mươi hai ngàn người.
  to: Còn những phụ nữ chưa từng nằm với đàn ông[a] thì có tất cả ba mươi hai nghìn người.
  rationale: Bản sửa thay cấu trúc không tự nhiên bằng một mệnh đề tiếng Việt rõ ràng, vẫn nêu đúng nhóm phụ nữ được kiểm đếm và tổng số 32.000. Cách nói uyển ngữ trong bản văn được duy trì, còn nghĩa thành ngữ được giải thích trong chú thích.
