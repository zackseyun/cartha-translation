  text: And the persons from the women who had not known the bed of a male[a], all the persons, were thirty-two thousand.
translation:
  language: vi
  text: Còn những phụ nữ chưa từng nằm với đàn ông[a] thì có tất cả ba mươi hai nghìn người.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hê-bơ-rơ: “chưa biết việc nằm với một người nam,” một thành ngữ chỉ việc chưa có quan hệ tình dục với đàn ông.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶפֶשׁ אָדָם
  choice: số người
  rationale: Trong ngữ cảnh kiểm đếm chiến lợi phẩm, cụm này chỉ người, đối lập với gia súc ở các câu chung quanh; cách diễn đạt này tự nhiên trong tiếng Việt mà vẫn giữ rõ đối tượng là con người.
- source_word: מִן הַנָּשִׁים
  choice: trong các phụ nữ
  rationale: מִן đánh dấu nhóm được tính là một bộ phận thuộc số phụ nữ đã bị bắt; “trong các phụ nữ” diễn đạt tự nhiên quan hệ bộ phận này.
- source_word: אֲשֶׁר לֹא יָדְעוּ מִשְׁכַּב זָכָר
  choice: chưa từng ăn nằm với đàn ông
  rationale: Cụm Hê-bơ-rơ là một lối nói chỉ việc chưa có quan hệ tình dục với nam giới. “Ăn nằm với” là thành ngữ tiếng Việt trang trọng vừa phải, dễ hiểu và không thô tục.
- source_word: כָּל נֶפֶשׁ
  choice: tổng cộng ... người
  rationale: Cụm này tổng kết toàn bộ số người thuộc nhóm vừa nêu; chuyển thành công thức đếm tự nhiên trong tiếng Việt.
- source_word: שְׁנַיִם וּשְׁלֹשִׁים אָלֶף
  choice: ba mươi hai ngàn
  rationale: Cách biểu đạt chuẩn, tự nhiên của con số 32.000 trong tiếng Việt hiện đại.
