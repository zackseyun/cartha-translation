  text: Rồi Đức Giê-hô-va phán với Môi-se rằng:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Và Đức Giê-hô-va nói với Môi-se rằng.” Tiếng Hê-bơ-rơ dùng một công thức kể chuyện thông thường để mở đầu lời phán.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Rồi ... phán
  rationale: Động từ אמר với waw liên tiếp đưa câu chuyện tiến sang lời phán kế tiếp. “Rồi” diễn đạt tự nhiên trình tự ấy; “phán” phù hợp với lời Đức Chúa Trời nói.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng dạng tên riêng đã quen thuộc trong tiếng Việt để biểu thị trực tiếp danh giao ước יהוה, thay vì thay thế bằng một tước hiệu.
- source_word: אֶל מֹשֶׁה
  choice: với Môi-se
  rationale: Cách nói tiếng Việt tự nhiên trong công thức giới thiệu lời phán; מֹשֶׁה được phiên âm theo dạng quen thuộc “Môi-se”.
- source_word: לֵאמֹר
  choice: rằng
  rationale: Từ này mở đầu nội dung lời phán ở câu kế tiếp. “Rằng” giữ chức năng dẫn lời mà tự nhiên hơn “nói rằng” sau động từ “phán”.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Đức Giê-hô-va
  alternative: Yahweh; CHÚA
  rationale: Bản Hê-bơ-rơ dùng trực tiếp danh riêng יהוה. “Đức Giê-hô-va” bảo tồn tính chất tên riêng trong lối dùng tiếng Việt phổ thông, không thay bằng tước hiệu; chú thích ghi nhận dạng phiên âm khác.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ dấu hai chấm vì nội dung lời phán tiếp tục ở câu sau; tránh lặp nặng nề “phán... nói rằng”.
