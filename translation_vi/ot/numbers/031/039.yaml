  text: וַ/חֲמֹרִ֕ים שְׁלֹשִׁ֥ים אֶ֖לֶף וַ/חֲמֵ֣שׁ מֵא֑וֹת וּ/מִכְסָ֥/ם לַֽ/יהוָ֖ה אֶחָ֥ד וְ/שִׁשִּֽׁים׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/039.yaml
  text: The donkeys were 30,500[a], and their tribute to Yahweh was 61.
translation:
  language: vi
  text: 'Lừa: 30.500 con; phần phải nộp[a] cho Yahweh là 61 con.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “phần trưng thu”. Từ Hê-bơ-rơ chỉ phần đã được ấn định, trích từ chiến lợi phẩm để dành cho Yahweh.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַ/חֲמֹרִים
  choice: Số lừa
  rationale: חֲמֹרִים là danh từ số nhiều thông dụng chỉ loài lừa. Cách mở đầu “Số lừa” tự nhiên trong một bản kê số lượng và vẫn giữ quan hệ nối tiếp với các mục trước.
- source_word: שְׁלֹשִׁים אֶלֶף וַ/חֲמֵשׁ מֵאוֹת
  choice: 30.500 con
  rationale: Cụm số Hê-bơ-rơ có nghĩa là ba mươi nghìn năm trăm. Dùng chữ số phù hợp với văn cảnh thống kê; thêm loại từ “con” theo cách diễn đạt tự nhiên của tiếng Việt.
- source_word: וּ/מִכְסָ/ם
  choice: phần cống nạp của số đó
  rationale: מֶכֶס ở đây chỉ phần bắt buộc được trích từ chiến lợi phẩm. Trong câu chính, đại từ sở hữu được diễn đạt tự nhiên qua cấu trúc “phần cống nạp ... dành cho”; chú thích giữ phương án “phần trưng thu” để phản ánh sắc thái đánh phần.
- source_word: לַ/יהוָה
  choice: dành cho Yahweh
  rationale: Giới từ לְ biểu thị phần cống nạp thuộc về hoặc được trao cho Yahweh. “Dành cho” tự nhiên trong tiếng Việt và không buộc phải xác định thêm nghi thức trao dâng.
- source_word: אֶחָד וְ/שִׁשִּׁים
  choice: 61 con
  rationale: Trật tự số trong tiếng Hê-bơ-rơ có nghĩa là sáu mươi mốt. Dùng chữ số để nhất quán với bản kê và thêm “con” vì đối tượng được đếm là lừa.
theological_decisions:
- issue: Cách chuyển dịch danh riêng יהוה
  choice: Yahweh
  alternative: ĐỨC CHÚA
  rationale: Nguyên văn dùng trực tiếp danh giao ước יהוה. Giữ “Yahweh” bảo tồn tính chất danh riêng thay vì thay bằng một tước hiệu.
- issue: Quan hệ của phần cống nạp với Yahweh
  choice: dành cho Yahweh
  alternative: dâng cho Yahweh
  rationale: לַיהוָה có thể chỉ sự thuộc về hoặc hướng đến. “Dành cho” giữ được độ rộng nghĩa ấy, không diễn giải quá mức rằng câu đang mô tả chính hành động nghi lễ dâng lên.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng chữ số theo quy ước tiếng Việt trong danh sách thống kê. Dấu chú thích [a] được đặt ngay sau thuật ngữ mà chú thích giải thích.
