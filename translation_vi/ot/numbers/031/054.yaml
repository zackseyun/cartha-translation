base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/054.yaml
  text: So Moses and Eleazar the priest took the gold from the commanders of thousands and of hundreds[a], and they brought it into the tent of meeting as a memorial for the sons of Israel before Yahweh.
translation:
  language: vi
  text: Vậy, Môi-se và thầy tế lễ Ê-lê-a-sa lấy vàng từ các chỉ huy đơn vị ngàn người và trăm người, rồi đem số vàng ấy vào Lều Hội Kiến, làm vật tưởng niệm cho dân Israel[a] trước mặt Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát chữ: “các con trai của Israel”; đây là danh xưng giao ước quen thuộc chỉ dân Israel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: lấy
  rationale: Động từ לקח ở dạng kể chuyện có nghĩa trực tiếp là “lấy”; cách dịch này tự nhiên và giữ sát hành động trong tiếng Hê-bơ-rơ.
- source_word: הַזָּהָב
  choice: số vàng
  rationale: Mạo từ xác định chỉ số vàng đã được nói đến trong ngữ cảnh; “số vàng” tự nhiên hơn “vàng ấy” trong tiếng Việt.
- source_word: מֵאֵת
  choice: từ
  rationale: Giới từ này đánh dấu nguồn xuất phát; “từ” là cách diễn đạt rõ và tự nhiên.
- source_word: שָׂרֵי הָאֲלָפִים וְהַמֵּאוֹת
  choice: các chỉ huy hàng ngàn và hàng trăm
  rationale: Trong bối cảnh quân sự, שׂרים là những người chỉ huy; “hàng ngàn và hàng trăm” giữ cách gọi các đơn vị quân sự-hành chính của nguyên văn mà không khẳng định quân số thực tế.
- source_word: אֹהֶל מוֹעֵד
  choice: Lều Hội Kiến
  rationale: Đây là danh xưng quen dùng cho nơi Đức Chúa Trời gặp dân Ngài; viết hoa để biểu thị một địa điểm thờ phượng cụ thể.
- source_word: זִכָּרוֹן
  choice: vật tưởng niệm
  rationale: Danh từ chỉ một vật hoặc dấu hiệu giúp ghi nhớ; trong câu này số vàng được đem vào lều với chức năng tưởng niệm.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: cho con cháu Israel
  rationale: Đây là cách gọi giao ước quen thuộc dành cho cộng đồng Israel. “Con cháu Israel” tự nhiên trong tiếng Việt và tránh khiến độc giả hiểu rằng câu chỉ nói đến nam giới, trong khi chú thích vẫn bảo lưu hình thức sát chữ.
- source_word: לִפְנֵי יְהוָה
  choice: trước mặt Yahweh
  rationale: Cụm từ diễn tả sự hiện diện trước Đức Chúa Trời trong bối cảnh thờ phượng; “trước mặt” vừa rõ nghĩa vừa gần cấu trúc nguyên văn.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ danh riêng được biểu thị bằng bốn phụ âm YHWH thay vì thay bằng một tước hiệu.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Nguyên văn dùng trực tiếp danh giao ước YHWH; “Yahweh” bảo lưu tính chất danh riêng mà không thay thế bằng tước hiệu.
- issue: Cách dịch בני ישראל
  choice: con cháu Israel
  alternative: các con trai của Israel; dân Israel
  rationale: Cụm từ này theo mặt chữ là “các con trai của Israel” nhưng thường là danh xưng tập thể chỉ cộng đồng giao ước. Bản dịch chính dùng cách nói tự nhiên, bao quát đúng đối tượng; chú thích ghi lại cấu trúc sát chữ để bảo tồn sắc thái nguyên ngữ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng các tên phiên âm quen thuộc “Môi-se”, “Ê-lê-a-sa”, danh xưng “Lều Hội Kiến”, và giữ “Yahweh” làm danh riêng. Cấu trúc câu duy trì nhịp kể chuyện của nguyên văn nhưng tránh lối diễn đạt gượng ép.
