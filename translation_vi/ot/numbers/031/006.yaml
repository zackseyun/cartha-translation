  text: וַ/יִּשְׁלַ֨ח אֹתָ֥/ם מֹשֶׁ֛ה אֶ֥לֶף לַ/מַּטֶּ֖ה לַ/צָּבָ֑א אֹ֠תָ/ם וְ/אֶת פִּ֨ינְחָ֜ס בֶּן אֶלְעָזָ֤ר הַ/כֹּהֵן֙ לַ/צָּבָ֔א וּ/כְלֵ֥י הַ/קֹּ֛דֶשׁ וַ/חֲצֹצְר֥וֹת הַ/תְּרוּעָ֖ה בְּ/יָדֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/006.yaml
  text: So Moses sent them to the war[a], a thousand from each tribe, them and Phinehas son of Eleazar the priest, to the war[b], with the holy vessels and the trumpets for the battle cry in his hand.
translation:
  language: vi
  text: Môi-se sai họ—mỗi bộ tộc một ngàn người—ra trận, cùng với Phi-nê-a, con trai thầy tế lễ Ê-lê-a-sa. Phi-nê-a mang theo các vật thánh[a] và những chiếc kèn dùng để phát hiệu lệnh xung trận[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “các vật dụng của nơi thánh” hoặc “các đồ dùng thánh”.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “những chiếc kèn phát tín hiệu” hoặc “những chiếc kèn báo động”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: sai ... ra trận
  rationale: Trong văn thuật sự, “sai” diễn đạt tự nhiên hành động Môi-se phái người đi thi hành nhiệm vụ; kết hợp với לַצָּבָא thành “sai ... ra trận”.
- source_word: אֶלֶף לַמַּטֶּה
  choice: mỗi bộ tộc một ngàn người
  rationale: 'Diễn đạt rõ ý phân phối: mỗi bộ tộc cung cấp một ngàn người.'
- source_word: לַצָּבָא
  choice: ra trận
  rationale: Ở đây צבא chỉ hoạt động quân sự hay chiến trận, không chủ yếu chỉ quân đội như một tổ chức. “Ra trận” tự nhiên và giữ được hướng chuyển động.
- source_word: אֹתָם ... אֹתָם
  choice: họ ... họ cùng
  rationale: Giữ sự lặp lại của đại từ trong tiếng Hê-bơ-rơ nhưng sắp xếp thành hai câu tiếng Việt để câu văn rõ và tự nhiên.
- source_word: פִּינְחָס בֶּן אֶלְעָזָר הַכֹּהֵן
  choice: Phi-nê-a, con trai thầy tế lễ Ê-lê-a-sa
  rationale: Dùng dạng phiên âm quen thuộc trong tiếng Việt và thể hiện quan hệ phụ tử cùng chức vụ tư tế được nêu trong cụm từ.
- source_word: וּכְלֵי הַקֹּדֶשׁ
  choice: các vật thánh
  rationale: כְּלֵי có nghĩa rộng là đồ dùng, vật dụng hay khí cụ; “các vật thánh” tránh thu hẹp không chắc chắn thành bình hoặc dụng cụ cụ thể. Chú thích giữ các cách hiểu gắn với nơi thánh.
- source_word: וַחֲצֹצְרוֹת הַתְּרוּעָה
  choice: những chiếc kèn dùng để thổi hiệu lệnh xung trận
  rationale: חֲצֹצְרוֹת là các kèn bạc dùng trong nghi lễ, còn תְּרוּעָה là tiếng hiệu lệnh lớn, đặc biệt thích hợp với bối cảnh quân sự ở đây.
- source_word: בְּיָדוֹ
  choice: Phi-nê-a mang theo
  rationale: Thành ngữ “trong tay ông” chỉ vật thuộc quyền cầm giữ hoặc phụ trách. Nêu lại Phi-nê-a làm chủ thể trong tiếng Việt giúp tránh đại từ mơ hồ mà vẫn theo tiền ngữ số ít gần nhất.
theological_decisions:
- issue: Vai trò của Phi-nê-a và các vật thánh trong cuộc viễn chinh
  choice: Phi-nê-a đi cùng lực lượng với tư cách người thuộc hàng tư tế, mang theo các vật thánh và kèn phát hiệu lệnh.
  alternative: Phi-nê-a chỉ là người quan sát, hoặc các vật này không có ý nghĩa tư tế trong chuyến đi.
  rationale: Câu văn trực tiếp đặt Phi-nê-a, các vật thánh và kèn hiệu trong đoàn ra trận. Bản dịch giữ mối liên hệ nghi lễ–quân sự này nhưng không thêm bất kỳ kết luận giáo lý nào về chiến tranh thánh.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Hai mệnh đề được tách thành hai câu để giữ sự lặp lại của nguyên văn mà không làm tiếng Việt nặng nề. Các dấu chú thích [a], [b] được đặt ngay sau những cụm từ mà chúng giải thích.
