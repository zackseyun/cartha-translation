revisions:
- from: Vậy Môi-se sai họ ra trận, mỗi bộ tộc một ngàn người. Ông sai họ cùng Phi-nê-a, con trai thầy tế lễ Ê-lê-a-sa, ra trận; Phi-nê-a mang theo các vật thánh[a] và những chiếc kèn dùng để thổi hiệu lệnh xung trận[b].
  to: Môi-se sai họ—mỗi bộ tộc một ngàn người—ra trận, cùng với Phi-nê-a, con trai thầy tế lễ Ê-lê-a-sa. Phi-nê-a mang theo các vật thánh[a] và những chiếc kèn dùng để phát hiệu lệnh xung trận[b].
  rationale: Bản sửa chỉ điều chỉnh cấu trúc để biểu thị rõ rằng Môi-se thực hiện một hành động phái đi gồm lực lượng một ngàn người mỗi bộ tộc cùng Phi-nê-a. Câu thứ hai giữ cách hiểu tự nhiên nhất của đại từ số ít “trong tay ông,” tức Phi-nê-a, mà không thêm giải thích về chức năng nghi lễ hay quân sự ngoài văn bản. Các neo chú thích vẫn đặt đúng sau những cụm từ được chú giải.
