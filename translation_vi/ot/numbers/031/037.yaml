  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יְהִ֛י הַ/מֶּ֥כֶס לַֽ/יהוָ֖ה מִן הַ/צֹּ֑אן שֵׁ֥שׁ מֵא֖וֹת חָמֵ֥שׁ וְ/שִׁבְעִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/037.yaml
  text: And the tribute for Yahweh from the flock was six hundred seventy-five.
translation:
  language: vi
  text: Phần cống nộp dành cho Yahweh lấy từ bầy chiên dê là sáu trăm bảy mươi lăm con.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: là
  rationale: Trong câu tường thuật này, dạng của היה làm chức năng liên kết chủ ngữ với số lượng; tiếng Việt tự nhiên có thể dùng “là” mà không cần dịch riêng liên từ mở đầu.
- source_word: הַמֶּכֶס
  choice: phần cống nộp
  rationale: מֶכֶס chỉ phần bị trích ra từ chiến lợi phẩm như một khoản phải nộp. “Phần cống nộp” vừa thể hiện đây là một phần được ấn định, vừa tránh sắc thái thuế hiện đại.
- source_word: לַיהוָה
  choice: dành cho Yahweh
  rationale: Giới từ ל ở đây biểu thị phần được dành riêng cho Yahweh; “dành cho” là cách diễn đạt tự nhiên và rõ nghĩa trong tiếng Việt.
- source_word: יהוה
  choice: Yahweh
  rationale: Chuyển tự danh riêng giao ước của Đức Chúa Trời, phù hợp với bằng chứng trực tiếp của bản Hê-bơ-rơ và lớp tham khảo POB đã cập nhật.
- source_word: מִן הַצֹּאן
  choice: lấy từ bầy chiên dê
  rationale: צֹאן là danh từ tập hợp chỉ gia súc nhỏ, thường gồm chiên và dê. “Bầy chiên dê” giữ được phạm vi nghĩa, không thu hẹp thành chỉ chiên.
- source_word: שֵׁשׁ מֵאוֹת חָמֵשׁ וְשִׁבְעִים
  choice: sáu trăm bảy mươi lăm con
  rationale: Giữ chính xác tổng số; thêm loại từ “con” theo cách đếm động vật tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: CHÚA
  rationale: Nguyên văn dùng trực tiếp Tetragrammaton; giữ “Yahweh” bảo tồn tư cách danh riêng thay vì thay bằng một tước hiệu.
- issue: Phạm vi của צֹאן
  choice: bầy chiên dê
  alternative: bầy chiên
  rationale: Từ Hê-bơ-rơ có thể bao gồm cả chiên lẫn dê; không nên thu hẹp nghĩa khi ngữ cảnh câu này không buộc phải làm vậy.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu được sắp xếp theo trật tự tiếng Việt tự nhiên, đồng thời giữ rõ đây là phần chiến lợi phẩm được dành cho Yahweh và giữ nguyên con số.
