  yaml_path: translation/ot/numbers/031/027.yaml
  text: And divide the plunder between those who took part in the war[a], who went out to battle[b], and all the congregation.
translation:
  language: vi
  text: Hãy chia chiến lợi phẩm giữa những người tham chiến, tức những người đã ra trận, và toàn thể cộng đồng.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְחָצִיתָ
  choice: Hãy chia
  rationale: Động từ חצה chỉ việc chia ra; dạng mệnh lệnh tiếng Việt diễn đạt tự nhiên lời Đức Chúa Trời truyền cho Môi-se trong ngữ cảnh.
- source_word: הַמַּלְקוֹחַ
  choice: chiến lợi phẩm
  rationale: מַלְקוֹחַ chỉ những gì bị lấy trong chiến tranh, và trong ngữ cảnh bao gồm cả người lẫn súc vật; “chiến lợi phẩm” là cách gọi hiện đại, trang trọng và đủ rộng.
- source_word: בֵּין
  choice: giữa
  rationale: Giới từ đánh dấu hai bên được phân chia phần chiến lợi phẩm.
- source_word: תֹּפְשֵׂי הַמִּלְחָמָה
  choice: những người tham chiến
  rationale: Cụm từ theo nghĩa đen là những người “nắm/đảm trách cuộc chiến”, một thành ngữ chỉ những người trực tiếp chiến đấu; “những người tham chiến” vừa sát nghĩa vừa tự nhiên.
- source_word: הַיֹּצְאִים לַצָּבָא
  choice: những người đã ra trận
  rationale: Phân từ này xác định thêm nhóm tham chiến là những người đã ra đi làm nhiệm vụ quân sự; “ra trận” truyền đạt rõ nghĩa quân sự trong văn cảnh.
- source_word: וּבֵין כָּל הָעֵדָה
  choice: và toàn thể cộng đồng
  rationale: עֵדָה chỉ toàn thể cộng đồng hội tụ của Israel; “cộng đồng” rõ ràng và tự nhiên trong tiếng Việt hiện đại.
theological_decisions: []
translation_notes:
  register: Văn phong mệnh lệnh trang trọng, rõ ràng và hiện đại. Dùng “tức” để thể hiện rằng הַיֹּצְאִים לַצָּבָא bổ nghĩa cho cùng nhóm תֹּפְשֵׂי הַמִּלְחָמָה, không phải một nhóm thứ ba.
