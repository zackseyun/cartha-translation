base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/010.yaml
  text: And they burned with fire all their cities in their dwelling places[b][a], and all their encampments.
translation:
  language: vi
  text: Họ dùng lửa thiêu tất cả các thành của dân Ma-đi-an tại những nơi họ cư trú, cùng tất cả các trại của họ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch “các khu quây kín”, “các làng” hoặc “các khu định cư của họ”. Từ Hê-bơ-rơ ở đây có thể chỉ nhiều loại nơi cư trú khác nhau.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָרֵיהֶם
  choice: các thành của dân Ma-đi-an
  rationale: עִיר có thể chỉ thành hoặc thị trấn. “Các thành” là cách dịch quen thuộc trong văn cảnh địa lý-quân sự; đại từ “họ” được diễn đạt rõ là dân Ma-đi-an theo ngữ cảnh gần.
- source_word: בְּמוֹשְׁבֹתָם
  choice: tại những nơi họ cư trú
  rationale: מוֹשָׁב chỉ nơi ở, chỗ cư trú hoặc khu định cư. Cách dịch này giữ quan hệ chỉ địa điểm mà vẫn tự nhiên trong tiếng Việt, đồng thời không buộc cụm từ phải mang nghĩa kỹ thuật là “khu định cư”.
- source_word: טִירֹתָם
  choice: các trại của họ
  rationale: טִירָה có thể chỉ trại, khu quây kín hoặc làng xóm. “Các trại” phân biệt loại nơi cư trú này với “các thành” mà không xác quyết quá mức về cấu trúc hay tính chất cố định của chúng.
- source_word: שָׂרְפוּ בָּאֵשׁ
  choice: dùng lửa thiêu rụi
  rationale: Cụm này biểu thị hành động đốt bằng lửa. “Dùng lửa thiêu rụi” giữ sắc thái công cụ và nhấn mạnh sự hủy diệt, đồng thời tự nhiên hơn lối dịch máy móc “thiêu bằng lửa”.
- source_word: וְאֵת ... וְאֵת
  choice: tất cả ... cùng tất cả ...
  rationale: Giữ hai toàn thể đối ứng được đánh dấu trong tiếng Hê-bơ-rơ, đồng thời tạo nhịp câu tự nhiên, trang trọng trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu giữ thứ tự hai đối tượng trong nguyên văn và sự lặp lại của “tất cả”, nhưng dùng “dùng lửa thiêu rụi” cho tự nhiên trong tiếng Việt. Dấu chú thích [a] được đặt ngay sau cụm từ có phương án dịch khác.
