revisions:
- from: Còn từ một nửa thuộc về con cái Y-sơ-ra-ên, con phải lấy một trong mỗi năm mươi[a], từ người, bò, lừa và bầy gia súc nhỏ, tức từ mọi súc vật; rồi trao chúng cho người Lê-vi, là những người đảm trách việc canh giữ Đền Tạm của Đức Giê-hô-va.
  to: Còn từ một nửa thuộc về con cái Y-sơ-ra-ên, con phải lấy một trong mỗi năm mươi[a], từ người, bò, lừa và bầy chiên dê—từ mọi loại gia súc; rồi trao chúng cho người Lê-vi, là những người làm nhiệm vụ canh giữ Đền Tạm của Đức Giê-hô-va.
  rationale: Bản sửa giữ nguyên tỷ lệ 1:50, các hạng mục được liệt kê, và nhiệm vụ của người Lê-vi; đồng thời thay cụm “tức” bằng dấu gạch ngang để phản ánh cấu trúc tổng quát hóa của nguyên văn ít diễn giải hơn. Chú thích được sửa để phản ánh chính xác sắc thái bị động của אָחֻז.
