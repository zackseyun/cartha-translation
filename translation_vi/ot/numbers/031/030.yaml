source:
  edition: WLC
  text: וּ/מִ/מַּחֲצִ֨ת בְּנֵֽי יִשְׂרָאֵ֜ל תִּקַּ֣ח אֶחָ֣ד אָחֻ֣ז מִן הַ/חֲמִשִּׁ֗ים מִן הָ/אָדָ֧ם מִן הַ/בָּקָ֛ר מִן הַ/חֲמֹרִ֥ים וּ/מִן הַ/צֹּ֖אן מִ/כָּל הַ/בְּהֵמָ֑ה וְ/נָתַתָּ֤ה אֹתָ/ם֙ לַ/לְוִיִּ֔ם שֹׁמְרֵ֕י מִשְׁמֶ֖רֶת מִשְׁכַּ֥ן יְהוָֽה־׀׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/030.yaml
  text: And from the half belonging to the sons of Israel you shall take one taken from every fifty[a], from the man, from the cattle, from the donkeys, and from the flock, from every kind of livestock[b]; and you shall give them to the Levites who keep charge of the tabernacle of Yahweh.
translation:
  language: vi
  text: Còn từ một nửa thuộc về con cái Y-sơ-ra-ên, con phải lấy một trong mỗi năm mươi[a], từ người, bò, lừa và bầy chiên dê—từ mọi loại gia súc; rồi trao chúng cho người Lê-vi, là những người làm nhiệm vụ canh giữ Đền Tạm của Đức Giê-hô-va.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc dịch sát hơn: “một phần được lấy ra trong mỗi năm mươi.” Cụm từ chỉ tỷ lệ một trên năm mươi.'
    reason: Ghi lại sắc thái bị động của אָחֻז mà không thêm các danh từ không có trong chính cụm từ.
lexical_decisions:
- source_word: וּמִמַּחֲצִת בְּנֵי יִשְׂרָאֵל
  choice: Còn từ một nửa thuộc về con cái Y-sơ-ra-ên
  rationale: Diễn đạt rõ quan hệ sở hữu của מַחֲצִית, đồng thời giữ thành ngữ בְּנֵי יִשְׂרָאֵל theo lối Kinh Thánh quen thuộc và trang trọng.
- source_word: אֶחָד אָחֻז מִן הַחֲמִשִּׁים
  choice: một trong mỗi năm mươi
  rationale: Truyền đạt tự nhiên tỷ lệ trưng thu 1:50; chú thích ghi lại sắc thái bị động của אָחֻז.
- source_word: מִן הָאָדָם
  choice: từ người
  rationale: Giữ dạng tập hợp số ít của אָדָם mà vẫn tự nhiên trong tiếng Việt, chỉ thành phần con người trong chiến lợi phẩm.
- source_word: מִן הַבָּקָר מִן הַחֲמֹרִים וּמִן הַצֹּאן
  choice: bò, lừa và bầy gia súc nhỏ
  rationale: Phân biệt ba nhóm vật nuôi; 'gia súc nhỏ' bao quát phạm vi tập hợp của צֹאן gồm chủ yếu chiên và dê.
- source_word: מִכָּל הַבְּהֵמָה
  choice: tức từ mọi súc vật
  rationale: Hiểu cụm này là phần khái quát toàn bộ các loại vật nuôi vừa kể; 'tức' làm rõ quan hệ đồng vị trong tiếng Việt.
- source_word: שֹׁמְרֵי מִשְׁמֶרֶת מִשְׁכַּן
  choice: những người đảm trách việc canh giữ Đền Tạm
  rationale: Giữ sắc thái nhiệm vụ trông coi của cấu trúc đồng gốc שֹׁמְרֵי מִשְׁמֶרֶת và dùng cách nói tự nhiên, trang trọng.
theological_decisions:
- issue: Cách chuyển dịch danh Đức Chúa Trời יְהוָה
  choice: Đức Giê-hô-va
  alternative: Yahweh; CHÚA
  rationale: Dùng dạng danh riêng quen thuộc rộng rãi trong tiếng Việt cho Tứ Danh, thay vì thay thế bằng tước hiệu; không thêm cách giải thích thần học ngoài văn bản.
translation_notes:
  register: Văn phong luật lệ trang trọng nhưng hiện đại. Đại từ 'con' phù hợp lời Đức Chúa Trời phán trực tiếp với Môi-se trong ngữ cảnh. 'Đền Tạm' được viết hoa như tên gọi nơi thánh; câu giữ nguyên phạm vi áp dụng của tỷ lệ 1:50.
