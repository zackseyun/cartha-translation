  terminology: Giữ 'Yahweh', 'Ba-la-am', 'Y-sơ-ra-ên' và 'Phê-ô' nhất quán. 'Bất trung với Yahweh' diễn đạt phù hợp sắc thái covenantal của מעל. 'Con cái Y-sơ-ra-ên' là lối dùng Kinh Thánh Việt ngữ tự nhiên để chỉ toàn dân trong ngữ cảnh này.
