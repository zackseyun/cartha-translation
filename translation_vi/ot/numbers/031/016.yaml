  verdict: revise
  source_fidelity: Bản dịch bảo toàn tốt cấu trúc nhấn mạnh của הֵן הֵנָּה, tác nhân nữ theo ngữ cảnh, quan hệ 'theo lời Ba-la-am', và sắc thái phản bội giao ước trong מַעַל. Tuy nhiên, מַגֵּפָה trong ngữ cảnh này là một tai vạ dạng dịch bệnh/đại dịch giáng trên cộng đồng; 'tai họa' quá khái quát, làm mất nét nghĩa cụ thể của từ nguồn.
