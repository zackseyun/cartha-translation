id: NUM.31.16
reference: Numbers 31:16
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: הֵ֣ן הֵ֜נָּה הָי֨וּ לִ/בְנֵ֤י יִשְׂרָאֵל֙ בִּ/דְבַ֣ר בִּלְעָ֔ם לִ/מְסָר מַ֥עַל בַּ/יהוָ֖ה עַל דְּבַר פְּע֑וֹר וַ/תְּהִ֥י הַ/מַּגֵּפָ֖ה בַּ/עֲדַ֥ת יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/016.yaml
  text: Look[a], these women were the ones who, at Balaam’s word, caused the sons of Israel to act unfaithfully against Yahweh in the matter of Peor[b], and so the plague came upon the congregation of Yahweh.
translation:
  language: vi
  text: Này[a], chính những phụ nữ này, theo lời Ba-la-am, đã khiến con cái Y-sơ-ra-ên bất trung với Yahweh trong vụ Phê-ô[b], vì thế dịch bệnh đã xảy ra trong hội chúng của Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Quả thật, chính những phụ nữ này.”'
    reason: lexical_alternative
  - marker: b
    text: “Vụ Phê-ô” nói đến sự việc dân Y-sơ-ra-ên phạm tội liên quan đến Ba-anh Phê-ô; xem Dân Số 25:1–9.
    reason: contextual_clarification
lexical_decisions:
- source_word: הֵן הֵנָּה
  choice: Này, chính những phụ nữ này
  rationale: Cấu trúc cảm thán kết hợp đại từ giống cái số nhiều mang sắc thái nhấn mạnh; cách dịch này vừa giữ lực chỉ xuất vừa làm rõ đối tượng nữ theo ngữ cảnh.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: con cái Y-sơ-ra-ên
  rationale: Cách nói tự nhiên, trang trọng trong tiếng Việt, chỉ dân Y-sơ-ra-ên nói chung mà không thu hẹp sai thành chỉ nam giới.
- source_word: בִּדְבַר בִּלְעָם
  choice: theo lời Ba-la-am
  rationale: Giữ nghĩa trực tiếp của דָּבָר là 'lời', đồng thời truyền đạt việc họ hành động theo sự chỉ dẫn hoặc xúi giục của Ba-la-am.
- source_word: לִמְסָר מַעַל
  choice: đã khiến ... bất trung
  rationale: Diễn đạt quan hệ gây khiến của động từ מסר trong ngữ cảnh và sắc thái vi phạm lòng trung tín của מַעַל.
- source_word: בַּיהוָה
  choice: với Yahweh
  rationale: Trong tiếng Việt, 'bất trung với' diễn đạt tự nhiên người bị phản bội; danh giao ước được phiên âm Yahweh.
- source_word: עַל דְּבַר פְּעוֹר
  choice: trong vụ Phê-ô
  rationale: Chỉ sự việc liên quan đến Phê-ô mà không bổ sung cách giải thích thần học vượt quá câu nguồn.
- source_word: וַתְּהִי הַמַּגֵּפָה
  choice: vì thế tai họa đã xảy ra
  rationale: Thể hiện hệ quả trong mạch kể; 'tai họa' đủ rộng để bảo toàn nghĩa của מַגֵּפָה, có thể chỉ dịch bệnh hoặc đòn giáng chết người.
- source_word: בַּעֲדַת יְהוָה
  choice: giữa hội chúng của Yahweh
  rationale: עֵדָה là cộng đồng hay hội chúng; giới từ ב được diễn đạt tự nhiên là 'giữa', tức tai họa xảy ra trong cộng đồng ấy.
theological_decisions:
- issue: Cách dịch danh giao ước יְהוָה
  choice: Yahweh
  alternative: ĐỨC CHÚA
  rationale: Giữ danh riêng được văn bản Hê-bơ-rơ dùng trực tiếp, không thay bằng tước hiệu.
- issue: Mức độ xác định vai trò của lời Ba-la-am
  choice: theo lời Ba-la-am
  alternative: theo lời khuyên của Ba-la-am
  rationale: Bản văn nói sát chữ là 'bởi/theo lời Ba-la-am'; không nên biến điều hàm ý là lời khuyên hay mưu kế thành nội dung minh thị.
- issue: Sắc thái của מַעַל
  choice: bất trung với Yahweh
  alternative: phạm tội nghịch cùng Yahweh
  rationale: Giữ sắc thái phản bội hoặc vi phạm lòng trung tín, thay vì làm phẳng thành khái niệm tội lỗi nói chung.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “Này” để giữ lời gọi chú ý; “chính” bảo toàn sắc thái nhấn mạnh. Tên riêng được phiên âm theo lối quen thuộc trong Kinh Thánh tiếng Việt, còn Yahweh được giữ làm danh riêng.
