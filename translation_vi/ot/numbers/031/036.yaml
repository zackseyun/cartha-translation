base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/036.yaml
  text: And the half[a], the portion of those who went out to war, was in number 337,500 sheep.
translation:
  language: vi
  text: Phân nửa[a]—phần của những người ra trận—là 337.500 con chiên.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc, diễn đạt tự nhiên hơn: “Phần của những người ra trận”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּהִי
  choice: là
  rationale: Trong ngữ cảnh tổng kết phần chiến lợi phẩm, động từ היה nêu kết quả phân chia; “là” giữ nghĩa hệ từ và tự nhiên trong tiếng Việt.
- source_word: הַמֶּחֱצָה
  choice: phân nửa
  rationale: Chỉ một nửa chiến lợi phẩm đã được chia trong văn cảnh. “Phân nửa” vừa trang trọng vừa giữ liên hệ trực tiếp với danh từ Hê-bơ-rơ.
- source_word: חֵלֶק
  choice: phần dành cho
  rationale: Danh từ đứng đồng vị với “phân nửa” và xác định phần ấy thuộc về ai. “Phần dành cho” diễn đạt rõ quan hệ phân chia mà không thêm ý thần học.
- source_word: הַיֹּצְאִים בַּצָּבָא
  choice: những người đã ra trận
  rationale: Cụm từ chỉ những người tham gia lực lượng chiến đấu. “Ra trận” là cách nói tự nhiên, chính xác và dễ hiểu trong tiếng Việt hiện đại.
- source_word: מִסְפַּר הַצֹּאן
  choice: số chiên
  rationale: Cụm từ giới thiệu tổng số đàn vật. “Số chiên” gọn, tự nhiên và phù hợp với phép đếm tiếp theo.
- source_word: הַצֹּאן
  choice: chiên
  rationale: Trong danh sách chiến lợi phẩm của văn cảnh, từ này chỉ đàn chiên; “chiên” là thuật ngữ Kinh Thánh quen thuộc và chính xác.
- source_word: שְׁלֹשׁ מֵאוֹת אֶלֶף וּשְׁלֹשִׁים אֶלֶף וְשִׁבְעַת אֲלָפִים וַחֲמֵשׁ מֵאוֹת
  choice: '337.500'
  rationale: Con số Hê-bơ-rơ cộng lần lượt thành 300.000 + 30.000 + 7.000 + 500. Dùng chữ số và dấu phân cách hàng nghìn theo thông lệ tiếng Việt hiện đại.
theological_decisions: []
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Giữ cấu trúc đồng vị “phân nửa… là phần” của nguyên văn, còn dấu chấm phẩy giúp câu thống kê rõ ràng. Danh từ “con” được thêm sau số lượng theo ngữ pháp tiếng Việt.
