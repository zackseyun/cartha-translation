  text: מִ/מַּֽחֲצִיתָ֖/ם תִּקָּ֑חוּ וְ/נָתַתָּ֛ה לְ/אֶלְעָזָ֥ר הַ/כֹּהֵ֖ן תְּרוּמַ֥ת יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/029.yaml
  text: From their half you shall take it and give it to Eleazar the priest as Yahweh’s contribution[a].
translation:
  language: vi
  text: Từ nửa phần của họ, hãy lấy và trao cho thầy tế lễ Ê-lê-a-sa làm phần đóng góp dâng lên Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “phần dâng cho Yahweh” hoặc “phần đóng góp thuộc về Yahweh.” Từ Hê-bơ-rơ תְּרוּמָה chỉ một phần được tách riêng cho mục đích thiêng liêng.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִמַּחֲצִיתָם
  choice: từ một nửa của họ
  rationale: Diễn đạt trực tiếp giới từ מִן cùng מַחֲצִית và hậu tố sở hữu số nhiều, chỉ phần một nửa thuộc về nhóm đã được nhắc đến trong ngữ cảnh.
- source_word: תִּקָּחוּ
  choice: Hãy lấy
  rationale: Dạng ngôi hai số nhiều mang lực chỉ thị; tiếng Việt dùng “hãy” để truyền đạt mệnh lệnh rõ ràng và tự nhiên.
- source_word: וְנָתַתָּה
  choice: và trao
  rationale: Tiếp nối chuỗi mệnh lệnh. Cách diễn đạt này tự nhiên trong tiếng Việt và không làm nổi bật quá mức sự chuyển từ ngôi hai số nhiều sang số ít trong tiếng Hê-bơ-rơ.
- source_word: לְאֶלְעָזָר הַכֹּהֵן
  choice: cho thầy tế lễ Ê-lê-a-sa
  rationale: Giữ chức danh xác định và phiên âm tên riêng theo cách quen thuộc, dễ đọc trong tiếng Việt.
- source_word: תְּרוּמַת יְהוָה
  choice: phần đóng góp dâng lên Yahweh
  rationale: תְּרוּמָה là phần được tách riêng cho mục đích thánh. Cấu trúc sở hữu có thể chỉ phần thuộc về Yahweh hoặc phần dành cho Ngài; “dâng lên” diễn đạt tự nhiên trong tiếng Việt, còn chú thích bảo lưu các khả năng khác.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm trực tiếp danh thánh, phân biệt với tước hiệu “Chúa”.
theological_decisions:
- issue: Cách dịch danh thánh יְהוָה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Nguyên văn dùng trực tiếp danh thánh; “Yahweh” bảo tồn tính chất tên riêng mà không thay bằng một tước hiệu.
- issue: Ý nghĩa của תְּרוּמָה trong ngữ cảnh lễ nghi
  choice: phần đóng góp
  alternative: lễ vật; phần dâng; lễ vật dâng lên
  rationale: Ở đây từ này chỉ một phần chiến lợi phẩm được tách riêng cho mục đích thánh. “Phần đóng góp” vừa dễ hiểu vừa giữ được ý niệm về một phần đã được ấn định.
translation_notes:
  register: Văn phong chỉ thị trang trọng nhưng hiện đại. Dùng “thầy tế lễ” là cách gọi phổ thông, dễ hiểu; giữ danh thánh Yahweh và ghi chú để bảo lưu sắc thái của cụm תְּרוּמַת יְהוָה.
