  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר אֶלְעָזָ֤ר הַ/כֹּהֵן֙ אֶל אַנְשֵׁ֣י הַ/צָּבָ֔א הַ/בָּאִ֖ים לַ/מִּלְחָמָ֑ה זֹ֚את חֻקַּ֣ת הַ/תּוֹרָ֔ה אֲשֶׁר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/021.yaml
  text: Then Eleazar the priest said to the men of the army who had come to the battle[a], “This is the statute of the law that Yahweh commanded Moses:”
translation:
  language: vi
  text: 'Bấy giờ, thầy tế lễ Ê-lê-a-sa nói với những người trong quân đội đã ra trận: “Đây là quy định của luật pháp[a] mà Yahweh đã truyền cho Môi-se:”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “quy chế của luật pháp” hoặc “quy định của sự chỉ dạy.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Bấy giờ, ... nói
  rationale: Dạng waw liên tiếp đưa câu chuyện tiến tới; “Bấy giờ” thể hiện trình tự tự nhiên trong văn kể tiếng Việt.
- source_word: אֶלְעָזָר הַכֹּהֵן
  choice: thầy tế lễ Ê-lê-a-sa
  rationale: Giữ chức danh xác định của Ê-lê-a-sa và phiên âm tên riêng theo lối quen thuộc, dễ đọc trong tiếng Việt.
- source_word: אַנְשֵׁי הַצָּבָא
  choice: những người trong quân đội
  rationale: Giữ yếu tố chỉ người của אַנְשֵׁי và nghĩa tập thể quân sự của צָבָא, không thu hẹp thành một cấp bậc quân nhân cụ thể.
- source_word: הַבָּאִים לַמִּלְחָמָה
  choice: đã ra trận
  rationale: Cụm Hê-bơ-rơ nói về những người đi đến cuộc chiến; trong ngữ cảnh họ là lực lượng vừa tham chiến. “Đã ra trận” tự nhiên, không thêm rõ ý “trở về từ” vốn không được nói trực tiếp.
- source_word: חֻקַּת הַתּוֹרָה
  choice: quy định của luật pháp
  rationale: “Quy định” diễn đạt hiệu lực ràng buộc của חֻקָּה, còn “luật pháp” diễn đạt תּוֹרָה trong ngữ cảnh pháp lệnh; chú thích giữ các sắc thái “quy chế” và “sự chỉ dạy”.
- source_word: אֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: mà Yahweh đã truyền cho Môi-se
  rationale: אֶת đánh dấu Môi-se là người nhận mệnh lệnh. “Truyền cho” là cách nói tiếng Việt tự nhiên và không biến Môi-se thành tác nhân trung gian trong chính mệnh đề này.
theological_decisions:
- issue: Cách chuyển dịch danh riêng của Đức Chúa Trời יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA; CHÚA
  rationale: Nguyên văn dùng trực tiếp Tứ Danh; “Yahweh” bảo tồn danh giao ước dưới dạng phiên âm mà không thay bằng một tước hiệu.
- issue: Phạm vi nghĩa của תּוֹרָה trong cụm חֻקַּת הַתּוֹרָה
  choice: luật pháp
  alternative: sự chỉ dạy
  rationale: Ngữ cảnh quy định nghi lễ làm sạch sau chiến trận thiên về nghĩa pháp lệnh, nhưng chú thích vẫn bảo tồn sắc thái rộng hơn là “sự chỉ dạy”.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ cấu trúc lời công bố pháp lý, dùng dấu hai chấm cuối câu vì lời chỉ dẫn tiếp tục ở câu sau. Dấu chú thích [a] được đặt ngay sau cụm từ mà chú thích giải nghĩa.
