source:
  edition: WLC
  text: וְ/כֹל֙ הַ/טַּ֣ף בַּ/נָּשִׁ֔ים אֲשֶׁ֥ר לֹא יָדְע֖וּ מִשְׁכַּ֣ב זָכָ֑ר הַחֲי֖וּ לָ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/018.yaml
  text: But keep alive for yourselves every young girl among the women who has not known the bed of a man[a].
translation:
  language: vi
  text: Còn mọi bé gái chưa từng biết đến việc ăn nằm với đàn ông[a], hãy để họ sống cho các ông.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay nói rõ hơn: “chưa từng quan hệ tình dục với đàn ông.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כֹל
  choice: Còn tất cả
  rationale: וְ nối mệnh lệnh này với phần trước nhưng mang sắc thái tương phản; “Còn” diễn đạt tự nhiên sự chuyển đối lập ấy. כֹל được dịch là “tất cả” để giữ ý bao quát.
- source_word: הַטַּף בַּנָּשִׁים
  choice: các bé gái
  rationale: טַף chỉ trẻ nhỏ; cụm בַּנָּשִׁים và mệnh đề theo sau xác định đây là những trẻ thuộc nữ giới. “Các bé gái” truyền đạt gọn và tự nhiên ý nghĩa được ngữ cảnh giới hạn, thay vì dùng một danh từ trung tính về giới.
- source_word: אֲשֶׁר לֹא יָדְעוּ
  choice: chưa từng biết
  rationale: יָדַע ở đây là cách nói uyển chuyển về kinh nghiệm tình dục. “Chưa từng biết” giữ được lối nói của nguyên văn và phù hợp với ý kinh nghiệm chưa từng xảy ra.
- source_word: מִשְׁכַּב זָכָר
  choice: việc ăn nằm với đàn ông
  rationale: Cụm Hê-bơ-rơ chỉ sự ăn nằm mang tính tình dục với một người nam. Cách dịch này giữ hình ảnh uyển ngữ của nguyên văn nhưng vẫn dễ hiểu trong tiếng Việt hiện đại.
- source_word: הַחֲיוּ לָכֶם
  choice: hãy để họ sống cho các ông
  rationale: Thể Hiphil mệnh lệnh của חיה có nghĩa là giữ cho sống hoặc để sống; לָכֶם được giữ bằng “cho các ông” mà không suy diễn mục đích cụ thể ngoài điều câu văn nói.
theological_decisions:
- issue: Có nên diễn đạt trực tiếp thành quan hệ tình dục hay giữ cách nói uyển chuyển của nguyên văn
  choice: Giữ cách nói “chưa từng biết việc ăn nằm với đàn ông” trong chính văn.
  alternative: chưa từng quan hệ tình dục với đàn ông
  rationale: Nguyên văn dùng động từ “biết” cùng một thành ngữ về sự ăn nằm, chứ không dùng một thuật ngữ trừu tượng như “trinh nữ”. Chính văn giữ lối diễn đạt đó; chú thích cung cấp cách nói trực tiếp hơn.
- issue: Cách biểu thị giới tính của טַף
  choice: Dịch là “các bé gái”.
  alternative: trẻ nhỏ; các trẻ em
  rationale: Bản thân טַף có thể không xác định giới, nhưng בַּנָּשִׁים và mệnh đề quan hệ ngay sau giới hạn đối tượng là nữ. “Các bé gái” thể hiện giới tính do chính ngữ cảnh xác định mà không thêm một phạm trù thần học.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Ăn nằm” giữ sắc thái uyển ngữ của tiếng Hê-bơ-rơ; “cho các ông” bảo toàn yếu tố לָכֶם mà không giải thích thêm số phận hay mục đích dành cho những bé gái này.
