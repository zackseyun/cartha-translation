  terminology: Giữ “Yahweh” cho יהוה. “Sinh mạng” trong bản văn và chú thích bảo toàn chức năng đếm cá thể sống của נֶפֶשׁ, áp dụng cho cả người lẫn vật. “Chiên dê” phù hợp với nghĩa tập hợp của צאן.
