id: NUM.31.28
reference: Numbers 31:28
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/הֲרֵמֹתָ֨ מֶ֜כֶס לַֽ/יהוָ֗ה מֵ/אֵ֞ת אַנְשֵׁ֤י הַ/מִּלְחָמָה֙ הַ/יֹּצְאִ֣ים לַ/צָּבָ֔א אֶחָ֣ד נֶ֔פֶשׁ מֵ/חֲמֵ֖שׁ הַ/מֵּא֑וֹת מִן הָ/אָדָם֙ וּ/מִן הַ/בָּקָ֔ר וּ/מִן הַ/חֲמֹרִ֖ים וּ/מִן הַ/צֹּֽאן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/028.yaml
  text: 'And you shall levy a tribute for Yahweh from the men of war who went out to battle: one out of five hundred[b][a], from the people and from the cattle and from the donkeys and from the flock.'
translation:
  language: vi
  text: 'Ngươi phải trích một khoản phải nộp cho Yahweh từ những người tham chiến đã ra trận: cứ năm trăm sinh mạng thì lấy một[a], trong số người, bò, lừa và chiên dê.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “một sinh mạng trong năm trăm.” Từ Hê-bơ-rơ ở đây dùng để đếm từng cá thể sống, dù là người hay súc vật.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲרֵמֹתָ מֶכֶס
  choice: phải trích một phần cống nạp
  rationale: Động từ Hiphil רום cùng danh từ מֶכֶס chỉ việc tách ra một phần đã được ấn định. Cách diễn đạt này vừa giữ ý bắt buộc, vừa tự nhiên hơn lối dịch sát từng chữ.
- source_word: לַיהוָה
  choice: cho Yahweh
  rationale: Giữ tên riêng giao ước được biểu thị bằng יהוה, đồng thời dùng “cho” để diễn đạt phần cống nạp được dành thuộc về Ngài.
- source_word: מֵאֵת אַנְשֵׁי הַמִּלְחָמָה הַיֹּצְאִים לַצָּבָא
  choice: từ những người tham chiến đã ra trận
  rationale: Diễn đạt tự nhiên nhóm nam giới trực tiếp tham gia chiến dịch, không hiểu הַצָּבָא theo nghĩa đơn thuần là một tổ chức quân đội.
- source_word: אֶחָד נֶפֶשׁ מֵחֲמֵשׁ הַמֵּאוֹת
  choice: cứ năm trăm sinh mạng thì lấy một
  rationale: נֶפֶשׁ ở đây là đơn vị đếm một cá thể sống và áp dụng cho cả người lẫn súc vật. “Sinh mạng” giữ được phạm vi rộng ấy, còn cấu trúc “cứ... thì lấy...” làm rõ tỷ lệ.
- source_word: מִן הָאָדָם
  choice: trong số người
  rationale: אָדָם chỉ phần con người trong chiến lợi phẩm, đối lập với các loài vật được liệt kê tiếp theo.
- source_word: וּמִן הַבָּקָר
  choice: bò
  rationale: בָּקָר là gia súc lớn, đặc biệt là bò; dùng danh từ loại cụ thể và thông dụng trong tiếng Việt.
- source_word: וּמִן הַחֲמֹרִים
  choice: lừa
  rationale: Bản dịch hiện đại, trực tiếp của חֲמֹרִים.
- source_word: וּמִן הַצֹּאן
  choice: chiên dê
  rationale: צֹאן là danh từ tập hợp bao gồm gia súc nhỏ, chủ yếu là chiên và dê; “chiên dê” rõ nghĩa hơn chỉ nói “bầy”.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Văn bản Hê-bơ-rơ dùng trực tiếp danh giao ước יהוה; phiên âm “Yahweh” bảo tồn tính chất tên riêng mà không thay bằng một tước hiệu.
- issue: Phạm vi của נֶפֶשׁ trong tỷ lệ cống nạp
  choice: sinh mạng
  alternative: cá thể / con / người
  rationale: Danh từ này bao quát cả con người và động vật trong danh sách. “Sinh mạng” bảo tồn cách gọi chung hơi khác thường của nguyên văn, thay vì giới hạn vào riêng con người hoặc riêng loài vật.
translation_notes:
  register: Văn phong mệnh lệnh trang trọng nhưng hiện đại. Dùng “ngươi” vì đây là lời truyền trực tiếp cho Môi-se trong ngữ cảnh luật pháp; tránh từ cổ khó hiểu. Trật tự danh sách và sự phân biệt giữa người với các nhóm súc vật được giữ nguyên.
