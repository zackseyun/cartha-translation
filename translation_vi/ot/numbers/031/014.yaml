base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/014.yaml
  text: And Moses was angry with the officers of the army[a], the commanders of thousands and the commanders of hundreds, who were coming from the service of the war.
translation:
  language: vi
  text: Môi-se nổi giận với các cấp chỉ huy quân đội[a]—các chỉ huy đơn vị nghìn người và các chỉ huy đơn vị trăm người—đang từ chiến dịch trở về.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “những người được bổ nhiệm trong lực lượng.” Cụm từ Hê-bơ-rơ chỉ những người được giao trách nhiệm trong lực lượng quân sự; các chỉ huy đơn vị nghìn người và trăm người được nêu để giải thích họ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְצֹף
  choice: nổi giận
  rationale: Động từ קצף diễn tả sự tức giận; “nổi giận” tự nhiên trong tiếng Việt hiện đại và thể hiện sắc thái phát sinh của hình thái tự sự.
- source_word: פְּקוּדֵי הֶחָיִל
  choice: các sĩ quan chỉ huy quân đội
  rationale: Cụm từ chỉ những người được giao quyền phụ trách lực lượng; cách dịch này làm rõ vai trò quân sự mà không đồng nhất họ hoàn toàn với hai cấp chỉ huy được nêu tiếp theo.
- source_word: שָׂרֵי הָאֲלָפִים
  choice: các trưởng quan nghìn người
  rationale: Giữ cơ cấu quân sự theo nguyên văn—những người đứng đầu đơn vị một nghìn—đồng thời dùng cách gọi trang trọng, dễ hiểu.
- source_word: וְשָׂרֵי הַמֵּאוֹת
  choice: và các trưởng quan trăm người
  rationale: Dịch song song với שָׂרֵי הָאֲלָפִים và bảo toàn cơ cấu đơn vị một trăm của tiếng Hê-bơ-rơ.
- source_word: הַבָּאִים
  choice: đang ... trở về
  rationale: Phân từ diễn tả những người đang đến; trong ngữ cảnh họ đi từ chiến trận đến gặp Môi-se, “trở về” là cách diễn đạt tiếng Việt tự nhiên, dù ý trở lại chỉ được suy ra từ bối cảnh.
- source_word: מִצְּבָא הַמִּלְחָמָה
  choice: từ chiến trận
  rationale: Cụm צבא המלחמה kết hợp ý niệm quân vụ/lực lượng với chiến tranh. “Từ chiến trận” gọn và tự nhiên; chú thích giữ lại phạm vi nghĩa sát chữ hơn.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dấu gạch ngang cho thấy hai nhóm trưởng quan giải thích cụ thể “các sĩ quan chỉ huy quân đội”. Giữ các cấp “nghìn người” và “trăm người” thay vì hiện đại hóa thành quân hàm không có trong nguyên văn.
