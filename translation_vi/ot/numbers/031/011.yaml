  text: וַ/יִּקְחוּ֙ אֶת כָּל הַ/שָּׁלָ֔ל וְ/אֵ֖ת כָּל הַ/מַּלְק֑וֹחַ בָּ/אָדָ֖ם וּ/בַ/בְּהֵמָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/011.yaml
  text: And they took all the spoil and all the plunder, both man and beast.
translation:
  language: vi
  text: Họ lấy tất cả chiến lợi phẩm và mọi thứ chiếm được, gồm cả người lẫn gia súc.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׁלָל (šālāl)
  choice: chiến lợi phẩm
  rationale: Chỉ của cải thu được trong chiến tranh; cách dịch tự nhiên và sát ngữ cảnh.
- source_word: מַלְקוֹחַ (malqôaḥ)
  choice: mọi thứ chiếm được
  rationale: Giữ sự phân biệt với שָׁלָל và có thể bao quát những sinh vật bị bắt, như vế sau giải thích.
- source_word: אָדָם (ʾādām)
  choice: người
  rationale: Danh từ tập hợp, đối ứng trực tiếp với gia súc; không nhất thiết chỉ nam giới.
- source_word: בְּהֵמָה (bəhēmāh)
  choice: gia súc
  rationale: Trong ngữ cảnh chiến lợi phẩm, từ này chỉ các loài vật nuôi, phù hợp hơn từ rộng nghĩa “thú vật”.
theological_decisions: []
