  source_fidelity: 'Bản dịch phản ánh đúng cấu trúc và ý nghĩa của tiếng Hê-bơ-rơ: động từ «lấy», hai hạng mục phân biệt «chiến lợi phẩm» (שָׁלָל) và «mọi thứ chiếm được» (מַלְקוֹחַ), cùng sự xác định phạm vi «người lẫn gia súc» (אָדָם וּבְהֵמָה). «Người» giữ đúng nghĩa tập hợp, không giới hạn là nam giới.'
