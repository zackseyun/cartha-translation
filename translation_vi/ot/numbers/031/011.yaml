  terminology: «Chiến lợi phẩm» phù hợp cho שָׁלָל trong ngữ cảnh quân sự; «mọi thứ chiếm được» phân biệt hợp lý với thuật ngữ trước và vẫn bao quát người cùng gia súc. «Gia súc» phù hợp với בְּהֵמָה trong ngữ cảnh này.
