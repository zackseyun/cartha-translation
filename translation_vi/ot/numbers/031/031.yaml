source:
  edition: WLC
  text: וַ/יַּ֣עַשׂ מֹשֶׁ֔ה וְ/אֶלְעָזָ֖ר הַ/כֹּהֵ֑ן כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/031.yaml
  text: So Moses and Eleazar the priest did as Yahweh had commanded Moses[a].
translation:
  language: vi
  text: Vậy, Môi-se và thầy tế lễ Ê-lê-a-sa làm đúng như Yahweh đã truyền cho Môi-se.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ: “YHWH”; theo truyền thống thường được dịch là “ĐỨC GIÊ-HÔ-VA” hoặc “Chúa.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: làm
  rationale: Động từ עשה ở đây tóm lược việc vâng theo mệnh lệnh trước đó; “làm” tự nhiên trong cấu trúc “làm đúng như... đã truyền”.
- source_word: מֹשֶׁה
  choice: Môi-se
  rationale: Dùng dạng phiên âm tên riêng quen thuộc trong tiếng Việt.
- source_word: וְאֶלְעָזָר
  choice: và Ê-lê-a-sa
  rationale: Giữ liên từ và phiên âm tên riêng theo cách dùng Kinh Thánh tiếng Việt quen thuộc.
- source_word: הַכֹּהֵן
  choice: thầy tế lễ
  rationale: Danh xưng đồng vị chỉ chức vụ của Ê-lê-a-sa; “thầy tế lễ” là cách diễn đạt rõ ràng, trang trọng và quen thuộc.
- source_word: כַּאֲשֶׁר
  choice: đúng như
  rationale: Diễn đạt sự phù hợp chính xác giữa hành động và mệnh lệnh; “đúng như” tự nhiên hơn chỉ “như” trong tiếng Việt.
- source_word: צִוָּה
  choice: đã truyền
  rationale: Mệnh lệnh có trước hành động; “đã truyền” thể hiện trình tự này tự nhiên mà không thêm nghĩa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm trực tiếp danh riêng thần thánh YHWH, thay vì thay thế bằng một tước hiệu.
- source_word: אֶת מֹשֶׁה
  choice: cho Môi-se
  rationale: אֶת là dấu hiệu tân ngữ xác định và không được dịch riêng; tiếng Việt dùng “truyền cho Môi-se” để diễn đạt quan hệ của động từ một cách tự nhiên.
theological_decisions:
- issue: Cách dịch danh thần thánh יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / Chúa
  rationale: Bản Hê-bơ-rơ dùng trực tiếp Tứ Tự YHWH. Giữ “Yahweh” bảo tồn danh riêng và tránh âm thầm thay bằng một tước hiệu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Vậy” để nối với mệnh lệnh ở phần trước; cấu trúc “làm đúng như... đã truyền” vừa tự nhiên vừa giữ sát quan hệ cú pháp của câu Hê-bơ-rơ.
