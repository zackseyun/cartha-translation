translation:
  language: vi
  text: “Hãy kiểm kê chiến lợi phẩm đã chiếm được, gồm cả người lẫn súc vật—con, thầy tế lễ Ê-lê-a-sa, và những người đứng đầu các gia tộc trong cộng đồng.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׂא אֵת רֹאשׁ
  choice: Hãy kiểm kê
  rationale: Thành ngữ Hê-bơ-rơ theo nghĩa đen là “nâng đầu,” nhưng trong ngữ cảnh có nghĩa là đếm, xác định tổng số. “Kiểm kê” tự nhiên và phù hợp với việc thống kê chiến lợi phẩm.
- source_word: מַלְקוֹחַ הַשְּׁבִי
  choice: chiến lợi phẩm đã bắt được
  rationale: מַלְקוֹחַ chỉ những gì thu được trong chiến tranh, còn הַשְּׁבִי mô tả những gì bị bắt hoặc chiếm. Cách dịch này bao quát cả người và súc vật như vế sau xác định, mà không giới hạn vào tù binh là con người.
- source_word: בָּאָדָם וּבַבְּהֵמָה
  choice: gồm cả người lẫn súc vật
  rationale: אָדָם ở đây chỉ con người trong thế đối lập với בְּהֵמָה, tức động vật, đặc biệt là gia súc. “Cả người lẫn súc vật” diễn đạt rõ sự phân đôi này.
- source_word: אַתָּה
  choice: con
  rationale: Đại từ số ít được giữ lại để nhấn mạnh Môi-se trực tiếp tham gia. Trong lời Đức Chúa Trời phán với Môi-se, “con” là đại từ tiếng Việt tự nhiên, trang trọng và phù hợp quan hệ diễn ngôn.
- source_word: אֶלְעָזָר הַכֹּהֵן
  choice: thầy tế lễ Ê-lê-a-sa
  rationale: Giữ tên riêng theo lối phiên âm Kinh Thánh tiếng Việt quen thuộc và dịch chức danh כֹּהֵן là “thầy tế lễ.”
- source_word: רָאשֵׁי אֲבוֹת
  choice: những người đứng đầu các gia tộc
  rationale: Cụm từ chỉ các lãnh đạo của những đơn vị huyết tộc hoặc nhà tổ phụ. “Người đứng đầu các gia tộc” vừa rõ nghĩa với độc giả hiện đại vừa bảo tồn cơ cấu gia tộc của nguyên văn.
- source_word: הָעֵדָה
  choice: cộng đồng
  rationale: עֵדָה chỉ cộng đồng hội chúng Y-sơ-ra-ên. “Cộng đồng” là cách nói hiện đại, dễ hiểu và không mặc nhiên mang nghĩa về một thiết chế giáo hội.
theological_decisions: []
translation_notes:
  register: Văn phong mệnh lệnh, trang trọng nhưng hiện đại. Dấu gạch ngang làm rõ rằng Môi-se, Ê-lê-a-sa và các trưởng gia tộc là những người cùng thực hiện việc kiểm kê; không thêm chủ thể hoặc nội dung thần học ngoài nguyên văn.
