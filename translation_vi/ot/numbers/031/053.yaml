translation:
  language: vi
  text: Các binh sĩ đều đã lấy chiến lợi phẩm cho riêng mình.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc, dịch sát cấu trúc: “Các binh sĩ đã cướp bóc, mỗi người cho mình.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַנְשֵׁי הַצָּבָא
  choice: những người trong quân đội
  rationale: Cụm danh từ ghép chỉ những người nam thuộc lực lượng tham chiến. Cách dịch này tự nhiên trong tiếng Việt hiện đại và giữ rõ quan hệ với quân đội.
- source_word: בָּזְזוּ
  choice: đã lấy chiến lợi phẩm
  rationale: Động từ בזז có nghĩa là cướp hoặc thu lấy chiến lợi phẩm. Vì tân ngữ được hiểu ngầm, cách diễn đạt này bổ sung danh từ cần thiết để câu tiếng Việt rõ nghĩa mà không mở rộng quá mức.
- source_word: אִישׁ לוֹ
  choice: đều ... cho riêng mình
  rationale: Thành ngữ phân phối theo nghĩa đen là “mỗi người cho mình”, cho biết từng người đã giữ phần chiến lợi phẩm riêng; “đều ... cho riêng mình” diễn đạt tự nhiên sắc thái ấy.
theological_decisions: []
translation_notes:
  register: Văn phong trần thuật trang trọng nhưng hiện đại. Dùng “chiến lợi phẩm” thay cho từ cổ “chiến lợi” hoặc cách nói mạnh hơn như “đồ cướp được”; giữ nét phân phối cá nhân của אִישׁ לוֹ trong câu chính và ghi cách dịch sát ở chú thích.
