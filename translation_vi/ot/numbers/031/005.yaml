  yaml_path: translation/ot/numbers/031/005.yaml
  text: 'So from the thousands of Israel[b][a], a thousand from each tribe were assigned: twelve thousand armed for war.'
translation:
  language: vi
  text: Vậy, từ các đơn vị nghìn của Y-sơ-ra-ên[a], một nghìn người từ mỗi chi phái—tức mười hai nghìn người được trang bị để ra trận—đã được huy động[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Các đơn vị nghìn của Y-sơ-ra-ên” có thể chỉ con số hàng nghìn, nhưng cũng có thể chỉ các đơn vị thị tộc hoặc quân sự lớn của Y-sơ-ra-ên.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “đã được giao”, “đã được cung cấp” hoặc “đã được triệu tập”; động từ Hê-bơ-rơ có thể chỉ việc những người này được đưa ra để phục vụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמָּסְרוּ
  choice: người ta đã giao ra
  rationale: Dạng Niphal diễn tả những người được cung cấp hoặc giao cho nhiệm vụ quân sự. Cách dịch này giữ sắc thái bị động của nguyên ngữ mà vẫn tự nhiên trong tiếng Việt.
- source_word: מֵאַלְפֵי יִשְׂרָאֵל
  choice: từ các đơn vị nghìn của Y-sơ-ra-ên
  rationale: אַלְפֵי có nghĩa đen là “các nghìn”, nhưng trong bối cảnh bộ tộc và quân sự cũng có thể chỉ các đơn vị thị tộc hoặc quân đội. “Các đơn vị nghìn” giữ được con số đồng thời gợi sắc thái tổ chức.
- source_word: אֶלֶף לַמַּטֶּה
  choice: một nghìn người từ mỗi bộ tộc
  rationale: 'Giới từ לְ có nghĩa phân phối trong ngữ cảnh: mỗi bộ tộc cung cấp một nghìn người. Thêm “người” để câu tiếng Việt rõ và tự nhiên.'
- source_word: שְׁנֵים עָשָׂר אֶלֶף
  choice: tổng cộng mười hai nghìn người
  rationale: Con số này tóm lại tổng quân số; “tổng cộng” làm rõ chức năng tổng kết vốn hàm chứa trong cấu trúc câu.
- source_word: חֲלוּצֵי צָבָא
  choice: những người được trang bị để ra trận
  rationale: Cụm từ chỉ những người đã được vũ trang, trang bị hoặc sẵn sàng cho hoạt động quân sự; lựa chọn này truyền đạt nghĩa cụ thể và tự nhiên.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “bộ tộc” cho מַטֶּה trong bối cảnh cơ cấu dân Y-sơ-ra-ên; giữ “Y-sơ-ra-ên” theo lối phiên âm Kinh Thánh quen thuộc. Các chú thích bảo tồn độ mở từ vựng của אַלְפֵי và וַיִּמָּסְרוּ.
