revisions:
- from: 'Rồi Đức Giê-hô-va phán với Môi-se[a]:'
  to: 'Rồi Đức Yahweh phán với Môi-se[a]:'
  rationale: Chỉ thay “Giê-hô-va” bằng “Yahweh” để tuân theo cách chuyển dịch יהוה đã được xác định trong nguồn và audit trail. Giữ “Rồi”, “phán với”, tên “Môi-se”, vị trí chú thích và dấu hai chấm vì chúng đều truyền đạt đúng chức năng của nguyên văn và tự nhiên trong tiếng Việt.
