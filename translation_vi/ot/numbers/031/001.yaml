  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/001.yaml
  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: vi
  text: 'Rồi Đức Yahweh phán với Môi-se[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ: “YHWH”; theo truyền thống được dịch là “CHÚA.” Các cách phiên âm gồm “Yahweh” và “Giê-hô-va.”'
    reason: Nêu danh יהוה trong nguyên văn, cách thể hiện truyền thống, và các dạng phiên âm phổ biến; bản văn dùng “Yahweh” theo quyết định thuật ngữ của dự án.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Rồi ... phán
  rationale: Dạng động từ có waw liên tiếp đưa trình thuật tiến sang hành động kế tiếp; “rồi” diễn đạt tự nhiên trình tự ấy. Với lời Đức Chúa Trời, “phán” là cách diễn đạt trang trọng, quen thuộc và phù hợp với דבר.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Giữ danh riêng của Đức Chúa Trời thay vì thay bằng tước hiệu “CHÚA”; “Giê-hô-va” là dạng danh này quen thuộc và dễ nhận biết trong tiếng Việt.
- source_word: אֶל
  choice: với
  rationale: Trong cấu trúc chỉ người tiếp nhận lời nói, “phán với” là cách nói tiếng Việt tự nhiên.
- source_word: מֹשֶׁה
  choice: Môi-se
  rationale: Dùng dạng tên riêng đã quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
- source_word: לֵאמֹר
  choice: dấu hai chấm
  rationale: Công thức nguyên ngữ theo nghĩa đen là “rằng/nói rằng” và dẫn vào lời trực tiếp ở câu kế tiếp; trong tiếng Việt hiện đại, dấu hai chấm thực hiện chức năng này tự nhiên hơn mà không làm mất quan hệ cú pháp.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Đức Giê-hô-va
  alternative: Yahweh; CHÚA
  rationale: Nguyên văn dùng trực tiếp danh bốn phụ âm יהוה. Bản dịch giữ đây là danh riêng, không âm thầm thay bằng tước hiệu; chú thích nêu dạng ký tự và các cách thể hiện khác.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Rồi” giữ tiến trình kể chuyện; “phán với” phù hợp ngữ cảnh lời Đức Chúa Trời. Dấu hai chấm thay cho lối dịch cứng “mà rằng,” vì nội dung lời phán bắt đầu ở câu tiếp theo.
