  - severity: low
    issue: Chú thích hiện tại trình bày “Yahweh” như chỉ là một cách phiên âm khác, dù đây là cách thể hiện cần dùng trong bản văn.
    rationale: Cần điều chỉnh chú thích để nhất quán với bản văn sửa và với quyết định thuật ngữ của dự án.
