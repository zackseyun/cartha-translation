  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dấu hai chấm làm rõ rằng cụm cuối giải thích “vàng” là các vật bằng vàng đã được chế tác; chú thích bảo lưu khả năng hiểu sát cấu trúc Hê-bơ-rơ hơn.
