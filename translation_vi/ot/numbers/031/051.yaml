base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/051.yaml
  text: So Moses and Eleazar the priest took the gold from them[a], every crafted article.
translation:
  language: vi
  text: Môi-se và thầy tế lễ Ê-lê-a-sa nhận từ họ số vàng, tức là mọi vật phẩm đã được chế tác.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “toàn bộ các đồ vật đã được làm ra.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: nhận
  rationale: Động từ לקח có thể là “lấy” hoặc “nhận”; trong ngữ cảnh các chỉ huy đem lễ vật đến (c. 50), “nhận” diễn đạt tự nhiên quan hệ trao-nhận mà vẫn giữ đúng nghĩa.
- source_word: מֹשֶׁה
  choice: Môi-se
  rationale: Dùng dạng tên riêng quen thuộc trong tiếng Việt.
- source_word: וְאֶלְעָזָר הַכֹּהֵן
  choice: và thầy tế lễ Ê-lê-a-sa
  rationale: Giữ tên riêng và chức danh xác định của nhân vật bằng cách diễn đạt trang trọng, quen thuộc.
- source_word: אֶת הַזָּהָב
  choice: vàng
  rationale: Chỉ số vàng cụ thể được dâng trong văn cảnh; tiếng Việt không cần mạo từ tương ứng.
- source_word: מֵאִתָּם
  choice: từ họ
  rationale: Diễn đạt trực tiếp nguồn của số vàng.
- source_word: כֹּל
  choice: tất cả
  rationale: Giữ ý bao quát của lượng từ đối với cụm danh từ theo sau.
- source_word: כְּלִי
  choice: những vật
  rationale: כְּלִי có nghĩa rộng là vật dụng, đồ vật hay vật phẩm; “những vật” tránh thu hẹp nghĩa thành bình chứa.
- source_word: מַעֲשֶׂה
  choice: đã được chế tác
  rationale: Trong cụm כְּלִי מַעֲשֶׂה, từ này mô tả các vật đã qua gia công, không phải vàng nguyên liệu.
