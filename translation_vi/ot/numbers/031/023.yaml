id: NUM.31.23
reference: Numbers 31:23
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: כָּל דָּבָ֞ר אֲשֶׁר יָבֹ֣א בָ/אֵ֗שׁ תַּעֲבִ֤ירוּ בָ/אֵשׁ֙ וְ/טָהֵ֔ר אַ֕ךְ בְּ/מֵ֥י נִדָּ֖ה יִתְחַטָּ֑א וְ/כֹ֨ל אֲשֶׁ֧ר לֹֽא יָבֹ֛א בָּ/אֵ֖שׁ תַּעֲבִ֥ירוּ בַ/מָּֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/023.yaml
  text: Everything that can go through the fire[a], you shall pass through the fire, and it shall be clean; only it must be purified with the water for impurity. But everything that cannot go through the fire, you shall pass through the water.
translation:
  language: vi
  text: Mọi vật có thể chịu được lửa thì anh em phải đưa qua lửa, và vật ấy sẽ sạch; nhưng vẫn phải được thanh tẩy bằng nước tẩy uế[a]. Còn mọi vật không thể chịu được lửa thì anh em phải đưa qua nước.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “bằng nước dùng để thanh tẩy khỏi ô uế”; theo cách dịch truyền thống: “bằng nước phân cách” (xem Dân Số 19).'
    reason: Ghi nhận cách hiểu khác của מֵי נִדָּה mà không khiến cụm từ bị hiểu là “nước bị ô uế”; đồng thời bảo lưu thuật ngữ dịch truyền thống.
lexical_decisions:
- source_word: כָּל דָּבָר
  choice: Mọi vật
  rationale: Trong ngữ cảnh chiến lợi phẩm, cụm này chỉ chung từng đồ vật; “mọi vật” vừa cụ thể vừa tự nhiên trong tiếng Việt.
- source_word: אֲשֶׁר יָבֹא בָאֵשׁ
  choice: có thể chịu được lửa
  rationale: Thành ngữ nói đến những vật thích hợp để xử lý bằng lửa, chứ không chỉ đơn thuần là những vật đi vào lửa.
- source_word: תַּעֲבִירוּ בָאֵשׁ
  choice: anh em phải đưa qua lửa
  rationale: Dạng Hiphil của עבר mang nghĩa khiến cho đi qua; cách dịch này giữ hành động nghi thức và sắc thái mệnh lệnh.
- source_word: וְטָהֵר
  choice: và nó sẽ được sạch
  rationale: Động từ diễn tả tình trạng sạch đạt được sau khi xử lý bằng lửa, đồng thời phân biệt với yêu cầu thanh tẩy bổ sung ở mệnh đề sau.
- source_word: אַךְ
  choice: tuy nhiên
  rationale: Từ này đưa ra một điều kiện quan trọng đối với lời khẳng định ngay trước đó.
- source_word: בְּמֵי נִדָּה
  choice: bằng nước tẩy uế
  rationale: Cụm từ chỉ thứ nước dùng trong nghi thức thanh tẩy khỏi tình trạng ô uế theo Dân Số 19; cách dịch ngắn gọn, rõ công dụng mà không gán ý nghĩa đạo đức.
- source_word: יִתְחַטָּא
  choice: nó vẫn phải được thanh tẩy
  rationale: Trong văn cảnh luật tế lễ, dạng Hitpael của חטא nói đến việc trải qua nghi thức thanh tẩy khỏi ô uế, không phải được tha tội về mặt đạo đức.
- source_word: וְכֹל אֲשֶׁר לֹא יָבֹא בָּאֵשׁ
  choice: Còn mọi vật không thể chịu được lửa
  rationale: Cách dịch thể hiện sự tương phản thực tế giữa vật chịu được lửa và vật không chịu được lửa.
- source_word: תַּעֲבִירוּ בַמָּיִם
  choice: anh em phải đưa qua nước
  rationale: Giữ phép song hành với “đưa qua lửa” và phản ánh cùng một động từ nguyên ngữ.
theological_decisions:
- issue: Bản chất của ngôn ngữ thanh tẩy trong luật tế lễ
  choice: Diễn đạt theo phạm trù sạch và ô uế về nghi thức.
  alternative: Dịch theo hướng tẩy sạch tội lỗi hoặc dùng ngôn ngữ đạo đức chung chung.
  rationale: Dân Số 31, trong liên hệ với Dân Số 19, bàn về việc thanh tẩy đồ vật khỏi tình trạng ô uế do tiếp xúc, chứ không nói đến sự tha thứ tội lỗi đạo đức.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” cho ngôi thứ hai số nhiều trong lời chỉ dẫn dành cho cộng đồng; giữ phép song hành “đưa qua lửa/đưa qua nước.”
