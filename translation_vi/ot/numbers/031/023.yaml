revisions:
- from: Mọi vật có thể chịu được lửa thì anh em phải đưa qua lửa, và nó sẽ được sạch; tuy nhiên, nó vẫn phải được thanh tẩy bằng nước tẩy uế[a]. Còn mọi vật không thể chịu được lửa thì anh em phải đưa qua nước.
  to: Mọi vật có thể chịu được lửa thì anh em phải đưa qua lửa, và vật ấy sẽ sạch; nhưng vẫn phải được thanh tẩy bằng nước tẩy uế[a]. Còn mọi vật không thể chịu được lửa thì anh em phải đưa qua nước.
  rationale: Điều chỉnh liên từ để phản ánh lực ngoại lệ của אַךְ và sửa chú thích nhằm tránh nghĩa ngược trong tiếng Việt. Các phần còn lại được giữ nguyên về ý nghĩa, phép song hành và thuật ngữ nghi thức.
