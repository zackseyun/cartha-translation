base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/049.yaml
  text: And they said to Moses[a], “Your servants have taken a count of the men of war who are under our command[b], and not one man of us is missing.”
translation:
  language: vi
  text: 'Họ thưa với Môi-se: “Chúng tôi, là tôi tớ của ông, đã kiểm đếm[a] những người ra trận thuộc quyền chỉ huy của chúng tôi[b], và trong số đó không thiếu một ai.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nghĩa đen: “đã nâng đầu những người ra trận”; đây là một thành ngữ Hê-bơ-rơ chỉ việc kiểm đếm hoặc điểm danh.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “do chúng tôi phụ trách.” Nghĩa đen: “ở trong tay chúng tôi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲבָדֶיךָ
  choice: các tôi tớ của ông
  rationale: Đây là cách các sĩ quan tự xưng khiêm nhường với Môi-se; “tôi tớ” tự nhiên và phù hợp hơn “nô lệ” trong ngữ cảnh này.
- source_word: נָשְׂאוּ אֶת־רֹאשׁ
  choice: đã kiểm đếm
  rationale: Thành ngữ Hê-bơ-rơ, nghĩa đen là “nâng đầu”, trong ngữ cảnh quân sự-hành chính chỉ việc điểm danh hoặc kiểm đếm.
- source_word: אַנְשֵׁי הַמִּלְחָמָה
  choice: những người ra trận
  rationale: Diễn đạt tự nhiên nhóm nam giới tham chiến trong ngữ cảnh, không biến cụm từ thành một danh xưng chuyên biệt hơn mức nguyên văn.
- source_word: אֲשֶׁר בְּיָדֵנוּ
  choice: thuộc quyền chỉ huy của chúng tôi
  rationale: Nghĩa đen “ở trong tay chúng tôi”; tại đây chỉ những binh sĩ thuộc trách nhiệm và quyền chỉ huy của các sĩ quan.
- source_word: וְלֹא־נִפְקַד מִמֶּנּוּ אִישׁ
  choice: và trong chúng tôi không thiếu một ai
  rationale: Động từ nifal của פקד ở đây có nghĩa là bị thiếu, vắng mặt hoặc không còn được tính đến; cách dịch giữ được lời báo cáo rằng không người nào trong lực lượng của họ bị mất.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “thưa” để thể hiện sắc thái kính trọng của lời trình báo; giữ “các tôi tớ của ông” như lối tự xưng khiêm nhường. Không thêm chú thích cho thành ngữ “nâng đầu” vì bản dịch chính “kiểm đếm” truyền đạt rõ nghĩa, đồng thời dành chú thích cho sự đa nghĩa thực sự của בְּיָדֵנוּ.
