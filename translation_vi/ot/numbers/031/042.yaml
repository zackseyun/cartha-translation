  yaml_path: translation/ot/numbers/031/042.yaml
  text: And from the half belonging to the sons of Israel[a], which Moses had separated from the men who served in the army—
translation:
  language: vi
  text: Còn từ nửa phần thuộc về con cái Y-sơ-ra-ên, tức phần Môi-se đã tách ra khỏi phần của những người ra trận[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “những người đi ra chiến trận” hoặc “những người phục vụ trong quân ngũ.”'
    reason: Phân từ הַצֹּבְאִים có thể chỉ những người ra trận, đang trong chiến dịch, hoặc thi hành quân dịch.
lexical_decisions:
- source_word: וּ/מִֽ/מַּחֲצִית
  choice: Còn từ một nửa
  rationale: Thể hiện cả liên từ וּ và giới từ מִן; “một nửa” tự nhiên trong ngữ cảnh chia chiến lợi phẩm thành hai phần.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: thuộc về con dân Y-sơ-ra-ên
  rationale: “Con dân Y-sơ-ra-ên” là cách gọi trang trọng, quen thuộc trong tiếng Việt và chỉ cộng đồng Israel; “thuộc về” làm rõ quan hệ sở hữu của phần chiến lợi phẩm.
- source_word: אֲשֶׁר
  choice: là phần
  rationale: Diễn đạt quan hệ tương đối theo cách tự nhiên trong tiếng Việt, đồng thời xác định rõ tiền ngữ là “một nửa”.
- source_word: חָצָה
  choice: đã chia riêng
  rationale: Động từ chỉ việc chia hoặc tách một phần ra; “đã chia riêng” phù hợp với việc phân đôi chiến lợi phẩm trong văn cảnh.
- source_word: מֹשֶׁה
  choice: Môi-se
  rationale: Dạng phiên âm tên riêng quen dùng trong Kinh Thánh tiếng Việt.
- source_word: מִן הָ/אֲנָשִׁים
  choice: khỏi phần của những người
  rationale: Giữ ý tách phần của dân Israel ra khỏi phần gắn với những người tham chiến; thêm “phần của” để tránh cách hiểu rằng chính con người bị chia tách, một điều đã rõ từ văn cảnh phân chia chiến lợi phẩm.
- source_word: הַ/צֹּבְאִים
  choice: đi chiến trận
  rationale: Phân từ của צבא chỉ những người tham gia chiến dịch hoặc ra trận; cách diễn đạt này tự nhiên và giữ sắc thái quân sự mà không thu hẹp thành cơ cấu quân đội thường trực.
