  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יְהִ֣י כָּל זְהַ֣ב הַ/תְּרוּמָ֗ה אֲשֶׁ֤ר הֵרִ֨ימוּ֙ לַֽ/יהוָ֔ה שִׁשָּׁ֨ה עָשָׂ֥ר אֶ֛לֶף שְׁבַע מֵא֥וֹת וַ/חֲמִשִּׁ֖ים שָׁ֑קֶל מֵ/אֵת֙ שָׂרֵ֣י הָֽ/אֲלָפִ֔ים וּ/מֵ/אֵ֖ת שָׂרֵ֥י הַ/מֵּאֽוֹת׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/052.yaml
  text: And all the gold of the contribution that they presented to Yahweh was sixteen thousand seven hundred and fifty shekels[a], from the commanders of the thousands and from the commanders of the hundreds.
translation:
  language: vi
  text: Toàn bộ số vàng thuộc phần đóng góp[a] mà họ dâng lên Yahweh là 16.750 siếc-lơ, đến từ các chỉ huy đơn vị nghìn quân và các chỉ huy đơn vị trăm quân.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “lễ vật”. Từ Hê-bơ-rơ chỉ một phần đóng góp được biệt riêng để dâng cho Yahweh; theo truyền thống đôi khi được dịch là “lễ vật nâng lên”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כָּל זְהַב
  choice: Tổng số vàng ... là
  rationale: Diễn đạt tự nhiên lời tổng kết về toàn bộ lượng vàng, đồng thời giữ sự nối tiếp của mạch tường thuật.
- source_word: הַתְּרוּמָה
  choice: phần đóng góp
  rationale: Danh từ chỉ phần được tách riêng để dâng cho mục đích thánh; cách dịch này phù hợp với số chiến lợi phẩm được các chỉ huy đóng góp và dễ hiểu trong tiếng Việt hiện đại.
- source_word: אֲשֶׁר הֵרִימוּ
  choice: mà họ dâng lên
  rationale: Thể Hiphil của רום trong ngữ cảnh này chỉ hành động tách riêng và trình dâng, không nhất thiết mô tả việc nâng lên theo nghĩa đen.
- source_word: לַיהוָה
  choice: lên Yahweh
  rationale: Giữ danh riêng giao ước יהוה dưới dạng Yahweh; giới từ được kết hợp tự nhiên với động từ tiếng Việt “dâng lên”.
- source_word: שִׁשָּׁה עָשָׂר אֶלֶף שְׁבַע מֵאוֹת וַחֲמִשִּׁים שָׁקֶל
  choice: 16.750 siếc-lơ
  rationale: Giữ nguyên con số của bản Hê-bơ-rơ và phiên âm đơn vị trọng lượng cổ, tránh quy đổi thiếu chắc chắn sang đơn vị hiện đại.
- source_word: מֵאֵת
  choice: đến từ
  rationale: 'Thể hiện rõ ý nguồn gốc: số vàng này đến từ các chỉ huy.'
- source_word: שָׂרֵי הָאֲלָפִים וּמֵאֵת שָׂרֵי הַמֵּאוֹת
  choice: các chỉ huy đơn vị nghìn quân và các chỉ huy đơn vị trăm quân
  rationale: “Chỉ huy” phù hợp với bối cảnh quân sự; thêm “đơn vị” và “quân” giúp người đọc hiểu “nghìn” và “trăm” là cấp tổ chức quân đội, không chỉ là số đếm.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC CHÚA / Giê-hô-va
  rationale: Nguyên văn dùng trực tiếp danh giao ước יהוה; phiên âm Yahweh giữ đây là danh riêng mà không thay bằng một tước hiệu.
- issue: Sắc thái thánh hiến của תְּרוּמָה
  choice: phần đóng góp
  alternative: lễ vật / lễ vật dâng lên
  rationale: “Phần đóng góp” giữ trọng tâm là phần tài sản được tách ra đóng góp, trong khi chú thích nêu rõ sắc thái dâng riêng cho Yahweh; tránh áp đặt một loại nghi lễ chuyên biệt hơn điều câu văn xác định.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc “Tổng số ... là” tự nhiên hơn lối dịch sát chữ “Và ... là”. Cụm cấp chỉ huy được làm rõ vừa đủ để phản ánh cơ cấu quân sự trong nguyên văn.
