revisions:
- from: Tổng số vàng trong phần đóng góp[a] mà họ dâng lên Yahweh là 16.750 siếc-lơ, đến từ các chỉ huy đơn vị nghìn quân và các chỉ huy đơn vị trăm quân.
  to: Toàn bộ số vàng thuộc phần đóng góp[a] mà họ dâng lên Yahweh là 16.750 siếc-lơ, đến từ các chỉ huy đơn vị nghìn quân và các chỉ huy đơn vị trăm quân.
  rationale: Chỉ điều chỉnh giới từ trong cụm đầu câu để diễn đạt chính xác hơn quan hệ giữa “vàng” và “phần đóng góp”. Các thành tố còn lại phù hợp với nguyên văn và tiếng Việt hiện đại.
