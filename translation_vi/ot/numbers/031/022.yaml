base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/022.yaml
  text: Only the gold[a], the silver, the bronze, the iron, the tin, and the lead—
translation:
  language: vi
  text: Chỉ có vàng, bạc, đồng[a], sắt, thiếc và chì—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “đồng thiếc.” Từ Hê-bơ-rơ có thể chỉ đồng nói chung hoặc kim loại có nền đồng.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Chỉ có
  rationale: Trong ngữ cảnh, từ này nêu một giới hạn hoặc ngoại lệ đối với chỉ dẫn trước đó; “chỉ có” mở đầu danh sách tự nhiên trong tiếng Việt.
- source_word: הַזָּהָב
  choice: vàng
  rationale: Nghĩa thông thường của זָהָב là kim loại vàng; tiếng Việt không cần mạo từ.
- source_word: הַכָּסֶף
  choice: bạc
  rationale: Ở đây כֶּסֶף chỉ kim loại bạc, không phải tiền, vì nằm trong danh sách các kim loại cần thanh tẩy.
- source_word: הַנְּחֹשֶׁת
  choice: đồng
  rationale: נְחֹשֶׁת có thể chỉ đồng hoặc đồng thiếc; “đồng” là cách gọi tự nhiên, đủ rộng trong tiếng Việt, còn khả năng hiểu cụ thể là đồng thiếc được ghi ở chú thích.
- source_word: הַבַּרְזֶל
  choice: sắt
  rationale: Cách dịch trực tiếp và thông dụng của בַּרְזֶל.
- source_word: הַבְּדִיל
  choice: thiếc
  rationale: בְּדִיל thường chỉ thiếc trong các danh sách kim loại.
- source_word: הָעֹפָרֶת
  choice: chì
  rationale: Cách dịch trực tiếp và thông dụng của עֹפָרֶת.
- source_word: אֵת repeated before each noun
  choice: không dịch riêng
  rationale: Dấu hiệu tân ngữ được lặp lại để cấu trúc và nhấn mạnh danh sách trong tiếng Hê-bơ-rơ, nhưng tiếng Việt biểu đạt tự nhiên bằng dấu phẩy và liên từ.
