  text: וַ/יִּקַּ֨ח מֹשֶׁ֜ה מִ/מַּחֲצִ֣ת בְּנֵֽי יִשְׂרָאֵ֗ל אֶת הָֽ/אָחֻז֙ אֶחָ֣ד מִן הַ/חֲמִשִּׁ֔ים מִן הָ/אָדָ֖ם וּ/מִן הַ/בְּהֵמָ֑ה וַ/יִּתֵּ֨ן אֹתָ֜/ם לַ/לְוִיִּ֗ם שֹֽׁמְרֵי֙ מִשְׁמֶ֨רֶת֙ מִשְׁכַּ֣ן יְהוָ֔ה כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/047.yaml
  text: From the half belonging to the sons of Israel[a], Moses took one portion out of fifty, from the people and from the livestock, and gave them to the Levites who kept charge of the tabernacle of Yahweh[b], just as Yahweh had commanded Moses.
translation:
  language: vi
  text: 'Từ một nửa thuộc về người Y-sơ-ra-ên[a], Môi-se lấy một phần trích ra: cứ năm mươi người hoặc súc vật thì lấy một, rồi giao chúng cho người Lê-vi, là những người đảm trách việc trông coi Đền Tạm của Yahweh, đúng như Yahweh đã truyền cho Môi-se.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hê-bơ-rơ: “con trai của Y-sơ-ra-ên”; nghĩa là người/dân Y-sơ-ra-ên.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִמַּחֲצִת בְּנֵי יִשְׂרָאֵל
  choice: Từ một nửa thuộc về con cái Y-sơ-ra-ên
  rationale: Diễn đạt phần chiến lợi phẩm được chia cho cộng đồng Y-sơ-ra-ên, đồng thời giữ hình thức Hê-bơ-rơ ‘con cái Y-sơ-ra-ên’; chú thích nêu cách nói tự nhiên hơn.
- source_word: הָאָחֻז אֶחָד מִן הַחֲמִשִּׁים
  choice: một phần trong mỗi năm mươi
  rationale: אָחֻז chỉ phần được lấy làm khoản trích nộp; cụm từ quy định tỷ lệ một trên năm mươi. ‘Trong mỗi năm mươi’ làm rõ tính phân bổ mà không thêm nội dung.
- source_word: מִן הָאָדָם וּמִן הַבְּהֵמָה
  choice: người và súc vật
  rationale: אָדָם mang nghĩa tập thể là những người trong chiến lợi phẩm, còn בְּהֵמָה chỉ các gia súc hay vật nuôi; cách dịch ngắn gọn và phù hợp ngữ cảnh.
- source_word: וַיִּתֵּן אֹתָם לַלְוִיִּם
  choice: rồi giao cho người Lê-vi
  rationale: Động từ נתן ở đây là trao phần đã trích cho người Lê-vi; tiếng Việt không cần biểu thị riêng đại từ số nhiều אֹתָם.
- source_word: שֹׁמְרֵי מִשְׁמֶרֶת מִשְׁכַּן יְהוָה
  choice: là những người đảm trách việc trông coi Đền Tạm của Yahweh
  rationale: Cấu trúc đồng căn שׁמר/מִשְׁמֶרֶת nói đến trách nhiệm canh giữ và phụ trách công việc liên quan đến Đền Tạm. Cách diễn đạt này vừa tự nhiên vừa giữ sắc thái trách nhiệm được giao.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Chuyển tự danh riêng giao ước của Đức Chúa Trời thay vì thay bằng một tước hiệu.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: đúng như Yahweh đã truyền cho Môi-se
  rationale: כַּאֲשֶׁר diễn tả sự làm đúng theo mệnh lệnh đã ban trước đó; ‘đã truyền’ phù hợp trình tự tường thuật.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA; CHÚA
  rationale: Nguyên văn dùng trực tiếp danh riêng יהוה; giữ ‘Yahweh’ giúp phân biệt danh này với các tước hiệu.
- issue: Cách dịch בְּנֵי יִשְׂרָאֵל
  choice: con cái Y-sơ-ra-ên
  alternative: dân Y-sơ-ra-ên; người Y-sơ-ra-ên
  rationale: Giữ thành ngữ nguyên văn ‘con cái Y-sơ-ra-ên’ trong câu chính, đồng thời chú thích nghĩa chỉ toàn thể dân Y-sơ-ra-ên.
- issue: Phạm vi của khoản một phần năm mươi
  choice: một phần trong mỗi năm mươi người và súc vật
  alternative: một phần trong số năm mươi, từ loài người và súc vật
  rationale: Nguyên văn áp dụng tỷ lệ cho cả hai hạng mục, con người và súc vật. Cách dịch không làm nhẹ hoặc che khuất việc con người bị tính trong chiến lợi phẩm.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ các tên quen dùng trong tiếng Việt như Môi-se, Y-sơ-ra-ên và Lê-vi; dùng ‘Đền Tạm’ cho מִשְׁכָּן. Chỉ đặt một chú thích [a]; dữ liệu tiếng Anh gắn [b] sau ‘Yahweh’ nhưng nội dung chú thích lại giải thích tỷ lệ một phần năm mươi, nên không lặp lại điểm vốn đã rõ trong bản dịch.
