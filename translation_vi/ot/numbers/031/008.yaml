source:
  edition: WLC
  text: וְ/אֶת מַלְכֵ֨י מִדְיָ֜ן הָרְג֣וּ עַל חַלְלֵי/הֶ֗ם אֶת אֱוִ֤י וְ/אֶת רֶ֨קֶם֙ וְ/אֶת צ֤וּר וְ/אֶת חוּר֙ וְ/אֶת רֶ֔בַע חֲמֵ֖שֶׁת מַלְכֵ֣י מִדְיָ֑ן וְ/אֵת֙ בִּלְעָ֣ם בֶּן בְּע֔וֹר הָרְג֖וּ בֶּ/חָֽרֶב־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/008.yaml
  text: 'They killed the kings of Midian along with the rest of their slain: Evi[a], Rekem, Zur, Hur, and Reba, the five kings of Midian. They also killed Balaam son of Beor with the sword.'
translation:
  language: vi
  text: 'Họ giết các vua Ma-đi-an cùng với những người Ma-đi-an khác đã bị giết[a]: Ê-vi, Rê-kem, Xu-rơ, Hu-rơ và Rê-ba—năm vua Ma-đi-an. Họ cũng dùng gươm giết Ba-la-am, con trai Bê-ô.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “giữa những người bị giết của họ.” Cụm từ Hê-bơ-rơ rất cô đọng và có thể mô tả các vua bị giết giữa những người Ma-đi-an đã chết.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרְגוּ
  choice: họ giết
  rationale: Động từ Qal hoàn thành, ngôi ba số nhiều của הרג, diễn tả trực tiếp hành động giết; cách dịch này rõ ràng và tự nhiên trong tiếng Việt hiện đại.
- source_word: עַל חַלְלֵיהֶם
  choice: cùng với những người khác trong dân ấy đã bị giết
  rationale: Cụm Hê-bơ-rơ cô đọng, theo nghĩa đen là “trên/giữa những người bị giết của họ”, và trong văn cảnh có thể chỉ các vua bị giết cùng với những người Ma-đi-an khác. Từ “khác” làm rõ rằng năm vua thuộc thêm vào số người đã chết, nhưng chú thích vẫn bảo lưu sắc thái không gian “giữa”.
- source_word: מַלְכֵי מִדְיָן
  choice: các vua Ma-đi-an
  rationale: Chuỗi sở hữu có nghĩa là các vua của Ma-đi-an; cách diễn đạt này tự nhiên trong tiếng Việt và được giữ nhất quán ở cả hai lần xuất hiện.
- source_word: אֱוִי ... רֶקֶם ... צוּר ... חוּר ... רֶבַע
  choice: Ê-vi, Rê-kem, Xu-rơ, Hu-rơ và Rê-ba
  rationale: Các tên riêng được phiên âm theo lối viết dễ đọc đối với độc giả Việt, không dịch nghĩa.
- source_word: חֲמֵשֶׁת מַלְכֵי מִדְיָן
  choice: năm vua Ma-đi-an
  rationale: Đây là thành phần đồng vị tóm lại năm người vừa được nêu tên.
- source_word: בִּלְעָם בֶּן בְּעוֹר
  choice: Ba-la-am, con trai Bê-ô
  rationale: Giữ tên riêng và quan hệ phụ tử được nêu trực tiếp trong nguyên văn.
- source_word: בֶּחָרֶב
  choice: dùng gươm
  rationale: Giới từ בְּ mang nghĩa phương tiện; “dùng gươm” diễn đạt tự nhiên và vẫn giữ phương tiện cụ thể của hành động.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại, dùng câu chủ động và tên riêng phiên âm dễ đọc. Dấu gạch ngang làm rõ thành phần đồng vị “năm vua Ma-đi-an”. Đại từ “dân ấy” tránh lặp nặng nề nhưng vẫn quy chiếu rõ đến Ma-đi-an.
