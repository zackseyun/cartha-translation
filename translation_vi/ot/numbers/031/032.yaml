- from: Số chiến lợi phẩm[a], tức phần còn lại của số của cải mà quân lính đã cướp được, là 675.000 con cừu.
  to: Chiến lợi phẩm[a], tức phần còn lại của của cải mà quân lính đã cướp được, là 675.000 con cừu.
  rationale: Bản sửa loại bỏ “số” không cần thiết, giữ nguyên quan hệ đồng vị của câu và số lượng chính xác. Chú thích được viết lại bằng tiếng Việt tự nhiên, đồng thời vẫn nêu sự gần nghĩa nhưng không hoàn toàn đồng nhất của hai thuật ngữ Hê-bơ-rơ.
