  text: וַ/יְהִי֙ הַ/מַּלְק֔וֹחַ יֶ֣תֶר הַ/בָּ֔ז אֲשֶׁ֥ר בָּזְז֖וּ עַ֣ם הַ/צָּבָ֑א צֹ֗אן שֵׁשׁ מֵא֥וֹת אֶ֛לֶף וְ/שִׁבְעִ֥ים אֶ֖לֶף וַ/חֲמֵֽשֶׁת אֲלָפִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/032.yaml
  text: The plunder[a], the remainder of the spoil that the people of the army had plundered, was 675,000 sheep.
translation:
  language: vi
  text: Chiến lợi phẩm[a], tức phần còn lại của của cải mà quân lính đã cướp được, là 675.000 con cừu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “của cải cướp được, tức phần còn lại của chiến lợi phẩm”. Tiếng Hê-bơ-rơ dùng hai từ gần nghĩa về của cải thu được trong chiến tranh (מַלְקוֹחַ và בָּז), có lẽ để tạo sắc thái văn phong hoặc phân loại.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: là
  rationale: Động từ היה với liên từ kể chuyện mở đầu lời thống kê; tiếng Việt diễn đạt tự nhiên bằng hệ từ “là” trong chính mệnh đề, không thêm một trạng từ thời gian vốn không có trong nguyên văn.
- source_word: הַמַּלְקוֹחַ
  choice: số chiến lợi phẩm
  rationale: מַלְקוֹחַ chỉ những gì thu được trong chiến tranh. “Chiến lợi phẩm” rõ nghĩa, trang trọng vừa phải và phù hợp với ngữ cảnh quân sự; “số” thích hợp với phần kiểm kê tiếp theo.
- source_word: יֶתֶר הַבָּז
  choice: phần còn lại của số của cải ... cướp được
  rationale: יֶתֶר diễn tả phần còn lại, còn בָּז là một thuật ngữ về của cải lấy được trong chiến tranh. Cách dịch này giữ quan hệ cấu tạo của cụm từ và phân biệt tương đối בָּז với מַלְקוֹחַ.
- source_word: אֲשֶׁר בָּזְזוּ
  choice: mà ... đã cướp được
  rationale: Động từ בזז chỉ hành động lấy của trong chiến tranh. “Cướp được” vừa phản ánh chính xác hành động vừa kết hợp tự nhiên với “của cải” trong tiếng Việt.
- source_word: עַם הַצָּבָא
  choice: quân lính
  rationale: Cụm Hê-bơ-rơ có nghĩa đen là “dân/người của quân đội”. “Quân lính” truyền đạt tự nhiên tập thể những người tham chiến mà không gây hiểu nhầm thành “dân quân”.
- source_word: צֹאן
  choice: con cừu
  rationale: Trong danh sách kiểm kê này, צֹאן được đếm như cừu và được phân biệt với dê ở phần sau. “Cừu” là từ hiện đại, thông dụng trong tiếng Việt.
- source_word: שֵׁשׁ מֵאוֹת אֶלֶף וְשִׁבְעִים אֶלֶף וַחֲמֵשֶׁת אֲלָפִים
  choice: '675.000'
  rationale: Con số Hê-bơ-rơ là 600.000 + 70.000 + 5.000. Dùng chữ số giúp danh sách kiểm kê dễ đọc mà vẫn giữ nguyên số lượng chính xác.
theological_decisions: []
translation_notes:
  register: Bản dịch dùng tiếng Việt tiêu chuẩn hiện đại, rõ ràng và trang trọng vừa phải. Cấu trúc đồng vị “tức phần còn lại...” giữ sát quan hệ giữa các cụm từ trong nguyên văn, còn “quân lính” và “con cừu” giúp câu tự nhiên đối với độc giả phổ thông.
