lexical_decisions:
- source_word: וַ/חֲמֹרִים
  choice: và ... con lừa
  rationale: Tiền tố וַ tiếp nối danh sách chiến lợi phẩm từ các câu trước nên được dịch là “và”. Danh từ số nhiều חֲמֹרִים chỉ lừa; tiếng Việt tự nhiên dùng danh từ loại “con”, còn số nhiều đã được thể hiện qua số lượng.
- source_word: אֶחָד וְ/שִׁשִּׁים אָלֶף
  choice: '61.000'
  rationale: Cụm số Hê-bơ-rơ theo nghĩa đen là “một và sáu mươi nghìn”, tức 61.000. Dùng chữ số và dấu phân cách hàng nghìn phù hợp với cách trình bày hiện đại, rõ ràng trong danh sách thống kê.
