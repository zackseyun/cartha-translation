  terminology: Giữ “Yahweh” đúng với quyết định thuật ngữ. “Thầy tế lễ Ê-lê-a-sa” là cách gọi hiện đại, rõ nghĩa. Chú thích truyền thống cần sửa vì “lễ vật đưa qua đưa lại” không phải cách diễn đạt chuẩn cho תְּרוּמָה/heave offering và có thể gợi một nghi thức không được nói đến.
