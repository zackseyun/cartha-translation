  to: Môi-se trao phần trích nộp[a], tức lễ vật dâng cho Yahweh[b], cho thầy tế lễ Ê-lê-a-sa, đúng như Yahweh đã truyền cho Môi-se.
  rationale: Sửa “phần cống nộp” thành “phần trích nộp” để phản ánh sát hơn khoản trích thu từ chiến lợi phẩm. Dùng “lễ vật dâng cho Yahweh” cho תְּרוּמַת יְהוָה, vẫn giữ nghĩa rộng của phần được biệt riêng cho Yahweh mà không gán một nghi thức cụ thể. Khôi phục tên Môi-se ở cuối câu theo nguyên văn và sửa chú thích truyền thống cho chính xác, tự nhiên.
