source:
  edition: WLC
  text: וַ/יִּתֵּ֣ן מֹשֶׁ֗ה אֶת מֶ֨כֶס֙ תְּרוּמַ֣ת יְהוָ֔ה לְ/אֶלְעָזָ֖ר הַ/כֹּהֵ֑ן כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/041.yaml
  text: And Moses gave the tribute[a], the contribution for Yahweh, to Eleazar the priest[b], just as Yahweh had commanded Moses.
translation:
  language: vi
  text: Môi-se trao phần trích nộp[a], tức lễ vật dâng cho Yahweh[b], cho thầy tế lễ Ê-lê-a-sa, đúng như Yahweh đã truyền cho Môi-se.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “phần thu nộp”, “phần trưng thu” hoặc “khoản phải nộp”; đây là phần được ấn định lấy từ chiến lợi phẩm.
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch là “phần đóng góp dành cho Yahweh” hoặc “phần đóng góp của Yahweh”; theo cách dịch truyền thống: “lễ vật dâng lên Yahweh”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: trao
  rationale: Động từ נתן ở dạng kể chuyện diễn tả hành động giao phần đã định cho Ê-lê-a-sa; “trao” tự nhiên và chính xác hơn “cho” trong ngữ cảnh này.
- source_word: מֶכֶס
  choice: phần cống nộp
  rationale: Trong ngữ cảnh phân chia chiến lợi phẩm, מֶכֶס là phần được ấn định phải trích nộp. “Phần cống nộp” diễn đạt nghĩa vụ nộp mà không gợi hệ thống thuế dân sự hiện đại.
- source_word: תְּרוּמַת יְהוָה
  choice: phần đóng góp dành cho Yahweh
  rationale: תְּרוּמָה chỉ phần được tách riêng để dâng hoặc dành cho mục đích thánh. Cách dịch này giữ quan hệ hướng đến Yahweh mà không áp đặt một nghi thức nâng lễ vật cụ thể.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời trong bản Hê-bơ-rơ, thay vì thay thế bằng một tước hiệu.
- source_word: לְאֶלְעָזָר הַכֹּהֵן
  choice: cho thầy tế lễ Ê-lê-a-sa
  rationale: Dịch trực tiếp giới từ, tên riêng và danh xưng הַכֹּהֵן bằng cách gọi rõ ràng, quen thuộc trong tiếng Việt.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת־מֹשֶׁה
  choice: đúng như Yahweh đã truyền cho ông
  rationale: “Đúng như” nhấn mạnh sự làm theo chỉ thị đã ban trước đó; “ông” tránh lặp tên Môi-se mà vẫn có quy chiếu rõ ràng.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / Chúa
  rationale: Nguyên văn dùng trực tiếp danh bốn phụ âm. Giữ “Yahweh” bảo tồn tư cách danh riêng và không biến danh này thành một tước hiệu.
- issue: Ý nghĩa nghi lễ của תְּרוּמָה
  choice: phần đóng góp dành cho Yahweh
  alternative: lễ vật dâng lên Yahweh / lễ vật đưa qua đưa lại của Yahweh
  rationale: Từ này có thể chỉ lễ vật hoặc phần đóng góp được biệt riêng, nhưng câu không mô tả một động tác nghi lễ. Bản dịch chính giữ nghĩa rộng và chú thích các cách hiểu khác.
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng dễ hiểu trong tiếng Việt hiện đại. Dùng “thầy tế lễ” là cách gọi phổ thông; tên riêng được phiên âm theo lối quen thuộc. Cấu trúc “tức” làm rõ rằng phần đóng góp dành cho Yahweh chính là phần cống nộp vừa được nhắc đến.
