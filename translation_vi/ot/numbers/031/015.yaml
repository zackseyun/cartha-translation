source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר אֲלֵי/הֶ֖ם מֹשֶׁ֑ה הַֽ/חִיִּיתֶ֖ם כָּל נְקֵבָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/015.yaml
  text: Moses said to them[a], “Have you kept alive every female?”
translation:
  language: vi
  text: 'Môi-se nói với họ: “Các ngươi đã để cho tất cả những người nữ sống sao?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: nói
  rationale: Động từ אמר ở dạng kể chuyện được chuyển bằng “nói”, tự nhiên và sát nghĩa trong văn thuật sự tiếng Việt.
- source_word: אֲלֵיהֶם
  choice: với họ
  rationale: Giới từ אֶל cùng hậu tố ngôi ba số nhiều chỉ những người được Môi-se nói trực tiếp; “với họ” là cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: מֹשֶׁה
  choice: Môi-se
  rationale: Dùng dạng tên riêng quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
- source_word: הַחִיִּיתֶם
  choice: đã để cho ... sống
  rationale: Dạng khiến khiến của חיה có nghĩa “để cho sống/giữ cho sống”. Trong lời chất vấn về hành động vừa hoàn tất, “đã để cho ... sống sao?” vừa tự nhiên vừa giữ sắc thái khiến khiến.
- source_word: כָּל
  choice: mọi
  rationale: Khi đi với danh từ số ít, כָּל diễn tả tính bao quát toàn bộ; “mọi” phù hợp với cú pháp tiếng Việt.
- source_word: נְקֵבָה
  choice: người nữ
  rationale: נְקֵבָה chỉ giới tính nữ nói chung, không giới hạn ở phụ nữ trưởng thành. “Người nữ” giữ phạm vi rộng của nguyên văn mà vẫn tự nhiên và có phẩm cách hơn cách dùng danh từ “giống cái” cho con người.
theological_decisions:
- issue: Phạm vi của נְקֵבָה trong bối cảnh chiến tranh bạo lực
  choice: người nữ
  alternative: phụ nữ; phụ nữ và bé gái
  rationale: Nguyên ngữ không giới hạn độ tuổi. “Người nữ” giữ nguyên phạm vi bao quát và sự gay gắt của câu hỏi, không thu hẹp đối tượng thành phụ nữ trưởng thành hoặc diễn giải thành hai nhóm tuổi.
translation_notes:
  register: Văn phong thuật sự trang trọng, hiện đại. Đại từ “các ngươi” phản ánh lời quở trách trực tiếp của Môi-se đối với nhóm thuộc cấp; câu hỏi với “sao?” truyền đạt rõ lực chất vấn trong ngữ cảnh.
