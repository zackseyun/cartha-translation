    issue: Cụm “mọi người nữ” gượng và dễ khó đọc.
    rationale: Dù có thể hiểu là “every female person”, trật tự từ này ít tự nhiên trong tiếng Việt hiện đại. “Tất cả những người nữ” rõ ràng hơn, vẫn bảo toàn tính bao quát của כָּל và phạm vi không phân biệt tuổi của נְקֵבָה.
  revised_text: 'Môi-se nói với họ: “Các ngươi đã để cho tất cả những người nữ sống sao?”'
