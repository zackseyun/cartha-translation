base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/048.yaml
  text: Then the officers who were over the thousands of the army[a], the commanders of thousands and the commanders of hundreds[b], came near to Moses.
translation:
  language: vi
  text: Bấy giờ, những người được bổ nhiệm phụ trách các đơn vị nghìn quân[a], tức là các chỉ huy đơn vị một nghìn và các chỉ huy đơn vị một trăm, đến gần Môi-se.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cụm tiếng Hê-bơ-rơ có thể hiểu sát hơn là “phụ trách các nghìn quân”. “Nghìn” ở đây có thể chỉ một đơn vị quân sự, không nhất thiết khẳng định quân số thực tế đúng một nghìn người.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרְבוּ
  choice: đến gần
  rationale: Diễn đạt trực tiếp chuyển động hướng về Môi-se, giữ sắc thái cụ thể và mạch kể của động từ קרב.
- source_word: הַפְּקֻדִים
  choice: những người được bổ nhiệm
  rationale: Dạng từ này bắt nguồn từ פקד và chỉ những người được giao trách nhiệm trên các đơn vị quân đội; cách dịch giữ rõ ý được bổ nhiệm thay vì chỉ suy diễn một quân hàm cụ thể.
- source_word: אֲשֶׁר לְאַלְפֵי הַצָּבָא
  choice: coi các đơn vị nghìn quân
  rationale: Trong văn cảnh và nhờ phần đồng vị theo sau, giới từ לְ biểu thị phạm vi trách nhiệm của những người được bổ nhiệm. “Đơn vị nghìn quân” tự nhiên hơn cách nói sát chữ “những nghìn của quân đội”.
- source_word: אַלְפֵי
  choice: các đơn vị nghìn quân
  rationale: אֶלֶף có thể chỉ con số một nghìn hoặc một đơn vị xã hội/quân sự. Văn cảnh quân đội và vế song song với các đơn vị một trăm nghiêng về đơn vị quân sự quy ước, nhưng cách dịch không khẳng định quân số thực tế luôn đúng một nghìn.
- source_word: הַצָּבָא
  choice: quân
  rationale: Trong cụm “đơn vị nghìn quân”, từ này biểu thị lực lượng chiến đấu có tổ chức; cách diễn đạt gọn và tự nhiên trong tiếng Việt.
- source_word: שָׂרֵי הָאֲלָפִים
  choice: các chỉ huy đơn vị một nghìn
  rationale: שַׂר chỉ người đứng đầu hay quan chức; trong ngữ cảnh quân sự, “chỉ huy” phù hợp. Cụm “đơn vị một nghìn” bảo tồn cơ cấu được nêu trong tiếng Hê-bơ-rơ.
- source_word: וְשָׂרֵי הַמֵּאוֹת
  choice: và các chỉ huy đơn vị một trăm
  rationale: Dịch song song với שָׂרֵי הָאֲלָפִים để thể hiện hệ thống chỉ huy quân sự theo đơn vị.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dấu gạch ngang làm rõ rằng hai cấp chỉ huy theo sau giải thích cụ thể “những người được bổ nhiệm”. Tên riêng được viết là “Môi-se” theo lối phiên âm Việt ngữ quen dùng.
