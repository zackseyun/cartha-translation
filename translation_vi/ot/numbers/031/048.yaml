revisions:
- from: Bấy giờ, những người được bổ nhiệm coi các đơn vị nghìn quân[a]—tức các chỉ huy đơn vị một nghìn và các chỉ huy đơn vị một trăm—đến gần Môi-se.
  to: Bấy giờ, những người được bổ nhiệm phụ trách các đơn vị nghìn quân[a], tức là các chỉ huy đơn vị một nghìn và các chỉ huy đơn vị một trăm, đến gần Môi-se.
