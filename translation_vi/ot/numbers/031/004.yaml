  text: A thousand from each tribe[a], from all the tribes of Israel, you shall send to the army.
translation:
  language: vi
  text: “Một ngàn người từ mỗi bộ tộc, một ngàn người từ mỗi bộ tộc; từ tất cả các bộ tộc Israel, anh em phải phái những người ấy vào quân ngũ[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “ra quân.” Từ Hê-bơ-rơ לַצָּבָא có thể chỉ lực lượng quân sự hoặc việc phục vụ quân sự, chứ không chỉ việc đi đến một địa điểm.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶלֶף
  choice: một ngàn người
  rationale: Đây là số từ chỉ một ngàn; thêm “người” theo ngữ cảnh tuyển quân để câu tiếng Việt tự nhiên mà không thay đổi ý nghĩa.
- source_word: לַמַּטֶּה
  choice: từ mỗi bộ tộc
  rationale: מַטֶּה trong ngữ cảnh quân sự chỉ “bộ tộc”; giới từ ל đi với con số được hiểu theo nghĩa phân phối, tức mỗi bộ tộc cung cấp một ngàn người.
- source_word: אֶלֶף לַמַּטֶּה אֶלֶף לַמַּטֶּה
  choice: một ngàn người từ mỗi bộ tộc, một ngàn người từ mỗi bộ tộc
  rationale: Giữ nguyên phép lặp có chủ ý trong tiếng Hê-bơ-rơ để bảo toàn nhịp điệu, sắc thái nhấn mạnh và tính minh bạch hình thức.
- source_word: לְכֹל מַטּוֹת יִשְׂרָאֵל
  choice: từ tất cả các bộ tộc Israel
  rationale: 'Cụm từ xác định phạm vi phân phối của mệnh lệnh: người được phái đi phải được lấy từ toàn thể các bộ tộc Israel.'
- source_word: תִּשְׁלְחוּ
  choice: anh em phải phái
  rationale: Động từ Qal chưa hoàn thành ngôi hai số nhiều mang lực mệnh lệnh trong ngữ cảnh này. “Anh em phải phái” vừa thể hiện số nhiều và tính bắt buộc, vừa tự nhiên hơn lối nói cổ “các ngươi sẽ sai”.
- source_word: לַצָּבָא
  choice: ra trận
  rationale: צָבָא có thể chỉ quân đội, chiến dịch hoặc việc phục vụ quân sự. “Ra trận” ngắn gọn và tự nhiên trong ngữ cảnh, còn khả năng hiểu rộng hơn được giữ trong chú thích.
theological_decisions: []
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh em” cho ngôi hai số nhiều nhằm tránh sắc thái cổ hoặc miệt thị của “các ngươi”. Giữ nguyên phép lặp của nguyên văn dù câu có độ nhấn mạnh khác thường.
