    rationale: Cụm Hê-bơ-rơ có thể quy chiếu quân đội/lực lượng quân sự hoặc việc phục vụ quân sự; không nhất thiết chỉ thời điểm trực tiếp chiến đấu. «Vào quân ngũ» giữ phạm vi nghĩa rộng hơn.
  - severity: low
    issue: Liên kết cú pháp của mệnh lệnh với hai nhóm «một ngàn người» cần rõ hơn.
    rationale: «Phái những người ấy» diễn đạt rõ đối tượng được sai phái, không thêm nội dung thực chất.
  revised_text: “Một ngàn người từ mỗi bộ tộc, một ngàn người từ mỗi bộ tộc; từ tất cả các bộ tộc Israel, anh em phải phái những người ấy vào quân ngũ[a].”
