- from: 'Vì vậy, chúng tôi đã dâng lễ vật lên Yahweh: mỗi người dâng những gì mình tìm được—các món đồ bằng vàng, vòng đeo tay[a], vòng xuyến, nhẫn, khuyên tai và đồ trang sức[b]—để làm lễ chuộc tội cho chính mình[c] trước mặt Yahweh.'
