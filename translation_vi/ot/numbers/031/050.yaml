source:
  edition: WLC
  text: וַ/נַּקְרֵ֞ב אֶת קָרְבַּ֣ן יְהוָ֗ה אִישׁ֩ אֲשֶׁ֨ר מָצָ֤א כְלִֽי זָהָב֙ אֶצְעָדָ֣ה וְ/צָמִ֔יד טַבַּ֖עַת עָגִ֣יל וְ/כוּמָ֑ז לְ/כַפֵּ֥ר עַל נַפְשֹׁתֵ֖י/נוּ לִ/פְנֵ֥י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/050.yaml
  text: 'So we have brought near Yahweh’s offering: each man what he found—articles of gold[a], armlets and bracelets, rings, earrings[c][b], and pendants—to make atonement for ourselves before Yahweh.'
translation:
  language: vi
  text: 'Vì vậy, chúng tôi đã dâng lên Yahweh một lễ vật: mỗi người dâng những gì mình tìm được—các món đồ bằng vàng, vòng đeo cánh tay[a], vòng tay, nhẫn, khuyên tai và một món trang sức[b]—để làm sự chuộc tội cho chính chúng tôi[c] trước mặt Yahweh.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hoặc có thể là “vòng chân”; אֶצְעָדָה chỉ một món trang sức đeo ở chi, nhưng vị trí chính xác không chắc chắn.
    reason: lexical_alternative
  - marker: b
    text: Nghĩa chính xác của כוּמָז không chắc chắn; có thể là dây chuyền, mặt trang sức hoặc khuyên mũi.
    reason: lexical_alternative
  - marker: c
    text: 'Nguyên văn: “cho mạng sống/con người của chúng tôi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנַּקְרֵב
  choice: Vì vậy, chúng tôi đã dâng ... lên
  rationale: Diễn đạt thể Hiphil của קרב, nghĩa đen là “đem lại gần”, bằng lối nói tự nhiên trong ngữ cảnh dâng lễ vật; “Vì vậy” phản ánh waw nối tiếp mạch kể.
- source_word: קָרְבַּן יְהוָה
  choice: lễ vật ... dâng lên Yahweh
  rationale: קָרְבָּן là vật được đem đến/dâng hiến. Cách diễn đạt này tự nhiên trong tiếng Việt và không xác định quá mức loại lễ vật.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ tên riêng của Đức Chúa Trời theo dạng phiên âm thay vì thay bằng một tước hiệu.
- source_word: אִישׁ אֲשֶׁר מָצָא
  choice: mỗi người dâng những gì mình tìm được
  rationale: Giữ ý phân phối của אִישׁ trong nhóm binh sĩ; thêm động từ “dâng” để câu tiếng Việt rõ và tự nhiên, dù động từ này được hiểu từ mệnh đề chính.
- source_word: כְלִי זָהָב
  choice: các món đồ bằng vàng
  rationale: כְלִי là từ rộng chỉ đồ vật hoặc vật dụng; cách dịch không thu hẹp toàn bộ danh mục thành một loại trang sức cụ thể.
- source_word: אֶצְעָדָה
  choice: vòng đeo tay
  rationale: Chỉ một món trang sức đeo ở chi; vị trí chính xác không chắc chắn nên ghi nhận khả năng “vòng chân” trong chú thích.
- source_word: צָמִיד
  choice: vòng xuyến
  rationale: Chỉ vòng trang sức đeo ở cổ tay hoặc cánh tay; “vòng xuyến” giúp phân biệt với món đứng trước trong danh sách.
- source_word: טַבַּעַת
  choice: nhẫn
  rationale: Nghĩa cơ bản là nhẫn; không thêm ý “nhẫn ấn” vì ngữ cảnh không buộc phải hiểu như vậy.
- source_word: עָגִיל
  choice: khuyên tai
  rationale: Trong danh sách trang sức, đây là cách hiểu thông dụng và giúp phân biệt với טַבַּעַת.
- source_word: כוּמָז
  choice: đồ trang sức
  rationale: Danh tính chính xác của món đồ không chắc chắn. Dùng từ khái quát trong chính văn và bảo lưu các khả năng cụ thể ở chú thích.
- source_word: לְכַפֵּר
  choice: để làm lễ chuộc tội
  rationale: Giữ sắc thái nghi lễ-thần học của כפר trong bối cảnh lễ vật dâng trước Yahweh, nhưng không giải thích thêm cơ chế chuộc tội.
- source_word: עַל נַפְשֹׁתֵינוּ
  choice: cho chính mình
  rationale: נֶפֶשׁ ở đây chỉ bản thân, mạng sống hoặc con người của họ; cách dịch này tự nhiên và tránh áp đặt sự phân đôi linh hồn-thân thể.
theological_decisions:
- issue: Mối liên hệ giữa lễ vật và động từ כפר
  choice: Lễ vật được dâng để làm lễ chuộc tội cho những người lính trước mặt Yahweh.
  alternative: Chỉ là lễ vật tạ ơn, hoặc chỉ nhằm tránh tai họa theo nghĩa phi nghi lễ.
  rationale: Câu dùng rõ ràng כפר cùng với קָרְבַּן và cụm “trước mặt Yahweh”; vì thế cần giữ ngôn ngữ chuộc tội nhưng không xác định cơ chế vượt quá điều nguyên văn nói.
- issue: Cách thể hiện אִישׁ trong ngữ cảnh
  choice: mỗi người
  alternative: mỗi người nam
  rationale: Ngữ cảnh cho biết đây là những người nam trong quân đội; tiếng Việt dùng “mỗi người” tự nhiên mà vẫn quy chiếu rõ đến nhóm ấy, không cần lặp dấu chỉ giới tính.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “dâng ... lên” thay cho lối dịch sát “đem lại gần”; giữ “Yahweh” là tên riêng. Các thuật ngữ trang sức bất định được dịch thận trọng và chú thích rõ.
