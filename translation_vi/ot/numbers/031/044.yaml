  text: Và ba mươi sáu nghìn con bò.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/בָקָר
  choice: và ... con bò
  rationale: בָּקָר là danh từ tập hợp chỉ bò hoặc đàn bò. Trong danh sách kiểm đếm gia súc này, “con bò” đi với số lượng là cách diễn đạt tự nhiên, rõ nghĩa trong tiếng Việt; tiền tố וּ được chuyển là “và” để giữ cấu trúc nối tiếp của các câu chung quanh.
- source_word: שִׁשָּׁה וּ/שְׁלֹשִׁים אָלֶף
  choice: ba mươi sáu nghìn
  rationale: Cụm số Hê-bơ-rơ có trật tự sát chữ là “sáu và ba mươi nghìn”; chuyển thành “ba mươi sáu nghìn” theo cách nói số tự nhiên của tiếng Việt hiện đại, không thay đổi số lượng.
theological_decisions: []
