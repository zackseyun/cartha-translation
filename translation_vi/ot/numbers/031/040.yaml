  text: וְ/נֶ֣פֶשׁ אָדָ֔ם שִׁשָּׁ֥ה עָשָׂ֖ר אָ֑לֶף וּ/מִכְסָ/ם֙ לַֽ/יהוָ֔ה שְׁנַ֥יִם וּ/שְׁלֹשִׁ֖ים נָֽפֶשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/040.yaml
  text: And the persons of mankind were sixteen thousand, and their tribute for Yahweh was thirty-two persons.
translation:
  language: vi
  text: Số người là mười sáu ngàn; phần phải nộp cho Yahweh là ba mươi hai người.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נֶפֶשׁ אָדָם
  choice: người
  rationale: Trong danh sách phân chia chiến lợi phẩm, cụm này chỉ các cá nhân thuộc loài người, đối lập với súc vật. Tiếng Việt tự nhiên chỉ cần “người”, không cần dịch sát thành “linh hồn loài người”.
- source_word: שִׁשָּׁה עָשָׂר אָלֶף
  choice: mười sáu ngàn
  rationale: Cách diễn đạt số đếm trực tiếp, tự nhiên trong tiếng Việt.
- source_word: מִכְסָם
  choice: phần cống nộp
  rationale: Chỉ phần đã được ấn định từ chiến lợi phẩm để biệt riêng dâng cho Yahweh; “phần cống nộp” vừa rõ tính phân bổ vừa hợp văn cảnh.
- source_word: לַיהוָה
  choice: dành cho Yahweh
  rationale: Giới từ לְ biểu thị sự dành riêng hoặc phân bổ cho; danh riêng giao ước יהוה được phiên là “Yahweh”.
- source_word: שְׁנַיִם וּשְׁלֹשִׁים נָפֶשׁ
  choice: ba mươi hai người
  rationale: נֶפֶשׁ ở đây tiếp tục là từ đếm các cá nhân, nên dịch là “người” thay vì mang nghĩa siêu hình “linh hồn”.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Nguyên văn dùng danh giao ước יהוה. Phiên âm “Yahweh” bảo tồn tính chất danh riêng và không biến nó thành một tước hiệu.
- issue: Cách hiểu נֶפֶשׁ אָדָם
  choice: người
  alternative: linh hồn loài người; nhân mạng
  rationale: Trong ngữ cảnh kiểm đếm chiến lợi phẩm, cụm từ phân biệt con người với gia súc và chỉ số cá nhân, không đưa ra một khẳng định riêng về cấu tạo con người.
translation_notes:
  register: Văn phong hiện đại, trang trọng và gọn, phù hợp một bảng kê số lượng. Dùng “ngàn” để diễn đạt số đếm tự nhiên; dấu chấm phẩy giữ quan hệ chặt giữa tổng số người và phần được dành riêng.
