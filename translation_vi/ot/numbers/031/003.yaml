source:
  edition: WLC
  text: וַ/יְדַבֵּ֤ר מֹשֶׁה֙ אֶל הָ/עָ֣ם לֵ/אמֹ֔ר הֵחָלְצ֧וּ מֵ/אִתְּ/כֶ֛ם אֲנָשִׁ֖ים לַ/צָּבָ֑א וְ/יִהְיוּ֙ עַל מִדְיָ֔ן לָ/תֵ֥ת נִקְמַת יְהוָ֖ה בְּ/מִדְיָֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/003.yaml
  text: So Moses spoke to the people, saying, “Arm men from among you for the army, and let them go against Midian to execute Yahweh’s vengeance on Midian.”
translation:
  language: vi
  text: 'Môi-se nói với dân chúng rằng: “Hãy trang bị cho những người nam trong các ngươi để ra trận, và để họ chống lại Ma-đi-an, hầu thi hành sự báo thù của Đức Yahweh[a] trên Ma-đi-an.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “sự báo thù vì Đức Yahweh.” Cấu trúc Hê-bơ-rơ có thể chỉ sự báo thù thuộc về Đức Yahweh hoặc sự báo thù được thực hiện thay mặt Ngài.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: nói
  rationale: Động từ tường thuật mở đầu lời trực tiếp; “nói” tự nhiên và trang trọng trong tiếng Việt.
- source_word: הָעָם
  choice: dân chúng
  rationale: Chỉ cộng đồng Y-sơ-ra-ên đang được Môi-se truyền lệnh.
- source_word: הֵחָלְצוּ
  choice: hãy trang bị
  rationale: Trong ngữ cảnh quân sự, động từ diễn tả việc chuẩn bị và trang bị để chiến đấu; cách dịch này không thu hẹp nghĩa chỉ còn cầm vũ khí.
- source_word: מֵאִתְּכֶם אֲנָשִׁים
  choice: những người nam trong các ngươi
  rationale: Giữ cả ý tuyển chọn từ trong cộng đồng và nét nghĩa giống đực của אֲנָשִׁים trong bối cảnh quân sự.
- source_word: לַצָּבָא
  choice: để ra trận
  rationale: צָבָא ở đây nói đến việc tham gia chiến dịch quân sự; “để ra trận” tự nhiên hơn lối dịch cứng “cho quân đội”.
- source_word: וְיִהְיוּ עַל־מִדְיָן
  choice: họ sẽ chống lại dân Ma-đi-an
  rationale: Thành ngữ היה על trong ngữ cảnh thù địch diễn tả việc đối đầu với Ma-đi-an; không thêm chi tiết cụ thể hơn như “tấn công”.
- source_word: לָתֵת נִקְמַת
  choice: để thi hành sự báo thù
  rationale: לָתֵת theo nghĩa đen là “ban/đặt”, nhưng khi đi với נִקְמַת mang nghĩa thực hiện hay giáng sự báo thù.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng cách phiên âm danh riêng của Đức Chúa Trời đã quen thuộc và trang trọng trong tiếng Việt, thay vì thay bằng một tước hiệu.
- source_word: בְּמִדְיָן
  choice: trên dân Ma-đi-an
  rationale: Giữ Ma-đi-an là đối tượng chịu sự báo thù, đồng thời phân biệt dân tộc với địa danh bằng từ “dân” theo ngữ cảnh.
theological_decisions:
- issue: Quan hệ sở hữu hoặc đại diện trong נִקְמַת יְהוָה
  choice: sự báo thù của Đức Giê-hô-va
  alternative: sự báo thù vì Đức Giê-hô-va
  rationale: Cấu trúc liên kết có thể chỉ sự báo thù thuộc về Đức Giê-hô-va hoặc được thực hiện vì Ngài. Bản chính giữ cách hiểu tự nhiên hơn bằng “của”, còn chú thích bảo tồn khả năng kia.
- issue: Bạo lực và sự báo thù trong bối cảnh chiến tranh
  choice: giữ nguyên “thi hành sự báo thù”
  alternative: trừng phạt
  rationale: Không làm nhẹ nét nghĩa nghiêm khắc của נְקָמָה và không thêm một lời giải thích thần học ngoài văn bản.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ tên riêng theo lối phiên âm Kinh Thánh tiếng Việt quen thuộc; câu mệnh lệnh quân sự được diễn đạt tự nhiên nhưng không giảm nhẹ tính khắc nghiệt của nguyên văn.
