source:
  edition: WLC
  text: וְ/אַתֶּ֗ם חֲנ֛וּ מִ/ח֥וּץ לַֽ/מַּחֲנֶ֖ה שִׁבְעַ֣ת יָמִ֑ים כֹּל֩ הֹרֵ֨ג נֶ֜פֶשׁ וְ/כֹ֣ל נֹגֵ֣עַ בֶּֽ/חָלָ֗ל תִּֽתְחַטְּא֞וּ בַּ/יּ֤וֹם הַ/שְּׁלִישִׁי֙ וּ/בַ/יּ֣וֹם הַ/שְּׁבִיעִ֔י אַתֶּ֖ם וּ/שְׁבִי/כֶֽם׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/019.yaml
  text: And you[a], camp outside the camp for seven days. Everyone who has killed a person, and everyone who has touched one slain, shall purify yourselves on the third day and on the seventh day—you and your captives.
translation:
  language: vi
  text: 'Còn anh em, hãy đóng trại bên ngoài trại trong bảy ngày. Bất cứ ai đã giết một người hoặc đã chạm vào người bị giết[a] đều phải tự thanh tẩy vào ngày thứ ba và ngày thứ bảy: cả anh em lẫn những người bị anh em bắt.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “thi thể của người bị giết.” Nguyên văn Hê-bơ-rơ nói đến “người bị giết”; trong ngữ cảnh này, cụm từ hàm ý việc chạm vào xác chết và sự ô uế theo nghi lễ.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲנוּ
  choice: hãy đóng trại
  rationale: Động từ mệnh lệnh số nhiều חנה chỉ việc đóng trại hoặc lưu lại tại nơi đóng trại; cách dịch này tự nhiên và phù hợp bối cảnh quân sự.
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: bên ngoài trại quân
  rationale: Diễn đạt rõ vị trí ở ngoài khu trại; “trại quân” giúp phân biệt nơi đóng quân với hành động “đóng trại” trong cùng câu.
- source_word: שִׁבְעַת יָמִים
  choice: trong bảy ngày
  rationale: Cụm từ chỉ khoảng thời gian kéo dài; “trong” là cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: כֹּל הֹרֵג נֶפֶשׁ
  choice: bất cứ ai đã giết một người
  rationale: נֶפֶשׁ ở đây chỉ một con người, không phải “linh hồn”; phân từ mang ý nghĩa hành động đã xảy ra trong trận chiến vừa qua.
- source_word: וְכֹל נֹגֵעַ בֶּחָלָל
  choice: và bất cứ ai đã chạm vào người bị giết
  rationale: חָלָל chỉ người bị giết do bạo lực và trong ngữ cảnh bao hàm thi thể của người ấy; cách dịch giữ cách quy chiếu đến con người mà không làm mất hàm ý tiếp xúc với xác chết.
- source_word: תִּתְחַטְּאוּ
  choice: đều phải thanh tẩy mình
  rationale: Dạng Hitpael của חטא trong ngữ cảnh này nói về nghi thức thanh tẩy khỏi ô uế; “phải” thể hiện tính bắt buộc của chỉ thị.
- source_word: בַּיּוֹם הַשְּׁלִישִׁי וּבַיּוֹם הַשְּׁבִיעִי
  choice: vào ngày thứ ba và ngày thứ bảy
  rationale: Giữ nguyên hai mốc thời gian cụ thể của quy định nghi lễ.
- source_word: אַתֶּם וּשְׁבִיכֶם
  choice: cả anh em lẫn những người bị anh em bắt làm tù binh
  rationale: שְׁבִי chỉ những người bị bắt trong chiến tranh; cách diễn đạt này rõ nghĩa và phù hợp bối cảnh.
theological_decisions:
- issue: Bản chất của việc thanh tẩy sau khi giết người hoặc chạm vào người bị giết
  choice: nghi thức thanh tẩy khỏi sự ô uế do tiếp xúc với người chết
  alternative: sự tẩy sạch về đạo đức khỏi tội làm đổ máu
  rationale: Động từ תתחטאו cùng các mốc ngày thứ ba và ngày thứ bảy hướng đến thủ tục thanh tẩy nghi lễ liên quan đến sự ô uế do người chết, chứ không chủ yếu nói về sự tha thứ hay thanh tẩy tội lỗi đạo đức.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” cho đại từ số nhiều hướng đến cộng đồng; dùng “thanh tẩy” để giữ sắc thái nghi lễ, tránh hiểu thành sự cải thiện đạo đức chung chung.
