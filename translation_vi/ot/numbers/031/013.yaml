base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/013.yaml
  text: Then Moses[a], Eleazar the priest, and all the leaders of the congregation went out to meet them outside the camp.
translation:
  language: vi
  text: Bấy giờ, Môi-se, thầy tế lễ Ê-lê-a-sa và tất cả các thủ lãnh của hội chúng[a] đi ra ngoài trại để đón họ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “các thủ lĩnh của cộng đồng.”'
    reason: Giữ lại một cách diễn đạt thay thế cho נְשִׂיאֵי הָעֵדָה, chỉ những người đứng đầu hoặc đại diện được công nhận của hội chúng.
lexical_decisions:
- source_word: וַיֵּצְאוּ
  choice: đi ra
  rationale: Động từ יצא diễn tả sự di chuyển từ bên trong ra ngoài; “đi ra” tự nhiên trong mạch kể tiếng Việt và giữ được hướng chuyển động.
- source_word: אֶלְעָזָר הַכֹּהֵן
  choice: thầy tế lễ Ê-lê-a-sa
  rationale: Cụm danh từ xác định chức vụ của Ê-lê-a-sa; đặt chức danh trước tên là cách diễn đạt tự nhiên, trang trọng trong tiếng Việt.
- source_word: כָל נְשִׂיאֵי הָעֵדָה
  choice: tất cả các thủ lãnh của hội chúng
  rationale: נְשִׂיאֵי chỉ những người đứng đầu được công nhận trong cộng đồng, không nhất thiết mang nghĩa hoàng gia; “thủ lãnh” giữ sắc thái chức vị, còn “hội chúng” phù hợp với cộng đồng Israel trong sách Dân Số.
- source_word: לִקְרָאתָם
  choice: đón họ
  rationale: Trong ngữ cảnh một đoàn trở về, “đón họ” diễn đạt tự nhiên mục đích đi ra gặp đoàn người, đồng thời không hàm ý thêm về thái độ của cuộc gặp.
- source_word: אֶל מִחוּץ לַמַּחֲנֶה
  choice: ở bên ngoài trại
  rationale: Cụm từ chỉ địa điểm cuộc gặp nằm ngoài ranh giới trại; cách dịch này rõ nghĩa và tự nhiên trong tiếng Việt.
