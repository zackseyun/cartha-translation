translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng và dễ hiểu. Dùng “thầy tế lễ” theo lối gọi quen thuộc trong văn liệu Kinh Thánh tiếng Việt; tên riêng được phiên âm rõ ràng. Dấu chú thích được đặt ngay sau cụm từ mà chú thích giải nghĩa.
