  text: and the persons of mankind were sixteen thousand.
translation:
  language: vi
  text: còn người là mười sáu ngàn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ theo sát chữ: “và sinh mạng người, mười sáu ngàn.” Trong văn cảnh kiểm kê này, cụm từ ấy chỉ từng người được đếm, không nhấn mạnh linh hồn phi vật chất.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/נֶפֶשׁ אָדָם
  choice: còn số người
  rationale: Trong bản kê chiến lợi phẩm này, נֶפֶשׁ אָדָם chỉ những con người được đếm, đối lập với súc vật trong văn cảnh; dịch là “số người” tự nhiên và chính xác hơn “linh hồn người.” Liên từ וְ được thể hiện bằng “còn,” phù hợp với sự chuyển sang mục kế tiếp trong danh sách.
- source_word: שִׁשָּׁה עָשָׂר אָלֶף
  choice: mười sáu ngàn
  rationale: Cụm số Hê-bơ-rơ chỉ chính xác 16.000; “mười sáu ngàn” là cách diễn đạt rõ ràng, tự nhiên trong tiếng Việt hiện đại.
