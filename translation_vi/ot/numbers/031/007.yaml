source:
  edition: WLC
  text: וַֽ/יִּצְבְּאוּ֙ עַל מִדְיָ֔ן כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶׁ֑ה וַ/יַּֽהַרְג֖וּ כָּל זָכָֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/007.yaml
  text: So they waged war against Midian[a], just as Yahweh had commanded Moses, and they killed every male.
translation:
  language: vi
  text: Họ giao chiến với dân Ma-đi-an[a], đúng như Yahweh đã truyền cho Môi-se, và họ giết tất cả người nam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Họ tiến đánh dân Ma-đi-an.” Động từ Hê-bơ-rơ có thể chỉ việc tham gia quân ngũ hoặc tiến hành chiến trận.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּצְבְּאוּ
  choice: họ giao chiến
  rationale: Động từ צבא ở đây chỉ việc tham gia hoạt động quân sự, tiến hành chiến trận. “Giao chiến” tự nhiên trong tiếng Việt và giữ được sắc thái quân sự mà không thu hẹp thành một hành động đơn lẻ.
- source_word: עַל
  choice: với
  rationale: Sau động từ “giao chiến”, tiếng Việt tự nhiên dùng “với” để biểu thị đối phương; toàn cụm vẫn mang nghĩa thù địch của עַל trong ngữ cảnh quân sự.
- source_word: מִדְיָן
  choice: dân Ma-đi-an
  rationale: Trong ngữ cảnh này, tên riêng chỉ cộng đồng bị tấn công. Thêm “dân” làm rõ đối tượng là người Ma-đi-an, phù hợp với mệnh đề tiếp theo nói về việc giết người nam.
- source_word: כַּאֲשֶׁר
  choice: đúng như
  rationale: Diễn tả sự tương ứng chính xác giữa hành động và mệnh lệnh đã ban, bằng cách nói tự nhiên trong tiếng Việt hiện đại.
- source_word: צִוָּה
  choice: đã truyền
  rationale: “Truyền” là cách diễn đạt trang trọng, tự nhiên cho việc ban mệnh lệnh; “đã” cho thấy mệnh lệnh có trước hành động.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm trực tiếp danh riêng giao ước יהוה thay vì thay bằng một tước hiệu.
- source_word: אֶת מֹשֶׁה
  choice: cho Môi-se
  rationale: אֶת đánh dấu Môi-se là đối tượng trực tiếp của động từ “truyền”; trong tiếng Việt, cấu trúc tự nhiên là “truyền cho Môi-se”.
- source_word: וַיַּהַרְגוּ
  choice: và họ giết
  rationale: הרג có nghĩa trực tiếp là giết; cách dịch này không làm nhẹ hoặc tăng thêm sắc thái của nguyên văn.
- source_word: כָּל זָכָר
  choice: tất cả người nam
  rationale: זָכָר chỉ giới tính nam, không tự giới hạn ở đàn ông trưởng thành. “Người nam” giữ phạm vi rộng ấy rõ hơn “đàn ông”.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC CHÚA / Giê-hô-va
  rationale: Nguyên văn dùng danh riêng יהוה. Giữ “Yahweh” bảo toàn tư cách danh riêng thay vì thay bằng tước hiệu hoặc dùng một dạng phiên âm khác.
- issue: Phạm vi giới tính và độ tuổi của זָכָר
  choice: người nam
  alternative: đàn ông
  rationale: זָכָר xác định giới tính nam nhưng không tự nó giới hạn ở người trưởng thành; “đàn ông” sẽ thu hẹp phạm vi của nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và trực tiếp. “Giao chiến” giữ sắc thái quân sự; “người nam” tránh thu hẹp זָכָר thành đàn ông trưởng thành. Dấu chú thích [a] được đặt ngay sau cụm từ liên quan.
