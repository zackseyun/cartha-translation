  to: Vậy bây giờ, hãy giết mọi bé trai trong đám trẻ nhỏ, và giết mọi phụ nữ đã ăn nằm với một người đàn ông[a].
  rationale: Chỉnh nhẹ để chú thích được neo đúng vào thành ngữ tình dục mà nó giải thích, và để phản ánh rõ hơn danh từ số ít אִישׁ. Không làm giảm nhẹ mệnh lệnh bạo lực, không thêm diễn giải lịch sử hay giáo lý, và vẫn giữ sắc thái tự nhiên của tiếng Việt hiện đại.
