  edition: WLC
  text: וְ/עַתָּ֕ה הִרְג֥וּ כָל זָכָ֖ר בַּ/טָּ֑ף וְ/כָל אִשָּׁ֗ה יֹדַ֥עַת אִ֛ישׁ לְ/מִשְׁכַּ֥ב זָכָ֖ר הֲרֹֽגוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/017.yaml
  text: So now[a], kill every male among the little ones, and kill every woman who has known a man by lying with him.
translation:
  language: vi
  text: Vậy bây giờ, hãy giết mọi bé trai trong đám trẻ nhỏ, và giết mọi phụ nữ đã ăn nằm với một người đàn ông[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hê-bơ-rơ: “đã biết một người đàn ông qua việc nằm với nam giới,” một thành ngữ chỉ quan hệ tình dục.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Vậy bây giờ
  rationale: Diễn đạt cả ý chuyển tiếp của וְ và tính tức thời của עַתָּה bằng lối nói tự nhiên trong tiếng Việt.
- source_word: הִרְגוּ / הֲרֹגוּ
  choice: hãy giết
  rationale: Mệnh lệnh của הרג trực tiếp và mạnh; “hãy giết” giữ nguyên mức độ gay gắt, không nói giảm.
- source_word: כָל זָכָר בַּטָּף
  choice: mọi bé trai trong số trẻ nhỏ
  rationale: זָכָר chỉ giới tính nam, còn טַף chỉ trẻ nhỏ hoặc người phụ thuộc; trong ngữ cảnh này, “bé trai trong số trẻ nhỏ” tự nhiên và rõ nghĩa hơn cách dịch cứng là “mọi giống đực”.
- source_word: כָל אִשָּׁה
  choice: mọi phụ nữ
  rationale: אִשָּׁה ở đây chỉ phụ nữ nói chung, không nhất thiết là người vợ.
- source_word: יֹדַעַת אִישׁ לְמִשְׁכַּב זָכָר
  choice: đã ăn nằm với đàn ông
  rationale: Cụm Hê-bơ-rơ dùng “biết” theo nghĩa quan hệ tình dục và được làm rõ bằng thành ngữ về việc nằm với nam giới. “Ăn nằm với đàn ông” truyền đạt đúng nghĩa, tự nhiên và trang trọng vừa phải trong tiếng Việt hiện đại.
theological_decisions:
- issue: Chuyển ngữ một mệnh lệnh chiến tranh khó khăn về mặt đạo đức mà không làm nhẹ hoặc diễn giải thêm
  choice: Dịch mệnh lệnh thẳng và giữ nguyên tính khốc liệt của câu
  alternative: Dùng cách nói giảm như “xử tử” hoặc thêm lời giải thích về hoàn cảnh lịch sử vào chính văn
  rationale: Nguyên văn đưa ra mệnh lệnh trực tiếp. Bản dịch không nên làm dịu sức nặng của câu hay chèn bình luận đạo đức vào chính văn.
- issue: Thành ngữ tình dục trong יֹדַעַת אִישׁ לְמִשְׁכַּב זָכָר
  choice: Diễn đạt nghĩa thành ngữ là “đã ăn nằm với đàn ông”
  alternative: Dịch sát hình thức là “đã biết đàn ông qua việc nằm với nam giới”
  rationale: Dịch sát từng chữ sẽ tối nghĩa và thiếu tự nhiên trong tiếng Việt; cách chọn giữ đúng nội dung tình dục mà không thêm mức độ chi tiết ngoài nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trực tiếp và trang nghiêm. Không nói giảm mệnh lệnh bạo lực; thành ngữ tình dục được chuyển sang cách nói tiếng Việt tự nhiên. Dấu chú thích [a] đặt ngay sau cụm từ mà chú thích giải thích.
