source:
  edition: WLC
  text: נְקֹ֗ם נִקְמַת֙ בְּנֵ֣י יִשְׂרָאֵ֔ל מֵ/אֵ֖ת הַ/מִּדְיָנִ֑ים אַחַ֖ר תֵּאָסֵ֥ף אֶל עַמֶּֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/002.yaml
  text: Take vengeance for the sons of Israel on the Midianites[b][a]. Afterward you will be gathered to your people.
translation:
  language: vi
  text: “Hãy báo thù cho dân Israel trên người Midian.[a] Sau đó, con sẽ được quy về với dân mình.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Hãy trả thù người Midian vì dân Israel.” Sát nghĩa tiếng Hê-bơ-rơ: “Hãy báo mối thù của con cái Israel trên người Midian.”'
    reason: lexical_alternative
  - marker: b
    text: “Được quy về với dân mình” là một thành ngữ Hê-bơ-rơ chỉ sự chết.
    reason: cultural_note
lexical_decisions:
- source_word: נְקֹם נִקְמַת
  choice: Hãy báo thù
  rationale: Động từ mệnh lệnh và danh từ cùng gốc tạo cấu trúc nhấn mạnh trong tiếng Hê-bơ-rơ. Tiếng Việt tự nhiên gộp lại thành “hãy báo thù”, vẫn giữ nguyên lực của mệnh lệnh.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: con dân Israel
  rationale: Chỉ cộng đồng người Israel trong tư cách dân giao ước. “Con dân Israel” vừa phản ánh quan hệ dòng dõi trong nguyên ngữ, vừa tự nhiên hơn “các con trai Israel” trong tiếng Việt hiện đại.
- source_word: מֵאֵת הַמִּדְיָנִים
  choice: nơi người Midian
  rationale: Trong kết hợp với נקם, cụm giới từ xác định đối tượng phải chịu sự báo thù. “Nơi người Midian” giữ sắc thái trang trọng và không làm cụm này bị hiểu là nguồn gốc của sự báo thù.
- source_word: אַחַר
  choice: Sau đó
  rationale: Diễn đạt rõ trình tự thời gian của sự việc kế tiếp.
- source_word: תֵּאָסֵף אֶל עַמֶּיךָ
  choice: con sẽ được quy về với dân mình
  rationale: Giữ hình ảnh bị động của thành ngữ Hê-bơ-rơ về cái chết, thay vì diễn giải thẳng thành “con sẽ chết”. “Quy về” tự nhiên và trang trọng trong tiếng Việt, còn “với dân mình” tránh thu hẹp nghĩa thành riêng tổ tiên.
theological_decisions:
- issue: Thành ngữ chỉ cái chết sắp đến của Môi-se
  choice: Giữ thành ngữ “con sẽ được quy về với dân mình”.
  alternative: “Sau đó, con sẽ chết” hoặc “con sẽ được quy về với tổ tiên mình”.
  rationale: Cách dịch giữ nguyên hình ảnh và độ mở thần học của nguyên văn, không biến thành ngữ thành một phát biểu cụ thể hơn về tình trạng sau khi chết.
- issue: Chủ thể và hướng của sự báo thù
  choice: Hiểu đây là mệnh lệnh báo thù thay cho con dân Israel, nhắm vào người Midian.
  alternative: “Hãy trả mối thù của con dân Israel từ người Midian.”
  rationale: Ngữ pháp với נקם cho thấy người Midian là đối tượng chịu sự báo thù; tuy nhiên, cấu trúc nguyên văn khác với cú pháp tiếng Việt nên ghi nhận dạng sát chữ trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “con” vì Đức Chúa Trời đang trực tiếp phán với Môi-se; giữ địa danh/tộc danh “Israel” và “Midian” theo dạng quốc tế quen thuộc. Các dấu chú thích [a], [b] đều xuất hiện trong câu chính.
