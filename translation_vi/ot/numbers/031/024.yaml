  source_fidelity: 'Bản dịch giữ đúng các thành phần chính của tiếng Hê-bơ-rơ: giặt y phục vào ngày thứ bảy, đạt tình trạng thanh sạch theo nghi thức, rồi mới vào trại. Tuy nhiên, “mới được” nhấn mạnh điều kiện/quyền phép mạnh hơn hình thức đơn giản “sẽ vào” của nguyên văn, dù sắc thái này có cơ sở trong ngữ cảnh. Cách diễn đạt “sau đó anh em được vào trại” vẫn chuyển tải hợp lý hàm ý cho phép mà ít thêm sắc thái hơn.'
