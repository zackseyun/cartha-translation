source:
  edition: WLC
  text: וְ/כִבַּסְתֶּ֧ם בִּגְדֵי/כֶ֛ם בַּ/יּ֥וֹם הַ/שְּׁבִיעִ֖י וּ/טְהַרְתֶּ֑ם וְ/אַחַ֖ר תָּבֹ֥אוּ אֶל הַֽ/מַּחֲנֶֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/024.yaml
  text: You shall wash your clothes on the seventh day[a], and you shall be clean[b]; afterward you may come into the camp.
translation:
  language: vi
  text: Vào ngày thứ bảy, anh em phải giặt quần áo của anh em và sẽ trở nên thanh sạch[a]; sau đó anh em được vào trại[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “sẽ được thanh tẩy.” Từ Hê-bơ-rơ ở đây nói đến việc trở nên thanh sạch theo nghi thức sau khi đã giặt theo quy định.'
    reason: lexical_alternative
  - marker: b
    text: 'Hoặc: “sẽ vào trại.” Trong ngữ cảnh này, việc trở vào trại được phép sau khi quá trình làm cho thanh sạch đã hoàn tất.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִבַּסְתֶּם
  choice: anh em phải giặt
  rationale: Thể Piel của כבס chỉ việc giặt quần áo hoặc vải. Trong ngữ cảnh mệnh lệnh, “phải giặt” diễn đạt tự nhiên tính bắt buộc của chỉ thị.
- source_word: בִּגְדֵיכֶם
  choice: quần áo mình
  rationale: בגד chỉ y phục. “Quần áo mình” là cách nói hiện đại, tự nhiên và giữ đúng ngôi số nhiều hướng đến người nghe.
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: Ngày thứ bảy
  rationale: Diễn đạt trực tiếp cụm thời gian Hê-bơ-rơ bằng cách nói thông dụng trong tiếng Việt.
- source_word: וּטְהַרְתֶּם
  choice: rồi anh em sẽ thanh sạch
  rationale: 'Qal của טהר ở đây mang nghĩa nội động/kết quả: sau việc giặt theo quy định, họ ở trong tình trạng thanh sạch về nghi thức. “Sẽ thanh sạch” tránh biến động từ thành một hành động phản thân.'
- source_word: וְאַחַר
  choice: sau đó
  rationale: 'Giữ rõ trình tự: việc trở nên thanh sạch phải hoàn tất trước khi trở lại trại.'
- source_word: תָּבֹאוּ אֶל הַמַּחֲנֶה
  choice: anh em mới được vào trại
  rationale: בוא אל có nghĩa là đi/vào một nơi. Trong quy định thanh sạch này, mệnh đề hàm ý chỉ sau khi thanh sạch họ mới được phép vào lại trại; “mới được vào” diễn đạt tự nhiên sắc thái ấy.
theological_decisions:
- issue: Ngôn ngữ về sự thanh sạch theo nghi thức
  choice: thanh sạch
  alternative: được thanh tẩy; tự thanh tẩy
  rationale: Câu này nói về việc phục hồi tình trạng thanh sạch theo nghi thức sau chiến trận. “Thanh sạch” giữ ngôn ngữ chỉ trạng thái của nguyên văn, không tự động biến nó thành sự thanh tẩy về đạo đức hay tâm linh; đồng thời không gán cho động từ sắc thái phản thân không rõ trong thể Qal.
- issue: Sắc thái của việc trở vào trại
  choice: mới được vào trại
  alternative: sẽ vào trại
  rationale: Nguyên văn có hình thức đơn giản “sẽ vào”, nhưng trong mạch luật lệ, việc vào trại chỉ được phép sau khi hoàn tất sự thanh sạch. Bản dịch nêu rõ quan hệ điều kiện về thời điểm mà không thêm một nghi thức mới.
translation_notes:
  register: Dùng tiếng Việt hiện đại, trang trọng và dễ hiểu. Đại từ “anh em” truyền đạt ngôi thứ hai số nhiều mà không mang sắc thái cổ kính của “các ngươi.” “Thanh sạch” được chọn để phân biệt tình trạng nghi thức với sự sạch sẽ thông thường.
