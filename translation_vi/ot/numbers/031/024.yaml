  terminology: “Thanh sạch” là thuật ngữ phù hợp cho tình trạng thanh sạch theo nghi thức và tránh đồng nhất với sự sạch sẽ thông thường hoặc sự thanh tẩy đạo đức/tâm linh. “Trại” phù hợp với הַמַּחֲנֶה.
