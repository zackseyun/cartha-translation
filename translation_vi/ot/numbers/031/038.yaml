  text: And the cattle were thirty-six thousand, and their tribute for the LORD was seventy-two.
translation:
  language: vi
  text: Có ba mươi sáu ngàn con bò; phần phải nộp cho Đức Giê-hô-va là bảy mươi hai con.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַבָּקָר
  choice: số bò
  rationale: בָּקָר là danh từ tập hợp chỉ gia súc thuộc loài bò; trong bảng kiểm kê chiến lợi phẩm này, “số bò” tự nhiên và chính xác hơn từ rộng nghĩa “gia súc”.
- source_word: שִׁשָּׁה וּשְׁלֹשִׁים אָלֶף
  choice: ba mươi sáu ngàn
  rationale: Chuyển trật tự số đếm Hê-bơ-rơ sang cách nói thông dụng trong tiếng Việt hiện đại.
- source_word: מִכְסָם
  choice: phần cống nộp từ số ấy
  rationale: מֶכֶס ở đây là phần được ấn định và trích ra từ chiến lợi phẩm; “phần cống nộp” giữ được ý nghĩa một phần phải nộp, còn “từ số ấy” diễn đạt hậu tố sở hữu số nhiều theo cách rõ nghĩa trong tiếng Việt.
- source_word: לַיהוָה
  choice: dành cho Đức Giê-hô-va
  rationale: לְ chỉ phần được dành hoặc quy thuộc cho YHWH. “Dành cho” phù hợp với ngữ cảnh phân chia, còn “Đức Giê-hô-va” là cách phiên âm danh riêng đã quen thuộc trong tiếng Việt.
- source_word: שְׁנַיִם וְשִׁבְעִים
  choice: bảy mươi hai con
  rationale: Dùng trật tự số đếm tiếng Việt hiện đại và thêm loại từ “con” để câu tự nhiên, đồng thời làm rõ số này vẫn chỉ số bò.
theological_decisions:
- issue: Cách dịch danh thần יהוה
  choice: Đức Giê-hô-va
  alternative: Yahweh; CHÚA
  rationale: Nguyên văn dùng trực tiếp danh riêng giao ước יהוה. “Đức Giê-hô-va” giữ dạng danh riêng và là cách gọi quen thuộc, trang trọng trong tiếng Việt; không thay bằng danh xưng chung vốn có thể che khuất việc nguyên văn nêu danh riêng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ cấu trúc kiểm kê của câu, dùng “con” làm loại từ cho bò và tránh lối dịch máy móc theo trật tự số đếm Hê-bơ-rơ.
