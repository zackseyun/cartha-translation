  to: Họ đem những người bị bắt, của chiếm được và chiến lợi phẩm đến với Môi-se, thầy tế lễ Ê-lê-a-sa và hội chúng con dân Y-sơ-ra-ên, ở trại quân trên đồng bằng Mô-áp[a], bên sông Giô-đanh, ngang Giê-ri-cô.[b]
