  source_fidelity: Bản dịch phản ánh đúng động từ Hiphil “đem”, ba hạng mục được đem về, các nhân vật/nhóm tiếp nhận và địa điểm. Tuy nhiên, “đến chỗ ... , tại trại quân” làm quan hệ cú pháp giữa những người tiếp nhận và địa điểm hơi lỏng; “đến với ... , ở trại quân” diễn đạt rõ hơn hai cụm đích liên tiếp của tiếng Hê-bơ-rơ. “Của chiếm được” giữ được sự phân biệt với “chiến lợi phẩm”.
  naturalness: Văn phong nhìn chung tự nhiên, trang trọng và dễ hiểu. Cần chỉnh nhẹ cấu trúc giới từ để câu tiếng Việt mạch lạc hơn, không khiến “tại trại quân” có vẻ chỉ bổ nghĩa riêng cho “hội chúng”.
