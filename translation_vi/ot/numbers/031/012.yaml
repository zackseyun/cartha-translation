  text: וַ/יָּבִ֡אוּ אֶל מֹשֶׁה֩ וְ/אֶל אֶלְעָזָ֨ר הַ/כֹּהֵ֜ן וְ/אֶל עֲדַ֣ת בְּנֵֽי יִשְׂרָאֵ֗ל אֶת הַ/שְּׁבִ֧י וְ/אֶת הַ/מַּלְק֛וֹחַ וְ/אֶת הַ/שָּׁלָ֖ל אֶל הַֽ/מַּחֲנֶ֑ה אֶל עַֽרְבֹ֣ת מוֹאָ֔ב אֲשֶׁ֖ר עַל יַרְדֵּ֥ן יְרֵחֽוֹ־־־־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/012.yaml
  text: And they brought the captives[a], the prey, and the spoil to Moses, to Eleazar the priest, and to the congregation of the sons of Israel, to the camp on the plains of Moab[c][b], which are by the Jordan at Jericho.
translation:
  language: vi
  text: Họ đem những người bị bắt, của chiếm được và chiến lợi phẩm đến với Môi-se, thầy tế lễ Ê-lê-a-sa và hội chúng con dân Y-sơ-ra-ên, ở trại quân trên đồng bằng Mô-áp[a], bên sông Giô-đanh, ngang Giê-ri-cô.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “vùng thảo nguyên Mô-áp.”
    reason: lexical_alternative
  - marker: b
    text: Cụm tiếng Hê-bơ-rơ cũng có thể được hiểu là “bên sông Giô-đanh, đối diện Giê-ri-cô” hoặc “bên sông Giô-đanh tại Giê-ri-cô.”
    reason: geographical_ambiguity
lexical_decisions:
- source_word: וַיָּבִאוּ
  choice: Họ đem
  rationale: Dạng Hiphil của בוא mang nghĩa khiến đến, tức là “đem”; các tân ngữ theo sau xác nhận nghĩa này.
- source_word: הַשְּׁבִי
  choice: những người bị bắt
  rationale: Trong bối cảnh chiến tranh, từ này chỉ những người bị bắt giữ, không phải trạng thái trừu tượng “sự lưu đày”; cách diễn đạt này cũng bao quát phụ nữ và trẻ em trong văn cảnh.
- source_word: הַמַּלְקוֹחַ
  choice: của chiếm được
  rationale: Từ này chỉ những gì thu được khi đánh chiếm, có thể gồm tài sản hoặc súc vật. Cách dịch được giữ riêng với הַשָּׁלָל để phản ánh hai thuật ngữ gần nghĩa trong tiếng Hê-bơ-rơ.
- source_word: הַשָּׁלָל
  choice: chiến lợi phẩm
  rationale: Đây là thuật ngữ thông dụng chỉ của cải lấy được trong chiến tranh; “chiến lợi phẩm” rõ nghĩa và trang trọng trong tiếng Việt hiện đại.
- source_word: עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: hội chúng con dân Y-sơ-ra-ên
  rationale: עֵדָה là cộng đồng được quy tụ; “con dân Y-sơ-ra-ên” truyền đạt tự nhiên ý nghĩa tập thể của בְּנֵי יִשְׂרָאֵל mà không khiến độc giả hiểu là chỉ nam giới.
- source_word: אֶל הַמַּחֲנֶה
  choice: tại trại quân
  rationale: Trong cấu trúc tiếng Việt, cụm này xác định nơi họ đem các chiến lợi phẩm đến. “Trại quân” thể hiện rõ đây là doanh trại trong bối cảnh quân sự mà không nhất thiết khẳng định họ đã đi sâu vào bên trong.
- source_word: עַרְבֹת מוֹאָב
  choice: đồng bằng Mô-áp
  rationale: Đây là cách gọi địa lý rõ ràng, quen thuộc; địa hình cũng có thể được mô tả là vùng thảo nguyên.
- source_word: אֲשֶׁר עַל יַרְדֵּן יְרֵחוֹ
  choice: bên sông Giô-đanh, ngang Giê-ri-cô
  rationale: Cách dịch xác định đồng bằng Mô-áp ở bên sông Giô-đanh, tại vị trí ngang với Giê-ri-cô, đồng thời không làm mất tính cô đọng của cụm tiếng Hê-bơ-rơ.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “hội chúng” cho cộng đồng được quy tụ; dùng “con dân Y-sơ-ra-ên” thay vì cách dịch sát chữ dễ bị hiểu là chỉ những người con trai. Ba nhóm chiến lợi phẩm được diễn đạt bằng ba cụm riêng để giữ cấu trúc liệt kê của nguyên văn.
