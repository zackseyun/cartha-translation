  source_fidelity: 'Bản dịch chuyển tải đầy đủ cấu trúc và các thành phần chính của câu Hê-bơ-rơ: chủ thể “Con cái Y-sơ-ra-ên”; việc bắt phụ nữ Ma-đi-an và con nhỏ của họ làm tù binh; và việc cướp đoạt toàn bộ súc vật, đàn gia súc, cùng của cải. “Bắt ... làm tù binh” phản ánh chính xác שׁבה đối với người; “cướp lấy” giữ được sắc thái lấy chiến lợi phẩm của בזז.'
  naturalness: Văn câu rõ ràng, trang trọng và phù hợp tiếng Việt hiện đại. Cụm “Con cái Y-sơ-ra-ên” là lối dùng Kinh Thánh đã quen thuộc và trong ngữ cảnh không bị hiểu là chỉ trẻ em, nhất là khi theo sau là hành động quân sự. Sự song hành “tất cả súc vật, mọi đàn gia súc” có phần chồng lấn về nghĩa nhưng phản ánh sự liệt kê có chủ ý của nguyên ngữ.
  terminology: Tên riêng “Y-sơ-ra-ên” và “Ma-đi-an” nhất quán với chính tả Kinh Thánh Việt ngữ. “Phụ nữ,” “con nhỏ,” “súc vật,” “đàn gia súc,” và “của cải” là những lựa chọn phù hợp cho נשים, טף, בהמה, מקנה, và חיל. Không có vấn đề thần học hoặc giáo phái cần điều chỉnh.
