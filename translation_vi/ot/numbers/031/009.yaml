  text: וַ/יִּשְׁבּ֧וּ בְנֵי יִשְׂרָאֵ֛ל אֶת נְשֵׁ֥י מִדְיָ֖ן וְ/אֶת טַפָּ֑/ם וְ/אֵ֨ת כָּל בְּהֶמְתָּ֧/ם וְ/אֶת כָּל מִקְנֵ/הֶ֛ם וְ/אֶת כָּל חֵילָ֖/ם בָּזָֽזוּ־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/009.yaml
  text: The sons of Israel took captive the women of Midian and their little ones[a], and plundered all their livestock, all their herds[c][b], and all their wealth.
translation:
  language: vi
  text: Con cái Y-sơ-ra-ên bắt phụ nữ Ma-đi-an và con nhỏ của họ làm tù binh, rồi cướp lấy tất cả súc vật, mọi đàn gia súc và toàn bộ của cải của họ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁבּוּ
  choice: bắt ... làm tù binh
  rationale: Diễn đạt đúng nghĩa động từ שׁבה ở thể Qal là bắt người làm tù binh, đồng thời tự nhiên trong tiếng Việt.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: Con cái Y-sơ-ra-ên
  rationale: Giữ hình ảnh của thành ngữ Hê-bơ-rơ בן + tên riêng; trong tiếng Việt Kinh Thánh, “con cái” chỉ các hậu duệ/dân tộc nói chung chứ không riêng trẻ em.
- source_word: נְשֵׁי מִדְיָן
  choice: phụ nữ Ma-đi-an
  rationale: נָשִׁים ở đây chỉ phụ nữ nói chung, không nhất thiết là những người vợ.
- source_word: טַפָּם
  choice: con nhỏ của họ
  rationale: טַף thường chỉ trẻ nhỏ; cách dịch này giữ sắc thái tuổi nhỏ rõ hơn từ “con cái” rộng nghĩa.
- source_word: בְּהֶמְתָּם
  choice: súc vật
  rationale: בְּהֵמָה dùng theo nghĩa tập hợp, chỉ các loài vật nuôi.
- source_word: מִקְנֵהֶם
  choice: đàn gia súc
  rationale: מִקְנֶה thường chỉ tài sản gồm đàn gia súc; “đàn gia súc” vừa giữ nét mục súc vừa phân biệt phần nào với בְּהֵמָה.
- source_word: חֵילָם
  choice: của cải
  rationale: Trong văn cảnh phi quân sự sau danh sách người và vật nuôi, חַיִל hợp lý nhất là tài sản hay của cải vật chất.
- source_word: בָּזָזוּ
  choice: cướp lấy
  rationale: בזז chỉ việc lấy chiến lợi phẩm sau chiến thắng; “cướp lấy” rõ nghĩa, tự nhiên và giữ sắc thái chiến tranh.
theological_decisions:
- issue: Cách dịch thành ngữ dân tộc בְנֵי יִשְׂרָאֵל
  choice: Con cái Y-sơ-ra-ên
  alternative: Người Y-sơ-ra-ên
  rationale: Giữ hình thức thành ngữ nguồn khi vẫn dễ hiểu trong tiếng Việt; lựa chọn này không hàm ý chỉ nam giới hay trẻ em.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ sự phân biệt từ vựng giữa בְּהֵמָה và מִקְנֶה dù hai phạm vi nghĩa có phần chồng lấn; không thêm chú thích vì các phương án dịch đều có thể trình bày trực tiếp, không tạo ra khác biệt thần học đáng kể.
