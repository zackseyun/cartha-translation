source:
  edition: WLC
  text: וְ/כָל בֶּ֧גֶד וְ/כָל כְּלִי ע֛וֹר וְ/כָל מַעֲשֵׂ֥ה עִזִּ֖ים וְ/כָל כְּלִי עֵ֑ץ תִּתְחַטָּֽאוּ־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/020.yaml
  text: And every garment[a], and every article of leather, and every work of goats’ hair, and every article of wood, you shall purify.
translation:
  language: vi
  text: Cũng hãy thanh tẩy mọi y phục, mọi đồ bằng da, mọi vật làm từ lông dê[a] và mọi đồ bằng gỗ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “mọi vật làm từ dê”; trong ngữ cảnh này thường được hiểu là vật làm từ lông dê.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּגֶד
  choice: y phục
  rationale: Danh từ này thường chỉ quần áo hay vật dùng để mặc; “y phục” giữ sắc thái trang trọng, phù hợp với lối liệt kê.
- source_word: כְּלִי עוֹר
  choice: đồ bằng da
  rationale: כְּלִי có nghĩa rộng là đồ vật, dụng cụ hoặc vật chứa; ở đây “đồ” tự nhiên hơn “bình” và không thu hẹp phạm vi. עוֹר chỉ da thuộc hoặc da thú.
- source_word: מַעֲשֵׂה עִזִּים
  choice: vật làm từ lông dê
  rationale: Cụm Hê-bơ-rơ theo sát mặt chữ là “vật/sản phẩm của dê” và không nêu rõ bộ phận hay chất liệu. Trong các danh mục vật liệu, cách hiểu truyền thống và hợp ngữ cảnh là đồ làm từ lông dê; ghi chú bảo lưu khả năng rộng hơn.
- source_word: כְּלִי עֵץ
  choice: đồ bằng gỗ
  rationale: Cách dịch này giữ nghĩa rộng của כְּלִי và cấu trúc phân loại theo chất liệu.
- source_word: תִּתְחַטָּאוּ
  choice: hãy thanh tẩy
  rationale: Dạng hitpael số nhiều của חטא trong ngữ cảnh này diễn tả việc thực hiện nghi thức thanh tẩy. Dù hình thái có sắc thái phản thân, chuỗi tân ngữ đứng trước cho thấy mệnh lệnh áp dụng việc thanh tẩy cho các đồ vật vừa kể; tiếng Việt có thể diễn đạt tự nhiên bằng động từ ngoại động “thanh tẩy”.
theological_decisions:
- issue: Dạng phản thân của תִּתְחַטָּאוּ và các đồ vật được liệt kê
  choice: Dịch “hãy thanh tẩy” với các đồ vật làm tân ngữ
  alternative: “hãy thanh tẩy chính mình” hoặc “hãy tự thanh tẩy”
  rationale: Hình thái động từ là ngôi hai số nhiều dạng hitpael, nhưng cú pháp đặt bốn nhóm đồ vật dưới phạm vi của mệnh lệnh. Ngữ cảnh kế cận cũng nói đến việc làm tinh sạch chiến lợi phẩm. Bản dịch không thêm “khỏi tội lỗi,” vì tại đây trọng tâm là sự thanh sạch nghi lễ chứ không phải sự hoán cải hay xưng công chính.
- issue: Chất liệu trong מַעֲשֵׂה עִזִּים
  choice: “vật làm từ lông dê,” kèm chú thích về độ khái quát của nguyên văn
  alternative: “mọi sản phẩm từ dê” hoặc “đồ bằng da dê”
  rationale: Nguyên văn chỉ nói “sản phẩm/vật làm từ dê.” “Lông dê” phù hợp với cách dùng vật liệu trong Ngũ Kinh, nhưng không nên che khuất hoàn toàn độ khái quát của tiếng Hê-bơ-rơ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ nhịp liệt kê lặp lại “mọi,” dùng “thanh tẩy” để biểu thị sự tinh sạch theo nghi lễ, không thêm ý “khỏi tội lỗi” vốn dễ khiến câu bị hiểu theo nghĩa đạo đức hay tín lý.
