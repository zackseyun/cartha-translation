base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/043.yaml
  text: And the half belonging to the congregation, from the flock, was 337,500.
translation:
  language: vi
  text: Nửa phần của cộng đồng, trong số gia súc nhỏ, là 337.500 con.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתְּהִי
  choice: là
  rationale: Trong câu thống kê, dạng động từ היה này nêu tổng số của phần đã chia; “là” tự nhiên và không diễn giải quá mức.
- source_word: מֶחֱצַת הָעֵדָה
  choice: phần một nửa thuộc về cộng đồng
  rationale: Dạng liên kết מֶחֱצַת chỉ một nửa đã được phân chia cho cộng đồng; cách diễn đạt này làm rõ quan hệ sở hữu trong tiếng Việt mà vẫn giữ ý xác định của ngữ cảnh.
- source_word: הָעֵדָה
  choice: cộng đồng
  rationale: עֵדָה chỉ cộng đồng dân Y-sơ-ra-ên; “cộng đồng” là cách gọi hiện đại, trang trọng và không gợi một thiết chế giáo hội về sau.
- source_word: מִן הַצֹּאן
  choice: tính từ đàn chiên và dê
  rationale: צֹאן là danh từ tập hợp chỉ gia súc nhỏ, thường gồm chiên và dê. “Tính từ” thể hiện chức năng phân loại của מִן, còn “đàn chiên và dê” truyền đạt rõ phạm vi nghĩa hơn từ “đàn” đứng riêng.
- source_word: שְׁלֹשׁ מֵאוֹת אֶלֶף וּשְׁלֹשִׁים אֶלֶף שִׁבְעַת אֲלָפִים וַחֲמֵשׁ מֵאוֹת
  choice: '337.500'
  rationale: Chuỗi số Hê-bơ-rơ có tổng là 300.000 + 30.000 + 7.000 + 500. Dùng chữ số giúp câu kiểm kê dễ đọc và giữ nguyên số lượng chính xác; dấu chấm phù hợp quy ước phân cách hàng nghìn trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và rõ ràng, phù hợp một bản thống kê. Thêm loại từ “con” sau số lượng để câu tiếng Việt tự nhiên; từ này không làm thay đổi nội dung.
