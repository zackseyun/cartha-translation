lexical_decisions:
- source_word: וַ/חֲמֹרִים
  choice: và lừa
  rationale: Danh từ số nhiều חֲמֹרִים chỉ loài lừa; tiền tố וַ được giữ bằng “và” để nối với danh sách kiểm kê ở các câu chung quanh. Tiếng Việt không cần mạo từ hay bắt buộc đánh dấu số nhiều tại danh từ.
- source_word: שְׁלֹשִׁים אֶלֶף וַ/חֲמֵשׁ מֵאוֹת
  choice: ba mươi ngàn năm trăm con
  rationale: Cụm số Hê-bơ-rơ cộng hợp có nghĩa là 30.500. Bản dịch dùng cách nói số tự nhiên trong tiếng Việt, lược “và” giữa hàng ngàn và hàng trăm, đồng thời thêm loại từ “con” cho động vật.
