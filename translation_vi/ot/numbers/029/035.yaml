base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/035.yaml
  text: On the eighth day you shall have a solemn assembly[a]; you shall do no laborious work.
translation:
  language: vi
  text: Vào ngày thứ tám, anh em sẽ có một cuộc hội họp trọng thể[a]; anh em không được làm bất cứ công việc thường nhật nào.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “một cuộc hội họp bế mạc”. Từ Hê-bơ-rơ עֲצֶרֶת có thể chỉ một cuộc hội họp của lễ hội vào lúc kết thúc.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַשְּׁמִינִי
  choice: Vào ngày thứ tám
  rationale: Diễn đạt tự nhiên cụm từ chỉ thời gian, đồng thời giữ nguyên ý nghĩa xác định của số thứ tự trong tiếng Hê-bơ-rơ.
- source_word: עֲצֶרֶת
  choice: một cuộc hội họp trọng thể
  rationale: Danh từ này chỉ một cuộc hội họp thánh, đặc biệt trong bối cảnh ngày kết thúc kỳ lễ. Cách dịch này giữ được tính trang trọng mà không xác định quá mức chức năng kết lễ.
- source_word: תִּהְיֶה לָכֶם
  choice: anh em phải có
  rationale: Nguyên văn là “sẽ có cho anh em”; trong mệnh lệnh nghi lễ, cách diễn đạt này tự nhiên và truyền đạt rõ lực quy định.
- source_word: כָּל מְלֶאכֶת עֲבֹדָה
  choice: bất cứ công việc thường nhật nào
  rationale: Cụm từ chỉ loại công việc lao động thông thường bị cấm trong ngày lễ, chứ không nhất thiết cấm tuyệt đối mọi hoạt động. “Công việc thường nhật” rõ nghĩa và phù hợp với ngữ cảnh luật lễ hội.
- source_word: לֹא תַעֲשׂוּ
  choice: anh em không được làm
  rationale: Thể chưa hoàn thành ngôi thứ hai số nhiều kèm phủ định mang lực cấm đoán trong văn luật; “không được làm” là cách diễn đạt hiện đại, dứt khoát.
theological_decisions:
- issue: Ý nghĩa thuật ngữ lễ hội עֲצֶרֶת
  choice: Dịch là “cuộc hội họp trọng thể” trong chính văn.
  alternative: “cuộc hội họp kết lễ”
  rationale: Từ Hê-bơ-rơ có thể nhấn mạnh cuộc hội họp thánh hoặc tính chất kết thúc kỳ lễ. Chính câu này không buộc phải chọn riêng nghĩa “kết lễ”, nên chính văn giữ cách nói rộng hơn và chú thích bảo tồn khả năng ấy.
translation_notes:
  register: Văn phong luật lệ trang trọng nhưng hiện đại, dễ hiểu. Đại từ số nhiều “anh em” thể hiện lời truyền cho cộng đồng; không thêm chủ thể hoặc nội dung thần học ngoài nguyên văn.
