  text: and one male goat for a sin offering[b][a], besides the regular burnt offering and its grain offering and their drink offerings.
translation:
  language: vi
  text: Và một con dê đực làm lễ vật chuộc tội, ngoài lễ thiêu thường xuyên, lễ vật ngũ cốc kèm theo, và các lễ quán của chúng.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hê-bơ-rơ: “các lễ quán của chúng”; dạng số nhiều có lẽ chỉ các lễ quán đi kèm toàn bộ những lễ vật đã được quy định.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/שְׂעִיר עִזִּים אֶחָד
  choice: và một con dê đực
  rationale: Cụm שְׂעִיר עִזִּים là cách gọi thông dụng trong luật tế lễ về dê đực; אֶחָד xác định số lượng là một.
- source_word: חַטָּאת
  choice: làm lễ vật chuộc tội
  rationale: Trong ngữ cảnh tế lễ, từ này chỉ loại lễ vật xử lý tội lỗi, không chỉ khái niệm trừu tượng 'tội lỗi'.
- source_word: מִ/לְּ/בַד
  choice: ngoài
  rationale: Cho biết lễ vật vừa nêu được dâng thêm bên cạnh hệ thống lễ vật thường xuyên.
- source_word: עֹלַת הַ/תָּמִיד
  choice: lễ vật thiêu thường xuyên
  rationale: הַתָּמִיד diễn tả lễ vật được dâng đều đặn theo quy định; 'thường xuyên' giữ sắc thái liên tục mà không thu hẹp thành chỉ 'hằng ngày'.
- source_word: וּ/מִנְחָתָ/הּ
  choice: cùng lễ vật ngũ cốc của lễ ấy
  rationale: מִנְחָה trong luật tế lễ thường là lễ vật bằng ngũ cốc; hậu tố giống cái số ít quy chiếu về עֹלָה, nên diễn đạt rõ là lễ vật ngũ cốc đi kèm lễ vật thiêu.
- source_word: וְ/נִסְכֵּי/הֶם
  choice: và các lễ quán của chúng
  rationale: Giữ cả danh từ và hậu tố ở số nhiều như bản Hê-bơ-rơ. 'Lễ quán' là cách gọi ngắn gọn, trang trọng cho lễ vật dạng chất lỏng được rưới.
