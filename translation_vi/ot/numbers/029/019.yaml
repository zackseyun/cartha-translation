translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc; giữ số nhiều bất thường của וְנִסְכֵּיהֶם thay vì âm thầm đổi thành số ít. Dùng 'lễ vật thiêu' và 'lễ vật ngũ cốc' để diễn đạt rõ chức năng tế lễ.
