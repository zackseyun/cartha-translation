base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/005.yaml
  text: and one male goat for a sin offering[a], to make atonement for you—
translation:
  language: vi
  text: và một con dê đực làm lễ tế chuộc tội, để chuộc tội cho anh em—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/שְׂעִיר עִזִּים אֶחָד
  choice: và một con dê đực
  rationale: Cụm שְׂעִיר עִזִּים chỉ dê đực, אֶחָד xác định số lượng là một, còn וּ được dịch là “và”. Cách diễn đạt này tự nhiên trong tiếng Việt mà vẫn giữ rõ giới tính và số lượng con vật hiến tế.
- source_word: חַטָּאת
  choice: làm lễ vật chuộc tội
  rationale: Trong ngữ cảnh tế lễ, חַטָּאת chỉ lễ vật dâng vì tội lỗi chứ không đơn thuần là khái niệm “tội”. “Lễ vật chuộc tội” phân biệt con vật được dâng với chính nghi thức chuộc tội ở vế sau.
- source_word: לְ/כַפֵּר
  choice: để làm lễ chuộc tội
  rationale: Động từ כפר trong văn cảnh tư tế nói đến việc thực hiện nghi thức chuộc tội. “Làm lễ chuộc tội” vừa tự nhiên vừa giữ được phạm vi ý nghĩa nghi lễ-thần học mà không áp đặt một cơ chế giáo lý hẹp hơn.
- source_word: עֲלֵי/כֶם
  choice: cho anh em
  rationale: Giới từ עַל đi với כפר chỉ những người được thực hiện nghi thức chuộc tội thay cho họ. “Cho anh em” là cách nói tự nhiên, phù hợp lời chỉ dẫn dành cho cộng đồng.
theological_decisions:
- issue: Cách dịch ngôn ngữ tế lễ כפר
  choice: để làm lễ chuộc tội cho anh em
  alternative: để xá tội cho anh em
  rationale: Bản dịch chính giữ phạm trù nghi lễ của tiếng Hê-bơ-rơ và không thu hẹp ý nghĩa vào riêng kết quả tha thứ hay một lý thuyết chuộc tội cụ thể.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. Dùng “lễ vật chuộc tội” cho vật hiến tế và “làm lễ chuộc tội” cho hành động nghi lễ nhằm tránh lặp nghĩa thiếu phân biệt. Dấu gạch ngang cuối câu được giữ vì câu tiếp tục sang nội dung kế tiếp.
