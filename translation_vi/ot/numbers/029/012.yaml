language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וּ/בַ/חֲמִשָּׁה֩ עָשָׂ֨ר י֜וֹם לַ/חֹ֣דֶשׁ הַ/שְּׁבִיעִ֗י מִֽקְרָא קֹ֨דֶשׁ֙ יִהְיֶ֣ה לָ/כֶ֔ם כָּל מְלֶ֥אכֶת עֲבֹדָ֖ה לֹ֣א תַעֲשׂ֑וּ וְ/חַגֹּתֶ֥ם חַ֛ג לַ/יהוָ֖ה שִׁבְעַ֥ת יָמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/012.yaml
  text: And on the fifteenth day of the seventh month, you shall have a holy convocation. You shall do no ordinary work, and you shall keep a feast to Yahweh seven days.
translation:
  language: vi
  text: Vào ngày mười lăm của tháng thứ bảy, anh em sẽ có một cuộc hội họp thánh. Anh em không được làm bất cứ công việc thường ngày nào, và phải cử hành một lễ hội dành cho Yahweh trong bảy ngày.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבַחֲמִשָּׁה עָשָׂר יוֹם לַחֹדֶשׁ הַשְּׁבִיעִי
  choice: Vào ngày mười lăm tháng thứ bảy
  rationale: Diễn đạt tự nhiên công thức lịch pháp Hê-bơ-rơ; liên từ mở đầu không nhất thiết phải dịch thành “và” trong tiếng Việt khi câu đứng riêng.
- source_word: מִקְרָא קֹדֶשׁ
  choice: một cuộc hội họp thánh
  rationale: Giữ cả ý được triệu tập để tụ họp của מִקְרָא và tính chất thánh của קֹדֶשׁ, bằng ngôn ngữ hiện đại, dễ hiểu.
- source_word: יִהְיֶה לָכֶם
  choice: anh em sẽ có
  rationale: Chuyển nghĩa sát cấu trúc “sẽ có cho anh em” sang cách nói tự nhiên trong tiếng Việt.
- source_word: כָּל מְלֶאכֶת עֲבֹדָה
  choice: bất cứ công việc thường ngày nào
  rationale: Cụm từ chỉ công việc lao động thông thường bị cấm trong ngày lễ, không nhất thiết bao gồm tuyệt đối mọi hoạt động.
- source_word: לֹא תַעֲשׂוּ
  choice: không được làm
  rationale: Thể hiện rõ hiệu lực cấm đoán của quy định pháp luật.
- source_word: וְחַגֹּתֶם חַג
  choice: nhưng phải giữ lễ
  rationale: “Giữ lễ” truyền đạt tự nhiên việc cử hành lễ hội; “nhưng” làm rõ sự chuyển từ điều cấm sang nghĩa vụ tích cực trong ngữ cảnh, dù וְ về hình thức là liên từ rộng nghĩa.
- source_word: לַיהוָה
  choice: kính Yahweh
  rationale: Giới từ לְ chỉ lễ được cử hành hướng về và để tôn kính Đức Chúa Trời; giữ danh riêng giao ước dưới dạng “Yahweh” theo lớp tham khảo đã được duyệt.
- source_word: שִׁבְעַת יָמִים
  choice: trong bảy ngày
  rationale: Nêu rõ khoảng thời gian kéo dài của lễ bằng cách diễn đạt tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA; CHÚA
  rationale: Bản Hê-bơ-rơ dùng trực tiếp Tứ Tự Danh; “Yahweh” giữ đây là danh riêng giao ước mà không thay bằng một tước hiệu.
- issue: Phạm vi của lệnh cấm כָּל מְלֶאכֶת עֲבֹדָה
  choice: bất cứ công việc thường ngày nào
  alternative: mọi công việc; mọi việc lao dịch
  rationale: Cách dịch này không mở rộng lệnh cấm thành tuyệt đối mọi hoạt động, đồng thời giữ sự tương phản giữa lao động thường nhật và việc giữ ngày thánh.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Dùng “anh em” số nhiều để phản ánh hậu tố và động từ ngôi thứ hai số nhiều; tránh từ Hán-Việt quá chuyên biệt như “thánh hội” nếu không có chú giải.
