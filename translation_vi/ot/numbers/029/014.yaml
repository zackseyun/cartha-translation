source:
  edition: WLC
  text: וּ/מִנְחָתָ֔/ם סֹ֖לֶת בְּלוּלָ֣ה בַ/שָּׁ֑מֶן שְׁלֹשָׁ֨ה עֶשְׂרֹנִ֜ים לַ/פָּ֣ר הָֽ/אֶחָ֗ד לִ/שְׁלֹשָׁ֤ה עָשָׂר֙ פָּרִ֔ים שְׁנֵ֤י עֶשְׂרֹנִים֙ לָ/אַ֣יִל הָֽ/אֶחָ֔ד לִ/שְׁנֵ֖י הָ/אֵילִֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/014.yaml
  text: 'And their grain offering shall be fine flour mixed with oil: three-tenths for each bull[a], for the thirteen bulls, and two-tenths for each ram, for the two rams.'
translation:
  language: vi
  text: 'Lễ vật ngũ cốc kèm theo các con vật ấy là bột mịn trộn với dầu: ba phần mười cho mỗi con bò đực[a], dành cho mười ba con bò đực; và hai phần mười cho mỗi con cừu đực, dành cho hai con cừu đực.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Trong tiếng Hê-bơ-rơ, “ba phần mười” và “hai phần mười” chỉ các đơn vị một phần mười, theo truyền thống được hiểu là một phần mười của một ê-pha.
    reason: cultural_note
lexical_decisions:
- source_word: וּמִנְחָתָם
  choice: Lễ vật ngũ cốc dâng kèm theo chúng
  rationale: Trong ngữ cảnh tế lễ, מִנְחָה chỉ lễ vật bằng ngũ cốc; hậu tố số nhiều giống đực quy chiếu đến các con vật vừa được liệt kê. “Dâng kèm theo” làm rõ quan hệ với các sinh tế mà không thêm nội dung thần học.
- source_word: סֹלֶת
  choice: bột mịn
  rationale: Thuật ngữ tế tự chỉ loại bột được xay mịn dùng làm lễ vật; đây là cách diễn đạt tự nhiên và chính xác trong tiếng Việt hiện đại.
- source_word: בְּלוּלָה בַשָּׁמֶן
  choice: trộn với dầu
  rationale: Phân từ bị động cùng giới từ ב diễn tả bột được pha trộn với dầu.
- source_word: שְׁלֹשָׁה עֶשְׂרֹנִים
  choice: ba phần mười
  rationale: עִשָּׂרוֹן là một đơn vị bằng một phần mười, theo truyền thống được hiểu là một phần mười ê-pha; giữ cách nói ngắn gọn của nguyên văn và giải thích trong chú thích.
- source_word: לַפָּר הָאֶחָד
  choice: cho mỗi con bò đực
  rationale: Cụm từ theo sát chữ là “cho con bò đực ấy/một con bò đực”, nhưng trong chỉ dẫn phân phối này mang nghĩa mỗi con.
- source_word: לִשְׁלֹשָׁה עָשָׂר פָּרִים
  choice: áp dụng cho mười ba con bò đực
  rationale: Cụm từ xác định toàn bộ nhóm mười ba con được áp dụng định lượng nói trên; “áp dụng cho” giúp câu tiếng Việt rõ nghĩa mà vẫn giữ cấu trúc phân phối.
- source_word: שְׁנֵי עֶשְׂרֹנִים
  choice: hai phần mười
  rationale: Giữ cùng cách biểu đạt đơn vị đo như ở vế song song trước đó.
- source_word: לָאַיִל הָאֶחָד
  choice: cho mỗi con cừu đực
  rationale: Danh từ אַיִל trong danh sách sinh tế chỉ cừu đực; dạng số ít có mạo từ được hiểu theo nghĩa phân phối.
- source_word: לִשְׁנֵי הָאֵילִם
  choice: áp dụng cho hai con cừu đực
  rationale: Nêu tổng số hai con cừu đực mà định lượng theo từng con được áp dụng.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “lễ vật ngũ cốc” để phân biệt מִנְחָה trong ngữ cảnh tế lễ với lễ vật nói chung; lặp “áp dụng cho” nhằm chuyển tải rõ cấu trúc định lượng theo từng con rồi nêu tổng số con.
