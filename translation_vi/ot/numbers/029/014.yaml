  - severity: low
    issue: Cụm “áp dụng cho” bị lặp và có sắc thái giải thích hành chính.
    rationale: Cấu trúc liệt kê định lượng sẽ tự nhiên hơn với “dành cho,” vẫn bảo toàn quan hệ phân phối của tiếng Hê-bơ-rơ.
