    rationale: Hậu tố “của họ/chúng” trong tiếng Hê-bơ-rơ quy chiếu về các sinh tế đã nêu, nhưng tiếng Việt không tự nhiên khi nói các con vật có “lễ vật ... kèm theo chúng”. Cần diễn đạt quan hệ lễ vật đi kèm các sinh tế.
  - severity: low
    issue: “Con chiên đực duy nhất” hơi nhấn mạnh tính độc nhất hơn nguyên văn cần thiết.
    rationale: הָאֶחָד xác định con chiên đực đơn lẻ trong danh sách. “một con chiên đực” giữ số lượng mà không hàm ý độc nhất tuyệt đối ngoài phạm vi danh sách.
