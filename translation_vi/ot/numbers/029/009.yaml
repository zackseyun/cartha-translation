  yaml_path: translation/ot/numbers/029/009.yaml
  text: 'and their grain offering: fine flour mixed with oil[a], three-tenths for the bull, two-tenths for the one ram,'
translation:
  language: vi
  text: 'Lễ vật ngũ cốc đi kèm các sinh tế ấy là bột mịn trộn với dầu: ba phần mười cho con bò đực, hai phần mười cho một con chiên đực.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ba phần mười” và “hai phần mười” trong tiếng Hê-bơ-rơ chỉ các đơn vị một phần mười, theo truyền thống được hiểu là một phần mười của một ê-pha.
    reason: cultural_note
lexical_decisions:
- source_word: וּמִנְחָתָם
  choice: Lễ vật ngũ cốc kèm theo chúng
  rationale: Trong ngữ cảnh tế lễ, מִנְחָה chỉ lễ vật bằng ngũ cốc đi kèm các sinh tế; hậu tố số nhiều giống đực được giữ bằng “chúng”, quy chiếu về các con vật ở câu trước.
- source_word: סֹלֶת
  choice: bột mịn
  rationale: Chỉ loại bột được xay kỹ, có chất lượng cao, dùng trong tế lễ; “bột mịn” tự nhiên và chính xác trong tiếng Việt hiện đại.
- source_word: בְּלוּלָה בַשָּׁמֶן
  choice: trộn với dầu
  rationale: Phân từ bị động cùng cụm giới từ mô tả bột đã được hòa trộn với dầu; cách diễn đạt này rõ ràng và giữ chi tiết chuẩn bị lễ vật.
- source_word: שְׁלֹשָׁה עֶשְׂרֹנִים
  choice: ba phần mười
  rationale: עִשָּׂרוֹן là một đơn vị bằng một phần mười, theo truyền thống được hiểu là một phần mười ê-pha; bản văn nói gọn nên bản dịch cũng giữ cách nói gọn và giải thích trong chú thích.
- source_word: לַפָּר
  choice: cho con bò đực
  rationale: Danh từ số ít có mạo từ xác định chỉ con bò đực đã được nêu trong danh sách sinh tế.
- source_word: שְׁנֵי עֶשְׂרֹנִים
  choice: hai phần mười
  rationale: Giữ cách biểu đạt định lượng cô đọng của nguyên văn; đơn vị ngầm hiểu được giải thích trong chú thích.
- source_word: לָאַיִל הָאֶחָד
  choice: cho con chiên đực duy nhất
  rationale: Mạo từ cùng אֶחָד nhấn mạnh đây là một con chiên đực trong danh sách; “duy nhất” chuyển tải tính xác định và số lượng một cách tự nhiên.
