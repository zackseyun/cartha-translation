translation_notes:
  register: Văn phong trang trọng, sáng rõ và gọn theo cấu trúc một danh sách tế lễ. Dùng loại từ 'con' tự nhiên trong tiếng Việt; thêm 'tất cả đều' để làm rõ phạm vi ngữ pháp của tính từ số nhiều cuối câu mà không thêm nội dung.
