revisions:
- from: 'Vào ngày thứ bảy: bảy con bò đực, hai con chiên đực và mười bốn con chiên con một tuổi, tất cả đều không tì vết.'
  to: 'Vào ngày thứ bảy: bảy con bò đực, hai con chiên đực và mười bốn con chiên con một tuổi không tì vết[a].'
  rationale: Sửa duy nhất phần mở rộng phạm vi “tất cả đều,” để tính từ “không tì vết” theo sát nhóm chiên con mà nó trực tiếp bổ nghĩa trong tiếng Hê-bơ-rơ. Thêm chú thích từ vựng, neo đúng tại cụm được chú thích, nhằm phản ánh sắc thái tế lễ của תְּמִימִם.
