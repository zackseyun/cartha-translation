  yaml_path: translation/ot/numbers/029/032.yaml
  text: 'And on the seventh day: seven bulls[a], two rams, and fourteen one-year-old lambs without blemish.'
translation:
  language: vi
  text: 'Vào ngày thứ bảy: bảy con bò đực, hai con chiên đực và mười bốn con chiên con một tuổi không tì vết[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “không khuyết tật.” Từ Hê-bơ-rơ chỉ tình trạng nguyên vẹn, không có khuyết tật của vật tế.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַיּוֹם הַשְּׁבִיעִי
  choice: Vào ngày thứ bảy
  rationale: Cụm từ mở đầu mục tiếp theo trong chuỗi ngày lễ. Tiếng Việt tự nhiên không cần biểu đạt riêng liên từ וְ, vì mối liên kết đã rõ trong trình tự.
- source_word: פָּרִים שִׁבְעָה
  choice: bảy con bò đực
  rationale: פַּר trong danh sách tế lễ chỉ bò đực; câu không nói rõ độ tuổi, nên không thêm ý 'tơ'.
- source_word: אֵילִם שְׁנָיִם
  choice: hai con chiên đực
  rationale: אַיִל là chiên đực trưởng thành, được phân biệt với các con chiên một tuổi ở phần sau.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה אַרְבָּעָה עָשָׂר
  choice: mười bốn con chiên con một tuổi
  rationale: בְּנֵי שָׁנָה là thành ngữ chỉ con vật một tuổi; 'chiên con' diễn đạt כֶּבֶשׂ tự nhiên trong tiếng Việt.
- source_word: תְּמִימִם
  choice: tất cả đều không tì vết
  rationale: Trong ngữ cảnh tế lễ, từ này nói đến tình trạng nguyên vẹn, không có khuyết tật. Vị trí cuối câu và dạng số nhiều cho thấy nó mô tả toàn bộ các con vật đã liệt kê.
