  text: וּ/בַ/יּ֣וֹם הַ/שֵּׁנִ֗י פָּרִ֧ים בְּנֵי בָקָ֛ר שְׁנֵ֥ים עָשָׂ֖ר אֵילִ֣ם שְׁנָ֑יִם כְּבָשִׂ֧ים בְּנֵי שָׁנָ֛ה אַרְבָּעָ֥ה עָשָׂ֖ר תְּמִימִֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/017.yaml
  text: 'And on the second day: twelve bulls from the herd[a], two rams, and fourteen one-year-old lambs without blemish,'
translation:
  language: vi
  text: 'Ngày thứ hai: mười hai con bò đực thuộc đàn bò[a], hai con chiên đực và mười bốn con chiên con một tuổi, không tì vết.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tiếng Hê-bơ-rơ sát nghĩa là “mười hai con bò đực, con của đàn bò.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בַ/יּוֹם הַ/שֵּׁנִי
  choice: Ngày thứ hai
  rationale: Cách mở đầu tự nhiên cho mục kế tiếp trong chuỗi lễ vật; quan hệ tiếp nối đã rõ trong ngữ cảnh nên không cần thêm “và” một cách gượng ép.
- source_word: פָּרִים בְּנֵי בָקָר
  choice: những con bò đực thuộc đàn bò
  rationale: פָּרִים chỉ bò đực dùng làm sinh tế; בְּנֵי בָקָר, sát nghĩa là “con của đàn bò,” có chức năng phân loại. “Thuộc đàn bò” giữ được ý này bằng tiếng Việt tự nhiên.
- source_word: שְׁנֵים עָשָׂר
  choice: mười hai
  rationale: Số từ chỉ số lượng bò đực.
- source_word: אֵילִם שְׁנָיִם
  choice: hai con chiên đực
  rationale: אֵילִם là chiên đực trưởng thành, một thuật ngữ thông dụng trong danh mục sinh tế.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה
  choice: những con chiên con một tuổi
  rationale: כְּבָשִׂים là chiên non; בְּנֵי שָׁנָה là thành ngữ chỉ tuổi một năm.
- source_word: אַרְבָּעָה עָשָׂר
  choice: mười bốn
  rationale: Số từ chỉ số lượng chiên con.
- source_word: תְּמִימִם
  choice: không tì vết
  rationale: Trong luật tế lễ, từ này chỉ con vật không có khuyết tật; “không tì vết” vừa chính xác vừa trang trọng.
