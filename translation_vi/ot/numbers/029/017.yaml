  source_fidelity: 'Bản dịch chuyển đạt đầy đủ danh mục tế lễ trong tiếng Hê-bơ-rơ: ngày thứ hai, mười hai bò đực thuộc đàn bò, hai chiên đực, và mười bốn chiên con một tuổi không tì vết. Việc không dịch liên từ mở đầu bằng “Và” vẫn tự nhiên trong tiếng Việt và không làm mất quan hệ tiếp nối của danh sách.'
