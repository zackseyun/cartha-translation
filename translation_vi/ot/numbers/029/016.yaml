  yaml_path: translation/ot/numbers/029/016.yaml
  text: and one male goat for a sin offering[a], besides the regular burnt offering, its grain offering, and its drink offering.
translation:
  language: vi
  text: và một con dê đực làm lễ vật chuộc tội[a], ngoài lễ toàn thiêu thường lệ, cùng lễ vật ngũ cốc và lễ vật rượu kèm theo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “lễ vật thanh tẩy.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: một con dê đực
  rationale: Cụm từ chỉ một con dê giống đực dùng trong nghi lễ; cách dịch này tự nhiên và giữ rõ giới tính của con vật.
- source_word: אֶחָד
  choice: một
  rationale: Số từ xác định số lượng con vật hiến tế.
- source_word: חַטָּאת
  choice: lễ vật chuộc tội
  rationale: Trong ngữ cảnh tế lễ, từ này chỉ lễ vật liên quan đến tội lỗi hoặc sự thanh tẩy, chứ không chỉ khái niệm trừu tượng là “tội”.
- source_word: מִלְּבַד
  choice: ngoài
  rationale: Diễn tả lễ vật này được dâng thêm, không thay thế lễ vật thường lệ.
- source_word: עֹלַת הַתָּמִיד
  choice: lễ vật thiêu thường xuyên
  rationale: Chỉ lễ vật thiêu được dâng đều đặn theo quy định; “thường xuyên” giữ được ý lặp lại liên tục mà không thu hẹp thành một thời điểm cụ thể.
- source_word: מִנְחָתָהּ
  choice: lễ vật ngũ cốc của lễ vật ấy
  rationale: Trong ngữ cảnh nghi lễ, מִנְחָה là lễ vật bằng ngũ cốc; hậu tố giống cái số ít quy chiếu về lễ vật thiêu.
- source_word: וְנִסְכָּהּ
  choice: và lễ quán của lễ vật ấy
  rationale: Chỉ lễ vật dạng chất lỏng được rưới hoặc đổ ra đi kèm; “lễ quán” là thuật ngữ tiếng Việt ngắn gọn cho nghi lễ này, còn cụm sở hữu làm rõ hậu tố quy chiếu về lễ vật thiêu.
theological_decisions:
- issue: Phạm vi nghĩa nghi lễ của חַטָּאת
  choice: lễ vật chuộc tội
  alternative: lễ vật thanh tẩy
  rationale: “Lễ vật chuộc tội” dễ nhận biết và phù hợp truyền thống thuật ngữ tiếng Việt, nhưng chú thích giữ lại khả năng hiểu theo chức năng thanh tẩy của lễ vật.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “lễ vật thiêu” thay cho cách nói cổ hơn; lặp “của lễ vật ấy” để thể hiện rõ các hậu tố giống cái số ít trong tiếng Hê-bơ-rơ đều quy chiếu về lễ vật thiêu.
