  verdict: revise
  source_fidelity: 'Bản nháp truyền đạt đầy đủ các thành tố của tiếng Hê-bơ-rơ: một dê đực làm lễ vật chuộc tội, được dâng thêm ngoài lễ thiêu thường xuyên cùng lễ vật ngũ cốc và lễ quán thuộc về lễ thiêu đó. Tuy nhiên, cách đặt cụm “đi kèm lễ ấy” ở cuối có thể làm quan hệ sở hữu của hai hậu tố -hā trong nguyên ngữ kém trực tiếp.'
