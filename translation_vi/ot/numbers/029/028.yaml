  yaml_path: translation/ot/numbers/029/028.yaml
  text: and one male goat for a sin offering[b][a], besides the regular burnt offering and its grain offering and its drink offering.
translation:
  language: vi
  text: và một con dê đực làm lễ vật chuộc tội, ngoài lễ thiêu thường xuyên[a], cùng lễ vật ngũ cốc và lễ quán[b] của lễ ấy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “lễ thiêu liên tục”.
    reason: lexical_alternative
  - marker: b
    text: “Lễ quán” là lễ dâng bằng cách rót thức uống ra.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/שְׂעִיר
  choice: và một con dê đực
  rationale: שָׂעִיר chỉ dê đực; tiền tố ו nối tiếp danh sách lễ vật nên được dịch là “và”.
- source_word: חַטָּאת
  choice: làm lễ vật chuộc tội
  rationale: Trong danh mục tế lễ, חַטָּאת chỉ loại lễ vật liên quan đến việc xử lý tội lỗi và sự ô uế; “lễ vật chuộc tội” là cách diễn đạt quen thuộc, rõ nghĩa trong tiếng Việt.
- source_word: אֶחָד
  choice: một
  rationale: Giữ rõ số lượng con vật được quy định.
- source_word: מִ/לְּ/בַד
  choice: ngoài
  rationale: Cụm này cho biết lễ vật vừa nêu được dâng thêm bên cạnh toàn bộ lễ thiêu thường xuyên và các lễ vật đi kèm.
- source_word: עֹלַת
  choice: lễ thiêu
  rationale: Đây là thuật ngữ tế lễ chỉ lễ vật được thiêu trọn trên bàn thờ.
- source_word: הַ/תָּמִיד
  choice: thường xuyên
  rationale: תָּמִיד diễn tả tính đều đặn, liên tục theo quy định; “thường xuyên” không diễn giải quá mức thành “hằng ngày”.
- source_word: וּ/מִנְחָתָ/הּ
  choice: lễ vật ngũ cốc ... đi kèm lễ ấy
  rationale: Trong ngữ cảnh tế lễ, מִנְחָה là lễ vật bằng ngũ cốc. Hậu tố giống cái số ít quy chiếu về lễ thiêu và được diễn đạt tự nhiên bằng “đi kèm lễ ấy”.
- source_word: וְ/נִסְכָּ/הּ
  choice: lễ quán ... đi kèm lễ ấy
  rationale: נֶסֶךְ là lễ vật bằng thức uống được rót ra. “Lễ quán” giữ thuật ngữ tế lễ cô đọng; hậu tố sở hữu cũng quy chiếu về lễ thiêu.
theological_decisions:
- issue: Ý nghĩa tế lễ của חַטָּאת
  choice: lễ vật chuộc tội
  alternative: lễ vật thanh tẩy
  rationale: Danh từ có thể được nhấn mạnh theo chức năng xử lý tội lỗi hoặc thanh tẩy sự ô uế. Bản dịch chính dùng cách gọi quen thuộc “lễ vật chuộc tội” mà không thêm lời giải thích nhằm phân định dứt khoát giữa hai sắc thái.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, giữ cấu trúc cô đọng của một danh mục tế lễ. “Lễ quán” là thuật ngữ chuyên biệt nên được giải thích ngắn trong chú thích; cách diễn đạt “đi kèm lễ ấy” làm rõ các hậu tố sở hữu trong tiếng Hê-bơ-rơ mà không thay đổi quan hệ cú pháp.
