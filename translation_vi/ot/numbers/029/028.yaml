  terminology: “Dê đực,” “lễ vật chuộc tội,” “lễ thiêu,” “lễ vật ngũ cốc,” và “lễ quán” đều là các thuật ngữ chấp nhận được trong văn cảnh tế lễ. “Lễ quán” là thuật ngữ chuyên biệt, nên chú thích giải thích ngắn là hữu ích.
  issues:
