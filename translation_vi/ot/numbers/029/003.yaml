base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/003.yaml
  text: 'And their grain offering shall be fine flour mixed with oil: three-tenths for the bull[a], two-tenths for the ram.'
translation:
  language: vi
  text: 'Lễ vật ngũ cốc của họ là bột mịn trộn với dầu: ba phần mười ê-pha[a] cho con bò đực, hai phần mười ê-pha cho con chiên đực.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ê-pha là đơn vị đo thể tích khô dùng trong hệ thống tế lễ của Y-sơ-ra-ên. “Ba phần mười” và “hai phần mười” là ba phần mười và hai phần mười của một ê-pha.
    reason: cultural_note
lexical_decisions:
- source_word: וּמִנְחָתָם
  choice: Lễ vật ngũ cốc dâng kèm theo
  rationale: Trong ngữ cảnh tế lễ, מִנְחָה chỉ lễ vật bằng ngũ cốc; hậu tố số nhiều quy chiếu các sinh tế ở câu trước. Cách nói “dâng kèm theo” diễn đạt tự nhiên quan hệ giữa lễ vật này và các con vật hiến tế, dù tiếng Hê-bơ-rơ không có động từ.
- source_word: סֹלֶת
  choice: bột mịn
  rationale: סֹלֶת là loại bột được xay kỹ, có phẩm chất cao, dùng trong tế lễ.
- source_word: בְּלוּלָה בַשָּׁמֶן
  choice: trộn với dầu
  rationale: Phân từ bị động בְּלוּלָה mô tả bột đã được hòa trộn với dầu; cách dịch này rõ ràng và tự nhiên trong tiếng Việt hiện đại.
- source_word: שְׁלֹשָׁה עֶשְׂרֹנִים
  choice: ba phần mười ê-pha
  rationale: עִשָּׂרוֹן là một phần mười ê-pha. Nêu rõ đơn vị ngay trong câu giúp độc giả Việt hiểu lượng đo mà không phải suy ra từ ngữ cảnh.
- source_word: לַפָּר
  choice: cho con bò đực
  rationale: פַּר chỉ bò đực dùng làm sinh tế; giữ nguyên dạng số ít xác định của câu Hê-bơ-rơ.
- source_word: שְׁנֵי עֶשְׂרֹנִים
  choice: hai phần mười ê-pha
  rationale: Diễn đạt đầy đủ lượng đo là hai phần mười của một ê-pha, nhất quán với vế trước.
- source_word: לָאָיִל
  choice: cho con chiên đực
  rationale: אַיִל là chiên đực trưởng thành dùng làm sinh tế; “chiên đực” là cách gọi rõ nghĩa, phổ thông trong tiếng Việt.
