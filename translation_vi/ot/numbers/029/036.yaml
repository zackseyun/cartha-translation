revisions:
- from: 'Các ngươi phải dâng một lễ thiêu, là lễ vật dùng lửa dâng lên, có hương thơm đẹp lòng Đức Giê-hô-va[a]: một con bò đực, một con chiên đực và bảy con chiên con một tuổi, tất cả đều không tì vết.'
  to: 'Các ngươi phải dâng một lễ thiêu—một lễ vật dâng bằng lửa, có hương thơm đẹp lòng[a] đối với Yahweh: một con bò đực, một con chiên đực và bảy con chiên con một tuổi không tì vết.'
  rationale: Bản sửa giới hạn “không tì vết” đúng theo nhóm chiên con mà tính từ số nhiều trong tiếng Hê-bơ-rơ trực tiếp bổ nghĩa; làm rõ quan hệ đồng vị giữa lễ thiêu và lễ vật dâng bằng lửa; chuyển neo chú thích đến đúng cụm từ được chú giải; và dùng “Yahweh” theo quyết định danh thần của hồ sơ nguồn.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T10:20:29Z'
review_pass:
  verdict: revise
  source_fidelity: Bản thảo truyền đạt đúng các lễ vật, số lượng, độ tuổi và tình trạng không tì vết. Tuy nhiên, cụm “tất cả đều không tì vết” có thể mở rộng tính từ số nhiều תְּמִימִם sang cả bò đực và chiên đực, trong khi vị trí và sự hòa hợp số nhiều của từ Hê-bơ-rơ trực tiếp bổ nghĩa cho bảy chiên con. Cần đặt ký hiệu chú thích tại “hương thơm đẹp lòng”, là cụm được chú giải, thay vì tại danh thần.
  naturalness: Câu sửa vẫn giữ văn phong nghi lễ trang trọng nhưng hiện đại. “Lễ vật dâng bằng lửa” rõ nghĩa hơn “lễ vật dùng lửa dâng lên”; dấu gạch ngang biểu thị quan hệ đồng vị trong nguyên văn.
  terminology: Dùng “lễ thiêu”, “lễ vật dâng bằng lửa”, “bò đực”, “chiên đực”, và “chiên con một tuổi” là chính xác trong ngữ cảnh tế lễ. Danh יהוה được chuyển là “Yahweh”, phù hợp quyết định danh thần trong hồ sơ kiểm tra tiếng Anh. Chú thích giữ phương án “hương thơm êm dịu” mà không áp đặt diễn giải giáo phái.
  issues:
  - severity: medium
    issue: Phạm vi của “tất cả đều không tì vết” quá rộng.
    rationale: תְּמִימִם là tính từ số nhiều đứng sau “bảy con chiên con một tuổi” và trực tiếp mô tả nhóm chiên con đó. Bản dịch không nên khẳng định rõ ràng rằng nó cũng bổ nghĩa cho bò đực và chiên đực trong cấu trúc câu này.
  - severity: low
    issue: Ký hiệu chú thích đặt sau “Đức Giê-hô-va” thay vì sau cụm רֵיחַ נִיחֹחַ.
    rationale: Nội dung chú thích giải thích “hương thơm đẹp lòng/êm dịu”, không giải thích danh thần; neo chú thích cần đặt sát cụm được chú giải.
  - severity: low
    issue: Cách gọi “lễ vật dùng lửa dâng lên” hơi nặng và lặp ý với “lễ thiêu”.
    rationale: “Lễ vật dâng bằng lửa” tự nhiên hơn, đồng thời vẫn phản ánh אִשֵּׁה là lễ vật được dâng bằng lửa.
