  text: וְ/הִקְרַבְתֶּ֨ם עֹלָ֜ה אִשֵּׁ֨ה רֵ֤יחַ נִיחֹ֨חַ֙ לַֽ/יהוָ֔ה פַּ֥ר אֶחָ֖ד אַ֣יִל אֶחָ֑ד כְּבָשִׂ֧ים בְּנֵי שָׁנָ֛ה שִׁבְעָ֖ה תְּמִימִֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/036.yaml
  text: 'And you shall present a burnt offering[a], an offering by fire, a pleasing aroma to Yahweh: one bull, one ram, and seven one-year-old lambs without blemish.'
translation:
  language: vi
  text: 'Các ngươi phải dâng một lễ thiêu—một lễ vật dâng bằng lửa, có hương thơm đẹp lòng[a] đối với Yahweh: một con bò đực, một con chiên đực và bảy con chiên con một tuổi không tì vết.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “hương thơm êm dịu.” Cụm từ Hê-bơ-rơ này là một thành ngữ tế lễ cố định, chỉ lễ vật được Đức Chúa Trời vui nhận.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרַבְתֶּם
  choice: Các ngươi phải dâng
  rationale: Thể Hifil của קרב trong ngữ cảnh tế lễ có nghĩa là đem đến hoặc dâng lễ vật; “phải dâng” tự nhiên trong tiếng Việt và giữ được tính chỉ thị của câu.
- source_word: עֹלָה
  choice: một lễ thiêu
  rationale: Đây là thuật ngữ tế lễ chỉ lễ vật được thiêu trọn; “lễ thiêu” ngắn gọn, rõ nghĩa và phù hợp văn cảnh nghi lễ.
- source_word: אִשֵּׁה
  choice: lễ vật dùng lửa dâng lên
  rationale: Cách dịch này thể hiện phương thức dâng bằng lửa mà không áp đặt nghĩa hẹp hơn như “lễ vật thực phẩm”.
- source_word: רֵיחַ נִיחֹחַ
  choice: hương thơm đẹp lòng
  rationale: Đây là thành ngữ tế lễ cố định diễn tả lễ vật được Đức Chúa Trời chấp nhận; cách nói này vừa giữ hình ảnh mùi hương vừa truyền đạt sắc thái hài lòng.
- source_word: לַיהוָה
  choice: dâng lên Đức Giê-hô-va
  rationale: Giới từ ל chỉ đối tượng tiếp nhận lễ vật; danh riêng giao ước được thể hiện bằng dạng quen thuộc trong tiếng Việt là “Đức Giê-hô-va”.
- source_word: פַּר אֶחָד
  choice: một con bò đực
  rationale: פַּר chỉ bò đực dùng làm sinh tế; nguyên văn không nhất thiết đòi hỏi thêm ý “tơ”.
- source_word: אַיִל אֶחָד
  choice: một con chiên đực
  rationale: אַיִל là từ chỉ chiên đực trưởng thành, nên dịch trực tiếp để phân biệt với các chiên con theo sau.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה שִׁבְעָה
  choice: bảy con chiên con một tuổi
  rationale: Cụm Hê-bơ-rơ nghĩa đen là “bảy chiên con, con của một năm”; cách dịch này tự nhiên và giữ chính xác yêu cầu về tuổi.
- source_word: תְּמִימִם
  choice: tất cả đều không tì vết
  rationale: Trong ngữ cảnh sinh tế, từ này chỉ các con vật không có khuyết tật; thêm “tất cả đều” làm rõ tính từ số nhiều áp dụng cho bảy chiên con.
theological_decisions:
- issue: Cách thể hiện danh Đức Chúa Trời יהוה
  choice: Đức Giê-hô-va
  alternative: Yahweh
  rationale: Nguyên văn ghi trực tiếp danh giao ước YHWH. “Đức Giê-hô-va” là dạng danh riêng trang trọng và quen thuộc trong tiếng Việt, không thay danh ấy bằng một tước hiệu; “Yahweh” là phương án phiên âm gần với cách phục nguyên học thuật hơn.
- issue: Ý nghĩa của רֵיחַ נִיחֹחַ
  choice: hương thơm đẹp lòng
  alternative: hương thơm êm dịu
  rationale: Cụm từ giữ hình ảnh nhân hình về hương thơm đồng thời biểu thị sự chấp nhận của Đức Chúa Trời; bản dịch không giải thích thành một mệnh đề thần học rộng hơn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng thuật ngữ nghi lễ nhất quán; cấu trúc liệt kê bám sát nguyên văn. Đại từ “các ngươi” phản ánh lời truyền cho cộng đồng trong văn mạch luật pháp, dù mang sắc thái Kinh Thánh trang trọng.
