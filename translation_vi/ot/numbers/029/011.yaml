    issue: “các lễ quán của chúng” dùng một thuật ngữ cổ, khó hiểu trong tiếng Việt hiện đại.
    rationale: נְסָכִים là các lễ rượu/lễ dâng đồ uống. “Lễ vật rượu” rõ nghĩa hơn cho độc giả hiện đại, không làm thay đổi ý nghĩa nghi lễ.
  - severity: low
    issue: Cụm “ngoài ... cùng với ...” làm quan hệ liệt kê hơi kém tự nhiên.
    rationale: Tiếng Hê-bơ-rơ đặt các lễ vật sau מִלְּבַד như các lễ vật bổ sung. “ngoài ... và ...” diễn đạt quan hệ này mạch lạc hơn.
