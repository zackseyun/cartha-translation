  text: שְׂעִיר עִזִּ֥ים אֶחָ֖ד חַטָּ֑את מִ/לְּ/בַ֞ד חַטַּ֤את הַ/כִּפֻּרִים֙ וְ/עֹלַ֣ת הַ/תָּמִ֔יד וּ/מִנְחָתָ֖/הּ וְ/נִסְכֵּי/הֶֽם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/011.yaml
  text: and one male goat for a sin offering[a], besides the sin offering of atonement[b], and the regular burnt offering with its grain offering and their drink offerings.
translation:
  language: vi
  text: và một con dê đực làm lễ vật chuộc tội[a], ngoài lễ vật chuộc tội của lễ xá tội, lễ vật thiêu thường lệ[b], lễ vật ngũ cốc đi kèm và các lễ vật rượu của chúng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch hai lần “lễ vật chuộc tội” trong câu này là “lễ vật thanh tẩy.”
    reason: lexical_alternative
  - marker: b
    text: Hay “lễ vật thiêu liên tục.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: một con dê đực
  rationale: Cụm từ chỉ một con dê giống đực; cách dịch này tự nhiên trong tiếng Việt hiện đại và giữ rõ giới tính của con vật hiến tế.
- source_word: אֶחָד
  choice: một
  rationale: Giữ nguyên số lượng được quy định trong bản Hê-bơ-rơ.
- source_word: חַטָּאת
  choice: lễ vật chuộc tội
  rationale: Trong danh sách tế lễ, danh từ này chỉ lễ vật chứ không chỉ khái niệm tội lỗi. “Lễ vật chuộc tội” là thuật ngữ quen thuộc, dễ hiểu; khả năng dịch là “lễ vật thanh tẩy” được ghi ở chú thích.
- source_word: מִלְּבַד
  choice: ngoài
  rationale: Diễn đạt rằng lễ vật này được dâng thêm, không thay thế các lễ vật được nhắc đến sau đó.
- source_word: חַטַּאת הַכִּפֻּרִים
  choice: lễ vật chuộc tội để làm lễ xá tội
  rationale: Giữ mối liên hệ giữa lễ vật חַטָּאת và nghi thức כִּפֻּרִים, đồng thời tránh bổ sung rõ tên Ngày Xá Tội khi chính câu này không nêu tên ngày ấy.
- source_word: עֹלַת הַתָּמִיד
  choice: lễ vật thiêu thường lệ
  rationale: תָּמִיד diễn tả việc dâng đều đặn, liên tục theo quy định. “Thường lệ” tự nhiên và không thu hẹp nghĩa thành chỉ “hằng ngày”.
- source_word: מִנְחָתָהּ
  choice: lễ vật ngũ cốc đi kèm
  rationale: Trong ngữ cảnh tế lễ, מִנְחָה là lễ vật bằng ngũ cốc; hậu tố giống cái số ít quy chiếu về lễ vật thiêu, nên “đi kèm” diễn đạt quan hệ này tự nhiên trong tiếng Việt.
- source_word: נִסְכֵּיהֶם
  choice: các lễ quán của chúng
  rationale: Giữ số nhiều của danh từ và hậu tố số nhiều “của chúng”, có thể quy chiếu đến các lễ vật vừa kể; “lễ quán” là thuật ngữ trang trọng chỉ rượu hoặc chất lỏng được rưới dâng.
theological_decisions:
- issue: Thuật ngữ tế lễ חַטָּאת
  choice: Dịch cả hai lần là “lễ vật chuộc tội”
  alternative: “lễ vật thanh tẩy”
  rationale: חַטָּאת có thể nhấn mạnh chức năng thanh tẩy trong hệ thống tế lễ, nhưng ở đây câu văn liệt kê các lễ vật và “lễ vật chuộc tội” là cách gọi quen thuộc, không buộc phải giải quyết dứt khoát sắc thái chức năng. Chú thích bảo lưu khả năng dịch khác.
- issue: Ý nghĩa của הַכִּפֻּרִים
  choice: “để làm lễ xá tội”
  alternative: “của sự chuộc tội” hoặc nêu đích danh “trong Ngày Xá Tội”
  rationale: Cách dịch được chọn giữ sắc thái nghi lễ của số nhiều trừu tượng/cường ý mà không diễn giải quá mức bằng cách chèn tên ngày lễ vốn không xuất hiện trực tiếp trong câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và phù hợp với một danh sách nghi lễ. Dùng “lễ vật” nhất quán để làm rõ rằng các thuật ngữ chỉ vật hiến tế; tránh từ cổ khó hiểu, ngoại trừ “lễ quán,” một thuật ngữ nghi lễ cô đọng được đặt trong ngữ cảnh đủ rõ.
