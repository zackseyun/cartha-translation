  terminology: «Lễ thiêu», «chiên đực», «chiên con đực một tuổi», «không tì vết» và «Yahweh» đều phù hợp. «Hương thơm đẹp lòng» bảo toàn hình ảnh và chức năng thành ngữ của רֵיחַ נִיחֹחַ.
