id: NUM.29.13
reference: Numbers 29:13
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/הִקְרַבְתֶּ֨ם עֹלָ֜ה אִשֵּׁ֨ה רֵ֤יחַ נִיחֹ֨חַ֙ לַֽ/יהוָ֔ה פָּרִ֧ים בְּנֵי בָקָ֛ר שְׁלֹשָׁ֥ה עָשָׂ֖ר אֵילִ֣ם שְׁנָ֑יִם כְּבָשִׂ֧ים בְּנֵֽי שָׁנָ֛ה אַרְבָּעָ֥ה עָשָׂ֖ר תְּמִימִ֥ם יִהְיֽוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/013.yaml
  text: 'And you shall present a burnt offering[a], an offering by fire, a pleasing aroma to Yahweh: thirteen bulls from the herd, two rams, and fourteen male lambs a year old; they shall be without blemish.'
translation:
  language: vi
  text: 'Các ngươi phải dâng một lễ thiêu, tức lễ vật dâng bằng lửa, có hương thơm đẹp lòng Yahweh[a]: mười ba con bò đực từ đàn bò, hai con chiên đực và mười bốn con chiên con đực một tuổi; tất cả phải không tì vết.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “hương thơm êm dịu” hoặc “hương thơm ngọt ngào”. Thành ngữ Hê-bơ-rơ רֵיחַ נִיחֹחַ diễn tả rằng lễ vật được Yahweh vui nhận.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרַבְתֶּם
  choice: các ngươi phải dâng
  rationale: Dạng Hiphil của קרב trong ngữ cảnh tế lễ có nghĩa là đem đến để dâng. “Dâng” tự nhiên và chính xác trong tiếng Việt; đại từ số nhiều được giữ lại.
- source_word: עֹלָה
  choice: một lễ thiêu
  rationale: Thuật ngữ chỉ sinh tế được thiêu trọn. “Lễ thiêu” là cách gọi rõ ràng, quen thuộc và phù hợp ngữ cảnh.
- source_word: אִשֵּׁה
  choice: lễ vật dùng lửa dâng lên
  rationale: Chỉ lễ vật được dâng bằng lửa. Cách diễn đạt này giữ mối liên hệ với lửa mà không khiến người đọc hiểu đây là một lễ vật khác tách khỏi lễ thiêu.
- source_word: רֵיחַ נִיחֹחַ
  choice: hương thơm đẹp lòng
  rationale: Thành ngữ diễn tả lễ vật được Đức Chúa Trời vui nhận. “Hương thơm đẹp lòng” vừa giữ hình ảnh mùi hương vừa truyền đạt ý nghĩa thành ngữ.
- source_word: לַיהוָה
  choice: dâng lên ... Yahweh
  rationale: Giữ danh riêng giao ước יהוה dưới dạng “Yahweh”, đồng thời diễn đạt giới từ ל bằng cấu trúc tiếng Việt tự nhiên.
- source_word: פָּרִים בְּנֵי בָקָר
  choice: bò đực thuộc đàn bò
  rationale: Giữ nghĩa phân loại gia súc của cụm Hê-bơ-rơ mà không tự ý xác định chúng là bò non.
- source_word: אֵילִם
  choice: chiên đực
  rationale: Tương đương tự nhiên trong tiếng Việt cho chiên đực trưởng thành dùng làm sinh tế.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה
  choice: chiên con đực một tuổi
  rationale: Giữ cả giống đực được hàm nghĩa trong כְּבָשִׂים và độ tuổi được nêu rõ trong בְּנֵי שָׁנָה.
- source_word: תְּמִימִם
  choice: không tì vết
  rationale: Trong luật tế lễ, từ này chỉ con vật không có khuyết tật; “không tì vết” là cách diễn đạt trang trọng và rõ nghĩa.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC CHÚA / Giê-hô-va
  rationale: Nguyên văn dùng trực tiếp danh giao ước יהוה. Giữ “Yahweh” giúp phân biệt danh riêng này với tước hiệu và không che khuất yếu tố thần học của bản văn.
- issue: Ý nghĩa của רֵיחַ נִיחֹחַ
  choice: hương thơm đẹp lòng
  alternative: hương thơm êm dịu
  rationale: Cách chọn giữ hình ảnh cụ thể của nguyên văn nhưng cũng cho thấy đây là ngôn ngữ về sự vui nhận lễ vật, không buộc câu chỉ nói về khứu giác theo nghĩa đen.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng “các ngươi” để thể hiện ngôi thứ hai số nhiều trong lời truyền phán; cấu trúc liệt kê được giữ gọn và rõ. Dấu chú thích [a] được đặt ngay sau cụm từ mà chú thích giải thích.
