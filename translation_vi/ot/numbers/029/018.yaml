base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/018.yaml
  text: and their grain offering and their drink offerings for the bulls[a], for the rams, and for the lambs, according to their number, according to the ordinance;
translation:
  language: vi
  text: cùng lễ vật ngũ cốc và lễ vật rượu của chúng, dành cho bò đực, chiên đực và chiên con, theo số lượng của chúng, đúng theo thể lệ đã quy định.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “theo thể lệ đã ấn định.” Từ Hê-bơ-rơ כַּמִּשְׁפָּט nói đến quy tắc hoặc thủ tục đã được thiết lập cho các lễ vật này.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנְחָתָם
  choice: lễ vật ngũ cốc của chúng
  rationale: Trong ngữ cảnh tế lễ, מִנְחָה chỉ lễ vật bằng ngũ cốc đi kèm sinh tế; cách dịch này chính xác và dễ hiểu.
- source_word: נִסְכֵּיהֶם
  choice: các lễ quán của chúng
  rationale: נֶסֶךְ là lễ vật dạng chất lỏng được rót ra; “lễ quán” là thuật ngữ trang trọng, gọn và phù hợp văn cảnh nghi lễ.
- source_word: לַפָּרִים
  choice: dành cho những con bò đực
  rationale: 'Tiền tố ל biểu thị mối liên hệ phân bổ: các lễ vật đi kèm tương ứng với những con bò đực.'
- source_word: לָאֵילִם
  choice: những con chiên đực
  rationale: אֵילִים chỉ các con chiên đực trưởng thành dùng làm sinh tế; giới từ “dành cho” ở đầu danh sách chi phối cả cụm liệt kê.
- source_word: וְלַכְּבָשִׂים
  choice: và những con chiên con
  rationale: כְּבָשִׂים trong luật tế lễ thường chỉ chiên con; cách dịch giữ rõ sự phân biệt với אֵילִים.
- source_word: בְּמִסְפָּרָם
  choice: tùy theo số lượng của chúng
  rationale: Cụm từ cho biết lượng lễ vật đi kèm phải tương ứng với số sinh tế; “tùy theo” diễn đạt tự nhiên ý phân bổ.
- source_word: כַּמִּשְׁפָּט
  choice: đúng như quy định
  rationale: מִשְׁפָּט ở đây chỉ thể lệ hay thủ tục tế lễ đã được ấn định; cách dịch tự nhiên nhưng vẫn giữ sắc thái pháp quy.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng thuật ngữ tế lễ “lễ vật ngũ cốc” và “lễ quán”; cấu trúc câu nối tiếp mạch liệt kê của các câu lân cận. Dấu chú thích [a] được đặt ngay sau cụm từ mà chú thích giải nghĩa.
