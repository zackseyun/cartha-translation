  - severity: low
    issue: Cụm “những con bò đực, những con chiên đực và những con chiên con” hơi nặng trong một danh sách nghi lễ.
    rationale: Tiếng Việt có thể liệt kê “bò đực, chiên đực và chiên con” mà vẫn giữ nguyên sự phân biệt từ vựng của bản gốc.
