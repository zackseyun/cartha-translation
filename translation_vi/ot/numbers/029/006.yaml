  to: Ngoài lễ thiêu của tháng cùng lễ vật ngũ cốc của lễ ấy, lễ thiêu thường xuyên cùng lễ vật ngũ cốc của lễ ấy, và các lễ quán của chúng, theo quy định của chúng, có hương thơm đẹp lòng, là lễ vật dâng bằng lửa cho Yahweh.[a]
  rationale: 'Bản sửa giữ trật tự và mọi thành tố của tiếng Hê-bơ-rơ: “ngoài/bên cạnh”, hai lễ thiêu với lễ vật ngũ cốc tương ứng, các lễ quán, quy định của chúng, hương thơm đẹp lòng, lễ vật dâng bằng lửa, và Yahweh. Câu cuối được làm tự nhiên hơn; ghi chú được điều chỉnh để không biến một nhận định theo văn mạch thành khẳng định trực tiếp của nguyên văn, đồng thời đánh dấu sự bất định hợp lý quanh אִשֶּׁה.'
