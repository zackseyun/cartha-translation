base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/006.yaml
  text: besides the burnt offering of the month and its grain offering[a], and the regular burnt offering and its grain offering, and their drink offerings, according to their ordinance, as a pleasing aroma[b], a food offering to Yahweh.
translation:
  language: vi
  text: Ngoài lễ thiêu của tháng cùng lễ vật ngũ cốc của lễ ấy, lễ thiêu thường xuyên cùng lễ vật ngũ cốc của lễ ấy, và các lễ quán của chúng, theo quy định của chúng, có hương thơm đẹp lòng, là lễ vật dâng bằng lửa cho Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Lễ thiêu của tháng” theo nghĩa đen là “lễ thiêu của tháng”; trong ngữ cảnh, có lẽ chỉ lễ thiêu vào ngày đầu tháng. “Lễ vật dâng bằng lửa” cũng có thể được hiểu là “lễ vật thực phẩm”.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִלְּבַד
  choice: ngoài
  rationale: Diễn tả các lễ vật này được dâng thêm bên cạnh những lễ vật đã quy định; cách nói ngắn gọn và tự nhiên trong tiếng Việt.
- source_word: עֹלַת הַחֹדֶשׁ
  choice: lễ thiêu hằng tháng
  rationale: Cụm Hê-bơ-rơ có nghĩa sát là “lễ thiêu của tháng” và trong ngữ cảnh chỉ lễ đầu tháng; “hằng tháng” tự nhiên mà không đưa “trăng non” vào chính văn.
- source_word: מִנְחָתָהּ
  choice: lễ vật ngũ cốc đi kèm
  rationale: Trong ngữ cảnh tế lễ, מִנְחָה là lễ vật bằng ngũ cốc; thêm “đi kèm” làm rõ quan hệ của hậu tố sở hữu với lễ thiêu mà không thay đổi nội dung.
- source_word: עֹלַת הַתָּמִיד
  choice: lễ thiêu thường xuyên
  rationale: תָּמִיד nhấn mạnh tính liên tục, đều đặn theo quy định; “thường xuyên” giữ được ý này mà không diễn giải quá mức thành “hằng ngày”.
- source_word: וְנִסְכֵּיהֶם
  choice: và các lễ quán của chúng
  rationale: נֶסֶךְ là lễ dâng chất lỏng bằng cách rót; “lễ quán” là thuật ngữ tiếng Việt gọn và thích hợp với văn cảnh nghi lễ.
- source_word: כְּמִשְׁפָּטָם
  choice: theo đúng quy định dành cho chúng
  rationale: Trong văn cảnh tế tự, מִשְׁפָּט là thể lệ đã được ấn định; cách dịch này rõ nghĩa và bảo toàn hậu tố số nhiều.
- source_word: לְרֵיחַ נִיחֹחַ
  choice: làm hương thơm đẹp lòng
  rationale: Giữ hình ảnh mùi hương và ý được chấp nhận, đẹp lòng Đức Chúa Trời trong công thức tế lễ.
- source_word: אִשֶּׁה
  choice: lễ vật dâng bằng lửa
  rationale: Thuật ngữ tế lễ này gắn với việc dâng trong lửa. Cách dịch bảo toàn yếu tố lửa rõ hơn “lễ vật thực phẩm”, vốn có thể bị hiểu rộng hơn chứng cứ từ nguyên bản.
- source_word: לַיהוָה
  choice: lên Yahweh
  rationale: Giữ tên giao ước יהוה dưới dạng Yahweh; “dâng ... lên” là cách diễn đạt tự nhiên cho hướng quy thuộc của lễ vật.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC CHÚA / Giê-hô-va
  rationale: Nguyên bản dùng trực tiếp danh riêng giao ước; phiên âm “Yahweh” phân biệt danh này với tước hiệu “Chúa” và không che khuất tên riêng.
- issue: Cách hiểu אִשֶּׁה
  choice: lễ vật dâng bằng lửa
  alternative: lễ vật thực phẩm
  rationale: Nghĩa chính xác của thuật ngữ tế lễ này còn được bàn luận. Bản dịch giữ mối liên hệ hiển nhiên với lửa, thay vì quyết định dứt khoát rằng đây là “thực phẩm” dành cho Đức Chúa Trời.
translation_notes:
  register: Văn phong trang trọng, hiện đại, phù hợp bản liệt kê nghi lễ. Dùng nhất quán “lễ thiêu”, “lễ vật ngũ cốc” và “lễ quán”; tránh lối Hán-Việt quá cổ, ngoại trừ thuật ngữ tế lễ quen dùng “lễ quán”.
