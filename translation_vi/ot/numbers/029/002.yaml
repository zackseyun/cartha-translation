id: NUM.29.2
reference: Numbers 29:2
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/עֲשִׂיתֶ֨ם עֹלָ֜ה לְ/רֵ֤יחַ נִיחֹ֨חַ֙ לַֽ/יהוָ֔ה פַּ֧ר בֶּן בָּקָ֛ר אֶחָ֖ד אַ֣יִל אֶחָ֑ד כְּבָשִׂ֧ים בְּנֵי שָׁנָ֛ה שִׁבְעָ֖ה תְּמִימִֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/002.yaml
  text: 'And you shall offer a burnt offering as a pleasing aroma to Yahweh: one bull from the herd[a], one ram, and seven male lambs a year old, without blemish.'
translation:
  language: vi
  text: 'Anh em phải dâng một lễ thiêu, để có hương thơm đẹp lòng Yahweh: một con bò đực, một con cừu đực và bảy con chiên con đực một tuổi, tất cả đều không tì vết.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “hương thơm êm dịu” hoặc “hương thơm dễ chịu”. Đây là một công thức tế lễ cố định trong tiếng Hê-bơ-rơ, cho biết lễ vật được Yahweh vui nhận.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲשִׂיתֶם
  choice: anh em phải dâng
  rationale: Động từ có nghĩa cơ bản là “làm”, nhưng khi đi với עֹלָה trong ngữ cảnh tế lễ thì mang nghĩa dâng lễ vật. “Anh em” thể hiện ngôi thứ hai số nhiều bằng lối nói tiếng Việt hiện đại.
- source_word: עֹלָה
  choice: lễ thiêu
  rationale: Thuật ngữ chỉ lễ vật được thiêu trọn trên bàn thờ; “lễ thiêu” ngắn gọn, rõ nghĩa và phù hợp văn phong Kinh Thánh tiếng Việt.
- source_word: לְרֵיחַ נִיחֹחַ
  choice: làm hương thơm đẹp lòng
  rationale: Cách diễn đạt này giữ hình ảnh khứu giác của công thức tế lễ, đồng thời truyền đạt rằng lễ vật được Yahweh vui nhận, chứ không thô thiển hóa thành sự khoái thích mùi hương theo nghĩa vật chất.
- source_word: לַיהוָה
  choice: Yahweh
  rationale: Giữ danh riêng giao ước được biểu thị bằng Tetragrammaton, thay vì thay thế bằng một tước hiệu.
- source_word: פַּר בֶּן בָּקָר אֶחָד
  choice: một con bò đực
  rationale: Cụm Hê-bơ-rơ xác định một con bò đực thuộc đàn gia súc; trong tiếng Việt, “một con bò đực” truyền đạt đầy đủ và tự nhiên mà không cần dịch từng chữ “con của đàn bò”.
- source_word: אַיִל אֶחָד
  choice: một con cừu đực
  rationale: אַיִל trong danh sách tế lễ chỉ cừu đực trưởng thành.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה שִׁבְעָה
  choice: bảy con chiên đực một tuổi
  rationale: Bản dịch giữ số lượng, giới tính của danh từ trong ngữ cảnh tế lễ và độ tuổi được chỉ định.
- source_word: תְּמִימִם
  choice: tất cả đều không tì vết
  rationale: Trong luật tế lễ, từ này chỉ tình trạng không có khuyết tật; thêm “tất cả đều” làm rõ tính từ số nhiều áp dụng cho toàn bộ các con vật vừa liệt kê.
theological_decisions:
- issue: Cách thể hiện danh יהוה
  choice: Yahweh
  alternative: CHÚA; Đức Giê-hô-va
  rationale: Nguyên văn dùng trực tiếp danh giao ước יהוה. Phiên âm “Yahweh” bảo tồn chức năng danh riêng và tránh biến danh ấy thành tước hiệu.
- issue: Ý nghĩa của רֵיחַ נִיחֹחַ
  choice: hương thơm đẹp lòng
  alternative: hương thơm êm dịu; hương thơm dễ chịu
  rationale: Giữ nguyên hình ảnh tế lễ và ý niệm được Đức Chúa Trời vui nhận, nhưng không giải thích vượt quá công thức Hê-bơ-rơ ngay trong chính văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” để thể hiện đại từ ngôi thứ hai số nhiều mà không dùng lối cổ “các ngươi”; cấu trúc câu vẫn bám sát thứ tự và nội dung của bản Hê-bơ-rơ.
