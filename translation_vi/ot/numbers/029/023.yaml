    rationale: Tính từ số nhiều תְּמִימִם đứng sau cụm “mười bốn con chiên con một tuổi” và trong cách liệt kê này bổ nghĩa trực tiếp cho nhóm chiên con. Bản tiếng Anh audit trail cũng giữ “fourteen one-year-old lambs without blemish.” Thêm “tất cả đều” là một sự mở rộng diễn giải không cần thiết.
