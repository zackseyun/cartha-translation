base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/023.yaml
  text: 'And on the fourth day: ten bulls, two rams, fourteen one-year-old lambs without blemish,'
translation:
  language: vi
  text: 'Và vào ngày thứ tư: mười con bò đực, hai con chiên đực và mười bốn con chiên con một tuổi, không tì vết.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבַיּוֹם הָרְבִיעִי
  choice: Vào ngày thứ tư
  rationale: Công thức thời gian mở đầu mục kế tiếp trong chuỗi nghi lễ. Tiếng Việt không cần dịch riêng liên từ וְ; mạch liệt kê vẫn rõ ràng và tự nhiên.
- source_word: פָּרִים עֲשָׂרָה
  choice: mười con bò đực
  rationale: פָּרִים trong ngữ cảnh tế lễ chỉ bò đực; lượng từ “con” phù hợp với tiếng Việt hiện đại.
- source_word: אֵילִם שְׁנָיִם
  choice: hai con chiên đực
  rationale: אֵילִם chỉ chiên đực trưởng thành, được phân biệt với chiên con trong cùng câu.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה אַרְבָּעָה עָשָׂר
  choice: mười bốn con chiên con một tuổi
  rationale: כְּבָשִׂים là chiên con, còn thành ngữ בְּנֵי שָׁנָה diễn tả độ tuổi một năm; trật tự được điều chỉnh cho tự nhiên trong tiếng Việt.
- source_word: תְּמִימִם
  choice: tất cả đều không tì vết
  rationale: Trong luật tế lễ, từ này nói đến các con vật không có khuyết tật. Thêm “tất cả đều” làm rõ tính từ số nhiều áp dụng cho toàn bộ danh sách mà không thay đổi nội dung.
