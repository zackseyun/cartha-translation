translation:
  language: vi
  text: Và một con dê đực làm lễ vật chuộc tội, ngoài lễ thiêu thường xuyên cùng lễ vật ngũ cốc và lễ quán của lễ ấy.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/שְׂעִיר
  choice: cùng một con dê đực
  rationale: שָׂעִיר chỉ dê đực; tiền tố וּ nối lễ vật này với danh sách trước đó. “Cùng” diễn đạt tự nhiên quan hệ bổ sung trong câu.
- source_word: חַטָּאת
  choice: làm lễ vật chuộc tội
  rationale: Trong ngữ cảnh tế lễ, חַטָּאת chỉ lễ vật dâng vì tội, không đơn thuần là khái niệm “tội lỗi”.
- source_word: אֶחָד
  choice: một
  rationale: Giữ rõ số lượng con vật theo nguyên văn.
- source_word: מִ/לְּ/בַד
  choice: ngoài
  rationale: Cụm giới từ cho biết lễ vật vừa nêu được dâng thêm bên cạnh các lễ vật thường xuyên.
- source_word: עֹלַת
  choice: lễ thiêu
  rationale: Đây là thuật ngữ tế lễ quen dùng cho עֹלָה, lễ vật được thiêu trên bàn thờ.
- source_word: הַ/תָּמִיד
  choice: thường xuyên
  rationale: תָּמִיד mô tả lễ thiêu được dâng đều đặn, liên tục theo quy định; cách dịch này giữ được sắc thái mà không thu hẹp thành chỉ “hằng ngày”.
- source_word: וּ/מִנְחָתָהּ
  choice: lễ vật ngũ cốc đi kèm lễ thiêu ấy
  rationale: מִנְחָה trong luật tế lễ là lễ vật bằng ngũ cốc. Hậu tố giống cái số ít quy chiếu về עֹלָה; diễn đạt rõ đối tượng quy chiếu để tiếng Việt tự nhiên và tránh mơ hồ.
- source_word: וְ/נִסְכָּהּ
  choice: lễ quán đi kèm lễ thiêu ấy
  rationale: נֶסֶךְ là lễ vật dạng chất lỏng được rót ra. “Lễ quán” là thuật ngữ Việt ngắn gọn, trang trọng; phần diễn đạt đi kèm làm rõ hậu tố quy chiếu về lễ thiêu.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “lễ vật chuộc tội” thay vì cách nói có thể bị hiểu là chính nghi lễ tự động xóa tội. Các hậu tố sở hữu giống cái trong tiếng Hê-bơ-rơ được diễn đạt bằng “đi kèm lễ thiêu ấy” để làm rõ chúng quy chiếu về lễ thiêu thường xuyên.
