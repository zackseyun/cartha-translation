  yaml_path: translation/ot/numbers/029/031.yaml
  text: and one goat for a sin offering[a], besides the regular burnt offering[b], with its grain offering and its drink offerings.
translation:
  language: vi
  text: Và một con dê đực làm lễ vật chuộc tội, ngoài lễ thiêu thường lệ[a], cùng với lễ vật ngũ cốc và các lễ rưới đi kèm lễ thiêu ấy[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “lễ thiêu liên tục.”'
    reason: lexical_alternative
  - marker: b
    text: “Lễ rưới” là lễ vật dạng lỏng được đổ hoặc rưới ra; cũng thường được gọi là “lễ quán.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂעִיר
  choice: con dê đực
  rationale: Trong ngữ cảnh tế lễ, từ này chỉ một con dê, thường là dê đực; nêu rõ giới tính vừa sát nghĩa vừa tự nhiên trong tiếng Việt.
- source_word: חַטָּאת
  choice: lễ vật chuộc tội
  rationale: Ở đây danh từ chỉ sinh tế dâng vì tội lỗi, không phải khái niệm trừu tượng về tội; cách dịch này rõ nghĩa trong ngữ cảnh nghi lễ.
- source_word: אֶחָד
  choice: một
  rationale: Số từ xác định số lượng con dê.
- source_word: מִלְּבַד
  choice: ngoài
  rationale: Diễn tả lễ vật vừa nêu được dâng thêm, không thay thế lễ thiêu theo lệ thường.
- source_word: עֹלַת הַתָּמִיד
  choice: lễ thiêu thường xuyên
  rationale: Cụm từ chỉ lễ thiêu được dâng đều đặn theo quy định; “thường xuyên” truyền đạt tính lặp lại liên tục mà vẫn tự nhiên trong tiếng Việt hiện đại.
- source_word: מִנְחָתָהּ
  choice: lễ vật ngũ cốc của lễ thiêu ấy
  rationale: Trong danh sách tế lễ, מִנְחָה là lễ vật ngũ cốc đi kèm; hậu tố giống cái số ít quy chiếu về עֹלָה, nên cần làm rõ là lễ vật thuộc lễ thiêu ấy.
- source_word: וּנְסָכֶיהָ
  choice: và các lễ rưới của lễ thiêu ấy
  rationale: נֶסֶךְ chỉ lễ vật dạng lỏng được rưới ra; dạng số nhiều và hậu tố sở hữu được thể hiện bằng “các” và cụm “của lễ thiêu ấy”.
theological_decisions: []
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại. Dùng “lễ thiêu,” “lễ vật chuộc tội” và “lễ vật ngũ cốc” để giữ thuật ngữ nghi lễ rõ ràng; dùng “lễ rưới” thay cho riêng từ Hán-Việt “lễ quán” nhằm giúp độc giả phổ thông dễ hiểu. Các dấu chú thích được đặt đúng tại những từ có phương án dịch thay thế; cách gắn chú thích trong lớp tham khảo tiếng Anh dường như bị lệch so với nội dung chú thích.
