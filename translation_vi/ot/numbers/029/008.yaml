source:
  edition: WLC
  text: וְ/הִקְרַבְתֶּ֨ם עֹלָ֤ה לַֽ/יהוָה֙ רֵ֣יחַ נִיחֹ֔חַ פַּ֧ר בֶּן בָּקָ֛ר אֶחָ֖ד אַ֣יִל אֶחָ֑ד כְּבָשִׂ֤ים בְּנֵֽי שָׁנָה֙ שִׁבְעָ֔ה תְּמִימִ֖ם יִהְי֥וּ לָ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/008.yaml
  text: 'You shall present a burnt offering to Yahweh[a], a pleasing aroma: one bull from the herd, one ram, and seven male lambs a year old; they shall be without blemish for you.'
translation:
  language: vi
  text: 'Các ngươi phải dâng cho Yahweh một lễ thiêu có hương thơm đẹp lòng[a]: một con bò đực từ đàn, một con chiên đực, và bảy con chiên đực một tuổi. Chúng phải không tì vết cho các ngươi[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “hương thơm êm dịu”. Cụm từ Hê-bơ-rơ này là một cách nói cố định trong nghi lễ tế lễ, chỉ lễ vật được Yahweh chấp nhận.
    reason: lexical_alternative
  - marker: b
    text: 'Hoặc: “phải là những con không tì vết cho các ngươi”. Cụm “cho các ngươi” dịch sát tiếng Hê-bơ-rơ; nó nhấn mạnh yêu cầu áp dụng cho những người dâng lễ vật.'
    reason: source_language_clarification
lexical_decisions:
- source_word: וְהִקְרַבְתֶּם
  choice: Các ngươi phải dâng lên
  rationale: Thể Hiphil của קרב trong ngữ cảnh tế lễ có nghĩa là đem đến hoặc dâng lễ vật. “Dâng lên” tự nhiên trong tiếng Việt và giữ được sắc thái thờ phượng.
- source_word: עֹלָה
  choice: một lễ thiêu
  rationale: Thuật ngữ chỉ lễ vật được thiêu trọn trên bàn thờ. “Lễ thiêu” là cách gọi rõ ràng, quen thuộc và phù hợp với ngữ cảnh tế lễ.
- source_word: לַיהוָה
  choice: lên Yahweh
  rationale: Giới từ ל đánh dấu Đấng tiếp nhận lễ vật; danh riêng יהוה được phiên âm là “Yahweh” để bảo tồn danh giao ước xuất hiện trực tiếp trong bản Hê-bơ-rơ.
- source_word: רֵיחַ נִיחֹחַ
  choice: hương thơm đẹp lòng Ngài
  rationale: Đây là thành ngữ tế lễ cố định, diễn tả lễ vật được Đức Chúa Trời chấp nhận. Cách dịch này giữ hình ảnh mùi hương nhưng tránh hiểu thuần túy theo giác quan.
- source_word: פַּר בֶּן בָּקָר אֶחָד
  choice: một con bò đực thuộc đàn bò
  rationale: Cụm từ theo sát nghĩa là “một bò đực, con của đàn bò”; cách diễn đạt này tự nhiên hơn trong tiếng Việt mà vẫn giữ thông tin về loại vật tế.
- source_word: אַיִל אֶחָד
  choice: một con chiên đực
  rationale: אַיִל chỉ chiên đực trưởng thành trong danh sách tế lễ.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה שִׁבְעָה
  choice: bảy con chiên con đực một tuổi
  rationale: כְּבָשִׂים là chiên con giống đực, còn בְּנֵי שָׁנָה là thành ngữ chỉ con vật một tuổi.
- source_word: תְּמִימִם
  choice: không tì vết
  rationale: Trong luật tế lễ, từ này chỉ con vật không có khuyết tật; “không tì vết” là cách diễn đạt chính xác và quen thuộc.
- source_word: יִהְיוּ לָכֶם
  choice: Chúng phải là những con không tì vết
  rationale: Cấu trúc diễn tả yêu cầu đối với các con vật do cộng đồng chuẩn bị. Dịch thành mệnh lệnh tự nhiên trong tiếng Việt; ý của לָכֶם được thể hiện qua việc quy trách nhiệm chuẩn bị cho người nghe.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA; CHÚA
  rationale: Bản nguồn dùng trực tiếp danh giao ước יהוה. Phiên âm “Yahweh” bảo tồn tính chất danh riêng mà không thay bằng một tước hiệu.
- issue: Ý nghĩa của רֵיחַ נִיחֹחַ
  choice: hương thơm đẹp lòng Ngài
  alternative: hương thơm êm dịu; hương thơm làm nguôi
  rationale: Cách dịch được chọn giữ nguyên ẩn dụ tế lễ và nhấn mạnh sự chấp nhận của Đức Chúa Trời, nhưng không khẳng định rằng lễ vật có tác dụng làm nguôi cơn giận trong câu này.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “các ngươi” để phản ánh ngôi thứ hai số nhiều trong lời quy định dành cho cộng đồng; thuật ngữ tế lễ được giữ nhất quán nhưng tránh lối diễn đạt Hán-Việt quá cổ.
