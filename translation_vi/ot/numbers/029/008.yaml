revisions:
- from: 'Các ngươi phải dâng lên Yahweh một lễ thiêu, là hương thơm đẹp lòng Ngài[a]: một con bò đực thuộc đàn bò, một con chiên đực và bảy con chiên con đực một tuổi. Chúng phải là những con không tì vết.'
  to: 'Các ngươi phải dâng cho Yahweh một lễ thiêu có hương thơm đẹp lòng[a]: một con bò đực từ đàn, một con chiên đực, và bảy con chiên đực một tuổi. Chúng phải không tì vết cho các ngươi[b].'
  rationale: Bản sửa giữ nguyên nội dung và trật tự cơ bản của câu nguồn, cải thiện vài cách diễn đạt cho tự nhiên hơn, và bổ sung việc biểu đạt lָכֶם bằng một chú thích giải thích. Không thay đổi hay mở rộng ý nghĩa thần học của thành ngữ tế lễ.
  reviewer_model: gpt-5.6-terra
