revisions:
- from: Trong tháng thứ bảy, vào ngày mồng một của tháng, anh em phải có một cuộc hội họp thánh. Anh em không được làm bất cứ công việc lao động nào. Đó sẽ là ngày thổi tiếng vang[a] cho anh em.
  to: Trong tháng thứ bảy, vào ngày mồng một của tháng, anh em phải có một cuộc hội họp thánh. Anh em không được làm công việc lao động thường lệ. Đó sẽ là một ngày có tiếng hô vang[a] cho anh em.
  rationale: Sửa cách dịch יוֹם תְּרוּעָה thành “một ngày có tiếng hô vang” để tiếng Việt tự nhiên và phản ánh nghĩa rộng, chưa xác định nhạc cụ, của teruah. Chú thích bảo tồn các cách hiểu “hiệu kèn,” “reo hò,” và “tung hô.” Điều chỉnh nhẹ cụm chỉ công việc bị cấm để phản ánh sắc thái công việc thường lệ/phục dịch trong luật lễ hội.
