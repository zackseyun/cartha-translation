source:
  edition: WLC
  text: וּ/בַ/חֹ֨דֶשׁ הַ/שְּׁבִיעִ֜י בְּ/אֶחָ֣ד לַ/חֹ֗דֶשׁ מִֽקְרָא קֹ֨דֶשׁ֙ יִהְיֶ֣ה לָ/כֶ֔ם כָּל מְלֶ֥אכֶת עֲבֹדָ֖ה לֹ֣א תַעֲשׂ֑וּ י֥וֹם תְּרוּעָ֖ה יִהְיֶ֥ה לָ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/001.yaml
  text: And in the seventh month, on the first day of the month, you shall have a holy convocation. You shall do no laborious work. It shall be a day of trumpet-blast for you.
translation:
  language: vi
  text: Trong tháng thứ bảy, vào ngày mồng một của tháng, anh em phải có một cuộc hội họp thánh. Anh em không được làm công việc lao động thường lệ. Đó sẽ là một ngày có tiếng hô vang[a] cho anh em.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “ngày có hiệu kèn,” “ngày reo hò” hoặc “ngày tung hô.” Từ Hê-bơ-rơ teruah chỉ một âm thanh lớn được cất lên; tùy ngữ cảnh, nó có thể là hiệu kèn, tiếng hô hoặc tiếng tung hô.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַחֹדֶשׁ הַשְּׁבִיעִי
  choice: Trong tháng thứ bảy
  rationale: Giới từ ב mang nghĩa thời gian, còn ו nối tiếp chuỗi luật lệ; tiếng Việt không cần dịch máy móc ו thành “và” ở đầu câu.
- source_word: בְּאֶחָד לַחֹדֶשׁ
  choice: vào ngày mồng một của tháng
  rationale: Đây là cách nói lịch pháp Hê-bơ-rơ chỉ ngày đầu tiên của tháng; “ngày mồng một” tự nhiên và rõ nghĩa trong tiếng Việt.
- source_word: מִקְרָא קֹדֶשׁ
  choice: một cuộc hội họp thánh
  rationale: Cụm từ chỉ một cuộc tụ họp được chính thức triệu tập cho mục đích thánh; cách dịch này vừa gần cấu trúc nguồn vừa dễ hiểu.
- source_word: כָּל מְלֶאכֶת עֲבֹדָה
  choice: bất cứ công việc lao động nào
  rationale: Cụm từ nói đến công việc lao động thường nhật bị cấm trong ngày lễ, chứ không nhất thiết cấm tuyệt đối mọi hoạt động.
- source_word: יוֹם תְּרוּעָה
  choice: ngày thổi tiếng vang
  rationale: תְּרוּעָה chỉ một âm thanh lớn được cất lên, có thể là tiếng tù và/kèn, tiếng hô hoặc tiếng tung hô. “Thổi tiếng vang” phù hợp bối cảnh nghi lễ mà không đưa tên nhạc cụ vốn không có trong câu Hê-bơ-rơ vào chính văn.
- source_word: יִהְיֶה לָכֶם
  choice: Đó sẽ là ... cho anh em
  rationale: Giữ ý ngày ấy được ấn định cho cộng đồng; “anh em” diễn đạt ngôi thứ hai số nhiều bằng lối trang trọng, tự nhiên.
theological_decisions:
- issue: Cách dịch tên gọi יוֹם תְּרוּעָה
  choice: ngày thổi tiếng vang
  alternative: ngày thổi tù và; ngày reo hò; ngày tung hô
  rationale: Nguyên văn đặt tên ngày lễ theo âm thanh đặc trưng nhưng không nêu trực tiếp nhạc cụ. Chính văn giữ nét nghi lễ và độ rộng nghĩa; chú thích bảo tồn các khả năng từ vựng khác thay vì áp đặt một danh xưng lễ hội về sau.
translation_notes:
  register: Văn phong luật lệ trang trọng nhưng hiện đại. “Anh em” được dùng cho ngôi thứ hai số nhiều; “cuộc hội họp thánh” tránh thuật ngữ cổ khó hiểu. Dấu chú thích [a] xuất hiện ngay sau cụm từ có nghĩa đa trị.
