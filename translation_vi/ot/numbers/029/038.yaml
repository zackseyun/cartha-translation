  text: and one goat for a sin offering[b][a], besides the regular burnt offering and its grain offering and its drink offering.
translation:
  language: vi
  text: và một con dê đực làm lễ vật chuộc tội, ngoài lễ vật thiêu thường xuyên, cùng lễ vật ngũ cốc và lễ quán đi kèm lễ vật thiêu ấy.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/שְׂעִיר
  choice: và một con dê đực
  rationale: Trong ngữ cảnh tế lễ, שָׂעִיר chỉ dê đực; dịch rõ giới tính vừa sát nguồn Hê-bơ-rơ vừa tự nhiên trong tiếng Việt.
- source_word: חַטָּאת
  choice: làm lễ vật chuộc tội
  rationale: Trong văn cảnh tế lễ, חַטָּאת chỉ lễ vật dâng vì tội, không đơn thuần là khái niệm trừu tượng 'tội lỗi'.
- source_word: אֶחָד
  choice: một
  rationale: Số từ xác định số lượng con vật hiến tế.
- source_word: מִ/לְּ/בַד
  choice: ngoài
  rationale: Cho biết lễ vật này được dâng thêm, không thay thế lễ vật thường xuyên đã quy định.
- source_word: עֹלַת הַ/תָּמִיד
  choice: lễ vật thiêu thường xuyên
  rationale: עֹלָה là lễ vật được thiêu; הַתָּמִיד nhấn mạnh tính đều đặn, liên tục theo lịch tế lễ.
- source_word: וּ/מִנְחָתָ/הּ
  choice: cùng lễ vật ngũ cốc ... của lễ vật ấy
  rationale: Trong ngữ cảnh tư tế, מִנְחָה là lễ vật bằng ngũ cốc; hậu tố giống cái số ít quy chiếu về עֹלָה.
- source_word: וְ/נִסְכָּ/הּ
  choice: và lễ quán của lễ vật ấy
  rationale: נֶסֶךְ là phần chất lỏng được rưới trong nghi lễ; 'lễ quán' là cách gọi gọn và trang trọng, còn cụm quy chiếu làm rõ hậu tố giống cái số ít.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dịch שָׂעִיר cụ thể là 'dê đực' nên không cần chú thích từ vựng. Dùng 'thường xuyên' để giữ sắc thái đều đặn/liên tục của תָּמִיד mà không thu hẹp thành riêng 'hằng ngày'. Lặp 'của lễ vật ấy' một lần ở cuối để tiếng Việt tự nhiên và để cả hai thành phần đi kèm đều quy chiếu rõ về lễ vật thiêu.
