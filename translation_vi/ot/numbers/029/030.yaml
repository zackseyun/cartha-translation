base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/030.yaml
  text: and their grain offering and their drink offerings for the bulls[a], for the rams, and for the lambs, according to their number, according to the ordinance.
translation:
  language: vi
  text: cùng với lễ vật ngũ cốc và các lễ quán của chúng, dành cho các con bò đực, các con chiên đực và các chiên con, theo số lượng của chúng và đúng quy định.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “theo thể thức đã định.” Từ Hê-bơ-rơ כַּמִּשְׁפָּט nói đến quy tắc đã được thiết lập về cách dâng các lễ vật này.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנְחָתָם
  choice: lễ vật ngũ cốc
  rationale: Trong ngữ cảnh tế lễ, מִנְחָה chỉ lễ vật làm từ ngũ cốc hơn là lễ vật nói chung; dạng số ít mang nghĩa tập hợp được diễn đạt tự nhiên trong tiếng Việt.
- source_word: נִסְכֵּיהֶם
  choice: các lễ quán của chúng
  rationale: נֶסֶךְ là lễ vật dạng chất lỏng được rưới hoặc đổ kèm theo sinh tế; “lễ quán” là cách gọi trang trọng, tương đối gọn và có tính chuyên biệt trong ngữ cảnh tế lễ.
- source_word: לַפָּרִים
  choice: dành cho các con bò đực
  rationale: פַּר chỉ bò đực trong danh sách sinh tế; nguyên văn không minh nhiên nêu tuổi nên không thêm “tơ” hay “non”.
- source_word: לָאֵילִם
  choice: các con chiên đực
  rationale: אַיִל chỉ chiên đực trưởng thành trong ngữ cảnh tế lễ.
- source_word: וְלַכְּבָשִׂים
  choice: và các chiên con
  rationale: כֶּבֶשׂ chỉ chiên con, thường là con đực trong nghi lễ, nhưng câu này không cần diễn giải thêm giới tính.
- source_word: בְּמִסְפָּרָם
  choice: theo số lượng của chúng
  rationale: Cụm từ nói đến sự tương ứng với số con vật đã được ấn định; cách diễn đạt này vừa sát nghĩa vừa tự nhiên.
- source_word: כַּמִּשְׁפָּט
  choice: đúng quy định
  rationale: מִשְׁפָּט ở đây là quy tắc hay thể thức đã được thiết lập cho việc dâng lễ, không đơn thuần là phong tục.
