translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ cấu trúc liệt kê của nguyên văn, đồng thời dùng thuật ngữ tế lễ nhất quán. Dấu chú thích [a] được đặt ngay sau cụm từ mà chú thích giải thích.
