translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ cấu trúc câu nối tiếp của danh sách nghi lễ; dùng “lễ quán” như một thuật ngữ tế lễ ngắn gọn, còn “đúng như quy định” chuyển tải sắc thái pháp quy của vế cuối mà không diễn giải quá mức.
