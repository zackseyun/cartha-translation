  text: and their grain offerings and their drink offerings for the bulls[a], for the rams, and for the lambs, according to their number, according to the ordinance;
translation:
  language: vi
  text: cùng các lễ vật ngũ cốc và các lễ dâng thức uống của chúng, dành cho bò đực, chiên đực và chiên con, theo số lượng của chúng, theo quy định[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “theo thể lệ đã quy định.” Từ Hê-bơ-rơ chỉ quy tắc nghi lễ đã được ấn định cho các lễ vật này.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנְחָתָם
  choice: các lễ vật ngũ cốc của chúng
  rationale: Trong văn cảnh tế lễ, מִנְחָה chỉ lễ vật bằng ngũ cốc đi kèm các sinh tế. Dùng số nhiều theo ý nghĩa phân phối của danh từ tập hợp có hậu tố số nhiều, phù hợp với nhiều con vật được liệt kê.
- source_word: נִסְכֵּיהֶם
  choice: các lễ quán của chúng
  rationale: נֶסֶךְ là lễ dâng chất lỏng bằng cách rưới hoặc đổ. “Lễ quán” là thuật ngữ Kinh Thánh trang trọng và gọn, diễn đạt hành động nghi lễ này.
- source_word: לַפָּרִים
  choice: dành cho những con bò đực
  rationale: פָּרִים là bò đực dùng làm sinh tế; nguyên văn không thêm từ chỉ tuổi nên không dịch là “bò đực tơ”.
- source_word: לָאֵילִם
  choice: những con chiên đực
  rationale: אַיִל trong danh sách sinh tế có nghĩa rõ ràng là chiên đực trưởng thành.
- source_word: וְלַכְּבָשִׂים
  choice: và những con chiên con
  rationale: כֶּבֶשׂ chỉ chiên con; không thêm giới tính vì câu này không nêu rõ và văn cảnh đã quy định chi tiết ở các câu trước.
- source_word: בְּמִסְפָּרָם
  choice: theo số lượng của chúng
  rationale: Cụm từ biểu thị sự tương ứng với số lượng đã ấn định cho từng loại sinh tế.
- source_word: כַּמִּשְׁפָּט
  choice: đúng như quy định
  rationale: מִשְׁפָּט ở đây chỉ quy tắc nghi lễ đã được thiết lập. Cách dịch này tự nhiên trong tiếng Việt và vẫn giữ sắc thái bắt buộc, chính thức.
