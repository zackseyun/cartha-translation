base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/033.yaml
  text: and their grain offering and their drink offerings for the bulls[a], for the rams, and for the lambs, according to their number, according to the ordinance.
translation:
  language: vi
  text: Cùng với lễ vật ngũ cốc và các lễ rưới tương ứng cho bò đực, chiên đực và chiên con, theo số lượng của từng loại và theo thể lệ áp dụng cho từng loại.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc dịch: “theo số lượng của chúng và theo quy định của chúng.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנְחָתָם
  choice: lễ vật ngũ cốc… kèm theo
  rationale: Trong ngữ cảnh tế lễ, מִנְחָה là lễ vật bằng ngũ cốc đi kèm sinh tế. Cách dịch giữ ý nghĩa chuyên biệt và xem dạng số ít là một danh từ tập hợp.
- source_word: נִסְכֵּיהֶם
  choice: các lễ rưới kèm theo
  rationale: נֶסֶךְ chỉ lễ vật dạng lỏng được rưới hoặc đổ ra. “Lễ rưới” rõ nghĩa hơn thuật ngữ cổ “lễ quán”; “các” phản ánh dạng số nhiều trong tiếng Hê-bơ-rơ.
- source_word: לַפָּרִים
  choice: dành cho bò đực
  rationale: פָּרִים trong danh sách tế lễ chỉ những con bò đực; nguyên văn không nhất thiết nhấn mạnh chúng còn non.
- source_word: לָאֵילִם
  choice: chiên đực
  rationale: אַיִל trong ngữ cảnh tế lễ có nghĩa trực tiếp là chiên đực.
- source_word: וְלַכְּבָשִׂים
  choice: và chiên con
  rationale: כֶּבֶשׂ là chiên con; không thêm ý chỉ giới tính vì câu này không cần nói rõ.
- source_word: בְּמִסְפָּרָם
  choice: theo số lượng
  rationale: Cụm này diễn tả sự tương ứng với số con vật đã được quy định; cách dịch tự nhiên trong tiếng Việt mà vẫn giữ cấu trúc của nguyên văn.
- source_word: כְּמִשְׁפָּטָם
  choice: theo… quy định dành cho chúng
  rationale: מִשְׁפָּט ở đây chỉ thể lệ hoặc quy định tế lễ áp dụng cho các con vật/lễ vật vừa nêu. Đại từ hậu tố số nhiều được giữ bằng “dành cho chúng”, thay vì biến thành một quy định chung không có đối tượng.
theological_decisions:
- issue: Đối tượng của hậu tố số nhiều trong כְּמִשְׁפָּטָם
  choice: quy định dành cho chúng
  alternative: quy định đã ấn định; thể lệ dành cho từng loại
  rationale: Hậu tố số nhiều nam tính có thể quy chiếu đến các con vật hoặc các lễ vật tương ứng. Bản dịch chính giữ đại từ mà không xác định quá mức; chú thích nêu những cách hiểu tự nhiên khác.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “lễ rưới” thay cho thuật ngữ Hán-Việt cổ “lễ quán”; lược bớt các giới từ lặp lại trước từng loài vật để câu tiếng Việt tự nhiên hơn, nhưng vẫn giữ đầy đủ ba nhóm con vật và hai cụm chỉ chuẩn mực.
