  to: Cùng với lễ vật ngũ cốc và các lễ rưới tương ứng cho bò đực, chiên đực và chiên con, theo số lượng của từng loại và theo thể lệ áp dụng cho từng loại.[a]
  rationale: Bản sửa làm rõ rằng lễ vật ngũ cốc và lễ rưới là các lễ vật đi kèm, được ấn định tương ứng với bò đực, chiên đực và chiên con. “Theo số lượng của từng loại” phản ánh בְּמִסְפָּרָם; “theo thể lệ áp dụng cho từng loại” diễn đạt tự nhiên כְּמִשְׁפָּטָם mà không biến hậu tố số nhiều thành một quy định chung vô đối tượng. Chú thích bảo lưu cách dịch sát cấu trúc sở hữu của tiếng Hê-bơ-rơ.
