translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, phù hợp với phần chỉ dẫn tế lễ. Dùng “lễ vật rượu” thay cho thuật ngữ ít thông dụng “lễ quán”; giữ cấu trúc nối tiếp câu trước bằng “cùng với”. Dấu chú thích [a] được đặt sau chính cụm từ mà chú thích giải nghĩa.
