  text: along with their grain offering and their drink offerings for the bulls[a], for the rams, and for the lambs, according to their number, according to the ordinance.
translation:
  language: vi
  text: cùng với lễ vật ngũ cốc của chúng và các lễ vật rượu của chúng dành cho bò đực, chiên đực và chiên con, theo số lượng của chúng và theo quy định.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “theo thể lệ đã ấn định.” Từ Hê-bơ-rơ כַּמִּשְׁפָּט chỉ quy tắc hoặc thủ tục đã được thiết lập cho các lễ vật này.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנְחָתָם
  choice: lễ vật ngũ cốc
  rationale: Trong bối cảnh tế lễ, מִנְחָה chỉ lễ vật bằng ngũ cốc đi kèm sinh tế; cách dịch này chính xác và dễ hiểu hơn từ chung chung “lễ vật”.
- source_word: נִסְכֵּיהֶם
  choice: các lễ vật rượu
  rationale: נֶסֶךְ là lễ vật dạng lỏng được rót ra, thường là rượu. “Lễ vật rượu” tự nhiên và dễ hiểu hơn thuật ngữ chuyên biệt “lễ quán”.
- source_word: לַפָּרִים לָאֵילִם וְלַכְּבָשִׂים
  choice: dành cho bò đực, chiên đực và chiên con
  rationale: Tiền tố ל biểu thị các lễ vật đi kèm được phân định tương ứng cho từng loại con vật.
- source_word: בְּמִסְפָּרָם
  choice: tùy theo số lượng của chúng
  rationale: Cụm từ cho biết lượng lễ vật đi kèm phải tương ứng với số con vật; “tùy theo” diễn đạt quan hệ tỷ lệ này tự nhiên trong tiếng Việt.
- source_word: כַּמִּשְׁפָּט
  choice: theo đúng quy định
  rationale: מִשְׁפָּט ở đây là quy tắc hay thủ tục tế lễ đã được ấn định. Cách dịch giữ sắc thái pháp quy mà vẫn rõ ràng, hiện đại.
- source_word: וּ
  choice: cùng với
  rationale: Câu này phụ thuộc về cú pháp vào danh sách sinh tế ở câu trước; “cùng với” làm rõ rằng các lễ vật này đi kèm những sinh tế ấy.
