  text: וּ/בַ/יּ֧וֹם הַ/חֲמִישִׁ֛י פָּרִ֥ים תִּשְׁעָ֖ה אֵילִ֣ם שְׁנָ֑יִם כְּבָשִׂ֧ים בְּנֵֽי שָׁנָ֛ה אַרְבָּעָ֥ה עָשָׂ֖ר תְּמִימִֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/026.yaml
  text: 'On the fifth day: nine bulls[a], two rams, and fourteen male lambs a year old, without blemish,'
translation:
  language: vi
  text: 'Vào ngày thứ năm: chín con bò đực[a], hai con chiên đực và mười bốn con chiên đực một tuổi, không tì vết,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Và vào ngày thứ năm”. Tiếng Hê-bơ-rơ có một liên từ ở đầu câu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בַ/יּוֹם
  choice: Vào ngày
  rationale: Cụm tiền tố וּבַ־ có nghĩa sát là “và vào”; trong chuỗi quy định này, “Vào ngày” tự nhiên trong tiếng Việt và vẫn giữ rõ ý thời gian, còn liên từ được ghi ở chú thích.
- source_word: הַ/חֲמִישִׁי
  choice: thứ năm
  rationale: Số thứ tự bổ nghĩa cho “ngày”.
- source_word: פָּרִים תִּשְׁעָה
  choice: chín con bò đực
  rationale: פָּרִים chỉ bò đực trong ngữ cảnh tế lễ; bản văn câu này không buộc phải thêm ý “tơ”.
- source_word: אֵילִם שְׁנָיִם
  choice: hai con chiên đực
  rationale: אֵילִם là chiên đực trưởng thành, được phân biệt với các con chiên một tuổi được nêu tiếp theo.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה אַרְבָּעָה עָשָׂר
  choice: mười bốn con chiên đực một tuổi
  rationale: כְּבָשִׂים trong danh sách tế lễ chỉ các con chiên đực; בְּנֵי שָׁנָה diễn đạt tuổi của chúng một cách tự nhiên là “một tuổi”.
- source_word: תְּמִימִם
  choice: không tì vết
  rationale: Trong ngữ cảnh tế lễ, từ này chỉ con vật không có khuyết tật; “không tì vết” giữ đúng sắc thái nghi lễ và trang trọng.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ cấu trúc liệt kê của nguyên văn; dùng “chiên đực” để phân biệt אֵילִם với כְּבָשִׂים, còn dấu hai chấm giúp câu tự nhiên trong tiếng Việt.
