  verdict: revise
  source_fidelity: Bản dịch phản ánh đầy đủ mệnh lệnh số nhiều, danh Yahweh, các kỳ được ấn định, và các loại tế lễ. Tuy nhiên, “tức là” có thể bị hiểu là đồng nhất tuyệt đối hai loại lễ vật khấn nguyện/tự nguyện với toàn bộ danh sách sau đó. Cấu trúc Hê-bơ-rơ cho phép hiểu danh sách này là các loại lễ mà những lễ vật khấn nguyện và tự nguyện có thể thuộc về; cách diễn đạt lại dưới đây làm rõ quan hệ ấy mà không vượt quá nguyên văn.
  naturalness: Văn phong nhìn chung trang trọng và tự nhiên. Thay “của mình” bằng “của các ngươi” phù hợp hơn với ngôi thứ hai số nhiều trong văn phong Kinh Thánh hiện đại. Dấu gạch ngang giúp câu dài dễ theo dõi.
  terminology: Các thuật ngữ “lễ thiêu,” “lễ vật ngũ cốc,” “lễ quán,” và “lễ vật bình an” nhất quán với ngữ cảnh tế lễ. Giữ “lễ quán” là thuật ngữ kỹ thuật quen dùng; chú thích về “lễ vật thông công” được đặt đúng tại “lễ vật bình an.”
