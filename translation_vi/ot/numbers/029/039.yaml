base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/039.yaml
  text: These you shall offer to Yahweh at your appointed times[a], besides your vow offerings and your freewill offerings, for your burnt offerings and for your grain offerings and for your drink offerings and for your peace offerings.
translation:
  language: vi
  text: Các ngươi phải dâng những lễ vật này lên Yahweh vào các kỳ đã định của các ngươi, ngoài những lễ vật khấn nguyện và lễ vật tự nguyện của các ngươi, bao gồm lễ thiêu, lễ vật ngũ cốc, lễ quán và lễ vật bình an[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “lễ vật thông công”. Từ Hê-bơ-rơ chỉ một loại tế lễ gắn với sự bình an, toàn vẹn và mối tương giao.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה תַּעֲשׂוּ
  choice: phải dâng những lễ vật này
  rationale: Động từ עשה có nghĩa cơ bản là “làm”, nhưng trong ngữ cảnh tế lễ, “dâng” truyền đạt đúng hành động được truyền phải thực hiện; “những lễ vật này” chỉ về các lễ vật đã được quy định ở phần trước.
- source_word: לַיהוָה
  choice: lên Yahweh
  rationale: Giữ nguyên danh riêng giao ước Yahweh; “dâng ... lên” là cách diễn đạt tự nhiên trong tiếng Việt cho lễ vật hướng đến và được biệt riêng cho Ngài.
- source_word: בְּמוֹעֲדֵיכֶם
  choice: vào các kỳ đã định của mình
  rationale: מוֹעֵד chỉ thời điểm hay dịp được ấn định. Cách dịch này giữ phạm vi nghĩa rộng hơn “các kỳ lễ” mà vẫn phù hợp với lịch tế lễ trong văn cảnh.
- source_word: לְבַד
  choice: ngoài
  rationale: Cho biết các lễ vật vừa quy định phải được dâng thêm, không thay thế những lễ vật do khấn nguyện hoặc tự nguyện.
- source_word: מִנִּדְרֵיכֶם
  choice: những lễ vật khấn nguyện
  rationale: Trong ngữ cảnh này, נדר chỉ lễ vật gắn với lời khấn, chứ không chỉ riêng lời nói khấn nguyện.
- source_word: וְנִדְבֹתֵיכֶם
  choice: lễ vật tự nguyện
  rationale: נדבה là lễ vật được tự nguyện dâng, không phát sinh từ nghĩa vụ bắt buộc.
- source_word: לְעֹלֹתֵיכֶם
  choice: các lễ thiêu
  rationale: עלה là loại lễ vật được thiêu trọn; “lễ thiêu” là thuật ngữ ngắn gọn và quen thuộc trong tiếng Việt.
- source_word: וּלְמִנְחֹתֵיכֶם
  choice: lễ vật ngũ cốc
  rationale: Trong hệ thống tế lễ của Ngũ Kinh, מנחה ở đây là lễ vật từ sản phẩm ngũ cốc; cách gọi này rõ nghĩa hơn từ chung “lễ vật”.
- source_word: וּלְנִסְכֵּיכֶם
  choice: lễ quán
  rationale: נסך là lễ vật bằng chất lỏng được rưới hoặc đổ ra. “Lễ quán” giữ thuật ngữ tế lễ cô đọng, chỉ hành động rưới đổ.
- source_word: וּלְשַׁלְמֵיכֶם
  choice: lễ vật bình an
  rationale: שלמים là một loại tế lễ gắn với ý niệm bình an, toàn vẹn và mối tương giao; bản chính giữ cách gọi truyền thống, còn cách hiểu “thông công” được nêu ở chú thích.
theological_decisions:
- issue: Cách dịch danh Đức Chúa Trời יהוה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Bản Hê-bơ-rơ dùng trực tiếp danh giao ước יהוה. Giữ “Yahweh” phân biệt danh riêng này với tước hiệu “Chúa”.
- issue: Cách dịch danh từ tế lễ שְׁלָמִים
  choice: lễ vật bình an
  alternative: lễ vật thông công
  rationale: “Lễ vật bình an” giữ mối liên hệ từ vựng với bình an và sự toàn vẹn, nhưng thuật ngữ Hê-bơ-rơ cũng có thể được gọi theo khía cạnh thông công; chú thích bảo tồn sắc thái ấy mà không khẳng định chỉ một cách hiểu.
translation_notes:
  register: Dùng văn phong hiện đại, trang trọng và trực tiếp. Đại từ “các ngươi” phản ánh lời truyền cho cộng đồng Israel ở số nhiều mà không thêm quan hệ thân tộc không có trong nguyên văn. Dấu chú thích [a] được đặt ngay sau thuật ngữ mà chú thích giải thích.
