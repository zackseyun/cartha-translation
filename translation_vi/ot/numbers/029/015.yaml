  text: và một phần mười cho mỗi con chiên con trong số mười bốn con chiên con;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עִשָּׂרוֹן ... עִשָּׂרוֹן
  choice: một phần mười
  rationale: Danh từ được lặp lại, chỉ một đơn vị bằng một phần mười; trong ngữ cảnh lễ vật, đó là một phần mười ê-pha bột mịn. Tiếng Việt dùng “một phần mười” và diễn đạt ý phân phối bằng “cho mỗi” để tự nhiên mà vẫn trung thành.
- source_word: לַכֶּבֶשׂ הָאֶחָד
  choice: cho mỗi con chiên con
  rationale: Nghĩa sát là “cho một con chiên con ấy”, nhưng trong quy định lễ vật, cụm này có chức năng phân phối, nêu lượng dành cho từng con.
- source_word: לְאַרְבָּעָה עָשָׂר כְּבָשִׂים
  choice: cho mười bốn con chiên con
  rationale: Cụm từ xác định toàn bộ nhóm mười bốn con mà định lượng cho từng con được áp dụng; tiếng Việt không cần mạo từ tương đương với tính xác định của tiếng Hê-bơ-rơ.
