  source_fidelity: 'Bản dịch chuyển tải đúng các thành tố chính: một dê đực, lễ chuộc tội, tính bổ sung so với lễ thiêu thường lệ, và các lễ vật kèm theo. Tuy nhiên, cụm "ngoài lễ thiêu thường lệ cùng với..." thiếu dấu ngắt khiến quan hệ bổ sung và phạm vi của "cùng với" không rõ bằng nguyên văn.'
