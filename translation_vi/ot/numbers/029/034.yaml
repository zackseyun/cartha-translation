  yaml_path: translation/ot/numbers/029/034.yaml
  text: and one goat for a sin offering[a], besides the regular burnt offering[b], with its grain offering and its drink offering.
translation:
  language: vi
  text: và một con dê đực làm lễ chuộc tội, ngoài lễ thiêu thường lệ, cùng lễ vật ngũ cốc và lễ quán đi kèm.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/שְׂעִיר ... אֶחָד
  choice: và một con dê đực
  rationale: שׂעִיר chỉ dê đực trong ngữ cảnh tế lễ; אֶחָד nêu rõ số lượng là một, còn וּ nối tiếp danh sách lễ vật.
- source_word: חַטָּאת
  choice: làm lễ vật chuộc tội
  rationale: Trong ngữ cảnh tế lễ, từ này chỉ một loại lễ vật dâng vì tội lỗi, không chỉ khái niệm trừu tượng về tội.
- source_word: מִ/לְּ/בַד
  choice: ngoài
  rationale: Cụm giới từ cho biết lễ vật này được dâng thêm, không thay thế lễ thiêu thường lệ.
- source_word: עֹלַת הַ/תָּמִיד
  choice: lễ thiêu thường lệ
  rationale: עֹלָה là lễ vật được thiêu; תָּמִיד nhấn mạnh tính đều đặn, tiếp diễn của lễ này.
- source_word: מִנְחָתָ/הּ
  choice: lễ vật ngũ cốc ... của lễ ấy
  rationale: Trong ngữ cảnh nghi lễ, מִנְחָה là lễ vật bằng ngũ cốc. Hậu tố giống cái số ít quy chiếu về עֹלָה, nên diễn đạt rõ là lễ vật đi kèm lễ thiêu.
- source_word: וְ/נִסְכָּ/הּ
  choice: và lễ quán của lễ ấy
  rationale: נֶסֶךְ chỉ phần chất lỏng được rót dâng. “Lễ quán” là thuật ngữ tiếng Việt ngắn gọn, trang trọng; cụm “của lễ ấy” thể hiện hậu tố quy chiếu về lễ thiêu.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Giữ cấu trúc liệt kê của nguyên văn; dùng “dê đực” để chuyển tải đầy đủ nghĩa của שְׂעִיר và “thường lệ” để tránh thu hẹp תָּמִיד chỉ còn nghĩa “hằng ngày”.
