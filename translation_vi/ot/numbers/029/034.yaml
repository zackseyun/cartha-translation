  terminology: '"dê đực", "lễ chuộc tội", "lễ thiêu", "lễ vật ngũ cốc", và "lễ quán" phù hợp với ngữ cảnh tế tự. "Lễ chuộc tội" tự nhiên và chuẩn thuật ngữ hơn "lễ vật chuộc tội" ở đây; "lễ quán" được giữ để không diễn giải quá mức loại chất lỏng của lễ rót.'
