revisions:
- from: Ngày thứ ba, hãy dâng mười một con bò đực, hai con chiên đực và mười bốn con chiên con một tuổi, tất cả đều không tì vết.
  to: 'Vào ngày thứ ba: mười một con bò đực, hai con chiên đực và mười bốn con chiên con một tuổi không tì vết.'
  rationale: Bản sửa giữ nguyên trật tự liệt kê và không thêm động từ không có trong câu nguồn. Cụm “không tì vết” được đặt ngay sau “mười bốn con chiên con một tuổi,” phản ánh quan hệ cú pháp trong tiếng Hê-bơ-rơ mà không mở rộng phạm vi bổ nghĩa ngoài điều câu này xác định.
