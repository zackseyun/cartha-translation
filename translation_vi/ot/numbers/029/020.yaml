base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/020.yaml
  text: 'And on the third day: eleven bulls[a], two rams, fourteen one-year-old lambs without blemish,'
translation:
  language: vi
  text: 'Vào ngày thứ ba: mười một con bò đực, hai con chiên đực và mười bốn con chiên con một tuổi không tì vết.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבַיּוֹם הַשְּׁלִישִׁי
  choice: Ngày thứ ba
  rationale: Cụm từ mở đầu một mục tiếp theo trong chuỗi lễ vật. Tiếng Việt tự nhiên không cần dịch riêng liên từ וְ là “và” trong phép liệt kê này.
- source_word: פָּרִים עַשְׁתֵּי עָשָׂר
  choice: mười một con bò đực
  rationale: פָּרִים trong ngữ cảnh hiến tế chỉ bò đực; nguyên văn không có từ riêng mang nghĩa “non”.
- source_word: אֵילִם שְׁנָיִם
  choice: hai con chiên đực
  rationale: אֵילִם là những con cừu đực trưởng thành dùng làm sinh tế; “chiên đực” là cách gọi rõ ràng, quen thuộc trong văn phong Kinh Thánh tiếng Việt.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה אַרְבָּעָה עָשָׂר
  choice: mười bốn con chiên con một tuổi
  rationale: בְּנֵי שָׁנָה là thành ngữ chỉ con vật một tuổi; cách diễn đạt này vừa sát nghĩa vừa tự nhiên.
- source_word: תְּמִימִם
  choice: tất cả đều không tì vết
  rationale: Trong luật hiến tế, תְּמִימִם mô tả những con vật không có khuyết tật. Thêm “tất cả đều” làm rõ phạm vi tự nhiên của tính từ số nhiều đứng cuối danh sách.
theological_decisions:
- issue: Phạm vi bổ nghĩa của תְּמִימִם ở cuối câu
  choice: Hiểu là áp dụng cho toàn bộ các con vật được liệt kê
  alternative: Chỉ hiểu là bổ nghĩa trực tiếp cho mười bốn con chiên con
  rationale: Tính từ số nhiều giống đực ở cuối danh sách có thể hòa hợp ngữ pháp với mọi danh từ số nhiều giống đực trong câu; trong công thức lễ vật của phân đoạn này, yêu cầu không tì vết tự nhiên áp dụng cho các sinh tế nói chung.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “hãy dâng” để diễn đạt mệnh lệnh được lược theo cấu trúc liệt kê của toàn phân đoạn; câu đơn lẻ nhờ vậy đầy đủ và tự nhiên trong tiếng Việt.
