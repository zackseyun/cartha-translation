  yaml_path: translation/ot/numbers/029/025.yaml
  text: and one male goat for a sin offering[a], besides the regular burnt offering, its grain offering, and its drink offering.
translation:
  language: vi
  text: và một con dê đực làm lễ vật chuộc tội, ngoài lễ thiêu thường lệ[a], lễ vật ngũ cốc và lễ quán đi kèm lễ ấy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “lễ thiêu liên tục.”'
    reason: Lựa chọn từ vựng thay thế cho הַתָּמִיד, tương ứng chú thích trong dấu vết kiểm tra tiếng Anh.
lexical_decisions:
- source_word: וּ/שְׂעִיר עִזִּים אֶחָד
  choice: và một con dê đực
  rationale: Cụm שׂעיר עזים là cách gọi thông dụng trong ngữ cảnh tế lễ để chỉ dê đực; אֶחָד xác định số lượng là một.
- source_word: חַטָּאת
  choice: làm lễ vật chuộc tội
  rationale: Trong danh sách tế lễ, từ này chỉ sinh tế dâng vì tội lỗi, chứ không chỉ khái niệm trừu tượng là “tội”.
- source_word: מִ/לְּ/בַד
  choice: ngoài
  rationale: Cụm giới từ cho biết sinh tế này được dâng thêm, không thay thế lễ thiêu đã được quy định.
- source_word: עֹלַת הַ/תָּמִיד
  choice: lễ thiêu thường lệ
  rationale: תמיד ở đây diễn tả lễ được dâng đều đặn theo quy định; “thường lệ” tự nhiên và không xác định quá mức là “hằng ngày”.
- source_word: מִנְחָתָהּ
  choice: lễ vật ngũ cốc đi kèm
  rationale: Trong văn cảnh tế lễ của sách Dân Số, מִנְחָה chỉ lễ vật bằng ngũ cốc đi kèm lễ thiêu; hậu tố giống cái số ít quy chiếu về lễ thiêu.
- source_word: וְ/נִסְכָּהּ
  choice: và lễ quán đi kèm
  rationale: נֶסֶךְ là lễ dâng bằng chất lỏng được rót ra. “Lễ quán” là thuật ngữ tiếng Việt trang trọng, gọn và thích hợp với văn cảnh nghi lễ; hậu tố quy chiếu về lễ thiêu.
theological_decisions: []
translation_notes:
  register: Bản dịch dùng tiếng Việt hiện đại, trang trọng và dễ đọc. Cụm “đi kèm” được đặt sau hai lễ vật để diễn đạt tự nhiên quan hệ của các hậu tố sở hữu tiếng Hê-bơ-rơ với lễ thiêu thường lệ, đồng thời tránh cách lặp nặng nề.
