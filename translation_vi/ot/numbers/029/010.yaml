translation:
  language: vi
  text: một phần mười cho mỗi con chiên[a], cho cả bảy con chiên.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tiếng Hê-bơ-rơ chỉ nói “một phần mười, một phần mười”; trong ngữ cảnh dâng tế lễ, điều này chỉ một phần mười ê-pha.
    reason: lexical_alternative
lexical_decisions:
- source_word: עִשָּׂרוֹן עִשָּׂרוֹן
  choice: một phần mười
  rationale: 'Cụm danh từ được lặp lại mang nghĩa phân phối: một phần mười cho từng con. Trong ngữ cảnh lễ vật, đây được hiểu là một phần mười ê-pha, nhưng đơn vị không được nêu rõ trong câu Hê-bơ-rơ nên được giải thích ở chú thích.'
- source_word: לַכֶּבֶשׂ הָאֶחָד
  choice: cho mỗi con chiên
  rationale: Nghĩa sát là “cho con chiên thứ/một ấy”, nhưng trong danh sách lễ vật, cấu trúc này có chức năng phân phối; “cho mỗi con chiên” diễn đạt tự nhiên và chính xác.
- source_word: לְשִׁבְעַת הַכְּבָשִׂים
  choice: cho cả bảy con chiên
  rationale: Cụm từ xác định toàn bộ nhóm mà định lượng theo từng con được áp dụng. Từ “cả” làm rõ quan hệ phân phối mà không thêm một nhóm đối tượng mới.
