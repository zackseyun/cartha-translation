  register: Văn phong hiện đại, trang trọng và cô đọng. Giữ phép lặp ý phân phối của nguyên văn, đồng thời đặt thông tin về đơn vị ê-pha trong chú thích vì đơn vị ấy chỉ được hàm ý trong ngữ cảnh.
