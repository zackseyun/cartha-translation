base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/029.yaml
  text: 'And on the sixth day: eight bulls, two rams, and fourteen male lambs a year old, without blemish.'
translation:
  language: vi
  text: 'Vào ngày thứ sáu: tám con bò đực, hai con chiên đực và mười bốn con chiên con một tuổi, không tì vết.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/בַ/יּוֹם הַ/שִּׁשִּׁי
  choice: Ngày thứ sáu
  rationale: Cụm từ đánh dấu ngày kế tiếp trong chuỗi lễ vật. Tiếng Việt tự nhiên có thể lược liên từ וְ vì quan hệ tiếp nối đã rõ trong văn cảnh liệt kê.
- source_word: פָּרִים שְׁמֹנָה
  choice: tám con bò đực
  rationale: פָּרִים trong ngữ cảnh tế lễ chỉ bò đực; bản Hê-bơ-rơ không nêu rõ độ tuổi nên không thêm “tơ”.
- source_word: אֵילִם שְׁנָיִם
  choice: hai con chiên đực
  rationale: אֵילִם là những con chiên đực trưởng thành dùng làm sinh tế.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה אַרְבָּעָה עָשָׂר
  choice: mười bốn con chiên con một tuổi
  rationale: כְּבָשִׂים chỉ chiên non, còn בְּנֵי שָׁנָה xác định chúng một tuổi; cách diễn đạt này tự nhiên và giữ đủ thông tin của nguyên bản.
- source_word: תְּמִימִם
  choice: tất cả đều không tì vết
  rationale: Trong luật tế lễ, từ này nói đến những con vật không có khuyết tật. Thêm “tất cả đều” làm rõ tính từ số nhiều áp dụng cho toàn bộ các con vật vừa liệt kê.
