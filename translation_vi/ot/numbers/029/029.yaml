translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu; giữ cấu trúc liệt kê cô đọng của luật tế lễ. Dùng “không tì vết” là thuật ngữ quen thuộc nhưng vẫn rõ nghĩa trong tiếng Việt phổ thông.
