base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/024.yaml
  text: and their grain offerings and their drink offerings for the bulls[a], for the rams, and for the lambs, according to their number, according to the ordinance;
translation:
  language: vi
  text: cùng các lễ vật ngũ cốc và các lễ vật rượu dành cho bò đực, chiên đực và chiên con, theo số lượng của chúng và theo quy định.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “theo thể thức đã ấn định.” Từ Hê-bơ-rơ chỉ quy tắc hoặc thủ tục pháp định dành cho các lễ vật này.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנְחָתָם
  choice: các lễ vật ngũ cốc
  rationale: Trong ngữ cảnh tế lễ, מִנְחָה chỉ lễ vật bằng ngũ cốc đi kèm các sinh tế. Dùng số nhiều trong tiếng Việt để diễn đạt tự nhiên ý nghĩa tập hợp và sự phân bổ cho nhiều con vật.
- source_word: וְנִסְכֵּיהֶם
  choice: và lễ vật tưới rượu
  rationale: נֶסֶךְ là lễ vật bằng thức uống được rót ra. “Lễ vật tưới rượu” rõ nghĩa hơn thuật ngữ cổ “lễ quán” đối với độc giả hiện đại, đồng thời giữ hình ảnh nghi lễ.
- source_word: לַפָּרִים לָאֵילִם וְלַכְּבָשִׂים
  choice: dành cho bò đực, chiên đực và chiên con
  rationale: Tiền tố ל biểu thị mối liên hệ hoặc sự phân bổ của các lễ vật đi kèm cho từng loại sinh tế; “dành cho” truyền đạt quan hệ này tự nhiên.
- source_word: בְּמִסְפָּרָם
  choice: theo số lượng của chúng
  rationale: Cụm từ cho biết các lễ vật đi kèm phải tương ứng với số con vật; cách dịch này giữ sát cấu trúc và đối tượng quy chiếu của tiếng Hê-bơ-rơ.
- source_word: כַּמִּשְׁפָּט
  choice: theo quy định
  rationale: מִשְׁפָּט trong luật tế lễ chỉ thể thức hoặc thủ tục đã được ấn định. “Quy định” vừa giữ sắc thái pháp quy vừa dễ hiểu trong tiếng Việt hiện đại.
theological_decisions: []
translation_notes:
  register: Văn phong trang trọng, sáng rõ và phù hợp với một câu liệt kê trong luật tế lễ. Dùng “lễ vật tưới rượu” thay cho thuật ngữ Hán-Việt ít phổ biến “lễ quán”; dấu chú thích được đặt ngay sau cụm từ mà nó giải thích.
