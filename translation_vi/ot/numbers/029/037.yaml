  text: מִנְחָתָ֣/ם וְ/נִסְכֵּי/הֶ֗ם לַ/פָּ֨ר לָ/אַ֧יִל וְ/לַ/כְּבָשִׂ֛ים בְּ/מִסְפָּרָ֖/ם כַּ/מִּשְׁפָּֽט׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/037.yaml
  text: and their grain offering and their drink offerings for the bull[a], for the ram, and for the lambs, according to their number, according to the ordinance.
translation:
  language: vi
  text: cùng lễ vật ngũ cốc và các lễ quán của chúng, dành cho con bò đực, con chiên đực và các chiên con, theo số lượng của chúng, đúng quy định.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִנְחָתָם
  choice: lễ vật ngũ cốc của chúng
  rationale: Trong ngữ cảnh tế lễ, מִנְחָה chỉ lễ vật bằng ngũ cốc đi kèm các sinh tế; dạng số ít mang hậu tố số nhiều được giữ theo nghĩa tập thể.
- source_word: וְנִסְכֵּיהֶם
  choice: và các lễ quán của chúng
  rationale: נֶסֶךְ là lễ dâng bằng chất lỏng được rót ra; “lễ quán” là thuật ngữ tiếng Việt trang trọng, gọn và phù hợp ngữ cảnh tế tự.
- source_word: לַפָּר
  choice: dành cho con bò đực
  rationale: פַּר chỉ bò đực thuộc đàn gia súc; nguyên ngữ không buộc phải thêm ý “tơ” trong câu này.
- source_word: לָאַיִל
  choice: con chiên đực
  rationale: אַיִל có nghĩa trực tiếp là chiên đực trong danh sách sinh tế.
- source_word: וְלַכְּבָשִׂים
  choice: và các chiên con
  rationale: כֶּבֶשׂ chỉ chiên con, thường là con đực trong ngữ cảnh tế lễ; “chiên con” tự nhiên và đủ rõ ở đây.
- source_word: בְּמִסְפָּרָם
  choice: theo số lượng của chúng
  rationale: Cụm từ diễn tả sự tương ứng với số con vật đã được ấn định và đếm.
- source_word: כַּמִּשְׁפָּט
  choice: đúng quy định
  rationale: מִשְׁפָּט ở đây nói đến quy tắc hay thể lệ tế lễ đã được ấn định; “đúng quy định” diễn đạt tự nhiên mà vẫn giữ sắc thái pháp quy.
theological_decisions: []
