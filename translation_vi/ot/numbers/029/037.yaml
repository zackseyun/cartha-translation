  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Giữ cấu trúc liệt kê của tiếng Hê-bơ-rơ; dùng thuật ngữ tế tự “lễ quán” và tránh bổ sung chi tiết không được nguyên văn xác định.
