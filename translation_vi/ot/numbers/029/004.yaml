  text: và một phần mười cho mỗi con trong bảy con chiên con[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ: “một phần mười”; trong bối cảnh tế lễ, cụm này thường có nghĩa là một phần mười ê-pha.'
    reason: cultural_note
lexical_decisions:
- source_word: וְעִשָּׂרוֹן אֶחָד
  choice: và một phần mười
  rationale: Cụm từ chỉ một đơn vị đo bằng một phần mười; nguyên văn không nói rõ “ê-pha”, nên bản văn chính giữ cách diễn đạt ngắn gọn và để chú thích giải thích đơn vị thường được hiểu trong bối cảnh tế lễ.
- source_word: לַכֶּבֶשׂ הָאֶחָד
  choice: cho mỗi con chiên con
  rationale: 'Nghĩa sát là “cho con chiên con ấy/một con chiên con”, nhưng trong danh sách lễ vật, cụm này có ý phân phối: lượng đã nêu được áp dụng cho từng con.'
- source_word: לְשִׁבְעַת הַכְּבָשִׂים
  choice: cho bảy con chiên con
  rationale: Cụm giới từ xác định toàn bộ nhóm gồm bảy con mà định lượng trên được áp dụng cho từng con; tiếng Việt không cần biểu thị mạo từ xác định như tiếng Hê-bơ-rơ.
