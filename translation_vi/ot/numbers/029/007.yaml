revisions:
- from: Vào ngày mồng mười của tháng thứ bảy này, các ngươi phải có một cuộc hội họp thánh; các ngươi phải ép mình[a] và không được làm bất cứ công việc nào.
  to: Vào ngày mồng mười tháng thứ bảy này, sẽ có một cuộc hội họp thánh cho các ngươi. Các ngươi phải ép mình[a] và không được làm bất cứ công việc nào.
  rationale: Sửa chú thích để phản ánh chính xác thành ngữ Hê-bơ-rơ và dùng tiếng Việt tự nhiên. Điều chỉnh nhẹ mệnh đề về cuộc hội họp thánh để sát hơn với cấu trúc “sẽ có ... cho các ngươi,” không thay đổi ý nghĩa luật định. Giữ “ép mình” vì đây là lựa chọn cân bằng, tránh xác định quá mức nghi thức là chỉ kiêng ăn hoặc chỉ là thái độ nội tâm.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T09:38:19Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch giữ đúng ngày tháng, tính chất triệu tập thánh, mệnh lệnh tự làm khổ/tự kiềm chế, và lệnh cấm tuyệt đối mọi công việc. Tuy nhiên, chú thích giải nghĩa đen נַפְשֹׁתֵיכֶם là “con người mình” không chính xác và không tự nhiên; trong thành ngữ này nên nói “chính mình” (nghĩa đen, theo cách diễn đạt Hê-bơ-rơ: ‘các ngươi phải làm khổ chính mình’).'
  naturalness: “Mồng mười” phù hợp trong văn cảnh lịch tháng. “Các ngươi phải có một cuộc hội họp thánh” hơi gượng vì cấu trúc יִהְיֶה לָכֶם nêu quy định về ngày lễ hơn là sở hữu; “sẽ có ... cho các ngươi” tự nhiên và sát cấu trúc nguồn hơn. “Ép mình” là cách nói hiện đại, phù hợp cho thành ngữ nghi lễ này.
  terminology: “Cuộc hội họp thánh” truyền đạt được מִקְרָא קֹדֶשׁ mà không đồng nhất với “Hội thánh.” “Ép mình” bảo lưu tính nghi lễ và sự tự khước từ, không thu hẹp nghĩa thành chỉ kiêng ăn. Chú thích cần dùng “chính mình,” không dùng “con người mình.”
  issues:
  - severity: medium
    issue: Chú thích giải nghĩa đen “làm khổ con người mình.”
    rationale: נֶפֶשׁ trong thành ngữ này không nên được diễn đạt là “con người mình”; tiếng Việt tự nhiên và sát nghĩa hơn là “chính mình.” Cách hiện tại vừa không tự nhiên vừa làm mờ chức năng phản thân của thành ngữ.
  - severity: low
    issue: “Các ngươi phải có một cuộc hội họp thánh” hơi thiếu tự nhiên.
    rationale: יִהְיֶה לָכֶם nghĩa sát là “sẽ có cho các ngươi”; cách này vẫn giữ sắc thái quy định khi đi cùng các mệnh lệnh tiếp theo.
