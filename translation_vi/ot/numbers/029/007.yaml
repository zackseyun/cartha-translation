source:
  edition: WLC
  text: וּ/בֶ/עָשׂוֹר֩ לַ/חֹ֨דֶשׁ הַ/שְּׁבִיעִ֜י הַ/זֶּ֗ה מִֽקְרָא קֹ֨דֶשׁ֙ יִהְיֶ֣ה לָ/כֶ֔ם וְ/עִנִּיתֶ֖ם אֶת נַפְשֹׁתֵי/כֶ֑ם כָּל מְלָאכָ֖ה לֹ֥א תַעֲשֽׂוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/007.yaml
  text: On the tenth day of this seventh month[a], there shall be a holy convocation for you, and you shall afflict yourselves; you shall do no work at all.
translation:
  language: vi
  text: Vào ngày mồng mười tháng thứ bảy này, sẽ có một cuộc hội họp thánh cho các ngươi. Các ngươi phải ép mình[a] và không được làm bất cứ công việc nào.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “phải tự hạ mình” hoặc “phải tự kiềm chế.” Thành ngữ Hê-bơ-rơ có nghĩa đen là “các ngươi phải làm khổ chính mình,” chỉ một thực hành tự kiềm chế trong nghi lễ, đặc biệt gắn với việc kiêng ăn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבֶעָשׂוֹר
  choice: Vào ngày mồng mười
  rationale: Cụm giới từ với số từ chỉ ngày trong tháng; thêm “ngày” và dùng “mồng mười” là cách diễn đạt lịch ngày tự nhiên trong tiếng Việt.
- source_word: לַחֹדֶשׁ הַשְּׁבִיעִי הַזֶּה
  choice: của tháng thứ bảy này
  rationale: Giữ cả thứ tự của tháng và đại từ chỉ định הַזֶּה, đồng thời phù hợp với cách nói ngày tháng trong tiếng Việt.
- source_word: מִקְרָא קֹדֶשׁ
  choice: một cuộc hội họp thánh
  rationale: Diễn đạt một cuộc tập hợp được chính thức triệu tập cho mục đích thánh, giữ sắc thái nghi lễ mà vẫn dễ hiểu với độc giả hiện đại.
- source_word: יִהְיֶה לָכֶם
  choice: các ngươi phải có
  rationale: Trong ngữ cảnh luật định, cấu trúc này nói điều cộng đồng phải có trong ngày ấy; “phải có” truyền đạt tự nhiên lực quy định.
- source_word: וְעִנִּיתֶם אֶת נַפְשֹׁתֵיכֶם
  choice: các ngươi phải ép mình
  rationale: Đây là thành ngữ nghi lễ chỉ việc tự hạ mình hoặc tự kiềm chế, đặc biệt gắn với kiêng ăn. “Ép mình” giữ được yếu tố tự gây khổ chế mà không thu hẹp mệnh lệnh chỉ còn việc nhịn ăn.
- source_word: נַפְשֹׁתֵיכֶם
  choice: mình
  rationale: Trong thành ngữ này, từ có nghĩa đen là “sinh mạng/con người của các ngươi”; đại từ phản thân “mình” tránh áp đặt quan niệm nhị nguyên về linh hồn.
- source_word: כָּל מְלָאכָה לֹא תַעֲשׂוּ
  choice: không được làm bất cứ công việc nào
  rationale: Cách diễn đạt này giữ trọn tính bao quát của כָּל và lực cấm đoán của לֹא trong văn luật.
theological_decisions:
- issue: Cách dịch thành ngữ nghi lễ וְעִנִּיתֶם אֶת נַפְשֹׁתֵיכֶם
  choice: các ngươi phải ép mình
  alternative: các ngươi phải hạ mình; các ngươi phải khắc khổ; các ngươi phải kiêng mình
  rationale: “Ép mình” bảo lưu sức nặng của hành động tự phủ nhận và khổ chế trong Ngày Chuộc Tội, nhưng không xác định độc nhất hành động ấy là kiêng ăn hay chỉ là một thái độ nội tâm.
translation_notes:
  register: Văn phong luật lệ trang trọng nhưng hiện đại. Dùng “các ngươi” để phản ánh lời truyền trực tiếp cho cộng đồng số nhiều; “cuộc hội họp thánh” rõ nghĩa hơn thuật ngữ Hán-Việt ít thông dụng. Dấu chấm phẩy giữ hai mệnh lệnh nghi lễ liên kết chặt chẽ.
