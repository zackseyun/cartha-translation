source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֱלֹהִים֙ אֶל בִּלְעָ֔ם לֹ֥א תֵלֵ֖ךְ עִמָּ/הֶ֑ם לֹ֤א תָאֹר֙ אֶת הָ/עָ֔ם כִּ֥י בָר֖וּךְ הֽוּא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/012.yaml
  text: And God said to Balaam[a], “You must not go with them. You must not curse the people, because it is blessed.”
translation:
  language: vi
  text: 'Đức Chúa Trời phán với Ba-la-am: “Ngươi không được đi với họ. Ngươi không được nguyền rủa dân, vì dân được ban phước[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn dùng dạng số ít: “vì dân được ban phước,” quy chiếu về cả dân như một tập thể.'
    reason: Làm rõ đặc điểm số ít trong tiếng Hê-bơ-rơ mà tiếng Việt không biểu thị trực tiếp.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: phán
  rationale: Động từ nói trong lời tường thuật được diễn đạt bằng “phán” vì chủ thể là Đức Chúa Trời; cách dùng này trang trọng, tự nhiên và không làm thay đổi nội dung lời nói.
- source_word: אֱלֹהִים
  choice: Đức Chúa Trời
  rationale: Đây là danh xưng thông dụng, trang trọng trong tiếng Việt dành cho Đức Chúa Trời chân thật trong ngữ cảnh này.
- source_word: לֹא תֵלֵךְ עִמָּהֶם
  choice: Ngươi không được đi với họ
  rationale: לֹא với thể vị hoàn thành chưa hoàn tất trong lời phán trực tiếp mang lực cấm đoán. “Không được” truyền đạt rõ mệnh lệnh cấm trong tiếng Việt hiện đại.
- source_word: לֹא תָאֹר
  choice: Ngươi không được nguyền rủa
  rationale: Động từ אָרַר có nghĩa là nguyền rủa; cấu trúc phủ định ở đây là một lệnh cấm, được thể hiện nhất quán bằng “không được”.
- source_word: אֶת הָעָם
  choice: dân ấy
  rationale: הָעָם chỉ dân Y-sơ-ra-ên như một tập thể. “Dân ấy” tự nhiên trong ngữ cảnh và không biến tập thể thành một cá nhân.
- source_word: כִּי
  choice: vì
  rationale: Liên từ này nêu lý do cho lệnh cấm; “vì” là cách nối câu rõ ràng và tự nhiên.
- source_word: בָרוּךְ הוּא
  choice: dân ấy được ban phước
  rationale: Tiếng Hê-bơ-rơ dùng tính từ và đại từ giống đực số ít để quy chiếu về danh từ tập thể הָעָם. Tiếng Việt không bắt buộc đánh dấu số ở đây, nên lặp lại “dân ấy” vừa tự nhiên vừa giữ được nghĩa tập thể mà không cá nhân hóa đối tượng.
theological_decisions:
- issue: Số và đối tượng quy chiếu trong mệnh đề בָרוּךְ הוּא
  choice: “dân ấy được ban phước,” hiểu dân Y-sơ-ra-ên như một tập thể
  alternative: “họ được ban phước” hoặc cách dịch sát hình thức “người ấy/nó được ban phước”
  rationale: Nguyên văn dùng ngữ pháp số ít với הָעָם, một danh từ tập thể. Tiếng Việt có thể giữ danh từ tập thể “dân ấy” mà không cần ép sang đại từ số nhiều hay khiến người đọc hiểu là một cá nhân.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “ngươi” phù hợp với lời phán trực tiếp có thẩm quyền của Đức Chúa Trời trong văn cảnh Kinh Thánh; “không được” thể hiện lệnh cấm rõ ràng mà không dùng lối diễn đạt cổ.
