  text: וַ/יֹּ֤אמֶר בִּלְעָם֙ לָֽ/אָת֔וֹן כִּ֥י הִתְעַלַּ֖לְתְּ בִּ֑/י ל֤וּ יֶשׁ חֶ֨רֶב֙ בְּ/יָדִ֔/י כִּ֥י עַתָּ֖ה הֲרַגְתִּֽי/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/029.yaml
  text: And Balaam said to the donkey[a], “Because you have made a mockery of me! If only there were a sword in my hand[c][b], I would kill you right now.”
translation:
  language: vi
  text: 'Ba-la-am nói với con lừa cái[a]: “Vì mày đã làm nhục tao![b] Giá mà trong tay tao có một thanh gươm, thì tao đã giết mày ngay rồi.”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tiếng Hê-bơ-rơ nói rõ đây là lừa cái; các dạng từ dùng để nói với nó cũng ở giống cái.
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “mày đã chế nhạo tao” hoặc “mày đã biến tao thành trò cười.” Động từ Hê-bơ-rơ có thể chỉ việc đối xử với ai một cách lạm dụng, giễu cợt hoặc khiến họ bị bẽ mặt.'
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “thì tao sẽ giết mày ngay.” Tiếng Hê-bơ-rơ diễn tả điều ước trái với thực tế cùng ý định hành động tức khắc của Ba-la-am.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: nói
  rationale: Thể wayyiqtol tiếp nối mạch kể; tiếng Việt không cần dịch máy móc liên từ וַ־, nên “nói” tự nhiên và chính xác.
- source_word: בִּלְעָם
  choice: Ba-la-am
  rationale: Phiên âm tên riêng theo lối quen thuộc, rõ âm tiết trong tiếng Việt.
- source_word: לָאָתוֹן
  choice: với con lừa cái
  rationale: Danh từ אָתוֹן chỉ rõ lừa giống cái; “con lừa cái” vừa tự nhiên vừa bảo toàn thông tin giới tính được tiếng Hê-bơ-rơ biểu thị.
- source_word: כִּי
  choice: Vì
  rationale: Giới thiệu lý do cho cơn giận và lời đe dọa của Ba-la-am; “Vì” phù hợp với lời nói trực tiếp.
- source_word: הִתְעַלַּלְתְּ בִּי
  choice: mày đã làm nhục tao
  rationale: Động từ hitpael của עלל có thể chỉ cách đối xử lạm dụng, giễu cợt hoặc biến ai thành trò cười. Trong ngữ cảnh Ba-la-am tức giận vì bị bẽ mặt, “làm nhục” truyền đạt tự nhiên sắc thái ấy mà không loại bỏ các khả năng gần nghĩa.
- source_word: לוּ
  choice: Giá mà
  rationale: Diễn tả một điều ước trái với thực tại hiện tại; “Giá mà” là cách nói hiện đại, tự nhiên.
- source_word: יֶשׁ חֶרֶב בְּיָדִי
  choice: trong tay tao có một thanh gươm
  rationale: Giữ hình ảnh hiện hữu theo nguyên văn, “có một thanh gươm trong tay,” đồng thời đảo trật tự nhẹ để câu tiếng Việt trôi chảy.
- source_word: חֶרֶב
  choice: thanh gươm
  rationale: Tương đương trực tiếp; loại từ “thanh” tự nhiên trong tiếng Việt.
- source_word: כִּי עַתָּה
  choice: ngay bây giờ
  rationale: Trong lời đe dọa, cụm này nhấn mạnh hành động tức khắc; “ngay bây giờ” chuyển tải đúng sức nặng.
- source_word: הֲרַגְתִּיךְ
  choice: tao đã giết mày rồi
  rationale: Kết hợp với לוּ và mệnh đề điều ước phi thực, dạng hoàn thành diễn tả hậu quả mà Ba-la-am cho rằng đã xảy ra nếu có gươm. Cấu trúc “thì ... đã ... rồi” là cách diễn đạt điều kiện trái thực tự nhiên trong tiếng Việt, đồng thời vẫn có thể được hiểu như lời đe dọa tức thời.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Đại từ “mày–tao” phản ánh cơn giận, sự khinh miệt và việc Ba-la-am nói với một con vật; đây không phải cách xưng hô trung tính. Dấu cảm thán giữ sức bật của lời bộc phát. Các chú thích bảo toàn độ rộng nghĩa của הִתְעַלַּלְתְּ và sự nhập nhằng về cách biểu đạt hệ quả phi thực của הֲרַגְתִּיךְ.
