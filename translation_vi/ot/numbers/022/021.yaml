base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/021.yaml
  text: So Balaam rose in the morning[a], saddled his donkey, and went with the princes of Moab.
translation:
  language: vi
  text: Vậy, vào buổi sáng, Ba-la-am thức dậy, thắng yên cho con lừa cái của mình rồi đi cùng các thủ lĩnh Mô-áp.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקָם
  choice: thức dậy
  rationale: Động từ קום trong chuỗi tường thuật diễn tả việc Ba-la-am trỗi dậy vào buổi sáng; “thức dậy” tự nhiên trong tiếng Việt ở ngữ cảnh này mà không thêm sắc thái trang trọng không cần thiết.
- source_word: בִּלְעָם
  choice: Ba-la-am
  rationale: Phiên âm tên riêng theo cách dùng Kinh Thánh tiếng Việt quen thuộc.
- source_word: בַּבֹּקֶר
  choice: sáng hôm sau
  rationale: Cụm từ có nghĩa trực tiếp là “vào buổi sáng”; trong mạch kể liên tiếp, “sáng hôm sau” diễn đạt tự nhiên quan hệ thời gian mà không hàm ý “từ sáng sớm” vốn không được nêu rõ.
- source_word: וַיַּחֲבֹשׁ
  choice: thắng yên cho
  rationale: חבש khi dùng với lừa chỉ việc chuẩn bị con vật để cưỡi bằng cách đặt và buộc yên; “thắng yên cho” là cách diễn đạt tự nhiên, chính xác.
- source_word: אֶת אֲתֹנוֹ
  choice: con lừa cái của mình
  rationale: אָתוֹן chỉ đích danh lừa cái. Tiếng Việt diễn đạt giới tính này tự nhiên ngay trong chính văn, nên không cần làm mờ thành “con lừa” hoặc chuyển thông tin sang chú thích.
- source_word: וַיֵּלֶךְ
  choice: đi
  rationale: הלך trong lời kể đơn giản có nghĩa là “đi”; lựa chọn này không thêm ý “lên đường” ngoài điều động từ trực tiếp biểu đạt.
- source_word: עִם
  choice: cùng
  rationale: Diễn đạt trực tiếp quan hệ đồng hành bằng tiếng Việt tự nhiên.
- source_word: שָׂרֵי מוֹאָב
  choice: các thủ lĩnh Mô-áp
  rationale: שָׂרִים có thể chỉ những người cai trị, quan chức hay thủ lĩnh. “Các thủ lĩnh” giữ được địa vị lãnh đạo mà không áp đặt rằng họ nhất thiết là hoàng tử theo huyết thống.
