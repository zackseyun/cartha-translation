  source_fidelity: 'Bản nháp phản ánh đúng chuỗi hành động của nguyên văn Hê-bơ-rơ: lừa cái thấy thiên sứ của Yahweh, ép mình vào tường, khiến chân Ba-la-am bị ép vào tường, rồi Ba-la-am đánh nó lần nữa. Tuy nhiên, mệnh đề gây khiến “làm chân Ba-la-am bị ép” giảm nhẹ cấu trúc trực tiếp của động từ thứ hai, trong đó con lừa trực tiếp ép chân ông vào tường.'
