id: NUM.22.25
reference: Numbers 22:25
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/תֵּ֨רֶא הָ/אָת֜וֹן אֶת מַלְאַ֣ךְ יְהוָ֗ה וַ/תִּלָּחֵץ֙ אֶל הַ/קִּ֔יר וַ/תִּלְחַ֛ץ אֶת רֶ֥גֶל בִּלְעָ֖ם אֶל הַ/קִּ֑יר וַ/יֹּ֖סֶף לְ/הַכֹּתָֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/025.yaml
  text: When the donkey saw the angel of Yahweh[a], she pressed herself against the wall and pressed Balaam’s foot against the wall, so he struck her again.
translation:
  language: vi
  text: Khi con lừa cái thấy thiên sứ của Yahweh[a], nó ép mình sát vào tường, ép chân Ba-la-am vào tường; vì thế ông lại đánh nó.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “sứ giả của Yahweh.” Trong ngữ cảnh này, nhân vật rõ ràng là một hữu thể siêu nhiên, nên chính văn dùng “thiên sứ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאָתוֹן
  choice: lừa cái
  rationale: Danh từ אָתוֹן chỉ con lừa giống cái. “Lừa cái” vừa chính xác vừa tự nhiên, đồng thời giúp các đại từ “nó” trong tiếng Việt không làm mất thông tin về giới tính của con vật.
- source_word: מַלְאַךְ יְהוָה
  choice: thiên sứ của Yahweh
  rationale: מַלְאַךְ có thể là “sứ giả” hoặc “thiên sứ”; trong mạch truyện này, nhân vật rõ ràng là một hữu thể siêu nhiên nên “thiên sứ” phù hợp trong chính văn.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng giao ước của Đức Chúa Trời thay vì thay thế bằng một tước hiệu.
- source_word: וַתִּלָּחֵץ אֶל הַקִּיר
  choice: nó ép mình sát vào tường
  rationale: Cách diễn đạt phản thân truyền đạt việc con lừa dồn thân mình vào sát bức tường; “sát” làm rõ mức độ chèn ép.
- source_word: וַתִּלְחַץ אֶת רֶגֶל בִּלְעָם אֶל הַקִּיר
  choice: làm chân Ba-la-am bị ép vào tường
  rationale: Cùng gốc לחץ được giữ bằng động từ “ép”, còn cấu trúc gây khiến “làm... bị ép” diễn đạt tự nhiên việc chuyển động của con lừa khiến chân Ba-la-am bị kẹp vào tường.
- source_word: רֶגֶל
  choice: chân
  rationale: “Chân” là từ tiếng Việt tự nhiên và đủ chính xác trong ngữ cảnh; tiếng Hê-bơ-rơ có thể chỉ bàn chân hoặc chân nói chung.
- source_word: וַיֹּסֶף לְהַכֹּתָהּ
  choice: ông lại đánh nó
  rationale: Cấu trúc יָסַף cộng nguyên mẫu biểu thị hành động lặp lại; “lại đánh” ngắn gọn và không hàm ý một trận đánh kéo dài hơn điều câu văn nói.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Chính văn dùng trực tiếp danh giao ước יהוה; “Yahweh” bảo tồn tư cách danh riêng mà không thay bằng tước hiệu.
- issue: Nghĩa của מַלְאַךְ trong cụm מַלְאַךְ יְהוָה
  choice: thiên sứ của Yahweh
  alternative: sứ giả của Yahweh
  rationale: Từ này vốn có thể mang cả hai nghĩa, nhưng ngữ cảnh kể chuyện cho thấy một hữu thể siêu nhiên. Chú thích vẫn bảo tồn khả năng dịch theo nghĩa rộng là “sứ giả” mà không xác định thêm bản thể của nhân vật.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “lừa cái” để giữ thông tin giới tính từ nguyên ngữ; dùng “nó” cho con vật và “ông” cho Ba-la-am. Dấu chấm phẩy giúp phân tách chuỗi hành động dài mà vẫn giữ nhịp kể của tiếng Hê-bơ-rơ.
