translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “ta—ngươi” phù hợp lời một vị vua nói với người được triệu đến, không quá cổ kính. “Trọng đãi” giữ được ngôn ngữ về danh dự của căn tố כבד nhưng cũng phù hợp hàm ý ban thưởng trong văn cảnh.
