base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/017.yaml
  text: For I will greatly honor you[a], and I will do whatever you say to me. So please come, curse this people for me.
translation:
  language: vi
  text: Vì ta sẽ hết sức trọng vọng ngươi,[a] và bất cứ điều gì ngươi bảo ta, ta cũng sẽ làm. Vậy, xin hãy đến nguyền rủa dân này vì ta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Ta nhất định sẽ rất tôn trọng ngươi” hoặc “Ta sẽ hậu thưởng ngươi.” Tiếng Hê-bơ-rơ dùng nguyên mẫu tuyệt đối cùng với động từ hữu hạn để nhấn mạnh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Vì
  rationale: Dẫn vào lời giải thích và hứa hẹn của Ba-lác làm cơ sở cho lời thỉnh cầu tiếp theo.
- source_word: כַבֵּד אֲכַבֶּדְךָ מְאֹד
  choice: ta nhất định sẽ hết sức trọng đãi ngươi
  rationale: Cấu trúc nguyên mẫu tuyệt đối đi với động từ hữu hạn nhấn mạnh lời hứa; “nhất định” và “hết sức” cùng truyền đạt sức nhấn mạnh của cấu trúc và מְאֹד. “Trọng đãi” giữ ý tôn trọng, đề cao, đồng thời tự nhiên trong ngữ cảnh Ba-lác hứa ban thưởng.
- source_word: וְכֹל אֲשֶׁר תֹּאמַר אֵלַי אֶעֱשֶׂה
  choice: và ngươi bảo ta làm bất cứ điều gì, ta cũng sẽ làm
  rationale: Diễn đạt tự nhiên trong tiếng Việt mà vẫn giữ phạm vi bao quát của כֹל אֲשֶׁר và lời cam kết của Ba-lác.
- source_word: וּלְכָה נָּא
  choice: Vậy, xin hãy đến
  rationale: “Vậy” nối lời thỉnh cầu với lời hứa trước đó; “xin” thể hiện sắc thái khẩn khoản, lịch sự của נָא.
- source_word: קָבָה
  choice: nguyền rủa
  rationale: Chỉ hành động dùng lời để gọi tai họa xuống trên một dân, phù hợp trực tiếp với ngữ cảnh Ba-la-am.
- source_word: לִּי
  choice: giúp ta
  rationale: Trong tiếng Việt, “giúp ta” truyền đạt tự nhiên ý hành động vì lợi ích hoặc theo yêu cầu của Ba-lác; nghĩa sát hơn là “cho ta” hoặc “vì ta” được ghi nhận ở chú giải từ vựng nội bộ.
- source_word: אֵת הָעָם הַזֶּה
  choice: dân này
  rationale: Giữ nghĩa tập thể số ít của עָם bằng cách diễn đạt gọn và tự nhiên trong tiếng Việt.
