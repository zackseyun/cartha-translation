revisions:
- from: Vì ta nhất định sẽ hết sức trọng đãi ngươi,[a] và ngươi bảo ta làm bất cứ điều gì, ta cũng sẽ làm. Vậy, xin hãy đến nguyền rủa dân này giúp ta.
  to: Vì ta sẽ hết sức trọng vọng ngươi,[a] và bất cứ điều gì ngươi bảo ta, ta cũng sẽ làm. Vậy, xin hãy đến nguyền rủa dân này vì ta.
  rationale: Bản sửa giữ lực nhấn mạnh của nguyên mẫu tuyệt đối cùng מְאֹד bằng “sẽ hết sức”, chuyển nghĩa chính của כבד sang “trọng vọng” để bảo toàn ngôn ngữ danh dự, và chỉ giữ “hậu thưởng” như một khả năng theo ngữ cảnh trong chú thích. Các điều chỉnh còn lại tăng tính tự nhiên và sát nghĩa của tiếng Việt mà không thay đổi ý câu.
  reviewer_model: gpt-5.6-terra
