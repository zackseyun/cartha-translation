base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/030.yaml
  text: Then the donkey said to Balaam[a], “Am I not your donkey, on which you have ridden all your life to this day? Have I ever been accustomed to do thus to you?” And he said, “No.”
translation:
  language: vi
  text: 'Bấy giờ, con lừa cái nói với Ba-la-am: “Chẳng phải tôi là con lừa cái của ông, mà ông đã cưỡi từ thuở trước cho đến ngày nay sao? Tôi có bao giờ quen làm như thế với ông không?” Ông đáp: “Không.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָאָתוֹן / אֲתֹנְךָ
  choice: con lừa cái / con lừa cái của ông
  rationale: Danh từ אָתוֹן chỉ rõ lừa cái. Tiếng Việt diễn đạt tự nhiên bằng “con lừa cái”; lần thứ hai thêm sở hữu “của ông” theo hậu tố ngôi hai số ít.
- source_word: הֲלוֹא אָנֹכִי
  choice: Chẳng phải tôi là ... sao?
  rationale: Giữ lực của câu hỏi tu từ mong đợi sự đồng tình, đồng thời dùng cấu trúc tiếng Việt hiện đại và tự nhiên.
- source_word: אֲשֶׁר רָכַבְתָּ עָלַי
  choice: con vật ông vẫn cưỡi
  rationale: Đại từ quan hệ được diễn đạt bằng cụm đồng vị tự nhiên trong tiếng Việt; “vẫn cưỡi” thể hiện hành động kéo dài theo ngữ cảnh.
- source_word: מֵעוֹדְךָ עַד הַיּוֹם הַזֶּה
  choice: từ trước đến ngày nay
  rationale: Cụm Hê-bơ-rơ có nghĩa từ thời gian trước đây, xuyên suốt cho đến hiện tại. Cách dịch này tránh khẳng định quá mức rằng Ba-la-am đã cưỡi con lừa suốt toàn bộ đời mình.
- source_word: הַהַסְכֵּן הִסְכַּנְתִּי
  choice: Tôi có bao giờ quen
  rationale: Cấu trúc nguyên mẫu tuyệt đối đi với động từ cùng gốc nhấn mạnh thói quen hay lệ thường; “có bao giờ quen” giữ được sắc thái câu hỏi tu từ.
- source_word: לַעֲשׂוֹת לְךָ כֹּה
  choice: đối xử với ông như thế này
  rationale: כֹּה chỉ cách hành xử vừa xảy ra. “Đối xử ... như thế này” rõ nghĩa và tự nhiên hơn lối dịch sát chữ “làm như vậy cho ông”.
- source_word: וַיֹּאמֶר לֹא
  choice: 'Ông đáp: “Không.”'
  rationale: Chủ thể được xác định từ ngữ cảnh là Ba-la-am; “đáp” tự nhiên trong đối thoại và לֹא được giữ bằng câu trả lời phủ định trực tiếp.
theological_decisions: []
translation_notes:
  register: Văn phong trần thuật trang trọng vừa phải, hiện đại và dễ hiểu. Giữ việc con lừa tự xưng “tôi” và gọi Ba-la-am là “ông”, phù hợp quan hệ chủ-vật trong lời đối thoại mà không tạo sắc thái suồng sã.
