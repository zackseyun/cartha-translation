  to: 'Bấy giờ, con lừa cái nói với Ba-la-am: “Chẳng phải tôi là con lừa cái của ông, mà ông đã cưỡi từ thuở trước cho đến ngày nay sao? Tôi có bao giờ quen làm như thế với ông không?” Ông đáp: “Không.”'
