base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/039.yaml
  text: So Balaam went with Balak[a], and they came to Kiriath-huzoth.
translation:
  language: vi
  text: Vậy Ba-la-am đi cùng Ba-lác, rồi họ đến Ki-ri-át Hút-xốt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tên Ki-ri-át Hút-xốt có lẽ có nghĩa là “thành phố của những con phố” hoặc “thành phố của những nơi trống trải.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: đi
  rationale: Động từ Qal wayyiqtol của הלך tiếp nối mạch kể chuyện và ở đây mang nghĩa đơn giản, tự nhiên là “đi”.
- source_word: בִּלְעָם
  choice: Ba-la-am
  rationale: Tên riêng được phiên âm theo cách quen dùng trong tiếng Việt.
- source_word: עִם
  choice: cùng
  rationale: Giới từ diễn tả sự đồng hành; “đi cùng” là cách nói tự nhiên và sát nghĩa trong tiếng Việt hiện đại.
- source_word: בָּלָק
  choice: Ba-lác
  rationale: Tên riêng được phiên âm theo cách quen dùng trong tiếng Việt.
- source_word: וַיָּבֹאוּ
  choice: họ đến
  rationale: Dạng wayyiqtol số nhiều của בוא chỉ hành động kế tiếp; “họ đến” giữ nghĩa chuyển động cơ bản mà không xác định quá mức là đi vào hay tới nơi.
- source_word: קִרְיַת חֻצוֹת
  choice: Ki-ri-át Hu-xốt
  rationale: Cụm này được dùng như một địa danh nên được phiên âm trong chính văn; nghĩa từ nguyên được ghi ở chú thích.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện ngắn gọn, trang trọng nhưng tự nhiên trong tiếng Việt hiện đại. Giữ địa danh dưới dạng phiên âm và không giải nghĩa ngay trong chính văn.
