  text: וַ/יֹּ֣אמֶר אֲלֵי/הֶ֗ם לִ֤ינוּ פֹה֙ הַ/לַּ֔יְלָה וַ/הֲשִׁבֹתִ֤י אֶתְ/כֶם֙ דָּבָ֔ר כַּ/אֲשֶׁ֛ר יְדַבֵּ֥ר יְהוָ֖ה אֵלָ֑/י וַ/יֵּשְׁב֥וּ שָׂרֵֽי מוֹאָ֖ב עִם בִּלְעָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/008.yaml
  text: And he said to them[a], “Lodge here tonight[c][b], and I will bring back word to you according to what Yahweh speaks to me.” So the princes of Moab stayed with Balaam.
translation:
  language: vi
  text: 'Ông nói với họ: “Hãy nghỉ lại đây đêm nay, rồi tôi sẽ báo lại cho các ông đúng như điều Yahweh phán với tôi.” Vậy các thủ lĩnh Mô-áp ở lại với Ba-la-am.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִינוּ פֹה הַלַּיְלָה
  choice: Hãy nghỉ lại đây đêm nay
  rationale: Mệnh lệnh số nhiều của לון/לין chỉ việc ở lại qua đêm. “Nghỉ lại” tự nhiên trong tiếng Việt, đồng thời thể hiện rõ ý qua đêm khi đi cùng “đêm nay”.
- source_word: וַהֲשִׁבֹתִי אֶתְכֶם דָּבָר
  choice: rồi tôi sẽ báo lại cho các ông
  rationale: Cấu trúc Hiphil của שוב kết hợp với דָּבָר diễn tả việc mang lời hoặc câu trả lời trở lại. “Báo lại” truyền đạt tự nhiên ý hồi đáp mà không thêm nội dung ngoài nguyên văn.
- source_word: כַּאֲשֶׁר יְדַבֵּר יְהוָה אֵלָי
  choice: đúng như điều Yahweh phán với tôi
  rationale: כַּאֲשֶׁר biểu thị sự tương ứng; “đúng như điều” giữ sắc thái ấy. “Phán” phù hợp với lời của Đức Chúa Trời nhưng vẫn giữ động từ nói.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng YHWH, giữ danh thần linh xuất hiện trực tiếp trong văn bản Hê-bơ-rơ thay vì thay bằng một tước hiệu.
- source_word: וַיֵּשְׁבוּ
  choice: ở lại
  rationale: Trong ngữ cảnh sau lời mời qua đêm, ישב có nghĩa là lưu lại chứ không phải theo nghĩa đen “ngồi”.
- source_word: שָׂרֵי מוֹאָב
  choice: các thủ lĩnh Mô-áp
  rationale: שָׂרִים có thể chỉ các quan chức, lãnh đạo hoặc vương hầu. “Các thủ lĩnh” là cách gọi rộng, tự nhiên và không xác định quá mức địa vị chính xác của các sứ giả.
- source_word: בִּלְעָם
  choice: Ba-la-am
  rationale: Cách phiên âm tên riêng quen thuộc và dễ đọc trong tiếng Việt.
theological_decisions:
- issue: Cách dịch danh יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Nguyên văn dùng trực tiếp danh YHWH. Giữ “Yahweh” phân biệt danh riêng với tước hiệu và không che khuất dữ liệu của văn bản nguồn.
- issue: Mức độ chủ động của Ba-la-am trong câu trả lời
  choice: tôi sẽ báo lại cho các ông đúng như điều Yahweh phán với tôi
  alternative: tôi sẽ trả lời các ông
  rationale: Cách dịch được chọn giữ sự lệ thuộc của lời Ba-la-am vào điều Yahweh sẽ phán, thay vì khiến lời đáp nghe như do chính ông tự quyết định.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “các ông” để xưng hô lịch sự với một nhóm sứ giả; dùng “thủ lĩnh” thay vì “các hoàng tử” nhằm giữ phạm vi nghĩa rộng của שָׂרִים.
