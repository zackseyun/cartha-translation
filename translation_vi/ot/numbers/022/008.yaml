  terminology: “Yahweh” phản ánh trực tiếp danh YHWH theo định hướng dự án. “Các thủ lĩnh Mô-áp” giữ được độ rộng nghĩa của שָׂרֵי, không áp đặt cấp bậc cụ thể; “Ba-la-am” là dạng phiên âm quen thuộc. “Phán” phù hợp văn cảnh lời của Yahweh mà không làm thay đổi nghĩa của động từ “nói”.
