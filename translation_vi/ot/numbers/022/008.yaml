  source_fidelity: 'Bản dịch truyền đạt đúng các thành tố của nguyên văn: mệnh lệnh ở lại qua đêm, lời hứa sẽ hồi báo tùy theo điều Yahweh phán, và việc các thủ lĩnh Mô-áp ở lại với Ba-la-am. “Báo lại cho các ông” diễn đạt tự nhiên thành ngữ Hê-bơ-rơ về việc đem lời đáp trở lại mà không thêm ý nghĩa.'
