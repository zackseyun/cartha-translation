  terminology: Các tên Ba-lác, Xíp-bô, Y-sơ-ra-ên và A-mô-rít nhất quán với lối phiên âm Kinh Thánh tiếng Việt. «Dân A-mô-rít» diễn đạt phù hợp danh từ dân tộc số ít mang nghĩa tập thể trong nguyên ngữ. Chú thích giải thích đúng và không áp đặt diễn giải thần học.
