  source_fidelity: 'Bản dịch truyền đạt đúng các thành phần chính của câu Hê-bơ-rơ: Ba-lác, quan hệ cha-con với Xíp-bô, toàn bộ điều Y-sơ-ra-ên đã làm, và dân A-mô-rít được hiểu theo nghĩa tập thể. Tuy nhiên, động từ «làm» không đánh dấu rõ hành động đã hoàn tất trước thời điểm Ba-lác thấy, trong khi bản tiếng Anh audit cũng chọn thì quá khứ hoàn thành để làm rõ quan hệ này.'
