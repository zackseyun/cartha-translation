base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/002.yaml
  text: Balak son of Zippor saw all that Israel had done to the Amorites[a].
translation:
  language: vi
  text: Ba-lác, con trai Xíp-bô, đã thấy tất cả những gì Y-sơ-ra-ên đã làm cho dân A-mô-rít[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hê-bơ-rơ dùng danh từ dân tộc ở số ít theo nghĩa tập thể: “người A-mô-rít”, tức là dân A-mô-rít.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: đã thấy
  rationale: Động từ ראה ở dạng kể chuyện tiếp nối diễn tiến. “Đã thấy” diễn đạt tự nhiên hành động trong quá khứ mà không thêm một trạng từ thời gian không có trong nguyên văn.
- source_word: בָּלָק
  choice: Ba-lác
  rationale: Phiên âm tên riêng theo lối dùng quen thuộc trong tiếng Việt.
- source_word: בֶּן צִפּוֹר
  choice: con trai Xíp-bô
  rationale: Chuỗi liên kết chỉ dòng dõi; cách diễn đạt này tự nhiên và rõ nghĩa trong tiếng Việt.
- source_word: אֵת כָּל אֲשֶׁר
  choice: tất cả những gì
  rationale: Diễn đạt đầy đủ ý tổng thể của bổ ngữ trực tiếp và tự nhiên trong tiếng Việt hiện đại.
- source_word: עָשָׂה
  choice: làm
  rationale: Động từ hoàn thành Hê-bơ-rơ mô tả việc đã xảy ra trước lúc Ba-lác thấy; trạng thái quá khứ đã được thể hiện qua ngữ cảnh và “đã thấy”, nên “làm” tránh cấu trúc nặng nề.
- source_word: יִשְׂרָאֵל
  choice: Y-sơ-ra-ên
  rationale: Phiên âm tên dân tộc theo lối Kinh Thánh tiếng Việt quen thuộc.
- source_word: לָאֱמֹרִי
  choice: cho dân A-mô-rít
  rationale: Giữ quan hệ rộng của giới từ ל bằng “cho”, không diễn giải hẹp thành “chống lại”; danh từ số ít chỉ dân tộc được diễn đạt tự nhiên bằng danh từ tập thể “dân A-mô-rít”.
