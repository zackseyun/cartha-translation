  to: Con lừa đã thấy ta và tránh sang một bên trước mặt ta cả ba lần ấy. Nếu nó không tránh sang một bên trước mặt ta[a], thì hẳn đến bây giờ ta đã giết ngươi, còn nó thì ta đã để sống.
  rationale: Bản sửa thay các cụm không tự nhiên bằng cách diễn đạt rõ động tác con lừa đổi hướng trước mặt thiên sứ, đồng thời giữ nguyên cách hiểu phản thực đã được ngữ cảnh và bản tiếng Anh ghi nhận. Chú thích tiếp tục bảo tồn sự mơ hồ hình thức của nguyên văn Masoret mà không trình bày cách hiểu phản thực như một từ phủ định hiện diện trong văn bản.
