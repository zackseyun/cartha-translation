  text: וַ/תִּרְאַ֨/נִי֙ הָֽ/אָת֔וֹן וַ/תֵּ֣ט לְ/פָנַ֔/י זֶ֖ה שָׁלֹ֣שׁ רְגָלִ֑ים אוּלַי֙ נָטְתָ֣ה מִ/פָּנַ֔/י כִּ֥י עַתָּ֛ה גַּם אֹתְ/כָ֥ה הָרַ֖גְתִּי וְ/אוֹתָ֥/הּ הֶחֱיֵֽיתִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/033.yaml
  text: The donkey saw me and turned aside before me these three times. If she had not turned aside from before me[a], surely by now I would have killed you and let her live.
translation:
  language: vi
  text: Con lừa đã thấy ta và tránh sang một bên trước mặt ta cả ba lần ấy. Nếu nó không tránh sang một bên trước mặt ta[a], thì hẳn đến bây giờ ta đã giết ngươi, còn nó thì ta đã để sống.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hê-bơ-rơ sát nghĩa là “có lẽ nó đã tránh sang một bên trước mặt ta”; theo mạch văn, mệnh đề này thường được hiểu theo nghĩa phản thực: “nếu nó không tránh sang một bên trước mặt ta.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּרְאַנִי
  choice: thấy ta
  rationale: Động từ ראה chỉ sự nhìn thấy trực tiếp trong ngữ cảnh; cách dịch này đơn giản và tự nhiên.
- source_word: הָאָתוֹן
  choice: con lừa
  rationale: אָתוֹן chỉ lừa cái, nhưng tiếng Việt không cần nêu giới tính ở đây; đại từ “nó” vẫn tự nhiên và rõ nghĩa.
- source_word: וַתֵּט לְפָנַי
  choice: đã tránh khỏi mặt ta
  rationale: נטה diễn tả việc đổi hướng, tránh sang bên; cách dịch này phù hợp quan hệ không gian với vị thiên sứ và mạch kể.
- source_word: זֶה שָׁלֹשׁ רְגָלִים
  choice: ba lần này
  rationale: רְגָלִים ở đây là thành ngữ chỉ số lần xảy ra; “ba lần này” vừa gần nguyên văn vừa dễ hiểu.
- source_word: אוּלַי נָטְתָה מִפָּנַי
  choice: Nếu nó không tránh khỏi mặt ta
  rationale: Dù אוּלַי thường có nghĩa “có lẽ”, ngữ cảnh đòi hỏi một điều kiện phản thực; thêm “không” để truyền đạt ý nghĩa hàm ẩn, đồng thời ghi chú dị biệt hình thức.
- source_word: כִּי עַתָּה
  choice: thì chắc hẳn đến bây giờ
  rationale: Cụm từ mở đầu hệ quả với sắc thái nhấn mạnh và thời gian; cách dịch này diễn đạt tự nhiên trong tiếng Việt.
- source_word: גַּם אֹתְכָה הָרַגְתִּי
  choice: ta đã giết ngươi
  rationale: Dạng hoàn thành nằm trong mệnh đề kết quả phản thực nên tiếng Việt dùng “đã” sau cấu trúc “nếu... thì”; גַּם mang sắc thái nhấn mạnh đã được thể hiện qua sự đối lập với con lừa.
- source_word: וְאֹתָהּ הֶחֱיֵיתִי
  choice: và để nó sống
  rationale: Hiphil của חיה có nghĩa giữ cho sống hoặc để sống; cách dịch này ngắn gọn và bảo toàn sự tương phản với việc giết Ba-la-am.
theological_decisions:
- issue: Mệnh đề phản thực trong khi bản Hê-bơ-rơ Masoret không có từ phủ định minh nhiên sau אוּלַי
  choice: 'Dịch theo nghĩa: “Nếu nó không tránh khỏi mặt ta”'
  alternative: 'Dịch sát hình thức: “Có lẽ nó đã tránh khỏi mặt ta”'
  rationale: Mạch truyện cho thấy việc con lừa tránh sang bên đã ngăn cái chết của Ba-la-am. Dịch không có phủ định sẽ khiến quan hệ nguyên nhân—kết quả trở nên trái ngược; vì vậy bản dịch thể hiện nghĩa phản thực, nhưng ghi chú rõ hình thức nguyên văn để bảo tồn điểm khó và sự căng thẳng của văn bản.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ta/ngươi” để phản ánh lời phán trực tiếp mang thẩm quyền trong bối cảnh cổ, nhưng tránh từ ngữ quá cổ. Giữ hình ảnh “khỏi mặt ta” nhằm phản ánh מִפָּנַי và liên kết với sự hiện diện chắn đường của thiên sứ.
