  source_fidelity: Bản dịch truyền đạt đầy đủ lời thú tội, lý do không biết, việc thiên sứ đứng đối đầu trên đường, và ý định quay về. “Thiên sứ của Yahweh” phản ánh đúng מַלְאַךְ יְהוָה; chú thích thay thế “sứ giả” là phù hợp. Cụm “để đối đầu với tôi” diễn đạt hợp lý sắc thái đối nghịch của לִקְרָאתִי trong văn cảnh.
  naturalness: Câu nhìn chung hiện đại và trang trọng. Tuy nhiên, “nếu điều ấy là xấu trong mắt ngài” là lối chuyển nguyên văn chưa tự nhiên trong tiếng Việt hiện đại. Nên diễn đạt thành ngữ này tự nhiên trong chính văn và giữ cách nói sát chữ ở chú thích.
  terminology: “Ba-la-am,” “thiên sứ,” “Yahweh,” “phạm tội,” và đại từ kính trọng “ngài” đều nhất quán với văn phong trang trọng. Không cần thay đổi thuật ngữ thần học.
