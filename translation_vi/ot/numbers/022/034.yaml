id: NUM.22.34
reference: Numbers 22:34
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר בִּלְעָ֜ם אֶל מַלְאַ֤ךְ יְהוָה֙ חָטָ֔אתִי כִּ֚י לֹ֣א יָדַ֔עְתִּי כִּ֥י אַתָּ֛ה נִצָּ֥ב לִ/קְרָאתִ֖/י בַּ/דָּ֑רֶךְ וְ/עַתָּ֛ה אִם רַ֥ע בְּ/עֵינֶ֖י/ךָ אָשׁ֥וּבָה לִּֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/034.yaml
  text: Then Balaam said to the angel of Yahweh[a], “I have sinned, for I did not know that you were standing to confront me on the road. And now, if it is evil in your eyes[b], I will turn back.”
translation:
  language: vi
  text: 'Ba-la-am thưa với thiên sứ của Yahweh[a]: “Tôi đã phạm tội, vì tôi không biết ngài đang đứng trên đường để đối đầu với tôi. Bây giờ, nếu ngài xem điều đó là xấu[b], tôi sẽ quay về.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “sứ giả của Yahweh.”'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “nếu điều ấy là xấu trong mắt ngài.”'
    reason: source_idiom
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: thiên sứ của Yahweh
  rationale: מַלְאַךְ có thể chỉ sứ giả hoặc thiên sứ; trong bối cảnh đây là một hữu thể siêu nhiên hiện ra với gươm tuốt trần, nên “thiên sứ” phù hợp nhất. Giữ nguyên danh riêng Yahweh cho יְהוָה.
- source_word: חָטָאתִי
  choice: Tôi đã phạm tội
  rationale: Thể hoàn thành diễn tả lời nhìn nhận tội lỗi của Ba-la-am; cách nói này tự nhiên trong tiếng Việt và giữ ý nghĩa hiện tại của lời thú nhận.
- source_word: כִּי לֹא יָדַעְתִּי
  choice: vì tôi không biết
  rationale: כִּי nêu lý do cho lời thú nhận; “vì” là cách nối trực tiếp và tự nhiên.
- source_word: נִצָּב לִקְרָאתִי
  choice: đang đứng trên đường để đối đầu với tôi
  rationale: נִצָּב diễn tả việc đứng vững tại chỗ, còn לִקְרָאתִי là hướng đến hoặc ra gặp tôi. Trong bối cảnh thiên sứ chặn đường với gươm tuốt trần, “đối đầu với tôi” giữ được sắc thái đối nghịch mà không giải thích quá mức.
- source_word: בַּדָּרֶךְ
  choice: trên đường
  rationale: Cụm từ chỉ địa điểm, được chuyển sang cách nói ngắn gọn và tự nhiên trong tiếng Việt.
- source_word: וְעַתָּה
  choice: Bây giờ
  rationale: Đánh dấu bước chuyển từ lời thú nhận sang đề nghị quay về; tiếng Việt không cần giữ liên từ “và” để câu nói tự nhiên.
- source_word: אִם רַע בְּעֵינֶיךָ
  choice: nếu điều ấy là xấu trong mắt ngài
  rationale: Giữ hình ảnh nguyên ngữ “xấu trong mắt” và sức nặng đạo đức của רַע, đồng thời thêm “điều ấy” để câu tiếng Việt rõ nghĩa.
- source_word: אָשׁוּבָה לִּי
  choice: tôi sẽ quay về
  rationale: Dạng cohortative biểu thị ý định hoặc sự sẵn lòng trở lại; “sẽ quay về” tự nhiên và giữ hướng chuyển động. Sắc thái dative לִּי không cần biểu đạt riêng.
theological_decisions:
- issue: Cách dịch danh Đức Chúa Trời יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Nguyên văn dùng trực tiếp Tứ Tự Danh; phiên âm “Yahweh” bảo tồn đây là danh riêng giao ước thay vì thay bằng một tước hiệu.
- issue: Sắc thái lời thú tội của Ba-la-am
  choice: Giữ lời thú nhận “Tôi đã phạm tội” nhưng không giải thích mức độ chân thành
  alternative: Diễn giải đây là sự ăn năn chân thành hoặc chỉ là lời nhận lỗi miễn cưỡng
  rationale: Câu này ghi lại lời thú nhận và đề nghị quay về nhưng không tự nó xác định đầy đủ động cơ nội tâm; bản dịch không nên giải quyết thay sự căng thẳng của trình thuật.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “thưa với” vì Ba-la-am đang nói với một nhân vật có thẩm quyền; đại từ “ngài” giữ sự kính trọng. Giữ thành ngữ Hê-bơ-rơ “xấu trong mắt ngài” trong chính văn và chú thích tính nguyên văn.
