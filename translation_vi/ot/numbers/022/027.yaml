source:
  edition: WLC
  text: וַ/תֵּ֤רֶא הָֽ/אָתוֹן֙ אֶת מַלְאַ֣ךְ יְהוָ֔ה וַ/תִּרְבַּ֖ץ תַּ֣חַת בִּלְעָ֑ם וַ/יִּֽחַר אַ֣ף בִּלְעָ֔ם וַ/יַּ֥ךְ אֶת הָ/אָת֖וֹן בַּ/מַּקֵּֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/027.yaml
  text: When the donkey saw the angel of Yahweh[a], she lay down under Balaam[b]. Then Balaam became angry and struck the donkey with his staff.
translation:
  language: vi
  text: Khi con lừa cái thấy thiên sứ của Yahweh, nó nằm xuống dưới Ba-la-am. Ba-la-am nổi giận và dùng gậy đánh con lừa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָאָתוֹן
  choice: lừa cái
  rationale: Danh từ אָתוֹן chỉ lừa cái. Tiếng Việt có thể diễn đạt giới tính tự nhiên, gọn và rõ bằng “lừa cái”; lần nhắc lại dùng “con lừa” để tránh nặng nề.
- source_word: מַלְאַךְ יְהוָה
  choice: thiên sứ của Yahweh
  rationale: מַלְאָךְ có thể là “sứ giả” hoặc “thiên sứ”; trong ngữ cảnh này, nhân vật siêu nhiên được nói đến nên “thiên sứ” phù hợp hơn.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ tên riêng của Đức Chúa Trời theo dạng phiên âm Yahweh, thay vì thay bằng một tước hiệu.
- source_word: וַתִּרְבַּץ
  choice: nó nằm phục xuống
  rationale: רבץ diễn tả việc nằm xuống hoặc phục xuống. “Nằm phục xuống” tự nhiên đối với con vật và không hàm ý mạnh hơn rằng nó ngã quỵ.
- source_word: תַּחַת בִּלְעָם
  choice: dưới Ba-la-am
  rationale: תַּחַת có nghĩa trực tiếp là “dưới, bên dưới”; Ba-la-am đang cưỡi lừa nên cách dịch này giữ nguyên hình ảnh của nguyên văn.
- source_word: וַיִּחַר אַף בִּלְעָם
  choice: Ba-la-am nổi giận
  rationale: Đây là thành ngữ Hê-bơ-rơ, nghĩa đen liên quan đến cơn giận bừng cháy. “Nổi giận” là cách diễn đạt tiếng Việt hiện đại, tự nhiên và sát nghĩa.
- source_word: וַיַּךְ
  choice: đánh
  rationale: נכה là động từ rộng nghĩa chỉ hành động đánh hoặc giáng vào. “Đánh” trực tiếp và không thêm ý rằng có nhiều cú đánh.
- source_word: בַּמַּקֵּל
  choice: dùng gậy
  rationale: מַקֵּל chỉ cây gậy hoặc que. “Dùng gậy” diễn đạt công cụ tự nhiên trong tiếng Việt; nguyên văn dùng mạo từ xác định nhưng không nói rõ sở hữu.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Nguyên văn ghi trực tiếp danh riêng יהוה. Giữ “Yahweh” bảo toàn chức năng tên riêng thay vì thay thế bằng tước hiệu.
- issue: Nghĩa của מַלְאָךְ trong cụm מַלְאַךְ יְהוָה
  choice: thiên sứ
  alternative: sứ giả
  rationale: Từ này tự nó có thể mang cả hai nghĩa, nhưng bối cảnh kể chuyện cho thấy đây là một sứ giả siêu nhiên; “thiên sứ” truyền đạt điều đó mà không xác định thêm bản thể của nhân vật.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “lừa cái” để thể hiện chính xác giới tính được mã hóa trong danh từ Hê-bơ-rơ; dùng đại từ “nó” theo cách tự nhiên của tiếng Việt. Tên Ba-la-am được phiên âm có gạch nối theo lối quen thuộc trong bản dịch Kinh Thánh tiếng Việt.
