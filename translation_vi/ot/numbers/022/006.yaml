  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/עַתָּה֩ לְכָ/ה נָּ֨א אָֽרָ/ה לִּ֜/י אֶת הָ/עָ֣ם הַ/זֶּ֗ה כִּֽי עָצ֥וּם הוּא֙ מִמֶּ֔/נִּי אוּלַ֤י אוּכַל֙ נַכֶּה בּ֔/וֹ וַ/אֲגָרְשֶׁ֖/נּוּ מִן הָ/אָ֑רֶץ כִּ֣י יָדַ֗עְתִּי אֵ֤ת אֲשֶׁר תְּבָרֵךְ֙ מְבֹרָ֔ךְ וַ/אֲשֶׁ֥ר תָּאֹ֖ר יוּאָֽר־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/006.yaml
  text: So now[a], please come and curse this people for me, because they are too mighty for me. Perhaps I will be able to strike them and drive them out of the land, for I know that whoever you bless is blessed[b], and whoever you curse is cursed.
translation:
  language: vi
  text: Vậy bây giờ, xin ông đến nguyền rủa dân này[a] cho tôi, vì họ mạnh hơn tôi. Có lẽ tôi sẽ có thể đánh họ[b] và đuổi họ khỏi xứ, vì tôi biết rằng ai ông chúc phước thì người ấy được phước, còn ai ông nguyền rủa thì người ấy bị nguyền rủa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tiếng Hê-bơ-rơ dùng danh từ tập hợp số ít, sát nghĩa là “dân này”; các đại từ theo sau cũng ở số ít.
    reason: lexical_alternative
  - marker: b
    text: 'Sát nghĩa: “đánh nó.” Đại từ số ít trong tiếng Hê-bơ-rơ chỉ toàn thể dân như một tập thể; tiếng Việt dùng “họ” tự nhiên hơn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Vậy bây giờ
  rationale: Giữ mối nối với lời nói trước đó và sắc thái chuyển sang một lời thỉnh cầu cấp bách.
- source_word: לְכָה נָּא
  choice: xin ông đến
  rationale: Diễn đạt mệnh lệnh đi kèm tiểu từ khẩn khoản נָא bằng lối nói tự nhiên, trang trọng trong tiếng Việt.
- source_word: אָרָה לִּי
  choice: nguyền rủa ... cho tôi
  rationale: Giữ nghĩa trực tiếp của động từ אָרַר là gọi lời nguyền xuống trên ai đó, đồng thời bảo toàn לִי, cho thấy việc này được làm theo lợi ích và lời yêu cầu của Ba-lác.
- source_word: הָעָם הַזֶּה
  choice: dân này
  rationale: Danh từ tập hợp số ít được chuyển tự nhiên sang tiếng Việt; “dân” phù hợp hơn “quốc gia” trong ngữ cảnh một cộng đồng đang di chuyển.
- source_word: כִּי עָצוּם הוּא מִמֶּנִּי
  choice: vì họ mạnh hơn tôi
  rationale: Giữ cấu trúc so sánh của tiếng Hê-bơ-rơ và thể hiện mối đe dọa về sức mạnh mà Ba-lác cảm nhận.
- source_word: אוּלַי אוּכַל
  choice: Có lẽ tôi sẽ có thể
  rationale: Bảo toàn cả sự bất định của אוּלַי lẫn ý về khả năng của אוּכַל.
- source_word: נַכֶּה בּוֹ
  choice: đánh họ
  rationale: “Đánh” giữ nghĩa cơ bản của נכה mà không diễn giải quá mức thành “đánh bại”; “họ” là cách quy chiếu tự nhiên trong tiếng Việt đến danh từ tập hợp “dân”.
- source_word: וַאֲגָרְשֶׁנּוּ מִן הָאָרֶץ
  choice: và đuổi họ khỏi xứ
  rationale: “Đuổi ... khỏi” truyền đạt chính xác động từ גרש và giới từ מן; “xứ” giữ sắc thái lãnh thổ mà không hiện đại hóa thành “quốc gia”.
- source_word: אֵת אֲשֶׁר תְּבָרֵךְ מְבֹרָךְ
  choice: ai ông chúc phước thì người ấy được phước
  rationale: Giữ cấu trúc quan hệ khái quát và trạng thái kết quả của phân từ bị động מְבֹרָךְ, không thêm tác nhân ban phước.
- source_word: וַאֲשֶׁר תָּאֹר יוּאָר
  choice: còn ai ông nguyền rủa thì người ấy bị nguyền rủa
  rationale: Duy trì phép song song đối lập với vế chúc phước và giữ dạng bị động của יוּאָר.
theological_decisions: []
translation_notes:
  register: Bản dịch dùng tiếng Việt hiện đại, trang trọng và dễ hiểu. Đại từ “ông” phù hợp với lời Ba-lác nói với Ba-la-am, còn các động từ “nguyền rủa,” “chúc phước” giữ sắc thái nghi lễ của ngữ cảnh. Cấu trúc song song ở cuối câu được bảo toàn.
