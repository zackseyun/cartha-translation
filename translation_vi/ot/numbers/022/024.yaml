  text: וַֽ/יַּעֲמֹד֙ מַלְאַ֣ךְ יְהוָ֔ה בְּ/מִשְׁע֖וֹל הַ/כְּרָמִ֑ים גָּדֵ֥ר מִ/זֶּ֖ה וְ/גָדֵ֥ר מִ/זֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/024.yaml
  text: Then the angel of Yahweh stood in a narrow path between the vineyards[a], with a wall on this side and a wall on that side.
translation:
  language: vi
  text: Bấy giờ, thiên sứ của Yahweh đứng trong một lối hẹp giữa các vườn nho[a], có tường ở bên này và tường ở bên kia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “sứ giả của Yahweh.” Từ Hê-bơ-rơ có thể có nghĩa là “sứ giả” hoặc “thiên sứ,” nhưng trong ngữ cảnh này, nghĩa chỉ một hữu thể siêu nhiên phù hợp hơn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֹד
  choice: Bấy giờ, ... đứng
  rationale: Dạng wayyiqtol của עמד tiếp nối diễn tiến câu chuyện; “Bấy giờ” tự nhiên trong văn kể tiếng Việt, còn “đứng” giữ nghĩa cơ bản của động từ.
- source_word: מַלְאַךְ יְהוָה
  choice: thiên sứ của Yahweh
  rationale: מַלְאָךְ có thể chỉ sứ giả hoặc thiên sứ; trong mạch truyện Ba-la-am, nhân vật siêu nhiên là nghĩa phù hợp. יְהוָה được phiên âm là “Yahweh” để giữ danh riêng của Đức Chúa Trời.
- source_word: בְּמִשְׁעוֹל
  choice: trên một lối hẹp
  rationale: מִשְׁעוֹל chỉ lối đi nhỏ hoặc chật hẹp. “Trên một lối hẹp” diễn đạt tự nhiên vị trí đứng và hoàn cảnh bị giới hạn.
- source_word: הַכְּרָמִים
  choice: giữa các vườn nho
  rationale: Danh từ ở số nhiều, và hai bức tường được nhắc ngay sau đó cho thấy lối đi nằm giữa các khu vườn nho.
- source_word: גָּדֵר
  choice: tường
  rationale: גָּדֵר có thể là tường hoặc hàng rào bao quanh. Không thêm “đá” vì nguyên văn không xác định vật liệu.
- source_word: מִזֶּה ... וְגָדֵר מִזֶּה
  choice: ở bên này và ... ở bên kia
  rationale: Giữ cấu trúc đối xứng của tiếng Hê-bơ-rơ và diễn đạt rõ rằng lối đi có tường ở cả hai phía.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Nguyên văn dùng trực tiếp danh riêng יהוה; phiên âm “Yahweh” bảo tồn tư cách danh riêng thay vì thay bằng một tước hiệu.
- issue: Nghĩa của מַלְאָךְ trong cụm מַלְאַךְ יְהוָה
  choice: thiên sứ
  alternative: sứ giả
  rationale: Từ này có thể mang cả hai nghĩa, nhưng ngữ cảnh thuật chuyện mô tả một hữu thể siêu nhiên nên “thiên sứ” phù hợp hơn; nghĩa từ vựng khác được ghi trong chú thích.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “thiên sứ” thay cho cách nói cổ hơn; giữ danh riêng “Yahweh.”
