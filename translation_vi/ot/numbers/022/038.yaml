source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר בִּלְעָ֜ם אֶל בָּלָ֗ק הִֽנֵּה בָ֨אתִי֙ אֵלֶ֔י/ךָ עַתָּ֕ה הֲ/יָכ֥וֹל אוּכַ֖ל דַּבֵּ֣ר מְא֑וּמָה הַ/דָּבָ֗ר אֲשֶׁ֨ר יָשִׂ֧ים אֱלֹהִ֛ים בְּ/פִ֖/י אֹת֥/וֹ אֲדַבֵּֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/038.yaml
  text: And Balaam said to Balak[a], “Look, I have come to you now. Am I really able to speak anything at all? I will speak only the word that God puts in my mouth.”
translation:
  language: vi
  text: 'Ba-la-am nói với Ba-lác: “Này, bây giờ tôi đã đến với ngài. Tôi thật sự có thể nói bất cứ điều gì sao?[a] Tôi sẽ chỉ nói lời mà Đức Chúa Trời đặt vào miệng tôi.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “Tôi quả có thể nói được điều gì sao?” Cấu trúc tiếng Hê-bơ-rơ nhấn mạnh ý khả năng.'
    reason: Phản ánh cấu trúc nguyên mẫu tuyệt đối đi với động từ hữu hạn, vốn tăng cường ý “có thể,” mà không thêm diễn giải “tự ý.”
lexical_decisions:
- source_word: הִנֵּה
  choice: Này
  rationale: Giữ sắc thái chỉ dẫn và nhấn mạnh của lời đáp, đồng thời tự nhiên trong văn phong trang trọng hiện đại.
- source_word: בָאתִי אֵלֶיךָ עַתָּה
  choice: bây giờ tôi đã đến với ngài
  rationale: Giữ cả ý đã đến và tính tức thời của עַתָּה; “ngài” phù hợp khi Ba-la-am nói với vua Ba-lác.
- source_word: הֲיָכוֹל אוּכַל
  choice: liệu tôi có thật sự có thể
  rationale: Phản ánh cấu trúc nhấn mạnh gồm động từ nguyên mẫu tuyệt đối và động từ hữu hạn, dưới hình thức câu hỏi tu từ tự nhiên trong tiếng Việt.
- source_word: דַּבֵּר מְאוּמָה
  choice: tự ý nói bất cứ điều gì
  rationale: “Bất cứ điều gì” chuyển tải phạm vi rộng của מְאוּמָה; “tự ý” làm rõ trong tiếng Việt rằng câu hỏi liên quan đến quyền tự quyết trong lời nói, dựa trên vế sau, nhưng không biến sự hạn chế thành một cơ chế được giải thích quá mức.
- source_word: הַדָּבָר
  choice: lời
  rationale: Trong ngữ cảnh lời tiên tri, “lời” vừa tự nhiên vừa giữ nét cụ thể của danh từ số ít.
- source_word: יָשִׂים אֱלֹהִים בְּפִי
  choice: Đức Chúa Trời đặt vào miệng tôi
  rationale: Giữ nguyên ẩn dụ Hê-bơ-rơ về lời được Đức Chúa Trời ban cho người nói.
- source_word: אֹתוֹ אֲדַבֵּר
  choice: Tôi sẽ nói lời ấy
  rationale: Đại từ tân ngữ đứng trước động từ tạo sự nhấn mạnh vào chính lời Đức Chúa Trời đặt trong miệng Ba-la-am; tiếng Việt thể hiện bằng “lời ấy”, không cần thêm ý ngoài văn bản.
- source_word: אֱלֹהִים
  choice: Đức Chúa Trời
  rationale: Động từ đi kèm ở số ít và ngữ cảnh chỉ về Đức Chúa Trời đang có quyền trên lời nói của Ba-la-am.
theological_decisions:
- issue: Quyền kiểm soát của Đức Chúa Trời đối với lời Ba-la-am
  choice: Ba-la-am phủ nhận khả năng tự ý nói và cam kết chỉ nói lời Đức Chúa Trời đặt vào miệng mình.
  alternative: Ba-la-am có thể nói tùy ý nhưng tự nguyện chọn hạn chế lời mình.
  rationale: Cấu trúc nhấn mạnh הֲיָכוֹל אוּכַל cùng với אֹתוֹ אֲדַבֵּר cho thấy sự hạn chế thực sự đối với lời nói của ông. Bản dịch giữ sức căng này mà không giải thích cụ thể cơ chế thần cảm.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “tôi/ngài” để phản ánh lời Ba-la-am thưa với vua Ba-lác; giữ thành ngữ “đặt vào miệng tôi” vì hình ảnh này rõ nghĩa và quan trọng trong ngữ cảnh tiên tri.
