    rationale: Động từ Hê-bơ-rơ nhấn mạnh khả năng nói, còn מְאוּמָה nghĩa là “bất cứ điều gì.” Ý “tự ý” có thể được suy ra từ vế sau nhưng không được phát biểu trực tiếp; nên tránh để bảo toàn mức độ hàm ý của nguyên văn.
  - severity: low
    issue: Câu cuối chưa diễn đạt minh thị tính độc quyền/giới hạn của אֹתוֹ אֲדַבֵּר.
    rationale: Tân ngữ “lời ấy” được đưa lên trước động từ để nhấn mạnh rằng chính lời Đức Chúa Trời đặt vào miệng Ba-la-am là điều ông sẽ nói. Thêm “chỉ” diễn đạt tự nhiên sự nhấn mạnh này.
