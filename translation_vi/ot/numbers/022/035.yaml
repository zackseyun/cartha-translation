  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ מַלְאַ֨ךְ יְהוָ֜ה אֶל בִּלְעָ֗ם לֵ֚ךְ עִם הָ֣/אֲנָשִׁ֔ים וְ/אֶ֗פֶס אֶת הַ/דָּבָ֛ר אֲשֶׁר אֲדַבֵּ֥ר אֵלֶ֖י/ךָ אֹת֣/וֹ תְדַבֵּ֑ר וַ/יֵּ֥לֶךְ בִּלְעָ֖ם עִם שָׂרֵ֥י בָלָֽק־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/035.yaml
  text: Then the angel of Yahweh said to Balaam[a], “Go with the men, but only the word that I speak to you[c][b], that you shall speak.” So Balaam went with the officials of Balak.
translation:
  language: vi
  text: 'Bấy giờ, thiên sứ của Yahweh[a] nói với Ba-la-am: “Hãy đi cùng những người ấy. Nhưng ngươi chỉ được nói lời ta sẽ phán với ngươi[b].” Vậy Ba-la-am đi cùng các quan chức của Ba-lác[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “sứ giả của Yahweh”.
    reason: lexical_alternative
  - marker: b
    text: Từ Hê-bơ-rơ được dịch là “lời” cũng có thể có nghĩa là “điều”, “việc” hoặc “sứ điệp”.
    reason: lexical_alternative
  - marker: c
    text: Hay “các thủ lĩnh” hoặc “các vương hầu của Ba-lác”.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: thiên sứ của Yahweh
  rationale: מַלְאַךְ có thể là “sứ giả” hoặc “thiên sứ”; trong trình thuật này, nhân vật siêu nhiên đối diện Ba-la-am nên “thiên sứ” phù hợp hơn. Danh riêng יְהוָה được phiên âm là “Yahweh”.
- source_word: לֵךְ עִם הָאֲנָשִׁים
  choice: Hãy đi cùng những người ấy
  rationale: Mệnh lệnh và giới từ עִם được chuyển trực tiếp; “những người ấy” chỉ nhóm đàn ông đã được xác định trong ngữ cảnh và tự nhiên hơn trong tiếng Việt.
- source_word: וְאֶפֶס
  choice: Nhưng ... chỉ
  rationale: Cụm này đặt một giới hạn nghiêm ngặt trên sự cho phép vừa được ban; cấu trúc “nhưng ... chỉ” diễn đạt rõ sắc thái đối lập và hạn định.
- source_word: הַדָּבָר
  choice: lời
  rationale: דָּבָר có thể mang nghĩa “lời”, “việc” hoặc “điều”; trong ngữ cảnh nói năng và với động từ דבר lặp lại, “lời” là tự nhiên nhất, đồng thời giữ liên hệ từ vựng.
- source_word: אֲדַבֵּר אֵלֶיךָ
  choice: ta sẽ phán với ngươi
  rationale: Thể chưa hoàn thành mang ý nghĩa tương lai trong ngữ cảnh. “Phán” phù hợp với lời nói của thiên sứ đại diện Yahweh, còn “ngươi” duy trì lối xưng hô trực tiếp, trang trọng trong lời truyền lệnh.
- source_word: אֹתוֹ תְדַבֵּר
  choice: ngươi chỉ được nói
  rationale: 'Đại từ tân ngữ đặt trước tạo nhấn mạnh: Ba-la-am chỉ được nói chính lời đã truyền, không được nói lời nào khác. Cách diễn đạt này tự nhiên trong tiếng Việt mà vẫn giữ lực hạn định.'
- source_word: שָׂרֵי בָלָק
  choice: các quan chức của Ba-lác
  rationale: שָׂרִים có thể chỉ quan chức, thủ lĩnh hoặc vương hầu; “quan chức” phù hợp với phái đoàn ngoại giao và tránh hàm ý họ nhất thiết là con vua.
theological_decisions:
- issue: Cách chuyển dịch danh Đức Chúa Trời יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Bản Hê-bơ-rơ dùng trực tiếp Tứ tự thánh; phiên âm “Yahweh” giữ danh riêng thay vì thay bằng một tước hiệu.
- issue: Tính tuyệt đối của giới hạn đặt trên lời Ba-la-am
  choice: “ngươi chỉ được nói lời ta sẽ phán với ngươi”
  alternative: “ngươi phải nói lời ta phán với ngươi”
  rationale: 'Cách chọn giữ sự nhấn mạnh của אֹתוֹ và lực hạn định của וְאֶפֶס: Ba-la-am không được tự ý thêm lời khác, nhưng không suy diễn thêm nội dung thần học ngoài câu.'
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ta–ngươi” trong lời truyền lệnh trực tiếp để thể hiện quan hệ quyền uy; phiên âm các tên riêng theo dạng quen dùng trong tiếng Việt. Các dấu chú thích [a], [b], [c] đều được đặt ngay sau từ hoặc cụm từ liên quan.
