base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/009.yaml
  text: Then God came to Balaam and said, “Who are these men with you?”
translation:
  language: vi
  text: 'Bấy giờ, Đức Chúa Trời đến với Ba-la-am và phán: “Những người này ở cùng ngươi là ai?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא
  choice: đến với
  rationale: Động từ בוא ở thể Qal trong mạch kể chuyện diễn tả Đức Chúa Trời đến với Ba-la-am; “đến với” tự nhiên và không hàm ý cụ thể rằng Ngài bước vào một nơi nào.
- source_word: אֱלֹהִים
  choice: Đức Chúa Trời
  rationale: Danh từ đi với động từ số ít và trong ngữ cảnh chỉ Đức Chúa Trời đang đích thân nói với Ba-la-am.
- source_word: בִּלְעָם
  choice: Ba-la-am
  rationale: Phiên âm tên riêng theo cách dùng Kinh Thánh tiếng Việt quen thuộc.
- source_word: וַיֹּאמֶר
  choice: phán
  rationale: אמר dẫn vào lời nói trực tiếp; khi chủ thể là Đức Chúa Trời, “phán” là cách diễn đạt tiếng Việt trang trọng và tự nhiên.
- source_word: מִי
  choice: ai
  rationale: Đại từ nghi vấn yêu cầu xác định danh tính của những người hiện diện.
- source_word: הָאֲנָשִׁים הָאֵלֶּה
  choice: những người
  rationale: Cụm từ chỉ các sứ giả nam đang hiện diện. Trong tiếng Việt, “những người” tự nhiên hơn “những người đàn ông” và không làm sai lệch đối tượng trong ngữ cảnh.
- source_word: עִמָּךְ
  choice: đang ở với ngươi
  rationale: עם với hậu tố ngôi hai diễn tả sự hiện diện hoặc đồng hành; thêm “đang ở” làm câu hỏi tự nhiên trong tiếng Việt mà vẫn giữ nghĩa “với ngươi”.
- source_word: וַ
  choice: Bấy giờ
  rationale: Waw nối tiếp trên động từ mở đầu thúc đẩy trình tự kể chuyện; “Bấy giờ” giữ sắc thái tuần tự trong văn kể trang trọng.
theological_decisions:
- issue: Đối tượng được אֱלֹהִים chỉ đến trong trình thuật Ba-la-am
  choice: Đức Chúa Trời
  alternative: một vị thần; thần linh
  rationale: Sự hòa hợp với động từ số ít cùng ngữ cảnh trình thuật cho thấy từ này chỉ Đức Chúa Trời, nhưng bản dịch không thêm lời giải thích về mục đích của câu hỏi.
- issue: Ý nghĩa câu hỏi của Đức Chúa Trời
  choice: Giữ nguyên câu hỏi trực tiếp về danh tính
  alternative: Diễn giải rằng Đức Chúa Trời hỏi để khiển trách hoặc để thu thập thông tin
  rationale: Nguyên văn chỉ ghi câu hỏi “ai”; không nên giải quyết ngầm sự căng thẳng thần học về việc Đức Chúa Trời hỏi điều Ngài có thể đã biết.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Trời” và đại từ “ngươi” phù hợp lối kể Kinh Thánh tiếng Việt; không cần chú thích vì câu không có dị bản hay sự mơ hồ cần giải trình trong bản văn.
