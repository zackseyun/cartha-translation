  terminology: “Đức Chúa Trời” phản ánh đúng אֱלֹהִים trong ngữ cảnh này; “Ba-la-am” là dạng phiên âm quen dùng. “Phán” phù hợp văn phong trang trọng khi Đức Chúa Trời là chủ thể.
