  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יִּפְתַּ֥ח יְהוָ֖ה אֶת פִּ֣י הָ/אָת֑וֹן וַ/תֹּ֤אמֶר לְ/בִלְעָם֙ מֶה עָשִׂ֣יתִֽי לְ/ךָ֔ כִּ֣י הִכִּיתַ֔/נִי זֶ֖ה שָׁלֹ֥שׁ רְגָלִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/028.yaml
  text: Then Yahweh opened the mouth of the donkey[a], and she said to Balaam, “What have I done to you[b], that you have struck me these three times?”
translation:
  language: vi
  text: 'Bấy giờ, Yahweh mở miệng của con lừa cái[a], và nó nói với Ba-la-am: “Tôi đã làm gì đối với ông mà ông đánh tôi ba lần này[b]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tiếng Hê-bơ-rơ nói sát nghĩa là “miệng của con lừa cái”; danh từ chỉ “con lừa” ở đây là giống cái.
    reason: lexical_alternative
  - marker: b
    text: Cụm từ Hê-bơ-rơ nói sát nghĩa là “ba bàn chân này”; đây là một thành ngữ có nghĩa là “ba lần này” hoặc “ba dịp này.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְתַּח
  choice: mở
  rationale: Động từ qal diễn tả hành động trực tiếp của Yahweh; “mở miệng” vừa sát nguyên văn vừa tự nhiên trong tiếng Việt.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời, giữ nguyên tính chất tên riêng của Tứ Tự Danh thay vì thay bằng một tước hiệu.
- source_word: פִּי הָאָתוֹן
  choice: miệng con lừa cái
  rationale: Danh từ אָתוֹן chỉ lừa cái. Cách dịch này truyền đạt rõ giống cái, điều cũng được thể hiện qua dạng động từ giống cái ở mệnh đề sau.
- source_word: וַתֹּאמֶר
  choice: và nó nói
  rationale: Chủ thể là con lừa cái; đại từ “nó” tự nhiên trong tiếng Việt khi nói về một con vật và tránh nhân cách hóa quá mức.
- source_word: לְבִלְעָם
  choice: với Ba-la-am
  rationale: Giới từ לְ với động từ “nói” được diễn đạt tự nhiên là “nói với”; “Ba-la-am” là dạng phiên âm quen thuộc trong tiếng Việt.
- source_word: מֶה עָשִׂיתִי לְךָ
  choice: Tôi đã làm gì ông
  rationale: Câu hỏi khiếu trách được chuyển sang cấu trúc tiếng Việt tự nhiên, trong đó quan hệ “đối với ông” đã được hàm chứa.
- source_word: כִּי
  choice: mà
  rationale: Trong câu hỏi này, כִּי nối hành động bị chất vấn với hệ quả là bị đánh; “mà” thể hiện tự nhiên sắc thái “đến nỗi/vì sao lại” mà không buộc phải chọn một quan hệ nhân quả cứng nhắc.
- source_word: הִכִּיתַנִי
  choice: ông đánh tôi
  rationale: נכה ở đây là đánh hoặc giáng đòn; “đánh” chính xác, thông dụng và phù hợp ngữ cảnh hơn từ trang trọng “đập” hay “đánh đòn”.
- source_word: זֶה שָׁלֹשׁ רְגָלִים
  choice: đến ba lần thế này
  rationale: רְגָלִים theo nghĩa đen là “chân/bước chân” nhưng ở đây là thành ngữ chỉ số lần hay dịp. “Đến ba lần thế này” giữ được cả con số lẫn sắc thái nhấn mạnh của זֶה.
theological_decisions:
- issue: Cách chuyển dịch danh יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Bản Hê-bơ-rơ dùng trực tiếp Tứ Tự Danh. Giữ “Yahweh” bảo toàn danh riêng trong nguồn văn mà không thay bằng tước hiệu hay áp đặt cách đọc mang tính truyền thống hệ phái.
- issue: Tác nhân khiến con lừa nói
  choice: Yahweh mở miệng con lừa cái
  alternative: Yahweh khiến con lừa cái nói
  rationale: Giữ hình ảnh cụ thể của nguyên văn và hành động trực tiếp của Yahweh, thay vì diễn giải thành một phát biểu khái quát về phép lạ.
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại. Dùng “tôi–ông” trong lời con lừa để thể hiện lời chất vấn trực tiếp mà không thêm sắc thái thân mật hay miệt thị. Hai dấu chú thích [a], [b] đều xuất hiện trong chính văn.
