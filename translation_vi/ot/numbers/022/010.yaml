base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/010.yaml
  text: And Balaam said to God[a], “Balak son of Zippor, king of Moab, has sent to me:”
translation:
  language: vi
  text: 'Ba-la-am thưa với Đức Chúa Trời: “Ba-lác, con trai Xíp-bô, vua Mô-áp, đã sai người đến chỗ tôi[a]:”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đã cho gọi tôi.” Tiếng Hê-bơ-rơ sát nghĩa là “đã sai [người] đến với tôi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: thưa
  rationale: Động từ אמר mở đầu lời nói; trong ngữ cảnh Ba-la-am nói với Đức Chúa Trời, “thưa” là cách diễn đạt tự nhiên, trang trọng và thể hiện đúng quan hệ giao tiếp mà không thêm nội dung.
- source_word: בִּלְעָם
  choice: Ba-la-am
  rationale: Phiên âm tên riêng theo lối quen dùng và dễ đọc trong tiếng Việt.
- source_word: אֶל הָאֱלֹהִים
  choice: với Đức Chúa Trời
  rationale: Mạo từ cùng ngữ cảnh số ít xác định đây là Đức Chúa Trời đang phán với Ba-la-am ở câu trước; “thưa với Đức Chúa Trời” là cấu trúc tiếng Việt tự nhiên.
- source_word: בָּלָק בֶּן צִפֹּר
  choice: Ba-lác, con trai Xíp-bô
  rationale: Giữ quan hệ phụ tử của cụm danh từ Hê-bơ-rơ và dùng cách đồng vị tự nhiên trong tiếng Việt.
- source_word: מֶלֶךְ מוֹאָב
  choice: vua Mô-áp
  rationale: Dịch sát tước vị và địa danh trong cụm đồng vị nhận diện Ba-lác.
- source_word: שָׁלַח אֵלָי
  choice: đã sai người đến gặp tôi
  rationale: Động từ hoàn thành chỉ hành động đã xảy ra và còn liên hệ đến lời trình bày hiện tại. Tiếng Hê-bơ-rơ nói sát nghĩa là “đã sai đến tôi”; thêm “người” làm rõ đối tượng được sai vốn được ngữ cảnh hàm ý, còn chú thích giữ lại cách hiểu khác.
theological_decisions:
- issue: Đối tượng của הָאֱלֹהִים
  choice: Đức Chúa Trời mà Ba-la-am đang thưa chuyện
  alternative: một thần hoặc các thần theo nghĩa chung
  rationale: Mạo từ và mạch văn trực tiếp nối với cuộc gặp gỡ thần linh ở câu trước xác định đối tượng là Đức Chúa Trời; cách dịch không thêm một khẳng định giáo phái nào.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng và dễ hiểu. Dùng “thưa” cho lời Ba-la-am nói với Đức Chúa Trời; giữ dấu hai chấm cuối câu vì lời trích dẫn tiếp tục sang câu sau.
