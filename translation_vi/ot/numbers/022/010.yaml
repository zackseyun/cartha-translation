  rationale: Sửa động từ cuối để không khẳng định cuộc gặp trực tiếp vốn không có trong bản văn, đồng thời giữ cách diễn đạt tiếng Việt tự nhiên. Chú thích bảo tồn lựa chọn “đã cho gọi tôi” và nêu cách đọc sát nghĩa, với ngoặc vuông đánh dấu thành tố được tiếng Việt bổ sung để câu hoàn chỉnh. Dấu hai chấm được giữ vì lời thuật tiếp tục ở câu sau.
