base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/015.yaml
  text: Then Balak again sent officials[a], more numerous and more honored than these.
translation:
  language: vi
  text: Bấy giờ, Ba-lác lại sai các quan chức đi; họ đông hơn và có địa vị cao hơn những người trước.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “được trọng vọng hơn” hoặc “cao quý hơn.” Tiếng Hê-bơ-rơ nhấn mạnh địa vị hoặc uy thế cao hơn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּסֶף עוֹד ... שְׁלֹחַ
  choice: lại sai ... đi
  rationale: Cấu trúc יָסַף kết hợp với động từ nguyên mẫu, được עוֹד nhấn mạnh, diễn tả việc lặp lại hành động. “Lại sai ... đi” vừa tự nhiên trong tiếng Việt vừa giữ rõ ý “sai phái một lần nữa”.
- source_word: בָּלָק
  choice: Ba-lác
  rationale: Phiên âm tên riêng theo lối viết rõ âm tiết, quen thuộc trong tiếng Việt.
- source_word: שָׂרִים
  choice: các quan chức
  rationale: Từ này chỉ những người có chức vị cao được cử làm đại diện. “Các quan chức” là cách nói hiện đại, phù hợp với bối cảnh phái đoàn ngoại giao hơn “các hoàng tử”.
- source_word: רַבִּים
  choice: đông hơn
  rationale: Cụm so sánh מֵאֵלֶּה cho thấy רַבִּים mang nghĩa so sánh về số lượng, nên dịch là “đông hơn” thay vì chỉ “đông” hay “nhiều”.
- source_word: וְנִכְבָּדִים
  choice: và có địa vị cao hơn
  rationale: Dạng từ gốc כבד ở đây nói đến phẩm vị, uy thế hoặc sự trọng vọng. “Có địa vị cao hơn” diễn đạt rõ ý so sánh về cấp bậc xã hội mà không giới hạn nghĩa vào phẩm chất đạo đức.
- source_word: מֵאֵלֶּה
  choice: hơn những người trước
  rationale: Đại từ chỉ định quy chiếu về phái đoàn đã được sai đi trước đó. “Những người trước” làm rõ đối tượng so sánh một cách tự nhiên trong tiếng Việt.
