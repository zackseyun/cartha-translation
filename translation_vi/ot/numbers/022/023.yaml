revisions:
- from: Con lừa cái thấy thiên sứ[a] của Yahweh đứng giữa đường, tay cầm thanh gươm đã tuốt khỏi vỏ, thì nó rẽ khỏi đường và đi vào cánh đồng. Ba-la-am liền đánh con lừa cái để bắt nó quay trở lại đường.
  to: Khi con lừa cái thấy thiên sứ[a] của Yahweh đứng trên đường, tay cầm thanh gươm đã tuốt khỏi vỏ, nó rẽ khỏi đường và đi vào cánh đồng. Ba-la-am liền đánh con lừa cái để bắt nó quay trở lại đường.
  rationale: Chỉ thay “giữa đường” bằng “trên đường” để tránh thêm nét nghĩa vị trí không được nguyên văn xác định. Chú thích được giữ nguyên vì neo chú thích đúng tại “thiên sứ” và trình bày chính xác phương án từ vựng thay thế.
