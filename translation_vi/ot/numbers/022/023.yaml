id: NUM.22.23
reference: Numbers 22:23
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/תֵּ֣רֶא הָ/אָתוֹן֩ אֶת מַלְאַ֨ךְ יְהוָ֜ה נִצָּ֣ב בַּ/דֶּ֗רֶךְ וְ/חַרְבּ֤/וֹ שְׁלוּפָה֙ בְּ/יָד֔/וֹ וַ/תֵּ֤ט הָֽ/אָתוֹן֙ מִן הַ/דֶּ֔רֶךְ וַ/תֵּ֖לֶךְ בַּ/שָּׂדֶ֑ה וַ/יַּ֤ךְ בִּלְעָם֙ אֶת הָ֣/אָת֔וֹן לְ/הַטֹּתָ֖/הּ הַ/דָּֽרֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/023.yaml
  text: When the donkey saw the angel of Yahweh standing in the road with his sword drawn in his hand[a], the donkey turned aside from the road and went into the field. So Balaam struck the donkey to turn her back to the road.
translation:
  language: vi
  text: Khi con lừa cái thấy thiên sứ[a] của Yahweh đứng trên đường, tay cầm thanh gươm đã tuốt khỏi vỏ, nó rẽ khỏi đường và đi vào cánh đồng. Ba-la-am liền đánh con lừa cái để bắt nó quay trở lại đường.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “sứ giả của Yahweh.”'
    reason: Giữ nghĩa từ vựng khác có thể có của מַלְאָךְ, vốn có thể chỉ cả thiên sứ lẫn sứ giả.
lexical_decisions:
- source_word: הָאָתוֹן
  choice: con lừa cái
  rationale: Danh từ אָתוֹן chỉ lừa cái. Tiếng Việt cần nói rõ giới tính vì đại từ “nó” không thể hiện giống cái như tiếng Hê-bơ-rơ.
- source_word: מַלְאַךְ יְהוָה
  choice: thiên sứ của Yahweh
  rationale: Trong bối cảnh một hữu thể siêu nhiên hiện ra với gươm đã tuốt khỏi vỏ, “thiên sứ” là cách hiểu tự nhiên; nghĩa rộng “sứ giả” được giữ trong chú thích.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Dùng dạng phiên âm của danh riêng trong nguyên văn, thay vì thay thế bằng một tước hiệu.
- source_word: נִצָּב בַּדֶּרֶךְ
  choice: đứng giữa đường
  rationale: “Giữa đường” diễn đạt tự nhiên vị trí án ngữ của thiên sứ, phù hợp diễn tiến câu chuyện.
- source_word: וְחַרְבּוֹ שְׁלוּפָה בְיָדוֹ
  choice: tay cầm thanh gươm đã tuốt khỏi vỏ
  rationale: Diễn đạt tự nhiên trong tiếng Việt mà vẫn giữ đủ hình ảnh gươm đã được rút ra và đang ở trong tay.
- source_word: וַתֵּט הָאָתוֹן מִן הַדֶּרֶךְ
  choice: nó rẽ khỏi đường
  rationale: Động từ נָטָה ở đây chỉ việc đổi hướng, rời khỏi con đường; “rẽ khỏi” vừa chính xác vừa tự nhiên.
- source_word: וַתֵּלֶךְ בַּשָּׂדֶה
  choice: đi vào cánh đồng
  rationale: שָׂדֶה trong cảnh này chỉ đồng ruộng hoặc vùng đất trống; “cánh đồng” giữ hình ảnh cụ thể.
- source_word: וַיַּךְ
  choice: đánh
  rationale: נכה có nghĩa rộng là đánh hoặc giáng vào. “Đánh” không hàm ý số lần nhiều hơn điều hình thức động từ cho biết.
- source_word: לְהַטֹּתָהּ הַדָּרֶךְ
  choice: để bắt nó quay trở lại đường
  rationale: Cấu trúc chỉ mục đích khiến con lừa đổi hướng; vì nó vừa rời đường đi vào đồng, “trở lại” làm rõ hướng đi vốn đã hàm chứa trong ngữ cảnh.
theological_decisions:
- issue: Cách dịch danh Đức Chúa Trời יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Nguyên văn dùng trực tiếp danh riêng gồm bốn phụ âm YHWH; “Yahweh” bảo tồn tư cách danh riêng thay vì thay bằng tước hiệu.
- issue: Nghĩa của מַלְאַךְ trong cụm מַלְאַךְ יְהוָה
  choice: thiên sứ của Yahweh
  alternative: sứ giả của Yahweh
  rationale: Bối cảnh siêu nhiên và thanh gươm đã tuốt khỏi vỏ ủng hộ “thiên sứ”, nhưng từ Hê-bơ-rơ cũng có thể mang nghĩa thông thường là “sứ giả”, nên giữ phương án ấy trong chú thích thay vì xóa bỏ độ rộng nghĩa.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng và dễ hiểu. Dùng “con lừa cái” để phản ánh chính xác giới tính trong nguyên văn; dùng “Ba-la-am” theo lối phiên âm tên Kinh Thánh quen thuộc trong tiếng Việt. Câu được sắp xếp tự nhiên theo tiếng Việt nhưng vẫn giữ trình tự hành động của bản Hê-bơ-rơ.
