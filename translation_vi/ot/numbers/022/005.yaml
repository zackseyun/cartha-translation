source:
  edition: WLC
  text: וַ/יִּשְׁלַ֨ח מַלְאָכִ֜ים אֶל בִּלְעָ֣ם בֶּן בְּע֗וֹר פְּ֠תוֹרָ/ה אֲשֶׁ֧ר עַל הַ/נָּהָ֛ר אֶ֥רֶץ בְּנֵי עַמּ֖/וֹ לִ/קְרֹא ל֑/וֹ לֵ/אמֹ֗ר הִ֠נֵּה עַ֣ם יָצָ֤א מִ/מִּצְרַ֨יִם֙ הִנֵּ֤ה כִסָּה֙ אֶת עֵ֣ין הָ/אָ֔רֶץ וְ/ה֥וּא יֹשֵׁ֖ב מִ/מֻּלִֽ/י־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/005.yaml
  text: So he sent messengers to Balaam son of Beor at Pethor[a], which is by the River, in the land of the sons of his people, to call him, saying, “Look, a people has come out of Egypt. Look, it has covered the face of the land[c][b], and it is dwelling opposite me.”
translation:
  language: vi
  text: 'Vậy, vua sai các sứ giả đến gọi Ba-la-am, con trai Bê-ô, đang ở Phê-thô bên Sông[a], trong xứ của những người con của dân ông[b]. Họ nói: “Kìa, một dân đã ra khỏi Ai Cập! Kìa, dân ấy che phủ mặt đất[c] và đang ở đối diện với ta.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “Sông”; có lẽ chỉ sông Ơ-phơ-rát.'
    reason: cross_reference
  - marker: b
    text: 'Cũng có thể dịch: “trong xứ của dân ông.” Cụm tiếng Hê-bơ-rơ “xứ của những người con của dân ông” khó hiểu, và từ “ông” có thể được quy chiếu theo nhiều cách.'
    reason: alternative_reading
  - marker: c
    text: 'Nguyên văn: “che phủ mắt của đất,” một thành ngữ chỉ bề mặt của đất.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח מַלְאָכִים
  choice: Vậy, vua sai các sứ giả
  rationale: Dạng kể chuyện wayyiqtol tiếp nối diễn tiến; thêm “vua” để làm rõ chủ thể từ ngữ cảnh mà không nêu tên ngoài câu. מַלְאָכִים trong bối cảnh ngoại giao chỉ các sứ giả loài người.
- source_word: בִּלְעָם בֶּן־בְּעוֹר
  choice: Ba-la-am, con trai Bê-ô
  rationale: Phiên âm tên riêng theo lối quen thuộc, đồng thời diễn đạt quan hệ phụ tử rõ ràng.
- source_word: פְּתוֹרָה אֲשֶׁר עַל־הַנָּהָר
  choice: đang ở Phê-thô bên Sông Cả[a]
  rationale: Hậu tố chỉ hướng trên địa danh đi với động từ sai người đến; mệnh đề sau xác định nơi Ba-la-am ở. הַנָּהָר được giữ như một danh xưng xác định thay vì đưa thẳng cách nhận diện là sông Ơ-phơ-rát vào chính văn.
- source_word: אֶרֶץ בְּנֵי עַמּוֹ
  choice: trong xứ của con cháu dân ông[b]
  rationale: Giữ cấu trúc bất thường của tiếng Hê-bơ-rơ và đại từ ngôi ba, thay vì âm thầm giải quyết câu chữ khó này; chú thích nêu cách hiểu khác.
- source_word: לִקְרֹא לוֹ לֵאמֹר
  choice: đến gọi ... Họ nói
  rationale: לִקְרֹא לוֹ biểu thị mục đích mời gọi hoặc triệu gọi; “đến gọi” tự nhiên trong tiếng Việt. Công thức לֵאמֹר được chuyển thành câu dẫn trực tiếp gọn và rõ.
- source_word: הִנֵּה
  choice: Kìa
  rationale: Giữ cả hai lần xuất hiện của tiểu từ gây chú ý và nhấn mạnh.
- source_word: עַם יָצָא מִמִּצְרַיִם
  choice: một dân đã ra khỏi Ai Cập
  rationale: “Một dân” phản ánh danh từ tập thể עַם; “đã ra khỏi” diễn đạt thể hoàn thành trong lời tường thuật.
- source_word: כִסָּה אֶת־עֵין הָאָרֶץ
  choice: che phủ mặt đất[c]
  rationale: עֵין nghĩa đen là “mắt”, nhưng trong thành ngữ này chỉ bề mặt có thể nhìn thấy của đất; “mặt đất” giữ hình ảnh ở mức tự nhiên trong tiếng Việt.
- source_word: וְהוּא יֹשֵׁב מִמֻּלִי
  choice: và đang đóng trại đối diện với ta
  rationale: יֹשֵׁב có thể là ở, cư ngụ hoặc đóng trại. Trong bối cảnh đoàn dân đang di chuyển và hiện diện trước Mô-áp, “đang đóng trại” là cách diễn đạt tự nhiên, còn “đối diện với ta” giữ điểm nhìn của người nói.
theological_decisions:
- issue: Chủ thể của וַיִּשְׁלַח
  choice: vua
  alternative: ông / Ba-lác
  rationale: Ngữ cảnh ngay trước xác định Ba-lác, vua Mô-áp, là chủ thể. Dùng “vua” giúp câu đứng riêng dễ hiểu nhưng không đưa thêm một cách giải nghĩa thần học.
- issue: Cụm אֶרֶץ בְּנֵי עַמּוֹ khó hiểu
  choice: giữ “trong xứ của con cháu dân ông” trong chính văn
  alternative: “trong xứ của dân ông” hoặc xem עַמּוֹ như địa danh Am-ma-vu
  rationale: Bản Hê-bơ-rơ Masoret có câu chữ khó và đại từ có thể được quy chiếu theo nhiều cách; bản dịch không nên âm thầm chọn một cách giải quyết dứt khoát.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “Kìa” để giữ sắc thái nhấn mạnh của הִנֵּה; dùng “Sông Cả” như danh xưng tự nhiên cho הַנָּהָר và giải thích cách nhận diện trong chú thích. Các dấu chú thích [a], [b], [c] đều xuất hiện ngay sau phần chính văn liên quan.
