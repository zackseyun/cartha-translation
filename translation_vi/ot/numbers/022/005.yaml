    issue: “đang đóng trại” dịch יֹשֵׁב quá cụ thể.
    rationale: יֹשֵׁב có nghĩa rộng là “ở, cư ngụ, ở lại”; câu này không nêu rõ hành động dựng trại. “Đang ở” bảo toàn độ rộng của động từ.
  - severity: medium
    issue: “Sông Cả” thêm sắc thái không có trong nguyên văn.
    rationale: הַנָּהָר là “Sông” xác định; chú thích có thể nêu khả năng là sông Ơ-phơ-rát mà không đưa một cách gọi diễn giải vào chính văn.
  - severity: low
    issue: “họ ... đang đóng trại” thay số ít tập thể của עַם bằng số nhiều.
    rationale: Tiếng Việt có thể dùng “dân ấy” để vừa tự nhiên vừa giữ tham chiếu số ít tập thể của nguyên văn.
