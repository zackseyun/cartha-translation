revisions:
- from: Khi Ba-lác nghe tin Ba-la-am đã đến, ông đi ra đón người tại thành Mô-áp[a]. Thành này nằm bên ranh giới Ạt-nôn, ở tận cùng ranh giới[b].
  to: Khi Ba-lác nghe tin Ba-la-am đã đến, ông đi ra đón Ba-la-am tại một thành của Mô-áp[a]. Thành ấy ở trên ranh giới Ạt-nôn, ngay nơi tận cùng ranh giới[b].
  rationale: Sửa “thành Mô-áp” thành “một thành của Mô-áp” để phản ánh rõ cấu trúc sở thuộc và giữ khả năng không xác định trong bản văn; chú thích vẫn nêu khả năng chỉ một thành cụ thể. Đổi “bên ranh giới” thành “trên ranh giới” để sát hơn với עַל, và điều chỉnh cách diễn đạt cuối câu cho tự nhiên hơn trong tiếng Việt trong khi bảo lưu sự lặp lại của “ranh giới.”
