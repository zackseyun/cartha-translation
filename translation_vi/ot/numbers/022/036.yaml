translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại. Tên riêng được phiên âm theo cách dễ đọc trong tiếng Việt. Tách câu sau địa điểm để tránh một chuỗi mệnh đề quan hệ nặng nề, đồng thời vẫn giữ đầy đủ quan hệ địa lý và sự lặp từ của nguyên văn.
