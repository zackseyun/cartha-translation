  text: וַ/יִּשְׁמַ֥ע בָּלָ֖ק כִּ֣י בָ֣א בִלְעָ֑ם וַ/יֵּצֵ֨א לִ/קְרָאת֜/וֹ אֶל עִ֣יר מוֹאָ֗ב אֲשֶׁר֙ עַל גְּב֣וּל אַרְנֹ֔ן אֲשֶׁ֖ר בִּ/קְצֵ֥ה הַ/גְּבֽוּל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/036.yaml
  text: When Balak heard that Balaam had come[a], he went out to meet him at the city of Moab, which is on the border of the Arnon[b], at the edge of the border.
translation:
  language: vi
  text: Khi Ba-lác nghe tin Ba-la-am đã đến, ông đi ra đón Ba-la-am tại một thành của Mô-áp[a]. Thành ấy ở trên ranh giới Ạt-nôn, ngay nơi tận cùng ranh giới[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “thành của Mô-áp.” Cụm từ Hê-bơ-rơ có thể chỉ một thành cụ thể đã được biết đến thuộc Mô-áp, hoặc nói chung hơn là một thành thuộc Mô-áp.'
    reason: lexical_alternative
  - marker: b
    text: 'Hoặc: “ở tận cùng lãnh thổ.” Từ Hê-bơ-rơ được dịch là “ranh giới” cũng có thể mang nghĩa “lãnh thổ” trong một số văn cảnh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: nghe tin
  rationale: Động từ שׁמע có nghĩa cơ bản là “nghe”. Trong mạch kể chuyện, “nghe tin” diễn đạt tự nhiên việc Ba-lác nhận được tin Ba-la-am đã đến mà không thêm cách thức truyền tin.
- source_word: כִּי בָא בִלְעָם
  choice: Ba-la-am đã đến
  rationale: Mệnh đề nêu nội dung Ba-lác nghe được. “Đã đến” thể hiện rõ việc Ba-la-am đến trước khi Ba-lác đi ra đón.
- source_word: וַיֵּצֵא לִקְרָאתוֹ
  choice: ông đi ra đón người
  rationale: יצא diễn tả việc đi ra, còn לקראת chỉ sự chuyển động về phía một người để gặp. “Đi ra đón” tự nhiên trong tiếng Việt và không tự thêm sắc thái thân thiện hay đối đầu.
- source_word: אֶל עִיר מוֹאָב
  choice: tại thành Mô-áp
  rationale: Sau cụm “đi ra đón”, אֶל xác định địa điểm cuộc gặp nên “tại” tự nhiên hơn “đến”. Cụm עִיר מוֹאָב có thể chỉ một thành đã biết gắn với Mô-áp; khả năng hiểu là “một thành của Mô-áp” được giữ trong chú thích.
- source_word: אֲשֶׁר עַל גְּבוּל אַרְנֹן
  choice: nằm bên ranh giới Ạt-nôn
  rationale: עַל גְּבוּל diễn tả vị trí trên hoặc bên một ranh giới. Bản dịch giữ Ạt-nôn làm địa danh và không buộc phải giải quyết trong chính văn liệu tên này nhấn mạnh dòng sông hay đường biên do dòng sông tạo nên.
- source_word: אֲשֶׁר בִּקְצֵה הַגְּבוּל
  choice: ở tận cùng ranh giới
  rationale: קצה có nghĩa là đầu mút, tận cùng hoặc mép. Lặp lại “ranh giới” phản ánh việc tiếng Hê-bơ-rơ lặp lại גבול; nghĩa “lãnh thổ” vẫn có thể có và được ghi ở chú thích.
