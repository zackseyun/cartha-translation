base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/040.yaml
  text: And Balak sacrificed cattle and sheep[b][a], and sent some to Balaam and to the officials who were with him.
translation:
  language: vi
  text: Ba-lác dâng bò và chiên dê[b] làm sinh tế, rồi gửi một phần[a] cho Ba-la-am và các quan chức ở cùng ông.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn chỉ nói “gửi”; ngữ cảnh về các con vật được dâng làm sinh tế cho thấy Ba-lác có lẽ đã gửi phần thịt hoặc phần tế lễ.
    reason: lexical_alternative
  - marker: b
    text: Từ Hê-bơ-rơ này chỉ chung đàn gia súc nhỏ, có thể bao gồm cả chiên lẫn dê.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְבַּח
  choice: dâng ... làm sinh tế
  rationale: Động từ זבח chỉ việc giết súc vật để hiến tế; cách diễn đạt này giữ rõ sắc thái tế lễ mà vẫn tự nhiên trong tiếng Việt.
- source_word: בָּקָר
  choice: bò
  rationale: בקר là danh từ tập hợp chỉ đại gia súc thuộc loài bò; “bò” tự nhiên và không giới hạn ở con đực.
- source_word: צֹאן
  choice: chiên dê
  rationale: צאן là danh từ tập hợp có thể bao gồm cả chiên lẫn dê; “chiên dê” chuyển tải phạm vi rộng này rõ hơn chỉ “chiên”.
- source_word: וַיְשַׁלַּח
  choice: gửi một phần
  rationale: Động từ chỉ nói “gửi”, không nêu trực tiếp tân ngữ. Ngữ cảnh ngay sau việc hiến tế hàm ý gửi phần thịt hoặc phần tế lễ; thêm “một phần” giúp câu tiếng Việt hoàn chỉnh nhưng được chú thích để bảo tồn tính hàm ẩn của nguyên văn.
- source_word: לְבִלְעָם
  choice: cho Ba-la-am
  rationale: Phiên âm tên riêng theo cách dùng Kinh Thánh tiếng Việt quen thuộc.
- source_word: לַשָּׂרִים
  choice: cho các quan chức
  rationale: שׂרים chỉ những người có địa vị hoặc chức quyền; “quan chức” rõ nghĩa và không hàm ý họ nhất thiết là hoàng tử theo huyết thống.
- source_word: אֲשֶׁר אִתּוֹ
  choice: ở cùng ông
  rationale: Đại từ số ít tự nhiên nhất quy chiếu về Ba-la-am, tiền ngữ số ít gần nhất; giữ đại từ “ông” thay vì lặp tên để phản ánh cấu trúc Hê-bơ-rơ.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “dâng ... làm sinh tế” để giữ sắc thái tế lễ; dùng “chiên dê” nhằm thể hiện đầy đủ phạm vi của danh từ tập hợp Hê-bơ-rơ. Mọi dấu chú thích đều xuất hiện trong chính văn.
