  text: וַ/יֹּ֨אמֶר בָּלָ֜ק אֶל בִּלְעָ֗ם הֲ/לֹא֩ שָׁלֹ֨חַ שָׁלַ֤חְתִּי אֵלֶ֨י/ךָ֙ לִ/קְרֹא לָ֔/ךְ לָ֥/מָּה לֹא הָלַ֖כְתָּ אֵלָ֑/י הַֽ/אֻמְנָ֔ם לֹ֥א אוּכַ֖ל כַּבְּדֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/037.yaml
  text: And Balak said to Balaam[c][b][a], “Did I not indeed send to you to call you? Why did you not come to me? Am I really not able to honor you?”
translation:
  language: vi
  text: 'Ba-lác nói với Ba-la-am: “Chẳng phải ta đã sai người đến gọi ông sao?[a] Tại sao ông không đến với ta?[b] Chẳng lẽ ta thật sự không thể trọng đãi ông sao?”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn dùng nguyên mẫu tuyệt đối cùng với động từ hữu hạn để nhấn mạnh: “Chẳng phải ta chắc chắn đã sai người đến gọi ông sao?” Trong ngữ cảnh, cũng có thể hiểu là Ba-lác đã sai người nhiều lần hoặc thúc giục khẩn thiết.'
    reason: lexical_alternative
  - marker: b
    text: 'Dịch sát: “Tại sao ông không đi đến với ta?”'
    reason: lexical_alternative
  - marker: c
    text: “Trọng đãi” có thể bao gồm việc ban thưởng hoặc ban địa vị cao, chứ không chỉ là tỏ lòng kính trọng.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: nói
  rationale: Động từ kể chuyện tiêu chuẩn mở đầu lời thoại; tiếng Việt không cần máy móc thêm liên từ “và”.
- source_word: הֲלֹא
  choice: Chẳng phải ... sao?
  rationale: Diễn đạt tự nhiên câu hỏi tu từ phủ định, vốn chờ câu trả lời khẳng định.
- source_word: שָׁלֹחַ שָׁלַחְתִּי
  choice: đã sai người
  rationale: Cấu trúc nguyên mẫu tuyệt đối đi với động từ hữu hạn nhấn mạnh hành động sai phái. Bản chính giữ câu tự nhiên, còn sắc thái nhấn mạnh và khả năng hiểu là sai người nhiều lần được nêu trong chú thích.
- source_word: לִקְרֹא לָךְ
  choice: đến gọi ông
  rationale: Trong ngữ cảnh, קרא là gọi hoặc triệu mời một người đến; “đến gọi ông” tự nhiên và thể hiện việc Ba-lác sai sứ giả.
- source_word: לָמָּה לֹא הָלַכְתָּ אֵלָי
  choice: Tại sao ông không đến với ta?
  rationale: הלך có nghĩa đen là “đi”, nhưng khi Ba-lác nói אֵלָי, tiếng Việt tự nhiên dùng “đến với ta”.
- source_word: הַאֻמְנָם
  choice: thật sự
  rationale: Thể hiện sắc thái nhấn mạnh và ngờ vực hoặc bất bình trong câu hỏi.
- source_word: כַּבְּדֶךָ
  choice: trọng đãi ông
  rationale: Ở thể Piel, כבד là ban vinh dự; trong ngữ cảnh này còn hàm ý phần thưởng và địa vị. “Trọng đãi” giữ được cả sự tôn trọng lẫn việc ban đãi ngộ.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng đại từ “ta–ông” phù hợp lời một vị vua đang trách cứ người được triệu đến; tên riêng theo dạng phiên âm quen thuộc Ba-lác và Ba-la-am.
