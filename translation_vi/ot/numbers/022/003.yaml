  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יָּ֨גָר מוֹאָ֜ב מִ/פְּנֵ֥י הָ/עָ֛ם מְאֹ֖ד כִּ֣י רַב ה֑וּא וַ/יָּ֣קָץ מוֹאָ֔ב מִ/פְּנֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/003.yaml
  text: And Moab was very afraid because of the people[a], because they were numerous[b]; and Moab was filled with dread because of the sons of Israel.
translation:
  language: vi
  text: Mô-áp vô cùng sợ hãi vì dân ấy, vì họ rất đông; và Mô-áp kinh hãi vì con cái Y-sơ-ra-ên.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Động từ Hê-bơ-rơ có thể mang nghĩa “ghê tởm”, “ngán ngẩm”, hoặc diễn tả sự bức bối, kinh sợ; trong ngữ cảnh này, nghĩa kinh sợ pha lẫn ghê ngại là phù hợp.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּגָר
  choice: vô cùng sợ hãi
  rationale: Động từ גור trong ngữ cảnh này diễn tả nỗi sợ hoặc khiếp đảm; kết hợp với מְאֹד, cách dịch này tự nhiên và giữ được mức độ nhấn mạnh.
- source_word: מִפְּנֵי
  choice: trước
  rationale: Thành ngữ có nghĩa đen là ‘từ trước mặt’; trong câu này diễn tả việc đối diện với dân Y-sơ-ra-ên là nguyên nhân gây sợ hãi. ‘Trước’ vừa gọn vừa giữ sắc thái nguồn.
- source_word: הָעָם
  choice: dân ấy
  rationale: Danh từ tập hợp số ít chỉ dân Y-sơ-ra-ên đã được nói đến trong ngữ cảnh; ‘dân ấy’ rõ nghĩa và tự nhiên trong tiếng Việt.
- source_word: כִּי רַב הוּא
  choice: vì họ rất đông
  rationale: רַב ở đây nói đến số lượng lớn. Tiếng Việt tự nhiên dùng đại từ số nhiều ‘họ’ cho danh từ tập hợp chỉ người.
- source_word: וַיָּקָץ
  choice: kinh hãi
  rationale: קוץ có thể diễn tả ghê tởm, bức bối hoặc nỗi khiếp sợ đến ngán ngẩm. Trong mạch văn về sự đe dọa do dân Y-sơ-ra-ên đông đảo, ‘kinh hãi’ truyền đạt phản ứng sợ hãi mãnh liệt mà không khẳng định quá hẹp một sắc thái duy nhất.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: con cái Y-sơ-ra-ên
  rationale: Cách dịch truyền thống, dễ hiểu của cụm ‘các con trai/con cái của Y-sơ-ra-ên’, dùng như tên gọi tập thể của dân Y-sơ-ra-ên.
- source_word: מוֹאָב
  choice: Mô-áp
  rationale: Dạng phiên âm quen dùng trong Kinh Thánh tiếng Việt; ở đây tên gọi có tính tập thể, chỉ dân Mô-áp.
theological_decisions:
- issue: Sắc thái đa nghĩa của וַיָּקָץ
  choice: Dịch trong chính văn là ‘kinh hãi’ và ghi chú các khả năng ‘ghê tởm/ngán ngẩm’.
  alternative: ‘ghê tởm’, ‘ngán ngẩm’, hoặc ‘kinh sợ đến phát ngán’
  rationale: Ngữ cảnh nhấn mạnh nỗi sợ của Mô-áp, nhưng động từ còn có sắc thái ghê sợ hoặc bức bối. Ghi chú bảo tồn độ mở từ vựng mà không áp đặt một cách hiểu thần học riêng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ tên riêng theo lối phiên âm Kinh Thánh tiếng Việt quen thuộc; dùng ‘con cái Y-sơ-ra-ên’ để phản ánh thành ngữ Hê-bơ-rơ, đồng thời đặt ghi chú ngay sau mệnh đề chứa từ đa nghĩa.
