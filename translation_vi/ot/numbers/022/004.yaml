  text: וַ/יֹּ֨אמֶר מוֹאָ֜ב אֶל זִקְנֵ֣י מִדְיָ֗ן עַתָּ֞ה יְלַחֲכ֤וּ הַ/קָּהָל֙ אֶת כָּל סְבִ֣יבֹתֵ֔י/נוּ כִּ/לְחֹ֣ךְ הַ/שּׁ֔וֹר אֵ֖ת יֶ֣רֶק הַ/שָּׂדֶ֑ה וּ/בָלָ֧ק בֶּן צִפּ֛וֹר מֶ֥לֶךְ לְ/מוֹאָ֖ב בָּ/עֵ֥ת הַ/הִֽוא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/004.yaml
  text: And Moab said to the elders of Midian[a], “Now this assembly will lick up all that is around us[b], as the ox licks up the green growth of the field.” Now Balak son of Zippor was king of Moab at that time.
translation:
  language: vi
  text: 'Mô-áp nói với các trưởng lão Ma-đi-an: “Bây giờ, đoàn dân này sẽ liếm sạch[a] mọi thứ chung quanh chúng ta, như con bò đực liếm sạch cây cỏ ngoài đồng[b].” Lúc ấy, Ba-lác con trai Xíp-pô là vua Mô-áp.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đoàn dân này sẽ nuốt sạch mọi thứ chung quanh chúng ta.” Động từ Hê-bơ-rơ có nghĩa đen là “liếm”; phần chính giữ hình ảnh ấy vì ngay sau đó có phép so sánh với con bò đực.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “cỏ ngoài đồng.” Từ Hê-bơ-rơ có nghĩa rộng hơn, chỉ cây cỏ xanh nói chung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מוֹאָב
  choice: Mô-áp
  rationale: Giữ tên dân tộc/xứ sở được nhân cách hóa làm chủ thể phát ngôn, đúng với cách diễn đạt của tiếng Hê-bơ-rơ.
- source_word: זִקְנֵי מִדְיָן
  choice: các trưởng lão Ma-đi-an
  rationale: Diễn đạt rõ kết cấu sở hữu và dùng thuật ngữ tiếng Việt quen thuộc cho những người lãnh đạo cao niên.
- source_word: הַקָּהָל
  choice: đoàn dân này
  rationale: Chỉ cộng đồng đông đảo đang tập hợp; cách dịch này tự nhiên trong ngữ cảnh và tránh hàm ý giáo hội về sau của “hội chúng”.
- source_word: יְלַחֲכוּ ... כִּלְחֹךְ
  choice: sẽ liếm sạch ... như con bò liếm sạch
  rationale: Giữ nguyên hình ảnh cụ thể và sự lặp lại của động từ לחך trong nguyên văn; “sạch” truyền đạt sắc thái tiêu thụ hết trong ngữ cảnh.
- source_word: אֶת כָּל סְבִיבֹתֵינוּ
  choice: mọi thứ chung quanh chúng ta
  rationale: Cách nói tự nhiên, thể hiện toàn bộ những gì ở vùng lân cận.
- source_word: יֶרֶק הַשָּׂדֶה
  choice: cây cỏ ngoài đồng
  rationale: יֶרֶק chỉ thực vật xanh nói chung chứ không nhất thiết chỉ riêng cỏ; “cây cỏ” vừa rộng nghĩa vừa tự nhiên trong tiếng Việt.
- source_word: וּבָלָק בֶּן צִפּוֹר מֶלֶךְ לְמוֹאָב בָּעֵת הַהִוא
  choice: Lúc ấy, Ba-lác con trai Xíp-pô là vua Mô-áp
  rationale: Trình bày mệnh đề như thông tin bối cảnh của câu chuyện, đồng thời giữ trực tiếp quan hệ cha-con và mốc thời gian.
