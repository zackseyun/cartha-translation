- from: 'Mô-áp nói với các trưởng lão Ma-đi-an: “Bây giờ, đoàn dân này sẽ liếm sạch mọi thứ chung quanh chúng ta[a], như con bò liếm sạch cây cỏ ngoài đồng[b].” Lúc ấy, Ba-lác con trai Xíp-pô là vua Mô-áp.'
