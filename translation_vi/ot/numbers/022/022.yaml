  text: וַ/יִּֽחַר אַ֣ף אֱלֹהִים֮ כִּֽי הוֹלֵ֣ךְ הוּא֒ וַ/יִּתְיַצֵּ֞ב מַלְאַ֧ךְ יְהוָ֛ה בַּ/דֶּ֖רֶךְ לְ/שָׂטָ֣ן ל֑/וֹ וְ/הוּא֙ רֹכֵ֣ב עַל אֲתֹנ֔/וֹ וּ/שְׁנֵ֥י נְעָרָ֖י/ו עִמּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/022.yaml
  text: But God’s anger burned because he was going[a], and the angel of Yahweh took his stand in the road as an adversary to him. He was riding on his donkey[b], and his two young men were with him.
translation:
  language: vi
  text: Nhưng cơn giận của Đức Chúa Trời bừng lên vì ông đang đi, và thiên sứ của Yahweh đứng chặn trên đường như một kẻ đối nghịch[a] với ông. Ông đang cưỡi con lừa của mình,[b] và hai thanh niên của ông cùng đi với ông.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hê-bơ-rơ שָׂטָן (satan) ở đây có nghĩa là “kẻ đối nghịch” hoặc “đối thủ”, không nhất thiết là tên riêng Sa-tan.
    reason: lexical_alternative
  - marker: b
    text: Hay “con lừa cái của mình”; từ Hê-bơ-rơ dùng ở đây chỉ cụ thể một con lừa cái.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר אַף אֱלֹהִים
  choice: cơn giận của Đức Chúa Trời bừng lên
  rationale: Giữ hình ảnh sinh động của thành ngữ Hê-bơ-rơ về cơn giận bùng cháy, đồng thời diễn đạt tự nhiên trong tiếng Việt hiện đại.
- source_word: כִּי הוֹלֵךְ הוּא
  choice: vì ông đang đi
  rationale: Diễn đạt mệnh đề nguyên nhân và sắc thái đang tiếp diễn của phân từ הוֹלֵךְ, không bổ sung động cơ hay lý do ngoài văn bản.
- source_word: וַיִּתְיַצֵּב
  choice: đứng chặn
  rationale: Thể hitpael cho thấy hành động chủ ý chiếm vị trí; “đứng chặn” truyền đạt rõ tư thế đối đầu ngay trên đường.
- source_word: מַלְאַךְ יְהוָה
  choice: thiên sứ của Yahweh
  rationale: “Thiên sứ” phù hợp với nhân vật thuộc trời trong ngữ cảnh; danh riêng giao ước יְהוָה được chuyển là “Yahweh”.
- source_word: לְשָׂטָן לוֹ
  choice: như một kẻ đối nghịch với ông
  rationale: Giữ lực danh từ của שָׂטָן và ý nghĩa chỉ người đối địch trong ngữ cảnh, không biến từ này thành tên riêng.
- source_word: אֲתֹנוֹ
  choice: con lừa của mình
  rationale: Cách nói tự nhiên trong tiếng Việt; danh từ Hê-bơ-rơ chỉ rõ đây là lừa cái, nên thông tin ấy được ghi ở chú thích.
- source_word: שְׁנֵי נְעָרָיו
  choice: hai người trai trẻ của ông
  rationale: Phản ánh trực tiếp nghĩa cơ bản của נַעַר mà không tự quyết định rằng họ nhất thiết là đầy tớ hay tùy tùng.
- source_word: עִמּוֹ
  choice: cùng đi với ông
  rationale: Bổ sung động từ theo yêu cầu tự nhiên của cú pháp tiếng Việt, trong bối cảnh họ đồng hành trên đường.
theological_decisions:
- issue: Ý nghĩa của שָׂטָן trong câu này
  choice: danh từ chung “kẻ đối nghịch”
  alternative: tên riêng “Sa-tan”
  rationale: Cú pháp và ngữ cảnh mô tả vai trò chống lại Ba-la-am của thiên sứ; dịch thành tên riêng sẽ đưa vào một đối tượng thần học mà câu Hê-bơ-rơ không đòi hỏi.
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: CHÚA hoặc Giê-hô-va
  rationale: Giữ danh giao ước xuất hiện trực tiếp trong bản Hê-bơ-rơ, không thay bằng một tước hiệu.
- issue: Nguyên nhân cơn giận của Đức Chúa Trời
  choice: “vì ông đang đi”
  alternative: “vì ông vẫn cứ đi” hoặc diễn giải rằng ông đi với động cơ sai trái
  rationale: Bản văn tạo nên một căng thẳng với sự cho phép ở câu trước; bản dịch giữ nguyên cách nói ngắn gọn và không tự giải quyết căng thẳng ấy bằng cách thêm “vẫn cứ” hay một động cơ không được nêu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Trời” cho אֱלֹהִים và “Yahweh” cho danh giao ước. Giữ cấu trúc kể chuyện ngắn gọn cùng sự căng thẳng vốn có giữa cơn giận của Đức Chúa Trời và việc Ba-la-am đang lên đường.
