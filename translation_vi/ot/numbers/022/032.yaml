  text: וַ/יֹּ֤אמֶר אֵלָי/ו֙ מַלְאַ֣ךְ יְהוָ֔ה עַל מָ֗ה הִכִּ֨יתָ֙ אֶת אֲתֹ֣נְ/ךָ֔ זֶ֖ה שָׁל֣וֹשׁ רְגָלִ֑ים הִנֵּ֤ה אָנֹכִי֙ יָצָ֣אתִי לְ/שָׂטָ֔ן כִּֽי יָרַ֥ט הַ/דֶּ֖רֶךְ לְ/נֶגְדִּֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/032.yaml
  text: And the angel of Yahweh said to him[a], “Why have you struck your donkey these three times? Look, I have come out as an adversary[b], because your way is perverse before me.”
translation:
  language: vi
  text: 'Thiên sứ của Yahweh nói với ông: “Tại sao ngươi đánh con lừa của ngươi ba lần như vậy? Kìa, chính ta đã ra đây làm kẻ đối địch[a], vì đường đi của ngươi là ngang ngược trước mặt ta[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hê-bơ-rơ שָׂטָן ở đây có nghĩa là “kẻ đối địch” hoặc “kẻ chống lại”, không nhất thiết là tên riêng “Sa-tan”.
    reason: lexical_alternative
  - marker: b
    text: Động từ Hê-bơ-rơ được dịch là “ngang ngược” rất hiếm và cũng có thể được hiểu là “liều lĩnh” hoặc “trái nghịch”.
    reason: alternative_reading
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: Thiên sứ của Yahweh
  rationale: מַלְאַךְ có thể là ‘sứ giả’ hoặc ‘thiên sứ’; trong trình thuật này, nhân vật siêu nhiên chặn đường Balaam nên ‘thiên sứ’ là cách diễn đạt tự nhiên và phù hợp. Danh riêng יהוה được phiên âm là ‘Yahweh’.
- source_word: עַל מָה
  choice: Tại sao
  rationale: Diễn đạt tự nhiên câu hỏi nêu lý do trong tiếng Việt hiện đại.
- source_word: הִכִּיתָ אֶת אֲתֹנְךָ
  choice: ngươi đánh con lừa của mình
  rationale: נכה có nghĩa cơ bản là ‘đánh, đập’. אֲתוֹן chỉ lừa cái, nhưng giới tính không phải trọng tâm ở đây nên ‘con lừa’ vừa tự nhiên vừa đủ nghĩa.
- source_word: זֶה שָׁלֹשׁ רְגָלִים
  choice: đến ba lần như vậy
  rationale: Thành ngữ Hê-bơ-rơ có nghĩa là ‘ba lần’; thêm ‘đến… như vậy’ truyền đạt sắc thái trách cứ trong ngữ cảnh.
- source_word: הִנֵּה אָנֹכִי
  choice: Kìa, chính ta
  rationale: ‘Kìa’ giữ chức năng thu hút sự chú ý của הִנֵּה, còn ‘chính ta’ phản ánh đại từ nhấn mạnh אָנֹכִי.
- source_word: יָצָאתִי לְשָׂטָן
  choice: đã ra đây làm kẻ đối địch
  rationale: יצא được diễn đạt theo góc nhìn của cuộc đối mặt là ‘ra đây’; שָׂטָן ở đây là danh từ chung chỉ kẻ chống đối, không nhất thiết là tên riêng Sa-tan.
- source_word: כִּי יָרַט הַדֶּרֶךְ לְנֶגְדִּי
  choice: vì con đường ngươi đi thật ngang ngược trước mặt ta
  rationale: יָרַט là động từ hiếm và khó xác định; ‘ngang ngược’ giữ ý về một hướng đi sai trái hoặc trái nghịch mà không thu hẹp hoàn toàn vào nghĩa ‘liều lĩnh’. ‘Con đường ngươi đi’ diễn đạt tự nhiên đối tượng được đánh giá trong ngữ cảnh, còn ‘trước mặt ta’ giữ sắc thái vừa không gian vừa đánh giá của לְנֶגְדִּי.
theological_decisions:
- issue: Ý nghĩa của לְשָׂטָן
  choice: 'danh từ chung: ‘làm kẻ đối địch’'
  alternative: 'hiểu như tên hoặc tước hiệu: ‘làm Sa-tan’'
  rationale: Trong văn cảnh, thiên sứ của Yahweh đứng ra chống lại Balaam. Dùng tên riêng ‘Sa-tan’ sẽ đưa vào câu một nhận định thần học mà ngữ pháp và văn cảnh không đòi hỏi.
- issue: Ý nghĩa của động từ hiếm יָרַט
  choice: ‘ngang ngược’
  alternative: ‘liều lĩnh’, ‘trái nghịch’ hoặc ‘lao đầu’
  rationale: Từ này chỉ xuất hiện hiếm và nghĩa không chắc chắn. Bản dịch chính truyền đạt sự đánh giá tiêu cực đối với hành trình của Balaam, còn chú thích giữ lại các khả năng từ vựng khác.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, dùng ‘ngươi/ta’ trong lời quở trách trực tiếp. Câu văn ưu tiên tính tự nhiên của tiếng Việt đồng thời giữ danh riêng Yahweh, sắc thái nhấn mạnh của הִנֵּה אָנֹכִי và sự bất định của יָרַט.
