id: NUM.22.20
reference: Numbers 22:20
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יָּבֹ֨א אֱלֹהִ֥ים אֶל בִּלְעָם֮ לַיְלָה֒ וַ/יֹּ֣אמֶר ל֗/וֹ אִם לִ/קְרֹ֤א לְ/ךָ֙ בָּ֣אוּ הָ/אֲנָשִׁ֔ים ק֖וּם לֵ֣ךְ אִתָּ֑/ם וְ/אַ֗ךְ אֶת הַ/דָּבָ֛ר אֲשֶׁר אֲדַבֵּ֥ר אֵלֶ֖י/ךָ אֹת֥/וֹ תַעֲשֶֽׂה׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/020.yaml
  text: God came to Balaam at night and said to him[a], “If the men have come to call you, rise, go with them; but only the word that I speak to you[b], that you shall do.”
translation:
  language: vi
  text: 'Đức Chúa Trời đến với Ba-la-am trong đêm và phán với ông: “Nếu những người ấy đã đến để gọi ngươi, hãy đứng dậy, đi với họ; nhưng chỉ điều Ta sẽ phán với ngươi thì ngươi phải làm.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא
  choice: đến với
  rationale: Động từ בוא ở dạng trần thuật diễn tả Đức Chúa Trời đến với Ba-la-am; không dịch là “hiện ra” vì nguyên văn không nói rõ cách Ngài tỏ mình.
- source_word: אֱלֹהִים
  choice: Đức Chúa Trời
  rationale: Nguyên văn dùng אֱלֹהִים chứ không dùng danh YHWH, nên giữ đúng sự phân biệt này.
- source_word: לַיְלָה
  choice: trong đêm
  rationale: Cách nói tự nhiên, trang trọng trong tiếng Việt, giữ rõ bối cảnh thời gian ban đêm.
- source_word: אִם לִקְרֹא לְךָ בָּאוּ הָאֲנָשִׁים
  choice: Nếu những người ấy đã đến để gọi ngươi
  rationale: Giữ cấu trúc điều kiện và nghĩa cơ bản của קרא; “gọi” ở đây có sắc thái đến mời hoặc triệu Ba-la-am đi cùng.
- source_word: קוּם לֵךְ אִתָּם
  choice: hãy đứng dậy, đi với họ
  rationale: Bảo toàn hai mệnh lệnh liên tiếp trong nguyên văn bằng lối diễn đạt rõ ràng, tự nhiên.
- source_word: וְאַךְ
  choice: Nhưng ... chỉ
  rationale: 'Diễn đạt đồng thời sắc thái đối lập và hạn định: Ba-la-am được đi nhưng phải chịu một giới hạn nghiêm ngặt.'
- source_word: הַדָּבָר אֲשֶׁר אֲדַבֵּר אֵלֶיךָ
  choice: điều ta sẽ phán với ngươi
  rationale: דָּבָר có thể là “lời” hoặc “điều”; trong tiếng Việt, “điều ... phán” tự nhiên và vẫn giữ liên hệ với hành vi nói. Dạng chưa hoàn thành được thể hiện bằng “sẽ” vì lời chỉ dẫn còn ở phía trước.
- source_word: אֹתוֹ תַעֲשֶׂה
  choice: ngươi ... được làm đúng điều
  rationale: Diễn đạt mệnh lệnh có giới hạn và sự nhấn mạnh vào chính điều Đức Chúa Trời phán, tránh cấu trúc lặp gượng trong tiếng Việt.
theological_decisions:
- issue: Danh xưng thần linh trong câu này
  choice: Đức Chúa Trời
  alternative: Đức Giê-hô-va / CHÚA
  rationale: Bản Hê-bơ-rơ dùng אֱלֹהִים, không dùng danh riêng YHWH; vì vậy không đồng nhất hóa với danh xưng xuất hiện ở các câu lân cận.
- issue: Tính cho phép nhưng có giới hạn của mệnh lệnh
  choice: “hãy ... đi” đi kèm “nhưng ... chỉ được”
  alternative: Diễn giải việc đi là hoàn toàn được chuẩn thuận hoặc hoàn toàn bị cấm
  rationale: Nguyên văn vừa truyền cho Ba-la-am đi theo điều kiện vừa giới hạn nghiêm ngặt điều ông được làm; bản dịch giữ nguyên sức căng này.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng đại từ “ta/ngươi” để phản ánh lời phán có thẩm quyền của Đức Chúa Trời trong văn cảnh Kinh Thánh; tên riêng được phiên âm theo truyền thống tiếng Việt.
