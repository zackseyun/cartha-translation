revisions:
- from: 'Đức Chúa Trời đến với Ba-la-am trong đêm và phán với ông: “Nếu những người ấy đã đến để gọi ngươi, hãy đứng dậy, đi với họ. Nhưng ngươi chỉ được làm đúng điều ta sẽ phán với ngươi.”'
  to: 'Đức Chúa Trời đến với Ba-la-am trong đêm và phán với ông: “Nếu những người ấy đã đến để gọi ngươi, hãy đứng dậy, đi với họ; nhưng chỉ điều Ta sẽ phán với ngươi thì ngươi phải làm.”'
  rationale: Bỏ từ “đúng” để không bổ sung sắc thái không có trong bản Hê-bơ-rơ. Đổi mệnh đề cuối thành “chỉ điều ... thì ngươi phải làm” để diễn đạt rõ giới hạn nghiêm ngặt và giữ sự nhấn mạnh vào chính điều Đức Chúa Trời sẽ phán.
