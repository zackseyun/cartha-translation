  to: Bấy giờ, Yahweh mở mắt Ba-la-am[a], và ông thấy thiên sứ của Yahweh[b] đang đứng trên đường, với thanh gươm đã tuốt khỏi vỏ trong tay. Ông cúi mình rồi sấp mặt xuống đất[c].
