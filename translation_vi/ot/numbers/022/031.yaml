id: NUM.22.31
reference: Numbers 22:31
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יְגַ֣ל יְהוָה֮ אֶת עֵינֵ֣י בִלְעָם֒ וַ/יַּ֞רְא אֶת מַלְאַ֤ךְ יְהוָה֙ נִצָּ֣ב בַּ/דֶּ֔רֶךְ וְ/חַרְבּ֥/וֹ שְׁלֻפָ֖ה בְּ/יָד֑/וֹ וַ/יִּקֹּ֥ד וַ/יִּשְׁתַּ֖חוּ לְ/אַפָּֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/031.yaml
  text: Then Yahweh uncovered Balaam’s eyes[a], and he saw the angel of Yahweh standing in the road with his sword drawn in his hand[c][b]; and he bowed down and prostrated himself with his face to the ground.
translation:
  language: vi
  text: Bấy giờ, Yahweh mở mắt Ba-la-am[a], và ông thấy thiên sứ của Yahweh[b] đang đứng trên đường, với thanh gươm đã tuốt khỏi vỏ trong tay. Ông cúi mình rồi sấp mặt xuống đất[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Yahweh vén mở đôi mắt Ba-la-am.” Động từ Hê-bơ-rơ có nghĩa đen là “vén/mở ra, làm lộ ra.”'
    reason: lexical_alternative
  - marker: b
    text: 'Hay: “sứ giả của Yahweh.”'
    reason: lexical_alternative
  - marker: c
    text: 'Hay: “phủ phục, mặt sát đất.” Cụm từ Hê-bơ-rơ mô tả việc cúi rạp trên mặt mình.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְגַל
  choice: mở mắt
  rationale: Động từ גלה có nghĩa đen là “vén/mở ra, làm lộ ra”. Trong tiếng Việt, “mở mắt” là cách diễn đạt tự nhiên cho thành ngữ này, hàm ý Yahweh đã cất đi điều ngăn Ba-la-am nhìn thấy; chú thích giữ lại sắc thái nghĩa đen.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Dùng dạng chuyển tự của danh riêng יהוה thay vì thay thế bằng một tước hiệu.
- source_word: מַלְאַךְ יְהוָה
  choice: thiên sứ của Yahweh
  rationale: מַלְאָךְ có thể là “sứ giả” hoặc “thiên sứ”; bối cảnh về một hữu thể siêu nhiên cầm gươm khiến “thiên sứ” phù hợp, đồng thời chú thích bảo lưu nghĩa rộng hơn.
- source_word: נִצָּב בַּדֶּרֶךְ
  choice: đang đứng giữa đường
  rationale: Dạng phân từ נִצָּב mô tả tư thế đứng tại chỗ; “giữa đường” diễn đạt tự nhiên vị trí chắn lối trong bối cảnh.
- source_word: וְחַרְבּוֹ שְׁלֻפָה בְיָדוֹ
  choice: tay cầm thanh gươm đã tuốt khỏi vỏ
  rationale: שְׁלֻפָה chỉ thanh gươm đã được rút/tuốt ra. Cách sắp xếp này tự nhiên trong tiếng Việt mà vẫn giữ hình ảnh thanh gươm ở trong tay thiên sứ.
- source_word: וַיִּקֹּד וַיִּשְׁתַּחוּ לְאַפָּיו
  choice: ông cúi mình rồi sấp mặt xuống đất
  rationale: Hai động từ liên tiếp mô tả Ba-la-am cúi thấp và phủ phục. Bản dịch giữ hành động cụ thể, không diễn giải trực tiếp thành “thờ lạy”.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC CHÚA; Giê-hô-va
  rationale: Nguyên văn dùng danh riêng của Đức Chúa Trời; chuyển tự “Yahweh” bảo tồn tính chất danh riêng thay vì thay bằng tước hiệu.
- issue: וַיִּשְׁתַּחוּ diễn tả phủ phục hay thờ lạy
  choice: 'diễn tả hành động thân thể: “sấp mặt xuống đất”'
  alternative: “thờ lạy”
  rationale: Động từ có thể được dùng cho hành vi thờ lạy, nhưng câu này nhấn mạnh phản ứng thân thể của Ba-la-am. Cách dịch cụ thể giữ nguyên độ mở thần học, không quyết định quá mức động cơ hay đối tượng thờ phượng.
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại và dễ hiểu. Dùng tên “Ba-la-am” theo lối phiên âm quen thuộc trong tiếng Việt; giữ “Yahweh” là danh riêng. Hai động tác cúi mình và phủ phục được phân biệt, tránh dùng “thờ lạy” vốn có thể giải quyết trước sắc thái thần học của động từ.
