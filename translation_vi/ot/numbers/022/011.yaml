  - severity: low
    issue: Cách diễn đạt chú thích về nguyên văn
    rationale: Nên dùng “theo nghĩa đen, ‘con mắt của đất’” để phản ánh rõ hình ảnh sở hữu trong tiếng Hê-bơ-rơ và tránh khiến “che mắt của đất” nghe như một cụm nguyên văn tiếng Việt.
