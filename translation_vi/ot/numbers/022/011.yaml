  text: הִנֵּ֤ה הָ/עָם֙ הַ/יֹּצֵ֣א מִ/מִּצְרַ֔יִם וַ/יְכַ֖ס אֶת עֵ֣ין הָ/אָ֑רֶץ עַתָּ֗ה לְכָ֤/ה קָֽבָ/ה לִּ/י֙ אֹת֔/וֹ אוּלַ֥י אוּכַ֛ל לְ/הִלָּ֥חֶם בּ֖/וֹ וְ/גֵרַשְׁתִּֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/011.yaml
  text: Look[a], the people who came out of Egypt have covered the face of the land. Now come, curse them for me. Perhaps I will be able to fight against them and drive them out.
translation:
  language: vi
  text: “Kìa, dân đã ra khỏi Ai Cập đã phủ kín mặt đất.[a] Bây giờ, hãy đến nguyền rủa dân ấy cho ta. Có lẽ ta sẽ có thể giao chiến với họ và đuổi họ đi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn Hê-bơ-rơ, theo nghĩa đen, là “con mắt của đất,” một thành ngữ chỉ bề mặt, hay phần nhìn thấy được, của đất.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Kìa
  rationale: Từ cảm thán hướng sự chú ý vào tình thế cấp bách; “Kìa” tự nhiên, trang trọng và giữ được sắc thái chỉ thị của nguyên ngữ.
- source_word: הָעָם הַיֹּצֵא מִמִּצְרַיִם
  choice: dân đã ra khỏi Ai Cập
  rationale: Danh từ tập hợp chỉ dân Israel; phân từ có mạo từ xác định dân ấy bằng biến cố ra khỏi Ai Cập. “Dân” phù hợp với văn cảnh nói về một cộng đồng dân tộc.
- source_word: וַיְכַס אֶת עֵין הָאָרֶץ
  choice: đang phủ kín mặt đất
  rationale: Thành ngữ Hê-bơ-rơ theo nghĩa đen là “che mắt của đất,” chỉ việc phủ kín bề mặt nhìn thấy được. “Đang phủ kín mặt đất” truyền đạt rõ tình trạng hiện tại do sự xuất hiện đông đảo của dân ấy.
- source_word: עַתָּה לְכָה
  choice: Bây giờ, hãy đến
  rationale: Giữ sự chuyển ý khẩn cấp và lời thúc giục trực tiếp; “hãy đến” là cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: קָבָה לִי אֹתוֹ
  choice: nguyền rủa dân ấy cho ta
  rationale: Động từ mang nghĩa trực tiếp là nguyền rủa; לִי biểu thị hành động vì lợi ích hoặc thay mặt người nói. Đại từ số ít Hê-bơ-rơ quy chiếu danh từ tập hợp nên được diễn đạt là “dân ấy” để rõ nghĩa.
- source_word: אוּלַי אוּכַל
  choice: Có lẽ ta sẽ có thể
  rationale: Giữ nguyên sắc thái bất định và hy vọng của אוּלַי, đồng thời phản ánh ý niệm có khả năng làm được.
- source_word: לְהִלָּחֶם בּוֹ
  choice: giao chiến với họ
  rationale: Cấu trúc chỉ việc tham chiến chống lại dân ấy. “Giao chiến với” tự nhiên và phù hợp văn phong tường thuật trang trọng.
- source_word: וְגֵרַשְׁתִּיו
  choice: và đuổi họ đi
  rationale: Động từ chỉ việc xua đuổi khỏi vùng đất; đại từ số ít quy chiếu danh từ tập hợp được chuyển sang số nhiều tự nhiên trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ta” trong lời vua Ba-lác để phù hợp địa vị người nói mà không làm câu văn cổ hóa quá mức. Giữ hình ảnh “mặt đất” trong chính văn và giải thích thành ngữ nguyên ngữ ở chú thích.
