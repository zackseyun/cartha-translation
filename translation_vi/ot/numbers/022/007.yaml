revisions:
- from: Vậy, các trưởng lão Mô-áp và các trưởng lão Ma-đi-an lên đường, mang theo tiền công để xem bói trong tay[a]. Họ đến gặp Ba-la-am và thuật lại cho ông những lời của Ba-lác.
  to: Vậy, các trưởng lão Mô-áp và các trưởng lão Ma-đi-an lên đường, mang theo tiền công cho việc bói toán trong tay[a]. Họ đến gặp Ba-la-am và nói với ông những lời của Ba-lác.
  rationale: Bản sửa thay “thuật lại” bằng “nói với” để không thêm sắc thái tường thuật ngoài nguyên văn. Cụm chỉ khoản thù lao được chỉnh cho tự nhiên hơn trong tiếng Việt, còn chú thích được mở rộng để phản ánh các khả năng ngữ nghĩa của קְסָמִים mà không khẳng định quá mức một cách hiểu.
