source:
  edition: WLC
  text: וַ/יֵּ֨לְכ֜וּ זִקְנֵ֤י מוֹאָב֙ וְ/זִקְנֵ֣י מִדְיָ֔ן וּ/קְסָמִ֖ים בְּ/יָדָ֑/ם וַ/יָּבֹ֨אוּ֙ אֶל בִּלְעָ֔ם וַ/יְדַבְּר֥וּ אֵלָ֖י/ו דִּבְרֵ֥י בָלָֽק־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/007.yaml
  text: So the elders of Moab and the elders of Midian went[a], with divination fees in their hands, and they came to Balaam and spoke to him the words of Balak.
translation:
  language: vi
  text: Vậy, các trưởng lão Mô-áp và các trưởng lão Ma-đi-an lên đường, mang theo tiền công cho việc bói toán trong tay[a]. Họ đến gặp Ba-la-am và nói với ông những lời của Ba-lác.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “mang theo những điều bói toán trong tay”; cách diễn đạt Hê-bơ-rơ có thể chỉ việc bói toán, các vật hoặc điềm liên quan đến bói toán. Trong ngữ cảnh này, nó có lẽ chỉ khoản tiền mang đến để trả cho việc bói toán.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זִקְנֵי
  choice: các trưởng lão
  rationale: Cụm từ ở dạng liên kết với tên dân tộc chỉ những bậc cao niên có vai trò lãnh đạo được thừa nhận; “trưởng lão” giữ được sắc thái chức vị xã hội-chính trị.
- source_word: וּקְסָמִים בְּיָדָם
  choice: mang theo tiền công để xem bói trong tay
  rationale: קְסָמִים có thể chỉ việc hoặc vật dùng để bói toán, nhưng trong ngữ cảnh phái đoàn đến mời Ba-la-am, cách hiểu hoán dụ là khoản trả cho việc xem bói có phần phù hợp hơn. Giữ “trong tay” để phản ánh hình ảnh của nguyên văn.
- source_word: וַיָּבֹאוּ אֶל
  choice: họ đến gặp
  rationale: בוא với אֶל diễn tả việc đến chỗ một người; “đến gặp” tự nhiên trong tiếng Việt và phù hợp với diễn tiến sau hành động lên đường.
- source_word: וַיְדַבְּרוּ אֵלָיו
  choice: thuật lại cho ông
  rationale: Động từ דבר với אֶל là “nói với”; khi đi cùng “những lời của Ba-lác”, “thuật lại cho ông” diễn đạt tự nhiên hành động chuyển lời mà không biến nội dung thành lời trích dẫn trực tiếp.
- source_word: דִּבְרֵי בָלָק
  choice: những lời của Ba-lác
  rationale: Giữ sát kết cấu sở hữu của nguyên văn và không quyết định đó là lời trích nguyên văn hay một thông điệp được giao truyền đạt.
- source_word: וַיֵּלְכוּ
  choice: Vậy, ... lên đường
  rationale: Dạng động từ với waw nối tiếp thúc đẩy mạch truyện và có sắc thái hệ quả từ câu trước; “Vậy” và “lên đường” tạo dòng kể tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Ý nghĩa của קְסָמִים trong cụm וּקְסָמִים בְּיָדָם
  choice: Bản chính dùng “tiền công để xem bói”.
  alternative: “những vật dùng để bói toán trong tay” hoặc “những điềm bói trong tay”.
  rationale: Ngữ cảnh nghiêng về khoản tiền mang đến để thuê dịch vụ bói toán, nhưng từ Hê-bơ-rơ vẫn có thể chỉ các phương tiện hoặc nội dung bói toán; vì vậy giữ phương án khác trong chú thích, không tuyệt đối hóa cách hiểu.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Dùng các tên riêng theo lối phiên âm quen thuộc trong Kinh Thánh tiếng Việt. Bản dịch giữ hình ảnh “trong tay” và dùng chú thích để bảo toàn sự mơ hồ thực sự của קְסָמִים.
