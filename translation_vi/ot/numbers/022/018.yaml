id: NUM.22.18
reference: Numbers 22:18
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יַּ֣עַן בִּלְעָ֗ם וַ/יֹּ֨אמֶר֙ אֶל עַבְדֵ֣י בָלָ֔ק אִם יִתֶּן לִ֥/י בָלָ֛ק מְלֹ֥א בֵית֖/וֹ כֶּ֣סֶף וְ/זָהָ֑ב לֹ֣א אוּכַ֗ל לַ/עֲבֹר֙ אֶת פִּי֙ יְהוָ֣ה אֱלֹהָ֔/י לַ/עֲשׂ֥וֹת קְטַנָּ֖ה א֥וֹ גְדוֹלָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/018.yaml
  text: Balaam answered and said to Balak’s servants, “Even if Balak were to give me his house full of silver and gold, I could not go beyond the word of Yahweh my God, to do anything small or great.”
translation:
  language: vi
  text: 'Ba-la-am đáp lời các tôi tớ của Ba-lác: “Dù Ba-lác có cho tôi bạc và vàng đầy cả nhà ông ấy, tôi cũng không thể vượt quá lời của Yahweh, Đức Chúa Trời của tôi,[a] để làm bất cứ điều gì, dù nhỏ hay lớn.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hê-bơ-rơ: “vượt quá miệng của Yahweh, Đức Chúa Trời của tôi,” một thành ngữ có nghĩa là vượt khỏi hoặc vi phạm điều Ngài đã phán.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: đáp lời
  rationale: Cụm dẫn thoại Hê-bơ-rơ theo nghĩa đen là “đáp và nói”; “đáp lời” giữ chức năng hồi đáp mà tránh lối diễn đạt dư thừa trong tiếng Việt.
- source_word: עַבְדֵי בָלָק
  choice: các tôi tớ của Ba-lác
  rationale: Giữ nghĩa rộng của עֶבֶד trong bối cảnh đoàn sứ giả phục vụ vua; không thu hẹp thành “quan chức” hay nhấn quá mức thân phận nô lệ.
- source_word: אִם יִתֶּן לִי בָלָק
  choice: Dù Ba-lác có cho tôi
  rationale: Điều kiện giả định mang sắc thái nhượng bộ trong lời tuyên bố; “dù ... có” tự nhiên trong tiếng Việt và phù hợp mạch ý.
- source_word: מְלֹא בֵיתוֹ כֶּסֶף וְזָהָב
  choice: bạc và vàng đầy cả nhà ông ấy
  rationale: Bảo tồn hình ảnh căn nhà đầy bạc vàng, đồng thời dùng trật tự từ tự nhiên trong tiếng Việt.
- source_word: לֹא אוּכַל
  choice: tôi cũng không thể
  rationale: Diễn đạt sự bất khả theo יכל, chứ không làm nhẹ thành một sự không muốn hay từ chối đơn thuần.
- source_word: לַעֲבֹר אֶת פִּי
  choice: vượt quá lời của
  rationale: Thành ngữ theo nghĩa đen là “vượt qua miệng của”; “vượt quá lời” giữ được hình ảnh và ý nghĩa không vượt khỏi hay vi phạm điều đã phán.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Chuyển trực tiếp danh riêng giao ước được biểu thị bằng Tứ Tự Danh, thay vì thay thế bằng một tước hiệu.
- source_word: אֱלֹהָי
  choice: Đức Chúa Trời của tôi
  rationale: Thể hiện rõ cấu trúc sở hữu và lời xưng nhận của Ba-la-am mà không suy diễn thêm quan hệ giao ước.
- source_word: לַעֲשׂוֹת קְטַנָּה אוֹ גְדוֹלָה
  choice: để làm bất cứ điều gì, dù nhỏ hay lớn
  rationale: Giữ cặp đối xứng “nhỏ hay lớn” như một phép bao quát, đồng thời làm rõ ý nghĩa “bất cứ điều gì” trong tiếng Việt.
theological_decisions:
- issue: Cách chuyển dịch danh יְהוָה
  choice: Yahweh
  alternative: CHÚA / Đức Giê-hô-va
  rationale: Nguyên văn dùng danh riêng יְהוָה; “Yahweh” bảo tồn danh này thay vì thay bằng tước hiệu, còn “Giê-hô-va” phản ánh một cách đọc truyền thống muộn hơn.
- issue: Sắc thái lời tuyên bố của Ba-la-am
  choice: không thể vượt quá lời của Yahweh
  alternative: không chịu vi phạm mệnh lệnh của Yahweh
  rationale: Nguyên văn dùng động từ chỉ khả năng יכל cùng thành ngữ “vượt quá miệng”; bản dịch giữ sự bất khả được phát biểu và không biến nó thành sự từ chối thuần túy do ý chí.
- issue: Phạm vi của “nhỏ hay lớn”
  choice: bất cứ điều gì, dù nhỏ hay lớn
  alternative: một việc nhỏ hoặc một việc lớn
  rationale: Cặp đối cực tạo thành phép bao quát mọi hành động; cách dịch vừa giữ hai cực vừa truyền đạt phạm vi toàn thể.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ các tên riêng theo dạng quen thuộc Ba-la-am, Ba-lác; dùng “tôi tớ” để bảo tồn độ rộng ngữ nghĩa của từ nguồn. Dấu chú thích [a] được đặt ngay sau cụm mà chú thích giải thích.
