  yaml_path: translation/ot/numbers/022/014.yaml
  text: So the officials of Moab got up and went to Balak, and said, “Balaam refused to go with us.”
translation:
  language: vi
  text: 'Vậy, các quan chức Mô-áp đứng dậy, đến gặp Ba-lác và nói: “Ba-la-am đã từ chối đi cùng chúng tôi.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׂרֵי מוֹאָב
  choice: các thủ lĩnh Mô-áp
  rationale: שָׂרִים chỉ những người có địa vị lãnh đạo hoặc quan chức; “thủ lĩnh” tự nhiên, trang trọng và phù hợp với vai trò của phái đoàn.
- source_word: וַיָּקֻמוּ
  choice: đứng dậy
  rationale: Giữ hình ảnh khởi hành trong nguyên văn mà vẫn tự nhiên trong tiếng Việt.
- source_word: וַיָּבֹאוּ אֶל־בָּלָק
  choice: trở về gặp Ba-lác
  rationale: Động từ בוא cơ bản là “đến”; trong mạch truyện, phái đoàn quay về chỗ Ba-lác, nên “trở về gặp” diễn đạt rõ chuyển động theo ngữ cảnh mà không đổi ý.
- source_word: מֵאֵן
  choice: đã từ chối
  rationale: Diễn đạt trực tiếp hành động không chấp thuận của Ba-la-am.
- source_word: הֲלֹךְ עִמָּנוּ
  choice: đi cùng chúng tôi
  rationale: Cấu trúc nguyên mẫu tuyệt đối đi với מֵאֵן bổ nghĩa cho điều Ba-la-am từ chối; cách dịch này tự nhiên và chính xác.
