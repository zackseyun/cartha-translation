  rationale: Sửa tối thiểu để bám sát động từ “đến” trong tiếng Hê-bơ-rơ, tránh thêm ý “trở về”, đồng thời dùng “quan chức” để diễn đạt tự nhiên và chính xác hơn địa vị của שָׂרֵי trong bối cảnh ngoại giao-chính trị. Không cần chú thích.
