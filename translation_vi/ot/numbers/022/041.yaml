  - severity: low
    issue: “rìa ngoài của dân chúng” chưa tự nhiên.
    rationale: Cụm này có thể gây cảm giác dân chúng có một ‘rìa’ vật lý. “Phần ngoài cùng của dân chúng” diễn đạt tự nhiên hơn ý קְצֵה הָעָם, tức phần rìa/đầu mút của đoàn dân.
