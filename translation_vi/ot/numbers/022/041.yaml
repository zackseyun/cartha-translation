base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/041.yaml
  text: And in the morning Balak took Balaam and brought him up to Bamoth-baal[b][a], and from there he saw the edge of the people.
translation:
  language: vi
  text: Vào buổi sáng, Ba-lác đưa Ba-la-am lên Ba-mốt Ba-anh[a]. Từ đó, ông thấy phần ngoài cùng của dân chúng[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “các nơi cao của Ba-anh” nếu cụm từ này được hiểu theo nghĩa mô tả thay vì là địa danh Ba-mốt Ba-anh.
    reason: lexical_alternative
  - marker: b
    text: Nghĩa là từ đó chỉ nhìn thấy phần ngoài cùng của dân Y-sơ-ra-ên.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַבֹּקֶר
  choice: Sáng hôm sau
  rationale: Công thức tự sự mở ra sự việc kế tiếp vào buổi sáng; cách dịch này tự nhiên trong tiếng Việt và phù hợp với trình tự của câu chuyện.
- source_word: וַיִּקַּח
  choice: đưa
  rationale: Động từ לקח ở đây diễn tả Ba-lác đem Ba-la-am cùng đi đến một địa điểm khác; “đưa” tự nhiên hơn “lấy” trong ngữ cảnh chỉ người.
- source_word: וַיַּעֲלֵהוּ
  choice: lên
  rationale: Dạng Hiphil của עלה mang nghĩa khiến hoặc đưa ai đi lên; kết hợp “đưa ... lên” thể hiện cả ý gây khiến và sự đi lên một nơi cao.
- source_word: בָּמוֹת בָּעַל
  choice: Ba-mốt Ba-anh
  rationale: Trong ngữ cảnh này, cụm từ được hiểu chủ yếu là địa danh và được phiên âm theo lối tên riêng quen dùng trong tiếng Việt; chú thích giữ lại khả năng hiểu theo nghĩa mô tả.
- source_word: וַיַּרְא
  choice: ông thấy
  rationale: ראה là động từ thông thường có nghĩa “thấy”. Đại từ “ông” giữ cách diễn đạt tự nhiên và không làm rõ chủ thể hơn mức văn bản Hê-bơ-rơ cho phép, dù ngữ cảnh hướng đến Ba-la-am.
- source_word: מִשָּׁם
  choice: Từ đó
  rationale: Diễn đạt trực tiếp điểm nhìn từ địa điểm vừa được nhắc đến.
- source_word: קְצֵה הָעָם
  choice: rìa ngoài của dân chúng
  rationale: קצה chỉ đầu mút, rìa hay phần ngoài cùng. Bản dịch giữ danh từ “dân chúng”, không tự ý đổi thành “trại”, đồng thời cho thấy chỉ phần ngoài cùng của dân Y-sơ-ra-ên hiện ra trong tầm nhìn.
