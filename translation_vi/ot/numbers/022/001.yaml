source:
  edition: WLC
  text: וַ/יִּסְע֖וּ בְּנֵ֣י יִשְׂרָאֵ֑ל וַֽ/יַּחֲנוּ֙ בְּ/עַֽרְב֣וֹת מוֹאָ֔ב מֵ/עֵ֖בֶר לְ/יַרְדֵּ֥ן יְרֵחֽוֹ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/001.yaml
  text: Then the sons of Israel set out and camped in the plains of Moab[c][b][a], beyond the Jordan at Jericho.
translation:
  language: vi
  text: Sau đó, con cái Y-sơ-ra-ên lên đường và đóng trại tại đồng bằng Mô-áp, bên kia sông Giô-đanh, ngang Giê-ri-cô.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cụm “bên kia sông Giô-đanh” phụ thuộc vào điểm nhìn địa lý của người kể. Giê-ri-cô là mốc cho biết nơi đóng trại nằm trong đồng bằng Mô-áp, ở phía đông sông Giô-đanh và đối diện khu vực Giê-ri-cô.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: lên đường
  rationale: Trong các trình thuật hành trình nơi hoang mạc, נסע chỉ việc nhổ trại và tiếp tục di chuyển; “lên đường” tự nhiên trong tiếng Việt hiện đại và giữ rõ ý hành trình.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: con cái Y-sơ-ra-ên
  rationale: Cụm Hê-bơ-rơ theo nghĩa đen là “các con trai/con cái của Y-sơ-ra-ên” và là cách gọi tập thể dân tộc. “Con cái Y-sơ-ra-ên” vừa gần hình thức nguyên văn vừa có thể chỉ toàn dân.
- source_word: וַיַּחֲנוּ
  choice: đóng trại
  rationale: חנה có nghĩa là dựng hoặc đóng trại; “đóng trại” là cách diễn đạt rõ ràng, tự nhiên trong tiếng Việt.
- source_word: בְּעַרְבוֹת מוֹאָב
  choice: tại đồng bằng Mô-áp
  rationale: עַרְבוֹת chỉ vùng đất bằng, trống trải hoặc thảo nguyên; “đồng bằng Mô-áp” là cách gọi địa lý quen thuộc và dễ hiểu.
- source_word: מֵעֵבֶר לְיַרְדֵּן
  choice: bên kia sông Giô-đanh
  rationale: Cụm từ chỉ vùng ở phía bên kia sông Giô-đanh theo điểm nhìn của người kể; cách dịch này giữ tính tương đối về địa lý mà không tự ý xác định hướng.
- source_word: יְרֵחוֹ
  choice: ngang Giê-ri-cô
  rationale: Giê-ri-cô là mốc địa lý ở phía đối diện bên kia sông. “Ngang Giê-ri-cô” diễn đạt chính xác quan hệ vị trí hơn “tại Giê-ri-cô”, vì trại nằm trong đồng bằng Mô-áp chứ không ở chính thành Giê-ri-cô.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ cách gọi mang sắc thái Kinh Thánh “con cái Y-sơ-ra-ên”, đồng thời dùng “ngang Giê-ri-cô” để tránh khiến độc giả hiểu lầm rằng dân đã đóng trại trong thành Giê-ri-cô.
