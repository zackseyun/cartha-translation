source:
  edition: WLC
  text: וַ/יּ֥וֹסֶף מַלְאַךְ יְהוָ֖ה עֲב֑וֹר וַֽ/יַּעֲמֹד֙ בְּ/מָק֣וֹם צָ֔ר אֲשֶׁ֛ר אֵֽין דֶּ֥רֶךְ לִ/נְט֖וֹת יָמִ֥ין וּ/שְׂמֹֽאול־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/026.yaml
  text: Then the angel of Yahweh went farther and stood in a narrow place[a], where there was no way to turn to the right or to the left.
translation:
  language: vi
  text: Thiên sứ của Yahweh lại đi tiếp[a] và đứng ở một chỗ chật hẹp, nơi không có lối rẽ sang phải hay sang trái.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “tiếp tục tiến lên” hoặc “đi xa hơn.” Thành ngữ Hê-bơ-rơ mang ý tiếp tục hay lặp lại việc đi tới.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹסֶף ... עֲבוֹר
  choice: lại đi tiếp
  rationale: Cấu trúc יסף với động từ nguyên mẫu diễn tả việc tiếp tục hoặc lặp lại hành động. Trong mạch truyện, thiên sứ tiến lên phía trước đến một vị trí khác; “lại đi tiếp” vừa tự nhiên trong tiếng Việt vừa giữ được sắc thái tiếp diễn/lặp lại.
- source_word: מַלְאַךְ יְהוָה
  choice: Thiên sứ của Yahweh
  rationale: מַלְאַךְ có thể là “sứ giả” hoặc “thiên sứ”; trong trình thuật siêu nhiên này, “thiên sứ” là cách diễn đạt tự nhiên. Danh riêng יְהוָה được chuyển là “Yahweh”.
- source_word: וַיַּעֲמֹד
  choice: đứng
  rationale: Động từ עמד ở đây có nghĩa là đứng hoặc đứng chặn tại một vị trí; “đứng” giữ cách diễn đạt ngắn gọn của nguyên văn.
- source_word: בְּמָקוֹם צָר
  choice: ở một chỗ chật hẹp
  rationale: Cụm từ chỉ một địa điểm bị bó hẹp. “Chỗ chật hẹp” truyền đạt rõ tình trạng không có khoảng trống để tránh sang bên.
- source_word: אֲשֶׁר אֵין דֶּרֶךְ לִנְטוֹת
  choice: nơi không có lối rẽ
  rationale: דֶּרֶךְ trong mệnh đề này không nhất thiết nói rằng hoàn toàn không có đường, mà là không có lối hoặc khoảng trống để chuyển hướng; cách dịch này làm rõ quan hệ với vế sau mà không thêm ý ngoài văn cảnh.
- source_word: יָמִין וּשְׂמֹאול
  choice: sang phải hay sang trái
  rationale: Hai danh từ chỉ phương hướng được diễn đạt bằng cấu trúc tự nhiên trong tiếng Việt, nêu rõ không thể tránh về bất cứ phía nào.
theological_decisions:
- issue: Cách chuyển danh יהוה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Nguyên văn dùng trực tiếp danh giao ước יהוה. Giữ “Yahweh” giúp phân biệt danh riêng này với tước hiệu “Chúa” và không áp đặt một truyền thống phiên âm khác.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Thiên sứ” phù hợp với bối cảnh siêu nhiên; “chỗ chật hẹp” và “không có lối rẽ” tái hiện rõ không gian bị bó hẹp mà không diễn giải quá mức.
