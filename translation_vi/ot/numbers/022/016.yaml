  source_fidelity: 'Bản dịch truyền đạt đúng diễn tiến và công thức sứ giả: họ đến gặp Ba-la-am, truyền lời của Ba-lác con trai Xíp-bô, rồi đưa ra lời thỉnh cầu. Tuy nhiên, “từ chối đến” thu hẹp תִמָּנַע מֵהֲלֹךְ vào hành vi khước từ dứt khoát. Động từ מנע với מן và nguyên mẫu trước hết là tự kiềm lại, ngần ngại, hoặc không chịu đi; lời mời không nhất thiết giả định một sự từ chối đã được nêu ra.'
  naturalness: Cú pháp nhìn chung tự nhiên, dấu ngoặc kép lồng nhau rõ ràng, và “đến với tôi” là cách diễn đạt Việt ngữ tự nhiên cho הֲלֹךְ אֵלָי theo điểm nhìn của Ba-lác. “Xin ông đừng ngần ngại đến với tôi” vừa tự nhiên vừa giữ tốt hơn sắc thái thúc giục của nguyên ngữ.
  terminology: Các tên “Ba-la-am,” “Ba-lác,” và “Xíp-bô” nhất quán theo lối phiên âm Việt ngữ đang dùng trong bản thảo. Công thức “nói thế này” phù hợp với כֹּה אָמַר và không cần áp đặt thì tiếng Việt. Không có thuật ngữ thần học cần điều chỉnh.
