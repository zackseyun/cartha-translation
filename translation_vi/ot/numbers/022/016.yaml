base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/016.yaml
  text: 'They came to Balaam and said to him[a], “Thus says Balak son of Zippor: Please do not refrain from coming to me.”'
translation:
  language: vi
  text: 'Họ đến gặp Ba-la-am và nói với ông: “Ba-lác, con trai Xíp-bô, nói thế này: ‘Xin ông đừng ngần ngại đến với tôi.’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹאוּ אֶל־בִּלְעָם
  choice: Họ đến gặp Ba-la-am
  rationale: בוא diễn tả việc các sứ giả đến chỗ Ba-la-am; “đến gặp” tự nhiên trong tiếng Việt và làm rõ đối tượng mà không thêm ý ngoài ngữ cảnh.
- source_word: וַיֹּאמְרוּ לוֹ
  choice: và nói với ông
  rationale: Giữ nguyên cấu trúc dẫn lời trực tiếp của אמר với tân ngữ gián tiếp.
- source_word: כֹּה אָמַר
  choice: nói thế này
  rationale: Công thức truyền đạt lời nhắn được diễn đạt bằng tiếng Việt hiện đại, trang trọng vừa phải; thì quá khứ hay hiện tại không được hình thái Hê-bơ-rơ ở đây quyết định theo cách tương ứng trực tiếp với tiếng Việt.
- source_word: בָּלָק בֶּן־צִפּוֹר
  choice: Ba-lác, con trai Xíp-bô
  rationale: Phiên âm tên riêng theo lối quen thuộc trong tiếng Việt và diễn đạt quan hệ phụ tử của kết cấu liên thuộc.
- source_word: אַל־נָא
  choice: Xin ông đừng
  rationale: אַל biểu thị lời ngăn cấm, còn נָא thêm sắc thái khẩn khoản, lịch sự; “xin ông đừng” truyền đạt cả hai.
- source_word: תִמָּנַע מֵהֲלֹךְ
  choice: từ chối đến
  rationale: מנע với מִן và động từ nguyên mẫu diễn tả việc tự ngăn mình hay không chịu thực hiện hành động. Trong ngữ cảnh lời mời, “từ chối đến” tự nhiên và giữ sắc thái thúc giục, dù ít giữ hình ảnh 'tự kiềm/giữ lại' hơn cách dịch sát chữ.
- source_word: אֵלָי
  choice: với tôi
  rationale: אֵלַי chỉ hướng về người nói. Kết hợp “đến với tôi” là cách nói tự nhiên, đúng điểm nhìn của Ba-lác.
theological_decisions: []
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, rõ ràng và trang trọng tự nhiên. Dùng dấu ngoặc kép lồng để phân biệt lời các sứ giả với nguyên văn lời Ba-lác. Không cần chú thích vì “đến với tôi” truyền đạt tự nhiên הֲלֹךְ אֵלַי theo điểm nhìn của người nói mà không làm mất một dị nghĩa quan trọng trong tiếng Việt.
