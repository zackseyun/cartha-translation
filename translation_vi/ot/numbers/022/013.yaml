id: NUM.22.13
reference: Numbers 22:13
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יָּ֤קָם בִּלְעָם֙ בַּ/בֹּ֔קֶר וַ/יֹּ֨אמֶר֙ אֶל שָׂרֵ֣י בָלָ֔ק לְכ֖וּ אֶֽל אַרְצְ/כֶ֑ם כִּ֚י מֵאֵ֣ן יְהוָ֔ה לְ/תִתִּ֖/י לַ/הֲלֹ֥ךְ עִמָּ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/013.yaml
  text: So Balaam rose in the morning and said to Balak’s officials[a], “Go to your land, because Yahweh has refused to let me go with you.”
translation:
  language: vi
  text: 'Buổi sáng, Ba-la-am đứng dậy và nói với các quan chức của Ba-lác[a]: “Hãy về xứ các ông, vì Yahweh đã không chịu cho phép tôi đi cùng các ông.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “các thủ lĩnh của Ba-lác” hoặc “các vương hầu của Ba-lác.”
    reason: שָׂרִים có phạm vi nghĩa bao gồm quan chức, thủ lĩnh và vương hầu; nguyên văn không xác định chính xác chức vị của họ.
lexical_decisions:
- source_word: וַיָּקָם
  choice: đứng dậy
  rationale: Động từ קום ở thể Qal trong mạch kể chuyện diễn tả việc Ba-la-am thức dậy và bắt đầu hành động; “đứng dậy” tự nhiên và sát nghĩa trong tiếng Việt.
- source_word: בַּבֹּקֶר
  choice: Sáng hôm sau
  rationale: Cụm từ chỉ buổi sáng trong diễn tiến tự sự. “Sáng hôm sau” làm rõ sự chuyển sang ngày kế tiếp vốn được ngữ cảnh xác lập, mà không thêm sắc thái “từ sớm” không có trong nguyên văn.
- source_word: שָׂרֵי בָלָק
  choice: các quan chức của Ba-lác
  rationale: שָׂרִים có thể chỉ quan chức, thủ lĩnh hoặc vương hầu. Trong bối cảnh đây là những người đại diện cho vua Ba-lác, “các quan chức” truyền đạt rõ vai trò của họ mà không mặc nhiên coi họ là hoàng thân.
- source_word: לְכוּ אֶל אַרְצְכֶם
  choice: Hãy trở về xứ của các ông
  rationale: Mệnh lệnh “đi đến xứ của các ông” trong ngữ cảnh mang nghĩa trở về nơi họ xuất phát. “Trở về xứ” là cách nói tự nhiên, trang trọng và không quá diễn giải.
- source_word: כִּי
  choice: vì
  rationale: Liên từ nêu lý do cho mệnh lệnh trước đó; “vì” là tương đương rõ ràng và tự nhiên.
- source_word: מֵאֵן
  choice: đã không cho phép
  rationale: Piel hoàn thành của מאן diễn tả sự từ chối. Kết hợp với cấu trúc נתן + động từ nguyên mẫu, cách dịch này truyền đạt tự nhiên rằng Yahweh không chấp thuận cho Ba-la-am đi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ danh riêng của Đức Chúa Trời được viết bằng danh bốn phụ âm, thay vì thay thế bằng một tước hiệu.
- source_word: לְתִתִּי לַהֲלֹךְ עִמָּכֶם
  choice: cho phép tôi đi cùng các ông
  rationale: נתן đi với động từ nguyên mẫu ở đây có nghĩa thành ngữ là cho phép; הלך עם chỉ việc đi cùng phái đoàn. Cách dịch này tự nhiên và giữ đúng quan hệ ý nghĩa.
- source_word: וַיֹּאמֶר
  choice: nói
  rationale: Tương đương thông dụng của động từ kể chuyện אָמַר, phù hợp với lời trực tiếp theo sau.
theological_decisions:
- issue: Cách dịch danh Đức Chúa Trời יְהוָה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Nguyên văn dùng trực tiếp danh bốn phụ âm. Phiên âm “Yahweh” bảo tồn chức năng danh riêng và tránh thay danh ấy bằng một tước hiệu.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “các ông” để xưng hô với phái đoàn gồm nhiều người; giữ “xứ” nhằm duy trì sắc thái Kinh Thánh vừa phải. Dấu chú thích [a] xuất hiện ngay sau cụm từ liên quan.
