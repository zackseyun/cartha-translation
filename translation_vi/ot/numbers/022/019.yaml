source:
  edition: WLC
  text: וְ/עַתָּ֗ה שְׁב֨וּ נָ֥א בָ/זֶ֛ה גַּם אַתֶּ֖ם הַ/לָּ֑יְלָה וְ/אֵ֣דְעָ֔ה מַה יֹּסֵ֥ף יְהוָ֖ה דַּבֵּ֥ר עִמִּֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/019.yaml
  text: Now please stay here tonight[a], you also, so that I may know what more Yahweh will say to me.
translation:
  language: vi
  text: Bây giờ, xin các ông cũng ở lại đây đêm nay, để tôi biết Yahweh sẽ còn phán gì với tôi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: Bây giờ
  rationale: Dùng như một dấu hiệu chuyển ý trong lời chỉ dẫn tiếp theo của Ba-la-am; tiếng Việt hiện đại không cần giữ liên từ mở đầu.
- source_word: שְׁבוּ נָא
  choice: xin các ông… ở lại
  rationale: Trong ngữ cảnh, ישׁב mang nghĩa 'ở lại' hơn là nghĩa đen 'ngồi'; נָא được thể hiện bằng 'xin'. Đại từ 'các ông' phù hợp với nhóm sứ giả được nói trực tiếp.
- source_word: בָזֶה
  choice: đây
  rationale: Giữ nghĩa chỉ địa điểm một cách tự nhiên và ngắn gọn.
- source_word: גַּם אַתֶּם
  choice: các ông cũng
  rationale: 'Giữ sắc thái bổ sung: phái đoàn này cũng được yêu cầu ở lại như phái đoàn trước.'
- source_word: הַלָּיְלָה
  choice: đêm nay
  rationale: Danh từ chỉ thời gian nói về đêm sắp đến; 'đêm nay' là cách diễn đạt tự nhiên.
- source_word: וְאֵדְעָה
  choice: để tôi biết
  rationale: Dạng cohortative gắn với lời yêu cầu trước đó, biểu thị mục đích; 'để tôi biết' truyền đạt sắc thái này rõ ràng.
- source_word: מַה יֹּסֵף
  choice: sẽ… thêm điều gì
  rationale: Cấu trúc với יסף nói đến hành động hay lời mặc khải bổ sung; cách sắp xếp này tự nhiên trong tiếng Việt và không thu hẹp nội dung.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng dạng danh riêng quen thuộc trong tiếng Việt để thể hiện trực tiếp Tứ Tự Danh, thay vì thay bằng tước hiệu 'CHÚA'.
- source_word: דַּבֵּר עִמִּי
  choice: phán… với tôi
  rationale: Giữ giới từ 'với' của nguyên văn và dùng 'phán' theo văn phong trang trọng khi nói về lời Đức Chúa Trời, đồng thời không biến câu thành một cuộc đối thoại hai chiều rõ hơn nguyên văn.
theological_decisions:
- issue: Cách dịch danh Đức Chúa Trời יְהוָה
  choice: Đức Giê-hô-va
  alternative: Yahweh; CHÚA
  rationale: Nguyên văn dùng trực tiếp danh riêng YHWH. 'Đức Giê-hô-va' bảo tồn chức năng danh riêng trong tiếng Việt và là dạng quen thuộc, trang trọng; không thay danh bằng một tước hiệu.
- issue: Sắc thái của lời Ba-la-am về sự mặc khải thêm
  choice: sẽ phán thêm điều gì với tôi
  alternative: còn phán điều gì với tôi
  rationale: Giữ nguyên hàm ý Ba-la-am chờ một lời bổ sung mà không xác nhận hay phủ nhận tính đúng đắn trong thái độ của ông; tránh giải quyết căng thẳng thần học của mạch truyện.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Trật tự từ được điều chỉnh tự nhiên; giữ sắc thái lịch sự của נָא, ý bổ sung của גַּם và יסף, cùng quan hệ 'với tôi' trong nguyên văn.
