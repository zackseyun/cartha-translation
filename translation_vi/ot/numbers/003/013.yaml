  source_fidelity: 'Bản dịch theo sát cấu trúc và ý nghĩa tiếng Hê-bơ-rơ: כִּי được dịch đúng sắc thái giải thích bằng “Vì”; ba lần לִי được phản ánh nhất quán qua “thuộc về Ta / cho Ta”; הִקְדַּשְׁתִּי được chuyển đúng nghĩa thánh hiến/dành riêng bằng “đã biệt riêng”; và mệnh đề bao quát “từ người cho đến súc vật” giữ nguyên phạm vi của thành ngữ מֵאָדָם עַד בְּהֵמָה. “Ta đánh chết” phản ánh hợp cảnh cách chính xác động từ נכה trong tai họa Ai Cập. Không thêm giới tính vào “con đầu lòng.”'
  naturalness: Văn bản rõ ràng, trang trọng và tự nhiên trong tiếng Việt hiện đại. Đại từ “Ta” phù hợp với lời phán trực tiếp của Yahweh. Cụm “biệt riêng cho Ta” có sắc thái Kinh Thánh trang trọng nhưng vẫn dễ hiểu, đồng thời diễn đạt được cả sự dành riêng lẫn quyền sở hữu của Đức Chúa Trời.
  terminology: “Yahweh” phản ánh trực tiếp יהוה và nhất quán với định hướng đã nêu. “Israel,” “con đầu lòng,” và “súc vật” đều phù hợp ngữ cảnh. Chú thích [a] được đặt đúng tại lần xuất hiện đầu của cụm diễn đạt quyền sở hữu và giải thích thỏa đáng sự lặp lại của לִי trong nguyên văn.
