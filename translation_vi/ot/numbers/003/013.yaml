id: NUM.3.13
reference: Numbers 3:13
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: כִּ֣י לִ/י֮ כָּל בְּכוֹר֒ בְּ/יוֹם֩ הַכֹּתִ֨/י כָל בְּכ֜וֹר בְּ/אֶ֣רֶץ מִצְרַ֗יִם הִקְדַּ֨שְׁתִּי לִ֤/י כָל בְּכוֹר֙ בְּ/יִשְׂרָאֵ֔ל מֵ/אָדָ֖ם עַד בְּהֵמָ֑ה לִ֥/י יִהְי֖וּ אֲנִ֥י יְהוָֽה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/013.yaml
  text: For every firstborn is mine[a]. On the day when I struck down every firstborn in the land of Egypt, I consecrated to myself every firstborn in Israel, from man to beast. They shall be mine[b]. I am Yahweh.
translation:
  language: vi
  text: Vì mọi con đầu lòng đều thuộc về Ta.[a] Vào ngày Ta đánh chết mọi con đầu lòng trong đất Ai Cập, Ta đã biệt riêng cho Ta mọi con đầu lòng trong Israel, từ người cho đến súc vật. Chúng sẽ thuộc về Ta. Ta là Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cụm “thuộc về Ta” được lặp lại trong nguyên văn, nhấn mạnh rằng các con đầu lòng là sở hữu của Yahweh.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Vì
  rationale: Mở đầu lý do cho mệnh lệnh ở câu trước; “Vì” giữ rõ quan hệ giải thích.
- source_word: לִי
  choice: thuộc về Ta / cho Ta
  rationale: Giữ trọng tâm về quyền sở hữu của Đức Chúa Trời và phản ánh sự lặp lại trong tiếng Hê-bơ-rơ bằng cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: כָּל בְּכוֹר
  choice: mọi con đầu lòng
  rationale: Diễn đạt toàn diện mà không thêm ý “giống đực,” vốn không được nói rõ tại đây.
- source_word: בְּיוֹם הַכֹּתִי
  choice: Vào ngày Ta đánh chết
  rationale: Giữ cấu trúc thời gian trang trọng và làm rõ tính chất gây chết của נכה trong bối cảnh tai họa trên các con đầu lòng Ai Cập.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: trong đất Ai Cập
  rationale: Giữ đầy đủ danh ngữ chỉ địa lý của nguyên văn và sắc thái tường thuật trang trọng.
- source_word: הִקְדַּשְׁתִּי
  choice: Ta đã biệt riêng
  rationale: Trong thể Hiphil, động từ diễn tả việc dành riêng cho Đức Chúa Trời; “biệt riêng” dễ hiểu mà vẫn giữ ý thánh hiến.
- source_word: בְּיִשְׂרָאֵל
  choice: trong Israel
  rationale: Theo sát phạm vi được nêu trong nguyên văn, đồng thời dùng tên dân/tập thể Israel một cách gọn và tự nhiên.
- source_word: מֵאָדָם עַד בְּהֵמָה
  choice: từ người cho đến súc vật
  rationale: Giữ kết cấu bao quát hai cực người và vật; “súc vật” phù hợp với בְּהֵמָה trong bối cảnh các con đầu lòng thuộc đàn vật nuôi.
- source_word: יִהְיוּ
  choice: Chúng sẽ thuộc về Ta
  rationale: Diễn đạt lời khẳng định hướng tới và kéo dài về quyền sở hữu của Đức Chúa Trời.
- source_word: אֲנִי יְהוָה
  choice: Ta là Yahweh
  rationale: Giữ trực tiếp danh giao ước יהוה và công thức kết thúc khẳng định thẩm quyền thần linh.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: CHÚA / Đức Giê-hô-va
  rationale: Nguyên văn dùng trực tiếp Tứ Tự Danh; phiên âm “Yahweh” bảo tồn danh riêng thay vì thay bằng một tước hiệu.
- issue: Ý nghĩa của הִקְדַּשְׁתִּי
  choice: đã biệt riêng cho Ta
  alternative: đã thánh hóa / đã hiến thánh cho Ta
  rationale: Cách dịch này giữ ý dành riêng cho Đức Chúa Trời mà không áp đặt một nghi thức hoặc hệ thống giáo phái cụ thể.
- issue: Phạm vi của אָדָם trong thành ngữ đối lập người-vật
  choice: người
  alternative: loài người
  rationale: Ở đây אָדָם chỉ phạm trù con người nói chung đối lập với súc vật, không riêng nam giới.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “Ta” phù hợp với lời phán trực tiếp của Đức Chúa Trời. Giữ “Israel” thay vì Việt hóa thành “Y-sơ-ra-ên,” và dùng “Yahweh” cho danh יהוה.
