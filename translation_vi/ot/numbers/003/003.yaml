base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/003.yaml
  text: These are the names of Aaron’s sons[a], the anointed priests, whose hands were filled to serve as priests.
translation:
  language: vi
  text: Đây là tên các con trai của A-rôn, những thầy tế lễ đã được xức dầu, là những người được tấn phong để thi hành chức thầy tế lễ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ: “làm đầy tay họ,” một thành ngữ chỉ việc tấn phong hoặc đặt họ vào chức vụ tế lễ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה שְׁמוֹת בְּנֵי אַהֲרֹן
  choice: Đây là tên các con trai của A-rôn
  rationale: Dịch tự nhiên công thức giới thiệu và chuỗi sở hữu; “con trai” giữ đúng nghĩa giống đực của בְּנֵי trong ngữ cảnh các tư tế được nêu tên.
- source_word: הַכֹּהֲנִים הַמְּשֻׁחִים
  choice: những thầy tế lễ đã được xức dầu
  rationale: Giữ chức danh tư tế và hành động nghi lễ cụ thể của משׁח; thể bị động phản ánh phân từ bị động trong tiếng Hê-bơ-rơ.
- source_word: אֲשֶׁר מִלֵּא יָדָם
  choice: là những người được lập
  rationale: מִלֵּא יָדָם, sát chữ là “làm đầy tay họ”, là thành ngữ kỹ thuật chỉ việc tấn phong hoặc thiết lập vào chức vụ. Dịch nghĩa trong chính văn để câu tiếng Việt rõ và tự nhiên, đồng thời ghi hình ảnh nguyên ngữ trong chú thích.
- source_word: לְכַהֵן
  choice: để phục vụ trong chức thầy tế lễ
  rationale: Diễn đạt mục đích của việc thiết lập và giữ sắc thái thi hành chức vụ, thay vì chỉ nói họ “là” thầy tế lễ.
theological_decisions:
- issue: Cách dịch thành ngữ tấn phong מִלֵּא יָדָם
  choice: “được lập” trong chính văn, kèm chú thích giải thích nghĩa sát chữ và các khả năng “tấn phong/thiết lập”
  alternative: “tay họ được làm đầy” hoặc “được tấn phong”
  rationale: Dịch sát từng chữ sẽ khó hiểu và không tự nhiên trong tiếng Việt; “được lập” truyền đạt chức năng của thành ngữ mà không gán rõ một chủ thể vốn không được nêu trong câu Hê-bơ-rơ. Chú thích bảo tồn hình ảnh nguyên ngữ và tính minh bạch.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “thầy tế lễ” để chỉ כֹּהֵן và “xức dầu” để bảo tồn hành động nghi lễ. Cấu trúc bị động “được lập” tránh bổ sung một chủ thể không được nêu rõ trong nguyên văn.
