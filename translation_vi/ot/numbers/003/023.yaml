  register: Văn phong hiện đại, trang trọng và dễ đọc. Cấu trúc câu giữ thứ tự thông tin của nguyên văn khi tự nhiên trong tiếng Việt; tên riêng được phiên âm theo lối dùng Kinh Thánh tiếng Việt phổ biến.
