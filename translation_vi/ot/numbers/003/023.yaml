  source_fidelity: 'Bản dịch phản ánh đúng các thành tố chính của tiếng Hê-bơ-rơ: מִשְׁפְּחֹת là các đơn vị huyết tộc số nhiều (“Các thị tộc”); הַגֵּרְשֻׁנִּי mang nghĩa tập thể liên hệ với Ghẹt-sôn; אַחֲרֵי có nghĩa không gian “phía sau”; יַחֲנוּ diễn tả việc đóng trại theo sự sắp đặt; và יָמָּה chỉ hướng tây. Trật tự “phía sau Đền Tạm, về hướng tây” truyền đạt rõ vị trí được nêu trong nguyên văn.'
