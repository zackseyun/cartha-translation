base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/023.yaml
  text: The clans of the Gershonites shall camp behind the tabernacle[a], toward the west.
translation:
  language: vi
  text: Các thị tộc Ghẹt-sôn sẽ đóng trại phía sau Đền Tạm, về hướng tây.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tiếng Hê-bơ-rơ dịch sát là “về phía biển”, một thành ngữ thông dụng chỉ hướng tây trong tiếng Hê-bơ-rơ Kinh Thánh.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁפְּחֹת
  choice: các thị tộc
  rationale: Trong bối cảnh tổ chức bộ tộc và kiểm kê dân số của sách Dân Số, từ này chỉ các phân nhóm dựa trên huyết thống; “thị tộc” chính xác hơn “gia đình”, vốn dễ gợi đến một hộ gia đình.
- source_word: הַגֵּרְשֻׁנִּי
  choice: Ghẹt-sôn
  rationale: Danh từ chỉ dòng tộc ở số ít nhưng mang nghĩa tập thể, nói đến các thị tộc thuộc dòng Ghẹt-sôn. Vì “các thị tộc” đã biểu thị tính tập thể, dùng tên “Ghẹt-sôn” tránh lặp nặng nề.
- source_word: אַחֲרֵי
  choice: phía sau
  rationale: Giới từ ở đây mang nghĩa không gian trong cách bố trí doanh trại, không mang nghĩa thời gian “sau đó”.
- source_word: הַמִּשְׁכָּן
  choice: Đền Tạm
  rationale: Trong sách Dân Số, từ này chỉ nơi thánh dạng lều, nơi Đức Chúa Trời ngự giữa dân; “Đền Tạm” là cách gọi quen thuộc, trang trọng và dễ hiểu trong tiếng Việt.
- source_word: יַחֲנוּ
  choice: sẽ đóng trại
  rationale: Dạng chưa hoàn thành diễn tả cách bố trí doanh trại đã được quy định; “sẽ đóng trại” tự nhiên trong tiếng Việt và vẫn giữ sắc thái chỉ định theo ngữ cảnh.
- source_word: יָמָּה
  choice: về hướng tây
  rationale: Dạng chỉ hướng của từ “biển” là thành ngữ Hê-bơ-rơ chỉ hướng tây. Bản dịch chính truyền đạt hướng địa lý rõ ràng, còn nghĩa đen được ghi ở chú thích.
theological_decisions: []
