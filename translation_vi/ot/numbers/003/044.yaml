  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/044.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: vi
  text: 'Yahweh[a] phán với Môi-se rằng:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ: “YHWH”, danh riêng của Đức Chúa Trời; cũng được phiên âm là “Giê-hô-va”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: phán
  rationale: Động từ דבר trong công thức tường thuật lời Đức Chúa Trời được dịch là “phán”, vừa tự nhiên và trang trọng trong tiếng Việt, vừa phân biệt hợp lý với אמר (“nói”). Liên từ וַ được thể hiện qua mạch nối với văn cảnh thay vì thêm “và” một cách gượng ép ở đầu câu.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Đây là danh riêng của Đức Chúa Trời, ký bằng bốn phụ âm YHWH. “Đức Giê-hô-va” là dạng danh xưng quen thuộc và trang trọng đối với độc giả Kinh Thánh tiếng Việt, không thay danh riêng bằng một tước hiệu.
- source_word: אֶל
  choice: với
  rationale: Giới từ đánh dấu người tiếp nhận lời nói; trong tiếng Việt, kết cấu tự nhiên là “phán với”.
- source_word: מֹשֶׁה
  choice: Môi-se
  rationale: Dạng phiên âm tiếng Việt quen dùng của tên riêng משה.
- source_word: לֵאמֹר
  choice: rằng
  rationale: Phân từ nguyên dạng này mở đầu nội dung lời phán. “Rằng” diễn đạt tự nhiên chức năng dẫn lời trong tiếng Việt và tránh lối dịch cứng “mà rằng”.
theological_decisions:
- issue: Cách thể hiện danh יהוה
  choice: Đức Giê-hô-va
  alternative: Yahweh (Gia-vê)
  rationale: Bản Hê-bơ-rơ dùng trực tiếp danh YHWH. Bản dịch giữ đây là danh riêng, đồng thời dùng hình thức đã quen thuộc trong truyền thống Kinh Thánh tiếng Việt; chú thích nêu rõ nguyên văn và cách phiên âm khác để minh bạch chứng cứ nguồn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Công thức dẫn nhập lời phán được diễn đạt gọn là “phán với Môi-se rằng:”; dấu hai chấm báo trước nội dung phát ngôn ở câu kế tiếp.
