  text: וַ/יִּתֵּ֨ן מֹשֶׁ֜ה אֶת כֶּ֧סֶף הַ/פְּדֻיִ֛ם לְ/אַהֲרֹ֥ן וּ/לְ/בָנָ֖י/ו עַל פִּ֣י יְהוָ֑ה כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/051.yaml
  text: And Moses gave the redemption money to Aaron and to his sons[a], at the command of Yahweh, just as Yahweh had commanded Moses.
translation:
  language: vi
  text: Môi-se trao khoản bạc dùng để chuộc[a] cho A-rôn và các con trai ông, theo lệnh Yahweh, đúng như Yahweh đã truyền cho Môi-se.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ: “bạc của những người được chuộc”; tức khoản bạc thu để chuộc họ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: trao
  rationale: Động từ נתן trong mạch kể quá khứ có nghĩa là đưa hoặc giao cho; “trao” tự nhiên trong ngữ cảnh chuyển khoản bạc đã thu.
- source_word: כֶּסֶף הַפְּדֻיִם
  choice: số bạc chuộc lại
  rationale: כֶּסֶף theo nghĩa gốc là bạc và trong ngữ cảnh này là bạc dùng làm khoản thanh toán; הַפְּדֻיִם theo hình thức chỉ “những người được chuộc”. Cách dịch này vừa dễ hiểu vừa giữ sắc thái bạc dùng cho việc chuộc lại.
- source_word: לְאַהֲרֹן וּלְבָנָיו
  choice: cho A-rôn và các con trai ông
  rationale: Đại từ sở hữu chỉ về A-rôn; cách diễn đạt này xác định rõ đây là các con trai của ông.
- source_word: עַל פִּי יְהוָה
  choice: theo lệnh của Yahweh
  rationale: Thành ngữ theo nghĩa đen là “theo miệng Yahweh”, nhưng trong ngữ cảnh diễn tả việc làm theo mệnh lệnh của Ngài.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời thay vì thay thế bằng một tước hiệu.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: đúng như Yahweh đã truyền cho Môi-se
  rationale: כַּאֲשֶׁר diễn tả sự tương ứng chính xác với mệnh lệnh đã ban trước đó; “đã truyền” phù hợp với trình tự tường thuật.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA hoặc CHÚA
  rationale: Bản Hê-bơ-rơ dùng trực tiếp danh giao ước יהוה; giữ “Yahweh” bảo tồn tính chất danh riêng mà không thay bằng tước hiệu.
- issue: Ý nghĩa của כֶּסֶף הַפְּדֻיִם
  choice: số bạc chuộc lại
  alternative: tiền chuộc hoặc bạc của những người được chuộc
  rationale: Ngữ cảnh các câu trước cho biết đây là khoản bạc thu để chuộc những người vượt quá số người Lê-vi; cách dịch không mở rộng thành một kết luận thần học ngoài văn cảnh.
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại. Dùng “số bạc” để giữ chất liệu được nguyên văn nêu rõ, “chuộc lại” để diễn đạt פדה dễ hiểu, và phiên âm các tên riêng theo lối quen thuộc trong tiếng Việt.
