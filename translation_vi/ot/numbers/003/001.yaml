id: NUM.3.1
reference: Numbers 3:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/אֵ֛לֶּה תּוֹלְדֹ֥ת אַהֲרֹ֖ן וּ/מֹשֶׁ֑ה בְּ/י֗וֹם דִּבֶּ֧ר יְהוָ֛ה אֶת מֹשֶׁ֖ה בְּ/הַ֥ר סִינָֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/001.yaml
  text: These are the generations of Aaron and Moses at the time when Yahweh spoke with Moses on Mount Sinai[a][b][c].
translation:
  language: vi
  text: Đây là các thế hệ của A-rôn và Môi-se[a] vào thời[c] Yahweh phán với Môi-se[b] trên núi Si-nai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “dòng dõi của A-rôn và Môi-se.” Từ Hê-bơ-rơ dùng ở đây là một công thức tiêu đề, có thể giới thiệu một dòng họ hoặc những gì phát xuất từ một người.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “phán cho Môi-se.”'
    reason: alternative_reading
  - marker: c
    text: Cụm “vào thời” dịch một thành ngữ Hê-bơ-rơ có nghĩa đen là “trong ngày khi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Đây là
  rationale: Mở đầu một phần mới bằng công thức chỉ định tự nhiên trong tiếng Việt; không cần dịch cứng liên từ וְ.
- source_word: תּוֹלְדֹת
  choice: các thế hệ
  rationale: Giữ nét trang trọng và độ rộng nghĩa của công thức tiêu đề Hê-bơ-rơ, có thể chỉ các thế hệ, dòng dõi hoặc điều phát xuất từ một người; tránh thu hẹp ngay thành “con cháu” khi nguyên văn nêu cả A-rôn lẫn Môi-se.
- source_word: אַהֲרֹן וּמֹשֶׁה
  choice: A-rôn và Môi-se
  rationale: Dùng dạng tên riêng quen thuộc trong tiếng Việt và giữ nguyên cả hai nhân vật như bản Hê-bơ-rơ.
- source_word: בְּיוֹם
  choice: vào thời
  rationale: Diễn đạt tự nhiên thành ngữ Hê-bơ-rơ có nghĩa “vào lúc/khi”, thay vì dịch máy móc là “trong ngày”.
- source_word: דִּבֶּר ... אֶת־מֹשֶׁה
  choice: phán với Môi-se
  rationale: Động từ דבר trong ngữ cảnh lời phán của Đức Chúa Trời được diễn đạt trang trọng là “phán”; cấu trúc với אֶת cho phép hiểu Môi-se là người cùng/được phán, nên “phán với” giữ sắc thái của nguyên văn, trong khi “phán cho” cũng có thể dùng.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm trực tiếp danh riêng giao ước trong nguyên văn, không thay bằng một tước hiệu.
- source_word: בְּהַר סִינָי
  choice: trên núi Si-nai
  rationale: Cách diễn đạt địa lý tự nhiên, chính xác và quen thuộc trong tiếng Việt.
theological_decisions:
- issue: Cách dịch danh YHWH (יְהוָה)
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA; CHÚA
  rationale: Nguyên văn dùng danh riêng của Đức Chúa Trời; giữ “Yahweh” bảo toàn danh ấy thay vì thay bằng tước hiệu hoặc chọn một cách phiên âm truyền thống khác.
- issue: Phạm vi nghĩa của תּוֹלְדֹת khi tiêu đề nêu cả A-rôn và Môi-se
  choice: Giữ cách nói rộng “các thế hệ của A-rôn và Môi-se”
  alternative: dòng dõi của A-rôn và Môi-se; gia phả của A-rôn và Môi-se
  rationale: Phần tiếp theo tập trung vào các con trai A-rôn, nhưng tiêu đề Hê-bơ-rơ vẫn nêu cả Môi-se. Bản dịch không âm thầm giải quyết sự căng thẳng này bằng cách lược bỏ Môi-se hay thu hẹp nghĩa.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ cấu trúc tiêu đề hơi mang tính công thức của nguyên văn qua “Đây là các thế hệ”, đồng thời dùng “vào thời” để tránh lối dịch cứng. Các dấu chú thích [a], [b], [c] đều xuất hiện trong câu chính.
