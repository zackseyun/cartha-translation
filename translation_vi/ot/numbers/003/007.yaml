  text: וְ/שָׁמְר֣וּ אֶת מִשְׁמַרְתּ֗/וֹ וְ/אֶת מִשְׁמֶ֨רֶת֙ כָּל הָ֣/עֵדָ֔ה לִ/פְנֵ֖י אֹ֣הֶל מוֹעֵ֑ד לַ/עֲבֹ֖ד אֶת עֲבֹדַ֥ת הַ/מִּשְׁכָּֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/007.yaml
  text: They shall keep his charge and the charge of the whole congregation before the tent of meeting, to perform the service of the tabernacle.
translation:
  language: vi
  text: Họ phải đảm trách nhiệm vụ của ông[a] và nhiệm vụ của toàn thể cộng đồng trước Lều Hội Kiến, để thi hành công việc phục vụ Đền Tạm.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Đảm trách nhiệm vụ của ông” cũng có thể dịch là “trông coi trách nhiệm của ông” hoặc “chu toàn nhiệm vụ của ông”. Cặp động từ và danh từ Hê-bơ-rơ nhấn mạnh trách nhiệm gìn giữ và trung thành thực hiện. Theo mạch văn gần nhất, “ông” chỉ A-rôn.
    reason: lexical_alternative
  - marker: b
    text: Người Lê-vi thực hiện những trách nhiệm liên quan đến A-rôn và toàn thể cộng đồng trong việc phục vụ tại nơi thánh.
    reason: cultural_note
lexical_decisions:
- source_word: וְשָׁמְרוּ אֶת־מִשְׁמַרְתּוֹ
  choice: Họ phải đảm nhận phần việc được giao cho ông
  rationale: Cặp động từ–danh từ từ gốc שׁמר diễn tả việc trung thành thực hiện trách nhiệm trông nom đã được giao. “Đảm nhận phần việc được giao” tự nhiên trong tiếng Việt hiện đại và không thu hẹp nghĩa vào việc canh gác thể chất.
- source_word: וְאֶת־מִשְׁמֶרֶת כָּל־הָעֵדָה
  choice: và phần việc của toàn thể cộng đồng
  rationale: Giữ sự song song với vế trước; עֵדָה trong Dân Số Ký chỉ cộng đồng dân Israel. Sở hữu cách có thể bao hàm trách nhiệm liên quan đến hoặc được thi hành thay cho cộng đồng.
- source_word: לִפְנֵי אֹהֶל מוֹעֵד
  choice: trước Lều Hội Kiến
  rationale: לִפְנֵי mang nghĩa không gian “trước”; “Lều Hội Kiến” là cách gọi rõ ràng, trang trọng cho אֹהֶל מוֹעֵד, nơi Đức Chúa Trời gặp dân qua người đại diện.
- source_word: לַעֲבֹד אֶת־עֲבֹדַת הַמִּשְׁכָּן
  choice: để thi hành công việc phục vụ Đền Tạm
  rationale: Cách dịch thể hiện cấu trúc mục đích và mối liên hệ cùng gốc giữa עבד với עֲבֹדָה mà không tạo lối diễn đạt gượng gạo. “Đền Tạm” là thuật ngữ quen thuộc cho מִשְׁכָּן trong bối cảnh hành trình nơi hoang mạc.
theological_decisions:
- issue: Đối tượng mà hậu tố ngôi ba số ít giống đực trong מִשְׁמַרְתּוֹ quy chiếu đến
  choice: Dùng “ông”, theo mạch văn gần nhất quy chiếu về A-rôn
  alternative: Có thể hiểu rộng hơn là trách nhiệm trông nom nơi thánh hoặc nhiệm vụ tư tế nói chung
  rationale: Dân Số Ký 3:6 giao người Lê-vi cho A-rôn để phục vụ ông, nên A-rôn là tiền ngữ tự nhiên nhất; đại từ “ông” giữ nguyên mức độ minh nhiên của bản Hê-bơ-rơ thay vì chèn tên A-rôn vào câu.
- issue: Quan hệ giữa người Lê-vi và phần việc của toàn thể cộng đồng
  choice: Giữ cụm “phần việc của toàn thể cộng đồng” trong chính văn và giải thích rằng người Lê-vi thi hành trách nhiệm liên quan đến cộng đồng tại nơi thánh
  alternative: Dịch diễn giải là “thay mặt toàn thể cộng đồng”
  rationale: Cấu trúc Hê-bơ-rơ không nói minh nhiên “thay mặt”; giữ sở hữu cách bảo toàn độ mở của câu, còn chú thích cung cấp bối cảnh mà không biến suy luận thành chính văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Bản dịch tránh từ Hán-Việt quá chuyên biệt như “phận sự”, nhưng vẫn duy trì sắc thái trách nhiệm thánh và sự song song của hai cụm מִשְׁמֶרֶת. Mọi dấu chú thích đều xuất hiện trong chính văn.
