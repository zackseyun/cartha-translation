  yaml_path: translation/ot/numbers/003/017.yaml
  text: 'These were the sons of Levi by their names: Gershon[a], Kohath, and Merari.'
translation:
  language: vi
  text: 'Tên các con trai của Lê-vi là: Ghẹt-sôn, Kê-hát và Mê-ra-ri.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ אֵלֶּה
  choice: Đây là
  rationale: Trong công thức mở đầu danh sách gia phả, tổ hợp này tự nhiên nhất trong tiếng Việt là “Đây là”, không hàm ý sự biến đổi trạng thái.
- source_word: בְנֵי לֵוִי
  choice: các con trai của Lê-vi
  rationale: Ba người được kể là các con trai trực tiếp của Lê-vi; cách dịch này giữ đúng giới tính và quan hệ gia phả trong nguyên văn.
- source_word: בִּשְׁמֹתָם
  choice: kể theo tên họ
  rationale: Giữ ý “theo/bằng tên của họ” đồng thời diễn đạt tự nhiên trong tiếng Việt như một công thức dẫn vào danh sách tên.
- source_word: גֵּרְשׁוֹן
  choice: Ghẹt-sôn
  rationale: Phiên âm tên riêng Hê-bơ-rơ sang dạng dễ đọc, quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
- source_word: קְהָת
  choice: Kê-hát
  rationale: Phiên âm tên riêng theo cách dùng phổ biến trong Kinh Thánh tiếng Việt.
- source_word: מְרָרִי
  choice: Mê-ra-ri
  rationale: Phiên âm tên riêng theo cách dùng phổ biến trong Kinh Thánh tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và rõ ràng; giữ cấu trúc công thức gia phả nhưng tránh lối diễn đạt gượng. Không cần chú thích vì “kể theo tên họ” truyền đạt trực tiếp sắc thái của בִּשְׁמֹתָם.
