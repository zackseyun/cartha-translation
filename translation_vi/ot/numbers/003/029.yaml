    rationale: “Lều Hội Kiến” thường dịch thuật ngữ Hê-bơ-rơ אֹהֶל מוֹעֵד. Dù hai thuật ngữ có thể cùng chỉ khu vực thánh trong một số ngữ cảnh, chúng không đồng nhất về từ vựng; chú thích này dễ che khuất sự phân biệt của nguyên văn. Vì không cần chú thích để dịch câu, nên bỏ chú thích và ký hiệu neo.
