  register: Bản dịch dùng tiếng Việt hiện đại, trang trọng và dễ hiểu. “Thị tộc” phù hợp bối cảnh tổ chức thân tộc; “con cháu” làm rõ đây là hậu duệ chứ không chỉ các con trai trực tiếp. Dấu chân chú [a] được đặt ngay sau “Đền Tạm”.
