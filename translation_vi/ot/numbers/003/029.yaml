  text: The clans of the sons of Kohath shall camp on the south side of the tabernacle[a].
translation:
  language: vi
  text: Các thị tộc của con cháu Kê-hát phải đóng trại ở phía nam của Đền Tạm.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִשְׁפְּחֹת
  choice: các thị tộc
  rationale: Trong bối cảnh kiểm kê và sắp xếp trại quân theo chi tộc, từ này chỉ các đơn vị thân tộc rộng hơn gia đình trực hệ; “thị tộc” vừa chính xác vừa tự nhiên trong tiếng Việt hiện đại.
- source_word: בְּנֵי קְהָת
  choice: con cháu Kê-hát
  rationale: Cụm Hê-bơ-rơ có nghĩa đen là “các con trai của Kê-hát”, nhưng tại đây nói về các nhóm hậu duệ thuộc dòng Kê-hát; “con cháu Kê-hát” truyền đạt rõ quan hệ huyết thống mà không giới hạn vào thế hệ con trực tiếp.
- source_word: יַחֲנוּ
  choice: phải đóng trại
  rationale: Dạng chưa hoàn thành ở đây diễn tả sự sắp đặt mang tính quy định; “phải đóng trại” thể hiện nghĩa chỉ thị tự nhiên hơn “sẽ đóng trại” trong tiếng Việt.
- source_word: עַל יֶרֶךְ
  choice: ở phía
  rationale: Cụm giới từ và danh từ xác định vị trí bên cạnh hay về một phía của Đền Tạm; “ở phía” là cách diễn đạt địa điểm rõ ràng, tự nhiên.
- source_word: הַמִּשְׁכָּן
  choice: Đền Tạm
  rationale: Trong Dân Số Ký, từ này chỉ nơi ngự thánh bằng lều; “Đền Tạm” là thuật ngữ tiếng Việt quen thuộc, trang trọng và phân biệt với một nơi ở thông thường.
- source_word: תֵּימָנָה
  choice: nam
  rationale: Dạng chỉ hướng xác định vị trí về phương nam; kết hợp thành “ở phía nam” vừa sát nghĩa vừa tự nhiên.
