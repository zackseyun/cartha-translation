  text: And you shall give the silver to Aaron and to his sons as the redemption price for those among them who are in excess[a].
translation:
  language: vi
  text: Ngươi hãy trao số bạc ấy cho A-rôn và các con trai ông, làm giá chuộc cho những người còn dư ra trong số đó.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc, theo sát cấu trúc hơn: “cho những người được chuộc thuộc số những người dư ra trong số họ.” Tiếng Hê-bơ-rơ ghép ý này cô đọng trong một cấu trúc liên kết danh từ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּה
  choice: Ngươi phải trao
  rationale: Dạng Qal hoàn thành ngôi hai số ít kèm liên từ, trong mạch chỉ thị, mang nghĩa mệnh lệnh tiếp nối. “Phải trao” tự nhiên trong tiếng Việt và giữ sắc thái bắt buộc.
- source_word: הַכֶּסֶף
  choice: số bạc ấy
  rationale: כֶּסֶף nghĩa đen là bạc và theo nghĩa mở rộng là tiền. Trong bối cảnh khoản chuộc đã được xác định, “số bạc ấy” vừa sát nguyên ngữ vừa liên kết tự nhiên với câu trước.
- source_word: לְאַהֲרֹן וּלְבָנָיו
  choice: cho A-rôn và các con trai ông
  rationale: Giữ rõ cả người nhận là A-rôn và các con trai ông; “các con trai” phù hợp với đối tượng tư tế nam cụ thể trong văn cảnh.
- source_word: פְּדוּיֵי
  choice: làm giá chuộc cho
  rationale: Dạng số nhiều liên kết của פדה có thể chỉ những người được chuộc hoặc khoản chuộc gắn với họ. Vì “số bạc” là tân ngữ, cách diễn đạt này truyền đạt tự nhiên chức năng của khoản bạc mà không xóa bỏ hoàn toàn cấu trúc cô đọng của tiếng Hê-bơ-rơ.
- source_word: הָעֹדְפִים
  choice: những người vượt quá số
  rationale: Phân từ của עודף chỉ những người dư ra so với con số tương ứng, tức số con đầu lòng vượt quá số người Lê-vi. “Vượt quá số” diễn đạt chính xác logic kiểm đếm.
- source_word: בָּהֶם
  choice: trong vòng họ
  rationale: Giới từ ב kèm đại từ ở đây biểu thị những người dư ra ở trong nhóm đã được nhắc đến. “Trong vòng họ” giữ quan hệ ấy và có sắc thái trang trọng, dễ hiểu.
