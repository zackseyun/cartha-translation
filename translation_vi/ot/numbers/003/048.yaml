translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ngươi” vì lời chỉ thị trực tiếp ở ngôi hai số ít; giữ “bạc” thay vì khái quát thành “tiền”, và dùng “giá chuộc” để làm rõ chức năng của khoản bạc trong văn cảnh.
