revisions:
- from: Ngươi phải trao số bạc ấy cho A-rôn và các con trai ông, làm giá chuộc cho những người vượt quá số trong vòng họ.[a]
  to: Ngươi hãy trao số bạc ấy cho A-rôn và các con trai ông, làm giá chuộc cho những người còn dư ra trong số đó.[a]
  rationale: Sửa cụm chỉ nhóm người dư ra để diễn đạt tự nhiên hơn và tránh quy chiếu mơ hồ, đồng thời vẫn giữ cách hiểu ngữ cảnh rằng số bạc là giá chuộc liên quan đến những con đầu lòng vượt quá số người Lê-vi. Chú thích bảo lưu cách đọc sát hình thức của cụm Hê-bơ-rơ vốn cô đọng.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T08:37:08Z'
review_pass:
  verdict: revise
  source_fidelity: Bản dịch truyền đạt đúng mệnh lệnh trao bạc cho A-rôn và các con trai ông, cùng chức năng của khoản bạc liên hệ đến số người dư ra. Tuy nhiên, “trong vòng họ” đặt sau “những người vượt quá số” có quy chiếu không rõ và không diễn đạt tự nhiên quan hệ בָּהֶם (“trong số họ/trong số đó”).
  naturalness: “Những người vượt quá số trong vòng họ” hơi gượng trong tiếng Việt hiện đại. “Những người còn dư ra trong số đó” rõ nghĩa và tự nhiên hơn, vẫn dựa vào bối cảnh trước để xác định nhóm được đếm.
  terminology: Giữ “bạc,” “A-rôn,” “các con trai ông,” và “giá chuộc” là phù hợp. “Ngươi hãy trao” giữ giọng chỉ thị trực tiếp, trang trọng mà bớt nặng tính ép buộc hơn “phải trao.”
  issues:
  - severity: medium
    issue: Cụm “trong vòng họ” mơ hồ và thiếu tự nhiên.
    rationale: Đại từ “họ” có thể bị hiểu là A-rôn và các con trai ông, thay vì nhóm người được đếm; đồng thời “trong vòng họ” không phải cách diễn đạt thông dụng nhất cho quan hệ “among them” trong cấu trúc này.
  - severity: low
    issue: Chú thích dùng “chuỗi liên kết danh từ” chưa thật chuẩn để mô tả cấu trúc Hê-bơ-rơ.
    rationale: Cụm מקור gồm một cấu trúc liên kết/construct chain, nhưng cách chú thích nên nêu rõ đây là lối ghép cô đọng và tránh làm câu dịch sát trở nên khó hiểu hơn cần thiết.
  revised_text: Ngươi hãy trao số bạc ấy cho A-rôn và các con trai ông, làm giá chuộc cho những người còn dư ra trong số đó.[a]
