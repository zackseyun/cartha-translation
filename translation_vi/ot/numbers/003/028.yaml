base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/028.yaml
  text: By the number of every male from a month old and upward[a], there were eight thousand six hundred, keeping charge of the holy place.
translation:
  language: vi
  text: Theo số kiểm kê, tổng số nam giới từ một tháng tuổi trở lên là tám nghìn sáu trăm người; họ được giao nhiệm vụ coi giữ nơi thánh[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “các vật thánh.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּמִסְפַּר
  choice: Theo số đếm
  rationale: Giữ công thức kiểm kê dân số do giới từ בְּ kết hợp với מִסְפַּר, đồng thời diễn đạt tự nhiên trong tiếng Việt.
- source_word: כָּל זָכָר
  choice: tất cả nam giới
  rationale: Thể hiện đầy đủ phạm vi của כָּל và đối tượng nam được nêu rõ trong bản nguồn.
- source_word: מִבֶּן חֹדֶשׁ וָמָעְלָה
  choice: từ một tháng tuổi trở lên
  rationale: Đây là cách diễn đạt tự nhiên và chính xác ngưỡng tuổi trong công thức kiểm kê của sách Dân Số.
- source_word: שְׁמֹנַת אֲלָפִים וְשֵׁשׁ מֵאוֹת
  choice: tám nghìn sáu trăm người
  rationale: Chuyển đúng số lượng 8.600; thêm đơn vị 'người' để câu tiếng Việt rõ và tự nhiên.
- source_word: שֹׁמְרֵי מִשְׁמֶרֶת
  choice: có trách nhiệm trông coi
  rationale: Diễn đạt thành ngữ Hê-bơ-rơ gồm phân từ và danh từ cùng trường nghĩa, nhấn mạnh nhiệm vụ được giao và được thực hiện thường xuyên.
- source_word: הַקֹּדֶשׁ
  choice: nơi thánh
  rationale: Giữ sắc thái chỉ phạm vi thiêng thánh trong ngữ cảnh Lê-vi, nhưng không loại bỏ khả năng từ này chỉ các vật thánh.
theological_decisions:
- issue: Đối tượng của הַקֹּדֶשׁ
  choice: nơi thánh
  alternative: các vật thánh
  rationale: Trong ngữ cảnh nhiệm vụ của người Kê-hát, danh từ có thể chỉ nơi/thánh sở hoặc những vật dụng thiêng thánh. Bản chính chọn cách hiểu không gian, còn chú thích giữ lại khả năng chỉ các vật thánh.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dấu chấm phẩy làm rõ rằng mệnh đề cuối mô tả trách nhiệm của nhóm tám nghìn sáu trăm người, không phải một số liệu kiểm kê mới.
