  to: Theo số kiểm kê, tổng số nam giới từ một tháng tuổi trở lên là tám nghìn sáu trăm người; họ được giao nhiệm vụ coi giữ nơi thánh[a].
  rationale: Chỉnh nhẹ công thức kiểm kê và cách diễn đạt chức trách để sát tiếng Hê-bơ-rơ hơn, đồng thời đặt lại ký hiệu chú thích ngay sau “nơi thánh” để mỏ neo chú thích rõ ràng. Nghĩa thay thế của הַקֹּדֶשׁ được duy trì, không quyết đoán vượt quá điều văn mạch cho phép.
