  source_fidelity: Bản dịch chuyển tải đúng công thức kiểm kê, giới hạn tuổi, con số 8.600 và nhiệm vụ liên tục được giao cho nhóm Lê-vi. “Nơi thánh” là một cách hiểu có cơ sở cho הַקֹּדֶשׁ trong ngữ cảnh này; chú thích hợp lý giữ khả năng hiểu là “các vật thánh.”
  naturalness: Câu hiện có nhìn chung tự nhiên. “Theo số kiểm kê” và “được giao nhiệm vụ coi giữ” rõ hơn trong văn phong Việt hiện đại, đồng thời diễn đạt sát hơn sắc thái kiểm kê và nhiệm vụ được ủy thác.
  terminology: “Nam giới,” “từ một tháng tuổi trở lên,” và “nơi thánh” phù hợp. “Coi giữ” diễn đạt tốt cụm שֹׁמְרֵי מִשְׁמֶרֶת mà không biến nó thành một khẳng định chuyên biệt hơn mức bản nguồn.
