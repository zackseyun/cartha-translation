  source_fidelity: 'Bản dịch truyền đạt đúng cấu trúc và nội dung Hê-bơ-rơ: công thức giới thiệu danh sách, “tên các con trai của Ghẹt-sôn,” sự phân chia “theo các thị tộc của họ,” và hai tên Líp-ni, Si-mê-i. Việc không dịch riêng liên từ mở đầu וְ là tự nhiên trong tiếng Việt và không làm mất ý nghĩa thiết yếu.'
