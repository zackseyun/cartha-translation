  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/אֵ֛לֶּה שְׁמ֥וֹת בְּֽנֵי גֵרְשׁ֖וֹן לְ/מִשְׁפְּחֹתָ֑/ם לִבְנִ֖י וְ/שִׁמְעִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/018.yaml
  text: 'And these are the names of the sons of Gershon by their clans: Libni and Shimei.'
translation:
  language: vi
  text: 'Đây là tên các con trai của Ghẹt-sôn, theo các thị tộc của họ: Líp-ni và Si-mê-i.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אֵלֶּה
  choice: Đây là
  rationale: Cụm từ mở đầu một danh sách. Tiếng Việt tự nhiên có thể lược sắc thái nối tiếp của וְ, vì văn cảnh đã thể hiện sự tiếp nối, đồng thời vẫn giữ chức năng giới thiệu danh sách.
- source_word: שְׁמוֹת
  choice: tên
  rationale: Danh từ ở dạng liên kết với cụm theo sau; cấu trúc tiếng Việt “tên các con trai của...” truyền đạt quan hệ sở hữu một cách tự nhiên.
- source_word: בְּנֵי גֵרְשׁוֹן
  choice: các con trai của Ghẹt-sôn
  rationale: בְּנֵי có nghĩa cụ thể là “các con trai”; câu này liệt kê hai người nam nên không cần dùng từ rộng hơn như “con cháu”.
- source_word: לְ/מִשְׁפְּחֹתָ/ם
  choice: theo các thị tộc của họ
  rationale: Trong bối cảnh kiểm kê và gia phả, מִשְׁפָּחָה chỉ đơn vị họ hàng lớn hơn gia đình hạt nhân; “thị tộc” giữ được ý nghĩa tổ chức của từ và giới từ לְ.
- source_word: לִבְנִי
  choice: Líp-ni
  rationale: Phiên âm tên riêng theo âm tiết Hê-bơ-rơ, có dấu thanh và gạch nối để người Việt dễ đọc.
- source_word: וְ/שִׁמְעִי
  choice: và Si-mê-i
  rationale: Giữ liên từ וְ trong danh sách và phiên âm tên riêng theo cách dễ đọc trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và rõ ràng; dùng “thị tộc” thay vì “gia đình” để phù hợp bối cảnh cơ cấu gia phả của dân Y-sơ-ra-ên.
