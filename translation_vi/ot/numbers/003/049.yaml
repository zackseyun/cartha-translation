revisions:
- from: Môi-se thu tiền chuộc từ những người dôi ra ngoài số người được người Lê-vi chuộc thay[a][b].
  to: Môi-se lấy tiền chuộc từ những người dôi ra ngoài số người được chuộc bằng người Lê-vi[a][b].
  rationale: Sửa “thu” thành “lấy” để theo sát động từ tường thuật Hê-bơ-rơ. Sửa cụm về người Lê-vi thành “được chuộc bằng người Lê-vi” để phản ánh chức năng thay thế trong văn cảnh mà không áp đặt quan hệ tác nhân vốn không được cấu trúc liên kết xác định đầy đủ. Cập nhật hai chú thích để nhất quán với bản văn sửa và với giá trị từ vựng của “bạc/tiền.”
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T08:37:10Z'
review_pass:
  verdict: revise
  source_fidelity: Cần chỉnh nhẹ để sát hơn với וַיִּקַּח, vốn là “lấy,” và để không giải quyết quá mức quan hệ còn cô đọng trong cụm פְּדוּיֵי הַלְוִיִּם. “Được người Lê-vi chuộc thay” diễn giải người Lê-vi như tác nhân trực tiếp chuộc, trong khi nguyên văn dùng cấu trúc liên kết và văn cảnh nói đến sự thay thế bằng người Lê-vi.
  naturalness: Bản sửa vẫn dùng tiếng Việt hiện đại, trang trọng và rõ nghĩa. “Dôi ra ngoài số” là cách nói tự nhiên cho phần vượt quá trong phép đếm; “được chuộc bằng người Lê-vi” nêu sự thay thế mà không gán hành động trực tiếp quá cụ thể cho người Lê-vi.
  terminology: Giữ “tiền chuộc” cho כֶּסֶף הַפִּדְיוֹם. Chú thích từ vựng nên nêu “bạc chuộc” thay vì “tiền giá chuộc,” vì lựa chọn này phản ánh trực tiếp nghĩa đen của כֶּסֶף. Giữ Môi-se và người Lê-vi theo cách viết tên riêng hiện hành.
  issues:
  - severity: medium
    issue: “thu” làm cụ thể hóa động từ וַיִּקַּח.
    rationale: Động từ nguyên văn có nghĩa cơ bản là “lấy”; trong ngữ cảnh có thể hiểu là nhận/thu, nhưng “lấy” bảo toàn cách kể trực tiếp của nguồn tốt hơn.
  - severity: medium
    issue: “được người Lê-vi chuộc thay” giải thích quá mức cụm פְּדוּיֵי הַלְוִיִּם.
    rationale: Cấu trúc nguyên văn không trực tiếp xác định người Lê-vi là tác nhân thực hiện việc chuộc. Văn cảnh cho thấy họ được dùng làm vật/thành phần thay thế trong sự chuộc, nên “được chuộc bằng người Lê-vi” gần hơn mà vẫn dễ hiểu.
  - severity: low
    issue: Chú thích [a] chưa nêu lựa chọn từ vựng thực sự phân biệt với bản văn chính.
    rationale: “Tiền giá chuộc” gần như chỉ là biến thể phong cách của “tiền chuộc”; “bạc chuộc” phản ánh nghĩa đen của כֶּסֶף và là lựa chọn chú thích hữu ích hơn.
