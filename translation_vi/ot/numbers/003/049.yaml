source:
  edition: WLC
  text: וַ/יִּקַּ֣ח מֹשֶׁ֔ה אֵ֖ת כֶּ֣סֶף הַ/פִּדְי֑וֹם מֵ/אֵת֙ הָ/עֹ֣דְפִ֔ים עַ֖ל פְּדוּיֵ֥י הַ/לְוִיִּֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/049.yaml
  text: And Moses took the redemption money from those who were in excess over those redeemed by the Levites[a][b].
translation:
  language: vi
  text: Môi-se lấy tiền chuộc từ những người dôi ra ngoài số người được chuộc bằng người Lê-vi[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “bạc chuộc”. Từ Hê-bơ-rơ có thể chỉ bạc, tức khoản tiền được nộp để chuộc.'
    reason: lexical_alternative
  - marker: b
    text: Tức là từ những con đầu lòng của dân Y-sơ-ra-ên có số lượng vượt quá số người Lê-vi được dùng trong việc chuộc.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּקַּח
  choice: thu
  rationale: Động từ לקח cơ bản là “lấy”; trong ngữ cảnh thu khoản tiền đã ấn định, “thu” tự nhiên trong tiếng Việt mà vẫn diễn đạt hành động Môi-se nhận lấy tiền.
- source_word: כֶּסֶף הַפִּדְיוֹם
  choice: tiền chuộc
  rationale: כֶּסֶף chỉ bạc/tiền, còn פִּדְיוֹם là khoản dùng để chuộc. “Tiền chuộc” gọn, tự nhiên và giữ sắc thái pháp lý-nghi lễ; “bạc chuộc” sát hình thức hơn nhưng kém tự nhiên.
- source_word: מֵאֵת
  choice: từ
  rationale: Giới từ này đánh dấu nguồn mà Môi-se thu tiền; “từ” truyền đạt đủ ý, không cần thêm thành ngữ “từ tay”.
- source_word: הָעֹדְפִים
  choice: những người dôi ra
  rationale: Phân từ của עודף chỉ những người vượt quá một số lượng đối chiếu. “Dôi ra” giữ ý số người dư theo phép đếm mà không tự ý chèn danh từ “con đầu lòng” vào câu chính.
- source_word: עַל
  choice: ngoài số
  rationale: Trong cấu trúc này עַל biểu thị phần vượt quá so với nhóm được tính tương ứng; “ngoài số” diễn đạt quan hệ số lượng rõ ràng trong tiếng Việt.
- source_word: פְּדוּיֵי הַלְוִיִּם
  choice: số người được người Lê-vi chuộc thay
  rationale: Cụm phân từ bị động ở dạng liên kết với “người Lê-vi” có thể chỉ những người được tính là đã được chuộc nhờ sự thay thế của người Lê-vi. “Chuộc thay” làm rõ bối cảnh thay thế trong đoạn, nhưng không biến người Lê-vi thành người trực tiếp trả khoản tiền này.
theological_decisions:
- issue: Quan hệ của “người Lê-vi” với “những người được chuộc” trong cụm פְּדוּיֵי הַלְוִיִּם
  choice: được người Lê-vi chuộc thay
  alternative: những người được chuộc của người Lê-vi
  rationale: Dạng liên kết Hê-bơ-rơ không tự nó xác định hoàn toàn quan hệ. Văn cảnh 3:40–48 cho thấy người Lê-vi được nhận thay cho các con đầu lòng Y-sơ-ra-ên; bản dịch diễn đạt chức năng thay thế này, còn chú thích giải thích phạm vi đếm để tránh hiểu rằng người Lê-vi trực tiếp nộp tiền.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ tên riêng “Môi-se” và cách gọi tập thể “người Lê-vi”. Cụm “dôi ra ngoài số” phản ánh phép đối chiếu số lượng trong nguyên văn; hai dấu chú thích [a][b] đều được đặt trong câu chính.
