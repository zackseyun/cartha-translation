  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה פְּקֹ֨ד כָּל בְּכֹ֤ר זָכָר֙ לִ/בְנֵ֣י יִשְׂרָאֵ֔ל מִ/בֶּן חֹ֖דֶשׁ וָ/מָ֑עְלָ/ה וְ/שָׂ֕א אֵ֖ת מִסְפַּ֥ר שְׁמֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/040.yaml
  text: Then Yahweh said to Moses[a], “Count every firstborn male among the sons of Israel from a month old and upward, and take the number of their names.”
translation:
  language: vi
  text: 'Rồi Đức Giê-hô-va phán với Môi-se: “Hãy kiểm đếm mọi con trai đầu lòng trong dân Y-sơ-ra-ên, từ một tháng tuổi trở lên, và lập danh sách từng người.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát chữ: “hãy lấy số tên của họ”; cũng có thể hiểu là “hãy đếm họ theo tên.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng cách gọi quen thuộc, trang trọng trong tiếng Việt để biểu thị danh riêng YHWH, không thay bằng danh xưng chung “Chúa”.
- source_word: וַיֹּאמֶר
  choice: Rồi ... phán
  rationale: “Rồi” thể hiện diễn tiến của mạch kể do waw liên tiếp; “phán” là cách diễn đạt tự nhiên và trang trọng khi Đức Chúa Trời nói.
- source_word: פְּקֹד
  choice: Hãy kiểm đếm
  rationale: Trong ngữ cảnh điều tra dân số, động từ chỉ việc đếm có hệ thống; “kiểm đếm” rõ nghĩa hơn “kiểm kê” khi đối tượng là người.
- source_word: כָּל בְּכֹר זָכָר
  choice: mọi con trai đầu lòng
  rationale: Giữ cả ý “đầu lòng” và giới tính nam được זָכָר xác định, đồng thời dùng cách nói tự nhiên trong tiếng Việt.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: trong dân Y-sơ-ra-ên
  rationale: Trong ngữ cảnh thống kê, לְ có nghĩa xác định phạm vi “trong/thuộc”; cách dịch này tự nhiên và không khiến cụm từ bị hiểu là chỉ các con trai, vốn đã được xác định ở phía trước.
- source_word: מִבֶּן חֹדֶשׁ וָמָעְלָה
  choice: từ một tháng tuổi trở lên
  rationale: Diễn đạt chính xác ngưỡng tuổi tối thiểu bằng thành ngữ tiếng Việt hiện đại.
- source_word: וְשָׂא אֵת מִסְפַּר שְׁמֹתָם
  choice: và lập danh sách từng người
  rationale: Đây là lối nói Hê-bơ-rơ về việc xác lập con số theo tên; bản dịch chuyển tải tự nhiên ý mỗi người được ghi nhận theo tên, còn nghĩa sát chữ được bảo lưu trong chú thích.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu mệnh lệnh giữ nhịp kể Kinh Thánh; danh riêng dùng dạng phiên âm quen thuộc trong tiếng Việt. Dấu chú thích [a] được đặt ngay sau mệnh đề mà chú thích giải thích.
