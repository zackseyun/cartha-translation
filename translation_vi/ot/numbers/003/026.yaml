  text: וְ/קַלְעֵ֣י הֶֽ/חָצֵ֗ר וְ/אֶת מָסַךְ֙ פֶּ֣תַח הֶֽ/חָצֵ֔ר אֲשֶׁ֧ר עַל הַ/מִּשְׁכָּ֛ן וְ/עַל הַ/מִּזְבֵּ֖חַ סָבִ֑יב וְ/אֵת֙ מֵֽיתָרָ֔י/ו לְ/כֹ֖ל עֲבֹדָתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/026.yaml
  text: and the hangings of the court[a], and the screen for the entrance of the court that is around the tabernacle and the altar, and its ropes[b], for all its service.
translation:
  language: vi
  text: cùng các tấm màn của sân[a] bao quanh Đền Tạm và bàn thờ, màn che lối vào sân, các dây chằng của sân[b], và mọi công việc phục vụ của sân ấy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “các rèm của sân.”'
    reason: lexical_alternative
  - marker: b
    text: Hay “các dây thừng của sân.”
    reason: lexical_alternative
lexical_decisions:
- source_word: קַלְעֵי
  choice: các tấm màn
  rationale: Chỉ những tấm vải tạo thành vòng bao quanh sân. “Tấm màn” tự nhiên, dễ hiểu và vẫn phân biệt được với tấm màn che riêng ở lối vào.
- source_word: חָצֵר
  choice: sân
  rationale: Chỉ khu vực có rào bao quanh Đền Tạm. “Sân” là cách nói gọn, tự nhiên trong tiếng Việt; ngữ cảnh cho thấy đây là sân của nơi thánh.
- source_word: מָסַךְ
  choice: tấm màn che
  rationale: Trong ngữ cảnh Đền Tạm, từ này chỉ tấm vải chắn tại lối vào. “Màn che” diễn đạt rõ chức năng mà không gợi đến một cánh cổng cứng.
- source_word: פֶּתַח
  choice: lối vào
  rationale: Diễn đạt tự nhiên nghĩa cửa mở hoặc nơi ra vào, phù hợp với một tấm màn che.
- source_word: אֲשֶׁר עַל הַמִּשְׁכָּן וְעַל הַמִּזְבֵּחַ סָבִיב
  choice: bao quanh Đền Tạm và bàn thờ
  rationale: סָבִיב xác định quan hệ không gian của sân đối với cả Đền Tạm và bàn thờ; cách dịch này tự nhiên và không lặp “bao quanh” không cần thiết.
- source_word: מִשְׁכָּן
  choice: Đền Tạm
  rationale: Thuật ngữ quen thuộc trong tiếng Việt dành cho nơi thánh dạng lều của Israel trong hoang mạc.
- source_word: מִזְבֵּחַ
  choice: bàn thờ
  rationale: Tương đương tiêu chuẩn và rõ nghĩa trong ngữ cảnh tế lễ.
- source_word: מֵיתָרָיו
  choice: các dây chằng của sân
  rationale: “Dây chằng” diễn tả cụ thể những sợi dây dùng để giữ căng và cố định kết cấu bằng vải. Danh từ “sân” được lặp lại thay cho đại từ sở hữu khó hiểu trong tiếng Việt.
- source_word: לְכֹל עֲבֹדָתוֹ
  choice: cùng mọi công việc phục vụ liên quan đến các vật ấy
  rationale: עֲבֹדָה có thể chỉ công việc, sự phục vụ hoặc nhiệm vụ được giao. Cách dịch này giữ sắc thái phục vụ đồng thời làm rõ quan hệ với toàn bộ các vật vừa kể.
theological_decisions:
- issue: Phạm vi của cụm “bao quanh”
  choice: Hiểu sân là khu vực bao quanh cả Đền Tạm lẫn bàn thờ.
  alternative: Hiểu giới từ עַל theo nghĩa “ở cạnh” hoặc gắn cụm này hẹp hơn với lối vào sân.
  rationale: Vị trí của סָבִיב và bố cục Đền Tạm ủng hộ quan hệ bao quanh, nhưng bản dịch không thêm chi tiết hình học hay nghi lễ ngoài câu gốc.
- issue: Đối tượng của hậu tố số ít trong מֵיתָרָיו và עֲבֹדָתוֹ
  choice: Diễn đạt các dây chằng là của sân và công việc phục vụ là liên quan đến các vật vừa nêu.
  alternative: Giữ đại từ “của nó” và “việc phục vụ nó”, hoặc quy chiếu riêng về Đền Tạm.
  rationale: Hậu tố giống đực số ít trong tiếng Hê-bơ-rơ có thể tạo ra sự mơ hồ về quy chiếu. Tiếng Việt cần một cách diễn đạt dễ hiểu; ngữ cảnh danh mục nhiệm vụ của người Ghẹt-sôn cho phép hiểu tổng quát về sân và các vật dụng, nhưng không nên biến câu thành một khẳng định giáo lý.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại. Câu này tiếp nối danh sách từ câu trước nên giữ dạng một cụm liệt kê mở đầu bằng “cùng”. “Đền Tạm” được viết hoa như tên gọi quy ước của nơi thánh; các vật dụng thông thường không viết hoa.
