  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/לָקַחְתָּ֨ אֶת הַ/לְוִיִּ֥ם לִ/י֙ אֲנִ֣י יְהוָ֔ה תַּ֥חַת כָּל בְּכֹ֖ר בִּ/בְנֵ֣י יִשְׂרָאֵ֑ל וְ/אֵת֙ בֶּהֱמַ֣ת הַ/לְוִיִּ֔ם תַּ֣חַת כָּל בְּכ֔וֹר בְּ/בֶהֱמַ֖ת בְּנֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/041.yaml
  text: And you shall take the Levites for me—I am Yahweh—in place of every firstborn among the sons of Israel[a], and the livestock of the Levites in place of every firstborn among the livestock of the sons of Israel.
translation:
  language: vi
  text: Ngươi hãy lấy người Lê-vi cho Ta—Ta là Yahweh—thay cho mọi con trai đầu lòng trong số con trai của Israel, và lấy gia súc của người Lê-vi thay cho mọi con đầu lòng trong số gia súc của con trai Israel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: Ngươi phải nhận
  rationale: Dạng hoàn thành Qal ngôi hai số ít với liên từ, trong văn cảnh chỉ thị dành cho Môi-se, mang lực mệnh lệnh. “Phải nhận” tự nhiên trong tiếng Việt và giữ sắc thái quy định.
- source_word: הַלְוִיִּם
  choice: người Lê-vi
  rationale: Cách gọi quen thuộc trong tiếng Việt đối với tập thể thuộc chi phái Lê-vi; ý xác định được thể hiện theo ngữ cảnh.
- source_word: לִי
  choice: cho Ta
  rationale: Giới từ diễn tả sự thuộc về hoặc được biệt riêng; “cho Ta” truyền đạt tự nhiên ý dâng dành cho Đức Chúa Trời.
- source_word: אֲנִי יְהוָה
  choice: Ta là Yahweh
  rationale: Giữ công thức tự xưng nhấn mạnh và chuyển trực tiếp danh riêng YHWH.
- source_word: תַּחַת
  choice: thay cho
  rationale: Trong văn cảnh kiểm kê và thay thế, từ này chỉ sự thế chỗ, không phải vị trí ở bên dưới.
- source_word: כָּל בְּכֹר
  choice: mọi con đầu lòng
  rationale: כָּל đi với danh từ số ít có nghĩa phân phối; “mọi con đầu lòng” vừa sát nghĩa vừa tự nhiên.
- source_word: בִּבְנֵי יִשְׂרָאֵל
  choice: trong vòng các con trai Israel
  rationale: Giữ hình thức “các con trai Israel” của tiếng Hê-bơ-rơ, đồng thời dùng “trong vòng” để diễn đạt quan hệ thuộc phạm vi.
- source_word: בֶּהֱמַת הַלְוִיִּם
  choice: súc vật của người Lê-vi
  rationale: בְּהֵמָה chỉ chung gia súc hoặc động vật nuôi; “súc vật” phù hợp phạm vi rộng mà không thu hẹp vào một loài.
- source_word: כָּל בְּכוֹר בְּבֶהֱמַת בְּנֵי יִשְׂרָאֵל
  choice: mọi con đầu lòng trong đàn súc vật của các con trai Israel
  rationale: Giữ sự song hành với mệnh đề trước và làm rõ rằng đây là những con đầu lòng thuộc đàn vật nuôi của Israel.
theological_decisions:
- issue: Cách chuyển danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Bản nguồn dùng trực tiếp danh giao ước YHWH; phiên âm “Yahweh” bảo tồn tính chất danh riêng thay vì thay bằng một tước hiệu.
- issue: Cách chuyển בְּנֵי יִשְׂרָאֵל
  choice: các con trai Israel
  alternative: dân Israel / người Israel / con cái Israel
  rationale: Bản dịch chính giữ hình ảnh và hình thức giống đực số nhiều của nguyên văn; chú thích nêu cách diễn đạt theo nghĩa dân tộc tự nhiên hơn trong tiếng Việt.
translation_notes:
  register: Văn phong trang trọng, rõ ràng và mang sắc thái chỉ thị. Đại từ “Ngươi/Ta” phản ánh lời Đức Chúa Trời phán trực tiếp với Môi-se; cấu trúc song hành của hai sự thay thế được giữ lại.
