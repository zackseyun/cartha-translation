revisions:
- from: Ngươi phải nhận người Lê-vi cho Ta—Ta là Yahweh—thay cho mọi con đầu lòng trong vòng các con trai Israel[a], và nhận súc vật của người Lê-vi thay cho mọi con đầu lòng trong đàn súc vật của các con trai Israel.
  to: Ngươi hãy lấy người Lê-vi cho Ta—Ta là Yahweh—thay cho mọi con trai đầu lòng trong số con trai của Israel, và lấy gia súc của người Lê-vi thay cho mọi con đầu lòng trong số gia súc của con trai Israel.
  rationale: Bản sửa thay “nhận” bằng “lấy” theo nghĩa trực tiếp của לָקַח, làm rõ “con trai đầu lòng” ở mệnh đề đầu theo giống đực và ngữ cảnh, đồng thời điều chỉnh vài cụm từ sang cách diễn đạt tiếng Việt hiện đại hơn. Danh Yahweh, công thức “Ta là Yahweh,” tính song hành của hai sự thay thế, và chú thích về “con trai của Israel/dân Israel” đều được giữ.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T08:37:05Z'
review_pass:
  verdict: revise
  source_fidelity: 'Cần sửa động từ הראשוני: וְלָקַחְתָּ nghĩa là “hãy lấy,” không phải “nhận.” Ngoài ra, בְּכוֹר trong cụm đầu, “giữa các con trai của Israel,” là danh từ giống đực và trong ngữ cảnh kiểm kê này chỉ con trai đầu lòng; bản dịch nên thể hiện rõ điều đó. Cụm về gia súc được giữ ở nghĩa tập thể, không áp đặt giới tính cho con vật.'
  naturalness: “Hãy lấy” là lối mệnh lệnh trang trọng nhưng vẫn tự nhiên trong tiếng Việt hiện đại. “Trong số con trai của Israel” rõ hơn “trong vòng các con trai Israel”; “gia súc” hiện đại và trung tính hơn “súc vật/đàn súc vật.”
  terminology: Giữ “người Lê-vi,” “Yahweh,” và “thay cho” là phù hợp. “Con trai đầu lòng” phản ánh chính xác phạm vi nam tính của cụm đầu; “con đầu lòng trong số gia súc” giữ nghĩa của cụm thứ hai mà không suy diễn quá mức.
  issues:
  - severity: medium
    issue: “Ngươi phải nhận” dịch וְלָקַחְתָּ không chính xác.
    rationale: Động từ לָקַח là “lấy/đem lấy”; “nhận” có thể hàm ý tiếp nhận từ người khác và làm yếu hành động chỉ thị trực tiếp.
  - severity: medium
    issue: “Mọi con đầu lòng” ở mệnh đề thứ nhất không biểu thị giới tính nam của בְּכוֹר trong phạm vi “các con trai của Israel.”
    rationale: Ngữ cảnh Num 3:40–43 kiểm kê các con trai đầu lòng. “Mọi con trai đầu lòng” truyền đạt rõ phạm vi của nguyên văn mà không thêm ý.
  - severity: low
    issue: “Trong vòng các con trai Israel” và “đàn súc vật” kém tự nhiên trong tiếng Việt hiện đại.
    rationale: “Trong số con trai của Israel” và “gia súc” rõ, tự nhiên, và vẫn bảo toàn cấu trúc cùng quan hệ sở hữu/phạm vi của tiếng Hê-bơ-rơ.
  revised_text: Ngươi hãy lấy người Lê-vi cho Ta—Ta là Yahweh—thay cho mọi con trai đầu lòng trong số con trai của Israel, và lấy gia súc của người Lê-vi thay cho mọi con đầu lòng trong số gia súc của con trai Israel.
  revised_footnotes:
