  text: וְ/לָקַחְתָּ֗ חֲמֵ֧שֶׁת חֲמֵ֛שֶׁת שְׁקָלִ֖ים לַ/גֻּלְגֹּ֑לֶת בְּ/שֶׁ֤קֶל הַ/קֹּ֨דֶשׁ֙ תִּקָּ֔ח עֶשְׂרִ֥ים גֵּרָ֖ה הַ/שָּֽׁקֶל׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/047.yaml
  text: you shall take five shekels apiece[a], by the shekel of the sanctuary[b]; the shekel is twenty gerahs.
translation:
  language: vi
  text: Con phải thu năm siếc-lơ cho mỗi người[a], theo siếc-lơ của nơi thánh[b]; mỗi siếc-lơ bằng hai mươi ghê-ra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nghĩa đen: “năm siếc-lơ mỗi đầu người.”'
    reason: lexical_alternative
  - marker: b
    text: Tức là theo chuẩn trọng lượng dùng tại nơi thánh; một siếc-lơ bằng hai mươi ghê-ra.
    reason: cultural_note
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: Con phải thu
  rationale: Động từ Qal hoàn thành có liên từ, trong ngữ cảnh chỉ thị, mang ý nghĩa mệnh lệnh. “Con” phản ánh ngôi thứ hai số ít trong lời Đức Chúa Trời phán với Môi-se; “phải thu” tự nhiên trong ngữ cảnh thu khoản tiền chuộc.
- source_word: חֲמֵשֶׁת חֲמֵשֶׁת שְׁקָלִים
  choice: năm siếc-lơ cho mỗi người
  rationale: Việc lặp lại số từ “năm” biểu thị ý phân phối. Cách dịch này truyền đạt rõ mỗi người phải nộp cùng một khoản mà không sao chép máy móc cấu trúc Hê-bơ-rơ.
- source_word: לַגֻּלְגֹּלֶת
  choice: cho mỗi người
  rationale: Nghĩa đen là “cho mỗi đầu”, một thành ngữ chỉ từng cá nhân. Bản dịch chính dùng cách nói tiếng Việt tự nhiên; nghĩa đen được ghi ở chú thích.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: theo siếc-lơ của nơi thánh
  rationale: Cụm từ xác định chuẩn trọng lượng dùng tại nơi thánh. Cách dịch giữ được liên hệ thờ phượng trong nguyên văn, còn chú thích làm rõ đây là một chuẩn đo lường.
- source_word: תִּקָּח ... עֶשְׂרִים גֵּרָה הַשָּׁקֶל
  choice: mỗi siếc-lơ bằng hai mươi ghê-ra
  rationale: Dù תִּקָּח về hình thức là động từ ngôi hai số ít, toàn cụm trong ngữ cảnh giải thích giá trị của siếc-lơ. Cách diễn đạt này tái hiện quan hệ tương đương trọng lượng bằng tiếng Việt rõ ràng.
- source_word: עֶשְׂרִים גֵּרָה
  choice: hai mươi ghê-ra
  rationale: Giữ lại tên đơn vị trọng lượng Hê-bơ-rơ dưới dạng phiên âm tiếng Việt.
theological_decisions: []
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “con” vì lời này trực tiếp nói với Môi-se ở ngôi thứ hai số ít; dùng “thu” thay vì “lấy” để phù hợp với khoản tiền chuộc. Các đơn vị cổ được phiên âm là “siếc-lơ” và “ghê-ra”.
