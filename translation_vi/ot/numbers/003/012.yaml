language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/אֲנִ֞י הִנֵּ֧ה לָקַ֣חְתִּי אֶת הַ/לְוִיִּ֗ם מִ/תּוֹךְ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל תַּ֧חַת כָּל בְּכ֛וֹר פֶּ֥טֶר רֶ֖חֶם מִ/בְּנֵ֣י יִשְׂרָאֵ֑ל וְ/הָ֥יוּ לִ֖/י הַ/לְוִיִּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/012.yaml
  text: And I—behold[a], I have taken the Levites from among the sons of Israel in place of every firstborn that opens the womb among the sons of Israel, and the Levites shall be mine.
translation:
  language: vi
  text: Còn Ta, này, Ta đã lấy người Lê-vi từ giữa con cái Y-sơ-ra-ên[a] để thay cho mọi con đầu lòng mở lòng mẹ trong con cái Y-sơ-ra-ên; người Lê-vi sẽ thuộc về Ta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Con cái Y-sơ-ra-ên” cũng có thể dịch là “dân Y-sơ-ra-ên” hoặc “người Y-sơ-ra-ên”. Cụm từ Hê-bơ-rơ theo nghĩa đen mang hình thức giống đực và là một cách nói có tính công thức.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Còn Ta
  rationale: Giữ đại từ ngôi thứ nhất được nêu rõ để thể hiện sự nhấn mạnh và chuyển trọng tâm; “còn” chuyển tải tự nhiên liên từ ו trong văn cảnh.
- source_word: הִנֵּה
  choice: này
  rationale: Giữ sắc thái chỉ dẫn và nhấn mạnh trang trọng của tiểu từ Hê-bơ-rơ mà vẫn tự nhiên trong tiếng Việt.
- source_word: לָקַחְתִּי
  choice: Ta đã chọn
  rationale: Động từ לקח theo nghĩa đen là “lấy”, nhưng trong ngữ cảnh Đức Chúa Trời lấy một nhóm ra từ giữa dân, “chọn” diễn đạt tự nhiên hành động tuyển lấy; “đã” giữ thể hoàn thành với kết quả còn hiệu lực.
- source_word: הַלְוִיִּם
  choice: người Lê-vi
  rationale: Tên gọi quen thuộc trong tiếng Việt cho tập thể chi phái Lê-vi; danh từ tập hợp không cần đánh dấu số nhiều.
- source_word: מִתּוֹךְ
  choice: từ giữa
  rationale: Diễn đạt việc tuyển lấy từ bên trong một cộng đồng, đồng thời bám sát hình ảnh của nguyên ngữ.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: con cái Y-sơ-ra-ên
  rationale: Giữ công thức giao ước và hình thức thân tộc của nguyên ngữ, nhưng dùng “con cái” tự nhiên hơn “các con trai” khi chỉ cộng đồng dân Y-sơ-ra-ên.
- source_word: תַּחַת
  choice: để thay cho
  rationale: Nêu rõ quan hệ thay thế trong bối cảnh luật lệ và biệt riêng.
- source_word: כָּל בְּכוֹר
  choice: mọi con đầu lòng
  rationale: “Mọi” giữ ý phân phối của כָּל; “con đầu lòng” là cách gọi tự nhiên cho hạng người được nói đến.
- source_word: פֶּטֶר רֶחֶם
  choice: mở dạ mẹ
  rationale: Giữ hình ảnh pháp lý–nghi lễ của thành ngữ Hê-bơ-rơ về đứa con đầu tiên mở lòng mẹ, đồng thời thêm “mẹ” để câu tiếng Việt rõ nghĩa.
- source_word: וְהָיוּ לִי
  choice: sẽ thuộc về Ta
  rationale: Diễn đạt trực tiếp quyền sở hữu và sự biệt riêng cho Đức Chúa Trời, đồng thời giữ lực tương lai/kết quả của cấu trúc.
theological_decisions:
- issue: Cách dịch בְּנֵי יִשְׂרָאֵל
  choice: con cái Y-sơ-ra-ên
  alternative: dân Y-sơ-ra-ên; người Y-sơ-ra-ên
  rationale: Giữ cách nói thân tộc có tính công thức trong nguyên ngữ mà không thu hẹp sai thành chỉ nam giới; chú thích nêu cách hiểu tập thể tự nhiên.
- issue: Quan hệ của người Lê-vi với Đức Chúa Trời trong וְהָיוּ לִי
  choice: người Lê-vi sẽ thuộc về Ta
  alternative: người Lê-vi sẽ là của Ta
  rationale: Bản văn khẳng định quyền sở hữu và sự biệt riêng của Đức Chúa Trời, nhưng không áp đặt thêm một phạm trù thần học về sau.
- issue: Ý nghĩa thay thế của תַּחַת
  choice: để thay cho
  alternative: thay vì
  rationale: Giữ rõ tuyên bố rằng người Lê-vi được nhận lấy ở vị trí của mọi con đầu lòng, không giải thích quá mức bản chất thần học của sự thay thế ấy.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Viết hoa “Ta” theo lời phán trực tiếp của Đức Chúa Trời. Dùng “này” để giữ sắc thái nhấn mạnh của הִנֵּה; dùng “con cái Y-sơ-ra-ên” nhằm bảo toàn công thức nguyên ngữ, với cách dịch tập thể được nêu trong chú thích.
