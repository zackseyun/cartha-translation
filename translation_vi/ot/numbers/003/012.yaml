  source_fidelity: 'Cần sửa «đã chọn» thành «đã lấy»: לָקַחְתִּי trực tiếp nói hành động lấy/nhận người Lê-vi từ giữa dân, không xác định rõ là một hành vi tuyển chọn. Quan hệ thay thế (תַּחַת), thành ngữ con đầu lòng mở lòng mẹ, và lời tuyên bố thuộc về Đức Chúa Trời đều được giữ nguyên.'
