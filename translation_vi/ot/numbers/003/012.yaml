  terminology: Giữ nhất quán «người Lê-vi», «con cái Y-sơ-ra-ên» và «thuộc về Ta». Chú thích giải thích công thức Hê-bơ-rơ và nêu các cách dịch tập thể mà không áp đặt diễn giải thần học.
