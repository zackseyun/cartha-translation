base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/021.yaml
  text: To Gershon belonged the clan of the Libnites and the clan of the Shimeites; these are the clans of the Gershonites.
translation:
  language: vi
  text: Thuộc về Ghẹt-sôn là gia tộc Líp-ni và gia tộc Si-mê-i; đó là các gia tộc của người Ghẹt-sôn.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְגֵרְשׁוֹן
  choice: Về Ghẹt-sôn có
  rationale: Tiền tố לְ diễn tả mối liên hệ trong danh sách gia phả. Cách nói này tự nhiên trong tiếng Việt và không hàm ý phân chia lãnh thổ.
- source_word: מִשְׁפַּחַת / מִשְׁפְּחֹת
  choice: gia tộc / các gia tộc
  rationale: Trong ngữ cảnh kiểm kê và gia phả, מִשְׁפָּחָה chỉ một đơn vị thân tộc nhỏ hơn bộ tộc nhưng rộng hơn gia đình hạt nhân; “gia tộc” truyền đạt đúng cấp độ này.
- source_word: הַלִּבְנִי
  choice: gia tộc Líp-ni
  rationale: Dạng chỉ hậu duệ ở đây gọi nhóm thân tộc bắt nguồn từ Líp-ni. Ghép với danh từ “gia tộc” vừa rõ nghĩa vừa tránh một dạng dân danh tiếng Việt gượng gạo.
- source_word: הַשִּׁמְעִי
  choice: gia tộc Si-mê-i
  rationale: Dạng chỉ hậu duệ gọi nhóm bắt nguồn từ Si-mê-i; cách diễn đạt song song với Líp-ni bảo toàn cấu trúc của câu Hê-bơ-rơ.
- source_word: אֵלֶּה הֵם
  choice: đó là
  rationale: Đây là công thức xác định trong một bản liệt kê. “Đó là” tự nhiên trong tiếng Việt khi quy chiếu về hai gia tộc vừa nêu.
- source_word: הַגֵּרְשֻׁנִּי
  choice: người Ghẹt-sôn
  rationale: Dạng dân danh chỉ nhánh người Lê-vi hậu duệ của Ghẹt-sôn. “Người Ghẹt-sôn” ngắn gọn, dễ hiểu và giữ được ý nghĩa tập thể.
