  text: וַ/יְדַבֵּ֤ר יְהוָה֙ אֶל מֹשֶׁ֔ה בְּ/מִדְבַּ֥ר סִינַ֖י לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/014.yaml
  text: And Yahweh spoke to Moses in the wilderness of Sinai[a], saying,
translation:
  language: vi
  text: 'Yahweh[a] phán với Môi-se trong hoang mạc Si-nai rằng:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ: “YHWH”; theo truyền thống thường được dịch là “Đức Giê-hô-va” hoặc “CHÚA”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: phán
  rationale: Dạng kể chuyện của דבר mở đầu công thức truyền lời. “Phán” là cách diễn đạt tự nhiên, trang trọng trong tiếng Việt khi chủ thể là Đức Chúa Trời.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng dạng tên riêng quen thuộc trong tiếng Việt cho Danh Thánh YHWH, không thay bằng tước hiệu “CHÚA”.
- source_word: אֶל־מֹשֶׁה
  choice: với Môi-se
  rationale: Giới từ אֶל chỉ người tiếp nhận lời phán; “phán với Môi-se” là cách nói tự nhiên trong tiếng Việt.
- source_word: בְּמִדְבַּר סִינַי
  choice: trong hoang mạc Si-nai
  rationale: מִדְבָּר chỉ vùng hoang vu hoặc đồng hoang; “hoang mạc” giữ sắc thái địa lý mà không nhất thiết hàm ý một sa mạc toàn cát. Cấu trúc sở thuộc được chuyển tự nhiên là “hoang mạc Si-nai”.
- source_word: לֵאמֹר
  choice: rằng
  rationale: Phân từ nguyên mẫu này giới thiệu nội dung lời phán ở câu kế tiếp; “rằng” truyền đạt chức năng cú pháp tự nhiên hơn “nói rằng” sau động từ “phán”.
theological_decisions:
- issue: Cách chuyển Danh Thánh יְהוָה
  choice: Đức Giê-hô-va
  alternative: Yahweh; CHÚA
  rationale: Bản Hê-bơ-rơ dùng trực tiếp YHWH. “Đức Giê-hô-va” giữ đây là tên riêng và là dạng đã quen thuộc với nhiều độc giả Kinh Thánh tiếng Việt; không thay tên bằng tước hiệu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ công thức dẫn nhập lời phán, nhưng dùng “rằng” để câu tiếng Việt gọn và tự nhiên; dấu hai chấm báo trước nội dung tiếp theo.
