  text: וַ/יִּפְקֹ֣ד מֹשֶׁ֔ה כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֹת֑/וֹ אֶֽת כָּל בְּכֹ֖ר בִּ/בְנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/042.yaml
  text: So Moses counted every firstborn among the sons of Israel[a], just as Yahweh had commanded him.
translation:
  language: vi
  text: Môi-se đếm tất cả các con đầu lòng trong số các con trai của Israel[a], đúng như Yahweh đã truyền cho ông.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ: “các con trai của Israel”; cũng có thể dịch là “dân Israel” hoặc “con cháu Israel”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְקֹד
  choice: kiểm đếm
  rationale: Trong bối cảnh kiểm kê dân số, פקד chỉ việc đếm và ghi nhận số người; “kiểm đếm” rõ nghĩa và tự nhiên trong tiếng Việt hiện đại.
- source_word: כַּאֲשֶׁר
  choice: đúng như
  rationale: Cụm từ diễn tả hành động hoàn toàn phù hợp với mệnh lệnh đã được ban ra.
- source_word: צִוָּה
  choice: đã truyền
  rationale: “Đã truyền” thể hiện mệnh lệnh có trước hành động kiểm đếm của Môi-se và phù hợp với văn phong Kinh Thánh trang trọng, dễ hiểu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ tên riêng của Đức Chúa Trời được biểu thị bằng bốn phụ âm YHWH, thay vì thay thế bằng một tước hiệu.
- source_word: אֹתוֹ
  choice: cho ông
  rationale: Đại từ chỉ Môi-se là người nhận mệnh lệnh; tiếng Việt tự nhiên dùng “truyền cho ông”.
- source_word: אֶת כָּל בְּכֹר
  choice: mọi con đầu lòng
  rationale: “Mọi” bảo toàn sắc thái phân phối của כָּל; câu này không nói rõ “nam”, nên không bổ sung giới tính vào bản văn chính.
- source_word: בִּבְנֵי יִשְׂרָאֵל
  choice: trong số các con trai của Israel
  rationale: “Trong số” phản ánh giới từ ב trong ngữ cảnh kiểm đếm; “các con trai của Israel” giữ hình ảnh thân tộc và hình thức giống đực của nguyên văn.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: Đức Giê-hô-va hoặc CHÚA
  rationale: Nguyên văn dùng trực tiếp danh riêng của Đức Chúa Trời; phiên âm “Yahweh” bảo toàn tính chất danh riêng thay vì thay bằng tước hiệu.
- issue: Phạm vi giới tính của בְּנֵי יִשְׂרָאֵל
  choice: các con trai của Israel
  alternative: dân Israel hoặc con cháu Israel
  rationale: Bản dịch chính giữ cách nói thân tộc giống đực của tiếng Hê-bơ-rơ mà không quyết định rằng cụm từ này chỉ bao gồm nam giới; chú thích nêu các cách diễn đạt theo nghĩa tập thể.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ đọc. “Thế là” nối hành động với mệnh lệnh ở ngữ cảnh trước; “kiểm đếm” phù hợp bối cảnh thống kê. Tên Israel được viết theo dạng quốc tế hiện hành, còn Môi-se theo dạng quen thuộc trong tiếng Việt.
