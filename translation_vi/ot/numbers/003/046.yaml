base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/046.yaml
  text: And for the redemption price of the 273 who exceed the Levites from among the firstborn of the sons of Israel,[a]
translation:
  language: vi
  text: Còn về tiền chuộc cho 273 người dôi ra, trong số các con đầu lòng của dân Y-sơ-ra-ên, vượt quá số người Lê-vi,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “những người được chuộc, tức 273 người.” Hình thức Hê-bơ-rơ có thể được hiểu sát chữ như vậy; nhưng ngữ cảnh ngay sau nói đến khoản tiền phải nộp cho số con đầu lòng dôi ra (cc. 47–48), nên “tiền chuộc” phù hợp hơn tại đây.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּדוּיֵי
  choice: tiền chuộc cho
  rationale: Hình thức Hê-bơ-rơ có thể được hiểu sát hơn là “những người được chuộc”, nhưng ngữ cảnh ngay sau đó nói đến khoản tiền phải thu cho những người con đầu lòng dôi ra (cc. 47–48). “Tiền chuộc cho” diễn đạt tự nhiên chức năng của khoản chuộc mà vẫn ghi nhận cách hiểu sát chữ trong chú thích.
- source_word: הַשְּׁלֹשָׁה וְהַשִּׁבְעִים וְהַמָּאתָיִם
  choice: '273'
  rationale: 'Tiếng Hê-bơ-rơ diễn đạt con số theo lối cộng: ba, bảy mươi và hai trăm. Dùng chữ số hiện đại giúp truyền đạt chính xác và rõ ràng.'
- source_word: הָעֹדְפִים
  choice: dôi ra
  rationale: Phân từ này chỉ những người còn thừa khi số con đầu lòng được đối chiếu với số người Lê-vi. “Dôi ra” tự nhiên, ngắn gọn và giữ được ý vượt quá về số lượng.
- source_word: עַל הַלְוִיִּם
  choice: so với số người Lê-vi
  rationale: Sau הָעֹדְפִים, giới từ עַל nêu chuẩn so sánh mà số người con đầu lòng vượt quá. Thêm “số” làm rõ đây là chênh lệch số lượng, không phải địa vị.
- source_word: מִבְּכוֹר בְּנֵי יִשְׂרָאֵל
  choice: người con đầu lòng của con cái Y-sơ-ra-ên
  rationale: Cụm từ xác định nhóm có số người dôi ra. “Con cái Y-sơ-ra-ên” giữ sắc thái giao ước và cấu trúc tập thể của בְּנֵי יִשְׂרָאֵל; ngữ cảnh cùng “273 người” truyền đạt lực phân xuất của מִן.
