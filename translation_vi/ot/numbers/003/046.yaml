revisions:
- from: Còn về tiền chuộc cho 273 người con đầu lòng của con cái Y-sơ-ra-ên dôi ra so với số người Lê-vi,[a]
  to: Còn về tiền chuộc cho 273 người dôi ra, trong số các con đầu lòng của dân Y-sơ-ra-ên, vượt quá số người Lê-vi,[a]
  rationale: Bản sửa giữ nguyên tính chất câu tiếp nối và mọi yếu tố định lượng của nguyên văn, nhưng sắp xếp lại để xác định rõ 273 người là số con đầu lòng vượt quá số người Lê-vi. Thuật ngữ tập thể được Việt hóa tự nhiên hơn, và chú thích được chỉnh để bảo toàn khả năng đọc thay thế mà không tạo ra ý nghĩa “một phần trong số 273.”
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T08:37:09Z'
review_pass:
  verdict: revise
  source_fidelity: Bản dịch nhận đúng cấu trúc chỉ thị còn tiếp sang câu 47, số lượng 273, quan hệ «dôi ra/vượt quá» với người Lê-vi, và nhóm các con đầu lòng của Y-sơ-ra-ên. Tuy nhiên, trật tự cụm từ hiện tại khiến «dôi ra» dễ bám trực tiếp vào «người con đầu lòng» mà không nêu rõ họ là 273 người vượt quá số người Lê-vi; cũng cần diễn đạt rõ lực phân xuất của מִן.
  naturalness: «Người con đầu lòng của con cái Y-sơ-ra-ên» không tự nhiên trong tiếng Việt hiện đại. «Các con đầu lòng của dân Y-sơ-ra-ên» là cách nói rõ ràng, trang trọng và thông dụng hơn. Đưa «dôi ra» ngay sau «273 người» và bổ sung «trong số» làm quan hệ cú pháp sáng rõ.
  terminology: Giữ «tiền chuộc», «người Lê-vi», và «dân Y-sơ-ra-ên». «Tiền chuộc» phù hợp với ngữ cảnh câu 47–48, đồng thời chú thích cần bảo toàn khả năng hiểu hình thức Hê-bơ-rơ là «những người được chuộc», không biến nó thành một nhóm con của 273 người.
  issues:
  - severity: medium
    issue: Cụm «273 người con đầu lòng của con cái Y-sơ-ra-ên dôi ra so với số người Lê-vi» có cú pháp chưa sáng rõ.
    rationale: Cách đặt từ có thể khiến người đọc chỉ hiểu chung chung rằng các con đầu lòng dôi ra, thay vì xác định 273 người là số vượt quá số người Lê-vi. Bản sửa làm rõ cả số lượng lẫn quan hệ phân xuất từ nhóm con đầu lòng.
  - severity: low
    issue: «Con cái Y-sơ-ra-ên» sau «người con đầu lòng của» không tự nhiên.
    rationale: Trong văn phong Kinh Thánh tiếng Việt hiện đại, «dân Y-sơ-ra-ên» diễn đạt בני ישראל tự nhiên hơn ở vị trí này, không thay đổi ý nghĩa tập thể/giao ước.
  - severity: medium
    issue: Chú thích thay thế «những người được chuộc trong số 273 người» gợi ý sai rằng đó là một phần của 273 người.
    rationale: Cách hiểu sát của פְּדוּיֵי là danh từ chỉ những người được chuộc (liên hệ với con số 273), không phải «trong số» 273 người theo nghĩa một tập hợp con.
