translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu được giữ ở dạng tiếp nối vì câu Hê-bơ-rơ là một bộ phận của chỉ thị kéo dài sang câu 47. Dùng “người Lê-vi” và “Y-sơ-ra-ên” theo lối phiên âm Kinh Thánh quen thuộc; dấu chú thích [a] xuất hiện trong chính văn.
