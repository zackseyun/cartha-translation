base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/008.yaml
  text: They shall keep charge of all the furnishings of the tent of meeting[a], and the duty of the sons of Israel, to perform the service of the tabernacle.
translation:
  language: vi
  text: Họ phải trông coi mọi vật dụng của Lều Hội Kiến và đảm trách phận sự của con cái Israel, để thực hiện công việc phục vụ Đền Tạm.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְשָׁמְרוּ
  choice: Họ phải trông coi
  rationale: Trong văn cảnh tư tế, động từ שׁמר vừa hàm ý canh giữ vừa hàm ý đảm trách điều được giao; “trông coi” diễn đạt tự nhiên cả trách nhiệm bảo quản lẫn thi hành nhiệm vụ.
- source_word: כָּל כְּלֵי אֹהֶל מוֹעֵד
  choice: mọi vật dụng của Lều Hội Kiến
  rationale: כְּלִים chỉ chung các đồ dùng, khí cụ hoặc vật dụng, không nhất thiết chỉ các bình chứa; “vật dụng” giữ được phạm vi nghĩa rộng.
- source_word: אֹהֶל מוֹעֵד
  choice: Lều Hội Kiến
  rationale: Cách gọi trang trọng, quen thuộc trong tiếng Việt, giữ cả hình ảnh chiếc lều và ý nghĩa nơi hội kiến đã định.
- source_word: מִשְׁמֶרֶת בְּנֵי יִשְׂרָאֵל
  choice: phận sự thay cho con cái Israel
  rationale: מִשְׁמֶרֶת là trách nhiệm được giao. Trong mạch văn 3:7–8, người Lê-vi thi hành trách nhiệm liên quan đến dân Israel tại nơi thánh; “thay cho” làm rõ quan hệ đại diện mà cấu trúc ngắn gọn của tiếng Hê-bơ-rơ để hàm ẩn.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: con cái Israel
  rationale: Giữ cách diễn đạt tập thể truyền thống của cụm Hê-bơ-rơ, đồng thời tự nhiên hơn “các con trai Israel” trong tiếng Việt khi chỉ toàn dân.
- source_word: לַעֲבֹד אֶת עֲבֹדַת הַמִּשְׁכָּן
  choice: để thực hiện công việc phục vụ Đền Tạm
  rationale: Cụm cùng gốc עבד nhấn mạnh việc thi hành lao tác phụng sự tại nơi thánh. “Công việc phục vụ” giữ sắc thái nhiệm vụ mà không tạo lối lặp gượng trong tiếng Việt.
- source_word: הַמִּשְׁכָּן
  choice: Đền Tạm
  rationale: Danh xưng tiếng Việt quen thuộc cho nơi ngự thánh lưu động trong hoang mạc, phân biệt tự nhiên với Lều Hội Kiến dù hai danh xưng quy chiếu cùng khu thánh.
theological_decisions:
- issue: Quan hệ của מִשְׁמֶרֶת בְּנֵי יִשְׂרָאֵל với người Lê-vi
  choice: làm phận sự thay cho con cái Israel
  alternative: giữ phận sự của con cái Israel
  rationale: Ngữ cảnh trực tiếp nói người Lê-vi phục vụ A-rôn và hội chúng, nên cách dịch đại diện là tự nhiên. Tuy vậy, cụm Hê-bơ-rơ tự nó có thể được hiểu sát hơn là “giữ phận sự của con cái Israel”; bản dịch không gắn thêm một cơ chế thần học ngoài ngữ cảnh.
- issue: Cách diễn đạt tập thể có giống trong בְּנֵי יִשְׂרָאֵל
  choice: con cái Israel
  alternative: các con trai Israel
  rationale: Đây là danh xưng tập thể thông thường cho dân Israel. “Con cái Israel” phản ánh thành tố quan hệ dòng dõi mà không khiến độc giả Việt hiểu sai rằng câu chỉ nói đến nam giới.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc; dùng các danh xưng Kinh Thánh quen thuộc “Lều Hội Kiến” và “Đền Tạm”. Không cần chú thích vì các sắc thái chính có thể được thể hiện rõ trong câu mà không làm mất tính tự nhiên.
