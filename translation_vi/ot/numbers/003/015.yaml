base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/015.yaml
  text: 'Count the sons of Levi by their fathers'' houses[a], by their clans: every male from a month old and upward you shall count.'
translation:
  language: vi
  text: Hãy kiểm đếm con cháu Lê-vi theo nhà tổ phụ của họ[a], theo thị tộc của họ. Hãy kiểm đếm mọi người nam từ một tháng tuổi trở lên.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “theo nhà các tổ phụ của họ.” Đây là một đơn vị thân tộc được xác định theo dòng cha.'
    reason: Giải thích thành ngữ phả hệ Hê-bơ-rơ và cơ sở của cách dịch “nhà tổ phụ của họ”.
lexical_decisions:
- source_word: פְּקֹד / תִּפְקְדֵם
  choice: hãy kiểm đếm / ngươi đều phải kiểm đếm
  rationale: Trong ngữ cảnh hành chính này, פקד chỉ việc đếm và ghi nhận nhân số. “Kiểm đếm” rõ nghĩa, không hàm ý quân sự, đồng thời thể hiện mệnh lệnh được nhắc lại ở cuối câu.
- source_word: בְּנֵי לֵוִי
  choice: con cháu Lê-vi
  rationale: Cụm Hê-bơ-rơ có nghĩa đen là “các con trai của Lê-vi”, nhưng ở đây chỉ toàn thể hậu duệ nam thuộc dòng Lê-vi. “Con cháu Lê-vi” giữ rõ ý phả hệ mà không khiến độc giả hiểu rằng chỉ nói đến các con trực tiếp của Lê-vi.
- source_word: לְבֵית אֲבֹתָם
  choice: theo từng gia tộc phụ hệ
  rationale: Cụm này chỉ đơn vị thân tộc được xác định theo nhà tổ phụ. “Gia tộc phụ hệ” diễn đạt cơ cấu phả hệ theo dòng cha, đồng thời phân biệt với מִשְׁפְּחֹתָם.
- source_word: לְמִשְׁפְּחֹתָם
  choice: theo từng thị tộc của họ
  rationale: “Thị tộc” diễn tả một nhóm thân tộc và giúp phân biệt thuật ngữ này với “gia tộc phụ hệ” đứng trước.
- source_word: כָּל זָכָר
  choice: mọi người nam
  rationale: Bản Hê-bơ-rơ xác định giới tính chứ không nói đến tuổi trưởng thành; cách dịch này bao gồm cả trẻ sơ sinh như vế sau yêu cầu.
- source_word: מִבֶּן חֹדֶשׁ וָמַעְלָה
  choice: từ một tháng tuổi trở lên
  rationale: Đây là cách nói tự nhiên và chính xác trong tiếng Việt để chỉ ngưỡng tuổi tối thiểu của cuộc kiểm đếm.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ngươi” để giữ sắc thái lời truyền trực tiếp cho Môi-se; “kiểm đếm” phù hợp bối cảnh hành chính. Dấu câu chia mệnh lệnh thành hai câu tiếng Việt tự nhiên mà vẫn giữ sự lặp lại có chủ ý của động từ פקד.
