revisions:
- from: Hãy kiểm đếm con cháu Lê-vi theo từng gia tộc phụ hệ[a] và từng thị tộc của họ. Mọi người nam từ một tháng tuổi trở lên, ngươi đều phải kiểm đếm.
  to: Hãy kiểm đếm con cháu Lê-vi theo nhà tổ phụ của họ[a], theo thị tộc của họ. Hãy kiểm đếm mọi người nam từ một tháng tuổi trở lên.
  rationale: Bản sửa thay cách diễn giải “gia tộc phụ hệ” bằng “nhà tổ phụ của họ” sát nguyên văn hơn, cập nhật cách xưng hô sang mệnh lệnh hiện đại, và vẫn giữ hai lần xuất hiện của động từ פקד. Không thay đổi ý nghĩa hay thêm diễn giải thần học.
