base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/006.yaml
  text: Bring near the tribe of Levi[a], and set it before Aaron the priest, and they shall serve him.
translation:
  language: vi
  text: “Hãy đưa chi tộc Lê-vi đến gần và đặt họ trước mặt thầy tế lễ A-rôn, và họ sẽ phục vụ ông.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “hầu việc ông.” Động từ Hê-bơ-rơ có thể chỉ việc phụ tá hoặc phục vụ trong nghi lễ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקְרֵב
  choice: đưa ... đến gần
  rationale: Dạng Hiphil mệnh lệnh của קרב mang nghĩa khiến đến gần hoặc đưa đến gần; cách dịch này giữ được sắc thái cụ thể và nghi lễ của nguyên văn.
- source_word: מַטֵּה לֵוִי
  choice: chi tộc Lê-vi
  rationale: מַטֶּה theo nghĩa đen có thể là “cây gậy”, nhưng trong ngữ cảnh tổ chức dân Israel chỉ một chi tộc. “Chi tộc Lê-vi” là cách gọi tự nhiên và chính xác trong tiếng Việt.
- source_word: וְהַעֲמַדְתָּ אֹתוֹ
  choice: và đặt họ
  rationale: Dạng Hiphil của עמד có nghĩa khiến đứng, đặt hoặc bố trí. Tuy tiếng Hê-bơ-rơ dùng đại từ số ít theo danh từ tập hợp “chi tộc”, tiếng Việt tự nhiên dùng “họ” để chỉ những người thuộc chi tộc.
- source_word: לִפְנֵי אַהֲרֹן הַכֹּהֵן
  choice: trước mặt thầy tế lễ A-rôn
  rationale: לִפְנֵי có nghĩa trực tiếp là “trước mặt” hoặc “ở trước”; trật tự “thầy tế lễ A-rôn” rõ chức vụ mà vẫn tự nhiên trong tiếng Việt.
- source_word: וְשֵׁרְתוּ אֹתוֹ
  choice: để họ phục vụ ông
  rationale: שרת chỉ việc phục vụ, thường có sắc thái phụ tá hoặc nghi lễ. Đại từ làm tân ngữ tự nhiên nhất quy về A-rôn; “phục vụ ông” giữ rõ quan hệ ấy mà không dùng thuật ngữ giáo phái.
theological_decisions:
- issue: Bản chất việc phục vụ của người Lê-vi đối với A-rôn
  choice: Người Lê-vi được đặt trước mặt A-rôn để phục vụ ông trong vai trò tế lễ của ông.
  alternative: Người Lê-vi phục vụ cùng với A-rôn chứ không phục vụ ông.
  rationale: Trong וְשֵׁרְתוּ אֹתוֹ, đại từ tân ngữ אֹתוֹ tự nhiên nhất chỉ A-rôn, nên không nên đổi thành ý “phục vụ cùng ông”. Tuy vậy, động từ שרת có thể bao gồm cả việc phụ tá và phục vụ trong nghi lễ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “thầy tế lễ” cho הַכֹּהֵן, “chi tộc” cho đơn vị bộ tộc Israel, và đại từ số nhiều “họ” theo cách diễn đạt tự nhiên của tiếng Việt dù danh từ tập hợp trong tiếng Hê-bơ-rơ ở số ít.
