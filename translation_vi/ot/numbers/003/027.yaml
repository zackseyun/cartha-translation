  text: וְ/לִ/קְהָ֗ת מִשְׁפַּ֤חַת הַֽ/עַמְרָמִי֙ וּ/מִשְׁפַּ֣חַת הַ/יִּצְהָרִ֔י וּ/מִשְׁפַּ֨חַת֙ הַֽ/חֶבְרֹנִ֔י וּ/מִשְׁפַּ֖חַת הָֽ/עָזִּיאֵלִ֑י אֵ֥לֶּה הֵ֖ם מִשְׁפְּחֹ֥ת הַ/קְּהָתִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/027.yaml
  text: 'And for Kohath: the clan of the Amramites, and the clan of the Izharites, and the clan of the Hebronites, and the clan of the Uzzielites—these are the clans of the Kohathites.'
translation:
  language: vi
  text: Về Kê-hát, có các thị tộc Am-ram, Dít-ha, Hếp-rôn và U-xi-ên. Đó là các thị tộc của người Kê-hát.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/לִ/קְהָת
  choice: Về Kê-hát
  rationale: Liên từ và giới từ mở đầu nhóm gia phả kế tiếp; “Về Kê-hát” tự nhiên trong tiếng Việt và giữ được chức năng phân loại của nguyên văn.
- source_word: מִשְׁפַּחַת
  choice: thị tộc
  rationale: Trong bối cảnh gia phả và kiểm kê dân số, từ này chỉ một đơn vị thân tộc thuộc một chi tộc hay dòng họ lớn hơn; “thị tộc” phân biệt rõ với gia đình hạt nhân.
- source_word: הַֽ/עַמְרָמִי
  choice: Am-ram
  rationale: 'Dạng chỉ hậu duệ được diễn đạt tự nhiên bằng tên tổ tiên sau danh từ “thị tộc”: “thị tộc Am-ram”.'
- source_word: הַ/יִּצְהָרִי
  choice: Dít-ha
  rationale: Chỉ hậu duệ của Dít-ha; cấu trúc “thị tộc Dít-ha” ngắn gọn và nhất quán.
- source_word: הַֽ/חֶבְרֹנִי
  choice: Hếp-rôn
  rationale: Chỉ hậu duệ của Hếp-rôn; tên riêng được dùng bổ nghĩa cho “thị tộc” theo lối tự nhiên của tiếng Việt.
- source_word: הָֽ/עָזִּיאֵלִי
  choice: U-xi-ên
  rationale: Chỉ hậu duệ của U-xi-ên; cách diễn đạt giữ rõ quan hệ gia phả.
- source_word: אֵלֶּה הֵם
  choice: Đó là
  rationale: Cụm từ có chức năng nhận diện và tổng kết danh sách vừa nêu; “Đó là” tự nhiên trong văn cảnh tiếng Việt.
- source_word: מִשְׁפְּחֹת הַ/קְּהָתִי
  choice: các thị tộc của người Kê-hát
  rationale: Dạng số nhiều kết hợp với từ chỉ thành viên nhóm Kê-hát, tổng kết các nhóm nhỏ vừa liệt kê.
theological_decisions: []
