  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Cấu trúc “con trưởng là Na-đáp” bảo toàn ý nghĩa của הַבְּכֹר đồng thời tránh để người đọc hiểu nhầm rằng danh hiệu này áp dụng cho cả danh sách.
