  yaml_path: translation/ot/numbers/003/002.yaml
  text: 'These are the names of Aaron’s sons: the firstborn Nadab, and Abihu, Eleazar, and Ithamar.'
translation:
  language: vi
  text: 'Đây là tên các con trai của A-rôn: Na-đáp, con trưởng, A-bi-hu, Ê-lê-a-sa và Y-tha-ma.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Đây là
  rationale: Mở đầu danh sách bằng đại từ chỉ định; không dịch liên từ וְ thành “Và” để câu tiếng Việt tự nhiên hơn.
- source_word: שְׁמוֹת
  choice: tên
  rationale: Trong kết cấu “Đây là tên...”, danh từ không cần từ chỉ số nhiều mà vẫn diễn đạt tự nhiên ý nghĩa số nhiều của tiếng Hê-bơ-rơ.
- source_word: בְּנֵי אַהֲרֹן
  choice: các con trai của A-rôn
  rationale: Giữ rõ nghĩa nam giới của בְּנֵי và chuyển kết cấu sở hữu sang tiếng Việt hiện đại, tự nhiên.
- source_word: הַבְּכֹר
  choice: con trưởng
  rationale: Chỉ địa vị người con sinh đầu tiên, chính xác hơn cách nói chỉ người lớn tuổi nhất; đặt trong cấu trúc “con trưởng là Na-đáp” để tiếng Việt rõ và tự nhiên.
- source_word: נָדָב
  choice: Na-đáp
  rationale: Phiên âm tên riêng theo lối quen thuộc, dễ đọc trong tiếng Việt.
- source_word: וַאֲבִיהוּא
  choice: rồi A-bi-hu
  rationale: Tên riêng được phiên âm; “rồi” làm rõ rằng sau Na-đáp, danh sách tiếp tục với các người con khác mà không gán danh hiệu con trưởng cho A-bi-hu.
- source_word: אֶלְעָזָר
  choice: Ê-lê-a-sa
  rationale: Phiên âm tên riêng theo lối quen thuộc, dễ đọc trong tiếng Việt.
- source_word: וְאִיתָמָר
  choice: và Y-tha-ma
  rationale: Giữ liên từ ở phần tử cuối của danh sách theo cách liệt kê tự nhiên trong tiếng Việt.
theological_decisions: []
