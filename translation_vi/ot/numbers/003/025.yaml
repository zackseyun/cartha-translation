  text: וּ/מִשְׁמֶ֤רֶת בְּנֵֽי גֵרְשׁוֹן֙ בְּ/אֹ֣הֶל מוֹעֵ֔ד הַ/מִּשְׁכָּ֖ן וְ/הָ/אֹ֑הֶל מִכְסֵ֕/הוּ וּ/מָסַ֕ךְ פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/025.yaml
  text: And the duty of the sons of Gershon in the tent of meeting was the tabernacle[a], the tent, its covering, and the screen for the entrance of the tent of meeting[b],
translation:
  language: vi
  text: Phần việc[a] của các con trai Ghẹt-sôn tại Lều Hội Kiến là chăm lo Đền Tạm, lều, tấm phủ của lều, và bức màn[b] che lối vào Lều Hội Kiến;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “trách nhiệm” hoặc “nhiệm vụ trông nom”.
    reason: lexical_alternative
  - marker: b
    text: “Bức màn” cũng có thể dịch là “tấm che”; đây là tấm treo ở lối vào.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁמֶרֶת
  choice: phần việc
  rationale: Trong ngữ cảnh phân công cho người Lê-vi, từ này chỉ phần trách nhiệm được giao trông nom; “phần việc” tự nhiên và dẫn vào danh sách các vật dụng bên dưới.
- source_word: בְּנֵי גֵרְשׁוֹן
  choice: các con trai Ghẹt-sôn
  rationale: Giữ cách diễn đạt gia tộc của tiếng Hê-bơ-rơ thay vì chuyển thành tên một nhóm phái sinh.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: tại Lều Hội Kiến
  rationale: Giới từ chỉ phạm vi hoặc địa điểm phục vụ; “tại” tự nhiên hơn “trong” vì danh sách gồm các bộ phận của chính Lều Hội Kiến.
- source_word: הַמִּשְׁכָּן
  choice: Đền Tạm
  rationale: Thuật ngữ tiếng Việt quen thuộc cho nơi Đức Chúa Trời ngự giữa dân trong bối cảnh này.
- source_word: וְהָאֹהֶל
  choice: lều phủ
  rationale: Phân biệt lớp lều phủ với Đền Tạm theo danh sách các bộ phận, đồng thời tránh cách dịch “Đền Tạm và cái lều” dễ bị hiểu là hai công trình riêng biệt.
- source_word: מִכְסֵהוּ
  choice: tấm phủ của lều
  rationale: Nêu rõ sở thuộc của hậu tố số ít; trong cấu trúc gần nhất, nó quy chiếu về lều phủ.
- source_word: מָסַךְ
  choice: bức màn
  rationale: Chỉ tấm treo che ở cửa; “bức màn” là cách gọi tự nhiên trong tiếng Việt.
- source_word: פֶּתַח
  choice: lối vào
  rationale: Diễn đạt tự nhiên chức năng của bức màn tại cửa vào.
- source_word: אֹהֶל מוֹעֵד
  choice: Lều Hội Kiến
  rationale: Cách dịch minh bạch, quen thuộc và nhất quán cho cùng cụm từ Hê-bơ-rơ.
