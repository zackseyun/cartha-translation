  - severity: low
    issue: Từ “có” thêm một sắc thái tồn tại không được diễn đạt trực tiếp trong câu nguồn.
    rationale: Câu Hê-bơ-rơ có dạng đề mục rồi liệt kê các thị tộc. Dấu hai chấm sau “Về Mê-ra-ri” tái hiện cấu trúc này gọn và sát hơn, không làm đổi nghĩa.
