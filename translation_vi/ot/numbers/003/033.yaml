base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/033.yaml
  text: 'For Merari: the clan of the Mahlites and the clan of the Mushites; these are the clans of Merari.'
translation:
  language: vi
  text: 'Về Mê-ra-ri: thị tộc Mách-li và thị tộc Mu-si. Đó là các thị tộc của Mê-ra-ri.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִמְרָרִי
  choice: Về Mê-ra-ri
  rationale: Tiền tố לְ mở đầu mục liệt kê dành cho nhánh hậu duệ Mê-ra-ri; “Về” tự nhiên trong tiếng Việt và giữ được chức năng phân loại của cụm từ.
- source_word: מִשְׁפַּחַת
  choice: thị tộc
  rationale: Trong ngữ cảnh gia phả và kiểm kê dân số, מִשְׁפָּחָה chỉ một đơn vị thân tộc dưới cấp bộ tộc; “thị tộc” chính xác hơn “gia đình” hay “bộ tộc”.
- source_word: הַמַּחְלִי
  choice: Mác-li
  rationale: Đây là tên gọi một nhóm hậu duệ gắn với Mác-li. Trong cấu trúc tiếng Việt “thị tộc Mác-li” diễn đạt tự nhiên ý nghĩa của danh xưng tập thể này.
- source_word: וּמִשְׁפַּחַת
  choice: và thị tộc
  rationale: Liên từ וּ phối hợp hai thị tộc; lặp lại “thị tộc” phản ánh cấu trúc Hê-bơ-rơ và giúp danh sách rõ ràng.
- source_word: הַמּוּשִׁי
  choice: Mu-si
  rationale: Đây là tên gọi nhóm hậu duệ gắn với Mu-si; “thị tộc Mu-si” là cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: אֵלֶּה הֵם
  choice: Đó là
  rationale: Cụm đại từ chỉ định kèm đại từ nhân xưng mang ý xác nhận, được chuyển thành “Đó là” để vừa tự nhiên vừa giữ sắc thái tổng kết.
- source_word: מִשְׁפְּחֹת מְרָרִי
  choice: các thị tộc của Mê-ra-ri
  rationale: Số nhiều tóm kết hai nhóm vừa nêu; cách dịch này duy trì nhất quán thuật ngữ “thị tộc” và quan hệ gia phả.
