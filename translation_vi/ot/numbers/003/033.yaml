  source_fidelity: 'Bản dịch phản ánh đúng cấu trúc liệt kê: hai thị tộc thuộc Mê-ra-ri được nêu ra, rồi được tổng kết là các thị tộc của Mê-ra-ri. Tuy nhiên, động từ “có” không hiện diện trong mệnh đề danh ngữ tiếng Hê-bơ-rơ; dùng dấu hai chấm giữ chức năng đề mục/liệt kê của לִמְרָרִי sát hơn.'
  naturalness: '“Thị tộc” phù hợp, trang trọng và rõ nghĩa trong bối cảnh gia phả. Cấu trúc “Về Mê-ra-ri: ...” tự nhiên trong văn phong liệt kê hiện đại và tránh thêm động từ tồn tại không cần thiết.'
  terminology: Cần chuẩn hóa tên Mahli là “Mách-li”, phù hợp với lối phiên âm Kinh Thánh tiếng Việt thông dụng và phân biệt với dạng “Mác-li” không phải cách gọi chuẩn thường dùng. “Mê-ra-ri” và “Mu-si” có thể giữ nguyên. Thuật ngữ “thị tộc” được dùng nhất quán cho מִשְׁפָּחָה.
