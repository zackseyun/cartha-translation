base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/030.yaml
  text: And the chief of the ancestral house of the families of the Kohathites was Elizaphan the son of Uzziel[a][b].
translation:
  language: vi
  text: Người đứng đầu nhà cha của các thị tộc Kê-hát là Ê-li-xa-phan, con trai U-xi-ên.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn “nhà cha”, một thành ngữ chỉ đơn vị gia tộc theo dòng cha.
    reason: cultural_note
lexical_decisions:
- source_word: וּ/נְשִׂיא
  choice: Người đứng đầu
  rationale: נָשִׂיא chỉ người lãnh đạo có thẩm quyền trong cơ cấu bộ tộc; “người đứng đầu” tự nhiên trong tiếng Việt và không hàm ý vương quyền. Liên từ וּ được thể hiện qua mạch tiếp nối của câu thay vì dịch máy móc là “và”.
- source_word: בֵית אָב
  choice: gia tộc
  rationale: Thành ngữ nguyên văn là “nhà cha”, chỉ đơn vị thân tộc theo dòng cha; “gia tộc” truyền đạt chức năng xã hội ấy rõ ràng trong tiếng Việt hiện đại.
- source_word: לְ/מִשְׁפְּחֹת
  choice: của các thị tộc
  rationale: מִשְׁפָּחוֹת chỉ các nhóm họ hàng hay thị tộc. Cách dịch này giữ sự phân tầng giữa בֵית אָב và מִשְׁפְּחֹת mà không lặp từ “gia tộc”.
- source_word: הַ/קְּהָתִי
  choice: Kê-hát
  rationale: Danh từ chỉ dòng dõi được hiểu theo nghĩa tập thể; trong cụm “các thị tộc Kê-hát”, tên tổ phụ dùng như định danh chung cho những người thuộc dòng Kê-hát.
- source_word: אֶלִיצָפָן
  choice: Ê-li-sa-phan
  rationale: Tên riêng được phiên âm sang tiếng Việt theo hình thức Hê-bơ-rơ.
- source_word: בֶּן עֻזִּיאֵל
  choice: con trai U-xi-ên
  rationale: Công thức phả hệ thông thường; “con trai” thể hiện rõ בֶּן và phù hợp văn phong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu Hê-bơ-rơ không có động từ được diễn đạt tự nhiên bằng “là”. Dùng “người đứng đầu” thay cho từ dễ mang sắc thái quân chủ; phân biệt “gia tộc” với “thị tộc” để phản ánh hai thuật ngữ thân tộc trong nguyên văn.
