- from: Người đứng đầu gia tộc của các thị tộc Kê-hát là Ê-li-sa-phan, con trai U-xi-ên.[a]
  to: Người đứng đầu nhà cha của các thị tộc Kê-hát là Ê-li-xa-phan, con trai U-xi-ên.[a]
  rationale: Bản sửa giữ sát cụm bֵּית אָב bằng “nhà cha”, đồng thời chú thích ý nghĩa xã hội của thành ngữ. Điều này phân biệt minh bạch “nhà cha” với “các thị tộc”, tránh cách ghép “gia tộc của các thị tộc” không rõ cấp bậc. Tên riêng được chuẩn hóa mà không thay đổi nghĩa.
