revisions:
- from: Nhiệm vụ được giao cho con cháu Mê-ra-ri là coi sóc các khung của Đền Tạm[a], các thanh ngang, các trụ, các đế[b], mọi vật dụng và mọi công việc liên quan đến những thứ ấy[c].
  to: Phần việc được giao cho con cháu Mê-ra-ri gồm các khung của Đền Tạm[a], các thanh ngang, các trụ, các đế[b], mọi dụng cụ của Đền Tạm, và mọi công việc phục vụ của Đền Tạm[c].
