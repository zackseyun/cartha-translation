base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/036.yaml
  text: And the appointed duty of the sons of Merari was the frames of the tabernacle[a], its bars, its pillars, its bases, all its furnishings[c][b], and all its service.
translation:
  language: vi
  text: Phần việc được giao cho con cháu Mê-ra-ri gồm các khung của Đền Tạm[a], các thanh ngang, các trụ, các đế[b], mọi dụng cụ của Đền Tạm, và mọi công việc phục vụ của Đền Tạm[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hoặc “các tấm ván của Đền Tạm.”
    reason: lexical_alternative
  - marker: b
    text: Hoặc “các ổ đỡ.”
    reason: lexical_alternative
  - marker: c
    text: Hoặc “mọi công việc liên quan đến Đền Tạm.”
    reason: lexical_alternative
lexical_decisions:
- source_word: פְקֻדַּת מִשְׁמֶרֶת
  choice: nhiệm vụ được giao ... là coi sóc
  rationale: Hai danh từ kết hợp diễn tả trách nhiệm chính thức được giao phó. Cách dịch này tự nhiên trong tiếng Việt và giữ cả ý phân công lẫn trông nom.
- source_word: בְּנֵי מְרָרִי
  choice: con cháu Mê-ra-ri
  rationale: בְּנֵי trong ngữ cảnh bộ tộc chỉ các hậu duệ thuộc gia tộc Mê-ra-ri; “con cháu” tự nhiên và chính xác hơn “các con trai” khi nói về toàn nhóm.
- source_word: קַרְשֵׁי הַמִּשְׁכָּן
  choice: các khung của Đền Tạm
  rationale: קֶרֶשׁ chỉ những cấu kiện đứng tạo nên kết cấu Đền Tạm. “Khung” truyền đạt chức năng kiến trúc, trong khi “tấm ván” vẫn là khả năng từ vựng cần ghi chú.
- source_word: בְרִיחָיו
  choice: các thanh ngang
  rationale: Các thanh này liên kết những khung của Đền Tạm; “thanh ngang” rõ nghĩa hơn “thanh” mà không diễn giải quá mức.
- source_word: עַמֻּדָיו
  choice: các trụ
  rationale: Từ này chỉ các bộ phận chống đỡ thẳng đứng; “trụ” là cách gọi tự nhiên trong tiếng Việt hiện đại.
- source_word: אֲדָנָיו
  choice: các đế
  rationale: Đây là những bộ phận nền để giữ các cấu kiện đứng. “Đế” dễ hiểu; “ổ đỡ” thể hiện rõ hơn đặc điểm kỹ thuật nhưng kém quen thuộc.
- source_word: כָל כֵּלָיו
  choice: mọi vật dụng
  rationale: כְּלִי là từ rộng, có thể chỉ vật dụng, dụng cụ hoặc thiết bị. “Mọi vật dụng” giữ được tính khái quát mà không giới hạn vào đồ dùng nghi lễ nhỏ.
- source_word: כֹל עֲבֹדָתוֹ
  choice: mọi công việc liên quan đến những thứ ấy
  rationale: Hậu tố số ít có thể quy về toàn bộ hạng mục vừa nêu, và עֲבֹדָה tại đây bao gồm công việc phục vụ, tháo lắp và vận chuyển. Cách dịch làm rõ quan hệ tự nhiên trong tiếng Việt mà không thu hẹp loại công việc.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng “Đền Tạm” như thuật ngữ quen thuộc cho הַמִּשְׁכָּן; câu được tổ chức quanh động từ “coi sóc” để diễn đạt tự nhiên cụm danh từ Hebrew về trách nhiệm được giao.
