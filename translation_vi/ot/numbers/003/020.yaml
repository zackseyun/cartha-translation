id: NUM.3.20
reference: Numbers 3:20
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וּ/בְנֵ֧י מְרָרִ֛י לְ/מִשְׁפְּחֹתָ֖/ם מַחְלִ֣י וּ/מוּשִׁ֑י אֵ֥לֶּה הֵ֛ם מִשְׁפְּחֹ֥ת הַ/לֵּוִ֖י לְ/בֵ֥ית אֲבֹתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/020.yaml
  text: 'The sons of Merari[a], by their clans: Mahli and Mushi. These are the clans of the Levites, by their fathers’ houses.'
translation:
  language: vi
  text: Các con trai của Mê-ra-ri, theo thị tộc của họ, là Mác-li và Mu-si. Đây là các thị tộc của người Lê-vi[a], theo gia tộc bên cha của họ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể hiểu là “các thị tộc của Lê-vi”. Tiếng Hê-bơ-rơ dùng dạng số ít “người Lê-vi”, có thể mang nghĩa tập thể hoặc chỉ về Lê-vi, tổ phụ của bộ tộc.
    reason: alternative_reading
lexical_decisions:
- source_word: וּבְנֵי
  choice: Các con trai của
  rationale: Giữ ngôn ngữ phả hệ trực tiếp của בְּנֵי; liên từ וּ không cần dịch riêng vì câu này tiếp tục một danh sách và tiếng Việt tự nhiên hơn khi không mở đầu bằng “Và”.
- source_word: מְרָרִי
  choice: Mê-ra-ri
  rationale: Tên riêng được phiên âm theo cách quen dùng và dễ đọc trong tiếng Việt.
- source_word: לְמִשְׁפְּחֹתָם
  choice: theo thị tộc của họ
  rationale: Diễn đạt sự phân loại theo các đơn vị họ hàng trong cơ cấu bộ tộc; “thị tộc” phân biệt rõ hơn với hộ gia đình.
- source_word: מַחְלִי וּמוּשִׁי
  choice: Mác-li và Mu-si
  rationale: Phiên âm hai tên riêng và thể hiện rõ liên từ phối hợp.
- source_word: אֵלֶּה הֵם
  choice: Đây là
  rationale: Cách trình bày nhận diện tự nhiên trong tiếng Việt, tương đương với cấu trúc chỉ định cộng đại từ của tiếng Hê-bơ-rơ.
- source_word: מִשְׁפְּחֹת הַלֵּוִי
  choice: các thị tộc của người Lê-vi
  rationale: Giữ hình thức số ít của הַלֵּוִי và tính mơ hồ giữa nghĩa tập thể “người Lê-vi” với tổ phụ Lê-vi; chú thích nêu cách hiểu khác.
- source_word: לְבֵית אֲבֹתָם
  choice: theo gia tộc bên cha của họ
  rationale: Diễn đạt thành ngữ hành chính-họ hàng בֵּית אָבוֹת bằng tiếng Việt hiện đại, đồng thời giữ rõ cấu trúc phụ hệ được văn bản nêu.
theological_decisions:
- issue: Phạm vi chỉ định của הַלֵּוִי số ít
  choice: người Lê-vi, với chú thích về nghĩa tập thể hoặc quy chiếu đến tổ phụ Lê-vi
  alternative: những người Lê-vi / các thị tộc của Lê-vi
  rationale: Bản Hê-bơ-rơ dùng danh từ chỉ thành viên bộ tộc ở số ít có mạo từ. Dịch chính giữ dạng số ít và không quyết định dứt khoát giữa cách dùng tập thể với sự quy chiếu phả hệ.
translation_notes:
  register: Văn phong trang trọng, sáng rõ và hiện đại. Dùng “thị tộc” cho מִשְׁפָּחוֹת trong bối cảnh cơ cấu bộ tộc, và “gia tộc bên cha” cho בֵּית אָבוֹת để tránh lối dịch từng chữ khó hiểu như “nhà của các cha”.
source_grounding:
  english_pob_role: consult_only
