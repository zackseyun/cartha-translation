  text: וַ/יְהִי֩ כָל בְּכ֨וֹר זָכָ֜ר בְּ/מִסְפַּ֥ר שֵׁמ֛וֹת מִ/בֶּן חֹ֥דֶשׁ וָ/מַ֖עְלָ/ה לִ/פְקֻדֵי/הֶ֑ם שְׁנַ֤יִם וְ/עֶשְׂרִים֙ אֶ֔לֶף שְׁלֹשָׁ֥ה וְ/שִׁבְעִ֖ים וּ/מָאתָֽיִם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/043.yaml
  text: And all the firstborn males[a], by the number of names, from a month old and upward, according to their count, were twenty-two thousand[b], three hundred seventy-three.
translation:
  language: vi
  text: Tổng số các con trai đầu lòng từ một tháng tuổi trở lên, được kiểm kê theo tên[a], là 22.373 người.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn Hê-bơ-rơ là “theo số tên”, một cách nói trong bối cảnh kiểm kê, hàm ý từng người được đăng ký hoặc đếm theo tên.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי
  choice: là
  rationale: Trong câu tổng kết kiểm kê này, động từ היה nêu kết quả. Cấu trúc “Tổng số… là…” tự nhiên trong tiếng Việt và không thêm ý ngoài nguyên văn.
- source_word: כָל
  choice: tất cả
  rationale: Giữ nguyên ý bao quát toàn bộ nhóm được kiểm kê.
- source_word: בְּכוֹר זָכָר
  choice: các con trai đầu lòng
  rationale: Diễn đạt tự nhiên, đồng thời giữ rõ giới tính nam và địa vị đầu lòng của nhóm được đếm.
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: được kiểm kê theo tên
  rationale: Chuyển thành ngữ kiểm kê Hê-bơ-rơ sang cách nói rõ ràng trong tiếng Việt, cho thấy từng người được tính theo tên chứ không phải ước lượng.
- source_word: מִבֶּן חֹדֶשׁ וָמַעְלָה
  choice: từ một tháng tuổi trở lên
  rationale: Giữ chính xác ngưỡng tuổi trong công thức kiểm kê và phù hợp cách nói tiếng Việt hiện đại.
- source_word: לִפְקֻדֵיהֶם
  choice: Tổng số
  rationale: Cụm từ chỉ kết quả chính thức của việc kiểm kê nhóm này. Đưa ý đó vào đầu câu giúp tiếng Việt tự nhiên mà vẫn bảo toàn chức năng của cụm từ.
- source_word: שְׁנַיִם וְעֶשְׂרִים אֶלֶף שְׁלֹשָׁה וְשִׁבְעִים וּמָאתָיִם
  choice: 22.373 người
  rationale: Con số Hê-bơ-rơ là hai mươi hai nghìn ba trăm bảy mươi ba; cách ghi bằng chữ số rõ ràng, gọn và theo quy ước tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu được sắp xếp theo cấu trúc tổng kết số liệu tự nhiên trong tiếng Việt; dùng “kiểm kê” để phù hợp bối cảnh điều tra dân số, và thêm “người” sau con số để tránh cách diễn đạt khô cứng.
