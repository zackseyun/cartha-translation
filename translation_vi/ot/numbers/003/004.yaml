  text: וַ/יָּ֣מָת נָדָ֣ב וַ/אֲבִיה֣וּא לִ/פְנֵ֣י יְהוָ֡ה בְּֽ/הַקְרִבָ/ם֩ אֵ֨שׁ זָרָ֜ה לִ/פְנֵ֤י יְהוָה֙ בְּ/מִדְבַּ֣ר סִינַ֔י וּ/בָנִ֖ים לֹא הָי֣וּ לָ/הֶ֑ם וַ/יְכַהֵ֤ן אֶלְעָזָר֙ וְ/אִ֣יתָמָ֔ר עַל פְּנֵ֖י אַהֲרֹ֥ן אֲבִי/הֶֽם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/004.yaml
  text: But Nadab and Abihu died before Yahweh when they offered strange fire before Yahweh in the wilderness of Sinai[a], and they had no sons[b]; and Eleazar and Ithamar served as priests in the presence of Aaron their father.
translation:
  language: vi
  text: Na-đáp và A-bi-hu đã chết trước mặt Yahweh khi họ dâng lửa lạ[a] trước mặt Yahweh trong hoang mạc Si-nai. Họ không có con trai. Ê-lê-a-sa và Y-tha-ma thi hành chức tế lễ trước mặt A-rôn, cha họ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “lửa ngoại lai”. Trong bối cảnh tế lễ, tiếng Hê-bơ-rơ có lẽ chỉ thứ lửa không được cho phép dùng trong việc dâng lễ.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể hiểu là “trong thời cha họ là A-rôn còn sống”; cụm từ Hê-bơ-rơ có thể nhấn mạnh rằng Ê-lê-a-sa và Y-tha-ma thi hành chức tế lễ khi A-rôn vẫn còn sống.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: đã chết
  rationale: Động từ מות ở thể kể chuyện thuật lại trực tiếp cái chết; tiếng Việt dùng dạng số nhiều theo chủ ngữ kép mà không cần biến đổi động từ.
- source_word: לִפְנֵי יְהוָה
  choice: trước mặt Yahweh
  rationale: Giữ hình ảnh của thành ngữ Hê-bơ-rơ, có nghĩa là ở trước hoặc trong sự hiện diện của Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời thay vì thay thế bằng một tước hiệu.
- source_word: בְּהַקְרִבָם
  choice: khi họ dâng
  rationale: Cấu trúc giới từ với động từ nguyên thể chỉ hoàn cảnh hoặc thời điểm; trong ngữ cảnh tế lễ, 'dâng' là cách diễn đạt tự nhiên.
- source_word: אֵשׁ זָרָה
  choice: thứ lửa không được phép
  rationale: זָרָה theo nghĩa đen có thể là 'lạ' hoặc 'ngoại lai', nhưng trong bối cảnh nghi lễ chỉ thứ lửa không được cho phép; cách dịch này rõ nghĩa mà không giải thích vượt quá văn cảnh.
- source_word: בְּמִדְבַּר סִינַי
  choice: trong hoang mạc Si-nai
  rationale: Cách dịch trực tiếp, tự nhiên của cụm địa danh, phù hợp văn phong Kinh Thánh hiện đại.
- source_word: וּבָנִים לֹא הָיוּ לָהֶם
  choice: Họ không có con trai
  rationale: בָנִים chỉ rõ con trai, điều có ý nghĩa trong bối cảnh kế nhiệm chức tế lễ.
- source_word: וַיְכַהֵן
  choice: làm chức tế lễ
  rationale: Động từ כהן diễn tả việc thi hành chức năng của thầy tế lễ; cách nói này tự nhiên và trang trọng trong tiếng Việt.
- source_word: עַל פְּנֵי אַהֲרֹן אֲבִיהֶם
  choice: trước mặt cha mình là A-rôn
  rationale: Giữ hình ảnh không gian của thành ngữ עַל־פְּנֵי và không quyết định dứt khoát rằng cụm từ chỉ thời gian, sự hiện diện hay quyền giám sát.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Bản Hê-bơ-rơ dùng trực tiếp danh giao ước; giữ dạng phiên âm giúp phân biệt danh riêng với tước hiệu.
- issue: Ý nghĩa của אֵשׁ זָרָה
  choice: thứ lửa không được phép
  alternative: lửa lạ / lửa ngoại lai
  rationale: Trong ngữ cảnh tế lễ, cụm từ nhiều khả năng nói đến lửa không được chuẩn nhận. Chú thích vẫn bảo lưu các nghĩa sát chữ.
- issue: Ý nghĩa của עַל־פְּנֵי khi nói về A-rôn
  choice: trước mặt cha mình là A-rôn
  alternative: trong thời cha mình là A-rôn còn sống / dưới quyền cha mình là A-rôn
  rationale: Cụm Hê-bơ-rơ có thể hàm ý sự hiện diện hoặc tính đồng thời; bản chính giữ cách nói gần nguyên văn để không áp đặt một cách hiểu duy nhất.
translation_notes:
  register: Văn phong tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng cách phiên âm tên riêng quen thuộc trong truyền thống Kinh Thánh tiếng Việt; giữ hai thành ngữ chỉ sự hiện diện ở dạng gần nguyên văn, đồng thời dùng chú thích để bảo lưu độ mở nghĩa của cụm cuối câu.
