revisions:
- from: Nhưng Na-đáp và A-bi-hu đã chết trước mặt Yahweh khi họ dâng thứ lửa không được phép trước mặt Yahweh trong hoang mạc Si-nai[a]. Họ không có con trai; còn Ê-lê-a-sa và Y-tha-ma thì làm chức tế lễ trước mặt cha mình là A-rôn[b].
  to: Na-đáp và A-bi-hu đã chết trước mặt Yahweh khi họ dâng lửa lạ[a] trước mặt Yahweh trong hoang mạc Si-nai. Họ không có con trai. Ê-lê-a-sa và Y-tha-ma thi hành chức tế lễ trước mặt A-rôn, cha họ[b].
  rationale: Đổi “thứ lửa không được phép” thành “lửa lạ” để giữ sát từ vựng và không áp đặt diễn giải nghi lễ trong bản chính; chuyển phần giải thích sang chú thích. Dời neo [a] đến đúng cụm được chú giải, và thay “làm chức tế lễ” bằng “thi hành chức tế lễ” cho tự nhiên hơn. Cụm “trước mặt A-rôn, cha họ” vẫn bảo lưu hình ảnh và độ mở nghĩa của עַל־פְּנֵי.
  reviewer_model: gpt-5.6-terra
