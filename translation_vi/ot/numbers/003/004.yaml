  verdict: revise
  source_fidelity: 'Bản dịch phản ánh đúng mạch chính của tiếng Hê-bơ-rơ: Na-đáp và A-bi-hu chết khi dâng lửa trước Yahweh, không có con trai, và Ê-lê-a-sa cùng Y-tha-ma thi hành chức tế lễ trước mặt A-rôn. Tuy nhiên, “thứ lửa không được phép” xác định nghĩa nghi lễ của אֵשׁ זָרָה ngay trong bản văn chính, trong khi từ này về mặt từ vựng vẫn có thể là “lửa lạ/ngoại lai”. Nên dùng cách dịch ít diễn giải hơn và để phần giải thích ở chú thích.'
  naturalness: “Làm chức tế lễ” có thể hiểu được nhưng “thi hành chức tế lễ” tự nhiên và trang trọng hơn trong tiếng Việt hiện đại. Tách câu sau dấu chấm phẩy thành các câu riêng cũng làm lời văn rõ ràng hơn mà không thay đổi quan hệ của bản gốc.
  terminology: Giữ “Yahweh” nhất quán với quyết định về danh יהוה. Giữ các dạng tên Na-đáp, A-bi-hu, Si-nai, Ê-lê-a-sa, Y-tha-ma và A-rôn. “Lửa lạ” là thuật ngữ sát chữ, quen thuộc và không đóng nghĩa; chú thích giải thích khả năng “không được phép” trong bối cảnh tế tự.
  issues:
  - severity: medium
    issue: Bản chính dùng “thứ lửa không được phép” cho אֵשׁ זָרָה.
    rationale: Cách này có cơ sở theo ngữ cảnh (x. Lê-vi Ký 10:1), nhưng diễn giải nghĩa “không được cho phép” thay vì bảo lưu độ mở từ vựng “lạ/ngoại lai”. Theo yêu cầu bảo toàn mơ hồ khi nghĩa còn có thể tranh luận, nên đưa cách giải thích này xuống chú thích.
  - severity: low
    issue: Chú thích [a] đang được đặt sau “Si-nai” thay vì ngay sau cụm “lửa ...”.
    rationale: Nội dung chú thích giải thích אֵשׁ זָרָה, không phải địa danh. Di chuyển ký hiệu giúp neo chú thích đúng từ được chú giải.
  - severity: low
    issue: “làm chức tế lễ” hơi kém tự nhiên.
    rationale: “Thi hành chức tế lễ” diễn đạt chức năng của וַיְכַהֵן rõ và tự nhiên hơn trong văn phong Kinh Thánh tiếng Việt hiện đại.
