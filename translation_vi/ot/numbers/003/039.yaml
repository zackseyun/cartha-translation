  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: כָּל פְּקוּדֵ֨י הַ/לְוִיִּ֜ם אֲשֶׁר֩ פָּקַ֨ד מֹשֶׁ֧ה וְׄ/אַׄהֲׄרֹ֛ׄןׄ עַל פִּ֥י יְהוָ֖ה לְ/מִשְׁפְּחֹתָ֑/ם כָּל זָכָר֙ מִ/בֶּן חֹ֣דֶשׁ וָ/מַ֔עְלָ/ה שְׁנַ֥יִם וְ/עֶשְׂרִ֖ים אָֽלֶף־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/039.yaml
  text: All those counted of the Levites[a], whom Moses and Aaron counted at the command of Yahweh, by their clans, every male from a month old and upward, were twenty-two thousand.
translation:
  language: vi
  text: Tổng số người Lê-vi được Môi-se và A-rôn[b] kiểm đếm theo lệnh của Yahweh[a], theo các gia tộc của họ—tất cả người nam từ một tháng tuổi trở lên—là hai mươi hai nghìn người.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “theo miệng của Yahweh”, một thành ngữ có nghĩa là “theo lệnh của Yahweh”.'
    reason: lexical_alternative
  - marker: b
    text: Trong bản Hê-bơ-rơ Masoret, cụm “và A-rôn” có những dấu chấm đặc biệt phía trên, cho biết cụm này được truyền thống sao chép cổ xem là đáng lưu ý.
    reason: textual_variant
lexical_decisions:
- source_word: כָּל פְּקוּדֵי / פָּקַד
  choice: tổng số người… được… kiểm đếm
  rationale: Động từ và danh từ cùng gốc פקד nói về việc kiểm kê dân số và kết quả kiểm kê. “Kiểm đếm” rõ nghĩa trong tiếng Việt hiện đại, còn “tổng số” giúp diễn đạt tự nhiên cấu trúc mở đầu và vị ngữ chỉ con số ở cuối câu.
- source_word: הַלְוִיִּם
  choice: người Lê-vi
  rationale: Cách gọi quen thuộc trong tiếng Việt đối với nhóm thuộc chi phái Lê-vi.
- source_word: עַל פִּי יְהוָה
  choice: theo lệnh của Yahweh
  rationale: Thành ngữ Hê-bơ-rơ có nghĩa đen là “theo miệng của Yahweh”, nhưng trong ngữ cảnh này chỉ mệnh lệnh hoặc sự chỉ định của Ngài.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ danh riêng giao ước được biểu thị bằng Tứ Tự YHWH, thay vì thay bằng một tước hiệu.
- source_word: לְמִשְׁפְּחֹתָם
  choice: theo từng gia tộc của họ
  rationale: מִשְׁפָּחָה ở ngữ cảnh kiểm kê chỉ đơn vị họ hàng trong chi phái; “gia tộc” tự nhiên và rộng hơn “gia đình” theo nghĩa hộ gia đình.
- source_word: כָּל זָכָר
  choice: tất cả người nam
  rationale: Giữ rõ giới tính được nêu trong nguyên văn và phù hợp với công thức kiểm kê.
- source_word: מִבֶּן חֹדֶשׁ וָמַעְלָה
  choice: từ một tháng tuổi trở lên
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt cho ngưỡng tuổi của nguyên văn.
- source_word: שְׁנַיִם וְעֶשְׂרִים אָלֶף
  choice: hai mươi hai ngàn người
  rationale: Chuyển đúng số từ; thêm “người” để câu tiếng Việt rõ và tự nhiên.
theological_decisions:
- issue: Cách chuyển danh Đức Chúa Trời יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Nguyên văn dùng trực tiếp Tứ Tự יְהוָה. Phiên âm “Yahweh” bảo tồn tính chất danh riêng mà không thay nó bằng tước hiệu.
- issue: Các dấu chấm Masoret trên cụm וְאַהֲרֹן
  choice: Giữ “và A-rôn” trong chính văn và ghi chú đặc điểm văn bản
  alternative: Lược bỏ “và A-rôn”
  rationale: Các phụ âm của bản WLC có cụm này, nên bản dịch giữ lại. Những dấu chấm đặc biệt cho thấy truyền thống sao chép xem cụm từ là đáng lưu ý, nhưng tự chúng không đủ căn cứ để loại bỏ khỏi chính văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “kiểm đếm” cho bối cảnh kiểm kê, “gia tộc” cho đơn vị họ hàng, và giữ danh riêng “Yahweh”. Dấu gạch ngang làm rõ cụm giải thích về đối tượng được tính mà không thay đổi quan hệ cú pháp của nguyên văn.
