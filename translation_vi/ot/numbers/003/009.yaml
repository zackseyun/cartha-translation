source:
  edition: WLC
  text: וְ/נָתַתָּה֙ אֶת הַ/לְוִיִּ֔ם לְ/אַהֲרֹ֖ן וּ/לְ/בָנָ֑י/ו נְתוּנִ֨ם נְתוּנִ֥ם הֵ֨מָּה֙ ל֔/וֹ מֵ/אֵ֖ת בְּנֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/009.yaml
  text: You shall give the Levites to Aaron and to his sons[b][a]; they are wholly given to him from among the sons of Israel.
translation:
  language: vi
  text: Ngươi phải trao người Lê-vi cho A-rôn và các con trai ông; họ được trao trọn vẹn[a] cho ông từ giữa con dân Y-sơ-ra-ên[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ lặp lại từ “được trao” để nhấn mạnh: “được trao, được trao”, cũng có thể hiểu là “chắc chắn được trao”.'
    reason: lexical_alternative
  - marker: b
    text: 'Sát nghĩa: “từ giữa các con trai của Y-sơ-ra-ên”; cũng có thể dịch là “từ giữa dân Y-sơ-ra-ên”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּה
  choice: Ngươi phải trao
  rationale: Dạng hoàn thành Qal có liên từ trong ngữ cảnh chỉ thị mang lực mệnh lệnh. “Phải trao” diễn đạt tự nhiên nghĩa vụ được truyền cho Môi-se.
- source_word: הַלְוִיִּם
  choice: người Lê-vi
  rationale: Danh xưng quen thuộc trong tiếng Việt chỉ các thành viên chi phái Lê-vi được biệt riêng để phục vụ nơi thánh.
- source_word: לְאַהֲרֹן וּלְבָנָיו
  choice: cho A-rôn và các con trai ông
  rationale: Giới từ לְ đánh dấu đối tượng tiếp nhận; “cho” phù hợp với động từ trao và giữ rõ quan hệ gia đình trong nguyên văn.
- source_word: נְתוּנִם נְתוּנִם
  choice: được trao trọn vẹn
  rationale: Phân từ bị động được lặp lại nhằm nhấn mạnh. “Được trao trọn vẹn” truyền đạt sắc thái tăng cường mà vẫn tự nhiên; cấu trúc lặp nguyên văn được ghi ở chú thích.
- source_word: הֵמָּה
  choice: họ
  rationale: Đại từ độc lập nhấn mạnh chủ thể. Trong tiếng Việt, “họ” ở đầu mệnh đề kết hợp với vị ngữ nhấn mạnh đã đủ rõ, không cần thêm “chính họ” một cách nặng nề.
- source_word: לוֹ
  choice: cho ông
  rationale: Đại từ số ít giống đực quy chiếu gần nhất về A-rôn; “cho ông” duy trì ý trao giao/phân định.
- source_word: מֵאֵת בְּנֵי יִשְׂרָאֵל
  choice: từ giữa con dân Y-sơ-ra-ên
  rationale: מֵאֵת chỉ nguồn gốc, còn ngữ cảnh cho thấy người Lê-vi được chọn từ cộng đồng Y-sơ-ra-ên. “Con dân Y-sơ-ra-ên” vừa tự nhiên trong tiếng Việt vừa giữ sắc thái cộng đồng giao ước của thành ngữ Hê-bơ-rơ.
theological_decisions:
- issue: Cách dịch בְּנֵי יִשְׂרָאֵל
  choice: con dân Y-sơ-ra-ên
  alternative: các con trai của Y-sơ-ra-ên; dân Y-sơ-ra-ên
  rationale: Danh ngữ Hê-bơ-rơ theo nghĩa đen là “các con trai của Y-sơ-ra-ên”, nhưng ở đây chỉ toàn thể cộng đồng giao ước là nguồn mà người Lê-vi được biệt ra. “Con dân Y-sơ-ra-ên” giữ được sắc thái thuộc về tổ phụ/dân tộc mà không khiến độc giả hiểu sai rằng chỉ nam giới được nói đến; cách sát chữ được bảo tồn trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ngươi” vì đây là lời truyền trực tiếp cho Môi-se trong diễn ngôn luật pháp; tên riêng theo dạng phiên âm Kinh Thánh tiếng Việt quen thuộc. Hai dấu chú thích đều được đặt ngay sau thành phần liên quan.
