  source_fidelity: Bản dịch truyền đạt đúng mệnh lệnh giao người Lê-vi cho A-rôn và các con trai ông, cũng như ý nhấn mạnh của נְתוּנִם נְתוּנִם (“được trao” lặp lại). “Từ giữa con dân Y-sơ-ra-ên” diễn đạt hợp ngữ cảnh việc người Lê-vi được chọn ra từ cộng đồng Y-sơ-ra-ên. Tuy nhiên, chú thích về sự lặp lại trong tiếng Hê-bơ-rơ hiện được neo sau “ông”, không phải sau cụm “được trao trọn vẹn” mà nó giải thích.
  naturalness: Văn phong trang trọng, rõ ràng và phù hợp lối dịch Kinh Thánh tiếng Việt hiện đại. “Ngươi phải” phù hợp lời chỉ thị trực tiếp trong ngữ cảnh này; “người Lê-vi,” “A-rôn,” và “Y-sơ-ra-ên” là các hình thức quen thuộc.
  terminology: 'Các thuật ngữ và tên riêng nhất quán, phù hợp: “người Lê-vi,” “A-rôn,” “con dân Y-sơ-ra-ên.” Cách dịch “được trao trọn vẹn” là một cách tự nhiên để biểu thị sự nhấn mạnh do lặp phân từ bị động, và chú thích bảo tồn hình thức lặp của nguyên ngữ.'
