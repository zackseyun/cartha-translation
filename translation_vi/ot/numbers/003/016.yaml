    rationale: Trong tiếng Việt hiện đại, “kiểm đếm” thường gợi việc đối chiếu hoặc kiểm lại số lượng; “đếm” diễn đạt trực tiếp hơn nghĩa פקד trong ngữ cảnh này.
  - severity: low
