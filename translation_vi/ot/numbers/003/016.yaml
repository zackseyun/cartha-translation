  text: וַ/יִּפְקֹ֥ד אֹתָ֛/ם מֹשֶׁ֖ה עַל פִּ֣י יְהוָ֑ה כַּ/אֲשֶׁ֖ר צֻוָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/016.yaml
  text: So Moses counted them at the command of Yahweh[a], just as he had been commanded.
translation:
  language: vi
  text: Môi-se đã đếm họ theo lệnh của Yahweh,[a] đúng như ông đã được truyền lệnh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nghĩa đen: “theo miệng của Yahweh.”'
    reason: Giải thích nghĩa đen của thành ngữ Hê-bơ-rơ được dịch tự nhiên là “theo lệnh của Yahweh”.
lexical_decisions:
- source_word: וַיִּפְקֹד
  choice: kiểm đếm
  rationale: Trong bối cảnh điều tra dân số và lập danh sách người Lê-vi, động từ פקד chỉ việc xác định và ghi nhận số người; “kiểm đếm” rõ nghĩa và tự nhiên trong tiếng Việt hiện đại.
- source_word: אֹתָם
  choice: họ
  rationale: Đại từ làm tân ngữ, chỉ những người Lê-vi được nhắc đến trong văn cảnh.
- source_word: עַל פִּי יְהוָה
  choice: theo lệnh của Yahweh
  rationale: Thành ngữ עַל־פִּי có nghĩa đen là “theo miệng của” nhưng ở đây diễn tả việc làm theo mệnh lệnh có thẩm quyền của Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Chuyển tự danh riêng của Đức Chúa Trời trong nguyên văn Hê-bơ-rơ, thay vì thay thế bằng một tước hiệu.
- source_word: כַּאֲשֶׁר
  choice: đúng như
  rationale: Diễn tả sự tương ứng chính xác giữa hành động của Môi-se và mệnh lệnh ông đã nhận.
- source_word: צֻוָּה
  choice: ông đã được truyền
  rationale: Giữ thể bị động Pual và hiểu chủ thể là Môi-se theo văn cảnh; “đã được truyền” thể hiện mệnh lệnh có trước hành động kiểm đếm.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Nguyên văn dùng trực tiếp danh giao ước יהוה; chuyển tự “Yahweh” bảo tồn tính chất danh riêng mà không thay bằng tước hiệu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Kiểm đếm” phù hợp bối cảnh thống kê người Lê-vi; cấu trúc “đúng như ông đã được truyền” giữ thể bị động và không nói rõ tác nhân hơn nguyên văn.
