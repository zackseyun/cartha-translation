- from: Vậy, Môi-se kiểm đếm họ theo lệnh của Yahweh,[a] đúng như ông đã được truyền.
  to: Môi-se đã đếm họ theo lệnh của Yahweh,[a] đúng như ông đã được truyền lệnh.
  rationale: Bản sửa loại bỏ sắc thái suy luận không cần thiết của “Vậy”, dùng “đếm” cho cách nói hiện đại và trực tiếp trong ngữ cảnh kiểm kê, và thay “được truyền” bằng “được truyền lệnh” để câu tự nhiên hơn. Ý nghĩa, tính bị động của mệnh đề cuối, danh Yahweh, và chú thích thành ngữ đều được bảo toàn.
