base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/022.yaml
  text: Their numbered ones[a], according to the number of every male from a month old and upward, were seven thousand five hundred.
translation:
  language: vi
  text: Số người được kiểm kê của họ[a], được tính theo tất cả nam giới từ một tháng tuổi trở lên, là bảy nghìn năm trăm người.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “những người đã được đếm trong số họ”. Tiếng Hê-bơ-rơ dùng cùng một thuật ngữ kiểm kê hai lần trong câu này.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּקֻדֵיהֶם
  choice: số người được kiểm kê trong số họ
  rationale: Diễn đạt danh từ chỉ những người đã được đếm trong cuộc kiểm kê dân số; cách dịch này tự nhiên trong tiếng Việt và giữ rõ ý thuộc về nhóm người đang được nói đến.
- source_word: בְּמִסְפַּר כָּל זָכָר
  choice: tức tất cả nam giới
  rationale: Cụm בְּמִסְפַּר nêu phạm vi/căn cứ của con số. Dùng “tức” giúp câu tiếng Việt trôi chảy, còn “tất cả nam giới” giữ nguyên tính xác định theo giới của bản Hê-bơ-rơ.
- source_word: מִבֶּן חֹדֶשׁ וָמָעְלָה
  choice: từ một tháng tuổi trở lên
  rationale: Đây là công thức chỉ ngưỡng tuổi trong các đoạn kiểm kê; cách diễn đạt này chính xác và tự nhiên trong tiếng Việt hiện đại.
- source_word: שִׁבְעַת אֲלָפִים וַחֲמֵשׁ מֵאוֹת
  choice: bảy nghìn năm trăm người
  rationale: Viết số bằng chữ phù hợp với văn xuôi Kinh Thánh; thêm “người” để câu tiếng Việt rõ và tự nhiên.
theological_decisions: []
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Bản dịch ưu tiên cấu trúc tự nhiên của tiếng Việt; sự lặp lại của thuật ngữ kiểm kê trong nguyên văn được ghi nhận ở chú thích thay vì lặp cứng trong câu chính.
