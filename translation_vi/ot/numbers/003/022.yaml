  to: Số người được kiểm kê của họ[a], được tính theo tất cả nam giới từ một tháng tuổi trở lên, là bảy nghìn năm trăm người.
  rationale: Thay “tức” bằng “được tính theo” để phản ánh chức năng của giới từ בְּ trong cụm “theo số mọi nam giới”, và thay “trong số họ” bằng “của họ” để sát với hậu tố sở hữu. Không ép sự lặp lại thuật ngữ kiểm kê trong nguyên văn vào câu tiếng Việt, vì lặp như vậy sẽ gượng; chú thích giữ thông tin văn bản này.
