  source_fidelity: 'Bản nháp phản ánh đúng các động từ chính: תִּפְקֹד là bổ nhiệm/giao phó, וְשָׁמְרוּ là gìn giữ, và יוּמָת là án tử hình mang sắc thái pháp lý. Tuy nhiên, “người ngoài” trong tiếng Việt hiện đại dễ được hiểu chủ yếu là người ở bên ngoài hoặc người ngoại quốc, trong khi הַזָּר ở đây chỉ người không được ủy quyền trong phạm vi chức vụ/thánh lễ.'
