  text: וְ/אֶת אַהֲרֹ֤ן וְ/אֶת בָּנָי/ו֙ תִּפְקֹ֔ד וְ/שָׁמְר֖וּ אֶת כְּהֻנָּתָ֑/ם וְ/הַ/זָּ֥ר הַ/קָּרֵ֖ב יוּמָֽת־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/010.yaml
  text: And you shall appoint Aaron and his sons[a], and they shall keep their priesthood; but the outsider who comes near shall be put to death.
translation:
  language: vi
  text: Ngươi phải bổ nhiệm A-rôn và các con trai ông; họ phải gìn giữ chức vụ tế lễ của mình. Còn người không được phép[a] đến gần thì phải bị xử tử.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “người ngoài”. Từ Hê-bơ-rơ ở đây chỉ người không có thẩm quyền tiếp cận hoặc thi hành chức vụ tế lễ, chứ không nhất thiết là người ngoại quốc về sắc tộc.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּפְקֹד
  choice: phải bổ nhiệm
  rationale: Trong ngữ cảnh A-rôn và các con trai được trao trách nhiệm trông coi chức vụ tế lễ, động từ פקד mang nghĩa bổ nhiệm hoặc giao phó nhiệm vụ, chứ không phải kiểm đếm.
- source_word: וְשָׁמְרוּ
  choice: phải gìn giữ
  rationale: שׁמר vừa có nghĩa giữ gìn vừa có sắc thái canh giữ, bảo vệ. “Gìn giữ” diễn đạt tự nhiên trách nhiệm duy trì và bảo vệ chức vụ cùng các ranh giới của nó.
- source_word: כְּהֻנָּתָם
  choice: chức vụ tế lễ của mình
  rationale: Danh từ này chỉ chức phận và công việc của thầy tế lễ, không chỉ một địa vị trừu tượng. “Chức vụ tế lễ” rõ nghĩa và không gắn riêng với thuật ngữ của một truyền thống giáo phái.
- source_word: הַזָּר
  choice: người ngoài
  rationale: Ở đây זָר chỉ người nằm ngoài phạm vi được phép thi hành hoặc tiếp cận chức vụ tế lễ, không nhất thiết là người ngoại quốc về sắc tộc. Chú thích làm rõ nghĩa theo ngữ cảnh.
- source_word: הַקָּרֵב
  choice: nào đến gần
  rationale: Phân từ của קרב diễn tả việc tiến đến gần phạm vi thánh hoặc chức năng bị giới hạn. Cách dịch này giữ hình ảnh cụ thể và không tự ý xác định ranh giới nghi lễ.
- source_word: יוּמָת
  choice: phải bị xử tử
  rationale: Dạng Hophal của מות có nghĩa bị làm cho chết và mang tính pháp lý-hình phạt, mạnh hơn một lời tiên báo đơn thuần rằng người ấy sẽ chết.
theological_decisions:
- issue: Giới hạn quyền tiếp cận chức vụ tế lễ
  choice: Câu này giao riêng cho A-rôn và các con trai ông trách nhiệm gìn giữ chức vụ tế lễ, đồng thời tuyên án tử hình đối với người không được phép mà đến gần.
  alternative: Có thể hiểu rộng hơn rằng mọi người không phải thầy tế lễ đều bị cấm đến gần nơi thánh, nhưng riêng câu này không xác định đầy đủ các ranh giới nghi lễ cụ thể.
  rationale: Bản dịch giữ nguyên sự nhấn mạnh của tiếng Hê-bơ-rơ về thẩm quyền tế lễ và hậu quả của việc tiếp cận trái phép, nhưng không bổ sung những chi tiết nghi lễ hay lập trường giáo phái không có trong câu.
translation_notes:
  register: Văn phong trang trọng, rõ ràng và hiện đại. Dùng “ngươi” để giữ lối xưng hô trực tiếp, số ít của mệnh lệnh dành cho Môi-se; dùng “chức vụ tế lễ” nhằm diễn đạt chức phận tư tế theo cách dễ hiểu và ít mang dấu ấn hệ phái.
