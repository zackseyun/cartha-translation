  to: Ngươi phải bổ nhiệm A-rôn và các con trai ông; họ phải gìn giữ chức vụ tế lễ của mình. Còn người không được phép[a] đến gần thì phải bị xử tử.
  rationale: 'Thay “người ngoài” bằng “người không được phép” để chuyển tải trực tiếp nghĩa theo ngữ cảnh của הַזָּר: người không được ủy quyền tiếp cận phạm vi hay chức năng tế lễ. Chú thích giữ lại cách hiểu sát từ “người ngoài” và nêu rõ giới hạn nghĩa, nhờ đó bảo tồn sắc thái từ vựng mà không tạo hàm ý sắc tộc không có trong bản gốc.'
