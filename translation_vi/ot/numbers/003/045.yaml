id: NUM.3.45
reference: Numbers 3:45
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: קַ֣ח אֶת הַ/לְוִיִּ֗ם תַּ֤חַת כָּל בְּכוֹר֙ בִּ/בְנֵ֣י יִשְׂרָאֵ֔ל וְ/אֶת בֶּהֱמַ֥ת הַ/לְוִיִּ֖ם תַּ֣חַת בְּהֶמְתָּ֑/ם וְ/הָיוּ לִ֥/י הַ/לְוִיִּ֖ם אֲנִ֥י יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/045.yaml
  text: Take the Levites in place of every firstborn among the sons of Israel[a], and the livestock of the Levites in place of their livestock; and the Levites shall be mine[c][b]. I am Yahweh.
translation:
  language: vi
  text: Hãy lấy người Lê-vi thay cho[b] mọi con đầu lòng trong vòng con cái Y-sơ-ra-ên[a], và lấy gia súc của người Lê-vi thay cho gia súc của họ. Người Lê-vi sẽ thuộc về Ta. Ta là Yahweh[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “trong dân Y-sơ-ra-ên.” Tiếng Hê-bơ-rơ viết sát nghĩa là “trong vòng con cái Y-sơ-ra-ên.”'
    reason: lexical_alternative
  - marker: b
    text: 'Từ Hê-bơ-rơ diễn tả sự thay thế; cũng có thể dịch: “thay thế cho.”'
    reason: lexical_alternative
  - marker: c
    text: 'Tiếng Hê-bơ-rơ: YHWH; theo truyền thống thường được dịch là “CHÚA.”'
    reason: alternative_reading
lexical_decisions:
- source_word: קַח
  choice: Hãy lấy
  rationale: Mệnh lệnh của động từ לקח, truyền cho Môi-se lấy hoặc tiếp nhận người Lê-vi trong vai trò thay thế. “Hãy lấy” giữ được tính trực tiếp của nguyên văn.
- source_word: הַלְוִיִּם
  choice: người Lê-vi
  rationale: Cách gọi tự nhiên trong tiếng Việt đối với các thành viên chi tộc Lê-vi; danh từ tập hợp không cần đánh dấu số nhiều.
- source_word: תַּחַת
  choice: thay cho
  rationale: Trong ngữ cảnh này, từ này diễn tả sự thay thế, không phải vị trí ở bên dưới.
- source_word: כָּל בְּכוֹר
  choice: mọi con đầu lòng
  rationale: Diễn đạt giá trị phân phối của כָּל đi với danh từ số ít בְּכוֹר, đồng thời tự nhiên trong tiếng Việt.
- source_word: בִּבְנֵי יִשְׂרָאֵל
  choice: trong vòng con cái Y-sơ-ra-ên
  rationale: Giữ hình ảnh nguyên văn “con cái của Y-sơ-ra-ên” và thể hiện ý nghĩa bộ phận của giới từ בְּ.
- source_word: בֶּהֱמַת הַלְוִיִּם
  choice: gia súc của người Lê-vi
  rationale: בְּהֵמָה ở đây chỉ chung vật nuôi; “gia súc” là từ tập hợp gọn và phù hợp ngữ cảnh.
- source_word: בְּהֶמְתָּם
  choice: gia súc của họ
  rationale: Giữ đại từ số nhiều của nguyên văn và cấu trúc song song về sự thay thế.
- source_word: וְהָיוּ לִי
  choice: Người Lê-vi sẽ thuộc về Ta
  rationale: Diễn tả rõ quyền sở hữu của Đức Chúa Trời mà vẫn giữ sắc thái tuyên bố trang trọng.
- source_word: אֲנִי יְהוָה
  choice: Ta là Yahweh
  rationale: Giữ công thức Đức Chúa Trời tự xưng và chuyển trực tiếp danh riêng giao ước יהוה.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: CHÚA
  rationale: Nguyên văn dùng trực tiếp danh giao ước יהוה. Phiên âm “Yahweh” phân biệt danh riêng này với tước hiệu và không áp đặt một cách thay thế truyền thống vào chính văn.
- issue: Tính chất thay thế của người Lê-vi
  choice: thay cho
  alternative: ở dưới
  rationale: Ngữ cảnh kiểm đếm con đầu lòng và biệt riêng người Lê-vi đòi hỏi nghĩa thay thế của תַּחַת, nhưng bản dịch không giải thích thêm bản chất thần học của sự thay thế.
translation_notes:
  register: Văn phong hiện đại, trang trọng và trực tiếp. Dùng “Ta” trong lời Đức Chúa Trời tự xưng; giữ tên “Yahweh” và dạng tên quen thuộc “Y-sơ-ra-ên,” “Lê-vi.”
