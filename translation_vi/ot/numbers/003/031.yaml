  text: וּ/מִשְׁמַרְתָּ֗/ם הָ/אָרֹ֤ן וְ/הַ/שֻּׁלְחָן֙ וְ/הַ/מְּנֹרָ֣ה וְ/הַֽ/מִּזְבְּחֹ֔ת וּ/כְלֵ֣י הַ/קֹּ֔דֶשׁ אֲשֶׁ֥ר יְשָׁרְת֖וּ בָּ/הֶ֑ם וְ/הַ֨/מָּסָ֔ךְ וְ/כֹ֖ל עֲבֹדָתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/031.yaml
  text: And their duty was the ark[a], the table, the lampstand, the altars, the vessels of the sanctuary with which they minister, the screen[c][b], and all its service.
translation:
  language: vi
  text: Trách nhiệm của họ là trông coi chiếc hòm, cái bàn, chân đèn, các bàn thờ, các vật dụng thánh dùng trong việc phục vụ, màn che[a], và mọi việc phục vụ liên quan đến đó.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tức là màn treo ở lối vào, không phải bức màn ngăn bên trong.
    reason: cultural_note
lexical_decisions:
- source_word: וּמִשְׁמַרְתָּם
  choice: Phần việc họ phải trông coi là
  rationale: Trong văn cảnh Lều Hội Kiến, từ này chỉ trách nhiệm được giao để chăm nom và phụ trách; cách diễn đạt này tự nhiên trong tiếng Việt và dẫn vào danh sách các vật thuộc trách nhiệm của họ.
- source_word: הָאָרֹן
  choice: Hòm Giao Ước
  rationale: Danh từ chỉ chiếc hòm thánh trong Lều Hội Kiến. Dù nguyên văn chỉ nói 'chiếc hòm', tên gọi quen thuộc này giúp độc giả nhận diện đúng vật mà không thêm cụm 'chứng ước' không có trong câu.
- source_word: הַשֻּׁלְחָן
  choice: bàn
  rationale: Nguyên văn chỉ nói 'cái bàn'; không thêm công dụng hoặc bánh hiện diện.
- source_word: הַמְּנֹרָה
  choice: chân đèn
  rationale: Diễn đạt chức năng của מְנוֹרָה bằng danh từ tiếng Việt thông dụng, thay vì phiên âm.
- source_word: הַמִּזְבְּחֹת
  choice: các bàn thờ
  rationale: Giữ rõ dạng số nhiều của nguyên văn.
- source_word: וּכְלֵי הַקֹּדֶשׁ
  choice: những vật dụng thánh
  rationale: כְּלִים là các dụng cụ hay đồ dùng; cụm sở thuộc הַקֹּדֶשׁ có thể được hiểu là các vật dụng thánh hoặc vật dụng của nơi thánh. Cách chọn này ngắn gọn và tự nhiên.
- source_word: אֲשֶׁר יְשָׁרְתוּ בָהֶם
  choice: dùng để phục vụ
  rationale: Diễn đạt các vật dụng là phương tiện thực hiện việc phục vụ thánh, đồng thời tránh từ ngữ giáo hội hậu kỳ.
- source_word: הַמָּסָךְ
  choice: tấm màn che cửa
  rationale: Trong ngữ cảnh Lều Hội Kiến, מָסָךְ là màn treo ở lối vào, khác với bức màn ngăn bên trong; thêm 'cửa' để xác định chức năng.
- source_word: וְכָל עֲבֹדָתוֹ
  choice: cùng mọi công việc liên quan đến các vật ấy
  rationale: Đại từ hậu tố số ít giống đực có tiền ngữ không hoàn toàn minh nhiên. Tiếng Việt cần diễn đạt tự nhiên; cụm này truyền đạt công việc phục vụ gắn với toàn bộ danh sách mà không thu hẹp vào riêng tấm màn.
theological_decisions:
- issue: Sắc thái phụng tự của שׁרת và עֲבֹדָה
  choice: Dùng 'phục vụ' và 'công việc' trong văn cảnh Lều Hội Kiến
  alternative: Dùng 'thi hành chức vụ' và 'việc phụng sự'
  rationale: Cách chọn giữ được ý phục vụ thánh nhưng không nhập vào câu thuật ngữ giáo hội về sau hoặc làm văn phong quá chuyên biệt.
- issue: Tiền ngữ của hậu tố trong עֲבֹדָתוֹ
  choice: Hiểu theo nghĩa tập hợp là công việc liên quan đến các vật vừa kể
  alternative: Hiểu riêng là mọi công việc liên quan đến tấm màn hoặc nơi thánh
  rationale: Hậu tố số ít được giữ về mặt ý nghĩa nhưng tiền ngữ có thể mơ hồ. Bản dịch tránh khẳng định quá mức một tiền ngữ riêng lẻ.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng cấu trúc hành chính tự nhiên 'phần việc... phải trông coi' cho trách nhiệm của người Kê-hát; giữ danh sách gọn và nhịp nhàng. Dấu chú thích [a] xuất hiện ngay sau cụm được giải thích.
