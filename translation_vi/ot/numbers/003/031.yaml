    text: Tức là màn treo ở lối vào, không phải bức màn ngăn bên trong.
    reason: cultural_note
  revision_rationale: Sửa “Hòm Giao Ước” thành “chiếc hòm” để không thêm định ngữ vắng mặt trong nguồn. Sửa mệnh đề cuối để phản ánh tính mơ hồ của hậu tố số ít, đồng thời giữ sắc thái phục vụ phụng tự của עֲבֹדָה. Chú thích vẫn được neo đúng sau “màn che” và phân biệt màn này với bức màn ngăn bên trong.
