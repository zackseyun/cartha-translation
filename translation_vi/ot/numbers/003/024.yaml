  yaml_path: translation/ot/numbers/003/024.yaml
  text: And the chief of the ancestral house of the Gershonites was Eliasaph son of Lael[a].
translation:
  language: vi
  text: Người đứng đầu gia tộc của người Ghẹt-sôn là Ê-li-a-sáp, con trai La-ên.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn Hê-bơ-rơ là “nhà của cha”, một thuật ngữ thân tộc của người Y-sơ-ra-ên chỉ một đơn vị gia đình phụ hệ hoặc một nhánh thị tộc.
    reason: cultural_note
lexical_decisions:
- source_word: וּ/נְשִׂיא
  choice: Người đứng đầu
  rationale: נָשִׂיא chỉ người lãnh đạo hay thủ lĩnh. Trong ngữ cảnh tổ chức thị tộc, “người đứng đầu” tự nhiên và không gợi ý địa vị hoàng gia. Liên từ וּ được thể hiện qua mạch tiếp nối của câu tiếng Việt, không cần dịch riêng là “và”.
- source_word: בֵית אָב
  choice: gia tộc
  rationale: Cụm từ nguyên nghĩa là “nhà của cha”, một thuật ngữ thân tộc Y-sơ-ra-ên chỉ đơn vị đại gia đình phụ hệ hoặc phân nhánh thị tộc. “Gia tộc” truyền đạt chức năng xã hội ấy rõ ràng trong tiếng Việt hiện đại.
- source_word: לַ/גֵּרְשֻׁנִּי
  choice: của người Ghẹt-sôn
  rationale: Giới từ לַ đánh dấu mối liên hệ với tập thể hậu duệ Ghẹt-sôn; cách nói “người Ghẹt-sôn” tự nhiên và mang nghĩa tập thể trong tiếng Việt.
- source_word: אֶלְיָסָף
  choice: Ê-li-a-sáp
  rationale: Phiên âm tên riêng Hê-bơ-rơ theo lối quen thuộc, dễ đọc trong tiếng Việt.
- source_word: בֶּן
  choice: con trai
  rationale: Cách diễn đạt phả hệ trực tiếp và rõ nghĩa.
- source_word: לָאֵל
  choice: La-ên
  rationale: Phiên âm tên riêng Hê-bơ-rơ לָאֵל, giữ hai thành tố âm tiết của tên.
