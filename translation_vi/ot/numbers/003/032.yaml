base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/032.yaml
  text: And the chief over the chiefs of the Levites was Eleazar son of Aaron the priest, having oversight of those who kept charge of the sanctuary.
translation:
  language: vi
  text: Còn người đứng đầu các thủ lĩnh của người Lê-vi là Ê-lê-a-sa, con trai của A-rôn, thầy tế lễ. Ông giám sát những người đảm trách việc trông coi nơi thánh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “các vật thánh”. Từ Hê-bơ-rơ הַקֹּדֶשׁ có thể chỉ chính nơi thánh hoặc những vật thánh gắn với nơi ấy.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/נְשִׂיא
  choice: Còn người đứng đầu
  rationale: נָשִׂיא chỉ người lãnh đạo hoặc người đứng đầu. Trong bối cảnh tổ chức người Lê-vi, “người đứng đầu” diễn đạt rõ cấp bậc mà không gợi ý địa vị hoàng gia; “Còn” nối câu này với mạch liệt kê trước đó.
- source_word: נְשִׂיאֵי הַלֵּוִי
  choice: các thủ lĩnh của người Lê-vi
  rationale: Cụm sở hữu theo sát tiếng Hê-bơ-rơ; khi kết hợp với “người đứng đầu”, câu tự nhiên diễn đạt người có quyền chỉ huy trên các thủ lĩnh thuộc những nhóm Lê-vi.
- source_word: אֶלְעָזָר בֶּן אַהֲרֹן הַכֹּהֵן
  choice: Ê-lê-a-sa, con trai thầy tế lễ A-rôn
  rationale: Giữ quan hệ cha con trong nguyên văn. Cách đặt “thầy tế lễ” trước A-rôn làm rõ danh hiệu này bổ nghĩa cho A-rôn, không phải Ê-lê-a-sa.
- source_word: פְּקֻדַּת
  choice: Ông giám sát
  rationale: Danh từ này có thể chỉ quyền hoặc trách nhiệm trông nom, giám sát. Chuyển thành động từ tạo câu tiếng Việt tự nhiên mà vẫn giữ chức năng quản lý của Ê-lê-a-sa.
- source_word: שֹׁמְרֵי מִשְׁמֶרֶת
  choice: những người đảm trách việc trông coi
  rationale: Động tính từ và danh từ cùng gốc nhấn mạnh một trách nhiệm được giao. Cách dịch này giữ cả ý thi hành nhiệm vụ lẫn ý canh giữ, trông nom.
- source_word: הַקֹּדֶשׁ
  choice: nơi thánh
  rationale: Trong ngữ cảnh Đền Tạm, từ này có thể chỉ khu vực thánh hoặc các vật thánh. “Nơi thánh” phù hợp với đối tượng được trông coi, còn nghĩa kia được bảo lưu trong chú thích.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “thầy tế lễ” theo thuật ngữ Kinh Thánh quen thuộc; phiên âm tên riêng theo cách dùng tiếng Việt phổ biến. Tách mệnh đề giám sát thành câu thứ hai để tránh cấu trúc nặng nhưng không thêm quan hệ ý nghĩa ngoài nguyên văn.
