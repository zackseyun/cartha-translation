  text: 'Rồi Yahweh phán với Môi-se[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ: “Và Yahweh phán với Môi-se rằng.” Liên từ mở đầu cũng có thể dịch là “Và”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Rồi ... phán
  rationale: Dạng waw-consecutive tiếp nối và đẩy câu chuyện tiến lên; “Rồi” tự nhiên trong văn thuật sự tiếng Việt, còn “phán” phù hợp khi chủ thể là Đức Chúa Trời.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng cách phiên âm danh riêng của Đức Chúa Trời đã quen thuộc trong tiếng Việt, thay vì thay thế bằng một tước hiệu.
- source_word: אֶל
  choice: với
  rationale: Trong cấu trúc tiếng Việt “phán với”, từ này diễn đạt tự nhiên hướng lời nói đến người nhận.
- source_word: מֹשֶׁה
  choice: Môi-se
  rationale: Cách phiên âm tên riêng Moses quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
- source_word: לֵאמֹר
  choice: dấu hai chấm
  rationale: Động từ nguyên mẫu này mở đầu nội dung lời phán ở câu kế tiếp; trong tiếng Việt hiện đại, dấu hai chấm truyền đạt chức năng ấy tự nhiên hơn việc thêm “rằng” vào một câu đứng riêng.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Đức Giê-hô-va
  alternative: Yahweh; CHÚA
  rationale: Bản Hê-bơ-rơ dùng trực tiếp danh riêng יהוה. Bản dịch giữ danh riêng thay vì thay bằng tước hiệu; “Đức Giê-hô-va” là dạng Việt hóa quen thuộc và trang trọng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dấu hai chấm báo trước lời phán tiếp theo, tránh câu kết bằng “rằng” thiếu tự nhiên trong tiếng Việt.
