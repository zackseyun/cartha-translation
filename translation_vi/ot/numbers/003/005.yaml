base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/005.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: vi
  text: 'Yahweh[a] phán với Môi-se rằng:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hê-bơ-rơ: YHWH, danh riêng của Đức Chúa Trời; cũng thường được phiên là “Yahweh” hoặc “Giê-hô-va”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: phán
  rationale: Động từ Piel của דבר trong công thức mở đầu lời phán của Đức Chúa Trời được chuyển là “phán”, vừa tự nhiên vừa giữ sắc thái trang trọng; liên từ וַ được thể hiện qua sự tiếp nối của mạch văn thay vì bắt buộc thêm “và” ở đầu câu.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng cách phiên âm danh riêng của Đức Chúa Trời đã quen thuộc trong tiếng Việt, thay vì thay bằng một tước hiệu.
- source_word: אֶל
  choice: với
  rationale: Trong cấu trúc chỉ hành động nói hướng đến một người, “phán với” là cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: מֹשֶׁה
  choice: Môi-se
  rationale: Dùng dạng phiên âm tên riêng quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
- source_word: לֵאמֹר
  choice: rằng
  rationale: Động từ nguyên mẫu này giới thiệu nội dung lời phán ở câu kế tiếp; “rằng” là cách nối gọn và tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Đức Giê-hô-va
  alternative: Yahweh (Gia-vê)
  rationale: Nguyên văn dùng trực tiếp danh bốn phụ âm יהוה. Bản dịch giữ đây là danh riêng, không thay bằng tước hiệu “CHÚA”; “Đức Giê-hô-va” là dạng tiếng Việt dễ nhận biết, còn cách phát âm cổ chính xác của danh này không hoàn toàn chắc chắn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dấu hai chấm cho biết lời phán trực tiếp sẽ tiếp tục ở câu sau.
