translation_notes:
  register: Văn phong trang trọng, rõ ràng và hiện đại. Dùng “người đứng đầu” thay cho từ mang sắc thái quân chủ; phân biệt “gia tộc” với “thị tộc” để phản ánh hai cấp đơn vị thân tộc trong câu.
