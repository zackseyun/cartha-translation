base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/035.yaml
  text: And the chief of the ancestral house of the clans of Merari was Zuriel son of Abihail[b][a]. They were to camp on the north side of the tabernacle.
translation:
  language: vi
  text: Người đứng đầu đơn vị gia tộc theo dòng cha[a] của các thị tộc Mê-ra-ri là Xu-ri-ên, con trai A-bi-hai. Họ phải đóng trại ở phía bắc Đền Tạm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “nhà cha”, một thuật ngữ thân tộc chỉ một đại gia đình hoặc đơn vị gia tộc theo dòng cha.'
    reason: cultural_note
lexical_decisions:
- source_word: וּנְשִׂיא
  choice: Người đứng đầu
  rationale: נָשִׂיא chỉ một người lãnh đạo được thừa nhận; trong bối cảnh tổ chức các thị tộc, “người đứng đầu” tự nhiên và tránh sắc thái quân chủ của “hoàng tử”.
- source_word: בֵית אָב
  choice: gia tộc
  rationale: Cụm từ nguyên nghĩa là “nhà cha”, chỉ đơn vị thân tộc theo dòng cha. “Gia tộc” dễ hiểu trong tiếng Việt hiện đại và phù hợp với cấp tổ chức được nói đến.
- source_word: לְמִשְׁפְּחֹת מְרָרִי
  choice: của các thị tộc Mê-ra-ri
  rationale: מִשְׁפָּחוֹת ở đây là các phân nhánh thân tộc thuộc Mê-ra-ri; “thị tộc” giúp phân biệt với בֵית אָב ở cấp bao quát hơn.
- source_word: צוּרִיאֵל בֶּן אֲבִיחָיִל
  choice: Xu-ri-ên, con trai A-bi-hai
  rationale: Phiên âm tên riêng sang tiếng Việt và diễn đạt בֶּן theo công thức gia phả tự nhiên.
- source_word: עַל יֶרֶךְ הַמִּשְׁכָּן ... צָפֹנָה
  choice: ở phía bắc Đền Tạm
  rationale: יֶרֶךְ có nghĩa là cạnh hoặc sườn; kết hợp với trạng từ chỉ hướng צָפֹנָה, cụm này tự nhiên nhất là “ở phía bắc”. מִשְׁכָּן trong ngữ cảnh này được dịch là “Đền Tạm”.
- source_word: יַחֲנוּ
  choice: Họ phải đóng trại
  rationale: Thể chưa hoàn thành diễn tả vị trí đóng trại được quy định, nên “phải đóng trại” giữ được sắc thái chỉ định.
