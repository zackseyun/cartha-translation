revisions:
- from: Người đứng đầu gia tộc của các thị tộc Mê-ra-ri là Xu-ri-ên, con trai A-bi-hai[a]. Họ phải đóng trại ở phía bắc Đền Tạm.
  to: Người đứng đầu đơn vị gia tộc theo dòng cha[a] của các thị tộc Mê-ra-ri là Xu-ri-ên, con trai A-bi-hai. Họ phải đóng trại ở phía bắc Đền Tạm.
  rationale: Sửa cụm thuật ngữ thân tộc để phản ánh rõ hơn bֵּית אָב mà vẫn dùng tiếng Việt hiện đại; dời neo chú thích đến đúng cụm từ được giải thích. Các thành tố còn lại, gồm tên riêng, chức danh, và vị trí đóng trại, được giữ nguyên vì phù hợp với nguyên ngữ.
