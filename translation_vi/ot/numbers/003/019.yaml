  text: וּ/בְנֵ֥י קְהָ֖ת לְ/מִשְׁפְּחֹתָ֑/ם עַמְרָ֣ם וְ/יִצְהָ֔ר חֶבְר֖וֹן וְ/עֻזִּיאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/019.yaml
  text: 'And the sons of Kohath, by their clans: Amram, Izhar, Hebron, and Uzziel.'
translation:
  language: vi
  text: Các con trai của Kê-hát, theo từng thị tộc của họ, là Am-ram, Dít-ha, Hếp-rôn và U-xi-ên.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי
  choice: Các con trai của
  rationale: בְּנֵי là dạng số nhiều liên kết của “con trai”; trong danh sách gia phả có thể chỉ con cháu rộng hơn, nhưng ở đây các tên được liệt kê là những người con và tổ phụ của các thị tộc. Liên từ וּ được thể hiện tự nhiên qua sự tiếp nối của danh sách, không cần dịch cứng là “Và” ở đầu câu tiếng Việt.
- source_word: קְהָת
  choice: Kê-hát
  rationale: Tên riêng được phiên âm theo lối quen dùng trong Kinh Thánh tiếng Việt, giúp độc giả phổ thông dễ đọc.
- source_word: לְמִשְׁפְּחֹתָם
  choice: theo từng thị tộc của họ
  rationale: מִשְׁפָּחָה ở đây chỉ đơn vị thân tộc trong cơ cấu bộ tộc Israel; “thị tộc” chính xác hơn “gia đình”, còn “theo từng” diễn đạt rõ chức năng phân loại của giới từ לְ.
- source_word: עַמְרָם
  choice: Am-ram
  rationale: Phiên âm tên riêng theo lối Việt hóa, có dấu gạch nối để dễ đọc.
- source_word: וְיִצְהָר
  choice: Dít-ha
  rationale: Phiên âm tên riêng; liên từ được xử lý bằng dấu câu trong chuỗi liệt kê tiếng Việt.
- source_word: חֶבְרוֹן
  choice: Hếp-rôn
  rationale: Tên người trong ngữ cảnh gia phả, dù cùng hình thức với tên địa danh Hếp-rôn.
- source_word: וְעֻזִּיאֵל
  choice: và U-xi-ên
  rationale: Phiên âm tên riêng và giữ liên từ cuối danh sách bằng “và” theo cú pháp tiếng Việt tự nhiên.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và rõ ràng; giữ cấu trúc của một danh sách gia phả nhưng thêm “là” để câu tiếng Việt tự nhiên. Dùng “thị tộc” nhằm phản ánh đơn vị xã hội rộng hơn gia đình hạt nhân.
