  source_fidelity: 'Bản dịch phản ánh sát cấu trúc và nội dung tiếng Hê-bơ-rơ: cụm “các con trai của Kê-hát” tương ứng וּבְנֵי קְהָת, và “theo từng thị tộc của họ” diễn đạt phù hợp לְמִשְׁפְּחֹתָם trong ngữ cảnh danh sách gia phả/thị tộc. Bốn tên riêng được giữ đầy đủ, đúng thứ tự: Am-ram, Dít-ha, Hếp-rôn, U-xi-ên. Việc không dịch liên từ đầu câu bằng “Và” vẫn bảo tồn chức năng nối tiếp danh sách một cách tự nhiên trong tiếng Việt.'
  naturalness: 'Câu văn rõ ràng, trang trọng, và tự nhiên cho văn cảnh gia phả: “Các con trai của Kê-hát, theo từng thị tộc của họ, là ...” Dấu phẩy và “và” cuối danh sách được dùng đúng chuẩn tiếng Việt. Cụm “theo từng thị tộc của họ” không gây mơ hồ đáng kể và phù hợp văn phong hiện đại.'
  terminology: “Thị tộc” là lựa chọn tốt cho מִשְׁפָּחָה trong bối cảnh cơ cấu thân tộc Israel, tránh thu hẹp nghĩa thành gia đình hạt nhân. Các dạng tên phiên âm nhất quán theo lối Việt hóa Kinh Thánh và không nhầm Hếp-rôn là địa danh.
