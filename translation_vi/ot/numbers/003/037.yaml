  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַמֻּדֵי
  choice: các trụ
  rationale: Dạng số nhiều liên kết chỉ những bộ phận thẳng đứng nâng đỡ hàng rào sân; “trụ” tự nhiên và phù hợp với kiến trúc Đền Tạm.
- source_word: הֶחָצֵר
  choice: sân
  rationale: Chỉ khu sân của Đền Tạm; “sân” là cách nói rõ ràng, thông dụng trong tiếng Việt hiện đại.
- source_word: סָבִיב
  choice: bao quanh
  rationale: Diễn tả vị trí quanh chu vi sân; cách dịch này giữ ý bao bọc mà vẫn tự nhiên.
- source_word: אַדְנֵיהֶם
  choice: các đế trụ
  rationale: Trong mô tả Đền Tạm, từ này chỉ các đế hoặc ổ dùng để giữ trụ; “đế trụ” rõ nghĩa hơn “đế” đứng riêng và tránh thuật ngữ quá chuyên môn.
- source_word: יְתֵדֹתָם
  choice: các cọc
  rationale: Chỉ những cọc dùng để neo giữ kết cấu; “cọc” ngắn gọn và tự nhiên trong tiếng Việt.
- source_word: מֵיתְרֵיהֶם
  choice: các dây
  rationale: Chỉ dây dùng cùng với cọc để neo giữ; “dây” là từ phổ thông, phù hợp ngữ cảnh.
- source_word: וְ
  choice: cùng / và
  rationale: Các liên từ lặp lại nối câu này với danh sách trước và liên kết từng hạng mục; dùng “cùng” ở đầu rồi liệt kê bằng dấu phẩy và “và” để câu tiếng Việt tự nhiên.
