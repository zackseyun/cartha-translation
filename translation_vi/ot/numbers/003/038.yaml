  text: וְ/הַ/חֹנִ֣ים לִ/פְנֵ֣י הַ/מִּשְׁכָּ֡ן קֵ֣דְמָ/ה לִ/פְנֵי֩ אֹֽהֶל מוֹעֵ֨ד מִזְרָ֜חָ/ה מֹשֶׁ֣ה וְ/אַהֲרֹ֣ן וּ/בָנָ֗י/ו שֹֽׁמְרִים֙ מִשְׁמֶ֣רֶת הַ/מִּקְדָּ֔שׁ לְ/מִשְׁמֶ֖רֶת בְּנֵ֣י יִשְׂרָאֵ֑ל וְ/הַ/זָּ֥ר הַ/קָּרֵ֖ב יוּמָֽת־׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/038.yaml
  text: Those who camped in front of the tabernacle on the east[a], in front of the tent of meeting toward the sunrise, were Moses and Aaron and his sons, keeping charge of the sanctuary on behalf of the sons of Israel[b]. But the outsider who comes near shall be put to death.
translation:
  language: vi
  text: Những người đóng trại phía trước Đền Tạm, về phía đông[a]—phía trước Lều Hội Kiến, hướng mặt trời mọc—là Môi-se, A-rôn và các con trai ông. Họ canh giữ nơi thánh, thi hành phận sự thay cho con dân Y-sơ-ra-ên. Nhưng người ngoài[b] nào đến gần sẽ bị xử tử.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “về hướng đông ... ở phía đông”; tiếng Hê-bơ-rơ dùng hai cách nói gần nghĩa về phương hướng để nhấn mạnh.'
    reason: lexical_alternative
  - marker: b
    text: “Người ngoài” ở đây là người không được phép đến gần hoặc tham gia công việc nơi thánh, chứ không nhất thiết là người ngoại quốc về sắc tộc.
    reason: cultural_note
lexical_decisions:
- source_word: וְהַחֹנִים
  choice: Những người đóng trại
  rationale: Phân từ được danh từ hóa, chỉ những người được bố trí đóng trại tại vị trí này; cách diễn đạt tự nhiên trong tiếng Việt và phù hợp với ngữ cảnh sắp xếp trại.
- source_word: לִפְנֵי הַמִּשְׁכָּן
  choice: phía trước Đền Tạm
  rationale: Giữ nghĩa không gian của לִפְנֵי và phân biệt מִשְׁכָּן với אֹהֶל מוֹעֵד ở vế kế tiếp.
- source_word: קֵדְמָה ... מִזְרָחָה
  choice: về phía đông ... hướng mặt trời mọc
  rationale: Dùng hai cách diễn đạt khác nhau để bảo toàn hai từ chỉ phương hướng có quan hệ gần nghĩa và sắc thái nhấn mạnh trong tiếng Hê-bơ-rơ.
- source_word: אֹהֶל מוֹעֵד
  choice: Lều Hội Kiến
  rationale: Thuật ngữ rõ ràng, trang trọng và quen thuộc, chỉ chiếc lều nơi diễn ra cuộc hội kiến.
- source_word: מֹשֶׁה וְאַהֲרֹן וּבָנָיו
  choice: Môi-se, A-rôn và các con trai ông
  rationale: Đại từ sở hữu số ít giống đực gần nhất và tự nhiên nhất quy về A-rôn; câu dịch vẫn giữ nguyên hình thức số ít của nguyên văn.
- source_word: שֹׁמְרִים מִשְׁמֶרֶת הַמִּקְדָּשׁ
  choice: giữ phận sự nơi thánh
  rationale: Diễn đạt cấu trúc đồng căn bằng một cụm tiếng Việt tự nhiên, giữ cả ý trách nhiệm được giao lẫn việc trông coi phạm vi thánh.
- source_word: לְמִשְׁמֶרֶת בְּנֵי יִשְׂרָאֵל
  choice: thay cho con dân Y-sơ-ra-ên
  rationale: Cho thấy Môi-se, A-rôn và các con trai A-rôn thi hành trách nhiệm liên quan đến nơi thánh với tư cách đại diện cho cộng đồng Y-sơ-ra-ên, mà không giải thích quá mức.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: con dân Y-sơ-ra-ên
  rationale: Cách gọi tự nhiên trong tiếng Việt hiện đại đối với dân giao ước nói chung, đồng thời vẫn giữ sắc thái cộng đồng thuộc về Y-sơ-ra-ên.
- source_word: וְהַזָּר
  choice: người ngoài
  rationale: Trong luật về nơi thánh, từ này chỉ người không được phép đảm nhận hoặc tiếp cận công việc thánh, chứ không nhất thiết là người ngoại quốc về sắc tộc.
- source_word: הַקָּרֵב
  choice: nào đến gần
  rationale: Giữ trực tiếp ý của phân từ chỉ hành động tiến đến gần khu vực hoặc công việc thánh.
- source_word: יוּמָת
  choice: sẽ bị xử tử
  rationale: Thể Hophal biểu thị việc bị làm cho chết như một hình phạt được thi hành, không chỉ đơn thuần là sẽ chết.
theological_decisions:
- issue: Đối tượng được chỉ bởi “các con trai ông”
  choice: “ông” chỉ A-rôn
  alternative: Hiểu rộng là con cái hoặc gia quyến gắn với cả Môi-se và A-rôn
  rationale: Hậu tố đại từ số ít đứng sau A-rôn tự nhiên nhất quy về A-rôn; trong ngữ cảnh này, nhiệm vụ tư tế thuộc về A-rôn và các con trai ông.
- issue: Ý nghĩa của זָר trong luật về nơi thánh
  choice: Người không được phép đến gần hoặc tham gia công việc thánh
  alternative: Người ngoại quốc về sắc tộc hoặc người xa lạ theo nghĩa xã hội thông thường
  rationale: Ngữ cảnh trực tiếp nói về quyền tiếp cận Đền Tạm và trách nhiệm tư tế, nên sự phân biệt dựa trên thẩm quyền thánh, không dựa trên sắc tộc.
- issue: Quan hệ của cụm לְמִשְׁמֶרֶת בְּנֵי יִשְׂרָאֵל
  choice: Thi hành phận sự liên quan đến nơi thánh thay cho cộng đồng Y-sơ-ra-ên
  alternative: Chỉ canh giữ nhằm bảo vệ con dân Y-sơ-ra-ên
  rationale: Cụm từ có thể gợi cả trách nhiệm đại diện và chức năng bảo vệ; “thay cho” thể hiện ý đại diện phù hợp ngữ cảnh nhưng không thêm một cơ chế thần học ngoài câu.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Đền Tạm” và “Lều Hội Kiến” để phân biệt hai danh xưng trong nguyên văn; dấu gạch ngang giúp câu mô tả vị trí dài vẫn rõ cấu trúc. Danh xưng riêng được phiên âm theo lối quen thuộc trong Kinh Thánh tiếng Việt.
