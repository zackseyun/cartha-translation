    rationale: Nguyên văn nhấn mạnh việc canh giữ/giữ gìn trách nhiệm đối với nơi thánh. Trong tiếng Việt, “giữ phận sự” chủ yếu có nghĩa là đảm trách chức vụ, nên không chuyển tải rõ khía cạnh canh giữ. “Canh giữ nơi thánh, thi hành phận sự...” giữ được cả hai nét nghĩa mà không thêm diễn giải.
