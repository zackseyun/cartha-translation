revisions:
- from: Những người đóng trại phía trước Đền Tạm, về phía đông[a]—phía trước Lều Hội Kiến, hướng mặt trời mọc—là Môi-se, A-rôn và các con trai ông. Họ giữ phận sự nơi thánh thay cho con dân Y-sơ-ra-ên. Nhưng người ngoài[b] nào đến gần sẽ bị xử tử.
  to: Những người đóng trại phía trước Đền Tạm, về phía đông[a]—phía trước Lều Hội Kiến, hướng mặt trời mọc—là Môi-se, A-rôn và các con trai ông. Họ canh giữ nơi thánh, thi hành phận sự thay cho con dân Y-sơ-ra-ên. Nhưng người ngoài[b] nào đến gần sẽ bị xử tử.
  rationale: Chỉ sửa cụm diễn tả nhiệm vụ tại nơi thánh để phản ánh rõ hơn động từ “canh giữ” và danh từ “phận sự/canh giữ” trong nguyên văn. Các lựa chọn khác, kể cả sắc thái đại diện của “thay cho,” được giữ nguyên vì phù hợp ngữ cảnh và chú thích hiện có.
