base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/034.yaml
  text: And those counted among them[a], by the number of every male from a month old and upward, were six thousand two hundred.
translation:
  language: vi
  text: Số người được kiểm kê của họ[a], tính theo tất cả nam giới từ một tháng tuổi trở lên, là sáu ngàn hai trăm người.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “những người đã được đếm của họ” hoặc “những người được đăng ký của họ.” Tiếng Hê-bơ-rơ chỉ tổng số người của nhóm này trong cuộc kiểm kê.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפְקֻדֵיהֶם
  choice: Số người được kiểm kê trong vòng họ
  rationale: Danh từ kết quả ở số nhiều, kèm hậu tố ngôi thứ ba số nhiều, chỉ những người thuộc nhóm này đã được ghi nhận trong cuộc kiểm kê; cách dịch này vừa giữ ý người được đếm vừa tự nhiên trong tiếng Việt.
- source_word: בְּמִסְפַּר כָּל זָכָר
  choice: tức tất cả nam giới
  rationale: Cụm này xác định thành phần tạo nên tổng số kiểm kê. Dùng “tức” giúp công thức thống kê trở nên rõ và tự nhiên, còn “tất cả nam giới” giữ đúng phạm vi giống đực của זָכָר.
- source_word: מִבֶּן חֹדֶשׁ וָמָעְלָה
  choice: từ một tháng tuổi trở lên
  rationale: Cách nói tuổi tối thiểu quen thuộc trong tiếng Việt, bảo toàn cả mốc một tháng tuổi lẫn ý kéo dài lên các độ tuổi cao hơn.
- source_word: שֵׁשֶׁת אֲלָפִים וּמָאתָיִם
  choice: sáu ngàn hai trăm người
  rationale: Diễn đạt số đếm bằng chữ theo văn phong Kinh Thánh; thêm “người” để câu tiếng Việt trọn nghĩa và xác định rõ đây là tổng số người.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Kiểm kê” phù hợp với bối cảnh thống kê dân số; “trong vòng họ” tránh cách hiểu rằng những người ấy được lấy ra khỏi nhóm. Dùng “ngàn” là dạng thông dụng, trang trọng trong tiếng Việt hiện đại.
