  to: Số người được kiểm kê của họ[a], tính theo tất cả nam giới từ một tháng tuổi trở lên, là sáu ngàn hai trăm người.
  rationale: Sửa “trong vòng họ” thành “của họ” để giữ quan hệ sở thuộc trong hậu tố Hê-bơ-rơ mà không thêm một khái niệm về quan hệ họ hàng. Sửa “tức” thành “tính theo” để phản ánh rõ hơn công thức thống kê בְּמִסְפַּר כָּל זָכָר. Chú thích được chỉnh cho khớp với cách diễn đạt mới và vẫn bảo lưu các khả năng từ vựng của וּפְקֻדֵיהֶם.
