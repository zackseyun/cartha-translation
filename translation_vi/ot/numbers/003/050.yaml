base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/050.yaml
  text: From the firstborn of the sons of Israel he took the silver[a], one thousand three hundred sixty-five shekels[b], according to the sanctuary shekel.
translation:
  language: vi
  text: Ông đã thu từ các con trai đầu lòng của dân Y-sơ-ra-ên số bạc[a] là một ngàn ba trăm sáu mươi lăm siếc-lơ, theo tiêu chuẩn siếc-lơ của nơi thánh[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Bạc” ở đây được dùng làm phương tiện thanh toán, tức là tiền bạc.
    reason: lexical_alternative
  - marker: b
    text: 'Nghĩa đen: “theo siếc-lơ của nơi thánh”; cụm từ này chỉ tiêu chuẩn trọng lượng của nơi thánh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵאֵת
  choice: từ
  rationale: Giới từ chỉ nguồn mà từ đó khoản bạc được thu; “từ” tự nhiên và không diễn giải quá mức.
- source_word: בְּכוֹר בְּנֵי יִשְׂרָאֵל
  choice: các con đầu lòng của con dân Y-sơ-ra-ên
  rationale: Danh từ số ít ở dạng liên kết mang nghĩa tập thể. Cách dịch này giữ ý chỉ các con trai đầu lòng trong bối cảnh kiểm kê và chuộc lại, đồng thời diễn đạt tự nhiên hơn cấu trúc sát chữ “các con trai của Y-sơ-ra-ên”.
- source_word: לָקַח
  choice: đã thu
  rationale: Động từ cơ bản có nghĩa là “lấy”; trong ngữ cảnh nhận khoản bạc chuộc, “thu” là cách diễn đạt tiếng Việt tự nhiên mà vẫn giữ hành động chủ động.
- source_word: הַכָּסֶף
  choice: số bạc
  rationale: כֶּסֶף chỉ bạc và, theo nghĩa mở rộng, tiền. “Số bạc” giữ chất liệu được nêu trong nguyên văn và phù hợp với đơn vị siếc-lơ theo sau.
- source_word: חֲמִשָּׁה וְשִׁשִּׁים וּשְׁלֹשׁ מֵאוֹת וָאֶלֶף
  choice: một ngàn ba trăm sáu mươi lăm
  rationale: Chuyển các thành phần số trong tiếng Hê-bơ-rơ thành số đếm chuẩn, rõ ràng trong tiếng Việt.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: theo siếc-lơ nơi thánh
  rationale: Cụm từ nêu tiêu chuẩn cân đo của nơi thánh. “Theo” làm rõ đây là chuẩn dùng để tính, không nhất thiết là một đồng tiền riêng biệt.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “siếc-lơ” làm từ phiên âm cho đơn vị trọng lượng cổ; giữ “Y-sơ-ra-ên” theo lối phiên âm Kinh Thánh quen thuộc. Đại từ “ông” quy chiếu về Môi-se từ văn cảnh trước.
