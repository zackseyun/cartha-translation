  to: Ông đã thu từ các con trai đầu lòng của dân Y-sơ-ra-ên số bạc[a] là một ngàn ba trăm sáu mươi lăm siếc-lơ, theo tiêu chuẩn siếc-lơ của nơi thánh[b].
  rationale: Sửa “các con đầu lòng” thành “các con trai đầu lòng” để giữ tham chiếu giống đực và bối cảnh của nguyên ngữ. Sửa cụm cuối thành “theo tiêu chuẩn siếc-lơ của nơi thánh” cho tiếng Việt tự nhiên hơn và để nêu rõ đây là chuẩn cân đo. Các số liệu, đơn vị, tên riêng, và hai điểm neo chú thích được giữ nguyên.
