source:
  edition: WLC
  text: וְ/הִקְרִיתֶ֤ם לָ/כֶם֙ עָרִ֔ים עָרֵ֥י מִקְלָ֖ט תִּהְיֶ֣ינָה לָ/כֶ֑ם וְ/נָ֥ס שָׁ֨מָּ/ה֙ רֹצֵ֔חַ מַכֵּה נֶ֖פֶשׁ בִּ/שְׁגָגָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/011.yaml
  text: then you shall designate cities for yourselves; they shall be cities of refuge for you, and the manslayer who strikes down a person unintentionally shall flee there.
translation:
  language: vi
  text: thì anh em phải chọn cho mình những thành[a]; các thành ấy sẽ là những thành trú ẩn cho anh em. Người giết người, tức là người đánh chết một người do vô ý[b], sẽ chạy trốn đến đó.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “ấn định” hoặc “dành riêng” những thành cho mình.'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn Hê-bơ-rơ: “người giết người, người đánh chết một người do vô ý”; tức là người gây ra cái chết không chủ ý, không phải người cố ý sát hại.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִקְרִיתֶם
  choice: phải chọn
  rationale: Dạng Hiphil ở đây nói đến việc khiến một số thành được tuyển chọn hoặc ấn định cho chức năng pháp lý cụ thể. “Phải chọn” tự nhiên trong tiếng Việt và giữ được sắc thái quy định.
- source_word: עָרִים ... עָרֵי מִקְלָט
  choice: những thành ... những thành trú ẩn
  rationale: Giữ sự lặp lại của nguyên văn để bảo toàn tính nhấn mạnh và rõ ràng pháp lý. “Thành trú ẩn” diễn đạt nơi được dành làm chỗ bảo hộ cho người chạy trốn.
- source_word: מִקְלָט
  choice: trú ẩn
  rationale: Trong bối cảnh luật pháp này, từ ngữ chỉ một nơi chạy đến để được che chở; “trú ẩn” vừa chính xác vừa dễ hiểu trong tiếng Việt hiện đại.
- source_word: וְנָס שָׁמָּה
  choice: sẽ chạy trốn đến đó
  rationale: Động từ trong chuỗi quy định mang ý nghĩa tương lai hoặc kết quả được dự liệu. Cách dịch này giữ lực của mệnh đề mà không biến nó thành một khả năng đơn thuần.
- source_word: רֹצֵחַ
  choice: người giết người
  rationale: Từ này chỉ người gây ra cái chết của một người. Cụm “do vô ý” ngay sau đó loại trừ ý nghĩa giết người có chủ tâm; cách dịch trực tiếp tránh áp thêm phán quyết đạo đức không có trong câu.
- source_word: מַכֵּה נֶפֶשׁ
  choice: người đánh chết một người
  rationale: Cách dịch giữ hình ảnh của động từ “đánh” đồng thời nói rõ hậu quả gây chết người trong bối cảnh.
- source_word: נֶפֶשׁ
  choice: một người
  rationale: Ở đây từ này chỉ một con người là nạn nhân của hành vi gây chết, chứ không nhấn mạnh “linh hồn” như một thực thể phi vật chất.
- source_word: בִּשְׁגָגָה
  choice: do vô ý
  rationale: Cụm từ diễn tả hành vi không có chủ ý hoặc xảy ra do sơ suất, phù hợp với sự phân biệt pháp lý giữa cố sát và gây chết người không chủ ý.
theological_decisions:
- issue: Phân loại pháp lý của người gây chết người
  choice: Dịch רֹצֵחַ là “người giết người” nhưng giữ ngay phần giải thích “người đánh chết một người do vô ý”.
  alternative: “kẻ sát nhân” hoặc “người phạm tội giết người”
  rationale: “Kẻ sát nhân” và “người phạm tội giết người” dễ hàm ý hành vi cố ý và phán quyết tội trạng. Bản dịch được chọn giữ cách gọi mạnh của nguyên văn nhưng để chính cụm “do vô ý” xác định loại hành vi, bảo toàn sự phân biệt của luật pháp trong câu.
translation_notes:
  register: Dùng tiếng Việt hiện đại, trang trọng và dễ hiểu. “Anh em” phù hợp với lời truyền dạy dành cho cộng đồng Y-sơ-ra-ên và tự nhiên hơn “các ngươi”. Dấu chấm tách hai vế dài để câu rõ ràng, trong khi vẫn giữ sự lặp lại mang tính pháp lý của nguyên văn.
