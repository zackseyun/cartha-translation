  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: כָּל מַ֨כֵּה נֶ֔פֶשׁ לְ/פִ֣י עֵדִ֔ים יִרְצַ֖ח אֶת הָ/רֹצֵ֑חַ וְ/עֵ֣ד אֶחָ֔ד לֹא יַעֲנֶ֥ה בְ/נֶ֖פֶשׁ לָ/מֽוּת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/030.yaml
  text: Whoever strikes down a person[a], the murderer shall be put to death on the testimony of witnesses[b]; but one witness shall not testify against a person for death.
translation:
  language: vi
  text: Kẻ nào đánh chết một người, thì kẻ sát nhân phải bị xử tử[a] căn cứ vào lời khai của các nhân chứng[b]; nhưng lời khai của một nhân chứng duy nhất không đủ để kết án tử hình một người.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tiếng Hê-bơ-rơ dùng cùng một gốc từ cho “kẻ sát nhân” và động từ chỉ việc xử chết người ấy.
    reason: lexical_alternative
  - marker: b
    text: 'Theo nghĩa đen: “theo miệng các nhân chứng”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַכֵּה נֶפֶשׁ
  choice: đánh chết một người
  rationale: Cụm phân từ chỉ người đánh một con người đến chết. Trong văn cảnh luật pháp này, נֶפֶשׁ là một người hay mạng người, không phải “linh hồn” theo nghĩa đối lập với thân thể.
- source_word: לְפִי עֵדִים
  choice: căn cứ vào lời khai của các nhân chứng
  rationale: Thành ngữ Hê-bơ-rơ theo nghĩa đen là “theo miệng các nhân chứng”, nhưng trong ngữ cảnh xét xử chỉ việc căn cứ vào lời chứng của họ.
- source_word: יִרְצַח אֶת הָרֹצֵחַ
  choice: kẻ sát nhân phải bị xử tử
  rationale: Tiếng Hê-bơ-rơ dùng cùng gốc רצח cho hành động xử chết và cho “kẻ sát nhân”. Bản dịch dùng thể bị động pháp lý để không khiến việc thi hành bản án bị hiểu là hành vi sát nhân trái pháp luật.
- source_word: הָרֹצֵחַ
  choice: kẻ sát nhân
  rationale: Văn cảnh phân biệt người cố ý giết người và phải chịu án tử hình với người vô ý làm chết người; “kẻ sát nhân” diễn đạt đúng mức độ quy trách nhiệm.
- source_word: וְעֵד אֶחָד לֹא יַעֲנֶה בְנֶפֶשׁ לָמוּת
  choice: nhưng lời khai của một nhân chứng duy nhất không đủ để kết án tử hình một người
  rationale: 'Câu Hê-bơ-rơ cô đọng nói một nhân chứng không được làm chứng chống lại một người “cho sự chết”. Cách dịch này nêu rõ hiệu lực pháp lý: lời khai đơn độc không đủ làm căn cứ cho án tử hình.'
theological_decisions:
- issue: Điều kiện chứng cứ trong án tử hình
  choice: Diễn đạt rằng lời khai của một nhân chứng duy nhất không đủ để kết án tử hình.
  alternative: 'Dịch sát hình thức: “một nhân chứng không được làm chứng chống lại một người để người ấy phải chết”.'
  rationale: Cách chọn giữ nguyên nguyên tắc pháp lý của câu mà không ngụ ý rằng nhân chứng duy nhất bị cấm cung cấp bất kỳ lời khai nào; điều bị bác bỏ là dùng lời khai đơn độc làm căn cứ cho án tử hình.
translation_notes:
  register: Văn phong luật pháp trang trọng nhưng hiện đại. “Đánh chết” giữ hình ảnh hành động bạo lực của מַכֵּה, “kẻ sát nhân” thể hiện tính quy trách nhiệm, còn “kết án tử hình” làm rõ hệ quả tư pháp của mệnh đề cuối.
