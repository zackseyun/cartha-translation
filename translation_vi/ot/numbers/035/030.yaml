  terminology: '“Kẻ sát nhân” và “bị xử tử” phân biệt thích hợp giữa người phạm tội giết người và việc thi hành án theo thủ tục pháp lý, tránh hàm ý rằng tòa án “sát nhân”. Các chú thích được đặt đúng chỗ: [a] giải thích quan hệ gốc từ quanh “xử tử/kẻ sát nhân”; [b] giải thích thành ngữ לְפִי עֵדִים.'
