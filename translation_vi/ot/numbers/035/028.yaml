source:
  edition: WLC
  text: כִּ֣י בְ/עִ֤יר מִקְלָט/וֹ֙ יֵשֵׁ֔ב עַד מ֖וֹת הַ/כֹּהֵ֣ן הַ/גָּדֹ֑ל וְ/אַחֲרֵ֥י מוֹת֙ הַ/כֹּהֵ֣ן הַ/גָּדֹ֔ל יָשׁוּב֙ הָ/רֹצֵ֔חַ אֶל אֶ֖רֶץ אֲחֻזָּתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/028.yaml
  text: For he must remain in his city of refuge until the death of the high priest[b][a], and after the death of the high priest the manslayer may return to the land of his possession.
translation:
  language: vi
  text: Vì người ấy phải ở trong thành trú ẩn của mình cho đến khi thượng tế qua đời; và sau khi thượng tế qua đời, người đã giết người[a] có thể trở về phần đất thuộc quyền sở hữu của mình[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “người gây chết người.” Từ Hê-bơ-rơ ở đây là một phạm trù pháp lý trong luật về các thành trú ẩn, không nhất thiết có nghĩa là “kẻ sát nhân.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “đất sở hữu của mình” hoặc “phần đất riêng của mình.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Vì
  rationale: Giữ chức năng giải thích nguyên do của mệnh đề pháp lý đi trước.
- source_word: בְעִיר מִקְלָטוֹ
  choice: trong thành trú ẩn của mình
  rationale: Diễn đạt tự nhiên thuật ngữ pháp lý chỉ thành được dành làm nơi trú ẩn, đồng thời giữ đại từ sở hữu trong nguyên văn.
- source_word: יֵשֵׁב
  choice: phải ở
  rationale: Trong văn cảnh luật pháp, động từ không chỉ nói đến việc cư trú mà còn hàm ý nghĩa vụ phải tiếp tục ở lại.
- source_word: עַד מוֹת הַכֹּהֵן הַגָּדֹל
  choice: cho đến khi thượng tế qua đời
  rationale: Cách nói tự nhiên trong tiếng Việt, truyền đạt chính xác giới hạn thời gian của nguyên văn.
- source_word: הַכֹּהֵן הַגָּדֹל
  choice: thượng tế
  rationale: Thuật ngữ tiếng Việt trang trọng, quen dùng cho chức vụ tư tế cao nhất.
- source_word: הָרֹצֵחַ
  choice: người đã giết người
  rationale: Giữ nghĩa pháp lý rộng của danh từ trong luật về thành trú ẩn, không mặc nhiên kết luận người ấy phạm tội sát nhân có chủ ý.
- source_word: יָשׁוּב
  choice: có thể trở về
  rationale: Trong ngữ cảnh, việc trở về được pháp luật cho phép sau thời gian bị hạn chế; cách dịch này tránh biến câu thành lời tiên báo hay mệnh lệnh.
- source_word: אֶל אֶרֶץ אֲחֻזָּתוֹ
  choice: trở về phần đất thuộc quyền sở hữu của mình
  rationale: Thể hiện nghĩa đất đai hay bất động sản được nắm giữ hợp pháp của אֲחֻזָּה mà không đưa thêm sắc thái thần học của từ 'cơ nghiệp'.
theological_decisions:
- issue: Có nên dịch הָרֹצֵחַ là “kẻ sát nhân” hay dùng một cách gọi ít định tội hơn
  choice: người đã giết người
  alternative: kẻ sát nhân
  rationale: Luật về các thành trú ẩn phân biệt hành vi giết người có chủ ý với trường hợp gây chết người không chủ ý. “Kẻ sát nhân” sẽ áp đặt một phán quyết đạo đức và pháp lý mà câu này tự nó không xác định.
translation_notes:
  register: Văn phong pháp lý, trang trọng nhưng hiện đại và dễ hiểu. Câu giữ sự lặp lại của cụm “thượng tế qua đời” như trong nguyên văn, đồng thời đặt các dấu chú thích ngay sau những từ ngữ mà chúng giải thích.
