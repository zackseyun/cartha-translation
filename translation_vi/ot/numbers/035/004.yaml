base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/004.yaml
  text: And the pasture lands of the cities that you give to the Levites shall be from the wall of the city outward a thousand cubits all around[a][b].
translation:
  language: vi
  text: Đất trống[a] của các thành mà anh em cấp cho người Lê-vi sẽ được đo từ tường thành[b] trở ra một ngàn cu-bít về mọi phía.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “đất chung” hoặc “đồng cỏ”, chỉ vùng đất bao quanh các thành.
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn Hê-bơ-rơ là “từ tường thành”; một số người hiểu rộng hơn là “từ ranh giới thành”.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִגְרְשֵׁי
  choice: phần đất trống quanh
  rationale: Danh từ מִגְרָשׁ chỉ vùng đất để trống bao quanh một khu định cư, tại đây được dành cho các thành của người Lê-vi. Cách dịch này giữ nghĩa rộng hơn 'đồng cỏ', vì chức năng chăn thả tuy phù hợp với văn cảnh nhưng không phải là nét nghĩa duy nhất.
- source_word: הֶעָרִים
  choice: các thành
  rationale: עִיר có thể là thành hoặc thị trấn; 'các thành' phù hợp với cách gọi các thành của người Lê-vi trong đoạn văn.
- source_word: אֲשֶׁר תִּתְּנוּ
  choice: mà anh em cấp
  rationale: Mệnh đề quan hệ diễn tả những thành được dân Y-sơ-ra-ên giao cho người Lê-vi; 'cấp' tự nhiên trong ngữ cảnh phân đất và vẫn giữ sắc thái chỉ thị hướng tới tương lai.
- source_word: לַלְוִיִּם
  choice: cho người Lê-vi
  rationale: Dịch trực tiếp đối tượng tiếp nhận; tiếng Việt dùng 'người Lê-vi' như danh từ tập hợp.
- source_word: מִקִּיר הָעִיר
  choice: từ tường thành
  rationale: קִיר theo nghĩa thông thường là 'tường'. Cách dịch giữ nghĩa trực tiếp, còn khả năng hiểu rộng hơn là ranh giới thành được ghi ở chú thích.
- source_word: וָחוּצָה
  choice: trở ra
  rationale: Hình thức này chỉ hướng ra phía ngoài; 'trở ra' là cách diễn đạt tự nhiên khi nói về điểm bắt đầu của phép đo.
- source_word: אֶלֶף אַמָּה
  choice: một ngàn cu-bít
  rationale: Giữ nguyên đơn vị đo cổ và con số cụ thể của nguyên văn, không quy đổi theo một độ dài hiện đại vốn có thể tạo cảm giác chính xác hơn chứng cứ.
- source_word: סָבִיב
  choice: về mọi phía
  rationale: Diễn đạt rõ phép đo áp dụng bao quanh thành, tương ứng với ý nghĩa chu vi của סָבִיב.
theological_decisions: []
translation_notes:
  register: Văn phong trang trọng, sáng rõ và hiện đại. Dùng 'anh em' cho ngôi thứ hai số nhiều trong lời truyền cho cộng đồng Y-sơ-ra-ên; dùng 'phần đất trống quanh' để bảo toàn phạm vi nghĩa của thuật ngữ thay vì giới hạn vào một công dụng duy nhất.
