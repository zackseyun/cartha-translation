id: NUM.35.33
reference: Numbers 35:33
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/לֹֽא תַחֲנִ֣יפוּ אֶת הָ/אָ֗רֶץ אֲשֶׁ֤ר אַתֶּם֙ בָּ֔/הּ כִּ֣י הַ/דָּ֔ם ה֥וּא יַחֲנִ֖יף אֶת הָ/אָ֑רֶץ וְ/לָ/אָ֣רֶץ לֹֽא יְכֻפַּ֗ר לַ/דָּם֙ אֲשֶׁ֣ר שֻׁפַּךְ בָּ֔/הּ כִּי אִ֖ם בְּ/דַ֥ם שֹׁפְכֽ/וֹ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/033.yaml
  text: You shall not pollute the land in which you are[a], for blood pollutes the land, and no atonement can be made for the land for the blood that was shed in it[b], except by the blood of the one who shed it.
translation:
  language: vi
  text: Anh em không được làm ô uế đất nơi mình đang ở, vì chính máu làm ô uế đất. Không thể chuộc tội cho đất về máu đã đổ trên đó[a], ngoại trừ bằng máu của kẻ đã làm đổ máu ấy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “không thể thanh tẩy đất khỏi tội máu đã đổ trên đó.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַחֲנִיפוּ / יַחֲנִיף (חנף, Hiphil)
  choice: làm ô uế
  rationale: Trong ngữ cảnh máu vô tội bị đổ, động từ chỉ sự ô nhiễm về đạo đức và nghi lễ, không chỉ sự ô nhiễm vật chất. “Làm ô uế” tự nhiên trong tiếng Việt và giữ được sắc thái đạo đức–thánh thiêng.
- source_word: הָאָרֶץ
  choice: vùng đất / đất
  rationale: Chỉ miền đất nơi dân đang cư ngụ, không nhất thiết là toàn thể địa cầu. Lần đầu dùng “vùng đất” để làm rõ ý lãnh thổ; lần sau dùng “đất” cho câu văn tự nhiên.
- source_word: כִּי הַדָּם הוּא
  choice: vì chính máu
  rationale: Đại từ הוּא làm nổi bật chủ thể “máu”; “chính máu” chuyển tải sự nhấn mạnh ấy mà vẫn tự nhiên.
- source_word: יְכֻפַּר
  choice: chuộc tội
  rationale: Thể bị động của כפר ở đây nói đến việc giải trừ tội máu khỏi đất. “Chuộc tội cho đất” giữ sắc thái nghi lễ–đạo đức và dễ hiểu hơn thuật ngữ chuyên môn như “xá tội” hay “đền tội”.
- source_word: שֻׁפַּךְ
  choice: đã đổ
  rationale: “Đổ máu” là cách nói pháp lý và văn chương tự nhiên trong tiếng Việt về hành vi giết người.
- source_word: כִּי אִם
  choice: ngoại trừ
  rationale: Cụm từ nêu phương cách duy nhất được phép, nên “ngoại trừ” vừa chính xác vừa gọn.
- source_word: בְּדַם שֹׁפְכוֹ
  choice: bằng máu của chính kẻ đã làm đổ máu ấy
  rationale: Hậu tố quy chiếu về máu đã bị đổ; cách diễn đạt này làm rõ đó là máu của kẻ giết người, đồng thời không thêm cách giải thích vượt quá câu văn.
theological_decisions:
- issue: Máu làm ô uế đất theo nghĩa nào
  choice: Giữ ý máu bị đổ gây ô uế thật sự về đạo đức–thánh thiêng cho đất.
  alternative: Hiểu đây chỉ là ẩn dụ về rối loạn xã hội hoặc chỉ là vấn đề tư pháp dân sự.
  rationale: Việc lặp lại חנף và dùng כפר cho thấy câu này nói đến tội máu làm ô uế đất và nhu cầu chuộc tội, chứ không chỉ nói đến hậu quả xã hội.
- issue: Phương cách chuộc tội cho đất
  choice: 'Giữ nguyên mệnh đề loại trừ: chỉ bằng máu của kẻ đã làm đổ máu.'
  alternative: Diễn giải trực tiếp thành “chỉ bằng việc xử tử kẻ sát nhân”.
  rationale: Ngữ cảnh luật pháp hỗ trợ cách hiểu về hình phạt dành cho kẻ sát nhân, nhưng bản dịch giữ hình ảnh và cấu trúc thần học của nguyên văn thay vì thay nó bằng lời diễn giải.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” cho đại từ số nhiều hướng đến cộng đồng; lặp “làm ô uế” theo nguyên văn để giữ mối liên hệ nhân quả. Dấu [a] được đặt ngay sau mệnh đề mà chú thích giải thích.
