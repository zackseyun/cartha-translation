revisions:
- from: Anh em không được làm ô uế vùng đất mình đang ở, vì chính máu làm ô uế đất. Không thể chuộc tội cho đất vì máu đã đổ trên đó[a], ngoại trừ bằng máu của chính kẻ đã làm đổ máu ấy.
  to: Anh em không được làm ô uế đất nơi mình đang ở, vì chính máu làm ô uế đất. Không thể chuộc tội cho đất về máu đã đổ trên đó[a], ngoại trừ bằng máu của kẻ đã làm đổ máu ấy.
  rationale: Đổi “vì máu đã đổ trên đó” thành “về máu đã đổ trên đó” để thể hiện rõ hơn quan hệ cú pháp của לַדָּם với động từ כפר, mà không thay đổi nghĩa cơ bản hay làm giảm tính tự nhiên của câu. Các lựa chọn còn lại được giữ vì phù hợp với nguyên văn và văn phong tiếng Việt hiện đại.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T10:22:43Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch truyền đạt đúng các ý chính: lời cấm làm ô uế đất, máu làm ô uế đất, và chỉ máu của kẻ làm đổ máu mới giải quyết được tình trạng ấy. Tuy nhiên, cụm “chuộc tội cho đất vì máu” có thể khiến quan hệ của לַדָּם (“về/liên quan đến máu”) bị hiểu đơn thuần là nguyên nhân. Dùng “về máu” phản ánh cú pháp và ý nghĩa nguyên văn sát hơn.'
  naturalness: “Vùng đất mình đang ở” và “làm ô uế” đều tự nhiên, trang trọng. “Không thể chuộc tội cho đất về máu đã đổ trên đó” rõ quan hệ ngữ nghĩa hơn, đồng thời vẫn là tiếng Việt hiện đại. Cách nói ở vế cuối được giữ gần nguyên văn mà không diễn giải thành việc xử tử.
  terminology: “Làm ô uế” thích hợp cho חנף trong ngữ cảnh đạo đức–nghi lễ. “Chuộc tội” giữ được trường nghĩa của כפר; chú thích dùng “thanh tẩy” như một cách diễn đạt thay thế hữu ích. Không cần thêm diễn giải giáo phái.
  issues:
  - severity: low
    issue: Quan hệ của “máu” với việc chuộc tội chưa được phản ánh rõ
