  text: וְ/אִם בְּ/שִׂנְאָ֖ה יֶהְדָּפֶ֑/נּוּ אֽוֹ הִשְׁלִ֥יךְ עָלָ֛י/ו בִּ/צְדִיָּ֖ה וַ/יָּמֹֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/020.yaml
  text: But if he pushed him in hatred[a], or threw something at him intentionally, and he died,
translation:
  language: vi
  text: Nhưng nếu vì căm ghét mà xô người ấy, hoặc cố ý[a] ném vật gì vào người ấy, và người ấy chết,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “do ác ý” hoặc “trong khi mai phục”; từ Hê-bơ-rơ hàm ý chủ tâm thù địch và có thể bao gồm việc rình sẵn để tấn công.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Nhưng nếu
  rationale: Mở đầu một trường hợp có điều kiện, tương phản với trường hợp vô ý ở phần trước; “Nhưng nếu” diễn đạt tự nhiên lực đối lập trong ngữ cảnh.
- source_word: בְּשִׂנְאָה
  choice: vì căm ghét
  rationale: Cụm giới từ và danh từ chỉ động cơ hoặc cách thức; “vì căm ghét” làm rõ động cơ thù ghét mà không thêm ý ngoài nguyên văn.
- source_word: יֶהְדָּפֶנּוּ
  choice: xô người ấy
  rationale: Động từ chỉ hành động đẩy hoặc xô; “xô” phù hợp với bối cảnh luật về án mạng và không cường điệu thành đánh hay hạ sát.
- source_word: אוֹ
  choice: hoặc
  rationale: Liên từ phân cách, đưa ra hành động thay thế.
- source_word: הִשְׁלִיךְ עָלָיו
  choice: ném vật gì vào người ấy
  rationale: Động từ có nghĩa là ném/quăng, còn vật được ném bị lược trong tiếng Hê-bơ-rơ; thêm “vật gì” để câu tiếng Việt rõ và tự nhiên, còn “vào người ấy” giữ hướng tấn công của hành động.
- source_word: בִּצְדִיָּה
  choice: cố ý[a]
  rationale: Trong văn cảnh pháp lý, từ này biểu thị chủ ý thù địch, có thể hàm ý rình sẵn hoặc mai phục. “Cố ý” truyền đạt rõ nét nghĩa pháp lý cốt lõi, còn sắc thái cụ thể hơn được giữ trong chú thích.
- source_word: וַיָּמֹת
  choice: và người ấy chết
  rationale: Giữ cấu trúc hệ quả tường thuật của tiếng Hê-bơ-rơ mà không diễn giải quá mức quan hệ nhân quả.
theological_decisions: []
translation_notes:
  register: Văn phong luật pháp trang trọng nhưng hiện đại và dễ hiểu. Dùng “người ấy” để tránh sự mơ hồ đại từ trong tiếng Việt; giữ câu chưa trọn ý vì điều luật tiếp tục sang câu sau.
