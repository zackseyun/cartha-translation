  to: Các thành ấy sẽ là nơi họ cư ngụ, còn những vùng đất trống quanh các thành ấy[a] sẽ dành cho gia súc của họ, tài sản của họ và mọi con vật của họ.
  rationale: Bản sửa chỉ làm rõ các hậu tố sở hữu có trong nguyên ngữ và số nhiều của các thành. Chú thích b được giữ trong bộ chú thích để bảo tồn lựa chọn từ vựng cho “tài sản”, dù không cần một ký hiệu chú thích riêng trong câu dịch vì không có điểm mơ hồ đáng kể cần đánh dấu tại vị trí đó.
