  yaml_path: translation/ot/numbers/035/003.yaml
  text: The cities shall be for them to live in[a], and their pasturelands shall be for their livestock, for their possessions[b], and for all their animals.
translation:
  language: vi
  text: Các thành ấy sẽ là nơi họ cư ngụ, còn những vùng đất trống quanh các thành ấy[a] sẽ dành cho gia súc của họ, tài sản của họ và mọi con vật của họ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “đồng cỏ quanh thành” hoặc “đất chung quanh thành”. Từ Hê-bơ-rơ chỉ vùng đất mở bao quanh các thành, ở đây đặc biệt thích hợp cho việc chăn thả.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶעָרִים
  choice: các thành ấy
  rationale: עִיר chỉ thành hoặc thị trấn; trong bối cảnh phân chia các thành cho người Lê-vi, “các thành ấy” vừa tự nhiên vừa nối rõ với các thành đã được nhắc đến.
- source_word: לָשָׁבֶת
  choice: là nơi họ cư ngụ
  rationale: Động từ ישׁב ở dạng nguyên mẫu diễn tả mục đích cư trú; cách dịch này giữ ý “để ở” nhưng phù hợp với văn phong trang trọng, hiện đại.
- source_word: מִגְרְשֵׁיהֶם
  choice: những vùng đất trống quanh thành
  rationale: מִגְרָשׁ là phần đất mở bao quanh thành, được dùng ở đây đặc biệt cho vật nuôi; cách dịch không thu hẹp nghĩa hoàn toàn thành đồng cỏ.
- source_word: לִבְהֶמְתָּם
  choice: dành cho gia súc
  rationale: בְּהֵמָה ở đây chỉ chung vật nuôi đã được thuần dưỡng; “gia súc” là cách gọi hiện đại và phù hợp với ngữ cảnh sử dụng đất.
- source_word: לִרְכֻשָׁם
  choice: tài sản
  rationale: רְכוּשׁ chỉ tài sản hoặc của cải thuộc quyền sở hữu; “tài sản” giữ sắc thái pháp lý-hành chính của đoạn văn.
- source_word: וּלְכֹל חַיָּתָם
  choice: và mọi súc vật của họ
  rationale: חַיָּה theo ngữ cảnh chỉ các con vật thuộc về họ. “Súc vật” duy trì sự phân biệt khả dĩ với בְּהֵמָה mà không biến cụm từ thành nghĩa rộng “mọi sinh vật”.
