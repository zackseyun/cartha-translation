translation_notes:
  register: Bản dịch dùng tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Cấu trúc câu giữ hai chức năng song song của các thành và phần đất quanh thành; thuật ngữ đất đai được diễn đạt rõ mà vẫn bảo lưu phạm vi nghĩa của từ Hê-bơ-rơ.
