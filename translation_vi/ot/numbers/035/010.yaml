  yaml_path: translation/ot/numbers/035/010.yaml
  text: Speak to the sons of Israel and say to them[a], ‘When you cross the Jordan into the land of Canaan,’
translation:
  language: vi
  text: 'Hãy nói với con cái Y-sơ-ra-ên và bảo họ: ‘Khi các ngươi vượt sông Giô-đanh vào đất Ca-na-an,’'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דַּבֵּר
  choice: Hãy nói với
  rationale: Động từ mệnh lệnh Piel, kết hợp với אֶל, truyền đạt trực tiếp mệnh lệnh phải nói với một đối tượng.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: con cái Y-sơ-ra-ên
  rationale: Giữ hình ảnh gia tộc của nguyên ngữ (‘các con trai/con cái của Y-sơ-ra-ên’) nhưng dùng cách diễn đạt tiếng Việt tự nhiên, có tính bao quát trong ngữ cảnh cộng đồng giao ước.
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: và bảo họ
  rationale: Giữ cả động từ thứ hai trong cấu trúc ‘hãy nói… và bảo…’, đồng thời tránh lối lặp nặng nề trong tiếng Việt.
- source_word: כִּי
  choice: Khi
  rationale: Trong ngữ cảnh này, từ nối mở đầu hoàn cảnh tương lai; ‘khi’ diễn đạt tự nhiên giá trị thời gian mà không biến lời này thành điều kiện bất định.
- source_word: אַתֶּם עֹבְרִים
  choice: các ngươi vượt
  rationale: Đại từ cùng phân từ diễn tả hành động sắp xảy ra; hiện tại trong mệnh đề có ‘khi’ chuyển tải phù hợp ý nghĩa tương lai gần.
- source_word: אֶת הַיַּרְדֵּן
  choice: sông Giô-đanh
  rationale: Thêm danh từ loại ‘sông’ để địa danh rõ ràng, tự nhiên đối với độc giả Việt, dù nguyên văn chỉ dùng tên Giô-đanh với mạo từ.
- source_word: אַרְצָה כְּנָעַן
  choice: vào đất Ca-na-an
  rationale: Hậu tố chỉ hướng trên אֶרֶץ biểu thị chuyển động đi vào vùng đất, nên ‘vào’ chính xác hơn cách nói chỉ hướng chung.
theological_decisions: []
translation_notes:
  register: Văn phong trang trọng, rõ ràng và phù hợp lời phán trong luật pháp. Dùng ‘các ngươi’ để giữ số nhiều và sắc thái trực tiếp của אַתֶּם; dùng các dạng địa danh quen thuộc trong truyền thống Kinh Thánh tiếng Việt. Không cần chú thích vì ‘con cái Y-sơ-ra-ên’ vừa gần nguyên ngữ vừa dễ hiểu.
