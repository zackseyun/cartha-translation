base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/018.yaml
  text: Or if he struck him with a wooden object in the hand[a], by which one could die, and he died, he is a murderer; the murderer must surely be put to death.
translation:
  language: vi
  text: Hoặc nếu người ấy dùng một vật bằng gỗ cầm trong tay[a], có thể gây chết người, đánh người kia, và người kia chết, thì người ấy là kẻ sát nhân; kẻ sát nhân chắc chắn phải bị xử tử.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “một dụng cụ bằng gỗ cầm trong tay” hoặc “một vật bằng gỗ cầm tay.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּכְלִי עֵץ יָד
  choice: dùng một vật bằng gỗ cầm trong tay
  rationale: כְּלִי là từ rộng, có thể chỉ vật dụng, dụng cụ hoặc khí cụ; trong luật về án mạng ở đây, “vật” giữ được độ rộng ấy. יָד cho thấy vật này được cầm hoặc sử dụng bằng tay.
- source_word: אֲשֶׁר יָמוּת בּוֹ
  choice: có thể gây chết người
  rationale: Mệnh đề mô tả khả năng gây chết của vật được dùng, chứ không chỉ nhắc lại kết quả của trường hợp cụ thể.
- source_word: הִכָּהוּ
  choice: đánh nạn nhân
  rationale: נכה có nghĩa là đánh hoặc giáng đòn. “Nạn nhân” làm rõ đại từ chỉ người bị đánh trong tiếng Việt mà không thêm một phán đoán pháp lý mới.
- source_word: וַיָּמֹת
  choice: và nạn nhân chết
  rationale: 'Giữ trình tự trực tiếp của tiếng Hê-bơ-rơ: hành vi đánh rồi cái chết xảy ra, không diễn giải thêm quan hệ nhân quả ngoài văn bản.'
- source_word: רֹצֵחַ
  choice: kẻ sát nhân
  rationale: Trong ngữ cảnh luật pháp phân biệt giết người có tội với ngộ sát, từ này chỉ người phạm tội giết người; “kẻ sát nhân” truyền đạt rõ sự định tội.
- source_word: מוֹת יוּמַת
  choice: chắc chắn phải bị xử tử
  rationale: Cấu trúc nguyên mẫu tuyệt đối đi với động từ thụ động nhấn mạnh tính chắc chắn và bắt buộc của hình phạt tử hình.
theological_decisions:
- issue: Sự phân loại pháp lý của רֹצֵחַ trong luật về giết người
  choice: kẻ sát nhân
  alternative: kẻ giết người; người gây chết người
  rationale: Ngữ cảnh gần phân biệt hành vi cố ý đáng chịu án tử hình với trường hợp vô ý. “Kẻ sát nhân” giữ phán quyết pháp lý-đạo đức của câu mà không đưa thêm lập trường giáo phái.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “người ấy” và “nạn nhân” để tránh chuỗi đại từ dễ mơ hồ; giữ nhịp văn luật pháp và sắc thái nhấn mạnh của hình phạt.
