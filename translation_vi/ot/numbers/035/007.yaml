revisions:
- from: Tổng số các thành mà anh em cấp cho người Lê-vi là bốn mươi tám thành, cùng với các đồng cỏ chung quanh[a].
  to: Tổng số các thành mà anh em cấp cho người Lê-vi là bốn mươi tám thành, cùng với đất quanh các thành ấy[a].
  rationale: Bản sửa giữ nguyên số lượng, đối tượng được cấp và quan hệ “các thành cùng với phần đất của chúng”, đồng thời dùng một cách dịch bao quát hơn cho מִגְרָשׁ. Chú thích bảo lưu các cách hiểu theo công năng và không gian mà không áp đặt một khái niệm pháp lý hiện đại.
  reviewer_model: gpt-5.6-terra
