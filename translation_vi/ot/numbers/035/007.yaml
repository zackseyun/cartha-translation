  yaml_path: translation/ot/numbers/035/007.yaml
  text: All the cities that you give to the Levites shall be forty-eight cities[a], them and their pasturelands.
translation:
  language: vi
  text: Tổng số các thành mà anh em cấp cho người Lê-vi là bốn mươi tám thành, cùng với đất quanh các thành ấy[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “đất chăn thả” hoặc “đất trống” quanh các thành.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הֶעָרִים
  choice: Tổng số các thành
  rationale: Trong câu xác định tổng cộng, cách diễn đạt này chuyển tải tự nhiên lực tổng quát của כָּל và tránh lặp từ vụng về trong tiếng Việt.
- source_word: אֲשֶׁר תִּתְּנוּ
  choice: mà anh em cấp
  rationale: Động từ ngôi hai số nhiều nằm trong chỉ thị pháp lý; “anh em” thể hiện số nhiều, còn “cấp” phù hợp với việc phân giao các thành.
- source_word: לַלְוִיִּם
  choice: cho người Lê-vi
  rationale: Cách gọi quen thuộc, trang trọng và tự nhiên trong tiếng Việt dành cho tập thể người thuộc chi phái Lê-vi.
- source_word: אַרְבָּעִים וּשְׁמֹנֶה עִיר
  choice: bốn mươi tám thành
  rationale: Diễn đạt số đếm theo cú pháp tiếng Việt hiện đại.
- source_word: אֶתְהֶן
  choice: là bốn mươi tám thành
  rationale: Đại từ đi với dấu hiệu tân ngữ nhắc lại các thành đã được đếm; cấu trúc xác định tổng số bằng “là” truyền đạt chức năng ấy tự nhiên trong tiếng Việt mà không thêm một đại từ thừa.
- source_word: וְאֶת מִגְרְשֵׁיהֶן
  choice: cùng với các đồng cỏ chung quanh
  rationale: מִגְרָשׁ chỉ phần đất trống bao quanh thành, được dùng cho gia súc; bản dịch chính nêu công năng và vị trí, đồng thời chú thích bảo lưu các khả năng rộng hơn.
theological_decisions: []
translation_notes:
  register: Văn phong pháp lý trang trọng nhưng hiện đại; dùng “anh em” cho ngôi hai số nhiều và giữ cách gọi “người Lê-vi” quen thuộc. Dấu chú thích [a] được đặt ngay sau cụm từ cần giải thích.
