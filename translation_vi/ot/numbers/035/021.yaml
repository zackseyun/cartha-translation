source:
  edition: WLC
  text: א֣וֹ בְ/אֵיבָ֞ה הִכָּ֤ה/וּ בְ/יָד/וֹ֙ וַ/יָּמֹ֔ת מֽוֹת יוּמַ֥ת הַ/מַּכֶּ֖ה רֹצֵ֣חַֽ ה֑וּא גֹּאֵ֣ל הַ/דָּ֗ם יָמִ֛ית אֶת הָ/רֹצֵ֖חַ בְּ/פִגְע/וֹ בֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/021.yaml
  text: Or if he struck him with his hand in enmity and he died[a], the one who struck him must surely be put to death; he is a murderer[b]. The avenger of blood shall put the murderer to death when he meets him.
translation:
  language: vi
  text: Hoặc nếu một người, với lòng thù nghịch, dùng tay đánh người khác khiến người đó chết[a], thì kẻ đánh người chắc chắn phải bị xử tử; người đó là kẻ giết người. Người báo thù huyết[b] sẽ xử tử kẻ giết người khi gặp người đó.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn có thể dịch sát hơn: “và người đó chết.”'
    reason: lexical_alternative
  - marker: b
    text: 'Hoặc: “người thân báo thù huyết.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּאֵיבָה
  choice: vì thù nghịch
  rationale: Danh từ אֵיבָה chỉ sự thù địch hoặc lòng căm ghét; “vì thù nghịch” diễn đạt tự nhiên trong tiếng Việt và làm rõ động cơ cố ý mà không thêm ý ngoài nguyên văn.
- source_word: הִכָּהוּ בְיָדוֹ
  choice: dùng tay đánh người kia
  rationale: Giữ rõ phương tiện gây thương tích là chính bàn tay, một yếu tố thuộc trường hợp pháp lý đang được nêu.
- source_word: וַיָּמֹת
  choice: khiến người kia chết
  rationale: Trong chuỗi điều kiện pháp lý, cách diễn đạt này làm rõ quan hệ hậu quả vốn hiển nhiên trong ngữ cảnh; chú thích bảo lưu cách dịch sát cấu trúc liên tiếp của tiếng Hê-bơ-rơ.
- source_word: מוֹת יוּמַת
  choice: chắc chắn phải bị xử tử
  rationale: Cấu trúc nguyên thể tuyệt đối đi với động từ thụ động nhấn mạnh tính dứt khoát và bắt buộc của án tử hình.
- source_word: הַמַּכֶּה
  choice: kẻ đã đánh
  rationale: Diễn đạt tự nhiên, trực tiếp quy chiếu về người thực hiện hành vi vừa nêu.
- source_word: רֹצֵחַ הוּא
  choice: hắn là kẻ giết người
  rationale: Ngữ cảnh xác định hành vi có động cơ thù nghịch, nên “kẻ giết người” chỉ người phạm tội cố ý, không phải trường hợp ngộ sát.
- source_word: גֹּאֵל הַדָּם
  choice: người báo thù huyết
  rationale: Giữ thành ngữ pháp lý của tiếng Hê-bơ-rơ và tránh đồng nhất nó đơn giản với việc báo thù cá nhân; chú thích giải thích sắc thái người thân có trách nhiệm báo thù cho huyết đã đổ.
- source_word: יָמִית
  choice: sẽ xử tử
  rationale: “Xử tử” phù hợp văn phong pháp lý của đoạn và liên kết với án tử hình đã tuyên ở vế trước.
- source_word: בְּפִגְעוֹ בוֹ
  choice: khi gặp hắn
  rationale: Chuyển đạt gọn và tự nhiên ý gặp hoặc chạm mặt người phạm tội, không thêm hoàn cảnh không có trong nguyên văn.
theological_decisions:
- issue: Phân loại hành vi cố ý làm chết người
  choice: kẻ giết người
  alternative: kẻ làm chết người; kẻ sát nhân
  rationale: Chi tiết “vì thù nghịch” phân biệt trường hợp này với ngộ sát. “Kẻ giết người” rõ nghĩa, trang trọng vừa phải và không giảm nhẹ trách nhiệm pháp lý.
- issue: Cách dịch גֹּאֵל הַדָּם
  choice: người báo thù huyết
  alternative: người báo thù cho người bị giết; thân nhân báo thù huyết
  rationale: Cách chọn giữ danh xưng pháp lý đặc thù trong văn bản. Không đưa quan hệ thân tộc vào chính văn vì từ “huyết” được nói rõ, còn sắc thái thân nhân nằm trong chức năng rộng hơn của גֹּאֵל và được trình bày ở chú thích.
translation_notes:
  register: Văn phong pháp lý, trang nghiêm nhưng hiện đại và dễ hiểu. Dùng “người ấy/người kia” để phân biệt các bên trong câu điều kiện; dùng “hắn” sau khi người phạm tội đã được xác định là kẻ giết người. Thuật ngữ “người báo thù huyết” được giữ để phản ánh thiết chế pháp lý cổ của đoạn văn.
