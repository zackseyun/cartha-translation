id: NUM.35.34
reference: Numbers 35:34
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/לֹ֧א תְטַמֵּ֣א אֶת הָ/אָ֗רֶץ אֲשֶׁ֤ר אַתֶּם֙ יֹשְׁבִ֣ים בָּ֔/הּ אֲשֶׁ֥ר אֲנִ֖י שֹׁכֵ֣ן בְּ/תוֹכָ֑/הּ כִּ֚י אֲנִ֣י יְהוָ֔ה שֹׁכֵ֕ן בְּ/ת֖וֹךְ בְּנֵ֥י יִשְׂרָאֵֽל־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/034.yaml
  text: And you shall not defile the land in which you dwell[a], in the midst of which I dwell, for I, Yahweh, dwell in the midst of the sons of Israel.
translation:
  language: vi
  text: Các ngươi không được làm ô uế đất nơi các ngươi đang cư ngụ, là đất Ta ngự giữa; vì Ta, Yahweh, ngự giữa con cái Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “các con trai của Israel”; thành ngữ này chỉ con cháu hoặc dân Israel.'
    reason: Giữ lại hình thức giống đực và sắc thái phả hệ của בני ישראל, đồng thời giải thích ý nghĩa tập thể của thành ngữ.
lexical_decisions:
- source_word: תְטַמֵּא
  choice: làm ô uế
  rationale: Động từ ở thể Piel diễn tả việc khiến đất trở nên ô uế; “làm ô uế” giữ được cả sắc thái nghi lễ lẫn đạo đức, thay vì chỉ gợi ô nhiễm môi trường.
- source_word: הָאָרֶץ
  choice: đất
  rationale: Trong văn cảnh này, từ ngữ chỉ vùng đất dân Israel cư ngụ, không phải toàn thể trái đất.
- source_word: יֹשְׁבִים בָּהּ
  choice: nơi các ngươi đang cư ngụ
  rationale: Cách dịch này tự nhiên trong tiếng Việt, đồng thời phản ánh ý nghĩa cư trú liên tục của phân từ Hebrew.
- source_word: שֹׁכֵן
  choice: ngự
  rationale: Khi chủ thể là Đức Chúa Trời, “ngự” diễn đạt trang trọng và tự nhiên hành động cư ngụ, đồng thời giữ sắc thái về sự hiện diện của Ngài giữa dân.
- source_word: בְּתוֹכָהּ
  choice: ở giữa
  rationale: Giữ ý nghĩa về sự hiện diện ở bên trong và sự lặp lại có chủ ý của בְּתוֹךְ trong câu.
- source_word: כִּי
  choice: vì
  rationale: Liên từ này nêu lý do cho lệnh cấm làm ô uế đất.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng giao ước được ghi trực tiếp trong bản Hebrew, thay vì thay thế bằng một tước hiệu.
- source_word: בְּתוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: giữa con cái Israel
  rationale: “Con cái Israel” giữ hình ảnh phả hệ của thành ngữ Hebrew nhưng trong tiếng Việt vẫn có thể chỉ toàn thể hậu duệ và cộng đồng Israel.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC CHÚA / Đức Giê-hô-va
  rationale: Bản nguồn dùng trực tiếp danh riêng của Đức Chúa Trời; giữ “Yahweh” phân biệt danh này với các tước hiệu và tránh thay thế nó bằng một cách giải nghĩa.
- issue: Cách hiểu בְּנֵי יִשְׂרָאֵל
  choice: con cái Israel
  alternative: dân Israel / các con trai của Israel
  rationale: Cách dịch chính giữ thành ngữ chỉ dòng dõi Israel mà vẫn tự nhiên hơn lối dịch máy móc “các con trai”; chú thích bảo tồn hình thức giống đực của nguyên văn và cho biết ý nghĩa cộng đồng.
- issue: Sự hiện diện của Yahweh trong đất và giữa dân
  choice: giữ cả hai mệnh đề “Ta ngự ở giữa” và “ngự giữa con cái Israel”
  alternative: gộp thành một mệnh đề về việc Ngài ở giữa dân
  rationale: Nguyên văn cố ý lặp động từ שׁכן và giới từ בְּתוֹךְ; giữ sự lặp lại bảo tồn mối liên hệ thần học giữa đất, dân và sự hiện diện của Yahweh.
translation_notes:
  register: Văn phong trang trọng, rõ ràng và hiện đại. “Các ngươi” phù hợp với lời phán trực tiếp cho cộng đồng số nhiều; “ngự” được dùng riêng cho sự cư ngụ của Đức Chúa Trời. Dấu chấm phẩy giúp thể hiện quan hệ giữa lệnh cấm và lý do theo sau.
