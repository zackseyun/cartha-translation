    issue: “Xử tử” thêm sắc thái thủ tục xét xử/thi hành án hiện đại.
    rationale: Nguyên văn dùng động từ Hiphil của מות, “làm chết/giết chết,” trong khuôn khổ luật pháp; không nêu một thủ tục tuyên và thi hành án trong chính câu này.
  - severity: low
    issue: Đại từ “hắn” có sắc thái miệt thị mạnh hơn nguyên văn.
    rationale: Hậu tố chỉ đối tượng trong יְמִיתֶנּוּ là trung tính; “người ấy” vẫn rõ quy chiếu đến kẻ sát nhân và hợp văn phong hơn.
  - severity: low
    issue: Chú thích “báo thù cho người bị giết oan” diễn giải hẹp và kém sát thuật ngữ pháp lý.
    rationale: Cụm cố định chỉ thân nhân có vai trò báo trả việc đổ máu trái pháp; cách diễn đạt này sát chức năng pháp lý hơn mà không xác định thêm tình trạng cụ thể của nạn nhân.
