  verdict: revise
  source_fidelity: 'Bản dịch phản ánh đúng cấu trúc nhấn mạnh của tiếng Hê-bơ-rơ: גֹּאֵל הַדָּם là chủ thể được nhấn mạnh, và mệnh đề lặp lại khẳng định chính người ấy thực hiện việc giết kẻ sát nhân khi gặp. Tuy nhiên, “xử tử” trong tiếng Việt hiện đại thường gợi việc thi hành một bản án chính thức của cơ quan tư pháp; động từ יָמִית trong câu này nói trực tiếp rằng người báo thù huyết sẽ làm kẻ sát nhân chết. “Giết chết” giữ được nghĩa này mà không thêm sắc thái thủ tục hành chính.'
  naturalness: “Người báo thù huyết” là một thuật ngữ Kinh Thánh/pháp lý có thể hiểu được nhờ chú thích. Thay “hắn” bằng “người ấy” tự nhiên hơn trong văn phong pháp lý trang trọng và tránh thêm sắc thái miệt thị không có trong đại từ hậu tố của tiếng Hê-bơ-rơ.
  terminology: Giữ “người báo thù huyết” cho גֹּאֵל הַדָּם và “kẻ sát nhân” cho הָרֹצֵחַ là phù hợp trong văn cảnh luật về người cố ý giết người. Chú thích nên nói rõ đây là một thân nhân có vai trò pháp lý trong việc báo trả hành vi đổ máu trái pháp, thay vì diễn đạt “báo thù cho người bị giết oan,” vốn hơi chuyển trọng tâm sang nạn nhân.
  issues:
