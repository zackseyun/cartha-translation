  to: Chính người báo thù huyết[a] sẽ giết chết kẻ sát nhân; khi gặp kẻ ấy, chính người đó sẽ giết chết người ấy.
  rationale: Bản sửa giữ sự nhấn mạnh và lặp lại có chủ ý của nguyên văn, nhưng dùng “giết chết” để tránh gán cho câu một thủ tục tư pháp hiện đại mà nguyên văn không nêu. Đại từ được làm trung tính hơn, và chú thích được chỉnh để mô tả chính xác chức năng pháp lý của thuật ngữ mà không thêm chi tiết diễn giải.
