base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/019.yaml
  text: The avenger of blood himself shall put the murderer to death; when he meets him[a], he himself shall put him to death.
translation:
  language: vi
  text: Chính người báo thù huyết[a] sẽ giết chết kẻ sát nhân; khi gặp kẻ ấy, chính người đó sẽ giết chết người ấy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cụm từ Hê-bơ-rơ “người báo thù huyết” là một thuật ngữ pháp lý, chỉ một người thân trong gia tộc có vai trò báo trả việc đổ máu trái pháp.
    reason: Giải thích thuật ngữ pháp lý cổ và quan hệ thân tộc hàm chứa trong גֹּאֵל הַדָּם.
lexical_decisions:
- source_word: גֹּאֵל הַדָּם
  choice: người báo thù huyết
  rationale: Đây là thuật ngữ pháp lý cố định chỉ thân nhân có trách nhiệm báo thù cho người bị giết. Cách dịch này giữ hình ảnh “huyết” của nguyên văn, còn chú thích giải thích vai trò pháp lý để tránh hiểu sai.
- source_word: הוּא
  choice: chính người… / chính người đó
  rationale: Đại từ độc lập mang sắc thái nhấn mạnh; “chính” thể hiện việc người báo thù huyết đích thân thực hiện hành động.
- source_word: יָמִית
  choice: sẽ xử tử
  rationale: Dạng Hiphil của מות có nghĩa khiến chết hoặc làm cho chết. Trong văn cảnh luật pháp, “xử tử” truyền đạt hành động lấy mạng được luật tại đây cho phép, trang trọng và tự nhiên hơn lối dịch sát chữ.
- source_word: הָרֹצֵחַ
  choice: kẻ sát nhân
  rationale: רצח chỉ hành vi giết người trái phép; trong mạch luật này, người đang nói đến là người phải chịu án chết. “Kẻ sát nhân” phù hợp hơn từ chung chung như “kẻ giết người”.
- source_word: בְּפִגְעוֹ בוֹ
  choice: khi gặp kẻ ấy
  rationale: Cụm từ diễn tả lúc người báo thù gặp hoặc bắt gặp kẻ sát nhân. Cách diễn đạt này giữ nghĩa thời gian và không thêm ý truy đuổi hay phục kích.
- source_word: הוּא יְמִיתֶנּוּ
  choice: chính người đó sẽ xử tử hắn
  rationale: Việc lặp lại đại từ và động từ trong tiếng Hê-bơ-rơ nhấn mạnh cả chủ thể lẫn hành động; bản dịch giữ sự lặp lại có chủ ý ấy.
theological_decisions:
- issue: Vai trò pháp lý của גֹּאֵל הַדָּם
  choice: Hiểu là một thân nhân làm người báo thù huyết trong khuôn khổ luật pháp Y-sơ-ra-ên.
  alternative: người chuộc huyết / người thân chuộc lại
  rationale: Văn cảnh nói về luật xử lý án mạng, không trực tiếp triển khai chủ đề cứu chuộc thần học. Vì vậy, bản dịch giữ vai trò pháp lý dựa trên quan hệ thân tộc mà không đưa các liên tưởng giáo lý về “đấng cứu chuộc” vào câu.
translation_notes:
  register: Văn phong pháp lý, trang trọng nhưng hiện đại. Giữ thuật ngữ “người báo thù huyết” để phản ánh thành ngữ Hê-bơ-rơ, đồng thời dùng chú thích để người đọc phổ thông hiểu chức năng của nhân vật này. Sự lặp lại “xử tử” và từ nhấn mạnh “chính” bảo tồn cấu trúc nhấn mạnh của nguyên văn.
