  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: צַו֮ אֶת בְּנֵ֣י יִשְׂרָאֵל֒ וְ/נָתְנ֣וּ לַ/לְוִיִּ֗ם מִֽ/נַּחֲלַ֛ת אֲחֻזָּתָ֖/ם עָרִ֣ים לָ/שָׁ֑בֶת וּ/מִגְרָ֗שׁ לֶֽ/עָרִים֙ סְבִיבֹ֣תֵי/הֶ֔ם תִּתְּנ֖וּ לַ/לְוִיִּֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/002.yaml
  text: Command the sons of Israel that they give to the Levites[a], from the inheritance of their possession, cities to live in[b]; and you shall give to the Levites pasturelands around the cities.
translation:
  language: vi
  text: Hãy truyền cho con dân Y-sơ-ra-ên[a] rằng họ phải lấy từ phần đất thừa hưởng làm cơ nghiệp của họ mà cấp cho người Lê-vi các thành để ở; và các ngươi phải cấp cho người Lê-vi vùng đất trống[b] quanh các thành ấy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hoặc “người Y-sơ-ra-ên”; theo nghĩa đen, “các con trai Y-sơ-ra-ên.”
    reason: lexical_alternative
  - marker: b
    text: “Vùng đất trống” chỉ phần đất không xây dựng bao quanh thành, đặc biệt dùng cho việc chăn thả và các nhu cầu chung liên quan.
    reason: cultural_note
lexical_decisions:
- source_word: צַו
  choice: Hãy truyền ... phải
  rationale: Diễn đạt mệnh lệnh trực tiếp dành cho Môi-se, giữ lực của thể mệnh lệnh nhưng vẫn tự nhiên trong tiếng Việt.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: con dân Y-sơ-ra-ên
  rationale: Chỉ toàn thể cộng đồng giao ước; cách nói này tự nhiên, trang trọng và vẫn phản ánh thành tố 'con' trong nguyên ngữ.
- source_word: וְנָתְנוּ
  choice: phải ... cấp
  rationale: Sau động từ 'truyền', dạng động từ này mang ý nghĩa nội dung được truyền phải thực hiện.
- source_word: לַלְוִיִּם
  choice: cho người Lê-vi
  rationale: Diễn đạt tự nhiên đối tượng tiếp nhận; 'người Lê-vi' có thể chỉ tập thể.
- source_word: מִנַּחֲלַת אֲחֻזָּתָם
  choice: từ phần đất thuộc cơ nghiệp của mình
  rationale: Giữ ý niệm pháp lý về cơ nghiệp và quyền sở hữu đất, đồng thời tránh lối ghép từ tối nghĩa trong tiếng Việt.
- source_word: עָרִים לָשָׁבֶת
  choice: những thành để ở
  rationale: Thể hiện rõ ý nghĩa mục đích của động từ nguyên mẫu.
- source_word: מִגְרָשׁ
  choice: đất trống
  rationale: Thuật ngữ chỉ vùng đất không xây dựng quanh thành, có thể dùng cho chăn thả và các nhu cầu chung; rộng nghĩa hơn riêng 'đồng cỏ'.
- source_word: לֶעָרִים סְבִיבֹתֵיהֶם
  choice: chung quanh các thành ấy
  rationale: Làm rõ đất trống nằm quanh những thành vừa được nhắc đến.
- source_word: תִּתְּנוּ
  choice: anh em phải cấp
  rationale: Giữ sự chuyển đổi trong nguyên ngữ từ ngôi thứ ba số nhiều sang ngôi thứ hai số nhiều, thay vì âm thầm đồng nhất hai chủ thể.
theological_decisions:
- issue: Sự chuyển đổi ngôi ở hai động từ נתן
  choice: 'Giữ ngôi thứ ba trong mệnh đề gián tiếp rồi chuyển sang ngôi thứ hai số nhiều: ''của mình ... anh em phải cấp''.'
  alternative: Đồng nhất cả hai động từ ở ngôi thứ ba hoặc cả hai ở ngôi thứ hai.
  rationale: Bản Hê-bơ-rơ thực sự đổi từ וְנָתְנוּ, ngôi thứ ba số nhiều, sang תִּתְּנוּ, ngôi thứ hai số nhiều; bản dịch bảo tồn nét căng ngữ pháp này.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng 'cấp' để phù hợp bối cảnh phân chia đất; dùng 'anh em' cho ngôi thứ hai số nhiều nhằm giữ sự chuyển ngôi trong tiếng Hê-bơ-rơ mà không tạo sắc thái xa cách.
