base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/025.yaml
  text: Then the congregation shall rescue the manslayer from the hand of the avenger of blood[a], and the congregation shall return him to his city of refuge, where he fled; and he shall live in it until the death of the high priest[c][b], whom he was anointed with the holy oil.
translation:
  language: vi
  text: Bấy giờ, hội chúng phải giải cứu người đã giết người khỏi tay người báo thù huyết[a]. Hội chúng phải đưa người ấy trở về thành trú ẩn mà người ấy đã chạy đến; người ấy phải ở lại đó[b] cho đến khi thượng tế qua đời—vị mà một người nào đó đã xức dầu thánh[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “người báo thù cho huyết.” Cụm từ Hê-bơ-rơ chỉ người có trách nhiệm pháp lý báo thù cho máu đã đổ, thường là một thân nhân gần.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “cư ngụ tại đó” hoặc “sống tại đó.”'
    reason: lexical_alternative
  - marker: c
    text: 'Nguyên văn Hê-bơ-rơ: “vị mà ông ấy đã xức dầu thánh.” Chủ thể của động từ “xức” không được nói rõ. “Một người nào đó” trong bản dịch chỉ nhằm diễn đạt chủ thể không xác định ấy; nhiều bản dịch chuyển thành: “vị đã được xức dầu thánh.”'
    reason: alternative_reading
lexical_decisions:
- source_word: הִצִּילוּ
  choice: giải cứu
  rationale: Thể Hiphil của נצל ở đây chỉ việc đưa một người thoát khỏi quyền lực của người khác; “giải cứu” phù hợp với bối cảnh bảo hộ pháp lý.
- source_word: הָעֵדָה
  choice: hội chúng
  rationale: Trong Dân Số Ký, từ này thường chỉ cộng đồng giao ước hành động với tư cách xét xử; “hội chúng” giữ được sắc thái cộng đồng trang trọng.
- source_word: הָרֹצֵחַ
  choice: người đã giết người
  rationale: Trong chương này, từ này bao gồm cả người vô ý gây chết người, nên không dịch là “kẻ sát nhân,” vốn hàm ý tội cố sát.
- source_word: מִיַּד
  choice: khỏi tay
  rationale: Giữ hình ảnh cụ thể của thành ngữ Hê-bơ-rơ, đồng thời vẫn tự nhiên trong tiếng Việt.
- source_word: גֹּאֵל הַדָּם
  choice: người báo thù huyết
  rationale: Chỉ người có trách nhiệm pháp lý đòi lại mạng vì máu đã đổ; cách dịch này giữ thuật ngữ pháp lý và không tự ý thêm quan hệ thân tộc.
- source_word: וְהֵשִׁיבוּ אֹתוֹ
  choice: đưa người ấy trở về
  rationale: Thể Hiphil của שוב có nghĩa khiến một người trở lại; cách diễn đạt này tự nhiên hơn lối dịch sát chữ “trả người ấy lại.”
- source_word: עִיר מִקְלָטוֹ
  choice: thành trú ẩn
  rationale: Đây là danh xưng pháp lý của các thành dành cho người vô ý gây chết người; “thành trú ẩn” ngắn gọn, rõ nghĩa và trang trọng.
- source_word: אֲשֶׁר נָס שָׁמָּה
  choice: mà người ấy đã chạy đến
  rationale: Diễn đạt rõ hướng chuyển động về thành trú ẩn và phản ánh trạng thái đã xảy ra trước việc được đưa trở lại.
- source_word: וְיָשַׁב בָּהּ
  choice: phải ở lại đó
  rationale: ישב có thể mang nghĩa ở, cư ngụ hoặc tiếp tục lưu lại; trong quy định pháp lý này, “ở lại” làm rõ nghĩa vụ không rời thành mà không thu hẹp thành một chỗ ở nhất thời.
- source_word: עַד מוֹת הַכֹּהֵן הַגָּדֹל
  choice: cho đến khi thầy tế lễ thượng phẩm qua đời
  rationale: Chuyển danh hóa Hê-bơ-rơ sang mệnh đề thời gian tự nhiên trong tiếng Việt, đồng thời giữ nguyên chức danh.
- source_word: אֲשֶׁר מָשַׁח אֹתוֹ
  choice: người mà ông đã xức
  rationale: Giữ động từ chủ động ngôi thứ ba số ít của bản Hê-bơ-rơ và không xác định danh tính chủ thể vốn bị lược bỏ; đại từ “ông” biểu thị chủ thể không nêu rõ.
- source_word: בְּשֶׁמֶן הַקֹּדֶשׁ
  choice: bằng dầu thánh
  rationale: Phản ánh dầu dùng để biệt riêng thầy tế lễ; tiếng Việt không cần mạo từ xác định như tiếng Hê-bơ-rơ.
theological_decisions:
- issue: Tư cách pháp lý của הָרֹצֵחַ trong luật về thành trú ẩn
  choice: Dịch là “người đã giết người,” không phải “kẻ sát nhân.”
  alternative: “Kẻ sát nhân” hoặc “kẻ giết người.”
  rationale: Toàn chương phân biệt cố ý giết người với vô ý gây chết người. “Kẻ sát nhân” sẽ gán trước tội cố sát mà tiến trình xét xử chưa xác định.
- issue: Chủ thể bị lược của מָשַׁח אֹתוֹ
  choice: 'Giữ cấu trúc chủ động: “người mà ông đã xức.”'
  alternative: “người đã được xức bằng dầu thánh.”
  rationale: Bản Hê-bơ-rơ có động từ chủ động ngôi thứ ba số ít, với thầy tế lễ thượng phẩm làm tân ngữ, nhưng không nêu chủ thể. Bản dịch không đổi ngầm sang bị động; chú thích ghi rõ điểm khó này.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “hội chúng” cho cộng đồng xét xử, “thành trú ẩn” cho thiết chế pháp lý, và “thầy tế lễ thượng phẩm” cho chức danh. Tránh từ “kẻ sát nhân” vì mang phán định cố sát. Giữ sự đột ngột có thật của mệnh đề chủ động cuối câu, đồng thời giải thích bằng chú thích.
