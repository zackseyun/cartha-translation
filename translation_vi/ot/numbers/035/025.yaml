  to: Bấy giờ, hội chúng phải giải cứu người đã giết người khỏi tay người báo thù huyết[a]. Hội chúng phải đưa người ấy trở về thành trú ẩn mà người ấy đã chạy đến; người ấy phải ở lại đó[b] cho đến khi thượng tế qua đời—vị mà một người nào đó đã xức dầu thánh[c].
  rationale: Sửa mệnh đề cuối để tránh việc đại từ “ông” bị hiểu là thượng tế, trong khi vẫn giữ sự không xác định của chủ thể Hê-bơ-rơ và dạng chủ động thay vì áp đặt dạng bị động. Đổi sang “thượng tế” cho tự nhiên hơn, đồng thời chuyển neo chú thích b đến đúng cụm từ mà chú thích giải thích.
