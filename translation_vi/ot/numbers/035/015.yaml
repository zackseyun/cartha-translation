source:
  edition: WLC
  text: לִ/בְנֵ֣י יִשְׂרָאֵ֗ל וְ/לַ/גֵּ֤ר וְ/לַ/תּוֹשָׁב֙ בְּ/תוֹכָ֔/ם תִּהְיֶ֛ינָה שֵׁשׁ הֶ/עָרִ֥ים הָ/אֵ֖לֶּה לְ/מִקְלָ֑ט לָ/נ֣וּס שָׁ֔מָּ/ה כָּל מַכֵּה נֶ֖פֶשׁ בִּ/שְׁגָגָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/015.yaml
  text: These six cities shall be for refuge for the sons of Israel[a], and for the sojourner and for the resident among them[c][b], so that anyone who kills a person unintentionally may flee there.
translation:
  language: vi
  text: Sáu thành này sẽ là nơi trú ẩn cho con dân Israel,[a] cho kiều dân và người tạm cư sống giữa họ,[b] để bất cứ ai vô ý làm chết một người đều có thể chạy trốn đến đó.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “dân Israel”; sát chữ là “các con trai của Israel.”
    reason: lexical_alternative
  - marker: b
    text: “Kiều dân” và “người tạm cư” dịch hai từ Hê-bơ-rơ khác nhau (גֵּר và תּוֹשָׁב), chỉ những người không phải dân bản xứ nhưng sống trong xã hội Israel.
    reason: cultural_note
  - marker: c
    text: Cụm từ Hê-bơ-rơ được dịch là “ai… làm chết một người” có nghĩa sát hơn là “bất cứ ai đánh chết một người.” Trong văn cảnh này, cụm từ chỉ người gây ra cái chết của một người.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: cho con dân Israel
  rationale: Đây là danh xưng dân tộc–giao ước quen thuộc. “Con dân Israel” giữ được sắc thái thuộc về dòng dõi Israel mà vẫn tự nhiên hơn cách dịch sát chữ “các con trai của Israel” trong tiếng Việt hiện đại.
- source_word: גֵּר
  choice: kiều dân
  rationale: Từ này chỉ người không phải bản địa nhưng đang sống trong cộng đồng Israel và được luật pháp bảo hộ. “Kiều dân” tương đối ngắn gọn và giữ được địa vị không phải dân bản xứ.
- source_word: תּוֹשָׁב
  choice: người tạm cư
  rationale: Từ này chỉ người cư ngụ trong xứ nhưng không có đầy đủ địa vị của người bản xứ. Dùng một thuật ngữ riêng để không xóa nhòa sự phân biệt với גֵּר.
- source_word: בְּתוֹכָם
  choice: sống giữa họ
  rationale: Diễn đạt tự nhiên việc hai nhóm người trên cư trú trong cộng đồng Israel.
- source_word: תִּהְיֶינָה שֵׁשׁ הֶעָרִים הָאֵלֶּה לְמִקְלָט
  choice: Sáu thành này sẽ là nơi trú ẩn
  rationale: Giữ ý chỉ định pháp lý của sáu thành, đồng thời dùng cấu trúc tiếng Việt rõ ràng và trang trọng.
- source_word: לָנוּס שָׁמָּה
  choice: đều có thể chạy trốn đến đó
  rationale: 'Làm rõ quan hệ mục đích: các thành được chỉ định để người gây chết vô ý có thể chạy đến lánh nạn.'
- source_word: כָּל מַכֵּה נֶפֶשׁ
  choice: bất cứ ai ... làm chết một người
  rationale: Trong bối cảnh luật về thành trú ẩn, cụm từ nói đến người gây ra cái chết của một người khác. Cách diễn đạt này rõ nghĩa hơn lối dịch từng chữ “đánh một mạng sống”.
- source_word: בִּשְׁגָגָה
  choice: vô ý
  rationale: Diễn tả hành động không có chủ ý, đúng với sự phân biệt pháp lý giữa ngộ sát và cố ý giết người.
theological_decisions:
- issue: Danh xưng mang hình thức giống đực בְּנֵי יִשְׂרָאֵל
  choice: con dân Israel
  alternative: các con trai của Israel; dân Israel
  rationale: “Con dân Israel” duy trì phần nào hình ảnh huyết thống của nguyên ngữ nhưng tránh khiến độc giả hiện đại hiểu rằng câu chỉ nói đến nam giới; chú thích bảo lưu hình thức sát chữ.
- issue: Mức độ chủ ý trong בִּשְׁגָגָה
  choice: vô ý
  alternative: do nhầm lẫn; do sơ suất; tình cờ
  rationale: “Vô ý” giữ trọng tâm pháp lý là không cố ý, nhưng không tự quyết định chính xác hành vi xảy ra do nhầm lẫn, sơ suất hay tai nạn.
translation_notes:
  register: Văn phong luật pháp trang trọng nhưng dễ hiểu. Câu giữ trật tự ý chính của nguyên ngữ, dùng “nơi trú ẩn” và “chạy trốn” là những từ phổ thông; các thuật ngữ chỉ địa vị cư trú được phân biệt và giải thích bằng chú thích.
