  text: וְ/לֹֽא תִקְח֥וּ כֹ֨פֶר֙ לְ/נֶ֣פֶשׁ רֹצֵ֔חַ אֲשֶׁר ה֥וּא רָשָׁ֖ע לָ/מ֑וּת כִּי מ֖וֹת יוּמָֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/031.yaml
  text: You shall not accept a ransom for the life of a murderer who is guilty of death[c][b][a], for he must surely be put to death.
translation:
  language: vi
  text: Anh em không được nhận tiền chuộc mạng cho một kẻ sát nhân đáng phải chết, vì người ấy nhất định phải bị xử tử.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תִקְחוּ
  choice: nhận
  rationale: Trong ngữ cảnh luật pháp với כֹּפֶר, động từ mang nghĩa nhận hoặc chấp nhận một khoản tiền; “nhận” tự nhiên và chính xác trong tiếng Việt.
- source_word: כֹּפֶר
  choice: tiền chuộc mạng
  rationale: Danh từ chỉ khoản tiền nhằm tránh hình phạt hoặc đổi lấy sự phóng thích. Trong câu này, khoản tiền được dùng để mong giữ mạng sống cho kẻ sát nhân, nên “tiền chuộc mạng” diễn đạt rõ ý pháp lý.
- source_word: לְנֶפֶשׁ רֹצֵחַ
  choice: cho một kẻ sát nhân
  rationale: נֶפֶשׁ có thể chỉ mạng sống hoặc chính con người. Cụm “tiền chuộc mạng cho một kẻ sát nhân” trong tiếng Việt vừa thể hiện khoản tiền liên quan đến mạng sống của người ấy, vừa giữ cấu trúc tự nhiên.
- source_word: רֹצֵחַ
  choice: kẻ sát nhân
  rationale: Bối cảnh Dân Số 35 phân biệt việc vô ý làm chết người với hành vi giết người đáng chịu án tử hình; “kẻ sát nhân” chính xác hơn từ rộng nghĩa như “kẻ giết người” trong trường hợp này.
- source_word: רָשָׁע לָמוּת
  choice: đáng phải chết
  rationale: Cụm Hê-bơ-rơ có sắc thái pháp lý, chỉ người mắc tội và phải chịu án tử hình. “Đáng phải chết” tự nhiên, đồng thời giữ ý chịu trách nhiệm pháp lý mà không thêm thủ tục kết án không được nói rõ trong câu.
- source_word: כִּי מוֹת יוּמָת
  choice: vì hắn nhất định phải bị xử tử
  rationale: Cấu trúc nguyên thể tuyệt đối đi với động từ hữu hạn nhấn mạnh tính chắc chắn và bắt buộc. “Nhất định phải bị xử tử” giữ cả lực nhấn mạnh lẫn nghĩa bị thi hành án.
theological_decisions:
- issue: Hiệu lực bắt buộc của án tử hình trong điều luật
  choice: Câu này cấm dùng tiền để thay thế án tử hình đối với kẻ sát nhân đáng chết và khẳng định án phải được thi hành.
  alternative: Xem đây chỉ là mô tả tập tục, không phải một mệnh lệnh pháp lý bắt buộc.
  rationale: Thể phủ định לֹא תִקְחוּ là lời cấm trực tiếp, còn מוֹת יוּמָת là cấu trúc nhấn mạnh; vì vậy bản dịch giữ lực bắt buộc bằng “không được” và “nhất định phải”.
translation_notes:
  register: Văn phong luật pháp trang nghiêm nhưng hiện đại. “Anh em” biểu thị lời phán với cộng đồng số nhiều; “hắn” giúp tránh lặp nặng nề và phù hợp với đối tượng là kẻ sát nhân đã nêu. Không cần chú thích vì các sắc thái nguồn được chuyển tải trực tiếp, không có dấu chú thích trong chính văn.
