  text: אֵ֣ת שְׁלֹ֣שׁ הֶ/עָרִ֗ים תִּתְּנוּ֙ מֵ/עֵ֣בֶר לַ/יַּרְדֵּ֔ן וְ/אֵת֙ שְׁלֹ֣שׁ הֶֽ/עָרִ֔ים תִּתְּנ֖וּ בְּ/אֶ֣רֶץ כְּנָ֑עַן עָרֵ֥י מִקְלָ֖ט תִּהְיֶֽינָה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/014.yaml
  text: You shall appoint three of the cities beyond the Jordan[a], and three of the cities in the land of Canaan[b]; they shall be cities of refuge.
translation:
  language: vi
  text: Anh em phải chỉ định[a] ba thành ở bên kia sông Giô-đanh[b], và ba thành ở đất Ca-na-an; những thành ấy sẽ là các thành trú ẩn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch sát là “cho”. Động từ Hê-bơ-rơ có nghĩa đen là “cho”, nhưng trong ngữ cảnh này chỉ việc dành hoặc ấn định các thành cho mục đích ấy.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “bên ngoài sông Giô-đanh”, “qua sông Giô-đanh” hoặc “ở phía bên kia sông Giô-đanh”. Bản thân cụm từ không xác định rõ hướng đông hay tây.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּתְּנוּ / תִּתְּנ֖וּ
  choice: phải chỉ định
  rationale: Động từ נתן có nghĩa đen là “trao/cho”, nhưng trong ngữ cảnh luật pháp này nói đến việc dành hoặc ấn định các thành cho một chức năng cụ thể. “Phải chỉ định” diễn đạt tự nhiên sức bắt buộc của mệnh lệnh mà vẫn giữ chú thích về nghĩa đen.
- source_word: מֵעֵבֶר לַיַּרְדֵּן
  choice: ở bên kia sông Giô-đanh
  rationale: Cách dịch này giữ ý nghĩa tương đối theo vị trí quan sát của cụm Hê-bơ-rơ và không tự ý xác định hướng đông hay tây.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: ở đất Ca-na-an
  rationale: Giữ danh từ אֶרֶץ, nhấn mạnh lãnh thổ Ca-na-an, đồng thời dùng lối diễn đạt gọn và tự nhiên trong tiếng Việt.
- source_word: עָרֵי מִקְלָט
  choice: các thành trú ẩn
  rationale: Diễn đạt rõ các thành được dành làm nơi bảo vệ cho người ngộ sát, không gợi những liên tưởng chính trị hiện đại như thuật ngữ “tị nạn”.
- source_word: אֵת שְׁלֹשׁ הֶעָרִים ... וְאֵת שְׁלֹשׁ הֶעָרִים
  choice: ba thành trong số các thành ... và ba thành trong số các thành
  rationale: Danh từ xác định הֶעָרִים chỉ những thành thuộc tập hợp đang được bàn đến; “trong số các thành” phản ánh sắc thái xác định này.
- source_word: תִּהְיֶינָה
  choice: những thành ấy sẽ là
  rationale: Dạng chưa hoàn thành của היה ở đây nêu địa vị hoặc chức năng được ấn định cho sáu thành; “sẽ là” giữ sắc thái pháp lý-hướng tới kết quả.
theological_decisions: []
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh em” cho ngôi thứ hai số nhiều hướng đến cộng đồng Y-sơ-ra-ên; tránh lối cổ “các ngươi”. Cấu trúc câu giữ sự song song của hai nhóm ba thành và dấu chấm phẩy phản ánh quan hệ giữa việc chỉ định với chức năng trú ẩn.
