  text: וְ/הָי֨וּ לָ/כֶ֧ם הֶ/עָרִ֛ים לְ/מִקְלָ֖ט מִ/גֹּאֵ֑ל וְ/לֹ֤א יָמוּת֙ הָ/רֹצֵ֔חַ עַד עָמְד֛/וֹ לִ/פְנֵ֥י הָ/עֵדָ֖ה לַ/מִּשְׁפָּֽט־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/012.yaml
  text: The cities shall be for you as a refuge from the avenger[a], so that the manslayer may not die until he stands before the congregation for judgment.
translation:
  language: vi
  text: Các thành ấy sẽ là nơi trú ẩn cho anh em khỏi người báo thù[a], để người đã giết người không phải chết cho đến khi người ấy trình diện trước hội chúng để chịu xét xử.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “người báo thù huyết” hoặc “người thân báo thù”. Từ Hê-bơ-rơ go’el là một thuật ngữ chỉ quan hệ thân tộc; tại đây chỉ người thân thực hiện việc báo thù vì máu đã đổ.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיוּ
  choice: sẽ là
  rationale: Dạng hoàn thành Qal nối tiếp trong chỉ thị pháp luật mang ý nghĩa tương lai/quy định; “sẽ là” tự nhiên trong tiếng Việt và giữ lực chỉ định.
- source_word: הֶעָרִים
  choice: Các thành ấy
  rationale: Chỉ các thành đã được nói đến trong ngữ cảnh ngay trước đó; “ấy” làm rõ tính hồi chỉ mà không thêm nội dung.
- source_word: לְמִקְלָט
  choice: nơi trú ẩn
  rationale: מִקְלָט là nơi che chở, lánh nạn; cách dịch này rõ ràng, tự nhiên và không mang sắc thái thể chế hiện đại như “quyền tị nạn”.
- source_word: מִגֹּאֵל
  choice: khỏi người báo thù
  rationale: גֹאֵל vốn là một thuật ngữ thân tộc, nhưng trong luật về án mạng chỉ người có trách nhiệm báo thù cho người bị giết. Bản chính dùng cách nói gọn, còn chú thích giữ sắc thái thân tộc và huyết thù.
- source_word: וְלֹא יָמוּת
  choice: để ... không phải chết
  rationale: Mệnh đề nêu mục đích/kết quả của việc lập nơi trú ẩn. “Không phải chết” giữ nguyên việc câu Hê-bơ-rơ không nêu trực tiếp tác nhân gây chết.
- source_word: הָרֹצֵחַ
  choice: người đã giết người
  rationale: Trong luật về thành trú ẩn, từ này bao gồm người gây chết người mà lỗi cố ý hay vô ý chưa được xét định. Cách dịch này tránh kết luận trước rằng người ấy là “kẻ sát nhân”.
- source_word: עַד עָמְדוֹ
  choice: trước khi ra đứng
  rationale: עַד với động từ nguyên mẫu và hậu tố đại từ tạo mệnh đề thời gian “cho đến khi người ấy đứng/ra trình diện”; trong cấu trúc phủ định tiếng Việt, “trước khi” diễn đạt tự nhiên cùng giới hạn thời gian.
- source_word: לִפְנֵי הָעֵדָה
  choice: trước hội chúng
  rationale: עֵדָה là cộng đồng được triệu tập, ở đây thi hành chức năng tư pháp. “Hội chúng” giữ sắc thái tập thể trang trọng của Ngũ Kinh.
- source_word: לַמִּשְׁפָּט
  choice: để chịu xét xử
  rationale: מִשְׁפָּט ở đây nói đến thủ tục/phán quyết tư pháp. “Chịu xét xử” tự nhiên hơn “cho sự phán xét” và không thu hẹp kết quả của phiên xử.
theological_decisions:
- issue: Tư cách pháp lý của הָרֹצֵחַ trước khi được xét xử
  choice: “người đã giết người”, không dùng “kẻ sát nhân”
  alternative: “kẻ sát nhân” hoặc “kẻ giết người”
  rationale: Câu này trì hoãn cái chết cho đến khi người ấy đứng trước hội chúng để được xét xử, nên mức độ lỗi chưa được quyết định. Cách dịch đã chọn không áp đặt trước một phán quyết đạo đức hay pháp lý.
- issue: Ý nghĩa cụ thể của גֹאֵל trong luật về án mạng
  choice: Bản chính dịch “người báo thù”, kèm chú thích về người thân báo thù huyết
  alternative: “người báo thù huyết” hoặc “người thân báo thù” ngay trong bản chính
  rationale: Từ Hê-bơ-rơ có trường nghĩa thân tộc, chuộc lại và báo thù; trong ngữ cảnh này chức năng báo thù cho máu đã đổ nổi bật. Chú thích bảo tồn sắc thái đầy đủ mà không làm câu chính nặng nề.
translation_notes:
  register: Văn phong pháp luật trang trọng nhưng hiện đại, dễ hiểu. Dùng “anh em” cho hậu tố số nhiều ngôi thứ hai trong לָכֶם theo lối xưng hô cộng đồng; tránh từ “kẻ sát nhân” vì dễ hàm ý cố sát trước khi xét xử. Dấu chú thích [a] xuất hiện đúng tại thuật ngữ cần giải thích.
