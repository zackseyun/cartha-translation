- from: Các thành ấy sẽ là nơi trú ẩn cho anh em khỏi người báo thù[a], để người đã giết người không phải chết trước khi ra đứng trước hội chúng để chịu xét xử.
  to: Các thành ấy sẽ là nơi trú ẩn cho anh em khỏi người báo thù[a], để người đã giết người không phải chết cho đến khi người ấy trình diện trước hội chúng để chịu xét xử.
  rationale: Bản sửa thay đổi tối thiểu để phản ánh trực tiếp hơn עַד (“cho đến khi”) và dùng cách diễn đạt tố tụng tự nhiên trong tiếng Việt. Các thuật ngữ chính và sự chưa xác định về mức độ culpability trước khi xét xử đều được giữ nguyên.
