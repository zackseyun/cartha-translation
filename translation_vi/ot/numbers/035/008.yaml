  text: וְ/הֶֽ/עָרִ֗ים אֲשֶׁ֤ר תִּתְּנוּ֙ מֵ/אֲחֻזַּ֣ת בְּנֵי יִשְׂרָאֵ֔ל מֵ/אֵ֤ת הָ/רַב֙ תַּרְבּ֔וּ וּ/מֵ/אֵ֥ת הַ/מְעַ֖ט תַּמְעִ֑יטוּ אִ֗ישׁ כְּ/פִ֤י נַחֲלָת/וֹ֙ אֲשֶׁ֣ר יִנְחָ֔לוּ יִתֵּ֥ן מֵ/עָרָ֖י/ו לַ/לְוִיִּֽם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/008.yaml
  text: And the cities that you give from the possession of the sons of Israel—from the many you shall increase[a], and from the few you shall diminish. Each one, according to his inheritance that they inherit[b], shall give some of his cities to the Levites.
translation:
  language: vi
  text: 'Các thành mà anh em sẽ cấp từ phần sản nghiệp của dân Y-sơ-ra-ên: từ chi phái có nhiều, anh em phải cấp nhiều; từ chi phái có ít, anh em phải cấp ít.[a] Mỗi chi phái phải tùy theo phần sản nghiệp mình được hưởng mà cấp một số thành của mình cho người Lê-vi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát nghĩa: “từ người có nhiều, anh em phải làm cho nhiều; từ người có ít, anh em phải làm cho ít”; ý nói số thành được cấp phải tương xứng với phần sản nghiệp lớn hay nhỏ của mỗi chi phái.'
    reason: Giải thích lối nói tỉnh lược trong tiếng Hê-bơ-rơ và cơ sở của cách dịch theo ngữ cảnh.
lexical_decisions:
- source_word: הֶעָרִים
  choice: các thành
  rationale: עִיר chỉ một khu định cư có thể dịch là “thành” hoặc “thị trấn”; “thành” phù hợp với thuật ngữ quen dùng trong ngữ cảnh các thành dành cho người Lê-vi.
- source_word: תִּתְּנוּ ... יִתֵּן
  choice: cấp ... phải cấp
  rationale: נתן có nghĩa cơ bản là “cho”; trong quy định phân bổ đất đai, “cấp” diễn đạt tự nhiên việc các chi phái trao thành cho người Lê-vi.
- source_word: אֲחֻזַּת בְּנֵי יִשְׂרָאֵל
  choice: phần sản nghiệp của dân Y-sơ-ra-ên
  rationale: אֲחֻזָּה là phần đất được nắm giữ lâu dài; “phần sản nghiệp” giữ được sắc thái đất được ban và thừa hưởng. בְּנֵי יִשְׂרָאֵל ở đây chỉ toàn thể cộng đồng nên dịch tự nhiên là “dân Y-sơ-ra-ên”.
- source_word: מֵאֵת הָרַב תַּרְבּוּ וּמֵאֵת הַמְעַט תַּמְעִיטוּ
  choice: từ chi phái có nhiều, anh em phải lấy nhiều; từ chi phái có ít, anh em phải lấy ít
  rationale: Nguyên văn lược bỏ danh từ sau “nhiều/ít”; ngữ cảnh và câu kế tiếp cho thấy đối tượng phân phối là các chi phái với phần sản nghiệp lớn nhỏ khác nhau. Cách dịch nêu rõ ý phân bổ theo tỷ lệ mà vẫn ghi chú cấu trúc sát chữ.
- source_word: אִישׁ כְּפִי נַחֲלָתוֹ אֲשֶׁר יִנְחָלוּ
  choice: Mỗi chi phái phải tùy theo phần sản nghiệp mình được hưởng
  rationale: אִישׁ có chức năng phân phối, còn động từ số nhiều יִנְחָלוּ cho thấy các nhóm trong dân Y-sơ-ra-ên là đối tượng tập thể. “Mỗi chi phái” làm rõ sở chỉ trong ngữ cảnh, và “tùy theo” chuyển tải thành ngữ tỷ lệ כְּפִי.
- source_word: מֵעָרָיו לַלְוִיִּם
  choice: một số thành của mình cho người Lê-vi
  rationale: מִן có nghĩa bộ phận, vì vậy “một số thành của mình” tự nhiên hơn “từ các thành của mình”; לַלְוִיִּם được dịch theo cách gọi chuẩn là “người Lê-vi”.
theological_decisions: []
translation_notes:
  register: Văn phong luật lệ trang trọng nhưng dễ hiểu. Dùng “anh em” cho ngôi thứ hai số nhiều được truyền đạt qua Môi-se; dùng “phần sản nghiệp” để giữ mạch từ vựng về đất được thừa hưởng. Dấu [a] xuất hiện ngay sau mệnh đề được chú giải.
