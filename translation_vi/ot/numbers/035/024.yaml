  text: then the congregation shall judge between the one who struck him and the avenger of blood, according to these ordinances.
translation:
  language: vi
  text: thì hội chúng phải xét xử giữa người đã đánh và người báo thù huyết[a], theo các luật lệ này[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “người báo thù về huyết.” Cụm từ Hê-bơ-rơ chỉ người thân có trách nhiệm báo thù cho cái chết của một người thân.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “các phán lệ này.” Từ Hê-bơ-rơ có thể chỉ những phán quyết, quy tắc hoặc luật lệ pháp lý.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁפְטוּ
  choice: thì ... phải xét xử
  rationale: Động từ với liên từ trong trình tự pháp lý mang ý nghĩa thủ tục tiếp theo; “phải xét xử” vừa tự nhiên vừa giữ sắc thái quy định và chức năng tư pháp.
- source_word: הָעֵדָה
  choice: hội chúng
  rationale: Chỉ cộng đồng Israel trong tư cách tập thể tham gia phân xử; “hội chúng” giữ sắc thái trang trọng và không thu hẹp thành một cơ quan tòa án cụ thể.
- source_word: בֵּין ... וּבֵין
  choice: giữa ... và
  rationale: Diễn đạt tự nhiên cấu trúc đối xứng của tiếng Hê-bơ-rơ mà không làm mất quan hệ giữa hai bên tranh tụng.
- source_word: הַמַּכֶּה
  choice: người đã đánh
  rationale: Giữ gần nghĩa phân từ của נכה và không định danh người này là “kẻ giết người,” vì câu chưa tuyên bố tội danh; “đã” phù hợp với sự việc đang được xét.
- source_word: גֹּאֵל הַדָּם
  choice: người báo thù huyết
  rationale: Giữ thành ngữ pháp lý Hê-bơ-rơ và vai trò báo thù cho huyết của thân nhân; chú thích giải nghĩa để tránh hiểu đây chỉ là sự trả thù cá nhân nói chung.
- source_word: עַל
  choice: theo
  rationale: Trong ngữ cảnh pháp lý, giới từ cho biết việc xét xử phải căn cứ vào các chuẩn mực vừa được nêu.
- source_word: הַמִּשְׁפָּטִים הָאֵלֶּה
  choice: các luật lệ này
  rationale: מִשְׁפָּטִים ở đây có thể chỉ các quy định hay phán lệ pháp lý; “luật lệ” rõ nghĩa trong tiếng Việt hiện đại, đồng thời chú thích bảo lưu khả năng dịch khác.
theological_decisions:
- issue: Vai trò tư pháp của hội chúng trong việc phân xử án gây chết người
  choice: Câu giao cho hội chúng trách nhiệm phân xử giữa người đã đánh và người báo thù huyết, nhưng chưa gọi người bị xét xử là kẻ sát nhân.
  alternative: Hiểu “hội chúng” là một tòa án hẹp, hoặc dịch הַמַּכֶּה là “kẻ giết người.”
  rationale: Nguyên văn mô tả một tiến trình phân xử của cộng đồng và duy trì tính trung lập về thủ tục ở giai đoạn này; không nên đưa vào các định chế muộn hơn hay kết luận trước về tội danh.
translation_notes:
  register: Văn phong pháp lý, trang trọng nhưng dễ hiểu trong tiếng Việt hiện đại. Giữ “hội chúng” như một danh xưng tập thể và bảo lưu thành ngữ “báo thù huyết” bằng chú thích giải nghĩa.
