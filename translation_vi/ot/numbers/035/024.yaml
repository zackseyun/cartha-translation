  source_fidelity: Bản dịch tái hiện đúng trình tự pháp lý tương lai/quy định của וְשָׁפְטוּ, chủ thể tập thể הָעֵדָה, quan hệ phân xử giữa hai bên, và sắc thái không kết án trước của הַמַּכֶּה. Tuy nhiên, chú thích a dùng “người đòi nợ máu”, một cách nói dễ gợi nghĩa tài chính và không phải tương đương từ vựng an toàn của גֹּאֵל הַדָּם.
