base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/022.yaml
  text: But if he pushed him suddenly[a], without hostility, or threw any object at him without lying in wait[b],
translation:
  language: vi
  text: Nhưng nếu người ấy bất ngờ xô người kia, không có thù oán[a], hoặc ném một vật nào đó vào người kia mà không rình đợi[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “không có sự thù nghịch”. Từ Hê-bơ-rơ chỉ sự thù địch hoặc ác cảm giữa người với người.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “không phục kích” hoặc “không mưu tính trước”. Theo sát nguyên văn là “không rình đợi”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Nhưng nếu
  rationale: Mở đầu một trường hợp có điều kiện tương phản với các trường hợp cố ý ở những câu trước; “Nhưng nếu” diễn đạt rõ quan hệ ấy.
- source_word: בְּפֶתַע
  choice: bất ngờ
  rationale: Diễn tả hành động xảy ra đột ngột, không được dự liệu; “bất ngờ” tự nhiên trong tiếng Việt và phù hợp ngữ cảnh pháp lý.
- source_word: בְּלֹא אֵיבָה
  choice: mà không có lòng thù địch
  rationale: אֵיבָה chỉ sự thù địch hoặc ác cảm cá nhân. Cách dịch này giữ được ý nghĩa liên cá nhân mà không đồng nhất hoàn toàn với một thuật ngữ pháp lý hiện đại.
- source_word: הֲדָפוֹ
  choice: xô người kia
  rationale: Động từ chỉ hành động đẩy hoặc xô. “Xô” gọn, tự nhiên và phù hợp tình huống gây chết người ngoài ý muốn.
- source_word: הִשְׁלִיךְ עָלָיו
  choice: ném ... vào người kia
  rationale: Diễn tả việc ném một vật hướng vào hoặc lên người đó; “ném ... vào” là cách nói tự nhiên trong tiếng Việt.
- source_word: כָּל כְּלִי
  choice: bất cứ vật gì
  rationale: כְּלִי là từ rộng, có thể chỉ đồ vật, dụng cụ hoặc vật dụng. “Bất cứ vật gì” giữ tính khái quát của điều luật.
- source_word: בְּלֹא צְדִיָּה
  choice: mà không rình sẵn
  rationale: צְדִיָּה gợi việc rình chờ hay phục kích. “Không rình sẵn” giữ hình ảnh cụ thể của nguyên văn, thay vì thu hẹp hoặc mở rộng thành một phạm trù pháp lý hiện đại.
theological_decisions:
- issue: Mức độ chủ ý trong hành vi gây chết người
  choice: Giữ các mô tả cụ thể “không có lòng thù địch” và “không rình sẵn”
  alternative: Khái quát thành “không cố ý” hoặc “không mưu sát”
  rationale: Nguyên văn nêu các dấu hiệu cụ thể về quan hệ thù địch và sự rình chờ, chứ chưa dùng một thuật ngữ tổng quát tương đương hoàn toàn với các phạm trù pháp lý hiện đại.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “người ấy/người kia” để phân biệt hai người mà không thêm danh xưng không có trong nguyên văn. Giữ dấu phẩy cuối câu vì mệnh đề pháp lý tiếp tục sang câu kế tiếp.
