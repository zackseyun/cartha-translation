  source_fidelity: 'Bản dịch giữ đúng cấu trúc hai trường hợp thay thế trong tiếng Hê-bơ-rơ: xô đẩy bất ngờ không có sự thù nghịch, hoặc ném một vật vào người kia mà không rình đợi. Không diễn giải các dấu hiệu cụ thể này thành khái niệm pháp lý khái quát như “vô ý” hay “không cố ý”.'
  naturalness: “Không rình sẵn” không tự nhiên trong tiếng Việt hiện đại; “không rình đợi” diễn đạt rõ và tự nhiên hơn ý ‘không nằm chờ/phục kích’. “Không có thù oán” cũng là cách nói gọn và tự nhiên hơn “không có lòng thù địch”, mà vẫn giữ ý sự thù nghịch cá nhân.
