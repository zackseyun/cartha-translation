revisions:
- from: hoặc người ấy không nhìn thấy mà làm rơi trúng người kia bất cứ hòn đá nào có thể gây chết người[a], khiến người kia chết, dù người ấy không phải là kẻ thù của người kia và không tìm cách làm hại người kia—
  to: hoặc người ấy, không nhìn thấy[a], làm rơi xuống người kia một hòn đá có thể gây chết người, khiến người kia chết, dù người ấy không phải là kẻ thù của người kia và không tìm cách làm hại người kia—
