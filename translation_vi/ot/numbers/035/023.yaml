  terminology: “kẻ thù,” “tìm cách làm hại,” và “gây chết người” phù hợp ngữ cảnh pháp lý. Không cần áp đặt cách hiểu “vô ý”; giữ nguyên cụm cụ thể “không nhìn thấy” và chú thích giải thích phạm vi ngữ nghĩa.
  issues:
