base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/023.yaml
  text: or with any stone by which one could die[a], without seeing, he dropped it on him so that he died, though he was not his enemy and was not seeking his harm—
translation:
  language: vi
  text: hoặc người ấy, không nhìn thấy[a], làm rơi xuống người kia một hòn đá có thể gây chết người, khiến người kia chết, dù người ấy không phải là kẻ thù của người kia và không tìm cách làm hại người kia—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “không nhìn thấy.” Cụm từ này nói đến việc không nhận biết, chứ không nhất thiết khẳng định người ấy hoàn toàn không nhìn thấy gì.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹ
  choice: hoặc
  rationale: Tiếp nối các trường hợp trong điều luật ở câu trước; liên từ phân cách đơn giản giữ đúng mạch cú pháp.
- source_word: בְּכָל אֶבֶן אֲשֶׁר יָמוּת בָּהּ
  choice: bất cứ hòn đá nào có thể gây chết người
  rationale: Diễn đạt tự nhiên trong tiếng Việt về một hòn đá có khả năng gây tử vong, đồng thời giữ phạm vi rộng của כָל.
- source_word: בְּלֹא רְאוֹת
  choice: không nhìn thấy
  rationale: Giữ hình ảnh cụ thể của nguyên ngữ thay vì diễn giải thẳng thành 'vô ý'; trong ngữ cảnh, cụm này có thể chỉ việc không nhận biết điều mình đang làm.
- source_word: וַיִּפֵּל עָלָיו
  choice: làm rơi trúng người kia
  rationale: Dạng Hiphil của נפל mang ý gây khiến; cách dịch này giữ tác nhân và diễn tả tự nhiên việc hòn đá rơi trúng nạn nhân.
- source_word: וַיָּמֹת
  choice: khiến người kia chết
  rationale: Nêu rõ kết quả tử vong của hành động theo mạch điều luật.
- source_word: וְהוּא לֹא אֹיֵב לוֹ
  choice: dù người ấy không phải là kẻ thù của người kia
  rationale: 'Từ ''dù'' thể hiện tự nhiên sắc thái giải thích–nhượng bộ trong ngữ cảnh: cái chết không bắt nguồn từ thù địch.'
- source_word: וְלֹא מְבַקֵּשׁ רָעָתוֹ
  choice: và không tìm cách làm hại người kia
  rationale: רָעָה ở đây chỉ tổn hại trong bối cảnh pháp lý giữa người với người; cách dịch này rõ nghĩa và giữ yếu tố chủ ý.
