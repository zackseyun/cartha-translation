    issue: Trật tự từ trong mệnh đề hành động chưa tự nhiên và dễ gây vướng nghĩa.
    rationale: Cụm “làm rơi trúng người kia bất cứ hòn đá nào” tách động từ khỏi bổ ngữ trực tiếp và khiến “bất cứ hòn đá nào” đứng ở vị trí không tự nhiên. Nguyên ngữ nói rằng người ấy khiến một hòn đá rơi xuống nạn nhân.
  - severity: low
    issue: Dấu chú thích [a] không neo tại cụm “không nhìn thấy” mà chú thích đang giải thích.
    rationale: Chú thích nêu rõ nguyên văn “không nhìn thấy”; neo chú thích ngay sau cụm này giúp người đọc nhận diện chính xác từ ngữ được chú giải.
