  text: וַ/יְדַבֵּ֧ר יְהוָ֛ה אֶל מֹשֶׁ֖ה בְּ/עַֽרְבֹ֣ת מוֹאָ֑ב עַל יַרְדֵּ֥ן יְרֵח֖וֹ לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/001.yaml
  text: And Yahweh spoke to Moses in the plains of Moab by the Jordan at Jericho, saying,
translation:
  language: vi
  text: 'Yahweh phán với Môi-se trong vùng đồng bằng Mô-áp, bên sông Giô-đanh, gần Giê-ri-cô rằng:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: phán
  rationale: Động từ דבר trong công thức mở đầu lời Đức Chúa Trời được dịch tự nhiên và trang trọng là “phán”; dạng kể chuyện với waw mở ra một sự kiện phát ngôn mới.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ danh riêng của Đức Chúa Trời được biểu thị bằng Tứ tự YHWH, thay vì thay bằng một tước hiệu.
- source_word: אֶל־מֹשֶׁה
  choice: với Môi-se
  rationale: Cách nói “phán với Môi-se” là tiếng Việt tự nhiên cho hướng của lời truyền đạt, đồng thời giữ đúng tên riêng.
- source_word: בְּעַרְבֹת מוֹאָב
  choice: tại đồng bằng Mô-áp
  rationale: עֲרָבוֹת chỉ vùng đất bằng hoặc thảo nguyên; “đồng bằng Mô-áp” rõ nghĩa và phù hợp với địa danh quen dùng.
- source_word: עַל־יַרְדֵּן
  choice: bên sông Giô-đanh
  rationale: Trong mô tả địa lý này, עַל diễn tả vị trí gần hoặc sát sông; thêm “sông” giúp độc giả Việt nhận biết địa vật mà không làm đổi nghĩa.
- source_word: יְרֵחוֹ
  choice: ngang Giê-ri-cô
  rationale: Cụm Hê-bơ-rơ đặt Giê-ri-cô sau sông Giô-đanh và thường định vị khu đồng bằng Mô-áp ở phía đối diện thành; “ngang Giê-ri-cô” diễn đạt quan hệ địa lý tự nhiên mà không nói địa điểm nằm trong thành.
- source_word: לֵאמֹר
  choice: rằng
  rationale: Động từ nguyên mẫu này giới thiệu trực tiếp nội dung lời phán tiếp theo; “rằng” là cách nối gọn và tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Cách chuyển dịch danh יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA; CHÚA
  rationale: Nguyên văn dùng trực tiếp danh giao ước YHWH. Dùng “Yahweh” bảo tồn tính chất danh riêng, không thay bằng tước hiệu hay một dạng phiên âm truyền thống khác.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “phán” cho lời Đức Chúa Trời; giữ cấu trúc công thức mở đầu nhưng chuyển לֵאמֹר thành “rằng” để câu tiếng Việt tự nhiên. Các địa danh dùng dạng phiên âm Kinh Thánh quen thuộc trong tiếng Việt.
