source:
  edition: WLC
  text: וּ/מַדֹּתֶ֞ם מִ/ח֣וּץ לָ/עִ֗יר אֶת פְּאַת קֵ֣דְמָ/ה אַלְפַּ֪יִם בָּֽ/אַמָּ֟ה וְ/אֶת פְּאַת נֶגֶב֩ אַלְפַּ֨יִם בָּ/אַמָּ֜ה וְ/אֶת פְּאַת יָ֣ם אַלְפַּ֣יִם בָּֽ/אַמָּ֗ה וְ/אֵ֨ת פְּאַ֥ת צָפ֛וֹן אַלְפַּ֥יִם בָּ/אַמָּ֖ה וְ/הָ/עִ֣יר בַּ/תָּ֑וֶךְ זֶ֚ה יִהְיֶ֣ה לָ/הֶ֔ם מִגְרְשֵׁ֖י הֶ/עָרִֽים־־־־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/005.yaml
  text: 'You shall measure outside the city: the east side[a], two thousand cubits; the south side, two thousand cubits; the west side, two thousand cubits; and the north side, two thousand cubits, with the city in the middle[b]. This shall be for them the pasture lands of the cities.'
translation:
  language: vi
  text: 'Hãy đo bên ngoài thành: phía đông hai ngàn cu-bít, phía nam hai ngàn cu-bít, phía tây[a] hai ngàn cu-bít và phía bắc hai ngàn cu-bít, với thành ở chính giữa. Đó sẽ là đất chăn thả quanh các thành[b] dành cho họ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hê-bơ-rơ ở đây có nghĩa đen là “biển”, nhưng thường được dùng để chỉ phía tây vì Địa Trung Hải nằm về hướng ấy.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “đất chung” hoặc “đất trống quanh các thành”; từ Hê-bơ-rơ chỉ phần đất bao quanh một thành, thường được dùng để chăn thả.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמַדֹּתֶם
  choice: Hãy đo
  rationale: Dạng động từ trong văn luật pháp mang lực mệnh lệnh; “Hãy đo” tự nhiên trong tiếng Việt và giữ hành động đo đạc cụ thể.
- source_word: מִחוּץ לָעִיר
  choice: bên ngoài thành
  rationale: Chỉ khu vực nằm ngoài ranh giới thành; cách diễn đạt ngắn gọn và rõ nghĩa.
- source_word: פְּאַת
  choice: phía
  rationale: Trong ngữ cảnh đo đất theo bốn hướng, “phía” tự nhiên hơn “góc” và thể hiện đúng từng mặt định hướng.
- source_word: קֵדְמָה / נֶגֶב / יָם / צָפוֹן
  choice: phía đông / phía nam / phía tây / phía bắc
  rationale: Chuyển các từ chỉ phương hướng sang bốn hướng địa lý thông dụng; יָם nghĩa đen là “biển” nhưng theo thành ngữ định hướng Hê-bơ-rơ chỉ phía tây.
- source_word: אַלְפַּיִם בָּאַמָּה
  choice: hai ngàn cu-bít
  rationale: Giữ nguyên con số và đơn vị đo cổ của bản nguồn, không quy đổi phỏng đoán sang đơn vị hiện đại.
- source_word: וְהָעִיר בַּתָּוֶךְ
  choice: với thành ở chính giữa
  rationale: Diễn tả trực tiếp bố cục không gian, trong đó thành nằm giữa khu đất được đo.
- source_word: זֶה יִהְיֶה לָהֶם
  choice: Phần đất ấy sẽ ... dành cho họ
  rationale: Thể hiện ý chỉ định pháp lý mà không xác quyết quá mức về hình thức sở hữu.
- source_word: מִגְרְשֵׁי הֶעָרִים
  choice: đồng cỏ quanh các thành
  rationale: מִגְרָשׁ chỉ phần đất trống bao quanh thành, thường dùng để chăn thả; “đồng cỏ quanh các thành” dễ hiểu nhưng vẫn để chú thích nêu các sắc thái khác.
