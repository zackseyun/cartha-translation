translation_notes:
  register: Tiếng Việt hiện đại, trang trọng vừa phải và dễ đọc. Dùng mệnh lệnh không nêu đại từ để tránh sắc thái cổ của “các ngươi”; giữ “cu-bít” nhằm bảo toàn đơn vị đo trong văn bản nguồn. Các chú thích được đặt đúng ngay sau “phía tây” và cụm chỉ đất quanh thành.
