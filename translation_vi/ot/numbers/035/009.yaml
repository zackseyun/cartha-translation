  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/009.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: vi
  text: 'Yahweh[a] phán với Môi-se rằng:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ: «YHWH»; theo truyền thống thường được dịch là «Đức Chúa Trời» hoặc «CHÚA».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: phán
  rationale: Động từ דבר trong công thức dẫn nhập lời của Đức Chúa Trời được dịch tự nhiên và trang trọng là “phán”, đồng thời phân biệt với לֵאמֹר ở cuối câu.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng cách gọi tên riêng của Đức Chúa Trời đã quen thuộc trong tiếng Việt, thay vì thay thế bằng một tước hiệu; hình thức này tương ứng với danh YHWH trong tiếng Hê-bơ-rơ.
- source_word: אֶל
  choice: với
  rationale: Trong kết cấu “phán với”, giới từ này đánh dấu người tiếp nhận lời phán và phù hợp với cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: מֹשֶׁה
  choice: Môi-se
  rationale: Dùng dạng phiên âm tên riêng đã phổ biến trong truyền thống Kinh Thánh tiếng Việt.
- source_word: לֵאמֹר
  choice: rằng
  rationale: Trong tiếng Việt, “rằng” là từ dẫn tự nhiên cho nội dung lời phán tiếp theo, truyền đạt chức năng của nguyên mẫu לֵאמֹר mà không tạo câu gượng như “để nói”.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Đức Giê-hô-va
  alternative: Yahweh; CHÚA
  rationale: Bản Hê-bơ-rơ dùng trực tiếp danh riêng YHWH. “Đức Giê-hô-va” giữ chức năng danh riêng và là hình thức quen thuộc, trang trọng đối với độc giả Việt; không thay danh ấy bằng tước hiệu “CHÚA”.
translation_notes:
  register: Văn phong hiện đại, trang trọng và tự nhiên. Giữ công thức dẫn nhập lời phán bằng cấu trúc tiếng Việt quen thuộc “phán với … rằng”, với dấu hai chấm báo trước nội dung ở câu kế tiếp.
