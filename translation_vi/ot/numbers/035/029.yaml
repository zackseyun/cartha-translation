base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/029.yaml
  text: And these shall be for you a statute of judgment throughout your generations in all your dwelling places[a][b].
translation:
  language: vi
  text: Những điều này sẽ là quy định pháp lý cho anh em qua mọi thế hệ, tại tất cả những nơi anh em cư ngụ.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “quy định về việc xét xử” hoặc “quy chế tư pháp”. Cụm từ Hê-bơ-rơ kết hợp thuật ngữ chỉ quy định được thiết lập với thuật ngữ chỉ sự xét xử hoặc thủ tục pháp lý.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “trong tất cả các khu định cư của anh em”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיוּ אֵלֶּה
  choice: Những điều này sẽ là
  rationale: Cụm này chỉ các điều luật vừa nêu và mang sắc thái quy định có hiệu lực lâu dài; cách dịch giữ rõ ý hướng về tương lai mà vẫn tự nhiên trong tiếng Việt.
- source_word: לָכֶם
  choice: cho anh em
  rationale: Giới từ đánh dấu đối tượng được ban quy định; “anh em” phù hợp với lời nói hướng đến toàn thể cộng đồng Israel.
- source_word: לְחֻקַּת מִשְׁפָּט
  choice: quy định pháp lý
  rationale: Hai danh từ Hê-bơ-rơ kết hợp ý về một quy định được thiết lập và việc xét xử hay thủ tục tư pháp. “Quy định pháp lý” diễn đạt gọn tính chất pháp định và tư pháp mà không thu hẹp thành một bản án riêng lẻ.
- source_word: לְדֹרֹתֵיכֶם
  choice: qua mọi thế hệ
  rationale: Thành ngữ nói đến hiệu lực tiếp tục qua các thế hệ kế tiếp.
- source_word: בְּכֹל מוֹשְׁבֹתֵיכֶם
  choice: tại tất cả những nơi anh em cư ngụ
  rationale: מוֹשָׁב có thể chỉ nơi cư trú hoặc khu định cư; cách dịch này giữ nghĩa địa điểm và tự nhiên trong tiếng Việt hiện đại.
theological_decisions: []
translation_notes:
  register: Văn phong pháp luật trang trọng nhưng hiện đại, dễ hiểu. Dùng “anh em” ở số nhiều để chuyển lời nói với cộng đồng Israel; giữ hai chú thích nhằm phản ánh phạm vi nghĩa của các cụm pháp lý và địa điểm trong nguyên văn.
