  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/אִ֡ם בְּ/אֶ֣בֶן יָד֩ אֲשֶׁר יָמ֨וּת בָּ֥/הּ הִכָּ֛ה/וּ וַ/יָּמֹ֖ת רֹצֵ֣חַֽ ה֑וּא מ֥וֹת יוּמַ֖ת הָ/רֹצֵֽחַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/017.yaml
  text: Or if he struck him with a stone in the hand[a], by which one could die, and he died, he is a murderer; the murderer must surely be put to death.
translation:
  language: vi
  text: Hoặc nếu người ấy dùng một hòn đá cầm trong tay[a], loại có thể gây chết người, mà đánh người kia và người kia chết, thì người ấy là kẻ sát nhân; kẻ sát nhân chắc chắn phải bị xử tử.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn Hê-bơ-rơ sát nghĩa là “bằng một hòn đá của tay”, tức là hòn đá được cầm trong tay hoặc thích hợp để dùng bằng tay làm hung khí.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Hoặc nếu
  rationale: Mở đầu một trường hợp bổ sung trong chuỗi quy định pháp lý; “Hoặc nếu” diễn đạt tự nhiên quan hệ lựa chọn trong tiếng Việt.
- source_word: בְּאֶבֶן יָד
  choice: dùng một hòn đá cầm trong tay
  rationale: Cụm Hê-bơ-rơ có nghĩa sát là “đá của tay”; cách dịch này giữ hình ảnh cụ thể về hòn đá được cầm và dùng làm hung khí mà không xác định quá mức kích thước.
- source_word: אֲשֶׁר יָמוּת בָּהּ
  choice: loại có thể gây chết người
  rationale: Mệnh đề mô tả khả năng gây chết của hòn đá. Cách diễn đạt này tự nhiên trong ngữ cảnh pháp lý và không giới hạn ý nghĩa vào riêng nạn nhân đang được nói đến.
- source_word: הִכָּהוּ
  choice: đánh người kia
  rationale: נכה có nghĩa là đánh hoặc giáng đòn; “đánh” không nói trước kết quả vì cái chết được nêu riêng ngay sau đó.
- source_word: וַיָּמֹת
  choice: và người kia chết
  rationale: Giữ trình tự trực tiếp của nguyên văn, đồng thời làm rõ đại từ trong tiếng Việt để tránh nhầm người đánh với nạn nhân.
- source_word: רֹצֵחַ הוּא
  choice: người ấy là kẻ sát nhân
  rationale: Trong ngữ cảnh tư pháp này, רצח chỉ hành vi giết người có tội, nên “kẻ sát nhân” phù hợp hơn từ trung tính như “kẻ giết người”.
- source_word: מוֹת יוּמַת
  choice: chắc chắn phải bị xử tử
  rationale: Kết cấu nguyên thể tuyệt đối đi với động từ hữu hạn nhấn mạnh tính bắt buộc của hình phạt; “chắc chắn phải” bảo toàn sắc thái nhấn mạnh ấy.
- source_word: הָרֹצֵחַ
  choice: kẻ sát nhân
  rationale: Lặp lại danh từ pháp lý như nguyên văn để giữ sự trang trọng và nhấn mạnh đối tượng chịu án.
theological_decisions:
- issue: Phân loại pháp lý người gây chết trong luật về các thành trú ẩn
  choice: Dịch רצח là “kẻ sát nhân”.
  alternative: “kẻ giết người” hoặc “người ngộ sát”
  rationale: Ngữ cảnh kế cận phân biệt hành vi cố ý, có tội với việc vô tình gây chết người. “Kẻ sát nhân” thể hiện phán quyết pháp lý và đạo đức của câu mà không đưa thêm giáo lý về sau.
translation_notes:
  register: Văn phong pháp lý, trang trọng nhưng hiện đại và dễ hiểu. Dùng “người ấy/người kia” để phân biệt thủ phạm với nạn nhân; giữ phép lặp “kẻ sát nhân” và sức nhấn mạnh của án phạt trong nguyên văn.
