  text: וְ/אֵ֣ת הֶֽ/עָרִ֗ים אֲשֶׁ֤ר תִּתְּנוּ֙ לַ/לְוִיִּ֔ם אֵ֚ת שֵׁשׁ עָרֵ֣י הַ/מִּקְלָ֔ט אֲשֶׁ֣ר תִּתְּנ֔וּ לָ/נֻ֥ס שָׁ֖מָּ/ה הָ/רֹצֵ֑חַ וַ/עֲלֵי/הֶ֣ם תִּתְּנ֔וּ אַרְבָּעִ֥ים וּ/שְׁתַּ֖יִם עִֽיר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/006.yaml
  text: And the cities that you give to the Levites shall be the six cities of refuge[a], which you shall give for the manslayer to flee there; and besides them you shall give forty-two cities.
translation:
  language: vi
  text: Các thành anh em cấp cho người Lê-vi gồm sáu thành trú ẩn, là những thành anh em phải dành để người đã làm chết người[a] chạy trốn đến đó; ngoài các thành này, anh em phải cấp thêm bốn mươi hai thành.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “người giết người,” “người sát hại” hoặc “kẻ giết người.” Từ Hê-bơ-rơ này, trong bối cảnh pháp luật về các thành trú ẩn, chỉ người đã gây ra cái chết nhưng tự nó không cho biết việc đó là cố ý hay vô ý.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶעָרִים
  choice: các thành
  rationale: עִיר có thể chỉ thành hoặc thị trấn; “thành” là cách gọi tự nhiên và nhất quán trong bối cảnh phân cấp nơi cư trú này.
- source_word: לַלְוִיִּם
  choice: cho người Lê-vi
  rationale: Diễn đạt trực tiếp đối tượng được cấp các thành; dạng số nhiều tập thể được chuyển tự theo lối quen thuộc trong tiếng Việt.
- source_word: שֵׁשׁ עָרֵי הַמִּקְלָט
  choice: sáu thành trú ẩn
  rationale: מִקְלָט chỉ nơi nương náu hoặc tị nạn; “thành trú ẩn” vừa rõ chức năng pháp lý vừa tự nhiên trong tiếng Việt hiện đại.
- source_word: לָנוּס שָׁמָּה
  choice: chạy trốn đến đó
  rationale: Giữ nghĩa “chạy trốn” của נוּס và hướng đến nơi ấy của שָׁמָּה.
- source_word: הָרֹצֵחַ
  choice: người giết người
  rationale: Trong quy chế về thành trú ẩn, từ này chỉ người đã gây ra cái chết nhưng tự nó không xác định hành vi là cố ý hay vô ý; cách dịch này không áp đặt động cơ.
- source_word: וַעֲלֵיהֶם
  choice: Ngoài các thành ấy ... cấp thêm
  rationale: Trong thành ngữ này, עַל biểu thị phần được bổ sung; cách diễn đạt tiếng Việt làm rõ rằng bốn mươi hai thành là số thêm ngoài sáu thành trú ẩn.
- source_word: אַרְבָּעִים וּשְׁתַּיִם עִיר
  choice: bốn mươi hai thành
  rationale: Tiếng Hê-bơ-rơ dùng danh từ số ít sau số đếm trong cấu trúc này, còn tiếng Việt tự nhiên dùng “bốn mươi hai thành”.
theological_decisions:
- issue: Mức độ chủ ý trong הָרֹצֵחַ
  choice: người giết người
  alternative: kẻ sát nhân
  rationale: “Kẻ sát nhân” thường hàm ý cố ý phạm tội, trong khi thuật ngữ Hê-bơ-rơ tại đây, xét riêng nó và trong bối cảnh thành trú ẩn, chưa phân định cố ý hay vô ý.
translation_notes:
  register: Văn phong pháp lý–tường thuật trang trọng nhưng dễ hiểu. Dùng “anh em” cho ngôi thứ hai số nhiều và tránh từ ngữ khiến người đọc mặc nhiên kết luận người gây chết đã cố ý giết người.
