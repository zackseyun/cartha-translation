  text: But if the manslayer does indeed go out beyond the boundary of his city of refuge, to which he fled,[a]
translation:
  language: vi
  text: Nhưng nếu người làm chết người quả thật đi ra khỏi ranh giới của thành trú ẩn mà người ấy đã chạy đến,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đi ra khỏi địa phận của thành trú ẩn mà người ấy đã chạy đến.” Tiếng Hê-bơ-rơ dùng nguyên mẫu tuyệt đối cùng với động từ hữu hạn (nghĩa đen: “đi ra, người ấy đi ra”) để nhấn mạnh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Nhưng nếu
  rationale: Mở đầu một điều kiện tương phản với quy định pháp lý ngay trước đó; cách dịch này tự nhiên và giữ được sắc thái đối lập theo ngữ cảnh.
- source_word: יָצֹא יֵצֵא
  choice: quả thật đi ra
  rationale: Cấu trúc nguyên mẫu tuyệt đối đi với động từ hữu hạn nhấn mạnh hành động đi ra; “quả thật” chuyển tải sự nhấn mạnh mà vẫn tự nhiên trong tiếng Việt.
- source_word: הָרֹצֵחַ
  choice: người ngộ sát
  rationale: Trong luật về thành trú ẩn, từ này chỉ người đã làm chết người và chạy đến nơi trú ẩn, không mặc nhiên xác định đó là kẻ cố ý giết người. “Người ngộ sát” phù hợp với ngữ cảnh pháp lý này.
- source_word: אֶת גְּבוּל
  choice: ra ngoài ranh giới
  rationale: Khi đi với động từ “đi ra”, cụm này diễn tả việc vượt khỏi giới hạn đã định; cách dịch làm rõ hành động ra khỏi phạm vi thành.
- source_word: עִיר מִקְלָטוֹ
  choice: thành trú ẩn
  rationale: Cách gọi rõ ràng, trang trọng và tự nhiên cho địa điểm được luật định làm nơi trú ẩn. Quan hệ với người ngộ sát được thể hiện tự nhiên qua mệnh đề theo sau thay vì dùng sở hữu từ gượng ép.
- source_word: אֲשֶׁר יָנוּס שָׁמָּה
  choice: mình đã chạy đến
  rationale: Giữ ý hướng đến nơi ấy của שָׁמָּה và nhận diện đây là thành mà người ấy đã chạy tới; “mình” quy chiếu tự nhiên về chủ thể trong câu.
theological_decisions: []
translation_notes:
  register: Văn phong pháp lý, trang trọng nhưng dễ hiểu trong tiếng Việt hiện đại. Dùng “người ngộ sát” để tránh hàm ý cố ý giết người mà nguyên văn trong ngữ cảnh này chưa xác định; giữ dấu phẩy cuối câu vì câu luật còn tiếp sang câu kế.
