  to: Nhưng nếu người làm chết người quả thật đi ra khỏi ranh giới của thành trú ẩn mà người ấy đã chạy đến,[a]
  rationale: Sửa thuật ngữ chỉ người làm chết người để không áp đặt tính vô ý mà nguyên văn câu không nêu rõ; đồng thời sửa cấu trúc mệnh đề quan hệ cho tự nhiên. Dấu phẩy cuối câu được giữ vì quy định tiếp tục ở câu sau.
