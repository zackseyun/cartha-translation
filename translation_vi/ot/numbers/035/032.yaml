  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/לֹא תִקְח֣וּ כֹ֔פֶר לָ/נ֖וּס אֶל עִ֣יר מִקְלָט֑/וֹ לָ/שׁוּב֙ לָ/שֶׁ֣בֶת בָּ/אָ֔רֶץ עַד מ֖וֹת הַ/כֹּהֵֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/032.yaml
  text: And you shall not take a ransom for him who has fled to his city of refuge[b][a], so that he may return to live in the land before the death of the priest.
translation:
  language: vi
  text: Các ngươi không được nhận tiền chuộc[a] cho người đã chạy đến thành trú ẩn của mình, để người ấy trở về sinh sống trong xứ trước khi vị tư tế qua đời.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “tiền bồi hoàn” hoặc “khoản thanh toán”; từ Hê-bơ-rơ כֹּפֶר chỉ giá chuộc hoặc khoản bồi hoàn.
    reason: lexical_alternative
  - marker: b
    text: Cú pháp Hê-bơ-rơ rất cô đọng. Cũng có thể hiểu câu này là cấm nhận một khoản tiền liên quan đến việc người ấy chạy vào, ở lại hoặc trở về từ thành trú ẩn trước khi vị tư tế qua đời. Cụm cuối có hình thức sát chữ là “cho đến khi vị tư tế qua đời”.
    reason: alternative_reading
lexical_decisions:
- source_word: כֹּפֶר
  choice: tiền chuộc
  rationale: Từ này chỉ khoản tiền chuộc hoặc khoản bồi hoàn được nhận thay cho hậu quả pháp lý bắt buộc. “Tiền chuộc” diễn đạt chính xác chức năng pháp lý hơn “tiền bồi thường”, còn “tiền hối lộ” mang sắc thái lên án không có sẵn trong từ Hê-bơ-rơ.
- source_word: לָנוּס אֶל עִיר מִקְלָטוֹ
  choice: cho người đã chạy đến thành trú ẩn của mình
  rationale: Dạng nguyên mẫu của נוּס được hiểu theo ngữ cảnh là chỉ người đã chạy đến nơi trú ẩn. Cách diễn đạt này tự nhiên trong tiếng Việt và phù hợp với tình trạng của người ngộ sát trong luật về thành trú ẩn, nhưng tính cô đọng của cú pháp được ghi nhận trong chú thích.
- source_word: עִיר מִקְלָטוֹ
  choice: thành trú ẩn của mình
  rationale: “Thành trú ẩn” là cách gọi rõ ràng, tự nhiên cho thành được chỉ định làm nơi lánh nạn; “của mình” giữ hậu tố sở hữu ngôi thứ ba.
- source_word: לָשׁוּב לָשֶׁבֶת בָּאָרֶץ
  choice: trở về sinh sống trong xứ
  rationale: Hai động từ nguyên mẫu diễn tả việc trở lại rồi cư trú; “sinh sống” là cách nói hiện đại và tự nhiên, còn “trong xứ” giữ ý nghĩa địa lý-pháp lý của הָאָרֶץ trong ngữ cảnh.
- source_word: עַד מוֹת הַכֹּהֵן
  choice: trước khi vị tư tế qua đời
  rationale: Trong câu cấm này, cụm từ đặt cái chết của vị tư tế làm mốc mà trước đó người ấy không được dùng tiền chuộc để trở về. Cách dịch “trước khi” làm rõ lực pháp lý theo ngữ cảnh; nghĩa đen về hình thức là “cho đến khi vị tư tế qua đời” được ghi nhận trong chú thích.
- source_word: הַכֹּהֵן
  choice: vị tư tế
  rationale: Bản Hê-bơ-rơ ở câu này chỉ nói “vị tư tế”, không lặp lại tính từ “thượng phẩm”; vì vậy bản dịch không tự ý thêm “thượng tế”, dù ngữ cảnh trước đó xác định chức vụ ấy.
theological_decisions:
- issue: Phạm vi của lệnh cấm nhận tiền chuộc đối với người chạy đến thành trú ẩn
  choice: Lệnh cấm được diễn đạt là không nhận khoản tiền giúp người ấy trở về sinh sống trong xứ trước khi vị tư tế qua đời.
  alternative: Có thể hiểu cú pháp sát chữ hơn là cấm khoản tiền liên quan đến việc người ấy chạy đến thành trú ẩn, hoặc liên quan đến việc ở lại hay trở về từ đó.
  rationale: Cú pháp Hê-bơ-rơ cô đọng và quan hệ giữa לָנוּס, thành trú ẩn, cùng hai động từ “trở về, cư trú” không hoàn toàn minh nhiên. Bản chính theo mạch luật pháp của đoạn văn nhưng chú thích bảo lưu cách phân tích khác, không thu hẹp căng thẳng của nguyên văn.
- issue: Danh tính của הַכֹּהֵן
  choice: Dịch là “vị tư tế”.
  alternative: Dịch là “vị thượng tế” dựa trên Dân Số 35:25, 28.
  rationale: Ngữ cảnh hướng đến vị thượng tế, nhưng chính câu 32 chỉ có danh từ xác định “vị tư tế”. Giữ hình thức ngắn hơn tránh bổ sung một danh hiệu không hiện diện tại câu này.
translation_notes:
  register: Văn phong pháp lý, trang trọng nhưng hiện đại. Dùng “các ngươi” để giữ lời truyền lệnh ở số nhiều; dùng “tư tế” thay cho lối nói cũ “thầy tế lễ”. “Thành trú ẩn” và “tiền chuộc” là các thuật ngữ dễ hiểu, nhất quán với nội dung luật pháp.
