- from: và người báo thù huyết gặp người ấy bên ngoài ranh giới thành trú ẩn của người ấy, rồi người báo thù huyết giết người đã gây chết người, thì người báo thù huyết không mắc tội đổ máu.[a]
  to: và người báo thù huyết bắt gặp người ấy bên ngoài ranh giới thành trú ẩn của người ấy, rồi người báo thù huyết giết người đã gây chết người, thì người báo thù huyết không mắc tội đổ máu.[a]
  rationale: Chỉ thay “gặp” bằng “bắt gặp” để phản ánh chính xác và tự nhiên hơn động từ מָצָא. Những lựa chọn còn lại được giữ vì trung thành với cách diễn đạt pháp lý của nguyên văn, kể cả sự trung tính về mức độ cố ý của hành vi gây chết người.
