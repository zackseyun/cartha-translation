  text: וּ/מָצָ֤א אֹת/וֹ֙ גֹּאֵ֣ל הַ/דָּ֔ם מִ/ח֕וּץ לִ/גְב֖וּל עִ֣יר מִקְלָט֑/וֹ וְ/רָצַ֞ח גֹּאֵ֤ל הַ/דָּם֙ אֶת הָ֣/רֹצֵ֔חַ אֵ֥ין ל֖/וֹ דָּֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/027.yaml
  text: and the avenger of blood finds him outside the boundary of his city of refuge[a], and the avenger of blood kills the manslayer[b], he is not guilty of blood.
translation:
  language: vi
  text: và người báo thù huyết bắt gặp người ấy bên ngoài ranh giới thành trú ẩn của người ấy, rồi người báo thù huyết giết người đã gây chết người, thì người báo thù huyết không mắc tội đổ máu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hê-bơ-rơ: “không có huyết cho người ấy”, nghĩa là người báo thù huyết không phải chịu trách nhiệm về máu đã đổ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גֹּאֵל הַדָּם
  choice: người báo thù huyết
  rationale: Cụm từ chỉ người có thẩm quyền báo thù cho người bị giết. Cách dịch này giữ được hình ảnh pháp lý về huyết mà không thêm ý quan hệ họ hàng vốn không được nói rõ trong câu.
- source_word: מִחוּץ לִגְבוּל
  choice: bên ngoài ranh giới
  rationale: Diễn đạt vị trí ở ngoài phạm vi bảo vệ được xác định về mặt không gian và pháp lý của thành trú ẩn.
- source_word: עִיר מִקְלָטוֹ
  choice: thành trú ẩn của người ấy
  rationale: Giữ thuật ngữ pháp lý nhất quán cho nơi người gây chết người chạy đến nương náu, đồng thời bảo toàn hậu tố sở hữu của nguyên văn.
- source_word: וְרָצַח
  choice: giết
  rationale: Trong ngữ cảnh này, hành vi được tuyên là không làm phát sinh tội đổ máu; vì vậy, dùng từ trung tính “giết” thay vì “giết hại” hay “sát hại”, vốn dễ hàm ý hành vi phạm pháp.
- source_word: הָרֹצֵחַ
  choice: người đã gây chết người
  rationale: Chỉ người đã làm một người khác chết và chạy vào thành trú ẩn. Cách diễn đạt này tránh mặc nhiên quy kết tội cố sát, phù hợp với ngữ cảnh luật về trường hợp gây chết người không chủ ý.
- source_word: אֵין לוֹ דָּם
  choice: không mắc tội đổ máu
  rationale: Chuyển thành ngữ Hê-bơ-rơ “không có huyết cho người ấy” sang cách nói tiếng Việt dễ hiểu mà vẫn giữ nội dung pháp lý về trách nhiệm huyết.
theological_decisions:
- issue: Sắc thái đạo đức và pháp lý của רצח khi nói về hành vi giết người được miễn trách nhiệm huyết
  choice: Dịch động từ là “giết”, không phải “sát hại” hay “giết người phạm pháp”.
  alternative: Dùng một từ luôn hàm ý cố sát để đồng nhất với một số chỗ khác có רצח.
  rationale: Chính câu này tuyên bố người báo thù huyết không mắc tội đổ máu, nên một từ tiếng Việt mặc nhiên chỉ hành vi giết người phạm pháp sẽ tạo ra mâu thuẫn không có trong nguyên văn.
- issue: Chủ thể của mệnh đề אֵין לוֹ דָּם
  choice: Nêu rõ là “người báo thù huyết” không mắc tội đổ máu.
  alternative: Giữ đại từ “người ấy”, có thể khiến độc giả tiếng Việt hiểu nhầm là người đã gây chết người.
  rationale: Cấu trúc câu và ngữ cảnh pháp lý cho thấy đại từ לוֹ quy về người báo thù huyết, tức chủ thể của hành động giết; nêu rõ danh xưng giúp tiếng Việt tự nhiên và tránh mơ hồ giả tạo.
translation_notes:
  register: Văn phong pháp lý, trang trọng nhưng hiện đại. “Thành trú ẩn” được dùng như thuật ngữ nhất quán; “người đã gây chết người” tránh hàm ý cố sát không có trong ngữ cảnh trực tiếp. Dấu chú thích [a] xuất hiện sau toàn bộ mệnh đề thành ngữ mà chú thích giải thích.
