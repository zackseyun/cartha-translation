  text: וְ/אִם בִּ/כְלִ֨י בַרְזֶ֧ל הִכָּ֛ה/וּ וַ/יָּמֹ֖ת רֹצֵ֣חַֽ ה֑וּא מ֥וֹת יוּמַ֖ת הָ/רֹצֵֽחַ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/016.yaml
  text: But if he struck him with an iron tool and he died[a], he is a murderer; the murderer must surely be put to death.
translation:
  language: vi
  text: Nhưng nếu người ấy dùng một vật bằng sắt đánh người kia, và người kia chết[a], thì người ấy là kẻ giết người; kẻ giết người chắc chắn phải bị xử tử.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cụm này cũng có thể dịch là “dùng một dụng cụ bằng sắt” hoặc “dùng một đồ vật bằng sắt”. Từ Hê-bơ-rơ có nghĩa rộng, không tự nó chỉ đích danh một loại vũ khí.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Nhưng nếu
  rationale: Mở đầu một trường hợp có điều kiện trong chuỗi luật; “Nhưng nếu” diễn đạt tự nhiên sự chuyển tiếp đối chiếu với trường hợp trước.
- source_word: בִּכְלִי בַרְזֶל
  choice: dùng một vật bằng sắt
  rationale: כְּלִי có nghĩa rộng, chỉ đồ vật, dụng cụ hoặc vật dụng; cách dịch này không thu hẹp nghĩa thành một loại vũ khí cụ thể.
- source_word: הִכָּהוּ
  choice: đánh nạn nhân
  rationale: Động từ נכה ở thể Hiphil thường có nghĩa là đánh hoặc giáng đòn. “Nạn nhân” giúp phân biệt tự nhiên hai người nam trong câu mà không thêm danh tính.
- source_word: וַיָּמֹת
  choice: và nạn nhân chết
  rationale: Giữ trình tự đơn giản của tiếng Hê-bơ-rơ, không diễn giải quan hệ nhân quả mạnh hơn điều văn bản trực tiếp nói.
- source_word: רֹצֵחַ הוּא
  choice: người ấy là kẻ giết người
  rationale: Trong luật về án mạng của chương này, רֹצֵחַ chỉ người bị xác định có tội giết người, đối lập với trường hợp ngộ sát.
- source_word: מוֹת יוּמַת
  choice: chắc chắn phải bị xử tử
  rationale: Diễn đạt cả nghĩa vụ pháp lý của dạng bị động lẫn sắc thái nhấn mạnh do nguyên mẫu tuyệt đối đi kèm động từ.
- source_word: הָרֹצֵחַ
  choice: kẻ giết người
  rationale: Giữ nguyên sự lặp lại danh xưng pháp lý của người phạm tội trong vế tuyên án.
theological_decisions:
- issue: Phân loại pháp lý của רֹצֵחַ trong câu này
  choice: kẻ giết người
  alternative: kẻ sát nhân; người gây chết người
  rationale: Ngữ cảnh phân biệt hành vi có tội với ngộ sát và quy định án tử hình. “Kẻ giết người” phản ánh phán quyết pháp lý mà không dùng một thuật ngữ quá chuyên biệt hoặc cổ.
translation_notes:
  register: Văn phong luật pháp trang trọng nhưng hiện đại. Dùng “người ấy” và “nạn nhân” để tránh chuỗi đại từ dễ gây mơ hồ trong tiếng Việt; giữ cấu trúc điều kiện, nhận định tội trạng và hình phạt của nguyên văn.
