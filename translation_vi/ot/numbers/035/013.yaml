revisions:
- from: Còn những thành mà các con cấp, sẽ là sáu thành trú ẩn cho các con.
  to: Những thành các ngươi cấp sẽ là sáu thành trú ẩn cho các ngươi.
  rationale: Thay «các con» bằng «các ngươi» để tránh thêm sắc thái quan hệ không có trong tiếng Hê-bơ-rơ. Giữ «cấp», «sáu thành trú ẩn», và cấu trúc tương lai/chỉ thị của câu. Không cần chú thích vì không có vấn đề văn bản hoặc từ vựng cần giải thích trong bản dịch.
