  verdict: revise
  source_fidelity: 'Bản dịch giữ đúng các yếu tố cốt lõi: các thành được cấp, số lượng sáu, và chức năng là các thành trú ẩn. Tuy nhiên, «các con» thêm một sắc thái quan hệ cha-con không được biểu thị bởi hậu tố ngôi thứ hai số nhiều trong tiếng Hê-bơ-rơ; trong lời quy định này, «các ngươi» trung tính và sát nguồn hơn.'
