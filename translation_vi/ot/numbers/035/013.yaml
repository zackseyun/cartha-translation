  text: וְ/הֶ/עָרִ֖ים אֲשֶׁ֣ר תִּתֵּ֑נוּ שֵׁשׁ עָרֵ֥י מִקְלָ֖ט תִּהְיֶ֥ינָה לָ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/013.yaml
  text: And the cities that you give shall be six cities of refuge for you.
translation:
  language: vi
  text: Những thành các ngươi cấp sẽ là sáu thành trú ẩn cho các ngươi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/הֶ/עָרִים
  choice: Còn những thành
  rationale: Danh từ số nhiều có mạo từ xác định và liên từ וְ. Trong mạch văn quy định, “Còn những thành” tự nhiên hơn “Và những thành” trong tiếng Việt, đồng thời nêu chủ đề mà không thêm ý.
- source_word: אֲשֶׁר
  choice: mà
  rationale: Đại từ quan hệ bổ nghĩa cho “những thành”; “mà” là cách diễn đạt tự nhiên trong tiếng Việt hiện đại.
- source_word: תִּתֵּנוּ
  choice: các con cấp
  rationale: Qal vị hoàn thành 2 số nhiều của נתן, mang nghĩa dự kiến/chỉ thị trong văn cảnh luật pháp. “Cấp” diễn đạt việc dành hoặc trao các thành cho chức năng được quy định, nhưng không diễn giải quá mức.
- source_word: שֵׁשׁ
  choice: sáu
  rationale: Số đếm được dịch trực tiếp.
- source_word: עָרֵי מִקְלָט
  choice: thành trú ẩn
  rationale: Cụm liên kết nghĩa đen là “các thành của nơi trú ẩn”. “Thành trú ẩn” ngắn gọn, rõ chức năng pháp lý và dễ hiểu trong tiếng Việt hiện đại.
- source_word: תִּהְיֶינָה
  choice: sẽ là
  rationale: Qal vị hoàn thành 3 giống cái số nhiều của היה, phù hợp với “những thành”. “Sẽ là” bảo toàn sắc thái tương lai/kết quả của chỉ thị.
- source_word: לָ/כֶם
  choice: cho các con
  rationale: Giới từ לְ với hậu tố ngôi 2 số nhiều chỉ đối tượng hưởng lợi hoặc quy chiếu; “cho các con” là tự nhiên trong văn cảnh Đức Chúa Trời phán với dân qua Môi-se.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “các con” để thể hiện ngôi thứ hai số nhiều trong lời chỉ dẫn dành cho cộng đồng; câu giữ cấu trúc chủ đề–vị ngữ của tiếng Hê-bơ-rơ mà vẫn tự nhiên trong tiếng Việt.
