id: NUM.15.3
reference: Numbers 15:3
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/עֲשִׂיתֶ֨ם אִשֶּׁ֤ה לַֽ/יהוָה֙ עֹלָ֣ה אוֹ זֶ֔בַח לְ/פַלֵּא נֶ֨דֶר֙ א֣וֹ בִ/נְדָבָ֔ה א֖וֹ בְּ/מֹעֲדֵי/כֶ֑ם לַ/עֲשׂ֞וֹת רֵ֤יחַ נִיחֹ֨חַ֙ לַֽ/יהוָ֔ה מִן הַ/בָּקָ֖ר א֥וֹ מִן הַ/צֹּֽאן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/003.yaml
  text: and you present an offering by fire to Yahweh—either a burnt offering or a sacrifice—to fulfill a vow[a], or as a freewill offering, or at your appointed times, to make a pleasing aroma to Yahweh, from the herd or from the flock[b],
translation:
  language: vi
  text: và anh em dâng cho Yahweh một lễ vật dâng bằng lửa[a]—hoặc lễ thiêu hoặc sinh tế—để thực hiện một lời khấn nguyện, hoặc dâng lễ vật tự nguyện, hoặc vào những kỳ đã định của anh em[b], để làm thành hương thơm đẹp lòng Yahweh, từ đàn bò hoặc đàn chiên dê,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “một hỏa tế”.
    reason: Nêu phương án thuật ngữ tế tự khác cho אִשֶּׁה; “lễ vật dâng bằng lửa” trong bản văn chính làm rõ nghĩa cho độc giả hiện đại.
  - marker: b
    text: Hay “vào những kỳ lễ đã định của anh em”. Từ Hê-bơ-rơ có thể chỉ rộng các thời điểm đã định hoặc cụ thể hơn là những dịp lễ hội.
    reason: Bảo tồn phạm vi nghĩa của מוֹעֵד và được neo ngay sau cụm בְּמֹעֲדֵיכֶם mà chú thích giải thích.
lexical_decisions:
- source_word: וַעֲשִׂיתֶם אִשֶּׁה
  choice: anh em dâng ... một lễ vật hỏa tế
  rationale: Động từ ‘làm’ mang nghĩa dâng lễ trong ngữ cảnh tế tự; ‘lễ vật hỏa tế’ giữ được tính chất thuật ngữ của אִשֶּׁה mà vẫn gọn và rõ.
- source_word: לַיהוָה
  choice: lên Yahweh
  rationale: Giữ nguyên danh giao ước Yahweh; ‘dâng lên’ diễn đạt tự nhiên hướng của lễ vật.
- source_word: עֹלָה
  choice: lễ thiêu
  rationale: Thuật ngữ quen thuộc và chính xác cho lễ vật được thiêu trọn.
- source_word: זֶבַח
  choice: sinh tế
  rationale: Phân biệt lễ vật có giết sinh vật với lễ thiêu, đồng thời giữ sắc thái tế tự của từ Hê-bơ-rơ.
- source_word: לְפַלֵּא נֶדֶר
  choice: để thực hiện một lời khấn nguyện
  rationale: Diễn đạt việc thi hành điều đã khấn hứa mà không thêm ý nghĩa ngoài văn bản.
- source_word: בִנְדָבָה
  choice: làm lễ vật tự nguyện
  rationale: Thể hiện đây là lễ vật được dâng tự nguyện, không do lời khấn hay nghĩa vụ bắt buộc.
- source_word: בְּמֹעֲדֵיכֶם
  choice: vào những kỳ đã định của anh em
  rationale: Giữ phạm vi nghĩa rộng của מוֹעֵד, có thể chỉ các thời điểm ấn định nói chung hoặc các dịp lễ hội cụ thể.
- source_word: לַעֲשׂוֹת רֵיחַ נִיחֹחַ
  choice: hầu tạo nên hương thơm đẹp lòng
  rationale: Bảo tồn hình ảnh tế tự và diễn đạt tự nhiên rằng hương ấy làm đẹp lòng Yahweh, không biến hình ảnh thành một cơ chế xoa dịu.
- source_word: מִן הַבָּקָר
  choice: lấy từ đàn bò
  rationale: Chỉ đại gia súc thuộc loài bò dùng làm sinh tế.
- source_word: מִן הַצֹּאן
  choice: lấy từ đàn chiên dê
  rationale: Làm rõ danh từ tập hợp צֹאן bao gồm các gia súc nhỏ, chủ yếu là chiên và dê.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: Đức Chúa Trời / CHÚA / Giê-hô-va
  rationale: Văn bản dùng trực tiếp danh giao ước; chuyển tự Yahweh bảo tồn danh riêng thay vì thay bằng một tước hiệu.
- issue: Hình ảnh nhân cách hóa רֵיחַ נִיחֹחַ
  choice: hương thơm đẹp lòng Yahweh
  alternative: hương thơm xoa dịu Yahweh
  rationale: Giữ hình ảnh tế tự và ý nghĩa được chấp nhận, nhưng không áp đặt quan niệm rằng lễ vật tác động lên Đức Chúa Trời theo một cơ chế xoa dịu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Câu được giữ như một mệnh đề tiếp nối câu trước, nên mở đầu bằng “và” và kết thúc bằng dấu phẩy. Các thuật ngữ tế tự được dùng nhất quán; ‘đàn chiên dê’ làm rõ phạm vi của danh từ tập hợp Hê-bơ-rơ.
