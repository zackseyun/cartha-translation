  text: According to the number that you prepare[a], so you shall prepare for each one according to their number.
translation:
  language: vi
  text: Theo số lượng mà các ngươi chuẩn bị, các ngươi phải chuẩn bị như vậy cho từng con, tùy theo số lượng của chúng.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כַּמִּסְפָּר
  choice: Theo số lượng
  rationale: Tiền tố כְּ diễn tả sự tương ứng (‘theo, tương xứng với’), còn מִסְפָּר chỉ số lượng; cách dịch này giữ cấu trúc và ý nghĩa định lượng của nguyên văn.
- source_word: תַּעֲשׂוּ
  choice: các ngươi chuẩn bị / hãy chuẩn bị
  rationale: Động từ עשה có nghĩa rộng là ‘làm, tạo’, nhưng trong ngữ cảnh các lễ vật ở câu trước, ‘chuẩn bị’ diễn đạt rõ hành động được truyền dạy mà không thu hẹp quá mức nghĩa của từ.
- source_word: כָּכָה
  choice: như thế
  rationale: Trạng từ này chỉ cách thức tương ứng với mệnh đề mở đầu, nên ‘như thế’ vừa tự nhiên vừa giữ được quan hệ ‘theo số lượng… như thế’.
- source_word: לָאֶחָד
  choice: cho từng con
  rationale: Nguyên văn theo nghĩa đen là ‘cho một [con]’, nhưng ở đây אֶחָד mang ý phân phối, chỉ từng con vật làm lễ vật đã được nhắc đến trong ngữ cảnh gần.
- source_word: כְמִסְפָּרָם
  choice: tùy theo số lượng của chúng
  rationale: Hậu tố số nhiều ‘của chúng’ quy chiếu đến các con vật/lễ vật được đếm; ‘tùy theo’ truyền đạt sự tương ứng về số lượng một cách tự nhiên trong tiếng Việt.
