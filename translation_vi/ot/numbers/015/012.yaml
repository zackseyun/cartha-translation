    rationale: “Hãy chuẩn bị” là mệnh lệnh hợp lệ, nhưng “các ngươi phải chuẩn bị” liên kết trực tiếp hơn với kết cấu quy định “theo... thì...” và với lực mệnh lệnh của nguyên văn.
  revised_text: Theo số lượng mà các ngươi chuẩn bị, các ngươi phải chuẩn bị như vậy cho từng con, tùy theo số lượng của chúng.
