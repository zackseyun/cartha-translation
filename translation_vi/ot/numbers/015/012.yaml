review_pass:
  verdict: revise
  source_fidelity: 'Bản thảo phản ánh đúng cấu trúc tương ứng của câu Hê-bơ-rơ: “theo số lượng ... thì ... cho từng con, tùy theo số lượng của chúng.” Việc hiểu לָאֶחָד theo nghĩa phân phối là phù hợp với ngữ cảnh các con vật tế lễ. Tuy nhiên, thêm từ quan hệ “mà” và dùng cùng một sắc thái mệnh lệnh ở mệnh đề chính làm rõ hơn quan hệ cú pháp và lực chỉ dẫn của hai động từ תעשו.'
  naturalness: Câu sửa tự nhiên, rõ nghĩa hơn trong tiếng Việt hiện đại. “Theo số lượng mà các ngươi chuẩn bị” tránh lối ghép danh ngữ dễ vấp trong bản thảo, còn “các ngươi phải chuẩn bị như vậy” giữ văn phong quy định trang trọng.
  terminology: “Chuẩn bị” là lựa chọn có thể chấp nhận trong ngữ cảnh lễ vật, với chú thích bảo lưu nghĩa rộng hơn của עשה là “làm/thực hiện.” “Từng con” không xác định quá mức ngoài ngữ cảnh gần, vì các đơn vị được nói đến là các con vật dùng trong lễ vật.
