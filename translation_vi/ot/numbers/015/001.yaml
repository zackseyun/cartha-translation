  text: 'Yahweh[a] phán với Môi-se rằng:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ: “YHWH”; theo truyền thống thường được dịch là “CHÚA”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: phán
  rationale: Dạng kể chuyện với động từ דבר mở đầu một lời truyền phán của Đức Chúa Trời. “Phán” là cách diễn đạt trang trọng, tự nhiên trong tiếng Việt và phân biệt phù hợp lời của Đức Chúa Trời với lời nói thông thường.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Chuyển tự danh riêng YHWH theo dạng quen thuộc và dễ nhận biết trong tiếng Việt; chú thích nêu rõ nguyên ngữ để không biến danh này thành một tước hiệu.
- source_word: אֶל
  choice: với
  rationale: Trong kết cấu tiếng Việt “phán với”, giới từ này chỉ người tiếp nhận lời phán một cách tự nhiên.
- source_word: מֹשֶׁה
  choice: Môi-se
  rationale: Dùng dạng chuyển tự tên riêng đã quen thuộc trong Kinh Thánh tiếng Việt.
- source_word: לֵאמֹר
  choice: rằng
  rationale: Trong công thức dẫn nhập lời nói, “rằng” tự nhiên hơn cách dịch sát hình thức “nói rằng”, đồng thời báo hiệu nội dung lời phán theo sau.
theological_decisions:
- issue: Cách dịch danh Đức Chúa Trời יְהוָה
  choice: Đức Giê-hô-va
  alternative: Yahweh; CHÚA
  rationale: Nguyên văn dùng trực tiếp danh YHWH. “Đức Giê-hô-va” giữ đây là danh riêng, phù hợp cách gọi quen thuộc trong tiếng Việt; chú thích bảo tồn dạng chữ Hê-bơ-rơ và cho biết cách dịch truyền thống bằng tước hiệu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ công thức dẫn nhập lời phán cô đọng; dấu hai chấm cho biết nội dung bắt đầu ở câu kế tiếp.
