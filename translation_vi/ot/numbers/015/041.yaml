source:
  edition: WLC
  text: אֲנִ֞י יְהוָ֣ה אֱלֹֽהֵי/כֶ֗ם אֲשֶׁ֨ר הוֹצֵ֤אתִי אֶתְ/כֶם֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם לִ/הְי֥וֹת לָ/כֶ֖ם לֵ/אלֹהִ֑ים אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/041.yaml
  text: I am Yahweh your God[a], who brought you out of the land of Egypt to be your God. I am Yahweh your God.
translation:
  language: vi
  text: Ta là Yahweh, Đức Chúa Trời của các ngươi, Đấng đã đưa các ngươi ra khỏi đất Ai Cập để là Đức Chúa Trời của các ngươi.[a] Ta là Yahweh, Đức Chúa Trời của các ngươi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát nghĩa tiếng Hê-bơ-rơ: “để là Đức Chúa Trời cho các ngươi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời, thay vì thay thế bằng một tước hiệu; phù hợp trực tiếp với bản Hê-bơ-rơ.
- source_word: אֱלֹהֵיכֶם
  choice: Đức Chúa Trời của các ngươi
  rationale: Dù אֱלֹהִים có hình thức số nhiều, trong ngữ cảnh này từ ấy chỉ Đức Chúa Trời duy nhất của Israel; hậu tố ngôi thứ hai số nhiều được diễn đạt là “của các ngươi”.
- source_word: הוֹצֵאתִי
  choice: đã đưa ... ra
  rationale: Thể Hiphil của יצא mang nghĩa tác động “đưa ra”, phù hợp với công thức nói về cuộc Xuất Hành.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: ra khỏi đất Ai Cập
  rationale: Giữ thành tố אֶרֶץ (“đất/xứ”) và diễn đạt tự nhiên trong tiếng Việt hiện đại.
- source_word: לִהְיוֹת לָכֶם לֵאלֹהִים
  choice: để làm Đức Chúa Trời của các ngươi
  rationale: Diễn đạt tự nhiên mục đích của hành động và giữ nguyên sức nặng quan hệ giao ước; cấu trúc Hê-bơ-rơ sát hơn là “để làm Đức Chúa Trời cho các ngươi” được ghi ở chú thích.
- source_word: אֲנִי
  choice: Ta là
  rationale: Mệnh đề Hê-bơ-rơ không có động từ nối nhưng mang sắc thái nhấn mạnh; “Ta là” vừa tự nhiên vừa trang trọng.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Nguyên văn dùng trực tiếp danh giao ước יהוה; phiên âm “Yahweh” bảo tồn tư cách danh riêng mà không thay bằng tước hiệu.
- issue: Công thức giao ước לִהְיוֹת לָכֶם לֵאלֹהִים
  choice: để làm Đức Chúa Trời của các ngươi
  alternative: để làm Đức Chúa Trời cho các ngươi
  rationale: Bản chính dùng cách nói sở hữu tự nhiên trong tiếng Việt để truyền đạt quan hệ giao ước, còn chú thích bảo tồn cấu trúc sát nguyên văn và sự khác biệt sắc thái.
translation_notes:
  register: Văn phong trang trọng, rõ ràng và hiện đại. Dùng “Ta/các ngươi” để giữ lời phán trực tiếp cùng sắc thái cộng đồng của hậu tố số nhiều; tránh lối diễn đạt quá cổ, đồng thời duy trì nhịp điệu long trọng của công thức giao ước.
