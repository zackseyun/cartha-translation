revisions:
- from: Ta là Yahweh, Đức Chúa Trời của các ngươi, Đấng đã đưa các ngươi ra khỏi đất Ai Cập để làm Đức Chúa Trời của các ngươi.[a] Ta là Yahweh, Đức Chúa Trời của các ngươi.
  to: Ta là Yahweh, Đức Chúa Trời của các ngươi, Đấng đã đưa các ngươi ra khỏi đất Ai Cập để là Đức Chúa Trời của các ngươi.[a] Ta là Yahweh, Đức Chúa Trời của các ngươi.
  rationale: Chỉ sửa cách diễn đạt động từ trong công thức לִהְיוֹת לָכֶם לֵאלֹהִים từ “để làm” thành “để là”. Bản sửa giữ nghĩa sở hữu tự nhiên ở văn bản chính (“của các ngươi”), đồng thời chú thích giữ trật tự quan hệ “cho các ngươi” gần với nguyên ngữ.
