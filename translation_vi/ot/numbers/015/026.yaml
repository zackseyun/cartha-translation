id: NUM.15.26
reference: Numbers 15:26
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/נִסְלַ֗ח לְ/כָל עֲדַת֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/לַ/גֵּ֖ר הַ/גָּ֣ר בְּ/תוֹכָ֑/ם כִּ֥י לְ/כָל הָ/עָ֖ם בִּ/שְׁגָגָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/026.yaml
  text: And all the congregation of the sons of Israel shall be forgiven[a], along with the sojourner who sojourns among them[c][b], because for all the people it was done unintentionally.
translation:
  language: vi
  text: Cả cộng đồng con dân Israel[a] và kiều dân đang cư ngụ giữa họ[b] đều sẽ được tha thứ, vì toàn dân đã vô ý phạm lỗi[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Theo sát nguyên văn: “toàn thể hội chúng của các con trai Israel”; thành ngữ này chỉ toàn dân Israel.'
    reason: lexical_alternative
  - marker: b
    text: “Kiều dân” là người ngoại quốc cư trú giữa dân Israel, sống dưới luật pháp và sự bảo hộ của cộng đồng.
    reason: cultural_note
  - marker: c
    text: 'Cụm cuối trong tiếng Hê-bơ-rơ rất cô đọng; cũng có thể dịch: “vì đối với toàn dân, việc ấy là do vô ý.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וְנִסְלַח
  choice: đều sẽ được tha thứ
  rationale: 'Dạng Nifal mang nghĩa bị động/phiếm chỉ: sự tha thứ được ban cho cộng đồng và kiều dân. “Đều” diễn đạt tự nhiên việc cùng một sự tha thứ áp dụng cho cả hai đối tượng.'
- source_word: לְכָל עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: cả cộng đồng con dân Israel
  rationale: עֵדָה là cộng đồng/hội chúng; “cộng đồng” tự nhiên trong tiếng Việt hiện đại mà vẫn phù hợp văn cảnh luật lệ. “Con dân Israel” chuyển tải thành ngữ בְּנֵי יִשְׂרָאֵל theo nghĩa tập thể, không giới hạn vào nam giới.
- source_word: וְלַגֵּר
  choice: và kiều dân
  rationale: גֵּר chỉ người ngoại quốc cư trú lâu dài trong xã hội Israel, thuộc phạm vi luật pháp và sự bảo hộ của cộng đồng. “Kiều dân” gọn, trang trọng và tránh nghĩa người chỉ ghé qua.
- source_word: הַגָּר בְּתוֹכָם
  choice: đang cư ngụ giữa họ
  rationale: Phân từ הַגָּר mô tả người đang cư trú; “cư ngụ giữa họ” là cách nói tự nhiên và giữ rõ mối liên hệ với danh từ גֵּר.
- source_word: כִּי
  choice: vì
  rationale: כִּי giới thiệu lý do sự tha thứ được ban.
- source_word: לְכָל הָעָם בִּשְׁגָגָה
  choice: toàn dân đã vô ý phạm lỗi
  rationale: Cụm Hê-bơ-rơ rất cô đọng, xác định sự việc là do vô ý và liên quan đến toàn dân. Cách dịch này tự nhiên trong tiếng Việt, còn chú thích bảo lưu khả năng hiểu sát hơn theo cấu trúc phiếm chỉ.
theological_decisions:
- issue: Phạm vi tha thứ mang tính cộng đồng
  choice: Sự tha thứ áp dụng cho toàn thể cộng đồng Israel cùng kiều dân cư ngụ giữa họ khi lỗi phạm là do vô ý.
  alternative: 'Mệnh đề cuối có thể hiểu phiếm chỉ hơn: “vì đối với toàn dân, việc ấy là do vô ý.”'
  rationale: Bản dịch giữ sự bao gồm kiều dân trong quy định chuộc tội của cộng đồng và giữ ranh giới pháp lý-thần học giữa lỗi vô ý với hành vi cố ý, nhưng không bổ sung một hệ thống giáo lý ngoài câu.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “cộng đồng” thay cho từ mang sắc thái chuyên biệt hơn là “hội chúng” trong chính văn; dùng “kiều dân” cho hạng người cư trú ngoại quốc. Câu giữ tính tập thể và sự cô đọng của điều luật, còn khả năng phân tích khác của mệnh đề cuối được nêu trong chú thích.
