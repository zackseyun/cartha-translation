  text: וַ/יַּקְרִ֣יבוּ אֹת֔/וֹ הַ/מֹּצְאִ֥ים אֹת֖/וֹ מְקֹשֵׁ֣שׁ עֵצִ֑ים אֶל מֹשֶׁה֙ וְ/אֶֽל אַהֲרֹ֔ן וְ/אֶ֖ל כָּל הָ/עֵדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/033.yaml
  text: And those who found him gathering wood brought him to Moses and Aaron and to all the congregation[a].
translation:
  language: vi
  text: Những người bắt gặp người ấy đang nhặt củi[a] liền dẫn người ấy đến Môi-se, A-rôn và toàn thể hội chúng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “nhặt các cành cây”. Từ Hê-bơ-rơ עֵצִים có thể chỉ gỗ nói chung hoặc những mẩu gỗ như cành cây.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרִיבוּ אֹתוֹ
  choice: liền dẫn người ấy đến
  rationale: Dạng Hiphil của קרב có nghĩa là đưa hoặc đem đến gần. Trong ngữ cảnh áp giải một người đến trước các lãnh đạo và hội chúng, “dẫn người ấy đến” vừa tự nhiên trong tiếng Việt vừa giữ được hướng chuyển động của אֶל.
- source_word: הַמֹּצְאִים אֹתוֹ
  choice: những người bắt gặp người ấy
  rationale: Phân từ có mạo từ chỉ những người phát hiện người ấy trong lúc đang làm việc đó. “Bắt gặp” diễn đạt tự nhiên sắc thái phát hiện tại chỗ, không hàm ý họ đang tìm kiếm người ấy.
- source_word: מְקֹשֵׁשׁ עֵצִים
  choice: đang nhặt củi
  rationale: Phân từ diễn tả hành động đang diễn ra. עֵצִים có thể chỉ gỗ nói chung hoặc các mẩu/cành gỗ; trong ngữ cảnh thu gom, “củi” là cách diễn đạt tự nhiên và bao quát trong tiếng Việt.
- source_word: אֶל מֹשֶׁה וְאֶל אַהֲרֹן וְאֶל כָּל הָעֵדָה
  choice: đến Môi-se, A-rôn và toàn thể hội chúng
  rationale: אֶל biểu thị hướng đến. Tiếng Việt không cần lặp lại “đến” trước từng thành phần; cấu trúc này vẫn truyền đạt đầy đủ việc đưa người ấy đến cả Môi-se, A-rôn và toàn thể hội chúng.
- source_word: עֵדָה
  choice: hội chúng
  rationale: Trong bối cảnh luật pháp và cộng đồng giao ước của Ngũ Kinh, “hội chúng” là cách gọi trang trọng, quen thuộc cho tập thể dân Y-sơ-ra-ên được quy tụ.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “người ấy” để tránh sắc thái xa cách hoặc miệt thị có thể có ở “hắn”; “liền” thể hiện diễn tiến của mạch kể וַ־ mà không nhấn quá mức.
