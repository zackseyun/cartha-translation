  text: וְ/הָיָ֣ה לָ/כֶם֮ לְ/צִיצִת֒ וּ/רְאִיתֶ֣ם אֹת֗/וֹ וּ/זְכַרְתֶּם֙ אֶת כָּל מִצְוֺ֣ת יְהוָ֔ה וַ/עֲשִׂיתֶ֖ם אֹתָ֑/ם וְ/לֹֽא תָתֻ֜רוּ אַחֲרֵ֤י לְבַבְ/כֶם֙ וְ/אַחֲרֵ֣י עֵֽינֵי/כֶ֔ם אֲשֶׁר אַתֶּ֥ם זֹנִ֖ים אַחֲרֵי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/039.yaml
  text: And it shall be a tassel for you[a], and when you see it, you shall remember all the commandments of Yahweh and do them, and you shall not go about after your own heart and after your own eyes[c][b], after which you are whoring.
translation:
  language: vi
  text: Tua áo ấy sẽ là tua áo cho các ngươi[a]. Khi nhìn thấy nó, các ngươi sẽ nhớ lại mọi điều răn của Yahweh và làm theo, chứ không chạy theo lòng mình và mắt mình[b]—những điều mà các ngươi đang theo đuổi một cách ngoại tình[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “dải tua” hoặc “viền tua”. Từ Hê-bơ-rơ chỉ phần tua dạng chùm sợi gắn vào góc áo.
    reason: lexical_alternative
  - marker: b
    text: 'Động từ Hê-bơ-rơ mang ý tìm kiếm, dò theo hoặc đuổi theo; cũng có thể dịch: “không đi theo lòng mình và mắt mình”.'
    reason: lexical_alternative
  - marker: c
    text: 'Nguyên văn nói theo nghĩa đen: “những điều mà các ngươi đang ngoại tình theo”. Đây là hình ảnh bất trung tính dục, dùng ẩn dụ cho sự bất trung trong giao ước; cũng có thể dịch nhẹ hơn là “những điều khiến các ngươi lầm lạc”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: צִיצִת
  choice: dải tua
  rationale: Chỉ phần tua có dạng chùm sợi gắn ở góc áo trong văn cảnh; “dải tua” tự nhiên và đủ cụ thể trong tiếng Việt hiện đại.
- source_word: וּרְאִיתֶם אֹתוֹ
  choice: Khi nhìn thấy nó
  rationale: 'Diễn đạt tự nhiên quan hệ thời gian và trình tự của mệnh đề Hê-bơ-rơ: việc nhìn dải tua dẫn đến việc nhớ các điều răn.'
- source_word: מִצְוֺת
  choice: điều răn
  rationale: Giữ sắc thái pháp lý và giao ước của từ Hê-bơ-rơ, đồng thời là cách nói quen thuộc, trang trọng trong tiếng Việt.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh giao ước được nêu trực tiếp trong nguyên bản, thay vì thay bằng một tước hiệu.
- source_word: וַעֲשִׂיתֶם אֹתָם
  choice: làm theo
  rationale: Trong tiếng Việt, “làm theo các điều răn” tự nhiên hơn cách dịch máy móc “làm chúng” mà vẫn giữ nghĩa thực hành, tuân giữ.
- source_word: תָתֻרוּ
  choice: chạy theo
  rationale: Truyền đạt ý tìm kiếm, đuổi theo hay để mình bị dẫn dắt bởi lòng và mắt; tự nhiên hơn “đi dò theo” trong văn cảnh đạo đức.
- source_word: לְבַבְכֶם וְאַחֲרֵי עֵינֵיכֶם
  choice: lòng mình và mắt mình
  rationale: Giữ hình ảnh nhân học của nguyên văn. Đại từ phản thân “mình” gợi sự đối lập giữa ham muốn chủ quan và điều răn của Yahweh mà không thêm từ “riêng” quá mức.
- source_word: זֹנִים
  choice: ngoại tình
  rationale: Giữ hình ảnh mạnh về sự bất trung tính dục được dùng ẩn dụ cho bất trung giao ước; tránh làm nhẹ thành chỉ “lầm lạc”.
theological_decisions:
- issue: Cách dịch danh giao ước יְהוָה
  choice: Yahweh
  alternative: ĐỨC CHÚA / Giê-hô-va
  rationale: Nguyên văn dùng danh riêng YHWH; “Yahweh” bảo tồn danh ấy mà không thay bằng tước hiệu.
- issue: Sức nặng của ẩn dụ זנה
  choice: giữ hình ảnh bất trung tính dục bằng “ngoại tình”
  alternative: lầm lạc / bất trung
  rationale: Động từ Hê-bơ-rơ cố ý dùng hình ảnh tính dục mạnh để mô tả sự bất trung giao ước. “Ngoại tình” dễ hiểu và trang trọng hơn các cách diễn đạt thô, đồng thời không xóa ẩn dụ.
- issue: Quan hệ của mệnh đề אֲשֶׁר אַתֶּם זֹנִים אַחֲרֵיהֶם
  choice: gắn với “lòng mình và mắt mình” bằng “những thứ”
  alternative: hiểu khái quát là đi lầm lạc theo các ham muốn
  rationale: Giữ tham chiếu số nhiều của hậu tố Hê-bơ-rơ đến lòng và mắt, đồng thời bảo tồn sự căng thẳng của cách nói “ngoại tình theo sau” trong một câu tiếng Việt có thể hiểu được.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “các ngươi” để giữ lời phán trực tiếp ở số nhiều; giữ danh Yahweh và hình ảnh “lòng”, “mắt”, “ngoại tình” của nguyên văn. Dấu gạch ngang làm rõ mệnh đề quan hệ khó mà không xóa sự gay gắt của ẩn dụ.
