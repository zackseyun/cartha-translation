  yaml_path: translation/ot/numbers/015/005.yaml
  text: And you shall prepare a quarter of a hin of wine for the drink offering, with the burnt offering or for the sacrifice, for each lamb.
translation:
  language: vi
  text: Ngươi phải chuẩn bị một phần tư hin rượu để làm lễ quán,[a] kèm theo lễ thiêu hoặc lễ tế, cho mỗi con chiên.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hin là một đơn vị đo dung tích cổ.
    reason: cultural_background
  - marker: b
    text: 'Theo sát chữ: «cho một con chiên». Trong chỉ dẫn định lượng này, cách dịch «cho mỗi con chiên» diễn tả ý áp dụng cho từng con.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/יַיִן
  choice: Con cũng phải ... rượu
  rationale: וְ nối tiếp chỉ dẫn ở câu trước; trong tiếng Việt, “cũng” diễn đạt tự nhiên tính tiếp nối ấy, còn יַיִן là “rượu”.
- source_word: לַ/נֶּסֶךְ
  choice: làm lễ quán
  rationale: Trong ngữ cảnh tế lễ, נֶסֶךְ chỉ phần rượu được rưới đổ dâng lên. “Lễ quán” là thuật ngữ Kinh Thánh ngắn gọn; ngữ cảnh và chú thích giúp người đọc hiểu.
- source_word: רְבִיעִית הַ/הִין
  choice: một phần tư hin
  rationale: Giữ nguyên đơn vị đo cổ “hin” và diễn đạt chính xác tỷ lệ một phần tư.
- source_word: תַּעֲשֶׂה
  choice: phải chuẩn bị
  rationale: Động từ עָשָׂה có nghĩa cơ bản là làm, nhưng trong chỉ dẫn nghi lễ này, “chuẩn bị” tự nhiên và phù hợp với lượng rượu dành cho lễ quán.
- source_word: עַל הָ/עֹלָה
  choice: cùng với lễ thiêu
  rationale: עַל có nghĩa đen là “trên”, nhưng ở đây nhiều khả năng biểu thị sự đi kèm trong nghi thức. “Cùng với” truyền đạt quan hệ này rõ ràng mà không khẳng định cách thức rưới.
- source_word: אוֹ לַ/זָּבַח
  choice: hoặc lễ tế
  rationale: זֶבַח là lễ vật được giết tế, phân biệt với עֹלָה. “Lễ tế” giữ được nghĩa khái quát và sự phân biệt ấy.
- source_word: לַ/כֶּבֶשׂ הָ/אֶחָד
  choice: cho mỗi con chiên
  rationale: Nghĩa sát là “cho con chiên ấy/một con chiên”; trong chỉ dẫn định lượng, cụm này có lực phân phối, nên “cho mỗi con chiên” diễn đạt rõ lượng áp dụng cho từng con.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ đơn vị cổ “hin”; dùng “lễ thiêu”, “lễ tế” và “lễ quán” để phân biệt các thuật ngữ nghi lễ. Các dấu chú thích đều được đặt trong chính văn.
