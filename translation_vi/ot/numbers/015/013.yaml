  terminology: “Lễ vật hỏa tế” là một cách dịch chuẩn xác, không áp đặt cách giải thích “lễ vật thực phẩm.” “Đức Giê-hô-va” nhất quán với lựa chọn danh riêng được nêu trong bản thảo. Chú thích [a] nêu đúng phương án từ vựng và được neo chính xác.
