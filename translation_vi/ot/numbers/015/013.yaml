id: NUM.15.13
reference: Numbers 15:13
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: כָּל הָ/אֶזְרָ֥ח יַעֲשֶׂה כָּ֖כָה אֶת אֵ֑לֶּה לְ/הַקְרִ֛יב אִשֵּׁ֥ה רֵֽיחַ נִיחֹ֖חַ לַֽ/יהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/013.yaml
  text: Every native-born person shall do these things in this way[a], to present a food offering[b], a pleasing aroma to Yahweh.
translation:
  language: vi
  text: Mọi người bản xứ đều phải làm những điều ấy theo cách này để dâng một lễ vật hỏa tế[a], là hương thơm đẹp lòng Đức Giê-hô-va.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “một lễ vật dâng bằng lửa.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הָאֶזְרָח
  choice: Mọi người bản xứ
  rationale: כָּל mang nghĩa phân phối với danh từ số ít; הָאֶזְרָח chỉ thành viên bản địa của cộng đồng, đối lập với ngoại kiều trong ngữ cảnh. Cách dịch này truyền đạt lực đại diện chung của dạng giống đực số ít mà không giới hạn vào nam giới.
- source_word: יַעֲשֶׂה
  choice: đều phải làm
  rationale: Dạng vị hoàn ở đây có lực quy định trong văn luật pháp; “phải” tự nhiên trong tiếng Việt hiện đại.
- source_word: כָּכָה אֶת אֵלֶּה
  choice: những điều ấy theo cách này
  rationale: Giữ cả ý chỉ cách thức của כָּכָה và đối tượng hồi chỉ אֵלֶּה, hướng về các quy định tế lễ vừa nêu.
- source_word: לְהַקְרִיב
  choice: để dâng
  rationale: Trong ngữ cảnh tế lễ, động từ có nghĩa đem đến hoặc trình dâng một lễ vật; “dâng” là cách nói tự nhiên và trang trọng.
- source_word: אִשֵּׁה
  choice: một lễ vật hỏa tế
  rationale: Thuật ngữ tế lễ này chỉ lễ vật được dâng bằng lửa. “Hỏa tế” chính xác hơn “lễ vật thực phẩm” trong câu này, đồng thời chú thích bảo lưu cách diễn đạt đầy đủ hơn.
- source_word: רֵיחַ נִיחֹחַ
  choice: hương thơm đẹp lòng
  rationale: Thành ngữ tế lễ diễn tả lễ vật được Đức Chúa Trời vui nhận; cách dịch giữ hình ảnh mùi hương nhưng không giải thích quá mức.
- source_word: לַיהוָה
  choice: Đức Giê-hô-va
  rationale: Chuyển danh riêng giao ước יהוה bằng dạng quen thuộc, trang trọng trong tiếng Việt, thay vì thay thế bằng một tước hiệu.
theological_decisions:
- issue: Lực đại diện của dạng giống đực số ít הָאֶזְרָח
  choice: người bản xứ
  alternative: người nam bản xứ
  rationale: Hình thái Hê-bơ-rơ là giống đực số ít, nhưng trong luật này có lực đại diện chung; ngữ cảnh kế tiếp đối chiếu toàn thể cộng đồng bản địa với ngoại kiều, không chỉ riêng nam giới.
- issue: Cách hiểu אִשֵּׁה
  choice: lễ vật hỏa tế
  alternative: lễ vật thực phẩm
  rationale: Từ nguyên và cách dùng tế lễ gắn thuật ngữ với lửa; bản văn không buộc phải diễn giải đây là “thực phẩm”, nên bản dịch chính giữ cách hiểu ít suy diễn hơn và chú thích nêu cách dịch tương đương.
- issue: Danh יהוה
  choice: Đức Giê-hô-va
  alternative: Yahweh
  rationale: Giữ đây là danh riêng của Đức Chúa Trời chứ không thay bằng “CHÚA”; “Đức Giê-hô-va” là dạng Việt hóa quen thuộc, còn “Yahweh” là phương án phiên âm khác.
translation_notes:
  register: Văn phong luật pháp trang trọng nhưng hiện đại. “Đều phải” làm rõ lực phân phối của כָּל cùng tính quy định của động từ; trật tự câu được điều chỉnh để tự nhiên trong tiếng Việt. Mọi dấu chú thích trong phần chú thích đều xuất hiện trong chính văn.
