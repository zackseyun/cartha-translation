  source_fidelity: 'Bản dịch truyền đạt đúng các thành tố chính của tiếng Hê-bơ-rơ: tính bao quát của כָּל הָאֶזְרָח, lực quy định của động từ vị hoàn, hồi chỉ của “những điều ấy,” mục đích “để dâng,” thuật ngữ tế lễ אִשֶּׁה, thành ngữ רֵיחַ נִיחֹחַ, và đích hướng về יהוה. “Mọi người bản xứ” diễn đạt phù hợp lực đại diện chung của danh từ giống đực số ít trong văn luật.'
