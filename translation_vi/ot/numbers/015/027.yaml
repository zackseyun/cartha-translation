source:
  edition: WLC
  text: וְ/אִם נֶ֥פֶשׁ אַחַ֖ת תֶּחֱטָ֣א בִ/שְׁגָגָ֑ה וְ/הִקְרִ֛יבָה עֵ֥ז בַּת שְׁנָתָ֖/הּ לְ/חַטָּֽאת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/027.yaml
  text: But if one person sins unintentionally[a], then she shall present a one-year-old female goat as a sin offering.
translation:
  language: vi
  text: Nhưng nếu một người vô ý phạm tội, thì người ấy phải dâng một con dê cái một tuổi làm lễ vật chuộc tội.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “lễ vật thanh tẩy”. Từ Hê-bơ-rơ חַטָּאת có thể chỉ lễ vật dùng để xử lý tội lỗi hoặc sự ô uế, chứ không chỉ bản thân tội lỗi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Nhưng nếu
  rationale: Trong mạch luật lệ, liên từ này mở đầu một trường hợp tương phản nhẹ với quy định ngay trước đó; “Nhưng nếu” diễn đạt tự nhiên cả ý tiếp nối lẫn đối chiếu.
- source_word: נֶפֶשׁ אַחַת
  choice: một người
  rationale: Trong văn cảnh pháp luật, נֶפֶשׁ chỉ một cá nhân, chứ không nhấn mạnh “linh hồn”; “một người” vừa tự nhiên vừa giữ số ít.
- source_word: תֶּחֱטָא בִשְׁגָגָה
  choice: vô ý phạm tội
  rationale: בִשְׁגָגָה chỉ hành vi do sơ suất hoặc không chủ ý, đối lập với sự cố tình; cách diễn đạt này rõ ràng trong tiếng Việt hiện đại.
- source_word: וְהִקְרִיבָה
  choice: thì người ấy phải dâng
  rationale: Dạng Hiphil của קרב trong văn cảnh tế lễ có nghĩa là đem đến hoặc dâng lễ vật. “Thì” làm rõ hệ quả của điều kiện, còn “phải” thể hiện tính quy định của luật.
- source_word: עֵז
  choice: một con dê cái
  rationale: Danh từ Hê-bơ-rơ ở đây chỉ rõ dê cái, nên bản dịch giữ lại giới tính của con vật.
- source_word: בַּת שְׁנָתָהּ
  choice: một tuổi
  rationale: Thành ngữ này nói con vật đang trong năm đầu đời; “một tuổi” là cách diễn đạt ngắn gọn, thông dụng trong tiếng Việt.
- source_word: לְחַטָּאת
  choice: làm lễ vật chuộc tội
  rationale: Trong luật tế lễ, חַטָּאת thường chỉ lễ vật dùng để xử lý tội lỗi hoặc tình trạng ô uế. “Lễ vật chuộc tội” dễ hiểu và quen thuộc, còn sắc thái “thanh tẩy” được bảo lưu trong chú thích.
theological_decisions:
- issue: Giới tính của người phạm tội ở số ít
  choice: Dùng “một người” và “người ấy”, không xác định nam hay nữ.
  alternative: Dùng đại từ chỉ nữ để phản ánh các dạng giống cái trong tiếng Hê-bơ-rơ.
  rationale: Các dạng giống cái תֶּחֱטָא và וְהִקְרִיבָה hòa hợp ngữ pháp với נֶפֶשׁ, một danh từ giống cái, nhưng không nhất thiết cho biết người phạm tội là nữ. Tiếng Việt không buộc đánh dấu giống ngữ pháp; “người ấy” giữ số ít và không thu hẹp phạm vi áp dụng của luật.
- issue: Ý nghĩa của חַטָּאת trong luật tế lễ
  choice: Dịch trong chính văn là “lễ vật chuộc tội”.
  alternative: “Lễ vật thanh tẩy”.
  rationale: Thuật ngữ có thể nhấn mạnh việc xử lý tội lỗi và/hoặc thanh tẩy sự ô uế. Chính văn dùng cách gọi dễ nhận biết, còn chú thích giữ cách hiểu nghiêng về chức năng thanh tẩy để không xóa bỏ sắc thái học thuật chính đáng.
translation_notes:
  register: Văn phong pháp luật–tế lễ trang trọng nhưng hiện đại. Câu điều kiện được diễn đạt rõ ràng, từ ngữ phổ thông, không dùng đại từ mang giới tính khi giống cái trong nguyên ngữ chỉ là sự hòa hợp ngữ pháp.
