  to: 'Thầy tế lễ sẽ làm lễ chuộc tội cho toàn thể hội chúng người Israel, và họ sẽ được tha thứ, vì đó là lỗi vô ý[c] và họ đã đem lễ vật của mình: một lễ tế bằng lửa dâng lên Yahweh[a], cùng tế lễ chuộc tội của họ trước mặt Yahweh[b], vì lỗi vô ý của họ.'
  rationale: Sửa cách diễn đạt אִשֶּׁה thành “một lễ tế bằng lửa” để tránh mơ hồ trong tiếng Việt, đồng thời giữ tính chất tế tự của thuật ngữ. Cải thiện mạch câu bằng dấu hai chấm cho phần xác định lễ vật được đem đến. Dùng “hội chúng người Israel” và “lỗi vô ý của họ” để phản ánh tự nhiên hơn các cụm tập thể và sở hữu cách trong nguyên văn, không thêm diễn giải thần học.
