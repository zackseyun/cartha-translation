source:
  edition: WLC
  text: וְ/כִפֶּ֣ר הַ/כֹּהֵ֗ן עַֽל כָּל עֲדַ֛ת בְּנֵ֥י יִשְׂרָאֵ֖ל וְ/נִסְלַ֣ח לָ/הֶ֑ם כִּֽי שְׁגָגָ֣ה הִ֔וא וְ/הֵם֩ הֵבִ֨יאוּ אֶת קָרְבָּנָ֜/ם אִשֶּׁ֣ה לַֽ/יהוָ֗ה וְ/חַטָּאתָ֛/ם לִ/פְנֵ֥י יְהוָ֖ה עַל שִׁגְגָתָֽ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/025.yaml
  text: And the priest shall make atonement for all the congregation of the sons of Israel[a], and they shall be forgiven, because it was an unintentional error, and they have brought their offering, an offering made by fire to Yahweh, and their sin offering before Yahweh[c][b], for their unintentional error.
translation:
  language: vi
  text: 'Thầy tế lễ sẽ làm lễ chuộc tội cho toàn thể hội chúng người Israel, và họ sẽ được tha thứ, vì đó là lỗi vô ý[c] và họ đã đem lễ vật của mình: một lễ tế bằng lửa dâng lên Yahweh[a], cùng tế lễ chuộc tội của họ trước mặt Yahweh[b], vì lỗi vô ý của họ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “một hỏa lễ dâng lên Yahweh.”'
    reason: lexical_alternative
  - marker: b
    text: 'Hay: “tế lễ thanh tẩy của họ.”'
    reason: lexical_alternative
  - marker: c
    text: 'Hay: “việc phạm lỗi do sơ suất.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִפֶּר
  choice: sẽ làm lễ chuộc tội
  rationale: Động từ כפר ở thể Piel trong ngữ cảnh tế lễ chỉ hành động thực hiện sự chuộc tội; cách diễn đạt này tự nhiên trong tiếng Việt và giữ được sắc thái nghi lễ.
- source_word: עַל כָּל עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: cho toàn thể hội chúng con dân Israel
  rationale: עַל sau כפר có nghĩa là “cho, thay cho”; עֲדָה là hội chúng/cộng đồng. “Con dân Israel” diễn đạt tự nhiên thành ngữ “các con trai của Israel” trong ngữ cảnh toàn dân.
- source_word: וְנִסְלַח לָהֶם
  choice: và họ sẽ được tha thứ
  rationale: Giữ thể bị động của động từ סלח và không thêm chủ thể tha thứ vốn không được nêu rõ trong câu Hebrew.
- source_word: שְׁגָגָה / שִׁגְגָתָם
  choice: lỗi vô ý / lỗi vô ý ấy
  rationale: Từ này chỉ hành vi sai phạm do vô tình hoặc sơ suất; “lỗi vô ý” giữ cả khía cạnh sai phạm lẫn tính không cố ý.
- source_word: אֶת קָרְבָּנָם
  choice: lễ vật của mình
  rationale: קָרְבָּן là thuật ngữ khái quát về lễ vật được đem đến dâng; “lễ vật” rõ ràng và quen thuộc.
- source_word: אִשֶּׁה לַיהוָה
  choice: một lễ vật dùng lửa dâng lên Yahweh
  rationale: אִשֶּׁה chỉ một lễ vật gắn với việc dâng bằng lửa. Bản dịch tránh thu hẹp từ này thành một loại tế lễ cụ thể hơn văn bản.
- source_word: וְחַטָּאתָם
  choice: cùng tế lễ chuộc tội của họ
  rationale: Trong cú pháp này חַטָּאת là vật được đem đến trước mặt Yahweh, nên nghĩa tế lễ là bắt buộc; “tế lễ chuộc tội” là cách gọi tiếng Việt quen thuộc.
- source_word: לִפְנֵי יְהוָה
  choice: trước mặt Yahweh
  rationale: Diễn đạt trực tiếp thành ngữ chỉ việc trình dâng trong sự hiện diện của Đức Chúa Trời.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng giao ước trong nguyên văn, thay vì thay thế bằng một tước hiệu.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: CHÚA; Đức Giê-hô-va
  rationale: Nguyên văn dùng trực tiếp danh riêng יהוה; “Yahweh” bảo tồn chức năng danh riêng mà không thay bằng tước hiệu.
- issue: Nghĩa của חַטָּאת trong ngữ cảnh tế lễ
  choice: tế lễ chuộc tội
  alternative: tế lễ thanh tẩy
  rationale: Vì đây là thứ hội chúng đem đến trước mặt Yahweh, từ này chỉ một lễ tế chứ không đơn thuần là tội lỗi; chú thích giữ lại cách hiểu nhấn mạnh chức năng thanh tẩy.
- issue: Quan hệ của hai mệnh đề sau כִּי
  choice: 'hai lý do liên kết: lỗi là vô ý và họ đã đem lễ vật'
  alternative: chỉ tính vô ý là lý do, còn việc đem lễ vật là mệnh đề kể tiếp
  rationale: Cấu trúc כִּי... וְהֵם הֵבִיאוּ cho phép đọc hai yếu tố liên kết chặt chẽ. Bản chính dùng “và” mà không áp đặt quan hệ nhân quả chi tiết hơn.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại. Dùng “thầy tế lễ”, “hội chúng” và “tế lễ chuộc tội” để giữ ngữ vực luật tế lễ; câu được sắp xếp gần cấu trúc Hebrew nhưng có dấu hai chấm để danh sách lễ vật rõ ràng trong tiếng Việt.
