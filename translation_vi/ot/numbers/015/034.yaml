source:
  edition: WLC
  text: וַ/יַּנִּ֥יחוּ אֹת֖/וֹ בַּ/מִּשְׁמָ֑ר כִּ֚י לֹ֣א פֹרַ֔שׁ מַה יֵּעָשֶׂ֖ה לֽ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/034.yaml
  text: So they put him in custody[a], because it had not been made clear what should be done to him.
translation:
  language: vi
  text: Họ giam giữ người ấy, vì chưa được nói rõ[a] phải xử trí người ấy thế nào.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “vì chưa được quy định phải làm gì với người ấy.”'
    reason: Phản ánh khả năng hiểu לֹא פֹרַשׁ theo nghĩa một hành động pháp lý cụ thể chưa được quy định hoặc xác định.
lexical_decisions:
- source_word: וַיַּנִּיחוּ
  choice: Họ giam giữ
  rationale: Dạng Hiphil của נוח có nghĩa là đặt hoặc để lại. Kết hợp với בַּמִּשְׁמָר, cách dịch “giam giữ” diễn đạt tự nhiên việc đặt người ấy dưới sự canh giữ, mà không nhất thiết hàm ý một bản án tù.
- source_word: אֹתוֹ
  choice: người ấy
  rationale: Đại từ tân ngữ giống đực số ít chỉ người đàn ông bị bắt gặp đang nhặt củi trong văn cảnh trước; “người ấy” rõ ràng và trang trọng vừa phải trong tiếng Việt.
- source_word: בַּמִּשְׁמָר
  choice: giam giữ
  rationale: מִשְׁמָר có thể chỉ sự canh giữ, tình trạng bị giữ hoặc nơi giam. Dịch trong cụm động từ là “giam giữ” truyền đạt tình trạng bị quản thúc mà không xác định đây là nhà tù hay hình phạt chính thức.
- source_word: כִּי
  choice: vì
  rationale: Liên từ nêu lý do họ giữ người ấy; “vì” tự nhiên trong tiếng Việt hiện đại.
- source_word: לֹא פֹרַשׁ
  choice: chưa được nói rõ
  rationale: Dạng bị động của פרש cho biết vấn đề chưa được trình bày hoặc xác định rõ. “Chưa được nói rõ” giữ dạng bị động và không thu hẹp ý nghĩa thành chỉ riêng hình phạt.
- source_word: מַה יֵּעָשֶׂה לוֹ
  choice: phải xử trí người ấy thế nào
  rationale: Mệnh đề nói đến hành động cần được thực hiện đối với người ấy trong bối cảnh pháp lý. “Xử trí… thế nào” tự nhiên hơn lối dịch sát chữ “phải làm gì cho/với người ấy” và vẫn giữ tính chưa xác định của quyết định.
theological_decisions:
- issue: Bản chất của điều chưa rõ trong tiến trình xét xử
  choice: Bản dịch nói rằng cách xử trí người ấy chưa được nói rõ, không thêm rằng toàn bộ luật pháp chưa được biết.
  alternative: Có thể hiểu hẹp hơn rằng hình phạt cụ thể dành cho người ấy chưa được quy định.
  rationale: Cấu trúc bị động לֹא פֹרַשׁ nhấn mạnh sự thiếu một chỉ dẫn rõ ràng. Bản dịch giữ nguyên sự không xác định đó, không tự ý giới hạn vào loại hình phạt hay đưa thêm kết luận thần học.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, rõ ràng và trang nghiêm. “Giam giữ” phù hợp văn cảnh pháp lý nhưng không gọi nơi giữ là nhà tù; “xử trí” diễn đạt quyết định cần đưa ra mà không thêm nội dung về hình phạt.
