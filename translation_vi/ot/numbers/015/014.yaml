source:
  edition: WLC
  text: וְ/כִֽי יָגוּר֩ אִתְּ/כֶ֨ם גֵּ֜ר א֤וֹ אֲשֶֽׁר בְּ/תֽוֹכְ/כֶם֙ לְ/דֹרֹ֣תֵי/כֶ֔ם וְ/עָשָׂ֛ה אִשֵּׁ֥ה רֵֽיחַ נִיחֹ֖חַ לַ/יהוָ֑ה כַּ/אֲשֶׁ֥ר תַּעֲשׂ֖וּ כֵּ֥ן יַעֲשֶֽׂה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/014.yaml
  text: And if a sojourner is staying with you[a], or anyone who is among you throughout your generations, and he offers a food offering, a pleasing aroma to Yahweh, just as you do, so he shall do.
translation:
  language: vi
  text: Nếu một ngoại kiều đang cư ngụ với anh em, hoặc bất cứ ai ở giữa anh em qua các thế hệ, dâng cho Đức Giê-hô-va một lễ vật dâng bằng lửa[a], có hương thơm đẹp lòng Ngài, thì người ấy phải làm y như anh em làm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “lễ vật hỏa tế.”'
    reason: Từ אִשֶּׁה chỉ lễ vật được dâng qua lửa; cách cấu tạo và sắc thái chính xác của từ này vẫn có thể được diễn đạt theo hơn một cách.
lexical_decisions:
- source_word: וְכִי
  choice: Nếu
  rationale: Mở đầu một trường hợp có điều kiện nối tiếp luật lệ trước đó; trong tiếng Việt, “Nếu” tự nhiên và vẫn truyền đạt quan hệ điều kiện.
- source_word: יָגוּר ... גֵּר
  choice: một ngoại kiều cư ngụ
  rationale: Kết hợp động từ גור với danh từ גֵּר, diễn tả một người không phải dân bản địa nhưng đang cư trú trong cộng đồng; “ngoại kiều” giữ được sắc thái pháp lý-xã hội rõ hơn “người lạ”.
- source_word: אִתְּכֶם
  choice: với anh em
  rationale: Phản ánh giới từ “với” và phân biệt với cụm kế tiếp בְּתוֹכְכֶם, “giữa anh em”.
- source_word: אוֹ אֲשֶׁר בְּתוֹכְכֶם
  choice: hoặc bất cứ ai sống giữa anh em
  rationale: Giữ phạm vi rộng và cấu trúc lựa chọn của câu Hê-bơ-rơ mà không xác định quá mức địa vị của người được nói đến.
- source_word: לְדֹרֹתֵיכֶם
  choice: qua các thế hệ
  rationale: Diễn đạt tính áp dụng liên tục đối với những thế hệ kế tiếp.
- source_word: וְעָשָׂה
  choice: dâng
  rationale: Trong ngữ cảnh tế lễ, עשה mang nghĩa thực hiện hay dâng lễ vật; “dâng” là cách nói tự nhiên trong tiếng Việt.
- source_word: אִשֵּׁה
  choice: lễ vật dâng bằng lửa
  rationale: Diễn đạt sát loại lễ vật được dâng qua lửa, đồng thời tránh đồng nhất từ này với riêng “lễ thiêu” (עֹלָה).
- source_word: רֵיחַ נִיחֹחַ
  choice: có hương thơm đẹp lòng Ngài
  rationale: Giữ hình ảnh tế lễ về mùi hương được Đức Chúa Trời vui nhận, bằng cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: לַיהוָה
  choice: lên Đức Giê-hô-va
  rationale: Giữ danh riêng giao ước יהוה và hướng của hành động dâng lễ; đại từ “Ngài” ở vế sau tránh lặp nặng nề.
- source_word: כַּאֲשֶׁר תַּעֲשׂוּ כֵּן יַעֲשֶׂה
  choice: người ấy phải làm y như anh em làm
  rationale: Giữ công thức so sánh quy định cùng một cách thực hành; “phải” thể hiện lực pháp lệnh của văn cảnh.
theological_decisions:
- issue: Địa vị của người không phải người Y-sơ-ra-ên khi tham gia việc dâng tế lễ
  choice: Câu dịch áp dụng cùng một cách thức dâng lễ cho ngoại kiều hoặc người sống giữa cộng đồng trong trường hợp được nêu.
  alternative: Có thể hiểu phạm vi hẹp hơn, chỉ nói đến ngoại kiều đã hội nhập vào đời sống giao ước của Y-sơ-ra-ên.
  rationale: Công thức “người ấy phải làm y như anh em làm” nhấn mạnh sự đồng nhất về thủ tục tế lễ ở đây, nhưng câu dịch không suy diễn thêm về toàn bộ địa vị giao ước của người ấy.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Dùng “anh em” cho ngôi thứ hai số nhiều trong lời luật truyền cho cộng đồng; dùng “người ấy” để tránh đại từ mang giới tính không cần thiết. Cấu trúc của cụm “hoặc bất cứ ai sống giữa anh em qua các thế hệ” được giữ tương đối sát vì quan hệ cú pháp trong nguyên văn có độ mở nhất định.
