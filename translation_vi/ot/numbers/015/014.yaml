revisions:
- from: Nếu có một ngoại kiều cư ngụ với anh em, hoặc bất cứ ai sống giữa anh em qua các thế hệ, và người ấy dâng lên Đức Giê-hô-va một lễ vật dâng bằng lửa[a], có hương thơm đẹp lòng Ngài, thì người ấy phải làm y như anh em làm.
  to: Nếu một ngoại kiều đang cư ngụ với anh em, hoặc bất cứ ai ở giữa anh em qua các thế hệ, dâng cho Đức Giê-hô-va một lễ vật dâng bằng lửa[a], có hương thơm đẹp lòng Ngài, thì người ấy phải làm y như anh em làm.
  rationale: 'Bản sửa chỉ điều chỉnh những chỗ cần thiết về độ sát nghĩa và sự tự nhiên của tiếng Việt: thay “sống giữa” bằng “ở giữa,” dùng “dâng cho,” và làm rõ tính đang diễn ra của việc cư ngụ. Không thay đổi nghĩa pháp lý hay hàm ý thần học của câu; mơ hồ về đối tượng trong cụm lựa chọn được duy trì.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T09:26:31Z'
review_pass:
  verdict: revise
  source_fidelity: Bản dịch nhìn chung phản ánh đúng câu điều kiện, phân biệt được “cư ngụ với anh em” và “ở giữa anh em,” diễn tả được tính liên tục “qua các thế hệ,” và giữ lực quy định của công thức kết bằng “phải.” Tuy nhiên, “sống giữa anh em” hẹp hơn và kém sát với בְּתוֹכְכֶם (“ở giữa/ở trong cộng đồng anh em”); “ở giữa” phù hợp hơn với cách dùng luật pháp trong ngữ cảnh này. “Dâng cho” cũng diễn đạt tự nhiên và trực tiếp hướng của לַיהוָה hơn “dâng lên.”
  naturalness: 'Cần chỉnh nhẹ để câu tiếng Việt trôi chảy hơn: “Nếu một ngoại kiều đang cư ngụ...” tự nhiên hơn “Nếu có một ngoại kiều cư ngụ...”; “ở giữa anh em” là cách nói hiện đại, trung tính và không thêm ý về lối sống.'
  terminology: “Ngoại kiều” bảo toàn sắc thái pháp lý-xã hội của גֵּר; “lễ vật dâng bằng lửa” truyền đạt được אִשֶּׁה mà không đồng nhất với một loại tế lễ riêng. Danh xưng “Đức Giê-hô-va” được giữ nhất quán với bản dự thảo. Chú thích cho [a] vẫn cần thiết vì thuật ngữ tế lễ này có các cách dịch hợp lý khác.
  issues:
  - severity: low
    issue: “sống giữa anh em”
    rationale: Động từ “sống” có thể gợi một ý cụ thể hơn nguyên ngữ. Cụm בְּתוֹכְכֶם chỉ vị trí/thành phần “ở giữa anh em,” nên cách dịch này vừa sát vừa tự nhiên hơn.
  - severity: low
    issue: “dâng lên Đức Giê-hô-va”
    rationale: Không sai, nhưng “dâng cho Đức Giê-hô-va” là cách kết hợp tự nhiên hơn trong tiếng Việt cho hành động dâng lễ, vẫn bảo toàn hướng của לַיהוָה.
  revised_text: Nếu một ngoại kiều đang cư ngụ với anh em, hoặc bất cứ ai ở giữa anh em qua các thế hệ, dâng cho Đức Giê-hô-va một lễ vật dâng bằng lửa[a], có hương thơm đẹp lòng Ngài, thì người ấy phải làm y như anh em làm.
