revisions:
- from: Còn rượu cho lễ quán[a], con phải dâng một phần ba hin[b], làm hương thơm đẹp lòng Yahweh[c].
  to: Và ngươi phải dâng một phần ba hin rượu làm lễ quán[a], làm một hương thơm đẹp lòng Yahweh[b].
  rationale: Sửa đại từ ngôi hai để tránh thêm sắc thái không có trong nguyên văn, thay liên từ mở đầu bằng cách nối tiếp trung tính, và sắp xếp lại câu để «một phần ba hin» bổ nghĩa rõ cho rượu làm lễ quán. Các chú thích được viết lại cho chính xác hơn về phạm vi từ vựng và ý nghĩa của công thức tế lễ.
