  text: וְ/יַ֥יִן לַ/נֶּ֖סֶךְ שְׁלִשִׁ֣ית הַ/הִ֑ין תַּקְרִ֥יב רֵֽיחַ נִיחֹ֖חַ לַ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/007.yaml
  text: and wine for the drink offering[a], a third of a hin, you shall present[c][b], a pleasing aroma to Yahweh.
translation:
  language: vi
  text: Và ngươi phải dâng một phần ba hin rượu làm lễ quán[a], làm một hương thơm đẹp lòng Yahweh[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Lễ quán” là lễ dâng bằng chất lỏng được rót ra cùng sinh tế; cũng có thể dịch là “lễ rót”.
    reason: lexical_alternative
  - marker: b
    text: Cụm Hê-bơ-rơ cũng có thể dịch là “hương thơm êm dịu” hoặc “hương thơm dễ chịu”; đây là công thức tế lễ diễn tả lễ vật được chấp nhận.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיַיִן
  choice: Còn rượu
  rationale: יַיִן là “rượu”; liên từ וְ nối tiếp các chỉ dẫn dâng lễ ở câu trước. “Còn” diễn đạt tự nhiên sự chuyển sang phần rượu đi kèm.
- source_word: לַנֶּסֶךְ
  choice: cho lễ quán
  rationale: נֶסֶךְ chỉ lễ vật bằng chất lỏng được rót ra cùng sinh tế. “Lễ quán” là thuật ngữ tiếng Việt gọn và chính xác; chú thích giải nghĩa cho độc giả hiện đại.
- source_word: שְׁלִשִׁית הַהִין
  choice: một phần ba hin
  rationale: Giữ nguyên đơn vị đo chất lỏng cổ “hin” thay vì đổi sang một dung lượng hiện đại không chắc chắn.
- source_word: תַּקְרִיב
  choice: con phải dâng
  rationale: Dạng Hiphil của קרב trong ngữ cảnh tế lễ có nghĩa là đem đến/dâng. “Phải dâng” thể hiện lực chỉ thị của thể chưa hoàn thành trong lời luật và tự nhiên trong tiếng Việt.
- source_word: רֵיחַ נִיחֹחַ
  choice: làm hương thơm đẹp lòng
  rationale: Cụm tế lễ cố định diễn tả hương thơm đem lại sự hài lòng hoặc chấp nhận. Cách dịch này giữ hình ảnh về mùi hương mà không biến nó thành một nhận định thần học chi tiết hơn nguyên văn.
- source_word: לַיהוָה
  choice: Yahweh
  rationale: Giữ danh riêng giao ước יהוה dưới dạng “Yahweh”; quan hệ hướng đến/đối với Yahweh được diễn đạt tự nhiên trong cụm “đẹp lòng Yahweh”.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: CHÚA; Đức Giê-hô-va
  rationale: Nguyên văn dùng trực tiếp danh riêng יהוה. “Yahweh” bảo tồn tư cách danh riêng mà không thay bằng một tước hiệu hay áp đặt cách phát âm truyền thống khác.
- issue: Ý nghĩa của רֵיחַ נִיחֹחַ trong ngôn ngữ tế lễ
  choice: hương thơm đẹp lòng Yahweh
  alternative: hương thơm êm dịu dâng lên Yahweh; hương thơm làm nguôi lòng Yahweh
  rationale: “Đẹp lòng” bảo tồn ý niệm lễ vật được tiếp nhận và tránh quyết định rằng ניחוח nhất thiết có nghĩa làm nguôi cơn giận, điều mà riêng câu này không nói rõ.
- issue: Chủ thể ngôi thứ hai số ít của תַּקְרִיב
  choice: con phải dâng
  alternative: ngươi phải dâng; anh em phải dâng
  rationale: Động từ là ngôi thứ hai giống đực số ít. “Con” phù hợp giọng Đức Chúa Trời truyền luật cho dân qua một đại diện tập thể và dễ hiểu trong tiếng Việt, dù số ít có thể mang nghĩa tập thể.
translation_notes:
  register: Văn phong luật lệ trang trọng nhưng hiện đại. Dùng “con” cho ngôi thứ hai số ít trong lời truyền dạy, giữ “hin” là đơn vị cổ và giải thích “lễ quán” bằng chú thích. Trật tự được điều chỉnh nhẹ để câu tiếng Việt tự nhiên, đồng thời giữ quan hệ giữa rượu, lượng đo, hành động dâng và hương thơm đẹp lòng Yahweh.
