  text: רֵאשִׁית֙ עֲרִסֹ֣תֵ/כֶ֔ם חַלָּ֖ה תָּרִ֣ימוּ תְרוּמָ֑ה כִּ/תְרוּמַ֣ת גֹּ֔רֶן כֵּ֖ן תָּרִ֥ימוּ אֹתָֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/020.yaml
  text: From the first of your dough you shall lift up a loaf as a contribution[a]; like the contribution of the threshing floor[b], so you shall lift it up.
translation:
  language: vi
  text: Từ phần đầu của bột nhào của anh em, anh em phải lấy một cái bánh làm lễ vật[a]. Như dâng lễ vật từ sân đập lúa, anh em cũng phải dâng như vậy[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “phần đầu của bột nhào”. Từ Hê-bơ-rơ có thể chỉ chính bột nhào hoặc, theo phép hoán dụ, máng hay chậu dùng để nhào bột.'
    reason: lexical_alternative
  - marker: b
    text: 'Theo cách dịch truyền thống: “lễ vật nâng lên”. Từ Hê-bơ-rơ chỉ phần được biệt riêng và trình dâng.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רֵאשִׁית
  choice: từ phần đầu
  rationale: Diễn đạt nghĩa phần đầu tiên được lấy ra, giữ sắc thái phân chia mà không giới hạn vào hoa lợi chưa chế biến.
- source_word: עֲרִסֹתֵיכֶם
  choice: khối bột nhào của anh em
  rationale: Trong ngữ cảnh, từ này chỉ bột đang được nhào hơn là dụng cụ đựng; thêm “khối” giúp câu tiếng Việt tự nhiên và cho thấy một phần được lấy ra.
- source_word: חַלָּה
  choice: một ổ bánh
  rationale: Chỉ bánh hoặc ổ bánh được tạo từ bột; “ổ bánh” dễ hiểu và không gợi bánh ngọt.
- source_word: תָּרִימוּ
  choice: phải lấy ... dâng / phải dâng
  rationale: Động từ Hiphil của רום có nghĩa đen là nâng lên, nhưng trong ngữ cảnh nghi lễ chỉ hành động biệt riêng và dâng lễ vật; cách dịch này tự nhiên trong tiếng Việt.
- source_word: תְרוּמָה
  choice: lễ vật
  rationale: Chỉ phần đóng góp được biệt riêng và trình dâng; “lễ vật” rõ nghĩa, trang trọng, không dùng thuật ngữ cổ khó hiểu.
- source_word: כִּתְרוּמַת גֹּרֶן
  choice: như lễ vật từ sân đập lúa
  rationale: Giữ phép so sánh với phần lễ vật lấy từ sản vật tại sân đập lúa và diễn đạt quan hệ nguồn gốc tự nhiên trong tiếng Việt.
- source_word: גֹּרֶן
  choice: sân đập lúa
  rationale: Thuật ngữ nông nghiệp thông dụng chỉ nơi đập và xử lý ngũ cốc.
- source_word: כֵּן
  choice: như ... ấy
  rationale: Kết cấu tiếng Việt gộp כִּ...כֵּן thành phép so sánh “như ...”, tránh lặp cứng mà vẫn giữ quan hệ tương ứng.
- source_word: אֹתָהּ
  choice: lễ vật ấy
  rationale: Làm rõ đại từ giống cái quy chiếu về vật được dâng, tránh sự mơ hồ không tự nhiên của “nó” trong tiếng Việt.
