language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: הַ/קָּהָ֕ל חֻקָּ֥ה אַחַ֛ת לָ/כֶ֖ם וְ/לַ/גֵּ֣ר הַ/גָּ֑ר חֻקַּ֤ת עוֹלָם֙ לְ/דֹרֹ֣תֵי/כֶ֔ם כָּ/כֶ֛ם כַּ/גֵּ֥ר יִהְיֶ֖ה לִ/פְנֵ֥י יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/015.yaml
  text: For the assembly[a], there shall be one statute for you and for the sojourner who sojourns with you, a permanent statute throughout your generations. As you are[b], so shall the sojourner be before Yahweh.
translation:
  language: vi
  text: Đối với hội chúng, sẽ chỉ có một quy định cho anh em và cho người ngoại kiều[a] đang cư ngụ giữa anh em. Đó là quy định lâu dài[b] qua các thế hệ của anh em. Anh em thế nào, người ngoại kiều cũng sẽ như vậy trước mặt Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “người khách trú” hoặc “người ngoại quốc cư trú”.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “quy định vĩnh viễn” hoặc “quy định trường tồn”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקָּהָל
  choice: hội chúng
  rationale: Danh từ קָהָל chỉ cộng đồng được tập hợp. “Hội chúng” tự nhiên trong văn cảnh cộng đồng–thờ phượng và không đồng nhất cộng đồng này với một thiết chế giáo hội về sau.
- source_word: חֻקָּה אַחַת
  choice: chỉ có một quy định
  rationale: חֻקָּה là quy định có tính pháp lý; אַחַת nhấn mạnh rằng cùng một quy định áp dụng cho cả hai nhóm. Từ “chỉ” làm rõ điểm nhấn ấy trong tiếng Việt.
- source_word: לָכֶם וְלַגֵּר הַגָּר
  choice: cho anh em và cho người ngoại kiều đang cư ngụ giữa anh em
  rationale: גֵּר là người không thuộc dân bản địa nhưng đang sống trong cộng đồng. Cụm “đang cư ngụ” giữ lại sự lặp từ của גֵּר và động từ גור, đồng thời diễn đạt tình trạng cư trú liên tục.
- source_word: חֻקַּת עוֹלָם
  choice: quy định lâu dài
  rationale: Trong công thức pháp lý, עוֹלָם nói đến hiệu lực bền vững qua các thế hệ. “Lâu dài” truyền đạt điều đó mà không tự động giải quyết phạm vi thời gian theo nghĩa triết học tuyệt đối.
- source_word: לְדֹרֹתֵיכֶם
  choice: qua các thế hệ của anh em
  rationale: Cách diễn đạt này giữ ý quy định tiếp tục có hiệu lực trong các thế hệ kế tiếp.
- source_word: כָּכֶם כַּגֵּר יִהְיֶה
  choice: Anh em thế nào, người ngoại kiều cũng sẽ như vậy
  rationale: Cấu trúc đối xứng bảo toàn sự nhấn mạnh về địa vị ngang nhau của hai nhóm trong vấn đề đang được quy định.
- source_word: לִפְנֵי יְהוָה
  choice: trước mặt Yahweh
  rationale: “Trước mặt” diễn đạt trực tiếp לִפְנֵי, còn “Yahweh” phiên âm danh riêng יהוה thay vì thay bằng một tước hiệu.
theological_decisions:
- issue: Địa vị của người ngoại kiều trong luật thờ phượng của Israel
  choice: Bản dịch khẳng định cùng một quy định áp dụng cho cộng đồng Israel và người ngoại kiều cư ngụ giữa họ trong vấn đề thuộc văn cảnh này.
  alternative: Có thể hiểu câu này như một tuyên bố bao quát về mọi phương diện pháp lý, hoặc hiểu hẹp hơn là chỉ nói đến các quy định dâng tế lễ trong văn cảnh liền trước.
  rationale: Câu văn nhấn mạnh sự bình đẳng “trước mặt Yahweh”, nhưng bản dịch không mở rộng phạm vi của lời khẳng định vượt quá điều văn bản và văn cảnh xác định.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Đại từ “anh em” biểu thị cộng đồng được ngỏ lời; câu cuối giữ thế đối xứng của nguyên văn. Các dấu chú thích được đặt ngay sau đúng từ ngữ cần giải thích.
