base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/036.yaml
  text: So the whole congregation brought him outside the camp and stoned him with stones, and he died, just as Yahweh had commanded Moses.
translation:
  language: vi
  text: Vậy, toàn thể hội chúng đưa ông ra ngoài trại, ném đá ông, và ông chết, đúng như Yahweh đã truyền cho Môi-se.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל הָעֵדָה
  choice: toàn thể hội chúng
  rationale: עֵדָה chỉ cộng đồng Israel được tập hợp; “hội chúng” giữ được sắc thái tập thể trong bối cảnh giao ước, còn כָּל được thể hiện bằng “toàn thể”.
- source_word: וַיֹּצִיאוּ אֹתוֹ
  choice: đưa ông ra
  rationale: Dạng Hiphil của יצא có nghĩa là đưa hoặc đem ra; “đưa ông ra” tự nhiên trong tiếng Việt và phù hợp với đích đến ở ngoài trại.
- source_word: אֶל מִחוּץ לַמַּחֲנֶה
  choice: ra ngoài trại
  rationale: Cụm này diễn tả chuyển động đến nơi nằm bên ngoài trại; cách nói tiếng Việt này vừa tự nhiên vừa chính xác.
- source_word: וַיִּרְגְּמוּ אֹתוֹ בָּאֲבָנִים
  choice: ném đá ông cho đến chết
  rationale: רגם diễn tả việc xử tử bằng cách ném đá. Tiếng Việt “ném đá ông” đã hàm chứa phương tiện là đá; kết hợp với וַיָּמֹת thành “cho đến chết” truyền đạt tự nhiên chuỗi hành động và kết quả mà không đổi ý nghĩa.
- source_word: וַיָּמֹת
  choice: cho đến chết
  rationale: Động từ מות đơn giản có nghĩa là chết. Trong tiếng Việt, gắn kết với hành động ném đá bằng “cho đến chết” tránh câu vụng “và ông chết” nhưng vẫn bảo toàn kết quả được nêu rõ trong nguyên văn.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: đúng như Yahweh đã truyền cho Môi-se
  rationale: כַּאֲשֶׁר biểu thị sự tương ứng, được diễn đạt bằng “đúng như”; thể hoàn thành צִוָּה nói đến mệnh lệnh đã được ban trước đó. Danh riêng giao ước יְהוָה được phiên là “Yahweh”.
theological_decisions:
- issue: Cách dịch danh Đức Chúa Trời יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Nguyên văn dùng trực tiếp Tứ Tự Danh. Phiên âm “Yahweh” bảo lưu tính chất danh riêng giao ước mà không thay bằng một tước hiệu.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “hội chúng” để giữ sắc thái cộng đồng Israel được tập hợp; “trại” phù hợp bối cảnh dân Israel trong hoang mạc. Không cần chú thích vì câu không có dị bản hay điểm mơ hồ đáng kể cần trình bày.
