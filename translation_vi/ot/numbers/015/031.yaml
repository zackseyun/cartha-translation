id: NUM.15.31
reference: Numbers 15:31
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: כִּ֤י דְבַר יְהוָה֙ בָּזָ֔ה וְ/אֶת מִצְוָת֖/וֹ הֵפַ֑ר הִכָּרֵ֧ת תִּכָּרֵ֛ת הַ/נֶּ֥פֶשׁ הַ/הִ֖וא עֲוֺנָ֥/ה בָֽ/הּ־־׀׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/031.yaml
  text: Because he has despised the word of Yahweh and has broken his commandment, that person shall surely be cut off; his guilt is on him.
translation:
  language: vi
  text: Vì người ấy đã khinh thường lời của Yahweh và vi phạm điều răn của Ngài, người ấy chắc chắn sẽ bị cắt đứt; tội trạng của người ấy ở trên người ấy.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “người ấy chắc chắn sẽ bị cắt đứt.” Đây là một thành ngữ pháp lý trong giao ước; câu này không nói rõ hình phạt được thực hiện bằng cái chết, sự khai trừ hay cách nào khác. Câu cuối cũng có thể dịch: “tội lỗi của người ấy ở trên người ấy.”'
    reason: Bảo tồn thành ngữ Hê-bơ-rơ và sự không xác định về hình thức phán xét; “tội trạng” diễn đạt sắc thái trách nhiệm pháp lý có thể có của עָוֹן.
lexical_decisions:
- source_word: כִּי
  choice: Vì
  rationale: Diễn tả quan hệ nguyên nhân với hình phạt nêu ở câu trước, đồng thời tự nhiên trong tiếng Việt.
- source_word: דְבַר יְהוָה
  choice: lời của Yahweh
  rationale: דָּבָר ở đây chỉ lời truyền dạy hay sự mặc khải có thẩm quyền của Đức Chúa Trời; giữ danh giao ước Yahweh theo chính văn Hê-bơ-rơ.
- source_word: בָּזָה
  choice: đã khinh thường
  rationale: Thể hiện thái độ chủ động coi thường, mạnh hơn ý chỉ sao nhãng hoặc không vâng lời.
- source_word: מִצְוָתוֹ
  choice: điều răn của Ngài
  rationale: Giữ số ít của nguyên văn và sắc thái pháp lý, giao ước của מִצְוָה.
- source_word: הֵפַר
  choice: vi phạm
  rationale: Trong ngữ cảnh luật pháp, diễn đạt tự nhiên hành động phá bỏ hay làm trái điều răn mà không mang sắc thái kỹ thuật quá mức.
- source_word: הִכָּרֵת תִּכָּרֵת
  choice: chắc chắn sẽ bị loại khỏi cộng đồng
  rationale: Cấu trúc nguyên thể tuyệt đối đi với động từ hữu hạn nhấn mạnh tính chắc chắn. Cụm 'bị loại khỏi cộng đồng' truyền đạt thành ngữ giao ước nhưng không xác định cơ chế thi hành.
- source_word: הַנֶּפֶשׁ הַהִוא
  choice: người ấy
  rationale: נֶפֶשׁ trong văn cảnh pháp lý chỉ một cá nhân, nên 'người ấy' rõ ràng và tự nhiên hơn 'linh hồn ấy'.
- source_word: עֲוֺנָהּ בָּהּ
  choice: tội lỗi của người ấy vẫn ở trên chính mình
  rationale: Giữ hình ảnh trách nhiệm về tội lỗi đè trên chính người phạm tội; 'vẫn' làm rõ ý trách nhiệm không được cất bỏ mà không biến mệnh đề thành tương lai.
theological_decisions:
- issue: Cách chuyển danh giao ước יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA; CHÚA
  rationale: Nguyên văn trực tiếp dùng Tứ tự danh; phiên âm Yahweh bảo tồn danh giao ước mà không thay bằng một tước hiệu.
- issue: Ý nghĩa hình phạt הִכָּרֵת תִּכָּרֵת
  choice: bị loại khỏi cộng đồng, kèm chú thích rằng cách thi hành không được xác định
  alternative: bị xử tử; bị khai trừ; bị tuyệt tự
  rationale: Động từ mang sức nặng phán xét trong giao ước, nhưng câu này không nói rõ hình phạt xảy ra bằng cái chết, sự khai trừ hay cách nào khác; bản dịch không nên tự giải quyết sự mơ hồ đó.
- issue: Trách nhiệm được diễn tả bởi עֲוֺנָהּ בָּהּ
  choice: tội lỗi của người ấy vẫn ở trên chính mình
  alternative: hình phạt vì tội lỗi sẽ giáng trên người ấy
  rationale: עָוֹן có thể bao hàm tội lỗi và trách nhiệm/hậu quả do tội, nhưng bản dịch giữ trọng tâm ở tội trạng thuộc về chính người phạm mà không đồng nhất từ này chỉ với hình phạt.
translation_notes:
  register: Văn phong trang nghiêm nhưng hiện đại, dễ hiểu. Đại từ 'Ngài' viết hoa để chỉ Yahweh. Tránh từ cổ hoặc biệt ngữ giáo phái; chú thích giữ lại thành ngữ và sự mơ hồ thật sự của nguyên văn.
