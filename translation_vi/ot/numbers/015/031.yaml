  to: Vì người ấy đã khinh thường lời của Yahweh và vi phạm điều răn của Ngài, người ấy chắc chắn sẽ bị cắt đứt; tội trạng của người ấy ở trên người ấy.[a]
  rationale: Đã thay cách diễn giải “bị loại khỏi cộng đồng” bằng “bị cắt đứt” để không giải quyết một tranh luận mà nguyên văn để mở. Cũng đã chỉnh mệnh đề cuối cho sát cấu trúc nguồn và tự nhiên hơn trong tiếng Việt, không thêm ý “vẫn.”
