- from: Nhưng người nào cố ý chống nghịch[a] mà làm điều ấy, dù là người bản xứ hay ngoại kiều cư ngụ, thì xúc phạm Đức Giê-hô-va; người đó sẽ bị loại khỏi dân mình.
  to: Nhưng người nào hành động một cách ngạo mạn[a], dù là người bản xứ hay ngoại kiều cư ngụ, thì phỉ báng Đức Giê-hô-va; người đó sẽ bị loại khỏi giữa dân mình.
