    issue: “làm điều ấy” không có đối ứng trực tiếp trong câu Hê-bơ-rơ.
    rationale: Động từ תַּעֲשֶׂה ở đây không nêu tân ngữ; việc thêm “điều ấy” có thể gợi một hành vi xác định mà bản câu này không nêu.
  - severity: medium
    issue: “xúc phạm” làm yếu sắc thái của מְגַדֵּף.
    rationale: Động từ này diễn tả sự phỉ báng, lăng mạ hoặc khinh miệt Đức Giê-hô-va; “phỉ báng” trực tiếp và mạnh hơn trong tiếng Việt.
  revised_text: Nhưng người nào hành động một cách ngạo mạn[a], dù là người bản xứ hay ngoại kiều cư ngụ, thì phỉ báng Đức Giê-hô-va; người đó sẽ bị loại khỏi giữa dân mình.
