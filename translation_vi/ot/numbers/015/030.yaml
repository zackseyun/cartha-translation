id: NUM.15.30
reference: Numbers 15:30
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/הַ/נֶּ֜פֶשׁ אֲשֶֽׁר תַּעֲשֶׂ֣ה בְּ/יָ֣ד רָמָ֗ה מִן הָֽ/אֶזְרָח֙ וּ/מִן הַ/גֵּ֔ר אֶת יְהוָ֖ה ה֣וּא מְגַדֵּ֑ף וְ/נִכְרְתָ֛ה הַ/נֶּ֥פֶשׁ הַ/הִ֖וא מִ/קֶּ֥רֶב עַמָּֽ/הּ־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/030.yaml
  text: But the person who acts with a high hand[a], whether native-born or a sojourner, is reviling Yahweh, and that person shall be cut off from among his people.
translation:
  language: vi
  text: Nhưng người nào hành động một cách ngạo mạn[a], dù là người bản xứ hay ngoại kiều cư ngụ, thì phỉ báng Đức Giê-hô-va; người đó sẽ bị loại khỏi giữa dân mình.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “với bàn tay giơ cao”; cũng có thể hiểu là hành động cách ngạo mạn hoặc thách thức.'
    reason: Bảo lưu hình ảnh của thành ngữ Hê-bơ-rơ và các sắc thái ngữ nghĩa, trong khi bản văn chính diễn đạt tự nhiên bằng tiếng Việt.
lexical_decisions:
- source_word: הַנֶּפֶשׁ
  choice: người nào / người đó
  rationale: Trong văn bản luật pháp, נֶפֶשׁ chỉ toàn thể con người, không riêng phần linh hồn; cách dịch này tự nhiên và giữ đúng nghĩa pháp lý.
- source_word: תַּעֲשֶׂה
  choice: làm điều ấy
  rationale: Động từ עשה có nghĩa rộng là “làm”; “điều ấy” nối tự nhiên với các hành vi được bàn trong ngữ cảnh gần mà không thu hẹp loại vi phạm.
- source_word: בְּיָד רָמָה
  choice: cố ý chống nghịch
  rationale: Thành ngữ nghĩa đen là “với bàn tay giơ cao”, diễn tả hành vi công khai, ngạo mạn và thách thức. Bản văn chính truyền đạt nghĩa thành ngữ bằng tiếng Việt tự nhiên, còn chú thích bảo lưu hình ảnh nguyên ngữ.
- source_word: הָאֶזְרָח
  choice: người bản xứ
  rationale: Chỉ người sinh trưởng trong cộng đồng/xứ sở, đối lập về địa vị với גֵּר.
- source_word: הַגֵּר
  choice: ngoại kiều cư ngụ
  rationale: גֵּר là người không thuộc dân bản địa nhưng đang cư trú giữa Israel và ở dưới luật pháp cũng như sự bảo hộ của cộng đồng; cách dịch này cụ thể hơn “người nước ngoài”.
- source_word: אֶת יְהוָה הוּא מְגַדֵּף
  choice: thì xúc phạm Đức Giê-hô-va
  rationale: מְגַדֵּף diễn tả sự khinh miệt hoặc lăng nhục Đức Chúa Trời bằng lời nói hay hành động. “Xúc phạm” giữ được phạm vi ấy mà không giới hạn vào lời phạm thượng.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng cách phiên âm danh riêng YHWH quen thuộc, trang trọng và dễ nhận biết trong tiếng Việt.
- source_word: וְנִכְרְתָה
  choice: sẽ bị loại khỏi
  rationale: Giữ công thức phán quyết nghiêm trọng của כרת ở thể bị động, nhưng không tự quyết định đó là xử tử, trục xuất hay sự phán xét trực tiếp của Đức Chúa Trời.
- source_word: מִקֶּרֶב עַמָּהּ
  choice: khỏi dân mình
  rationale: Diễn đạt sự bị loại khỏi giữa cộng đồng giao ước; “mình” tự nhiên trong tiếng Việt và không áp đặt giới tính lên người phạm lỗi.
theological_decisions:
- issue: Bản chất của hành vi בְּיָד רָמָה
  choice: cố ý chống nghịch
  alternative: với bàn tay giơ cao; cách ngạo mạn; cố tình
  rationale: Nguyên ngữ mô tả hành vi cố ý, công khai và thách thức, trái với lỗi vô ý trong ngữ cảnh. Cách dịch không biến cụm từ thành một thuật ngữ giáo phái.
- issue: Ý nghĩa của hình phạt “bị loại khỏi”
  choice: Không xác định cơ chế của hình phạt trong bản dịch
  alternative: bị xử tử; bị trục xuất khỏi cộng đồng; bị Đức Chúa Trời trực tiếp phán xét
  rationale: Công thức Hê-bơ-rơ rất nghiêm trọng nhưng câu này không nói rõ cơ chế; giữ cách diễn đạt rộng bảo toàn sự hàm hồ và căng thẳng thần học của bản văn.
translation_notes:
  register: Văn phong luật pháp trang trọng nhưng hiện đại, dễ hiểu. “Ngoại kiều cư ngụ” phân biệt người định cư với khách vãng lai; “bị loại khỏi dân mình” chủ ý không giải thích quá mức bản chất hình phạt. Dấu chú thích [a] đã được đặt ngay sau cụm từ tương ứng trong bản văn.
