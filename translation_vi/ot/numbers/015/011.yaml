base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/011.yaml
  text: Thus it shall be done for the one bull[a], or for the one ram, or for the lamb among the sheep or among the goats.
translation:
  language: vi
  text: Phải làm như thế cho mỗi con bò đực, mỗi con cừu đực, hoặc mỗi con vật thuộc đàn cừu hay đàn dê.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hê-bơ-rơ שֶׂה có thể chỉ chung một con gia súc nhỏ, chứ không chỉ cừu non; phần tiếp theo xác định đó có thể là con vật thuộc đàn cừu hoặc đàn dê.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּכָה
  choice: như thế
  rationale: Diễn đạt tự nhiên trạng từ chỉ thể cách, đồng thời giữ sắc thái quy định của văn mạch luật lệ.
- source_word: יֵעָשֶׂה
  choice: Phải làm
  rationale: Thể Nifal chưa hoàn thành mang nghĩa bị động/vô nhân xưng và tính quy định; tiếng Việt tự nhiên dùng cấu trúc “phải làm” mà không xác định thêm chủ thể.
- source_word: לַשּׁוֹר הָאֶחָד
  choice: cho mỗi con bò đực
  rationale: Mạo từ cùng אֶחָד nhấn mạnh việc áp dụng quy định cho từng con vật; “mỗi con” tự nhiên hơn trong tiếng Việt mà vẫn giữ ý nghĩa phân phối.
- source_word: אַיִל הָאֶחָד
  choice: mỗi con cừu đực
  rationale: אַיִל chỉ cừu đực; אֶחָד lặp lại để nhấn mạnh từng cá thể.
- source_word: שֶׂה
  choice: mỗi con vật
  rationale: שֶׂה có thể chỉ một cá thể gia súc nhỏ, gồm chiên hoặc dê; cách dịch rộng tránh thu hẹp sai thành riêng “chiên con” khi chính vế sau nêu cả đàn chiên lẫn đàn dê.
- source_word: בַכְּבָשִׂים ... בָעִזִּים
  choice: thuộc đàn chiên hay đàn dê
  rationale: בְּ ở đây biểu thị loại/nhóm mà con vật thuộc về; cách diễn đạt này rõ và tự nhiên trong tiếng Việt.
- source_word: אוֹ ... אוֹ ... אוֹ ... אוֹ
  choice: '... hoặc ... hay ...'
  rationale: Giữ quan hệ lựa chọn giữa các loại lễ vật; trong tiếng Việt, phối hợp “hoặc” và “hay” giúp câu bớt nặng mà không làm đổi quan hệ phân cách.
theological_decisions: []
translation_notes:
  register: Văn phong luật lệ trang trọng nhưng hiện đại. Dùng “phải làm” để truyền đạt lực quy định, và “mỗi con” để thể hiện ý áp dụng cho từng cá thể. Đại từ chỉ loại “con vật” được giữ đủ rộng theo từ Hê-bơ-rơ; chú thích giải thích phạm vi nghĩa.
