  rationale: 'Chỉnh sửa chỉ nhằm thống nhất thuật ngữ tiếng Việt hiện đại: dùng “cừu” xuyên suốt thay cho sự xen kẽ giữa “cừu” và “chiên”. Cấu trúc lựa chọn, sắc thái quy định và sự rộng nghĩa có chủ ý của שֶׂה được giữ nguyên.'
