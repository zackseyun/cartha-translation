  text: א֤וֹ לָ/אַ֨יִל֙ תַּעֲשֶׂ֣ה מִנְחָ֔ה סֹ֖לֶת שְׁנֵ֣י עֶשְׂרֹנִ֑ים בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן שְׁלִשִׁ֥ית הַ/הִֽין׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/006.yaml
  text: Or for a ram you shall prepare a grain offering of fine flour[a], two-tenths, mixed with a third of a hin of oil.
translation:
  language: vi
  text: Hoặc, đối với một con cừu đực, ngươi phải chuẩn bị một lễ vật ngũ cốc bằng hai phần mười bột mịn[a], trộn với một phần ba hin dầu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tiếng Hê-bơ-rơ nói sát nghĩa là “hai phần mười”; đơn vị lớn hơn được hiểu ngầm theo hệ đo lường tế lễ. Ở những chỗ khác, cách nói đầy đủ là “hai phần mười ê-pha”.
    reason: cultural_note
lexical_decisions:
- source_word: א֤וֹ
  choice: Hoặc
  rationale: Giữ chức năng liên kết lựa chọn này với các trường hợp tế lễ ở trước, không thêm ý điều kiện vốn không được nói rõ trong tiếng Hê-bơ-rơ.
- source_word: לָ/אַ֨יִל֙
  choice: đối với một con cừu đực
  rationale: אַיִל chỉ con cừu đực; giới từ ל ở đây biểu thị đối tượng mà lễ vật đi kèm được chuẩn bị.
- source_word: תַּעֲשֶׂ֣ה
  choice: ngươi phải chuẩn bị
  rationale: Trong ngữ cảnh quy định tế lễ, עשה mang nghĩa thực hiện hoặc chuẩn bị; cách dịch này tự nhiên hơn 'làm' mà vẫn giữ sắc thái bắt buộc của lời chỉ dẫn.
- source_word: מִנְחָ֔ה
  choice: một lễ vật ngũ cốc
  rationale: Trong văn mạch tế lễ của Ngũ Kinh, מִנְחָה là lễ vật làm từ ngũ cốc, không chỉ là một lễ vật nói chung.
- source_word: סֹ֖לֶת
  choice: bằng bột mịn
  rationale: סֹלֶת là loại bột tinh mịn dùng theo quy định cho lễ vật ngũ cốc.
- source_word: שְׁנֵ֣י עֶשְׂרֹנִ֑ים
  choice: với lượng hai phần mười[a]
  rationale: Nguyên văn chỉ nói 'hai phần mười', lược đơn vị lớn hơn vốn được hiểu theo hệ đo lường tế lễ. Bản dịch giữ sự tỉnh lược và giải thích bằng chú thích.
- source_word: בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן
  choice: trộn với ... dầu
  rationale: Phân từ bị động בְּלוּלָה mô tả bột được trộn; giới từ đi với động từ này được diễn đạt tự nhiên là 'với dầu'.
- source_word: שְׁלִשִׁ֥ית הַ/הִֽין
  choice: một phần ba hin
  rationale: Giữ nguyên đơn vị đo cổ hin và diễn đạt phân số theo tiếng Việt hiện đại.
theological_decisions: []
translation_notes:
  register: Văn phong trang trọng, rõ ràng và mang tính quy định. Dùng “ngươi” để giữ ngôi thứ hai số ít của động từ Hê-bơ-rơ; dùng “cừu đực” là cách gọi hiện đại, dễ hiểu hơn thuật ngữ cổ.
