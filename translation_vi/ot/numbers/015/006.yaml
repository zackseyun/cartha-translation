    rationale: Trong câu hiện tại, cụm này đứng sau «bột mịn» nhưng được giới thiệu bằng «với lượng», làm câu kém tự nhiên và không cho thấy trực tiếp rằng số đo thuộc về bột mịn trong lễ vật. Cần đặt «hai phần mười» trực tiếp trước «bột mịn».
