  to: Hoặc, đối với một con cừu đực, ngươi phải chuẩn bị một lễ vật ngũ cốc bằng hai phần mười bột mịn[a], trộn với một phần ba hin dầu.
  rationale: 'Bản sửa chỉ cải thiện trật tự cú pháp tiếng Việt: «hai phần mười» được gắn trực tiếp với «bột mịn», là chất liệu được đo lường trong lễ vật. Chú thích giữ nguyên để cho biết nguyên văn lược đơn vị lớn hơn, không bổ sung đơn vị đó vào thân bài.'
