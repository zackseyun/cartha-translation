  text: וְ/כִ֣י תִשְׁגּ֔וּ וְ/לֹ֣א תַעֲשׂ֔וּ אֵ֥ת כָּל הַ/מִּצְוֺ֖ת הָ/אֵ֑לֶּה אֲשֶׁר דִּבֶּ֥ר יְהוָ֖ה אֶל מֹשֶֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/022.yaml
  text: But if you unintentionally go astray and do not do all these commandments that Yahweh has spoken to Moses,[a]
translation:
  language: vi
  text: Nhưng nếu anh em vô ý lầm lỡ[a] và không làm theo mọi điều răn này mà Yahweh đã phán với Môi-se,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “vô ý phạm sai lầm” hoặc “vô ý phạm tội.” Động từ Hê-bơ-rơ mang nghĩa đi sai đường hoặc phạm sai lầm; trong ngữ cảnh này, nó chỉ việc không làm theo các điều răn mà không cố ý.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: Nhưng nếu
  rationale: Dẫn vào một trường hợp có điều kiện, tiếp nối luật lệ trước đó và có sắc thái chuyển ý nhẹ.
- source_word: תִשְׁגּוּ
  choice: anh em vô ý đi sai đường
  rationale: Giữ hình ảnh đi lạc/sai đường của שׁגה, đồng thời thể hiện tính không cố ý được ngữ cảnh luật tế lễ xác định.
- source_word: וְלֹא תַעֲשׂוּ
  choice: và không làm theo
  rationale: Trong quan hệ với các điều răn, “làm theo” là cách nói tự nhiên, diễn đạt việc thi hành hoặc tuân giữ mà không thêm ý quá mức.
- source_word: אֵת כָּל הַמִּצְוֺת הָאֵלֶּה
  choice: mọi điều răn này
  rationale: Diễn đạt trực tiếp tính bao quát của כָּל và nghĩa luật giao ước của מִצְוֺת.
- source_word: אֲשֶׁר דִּבֶּר יְהוָה אֶל מֹשֶׁה
  choice: mà Yahweh đã phán với Môi-se
  rationale: Mệnh đề quan hệ xác định đây là những điều răn Yahweh đã truyền đạt cho Môi-se; “đã phán” phù hợp thể hoàn thành của động từ.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời thay vì thay thế bằng một tước hiệu.
- source_word: מֹשֶׁה
  choice: Môi-se
  rationale: Dạng tên riêng quen thuộc trong tiếng Việt.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Bản văn dùng trực tiếp danh giao ước; giữ danh riêng tránh thay nó bằng một tước hiệu.
- issue: Sắc thái của שׁגה trong ngữ cảnh luật tế lễ
  choice: vô ý đi sai đường
  alternative: phạm tội vì vô ý
  rationale: Cách dịch được chọn giữ hình ảnh và độ rộng nghĩa của động từ, đồng thời nêu rõ tính không cố ý từ ngữ cảnh, nhưng không thu hẹp ngay thành thuật ngữ “phạm tội”.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Anh em” thể hiện ngôi thứ hai số nhiều; cấu trúc câu giữ tính chất mở đầu của một điều luật và dấu phẩy cuối câu cho thấy ý được tiếp tục ở câu sau.
