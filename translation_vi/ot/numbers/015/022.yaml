revisions:
- from: Nhưng nếu anh em vô ý đi sai đường và không làm theo mọi điều răn này mà Yahweh đã phán với Môi-se,[a]
  to: Nhưng nếu anh em vô ý lầm lỡ[a] và không làm theo mọi điều răn này mà Yahweh đã phán với Môi-se,
  rationale: Thay “vô ý đi sai đường” bằng “vô ý lầm lỡ” để phản ánh nghĩa của שׁגה một cách tự nhiên trong tiếng Việt hiện đại và phù hợp với bối cảnh luật lệ, nhưng vẫn giữ độ rộng nghĩa thay vì diễn giải dứt khoát là tội lỗi. Dời neo chú thích đến cụm từ mà chú thích giải thích. Không thay đổi ý nghĩa hay các thuật ngữ chủ chốt khác.
