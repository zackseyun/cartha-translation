source:
  edition: WLC
  text: וְ/כִפֶּ֣ר הַ/כֹּהֵ֗ן עַל הַ/נֶּ֧פֶשׁ הַ/שֹּׁגֶ֛גֶת בְּ/חֶטְאָ֥ה בִ/שְׁגָגָ֖ה לִ/פְנֵ֣י יְהוָ֑ה לְ/כַפֵּ֥ר עָלָ֖י/ו וְ/נִסְלַ֥ח לֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/028.yaml
  text: And the priest shall make atonement before Yahweh for the person who sins unintentionally, when he sins unintentionally, to make atonement for him, and he shall be forgiven.
translation:
  language: vi
  text: Thầy tế lễ sẽ làm lễ chuộc tội cho người phạm tội không cố ý, khi người ấy phạm tội do vô ý trước mặt Yahweh, để làm lễ chuộc tội cho người ấy; người ấy sẽ được tha thứ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכִפֶּר
  choice: sẽ làm lễ chuộc tội
  rationale: Dạng Piel của כפר trong ngữ cảnh tế lễ chỉ hành động thực hiện nghi thức chuộc tội. “Làm lễ chuộc tội” vừa tự nhiên trong tiếng Việt vừa giữ sắc thái nghi lễ, không áp đặt một lý thuyết thần học hẹp.
- source_word: הַכֹּהֵן
  choice: thầy tế lễ
  rationale: Cách gọi thông dụng, trang trọng và rõ nghĩa trong tiếng Việt đối với người thi hành nghi lễ.
- source_word: עַל הַנֶּפֶשׁ
  choice: cho người
  rationale: נֶפֶשׁ ở đây chỉ một con người/cá nhân, không riêng phần linh hồn; “cho người” phù hợp với chức năng của giới từ עַל trong cụm nói về việc chuộc tội.
- source_word: הַשֹּׁגֶגֶת ... בְּחֶטְאָה בִשְׁגָגָה
  choice: người vô ý phạm tội, khi người ấy phạm tội vì vô ý
  rationale: Giữ sự lặp lại có chủ ý của trường từ vựng שׁגג/שׁגגה trong tiếng Hê-bơ-rơ, đồng thời diễn đạt tự nhiên và làm rõ đây là hành vi phạm tội không cố ý.
- source_word: לִפְנֵי יְהוָה
  choice: trước mặt Yahweh
  rationale: לִפְנֵי diễn tả sự hiện diện hay vị trí tương quan; “trước mặt” tự nhiên hơn lối dịch sát chữ “trước” và vẫn giữ danh riêng giao ước Yahweh.
- source_word: לְכַפֵּר עָלָיו
  choice: sẽ làm lễ chuộc tội cho người ấy
  rationale: Giữ lần lặp thứ hai của כפר và thể hiện chức năng mục đích của nguyên văn; thêm chủ ngữ “thầy tế lễ” để câu tiếng Việt rõ ràng.
- source_word: וְנִסְלַח לוֹ
  choice: và người ấy sẽ được tha thứ
  rationale: Giữ cấu trúc bị động của סלח và kết quả là sự tha thứ dành cho người phạm tội.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: CHÚA; Đức Giê-hô-va
  rationale: Nguyên văn dùng trực tiếp danh giao ước יהוה; “Yahweh” bảo tồn danh riêng thay vì thay bằng một tước hiệu hay dạng phiên âm truyền thống khác.
- issue: Ý nghĩa của כפר
  choice: làm lễ chuộc tội
  alternative: đền tội; xá tội
  rationale: Cách dịch được chọn giữ cả chiều kích nghi lễ và hiệu lực chuộc tội mà không xác định riêng một cơ chế thần học; việc tha thứ được mệnh đề cuối nêu riêng.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Bản dịch chủ ý giữ sự lặp lại trong nguyên văn về hành vi vô ý và việc chuộc tội, dù câu vì thế có tính nhấn mạnh hơn văn nói thông thường.
