revisions:
- from: Thầy tế lễ sẽ làm lễ chuộc tội trước mặt Yahweh cho người vô ý phạm tội, khi người ấy phạm tội vì vô ý; thầy tế lễ sẽ làm lễ chuộc tội cho người ấy, và người ấy sẽ được tha thứ.
  to: Thầy tế lễ sẽ làm lễ chuộc tội cho người phạm tội không cố ý, khi người ấy phạm tội do vô ý trước mặt Yahweh, để làm lễ chuộc tội cho người ấy; người ấy sẽ được tha thứ.
  rationale: Điều chỉnh vị trí của "trước mặt Yahweh" để phản ánh cú pháp và ngữ cảnh của tiếng Hê-bơ-rơ; giữ cả hai lần diễn đạt sự vô ý và cả hai lần כפר. Dùng dấu chấm phẩy trước kết quả bị động để câu tiếng Việt rõ mạch hơn.
