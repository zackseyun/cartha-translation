  text: אֵת֩ כָּל אֲשֶׁ֨ר צִוָּ֧ה יְהוָ֛ה אֲלֵי/כֶ֖ם בְּ/יַד מֹשֶׁ֑ה מִן הַ/יּ֞וֹם אֲשֶׁ֨ר צִוָּ֧ה יְהוָ֛ה וָ/הָ֖לְאָה לְ/דֹרֹתֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/023.yaml
  text: everything that Yahweh has commanded you through Moses[a], from the day that Yahweh commanded and onward throughout your generations—
translation:
  language: vi
  text: tức là mọi điều Đức Giê-hô-va đã truyền cho anh em qua Môi-se[a], từ ngày Đức Giê-hô-va truyền lệnh trở đi, qua các thế hệ anh em—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ: “bởi tay Môi-se”, một thành ngữ có nghĩa là “qua Môi-se”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵת כָּל אֲשֶׁר
  choice: tức là mọi điều
  rationale: Cụm này tiếp nối đối tượng của câu trước và diễn tả toàn bộ những điều đã được truyền; “mọi điều” tự nhiên và giữ nguyên sức bao quát.
- source_word: צִוָּה
  choice: đã truyền / ban truyền
  rationale: Động từ hoàn thành chỉ những mệnh lệnh Đức Giê-hô-va đã ban, vẫn có hiệu lực trong ngữ cảnh. Lần thứ hai dùng “ban truyền” để tiếng Việt tự nhiên mà không đổi nghĩa.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng cách phiên âm danh riêng của Đức Chúa Trời đã quen thuộc và trang trọng trong tiếng Việt, thay vì thay thế bằng một tước hiệu.
- source_word: אֲלֵיכֶם
  choice: cho anh em
  rationale: Giữ rõ giới từ hướng đến cộng đồng được truyền lệnh; “anh em” phù hợp với lời nói hướng đến toàn thể dân chúng.
- source_word: בְּיַד מֹשֶׁה
  choice: qua Môi-se
  rationale: Thành ngữ nghĩa đen là “bởi tay Môi-se” nhưng ở đây diễn tả vai trò trung gian; “qua Môi-se” rõ nghĩa và tự nhiên.
- source_word: מִן הַיּוֹם אֲשֶׁר
  choice: từ ngày
  rationale: Giữ mốc khởi đầu theo sát cấu trúc thời gian của tiếng Hê-bơ-rơ.
- source_word: וָהָלְאָה
  choice: và về sau
  rationale: Diễn tả sự tiếp diễn từ mốc vừa nêu trở đi.
- source_word: לְדֹרֹתֵיכֶם
  choice: trải suốt các thế hệ của anh em
  rationale: Truyền đạt sự áp dụng liên tục qua các thế hệ kế tiếp, đồng thời giữ đại từ số nhiều của nguyên văn.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Đức Giê-hô-va
  alternative: Yahweh; CHÚA
  rationale: Nguyên văn dùng trực tiếp danh thánh; bản dịch giữ một dạng phiên âm danh riêng thay vì thay bằng tước hiệu. “Đức Giê-hô-va” là dạng trang trọng, dễ nhận biết trong tiếng Việt hiện đại.
- issue: Vai trò của Môi-se trong בְּיַד מֹשֶׁה
  choice: qua Môi-se
  alternative: bởi tay Môi-se
  rationale: Cách dịch này giữ ý Đức Giê-hô-va là Đấng truyền lệnh, còn Môi-se là người trung gian, không suy diễn thêm về bản chất của sự trung gian ấy.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dấu gạch ngang cuối câu được giữ vì câu này tiếp nối sang câu sau; “tức là” cho thấy đây là phần tiếp diễn cú pháp từ câu 22.
