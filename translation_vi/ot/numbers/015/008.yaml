  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/כִֽי תַעֲשֶׂ֥ה בֶן בָּקָ֖ר עֹלָ֣ה אוֹ זָ֑בַח לְ/פַלֵּא נֶ֥דֶר אֽוֹ שְׁלָמִ֖ים לַֽ/יהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/008.yaml
  text: And when you prepare a bull as a burnt offering or a sacrifice[a], to fulfill a vow or as peace offerings to Yahweh[b],
translation:
  language: vi
  text: Khi anh em chuẩn bị một con bò đực làm lễ thiêu hoặc sinh tế, để thực hiện một lời khấn nguyện[a] hoặc làm lễ vật bình an[b] dâng lên Yahweh,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “để làm trọn một lời khấn” hoặc “để hoàn thành điều đã khấn.” Thành ngữ Hê-bơ-rơ nói đến việc thực hiện điều đã khấn nguyện.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “lễ vật thông công” hoặc “lễ vật phúc an.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כִי
  choice: Khi
  rationale: Trong mạch luật lệ về tế lễ, cụm này mở đầu một trường hợp có tính điều kiện-thời gian; “Khi” tự nhiên và phù hợp với diễn tiến của chỉ dẫn.
- source_word: תַעֲשֶׂה
  choice: anh em chuẩn bị
  rationale: Động từ עשה có nghĩa rộng là “làm”; trong ngữ cảnh này, “chuẩn bị” diễn đạt tự nhiên việc sắp đặt con vật để dâng mà không thu hẹp động từ thành chính hành vi hiến tế.
- source_word: בֶן בָּקָר
  choice: một con bò
  rationale: Thành ngữ theo nghĩa đen là “con của đàn bò”, chỉ một con vật thuộc đàn bò; bản văn không buộc phải xác định tuổi hoặc giới tính rõ hơn.
- source_word: עֹלָה
  choice: lễ thiêu
  rationale: Thuật ngữ quen thuộc và chính xác cho loại sinh tế được thiêu trọn.
- source_word: אוֹ זָבַח
  choice: hoặc sinh tế
  rationale: זבח là thuật ngữ tương đối rộng về vật hoặc lễ hiến tế; “sinh tế” giữ được nét phân biệt với “lễ thiêu” mà vẫn trang trọng, dễ hiểu trong văn cảnh.
- source_word: לְ/פַלֵּא נֶדֶר
  choice: để thực hiện một lời khấn nguyện
  rationale: Đây là thành ngữ chỉ việc thi hành điều đã khấn; “thực hiện một lời khấn nguyện” rõ nghĩa mà không thêm nội dung của lời khấn.
- source_word: אוֹ שְׁלָמִים
  choice: hay làm lễ vật bình an
  rationale: “Lễ vật bình an” bảo tồn tên gọi truyền thống của loại lễ này; chú thích ghi nhận các sắc thái khả hữu về sự thông công và phúc lành.
- source_word: לַ/יהוָה
  choice: dâng lên Yahweh
  rationale: Giới từ ל được diễn đạt tự nhiên bằng “dâng lên” trong ngữ cảnh tế lễ; danh riêng giao ước יהוה được chuyển là “Yahweh”.
theological_decisions:
- issue: Cách chuyển danh יהוה
  choice: Yahweh
  alternative: ĐỨC CHÚA; Giê-hô-va
  rationale: Bản văn dùng trực tiếp danh giao ước יהוה. Giữ “Yahweh” giúp phân biệt danh riêng này với tước hiệu “Chúa” mà không áp đặt cách đọc theo một hệ phái.
- issue: Cách chuyển שְׁלָמִים
  choice: lễ vật bình an
  alternative: lễ vật thông công; lễ vật cầu phúc
  rationale: “Lễ vật bình an” giữ tên gọi quen thuộc và không giới hạn trường nghĩa vào riêng sự thông công hay phúc lợi; các khả năng đó được nêu trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” cho đại từ ngôi hai số ít mang tính đại diện trong lời chỉ dẫn dành cho cộng đồng, tránh “ngươi” vốn cổ; câu được giữ mở bằng dấu phẩy vì đây là một mệnh đề tiếp nối sang câu kế.
