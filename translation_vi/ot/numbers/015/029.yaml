revisions:
- from: Cùng một luật lệ sẽ áp dụng cho người bản xứ trong dân Y-sơ-ra-ên và cho ngoại kiều[a] cư ngụ giữa anh em, khi người ấy vô ý phạm lỗi.
  to: Đối với người bản xứ trong dân Y-sơ-ra-ên và người ngoại kiều[a] đang cư ngụ giữa họ, anh em sẽ có cùng một luật lệ dành cho người vô ý phạm lỗi.
  rationale: Sửa “ngoại kiều” thành “người ngoại kiều” cho tự nhiên hơn; phục hồi “giữa họ” theo nguyên ngữ, đồng thời giữ “anh em” ở vế “cho anh em”; và thay đại từ có tiền chỉ mơ hồ bằng “người vô ý phạm lỗi”, giữ ý số ít khái quát của לָעֹשֶׂה בִּשְׁגָגָה.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T09:26:39Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch phản ánh đúng các thành tố chính: một luật lệ chung cho người bản xứ Y-sơ-ra-ên và người ngoại kiều cư ngụ trong cộng đồng, trong trường hợp hành động do vô ý. Tuy nhiên, “giữa anh em” làm mất sự chuyển ngôi có chủ ý trong tiếng Hê-bơ-rơ: người ngoại kiều cư ngụ “giữa họ”, còn luật lệ là “cho anh em”. Cấu trúc “khi người ấy” cũng không phân bổ rõ ràng trường hợp số ít khái quát cho mỗi người thuộc hai nhóm.'
  naturalness: “Ngoại kiều” hiểu được nhưng nên dùng “người ngoại kiều” trong văn xuôi trang trọng hiện đại. Câu sửa dưới đây tự nhiên hơn, đồng thời tránh đại từ “người ấy” có tiền chỉ không rõ.
  terminology: “Người bản xứ”, “người ngoại kiều”, “cùng một luật lệ” và “vô ý phạm lỗi” phù hợp ngữ cảnh pháp lý-nghi lễ. “Phạm lỗi” được ngữ cảnh gần (15:27–28) hỗ trợ, dù động từ của câu này tự nó là khái quát.
  issues:
  - severity: medium
    issue: “giữa anh em” thay cho “giữa họ”
    rationale: Bản gốc nói người ngoại kiều đang cư ngụ בְּתוֹכָם, “giữa họ”, rồi chuyển sang לָכֶם, “cho anh em”. Chuyển cả hai vế sang ngôi thứ hai làm phẳng một chi tiết diễn ngôn của nguồn.
  - severity: low
    issue: “khi người ấy vô ý phạm lỗi” có tiền chỉ mơ hồ
    rationale: Người ấy có thể bị hiểu là chỉ người ngoại kiều ngay trước đó, thay vì là người bất kỳ trong hai nhóm. Nên diễn đạt số ít khái quát rõ hơn.
  revised_text: Đối với người bản xứ trong dân Y-sơ-ra-ên và người ngoại kiều[a] đang cư ngụ giữa họ, anh em sẽ có cùng một luật lệ dành cho người vô ý phạm lỗi.
  revised_footnotes:
