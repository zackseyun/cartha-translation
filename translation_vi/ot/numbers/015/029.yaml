    reason: cultural_note
  revision_rationale: Sửa “ngoại kiều” thành “người ngoại kiều” cho tự nhiên hơn; phục hồi “giữa họ” theo nguyên ngữ, đồng thời giữ “anh em” ở vế “cho anh em”; và thay đại từ có tiền chỉ mơ hồ bằng “người vô ý phạm lỗi”, giữ ý số ít khái quát của לָעֹשֶׂה בִּשְׁגָגָה.
