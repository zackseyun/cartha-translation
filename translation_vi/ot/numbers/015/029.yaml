base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/029.yaml
  text: The same law shall apply to the native-born Israelite and to the resident foreigner[a] living among you when either acts unintentionally.
translation:
  language: vi
  text: Đối với người bản xứ trong dân Y-sơ-ra-ên và người ngoại kiều[a] đang cư ngụ giữa họ, anh em sẽ có cùng một luật lệ dành cho người vô ý phạm lỗi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Người ngoại kiều” là người không thuộc dân bản địa nhưng cư trú trong cộng đồng Y-sơ-ra-ên.
    reason: cultural_note
lexical_decisions:
- source_word: הָאֶזְרָח בִּבְנֵי יִשְׂרָאֵל
  choice: người bản xứ trong dân Y-sơ-ra-ên
  rationale: Diễn đạt rõ thành viên bản địa của cộng đồng Y-sơ-ra-ên, đồng thời giữ quan hệ cộng đồng được nêu trong tiếng Hê-bơ-rơ.
- source_word: וְלַגֵּר הַגָּר בְּתוֹכָם
  choice: và cho ngoại kiều cư ngụ giữa anh em
  rationale: “Ngoại kiều” chỉ người không phải dân bản địa nhưng cư trú ổn định trong cộng đồng, không phải khách qua đường; “giữa anh em” giữ lời nói trực tiếp với cộng đồng dù bản văn chuyển từ ngôi thứ ba sang ngôi thứ hai.
- source_word: תּוֹרָה אַחַת
  choice: cùng một luật lệ
  rationale: Nhấn mạnh một quy định được áp dụng như nhau cho cả hai nhóm trong bối cảnh pháp luật-nghi lễ.
- source_word: יִהְיֶה לָכֶם
  choice: sẽ áp dụng
  rationale: Lối diễn đạt pháp lý tự nhiên trong tiếng Việt, truyền đạt ý quy định ấy có hiệu lực đối với cộng đồng được nói đến.
- source_word: לָעֹשֶׂה בִּשְׁגָגָה
  choice: khi người ấy vô ý phạm lỗi
  rationale: Giữ dạng số ít khái quát của “người làm” và ý hành động do sơ suất, không cố tình; thêm “phạm lỗi” theo ngữ cảnh của các câu về hành vi sai phạm.
theological_decisions:
- issue: Phạm vi bình đẳng pháp lý giữa người bản xứ Y-sơ-ra-ên và ngoại kiều trong trường hợp hành động vô ý
  choice: Cùng một luật lệ áp dụng cho cả hai nhóm khi một người vô ý phạm lỗi.
  alternative: Có thể dịch sát hình thức hơn là “một luật pháp” hoặc “một sự chỉ dẫn” dành cho người hành động do lầm lỡ.
  rationale: Bản văn nhấn mạnh việc áp dụng bình đẳng quy định đang được nói đến, nhưng không mở rộng thành một tuyên bố thần học tổng quát vượt quá ngữ cảnh pháp luật-nghi lễ.
translation_notes:
  register: 'Tiếng Việt hiện đại, trang trọng và dễ hiểu. Câu được sắp xếp tự nhiên theo cú pháp tiếng Việt, đồng thời giữ sự chuyển đổi đại từ có thật trong bản Hê-bơ-rơ: “giữa họ” rồi “cho anh em”; bản dịch dùng “giữa anh em” theo hướng lời nói trực tiếp của toàn câu để tránh gượng, phù hợp lớp tham khảo tiếng Anh.'
