source:
  edition: WLC
  text: לְמַ֣עַן תִּזְכְּר֔וּ וַ/עֲשִׂיתֶ֖ם אֶת כָּל מִצְוֺתָ֑/י וִ/הְיִיתֶ֥ם קְדֹשִׁ֖ים לֵֽ/אלֹהֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/040.yaml
  text: so that you may remember and do all my commandments[a], and be holy to your God.
translation:
  language: vi
  text: để anh em nhớ và làm theo mọi điều răn của Ta, và nên thánh cho Đức Chúa Trời của anh em.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “được biệt riêng cho Đức Chúa Trời của anh em.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  choice: để
  rationale: Diễn đạt tự nhiên ý mục đích của mệnh đề Hê-bơ-rơ.
- source_word: תִּזְכְּרוּ
  choice: anh em nhớ
  rationale: Giữ nghĩa căn bản của זכר trong lời nói với toàn thể cộng đồng; “anh em” biểu thị ngôi thứ hai số nhiều.
- source_word: וַעֲשִׂיתֶם אֶת כָּל מִצְוֺתָי
  choice: và làm theo mọi điều răn của Ta
  rationale: עשה ở đây là thực hiện các điều răn; “làm theo” tự nhiên trong tiếng Việt và không thay bằng ý riêng của שמר. “Mọi” giữ trọn nghĩa כָּל.
- source_word: וִהְיִיתֶם
  choice: và nên
  rationale: היה với tính từ vị ngữ diễn tả trạng thái đạt được; “nên thánh” trang trọng, tự nhiên, nhưng không nhấn mạnh quá mức một tiến trình.
- source_word: קְדֹשִׁים
  choice: thánh
  rationale: Giữ đầy đủ trường nghĩa đạo đức, giao ước và nghi lễ của קדוש, thay vì thu hẹp thành chỉ “được biệt riêng”.
- source_word: לֵאלֹהֵיכֶם
  choice: cho Đức Chúa Trời của anh em
  rationale: “Cho” diễn đạt quan hệ/hướng quy về do ל đánh dấu và tự nhiên hơn “đối với” trong cụm “nên thánh”; không thêm ý sở hữu ngoài văn bản.
theological_decisions:
- issue: Ý nghĩa của ngôn ngữ về sự thánh khiết trong bối cảnh giao ước
  choice: Giữ “nên thánh” thay vì giải nghĩa hoàn toàn thành sự vâng phục về đạo đức hoặc sự biệt riêng về nghi lễ.
  alternative: được biệt riêng cho Đức Chúa Trời của anh em
  rationale: Câu này liên kết việc nhớ và làm các điều răn với địa vị/trạng thái thánh của Israel trong quan hệ với Đức Chúa Trời. “Thánh” bảo tồn sức nặng và phạm vi thần học của từ gốc.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” cho ngôi thứ hai số nhiều của cộng đồng và viết hoa “Ta” vì người phán là Đức Chúa Trời. Dấu chú thích [a] được đặt sau mệnh đề mà phương án dịch thay thế giải thích.
