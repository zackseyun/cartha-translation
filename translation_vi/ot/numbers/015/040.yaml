  source_fidelity: 'Bản dịch truyền đạt đúng cấu trúc mục đích của לְמַעַן: việc nhớ và thực hiện trọn mọi điều răn của Đức Chúa Trời hướng đến tình trạng dân sự là thánh trong tương quan với Đức Chúa Trời của họ. “Anh em” phản ánh chính xác ngôi thứ hai số nhiều; “mọi điều răn của Ta” giữ được כָּל và hậu tố sở hữu ngôi thứ nhất. “Làm theo” diễn đạt tự nhiên việc thực hành các điều răn mà không chuyển động từ עשה thành một động từ khác như ‘giữ’.'
  naturalness: Câu văn hiện đại, trang trọng và rõ nghĩa. Cụm “nên thánh cho Đức Chúa Trời của anh em” là cách diễn đạt phù hợp trong văn phong Kinh Thánh tiếng Việt, đồng thời bảo toàn tính hướng/quy thuộc trong לֵאלֹהֵיכֶם.
  terminology: “Điều răn,” “Ta,” “Đức Chúa Trời,” và “thánh” nhất quán với ngữ vực Kinh Thánh Việt ngữ. Giữ “thánh” thay vì chỉ giải nghĩa là “biệt riêng” là lựa chọn đúng, vì không thu hẹp trường nghĩa của קְדֹשִׁים. Chú thích [a] được neo đúng sau mệnh đề liên quan và nêu một phương án từ vựng hợp lệ.
