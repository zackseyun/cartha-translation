  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: דַּבֵּר֙ אֶל בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/אָמַרְתָּ֖ אֲלֵ/הֶ֑ם כִּ֣י תָבֹ֗אוּ אֶל אֶ֨רֶץ֙ מוֹשְׁבֹ֣תֵי/כֶ֔ם אֲשֶׁ֥ר אֲנִ֖י נֹתֵ֥ן לָ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/002.yaml
  text: Speak to the sons of Israel and say to them[a], ‘When you come into the land of your dwellings[b], which I am giving to you,’
translation:
  language: vi
  text: 'Hãy nói với con cái Y-sơ-ra-ên[a] và bảo họ: “Khi các ngươi vào đất, nơi các ngươi sẽ cư ngụ[b], mà Ta đang ban cho các ngươi,”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “người Y-sơ-ra-ên” hoặc “các con trai Y-sơ-ra-ên.” Nguyên văn Hê-bơ-rơ là “các con trai Y-sơ-ra-ên”; cách gọi này có thể chỉ toàn thể dân Y-sơ-ra-ên.
    reason: lexical_alternative
  - marker: b
    text: Hay “đất của các nơi cư trú của các ngươi” hoặc “đất của các khu định cư của các ngươi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר
  choice: Hãy nói với
  rationale: Động từ mệnh lệnh Piel mở đầu chỉ thị Đức Chúa Trời truyền cho Môi-se chuyển đến dân; cách dịch này giữ sắc thái trang trọng và thể hiện giới từ אֶל.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: con cái Y-sơ-ra-ên
  rationale: Giữ hình ảnh gia tộc của nguyên ngữ nhưng dùng cách nói tiếng Việt quen thuộc, có thể chỉ toàn thể cộng đồng giao ước chứ không riêng nam giới.
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: và bảo họ rằng
  rationale: Diễn đạt tự nhiên công thức mệnh lệnh nối tiếp; “rằng” dẫn trực tiếp vào lời được truyền đạt.
- source_word: כִּי
  choice: Khi
  rationale: Trong ngữ cảnh này, từ này giới thiệu hoàn cảnh chắc chắn được dự liệu cho các luật lệ tiếp theo, không chủ yếu mang nghĩa nguyên nhân.
- source_word: תָבֹאוּ
  choice: các ngươi vào
  rationale: בוא có thể là “đến” hoặc “vào”; đi với אֶל אֶרֶץ, “vào đất” tự nhiên và làm rõ hành động tiến vào lãnh thổ.
- source_word: אֶרֶץ
  choice: đất
  rationale: “Đất” là thuật ngữ giao ước quen thuộc cho lãnh thổ Đức Chúa Trời hứa ban.
- source_word: מוֹשְׁבֹתֵיכֶם
  choice: nơi các ngươi sẽ cư ngụ
  rationale: Cụm sở hữu trong tiếng Hê-bơ-rơ có thể chỉ nơi cư trú hoặc các khu định cư; cách dịch này tự nhiên trong tiếng Việt mà không xác định quá mức hình thức định cư.
- source_word: אֲשֶׁר אֲנִי נֹתֵן לָכֶם
  choice: đất mà Ta ban cho các ngươi
  rationale: Phân từ נֹתֵן trình bày việc ban đất như hành động hiện thực, chắc chắn và đang được thực hiện; hiện tại “ban” giữ được độ mở về thời-aspect.
theological_decisions:
- issue: Cách dịch בְּנֵי יִשְׂרָאֵל
  choice: con cái Y-sơ-ra-ên
  alternative: người Y-sơ-ra-ên; các con trai Y-sơ-ra-ên
  rationale: “Con cái” bảo tồn quan hệ gia tộc trong nguyên ngữ và trong tiếng Việt có thể bao gồm toàn dân; “các con trai” dễ bị hiểu là chỉ nam giới, còn “người Y-sơ-ra-ên” làm mất hình ảnh này.
- issue: Thời-aspect của lời Đức Chúa Trời ban đất trong נֹתֵן
  choice: Ta ban cho các ngươi
  alternative: Ta đang ban cho các ngươi; Ta sẽ ban cho các ngươi
  rationale: Hiện tại không đánh dấu của tiếng Việt giữ được tính đang diễn ra hoặc cận kề của phân từ, đồng thời không ép câu sang tương lai thuần túy.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ta/các ngươi” để thể hiện lời phán trực tiếp của Đức Chúa Trời với cộng đồng số nhiều. Cấu trúc câu vẫn để mở vì lời phán tiếp tục ở các câu sau.
