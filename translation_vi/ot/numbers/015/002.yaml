  source_fidelity: Bản nháp chuyển tải đúng mệnh lệnh kép, hoàn cảnh “khi các ngươi vào,” và việc Đức Chúa Trời ban đất. Tuy nhiên, “đất là nơi các ngươi sẽ cư ngụ, đất mà Ta ban...” lặp “đất” và làm cấu trúc quan hệ của tiếng Hê-bơ-rơ kém rõ. Bản sửa đặt “nơi các ngươi sẽ cư ngụ” làm mệnh đề bổ nghĩa tự nhiên cho “đất” và giữ sắc thái phân từ נֹתֵן bằng “đang ban.”
