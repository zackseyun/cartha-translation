revisions:
- from: Con phải dâng nửa hin rượu làm lễ quán, là lễ vật thiêu dâng, có hương thơm đẹp lòng Đức Giê-hô-va.
  to: Ngươi phải dâng nửa hin rượu làm lễ quán, như một lễ vật dâng bằng lửa, có hương thơm đẹp lòng Đức Giê-hô-va.
  rationale: Bản sửa chỉ điều chỉnh đại từ xưng hô và thuật ngữ tế lễ để tránh thêm nghĩa hoặc thu hẹp nghĩa. “Như một” là điều chỉnh cú pháp tiếng Việt, bảo toàn việc nguyên văn mô tả lễ quán trong công thức lễ vật dâng bằng lửa, đồng thời tránh hàm ý rượu bị thiêu như một lễ thiêu.
