source:
  edition: WLC
  text: וְ/יַ֛יִן תַּקְרִ֥יב לַ/נֶּ֖סֶךְ חֲצִ֣י הַ/הִ֑ין אִשֵּׁ֥ה רֵֽיחַ נִיחֹ֖חַ לַ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/010.yaml
  text: And you shall present wine for the drink offering[a], half a hin, an offering made by fire, a pleasing aroma to Yahweh.
translation:
  language: vi
  text: Ngươi phải dâng nửa hin rượu làm lễ quán, như một lễ vật dâng bằng lửa, có hương thơm đẹp lòng Đức Giê-hô-va.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/יַיִן
  choice: rượu
  rationale: יַיִן chỉ rượu; liên từ וְ được thể hiện tự nhiên trong mạch câu bằng sự tiếp nối của mệnh đề, không cần dịch riêng thành “và” trong tiếng Việt.
- source_word: תַּקְרִיב
  choice: con phải dâng
  rationale: Dạng Hiphil của קרב trong ngữ cảnh tế lễ có nghĩa đem đến hoặc dâng lễ vật. “Phải dâng” tự nhiên, trang trọng và giữ sắc thái chỉ thị.
- source_word: לַ/נֶּסֶךְ
  choice: làm lễ quán
  rationale: נֶסֶךְ là lễ dâng bằng chất lỏng được rưới hoặc đổ ra. “Lễ quán” là thuật ngữ Kinh Thánh tiếng Việt tương đối gọn; ngữ cảnh cùng từ “rượu” làm rõ bản chất của lễ.
- source_word: חֲצִי הַ/הִין
  choice: nửa hin
  rationale: Giữ nguyên đơn vị đo cổ “hin” thay vì quy đổi thiếu chính xác sang đơn vị hiện đại.
- source_word: אִשֵּׁה
  choice: lễ vật thiêu dâng
  rationale: אִשֵּׁה là thuật ngữ tế lễ có liên hệ với lửa, thường chỉ lễ vật được dâng bằng cách thiêu. “Lễ vật thiêu dâng” truyền đạt ý này mà không đồng nhất nó với một loại tế lễ riêng như “lễ thiêu”.
- source_word: רֵיחַ נִיחֹחַ
  choice: có hương thơm đẹp lòng
  rationale: Cụm cố định này diễn tả lễ vật được Đức Chúa Trời vui nhận; cách dịch giữ hình ảnh mùi hương đồng thời tự nhiên trong tiếng Việt.
- source_word: לַ/יהוָה
  choice: Đức Giê-hô-va
  rationale: Danh riêng יהוה được phiên âm là “Đức Giê-hô-va”, có thêm kính ngữ “Đức” theo văn phong Kinh Thánh tiếng Việt; giới từ được thể hiện trong quan hệ “đẹp lòng”.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Đức Giê-hô-va
  alternative: Yahweh
  rationale: Dùng dạng phiên âm quen thuộc và trang trọng trong tiếng Việt, thay vì thay danh riêng bằng tước hiệu “CHÚA”.
- issue: Ý nghĩa của אִשֵּׁה
  choice: lễ vật thiêu dâng
  alternative: lễ vật dâng bằng lửa; lễ vật thức ăn
  rationale: Giữ liên hệ từ nguyên và nghi lễ với lửa mà không giải quyết quá mức phạm vi nghĩa bằng “lễ vật thức ăn”; cũng tránh dùng “lễ thiêu”, vốn có thể bị hiểu là tên riêng của một loại tế lễ khác.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ đơn vị cổ “hin” và thuật ngữ tế lễ “lễ quán”; cấu trúc câu được điều chỉnh theo tiếng Việt tự nhiên nhưng vẫn bảo toàn các thành phần của nguyên văn.
