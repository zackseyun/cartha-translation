  - severity: medium
    issue: “Lễ vật thiêu dâng” có thể bị hiểu là tên hoặc ý niệm của lễ thiêu.
    rationale: אִשֶּׁה liên hệ đến việc dâng bằng lửa, nhưng trong công thức này không nên được đồng nhất với loại lễ tế riêng là “lễ thiêu”. “Lễ vật dâng bằng lửa” giữ được phạm vi thuật ngữ tốt hơn.
  revised_text: Ngươi phải dâng nửa hin rượu làm lễ quán, như một lễ vật dâng bằng lửa, có hương thơm đẹp lòng Đức Giê-hô-va.
