id: NUM.15.35
reference: Numbers 15:35
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה מ֥וֹת יוּמַ֖ת הָ/אִ֑ישׁ רָג֨וֹם אֹת֤/וֹ בָֽ/אֲבָנִים֙ כָּל הָ֣/עֵדָ֔ה מִ/ח֖וּץ לַֽ/מַּחֲנֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/035.yaml
  text: Then Yahweh said to Moses[a], “The man must surely be put to death[b]; the whole congregation shall stone him with stones outside the camp.”
translation:
  language: vi
  text: 'Bấy giờ, Yahweh phán với Môi-se: “Người này nhất định phải bị xử tử[a]; toàn thể hội chúng phải lấy đá ném người ấy[b] ở bên ngoài trại.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nói sát hình thức tiếng Hê-bơ-rơ: “ắt phải bị xử tử.”'
    reason: lexical_alternative
  - marker: b
    text: 'Tiếng Hê-bơ-rơ nói sát chữ: “ném đá người ấy bằng đá,” một cách diễn đạt pháp lý chỉ việc hành quyết bằng ném đá.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Bấy giờ, ... phán
  rationale: Dạng kể chuyện với waw liên tiếp đưa trình thuật tiến sang hành động kế tiếp. “Bấy giờ” diễn đạt tự nhiên trình tự ấy; “phán” phù hợp với lời Đức Chúa Trời nói trong văn phong Kinh Thánh trang trọng.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ nguyên danh riêng giao ước được biểu thị bằng bốn phụ âm YHWH, thay vì thay bằng một tước hiệu.
- source_word: מוֹת יוּמַת
  choice: nhất định phải bị xử tử
  rationale: Cấu trúc nguyên thể tuyệt đối đi với động từ hữu hạn nhấn mạnh tính chắc chắn và bắt buộc của án tử hình; cách dịch này cũng giữ thể bị động của tiếng Hê-bơ-rơ.
- source_word: הָאִישׁ
  choice: người này
  rationale: Danh từ xác định chỉ người đàn ông phạm tội đã được nói đến trong ngữ cảnh trước. “Người này” tự nhiên trong lời tuyên án và không thêm ý xa cách hay khinh miệt.
- source_word: רָגוֹם אֹתוֹ בָאֲבָנִים
  choice: phải lấy đá ném người ấy
  rationale: Diễn đạt tự nhiên bằng tiếng Việt hành động hành quyết bằng ném đá, đồng thời giữ hình ảnh cụ thể “bằng đá” của nguyên văn.
- source_word: כָּל הָעֵדָה
  choice: toàn thể hội chúng
  rationale: עֵדָה chỉ cộng đồng giao ước được tập hợp với tư cách tập thể; “hội chúng” giữ sắc thái cộng đồng và pháp lý.
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: ở bên ngoài trại
  rationale: Cụm giới từ chỉ địa điểm tiến hành việc hành quyết, được diễn đạt tự nhiên và chính xác trong tiếng Việt.
theological_decisions:
- issue: Cách dịch danh Đức Chúa Trời יְהוָה
  choice: Yahweh
  alternative: ĐỨC CHÚA; Giê-hô-va
  rationale: Nguyên văn dùng trực tiếp danh YHWH. Giữ “Yahweh” bảo tồn tư cách danh riêng, không thay nó bằng tước hiệu và không áp đặt một truyền thống phát âm tiếng Việt khác.
- issue: Mức độ nhấn mạnh của án tử hình
  choice: nhất định phải bị xử tử
  alternative: phải bị xử tử; phải chết
  rationale: Cụm מוֹת יוּמַת có cấu trúc nhấn mạnh và ở thể bị động. Bản dịch giữ cả tính bắt buộc, chắc chắn lẫn hình thức thi hành án, nhưng không giải thích thêm lý do thần học ngoài câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “hội chúng” để giữ sắc thái cộng đồng chính thức, “trại” cho bối cảnh dân Israel trong hoang mạc, và tránh các từ cổ như “ắt hẳn” trong chính văn. Các dấu chú thích được đặt ngay sau cụm từ mà chúng giải thích.
