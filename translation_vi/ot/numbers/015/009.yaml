  text: then he shall present with the bull a grain offering of fine flour[a], three-tenths of an ephah, mixed with half a hin of oil.
translation:
  language: vi
  text: 'thì phải dâng cùng với con bò đực một lễ vật ngũ cốc: ba phần mười ê-pha[a] bột mịn, trộn với nửa hin dầu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn là “ba phần mười”; trong bối cảnh tế lễ này, đơn vị được hiểu là ba phần mười ê-pha.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרִיב
  choice: thì phải dâng
  rationale: Động từ Hiphil của קרב trong bối cảnh tế lễ có nghĩa là đem đến hoặc dâng; liên từ וְ diễn tả bước tiếp theo trong trình tự chỉ dẫn.
- source_word: עַל
  choice: cùng với
  rationale: Trong chỉ dẫn tế lễ này, giới từ diễn tả lễ vật đi kèm con vật hiến tế, không mang nghĩa vị trí là “ở trên”.
- source_word: בֶּן הַבָּקָר
  choice: con bò đực
  rationale: Cụm từ theo nghĩa đen là “con của đàn bò,” một thành ngữ chỉ bò dùng làm sinh tế; ngữ cảnh trước xác định đây là bò đực.
- source_word: מִנְחָה
  choice: một lễ vật ngũ cốc
  rationale: Trong luật tế lễ của sách Dân Số, từ này chỉ lễ vật làm từ sản phẩm ngũ cốc, chứ không chỉ một lễ vật nói chung.
- source_word: סֹלֶת
  choice: bột mịn
  rationale: Chỉ loại bột đã được tinh chế dùng trong tế lễ; cách dịch này chính xác và tự nhiên trong tiếng Việt hiện đại.
- source_word: שְׁלֹשָׁה עֶשְׂרֹנִים
  choice: ba phần mười ê-pha
  rationale: Nguyên văn chỉ nói “ba phần mười”; trong hệ thống định lượng tế lễ, đơn vị được hiểu là ê-pha. Đưa đơn vị vào câu giúp người đọc hiểu nhưng chú thích vẫn ghi rõ tính hàm ẩn của nguyên văn.
- source_word: בָּלוּל בַּשֶּׁמֶן
  choice: trộn với ... dầu
  rationale: Phân từ bị động cùng giới từ chỉ bột được hòa trộn bằng dầu; đây là cách nói tự nhiên trong tiếng Việt.
- source_word: חֲצִי הַהִין
  choice: nửa hin
  rationale: Giữ nguyên tên đơn vị đo chất lỏng cổ, tránh quy đổi mang tính phỏng đoán.
theological_decisions: []
translation_notes:
  register: Văn phong trang trọng, rõ ràng và có tính chỉ dẫn. Dùng “lễ vật ngũ cốc” để phân biệt מִנְחָה với sinh tế; giữ các đơn vị cổ “ê-pha” và “hin” nhằm bảo toàn nét đặc thù của bản nguồn.
