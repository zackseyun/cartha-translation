    issue: Danh יהוה được dịch là «Đức Giê-hô-va» thay vì «Yahweh».
    rationale: Nguồn ghi Tetragrammaton יהוה, và quyết định thuật ngữ POB quy định phiên âm danh này là «Yahweh», không dùng dạng «Giê-hô-va» hay thay bằng tước hiệu. «Đức» cũng là yếu tố bổ sung không được biểu thị trong văn bản nguồn.
