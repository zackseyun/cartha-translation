  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: vi
  text: 'Yahweh[a] phán với Môi-se rằng:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ: «YHWH»; theo truyền thống thường được dịch là «CHÚA».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: phán
  rationale: Trong công thức dẫn lời khi Đức Chúa Trời truyền phán, động từ דבר được dịch tự nhiên và trang trọng là “phán”; וַ־ đánh dấu bước tiếp theo trong mạch kể.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng cách gọi quen thuộc trong tiếng Việt để thể hiện trực tiếp danh riêng YHWH, thay vì thay bằng một tước hiệu.
- source_word: אֶל־מֹשֶׁה
  choice: với Môi-se
  rationale: Trong kết cấu chỉ hành động nói với một người, אֶל được diễn đạt tự nhiên bằng “với”; מֹשֶׁה theo dạng tên riêng quen dùng trong tiếng Việt là “Môi-se”.
- source_word: לֵאמֹר
  choice: rằng
  rationale: Phân từ nguyên mẫu này dẫn vào nội dung lời phán ở câu kế tiếp; “rằng” là cách diễn đạt gọn và tự nhiên trong tiếng Việt hiện đại.
theological_decisions:
- issue: Cách thể hiện danh יהוה
  choice: Đức Giê-hô-va
  alternative: Yahweh; CHÚA
  rationale: Bản nguồn ghi trực tiếp danh riêng gồm bốn phụ âm YHWH. “Đức Giê-hô-va” giữ chức năng danh riêng và là dạng quen thuộc với độc giả Việt; không thay danh ấy bằng tước hiệu “CHÚA”.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ công thức dẫn lời Kinh Thánh quen thuộc, đồng thời dùng dấu hai chấm để báo trước nội dung lời phán ở câu sau.
