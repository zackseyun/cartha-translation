source:
  edition: WLC
  text: וְ/הָיָ֗ה אִ֣ם מֵ/עֵינֵ֣י הָ/עֵדָה֮ נֶעֶשְׂתָ֣ה לִ/שְׁגָגָה֒ וְ/עָשׂ֣וּ כָל הָ/עֵדָ֡ה פַּ֣ר בֶּן בָּקָר֩ אֶחָ֨ד לְ/עֹלָ֜ה לְ/רֵ֤יחַ נִיחֹ֨חַ֙ לַֽ/יהוָ֔ה וּ/מִנְחָת֥/וֹ וְ/נִסְכּ֖/וֹ כַּ/מִּשְׁפָּ֑ט וּ/שְׂעִיר עִזִּ֥ים אֶחָ֖ד לְ/חַטָּֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/024.yaml
  text: then[a], if it was done unintentionally and escaped the notice of the congregation, all the congregation shall offer one bull from the herd for a burnt offering, for a pleasing aroma to Yahweh, with its grain offering and its drink offering, according to the ordinance, and one male goat for a sin offering.
translation:
  language: vi
  text: Nếu một việc được làm do vô ý mà cộng đồng không hay biết, thì toàn thể cộng đồng phải dâng một con bò đực trong đàn làm lễ thiêu, có hương thơm đẹp lòng Yahweh, kèm theo lễ vật ngũ cốc và lễ quán của nó theo quy định, cùng một con dê đực làm lễ chuộc tội.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “lễ thanh tẩy.” Từ Hê-bơ-rơ חַטָּאת có thể chỉ lễ vật liên quan đến tội và tác dụng thanh tẩy theo nghi lễ.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵעֵינֵי הָעֵדָה
  choice: cộng đồng không hay biết
  rationale: Thành ngữ theo nghĩa đen là “khỏi mắt cộng đồng,” nhưng trong ngữ cảnh chỉ việc cộng đồng không nhận thấy; cách dịch này tự nhiên và giữ đúng ý.
- source_word: נֶעֶשְׂתָה לִשְׁגָגָה
  choice: việc ấy do vô ý
  rationale: שְׁגָגָה chỉ sai phạm không chủ ý, đối lập với hành vi cố tình trong mạch văn.
- source_word: כָל הָעֵדָה
  choice: toàn thể cộng đồng
  rationale: עֵדָה chỉ cộng đồng giao ước; “toàn thể” thể hiện כָל.
- source_word: פַּר בֶּן בָּקָר אֶחָד
  choice: một con bò đực từ đàn bò
  rationale: Giữ rõ loại và giới tính của sinh vật hiến tế mà không dịch máy móc cấu trúc Hê-bơ-rơ.
- source_word: לְעֹלָה
  choice: làm lễ thiêu
  rationale: עֹלָה là thuật ngữ hiến tế cố định, chỉ lễ vật được thiêu dâng.
- source_word: לְרֵיחַ נִיחֹחַ
  choice: tạo hương thơm đẹp lòng
  rationale: Giữ hình ảnh tế tự và hàm ý lễ vật được Đức Chúa Trời vui nhận.
- source_word: לַיהוָה
  choice: Yahweh
  rationale: Phiên âm danh giao ước יהוה, phù hợp dữ liệu tư vấn đã cập nhật.
- source_word: וּמִנְחָתוֹ
  choice: cùng với lễ vật ngũ cốc ... của nó
  rationale: מִנְחָה trong ngữ cảnh tế lễ là lễ vật bằng ngũ cốc đi kèm; hậu tố số ít quy chiếu về con bò/lễ thiêu.
- source_word: וְנִסְכּוֹ
  choice: lễ quán của nó
  rationale: נֶסֶךְ là rượu/chất lỏng được rưới dâng; “lễ quán” là thuật ngữ tiếng Việt ngắn gọn và chính xác.
- source_word: כַּמִּשְׁפָּט
  choice: theo quy định
  rationale: Ở đây מִשְׁפָּט chỉ thể thức tế lễ đã được ấn định.
- source_word: וּשְׂעִיר עִזִּים אֶחָד
  choice: một con dê đực
  rationale: שְׂעִיר עִזִּים xác định rõ dê giống đực.
- source_word: לְחַטָּאת
  choice: làm lễ chuộc tội
  rationale: Đây là cách gọi quen thuộc, dễ hiểu của lễ חַטָּאת, đồng thời ghi chú bảo lưu sắc thái thanh tẩy.
theological_decisions:
- issue: Ý nghĩa của חַטָּאת trong nghi lễ tế lễ
  choice: lễ chuộc tội
  alternative: lễ thanh tẩy
  rationale: Thuật ngữ có thể nhấn mạnh mối liên hệ với tội hoặc hiệu lực thanh tẩy của nghi lễ. Bản văn chính dùng cách gọi quen thuộc; chú thích giữ lại phương án có cơ sở từ ngữ và nghi lễ.
- issue: Cách thể hiện danh יהוה
  choice: Yahweh
  alternative: CHÚA
  rationale: Dùng danh riêng Yahweh để thể hiện trực tiếp danh giao ước trong nguyên văn, không biến nó thành một tước hiệu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng thuật ngữ tế lễ nhất quán; “lễ quán” có sắc thái Kinh Thánh nhưng vẫn gọn và chính xác. Marker [a] đặt ngay sau thuật ngữ được chú thích.
