  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/הִקְרִ֛יב הַ/מַּקְרִ֥יב קָרְבָּנ֖/וֹ לַֽ/יהוָ֑ה מִנְחָה֙ סֹ֣לֶת עִשָּׂר֔וֹן בָּל֕וּל בִּ/רְבִעִ֥ית הַ/הִ֖ין שָֽׁמֶן׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/004.yaml
  text: then the one who presents his offering to Yahweh shall present a grain offering of fine flour[a], a tenth of an ephah, mixed with a fourth of a hin of oil.
translation:
  language: vi
  text: thì người đem lễ vật của mình đến dâng cho Yahweh phải dâng một lễ vật ngũ cốc gồm một phần mười ê-pha bột mịn[a], trộn với một phần tư hin dầu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ: “một phần mười”; trong bối cảnh tế lễ này, đó là một phần mười ê-pha.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרִיב
  choice: thì ... phải dâng
  rationale: Liên từ וְ cùng động từ ở thể hoàn thành tiếp nối trình tự luật lệ từ câu trước; “thì” diễn đạt tự nhiên quan hệ thủ tục, còn “phải dâng” giữ sắc thái quy định của văn bản tế lễ.
- source_word: הַמַּקְרִיב
  choice: người dâng
  rationale: Phân từ Hiphil chỉ người thực hiện việc dâng lễ; cách diễn đạt này gọn, tự nhiên và không quá chuyên môn.
- source_word: קָרְבָּנוֹ
  choice: lễ vật của mình
  rationale: קָרְבָּן là vật được đem đến dâng cho Đức Chúa Trời; “lễ vật” phù hợp ngữ cảnh tế lễ, còn “của mình” quy chiếu tự nhiên về chủ thể.
- source_word: לַיהוָה
  choice: lên Yahweh
  rationale: Giữ danh giao ước יהוה dưới dạng “Yahweh”. Với động từ “dâng”, “lên” là cách kết hợp tự nhiên trong tiếng Việt để diễn tả lễ vật hướng đến Đức Chúa Trời.
- source_word: מִנְחָה
  choice: một lễ phẩm
  rationale: Trong luật tế lễ, מִנְחָה là lễ vật không có máu, thường làm bằng bột. “Lễ phẩm” vừa tự nhiên vừa tránh thêm chữ “ngũ cốc” vốn không được nêu trực tiếp trong từ này tại câu.
- source_word: סֹלֶת
  choice: bằng bột mịn
  rationale: סֹלֶת chỉ loại bột chất lượng cao được xay mịn dùng trong tế lễ; “bột mịn” rõ ràng và sát nghĩa.
- source_word: עִשָּׂרוֹן
  choice: một phần mười ê-pha
  rationale: Từ Hê-bơ-rơ nói theo nghĩa đen là “một phần mười”, nhưng trong hệ thống đo lường tế lễ đây là một phần mười ê-pha. Đơn vị được bổ sung trong bản văn để người đọc hiểu lượng đo, đồng thời có chú thích minh bạch.
- source_word: בָּלוּל
  choice: trộn
  rationale: Phân từ bị động mô tả bột đã được hòa trộn với dầu; tiếng Việt tự nhiên có thể dùng cấu trúc rút gọn “trộn với”.
- source_word: בִּרְבִעִית הַהִין
  choice: với một phần tư hin
  rationale: Dịch trực tiếp lượng đo và giữ nguyên đơn vị văn hóa cổ “hin” thay vì quy đổi thiếu chắc chắn.
- source_word: שָׁמֶן
  choice: dầu
  rationale: Nguyên văn chỉ nói “dầu”; không thêm “ô-liu”, dù dầu ô-liu có thể được ngầm hiểu trong bối cảnh.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Nguyên văn dùng trực tiếp danh giao ước יהוה. Phiên âm “Yahweh” bảo tồn tính chất danh riêng, không thay bằng tước hiệu và không áp đặt một cách đọc hệ phái.
- issue: Ý nghĩa của מִנְחָה trong bối cảnh tế lễ
  choice: lễ phẩm
  alternative: lễ vật ngũ cốc
  rationale: Bối cảnh và thành phần bột xác định đây là lễ phẩm không có máu thường được gọi là lễ vật ngũ cốc. Tuy vậy, “lễ phẩm” tránh khiến người đọc tưởng từ Hê-bơ-rơ tự nó nêu rõ “ngũ cốc”, đồng thời câu vẫn nói rõ vật liệu là bột mịn.
translation_notes:
  register: Văn phong luật lệ trang trọng nhưng hiện đại, dễ hiểu. Giữ các đơn vị cổ “ê-pha” và “hin”; không quy đổi sang đơn vị hiện đại. Dùng “Yahweh” nhất quán như một danh riêng.
