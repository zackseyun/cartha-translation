  rationale: Đổi “lên Yahweh” thành “cho Yahweh” để tiếng Việt tự nhiên hơn, và đổi “lễ phẩm” thành “lễ vật ngũ cốc” để phản ánh chính xác hơn מִנְחָה trong quy định tế lễ. Cấu trúc “gồm ... bột mịn” giữ liên hệ cú pháp giữa lễ vật ngũ cốc, lượng bột và dầu mà không thêm chi tiết ngoài nguyên văn.
