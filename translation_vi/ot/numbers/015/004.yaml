  source_fidelity: 'Bản dịch phản ánh đúng trình tự quy định và các thành phần chính của nguyên văn: người dâng lễ vật cho Yahweh phải dâng thêm một minḥah gồm bột mịn, một phần mười ê-pha, pha với một phần tư hin dầu. Tuy nhiên, “lễ phẩm” chưa chuyển tải rõ nghĩa tế lễ-ngũ cốc của מִנְחָה trong ngữ cảnh này.'
