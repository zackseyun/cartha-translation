  text: דַּבֵּ֞ר אֶל בְּנֵ֤י יִשְׂרָאֵל֙ וְ/אָמַרְתָּ֣ אֲלֵ/הֶ֔ם וְ/עָשׂ֨וּ לָ/הֶ֥ם צִיצִ֛ת עַל כַּנְפֵ֥י בִגְדֵי/הֶ֖ם לְ/דֹרֹתָ֑/ם וְ/נָֽתְנ֛וּ עַל צִיצִ֥ת הַ/כָּנָ֖ף פְּתִ֥יל תְּכֵֽלֶת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/038.yaml
  text: Speak to the sons of Israel and tell them to make tassels for themselves on the corners of their garments throughout their generations[b][a], and to put a cord of blue on the tassel of each corner.
translation:
  language: vi
  text: Hãy nói với con cái Y-sơ-ra-ên và bảo họ, qua mọi thế hệ, làm cho mình những tua rua[a] trên các góc áo; họ phải gắn một sợi dây màu xanh[b] vào tua rua ở mỗi góc áo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch là “viền tua” (tiếng Hê-bơ-rơ: צִיצִת).'
    reason: lexical_alternative
  - marker: b
    text: Từ Hê-bơ-rơ תְּכֵלֶת chỉ màu hoặc thuốc nhuộm xanh đến xanh tím, được dùng trong các vật liệu thánh của Y-sơ-ra-ên.
    reason: cultural_note
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: con cái Y-sơ-ra-ên
  rationale: Giữ hình ảnh thân tộc của nguyên văn, đồng thời dùng cách diễn đạt trang trọng và quen thuộc trong tiếng Việt.
- source_word: וְעָשׂוּ לָהֶם
  choice: làm cho mình
  rationale: 'Bảo toàn đại từ chỉ lợi ích לָהֶם: chính người Y-sơ-ra-ên làm các tua rua để dùng trên áo của họ.'
- source_word: צִיצִת
  choice: tua rua
  rationale: Chỉ phần gồm những sợi thả xuống được gắn vào áo; tự nhiên và dễ hình dung trong tiếng Việt hiện đại.
- source_word: עַל כַּנְפֵי בִגְדֵיהֶם
  choice: nơi các góc áo
  rationale: כָּנָף nghĩa đen là 'cánh', nhưng khi nói về áo thì chỉ phần mép hay góc; 'góc áo' phù hợp nhất với ngữ cảnh.
- source_word: לְדֹרֹתָם
  choice: trải qua các thế hệ
  rationale: Diễn tả hiệu lực tiếp nối qua nhiều thế hệ, vừa sát nghĩa vừa tự nhiên.
- source_word: עַל צִיצִת הַכָּנָף
  choice: trên tua rua ở mỗi góc
  rationale: Danh từ số ít trong ngữ cảnh có nghĩa phân phối; 'mỗi góc' làm rõ rằng tua rua tại từng góc đều mang sợi dây này.
- source_word: פְּתִיל
  choice: một sợi dây
  rationale: פְּתִיל chỉ sợi được se hoặc bện; 'sợi dây' dễ hiểu hơn 'sợi chỉ' mà vẫn không hàm ý một dây lớn.
- source_word: תְּכֵלֶת
  choice: màu xanh
  rationale: Đây là tên một màu hoặc thuốc nhuộm xanh đến xanh tím dùng trong các vật liệu thánh; 'màu xanh' là cách dịch rõ và phổ thông, còn sắc độ được nêu trong chú thích.
theological_decisions: []
translation_notes:
  register: Văn phong mệnh lệnh trang trọng nhưng dễ hiểu. Dùng “con cái Y-sơ-ra-ên” để giữ hình ảnh thân tộc của nguyên văn; “tua rua” và “góc áo” là những từ thông dụng, cụ thể. Hai dấu chú thích được đặt ngay sau các từ ngữ liên quan.
