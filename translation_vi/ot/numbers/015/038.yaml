revisions:
- from: Hãy nói với con cái Y-sơ-ra-ên và bảo họ làm cho mình những tua rua[a] nơi các góc áo, trải qua các thế hệ; trên tua rua ở mỗi góc, họ phải gắn một sợi dây màu xanh[b].
  to: Hãy nói với con cái Y-sơ-ra-ên và bảo họ, qua mọi thế hệ, làm cho mình những tua rua[a] trên các góc áo; họ phải gắn một sợi dây màu xanh[b] vào tua rua ở mỗi góc áo.
  rationale: Chỉnh vị trí và cách diễn đạt của לְדֹרֹתָם để làm rõ rằng quy định này được thực hiện qua các thế hệ, đồng thời giữ nguyên mọi yếu tố ngữ nghĩa của câu. Điều chỉnh chú thích a sang một phương án từ vựng tự nhiên hơn. Các dấu chú thích vẫn được neo đúng tại צִיצִת và תְּכֵלֶת.
  reviewer_model: gpt-5.6-terra
