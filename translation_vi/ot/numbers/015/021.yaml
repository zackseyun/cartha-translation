- from: Từ phần đầu tiên của bột nhào, anh em phải dâng cho Yahweh một phần đóng góp[a], qua mọi thế hệ của anh em.
  to: Từ phần đầu của bột nhào[a], anh em phải dâng cho Yahweh một phần trích dâng[b], qua mọi thế hệ của anh em.
