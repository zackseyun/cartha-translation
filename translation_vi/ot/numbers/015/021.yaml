  verdict: revise
  source_fidelity: 'Bản nháp chuyển tải đúng các thành tố chính: phần đầu lấy từ bột nhào, mệnh lệnh dâng cho Yahweh, và hiệu lực xuyên các thế hệ. Tuy nhiên, cần giữ lại trong chú thích khả năng từ עֲרִסָה chỉ dụng cụ nhào bột, vì đây là một khả năng từ vựng có thật của nguyên ngữ; không nên loại bỏ chỉ vì nghĩa “bột nhào” phù hợp hơn trong ngữ cảnh.'
