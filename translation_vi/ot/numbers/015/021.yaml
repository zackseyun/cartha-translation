base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/021.yaml
  text: From the first of your dough you shall give to Yahweh a contribution throughout your generations[a][b].
translation:
  language: vi
  text: Từ phần đầu của bột nhào[a], anh em phải dâng cho Yahweh một phần trích dâng[b], qua mọi thế hệ của anh em.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “máng nhào bột” hay “tô nhào bột”; từ Hê-bơ-rơ có thể chỉ bột nhào hoặc, theo liên hệ, dụng cụ dùng để nhào bột.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch là “một lễ vật”; theo cách dịch truyền thống: “một lễ vật dâng giơ lên.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵרֵאשִׁית
  choice: Từ phần đầu tiên của
  rationale: 'Giữ nghĩa phân chia của רֵאשִׁית: phần đầu được lấy ra từ toàn khối bột, chứ không phải một thời điểm khởi đầu trừu tượng.'
- source_word: עֲרִסֹתֵיכֶם
  choice: bột nhào
  rationale: עֲרִסָה có thể chỉ bột hoặc vật dụng nhào bột theo lối hoán dụ; trong ngữ cảnh lấy một phần để dâng, chất bột là nghĩa phù hợp trực tiếp hơn.
- source_word: תִּתְּנוּ
  choice: phải dâng
  rationale: נתן cơ bản là 'cho'; trong ngữ cảnh nghi lễ, 'dâng' diễn đạt tự nhiên đối tượng tiếp nhận là Đức Chúa Trời, đồng thời thể hiện lực mệnh lệnh của dạng vị lai chỉ thị.
- source_word: לַיהוָה
  choice: cho Yahweh
  rationale: Phiên âm danh giao ước יהוה là 'Yahweh', phù hợp trực tiếp với văn bản nguồn và lớp tham khảo tiếng Anh đã được cập nhật.
- source_word: תְּרוּמָה
  choice: một phần đóng góp
  rationale: תְּרוּמָה là phần được tách riêng để dâng; 'phần đóng góp' rõ nghĩa trong tiếng Việt hiện đại và tránh thuật ngữ kỹ thuật cổ, nhưng cần chú thích khả năng dịch rộng hơn.
- source_word: לְדֹרֹתֵיכֶם
  choice: qua mọi thế hệ của anh em
  rationale: Diễn đạt nghĩa vụ tiếp diễn qua các thế hệ kế tiếp bằng tiếng Việt tự nhiên.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Giữ danh riêng giao ước có trong nguyên văn, không thay bằng một tước hiệu; 'Yahweh' cũng phù hợp với quyết định thần học cập nhật của lớp tham khảo.
- issue: Tính chất của תְּרוּמָה
  choice: một phần đóng góp
  alternative: một lễ vật / lễ vật dâng giơ lên
  rationale: Không diễn giải quá mức phương thức nghi lễ; bản chính giữ nghĩa phần được tách ra để dâng, còn chú thích bảo tồn các cách hiểu truyền thống và rộng hơn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và trực tiếp. Dùng “anh em” cho ngôi thứ hai số nhiều nhằm biểu đạt cộng đồng được truyền lệnh; tránh từ ngữ nghi lễ quá cổ. Không đưa phương án “thúng/máng nhào bột” vào chú thích vì trong câu này giới từ מִן đòi hỏi hợp lý hơn một phần lấy từ bột, và câu trước đã xác định rõ vật được dâng là bánh từ bột nhào.
