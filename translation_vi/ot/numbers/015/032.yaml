  text: וַ/יִּהְי֥וּ בְנֵֽי יִשְׂרָאֵ֖ל בַּ/מִּדְבָּ֑ר וַֽ/יִּמְצְא֗וּ אִ֛ישׁ מְקֹשֵׁ֥שׁ עֵצִ֖ים בְּ/י֥וֹם הַ/שַּׁבָּֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/032.yaml
  text: While the sons of Israel were in the wilderness[a], they found a man gathering wood on the Sabbath day.
translation:
  language: vi
  text: Khi dân Israel đang ở trong hoang mạc, họ bắt gặp một người đàn ông đang nhặt củi[a] vào ngày Sa-bát.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: nhặt que.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: đang ở
  rationale: Động từ היה trong mạch kể chuyện dùng để dựng bối cảnh; “đang ở” kết hợp với “khi” diễn đạt tự nhiên hoàn cảnh đang tiếp diễn.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: con dân Israel
  rationale: Cách gọi này giữ được sắc thái con cháu thuộc về Israel của thành ngữ Hê-bơ-rơ, đồng thời tự nhiên và chỉ toàn thể cộng đồng trong tiếng Việt hiện đại.
- source_word: בַּמִּדְבָּר
  choice: trong hoang mạc
  rationale: מִדְבָּר chỉ vùng hoang vu nơi Israel lưu lạc; “hoang mạc” không thu hẹp hình ảnh thành một sa mạc toàn cát.
- source_word: וַיִּמְצְאוּ
  choice: họ bắt gặp
  rationale: Trong ngữ cảnh thuật chuyện, “bắt gặp” diễn đạt việc họ phát hiện người ấy đang thực hiện hành động, tự nhiên hơn cách hiểu đơn thuần là tìm thấy.
- source_word: אִישׁ
  choice: một người đàn ông
  rationale: Danh từ số ít ở đây chỉ rõ một cá nhân nam.
- source_word: מְקֹשֵׁשׁ עֵצִים
  choice: đang nhặt củi
  rationale: Phân từ מְקֹשֵׁשׁ diễn tả hành động đang diễn ra; עֵצִים trong kết hợp này có thể là củi hoặc các cành cây, nên giữ phương án kia trong chú thích.
- source_word: בְּיוֹם הַשַּׁבָּת
  choice: trong ngày Sa-bát
  rationale: Giữ rõ danh từ יוֹם (“ngày”) và dùng thuật ngữ Sa-bát quen thuộc trong tiếng Việt.
theological_decisions:
- issue: Cách gọi dân giao ước בְנֵי יִשְׂרָאֵל
  choice: con dân Israel
  alternative: dân Israel; các con trai Israel
  rationale: “Con dân Israel” phản ánh nguồn gốc thành ngữ mà không khiến độc giả hiểu sai rằng câu chỉ nói đến nam giới; câu không thêm một diễn giải giáo phái nào.
- issue: Thuật ngữ ngày Sa-bát
  choice: ngày Sa-bát
  alternative: ngày nghỉ; Sa-bát
  rationale: Giữ nguyên tên gọi có tính giao ước và giữ cả yếu tố “ngày” trong nguyên văn, không thêm lời giải thích thần học về luật Sa-bát.
translation_notes:
  register: Văn phong thuật sự trang trọng nhưng hiện đại. “Bắt gặp” và “nhặt củi” là cách nói thông dụng, rõ hành động; “hoang mạc” và “ngày Sa-bát” duy trì sắc thái Kinh Thánh mà vẫn dễ hiểu. Dấu chú thích [a] được đặt ngay sau từ có phương án dịch khác.
