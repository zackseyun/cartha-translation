  text: תּוֹרָ֥ה אַחַ֛ת וּ/מִשְׁפָּ֥ט אֶחָ֖ד יִהְיֶ֣ה לָ/כֶ֑ם וְ/לַ/גֵּ֖ר הַ/גָּ֥ר אִתְּ/כֶֽם׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/016.yaml
  text: One law and one ordinance shall be for you and for the sojourner who sojourns with you[a].
translation:
  language: vi
  text: Một luật pháp và một quy định sẽ áp dụng cho anh em và cho ngoại kiều cư ngụ với anh em.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “người nước ngoài thường trú”. Từ Hê-bơ-rơ גֵּר chỉ người không phải bản địa nhưng sống giữa dân Y-sơ-ra-ên dưới trật tự cộng đồng của họ.
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹרָה
  choice: luật pháp
  rationale: Trong văn cảnh pháp lý này, từ này chỉ chỉ thị có tính ràng buộc; “luật pháp” tự nhiên và trang trọng hơn “sự chỉ dạy”, đồng thời vẫn phân biệt được với מִשְׁפָּט.
- source_word: מִשְׁפָּט
  choice: quy định
  rationale: Từ này chỉ một chuẩn mực hay điều lệ pháp lý. “Quy định” truyền đạt rõ ý nghĩa pháp lý mà không khiến độc giả hiện đại hiểu thành phán quyết của tòa án.
- source_word: אַחַת / אֶחָד
  choice: một
  rationale: Giữ nguyên sự lặp lại của số từ trong tiếng Hê-bơ-rơ, nhấn mạnh chỉ có một chuẩn mực chung, thay vì diễn giải thành “giống nhau” hoặc “cùng một”.
- source_word: יִהְיֶה
  choice: sẽ áp dụng
  rationale: Thể chưa hoàn thành ở đây mang sắc thái quy phạm. “Sẽ áp dụng” diễn đạt tự nhiên bằng tiếng Việt rằng luật và quy định có hiệu lực đối với cả hai nhóm.
- source_word: גֵּר
  choice: ngoại kiều
  rationale: Chỉ người không phải bản địa nhưng đang cư trú giữa cộng đồng Y-sơ-ra-ên và sống dưới trật tự cộng đồng ấy. “Ngoại kiều” ngắn gọn, có sắc thái cư trú và không đồng nhất họ với người chỉ tạm ghé qua.
- source_word: הַגָּר
  choice: cư ngụ
  rationale: Diễn đạt phân từ chỉ tình trạng cư trú kéo dài. Tiếng Việt khó giữ tự nhiên phép lặp cùng gốc như tiếng Hê-bơ-rơ, nên dùng “ngoại kiều cư ngụ” để bảo toàn ý nghĩa.
- source_word: אִתְּכֶם
  choice: với anh em
  rationale: Theo sát nghĩa trực tiếp của giới từ “với”; cách nói này vẫn tự nhiên và cho thấy người ngoại kiều đang sống cùng cộng đồng.
theological_decisions:
- issue: Sự bình đẳng pháp lý giữa Y-sơ-ra-ên và ngoại kiều cư trú trong luật nghi lễ
  choice: Giữ nguyên công thức rộng rằng một luật pháp và một quy định áp dụng cho cả cộng đồng được nói đến và ngoại kiều cư ngụ với họ.
  alternative: Hiểu lời này chỉ giới hạn trong các quy định về tế lễ ở văn cảnh trực tiếp.
  rationale: Câu có lời lẽ khái quát nhưng nằm trong một phân đoạn luật cụ thể. Bản dịch không thu hẹp lời văn, cũng không mở rộng thành một chương trình thần học vượt quá văn cảnh.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. “Anh em” thể hiện ngôi thứ hai số nhiều hướng đến cộng đồng. Cấu trúc lặp “một... và một...” bảo toàn điểm nhấn của nguyên văn; dấu câu [a] được đặt ngay sau câu có từ cần chú thích.
