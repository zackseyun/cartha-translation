  yaml_path: translation/ot/numbers/015/018.yaml
  text: 'Speak to the sons of Israel and say to them: When you come into the land to which I am bringing you,[a]'
translation:
  language: vi
  text: '“Hãy nói với con cái Ít-ra-ên[a] và bảo họ: Khi các ngươi vào xứ mà Ta đang đưa các ngươi vào,”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hoặc “các con trai Ít-ra-ên.” Tiếng Hê-bơ-rơ viết sát chữ là “các con trai của Ít-ra-ên”; đây là cách gọi tập thể chỉ dân Ít-ra-ên.
    reason: Làm rõ hình thức sát chữ của בני ישראל, đồng thời giữ cách dịch tập thể tự nhiên trong thân văn.
lexical_decisions:
- source_word: דַּבֵּר
  choice: Hãy nói
  rationale: Mệnh lệnh Piel của דבר mở đầu lời chỉ thị Đức Chúa Trời truyền cho Môi-se chuyển đến dân; “hãy nói” trực tiếp, tự nhiên và trang trọng.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: con cái Ít-ra-ên
  rationale: Giữ hình ảnh gia tộc của nguyên ngữ nhưng dùng cách nói tiếng Việt bao quát và quen thuộc; trong công thức giao ước này, cụm từ chỉ toàn thể dân Ít-ra-ên.
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: và bảo họ
  rationale: Phản ánh công thức mệnh lệnh nối tiếp “hãy nói... và bảo họ,” đồng thời tránh sự lặp từ thiếu tự nhiên trong tiếng Việt.
- source_word: בְּבֹאֲכֶם
  choice: Khi các ngươi vào
  rationale: Danh động từ với בְּ mang nghĩa thời gian; với đích đến là một xứ, “vào” diễn đạt rõ việc tiến vào lãnh thổ.
- source_word: אֶל הָאָרֶץ
  choice: xứ
  rationale: “Xứ” là từ tự nhiên và trang trọng trong văn cảnh đất đai được ban cho dân, đồng thời kết hợp gọn với động từ “vào.”
- source_word: אֲשֶׁר אֲנִי מֵבִיא אֶתְכֶם שָׁמָּה
  choice: mà Ta đang đưa các ngươi đến đó
  rationale: Giữ cả sắc thái diễn tiến/hướng tới tương lai của phân từ מֵבִיא lẫn trạng từ chỉ nơi chốn שָׁמָּה (“đến đó”), thay vì lược bỏ yếu tố hồi chỉ của tiếng Hê-bơ-rơ.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ta” cho lời Đức Chúa Trời và “các ngươi” cho số nhiều, giúp biểu thị rõ sự phân biệt ngôi và số trong lời phán. Không thêm chú thích vì “con cái Ít-ra-ên” đã truyền đạt tự nhiên phạm vi tập thể của cụm Hê-bơ-rơ.
