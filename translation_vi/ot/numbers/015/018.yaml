    rationale: Tiếng Hê-bơ-rơ có trạng từ hồi chỉ שמה (“đến đó”), nhưng trong mệnh đề quan hệ tiếng Việt, “xứ mà Ta đang đưa các ngươi vào” chuyển tải đầy đủ động tác hướng vào đất và tự nhiên hơn.
