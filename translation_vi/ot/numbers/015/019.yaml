  text: וְ/הָיָ֕ה בַּ/אֲכָלְ/כֶ֖ם מִ/לֶּ֣חֶם הָ/אָ֑רֶץ תָּרִ֥ימוּ תְרוּמָ֖ה לַ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/019.yaml
  text: And when you eat from the bread of the land[a], you shall present a contribution to Yahweh.
translation:
  language: vi
  text: Khi anh em ăn bánh của xứ ấy, anh em phải dâng lên cho Yahweh một phần lễ vật.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “anh em phải dâng một lễ vật cho Yahweh.” Tiếng Hê-bơ-rơ nói sát là “nâng lên một phần dâng,” dùng ngôn ngữ lễ nghi về một phần được biệt riêng để dâng.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה בַּאֲכָלְכֶם
  choice: Khi anh em ăn
  rationale: Cấu trúc וְהָיָה với động từ nguyên mẫu có בְּ diễn tả hoàn cảnh trong tương lai; tiếng Việt tự nhiên dùng mệnh đề thời gian “Khi anh em ăn”.
- source_word: מִלֶּחֶם הָאָרֶץ
  choice: bánh từ sản vật của xứ ấy
  rationale: לֶחֶם có nghĩa trực tiếp là “bánh”, còn הָאָרֶץ trong ngữ cảnh chỉ xứ mà dân sẽ vào. Cụm “từ sản vật” làm rõ rằng bánh được làm từ hoa lợi của xứ, phù hợp ngữ cảnh kế tiếp mà không đồng nhất “bánh” với toàn bộ sản vật.
- source_word: תָּרִימוּ תְרוּמָה
  choice: phải dâng một phần lễ vật lên
  rationale: Hiphil רום kết hợp với תְרוּמָה là ngôn ngữ lễ nghi về việc lấy riêng và dâng một phần. “Dâng ... lên” giữ lại hình ảnh nâng lên trong tiếng Hê-bơ-rơ, còn “một phần lễ vật” diễn đạt tự nhiên tính chất phần đóng góp được biệt riêng.
- source_word: לַיהוָה
  choice: cho Yahweh
  rationale: Giới từ לְ chỉ đối tượng tiếp nhận hoặc sự biệt riêng; “cho” tự nhiên trong tiếng Việt. Danh riêng giao ước יהוה được phiên âm là “Yahweh”.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: CHÚA
  rationale: Giữ danh riêng giao ước có trong nguyên văn thay vì thay bằng một tước hiệu; cách này cũng phù hợp lớp tham khảo tiếng Anh đã được cập nhật.
- issue: Tính chất của תְרוּמָה
  choice: một phần lễ vật
  alternative: lễ vật dâng lên
  rationale: Cách chọn nhấn mạnh đây là phần được lấy riêng từ bánh/sản vật để dâng, nhưng không áp đặt một nghi thức chi tiết hơn điều câu văn nói.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Anh em” diễn đạt ngôi thứ hai số nhiều; “xứ ấy” nối với miền đất được nhắc đến trong ngữ cảnh. Dấu chú thích [a] được đặt ngay sau mệnh đề liên quan.
