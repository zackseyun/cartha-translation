  source_fidelity: 'Bản dịch giữ đúng cấu trúc thời gian, ngôi số nhiều, hành động dâng, và danh Yahweh. Tuy nhiên, “từ sản vật” là phần diễn giải thêm: מִלֶּחֶם הָאָרֶץ nói trực tiếp là “từ bánh của xứ/đất ấy,” không nêu từ “sản vật” trong chính câu này.'
  naturalness: “Dâng lên cho Yahweh một phần lễ vật” tự nhiên và rõ hơn trật tự “dâng một phần lễ vật lên cho Yahweh.” “Bánh của xứ ấy” vừa tự nhiên trong văn cảnh vừa bám sát nguyên văn.
