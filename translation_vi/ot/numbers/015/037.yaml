- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng cách gọi quen thuộc trong truyền thống Kinh Thánh tiếng Việt để thể hiện danh riêng giao ước YHWH, thay vì biến thành danh xưng chung.
- source_word: וַיֹּאמֶר
  choice: phán
