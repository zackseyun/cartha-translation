  choice: Đức Giê-hô-va
  alternative: CHÚA / Đức Chúa
  rationale: Bản nguồn có danh riêng יהוה; cách chọn này giữ sự phân biệt giữa danh ấy và các danh xưng chung, không thêm diễn giải giáo phái.
translation_notes:
