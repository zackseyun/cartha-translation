  text: một con dê đực làm lễ vật chuộc tội;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: con dê đực
  rationale: Cụm từ Hê-bơ-rơ chỉ một con dê giống đực trong bối cảnh tế lễ. “Con dê đực” là cách nói tự nhiên, rõ nghĩa trong tiếng Việt hiện đại và giữ được giới tính của con vật.
- source_word: אֶחָד
  choice: một
  rationale: Giữ nguyên số từ được nêu rõ trong bản Hê-bơ-rơ và phù hợp với lối liệt kê các lễ vật.
- source_word: לְחַטָּאת
  choice: làm lễ vật chuộc tội
  rationale: Trong ngữ cảnh tế lễ, חַטָּאת chỉ loại lễ vật liên quan đến tội lỗi, không đơn thuần là khái niệm “tội”. Cách dịch này tự nhiên trong tiếng Việt và không buộc phải giải quyết mọi sắc thái về chức năng thanh tẩy hay chuộc tội của lễ vật.
theological_decisions:
- issue: Ý nghĩa nghi lễ của חַטָּאת
  choice: lễ vật chuộc tội
  alternative: lễ vật thanh tẩy
  rationale: “Lễ vật chuộc tội” là thuật ngữ dễ hiểu và quen thuộc hơn đối với độc giả phổ thông; tuy nhiên, bản dịch không thêm lời giải thích thần học nhằm loại trừ sắc thái thanh tẩy vốn có thể hiện diện trong thuật ngữ Hê-bơ-rơ.
translation_notes:
  register: Văn phong trang trọng, gọn, theo dạng danh mục tế lễ. Dùng “làm” để diễn đạt tự nhiên chức năng của con vật trong lễ dâng; giữ dấu chấm phẩy vì câu này là một mục trong chuỗi liệt kê của phân đoạn.
