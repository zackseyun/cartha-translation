base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/030.yaml
  text: On the fourth day[b][a], the leader of the sons of Reuben was Elizur son of Shedeur.
translation:
  language: vi
  text: Ngày thứ tư, người lãnh đạo[a] của con cháu Ru-bên[b] là Ê-li-xua, con trai Sê-đê-ua.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “người đứng đầu” hoặc theo truyền thống là “thủ lĩnh”; từ Hê-bơ-rơ chỉ người chính thức đứng đầu một bộ tộc.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “đại diện cho con cháu Ru-bên”; giới từ Hê-bơ-rơ ở đây có thể chỉ sự thuộc về hoặc sự đại diện.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הָרְבִיעִי
  choice: Ngày thứ tư
  rationale: Cụm giới từ mang nghĩa thời gian trong danh sách tường thuật; cách diễn đạt này tự nhiên trong tiếng Việt và giữ đúng số thứ tự.
- source_word: נָשִׂיא
  choice: người lãnh đạo
  rationale: Từ này chỉ người đứng đầu chính thức của bộ tộc; “người lãnh đạo” rõ nghĩa trong tiếng Việt hiện đại và tránh sắc thái hoàng gia dễ gây nhầm của “hoàng tử”.
- source_word: לִבְנֵי רְאוּבֵן
  choice: của con cháu Ru-bên
  rationale: Giữ hình ảnh thân tộc-bộ tộc của nguyên văn; giới từ לְ ở đây có thể diễn tả sự thuộc về hoặc đại diện.
- source_word: אֱלִיצוּר
  choice: Ê-li-xua
  rationale: Phiên âm tên riêng Hê-bơ-rơ sang cách đọc tự nhiên trong tiếng Việt.
- source_word: בֶּן
  choice: con trai
  rationale: Cách diễn đạt rõ ràng của công thức phụ danh Hê-bơ-rơ.
- source_word: שְׁדֵיאוּר
  choice: Sê-đê-ua
  rationale: Phiên âm tên riêng Hê-bơ-rơ sang cách đọc tự nhiên trong tiếng Việt.
